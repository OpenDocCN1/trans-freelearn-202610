- pgno: 279
  md: '# 12


    # Advanced Query and Indexing Concepts


    There are many reasons why your queries might be *slow*, a subjective term that
    usually means *slower than you expected or needed it to be*. Many factors that
    can contribute to this include a lack of indexes, suboptimal indexes, insufficient
    hardware resources, using inefficient operations unnecessarily, or too many other
    competing operations for the same resources.


    In this chapter, we''ll look at some advanced concepts in query execution, covering
    how queries use indexes, how the query optimizer selects an index, ways to dig
    deeper using the explain command, and techniques to improve performance if there''s
    room for improvement. We will also introduce some special index types and collections
    that may be a good fit for your use case when regular indexing strategies seem
    to be inadequate. We will also describe other places where inefficiency may creep
    into your system and provide other tips for best performance.


    The topics covered in this chapter are as follows:


    +   - The query execution life cycle

    +   - The process of evaluating and analyzing explain output

    +   - Using log messages to detect, analyze, and diagnose the root causes of slow
    queries

    +   - Understanding MongoDB Query Language semantics and index use

    +   - Additional special collections, index types, and features that can enhance
    performance'
  merge: -1
  img_proc: true
- pgno: 280
  md: '# Understanding query execution


    It’s important to understand what happens when an operation is sent from the application
    to the database. There are many places where performance can be improved, and
    having a full understanding of what all the stages are makes it possible to reason
    correctly about where things are not as optimal as they could be and how to fix
    them.


    When a query is sent to the database engine, whether as part of a find, update,
    delete, or aggregate $match filter, several things happen. First, the query is
    parsed into a standardized form. Then, the query planner has to figure out whether
    there’s an index that can be used, and if there is more than one, then which one
    would be best. The initial batch of results is returned to the client. Then, if
    the client requests more results, the getMore command will return additional batches.


    Since there is some overhead in selecting the right index, MongoDB uses a process
    that ensures that once a plan is chosen for a particular query shape, it is stored
    in a plan cache for future use. A query shape is the query being run with the
    values ignored, so {x:5} and {x:25} are considered the same query shape. There
    is also a mechanism to ensure that if an index turns out not to be the best, it
    will get re-evaluated in case a better one is available.


    Figure 12.1 shows the complete query-planning process flow:'
  merge: -1
  img_proc: true
- pgno: 281
  md: '# Query Planner


    ![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_281_0.png)


    Figure 12.1: Query-planning process'
  merge: -1
  img_proc: true
- pgno: 282
  md: 'But you can think of this in a slightly simplified way: first, we ask, “Is
    there already a plan cached?” If yes, then use it; if not, then generate and evaluate
    candidate plans, choose the winning plan, and add it to the cache for future use.
    This is a slightly simplified flow description as it doesn’t take into account
    that the winning plan is first saved as inactive and then only activated after
    it’s confirmed to have good performance. But as a simplification, this is a good
    approximation.


    What are possible candidate plans for any particular query? We already know that
    if there is no eligible index, then the plan will be a full collection scan (COLLSCAN).
    If there is an index or multiple indexes available, then depending on the exact
    query requirements, they can be used in different ways. We will look at the different
    ways to use indexes in the next section.


    ![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_282_0.png)


    # Plan cache usage with single eligible index


    If there is only one plan available, for instance, there is only one eligible
    index, then it will not be stored in the plan cache. The plan cache is strictly
    for scenarios when multiple indexes can satisfy the query.


    Depending on the efficiency of the index, as well as whether it provides covering
    for the query and/or supports sort and query filters, a score will be assigned.
    The exact details of how plans are scored are beyond the scope of this book. However,
    as a general principle, the highest score would represent the most efficient plan
    during trial execution and become the tentative winner. This plan is then cached
    along with its score, at least until an inefficient execution of the same query
    shape using the plan ends up scoring significantly worse than the saved score,
    in which case, the cached plan is evicted from the plan cache. When this happens,
    the query is re-planned, meaning it goes through the plan evaluation stage again
    to try and find a better index to use.


    Planning is not independent of returning results to the client. The documents
    found while planning the query execution get returned to the client as the first
    batch of results.


    # Plan stages, or “how indexes can be used”


    Even though we’ve just been saying “queries use indexes,” it turns out there are
    multiple ways that indexes can be used. In a standard case of looking for a field
    in a document matching a single value in a B-tree, we traverse the B-tree and
    find the recordId of the matching leaf node. However, there are other ways indexes
    can be used in cases of queries that are not looking for documents but counts
    of documents. There are other optimizations in how the index is traversed when
    we are looking for the first distinct value across the full B-tree or a subsection
    of it. All of these have different internal names that you may see in the query
    plan summary in the logs, or in the explain output.'
  merge: -1
  img_proc: true
- pgno: 283
  md: "Here are the different **indexed** query plans and what they mean:\n\n+   -\
    \ **IXSCAN**: An index scan means we are traversing (usually a subset of) the\
    \ B-tree in some order\n+   - **IDHACK or EXPRESS_IXSCAN**: Special optimized\
    \ index scan for _id indexes or other unique indexes\n+   - **DISTINCT_SCAN**:\
    \ Special index scan to support finding all distinct values in the B-tree\n+ \
    \  - **COUNT_SCAN**: Special index scan to support only getting counts from a\
    \ subset of the B-tree\n\nIf there is no eligible index for the operation, then\
    \ the query plan will be COLLSCAN, meaning a full collection scan.\n\n> **Index\
    \ preference over COLLSCAN**\n> \n> If there is at least one eligible index for\
    \ a query, then COLLSCAN will not be selected unless forced by the user.\n\nEven\
    \ though the efficiency of the query plan is roughly in the increasing order of\
    \ this list, that’s not an absolute statement as it depends on the size of the\
    \ B-tree subset that the scan is examining (a COUNT_SCAN of the entire index will\
    \ likely be slower than an IXSCAN of a tiny portion of the index).\n\nThere are\
    \ other *stages* or steps you will see in the query planner output. Here is what\
    \ they mean:\n\n+   - **FETCH**: Full document had to be read and, optionally,\
    \ a filter applied to ensure it matches\n+   - **SHARD_FILTER**: Usually applied\
    \ last to ensure only documents owned by the shard are returned\n+   - **SORT**:\
    \ Indicates an in-memory sort of results\n+   - **SORT_MERGE**: Used to merge\
    \ multiple already-sorted streams of documents\n\nThere are a few other, more\
    \ obscure stages, but we won’t worry about them for now.\n\n> **Index-supported\
    \ sorts omit SORT stage**\n> \n> A sort that is supported by an index does *not*\
    \ have any SORT stage in the plan as there is no extra step required to return\
    \ sorted results."
  merge: -1
  img_proc: true
- pgno: 284
  md: 'The metrics and diagnostics that come out of query planning and execution show
    up in multiple places:


    +   - `explain output`

    +   - Logged messages for slow queries in the `mongod` and `mongos` logs

    +   - `system.profile` collection when you enable profiling

    +   - Dashboards in Atlas, such as Query Insights

    +   - `currentOp` command output


    These metrics include which plan was selected, how many index entries and documents
    were looked at, whether there was an in-memory sort, and several others that we''ll
    explore through examples later in the chapter.


    The most detailed and useful tools for debugging query planner performance will
    be the explain command.


    # Using the explain command


    We already touched on how to use the explain command to examine your query and
    aggregation execution. Now, let''s look in detail at how it runs and what it shows.
    Whenever we run any command with a query filter passed to it, we have the option
    to invoke explain by inserting it between the collection name and the command
    helper method in mongosh, as in the following example:


    ```

    db.collection.explain(<option>).find({<query>})

    ```


    The <option> to explain determines how verbose the output will be, and it can
    be one of the following:


    +   - "queryPlanner": The default value. Only runs the query optimizer and returns
    which query plan would be selected.

    +   - "executionStats": Runs the query optimizer, executes the chosen winning
    plan, and returns statistics describing the execution.

    +   - "allPlansExecution": The same as "executionStats" but in addition to returning
    statistics about executing the winning plan, it also returns statistics for the
    rejected plans captured during plan selection and evaluation.


    The output from the explain command includes multiple sections. The queryPlanner
    section is always present. If you use the executionStats or allPlansExecution
    option, you will see the very informative executionStats section.'
  merge: -1
  img_proc: true
- pgno: 285
  md: "# The queryPlanner section\n\nqueryPlanner section is where you see basic information\
    \ about the query, including how it was parsed into canonical or normalized form,\
    \ queryHash which is a shortcut way of identifying the same query shapes with\
    \ different values, planCacheKey of the plan will be present if the query plan\
    \ was in the cache, indication whether the query plan selection was influenced\
    \ by any special settings, the winningPlan, and rejected plans in the case when\
    \ there were additional plan options.\n\n# The executionStats section\n\nThe explain\
    \ command that actually ran the query will include the executionStats section,\
    \ where all the actual observed metrics during the run are captured. For the query\
    \ filter portion, it includes fields such as totalKeysExamined (number of index\
    \ keys looked at), totalDocsExamined (number of documents looked at), nReturned\
    \ (number of documents that would be returned to the client if explain was not\
    \ specified), and the same details for each execution stage that was observed.\n\
    \nFor in-memory sorts, the explain command includes a SORT section with information\
    \ about how much memory was used. This section appears when there’s no eligible\
    \ index to support getting data in sorted order. It also indicates whether the\
    \ data had to be spilled to disk and, if so, how much disk space was used to aid\
    \ the sort.\n\nIn the case of aggregations, explain also lists every stage after\
    \ the initial $cursor stage (which is responsible for fetching documents from\
    \ the collection to stream into the rest of the pipeline). It includes the number\
    \ of documents that were returned from each stage, as well as the cumulative time\
    \ taken by all the stages up to this one.\n\nHere is a portion of sample output\
    \ for an aggregation execution stats section listing stages:\n\n```\nstages: [\n\
    \  {\n    '$cursor': { queryPlanner: { executionStats: { ... } } }\n    nReturned:\
    \ Long('10805'),\n    executionTimeMillisEstimate: Long('21')\n  },\n  {\n   \
    \ '$set': { ... },\n    nReturned: Long('10805'),\n    executionTimeMillisEstimate:\
    \ Long('21')\n  },\n]\n```"
  merge: -1
  img_proc: true
- pgno: 286
  md: "```\n{\n  '$unwind': { ... },\n  nReturned: Long('14804'),\n  executionTimeMillisEstimate:\
    \ Long('22')\n},\n{\n  '$group': { ... },\n  maxAccumulatorMemoryUsageBytes: {\
    \ count: Long('1768') },\n  totalOutputDataSizeBytes: Long('3534'),\n  usedDisk:\
    \ false,\n  nReturned: Long('13'),\n  executionTimeMillisEstimate: Long('23')\n\
    },\n{\n  '$sort': { sortKey: { count: -1 } },\n  totalDataSizeSortedBytesEstimate:\
    \ Long('3638'),\n  usedDisk: false,\n  spills: Long('0'),\n  nReturned: Long('13'),\n\
    \  executionTimeMillisEstimate: Long('23')\n}\n```\n\nThe first stage is called\
