- pgno: 201
  md: 'If you suspect your change stream application is lagging behind actual database
    changes, this can result in delayed processing or stale data in downstream systems.
    To prevent this, consider the following methods:


    +   - Monitor network I/O on both the MongoDB primary node and your change stream
    service. Look for spikes in network utilization that correspond to periods of
    high database activity.

    +   - Consider the physical proximity of your application to the database. Ensure
    optimal network connectivity between your MongoDB cluster and your change stream
    application. This might involve co-locating them in the same data center or cloud
    region.

    +   - If possible, provision more network bandwidth for both the database server
    and the consumer application.

    +   - Consider processing events in batches rather than individually.


    Your application also needs enough compute resources to process events effectively.
    If it’s resource-constrained and it can’t keep up with the volume of changes,
    it will fall further and further behind before eventually falling off the oplog
    and receiving an error. Similarly, the MongoDB server must have adequate resources
    to generate and send change events. Monitor CPU, memory, and disk I/O on the system
    running your application. Look for high CPU usage, memory pressure, or I/O bottlenecks.
    Try to minimize expensive operations inside the change stream processing loop.
    On the database side, high CPU or I/O usage can indicate write bottlenecks. For
    example, heavy indexing can slow down writes, which in turn affects the speed
    at which the oplog is written, and consequently, change stream performance.


    If your change stream application frequently receives invalidate events, forcing
    it to close and reopen, this can be disruptive and lead to increased latency or
    missed events if not handled correctly. An invalidate event signifies that the
    collection or database being watched by the change stream no longer exists or
    has undergone a structural change (such as dropping or renaming) that prevents
    the stream from continuing.


    To troubleshoot, count the types of events your change stream receives. If you
    see invalidate events, identify the specific operation that triggered them. If
    possible, avoid dropping or renaming collections or databases that are actively
    being watched by change streams, especially in production environments, where
    continuous processing is critical. If these operations are necessary, ensure your
    change stream application is designed to gracefully handle invalidate events by
    re-establishing the stream.'
  merge: -1
  img_proc: true
- pgno: 202
  md: "# Special considerations for sharded deployments\n\nIn sharded clusters, change\
    \ streams require coordination across multiple shards while maintaining a consistent\
    \ global ordering of events. This introduces several unique performance considerations:\n\
    \n+   - **Global ordering overhead:** Maintaining consistent ordering across all\
    \ shards requires coordination. This is handled by mongos and adds load to that\
    \ infrastructure.\n+   - **Cold shard impact:** Shards with no write activity\
    \ still participate in change stream coordination.\n+   - **Geographical latency:**\
    \ Distributed shards introduce network latency in event delivery.\n+   - **Chunk\
    \ migration handling:** Changes during chunk migrations require special handling.\n\
    +   - **System-level performance:** If a sharded collection has high levels of\
    \ write activity, then mongos or the application server processing the stream\
    \ may not be able to keep up with changes across all shards.\n\nTo tune performance\
    \ in sharded environments, the following code configures two such parameters,\
    \ maxAwaitTimeMS and batchSize:\n\n```\n// MongoDB Node.js driver code snippet\n\
    // Configuring change streams for optimal performance in sharded clusters\nconst\
    \ shardedStreamOptions = {\n  fullDocument: 'updateLookup',\n  maxAwaitTimeMS:\
    \ 1000,  // Adjust based on latency requirements\n  batchSize: 100          //\
    \ Balance between throughput and processing time\n};\n\n// Use collection-level\
    \ streams where possible to reduce coordination overhead\nconst productStream\
    \ = db.collection('products').watch([],\nshardedStreamOptions);\n```\n\nThe batchSize\
    \ parameter sets the maximum number of documents that can be returned in each\
    \ batch of a change stream (up to a limit of 16 MB). It is similar to the batchSize\
    \ parameter on cursors. This often requires experimentation because if the batch\
    \ size is too large, the cursor may allocate more resources than needed; if too\
    \ small, it may lead to increased network round trips.\n\nThe maxAwaitTimeMS parameter\
    \ sets the maximum time in milliseconds that the server waits for new data changes\
    \ before returning an empty batch to the change stream cursor. It is analogous\
    \ to the maxAwaitTimeMS parameter on cursors."
  merge: -1
  img_proc: true
- pgno: 203
  md: 'Here are some recommended sharded cluster optimization techniques:


    +   - **Configure periodicNoopIntervalSecs appropriately** (default: 10 seconds)
    to **reduce latency** from cold- or low-write shards. These no-op operations ensure
    that oplog entries are regularly created, even when no real writes occur on the
    primary, allowing members of the shard to update their logical clocks and replication
    positions, thus reducing coordination traffic to colder shards.

    +   - **Target change streams at specific collections** whenever possible. This
    significantly reduces cross-shard communication overhead, especially for high-write
    collections.

    +   - **Apply server-side filtering using $match pipelines** for high-activity
    collections.

    +   - **Place change stream consumers geographically close** to your primary shards
    to minimize network latency.

    +   - **Monitor each shard’s oplog window independently** to detect potential
    issues that may impact change stream-based services.

    +   - **Limit the number of document-specific change streams.** For example, instead
    of creating hundreds of change streams to watch individual documents, create a
    single change stream and filter the relevant events in your application.


    In summary, running change streams efficiently in a sharded cluster requires careful
    attention to both the configuration and deployment strategy. By tuning parameters
    such as `batchSize` and `maxAwaitTimeMS`, targeting streams at specific collections,
    and reducing unnecessary coordination across shards, you can significantly improve
    performance and reliability. As with most distributed systems, continuous monitoring
    and iterative tuning are key to maintaining optimal behavior at scale.


    # Advanced patterns and production readiness


    Taking change streams to production requires understanding advanced options and
    monitoring needs. In this section, we’ll explore key considerations for production
    deployments, based on the official MongoDB documentation.


    # Transaction visibility and event batching


    When working with transactions in MongoDB, change streams follow specific visibility
    rules that affect event delivery. All changes made within a transaction only become
    visible to change streams after the transaction commits. At that point, all changes
    from that transaction appear at once as separate events in the stream while maintaining
    their logical order within the transaction.'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'This behavior ensures data consistency but requires your consumer applications
    to handle these bursts of events efficiently when large transactions are committed.
    Consider implementing batching and throttling mechanisms in your processing logic
    to handle these surges gracefully.


    # Document size limitations and collection life cycle


    Change stream response documents must adhere to MongoDB’s 16 MB BSON document
    limit. If you use options such as fullDocument: ''updateLookup'' (which performs
    a lookup to fetch the entire current state of a document after an update operation)
    or work with large documents, you might reach this limit, causing events to fail.
    For larger documents, in MongoDB 6.0.9+, consider using the $changeStreamSplitLargeEvent
    aggregation stage to split large change events into multiple smaller fragments
    that can be processed individually without exceeding size restrictions.


    When collections or databases are dropped or renamed while change streams are
    watching them, the change stream cursors will close when they reach that point
    in the oplog. After these invalidation events, you must use startAfter (not resumeAfter)
    with a valid resume token if you want to restart the stream.


    # Monitoring and health checks


    Production deployments should include comprehensive monitoring of several key
    metrics. For change streams, you may begin by tracking the active cursor count
    through the db.serverStatus().metrics.changeStream.currentOpen command. The change
    events could arrive a significant time after the change is made in the database.
    Additionally, monitor your event processing latency and throughput to ensure optimal
    performance. Resume token persistence metrics provide insight into your recovery
    capabilities, while the oplog window size (measurable via rs.printReplicationInfo())
    indicates how far back in time your historical operations extend.


    # Replica set considerations


    When using self-managed MongoDB, and for replica sets with arbiter members, be
    aware that change streams may remain idle if not enough data-bearing members are
    available to achieve a majority commit. For example, in a three-member replica
    set with two data-bearing nodes and an arbiter, if the secondary goes down, writes
    cannot be majority committed, and the change stream remains open but won’t send
    events.


    If you anticipate significant downtime of a service using change streams, for
    maintenance or disaster recovery, increase the oplog size to retain operations
    for longer than your estimated downtime period. This ensures your application
    can catch up with all changes once connectivity is restored.'
  merge: -1
