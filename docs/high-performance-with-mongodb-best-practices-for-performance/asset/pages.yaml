  md: "```\ntry {\n  // Perform operations within the transaction\n  await collection1.updateOne({\
    \ _id: 1 }, { $set: { status: \"active\" } }, { session });\n  await collection2.insertOne({\
    \ refId: 1, details: \"...\" }, { session });\n\n  // Commit the transaction\n\
    \  await session.commitTransaction();\n} catch (error) {\n  // If an error occurred,\
    \ abort the transaction\n  await session.abortTransaction();\n  throw error;\n\
    } finally {\n  // End the session\n  session.endSession();\n}\n```\n\nLet’s go\
    \ over each part to understand what’s happening:\n\n+   1. **Session creation:**\
    \ First, we create a new session with `client.startSession()`. A session is required\
    \ for all transactions in MongoDB.\n+   2. **Transaction initialization:** We\
    \ start a new transaction within the session using `session.startTransaction()`.\n\
    +   3. **Database operations:** Inside the try block, we perform multiple operations\
    \ (updating one collection and inserting into another). Each operation includes\
    \ the session object to associate it with our transaction.\n+   4. **Transaction\
    \ commit:** If all operations succeed, we commit the transaction with `session.commitTransaction()`,\
    \ which makes all changes visible.\n+   5. **Error handling:** If any error occurs\
    \ during the operations or commit, we catch it, abort the transaction with `session.abortTransaction()`,\
    \ and rethrow the error.\n+   6. **Cleanup:** The finally block ensures that regardless\
    \ of success or failure, we always end the session with `session.endSession()`\
    \ to release resources.\n\nUsing the Core API gives you full control, but it also\
    \ means you’re responsible for managing every detail of the transaction life cycle.\
    \ While powerful, this approach requires careful error handling and cleanup to\
    \ ensure reliability and consistency."
