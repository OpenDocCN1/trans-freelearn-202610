- "# 1 系统与 MongoDB 架构\n\n## 系统与 MongoDB 架构\n\n每个数据库部署都在一个更大的系统中运行，该系统包括网络、应用程序、硬件和用户。要有效地扩展或优化\
  \ MongoDB，我们必须以系统设计师的心态来对待它，而不是这些力量本身所特有的特征，而这种响应在现实世界中很少简单。 [1]\n\n我们在许多尺度上看到系统。我们的太阳系是行星的系统。地球有天气和气候系统，以及政治和社会系统，如国家和城市。城市包含机构系统，如大学，而大学又包含学术系统，如院系、教授和学生。工程学院有一个实验室系统，其中多台计算机通过桥梁和路由器组成的网络系统连接。每台计算机都是硬件和软件组件的系统，包括处理器、内存和应用程序。\n\
  \n城市中的商店是一个管理系统，例如计算机，并通过供应商和工厂进行库存补充流程的系统。城市之外，森林是一个生态系统，包含树木，每棵树都是根、枝和叶的系统。森林中的野猪具有生物系统，包括骨骼、神经、循环和消化系统。甚至野猪耳朵内的单个细胞也是一个系统，具有自己的内部子系统，如线粒体、细胞核和核糖体。\n\
  \n\n\n\n将所有这些不同系统统一起来的共同点是，它们的元素在系统内部相互作用，并与其他周围系统相互作用。\n\n系统的性能往往不是由最强或最快的元素决定的，而是由最薄弱的环节决定。这有时被称为\
  \ **瓶颈** 或 **限制因素**。这是系统中显著限制系统整体性能或增长的元素。瓶颈会随时间变化。如果修复了一个瓶颈，另一个元素就会成为瓶颈。请记住，对一般系统成立的一切，对软件系统也成立。在后面的章节中，我们将探讨典型的软件瓶颈以及你可以用来修复它们的策略。\n\
  \n## 系统的特征\n\n在本节中，我们将探讨在改变系统时可能遇到的潜在陷阱。我们将看到缓冲和延迟如何使理解系统的行为变得困难，以及变化如何导致意想不到的结果。\n\
  \n## 改变系统是一项风险业务\n\n系统的元素可以以非线性方式相互作用。例如，学校是一个系统，其元素包括学生、教室、操场和篮球架。系统的行为并不总是以可预测的方式出现，如下所述：\n\
  \n-   **小变化可能产生大影响（蝴蝶效应）**：一件微不足道的行为可能导致巨大且不可预测的后果。例如，一个学生在操场上开始奔跑。另一个学生开始追赶第一个学生。不久，越来越多的学生看到好玩就加入进来。突然间，半个操场都在玩捉迷藏。\n\
  -   **反馈循环（连锁反应）**：这是一个直接的、逐步的过程，其中一个事件导致另一个事件。在食堂里，一个学生讲了一个笑话。如果好笑，几个人就会笑。他们的笑声让食堂里其他人好奇，不久后，每个人都在笑，甚至那些没听见笑话的人。笑声以自我增强的方式传播。这被称为\
  \ **正反馈循环**。\n-   **整体大于部分之和（协同效应）**：系统可以产生比简单相加其组成部分更大的结果。在乐队练习期间，单一的鼓点听起来很简单。单一的长号音很酷。但当整个乐队一起演奏时，音乐听起来比单独声音的相加好得多。\n\
  -   **意想不到的结果（涌现）**：系统可以产生从个体部分看不出明显的结果。例如，在美术课上，学生把红色和黄色颜料混合得到橙色，这让他们感到惊讶。\n\n\
  非线性相互作用意味着小行动可能触发大变化，反馈循环可以放大其影响，元素可以以意想不到的方式协同工作，并产生新的结果。总的来说，人类很难理解系统不同元素之间的非线性相互作用，并且倾向于将行为视为一系列离散事件，这使得很容易忽略潜在的模式。\n\
  \n我们可以构建系统的模型并观察它们的行为。当然，现实世界总是比我们能构建的任何模型更复杂。系统的模型具有输入、存量、变量和反馈循环。图 1.1 显示了一个商店/库存系统的示例。\n\
  \n我们将使用此示例来解释存量、变量和反馈循环的概念。从左上角逆时针阅读，系统有交付的流入和销售的流出。商店中的产品存放在库存中，称为库存。\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_36_0.png)\n\
  \n图 1.1：显示商店库存管理的示例系统模型\n\n交付延迟和客户需求是调节产品流动的输入。B 表示平衡反馈循环。客户需求导致产品作为销售流出系统，减少库存。经理不想每天检查库存，因此存在感知延迟变量。延迟后，经理将感知到的销售与期望库存进行比较。经理不想对客户需求的变化过度反应，因此他们有一个响应延迟变量，限制向供应商订购的数量，供应商随后在延迟后交付更多产品。\n\
  \n该模型仅使用平衡反馈循环。另一种反馈循环是强化循环，通常会增加存量的规模。例如，在银行储蓄账户中，账户中的钱越多，你赚取的利息就越多，进而增加账户中的金额。\n\
  \n## 无延迟的系统很简单\n\n假设经理希望库存保持 10 天的需求量，每天需求为 200 件。这意味着期望库存为 2,000。第 10 天，需求增加 10%。客户现在每天购买\
  \ 220 件。经理增加订单数量，更多库存于当天交付。期望库存上升至 2,200。\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_37_0.png)\n\
  \n*图 1.2：在无延迟的简单系统中随时间的行为*\n\n当系统中没有延迟时，可以立即对需求变化做出调整，使系统的行为变得直接且可预测。\n\n## 存在延迟的系统可能表现出意想不到的行为\n\
  \n在复杂系统中，采取行动和看到其效果之间通常存在延迟，正如 Donella Meadows 所描述的那样：\n\n> 由于复杂系统中的反馈延迟，问题变得明显时，可能已经不必要地难以解决。[1]\n\
  \n例如，如果库存订单需要几天才能到达，需求的突然增加可能无法及时解决。这种滞后可能导致过度修正或短缺，造成不稳定。理解和管理这些延迟对于保持系统平稳运行至关重要。\n\
  \n现在，让我们添加一些延迟：\n\n-   **感知延迟：** 在更改订单之前，经理将销售额在 5 天期间取平均值\n-   **响应延迟：** 经理在更改订单时弥补\
  \ 40% 的库存短缺\n-   **交付延迟：** 工厂需要 5 天交付订单\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_38_0.png)\n\
  \n*图 1.3：由于订单调整延迟，需求上升后库存水平振荡*\n\n如图 1.3 所示，第 10 天后，需求首先增加 10%，我们看到库存水平开始下降。然后，5\
  \ 天后，经理调整订单以弥补 40% 的短缺。增加的交付开始到达，第 20 天，库存等于期望库存。然而，增加的交付仍在继续，到第 25 天，商店出现超库存。经理减少订单。循环继续，库存在缺货和超库存之间振荡。\n\
  \n## 尝试修复振荡\n\n这里有三种你可以尝试修复这种不想要行为的选项：\n\n-   更快的感知（减少延迟）\n-   更快的响应（增加订单）\n-  \
  \ 更慢的响应（减少订单）\n\n闭上眼睛一分钟，决定你会先尝试哪一个选项。我们将检查每个选项的结果。\n\n首先，我们将感知延迟从五天减少到两天，如图 1.4\
  \ 所示。\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_39_0.png)\n\n图 1.4：将感知延迟从五天减少到两天以实现更快响应\n\
  \n因此，经理更早做出反应，期望库存更快上升到 2,200，但如果有的话，振荡开始得稍早一些，而且略高。60 天标记前峰值库存现在为 2,994 件。更改感知延迟前为\
  \ 2,981 件。\n\n接下来，我们将尝试更快响应，通过更改订单以弥补 60% 的短缺，原本为 40%。如你所见，图 1.5 中行为变得更糟。振荡变得更大，峰值库存甚至更高达到\
  \ 3,800，某些天会跌至 1,400。\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_40_0.png)\n\n\
  图 1.5：减少响应延迟——库存波动变大\n\n最后，我们将尝试更慢的响应，将响应延迟（订单的变化）从之前的 60% 降低到 25%，如上一个示例所示。\n\n\
  \n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_41_0.png)\n\n*图 1.6：较慢的订单变化减少库存振荡*\n\
  \n如图 1.6 所示，系统的行为现在好多了。库存仍然会振荡，但在需求变化后大约 20 天左右开始趋于接近期望库存。\n\n## 系统会让我们感到惊讶\n\n\
  系统可能会以违反直觉的方式做出反应。在这个相对简单的系统中，商店经理的反应过于迅速。我们自然的倾向是更快地感知和响应，但这使得系统表现更糟。只有当我们尝试了一些看似违反直觉的做法（较慢的响应）时，系统的行为才得到改善。这对软件系统也同样适用，我们将在本章后面看到一些实际例子。改变某些变量可能会对整体行为产生重大影响，但其他变量可能几乎没有影响或没有影响。在这些例子中，我们看到感知延迟影响很小，但响应延迟却有影响。\n\
  \n真实系统总是比模型更复杂，可能存在隐藏变量或反馈回路。这个系统相对简单。更复杂的系统可能拥有多个存量和更多的反馈回路。系统本质上是振荡的。系统行为表现为随时间推移的一系列事件。我们人类的大脑不擅长理解非线性增长以及元素之间的相互作用。我们会假设当前瓶颈是什么，并尝试改进系统中的某些元素，除非限制因素得到改善，否则这些改进不会提升性能。\n\
  \n## 一个典型的软件系统\n\n现在，让我们将我们对系统总体所讨论的内容应用到软件系统上。我们将从高层次来看一个典型的软件系统，如图 1.7 所示，并描述一些潜在的瓶颈。\n\
  \n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_42_0.png)\n\n*图 1.7：软件系统的高层次视图，显示客户端到数据库的请求流程*\n\
  \n从左到右看，我们看到两个客户端。它们可能是台式电脑和移动设备。这些客户端通过互联网连接到应用程序编程接口（API）网关，后者发送请求并接收通知。API 网关连接到多个应用服务器。它们修改、路由并将客户端请求转发给在这些应用服务器上运行的一个或多个软件组件。每个应用服务器可以有多个使用一个或多个框架（FW）（如\
  \ Spring 或 Rails）的软件组件。这些通常包含数据服务抽象或对象建模组件，它们使用数据库特定的驱动程序（有时称为客户端库）与数据服务通信。\n\n\
  这些组件中的任何一个（它们运行的计算机或连接它们的网络）都可能成为整体应用性能或可扩展性的瓶颈。\n\n以下是软件系统中性能瓶颈的两个示例：\n\n- **API\
  \ 网关瓶颈：** 随着系统变得流行，更多用户连接到 API 网关，API 会达到一个点，即处理如此多的连接和请求以至于 CPU 被完全利用。这可以通过查看运行\
  \ API 网关的计算机上可用的空闲 CPU 来识别。这可以通过垂直扩展运行 API 网关的计算机或云实例来解决。\n\n- **框架瓶颈：** 应用程序软件可能会向框架发送看似简单的请求，但这些请求在内部可能会触发昂贵的数据库操作，例如对数据库进行全集合或表扫描。这种低效的查询会使用数据库的\
  \ CPU 和存储带宽，同时也会将不必要的数据发送回应用服务器。因此，会使用不必要的网络带宽，并且应用服务器需要额外的 CPU 资源来处理数据。\n\n这种后者的瓶颈可以通过多种方式识别：\n\
  \n- 对应用程序进行分析可能会发现，框架的请求花费了意想不到的时间。\n- 在开发过程中，可以使用端到端跟踪来追踪用户请求从客户端经过应用程序代码、框架和数据服务抽象，以查看在数据服务上运行了何种查询以及随后的\
  \ **输入/输出 (I/O)** 操作。\n- 这可以识别读取或写入放大，即小的客户端请求导致不成比例的大型数据库操作。例如，客户端查询一个 32 字节的数据点可能会经过整个系统并导致数据库表扫描，从而无缘无故地通过\
  \ I/O 和缓存拉取 32 GB 的数据。这可以通过配置框架使其更高效来解决。\n\n我们将在整本书中提供这些类型瓶颈和解决方案的具体示例，最终在 *第 15\
  \ 章，调试性能问题* 中汇总多个具体案例研究。\n\n识别潜在瓶颈只是优化软件系统的第一步。为了消除这些瓶颈，我们需要一种结构化的方法，应用性能工程原则。\n\
  \n性能工程原则涵盖从算法理论到 Little 定律的范围。通过应用这些原则，开发人员可以最小化瓶颈、提高可扩展性并最大化资源效率。在接下来的小节中，我们将探讨其中一些原则，并了解它们如何指导高性能系统的设计，您在阅读本书时可以牢记这些原则。\n\
  \n## 算法效率（复杂度）\n\n算法和数据结构的选择通常是大多数计算机科学课程首次介绍性能的地方。随着输入规模线性或对数增长的算法，其性能会优于指数增长的算法。任何微优化都无法弥补本质上缓慢的算法。在现代系统中，这可能意味着使用内置库（通常以\
  \ C 或汇编优化）或利用并行算法。\n\n## 避免过早优化\n\n正如俗话所说：“先让它工作，然后再让它变快。”换句话说，在担心性能之前，专注于构建正确可靠的系统。\n\
  \n计算机科学家 Donald Knuth 也表达了这一观点，他曾著名地警告说“过早优化是一切邪恶的根源”。开发人员经常错误猜测是什么拖慢了他们的系统；分析工具经常在意想不到的地方发现性能瓶颈。现代处理器也可以以违背人类直觉的方式执行编译代码。\n\
  \n通过抵制过早优化的冲动，您可以保持代码的整洁和可维护性。您还可以确保您的性能工作基于真实数据，而非假设。\n\n## 阿姆达尔定律（并行加速的极限）\n\n\
  阿姆达尔定律解释了为什么某些工作负载不会随着核心数量增加而成比例加速。如果程序的一部分 S 必须顺序运行，例如为了保护共享数据结构，那么即使拥有无限处理器，加速也限制在\
  \ 1/S。例如，如果任务的 10% 是串行的，那么在最佳情况下整体加速接近 10 倍（假设其他 90% 在多个处理器上运行）。在使用多核处理器和分布式计算时，必须识别并减少工作负载的串行部分。\n\
  \n## 局部性和缓存\n\n程序通常在短时间内反复访问相对较小部分的数据或代码。可以使用缓存来加速频繁使用的数据访问。系统在各个层级使用缓存：用于数据库结果的内存缓存，以及\
  \ CPU 缓存，通过存储昂贵操作的結果并重用它们来避免重新计算或缓慢访问。然而，缓存会引入复杂性，例如陈旧数据和内存开销。这就是为什么在以下笑话中提到它：\n\
  \n> 计算机科学中有 2 个难题：缓存失效、命名事物，以及差一错误。\n> \n> Leon Bambrick\n\n\n\n讽刺的是，现在对这个笑话也有了反驳：\n\
  \n> 计算机科学中有 2 个难题：我们只有一个笑话，而且它不好笑。\n> \n> *Phillip Scott Bowden*\n\n使用缓存（例如在 I/O\
  \ 操作中）对于从慢速设备获得良好性能至关重要，但它也适用于分布式系统的其他层。\n\n## 小定律（吞吐量与延迟）\n\n性能是多维度的。有时目标是处理大量操作（吞吐量），而其他时候，优先事项是最小化单个操作从开始到完成之间的延迟（延迟）。在许多情况下，两者同等重要。\n\
  \n你可以增加并发来提高吞吐量（例如使用多线程、异步 I/O 或非阻塞事件循环）。然而，这些技术可能会引入影响延迟的排队延迟。并发操作过多可能会使系统进入低效状态。重要的是首先确定你的性能目标，然后据此进行优化。对于高吞吐量，使用并发最大化资源利用率（CPU、网络和磁盘）。对于低延迟，最小化等待和处理深度。平衡两者是一门艺术，需要在分析和基准测试的指导下进行。\n\
  \n总之，性能工程应以数据为驱动，使用分析器和监控工具来识别瓶颈。它应同时借鉴经典见解（如算法复杂度和阿姆达尔定律）和现代技术（如并行计算、向量化和分布式负载均衡）。将优化工作集中在收益最大的地方，并始终通过测量验证影响。\n\
  \n## 了解 MongoDB 架构\n\n现在你已经了解了系统概览，是时候开始具体了解 MongoDB 系统了。在此之前，让我们先从高层次来看一下 MongoDB\
  \ 架构。我们将在全书中深入探讨这些组件的每一个。\n\n首先，了解 MongoDB 的基础非常重要。MongoDB 的创建是为了弥合传统关系数据库和简单键值存储之间的差距。核心思想是将两者的最佳特性（灵活性、速度和易于理解的数据模型）结合起来，同时提供强大的查询、索引和复杂聚合等功能。此外，从早期开始，MongoDB\
  \ 就为多种语言提供了原生库、内置复制、通过分片实现水平扩展，以及直观的文档数据模型。\n\n键值存储通常因其速度和简单性而受到赞扬。然而，MongoDB 超越了这种简单方法，允许你存储和查询具有丰富关系和结构的整个文档（对象）。另一方面，关系数据库将数据组织成具有预定义列和关系的表，并强制执行严格的模式。\n\
  \n在下一节中，我们将更仔细地查看 MongoDB 文档模型以及它与关系数据库的不同之处。\n\n## 文档模型：MongoDB 的基础\n\n在关系数据库中，数据通常规范化为单独的表以支持各种用例。这可能需要复杂的连接来生成特定于应用程序的视图。相比之下，MongoDB\
  \ 鼓励你将数据建模为特定于应用程序的文档，针对应用程序的访问和使用方式进行优化。这种灵活性允许在单个文档中表示复杂的关系和分层数据。\n\nJavaScript\
  \ 对象表示法（JSON）是一种轻量级、人类可读的数据格式，用于在应用程序之间存储和交换数据。MongoDB 的文档模型将数据存储在称为二进制 JSON（BSON）的类似\
  \ JSON 的结构中。\n\n这里有一个文档的示例：\n\n```\n### A simple document representing a user\n\
  user = {\n  \"name\": \"Jane Doe\",\n  \"age\": 30,\n  \"email\": \"janedoe@example.com\"\
  ,\n  \"address\": {\n    \"street\": \"123 Main St\",\n    \"city\": \"Anytown\"\
  ,\n    \"state\": \"CA\",\n    \"zip\": \"12345\"\n  },\n  \"interests\": [\"hiking\"\
  , \"photography\", \"travel\"]\n}\n```\n\n这包含有关用户的多个属性。在关系数据库中，用户的兴趣将存储在单独的表中，每当你需要将用户的兴趣与其他用户信息一起使用时，都必须单独查询或进行连接。从性能角度来看，在\
  \ MongoDB 中，兴趣数组与用户信息一起存储，因此所有用户信息可以在一次访问中从存储中读取，并在一次查询中接收到应用程序中。此外，兴趣可以被索引，以便可以简单快速地查询所有对徒步感兴趣的用户，例如。\n\
  \n你是否曾尝试在关系数据库中建模分层数据？如果你尝试过，你会知道这通常感觉就像试图把方 peg 塞进圆孔。在 MongoDB 中，嵌套结构是自然契合的，无需复杂的连接或实体关系图。\n\
  \n## MongoDB 的关键架构组件\n\nMongoDB 服务器使用单个 mongod 进程，可以在任何地方运行。你可以将 mongod 进程部署在许多类型的计算机上，包括笔记本电脑、企业内部数据中心内的自管服务器、企业管理的云实例以及由\
  \ MongoDB Atlas 管理的云实例。\n\n我们将讨论的许多概念适用于此服务器进程；然而，它也是 MongoDB 分布式系统的构建块。生产中的基本部署通常至少是一个由三台计算机组成的\
  \ **副本集**，每台计算机运行一个 mongod 进程。其中一台是主节点，另外两台是次要节点。副本集的所有成员都拥有相同的数据副本。你将在 *第 5 章，复制*\
  \ 中了解更多关于此的内容，但最重要的是要知道复制通过监控所有成员的健康状况，并在旧主节点出现故障时自动选举新的主节点，为你的应用程序提供高可用性。\n\n当你水平扩展\
  \ MongoDB 时，你会将副本集视为第一个 **分片**，然后根据需要添加尽可能多的额外分片。每个分片都是一个副本集。每个分片保存数据的一个子集，而智能的\
  \ **路由器** 进程将操作定向到正确的分片，从而消除了应用程序需要知道数据如何分布的需求。你将在 *第 6 章，分片* 中了解更多关于此的内容。\n\nAtlas\
  \ 是一套集成的云数据库和数据服务套件，用于加速和简化你使用数据构建的方式。Atlas 扩展了 MongoDB 的灵活性和易用性，使你能够构建全文搜索、实时分析和事件驱动功能。\n\
  \nMongoDB 客户端库（或驱动程序）允许你的应用程序代码使用原生库和看起来像你所使用语言中任何其他 API 的 API 与数据库通信。你在首选编程语言中构造请求，驱动程序将其转换为\
  \ MongoDB 理解的消息。\n\nMongoDB 为大多数流行的编程语言提供官方驱动程序，包括 Python、Java、C# 和 Node.js 等。你可以在\
  \ MongoDB 文档 https://www.mongodb.com/docs/drivers/ 中找到完整列表。\n\n下面是一个使用 PyMongo，即\
  \ Python 的官方 MongoDB 驱动程序，连接到 MongoDB 并插入文档的简单示例：\n\n```\nfrom pymongo import MongoClient\n\
  \n### Connect to MongoDB\nclient = MongoClient('mongodb://localhost:27017/');\n\
  db = client['store_database'];\ncollection = db['products'];\n\n### Define a product\
  \ document with nested information\nproduct = {\n    \"name\": \"Ergonomic Keyboard\"\
  ,\n    \"price\": 129.99,\n    \"category\": \"Computer Accessories\",\n    \"details\"\
  : {\n        \"weight\": 1.2,\n        \"dimensions\": \"18 x 6 x 1 inches\"\n \
  \   },\n};\n\n### Insert the document\ncollection.insert_one(product);\n```\n\n\
  你在前面的代码中看不到的是客户端库所做的一切繁重工作：管理连接、将 MongoDB 线路协议与服务器通信、处理网络超时、实现重试逻辑，以及将 Python 字典转换为\
  \ BSON 并返回。\n\n以下代码查询 products 集合中价格便宜的产品（少于 $100）：\n\n```\n### Find affordable\
  \ products\naffordable_products = collection.find({'price': {'$lt': 100}});\nfor\
  \ product in affordable_products:\n    print(f\"Found affordable product: {product['name']}\"\
  );\n```\n\n当 MongoDB 返回文档时，它会作为你语言中的原生数据结构到达，在本例中是 Python 字典。无需 awkward 转换。这种应用程序代码与数据库表示之间的自然映射对于开发人员生产力来说是一个显著优势。\n\
  \n\n\n## 数据服务系统\n\n现在让我们聚焦于我们在图 1.7 中之前看到的整体软件系统中数据服务部分。\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_50_0.png)\n\
  \n*表示多个实例\n\n图 1.8：显示核心数据库组件之间连接的 MongoDB 架构\n\n从左到右看图 1.8，我们看到应用程序服务器通过驱动程序或客户端库与数据服务进行通信。在此案例中，我们展示的是一个分片集群。对于更简单的部署，应用程序服务器可以不使用\
  \ mongos 和配置服务器而连接到单个副本集。诸如模式、查询和索引之类的概念元素在应用程序服务器和数据服务层之间共享。一些性能和可扩展性问题可能由这些概念元素引起，改变它们可能是改进的来源。\n\
  \n在此案例中，我们查看的是 Atlas 部署的图表，其中包括元素如 Atlas UI（包含监控和备份）、Atlas 控制平面、图表以及诸如向量和语义搜索以及数据联合等功能。\n\
  \n其余组件被视为 **核心** 数据库，具体如下：\n\n- **mongod**：单个服务器进程。Atlas 可以在副本集（用于高可用性）和分片（用于水平扩展）中部署多个\
  \ mongod 进程。\n- **mongos**：分片集群的路由器进程。它将查询路由到一个或多个分片，并将来自多个分片的结果合并为响应。\n- **config**：存储分片集群元数据的特殊内部数据库。元数据反映了分片集群内所有数据的状态和组织。mongos\
  \ 使用此元数据将读写操作路由到正确的分片。它还维护此数据的缓存。\n\n最后，在 *图 1.8* 中，mongod 进程将通过存储子系统保存和检索数据。这可能是自托管\
  \ MongoDB 系统中的磁盘或云存储，例如以下：\n\n- **Elastic Block Storage (EBS)** 在 AWS 和阿里云中\n- **Managed\
  \ Disks** 在 Azure 中\n- **Persistent Disks (PD)** 在 GCP 中\n- 本地连接的临时 SSD\n\n使用 Atlas\
  \ 时，我们将整体数据服务系统呈现为一个黑盒子，只有少量设置需要您考虑。Atlas 会为您处理细节。从 Atlas 角度来看，设置如下：\n\n- 分片数量和副本集成员数量。\n\
  - 实例大小，决定了 **虚拟中央处理单元**（**vCPUs**）的数量、内存量和网络性能。\n- 存储配置，包括设备的大小和吞吐量。吞吐量通常定义为 **每秒输入/输出操作数\
  \ (IOPS)**。\n\n如果您在自己的云或物理服务器上自行管理 MongoDB，您可以看到 mongod 进程运行的服务器和软件内部的许多组件设置。这是一把双刃剑。您可以调整更多设置来提高性能。然而，您也有更多元素需要管理以及潜在的瓶颈需要探索。\n\
  \n现在，如果我们放大到 mongod，我们会发现它本身就是一个具有多个元素的系统。以下图表（图 1.9）显示了 MongoDB 服务器（mongod）内部的主要元素：\n\
  \n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_52_0.png)\n\n*图 1.9：MongoDB 服务器内部的元素*\n\
  \n## 查询引擎\n\nMongoDB 的查询引擎接收您的查询，确定查找所需数据的最有效方式，并返回结果。它使用索引来优化查询执行，并将请求传递给存储引擎以执行操作。\n\
  \n索引就像书后面的目录。无需阅读书籍的每一页来查找主题，您可以使用目录直接查明包含该主题的页码。同样，在数据库中，索引有助于查询引擎更高效地定位数据。\n\n\
  MongoDB 提供的功能远不止键值存储。MongoDB 的查询和索引功能可与传统关系数据库相媲美（在某些方面甚至超越）：\n\n- 您可以在任何字段上查询，而不仅仅是主键\n\
  - 您可以执行复杂的逻辑操作\n- 您可以在嵌套文档和数组内部查询\n- 您可以聚合和分析数据\n- 您可以在任何字段组合上创建索引，包括数组和子文档\n- 您可以向文档集合添加多个索引\n\
  \n索引使查询更高效。与性能的许多方面一样，索引也有成本。当创建/插入新文档时，每个索引都需要额外的写入操作到存储。同样，更新文档的索引字段时，需要额外的写入来更新索引。\n\
  \n您可以让查询系统提供 **解释计划**，其中提供查询运行的详细信息。这可以为查找潜在瓶颈和产生改进想法提供有价值的信息。\n\n我们将在 *第 3 章，索引*\
  \ 和 *第 12 章，高级查询和索引概念* 中更详细地介绍索引和查询。\n\n## 存储引擎/WiredTiger\n\n每个 mongod 进程需要在磁盘上存储数据。存储引擎是\
  \ MongoDB 的文件系统；它是负责管理数据如何在磁盘上存储、检索和维护的组件。自 MongoDB 3.2 以来，WiredTiger 一直是默认存储引擎。\n\
  \n存储引擎负责将数据和索引持久化到磁盘，从磁盘获取数据，以及处理磁盘上数据的压缩和加密。它还处理许多数据库中称为 **预写日志** 的日志。存储引擎还包含最近访问文档的内存缓存。您可以使用\
  \ wiredTigerCacheSizeGB 设置更改 WiredTiger 缓存的大小。剩余内存将由操作系统的文件系统（页面）缓存使用。您将在 *第 7 章，存储引擎*\
  \ 中了解更多关于存储引擎的信息。\n\n## 库\n\n在开发 MongoDB 时，我们使用了许多其他构建块和库。这些也有可以更改以提高性能的设置。\n\n\
  从 MongoDB Server 8.0 开始，内存分配器（TCMalloc）的新版本支持每 CPU 缓存，而不是每线程缓存。这可以减少内存碎片并使数据库对高压力工作负载更具弹性。使用每\
  \ CPU 缓存可能需要修改一些系统配置设置。您可以在 *第 13 章，操作系统和系统资源* 中找到有关系统设置的更多详细信息。如果您真的知道自己在做什么，您可以更改诸如逻辑页面大小之类的控制，但这可能需要更改\
  \ MongoDB 源代码中的设置并重新构建服务器。再次说明，Atlas 提供默认值并实施最佳实践。\n\n压缩算法更易于访问。您可以在创建集合时或通过启动服务器时的配置选项指定要使用的存储压缩算法。默认情况下，Atlas\
  \ 使用一种名为 **Snappy** 的算法。运行自托管 MongoDB 时，您有四种压缩器选项：\n\n- 无\n- **Snappy**：最快，CPU 消耗最低；压缩数据不如其他算法多\n\
  - **Zstd**：Snappy 和 Zlib 之间的中间选择\n- **Zlib**：最慢，CPU 消耗最高；压缩数据更好\n\n您还可以在驱动程序和 MongoDB\
  \ 服务器之间使用网络压缩。在这种情况下，您可以通过应用程序代码中的驱动程序选择压缩算法，无论服务器是否在 Atlas 上。\n\nMongoDB 使用 OpenSSL\
  \ 处理以下操作的 TLS/SSL 加密：\n\n- 客户端-服务器连接（例如，mongod → MongoDB Shell）\n- 复制和分片集群通信\n-\
  \ MongoDB 驱动程序连接到数据库\n\n不同版本的 OpenSSL 在更高级别的实例/服务器上具有不同的性能特征和可扩展性。\n\n## mongod\
  \ 使用的其他系统组件\n\nMongoDB 在操作系统内运行，而操作系统又由内核管理。在 Linux 等操作系统中，vm.dirty_ratio 和 vm.dirty_writeback_centisecs\
  \ 等参数可调整内核管理虚拟内存的机制。它们改变了数据在从内存写入磁盘之前的处理方式。\n\nMongoDB 可以在 **虚拟机 (VMs)** 内部运行。然而，您需要确保从\
  \ VM 角度正确配置它。例如，过度分配 vCPU 可能导致同一主机上运行的 VM 之间出现 CPU 竞争，从而降低性能。您可以在 https://www.mongodb.com/docs/manual/administration/production-notes/\
  \ 的 MongoDB 服务器生产说明中了解有关气球等概念以及如何为 VM 配置 MongoDB 的更多信息。\n\nMongoDB 在具有不同内存量的网络系统中运行在许多类型的\
  \ CPU 上。这些通常取决于您部署 MongoDB 的云实例大小或计算机服务器。通常，更大的实例或服务器将具有更多 CPU、内存和更高的网络带宽。\n\n\n\
  \n正如我们之前所见，使用 Atlas 时，您可以选择不同类型和配置的云存储。在运行自己的云实例或自托管存储时，您通常也有相同的选项。此外，您可以选择不同的文件系统和设置，例如预读。当程序读取文件时，Linux\
  \ 会预测未来的读取并将额外数据加载到内存中。这减少了磁盘访问操作的次数，使顺序读取更快。这将在第 13 章，操作系统和系统资源中更详细地讨论。\n\n## 在现代数据平台中管理复杂性\n\
  \n让我们从单个 mongod 进程退一步，再次查看数据服务层。对您的应用程序而言，数据服务元素是一个组件，但实际上，它本身可以是一个复杂且独立的分布式系统，包含多个独立服务器。\n\
  \nMongoDB 的方法是提供一个数据服务 API，使用三个关键原则简化这种复杂性：灵活的数据模型、内置冗余和弹性，以及水平扩展。\n\n## 具有严格功能灵活的数据模型\n\
  \n文档模型允许您自然地表示关系，同时在需要时仍支持严格的数据治理。一位 MongoDB 用户完美地解释了这一点：“我们可以将更新推送到应用程序，而无需协调复杂的数据库迁移。模式随着我们的代码演进，而不是与其对抗。”您可以在第\
  \ 2 章，性能的模式设计中了解有关此灵活数据模型的更多信息。\n\n## 内置冗余和弹性\n\nMongoDB 并未将高可用性视为附加功能，而是通过复制将其弹性融入核心架构：\n\
  \n- **自动故障转移：** 如果主节点失败，选举会在几秒钟内确定新的主节点\n- **自愈：** 当失败的节点恢复时，它们会自动追赶并重新加入副本集\n\n\
  同样，Atlas 提供了默认值，实施最佳实践，并简化了您需要考虑的设置数量。在自托管 MongoDB 时，您可以深入研究复制设置。例如，如果在自己的服务器上运行\
  \ MongoDB，您可以更改服务器参数以调整复制数据的批处理方式。更大的批次可减少网络流量和在从节点上所需 IOPS 的数量，但会增加写入的延迟。您还可以配置\
  \ **流控**，如果从节点落后，它可以通过减慢写入速度来防止复制滞后。您可以在第 5 章，复制中了解有关复制的更多信息。\n\n## 具有智能分布的水平扩展\n\
  \nMongoDB 的分片功能可在保持相关数据在一起的同时，将数据分布到多个副本集：\n\n- **自动平衡：** 随着数据增长，MongoDB 会持续在分片之间重新平衡数据\n\
  - **查询路由：** MongoDB 路由器（mongos）会智能地将操作定向到适当的分片\n- **区域分片：** 您可以将数据分布与基础设施对齐（例如，将欧洲客户数据保留在欧洲服务器中）\n\
  \nMongoDB Atlas 通过自动化关键流程、实现最佳实践并提供内置功能来确保最佳性能，从而简化分片。您可以在 *第 6 章，分片* 中阅读更多相关内容。\n\
  \n## 性能工具\n\n您可以使用性能监控工具来帮助查找潜在的瓶颈或限制因素。这些可能存在于我们之前提到的任何组件或元素中。更多细节将在 *第 14 章，监控和可观测性*\
  \ 中提供。\n\nmongod 和 mongos 进程会写入包含性能信息的日志文件。它们还支持 serverStatus 命令，该命令返回有关正在运行进程的信息。查询引擎可以“解释”查询的运行方式，并支持分析器功能。提供了命令行工具，例如\
  \ mongostat 和 mongotop，用于监控正在运行的 mongod 进程。\n\n要监控各种系统资源的利用率，您可以使用操作系统命令、MongoDB\
  \ Atlas 监控以及专门为监控多台服务器而设计的其他 GUI 工具。\n\n对于系统资源 specifically，Linux 命令例如 top、vmstat、iostat\
  \ 和 netstat 可用于在单台服务器上某一时刻监控 CPU、内存、存储和网络。诸如 dstat 和 sar 之类的工具可用于组合来自更简单工具的数据并在一段时间内查看。\n\
  \nMongoDB Atlas 监控提供历史和实时系统资源数据，该数据与数据库特定指标集成。它具有诸如 **实时性能面板 (RTPP)**、性能顾问、命名空间洞察和查询分析器等工具。您还可以为特定性能事件设置警报。\n\
  \n对于自托管部署，您可以使用图形工具，例如 Netdata、Prometheus + Grafana、Zabbix、Munin 或 Observium。您可以使用可观测性框架，例如\
  \ OpenTelemetry。最后，您可以使用商业 **应用性能监控 (APM)** 工具，例如 AppDynamics、Datadog、Dynatrace、LogicMonitor、New\
  \ Relic、SolarWinds 和 Splunk Observability。\n\n## 查找瓶颈\n\n如本章开头所述，每个系统都有一个限制因素或瓶颈。系统有多个输入时，并不总是清楚限制因素是什么。我们需要找到当前瓶颈的元素或组件。为此，我们需要使用前面提到的工具来分析我们迄今为止提到的所有潜在瓶颈的性能。\n\
  \n总之，下表列出了在调整典型软件应用程序时可能遇到的潜在瓶颈。第一列显示您在 Atlas 和自托管系统上都可能遇到的潜在瓶颈。第二列显示自托管部署中您负责的额外瓶颈。正如您所见，使用\
  \ Atlas 可显著减少您需要考虑的瓶颈数量。\n\n| Atlas 和自托管（私有云） | 自托管（私有云） |\n|---|---|\n| UI/应用程序代码\
  \ | 网络 |\n| 框架 | 复制 |\n| 驱动程序 | 存储引擎 |\n| 网络 | 库（分配器、压缩和加密） |\n| 模式/模型 | 操作系统/内核\
  \ |\n| 查询 | 虚拟机 |\n| 索引 | 内存（额外细节） |\n| 分片 | CPU（额外细节） |\n| 云存储 | 存储（额外细节） |\n|\
  \ CPU | — |\n| 内存 | — |\n\n*表 1.1：Atlas 与自托管（私有云）*\n\n在本节的剩余部分，我们将更详细地查看两个示例瓶颈。\n\
  \n我们首先查看存储瓶颈，包括帮助我们识别它的测量指标和指标。在此示例中，我们的工作负载主要是读取数据：\n\n- 稳态下 95% 的数据库操作都是使用 _id\
  \ 字段（主键）读取文档\n- 文档以随机顺序检索，这意味着 _id 值以与插入时不同的顺序被访问\n- 数据集比数据库服务器上的内存大 10 倍，因此大多数读取操作无法通过缓存读取来满足，需要访问存储设备。\n\
  - 存储设备指定提供 4,000 IOPS\n\n我们看到系统使用 mongostat 或 Atlas 监控每秒运行 5,500 次数据库操作。我们尝试通过扩展实例类型来提高性能。数据库性能保持在每秒\
  \ 5,500 次操作。运行此实验后，我们知道瓶颈不是运行 MongoDB 服务器的系统的 CPU 或内存大小。我们再次将实例大小调小。\n\n接下来，我们查看\
  \ I/O 的测量结果：\n\n- 如果运行自托管实例，您可以使用 Linux 上的 iostat 命令查看 IOPS 数量\n- 如果在 Atlas 中运行，您可以在查看监控时在最大磁盘\
  \ IOPS 指标上观察正在使用的 IOPS 数量\n\n为了尝试提高性能，我们现在将存储 IOPS 从 4,000 增加到 8,000。数据库性能翻倍至每秒\
  \ 11,000 次操作。我们经常在客户中看到这种情况。他们假设需要使用更强大的数据库实例，而实际上，他们真正需要的是来自存储子系统的更多 IOPS。\n\n\
  在第二个示例中，我们将重点关注图 1.8 的一个子集。在这里，我们有一个应用程序服务器与数据服务层交互：\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_58_0.png)\n\
  \n*图 1.10：应用程序服务器通过数据服务连接到存储*\n\n\n\n最初，我们假设瓶颈出现在数据服务层或其下方，但查看 CPU 和 I/O 利用率时，我们发现\
  \ CPU 有空闲时间，且存储的 IOPS 和带宽未达到上限。因此，我们假设限制因素位于更上游。通过对应用服务器的测量，我们发现其 CPU 没有空闲时间，因此它是瓶颈。它没有产生足够的请求来完全加载数据服务或云存储层。\n\
  \n作为系统中服务的一般模型，请求进来后由服务内的多个线程执行。某些线程可通过共享资源交互；例如，在 MongoDB 服务器中，由一个线程运行的查询可能会占用存储引擎缓存中的空间，从而减慢其他线程。\n\
  \n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_59_0.png)\n\n*图 1.11：服务线程处理请求*\n\n在此示例中，应用服务器没有发送足够多的请求，这些请求可以分派到数据服务层内的多个线程中运行。具有这种模型的系统的总体性能如下：\n\
  \n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_60_0.png)\n\n## 负载与线程\n\n*图 1.12：随着负载和线程数量增长，性能提升直至系统过载*\n\
  \n随着负载和活跃线程数量的增加，IOPS 性能也随之提升，直到系统达到线程开始争夺共享资源的临界点。超过此点后，进一步增加负载和线程数量可能导致性能下降。大多数系统都具有这种特性。峰值性能通常取决于以下因素：\n\
  \n- 每个请求所执行的任务量\n- 线程与 CPU 核心的比例\n- 对共享资源的竞争\n\n了解应用或工作负载的此负载/性能图最好的方法是，在将产品投入生产前运行压力/负载实验。\n\
  \n为了解决此问题，我们添加了第二台应用服务器；总体性能有所提升，但未达到我们的性能目标。\n\n我们重新分析组件的负载，现在发现运行 mongod 进程的服务器的\
  \ CPU 已完全利用。性能从图表中的未充分利用部分转变为过载部分。我们现在发现 MongoDB 服务器是瓶颈。\n\n在从应用服务器加倍负载后，我们可以通过减少服务器中运行的并发操作或线程数量以更精细的方式降低负载。你可以从应用服务器管理此项，但另一种方法是降低数据库驱动程序或框架/对象关系映射器（ORM）中的\
  \ maxPoolSize 限制。这将减少对数据库的最大连接数，从而减少应用服务器在同一时间可激活的最大线程数。它将 mongod 性能带回图 1.12 中的峰值部分。通过这两次更改，我们现在已达到性能目标。\n\
  \n这是另一个看似违反直觉的更改的例子。减少某些东西可以提高性能。\n\n## 优化的增量过程\n\n通常，你可以遵循一个包含五步循环的七步流程。当我们看到人们在性能调优和扩展方面遇到困难时，往往是因为他们从中间开始、跳过步骤或不知道自己在流程中的位置：\n\
  \n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_61_0.png)\n\n图 1.13：优化和调优的增量过程\n\n让我们详细回顾这些步骤：\n\
  \n- 1. **确定目标/需求：** 复杂系统中总有改进的空间。如果在流程开始时没有达成一致的目标，性能调优可能会成为永无止境的任务。随着市场或需求的变化，目标可能会成为一个移动目标。在项目开始前，请与项目发起人和利益相关者达成一致，确定性能需求将是什么。性能需求应为\
  \ **SMART**，即代表 **具体、可衡量、可实现、相关且有时限**。 “尽可能快” 并不是很具体、可实现或有时限。 在 1GHz 4 核 CPU 上实现每秒\
  \ 100 万次查询，IOPS 为 3k 是不可实现的。需求还应与终端用户相关。\n\n这也是思考系统可扩展性极限的好时机。假设数据不能无限制地永远增长，数据将如何随时间过期或归档？数据归档时的性能目标是什么？\n\
  - 2. **收集数据：** 首先收集数据。工作集是频繁使用的数据和索引的大小。工作集是否能放入内存？我们将在本书后面看到此计算的示例。总的来说，要注意特定操作的成本。例如，如果你的应用程序有一个管理员功能，偶尔会对大型数据集运行查询，那么数据可能不会在任何缓存中。最坏的情况下，数据库必须从不同的磁盘位置检索每个文档，从而导致\
  \ I/O 操作。你的系统对 I/O 带宽有一定的限制，而这在同一时间运行的所有查询之间共享。\n- 3. **生成假设：** 接下来，生成假设，或对当前瓶颈的可能解释。通常会有多个可能的假设。最好召集一群人一起头脑风暴。每个人在系统的不同部分都有不同的经验水平。然而，每个人都会基于自己的经验有自己的偏好理论。有时讨论可能会在某个领域陷入僵局。起初，专注于数量；尝试让人们在没有评判或分析的情况下提出可能的假设。\n\
  - 4. **优先排序假设：** 然后，逐一审查每个假设并尝试对其进行优先级排序。注意任何可能支持假设的证据或数据。同样重要的是要框定讨论时间，不要在任何一个假设上花费太多时间。\n\
  - 5. **验证 #1：** 现在我们有了 #1 假设或主要嫌疑人，我们需要确定一个可以证明或证伪该假设的测试。例如，如果我们认为系统的特定部分可能受 CPU\
  \ 限制，请尝试增加其运行的服务器的大小。\n- 6. **做出更改：** 接下来，做出应能改善情况并证明假设的更改。例如，你可以增加 IOPS 数量，或减少或增加应用程序中的线程数量。理想情况下，你应该一次只做一个更改。\n\
  - 7. **衡量效果：** 最后，衡量性能变化。希望它有所改善。如果总体性能需求得到满足，你可以发布并庆祝。如果没有，你需要撤销未奏效的更改，然后迭代并查看下一个假设和瓶颈。\n\
  \n优化不是一次性任务。它是一个结构化、迭代的过程。通过按顺序遵循步骤并避免跳步的诱惑，你可以防止常见的陷阱并在系统性能上实现可衡量的改进。\n\n## 摘要\n\
  \n本章首先描述了系统的一般特征，以及在更改它们时系统如何以令人惊讶的方式表现。然后我们在深入研究数据服务和 MongoDB 的高层视图之前，先总体了解了软件系统和性能原则。我们列出了一些潜在的瓶颈或限制因素，然后查看了两个具体示例，并描述了在为性能调优系统时可使用的流程。\n\
  \n我们还探讨了 MongoDB 的架构，该架构旨在性能考虑。其文档模型弥合了僵化的关系数据库和简单的键值存储之间的差距，在不牺牲功能的同时提供灵活性。我们查看了存储引擎、查询优化器和复制机制等组件。\n\
  \n通过整合传统上需要多个专用系统的内容，MongoDB 帮助组织在满足多样化数据需求的同时降低运营复杂性。这种方法并不是为了以简单性牺牲功能；而是通过深思熟虑的设计使强大的功能更易于访问。\n\
  \n在下一章中，我们将通过探讨 MongoDB 如何处理模式设计以及如何为最佳性能设计，从而更深入地研究 MongoDB 的架构。\n\n## 参考文献\n\n\
  - 1. Meadows, Donella H. *系统思考：入门读本*. Chelsea Green Publishing, 2008.\n\n\n"
- "# 2 为性能设计的模式设计\n## 为性能设计的模式设计\n\nMongoDB 的创建是为了弥合快速、水平可扩展的键值存储与传统关系型数据库之间的差距。要获得最佳性能，你需要了解\
  \ MongoDB 的优势并设计应用程序以利用这些优势。无论你处理的是大量读取、写入还是两者兼有，目标都是在可读性、可维护性和速度之间取得平衡。MongoDB\
  \ 灵活的模式设计提供了独特的机会，但需要深思熟虑的规划以避免常见陷阱。\n\n在本章中，我们将介绍为高性能设计 MongoDB 模式的基本原则。我们将首先介绍\
  \ MongoDB 中模式设计的关键原则并澄清一些常见误解。然后，我们将探讨 MongoDB 的文档模型如何使构建灵活且高效的模式变得更容易。之后，我们将回顾可能损害性能或使数据更难管理的常见错误和反模式。最后，我们将分享实用的模式设计模式，帮助你优化读取和写入。为了将所有内容整合起来，我们将把这些想法应用到示例应用中，以便你可以看到它们在实践中的运作方式。\n\
  \n本章将涵盖以下主题：\n\n- 模式设计的核心理念\n- MongoDB 模式模型的优势\n- 使用模式验证确保数据完整性\n- 按优势组织的模式设计模式\n\
  \n### 了解模式设计的核心理念\n\nMongoDB 中的模式设计由应用程序如何访问和修改数据驱动；没有单一的 *正确* 结构适用于每种用例。这与关系模型不同，在关系模型中，规范化是默认的起点，而非规范化是性能调优步骤。在\
  \ MongoDB 中，你首先了解工作负载，然后设计模式以匹配。\n\n在本节中，我们将介绍诸如数据共置、读写权衡、文档大小和常见陷阱等关键原则。这些准则将帮助你构建既高效又与应用程序行为一致的数据模型。\n\
  \n### 没有唯一正确的方式\n\n这里是关于模式设计的最重要的一点，你可能没有意识到：*没有单一正确的方式来构建你的文档。* 是的，你没看错！每个用例都需要读取和写入效率之间的独特平衡。关键是首先考虑应用程序的工作负载；*经常一起检索的数据应存储在一起以避免昂贵的查找。*\n\
  \n这与你可能学到的在关系数据库中管理数据的方式根本不同。在该模型中，数据规范化是自始即被期望的做法。只有当性能无法跟上完全规范化的数据模型时，你才会根据数据的用途选择性地对部分数据进行非规范化。在\
  \ MongoDB 中，我们从问题，*这些数据将如何被使用？* 开始，并创建最适合我们访问模式的数据模型。\n\n想想城市规划。一些城镇将住宅、商业和工业区隔离到不同的区域。但在设计良好的城市中，区域并非严格按类型组织，而是作为社区，居民的日常必需品触手可及。同样，MongoDB\
  \ 赋予你根据应用程序实际使用方式组织数据的灵活性，而非按任意分类。\n\n### 数据共置\n\n一旦你确定了应用程序将处理哪些实体，主要决策就是是否嵌入相关数据或将其单独存储并引用。你会反复问自己一个对象是否是一个应独立存储在自己的集合中的独立实体，还是另一个对象的属性，应作为该对象的一部分存储。同样，对于对象的每个属性，你需要考虑是否直接嵌入它或单独存储。\n\
  \n这就是 *一起使用的数据应存储在一起* 原则发挥作用的地方。乍一看它可能听起来很简单，但在理解其影响时它非常强大。以下是它在实践中的体现：\n\n- **嵌入始终一起检索的数据**：这减少了数据库往返次数并保持读取高效。例如，如果订单行项目通常一起访问，则将订单行项目嵌入订单文档是有意义的。\n\
  - **分离不常访问的数据**：将大但很少使用的字段保留在主文档之外。这有助于防止大多数查询不需要它们时的开销。将仅偶尔需要的较大属性存储在文档中会增加磁盘 I/O\
  \ 并浪费 RAM。例如，如果大多数用户页面只显示小缩略图，则在主用户文档中存储用户的全尺寸图像是不高效的。\n\n最糟糕的错误可能是将 MongoDB 当作关系数据库对待，将数据在多个集合中规范化，然后为每个查询重新连接。另一方面，如果过度嵌入导致文档膨胀到极端程度，也可能不是最优的。你最终需要的缓存、**每秒输入/输出操作数（IOPS）**\
  \ 和网络带宽将显著高于按应用程序需求更合理地构建数据的情况。\n\n### 读写权衡\n\n在设计模式时，你可能会面临优化读取与写入之间的冲突需求。这并非 MongoDB\
  \ 独有，但文档模型为解决这些冲突提供了更多选项。以下是平衡模式设计中读取和写入性能时需要考虑的几个常见因素：\n\n- **索引**：索引加快读取速度但会增加写入开销并使用其他资源。在集合中添加多个索引可以显著提高查询性能，但会增加写入操作的成本。这是一个经典的权衡，但如果索引为你的应用程序正确设计，则值得这样做。\n\
  - **严格的服务等级协议（SLA）**：优先考虑延迟要求最严格的操作。有时你优化写入，有时优化读取，很少两者同等优化。例如，订单处理系统可能优先考虑快速写入，而报表系统可能优化读取效率。\n\
  - **减少 I/O**：努力最小化数据读取和写入量。你访问的每个数据块都有成本。如果能消除不必要的读取或写入，所有操作都会变得更便宜、更快。\n\n这些考虑因素也会影响是否使用大文档或小文档建模数据，这会影响应用程序读取、写入和更新数据的效率。\n\
  \n### 小文档与大文档\n\n了解 MongoDB 如何在磁盘上存储文档对于优化性能至关重要。MongoDB 的 WiredTiger 存储引擎，在第 7\
  \ 章《存储引擎》中更详细地介绍，使用面向页面的架构，其中文档存储在按需加载到内存的页面上。\n\n这就是原因：\n\n- **最小页面大小：** WiredTiger\
  \ 的最小未压缩页面大小为 32 KB。小于此阈值（未压缩小于 32 KB）的文档与其他文档共享一个页面，允许在一次页面读取中检索多个小文档。\n- **相关文档碎片化：**\
  \ 如果相关数据分散在多个文档中，你的应用程序最终需要发出多个查询来检索完整的数据集。此外，这些文档可能位于不同的页面上，需要更多 I/O 操作来检索所有相关数据。\n\
  - **写入放大：** 当大文档被更新时，即使只有小的更改，在检查点期间整个文档仍必须写入磁盘。文档越大，就越可能导致不必要的更大写入。\n\n理解这一点引出了我们下一个重要原则：*高读取速度的工作负载受益于嵌入式文档模式。*\
  \ 这是因为相关数据存储在一个地方，一个页面中。另一方面，对于高写入速度的工作负载，即频繁更新数据的小部分，多文档模式可能更高效。\n\n### 常见误区\n\n\
  让我们打破一些关于 MongoDB 模式设计的常见误解：\n\n- **非规范化：** 对数据进行非规范化并不总是意味着 *更多存储* 或 *数据重复*。在某些情况下，将相关数据嵌入一处会降低总体空间使用并减少所需索引的数量。例如，将行项目嵌入订单文档中消除了在订单和行项目集合中都需要订单\
  \ ID 索引的需求，并有助于减少总数据大小。嵌入很少或从不更改的频繁访问的领域数据也会减少额外的查找并提高整体性能。\n\n\n\n-   **动态模式：**\
  \ MongoDB 提供灵活性，但你不必使用它。你可以通过应用层或通过 MongoDB 自身的模式验证功能，甚至两者兼用，来强制执行严格的模式。灵活的模式是一个选项，而不是要求。\n\
  -   **有意设计：** 如果你没有有意识地设计数据结构，那它就不是真正的模式。有人把 JSON 传给你直接存入数据库，这不是模式设计；这只是存储负载。真正的模式设计反映了应用程序的具体需求和要求。\n\
  -   **索引并非自动：** 这并不是一个常见的误解，但确实存在。每个集合都会自动在必需的 _id 字段上创建唯一索引，该字段是每条记录的主键，如果你在插入文档时未提供它，它将被自动生成。但模式设计的重要部分是确定你将通过哪些次要属性进行查询，并确保创建所有必要的索引以高效支持这些查询。你将在\
  \ *第 3 章，索引* 中了解更多关于索引的内容。\n\n还记得关系型数据库从业者会争论 *是否每个表都需要代理键或自然键？* 吗？现在，我们有了更有趣的讨论，关于\
  \ *是否嵌入或引用相关数据*，这些讨论直接影响应用程序性能！\n\n## MongoDB 模式设计的关键优势\n\n与关系型数据库相比，MongoDB 的文档模型支持简化数据访问、降低查询复杂度、提升读写密集型工作负载的性能，并更易适应不断变化的应用需求的模式。MongoDB\
  \ 不强制执行僵化的结构，而是允许开发者以反映真实用例和访问模式的方式建模数据。这种灵活性是 MongoDB 模式设计方法的核心，使开发者能够构建针对速度和可扩展性优化的应用程序。本节将介绍\
  \ MongoDB 模式设计的关键优势，包括处理一对多关系、嵌入弱实体、支持动态属性、利用缓存和快照、针对常见用例进行优化，以及实现无缝的模式演进。\n\n##\
  \ 一对多关系\n\nMongoDB 中的一对多关系被视为一等公民，数组、对象和对象数组都享有完整的查询、更新和索引功能。这种能力深植于 MongoDB 文档模型的基础之中，而非事后添加。\n\
  \n这使得 MongoDB 非常适合存储结构化、重复的数据，例如博客文章中的评论、产品的标签或商品的变体。例如，在博客平台中，博客文章文档可以将其评论包含在数组中，使应用程序能够通过一次查询检索文章及其评论。通过将相关数据存储在一起，MongoDB\
  \ 消除了昂贵的连接需求，降低了查询复杂度，并最小化了磁盘 I/O 操作，从而提升整体性能。\n\n## 嵌入弱实体\n\n弱实体（依赖父实体提供上下文的项目）是嵌入到\
  \ MongoDB 中的理想候选。例如，电子商务平台中的订单明细行固有地依赖于其父订单。将这些明细行嵌入到订单文档中可确保所有相关数据一起存储，无需单独查找或连接。没有明细行的订单价值不大，而将它们保持在一起可使开发者高效地查询和更新订单数据。这种方法通过减少\
  \ I/O 操作和查询复杂度来提升性能，同时使数据检索更快并简化应用程序逻辑。\n\n## 动态属性\n\n关系型数据库在建模字段名称或属性数量事先未知时常遇到困难。这些挑战通常涉及添加新列的昂贵模式迁移，或需要以笨重、效率低下格式存储属性。MongoDB\
  \ 则原生拥抱动态数据建模。例如，产品目录可以包含可变属性，如服装的“颜色”或车辆的“发动机尺寸”，而无需僵化的定义或结构更改。文档可以轻松地将属性名称作为键存储并对应值，或使用键值对数组，两者都支持高效的索引和查询。这消除了运营开销，并确保即使数据演进时查询也更快。\n\
  \n## 缓存和快照\n\n在传统数据库中，数据规范化会阻止冗余，但 MongoDB 允许选择性重复以优化频繁访问模式。例如，将客户的收货地址直接存储在每个订单文档中可确保快速检索此信息，而无需查询单独的集合。同样，将用户最近的少量操作，如帖子或评论，存储在其父文档中可减少重复查询并加快对频繁请求数据的访问。这种数据重复的使用可作为有效的缓存或时间点快照，减少\
  \ I/O 开销，并确保在高用户流量的应用程序中查询更快。\n\n## 常见用例的优化\n\n前面提到的一些示例允许你针对每分钟发生数千次的操作优化系统，例如用户查看其订单或朋友的帖子，同时让你不必担心可能根本不会发生或极少发生的“百年难遇”的操作（用户多久更改一次姓名，该操作真的需要即时完成吗？）。这种优化使开发者能够专注于关键工作流程，例如检索用户帖子或订单详情，同时降低罕见操作的优先级，例如用户更改账户信息。MongoDB\
  \ 的模式灵活性使开发者能够专注于优化这些频繁操作，减少不必要的处理开销，并确保日常交易平稳、快速的性能。\n\n## 模式演进\n\n你是否曾尝试在生产环境中向大型关系型数据库表添加列？借助\
  \ MongoDB 的动态模式，你可以立即开始使用新字段，同时根据需求懒惰地更新旧文档或根本不更新。应用程序应优雅地处理文档中的新字段或新形状。这可以确保向后兼容，并在模式更新期间实现平稳过渡。MongoDB\
  \ 应用程序中的良好数据访问层理解模式可以随时间演进，而无需进行完整的数据转换。\n\nMongoDB 的模式设计优势为现代应用程序提供灵活性和效率，使开发者能够构建量身定制的数据模型以最大化现实世界的性能。无论是处理一对多关系、嵌入弱实体、支持动态属性、利用缓存和快照、优化高频操作，还是适应模式演进，MongoDB\
  \ 都使开发者能够创建适应变化需求的高性能应用程序。通过简化查询、降低延迟和简化数据访问模式，MongoDB 提供了可扩展、现代工作负载所需的强大功能和多功能性。其文档模型不仅仅是一种便利；它是现实世界应用程序性能优化的基石。\n\
  \n## 模式验证\n\n虽然大部分模式设计关注数据如何被结构化和访问，但一个经常被忽视却至关重要的方面是模式验证。仅仅因为 MongoDB 灵活并不意味着你应该允许任何数据结构被存储。模式验证是维护数据完整性的重要工具，且在性能影响方面几乎是免费的。在插入或更新时验证文档的性能成本与写入的总成本相比可以忽略不计，并且它提供了几个实际好处：\n\
  \n-   **提前捕获错误：** 验证可防止不正确的或格式错误的数据进入数据库\n-   **强制执行业务规则：** 你可以直接在数据模型中定义诸如最小值或有效模式等要求\n\
  -   **记录你的模式：** 验证规则可作为数据模型的实时文档\n-   **平滑演进：** 随着模式的演进，你可以轻松调整验证规则\n\n虽然 MongoDB\
  \ 提供了极大的灵活性，但模式验证可确保这种灵活性不会以数据完整性为代价。通过为数据模型定义明确的规则，你不仅可以防止错误并强制执行业务逻辑，还为可维护、不断演进的模式奠定了基础。现在让我们来看常见的模式设计错误，其中许多错误可以通过深思熟虑的验证以及对数据结构和用例模式的透彻理解来避免。\n\
  \n## 常见的模式设计错误\n\nMongoDB 灵活的文档模型在谨慎使用时提供了强大的优势。同样能够实现高性能和开发敏捷性的特性，如果应用不当，也可能导致效率低下或瓶颈。常见的模式设计错误会削弱性能、增加复杂性，或抵消\
  \ MongoDB 模型的优势。了解这些陷阱将帮助你做出更明智的设计选择，避免日后进行昂贵的重写。\n\n## 过度规范化\n\n这通常发生在具有关系数据库背景的开发人员将相同的规范化原则应用于\
  \ MongoDB 时。以下是你可能过度规范化的一些迹象：\n\n-   你的代码频繁使用 $lookup 操作（MongoDB 的 JOIN 版本）\n- \
  \  你有多个集合表示通常一起访问的实体\n-   读查询需要从多个集合中拼凑数据\n-   你需要多文档事务来更新存储在单独文档中的相关字段，而这些字段本可以存储在一起并在无需事务的情况下以原子方式更新\n\
  \n如果你在 MongoDB 中的集合数量与关系数据库中相同，那么你很可能过度规范化了你的模式。\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_73_0.png)\n\
  \n## 过度规范化的代价\n\n我正在审查一个应用程序，开发人员为用户偏好创建了一个单独的集合，为用户资料创建了另一个，为用户设置创建了另一个……你明白了。每次用户页面加载都需要七次不同的查询！我们将经常访问的字段合并到单个用户文档中，页面加载时间从\
  \ 600 ms 降至 100 ms 以下。\n\n## 过度嵌入\n\n这是相反的问题：当开发人员对 MongoDB 的文档模型感到兴奋并试图将太多内容放入单个文档中时。以下是你可能过度嵌入的一些迹象：\n\
  \n-   文档大小不断增长且无限制\n-   你有非常大的文档\n-   你在经常访问的文档中存储了很少访问的数据\n-   你有无限增长的数组（如热门帖子的评论）\n\
  -   编写查询以仅返回文档的特定部分变得复杂\n-   对深度嵌入字段的更新需要复杂的更新操作符\n-   为深度嵌套字段创建有效索引变得具有挑战性\n\n\
  如果你的文档接近 16 MB 的文档大小限制，那就是你必须重新考虑模式设计的强烈迹象。\n\n## 其他常见反模式\n\n除了过度规范化和过度嵌入之外，还有几种模式设计模式经常导致问题，我们称之为反模式。识别并避免这些陷阱可以帮助你构建更高效、可维护和可扩展的应用程序：\n\
  \n-   **对所有操作都需要事务：** 设计始终需要多文档事务的模式会抵消文档模型的优势。通过适当的嵌入，大多数操作可以在没有事务的情况下实现原子性。\n\
  -   **糟糕的索引策略：** 不知道如何为查询模式正确索引会导致全集合扫描和性能低下。\n-   **对嵌入数据的复杂更新：** 如果你无法轻松更新深度嵌套字段，你的模式可能过于复杂或过度嵌入。\n\
  -   **查询效率低下：** 如果你无法轻松查询文档中仅相关的部分，请重新考虑你的模式设计。\n-   **将 MongoDB 当作关系数据库对待：** 将相关数据分散到各个集合中，并在每次查询时使用\
  \ $lookup 重新连接，会抵消文档模型的优势。过度使用 $lookup 会减慢查询速度，可以通过战略性嵌入或反规范化来避免。\n-   **无界数组增长：**\
  \ 嵌入可能无限增长的数组（如病毒式帖子的评论）可能导致文档大小问题和性能低下。\n-   **忽略写入模式：** 在写入密集型应用程序中仅优化读取可能导致争用和性能瓶颈。\n\
  -   **过度索引：** 只是以防万一在每个字段上创建索引会增加写入开销，并不一定能提高查询性能。\n-   **在文档中存储大型二进制数据：** 虽然 MongoDB\
  \ 可以存储二进制数据，但非常大的文件（>16 MB）应使用 GridFS 或外部存储，并在文档中引用。\n\n现在你已经熟悉模式设计中的常见陷阱，让我们专注于优化读取、写入、查询、存储等效率的模式。\n\
  \n## 按收益划分的模式设计模式\n\n现在我们已经介绍了基础知识，让我们探索一套实用的模式设计模式，每种模式都按其提供的特定收益组织，例如提高读取性能、写入效率或查询灵活性。这些模式不仅仅是理论性的；它们基于真实世界的用例和常见挑战。\n\
  \n在本节中，我们将使用名为 **Socialite** 的社交媒体应用程序的示例来说明模式设计模式。Socialite 包含三个主要数据存储：\n\n-  \
  \ **内容存储：** 包含帖子、媒体和评论\n-   **用户图：** 管理用户以及用户之间的关系（关注者、正在关注）\n-   **时间线缓存：** 针对用户登录时快速显示相关内容进行了优化\n\
  \n这种分离使 Socialite 能够针对其特定的访问模式优化每个存储。当我们探索不同的模式设计模式时，我们将参考这些组件来展示一些实际应用。但接下来，让我们讨论一些\
  \ MongoDB 特定的模式优势。\n\n## 读取性能优化模式\n\n在本节中，我们将查看有利于优化读取性能的模式设计模式。这些包括嵌入模式，允许经常访问的相关数据一起存储；扩展引用模式，在灵活性和性能之间平衡嵌入和引用；以及子集模式，有助于仅检索文档中最相关的部分，而无需加载不必要的数据。\n\
  \n## 嵌入模式\n\n在 MongoDB 中，嵌入模式涉及将相关数据包含在同一文档中，而不是对其进行规范化并从另一个集合中引用它。在下面的示例中，该模式用于\
  \ users 集合中的示例文档，以存储分层和相关信息：\n\n```\n{\n  _id: ObjectId(\"5f4e5b6d3c1e2a1b3c4d5e6f\"\
  ),\n  username: \"jane_smith\",\n  name: \"Jane Smith\",\n  email: \"jane.smith@example.com\"\
  ,\n  profile: {\n    bio: \"Travel enthusiast and photographer\",\n    location:\
  \ \"San Francisco, CA\",\n    birthdate: ISODate(\"1988-04-12T00:00:00Z\"),\n  \
  \  avatar: \"https://socialite.com/images/avatars/jane_smith.jpg\"\n  },\n  preferences:\
  \ {\n    theme: \"dark\",\n    emailNotifications: true,\n    privacySettings: {\n\
  \      profileVisibility: \"friends\",\n      activityStatus: \"everyone\"\n   \
  \ }\n  }\n}\n```\n\n让我们回顾一下这份文档，以了解嵌入模式是如何在此应用的：\n\n-   **作为子文档的个人资料数据：** profile\
  \ 字段作为子文档嵌入，包含 bio、location、birthdate 和 avatar 等详细信息。不是将此信息存储在单独的集合中并引用它，所有用户个人资料相关数据都作为一个连贯的单元一起存在。这使数据保持本地化，以便快速访问和检索。\n\
  -   **作为子文档的偏好数据：** 同样，preferences 字段包含用户特定的设置，例如 theme、emailNotifications 和嵌套的\
  \ privacySettings。通过将这些偏好直接嵌入到主文档中，它避免了单独集合和连接的复杂性，使得在一个操作中查询和更新用户设置变得更容易。\n-  \
  \ **嵌套的隐私设置：** privacySettings 是 preferences 中的一个子文档，它存储 profileVisibility 和 activityStatus，展示了更深层次的嵌入。这显示了\
  \ MongoDB 在保持逻辑结构的同时创建多级嵌入的灵活性。\n\n通过对 profile 和 preferences 子文档使用嵌入模式，该设计实现了数据反规范化，减少了对昂贵连接的需求，并确保了数据本地化，以优化读取和写入性能。该模式在相关数据经常一起访问的场景中效果良好，消除了对多个查询的需求。\n\
  \n## 扩展引用模式\n\n当我们在 MongoDB 中需要引用相关集合中的另一个文档，同时在查询时为了方便和性能而包含其某些关键字段时，就会使用扩展引用模式。这种方法有助于避免不必要的查找，尤其是在经常访问的字段\
  \ readily available 时。\n\n以下示例是 posts 集合中的一个文档，其中包含对作者和作者相关数据的引用：\n\n```\n{\n  _id:\
  \ ObjectId(\"5f4e5b6d3c1e2a1b3c4d6f47\"),\n  content: \"Just visited the Golden\
  \ Gate Bridge! #travels #sanfrancisco\",\n  postDate: ISODate(\"2023-04-07T09:15:30Z\"\
  ),\n  media: [\"https://socialite.com/images/posts/golden_gate.jpg\"],\n  likes:\
  \ 42,\n  comments: 7,\n  author: {\n\n```\n\n```\n_id: ObjectId(\"5f4e5b6d3c1e2a1b3c4d5e6f\"\
  ),  // Reference to complete user\nuser\n  username: \"jane_smith\",    // Duplicated\
  \ for display\n  name: \"Jane Smith\",        // Duplicated for display\n  avatar:\
  \ \"https://socialite.com/images/avatars/jane_smith.jpg\" // Duplicated for display\n\
  \  }\n}\n```\n\n在此示例中，posts 文档通过包含作者子文档利用了扩展引用模式：\n\n- **嵌入式引用：** 作者子文档包含一个 _id\
  \ 字段，它是对存储在 users 集合中其他位置的完整 Author/User 文档的引用。这使得可以将帖子链接回其作者。\n- **用于显示的重复关键字段：**\
  \ 而不是仅存储用户的 _id 值，posts 文档中直接包含了 username、name 和 avatar 等额外的作者相关详细信息。这些字段是从引用的 users\
  \ 文档中复制的，以提高性能并允许在无需执行额外查询或查找操作的情况下显示作者详细信息。\n- **优化的读取操作：** 通过嵌入 username、name\
  \ 和 avatar，posts 文档可确保常见查询（例如显示帖子内容以及作者的基本信息）能够在无需额外数据库调用的情况下无缝处理。这降低了延迟并提高了频繁显示帖子及其作者的应用程序的效率。\n\
  \n使用扩展引用模式在这里在规范化和非规范化之间取得了平衡。虽然 _id 为更新或更深入的数据检索提供了指向原始 Author/User 文档的明确链接，但 username\
  \ 和 avatar 等重复字段可确保帖子与基本作者信息一起快速呈现。此模式在社交媒体平台等读密集型应用程序中特别有用。\n\n## 子集模式\n\n子集模式用于在\
  \ MongoDB 中将频繁访问的数据与不频繁访问的数据分开存储，优化常见查询的读取，同时将更详细或不太需要的相关信息保留在相关文档中。\n\n以下是一个媒体帖子的示例数据，该数据存储在两个单独的文档中：\n\
  \n// Document 1: Frequently accessed media post data\n{\n  _id: ObjectId(\"5f4e5b6d3c1e2a1b3c4d6f51\"\
  ),\n  postType: \"video\",\n  title: \"My Trip to Yosemite\",\n  authorId: ObjectId(\"\
  5f4e5b6d3c1e2a1b3c4d5e6f\"),\n  thumbnailUrl: \"https://socialite.com/thumbnails/yosemite-trip.jpg\"\
  ,\n  duration: \"3:42\",\n  viewCount: 1287,\n  likeCount: 328,\n  commentCount:\
  \ 57\n}\n\n// Document 2: Infrequently accessed media post data\n{\n  _id: ObjectId(\"\
  5f4e5b6d3c1e2a1b3c4d6f61\"),\n  postId: ObjectId(\"5f4e5b6d3c1e2a1b3c4d6f51\"),\n\
  \  highResVideo: \"https://socialite.com/videos/yosemite-trip-hd.mp4\",\n  rawMetadata:\
  \ {\n    codec: \"H.264\",\n    resolution: \"1920x1080\",\n    fps: 60,\n    bitrate:\
  \ \"12Mbps\"\n  },\n  processingHistory: [\n    { timestamp: ISODate(\"2023-04-05T14:20:00Z\"\
  ), action: \"uploaded\" },\n    { timestamp: ISODate(\"2023-04-05T14:25:12Z\"),\
  \ action: \"processed\" },\n    { timestamp: ISODate(\"2023-04-05T14:30:45Z\"),\
  \ action: \"published\" }\n  ]\n}\n\n让我们回顾此示例以了解子集模式在此处的应用方式。子集模式旨在将数据集拆分为两个单独的文档（一个存储频繁访问的数据，另一个保存不频繁访问的数据），以优化常见查询的性能，同时在必要时仍可访问详细信息。\n\
  \n第一个文档（Document 1）包含有关媒体帖子的高度查询字段，包括以下内容：\n\n- `postType`：媒体类型（例如 \"video\"）\n\
  - `title`：媒体帖子的名称\n- 参与度指标，例如 `viewCount`、`likeCount` 和 `commentCount`\n- `authorId`：对作者资料的引用\n\
  - 轻量级媒体信息，例如 `thumbnailUrl` 和 `duration`\n\n此文档专为呈现帖子 feed、显示热门内容或加载媒体帖子摘要等用例而设计。通过保持此文档小巧并专注于频繁访问的字段，对其的查询速度快且轻量。\n\
  \n第二个文档（Document 2）存储日常查询中很少需要的详细数据，例如以下内容：\n\n- 完整的视频 URL，存储在 `highResVideo` 中以用于流式传输或下载原始视频文件。\n\
  - `rawMetadata`，包含有关媒体的技术细节，例如其编解码器、分辨率、FPS 和比特率，这些对于后端处理相关但不适用于面向用户的查询。\n- 一个 `processingHistory`\
  \ 数组，记录媒体文件的处理工作流，包括上传、处理和发布等操作的 时间戳。\n- 通过 `postId` 对第一个文档的引用，建立了两者之间的关系。这使得应用程序仅在必要时（例如准备视频进行流式传输或访问历史处理数据时）获取详细文档。\n\
  \n此文档更大且更详细。它单独存储，以确保常见查询（例如在 feed 中列出帖子）不会因加载不必要的技术或历史信息而负担过重。\n\n使用子集模式允许您将数据拆分为两个单独的文档：一个包含频繁访问的字段，第二个文档单独存储大且不频繁访问的信息。这种方法在频繁查询的效率与在需要时检索详细数据的能力之间取得了平衡，使其成为数据集的不同部分具有显著不同访问模式的场景中的理想解决方案。\n\
  \n## 写入性能优化模式\n\n在本节中，我们将介绍有助于优化写入性能的模式设计。这些包括文档版本模式，允许您通过在同一文档或单独的集合中存储以前的版本来有效地管理频繁更新文档的更改；分桶模式，将多个相关记录分组到单个文档中，以减少写入次数并提高写入密集型工作负载的效率；以及键前缀模式，通过设计\
  \ _id 字段的值来避免创建二级索引。\n\n## 文档版本模式\n\n而不是更新现有文档并存储更改的内容，而是创建新版本并维护指向当前版本的指针。当需要始终保留实体更改的完整历史记录时，这特别有用。\n\
  \n以下是在 Socialite 应用中功能发布配置的示例，显示了包含两个不同版本的两个文档：\n\n// Current version (in main collection)\n\
  {\n  _id: \"feature_story_sharing\",\n  name: \"Story Sharing Feature\",\n  isEnabled:\
  \ true,\n  userPercentage: 75,\n  configuration: {\n    maxDurationSeconds: 30,\n\
  \    allowedFilters: [\"sepia\", \"noir\", \"vintage\"],\n    maxFileSize: 15728640\n\
  \  },\n  version: 3,\n  lastUpdated: ISODate(\"2023-04-12T16:30:00Z\")\n}\n\n//\
  \ History collection (previous versions)\n{\n  _id: ObjectId(\"5f4e5b6d3c1e2a1b3c4d7f20\"\
  ),\n  featureId: \"feature_story_sharing\",\n  name: \"Story Sharing Feature\",\n\
  \  isEnabled: true,\n  userPercentage: 50,  // Was 50%, now 75%\n  configuration:\
  \ {\n    maxDurationSeconds: 30,\n    allowedFilters: [\"sepia\", \"noir\"],  //\
  \ \"vintage\" filter added later\n    maxFileSize: 15728640\n  },\n  version: 2,\n\
  \  updatedAt: ISODate(\"2023-04-10T09:15:00Z\")\n}\n\n让我们回顾此示例以了解文档版本模式在此处的应用方式。文档版本模式用于通过将当前版本存储在主集合中并将文档的以前版本存储在单独的历史集合中来跟踪文档随时间的变化：\n\
  \n- **当前版本文档（主集合）**：第一个文档表示功能的活动配置，存储以下内容：\n  - 功能的当前状态（isEnabled: true，userPercentage:\
  \ 75）\n  - 最新配置设置（allowedFilters 现在包含 \"vintage\"）\n  - 当前版本号（version: 3）和时间戳（lastUpdated），指示上次修改的时间\n\
  \n此文档存储在主集合中，主集合专注于当前版本，为需要访问或修改最新功能配置的应用程序提供服务。由于它代表最新数据，因此优化了快速读取和更新。\n\n- **以前版本文档（历史集合）**：第二个文档提供了功能配置早期版本的快照，包括以下内容：\n\
  \  - 历史设置，例如 userPercentage: 50 和 allowedFilters，在添加 \"vintage\" 过滤器之前\n\n\n\n-\
  \   version: 2 字段清楚地表明这是该功能的早期版本\n-   updatedAt 时间戳记录了该版本被新版本替换的时间\n\n该文档存储在专门用于维护文档版本的独立历史集合中。将旧版本单独存储可确保主集合保持轻量，同时仍能访问历史数据以满足审计、调试或比较分析等用例的需求。\n\
  \n文档版本控制模式通过将功能配置的当前版本与其历史版本分离，避免了记录“发生了什么变化”所需的第二次写入。此模式最适合需要维护审计跟踪、随时间跟踪更改或支持回滚的应用程序，例如配置管理系统、内容发布平台，或任何需要在不影响活动工作流性能的情况下需要历史数据的系统。\n\
  \n## 分桶模式\n\n对于时间序列或高容量数据，如果由于某种原因无法使用特殊的时间序列集合，可以使用分桶模式将相关数据点分组到“桶”中以减少文档数量。\n\n\
  以下是 Socialite 应用中跟踪用户每日活动的 timeline 缓存示例：\n\n```\n// With bucketing (optimized for\
  \ fast timeline displays)\n{\n  _id: ObjectId(\"5f4e5b6d3c1e2a1b3c4d5f2f\"),\n \
  \ userId: ObjectId(\"5f4e5b6d3c1e2a1b3c4d5e6f\"),\n  date: ISODate(\"2023-04-10T00:00:00Z\"\
  ),\n  activities: [\n    {\n    type: \"post\",\n    postId: ObjectId(\"5f4e5b6d3c1e2a1b3c4d6f4h\"\
  ),\n    timestamp: ISODate(\"2023-04-10T10:00:00Z\"),\n    content: \"Just posted\
  \ a new photo!\",\n    mediaUrl: \"https://socialite.com/images/photo123.jpg\",\n\
  \    likes: 42\n    },\n    {\n    type: \"follow\",\n    timestamp: ISODate(\"\
  2023-04-10T10:15:12Z\"),\n    targetUser: {\n        id: ObjectId(\"5f4e5b6d3c1e2a1b3c4d6f7j\"\
  ),\n        username: \"travel_adventures\"\n    }\n},\n{\n    type: \"like\",\n\
  \    timestamp: ISODate(\"2023-04-10T10:25:30Z\"),\n    postId: ObjectId(\"5f4e5b6d3c1e2a1b3c4d6f8k\"\
  ),\n    postAuthor: \"mountain_explorer\",\n    postSnippet: \"Summit day at Mt.\
  \ Rainier...\"\n}\n\n    // ... more activities within this day\n],\n    activityCount:\
  \ 27\n}\n```\n\n让我们回顾一下这个示例，以了解分桶模式在此处是如何应用的：\n\n-   **分组活动：** 而不是将每个用户活动（如帖子、点赞和关注）作为单独的文档存储，特定日期（date:\
  \ ISODate(\"2023-04-10T00:00:00Z\")）用户的全部活动都被分组到 activities 数组下的单个文档中。数组中的每个条目代表一个活动，使得在该时间范围内跟踪相关操作变得容易。\n\
  -   **聚合元数据：** 文档包含 activityCount 字段，提供存储在桶内的活动数量的聚合摘要，便于快速参考。\n\n在此示例中，分桶模式通过将用户的每日活动分组到单个文档中应用，而不是为每个活动创建单独的文档。此模式大幅减少了写入操作，并使显示用户的时间线极快，因为一次查询即可检索整天的活动。分桶模式非常适合涉及基于时间或逻辑分组的数据的用例，例如活动日志、事件跟踪、物联网传感器读数或时间序列数据，其中记录存在自然聚类且查询分组记录很常见。\n\
  \n## 键前缀模式\n\n键前缀模式涉及向字段（通常是 _id 字段）添加有意义的前缀或标识符，以分组相关数据、实现高效查询并减少对二级索引的需求。键前缀模式最适合具有许多小型相关文档的工作负载，这些文档需要在不使用额外索引的情况下一起高效检索。\n\
  \n以下来自 Socialite 应用的示例包含有关用户通知的数据文档：\n\n```json\n{\n  _id: \"user_5f4e5b6d3c1e2a1b3c4d5e6f\"\
  ,  // Main user document\n  username: \"jane_smith\",\n  email: \"jane.smith@example.com\"\
  \n  // ... other user fields\n}\n\n{\n  _id: \"user_5f4e5b6d3c1e2a1b3c4d5e6f_notif_001\"\
  ,  // Notification with prefix\n  type: \"like\",\n  message: \"Alex liked your\
  \ post\",\n  timestamp: ISODate(\"2023-04-10T10:30:00Z\"),\n  read: false\n}\n\n\
  {\n  _id: \"user_5f4e5b6d3c1e2a1b3c4d5e6f_notif_002\",  // Another notification\n\
  \  type: \"comment\",\n  message: \"Sarah commented on your post\",\n  timestamp:\
  \ ISODate(\"2023-04-10T11:15:00Z\"),\n  read: false\n}\n```\n\n让我们回顾一下这个示例，以了解键前缀模式是如何应用的。在这里，该模式用于通过使用用户标识符为\
  \ _id 加前缀来结构化 _id 字段，从而将通知与特定用户关联：\n\n-   **主文档前缀：** 主用户文档具有 _id 值（user_5f4e5b6d3c1e2a1b3c4d5e6f），其中前缀\
  \ user_ 清楚地将其标识为用户记录。此结构化的 _id 值有助于逻辑地组织文档并简化针对特定类型记录的查询。\n-   **相关通知：** 与用户相关的通知使用相同的前缀（user_5f4e5b6d3c1e2a1b3c4d5e6f），后跟额外的后缀（_notif_001、_notif_002）。这确保所有通知都直接与用户关联，并且可以使用\
  \ _id 高效查询。\n\n使用 _id 字段的默认索引，您可以使用范围查询高效检索用户的全部通知。此外，如果 user_ 之后的前缀部分是对象 ID，通知也会自然按时间排序。\n\
  \n## 查询和分析优化模式\n\n在本节中，我们将查看有利于查询和分析优化的模式设计。这些包括计算模式，该模式预先计算并存储派生或聚合数据以降低查询执行期间即时计算的成本；模式版本控制模式，该模式跟踪文档结构随时间的变化以确保跨版本的兼容性并促进对不断变化的数据集的分析；以及多态模式，该模式允许通过利用灵活的模式在统一集合中存储不同类型的相关数据，从而在无需多个集合的情况下实现高效查询和分析。\n\
  \n### 计算模式\n\n使用计算模式，您可以预先计算并存储聚合结果，以避免在读取操作期间进行昂贵的计算。这包括在操作发生时递增计数器，以便总数始终反映当前指标。\n\
  \n以下是 Socialite 数据库中包含帖子分析的示例文档：\n\n```\n{\n  _id: ObjectId(\"5f4e5b6d3c1e2a1b3c4d6f7k\"\
  ),\n  content: \"Check out my new photography portfolio!\",\n  postDate: ISODate(\"\
  2023-04-10T14:30:00Z\"),\n  // Pre-computed metrics\n  engagementMetrics: {\n  totalViews:\
  \ 1432,\n  uniqueViewers: 1053,\n  likeCount: 287,\n  commentCount: 43,\n  shareCount:\
  \ 18,\n  avgTimeViewed: 12.5,  // in seconds\n  conversionRate: 0.086  // % of viewers\
  \ who took action\n},\n\n  // Demographics of engagers (pre-computed)\n  audienceBreakdown:\
  \ {\n  genderDistribution: {\n    male: 0.48,\n    female: 0.51,\n    other: 0.01\n\
  \  },\n  ageGroups: {\n    \"18-24\": 0.32,\n    \"25-34\": 0.45,\n    \"35-44\"\
  : 0.15,\n    \"45+\": 0.08\n  }\n}\n}\n```\n\n让我们回顾一下这个示例，以了解计算模式是如何应用的。在这里，该模式用于将预先计算的参与度指标和受众人口统计细分与主要帖子内容一起存储：\n\
  \n-   **参与度指标**：文档包含预先计算的 engagementMetrics 字段，其中包含 totalViews、uniqueViewers、likeCount、commentCount、shareCount、avgTimeViewed\
  \ 和 conversionRate 等聚合数据。不是为每个查询动态计算这些指标，而是将它们直接存储在文档中以便即时检索。\n-   **受众人口统计**：audienceBreakdown\
  \ 字段提供有关观众性别分布和年龄组百分比的预先计算数据。这消除了在查询时执行分析计算或运行昂贵的聚合管道的需求。\n\n\n\n通过预先计算这些数据并将其嵌入到文档中，与参与度统计和受众人口统计相关查询可以快速执行，而无需访问原始事件日志或其他相关数据集。\n\
  \n该模式消除了在读取操作期间进行复杂聚合查询的需求。请注意，这通过增加一次额外的写入，提高了本应只是读取或写入的成本；为了避免此成本，您可以将额外的写入排队作为异步写入执行，而不是使其在原始操作期间成为必需。\n\
  \n## 模式版本控制模式\n\n在应用模式版本控制模式时，您会包含一个版本字段来跟踪随时间的模式更改，从而在模式演进期间实现平滑过渡。\n\n以下示例包含来自\
  \ Socialite 数据库的两个示例用户文档：\n\n```\n// New document with schema version 3\n{\n  _id:\
  \ ObjectId(\"5f4e5b6d3c1e2a1b3c4d5e6f\"),\n  schemaVersion: 3,\n  username: \"jane_smith\"\
  ,\n  name: { // In schema v3, we split name into first/last\n    first: \"Jane\"\
  ,\n    last: \"Smith\"\n  },\n  email: \"jane.smith@example.com\",\n  // ... other\
  \ fields\n}\n\n// Older document with schema version 2\n{\n  _id: ObjectId(\"5f4e5b6d3c1e2a1b3c4d5e7a\"\
  ),\n  schemaVersion: 2,\n  username: \"john_doe\",\n  fullName: \"John Doe\", //\
  \ In schema v2, we used a single name field\n  email: \"john.doe@example.com\",\n\
  \  // ... other fields\n}\n```\n\n让我们回顾此示例以了解模式版本控制模式在此处是如何应用的：\n\n- **版本标识：** `schemaVersion`\
  \ 字段明确指示每个文档符合的版本，使应用程序级逻辑能够在查询、更新或读取期间处理模式的变化。\n- **模式演进：** 在示例中，两个文档与不同的模式版本相关联。对于版本\
  \ 3，名称存储在两个字段中（first 和 last），而在版本 2 中，名称存储为单个 fullName 字段。\n\n该模式允许您的应用程序优雅地处理具有不同模式版本的文档。除非需要进行模式验证或应用程序的某些部分无法仅通过使用字段的缺失作为模式版本的指示来满足，否则可能不需要使用\
  \ schemaVersion 字段。\n\n## 多态模式\n\n多态模式将相似但不完全相同的实体存储在同一集合中以实现灵活查询。\n\n以下示例包含来自 Socialite\
  \ 数据库的文档，其中包含活动源数据，包括 post、following 和 group join 活动：\n\n```\n// Post activity\n\
  {\n  _id: ObjectId(\"5f4e5b6d3c1e2a1b3c4d5e6f\"),\n  activityType: \"post\",\n \
  \ userId: ObjectId(\"5f4e5b6d3c1e2a1b3c4d5e7a\"),\n  timestamp: ISODate(\"2023-04-10T15:30:00Z\"\
  ),\n  content: \"Just posted a new photo!\",\n  mediaUrl: \"https://socialite.com/images/photo123.jpg\"\
  \n}\n\n// Follow activity\n{\n  _id: ObjectId(\"5f4e5b6d3c1e2a1b3c4d5e7b\"),\n \
  \ activityType: \"follow\",\n  userId: ObjectId(\"5f4e5b6d3c1e2a1b3c4d5e7a\"),\n\
  \  timestamp: ISODate(\"2023-04-10T16:45:00Z\"),\n  targetUserId: ObjectId(\"5f4e5b6d3c1e2a1b3c4d5e8c\"\
  ),\n  targetUsername: \"alex_wong\"\n}\n```\n\n```\n// Group join activity\n{\n\
  \  _id: ObjectId(\"5f4e5b6d3c1e2a1b3c4d5e8d\"),\n  activityType: \"group_join\"\
  ,\n  userId: ObjectId(\"5f4e5b6d3c1e2a1b3c4d5e7a\"),\n  timestamp: ISODate(\"2023-04-10T17:15:00Z\"\
  ),\n  groupId: ObjectId(\"5f4e5b6d3c1e2a1b3c4d5e9e\"),\n  groupName: \"Photography\
  \ Enthusiasts\"\n}\n```\n\n让我们回顾此示例以了解多态模式在此处是如何应用的：\n\n- **共享集合：** 所有活动都存储在同一个集合中。每个文档代表一种不同的活动类型，但共享诸如\
  \ `_id`、`activityType`、`userId`、`timestamp` 等通用字段，以及特定于活动的附加字段。\n- **类型特定字段：** `activityType`\
  \ 字段指定活动的类型（`post`、`follow` 或 `group_join`）。根据此值，每个文档中包含类型特定的字段。例如，post 活动包含 `content`\
  \ 和 `mediaUrl`。\n\n现在，而不是为每种活动类型维护单独的集合，查询可以使用 `activityType` 作为过滤器来定位单个集合。\n\n\
  该模式允许在保持类型特定字段的同时高效地跨不同类型的活动进行查询。\n\n## 用于存储优化的归档模式\n\n在本节中，我们将介绍归档模式，该模式有利于存储优化。此模式通过将不常访问或历史数据移动到为长期存储优化的单独集合或数据库来帮助降低活动存储成本。\n\
  \n要应用归档模式，您可以将旧数据或不常访问的数据移动到单独的集合，以提高主集合的性能。\n\n以下示例包含来自两个集合的消息文档：一个用于活跃且经常访问的最近消息，另一个用于旧消息文档的长期存储：\n\
  \n```\n// Active messages collection\n{\n  _id: ObjectId(\"5f4e5b6d3c1e2a1b3c4d7f5f\"\
  ),\n  conversationId: ObjectId(\"5f4e5b6d3c1e2a1b3c4d7f6f\"),\n  sender: ObjectId(\"\
  5f4e5b6d3c1e2a1b3c4d5e7a\"),\n  recipient: ObjectId(\"5f4e5b6d3c1e2a1b3c4d5e6f\"\
  ),\n  content: \"Are we still meeting tomorrow?\",\n  timestamp: ISODate(\"2023-04-10T14:30:00Z\"\
  ),\n  read: true\n}\n\n// Archived messages collection (older than 90 days)\n{\n\
  \  _id: ObjectId(\"5f4e5b6d3c1e2a1b3c4d7f7f\"),\n  conversationId: ObjectId(\"5f4e5b6d3c1e2a1b3c4d7f6f\"\
  ),\n  sender: ObjectId(\"5f4e5b6d3c1e2a1b3c4d5e7a\"),\n  recipient: ObjectId(\"\
  5f4e5b6d3c1e2a1b3c4d5e6f\"),\n  content: \"Hey, how's it going?\",\n  timestamp:\
  \ ISODate(\"2023-01-05T10:15:00Z\"),\n  read: true,\n  archivedAt: ISODate(\"2023-04-05T00:00:00Z\"\
  )\n}\n```\n\n让我们回顾此示例以了解归档模式在此处是如何应用的：\n\n- **活动消息集合：** 第一个文档是活动集合的一部分，该集合存储经常访问或更新的最近数据，例如用户之间交换的消息。此文档代表于\
  \ 2023-04-10 发送的消息，并保留在活动集合中，因为它被视为正在进行交互的一部分。\n- **归档消息集合：** 第二个文档是归档消息集合的一部分，该集合存储不再是活跃交互一部分的旧消息。此文档代表于\
  \ 2023-01-05 发送的消息，在超过 90 天阈值后于 2023-04-05 被归档。archivedAt 字段捕获该消息被移动到归档时的时间戳。\n\n\
  通过将数据分离到活动和归档集合中，该模式在保留历史数据的同时保持活动集合精简。您可以将数据归档到同一集群中的另一个集合、另一个集群或 Atlas 在线归档中。\n\
  \n## 实际应用：Socialite 应用\n\n在实际应用中，实现最佳性能通常需要不仅仅是采用单一的模式设计模式；它涉及组合多个模式。MongoDB 的灵活性使开发人员能够做到这一点！本节探讨了如何组合模式设计模式来增强性能，并通过\
  \ Socialite 应用场景的实际示例来说明。\n\n### 场景 1：用户资料和活动源\n\n在以下场景中，Socialite 应用需要高效地显示用户的资料以及其最近的活动源。传统方法是将用户数据、帖子、评论、点赞和关注存储在单独的集合中，然后每次查看个人资料页面时在这些集合之间执行复杂的连接。此方法可能很慢且资源密集，尤其是在数据量增长时。然而，通过\
  \ MongoDB，我们可以通过使用模式设计模式的组合来优化此过程：计算模式和子集模式。\n\n以下示例演示了此方法。它显示了 users 集合中的单个文档：\n\
  \n```\n// User document\n{\n  _id: ObjectId(\"5f3d7eb8c242d20df83d3a8c\"),\n  username:\
  \ \"jane_smith\",\n  name: \"Jane Smith\",\n  bio: \"Photographer and travel enthusiast\"\
  ,\n  profileImage: \"https://socialite.com/images/profiles/jane_smith.jpg\",\n \
  \ followerCount: 1245,  // Computed pattern\n  followingCount: 362,  // Computed\
  \ pattern\n\n  // Subset pattern - most recent activities\n  recentActivities: [\n\
  \    {\n      type: \"post\",\n      timestamp: ISODate(\"2023-04-07T10:22:15Z\"\
  ),\n      content: \"Just posted photos from my Japan trip!\",\n      imageUrl:\
  \ \"https://socialite.com/images/posts/japan123.jpg\",\n      likeCount: 48\n  \
  \  },\n\n\n```\n{\n  type: \"like\",\n  timestamp: ISODate(\"2023-04-07T09:15:30Z\"\
  ),\n  targetPost: {\n    id: ObjectId(\"5f3d7eb8c242d20df83d3a94\"),\n    author:\
  \ \"travel_adventures\",\n    snippet: \"My day at Mount Fuji...\"\n  }\n}\n```\n\
  // 3-5 条更近期的活动\n]\n}\n\n让我们回顾这个示例，了解计算模式和子集模式是如何在此应用的：\n\n- **Computed pattern:**\n\
  \  - Fields such as followerCount and followingCount are calculated ahead of time\
  \ and stored directly in the user document\n  - It reduces the need for on-the-fly\
  \ aggregation or queries to count followers/following during profile views\n- **Subset\
  \ pattern:**\n  - It embeds an array of recentActivities directly in the user document\n\
  \  - It includes only the most recent posts, likes, or actions, optimized for quick\
  \ access during profile page loads\n  - More comprehensive activity history is deferred\
  \ to a separate collection for less frequent queries\n\n这种设计通过将最近的活动直接包含在用户文档中来优化个人资料页面的加载。完整的活动历史存储在单独的集合中，仅在用户查看更多活动时才会被查询。\n\
  \n## 场景 2：聊天系统\n\n在以下场景中，Socialite 应用需要实现一个消息系统，能够高效地处理实时聊天和用户消息历史的访问。我们可能会想把所有消息存储在单个集合中，并反复查询以获取实时更新和历史数据，但随着消息量的增长，这会导致性能瓶颈。然而，通过\
  \ MongoDB，我们可以通过结合子集、桶化和归档模式来优化这一点。\n\n以下示例演示了这种方法，并包含两个文档，一个来自活动消息集合，另一个来自归档消息集合：\n\
  \n```\n```\n// Active messages collection - current conversation state (for fast\
  \ access)\n{\n  _id: ObjectId(\"5f4e5b6d3c1e2a1b3c4d7f6r\"),\n  participants: [\n\
  \    ObjectId(\"5f3d7eb8c242d20df83d3a8c\"),  // jane_smith\n    ObjectId(\"5f4e5b6d3c1e2a1b3c4d5e7a\"\
  )   // john_doe\n  ],\n  lastMessage: {\n    sender: ObjectId(\"5f4e5b6d3c1e2a1b3c4d5e7a\"\
  ),\n    content: \"See you tomorrow!\",\n    timestamp: ISODate(\"2023-04-12T18:45:22Z\"\
  )\n  },\n  unreadCount: {\n    \"5f3d7eb8c242d20df83d3a8c\": 0,\n    \"5f4e5b6d3c1e2a1b3c4d5e7a\"\
  : 1\n  },\n\n  // Recent messages (subset pattern)\n  recentMessages: [\n    {\n\
  \      sender: ObjectId(\"5f4e5b6d3c1e2a1b3c4d5e7a\"),\n      content: \"See you\
  \ tomorrow!\",\n      timestamp: ISODate(\"2023-04-12T18:45:22Z\"),\n      read:\
  \ false\n    },\n    {\n      sender: ObjectId(\"5f3d7eb8c242d20df83d3a8c\"),\n\
  \      content: \"Yes, 3 PM works for me.\",\n      timestamp: ISODate(\"2023-04-12T18:44:15Z\"\
  ),\n      read: true\n    }\n  ]\n}\n```\n// 10-15 条最近的消息\n]\n}\n\n// Archived messages\
  \ collection - for older messages, using bucketing pattern\n{\n  _id: ObjectId(\"\
  5f4e5b6d3c1e2a1b3c4d8f1t\"),\n  conversationId: ObjectId(\"5f4e5b6d3c1e2a1b3c4d7f6r\"\
  ),\n  date: ISODate(\"2023-04-11T00:00:00Z\"),  // One bucket per day\n  messages:\
  \ [\n    {\n      sender: ObjectId(\"5f3d7eb8c242d20df83d3a8c\"),\n      content:\
  \ \"How about meeting tomorrow?\",\n      timestamp: ISODate(\"2023-04-11T15:30:12Z\"\
  ),\n      read: true\n    }\n    // More messages from this day\n  ]\n}\n```\n\n\
  让我们回顾这个示例，了解子集、归档和桶化模式是如何在此应用的：\n\n- **Subset pattern:**\n  - The recentMessages\
  \ field in the first document from the active messages collection stores the most\
  \ recent 10–15 messages directly within the document\n  - It enables quick access\
  \ to the latest messages without the need for a separate query to a larger data\
  \ store\n- **Archive pattern:**\n  - The second document uses the archive pattern\
  \ to store older messages. The conversationId field links the bucket to a specific\
  \ conversation, ensuring logical grouping by conversationId. The date field represents\
  \ the day covered by the bucket, allowing for chronological organization of messages.\n\
  - This pattern ensures efficient storage and retrieval of older, less frequently\
  \ accessed messages and reduces overhead when querying or analyzing historical conversations,\
  \ as queries can target specific buckets based on date and conversationId.\n- **Bucketing\
  \ pattern:**\n  - Older messages are grouped into daily buckets in the messages\
  \ array in a separate collection with one document per conversation per day\n  -\
  \ It organizes historical messages efficiently to reduce the overhead of querying\
  \ massive datasets and improves scalability for long-running conversations.\n\n\
  这种方法允许快速访问最近的消息，同时通过组织和高效查询历史消息的归档来保持可扩展性。\n\n## Summary\n\n通过将您的模式与数据使用的实际模式对齐（如何读取、写入或更新文档），您可以最大限度地减少\
  \ I/O 和资源争用。MongoDB 的灵活结构可以帮助，但只有在深思熟虑地使用、结合正确的嵌入、引用和索引时才有效。\n\n这里有很多重要的收获。在设计模式之前，至关重要的是了解您的工作负载并考虑读写模式。确保您以文档而非表格的方式思考。拥抱文档模型的灵活性，而不是强加关系模式。记住为常见操作设计并优化具有最严格性能要求的<|message|>\
  \ 操作。使用真实的数据量进行测试：适用于 100 个文档的内容可能在 1000 万个文档时失败。最后，始终要有意为之：深思熟虑的模式设计始终优于任意的数据存储。\n\
  \nMongoDB 中的模式设计既是一门艺术，也是一门科学。通过了解应用程序的工作负载并平衡读写效率，您可以创建既高效又可维护的模式。\n\nMongoDB 在快速、水平可扩展的键值存储和功能丰富的数据库之间架起了桥梁。为了充分发挥其威力，请设计您的模式以利用文档模型的优势：嵌入相关数据、避免不必要的查找，并针对特定的访问模式进行优化。在下一章中，我们将基于这些模式设计原则，探索进一步增强应用程序性能的索引策略。\n"
- "# 3 索引\n\n## 索引\n\n最常见的数据库操作是什么？它是查询，或读取单个文档或多个文档。我们只插入一次文档，有时更新它们，而读取很多次。因此，确保这些读取尽可能快非常重要。\n\
  \n在本章中，您将学习如何使用索引来提高查询性能。您将首先了解索引是什么以及 MongoDB 如何使用它们。然后，您将探索查询计划以及如何解释它们以识别缓慢或低效的操作。您还将练习创建和使用索引来加速查询，并了解\
  \ MongoDB 如何选择使用哪个索引。到本章结束时，您将能够就何时以及如何使用索引来优化性能做出明智的决策。\n\n本章将涵盖以下主题：\n\n- Indexes\
  \ and the types of indexes MongoDB supports\n- Cardinality, selectivity, and how\
  \ they affect indexes\n- Best practices for optimizing compound indexes\n- Why partial\
  \ indexes and covered index queries are important for performance\n\n## 介绍索引\n\n\
  让我们从一个基本示例开始。假设您有一个订单集合，并且您想要找到 ID 值为 295 的订单：\n\n```\ndb.orders.find({ orderId:\
  \ 295 })\n```\n\n如果没有索引，MongoDB 必须检查集合中的每个文档，以查看它是否具有 orderId 字段，然后查看其值是否为 295。对于包含数百万文档的集合，这可能非常缓慢。它导致时间复杂度为\
  \ O(n)，意味着所需时间随文档数量线性增长。\n\n\n\n这与搬家时把所有东西装进箱子类似。如果你没有花时间整理、分组并标记箱子，那么以后寻找特定物品就意味着要翻遍所有东西。这并不高效，但在打包时确实能节省时间。数据库索引的工作方式也一样。你必须决定是在打包（写入）时花时间整理和标记物品更重要，还是在搜索物品（读取）时可以多花点时间。大多数情况下，明智的做法是提前花一点时间，这样以后查找东西会更容易。\n\
  \n## 什么是索引？\n\n在数据库世界中，索引是一种数据结构，它允许你在不扫描整个集合的情况下快速找到记录。MongoDB 对大多数索引使用一种称为 **B-tree**\
  \ 的数据结构。\n\nB-tree 是一种自平衡树数据结构，它以排序顺序维护数据并允许以对数时间进行各种操作，即 *O(log n)*。这意味着随着数据的增长，查找文档所需的时间相比于集合扫描会增长得慢得多，而集合扫描随数据大小线性扩展，即\
  \ *O(n)* 时间。\n\n让我们深入了解一下。如果我们在 orderId 字段上创建索引，简化的 B-tree 可能看起来像图 3.1 所示：\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_98_0.png)\n\
  \n*图 3.1：orderId 字段上 B-tree 的简化视图*\n\n查找订单 ID 295 时，MongoDB 会按以下步骤进行：\n\n- 1. 从根节点\
  \ [200] 开始。\n- 2. 将 295 与 200 比较。由于 295 > 200，向右走。\n- 3. 到达节点 [300]。\n- 4. 将 295\
  \ 与 300 比较。由于 295 < 300，向左走。\n- 5. 到达节点 [250]。\n- 6. 将 295 与 250 比较。由于 295 > 250，向右走。\n\
  - 7. 继续向右，直到找到 295 或确定它不存在。\n\n此过程需要 O(log n) 时间，远快于集合扫描所需的 O(n) 时间。\n\n叶节点存储索引值以及指向包含这些值的文档的指针（recordID）。因此，当我们到达包含值\
  \ 295 的叶节点时，我们会找到关联的 recordID，它是指向实际文档位置的指针或引用。如果多个文档共享相同的值，叶节点将包含多个 record ID。B-tree\
  \ 通常每个节点有超过两个分支，并且像典型的 B+-tree 一样，MongoDB 的 B-tree 只有叶节点中才有数据；内部节点仅用于导航。\n\n有趣的是，使用的是哪种具体数据结构并不重要，重要的是索引值存储在一种\
  \ **sorted** 数据结构中，该结构可以高效地进行搜索和按顺序遍历。如果你把索引想成一个排序列表或二叉搜索树，也并不算远。重要的是你可以轻松访问数据并按排序顺序找到它，并且由于它是排序的，所以相对快速（O(log\
  \ n) 时间）地跳转到特定值或值范围。\n\n## 资源效率与权衡\n\n索引不仅仅是为了加快查询；它们也是高效使用系统资源的关键。当你执行全集合扫描时，你会迫使\
  \ MongoDB 将整个集合加载到内存中（具体来说是 WiredTiger 缓存）。这不仅耗时更长，而且还会消耗有限的资源（缓存内存），并可能由于持续的频繁访问而导致大量磁盘\
  \ I/O。\n\n相反，当你使用索引时，MongoDB 只需要加载索引的相关部分（通常比集合小），然后获取与查询条件匹配的特定文档（们）。这节省了宝贵的内存和\
  \ IOPS，可用于其他操作，使整个数据库更高效。\n\n除了更快的查找外，索引还支持按特定顺序返回结果的要求。如果文档是按索引顺序读取的，你可以避免昂贵的内存排序操作。总而言之，索引加快查询、最小化磁盘\
  \ I/O、降低 RAM 需求并减少整体 CPU 负载。\n\n但索引并非免费；存在权衡。每添加一个索引，就需要在索引值更改时、新文档写入时或现有文档删除时对其进行原子更新。这会减慢写操作。维护索引在内存中使用更多\
  \ RAM，同时写入索引和文档会增加磁盘使用。\n\n根据 MongoDB 性能团队进行的测试，每个索引对写延迟的性能影响可能在 5–70% 之间，具体取决于字段数量、索引的整体大小和类型以及你的工作负载。没有公式，唯一可靠的了解写延迟受影响程度的方法是对实际数据和工作负载进行基准测试。这就是为什么你应该在创建索引时具有策略性，避免维护冗余索引，不要只是对所有内容建立索引。\n\
  \n## 资源使用\n\n我们提到索引需要磁盘空间和 RAM，但它们使用多少 RAM 呢？你可以使用 $collStats 查看索引的大小，但索引的大小并不一定意味着它全部必须适合\
  \ RAM。就资源使用而言，并非所有索引都相同。有一个误区认为所有索引都必须适合 RAM 才能获得最佳性能，但这只有在你始终访问整个索引时才成立。在设计良好的应用程序中，这可能并非必要。\n\
  \n想象一下，你的应用程序处理具有顺序递增 ID 的订单。新的订单总是比现有订单的 ID 更大。在你的 B-tree 索引中，所有新写入都发生在树的右侧，如图\
  \ 3.2 所示。\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_100_0.png)\n\n*图 3.2：B-tree\
  \ 所有近期活动都在右侧*\n\n新订单总是插入到索引的右侧（最高值），并且大多数更新发生在最近的订单上，更不用说旧订单很少被读取了。这就创建了我们所说的右平衡索引。包含旧订单的索引部分很少被访问，因此不会被加载到\
  \ RAM 中，可以保持在磁盘上“冷”存储。只有被访问的索引部分（包含最近数据的活动部分）需要在内存中。\n\n可以创建右平衡索引的字段包括任何自然递增的内容，例如：\n\
  \n- 自增 ID，例如订单 ID\n- 时间戳和/或日期\n- MongoDB 自动生成的 object ID（因为它们包含作为前四个字节的时间戳组件）\n\n\
  相比之下，当你索引一个随机值时，访问模式会跨越整个 B-tree，最终需要将整个索引加载到内存中，使其效率大大降低。可能导致整个索引必须保留在 RAM 中的随机值类型包括以下：\n\
  \n- UUID\n- 大多数字符串值（名称、用户名等）\n- 任何哈希值\n\n因此，虽然索引大小很重要，但如何访问该索引更为重要。深思熟虑地设计数据访问模式可以显著减少内存使用并提高性能。\n\
  \n## MongoDB 中关于索引的常见误解\n\n关于 MongoDB（以及 NoSQL 总体）有几个常见误区。其中之一是 MongoDB 速度如此之快，以至于不需要索引。这可能仅在你的数据集非常小、所有内容都适合\
  \ RAM 且每个查询都很快速的情况下成立，即使它正在执行全集合扫描。对于真实的生产系统来说，这永远不会是这种情况。另一个误区是每个字段都会自动建立索引。在 MongoDB\
  \ 中，只有主键（the _id field）会自动建立索引。为了在生产环境中获得可接受的性能，你需要分析查询模式并相应地创建正确的二级索引。\n\n## MongoDB\
  \ 中的索引类型\n\nMongoDB 提供多种类型的索引来优化不同的查询模式。其中大多数使用 B-tree，但并非全部。本章将重点介绍那些使用 B-tree\
  \ 作为底层结构的索引。\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_101_0.png)\n\n> 索引类型中的字段与属性\n\
  > \n> 索引类型可以指你正在索引的字段或分配给索引的属性。前者指定将存储在 B-tree 中的字段；后者更多地关乎索引整体的属性。\n\n让我们来看看一些更常见的索引类型。\n\
  \n\n\n## 单字段索引\n\nMongoDB 中的单字段索引是在集合的单个字段上创建的索引。以下是如何在单个字段上创建基本索引的方法：\n\n```\n\
  db.collection.createIndex({ fieldName: 1 })\n```\n\n在“什么是索引？”部分，我们已经看到过使用 {orderId:1}\
  \ 的示例，它可以加速针对特定订单 ID 的查询，以及按订单 ID 进行的排序或范围查询。\n\n每个常规集合中都存在一个单字段索引，即 _id 索引，它强制唯一性，尽管在运行命令列出索引时不会明确显示唯一属性：\n\
  \n// Command to show all indexes on collection\ndb.collection.getIndexes()\n// output\
  \ showing _id index only\n[ { \"v\" : 2, \"key\" : { \"_id\" : 1 }, \"name\" : \"\
  _id_\" } ]\n```\n\n这就是查看特定集合中存在哪些索引的方法。现实生活中你创建的大多数索引都不是单字段索引；然而，每个常规集合默认至少有一个索引：_id\
  \ 字段上的唯一索引，它是主键。\n\n## 复合索引\n\n复合索引是在多个字段上创建的。以下是创建三个字段索引的示例：\n\n```\ndb.collection.createIndex({\
  \ status: 1, country: 1, zipString: 1 })\n```\n\n复合索引存储每个文档的多个字段值，因此每个条目都有多个值连接在一起。B\
  \ 树按组合值对数据进行排序。让我们看一个按 status、country 和 zip 索引的示例：\n\n| 集合中 status、country 和 zip\
  \ 的值 | 这些值在索引中存储的顺序 |\n|---|---|\n| \"processing\", \"US\", \"10007\" | \"done\"\
  , \"FR\", \"\" |\n| \"done\", \"US\", \"95401\" | \"done\", \"US\", \"14850\" |\n\
  | \"done\", \"FR\", \"\" | \"done\", \"US\", \"90210\" |\n| \"done\", \"US\", \"\
  90210\" | \"done\", \"US\", \"95401\" |\n| \"done\", \"US\", \"14850\" | \"processing\"\
  , \"US\", \"10007\" |\n\n表 3.1：索引排序如何影响文档检索\n\n首先，按 status 排序记录，然后按 country，最后按\
  \ zip。你可能已经看出，在创建复合索引时字段的顺序非常重要。它允许你仅对第一个字段或其任何前缀字段进行查询时使用复合索引。稍后会详细介绍。\n\n## 多键索引\n\
  \n多键索引在技术上并不是你显式创建的单独索引类型；你仍然是在一个或多个字段上创建索引。但如果这些字段中的任何一个包含数组，MongoDB 会为数组中的每个元素创建索引条目，并将索引标记为多键索引。以下是一个简单示例：\n\
  \n// If documents have: { tags: [\"electronics\", \"sale\", \"new\"] }\ndb.collection.createIndex({\
  \ tags: 1 })\n// Creates index entries for \"electronics\", \"sale\", and \"new\"\
  \n// all of which point to the same recordID\n```\n\n如果任何被索引的字段包含数组，单字段、复合和其他索引都可以被标记为多键。我们将在本章剩余部分以及第\
  \ 12 章《高级查询和索引概念》中再次探讨其影响。\n\n## 稀疏索引\n\n如果你指定索引应为稀疏索引，则只有包含被索引字段的文档才会被插入到 B 树中。这与常规（非稀疏）索引形成对比，后者会为集合中的每个文档建立索引，即使文档不包含被索引的字段。\n\
  \n以下是如何在 MongoDB 中创建稀疏索引的方法：\n\n// sparse is an attribute of index being created\n\
  db.collection.createIndex({a:1}, {sparse:true})\n```\n\n上述语句在 a 字段上创建索引，仅包含存在 a\
  \ 字段的文档。\n\n由于 MongoDB 查询语言（MQL）的空值语义，字段缺失的非稀疏索引文档与字段存在且值为 null 的文档被索引的方式相同。在稀疏索引中，null\
  \ 条目表示字段存在且被设置为 null。我们将在第 12 章《高级查询和索引概念》中进一步探讨这一点。\n\n## 通配符索引\n\n通配符索引允许你在事先不知道字段名称的情况下指定索引。在动态模式中这种情况并不少见：\n\
  \n// Index fields inside attr subdocument\ndb.collection.createIndex({ \"attr.$**\"\
  : 1 })\n// Sample document\n// { ...,\n//   attr: {\n//     genre: \"Mystery\",\n\
  //     author: \"John Smith\",\n//     pages: NumberInt(298),\n//     ...\n//  \
  \ }\n// }\n// query using the index\ndb.collection.find({\"attr.pages\":{$gt:500}})\n\
  ```\n\n这允许你使用 attr 下存储的任何属性的索引进行查询，而无需为每个属性创建单独的索引。通配符索引默认情况下为稀疏索引。\n\n## 部分索引\n\
  \n有时，你可能只想对文档的子集进行索引和查询。部分索引仅对匹配指定过滤器的文档建立索引。此命令在两个字段上创建索引，但仅对 status 等于 \"processing\"\
  \ 的文档建立索引：\n\n```\ndb.orders.createIndex(\n  { country: 1, dateOrdered: 1 },\n \
  \ { partialFilterExpression: { status: \"processing\" } }\n)\n```\n\n包含 {status:\"\
  processing\"} 以及其他查询谓词的查询将能够使用此部分索引。\n\n使用部分索引可以显著减小索引大小并节省资源。当你的查询仅针对集合中的一小部分时，这尤其有用。例如，如果你经常只查询活跃文档，而活跃文档只占数据的一小部分，那么具有部分过滤器\
  \ {active:true} 的索引将既紧凑又高效。当文档更新为 {active:false} 时，它会自动从索引中移除。\n\n这不是所有索引类型和属性的详尽列表；你可以在\
  \ https://www.mongodb.com/docs/manual/indexes/ 的 MongoDB 服务器文档中阅读更多相关信息。\n\n## 设计高效索引\n\
  \n索引是 MongoDB 性能优化策略的基石，能够在大型数据集上实现快速高效的查询和排序。然而，设计有效的索引不仅仅需要理解其基本功能；它要求仔细考虑查询模式、字段基数和操作需求。关于低基数字段和不等式查询的常见误解常常误导开发者，但正确的索引策略可以大幅提升性能。复合索引、索引压缩、覆盖查询和部分索引为优化数据库操作提供了强大的工具，而\
  \ **Equality, Sort, Range**（ESR）准则简化了围绕字段排序的复杂决策。\n\n在本节中，我们将探讨索引设计的基石原则，涵盖基数与选择性、复合索引设计、前缀压缩、部分索引以及索引如何支持聚合管道等关键主题，为你提供设计可最大化应用程序性能的索引的工具。\n\
  \n## 基数与选择性\n\n存在一种常见的误解，即低基数字段（具有少量唯一值的字段）不应包含在索引中。这完全不正确。\n\n**基数**在数据库中指的是某个字段可以拥有的不同值的数量。布尔字段的基数为二：true\
  \ 或 false。唯一 ID 字段的基数等于集合中的文档数量。姓氏的基数高于名字。基数对于查询有效性的重要性不如选择性，即查询中特定值在集合中匹配的文档数量。\n\
  \n例如，假设一个 orders 集合具有 status 字段，其值可以是 \"processing\" 或 \"done\"。在任何给定时间，status 为\
  \ \"processing\" 的订单少于 0.01%，因为大多数订单都是 \"done\"。在 status 上建立索引对于查询处理中的订单非常优秀，因为它具有高度选择性，即使该字段基数较低。另一方面，使用该索引查找所有已完成的订单帮助有限，因为它匹配集合中\
  \ 99.99% 的所有文档。\n\n\n\n这让我们想到一个相关的误解，即不等式查询（如 $ne）无法有效使用索引。这是错误的！如果你在同一个 orders\
  \ 集合中查询 {status: {$ne: \"done\"}}, 其选择性与查询 {status: \"processing\"} 一样。MongoDB 查询引擎对其处理略有不同（它被处理为范围查询），但由于其选择性很高，仍然非常高效，尽管它会使用不同的查询计划：\n\
  \n// For {status: {$ne: \"done\"}}, the index scan uses:\n\"indexBounds\": {\n \
  \ \"status\": [\n    \"[MinKey, \\\"done\\\")\",\n    \"(\\\"done\\\", MaxKey]\"\
  \n  ]\n}\n// For { status: \"processing\" }, the index scan uses:\n\"indexBounds\"\
  : {\n  \"status\": [\n    \"[\\\"processing\\\",\\\"processing\\\"]\"\n  ]\n}\n\n\
  这些是 explain 方法输出的示例，我们将在第 12 章《高级查询和索引概念》中更详细地讨论，在那里我们开始尝试调试查询并验证我们的索引对性能的帮助程度。了解操作是相等查询还是范围查询对于我们下一个主题——复合索引中字段的排序非常重要。\n\
  \n## 构造复合索引\n\n最优的复合索引需要理解不同的查询如何使用它们。复合索引按定义的顺序索引多个字段，而该顺序显著影响 MongoDB 使用索引的方式。\n\
  \nMongoDB 中的复合索引包含多个字段，并首先按第一个索引字段的值对文档进行排序，然后按第二个字段，以此类推。内部它像一个排序的树结构组织，当查询匹配索引键模式的开头时，能够实现高效的遍历。例如，对\
  \ {a:1, b:1, c:1} 的复合索引允许 MongoDB 高效地定位匹配以下过滤查询的文档：\n\n```\n{ a: <value> }\n{ a:\
  \ <value>, b: <value> }\n{ a: <value>, b: <value>, c: <value> }\n```\n\n这被称为 **前缀匹配**。查询必须匹配索引字段的前缀才有资格使用该索引。跳过第一个字段的查询，例如\
  \ {b:<value>} 或 {c:<value>}，无法使用此索引。在这些情况下，MongoDB 会执行全集合扫描。\n\n让我们看一个更实际的例子。假设你创建了一个这样的复合索引：{category:1,price:1,stock:1}。\n\
  \n此索引适用于诸如 {category:\"books\"} 或 {category:\"books\",price: {$lt:20}} 的查询。使用排序列表可以帮助我们可视化索引的利用方式：\n\
  \n```\n\"books\",10,399\n\"books\",13,205\n\"books\",15,11\n\"books\",22,0\n\"pens\"\
  ,2,175\n\"pens\",5,42\n\"pens\",12,109\n\"pens\",15,98\n```\n\n当列表按 category 然后按\
  \ price 排序时，很容易快速找到所有 books 或所有 pens，一旦找到一个类别，就很容易找到“价格小于 $20”的范围并按价格顺序返回这些记录。\n\
  \n然而，你可以看到，如果我只是询问所有价格小于 $20 的商品而不指定类别，我们就必须遍历每个类别值，这会使索引的实用性大打折扣。这是因为查询跳过了 category\
  \ 字段。由于索引首先按 category 排序，MongoDB 没有有效的方法仅通过价格来隔离相关文档的范围。而且索引完全无法用于回答诸如“哪些商品的库存为\
  \ 0”之类的查询。对于该查询，我们不妨执行集合扫描。\n\n理解前缀匹配的工作原理对于设计与应用程序最常见查询模式相符的复合索引非常重要。\n\n## 相等查询\n\
  \n一种常见的查询模式涉及在多个字段上使用相等。例如，假设你存储的地址大多在美国，其中适用以下情况：\n\n- country 通常为 \"US\"（低基数）\n\
  - state 有约 50 种可能性（中等基数）\n- zipString 有超过 42,000 个唯一值（高基数）\n\n假设我们始终对这三个字段使用相等进行查询：\n\
  \n```\ndb.collection.find({country: \"US\", state: \"NY\", zipString: \"10001\"\
  })\n```\n\n哪个复合索引的性能会更好？\n\n- 选项 1：{ country: 1, state: 1, zipString: 1 }\n- 选项\
  \ 2：{ zipString: 1, state: 1, country: 1 }\n\n常规的智慧，或你的直觉，可能会说选项 2 因为最具选择性的字段排在最前面。但事实证明，这并不会使查询运行得更快。对于在所有字段上都有相等条件的查询，两个索引的性能将同样好。这是一个重要的概念需要理解：当选择所有字段时，选项\
  \ 1 和选项 2 的 B-tree 大小相同，因为它们必须索引相同数量的文档；因此，它们的深度相同，找到特定值对两者来说都是相同的 O(log n)。\n\n\
  话虽如此，如果其他条件相同，你仍应优先选择选项 1。当低基数字段（如 country，可能只有 \"US\" 或 \"CA\"）排在前面时，MongoDB 可以更有效地压缩重复值的大段。因为前缀压缩，将低基数字段放在前面会显著减少磁盘和\
  \ RAM 上的索引大小：\n\n```\n\"country_1_state_1_zipString_1\": 620 KB\n\"zipString_1_state_1_country_1\"\
  : 804 KB\n```\n\n这几乎是 30% 的大小差异！更小的索引意味着更少的磁盘使用、更快的加载速度和更高效的内存使用。\n\n仍然可能有合理的理由以某种方式排序字段。例如，选项\
  \ 2 索引可以为仅 zipString 或 zipString 和 state 的查询提供服务。因此，选择选项 2 而非选项 1 可能有很好的用例，但期望在三个字段上都有相等条件时“查询更快”并不是其中之一。\n\
  \n当我们开始加入范围查询和排序操作时，事情变得更有趣（也更复杂）。\n\n## 排序和范围查询\n\n索引允许我们高效地回答范围查询，因为我们可以快速找到范围一端的数值，然后沿着索引继续，直到达到高于上限的第一个值，如下所示：\n\
  \n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_109_0.png)\n\n图 3.3：使用索引进行高效的范围查询和排序\n\
  \n对于 {field: {$gt: 205, $lt:290}} 的查询，我们找到下限 205，然后沿着叶节点遍历，直到遇到大于上限 290 的值。请注意，我们是从索引中按顺序获取这些值的，因此如果查询有\
  \ sort:{field:1}，我们将“免费”获得按排序顺序的值。如果排序表达式为 {field:-1}，我们只需先查找 290，即范围的上限值，然后从右到左扫描索引（即向后而非向前），直到超过\
  \ 205，即下边界，这将使我们以降序获得值。\n\n如果我们在一个字段上有相等查询，另一个字段上有范围查询会怎样？让我们看一下 {category:1,price:1}\
  \ 索引和 {category:\"books\",price:{$lt:20}} 查询。我们已经看到，我们可以轻松找到 category 相等且 price\
  \ 范围（或排序）的文档：\n\n```\n\"books\",10\n\"books\",13\n\"books\",15\n\"books\",22\n\"\
  pens\",2\n\"pens\",5\n\"pens\",12\n\"pens\",15\n```\n\n由于相等字段排在前面，我们可以直接导航到与该值匹配的排序树的部分，并且第二个字段保持有序，因此应用范围过滤同样简单直接。但如果索引是\
  \ {price:1,category:1}，这意味着范围过滤在第一个字段上，而相等在第二个字段上会怎样？\n\n索引现在看起来像这样：\n\n```\n2,\"\
  pens\"\n5,\"pens\"\n10,\"books\"\n12,\"pens\"\n13,\"books\"\n15,\"books\"\n15,\"\
  pens\"\n22,\"books\"\n```\n\n在此索引中，当我们导航到价格小于 20 的索引范围时，会发现 category 全部混杂。这意味着我们必须扫描更多价格小于\
  \ 20 的索引条目，并丢弃不匹配相等谓词的条目，这比使用不同的索引结构要多。而且如果我们在第一个字段上应用范围后需要在第二个字段上进行排序呢？同样，因为值不是有序的，我们需要在内存中做更多的工作。\n\
  \n如果我们有相等和排序，相同的概念也适用。如果相等在复合索引的第一个字段上，那么我们在导航到的索引部分中，第二个字段的值仍然“有序”。但如果排序在索引的第一个字段上，那么虽然我们在扫描整个索引时可以按顺序获取这些值，但我们必须不断检查并丢弃第二个字段不等于我们谓词的条目。\n\
  \n如果我们同时有三者：相等、范围谓词以及对另一个字段的排序呢？让我们回到 {category:1,price:1,stock:1} 索引中三个字段的示例以及这些值：\n\
  \n```\n\"books\",10,399\n\"books\",13,205\n\"books\",15,11\n\"books\",22,0\n\"pens\"\
  ,2,175\n\"pens\",5,42\n\"pens\",12,109\n\"pens\",15,98\n```\n\n我们可以看到，如果我们查询 \"\
  books\" 类别，价格是有序的，但库存不是。如果索引将价格和库存的顺序交换为 {category:1,stock:1,price:1}，我们将得到以下结果：\n\
  \n```\n\"books\",0,22\n\"books\",11,15\n\"books\",205,13\n\"books\",399,10\n\"pens\"\
  ,42,5\n\"pens\",98,15\n\"pens\",109,12\n\"pens\",175,2\n```\n\n现在，我们可以快速找到特定类别中库存为零的商品，或按库存对特定类别进行排序，但我们不再拥有按顺序排列的价格值。因此，如果我们有范围查询和排序或两个范围查询，虽然我们能够从索引中判断文档是否匹配，但我们将无法将检查的索引条目数量限制为仅匹配的那些。\n\
  \n所有这些都引出了我们可以应用的一些通用原则。\n\n## ESR 准则\n\n您可能听说过复合索引的 ESR 准则：\n\n- E: Equality fields\
  \ first\n- S: Sort fields next\n- R: Range fields last\n\n虽然这不是硬性规则，但它是一个有用的指导原则，其中一部分是绝对的：先放置相等字段。对复合索引的前导字段应用相等条件，仍可利用其余字段值保持排序的顺序。然而，排序字段和范围字段哪个应放在后面，取决于您的具体需求：\n\
  \n- If avoiding in-memory sorts is critical, then put sort fields before range fields\
  \ (ESR)\n- If your range predicate in the query is very selective, place it before\
  \ sort fields (ERS) to reduce the number of documents to sort and allow for efficient\
  \ in-memory sorting\n\n因此，相等条件必须先行，因为多字段排序索引的结构允许我们在仍保留其余字段排序顺序的同时应用相等过滤。\n\n##\
  \ 使用部分索引最大化资源\n\n有时，我们不需要为每个文档建立索引，特别是如果查询仅针对集合中一个小而明确的子集。在某些情况下，您的多重相等查询可能始终指定一个特定字段且仅有一个值。例如，在正在处理的订单集合中，状态为\
  \ \"processing\" 的订单数量可能远少于标记为 \"done\" 的订单。另一方面，这些订单更可能是您经常查询的对象。在这种情况下，创建支持对 \"\
  processing\" 订单查询的索引（并忽略 \"done\" 订单）比对每个文档建立常规索引要高效得多。\n\n为了支持查询正在处理的订单并获取 zip、state\
  \ 和 country，我们可以创建以下索引：\n\n```\n{status:1, zipString:1,state:1,country:1}\n```\n\
  \n该索引已可受益于前缀压缩，但它不会受益于右平衡，即使我们仅查询状态为 processing 的文档，因为当状态更新为 \"done\" 时，我们现在必须更新索引中通常不读取的部分的页面。我们可以通过仅为状态为\
  \ \"processing\" 的文档建立索引来节省更多空间和资源，如下所示：\n\n```\ndb.coll.createIndex(\n  {zipString:1,state:1,country:1},\n\
  \  {partialFilterExpression:{status:\"processing\"}})\n```\n\n现在，只有整个集合中的一小部分存储在索引中，当订单更新为状态设为\
  \ \"done\" 时，它将自动被取消索引或从索引中移除，保持其大小较小。\n\n## 覆盖查询：性能的圣杯\n\n覆盖查询是指满足查询所需的所有字段都在索引中的查询，因此\
  \ MongoDB 完全不需要查看实际文档。这些查询通常需要的资源最少。以下是实现覆盖查询所需的示例：\n\n```\n// We create this index:\n\
  db.orders.createIndex({ orderId: 1, status: 1 })\n\n// This query is covered, the\
  \ index already contains status field:\ndb.orders.find({ orderId: 295 }, { _id:\
  \ 0, status: 1 })\n```\n\n```\n// This query is not covered, we need to fetch documents\
  \ to get the total field\ndb.orders.find({ orderId: 295 }, { _id:0, total: 1 })\n\
  ```\n\n不过有一些限制。覆盖查询通常不能与多键索引一起使用，当需要返回的字段可能是一个数组时。这是因为 MongoDB 需要查看文档以确定要返回的值是标量还是数组。某些\
  \ null 查询无法被覆盖，因为索引无法区分包含 null 的字段和不存在的字段。\n\n由于同样的 null 语义，$exists 子句的任何形式都无法从常规索引中确定，因此如果您希望获得高效的索引查询，请遵循规则避免使用\
  \ $exists 子句，除非您使用的是稀疏索引。我们将在第 12 章《高级查询和索引概念》中更详细地讨论这个主题。\n\n## 升序与降序索引顺序\n\n如果您注意到了，所有示例都使用了\
  \ {field:1} 而不是 {field:-1}。这是因为我们通常不需要将索引以降序存储。查询引擎可以根据需要结果为升序还是降序，从左到右或从右到左扫描 B\
  \ 树。对此只有一个例外，那就是当您对多个字段进行相反方向的排序时。假设我们有以下查询：\n\n```\ndb.coll.find({category:\"books\"\
  }).sort({genre:1, price:-1})\n```\n\n要完全支持此查询，我们必须将索引创建为以下其中之一：\n\n```\n{category:1,\
  \ genre:1, price:-1} OR {category:1, genre:-1, price:1}\n```\n\n这是因为查询中指定的排序顺序使用了两个相反方向的排序字段（一个升序，一个降序）；因此，这两个字段的索引也应相反顺序以支持排序。由于索引可以向前或向后扫描，我们可以反转这两个排序字段中的任一个的顺序。\n\
  \n## 索引与聚合管道\n\n索引可用于所有需要在集合中查找文档子集的 MongoDB 命令：find、update、delete，甚至 aggregate。但最后一个通常会引起一些困惑：它何时可以使用索引来过滤数据，何时不能？\n\
  \n想想索引的作用：它们通过记录 ID 帮助定位文档。一旦聚合管道将文档转换为新形状，这些索引就不再适用，因为我们处理的是新的内存中文档，它们与我们索引的集合结构不对应。但当聚合需要从实际存在的集合中获取文档时，索引与任何\
  \ find 操作一样至关重要。\n\n索引在聚合的 $match 和 $sort 阶段中使用，前提是它们适用于正在聚合的集合中的文档。索引也由访问另一个集合的任何阶段使用，例如\
  \ $unionWith（执行新的管道）或 $lookup（基于当前管道中的值在另一个集合上执行查询）。我们将在第 4 章《聚合》和第 12 章《高级查询和索引概念》中更详细地讨论如何确定使用哪些索引。\n\
  \n## 摘要\n\n索引是功能强大的工具，当正确使用时可以显著加快 MongoDB 查询速度。虽然它们提高了读取性能，但会带来轻微的权衡：写入变慢。在大多数情况下，这种权衡对于性能提升来说是值得的。了解不同类型索引的行为非常重要。例如，基于\
  \ ObjectID 或其他顺序值的右平衡索引在内存使用上更高效。\n\n在选择要索引的字段时，应关注选择性（字段缩小结果的能力），而不仅仅是基数。在复合索引中，将低基数字段放在前面可以改善前缀压缩，但同时也必须考虑前缀匹配以最大限度地减少创建的索引数量。部分索引可以通过在仅需要为文档子集建立索引时大幅减少索引大小，从而改变游戏规则。此外，覆盖查询（所需所有字段都在索引中）通常是最有效的，因此在设计索引时请牢记这一点。\n\
  \n通过应用这些最佳实践，您将能够很好地构建一个高性能的 MongoDB 数据库，以满足应用程序的需求。在下一章中，我们将探索 MongoDB 强大的聚合框架，并深入探讨更高级的主题，例如查询优化器如何选择索引。\n\
  \n\n"
- "# 4 聚合\n\n## 聚合\n\n如果你曾尝试将数据整理成有意义的洞察，你会知道仅靠原始文档是不够的。你需要切片、切块、转换和汇总。这正是 MongoDB\
  \ 聚合框架大放异彩的地方。可以把它想象成一条数据装配线：文档从一端进入，在经过各个阶段时经历一系列转换，然后在另一端以转换后的形式出现。它功能强大且灵活，但如果不小心，它可能会成为性能瓶颈。\n\
  \n在本章中，我们将探讨如何构建既强大又高效的聚合管道。我们将研究管道优化策略、内存管理技术、特定阶段的注意事项以及处理大型数据集的方法，始终以性能为北极星。\n\
  \n本章将涵盖以下主题：\n\n- MongoDB 聚合框架的基础\n- 聚合管道性能的优化技术\n- 处理大型数据集的最佳实践\n- 分布式环境和分片集合中的聚合\n\
  - 聚合性能的监控、分析与故障排除\n\n### MongoDB 的聚合框架\n\nMongoDB 的聚合框架是数据库世界中数据转换和分析的瑞士军刀。但在深入优化技术之前，让我们先了解这款工具为何如此特别。\n\
  \n在早期，MongoDB 的聚合选项可以说是非常简陋的。开发人员依赖 mapReduce 命令或在客户端代码中处理聚合来执行数据汇总。虽然功能上可行，但这些方法通常笨拙、缓慢且不太易于使用。\n\
  \n聚合管道登场了，这是在 MongoDB 2.2 中引入的变革者。突然间，开发人员可以串联一系列阶段，每个阶段以某种方式转换数据，就像工厂中的装配线或 Unix\
  \ 命令行管道一样。随着后续版本的发布，聚合框架变得更加强大，增加了新的阶段、操作符、表达式和性能优化，以满足日益复杂的数据处理需求。\n\n如果你来自 SQL\
  \ 背景，你可能习惯于编写带有多个 JOIN 操作和子查询的 SELECT … GROUP BY … HAVING … 查询。聚合管道提供类似的功能，但有所不同：不是单一的庞大查询，而是构建由阶段组成的管道，每个阶段执行特定的任务或转换。文档从集合流入第一个阶段，然后流入后续阶段，最终作为结果返回给客户端。\n\
  \n这种模块化方法使复杂的数据处理任务更易于阅读和维护，尤其是在处理 MongoDB 中常见的复杂文档结构时。此外，你可以在 MongoDB 聚合中做一些事情，包括处理复杂文档数组，这可能会让传统的\
  \ SQL 查询因其复杂性而面红耳赤。\n\n### 聚合管道的核心概念\n\n把你的数据想象成一条河流，每个管道阶段就像改变流向的坝、过滤器或涡轮。文档进入管道，由每个阶段转换，最后以你想要的结果集形式出现。这与使用\
  \ Unix 命令行管道对大型文本文件进行多次转换非常相似：\n\n```\ngrep xxx file.log | cut .. | sed | sort |\
  \ head -20\ncat file.log | awk '{print $2, $NF}' | ... >> newfile.log\n```\n\n阶段的顺序非常重要！尽早过滤会极大地减少下游的工作量。每个阶段仅在其从前一阶段接收到的文档上工作，其输出成为序列中下一阶段的输入。\n\
  \n### 数据输入\n\n```\n{ $match: { language: \"English\" } }\n```\n\n```\n{ $unwind:\
  \ \"$subjects\" }\n```\n\n```\n{ $group: { _id: \"$subjects\", count: { $sum: 1\
  \ } } }\n```\n\n```\n{ $sort: { count: -1 } }\n```\n\n### 数据输出\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_117_0.png)\n\
  \n图 4.1：文档在流经管道阶段时发生转换\n\n管道中的所有内容都使用特定的语法来实现其魔力：\n\n- **阶段**定义发生何种类型的转换，例如用于过滤文档的\
  \ `$match` 阶段、用于分组或聚合的 `$group`、用于添加新字段或更改现有字段值的 `$set`，以及用于更改文档流中顺序的 `$sort`。MongoDB\
  \ 提供了许多此类阶段，每个阶段都有特定用途。你可以在 https://www.mongodb.com/docs/manual/reference/operator/aggregation-pipeline/\
  \ 探索完整列表。\n- **聚合表达式**例如 `$eq`、`$gt`、`$in` 和 `$convert` 用于评估、计算和分配新值。\n- **路径表达式**让你能够使用当前字段中的现有值。\n\
  - **累加器表达式**例如 `$sum`、`$avg`、`$push`、`$min` 和 `$max` 在分组阶段中使用，对分组数据执行聚合。\n\n聚合框架中的表达式使用类似\
  \ JSON 的语法。你会看到很多美元符号（$）；它们表示操作符、表达式或字段路径。表达式可以嵌套，从而实现强大而灵活的计算。例如，你可能会使用 `$add`\
  \ 对两个字段求和，使用 `$cond` 或 `$switch` 实现条件逻辑，或使用一系列内置操作符进行算术、字符串操作、日期处理和逻辑操作。\n\n你可以使用字段路径表示法引用文档中的字段（简单字段使用\
  \ \"$fieldName\"，嵌套字段使用 \"$object.nestedField\"）。框架还支持多种类型的变量，包括系统变量，例如 `$$ROOT`\
  \ 用于引用整个文档或 `$$NOW` 用于获取当前时间，并允许你设置自己的变量以提高可读性。\n\n### 性能考虑\n\n虽然聚合框架功能强大，但它并非魔法。大量性能取决于你如何构建管道。设计良好的管道可以非常快速，而设计不良的管道可能会让你的数据库瘫痪。关键在于思考数据如何在管道中流动以及每个阶段会对性能产生什么影响。\n\
  \n例如，使用 $match 尽早过滤文档可以大幅减少后续阶段需要处理的数据量。有效使用索引也至关重要。就像常规查询一样，能够使用索引快速找到所需文档的管道，其性能远高于必须扫描整个集合的管道。\n\
  \n正如我们将在下一节看到的，MongoDB 的查询优化器会自动做很多工作来改善性能，但了解这些优化背后的原理将帮助你编写更好的管道。\n\n### 聚合管道流程\n\
  \n在解析管道后，MongoDB 的查询优化器会分析它并尝试使其尽可能高效。它可能会重新排序阶段以提高性能（确保不会改变结果），合并兼容的操作，将过滤器推近数据以有效利用可用索引，并根据管道结构创建最佳执行计划。它还会分析管道使用原始文档中的哪些字段，以限制从集合引入管道的数据量。\n\
  \n在内部，MongoDB 以流式方式将文档批次发送通过管道。每个阶段从前一阶段接收一批文档，应用其转换，并将结果传递给下一阶段。这种设计最大限度地减少了内存使用，并允许高效处理大型数据集。\n\
  \n然而，并非每个阶段都能将每个批次传递给下一阶段，因为某些阶段需要在将任何内容传递下去之前看到所有输入。想想 $sort，它在看到最后一个文档之前不知道最高或最低值是多少，或者\
  \ $group，它在看到每个文档之前无法知道每个分组是否完成。你会听到那些阶段被称为阻塞阶段，与流式阶段相对。流式阶段可以在完成自己的工作后继续流式传输每个文档批次，但阻塞阶段必须在任何文档传递给下一阶段之前接收所有文档。\n\
  \n\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_120_0.png)\n\n图 4.2：具有流式和阻塞阶段的聚合管道\n\
  \n在分片集群中，当管道涉及来自多个分片的文档时，MongoDB 会在合并结果之前尽可能在各个分片上执行管道，以分散工作负载。例如，过滤和转换阶段在分片上执行，减少了跨网络传输的数据量，而诸如分组或排序之类的操作仅在分片上进行初步工作，然后可能需要合并中间结果并在\
  \ mongos 路由器上完成工作。\n\nMongoDB 正在做很多工作来加速你的管道。这留给你的优化空间是什么？\n\n## 优化聚合管道\n\n聚合管道中阶段的顺序会显著影响性能。虽然\
  \ MongoDB 的查询优化器非常智能，可以自动重新排序阶段，但了解这些优化可以帮助你设计更好的管道。\n\nMongoDB 的查询引擎执行的管道与传递给查询优化器的管道略有不同。你可以使用\
  \ explain() 方法比较实际将要执行的管道与你编写的管道，该方法揭示了 MongoDB 为提高效率如何转换你的管道。使用 explain(\"executionStats\"\
  ) 或 explain(\"queryPlanner\") 运行聚合以检查 MongoDB 执行的转换后管道。使用 \"executionStats\" 还会显示从一个阶段流向下一个阶段的文档数量，以及到目前为止所花费的总时间。这使你可以看到哪些阶段耗时且应检查以便可能重构，以及哪些阶段对整体延迟的贡献极小，以至于在运行完整管道时尝试微调它们不会明显：\n\
  \n```\ndb.collection.explain(\"executionStats\").aggregate([{$match:{a:1 }}, {$match:{b:{$gte:2}}},\
  \ {$set:{x:\"$y\"}}, {$set:{a:\"$b\"}},{$project:{a:1, c:{$add:[\"$d\",\"$e\"]},\
  \ _id:0}}])\n{\n  stages: [\n    { '$cursor': { queryPlanner: {\n        parsedQuery:\
  \ {'$and':[ {a:{'$eq':1}}, {b:{'$gte':2}} ]}\n        winningPlan: {\n         \
  \ stage: 'PROJECTION_SIMPLE',\n          transformBy: { b: 1, d: 1, e: 1, y: 1,\
  \ _id: 0 },\n          inputStage: {\n            stage: 'IXSCAN',\n           \
  \ keyPattern: { a: 1, b: 1 },\n            // ...\n        },\n      },\n      executionStats:\
  \ {\n        executionSuccess: true,\n        nReturned: 45,\n        executionTimeMillis:\
  \ 2,\n        totalKeysExamined: 45,\n        totalDocsExamined: 45,\n        executionStages:\
  \ {\n          stage: 'PROJECTION_SIMPLE',\n          nReturned: 45,\n         \
  \ executionTimeMillisEstimate: 0,\n          transformBy: { b: 1, d: 1, e: 1, y:\
  \ 1, _id: 0 },\n          // ...\n        }\n      },\n    },\n]\nnReturned: Long('45'),\n\
  \    executionTimeMillisEstimate: Long('2')\n}, {\n    '$set': { x: '$y' },\n  \
  \  nReturned: Long('45'),\n    executionTimeMillisEstimate: Long('2')\n}, {\n  \
  \  '$set': { a: '$b' },\n    nReturned: Long('45'),\n    executionTimeMillisEstimate:\
  \ Long('2')\n}, {\n    '$project': { a: true, c: { '$add': [ '$d', '$e' ] }, _id:\
  \ false },\n    nReturned: Long('45'),\n    executionTimeMillisEstimate: Long('2')\n\
  } /* ... */ ]}\n```\n\n这里，你可以看到执行的阶段。第一个阶段称为 $cursor，尽管看起来它正在执行 $match 阶段。它在 transformBy\
  \ 字段中显示了它返回的字段，你可以看到 $set 和 $project 阶段几乎没有花费任何时间，因为每个阶段显示的是到该阶段为止累积花费的时间，这意味着每个非\
  \ $cursor 阶段的执行时间为 0 毫秒。\n\n## 优化技术\n\n让我们看看各种优化技术以及它们如何帮助你的管道运行更快。\n\n## 尽早过滤数据\n\
  \n虽然 MongoDB 会自动重新排序阶段，但了解这些重新排序背后的原理可以帮助你编写性能更好的管道。总体思路是尽可能早地减少数据量：\n\n- 尽可能早地放置\
  \ $match，并确保它可以由索引支持，这将确保只有必要的文档一开始就会被带入管道，减少需要从缓存（或更糟，从磁盘）读取并处理的文档数量\n- 尽可能早地在管道中放置\
  \ $sort，并确保它可以由索引支持\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_123_0.png)\n\n##\
  \ 避免过早使用 $project 阶段以保留管道优化\n\n手动删除不使用的字段是不必要的。管道优化阶段已经会自动为你完成这项工作，通过检查管道使用哪些字段并避免获取未使用的字段。这种自动管道优化可能会因添加不必要的早期显式包含\
  \ $project 阶段而被无意中破坏，因此不要在管道末尾之前使用 $project 来重命名或以其他方式将结果 reshape 为客户端期望的形式。\n\n\
  MongoDB 可以将某些阶段合并为单个更高效的阶段。这种合并减少了开销并加快了执行速度。作为最佳实践，你可以自行分组相似的操作并避免不必要的阶段以帮助优化器完成工作，但不要花费太多时间，因为其中一些阶段可能已经非常快。另一方面，通过做正确的事情，一些阶段可以显著加速：\n\
  \n- 当 $sort 阶段紧接着 $limit 阶段时，MongoDB 通过将它们合并并仅跟踪前 N 个排序文档来优化此操作，显著减少了排序的内存使用。这被称为\
  \ top-N 排序，其性能远高于对整个数据集进行排序然后仅保留前 N 个值。\n- 多个相邻的 $match 阶段通常会合并为单个 $match 阶段，将其过滤条件与隐式\
  \ AND 组合，因此你不需要自己合并它们。但请确保你有复合索引来支持合并过滤器中的条件。\n\n总的来说，当 MongoDB 查询系统可以优化的阶段被放置在管道早期时，它们会被下推到查询子系统，只有查询返回的文档才会在管道中处理。查看\
  \ explain 输出时，这通常表现为第一个阶段为 $cursor，并且会吸收所有早期阶段，如 $match、$sort 和 $limit。在没有进一步聚合阶段且完整的聚合管道可以用\
  \ find 命令表达的情况下，它实际上会与等效的 find 命令相同执行，并且 explain 不会显示任何额外的聚合阶段。\n\n在本节中，你看到了当某些阶段被放置在管道早期时如何被下推到查询子系统。它们应与等效查询以相同的方式进行优化。现在让我们看看一些其他可能具有挑战性的阶段和场景。\n\
  \n## 避免不必要的 $unwind 和 $group\n\n$unwind 阶段用于展平数组，常被误解为性能罪魁祸首，但实际上它本身并不慢或有问题。挑战在于对其结果的处理。当展开或展平数组是为了对结果文档应用某些阶段，但随后结果又使用\
  \ $group 重新分组（以 \"$_id\" 作为分组键，将它们重建回原始文档）时，使用 $unwind + $group 总是错误的。相反，应该在不解构文档的情况下使用一个或多个数组处理表达式。\n\
  \n$map 表达式允许你操作数组中的每个元素并返回结果数组，从而允许就地转换数组元素。其他数组表达式包括 $filter，它仅返回满足给定条件的数组元素，$sortArray\
  \ 用于对数组元素进行排序，以及 $reduce 用于在不展开的情况下在文档内聚合数组元素。\n\n当然，有时在 $group 之前展开是唯一正确的选择，特别是当你需要在多个文档中按单个数组元素分组时。在这种情况下，如果你不打算保留所有元素，可以在\
  \ $unwind 之前使用 $match 和 $elemMatch 对数组元素进行匹配。这允许你使用数组字段上的索引来提高性能。\n\n## 设计高效的 $group\
  \ 操作\n\n$group 阶段可能非常消耗内存，特别是在分组键基数很高或每个分组文档都很大时。$group 必须为遇到的每个唯一组维护当前状态。如果按其分组的字段（$group\
  \ 内部的 _id 字段）具有许多唯一值，此阶段可能需要在内存中存储比允许的更多数据（默认情况下，任何单个阶段的内存限制为 100 MB，我们稍后会讨论）。\n\
  \n为了控制分组大小，仅在分组中保留必要字段和值，并且除非绝对必要，否则避免使用 $push 整个传入文档。\n\n不同的累加器也可能具有不同的性能特征。诸如\
  \ $sum、$avg、$min、$max、$first 和 $last 之类的累加器通常是高效的，因为它们每个组只需要维护一个运行值。相比之下，当 $push\
  \ 和 $addToSet 将许多项累积到数组中时，尤其是这些项很大时，会更消耗内存。\n\n\n\n\nIf the input to $group is already\
  \ sorted by the group key and another value, the engine can optimize some groups\
  \ without storing all distinct group keys in memory simultaneously. For instance,\
  \ using a descending $sort followed by $group with $first to find the highest value\
  \ per group is significantly more performant than having a $group stage use $max\
  \ to compute the same highest value. Of course, this optimization relies on having\
  \ the index on $group + $first values to use:\n\n```\ndb.coll.explain(\"executionStats\"\
  ).aggregate([\n    {$sort:{state:1, groupId:1}},\n    {$group:{_id:\"$state\", firstGroup:{$first:\"\
  $groupId\"}}} ])\n{\n    \"stages\" : [\n        {\n            \"$cursor\" : {\n\
  \                \"queryPlanner\" : {\n                    \"namespace\" : \"test.coll\"\
  ,\n                    \"optimizationTimeMillis\" : 0,\n                    \"winningPlan\"\
  \ : {\n                        \"isCached\" : false,\n                        \"\
  stage\" : \"PROJECTION_COVERED\",\n                        \"transformBy\" : {\n\
  \                            \"groupId\" : 1,\n                            \"state\"\
  \ : 1,\n                            \"_id\" : 0\n                        },\n  \
  \                  \"inputStage\" : {\n                        \"stage\" : \"DISTINCT_SCAN\"\
  ,\n                        \"keyPattern\" : {\n                            \"state\"\
  \ : 1,\n                            \"groupId\" : 1\n                        },\n\
  \                        \"indexName\" : \"state_1_groupId\",\n                \
  \    }\n                }\n            }\n        }\n    ]\n}\n// ...\n```\n\nThe\
  \ explain output shows the DISTINCT_SCAN plan being used to find the first value\
  \ of each group.\n\n## Avoid common $lookup performance issues\n\nThe $lookup stage\
  \ enables *joins* between collections, but it can be a performance bottleneck if\
  \ not used with care. Understanding two *types* of $lookup is crucial:\n\n**Local/foreign\
  \ field lookups** (the *standard* form using `localField` and `foreignField`) compare\
  \ fields between collections using regular `find` semantics. MongoDB executes these\
  \ the same way as if you had a `$match` stage as the first *inner* pipeline stage,\
  \ which uses the value of `localField` in `find` with the `{foreignField: {$eq:\
  \ <localField-value>}}` condition when `localField` is a scalar, or `{foreignField:\
  \ {$in: <localField-array>}}` when the `localField` value is an array. This allows\
  \ all indexes on the `from` or foreign collection to be used the same way they are\
  \ used in normal `find` commands with the `$eq` or `$in` operators.\n\n> **Using\
  \ the pipeline option for enhanced joins**\n> \n> The pipeline option can be used\
  \ with *local/foreign* syntax to add more stages to implement additional join conditions,\
  \ reduce the size of returned documents (that go into an as array), and do any other\
  \ processing that the join requires.\n\n**Expressive lookups** (not using `localField`\
  \ and `foreignField` and only using the pipeline option) usually specify the join\
  \ conditions in an explicit `$match` stage that should be first in the pipeline,\
  \ and can reference fields from the input documents (assigned to variables in the\
  \ `let` option) in the sub-pipeline. When there is no condition depending on field(s)\
  \ from the input documents, this results in an *uncorrelated* subquery, which is\
  \ only executed once and then its results cached, rather than executing it once\
  \ for each incoming document in the pipeline. This syntax should only be used when\
  \ there is *no* equality join condition.\n\n> **Standard versus expressive $lookup**\n\
  > \n> The only difference between standard and expressive lookups is that one of\
  \ them includes `localField` and `foreignField` while the other one does not. They\
  \ can both specify `pipeline` to add stages to the $lookup execution.\n\nFor the\
  \ localField and foreignField forms, the most critical optimization is to have an\
  \ index on the foreignField in the foreign (from) collection. This allows MongoDB\
  \ to efficiently find matching documents. If the foreign documents are large but\
  \ you will only need a few fields, use $project as the last stage within the aggregation\
  \ defined in the pipeline field to only keep the necessary fields. If you expect\
  \ only one value to be returned in the as field and you don’t want to keep it as\
  \ an array of one, it’s totally free from a performance point of view to immediately\
  \ follow $lookup with the $unwind stage on the as field as the optimizer will absorb\
  \ the $unwind stage into the $lookup execution. There are additional optimizations\
  \ that are available if you plan to use $unwind on the as array; for example, a\
  \ $match stage on \"as.field\" that follows the $lookup, $unwind combination will\
  \ also be pushed down into $lookup as an additional filter:\n\n```\ndb.a.explain().aggregate([\n\
  \  { $lookup:{\n    from: \"b\",\n    localField: \"a._id\",\n    foreignField:\
  \ \"_id\",\n    as: \"details\"\n  }},\n  { $unwind: \"$details\" },\n  { $match:\
  \ { \"details.date\": { $gt: ISODate(\"2025-05-20T00:00:00.000Z\") } } }\n])\n{\
  \  \"stages\" : [\n    { \"$cursor\" : {\n        \"queryPlanner\" : {\n       \
  \   // ...\n        },\n        // ...\n      }},\n    { \"$lookup\" : {\n     \
  \   \"from\" : \"b\",\n        \"as\" : \"details\",\n        \"localField\" : \"\
  a._id\",\n        \"foreignField\" : \"_id\",\n        \"let\" : { },\n        \"\
  pipeline\" : [\n          { \"$match\" : {\n            \"date\" : { \"$gt\": ISODate(\"\
  2025-05-20T00:00:00Z\") }\n          }}\n        ]\n      }\n    }\n  ]\n}\n```\n\
  \n```\n],\n    \"unwinding\" : {\n        \"preserveNullAndEmptyArrays\" : false\n\
  \    }\n}}\n]}\n```\n\nThe explain output shows that the $unwind and $match stages\
  \ are both absorbed into the $lookup stage.\n\nOnly use the expressive pipeline\
  \ option with $lookup, when there is no equality condition on the join at all. In\
  \ this case, make sure the first stage in the sub-pipeline will be a $match stage\
  \ that uses indexed fields on the foreign collection. The $match stage will likely\
  \ use the $expr syntax to bring in variables from each input document that you set\
  \ via $let, so make sure the referenced field or fields in the foreign collection\
  \ is/are in an index.\n\n## Efficient use of $project and $addFields\n\n$project\
  \ and $addFields serve different purposes and have different performance implications.\
  \ Use $project for inclusion when you need to reshape documents by explicitly controlling\
  \ which fields to include and what to name them, usually only as the last stage\
  \ of the pipeline. Use $project for exclusion when you want to unset several fields.\
  \ You can use its alias $unset in this case for clarity.\n\nUse $addFields (or its\
  \ alias $set) when you want to add new fields or update/compute existing fields\
  \ while keeping all other existing fields unchanged. $addFields can also be used\
  \ to remove fields at the same time, by assigning the unneeded field the value $$REMOVE.\n\
  \nFor very complex calculations, it may be clearer to break the work into several\
  \ stages, each performing a part of the calculation. This can also improve readability\
  \ and maintainability. It’s not strictly necessary to do that, since using the $let\
  \ expression and creating temporary variables in your $addFields stage can make\
  \ writing very complex expressions easier, but multiple sequential $set stages won’t\
  \ significantly increase execution time on your pipeline, and likely won’t increase\
  \ it in a measurable way.\n\nKeeping all these techniques in mind will be extra-helpful\
  \ when your dataset size grows significantly.\n\n## Working with large datasets\n\
  \nMongoDB’s aggregation framework is designed to handle everything from bite-sized\
  \ collections to datasets that would make a data scientist sweat. But as your data\
  \ grows, so do the challenges. Let’s explore strategies for working with large datasets\
  \ and keeping your pipelines running smoothly.\n\n## Aggregation pipeline limits\n\
  \nMongoDB imposes several limits to keep your aggregations from running amok:\n\n\
  - **Result size restrictions:** Each document in the result must adhere to the 16\
  \ MB limit. The document maximum size limit also applies to documents that flow\
  \ between stages. The $facet stage can only return a single document, which cannot\
  \ be larger than 16 MB.\n- **Number of stages limit:** Pipelines can have up to\
  \ 1,000 stages. If you hit this, it’s probably time to rethink your approach!\n\
  - **Memory limit:** Individual aggregation stages are limited by default to 100\
  \ MB of RAM. If a stage exceeds this, the aggregation operation will leverage temporary\
  \ files on disk automatically since allowDiskUse has been enabled by default since\
  \ MongoDB version 6.0. This option can be disabled if needed for performance reasons,\
  \ but then pipelines with stages that exceed this threshold will fail and return\
  \ an error.\n\nThese limits are designed to protect your system from runaway workloads,\
  \ not to restrict thoughtful development. By understanding and working within them,\
  \ you can design aggregation pipelines that are both efficient and reliable, even\
  \ at scale.\n\n## Managing memory constraints with allowDiskUse\n\nBlocking stages\
  \ such as $group or unindexed $sort can be memory hogs, and because of that, there\
  \ is a 100 MB memory limit on them by default. When you hit that limit, data being\
  \ kept in memory automatically spills to disk using temporary files. This behavior\
  \ is controlled by the allowDiskUse option, which by default is set to true. You\
  \ have two options to avoid using disk for sorts:\n\n- **Optimize your pipeline**\
  \ to reduce memory usage (the better approach for performance)\n- **Explicitly disable\
  \ disk usage** with allowDiskUse:false, if you prefer operations to fail with an\
  \ error rather than slow down by having to read and write to disk\n\n\n\n\n虽然默认启用\
  \ allowDiskUse 为内存密集型操作提供了安全网，但需要注意磁盘 I/O 明显比内存操作慢得多。在低延迟至关重要的场景中，你可能希望通过设置 allowDiskUse:false\
  \ 来显式禁用它，这样操作宁愿快速失败，也不愿因磁盘使用而变慢。\n\n仅有某些聚合阶段受此限制；它们都是阻塞阶段：\n\n-   **未索引的大数据集上的 $sort\
  \ 操作：** 对大量文档进行排序 *没有索引的帮助* 且其后没有立即跟随 $limit，需要将所有待排序文档保存在内存中\n-   **具有高基数键和/或每个键产生大结果文档的\
  \ $group：** 如果 $group 阶段的 _id 中使用的字段有许多唯一值和/或每个分组需要维护大量数据，则该阶段需要在内存中为每个不同的组维护大量数据\n\
  -   **$bucket、$bucketAuto 和 $setWindowFields：** 这些阶段是 $group 的变体，在与 $group 相同的情形下可能消耗大量内存\n\
  \n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_130_0.png)\n\n## 阻塞阶段和内存使用注意事项\n\n并非所有阻塞阶段都可能或可能超过此阶段限制。例如，$count\
  \ 是一个阻塞阶段，需要计算所有传入文档，但由于它仅输出一个文档作为结果，其内存使用量微不足道。$sortByCount 阶段是一个阻塞阶段，它将所有输入分组为仅包含两个字段的小文档，但随后需要在内存中对它们进行排序。如果你没有在\
  \ $sortByCount 之后指定 $limit 阶段，并且你有超过 100 万个不同的分组键值，则结果可能超过 100 MB，但这种情况不太可能。你更可能使用\
  \ $limit 而不是向客户端返回数百万个结果。\n\n## 分布式环境中的聚合\n\n分片，我们在第 6 章《分片》中介绍，是 MongoDB 水平扩展的秘诀，但它为聚合管道增加了复杂性。当数据分布在多个分片上时，了解聚合在此分布式环境中的工作方式对于保持性能和避免瓶颈至关重要。\n\
  \n## 为分片集合优化聚合\n\n在分片集群中，聚合管道可以在各分片间并行执行。MongoDB 尝试将尽可能多的工作推送到保存聚合所需数据的每个分片，以最大限度地减少需要在网络上传输的数据量。\n\
  \n如果聚合查询可以通过驻留在单个分片（或一组分片）上的数据得到满足，mongos 将只把查询路由到相关的分片（们）。这是最有效的情况，因为它最大限度地减少了跨分片通信和协调开销。这通常发生在查询包含对分片键的过滤器时，或被聚合的集合仅存在于一个或少数几个分片上时。\n\
  \n如果聚合无法定向（例如，没有对分片键的过滤器且数据存在于多个分片上），mongos 会执行散布-收集操作。它将管道的第一部分发送到保存目标集合数据的所有分片。mongos\
  \ 然后收集结果并通过自行运行剩余管道来合并它们。也有一些场景下，合并阶段必须在选定的分片上发生，而不是在 mongos 上。\n\n分片键的选择可能决定聚合性能的成败。选择良好的分片键可以使许多聚合查询定向到单个分片，从而显著提高性能。相反，选择不当的分片键可能导致大多数聚合变成散布-收集操作，增加集群的延迟和负载。\n\
  \n## 理解分片本地与合并操作\n\n并非所有管道阶段都相同。有些可以在单个分片上执行，而其他一些必须在 mongos 上合并。使用 explain() 命令确定每个阶段运行的位置。输出将显示管道如何拆分，以及哪些部分在分片上执行，哪些在\
  \ mongos 上执行。\n\n所有流式阶段都可以在分片上运行，以及阻塞阶段的第一部分。在某些特殊情况下，即使是 $group 也可以完全在分片上运行，如果你按分片键分组。第一个无法完全在分片上运行的阻塞阶段的最后一部分，以及所有后续阶段，都必须在合并位置运行，通常是\
  \ mongos。\n\n尽可能多地在分片上进行处理，以减少网络流量并加快管道速度。如果聚合可以在单个分片上完全运行，则可避免网络延迟和 mongos 上的合并开销。\n\
  \n如果有 $group 阶段，且分组键是（或包含）分片键，每个分片都可以本地执行完整的分组操作，管道继续在本地进行，mongos 只需将结果返回给客户端而无需额外处理。如果分组键不同，或存在另一个阻塞阶段，则分片执行该阶段的初始部分，而\
  \ mongos 执行最终合并和所有后续阶段，这会给 mongos 增加更多工作。\n\n合并经常不可避免，但你可以最大限度地减少其影响。管道中的早期阶段（$match）应积极过滤掉文档。每个分片发送到\
  \ mongos 用于合并的数据越少，合并操作就越快。\n\n## 监控和剖析聚合性能\n\n即使是最精心设计的聚合管道也可能遇到性能问题。这就是为什么监控和剖析是任何\
  \ MongoDB 实践者必备技能的原因。\n\n你已经简要了解了 explain() 方法如何成为窥探聚合管道内部运作的窗口。它揭示了执行计划，显示每个阶段如何处理，使用了哪些索引，以及繁重的工作发生在何处。我们将在第\
  \ 12 章《高级查询和索引概念》中详细介绍 explain。\n\n要获取聚合的 explain 输出，请在 aggregate() 命令之前将 .explain()\
  \ 附加到集合名称，使用 aggregate 内部的 {explain:true} 选项，或在 mongosh 中将 .explain() 附加到 aggregate\
  \ 方法的末尾。常见的详细模式包括以下内容：\n\n-   **explain(\"queryPlanner\")**: 显示查询优化器选择的计划，包括阶段将如何执行以及索引如何被利用\n\
  -   **explain(\"executionStats\")**: 执行查询并返回有关执行的详细统计信息，例如返回的文档数（nReturned）、检查的总文档数（totalDocsExamined）、每个阶段后的总执行时间（execTimeMillis）以及索引使用情况\n\
  -   **explain(\"allPlansExecution\")**: 与 executionStats 相同，但包含有关 $cursor 阶段中被拒绝查询计划的附加信息和统计信息\n\
  \n使用 explain() 的主要目标是找到改进机会。查找 $match 或 $sort 操作的 inputStage 中的 COLLSCAN（集合扫描），而你期望的是\
  \ IXSCAN（索引扫描）。COLLSCAN 表示 MongoDB 必须读取集合中的所有文档才能找到相关文档，这通常效率低下。\n\n诸如 $group 或\
  \ $sort 之类的阶段，如果与前一阶段相比 execTimeMillis 增幅很高且处理了大量文档，则可能是内存密集型的。对于 $match 阶段，totalDocsExamined\
  \ 值相对于 nReturned 较高，表明过滤器选择性不强或未有效使用索引。\n\n你可以查看 $lookup 阶段是否使用了索引，如果使用了，其效率如何。你还可以确保使用的索引是你期望被选中的索引，如果不是，你可以查看是否有冗余的索引可以删除。你还可以查看阻塞阶段是否溢出到磁盘以及使用了多少磁盘空间。如果操作完全在内存中，你可以看到使用了多少内存，以及是否可能接近\
  \ 100 MB 限制，此时速度会大幅变慢。\n\n经验和剖析通常会揭示导致性能问题的常见模式。\n\n## 利用物化视图\n\n有时复杂聚合的速度可能慢于返回结果所需的\
  \ SLA，在这种情况下，你可以定期运行聚合，将其结果缓存到另一个集合中，客户端可以直接查询该集合。\n\n使用 $out 或 $merge 存储中间结果，因为这些阶段会将聚合管道的结果写入指定的集合，然后该集合可以被查询、建立索引或用作进一步聚合的输入。\n\
  \n## 总结\n\n让我们将本章中学到的内容提炼为关键原则，帮助你构建既强大又高效的聚合管道。首先，尽早过滤。你能做的最有影响力的优化往往是最简单的。每个能尽早排除的文档意味着后续每个阶段的工作量减少。这不仅仅是关于在开头添加\
  \ $match 阶段，尽管这是你能做的最有影响力的优化。它还包括在你知道不会使用所有文档时添加 $limit 以最小化数据流、不创建不会使用的字段，以及使用\
  \ explain 检查管道，确保仅传递必要的数据从一个阶段到下一个阶段。\n\n接下来，策略性地利用索引。索引不仅仅用于 find() 操作；它们对聚合性能至关重要。例如，初始\
  \ $match 阶段可以使用索引，就像常规查询一样；早期的 $sort 操作在可能时会使用索引；$lookup 会在 from 集合上使用索引；某些 $group\
  \ 操作也可以利用索引。关键是确保你的管道结构允许 MongoDB 使用这些索引。例如，当你同时需要过滤和排序时，请确保你有一个支持这两种操作的复合索引。\n\n\
  \n\nAlso, design with sharding in mind. In a sharded environment, understanding\
  \ how aggregation stages distribute across shards can make or break performance.\
  \ For best results, filter on the shard key early to target only specific shards,\
  \ minimize the number of shards involved, and be aware of which stages force a merge\
  \ (that is, stop parallel execution). Finally, monitor and measure performance.\
  \ Keep experimenting, keep measuring, and keep refining your approach. The most\
  \ elegant pipeline isn’t necessarily the one with the fewest stages; it’s the one\
  \ that balances readability, maintainability, and performance to deliver insights\
  \ accurately and efficiently.\n\nWith your data processing optimized, it’s time\
  \ to turn our attention to the pathways that carry your data.\n\nThe next chapter\
  \ explores replication, read preference, and write concern, which are essential\
  \ for maintaining data availability, consistency, and performance across distributed\
  \ systems.\n"
- "# 5 Replication\n\n## Replication\n\nIn this chapter, you'll learn how MongoDB\
  \ uses replication for continuous operation and automatic failover. Replica sets\
  \ orchestrate data synchronization across multiple nodes, ensuring your application\
  \ stays online when hardware or network issues arise. You'll see why the right combination\
  \ of nodes is crucial for reliability, and how features such as read preference\
  \ and write concern let you tune your system for performance, consistency, and durability.\n\
  \nYou will learn about processes such as elections and failover, and dive into advanced\
  \ replica set configurations that provide workload isolation, reduce network strain,\
  \ and keep analytics from interfering with operational queries. By the end of this\
  \ chapter, you'll have the tools to design, configure, and monitor replica sets\
  \ for robust MongoDB deployments.\n\nThis chapter will cover the following topics:\n\
  \n- How replica sets ensure high availability and automatic failover\n- The roles\
  \ of primary, secondary, and arbiter nodes\n- Strategies for balancing performance,\
  \ consistency, and durability with read/write settings\n- Monitoring replication\
  \ health, diagnosing lag, and handling failover\n- Advanced features such as chained\
  \ replication, analytics nodes, and optimal oplog sizing\n\n### Understanding MongoDB\
  \ replica sets\n\nMongoDB replication ensures data availability and system resilience\
  \ by maintaining copies of data across multiple servers, organized into a replica\
  \ set. Within this set, a single primary server handles write operations, while\
  \ secondary servers maintain copies of the data, enabling read requests and providing\
  \ failover capabilities. Read preference controls which servers are utilized for\
  \ read operations, giving you greater control over which nodes are sent read operations.\n\
  \nWrite concern determines the level of confirmation the database provides after\
  \ a write operation, allowing you to fine-tune the trade-off between write speed\
  \ and data durability.\n\nThese elements combined create a system that can tolerate\
  \ server failures and manage heavy read loads. Put simply, **replication** makes\
  \ data copies, **read preference** chooses where to read from, and **write concern**\
  \ dictates the confirmation level needed after writing data, resulting in a robust\
  \ database system.\n\n### Components of a replica set\n\nA typical MongoDB replica\
  \ set includes an odd number of nodes to provide fault tolerance and high availability,\
  \ and consists of one primary node and one or more secondary nodes:\n\n- **Primary:**\
  \ The primary node is responsible for handling all write operations. It maintains\
  \ the latest state of the data and propagates changes to the secondary nodes.\n\
  - **Secondaries:** Secondary nodes continuously replicate the primary’s data to\
  \ maintain updated copies. They can also serve read operations if the application\
  \ is configured to allow secondary reads.\n- **Arbiters (optional):** An arbiter\
  \ node participates in elections but does not store data. Arbiters are not recommended\
  \ for use in production configurations; however, if system limitations prevent storing\
  \ data, they can be used to break ties in voting scenarios when you have an even\
  \ number of data-bearing nodes.\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_136_0.png)\n\
  \n*Figure 5.1: MongoDB replica set architecture*\n\nReplica sets use an election\
  \ process to ensure high availability. If the primary node becomes unavailable,\
  \ an election is triggered to select a new primary. The election process follows\
  \ these steps:\n\n- 1. A node calls for an election if it believes it can become\
  \ the primary (for example, if a secondary cannot see a primary).\n- 2. Nodes cast\
  \ votes based on factors such as priority settings, replication state, and availability.\n\
  - 3. The node that receives the majority of votes is elected as the new primary.\n\
  \nWhen designing a MongoDB replica set for optimal performance, you need to carefully\
  \ consider the number of nodes, their placement, and how to configure election and\
  \ read preferences. A well-designed replica set configuration can help you balance\
  \ throughput, fault tolerance, and latency requirements while ensuring high availability\
  \ for your application.\n\nHaving an odd number of voting members in a MongoDB replica\
  \ set is essential to ensuring that the election process can be completed successfully.\
  \ When only an even number of voting members are available, it’s more likely that\
  \ a quorum cannot be reached and the successful election of a new primary may be\
  \ delayed.\n\nIn some deployments, additional secondary nodes may be added to distribute\
  \ read workloads or support analytics without impacting the primary’s performance.\
  \ This configuration ensures the high availability of data while also enabling workload\
  \ isolation through read targeting.\n\n> **Secondaries are for redundancy, not scalability**\n\
  > \n> Though read preference enables you to target secondaries for reads, this is\
  \ not meant to be a mechanism for scaling reads across the cluster. Secondaries\
  \ provide the cluster with high availability and resilience.\n\n### Replication\
  \ and high availability\n\nAs long as a cluster has a minimum of three nodes (the\
  \ default in MongoDB Atlas), it will be fault-tolerant and resilient out of the\
  \ box. In the case of a primary member outage, a replica set election process automatically\
  \ detects the failure, elects a secondary member as a replacement, and promotes\
  \ that secondary member to become the new primary.\n\nThe entire election and failover\
  \ process happens within seconds, without manual intervention.\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_138_0.png)\n\
  \n*Figure 5.2: MongoDB replica set failover process*\n\nFailover time is dependent\
  \ on several factors, including network latency. The MongoDB election process is\
  \ designed to avoid unnecessary failover and provide flexibility for different deployment\
  \ needs.\n\nTo minimize downtime during failovers, proper election configuration,\
  \ including appropriate priorities and timeouts, is crucial for ensuring a swift\
  \ and seamless transition of leadership among replica set members:\n\n- **Node priority**:\
  \ Assign higher priority values to nodes to influence election outcomes.\n- **Election\
  \ timeouts**: Configure electionTimeoutMillis to balance between quick failover\
  \ and avoiding unnecessary elections due to temporary network issues. The default\
  \ of 10,000 (10 seconds) should be suitable for most configurations.\n\nReplica\
  \ set members exchange heartbeat messages every 2 seconds to monitor each other’s\
  \ status. If the connection fails due to a network error, depending on the member\
  \ being monitored, a primary that doesn’t receive a heartbeat from a majority of\
  \ voting members will step down, whereas a secondary that doesn’t receive a heartbeat\
  \ from the primary can call for an election. If there isn’t a network failure, and\
  \ a response isn’t received within the electionTimeoutMillis threshold, the same\
  \ action will also be taken.\n\n### Understanding the MongoDB election process\n\
  \nAs just mentioned, a MongoDB replica set uses a fully automated election process\
  \ to determine which set member will become the new primary member. Replica sets\
  \ can trigger an election in response to a variety of events, such as the following:\n\
  \n- Losing connectivity to a primary member for more than the configured time-out\
  \ (for MongoDB Atlas, the default is 5 seconds, or 10 seconds otherwise)\n- Adding\
  \ a new node to the replica set\n- Performing replica set maintenance\n\nDuring\
  \ any of these events, sophisticated algorithms control the member election process.\
  \ The election algorithm processes a range of parameters, including a historical\
  \ analysis to identify those replica set members that have applied the most recent\
  \ updates from the primary, heartbeat (ping or connectivity) status, and user-defined\
  \ priorities assigned to replica set members. This process ensures that the most\
  \ suitable secondary member is promoted to primary. Once the new primary replica\
  \ set member has been elected, the remaining secondary members automatically start\
  \ replicating from the configured sync source, as explained in the upcoming *Chained\
  \ replication* section. If the original primary comes back online, it will recognize\
  \ that it is no longer the primary and reconfigure itself to become a secondary\
  \ member of the replica set and begin catching up.\n\n### Replica set configuration\n\
  \nIn this section, we delve into specialized replica set configurations that extend\
  \ beyond basic primary-secondary setups. These advanced techniques can help you\
  \ optimize performance, reduce operational overhead, or cater to specific workload\
  \ requirements. While each feature introduces additional complexities, they can\
  \ prove invaluable for teams looking to fine-tune their MongoDB deployments.\n\n\
  > **Note**\n> Replica set reconfiguration is not available in MongoDB Atlas.\n\n\
  \n\n## 链式复制\n\n默认情况下，secondaries 可以从 primary 或另一个 secondary 拉取数据更改（oplog entries）。链式复制使\
  \ secondary 能够从另一个 secondary 获取 oplog 数据。这种方法有助于在大型或分布式部署中减轻 primary 的网络负载。链式复制的工作方式如下：\n\
  \n- 1. MongoDB 确定最近或最佳的 secondary 作为同步源。\n- 2. 同步的 secondary 持续从该 secondary 源而不是\
  \ primary 获取 oplog 条目。\n- 3. 更改通过副本集传播，同时 primary 节点的带宽使用量减少。\n\n尽管链式复制有许多优点，但也存在一些缺点：\n\
  \n| 优势 | 劣势 |\n|---|---|\n| 助力全球分布式部署：远程区域的 secondary 节点可以从地理位置更近的源拉取，减少延迟 | 链中延迟增加：如果下游\
  \ secondary 落后，链中依赖它的节点也会落后 |\n| 优化网络流量：特别有利于多区域部署，其中区域间的网络带宽可能有限或昂贵 | 故障排除复杂性：更长的复制路径可能会使诊断复制问题变得复杂\
  \ |\n| — | 级联延迟：影响中间节点的网络问题可能会影响多个下游 secondaries |\n\n*表 5.1：MongoDB 副本集中的链式复制的优势和劣势*\n\
  \n您可以从连接到集群的 MongoDB Shell 调整副本集配置，以允许（或禁止）链式复制：\n\n```\ncfg = rs.conf();\ncfg.settings\
  \ = cfg.settings || {};\n// true allows secondaries to replicate from other secondaries\n\
  // false restricts them to replicate only from the primary\ncfg.settings.chainingAllowed\
  \ = true;\nrs.reconfig(cfg);\n```\n\n> **Note**\n> \n> 链式复制默认启用；然而，在 MongoDB Atlas\
  \ 中，它对单区域副本集是禁用的。\n\n使用链式复制时，监控变得更加关键。以下脚本也可以从连接到集群的 MongoDB Shell 运行，将打印每个副本集成员的同步源和状态信息：\n\
  \n```\n// Check the sync source for each member\nrs.status().members.forEach(function(member)\
  \ {\n  print(\"Member: \" + member.name +\n    \", Sync Source: \" + (member.syncSourceHost\
  \ || \"none\") +\n    \", State: \" + member.stateStr);\n});\n```\n\n如果启用了链式复制，请更密切地监控复制延迟和多数写入关注点延迟，尤其是在高延迟环境中。\n\
  \n## 副本集标签和分析节点\n\nMongoDB Atlas 提供分析节点，这些是专门的只读节点，用于隔离您不希望影响操作工作负载的查询。它们对于处理分析数据很有用，例如\
  \ BI 工具执行的报告查询。在副本集的上下文中，分析节点类似于其他 secondary 成员，但优先级为 0 且不能被选举为主节点。然而，通过副本集标签配置，它们可以从典型的操作工作负载中排除，并使用适当的读偏好专门针对其他工作负载。\n\
  \n例如，要为分析配置成员，可以应用以下副本集重新配置：\n\n```\nconf = rs.conf();\nconf.members[0].tags = {\
  \ \"usage\": \"production\" };\nconf.members[1].tags = { \"usage\": \"reporting\"\
  \ };\nconf.members[2].tags = { \"usage\": \"production\" };\nrs.reconfig(conf);\n\
  ```\n\n我们已将标签标识为 usage: reporting 的分析节点，可以通过使用适当的读偏好配置来针对特定工作负载，如以下示例所示：\n\n```\n\
  db.collection.find({}).readPref(\"secondary\", [{ \"usage\": \"reporting\" }]);\n\
  ```\n\n副本集标签无法直接在 MongoDB Atlas 中配置；然而，Atlas 提供了一组预定义的副本集标签，可用于工作负载隔离，其中一些如下：\n\n\
  | 预定义标签名称 | 描述 | 示例 |\n|---|---|---|\n| nodeType | 节点类型。可能的值如下：\n- ELECTABLE\n-\
  \ READ_ONLY\n- ANALYTICS | {\"nodeType\" : \"ANALYTICS\"} |\n| provider | 节点所配置的云提供商。可能的值如下：\n\
  - AWS\n- GCP\n- AZURE | {\"provider\" : \"AWS\"} |\n| region | 节点所在的云区域。 | {\"region\"\
  \ : \"US_EAST_2\"} |\n\n表 5.2：MongoDB 副本集成员的常见预定义标签名称\n\n有关 MongoDB Atlas 中可用的预定义副本集标签和可能区域值的完整列表，请参阅\
  \ https://www.mongodb.com/docs/atlas/reference/replica-set-tags。\n\n如果应用程序执行复杂或长时间运行的操作，例如\
  \ **提取**、**转换** 和 **加载 (ETL)** 或报告，您可能希望通过将这些查询专门定向到分析节点来将应用程序的查询与其余操作工作负载隔离开来。这可以基于前述的预定义标签为连接到\
  \ MongoDB Atlas 集群的应用程序进行配置，如下所示：\n\n```\nmongodb+srv://<db_username>:<db_password>@abc123.mongodb.net/test?readPreference=secondary&readPreferenceTags=nodeType:ANALYTICS\n\
  ```\n\n使用前述连接字符串配置应用程序将确保所有读取仅针对应用了 nodeType:ANALYTICS 标签的 secondary 成员。\n\n> **Note**\n\
  > \n> MongoDB Atlas 中的分析节点配置的优先级为 0，这会阻止它们被选举为主节点。\n\n## 复制内部机制和性能\n\nMongoDB 中的复制涉及在管理延迟和资源使用的同时保持节点间数据同步的机制。oplog、写入速率的控制以及节点间的延迟等因素都会影响整体性能。平衡这些元素对于维护数据一致性和可用性很重要。在本节中，我们将查看\
  \ MongoDB 复制内部和性能考虑的关键方面。\n\n### 流量控制\n\n流量控制是 MongoDB 中的一项功能，当 secondaries 落后太远时，限制\
  \ primary 应用新操作的速率。这有助于防止过度的复制延迟，以换取与写入确认相关的略微更高的延迟。\n\nMongoDB 提供内部参数来微调流量控制行为。例如，flowControlTargetLagSeconds\
  \ 参数定义在触发流量控制之前可接受的延迟阈值，如下所示：\n\n// Check current flow control settings\ndb.adminCommand({\
  \ getParameter: 1, flowControlTargetLagSeconds: 1 });\n\n// Configure flow control\
  \ settings\ndb.adminCommand({\n  setParameter: 1,\n  flowControlTargetLagSeconds:\
  \ 10\n});\n```\n\n大多数用例的默认设置 10 秒应该是最佳的，不建议调整它。\n\n**Note**\n`setParameter` 管理命令在\
  \ MongoDB Atlas 中不可用。\n\n### 复制和 oplog\n\n**操作日志 (oplog)** 是 MongoDB 复制的核心组件。它是一个特殊的\
  \ capped 集合，其中节点记录所有写操作。Secondary 节点使用 oplog 来复制更改并与 primary 保持同步。\n\n以下是 oplog\
  \ 的一些关键特性：\n\n- **固定集合：** oplog 默认具有固定大小，按先进先出（FIFO）方式运行。当 oplog 达到其大小限制时，较旧的条目会自动删除。\n\
  - **复制过程：** Secondary 节点持续从 primary 应用 oplog 条目以复制更改。\n- **性能考虑：** oplog 的适当大小至关重要。如果\
  \ oplog 太小，secondary 节点可能会落后并需要完全重新同步。相反，过度大小的 oplog 可能会消耗不必要的存储。\n\n假设您的工作负载每小时产生\
  \ 2 GB 的更新。为了确保平滑复制，oplog 应按大小设置以存储数小时的操作，通常超过 24 到 48 小时。这降低了 secondary 节点暂时离线时长时间重新同步的风险。\n\
  \n例如，如果您将 oplog 大小配置为 10 GB，这将提供大约 5 小时的操作历史记录。此缓冲区允许 secondary 节点在短暂的网络中断或维护期间赶上，而无需完全数据重新同步，但如果节点故障导致恢复时间超过\
  \ 5 小时，则可能太短。\n\n更大的 oplog 为 secondaries 提供了更长的窗口，如果它们因网络问题、资源限制或维护而落后，可以赶上。这在高吞吐量环境中或在\
  \ secondary 节点计划停机期间尤其重要。\n\n要确定部署的适当 oplog 大小，请考虑以下因素：\n\n-   您的应用程序的平均写入量和峰值写入量\n\
  -   潜在中断的预期最大持续时间\n-   数据中心之间的网络可靠性（适用于地理分布式部署）\n-   从节点数量（更多的从节点可能需要更大的窗口）\n\n\
  MongoDB 提供了工具来监控 oplog 使用情况并估算当前窗口：\n\n// Check oplog size and replication window\n\
  db.printReplicationInfo();\n\n// Sample output:\n// configured oplog size: 5120MB\n\
  // Log length start to end: 86400secs (24hrs)\n// oplog first event time: Wed Apr\
  \ 02 2025 10:03:25 GMT+0000\n// oplog last event time: Thu Apr 03 2025 10:03:25\
  \ GMT+0000\n// now: Thu Apr 03 2025 10:05:01 GMT+0000\n```\n\noplog 边界可以通过以下两种方式之一设置，大小和时间：\n\
  \n-   size：oplog 的最大大小（以兆字节为单位），可以配置为 990 MB 到 1 PB 之间的任意值\n-   minRetentionHours：保留\
  \ oplog 条目的最少小时数\n\n由于 oplog 是一个固定集合，当达到这些配置的边界时，oplog 中最旧的条目将被删除。\n\n将 oplog 的配置大小从当前值更改为\
  \ 16 GB 可以按如下方式进行：\n\n```\ndb.adminCommand({ \"replSetResizeOplog\": 1, size: Double(16384)})\n\
  ```\n\n类似地，如果您希望确保始终有恰好 48 小时的 oplog 内容可用，而不是固定大小，则命令如下：\n\n```\ndb.adminCommand({\
  \ \"replSetResizeOplog\": 1, minRetentionHours: 48})\n```\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_145_0.png)\n\
  \n## 使用 minRetentionHours 时磁盘空间耗尽的风险\n\n当配置了 minRetentionHours 时，oplog 可以无限制地增长以保留配置小时数的\
  \ oplog 条目。这可能由于高写入量和大保留期相结合导致系统磁盘空间减少或耗尽。\n\n使用 replSetResizeOplog 更改给定副本集成员的 oplog\
  \ 大小或最小 oplog 保留期不会更改副本集中任何其他成员的 oplog 大小。您必须在集群中的每个副本集成员上运行 replSetResizeOplog，以更改所有成员的\
  \ oplog 大小或最小保留期。\n\n## 管理复制延迟\n\n复制延迟发生在从节点无法跟上主节点处理的事务速率时。如果滞后的节点需要成为主节点，这可能导致读取数据陈旧以及故障转移时间延长。为了最小化复制延迟，请考虑实施以下策略：\n\
  \n| 策略 | 操作 | 考虑因素 |\n|---|---|---|\n| 优化网络 | 将从节点放置在更靠近主节点的位置或升级网络链路。 | 考虑副本集成员之间的专用网络链路。实施复制流量的带宽优先级。\
  \ |\n| 扩展资源 | 增加 CPU、内存或磁盘 I/O 容量。 | 升级现有节点的硬件。 |\n| 改进读取工作负载定位 | 将密集查询卸载到专为分析而定制的专用从节点，保持其余副本集平衡。\
  \ | 配置读取偏好以将特定工作负载定向到适当的节点。 |\n\n*表 5.3：减少 MongoDB 副本集中复制延迟的策略*\n\n通过这些策略主动解决复制延迟，您可以确保更快的故障转移、更一致的读取性能以及\
  \ MongoDB 副本集整体更高的稳定性。基于工作负载模式的定期监控和微调将有助于在部署扩展时保持最佳的复制健康状态。\n\n## 读取和写入策略\n\nMongoDB\
  \ 提供了跨副本集优化读取和写入的灵活策略。读取偏好设置决定哪些节点处理读取查询，在一致性、可用性或延迟之间取得平衡。写入关注点定义了必须确认写入的节点数量，影响数据持久性与写入延迟。\n\
  \n仔细调整这些策略有助于管理延迟并保持弹性。在本节中，我们将介绍 MongoDB 中读取和写入操作的关键方法和注意事项。\n\n## 读取偏好\n\n副本集将包含一个以上可以处理操作的服务器，并且\
  \ MongoDB 的客户端库可以根据配置的读取偏好执行服务器选择，以确保操作被路由到期望的服务器。\n\n默认情况下，应用程序将其读取操作定向到副本集中的主成员（即读取偏好模式为\
  \ \"primary\"）；但是，客户端可以指定读取偏好以将读取操作发送到从节点。\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_147_0.png)\n\
  \n*图 5.3：跨数据中心的 MongoDB 读取偏好行为*\n\n读取偏好由读取偏好模式以及可选的标签集列表和 maxStalenessSeconds 选项组成。由于副本集成员可能落后于主节点（由于网络拥塞、磁盘吞吐量低、长时间运行的操作等因素），读取偏好\
  \ maxStalenessSeconds 选项允许您为从节点读取指定最大复制延迟或陈旧度。\n\n当从节点的估计陈旧度超过 maxStalenessSeconds\
  \ 时，客户端将停止将其用于读取操作。默认情况下，没有最大陈旧度，客户端在选择将读取操作定向到何处时不会考虑从节点的延迟；但是，在配置此选项时，您必须指定 90\
  \ 秒或更长的值。\n\n有许多读取偏好模式可用，它们在最大化可用性和一致性或最小化延迟方面提供不同程度的灵活性。\n\n| 读取偏好模式 | 描述 |\n|---|---|\n\
  | primary | 默认读取偏好，所有操作都从当前副本集主节点读取。<br><br>为了最大化一致性并避免陈旧读取，应使用此读取偏好模式。 |\n| primaryPreferred\
  \ | 在大多数情况下，操作从主节点读取，但如果主节点不可用，则操作从从节点成员读取。<br><br>此读取偏好模式允许最大可用性，只要主节点可用，一致的读取操作就会被提供。如果主节点不可用，您仍然可以查询从节点。\
  \ |\n| secondary | 所有操作都从副本集的从节点成员读取。 |\n| secondaryPreferred | 操作通常从副本集的从节点成员读取数据。如果副本集只有一个主成员且没有其他成员，则操作从主成员读取数据。\
  \ |\n| nearest | 为了最小化延迟，操作基于指定的延迟阈值从随机合格的副本集成员读取，而不考虑该成员是主节点还是从节点。操作在计算延迟时考虑以下因素：<br>-\
  \ localThresholdMS 连接字符串选项<br>- maxStalenessSeconds 读取偏好选项<br>- 任何指定的标签集列表 |\n\n\
  *表 5.4：MongoDB 读取偏好模式*\n\n对于地理分布的应用程序，nearest 读取偏好可以进一步提高读取性能，因为操作将被路由到具有最小延迟窗口的任何成员，如\
  \ localThresholdMS（默认 15 毫秒）所定义。\n\n如果副本集成员或成员与标签相关联，您可以在读取偏好中指定标签集列表（标签集数组）以定位这些成员。\n\
  \n例如，考虑以下包含三个标签集的标签集列表：\n\n```\n[ { \"region\": \"South\", \"datacenter\": \"A\"\
  \ }, { \"rack\": \"rack-1\" }, { } ]\n```\n\n首先，MongoDB 尝试查找同时标记为 \"region\": \"\
  South\" 和 \"datacenter\": \"A\" 的成员。如果找到成员，则不再考虑剩余的标签集。相反，MongoDB 使用此标签集查找所有合格成员。\n\
  \n如果未找到成员，则接下来尝试 { \"rack\": \"rack-1\" }，然后是最终标签 { }，它将匹配任何合格成员。\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_149_0.png)\n\
  \n**注意**\n\n标签和 maxStalenessSeconds 与 primary 读取偏好模式不兼容。\n\n读取偏好配置允许应用程序根据特定需求定位主或从副本集成员。这可以通过在多个节点之间分配读取负载来增强性能和可用性，减少延迟，并在主节点不可用时确保持续访问数据。\n\
  \n## 写入关注点与持久性\n\n在 MongoDB 副本集中，写入关注点是一个重要的配置选项，它决定了客户端在执行写入操作时从数据库要求的确认级别。此机制直接影响数据持久性与系统性能之间的微妙平衡。\n\
  \n从 MongoDB 5.0 开始，隐式默认写入关注点是 w:\"majority\"。使用此写入关注点，写入请求确认计算出的多数数据承载投票成员已将更改持久写入其本地\
  \ oplog。计算出的多数是通过取以下两者的较小值来确定的：\n\n-   所有投票成员（包括仲裁者）的大多数\n-   所有数据承载投票成员的数量。\n\n\
  \n\n副本集的写入关注度描述了在操作返回成功之前必须确认写操作的承载数据的成员数量（即主节点和从节点，但不包括仲裁节点）。\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_150_0.png)\n\
  \n*图 5.4：MongoDB 中具有多数确认的写入关注度*\n\n发出写操作的应用程序会等待主节点收到指定写入关注度所需数量的成员确认。对于 w 大于 1\
  \ 或 w: \"majority\" 的写入关注度，主节点会等待所需数量的从节点确认写入后，才返回写入关注度确认。对于 w:1 的写入关注度，主节点可以在本地应用写入后立即返回写入关注度确认，因为它有资格计入请求的写入关注度。\n\
  \n确认写入的成员越多，如果主节点失败，已写入的数据回滚的可能性就越小。然而，指定较高的写入关注度会增加延迟，因为客户端必须等待收到请求的写入关注度确认级别。\n\
  \n写入关注度使用两个主要参数指定：w 和 wtimeout。第一个参数（w）决定必须确认写入的节点数量，并可接受以下值配置：\n\n- 数值（1、2、3）：副本集成员的具体数量\n\
  - \"majority\"：（默认）多数投票成员必须确认\n- 副本集标签：自定义的副本集成员子集\n\n第二个参数（wtimeout）指定写操作在主节点成功后向足够多的成员传播以达到写入关注度的时限，单位为毫秒。如果超过\
  \ wtimeout 值并向客户端返回写入关注度错误，写操作很可能仍然会成功；然而，客户端不会在此期间之后继续等待确认。默认情况下，wtimeout 为“infinity”，因此如果您希望应用程序返回错误而不是等待复制到集群计算出的多数节点成功，您应提供自己的适当\
  \ wtimeout 值。\n\n以下示例演示了在插入操作上设置自定义写入关注度，确保写入已由计算出的多数节点确认，并且如果在 5 秒内未得到确认则返回写入关注度错误：\n\
  \n```\ndb.collection.insertOne(\n  { item: \"example\" },\n  {\n    writeConcern:\
  \ {\n      w: \"majority\",\n      wtimeout: 5000\n    }\n  }\n);\n```\n\n所有 MongoDB\
  \ 驱动程序都提供在连接级别和每个操作基础上指定写入关注度的能力，从而实现精细控制。\n\n您可以通过发出 setDefaultRWConcern 命令来修改全局默认写入关注度。从\
  \ MongoDB Shell 中，假设您拥有适当的权限，可以按如下方式修改此值：\n\n```\ndb.adminCommand({\n  \"setDefaultRWConcern\"\
  \ : 1,\n  \"defaultWriteConcern\" : {\n    \"w\" : 2\n  }\n})\n```\n\n前面的示例将全局写入关注度设置为\
  \ w:2。如果您发出具有特定写入关注度的写操作，写操作将使用其自身的写入关注度而不是默认值。\n\n我们建议将 w 保留在其默认的 \"majority\"\
  \ 值，即使看起来不等待复制延迟会更好。请记住，如果从节点开始落后，流控制将启动并开始限制您的写入。\n\n## Summary\n\nMongoDB 的复制系统为构建高可用且容错的数据库部署提供了坚实的基础。副本集架构结合选举自动故障转移，确保数据库在节点故障时仍能保持数据完整性。oplog\
  \ 是复制过程的支柱，使从节点能够与主节点保持同步。\n\n在设计副本集时，请考虑诸如数据的地理分布以及适合您工作负载特征的 oplog 大小等因素。这些决策将显著影响数据库的弹性、性能以及满足应用程序特定需求的能力。\n\
  \n请记住，适当的配置不是一次性任务，而是一个持续的过程，应随着应用程序的增长和需求变化而演进。通过持续观察和迭代改进，即使 MongoDB 部署扩展，您也可以保持最佳的复制行为。\n\
  \n在下一章中，我们将探讨 MongoDB 的分片如何与复制协同工作，为具有大型数据集和高吞吐量需求的部署提供水平扩展能力。\n"
- "# 6 Sharding\n\n## Sharding\n\n随着现代应用程序生成和存储越来越庞大的数据，确保高性能和可扩展性成为任何数据库系统的关键关注点。MongoDB\
  \ 的分片架构是一种解决方案，旨在为具有海量数据集和苛刻吞吐量需求的应用程序提供水平扩展。与通常导致昂贵且受限于大小的硬件升级的传统垂直扩展相比，分片通过在多个服务器之间分发数据，提供了一种更高效、更具成本效益的扩展方式。了解分片架构将帮助您处理用户活动激增、全球扩展和不断增长的数据复杂性。\n\
  \n本章深入探讨 MongoDB 分片架构的基础原理，使您能够了解分片如何与复制交互以实现高可扩展性和可靠性。我们将首先检查分片集群的核心组件及其在路由和数据分发中的作用。从那里，我们将探讨诸如选择最佳分片键等关键方面。最后，我们将解决诸如分片键优化、战略数据放置以及处理大规模导入和重新分片操作等实践考虑。通过本章结束时，您将对\
  \ MongoDB 的分片生态系统有深入的了解，能够设计支持应用程序不断变化的数据需求的可扩展架构。\n\n本章将涵盖以下主题：\n\n- 分片如何通过在副本集之间分发数据来实现水平扩展\n\
  - 分片集群中 shards、mongos 进程和 config servers 的角色和功能\n- 选择高效分片键以优化数据分布和查询定位的策略\n- 比较针对不同工作负载的基于范围、哈希和基于区域的分片方法\n\
  - 使用重新分片在不中断服务的情况下重新分发数据并解决性能瓶颈\n- 将相关数据 colocate 以提高事务和聚合查询性能的技术\n- 配置和监控均衡器以有效管理块迁移\n\
  - 优化分片键以解决诸如巨块或粒度差等问题的方法\n\n## Understanding core sharding architecture\n\nMongoDB\
  \ 的分片与复制协同工作，为具有大型数据集和高吞吐量需求的部署提供 **水平扩展**。传统上，当工作负载超出数据库服务器的能力时，必须升级到更大的服务器。这被称为\
  \ **垂直扩展**，它在任何特定服务器的最大尺寸和价格性能比方面都有限；超级计算机往往非常昂贵！相反，如果您可以将工作负载分发到多个较小的服务器，您可以理论上几乎无限地水平扩展工作负载，理想情况下成本随服务器数量线性增长。当您的工作负载超出单个副本集的能力时，MongoDB\
  \ 分片允许您这样做。\n\n如果您的工作负载有多个相对彼此隔离的不同数据库，为每个数据库部署单独的副本集是完全可以的。例如，您可能为用户、账户和用户活动分别部署副本集。然而，随着时间的推移，即使是单个集群也可能无法处理您整体应用程序工作负载的特定子集。那时就需要将工作负载分片或分区到多个分片中，每个分片本身都是一个副本集。\n\
  \n因此，当您的数据增长超出单个副本集的处理能力时，分片会将其分发到多个副本集，每个副本集包含您数据的一个子集。这种水平扩展使 MongoDB 能够处理海量数据集和高吞吐量需求。本节回顾分片集群的架构及其重要的性能要素。\n\
  \n## Architectural components of a sharded cluster\n\n分片集群由多个组件组成：**shards**（每个都是负责集群中数据子集的副本集）、**mongos\
  \ processes**（主要负责将操作路由到不同分片并将结果返回给客户端）和 **config servers**（一个特殊的副本集，维护有关分片配置和集群中数据位置的元数据）。从\
  \ MongoDB 8.0 版本开始，config servers 不需要是单独的服务器，可以与其中一个分片嵌入。\n\n\n\nmongos 是这里最有趣的组件，因为从驱动程序或客户端应用程序的角度来看，它就像数据库一样，接受\
  \ CRUD 操作请求并将结果返回给驱动程序。另一方面，当它与分片通信时，它充当驱动程序的代理，将 CRUD 操作发送给它们，然后将结果转发回驱动程序。通常，在生产环境的分片集群中会有多个\
  \ mongos 进程。图 6.1 显示了分片集群的所有组件以及应用程序如何连接到它。\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_155_0.png)\n\
  \n具有专用配置服务器的集群\n\n*图 6.1：分片集群架构*\n\n但是 mongos 如何知道要将操作转发到哪些分片？基于保存在配置服务器中的信息，mongos\
  \ 维护一个当前的路由表，这意味着对于每个集合，它都知道其数据存储在哪里，如果集合是分片的，它会跟踪集合每个部分的位置。然后它会根据需要将收到的操作转发到一个或多个分片，如果是多个分片，则还必须合并或组合来自各个分片的结果，以便向客户端返回单个结果。\n\
  \n## 对集合进行分片并选择分片键\n\n当你首次部署分片集群时，你必须决定如何将数据分布到各个分片。这对于实现水平扩展至关重要，因为可扩展的分片集群会以操作均匀分布在所有分片的方式来分布数据。这意味着你希望所有的读和写操作大致均匀地分布在所有分片上。\n\
  \n虽然你可以选择将不同的集合隔离到不同的分片，但最常见的情况是，当你有一个足够大的集合无法由单个分片处理时，才会使用分片。此时，你必须对集合进行分片或分区，并且可以通过选择分片键来决定其分区方式。\n\
  \n分片键值用于将集合逻辑上拆分为范围，称为块。这些块随后以旨在在所有分片之间均匀平衡数据的方式分布在分片上。在旧版本的 MongoDB 中，这通常意味着每个分片大约具有相同数量的块，但在新版本中，块仅在必要时才会被拆分。因此，虽然数据仍然均匀分布，但这并不一定意味着每个分片上的块数量相同。\n\
  \n考虑一个简单的例子：如果你的分片键是 username 且 username 的值范围从 aaaa 到 zzzz，那么你的块可能被划分为 a-b、c-d、e-f\
  \ 等范围。均衡器是一个在分片集群上运行的后台进程，它会自动将对应这些块范围的数据分布到所有分片，确保数据大致均匀分布。\n\n> **评估分片键活动时的均衡器限制**\n\
  > \n> 均衡器仅基于数据大小进行操作，无法确定哪些分片键值范围可能更 *活跃*。\n\n现在，mongos 将把包含以特定字母开头的 username 的操作路由到\
  \ *拥有* 包含该 username 的块范围的分片。\n\n你一定在想，如果请求中不包含 username 会怎样？在这种情况下，mongos 必须将请求发送到所有分片。这种类型的请求称为\
  \ **广播** 或 **散发-收集** 操作，其水平扩展效果远不如针对单个分片的操作。\n\n## 为什么散发-收集不好\n\n一个常见的误解是，散发-收集查询之所以高效仅仅是因为每个分片只需要处理一小部分数据。虽然这在直觉上似乎是正确的，并且确实反映了原始\
  \ map-reduce 数据处理的工作方式（通过将大量工作拆分到多台服务器上），但这种方法在大多数情况下并不能很好地水平扩展。让我们来探讨原因。\n\n当查询请求发送到单个分片时，该分片执行操作并将结果返回给\
  \ mongos，后者再将其转发给客户端。但当查询请求针对所有分片（散发-收集操作）时，每个分片都必须在其自己的数据部分上执行操作并将结果返回给 mongos\
  \ 以合并并转发给客户端。注意这两个场景有什么不同？在针对性查询中，只有一個分片需要执行操作。在散发-收集查询中，每个分片都必须执行操作。\n\n因此，在一个有\
  \ 20 个分片的集群中，一个散发-收集操作会被转换为 20 个操作。即使它看起来像是更便宜的操作，只处理总数据的 1/20，每个分片的操作执行开销仍然相同，而且\
  \ mongos 还必须做额外的工作来合并结果。在某些情况下，mongos 必须等到收到所有接收查询的分片的回复后，才能开始向客户端返回数据。\n\n假设你的集群正在处理数万甚至数十万个查询。以下是单个请求发送到一个分片与散发-收集查询在\
  \ 20 个分片集群中扩展的情况：\n\n| 客户端查询 | 仅针对性查询 | 仅散发-收集查询 |\n|---|---|---|\n| 100 | 100 |\
  \ 2,000 |\n| 1,000 | 1,000 | 20,000 |\n| 10,000 | 10,000 | 200,000 |\n| 100,000\
  \ | 100,000 | 2,000,000 |\n\n*表 6.1：显示在所有 20 个分片上执行的总查询数的表*\n\n现在，想象一下如果你将表 6.1\
  \ 中的分片数量加倍。针对性查询列将保持不变，但散发-收集查询列会翻倍！因此，你得不到线性扩展的好处，因为增加集群中的分片数量也会增加总查询数量。作为额外的弊端，需要等待所有分片响应的散发-收集查询会随着分片数量的增加而变得越来越慢。这是因为某个分片出现延迟波动（例如网络配置错误、选举或崩溃）的几率也会增加。这会导致每个广播查询的延迟增加，而针对性查询只会影响发送到受影响分片的查询子集。\n\
  \n## 战略性分片键选择\n\n分片键选择是一个关键决策，直接影响分片集群的性能和可扩展性。一个好的分片键可以针对特定分片进行操作，提供适当的粒度以均匀分布数据，并最大限度地降低创建热点分片的风险。让我们来看一下好的分片键的一些重要要素。\n\
  \n### 用于定位操作的分片键\n\n为了了解数据分区如何影响操作的分布，让我们再看一个例子，说明集合如何根据定义的分片键在分片之间进行分区。\n\n假设你有一个\
  \ orders 集合。你可能会按 order_id 对其进行分区，order_id 是唯一的，并且可以创建许多块范围，从而实现数据在分片之间的精细分布。然而，如果\
  \ order_id 是单调递增的，那么最后一个块（从较高的 order_id 到 maxInt 范围的块）将始终接收所有新插入。\n\n这可能有问题也可能没有问题。如果新订单创建是系统中的瓶颈，这可能有问题，但如果新订单相对不频繁地创建，而大部分负载来自订单的更新、读取或聚合，则可能不是大问题。\n\
  \n现在，让我们考虑一个读取特定客户所有最近订单的操作。由于你不知道客户的订单在哪个范围内，你必须将查询广播到具有 orders 集合块的所有分片，如图 6.2\
  \ 所示，这对水平扩展是有问题的。\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_158_0.png)\n\n*图 6.2：广播查询*\n\
  \n如果你知道应用程序在处理订单时始终会有 customer_id 值（这是一个合理的假设），那么最好使用复合分片键，例如 {customer_id:1,order_id:1}。这将使每个客户的订单保留在单个分片上（因为它们往往会落在单个块内），并且关于特定客户订单的查询将针对单个分片，而不是散布到所有分片。\n\
  \n\n\n\n在图 6.3 中，客户 A 的所有订单都位于从最低 customer_id（包含）到 customer I（不包含）的 chunk 内，该 chunk\
  \ 位于分片 A 上。因此，查询客户 A 的所有最近订单只会发送到分片 A。作为额外好处，新的订单将不再在同一分片上创建。然而，在这种情况下，您对订单的所有操作都必须在查询中同时包含\
  \ customer_id 和 order_id 值，以确保它们被定向到单个分片。\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_159_0.png)\n\
  \n图 6.3：定向查询\n\n扩展分片集群的关键在于将操作定向到尽可能少的分片。一个优秀的分片键将允许大多数操作被定向到单个分片。\n\n## 分片键的粒度良好\n\
  \n你可能听说过，选择一个具有良好粒度的分片键很重要，主要原因在于它能让 chunk 有效地拆分。我们在上一节中看到的示例很好地说明了这一点。由于 order_id\
  \ 是唯一的，任何包含它作为组成部分的分片键都可以轻松拆分为更小的 chunk。那么粒度为什么如此重要，如果分片键的粒度不够会发生什么呢？\n\n想象一个多租户系统，其中分片键是\
  \ tenant_id。初看之下，这似乎是个好主意，因为每个租户的操作始终包含 tenant_id 值，这非常有利于将特定租户的操作定向到一个分片，而且新租户的创建速度不足以让你担心所有插入都进入同一个\
  \ chunk 范围。然而，如果单个租户成为重度用户，在集合中生成的数据量大到无法容纳在一个分片上会怎样？\n\n定位数据在两个分片上的方式是通过决定分片键的哪些值存放在哪里。然而，在我们的案例中，租户的所有数据都具有相同的分片键值，使得数据无法拆分，并且包含数据的\
  \ chunk 现在被标记为 jumbo chunk。在图 6.4 中，tenant_I 拥有大量数据，从 tenant_I（包含）到 tenant_J（不包含）的\
  \ chunk 被标记为 jumbo。分片 B 的数据比分片 A 多，然而由于 chunk 无法拆分，均衡器无法将数据从分片 B 移动到分片 A 以平衡数据。这时通过在\
  \ tenant_id 之后添加另一个字段作为分片键的组成部分来细化或扩展分片键就可以提供帮助。\n\n## 分片键：tenant_id\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_160_0.png)\n\
  \n图 6.4：分片键为 tenant_id\n\n幸运的是，有一个命令可以在不中断服务的情况下细化分片键，并且允许你在粒度不足时扩展分片键。这是一个廉价的操作，因为它允许你在无需移动任何数据的情况下添加一个或多个字段。一旦分片键通过另一个字段扩展（例如\
  \ _id 或你在数据模型中有意义的另一个字段），MongoDB 就可以在 _id 值上拆分大租户的 chunk，并且其部分数据可以被均衡或移动到另一个分片。在图\
  \ 6.5 中，细化分片键后，先前的 jumbo chunk 现在可以拆分，并且部分数据可以移动到另一个分片。\n\n## 分片键：tenant_id, _id\n\
  \n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_160_1.png)\n\n图 6.5：细化分片键并等待数据均衡\n\n\
  最佳的分片键应具有足够的粒度以允许拆分数据范围，从而在分片之间实现更好的分布。\n\n## 避免递增或递减的分片键值\n\n你可能读到过，单调递增的分片键是个坏主意。事实上，正如前面的示例所强调的那样，如果很可能出现新文档插入的瓶颈，你应该对此感到担忧。让我们看一个很可能出现这种情况的示例以及为什么这会成为问题。\n\
  \n回顾一下第 2 章《Schema Design for Performance》中的 Socialite 应用示例。考虑 content 集合，它接收用户帖子。该集合经历了大量的写入，主要来自用户向集合中插入新帖子。现在想象按每个帖子的\
  \ _id 值对 content 集合进行分片，使用默认的 ObjectId 类型。由于 ObjectId 的前四个字节代表当前时间戳，你可能会认为将其用作创建时间代理是有用的，并且出于定向目的将所有最近的帖子放在同一个分片上并不是坏主意。毕竟，用户通常只想阅读最近的帖子，对吧？然而，这导致的结果是每次插入都进入最高\
  \ chunk 范围。\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_161_0.png)\n\n*图 6.6：单调递增分片键导致的热分片*\n\
  \n正如你在图 6.6 中看到的，新插入会使拥有顶层 chunk 的分片变成热分片，而其他分片将不会接收任何写入（因为帖子通常既不更新也不删除）。即使你的模式设计包含使用点赞计数等更新帖子，活动也会集中在最近的帖子上（因为用户多久会回去几个月给以前的帖子点赞呢？）。因此，唯一不会进入顶层\
  \ chunk 的写入将是删除（当用户决定清理或归档旧内容时），对吧？但即使是这些也会通过进入最低范围值而创建热 chunk！\n\n你也不会从定向读取中获得任何好处，因为当你查询要向某人展示的帖子时，它们通常是朋友的帖子或你自己的帖子。查询看起来会像这样：\n\
  \n```\n// Query to get latest 20 posts for a subset of users\n// This query may\
  \ result in a scatter-gather operation\n\ndb.posts.find({userId:{$in:[\"...\"]}}).sort({_id:-1}).limit(20)\n\
  ```\n\n这种获取要为用户子集展示的最新 20 条帖子的查询很可能导致 scatter-gather 查询。不仅如此，这种查询需要等待所有分片排序其结果，在\
  \ mongos 上合并它们，然后才开始向客户端返回任何结果。由于在具有信息流的社交媒体应用中最重要的是尽快开始显示结果，因此这是不可接受的。\n\n解决方案很可能是使用更好的分片键。最明显的一个是按\
  \ {userId:1, _id:1} 分片，这很可能会将每个用户的内容放在同一个 chunk 中，这意味着随着数百或数千个用户创建新帖子，它们很可能会被分布到拥有这些用户\
  \ chunk 的所有分片上。如果你的 userId 是随机的（如任何用户选择的名称），你的分布也会是随机的。但即使你使用某种系统生成的、唯一的、单调递增的值，并且即使你的新用户起初往往更活跃，这也会被所有已存在的用户创建内容并在分片之间大致均匀地分布写入所抵消。\n\
  \n这与我们在订单的早期示例中看到的方法类似，其中将 customer_id 前缀到 order_id 比仅使用 order_id 单独作为分片键更好。在多用户或多租户系统中，始终考虑将分片键的领先字段设为你的用户或租户\
  \ ID，以最大化对每个用户或租户的查询定向。\n\n请注意，通过哈希使单调递增的分片键值随机化并不一定是个好主意。我们将在下一节中查看在决定是否对分片键进行哈希之前需要考虑的一些权衡。\n\
  \n如果你在分片或重新分片集合之前仍对分片键选择没有信心，你始终可以使用 configureQueryAnalyzer 命令收集集合上的查询样本，然后运行 analyzeShardKey\
  \ 命令来评估该集合的分片键。\n\n## 分片类型\n\n从根本上说，MongoDB 支持一种将数据分布到分片的核心机制：**基于范围的分片**。然而，它还提供了两种适用于不同用例的特殊变体：**哈希分片**\
  \ 和 **区域分片**。让我们探讨它们的工作方式、相互关系以及何时选择各自合适。\n\n## 基于范围的分片\n\n范围分片是默认且最直观的方法。这就是本章迄今为止所描述的内容。范围分片按分片键值的自然顺序拆分数据，然后将数据范围分发到不同的分片。这是对大多数用例的正确方法；只需为你的读写模式选择一个好的分片键即可。我们迄今为止讨论的所有示例都使用常规范围分片。所有其他分片方法都以范围分片为基础，但它们在之上提供了额外的能力，以更改用于范围的值或影响范围在集群中的平衡方式。\n\
  \n## 哈希分片\n\n哈希分片采用你的分片键，通过哈希函数运行它，然后对这些哈希值应用范围。其结果类似于在将页面放入卷之前先对所有页面进行洗牌，这非常适合随机分散事物。所有操作都会自动执行此哈希，因此你的应用程序无需更改查询数据的方式。\n\
  \n想象在巨大的集合中存储日志或事件，其中每个事件的 _id 值始终递增。使用范围分片，所有这些记录都必须插入到同一个分片。但如果你使用 { _id: \"hashed\"\
  \ }，系统会随机分发它们，避免插入热点。\n\n对分片键值进行哈希存在多个陷阱和额外成本。对哈希分片键的范围查询效率低下，并且每次插入都需要维护一个额外的随机访问索引。最重要的是，你需要记住，通过哈希分片键值并不会获得额外的\
  \ *粒度*。如果你的分布因分片键粒度差（不同值不足）而变差，那么对它们进行哈希也不会改变这一点。你仍然会有糟糕的分布，同时还增加了哈希键的开销。\n\n在哈希分片键仍然是你的用例最佳选择的情况下，MongoDB\
  \ 7.0 版本引入了在你拥有另一个索引来支持分片键并且集合已平衡的情况下删除哈希索引的能力。一旦删除哈希分片键索引，就不再进行平衡，但你节省了在每次插入时维护哈希索引的开销。\n\
  \n\n\n## 基于区域的分区\n\n区域分片是一种根据你创建的策略控制哪些数据范围驻留在哪些分片集上的方法。它是一种将地理因素纳入考虑的方式，或只是将分片集合限制为分片子集的方式。使用区域分片需要遵循两个步骤。你为一个分片或一组分片分配区域标签或标记，然后指定要与这些特定区域关联的分片键范围，从而控制数据的物理存储位置。\n\
  \n考虑一家全球 SaaS 公司希望出于合规原因将欧洲用户的数据存储在欧盟境内。通过将“EU”区域的分片范围分区到法兰克福的分片，以及将“NA”区域分区到北美分片，它可保持数据本地化、访问快速且符合策略。\n\
  \n以下是这些步骤在数据库命令中的表现，这些命令对集合进行分片、为分片分配适当的区域，并向区域添加分片键范围：\n\n```\n// Shard a collection\
  \ and assign zones for geo-based data placement\nsh.shardCollection(\"db.coll\"\
  , {country:1, userid:1})\nsh.addShardToZone(\"shard0\", \"NA\")\nsh.addShardToZone(\"\
  shard1\", \"EU\")\nsh.addTagRange(\"db.coll\", \n{country:\"DE\",userid:MinKey},{country:\"\
  DE\",userid:MaxKey},\"EU\")\nsh.addTagRange(\"db.coll\", \n{country:\"US\",userid:MinKey},{country:\"\
  US\",userid:MaxKey},\"NA\")\n```\n\n可在 MongoDB 文档中找到更多示例：\n\n- *按位置分段数据:* https://www.mongodb.com/docs/manual/tutorial/sharding-segmenting-data-by-location/\n\
  - *按应用程序或客户分段数据:* https://www.mongodb.com/docs/manual/tutorial/sharding-segmenting-shards/\n\
  - *仅插入工作负载的分布式本地写入:* https://www.mongodb.com/docs/manual/tutorial/sharding-high-availability-writes/\n\
  - *使用区域分发集合:* https://www.mongodb.com/docs/manual/tutorial/sharding-distribute-collections-with-zones/\n\
  \n随着集群中分片数量的增长，你将希望对每个分片和未分片集合的位置进行更严格的控制。例如，你可能在 10 个分片上有两个巨大的分片集合，但与其让每个集合都位于\
  \ 10 个分片上，你可能更希望每个集合仅位于其自己的 5 个分片上。这可以在多方面提供帮助：\n\n如果每个集合产生的负载不同，你可以通过不对称的分片扩展分配不同的资源，并且发送到集合所在每个分片的任何散列-聚集操作都将仅发送到一半的分片数量。由于减少集群中的总操作数有助于可扩展性，这是一种简单实现的方法。顺便说一下，如果你的某个分片出现意外问题，只有两个集合中的一个会受到影响，而不是两者。\n\
  \n要将两个集合分发到分片子集，数据库命令可能如下所示：\n\n```\n// Example of distributing collections to subsets\
  \ of shards using zones\nsh.addShardToZone(\"shard0\", \"C1\")\nsh.addShardToZone(\"\
  shard1\", \"C1\")\nsh.addShardToZone(\"shard2\", \"C2\")\nsh.addShardToZone(\"shard3\"\
  , \"C2\")\nsh.addTagRange(\"db.coll1\",{\"<shKey>\":MinKey},{\"<shKey>\":MaxKey},\"\
  C1\")\nsh.addTagRange(\"db.coll2\",{\"<shKey>\":MinKey},{\"<shKey>\":MaxKey},\"\
  C2\")\n```\n\n这些命令首先为每个分片标记为 C1 或 C2，然后将 coll1 集合分配给标记为 C1 的分片，将 coll2 集合分配给标记为\
  \ C2 的分片。你将为 <shKey> 使用实际的分片键字段名。这种控制增加了复杂性。你需要管理区域和范围边界以及它们如何映射到区域，监控分片间的平衡，并计划不均匀增长。\n\
  \n虽然将每个分片集合隔离到其自己的分片子集有优势，但在两种情况下应避免这样做，而应将集合共同定位在相同的分片上，并使用分片键范围使相关数据保持在一起。一种情况是支持跨两个集合的多文档事务保持在单个分片上；另一种情况是防止两个集合之间的\
  \ $lookup 操作需要在网络上工作。我们将在本章后面“将分片集合块共同定位在一起”部分进一步讨论这个问题。\n\n## 高级分片管理\n\n在处理分片集群时，有一些操作注意事项，虽然不是核心分片机制的一部分，但如果你希望随着时间的推移保持部署高效和响应迅速，了解它们很重要。这些包括在事情出错时重新分片、为新集合中的大型数据负载预拆分、管理平衡器、移动未分片集合，以及了解如何最好地分发数据以获得最佳性能。\n\
  \n### 重新分片：是否、何时以及如何\n\n第一次选择合适的分片键是理想的，但让我们面对现实，有时我们第一次做出了错误决定，而其他时候，实际使用模式会演变。起初良好的键可能会成为瓶颈。也许你在一个已经随机的字段上选择了哈希分片键，却没有意识到它造成的额外开销，现在你想将其更改为常规的范围分片键。或者也许你对\
  \ orders 集合使用了 order_id，现在你意识到对于特定客户的订单的大多数查询都是散列-聚集的而不是有针对性的，你想将分片键更改为 {customer_id,\
  \ order_id}，因为它允许更好地定位查询。\n\nMongoDB 的重新分片功能给你第二次机会。在不中断服务的情况下，你可以将分片键更改为更合适的键，让数据在分片间重写而不会中断服务。重新分片是一个后台操作；它在幕后读取并重写所有数据，但完成后，你将拥有一个分布更好的集合和一个可以再次呼吸的系统。\n\
  \n重新分片不仅仅用于更改分片键；它还可以用现有分片键来重新分发或重写集合到现有分片，比平衡器移动块和清理孤儿块所需的时间更快。从 MongoDB 8.0 版本开始，你可以通过将\
  \ forceRedistribution 选项设置为 true，在集合上使用相同的分片键运行 reshardCollection 命令。考虑在一次添加或删除多个分片时，或在对现有未分片集合进行分片后使用它。在图\
  \ 6.7 中，该集群中有三个分片，并且分片 A 上有一个未分片集合。现在，该集合中的数据已增长，你想对其进行分片。由于一个分片一次只能参与一次块迁移，平衡器一次只能将数据从分片\
  \ A 移动到分片 B 或分片 C。平衡速度可能很慢。此外，在块迁移后，分片 A 需要删除该块中数据的原始副本，并且磁盘空间不会自动回收。如果你立即在分片后重新分片该集合，重新分片机制将创建一个临时集合，并且三个分片都可以并行从分片\
  \ A 读取数据并将其重写到临时集合中。重新分片完成后，它将重命名临时集合并删除原始集合。分片 A 上的磁盘空间将自动回收。\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_167_0.png)\n\
  \n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_167_1.png)\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_167_2.png)\n\
  \n图 6.7：块迁移与重新分片\n\n请参阅文档以获取更多详细信息、限制和示例：https://www.mongodb.com/docs/manual/core/sharding-reshard-a-collection/.\n\
  \n我们在“具有良好粒度的分片键”部分提到的用于细化或扩展你的分片键的命令与重新分片命令不同，因为使用额外字段扩展分片键不需要从其当前分片移动任何数据。请在文档中阅读有关细化分片键的更多信息：https://www.mongodb.com/docs/manual/core/sharding-refine-a-shard-key/#std-label-shard-key-refine.\n\
  \n### 平衡器注意事项\n\n在 MongoDB 分片集群幕后，平衡器的工作是确保数据在分片之间均匀分布。它的工作是监控数据分布，并在事物变得不平衡时移动块，保持系统平衡。但虽然它默认开启且很容易被遗忘，平衡器并非免费，了解其行为对于避免意外的副作用至关重要。\n\
  \n首先，有开销。平衡器触发的每个块迁移都涉及从一个分片复制数据到另一个分片，更新配置服务器中的元数据，并删除数据的原始副本。虽然这些操作高效且安全，但它们仍会消耗\
  \ I/O、CPU 和网络带宽。在负载较轻的集群上，你可能永远不会注意到它在运行。在繁忙的生产系统上，尤其是在高峰需求时段，这些后台移动可能会与应用程序操作竞争资源并减慢速度。\n\
  \n\n\n这就是 MongoDB 允许你设置均衡器窗口的原因，均衡器窗口是允许块迁移的特定时间段。例如，你可以将均衡限制在夜间时段或流量最低的非高峰期。这样可以在白天保持最佳性能，同时仍允许系统在更安全且不会产生明显影响时重新分布数据。\n\
  \n但即使设置了均衡窗口，你也需要保持关注。均衡器可以根据数据大小而不是访问频率进行操作。这意味着它可能无法捕捉到服务流量更多但文档更少的热点分片。定期审查不仅是数据的分布而且是负载的分布对于避免静默性能下降至关重要。balancerStatus、currentOp\
  \ 和 sh.status() 命令在这里是你的好帮手，以及显示每个分片上操作数量的监控图表。最后需要记住的是，均衡器擅长在略有不平衡的分片集合中移动小块数据以恢复平衡。当你需要整个分片被数据填充时，重新分片可能更快。\n\
  \n## 预分片：是否、何时以及如何\n\n大多数情况下，MongoDB 的均衡器在应对不断增长的数据并保持其分布方面做得很好。但在某些场景下，例如大规模初始导入，你不希望将所有内容插入到一个分片中然后等待均衡器追赶上来。这就是预分片发挥作用的地方。\n\
  \n预分片取决于你的分片键值范围。你需要创建一个脚本，使用 moveRange 命令将分片键值的完整范围拆分为多个块，并将其均匀分布到将接收新数据的分片中。如果你的分片键值是字符串，如果你想在三个分片上开始使用块，可以使用\
  \ MinKey-k、k-s 和 s-MaxKey 这样的范围。如果你的值是其他类型，请确定数据集中值的近似范围，然后相应地拆分它们。请记住，你不必非常精确，因为一旦加载足够的数据，均衡器就能轻松处理较小的失衡。你想要避免的是开始时所有数据都进入单个分片。\n\
  \n通常，你希望在向全新空集合进行批量导入之前，或在设置新集群的早期阶段使用预分片。预分片在你事先了解数据的分布方式，并希望有一个良好的开端时最简单。\n\n\
  预分片是主动的。它将你的思维从被动的负载管理转变为有意的数据规划，在正确的使用下，它是确保集群启动并保持健康的最有效方法之一。\n\n## 移动未分片集合\n\n\
  数据库中的并非每个集合都会被分片。事实上，所有较小的集合都将保持未分片，只有太大而无法容纳在一个分片上的集合才应分片。就像并非每个分片集合都需要存在于每个分片上，未分片集合也不需要在一个主分片上共同存在。事实上，通常最好将它们均匀分布在你的分片中，因为即使是未分片的数据，如果导致集群分布不均，也会引起问题。想象一下用于事件的小型每日集合，其中每天你将数据转储到一个单独的未分片集合中（最终会删除旧的集合）。如果所有天的数据都在同一个分片上，该分片最终会不堪重负，并非因为分片，而是因为未分片集合的不平衡。\n\
  \n在这些情况下，moveCollection 命令（从 MongoDB 8.0 版本开始支持）应该是你的首选工具。它允许你手动将整个未分片集合从一个分片移动到另一个分片。它不是自动的，如果你在活动集合上运行它，移动期间会短暂阻塞写入（通常只有几秒钟），但它可以在不经过将不需要分片的集合分片的复杂性的情况下重新平衡工作负载，从而成为救星。作为奖励，如果你预见到这一点并在首次创建集合时立即执行\
  \ moveCollection，移动空集合将非常快速且成本低。\n\n在图 6.8 中，最初 testdb 数据库中未分片的 A-H 集合全部位于 shard0。我们可以运行以下命令将其中一些移动到\
  \ shard1，以在此集群中分布数据：\n\n// Move unsharded collections to specific shards\n// Useful\
  \ for balancing unsharded data across the cluster\ndb.adminCommand({moveCollection:\"\
  testdb.E\", toShard:\"shard1\"})\ndb.adminCommand({moveCollection:\"testdb.F\",\
  \ toShard:\"shard1\"})\ndb.adminCommand({moveCollection:\"testdb.G\", toShard:\"\
  shard1\"})\ndb.adminCommand({moveCollection:\"testdb.H\", toShard:\"shard1\"})\n\
  \n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_170_0.png)\n\n*图 6.8：移动未分片集合*\n\n## 将分片集合块共同定位\n\
  \n正如在基于区域的分片部分所述，有两种情况，为了性能考虑，禁用均衡器并手动（通过脚本）将两个或多个集合在相同的分片上共置，使用保持相关数据在一起的分片键范围可能是有益的。第一个能显著帮助的情况是多文档事务，其中单分片事务的性能明显优于多分片事务，另一个情况是两个集合之间使用\
  \ $lookup 操作的聚合，其中将相关范围保留在同一分片上允许管道本地执行，而无需将数据通过网络发送到另一个分片。\n\n一个例子是 TPC-C 基准测试商务数据的情况，其中包含仓库、地区、客户和订单的集合。我们可以在这些集合中的每一个上使用范围分片，它们共享前缀以将相同的值定位在相同的分片上：\n\
  \n| 集合 | 分片键 |\n|---|---|\n| WAREHOUSE | w_id |\n| DISTRICT | w_id, d_id |\n| CUSTOMER\
  \ | w_id, d_id, c_id |\n| ORDERS | w_id, d_id, c_id, o_id |\n\n*表 6.2：TPC-C 基准测试的集合及其分片键*\n\
  \n为了实现共置，我们将为这些集合禁用均衡器，然后在相同的前缀（w_id）值上拆分它们，并将具有相同值的块范围移动到相同的分片。或者，我们可以使用以下命令将相同前缀（w_id）值上的区域范围与同一区域关联，并让均衡器相应地拆分和移动块范围：\n\
  \n// Colocating sharded collection chunks together for TPC-C benchmark\nsh.shardCollection(\"\
  db.WAREHOUSE\", {w_id:1})\nsh.shardCollection(\"db.DISTRICT\", {w_id:1, d_id:1})\n\
  sh.shardCollection(\"db.CUSTOMER\", {w_id:1, d_id:1, c_id:1})\nsh.shardCollection(\"\
  db.ORDERS\", {w_id:1, d_id:1, c_id:1, o_id:1})\n\n// Associate each shard to a unique\
  \ zone\nsh.addShardToZone(\"shardA\", \"ZoneA\")\nsh.addShardToZone(\"shardB\",\
  \ \"ZoneB\")\nsh.addShardToZone(\"shardC\", \"ZoneC\")\n\n// For each collection,\
  \ associate the range with the same prefix to the same zone\nsh.addTagRange(\"db.WAREHOUSE\"\
  ,{w_id:MinKey},{w_id:33},\"ZoneA\")\nsh.addTagRange(\"db.DISTRICT\", {w_id:MinKey,d_id:MinKey},\n\
  {w_id:33, d_id:MinKey},\"ZoneA\")\nsh.addTagRange(\"db.CUSTOMER\", {w_id:MinKey,d_id:MinKey,c_id:MinKey},\n\
  {w_id:33,d_id:MinKey,c_id:MinKey},\"ZoneA\")\nsh.addTagRange(\"db.ORDERS\", {w_id:MinKey,d_id:MinKey,c_id:MinKey,\n\
  o_id:MinKey}, {w_id:33, d_id:MinKey,c_id:MinKey,o_id:MinKey},\"ZoneA\")\n\nsh.addTagRange(\"\
  db.WAREHOUSE\", {w_id:33},{w_id:66},\"ZoneB\")\nsh.addTagRange(\"db.DISTRICT\",\
  \ {w_id:33,d_id:MinKey},\n{w_id:66,d_id:MinKey},\"ZoneB\")\nsh.addTagRange(\"db.CUSTOMER\"\
  , {w_id:33,d_id:MinKey,c_id:MinKey},\n{w_id:66,d_id:MinKey, c_id:MinKey},\"ZoneB\"\
  )\nsh.addTagRange(\"db.ORDERS\", {w_id:33,d_id:MinKey,c_id:MinKey,o_id:MinKey},\n\
  {w_id:66,d_id:MinKey,c_id:MinKey,o_id:MinKey},\"ZoneB\")\n\nsh.addTagRange(\"db.WAREHOUSE\"\
  , {w_id:66}, {w_id:MaxKey},\"ZoneC\")\nsh.addTagRange(\"db.DISTRICT\", {w_id:66,d_id:MinKey},\n\
  {w_id:MaxKey, d_id:MaxKey},\"ZoneC\")\nsh.addTagRange(\"db.CUSTOMER\", {w_id:66,d_id:MinKey,c_id:MinKey},\n\
  {w_id:MaxKey, d_id:MaxKey, c_id:MaxKey},\"ZoneC\")\nsh.addTagRange(\"db.ORDERS\"\
  , {w_id:66,d_id:MinKey,c_id:MinKey,o_id:MinKey},\n{w_id:MaxKey,d_id:MaxKey,c_id:MaxKey,o_id:MaxKey},\"\
  ZoneC\")\n\n\n\n\n图 6.9 显示，在定义区域范围后，均衡器会拆分并将块移动到与区域关联的相应分片。\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_172_0.png)\n\
  \n图 6.9：同一分片上不同集合的相同范围\n\n虽然这看起来在操作上很复杂，但实际上这会被脚本化，并且在 staging 环境中测试后，生产环境中的流程只需运行脚本即可自动初始化数据分布。\n\
  \n通过将相同的仓库 ID 值分区到相同的分片，我们最大化了涉及相同客户、订单、地区和仓库的交易发生在单个分片上的可能性。这与我们最小化聚合查询中跨分片 $lookup\
  \ 的方式相同，这些查询需要查找相关实体的详细信息。\n\n就像关于你的 MongoDB 模式和索引的每个决策都取决于你的需求和你能够做出的权衡一样，为性能和可扩展性对集群进行分片的决策也是如此。考虑到你的\
  \ SLA 选择分片键至关重要，以确保你为最重要的方面进行优化。通常没有完美的答案，只有权衡。关键在于理解应用程序的主要访问模式。你是按实体读取数据还是批量写入？你是否期望某些实体主导工作负载？平衡是可能的，但它始于有意的建模，并通过监控、迭代，有时……是的，重分片来持续进行。\n\
  \n## 摘要\n\nMongoDB 的分片架构是实现具有海量数据集和 demanding 吞吐量要求的部署中水平可扩展性的强大且灵活的工具。通过了解分片集群的核心组件、分片键选择的重要性以及可用的各种分片方法，你可以设计一个高效分布和定位操作的系统。此外，讨论的高级技术，例如改进分片键、使用分区进行战略数据放置、批量导入期间预拆分以及在分片之间平衡工作负载，都有助于在数据和工作负载扩展时保持集群的高效和响应。有效的分片不仅仅是分布数据，还包括预见和管理查询模式、操作开销和不断变化需求的细微差别。凭借这些知识，你可以很好地创建可扩展且健壮的架构，以支持应用程序日益增长的需求。\n\
  \n在下一章关于存储引擎中，我们将把重点从数据分布转移到数据存储，深入探讨 WiredTiger 存储引擎，即 MongoDB 的默认且最常用的存储引擎。\n"
- "# 7 存储引擎\n\n## 存储引擎\n\n正如我们在第 1 章《系统和 MongoDB 架构》中看到的那样，WiredTiger 是 MongoDB 服务器中的一个组件，也是\
  \ MongoDB 最常见的存储引擎。存储引擎充当数据逻辑结构（用户、应用程序和数据库更高层所见）与该数据的物理存储之间的接口。因此，它们是在诊断和解决性能问题时的重要因素。本章旨在为你提供对\
  \ WiredTiger 存储引擎的高级理解，使你能够就其配置做出明智的决策。到本章结束时，你将对 WiredTiger 的性能相关内部工作原理有扎实的掌握，并具备将其调优以提高效率的知识。\n\
  \n本章涵盖的主题包括以下内容：\n\n- 存储引擎概述及其在 MongoDB 中的作用\n- WiredTiger 的架构，包括其存储格式、并发控制和缓存策略\n\
  - WiredTiger 如何管理其缓存、确保数据持久性并处理意外故障的恢复\n- WiredTiger 支持的压缩算法，以及压缩效率与资源使用之间的权衡\n\
  - WiredTiger 的关键配置选项以及如何为你的特定工作负载和硬件设置进行调优\n\n### 探索存储引擎\n\n不同的存储引擎采用各种数据结构、算法和技术来优化数据库系统的性能、可扩展性、可靠性和其他特性。\n\
  \n一些常见的存储引擎类型包括以下内容：\n\n- **行存储引擎**：这些引擎以行为单位存储数据，其中每一行代表一条记录并包含多个列或字段。\n- **列存储引擎**：这些引擎以列为单位存储数据，其中每一列代表一个字段并包含来自多行的值。\n\
  - **键值存储引擎**：这些引擎将数据存储为键值对的集合，其中每个唯一键都与单个对应值关联。应用程序可以使用其键访问值。例如，键可以是字符串或用户 ID，而值可以是复杂嵌套的数据结构。\n\
  \nWiredTiger 是一种可配置为以行或列存储数据的键值存储引擎。其他流行的数据库存储引擎示例有 InnoDB、MyISAM 和 RocksDB。存储引擎的选择会显著影响数据库系统的性能、可扩展性和功能。不同的存储引擎针对不同的工作负载和用例进行了优化，并且可能在各种因素之间提供权衡，例如读写性能、数据压缩、事务支持和数据一致性。\n\
  \n例如，InnoDB 目前是 MySQL 的默认存储引擎。它提供诸如事务、行级锁定和外键支持等功能。MyISAM 是一种较旧的存储引擎，以其简单性和对读密集型操作的快速性而闻名，但它不支持事务或行级锁定。\n\
  \n理论上，WiredTiger 可用作其他数据库的存储引擎，而 MongoDB 也可使用其他存储引擎。MongoDB 已定义了存储引擎 API，使开发人员能够为其他存储引擎实现适配器。例如，MongoRocks\
  \ 是 MongoDB 的 RocksDB 存储引擎模块。\n\n特定数据库可能只使用存储引擎功能的一个子集，并允许用户配置其配置参数的一个子集。例如，在撰写本文时，MongoDB\
  \ 不使用诸如 WiredTiger 的列存储或诸如日志结构合并树等数据结构等功能。这是因为 MongoDB 目前尚未实现使用这些功能的功能，但将来可能会实现。MongoDB\
  \ 服务器配置选项支持 WiredTiger 配置选项的一个子集。\n\n### WiredTiger 概述\n\nWiredTiger 是 MongoDB 的默认且最常用的存储引擎。它自\
  \ MongoDB 3.0 版本起就可用。在此之前，MongoDB 的默认存储引擎是 MMAPv1，它使用内存映射文件来管理数据。虽然 MMAPv1 是可用的，但它有一些局限性。\n\
  \nWiredTiger 的基本数据结构是 B-tree，它维护有序数据并允许以对数时间进行搜索、顺序访问、插入和删除。B-tree 中的每个节点可以包含多个键（数据条目），节点可以容纳的键的数量由树的度或阶决定。在\
  \ B-tree 中搜索键涉及从根导航到叶，沿着表示键范围的指针进行。这很高效，因为树的高度相对于键的数量是对数级的。与二叉搜索树相比，B-tree 更浅，因为它们允许每个节点有超过两个子节点。这减少了遍历树时所需的磁盘访问次数，这对于\
  \ I/O 操作昂贵的数据库至关重要。\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_177_0.png)\n\n*图\
  \ 7.1：WiredTiger B-tree*\n\nB-tree 的每个节点包含键和值。叶节点存储实际数据，而内部节点指导树中的搜索过程。WiredTiger\
  \ 的基本构建块是键值对。多个键值对可以组合成页面，每条数据都与唯一的键关联，从而实现高效的检索和更新。内部键称为记录 ID。\n\n\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_178_0.png)\n\
  \n## Linux 内核中的页面与 WiredTiger 存储引擎\n\n页面概念同时存在于 Linux 内核和 WiredTiger 存储引擎中。虽然 *page*\
  \ 术语在两者中都使用，但它代表不同的概念。Linux 内核中的页面是内存管理的基本单元。\n\n例如，在尝试检索具有特定索引字段的文档时，例如 _id，首先使用\
  \ _id 键搜索索引 B-tree 以获取记录 ID 值。然后，该记录 ID 被用作键来搜索集合并返回对应的值，即 MongoDB 文档。\n\nWiredTiger\
  \ 采用 **多版本并发控制 (MVCC)** 来管理对 B-tree 和页面中数据的并发访问。这允许多个读取器和写入器同时操作，比更简单的方案提供更高的并发性。\n\
  \n数据持久存储在包含 B-tree 结构和元数据的文件中。这些文件可以根据需要动态增长。在磁盘上，您会为每个索引和 MongoDB 集合找到一个单独的文件。\n\
  \n另一组 WiredTiger 文件用于存储 **日志**，在其他数据库系统中它通常被称为 **预写日志 (WAL)**。每个修改数据库的操作首先写入日志，以确保在服务器崩溃或断电时写入的持久性。\n\
  \n当集合或索引首次被访问时，根节点和内部节点的第一个层级会被加载到缓存中。随着读写操作的进行，内存缓存会按需填充页面。默认情况下，WiredTiger 缓存使用可用内存的\
  \ 50% 减去 1 GB。例如，在总共 8 GB RAM 的系统上，WiredTiger 缓存将使用 3.5 GB RAM（0.5 * (8 GB - 1 GB)\
  \ = 3.5 GB）。\n\n当前实现不允许显式地将文档或集合固定在缓存中。缓存在 MongoDB 服务器中的所有数据库和集合之间共享。WiredTiger\
  \ 定期创建一致的检查点，捕获数据库在特定时间点的持久快照。\n\nWiredTiger 支持完整的 ACID 事务，即使在出现故障的情况下也能确保数据一致性和完整性。以下各节将通过描述查找、更新和插入操作把所有这些概念联系起来。\n\
  \n## 查找操作\n\n当应用程序在数据库上运行查询时，它会被翻译成一个或多个存储引擎查找操作，每个操作都执行以下步骤：\n\n- 1. 假设我们正在读取由索引字段标识的文档，WiredTiger\
  \ 从根遍历索引 B-tree 到包含该键的叶节点。\n- 2. 如果有任何页面不在缓存中，它们会从存储加载到操作系统文件系统缓存和 WiredTiger 缓存中。最终，WiredTiger\
  \ 找到与索引字段对应的记录 ID。\n- 3. 上一步的记录 ID 用于遍历集合的 B-tree。\n- 4. 如果有任何页面不在缓存中，它们会从存储加载到操作系统文件系统缓存和\
  \ WiredTiger 缓存中，在那里它们会被解密和解压缩。\n- 5. 当 WiredTiger 找到记录 ID 时，它会从页面返回文档。\n\n此操作确保如果页面在缓存中则从内存中使用，并避免不必要的存储\
  \ I/O。\n\n## 更新操作\n\n当应用程序更新文档时，数据库将其翻译为存储引擎上的更新操作。通常会发生以下情况：\n\n- 1. 文档按上一节所述被读入缓存。\n\
  - 2. 页面被标记为脏，并且文档的新值存储在内存中的更新列表中。\n- 3. 如果写入是事务的一部分，它会等待事务提交。\n- 4. 写入 WiredTiger\
  \ 日志条目，其中包含在发生崩溃时重做操作所需的信息。该日志写入会被刷新到存储设备。\n- 5. 稍后，当检查点运行时或页面需要从缓存中驱逐时，WiredTiger\
  \ 会遍历页面的更新列表并将内存中的页面写入存储。文档的旧版本会被写入单独的历史存储文件。\n\n此机制提供持久性、崩溃恢复和版本跟踪，所有这些对于可靠的数据库操作都是必不可少的。\n\
  \n## 插入操作\n\n对于插入操作，WiredTiger 执行以下操作：\n\n- 1. 它遍历 B-tree 以找到合适的叶节点来插入记录/文档的键。\n\
  - 2. 在将节点写入存储时，如果节点已满，则会进行拆分。如果父节点已满，拆分操作可能会沿树向上级联。\n\n与读取和更新一样，插入操作依赖于高效的 B-tree\
  \ 遍历和动态节点管理以保持数据的性能和结构完整性。数据上的所有操作都涉及遍历索引和集合数据的 B-tree 数据结构。\n\n## 驱逐、检查点和恢复\n\n\
  缓存大小有限，因此 WiredTiger 在需要为新数据腾出空间时需要从缓存中驱逐页面。WiredTiger 使用后台线程来管理驱逐过程。这些线程会持续评估缓存状态并执行驱逐任务，同时与其他数据库操作一起运行。\n\
  \n页面是根据最近最少使用算法的变体选择驱逐的，其中最近最少访问的页面是驱逐候选。这意味着频繁访问的页面应更长时间地保留在内存/缓存中。\n\nWiredTiger\
  \ 跟踪三种类型的缓存数据：总数据、脏数据和更新。对于每一种，它都有两个阈值来管理缓存驱逐：\n\n- **Target:** 当缓存达到此级别时，WiredTiger\
  \ 开始驱逐活动，以逐渐将缓存使用量降回。\n- **Trigger:** 如果超过此级别，WiredTiger 会动员数据库操作线程快速释放空间，防止缓存填满。这减少了可以同时运行数据库操作的线程数量。\n\
  \n这些阈值在自行管理的 MongoDB 中可配置。我们将在本章《Configuration for improving performance》部分后面看到示例。使用\
  \ Atlas 时，MongoDB 会根据您运行的实例大小选择这些阈值。\n\n检查点会获取所有内存中的数据结构并将任何修改写入存储。您可以配置检查点的频率。我们将在本章后面查看此示例的示例。数据库服务器的其余部分在检查点过程中继续读取和写入页面。\n\
  \n检查点过程涉及以下步骤：\n\n- 1. WiredTiger 通过从缓存写入所有脏页面，确保到该点已提交的所有事务都以持久方式存储在数据库的磁盘映像中。\n\
  - 2. 所有挂起的文件写入都会被刷新。\n- 3. 包含事务日志的日志文件会被轮换。\n- 4. WiredTiger 在其日志和元数据中标记检查点结束。这允许从此点起安全恢复。\n\
  \n从性能角度来看，如果在两次检查点之间写入了大量数据，则在第二次检查点期间会进行许多存储和文件操作。在受 IOPS 或带宽限制的系统上，这可能导致周期性性能下降。\n\
  \n如果运行 MongoDB 服务器的计算机在没有正常关闭的情况下崩溃或断电，则需要恢复。当服务器重新启动时，它首先从最近完成的检查点加载数据库状态，然后开始恢复过程。如果之前的关闭不干净，则存储在\
  \ WiredTiger 日志（日志）中的额外更改会重放于上一个检查点之上。因此，检查点之间的间隔越长，恢复时间就越长。\n\n## 压缩和加密\n\n虽然压缩有助于节省存储空间，但会以更高的\
  \ CPU 使用率为代价。如果您在运行 MongoDB 的服务器上工作负载已受 CPU 使用率限制，您可以在以下任一情况下选择禁用压缩：\n\n- 您不关心存储设备上文件的大小\n\
  - 您存储的数据压缩性不强\n\n或者，您可以切换到不同的压缩算法以降低 CPU 使用率，尽管这通常会导致文件变大，因为压缩效果较差。MongoDB 目前支持三种压缩选项：\n\
  \n| 压缩算法 | CPU 使用率 | 压缩效率 | 备注 |\n|---|---|---|---|\n| Snappy | 最低 | 最低 | CPU 成本最低的最快选项；压缩效果较差\
  \ |\n| zstd | 中等 | 比 Snappy 好 | 在速度和压缩比之间取得平衡的选择 |\n| zlib | 最高 | 最佳 | 最慢，但提供最高的压缩率\
  \ |\n\n表 7.1：压缩算法及其性能特征\n\n\n\nThe main compression option is used to compress both\
  \ the journal and the collection data. Indexes use a form of *前缀压缩*. This is effective\
  \ for data with indexed fields that have common initial sequences.\n\nAs mentioned\
  \ earlier, every workload and dataset is unique, so it’s important to run your own\
  \ experiments to determine the best configuration. For example, if you’re using\
  \ zlib with a highly compressible, large dataset, each storage read may expand into\
  \ more pages inside the WiredTiger cache. This can lead to increased evictions and\
  \ potentially more cache misses when re-reading or updating documents.\n\nMongoDB\
  \ Enterprise uses industry-standard algorithms such as **高级加密标准** (AES) for data-at-rest\
  \ encryption, specifically AES-256 in **密码块链接** (CBC) mode configured with PKCS#7\
  \ padding. MongoDB Atlas uses encryption at rest by default for all data stored\
  \ within its clusters. This means someone with physical access to the storage devices\
  \ can’t read the data. Modern processors have hardware acceleration for these algorithms,\
  \ which means security adds little overhead.\n\nIf you are self-managing your MongoDB\
  \ deployment and you suspect AES hardware acceleration is not being used, you can\
  \ confirm it by profiling MongoDB and analyzing flame graphs.\n\n## 提高性能的配置\n\n\
  This section outlines several configuration options for the WiredTiger storage engine\
  \ that can help improve performance. In general, Atlas does not allow direct manipulation\
  \ of many WiredTiger settings. It automatically manages and optimizes these settings\
  \ based on the instance tiers. Thanks to Atlas’s simplicity and efficiency, you\
  \ can rely on its advanced automation to optimize performance in response to demand.\
  \ If your particular needs aren’t addressed, you can consult MongoDB support for\
  \ guidance tailored to your specific application.\n\nHowever, if you’re running\
  \ a self-managed MongoDB cluster, you can configure and experiment with WiredTiger\
  \ settings. When you start the MongoDB server, default values will be selected.\
  \ As you can imagine, it is impossible for MongoDB to pick defaults that are optimal\
  \ for all datasets and workloads. If you know WiredTiger is the current limiting\
  \ factor for your workload, then here are some experiments you can run to diagnose\
  \ and improve performance.\n\n### 更改 WiredTiger 缓存大小\n\nIf you know your workload\
  \ is I/O bound, you can increase the size of the WiredTiger cache to reduce the\
  \ amount of I/O needed. For example, if you are running MongoDB on a cloud instance,\
  \ you can use the cloud provider’s metrics dashboards to see how much IOPS your\
  \ workload is using. With 4,200 IOPS provisioned, a dataset larger than cache, and\
  \ a workload consisting of 95% read and 5% updates, you might observe steady state\
  \ metrics such as the following:\n\n- 每秒 3,500 次存储读取请求\n- 每秒 700 次存储写入（包括日志/日志和数据文件）\n\
  - 每秒 15,000 次数据库读取查询\n- 每秒 800 次数据库更新操作\n\nIncreasing the size of the WiredTiger\
  \ cache can reduce the number of I/O operations needed per database operation, so\
  \ while the workload is still limited to 4,200 storage operations per second, more\
  \ database operations can run because they access data in cache rather than reload\
  \ it from storage.\n\nTo adjust the cache size to 20 GB, you can use the following\
  \ command:\n\n```\ndb.adminCommand({setParameter: 1,\n  wiredTigerEngineRuntimeConfig:\
  \ 'cache_size=20G'})\n```\n\nThis command can be used on a running MongoDB instance\
  \ from the shell.\n\nHowever, there are also situations where reducing the size\
  \ of the cache can improve performance. For example, if you have a read-intensive\
  \ workload that accesses random, compressible documents in a dataset larger than\
  \ the cache, reducing the size of the WiredTiger cache allows more space for the\
  \ filesystem cache, where the data remains compressed. Each random read is more\
  \ likely to miss the WiredTiger cache but hit the filesystem cache, reducing the\
  \ number of I/O operations and increasing the number of database operations per\
  \ second.\n\nFor example, in some cases, reducing the size of the WiredTiger cache\
  \ by a factor of three can improve database performance, in operations per second,\
  \ by as much as 60%. However, this change also has its downsides, such as reducing\
  \ the performance of an insert workload by nearly 20%.\n\n### 更改 syncdelay\n\nReducing\
  \ syncdelay increases the frequency of checkpointing and is beneficial when you\
  \ need consistent, smaller, and frequent disk write operations to avoid performance\
  \ spikes. It also reduces the recovery time if a server crashes and restarts.\n\n\
  If you have a write-intensive workload and you notice periodic performance drops\
  \ that coincide with spikes in storage operations, it could indicate that reducing\
  \ syncdelay might help.\n\nIn Figure 7.2, we see an illustration of this situation.\
  \ Periodically, during checkpoints (marked with C in the diagram), storage I/O operations\
  \ increase, and the number of database operations drops.\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_184_0.png)\n\
  \n*图 7.2：检查点期间性能的周期性下降*\n\nYou can reduce syncdelay (seconds) by changing the value\
  \ in the configuration file. It defaults to 60 seconds. If it is already running,\
  \ you’ll need to restart the MongoDB server after changing the configuration file:\n\
  \n```yaml\nstorage:\n  syncdelay: 30\n```\n\nAlternatively, you can set syncdelay\
  \ with a command-line option:\n\n```bash\nmongod --syncdelay 30\n```\n\nThis should\
  \ change the performance graphs to something similar to Figure 7.3. The performance\
  \ drops and I/O spikes are not as pronounced during checkpoints.\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_185_0.png)\n\
  \n*图 7.3：更频繁检查点时的性能下降更小*\n\nOn the other hand, increasing syncdelay can be beneficial\
  \ for write-intensive workloads when you want to reduce the total number of disk\
  \ I/O operations, particularly during bulk data processing. For example, in nightly\
  \ batch workloads that update many documents multiple times, fewer I/O operations\
  \ may be needed if a document is updated more than once between checkpoints. This\
  \ reduces the impact of checkpoints on the main workload and may also lower overhead\
  \ from less frequent transaction management and storage flush operations.\n\n###\
  \ 更改 minSnapshotHistoryWindowInSeconds\n\nThe minSnapshotHistoryWindowInSeconds\
  \ parameter in MongoDB specifies the minimum time window (in seconds) for which\
  \ the storage engine retains snapshot history. A larger window allows you to query\
  \ the value of a document at a specific point in time using the snapshot read concern\
  \ over a longer period.\n\nHowever, maintaining a longer snapshot history, especially\
  \ for frequently updated documents, requires more storage and may impact write performance,\
  \ as the system must track more historical versions of the data.\n\nThis parameter\
  \ can be set both at runtime using the setParameter command and at startup using\
  \ the setParameter setting. For example, to set the parameter to 5 seconds at runtime,\
  \ you can use the following:\n\n```\ndb.adminCommand({setParameter: 1, minSnapshotHistoryWindowInSeconds:\
  \ 5})\n```\n\n**避免在配置服务器节点上修改快照历史窗口**\n\nIn sharded clusters, avoid changing the\
  \ default value on config server nodes, as this can cause internal operations to\
  \ fail.\n\n### 更改驱逐的工作方式\n\nWhile Atlas does not allow direct manipulation of internal\
  \ WiredTiger eviction settings, such as eviction_dirty_target or eviction_trigger,\
  \ these settings control how eviction begins gradually (target) and then uses database\
  \ operation threads (trigger) to bring cache usage back down. Atlas automatically\
  \ manages and optimizes these settings based on the instance tier.\n\nWhen self-managing\
  \ MongoDB, you might observe periodic drops in performance, as illustrated in Figure\
  \ 7.4. During a checkpoint, a large number of write IOPS may occur on the storage\
  \ device, sometimes exceeding the provisioned capacity, resulting in a dip in database\
  \ operations per second.\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_186_0.png)\n\
  \n图 7.4：检查点期间性能的周期性下降\n\nReducing syncdelay, as discussed earlier, can help shorten\
  \ the interval between checkpoints, but it may not be sufficient to reduce storage\
  \ spikes. Instead, a more effective approach is to adjust two eviction settings\
  \ to clean and evict data from the cache faster. This involves lowering eviction_dirty_target\
  \ from its default of 5% of cache to 2% and increasing the number of eviction worker\
  \ threads:\n\n```json\n\"storage\": {\n  \"wiredTiger\": {\n    \"engineConfig\"\
  : {\n      \"configString\": \"eviction_dirty_target=2, eviction=(threads_max=6)\"\
  \n    }\n  }\n}\n```\n\nNow, when you monitor performance, you’ll see a higher number\
  \ of storage operations per second, but smaller spikes during checkpoints, and the\
  \ impact on database operations per second is less pronounced. This is because more\
  \ worker threads are running and evicting dirty pages at a lower threshold before\
  \ the checkpoint, so less data needs to be written during the checkpoint.\n\n\n\n\
  \n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_187_0.png)\n\n*图 7.5：更改驱逐设置时下降和峰值不那么明显*\n\
  \n与许多性能调优建议一样，重要的是对你的工作负载和数据集进行实验。例如，我们看到过插入操作数量很大的工作负载，其中增加 eviction_dirty_target\
  \ 并减少驱逐工作线程数（低至 1）可以显著提高性能。\n\n## 切换到内存存储引擎\n\n内存存储引擎允许你避免磁盘 I/O，从而为数据库操作提供更高的性能和更低、更可预测的延迟。除了一些元数据和诊断信息外，内存存储引擎不会将任何数据写入磁盘。实际上，你可以将其用作缓存，从另一个数据库加载和存储数据。\n\
  \n> **注意**\n> \n> 内存存储引擎仅在自托管部署中可用，不在 MongoDB Atlas 上受支持。\n\n默认情况下，内存存储引擎使用物理 RAM\
  \ 的 50% 减去 1 GB。然而，由于你的数据不会写入磁盘（并且你不需要太多文件系统缓存），你可以增加分配的大小以使用更多内存。这可以在配置文件中配置（见下文）或通过命令行设置：\n\
  \n```\nstorage:\n  engine: inMemory\n  dbPath: <path>\n  inMemory:\n    engineConfig:\n\
  \      inMemorySizeGB: <newSize>\n```\n\n会导致数据超过指定内存大小的写操作将返回错误。如果你在运行自托管部署，可以配置分片或副本集以包含内存和\
  \ WiredTiger 存储引擎的混合。\n\n副本集内的混合存储引擎设置应仔细设计，因为它会在数据持久性、故障转移行为和性能特征方面引入细微差别。此配置通常适用于内存成员的快速访问带来的好处远远超过混合持久性模型增加的复杂性的场景。\n\
  \n## 更改最大叶子页大小\n\n正如我们在第 1 章《系统和 MongoDB 架构》中看到的，存储设备具有吞吐量和带宽限制。如果你的限制是带宽而非吞吐量，你可以通过减小\
  \ WiredTiger 的最大叶子页大小来提高性能。\n\n当前默认的页大小为集合 32 KB，索引 16 KB。这意味着，如果你运行的是在比缓存大得多的数据集上执行随机读取的应用程序，每个未命中缓存的操作只读取一个文档。如果你的文档大小仅为\
  \ 1 KB 且每页只使用一个，你实际上每执行一次访问存储的数据库操作就会浪费 31 KB 的磁盘带宽（和缓存空间）。\n\n例如，在自托管的云部署中，你可以使用性能监控工具或\
  \ iostat 来检查存储带宽是否经常达到限制。\n\n你可以通过配置文件或命令行更改 leaf_page_max 设置（针对新集合）：\n\n```\nstorage:\n\
  \  engine: wiredTiger\n  wiredTiger:\n    collectionConfig:\n      configString:\
  \ \"leaf_page_max=8192\"  # 8kB\n```\n\n你也可以在创建集合时指定它：\n\n```\ndb.createCollection(\"\
  myCollection\", {\n  storageEngine: {\n    wiredTiger: {\n      configString: \"\
  leaf_page_max=8192\"  # 8kB\n    }\n  }\n})\n```\n\n此类更改的好处会因实例大小、数据集大小、平均文档大小以及数据的可压缩性等因素而异。例如，在大型实例上的实验中，我们看到对于相对较小的文档（1\
  \ KB）且数据集大小为可用内存两倍的读密集型工作负载，性能最多可提高 2 倍。然而，当数据集增长到内存大小的 10 倍时，改善下降到约 1.4 倍。在较小的实例上，增益可能只有\
  \ 1.1 倍。\n\n与任何更改一样，存在潜在的缺点。例如，如果你的应用程序对插入性能很重要，较小的叶子页可能导致更多的 I/O 操作，因为在插入文档时页面会更快填满。此外，较小的页面意味着以下几点：\n\
  \n- 压缩可能性更少，因此磁盘上的数据集可能更大\n- 对于扫描大量数据的负载，你需要发出更多 I/O 操作来扫描相同数量的文档\n\n在许多云存储设备上，最佳块大小为\
  \ 256 KB，因此从整个系统角度来看，较小的页面可能效率较低。\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_189_0.png)\n\
  \n> **更改 leaf_page_max 需要数据重写**\n> \n> 你不能更改现有数据的 leaf_page_max 值，因此要更改集合的 leaf_page_max，你需要读取数据并重写它。\n\
  \n## 摘要\n\n总之，WiredTiger 是一种复杂的存储引擎，它融合了高效的数据结构、先进的并发控制和强大的数据管理，为现代应用程序提供高性能、可扩展且灵活的存储解决方案。\n\
  \nMongoDB 选择了当前的 WiredTiger 默认值，以在广泛的工作负载和数据集之间取得良好平衡。然而，你的工作负载和数据集是独特的，在将应用程序投入生产之前运行实验可以帮助你识别更高效的配置，从而释放更好的性能。\n\
  \n在下一章中，我们将通过探索使用 change streams 在生产环境中的高级模式、最佳实践和现实考虑，更深入地探讨 MongoDB 的响应式能力。你将深入了解如何扩展事件驱动架构、处理高吞吐量场景，以及将\
  \ change streams 与外部系统集成，以构建能够动态响应数据更改的强大应用程序。\n"
- "# 8 变更流\n\n## 变更流\n\nChange streams 是构建响应式、事件驱动应用程序的 MongoDB 最强大的功能之一。可以将其视为实时数据流，不断发送更新通知，因为它们在你的集合、数据库以及整个\
  \ MongoDB 部署中发生。此章节探讨 change streams 的架构、实现策略和性能考虑，提供实用指导，帮助你在高性能 MongoDB 部署中有效地利用此功能。\n\
  \n我们将首先通过从手动操作日志（oplog）尾部读取的演变来检查 change streams 背后的架构。你将了解 MongoDB 如何将写操作转换为更改事件，这些事件是什么样的，以及它们如何通过其生命周期。我们随后将介绍如何有效地实现\
  \ change streams，通过选择合适的观察范围、使用聚合管道进行服务器端过滤，以及使用在性能和完整性之间取得平衡的文档查找策略。最后，一个动手示例将演示如何使用\
  \ change streams 构建实时价格监控服务。\n\n本章的后半部分侧重于性能和持久性：资源优化策略、设计有弹性的消费者以及处理高容量流。我们还解决了分片集群、文档大小限制和集合生命周期的特殊考虑。本章以关于监控和副本集细微差别的指导以及调优技术的回顾结束，以确保你的\
  \ change stream 实现已准备好投入生产。\n\n本章涵盖以下主题：\n\n- 了解 change streams 的架构及其工作原理\n- 高效使用\
  \ change streams\n- 管理性能和持久性\n- 高级模式和生产就绪\n\n## 了解 change streams 架构\n\n从核心来看，change\
  \ stream 是一个保持打开状态并将数据库更改事件传递给应用程序的游标。为了充分利用 change streams，了解其在表层下如何运作至关重要。在 MongoDB\
  \ 3.6 中引入 change streams 之前，需要更改事件的开发人员要么依赖轮询，要么构建应用程序侧通知系统，要么手动尾部读取 MongoDB 的 oplog\
  \ 集合。\n\n这些方法有几个缺点。如果轮询间隔比更改更频繁，应用程序轮询可能会给数据库服务器带来不必要的负载。另一方面，如果轮询间隔较不频繁，应用程序可能会错过一些更改或引入延迟，需要额外的复杂性来处理此类场景。解析原始\
  \ oplog 条目还需要对 MongoDB 内部的了解，增加进一步的复杂性。此外，实现很脆弱，因为 oplog 格式是可能在 MongoDB 版本之间更改的内部细节。最后，手动尾部读取\
  \ oplog 提供的保证有限：如果网络连接丢失，则没有内置的可恢复性，也没有一致的排序保证。这些限制使得 oplog 尾部读取成为一种脆弱的解决方案，需要大量的专业知识才能正确实现，并使应用程序容易受到\
  \ MongoDB 版本之间内部破坏性更改的影响。\n\nChange streams 通过提供一个官方的、受支持的接口来解决这些问题，该接口抽象了底层复杂性。有了它，你可以利用以下等功能：\n\
  \n- **可靠性：** 没有重复或遗漏的事件通知\n- **结构化事件文档：** 格式良好定义的格式，包含有关每个更改的详细信息\n- **可恢复性：** 内置的恢复令牌可在断开连接后实现可靠恢复\n\
  - **排序保证：** 确保事件的一致全局排序，即使在分片集群中也是如此\n- **过滤功能：** 使用聚合管道进行服务器端过滤\n- **更安全：** 虽然\
  \ oplog 公开服务器上的所有更改，但 change streams 仅传递用户或代码有权访问的更新\n- **更简单：** 事件仅针对多数已提交的写入发送，因此你的应用程序无需处理回滚\n\
  - **可选镜像：** 你可以获取更改前和/或更改后的文档副本\n\n\n\n\nTogether, these features offer a robust\
  \ and reliable foundation for building real-time applications that respond to data\
  \ changes, while maintaining consistency and resilience, even in the face of disconnections\
  \ or server failures.\n\n## Change streams 如何工作：从写操作到事件\n\nChange streams 建立在 MongoDB\
  \ 的复制基础设施之上。理解这种关联有助于解释其能力和局限性。在高层次上，客户端应用程序通过以下步骤获知变更：\n\n- 1. 应用程序对 MongoDB 集合执行写操作。\n\
  - 2. 该操作被记录在主节点的 oplog 中。\n- 3. Change stream 功能监控 oplog 中的多数已提交条目。\n- 4. 原始 oplog\
  \ 条目被转换为更易于开发人员使用的格式。\n- 5. 事件通过打开的游标传递给客户端应用程序。\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_193_0.png)\n\
  \n图 8.1：通过 change streams 通知文档变更的序列\n\n图 8.1 显示了使用 change streams 将变更通知从 MongoDB\
  \ 传递给客户端应用程序所涉及步骤的高层次视图。App_A 和 App_B 可能代表同一个应用程序。oplog 是 MongoDB 的一部分，而 change\
  \ stream 游标（CS_Cursor）同时存在于 MongoDB 服务器内部以及 App_B 的客户端侧。\n\n此过程确保所有数据库变更都被可靠捕获，并以一致的顺序传递给需要实时响应的应用程序。在分片集群中，该过程变得更加复杂，因为路由器必须在多个分片之间进行协调，同时保持事件的全局顺序。\n\
  \n## 事件结构和生命周期\n\n每个 change stream 事件都包含有关发生了什么变化的信息，并提供维护连续性的工具。例如，这里是一个 products\
  \ 集合中文档的 price 字段变更的 change stream 事件：\n\n```\n{\n  \"_id\": {\n    \"_data\": \"\
  825F65A78B00000012B022C0100296E5A1004...\"  // Resume token\n  },\n  \"operationType\"\
  : \"update\",\n  \"ns\": {\n    \"db\": \"inventory\",\n    \"coll\": \"products\"\
  \n  },\n  \"documentKey\": {\n    \"_id\": ObjectId(\"5f65a78b0000000000000001\"\
  )\n  },\n  \"updateDescription\": {\n    \"updatedFields\": {\n      \"price\":\
  \ 29.99,\n      \"lastModified\": ISODate(\"2023-09-15T14:22:01.123Z\")\n    },\n\
  \    \"removedFields\": [\"promotion\"]\n  },\n  \"fullDocument\": { // Only present\
  \ with fullDocument option\n    // Complete current state of the document\n  }\n\
  }\n```\n\n如你所见，如果在 change stream 设置期间请求，change stream 事件可以包含完整文档。然而，这可能会显著影响性能，因此应谨慎使用。change\
  \ stream 游标在其生命周期中经历以下状态：\n\n- 1. **打开中：** 在 oplog 中建立其位置\n- 2. **等待中：** 在变更发生前保持空闲\n\
  - 3. **传递中：** 向客户端发送事件\n- 4. **恢复中：** 在断开连接后重新建立流\n- 5. **失效：** 在某些操作后终止\n\n理解此生命周期是构建弹性应用程序的关键。\n\
  \n## 有效实现 change streams\n\n现在你已经熟悉了 change streams 的架构，让我们看看如何有效地实现一个使用它们的应用程序，以在不同场景下获得最佳性能。\n\
  \n## 选择合适的范围和过滤策略\n\nMongoDB 在观察范围和过滤能力方面都提供了灵活性。这两个因素的组合对性能有显著影响。观察范围可以限制在集合、跨越数据库或扩展到整个部署。一般来说，范围越广，性能影响越大，因为消耗的资源更多，且必须处理的变更事件量更高。\n\
  \n表 8.1 概述了每个范围、其资源使用情况、预期的事件量以及在应用程序中可能选择它的典型用例：\n\n| 范围 | 资源使用 | 事件量 | 用例 |\n\
  |---|---|---|---|\n| 集合 | 较低 | 聚焦 | 特定业务事件、定向同步 |\n| 数据库 | 中等 | 中等 | 跨集合工作流、数据库范围审计\
  \ |\n| 部署 | 较高 | 最高 | 全局审计日志、多租户事件广播 |\n\n*表 8.1：Change stream 范围和特征*\n\n如表 8.1\
  \ 所示，选择合适的观察范围是在可见性和性能之间取得平衡。集合级范围提供最有效的资源使用，适用于定向用例。扩展到数据库或部署范围会增加可观察性，但也会对数据库和应用程序提出更高要求。\n\
  \n## 最佳实践\n\n选择满足你需求的最窄范围。这将通过减少数据库服务器上的资源消耗来最大化性能，并最大限度地减少应用程序需要处理的事件数量。\n\n然而，你需要将其与\
  \ change streams 的数量取得平衡，因为每个 change stream 实际上都在解析和过滤 oplog。例如，如果一个数据库有 20 个集合，并且你想处理其中\
  \ 16 个的变更，那么在数据库上有一个 change stream 比在每个集合上建立 16 个 change stream 更好。\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_196_0.png)\n\
  \n## 使用聚合管道进行服务器端过滤\n\nChange streams 最有效的性能技术之一是使用聚合管道进行服务器端过滤。这种方法显著减少了网络带宽消耗和应用程序客户端处理开销。\n\
  \n例如，如果你只对产品文档的价格变更感兴趣，可以设置一个 change stream，使用聚合管道仅匹配 price 字段的变更：\n\n```\n// MongoDB\
  \ Node.js driver code snippet\n// Opening a change stream with a filter pipeline\n\
  const pipeline = [\n  // Only capture update operations on the products collection\n\
  \  { $match: { 'ns.coll': 'products', operationType: 'update' } },\n\n  // Further\
  \ filter to only include price updates\n  { $match: { 'updateDescription.updatedFields.price':\
  \ { $exists: true } } }\n];\n\nconst filteredStream = collection.watch(pipeline);\n\
  ```\n\n此过滤后的 change stream 仅为 products 集合中 price 字段的更新发出事件，显著减少了通过网络发送并由客户端应用程序处理的数据量。\n\
  \n## 文档查找策略和性能\n\nChange streams 提供了多种访问文档数据的选项，每个选项的性能影响各不相同：\n\n- **仅增量**：默认行为；仅包含变更信息。\n\
  - **当前状态查找**：fullDocument: 'updateLookup' 获取当前文档。\n- **变更前和变更后镜像（MongoDB 6.0+）**：提供变更前后的文档状态。此可选功能可能会影响性能，因为数据库必须捕获并存储变更前或变更后的文档。\n\
  \n最佳方法取决于你的具体用例。问自己以下问题来指导你的决策：\n\n- updateDescription 中的值增量是否足以满足你的应用程序用例？\n- 你能承受多少额外的网络带宽？\n\
  - 额外的文档查找延迟是否可以接受？\n\n选择合适的选项取决于你的应用程序对准确性、性能和资源效率的需求。例如，'updateLookup' 选项将在更新发生后某个时间获取\
  \ fullDocument。如果文档很大，这可能会产生明显的性能影响。然而，它也可能需要在你的应用程序中进行仔细处理。例如，如果文档频繁变更并且有待处理的变更队列，你最终可能会读取比当前晚三个变更的版本。如果重放\
  \ change stream 也会发生这种情况；使用 'updateLookup' 时你的应用程序接收到的 fullDocument 是文档的当前版本，而不是变更时的版本。\n\
  \n## 构建价格监控服务\n\n为了在实践中说明这些概念，让我们实现一个服务来监控产品价格变更并通知感兴趣的各方。以下代码设置了一个聚合管道来监视 price\
  \ 字段的更新，并在变更超过定义阈值时通知应用程序的其他部分：\n\n```\n// Code snippets for MongoDB Node.js driver\n\
  // Configure the collection to using preImages (before the changes happen)\ndb.runCommand({\
  \ collMod: \"yourCollectionName\",\n    changeStreamPreAndPostImages: { enabled:\
  \ true }\n});\n```\n\n// Setup the change stream with lookups and filtering\nconst\
  \ priceMonitor = async (minimumPriceChange) => {\n  try {\n    const pipeline =\
  \ [\n      { $match: { operationType: 'update' } },\n      { $match: { 'updateDescription.updatedFields.price':\
  \ { $exists: true } } },\n      { $project: { documentKey: 1, 'updateDescription.updatedFields.price':\
  \ 1 } }\n    ];\n    options = { fullDocumentBeforeChange: 'required' };\n    const\
  \ stream = collection.watch(pipeline, options);\n\n    // Process each change as\
  \ it occurs\n    for await (const change of stream) {\n      const newPrice = change.updateDescription.updatedFields.price;\n\
  \      const oldPrice = change.fullDocumentBeforeChange.price;\n      const priceDiff\
  \ = Math.abs(newPrice - oldPrice);\n\n      // Only process significant price changes\n\
  \      if (priceDiff >= minimumPriceChange) {\n        await notifyPriceSubscribers(change.documentKey._id,\
  \ oldPrice, newPrice);\n      }\n    }\n  } catch (error) {\n    console.error(\"\
  Change stream error:\", error);\n    // Implement reconnection logic here\n  }\n\
  };\n\n此示例演示了若干关键性能实践。通过聚合管道实现服务器端过滤，应用程序可减少 MongoDB 与客户端之间的网络流量。此外，应用程序还在客户端应用业务特定过滤器（minimumPriceChange\
  \ 阈值）。然而，请注意，在更新前捕获文档状态（preImage）会带来一定的开销。\n\n这可能会产生细微的性能影响。实际上，启用 changeStreamPreAndPostImages\
  \ 会导致写入放大，因为需要存储副本。然而，当应用程序访问时，它们很可能仍在缓存中。如果使用 'updateLookup'，则不需要 changeStreamPreAndPostImages，因此不会发生这些额外的写入。稍后进行读取时，命中缓存的可能性相对较低。从性能角度来看，理想情况下您应该在\
  \ updatedFields 中的字段上使用 $match。如果不可行，请同时尝试 changeStreamPreAndPostImages 和 'updateLookup'。\n\
  \n## 管理性能与持久性\n\n构建使用变更流的高性能应用程序需要仔细考虑资源使用和数据持久性。让我们探讨优化两者的策略。\n\n### 资源优化策略\n\n\
  变更流会消耗整个技术栈的资源。在某些情况下，在服务器上执行额外的处理可以减轻应用程序的工作负载。在其他情况下，客户端的额外处理可以提高整体系统性能。表 8.2\
  \ 总结了这些权衡：\n\n| 资源区域 | 影响因素 | 优化方法 |\n|---|---|---|\n| 服务器端 | - 用于 oplog 处理的 CPU\
  \ 使用率\n- 用于游标状态的内存使用量\n- 网络带宽消耗 | - 积极过滤。\n- 使用最小的适当范围。\n- 将多个变更流复用为一个，并让应用程序进行过滤，以减少消耗\
  \ oplog 的游标数量。\n- 调整 oplog 大小，避免流落后于更新太多。最终，如果应用程序的变更流处理落后，oplog 就是缓冲区。 |\n| 应用程序端\
  \ | - 连接池使用\n- 事件处理能力\n- 用于缓冲的内存\n- 网络带宽使用 | - 专用连接\n- 使用批量处理 |\n\n*表 8.2：服务器与应用程序处理的权衡*\n\
  \n与大多数性能决策一样，并没有一刀切的解决方案。优化变更流处理需要仔细考虑在您的架构中资源使用最关键的位置。通过了解服务器端和应用程序端处理的权衡，您可以调整方法以在效率、可扩展性和响应性之间取得平衡。\n\
  \n> **最佳实践**\n> \n> 在高容量部署中，请考虑设置专用服务来处理变更流。这种方法将多个消费者合并到单个流连接中，提高效率并减少资源使用。\n\n\
  ### 处理高容量事件流\n\n在写入速率极高的应用程序中，变更流会产生大量事件。为了帮助此类应用程序有效扩展，请考虑以下策略：\n\n- 实现积极的服务器端过滤\n\
  - 部署用于变更流处理的专用应用程序基础设施\n- 使用在吞吐量和延迟之间取得适当平衡的批处理策略\n\n如果 oplog 太小，oplog 会滚动并覆盖旧条目，而您的应用程序尚未有机会处理其变更流事件。这将导致变更流错误。对于变更流处理可能长时间离线的应用程序而言，此风险尤其高。\n\
  \n为诊断此问题，请监控 oplog.rs 集合的大小和当前 oplog 窗口。您可以使用 MongoDB Shell 中的 db.getReplicationInfo()\
  \ 命令检查此项。如果您的 oplog 窗口很短（例如只有几个小时），则掉出 oplog 并出现错误的可能性更高。为解决此问题，请增加 oplog 大小。在副本集中，这通常涉及在配置中调整\
  \ oplogSizeMB 参数或使用更大的 oplog 重新初始化副本集。经验法则为，目标是 oplog 能够保留数天，甚至一周的操作，具体取决于您的恢复点目标（RPO）。\n\
  \n如果您怀疑变更流应用程序落后于实际数据库更改，这可能导致处理延迟或下游系统中的数据陈旧。为防止这种情况，请考虑以下方法：\n\n- 监控 MongoDB 主节点和您的变更流服务上的网络\
  \ I/O。查找与数据库活动高峰期相对应的网络利用率峰值。\n- 考虑应用程序与数据库的物理邻近性。确保 MongoDB 集群与变更流应用程序之间具有最佳的网络连接。这可能涉及将它们部署在同一数据中心或云区域。\n\
  - 如果可能，为数据库服务器和消费者应用程序提供更多网络带宽。\n- 考虑批量处理事件，而不是单独处理。\n\n您的应用程序还需要足够的计算资源来有效处理事件。如果资源受限且无法跟上更改的量，它将越来越落后，最终掉出\
  \ oplog 并收到错误。同样，MongoDB 服务器必须拥有足够的资源来生成和发送变更事件。监控运行应用程序的系统上的 CPU、内存和磁盘 I/O。查找高\
  \ CPU 使用率、内存压力或 I/O 瓶颈。尝试在变更流处理循环内尽量减少昂贵的操作。在数据库端，高 CPU 或 I/O 使用可能表明写入瓶颈。例如，繁重的索引会减慢写入速度，进而影响\
  \ oplog 的写入速度，从而影响变更流性能。\n\n如果您的变更流应用程序频繁接收 invalidate 事件，迫使其关闭并重新打开，这可能会造成干扰，如果处理不当会导致延迟增加或事件丢失。invalidate\
  \ 事件表示变更流正在监视的集合或数据库不再存在，或已发生结构性更改（例如删除或重命名），从而阻止流继续。\n\n为进行故障排除，请统计变更流接收的事件类型。如果看到\
  \ invalidate 事件，请确定触发它们的特定操作。如果可能，避免删除或重命名正在被变更流主动监视的集合或数据库，尤其是在生产环境中，持续处理至关重要。如果这些操作是必要的，请确保您的变更流应用程序设计为通过重新建立流来优雅地处理\
  \ invalidate 事件。\n\n\n\n## 分片部署的特殊考虑\n\n在分片集群中，变更流需要在多个分片之间进行协调，同时保持事件的一致全局排序。这引入了若干独特的性能考虑因素：\n\
  \n- **全局排序开销：** 在所有分片之间保持一致的排序需要协调。这由 mongos 处理，并给该基础设施带来负载。\n- **冷分片影响：** 没有写入活动的分片仍参与变更流协调。\n\
  - **地理延迟：** 分布式分片会在事件传递中引入网络延迟。\n- **块迁移处理：** 块迁移期间的更改需要特殊处理。\n- **系统级性能：** 如果分片集合具有高水平的写入活动，则\
  \ mongos 或处理流的应用程序服务器可能无法跟上所有分片的更改。\n\n为了在分片环境中调优性能，以下代码配置了两个此类参数，maxAwaitTimeMS\
  \ 和 batchSize：\n\n```\n// MongoDB Node.js driver code snippet\n// Configuring change\
  \ streams for optimal performance in sharded clusters\nconst shardedStreamOptions\
  \ = {\n  fullDocument: 'updateLookup',\n  maxAwaitTimeMS: 1000,  // Adjust based\
  \ on latency requirements\n  batchSize: 100          // Balance between throughput\
  \ and processing time\n};\n\n// Use collection-level streams where possible to reduce\
  \ coordination overhead\nconst productStream = db.collection('products').watch([],\n\
  shardedStreamOptions);\n```\n\n`batchSize` 参数设置变更流中每个批次可返回的最大文档数（上限为 16 MB）。它与游标上的\
  \ `batchSize` 参数类似。这通常需要实验，因为如果批次大小过大，游标可能会分配比所需更多的资源；如果过小，则可能导致网络往返次数增加。\n\n`maxAwaitTimeMS`\
  \ 参数设置服务器在返回空批次给变更流游标之前等待新数据更改的最长时间（以毫秒为单位）。它类似于游标上的 `maxAwaitTimeMS` 参数。\n\n以下是一些推荐的分片集群优化技术：\n\
  \n- **适当配置 periodicNoopIntervalSecs**（默认值：10 秒）以 **降低延迟** 来自冷分片或低写入分片。这些无操作确保即使在主节点上没有真实写入时，oplog\
  \ 条目也会定期创建，使分片的成员能够更新其逻辑时钟和复制位置，从而减少对较冷分片的协调流量。\n- **将变更流定位到特定集合**，尽可能这样做。这显著减少了跨分片通信开销，尤其是在高写入集合中。\n\
  - **对高活跃度集合应用使用 $match 管道的服务器端过滤。**\n- **将变更流消费者地理位置上靠近** 您的主分片以最小化网络延迟。\n- **独立监控每个分片的\
  \ oplog 窗口** 以检测可能影响基于变更流服务的潜在问题。\n- **限制文档特定变更流的数量。** 例如，与其创建数百个变更流来监视单个文档，不如创建一个变更流并在应用程序中过滤相关事件。\n\
  \n总之，在分片集群中高效运行变更流需要仔细关注配置和部署策略。通过调整诸如 `batchSize` 和 `maxAwaitTimeMS` 之类的参数，将流定位到特定集合，并减少分片之间的不必要协调，您可以显著提高性能和可靠性。如同大多数分布式系统一样，持续监控和迭代调优是保持规模化最佳行为的关键。\n\
  \n## 高级模式与生产就绪\n\n将变更流投入生产需要理解高级选项和监控需求。本节将基于官方 MongoDB 文档，探讨生产部署的关键考虑因素。\n\n###\
  \ 事务可见性与事件批处理\n\n在 MongoDB 中使用事务时，变更流遵循特定的可见性规则，影响事件传递。事务中进行的所有更改只有在事务提交后才对变更流可见。此时，该事务的所有更改会一次性作为流中的单独事件出现，同时保持事务内部的逻辑顺序。\n\
  \n这种行为确保了数据一致性，但要求您的消费者应用程序在提交大事务时能够高效处理这些事件突发。考虑在处理逻辑中实现批处理和限流机制，以优雅地处理这些激增。\n\n\
  ### 文档大小限制与集合生命周期\n\n变更流响应文档必须遵守 MongoDB 的 16 MB BSON 文档限制。如果您使用诸如 fullDocument:\
  \ 'updateLookup'（执行查找以在更新操作后获取文档的整个当前状态）的选项或处理大型文档，您可能会达到此限制，导致事件失败。对于更大的文档，在 MongoDB\
  \ 6.0.9+ 中，考虑使用 $changeStreamSplitLargeEvent 聚合阶段将大型变更事件拆分为多个较小的片段，以便单独处理而不超过大小限制。\n\
  \n当集合或数据库在变更流监视它们时被删除或重命名，变更流游标将在 oplog 中到达该点时关闭。在这些失效事件之后，如果您想重新启动流，必须使用有效的 resume\
  \ token 使用 startAfter（而不是 resumeAfter）。\n\n### 监控与健康检查\n\n生产部署应包括对多个关键指标的全面监控。对于变更流，您可以从通过\
  \ db.serverStatus().metrics.changeStream.currentOpen 命令跟踪活动游标计数开始。变更事件可能在数据库中发生更改后很长时间才到达。此外，监控事件处理延迟和吞吐量以确保最佳性能。Resume\
  \ token 持久性指标提供了恢复能力的洞察，而 oplog 窗口大小（可通过 rs.printReplicationInfo() 测量）指示历史操作可追溯的时间范围。\n\
  \n### 副本集注意事项\n\n使用自托管 MongoDB 时，以及对于具有仲裁成员的副本集，请注意如果没有足够的数据承载成员来实现多数提交，变更流可能会保持空闲。例如，在一个包含两个数据承载节点和一个仲裁者的三成员副本集中，如果\
  \ secondary 宕机，写入无法多数提交，变更流保持打开但不会发送事件。\n\n如果您预计使用变更流的服务会出现重大停机，例如维护或灾难恢复，请增加 oplog\
  \ 大小以保留操作时间超过预计的停机期。这确保您的应用程序在连接恢复后能够赶上所有更改。\n\n### 性能调优回顾\n\n在为生产环境优化变更流时，应实施若干关键策略。使用聚合管道进行服务器端过滤可显著减少事件量，最小化网络流量和处理开销。根据特定应用程序需求选择合适的文档查找策略，仔细在各种\
  \ `fullDocument` 选项之间进行选择，以在完整性和性能之间取得平衡。\n\n根据预期的最大停机场景适当调整 oplog 大小，确保它能保留足够长的操作以跨越维护窗口或恢复期。始终配置连接池大小超过打开的变更流数量，防止资源耗尽。\n\
  \n限制特定定位的变更流数量，因为这些流无法利用索引优化，可能增加服务器负载。对于事件量特别高的应用程序，考虑专用基础设施以将变更流处理与主数据库工作负载隔离，防止对关键操作造成性能影响。\n\
  \n## 总结\n\n变更流将 MongoDB 从传统数据库转变为响应式数据平台，使其能够对数据更改做出实时响应。当在考虑性能因素的情况下深思熟虑地实施时，它们为构建响应迅速的事件驱动应用程序提供了强大的基础。\n\
  \n下一章将重点转向事务，这是构建可靠且一致应用程序的重要部分。我们将深入探讨多文档 ACID 事务的机制，并讨论在各种 MongoDB 架构中优化其性能的关键考虑因素。\n\
  \n\n"
- "# 9 事务\n\n在本章中，我们将深入探讨 MongoDB 的多文档 ACID 事务，这是一项在引入时极大地扩展了 MongoDB 能力的特性。事务是你数据库工具箱中的重要工具，但正如你不会用螺丝刀钉钉子一样，务必仅在它们是合适工具时才使用。尽管功能强大，但事务在被错误使用时可能会造成性能瓶颈。\n\
  \n你可能会惊讶地听到，MongoDB 中的事务并不总是你需要的解决方案。事实上，有时它们恰恰是你应该避免使用的！在本章中，你将获得超出基本实现的 MongoDB\
  \ 事务能力的全面理解。你将学习如何在数据一致性需求与性能要求之间取得平衡，就何时真正需要事务做出明智决策。我们将探讨展示 Core 和 Callback API\
  \ 的实际示例，分析不同事务模式的性能影响，并为你提供优化事务工作负载的策略。到本章结束时，你将具备实施在保持数据完整性的同时不牺牲使 MongoDB 成为强大数据库平台的性能优势的事务的能力。\n\
  \n本章将涵盖以下主题：\n\n- 学习 MongoDB 如何支持多文档 ACID 事务\n- 使用事务 API 并有效管理会话\n- 通过最佳实践优化事务性能\n\
  - 识别并避免常见的事务反模式\n\n### 了解多文档 ACID 事务\n\n让我们深入探讨 MongoDB 的多文档 ACID 事务，这项能力标志着 MongoDB\
  \ 从一个基础的文档型数据库向能够处理复杂、关键任务工作负载的平台演进的重要里程碑。虽然 MongoDB 一直提供强大的文档级原子性，但多文档事务将这些保证扩展到多个文档、集合和数据库。\n\
  \n即使许多应用程序可以利用丰富的文档结构来确保相关的写入一起发生，仍然存在需要协调多个不同文档之间写入的使用场景，这些文档可能位于同一集合或不同集合中。因此，了解\
  \ MongoDB ACID 多文档事务的保证以及如何最好地使用它们非常重要。\n\n在本节中，我们将首先探讨 MongoDB 中事务支持的历史和演进，从单文档原子性到分片集群中的分布式事务。然后，我们将分解核心\
  \ ACID 属性，即 **atomicity**、**consistency**、**isolation** 和 **durability**，以及它们如何在\
  \ MongoDB 的事务模型中应用。最后，我们将比较文档级原子性与多文档事务，帮助你了解何时采用每种方法合适以及如何在数据完整性和性能之间取得平衡。\n\n\
  ### MongoDB 中事务的历史与演进\n\nMongoDB 在事务支持方面的历程讲述了一个有趣的故事，说明数据库如何演进以满足日益复杂的应用程序需求：\n\
  \n- **单文档时代（MongoDB 4.0 之前）**：自诞生以来，MongoDB 在单文档级别提供原子性。这对于许多用例来说已经足够，特别是利用 MongoDB\
  \ 灵活的文档模型将相关数据嵌入到单个文档中时。开发人员通常会专门设计模式以利用这种单文档原子性。\n- **副本集里程碑（MongoDB 4.0，2018）**：此版本为副本集引入了多文档\
  \ ACID 事务，这是一个改变游戏规则的功能，使 MongoDB 在需要跨多个文档强一致性的应用程序方面与关系数据库达到同等水平。此初始实现支持单个副本集内的事务。\n\
  - **分布式事务突破（MongoDB 4.2，2019）**：在前一版本的基础上，MongoDB 4.2 将多文档事务支持扩展到分片集群。这一重大进步实现了跨分片的分布式事务，为复杂的大规模应用程序提供了全面的解决方案。\n\
  - **持续改进（MongoDB 4.4 及以后）**：最近的版本专注于性能改进、操作可管理性和事务的更广泛 API 支持。\n\n这一演进反映了 MongoDB\
  \ 满足多样化应用程序需求的同时保持其在灵活性、可扩展性和性能方面的核心优势的承诺。\n\n### MongoDB 中 ACID 属性简介\n\nACID 代表确保数据库事务即使在出现错误、崩溃或断电的情况下也能可靠处理的根本属性。让我们分解这些属性在\
  \ MongoDB 上下文中的含义：\n\n- **Atomicity：** 这保证事务是全有或全无；即事务中的每个操作都成功或都不成功。如果事务的任何部分失败，整个事务将被回滚，使数据库恢复到原始状态。虽然\
  \ MongoDB 一直在单文档级别提供原子性，即如果对文档的任何更改失败，则该文档的所有更改都会失败，多文档事务将此保证扩展到多个文档。\n- **Consistency：**\
  \ 此属性确保事务将数据库从一个有效状态带到另一个有效状态，保持所有定义规则和约束。在 MongoDB 中，一致性验证主要通过文档和模式验证功能在每个文档的基础上存在。单文档操作和多文档事务都保证一致性。其他一致性验证，例如唯一索引约束，在事务内外也以相同方式得到保证。\n\
  - **Isolation：** 将隔离视为每个事务在其自己的小气泡中运行。它确保并发执行的事务不会相互干扰其结果，就好像它们是顺序执行一样。MongoDB 为事务提供快照隔离，这意味着每个事务都会看到数据在事务开始时存在的一致快照，而不管在执行期间由其他事务提交的更改如何。如果两个事务尝试进行冲突的修改，其中一个将失败并重试整个事务。\n\
  - **Durability：** 一旦事务提交，其更改就是永久的，并且将存活于随后的系统故障，例如断电或崩溃。在 MongoDB 中，持久性通过多节点上的日志记录和写入关注机制实现。当事务使用适当的写入关注提交时（例如默认的\
  \ `{w: \"majority\"}`），更改保证在副本集的大多数成员中持久存在。这比单个节点将写入提交到磁盘的保证更强。\n\n总之，ACID 属性为 MongoDB\
  \ 事务中的可预测和可靠行为提供了基础。它们确保多步骤操作要么完全完成，要么没有任何效果，有助于在并发工作负载、应用程序错误或系统故障存在的情况下保持数据完整性。这对于协调跨多个集合的更改的应用程序尤其重要，例如处理订单、更新库存或管理用户账户。\n\
  \n### 文档级原子性与多文档事务\n\n理解 MongoDB 默认的文档级原子性与多文档事务之间的差异对于有效的数据建模和优化性能至关重要。\n\n###\
  \ 文档级原子性\n\nMongoDB 一直保证对单个文档的操作是原子的。当你更新文档中的多个字段时，要么所有更改都应用，要么都不应用；没有中间状态只有部分字段更新。这些更改也只会一起或根本不向其他线程可见。这种内置的原子性，结合\
  \ MongoDB 允许嵌入相关数据的丰富文档模型，意味着许多用例实际上根本不需要多文档事务。\n\n例如，如果你正在跟踪订单及其明细，将明细嵌入到订单文档中可确保对订单状态及其项目的更新以原子方式发生：\n\
  \n```json\n{\n  \"_id\": \"order123\",\n  \"customer\": \"jane_doe\",\n  \"status\"\
  : \"shipped\",\n  \"items\": [\n    { \"product\": \"widget\", \"quantity\": 5,\
  \ \"price\": 10 },\n    { \"product\": \"gadget\", \"quantity\": 1, \"price\": 20\
  \ }\n  ]\n}\n```\n\n这种方法使数据紧密耦合，并在不协调跨多个文档更改的开销的情况下确保一致性。\n\n\n\n## 多文档事务原子性\n\n\
  多文档事务将原子性保证扩展到涉及多个文档的操作中，这些操作可以跨不同的集合、数据库或分片。多文档事务是必不可少的，当相关数据无法合理地嵌入到单个文档中时。例如，处理电子商务订单可能涉及同时更新库存水平、客户历史记录和订单记录以维护数据完整性：\n\
  \n```\n// Start a session and transaction\nconst session = client.startSession();\n\
  session.startTransaction();\n\ntry {\n  // 1. Create and insert the order document\n\
  \  const order = {\n    customerId: \"customer123\",\n    items: [\n      { productId:\
  \ \"product456\", quantity: 2, price: 25.99 },\n      { productId: \"product789\"\
  , quantity: 1, price: 49.99 }\n    ],\n    totalAmount: 101.97,\n    status: \"\
  processing\",\n    createdAt: new Date()\n  };\n\n  const orderResult = await db.orders.insertOne(order,\
  \ { session });\n  const orderId = orderResult.insertedId;\n\n  // 2. Update inventory\
  \ for multiple products\n  await db.inventory.updateOne(\n    { _id: \"product456\"\
  \ },\n    { $inc: { stockCount: -2 } },\n    { session }\n  );\n\n  await db.inventory.updateOne(\n\
  \    { _id: \"product789\" },\n    { $inc: { stockCount: -1 } },\n    { session\
  \ }\n  );\n```\n\n```\n// 3. Update customer purchase history\nawait db.customers.updateOne(\n\
  \  { _id: \"customer123\" },\n  {\n    $inc: { totalSpent: 101.97, orderCount: 1\
  \ }\n  },\n  { session }\n);\n\n// If all operations succeed, try to commit the\
  \ transaction\nawait session.commitTransaction();\n} catch (error) {\n// If an error\
  \ occurred, abort the transaction\nawait session.abortTransaction();\nconsole.error(\"\
  Transaction aborted due to error:\", error);\nthrow error;\n} finally {\n// End\
  \ the session\nsession.endSession();\n}\n```\n\n需要理解的关键权衡是，虽然多文档事务提供了更强的 consistency\
  \ 保证，但与单文档操作相比，它们通常会带来更高的性能开销。作为一般规则，在可能的情况下利用单文档原子性，并在真正必要时谨慎使用多文档事务。\n\n## 何时在\
  \ MongoDB 中使用多文档事务\n\n虽然 MongoDB 支持多文档事务，但这并不意味着你应该默认使用它们。事务会带来性能权衡，在许多情况下，MongoDB\
  \ 的原生设计提供了更好、更高效的替代方案。那么，什么时候使用多文档事务是明智的？什么时候最好不用它们？\n\n让我们看看一些多文档事务不仅有帮助而且必要的场景：\n\
  \n- **财务操作**通常需要严格的一致性以避免可能导致严重错误的差异。例如，在记录付款时，至关重要的是同时更新 payments 集合和相应的客户文档以扣除所欠资金。如果一个更新成功而另一个失败，系统可能会显示不正确的余额或不完整的记录，而多文档事务正是为了防止这种情况而设计的。\n\
  - **库存和订单管理**通常涉及在创建订单的同时同时更新多个产品的库存水平。必须确保所有这些更新作为一个整体成功或失败，以防止超卖或库存不一致。例如，如果订单已记录但库存更新失败，系统可能会显示不正确的库存可用性，导致客户不满和物流问题。多文档事务确保订单创建和所有相关的库存调整以原子方式应用，在整个过程中维护数据完整性。\n\
  - 在管理**版本更新**时，重要的是明确指定当前活动的实体版本，同时将上一个版本标记为非活动。这确保了应用程序或用户应使用哪个版本永远不会产生歧义。如果这些更改分别应用且其中一个更新失败，可能导致冲突数据，例如多个活动版本或根本没有版本，从而导致错误或不一致的行为。多文档事务允许以原子方式进行两次更新，保持清晰可靠的版本状态。\n\
  \n然而，并非每个多步骤过程都需要事务。MongoDB 的文档模型从一开始就是以性能为设计目标的，这一点在比较单文档操作与多文档事务时最为明显。两者之间的性能差距存在是因为事务需要额外的锁定以确保隔离，保持数据的快照、在多个服务器之间协调（在分片集群中）以及两阶段提交协议（在分片集群中）。\n\
  \n**当性能很重要时，请遵循此规则：**如果你能设计数据模型将相关数据保留在单个文档中，你几乎总是会比使用多文档事务获得更好的性能。因此，请考虑在以下情况下避免使用多文档事务：\n\
  \n- **相关数据可以在单个文档中建模：**如果所有需要原子更新的信息都适合放在单个文档中，利用 MongoDB 内置的单文档原子性会更高效。这种方法减少了与多文档事务相关的复杂性和开销，从而获得更好的性能和更简单的错误处理。使用单文档原子性还可以避免跨多个文档或集合的事务带来的额外锁定和协调成本。\n\
  - **较弱的一致性是可以接受的：**并非每个应用程序都需要严格的一致性保证。在某些情况下，允许宽松的一致性可以通过减少锁定和协调开销来提高性能和可扩展性。例如，分析仪表板或社交媒体信息流可以容忍数据中的轻微延迟或临时差异，而不会影响用户体验。在适当的情况下选择较弱的一致性可以帮助优化资源使用和系统响应能力，避免在不需要多文档事务时产生额外成本。\n\
  - **大规模写操作：**事务在可以修改的文档数量上存在实际限制。例如，不要使用事务加载数千个文档来生成报告或分析仪表板。这会产生不必要的开销并可能导致超时错误。相反，使用带有\
  \ `{readConcern: \"snapshot\"}` 选项的快照读取以实现时间点一致性，或创建 MongoDB 视图，在没有事务开销的情况下呈现数据的统一视角。\n\
  \n请记住，有效的模式设计通常可以完全消除对事务的需求。在使用事务之前，请自问：*“这里绝对需要事务一致性吗？”* 和 *“我能否以不同的方式建模此数据以利用单文档原子性？”*\n\
  \n## 事务 API 和会话管理\n\nMongoDB 提供了两种处理事务的方法：Core API 和 Callback API。每种方法各有其适用场景，取决于你的需求和编码风格。\n\
  \n### Core API\n\nCore API 让你可以显式控制事务生命周期的每个步骤。你负责启动会话、开始事务、提交或中止事务以及结束会话。下面是一个典型的模式，它启动会话、启动事务、执行若干操作并尝试提交事务。它必须处理提交的成功或失败，如果要进行另一次尝试，则必须在代码中显式编写，如下所示：\n\
  \n```\n// Start a session\nconst session = client.startSession();\n\n// Start a\
  \ transaction\nsession.startTransaction();\n```\n\n```\ntry {\n  // Perform operations\
  \ within the transaction\n  await collection1.updateOne({ _id: 1 }, { $set: { status:\
  \ \"active\" } }, { session });\n  await collection2.insertOne({ refId: 1, details:\
  \ \"...\" }, { session });\n\n  // Commit the transaction\n  await session.commitTransaction();\n\
  } catch (error) {\n  // If an error occurred, abort the transaction\n  await session.abortTransaction();\n\
  \  throw error;\n} finally {\n  // End the session\n  session.endSession();\n}\n\
  ```\n\n让我们逐一回顾每个部分以了解正在发生的事情：\n\n1. **会话创建：**首先，我们使用 `client.startSession()` 创建一个新会话。MongoDB\
  \ 中的所有事务都需要会话。\n2. **事务初始化：**我们使用 `session.startTransaction()` 在会话中启动新事务。\n3. **数据库操作：**在\
  \ try 块内部，我们执行多个操作（更新一个集合并向另一个集合插入）。每个操作都包含会话对象以将其与我们的事务关联。\n4. **事务提交：**如果所有操作都成功，我们使用\
  \ `session.commitTransaction()` 提交事务，这将使所有更改可见。\n5. **错误处理：**如果在操作或提交期间发生任何错误，我们捕获它，使用\
  \ `session.abortTransaction()` 中止事务，并重新抛出错误。\n6. **清理：**finally 块确保无论成功还是失败，我们始终使用\
  \ `session.endSession()` 结束会话以释放资源。\n\n使用 Core API 给予你完全的控制，但这也意味着你负责管理事务生命周期的每个细节。虽然功能强大，但这种方法需要仔细的错误处理和清理以确保可靠性和一致性。\n\
  \n\n\n## 回调 API\n\n回调 API（也称为便捷 API）通过处理大部分样板代码来简化事务管理。无需显式写出所有步骤，每个驱动程序都提供了一种更简洁的方式来实现相同的功能，并且能够自动处理某些错误上的重试。为了更好地了解，让我们看一个示例：\n\
  \n// Using the Callback API\nawait client.withSession(async (session) => {\n  return\
  \ await session.withTransaction(async () => {\n    // Perform operations within\
  \ the transaction\n    await collection1.updateOne({ _id: 1 }, { $set: { status:\
  \ \"active\" } }, { session });\n    await collection2.insertOne({ refId: 1, details:\
  \ \"...\" }, { session })\n  });\n});\n\n这个示例演示了使用回调 API 的 MongoDB 事务，它相比核心 API\
  \ 具有以下几个优势：\n\n- **简化会话管理：** client.withSession() 方法会自动创建会话，并在操作完成时确保其正确关闭，无论成功还是失败。\n\
  - **自动化事务处理：** session.withTransaction() 方法管理整个事务生命周期。它启动事务，在回调完成后尝试提交，并在发生错误时自动中止。\n\
  - **内置重试逻辑：** 与核心 API 示例不同，回调 API 包含针对瞬态错误的自动重试逻辑，遵循 MongoDB 推荐的重试模式。\n- **更简洁的代码：**\
  \ 嵌套的回调结构消除了显式 try/catch/finally 块的需求，使代码更简洁，并更专注于业务逻辑而非事务管理。\n\n对于大多数应用程序，**推荐使用回调\
  \ API**，因为它简单且内置了重试和错误处理。然而，在需要对事务行为进行非常具体的控制或需要在复杂情况下交错事务和非事务操作时，核心 API 可能更可取。\n\
  \n## 读写关注点与事务行为\n\n读写关注点控制着操作的持久性和一致性保证，包括读取数据的陈旧性和持久性。然而，在事务中，读写关注点具有一些特殊行为。\n\n\
  MongoDB 中的事务采用推测性多数读行为以确保读写自一致语义，这意味着所有或大多数读关注点行为相同：它们读取快照中可用的最新数据，并且事务成功提交的能力意味着数据将在事务成功完成时被多数提交。\n\
  \n写关注点决定了 MongoDB 对写操作请求的确认级别。我们在第 5 章《复制》中讨论了各种选项，但对于事务而言，重要的是要知道默认写关注点 majority\
  \ 是唯一有意义使用的关注点，并且它适用于整个事务，而非事务内部的单个写操作。\n\n> **事务级读写关注点**\n> \n> 读写关注点是在事务级别设置的，而不是在事务内的单个操作上，因此你不能为事务中的单个操作指定不同的读写关注点。\n\
  \n要在事务上设置读写关注点，请将值传递给 startTransaction 方法：\n\n// Example showing proper transaction\
  \ read/write concern configuration\nsession.startTransaction({\n  readConcern: {\
  \ level: \"snapshot\" },  // Default\n  writeConcern: { w: \"majority\" }      //\
  \ Default\n});\n\n作为一般规则，如果你关心事务的正确性和持久性，最好保留读写关注点的默认值。\n\n## 事务的性能考虑\n\n对于 MongoDB\
  \ 事务而言，性能是一个重要的考虑因素，可能决定应用程序的成败。虽然事务提供了强大的一致性保证，但它们也会引入开销，可能影响系统的速度、可扩展性和资源利用率。在本节中，我们将探讨\
  \ MongoDB 事务的关键性能考虑因素，并提供优化事务工作负载的实用建议。\n\n### 副本集与分片集群事务\n\n事务的行为和性能影响取决于你是在副本集还是分片集群上运行。在副本集中，事务性能相对简单。事务中的所有操作都由主节点协调。影响性能的主要因素是受影响文档的数量、文档的大小以及客户端与主节点之间的网络延迟。这些元素直接影响事务执行的速度和提交速度。\n\
  \n在分片集群中，情况变得更加复杂。跨分片事务，即触及多个分片数据的事务，需要分布式事务协调器和两阶段提交协议。这增加了开销，并可能在以下几个方面影响性能：\n\
  \n- **延迟增加：** 每个跨分片操作都会在协调器和分片之间增加网络往返\n- **资源利用率更高：** 事务协调需要额外的内存和 CPU\n- **级联性能问题的潜在风险：**\
  \ 如果一个分片变慢，可能会影响整个集群的事务性能\n\n然而，并非所有分片事务都相同。仅与一个分片上的文档交互的事务在性能上与副本集事务相同。读取多个分片但只写入一个分片的分片事务会产生轻微的性能损失。最昂贵的事务是写入多个分片的事务。涉及的分片越多，延迟越高。\n\
  \n在分片环境中，通过设计分片局部性可以显著提高性能。这意味着结构化数据和分片键，使事务中经常一起更新的相关文档驻留在同一分片上。这最大限度地减少了跨分片事务的需求。\n\
  \n此外，如果你的应用程序是全球分布式的，重要的是要考虑跨区域事务延迟。为缓解此问题，请考虑以写入限制在单个区域的方式分发集合，或探索其他技术以平衡一致性和性能。\n\
  \n### WiredTiger 缓存考虑\n\nMongoDB 的 WiredTiger 存储引擎使用内存缓存来提高性能，但事务与此缓存的交互方式有时会导致性能问题。\n\
  \n事务通过创建读取或修改的文档快照来依赖缓存。这些快照必须保留在缓存中，直到事务完成。长时间运行的事务会阻止缓存驱逐，导致内存压力。\n\n最严重的问题是当这导致\
  \ TransactionTooLargeForCache 错误时，该错误发生在事务的操作和快照超过可用缓存大小时。这通常发生在以下情况：\n\n- 事务触及的文档太多\n\
  - 事务包含非常大的文档\n- 事务运行时间过长，阻止缓存驱逐\n- WiredTiger 缓存配置对于工作负载来说太小\n\n为防止这些情况，具体取决于情况，有几种策略：\n\
  \n- **限制事务大小：** 将每个事务的文档数量保持在 1,000 以下\n- **限制事务持续时间：** 在 60 秒内提交或中止事务（默认限制）\n-\
  \ **配置适当的缓存大小：** 确保 WiredTiger 缓存设置为事务繁重工作负载的 RAM 至少 50%\n- **监控缓存压力：** 关注 `wiredTigerCacheSizeBytes`\
  \ 和 `wiredTigerCacheMaxBytes` 等指标的增加\n\n确保良好的事务性能需要使用最佳实践、勤勉的监控，并在不必要时最大限度地减少事务使用。\n\
  \n\n\n## 管理事务运行时限制和错误\n\nMongoDB 强制执行默认的 60 秒事务运行时限制，以防止长时间运行的事务影响集群健康。该限制存在有几个重要原因：长时间的事务会长时间锁定文档，阻止其他操作访问所需数据并在应用程序中造成瓶颈；它们会增加服务器的内存压力，可能影响整体数据库性能；它们会阻止\
  \ WiredTiger 缓存从缓存中驱逐数据，这可能导致内存耗尽和性能下降；并且它们会显著增加操作冲突和中止的可能性，迫使应用程序处理更多错误情况。\n\n\
  鉴于这些限制，有效管理事务持续时间对应用程序的可靠性至关重要。你可以通过跟踪事务通常运行的时间长短并为接近限制的事务设置警报来监控事务持续时间，从而在故障发生前获得优化的时间。虽然可以通过调整\
  \ transactionLifetimeLimitSeconds 服务器参数来配置限制，但增加它应被视为最后的手段，因为它并不能解决根本的性能问题，而且可能恶化整体系统健康状况。\n\
  \n更可持续的方法是优化事务以更快完成。这可以通过将大型事务拆分为更小、更易管理的事务来实现，每次处理更少的文档；确保所有查询谓词都已建立索引以加快文档选择；优化事务中使用的任何查询和聚合管道以减少处理时间；避免事务范围内的不必要操作；并且在可能的情况下，将只读操作在事务之外执行，当它们不需要事务提供的\
  \ ACID 保证时。\n\n除了时间限制的挑战之外，像 MongoDB 这样的分布式系统不可避免地会遇到需要正确处理的瞬态错误，以实现健壮的应用程序。MongoDB\
  \ 通过特定的错误标签帮助开发人员识别这些情况，这些标签建议适当的恢复策略。当你遇到 TransientTransactionError 时，它表示存在临时问题，例如网络故障、主节点选举或短暂的资源限制，如果重试则可能成功。对于这些情况，实现带有指数退避的完整事务重试可以让你的应用程序优雅地恢复，同时在不稳定期间防止系统过载。\n\
  \n同样，UnknownTransactionCommitResult 错误表示对提交是否成功存在不确定性，通常由提交确认期间的网络问题引起。此处的正确响应略有不同：你应该只重试提交操作而不是整个事务，因为事务工作本身已经执行完毕，只有最终确认存在疑问。\n\
  \n重要的是，监控重试率可以为你的系统健康提供宝贵的见解。重试次数突然增加通常表明存在潜在的性能问题，例如网络不稳定、资源限制或配置问题，需要进行调查。通过将重试监控与整体性能指标连接起来，你可以在问题对应用程序的可靠性产生重大影响之前识别并解决它们。\n\
  \n## 锁获取与竞争管理\n\nMongoDB 对事务使用多粒度锁定系统。理解锁行为对于优化事务性能至关重要。MongoDB 的锁定机制在多个粒度级别上运行，从数据库级到单个文档锁，创建了一个在数据一致性和操作吞吐量之间取得平衡的层次系统。\n\
  \n锁竞争通常在多个事务竞争修改同一文档时、在索引或集合创建等管理操作期间，或在集中在少量文档上的高写入负载下出现。有效的缓解需要多方面的方法，重点是减少锁冲突的可能性和持续时间。\n\
  \n保持事务小而专注是最小化锁持续时间的基础，使其他操作能够更快进行。不是将写入集中在特定文档上，分散这种活动有助于防止形成成为瓶颈的热点。管理任务应在活动较低的时段安排，以避免与常规应用程序工作负载竞争。\n\
  \n适当的索引通过减少操作的执行时间从而最小化它们持有锁的时间，在操作效率中发挥着至关重要的作用。通过 db.serverStatus().locks 进行定期监控可提供有关锁等待时间的宝贵见解，使能够在问题影响应用程序性能之前主动识别新兴问题。\n\
  \n锁竞争问题的识别通常通过几个关键指标表现出来：事务中止率和重试次数开始攀升，因为操作第一次未能成功完成，操作队列随着请求等待资源可用而变得更长，锁等待时间明显增加，并且客户端在操作超过可接受的响应阈值时遇到超时。通过理解这些模式并实施适当的预防措施，数据库管理员即使在要求苛刻的工作负载下也能保持最佳性能。\n\
  \n## 优化事务大小和持续时间\n\n确保良好事务性能最有效的方法是保持事务小而短暂。在本节中，我们将重点介绍如何通过限制事务大小和最小化事务持续时间来优化你的事务占用。\n\
  \n首先，尝试限制事务的大小。在可能的情况下，将其限制在每个事务少于 1,000 个修改的文档。接下来，有一些重要的策略可用于最小化事务持续时间：\n\n- **在事务前准备数据：**\
  \ 在事务之外执行昂贵的计算\n- **使用高效查询：** 确保事务内的所有操作都使用索引\n- **批量相关更改：** 在可能的情况下将多个写入分组到单个批量操作中\n\
  - **拆分大型操作：** 将非常大的操作分解为更小、更易管理的事务\n\n通过应用这些优化策略，你可以显著提高 MongoDB 中事务工作负载的性能。\n\n\
  ## 常见事务反模式及其性能成本\n\n即使怀着最好的意图，在 MongoDB 中使用事务时也很容易陷入常见陷阱。理解如何不使用事务与了解何时使用事务一样重要。在本节中，我们将探讨最频繁的反模式，解释它们为何会损害性能，并提供实用的指导以避免它们，这样你就可以让数据库保持高效运行，让运维团队满意。\n\
  \n### 长时间运行的事务及其对系统性能的影响\n\n在为 MongoDB 设计事务时，性能应是主要考虑因素。高效的事务确保你的数据库保持响应、保持高吞吐量，并为用户提供良好的体验。糟糕的事务设计，特别是当操作运行时间过长时，会对系统资源造成过度压力，增加冲突风险，并最终导致故障。\n\
  \n长时间运行的事务就像那个 overstays their welcome 的访客；它们占用资源、阻塞其他操作，并可能导致严重的性能问题。过长事务的一些示例如下：\n\
  \n- 一个事务尝试在单个操作中插入或更新数千或数百万个文档\n- 包含外部 API 调用、复杂计算或终端用户交互的操作，导致事务保持打开状态数秒或数分钟\n\
  - 批处理作业将整整一天的数据导入包装在单个事务中\n\n长时间运行的事务带来了一些性能成本。包括以下内容：\n\n- **增加锁竞争：** 锁在事务持续时间内被持有，阻止其他操作访问被锁定的文档，并显著降低并发性和吞吐量。\n\
  - **WiredTiger 缓存压力：** 存储引擎必须在事务完成之前将所有修改数据的预映像和后映像保留在缓存中。大型事务可能消耗大量缓存，迫使频繁驱逐其他有用数据。\n\
  - **TransactionTooLargeForCache 错误的风险：** 如果修改超过 WiredTiger 缓存的某个阈值，事务将完全失败。\n- **超过\
  \ transactionLifetimeLimitSeconds：** MongoDB 默认的 60 秒事务限制是有充分理由的。长时间运行的事务有被自动中止的风险，导致工作浪费和重试风暴。\n\
  - **复制滞后：** 大型事务在提交时可能产生 oplog 条目的突发，可能导致从节点落后。\n\n关键要点是： 将大型操作分解为更小、更易管理的事务。保持事务简短而高效，最好在毫秒而不是秒内完成。这种方法有助于保持系统性能，减少资源竞争，并降低事务失败的可能性。\n\
  \n### 在单文档原子性已足够的情况下不必要的事务使用\n\n新接触 MongoDB 的开发人员可能会陷入过度使用事务的陷阱，将关系数据库中并不总是必要的习惯带入文档模型。让我们检查一些事务被误用的常见场景：\n\
  \n- **对单个文档更新使用事务：** 将单个文档更新包装在事务中是不必要的，因为 MongoDB 中单文档操作本身就是原子的。这种冗余方法会增加处理开销，却不会提供任何额外的数据完整性保障。\n\
  - **使用事务代替更好的模式设计：** 另一个常见错误是在数据可以建模为单文档时仍使用事务。花时间妥善设计模式可以消除许多事务需求，并显著提升性能。\n- **将逻辑相关的数据拆分到多个集合中：**\
  \ 开发者还经常为逻辑上应归属在一起的数据创建单独的文档，然后使用事务来原子化地更新它们。这种方法不仅使代码复杂化，还会引入潜在的性能瓶颈，并增加事务冲突的可能性。\n\
  - **忽略单文档原子性：** MongoDB 的单文档原子性是一个强大的特性；不要忽视它！对于可以用单文档更新处理的运算，使用多文档事务会增加不必要的开销和复杂性。\n\
  \n### Tip\n\n在适当的情况下，将相关数据嵌入到单个文档中，以减少对多文档事务的需求。\n\n下面是一个示例，展示了事务繁重的关系型方法与文档优化的\
  \ MongoDB 模型之间的差异：\n\n// Instead of separate collections requiring transactions:\n\
  // users collection: { _id: userId, name: \"Jane\", ... }\n// profiles collection:\
  \ { userId: userId, preferences: {...}, ... }\n// settings collection: { userId:\
  \ userId, notifications: {...}, ... }\n\n// Consider a consolidated model:\n// users\
  \ collection\n{\n  _id: userId,\n  name: \"Jane\",\n  profile: {\npreferences: {\"\
  ...\"}\n},\nsettings: {\n  notifications: {\"...\"}\n}\n}\n\n在第一种方法中，用户信息被拆分到三个独立的集合：users、profiles\
  \ 和 settings。每次需要在这些集合间更新相关数据时，都需要使用多文档事务来确保一致性。这种方法会造成不必要的复杂性和性能开销。\n\n第二种方法展示了一种合并模型，其中所有用户相关信息都嵌入在\
  \ users 集合中的单个文档内。采用这种设计，你可以在一次原子操作中更新用户的个人资料偏好和通知设置，而无需事务。这种方法简化了代码、提升了性能，并利用了\
  \ MongoDB 文档模型的设计初衷。\n\n## 单文档事务\n\n对单个文档进行多次不同的更新，通常都可以用一次原子更新来替代。除非在两次写入之间涉及第三方交互，而这本身就存在问题，因为可能导致延迟大幅增加并有超出事务超时限制的风险，否则正确的做法是组合一次更新（必要时使用富有表现力的聚合语法），在一次操作中完成所有修改。\n\
  \n如果必须确保在某个线程更新文档时没有其他线程读取该文档，可以在不使用事务的情况下通过在文档中放置一个逻辑锁字段来实现：先用一次更新设置该字段，后续在更新其他字段时取消该字段。请注意，确保其余操作在与文档交互时检查锁是否存在。\n\
  \n## 仅用于只读操作的事务\n\n仅为读操作使用多文档事务是不必要的开销，会对性能产生负面影响。为了确保对多个文档的一系列读取具有一致的快照，请使用 read\
  \ concern snapshot 而不是启动事务。如果需要确保读取反映之前的写入，请使用因果一致的会话或使用线性化读关注。\n\n## 对事务范围和原子性的误解\n\
  \n一种常见的反模式是事务中包含过少或过多的内容，或误解了哪些操作真正是原子的。另一个常见误解是认为单个写入命令即使影响多个文档也是原子的。带有 `multi:true`\
  \ 选项的更新操作或 `updateMany` 方法整体上不是原子的；只有其中的每个单独写入是原子的。要使此类多更新成为原子操作，就需要将其包装在事务中。\n\n\
  仅将必须一起保持原子的操作包含在事务中。非关键操作应放在事务之外执行，以减少范围并提升性能。\n\n## 对热点文档/集合的频繁小事务\n\n小事务通常是好事，但对同一文档过于频繁地运行可能会导致性能问题。这通常发生在不同服务独立更新相关文档时，例如多个微服务同时修改同一产品的订单状态和库存。当许多事务尝试更新单个热门文档时也可能出现问题，例如大型游戏活动期间的排行榜条目。在某些工作流程中，例如用户认证流程会频繁更新会话数据、日志和审计记录，相同的集合会被反复触及，问题会累积。\n\
  \n这些情况会造成实际的减速。即使是快速的事务也可能需要排队等待文档锁，这意味着操作是串行处理而不是并行处理。竞争越激烈，写入冲突发生的可能性越大，从而迫使事务重试。\n\
  \n在这些情况下，其他方法通常更有效。不要触发大量小事务，可以在应用程序中批量更新并作为一次操作发送。对于需要高吞吐量的场景，基于队列的系统可以收集操作并批量处理。\n\
  \n如果无法避免竞争并且需要在事务中更新多个文档，请尝试先更新竞争最激烈的文档。这样，如果事务需要重试，就不必重复太多工作。\n\n## 不当的错误处理和重试逻辑\n\
  \n事务可能因多种原因而失败：瞬时网络问题、临时锁竞争或服务器端条件。如果你直接使用 Core API（而不是会自动处理重试的 Callback API），则在应用程序代码中实现适当的错误处理和重试逻辑至关重要。\n\
  \n一个常见错误是在遇到 TransientTransactionError 后未能重试事务，而该错误通常可以通过简单重试恢复。另一方面，过于激进地重试，而不进行任何延迟或退避，会使情况恶化，增加竞争。另一个问题是无限重试而不设置最大尝试次数，这可能导致资源浪费和进程卡住。开发者有时也会错误处理\
  \ UnknownTransactionCommitResult，重试整个事务而不是仅重试 commitTransaction 命令。\n\n这类错误可能产生严重后果。管理不善的重试在高流量期间可能使服务器过载。此外，如果重试逻辑不是幂等的或范围不正确，相同的操作可能会被应用多次。\n\
  \n为了避免这些陷阱，最佳做法是使用 Callback API，它会在内部安全地自动重试事务。如果你使用 Core API，请确保实现带有指数退避和抖动的重试逻辑，以避免压垮系统，同时仍允许可恢复的失败在后续尝试中成功。\n\
  \n## 事务指标监控不足\n\n正如俗话所说，“如果不测量，就无法改进！” 未能监控事务性能会让看不见的问题演变成生产事故。\n\n为了掌握事务健康状况，重要的是跟踪关键指标，例如活动事务数以及启动、提交和中止的总事务数。监控事务延迟，即事务完成所需的时间，有助于识别减速。此外，关注\
  \ WiredTiger 缓存压力和驱逐率可提供缓存利用率的洞察。诸如等待时间和获取次数等与锁相关的指标可揭示事务是否因竞争而延迟。最后，跟踪错误率，特别是事务中止或需要重试的频率与总事务数的比例，有助于定位不稳定性。\n\
  \n为了有效监控，请在 MongoDB Atlas 或你偏好的系统中设置仪表板以可视化这些指标。为异常趋势创建警报，例如中止率飙升或事务持续时间增加。将事务执行详情与数据库指标一起记录可以帮助关联问题。定期审查这些事务模式可实现持续优化并及早发现潜在问题。\n\
  \n\n\n## 摘要\n\nMongoDB 中的事务提供了强大的一致性保证，但它们也伴随着需要仔细考虑的权衡。通过遵循本章概述的最佳实践，只要记住几个关键原则，你就可以在对性能影响最小的情况下有效使用事务。在数据模型允许时，优先使用单文档原子性而非事务。保持事务小巧、专注且生命周期短。随着应用程序的演进，持续监控和优化。当然，在生产部署之前，务必在真实负载条件下测试事务行为。\n\
  \n最成功的 MongoDB 应用程序审慎使用事务：作为一种更广泛的数据一致性策略中的工具，该策略满足应用程序的要求，同时保持用户期望的性能和可扩展性。\n\n\
  现在你对 MongoDB 事务及其在维护多操作数据完整性中的作用有了扎实的理解，让我们转向下一章的客户端库。它们是你的应用程序用于与 MongoDB 交互的工具。\n"
- "# 10 客户端库\n\nMongoDB 的客户端库由官方语言驱动程序和 **对象文档映射器 (ODMs)** 组成，作为开发者与数据库之间的接口。这些库抽象了低级数据库交互，为每种编程语言提供符合惯用语、高性能的体验。通过封装网络通信、查询优化和连接管理的复杂性，客户端库让你能够专注于编写清晰、可维护的应用程序代码，而非与数据库实现细节搏斗。\n\
  \n本章重点介绍理解、配置和优化 MongoDB 客户端库以实现最佳性能和可靠性。我们将探讨驱动程序和 ODM 的作用，深入研究实用的配置最佳实践，并说明如何有效利用其功能构建健壮、可扩展的应用程序，充分利用\
  \ MongoDB 的能力。\n\n本章涵盖的关键主题包括以下内容：\n\n- 定义并解释 MongoDB 驱动程序在连接应用程序与数据库中的基本作用\n- MongoDB\
  \ 驱动程序的关键特性，包括通过共享规范实现一致性和符合惯用语的体验，以及连接管理和查询效率等性能优化技术\n- 驱动程序的高级特性，例如错误处理、读写关注点和监控能力\n\
  - ODM 在简化应用程序开发中的优势\n- ODM 的概述，包括模式强制、查询 API 和关系管理\n- 高级主题，例如使用客户端库的异步模式和网络性能优化\n\
  \n### 什么是驱动程序？\n\nMongoDB 驱动程序是软件库，促进应用程序代码与 MongoDB 集群之间的通信。不是直接使用低级网络协议、**二进制\
  \ JSON (BSON)** 序列化或线协议细节，你可以使用这些驱动程序通过直观的、特定于语言的 API 与 MongoDB 交互。驱动程序将高级操作转换为数据库命令，使你能够执行\
  \ **创建、读取、更新和删除 (CRUD)** 操作、管理索引、执行聚合管道，并在不编写原始数据库命令的情况下实现其他 MongoDB 功能。\n\nMongoDB\
  \ 为最流行的编程语言提供官方驱动程序，包括 C#、Go、Java、Node.js、PHP、Python、Ruby 和 Rust。每个驱动程序都遵循 MongoDB\
  \ 规范存储库中维护的共享规范集 https://github.com/mongodb/specifications，确保一致性和功能对等，同时保留特定于语言的惯用语，例如方法名称大小写约定。这种结构化方法在多样化的技术栈中提供可靠性，同时对使用其首选语言的开发者来说仍然感觉自然。\n\
  \nMongoDB 客户端库的有效使用直接影响应用程序性能。配置良好的驱动程序可以最小化延迟、最大化吞吐量并帮助保持应用程序可扩展性。理解连接池、重试能力、读取偏好和读写关注点使你能够为特定工作负载和可靠性要求微调数据库操作。\n\
  \n随着我们深入本章，我们将探讨这些库的内部工作原理，检查配置最佳实践，并演示如何在实际场景中利用其功能。无论你是在构建简单的 Web 应用程序还是复杂的分布式系统，了解\
  \ MongoDB 的客户端库对于创建高效、健壮的应用程序以充分利用数据库功能至关重要。\n\n### MongoDB 驱动程序的工作原理\n\n当你使用 MongoDB\
  \ 驱动程序时，你利用的是精心设计的接口来处理以下等复杂任务：\n\n- **优化数据库访问**：驱动程序管理连接池以高效重用数据库连接。不是为每个操作创建新连接，驱动程序维护一个活动连接池，减少延迟并提高性能。这包括根据需要建立、维护和关闭连接，并且通常允许配置池大小和连接超时参数。\n\
  - **序列化与反序列化数据：** MongoDB 驱动程序在将数据发送到数据库之前处理将应用程序数据序列化为 BSON 格式，然后将 BSON 响应反序列化回原生数据结构。这种自动转换确保数据在应用程序和\
  \ MongoDB 服务器之间正确传输和解释。\n- **自动重试逻辑：** 为了确保可靠性，驱动程序会自动处理网络故障的重试逻辑。如果数据库操作因临时网络问题而失败，驱动程序可以重试操作，通常基于可配置的重试策略，确保数据完整性和应用程序稳定性。\n\
  - **自动操作路由：** 在副本集中，驱动程序智能地将操作路由到适当的服务器。驱动程序了解集群拓扑，可以将读写操作定向到正确的节点，包括处理故障转移并根据读取偏好配置将读取路由到从节点。\n\
  - **监控服务器变化：** 驱动程序持续监控副本集中服务器拓扑变化。如果服务器宕机或添加新服务器，驱动程序会更新其对集群的视图并相应调整路由决策。这种动态适应确保应用程序连续性和在不断变化环境中的正常运行。\n\
  - **多文档 ACID 事务：** 它们提供 API 来启动、管理和提交或中止多文档 ACID 事务，确保多个操作之间的原子性和一致性（在 *第 9 章，事务*\
  \ 中更详细地介绍）。\n- **变更流用于实时数据变更通知：** 它们允许应用程序订阅变更流，实现数据修改、删除或插入的实时通知，这对于构建事件驱动架构至关重要（在\
  \ *第 8 章，变更流* 中更详细地介绍）。\n- **聚合管道用于复杂数据处理：** 应用程序可以定义和执行复杂的聚合管道，在 MongoDB 中转换、过滤和分组数据，实现复杂分析（在\
  \ *第 4 章，聚合* 中更详细地介绍）。\n- **GridFS 用于存储和检索大文件：** 驱动程序实现 GridFS 规范，允许应用程序通过将大文件拆分为块来存储和检索，克服文档大小限制。\n\
  - **客户端字段级加密以增强安全性：** 它们使应用程序能够在数据发送到数据库之前加密特定字段，保护传输中和静态的敏感数据。\n- **Atlas Search\
  \ 和 Vector Search：** 驱动程序公开便捷的 API，使应用程序能够利用 Atlas Search 和 Vector Search，提供强大的全文搜索和向量搜索功能，增强应用程序的搜索和分析功能。\n\
  \n\n\n\nIn essence, MongoDB drivers are more than simple connectors; they are sophisticated\
  \ tools designed to streamline database interactions and optimize performance. By\
  \ handling tasks such as connection management, BSON serialization, and intelligent\
  \ routing, drivers allow you to focus on application logic rather than low-level\
  \ database mechanics. Having this understanding of how drivers function enables\
  \ us to build robust, scalable MongoDB applications and lays the foundation for\
  \ the effective use of higher-level abstractions such as ODMs.\n\n## Key features\
  \ of MongoDB drivers\n\nMongoDB drivers offer a wide range of features that ensure\
  \ both functionality and efficiency. Understanding these features is vital for building\
  \ robust applications. In this section, we’ll delve into the key aspects that make\
  \ these drivers powerful. We’ll explore how drivers ensure consistency and reliability\
  \ through shared specifications, offer an idiomatic experience tailored to each\
  \ language, optimize for performance, and provide support for advanced features\
  \ such as transactions and change streams.\n\n## Consistency and reliability through\
  \ shared specifications\n\nOne of the defining characteristics of official MongoDB\
  \ drivers is their adherence to common specifications. By following core specifications,\
  \ all drivers support the same fundamental features, such as connection pooling,\
  \ retryable reads or writes, and wire protocol interactions, regardless of the programming\
  \ language. This consistency is particularly valuable for organizations working\
  \ in multi-language environments, as developers can expect similar behavior and\
  \ capabilities across different technology stacks.\n\nWhen MongoDB introduces new\
  \ features, these specifications are updated, ensuring that all drivers implement\
  \ the functionality in a reliable and consistent manner. This specification-driven\
  \ approach reduces bugs and unexpected behaviors across different language drivers.\n\
  \n## Community-maintained MongoDB drivers\n\nAside from MongoDB’s officially maintained\
  \ drivers, there are community-maintained drivers developed using the shared specifications.\
  \ These drivers may not implement all specifications or offer all features the official\
  \ drivers do; however, this should not discourage you from trying them in environments\
  \ where official drivers don’t exist.\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_232_0.png)\n\
  \n## Idiomatic experience\n\nAlthough MongoDB drivers share common specifications,\
  \ each driver is designed to feel natural within its programming language ecosystem.\
  \ Take the following examples:\n\n- The Node.js driver leverages JavaScript promises\
  \ and async/await patterns\n- The Python driver follows PEP guidelines and Pythonic\
  \ principles\n- The Java driver provides strong typing and integrates with Java’s\
  \ concurrency tools\n- The C# driver embraces .NET idioms and LINQ-style queries\n\
  \nThis idiomatic design means that you can work with MongoDB using patterns and\
  \ practices you’re already familiar with, reducing the learning curve and improving\
  \ productivity. Each driver’s API is designed to align with the conventions of its\
  \ host language, making database interactions feel like a natural extension of the\
  \ language itself.\n\n## Performance optimization\n\nMongoDB drivers are meticulously\
  \ engineered for performance. They minimize latency and maximize throughput by incorporating\
  \ numerous optimizations, such as the following:\n\n- **Connection pooling**: Reusing\
  \ existing database connections instead of creating new ones for each operation,\
  \ reducing connection overhead and lowering latency.\n- **Intelligent operation\
  \ routing**: Drivers make intelligent server selections by continuously monitoring\
  \ network latency and server state, dynamically routing read and write operations\
  \ to the most optimal nodes in a replica set or sharded cluster, ensuring high availability\
  \ and minimal latency.\n- **Network data compression**: Efficiently compress data\
  \ before it is transmitted across the network, employing algorithms such as Snappy,\
  \ zlib, or zstd, which reduces the amount of data transferred, thus lowering bandwidth\
  \ usage and speeding up data transmission. This is particularly beneficial for applications\
  \ dealing with large, compressible documents or high network loads.\n- **Bulk database\
  \ operations**: Allow multiple actions, such as inserts, updates, or deletes, to\
  \ be grouped into a single request, which minimizes the number of network round-trips\
  \ and dramatically reduces overall network overhead. This is especially beneficial\
  \ for improving the performance of batch data processing tasks.\n\nThese optimizations\
  \ are particularly important for high-throughput applications where database performance\
  \ directly impacts user experience. The drivers handle these optimizations behind\
  \ the scenes, allowing developers to focus on application logic rather than performance\
  \ tuning.\n\n## What are object-document mappers (ODMs)?\n\nBeyond the official\
  \ drivers, ODMs offer an additional abstraction layer that bridges MongoDB’s document-based\
  \ data model with object-oriented programming paradigms. Similar to **object-relational\
  \ mappers (ORMs)** in SQL databases, ODMs allow you to work with native language\
  \ objects instead of raw BSON documents. Popular ODMs include EF Core for C#, Symfony\
  \ for PHP, Django for Python, Mongoose for JavaScript, Mongoid for Ruby, and Prisma\
  \ for TypeScript.\n\nODMs provide valuable features, including the following:\n\n\
  - Schema enforcement and validation\n- Convenient query-building APIs\n- Relationship\
  \ management between documents\n- Middleware and life cycle hooks\n- Type safety\
  \ and IDE autocompletion\n\nSimilar to the value ORMs bring to developers working\
  \ with SQL databases, ODMs provide a meaningful abstraction layer between MongoDB’s\
  \ document-based data model and an application’s object-oriented programming paradigm.\n\
  \n## Understanding ODMs\n\nAt their core, ODMs translate between two worlds: MongoDB’s\
  \ flexible document model and the structured, class-based approach of object-oriented\
  \ programming. This translation layer offers significant advantages for developers\
  \ seeking to maintain a clean separation of concerns within their applications.\n\
  \nTo illustrate the contrast between using MongoDB’s native driver directly and\
  \ leveraging an ODM, the following examples compare retrieving a user document,\
  \ the first using the PyMongo driver, while the second demonstrates the same operation\
  \ using MongoEngine:\n\n```python\nfrom pymongo import MongoClient\n\nclient = MongoClient()\n\
  db = client.my_database\nusers = db.users\nuser = users.find_one({\"email\": \"\
  john@example.com\"})\nprint(f\"Name: {user['first_name']} {user['last_name']}\"\
  )\n```\n\nWhile PyMongo gives you full control over queries and data structures,\
  \ it leaves it to the developer to enforce schema constraints, handle serialization\
  \ logic, and manually parse or transform results.\n\n```python\n### With MongoEngine\
  \ ODM\nfrom mongoengine import Document, StringField, connect\n\nconnect('my_database')\n\
  \nclass User(Document):\n    first_name = StringField(required=True, max_length=50)\n\
  \    last_name = StringField(required=True, max_length=50)\n    email = StringField(required=True,\
  \ unique=True)\n\nuser = User.objects.get(email=\"john@example.com\")\nprint(f\"\
  Name: {user.first_name} {user.last_name}\")\n```\n\nWith MongoEngine, the schema\
  \ is declared once using Python classes, making your domain model explicit and easier\
  \ to reason about. Queries feel more natural in an object-oriented context, and\
  \ developers benefit from built-in validation, better code completion in IDEs, and\
  \ reduced risk of runtime key errors. The result is code that can be easier to read,\
  \ test, and evolve over time.\n\nThe key differentiator between a driver and an\
  \ ODM is that the driver is operation-based, whereas the ODM is state-based. Drivers\
  \ primarily focus on CRUD operations, or other database operations that you need\
  \ to perform directly.\n\nODMs, on the other hand, rely heavily on the state. You\
  \ load an object into a context, manipulate that object using language primitives,\
  \ then persist those changes. It is the job of the ODM to translate the current\
  \ state of the object into the necessary database commands to persist the object’s\
  \ state.\n\nWhile MongoDB’s native drivers provide the foundation for database communication\
  \ and interaction, ODMs build upon them to offer higher-level abstractions that\
  \ align more naturally with application code patterns. This approach reduces boilerplate,\
  \ enhances code organization, and improves maintainability by representing database\
  \ entities as classes with well-defined behaviors.\n\n## Key features of ODMs\n\n\
  ODMs offer numerous benefits that simplify database interactions and enhance application\
  \ development. In this section, we’ll explore the key advantages of ODMs, specifically\
  \ focusing on schema enforcement and data validation for structured data, the use\
  \ of intuitive query\n\n用于可读数据库交互的 API、用于定义和处理数据关联的关系管理、用于在各个阶段执行自定义逻辑的中间件和生命周期钩子，最后是类型安全和\
  \ IDE 集成，这促进了更健壮的开发工作流程并实现错误检测。\n\n## 模式强制执行和数据验证\n\n尽管 MongoDB 在设计上具有灵活的模式，但许多应用程序受益于结构一致性。正如我们在\
  \ *第 2 章，面向性能的模式设计* 中所看到的，MongoDB 提供了可选的模式验证功能，可在服务器端强制执行。然而，对于客户端验证，ODM 允许开发人员定义明确的模式，以确保文档符合预期模式。\n\
  \nMongoDB 的固有灵活性允许数据以类似 JSON 的文档形式存储，而无需严格的模式。虽然这种方法提供了很强的适应性，但如果数据结构未得到管理，也可能导致不一致。诸如\
  \ Mongoose 之类的 ODM 通过使开发人员能够定义模式来提供解决方案，这些模式充当蓝图，以确保每个文档都符合特定的结构和规则，具体方法如下：\n\n\
  - 定义必填字段和默认值\n- 指定数据类型和约束\n- 实现自定义验证逻辑\n- 在保存或检索数据时应用转换\n\n这种程度的控制在保留 MongoDB 所知灵活性的同时提供了安全性和可预测性，例如以下示例展示了\
  \ Mongoose 如何帮助强制执行数据类型和验证规则，确保 MongoDB 集合中的数据完整性：\n\n```javascript\nconst mongoose\
  \ = require('mongoose');\n\nconst userSchema = new mongoose.Schema({\n  firstName:\
  \ { type: String, required: true, trim: true },\n  lastName: { type: String, required:\
  \ true, trim: true },\n  email: {\n    type: String,\n    required: true,\n    unique:\
  \ true,\n    validate: {\n      validator: function(v) {\nreturn /^\\w+([.-]?\\\
  w+)*@\\w+([.-]?\\w+)*(\\.\\w{2,3})+$/.test(v);\n},\n    message: 'Please enter a\
  \ valid email'\n  }\n},\n});\nconst user = mongoose.model('User', userSchema);\n\
  ```\n\n在前面的示例中，定义了一个 Mongoose 模式，列出了用户记录字段处理的几条规则。用户的名字、姓氏和电子邮件都是必填项。对于前两个字段，多余的空白将被自动修剪，并且电子邮件地址的唯一性和构成将被强制执行。电子邮件字段上的自定义验证器在验证失败时会显示自定义消息，这比简单地无法修改文档提供了更好的开发人员体验。\n\
  \n## 直观的查询 API\n\nODM 提供语言惯用的方式来构建数据库查询，使其更具可读性和可维护性。示例包括在 C# 中使用 LINQ，或在 C#、Java\
  \ 和 PHP 中使用 Builders API。\n\n为了说明 ODM 中查询构建的直观性，此使用 Mongoid 的 Ruby 代码示例演示了如何使用方法链和特定于语言的语法构建复杂的数据库查询，以查找特定类别和价格范围内有库存的产品，然后对它们进行排序：\n\
  \n```\nclass Product\n  include Mongoid::Document\n  field :name, type: String\n\
  \  field :price, type: Float\n  field :category, type: String\n  field :in_stock,\
  \ type: Boolean\nend\n\n### Find all in-stock products in the \"electronics\" category\n\
  ### priced between $100 and $500, sorted by price\nresults = Product.where(:category\
  \ => \"electronics\")\n  .and(:in_stock => true)\n  .and(:price.gte => 100, :price.lte\
  \ => 500)\n  .order_by(:price => :asc)\n```\n\n大多数 ODM 提供一系列功能，使使用 MongoDB 更直观高效，包括以下内容：\n\
  \n- 用于复杂查询构建的流畅 API\n- 与 MongoDB 查询功能匹配的过滤运算符\n- 投影和排序机制\n- 分页助手\n- 聚合框架抽象\n\n因此，通过提供语言原生语法和语言惯用功能（如方法链），ODM\
  \ 大大简化并增强了查询构建过程，使其对开发人员来说更易于接近且更高效。\n\n## 关系管理\n\nMongoDB 的文档模型固有地支持嵌入文档和引用。ODM\
  \ 通过显式关系定义扩展了这一点。\n\n为了说明 ODM 如何促进关系定义，以下使用 TypeScript 的 Prisma 模式示例演示了如何在不同实体之间指定一对一、一对多和多对多关系，例如作者、书籍和流派，以结构化的方式有效建模复杂的数据关联：\n\
  \n```\nmodel Author {\n  id    String  @id @default(auto()) @map(\"_id\") @db.ObjectId\n\
  \  name  String\n  email String  @unique\n  books Book[]  // One-to-many relationship\n\
  \  bio   Bio?    // One-to-one relationship\n}\n\nmodel Book {\n  id       String\
  \  @id @default(auto()) @map(\"_id\") @db.ObjectId\n  title    String\n  isbn  \
  \   String  @unique\n  authorId String  @db.ObjectId\n  author   Author  @relation(fields:\
  \ [authorId], references: [id])\n  genres   Genre[] // Many-to-many relationship\n\
  }\n\nmodel Genre {\n  id     String   @id @default(auto()) @map(\"_id\") @db.ObjectId\n\
  \  name   String   @unique\n  books  Book[]\n}\n\nmodel Bio {\n  id       String\
  \   @id @default(auto()) @map(\"_id\") @db.ObjectId\n  text     String\n  authorId\
  \ String   @unique @db.ObjectId\n  author   Author   @relation(fields: [authorId],\
  \ references: [id])\n}\n```\n\n为了确保数据符合特定模式，ODM 提供了以下功能，使开发人员能够为文档结构和验证定义和强制执行规则：\n\
  \n- 一对一、一对多和多对多关系\n- 嵌入文档模式\n- 具有自动填充的引用模式\n- 级联操作（保存、更新和删除）\n\n通过为各种关系配置提供显式定义，ODM\
  \ 使开发人员能够在 MongoDB 的文档结构内有效建模复杂的数据关联，弥合灵活数据库模型与结构化应用程序设计之间的差距。\n\n## 中间件和生命周期钩子\n\
  \n大多数 ODM 提供钩子，在文档的访问或修改生命周期的特定点执行代码。以下示例演示了在 'save' 操作之前运行的 Mongoose 中间件，在将用户密码存储到数据库之前自动对其进行哈希处理：\n\
  \n```\nuserSchema.pre('save', async function(next) {\n  // Only hash the password\
  \ if it's modified or new\n  if (!this.isModified('password')) return next();\n\n\
  \  try {\n    this.salt = await bcrypt.genSalt(10);\n    this.password = await bcrypt.hash(this.password,\
  \ this.salt);\nnext();\n} catch (error) {\n  next(error);\n}\n});\n\nuserSchema.post('save',\
  \ function(doc) {\n  console.log(`User ${doc.email} has been saved`);\n});\n```\n\
  \nODM 通常在文档生命周期内提供各种钩子，允许开发人员在战略点执行自定义逻辑，例如以下常见示例：\n\n- 验证前/后\n- 保存前/后\n- 更新前/后\n\
  - 删除前/后\n\n这些钩子支持复杂行为，例如自动时间戳、日志记录、加密和更改跟踪。\n\n## 类型安全和 IDE 集成\n\n现代 ODM 利用语言特性提供编译时安全性和改进的开发人员体验。以下使用\
  \ Typegoose（Mongoose 的库）的 TypeScript 示例演示了类装饰器如何定义模式及其属性，从而在开发期间启用自动完成和类型检查，减少错误并提高开发人员生产力：\n\
  \n```ts\nclass User {\n  @prop({ required: true })\n  public firstName!: string;\n\
  \n  @prop({ required: true })\n  public lastName!: string;\n\n  @prop({ required:\
  \ true, unique: true })\n  public email!: string;\n\n@prop({ default: Date.now })\n\
  public registeredAt?: Date;\n\npublic get fullName(): string {\n  return `${this.firstName}\
  \ ${this.lastName}`;\n}\n}\n\nconst UserModel = getModelForClass(User);\n\n// Autocomplete\
  \ and type checking works:\nconst newUser = new UserModel({\n  firstName: \"Jane\"\
  ,\n  lastName: \"Doe\",\n  email: \"jane@example.com\"\n});\n\n// TypeScript would\
  \ catch this error:\n// newUser.nonExistentField = \"value\"; // Error!\n```\n\n\
  与语言工具和类型系统的无缝集成通过利用代码完成和类型检查等功能为开发人员提供许多优势，从而提高生产力并减少错误：\n\n- 文档属性的自动完成\n- 查询操作的<|message|>类型检查\n\
  - 重构支持\n- 通过类型进行文档\n\n最终，先进 ODM 提供的类型安全与紧密 IDE 集成的结合带来更高效、无错误的开发流程，使开发人员能够专注于构建功能而不是调试基本的数据处理问题。\n\
  \n## 对开发人员生产力的影响\n\nODM 在简化开发流程和提高开发人员生产力方面发挥着关键作用。通过提供与熟悉编码实践一致的抽象和工具，ODM 减少了管理低级数据库细节所花费的时间，使开发人员能够专注于构建应用程序功能。以下概述了\
  \ ODM 如何实现显著的生产力提升：\n\n-   **减少样板代码：** 诸如数据验证、类型转换和关系管理等常见数据库操作可以被自动化，从而消除了开发人员编写重复冗长的代码的需求，节省了时间并降低了在这些重复任务中出错的可能性。\n\
  -   **改进代码组织：** ODM 通过将数据库实体表示为类或对象来促进更结构化的方法，按业务概念对代码进行逻辑组织，从而简化开发和维护，并使数据库交互与应用程序架构保持一致。\n\
  -   **增强可读性：** ODM 使用语言惯用的语法和直观的查询 API，使数据库操作更易读易懂，因为它们遵循熟悉的编程模式，而不需要了解特定的 MongoDB\
  \ 命令，从而提高代码清晰度和团队协作。\n-   **更早捕获错误：** 通过使用模式强制和类型检查在开发时而非运行时捕获与数据相关的错误，ODM 可以防止无效数据进入数据库。这减少了后期调试的需求，节省了时间并提高了整体代码质量。\n\
  -   **简化复杂操作：** ODM 通过提供高级抽象和方法，使诸如关系管理、嵌套文档处理和条件更新等复杂数据库操作变得更简单，使开发人员能够用更少的代码和更低的认知负担完成复杂任务。\n\
  \n通过自动化例行任务、简化复杂操作并提供更清晰的代码结构，ODM 可显著提高开发人员生产力，使他们能够将更多精力集中在功能开发上，而减少对数据库底层实现的关注。\n\
  \n## When to use ODMs\n\nODM 在许多开发场景中提供显著优势，但并非对每个项目都是必需的。是否采用 ODM 取决于多个因素，包括应用程序的复杂性、开发团队的经验以及对数据完整性和一致性的具体要求。以下情况是\
  \ ODM 特别有价值且对开发项目有益的：\n\n-   从关系数据库迁移到 MongoDB 的团队会发现 ODM 有助于适应非关系数据模型，这得益于它们提供的熟悉面向对象模式。\n\
  -   当一致的数据结构是优先事项时，ODM 使定义和强制执行模式变得更容易，有助于防止数据不一致。\n-   具有复杂领域模型的应用程序，在其中管理实体之间的关系至关重要，可以从\
  \ ODM 提供的结构中获得很大益处。\n-   对于受益于清晰关注点分离的代码库，ODM 通过将数据库交互抽象为不同的层来提供帮助。\n-   寻求在开发早期减少与数据库相关错误的开发团队会欣赏\
  \ ODM 提供的内置类型检查和验证功能。\n\n然而，ODM 确实引入了一个抽象层，可能影响性能或限制对某些 MongoDB 特定功能的访问。对于具有极端性能要求或使用高级\
  \ MongoDB 功能的应用程序，在性能关键部分采用混合方法或直接驱动程序使用可能是合适的。\n\n最终，使用 ODM 的决定应基于对项目复杂性、团队对 MongoDB\
  \ 的熟悉程度以及对结构化数据处理和生产力提升需求的平衡评估。\n\n## What are application frameworks?\n\n应用程序框架为构建软件应用程序提供结构化基础，提供一组预构建的组件和库，用于标准化开发模式和实践。通过抽象常见任务，例如处理\
  \ HTTP 请求、管理数据库操作和渲染视图，这些框架使开发人员能够专注于实现业务逻辑，而不必为每个项目重新发明低级功能。\n\n## The value of\
  \ application frameworks\n\n诸如 Ruby on Rails、Django、Spring、ASP.NET MVC 和 Laravel\
  \ 等应用程序框架通过提供结构化的软件构建方法显著提升开发工作。它们提供众多优势，可增强开发过程和最终产品。以下是应用程序框架为开发团队及其解决方案带来的关键优势的分解：\n\
  \n-   1. 标准化：框架在项目中强制执行一致的结构和编码风格，使团队更易于协作和维护代码库。这种标准化降低了新团队成员的学习曲线，并确保在整个开发生命周期中遵循最佳实践。\n\
  -   2.  **效率：** 通过提供可重用组件和库，框架加速开发时间。开发人员可以快速集成身份验证、路由和数据验证等功能，而无需编写大量样板代码，从而使团队更快地交付功能。\n\
  -   3.  **可扩展性：** 设计良好的框架可处理扩展应用程序的复杂性。它们提供内置的负载均衡、缓存和数据库连接管理支持，使应用程序能够随着用户需求的增加无缝增长。\n\
  -   4.  **社区支持：** 流行的框架拥有庞大且活跃的社区，贡献插件、扩展和全面的文档。这些丰富的资源帮助开发人员快速解决问题并了解技术的最新进展。\n\
  \n本质上，应用程序框架为开发人员提供结构化、高效且可扩展的基础，促进标准化、生产力，并在大多数情况下提供强大的社区支持。\n\n## Leveraging ODMs\
  \ and ORMs in frameworks\n\n大多数应用程序框架与 ODM 或 ORM 集成以简化数据建模和模式管理。这些集成提供一致的数据库操作方法，使开发人员能够使用其原生编程语言模式处理数据。\n\
  \n以下是一个代码示例，说明如何将 ODM，特别是 Mongoose，集成到流行的 Web 应用程序框架 Express.js 中。这演示了应用程序路由层与 ODM\
  \ 提供的数据建模之间的无缝连接和交互，简化了在 Web 应用程序上下文中的数据库操作：\n\n```\nconst express = require('express');\n\
  const mongoose = require('mongoose');\nconst app = express();\n\n// Connect to MongoDB\n\
  mongoose.connect('mongodb://localhost:27017/myapp');\n\n// Define a schema using\
  \ Mongoose ODM\nconst userSchema = new mongoose.Schema({\n  name: { type: String,\
  \ required: true },\n  email: { type: String, required: true, unique: true },\n\
  \  created: { type: Date, default: Date.now }\n});\n```\n\n```\n// Create a model\
  \ from the schema\nconst User = mongoose.model('User', userSchema);\n\n// Use the\
  \ model in an Express route\napp.post('/users', async (req, res) => {\n  try {\n\
  \    const user = new User(req.body);\n    await user.save();\n    res.status(201).send(user);\n\
  \  } catch (error) {\n    res.status(400).send(error);\n  }\n});\n```\n\n前面的示例演示了使用\
  \ Mongoose 将 MongoDB 与基本 Express 应用程序集成的过程。它连接到本地 MongoDB 实例，定义了用户模式，其中包含必需的 name\
  \ 和 email 字段（后者还标记为唯一），并提供带有默认值 created 时间戳。Mongoose 模型从模式创建以与数据库交互，并通过自定义路由公开，允许创建新用户的基本\
  \ REST API。\n\n通过在应用程序内统一模式和标准，框架增强了开发人员生产力、代码可维护性和项目可扩展性。它们还促进协作工作流程，使团队能够无缝集成新功能，同时受益于既定的最佳实践。\n\
  \n## Popular MongoDB-compatible frameworks\n\n多个应用程序框架提供与 MongoDB 的出色集成，为构建现代应用程序提供稳健高效的环境。这些框架各自带来针对特定编程语言和开发范式量身定制的功能和优势。以下是一些与\
  \ MongoDB 无缝协作的流行框架：\n\n-   **Spring Data MongoDB (Java)**：提供一种便捷的、基于注解的方法来在 Spring\
  \ 应用程序中管理 MongoDB 文档。它提供存储库抽象、对象映射和事务支持，使其成为企业 Java 应用程序的稳健选择。\n\n\n\n- **Entity\
  \ Framework (C#)**: 为 .NET 开发者提供熟悉的数据访问范式，利用存储库模式和代码优先建模。MongoDB 提供程序允许 .NET 开发者在使用文档数据库时继续使用他们熟悉的相同的\
  \ Entity Framework 抽象。\n- **Ruby on Rails (Ruby)**: 以 Mongoid 作为其 ODM，Rails 遵循约定优于配置的原则，简化设置并自动化许多常规数据操作。其资源管道和脚手架工具使其在快速开发基于\
  \ MongoDB 的应用程序时特别高效。\n- **Quarkus (Java)**: 专为云原生和容器化环境设计，Quarkus 通过响应式编程模型优化性能，该模型与\
  \ MongoDB 的异步驱动程序集成良好。其较低的内存占用使其非常适合微服务架构。\n- **Django (Python)**: Django 提供了一个全面的框架，可以与\
  \ MongoEngine 集成，使开发者能够在熟悉且结构化的 Python 生态系统中利用 MongoDB 的灵活性。\n- **Flask (Python)**:\
  \ Flask 是一个轻量级替代方案，可很好地与 PyMongo 或 ODM 扩展配合使用，为开发者在使用 MongoDB 时提供更多灵活性和控制权。\n- **FastAPI\
  \ (Python)**: 一个用于使用 Python 构建 API 的现代高性能框架，FastAPI 非常适合创建由 MongoDB 支持的 RESTful\
  \ 服务。它通过 Motor 或 Beanie 支持异步数据库操作，具有出色的性能特性。\n- **Laravel (PHP)**: 一个流行的 PHP 框架，包含\
  \ artisan 命令和脚手架工具以简化数据库管理。其 Eloquent ORM 可通过诸如 jenssegers/mongodb 的包扩展以实现 MongoDB\
  \ 集成。\n- **Symfony (PHP)**: 另一个广泛使用的 PHP 框架，提供强大的数据库管理工具。Symfony 与 Doctrine MongoDB\
  \ ODM 集成以操作 MongoDB。\n\n总体而言，这些框架为开发者提供了在首选编程语言和架构模式中使用 MongoDB 的多种选择，促进高效且可扩展的应用程序开发。\n\
  \n## 使用框架与 MongoDB 时的最佳实践\n\n在利用应用程序框架与 MongoDB 时，请考虑以下重要实践：\n\n- **MongoClient\
  \ 重用：** MongoClient 实例维护到所有集群成员的连接池以及监控连接。重用此实例很重要，以防止不必要的连接重复，这通常通过单例模式或框架的 IoC\
  \ 容器的正确配置来实现。\n- **高效的模式设计：** 设计模式以在优化查询性能的同时最小化冗余。根据应用程序访问模式，适当使用嵌入式文档和引用来平衡数据规范化和非规范化，并避免潜在的\
  \ N+1 问题。\n- **避免 N+1 问题：** 注意 N+1 查询问题，其中执行多个单独查询来获取相关数据。使用诸如预加载、MongoDB 聚合管道或批量操作等技术来减少数据库往返次数。\n\
  - **缓存策略：** 实现适当的缓存层以减少数据库负载并提高应用程序性能。大多数框架提供内置缓存解决方案，可配置为与 MongoDB 查询结果配合使用。\n\
  - **延迟加载与预加载：** 根据应用程序的具体需求在延迟加载和预加载之间进行选择。延迟加载将相关数据的加载推迟到访问时，而预加载则提前获取所有相关数据。每种方法在性能和内存使用方面都有权衡。\n\
  - **生命周期回调：** 利用框架的 ODM 提供的生命周期钩子在文档生命周期的各个点执行自定义逻辑。这些回调允许您实现一致的业务规则，例如数据验证、转换或触发事件。\n\
  - **性能监控：** 对框架代码进行监控以监控 MongoDB 操作性能。了解查询模式和执行时间有助于识别瓶颈和优化机会。\n\n应用程序框架通过提供结构化、可重用的组件来显著增强\
  \ MongoDB 开发，从而简化常见任务。它们与 ODM 的集成提供了一种自然的开发体验，其中数据库操作与惯用的编程模式保持一致。通过选择与语言专业知识和项目要求相符的框架，开发团队可以更高效地构建可扩展、可维护的\
  \ MongoDB 应用程序。\n\n正如我们将在下一节中探讨的，了解流行 ODM 和框架的具体模式和陷阱将帮助您利用 MongoDB 的功能，同时保持干净、高性能的代码。\n\
  \n## 超出基础\n\n在本节中，我们将探讨高级技术和策略，这些技术和策略可以在使用客户端库时显著提高 MongoDB 应用程序的性能、弹性和可扩展性。这些实践代表了基本功能与能够处理现实世界挑战的生产就绪应用程序之间的区别。\n\
  \n### 异步和非阻塞模式\n\n现代应用程序通常需要在保持响应性的同时处理多个并发操作。异步编程模式对于实现这一点至关重要，尤其是在处理可能 otherwise\
  \ 阻塞应用程序执行的数据库操作时。\n\nMongoDB 客户端库在各种编程语言中为异步操作提供强大的支持：\n\n- **Promises 和 async/await：**\
  \ JavaScript 和 Node.js 驱动程序利用 promises 和 async/await 语法实现简洁、可读的异步代码。这消除了复杂的回调链，同时保持非阻塞执行。\n\
  - **事件驱动框架：** 许多 MongoDB 驱动程序可无缝集成到事件驱动架构中，允许应用程序将业务逻辑与 I/O 操作解耦。这种方法使应用程序在等待数据库响应时仍能继续处理。\n\
  - **语言特定实现：** 不同语言的驱动程序根据语言惯例实现异步模式，例如 Java 的 CompletableFuture、Python 的 asyncio，或\
  \ C# 和 Node.js 的 async/await。\n\n通过有效实现异步模式，您的应用程序即使在高负载下也能保持响应性，如以下 Python 示例所示：\n\
  \n```python\nimport asyncio\nfrom pymongo import AsyncMongoClient\nasync def main():\n\
  \    uri = \"\"\n    client = AsyncMongoClient(uri)\n    try:\n        database\
  \ = client.get_database(\"sample_mflix\")\n        movies = database.get_collection(\"\
  movies\")\n\n        # Query for a movie that has the title 'Back to the Future'\n\
  \        query = { \"title\": \"Back to the Future\" }\n        movie = await movies.find_one(query)\n\
  \        print(movie)\n\n        await client.close()\n    except Exception as e:\n\
  \        raise Exception(\"Unable to find the document due to the following error:\
  \ \", e)\n\n### Run the async function\nasyncio.run(main())\n```\n\n在 MongoDB 客户端库中实现异步模式使您能够构建高度响应且性能良好的应用程序。通过利用诸如\
  \ Promises、async/await 或如前述示例中所示的语言特定并发功能等构造，开发人员可以确保数据库操作不会阻塞应用程序的主线程。\n\n并发执行结合非阻塞\
  \ I/O 可防止应用程序冻结或变得无响应，最终在高负载下带来更顺畅、更高效的用户体验。\n\n### 暴露和处理故障条件\n\n为了管理瞬态故障和网络问题，您应该实现强大的错误处理。MongoDB\
  \ 驱动程序提供可重试读取和写入的机制，可在临时故障情况下自动重试操作：\n\n- **可重试写入：** MongoDB 驱动程序支持对因瞬态网络问题或副本集选举而失败的写入操作的自动重试。此功能默认启用，但可使用\
  \ retryWrites=false 连接字符串选项禁用。\n- **可重试读取：** 同样，读取操作默认配置为在某些故障时自动重试。您可以使用 retryReads=false\
  \ 选项禁用此行为。\n\n尽管这些自动重试非常强大，但它们应与应用程序代码中的适当错误处理模式相结合，以优雅地处理数据库异常，例如以下 Node.js 代码片段所示，该片段说明了在执行插入操作时如何捕获和记录特定错误条件：\n\
  \n```\ntry {\n    const result = await collection.insertOne(document);\n    console.log(`Document\
  \ inserted with _id: ${result.insertedId}`);\n} catch (err) {\n```\n\n\n\n```\n\
  if (err.code === 11000) {\n    console.error('Duplicate key error');\n} else if\
  \ (err instanceof MongoNetworkError) {\n    console.error('Network error occurred');\n\
  } else {\n    console.error('An error occurred:', err);\n}\n}\n```\n\n如果检测到重复键错误，则满足一个失败条件，而网络问题会触发另一个失败条件。try-catch\
  \ 块使应用程序能够对这些条件保持弹性，这些条件应通过适当的业务逻辑来处理。\n\n一些 MongoDB 驱动程序，例如 Node.js 驱动程序，现在已实现\
  \ **客户端操作超时 (CSOT)**。该功能通过配置 timeoutMS 值引入了更可预测的操作生命周期控制机制：\n\n```\nconst docs =\
  \ await collection.find({}, {timeoutMS: 1000}).toArray();\n```\n\n此示例确保游标的初始化和所有文档的检索将在\
  \ 1 秒（或 1,000 毫秒）内完成，如果超出此时间限制则会抛出错误。此错误需要在应用程序中处理；然而，通过确保控制在 1 秒内返回给应用程序，可以实现对操作生命周期的更严格控制。\n\
  \n除了确保操作不会超过 timeoutMS 阈值之外，当配置了 CSOT 且启用了可重试读取时，操作将继续重试直到 timeoutMS 耗尽。这为可能因持续时间较长的瞬态网络错误而失败并需要额外重试才能成功的操作提供了额外的弹性层。\n\
  \n通过实现对失败和重试的稳健处理，开发人员可以确保其 MongoDB 应用程序即使在面临瞬态问题或网络中断时也能保持稳定和可靠。\n\n## 连接管理\n\n\
  为了高效管理数据库连接，请使用驱动程序的连接池功能。与为每次数据库操作创建新连接不同，连接池有助于维护一组可重用的连接，从而显著提高性能。重要的是根据应用程序的并发需求和\
  \ MongoDB 服务器上可用的资源来配置连接池大小。\n\n以下示例演示了如何使用 PyMongo 驱动程序在 Python 中初始化 MongoDB 客户端，设置连接池的特定参数，例如最大和最小池大小，以及连接的最大空闲时间：\n\
  \n```python\nclient = MongoClient('mongodb://localhost:27017/',\n              \
  \      maxPoolSize=50,\n                    minPoolSize=10,\n                  \
  \  maxIdleTimeMS=30000)\n```\n\n连接管理将在第 11 章，管理连接和网络性能中更详细地讨论；然而，前面的示例展示了如何在 MongoClient\
  \ 实例旁边创建连接池。在这种情况下，池将始终有 10 个连接处于打开和可用状态，并在需要时可扩展到 50 个连接。每个连接在未使用时将等待 30 秒（maxIdleTimeMS\
  \ 的值）后自动关闭。\n\n有效的连接管理是应用程序性能和资源利用的基础。以下列表涵盖了可通过 MongoClient 选项或连接字符串直接设置的一些概念和可调参数的介绍：\n\
  \n- **连接池：** 连接池维护一组可重用的数据库连接，消除了反复建立新连接的开销。根据工作负载特征配置连接池大小。太小会导致连接等待时间，而太大则会浪费资源。\n\
  - **监控连接健康：** 实现健康检查以识别并替换失败的连接。大多数 MongoDB 驱动程序会自动处理此问题，但可能受益于调整超时和重试逻辑。\n- **连接选项：**\
  \ MongoDB 驱动程序提供众多可为特定用例调整的连接字符串选项：\n  - `maxPoolSize`: 池中维护的最大连接数\n  - `minPoolSize`:\
  \ 需维护的最小连接数\n  - `maxIdleTimeMS`: 连接在关闭前保持空闲的时间\n  - `connectTimeoutMS`: 建立连接时等待的最大时间\n\
  \n有效配置和管理 MongoDB 驱动程序的连接池及其选项对于保持应用程序性能、稳定性和高效的资源利用至关重要。优化池大小、连接超时和空闲时间等设置可确保您的应用程序优雅地扩展并快速响应用户请求，而强大的监控和生命周期管理可防止连接问题影响可用性。\n\
  \n为了说明如何微调连接池，请考虑以下场景及其相应的建议：\n\n| 场景 | 建议 |\n|---|---|\n| 应用程序端操作时间缓慢，但未在数据库服务器日志或实时面板中反映。\
  \ | 使用 connectTimeoutMS 确保驱动程序在连接阶段不会无限期等待。将 connectTimeoutMS 设置为大于您到集合成员的最长网络延迟的值。\n\
  \n例如，如果某个成员的延迟为 10,000 毫秒，将 connectTimeoutMS 设置为 5000（毫秒）会阻止驱动程序连接到该成员。 |\n| 配置错误的防火墙错误地关闭了套接字连接，且驱动程序无法检测到连接未正确关闭。\
  \ | 使用 socketTimeoutMS 确保套接字始终关闭。将 socketTimeoutMS 设置为驱动程序运行的最慢操作长度的两到三倍。 |\n| 服务器日志或实时面板显示应用程序花费太多时间创建新连接。\
  \ | 启动时可用连接不足。通过设置 minPoolSize 在池中分配连接。将 minPoolSize 设置为您希望在启动时可用的连接数。MongoClient\
  \ 实例确保连接数始终存在。 |\n| 数据库负载较低，且任何时候活跃连接数都很少。应用程序同时执行的 fewer operations 比预期少。 | 增加\
  \ maxPoolSize，或增加应用程序或您使用的框架中的活动线程数。 |\n| 数据库 CPU 使用率高于预期。服务器日志或实时面板显示连接尝试次数比预期多。\
  \ | 减小 maxPoolSize 值或减少应用程序中的线程数。这可以降低负载和响应时间。 |\n\n*表 10.1：与连接相关的性能问题及推荐的 MongoDB\
  \ 驱动程序设置*\n\n通过微调这些参数，您可以显著提高应用程序与 MongoDB 交互时的效率和可靠性。\n\n## 读写关注点和读取偏好\n\n如 *第\
  \ 5 章，复制* 中所述，MongoDB 提供了可配置的读取偏好、写入关注点和读取关注点，可让您精细控制操作如何与副本集交互。这些设置可直接通过客户端库进行配置，在平衡一致性、可用性和性能方面发挥着至关重要的作用：\n\
  \n- **读取偏好：** 这些决定哪些副本集成员处理读取操作：\n  - `primary`: 这是默认设置。所有读取都转到主节点。\n  - `primaryPreferred`:\
  \ 首先尝试主节点，如果不可用则使用从节点。\n  - `secondary`: 仅从从节点读取。\n  - `secondaryPreferred`: 首先尝试从节点，如果不可用则使用主节点。\n\
  \  - `nearest`: 从网络延迟最低的节点读取。\n- **写入关注点：** 这些指定写入操作所需的确认级别：\n  - `w:1`: 主节点确认写入。\n\
  \  - `w: \"majority\"`: 默认设置。写入必须在副本集的大多数成员上持久化。\n  - `w:0`: 无需确认（即发即弃 – 不推荐）。\n\
  \  - `wtimeout`: 选项用于指定时间限制，以防止写入操作无限期等待。\n- **读取关注点：** 这些控制从副本集和分片集群读取的数据的一致性和隔离属性：\n\
  \  - `local`: 默认设置。返回实例中的最新数据。\n  - `available`: 与 local 保证类似。它在分片集群中使用以实现最低延迟读取，但以一致性为代价，因为可用的读取关注点在从分片集合读取时可能会返回孤立文档。\n\
  \  - `majority`: 返回已被副本集大多数成员确认的数据。读取操作返回的文档即使在发生故障时也是持久的。\n  - `linearizable`:\
  \ 返回反映在读取操作开始之前已完成的所有成功的大多数确认写入的数据。查询可能等待并发执行的写入传播到副本集的大多数成员后才返回结果。\n\n\n\n\n- \
  \  **快照：** 使用快照读关注的查询会返回在最近过去的某个特定时间点上跨分片显示的大多数已提交数据。快照读关注仅在事务以大多数写关注提交时才提供其保证。\n\
  \n通过有效使用写关注和读关注，您可以根据需要调整一致性和可用性保证的级别，例如等待更强的一致性保证或放宽一致性要求以提供更高的可用性。\n\n## 压缩和网络性能\n\
  \n优化应用程序与 MongoDB 之间的数据传输可以显著影响性能，尤其是在处理大型数据集或高吞吐量需求时：\n\n-   **网络压缩：** MongoDB\
  \ 驱动程序支持多种压缩算法：\n    -   **Snappy：** 在压缩比和速度之间提供了良好的平衡\n    -   **zlib：** 压缩比更高但更耗\
  \ CPU\n    -   **zstd：** 新型算法，压缩效果出色且速度良好\n\n-   **最小化网络延迟：** 在可能的情况下，将应用程序和数据库部署在同一区域或数据中心。考虑针对地理分布的应用程序采用边缘部署或缓存策略。\n\
  \n-   **批量操作：** 在插入、更新或查询多个文档时，使用批量操作以最小化网络开销，如下所示：\n\n```\n// Instead of multiple\
  \ single inserts\nconst bulkOp = collection.initializeUnorderedBulkOp();\nfor (const\
  \ doc of documents) {\n  bulkOp.insert(doc);\n}\nawait bulkOp.execute();\n```\n\n\
  -   **投影：** 请求您需要的字段，而不是检索整个文档，如下所示：\n\n```\n// Only retrieve necessary fields\n\
  const result = await collection.findOne(\n  { _id: documentId },\n  { projection:\
  \ { name: 1, email: 1 } }\n);\n```\n\n有效管理数据传输通过网络压缩、通过战略部署最小化延迟、通过批处理优化操作以及利用投影减少数据检索，所有这些都在提升\
  \ MongoDB 应用程序整体性能方面发挥着至关重要的作用。通过关注这些领域，开发人员可以显著提高数据交换的效率和速度，确保最终用户获得更顺畅、更具响应性的应用程序体验。\n\
  \n## 摘要\n\n本章全面探讨了 MongoDB 的客户端库，包括驱动程序和 ODM，它们充当应用程序与数据库之间的关键接口。我们首先定义了 MongoDB\
  \ 驱动程序在促进特定语言的高性能通信中的基本作用，并探讨了关键特性，例如通过共享规范实现一致性、针对不同语言量身定制的惯用体验、性能优化技术（如连接管理）以及高级功能（如事务支持）。然后我们深入探讨了\
  \ ODM 的世界，强调了它们通过模式强制、直观的查询 API 和关系管理简化开发的好处，并检查了流行的解决方案，如 Mongoose、Mongoid、Prisma、Spring\
  \ Data 和 Django。\n\n我们讨论了最佳实践的重要性，包括连接和错误管理、查询优化、读/写关注以及监控，并探讨了应用程序框架如何与 MongoDB\
  \ 集成并利用 ODM 以提高生产力。最后，我们超越了基础知识，解决了异步模式、网络性能优化以及处理故障和重试等高级主题。掌握这些方面使开发人员能够构建的不仅是功能性的，而且是高性能、可扩展且具有弹性的\
  \ MongoDB 应用程序，充分利用数据库在实际部署中的能力。\n\n在下一章中，我们将基于您对客户端库的了解，深入探讨连接管理和网络性能，这些是决定应用程序在幕后与\
  \ MongoDB 通信有效性的关键因素。\n"
- "# 11 管理连接和网络性能\n\n## 管理连接和网络性能\n\n适当的连接管理策略可以决定解决方案是极速、具有弹性，还是在负载下崩溃。在本章中，我们将探讨连接管理在实现最佳性能和可靠性方面的作用。\n\
  \n首先，我们将检查连接基础以及影响数据库性能的网络因素，包括延迟、连接频繁创建与销毁以及网络饱和。然后，我们将探讨 MongoDB 连接架构，从 TCP/IP\
  \ 层到驱动程序连接池，并深入研究连接生命周期，以了解连接是如何建立、使用和终止的。最后，我们将介绍监控、故障排除和优化连接管理的必要策略，以防止故障级联并确保您的\
  \ MongoDB 应用程序在真实条件下保持峰值性能。\n\n本章涵盖的主题包括以下内容：\n\n-   MongoDB 中连接工作原理背后的关键概念\n- \
  \  典型的连接生命周期是什么样的\n-   某些连接故障如何导致更广泛的系统问题\n-   MongoDB 如何在内部处理连接的概述\n-   高效管理连接的技巧\n\
  \n## 了解连接基础\n\n网络性能通常成为数据库驱动应用程序中的隐藏瓶颈。即使硬件强大且查询已优化，糟糕的网络连接也会对应用程序的响应能力和用户体验产生负面影响。有几个因素促成了这种影响，包括以下内容：\n\
  \n-   **往返延迟：** 每个数据库操作至少需要一次网络往返，导致在用户期望亚秒级响应的交互式应用程序中出现明显延迟。这在微服务架构中尤其成问题，因为单个用户请求可能会触发多个级联数据库操作。\n\
  -   **连接建立开销：** 创建新连接需要 TCP 握手、TLS 协商和 MongoDB 身份验证。这些步骤可能使会话中的首次查询增加数百毫秒的延迟。这种开销的影响在无服务器环境或高并发应用程序中更为明显，在这些环境中连接经常建立和终止。\n\
  -   **带宽限制：** 大查询结果或批量操作可能会饱和可用网络容量，导致共享同一网络路径的所有数据库操作延迟。处理媒体文件、生成包含大量数据集的报告或执行数据迁移或\
  \ ETL 任务的应用程序尤其容易受到带宽限制的影响。\n-   **网络稳定性：** 数据包丢失或间歇性连接问题可能导致重试和超时，从而导致响应时间不可预测和用户体验下降。这些问题在移动应用程序、边缘计算场景或在基础设施可靠性较差的地区运营时尤其具有破坏性。\n\
  -   **分布式系统复杂性：** 在现代分布式架构中，应用程序可能与分布在不同区域或云提供商中的多个数据库实例通信，从而增加连接开销并引入协调挑战。这种复杂性在全球部署期间最为明显，此时跨区域延迟会显著影响性能，或在部分中断期间触发故障转移机制时。\n\
  \n虽然开发人员经常专注于优化查询和索引，但网络层通常决定了实际的性能上限。单个管理不善的连接可能会使操作时间增加数百毫秒，对用户造成明显影响。\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_259_0.png)\n\
  \n## 生产负载下的连接管理\n\n连接管理问题通常只在生产负载下才会出现。一个在开发期间表现良好的系统在暴露于真实流量模式时仍可能经历严重的连接问题。\n\n\
  了解网络因素和连接过程如何影响您的应用程序有助于识别和解决 MongoDB 部署中的潜在性能瓶颈。有三个关键网络因素直接影响应用程序的吞吐量和响应能力：延迟、连接频繁创建与销毁以及网络饱和。让我们逐一检查这些因素。\n\
  \n## 延迟\n\n延迟是发送请求和接收响应之间的延迟。这种延迟会影响每个操作，无论大小如何。MongoDB 操作中的延迟受多种因素影响，包括地理距离、网络条件以及操作的结构，使得全球分布式应用程序采用数据本地性或边缘缓存等策略以保持响应能力至关重要。请考虑以下因素：\n\
  \n-   应用程序服务器与 MongoDB 实例之间的地理距离增加了不可避免的基础延迟。将 MongoDB 实例部署在与应用程序服务器相同的区域，并为全球应用程序使用具有适当读偏好的多区域集群。\n\
  -   网络质量问题，例如拥塞或路由问题，会增加延迟变化。实施网络监控，使用 MongoDB Atlas 指标或自定义探针等工具，在网络退化影响用户之前识别和解决网络退化。\n\
  -   与批量操作相比，单独发送的单个操作会产生累积的延迟惩罚。在适当时使用批量操作。\n-   具有全球分布用户的应用程序可能需要数据本地性或边缘缓存等策略来减轻高延迟影响。\n\
  \n总之，延迟是影响 MongoDB 性能和用户体验的重要但经常被忽视的因素。即使是微小的延迟改进的累积影响也能显著增强应用程序的响应能力，尤其是在规模化时。通过战略性地解决地理位置、网络质量、操作批处理和数据本地性，开发人员可以最小化延迟瓶颈，并在全球分布式应用程序中提供用户期望的响应体验。请记住，延迟优化不是一次性任务，而是一个需要随着应用程序和用户群的演变而定期测量、分析和改进的持续过程。\n\
  \n\n\n## 连接抖动\n\n频繁创建和销毁连接会产生显著的开销，这会严重影响应用程序性能和资源利用率。连接抖动是指数据库连接的快速建立和终止，每次都会引入多个昂贵的操作。以下是一些示例：\n\
  \n- 新连接需要 TCP 握手，通常还伴随 TLS 协商。每个 TCP 握手至少需要在客户端和服务器之间进行一次往返，而 TLS 协商则会增加多次额外的往返以及复杂的加密操作，尤其是在跨地理区域的情况下，完成可能需要数百毫秒。\n\
  - MongoDB 的 SCRAM 认证需要多次往返。这种安全认证机制执行挑战-响应序列，通常需要在连接经过认证并准备好使用之前进行 2-3 次网络往返，从而为每次新连接增加延迟。\n\
  - 客户端和服务器都必须为每个连接分配内存和资源。在服务器端，MongoDB 为每个连接分配内存缓冲区、创建线程资源并维护状态。在客户端，类似的资源也会被分配，包括套接字缓冲区和管理结构，当连接数达到数百或数千时，这些资源会变得十分可观。\n\
  - 现代 TLS 握手涉及复杂的加密操作，包括密钥交换、证书验证和密码套件协商。这些操作会消耗 CPU 周期，在高连接速率下会加剧 CPU 饱和。\n\n连接抖动在无服务器环境或微服务架构中尤其成问题，在这些环境中服务频繁启动和停止。在无服务器环境中，如果未妥善管理，每个函数调用都可能建立一个新的数据库连接。在规模化情况下，这在流量高峰期间可能导致每秒数千次的连接尝试，压垮数据库服务器和应用程序基础设施。\n\
  \n在后面的章节中，我们将探讨如何通过使用连接池来解决连接抖动问题。我们还将简要讨论在使用无服务器环境时如何最大限度地减少连接抖动。\n\n## 网络饱和\n\n\
  当连接数或带宽达到上限时，性能会迅速下降，这可能导致一系列潜在问题出现：\n\n- MongoDB 服务器对并发连接数有配置限制\n- 过多的活动连接会消耗可用的服务器线程\n\
  - 当连接饱和时，操作必须在队列中等待\n- 过多的操作会压垮可用的网络带宽\n\n监控连接使用情况，以确保您不会接近饱和阈值。主动预防有助于避免在负载下突然出现的级联故障。\n\
  \n现在我们已经确定了管理这些网络因素的重要性，让我们深入了解 MongoDB 连接在整个生命周期中是如何实际建立、维护和终止的。了解这些机制将为优化应用程序的数据库交互提供实用的见解。\n\
  \n## 了解连接生命周期\n\nMongoDB 连接具有明确定义的生命周期。了解此生命周期可以帮助您构建高效、可扩展的应用程序。连接生命周期分为三个阶段，我们将在以下各节中进行探讨。\n\
  \n### 连接建立\n\n建立 MongoDB 连接涉及一系列低级和应用级握手，为客户端和服务器安全高效地通信做好准备。此过程中的每个步骤都会引入一定的开销，但它们共同构成了可靠且经过身份验证的会话的基础：\n\
  \n- 1. TCP 三次握手创建网络连接：此初始步骤使用标准的 SYN、SYN-ACK、ACK 数据包交换在您的应用程序和 MongoDB 服务器之间建立通信。\n\
  - 2. TLS/SSL 握手（如果启用）协商安全通信：当启用传输中网络加密时，此额外的握手会交换证书、验证身份并协商加密协议。现代 MongoDB 部署通常使用\
  \ TLS 1.2 或 1.3 以获得最佳安全性。\n- 3. MongoDB 握手交换版本和身份验证信息：一旦网络连接建立，驱动程序和服务器就会交换协议信息，包括支持的功能、服务器功能和\
  \ MongoDB 版本兼容性。这确保驱动程序和服务器能够使用兼容的功能进行正确通信。\n- 4. **认证过程验证凭据：** 根据您的安全配置，MongoDB\
  \ 使用您配置的认证机制验证用户凭据。失败的认证尝试会被记录，并且根据配置可能会触发安全警报。\n- 5. **服务器为新连接分配资源：** 每个连接都会消耗服务器资源，包括缓冲区内存、线程调度容量和文件描述符。这些资源在任何服务器上都是有限的，这就是为什么存在连接限制以防止资源耗尽，从而可能影响数据库性能或稳定性。\n\
  \n综合起来，这些步骤确保每个新连接都是安全的、经过身份验证的，并且完全准备好进行客户端-服务器交互。\n\n### 连接使用与连接池\n\nMongoDB 驱动程序使用连接池来优化性能、降低延迟并更高效地管理资源。以下是连接池在幕后如何工作：\n\
  \n- **连接池维护已建立的连接：** MongoDB 驱动程序实现连接池，预先建立并维护一组连接。这消除了后续操作的建立开销，并提供对数据库资源的即时访问。\n\
  - **操作在需要时从池中获取连接：** 当您的应用程序执行查询、更新或命令时，驱动程序会自动从池中获取一个可用连接。如果没有可用连接，操作要么等待（可配置超时），要么在低于最大容量时池会创建新连接。\n\
  - **操作完成后将连接释放回池中：** 操作完成后，连接会返回到池中而不是关闭，使其可立即供下一个操作使用。这种循环利用方法通过避免每次操作的建立成本来提高吞吐量。\n\
  - **合理复用消除了重复建立的成本：** 通过重用连接，应用程序避免了重复握手和身份验证的累积开销。对于高负载应用程序，这可以降低延迟并显著提高整体吞吐量。\n\
  - **健康监控确保连接保持有效：** 驱动程序会定期使用轻量级心跳命令检查池中连接的有效性。这可防止应用程序使用可能已被防火墙、代理或网络问题关闭的陈旧连接，确保操作不会因使用无效连接而失败。\n\
  \n连接池使 MongoDB 使用更高效，了解其作用可以帮助您更好地管理应用程序性能，尤其是在负载下。\n\n### 连接终止\n\n无论是有意设计还是由于意外事件，MongoDB\
  \ 连接都可能并且会终止。了解常见原因和处理终止的最佳实践可确保您的应用程序保持稳定和响应：\n\n- **空闲连接可能在配置的超时时间后关闭：** 为了节省资源，驱动程序和服务器都可以关闭长时间未使用的连接。此清理可防止资源泄漏，但在超时后恢复活动时需要重新建立。\n\
  - **应用程序关闭时应正确关闭连接：** 设计良好的应用程序会在优雅关闭期间显式关闭其 MongoDB 客户端。这会及时释放服务器资源并防止连接泄漏。大多数现代框架都提供用于注册这些清理操作的钩子。\n\
  - **网络错误可能导致连接被强制中断：** 诸如网络分区、防火墙中断或硬件故障等意外问题可能会突然终止连接。健壮的应用程序会实现重试逻辑并采用指数退避来优雅地处理这些情况，而不会影响用户。\n\
  - **服务器重启或维护需要重新建立连接：** 在 MongoDB 维护操作或副本集选举期间，现有连接可能会被终止。驱动程序会自动检测这些事件并建立新连接，但应用程序应为这些转换期间的操作实现适当的错误处理。\n\
  - **适当的清理确保资源及时释放：** 每个连接都会在客户端和服务器上消耗内存、文件描述符和处理能力。适当的终止会释放这些资源，防止内存泄漏和系统限制（如最大文件描述符）的耗尽。\n\
  \n通过主动管理空闲超时、应用程序关闭和意外断开连接，您有助于确保资源得到干净释放，并且应用程序能够优雅地恢复。\n\n\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_264_0.png)\n\
  \n## 关闭 MongoClient 以防止资源泄漏\n\n如果你使用的驱动程序支持，则应在应用程序关闭例程中始终调用 MongoClient.close()\
  \ 方法，以正确释放所有连接及相关资源。这可以防止资源泄漏并确保应用程序干净终止。有关适当的连接清理策略的更多详细信息，请参阅本章后面“优化连接管理”部分。\n\
  \n理解 MongoDB 连接生命周期对于构建性能优异且健壮的应用程序非常重要。连接建立会带来一定的开销，因此对于高吞吐量系统而言，高效的池化和复用非常重要。正确处理连接终止可以防止随着时间的推移可能导致应用程序性能下降的资源泄漏。\n\
  \n## MongoDB 连接架构\n\n理解 MongoDB 如何从驱动程序到服务器管理连接对于设计健壮的应用程序非常重要。本节介绍基本连接机制以及它们如何在应用程序栈中交互，包括\
  \ TCP/IP 和 MongoDB Wire 协议、驱动程序连接池以及服务器连接处理。\n\n## TCP/IP 和 MongoDB Wire 协议\n\n\
  MongoDB 的客户端-服务器通信基于 TCP/IP，但包含多个 MongoDB 特定的增强和优化。理解这些技术细节有助于开发人员诊断连接问题并优化网络性能。\n\
  \nMongoDB Wire 协议是一种基于套接字的请求-响应式协议，定义了客户端和服务器如何通过标准 TCP/IP 套接字进行通信。它具有以下几个定义特征：\n\
  \n- **二进制 JSON（BSON）格式：** 与基于文本的协议（如 HTTP）不同，MongoDB 使用 BSON 实现高效的序列化和反序列化，且 CPU\
  \ 开销最小。\n- **现代消息格式：** 自 MongoDB 5.1 起，OP_MSG 已成为客户端请求和数据库回复的主要操作码，取代了旧的操作码，如 OP_QUERY\
  \ 和 OP_REPLY。\n- **压缩支持：** OP_COMPRESSED 使用 snappy、zlib 或 zstd 等压缩算法包装其他操作码，以减少网络带宽。\n\
  - **消息校验和：** 可选的 CRC-32C 校验和确保数据完整性，尤其对非 TLS 连接很重要。\n\n当客户端连接到 MongoDB 时，会按顺序发生多个操作，每个阶段都可能带来性能影响：\n\
  \n1. **DNS 解析阶段：** 连接过程始于解析 MongoDB 服务器地址。DNS 解析将主机名转换为 IP 地址，SRV 记录可为副本集和分片集群启用智能服务发现。DNS\
  \ 记录上的 TTL 设置会影响拓扑更改向客户端传播的速度。解析失败可能会在驱动程序中触发指数退避重试算法，可能导致连接延迟。一旦地址解析完成，连接将进入 TCP\
  \ 建立阶段。\n2. **TCP 连接阶段：** DNS 解析后，客户端建立网络基础。Keep-alive 数据包有助于维护长连接并检测死连接以释放资源。TCP\
  \ 窗口缩放通过允许在需要确认之前传输更多数据，从而在高延迟连接上实现更高吞吐量。TCP 连接建立后，将应用安全层。\n3. **TLS/SSL 安全阶段：**\
  \ TCP 连接建立后，随后建立安全加密。证书验证会在验证服务器真实性时引入少量延迟。TLS 会话恢复可以通过重用先前会话的参数来减少重连时的握手开销。在 TLS\
  \ 1.3（在较新 MongoDB 版本中受支持）下，握手往返次数从两次减少到一次，从而提高连接速度。所选密码套件会影响安全态势和 CPU 开销。一旦加密通道建立，MongoDB\
  \ 特定协议协商开始。\n4. **MongoDB 特定握手阶段：** 连接现在交换 MongoDB 协议信息。客户端发送 `hello`（或 `isMaster`）命令以交换功能文档（`isMaster`\
  \ 保留用于向后兼容）。在此阶段，驱动程序检测服务器版本并相应调整功能兼容性。拓扑发现识别集群中的主节点、从节点和仲裁节点。诸如 `maxWireVersion`\
  \ 之类的服务器参数决定可用功能和 Wire 协议兼容性。建立协议兼容性后，连接进入身份验证阶段。\n5. **身份验证阶段：** 最终阶段在允许数据库操作之前验证客户端身份。SCRAM-SHA-256（默认）提供强大的安全性，但需要多次往返。X.509\
  \ 证书身份验证将身份绑定到 TLS 证书以增强安全性。LDAP 和 Kerberos 代理身份验证会增加额外的网络跳数和延迟。一旦身份验证完成，连接即完全建立并可使用。\n\
  \n这些步骤中的每一个都会导致总连接延迟的增加，该延迟在本地部署中可能为几毫秒，而在跨地理区域或使用复杂身份验证方案时可能达到数百毫秒。这种连接开销凸显了连接池对于高性能应用程序至关重要的原因。\n\
  \n## 驱动程序连接池\n\nMongoDB 驱动程序是特定于语言的库，处理与 MongoDB 服务器通信的复杂性。它们最重要的功能之一是连接池。当你的应用程序初始化\
  \ MongoDB 客户端时，驱动程序会创建一个连接池（或根据拓扑创建多个池）。当你的代码执行 MongoDB 操作时，驱动程序会从池中借用一个可用连接。它通过连接发送命令并等待响应。操作完成后，连接会被归还到池中以供重用。驱动程序还通过监控连接健康状况来维护连接池，并可能定期测试或替换它们。\n\
  \n连接池具有以下可调整参数：\n\n- **maxPoolSize：** 池可维护的最大连接数（大多数驱动程序中默认为 100）。\n- **minPoolSize：**\
  \ 池即使在空闲时也能维护的最小连接数（大多数驱动程序中默认为 0）。\n- **maxConnecting：** 限制并发建立中的连接数（大多数驱动程序中默认为\
  \ 2）。此参数在 Rust 驱动程序中不可用。\n- **maxIdleTimeMS：** 空闲连接在池中保留的时间，然后被关闭。\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_266_0.png)\n\
  \n> **为异步应用程序优化 maxPoolSize**\n>\n> 对于异步应用程序，将 maxPoolSize 设置为与预期并发量匹配而不是线程池大小，通常会带来更好的性能。\n\
  \n有关上述连接池参数的更多信息，请务必查看 MongoDB 文档 https://www.mongodb.com/docs/manual/tutorial/connection-pool-performance-tuning/。\n\
  \n连接池行为因驱动程序是同步还是异步而有显著差异。对于同步驱动程序，当没有可用连接时，调用线程会阻塞操作，直到有连接可用或等待队列超时到期。另一方面，异步驱动程序会返回一个\
  \ future 或 promise，在连接可用时解析，而不是阻塞。\n\n## MongoDB 服务器连接处理\n\n高效的连接处理支持可扩展、高性能的 MongoDB\
  \ 部署。在服务器端，MongoDB 使用可配置参数和操作系统级资源的组合来管理传入的客户端连接：\n\n- **net.maxIncomingConnections：**\
  \ 控制同时客户端连接的最大数量（Windows 上默认为 100 万；在 Linux 上，默认为最大文件描述符限制的 80%）。由于每个连接都需要一个文件描述符，此限制有助于防止服务器资源耗尽。\n\
  - **操作系统限制：** 文件描述符限制（Linux/Unix 系统上的 `ulimit -n`）也可能限制连接数。\n\n连接管理的具体细节还取决于部署拓扑（是单机实例、副本集还是分片集群）：\n\
  \n- **Standalone：** 应用程序直接连接到单个 MongoDB 服务器，使用单个连接池\n- **Replica set：** 驱动程序发现所有成员并为每个成员维护单独的连接池，根据读取偏好路由操作\n\
  - **Sharded cluster：** 应用程序连接到 mongos 路由器，后者维护其与分片的连接，形成多层连接架构\n\n现在你已熟悉 MongoDB\
  \ 的连接架构，让我们讨论它如何促进连接的监控和故障排除。\n\n\n\n## 监控和故障排除连接\n\n有效的连接管理需要持续监控以及在问题发生时快速诊断问题的能力。通过实施主动监控实践并准备好清晰的故障排除方法，您可以在潜在问题影响应用程序的性能和可靠性之前识别它们。\n\
  \nMongoDB 驱动程序公开有关其连接池的详细指标，让您了解应用程序如何利用数据库连接。\n\n大多数 MongoDB 驱动程序都实现了连接监控和池化（CMAP）规范，尽管每种语言驱动程序提供访问这些指标的不同方法。例如，在\
  \ Node.js 中，您可以使用事件监听器来监控连接池活动：\n\n// Node.js example using event listeners for\
  \ CMAP events\nconst uri = \"mongodb+srv://user:pass@abcdef.mongodb.net/\";\nconst\
  \ client = new MongoClient(uri);\nclient.on('connectionPoolCreated', event => console.log(event));\n\
  client.on('connectionCheckedOut', event => console.log(event));\nclient.on('connectionCheckedIn',\
  \ event => console.log(event));\n```\n\n请参阅 https://www.mongodb.com/docs/drivers/node/current/monitoring-and-logging/monitoring/#connection-pool-events\
  \ 以了解有关使用 Node.js 驱动程序跟踪这些连接指标的更多信息。\n\n虽然驱动程序指标捕获应用程序与其数据库交互的视图，但 MongoDB 服务器从其角度提供有关传入连接的补充指标。这些指标可以帮助您了解部署在所有客户端应用程序中的整体连接利用情况：\n\
  \n- **connections.current**：服务器上活动客户端连接数。接近最大值表示可能出现连接饱和。\n- **connections.available**：服务器在达到配置限制之前还可以接受多少个连接。\n\
  - **connections.totalCreated**：服务器启动以来创建的连接总数。快速增加可能表示连接频繁创建和销毁。\n\n您可以通过 MongoDB\
  \ Shell 中的 serverStatus 命令或您首选的 MongoDB 驱动程序检索这些指标：\n\n```\ndb.adminCommand({ serverStatus:\
  \ 1 })\n```\n\n通过关联客户端和服务器端指标，您可以构建整个应用程序堆栈中连接健康的全面视图。请参阅 https://www.mongodb.com/docs/manual/reference/command/serverStatus/#connections\
  \ 上的 MongoDB serverStatus 命令文档以了解更多信息。\n\n当连接问题发生时，它们通常表现为特定类型的错误。学习如何识别这些症状对于有效故障排除至关重要：\n\
  \n- **socketTimeout**：操作花费的时间超过了配置的 socketTimeoutMS。通常表示网络拥塞或服务器过载。\n- **EOF (End\
  \ of File)**：服务器意外关闭了连接。这可能是由于服务器重启、网络中断或空闲超时策略造成的。\n- **Broken pipe**：连接在客户端仍在使用时被切断。通常表示网络故障或代理中断。\n\
  - **Authentication failures**：凭据或身份验证配置不正确。可能在凭据轮换或配置更改后发生。\n\n连接池耗尽是一个特别严重的情况，可能迅速降低应用程序性能。请注意以下警告信号：\n\
  \n- 驱动程序指标中等待队列长度增加\n- 应用程序日志中出现 MongoWaitQueueTimeoutException 或类似错误\n- 操作延迟突然增加\n\
  - 流量高峰期间请求失败\n\n请记住，连接池耗尽会迅速级联成系统范围的故障，因为超时会触发重试，从而创建更多连接请求，加速耗尽。\n\n对于使用 TLS 或基于\
  \ DNS 的服务发现的部署，可能会因安全或网络配置问题而出现额外的连接问题。这些问题可能特别具有挑战性，因为它们可能间歇性出现或仅在特定条件下出现。安全连接依赖于正确的\
  \ TLS 配置和证书管理。当遇到与 TLS 相关的连接故障时，请验证以下内容：\n\n- 证书链有效且受所有客户端信任\n- 证书主机名与服务器配置的主机名匹配\n\
  - TLS 协议版本和密码套件在客户端和服务器之间兼容\n- 证书到期日期有效且未接近到期\n- 中间证书已正确安装在所有系统上\n\n当客户端和服务器的 TLS\
  \ 配置不匹配时，常见问题就会出现。例如，如果您的应用程序需要 TLS 1.3，但 MongoDB 服务器仅支持到 TLS 1.2，即使两个系统都有有效证书，连接也会失败。\n\
  \nMongoDB Atlas 和副本集通常依赖 DNS SRV 记录进行服务发现。当这些环境中出现连接问题时，DNS 配置是常见原因。对于 DNS SRV 解析问题，您可以使用标准\
  \ DNS 诊断工具来验证配置是否正确：\n\n```\ndig srv _mongodb._tcp.your-cluster-hostname.mongodb.net\n\
  dig txt your-cluster-hostname.mongodb.net\n```\n\n这些命令有助于验证您的 DNS 是否正确配置以支持 MongoDB\
  \ 的服务发现机制，这在副本集和分片集群部署中尤为重要。使用 MongoDB Atlas 时，请记住 DNS 传播延迟有时会在集群配置更改后导致临时连接问题。如果您最近修改了\
  \ Atlas 集群，请留出足够的时间让 DNS 更新在网络中传播。\n\n## 连接监控最佳实践\n\n在了解如何诊断特定连接问题后，实施全面的监控策略对于随着时间的推移维护系统健康至关重要。为了有效进行连接监控，您应执行以下操作：\n\
  \n- 1. **建立基线**：了解应用程序的正常连接模式\n- 2. **设置有意义的阈值**：根据连接使用情况相对于限制来配置警报\n- 3. **关联指标**：连接驱动程序端和服务器端指标以获得完整视图\n\
  - 4. **监控趋势**：注意可能表明问题发展的渐变\n- 5. **自动化警报**：为高等待队列时间或接近限制的连接数设置主动通知\n\n通过将这些监控实践与前面概述的故障排除方法相结合，您可以构建强大的连接管理策略，帮助在问题影响用户之前防止问题。\n\
  \n## 优化连接管理\n\n现在您已经了解了如何通过连接管理实现和维护弹性系统，以及如何监控和故障排除连接问题，让我们更进一步，谈谈如何优化连接管理。实现最佳的\
  \ MongoDB 性能和弹性需要深思熟虑地调整连接管理策略。本节涵盖了优化连接池和为不同工作负载模式实施策略的关键方法。\n\n## 连接池优化\n\n优化连接池首先要确保池的大小适合您的应用程序。理想的连接池大小取决于应用程序的工作负载特征：\n\
  \n- **OLTP 工作负载：** 对于许多短操作，从中等池大小（50-100 个连接）开始\n- **OLAP 工作负载：** 使用较小的池，其大小与预期的并发分析操作相匹配\n\
  - **批处理：** 根据批处理操作的并行度调整池大小\n\n最佳实践是根据应用程序性能指标和观察到的行为调整连接池大小，而不是依赖固定的利用率百分比。监控等待队列大小、操作延迟和服务器端连接指标等关键指标，以确定连接池大小是否需要调整。\n\
  \n调整连接池时请考虑以下指南：\n\n- 如果您的应用程序花费过多时间创建新连接，请增加 `minPoolSize` 以确保启动时有足够的连接可用\n- 如果数据库\
  \ CPU 使用率高于预期且连接尝试次数较多，请考虑减少 `maxPoolSize` 以降低负载\n- 如果负载较低但应用程序吞吐量低于预期，您可能需要增加 `maxPoolSize`\
  \ 或调整应用程序线程\n\n请记住，每个 MongoDB 驱动程序为拓扑中的每个服务器创建一个单独的连接池，因此应用程序的总连接数将为 `maxPoolSize`\
  \ 乘以 MongoDB 服务器的数量。\n\n\n\n## 连接超时配置\n\n构建能够优雅处理网络中断和服务降级的弹性、高性能应用程序，需要配置适当的超时设置。配置不当的超时可能导致级联故障、资源耗尽或用户体验下降。MongoDB\
  \ 提供了多个可配置的超时参数，用于控制连接行为的不同方面：\n\n- **connectTimeoutMS**: 驱动程序在建立新连接时等待的时间。将此值设置为大于您部署中任何成员的最大网络延迟。\n\
  - **socketTimeoutMS**: 驱动程序等待特定操作响应的时间。将此值设置为驱动程序运行的最慢操作长度的两到三倍。\n- **maxIdleTimeMS**:\
  \ 空闲连接在池中保留的时间（在连接频繁创建与资源利用之间取得平衡）。\n\n正确调整这些超时参数需要了解应用程序行为和 MongoDB 部署拓扑。\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_272_0.png)\n\
  \n> **重要**\n> \n> 不要使用 socketTimeoutMS 来防止长时间运行的服务器操作。相反，对于支持客户端操作符超时的驱动程序，请使用 maxTimeMS()\
  \ 或 timeoutMS() 与您的查询一起使用，以便服务器可以取消长时间运行的操作。例如，如果操作在驱动程序级别优雅地超时，应用程序可以尝试有意义的重试，而不会压垮服务器。如果没有适当的超时，重试可能会淹没连接池，加剧资源耗尽，并导致系统范围的停机。\n\
  \n## 服务器端优化\n\n在自托管部署中，您需要配置 MongoDB 的连接参数和底层操作系统的限制，以确保最佳性能。这些设置共同决定有多少并发客户端可以连接到数据库。\n\
  \n```yaml\nnet:\n  maxIncomingConnections: 65536\n```\n\nmaxIncomingConnections\
  \ 设置控制 MongoDB 将接受的同时客户端连接的最大数量。增加此限制允许更多并发客户端应用程序连接到 MongoDB 服务器，这对于高流量应用程序或具有许多微服务的环境至关重要。然而，仅仅增加此参数是不够的；您还必须调整操作系统的限制。\n\
  \n## 操作系统配置\n\n在基于 Unix 的系统中，MongoDB 为每个客户端连接使用一个文件描述符。当 MongoDB 达到 maxIncomingConnections\
  \ 限制或操作系统的文件描述符限制（以较低者为准）时，它将拒绝额外的客户端连接。这会在高需求期间造成瓶颈，严重影响应用程序可用性。\n\n对于使用 systemd\
  \ 的 Linux 系统，您应该在 MongoDB 服务文件中配置文件描述符限制：\n\n```\n[Service]\n### In the MongoDB\
  \ systemd service file\nLimitNOFILE=64000\n```\n\n对于非 systemd 环境，请在 /etc/security/limits.conf\
  \ 文件中为 MongoDB 服务用户设置限制：\n\n```\nmongodb soft nofile 64000\nmongodb hard nofile\
  \ 64000\n```\n\n更改这些限制后，必须重启 MongoDB 才能使更改生效。为了确认配置更改对部署有益，您可以使用以下验证方法：\n\n- 1.\
  \ 使用以下方法检查当前操作系统的限制：\n```\nulimit -n      # For the current shell session\ncat /proc/$(pidof\
  \ mongod)/limits  # For the running MongoDB process\n```\n- 2. 通过 serverStatus 命令监控\
  \ MongoDB 连接利用率：\n```\ndb.adminCommand({ serverStatus: 1 }).connections\n```\n\n\
  输出将显示：\n\n```\n{\n  \"connections\": {\n    \"current\": 123,      // Current active\
  \ connections\n    \"available\": 63877,  // Remaining available connections\n \
  \   \"totalCreated\": 1578  // Total connections created since startup\n  }\n}\n\
  ```\n\n- 3. 在 MongoDB 日志中查找连接拒绝错误，这表明您已达到连接限制：\n```\n[conn12345] Too many open connections\n\
  ```\n\n正确配置 MongoDB 的 maxIncomingConnections 限制和操作系统的文件描述符限制后，您应该在负载下看到改进的稳定性和性能。即使在流量激增期间，应用程序也能可靠地建立连接，并且您将避免在达到连接限制时发生的级联故障。MongoDB\
  \ Atlas 根据集群层自动管理这些设置，根据工作负载需求扩展数据库配置和底层基础设施资源。\n\n## 利用网络压缩进行性能优化\n\n网络压缩是 MongoDB\
  \ 中的一项重要优化技术，可减少客户端和服务器之间传输的数据量。通过在传输前压缩数据并在接收时解压缩，MongoDB 可以显著降低网络带宽需求，同时可能提高整体性能。此功能在高延迟连接或带宽受限环境中运行尤其有价值。\n\
  \n### 网络压缩的优势与权衡\n\n在 MongoDB 部署中实施网络压缩时，了解优势和潜在缺点对于做出明智的决策非常重要。\n\n启用压缩的主要好处之一是显著减少网络带宽消耗。通过在传输前压缩数据，MongoDB\
  \ 可以显著减少网络上传输的总数据量。\n\n这对于文本密集型文档尤其有效，例如具有冗长字段名称或字符串值的 JSON 数据，通常压缩效果很好。另一个显著优势是在某些环境中降低延迟并加快响应时间。由于需要跨网络传输的数据更少，操作可以更快完成，从而为用户提供更具响应性的应用程序体验。\n\
  \n然而，在生产环境中启用压缩之前必须考虑一些重要因素。CPU 资源利用率是一个重要因素。压缩和解压缩操作需要在客户端和服务器端消耗计算资源。在 CPU 资源已受约束的环境中，额外的处理需求可能会抵消网络优势。\n\
  \n还必须认识到，压缩并不总是能带来有意义的性能改进，在某些情况下甚至可能引入低效率。对于小型操作或处理已压缩的二进制数据（例如图像或视频）时，压缩和解压缩的开销可能超过减少网络流量的好处。在这些情况下，启用压缩可能会降低整体性能。\n\
  \n### 可用的压缩算法\n\nMongoDB 提供了几种压缩算法选项，每种都有不同的特性，使其适用于各种用例：\n\n- **snappy** 在压缩速度和比率之间提供了出色的平衡。它通常将数据压缩到原始大小的约\
  \ 30-50%，同时使用最少的 CPU 资源。这使其成为大多数 MongoDB 部署的理想默认选择，提供有意义的带宽节省而不会产生显著的处理开销。\n- **zlib**\
  \ 比 Snappy 提供更高的压缩比，可能将数据大小减少到原始大小的 20-40%。然而，这以增加压缩和解压缩的 CPU 使用为代价。当带宽极其有限且 CPU\
  \ 资源充足时，zlib 可能适用。\n- **zstd**（在较新的 MongoDB 版本中可用）提供出色的压缩比，同时保持合理的 CPU 效率。它通常比 zlib\
  \ 实现更好的压缩，同时计算成本更低，使其成为支持该环境的越来越受欢迎的选择。\n\n选择压缩算法取决于系统在 CPU 使用和网络带宽之间可以承受的具体权衡，并且理想情况下应通过在工作负载上下文中进行基准测试来指导。\n\
  \n\n\n## 实现网络压缩\n\n在 MongoDB 中启用压缩非常简单，且只需最少的配置更改。您可以在建立与数据库的连接时，通过连接字符串指定首选的压缩算法：\n\
  \n```\nmongodb://hostname/?compressors=snappy,zlib\n```\n\n建立连接时，客户端和服务器会协商从提供的列表中选择最佳的相互支持的压缩算法。如果指定了多个算法（如前例所示），它们将按从左到右的偏好顺序进行评估。\n\
  \n默认情况下，MongoDB 部署已配置为启用压缩；然而，除非客户端指定 compressors 配置，否则客户端与集群之间的消息不会被压缩。使用适合您特定需求的算法启用网络压缩，可以在保持出色性能的同时降低\
  \ MongoDB 部署的网络利用率。\n\n## 无服务器环境的连接策略\n\n由于其临时性和独特的执行模型，在无服务器环境中管理连接会带来独特的挑战。本节探讨了针对无服务器函数（AWS\
  \ Lambda、Azure Functions、Google Cloud Functions）的全面 MongoDB 连接策略，涵盖临时执行上下文、冷启动、扩容期间的连接突发以及资源限制等基本挑战，然后介绍实用的实现模式，包括连接池优化、函数处理程序外部的初始化技术以及在调用之间保持连接持久性的方法——所有这些都旨在帮助您构建具有可靠\
  \ MongoDB 连接性的弹性、高效的无服务器应用程序，同时最大限度地降低成本并提高性能。\n\n无服务器函数按设计是临时的，带来了独特的连接管理挑战：\n\n\
  - **临时执行：** 函数启动、处理请求，并可能在任何时候被终止\n- **冷启动：** 新的函数实例必须建立新的连接\n- **连接突发：** 许多并发函数调用可能导致连接峰值\n\
  - **资源限制：** 函数实例具有内存和 CPU 限制\n\n对于无服务器环境而言，最关键的模式是在函数处理程序外部初始化 MongoDB 客户端和连接池。让我们看一下以下示例，以便更好地理解：\n\
  \n```\nconst { MongoClient } = require('mongodb');\n// MongoClient now auto-connects\
  \ so no need to store the connect()\n// promise anywhere and reference it.\nconst\
  \ client = new MongoClient(process.env.MONGODB_URI);\n\nexport const handler = async()\
  \ => {\n  const databases = await client.db('admin').command({ listDatabases: 1\
  \ });\n  return {\n    statusCode: 200,\n    databases: databases\n  };\n};\n```\n\
  \n此代码演示了针对 AWS Lambda 专门优化的 MongoDB 连接模式的实现，但也可以改编用于其他无服务器环境。\n\nMongoClient 实例在函数处理程序的范围之外创建，这将允许其被重用。故意在处理程序末尾排除\
  \ client.close() 应可使连接池在后续调用中保持活跃，从而降低“热”函数调用的延迟。\n\n无服务器环境的连接池通常需要与传统应用程序不同的配置：\n\
  \n- **较小的池大小：** 从较小的 maxPoolSize（3-5 个连接）开始，因为每个函数实例都有自己的池\n- **更低的空闲超时：** 设置更短的\
  \ maxIdleTimeMS 限制，以便更快地释放未使用的连接\n- **避免过多的最小池：** 使用 minPoolSize: 0 以防止维护可能未使用的连接\n\
  - **设置适当的等待队列超时：** 与函数执行时间限制相匹配\n\n在无服务器环境中采用适当的连接策略可以帮助缓解这些临时函数典型的一些挑战。通过使用优化的参数在函数处理程序外部策略性地初始化连接池，开发人员可以缓解冷启动和连接突发，确保持久、低延迟的数据库交互。\n\
  \n## 摘要\n\n有效的 MongoDB 连接管理对于构建高性能、弹性应用程序至关重要。在本章中，我们探讨了网络堆栈如何成为数据库架构的关键基础，从延迟、连接频繁变化和饱和等基本网络因素到\
  \ MongoDB 的线协议和连接生命周期的技术细节。\n\n连接池是最具影响力的优化技术，通过重用 TCP 连接并在多个操作之间分摊身份验证成本，显著提高应用程序性能。正确实现需要了解客户端池配置参数和相应的服务器端限制。MongoDB\
  \ 的 maxIncomingConnections 参数与操作系统文件描述符限制之间的关键关系值得特别关注，因为这些设置共同决定了高峰流量期间的连接容量。\n\
  \n不同的计算环境需要特定的连接管理方法。对于无服务器部署，请在函数处理程序外部初始化连接池，并使用具有适当超时值的较小池。在分布式架构中，根据网络特征调整超时设置，并在可能的情况下利用感知本地性的路由。\n\
  \n对客户端指标（如池利用率和等待队列时间）进行定期监控，结合来自 serverStatus 的服务器端指标，可以全面了解连接健康状况。这种可观测性使您能够通过早期检测和适当的规模调整来防止级联故障。\n\
  \n通过在整个技术堆栈中实施这些技术原则，您将开发出即使在具有挑战性的网络条件下也能保持一致性能的 MongoDB 应用程序，确保随着数据量和用户群的扩大，可靠性和高效的资源利用。\n\
  \n下一章深入探讨 MongoDB 的索引和查询模式，检查查询执行生命周期，分析 explain 输出，并通过日志诊断慢查询。它还涵盖了掌握 MQL 语义与适当的索引使用，并利用专用集合和功能来优化整体数据库性能。\n"
- "# 12 高级查询和索引概念\n\n## 高级查询和索引概念\n\n查询变慢的原因有很多，*slow* 是一个主观术语，通常意味着 *比您预期或需要的慢*。导致这种情况的许多因素包括缺乏索引、索引不佳、硬件资源不足、不必要地使用低效操作，或为同一资源竞争太多其他操作。\n\
  \n在本章中，我们将介绍查询执行的某些高级概念，涵盖查询如何使用索引、查询优化器如何选择索引、使用 explain 命令深入挖掘的方法，以及如果有改进空间则提高性能的技术。我们还将介绍一些特殊索引类型和集合，当常规索引策略似乎不够充分时，这些可能适合您的用例。我们还将描述系统效率低下可能出现的其他地方，并提供最佳性能的其他提示。\n\
  \n本章涵盖的主题如下：\n\n- 查询执行生命周期\n- 评估和分析 explain 输出的过程\n- 使用日志消息检测、分析和诊断慢查询的根本原因\n- 理解\
  \ MongoDB 查询语言语义和索引使用\n- 额外的特殊集合、索引类型和功能，可以增强性能\n\n\n\n## 理解查询执行\n\n了解应用程序向数据库发送操作时发生了什么非常重要。性能可以在许多地方得到改进，并且全面了解所有阶段，才能正确判断哪些地方未达到最优以及如何修复。\n\
  \n当查询发送到数据库引擎时，无论是作为 find、update、delete 或 aggregate $match 过滤器的一部分，都会发生几件事。首先，查询会被解析为标准化形式。然后，查询规划器需要确定是否有可用的索引，如果有多个，则需要确定哪一个最好。结果的第一批会被返回给客户端。然后，如果客户端请求更多结果，getMore\
  \ 命令将返回额外的批次。\n\n由于选择正确索引会产生一定的开销，MongoDB 使用一种机制，确保一旦为特定查询形状选择了计划，就将其存储在计划缓存中以供将来使用。查询形状是指忽略值的查询，因此\
  \ {x:5} 和 {x:25} 被视为相同的查询形状。还有一种机制可确保如果某个索引最终不是最佳选择，则会重新评估，以防有更好的索引可用。\n\n图 12.1\
  \ 显示了完整的查询规划过程流程：\n\n### 查询规划器\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_281_0.png)\n\
  \n图 12.1：查询规划过程\n\n但你可以这样稍微简化地理解：首先，我们问：“是否已缓存了计划？”如果有，则使用它；如果没有，则生成并评估候选计划，选择获胜计划，并将其添加到缓存中以供将来使用。这是一个稍微简化的流程描述，因为它没有考虑到获胜计划首先以非活动状态保存，然后只有在确认性能良好后才会被激活。但作为一种简化，这是一个很好的近似。\n\
  \n任何特定查询可能的候选计划有哪些？我们已经知道，如果没有合格的索引，则计划将是全集合扫描（COLLSCAN）。如果有索引或多个索引可用，则根据确切的查询要求，它们可以用不同的方式使用。我们将在下一节中查看使用索引的不同方式。\n\
  \n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_282_0.png)\n\n### 单个合格索引时的计划缓存使用\n\n\
  如果只有一个计划可用，例如只有一个合格的索引，则它不会存储在计划缓存中。计划缓存严格用于多个索引可以满足查询的场景。\n\n根据索引的效率，以及它是否对查询提供覆盖和/或支持排序和查询过滤器，将分配一个分数。计划评分的确切细节超出了本书的范围。然而，作为一般原则，最高分代表试运行期间最有效的计划，并成为暂定获胜者。然后该计划连同其分数一起被缓存，至少直到使用该计划对同一查询形状进行低效执行导致分数明显低于保存的分数，在这种情况下，缓存的计划将被从计划缓存中驱逐。当这种情况发生时，查询将被重新规划，这意味着它将再次经过计划评估阶段，以尝试找到更好的索引。\n\
  \n规划与向客户端返回结果并不是独立的。在规划查询执行时找到的文档会作为第一批结果返回给客户端。\n\n### 计划阶段，或“索引如何被使用”\n\n尽管我们刚刚一直在说“查询使用索引”，但事实证明索引有多种使用方式。在标准情况下，查找\
  \ B 树中与单个值匹配的文档字段时，我们会遍历 B 树并找到匹配叶节点的 recordId。然而，在查询不是查找文档而是文档计数的情况下，索引还有其他使用方式。当我们在整个\
  \ B 树或其子部分中查找第一个不同值时，索引遍历方式还有其他优化。所有这些都有不同的内部名称，你可能会在日志中的查询计划摘要或 explain 输出中看到它们。\n\
  \n以下是不同的 **indexed** 查询计划及其含义：\n\n- **IXSCAN**：索引扫描意味着我们正在按某种顺序遍历 B 树（通常是子集）\n-\
  \ **IDHACK 或 EXPRESS_IXSCAN**：针对 _id 索引或其他唯一索引的特殊优化索引扫描\n- **DISTINCT_SCAN**：特殊索引扫描，用于支持在\
  \ B 树中找到所有不同值\n- **COUNT_SCAN**：特殊索引扫描，用于仅从 B 树的子集获取计数\n\n如果操作没有合格的索引，则查询计划将为 COLLSCAN，表示全集合扫描。\n\
  \n> **索引优先于 COLLSCAN**\n> \n> 如果查询至少有一个合格的索引，则除非用户强制指定，否则不会选择 COLLSCAN。\n\n尽管查询计划的效率大致按照此列表的顺序递增，但这并不是绝对的说法，因为它取决于扫描检查的\
  \ B 树子集的大小（对整个索引进行 COUNT_SCAN 很可能比对索引的极小部分进行 IXSCAN 更慢）。\n\n在查询规划器输出中，你还会看到其他 *stages*\
  \ 或步骤。它们的意思如下：\n\n- **FETCH**：必须读取完整文档，并且可选地应用过滤器以确保其匹配\n- **SHARD_FILTER**：通常最后应用，以确保仅返回该分片拥有的文档\n\
  - **SORT**：表示对结果进行内存排序\n- **SORT_MERGE**：用于合并多个已排序的文档流\n\n还有一些其他更晦涩的阶段，但我们现在不担心它们。\n\
  \n> **索引支持的排序省略 SORT 阶段**\n> \n> 由索引支持的排序在计划中 *不* 包含任何 SORT 阶段，因为返回排序结果不需要额外步骤。\n\
  \n查询规划和执行产生的指标和诊断会出现在多个地方：\n\n- `explain output`\n- 在 `mongod` 和 `mongos` 日志中记录的慢查询日志消息\n\
  - 启用分析时 `system.profile` 集合\n- Atlas 中的仪表板，例如 Query Insights\n- `currentOp` 命令输出\n\
  \n这些指标包括所选计划、查看了多少索引条目和文档、是否进行了内存排序，以及我们在本章后面的示例中将探讨的多个其他指标。\n\n调试查询规划器性能最详细、最有用的工具将是\
  \ explain 命令。\n\n### 使用 explain 命令\n\n我们已经简要介绍了如何使用 explain 命令检查查询和聚合执行。现在，让我们详细了解它是如何运行的以及显示什么内容。每当我们运行任何带有传递查询过滤器的命令时，我们都可以在\
  \ mongosh 中在集合名称和命令辅助方法之间插入 explain 来调用它，如以下示例所示：\n\n```\ndb.collection.explain(<option>).find({<query>})\n\
  ```\n\n用于 explain 的 <option> 决定输出的详细程度，可以是以下之一：\n\n- \"queryPlanner\"：默认值。仅运行查询优化器并返回将选择的查询计划。\n\
  - \"executionStats\"：运行查询优化器，执行选定的获胜计划，并返回描述执行的统计信息。\n- \"allPlansExecution\"：与\
  \ \"executionStats\" 相同，但除了返回执行获胜计划的统计信息外，还返回在计划选择和评估期间捕获的被拒绝计划的统计信息。\n\nexplain\
  \ 命令的输出包含多个部分。queryPlanner 部分始终存在。如果使用 executionStats 或 allPlansExecution 选项，你将看到非常有信息的\
  \ executionStats 部分。\n\n\n\n## queryPlanner 部分\n\nqueryPlanner 部分是查看查询基本信息的位置，其中包括查询如何被解析为规范形式或标准化形式、queryHash（用于以不同值识别相同查询形状的快捷方式）、如果查询计划在缓存中则会出现的\
  \ plan 的 planCacheKey、查询计划选择是否受到任何特殊设置影响的指示、winningPlan，以及在存在其他计划选项时被拒绝的计划。\n\n\
  ## executionStats 部分\n\n实际运行查询的 explain 命令将包含 executionStats 部分，其中捕获了运行期间观察到的所有实际指标。对于查询过滤部分，它包括诸如\
  \ totalKeysExamined（查看的索引键数量）、totalDocsExamined（查看的文档数量）、nReturned（如果未指定 explain\
  \ 将返回给客户端的文档数量）等字段，以及对每个观察到的执行阶段的相同详细信息。\n\n对于内存排序，explain 命令包含一个 SORT 部分，其中包含使用了多少内存的信息。当没有合适的索引来支持按排序顺序获取数据时，此部分会出现。它还指示数据是否必须溢出到磁盘，如果是，则用于辅助排序的磁盘空间大小。\n\
  \n在聚合的情况下，explain 还列出初始 $cursor 阶段之后的所有阶段（该阶段负责从集合中获取文档以流式传输到管道的其余部分）。它包括每个阶段返回的文档数量，以及到此为止所有阶段累计花费的时间。\n\
  \n以下是聚合 execution stats 部分列出阶段的示例输出的一部分：\n\n```\nstages: [\n  {\n    '$cursor':\
  \ { queryPlanner: { executionStats: { ... } } }\n    nReturned: Long('10805'),\n\
  \    executionTimeMillisEstimate: Long('21')\n  },\n  {\n    '$set': { ... },\n\
  \    nReturned: Long('10805'),\n    executionTimeMillisEstimate: Long('21')\n  },\n\
  ]\n```\n\n```\n{\n  '$unwind': { ... },\n  nReturned: Long('14804'),\n  executionTimeMillisEstimate:\
  \ Long('22')\n},\n{\n  '$group': { ... },\n  maxAccumulatorMemoryUsageBytes: { count:\
  \ Long('1768') },\n  totalOutputDataSizeBytes: Long('3534'),\n  usedDisk: false,\n\
  \  nReturned: Long('13'),\n  executionTimeMillisEstimate: Long('23')\n},\n{\n  '$sort':\
  \ { sortKey: { count: -1 } },\n  totalDataSizeSortedBytesEstimate: Long('3638'),\n\
  \  usedDisk: false,\n  spills: Long('0'),\n  nReturned: Long('13'),\n  executionTimeMillisEstimate:\
  \ Long('23')\n}\n```\n\n第一个阶段称为 $cursor，它表示管道文档的来源是一个集合。早期 $match 阶段以及以与 find 命令相同方式执行的其他阶段可以在\
  \ $cursor 阶段内部观察到。该阶段返回了一定数量的文档，然后这些文档在管道中流动。执行时间估计是累计的，因此我们看到查询部分花费了 21 毫秒，而大多数其他阶段花费不到\
  \ 1 毫秒，除了 $unwind 和 $group，每个花费了 1 毫秒。\n\n在分片集合中，mongos 路由器会将带有 explain 选项的查询转发到每个分片，合并其结果，并在\
  \ explain 输出中包含其自身的工作，该输出对分片的工作和 mongos 工作有单独的部分。\n\n以下是分片集群中聚合查询的 explain 输出字段的示例：\n\
  \n```\n\"mergeType\" : \"mongos\",\n\"splitPipeline\" : {\n\"shardsPart\" : [ ...\
  \ ],\n\"mergerPart\" : [ ... ]\n```\n```\n\n这表明来自每个分片的输出的合并在 mongos 上进行。它还显示了整体管道如何被拆分为两个部分。第一部分发送到相关分片，而合并部分在\
  \ mongos 上执行。\n\n以下是需要在分片上过滤孤立文档的 explain 示例：\n\n```\nwinningPlan: {\n  stage: 'SHARD_MERGE',\n\
  \  shards: [\n    {\n      shardName: 'shard01',\n      winningPlan: {\n       \
  \ stage: 'FETCH',\n        inputStage: {\n          stage: 'SHARDING_FILTER',\n\
  \          inputStage: {\n            stage: 'IXSCAN',\n            keyPattern:\
  \ { id: 1 },\n            ...\n          }\n        }\n      }\n    }\n  ]\n}\n\
  ```\n\n此示例显示了对特定字段的查询，该查询有效地使用索引进行查询。然而，由于分片键不在索引中，因此需要额外步骤来获取文档以检查其分片键值是否属于该特定分片。可以通过在索引中添加包含分片键字段（通常作为尾随字段）的复合索引来使此查询更高效。\n\
  \n### SHARD_MERGE 与 SINGLE_SHARD 阶段\n\nSHARD_MERGE 表示查询由多个分片处理。如果查询可以定位到单个分片，则该阶段的名称将为\
  \ SINGLE_SHARD。\n\n## 分析日志消息\n\nexplain 输出虽然很有用，但从每次命令实际执行日志中可获得的信息远不止于此，以下是为可读性格式化并删减了非查询过滤执行特定字段的示例：\n\
  \n```\n\"type\" : \"command\",\n\"ns\" : \"test.coll\",\n\"collectionType\" : \"\
  normal\",\n```\n```json\n\"command\" : {\n    \"aggregate\" : \"coll\",\n    \"\
  pipeline\" : [\n        {\"$match\" : {\"$or\" : [\n            {\"x\" : {\"$gt\"\
  \ : 5,\"$lt\" : 10}},\n            {\"a\" : {\"$gt\" : 5,\"$lt\" : 10}}\n      \
  \  ]}},\n        {\"$sortByCount\" : \"$b\"}\n    ],\n    \"$clusterTime\" : { ...\
  \ },\n    \"$db\" : \"test\"\n},\n\"planSummary\" : \"IXSCAN { x: 1 }, IXSCAN {\
  \ a: 1 }\",\n\"planningTimeMicros\" : 2572,\n\"keysExamined\" : 567,\n\"docsExamined\"\
  \ : 567,\n\"hasSortStage\" : true,\n\"nreturned\" : 40,\n\"planCacheKey\" : \"DAC1B215\"\
  ,\n\"queryFramework\" : \"sbe\",\n\"locks\" : {\"Global\" : {\"acquireCount\" :\
  \ {\"r\" : 4}}},\n\"storage\" : { },\n\"workingMillis\" : 12,\n\"durationMillis\"\
  \ : 12\n}\n```\n\n你可以看到使用了哪个查询计划（两个索引，每个 $or 子句一个），并且存在 SORT 阶段（hasSortStage: true），这表明结果进行了内存排序。你还可以根据检查的键数与文档数来了解索引的选择性，并可以看到操作花费了多长时间，以及时间花费在何处的细分。如果运行了多计划评估过程，则日志消息中还会看到\
  \ \"fromMultiPlanner\": true。\n\n日志中的消息采用 json 格式，因此如果要以编程方式分析它们，可以将它们加载到自己的 MongoDB\
  \ 集合中，或者可以使用 grep 等命令行工具查找有问题的模式。\n\n## 识别有问题的模式\n\n就像并非所有快速查询都最优高效一样，有时编写良好且有索引支持的查询仍然可能很慢。了解它们为何变慢很重要，以避免浪费时间调整并非性能问题根本原因的东西。\n\
  \n有问题的查询总是会变慢吗？不一定。我们已经知道慢是相对的，默认情况下，慢于 100 毫秒的查询会被记录在 mongod 日志中。此阈值可以配置为更高、更低，或基于除绝对时间阈值之外的其他内容；有关更多详细信息，请参阅第\
  \ 14 章《Monitoring and Observability》。然而，如果低效查询刚好低于阈值，它们仍可能逃过检测，即使使用最佳索引后它们仍可能显著更快。我们可以通过调整日志阈值并查看查询定位比率、磁盘使用或其他资源争用情况来查找这些慢查询。\n\
  \n## 查询定位比率\n\n衡量查询效率最重要的指标之一称为查询定位比率。现在我们已经看到了 explain 和日志消息中可用的详细信息，让我们看看这个比率包含什么。当你查询满足特定条件的文档时，系统需要查看的文档越少，就能越快完成查询。\n\
  \n查询定位比率是指读取的索引键数与返回的文档数之比，或读取的文档数与返回的文档数之比。这两者中的理想数字都是 1，因为我们希望只查看需要返回给客户端的索引条目或文档。如果查询存在最佳索引，并且每个扫描的索引条目最终都在结果集中，则比率将为\
  \ 1:1。覆盖索引查询是一种特殊情况，我们甚至不需要查看任何文档，并将通过 \"docsExamined\": 0 来表示，但为了理解以下示例，让我们先将其放在一边。\n\
  \n最简单的例子是查询 {a: 5} 且 a 上有索引。我们查看的每个索引条目都将是我们想要匹配的值，并且我们只会访问需要返回给客户端的文档。这是一个理想的比率。如果\
  \ a 上没有索引，则必须执行集合扫描，这意味着我们查看集合中的每个文档。如果有 50 个文档匹配我们的条件并需要返回，而集合中有 5000 万个文档，那么我们的定位比率将为\
  \ 100 万比一，这不是很好，因为理想比率应为一比一。\n\n\n\n这里有一些日志消息片段，来自于使用了索引来满足多个查询谓词子句的查询，但随后仍需检查文档中的额外字段以确定是否应将其返回给客户端：\n\
  \n```\n\"keysExamined\":977,\"docsExamined\":977,\"nreturned\":4\n\"keysExamined\"\
  :69070,\"docsExamined\":147,\"nreturned\": 0\n```\n\n虽然 keysExamined 与 docsExamined\
  \ 的比率可以告诉你索引在缩小查询需要检查的文档数量方面的效率如何，但 nreturned 显著更低仍然表明必须直接对文档应用额外的过滤器。这仅适用于查询，而不适用于聚合，因为聚合可以通过将其聚合为更少的总组来返回更少的文档。\n\
  \n## Waiting for disk or other resources\n\n日志中可能最有用的指标之一是 storage，在快速查询的情况下它会为空。然而，如果任何索引或数据页不在存储引擎缓存中，与之相关的指标将出现在\
  \ storage 字段中。即使有效使用索引的查询也很慢，通常也是因为数据尚未在 WiredTiger 缓存中，而该字段将指示是否如此。\n\n以下是三个查询的部分日志消息可能的样子：\n\
  \n```\nstorage:{data:{bytesRead:8674010,timeReadingMicros:6297}},durationMillis:105\n\
  storage:{data:{bytesRead:15353,timeReadingMicros:918415}},durationMillis:919\nstorage:{data:{bytesRead:31033716,timeReadingMicros:82948}},\n\
  durationMillis:145\n```\n\n从数据库的角度来看，这表明数据并非来自其缓存。这些数据仍可能已从文件系统缓存中读取。\n\n在不同情况下，根本原因可能是磁盘异常缓慢（第二个示例行）、大量数据未存在于缓存中，或内存排序必须将数据溢出到磁盘。你可以通过在日志消息中查找\
  \ \"usedDisk\":true 来跟踪此问题，或通过检查 explain 输出中的更详细信息。\n\n同样，日志消息可以表明慢查询使用了最佳执行计划，但仍因其他不可用的资源而变慢，例如等待其他缓慢操作。尝试优化该查询毫无意义，因为需要解决的是整个系统或其他缓慢操作。\n\
  \n## How to influence query execution\n\n有时，无论你多么努力为查询创建完美的索引，查询规划器仍会选择不同的索引。你可以通过两种方式影响执行，以强制选择你偏好的索引，或完全阻止不期望的查询执行。\n\
  \n## Using hint\n\n你可以将 hint 指令与索引的名称或定义一起传递给任何查询。这指示查询引擎完全绕过查询缓存和规划过程，而改用指定的索引进行查询。使用\
  \ hint 时需注意以下几点。指定不存在的索引将返回错误。指定稀疏、部分或不兼容的索引可能会返回不完整的结果，如果索引不包含满足查询谓词的所有文档。\n\n\
  在应用程序代码中使用 hint 时，务必谨慎操作：定期检查它是否仍有必要。通常最好删除导致查询引擎做出次优选择的额外索引，但在无法做到时，使用 hint 可以提供快速解决方案。\n\
  \n以下是强制 find 通过 hint 按名称使用索引的代码示例：\n\n```\ndb.coll.find({<filter>}).hint(\"indexName\"\
  )\n```\n\n谨慎使用 hints。随着数据和索引的演变，始终验证其持续的相关性。\n\n## Using query settings\n\nMongoDB\
  \ 8.0 版本引入了一个名为 persistent query settings 的新功能。此功能允许你通过在服务器上自动添加 hints 来控制查询执行，而无需对应用程序进行代码更改、定义拒绝过滤器并配置其他字段。Rather\
  \ than relying on a hint being explicitly added to a particular query shape in the\
  \ application code（如果查询在系统的多个部分被调用，则存在遗漏某些位置的风险），你可以配置服务器在观察到特定查询形状时自动应用 hint。\n\
  \n此命令为特定数据库、集合和查询形状设置索引 hint：\n\n```\ndb.adminCommand({\n  setQuerySettings: {\n\
  \    find: \"collName\",\n    filter: {<filter>},\n    $db: \"dbName\"\n  },\n \
  \ settings: {\n    indexHints: {\n      ns: {db: \"dbName\", coll: \"collName\"\
  },\n      allowedIndexes: [\"indexName\"]\n    }\n  }\n})\n```\n\n当你想完全阻止有问题的查询运行时，修改\
  \ settings 字段以包含 reject:true 指令。有关 setQuerySettings 命令的更多信息，请访问 https://www.mongodb.com/docs/manual/reference/command/setquerysettings/。\n\
  \n## Other options\n\n另一个值得注意的设置是启动 mongod 时的 --no tablescan 选项，它像一把大锤子一样存在，尽管通常不推荐在生产环境中使用。此设置可以阻止任何具有查询过滤器但没有可用索引的查询。这可能在测试或暂存系统中启用以确定是否有任何查询意外运行集合扫描是安全的，但在生产中使用这种不加区分的工具可能不是好主意。你可以在生产中监控此类查询，然后决定使用查询设置将其从系统中阻止，或添加索引来支持它们。\n\
  \n## MQL semantics and indexes\n\n如第 3 章《Indexes》所述，索引旨在支持 MongoDB 查询语言（MQL）的 find\
  \ 语义，但这意味着什么？MQL 有多个组件，其中一些特定于聚合，一些特定于更新，一些特定于 find 命令过滤器，被称为 match expressions。这是在为\
  \ find、update 和 delete 命令指定查询谓词时使用的语法，也是 $match 聚合阶段期望的语法。索引支持 match expressions\
  \ 的一些特殊性，这会影响索引被特定查询使用的效率。理解这一点可以帮助你发现、调试和重写难以优化的查询，并从一开始就编写更高效的查询。\n\n## Challenges\
  \ with arrays and multikey indexes\n\n存储数组的字段为查询规划和索引使用带来了独特的挑战。包含可能为数组的字段的文档需要特别考虑，以避免成为非预期性能问题的来源。\n\
  \n## Equality is not just equality\n\n在 MQL 查询中指定相等（$eq）于某个值——显式或隐式——意味着 *相等* 或\
  \ *数组中某个元素等于该值*。\n\n例如，`db.coll.findOne({a:5})` 匹配 `{a:5}` 以及 `{a:[1, 5, 10]}`。\n\
  \n这意味着对字段 a 的索引包含条目 5 必须指向 a 为 5 的文档，以及 a 为包含 5 的数组的文档。条目看起来完全相同，但一旦任何数组元素被索引，索引就会获得\
  \ multikey 属性，这告诉查询引擎 a 可能是数组。因此，在返回 a 的值时，不能仅从索引返回；必须获取文档以返回字段的实际值。\n\n请注意，在聚合中，$eq\
  \ 表达式没有这种细微差别。在 `{$eq:[v1, v2]}` 中，如果两个值相等，结果为 true，否则为 false。聚合表达式不会深入数组以匹配单个值。\n\
  \n## $elemMatch\n\n我们如何索引数组不仅仅影响返回潜在数组字段；它还影响我们如何使用索引来检查 $elemMatch 条件。$elemMatch\
  \ 操作符检查 *是否至少有一个数组元素满足查询条件*。\n\n例如，查询 `{a:{$elemMatch:{$eq:5}}}` 将匹配 `{a: [1, 4,\
  \ 5]}` 但不会匹配 `{a: 5}`，因为这里的 5 不是数组元素。\n\n同样，`{a:{$gt:5, $lt:10}}` 将匹配 `{a: [1, 4,\
  \ 11]}`，因为两个条件都为真；a 有一个小于 10 的元素，它也有一个大于 5 的元素。\n\n为了查找同时满足两个条件的单个元素，我们必须写成 `{a:{$elemMatch:{$gt:5,\
  \ $lt:10}}}`。现在，含义变为：*a 必须有一个同时大于 5 且小于 10 的单个元素*。\n\n鉴于我们在 B-tree 中索引数组值，在某些情况下索引可能无法像你期望的那样高效地回答查询。一个简单的\
  \ `{a:{$elemMatch:{$eq:5}}}` 查询可以使用索引找到 a 为标量 5 或包含 5 的数组的所有文档。\n\n\n\n但如果不查看文档，就无法判断\
  \ a 是否为数组元素，因为灵活的模式允许你在集合的同一字段中包含标量和数组。\n\n另一个可能让你对查询使用索引感到意外的情形是当你没有对多个条件使用 $elemMatch\
  \ 时，具体来说，当你不希望单个元素满足多个条件，而是希望找到一个数组，其中不同的元素可以分别满足这些条件时。\n\n一个例子是前面提到的 {a: {$gt:\
  \ 5, $lt:10}} 查询，它可以使用 a 上的索引，但如果该索引是多键的（也就是说，如果已知 a 在某些文档中可以是数组），那么它就不能像常规的非数组索引那样使用。\n\
  \n考虑我们一直在查看的示例，以及它如何使用非多键与多键索引：\n\n```\ndb.coll.explain().find({a:{$gt:5, $lt:10}})\n\
  ```\n\n表 12.1：查询使用不同的索引边界，具体取决于索引是否为多键\n\n| // a 上的非多键索引 | // a 上的多键索引 |\n|---|---|\n\
  | \"winningPlan\" : { \"stage\" : \"FETCH\", \"inputStage\": { \"stage\" : \"IXSCAN\"\
  , \"keyPattern\":{\"a\":1}, \"isMultiKey\" : false, \"indexBounds\": {\"a\":[\"\
  (5.0,10.0)\"]}}} | \"winningPlan\" : { \"stage\" : \"FETCH\", \"filter\" : {\"a\"\
  \ : {\"$lt\" : 10}}, \"inputStage\" : { \"stage\" : \"IXSCAN\", \"keyPattern\" :\
  \ {\"a\" : 1}, \"isMultiKey\" : true, \"indexBounds\" : {\"a\":[\"(5.0,inf.0)\"\
  ]}}, \"rejectedPlans\" : [...] } |\n\n*表 12.1：查询使用不同的索引边界，具体取决于索引是否为多键*\n\n左侧，非多键索引使用紧凑的边界来查找字段\
  \ a 在 5 到 10 之间的所有文档。右侧，计划使用索引查找 a 在 5 到无穷大之间的所有文档，然后获取文档以检查是否还有 a 小于 10。为什么多键索引不能使用与非多键索引相同的索引边界，而必须在索引中只使用一个边界，并在\
  \ FETCH 阶段手动检查另一个边界？这是因为数组语义规定，“*一个元素可以匹配一个条件，而另一个不同的元素可以匹配另一个条件*”，如果我们使用紧凑的边界，就会遗漏诸如\
  \ {a: [1, 11]} 这样的匹配文档，其中没有任何元素落在 5 到 10 之间！\n\n## Deduplication\n\n由于 B 树中每个数组元素都是单独索引的，因此当多键索引查询看起来像\
  \ {a: {$in: [1, 5, 10]}} 时，需要额外的工作来对匹配的文档进行去重。在这种情况下，我们在 B 树中执行三次查找，每次对应一个值，但这三个查找都可能指向同一个\
  \ recordId。查询必须始终对多键索引的多键字段执行额外的工作，以确保不会返回重复的记录（或多次计数）。\n\n让我们查看查询 {a: {$in: [500,\
  \ 501, 502]}} 的 explain 输出的 executionStats 部分，其中多个文档的数组包含其中几个值：\n\n```\nexecutionStats:\
  \ {\n  inputStage: {\n    stage: 'IXSCAN',\n    nReturned: 1,\n    works: 4,\n \
  \   advanced: 1,\n    isEOF: 1,\n    keyPattern: { a: 1 },\n    isMultiKey: true,\n\
  \    multiKeyPaths: { a: [ 'a' ] },\n    indexBounds: { a: [ '[500, 500]', '[501,\
  \ 501]', '[502, 502]' ] },\n    keysExamined: 3,\n    seeks: 1,\n    dupsTested:\
  \ 3,\n    dupsDropped: 2\n  }\n}\n```\n\n返回的单个文档在数组 \"a\" 中包含搜索列表中的全部三个值，这就是为什么我们看到在三个测试结果中，有两个被丢弃为重复项。这显示了执行的额外工作，你可以从\
  \ nReturned 为 1 而 keysExamined 为 3 中看出。额外的工作并不是因为索引没有高效地存储我们想要返回的所有值；而是因为为了消除重复结果而进行的额外工作。虽然数组是表示文档中复杂结构的有力方式，但要注意的是，处理已索引的数组字段时某些查询可能会产生额外成本。\n\
  \n## Challenges with null and $exists\n\n在 MQL 中，查询 {a: null} 匹配所有 a 缺失或 a 存在且等于\
  \ null 的文档。这包括 a 是包含 null 的数组的情况以及一些更复杂的场景。\n\n但在所有这些情况下，由于该查询会返回缺失和 null，B 树索引会存储值\
  \ null 来表示该值要么是显式 null，要么是缺失的；也就是说，它根本不存在。因此，索引可以轻松用于检查字段是否不等于 null，但不能用于回答 $exists:true\
  \ 或 $exists:false 查询。这是因为仍需要检查文档以查看字段是否存在且值为 null，还是根本不存在。唯一的例外是稀疏索引，它只索引存在的值（包括\
  \ null），因此可以直接从索引中回答 $exists:true 谓词，而无需在文档本身中检查其他细节。\n\n当使用 a 上的索引检查 db.coll.find({a:\
  \ {$ne: null}}) 时，以下是几个 explain 字段：\n\n```\nstage: 'IXSCAN',\nkeyPattern: { a: 1\
  \ },\nindexBounds: { a: [ '[MinKey, null)', '(null, MaxKey]' ] }\n```\n\n索引边界显示查询被处理为范围查询，匹配小于\
  \ null 和大于 null 的值。\n\n所有这些对于编写正确的查询至关重要，但了解索引何时可以以及何时不能像你期望的那样有效地使用也很重要。总之，如果你的应用程序有必须检查字段存在的查询，可以使用稀疏索引。\n\
  \n## Additional best practices\n\n以下是关于如何最好地编写应用程序以及需要注意什么、作为一般规则应避免什么的几个额外提示，如果你想要一个性能良好且可扩展的系统。一些应避免的功能已被\
  \ MongoDB 计划弃用和移除，而其他功能则适用于非常特定的用例，在这些用例之外使用它们可能会给系统带来不必要的开销。\n\n## Updates\n\n\
  在组合更新修改时，始终优先使用单个字段修改而不是替换整个文档。从应用程序开发者的角度来看，使用 updateOne 通常比使用 replaceOne 更好，因为当只有少数字段发生变化时替换整个文档会降低复制子系统的效率。\n\
  \n在某些情况下，当文档的新版本从应用程序外部接收到，且确定确切更改成本过高或不切实际时，你可以使用一个技巧。不要使用以下语法：\n\n```\ndb.coll.replaceOne({_id:X},\
  \ {entire-new-document})\n```\n\n而是使用以下更新的语法来实现相同的效果：\n\n```\ndb.coll.updateOne({_id:X},\
  \ [ {$replaceWith:{$literal:entire-new-document}} ])\n```\n\n乍一看，这似乎使用了聚合语法来指示系统执行相同的“用此新文档替换现有文档”过程，但实际上内部发生的是\
  \ MongoDB 比较现有文档和新文档并生成增量以记录在复制 oplog 中，从而产生更小的 oplog 条目。在计算发现这些增量记录起来比整个新文档更冗长的情况下，我们将把整个新文档写入\
  \ oplog。\n\n为了正确性，在多线程系统中，请确保使用更新修饰符组合你的更新，这允许多个线程同时更改同一文档而不覆盖彼此的工作。这意味着使用 $inc\
  \ 来递增计数器，而不是读取文档、在代码中修改它，然后写回。如果出于应用程序特定原因无法避免读-改-写模式，请使用版本控制以确保在读取和写入之间文档没有被其他更改，或在写入的过滤器中使用你要修改的字段的先前值，以便只有在自读取以来该值未被更改时写入才成功。\n\
  \n\n\n## findAndModify\n\nfindAndModify 命令在驱动方法中称为 findOneAndUpdate，其用途经常被误解。它本质上与\
  \ updateOne 命令完全相同，但不同之处在于，它不会返回告知客户端更新具体做了什么的结果文档（例如，是否进行了更新，是否匹配到任何文档等），而是 findOneAndUpdate\
  \ 执行相同的更新操作，但返回被更新的文档（如果有），要么是更新前的版本，要么是更新后的版本。\n\n为什么这种功能甚至需要存在？这是因为有时你需要知道更新产生了什么效果，或者哪个文档被更新了，并且你的更新过滤器结构是这样的，你无法以其他方式知道和确定这些信息。考虑一个示例，其中有一个单一的文档集合，只是跟踪一个计数器，每次使用一个值时该计数器都会递增\
  \ 1：\n\n```\n{_id:1, count: 35}\n```\n\n如果客户端想要使用下一个可用的计数值的同时递增计数器，使其处于下一个线程的正确状态，它无法通过两个单独的更新和查找命令来完成，因为无法保证另一个线程不会在两次操作之间插入。这就是\
  \ findOneAndUpdate 有用的地方：它允许客户端发送一个带有 {$inc:{count:1}} 的更新来递增计数器，同时检索文档在更新前或更新后立即具有的正确值。\n\
  \n另一个示例是客户端正在查找代表队列的集合中的下一个工作项。除了检索下一个要处理的文档的 _id 值外，它还需要写入文档以表明它现在正在被处理，防止另一个线程尝试处理同一项。在这里，在原子地设置一个字段以逻辑上将其从正在寻找自己下一个工作部分的其它线程锁定，同时返回文档，可以很容易地通过\
  \ findOneAndUpdate（又名 findAndModify）命令实现。它应用过滤器和排序来查找准备工作的文档（通常具有最低或最高的时间戳值）并且尚未被另一个线程锁定，设置字段以指示“我将处理此文档”，并返回文档，以便客户端知道它正在处理的内容。使用单独的\
  \ updateOne 操作后跟 findOne 操作不仅会引入不必要的额外往返，而且也不会提供可靠的方法来知道如何在单独的调用中找到刚刚修改的文档。\n\n\
  因此，为什么 `findAndModify` 比更新更昂贵，因为两个命令都更新一个文档并返回一个文档（要么是结果文档，要么是修改后的文档）？事实证明，主要原因是一个在\
  \ *Chapter 10, Client Libraries* 中描述的功能，称为 *retryable writes*，其中 MongoDB 驱动程序会在副本集中主节点故障转移期间自动重试可能已成功或未成功的写入操作。MongoDB\
  \ 内部跟踪每个写入操作是否成功，并且如果操作在已成功后被重试，可以轻松返回 *result* 的重复副本。然而，要在 `findAndModify` 操作被重试时返回文档的正确版本，系统必须做额外的工作，将修改前文档的副本写入一个特殊的侧边集合。这会引入开销，如果你经常不必要地使用\
  \ `findOneAndUpdate` 而不是 `updateOne`，可能会使你的系统变慢，而且如果你的文档相当大，影响会更大且更成问题。\n\n因此，在有必要正确实现应用程序逻辑时使用\
  \ `findAndModify` 是完美的，但在简单的 `updateOne` 可以完成工作时最好避免使用它。\n\n## Aggregation and query\n\
  \n某些聚合阶段和表达式在谨慎使用且仅在它们设计用于的特定情况下使用时是可以的，但在更简单、更高效的替代方案足够时不应过度使用。本节将列出一些应避免或谨慎使用的阶段、运算符和命令，以及它们可能更高效的替代方案。\n\
  \n### $sample\n\n`$sample` 阶段旨在从管道中出现的位置返回某个数量、*N*、的随机选择的文档。然而，它仅在一种非常特定的场景下高效执行：当它是在包含\
  \ *more than 100 documents* 的集合的管道的 *first stage* 时，并且请求的文档数量 *less than 5%* 的集合中总文档数。在那种情况下，它使用伪随机游标来选择那些\
  \ *N* 个文档。在所有其他场景中，`$sample` 会对所有文档进行昂贵的随机排序，只是为了返回前 *N* 个。如果你确实需要真正随机的文档子集，那么当然使用\
  \ `$sample`，但在大多数情况下，当你只是想限制返回的文档数量时，使用 `$limit` 会快得多。\n\n### $facet\n\n$facet 在同一组输入文档上的单个阶段内处理多个聚合管道。存在一种误解，即\
  \ $facet 阶段会进行一些聚合魔术将管道并行处理为多个分支。实际情况根本不是这样。思考 $facet 的最简单方法是：管道中到该点为止流经的每个文档都会发送到\
  \ $facet 的每个分支。这意味着如果一个分支只需要前 10 个文档，但另一个需要 1 百万个，那么所有 1 百万个文档将被发送到每个 $facet 分支。\n\
  \n$facet 是一个极佳的候选者，当你希望在每个分支中进行极其相似的处理时，例如计算所有传入文档按类别的计数和按价格范围的计数。它完全不是一个好的候选者，当你希望在分支中进行的处理非常不同时。一个例子是想要返回前\
  \ 10 个文档以及文档的总计数。在这种情况下，使用 $unionWith 会好得多，它在保留可以对每个管道执行的优化的同时运行两个（或更多）管道。\n\n###\
  \ $where, $function, $accumulator, and mapReduce\n\n在服务器上运行，JavaScript 总是比使用原生 MQL\
  \ 语法表达相同逻辑慢。此外，JavaScript 本质上是 MongoDB 服务器的安全风险，已被弃用，目的是最终完全移除它以消除该风险。\n\n为了更快执行和更好的安全性，避免在\
  \ MongoDB 查询或聚合中使用任何 JavaScript。\n\n> **JavaScript execution: Server versus mongosh\
  \ shell**\n> \n> This doesn’t apply to the mongosh shell, which expands and interprets\
  \ all the JavaScript before sending it to the server. This warning is specifically\
  \ for any and all JavaScript that is meant to be executed on the database server\
  \ itself.\n\n### $text\n\n如果你在 MongoDB Atlas 全文搜索功能引入之前想要进行全文搜索，你的选择要么是使用依赖于旧版 MongoDB\
  \ 文本索引的 $text 运算符，要么是将数据发送到另一个系统。自 Atlas Search 发布以来，原生旧版文本索引的开发已停止，并且完全预期该功能最终将被弃用，取而代之的是基于\
  \ Lucene 的搜索。这种更新的搜索功能将在 MongoDB Community 版本以及 MongoDB Atlas 中可用。\n\n### $regex\
  \ and indexes\n\n由于索引以排序顺序存储值，当你使用 $regex 运算符匹配字符串的一部分时，索引只能在 $regex 等同于以...开头模式时才有效使用，我们称之为左根或锚定的正则表达式。此外，如果正则表达式未指定不区分大小写的选项，索引也只能有效使用。例如，如果你的查询是诸如\
  \ { s: { $regex: /^Abc/ } }，它表示“所有以 Abc 精确开头的字符串”，那么 s 上的索引将被用作高效的范围查询。对于不区分大小写的字符串匹配，请考虑使用具有适当排序规则的索引。\n\
  \n### Aggregation versus match expressions\n\n有一些表达式在 find 和 aggregate 中共享相同的名称，但行为略有不同。务必谨慎，确保你表达的是应用程序所需的确切语义，并检查索引是否按你希望的方式使用。例如，$eq\
  \ 在聚合中字面意思是相等；它不会查看数组内部。另一方面，$in 在聚合中表示“是否有任何数组元素等于此值？”，而在 find 中，$in 是检查指定的任何值是否等于我们搜索的字段（find\
  \ 中的等于表示“等于该值或包含在数组中”）。\n\n### $expr and indexes\n\n因为在 find 或 $match 中使用 $expr\
  \ 表示“我即将使用聚合表达式”，它意味着聚合语义，而索引的使用（它们设计用于支持 find 语义）变得棘手。这就是为什么许多使用 $expr 的查询在你可能期望它们使用索引时不使用索引，或者它们使用索引但有额外的步骤来确保对查询应用正确的语义的原因。如果有可能在不使用\
  \ $expr 的情况下表达查询，那么确保就是这样编写的，并且只有在它是实现所需确切查询语义的唯一方法时才使用 $expr。\n\n### $or clause\
  \ and indexes\n\n通常，单个查询只能使用一个索引。在此上下文中，查询指的是传递给 find 命令或 $match 阶段的单个查询过滤器；具有多个阶段或子管道的管道可以为不同组件使用不同的索引。例如，$unionWith\
  \ 阶段中的每个子管道都是独立于管道其余部分进行规划的，并且 $lookup 管道会使用适当的索引进行自己的规划，而不管顶级管道如何。\n\n\n\n在当前 MongoDB\
  \ 版本中唯一的例外是当查询包含顶层的 $or 时。在这种情况下，$or 的每个分支可以使用不同的索引，因为结果是所有分支结果的并集。在某些情况下，$or 甚至可能位于\
  \ $and 子句内部，并且可以重写为顶层，以便使用多个索引。有时查询优化器会自动重写此操作，但为了简化，尽可能将 $or 子句放在顶层。你学到的关于查询规划的知识仍然适用，因为\
  \ $or 语句的每个子句都是单独规划的，但每个子句的计划会在 explain 输出中作为特殊的 SUBPLAN 阶段显示。\n\n## 特殊集合、索引类型和功能\n\
  \n有一些用例使用基本文档和常规 B-tree 索引来实现具有挑战性。对于非常特定的模式，例如时间序列、地理空间坐标或向量嵌入，MongoDB 提供了专门的集合和索引。MongoDB\
  \ 的特殊集合类型和高级索引功能可以显著提升应用程序在特定用例中的性能。\n\n### 时间序列集合\n\n想象一下，你正在构建一个物联网平台，每秒从数千个传感器收集温度读数，或追踪毫秒级变化的股票价格。你将拥有一个不断的数据点流，每个数据点都有时间戳。更新很少，查询通常针对时间切片。\n\
  \n在 MongoDB 中，任何每份文档都包含时间戳且所有文档共享某些元数据字段的文档集都可以存储在特殊的时间序列集合中。更多详情请参阅 https://www.mongodb.com/docs/manual/core/timeseries-collections/。\n\
  \n而不是单独处理每个带时间戳的文档，MongoDB 时间序列集合在内部将它们分组到桶中，以便来自同一来源的数据与来自相似时间点的数据点一起存储。这减少了存储需求和写入放大，同时使典型的时间切片范围查询变得更快。\n\
  \n性能提升来自多个因素。MongoDB 会自动将时间序列数据压缩并组织成内部列式格式，这对于传感器或金融数据中典型的重复测量非常高效。这带来了巨大的存储节省，通常在\
  \ 70% 到 90% 之间。时间字段会自动创建聚集索引，使时间范围查询在无需额外设置的情况下也非常高效。这意味着查询速度通常比在标准集合上执行相同查询快 3-5\
  \ 倍。减少的存储占用也意味着更少的内存使用、更小的备份和更低的基础设施成本。\n\n例如，一家金融科技初创公司在迁移到时间序列集合后，其查询时间从 5 秒降至仅\
  \ 200 毫秒，而一家制造客户则将其数据存储成本削减了超过 80%。\n\n### 地理空间索引\n\nMongoDB 支持对地理空间数据的查询操作。通过将数据存储为\
  \ GeoJSON 对象或坐标对，然后在其上构建地理空间索引，你可以访问多个地理空间查询操作符，以查找位于特定几何形状内、相交形状以及最接近特定位置的点。你可以在\
  \ https://www.mongodb.com/docs/manual/geospatial-queries/ 找到地理空间查询和功能的完整概述。\n\n\
  在处理地理空间数据时，配置良好的 2dsphere 索引可以将查询性能提高数个数量级，尤其是在大型数据集上，没有索引的查询会非常缓慢。然而，请记住地理空间索引比标准\
  \ B-tree 索引更大，因此明智的做法是监控其内存使用情况，特别是如果你正在索引大型多边形。数据的密度也很重要；如果查询区域包含大量点，MongoDB 需要做更多工作。在这种情况下，最好使用额外的过滤器来缩小结果范围。对于经常将位置与其他条件结合的查询，例如查找\
  \ 5 公里半径内当前营业的餐厅，对地理空间字段和其他过滤字段同时建立复合索引是实现最佳性能的最佳方法。\n\n### Atlas Search\n\n虽然 MongoDB\
  \ 的常规查询功能功能强大，但有时你需要更高级的全文本搜索功能。Atlas Search 将 Apache Lucene 直接集成到你的 MongoDB 集群中。你可以在\
  \ https://www.mongodb.com/docs/atlas/atlas-search/ 了解更多信息。\n\nAtlas Search 提供高度优化的文本搜索，相比常规索引所能实现的功能有了显著提升。它在自然语言搜索、模糊匹配和自动完成功能方面表现出色，结果按相关性排序，帮助用户更快找到所需内容。这不仅改善了用户体验，还提高了基础设施效率。如果没有\
  \ Atlas Search，你可能需要在 MongoDB 旁边维护一个单独的搜索引擎，这会增加运营复杂性和数据同步的麻烦。由于 Atlas Search 基于\
  \ Lucene 构建，即使数据集增长也能保持一致的性能。\n\n### Atlas Vector Search\n\nAtlas Vector Search\
  \ 能够使用向量嵌入进行高效的相似性搜索，这项任务使用标准查询方法会计算成本高且缓慢。通过将向量数据与其它 MongoDB 数据一起存储，你可以将其用作向量数据库。这使你能够基于数据的语义含义进行查询并为你的\
  \ AI 应用提供支持。了解更多信息，请访问 https://www.mongodb.com/docs/atlas/atlas-vector-search/vector-search-overview/。\n\
  \n在实施 Vector Search 时，查询速度和准确性之间存在权衡，而你选择的相似性算法（如 cosine、euclidean 或 dotProduct）会影响两者。余弦相似度通常在两者之间提供良好的平衡。对于非常大的集合，使用近似最近邻（ANN）搜索比精确搜索快得多，而准确性的折损仅为最小。\n\
  \n### 排序规则\n\n不同语言对字符串排序和比较有不同的规则。排序规则让你可以为字符串比较指定特定语言的规则。与将字符串规范化为简单二进制比较而进行复杂处理不同，你可以按原样存储数据并使用适当的排序规则来影响应用程序中排序和比较的行为，而不会牺牲性能。排序规则是常规\
  \ B-tree 索引的一个选项。它不仅仅用于支持法语或德语等语言中的不同字符；它还允许你使用不区分大小写的字符串比较等其他选项。你可以在 https://www.mongodb.com/docs/manual/reference/collation/\
  \ 了解其工作原理。\n\n为了获得最佳性能，至关重要的是你的查询使用与索引相同的排序规则设置。不匹配将阻止 MongoDB 使用索引，而是强制执行更慢的集合扫描。虽然带有排序规则的索引可能比标准索引使用稍多内存，但这种权衡通常是值得的。在内存中对大型结果集进行排序，无论是否使用复杂的排序规则，都非常消耗\
  \ CPU，因此在可能的情况下依赖索引排序始终是更好的选择。\n\n使用专门工具针对特定用例的主要好处是，与使用基础 MongoDB 功能作为构建块自行支持这些功能相比，可以为你节省大量时间。MongoDB\
  \ 的特殊集合和索引在存储引擎级别进行了优化，其性能优于可在应用程序中实现的功能。不要等到你预计达到企业规模时才开始考虑这些功能。现成实现的易用性意味着你可以将其用于小型时间序列集合、有限的地理或全文本搜索，以及\
  \ PB 级的工作负载。\n\n\n\n## 摘要\n\n优化数据库性能首先需要透彻理解 MongoDB 查询引擎如何处理查询并利用索引。了解查询执行的生命周期，即查询如何被解析、规划、执行和返回，为开发者设计高效操作提供了基础。诊断工具如\
  \ explain 命令和日志消息对于检查查询结果以及识别由次优查询计划、资源限制或其他问题导致低效情况非常宝贵。这些见解使开发者能够确定性能问题源于查询本身还是外部因素，例如磁盘\
  \ I/O 或内存争用。对查询定位比率和执行统计等指标的适当评估进一步使开发者能够设计更智能的查询，以最小化不必要的开销并降低延迟。\n\n在执行生命周期之外，避免低效操作并利用\
  \ MongoDB 的专用功能可以显著提高系统性能，同时减少开发工作量。使用时序集合处理物联网或金融数据、地理空间索引处理基于位置的查询，以及使用 Atlas\
  \ Search 或 Atlas Vector Search 等工具进行全文和语义相似性搜索，为独特用例提供量身定制的解决方案。这些功能在存储引擎级别进行了优化，提供效率和可扩展性，而无需自定义实现。此外，实施诸如查询提示、持久查询设置和调优良好的索引等策略可确保对执行计划进行精细控制，并使系统保持最佳运行状态。通过结合深思熟虑的查询设计和强大的诊断实践，并为合适的负载选择合适的工具，开发者可以创建高性能、可扩展的应用程序，以更少的努力和资源满足多样化的需求。\n\
  \n在下一章中，我们将描述操作系统和系统资源如何影响生产系统的性能和成本。\n"
- "# 13 操作系统和系统资源\n\n## 操作系统和系统资源\n\n在运行自托管 MongoDB 部署时，您可以根据特定需求灵活配置内核和操作系统设置。然而，这种灵活性也引入了额外的变量和潜在的性能瓶颈，在调优期间必须仔细考虑。\n\
  \n本章主要与自托管环境相关，因为 MongoDB Atlas 不允许直接访问底层操作系统。在 Atlas 中，配置是基于实例层级处理的，并且操作系统升级由系统自动管理，以防止因内核或系统更改导致意外的性能问题。此外，Atlas\
  \ 可以根据工作负载变化自动扩展计算和存储，这是一项我们将在本章后面探讨的功能。\n\n在本章中，您将学习如何执行以下操作：\n- 通过了解基础设施选择的影响来优化系统性能\n\
  - 微调操作系统和存储配置以提高可靠性和吞吐量\n- 在自托管和托管（Atlas）环境中识别和解决性能瓶颈\n\n### 技术要求\n\n本章主要关注 Linux\
  \ 和高级操作系统概念。有关特定操作系统和 MongoDB 版本的详细信息，请参阅自托管部署的文档操作清单 https://www.mongodb.com/docs/manual/administration/production-checklist-operations/\
  \ 和生产说明 https://www.mongodb.com/docs/manual/administration/production-notes/。\n\n\
  为了监控各种系统资源的利用率，您可以使用操作系统命令、MongoDB Atlas 监控以及专门用于监控多台服务器的其他 GUI 工具。更多细节将在 *第 14\
  \ 章，监控与可观测性* 中提供。\n\n对于系统资源，Linux 命令如 top、vmstat、iostat 和 netstat 可分别用于在单台服务器上某一时刻监控\
  \ CPU、内存、存储和网络。诸如 dstat 和 sar 之类的工具可用于组合来自更简单工具的数据并在一段时间内查看。\n\nMongoDB Atlas 监控提供历史和实时系统资源数据，并与数据库特定指标集成。\n\
  \n对于自托管部署，您可以使用 Netdata、Prometheus + Grafana、Zabbix、Munin 或 Observium 等图形工具。最后，您可以使用商业\
  \ **应用性能监控 (APM)** 工具，如 AppDynamics、Datadog、Dynatrace、LogicMonitor、New Relic、SolarWinds\
  \ 和 Splunk Observability。\n\n要尝试本章中提到的配置更改或命令，您需要使用 Linux 服务器并在本地安装 MongoDB。您可以从\
  \ mongodb.com 下载 MongoDB Community Edition。您还需要下载您选择的语言（Ruby 或 Python）的官方驱动程序：https://www.mongodb.com/docs/drivers/。\n\
  \n### 管理资源以获得最佳性能\n\n到目前为止，在整本书中，我们探讨了性能受资源使用达到满负荷限制的情况。例如，这些资源可以包括 CPU 周期、内存、存储或网络带宽。为了提高性能，我们需要增加限制资源的可用性或减少其使用量。本节概述了每种资源类型并描述了它如何影响\
  \ MongoDB 性能。\n\n### CPU 利用率\n\n如果主 MongoDB 服务器上的 CPU 是您应用程序当前的瓶颈，您可能需要扩展到更快、核心更多的实例。如果您以副本集方式运行\
  \ MongoDB，并且已经将实例或系统扩展到最大程度，可能就需要分片了。这在第 6 章，分片 中有详细说明。\n\n另外，您可以优化应用程序的查询和数据库操作以最小化其\
  \ CPU 占用。这包括使用适当的索引、设计高效的数据模型，以及避免会消耗过多 CPU 周期的低效聚合管道或排序操作。这些技术在第 2、3、4 和 12 章中有更详细的讨论。\n\
  \n默认情况下，MongoDB 服务器配置为使用其运行系统上所有可用的 CPU 核心。这是经过深思熟虑的选择，旨在最大化数据库处理多个并发查询、处理并发连接以及高效管理内部操作的能力。例如，WiredTiger\
  \ 存储引擎从多核并行中显著受益。\n\n如果您自行管理 MongoDB，建议将 MongoDB 服务器部署在专用机器上。在同一系统上运行其他 CPU 密集型软件是强烈不建议的。当多个应用程序竞争相同资源时，诊断性能问题会变得复杂得多。\n\
  \n在 MongoDB，我们通过调优代码并采用能够更好地利用 CPU 周期的现代编译器、链接器和优化器，不断提高数据库服务器的效率。此过程涉及仔细的代码调优以减少开销、消除瓶颈并简化关键操作。MongoDB\
  \ 还评估新的硬件架构、指令集和工具以生成更优化的机器代码，从而降低资源消耗。这种双管齐下的方式（软件级和技术级优化）是 MongoDB 致力于提供高性能、资源高效数据库的核心。\n\
  \n本章后面，在 配置系统以获得 MongoDB 性能 部分，我们将探讨确保 CPU 得到有效利用的实际示例，以及如何识别其他应用程序是否影响 MongoDB\
  \ 服务器的 CPU 可用性。\n\n### 内存管理\n\n图 13.1 显示了运行 MongoDB 服务器的系统内存布局的高级图。在进行性能调优时记住这一点很有用，因为某些功能会使用更多数据，从而减少文件系统（页）缓存可用的内存量，导致更多\
  \ I/O 请求被定向到存储设备。\n\n\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_310_0.png)\n\n\
  *图 13.1：运行 MongoDB 服务器的系统的内存布局*\n\n在根本层面上，服务器的内存使用可以大致分为几个关键组件，每个组件在其整体功能中都发挥着重要作用。\n\
  \n从图表底部开始，我们有以下内容：\n\n- **操作系统/常驻二进制文件：** 这是操作系统和 MongoDB 服务器二进制文件在内存中的代码。\n- **MongoDB\
  \ 静态结构：** 服务器在首次启动时使用并分配的元数据。\n- **WiredTiger 缓存：** 默认情况下，这是 50% 的内存（减去 1 GB）。WiredTiger\
  \ 缓存将频繁访问的数据和索引保存在 RAM 中，以最大限度地减少磁盘 I/O。我们在 *第 7 章，存储引擎* 中详细介绍了此缓存。某些 Atlas 实例可能使用\
  \ WiredTiger 缓存的不同相对大小。\n- **MongoDB 动态“工作”内存：** MongoDB 使用内存缓冲区在操作期间构建、解析和操作 BSON\
  \ 文档。当查询执行时，MongoDB 会为各种操作分配内存，包括排序、聚合管道阶段和投影操作。复杂查询或涉及大量排序或聚合的查询可能会暂时消耗大量内存。非常大的排序操作可能会溢出到磁盘。每个连接到\
  \ MongoDB 服务器的活动客户端连接都会消耗一定量的内存，大量并发连接累积起来会使用大量 RAM。\n- **“空闲”内存（页缓存）**：这是指剩余的内存，通常由内核用于在\
  \ RAM 中缓存文件系统数据，以避免重复的磁盘 I/O。它提供了超出 WiredTiger 缓存的第二层缓存，在 WiredTiger 缓存使用量很大的情况下尤其有益。\n\
  \n了解这种内存分布有助于您更好地诊断性能问题并就系统资源优化做出明智决策。\n\n## 存储\n\n不同类型的存储设备通常各自有一套性能限制。物理存储设备通常分为两大类：机械\
  \ HDD 和 SSD。云环境中的网络磁盘和虚拟驱动器有其他限制。\n\n物理存储设备的性能受以下因素限制：\n\n- **总线接口速度**：设备的连接带宽，例如\
  \ SATA、PCIe 或 NVMe，会限制最大可用吞吐量。\n- **内存和缓存大小**：大多数现代存储设备包含内部内存和缓存。缓存不足会导致处理大量数据时出现瓶颈。\n\
  - **碎片化**：数据散布在扇区或块中会增加寻道时间并降低 HDD 和 SSD 的性能。\n- **读与写操作**：与读操作相比，写操作通常需要更多处理，尤其是在\
  \ SSD 上，因为需要先擦除后写入。\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_311_0.png)\n\n>\
  \ **先擦除后写入**\n> \n> SSD 使用 NAND 闪存，需要在新数据写入同一位置之前先擦除数据。这会减慢连续写操作的速度，尤其是在需要擦除许多块时。为缓解此问题，SSD\
  \ 固件和操作系统的 TRIM 功能可以预先清理未使用的单元，以确保可用空间，避免未来写入时的擦除延迟。\n\n- **顺序与随机 I/O**：与随机 I/O\
  \ 相比，顺序读写通常具有更高的吞吐量，这是由于机械移动减少（对于 HDD）或开销减少（对于 SSD）。\n- **并发访问：** 高水平的并发 I/O 请求可能会压倒存储设备的处理能力，尤其是在缺乏高效队列管理或并行访问优化的情况下。\n\
  - **介质退化：** HDD 和 SSD 都会随着时间的推移出现性能下降——HDD 由于机械磨损，SSD 由于 NAND 闪存单元磨损。\n- **存储过度填充：**\
  \ 存储设备在接近满容量时通常性能更差。这对于 SSD 尤其如此，因为需要过度配置空间以维持一致的写入性能。\n\nHDD 在高性能系统中现在使用得较少。截至撰写时，HDD\
  \ 的每 GB 成本仍低于 SSD，但差距正在缩小。对于 HDD，性能限制因素包括以下内容：\n\n- **磁盘速度：** 盘片的旋转速度（以 **每分钟转数（RPM）**\
  \ 为单位）会影响延迟和持续吞吐量\n- **读写头移动：** 读写头的移动和定位会引入机械延迟（寻道时间）\n\n与 HDD 相比，SSD 在性能、耐用性和功耗效率方面具有各种优势。对于\
  \ SSD 和闪存存储阵列，限制因素包括以下内容：\n\n- **NAND 限制：** NAND 单元编程时间和 NAND 阵列中的同时操作数量会限制性能\n\
  - **磨损均衡：** 如果磨损均衡算法效率低下或无法在 NAND 单元之间有效管理写入，则性能可能会下降\n- **固件优化：** SSD 控制器使用内部算法（例如垃圾回收、磨损均衡和过度配置），这些算法会影响性能，尤其是在高负载下\n\
  - **过热：**  excessive heat can throttle the performance of modern SSDs, as internal\
  \ thermal management mechanisms reduce performance to prevent damage -> 过热会限制现代\
  \ SSD 的性能，因为内部热管理机制会降低性能以防止损坏\n\n对于云环境中的网络磁盘和虚拟驱动器，以下因素会限制或约束性能：\n\n- **带宽：** 数据在网络上传输的速度会限制\
  \ **网络附加存储（NAS）** 或 **存储区域网络（SANs）** 中的存储性能\n- **延迟：** 网络延迟会引入延迟，这对于需要低延迟 I/O 的应用程序至关重要\n\
  - **并发网络 I/O：** 访问存储的大量同时网络流量会导致争用和瓶颈问题\n\n文件系统连接操作系统和块存储设备，提供跨物理磁盘、网络磁盘和云环境中虚拟驱动器的统一抽象接口。选择合适的文件系统至关重要，因为它会对性能产生重大影响。使用自管理的\
  \ MongoDB 部署时，您可以选择为日志和数据文件使用单独的存储设备。通过将日志文件和数据文件分离到不同的存储设备上，您可以最大限度地减少日志写入与数据读写之间的\
  \ I/O 争用。这可以提高高写入工作负载的性能。\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_313_0.png)\n\
  \n> **提示**\n> \n> 将日志文件放在快速 SSD 或 NVMe 驱动器上。这使 MongoDB 能够以更快的速度处理频繁的顺序写入，而不会与主数据文件争夺\
  \ I/O 带宽。\n\n数据文件通常较大，需要大容量存储，可以放在更高容量、成本效益更高的存储解决方案上（例如较慢的 HDD）。然而，需要考虑一些缺点。管理日志和数据文件的单独存储设备会增加复杂性并提高故障概率：\n\
  \n- 您有两个设备需要配置、监控并调查潜在瓶颈。\n- 使用两个设备会增加故障概率。例如，企业 SSD 的典型 **年化故障率（AFR）** 目前为每年 0.3%–0.8%。如果我们使用该范围的中点（0.55%），并且服务器独立使用两个\
  \ SSD 分别用于日志和数据，则存储的 AFR 将为 1.1%。作为安全网，MongoDB 复制机制可防止此类故障的风险。\n- 在云环境中，将日志和数据文件分离到不同的虚拟磁盘上仍可能导致隐藏的争用。\n\
  - 它可能使同时对日志和数据文件执行一致快照变得困难。快照通常用于对数据库进行即时备份，一致的快照取决于日志和数据文件之间的原子性。\n\n数据服务平台，例如数据库，依赖于底层存储技术。这意味着从性能和生命周期角度来看，了解您使用的技术的特性非常重要。\n\
  \n\n\n## 网络\n\n网络在 MongoDB 部署的性能中发挥着至关重要的作用。以下是在 MongoDB 部署中可能限制性能的关键网络因素：\n\n-\
  \ **高网络延迟：** 这会导致应用程序与 MongoDB 数据库之间，或分片或复制设置中集群节点之间的通信延迟。\n- **网络带宽不足：** 这会限制 MongoDB\
  \ 组件之间的数据流，尤其是在高吞吐环境中，影响读写操作。\n- **数据包丢失：** 这发生在数据包由于网络拥塞、硬件故障或配置错误而未能到达目的地时。这可能导致以下情况：\n\
  \  - 失败操作的重试次数增加，从而降低整体数据库性能\n  - 副本集从节点上的潜在复制滞后\n  - 分布式集群中分片之间的通信中断\n- **缓慢或不可靠的\
  \ DNS 解析：** 这会导致连接到 MongoDB 服务器的延迟，尤其是在初始连接或故障转移事件期间。\n- **高网络流量：** 共享资源竞争会降低 MongoDB\
  \ 高效传输或接收数据的能力。\n- **配置错误的防火墙：** 过于严格的安全策略可能会阻止或延迟合法流量，影响 MongoDB 性能。\n- **不一致的网络拓扑：**\
  \ 设计不良的网络基础设施可能导致非对称路由、不一致的延迟或低效的数据流。\n- **地理延迟：** 在地理位置遥远的区域部署 MongoDB 节点会引入显著的通信延迟。\n\
  \n缓慢或不可靠的网络连接会严重影响数据库吞吐量、延迟和可扩展性。\n\n总之，性能瓶颈通常源于资源被用到其满负荷。最常见的例子是 CPU 周期、内存、存储和网络。值得注意的是，使用\
  \ MongoDB Atlas 时，其中许多资源都由您管理。\n\n## 为 MongoDB 性能配置系统\n\n本节中，我们将查看您可以采取的操作，以诊断和修复\
  \ CPU 周期、内存、存储和网络的示例问题。\n\n### 了解每个 CPU 核心的理想并发操作比率\n\nMongoDB 服务器并发运行多个操作，并将它们分发到在多个\
  \ CPU 核心上运行的线程中。如我们在第 1 章《系统和 MongoDB 架构》中所见，如果应用程序服务器没有并行发送足够的操作以充分利用 MongoDB 服务器，则应用程序服务器可能成为瓶颈。\n\
  \n例如，如果您使用应用程序的关键性能工作负载运行一系列实验并在电子表格中绘制结果，您可能会看到类似于图 13.2 的图表，该图表显示了随着线程数或并行操作数增加时\
  \ CPU 利用率和性能趋势。\n\n### 数据库操作/秒 与 CPU 利用率\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_315_0.png)\n\
  \n*图 13.2：随着您增加并行度，CPU 利用率和性能趋势的影响*\n\n在此示例中，数据库服务器运行在 16 核 CPU 上。性能在 64 个线程时达到峰值，并且在添加更多线程后可能会略有下降。这是许多应用程序的典型模式。在这种情况下，64\
  \ 个线程在 16 个核心上达到最佳性能，表明每个核心有 4 个活动线程或连接的比率。重要的是使用生产工作负载和数据集进行测试，以确定关键性能工作负载的理想线程与核心比率。例如，您不希望在\
  \ 16 核机器上仅并行运行 8 个操作，导致一半核心处于空闲状态，因为这可能导致不必要的资源成本。\n\n## 在性能下降期间搜索其他 CPU 密集型进程\n\
  \n周期性性能下降可能是由其他 CPU 密集型进程竞争系统资源引起的。为了诊断这些问题，您可以使用各种工具和命令来识别消耗大量资源的进程。您可以使用 Linux\
  \ 工具如 top、htop、ps、pidstat、iotop 和 perf 来查看性能下降期间系统上正在运行的内容。\n\n例如，运行 top 命令显示按资源使用情况排列的顶级进程：\n\
  \n```\ntop - 18:09:15 up 10 min,  1 user,  load average: 1.01, 0.02, 0.00\n\n%Cpu(s):\
  \  87.0 us, 13.0 sy,  0.0 ni,  0.0 id,  0.0 wa,  0.0 hi,  0.0 si,  0.0 st\nMiB Mem\
  \ :  31373.4 total,  30190.5 free,   428.5 used,   754.3 buff/cache\nMiB Swap: \
  \     0.0 total,      0.0 free,      0.0 used.  30616.0 avail Mem\n\n  PID USER\
  \      PR  NI    VIRT    RES    SHR S  %CPU  %MEM     TIME+ COMMAND\n 1927 ubuntu\
  \    5 -15  531488 139020  70108 R  47.3  0.4  1:08.63 mongod\n 1910 ubuntu    5\
  \   0  500288  99191   6436 R  16.1  0.1  0:25.98 python\n    1 root     20   0\
  \  167004  11108   7464 S   6.0  0.0  0:01.06 systemd\n    4 root      0 -20   \
  \    0      0      0 I   0.0  0.0  0:00.00 rcu_par_gp\n  589 root     20   0   82100\
  \   3204   2796 S   0.3  0.0  0:00.03 irqbalance\n 1968 ubuntu    5 -15    7148\
  \   3296   2448 R   0.3  0.0  0:00.04 top\n    2 root     20   0       0      0\
  \      0 S   0.0  0.0  0:00.00 kthreadd\n```\n\n在此输出中，您可以看到没有空闲 CPU 周期（0.0 id），并且一个\
  \ Python 进程使用了 16.1% 的 CPU，而 MongoDB（mongod）本可以利用这部分时间。\n\n如果 MongoDB 运行在虚拟机上，周期性下降也可能源于虚拟机外部的进程，例如其他虚拟机或\
  \ hypervisor 任务。在这种情况下，请使用 hypervisor 工具如 vmstat、virt-top 或您云提供商的监控工具检查主机级别的资源使用情况。\n\
  \n## 为您的应用程序选择合适的文件系统\n\n本节重点介绍 Linux 文件系统。我们将更详细地介绍两种最相关的选项，即扩展文件系统 (XFS) 和第四扩展文件系统\
  \ (ext4)，并在后面的部分介绍其他文件系统。\n\n### 扩展文件系统 (XFS)\n\nMongoDB 生产说明建议在生产部署中使用 XFS。XFS\
  \ 通常为具有高吞吐量和并发读写操作的负载提供更好的性能。它比 ext4 更有效地处理大文件和碎片化数据，并且倾向于更好地管理大量刷新操作，在检查点期间表现出更少的\
  \ I/O 停顿。XFS 还支持更大的文件和文件系统大小。\n\nXFS 最初由 Silicon Graphics, Inc. (SGI) 于 1994 年开发，于\
  \ 2001 年移植到 Linux，并在 2004 年（版本 2.6）集成到主线内核中。Red Hat 于 2014 年将 XFS 采用为 RHEL 7 的默认文件系统，理由是其可扩展性和企业工作负载的性能。\n\
  \n### 第四扩展文件系统 (ext4)\n\n如果您使用的 Linux 发行版支持 XFS，请使用它。如果不支持，ext4 仍然是一个可靠的选择。ext4\
  \ 是一个成熟、广泛使用的文件系统，长期以来一直是许多 Linux 发行版的默认设置。虽然 ext4 过去比 XFS 更广泛可用，但近年来差距已经缩小。随着操作系统、内核和\
  \ MongoDB 本身的演进，ext4 与 XFS 之间的性能差距也随着时间的推移而缩小。\n\n### 其他文件系统\n\n虽然 MongoDB 可以在其他文件系统上运行，但它们的功能有时与\
  \ MongoDB 和 WiredTiger 已提供的功能重叠，导致效率低下：\n\n- **网络文件系统 (NFS)**：不推荐用于 MongoDB。有关更多信息，请参阅\
  \ MongoDB 生产说明。\n- **B树文件系统 (Btrfs)**：在写入密集型工作负载下可能表现不佳。其 **写时复制** (CoW) 设计可能导致写入放大，其中数据库级别的\
  \ 100B 文档可能导致写入存储设备的数据量多出数倍。Btrfs 还实现了 WiredTiger 中已存在的机制。\n- **泽字节文件系统 (ZFS)**：更适合备份或媒体等大型顺序数据。对于\
  \ MongoDB 的小型随机读写，ZFS 可能比 XFS 或 ext4 更慢。\n- **Ceph 文件系统 (CephFS)**：专为分布式存储集群和云原生应用设计。MongoDB\
  \ 已通过分片和复制支持这些用例。\n\n总之，XFS 或 ext4 是 MongoDB 部署最可靠的选择，提供性能、稳定性和兼容性的最佳平衡。\n\n\n\n\
  ## 文件系统设置\n\n默认情况下，在 2.6.30 之前的内核中，Linux 在每次读取文件时都会更新文件的 **访问时间 (atime)** 元数据。这意味着读写密集型工作负载在每次访问磁盘上的文件时也会触发一次写操作。自\
  \ 2.6.30 起，**相对访问时间 (relatime)** 成为默认行为。这降低了 atime 更新的频率，避免了不必要的磁盘写入，在保留大多数用例所需的足够\
  \ atime 信息的同时显著提高了文件 I/O 性能。\n\n你可以通过在文件系统挂载设置中添加 noatime 选项来禁用所有 atime 更新行为。`/etc/fstab`\
  \ 文件是 Linux 配置文件，定义了在启动期间应如何挂载文件系统、分区和存储设备。\n\n要禁用 atime 写入，请在 `/etc/fstab` 中添加\
  \ noatime 选项，如此示例所示：\n\n```\n/dev/sdx /path/to/mongodb_data xfs defaults,noatime\
  \ 0 0\n```\n\n其他文件系统选项也可以提高性能，但其中许多会降低写入的持久性。总的来说，除非你清楚了解风险和权衡，否则 MongoDB 不建议使用此类选项。\n\
  \n## 避免使用带奇偶校验的 RAID\n\n**冗余独立磁盘阵列（或廉价磁盘阵列）（RAID）** 存储设备是指使用多个物理 HDD 或 SSD 组合起来以提高性能、数据冗余或两者兼有的系统。RAID\
  \ 通常用于服务器、工作站和存储系统，以提供比单个磁盘更好的可靠性和性能。然而，随着行业转向更现代的分布式和软件定义存储解决方案，后者提供更好的可扩展性、冗余和容错能力，RAID\
  \ 的使用频率正在降低。\n\nMongoDB 不需要 RAID 来实现容错。如果你的组织强制要求使用 RAID，建议使用 RAID 0 或 RAID 10。RAID\
  \ 0 将数据拆分（条带化）在多个驱动器上。它同时向阵列中的所有驱动器写入数据，通过并行化提高读写性能。\n\n然而，RAID 0 不存储镜像或奇偶校验数据，这意味着它不提供数据保护。如果其中一个驱动器发生故障，所有数据都会丢失。RAID\
  \ 10（也称为 RAID 1+0）结合了镜像和条带化。它创建驱动器镜像对（RAID 1）以实现冗余，然后在镜像对之间条带化数据（RAID 0）以获得更好的性能。\n\
  \nMongoDB 生产说明建议避免对写入密集型数据库使用 RAID 5 或 RAID 6，因为它们的奇偶校验计算会减慢写操作。\n\n## 调整预读设置\n\n\
  Linux 预读功能是一种内核级优化，旨在提高顺序磁盘读取的效率。它通过读取超出请求的数据块并将其缓存到内存中来预测未来的数据访问。对于磁盘访问和数据布局为顺序的工作负载，数据库发出\
  \ I/O 请求时下一个块可能已经在缓存中。这可以通过减少磁盘 I/O 延迟来提高性能。\n\n对于 MongoDB，预读调优的影响取决于工作负载的性质、磁盘上的数据布局和内核版本。MongoDB\
  \ 查询通常以随机模式访问数据。然而，如果你的工作负载按写入顺序访问文档，更高的预读值会有所帮助。\n\n默认情况下，MongoDB 的 WiredTiger\
  \ 引擎大部分时间读取 ~28 KB 数据块（默认 leaf_page_max=32KB 设置）。在 Linux 中，预读值以块为单位指定，每个块为 512 字节。例如，预读值为\
  \ 32 表示内核将预取 32 个块，相当于 16 KB。\n\n在 Linux 5.x 和 6.x 内核中，对值为 0 的预读处理进行了改进，以避免在 4.x\
  \ 内核中看到的性能损失。内核 6.x 还包括更好的缩放启发式，可根据工作负载行为和设备特性更有效地确定预读大小。它还通过删除冗余代码路径简化了预读逻辑。更改内核版本会显著影响性能，因此在内核更改或升级后重新运行预读调优实验很有用。\n\
  \n建议从预读值 32 开始，然后测试 16 和 64。如果任一值提高性能，请继续朝该方向调优。0 或高于 256 的值通常不建议使用。\n\n## 修改文件系统缓存设置\n\
  \n调整 vm.dirty_background_ratio 等系统设置可以通过控制 Linux 内核如何处理内存中脏的（已修改但尚未写入磁盘）页面来提高 MongoDB\
  \ 的性能和可靠性。\n\nvm.dirty_background_ratio 设置定义了在内核开始在后台将它们刷新到磁盘之前，脏页可以填满总系统内存的百分比。脏页代表尚未持久化到存储的文件系统更改（例如来自\
  \ MongoDB 的写入）。\n\nMongoDB 经常写入磁盘并依赖操作系统进行写入缓冲。如果 vm.dirty_background_ratio 设置过高，内核可能会延迟刷新，允许大量脏页累积。这会触发突然的、密集的\
  \ I/O 峰值，增加延迟。降低此值会导致更小、更频繁的刷新，使磁盘写入更加平滑。\n\n另一个相关设置 vm.dirty_ratio 定义了可以填满脏页的内存最大百分比。一旦超过此阈值，生成新写入的进程将被阻塞，直到脏页刷新到磁盘。\n\
  \n## 预写日志与数据文件写入\n\n> 这些设置会影响对数据文件的写入。预写日志操作由 MongoDB 立即刷新以确保持久性（而不是依赖内核级机制）。\n\n\
  你可能在以下情况下考虑调整 vm.dirty_background_ratio：\n\n- **I/O 峰值或高延迟：** 如果你在大量脏页同时刷新时看到磁盘\
  \ I/O 的不规则突发，请降低脏背景比率以触发更小、更频繁的刷新。使用 iostat 命令查找 await 的高值。await 测量是应用程序发出 I/O 请求时看到的总响应时间（以毫秒为单位）。它包括在\
  \ I/O 调度程序队列中等待的时间和实际访问磁盘所花费的时间。在更改前后测量 await，以查看是否有所不同。\n- **脏页内存使用过高：** 如果脏内存持续占用大量内存，大于\
  \ RAM 的 10–20%，请降低 vm.dirty_background_ratio 以触发更早的后台刷新。你可以使用以下命令在 Linux 上监控脏内存：\n\
  \n```\n$ cat /proc/meminfo | grep -E \"Dirty|Mem\"\n```\n\n以下是示例输出：\n\n```\nMemTotal:\
  \      32126312 kB\nMemFree:        3067873 kB\nMemAvailable:   3134261 kB\nDirty:\
  \          6425262 kB\n```\n\n命令中的 grep 部分在输出中查找 Dirty 和 Mem 子字符串。在此示例中，系统有 ~10%\
  \ 的空闲内存和近 20% 的脏页。\n- **检查点缓慢或写入延迟高：** 长时间的 MongoDB 检查点持续时间或写入操作期间的延迟可能表明 MongoDB\
  \ 与内核刷新行为之间的同步不良。\n- **因脏页比例超出导致写入停滞：** 如果 MongoDB 写入在脏内存超过 vm.dirty_ratio 定义的阈值时被阻塞，则需要调整\
  \ vm.dirty_ratio 和 vm.dirty_background_ratio。你可以在 Linux 上使用以下命令查看写入操作和被阻塞的进程：\n\
  - **高写入活动期间系统性能下降：** 写入峰值期间的高 CPU 使用率或磁盘性能下降表明脏页刷新效率低下。\n\n```\ndstat -c --top-io\n\
  ```\n\n这些场景突出了调优 vm.dirty_background_ratio 变得必要的情况，但理解调整只是第一步；与互补设置和监控一起深思熟虑地应用它，是提高整体写入性能的关键。\n\
  \n为此，首先适度降低 vm.dirty_background_ratio 以控制脏页的累积并触发更早的刷新。默认值通常为 10%。建议从较低的值开始，范围在\
  \ 5–7% 之间：\n\n```\nsudo sysctl -w vm.dirty_background_ratio=7\n```\n\n降低 vm.dirty_ratio\
  \ 以减少阻塞风险。默认值通常为 20–30%。建议将此值降低到 15–18%：\n\n```\nsudo sysctl -w vm.dirty_ratio=18\n\
  ```\n\n前两个命令对正在运行的系统进行更改。如果希望更改在服务器重新启动后仍然存在，则需要编辑 /etc/sysctl.conf。在尝试这些配置设置时，我们建议：\n\
  \n- 在每次调整后监控性能\n- 使用 iostat 或 sar 确保 I/O 平稳可预测且无突发\n- 使用 mongostat 测量 MongoDB 写入延迟\n\
  - 搜索数据库日志中的检查点完成时间以确保持续时间可预测\n\n如果你的工作负载表现出写入延迟峰值、脏页的大内存使用或被阻塞的写入，降低 vm.dirty_background_ratio\
  \ 可以帮助平滑磁盘刷新操作并减少性能瓶颈。将此与监控以及对其他设置（如 vm.dirty_ratio、MongoDB 检查点频率和 WiredTiger 缓存大小）的调整相结合，以实现最大优化。\n\
  \n\n\n## 检查 SSD 健康状况\n\nSSD 使用复杂的固件技术，例如磨损均衡、垃圾回收、超额配置和 TRIM，以降低擦写前擦除对性能的影响。在操作系统层面，请确保\
  \ TRIM 和垃圾回收已启用。这些功能使现代 SSD 在各种使用场景下都快速可靠。然而，监控其健康状况很重要，以便检测到磨损开始影响性能或驱动器接近使用寿命末期时。\n\
  \n在 Linux 上，大多数 SSD 支持 SMART 数据报告，可提供详细的健康和诊断指标，例如磨损均衡状态、剩余寿命和坏块计数。许多 SSD 厂商提供专有工具来监控其驱动器。这些工具通常会公开与磨损相关的数据，并允许您为健康问题或性能下降设置警报。如果您在服务器或数据中心中使用企业级\
  \ SSD，可能还有额外的监控工具可用，例如 Nagios、Datadog、Dynatrace、Zabbix 或带 Node Exporter 的 Prometheus。\n\
  \nSSD 还会在健康状况或性能开始下降时记录系统级警告或错误。在 Linux 上，检查 /var/log/syslog，使用 journalctl 或运行 dmesg\
  \ 以查找与 SSD 相关的 I/O 错误。\n\n## 避免双重加密和压缩\n\n一些存储技术包括压缩或加密支持，有些两者都支持。例如，企业存储阵列和 SSD\
  \ 通常都包含两者。云存储服务通常不支持压缩，但支持加密以保护静态数据、传输中数据以及快照中的数据。\n\n已压缩或加密的数据更难压缩。如果数据库压缩和/或加密数据，存储设备的压缩逻辑可能找不到更少的冗余模式，导致几乎没有进一步压缩。在某些情况下，对已压缩数据尝试压缩可能会导致存储开销，增加所需的计算资源。\n\
  \n同时由数据库和存储设备处理的数据可能会被压缩和加密两次。这通常效率低下，可能会影响性能，而没有显著好处。为防止这种情况，您应确定在数据库层还是存储层最有效地应用压缩和加密。\n\
  \n在某些行业中，双重加密可提供额外的防御层，通过确保在多个层独立强制执行加密（例如，数据库加密用于逻辑安全，存储设备加密用于物理安全）。\n\n## 确保常驻内存使用率保持在\
  \ 80% 以下\n\n作为一般规则，您应尝试将常驻内存使用率保持在 80% 以下，因为内存不足会对性能产生很大影响。例如，代码可能会被换出（从物理 RAM 中驱逐），因为它可以从原始源重新加载。然而，如果它需要再次运行，则需要重新调入并等待\
  \ I/O。如果配置了交换空间，系统会将使用频率较低的内存页移动到磁盘，以为活动进程释放 RAM。当内存再次被访问时，这会导致一次写入和随后的从存储读取。如果内存严重不足，**out-of-memory\
  \ (OOM)** “杀手”可能会终止服务器进程。\n\n如果您自行管理 MongoDB 系统且无法添加内存，您应定期监控集群的内存使用情况，以了解是否需要调整。您可以尝试减小\
  \ WiredTiger 缓存的大小，如我们在 *第 7 章，存储引擎* 中讨论的那样。\n\n在 Atlas 中，您可以设置精细的警报，以便在常驻内存接近关键阈值时通知您。您可以通过扩展到更高层级或启用自动扩缩容来解决此问题，*使用自动扩缩容实现\
  \ Atlas 性能* 部分将在本章后面更详细地介绍。\n\n在 Atlas 和自托管部署中，如果大量内存被运行分析工作负载的复杂聚合使用，您可以使用 MongoDB\
  \ 的工作负载隔离功能。\n\n工作负载隔离最大限度地减少了内存争用，并确保每个工作负载高效运行。创建 Atlas 集群时，您可以选择创建分析节点或搜索节点以实现工作负载隔离。\n\
  \n使用分析节点来隔离您不希望与操作工作负载竞争的查询。例如，分析节点可以处理数据分析操作，例如来自 Atlas BI Connector 的报表查询。您的分析节点的集群层级可以与操作节点不同。如果您选择显著较低层级的分析节点，您需要监控复制延迟，以确保其资源充足。\n\
  \n同样，您可以使用专用的搜索节点将搜索工作负载与操作工作负载隔离。最后，如果您尚未使用分片，这可能是一个很好的开始理由。有关何时以及如何添加分片的更多详细信息，请参阅\
  \ *第 6 章，分片*。\n\n## 网络最佳实践\n\n对于所有分布式系统而言，遵循网络最佳实践对于稳定且高性能的 MongoDB 部署至关重要。如果您已确定网络是当前限制因素，以下清单可能有所帮助：\n\
  \n- 将 MongoDB 集群部署在靠近应用程序服务器的位置（例如，使用云基础设施时在同一区域）。\n- 使用低延迟网络连接和高速度互连。\n- 使用网络压缩并监控/优化查询模式以减少数据传输。这是\
  \ MongoDB 驱动程序支持但默认未启用的功能。\n- 为 MongoDB 服务器分配足够的带宽，尤其是在高流量生产环境中。\n- 使用针对更高吞吐量优化的网络接口（例如千兆或多千兆以太网）。\n\
  - 依赖稳定、维护良好的网络基础设施以最大限度地减少数据包丢失。\n- 使用服务质量 (QoS) 设置优先处理 MongoDB 流量。\n- 为 DNS 条目设置简短且一致的生存时间\
  \ (TTL) 值，以防止陈旧缓存问题。\n- 使用固定 IP 或快速解析的 DNS 名称部署 MongoDB 集群；使用本地 DNS 服务器以实现更快解析。\n\
  - 使用 VLAN 或 QoS 将 MongoDB 流量与非关键工作负载隔离。\n- 根据需要扩展网络基础设施或将 MongoDB 迁移到拥塞较少的环境。\n\
  - 在可能的情况下避免对 MongoDB 流量进行深度数据包检测。\n- 使用虚拟私有云 (VPC)、受信任网络和 VPN 来保护流量，而不会使数据包过滤系统过载。\n\
  - 在所有节点上实施一致的路由策略。\n- 定期测试网络拓扑以确保均衡高效的流量分配。\n- 在可能的情况下将 MongoDB 集群部署在同一地理区域内。\n\
  - 利用 MongoDB Atlas 的全球集群处理分布式工作负载，同时最大限度地降低延迟。\n- 选择具有优化区域互连的云提供商。\n\n此外，请考虑调整以下操作系统级网络参数：\n\
  \n- **somaxconn**：在 Linux 中，此参数定义可在套接字上排队的待处理连接请求的最大数量。增加 somaxconn 值允许 MongoDB\
  \ 排队更多传入连接，在网络流量繁忙期间降低连接错误发生的可能性。\n- **tcp_max_syn_backlog**：控制在初始 TCP 握手期间排队的待处理\
  \ SYN 请求数量。\n- **tcp_syncookies**：在 SYN 后备队列满时防止 SYN 洪水攻击。\n- **tcp_fin_timeout**：此参数控制套接字在连接关闭后保持在\
  \ TIME_WAIT 状态的时间（以秒为单位）。TIME_WAIT 状态是一种安全机制，确保与已关闭连接相关的所有数据包在套接字被释放以供重用之前已正确传输并得到确认。虽然这对于防止数据包重传错误至关重要，但不必要的高的\
  \ tcp_fin_timeout 值可能会导致繁忙环境中的资源耗尽，因为系统会在较长时间内保留大量已关闭连接状态。\n\n尽管网络瓶颈通常比 CPU、内存或存储相关的瓶颈更少见，但积极监控网络健康状况并使用正确的工具和配置主动解决问题仍然是明智之举。\n\
  \n## 使用自动扩缩容实现 Atlas 性能\n\nMongoDB Atlas 提供自动扩缩容，这是一项强大的功能，旨在简化资源管理并确保集群工作负载的最佳性能。\n\
  \n通过动态调整集群层级和存储容量，自动扩缩容有助于您在最大限度减少人工干预的同时保持高可用性和性能。它可以向上或向下扩展计算；存储仅自动向上扩展。用户受益于\
  \ Atlas 的简洁性和效率。如果您的特定需求未得到满足，请咨询 MongoDB 支持以获取针对您特定应用程序的指导。\n\n当工作负载变化且数据增长时，手动扩展资源可能具有挑战性和低效性。自动扩缩容通过利用自动化来解决这些挑战，确保您的集群资源实时与应用程序需求保持一致。这消除了过度配置或利用不足，从而实现成本效益和一致的性能。\n\
  \n\n\n\nKey performance benefits of auto-scaling include the following:\n\n- **Seamless\
  \ workload management:** Automatically adjusts resources to accommodate sudden spikes\
  \ or drops in workload without requiring downtime\n- **Enhanced reliability:** Ensures\
  \ that sufficient resources (CPU, RAM, and storage) are available to avoid bottlenecks\
  \ during peak usage\n- **Cost optimization:** Prevents unnecessary provisioning\
  \ when workload demands are low, reducing operational expenses\n- **Proactive scaling:**\
  \ Prepares your application for rapid usage spikes or large data ingestion events\
  \ to deliver uninterrupted service\n\nWith auto-scaling, MongoDB Atlas automatically\
  \ monitors your cluster’s performance and utilization metrics, such as CPU usage\
  \ and disk space.\n\nHere are the two main components of auto-scaling in MongoDB\
  \ Atlas:\n\n- **Cluster-tier auto scaling:** Adjusts the cluster tier (e.g., M10,\
  \ M20, or M40) to ensure sufficient resources for CPU and memory utilization\n-\
  \ **Storage auto-scaling:** Scales disk capacity to accommodate data growth, preventing\
  \ errors related to insufficient storage\n\nAutomatic scaling is enabled by default\
  \ when you provision a new cluster, which can be disabled if needed. To stay informed\
  \ about scaling events, set up alerts in the Atlas Monitoring suite. Alerts will\
  \ notify you of resource changes, allowing you to track activity and ensure that\
  \ adjustments align with your expectations. Automatic scaling is not a substitute\
  \ for other performance best practices, such as optimizing queries. It is a temporary\
  \ safety net, but in the long term, you should periodically review your cluster’s\
  \ performance and scaling history to identify patterns and apply other optimizations.\n\
  \n## Summary\n\nThis chapter has provided an in-depth guide to optimizing MongoDB\
  \ performance by configuring the operating system and other system resources, with\
  \ a primary focus on self-managed deployments. While MongoDB Atlas automates many\
  \ of these tasks, understanding the underlying principles remains valuable.\n\n\
  We covered key resource categories (CPU, memory, storage, and networking) and offered\
  \ practical guidance on topics such as core-to-operation ratios, choosing the right\
  \ filesystem (with a recommendation for XFS), and tuning filesystem cache settings.\
  \ We also cautioned against using double encryption/compression and exceeding 80%\
  \ resident memory usage.\n\nAdditionally, we outlined a checklist for network optimization,\
  \ including ensuring cluster proximity, maintaining low-latency connections, and\
  \ planning for bandwidth allocation. Finally, we explained how MongoDB Atlas’s auto-scaling\
  \ dynamically adjusts cluster tiers and storage capacity to meet demand.\n\nThe\
  \ next chapter examines monitoring and observability in MongoDB, showing how to\
  \ track critical metrics, leverage both built-in and external tools, and establish\
  \ practices that ensure reliability and performance at scale.\n"
- "# 14 Monitoring and Observability\n\n## Monitoring and Observability\n\nIn high-performance\
  \ database environments, understanding what’s happening under the hood isn’t just\
  \ beneficial, it’s essential. Monitoring and observability form the foundation of\
  \ maintaining and optimizing MongoDB deployments, especially as systems scale and\
  \ workloads become more complex.\n\nThis chapter provides a practical guide to monitoring\
  \ and observability in MongoDB, equipping you with the knowledge to maintain high\
  \ performance and reliability as your systems grow. You’ll learn how to interpret\
  \ key metrics, leverage built-in and external tools, and respond proactively to\
  \ early signs of trouble before they impact your applications. Whether you’re running\
  \ MongoDB in the cloud with Atlas or managing your own infrastructure, this chapter\
  \ will help you build a robust observability strategy tailored to your needs.\n\n\
  Key topics covered in this chapter include the following:\n\n- The difference between\
  \ monitoring and observability\n- Why monitoring and observability both matter for\
  \ database performance\n- The core MongoDB metrics and signals to track for optimal\
  \ health and troubleshooting\n- How to use MongoDB Atlas and self-managed tools\
  \ for real-time monitoring and alerting\n- Best practices for integrating MongoDB\
  \ metrics into broader observability platforms\n\n### Key differences between monitoring\
  \ and observability\n\nWhile often used interchangeably, monitoring and observability\
  \ represent distinct but complementary practices. Monitoring answers Is something\
  \ wrong? by collecting and alerting on predefined metrics, opcounters, cache pressure,\
  \ page faults, and connection counts against known thresholds. It’s focused on tracking\
  \ the known failure modes of a system.\n\n**Observability** answers *Why is it happening?*\
  \ by enriching those metrics with contextual data such as logs, traces, and explain\
  \ plans, so you can drill down from an alert to the root cause. It enables the exploration\
  \ of unknown issues by providing a comprehensive view of the system's internal state.\n\
  \nIn high-throughput environments, whether running a single replica set or a global\
  \ sharded cluster, subtle performance degradations can cascade into major outages.\
  \ Without comprehensive visibility into resource utilization, query performance,\
  \ and system health, identifying bottlenecks becomes a frustrating guessing game.\n\
  \nObservability transforms this guesswork into data-driven insights. By continuously\
  \ tracking key signals, you can optimize performance and detect early signs of trouble\
  \ before they impact your applications. Here are some examples:\n\n- **Correlate\
  \ logged operations** with index usage (or lack thereof) and execution plans to\
  \ pinpoint missing or inefficient indexes\n- **Overlay disk queue depths** with\
  \ commit times to uncover storage contention under peak workloads\n- **Chart replication\
  \ lag** against write throughput to detect network bottlenecks during failover events\n\
  - **Monitor memory pressure** to identify optimal cache sizes and prevent page faults\n\
  - **Track connection patterns** to properly size connection pools and prevent queuing\n\
  \nThese practices are important because they turn raw monitoring data into actionable\
  \ insights. By correlating slow queries with index usage, overlaying disk queue\
  \ depths with commit times, and tracking replication lag, memory pressure, and connection\
  \ patterns, you can move beyond simply detecting that something is wrong; you can\
  \ pinpoint the root cause of performance issues. This enables you to proactively\
  \ optimize your MongoDB deployment, prevent outages, and ensure that your database\
  \ continues to deliver reliable, high performance as workloads grow and change.\
  \ In short, these techniques help you shift from reactive troubleshooting to continuous,\
  \ data-driven improvement.\n\nTo truly optimize performance, you need more than\
  \ just a snapshot of system health; you need clear, timely signals that reveal when\
  \ and where degradation is occurring. A robust monitoring and observability strategy\
  \ provides these essential signals, making it possible to identify emerging issues\
  \ such as slow queries, resource constraints, replication lag, storage bottlenecks,\
  \ or connection problems. With this visibility, you gain the context and confidence\
  \ to diagnose, prioritize, and resolve issues before they escalate, turning what\
  \ would otherwise be reactive firefighting into a process of ongoing improvement\
  \ and resilience.\n\n## Core MongoDB metrics and signals\n\nUnderstanding the internal\
  \ state of your MongoDB deployment is crucial for maintaining optimal performance\
  \ and diagnosing issues. MongoDB exposes a comprehensive set of metrics that provide\
  \ insights into its health, resource utilization, and operational characteristics.\
  \ By monitoring and correlating these core signals, you can proactively identify\
  \ potential bottlenecks, make informed decisions about capacity planning, and ensure\
  \ that your database effectively supports your application workloads.\n\nThese metrics\
  \ generally fall into two categories: operational metrics, which give a real-time\
  \ view of the database’s current activity, and performance-specific metrics, which\
  \ delve deeper into workload behavior and potential areas of contention.\n\n###\
  \ Operational metrics\n\nOperational metrics answer the question How is my database\
  \ operating right now?. These are exposed by the serverStatus command and can be\
  \ collected via the shell, drivers, or external monitoring solutions such as Prometheus,\
  \ as discussed later in the Integration with external monitoring systems section.\n\
  \nThe following example demonstrates how to extract a few of the most important\
  \ operational metrics using the MongoDB Shell. This code retrieves the current server\
  \ status and prints a selection of key metrics that are essential for monitoring\
  \ real-time health and workload:\n\n```\n// Run from the MongoDB shell\n// Example:\
  \ Extract key operational metrics in the MongoDB shell\nconst status = db.serverStatus();\n\
  printjson({\n    opcounters:    status.opcounters,    // reads, writes, commands\n\
  \    memUsageMB:    status.mem.resident,  // resident memory in MB\n    cacheStats:\
  \    status.wiredTiger.cache,  // WiredTiger cache utilization\n    connections:\
  \   status.connections    // active vs available\n});\n```\n\nThe preceding code\
  \ reveals several of the most actionable metrics for day-to-day monitoring, but\
  \ it’s important to note that serverStatus exposes a much broader set of metrics\
  \ covering nearly every aspect of MongoDB’s operation. In the following list, we\
  \ highlight only some of the most relevant fields for practical, ongoing observability.\
  \ Here’s what each field represents, and where to find related metrics not shown\
  \ in the code:\n\n\n-   **opcounters (from status.opcounters in the code)**: 这些跟踪自服务器启动以来数据库操作（读取、写入、命令）的数量。监控这些有助于了解工作负载模式并发现可能指示查询风暴或应用程序问题的突然峰值。读取与写入之间的不平衡可能表明扩展或优化的机会。\n\
  -   **memUsageMB (from status.mem.resident in the code)**: 这显示 MongoDB 进程当前使用的物理\
  \ RAM（以兆字节为单位）的数量。关注此指标有助于确保您的工作集适合内存，从而最大限度地减少磁盘访问并保持性能。如需更深入的视图，serverStatus 中的\
  \ mem 部分还包括虚拟内存、映射内存和页面错误。\n-   **cacheStats (from status.wiredTiger.cache in the\
  \ code)**: 这提供了有关 WiredTiger 存储引擎内部缓存使用情况的详细信息，包括缓存了多少数据以及脏页（已修改）与干净页的比例。高缓存压力或频繁的驱逐可能表明需要更多内存或缓存调优。完整的\
  \ wiredTiger.cache 部分包含其他指标，例如驱逐率和最大缓存大小。\n-   **connections (from status.connections\
  \ in the code)**: 这报告活动客户端连接数和可用的连接槽数。监控此指标有助于防止连接饱和，从而导致应用程序错误或响应能力下降。connections\
  \ 部分还显示自启动以来创建的可用连接数和总数。\n-   **Replication metrics (not shown in the code)**: 对于使用副本集的部署，诸如复制延迟、oplog\
  \ 窗口、心跳时间以及选举指标等指标可在 serverStatus 的 repl1 和 oplog 部分中使用，或通过副本集特定命令（如 rs.status()\
  \ 和 rs.printReplicationInfo()）获取。这些对于确保数据持久性和故障转移就绪性至关重要。\n-   **Disk I/O metrics\
  \ (not shown in the code)**: 存储性能指标，例如队列深度、延迟、吞吐量和 IOPS，可在 serverStatus 的 wiredTiger\
  \ 和 metrics 部分中找到，或通过外部监控工具获取。这些对于识别存储瓶颈并确保磁盘子系统能够处理工作负载至关重要。\n\n通过定期收集和审查这些指标，您可以获得数据库运行状况的全面、实时视图，从而能够在问题升级之前检测到新出现的问题并优化性能。\n\
  \n## Performance-specific metrics\n\n虽然操作指标提供了数据库活动的总体概述，但性能特定指标更深入地探究减速和低效的来源。这些指标有助于精确定位瓶颈并回答关键问题：*性能问题究竟发生在何处？*。性能特定指标包括慢查询统计信息、查询执行统计信息和索引使用指标。\n\
  \n要捕获和审查慢操作，请使用 MongoDB 数据库分析器（通过 db.setProfilingLevel() 和 system.profile 集合），或\
  \ Atlas 中的 Query Insights。锁定和争用指标可通过 serverStatus 命令访问，并通过 Prometheus 和 Grafana\
  \ 等外部工具可视化。\n\n对于查询执行统计信息，例如检查的文档与返回的文档以及执行时间分解，请在 shell 或驱动程序中使用 explain() 方法、数据库分析器以及\
  \ Atlas Query Insights。对于编程监控，请从分析器输出或 system.profile 中提取相关字段。要了解索引使用情况和有效性，请利用\
  \ explain() 方法、collStats 命令、Atlas Performance Advisor 和 Query Insights 来识别使用模式和优化机会。\n\
  \n现在，请熟悉使这种可观测性成为可能的内置工具（MongoDB 数据库分析器、explain 计划、serverStatus 和 Atlas UI）以及外部集成（Prometheus、Grafana\
  \ 和 Datadog）。\n\n## Monitoring with MongoDB Atlas\n\nMongoDB Atlas 提供完全托管的基于云的数据库服务，实时展示关键数据库信号并引导您进行数据驱动的优化。在高性能数据库环境中，有效的监控不仅仅是收集指标；它是将这些指标转化为可操作的见解，帮助您保持集群的峰值性能。\n\
  \n## Atlas UI features\n\nAtlas UI 提供了用于监控和性能分析的强大功能套件。实时性能面板提供集群健康状况的实时可视化，包括资源消耗、操作速率和查询执行时间，非常适合即时监督。性能顾问会持续分析工作负载，建议索引以增强性能，而\
  \ Query Insights 通过对相似查询进行分组、监控延迟百分位数并识别 **hot** 集合来提供更高级别的视图。最后，Query Insights\
  \ 中的分析器集成通过为 MongoDB 数据库分析器提供用户友好的界面，简化了性能瓶颈的诊断。\n\n## Real-Time Performance Panel\
  \ (RTPP)\n\nMongoDB Atlas 提供集群健康状况和操作吞吐量的实时高层次可视化，每隔几秒更新一次。适用于 M10+ 集群，RTPP 特别适用于监控实时环境、负载测试和部署后性能验证。它使您能够在各种关键指标中直观识别峰值、瓶颈和趋势，帮助您实时将性能变化与资源利用率或操作负载相关联。\n\
  \nRTPP 提供两个主要视图，**Graph** 和 **Table**，每个视图都展示了一套全面的指标，包括以下内容：\n\n-   **Resource\
  \ Consumption**: CPU 使用率、系统内存和磁盘 **I/O operations per second** (**IOPS**)，以及网络流量（字节进/出）。这些指标可帮助您发现资源饱和或突然峰值，这些通常与性能下降相关。\n\
  -   **Operation Rates**: 每秒处理的读取、写入、命令和聚合操作的数量，提供工作负载强度和模式的洞察。\n-   **Query Execution\
  \ Times**: 当前读取、写入和命令操作的延迟统计信息，可让您快速识别减速。\n-   **Query Targeting**: 采样期间所有操作中扫描的文档与返回的文档之比，有助于评估索引效率和查询优化需求。\n\
  -   **Replication Lag**: 对于副本集，主节点与从节点之间的延迟，对数据一致性和故障转移就绪性至关重要。\n-   **Reads & Writes**:\
  \ 活动和排队的读写操作数量，如果队列增长，则表明可能存在瓶颈或资源争用。\n-   **Connections**: 当前客户端连接和网络吞吐量，有助于检测连接饱和。\n\
  -   **Hottest Collections**: 操作最多的集合，突出显示进一步调查的潜在热点（利用类似 mongotop 的统计信息）。\n-   **Slowest\
  \ Operations**: 当前运行最慢的操作，可以深入查看详细信息或终止有问题的查询。\n\n您可以暂停 Graph 视图以检查特定时间点的精确指标值，包括最慢操作和最热集合。RTPP\
  \ 默认启用，但具有项目所有者访问权限的用户可在项目设置中切换。RTPP 在负载测试、生产事故或部署后特别有价值，可快速将性能变化与资源利用率或操作负载相关联。\n\
  \n## Performance Advisor\n\nAtlas Performance Advisor 会持续分析集群的工作负载，特别查找低效的查询模式。它通过以下方式提供可操作的见解：\n\
  \n-   **Index suggestions**: 推荐可改善已识别慢查询性能的特定索引，通常提供估计的影响百分比。\n-   **Index management**:\
  \ 允许您直接通过 Atlas UI 查看、创建或删除建议的索引。它还突出显示可能未使用的索引，可以将其删除。\n\n将 Performance Advisor\
  \ 检查集成到开发工作流或 CI/CD 管道中，有助于您在查询性能问题进入生产环境之前主动识别和解决潜在问题。\n\n## Query Insights\n\n\
  Query Insights 通过命名空间级和操作级延迟统计信息提供改进的可观测性和细粒度遥测。\n\n### Namespace Insights\n\n使用\
  \ **Namespace Insights** 监控集合级查询延迟。Namespace Insights 页面显示两个图表和一个表格，其中包含每个顶部或固定命名空间的信息。信息包括某些主机和操作类型的指标和统计信息。您可以管理固定命名空间并选择最多五个命名空间以在相应的查询延迟图表中显示。这允许您使用百分位延迟（P50、P95\
  \ 和 P99）监控多个命名空间之间的性能差异，不仅揭示平均性能，还揭示用户经历的尾部延迟。高 P95 或 P99 延迟表明某些用户可能正在经历缓慢的响应。\n\
  \n审查这些信息可以帮助您识别热门集合，这些集合可以与其他工具结合使用，以提供工作负载分布的高层次视图。\n\n\n\n## Query Shapes and\
  \ Query Profiler\n\n在 Query Insights 中，Atlas 提供了用户友好的界面，用于展示已记录操作的洞察。操作会在超过 slowms\
  \ 阈值（默认为 100 毫秒）时记录到 mongos/mongod 日志中。\n\nQuery Shapes 选项卡按形状对这些操作进行分组，并允许您查看其性能指标。Query\
  \ Profiler 可帮助您查看更多细节，以更精确地诊断和解决性能瓶颈，具体如下：\n\n- **Slow query identification:** 检测持续超过\
  \ slowms 阈值的查询。这可能发生在集合扫描（在不使用索引的情况下读取整个集合）或未得到最优索引的操作上。如果您看到 planSummary 为 COLLSCAN\
  \ 的慢查询，请考虑创建合适的索引。\n- **Recent slow operations:** 列出超过您配置阈值的操作，以及执行时间、命名空间（数据库和集合）、扫描文档数与返回文档数等关键详情。如果执行时间较高且检查的文档数与返回的文档数之比升高，请优化查询或添加索引以减少不必要的扫描。\n\
  - **Execution statistics:** 深入查看单个慢操作以检查其执行计划、索引使用情况、读写延迟和响应大小。根据需要添加或调整索引。较大的响应大小可能表明需要使用投影来限制返回字段。\n\
  - **Filter and drill down:** 通过时间范围、操作类型或命名空间缩小分析器输出，以隔离特定问题。利用此功能将变慢情况与应用程序更改、部署事件或特定工作负载关联起来。\n\
  \n在实践中，请将 Query Insights 与 Performance Advisor 结合使用，以确认新索引或查询更改带来了预期的延迟改善。\n\n##\
  \ Alerts\n\nAtlas 会为数据库和服务器条件发出警报，这些条件已在您的警报设置中配置。当某个条件触发警报时，Atlas 会在集群上显示警告符号并发送警报通知。您的警报设置决定了通知方式。Atlas\
  \ 会在条件解决或您删除/禁用警报之前按固定间隔继续发送通知。\n\nAtlas 在组织和项目级别均提供多个预定义警报；不过您也可以创建自定义警报。让我们来看一些常见的警报类别以及如何解决其底层问题。\n\
  \n### Atlas Search issues\n\n当 Atlas Search 进程使用的 CPU 和内存达到指定阈值时，会触发 Atlas Search\
  \ 警报。如果搜索进程 mongot 内存耗尽，索引和查询将失败。\n\nAtlas Search 警报通常在您尝试构建大型或复杂的搜索索引时发生。这些索引在您解决内存问题之前会一直停留在\
  \ Initial Sync 阶段。\n\n如果搜索进程耗尽内存或磁盘空间，您可以升级集群以解决即时问题。您可以选择具有更多内存、存储和 IOPS 的集群层级，或考虑专用搜索节点以获得更高的可用性、性能和工作负载平衡。\n\
  \n### Connection issues\n\n连接警报通常在对 MongoDB 进程的允许最大连接数被超过时发生。一旦超过限制，在打开连接数降至限制以下之前将无法打开新连接。\n\
  \n连接警报通常是更大问题的症状。如果这些警报经常触发，适当的解决方案可能涉及以下内容：\n\n- 检查数据库应用程序中的有缺陷的连接代码。连接被打开但从未关闭的情况会导致旧连接堆积，最终超过连接限制。此外，您可能需要实现某种形式的连接池。\n\
  - 如果用户基数超出当前集群层级的能力，请升级到更大的 Atlas 集群层级，该层级允许更多连接。\n\n通过识别根本原因并加以解决，无论是在应用程序代码中还是集群配置中，您可以防止连接问题反复出现，确保数据库性能更加顺畅可靠。\n\
  \n### Query issues\n\n查询定位警报通常在没有索引支持查询或现有索引仅部分支持查询时发生。这些警报的示例如下：\n\n- **Query Targeting:\
  \ Scanned Objects / Returned:** 当采样期间所有操作在服务器范围内的平均扫描文档数相对于平均返回文档数超过定义阈值时触发警报。默认警报使用\
  \ 1000:1 阈值。理想情况下，扫描文档数与返回文档数之比应接近 1。高比率会负面影响查询性能。\n- **Query Targeting: Scanned\
  \ / Returned:** 如果为履行查询而检查的索引键数相对于实际返回文档数达到或超过用户定义阈值，则会发生此警报。此警报默认未启用。\n\n此问题的最常见来源是缺少索引，而\
  \ Performance Advisor 提供了最简单、最快速的调查方式。Performance Advisor 监控 MongoDB 认为缓慢的查询并推荐索引以改善性能。利用这些警报识别问题，结合\
  \ *Chapter 12, Advanced Query and Indexing Concepts* 中介绍的概念，可以更有效地排查和解决性能不佳的查询。\n\
  \n### Oplog issues\n\n在 *Chapter 5, Replication* 中，我们了解了 **operations log (oplog)**\
  \ 及其在确保写操作传播到所有副本集成员方面的作用。我们还了解到 oplog 是一个固定大小的 capped 集合（按磁盘大小或时间窗口大小）。\n\n如果在副本集的主节点上执行大量写操作，而从节点没有足够时间重放\
  \ oplog 中包含的所有操作，这通常会导致“掉落 oplog”，需要进行初始同步以恢复并确保所有节点的数据一致。\n\nAtlas 以以下形式提供与此场景相关的事件的监控和警报：\n\
  \n- **Replication Oplog Window is (X):** 如果主复制 oplog 中可用的近似时间达到或低于指定阈值，则会发生此情况。这指的是在当前\
  \ oplog 数据生成速率下，主节点可以继续记录的时间。\n- **Oplog Data Per Hour is (X):** 如果写入主节点复制 oplog\
  \ 的数据量每小时达到或超过指定阈值，则会发生此情况。\n\n这些警报最常见的触发因素是在短时间内进行密集的写和更新操作。当这种情况发生时，一些常见的缓解措施如下：\n\
  \n- 通过编辑集群配置增加 oplog 大小，确保其高于集群指标视图中 Oplog GB/Hour 图表的峰值。\n- 确保所有写操作都指定 write concern\
  \ 为 majority，以确保在进行下一步写操作之前，写操作已复制到至少一个节点。这通过防止主节点比从节点处理得更快地接受写操作来控制来自应用程序的流量速率。\n\
  \n为了从警报系统中获得最大价值，请定期审查和调整警报阈值以匹配您的工作负载和业务需求，这有助于避免警报疲劳和遗漏事件。将警报通知与团队首选的通信和事件管理工具集成，以确保快速响应。将警报视为可操作的信号：一旦触发，请立即调查根本原因，采取纠正措施（例如扩展资源、优化查询或调整阈值），并记录解决方案以供将来参考。\n\
  \n定期审计已配置的警报，以确保其随着应用程序和基础设施的演进仍然相关。最后，利用警报历史和趋势来指导容量规划，识别反复出现的问题，并推动监控策略的持续改进。\n\
  \n有关可用警报条件的完整列表，请参阅 MongoDB Atlas 文档 https://www.mongodb.com/docs/atlas/reference/alert-conditions/。\n\
  \n## Self-managed monitoring tools\n\n在 Atlas 管理环境之外运行 MongoDB 时，您需要自行组建可观测性管道。幸运的是，MongoDB\
  \ 提供了多套内置命令行实用程序和数据库命令，旨在深入了解服务器的实时活动和历史性能。掌握这些工具对于诊断问题、了解工作负载特征以及确保自托管部署的健康状况至关重要。\n\
  \n### mongostat: real-time activity snapshot\n\n可以将 mongostat 视为一个 MongoDB 专用的监控实用程序，它提供正在运行的\
  \ mongod 或 mongos 实例状态的动态实时视图。通过定期采样服务器状态（默认每秒一次），它以简洁的表格格式呈现关键指标，让您能够快速评估当前运营负载和资源利用情况。\n\
  \n\n\n运行 mongostat 时，可以像这样连接到 MongoDB 实例：\n\n// Run from the System Command Line\n\
  mongostat --host localhost:27017 --rowcount 2\n```\n\n你将看到类似以下、每秒更新的输出：\n\n```\n\
  insert query update delete getmore command dirty used flushes vsize res\n    0 \
  \    8      0      0       0      3|0   3.4% 7.4%      0 1.2G   512M\n    1    12\
  \      0      0       0      5|0   3.7% 2.5%      0 1.2G   210M\n```\n\n关键字段包括以下内容：\n\
  \n- **操作计数器：** 显示每秒的操作数量，指示工作负载的形状和强度（insert、query、update 和 delete）。\n- **内存：**\
  \ 显示内存使用详情，包括映射内存、虚拟大小和常驻内存。显著变化或较高的常驻内存可能表明内存压力（mapped、vsize 和 res）。\n- **命令：**\
  \ 显示每秒执行的命令数（command）。\n\n对于副本集，你可以使用 --discover 选项自动跟踪所有成员及其状态：\n\n```\nmongostat\
  \ --discover\n```\n\n使用 mongostat 进行快速健康检查，以观察应用程序更改的即时影响，或在性能事件期间获得数据库活动的概览。\n\n\
  ## mongotop：集合级读写时序\n\n虽然 mongostat 提供服务器范围的概览，但 mongotop 专门针对每个集合的读写操作所花费的时间。这对于识别活动最繁重的集合或可能导致\
  \ I/O 瓶颈的集合非常宝贵。\n\n与 mongostat 类似，你将 mongotop 连接到正在运行的实例：\n\n// Run from the System\
  \ Command Line\nmongotop --host localhost:27017 --rowcount 2\n```\n\n输出如下所示：\n\n\
  ```\nns              total   read    write   2025-04-30T16:30:27-04:00\nmydb.users\
  \      0.1ms   0.1ms   0.0ms\nmydb.orders     5.2ms   2.8ms   2.4ms\n```\n\n各列显示如下内容：\n\
  \n- `ns`：正在监控的命名空间（`<database>.<collection>`）\n- `total`：在该间隔期间服务器对该集合执行操作所花费的总时间\n\
  - `read`：用于读操作的时间\n- `write`：用于写操作的时间\n\n使用 mongotop 精确定位热点集合，这些集合可能通过模式优化、索引改进或在活动持续较高并影响整体性能时进行分片而受益。例如，在前面的输出中，你可以看到\
  \ `mydb.orders` 集合的读写活动明显高于 `mydb.users`，这可能需要进一步调查。\n\n## serverStatus：通过 Shell\
  \ 获取全面指标\n\n对于 MongoDB 服务器状态最详细的快照，`serverStatus` 命令是权威来源。它返回一个包含数百个指标的大型 JSON 文档，涵盖服务器操作的几乎每个方面：\n\
  \n// Run from the MongoDB shell\ndb.adminCommand({ serverStatus: 1 })\n\n// Or using\
  \ the shell helper\ndb.serverStatus()\n```\n\n虽然输出过于庞大无法在此完全详述，但重要部分包括以下内容：\n\n\
  - `opcounters`：服务器启动以来所有数据库操作的详细计数\n- `connections`：有关当前、可用和排队的客户端连接的信息\n- `locks`：有关锁竞争的信息（数据库、集合或全局）\n\
  - `wiredTiger`：WiredTiger 存储引擎特定的深度指标，包括以下内容：\n  - 缓存使用情况（读入缓存的页面、从缓存写入的页面、脏字节）\n\
  \  - 事务检查点\n  - 块管理器统计信息\n- `mem`：常驻和虚拟内存统计信息\n- `metrics`：各种运营指标，例如文档插入/更新/删除速率、查询执行程序统计信息和复制详情\n\
  \n由于数据量庞大，serverStatus 不太适合实时监控，但对于深入分析、建立性能基线以及程序化监控至关重要，在程序化监控中，外部系统会提取特定指标并随时间跟踪。\n\
  \n## 数据库分析器：深入分析慢操作\n\n当你需要了解单个查询的性能特征时，数据库分析器是首选工具。它捕获特定数据库的数据库操作详细信息，可帮助你识别可能影响应用程序性能的慢速或低效查询。\n\
  \n开始使用时，你可以使用 MongoDB Shell 中的 setProfilingLevel() 方法为特定 mongod 实例启用分析器。该方法提供三种分析级别，各自适用于不同的需求：\n\
  \n- **级别 0（关闭）**：分析器默认处于禁用状态，不收集任何数据\n- **级别 1（慢操作）**：仅捕获超过指定阈值（slowms，默认 100 ms）的操作数据\n\
  - **级别 2（所有操作）**：捕获所有操作的数据（由于性能开销，在生产环境中使用时请谨慎）\n\n此外，你可以配置 slowms，即慢操作阈值。任何完成时间快于此阈值的用户操作都不会记录到\
  \ mongod 日志中。还可以设置 sampleRate，以控制应记录的慢操作比例。\n\n以下命令在 MongoDB Shell 中运行，将为当前数据库启用数据库分析器，慢操作阈值为\
  \ 20 毫秒，采样率为 42%：\n\n```\ndb.setProfilingLevel(1, { slowms: 20, sampleRate: 0.42\
  \ })\n```\n\n启用后，你可以查询分析器数据以分析最近的操作。例如，此命令查找并显示最近的五个分析操作：\n\n// Run from the MongoDB\
  \ shell\n// Find the 5 most recent profiled operations\ndb.system.profile.find().sort({\
  \ ts: -1 }).limit(5).forEach(printjson)\n```\n\n已分析的操作存储在为其启用了分析的每个数据库中的 system.profile\
  \ capped 集合中。该集合中的每个文档都包含以下等详细信息：\n\n- millis：操作持续时间（毫秒）\n- ns：目标命名空间（database.collection）\n\
  - command：与操作关联的完整命令文档\n- execStats：查询操作的详细执行统计信息（类似于 explain 操作的输出）\n\n以下是慢查询的分析器条目示例。由于我们在连接到集群时应用程序的连接字符串中指定了\
  \ appName 值，因此操作旁边会显示应用程序名称：\n\n```\n{\n  \"op\": \"query\",\n  \"ns\": \"mydb.orders\"\
  ,\n  \"command\": {\n    \"find\": \"orders\",\n    \"filter\": { \"status\": \"\
  shipped\", \"orderDate\": { \"$gt\": ISODate(\"2025-01-01\") } },\n    \"sort\"\
  : { \"customerName\": 1 },\n    \"limit\": 100\n  },\n  \"keysExamined\": 0,\n \
  \ \"docsExamined\": 1000000,\n  \"nreturned\": 53,\n  \"responseLength\": 24601,\n\
  \  \"millis\": 2543,\n  \"planSummary\": \"COLLSCAN\",\n  \"execStats\": {\n   \
  \ // Detailed execution statistics\n  },\n  \"client\": \"192.168.1.50\",\n  \"\
  user\": \"appuser\",\n  \"appName\" : \"my-custom-microservice-01\"\n}\n```\n\n\
  在此名为 my-custom-microservice-01 的应用程序示例中，我们可以立即识别出几个问题。操作耗时 2.5 秒（\"millis\": 2543），它执行了集合扫描（\"\
  planSummary\": \"COLLSCAN\"），并且检查了 1000000 个文档（docsExamined）才返回 53 个文档（nreturned）。\n\
  \n这些分析器详情显示查询是在扫描整个集合而不是使用索引，这非常低效，尤其是在对 \"status\" 和 \"orderDate\" 进行过滤的情况下。该模式清楚地表明这些字段上没有合适的索引。为了提高性能，你应该按该顺序在\
  \ \"status\"、\"customerName\" 和 \"orderDate\" 上创建复合索引，从而使 MongoDB 能够在不扫描整个集合的情况下高效定位匹配文档。\n\
  \n## 生产环境中 MongoDB 分析器的最佳实践\n\n在生产环境中以级别 2（分析所有操作）启用 MongoDB 数据库分析器可能会引入显著的性能开销。在大多数生产场景中，最佳做法是使用级别\
  \ 1 分析、设置 sampleRate，或仅在故障排除期间的短暂、有针对性的时间内启用完整分析。调整实时环境中的分析器设置时，始终监控系统影响。\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_344_0.png)\n\
  \n使用分析器数据精确定位低效查询、检测缺失索引并指导模式改进。通过分析慢操作的模式，你可以进行有针对性的优化，显著提高应用程序性能。\n\n## 与外部监控系统的集成\n\
  \n虽然 MongoDB 提供了强大的内置工具，如 mongostat、mongotop 和 serverStatus 命令，并且 MongoDB Atlas\
  \ 提供全面的托管监控套件，但现代应用程序环境很少孤立运行。为了实现真正的端到端可观测性，将 MongoDB 的性能信号集成到更广泛的外部监控和可观测性平台中至关重要。\n\
  \n此集成使你能够执行以下操作：\n\n- 将数据库行为与应用程序性能和基础设施健康状况相关联\n- 创建涵盖整个技术栈的统一仪表板\n- 在所有组件中实施一致的告警\n\
  - 获得性能分析的历史背景\n- 支持跨系统边界的根本原因分析\n\n本质上，通过将 MongoDB 的性能数据输入到组织更广泛的可观测性工具中，你可以获得更全面的视图，更轻松地将数据库性能与整体应用程序健康状况联系起来，集中管理告警，并在整个技术栈中进行全面的根本原因分析。\n\
  \n\n\n## Prometheus + Grafana\n\nPrometheus 和 Grafana 共同构成了一个流行的开源监控解决方案。Prometheus\
  \ 收集并存储指标，而 Grafana 通过可定制的仪表板对其进行可视化。MongoDB Atlas 提供了与该技术栈的原生集成，使您能够将 MongoDB 部署与其他基础设施组件一起监控。\n\
  \n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_345_0.png)\n\n> **注意**\n> \n> Prometheus\
  \ 集成仅在 M10 及以上集群上可用。\n\n## Atlas integration for Prometheus\n\nMongoDB Atlas 提供了与\
  \ Prometheus 的直接集成，无需第三方导出器。以下是设置方法：\n\n- **配置身份验证：** 在 Atlas UI 中，导航至 **Integrations**\
  \ 选项卡并设置专门用于指标收集的 Prometheus 凭据。\n- **选择发现方法：** 根据您的基础设施和偏好，选择 **HTTP Service Discovery**（推荐）或\
  \ **File Service Discovery**。\n- **更新 Prometheus 配置：** 在您的 Prometheus 服务器中添加适当的抓取配置。\n\
  \n综上所述，将 MongoDB Atlas 与 Prometheus 集成涉及三个关键步骤：\n\n- 1. 在 Atlas UI 中配置身份验证凭据。\n\
  - 2. 选择服务发现方法（HTTP 或基于文件）。\n- 3. 更新 Prometheus 服务器的配置以包含必要的抓取设置。\n\n以下是 prometheus.yml\
  \ 文件中抓取配置可能的样子示例：\n\n```yaml\nscrape_configs:\n  - job_name: \"<insert-job-name>\"\
  \n    scrape_interval: 10s\n    metrics_path: /metrics\n    scheme: https\n    basic_auth:\n\
  \      username: <prometheus-username>\n      password: <prometheus-password>\n\
  \    http_sd_configs:\n      - url: <url-of-the-service-discovery-configuration>\n\
  \        refresh_interval: 60s\n        basic_auth:\n          username: <prometheus-username>\n\
  \          password: <prometheus-password>\n```\n\n配置完成后，Prometheus 将自动发现并抓取所有 Atlas\
  \ 集群的各种指标。这些指标包括操作速率（如查询、插入、更新和删除）、资源利用率（如 CPU、内存和连接数）、复制指标（包括延迟和 oplog 窗口）以及存储指标（如磁盘使用量和\
  \ IOPS）。\n\n## Visualizing with Grafana\n\n为了完善您的监控解决方案并深入了解部署的性能，您可以将预构建的 MongoDB\
  \ 仪表板导入 Grafana：\n\n- 1. 在 Grafana 中，导航至导入屏幕（点击 + 图标，然后选择导入）。\n- 2. 上传示例仪表板 JSON\
  \ 文件（例如 `mongo-metrics.json` 或 `hardware-metrics.json`）。这些通常可以在 Atlas UI 或官方文档中找到。\n\
  - 3. 确保导入的仪表板配置为使用您的 Prometheus 数据源。\n- 4. 使用这些专用可视化开始监控您的 MongoDB 部署。\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_346_0.png)\n\
  \n图 14.1：Grafana 中的示例 MongoDB 指标仪表板\n\n有关详细的分步说明以及访问示例仪表板 JSON 文件，请参阅 https://www.mongodb.com/docs/atlas/tutorial/prometheus-integration/#import-a-sample-grafana-dashboard\
  \ 处的官方 MongoDB Atlas 文档。\n\n此集成适用于 MongoDB Atlas 以及 Cloud Manager 和 Ops Manager\
  \ 部署，无论您的 MongoDB 基础设施是完全托管还是自托管，都能提供一致的监控能力。\n\n## Datadog\n\nDatadog 是一个全面的商业\
  \ SaaS 可观测性平台，提供基础设施监控、SAPM、日志管理等功能。MongoDB Atlas 提供了与 Datadog 的一流集成，可实现对数据库部署的无缝监控。\n\
  \nMongoDB Atlas 与 Datadog 的集成允许您直接在 Datadog 仪表板中监控 Atlas 集群，提供数据库性能与其他应用程序和基础设施指标的统一视图。\n\
  \n此集成的关键功能包括以下内容：\n\n- **原生集成：** 只需在 Atlas UI 中点击几下即可配置 Atlas 与 Datadog 之间的连接\n\
  - **自动指标收集：** 连接后，Atlas 会自动将性能指标发送到您的 Datadog 账户\n- **预构建仪表板：** 集成包含显示关键 MongoDB\
  \ 性能指标的预配置仪表板\n- **统一告警：** 在 Datadog 中基于 Atlas 指标创建告警，并与您现有的通知工作流集成\n- **跨平台关联：**\
  \ 轻松将数据库性能问题与应用程序和基础设施指标关联起来\n\n> **注意**\n> \n> Datadog 集成仅在 M10 及以上集群上可用。您需要一个\
  \ Datadog 账户和 API 密钥。\n\n要设置集成，请按照以下步骤操作：\n\n- 1. 确保您在 Atlas 中拥有 *Project Owner*\
  \ 访问权限。\n- 2. 在 Atlas 中，导航至您的项目，然后点击 **Integrations**。\n- 3. 点击 **Datadog** 块。\n\
  - 4. 输入您的 Datadog API 密钥。您可以在 Datadog 账户的 **Integrations > APIs** 下找到或创建它。\n- 5.\
  \ 配置您希望 Datadog 监控的集群和特定指标。\n- 6. 可选地，要跟踪高基数指标，请启用 `sendDatabaseMetrics` 和 `sendCollectionLatencyMetrics`。这可以通过\
  \ Atlas UI 或 Atlas Administration API 完成。\n- 7. 配置完成后，您可以在 Datadog 中访问您的 MongoDB\
  \ Atlas 仪表板和指标。\n\n有关更详细的步骤和信息，请参阅 https://www.mongodb.com/docs/atlas/tutorial/datadog-integration/#procedure\
  \ 处的官方 MongoDB Atlas Datadog 集成文档。\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_348_0.png)\n\
  \n> **Atlas 项目指标自动发送到 Datadog**\n> \n> 如果您配置 Atlas 项目将警报和事件发送到 Datadog，则无需单独执行此流程。Atlas\
  \ 通过用于警报和事件的同一集成将项目指标发送到 Datadog。\n\n集成完成后，您可以开始探索 Datadog 中的预构建仪表板，以了解 Atlas 集群的性能概况。考虑为关键指标（如\
  \ CPU 利用率、磁盘空间和复制延迟）设置警报，以便在出现潜在问题时收到通知。您还可以开始将 MongoDB 指标与应用程序和基础设施数据关联，以获得系统的整体视图。我们将在后续章节中更深入地探讨性能监控策略和告警最佳实践。\n\
  \n## Application performance monitoring platforms\n\n**New Relic**、**AppDynamics**\
  \ 和 **Dynatrace** 等平台专注于 **application performance monitoring (APM)**。它们的主要优势在于端到端跟踪应用程序请求，提供应用程序代码如何与数据库交互的深入可见性。\n\
  \nAPM 代理通常通过特定语言的库集成到您的应用程序代码中。当您的应用程序进行数据库调用时，APM 代理会执行以下操作：\n\n- 1. 拦截调用\n- 2.\
  \ 测量其持续时间\n- 3. 捕获相关上下文（如查询本身，通常为规范化）\n- 4. 将其与更广泛的请求上下文关联\n\n此集成使 APM 平台能够执行以下操作：\n\
  \n- 从用户的浏览器或 API 客户端跟踪单个请求，经过多个服务直至特定的数据库查询\n- 在完整用户事务的上下文中识别缓慢的数据库调用\n- 将应用程序错误或延迟峰值与特定的数据库操作关联\n\
  - 提供聚合视图，显示数据库性能如何影响整体应用程序性能\n\n总之，APM 平台提供了一个强大的视角来理解数据库交互如何融入应用程序行为的更大图景，使更易于确定影响最终用户体验的与数据库相关的瓶颈。\n\
  \n## OpenTelemetry\n\nOpenTelemetry 是一个开源可观测性框架，提供厂商中立的 API、库和 instrumentation 来捕获分布式追踪、指标和日志。它代表了可观测性\
  \ instrumentation 的未来，并在行业中得到日益广泛的采用。\n\nOpenTelemetry 为流行的编程语言和 MongoDB 驱动程序提供\
  \ instrumentation 库。通过将这些库纳入您的应用程序，MongoDB 驱动程序调用会自动作为分布式追踪中的“span”被捕获。每个 span 记录以下内容：\n\
  \n- 数据库操作的持续时间\n- 操作类型（查询、更新、插入等）\n- 目标集合或数据库\n- 发生的任何错误\n\n这些 spans 提供了每次数据库交互的详细记录，捕获执行了什么操作、花费了多长时间、在何处执行以及是否成功。这些细粒度数据对于理解数据库性能和诊断问题至关重要。\n\
  \n\n\n对于 Node.js 应用，实现 MongoDB 的 OpenTelemetry 插桩可能如下所示：\n\n```js\n// tracing.js\n\
  const opentelemetry = require('@opentelemetry/api');\nconst { NodeTracerProvider\
  \ } = require('@opentelemetry/sdk-trace-node');\nconst { MongoDBInstrumentation\
  \ } = require('@opentelemetry/instrumentation-mongodb');\nconst { registerInstrumentations\
  \ } = require('@opentelemetry/instrumentation');\n\n// Configure the tracer provider\n\
  const provider = new NodeTracerProvider();\nprovider.register();\n\n// Register\
  \ MongoDB instrumentation\nregisterInstrumentations({\n  instrumentations: [new\
  \ MongoDBInstrumentation()],\n});\n\n// Export traces using your preferred exporter\n\
  // (OTLP, Jaeger, Zipkin, etc.)\n```\n\n在此插桩就位后，MongoDB 操作会被自动捕获，并可发送到任何 OpenTelemetry\
  \ 兼容的后端。\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_350_0.png)\n\nFigure 14.2:\
  \ OpenTelemetry 捕获的 MongoDB 操作 span 可视化\n\n上述截图来自可在 https://github.com/open-telemetry/opentelemetry-js-contrib/tree/main/examples/mongodb\
  \ 获取的 OpenTelemetry MongoDB 插桩示例。\n\n此插桩为每个 MongoDB 操作创建详细的 span，捕获操作类型、数据库和集合名称以及执行时间等关键信息，从而实现整个应用栈的精确性能监控和故障排查。\n\
  \n## 外部工具的注意事项\n\n将 MongoDB 与外部监控系统集成时，应考虑多个重要因素以确保监控有效且安全。对 MongoDB 实例的访问以及流向监控系统的数据进行保护至关重要。这涉及实施强大的身份验证机制、传输中数据加密，并遵循监控用户的最小权限原则。仔细关注这些安全方面有助于保护您的数据并维护监控设置的完整性。\n\
  \n关键安全实践包括以下内容：\n\n- **专用监控用户**：为监控工具专门创建 MongoDB 用户，并授予最低所需权限（通常为 clusterMonitor\
  \ 角色）\n- **强身份验证**：使用强密码，并在支持的情况下考虑基于证书的身份验证\n- **TLS/SSL**：加密监控工具与 MongoDB 之间的通信\n\
  - **网络安全**：通过适当的防火墙规则限制监控工具对 MongoDB 的访问\n\n除安全之外，集成外部监控工具的另一个关键方面是管理其资源消耗。监控系统本质上会与您的\
  \ MongoDB 部署交互以收集数据。如果配置不当，这种交互会给数据库服务器带来额外负载，可能影响其性能。因此，必须注意这些工具的资源消耗方式，以确保监控行为不会降低您试图观察的系统性能。\n\
  \n管理资源消耗的关键考虑因素包括以下内容：\n\n- **抓取/轮询频率**：配置适当的指标收集间隔（通常为 10–60 秒），以在及时获取数据和最小化开销之间取得平衡\n\
  - **资源开销**：监控监控代理本身的资源消耗，以确保它们不会影响 MongoDB 性能\n- **负载大小：** 注意收集的数据量，尤其是来自返回大型文档的命令（如\
  \ serverStatus）\n- **在预发布环境中基准测试：** 在部署到生产环境之前，先在非生产环境中测试监控配置\n\n总之，将外部监控工具与 MongoDB\
  \ 集成需要平衡的方法，同时优先考虑安全性和性能。通过保护访问并仔细管理资源使用，您可以确保可靠的监控，而不会损害部署的稳定性和完整性。\n\n## 常见性能模式及需要监控的内容\n\
  \n了解 MongoDB 中常见的性能瓶颈以及哪些指标会发出信号，对于主动性能管理至关重要。通过监控关键指标，您可以在问题对应用程序响应能力和可靠性造成重大影响之前检测和诊断问题。本节探讨了反复出现的性能挑战和需要跟踪的基本信号。\n\
  \n### 磁盘 I/O 瓶颈\n\n存储子系统经常是数据库性能的限制因素，尤其是在重读或写负载下。当磁盘无法跟上 MongoDB 的需求时，操作会变慢，因为它们等待数据从磁盘读取或写入磁盘。\n\
  \n为了识别和诊断磁盘 I/O 瓶颈，监控几个关键指标至关重要：\n\n- **磁盘延迟：** 测量磁盘级别读写操作完成所需的时间。持续较高的延迟（通常高于几毫秒，具体取决于存储介质）是\
  \ I/O 瓶颈的主要指标。这通常通过操作系统级工具或云提供商指标进行监控，Atlas 在其指标视图中展示磁盘延迟。\n- **I/O 队列深度：** 跟踪等待磁盘处理的挂起\
  \ I/O 操作数量。持续较高的队列深度表示存储系统已饱和。\n- **磁盘吞吐量（字节/秒）和 IOPS：** 监控实际数据传输速率和每秒 I/O 操作数。将这些指标与存储硬件的预配限制进行比较。达到这些限制可确认\
  \ I/O 瓶颈。\n\n解决磁盘 I/O 瓶颈可能涉及优化查询以减少磁盘访问、改进索引、增加预配的 IOPS/吞吐量、升级存储硬件，或确保工作集适合内存以最大限度减少磁盘读取。\n\
  \n### 缓存压力（WiredTiger 缓存利用率）\n\nMongoDB 的 WiredTiger 存储引擎使用内部缓存将频繁访问的数据和索引保留在内存中，以最大限度减少对较慢磁盘访问的需求。当活动工作集（当前工作负载所需的数据和索引）超过配置的\
  \ WiredTiger 缓存大小时，就会发生缓存压力。这会导致缓存驱逐活动增加和页面错误，从而降低性能。\n\n若干关键指标可以帮助您检测和诊断 MongoDB\
  \ 中 WiredTiger 缓存压力。监控这些指标可提供由内存限制引起的性能瓶颈的早期预警信号：\n\n- **缓存利用率：** 跟踪当前使用的 WiredTiger\
  \ 缓存量（serverStatus().wiredTiger.cache[\"bytes currently in the cache\"]）。虽然高利用率通常是好的，但持续达到最大限制表明存在压力。\n\
  - **缓存驱逐率：** 监控页面从缓存中被驱逐以腾出空间供新数据的速率（serverStatus().wiredTiger.cache[\"unmodified\
  \ pages evicted\"]）。高或快速增加的驱逐率表明缓存频繁抖动。Atlas 通常可视化缓存活动，突出显示驱逐情况。\n- **读入缓存的页面：**\
  \ 跟踪数据从磁盘读入缓存的速率（serverStatus().wiredTiger.cache[\"pages read into cache\"]）。高速率通常与高驱逐率相关，表明所需数据经常不在内存中找到。\n\
  - **页面错误：** 虽然并非完全与 WiredTiger 缓存相关（也可能发生操作系统页面错误），但频繁的页面错误（serverStatus().extra_info.page_faults\
  \ 或操作系统指标）通常伴随缓存压力，表明 MongoDB 进程请求的数据当前不在物理 RAM 中。\n\n监控这些指标可清晰了解缓存健康状况。高利用率本身并不坏，但当与高驱逐率、从磁盘读取页面增加以及页面错误相结合时，则表明缓存难以跟上工作负载，迫使频繁从较慢的磁盘存储中读取。\n\
  \n\n\nThe following db.serverStatus() command can be used in the MongoDB Shell to\
  \ retrieve some of these key cache metrics:\n\n```\n// Run from the MongoDB shell\n\
  // Check WiredTiger cache usage and eviction metrics\nconst wtCache = db.serverStatus().wiredTiger.cache;\n\
  const bytesInCache = wtCache[\"bytes currently in the cache\"];\nconst maxBytes\
  \ = wtCache[\"maximum bytes configured\"];\nconst evictedPages = wtCache[\"unmodified\
  \ pages evicted\"];\n\nprint(`Cache utilization: ${(bytesInCache/maxBytes*100).toFixed(2)}%`);\n\
  print(`Evicted pages: ${evictedPages}`);\n```\n\nResolving cache saturation typically\
  \ involves increasing the available RAM and the configured WiredTiger cache size,\
  \ optimizing queries and indexes to reduce the working set size, or scaling the\
  \ cluster horizontally.\n\n## Replication lag and oplog window drift\n\nReplication\
  \ lag is a common metric you may want to monitor, as excessive lag can impact read\
  \ consistency (if reading from secondaries), increase failover time, and put data\
  \ durability at risk.\n\nReplica set health can be tracked by monitoring the following\
  \ key metrics:\n\n- **Replication lag**: Monitor the lag in seconds for each secondary\
  \ node. This is an important metric available in the rs.status() output and prominently\
  \ displayed in the Atlas UI. Alerts should be configured for lag exceeding acceptable\
  \ thresholds.\n- **Oplog window**: Track the estimated time window covered by the\
  \ oplog (rs.printReplicationInfo() or Atlas metrics). A shrinking oplog window increases\
  \ the risk of secondaries needing to resync if they fall behind.\n- **Oplog rate\
  \ (GB/hour)**: Monitor the rate at which the oplog is being generated on the primary.\
  \ High rates can contribute to replication lag if secondaries cannot apply writes\
  \ fast enough or if the network bandwidth is insufficient. Atlas provides metrics\
  \ for oplog throughput.\n\nCollectively, these metrics provide a comprehensive view\
  \ of replication health. Monitoring lag ensures data consistency and readiness for\
  \ failover, tracking the oplog window helps prevent costly full resynchronizations\
  \ of secondaries, and observing the oplog generation rate can highlight whether\
  \ the primary’s write load is outpacing the replication capacity.\n\nYou can use\
  \ the following commands in the MongoDB Shell to retrieve the current replication\
  \ status and oplog information:\n\n```\n// Run from the MongoDB shell\n// Check\
  \ replication lag on all secondary nodes\nconst rsStatus = rs.status();\nconst primary\
  \ = rsStatus.members.find(m => m.state === 1);\nrsStatus.members.forEach(member\
  \ => {\n    if (member.state === 2) { // secondary\n        const lagSeconds = Math.abs((primary.optimeDate.getTime()\
  \ - member.optimeDate.getTime()) / 1000);\n        print(`Secondary ${member.name}\
  \ lag: ${lagSeconds.toFixed(2)}s`);\n    }\n});\n\n// Check oplog window size\n\
  const oplogInfo = db.getReplicationInfo();\nprint(`Oplog window: ${oplogInfo.timeDiff\
  \ / 3600}h`);\n```\n\nThis script utilizes several key commands and concepts. rs.status()\
  \ fetches a detailed document for each replica set member, including state and optimeDate\
  \ (the timestamp of the last applied operation). The script then compares the optimeDate\
  \ value of the primary with that of each secondary to calculate replication lag\
  \ in seconds. db.getReplicationInfo() is used to retrieve information about oplog,\
  \ specifically timeDiff, which indicates the oplog window duration. Finally, the\
  \ script prints the calculated lag for each secondary and the oplog window in hours,\
  \ providing a clear snapshot of replication health.\n\nExecuting this script might\
  \ produce output similar to the following:\n\n```\nSecondary mongo-secondary-0.example.com:27017\
  \ lag: 2.35s\nSecondary mongo-secondary-1.example.com:27017 lag: 1.80s\nOplog window:\
  \ 48.25h\n```\n\nThis output allows administrators to quickly assess whether secondaries\
  \ are keeping up with the primary and whether the oplog window is sufficient for\
  \ the operational needs.\n\nCauses of replication lag include high write volume\
  \ on the primary, insufficient resources (CPU, RAM, or I/O) on secondaries, network\
  \ latency between nodes, or long-running operations on secondaries blocking replication.\n\
  \n## Summary\n\nEffective MongoDB monitoring and observability transform raw data\
  \ into actionable insights that keep your deployments healthy, performant, and reliable.\
  \ Throughout this chapter, we’ve explored the critical distinction between monitoring\
  \ (tracking known metrics to see whether something is wrong) and observability (leveraging\
  \ metrics, logs, and traces to understand why something is happening).\n\nWe’ve\
  \ examined an array of tools available from the comprehensive suite offered by MongoDB\
  \ Atlas, which includes the Real-Time Performance Panel, metrics explorers, and\
  \ the Performance Advisor for automatic optimization recommendations, to self-managed\
  \ tools such as mongostat, mongotop, and the database profiler for deep insights\
  \ into self-hosted deployments. Furthermore, external systems such as Prometheus+Grafana,\
  \ Datadog, and APM platforms extend these capabilities, allowing for unified observability\
  \ across your entire technology stack.\n\nBy implementing a robust observability\
  \ pipeline and combining real-time dashboards, tiered alerts, detailed logs, query\
  \ execution plans, and distributed traces, you can detect emerging issues before\
  \ they impact users, diagnose root causes efficiently, and make data-driven decisions\
  \ for performance optimization.\n\nRemember that the most successful teams don’t\
  \ just collect data; they establish a culture where observability drives ongoing\
  \ optimization. With the principles and practices outlined in this chapter, you’ll\
  \ be well positioned to maintain optimal MongoDB performance, even as your applications\
  \ scale and evolve.\n\nHaving established a strong foundation in monitoring and\
  \ observing your MongoDB environment, the upcoming chapter will shift focus to another\
  \ critical aspect of database performance: how to proactively optimize and fine-tune\
  \ your MongoDB deployment to prevent issues before they arise.\n"
- "# 15 Debugging Performance Issues\n\n## Debugging Performance Issues\n\nPerformance\
  \ issues in databases can challenge even the most experienced developers and database\
  \ administrators. These issues often surface unexpectedly, causing application slowdowns,\
  \ user complaints, and sometimes even outages. The late MongoDB expert William Zola\
  \ identified three fundamental reasons for slow MongoDB performance: **inherently\
  \ slow operations** that consume significant resources by nature; **blocked operations**,\
  \ where processes are waiting for other slow operations to complete; and **insufficient\
  \ or poorly tuned hardware resources** that lack the capacity to handle the workload.\n\
  \nAlthough MongoDB has evolved significantly since Zola first articulated these\
  \ principles, they remain remarkably relevant. Most performance problems can still\
  \ be traced back to one of these three root causes, with poor schema design often\
  \ lurking as an underlying factor.\n\nThis chapter provides a structured approach\
  \ to identifying, understanding, and resolving MongoDB performance issues. We’ll\
  \ explore real-world examples that illustrate common problems and their solutions,\
  \ building on techniques covered in earlier chapters. By the end of this chapter,\
  \ you’ll be equipped with a systematic methodology for approaching performance issues\
  \ in your own MongoDB deployments.\n\nThrough practical case studies, in this chapter,\
  \ you’ll learn how to do the following:\n\n- Identify the symptoms of different\
  \ types of performance problems\n- Diagnose the root causes using MongoDB’s monitoring\
  \ tools\n- Implement targeted solutions to resolve the issues\n- Prevent similar\
  \ problems from occurring in the future\n\n## Identifying inherently slow operations\n\
  \nInherently slow operations are those that require MongoDB to do significant work,\
  \ often involving reading large amounts of data or performing complex calculations.\
  \ These operations become particularly problematic as data volumes grow.\n\nThe\
  \ most common inherently slow operations include the following:\n\n- Collection\
  \ scans (queries without indexes)\n- Queries that examine many more documents than\
  \ they return\n- Complex aggregation pipelines\n- Queries that return large result\
  \ sets\n- Operations that cause index builds on large collections\n\nWhen these\
  \ operations occur frequently, they can consume substantial system resources and\
  \ slow down overall database performance.\n\n## Case study: Troubleshooting cluster\
  \ performance with Atlas\n\nMongoDB Atlas, our platform for database management,\
  \ relies on internal clusters to monitor and manage customer deployments. Among\
  \ these, one key cluster is responsible for gathering server and configuration data\
  \ from all Atlas deployments. This data is vital for understanding the health, performance,\
  \ and operational status of customer databases, helping us proactively identify\
  \ and fix issues.\n\nHowever, as Atlas scaled rapidly, this central data collection\
  \ cluster began to show signs of strain. From monitoring, we noticed the following:\n\
  \n- Normalized system CPU on shard 0 rose from a steady 45–55% to around 70%\n-\
  \ Query targeting ratios began to increase\n- Latency also climbed\n- Query operation\
  \ counts increased from approximately 21,000 database operations per second to over\
  \ 30,000 within a five-month period\n\n\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_359_0.png)\n\
  \n*图 15.1：集群硬件仪表板显示系统 CPU、归一化系统 CPU 和磁盘 IOPS*\n\n为了保持系统正常运行，我们将集群扩展到更高层级。同时，我们启动了一个项目，以研究如何在保持在之前层级的同时调整性能以处理增加的工作负载。\n\
  \n这种逐渐的性能下降体现在多个关键指标上，这些指标提供了底层问题的明确迹象。虽然随着应用程序的增长，CPU 使用率的增加是预期的，但在这种情况下，其增长速度明显高于工作负载的预期。查询定位指标的升高尤其令人担忧，因为它们指向可能存在次优索引，查询处理了大量文档仅返回少量结果。这种低效率在过度配置的系统中常常被忽视，掩盖了底层设计问题。然而，随着这些次优查询操作的累积，它们最终产生了可衡量的延迟增加，暴露了根本问题。解决这些扩展问题成为首要任务，以确保\
  \ Atlas 上客户部署的持续可靠性、性能和全面监控。\n\n## 诊断原因\n\nMongoDB 团队开始使用 Atlas 监控工具进行调查，如第 14 章《监控和可观测性》所述。如图\
  \ 15.2 所示，在服务器为主节点期间，OpCounters 出现峰值，切换为从节点时则下降。3 月底查询定位的激增尤其值得注意。\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_360_0.png)\n\
  \n图 15.2：集群状态仪表板显示 Opcounters、操作执行时间和查询定位\n\n为缓解对集群资源的持续压力，团队暂时升级了集群层级。这为我们提供了所需的即时\
  \ CPU 提升，并且如预期，归一化系统 CPU 指标明显下降。虽然这在当时解决了性能问题，但这只是临时措施。团队的主要目标仍然是找出根本原因并实施更具成本效益的长期解决方案来解决高\
  \ CPU 使用率，确保系统稳定性和财务效率。\n\n## 根本原因识别\n\n在临时解决方案到位后，工程团队开始对系统性能问题进行根本原因分析。\n\n他们首先使用了\
  \ Atlas Performance Advisor，其推荐了 19 个潜在索引，这明显表明许多查询使用了次优索引。同时，日志分析显示出慢查询，其时间戳与高\
  \ CPU 使用率时段直接相关。这种组合提供了强有力的证据，表明特定的查询模式导致了性能下降，特别是那些执行全集合扫描或在没有适当索引支持的情况下进行复杂聚合的查询。\n\
  \n在确认某些查询可能导致性能下降后，Atlas Query Insights 和 Query Profiler 成为了解发生了什么的自然下一步。Query Insights\
  \ 和 Query Profiler 显示，某些聚合和平均查询执行时间极长，其中一些查询长达 8 秒，如图 15.3 所示。\n\n按命名空间提供的这些详细信息使团队能够准确了解瓶颈发生的位置，从而能够制定有针对性的优化策略，例如创建新索引或重写低效查询。这种综合方法提供了系统性能挑战的清晰图景，并导致数据库更高效。\n\
  \n**Query Insights** 页面列出了每个命名空间的操作数量及其总执行时间的详细信息。\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_361_0.png)\n\
  \n图 15.3：集群 Query Insights 仪表板显示慢查询\n\n通过相关性分析，使用与上述相同技术，团队发现数据库每秒处理约 20,000 次操作期间，日志显示每天约有\
  \ 13,000 个慢查询。\n\n通过同时利用日志和 Query Profiler，我们能够将慢查询与高 CPU 使用率时段相关联。这种相关性帮助我们识别出最可能导致性能问题的查询形状。例如，最频繁记录的慢查询形状，每天出现约\
  \ 9,000 次，显示如下：\n\n```\n{\n  \"find\": \"db.collection_g\",\n  \"filter\": {\n \
  \   \"attribute1_Id\": {\n      \"$oid\": \"621094e7bdbed43d3f408384\"\n    },\n\
  \    \"attribute1_Name\": \"aws-use1-1-v2-1\",\n    \"attribute2_Id\": {\n     \
  \ \"$oid\": \"65bd5e7ccff98a5722037dc6\"\n    }\n  },\n  \"limit\": 1\n}\n\n\"planSummary\"\
  : \"COLLSCAN\",\n\"planningTimeMicros\": 259,\n\"keysExamined\": 0,\n\"docsExamined\"\
  : 34436,\n\"nreturned\": 1,\n\"durationMillis\": 103,\n\"cpuNanos\": 10987385\n\
  ```\n\n此查询模式尤其成问题。它扫描了超过 34,000 个文档并返回一个匹配文档，在此过程中消耗了大量 CPU 资源。团队发现，该集合和查询是在 3 月底作为新功能添加的，但没有相应的索引。这与他们观察到的查询定位激增相吻合。\n\
  \n## 实施解决方案\n\n在更清楚地了解性能瓶颈后，团队专注于有针对性的低风险优化。他们的目标是在不给系统资源带来进一步压力的情况下提高效率。\n\n团队实施了几种有针对性的解决方案：\n\
  \n- **创建推荐索引**：他们为最频繁的慢查询创建了索引，这立即改善了性能并降低了查询定位指标。为了避免在此关键时期进一步给已受压力的 CPU 资源带来负担，团队在创建索引时进行了仔细规划，通过在非高峰时段安排并持续监控系统资源，以防止额外的性能下降。\n\
  - **设置预防性监控**：他们从项目警报页面创建了查询定位警报，以监控扫描对象与返回文档的高比率。这将在工作负载、应用程序或数据集发生变化导致查询效率随时间下降时提醒他们。\n\
  \n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_363_0.png)\n\n图 15.4：创建新的警报以定位慢查询\n\n\
  - **删除冗余索引：** 在审查 Performance Advisor 建议时，团队发现了 9 个在另一个复合索引前缀字段上的索引，可能可以删除。然而，删除索引是一项需要仔细考虑和规划的操作。团队首先在测试环境中验证每个建议，评估潜在的查询影响，并逐步实施更改并密切监控。只有在彻底评估后，他们才继续删除这些冗余索引，先隐藏索引，然后确认系统没有不良影响，再删除。这最终改善了写入性能，而不会影响读取性能。\n\
  \n这些措施共同降低了 CPU 使用率，提高了查询效率，并稳定了系统性能。更重要的是，它们为今后的持续优化和主动监控奠定了基础。\n\n## 结果与经验教训\n\
  \n本案例说明了诊断固有慢操作时的几个重要原则：\n\n- 性能问题通常与应用程序更改或新功能同时出现\n- 使用 Performance Advisor、Query\
  \ Profiler 和日志等多种诊断工具可提供全面的视图\n- 创建适当的索引通常是集合扫描最有效的解决方案\n- 删除冗余索引可以改善写入性能\n- 为关键指标设置警报可实现对未来问题的积极识别\n\
  \n最终，这种风险首先是通过随时间监控关键指标而识别的。这帮助我们识别逐渐的性能下降，并在对客户造成影响之前采取行动。此次性能调优练习使我们能够降低集群层级并降低成本。\n\
  \n## 案例研究：导致集合扫描的意外管理员查询\n\n慢查询通常是 MongoDB 部署中性能问题的第一个指标。一个主要问题影响了客户的自托管 MongoDB\
  \ 部署。他们的应用程序监控显示数据库操作的延迟突然增加，影响了整个系统的用户。问题的突然性意味着我们需要立即调查并修复，以避免进一步中断并使服务恢复正常。\n\
  \n\n\n\n## 诊断原因\n\n一名客户工程师联系了 MongoDB 支持。支持工程师意识到情况危急，首先寻找一种即时但安全的补救措施以降低影响的严重程度。支持人员要求客户运行一个\
  \ shell 命令来显示运行了 10 秒或更长时间的操作：\n\n```\ndb.currentOp({\"secs_running\": { $gte: 10}}).inprog\n\
  [\n  {\n    type: 'op',\n    opid: 201,\n    host: 'somewhere.net:27017',\n    connectionId:\
  \ 1063017,\n    client: '555.111.222.333:47140',\n    currentOpTime: '2024-12-31T00:29:08.230+00:00',\n\
  \    threaded: true,\n    secs_running: Long('5410'),\n    microsecs_running: Long('5410001296'),\n\
  \    op: 'command',\n    ns: 'admin.$cmd',\n    command: {\n      /* Redacted */\n\
  \    },\n    \"planSummary\": \"COLLSCAN\",\n    numYields: 0,\n    locks: {},\n\
  \  }\n]\n```\n\n这揭示了一个根据 secs_running 字段已运行超过 90 分钟的操作。进一步调查显示，一名数据库管理员已登录并运行了一个复杂的查询。日志中的\
  \ host 字段显示此查询是从另一个办公室执行的，而 ns admin 字段确认该用户具有管理权限。该查询启动了集合扫描，导致缓存的集合被从内存中驱逐。\n\n\
  ## 实施解决方案\n\n客户面临一个非关键但消耗资源过度并威胁系统稳定性的操作，果断采取行动。为了重新获得控制并防止进一步恶化，他们启动了对问题进程的终止序列。为此，使用了以下命令：\n\
  \n```\ndb.killOp(201)\n```\n\n在这种情况下，团队终止了有问题的临时操作，问题得以解决。在后续分析中，MongoDB 支持团队发现管理员发出的复杂查询导致了大规模缓存驱逐。这是因为扫描将大量很少使用的文档加载到内存中，挤出了有限缓存空间中的频繁访问数据。这解释了为什么在终止查询后性能仍然受影响；缓存的损害已经造成。大约\
  \ 2-3 分钟后，一旦频繁访问的数据（工作集）从磁盘存储重新加载到 MongoDB 的缓存中，数据库性能指标就恢复到基线水平。虽然这一恢复期可能看起来像是干预后额外的性能下降，但需要注意的是，系统早已被有问题的查询阻塞，因此这一短暂的恢复阶段是解决根本问题不可避免的后果。\n\
  \n## 结果与经验教训\n\n本案例凸显了几个重要原则。首先，长时间运行的集合扫描会严重影响所有用户的性能。此外，缓存数据驱逐是大型集合扫描的常见副作用。\n\
  \n生产数据库上的管理员临时查询代表着重大风险，需要谨慎管理和治理。虽然这些即兴调查可以提供有价值的见解，但如果在未充分考虑其资源需求的情况下执行，也会严重影响系统性能和可用性。为避免这种情况，组织必须实施严格的政策，规定谁可以在生产系统上运行临时查询、何时可以执行，以及对其范围和复杂性应施加哪些限制。理想情况下，此类探索性工作应在从节点或维护窗口期间进行，并配置查询超时和资源限制以防止失控进程。如果没有这些保障措施，即使是出于好意的数据库管理员也可能无意中触发级联性能问题，影响数千名应用程序用户。\n\
  \n## 管理阻塞操作\n\n阻塞操作可能发生在进程必须等待另一个操作完成或资源变得可用时，从而产生连锁效应，严重影响应用程序的响应能力。了解导致操作阻塞的原因对于保持最佳数据库性能至关重要。及早识别这些模式可以让你在它们影响用户体验之前实施预防措施。\n\
  \nMongoDB 中阻塞操作的典型原因包括以下内容：\n\n- 具有排他锁的长时间运行操作，例如索引构建或集合删除\n- 资源竞争，即多个操作尝试访问相同的集合或文档，尤其是在高峰使用期间\n\
  - 连接池耗尽，即所有可用连接都在使用中，新操作必须等待，从而造成人为排队\n\n> **非阻塞问题的阻塞式症状**\n> \n> 一些情况，例如游标泄漏或高网络延迟，会产生类似阻塞的症状。例如，高延迟或慢查询，但它们不涉及实际的锁竞争。\n\
  \n## 案例研究：游标泄漏调查\n\n一名客户遇到操作变慢和高数量查询超时的问题。该问题直接影响用户，部分用户遇到应用程序超时。Atlas 监控显示打开游标数量显著激增，具体来说，从客户本地时区凌晨\
  \ 4:00 开始超过 600,000。\n\n> **通过 serverStatus 跟踪打开游标**\n> \n> 对于自托管的 MongoDB 实例，此信息也可以在\
  \ serverStatus 命令的 cursor.open.total 计数器中找到。\n\n## 诊断原因\n\nMongoDB 支持团队最初专注于优化慢操作，并建议根据\
  \ Performance Advisor 的建议创建索引以加快查询速度。然而，这并未改善情况。即使在索引优化后，打开游标数量仍然很高，这表明存在更复杂的潜在问题。这可能是由于应用程序逻辑效率低下、游标未正确关闭或连接池问题所致。\n\
  \n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_368_0.png)\n\n## MongoDB 中的自动游标生命周期管理\n\
  \nMongoDB 在大多数正常操作中会自动管理游标生命周期。游标在完全迭代后超时（通常为 10 分钟后）或客户端会话结束时关闭。在使用标准 MongoDB 驱动程序和模式的应用程序中，游标泄漏相对较少见。\n\
  \n客户的部署持续恶化，更多用户遇到响应时间缓慢和错误。CPU、内存和 I/O 等关键系统指标都显示出严重的瓶颈。即使经过我们支持团队的彻底调查，确切原因仍不明确，但我们需要快速稳定系统以避免中断。支持团队建议客户重启主节点。这将触发计划的故障转移，使其中一个从节点成为新的主节点，确保服务继续运行。在从节点成功提升后，系统性能立即改善，证实此操作暂时解决了紧急运营问题。\n\
  \n支持团队继续在夜间监控系统。打开游标计数正在上升，但用户活动较低，操作延迟尚未达到关键水平。当客户工程师第二天早上开始工作时，打开游标计数已上升至 260,000\
  \ 并且仍在攀升。\n\n支持团队与客户共同实时诊断问题，并确定了几个关键指标：\n\n- **Profiler Analysis**：客户启用数据库分析器 40\
  \ 分钟，以捕获耗时超过 20 ms 的查询。\n- **Log Analysis**：分析日志时，支持工程师观察到打开游标激增至 600,000，然后回落接近零。从服务器状态来看，他们观察到以下情况：\n\
  \  - 大量 `cursor.lifespan.greaterThanOrEqual10Minutes`\n  - 每秒超过 500 个 `cursor.totalOpened`，但\
  \ `cursor.moreThanOneBatch` 少于 250\n  - 超过 300,000 条日志消息包含 `{\"ctx\":\"LogicalSessionCacheRefresh\"\
  ,\"msg\":\"Killing cursor as part of killing session(s)\"}`\n\n\n\n### 查询模式分析\n\
  使用 grep 命令，他们分析了日志文件模式：\n\n```\ngrep 'aCollection' mongodb.log* | grep -v 'getMore'\
  \ | wc -l\n122784\n\ngrep 'aCollection' mongodb.log* | grep '\"cursorExhausted\"\
  :true' | wc -l\n46954\n```\n\n第一个命令统计 'aCollection' 上的所有操作，同时排除 'getMore' 操作，显示出\
  \ 122,784 次初始游标创建。第二个命令仅统计已正确耗尽的游标（完全遍历或显式关闭），显示只有 46,954 例。此显著差异（仅约 38% 的游标被正确关闭）证实了我们对游标泄漏的怀疑，因为应用程序创建的大多数游标都被丢弃而未进行适当清理，导致它们在超时期限到来之前不断累积。\n\
  \n## 根本原因识别\n\n问题源于客户应用程序中的一个特定错误，该错误一直隐藏到最近。当查询由于数据增长开始在单个批次中返回超过默认的 101 个文档时，问题最终变得明显。该应用程序设计用于处理小型结果集，在这些情况下会正确处理游标。\n\
  \n此问题仅在客户端保持活动会话打开而未完全耗尽游标时才会显现（要么未遍历所有结果，要么未显式调用游标上的 close()）。在正常情况下，如果游标处理实现得当或结果集较小，则不会出现此问题。大多数\
  \ MongoDB 驱动程序实现和标准查询模式会自动处理游标生命周期管理，使得这种泄漏在设计良好的应用程序中相对不常见。\n\n有关游标行为的更多信息，请访问\
  \ MongoDB 文档中关于游标的部分 https://www.mongodb.com/docs/manual/core/cursors/#behavior。\n\
  \n## 实施解决方案\n\n在客户开发团队着手永久修复的同时，MongoDB 支持团队提供了一个关键的临时措施：在受影响的命名空间上终止空闲游标的 shell\
  \ 命令。这有助于防止非活动游标的累积，从而可能恶化性能并导致系统不稳定。该命令提供了即时的缓解，并为开发团队修复核心问题提供了宝贵的时间。\n\n客户为该错误开发了完整且适当的修复方案。该修复方案与\
  \ MongoDB 支持团队在活跃通话中协作部署，确保实时指导和即时故障排除。\n\n部署产生了即时且显著的影响。在修复之前，打开的游标会定期飙升至超过 600,000，然后暂时下降。对于此特定应用程序，正常操作在任何给定时间只需要大约\
  \ 100 个并发游标。部署后，系统趋于稳定。打开游标的最大数量始终保持在更低且可管理的 100 左右水平。这种减少极大地提高了系统效率和资源利用率。\n\n\
  进一步证实了已部署修复的成功，服务器状态报告显示问题已解决。具体来说，`cursor.lifespan.greaterThanOrEqual10Minutes`\
  \ 指标始终报告为 0。该指标有助于识别长寿命的潜在有问题游标。值为 0 显示没有游标保持打开超过 10 分钟。\n\n## 结果与经验\n\n客户的情况代表了一个不寻常的边缘案例，其应用程序代码反复创建新游标而未正确关闭它们。\n\
  \n此示例应用了若干故障排除原则：\n- 游标泄漏可能导致性能逐渐下降\n- 诊断根本原因通常需要多种方法\n- 在开发永久解决方案的同时，可能需要临时缓解措施\n\
  - 监控指标可实现早期检测\n\n最后，此情况生动地说明了开发阶段的应用程序代码问题如何在生产环境中表现为数据库性能问题。\n\n## 用例：糟糕优化查询的突发\n\
  \n一位客户注意到突然出现的一批超时操作。Atlas 监控显示归一化 CPU 利用率飙升至 100%，并且有超过 3.7 GB/s 的数据被读入存储引擎缓存，如图\
  \ 15.5 所示：\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_371_0.png)\n\n*图 15.5：缓存活动和用户\
  \ CPU 利用率*\n\n应用程序查询受到严重影响。用户遇到超时、响应缓慢，在某些情况下甚至完全请求失败。系统实际上被阻塞，因为在这些资源密集型进程垄断可用\
  \ CPU 和 I/O 容量时，正常操作无法进行。但是什么导致了这种突然的致命负载？由于数据库主要为客户查询服务，这些性能指标强烈表明一个或多个有问题的查询可能是导致峰值的根源。为了识别这种异常活动背后的具体罪魁祸首，我们需要更深入地研究查询模式。这促使我们检查\
  \ Atlas Query Insights，以更详细地了解查询级别正在发生的情况。\n\n## 诊断原因\n\nQuery Insights/Query Profiler\
  \ 揭示了集合上大量查询，每个查询检查超过 100 万个文档，如图 15.6 所示，表示为图表顶部绿点。在屏幕截图底部，我们还可以看到，总共 233 个查询在此\
  \ 16 分钟期间扫描了大约 144 百万个文档。我们查看了之前的 20 分钟，发现总共仅扫描了 800 万个文档。\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_372_0.png)\n\
  \n图 15.6：查询分析器显示大量被检查的文档\n\n点击 Query Profiler 中显示的绿点之一，如图 15.6 所示，揭示了每个单独查询的更深入见解。点击其中一个查询时，分析器显示了以下内容：\n\
  \n```\n\"replanReason\": \"cached plan was less efficient than expected: expected\
  \ trial execution to take 2 works but it took at least 20 works\"\n```\n\n这表明查询规划器在寻找高效执行计划时遇到困难。在查看集合后，他们发现有\
  \ 25 个可用的索引，但没有一个与这些查询匹配良好，表明可能需要新索引。\n\n此外，进一步的日志分析还显示，该集合中的一些慢查询试图匹配跨越六个月范围的文档。\n\
  \n## 实施解决方案\n\n为了解决由于缺乏最优索引导致效率低下的问题，团队查看了 Performance Advisor，该顾问如预期般提供了针对解决该问题的全新复合索引建议，如图\
  \ 15.7 所示。采纳这一建议后，团队迅速创建了复合索引，显著改善了查询性能。\n\n### aDB.aCollection\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_373_0.png)\n\
  \n图 15.7：性能顾问建议\n\n此外，团队通过修改其查询逻辑以匹配更短时间跨度内的文档来增强应用程序。此调整进一步优化了查询执行，减少了返回的数据量和查询延迟，从而实现更快的性能和更高效的系统资源使用。\n\
  \n## 结果与经验\n\n此案例强调了查询优化的几个关键原则。突然的性能问题通常与应用程序行为的变化相关，因此密切监控应用程序模式至关重要。低效查询的一个关键指标是数据库检查的文档数量与实际返回结果相比不成比例地大。这可能表明查询设计或索引存在潜在问题。此外，查询规划器在处理广泛的数据范围时可能会遇到困难，这凸显了在可能的情况下缩小查询范围的重要性。\n\
  \n解决性能挑战通常需要结合多种策略，包括数据库更改，例如创建优化索引，以及应用程序级调整，例如减少查询数据的时段。诸如 Performance Advisor\
  \ 之类的工具在识别缺失索引方面非常宝贵，即使对于不频繁的查询模式也是如此。它提供可操作的建议以提高效率并解决瓶颈。\n\n## 处理硬件资源限制\n\n硬件资源限制是保持\
  \ MongoDB 最优性能的关键挑战。即使查询经过良好优化且架构设计合理，底层硬件最终决定了数据库处理工作负载的效率。资源限制发生在部署的计算、内存、网络或存储容量不足以支持其承受的需求时，导致级联性能问题。想象一条生产线，机器以最大容量运行。任何需求增加或效率低下都会使系统超出极限，导致瓶颈和延迟。同样，MongoDB\
  \ 中的资源限制会显著损害应用程序的响应能力和可扩展性。\n\n这些限制通常在四个主要领域显现：CPU、内存、磁盘 I/O 和网络。高 CPU 利用率可能会限制用于查询、聚合和后台任务的处理能力，迫使操作排队并延迟结果。内存限制发生在可用\
  \ RAM 不足以存储工作集时，导致更依赖于较慢的磁盘读取并降低性能。磁盘 I/O 限制，例如缓慢或过载的存储子系统，会严重阻碍需要频繁或大量数据读写的操作。网络限制会显著影响分布式数据库操作，导致诸如复制延迟增加、初始同步变慢、备份时间延长以及副本集选举延迟等问题，所有这些都可能损害部署中数据可用性和一致性。\n\
  \n\n\n资源限制的影响通常是逐渐显现的，随着数据量的增长、工作负载的增加或使用模式的变化而出现。然而，当资源在集群中分布不均时，问题也可能突然出现，造成热点或不平衡，从而加剧性能瓶颈。识别并解决这些硬件限制对于确保\
  \ MongoDB 在规模化时保持响应性和可靠性至关重要。了解 CPU、内存和存储如何与 MongoDB 工作负载交互，使团队能够主动缓解限制并优化部署中的资源分配。\n\
  \n## Case study: Atlas cluster resource optimization\n\n案例研究：Atlas 集群资源优化\n\n承接之前的\
  \ Atlas 监控集群示例，团队注意到即使通过索引改进解决了固有的慢操作，shard-0 上的资源利用率仍然高于其他分片。这种不平衡带来了重大问题，因为它在分布式系统中造成了性能瓶颈。当一个分片的利用率持续高于其他分片时，它实际上就成为整个集群性能的限制因素。这不仅会使超载的分片面临资源耗尽的风险，可能导致操作失败，而且也代表了对整个集群容量的低效使用。此外，这种不平衡削弱了分片设计提供的容错和可扩展性优势，因为系统变得不成比例地受单个分片性能的制约。\n\
  \n查看每个分片主节点的未归一化进程 CPU 时，他们观察到 shard-0 的利用率和数据大小均高于所有其他分片，如图 15.8 所示。\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_375_0.png)\n\
  \nFigure 15.8: Graph showing the unnormalized process CPU on the primaries of each\
  \ shard\n\n图 15.8：显示每个分片主节点上未归一化进程 CPU 的图表\n\n此外，图 15.9 说明了一个重要观察：过去一年中，shard-0\
  \ 的写入 IOPS 增长速度比集群中其他分片更快。\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_376_0.png)\n\
  \n*Figure 15.9: Graph showing the last year of write IOPS on shard-0*\n\n*图 15.9：显示\
  \ shard-0 过去一年写入 IOPS 的图表*\n\n## Diagnosing the cause\n\n诊断原因\n\n不平衡的根本原因源于集群的初始配置。集群包含一个具有众多集合的单个数据库，并且在数据库首次创建时，shard-0\
  \ 被指定为主分片。因此，所有未分片的集合默认都放置在 shard-0 上。随着时间的推移，未分片集合的数量及其各自的数据量增长，shard-0 因不成比例的工作负载而变得超载。\n\
  \n这种不均匀分布导致 shard-0 上的操作和数据集中度更高，使其 CPU、内存和磁盘使用率持续高于其他分片。shard-0 的高利用率还增加了查询延迟并限制了集群的整体吞吐量，因为未分片集合上的操作受制于主分片的资源限制。\n\
  \n如第 1 章《系统与 MongoDB 架构》所述，性能优化很少是一步到位的。数据库系统中的瓶颈是动态的。当你解决一个问题时，系统中的下一个约束往往会变得明显。这一原则在我们的案例中得到了清晰的体现。虽然索引改进成功解决了最初识别的慢操作，但它们只是揭示了另一个潜在的瓶颈，该瓶颈此前部分被更严重的索引问题所掩盖。\n\
  \n## Implementing the solution\n\n实施解决方案\n\n团队必须确定以下哪种方法最适合平衡工作负载：\n\n- Scale up\
  \ the primary shard (Atlas supports individual scaling of each shard)\n- 扩容主分片（Atlas\
  \ 支持对每个分片进行单独扩容）\n- Move unsharded collections from shard-0 to other shards\n- 将未分片集合从\
  \ shard-0 移动到其他分片\n- Shard more collections\n- 对更多集合进行分片\n\n团队决定将未分片集合从 shard-0\
  \ 移动到其他分片，因为与替代方案相比，这种方法最简单易于实施和管理。此方法无需更改应用程序代码或数据模式，并且可以在不造成显著停机的情况下执行。此外，它使团队能够直接控制哪些集合移动到何处，从而可以根据集合大小和访问模式进行仔细平衡。\n\
  \n但首先，他们再次核实哪些集合是未分片的，哪些是已分片的。\n\n1. To do this, they ran the following commands\
  \ in mongosh:\n\n1. 为此，他们在 mongosh 中运行了以下命令：\n\n// List unsharded collections\n\
  db.getCollectionNames().forEach(collectionName => {\n    if (!db[collectionName].stats().sharded)\
  \ {\n        print(collectionName);\n    }\n});\n\n// List sharded collections\n\
  db.getCollectionNames().forEach(collectionName => {\n    if (db[collectionName].stats().sharded)\
  \ {\n        print(collectionName);\n    }\n});\n\n他们发现一个数据库中有 163 个集合。其中 20 个已分片，143\
  \ 个未分片。\n\n2. Next, the team analyzed the real-time panel for shard-0 to get a quick\
  \ view of its workload:\n\n2. 接下来，团队分析了 shard-0 的实时面板，以快速了解其工作负载：\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_378_0.png)\n\
  \nFigure 15.10: Panel displaying how hot a collection is in real time\n\n图 15.10：实时显示集合热度的面板\n\
  \n图 15.10 显示了按每秒操作数计算的最热集合的实时视图。该视图显示了 CPU 和内存利用率以及连接数、每秒操作数，以及底层写入磁盘的读写 IOPS。这种详细的分解对于确定应将哪些集合移动到不同分片非常有价值。\n\
  \n通过识别操作计数最高、内存占用最大、CPU 消耗最大的未分片集合，团队可以优先移动资源最密集的集合。这种有针对性的方法确保了再平衡工作对减轻 shard-0\
  \ 负担的影响最大，同时最大限度地减少需要迁移的集合数量。活动水平较低的集合可以保留在 shard-0 上，或在必要时在后续阶段移动。\n\n团队还分析了 Query\
  \ Insights 视图，以了解最活跃集合的长期情况，如图 15.11 所示。\n\n![](img/11c6cf3488b31bf4339aa4bd8ea9b45b_379_0.png)\n\
  \n*Figure 15.11: Graph showing both the count of operations per second and the average\
  \ latency over the last 24 hours*\n\n*图 15.11：显示过去 24 小时内每秒操作数和平均延迟的图表*\n\n该图表显示了过去\
  \ 24 小时内每秒操作数和平均延迟。利用有关 shard-0 工作负载的这些信息，团队随后确定了 CPU 消耗最高的 10 个未分片集合，这些集合的数据集大小可控，以确保快速迁移。\n\
  \n他们计划将这些集合从 shard-0 分发到其他分片：\n\n- The busiest unsharded collection to shard-1\n\
  - 最繁忙的未分片集合到 shard-1\n- The second busiest collection to shard-2\n- 第二繁忙的集合到 shard-2\n\
  - Busy collections 3 and 4 to shard-3\n- 繁忙集合 3 和 4 到 shard-3\n- Busy collections\
  \ 5, 6, and 7 to shard-4\n- 繁忙集合 5、6 和 7 到 shard-4\n- Busy collections 8, 9, and\
  \ 10 to shard-5\n- 繁忙集合 8、9 和 10 到 shard-5\n\n该计划在生产环境中运行之前首先在 QA 环境中进行了测试。这种预防措施很重要，因为在分片之间移动集合涉及繁重操作，可能显著影响集群性能。\n\
  \n他们首先移动了两个最小的集合并检查指标以验证更改是否生效。对于每次集合移动，他们遵循以下流程：\n\n1. Monitor shard-0 and the\
  \ destination shard's hardware metrics and operation execution times.\n1. 监控 shard-0\
  \ 和目标分片的硬件指标和操作执行时间。\n2. Verify the destination shard has free disk space, IOPs,\
  \ network resources, and CPU headroom.\n2. 验证目标分片具有足够的磁盘空间、IOPS、网络资源和 CPU 空闲。\n\
  3. Connect to mongos and move a collection:\n3. 连接到 mongos 并移动集合：\n4. If something\
  \ goes wrong during the move, use the abortMoveCollection admin command.\n4. 如果移动过程中出现问题，使用\
  \ abortMoveCollection 管理命令。\n5. Monitor shard-0 and the destination shard's hardware\
  \ metrics and operation execution times.\n5. 监控 shard-0 和目标分片的硬件指标和操作执行时间。\n\n```\n\
  db.adminCommand({ moveCollection: \"db.collection_b\", toShard: \"shard-1\" })\n\
  ```\n\n## MoveCollection causes short write block\n\nMoveCollection 导致短暂写入阻塞\n\n\
  The moveCollection command blocks writes to the collection for up to 2 seconds during\
  \ its critical section. You can find more details in the documentation at https://mongodb.com/docs/manual/tutorial/move-a-collection/.\n\
  \nmoveCollection 命令在其关键部分会阻塞对集合的写入，最长可达 2 秒。你可以在文档 https://mongodb.com/docs/manual/tutorial/move-a-collection/\
  \ 中找到更多详细信息。\n\n## Results and learnings\n\n结果与经验\n\n团队预计，迁移大多数资源密集型未分片集合，加上之前的模式和索引优化，将减轻集群的资源需求，使其能够缩减基础设施、显著降低成本并维持性能水平。\n\
  \n该示例表明，解决硬件资源限制不仅仅是简单地扩容；它需要一种战略性方法，将监控、诊断、工作负载分析和运营规划整合在一起。Atlas 监控和 Query Insights\
  \ 等工具对于精确定位资源瓶颈并分析短期指标和长期工作负载趋势至关重要。凭借对这些指标的清晰可见性，组织可以实施针对集群独特需求的数据驱动解决方案，确保纠正措施精确且有效。\n\
  \n\n\n## 用例：自托管 MongoDB 中 IOPS 不足的诊断\n\n在自托管系统中，在客户部署中常见到类似的模式：工作负载会随着时间自然增长，往往超过底层基础设施的能力。使用\
  \ MongoDB Atlas，这很容易通过内置监控工具及早发现，这些工具可实时查看关键指标，例如空闲 CPU、磁盘 IOPS 余量以及正在执行的运算数量。然而，在独立管理\
  \ MongoDB 集群时，团队必须依赖脚本或外部监控工具来跟踪这些指标。\n\n在本示例中，我们回顾了一个客户案例，该客户在云基础设施上自行管理 MongoDB。随着性能问题开始显现，MongoDB\
  \ 支持团队转向了服务器的诊断数据。\n\n## 诊断原因\n\nMongoDB 服务器每秒在 **全天候诊断数据采集 (FTDC)** 中捕获系统信息和内部计数器。此数据不包含任何敏感信息，例如查询、查询谓词、结果或凭据。\n\
  \n分析每秒存储读取请求（在 Linux 上来自 iostat 命令），他们发现数据库服务器正在发出 16,600 IOPs。来自 vmstat 的 FTDC\
  \ 数据显示 39% iowait，表明系统花费大量时间等待 I/O 操作。\n\n客户为底层存储预配了 15,000 IOPs。云服务提供商通常允许在限制之前在一段时间内超出预配限制进行突发。这种突发随后被限制，被客户的应用程序体验为停顿。\n\
  \n查看 IOPS 分配后，我们意识到使用的 IOPS 超过了预配量。由于提供了更高的突发 IOPS，性能在一段时间内是可以接受的。然而，在突发配额耗尽后，随之而来的是急剧的性能下降。系统不再拥有足够的\
  \ IOPS，操作变慢，等待 I/O。\n\n## 实施解决方案\n\n客户将预配的 IOPS 从 15,000 增加到 18,000，这立即解决了性能停顿问题。\n\
  \n## 结果与经验教训\n\n此案例强调了 Atlas 和自托管 MongoDB 部署中硬件资源约束的几个重要原则。I/O 限制经常表现为较高的 iowait\
  \ 百分比，表明存储中存在潜在瓶颈。在云环境中，值得注意的是，暂时超出预配限制的突发可能是可能的，但这对于不断增长的工作负载来说并不总是可持续的。对应用程序工作负载与资源预配之间关系有深入的理解对于保持最佳性能至关重要。即使没有\
  \ Atlas 提供的先进监控功能，FTDC 等诊断工具也可以提供有价值的见解来识别和解决潜在问题。最后，值得记住的是，有时解决性能问题的最简单、最有效的方法就是简单地增加可用资源以满足工作负载的需求。此案例提醒我们主动规划和监控以避免资源瓶颈的重要性。\n\
  \n## 性能故障排除的系统化方法\n\n基于我们探讨的示例，以下是诊断和解决 MongoDB 性能问题的结构化方法：\n\n- 1. **识别症状并收集初始数据：**\
  \ 故障排除的第一步是确定性能症状并收集相关数据以了解问题。确定问题开始的时间，识别受影响的数据库操作或集合，并收集 CPU 使用率、IOPS 和查询性能等基线指标以供比较。这些初始信息有助于构建清晰的现状图景，并指导下一步的诊断。\n\
  - 2. **使用多种诊断工具：** 利用各种诊断工具深入了解问题。对于 Atlas 用户，监控仪表板提供关键性能指标的视觉概览，而自托管集群的用户可以使用系统监控工具实现类似结果。数据库分析器对于检测慢查询非常宝贵，日志文件有助于发现与性能下降相关的错误或模式，而\
  \ currentOp() 命令可识别正在运行的操作。此外，性能顾问提供索引优化建议，这通常可以解决查询效率问题。请记住，可观测性和监控生态系统不断发展，及时了解新兴技术非常重要。\n\
  - 3. **对问题进行分类：** 收集数据后，对问题的性质进行分类以缩小可能的解决方案范围。它是由固有的慢操作引起的吗，例如全集合扫描或糟糕的索引策略？它可能源于被阻塞的操作，例如锁或与游标相关的问题？还是\
  \ CPU、内存或磁盘 I/O 限制等资源约束的结果？了解根本原因对于选择正确的补救方法至关重要。\n- 4. **确定范围：** 接下来，评估问题的范围以确保解决方案有效针对。问题是否影响特定的查询或集合，还是更广泛的系统范围？此外，验证问题是否仅在特定时间发生，例如在高峰工作负载或计划作业期间，以确定时间和模式是否起作用。定义影响和范围可确保工作集中在最有效的地方。\n\
  - 5. **实施有针对性的解决方案：** 一旦了解问题，就实施针对特定问题的修复措施。对于固有的慢操作，请考虑添加索引或优化查询以提高效率。被阻塞的操作可能需要终止长时间运行或卡住的进程并解决与游标相关的问题。如果识别出资源约束，则扩展\
  \ CPU、内存或磁盘 IOPS，或在分片或集群之间重新分配工作负载，可以缓解性能瓶颈。\n- 6. **验证解决方案：** 实施更改后，监控关键指标以确保问题已成功解决。验证问题不会再次出现，并确认性能已提高到预期水平。设置警报或主动监控，以便在未来及早发现类似问题，最小化停机时间和用户影响。\n\
  - 7. **记录发现和预防措施：** 最后，记录问题的根本原因以及为解决它而采取的步骤。利用这个机会实施预防措施，例如更新的监控工作流程或基础设施更改，以避免今后出现类似问题。与其他团队成员分享这些发现和最佳实践，以确保一致性并强化主动性能管理的文化。\n\
  \n通过遵循结构化方法，团队可以系统地识别、解决和防止 MongoDB 部署中的性能问题。持续监控和及时干预是保持响应迅速、可扩展系统的关键。\n\n## 摘要\n\
  \n在本章中，我们探讨了与 William Zola 的三个基本原因相符的 MongoDB 性能问题的真实示例：固有的慢操作、被阻塞的操作和硬件资源不足。通过案例研究，我们了解了如何使用\
  \ MongoDB 的内置工具识别性能问题。我们通过检查查询模式、游标行为和资源利用率来诊断根本原因。然后，我们通过索引、查询优化和资源管理实施了有针对性的解决方案。最后，我们设置了预防措施，以便在问题变得严重之前捕获它们。\n\
  \n近年来，MongoDB 性能的调试工具有了显著改进。Atlas 提供全面的监控和警报功能，而自托管部署可以利用数据库分析器、日志分析和 FTDC 数据等工具。\n\
  \n请记住，性能优化是一个持续的过程，而不是一次性任务。随着数据增长和应用程序模式演变，请持续监控性能指标、审查索引使用情况并调整配置以保持最佳性能。\n\n\
  通过使用本章概述的原则和技术系统地处理性能问题，您将更好地配备以维护高性能的 MongoDB 部署，无论规模或复杂性如何。\n\n\n\n## 后记\n\n好吧，我们已经走完了\
  \ MongoDB 性能之旅！但如果说在多年的数据库优化中有一条突出教训，那就是性能调优永远不会真正结束。就在一切似乎都已稳固之时，应用程序会增长，用户模式会发生变化，或者\
  \ MongoDB 发布了一个很酷的新功能供尝试。\n\n还记得我们关于模式设计的讨论吗？来自 *第 2 章，面向性能的模式设计*，或关于索引的讨论来自 *第\
  \ 3 章，索引*？这可不是为了好玩！许多用户都遇到过性能问题，最终追溯到设计不良的模式或次优的（或缺失的）索引。你无法在流沙上建造摩天大楼——无论你在其他地方如何优化，那个不稳的基础仍会不断反噬。\n\
  \n我们已经涵盖了很多内容，从发现慢查询到掌握索引。在此过程中，我们探讨了如何利用聚合框架、变更流和事务等功能。我们回顾了如何使用复制来实现高可用性以及使用分片进行扩展。但性能调优是一场马拉松，而不是短跑。它是一个持续的学习和适应过程，随着应用程序的演进而不断进行。\n\
  \n## 关键要点\n\n所以，哪些是最重要的经验可以带走？以下是一些原则的快速回顾，这些原则将使你的 MongoDB 部署保持快速、稳定，并为下一步做好准备：\n\
  \n- **模式设计至关重要：** 说真的，绝大多数性能问题都源于模式与应用程序使用数据的方式不匹配。在设计文档时要考虑读写操作。并且不要害怕随着时间的推移而演进模式。良好的模式是出色性能的基础。\n\
  - **索引是你的超能力：** 良好的索引是高效查询的关键。明智的索引策略意味着 MongoDB 不必如此努力工作。养成定期审查索引的习惯。\n- **如果你不测量，你就是盲飞：**\
  \ 你看不到的问题就无法修复。设置一致的监控，使用有意义的指标和警报。它有助于及早发现问题并指导调优工作。对部署的可见性有助于你在用户之前发现问题。\n- **别忘了那些枯燥的事情：**\
  \ 除了模式和索引之外，扎实的日常运维保持一切正常运行。这意味着管理配置、拥有可靠的备份计划，并知道何时需要更多容量。自动化维护可以节省很多未来的麻烦。\n\n\
  性能调优可能感觉像是在追逐一个移动目标，但只要有正确的习惯和坚实的基础，你将始终为即将到来的挑战做好准备。\n\n## 性能思维\n\n像性能侦探一样思考。保持好奇。不要等到事情坏掉才行动。深入查询计划，监控基准性能，并质疑假设。让性能成为团队运动，让开发人员、运维和架构师共同承担责任。\n\
  \n我们见过一个案例，其中对索引的一个看似微小的更改将页面加载时间减少了 40%。这类胜利只有在你主动寻找时才会出现。通过保持好奇并围绕改进建立习惯，优化就会成为文化的一部分，而非被动任务。\n\
  \n## 实用下一步\n\n知道很好，但行动更好。以下是一些你可以立即采取的实践步骤，将性能理论转化为成果：\n\n- **审计你的模式：** 仔细审视你的模式。它真的适用于你最常见的查询吗？检查访问模式并考虑文档结构（嵌入式与引用式）是否仍然发挥其作用。\n\
  - **熟悉诊断工具：** 熟悉 db.collection.explain() 和 Atlas 中的 Query Insight 选项卡。使用它们来观察真实的查询行为。寻找慢查询和无效索引——这甚至可能很有趣。\n\
  - **设置真实监控：** 使用 MongoDB Cloud Monitoring 或类似的替代工具。构建仪表板，突出显示关键指标，如操作持续时间、缓存命中率和复制延迟。让数据指出工作需要的地方。\n\
  - **在压力下测试：** 将负载测试纳入开发流程。确保系统能够处理预期和意外的流量。这就是你在瓶颈影响生产之前保持领先的方式。\n- **与人交流：** 通过本地用户组、活动或在线讨论与其他人联系。MongoDB\
  \ 社区庞大，充满了正在解决类似挑战并分享经验的人，这些经验可以带来宝贵的见解。你可以从访问 MongoDB 社区论坛开始，网址为 https://www.mongodb.com/community/forums/。\n\
  \n你应用所学、保持观察和保持联系越多，你的系统就越具韧性和响应性。\n\n## 未来考虑\n\nMongoDB 仍在不断发展。跟上 https://www.mongodb.com/docs/manual/release-notes/\
  \ 的发行说明，在安全环境中测试新功能，并采用合理的做法。\n\n保持好奇。实验。测量。并且始终确认更改确实带来了改进。\n\n## 最后的想法\n\n性能调优融合了艺术与科学。凭借本书中分享的见解，可以对应用程序性能产生重大影响。将每个瓶颈视为一个谜题，每次修复都视为学习机会。调优良好的数据库会改善开发人员、运维人员和用户\
  \ alike 的体验。这是一段旅程——但现在，有一张地图可以指引方向。\n\n现在去构建一些很棒的东西，并让它快速运行！\n\n## 索引\n\n### 符号\n\
