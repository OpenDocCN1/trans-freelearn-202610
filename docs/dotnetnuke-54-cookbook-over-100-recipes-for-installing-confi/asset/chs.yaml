  \ {\n    float: right;\n    padding: 10px 17px 0px 10px;\n}\n\n/* Pane Styles */\n\
  .ContentPane {\n    padding: 0px;\n    margin: 0px;\n}\n.MiddlePane {\n    padding:\
  \ 0px 0px 0px 10px;\n    width: 10em;\n    margin: 0px;\n}\n.LeftPane {\n    padding:\
  \ 0px 10px 0px 0px;\n    width: 10em;\n    margin: 0px;\n}\n.RightPane {\n    padding:\
  \ 0px 0px 0px 10px;\n    width: 10em;\n    margin: 0px;\n}\n\n/* User Styles */\n\
  .user, a.user:link, a.user:active, a.user:visited {\n    color: #800000;\n    font-size:\
  \ 12px;\n}\na.user:hover {\n    color: #C00;\n}\n```\n\n- 17. 通过这些样式，我们将登录链接定位在右侧，定义窗格，并设置用户链接的颜色和大小。\n\
  - 18. 从**文件**菜单中选择**将 StyleSheet1.css 另存为...**。\n- 19. 浏览到 `SampleASCXSkin` 文件夹，并将文件保存为\
  \ `skin.css`。\n- 20. 另一件有用的事情是为皮肤创建预览图像。这有些困难，因为连皮肤都还没有创建，不过你可以使用简单的绘图程序（如 MS Paint）来绘制一幅你计划中皮肤外观的图片。类似这样：\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_251_0.png)\n\n## 基本皮肤设计\n\n- 21. 将图像文件保存为\
  \ `SampleASCXSkin.jpg`。\n- 22. 要查看新皮肤在网站上的效果，请首先以超级用户身份登录。\n- 23. 在**管理**菜单下查找并选择**皮肤**。\n\
  - 24. 新的**SampleASCXSkin**皮肤将会出现：\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_252_0.png)\n\
  \n25. 要查看皮肤的外观，请单击**预览**链接。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_252_1.png)\n\
  \n26. 虽然效果不多，但它正确包含了皮肤对象和一个非常简单的布局。本章中的其他方案将展示如何添加样式元素和额外的皮肤对象。\n\n## 另请参阅\n\n这个示例\
  \ ASCX 皮肤将成为*探索皮肤对象*和*使用图像设计菜单样式*两个方案的基础。\n\n## 部署皮肤和容器\n\n与模块一样，皮肤必须打包并部署到 DNN\
  \ 服务器上。部署后，它们将出现在**管理**菜单下的**皮肤**页面中，以供预览并应用到门户。\n\n在之前的方案中，我们看到了如何在测试 DNN 门户上直接创建新皮肤。这样你可以编辑文件，并只需刷新浏览器即可立即看到效果。但是，当皮肤完全开发完成后，本方案将向你展示如何使用打包向导将皮肤打包为可移植的\
  \ ZIP 文件。\n\n创建完成后，你可以通过超级用户身份登录 DNN 站点，然后上传 ZIP 文件并将皮肤包作为扩展安装。皮肤安装在 \\Portals\\\
  _default\\Skins 文件夹中。\n\n> 从 DNN 5.x 开始，只有超级用户才能部署皮肤。这是出于安全考虑，因为皮肤现在可以包含用户编写的代码。\n\
  \n### 准备工作\n\n对于本方案，你需要准备要部署的皮肤文件。我们将使用前一个方案“创建简单的 ASCX 皮肤”中的皮肤文件。\n\n### 操作步骤...\n\
  \n- 1. 首先以超级用户身份登录。\n- 2. 在主机菜单下查看并选择扩展。\n- 3. 首先查看已安装的扩展，并在皮肤部分找到 SampleASCXSkin。如果看到它，请跳到步骤\
  \ 8，否则必须先创建扩展。首先从操作菜单中选择**创建扩展**（或单击页面底部的链接）。\n- 4. 从“扩展类型”下拉列表中选择“皮肤”，并按如下所示填写表单：\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_253_0.png)\n\n## 基本皮肤设计\n\n- 5. 单击**下一步**。\n\
  - 6. 提供所有者信息，然后点击**下一步**。\n- 7. 新的**SampleASCXSkin**皮肤将出现在扩展列表中。\n- 8. 单击名称旁边的**编辑**图标。\n\
  - 9. 滚动到底部，并点击**创建包**链接。\n- 10. 将显示**创建包**界面。单击**下一步**。\n- 11. 在下一个界面上，你将看到皮肤文件。单击**下一步**。\n\
  - 12. 接下来，显示清单。单击**下一步**。\n- 13. 向导将使用所有者名称和皮肤名称生成 ZIP 文件的文件名。单击**下一步**。\n- 14.\
  \ 向导将显示摘要页面并完成。你将在 `/Install/Skin` 文件夹中找到 ZIP 文件。单击**返回**关闭向导。\n- 15. 文件打包为 ZIP\
  \ 文件后，你可以按照*下载并安装皮肤*方案中的说明进行上传和安装。\n\n## 探索皮肤对象\n\n在之前的方案中，我们看到了皮肤对象通过文本标记（在 HTML\
  \ 中）或控件（在 ASCX 中）插入 DNN 功能的示例，例如登录链接和菜单。在本方案中，我们将扩展示例 ASCX 皮肤，并演示你可以使用的其他皮肤对象。\n\
  \n### 准备工作\n\n要继续本方案，你必须先完成以下方案：\n\n- - _创建简单的 ASCX 皮肤_\n\n下面是我们将创建的新页面布局示意图：\n\n\
  ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_254_0.png)\n\n### 操作步骤...\n\n- 1. 首先在你的测试\
  \ DNN 门户中找到默认皮肤文件夹（`\\\\Portals\\\\_default\\\\Skins`）。\n- 2. 接下来，创建一个新文件夹来存放皮肤文件。将此文件夹命名为\
  \ `DetailedASCXSkin`。\n- 3. 启动开发工具。\n- 4. 从*创建简单的 ASCX 皮肤*方案中打开 `SampleASCXSkin.ascx`\
  \ 文件。\n- 5. 在现有指令之后添加以下注册指令：\n\n```\n<%@ Register TagPrefix=\"dnn\" TagName=\"BREADCRUMB\"\
  \n    Src=\"~/Admin/Skins/BreadCrumb.ascx\" %>\n<%@ Register TagPrefix=\"dnn\" TagName=\"\
  TEXT\"\n    Src=\"~/Admin/Skins/Text.ascx\" %>\n<%@ Register TagPrefix=\"dnn\" TagName=\"\
  LINKS\"\n    Src=\"~/Admin/Skins/Links.ascx\" %>\n<%@ Register TagPrefix=\"dnn\"\
  \ TagName=\"COPYRIGHT\"\n    Src=\"~/Admin/Skins/Copyright.ascx\" %>\n<%@ Register\
  \ TagPrefix=\"dnn\" TagName=\"CURRENTDATE\"\n    Src=\"~/Admin/Skins/CurrentDate.ascx\"\
  \ %>\n```\n\n- 6. 接下来，将现有的 `Login_Style` DIV 替换为一个同时包含登录和用户链接的新 DIV：\n\n```\n<%--By\
  \ placing the SkinObjects inside a parent DIV they share the\nsame style--%>\n\n\
  <div class=\"bread_bg\">\n    <div id=\"bread_style\">\n        <dnn:TEXT runat=\"\
  server\" id=\"dnnTEXT\"\n            CssClass=\"breadcrumb_text\" Text=\"You are\
  \ here\"\n            ResourceKey=\"Breadcrumb\" />\n        &nbsp;<span>\n    \
  \        <dnn:BREADCRUMB runat=\"server\" id=\"dnnBREADCRUMB\"\n               \
  \ CssClass=\"Breadcrumb\"\n                RootLevel=\"0\" Separator=\"&nbsp;>&nbsp;\"\
  \ />\n        </span>\n    </div>\n    <div id=\"login_style\" class=\"user\">\n\
  \        <dnn:USER runat=\"server\" id=\"dnnUSER\" CssClass=\"user\" />\n      \
  \  &nbsp;&nbsp;|&nbsp;&nbsp;\n        <dnn:LOGIN runat=\"server\" id=\"dnnLOGIN\"\
  \ CssClass=\"user\" />\n    </div>\n</div>\n```\n\n\n\n\n\n- 7. 最后，保持 ContentPane\
  \ DIV 不变，并在其正下方添加这些新的 DIV：\n\n```html\n<div class=\"bot_bg links\">\n<dnn:LINKS\
  \ runat=\"server\" id=\"dnnLINKS\" CssClass=\"links\" Level=\"Root\" Separator=\"\
  &nbsp;&nbsp;&nbsp;| &nbsp;&nbsp;&nbsp;\" />\n</div>\n\n<div class=\"bot_pad\">\n\
  <div id=\"copy_style\" class=\"footer\">\n<dnn:COPYRIGHT runat=\"server\" id=\"\
  dnnCOPYRIGHT\" Align CssClass=\"footer\" />\n</div>\n<div id=\"date_style\" class=\"\
  footer\">\n<dnn:CURRENTDATE runat=\"server\" id=\"dnnCURRENTDATE\" Align CssClass=\"\
  footer\" />\n</div>\n</div>\n```\n\n> 将 Copyright 和 Date 分到单独的 DIV 中，可以让我们将一个放在页面左下角，另一个放在页面右下角。\n\
  \n- 8. 从 File 菜单中选择 Save SampleASCXSkin.ascx As...\n\n- 9. 浏览到 DetailedASCXSkin\
  \ 文件夹并将文件保存为 DetailedASCXSkin.ascx。\n\n- 10. 这些新的 Skin 对象需要样式。打开来自 Creating a simple\
  \ ASCX skin recipe 的 skin.css 文件。\n\n- 11. 在 skin.css 文件底部添加以下样式：\n\n```css\n/*breadcrumbs*/\n\
  .Breadcrumb, a.Breadcrumb:link, a.Breadcrumb:active, a.Breadcrumb:visited {color:\
  \ #800000; font-size: 13px;}\na.Breadcrumb:hover {color: #C00;}\n\n.bread_bg {background-color:\
  \ #EAEAEA; font-family: Verdana, Arial, Helvetica, sans-serif; border-left: solid\
  \ 1px #EAEAEA; border-right: solid 1px #EAEAEA; margin: 0 5px 0 5px; height: 30px;}\n\
  #bread_style {float: left; padding: 10px 0px 0px 17px; color: #000000; font-size:\
  \ 13px;}\n\n/* for the bottom of the page */\n\n.bot_bg {background-color: #EAEAEA;\n\
  border-left: solid 1px #EAEAEA;border-right: solid 1px #EAEAEA;\nborder-bottom:\
  \ solid 1px #EAEAEA; padding: 10px;   margin: 0 5px 0 5px;}\n.bot_pad {font-family:\
  \ Verdana, Arial, Helvetica, sans-serif; margin-bottom: 20px; padding: 0 30px 0\
  \ 20px;}\n\n#terms_style {float: left;}\n#copy_style {float: left;}\n#date_style\
  \ {float: right; padding: 0px 0px 0px 10px; }\n\n/*links*/\n.links {text-align:\
  \ center;}\n.links, a.links:link, a.links:active, a.links:visited {font-weight:\
  \ bold; color: #800000; font-size: 11px;}\na.links:hover {color: #C00;}\n\n/* Sets\
  \ the font size and text color of the footer at the bottom of the page */\n.footer,\
  \ a.footer:link, a.footer:active, a.footer:visited {color: #800000; font-size: 12px;}\n\
  a.footer:hover {color: #C00;}\n```\n\n- 12. 有了这些样式，我们将面包屑链接定位在菜单正下方左侧。登录和用户链接仍保留在右侧，ContentPane\
  \ 和 RightPane 保持不变，而新的 Links、Copyright 和 CurrentDate 控件沿页面底部排列。\n\n- 13. 从 File\
  \ 菜单中选择 Save skin.css As...\n\n- 14. 浏览到 DetailedASCXSkin 文件夹并将文件保存为 skin.css。\n\
  \n- 15. 要查看新皮肤在网站上的效果，请以 SuperUser 身份登录。\n\n- 16. 在 Admin 菜单下选择 Skins。\n\n- 17.\
  \ 新的 DetailedASCXSkin 现在会出现：\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_257_0.png)\n\
  \n## Basic Skinning\n\n- 18. 点击 **Preview** 查看皮肤的外观：\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_258_0.png)\n\
  \n- 19. 可以看到面包屑（**You are here**）出现在菜单下方左侧，用户和登录在右侧，链接沿底部排列，版权信息和当前日期出现在底部角落。\n\n\
  ### There's more...\n\n如果你好奇在你的 DNN 站点上有哪些 Skin 对象可用，可以以 SuperUser 身份登录并在 **Host**\
  \ 菜单下选择 **Extensions**。这将列出所有皮肤对象及其版本号。\n\n> 某些皮肤对象可能默认未安装，在安装前不会出现在此列表中。\n\n##\
  \ Creating a simple HTML container\n\n虽然皮肤设置了整个页面的样式，但 DNN 也允许在模块容器级别进行皮肤设置。你可以将容器视为模块内容的周围区域。它包括模块标题以及通常出现在内容下方的主菜单和操作链接。\n\
  \n在本教程中，我们将使用 HTML 创建一个简单的容器。我们还将介绍容器可用的一些 Skin 对象。\n\n容器有自己的标记，与皮肤中使用的标记不同。本教程将使用以下标记：\n\
  \n| Token | Description |\n|---|---|\n| `[ACTIONS]` | 创建模块悬停菜单。 |\n| `[TITLE]` |\
  \ 模块的标题。 |\n| `[VISIBILITY]` | 提供展开或折叠容器的能力。 |\n| `[PRINTMODULE]` | 管理员的链接，映射到不同的\
  \ ModuleActionTypes（本例中为打印模块）。 |\n\n以下是我们将创建的容器的示意图：\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_259_0.png)\n\
  \n### How to do it...\n\n- 1. 首先在你的测试 DNN 门户中定位默认容器文件夹（`\\Portals\\_default\\Containers`）。\n\
  \n- 2. 接下来，创建一个新文件夹来存放容器文件。将此文件夹命名为 HTMLContainer。\n\n- 3. 启动 Development Tool。\n\
  \n- 4. 从 **File** 菜单中选择 **New File...**。\n\n- 5. 在 **New File** 对话框中，选择 **HTML Page**\
  \ 并点击 **Open**。\n\n- 6. 这将给你一个基本的 HTML 文件。接下来我们需要添加所需 CSS 文件的链接。\n\n```html\n<!DOCTYPE\
  \ html PUBLIC \"-//W3C//DTD XHTML 1.0 Transitional//EN\" \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n<head>\n    <title>Untitled Page</title>\n\
  \n    <link id=\"container_css\" href=\"container.css\" type=\"text/css\"\n    \
  \      rel=\"stylesheet\" />\n</head>\n<body>\n</body>\n</html>\n```\n\n- 7. 接下来，我们需要添加将控制容器布局的\
  \ HTML 表格：\n\n```html\n<body>\n<div class=\"container_bkg\">\n<TABLE cellPadding=\"\
  0\" width=\"100%\" border=\"0\">\n<TR>\n<TD width=\"25\"></TD>\n<TD align=\"center\"\
  >[ACTIONS]</TD>\n<TD width=\"100%\" align=\"center\">[TITLE]</TD>\n<TD align=\"\
  center\">[VISIBILITY]</TD>\n<TD width=\"25\"></TD>\n</TR>\n<TR>\n<TD width=\"25\"\
  >&nbsp;</TD>\n<TD id=\"ContentPane\" colspan=\"3\" align=\"center\" runat=\"server\"\
  >\n</TD>\n<TD width=\"25\">&nbsp;</TD>\n</TR>\n<TR>\n<TD width=\"25\"></TD>\n<TD\
  \ colspan=\"3\" align=\"right\">[PRINTMODULE]</TD>\n<TD width=\"25\"></TD>\n</TR>\n\
  </TABLE>\n</div>\n</body>\n```\n\n- 8. 整个文件现在应如下所示：\n\n```html\n<!DOCTYPE html PUBLIC\
  \ \"-//W3C//DTD XHTML 1.0 Transitional//EN\" \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n<head>\n<title>Untitled Page</title>\n\
  \n<link id=\"container_css\" href=\"container.css\" type=\"text/css\" rel=\"stylesheet\"\
  \ />\n\n</head>\n<body>\n\n<div class=\"container_bkg\">\n<TABLE cellPadding=\"\
  0\" width=\"100%\" border=\"0\">\n<TR>\n<TD width=\"25\"></TD>\n<TD align=\"center\"\
  >[ACTIONS]</TD>\n<TD width=\"100%\" align=\"center\">[TITLE]</TD>\n<TD align=\"\
  center\">[VISIBILITY]</TD>\n<TD width=\"25\"></TD>\n</TR>\n<TR>\n<TD width=\"25\"\
  >&nbsp;</TD>\n<TD id=\"ContentPane\" colspan=\"3\" align=\"center\" runat=\"server\"\
  >\n</TD>\n<TD width=\"25\">&nbsp;</TD>\n</TR>\n<TR>\n<TD width=\"25\"></TD>\n<TD\
  \ colspan=\"3\" align=\"right\">[PRINTMODULE]</TD>\n<TD width=\"25\"></TD>\n</TR>\n\
  </TABLE>\n</div>\n\n</body>\n</html>\n```\n\n- 9. 从 **File** 菜单中选择 **Save HTMLPage1.htm\
  \ As...**。\n\n- 10. 浏览到 `HTMLContainer` 文件夹并将文件保存为 `HTMLContainer.htm`。\n\n- 11.\
  \ 这些新的 Skin 对象需要样式。从 **File** 菜单中选择 **New File...**。\n\n- 12. 在 New File 对话框中，选择\
  \ Style Sheet 并点击 Open。\n\n- 13. 用以下内容替换文件内容：\n\n```css\n/* General Styles */\n\
  .TitleLabel{color:GrayText;font-size: 15px;}\n.container_bkg {background-color:#DAE7F2;border:solid\
  \ 1px #4F839F;}\n```\n\n- 14. 从 File 菜单中选择 Save StyleSheet1.css As...\n\n- 15. 浏览到\
  \ HTMLContainer 并将文件保存为 container.css。\n\n- 16. 你还可以为新的容器制作一个预览图片，例如：\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_262_0.png)\n\
  \n- 17. 将图片文件保存为 HTMLContainer.jpg。\n\n- 18. 要查看新容器在我们网站上的效果，首先以 SuperUser 身份登录。\n\
  \n- 19. 在 Admin 菜单下选择 Skins。\n\n- 20. 从 Containers 下拉列表中选择 HTMLContainer。\n\n- 21.\
  \ 点击 Parse Skin Package 链接。\n\n- 22. 新的 HTMLContainer 现在会出现：\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_262_1.png)\n\
  \n\n\n\n\n23. 若要查看容器的外观，请单击 **预览** 链接。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_263_0.png)\n\
  \n24. 这是一个简单的容器，但查看 **赞助商** 之类的模块时，你会看到左侧的悬停菜单，以及模块标题在容器中居中显示，背景为浅蓝色。\n\n## 创建基本的\
  \ ASCX 容器\n\n正如皮肤可以使用 HTML 或 ASCX 创建一样，容器也可以用这两种方式开发。在本教程中，我们将看到一个简单的 ASCX 容器。\n\
  \n下面是我们将要创建的容器示意图：\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_263_1.png)\n\n###\
  \ 操作步骤...\n\n- 1. 首先，在你的测试 DNN 门户中找到默认容器文件夹（`\\\\Portals\\\\_default\\\\Containers`）。\n\
  - 2. 接下来，创建一个新文件夹来存放容器文件。将此文件夹命名为 ASCXContainer。\n- 3. 启动开发工具。\n- 4. 从 **文件** 菜单中，选择\
  \ **新建文件...**。\n- 5. 在 **新建文件** 对话框中，选择 **Web 用户控件**，然后单击 **打开**。\n- 6. 第一步是在文件顶部放置以下指令：\n\
  \n```\n<%@ Control Language=\"VB\"\n    CodeBehind=\"~/admin/Containers/container.vb\"\
  \n    AutoEventWireup=\"false\" Explicit=\"True\"\n    Inherits=\"DotNetNuke.UI.Containers.Container\"\
  \ %>\n```\n\n7. 下一步是为我们计划使用的每个皮肤对象添加注册指令：\n\n```\n<%@ Register TagPrefix=\"dnn\"\
  \ TagName=\"ACTIONS\"\n    Src=\"~/Admin/Containers/SolPartActions.ascx\" %>\n<%@\
  \ Register TagPrefix=\"dnn\" TagName=\"TITLE\"\n    Src=\"~/Admin/Containers/Title.ascx\"\
  \ %>\n<%@ Register TagPrefix=\"dnn\" TagName=\"VISIBILITY\"\n    Src=\"~/Admin/Containers/Visibility.ascx\"\
  \ %>\n<%@ Register TagPrefix=\"dnn\" TagName=\"PRINTMODULE\"\n    Src=\"~/Admin/Containers/PrintModule.ascx\"\
  \ %>\n```\n\n8. 要创建容器的结构，我们将使用 HTML 表格来布局皮肤对象：\n\n```\n<div class=\"container_bkg\"\
  >\n    <TABLE cellPadding=\"0\" width=\"100%\" border=\"0\">\n        <TR>\n   \
  \         <TD width=\"25\"></TD>\n            <TD align=\"center\"><dnn:ACTIONS\
  \ runat=\"server\"\n                id=\"dnnACTIONS\" />\n            </TD>\n  \
  \          <TD width=\"100%\" align=\"center\"><dnn:TITLE runat=\"server\"\n   \
  \             id=\"dnnTITLE\" />\n            </TD>\n            <TD align=\"center\"\
  ><dnn:VISIBILITY runat=\"server\"\n                id=\"dnnVISIBILITY\" />\n   \
  \         </TD>\n            <TD width=\"25\"></TD>\n        </TR>\n        <TR>\n\
  \            <TD width=\"25\">&nbsp;</TD>\n            <TD id=\"ContentPane\" colspan=\"\
  3\" align=\"center\"\n                runat=\"server\" >\n            </TD>\n  \
  \          <TD width=\"25\">&nbsp;</TD>\n        </TR>\n        <TR>\n         \
  \   <TD width=\"25\"></TD>\n            <TD colspan=\"3\" align=\"right\">\n   \
  \             <dnn:PRINTMODULE runat=\"server\" id=\"dnnPRINTMODULE\" />\n     \
  \       </TD>\n            <TD width=\"25\"></TD>\n        </TR>\n    </TABLE>\n\
  </div>\n```\n\n9. 现在整个文件应该如下所示：\n\n```\n<%@ Control language=\"vb\"\n    CodeBehind=\"\
  ~/admin/Containers/container.vb\"\n    AutoEventWireup=\"false\" Explicit=\"True\"\
  \n    Inherits=\"DotNetNuke.UI.Containers.Container\" %>\n\n<%@ Register TagPrefix=\"\
  dnn\" TagName=\"ACTIONS\"\n    Src=\"~/Admin/Containers/SolPartActions.ascx\" %>\n\
  <%@ Register TagPrefix=\"dnn\" TagName=\"TITLE\"\n    Src=\"~/Admin/Containers/Title.ascx\"\
  \ %>\n<%@ Register TagPrefix=\"dnn\" TagName=\"VISIBILITY\"\n    Src=\"~/Admin/Containers/Visibility.ascx\"\
  \ %>\n<%@ Register TagPrefix=\"dnn\" TagName=\"PRINTMODULE\"\n    Src=\"~/Admin/Containers/PrintModule.ascx\"\
  \ %>\n\n<div class=\"container_bkg\">\n    <TABLE cellPadding=\"0\" width=\"100%\"\
  \ border=\"0\">\n        <TR>\n            <TD width=\"25\"></TD>\n            <TD\
  \ align=\"center\"><dnn:ACTIONS runat=\"server\"\n                    id=\"dnnACTIONS\"\
  \ /></TD>\n            <TD width=\"100%\" align=\"center\"><dnn:TITLE runat=\"server\"\
  \n                    id=\"dnnTITLE\" />\n            </TD>\n            <TD align=\"\
  center\"><dnn:VISIBILITY runat=\"server\"\n                    id=\"dnnVISIBILITY\"\
  \ />\n            </TD>\n            <TD width=\"25\"></TD>\n        </TR>\n   \
  \     <TR>\n            <TD width=\"25\">&nbsp;</TD>\n            <TD id=\"ContentPane\"\
  \ colspan=\"3\" align=\"center\"\n                runat=\"server\" >\n         \
  \   </TD>\n            <TD width=\"25\">&nbsp;</TD>\n        </TR>\n        <TR>\n\
  \            <TD width=\"25\"></TD>\n            <TD colspan=\"3\" align=\"right\"\
  >\n                <dnn:PRINTMODULE runat=\"server\" id=\"dnnPRINTMODULE\" />\n\
  \            </TD>\n            <TD width=\"25\"></TD>\n        </TR>\n    </TABLE>\n\
  </div>\n```\n\n## 基本皮肤制作\n\n10. 从“文件”菜单中选择“将 WebUserControl1.ascx 另存为...”。\n\n11.\
  \ 浏览到 ASCXContainer 文件夹，并将文件保存为 ASCXContainer.ascx。\n\n12. 接下来，通过从“文件”菜单中选择“新建文件...”来创建\
  \ CSS 文件。\n\n13. 在“新建文件”对话框中，选择“样式表”，然后单击“打开”。\n\n14. 将文件内容替换为：\n\n```\n/* General\
  \ Styles */\n.TitleLabel{color:GrayText;font-size: 15px;}\n.container_bkg {background-color:#DAE7F2;border:solid\
  \ 1px #4F839F;}\n```\n\n15. 从“文件”菜单中选择“将 StyleSheet1.css 另存为...”。\n\n16. 浏览到 ASCXContainer\
  \ 文件夹，并将文件保存为 container.css。\n\n17. 你还可以制作新容器的预览图像，例如：\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_266_0.png)\n\
  \n18. 将图像文件保存为 ASCXContainer.jpg。\n\n19. 要查看新容器在站点上的效果，首先以超级用户身份登录。\n\n20. 查看“管理”菜单，然后选择“皮肤”。\n\
  \n21. 从“容器：”下拉列表中选择 ASCXContainer。\n\n22. 新的 ASCXContainer 将立即出现：\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_266_1.png)\n\
  \n23. 若要查看容器的外观，请单击“预览”链接。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_267_0.png)\n\
  \n24. 这是一个简单的容器，但查看“赞助商”之类的模块时，你会看到左侧的悬停菜单，以及模块标题在容器中居中显示，背景为浅蓝色。\n\n## 创建自定义容器图像\n\
  \n容器不仅仅充当模块内容的占位符。通过扩展容器皮肤以包含图像，我们可以创建更精致的容器，仅受限于我们的创造力。\n\n使用图像设置 DNN 容器样式是一个分为两部分的过程。首先，我们必须创建所需的图像，并将它们保存为一组图形文件。然后，我们必须设计容器，将图像定位在容器周围。在本教程中，我们将了解如何创建用于设置容器样式的自定义图像。在下一个教程\
  \ “使用图像设置容器样式” 中，我们将了解如何定位这些图像以创建最终的容器。\n\n### 准备工作\n\n下面的示意图显示了最终容器的外观。我们需要创建图中以红色突出显示的五个图像。正如你在该图中所见，我们只需为特色元素创建图像。CSS\
  \ 可以通过根据需要重复背景图像来填补空白，以适应容器的大小。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_267_1.png)\n\
  \n为容器创建图像是一个四步过程：\n\n-   决定容器的哪些边使用图像。在此示例中，我们将为容器的顶部和底部边缘创建图像，并让左侧和右侧保持简单的边框线。\n\
  -   决定图像的尺寸。容器边框可以非常窄，也可以非常宽。在此示例中，我们将使用这些图像创建一个 27 像素宽的边框。\n-   决定哪些图像将平铺以支持可变尺寸的容器。由于容器可以拉伸或收缩，我们需要使用能够平铺的图像。也就是说，可以重复该图像任意多次，以填满容器的宽度。在此示例中，我们将选择一个图像在顶部平铺，另一个图像在底部平铺。由于两侧只是边框线，我们无需担心垂直平铺的问题。\n\
  -   选择一个绘图应用程序（例如 MS Paint）来创建图像，并将它们保存到临时文件夹。你可以使用各种格式——在此示例中，我们将图像保存为 GIF 文件以节省空间。\n\
  \n### 操作步骤...\n\n- 1. 首先启动你喜欢的绘图应用程序（例如 MS Paint）。\n- 2. 将图像尺寸设置为 98 像素宽、27 像素高。这些尺寸没有特别之处，只是对于这个特定的设计来说效果不错。\n\
  - 3. 绘制容器左上角的图像。该图像将作为模块标题的背景，因此它需要是一个可以水平平铺的图像，因为容器标题的长度会变化。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_268_0.png)\n\
  \n- 4. 将图像保存为名为 ContainerUL.gif 的 GIF 文件。\n- 5. 接下来，创建一个尺寸为 80 × 27 像素的新图像。该图像标志着模块标题的结束和顶部容器边框的开始。它不会平铺，在此示例中用于将左上角与横跨容器顶部的边框图像连接起来。\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_268_1.png)\n\n\n\n\n\n6. 将图像保存为名为 `ContainerUC1.gif`\
  \ 的 GIF 文件。\n\n7. 下一张图像是容器的顶部边框，并且会随着容器宽度的变化水平平铺。将属性设置为 12 像素宽 27 像素高。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_269_0.png)\n\
  \n8. 将图像保存为名为 `ContainerUC2.gif` 的 GIF 文件。\n\n9. 对于容器底部的边框，我们需要再两张图像。第一张是左下角。使此图像为\
  \ 90 像素宽 27 像素高。此图像将沿底部平铺以适应容器的宽度。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_269_1.png)\n\
  \n10. 将图像保存为名为 `ContainerLL.gif` 的 GIF 文件。\n\n11. 最后一张图像用于右下角。此图像不平铺。使其为 100 像素宽\
  \ 27 像素高。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_269_2.png)\n\n12. 将图像保存为名为\
  \ `ContainerLR.gif` 的 GIF 文件。\n\n13. 此时你应该在临时文件夹中有五张图像，看起来像这样：\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_270_0.png)\n\
  \n### 还有更多...\n\n在本教程中，我们看到了如何为容器创建图像，以及图像如何构成容器边框的原理。在下一个教程中，我们将看到如何创建将使用这些图像的容器。\n\
  \n## 使用图像设置容器样式\n\n正如我们在上一教程中所见，使用图像设置容器样式的第一步是创建图像。在本教程中，我们将迈出第二步，通过添加将创建容器图形边框的图像来扩展简单的\
  \ ASCX 容器。我们还将演示如何更改字体和文本颜色。\n\n### 准备工作\n\n要跟随本教程，你必须已完成以下教程：\n\n- *创建简单的 ASCX\
  \ 容器*\n- *创建自定义容器图像*\n\n### 如何操作...\n\n1. 首先在测试 DNN 门户中定位默认容器文件夹（`\\Portals\\_default\\\
  Containers`）。\n\n2. 接下来，创建一个新的文件夹来存放容器文件。将此文件夹命名为 `ASCXImageContainer`。\n\n3. 在其中创建新的文件夹来存放图像：`ASCXImageContainer\\\
  images`。\n\n4. 将你在上一教程中创建的五张图像复制到此新文件夹。你现在应该有以下文件：\n\n- ContainerUL.gif：容器的左上角\n\
  - ContainerUC1.gif：第一个上部居中图像\n- ContainerUC2.gif：第二个上部居中图像\n- ContainerLL.gif：左下角\n\
  - ContainerLR.gif：右下角\n\n5. 将图像放在正确的文件夹后，启动开发工具。\n\n6. 要创建 ASCX 文件，从 **File** 菜单中选择\
  \ New File...。\n\n7. 在 New File 对话框中，选择 Web User Control 并单击 Open。\n\n8. 第一步是在文件顶部放置以下指令：\n\
  \n```\n<%@ Control language=\"vb\"\n    CodeBehind=\"~/Admin/Containers/container.vb\"\
  \n    AutoEventWireup=\"false\" Explicit=\"True\"\n    Inherits=\"DotNetNuke.UI.Containers.Container\"\
  \ %>\n```\n\n9. 接下来，放置我们需要支持容器的 Skin Objects 的必要注册指令：\n\n```\n<%@ Register TagPrefix=\"\
  dnn\" TagName=\"ACTIONS\"\n    Src=\"~/Admin/Containers/SolPartActions.ascx\" %>\n\
  <%@ Register TagPrefix=\"dnn\" TagName=\"ICON\"\n    Src=\"~/Admin/Containers/Icon.ascx\"\
  \ %>\n<%@ Register TagPrefix=\"dnn\" TagName=\"TITLE\"\n    Src=\"~/Admin/Containers/Title.ascx\"\
  \ %>\n<%@ Register TagPrefix=\"dnn\" TagName=\"VISIBILITY\"\n    Src=\"~/Admin/Containers/Visibility.ascx\"\
  \ %>\n<%@ Register TagPrefix=\"dnn\" TagName=\"ACTIONBUTTON1\"\n    Src=\"~/Admin/Containers/ActionButton.ascx\"\
  \ %>\n<%@ Register TagPrefix=\"dnn\" TagName=\"ACTIONBUTTON2\"\n    Src=\"~/Admin/Containers/ActionButton.ascx\"\
  \ %>\n<%@ Register TagPrefix=\"dnn\" TagName=\"ACTIONBUTTON3\"\n    Src=\"~/Admin/Containers/ActionButton.ascx\"\
  \ %>\n<%@ Register TagPrefix=\"dnn\" TagName=\"ACTIONBUTTON4\"\n    Src=\"~/Admin/Containers/ActionButton.ascx\"\
  \ %>\n<%@ Register TagPrefix=\"dnn\" TagName=\"ACTIONBUTTON5\"\n    Src=\"~/Admin/Containers/ActionButton.ascx\"\
  \ %>\n```\n\n10. 为了定位图像，我们首先使用一个包含的表格来设置容器的样式，然后包含容器的顶部表格、ContentPane 的位置，然后是另一个表格来容纳容器底部的图像：\n\
  \n```html\n<table width=\"100%\" border=\"0\" align=\"center\" cellpadding=\"0\"\
  \ cellspacing=\"0\" class=\"ASCXImage_Master\">\n<tr>\n<td class=\"ContainerUC2\"\
  >\n<table height=\"27\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\">\n<tr>\n\
  <td valign=\"top\" class=\"ContainerUL\">\n<dnn:ACTIONS runat=\"server\" id=\"dnnACTIONS\"\
  \ />\n</td>\n<td valign=\"top\" class=\"ContainerUL\">\n<dnn:ICON runat=\"server\"\
  \ id=\"dnnICON\" />\n</td>\n<td valign=\"top\" class=\"ContainerUL\">&nbsp;\n<dnn:TITLE\
  \ runat=\"server\" id=\"dnnTITLE\" CssClass=\"ASCXImage_Title\"/>\n</td>\n<td valign=\"\
  top\" class=\"ContainerUC1\">&nbsp;</td>\n<td valign=\"bottom\" class=\"ContainerUC2\"\
  >&nbsp;</td>\n</TR>\n</table>\n<table width=\"100%\" border=\"0\" align=\"center\"\
  \ cellPadding=\"0\" cellSpacing=\"0\">\n<tr>\n<td class=\"ASCXImage_Content\">\n\
  <div runat=\"server\" id=\"ContentPane\">\n</div>\n</td>\n</TR>\n</table>\n<table\
  \ width=\"100%\" height=\"21\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\"\
  >\n<tr>\n<td valign=\"middle\" class=\"ContainerLL\">&nbsp;</td>\n<td valign=\"\
  middle\" class=\"ContainerLR\">&nbsp;</td>\n</tr>\n</table>\n</td>\n</tr>\n</table>\n\
  ```\n\n11. 最后，我们创建表格来容纳操作按钮，这些按钮位于边框图像之外：\n\n```html\n<table width=\"100%\" height=\"\
