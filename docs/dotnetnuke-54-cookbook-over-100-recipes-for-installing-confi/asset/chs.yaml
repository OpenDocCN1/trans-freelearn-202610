  ## 工作原理...\n\n在本操作指南中，我们使用 Web PI 安装程序下载并安装 DNN 站点。要完成安装，请参阅下一个操作指南 *运行 DotNetNuke\
  \ 安装*。\n\n## 运行 DotNetNuke 安装\n\n当所有组件就绪后，最后一步是访问 DNN Web 并运行最终安装代码。\n\n### 准备工作\n\
  \n此时，你必须已成功完成以下操作指南：\n\n- *下载 Microsoft Web 平台安装程序*\n- *安装 SQL Server Express*\n\
  - *下载并安装 DotNetNuke 包*\n\n### 操作步骤...\n\n- 1. 打开你喜欢的 Web 浏览器并访问新站点（例如 `http://localhost/DotNetNuke`）。\n\
  \n- 15. 单击“下一步”。创建数据库表和存储过程时，你会看到状态消息。最后应出现“数据库安装完成”的消息。如果安装成功，拍拍自己的肩膀，单击“下一步”。\n\
  \n- 16. 现在，向导将首先创建两个用户：控制整个 DNN 安装的超级用户（SuperUser）和管理门户且权限有限的管理员用户（Administrator）。\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_27_0.png)\n\n- 17. 对于“名”，保留默认的 SuperUser。\n\
  - 18. 对于“姓”，输入 Account。\n- 19. 选择一个用户名（避免使用标准的 host 作为用户名，它太常见了）。\n- 20. 选择一个好的密码并确认。然后将它写下来，稍后你会用到。\n\
  - 21. 提供你的电子邮件地址以接收系统消息。\n\n- 22. 单击“下一步”并提供管理员用户的详细信息。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_28_0.png)\n\
  \n- 23. 对于“名”，保留默认的 Administrator。\n- 24. 对于“姓”，输入 Account。\n- 25. 选择一个用户名（避免使用标准的\
  \ admin 作为用户名，它太常见了）。\n- 26. 选择一个好的密码并确认。然后将它写下来，稍后你会用到。\n- 27. 提供你的电子邮件地址以接收系统消息。\n\
  - 28. 最后，向导会提示输入站点的基本信息。为你的站点选择一个标题，并将其输入到“门户标题”中。\n- 29. 为模板选择“默认网站”。\n- 30. 单击“下一步”。\n\
  - 31. 当看到祝贺屏幕时，单击“完成（转到站点）”以完成安装。\n- 32. 稍等片刻后，你会看到新网站的欢迎屏幕。恭喜！你已成功安装并设置了 DNN 网站。\n\
  \n- 4. 你会首先注意到页面顶部的“控制面板”。它包含维护站点的实用工具，分为四个类别：常用任务、当前页面、管理和主机。其中一些工具也可以在主机或管理菜单下找到，但在“控制面板”中更容易找到。\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_30_0.png)\n\n- 5. 单击“管理”以显示管理任务，然后点击左上角的“站点设置”图标。\n\
  - 6. 这将显示“站点设置”表单。这是 DNN 中典型的数据输入表单。你看到的字段带有标签，也有一些标题（如“基本设置”）旁边带有小减号。这些是可折叠面板。你可以通过单击减号来隐藏表单的某些部分。你还会看到所有字段旁边有小的“帮助”图标，点击这些图标可能会提供有关该字段的更多信息。\n\
  \n## 站点设置\n\n### 基本设置\n\n在此部分，你可以设置站点的基本设置。\n\n### 站点详细信息\n\n- 7. 开始填写此表单，输入以下信息：\n\
  \  - 标题：My Own Personal DNN Website\n  - 描述：My first DNN site\n  - 版权：Copyright\
  \ 2010 by DNN Newbee\n\n- 8. 单击“外观”旁边的小加号以展开面板，显示与站点外观相关的字段。\n- 9. 你可以通过单击“徽标：”提示旁边的“上传文件”链接，将自己的徽标上传到站点。\n\
  \n### 外观\n\n- 10. 这将使“浏览”按钮和两个新链接出现。单击“浏览”按钮。\n- 11. 当出现“选择文件”对话框时，浏览你的文件并选择要上传的图像文件。通常，徽标图像最好是较宽，但不要太高，大约\
  \ 300×100 像素。\n\n- 12. 单击**确定**关闭文件对话框。\n- 13. 然后点击**保存文件**链接，将文件真正上传到 Web 服务器供\
  \ DNN 显示。现在，文件名将出现在表单中。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_32_0.png)\n\n\
  - 14. 单击页面底部的**更新**以保存更改。\n\n## 工作原理...\n\n**站点设置**页面提供多种可设置的选项，其中许多将在后续章节中探讨。你可以随意尝试不同的选项。如果看起来不对，你可以回到此屏幕并将其改回。\n\
  \n## 为站点选择皮肤\n\n这是一个快速简便的操作指南，用于更改 DNN 站点的配色方案（称为“皮肤”）。下载 DNN 时，它自带一个基本皮肤。不过，你可以下载不同的皮肤，选择你希望访问者看到的那一款。你甚至可以为站点管理员选择不同的皮肤。\n\
  \n### 准备工作\n\nDNN 的典型安装只有一个皮肤。要遵循本操作指南，你需要至少下载另一个皮肤才能切换。如果你的站点只有一个皮肤，你仍然可以跟着操作，了解如何更改。或者尝试操作指南\
  \ *下载扩展（皮肤或模块）* 为你的站点下载更多皮肤，然后再回来了解如何更改它们。\n\n### 操作步骤...\n\n- 1. 以门户管理员身份登录（在我们的示例中为\
  \ `sysadmin`）。\n- 2. 从**管理**菜单中选择**皮肤**。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_33_0.png)\n\
  \n- 3. 找到显示站点上已安装可用皮肤的下拉列表。如果没有看到所需皮肤，请参阅操作指南 *下载扩展（皮肤或模块）* 以安装更多皮肤。\n- 4. 从下拉列表中选择你想要的皮肤。然后会显示皮肤的样例。\n\
  - 5. 单击**预览**以查看应用所选皮肤后站点的外观。\n- 6. 如果你喜欢它的外观，单击**应用**将皮肤应用到你的站点。\n- 7. 如果你只想为管理员用户设置不同的皮肤，请找到标记为**门户**和**管理**的两个复选框。取消选中**门户**，保持**管理**选中，然后按上述方式应用皮肤。\n\
  \n## 工作原理...\n\nDNN 中的皮肤是一种布局。DNN 中的视觉元素（如登录链接、版权短语和站点徽标）以简单标记的形式呈现在皮肤中，这些标记可以轻松地重新定位在布局中。皮肤的目的是将站点的功能与视觉布局分离。它允许美工设计站点而无需担心代码的工作原理；反过来，程序员可以编写站点代码而无需担心图形的工作原理。它为网站的所有页面提供了一致的外观。\n\
  \n## 另请参阅\n\n参见下一个操作指南以了解更改站点视觉外观的更多方法。\n\n## 为站点选择容器\n\n皮肤控制站点的布局和配色方案，但 DNN 站点的实际内容（博客、新闻文章等）包含在称为“容器”的视觉块中。容器帮助你布局站点，但你也可以像为页面本身选择视觉样式一样，为这些容器选择视觉样式。\n\
  \n### 操作步骤...\n\n- 1. 以门户管理员身份登录（在我们的示例中为 `sysadmin`）。\n- 2. 从管理菜单中选择**皮肤**。\n-\
  \ 3. 找到显示站点上已安装可用皮肤的下拉列表。\n- 4. 从下拉列表中选择一个皮肤。然后会显示皮肤样例以及皮肤内的容器。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_34_0.png)\n\
  \n\n\n\n\n5. 查看可用的容器并点击 **Preview** 查看选择容器后网站的外观。\n6. 如果您喜欢其外观，请点击 **Apply** 将容器应用到您的网站。\n\
  7. 如果您希望仅为 Administrator 用户使用不同的容器，请找到标记为 **Portal** 和 **Admin** 的两个复选框。取消选中 **Portal**\
  \ 并保留 **Admin** 选中，然后按上述方式应用容器。\n\n## How it works...\n\n容器通常位于皮肤内，因此容器可用的样式由您选择的皮肤决定。这就是为什么您必须先选择皮肤才能看到可用的容器。然而，DNN\
  \ 非常灵活，允许您将一种皮肤分配给网站的页面，同时也允许使用来自完全不同皮肤的容器。您可以自由混合搭配容器和皮肤，以实现网站的最佳外观。\n\n## See\
  \ also\n\n有关如何更改网站页面外观的更多信息，请参阅食谱 *Choosing a skin for the site.*\n\n## Adding a\
  \ module to a page\n\nDNN 中的模块是一种将内容组织成易于使用（也易于重用）的插件的方式。您只需创建一次论坛或博客，但您可以“将其插入”到网站的任何页面中任意多次。这就是您通过创建页面并插入您拥有的模块来构建网站的方式。\n\
  \n## Getting ready\n\n本食谱所需的唯一条件是您网站中的一个页面。您可以将模块添加到主页或创建一个新页面来容纳您的模块。在此示例中，我们将把一个\
  \ Banner Ads 模块添加到名为 **Our Sponsors** 的新页面。\n\n## Installation and Setup\n\n## How\
  \ to do it...\n\n- 1. 以 Portal Administrator 身份登录（在我们的示例中为 `sysadmin`）。\n- 2. 确保控制面板显示在页面的顶部（控制面板是您以管理员身份登录时看到的一组图标）。\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_36_0.png)\n\n- 3. 点击左侧的 **New** 图标。这将创建一个新页面。\n\
  - 4. 对于 **Page Name**，使用 Our Sponsors。\n- 5. 对于 **Page Title**，使用 Our Sponsors。\n\
  - 6. 保持其余设置默认为默认值并点击 **Update** 以创建页面。\n- 7. 接下来，查看控制面板顶部中央并确保选择了 **Add Module:\
  \ New**。\n- 8. 找到出现在 **Module:** 提示符旁边的下拉列表。选择 **Banners**。\n- 9. 找到 **Pane:** 提示符旁边的下拉列表并确保选择了\
  \ **ContentPane**。\n- 10. 在 **Title** 框中，输入 A Word from Our Sponsors。\n- 11. 在标记为\
  \ **Insert:** 的下拉列表中，确保显示 **Bottom**。\n- 12. 点击 **Add Module** 按钮将 Banners 模块插入您正在查看的页面。\n\
  - 13. 就这些。一旦模块被添加到页面，您必须在开始使用之前设置模块的选项。有关设置特定模块的更多详细信息，请参阅 *Chapter 3, Easy tricks\
  \ with existing modules.*\n\n## How it works...\n\n将模块添加到页面是一项简单的任务，您会经常执行。 在 DNN\
  \ 中构建网站只是将模块添加到页面以创建您需要的功能。\n\n控制面板提供其他用于在页面上定位模块的选项。示例使用了 ContentPane（即中心窗格），但您也可以将模块定位在左侧、右侧、顶部和底部窗格中。\n\
  \n当页面上已有模块时，Insert 下拉列表控制新模块应显示在现有模块的上方还是下方。同样，这些只是帮助您在所选页面上定位模块的选项。请随意尝试模块定位，以更好地了解什么在您的网站上看起来更好。\n\
  \n## Installing standard DNN modules\n\nDNN 开箱即用包含许多模块，但最初只安装了最受欢迎的模块。这是 DNN 制作者有意识的决定，以便新的\
  \ DNN 网站不会因运行大量不需要的模块而变慢。这使得安装更高效，但也意味着您在创建网站后需要安装几个标准模块。\n\n## How to do it...\n\
  \n- 1. 以 SuperUser 身份登录（在我们的示例中为 syshost）。\n- 2. 查看控制面板并确保您处于编辑模式。\n- 3. 在 Host\
  \ 菜单下选择 Extensions。\n- 4. 滚动到底部并点击 Install Available Extensions 链接或将鼠标悬停在模块操作菜单上并选择它。\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_37_0.png)\n\n- 5. 选中您想要安装的模块。对于本书中的食谱，请选择以下模块：\n\
  \  - Announcements\n  - Blog\n  - Documents\n  - Events\n  - FAQs\n  - Forum\n \
  \ - IFrame\n  - Links\n  - Reports\n  - Wiki\n- 6. 滚动到页面底部并点击 **Install Selected\
  \ Extensions.**\n- 7. 现在这些模块中的每一个都将出现在控制面板中。\n\n## How it works...\n\n通过安装这些额外的模块，您可以在页面上放置更多功能。\n\
  \n## Downloading an extension (skin or module)\n\nDNN 中的扩展由一组文件组成，放在一个压缩文件夹中（也称为\
  \ ZIP 文件）。要安装新扩展，您只需提供 ZIP 文件，DNN 扩展向导就会完成其余工作。只有 SuperUser 才能安装新的皮肤和模块。\n\n获取 DNN\
  \ 网站新扩展的一种好方法是将其从互联网下载。有时它们是免费的或只需少量费用。在后面的章节中，您将看到如何制作自己的扩展。无论您如何获取扩展，它都将由一个单一的\
  \ ZIP 文件组成，您需要将其上传到 DNN 服务器并安装，然后它才会像我们在 Adding a module to a page 中看到的那样出现在控制面板下拉列表中。\n\
  \n下载 DNN 扩展的热门网站有 www.codeplex.com（免费开源模块）、DotNetNuke Forge（www.dotnetnuke.com）和\
  \ www.snowcovered.com（主要是商业模块）。您可能需要为该网站注册一个帐户，但注册是免费的。\n\n本食谱将展示如何下载扩展（本示例中为免费皮肤），但该过程对于所有不同类型的扩展（例如模块和外语包）基本相同。\n\
  \n## How to do it...\n\n- 1. 打开您喜欢的浏览器并前往 www.snowcovered.com。\n- 2. 在屏幕顶部找到 **Register**\
  \ 链接（在 **Help** 图标旁边）并点击它。如果您已在此网站拥有 ID，可以点击 **Login**，提供您的用户名和密码，然后跳到步骤 4。\n- 3.\
  \ 填写您的姓名并选择在此网站使用的用户名和密码。填写任何其他必填字段并点击 Register。\n- 4. 成功登录或注册后，您将看到欢迎页面，显示最新的模块和皮肤。在左上角，点击浏览链接列表中的\
  \ DotNetNuke 5。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_39_0.png)\n\n- 5. 这将显示\
  \ DNN 5 的所有模块和皮肤的列表。我们正在寻找免费皮肤，因此在左上角的浏览列表中找到并点击 Skins 链接。\n- 6. 接下来，找到显示为 Release\
  \ Date 的下拉列表并选择 Price: Low to High。然后点击 Sort 链接。这将首先显示免费皮肤。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_39_1.png)\n\
  \n- 7. 查看免费皮肤并选择一个您认为在网站上看起来不错的皮肤。在此示例中我们将选择一个名为 Greyt ness 的皮肤，但您可以选择您喜欢的任何一个。点击它以进入皮肤详细信息屏幕。\n\
  - 8. 检查皮肤的详细信息（尤其是价格，如果是免费皮肤则为 $0）。然后点击页面右侧的 Add to Cart 链接。\n- 9. 消息将确认皮肤已添加到您的购物车。现在点击\
  \ View Cart 链接以完成交易。\n\n## Installation and Setup\n\n- 10. 下一个屏幕显示您正在下载的皮肤。点击 **Proceed\
  \ to Checkout** 按钮。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_40_0.png)\n\n- 11.\
  \ 在付款页面，输入您的电子邮件地址。点击 **Continue** 按钮。\n- 12. 如果您尚未登录 SnowCovered 网站，您将被要求输入用户名和密码。否则您将直接进入付款页面。\n\
  - 13. 付款页面将显示您的帐户信息。确保所有必填字段都已填写并点击 **Continue**。\n- 14. 下一个屏幕将显示销售协议和条款。点击 **Agree\
  \ to terms** 复选框并点击 **Confirm Order**。\n- 15. 最后一页将提供一个名为 **My Downloads** 的链接。点击此链接。\n\
  - 16. 在待处理下载列表中，点击皮肤旁边的 **Downloads**。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_40_1.png)\n\
  \n- 17. 在下一页，点击 **Download** 链接。\n- 18. 文件下载对话框将询问您是否要打开或保存。点击 **Save** 并选择一个临时文件夹来保存\
  \ ZIP 文件。\n- 19. 这就是我们从 SnowCovered 网站需要做的全部内容，因此关闭浏览器。\n- 20. 还有一件事我们需要做。通常当我们下载扩展时，我们真正需要的\
  \ ZIP 文件在我们下载的 ZIP 文件内部。我们需要查看我们刚刚获得的 ZIP 文件并提取我们需要的 ZIP 文件。前往您保存下载文件的位置的临时文件夹。\n\
  - 21. 右键点击您下载的文件并选择 **Open With | Compressed (zipped) Folders**。\n\n\n\n\n\n## 安装和设置\n\
  \n- 3. 查看控制面板并确保你处于编辑模式（不是查看模式）。\n- 4. 进入菜单 **Admin | Extensions**。\n- 5. 滚动到页面底部并点击名为\
  \ **Install Extension Wizard** 的链接。你也可以从模块操作菜单中选择它。\n- 6. 点击 **Browse** 按钮并选择 ZIP\
  \ 文件（在我们的示例中为 `Greyt ness_01.00.00_Install.zip`）。\n- 7. 点击 **Next**。\n- 8. 如果你看到一个关于缺少清单的警告屏幕，不要惊慌！这可能意味着你跳过了下载配方中的步骤，并且正在尝试加载你直接从\
  \ SnowCovered 获取的 ZIP 文件。点击 **Cancel** 并重复配方 *Downloading an extension (skin or\
  \ module)* 中的步骤来提取 DNN5 的 ZIP 文件。\n- 9. 如果一切正常，你将看到 **Install Extension** 页面。它显示了皮肤文件的详细信息。点击\
  \ **Next** 来安装它。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_42_0.png)\n\n- 10.\
  \ 在发行说明页面，点击 **Next**。\n- 11. 如果你看到 **Review License** 页面，勾选 **Accept License**\
  \ 并点击 **Next**。\n- 12. 最后一个屏幕是 **Package Installation Report**，它应列出为皮肤加载的所有项目，并在底部显示最终信息\
  \ **Installation Successful**。如果看到错误信息，则皮肤文件可能存在问题。尝试加载不同的皮肤。\n- 13. 点击 **Return**\
  \ 完成皮肤安装。\n- 14. 皮肤现在可在你的网站上使用。如果你进入菜单 **Admin | Extensions**，你现在会看到新皮肤出现在皮肤下拉列表中。\n\
  \n## 为你的网站启用用户注册\n\n一旦你安装了 DNN 网站，你首先要考虑的就是如何为其创建用户。在 DNN 中，用户是通过用户注册流程创建的。你可以通过选择四种会员选项之一来控制用户如何加入网站：\n\
  \n- None：用户无法自行注册。相反，门户管理员必须根据需要创建每个用户。\n- Private：用户自行创建注册，但门户管理员在用户可以访问网站之前批准用户注册。\n\
  - Public：用户自行创建注册并立即获得访问权限。\n- Verified：用户自行创建注册并通过点击确认邮件中的链接获得访问权限。\n\n在本配方中，我们将展示如何设置网站的用户注册并演示\
  \ Verified 会员的工作方式。\n\n### 准备工作\n\n使用 Private、Public 或 Verified 会员时，门户管理员和新用户在注册过程中都会收到电子邮件提醒。为了在本配方中看到整个流程的演示，你需要一个有效的电子邮件地址，并且网站必须设置好发送电子邮件。要以这种方式设置你的网站，请参阅本章末尾的配方\
  \ *Setting up a SMTP server with Gmail*。\n\n### 如何操作...\n\n- 1. 首先以门户管理员身份登录（在我们的示例中为\
  \ sysadmin）。\n- 2. 查看控制面板并确保你处于编辑模式。\n- 3. 在 **Admin** 菜单下选择 **Site Settings**。\n\
  - 4. 在 **Advanced Settings** 下展开 **Security Settings**。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_46_0.png)\n\
  \n- 5. 将注册类型选择为 **Verified**。\n- 6. 点击页面底部的 **Update** 保存更改。\n\n7. 要测试新设置，通过点击注销链接退出网站。\n\
  \n8. 通过选择非 None 的会员类型，你现在会在登录链接旁边看到注册链接：\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_47_0.png)\n\
  \n9. 注册链接现在也会出现在登录页面上：\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_47_1.png)\n\n\
  10. 点击注册链接将显示用户注册表单，用户可以在其中提供其信息：\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_47_2.png)\n\
  \n11. 点击注册链接创建用户。\n\n12. 由于会员为 Verified，新用户将收到一封包含完成注册并将用户添加到网站的链接的特殊电子邮件。电子邮件看起来像这样：\n\
  \n```\nFrom: admin@mycompany.abc [mailto:admin@mycompany.abc]\nSent: Friday, September\
  \ 17, 2010 12:59 PM\nTo: Richard Roe\nSubject: MyCompany Intranet New User Registration\n\
  \nDear Richard Roe,\n\nWe are pleased to advise that you have been added as a Registered\
  \ User to MyCompany Intranet. Please read the following information carefully and\
  \ be sure to save this message in a safe location for future reference.\n\nPortal\
  \ Website Address: www.mycompany.abc\nUsername: sjones\nPassword: dnnuser\nVerification\
  \ Code: 0-7\n\nYou can use the following link to complete your verified registration:\n\
  \nhttp://www.mycompany.abc/default.aspx?ctl=Login&username=rroe&verificationcode=0-7\n\
  \nThank you, we appreciate your support...\n\nMyCompany Intranet\n```\n\n13. 当新用户点击电子邮件中的链接时，他们会被带到登录页面，其中现在会出现额外的验证码字段。提供密码和验证码后，用户即可获得访问权限：\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_48_0.png)\n\n## 工作原理...\n\n允许用户自行在你的网站上注册，可以减轻管理员创建用户的负担。通过\
  \ Private、Public 和 Verified 选项，你可以根据需要尽可能多或尽可能少地控制用户注册流程。\n\n## 更多内容...\n\n当用户尝试在网站上注册时，门户管理员会收到电子邮件提醒，以便管理员采取适当的步骤完成注册。以下是示例：\n\
  \n```\nFrom: admin@mycompany.abc [mailto:admin@mycompany.abc]\nSent: Friday, September\
  \ 17, 2010 12:59 PM\nTo: System Administrator\nSubject: MyCompany Intranet New User\
  \ Registration\n\nDate: Friday, September 17, 2010\nFirst Name: Richard\nLast Name:\
  \ Roe\nUnit:\nStreet:\nCity:\nRegion:\nCountry: N/A\nPostal Code:\nTelephone:\n\
  Email: rroe@mycompany.abc\n```\n\n## 另请参阅\n\n用户注册表单上出现的字段（名字、姓氏等）是用户资料的一部分。要了解如何添加自己的字段并使其成为注册必填项，请参阅本章后面的配方\
  \ *Managing profile properties*。\n\n## 创建用户并授予访问权限\n\n在之前的配方中，我们看到了如何允许用户通过用户注册流程在你的门户中自行创建。在管理员方面，你也有直接创建用户的选项（事实上，如果你关闭用户注册，你必须直接创建用户）。本配方将向你展示如何创建自己的用户，为其分配密码，并授予他们访问你门户不同页面的权限。\n\
  \n### 准备工作\n\n要创建用户，你只需要门户管理员登录。但有一些决定需要做出。新用户在账户创建时是否应收到电子邮件通知？是否应自动授权他们以便立即登录？是否应为他们分配随机密码并强制他们在首次登录时更改？本配方展示了如何设置这些选项。\n\
  \n### 如何操作...\n\n- 1. 首先以门户管理员身份登录（在我们的示例中为 `sysadmin`）。\n- 2. 查看控制面板并确保你处于编辑模式。\n\
  - 3. 在 **Admin** 菜单下选择 **User Accounts**。你也可以在控制面板的 Admin 选项卡中选择用户图标。\n- 4. 页面显示用户列表。\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_50_0.png)\n\n- 5. 要创建新用户，请查看页面底部并点击 **Add\
  \ New User** 链接（或从操作菜单中选择它）。\n\n\n\n\n## 管理用户与站点设置\n\n6. 此时会显示“添加新用户”表单。使用以下信息填写表单：\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_51_0.png)\n\n- 用户名：jsmith\n- 名：John\n\
  - 姓：Smith\n- 显示名：Professor Smith\n- 电子邮件地址：jsmith@yourcompany.com\n- 授权：选中\n- 通知：未选中\n\
  - 随机密码：未选中\n- 密码/确认密码：rfid2010\n\n7. 单击“添加新用户”以保存更改并创建用户。\n\n8. 接下来，我们需要分配安全角色。新用户会自动获得“注册用户”角色和“订阅者”角色。我们也可以将自己的安全角色授予\
  \ jsmith。\n\n9. 在用户帐户列表中找到 `jsmith`。单击名称旁边的锁形图标，显示**管理角色**页面。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_52_0.png)\n\
  \n10. 在左侧，你会看到**安全角色**标签，其下方是一个下拉列表，列出门户中的所有角色。在列表中找到**贡献者**角色并选择它。\n\n11. 将**生效日期**设为今天，并将**到期日期**留空。\n\
  \n12. 取消勾选**发送通知？**\n\n13. 单击**向用户添加角色**链接以保存更改。\n\n14. **贡献者**角色现在应出现在页面左下角的角色列表中。\n\
  \n15. 单击**取消**关闭页面，因为我们的更改已完成。\n\n### 工作原理...\n\n由于这是一个测试用户，我们让**通知**保持未选中，因此不会发送电子邮件。如果选中**通知**，则创建帐户时用户会收到一封电子邮件。如果我们选择**随机密码**，则随机密码会出现在电子邮件中。包含随机密码的通知电子邮件如下所示：\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_53_0.png)\n\n警报电子邮件中显示的文本是完全可自定义的。你可以通过从**管理**菜单（或控制面板）中选择**语言**，再点击门户语言旁边的铅笔图标来找到它。要了解有关此类文本本地化的更多信息，请参阅第9章“编辑语言资源文件”中的操作指南。\n\
  \n### 更多内容...\n\n创建用户并定义安全访问权限后，剩下的最后一件事是定义哪些安全角色可以查看门户模块。\n\n### 另请参阅\n\n要了解如何为不同模块分配安全访问权限，请参阅本章后面的**授予模块访问权限**操作指南。\n\
  \n### 创建并分配安全角色\n\n作为门户管理员，你必须首先做的事情之一就是定义门户的安全设置。安全角色将访问权限授予分配给该角色的所有用户，并且与权限结合使用时，可以允许某些页面公开，某些页面私有。\n\
  \n### 准备工作\n\n要创建安全角色，你需要使用宿主或门户管理员登录。要确定你需要哪些安全角色，请考虑访问站点的不同类型用户。例如，如果你有一个新闻网站，可以创建一个名为“贡献者”的组。通过为这个组创建安全角色，你可以赋予他们编辑内容的权限，而普通用户则没有这种权限。\n\
  \n### 操作步骤...\n\n1. 首先以门户管理员身份登录（在我们的示例中为 `sysadmin`）。\n2. 查看控制面板，确保你处于编辑模式。\n3.\
  \ 在**管理**菜单下，选择**安全角色**。\n4. 此页面将显示你当前拥有的所有安全角色。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_54_0.png)\n\
  \n5. 单击标记为**添加新角色**的链接（或从操作菜单中选择它）。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_54_1.png)\n\
  \n6. 显示**编辑安全角色**页面时，输入以下信息：\n\n- 角色名称：贡献者\n- 描述：用于指定可以贡献内容的用户的角色\n- 角色组：<全局角色>\n\
  - 公共角色：未选中\n- 自动分配：未选中\n\n7. 单击**更新**按钮以创建角色。\n\n### 工作原理...\n\n创建安全角色后，你可以将其分配给用户，然后利用\
  \ DNN 灵活的安全机制，将其分配到门户中的页面或模块。这样可以控制对门户内容的访问。\n\n### 更多内容...\n\n安装 DNN 时，系统会为你创建五个安全角色：\n\
  \n- 管理员：此角色授予对所选门户的完全访问权限。\n- 注册用户：这是任何已获得网站用户名和密码的用户。\n- 订阅者：这是一个公共角色的示例，适用于新闻简报模块。用户可以自行注册和取消注册该角色成员资格。\n\
  - 未注册用户：这些是访问你的站点但尚未登录的公共用户。\n- 所有用户：当你希望向所有用户授予访问权限时（无论他们是否已登录），使用此特殊角色。\n\n这些安全角色可以满足门户所需的大部分安全控制，但有时你需要创建更符合业务需求的安全角色。\n\
  \n### 另请参阅\n\n有关如何使用你创建的角色的示例，请参阅接下来的两个操作指南：\n\n- 授予模块访问权限\n- 封禁和删除用户\n\n### 授予模块访问权限\n\
  \n定义安全角色并将其分配给用户后，最后一步是决定哪些用户可以访问门户中的模块。你可以通过两种方式指定模块的访问权限：模块可以从其所在页面继承访问权限，也可以关闭继承并直接在模块上指定哪些安全角色可以访问它。有些模块对所有用户可用，而另一些模块则是私有的。如果你没有模块所需的安全角色，则门户页面显示时将看不到该模块。\n\
  \n### 准备工作\n\n对于本操作指南，你需要一个模块。默认的 DNN 门户包含一个名为 **Sponsors** 的小型 HTML 模块，它显示一些支持\
  \ DNN 的公司。我们将把通常私有的模块设为公共，让每个人都能看到它。请记住，下面的操作指南适用于 DNN 中的任何模块，而不仅仅适用于 Sponsors。\n\
  \n### 操作步骤...\n\n1. 首先以门户管理员身份登录（在我们的示例中为 `sysadmin`）。\n2. 查看门户首页，向下滚动到页面底部。找到 **Sponsors**，或使用页面上看到的任何模块。\n\
  3. 找到模块操作菜单。它是模块名称旁边的小三角形。将鼠标悬停在小三角形上，操作菜单就会显示。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_56_0.png)\n\
  \n4. 从操作菜单中选择**设置**。此时会显示**模块设置**表单。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_57_0.png)\n\
  \n5. 确保**从页面继承查看权限**未被选中。这将允许你在模块级别设置安全性。\n\n6. 在**权限**提示下，将列出 DNN 随附的五个安全角色以及你创建的任何安全角色。要授予未注册用户（即普通公众）查看权限，请确保：\n\
  \n- **所有用户**已选中\n- **注册用户**未选中\n- **未认证用户**未选中\n\n7. 单击页面底部的**更新**以保存更改。\n\n8. 要测试安全性，请单击**退出登录**链接，成为未认证用户。\n\
  \n9. 查看首页并滚动到页面底部。即使未登录，**Sponsors** 模块现在也应该出现。它现在是一个公共模块。\n\n### 更多内容...\n\n在本操作指南中，我们看到了一个在模块级别控制用户访问的简单示例，但\
  \ DNN 中的安全性由多个不同级别决定。你可以在页面级别控制访问权限，并让页面上的模块继承相同的访问权限，也可以在模块级别覆盖这些权限以进行额外控制。但在为站点选择安全设置时，可能还需要考虑其他因素。用户可以拥有多个安全角色，某些模块（例如博客模块）还内置了额外的安全层。最好仔细考虑你的安全决策，并在部署到生产站点之前进行测试。\n\
  \n### 另请参阅\n\n有关用户帐户安全的更多示例，请参阅下一个操作指南：*封禁和删除用户*。\n\n### 封禁和删除用户\n\n创建用户并授予他们访问门户的权限后，你有两种不同的方式来移除该访问权限。你可以通过剥夺他们的权限来封禁他们，也可以完全删除并移除他们。\n\
  \n### 准备工作\n\n对于本操作指南，你需要一些测试用户来封禁和删除。更多信息请参阅操作指南 *创建用户并授予访问权限*。\n\n### 操作步骤...\n\
  \n1. 首先以门户管理员身份登录（在我们的示例中为 `sysadmin`）。\n2. 查看控制面板，确保你处于编辑模式。\n3. 在**管理**菜单下选择**用户帐户**，或单击控制面板中的**用户**图标。\n\
  4. **用户帐户**页面将显示门户中的所有用户。查找现有用户或创建测试用户。不要选择管理员用户！管理员用户不能被封禁或删除。\n\n\n\n\n\n5. 若要封禁用户而不删除，需先取消其授权。\
  \ 在列表中找到要封禁的用户，点击其姓名旁的小铅笔图标。 这将显示“编辑用户账户”页面。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_59_0.png)\n\
  \n6. 点击页面底部的 Unauthorize User 链接。 你会看到一条消息显示 User successfully Un-Authorized。\n\n\
  7. 点击 Cancel 返回用户列表。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_59_1.png)\n\n8.\
  \ 测试用户仍在列表中，但 Authorized 复选框现在未选中。 该用户现已被封禁，无法再登录门户。\n\n9. 若要彻底移除用户及其个人资料，可通过点击其姓名旁的小红\
  \ X 删除用户。 如果有多个未授权用户需要删除，可点击 Delete Unauthorized Users 链接。\n\n10. 在被要求确认决定时，点击 OK。\n\
  \n11. 暂停后，会显示一条消息确认用户已删除。\n\n4. 点击 Manage Profile Properties（或从操作菜单中选择）。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_61_0.png)\n\
  \n5. 你会看到所有当前个人资料属性的列表。 若要隐藏其中一些，请在 Visible 列下取消选中以下项：\n\n   - Biography: Unchecked\n\
  \   - TimeZone: Unchecked\n   - PreferredLocale: Unchecked\n\n6. 点击 Apply Changes。\n\
  \n7. 若要添加新属性，点击 Add New Profile Property（或从操作菜单中选择）。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_62_0.png)\n\
  \n8. 填写以下信息：\n\n   - Property Name: JobPosition (no space)\n   - Data Type: Text\n\
  \   - Property Category: Preferences\n   - Length: 20\n   - Default Value: Intern\n\
  \   - Validation Expression: Leave blank\n   - Required: Unchecked\n   - Visible:\
  \ Checked\n\n9. 点击 **Next.**\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_63_0.png)\n\
  \n10. 在此页面我们为新的个人资料属性提供 Help、Validation 和 Error 消息。 填写以下信息：\n\n    - **Property\
  \ Name:** JobPosition (no space)\n    - **Property Help:** Your position in the\
  \ company\n    - **Category Name:** Preferences\n\n11. 点击 **Save Localized Text.**\n\
  \n12. 点击 **Return to Profiles Properties List.**\n\n13. 新属性将出现在属性列表中。 点击 **Cancel**\
  \ 返回 User Accounts。\n\n14. 若要检查结果，点击铅笔图标编辑用户。\n\n15. 点击 **Manage Profile.**\n\n\
  16. 确认 JobPosition 现在作为用户的属性出现。\n\n17. 你也可以将个人资料属性用作用户注册流程的一部分。 如果我们想将示例 JobPosition\
  \ 添加到用户注册中，我们首先进入 **Admin** 菜单下的 **User Accounts**。\n\n18. 从操作菜单中选择 **User Settings**\
  \ 或点击页面底部的链接。\n\n19. 向下滚动页面底部，直到看到 **Require a Valid Profile for Registration.**\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_64_0.png)\n\n20. 将 **Require a Valid\
  \ Profile for Registration** 设置为 **True**。\n\n21. 点击 **Update** 保存更改。\n\n22. 若要查看用户注册表单的外观，点击\
  \ **Logout** 链接。\n\n23. 然后点击 **Register** 链接。\n\n24. 新的 JobPosition 属性现在会与其他属性一起显示：\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_64_1.png)\n\n## Creating and organizing\
  \ pages\n\n在此示例中，我们将创建几个空白页面，以展示如何创建新内容并在菜单中组织。 我们将创建一个页面作为多个较小页面的父级。\n\n那么什么是页面？\
  \ DNN 中的页面实际上是一个占位符。 当你创建新页面时，它会出现在网站菜单中，并作为一个空白布局来容纳你的模块。\n\n在本教程中，我们将创建几个空白页面，将它们组织成层次结构，然后删除其中一些以查看其操作方式。\n\
  \n### How to do it...\n\n1. 首先以 Portal Administrator 身份登录（在我们的示例中为 `sysadmin`）。\n\
  \n2. 查看 Control Panel 并确保处于 Edit 模式。\n\n3. 在 Admin 菜单下选择 Pages（或从 Control Panel\
  \ 的 Admin 选项卡中选择 Pages）。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_65_0.png)\n\
  \n4. 在左侧可以看到门户中所有页面的列表，按层次排列，就像它们在菜单中出现的方式一样。 缩进的页面代表子菜单。\n\n5. 点击左侧 **Actions**\
  \ 下的 **Add New Page** 图标。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_66_0.png)\n\
  \n6. 提供以下信息：\n\n   - **Page Name:** `My Links`\n   - **Parent Page:** `<None Specified>`\n\
  \   - **Insert Page:** 点击 **After** 并从下拉列表中选择 **Home**\n   - Template Folder: `<None\
  \ Specified>`\n   - Include in Menu? Checked\n   - Permissions: Check View Page\
  \ for Registered Users\n\n7. 点击 Update 保存你的信息。\n\n8. 现在我们有一个新的菜单项出现在网站的每个页面上（如 Home\
  \ 或 Admin 菜单）。 让我们再创建一个页面，但将其放在这个新菜单项下。\n\n9. 再次点击 Add New Page。\n\n10. 提供以下信息：\n\
  \n    - Page Name: Announcements\n    - Page Title: Announcements\n    - Parent\
  \ Page: My Links\n    - Template Folder: `<None Specified>`\n    - Include in Menu?\
  \ Checked\n    - Permissions: Check View Page for Registered Users\n\n11. 点击 Update\
  \ 保存你的信息。\n\n12. 看看我们的第二个页面出现在第一个页面下方。 这是因为我们选择了第一个页面作为我们的 Parent Page。\n\n13. 再添加一个名为\
  \ My Blog 的页面并将其放在 MY LINKS 下。\n\n14. 在 MY LINKS 下添加另一个名为 My Forum 的页面。\n\n15. 在\
  \ MY LINKS 下添加另一个名为 Useful Documents 的页面。\n\n16. 在 MY LINKS 下添加另一个名为 Delete Me 的页面。\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_67_0.png)\n\n17. 我们现在在原始父页面下有五个页面，但它们的顺序错误。\
  \ 我们可以将 Delete Me 页面移动到菜单底部。\n\n18. 在左侧页面列表中找到 Delete Me 并选择它。\n\n19. 按下向下箭头按钮将页面向下移动，直到它成为\
  \ MY LINKS 下列出的最后一个页面。\n\n20. 现在我们知道如何移动菜单中的页面，让我们看看如何删除页面。\n\n21. 在左侧页面列表中选择 **Delete\
  \ Me**。\n\n22. 点击页面右侧 **Actions** 下的小红 **X**。\n\n23. 你将被提示 **Are you Sure You Wish\
  \ To Delete This Item?** 点击 **OK**。\n\n24. 页面被发送到 Recycle Bin 并从菜单和页面列表中消失。 如果你删除了页面后来改变主意，请参阅下一教程\
  \ *Using the Recycle Bin* 了解如何将其恢复。\n\n### How it works...\n\n创建页面、在菜单中组织它们并向其添加模块是使用\
  \ DNN 构建网站的重要部分。 在下一章中我们将看到更多关于添加页面和创建内容的示例。\n\n### See also\n\n现在你在网站上有空白页面，可以使用本章剩余的教程和\
  \ *Chapter 3* 开始添加模块。\n\n## Using the Recycle Bin\n\n当你在 DNN 中删除页面和模块时，它们实际上并未被删除。\
  \ 相反，它们被保存在 Recycle Bin 中，就像你电脑上的文件一样。 本教程将向你展示如何“取消删除”页面和模块。\n\n### Getting ready\n\
  \n要跟随本教程，你需要一个已删除的页面。 请参阅教程 *Creating and organizing pages* 了解如何删除页面。\n\n### How\
  \ to do it...\n\n1. 首先以 Portal Administrator 身份登录（在我们的示例中为 sysadmin）。\n\n2. 查看 Control\
  \ Panel 并确保处于 Edit 模式。\n\n3. 在 **Admin** 菜单下选择 **Recycle Bin**。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_69_0.png)\n\
  \n4. Recycle Bin 维护你已删除的页面和模块。 若要恢复页面，点击页面以选择它。\n\n5. 点击小绿色的 recycle 图标。\n\n6. 暂停后，页面将再次激活并重新出现在菜单中。\n\
  \n7. 若要恢复模块，在列表中选择该模块。\n\n8. 点击 recycle 图标。\n\n9. 暂停后，模块将重新出现在其被删除的页面上。\n\n### How\
  \ it works...\n\nRecycle Bin 让你可以取消删除页面和模块，但它也提供了一个清空 Recycle Bin 的链接。 如果你点击此链接，则\
  \ Recycle Bin 中的所有页面和模块将被永久删除。 请谨慎使用此链接。\n\n## Setting up an SMTP server with Gmail\n\
  \nDNN 在许多方面使用电子邮件：当创建新用户时、当你设置供应商时，或当有人回复博客帖子时。\n\n你可以配置站点使用 **Simple Mail Transfer\
  \ Protocol (SMTP)** 发送电子邮件，但这需要一个 SMTP 服务器。\n\n在本教程中，我们将演示如何使用免费的 Gmail 账户（来自 Google）作为你的\
  \ SMTP 服务器，以及如何配置 DNN 通过此账户发送电子邮件。\n\n\n\n\n\n**准备工作**\n\n要按照本教程操作，你必须具备以下条件：\n\n\
  - 一个 Gmail 账号（你可以通过访问 `http://mail.google.com` 并点击 **创建账号** 按钮免费获取一个）\n- 你的 Gmail\
  \ 账号的用户名和密码\n\n**如何操作...**\n\n1. 以主机身份登录（在我们的示例中为 `syschost`）。\n2. 在 **主机** 菜单下选择\
  \ **主机设置**。\n3. 在 **基本设置** 下，填写以下信息：\n   - **主机电子邮件：**（在此输入你的 Gmail 地址，例如 `dnnsyschost@gmail.com`）\n\
  4. 向下滚动并展开 **高级设置**。\n5. 找到 **SMTP 服务器设置** 并展开它。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_70_0.png)\n\
  \n6. 填写以下信息：\n\n- **SMTP 服务器和端口：** `smtp.gmail.com`\n- **SMTP 认证：** 基本\n- **SMTP\
  \ 启用 SSL：** 已勾选\n- **SMTP 用户名：**（你的 Gmail 电子邮件地址 `dnnsyschost@gmail.com`）\n- **SMTP\
  \ 密码：**（你的 Gmail 密码）\n\n7. 点击 **更新** 按钮保存更改。\n8. 点击 **测试** 链接测试你的配置。\n9. 你应该会看到消息\
  \ **电子邮件发送成功**。如果看到错误，请检查是否按上述显示输入了所有内容，并提供了正确的 Gmail 地址和密码。\n\n**工作原理...**\n\n\
  你提供的信息允许 DNN 连接到你的 Gmail 账号并通过它发送电子邮件。\n"
- "## 使用现有模块的简单技巧\n\n在本章中我们将介绍以下主题：\n\n- 使用 HTML 模块\n- 创建公告\n- 在线分发文档\n- 发布新闻通讯\n\
  - 创建活动日历\n- 创建 Wiki\n- 发布热门链接集\n- 显示 RSS 新闻源\n- 配置 RSS 新闻源\n- 发布简单报告\n- 发布调查问卷\n\
  \n### 引言\n\n在本章中，我们将介绍 DotNetNuke 社区版中包含的最受欢迎的模块。我们将从公告到发布内容再到从数据库显示报告等各个方面进行探索。这些教程将为你构建一个受欢迎且有用的门户提供所需的一切。\n\
  \n本章描述的大多数模块都包含在 DNN 的当前版本中，但未安装。限制已安装模块的数量可使新的 DNN 站点尽可能简单高效。请查看 *第 1 章，安装标准 DNN\
  \ 模块* 中的教程，在遵循这些教程之前安装这些附加模块。\n\n### 使用 HTML 模块\n\nHTML 模块是一个非常简单的模块，但它提供了很多可能性。把它想象成你可以放在\
  \ DNN 页面容器内的 HTML 文件。你在模块中放置的任何代码都将像放在 Web 服务器上的 HTML 文件一样被解释。\n\n从积极的一面来看，这意味着你的\
  \ HTML 模块可以包含你在任何 HTML 文件中都能找到的同类代码：HTML、JavaScript、VBScript，甚至 JQuery。从消极的一面来看，由于\
  \ HTML 模块位于 DNN 页面内部，这意味着 HTML 模块的功能存在一些重要限制。主要考虑因素是，你在 HTML 模块中放置的任何代码都必须与页面外部运行的其他所有代码和谐共存。这也意味着你有责任确保你的\
  \ HTML 代码语法正确。HTML 模块中的代码不会进行错误检查。\n\n在本教程中我们将演示简单的 HTML 和 CSS 代码。有关 HTML 模块的更多示例，可以提前查看\
  \ *第 10 章*。\n\n**准备工作**\n\n要跟随本教程，最好熟悉 HTML 和 CSS。\n\n**如何操作...**\n\n1. 以门户管理员身份登录（在我们的示例中为\
  \ `sysadmin`）。\n2. 将 HTML 模块添加到新页面或现有页面。\n3. 从模块菜单中选择 **编辑内容**（或点击 **编辑内容** 图标）。\n\
  4. 在 **编辑内容** 页面上，你会看到编辑器，它具有不同的模式。你可以选择 **基本文本框** 进行简单文本输入。你也可以选择 **富文本编辑器**，如果你更喜欢使用自动\
  \ HTML 格式化功能。如果你直接在 HTML 中工作，可以点击底部的 **HTML** 选项卡以避免任何自动格式化。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_75_0.png)\n\
  \n5. 由于我们正在 HTML 中工作，点击底部的 HTML 选项卡。\n6. 在编辑器中输入以下 HTML 以创建 DNN 供应商的示例图片列表：\n\n\
  ```html\n<div class=\"imagebar\">\n<ul class=\"image\">\n<li><img alt=\"\" src=\"\
  /dotnetnuke/Portals/0/aspnet.gif\" /></li>\n<li><img alt=\"\" src=\"/dotnetnuke/Portals/0/redgate.gif\"\
  \ /></li>\n<li><img alt=\"\" src=\"/dotnetnuke/Portals/0/WH4L.gif\" /></li>\n<li><img\
  \ alt=\"\" src=\"/dotnetnuke/Portals/0/exacttarget.gif\" /></li>\n<li><img alt=\"\
  \" src=\"/dotnetnuke/Portals/0/maximumasp.gif\" /></li>\n<li><img alt=\"\" src=\"\
  /dotnetnuke/Portals/0/telerik.gif\" /></li>\n</ul>\n</div>\n```\n\n7. 点击保存以保存更改。\n\
  8. 一个简单的列表将以垂直条的形式显示图片。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_75_1.png)\n\n\
  9. 这演示了模块如何渲染简单的 HTML，但为了格式化显示，我们需要添加一些样式信息。从模块菜单中选择编辑内容（或点击编辑内容图标）并点击 HTML 按钮。\n\
  10. 在编辑器的顶部，在 HTML 代码之前添加以下样式信息：\n\n```html\n<p><style type=\"text/css\">\n.imagebar\
  \ {\n    height: 70px;\n    width: 780px;\n    border: 1px solid #ddd;\n}\nul.image\
  \ {\n    float: left;\n    list-style: none;\n    margin: 0; padding: 0;\n}\nul.image\
  \ li {\n    margin: 0; padding: 5px;\n    float: left;\n    position: relative;\n\
  \    width: 120px;\n    height: 60px;\n}\n</style></p>\n<div class=\"imagebar\"\
  >\n<ul class=\"image\">\n    <li><img alt=\"\" src=\"/dotnetnuke/Portals/0/crystaltech.jpg\"\
  \ /></li>\n    <li><img alt=\"\" src=\"/dotnetnuke/Portals/0/datasprings.gif\" /></li>\n\
  \    <li><img alt=\"\" src=\"/dotnetnuke/Portals/0/easycgi.gif\" /></li>\n    <li><img\
  \ alt=\"\" src=\"/dotnetnuke/Portals/0/exacttarget.gif\" /></li>\n    <li><img alt=\"\
  \" src=\"/dotnetnuke/Portals/0/maximumasp.gif\" /></li>\n    <li><img alt=\"\" src=\"\
  /dotnetnuke/Portals/0/telerik.gif\" /></li>\n</ul>\n</div>\n```\n\n11. 点击 **保存**\
  \ 并查看结果：\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_77_0.png)\n\n12. 样式创建了一个边框并将图片排列成\
  \ *水平* 行。\n\n**更多内容...**\n\n这是在 HTML 模块中显示 HTML 和 CSS 的一个简单示例。有关其他可能性，请参阅 *第 10\
  \ 章，使用 HTML 模块与 JQuery* 中的教程。\n\n### 创建公告\n\n公告模块是发布定期新闻或小块内容的一种简便方式。公告由标题和正文组成，可选配说明图片和继续链接。在本教程中，我们将使用前面创建的空白页面之一，将公告模块添加到其中并创建我们的第一个公告。\n\
  \n**准备工作**\n\n我们需要一些文本和图片放入公告中。对于本示例，我们假设我们有一个技术新闻网站，我们想添加一些关于名为 \"Mirror\" 的新产品用于在家庭电脑上读取\
  \ RFID 标签的新闻。\n\n**如何操作...**\n\n1. 首先以门户管理员身份登录（在我们的示例中为 *sysadmin*）。\n2. 查看控制面板并确保你处于编辑模式。\n\
  3. 导航到空白页面（例如在教程 *创建和组织页面* 中创建的 **公告**）。\n4. 从控制面板中，选择 **常用任务** 选项卡并从下拉列表中选择公告模块（如果看不到公告模块列表，请参阅\
  \ *第 1 章，安装标准 DNN 模块* 了解更多信息）。\n5. 点击添加模块按钮。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_78_0.png)\n\
  \n6. 现在我们已将模块放置在页面上，可以使用它来创建公告。点击添加新公告链接。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_78_1.png)\n\
  \n\n\n\n\n- 7. 填写以下信息：\n  - 标题：Get a Mir:ror for Your Computer!\n  - 图片：Select URL\
  \ (A Link To An External Resource)\n  - 位置：http://www.thinkgeek.com/images/products/front/ba0d_violet_rfid_mirror.jpg\n\
  \n- 8. 在编辑器中，输入以下文本：\n\n  Violet, a maker of RFID devices, is offering a user friendly\
  \ RFID reader called Mir:ror. It plugs into your USB port and will read the tag\
  \ of an object placed upon it.\n\n- 9. 然后完成剩余信息：\n  - 链接：None\n  - 跟踪此链接被点击的次数？已勾选\n\
  \  - 记录每次链接点击的用户、日期和时间？未勾选\n  - 在新浏览器窗口中打开链接？未勾选\n  - 发布日期：使用今天的日期（公告要到此日期才显示）\n\
  \  - 视图顺序：1\n\n- 10. 点击 Update 按钮查看您的更改。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_79_0.png)\n\
  \n- 11. 您将看到新的公告已显示。如果没有，请在右侧查找 Select View 下拉列表并选择 All。\n\n### How it works...\n\
  \n公告是一种非常简单的方式在您的门户上发布信息。这对于简单的文本公告和图片效果很好。如果您有更复杂的内容或需要用户反馈选项，请改用 Blog 模块。\n\n\
  ## Distributing documents online\n\n### Getting ready\n\n要遵循本食谱，您必须在 DNN 站点上安装 Documents\
  \ 模块。有关说明，请参阅第 1 章 Installing standard DNN modules 中的食谱。\n\nDNN 中的文档分发有四个步骤：\n\n\
  - 1. 主机用户决定允许哪些文档类型。\n- 2. 主机用户创建文件分类列表以保持文件有序。\n- 3. 用户（如门户管理员）上传文档。\n- 4. 另一用户下载文档。\n\
  \n### How to do it...\n\n- 1. 以主机用户身份登录（在我们的示例中为 `syshost`）。\n- 2. 在 Host 菜单下选择\
  \ Host Settings。\n- 3. 滚动到底部并查找名为 Other Settings 的部分并展开它。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_80_0.png)\n\
  \n- 4. 找到 Allowable File Extensions。此列表影响可供下载的文件以及允许上传的文件。例如，如果您想为 HTML 模块上传 JPG，扩展名必须在此列出。查看列表并删除您在站点上不支持的任何扩展名。\n\
  - 5. 点击 Update 保存更改。\n- 6. 以主机身份注销并以门户管理员身份登录（在我们的示例中为 sysadmin）。\n- 7. 导航到空白页面（例如在第\
  \ 2 章 Creating and organizing pages 食谱中创建的 Useful Documents）。\n- 8. 查看 Control Panel\
  \ 并确保您处于 Edit 模式。\n- 9. 从 Control Panel 中，选择 Common Tasks 选项卡并从下拉列表中选择 Documents\
  \ 模块。\n- 10. 从下拉列表中选择 ContentPane 并点击 Add Module 按钮。\n- 11. Documents 模块现在将出现在您的空白页面上并显示当前可用的文档列表。在添加文档之前，让我们先编辑模块的设置。\n\
  - 12. 将鼠标悬停在 Documents 模块菜单上并选择 Settings。\n- 13. 滚动到 Documents Module Settings。\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_81_0.png)\n\n- 14. 填写如上图所示的信息。\n- 15.\
  \ 点击 Update 保存更改。\n- 16. 现在我们可以添加供他人下载的文档。返回 Documents 页面，点击 Add New Document 链接。\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_82_0.png)\n\n- 17. 当 Edit Documents 页面显示时，填写如上图所示的信息。\n\
  - 18. 点击 Update 保存更改。\n- 19. 此图像文件现在可供您的门户用户使用。他们可以通过点击 Download 链接下载它。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_82_1.png)\n\
  \n### How it works...\n\n主机用户必须指定允许分发的哪些文件的原因是某些类型的文件（如可执行文件）更容易受到病毒和恶意代码的侵害。通过控制您的门户可以分发或从用户接收的文件类型，您可以降低这种情况发生的几率。\n\
  \n在本示例中，我们选择了 Track Number Of Times This Link Is Clicked? 这用于跟踪用户查看文档的频率。由于我们已将\
  \ Clicks 作为显示列之一，我们可以在页面上列出文档时看到计数。\n\n### There's more...\n\n如果用户可以看到 Documents\
  \ 模块，则他们有权下载其中的文档。通过设置模块或页面的安全性来限制对文档的访问，如第 2 章 Granting access to modules 食谱中所述。\n\
  \n## Publishing a Newsletter\n\n一种很好的方式是通过新闻通讯向用户通报当前新闻和活动或提醒他们门户的更改。在 DNN 中，新闻通讯是定期发送给注册到您站点的用户的电子邮件。\n\
  \n### Getting ready\n\n新闻通讯发送到您站点中定义的 security groups，以及您认为必要的任何个人电子邮件地址。发送新闻通讯要求您的\
  \ DNN 站点已设置好发送电子邮件。有关说明，请参阅第 2 章 Setting up the SMTP Server with Gmail 食谱。此外，由于本示例中使用了\
  \ Subscribers 角色，您应该至少有一名具有 Subscriber 角色且具有有效电子邮件地址的用户来接收新闻通讯。\n\n### How to do\
  \ it...\n\n- 1. 以门户管理员身份登录（在我们的示例中为 `sysadmin`）。\n\n- 2. 从 **Admin** 菜单中选择 **Newsletters**。\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_84_0.png)\n\n- 3. 填写如上图所示的信息。\n- 4. 点击\
  \ **Preview Email** 查看并确认消息正确。\n- 5. 点击 **Send Email** 发送您的新闻通讯。\n- 6. 一旦您点击链接，新闻通讯电子邮件将立即发出。此外，会向门户管理员发送一封摘要电子邮件，其中包含已发送电子邮件的数量。\n\
  \n- 5. 从下拉列表中选择 ContentPane 并点击 Add Module 按钮。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_86_0.png)\n\
  \n- 6. 将 Events 模块添加到页面会立即为您的用户创建日历。要向日历添加事件，请查看日历顶部的小图标栏。点击看起来像 + 的 Add Event 图标。\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_86_1.png)\n\n- 7. 当 **Edit Event** 表单显示时，提供如上图所示的信息。\n\
  - 8. 点击 **Update** 保存更改。\n- 9. 当您返回日历时，在顶部的文本框中输入 12/20/2010 并点击 **Go** 按钮。这将带您进入\
  \ 2010 年 12 月，您可以看到新事件。\n- 10. 如果将鼠标悬停在事件上，标题和描述将被显示。点击 **Event** 以显示完整详细信息。\n\n\
  ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_87_0.png)\n\n- 11. 点击 **Return** 关闭 Event\
  \ 表单。\n\n### There's more\n\n通过在模块菜单下选择 **Settings**，您可以探索 Events 模块中的许多功能，这些功能允许人们报名参加活动或通过\
  \ PayPal 售票的能力。\n\n## Creating a Wiki\n\nWiki 是一种特殊的发布内容方式，其中文章可以相互链接，读者可以获得编辑内容的权限。名称\
  \ Wiki 来自夏威夷语 *Quick*，而最著名的 Wiki 可能是 Wikipedia。本食谱将向您展示如何为您的 DNN 门户创建自己的 Wikipedia，主题不限。\n\
  \n在本示例中，我们将创建一个包含三个示例主题的小型 Wiki：\n\n- Arduino\n- Physical Computing\n- Transduction\n\
  \n### Getting ready\n\n要遵循本食谱，您必须在 DNN 站点上安装 Wiki 模块。有关说明，请参阅第 1 章 _Installing standard\
  \ DNN modules_ 食谱。\n\n### How to do it...\n\n- 1. 以门户管理员身份登录（在我们的示例中为 sysadmin）。\n\
  - 2. 查看 Control Panel 并确保您处于 Edit 模式。\n- 3. 导航到将容纳 **Wiki** 的页面。\n- 4. 从 Control\
  \ Panel 中，选择 **Common Tasks** 选项卡并从下拉列表中选择 **Wiki** 模块。\n- 5. 从下拉列表中选择 **ContentPane**\
  \ 并点击 **Add Module** 按钮。\n- 6. 要创建我们的第一个主题，点击底部的 **Add** 链接以显示新页面：\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_88_0.png)\n\
  \n\n\n\n7. 填写以下信息：\n\n- 页面名称：Arduino\n- 在编辑器中：\n  Arduino 是一个开源电子原型平台，用于创建交互式设备。通过它，你可以组合传感器、电机和执行器，并通过编写自己的程序来控制它。\n\
  \  有关更多信息，请参阅 [[Physical Computing]]\n\n8. 点击底部的保存。主题现在会显示出来，其中 Physical Computing\
  \ 一词显示为超链接。\n\n9. 点击新的 Physical Computing 链接。\n\n10. 系统会自动创建一个新主题。点击“编辑”链接并提供以下内容：\n\
  \n- 页面名称：Physical Computing\n- 在编辑器中：\n  Physical Computing 是一个术语，描述将计算机连接到物理世界并赋予它感知和响应环境的能力的过程。\n\
  \  物理计算背后的关键原理是 [[Transduction]]\n\n11. 点击保存。\n\n12. 点击新的 Transduction 链接，然后点击“编辑”以创建第三个主题：\n\
  \n- 页面名称：Transduction\n- 在编辑器中：\n  Transduction 是能量从一种形式转换为另一种形式的过程。麦克风就是转换的一个例子，因为它将声波转换为变化的电压。\n\
  \n## 现有模块的实用技巧\n\n13. 点击**保存**。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_90_0.png)\n\
  \n14. 点击左侧的**索引（显示）**以显示所有三个主题。你可以从显示的索引中选择主题，或点击主题本身显示的链接来选择主题。\n\n15. 要直接向安全角色分配编辑权限，请将鼠标悬停在模块菜单上并选择**管理**。\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_90_1.png)\n\n16. 取消选中**使用 DotNetNuke\
  \ 安全**。\n\n17. 选择可以编辑主题的安全角色。\n\n18. 点击**>**链接将该角色分配给 Wiki。\n\n19. 点击**保存**以保存更改。\n\
  \n## 工作原理...\n\nDNN 中的 Wiki 实际上是通过超链接连接起来的主题集合。你可以在 Wiki 主题中，通过将目标页面名称放在双方括号（[[\
  \ 和 ]]）中来指定超链接。请确保括号中的页面名称与主题的实际页面名称一致，否则链接将无法工作。你还可以使用标签 [[Target Page Name|Caption]]\
  \ 为链接指定不同的标题。例如，[[Physical Computing|点击此处查看物理计算]] 将创建一个指向 Physical Computing 主题的链接，但链接将显示“点击此处查看物理计算”。\n\
  \n## 发布热门链接集合\n\nDNN 提供的一个非常有用的功能是链接模块。链接模块是你为用户提供的一组热门网站链接。这些链接不仅方便了用户，还可以作为收集统计数据的一种手段。\n\
  \n## 准备工作\n\n要遵循本教程，你的 DNN 站点必须安装有“链接”模块。有关说明，请参阅第 1 章中的“安装标准 DNN 模块”教程。\n\n## 操作步骤...\n\
  \n1. 以门户管理员身份登录（在我们的示例中为 `sysadmin`）。\n2. 查看控制面板，确保你处于编辑模式。\n3. 导航到将容纳链接列表的页面。\n\
  4. 在控制面板中，选择**常用任务**选项卡，然后从下拉列表中选择**链接**模块。\n5. 从下拉列表中选择**内容窗格**，然后点击**添加模块**按钮。\n\
  \n## 现有模块的实用技巧\n\n6. 点击**添加链接**链接。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_92_0.png)\n\
  \n7. 按照上面的截图填写以下信息。\n8. 点击**更新**以保存更改。\n9. 返回链接列表，再次点击**添加链接**。\n\n- **标题：** Digg\n\
  - **链接类型：** URL（指向外部资源的链接）\n- **网址：** `http://www.digg.com`\n- **跟踪此链接被点击的次数？**\
  \ 已选中\n- **记录每次链接点击的用户、日期和时间？** 已选中\n- **在新浏览器窗口中打开链接？** 已选中\n- **描述：** `Digg News`\n\
  - **查看顺序：** 2\n\n10. 点击**更新**以保存更改。\n11. 再次点击**添加链接**。\n\n- **标题：** `I Can Has Cheezburger?`\n\
  - **链接类型：** URL（指向外部资源的链接）\n- **网址：** `http://icanhascheezburger.com`\n\n- 跟踪此链接被点击的次数？已选中\n\
  - 记录每次链接点击的用户、日期和时间？已选中\n- 在新浏览器窗口中打开链接？已选中\n- 描述：LOL Cats\n- 查看顺序：3\n\n12. 点击“更新”以保存更改。\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_93_0.png)\n\n13. 如果要更改链接的显示方式，请将鼠标悬停在模块菜单上，然后选择“设置”。\n\
  \n14. 向下滚动，直到看到“链接设置”。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_93_1.png)\n\n\
  15. 通过选择以下选项，可以添加图像并随链接显示描述：\n\n- 显示链接信息：是\n- 显示图标：从下拉列表中选择 Root 和 training_icon.gif\n\
  \n16. 点击**更新**以保存对**设置**的更改。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_94_0.png)\n\
  \n## 显示 RSS 新闻源\n\n新闻源是一种频繁更新的信息来源，类似于由 Google 和 CNN 等网站发布的博客或新闻头条。DNN 提供了一个模块，可以在你的门户上显示来自互联网的新闻源。\n\
  \n这些源所采用的格式称为**真正简单的聚合（RSS）**，因此它们通常被称为 RSS 新闻源。\n\n## 准备工作\n\n要遵循本教程，你的 DNN 站点必须安装有“新闻源”模块。请参阅*安装标准\
  \ DNN 模块*教程（见*第1章*）的说明。\n\n要使用 RSS 新闻源，你需要该源的网址（URL）。在本示例中，我们将显示来自名为 Digg 的热门技术新闻网站的新闻源。该源的\
  \ URL 是 http://feeds.digg.com/digg/container/technology/popular.rss。\n\n```\nhttp://feeds.digg.com/digg/container/technology/popular.rss\n\
  ```\n\n## 操作步骤...\n\n1. 以门户管理员身份登录（在我们的示例中为 `sysadmin`）。\n2. 查看控制面板，确保你处于编辑模式。\n\
  3. 导航到将容纳新闻源的页面。\n4. 在控制面板中，选择**常用任务**选项卡，然后从下拉列表中选择**新闻源（RSS）**模块。\n\n5. 从下拉列表中选择**内容窗格**，然后点击**添加模块**按钮。\n\
  6. 现在选择我们想要的源。点击**编辑新闻源**链接。\n7. 这将显示**编辑新闻源（RSS）**页面，其中显示我们已拥有的任何源。点击**添加源**以创建新源。\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_95_0.png)\n\n8. 按照上面的截图填写信息。\n9. 点击**更新**以保存更改。\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_95_1.png)\n\n10. 现在新源出现在列表中。点击**更新**以保存更改并显示该源。\n\
  11. 你将看到一个简短的状态栏，然后新闻故事将出现在你的 DNN 页面上。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_95_2.png)\n\
  \n## 现有模块的实用技巧\n\n## 工作原理...\n\nRSS 实际上是一组用于聚合新闻故事的不同的 XML 格式。它通常包含故事的摘要以及指向全文的链接。DNN\
  \ 的一个不错的功能是能够将多个源聚合到页面上的单个源中。只需使用**添加链接**来添加更多源。要在“新闻源”模块中显示源，该源必须符合 RSS 标准。\n\n\
  ## 更多内容...\n\n如果将模块放置在 DNN 页面的右侧或左侧，源通常看起来效果更好。可以尝试调整位置，看看在你的门户上哪种效果最佳。\n\n## 配置\
  \ RSS 新闻源\n\n在*显示 RSS 新闻源*教程中，我们了解了如何在 DNN 站点中显示 RSS 源。在本教程中，我们将了解如何配置“新闻源”模块，以控制源的格式化和显示方式。\n\
  \n## 准备工作\n\n要遵循本教程，你的 DNN 站点必须安装有“新闻源”模块。有关说明，请参阅*第1章中的安装标准 DNN 模块*教程。你还必须完成上一教程：\n\
  \n- *显示 RSS 新闻源*\n\n本教程将演示两个配置功能：\n\n- 使用**设置**控制页面上显示的故事数量\n- 使用 XSL 转换文件将源显示为新闻滚动条\n\
  \n## 操作步骤...\n\n1. 以门户管理员身份登录（在我们的示例中为 `sysadmin`）。\n2. 查看控制面板，确保你处于编辑模式。\n3. 导航到包含上一教程中创建的新闻源的页面。\n\
  \n\n\n\n+   4. 要控制显示的故事数量，将鼠标悬停在模块菜单上，选择**设置**。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_97_0.png)\n\
  \n+   5. 向下滚动，直到看到名为**新闻模块设置**的部分。\n+   6. 找到标记为**要显示的项目**的选项，在值中输入 4。\n+   7. 点击**更新**以保存更改。\n\
  +   8. 现在，您的 DNN 页面上仅显示四条新闻故事。另一种显示订阅源的方式是沿 DNN 页面底部运行的新闻滚动条。要创建新闻滚动条：\n\n+   -\
  \ 将鼠标悬停在模块菜单上，选择**移动**，然后从子菜单中选择**移动到底部面板**。这会将模块放置到页面底部。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_97_1.png)\n\
  \n+   再次将鼠标悬停在模块菜单上，并从模块菜单中选择**设置**。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_98_0.png)\n\
  \n+   向下滚动，直到看到名为**新闻模块设置**的部分。\n\n+   找到**XSL 转换**，并从下拉列表中选择 **Ticker.xsl [系统]**。\n\
  \n+   对于**要显示的项目**，输入 1。\n\n+   点击**更新**。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_98_1.png)\n\
  \n## 更多内容...\n\n如果您有喜欢的新闻订阅源，但发现它无法使用新闻订阅模块正确显示，您可以通过使用 XML/XSL 模块和类似的 XSL 转换文件来更好地控制订阅源的显示方式。要了解更多信息，请参阅第十章中的*显示\
  \ XML 订阅源*食谱。\n\n## 发布简单报告\n\nDNN 提供了一个优秀的报告模块，可以使用**结构化查询语言（SQL）**从数据库中查询信息，并将结果显示在\
  \ DNN 页面上。要有效使用报告模块，您需要了解 SQL 查询语言的基础知识，并知道数据库中要使用哪些表。\n\n## 操作步骤...\n\n+   1. 以门户管理员身份登录（在我们的示例中是\
  \ sysadmin）。\n+   2. 查看控制面板，确保您处于编辑模式。\n+   3. 导航到将放置调查的页面。\n+   4. 从控制面板中，选择“常见任务”选项卡，并从下拉列表中选择“调查”模块。\n\
  +   5. 从下拉列表中选择 ContentPane，然后点击“添加模块”按钮。\n+   6. 点击“添加问题”链接。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_101_0.png)\n\
  \n+   7. 填写以下信息：\n+     - 问题：您认为未来十年最令人惊叹的新技术是什么？\n+     - 类型：选择“多项选择”\n+     -\
  \ 查看顺序：1\n+     - 新选项：增强现实\n\n+   8. 重复此步骤以创建另外三个选项：\n+     - 量子计算\n+     - 纳米技术\n\
  +     - 神经工程\n\n## 现有模块的简单技巧\n\n+   9. 点击**更新**以保存您的调查。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_102_0.png)\n\
  \n+   10. 勾选**增强现实**和**量子计算**复选框，然后点击**提交调查**。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_102_1.png)\n\
  \n+   11. 您现在将看到所有调查响应的图表。随着更多响应的提交，图表将发生变化。\n\n## 更多内容...\n\n如果您希望调查只允许单一答案（单选按钮而不是复选框），请选择**单项选择**作为您的**调查类型**。\n\
  \n对于测试，您还可以指定正确答案。\n\n## 4\n"
- "## 创建自己的模块\n\n在本章中，我们将涵盖以下主题：\n\n+   - 安装 Visual Web Developer 2010 Express\n+\
  \   - 从 Web Developer 查看数据库\n+   - 安装 DNN 5 Starter Kit\n+   - 使用 Starter Kit 创建新模块\n\
  +   - 创建带键的数据库表\n+   - 创建存储过程\n+   - 将模块连接到数据库\n+   - 创建卸载脚本\n\n## 简介\n\n前面的章节介绍了\
  \ DNN，并展示了如何将现有模块添加到您的 DNN 站点。在本章中，我们将展示如何下载和安装开始编写您自己的 DNN 模块所需的工具。我们还将展示如何通过使用\
  \ DNN Starter Kit 创建模块以及将其连接到数据库所需的步骤来快速入门。\n\n## 安装 Visual Web Developer 2010 Express\n\
  \n在本食谱中，我们将下载并安装 Visual Web Developer 2010 Express——免费的 .NET 开发工具。\n\n## 准备工作\n\n\
  要遵循本食谱，您必须先完成*第一章*中的*下载 Microsoft Web Platform Installer* 食谱。\n\n## 操作步骤...\n\n\
  +   1. 首先启动 Microsoft Web Platform Installer。\n+   2. 当显示可用产品列表时，点击**Web Platform**选项卡。\n\
