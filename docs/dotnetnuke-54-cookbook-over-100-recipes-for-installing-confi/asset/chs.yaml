  Public MustOverride Sub DeleteEmployee(ByVal ModuleId As\n                     \
  \                   Integer,ByVal ItemId As\nInteger)\n\n#End Region\n```\n```\n\
  \n-   5. 现在我们在下一个文件中重复该过程。双击 `SqlDataProvider.vb` 并滚动到文件底部的 Public Methods 区域。我们需要在两个参数列表和两个参数列表中更改代码：\n\
