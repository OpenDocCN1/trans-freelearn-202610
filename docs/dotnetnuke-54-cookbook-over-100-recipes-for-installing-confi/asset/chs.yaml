  \ '20px'\n        }, 400);\n\n    }, function() {\n        $(this).css({'z-index'\
  \ : '0'});\n        $(this).find('img').removeClass(\"hover\").stop()\n        \
  \    .animate({\n\n\n\n\n\n## 使用现有模块的高级技巧\n\n```html\nmarginTop: '0',\nmarginLeft:\
