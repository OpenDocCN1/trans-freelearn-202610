  \n8. 到目前为止一切顺利。现在我们需要在两个地方更新 EmployeeInfo 文件。双击 EmployeeInfo.vb 并向下滚动一点到本地属性声明部分。\n\
  \n9. 将包含 Content 的一行改为我们字段的五行：\n\n```\n' local property declarations\nPrivate _ModuleId\
  \ As Integer\nPrivate _ItemId As Integer\nPrivate _EmpFirstName As String\nPrivate\
  \ _EmpLastName As String\nPrivate _ManagerNo As Integer\nPrivate _HireDate As DateTime\n\
  Private _Salary As Double\nPrivate _CreatedByUser As Integer\nPrivate _CreatedDate\
  \ As DateTime\nPrivate _CreatedByUserName As String\n```\n\n10. 在文件的其余部分，我们需要再次删除\
  \ Content 属性并用我们的五个字段替换它。向下滚动并找到包含 Content 属性的部分。现在将代码改为我们的五个属性过程：\n\n```\nPublic\
  \ Property ItemId() As Integer\n    Get\n        Return _ItemId\n    End Get\n \
  \   Set(ByVal Value As Integer)\n        _ItemId = Value\n    End Set\nEnd Property\n\
  ```\n\n```\nPublic Property EmpFirstName() As String\n    Get\n        Return _EmpFirstName\n\
  \    End Get\n    Set(ByVal Value As String)\n        _EmpFirstName = Value\n  \
  \  End Set\nEnd Property\n```\n\n```\nPublic Property EmpLastName() As String\n\
  \    Get\n        Return _EmpLastName\n    End Get\n    Set(ByVal Value As String)\n\
  \        _EmpLastName = Value\n    End Set\nEnd Property\n```\n\n\n\n\n\n```\nEnd\
  \ Property\n\nPublic Property ManagerNo() As Integer\n    Get\n        Return _ManagerNo\n\
  \    End Get\n    Set(ByVal Value As Integer)\n        _ManagerNo = Value\n    End\
  \ Set\nEnd Property\n\nPublic Property HireDate() As Datetime\n    Get\n       \
  \ Return _HireDate\n    End Get\n    Set(ByVal Value As Datetime)\n        _HireDate\
  \ = Value\n    End Set\nEnd Property\n\nPublic Property Salary() As Double\n   \
  \ Get\n        Return _Salary\n    End Get\n    Set(ByVal Value As Double)\n   \
  \     _Salary = Value\n    End Set\nEnd Property\n\nPublic Property CreatedByUser()\
  \ As Integer\n    Get\n        Return _CreatedByUser\n    End Get\n    Set(ByVal\
  \ Value As Integer)\n        _CreatedByUser = Value\n    End Set\nEnd Property\n\
  ```\n\n11. 从文件菜单中选择保存全部以保存项目文件。\n\n# 创建自己的模块\n\n# 其工作原理...\n\n完成本菜谱将创建数据库和业务逻辑层使用的过程。使用过程连接到数据库可以使我们的代码无需直接使用\
  \ SQL 调用数据库。它提供了数据库逻辑和业务逻辑的更好分离。\n\n# 创建卸载脚本\n\n当 Starter Kit 创建一个模块时，它还会构建一个在从\
  \ DNN 卸载模块时运行的卸载脚本。该脚本负责删除模块创建的所有内容：存储过程、数据库、视图、表等。\n\n在本菜谱中，我们将使用 Starter Kit 创建的卸载脚本，并将公司名称更改为与安装脚本中使用的公司名称相匹配。\n\
  \n# 准备工作\n\n要跟随本菜谱，你必须已完成上一菜谱 _使用 Starter Kit 创建新模块_\n\n# 如何操作...\n\n+   1. 首先启动你喜欢的开发工具（Visual\
  \ Studio 或 Visual Web Developer Express）。\n+   2. 在屏幕左侧查找 **最近项目**。点击 **Employee**\
  \ 以加载项目。\n+   3. 在屏幕右侧查看 **解决方案资源管理器**，双击 `Uninstall.SqlDataProvider`。这将在编辑器中显示卸载脚本。\n\
  +   4. 我们需要做的唯一事情就是更改脚本中的文本 `YourCompany_`。不要使用 `YourCompany`，你可以放置你的实际公司名称或缩写。我们通过简单的查找和替换来完成此操作——在\
  \ **编辑** 菜单下，查找 **查找和替换** 并选择 **快速替换**（或直接按 _Ctrl+H_）。\n+   5. 提示时：\n+      - **查找内容：**\
  \ `YourCompany`\n+      - **替换为：** `ACME`\n+      - **查找范围：** `当前文档`\n+   6. 点击\
  \ **全部替换**。\n\n7. 脚本现在应如下所示：\n\n```\n/* ************************************************************\
  \ */\n/*****              SqlDataProvider              *****/\n/*****          \
  \                                  *****/\n/*****                              \
  \              *****/\n/***** Note: To manually execute this script you must   \
  \   *****/\n/*****       perform a search and replace operation        *****/\n\
  /*****       for {databaseOwner} and {objectQualifier}     *****/\n/*****      \
  \                                      *****/\n/**************************************************************/\n\
  \n/** Drop FAQs Table **/\n\nALTER TABLE {databaseOwner}[{objectQualifier}ACME_Employee]\
  \ DROP CONSTRAINT [FK_{objectQualifier}Employee_{objectQualifier}Modules]\nGO\n\n\
  ALTER TABLE {databaseOwner}[{objectQualifier}ACME_Employee] DROP CONSTRAINT [PK_{objectQualifier}ACME_Employee]\n\
  GO\n\nDROP INDEX {databaseOwner}[{objectQualifier}ACME_Employee].[IX_{objectQualifier}ACME_Employee]\n\
  GO\nDROP TABLE {databaseOwner}[{objectQualifier}ACME_Employee]\nGO\n\n/** Drop Stored\
  \ Procedures **/\n\nDROP PROCEDURE {databaseOwner}[{objectQualifier}ACME_GetEmployees]\n\
  GO\n\nDROP PROCEDURE {databaseOwner}[{objectQualifier}ACME_GetEmployee]\nGO\n\n\
  DROP PROCEDURE {databaseOwner}[{objectQualifier}ACME_AddEmployee]\nGO\n\nDROP PROCEDURE\
  \ {databaseOwner}[{objectQualifier}ACME_UpdateEmployee]\nGO\n\nDROP PROCEDURE {databaseOwner}[{objectQualifier}ACME_DeleteEmployee]\n\
  ```\n\nGO\n\n```\n/*************************************************/\n/*****  \
  \        SqlDataProvider          *****/\n/*************************************************/\n\
  ```\n\n+   8. 从 **文件** 菜单中选择 **全部保存** 以保存你的更改。\n\n# 其工作原理...\n\n保持卸载脚本与安装脚本同步非常重要。如果你在模块中添加表或存储过程，你必须记住在模块卸载时提供删除它们的代码。\n"
- "# 构建、调试和部署模块\n\n在本章中我们将介绍以下主题：\n\n+   - 构建视图控件\n+   - 构建编辑控件\n+   - 编辑清单文件\n+ \
  \  - 为发布或调试而构建\n+   - 将模块作为独立包部署\n+   - 下载 DNN 5 源代码\n+   - 设置调试环境\n+   - 为调试准备模块\n\
  +   - 设置断点并逐步执行模块代码\n+   - 从已安装的模块创建清单\n\n# 简介\n\n在上一章中我们看到了如何安装 Web Developer Express\
  \ 并开始创建自定义模块。在本章中，我们将看到如何创建可工作的 *View* 和 *Edit* 控件，如何部署自定义模块以及如何为模块调试配置开发工具。\n\n\
  # 开发工具\n\n本章及后续章节中的菜谱在使用 Visual Studio 2008 或 Visual Web Developer Express 2010\
  \ 时效果相同。你可以使用你更熟悉或可用的工具。在这些示例中我们将使用 Web Developer Express，但为了方便，我们在指 Visual Studio\
  \ 或 Web Developer 时使用术语开发工具。\n\n# WAP 与 WSP\n\n构建自定义模块有两种方法。采用哪种方法取决于你的需求：\n\n+\
  \   - 你可以将其构建为 Web 应用程序项目（WAP）。如果只是想编码、构建和部署项目，这是不错的选择。本章最后描述了这种方法。\n+   - 你可以将模块代码与\
  \ DNN 源代码放在一起，并将网站构建为一个 Web 站点项目（WSP）。这提供了设置断点并逐步执行模块代码的能力。这种方法在本章末尾演示。\n\n# DNN\
  \ 中的控件\n\n在正式开始之前，这里是对我们想要完成的工作的快速概述。当我们在 DNN 中谈论模块开发时，我们实际上是在谈论四个关键部分：\n\n+   -\
  \ 用户控件：这些是模块的用户界面元素。它们将根据你在 DNN 门户中查看模块的哪一部分而动态放置在页面的上。在本章的示例中，首先显示的是 View 用户控件。点击员工记录时显示\
  \ Edit 控件，点击设置链接时显示 Settings 控件。\n+   - 程序集：用户控件背后的代码（*.vb 文件）在构建 Employee 项目时会被编译成程序集（DLL\
  \ 文件）。部署模块时，程序集将被放置在门户的 /bin 文件夹中。\n+   - 数据库脚本：如上一章所见，模块依赖数据库表来保存信息。作为模块的一部分，你将有一个安装脚本来创建模块数据库表，以及一个在模块卸载时删除它们的卸载脚本。\n\
  +   - 模块清单：一个 XML 文件，告诉 DNN 模块应如何安装。在 DNN 版本五中，清单可以包含发行说明和许可协议。\n\n## #构建视图控件\n\n\
  尽管 DNN 模块在控件的数量和种类上有所不同，但一种常见的方法（也是 Starter Kit 生成的方法）包含三个用户控件：\n\n+   - 视图控件：用于在\
  \ DNN 页面上显示模块\n+   - 编辑控件：用于编辑模块数据\n+   - 设置控件：用于更改模块的设置\n\n当你在页面上放置 DNN 模块时，模块的视图控件负责显示模块的初始状态。在本菜谱中，我们将查看\
  \ Starter Kit 创建的视图控件并扩展它以包含示例员工表的字段。\n\n我们将创建的视图控件将像这样显示表中的所有员工记录：\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_133_0.png)\n\
  \n### ####准备工作\n\n要跟随本菜谱，你必须已完成 *第 4 章* 中的以下菜谱：\n\n+   - *使用 Starter Kit 创建新模块*\n\
  \n### ####如何操作...\n\n+   1. 首先启动你喜欢的开发工具（Visual Studio 或 Visual Web Developer Express）。\n\
  +   2. 在屏幕左侧查找最近项目。点击 **Employee** 以加载项目。\n+   3. 双击打开 `ViewEmployee.ascx` 文件。\n\
  \n\n\n\n\n4. 当模块显示时，它会显示 Employee 表中的 Employee 记录。Starter Kit 已为我们提供了一个 datalist\
  \ 控件，用于从数据库中显示记录。我们需要将我们的 Employee 字段放入此控件中。我们通过用我们五个字段的标签控件替换 lblContent 标签控件来实现。\n\
  \n```\n<%@ Control language=\"vb\"\n    Inherits=\"YourCompany.Modules.Employee.ViewEmployee\"\
  \n    AutoEventWireup=\"false\" Explicit=\"True\"\n    Codebehind=\"ViewEmployee.ascx.vb\"\
  \ %>\n<%@ Register TagPrefix=\"dnn\" TagName=\"Audit\"\n    Src=\"~/controls/ModuleAuditControl.ascx\"\
  \ %>\n<asp:datalist id=\"lstContent\" datakeyfield=\"ItemID\" runat=\"server\" cellpadding=\"\
  4\">\n<itemtemplate>\n<table cellpadding=\"4\" width=\"100%\">\n<tr>\n<td valign=\"\
  top\" width=\"100%\" align=\"left\">\n<asp:HyperLink ID=\"HyperLink1\" NavigateUrl='<%#\
  \ EditURL(\"ItemID\",DataBinder.Eval(Container.DataItem,\"ItemID\")) %>' Visible=\"\
  <%# IsEditable %>\" runat=\"server\"><asp:Image ID=\"Image1\" Runat=server ImageUrl=\"\
  ~/images/edit.gif\" AlternateText=\"Edit\" Visible=\"<%#IsEditable%>\" resourcekey=\"\
  Edit\"/></asp:hyperlink>\n<asp:Label ID=\"lblEmpFirstName\" runat=\"server\" CssClass=\"\
  Normal\"/>\n<asp:Label ID=\"lblEmpLastName\" runat=\"server\" CssClass=\"Normal\"\
  />\n<asp:Label ID=\"lblManagerNo\" runat=\"server\" CssClass=\"Normal\"/>\n<asp:Label\
  \ ID=\"lblHireDate\" runat=\"server\" CssClass=\"Normal\"/>\n<asp:Label ID=\"lblSalary\"\
  \ runat=\"server\" CssClass=\"Normal\"/>\n</td>\n</tr>\n</table>\n</itemtemplate>\n\
  </asp:datalist>\n```\n\n5. 接下来我们必须添加代码来填充 datalist 控件。双击打开 ViewEmployee.ascx.vb\
  \ 文件（如果在 Solution Explorer 中看不到它，请单击 Solution Explorer 工具栏上的显示所有文件图标——从左数第二个）。\n\
  \n> datalist 控件是 DNN Web 控件库的一部分。它会从数据库中显示记录，但我们必须告诉它要显示表中的哪些字段。\n\n6. 滚动到 Starter\
  \ Kit 创建的 `Page_Load` 过程。该过程调用 `GetEmployees` 函数来提取 employee 表中的所有员工并将结果绑定到 `datalist`\
  \ 控件。我们希望更改代码，以便只有在找到某些员工时才绑定。所以找到下面突出显示的行：\n\n```\nPrivate Sub Page_Load(ByVal\
  \ sender As System.Object,\n                     ByVal e As System.EventArgs) Handles\
  \ MyBase.Load\n    Try\n        Dim objEmployees As New EmployeeController\n   \
  \     Dim colEmployees As List(Of EmployeeInfo)\n\n        ' get the content from\
  \ the Employee table\n        colEmployees = objEmployees.GetEmployees(ModuleId)\n\
  \n        If colEmployees.Count = 0 Then\n            ' add the content to the Employee\
  \ table\n            Dim objEmployee As EmployeeInfo = _\n                     \
  \                 New EmployeeInfo\n            objEmployee.ModuleId = ModuleId\n\
  \            objEmployee.EmpFirstName = _\n                                    \
  \  Localization.GetString _\n                                      (\"DefaultContent\"\
  , LocalResourceFile)\n            objEmployee.CreatedByUser = Me.UserId\n      \
  \      objEmployees.AddEmployee(objEmployee)\n            ' get the content from\
  \ the Employee table\n            colEmployees = _\n                         objEmployees.GetEmployees(ModuleId)\n\
  \        End If\n\n        ' bind the content to the repeater\n        lstContent.DataSource\
  \ = colEmployees\n        lstContent.DataBind()\n\n    Catch exc As Exception  \
  \        'Module failed to load\n        ProcessModuleLoadException(Me, exc)\n \
  \   End Try\nEnd Sub\n```\n\n7. 现在将代码更改为如下所示：\n\n```\nPrivate Sub Page_Load(ByVal\
  \ sender As System.Object,\n                     ByVal e As System.EventArgs) Handles\
  \ MyBase.Load\n    Try\n        Dim objEmployees As New EmployeeController\n   \
  \     Dim colEmployees As List(Of EmployeeInfo)\n\n        ' get the content from\
  \ the Employee table\n```\n\n```\ncolEmployees = objEmployees.GetEmployees(ModuleId)\n\
  \nIf colEmployees.Count > 0 Then\n    ' bind the content to the repeater\n    lstContent.DataSource\
  \ = colEmployees\n    lstContent.DataBind()\nEnd If\n\nCatch exc As Exception  \
  \      'Module failed to load\nProcessModuleLoadException(Me, exc)\nEnd Try\nEnd\
  \ Sub\n```\n\n8. 最后一步是将我们的五个员工字段添加到 Starter Kit 创建的绑定事件处理程序中。向下滚动一点，直到看到 lstContent_ItemDataBound\
  \ 过程：\n\n```\nProtected Sub lstContent_ItemDataBound(ByVal sender As Object,\n \
  \   ByVal e As System.Web.UI.WebControls.DataListItemEventArgs)\n    Handles lstContent.ItemDataBound\n\
  \    Dim strContent As String = \"\"\n\n    ' add content to template\n    If CType(Settings(\"\
  template\"), String) <> \"\" Then\n    strContent = CType(Settings(\"template\"\
  ), String)\n    Dim objProperties As ArrayList = Common.Utilities.CBO.GetPropertyInfo(GetType(EmployeeInfo))\n\
  \n    Dim intProperty As Integer\n    Dim objPropertyInfo As PropertyInfo\n    For\
  \ intProperty = 0 To objProperties.Count - 1\n        objPropertyInfo = CType(objProperties(intProperty),\
  \ PropertyInfo)\n\n        strContent = strContent.Replace(\"[\" & objPropertyInfo.Name.ToUpper\
  \ & \"]\",\n            DataBinder.Eval(e.Item.DataItem, objPropertyInfo.Name).ToString())\n\
  \n    Next intProperty\n    Else\n    strContent = DataBinder.Eval(e.Item.DataItem,\
  \ \"Content\")\n    End If\n\n    ' assign the content\n    Dim lblContent As Label\
  \ = CType(e.Item.FindControl(\"lblContent\"), Label)\n\n    lblContent.Text = strContent\n\
  End Sub\n```\n\n9. 再次删除突出显示的代码并将其替换为以下代码：\n\n```\nProtected Sub lstContent_ItemDataBound(ByVal\
  \ sender As Object, _\n                         ByVal e As System.Web.UI.WebControls.DataListItemEventArgs)\n\
  \                         Handles lstContent.ItemDataBound\n\n    ' assign the content\n\
  \    Dim lblEmpFirstName As Label =\n                         CType(e.Item.FindControl(\"\
  lblEmpFirstName\"), Label)\n    Dim lblEmpLastName As Label =\n                \
  \         CType(e.Item.FindControl(\"lblEmpLastName\"), Label)\n    Dim lblManagerNo\
  \ As Label =\n                         CType(e.Item.FindControl(\"lblManagerNo\"\
  ), Label)\n    Dim lblHireDate As Label =\n                         CType(e.Item.FindControl(\"\
  lblHireDate\"), Label)\n    Dim lblSalary As Label =\n                         CType(e.Item.FindControl(\"\
  lblSalary\"), Label)\n\n    lblEmpFirstName.Text = DataBinder.Eval(e.Item.DataItem,\n\
  \                                           \"EmpFirstName\")\n    lblEmpLastName.Text\
  \ = DataBinder.Eval(e.Item.DataItem,\n                                         \
  \ \"EmpLastName\")\n    lblManagerNo.Text = DataBinder.Eval(e.Item.DataItem,\n \
  \                                       \"ManagerNo\")\n    lblHireDate.Text = DataBinder.Eval(e.Item.DataItem,\n\
  \                                      \"HireDate\")\n    lblSalary.Text = DataBinder.Eval(e.Item.DataItem,\
  \ \"Salary\")\nEnd Sub\n```\n\n10. 我们在这里所做的是更改代码，以便当我们将员工绑定到 datalist 时，绑定处理程序会提取员工信息并将其放入我们在步骤\
  \ 4 中创建的标签字段中。\n\n11. 从 **File** 菜单中单击 **Save All** 以保存您的更改。\n\n## How it works...\n\
  \nView 控件来自两个文件，ViewEmployee.ascx 和代码隐藏文件 ViewEmployee.ascx.vb。要完成控件并将其连接到我们的字段，我们更改\
  \ ViewEmployee.ascx 以显示我们的字段，并更改 ViewEmployee.ascx.vb 以填充它们。\n\n在本教程中，我们看到了一个重要的子程序\
  \ Page_Load。页面加载例程在页面加载时被调用，因此它通常是处理在页面显示之前需要执行的所有设置的一个常见位置。\n\n## There's more...\n\
  \n本教程展示了显示数据的最简单方法。在第 6 章中，我们将看到如何用更强大的 datagrid 控件替换 datalist 控件。\n\n## See also\n\
  \n我们已迈出第一步，将 Starter Kit 创建的模块更改为可部署到 DNN 门户的模块。请参阅教程 Building an Edit control 以了解该过程的下一步。\n\
  \n## Building an Edit control\n\n在本教程中，我们将从 Starter Kit 生成的代码创建一个基本的 Edit 控件。Edit\
  \ 控件使用文本框从数据库中显示单条记录，以便我们可以编辑值。它还包括 Update、Cancel 和 Delete 链接，用于保存、取消或删除记录。\n\n\
  Starter Kit 使用一个标记为“Content”的单个字段、一个文本框和一个验证控件创建控件，如果在没有值的情况下保存记录则打印警告消息。这是一个良好的开端，但我们希望取出内容字段并将其替换为来自示例\
  \ Employee 表的五个字段，创建一个看起来像这样的控件：\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_138_0.png)\n\
  \n在本教程中，我们将更详细地了解 EditEmployee 控件，并了解它如何使用四个特殊部分显示选定的员工记录：\n\n- Label：显示编辑字段名称的常用控件，并包含一个小帮助图标（？）以提供更多信息。\n\
  - TextBox：用于输入文本的标准输入控件。\n- Required field validator：一个特殊控件，如果我们在 TextBox 中未提供值，则会显示错误消息。\n\
  - Update link button：单击时将触发我们可以捕获并编写代码的事件。\n\n\n\n\n\n## 准备工作\n\n要继续本示例，您必须先完成第4章中的以下示例：\n\
  \n- 使用 Starter Kit 创建新模块\n\n## 操作步骤...\n\n1. 首先启动您偏好的开发工具（Visual Studio 或 Visual\
  \ Web Developer Express）。\n2. 在屏幕左侧查找“最近项目”（Recent Projects）。点击“Employee”以加载项目。\n\
  3. 双击打开 `EditEmployee.ascx` 文件。我们需要修复的部分是一个包含 Employee 字段的 HTML 表格。Starter Kit 在\
  \ HTML 表格中创建了一行，我们再次需要用字段名替换占位符 Content。该表单包含一个文本标签、一个输入控件和一个验证控件，因此我们需要将其替换为我们五个字段的标签、输入控件和验证控件。\n\
  \n```\n<%@ Control language=\"vb\"\n    Inherits=\"YourCompany.Modules.Employee.EditEmployee\"\
  \n    AutoEventWireup=\"false\" Explicit=\"True\"\n    Codebehind=\"EditEmployee.ascx.vb\"\
  \ %>\n<%@ Register TagPrefix=\"dnn\" TagName=\"Label\"\n    Src=\"~/controls/LabelControl.ascx\"\
  \ %>\n<%@ Register TagPrefix=\"dnn\" TagName=\"TextEditor\"\n    Src=\"~/controls/TextEditor/TextEditor.ascx\"\
  %>\n<%@ Register TagPrefix=\"dnn\" TagName=\"Audit\"\n    Src=\"~/controls/ModuleAuditControl.ascx\"\
  \ %>\n<table width=\"650\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\"\n  \
  \  summary=\"Edit Table\">\n    <tr valign=\"top\">\n        <td class=\"SubHead\"\
  \ width=\"125\"><dnn:label id=\"lblContent\"\n            runat=\"server\" controlname=\"\
  lblContent\" suffix=\":\">\n            </dnn:label>\n        </td>\n        <td>\n\
  \            <dnn:texteditor id=\"txtContent\" runat=\"server\"\n              \
  \  height=\"200\" width=\"500\" />\n            <asp:RequiredFieldValidator ID=\"\
  valContent\"\n                resourcekey=\"valContent.ErrorMessage\"\n        \
  \        ControlToValidate=\"txtContent\"\n                CssClass=\"NormalRed\"\
