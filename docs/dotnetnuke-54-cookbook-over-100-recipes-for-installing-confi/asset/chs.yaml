  \n> 如果你遵循了之前的配方并且这里已经有一个 HTML 表格，只需将其替换为这个新的 HTML 表格。\n\n17. 接下来，打开 `ViewEmployee.ascx.vb`\
  \ 文件。\n\n18. 第一步是导入 Lists 命名空间。向下滚动一点并添加 import 语句：\n\n```vb\nImports System.Web.UI\n\
  Imports System.Collections.Generic\nImports System.Reflection\n\nImports DotNetNuke\n\
  Imports DotNetNuke.Services.Exceptions\nImports DotNetNuke.Services.Localization\n\
  Imports DotNetNuke.Common.Lists\n```\n\n### How it works...\n\n我们可以直接将下拉列表控件绑定到\
  \ DNN 列表。这允许主机用户在无需重新部署模块的情况下向列表添加值。\n\n### There's more...\n\n由于我们在页面显示时绑定到列表，你可以向\
  \ DNN 列表添加更多值，并且它们会在页面刷新时自动出现在下拉列表中。\n\n## 从存储过程填充下拉列表\n\n在本配方中，我们将看到如何从存储过程填充下拉列表。这与绑定到\
  \ DNN 列表类似，但现在我们可以使用数据库中存储的任何数据作为列表。\n\n### Getting ready\n\n要跟随本配方，你必须已完成以下配方：\n\
  \n- *Creating stored procedures*（来自 *Chapter 4*）\n- *Populating a drop-down list\
  \ from a DNN list*\n\n### How to do it...\n\n1. 首先启动 Development Tool 并加载 Employee\
  \ 项目。\n2. 双击打开 `ViewEmployee.ascx` 文件。\n3. 找到从上一个配方添加的表格和薪资控件。查找两个占位符并用以下标签和控件代码替换它们，使\
  \ HTML 表格现在看起来像这样：\n\n```html\n<table id=\"tblPanel\" cellspacing=\"2\" cellpadding=\"\
  2\" border=\"0\"\n       runat=\"server\" >\n    <tr>\n        <td width=\"20%\"\
  \ class=\"SubHead\">\n            <dnn:Label ID=\"lblManagerNo\" runat=\"server\"\
  \n                      ControlName=\"ddlManagerNo\" Suffix=\":\" />\n        </td>\n\
  \        <td width=\"25%\">\n            <asp:DropDownList ID=\"ddlManagerNo\" runat=\"\
  server\"\n                DataTextField=\"ManagerName\"\n                DataValueField=\"\
  ItemId\" AutoPostBack=\"true\">\n            </asp:DropDownList>\n        </td>\n\
  \        <td width=\"10%\">\n            &nbsp;\n        </td>\n        <td width=\"\
  20%\" class=\"SubHead\">\n            <dnn:Label ID=\"lblSalaryRange\" runat=\"\
  server\" ControlName=\"ddlSalaryRange\" Suffix=\":\">\n            </dnn:Label>\n\
  \        </td>\n        <td width=\"25%\">\n            <asp:DropDownList ID=\"\
  ddlSalaryRange\" runat=\"server\" DataTextField=\"Text\" DataValueField=\"Value\"\
  \ AutoPostBack=\"true\">\n            </asp:DropDownList>\n        </td>\n    </tr>\n\
  </table>\n```\n\n4. 现在我们有了下拉控件，下一步是添加我们需要例程来从数据库中的存储过程填充下拉控件。让我们先创建存储过程。\n\n5. 双击打开\
  \ 01.00.00.SqlDataProvider 文件。\n\n> 如果你已经安装过一次此模块，你可以创建一个名为 01.00.01.SqlDataProvider\
  \ 的新文件来保存新过程。详情请参阅第 11 章中的配方 Deploying a new module version。\n\n6. 我们将向脚本添加一个新过程，它与\
  \ Starter Kit 创建的 GetEmployees 过程非常相似，但稍有调整。在示例 Employee 表中，有一个名为 ManagerNo 的字段保存员工经理的\
  \ ID。如果 ManagerNo 为 0，则表示该员工是经理。因此，为了获取下拉控件的所有经理列表，存储过程需要选择所有 ManagerNo 为 0 的员工。过程的代码如下：\n\
  \n```sql\ncreate procedure {databaseOwner}{objectQualifier}ACME_GetManagers\n\n\
  \    @ModuleId int\n\nas\n\nselect Emp.ModuleId,\nEmp.ItemId,\nEmp.FirstName,\n\
  Emp.LastName,\nManagerNo,\nHireDate,\nSalary,\nCreatedByUser,\nEmp.CreatedDate,\n\
  'CreatedByUserName' = Usr.FirstName + ' ' + Usr.LastName\nfrom {objectQualifier}ACME_Employee\
  \ As Emp\ninner join {objectQualifier}Users As Usr on Emp.CreatedByUser = Usr.UserId\n\
  where ModuleId = @ModuleId And ManagerNo = 0\n\nGO\n```\n\n7. 接下来我们需要创建将员工控制器连接到此存储过程的例程。双击打开\
  \ DataProvider.vb 文件。\n\n8. 滚动到文件底部并查找名为 Abstract methods 的代码区域。添加以下函数定义：\n\n```vb\n\
  Public MustOverride Function GetManagers(ByVal ModuleId As Integer) As IDataReader\n\
  ```\n\n9. 现在，打开 SqlDataProvider.vb 并滚动到文件底部 Public methods 区域。添加新函数：\n\n```vb\n\
  Public Overrides Function GetManagers(ByVal ModuleId As Integer) As IDataReader\n\
  \    Return CType(SqlHelper.ExecuteReader(ConnectionString,\n        GetFullyQualifiedName(\"\
  GetManagers\"),\n        ModuleId), IDataReader)\nEnd Function\n```\n\n10. 接下来我们需要更改\
  \ EmployeeController 文件。双击 EmployeeController.vb 并滚动到 Public methods 区域底部。添加以下代码：\n\
  \n```vb\nPublic Function GetManagers(ByVal ModuleId As Integer) As List(Of EmployeeInfo)\n\
  \n    Return CBO.FillCollection(Of EmployeeInfo)(DataProvider.Instance().GetManagers(ModuleId))\n\
  \nEnd Function\n```\n\n11. 在这一点上我们有了填充下拉列表所需的例程，但最后一步是在 EmployeeInfo 对象中提供一个新属性，以便在下拉控件中显示格式良好的经理姓名。双击\
  \ EmployeeInfo.vb 并向下滚动一点以添加以下代码：\n\n```vb\n' public properties\n\nPublic ReadOnly\
  \ Property ManagerName() As String\n    Get\n        Return _EmpLastName + \", \"\
  \ + _EmpFirstName\n    End Get\nEnd Property\n```\n\n12. 现在，为了将所有内容连接起来，我们需要进入 ViewEmployee\
  \ 代码隐藏并将下拉列表绑定到我们刚刚创建的例程。双击打开 ViewEmployee.ascx.vb 文件。\n\n13. 滚动到 Page_Load 过程并找到来自上一个配方的\
  \ BindSalaryDropDown 过程调用。在它之前添加 BindManagerDropDown 调用：\n\n```vb\nIf Page.IsPostBack\
  \ = False Then\n\n    BindManagerDropDown()\n    BindSalaryDropDown()\n\nEnd If\n\
  ```\n\n14. 滚动到 Private methods 区域并在 BindSalaryDropDown 之前添加此新过程：\n\n```vb\nPrivate\
  \ Sub BindManagerDropDown()\n\n    Dim objEmployeeController As New EmployeeController\n\
  \n    ddlManagerNo.DataSource =\n        objEmployeeController.GetManagers(ModuleId)\n\
  \    ddlManagerNo.DataTextField = \"ManagerName\"\n    ddlManagerNo.DataValueField\
  \ = \"ItemId\"\n\n    Try\n    ddlManagerNo.DataBind()\n\n    ' add an extra value\
  \ to always show a prompt in the drop down\n\n    ddlManagerNo.Items.Insert(0, New\
  \ ListItem\n        (Localization.GetString(\"ManagerPrompt\",\n            LocalResourceFile),\
  \ \"-1\"))\n```\n\n\n\n\n\n```\nCatch ex As Exception\nEnd Try\nEnd Sub\n\nPrivate\
  \ Sub BindSalaryDropDown()\n…\n```\n\n- 15. 如果你仔细观察之前的示例，我们会通过调用 `ddlManagerNo.Items.Insert()`\
  \ 例程，向下拉控件添加一条提示消息以及经理姓名。插入中的“-1”是该选择的值，而不是实际的经理编号。此外，我们遵循良好的编程实践，从资源文件中提取提示文本。但这意味着我们需要将提示以及新控件的标签添加到资源文件中。打开\
  \ `ViewEmployee.ascx.resx` 资源文件（位于 `/App_LocalResources` 下），并添加以下内容：\n\n   `lblManagerNo.Text`:\
  \ **经理 #**\n\n   `lblManagerNo.Help`: **选择经理**\n\n   `ManagerPrompt.Text`: **所有经理**\n\
  \n   ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_185_0.png)\n\n- 16. 我们最后要做的一件事是将新的存储过程添加到卸载脚本中，以确保在卸载模块时删除该存储过程。\n\
  \n- 17. 打开文件 `Uninstall.SqlDataProvider`。\n\n- 18. 滚动到脚本底部并添加以下内容：\n\n```\nDROP\
  \ PROCEDURE {databaseOwner}[{objectQualifier}ACME_GetManagers]\nGO\n```\n\n- 19.\
  \ 从**文件**菜单中选择**全部保存**。\n\n- 20. 要检查结果，请将模块生成并部署到你的 DNN 站点（有关说明，请参阅第 5 章中的*将模块作为独立包部署*）。\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_186_0.png)\n\n### 工作原理...\n\nHTML 表格通常用于在页面上排列控件。在本方案中，我们在一个\
  \ HTML 表格内放置了两个带有标签的下拉列表。这些筛选器将使用户能够控制 DataGrid 中显示的记录。\n\n### 另请参阅\n\n你可以在下一个方案中了解如何使用这些筛选器。\n\
  \n## 使用筛选控件显示 DataGrid\n\n在本方案中，我们将用功能更强大的 DataGrid 控件替换简单的 DataList 控件，并添加一个带有筛选器的可折叠面板。这是一个有用的数据输入控件组合，可以搜索和显示模块记录。\n\
  \n### 准备工作\n\n要继续本方案操作，必须先完成以下方案：\n\n- *创建可折叠面板*\n- *从 DNN 列表填充下拉列表*\n- *从存储过程填充下拉列表*\n\
  \n### 操作步骤...\n\n- 1. 启动开发工具并加载 Employee 项目。\n\n- 2. 展开 `References` 文件夹，确保显示了 `DotNetNuke.WebControls`。\n\
  \n- 3. 双击打开 `ViewEmployee.ascx` 文件。\n\n- 4. 在文件顶部添加代码，以注册 DotNetNuke.UI.WebControls\
  \ 命名空间。\n\n```aspx\n<%@ Register TagPrefix=\"dnn\" Namespace=\"DotNetNuke.UI.WebControls\"\
  \n    Assembly=\"DotNetNuke\" %>\n```\n\n- 5. 向下滚动到底部，直到看到现有的 DataList 代码：\n\n```aspx\n\
  <asp:datalist id=\"lstContent\" datakeyfield=\"ItemID\" runat=\"server\"\n    cellpadding=\"\
  4\">\n    <itemtemplate>\n        <table cellpadding=\"4\" width=\"100%\">\n   \
  \     ...\n        <asp:Label ID=\"lblSalary\" runat=\"server\" CssClass=\"Normal\"\
  \ />\n        </td>\n        </tr>\n        </table>\n    </itemtemplate>\n</asp:datalist>\n\
  ```\n\n- 6. 删除此代码，并替换为以下内容：\n\n```aspx\n<asp:datagrid id=\"grdResults\" AutoGenerateColumns=\"\
  false\"\n    width=\"100%\" CellPadding=\"2\" GridLines=\"None\"\n    cssclass=\"\
  DataGrid_Container\" Runat=\"server\">\n    <headerstyle cssclass=\"NormalBold\"\
  \ verticalalign=\"Top\"\n        horizontalalign=\"Center\"/>\n    <itemstyle cssclass=\"\
  Normal\" horizontalalign=\"Left\" />\n    <alternatingitemstyle cssclass=\"Normal\"\
  \ />\n    <edititemstyle cssclass=\"NormalTextBox\" />\n    <selecteditemstyle cssclass=\"\
  NormalRed\" />\n    <footerstyle cssclass=\"DataGrid_Footer\" />\n    <pagerstyle\
  \ cssclass=\"DataGrid_Pager\" />\n    <columns>\n        <dnn:imagecommandcolumn\
  \ CommandName=\"Edit\"\n            ImageUrl=\"~/images/edit.gif\" EditMode=\"URL\"\
  \n            KeyFieldId=\"ItemID\" />\n        <dnn:imagecommandcolumn CommandName=\"\
  Delete\"\n            ImageUrl=\"~/images/delete.gif\" KeyFieldId=\"ItemID\" />\n\
  \n        <dnn:textcolumn datafield=\"EmpFirstName\" headertext=\"First\" />\n \
  \       <dnn:textcolumn datafield=\"EmpLastName\" headertext=\"Last\"/>\n      \
  \  <dnn:textcolumn datafield=\"ManagerNo\"\n            headertext=\"Manager #\"\
  \ />\n        <dnn:textcolumn datafield=\"FormattedHireDate\"\n                headertext=\"\
  Hire Date\"/>\n        <dnn:textcolumn datafield=\"Salary\" headertext=\"Salary\"\
  />\n\n    </Columns>\n</asp:datagrid>\n```\n\n- 7. 双击打开 `01.00.00.SqlProvider` 文件。\n\
  \n> 如果你已经安装过此模块，可以创建一个名为 `01.00.01.SqlDataProvider` 的新文件来保存新过程。有关详细信息，请参阅第 11 章中的*部署新模块版本*。\n\
  \n- 8. 在 `Drop Existing Procedures` 部分的末尾添加：\n\n```sql\nif exists (select * from\
  \ dbo.sysobjects where id =\n           object_id(N'{databaseOwner}{objectQualifier}ACME_GetEmployeesByFilter')\
  \ and\n           OBJECTPROPERTY(id, N'IsProcedure') = 1)\n    drop procedure {databaseOwner}{objectQualifier}ACME_GetEmployeesByFilter\n\
  GO\n```\n\n- 9. 滚动到底部并添加以下新过程。这是包含筛选器的标准 `GetEmployees` 过程的修改版本。如果仔细查看，当筛选器的值为 `-1`\
  \ 时，我们会忽略它们。这就是我们在前面几个方案中放入下拉列表的 `-1`。\n\n```sql\nCREATE procedure {databaseOwner}{objectQualifier}ACME_GetEmployeesByFilter\n\
  \    @ModuleID int,\n    @MgrFilter int,\n    @SalaryFilter int\nAS\n\n/** If we\
  \ pass -1 for a numeric filter it means ignore the filter\n**/\n\n/** create a temp\
  \ table to hold the Ids of our results **/\n\n    CREATE TABLE #PageIndex\n    (\n\
  \        IndexID    int IDENTITY (1, 1) NOT NULL,\n        ItemId     int\n    )\n\
  ```\n\n- 10. 由于我们已向模块添加了新过程，还必须将其添加到卸载脚本中，以便在卸载模块时将其删除。双击打开 Uninstall.SqlDataProvider\
  \ 文件。\n\n- 11. 向下滚动到底部，添加以下 Drop Procedure：\n\n```sql\nDROP PROCEDURE {databaseOwner}[{objectQualifier}ACME_DeleteEmployee]\n\
  GO\n\nDROP PROCEDURE {databaseOwner}[{objectQualifier}ACME_GetEmployeesByFilter]\n\
  GO\n```\n\n/**************************************************************/\n/*****\
  \              SqlDataProvider              *****/\n/**************************************************************/\n\
  \n- 12. 接下来，双击打开 DataProvider.vb 文件。\n\n- 13. 现在我们需要将新的筛选函数定义为抽象方法。这定义了函数的参数（我们将传递哪些筛选器）和返回类型（找到的记录数据集）。滚动到文件底部，在“Abstract\
  \ Methods”区域的末尾添加新函数：\n\n```vbnet\n#Region \"Abstract methods\"\n\n    Public MustOverride\
  \ Function GetEmployees(ByVal ModuleId As Integer) As IDataReader\n...\n    Public\
  \ MustOverride Sub DeleteEmployee(ByVal ModuleId As Integer, ByVal ItemId As Integer)\n\
  \n    Public MustOverride Function GetEmployeesByFilter(ByVal ModuleId As Integer,\
  \ ByVal MgrFilter As Integer, ByVal SalaryFilter As Integer) As IDataReader\n\n\
  #End Region\n```\n\n- 14. 双击打开 SqlDataProvider.vb 文件。\n\n- 15. 现在我们提供函数体。我们调用存储过程，并将找到的记录作为数据集返回。滚动到文件底部，在“Public\
  \ Methods”区域的末尾添加此新过程：\n\n```vbnet\nPublic Overrides Function GetEmployeesByFilter\n\
  \    (ByVal ModuleId As Integer,\n     ByVal MgrFilter As Integer,\n     ByVal SalaryFilter\
  \ As\n```\n\n- 19. 找到“Public Properties”部分，并添加属性 FormattedHireDate，以提供格式良好的日期。\n\
  \n```vbnet\n' public properties\n\nPublic Property FormattedHireDate() As String\n\
  \    Get\n        Return _HireDate.ToShortDateString\n    End Get\n    Set(ByVal\
  \ Value As String)\n        _HireDate = CDate(Value)\n    End Set\nEnd Property\n\
  \nPublic Property ModuleId() As Integer\n```\n\n- 20. 双击打开 ViewEmployee.ascx.vb\
