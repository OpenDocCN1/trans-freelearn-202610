  \ = 0 ' manager image\n        objParentNode.ClickAction = eClickAction.Expand '\
  \ when\n                                                         ' click on a manager,\
  \ expand\n        objParentNode.HasNodes = True\n        treeManager.TreeNodes.Add(objParentNode)\n\
  \n        PopulateEmployeeNodes(objParentNode, drMgr(\"ItemId\"))\n    Loop\n\n\
  End If\n\ndrMgr.Close()\n\nEnd Sub\n\nPrivate Sub PopulateEmployeeNodes(ByRef objParentNode\
  \ As TreeNode,\n                                  ByVal ParentItemId As Integer)\n\
  \n    Dim objChildNode As TreeNode\n\n    ' get the list of all employee with the\
  \ given manager\n\n    Dim objEmployeeController As New EmployeeController\n   \
