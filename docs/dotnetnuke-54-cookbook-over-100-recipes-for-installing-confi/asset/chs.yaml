  \ StyleSheet1.css As...**。\n\n18. 浏览到 ASCXImageContainer 文件夹并将文件保存为 container.css。\n\
  \n19. 你还可以制作新容器的预览图像，例如：\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_274_0.png)\n\
  \n20. 将图像文件保存为 ASCXImageContainer.jpg。\n\n21. 要查看新容器在我们网站上的外观，首先以 SuperUser 身份登录。\n\
  \n22. 在 **Admin** 菜单下选择 **Skins**。\n\n23. 从 **Containers:** 下拉列表中选择 **ASCXImageContainer**。\n\
  \n\n\n\n\n24. 新的 ASCXContainer 现在将会显示：\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_275_0.png)\n\
  \n25. 若要查看容器的外观，请单击“预览”链接。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_275_1.png)\n\
  \n26. 我们可以看到，这些图像在容器周围形成边框，模块标题位于左侧，紧邻悬停菜单。此外，可以看到我们在步骤11中创建的操作按钮出现在容器下方。还要注意，顶部和底部的线条图像会自动填充到容器的整个宽度。\n\
  \n## 使用图像设置菜单样式\n\n在本教程中，我们将使用简单的 ASCX 皮肤，并展示如何通过将菜单控件与背景图像相结合来为菜单设置外观。\n\n使用图像为\
  \ DNN 菜单设置外观包括两部分：第一部分是构成菜单背景的一组图像；第二部分是由菜单控件提供的菜单中显示的文本。\n\n## 基本外观设置\n\n在本教程中，我们将详细研究为模板皮肤创建的专业外观菜单。我们将看到构成菜单的所有部分、如何为其创建背景图像以及如何设置文本样式。当所有部分到位后，我们将会得到一个如下所示的菜单：\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_276_0.png)\n\n## 准备工作\n\n要继续本教程，您必须已完成以下教程：\n\
  \n- 下载并安装皮肤\n- 创建简单的 ASCX 皮肤\n\n## 操作步骤\n\n1. 首先，在测试 DNN 门户中找到默认皮肤文件夹（`\\\\Portals\\\
  \\_default\\\\Skins`）。\n2. 接下来，创建一个新文件夹来存放皮肤文件。将此文件夹命名为 `ASCXMenuSkin`。\n3. 在其中创建一个新文件夹以存放图像：`ASCXMenuSkin\\\
  \\images`。\n4. 找到 *下载并安装皮肤* 教程中模板皮肤所在的文件夹。\n5. 找到以下图像并将其复制到 `ASCXMenuSkin\\\\images`\
  \ 文件夹中。\n   - `menu_bg.png`\n   - `menu_hov.png`\n   - `menu_left.png`\n   - `menu_right.png`\n\
  \   - `submenu_hov.png`\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_276_1.png)\n\
  \n6. 图像就位后，我们现在可以打开 *创建简单的 ASCX 皮肤* 教程中创建的示例 ASCX，并进行扩展以使用菜单图像。\n7. 启动开发工具。\n8.\
  \ 从**文件**菜单中选择**打开文件...**。\n9. 浏览到 SampleASCXSkin 文件夹，并选择 SampleASCXSkin.ascx 文件。\n\
  10. 在注册 DIV 和登录 DIV 之间找到菜单皮肤对象：\n\n```\n<%@ Register TagPrefix=\"dnn\" TagName=\"\
  LOGIN\" Src=\"~/Admin/Skins/Login.ascx\" %>\n\n<div >\n    <dnn:NAV runat=\"server\"\
  \ id=\"dnnNAV\"\n        ProviderName=\"DNNMenuNavigationProvider\"\n        IndicateChildren=\"\
  false\"\n        ControlOrientation=\"Horizontal\" />\n</div>\n\n<div id=\"login_style\"\
  \ class=\"user\">\n```\n\n11. 用下面这个使用 CSS 样式的 DIV 替换包含菜单的 DIV：\n\n```\n<%@ Register\
  \ TagPrefix=\"dnn\" TagName=\"LOGIN\" Src=\"~/Admin/Skins/Login.ascx\" %>\n\n<div\
  \ class=\"menu_style\">\n    <dnn:NAV runat=\"server\" id=\"dnnNAV\"\n        ProviderName=\"\
  DNNMenuNavigationProvider\"\n        IndicateChildren=\"false\"\n        ControlOrientation=\"\
  Horizontal\"\n        CSSControl=\"mainMenu\" />\n</div>\n<div id=\"login_style\"\
  \ class=\"user\">\n```\n\n12. 从**文件**菜单中选择**将 SampleASCXSkin.ascx 另存为...**。\n13.\
  \ 浏览到 ASCXMenuSkin 文件夹，并将文件保存为 ASCXMenuSkin.ascx。\n14. 由于真正的工作在 CSS 文件中，我们需要定义样式，为菜单提供图像、字体和颜色。从**文件**菜单中选择**打开文件...**。\n\
  15. 浏览到 SampleASCXSkin 文件夹，并选择 skin.css 文件。\n16. 滚动到文件底部，首先添加以下类：\n\n```\n/* step\
  \ 1: the main menu */\n\n.mainMenu                 {font-family: Verdana, Arial,\n\
  Helvetica, sans-serif; cursor: pointer; font-size: 13px; font-\nweight: bold;}\n\
  .mainMenu_bg              {background: url(images/menu\nbg.png) repeat-x top left;\
  \ margin: 0 19px 0 7px; height: 40px;}\n.mainMenu_left            {background: url(images/menu_left.\n\
  ```\n\n```\npng) no-repeat top left;}\n.mainMenu_right                    {background:\
  \ url(images/menu_right.png) no-repeat top right;}\n.mainMenu .root            \
  \        {text-align: center; line-height: 40px; padding: 12px 12px 12px 12px; color:\
  \ White;}\n```\n\n17. 如果此时保存文件，然后从门户查看皮肤，菜单将如下所示：\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_278_0.png)\n\
  \n18. 接下来要添加的是菜单悬停和活动菜单。这些图像将在鼠标悬停在主菜单文本上或菜单处于活动状态时显示。这是一张窄图像，但 repeat-x 会使其水平扩展，以填满菜单文本的长度。将此代码添加到\
  \ CSS 文件底部：\n\n```\n/* Main menu hover */\n.mainMenu .hov{ color:#fff; background:url(images/menu_hov.png)\
  \ repeat-x top left;}\n```\n\n```\n/* Main menu selected */\n.mainMenu .sel, .mainMenu\
  \ .bc {\ncolor:#FFF;\nbackground:url(images/menu_hov.png) repeat-x top left;\n}\n\
  ```\n\n19. 这创建了一个在鼠标悬停在菜单项上时显示的图像，我们将在菜单处于活动状态时使用相同的图像：\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_278_1.png)\n\
  \n20. 最后一步是为子菜单提供样式。将以下代码添加到 skin.css 文件底部：\n\n```\n/* general submenu css */\n\n\
  .mainMenu .m                        {width: 160px; font-size: 11px; font-weight:\
  \ bold; z-index: 1000; line-height: 2em;}\n.mainMenu .m .mi                    {background-color:\
  \ #242424;}\n.mainMenu .m .icn                   {padding-left: 5px; width: 20px;}\n\
  .mainMenu .m .mi *                  {color: white; margin-right: 5px;}\n/* change\
  \ * to .txt with latest webcontrols */\n.mainMenu .m .sel, .mainMenu .m .bc {background:\
  \ url(images/submenu_hov.png) repeat-x top left;}\n```\n\n```\n.mainMenu .m .hov\n\
  { background: url(images/submenu_hov.png) repeat-x top left; }\n```\n\n21. 这创建了鼠标悬停在子菜单上时显示的图像：\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_279_0.png)\n\n22. 从“文件”菜单中选择“将 skin.css\
  \ 另存为...”。\n\n23. 浏览到 ASCXMenuSkin 文件夹，并将文件保存为 skin.css。\n\n24. 你还可以制作新容器的预览图像，类似于：\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_279_1.png)\n\n25. 将图像文件保存为 ASCXMenuSkin.jpg。\n\
  \n26. 要查看新皮肤在网站上的效果，请以超级用户身份登录。\n\n27. 在 Admin 菜单下查看，然后选择 Skins。\n\n28. 从“Skins:”下拉列表中选择\
  \ ASCXMenuSkin。\n\n29. 新的 ASCXMenuSkin 现在将会显示：\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_279_2.png)\n\
  \n30. 这是一个非常简单的示例，但它展示了菜单外观设置的基础知识。\n\n## 9\n\n## 多语言支持\n\n- 下载并安装语言包\n- 通过单个门户创建双语站点\n\
  - 编辑语言资源文件\n- 创建你自己的模块翻译\n- 确定需要翻译的控件\n- 本地化标签、标题、面板和链接\n- 使用存储过程本地化下拉列表\n- 使用 DNN\
  \ 列表本地化下拉列表\n- 本地化存储过程\n- 本地化 DataGrid 控件\n\n## 简介\n\n随着世界日益变小，网站支持多种语言的能力变得越来越重要。幸运的是，DNN\
  \ 通过一个称为“本地化”的过程提供外语支持。\n\nDNN 本地化建立在 .NET 框架本地化工具的基础之上。由于同一种语言往往在多个国家使用，.NET 中的外语按区域设置代码组织，该代码由语言代码和国家代码组合而成。例如，代码\
  \ `fr-CA` 代表加拿大使用的法语，`Fr-FR` 代表法国使用的法语。\n\n## 一带一路（Belt and Road）\n\n中国的“一带一路”倡议是一项旨在促进贸易和基础设施建设的计划。\n\
  \n该计划于2013年在时任国家主席胡锦涛出席博鳌亚洲论坛年会时宣布，名称源于古代丝绸之路网络。目前，该计划已涉及60多个国家，以及从公路、港口到油气田等领域的众多大型基础设施项目。\n\
  \n中方表示，该倡议将促进与邻国的贸易和基础设施建设，并为中国商品打开海外市场。\n\n\n\n\n\n- 3. 向下滚动，你会看到许多可用的语言包。这些大多由个人创建，链接指向许多不同的网站。在本示例中，点击法语（加拿大）(fr-CA)\
  \ 链接。\n\n  ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_283_0.png)\n\n- 4. 所选语言包的详细信息将会显示。点击右下角的\
  \ **DOWNLOAD** 链接。\n\n- 5. 将出现一个对话框，询问你是要打开还是保存文件。点击 **保存**，并为这个 ZIP 文件选择一个临时文件夹。\n\
  \n- 6. 下载完成后，你可以关闭浏览器。下一步是上传并安装语言包到 DNN 站点。如果你之前没有安装过扩展，请参阅第 1 章中的食谱 *安装新扩展*。\n\n\
  - 7. 你可以通过从 **主机** 菜单中选择 **扩展** 来确认语言包是否成功安装。所有已安装的语言包将显示在页面中间、容器和模块列表之间。\n\n  ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_283_1.png)\n\
  \n## 使用单个站点创建双语站点\n\n创建双语 DNN 站点最简单的方法是在默认门户上安装并启用多种语言。如果你的门户在两种语言之间基本保持不变（相同的菜单布局、相同的一般内容、相同的皮肤和相同的管理员用户），这是一个不错的选择。\n\
  \n### 准备工作\n\n要遵循本食谱，你必须已完成上一个食谱：\n\n- *下载并安装语言包*\n\n### 操作步骤...\n\n- 1. 要拥有一个双语门户，你必须首先按照食谱\
  \ *下载并安装语言包* 中的说明下载并安装所需的语言包。\n\n- 2. 从 **管理员** 菜单中选择 **语言**。将显示你门户的已安装语言包：\n\n\
  \  ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_284_0.png)\n\n- 3. 要选择门户的语言，请点击语言旁边的\
  \ **已启用** 复选框。稍等片刻后，**更新** 和 **取消** 链接将显示。\n\n- 4. 点击 **更新** 保存更改。\n\n- 5. 如果你启用了多种语言，门户页面上将出现语言选择器控件（取决于门户使用的皮肤）。点击不同的国旗图标将更改门户的当前语言。尝试点击加拿大国旗。\n\
  \n  ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_284_1.png)\n\n- 6. 注意注销链接上的标签已从 **Logout**\
  \ 更改为 **Déconnexion**。\n\n### 另请参阅\n\n在本食谱中，我们看到了启用语言包如何自动本地化某些共享资源。请参阅本章中的其他食谱，了解如何本地化其他资源。\n\
  \n## 编辑语言资源文件\n\nDNN 提供了编辑门户上安装的语言资源的能力。这意味着你可以修改页面上的标签、系统消息和其他文本。这不仅提供了多语言支持，还意味着你可以用自己的文本自定义这些消息（例如，将“Login”更改为“Sign\
  \ On”）。\n\nDNN 有三个级别的语言资源支持：\n\n- **共享（应用程序）：** 这些是 DNN 中各个控件共享的翻译字符串，例如“Update”、“Cancel”或常见的系统消息字符串。\n\
  - **本地：** 这些是用户控件独有的翻译字符串。\n- **全局：** 这些是介于应用程序和本地之间共享组件的翻译字符串。\n\n此外，DNN 提供门户、主机或系统级别的资源文件。例如，这意味着即使在同一种语言中，你也可以在站点的不同门户上显示不同的字符串。\n\
  \n在本食谱中，我们将通过以超级用户身份登录并更改示例员工项目中使用的 **每页结果数** 控件的文本来了解如何修改共享资源文件。\n\n### 准备工作\n\n\
  要跟随操作，你必须已完成第 6 章中的以下食谱：\n\n- *显示带筛选控件的数据网格*\n\n### 操作步骤...\n\n- 1. 以超级用户身份登录（在我们的示例中为\
  \ *syshost*）。\n- 2. 查看 **管理员** 菜单并选择 **语言**。将显示你门户的已安装语言包。\n- 3. 在此示例中，我们将编辑英语。点击“门户”下英语旁边的编辑图标（小铅笔）。\n\
  \n## 创建你自己的模块翻译\n\n### 操作步骤...\n\n- 1. 以超级用户身份登录（在我们的示例中为 `syshost`）。\n- 2. 查看 **管理员**\
  \ 菜单并选择 **语言**。将显示你门户的已安装语言包。\n- 3. 点击“门户”下法语（加拿大）旁边的编辑图标（小铅笔）进入 **语言编辑器**。\n\n\
  \  ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_288_0.png)\n\n- 4. 点击左侧的 **LocalResources**。展开子文件夹并向下钻取，直到看到\
  \ EditEmployee.ascx。\n- 5. 点击 EditEmployee.ascx 以显示可用的翻译字符串。\n- 6. 如果这是你第一次为此模块创建法语翻译，你首先会看到从默认语言资源文件中提取的英文翻译，该文件是在食谱\
  \ *从资源文件显示标签* 中创建的。\n- 7. 将每个英文字符串替换为法语翻译字符串，如下所示：\n\n  - `ControlTitle_edit.Text`：**Modifier\
  \ Employé**\n  - `lblEmpFirstName.Help`：**Entrez le prénom de l'employé.**\n  -\
  \ `lblEmpFirstName.Text`：**Prénom**\n  - `lblEmpLastName.Help`：**Entrez le nom de\
  \ famille de l'employé.**\n  - `lblEmpLastName.Text`：**Nom de famille**\n  - `lblHireDate.Help`：**Entrez\
  \ la date d'embauche de l'employé.**\n  - `lblHireDate.Text`：**Date d'embauche**\n\
  \  - `lblManagerNo.Help`：**Entrez le numéro d'identification du gérant salarié**\n\
  \  - `lblManagerNo.Text`：**Gestionnaire #**\n  - `lblSalary.Help`：**Entrez salaire\
  \ annuel du salarié.**\n  - `lblSalary.Text`：**Salaire**\n\n- 8. 页面应该开始看起来像这样：\n\
  \n  ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_289_0.png)\n\n- 9. 当你输入所有翻译后，点击页面底部的\
  \ **保存资源文件** 链接。\n\n- 10. 要查看结果，首先通过点击语言选择器控件为门户选择法语作为语言（有关示例，请参阅食谱 *使用单个门户创建双语站点*）。\n\
  \n- 11. 接下来，转到员工模块并选择一个员工进行编辑。\n\n- 12. 当 **编辑员工** 控件显示时，标签现在将以法语显示，并带有正确的帮助消息：\n\
  \n  ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_289_1.png)\n\n## 确定需要翻译的控件\n\n有时你的\
  \ DNN 表单有很多控件，你可能难以确定哪些需要在本地资源文件中进行翻译。DNN 提供了一种技术，当资源文件中没有翻译字符串时，可以让表单上的每个控件显示其使用的资源键。\n\
  \n### 准备工作\n\n要跟随本食谱，你必须已完成第 6 章中的以下食谱：\n\n- *从资源文件显示标签*\n\n### 操作步骤...\n\n- 1.\
  \ 在 DNN 服务器上查找 DNN 安装的根文件夹。\n- 2. 找到 web.config 文件并在文本编辑器中打开它。\n- 3. 向下滚动文件，直到看到\
  \ ShowMissingKeys 键。\n- 4. 使用以下代码将此键的值设置为 true：\n\n  ```xml\n  <add key=\"AutoUpgrade\"\
  \ value=\"true\" />\n  <add key=\"UseInstallWizard\" value=\"true\" />\n  <add key=\"\
  InstallMemberRole\" value=\"true\" />\n  <!--强制控件显示缺失的翻译键 -->\n  <add key=\"ShowMissingKeys\"\
  \ value=\"true\" />\n  <add key=\"EnableWebFarmSupport\" value=\"false\" />\n  <add\
  \ key=\"EnableCachePersistence\" value=\"false\" />\n  <add key=\"HostHeader\" value=\"\
  \" />\n  ```\n\n- 5. 现在登录 DNN 站点并导航到你正在开发的模块。\n\n  ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_290_0.png)\n\
  \n- 6. 模块将检查资源文件中的翻译字符串。如果未找到翻译，则显示缺失的键。在此示例中，如果我们想为可折叠面板提供翻译，我们需要将键 `Settings.Text`\
  \ 添加到资源文件中。\n- 7. 要关闭此功能并恢复模块的正常外观，请将 `ShowMissingKeys` 设置为 false。\n\n## 本地化标签、标题、面板和链接\n\
  \n在本食谱中，我们将继续在食谱 *创建你自己的模块翻译* 中开始的示例员工项目的本地化。在此示例中，我们将本地化出现在 ViewEmployee 控件上的标签、模块标题、折叠面板、网格列标题和链接。我们必须做四件事：\n\
  \n\n\n1. 修改 Employee 项目，使其从资源文件中读取模块标题。\n2. 将模块标题的英文文本添加到资源文件中。\n3. 将模块部署到测试站点。\n\
  4. 检查该模块的所有英文字符串，并为每个字符串创建法语翻译。\n\n## 准备工作\n\n本方案将使用示例 Employee 项目中的 ViewEmployee\
  \ 控件。你还需要已经为 ViewEmployee 控件创建好英文标签。也就是说，要跟着操作，你必须已经完成之前的方案：\n\n- 通过存储过程填充下拉列表\n\
  - 创建你自己的模块翻译\n\n## 操作步骤\n\n1. 首先启动开发工具并加载 Employee 项目。\n2. 首先，我们要对 View Employee\
  \ 模块的标题进行本地化。打开 ViewEmployee.ascx.vb 文件。\n3. 向下滚动到“事件处理程序”区域，找到 Page_Init 过程。\n\
  4. 在该过程的顶部添加下面这行代码：\n```\nPrivate Sub Page_Init(ByVal sender As System.Object,\n\
  \                    ByVal e As System.EventArgs)\n                    Handles MyBase.Init\n\
  \n    If Not Request.QueryString(\"CurrentPage\") Is Nothing Then\n    PageIndex\
  \ = CType(Request.QueryString(\"CurrentPage\"), Integer)\n    End If\n\n    ModuleConfiguration.ModuleTitle\
  \ = Localization.GetString\n                                (\"ModuleTitle\", LocalResourceFile)\n\
  \n    ' Format the columns of the grid control\n```\n5. 这将从资源文件中读取模块标题。（不过这并不完美。当模块添加到页面时，这个标题仍可能被指定的标题覆盖。）\n\
  6. 接下来，我们需要将英文文本添加到本地资源文件中。打开 ViewEmployee.ascx.resx 文件。\n\n## 处理外语\n\n7. 添加以下条目：\n\
  \   - `ModuleTitle.Text`: **Current ACME Employees**\n   - `Settings.Text`: **Collapsible\
  \ Panel**\n\n8. 从“文件”菜单中选择 **全部保存**。\n\n9. 生成模块并将其部署到你的 DNN 站点。\n\n10. 现在我们来创建对应的法语翻译。以超级用户（我们的示例中是\
  \ syshost）身份登录。\n\n11. 在 **管理** 菜单下查看，并选择 **语言**。将显示门户已安装的语言包。\n\n12. 单击“门户”下 **Français\
  \ (Canada)** 旁边的编辑图标（小铅笔），进入语言编辑器。\n\n13. 单击左侧的 **LocalResources**。展开子文件夹并逐层向下，直到看到\
  \ `ViewEmployee.ascx`。\n\n14. 单击 `ViewEmployee.ascx` 以显示可用的翻译字符串。\n\n15. 如果这是你第一次为此模块创建法语翻译，你首先会看到来自默认语言资源文件的英文翻译。\n\
  \n16. 按如下所示，将每个英文字符串替换为法语翻译字符串：\n   - `AddContent.Action`: **Ajouter des nouveaux\
  \ employés**\n   - `lblManagerNo.Help`: **Choisissez un gestionnaire**\n   - `lblManagerNo.Text`:\
  \ **Gestionnaire #**\n   - `lblSalaryRange.Help`: **Choisissez l’échelle salariale**\n\
  \   - `lblSalaryRange.Text`: **Échelle salariale**\n   - `ManagerPrompt.Text`: **Tous\
  \ les gestionnaires**\n   - `ModuleTitle.Text`: **Les employés actuels de l'ACME**\n\
  \   - `SalaryPrompt.Text`: **Salaire Sélectionnez**\n   - `Settings.Text`: **Pliant\
  \ Panneau**\n\n17. 页面应如下所示：\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_293_0.png)\n\
  \n18. 单击最底部的“保存资源文件”按钮。\n\n19. 要查看结果，请转到 Employee 模块。\n\n20. 使用“语言选择器”控件在语言之间切换。你将看到模块标题、可折叠面板上的标签、下拉列表标签以及“添加员工”链接现在会在英语和法语之间切换。\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_293_1.png)\n\n## 另请参阅\n\n在本方案中，我们对示例\
  \ `ViewEmployee` 控件上的部分项目进行了本地化。要了解如何本地化其余项目，请参阅本章中的其他方案。\n\n## 使用存储过程本地化下拉列表\n\n\
  如*第 6 章*所示，你可以通过存储过程填充下拉列表控件。在本方案中，我们将演示如何使用当前区域设置动态更改填充列表的存储过程返回的结果，从而本地化下拉列表。\n\
  \n## 准备工作\n\n要跟着操作，你必须已完成以下方案：\n\n- *通过存储过程填充下拉列表*\n- *本地化标签、标题、面板和链接*\n\n本方案还需要做一些数据准备。为了演示下拉列表如何根据所选区域设置填充，我们需要在\
  \ employee 表中创建一个特殊的员工。该员工将是在魁北克工作的员工的经理。\n\n## 操作步骤\n\n1. 首先启动开发工具并加载 **Employee**\
  \ 项目。\n2. 首先，我们需要为 Employee 表中的每个员工和经理添加一个新字段。这个新字段名为 `LocaleCode`，我们将设置该代码，以便可以把一些经理标记为英语使用者，把另一些标记为法语使用者。第二个任务是修改*第\
  \ 6 章*中的 `GetManagers` 存储过程，并添加 `CurrentLocale` 作为参数。\n3. 双击打开 `01.00.00.SqlDataProvider`\
  \ 文件。\n\n> 如果你已经安装过该模块，可以创建一个名为 `01.00.01.SqlDataProvider` 的新文件来存放更新后的过程。有关详细信息，请参阅*第\
  \ 11 章*中的方案*部署新模块版本*。\n\n4. 修改建表代码，使其包含新字段：\n```\nCREATE TABLE {databaseOwner} [{objectQualifier}ACME_Employee]\n\
  (\n    [ModuleID] [int] NOT NULL,\n    [ItemID] [int] NOT NULL IDENTITY(1, 1),\n\
  \    [EmpFirstName] [nvarchar] (30) NOT NULL,\n    [EmpLastName] [nvarchar] (30)\
  \ NOT NULL,\n    [ManagerNo] [int] NULL,\n    [HireDate] [datetime] NOT NULL,\n\
  \    [Salary] [float] NOT NULL,\n    [LocaleCode] [nvarchar] (10) NULL,\n    [CreatedByUser]\
  \ [int] NOT NULL,\n    [CreatedDate] [datetime] NOT NULL\n)\n```\n\n5. 接下来，向下滚动并按指示修改\
  \ GetManagers 例程。在顶部添加新参数，并将其添加到 SELECT 语句的 WHERE 子句中：\n```\ncreate procedure {databaseOwner}{objectQualifier}ACME_GetManagers\n\
  \n@ModuleId int,\n@CurrentLocale nvarchar(10)\n\nas\n\nselect Emp.ModuleId,\n  \
  \  Emp.ItemId,\n    EmpFirstName,\n    EmpLastName,\n    ManagerNo,\n    HireDate,\n\
  \    Salary,\n    CreatedByUser,\n    Emp.CreatedDate,\n    'CreatedByUserName'\
  \ = Usr.FirstName + ' ' + Usr.LastName\nfrom {objectQualifier}ACME_Employee As Emp\n\
  inner join {objectQualifier}Users As Usr on Emp.CreatedByUser = Usr.UserId\nwhere\
  \ ModuleId = @ModuleId And ManagerNo = 0\nAnd LocaleCode = @CurrentLocale\n\nGO\n\
  ```\n\n13. 从**文件**菜单中选择**全部保存**。\n\n14. 要检查结果，请生成并重新部署模块到你的 DNN 站点。\n\n15. 接下来，我们需要准备一些示例员工数据，其中既包含英语经理，也包含法语经理。首先，我们在\
  \ employee 表中放置一个特殊员工，他将成为魁北克员工的经理。以超级用户身份登录 DNN 站点。\n\n16. 转到 **ACME Employee**\
  \ 页面。\n\n17. 单击**添加员工**链接。\n\n18. 按如下所示添加新员工：\n   - **名字：** René\n   - **姓氏：** Malebranche\n\
  \   - **经理 #：** 0\n   - **聘用日期：** 2/23/2007\n   - **薪水：** 80000\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_297_0.png)\n\
  \n19. 接下来，我们需要为员工标记其活动区域设置。首先从**宿主**菜单中选择 **SQL**。\n\n20. 首先，我们将标记英语员工和经理（基本上就是除\
  \ Malebranche 先生之外的所有人）。将以下 UPDATE 语句粘贴到文本框中：\n```\nUPDATE {databaseOwner}[{objectQualifier}ACME_Employee]\
  \ SET LocaleCode='en-US' WHERE EmpLastName<>'Malebranche';\n```\n\n21. 单击**执行**按钮。\n\
  \n22. 然后，我们将为这位新的法语经理标记正确的区域设置代码。将以下 UPDATE 语句粘贴到文本框中：\n```\nUPDATE {databaseOwner}[{objectQualifier}ACME_Employee]\
  \ SET LocaleCode='fr-CA' WHERE EmpLastName='Malebranche';\n```\n\n23. 单击**执行**按钮。\n\
  \n24. 要检查结果，请粘贴以下 SQL 查询并单击“执行”：\n```\nSELECT EmpFirstName, EmpLastName, ManagerNo,\
  \ LocaleCode\nFROM {databaseOwner}[{objectQualifier}ACME_Employee];\n```\n\n\n\n\
  25. 根据表中的记录，你应该看到类似以下内容：\n\n| EmpFirstName | EmpLastName | ManagerNo | LocaleCode\
  \ |\n| John | Smith | 0 | en-US |\n| Jane | Doe | 0 | en-US |\n| Richard | Roe |\
  \ 0 | en-US |\n| Kevin | Jones | 1 | en-US |\n| Amy | Roe | 1 | en-US |\n| Marianne\
  \ | Brown | 8 | en-US |\n| Debbie | Smith | 9 | en-US |\n| René | Malebranche |\
  \ 0 | fr-CA |\n\n26. 现在我们有了一些不错的示例数据，可以准备查看本地化效果了。前往 Employee 模块。\n\n27. 使用 Language\
  \ Selector 控件在语言之间切换。下拉列表现在应该随着区域设置的更改而变化，提示和值列表都从英语变为法语：\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_298_0.png)\n\
  \n## See also\n\nSee the next recipe Localizing a drop-down list with a DNN list\
  \ to localize a drop-down list that is built from a DNN list instead of an SQL query.\n\
  \n## Localizing a drop-down list with a DNN list\n\nAs we saw in Chapter 6, you\
  \ can populate a drop-down list control from a DNN list. Although the current version\
  \ of DNN does not directly support localization with lists, we can create our own\
  \ localization of a drop-down list control by dynamically switching the DNN list\
  \ before binding it to the control.\n\nIn this recipe we will create a new DNN list\
  \ in French then show how to use the current locale to pick the DNN list that populates\
  \ the control.\n\n## Getting ready\n\nTo follow along you must have completed the\
  \ following recipes:\n\n- Populating a drop-down list from a DNN list\n- Creating\
  \ your own module translations\n\n## How to do it...\n\n1. Log in as SuperUser (`syshost`\
  \ in our examples).\n2. Look under the **Host** menu and select **Lists**.\n3. Make\
  \ a new list by clicking on **Add List**.\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_299_0.png)\n\
  \n4. Type the details of our first entry:\n\n- **List Name**: `Échelle salariale`\n\
  - **Parent List**: None Specified\n- **Parent Entry**: Blank\n- **Entry Text**:\
  \ `0 ou plus`\n- **Entry Value**: `0`\n- **Enable Sort Order**: Checked\n\n5. Click\
  \ on **Save**.\n\n> It is up to us to format the currency we're using in the list—DNN\
  \ will not format it for us as real list localization is not supported.\n\n6. Click\
  \ on **Add Entry** and create the second list entry:\n\n- **Entry Text**: `30.000\
  \ ou plus`\n- **Entry Value**: `30000`\n\n7. Click on **Save**.\n\n8. Click on **Add\
  \ Entry** and create the third list entry:\n\n- **Entry Text**: `60.000 ou plus`\n\
  - **Entry Value**: `60000`\n\n9. Click on **Add Entry** and create the fourth list\
  \ entry:\n\n- **Entry Text:** `100.000 ou plus`\n- **Entry Value:** `100000`\n\n\
  10. Click on **Save.**\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_300_0.png)\n\n\
  11. Now that we have a foreign language DNN list, we can use it inside our custom\
  \ module. Launch the Development Tool and load the **Employee** project.\n\n12.\
  \ Next, open the `ViewEmployee.ascx.vb` file.\n\n13. Scroll down until you find\
  \ the `BindSalaryDropDown` procedure. If you don't see the procedure make sure you\
  \ have completed the recipe *Populating a drop-down list from a DNN list* from *Chapter\
  \ 6*.\n\n14. Change the code of the procedure as follows:\n\n```\nPrivate Sub BindSalaryDropDown()\n\
  \n    Dim strListName As String\n    Dim strPrompt As String\n    strListName =\
  \ Localization.GetString(\"SalaryListName\",\n                        LocalResourceFile)\n\
  \    strPrompt = Localization.GetString(\"SalaryPrompt\",\n                    \
  \    LocalResourceFile)\n\n    Dim objList As New ListController()\n    Dim lstSalary\
  \ As ListEntryInfoCollection =\n        objList.GetListEntryInfoCollection(strListName)\n\
  \n    ddlSalaryRange.DataSource = lstSalary\n    ddlSalaryRange.DataTextField =\
  \ \"Text\"\n    ddlSalaryRange.DataValueField = \"Value\"\n```\n\n```\nTry\nddlSalaryRange.DataBind()\n\
  \n' add an extra value to always show a prompt in the drop down\nddlSalaryRange.Items.Insert(0,\
  \ New ListItem(strPrompt, \"-1\"))\nCatch ex As Exception\nEnd Try\n\nEnd Sub\n\
  ```\n\n15. As we are now pulling our prompts from the resource files, we need to\
  \ first add the English text by opening the ViewEmployee.ascx.resx file (under /App_LocalResources)\
  \ and setting the text:\n\n- SalaryListName.Text: Salary Range\n- SalaryPrompt.Text:\
  \ Pick the salary range you want to select\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_301_0.png)\n\
  \n16. Select Save All from the File menu.\n\n17. Build and deploy the module to\
  \ your DNN site.\n\n18. The last thing we need to do before we can test the results\
  \ is create the French translations for our new salary prompts. Following the steps\
  \ in the recipe Localizing labels, titles, panels, and links make sure the following\
  \ French translations appear in the language editor:\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_301_1.png)\n\
  \n19. Click on Save Resource File (at the very bottom).\n\n20. Go to the Employee\
  \ module.\n\n21. Use the Language Selector control to switch between languages.\
  \ The drop-down list should now change as the locale changes with both the prompt\
  \ and the list of values changing from English to French:\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_302_0.png)\n\
  \n## See also\n\nSee the recipe *Localizing a drop-down list with a stored procedure*\
  \ to localize a drop-down list that is built from a stored procedure instead of\
  \ a DNN list.\n\n## Localizing a stored procedure\n\nIn this chapter, we have seen\
  \ several ways to localize the different kinds of module content. Although you can\
  \ localize much in the module code, you may need to consider localizing in the backend\
  \ stored procedures.\n\nIn this recipe we will see a simple example of passing the\
  \ current locale to a stored procedure and using that information to change the\
  \ results returned by the procedure.\n\n## Getting ready\n\nTo follow along with\
  \ this recipe you must have completed the following recipes:\n\n- *Creating stored\
  \ procedures*\n- *Localizing a DataGrid control*\n\nIn this example, we will demonstrate\
  \ localization by applying a fixed exchange rate to the Salary values pulled from\
  \ the database based on the locale. (Canadian dollars = `Salary * 1.02642`). This\
  \ is not the most elegant way to perform currency conversion but it will suffice\
  \ for this example.\n\n## How to do it...\n\n1. Launch the Development Tool and\
  \ load the **Employee** project.\n2. Next, open the `01.00.00.SqlDataProvider` file.\n\
  3. Scroll down until you find the `ACME_GetEmployeesByFilter` procedure.\n\n4. We'll\
  \ start by changing the procedure to add the desired locale as a parameter:\n\n\
  ```\n```sql\nCREATE procedure {databaseOwner}{objectQualifier}ACME_GetEmployeesByFilter\n\
  \    @ModuleID int,\n    @MgrFilter int,\n    @SalaryFilter int,\n    @CurrentLocale\
  \ nvarchar(30),\n    @PageIndex int,\n    @PageSize int\nAS\n```\n```\n\n5. Next,\
  \ we will change the SQL query to apply a fixed exchange rate to the employee salaries\
  \ when the locale is French Canadian:\n\n```\n```sql\n/** join the filtered Ids\
  \ to the employee table to get our fields\n**/\n\nselect {objectQualifier}ACME_Employee.ModuleId,\n\
  \       {objectQualifier}ACME_Employee.ItemId,\n       EmpFirstName,\n       EmpLastName,\n\
  \       ManagerNo,\n       HireDate,\n       CASE @CurrentLocale WHEN 'fr-CA' THEN\
  \ Salary * 1.02642 ELSE\n                            Salary END As Salary,\n   \
  \    {objectQualifier}ACME_Employee.CreatedByUser,\n       {objectQualifier}ACME_Employee.CreatedDate,\n\
  \       'CreatedByUserName' = {objectQualifier}Users.FirstName + '\n           \
  \  ' + {objectQualifier}Users.LastName\nFROM {objectQualifier}ACME_Employee\nINNER\
  \ JOIN {objectQualifier}Users on {objectQualifier}ACME_Employee.CreatedByUser =\n\
  \     objectQualifier}Users.UserId\n     INNER JOIN #PageIndex PageIndex\n     \
  \     ON {objectQualifier}ACME_Employee.ItemId = PageIndex.ItemId\n     WHERE (PageIndex.IndexID\
  \ > @PageLowerBound) OR\n           @PageLowerBound is null )\n       AND ( (PageIndex.IndexID\
  \ < @PageUpperBound) OR\n             @PageUpperBound is null )\n     ORDER BY\n\
  \          PageIndex.IndexID\n\nGO\n```\n```\n\n## Working with Foreign Languages\n\
  \n6. Next, open the `DataProvider.vb` file and replace the `GetEmployeesByFilter`\
  \ abstract method with this new version that has the `CurrentLocale` as a parameter:\n\
  \n```\nPublic MustOverride Function GetEmployeesByFilter(ByVal ModuleId As Integer,\
  \ ByVal MgrFilter As Integer, ByVal SalaryFilter As Integer, ByVal CurrentLocale\
  \ As String, ByVal PageIndex As Integer, ByVal PageSize As Integer) As IDataReader\n\
  ```\n\n7. Repeat the process in the `SqlDataProvider.vb` file. Replace the entire\
  \ `GetEmployeesByFilter` function with this new version:\n\n```\nPublic Overrides\
  \ Function GetEmployeesByFilter(ByVal ModuleId As Integer, ByVal MgrFilter As Integer,\
  \ ByVal SalaryFilter As Integer, ByVal CurrentLocale As String, ByVal PageIndex\
  \ As Integer, ByVal PageSize As Integer) As IDataReader\n    Return CType(SqlHelper.ExecuteReader(ConnectionString,\
  \ GetFullyQualifiedName(\"GetEmployeesByFilter\"), ModuleId, MgrFilter, SalaryFilter,\
  \ CurrentLocale, PageIndex, PageSize), IDataReader)\nEnd Function\n```\n\n8. Next,\
  \ open the `EmployeeController.vb` file and replace the first part of the `GetEmployeesByFilter`\
  \ function with this new code:\n\n```\nPublic Function GetEmployeesByFilter(ByVal\
  \ ModuleId As Integer, ByVal MgrFilter As Integer, ByVal SalaryFilter As Integer,\
  \ ByVal CurrentLocale As String, ByVal PageIndex As Integer, ByVal PageSize As Integer,\
  \ ByRef TotalRecords As Integer) As ArrayList\n    Dim dr As IDataReader = DataProvider.Instance.GetEmployeesByFilter(ModuleId,\
  \ MgrFilter, SalaryFilter, CurrentLocale, PageIndex, PageSize)\n    Dim retValue\
  \ As ArrayList = Nothing\n    Try\n        While dr.Read\n            TotalRecords\
  \ = Convert.ToInt32(dr(\"TotalRecords\"))\n        End While\n        dr.NextResult()\n\
  \        retValue = CBO.FillCollection(dr, GetType(EmployeeInfo))\n    Finally\n\
  \        If Not dr Is Nothing Then\n            dr.Close()\n        End If\n   \
  \ End Try\n    Return retValue\nEnd Function\n```\n\n9. Lastly, open the `ViewEmployee.ascx.vb`\
  \ file.\n\n\n\n\n\n+   10. 向下滚动到 BindData 过程，并修改对 GetEmployeesByFilter 的调用以包含当前区域设置：\n\
  \n```\n' use the filter procedure to retrieve the records\ncolEmployees =\n    objEmployees.GetEmployeesByFilter(ModuleId,\n\
  \    ddlManagerNo.SelectedItem.Value,\n    ddlSalaryRange.SelectedItem.Value,\n\
  Type(Page, DotNetNuke.Framework.CDefault).PageCulture.Name,\n    CurrentPage, PageSize,\
  \ TotalRecords)\n\nIf colEmployees.Count > 0 Then\n```\n\n+   11. 从“文件”菜单中选择“全部保存”。\n\
  \n+   12. 要检查结果，请部署更新的存储过程代码，然后生成并将模块部署到 DNN 站点。\n\n+   13. 当使用语言选择器更改当前区域设置时，网格控件将查询数据库，薪资值将使用新的汇率计算从美元\
  \ (USD) 更改为加拿大元 (CAN)：\n\n| 名 | 姓 | 经理 # | 雇用日期 | 薪资 |\n| Henry1 | Smith1 | 0 |\
  \ 10/10/2001 | 70000 |\n| Thomas | Brown | 0 | 9/9/2000 | 60000 |\n| Katie | Smith\
  \ | 11 | 8/8/2001 | 35000 |\n| James | Watson | 0 | 7/7/1992 | 95000 |\n| Debby\
  \ | Smith | 4 | 6/6/1996 | 45000 |\n| Prénom | Nom de famille | Gestionnaire # |\
  \ Date d'embauche | Salaire |\n| Henry1 | Smith1 | 0 | 2001-10-10 | 71849,4 |\n\
  | Thomas | Brown | 0 | 2000-09-09 | 61585,2 |\n| Katie | Smith | 11 | 2001-08-08\
  \ | 35924,7 |\n| James | Watson | 0 | 1992-07-07 | 97509,9 |\n| Debby | Smith |\
  \ 4 | 1996-06-06 | 46188,9 |\n\n## 工作原理...\n\n这只是一个简单的示例，展示了模块如何生成本地化输出。为简化起见，我们对汇率进行了硬编码，但真正本地化的存储过程会查找正确的每日汇率，并在公式中使用该汇率。\n\
  \n## 本地化 DataGrid 控件\n\nDataGrid 控件是模块显示内容的常见方式。DNN 提供了一些对 DataGrid 本地化的支持，在本配方中，我们将了解它的工作原理以及如何提供\
  \ DataGrid 所需的翻译字符串。\n\n## 准备工作\n\n要继续操作，您必须已完成以下配方：\n\n-   向 DataGrid 添加分页控件\n\
  -   本地化标签、标题、面板和链接\n\n## 操作步骤\n\n+   1. 启动开发工具并加载 Employee 项目。\n+   2. 打开 ViewEmployee.ascx.vb\
  \ 文件。\n+   3. 向下滚动到 Page_Load 过程。\n+   4. 在该过程中，找到对绑定例程的调用，并添加以下代码以触发 DataGrid 控件的本地化：\n\
  \n```\nIf Not Page.IsPostBack Then\n\n    If Not Request.QueryString(\"PageRecords\"\
  ) Is Nothing Then\n    ddlRecordsPerPage.SelectedValue =\n                    Request.QueryString(\"\
  PageRecords\")\n\n    End If\n\n    BindManagerDropDown()\n    BindSalaryDropDown()\n\
  \n    ' have grid get column titles from resource file\n    Localization.LocalizeDataGrid(grdResults,\
  \ LocalResourceFile)\n\n    BindData()\n\nEnd If\n```\n\n+   5. 接下来，我们需要将标题的英文文本添加到本地资源文件中。打开\
  \ ViewEmployee.ascx.resx 文件。\n\n6. 添加以下条目：\n\n-   First.Header: First\n-   Last.Header:\
  \ Last\n-   Hire Date.Header: Hire Date\n-   Manager #.Header: Manager #\n-   Salary.Header:\
  \ Salary\n\n7. 该文件现在应如下所示：\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_307_0.png)\n\
  \n8. 生成并将模块部署到 DNN 站点。\n\n9. 在测试结果之前，我们需要做的最后一件事是为新的网格标题创建法语翻译。按照“本地化标签、标题、面板和链接”配方中的步骤，确保以下法语翻译出现在\
  \ ViewEmploye.ascx 的语言编辑器中：\n\n-   First.Header: Prénom\n-   Hire Date.Header: Date\
  \ d'embauche\n-   Last.Header: Nom de famille\n-   Manager #.Header: Gestionnaire\
  \ #\n-   Salary.Header: Salaire\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_307_1.png)\n\
  \n10. 单击“保存资源文件”（位于最底部）。\n\n11. 转到 Employee 模块。\n\n12. 使用语言选择器控件在语言之间切换。列标题将显示正确翻译的值。注意分页控件也已被本地化：\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_308_0.png)\n\n## 工作原理...\n\n对 DataGrid\
  \ 标题进行本地化需要使用 DotNetNuke.Services.Localization 命名空间中的 LocalizeDataGrid API 调用。它要求我们在本地资源文件中提供字符串翻译。\n\
  \n## 另请参阅\n\nLocalizeDataGrid 例程将本地化 DataGrid 标题，但要使查询结果发生变化，需要将当前区域设置传递给从数据库提取结果的后端存储过程。要了解如何实现这一点，请参阅上一个配方“本地化存储过程”。\n"
