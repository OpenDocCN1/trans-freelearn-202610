  </dnn:label>

  </td>

  ```


  新术语和重要词语以粗体显示。在屏幕上（例如菜单或对话框）看到的文字在文本中以下列方式出现：“如果您喜欢它的外观，请单击“应用”以将容器应用到您的站点。”


