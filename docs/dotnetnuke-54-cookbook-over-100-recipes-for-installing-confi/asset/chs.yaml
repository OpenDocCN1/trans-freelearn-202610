- "# 创建自定义模块操作\n\n在许多教程中，我们使用了出现在模块标题旁边的模块操作菜单，用于选择其他模块功能。继承自 `PortalModuleBase` 类的模块会在菜单中收到几个默认操作（如导入/导出内容）。在本教程中，我们将展示如何使用\
  \ `iActionable` 接口在模块菜单中添加您自己的操作。\n\n定义我们自己的模块操作有三个基本任务：\n\n- 定义自定义操作菜单项\n- 创建子程序来处理\
  \ `Click` 事件\n- 将 `Click` 事件处理程序连接到菜单项\n\n## 准备工作\n\n要继续本教程，您必须已完成来自 *第5章，构建、调试和部署模块*\
  \ 中的以下教程：\n\n- *将模块部署为独立包*\n\n在本教程中，我们将通过创建一个简单的 HTML 统计表来演示操作菜单处理，该统计表位于查看员工表单上，在单击\
  \ **显示统计信息** 操作菜单项之前是隐藏的。\n\n## 如何操作...\n\n1. 首先启动开发工具并加载 Employee 项目。\n2. 双击打开\
  \ `ViewEmployee.ascx` 文件。向下滚动到文件底部，并添加这个新的隐藏 HTML 表格：\n\n```html\n<table id=\"tblStats\"\
  \ cellspacing=\"2\" cellpadding=\"2\" border=\"0\"\n       runat=\"server\" style=\"\
  width: 100%\" visible=\"false\">\n  <tr>\n    <td width=\"25%\" class=\"SubHead\"\
  >\n      Total Company Sales:\n    </td>\n    <td width=\"75%\">\n      $1,234,567.00\n\
  \    </td>\n  </tr>\n  <tr>\n    <td width=\"25%\" class=\"SubHead\">\n      Total\
  \ Company Expenses:\n    </td>\n    <td width=\"75%\">\n      $234,567.00\n    </td>\n\
  \  </tr>\n</table>\n```\n\n3. 接下来，双击打开 `ViewEmployee.ascx.vb` 文件。\n4. 在文件顶部添加必要的导入指令：\n\
  \n```vb\nImports DotNetNuke.Entities.Modules.Actions\n```\n\n5. 向下滚动到 **可选接口** 区域，并查找\
  \ `ModuleActions` 属性。\n\n```\nPublic ReadOnly Property ModuleActions() As Entities.Modules.\n\
  Actions.ModuleActionCollection Implements Entities.Modules.\nIActionable.ModuleActions\n\
  \    Get\n        Dim Actions As New Entities.Modules.Actions.\n        ModuleActionCollection\n\
  \        Actions.Add(GetNextActionID, Localization.GetString(Entities.\n       \
  \ Modules.Actions.ModuleActionType.AddContent, LocalResourceFile),\n        Entities.Modules.Actions.ModuleActionType.AddContent,\
  \ \"\", \"\",\n        EditUrl(), False, Security.SecurityAccessLevel.Edit, True,\n\
  \        False)\n    End Get\n```\n\n```\nReturn Actions\n    End Get\nEnd Property\n\
  ```\n\n6. 如果您查看 Starter Kit 最初创建的代码，会发现已经定义了一个操作。这就是我们用来添加新员工记录的“添加内容”操作。\n\n7.\
  \ 既然我们看到了操作的形式，让我们创建第二个操作，使新的 HTML 表格可见：\n\n```\nPublic ReadOnly Property ModuleActions()\
  \ As\n    Entities.Modules.Actions.ModuleActionCollection Implements\n    Entities.Modules.IActionable.ModuleActions\n\
  \    Get\nDim Actions As New\n    Entities.Modules.Actions.ModuleActionCollection\n\
  Actions.Add(GetNextActionID,\n    Localization.GetString(Entities.Modules.Actions.\n\
  \    ModuleActionType.AddContent, LocalResourceFile),\n    Entities.Modules.Actions.ModuleActionType.AddContent,\
  \ \"\", \"\",\n    EditUrl(), False, Security.SecurityAccessLevel.Edit, True,\n\
  \    False)\n\nActions.Add(GetNextActionID, \"Show Statistics\",\n    Entities.Modules.Actions.ModuleActionType.AddContent,\n\
  \    \"ShowStats\", \"view.gif\", \"\", False,\n    Security.SecurityAccessLevel.View,\
  \ True, False)\n\nReturn Actions\n    End Get\nEnd Property\n```\n\n8. 这将在模块操作菜单中创建一个名为“显示统计信息”的新项。下一步是创建一个子程序，在选中菜单项时执行操作。向下滚动到“可选接口”区域的底部。\n\
  \n9. 添加以下子程序：\n\n```\nPrivate Sub ModuleAction_Click(ByVal sender As Object,\n \
  \   ByVal e As ActionEventArgs)\n    Select Case e.Action.CommandArgument\n    Case\
  \ \"ShowStats\"\n        tblStats.Visible = True\n    End Select\nEnd Sub\n```\n\
  \n10. 该例程将在选中操作时使 HTML 可见。最后一步是将操作菜单项连接到这个点击处理程序。滚动到 Page_Load 例程，并在检查回发之前添加以下代码：\n\
  \n```\nPrivate Sub Page_Load(ByVal sender As System.Object,\n    ByVal e As System.EventArgs)\
  \ Handles MyBase.Load\n    Try\n\n    'Add an Action Event Handler to the Skin\n\
  \    AddActionHandler(AddressOf ModuleAction_Click)\n\n    If Not Page.IsPostBack\
  \ Then\n```\n\n11. 从“文件”菜单中选择“全部保存”以保存更改。\n\n12. 重新生成并重新部署模块。\n\n13. 转到包含 Employee\
  \ 模块的页面。当您第一次看到该页面时，统计表应该是不可见的。\n\n14. 查看模块操作菜单下方。您应该看到新的菜单选项“显示统计信息”。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_351_0.png)\n\
  \n15. 从菜单中选择“显示统计信息”，统计表应显示在页面底部。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_351_1.png)\n\
  \n## 工作原理...\n\n调用 Actions.Add() 定义新操作时，传入了九个关键参数。在下表中，您可以看到这些参数以及它们在此示例中的使用方式：\n\
  \n| 参数 | 原始模板操作 | 新操作 |\n|---|---|---|\n| 标题 | 从资源文件提取 | 硬编码“显示统计信息” |\n| 命令名/操作\
  \ | AddContent | AddContent |\n| 可选参数 | 无 | \"ShowStats\" |\n| 显示图标 | 无 | \"view.gif\"\
  \ |\n| 可选 URL | EditUrl() | 无 |\n| 操作事件（T/F） | False | False |\n| 所需安全级别 | Edit\
  \ | View |\n| 可见（T/F） | True | True |\n| 新窗口（T/F） | False | False |\n\n## 更多内容...\n\
  \n在本示例中，我们对菜单项文本“显示统计信息”和统计数据进行了硬编码。这样做是为了使示例更易于阅读。在实际模块中，您应该通过使用资源文件来避免硬编码文本（例如\
  \ Localization.GetString(\"StatisticsPrompt\", LocalResourceFile)）。\n"
- "# 在清单中使用 HTML\n\n虽然清单文件主要用于告诉 DNN 在何处安装模块的各个部分，但清单确实包含发布说明和用户许可等文本。对于这些文档，可以使用\
  \ HTML 来格式化信息，而不是使用纯文本。\n\n在本教程中，我们将通过使用 HTML 格式来增强清单文件。\n\n## 准备工作\n\n要继续本教程，您必须已完成来自\
  \ *第5章，构建、调试和部署模块* 中的以下教程：\n\n- 编辑清单文件\n\n\n\n\n\n## 如何操作...\n\n- 1. 首先启动开发工具并加载\
  \ Employee 项目。\n- 2. 双击打开 Employee.dnn 文件。\n- 3. 向下滚动直到看到标记为 <license> 的部分。\n  \
  \ `<license src=\"license.txt\" />.`\n- 4. 将对 license.txt 的引用替换为字符数据标签（CDATA）以及代表你格式化的许可文本的\
  \ HTML：\n```\n<license>\n<![CDATA[\n<h1>SAMPLE END USER LICENSE AGREEMENT (EULA)</h1>\n\
  This End-User License Agreement (\"EULA\") is a legal agreement made and entered\
  \ into by you (\"LICENSEE\"), the person, business or other entity which will be\
  \ bound by and subject to the terms and conditions set forth in this EULA, and ACME\
  \ Incorporated (\"ACME\"), the author of SOFTWARE (as defined below). By installing\
  \ and using the SOFTWARE, LICENSEE agrees to be bound by all of the terms and conditions\
  \ of this EULA. If LICENSEE does not agree to the terms of this EULA, LICENSEE may\
  \ not install or use the SOFTWARE.\n<p>\n<h3>INTRODUCTION</h3>\n<h3>DEFINITIONS</h3>\n\
  <h3>MORE STUFF LIKE THIS...</h3>\n]]>\n</license>\n```\n- 5. 同样的技巧也适用于发行说明部分。尝试以下用于发行说明的代码：\n\
  ```\n<releaseNotes>\n<![CDATA[\n<h1>RELEASE NOTES</h1>\nThese are some sample release\
  \ notes demonstrating HTML formatting.\n<h3>Version 01.00.00</h3>\n<table border=\"\
  1\">\n<tr>\n<th>Change ID</th>\n<th>Date</th>\n<th>Description</th>\n</tr>\n<tr>\n\
  <th>Change ID</th>\n<th>Date</th>\n<th>Description</th>\n</tr>\n<tr>\n<td>12345</td>\n\
  ```\n```\n<td>10/01/2010</td>\n<td>Fixed bug in manifest file.</td>\n</tr>\n</table>\n\
  ]]>\n</releaseNotes>\n```\n\n6. 最后，你可以使用相同的技术在 Owner 部分提供更好的公司 URL 和电子邮件链接。通常当在包信息中显示所有者时，URL\
  \ 和电子邮件显示为固定文本：\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_354_0.png)\n\n7. 你可以使用以下代码将公司\
  \ URL 变成真正的超链接，并将电子邮件地址变成 mailto: 链接：\n\n```\n<owner>\n  <name>John Smith</name>\n\
  \  <organization>ACME Corporation</organization>\n  <url><![CDATA[<a href=\"http://www.mycompany.xyz/\"\
  >http://www.mycompany.xyz/</a>]]></url>\n  <email><![CDATA[<a href=\"mailto:support@mycompany.xyz\"\
  >support@mycompany.xyz</a>]]></email>\n</owner>\n```\n\n8. 要检查结果，以 SuperUser 身份登录并使用安装扩展向导部署模块。\n\
  \n9. 当向导显示包信息页面时，新链接将出现：\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_354_1.png)\n\
  \n## 部署新的模块版本\n\n在之前的食谱中，我们已经看到了如何创建和部署 DNN 模块。但当你有一个想要部署的新版本时会发生什么？你如何重新部署模块使其升级之前的版本而不是替换它？\n\
  \n在本食谱中，我们将看到如何为模块分配版本号并更新清单文件以创建无缝的模块升级。\n\n规划模块升级时需要考虑三件事：\n\n- - 你需要对数据库进行哪些更改？\n\
  - - 程序集（DLL 文件）是否已更改？\n- - 你是否添加了任何新文件（图像、表单等）？\n\n### 准备工作\n\n要跟随本食谱，你必须已完成 *第\
  \ 5 章，构建、调试和部署模块* 中的以下食谱：\n\n- - *作为独立包部署模块*\n\n在本食谱中，我们将通过向 employee 表添加三个新字段来增强示例\
  \ Employee 项目：`DepartmentID`、`EmployeeURL` 和 `SecurityLevel`。这意味着添加新的表列、更新存储过程并重写清单文件。\n\
  \n### 如何操作...\n\n- 1. 我们将首先创建一个新的 `SqlDataProvider` 脚本，该脚本将在数据库中创建新的字段。启动开发工具并加载\
  \ Employee 项目。\n- 2. 在解决方案资源管理器中，右键单击 Employee 项目。\n- 3. 从 **Add** 弹出菜单中选择 **New\
  \ Item...**。\n- 4. 选择 **Text File** 作为模板并将其命名为 `01.01.00.SqlDataProvider`。\n- 5.\
  \ 单击 **Add** 创建文件。\n- 6. 要在 Employee 表中创建三个新字段，将以下代码添加到文件顶部：\n\n```\n```sql\n/**\
  \ Alter Table **/\n\nif not exists (select * FROM syscolumns WHERE (name =\n   \
  \ 'DepartmentID') AND (id = OBJECT_ID(N'{databaseOwner}\n    [{objectQualifier}ACME_Employee]')))\n\
  ```\n```\n```\nBEGIN\n\nALTER TABLE {databaseOwner}][{objectQualifier}ACME_Employee]\n\
  ADD DepartmentID VARCHAR (30) ;\n\nALTER TABLE {databaseOwner}][{objectQualifier}ACME_Employee]\n\
  ADD EmployeeURL VARCHAR (120);\n\nALTER TABLE {databaseOwner}][{objectQualifier}ACME_Employee]\n\
  ADD SecurityLevel VARCHAR (30);\n\nEND\n\nGO\n```\n\n7. 接下来，我们将添加代码以从版本一中删除现有的 GetEmployeesByFilter\
  \ 过程并用改进的版本替换它：\n\n```\n/** Drop Existing Stored Procedures **/\n\nif exists (select\
  \ * from dbo.sysobjects where id =\n    object_id(N'{databaseOwner}][{objectQualifier}\n\
  \    ACME_GetEmployeesByFilter]') and OBJECTPROPERTY(id,\n        N'IsProcedure')\
  \ = 1)\n    drop procedure {databaseOwner}{objectQualifier}ACME_\nGetEmployeesByFilter\n\
  GO\n```\n\n```\n/** Recreate stored procedure with new columns **/\n\nCREATE procedure\
  \ {databaseOwner}{objectQualifier}ACME_\nGetEmployeesByFilter\n@ModuleID int,\n\
  @MgrFilter int,\n@SalaryFilter  int,\n@PageIndex int,\n@PageSize int\nAS\n```\n\n\
  ```\n/** If we pass -1 for a numeric filter it means ignore the filter **/\n\nDECLARE\
  \ @PageLowerBound int\n```\n```\nDECLARE @PageUpperBound int\n\n/** Calculate the\
  \ upper and lower bounds based on the PageIndex and PageSize **/\n\nSET @PageLowerBound\
  \ = @PageSize * @PageIndex\nSET @PageUpperBound = @PageLowerBound + @PageSize +\
  \ 1\n\n/** create a temp table to hold the Ids of our results **/\n\nCREATE TABLE\
  \ #PageIndex\n(\n    IndexID    int IDENTITY (1, 1) NOT NULL,\n    ItemId     int\n\
  )\n\n/** populate the temp temp with the filtered results **/\n\nINSERT INTO #PageIndex\
  \ (ItemId)\nSELECT ItemId\nFROM {objectQualifier}ACME_Employee\nWHERE (ModuleId\
  \ = @ModuleId) AND  (ManagerNo = @MgrFilter OR @MgrFilter = -1) AND (Salary >= @SalaryFilter)\n\
  ORDER BY ItemId DESC\n\n/** remember the count of the results **/\n\nSELECT COUNT(*)\
  \ as TotalRecords\nFROM #PageIndex\n\n/** join the filtered Ids to the employee\
  \ table to get our fields **/\n\nselect {objectQualifier}ACME_Employee.ModuleId,\n\
  \       {objectQualifier}ACME_Employee.ItemId,\n       EmpFirstName,\n       EmpLastName,\n\
  \       ManagerNo,\n       HireDate,\n       Salary,\n       DepartmentID,\n```\n\
  ```\nEmployeeURL,\nSecurityLevel,\n{objectQualifier}ACME_Employee.CreatedByUser,\n\
  {objectQualifier}ACME_Employee.CreatedDate,\n'CreatedByUserName' = {objectQualifier}Users.FirstName\
  \ + ' ' + {objectQualifier}Users.LastName\nFROM {objectQualifier}ACME_Employee\n\
  INNER JOIN {objectQualifier}Users on\n    {objectQualifier}ACME_Employee.CreatedByUser\
  \ =\n    {objectQualifier}Users.UserId\nINNER JOIN #PageIndex PageIndex\nON {objectQualifier}ACME_Employee.ItemId\
  \ = PageIndex.ItemId\nWHERE ( (PageIndex.IndexID > @PageLowerBound) OR\n       \
  \ @PageLowerBound is null )\n    AND ( (PageIndex.IndexID < @PageUpperBound) OR\n\
  \        @PageUpperBound is null )\nORDER BY\n    PageIndex.IndexID\nGO\n```\n\n\
  - 8. 接下来我们需要更新清单文件以包含新的 01.01.00. SqlDataProvider 文件。双击打开 Employee.dnn 文件。\n\n-\
  \ 9. 在文件顶部，将版本号更新为 01.01.00：\n\n```\n<packages>\n  <package name=\"ACME.Employee\"\
  \ type=\"Module\"\n          version=\"01.01.00\">\n    <friendlyName>ACME Employees</friendlyName>\n\
  ```\n\n- 10. 向下滚动直到看到 <scripts> 部分并添加以下代码：\n\n```\n<scripts>\n  <basePath>DesktopModules\\\
  ACME.Employee</basePath>\n  <script type=\"Install\">\n    <name>01.00.00.SqlDataProvider</name>\n\
  \    <version>01.00.00</version>\n  </script>\n  <script type=\"Install\">\n   \
  \ <name>01.01.00.SqlDataProvider</name>\n    <version>01.01.00</version>\n  </script>\n\
  \  <script type=\"UnInstall\">\n    <name>Uninstall.SqlDataProvider</name>\n   \
  \ <version>01.00.00</version>\n  </script>\n</scripts>\n```\n\n\n\n11. 对清单的最后一次更改是更新程序集上的版本号：\n\
  \n```\n<assemblies>\n    <assembly>\n        <path>bin</path>\n        <name>Employee.dll</name>\n\
  \        <version>01.01.00</version>\n    </assembly>\n</assemblies>\n```\n\n12.\
  \ 从文件菜单中选择保存全部以保存您的更改。\n\n13. 重新构建项目并根据第 5 章《构建、调试和部署模块》中菜谱《将模块作为独立包部署》中说明创建安装 ZIP\
  \ 文件。包含 01.00.00 和 01.01.00 SqlDataProvider 文件。\n\n14. 将新的 ZIP 文件命名为 Employee_01.01.00_Install.zip。\n\
  \n15. Employee_01.01.00_Install.zip 文件现在应包含以下内容：\n\n| Name | Type | Packe... | Has\
  \ ... | Size |\n|---|---|---|---|---|\n| App_LocalResources | File Folder | 0 KB\
  \ |  | 0 KB |\n| Bin | File Folder | 0 KB |  | 0 KB |\n| EditEmployee.ascx | ASP.NET\
  \ User Control | 1 KB | No | 4 KB |\n| Settings.ascx | ASP.NET User Control | 1\
  \ KB | No | 1 KB |\n| ViewEmployee.ascx | ASP.NET User Control | 2 KB | No | 5 KB\
  \ |\n| Employee.dnn | DNN File | 2 KB | No | 6 KB |\n| 01.00.00.SqlDataProvider\
  \ | SQLDATAPROVIDER File | 2 KB | No | 8 KB |\n| 01.01.00.SqlDataProvider | SQLDATAPROVIDER\
  \ File | 1 KB | No | 3 KB |\n| Employee.SqlDataProvider | SQLDATAPROVIDER File |\
  \ 1 KB | No | 3 KB |\n| Uninstall.SqlDataProvider | SQLDATAPROVIDER File | 1 KB\
  \ | No | 2 KB |\n\n16. 要检查结果，请以 SuperUser 身份登录并使用安装扩展向导部署新的 ZIP 文件。模块应无错误地覆盖现有模块。\n\
  \n17. 您可以使用开发工具中的数据库资源管理器确认升级已添加新列：\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_361_0.png)\n\
  \n18. 数据库资源管理器还将显示更新后的存储过程。\n\n## How it works...\n\n在模块升级中，您需要进行的更改非常重要。务必记住，您必须在不影响之前模块版本的情况下执行升级。例如，为了向\
  \ Employee 表添加列，我们使用了 ALTER TABLE 命令而不是 DROP TABLE 命令。这保留了表中可能已有的任何记录。\n\n这种增量更新很棘手，在发布更新之前应进行充分测试。它们还需要对\
  \ SQL 有扎实的理解。\n\n## There's more...\n\n在此示例中，我们没有创建任何新对象，因此原始卸载文件仍然适用。如果我们例如创建了一个新表，那么我们必须使用新版本号更新卸载文件。由于我们从不进行增量卸载，因此我们只需要一个卸载文件即可。\n\
  \n## Using multiple database connections\n\n有些情况下，您需要访问的数据库不是运行 DNN 安装的数据库。也许您需要针对旧数据库运行查询或从不同公司的数据库中提取信息。\n\
  \n在本菜谱中，我们将看到如何创建第二个数据库连接并使用它从菜谱 *Populating a drop-down list from a stored procedure*\
  \ 中填充 **Manager** 下拉列表。\n\n在本菜谱中，我们将使用随 MS Access 提供的示例 Northwind 数据库。\n\n## Getting\
  \ ready\n\n要跟随本菜谱，您必须已完成 *Chapter 6, Data Entry Tricks* 中的以下菜谱：\n\n- *Populating\
  \ a drop-down list from a stored procedure*\n\n## How to do it...\n\n- 1. 通过访问 http://www.microsoft.com/downloads\
  \ 并搜索 **Northwind Traders Sample Database.** 从 Microsoft 网站下载示例 Northwind 数据库。\n\
  - 2. 选择 **Access 2000 Tutorial: Northwind Traders Sample Database** 并单击 **Download**\
  \ 按钮开始下载。\n- 3. 在提示时，选择运行并同意安装和许可协议。\n- 4. 将文件放在 DNN 服务器的 C 盘上 (c:\\Nwind.mdb)。\n\
  - 5. 在 DNN 服务器上查找并定位 DNN 安装的根文件夹。\n- 6. 找到 web.config 文件并在文本编辑器中打开它。\n- 7. 向下滚动文件直到看到\
  \ <connectionStrings> 并添加以下键：\n  ```\n  <add name=\"LegacyAccess\"\n      connectionString=\"\
  Provider=Microsoft.Jet.OLEDB.4.0;Data Source=C:\\Nwind.mdb; User Id=admin;Password=\"\
  \ />\n  ```\n- 8. 接下来，双击打开 ViewEmployee.ascx.vb 文件。\n- 9. 由于本菜谱中我们访问的是旧的 MS Access\
  \ 数据库，因此我们需要使用 OLE DB 提供程序。因此首先在文件顶部添加必要的导入指令：\n  ```\n  Imports System.Data.OleDb\n\
  \  ```\n- 10. 接下来我们将创建一个新的例程，使用我们在 web.config 文件中保存的连接字符串连接到 MS Access 数据库文件。滚动到\
  \ Public Methods 区域底部并添加以下代码：\n  ```\n  Public Function GetLegacyManagers() As OleDbDataReader\n\
  \  \n      Dim sqlConn As OleDbConnection\n      Dim sqlCmd As OleDbCommand\n  \
  \    Dim strConnection As String\n  ```\n\n14. 转到包含 Employee 模块的页面。Manager 下拉列表中的名称现在来自对\
  \ MS Access 数据库的第二个数据库连接。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_364_0.png)\n\
  \n## How it works...\n\n在此示例中，我们使用了对 MS Access 2000 数据库的 OLE 连接，但此技术适用于其他数据库类型。以下是不同类型数据库的其他示例连接字符串：\n\
  \n| Database type | Sample connection string |\n| --- | --- |\n| Oracle Database\
  \ using a TNSNames. ora file | <add name=\"LegacyOracle\" connectionString=\"Data\
  \ Source=LEGACY;User Id=legacyuser; Password=legacypassword;\" /> |\n| MS Access\
  \ | <add name=\"LegacyAccess\" connectionString=\"Provider=Microsoft.Jet.OLEDB.4.0;\
  \ Data Source=C:\\northwind.mdb;User Id=legacyuser;Password=legacypassword;\" />\
  \ |\n| SQL Server Express | <add name=\"LegacyExpress\" connectionString=\"Data\
  \ Source=.\\SQLEXPRESS;Initial Catalog=LegacyDatabase;User ID=legacyuser;Password=legacypassword\"\
  \ /> |\n| MySQL | <add name=\"LegacyMySQL\" connectionString=\"Server=localhost;Port=3306;Database=LegacyMySQL;Uid=legacyuser;Pwd=legacypass\
  \ word;\" /> |\n\n## 12\n"
- "## Advanced Modules and Security\n\n- Creating a secondary View control\n- Controlling\
  \ navigation with NavigateURL\n- Module messages and event Logging\n- Creating your\
  \ own CBO Hydrator\n- Using Active Directory with DNN\n- Synchronizing security\
  \ roles with DNN\n- Correcting Active Directory issues\n\n## Introduction\n\n在本章中，我们将介绍一些高级模块开发主题并查看扩展\
  \ DNN 安全性的内容。我们将首先了解如何创建二级视图控件及其导航链接。然后我们将了解如何创建自定义显示消息并使用事件日志进行调试消息。最后我们将了解如何添加\
  \ Active Directory 身份验证并将其与 DNN 同步。\n\n4. 从 **Add** 弹出菜单中选择 **New Item...**。\n\n\
  ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_367_0.png)\n\n- 5. 选择 **Web User Control**\
