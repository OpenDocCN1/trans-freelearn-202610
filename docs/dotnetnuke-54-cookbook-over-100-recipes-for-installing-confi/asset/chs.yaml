  \ HireDate As DateTime,\n                                    ByVal Salary As Double,\n\
  \                                    ByVal UserId As Integer)\n    SqlHelper.ExecuteNonQuery(ConnectionString,\n\
  \                GetFullyQualifiedName(\"UpdateEmployee\"),\n                ModuleId,\
