  \n## 设置断点并逐步执行模块代码\n\n在本菜谱中，我们将了解如何在调试环境中设置断点并逐步执行模块代码。这里的目标是停止操作并花点时间检查模块中的变量，查看它们保存的值。然后我们可以逐行“走查”代码，查看其运行方式。这是\
