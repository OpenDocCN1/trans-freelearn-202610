  \ = txtSalary.Text\n\nobjEmployee.BonusLevel = msbBonus.SelectedState.Key\n\nobjEmployee.CreatedByUser\
  \ = Me.UserId\n\nIf Common.Utilities.Null.IsNull(ItemId) Then\n```\n\n+   10. 最后，我们需要创建一个新的属性来将员工的薪水转换为奖金等级。打开\
  \ `EmployeeInfo.vb` 文件并添加以下代码：\n\n```\n' public properties\n\nPublic Property BonusLevel()\
  \ As Integer\n    Get\n        ' use integer division to get 0,1,2,3...\n      \
  \  Return (_Salary \\\\ 30000)\n    End Get\n    Set(ByVal Value As Integer)\n \
  \       _Salary = Value * 30000\n    End Set\nEnd Property\n```\n\n+   11. 由于我们使用新的多状态复选框添加了一个新的标签控件，请打开\
  \ `ViewEmployee.ascx.resx` 文件（位于 `/App_LocalResources` 下）并设置标签文本和帮助提示：\n\n+   \n\
  +   `lblBonus.Text:` **Bonus Level**\n+   \n+   `lblBonus.Help:` **Click on the\
  \ icon to set the salary bonus level.**\n\n|  |  |\n|---|---|\n| lblBonus.Help |\
  \ Click on the icon to set the salary bonus level. |\n| lblBonus.Text | Bonus Level\
  \ |\n\n+   12. 从 **File** 菜单中选择 **Save All**。\n\n+   13. 要检查结果，请将模块构建并部署到开发门户进行测试（有关说明，请参阅\
  \ *Chapter 5* 中 *Deploying a module as a standalone package* 的配方）。\n\n14. 转到 **ACME\
  \ Employee** 页面并单击员工旁边的编辑图标（小铅笔）以显示 **Edit Employee** 页面。**Bonus Level** 将出现在底部。\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_238_0.png)\n\n15. 单击 **Bonus Level**\
  \ 星形图标将更改奖金等级，这将在您更新员工记录时提高或降低薪水。\n\n## How it works...\n\n在本配方中，我们看到了使用多状态复选框的任务：\n\
  \n+   - 我们将控件放置在 .ascx 文件中并定义了它具有的状态数\n+   - 对于每个状态，我们选择了一张图片\n+   - 在页面加载时我们设置当前状态\n\
  +   - 当记录被更新时我们将状态保存到数据库\n\n## There's more...\n\n在此示例中，我们使用了 DNN 站点中的现有图片，但您也可以自由上传并使用自定义图片。要快速回顾如何将图片上传到门户，请参阅本章前面关于在\
  \ Datagrid 中显示缩略图图片的配方。\n\n## See also\n\n可以设置的其他控件属性：\n\n| Property | Meaning |\n\
  |---|---|\n| ImagePath | The path on the server to the folder containing the images\
  \ for the different checkbox states. |\n| ImageUrl | The name of the image file\
  \ to display for the state. |\n| Text | A text message to display next to the image.\
  \ |\n| ToolTip | A message displayed when you hover over the image. |\n\n## 8\n\n\
  ## Basic Skinning\n\n在本章中我们将涵盖以下主题：\n\n+   - Downloading and installing a skin\n\
  +   - Creating a simple HTML skin\n+   - Creating a simple ASCX skin\n+   - Deploying\
  \ your skins and containers\n+   - Exploring skin objects\n+   - Creating a simple\
  \ HTML container\n+   - Creating a basic ASCX container\n+   - Creating custom container\
  \ images\n+   - Styling a container with images\n+   - Styling a menu with images\n\
  \n## Introduction\n\n在 DNN 中，skinning 指的是自定义 DNN 门户的外观和感觉的过程。DNN 的强大功能之一是门户的功能与演示分离。这意味着我们可以更改门户的外观而不影响门户的工作方式。\n\
  \n要在 DNN 中创建皮肤，我们将使用三种类型的文件：HTML、ASCX 和 CSS。HTML 或 ASCX 文件描述页面的布局，而 CSS 文件提供样式。如果您以前使用过\
  \ HTML 和 CSS，那么您就可以立即开始。然而，如果您熟悉 ASCX（作为 DNN 开发人员很可能如此），您可以通过 HTML 更快地实现相同的结果。在配方中，我们将主要展示\
  \ ASCX skinning，并附带一些简短的 HTML skinning 示例。\n\n## Basic Skinning\n\n### ▸ **Skin\
  \ Objects**\n\n在开始查看配方之前，我们需要快速了解一下 Skin Objects。Skin Objects 在 HTML 和 ASCX 皮肤文件中的用途都是作为不同动态功能占位符。在\
  \ HTML 皮肤中，您在代码中放置诸如 `[CURRENTDATE]` 这样的文本标记，当代码被皮肤引擎解析时，它会插入匹配的皮肤对象。如果您在 ASCX 中工作，您将皮肤对象作为控件注册并直接放置在代码中。\n\
  \nDNN 提供了许多不同的皮肤对象，例如 CurrentDate、Logo、Login link 等，我们将在本章的配方中看到其中的许多。\n\n## Downloading\
  \ and installing a skin\n\n通常开始 skinning 的最简单方法是下载现有的皮肤包并查看用于 skinning 的不同文件。在本配方中，我们将下载\
  \ Jon Henning 从名为 CodePlex 的站点创建的一个优秀皮肤，该皮肤演示了最常见的皮肤对象和布局。\n\n开始使用现有皮肤的另一个原因是它允许增量开发。我们可以从一个完全功能齐全的皮肤开始，将其部署到我们的\
  \ DNN 门户，然后直接在服务器上编辑源文件。这样我们所做的更改会立即显示，问题很容易被发现和修复。然而，由于应用皮肤可能会影响整个站点，因此最好在生产站点上使用之前在开发\
  \ DNN 站点上创建和测试皮肤。\n\n最后，还应注意皮肤实际上只是 DNN 中的另一种扩展类型，因此您已经熟悉其中的一些步骤。\n\n### How to\
  \ do it...\n\n+   1. 打开您喜欢的网络浏览器并访问站点  \n+      `http://codeendeavortemplate.codeplex.com/`。\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_240_0.png)\n\n+   2. 在工具栏中单击 **Downloads**。\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_241_0.png)\n\n+   3. 稍微向下滚动并单击 **CodeEndeavors\
  \ Template Skin** 链接。\n+   4. 在提示许可协议时，单击 **I Agree**。\n+   5. 文件下载对话框会询问您是否要 **Open**\
  \ 或 **Save**。单击 **Save** 并选择一个临时文件夹来保存 ZIP 文件。\n+   6. 这就是我们从 CodePlex 站点所需的所有内容，因此关闭浏览器。\n\
  +   7. 要将皮肤安装到 DNN 站点，首先以 SuperUser 身份登录。\n+   8. 查看 Control Panel 并确保您处于 Edit 模式。\n\
  +   9. 在 **Host** 菜单下选择 **Extensions**。\n+   10. 滚动到底部并单击 **Install Extension Wizard**\
  \ 链接。\n+   11. 助手将提示输入 ZIP 文件（称为扩展包）。\n+   12. 单击 **Browse** 按钮并选择您刚刚下载的文件（例如 CodeEndeavors.TemplateSkin.install.v01.01.07.00.zip）。单击\
  \ **Open** 然后单击 **Next**。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_241_1.png)\n\
  \n+   13. 助手将显示扩展信息。单击 **Next**。\n+   14. 助手将显示发行说明。单击 **Next**。\n\n15. 在许可页面，选中\
  \ **Accept License?** 并单击 **Next.**\n\n16. 现在安装脚本将运行，创建皮肤。最后您应该看到消息“Installation\
  \ successful”。\n\n17. 单击 **Return.**\n\n18. 要使皮肤处于活动状态，请在 **Admin** 菜单下选择 **Skins**。\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_242_0.png)\n\n19. 从 **Skins** 下拉列表中，选择\
  \ **CodeEndeavors.TemplateSkin.**\n\n20. 在本章中，我们将使用 **Index** 皮肤作为示例。单击 **index**\
  \ 皮肤下的 **Apply** 链接使其处于活动状态。\n\n21. 要查看皮肤文件，您可以在 DNN 实例的根文件夹中查看 \\Portals\\_default\\\
  Skins\\CodeEndeavors.TemplateSkin。\n\n22. 以下是您可能在此类皮肤中看到的关键文件的摘要：\n\n| File name\
  \ | Description |\n|---|---|\n| animated.ascx | An ASCX skin file. |\n| container.ascx\
  \ | An ASCX container file. |\n| index.html | An HTML skin file. |\n| skin.css |\
  \ The stylesheet for the skin. |\n| container.css | The stylesheet for the container.\
  \ |\n| TemplateSkin.dnn | The manifest file for the skin package. |\n| thumbnail_animated.jpg\
  \ | A preview image of the ASCX skin. |\n| thumbnail_container.jpg | A preview image\
  \ of the ASCX container. |\n| thumbnail_index.jpg | A preview image of the HTML\
  \ skin. |\n| license.txt | The text of the license agreement. |\n| releasenotes.txt\
  \ | The text of the release notes. |\n| version.txt | The version number. |\n| Images\
  \ folder | A folder holding the graphic images supporting a skin or container. |\n\
  \n\n\n\n\n## 基础皮肤设计\n\n### 如何操作...\n\n- 1. 首先，在测试 DNN 门户中找到默认皮肤文件夹（`\\Portals\\\
  _default\\Skins`）。\n- 2. 然后，创建一个新文件夹用于存放皮肤文件。将这个文件夹命名为 `SampleHTMLSkin`。\n- 3. 启动开发工具。\n\
  - 4. 从 **文件** 菜单中，选择 **新建文件...**。\n- 5. 在 **新建文件** 对话框中，选择 **HTML 页面**，然后点击 **打开**。\n\
  - 6. 这将生成一个基本的 HTML 文件。接下来，我们需要添加一个简单的 HTML 表格来布局页面。要创建示例图中所示的布局，我们的 HTML 表格代码应如下所示：\n\
  \n  ```html\n  <!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Transitional//EN\"\n\
  \      \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\">\n  <html xmlns=\"\
  http://www.w3.org/1999/xhtml\">\n  <head>\n\n  <link id=\"skin_css\" href=\"skin.css\"\
  \ type=\"text/css\"\n        rel=\"stylesheet\" />\n\n      <title>Untitled Page</title>\n\
  \n  </head>\n  <body>\n\n          <table width=\"100%\">\n                  <tr>\n\
  \                          <td width=\"60%\">\n                                \
  \  [MENU]\n                          </td>\n                          <td width=\"\
  40%\">\n                                  [USER]\n\n                           \
  \       &nbsp;&nbsp;&nbsp;&nbsp;\n                                  [LOGIN]\n  \
  \                        </td>\n                  </tr>\n                  <tr>\n\
  \                          <td>\n  <div id=\"ContentPane\" runat=\"server\"></div>\n\
  \  </td>\n  <td>\n      <div id=\"RightPane\" runat=\"server\"></div>\n  </td>\n\
  \  </tr>\n\n  </table>\n\n  </body>\n  </html>\n  ```\n\n- 7. 这里我们创建了一个与布局图对应的两列两行\
  \ HTML 表格。然后我们将皮肤对象和 DIV 放置到表格中。\n- 8. 从 **文件** 菜单中，选择 **将 HTMLPage1.htm 另存为...**。\n\
  - 9. 浏览到 `SampleHTMLSkin` 文件夹，并将文件保存为 `SampleHTMLSkin.htm`。\n- 10. 接下来，我们需要为皮肤创建\
  \ CSS 文件。从 **文件** 菜单中选择 **新建文件...**。\n- 11. 在 **新建文件** 对话框中，选择 **样式表**，然后点击 **打开**。\n\
  - 12. 将文件内容替换为：\n\n  ```css\n  /* General Styles */\n  body                    \
  \     {background: #CCCCCC; height: 100%; margin: 0px; padding: 0px;}\n  a, a:link,\
  \ a:visited, a:active {color: #800000; text-decoration: none; font-family: Verdana,\
  \ Arial, Helvetica, sans-serif; font-weight: normal;}\n  a:hover               \
  \       {color: #C00; text-decoration: none;}\n\n  /* Styles for Controlling the\
  \ Layout */\n  .template_style              {width: 960px; margin: auto;}\n  .content\
  \                     {background: white; border-left: solid 1px #EAEAEA; border-right:\
  \ solid 1px #EAEAEA; padding: 10px; margin: 0 5px 0 5px;}\n  ```\n\n- 13. 从 **文件**\
  \ 菜单中，选择 **将 StyleSheet1.css 另存为...**。\n- 14. 浏览到 `SampleHTMLSkin` 文件夹，并将文件保存为 `skin.css`。\n\
  - 23. 虽然内容不多，但你可以看到 HTML 表格布局已正确地将菜单放在左上角，**登录/注销**链接位于右上角。内容出现在我们放置它的左下角 ContentPane\
  \ 中，空的 RightPane 位于右下角。\n- 24. 要确切了解皮肤安装做了什么，请查看包含皮肤的文件夹。就在你创建的 `SampleHTMLSkin.htm`\
  \ 文件旁边，解析器创建了 `SampleHTMLSkin.ascx` 和一个缩略图 `samplehtmlskin.jpg`（如果你为皮肤包含了一张图片）。\n\
  \n  ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_247_0.png)\n\n- 25. 要了解如何将此皮肤部署到生产门户，请参见\
  \ *部署你的皮肤和容器* 一节。\n\n### 工作原理...\n\n皮肤部署后，皮肤引擎将自动解析皮肤包并生成所需的 `SampleHTMLSkin.ascx`\
  \ 文件。如果你仍在开发皮肤并在服务器上编辑 `SampleHTMLSkin.htm` 文件，则必须点击 **解析皮肤包** 链接，更改才会出现在门户中。\n\n\
  如果你熟悉 HTML 并想开始学习创建 ASCX 皮肤，可以查看解析器生成的 ASCX 皮肤，了解 HTML 是如何转换的。你甚至可以直接编辑 ASCX 文件，查看你的更改对皮肤的影响。\n\
  \n### 更多内容...\n\n在本操作指南中，我们使用了 HTML 表格来定位皮肤对象。虽然这对 HTML 开发者来说可能是一种熟悉的技术，但通过使用 CSS\
  \ 文件，我们可以对对象的定位获得更强大的控制。此外，还可以使用更复杂的令牌（token）并向其传递参数。你可以在第 13 章 *高级皮肤设计* 中看到相关示例。\n\
  \n## 创建简单的 ASCX 皮肤\n\n虽然你可以在 HTML 中开发皮肤并将其解析为 ASCX，但许多开发者更喜欢直接使用 ASCX 工作。这样做的好处是文件中的更改可以立即显示，而无需先进行解析。你选择哪种方法通常取决于你的背景。如果你更熟悉\
  \ ASCX，可能会觉得它比使用 HTML 更容易。但是，如果你确实改用 ASCX，请确保删除原始 HTML 文件，否则你的更改可能会被任何修复原始 HTML\
  \ 文件的人覆盖。\n\n在开发基于 ASCX 的皮肤时，有一些小的差异。当在 ASCX 中使用皮肤对象的控件时，你首先要在文件顶部放置一个控件注册指令，然后在\
  \ ASCX 文件主体中引用它。控件注册后，你可以根据需要多次使用它，只要为每个控件提供唯一的 ID。\n\n下面是我们将创建的页面布局示意图：\n\n| 菜单\
  \ | 用户登录 |\n|---|---|\n| ContentPane | RightPane |\n\n### 如何操作...\n\n- 1. 首先，在测试\
  \ DNN 门户中找到默认皮肤文件夹（`\\Portals\\_default\\Skins`）。\n- 2. 然后，创建一个新文件夹用于存放皮肤文件。将这个文件夹命名为\
  \ `SampleASCXSkin`。\n- 3. 启动开发工具。\n- 4. 从 **文件** 菜单中，选择 **新建文件...**。\n- 5. 在 **新建文件**\
  \ 对话框中，选择 **Web 用户控件**，然后点击 **打开**。\n- 6. 第一步是在文件顶部放置以下指令：\n\n  ```aspx\n  <%@ Control\
  \ language=\"vb\" AutoEventWireup=\"false\" Explicit=\"True\"\n               Inherits=\"\
  DotNetNuke.UI.Skins.Skin\" %>\n  ```\n\n  > 旧版皮肤（5.x 之前）不继承自 DotNetNuke.UI.Skins.Skin，因此，如果要将旧版皮肤转换为\
  \ 5.x，则需要添加这一行。\n\n- 7. 下一步是为我们要使用的每个皮肤对象添加注册指令：\n\n  ```aspx\n  <%@ Register TagPrefix=\"\
  dnn\" TagName=\"NAV\"\n               Src=\"~/Admin/Skins/Nav.ascx\" %>\n  <%@ Register\
  \ TagPrefix=\"dnn\" TagName=\"USER\"\n               Src=\"~/Admin/Skins/User.ascx\"\
  \ %>\n  <%@ Register TagPrefix=\"dnn\" TagName=\"LOGIN\"\n      Src=\"~/Admin/Skins/Login.ascx\"\
  \ %>\n  ```\n\n- 8. 要创建导航菜单，我们将添加一个 DIV 并插入 NAV 控件：\n\n  ```html\n  <div>\n    \
  \  <dnn:NAV runat=\"server\" id=\"dnnNAV\"\n          ProviderName=\"DNNMenuNavigationProvider\"\
  \n          IndicateChildren=\"false\"\n          ControlOrientation=\"Horizontal\"\
  \ />\n  </div>\n  ```\n\n- 9. 然后添加代码来创建用户和登录/注销链接：\n\n  ```html\n  <div id=\"login_style\"\
  \ class=\"user\">\n      <dnn:USER runat=\"server\" id=\"dnnUSER\" CssClass=\"user\"\
  \ />\n      &nbsp;&nbsp;|&nbsp;&nbsp;\n      <dnn:LOGIN runat=\"server\" id=\"dnnLOGIN\"\
  \ CssClass=\"user\" />\n  </div>\n  ```\n\n- 10. 最后，我们使用 HTML 表格创建内容窗格，但将其包裹在 DIV\
  \ 中：\n\n  ```html\n  <div class=\"content\">\n      <table width=\"100%\" border=\"\
  0\" cellspacing=\"0\" cellpadding=\"0\">\n          <tr>\n              <td valign=\"\
  top\" id=\"LeftPane\" class=\"LeftPane\"\n                  runat=\"server\" visible=\"\
  false\">\n              </td>\n              <td valign=\"top\" id=\"ContentPane\"\
  \ class=\"ContentPane\"\n                  runat=\"server\" visible=\"false\">\n\
  \              </td>\n              <td valign=\"top\" id=\"RightPane\" class=\"\
  RightPane\"\n                  runat=\"server\" visible=\"false\">\n           \
  \   </td>\n          </tr>\n      </table>\n  </div>\n  ```\n\n- 11. 现在整个文件应如下所示：\n\
  \n  ```aspx\n  <%@ Control language=\"vb\" AutoEventWireup=\"false\" Explicit=\"\
  True\"\n      Inherits=\"DotNetNuke.UI.Skins.Skin\" %>\n\n  <%@ Register TagPrefix=\"\
  dnn\" TagName=\"NAV\"\n      Src=\"~/Admin/Skins/Nav.ascx\" %>\n  <%@ Register TagPrefix=\"\
  dnn\" TagName=\"USER\"\n      Src=\"~/Admin/Skins/User.ascx\" %>\n  <%@ Register\
  \ TagPrefix=\"dnn\" TagName=\"LOGIN\"\n  ```\n\n\n\n## 基本皮肤设计\n\n```\nSrc=\"~/Admin/Skins/Login.ascx\"\
  \ %>\n\n<div >\n    <dnn:NAV runat=\"server\" id=\"dnnNAV\"\n             ProviderName=\"\
  DNNMenuNavigationProvider\"\n             IndicateChildrens=\"false\"\n        \
