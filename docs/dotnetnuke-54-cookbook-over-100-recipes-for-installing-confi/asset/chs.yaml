  \ TotalRecords As Integer\n    colEmployees = objEmployeeController.GetEmployeesByFilter\n\
  \                     (ModuleId, ParentItemId, -1, 0, 1000,\n                  \
  \    TotalRecords)\n```\n\n```\nIf colEmployees.Count > 0 Then\n    ' add a node\
