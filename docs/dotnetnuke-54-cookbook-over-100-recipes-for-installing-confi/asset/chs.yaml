  \n14. 您的 DNN 数据库现在将出现在**数据库资源管理器**窗口中。在该数据库下，您将看到您的 DNN 安装中的表、视图和存储过程。\n\n## 安装\
  \ DNN 5 Starter Kit\n\n在本食谱中，我们将下载并安装 DNN 5 Starter Kit。Starter Kit 将仅根据模块名称生成一个近乎完整的\
