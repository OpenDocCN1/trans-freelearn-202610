  ## About the Reviewers


  **Jeff Cochran** 是佛罗里达州那不勒斯市的一名高级网络专家。他工作的很大一部分包括网页设计和编码，以及 Web 服务器管理。Jeff 在互联网方面拥有近二十年的经验，曾创办了西南佛罗里达最早的互联网服务提供商之一，并曾使用基于
  Windows 和 Unix 的 Web 服务器工作。现在主要专注于 Windows 技术，Jeff 已近十年担任微软互联网信息服务器的微软 MVP，并在 ASP
  Classic 和 ASP.NET 社区也很活跃。Jeff 共同撰写了 Packt 的 *"Building an ASP.NET Content Management
  System"*，并为其他出版商的几本书籍做过工作。


  **Sebastian Leupold** 在卡尔斯鲁厄大学学习经济学和商业工程后，已在软件应用领域积累了约 20 年的专业经验。他是 Gamma Concept
  的首席执行官，该公司是 dnnWerk 的一部分，dnnWerk 是德国领先的 DotNetNuke 专家联合体，提供围绕 DotNetNuke 的所有服务，包括托管、培训、咨询、皮肤制作和模块开发。


  作为 DotNetNuke 核心团队的成员，Sebastian 为 DotNetNuke 核心框架添加了一些增强功能，主要负责模块发布测试。同时作为用户体验团队的成员，他专注于
  DNN 可用性的改进。过去，他曾担任 UserDefinedTable 模块的项目负责人。Sebastian 创建并维护了数百个 DotNetNuke 框架和模块的德语语言包。


  Sebastian 是德国 DotNetNuke 用户组的联合创始人和联合负责人。他也是 DNN-Europe 的发起人之一，DNN-Europe 是 DotNetNuke
  专业人士的网络，他组织了 2010 年在巴黎举行的首届欧洲 DotNetNuke 日。Sebastian 在欧洲和美国的 OpenForce DotNetNuke
  大会上以及多个用户组会议上发表过多次演讲。微软以“最有价值专业人员”称号表彰了他的活动。


  ## 前言


  DotNetNuke 5.4 是一个强大且灵活的内容管理系统，用于构建网站。它提供了许多用于发布内容的功能，包括创建博客、横幅广告、新闻源等工具。本书中的章节提供了示例，展示如何使用您自己的插件模块下载、安装、配置和定制DotNetNuke。


  ## 本书涵盖内容


  第1章“安装与设置”解释了下载和安装创建自己的DotNetNuke网站所需的工具。


  第2章“管理用户和站点设置”解释了创建用户、分配安全权限以及配置站点。


  第3章“现有模块的实用技巧”讨论了最流行模块的安装和配置。


  第4章“创建自己的模块”解释了安装开发工具并创建您的第一个自定义模块。


  第5章“构建、调试和部署模块”提供了模块开发和调试的深入示例。


  第6章“数据录入技巧”介绍了DotNetNuke常见的数据录入控件。


  第7章“酷炫的Web控件”展示了诸如TreeView、TabStrip和CAPTCHA验证等Web控件的示例。


  第8章“基础皮肤设计”解释了如何通过创建自定义皮肤来为您的站点设置样式。


  第9章“处理外语”解释了如何使用本地化创建双语网站。


  第10章“现有模块的高级技巧”展示了更复杂模块的示例，演示了Flash、jQuery、XML源、URL重写等内容。


  第11章“挑战自定义模块”展示了在自定义模块中进行搜索、导入和导出的示例。


  第12章“高级模块与安全”解释了高级模块示例和安全技术。


  第13章“高级皮肤设计”更详细地探讨了皮肤设计，包括动画菜单、CSS和小部件。


  ## 本书所需环境


  DotNetNuke 是一个基于Web的内容管理系统，使用Windows Internet Information Server（IIS）和.NET Framework。要跟随本书中的示例，您需要满足以下条件：


  - Windows Server 2003、2008 或 2008 R2 中附带的 IIS 5 或更高版本。对于开发环境，您可以使用 Windows XP Professional、Windows
  Vista 或 Windows 7（家庭高级版及以上）。

  - Microsoft .NET Framework 3.5 或更高版本。


  ## 本书读者对象


  如果您是一名 .NET 开发人员，具有初学者到中级水平的 Visual Basic 或 C# 知识，并希望使用 DotNetNuke 开发网站/CMS，那么本书适合您。


  需要熟悉 DNN 操作、CSS 以及基本的 Web 开发（ASP.NET）技能。


  ## 约定


  在本书中，您会发现多种文本样式，用于区分不同类型的信息。以下是这些样式的一些示例及其含义说明。


  文本中的代码字以如下方式显示：“我们可以通过使用 include 指令来包含其他上下文。”


  代码块如下：


  ```

  <asp:TextBox ID="txtSalary" runat="server"></asp:TextBox>

  <asp:RequiredFieldValidator ID="valSalary" resourcekey="valSalary.ErrorMessage"
  ControlToValidate="txtSalary" CssClass="NormalRed" Display="Dynamic" ErrorMessage="<br>Salary
  is required" Runat="server" />

  ```


  当我们希望您注意代码块中的特定部分时，相关行或项目会以粗体显示：


  ```

  <tr valign="top">

