  \   - **查找范围：** `Current Document`\n\n6. 单击**全部替换**。\n\n7. 接下来，更新以下三行：\n   - 将 `<friendlyname>`\
  \ 改为 `ACME Employees`\n   - 将 `<description>` 改为 `A list of current ACME employees`\n\
