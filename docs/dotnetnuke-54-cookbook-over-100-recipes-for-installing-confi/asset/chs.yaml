- "# 现有模块的高级技巧\n\n-   将 HTML 模块与 jQuery 配合使用\n-   将 HTML 模块与替换令牌配合使用\n-   将 HTML 模块与\
  \ Flash 配合使用\n-   显示 XML 源\n-   控制友好 URL 重写\n-   使用 Google Analytics 跟踪站点\n-   将日历事件发布为\
  \ RSS 源\n-   设计自己的表单\n-   样式化自己的表单\n\n## 简介\n\n在前面的章节中，我们看到了如何配置和使用 DotNetNuke 核心模块的配方。随着您越来越熟悉管理\
  \ DNN 门户和开发自己的自定义模块，您会希望更深入地挖掘，看看这些模块还提供哪些功能。\n\n在本章中，我们将介绍一些新模块，并探索 DNN 中可用的其他功能。我们将了解\
  \ HTML 模块是多么灵活，一些底层处理是如何发生的，以及如何使用自己的自定义表单扩展 DNN 数据库。\n\n## 将 HTML 模块与 jQuery 配合使用\n\
  \njQuery 是一个简洁的 JavaScript 库，专注于 JavaScript 与 HTML 之间的交互。从版本 5 开始，DNN 支持在 DNN 页面中使用\
  \ jQuery 代码。\n\n在本配方中，我们将演示一个小型 jQuery 程序，该程序扩展了之前的“图像条”示例，添加了悬停在当前所选图像上的缩略图。\n\n\
  ## 准备工作\n\n要继续操作本配方，您必须已完成第 3 章中的配方：\n\n-   *使用 HTML 模块*\n\n## 操作步骤\n\n+   1. 在使用\
  \ jQuery 编码之前，检查 DNN 安装所支持的版本很重要。要查看版本，请先以超级用户身份登录（在我们的示例中为 `sys...`）。\n+   2. 从\
  \ **主机** 菜单中选择 **主机设置**。\n+   3. 向下滚动越过 **高级选项**，直到看到 **jQuery 设置**。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_310_0.png)\n\
  \n+   4. 在 **jQuery 设置** 下，您将看到安装支持的版本。除了 jQuery 版本，您还可以看到可用选项。以下是一个简要说明：\n+   \
  \   - 取消选择 **使用 jQuery 调试版本** 将使 DNN 使用更小、更紧凑的库，但提供的调试信息更少。\n+      - **使用托管 jQuery\
  \ 版本** 意味着 DNN 将使用给定 URL 处的库。如果未选中，将使用库的本地副本。\n+   5. 要了解如何在 HTML 模块中使用 jQuery，请转到\
  \ *使用 HTML 模块* 配方中创建的页面。\n\n```css\nborder: 1px solid #ddd;\n}\nul.image {\n   \
  \ float: left;\n    list-style: none;\n    margin: 0; padding: 0;\n}\nul.image li\
  \ {\n    margin: 0; padding: 5px;\n    float: left;\n    position: relative;\n \
