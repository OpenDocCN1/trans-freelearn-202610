- "## 安装和设置\n\n在本章中我们将介绍以下主题：\n\n- 下载 Microsoft Web Platform Installer\n- 安装 SQLServer\
  \ Express\n- 下载并安装 DotNetNuke 包\n- 运行 DotNetNuke 安装\n- 设置站点名称和信息\n- 为站点选择皮肤\n- 为站点选择容器\n\
  - 向页面添加模块\n- 安装标准 DNN 模块\n- 下载扩展（皮肤或模块）\n- 安装新扩展\n\n### 引言\n\nDotNetNuke（为简洁起见，之后我们称其为“DNN”）是一个功能强大且灵活的内容管理系统，用于构建网站。它附带了许多用于发布内容的特性，包括创建博客、横幅广告、新闻源等工具。所有这些功能开箱即用，如果你使用社区版，全部都是免费的。\n\
  \n但从零开始搭建网站可能具有挑战性。涉及多个组件，每个组件都必须正确才能整体运行。幸运的是，本章中的配方将安全地引导你绕过障碍，很快就能让你的网站运行起来。重要的是要仔细阅读配方的说明，确保每一步都按描述执行。遵循这些配方非常类似于遵循烹饪配方——如果你遗漏了配料或将烤箱温度设置错误，结果可能会一团糟。\n\
  \n在本章的配方中，你会看到短语 web server 和 database server。如果你为公司构建网站，很可能 web server 和 database\
  \ server 是网络上两台不同的机器。要安装和运行 DNN，你需要对每台机器都有登录访问权限，并且具有安装软件的权限。\n\n另一方面，如果你正在开发一个小型测试网站，一切都将安装在你的台式机或笔记本电脑上，而术语\
  \ web server 和 database server 指的就是你的机器，当然你已经拥有完全访问权限。\n\n需要互联网访问来下载 DNN 代码和安装文件，但如果你已经走到这一步，我们假设你已配备妥当。\n\
  \n让我们开始吧。\n\n### 下载 Microsoft Web Platform Installer\n\n在本配方中，我们将展示如何通过安装 Microsoft\
  \ Web Platform Installer（Web PI）为 DNN 安装准备一台机器。Microsoft Web Platform Installer\
  \ 是一个免费工具，用于从互联网下载应用程序，包括 DotNetNuke 安装、Internet Information Services（IIS）、SQL Server\
  \ Express、.NET Framework 和 Visual Web Developer。为了让安装 DNN 尽可能简单，最好先安装 Web PI。\n\n\
  #### 如何操作...\n\n1. 打开你喜欢的网页浏览器并访问网站 http://www.microsoft.com/web/Downloads/platform.aspx。\n\
  2. 点击页面右侧的 Download It Now 按钮。\n3. Web PI 现在将开始下载。当出现 Run/Save 对话框时，点击 Run。\n4.\
  \ 如果出现 Security Warning 提示，点击 Run。\n5. 如果浏览器提示你，点击浏览器顶部的 security bar 并允许文件下载。\n\
  6. 最后，如果提示允许访问以运行程序，点击 Allow。\n7. Web PI 现在将启动并显示可供下载的产品。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_17_0.png)\n\
  \n8. 从此对话框中你可以选择要下载的软件。下载产品完成后点击 Exit。\n\n#### 另请参阅\n\n安装 Web PI 后，你可以轻松下载本章其余部分所需的工具。请参阅各个配方以获取说明。\n\
  \n### 安装 SQLServer Express\n\n本配方将向你展示如何下载并安装 Microsoft 的 SQLServer 免费版本，称为 Microsoft\
  \ SQL Server 2008 Express。DNN 目前支持 SQL Server 2005 和 2008，但 SQL Server Express 对于希望从单台机器运行\
  \ DNN 的网站开发者来说也是一个不错的解决方案。\n\n#### 准备工作\n\n对于本配方，你应拥有 Windows Server 2003、2008 或\
  \ 2008R2。对于开发，你可以使用 Windows XP Professional、Windows Vista、Windows 7（家庭高级版及以上）。\n\
  \n此外，你应完成以下配方：\n\n- *Downloading the Microsoft Web Platform Installer*\n\n#### 如何操作...\n\
  \n1. 首先启动 Microsoft Web Platform Installer。\n2. 当显示可用产品列表时，点击 **Web Platform** 选项卡。\n\
  3. 在 **Database** 部分，点击 **Customize** 链接。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_18_0.png)\n\
  \n4. 确保以下产品已选中：\n\n- SQL Server Express 2008\n- SQL Server 2008 Management Studio\
  \ Express\n- SQL Server 2008 Management Objects\n\n5. 点击 **Install** 按钮开始安装。\n6.\
  \ 下一个对话框将列出你正在下载的文件并提示 **I Decline** 或 **I Accept**。点击 **I Accept**。\n7. 最后，你必须选择如何在数据库中对用户进行身份验证。由于此安装可能仅用于本地使用，你可以选择\
  \ **Mixed Mode Authentication**。\n8. 为 SQL Server 管理员（SA）选择一个密码。它必须是强密码，因此请尝试包含数字、特殊字符和混合大小写。提供一个良好的密码并点击\
  \ **Continue**。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_19_0.png)\n\n9. 现在文件将通过双击下载并安装。即使连接很快，也需要几分钟时间。安装进行到一半时可能会提示是否要重新启动，点击\
  \ **No** 以便安装继续。\n10. 安装完成后你将看到一条祝贺信息。如果提示重新启动，点击 Yes。\n\n#### 其工作原理...\n\nMicrosoft\
  \ 的 Web Platform Installer 处理文件下载和安装的细节。完成后，你的机器上将运行 SQL Server Express。\n\n###\
  \ 下载并安装 DotNetNuke 包\n\n在本配方中，我们将逐步介绍如何使用 Web PI 工具下载并安装 DotNetNuke 包。\n\n安装 DNN\
  \ 的其他方式有：\n\n| 由托管提供商预装 | 这绝对是最简单的方式。许多托管提供商将 DNN 作为托管套餐的一部分提供。 |\n| 手动上传并安装 | 如果你熟悉\
  \ SQL Server 数据库和 IIS，你可以下载 DNN 安装文件并手动安装包。这是一个了解各个组件如何组合在一起的好方法。 |\n| 使用 DNN Starter\
  \ Kit for Visual Studio 2008 | 你也可以从开发工具运行 DNN。有关更多信息，请参阅第 5 章，Building, Debugging,\
  \ and Deploying Modules |\n\n#### 准备工作\n\n对于本配方，你应拥有 Windows Server 2003、2008 或\
  \ 2008R2。对于开发，你可以使用 Windows XP Professional、Windows Vista、Windows 7（家庭高级版及以上）。\n\
  \n此外，你应完成以下配方：\n\n- Downloading the Microsoft Web Platform Installer\n\n#### 如何操作...\n\
  \n1. 首先启动 Microsoft Web Platform Installer。\n2. 当显示可用产品列表时，点击 Web Applications 选项卡。\n\
  3. 向下滚动直到看到 DotNetNuke 并确保它已选中。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_21_0.png)\n\
  \n4. 点击 **Install** 按钮开始安装。\n5. 下一个对话框将列出你正在下载的文件并提示 I **Decline** 或 I **Accept**。点击\
  \ I **Accept**。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_21_1.png)\n\n6. 现在 DotNetNuke\
  \ 将开始下载。通过双击安装。即使连接很快，也需要几分钟时间。安装进行到一半时可能会提示是否要重新启动，点击 **No** 以便安装继续。\n7. 一旦 DotNetNuke\
  \ 包下载完成，Web PI 将立即启动安装。它首先提示输入新 DNN 站点的详细信息：\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_22_0.png)\n\
  \n8. 保留默认值并点击 Continue。\n9. 接下来是应用程序信息的提示：\n\n\n## 第 2 步，共 2 步：输入应用程序信息\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_23_0.png)\n\
  \n- 10. 输入应用程序信息：\n  - **数据库：** SQL Server\n  - **新建数据库或使用现有数据库：** 新建数据库\n  - **数据库管理员：**\
  \ sa\n\n## 安装与设置\n\n- **数据库管理员密码：** 使用数据库安装时选择的密码\n- **数据库用户名：** 选择一个用户名（例如 DNN5User）\n\
  - **数据库密码：** 选择一个密码（例如 DNN5User2010）\n- **数据库服务器：** `.\\SQLExpress`\n- **数据库名称：**\
  \ DotNetNuke\n\n- 11. 单击**继续**。\n- 12. 接下来，安装过程中将显示状态屏幕。如果看到的是登录失败，请检查数据库是否正在运行，以及是否为\
