  )\n    treeManager.ImageList.Add(\"..\\images\\icon_users_16px.gif\")\n\n    ' reset\
  \ the tree control\n    treeManager.TreeNodes.Clear()\n\n    Dim objParentNode As\
  \ TreeNode\n```\n\n\n# 酷炫的 Web 控件\n\n```\n' get the list of all managers and create\
