  server\"\n                ControlName=\"ddlSalaryRange\" Suffix=\":\">\n       \
  \     </dnn:Label>\n        </td>\n        <td width=\"25%\">\n            <asp:DropDownList\
  \ ID=\"ddlSalaryRange\"\n                runat=\"server\" DataTextField=\"Text\"\
  \n                DataValueField=\"Value\" AutoPostBack=\"true\">\n            </asp:DropDownList>\n\
