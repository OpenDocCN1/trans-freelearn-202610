  \n    Inherits=\"ACME.Modules.Employee.DisplayEmployee\" %>\n<%@ Register TagPrefix=\"\
  dnn\" TagName=\"Label\"\n    Src=\"~/Controls/LabelControl.ascx\" %>\n```\n\n- 9.\
