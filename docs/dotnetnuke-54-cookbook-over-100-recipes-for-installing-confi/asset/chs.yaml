  DNN\" assembly=\"DotNetNuke.WebControls\" namespace=\"DotNetNuke.UI.WebControls\"\
  \ %>\n```\n5. 接下来，我们将通过在文件底部、分页控件之后放置以下代码来创建一个简单的树控件：\n```\n<dnn:PagingControl ID=\"\
  ctlPagingControl\" runat=\"server\">\n</dnn:PagingControl>\n<br />\n\n<DNN:DnnTree\
  \ ID=\"treeManager\" runat=\"server\" CollapsedNodeImage=\"~/images\\plus.gif\"\
  \ ExpandedNodeImage=\"~/images\\minus.gif\">\n</DNN:DnnTree>\n```\n6. 接下来，打开 `ViewEmployee.ascx.vb`\
  \ 文件。\n7. 查看文件顶部并确保以下导入存在：\n```\nImports System.Data.SqlClient\nImports DotNetNuke.UI.WebControls\n\
  ```\n8. 我们必须创建一个过程来使用数据库中的记录填充树控件。找到文件顶部的 `Private Methods` 区域并添加以下新过程：\n```\n#Region\
  \ \"Private Methods\"\n\nPrivate Sub PopulateTreeControl()\n\n    ' set the images\
