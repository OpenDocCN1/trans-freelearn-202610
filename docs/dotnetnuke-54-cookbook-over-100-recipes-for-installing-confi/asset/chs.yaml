  - 17. 由于我们为 `GetEmployeesByFilter` 例程添加了新参数，请按如下方式更改代码：\n\n```vb\nPublic Function\
  \ GetEmployeesByFilter(ByVal ModuleId As Integer,\n                            \
  \         ByVal MgrFilter As Integer,\n                                     ByVal\
  \ SalaryFilter As Integer,\n                                     ByVal PageIndex\
  \ As Integer,\n                                     ByVal PageSize As Integer,\n\
  \                                     ByRef TotalRecords As Integer) As ArrayList\n\
  \n    Dim dr As IDataReader =\n        DataProvider.Instance.GetEmployeesByFilter\n\
  \        (ModuleId, MgrFilter, SalaryFilter, PageIndex, PageSize)\n    Dim retValue\
  \ As ArrayList = Nothing\n    Try\n        While dr.Read\n            TotalRecords\
  \ = Convert.ToInt32(dr(\"TotalRecords\"))\n        End While\n        dr.NextResult()\n\
  \        retValue = CBO.FillCollection(dr, GetType(EmployeeInfo))\n    Finally\n\
  \        If Not dr Is Nothing Then\n            dr.Close()\n        End If\n   \
  \ End Try\n    Return retValue\n\nEnd Function\n```\n\n- 18. 我们使用 Try/Finally 结构来捕获可能由存储过程引起的任何错误。如果出现问题，Finally\
  \ 子句将关闭数据读取器以实现干净退出。\n\n- 19. 接下来，双击打开 01.00.00.SqlDataProvider 文件。\n\n> 如果你已经安装过此模块，可以创建一个名为\
  \ 01.00.01.SqlDataProvider 的新文件来保存新过程。详情请参阅第 11 章中的配方部署新模块版本。\n\n- 20. 要更新存储过程，我们需要从上一个配方中取出原始的\
  \ GetEmployeesByFilter 过程并添加提供分页的代码。它通过将过滤后的结果保存到临时表中，为每条记录分配一个索引值，然后仅返回属于所选页面范围的记录来实现。例如，如果我们每页显示十条记录（PageSize=10）并且我们查看的是第三页（PageIndex\
  \ 为 2），该过程应返回记录 21-30。请查看存储过程代码并添加下面突出显示的行：\n\n```sql\nCREATE procedure {databaseOwner}\n\
  \    {objectQualifier}ACME_GetEmployeesByFilter\n    @ModuleID int,\n    @MgrFilter\
  \ int,\n    @SalaryFilter int,\n    @PageIndex int,\n    @PageSize int\nAS\n\n/**\
  \ If we pass -1 for a numeric filter it means ignore the filter **/\n\nDECLARE @PageLowerBound\
  \ int\nDECLARE @PageUpperBound int\n\n/** Calculate the upper and lower bounds based\
  \ on the PageIndex and PageSize **/\n\nSET @PageLowerBound = @PageSize * @PageIndex\n\
  SET @PageUpperBound = @PageLowerBound + @PageSize + 1\n\n/** create a temp table\
  \ to hold the Ids of our results **/\nCREATE TABLE #PageIndex\n(\n    IndexID  \
  \  int IDENTITY (1, 1) NOT NULL,\n    ItemId     int\n)\n\n/** populate the temp\
  \ table with the filtered results **/\nINSERT INTO #PageIndex (ItemId)\nSELECT ItemId\n\
  FROM {objectQualifier}ACME_Employee\nWHERE (ModuleId = @ModuleId) AND (ManagerNo\
  \ = @MgrFilter OR @MgrFilter = -1) AND (Salary >= @SalaryFilter)\nORDER BY ItemId\
  \ DESC\n\n/** remember the count of the results **/\nSELECT COUNT(*) as TotalRecords\n\
  FROM #PageIndex\n\n/** join the filtered Ids to the employee table to get our fields\
  \ **/\nselect Emp.ModuleId,\n       Emp.ItemId,\n       EmpFirstName,\n       EmpLastName,\n\
  \       ManagerNo,\n       HireDate,\n       Salary,\n       Emp.CreatedByUser,\n\
  \       Emp.CreatedDate,\n       'CreatedByUserName' = Usr.FirstName + ' ' + Usr.LastName\n\
  FROM {objectQualifier}ACME_Employee As Emp\nINNER JOIN {objectQualifier}Users As\
  \ Usr on Emp.CreatedByUser = Usr.UserId\nINNER JOIN #PageIndex PageIndex\n    ON\
  \ Emp.ItemId = PageIndex.ItemId\nWHERE ( (PageIndex.IndexID > @PageLowerBound) OR\
  \ @PageLowerBound is null )\nAND ( (PageIndex.IndexID < @PageUpperBound) OR\n@PageUpperBound\
  \ is null )\nORDER BY\nPageIndex.IndexID\n\nGO\n```\n\n> 如果你直接将此代码粘贴到主机菜单下的 SQL\
  \ 表单中，请将第一行更改为 ALTER PROCEDURE...，因为该过程已存在。\n\n- 21. 从 **File** 菜单中选择 **Save All**。\n\
  \n- 22. 通过重新构建和重新部署模块来测试结果。新的每页记录数控件将显示，如果记录数超过可容纳的数量，页面控件将出现在底部（在本例中你至少需要十一条记录才能看到分页控件）。\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_203_0.png)\n\n## 如何工作...\n\n本章的最后一个配方将本章的所有组件整合在一起。我们有一个带有从数据库填充的过滤控件的\
  \ DataGrid 控件。我们有一个分页控件和可调整的页面大小。最后，我们有一个可折叠面板，可以显示或隐藏过滤器。\n\n\n\n\n"
- "## 酷炫的 Web 控件\n\n在本章中，我们将介绍以下主题：\n\n- 将 Web 控件添加到工具箱\n- 在 DataGrid 中显示电子邮件链接\n\
  - 在 DataGrid 中显示复选框\n- 在 DataGrid 中显示缩略图\n- 创建可编辑的标签\n- 在输入时提供文本建议\n- 在树形视图中显示数据\n\
  - 使用标签条分隔内容\n- 使用 CAPTCHA 控件保障安全\n- 创建多状态复选框\n\n### 简介\n\nDNN 的强大功能之一，就是提供了多种灵活且可复用的控件，用于自定义模块开发。其中包括核心\
  \ DNN 页面上的许多 Web 控件，例如可编辑标签、树形视图、CAPTCHA 控件和 Tab 控件。在本章中，我们将了解如何将这些 Web 控件添加到自定义模块，并将它们与数据库中的表关联起来。\n\
  \n通常，使用这些控件只需四个简单步骤：\n\n- 将控件代码添加到 View 或 Edit 的 `.ascx` 文件中\n- 向 info 对象添加一个新属性，用于为控件提供值\n\
  - 将控件绑定到这些值\n- 从控件获取值并保存到数据库（如果是 Edit 页面）\n\n由于本章的实例主要关注 Web 控件和数据库中的值，因此你需要先构建并部署*第6章*中的示例员工模块。我们还将扩展*第6章*中的\
  \ DataGrid，并展示它可以显示的不同类型的列。\n\n### 将 Web 控件添加到工具箱\n\n如果你经常使用开发工具中的可视化编辑器来布局页面，那么这个简短实例将向你展示如何将\
  \ DNN Web 控件添加到工具箱中。\n\n### 操作步骤...\n\n1. 启动开发工具。\n2. 将编辑器切换到设计模式。\n3. 确保工具箱已显示。\n\
  4. 右键单击工具箱，然后选择 **选择项...**。\n5. 单击 **浏览** 按钮。\n6. 在 DNN 源代码中导航到 `/bin` 文件夹（`DNNSource/website/bin`）。\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_206_0.png)\n\n7. 选择 DotNetNuke.WebControls.dll，并单击\
  \ **打开**。\n8. 确保 DNN 控件已勾选，并单击 **确定**。\n9. 现在，当你编辑代码时，这些 Web 控件将出现在工具箱的 **常规** 部分下。\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_207_0.png)\n\n10. 接下来，我们需要添加对 DotNetNuke.WebUtility.dll\
  \ 的引用。在解决方案资源管理器中右键单击 Employee 项目，然后选择 **添加引用...**。\n11. 在弹出的对话框中，单击 **浏览** 选项卡，然后导航到存放\
  \ DNN 源文件的文件夹（例如，我的文档\\DNNSource\\Website\\bin）。\n12. 选择 DotNetNuke.WebUtility.dll\
  \ 文件，并单击 **确定**。\n\n### 在 DataGrid 中显示电子邮件链接\n\n正如我们在上一章中所看到的，DataGrid 控件非常适合以格式整齐的表格显示数据库中的记录。但\
  \ DataGrid 还可以显示许多其他类型的信息，在本实例中，我们将了解如何在一列中显示电子邮件超链接。\n\n### 准备工作\n\n在本实例中，我们将扩展第6章末尾创建的\
  \ DataGrid。要继续操作，你需要先成功完成并部署*使用筛选控件显示 DataGrid* 项目。\n\n> 在本实例中，我们使用一个函数来为示例生成电子邮件地址。这使实例保持简单，但并不太实用。在真实的生产环境中，你会将其作为\
  \ Employee 表的一部分存储在数据库中。\n\n### 操作步骤...\n\n1. 启动开发工具并加载 **Employee** 项目。\n2. 双击打开\
  \ `ViewEmployee.ascx` 文件。\n3. 在代码中找到 DataGrid，并在 **Salary** 列之后添加一个新列：\n\n```aspx\n\
  <dnn:textcolumn datafield=\"Salary\" headertext=\"Salary\"/>\n\n<asp:TemplateColumn\
  \ HeaderText=\"Email Contact\">\n    <ItemTemplate>\n        <asp:HyperLink id=\"\
  hlEmail\"\n                       NavigateUrl='<%# \"mailto:\" & DataBinder.Eval(Container.DataItem,\"\
  ContactEmail\") %>'\n                       Text='<%# DataBinder.Eval(Container.DataItem,\"\
  ContactEmail\") %>'\n                       Target=\"_new\"\n                  \
  \     runat=\"server\" />\n    </ItemTemplate>\n</asp:TemplateColumn>\n\n</Columns>\n\
  </asp:datagrid>\n```\n\n4. 接下来，打开 `EmployeeInfo.vb` 文件。\n5. 找到“公共属性”部分，并添加只读属性 `EmailAddress`，该属性根据员工姓名构造一个电子邮件地址：\n\
  \n```vb\n' public properties\n\nPublic ReadOnly Property EmailAddress() As String\n\
  \    Get\n        Return _EmpFirstName.Substring(0, 1) + _EmpLastName + \"@yourcompany.com\"\
  \n    End Get\nEnd Property\n```\n\n6. 从 **文件** 菜单中选择 **全部保存**。\n7. 要检查结果，请构建模块并将其部署到开发门户进行测试（相关说明请参阅第5章中的*将模块作为独立包部署*实例）。\n\
  8. 转到 ACME Employee 页面查看员工列表。新的电子邮件超链接将出现在右侧。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_209_0.png)\n\
  \n### 工作原理...\n\n在本实例中，我们完成了在 DataGrid 控件中显示电子邮件超链接的任务：\n\n- 我们采用了上一实例中的 DataGrid\
  \ 控件，并添加了一个包含电子邮件超链接控件的新模板列。\n- 我们向 EmployeeInfo 对象添加了一个新属性，用于为 DataGrid 提供电子邮件地址。\n\
  \n### 在 DataGrid 中显示复选框\n\nDataGrid 中一个有用的显示元素是类似复选框的图像，用于指示数据库记录的状态。这些并不是真正可用的复选框，而是一种视觉指示器，用于显示数据为\
  \ true 或 false。\n\n该控件通过两张图像工作：一张带有对勾，当值为 true 时显示；另一张为未勾选图像，当值为 false 时显示。\n\n\
  > 本实例适用于任何表示 true 或 false 的图像。类似复选框的图像在其他 DNN 模块中也有使用，因此用户会很熟悉，但你也可以尝试使用自己的图像。\n\
  \n本实例有两个基本步骤：\n\n- 我们将创建 EmployeeInfo 对象的一个新属性，名为 `NewHire`。该属性检查数据库中的入职日期，如果员工的入职时间在\
  \ 30 天以内，则返回 true。\n- 我们将向 DataGrid 添加一个新列，该列会计算 `NewHire` 属性，如果 `NewHire` 为 true\
  \ 则显示一张图像，如果 `NewHire` 为 false 则显示另一张图像。\n\n### 准备工作\n\n在本实例中，我们将扩展在*第6章*中创建的 DataGrid。要继续操作，你需要先成功完成并部署*使用筛选控件显示\
  \ DataGrid* 项目。\n\n### 操作步骤...\n\n1. 启动开发工具并加载 **Employee** 项目。\n2. 双击打开 `ViewEmployee.ascx`\
  \ 文件。\n3. 第一步是向 DataGrid 添加一个新列，用于显示复选框图像。我们将使用 `Eval` 函数来检查 `NewHire` 属性。找到 DataGrid，并在\
  \ `Salary` 列之后添加一个新列：\n\n```aspx\n<dnn:textcolumn datafield=\"Salary\" headertext=\"\
  Salary\"/>\n\n<asp:TemplateColumn HeaderText=\"New Hire\">\n    <ItemTemplate>\n\
  \        <asp:Image Runat=\"server\" ID=\"imgApproved\"\n                   ImageUrl=\"\
  ~/images/checked.gif\" Visible='<%# DataBinder.Eval(Container.DataItem,\"NewHire\"\
  ) = \"1\" %>'/>\n        <asp:Image Runat=\"server\" ID=\"imgNotApproved\"\n   \
  \                ImageUrl=\"~/images/unchecked.gif\" Visible='<%# DataBinder.Eval(Container.DataItem,\"\
  NewHire\") = \"0\" %>'/>\n    </ItemTemplate>\n</asp:TemplateColumn>\n\n</Columns>\n\
  </asp:datagrid>\n```\n\n4. 接下来，打开 `EmployeeInfo.vb` 文件。\n5. 找到 `Public Properties`\
  \ 部分，并添加只读属性 `NewHire`。如果员工在过去 30 天内入职，该属性返回 true 或 false：\n\n```vb\n' public properties\n\
  \nPublic ReadOnly Property NewHire() As Boolean\n    Get\n        Return (Today\
  \ - _HireDate).Days < 30\n    End Get\nEnd Property\n```\n\n\n\n\n\n6. 从“文件”菜单中选择“全部保存”。\n\
  \n7. 要检查结果，请构建模块并将其部署到开发门户进行测试（有关说明，请参阅第5章中的“以独立包方式部署模块”配方）。\n\n8. 转到 ACME Employee\
  \ 页面查看员工列表。新的复选框将出现在右侧。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_211_0.png)\n\
  \n9. 尽管您无法点击这些复选框，但它们确实为记录提供了清晰且易于理解的视觉状态。\n\n## 工作原理...\n\n在本配方中，我们完成了在 Datagrid\
  \ 控件中显示复选框图像的任务：\n\n- 我们从上一个配方中获取 Datagrid 控件，并添加了一个新的模板列，其中包含两个图像控件，一个选中，另一个未选中。\n\
  - 我们向 EmployeeInfo 对象添加了一个新属性，该属性根据数据库记录返回 true 或 false。\n- 我们将该属性绑定到控件，这样如果属性为\
  \ true，则显示选中的图像；如果属性为 false，则显示未选中的图像。\n\n## 在 Datagrid 中显示缩略图\n\nDatagrid 是一种灵活的控件，可以显示多种信息。在本配方中，我们将了解如何根据\
  \ Employee 表中的信息在 Datagrid 中显示小缩略图。\n\n### 准备工作\n\n在本配方中，我们将扩展在 *第6章* 中创建的 Datagrid。要继续操作，您应该已成功完成并部署\
  \ *显示带筛选控件的 Datagrid* 项目。\n\n### 操作步骤...\n\n- 1. 首先准备一些要显示的缩略图。通常 64x64 是不错的尺寸，但您可以尝试看看效果。为简单起见，请根据员工姓名命名图像——名字首字母和姓氏，扩展名为\
  \ .PNG。\n- 2. 现在我们需要将图像上传到 DNN 网站。以 Host 用户身份登录（在我们的示例中为 `syshost`）。\n- 3. 查看 **管理**\
  \ 菜单并选择 **文件管理器**。确保左侧出现 **门户根目录**：\n- 4. 在文件夹名称文本框中输入 **SiteImages**，然后点击 **添加文件夹**。\n\
  - 5. 点击 **上传** 链接。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_212_0.png)\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_212_1.png)\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_213_0.png)\n\n- 6. 点击 **浏览** 按钮并选择一个示例图像。\n\
  - 7. 点击 **上传文件** 上传图像。对每个图像重复此操作。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_213_1.png)\n\
  \n- 8. 一旦图像对网站可用，我们就在模块中编写代码，以便在显示员工时显示图像。\n- 9. 启动开发工具并加载 **Employee** 项目。\n- 10.\
  \ 双击打开 `ViewEmployee.ascx` 文件。\n- 11. 找到 Datagrid，并在 **编辑** 和 **删除** 链接之后添加一个新列：\n\
  \n```\n<columns>\n    <dnn:imagecommandcolumn CommandName=\"Edit\" ImageUrl=\"~/images/edit.gif\"\
  \ EditMode=\"URL\" KeyField=\"ItemID\" />\n    <dnn:imagecommandcolumn CommandName=\"\
  Delete\" ImageUrl=\"~/images/delete.gif\" KeyField=\"ItemID\" />\n\n    <asp:TemplateColumn\
  \ HeaderText=\"Icon\">\n        <itemtemplate>\n\n            <asp:HyperLink id=\"\
  imgView\"\n                ImageUrl='<%# DataBinder.Eval\n                    (Container.DataItem,\"\
  ImageURL\") %>'>\n```\n\n- 12. 接下来，打开 `EmployeeInfo.vb` 文件。\n- 13. 找到 **公共属性** 部分，并添加只读属性\
  \ `ImageURL`，该属性返回我们上传图像的 URL（基于员工姓名）：\n\n```\n' public properties\n\nPublic ReadOnly\
  \ Property ImageURL() As String\n    Get\n        Return \"~\\\\Portals\\\\_default\\\
  \\SiteImages\\\\\" + _\n               _EmpFirstName.Substring(0, 1) + _EmpLastName\
  \ + \".png\"\n    End Get\nEnd Property\n\nPublic ReadOnly Property ContactInfo()\
  \ As String\n    Get\n        Return _EmpFirstName + \" \" + _EmpLastName + \" Hired:\
  \ \" +\n                                      FormattedHireDate()\n    End Get\n\
  End Property\n```\n\n- 14. 从 **文件** 菜单中选择 **全部保存**。\n- 15. 要检查结果，请构建模块并将其部署到开发门户进行测试（有关说明，请参阅\
  \ *第5章中的“以独立包方式部署模块”* 配方）。\n- 16. 转到 **ACME Employee** 页面查看员工列表。员工图像将出现在左侧。\n\n\
  ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_215_0.png)\n\n## 工作原理...\n\n在本配方中，我们完成了在\
  \ Datagrid 控件中显示图像的任务：\n\n- 我们创建了一组图像并将其上传到 DNN 网站。\n- 我们从上一个配方中获取 Datagrid 控件，并添加了一个新的模板列，其中包含一个图像超链接控件。\n\
  - 我们向 `EmployeeInfo` 对象添加了一个新属性，该属性为超链接提供图像 URL。\n\n## 更多内容...\n\n在本配方中，图像显示在 Datagrid\
  \ 中，但没有附带导航。要了解如何创建可点击并导航的缩略图，请参阅第12章中的 *使用 NavigateURL 控制导航* 配方了解详情。\n\n## 创建可编辑的标签\n\
  \n我们在之前的配方中已经见过标签控件，但在本配方中，我们将了解如何使用 `DNNLabelEdit` 控件创建可编辑的标签。您可以在 DNN 网站的模块标题中看到\
  \ `DNNLabelEdit` 控件的工作方式，它允许管理员直接在页面上编辑模块标题。\n\n### 准备工作\n\n要跟随本配方操作，您必须已完成以下配方：\n\
  \n- *以独立包方式部署模块*\n- *将 Web 控件添加到工具箱*\n\n本配方的重要部分之一是，一旦标签被更改，我们必须将新文本保存到某个地方。幸运的是，DNN\
  \ 提供了一个保存位置：模块设置。模块设置适用于模块的所有实例，无论它们出现在多少页面上（不同于 Tab 模块设置，Tab 模块设置是针对特定模块实例的设置）。要访问模块设置，我们使用\
  \ `UpdateModuleSetting` 例程，传入我们的模块 ID、设置名称和设置值。\n\n### 操作步骤...\n\n- 1. 启动开发工具并加载\
  \ **Employee** 项目。\n- 2. 双击打开 `EditEmployee.ascx` 文件。\n- 3. 确保以下注册指令位于文件顶部：\n\n\
  ```\n<%@ Register tagprefix=\"DNN\" assembly=\"DotNetNuke.WebControls\"\n      \
  \     namespace=\"DotNetNuke.UI.WebControls\" %>\n```\n\n- 4. 找到包含标签和文本控件的 HTML\
  \ 表格，并注意现有的用于员工名字的标签控件：\n\n```\n<table width=\"650\" cellspacing=\"0\" cellpadding=\"\
  0\" border=\"0\"\n       summary=\"Edit Table\">\n\n<tr valign=\"top\">\n      \
  \  <td class=\"SubHead\" width=\"125\">\n            <dnn:label id=\"lblEmpFirstName\"\
  \ runat=\"server\"\n                      controlname=\"lblEmpFirstName\" suffix=\"\
  :\">\n            </dnn:label>\n        </td>\n\n        <td>\n            <asp:TextBox\
  \ ID=\"txtEmpFirstName\" runat=\"server\"></asp:TextBox>\n```\n\n- 5. 删除原始标签控件，并用以下新的标签代码替换它。源代码现在看起来像这样：\n\
  \n```\n<table width=\"650\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\"\n \
  \      summary=\"Edit Table\">\n\n<tr valign=\"top\">\n        <td class=\"SubHead\"\
  \ width=\"125\">\n            <DNN:DNNLabelEdit ID=\"dleEmpFirstName\" runat=\"\
  server\">[click\n                                                        here to\
  \ edit]\n            </DNN:DNNLabelEdit>\n```\n\n```\n</td>\n<td>\n<asp:TextBox\
  \ ID=\"txtEmpFirstName\" runat=\"server\"></asp:TextBox>\n```\n\n- 6. 这足以让我们编辑标签，但我们也想保存文本更改。为此，我们必须处理标签被重新输入时的事件并保存信息。首先打开\
  \ `EditEmployee.ascx.vb` 文件。\n\n- 7. 通过将此代码粘贴到 **事件处理程序** 区域的末尾来创建新的事件处理程序：\n\n\
  ```\nPrivate Sub dleEmpFirstName_Updatelabel(ByVal sender As Object,\n        ByVal\
  \ e As DotNetNuke.UI.WebControls.DNNLabelEditEventArgs)\n        Handles dleEmpFirstName.UpdateLabel\n\
  \n    Dim modCtrl As New\n        DotNetNuke.Entities.Modules.ModuleController\n\
  \    Dim strLabel As String = e.text.tostring()\n\n    ' save the updated label\
  \ text in the module settings\n\n    modCtrl.UpdateModuleSetting(ModuleId, \"EmpFirstName\"\
  ,\n                                strLabel)\n\nEnd Sub\n```\n\n- 8. 最后，将以下代码添加到\
  \ `Page_Load` 过程中：\n\n```\nIf Page.IsPostBack = False Then\n\n    ' load the label\
  \ text from the module settings\n\n    Dim strLabelText As String = CType(Settings(\"\
  EmpFirstName\"),\n                                       String)\n\n    ' if no\
  \ text was saved in module settings, set it to [click\n    '                   \
  \                          here to edit]\n    If strLabelText Is Nothing Then\n\
  \        ' pull the default label text from the resource file\n        strLabelText\
  \ = Localization.GetString(\"lblEmpFirstName\",\n                              \
  \                LocalResourceFile)\n\n    End If\n    dleEmpFirstName.Text = strLabelText\n\
  ```\n\n- 9. 从 **文件** 菜单中选择 **全部保存**。\n\n\n\n\n\n10. 要检查结果，请将模块构建并部署到开发门户以进行测试（有关说明，请参阅第\
  \ 5 章中的配方《将模块作为独立包部署》）。\n\n11. 转到 ACME 员工页面并单击员工旁边的编辑图标（小铅笔），以显示编辑员工页面。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_218_0.png)\n\
  \n12. 单击标签即可解锁它并允许您输入新标签。离开页面时文本会自动保存。返回时，标签将显示新文本。\n\n## How it works...\n\n在本配方中，我们看到了创建\
  \ DNNLabelEdit 控件的任务：\n\n- 我们将控件放置在 .ascx 文件中\n- 在文件的代码后台中，我们添加了一个事件处理程序以在标签文本更改时保存标签文本\n\
  - 我们更改了 Page_Load 过程以从数据库读取标签文本\n\n## Suggest text while typing\n\nDNNTextSuggest\
  \ 控件是一个文本框，它会监视用户输入并在用户输入时建议文本。这种行为在搜索引擎和其他网站上经常看到。\n\n该控件的工作方式是拥有一个可能的文本短语列表，可以在用户输入时进行搜索。在本配方中，我们将通过使用\
  \ DNN 站点的一部分的美国地理州列表以及编辑员工页面上的新字段来演示此控件。\n\n## Getting ready\n\n要跟随本配方，您必须已完成以下配方：\n\
  \n- Deploying a module as a standalone package\n- Adding web controls to your Toolbox\n\
  \n## How to do it...\n\n1. 启动开发工具并加载 **Employee** 项目。\n2. 在 **Solution Explorer**\
  \ 中，在引用下查看并确保您的项目包含对 `DotNetNuke.WebUtility.dll` 的引用。\n3. 双击打开 `EditEmployee.ascx`\
  \ 文件。\n4. 确保文件顶部有以下注册指令：\n```\n<%@ Register tagprefix=\"DNN\" assembly=\"DotNetNuke.WebControls\"\
  \ namespace=\"DotNetNuke.UI.WebControls\" %>\n```\n5. 我们将向保存员工字段的 HTML 表格添加一行。找到\
  \ HTML 表格并在 `</TABLE>` 标签之前插入以下代码。\n```\n<tr valign=\"top\">\n    <td class=\"SubHead\"\
  \ width=\"200\"><dnn:label id=\"lblSalary\" runat=\"server\" controlname=\"lblSalary\"\
  \ suffix=\":\">\n    </dnn:label>\n    </td>\n    <td>\n    <asp:TextBox ID=\"txtSalary\"\
  \ runat=\"server\"></asp:TextBox>\n    <asp:RequiredFieldValidator ID=\"valSalary\"\
  \ resourcekey=\"valSalary.ErrorMessage\" ControlToValidate=\"txtSalary\" CssClass=\"\
  NormalRed\" Display=\"Dynamic\" ErrorMessage=\"<br>Salary is required\" Runat=\"\
  server\" />\n    </td>\n</tr>\n\n<tr valign=\"top\">\n    <td class=\"SubHead\"\
  \ width=\"200\">\n    <dnn:label id=\"lblState\" runat=\"server\" controlname=\"\
  lblState\" suffix=\":\">\n    </dnn:label>\n    </td>\n    <td>\n    <DNN:DNNTextSuggest\
  \ ID=\"txtState\" runat=\"server\">\n    </DNN:DNNTextSuggest>\n    </td>\n</tr>\n\
  </table>\n```\n\n6. 接下来，打开 EditEmployee.ascx.vb 文件。\n\n7. 检查文件顶部并确保它具有以下导入：\nImports\
  \ DotNetNuke.UI.WebControls\nImports DotNetNuke.Common.Lists\n\n8. 滚动到 Private Methods\
  \ 区域并添加此过程：\n#Region \"Private Methods\"\n\nPrivate Sub SuggestText(ByVal objNodes\
  \ As DNNNodeCollection, ByVal strTypedText As String)\n\n    Dim nodeStates As DNNNode\n\
  \    Dim objList As New ListController()\n    Dim lstStates As ListEntryInfoCollection\
  \ = objList.GetListEntryInfoCollection(\"Region\", \"Country.US\")\n\n    Dim state\
  \ As ListEntryInfo\n\n    'loop through the collection and add it to the result\
  \ set\n\n    For Each state In lstStates\n        If txtState.MaxSuggestRows = 0\
  \ Or objNodes.Count < (txtState.MaxSuggestRows + 1) Then\n            ' add the\
  \ state to the list of suggestions\n            nodeStates = New DNNNode(state.Text)\n\
  \            nodeStates.ID = state.Value\n            objNodes.Add(nodeStates)\n\
  \        End If\n    Next\n\nEnd Sub\n\n9. 接下来，我们必须捕获在控件中输入文本时。滚动到 Event Handlers\
  \ 区域底部并添加以下过程：\nPrivate Sub txtState_UpdateLabel(ByVal sender As Object, ByVal e\
  \ As DotNetNuke.UI.WebControls.DNNTextSuggestEventArgs) Handles txtState.PopulateOnDemand\n\
  \n    ' call the suggestion procedure and pass the text typed into the control\n\
  \    SuggestText(e.Nodes, e.Text)\n\nEnd Sub\n\n#End Region\n\n## See also\n\n在本配方中，我们看到了\
  \ SuggestText 网页控件的工作原理以及如何使用它来提示文本值。为了使配方保持简单，它没有包含将值加载和保存到数据库所需的代码。要快速回顾向数据库添加字段以及加载和保存值的例程，请参阅第\
  \ 4 章中的配方《将模块连接到数据库》。\n\n## Showing data in a Treeview\n\n当您拥有按层次结构排列的信息（如公司的组织结构图）时，会使用\
  \ Treeview 控件。Treeview 控件将显示层次结构中的每个级别，并带有用于向下钻取或展开到下一级的图标。\n\n## Getting ready\n\
  \n要跟随本配方，您必须已完成以下配方：\n\n- Deploying a module as a standalone package (from Chapter\
  \ 5)\n- Displaying a Datagrid with filter controls\n- Adding web controls to your\
  \ Toolbox\n\nTreeview 控件要求 Employee 表中的员工已分配给经理。以下是本配方中使用的數據：\n\n| ItemID | EmpFirstName\
  \ | EmpLastName | ManagerNo | HireDate | Salary | CreatedByUser | CreatedDate |\n\
  |---|---|---|---|---|---|---|---|\n| 1 | John | Smith | 0 | 2/4/2010 12:00:... |\
  \ 25000 | 1 | 2/4/2010 9:33:0... |\n| 13 | Richard | Roe | 0 | 1/1/1995 12:00:...\
  \ | 35000 | 1 | 2/11/2010 7:25:2... |\n| 14 | Susan | Smith | 0 | 2/2/1997 12:00:...\
  \ | 55000 | 1 | 2/11/2010 12:00:... |\n| 23 | Kevin | Jones | 1 | 3/3/1998 12:00:...\
  \ | 65000 | 1 | 2/11/2010 12:00:... |\n| 24 | Amy | Roe | 1 | 4/4/1999 12:00:...\
  \ | 90000 | 1 | 2/12/2010 8:27:... |\n| 25 | Marianne | Brown | 13 | 5/5/1992 12:00:...\
  \ | 30000 | 1 | 2/12/2010 8:28:... |\n| 26 | Debby | Smith | 14 | 6/6/1996 12:00:...\
  \ | 90000 | 1 | 2/12/2010 8:27:... |\n| NULL | NULL | NULL | NULL | NULL | NULL\
  \ | NULL | NULL |\n\n在此示例中，员工按简单的两级层次结构排列。如果您的 ManagerNo 为 0，则表示您是经理。否则，您记录上的经理编号是您经理的\
  \ ItemID。因此 John Smith 是经理（他的 ManagerNo=0），他管理 Kevin Jones 和 Amy Roe（因为他们的 ManagerNo\
  \ 是 John Smith 的 ItemID）。\n\n## How to do it...\n\n1. 启动开发工具并加载 **Employee** 项目。\n\
  2. 在 **Solution Explorer** 中，在引用下查看并确保您的项目包含对 `DotNetNuke.WebUtility.dll` 的引用。\n\
