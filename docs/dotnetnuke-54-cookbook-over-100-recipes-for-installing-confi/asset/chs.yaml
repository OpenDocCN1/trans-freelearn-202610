  \ 11 章中的菜谱“在清单中使用 HTML”。\n\n## 6\n数据输入技巧\n\n在本章中，我们将涵盖以下主题：\n\n-   - 从资源文件显示标签\n\
  -   - 创建可折叠面板\n-   - 从 DNN 列表填充下拉列表\n-   - 从存储过程填充下拉列表\n-   - 显示带筛选控件的数据网格\n-  \
  \ - 向数据网格添加分页控件\n\n## 简介\n\n在本章中，我们将查看用于基本数据输入和数据显示的工具和技巧。我们将使用第 4 章中的示例 Employee\
  \ 项目并扩展它以包含新的数据输入控件。我们将看到如何使用资源文件，用数据库中的数据填充控件，在存储过程中运行查询，并在页面上显示结果。\n\n-   - **Page_Load\
  \ 过程**\n     在 .NET 框架中，当 Web 表单加载时，会发生一个名为 `Page_Load` 的特殊事件。该事件经常用于在用户控件显示之前准备数据。在本章中，你将看到使用\
  \ `Page_Load` 事件填充下拉列表或准备数据网格的示例。在 `Page_Load` 例程内部，常见的做法是检查页面是否正在回发到服务器。这告诉你页面是首次查看，你可以据此填充控件。\n\
  \n\n\n\n\n# 区域\n\n区域由 Visual Studio 用于将代码组织成逻辑组。它们在代码中不是必需的，但推荐使用。在本章的配方中，你将看到 Starter\
  \ Kit 创建的多个区域（例如 Private Members 或 Public Methods），当你尝试查找需要更新的例程时，它们会很有帮助。\n\n#\
  \ 从资源文件显示标签\n\nDNN 中的数据输入表单通常具有标签来标识页面上的字段。这些是特殊的控件，用于显示文本，但也带有“帮助”图标，点击时会显示解释。\n\
  \n但这些文本来自哪里？我们可以在代码中硬编码标签的文本，但这会限制我们轻松更新文本的能力，并且我们将错过 DNN 提供的强大的本地化功能。本地化是 DNN 根据用户选择的语言自动翻译标签和系统消息的一种方式。你可以从第\
  \ 9 章的配方中了解更多关于本地化的信息。\n\n在本配方中，我们将把标签文本和帮助说明存储在资源文件中，并通过唯一的 ID 将它们链接到标签。\n\n# 准备工作\n\
  \n在本配方中，我们将使用来自示例 Employee 项目的 EditEmployee 控件。要跟随操作，你必须已完成第 4 章中的以下配方：\n\n- 使用\
  \ Starter Kit 创建新模块\n\n# 如何操作...\n\n- 1. 启动 Development Tool 并加载 Employee 项目。\n\
  - 2. 双击打开 EditEmployee.ascx 文件。\n- 3. 第 5 章中 Building an Edit control 配方创建了五组用于编辑值的控件。以下是编辑\
  \ Salary 的控件示例。注意标签控件 lblSalary：\n\n```\n<tr valign=\"top\">\n<td class=\"SubHead\"\
  \ width=\"125\">\n<dnn:label id=\"lblSalary\" runat=\"server\" controlname=\"lblSalary\"\
  \ suffix=\":\">\n</dnn:label>\n</td>\n```\n\n```\n<td>\n<asp:TextBox ID=\"txtSalary\"\
  \ runat=\"server\"></asp:TextBox>\n<asp:RequiredFieldValidator ID=\"valSalary\"\
  \ resourcekey=\"valSalary.ErrorMessage\" ControlToValidate=\"txtSalary\" CssClass=\"\
  NormalRed\" Display=\"Dynamic\" ErrorMessage=\"<br>Salary is required\" Runat=\"\
  server\" />\n</td>\n</tr>\n```\n\n- 4. 这五个标签中的每一个都将从 Edit 资源文件获取其值。因此双击打开 App_LocalResources\
  \ 文件夹中的 EditEmployee.ascx.resx 文件。\n\n- 5. 使用资源编辑器并为以下五个字段中的每一个输入文本和帮助消息：\n\n```\n\
  ControlTitle_edit.Text: Edit Employee\nlblEmpFirstName.Text: First Name\nlblEmpFirstName.Help:\
  \ Enter the first name of the employee\nlblEmpLastName.Text: Last Name\nlblEmpLastName.Help:\
  \ Enter the last name of the employee\nlblManagerNo.Text: Manager #\nlblManagerNo.Help:\
  \ Enter the ID number of employee's manager\nlblHireDate.Text: Hire Date\nlblHireDate.Help:\
  \ Enter employee's date of hire\nlblSalary.Text: Salary\nlblSalary.Help: Enter employee's\
  \ annual salary\n```\n\n# 数据输入技巧\n\n- 6. 文件现在应该如下所示：\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_172_0.png)\n\
  \n- 7. 从 **File** 菜单中选择 **Save All**。\n\n- 8. 要检查结果，请构建并将模块部署到你的 DNN 站点（有关说明，请参阅\
  \ *Chapter 5* 中的配方 *Deploying a module as a standalone package*）。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_172_1.png)\n\
  \n# 创建可折叠面板\n\nDNN 提供的另一个有用控件是 `SectionHead` 控件，它在数据输入表单上创建可折叠面板。此面板在 DNN 模块中经常出现，当你不想在页面上浪费空间用于用户并不总是需要的东西时很有用。\n\
  \n在本配方中，我们将创建一个可折叠面板，显示或隐藏包含示例文本的 HTML 表格。在配方 *Populating a drop-down list from\
  \ a DNN list* 和 *Populating a drop-down list from a stored procedure* 中，我们将用真实控件替换示例文本以创建更实用的示例。\n\
  \n## 准备工作\n\n要跟随本配方，你必须已完成以下配方：\n\n- *Creating a new module with the Starter Kit*\n\
  \n## 如何操作...\n\n- 1. 首先启动 Development Tool 并加载 Employee 项目。\n- 2. 双击打开 `ViewEmployee.ascx`\
  \ 文件。\n- 3. 查看文件的顶部并在 Datalist 控件之前找到 register 指令：\n\n```\n<%@ Control language=\"\
  vb\"\n    Inherits=\"ACME.Modules.Employee.ViewEmployee\"\n    AutoEventWireup=\"\
  false\" Explicit=\"True\"\n    Codebehind=\"ViewEmployee.ascx.vb\" %>\n<%@ Register\
  \ TagPrefix=\"dnn\" TagName=\"Audit\"\n    Src=\"~/controls/ModuleAuditControl.ascx\"\
  \ %>\n<asp:datalist id=\"lstContent\" datakeyfield=\"ItemID\" runat=\"server\"\n\
  \    cellpadding=\"4\">\n    <itemtemplate>\n```\n\n- 4. 在 Datalist 控件之前插入一个新的 register\
  \ 指令：\n\n```\n<%@ Register TagPrefix=\"dnn\" TagName=\"SectionHead\"\n    Src=\"\
  ~/controls/SectionHeadControl.ascx\" %>\n```\n\n- 5. 文件的顶部现在应该如下所示：\n\n```\n<%@\
  \ Control language=\"vb\"\n    Inherits=\"ACME.Modules.Employee.ViewEmployee\"\n\
  \    AutoEventWireup=\"false\" Explicit=\"True\"\n    Codebehind=\"ViewEmployee.ascx.vb\"\
  \ %>\n<%@ Register TagPrefix=\"dnn\" TagName=\"Audit\"\n    Src=\"~/controls/ModuleAuditControl.ascx\"\
  \ %>\n```\n\n```\n<%@ Register TagPrefix=\"dnn\" TagName=\"SectionHead\" Src=\"\
  ~/controls/SectionHeadControl.ascx\" %>\n<asp:datalist id=\"lstContent\" datakeyfield=\"\
  ItemID\" runat=\"server\" cellpadding=\"4\">\n    <itemtemplate>\n```\n\n- 6. 接下来，我们添加一个简单的\
  \ HTML 表格并将其链接到 SectionHead 控件。按如下方式在文件的顶部插入此代码：\n\n```\n<%@ Control language=\"\
  vb\" Inherits=\"ACME.Modules.Employee.ViewEmployee\" AutoEventWireup=\"false\" Explicit=\"\
  True\" Codebehind=\"ViewEmployee.ascx.vb\" %>\n<%@ Register TagPrefix=\"dnn\" TagName=\"\
  Audit\" Src=\"~/controls/ModuleAuditControl.ascx\" %>\n<%@ Register TagPrefix=\"\
  dnn\" TagName=\"SectionHead\" Src=\"~/controls/SectionHeadControl.ascx\" %>\n<dnn:SectionHead\
