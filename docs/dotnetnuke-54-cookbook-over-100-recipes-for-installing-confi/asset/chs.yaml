  13. 此文件的最后一段代码是在最底部为“返回”链接添加一个处理程序：\n\n```\n#Region \"Optional Interfaces\"\n\n\
  Private Sub cmdReturn_Click(ByVal sender As Object, ByVal e As EventArgs) Handles\
  \ cmdReturn.Click\n    Try\n        Response.Redirect(NavigateURL(), True)\n   \
  \ Catch exc As Exception    'Module failed to load\n```\n\n```\nProcessModuleLoadException(Me,\
  \ exc)\nEnd Try\nEnd Sub\n\n#End Region\n\nEnd Class\n```\n\n+   14. 最后一步是为 View\
  \ 控件创建一个新的资源文件，我们将在其中保存标签文本。在解决方案资源管理器中，右键单击 `App_LocalResources` 文件夹。\n+   15.\
  \ 从**添加**弹出菜单中选择**新建项...**。\n+   16. 选择**资源文件**作为模板，并将其命名为 `DisplayEmployee.ascx.resx`。\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_371_0.png)\n\n+   17. 单击**添加**创建文件，然后添加以下条目：\n\
  +   \n+   - `ControlTitle_display.Text`：**显示员工**\n+   - `lblEmpFirstName.Text`：**名字**\n\
  +   - `lblEmpLastName.Text`：**姓氏**\n+   - `lblManagerNo.Text`：**经理编号**\n+   - `lblHireDate.Text`：**雇用日期**\n\
  +   - `lblSalary.Text`：**薪资**\n\n18. 文件现在应如下所示：\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_372_0.png)\n\
  \n19. 新用户控件就位并创建好资源文件后，剩下要做的就是将新文件添加到清单中。双击打开 Employee.dnn 文件。\n\n20. 向下滚动并添加以下文本：\n\
  \n```\n<control>\n    <src>DesktopModules/ACME.Employee/ViewEmployee.ascx</src>\n\
  \    <type>View</type>\n    <helpurl></helpurl>\n</control>\n<control>\n    <key>AcmeEmployeeDisplay</key>\n\
  \    <title>Display Employee</title>\n    <src>DesktopModules/ACME.Employee/DisplayEmployee.ascx</src>\n\
  \    <type>View</type>\n    <helpurl></helpurl>\n</control>\n```\n\n21. 再向下滚动一点，并添加：\n\
  \n```\n<file>\n    <name>ViewEmployee.ascx</name>\n</file>\n<file>\n    <name>DisplayEmployee.ascx</name>\n\
  </file>\n<file>\n    <name>EditEmployee.ascx</name>\n</file>\n```\n\n22. 继续向下滚动一点，并添加：\n\
  \n```\n```xml\n<file>\n    <path>App_LocalResources</path>\n    <name>ViewEmployee.ascx.resx</name>\n\
  </file>\n<file>\n    <path>App_LocalResources</path>\n    <name>DisplayEmployee.ascx.resx</name>\n\
  </file>\n<file>\n    <path>App_LocalResources</path>\n    <name>EditEmployee.ascx.resx</name>\n\
  </file>\n```\n```\n\n23. 从**文件**菜单中选择**全部保存**以保存所有更改。\n\n24. 生成并部署模块到你的 DNN 站点（有关说明，请参阅第\
  \ 5 章 *生成、调试和部署模块* 中的 *将模块作为独立包部署* 操作指南）。请同时包含两个新文件：`DisplayEmployee.ascx` 和 `DisplayEmployee.ascx.resx`。\n\
  \n25. 虽然我们还无法导航到新控件（因为它仍需要连接到 Datagrid），但部署后它看起来如下所示：\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_373_0.png)\n\
  \n26. 下一个操作指南将演示如何从员工 Datagrid 调用这个新的 View 控件。\n\n## 工作原理...\n\n在本操作指南中，我们使用 HTML\
  \ 表格来布局新控件，但这只是为了保持示例简单。正如我们在前面章节中所看到的，最好使用 CSS 样式来控制布局，因为它在外观定制（skinning）方面灵活得多。\n\
  \n## 更多内容...\n\n本操作指南中一个非常重要的部分出现在将控件添加到清单时。要使辅助 View 控件正常工作，它必须有一个唯一的键，以便我们在导航到它时用该键来标识控件。在此示例中，我们在清单中使用\
  \ `<key>AcmeEmployeeDisplay</key>` 元素定义新控件时，为它指定了键“AcmeEmployeeDisplay”。\n\n## 使用\
  \ NavigateURL 控制导航\n\n在本操作指南中，我们将了解如何使用 NavigateURL 控制模块内的导航。在此示例中，我们将连接员工 Datagrid，以便当点击某个员工的链接时，导航会转到上一个操作指南中创建的辅助\
  \ View 控件，并显示该员工的详细信息。\n\n> 注意：此技术仅用于模块内的导航，不能用于向其他模块或页面外部导航。\n\n## 准备工作\n\n要按本操作指南操作，你必须先完成以下操作指南：\n\
  \n-   - 创建辅助 View 控件\n\n## 操作步骤...\n\n-   1. 首先启动开发工具并加载 Employee 项目。\n-   2. 第一步是向员工\
  \ Datagrid 添加一个指向辅助 View 控件的链接。双击打开 ViewEmployee.ascx 文件。\n-   3. 我们在 Datagrid 中添加一个新列，代码如下：\n\
  +   ```\n+   <dnn:imagecommandcolumn CommandName=\"Display\" ImageUrl=\"~/images/view.gif\"\
  \ EditMode=\"URL\" KeyField=\"ItemID\" />\n+   <dnn:imagecommandcolumn CommandName=\"\
  Edit\" ImageUrl=\"~/images/edit.gif\" EditMode=\"URL\" KeyField=\"ItemID\" />\n\
  +   <dnn:imagecommandcolumn CommandName=\"Delete\" ImageUrl=\"~/images/delete.gif\"\
  \ KeyField=\"ItemID\" />\n+   ```\n-   4. 下一步是修改 Page_Init 例程，以便在填充 Datagrid 时将正确的导航\
  \ URL 放入其中。双击打开 ViewEmployee.ascx.vb 文件。\n\n\n\n\n### 工作原理...\n\nDNN 在后台做了大量工作来处理站点的导航（例如友好\
  \ URL 重写）。大多数导航都是自动处理的，但如果需要在模块中控制特定导航，可以使用带相应参数的 NavigateURL。\n\n5. 向下滚动到 Page_Init\
  \ 例程，并在“编辑”链接的代码之前添加以下代码。这里重要的部分是，我们传递了在清单中定义的、代表辅助视图控件的键值 AcmeEmployeeDisplay。\n\
  \n```vb\nIf imageColumn.CommandName = \"Delete\" Then\n    imageColumn.OnClickJS\
  \ = Localization.GetString(\"DeleteItem\")\nEnd If\n```\n\n```vb\n'Set the link\
  \ to the secondary view control using NavigateURL\nIf imageColumn.CommandName =\
  \ \"Display\" Then\n    Dim formatString As String = NavigateURL(TabId,\n      \
  \  \"AcmeEmployeeDisplay\", \"mid=\" & CStr(ModuleId), \"ItemId=KEYFIELD\")\n  \
  \  formatString = formatString.Replace(\"KEYFIELD\", \"{0}\")\n    imageColumn.NavigateURLFormatString\
  \ = formatString\nEnd If\n```\n\n```vb\n'Manage Edit Column NavigateURLFormatString\n\
  If imageColumn.CommandName = \"Edit\" Then\n```\n\n6. 重新生成并重新部署模块。\n\n7. 转到包含 Employee\
  \ 模块的页面。当员工显示在 Datagrid 中时，你会看到一个全新的视图图标（看起来像放大镜）：\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_375_0.png)\n\
  \n8. 点击员工旁边的视图图标后，你将导航到辅助视图控件并查看显示的员工信息。在本示例中，我们加入了标准 DNN 图片中的示例图片，以展示员工详情控件的外观：\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_375_1.png)\n\n## 显示模块消息和事件日志\n\n在开发 DNN\
  \ 模块时，很多时候需要在页面上显示消息或将消息记录到事件日志中，以便后续分析。在本操作指南中，我们将了解如何使用 AddModuleMessage 和 AddLog\
  \ 方法。\n\nAddModuleMessage 是 DotNetNuke.UI.Skins.Skin 命名空间中的一个方法，适用于你想在页面上显示的简单消息。你可以使用四种消息类型来突出显示消息：\n\
  \n- `BlueInfo`：当你需要告知用户某事已发生，但该操作不是成功或失败类型时，使用此类型比较合适。\n- `GreenSuccess`：当用户执行了某个操作，而你想让其注意操作成功时，使用此类型比较合适。如果在成功时使用消息，那么最好在失败时也使用消息。\n\
  - `YellowWarning`：当操作未完全成功但也不确定是否失败时，此类型很有用。\n- `RedError`：适度使用效果最佳。此类型适合严重错误，或用户在错误修复前无法继续进行操作的情况。\n\
  \nAddLog 位于 DotNetNuke.Services.Log.EventLog 命名空间中，用于将消息写入站点事件日志。当你需要记录某个事件已发生但不想向用户显示消息时，它非常有用。这对于调试线上站点非常有用。请注意，门户管理员可以关闭日志记录，因此要遵循本操作指南，你需要确保日志记录已开启。\n\
  \n### 准备工作\n\n要按本操作指南操作，你必须先完成*第 6 章，数据输入技巧：*中的以下操作指南：\n\n- *显示带筛选控件的 Datagrid*\n\
  \n### 操作步骤...\n\n1. 首先启动开发工具并加载 Employee 项目。\n2. 双击打开 EditEmployee.ascx.vb 文件。\n\
  3. 向下滚动到 Page_Load 例程。我们将紧接在加载所选员工记录的代码之后添加一些日志消息：\n\n```vb\nIf Not objEmployee\
  \ Is Nothing Then\n    txtEmpFirstName.Text = objEmployee.EmpFirstName\n    txtEmpLastName.Text\
  \ = objEmployee.EmpLastName\n    txtManagerNo.Text = objEmployee.ManagerNo\n   \
  \ txtHireDate.Text = objEmployee.HireDate\n    txtSalary.Text = objEmployee.Salary\n\
  \n    ' log the employee information\n    Dim objEventLog As New Services.Log.EventLog.EventLogController\n\
  \    objEventLog.AddLog(objEmployee, PortalSettings, UserId, UserInfo.Username,\
  \ _\n        Services.Log.EventLog.EventLogController.EventLogType.ADMIN_ALERT)\n\
  \n    ' print a success message on the page\n    UI.Skins.Skin.AddModuleMessage(Me,\
  \ \"Employee record successfully loaded.\", UI.Skins.Controls.ModuleMessage.ModuleMessageType.GreenSuccess)\n\
  ```\n\n4. 重新生成并重新部署模块。\n\n5. 转到包含 Employee 模块的页面，选择要编辑的员工。当员工记录显示时，你会看到页面顶部出现一条新的成功消息。因为我们选择了\
  \ GreenSuccess 作为消息类型，所以显示了绿色大图标：\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_377_0.png)\n\
  \n6. 若要查看我们创建的另一条日志消息，请从 **管理** 菜单中选择 **事件查看器**：\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_378_0.png)\n\
  \n### 工作原理...\n\nAddLog 例程经过重载，可以接受不同的参数。在本例中，我们将员工对象作为日志消息的一部分传入。当我们想查看整个对象的状态时，这对调试非常有用。AddLog\
  \ 会自动将给定对象中的值转换为 XML 字符串，并显示在事件日志中。\n\n### 更多内容...\n\n使用 `EventLogController` 时，可以记录的事件类型有很多。在日志查看器中，这些事件以颜色编码区分，并且你可以按类型筛选消息。在本操作指南中，我们使用\
  \ `ADMIN_ALERT` 作为事件类型记录了消息，但还有很多其他事件类型可以使用。以下是一些示例：\n\n- `ADMIN_ALERT`\n- `HOST_ALERT`\n\
  - `APPLICATION_START`\n- `APPLICATION_END`\n- `USER_CREATED`\n- `PORTAL_CREATED`\n\
  - `MODULE_CREATED`\n- `TAB_CREATED`\n- `LOGIN_SUCCESS`\n- `LOGIN_FAILURE`\n\n##\
  \ 创建你自己的 CBO Hydrator\n\nDNN 包含一个有用的核心服务，称为 CBO Hydrator。CBO Hydrator 是一系列方法的集合，用于从数据库填充一个或多个自定义业务对象（CBO）。在前面的操作指南中，我们已经看到了\
  \ CBO EmployeeInfo 如何从数据库提取记录，并使用 CBO Hydrator 填充 Datagrid。\n\n作为 DNN 开发人员，你可以通过实现\
  \ IHydratable 接口来编写自己的 Hydrator。实现 IHydratable 更高效，而且你还可以选择根据模块中的任何特殊情况进行自定义，包括在将数据传递到表示层之前对数据进行“整理”，或者根据用户的安全权限过滤结果。\n\
  \n在本操作指南中，我们将使用示例 Employee 项目来演示实现 IHydratable 接口所需的两个部分：一个名为 KeyID 的属性和一个名为 Fill\
  \ 的方法。\n\n### 准备工作\n\n要按本操作指南操作，你必须先完成第 6 章，数据输入技巧中的以下操作指南：\n\n- *显示带筛选控件的 Datagrid*\n\
  \n### 操作步骤...\n\n1. 首先启动开发工具并加载 Employee 项目。\n2. 双击打开 EmployeeInfo.vb 文件。\n3. 查看文件顶部，并添加以下\
  \ Implements 语句：\n\n```vb\nPublic Class EmployeeInfo\n    Implements Entities.Modules.IHydratable\n\
  \n    ' local property declarations\n```\n\n4. 接下来，向下滚动到文件底部，紧接最后一个属性之后，添加以下新的 Optional\
  \ Interfaces 区域和 Fill 例程：\n\n```vb\n#Region \"Optional Interfaces\"\n\nPublic Sub\
  \ Fill(ByVal dr As IDataReader) Implements DotNetNuke.Entities.Modules.IHydratable.Fill\n\
  \n    ItemId = Convert.ToInt32(Null.SetNull(dr.Item(\"ItemID\"), ItemId))\n    ModuleId\
  \ = Convert.ToInt32(Null.SetNull(dr.Item(\"ModuleID\"), ModuleId))\n    EmpFirstName\
  \ = Convert.ToString(Null.SetNull(dr.Item(\"EmpFirstName\"), EmpFirstName) + \"\
  \ (first)\")\n    EmpLastName = Convert.ToString(Null.SetNull(dr.Item(\"EmpLastName\"\
  ), EmpLastName) + \" (last)\")\n    ManagerNo = Convert.ToInt32(Null.SetNull(dr.Item(\"\
  ManagerNo\"), ManagerNo))\n    HireDate = Convert.ToDateTime(Null.SetNull(dr.Item(\"\
  HireDate\"), HireDate))\n    Salary = Convert.ToInt32(Null.SetNull(dr.Item(\"Salary\"\
  ), Salary))\n\nEnd Sub\n```\n\n5. 注意，我们如何通过对名字和姓氏字段添加简短的文本后缀 (first) 和 (last) 来对数据进行一些自定义。\n\
  \n6. 最后，我们需要在 Fill 例程之后提供一个 KeyID 属性：\n\n```vb\nPublic Property KeyID() As Integer\
  \ Implements DotNetNuke.Entities.Modules.IHydratable.KeyID\n    Get\n        Return\
  \ ItemId\n    End Get\n    Set(ByVal value As Integer)\n        ItemId = value\n\
  \    End Set\nEnd Property\n\n#End Region\n```\n\n7. 这就是我们需要做的全部工作。无需其他代码更改，切换到新的\
  \ Fill 例程是自动的。\n\n8. 为了证明它可以正常工作，请重新生成并重新部署模块。\n\n\n\n\n9. 转到带有 Employee 模块的页面，看看网格中现在如何显示\
  \ (first) 和 (last) 后缀。这样我们就知道 DNN 已自动切换到我们自定义的 IHydrator 代码：\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_381_0.png)\n\
  \n## 将 Active Directory 与 DNN 结合使用\n\n正如我们在第 2 章“管理用户和网站设置”中所看到的，DNN 带有内置的用户安全机制，包含角色和授权。这在许多情况下都没问题，但有时你的\
  \ DNN 站点位于一个已经拥有 Active Directory（AD）安全的网络中。你如何配置 DNN 门户以使用现有的安全机制，而不必重新创建所有 AD\
  \ 用户？\n\n答案是添加 Active Directory 身份验证提供程序，使其与 DNN 安全提供程序一起工作。这样，您就可以使用在 DNN 或 Active\
  \ Directory 中定义的用户名登录。\n\n在本节中，我们将了解如何配置 DNN 门户，使其在使用默认 DNN 身份验证的同时，也使用 Active Directory\
  \ 身份验证。\n\n## 准备工作\n\n要按照本节操作，你需要能够访问使用 Active Directory 的网络，并拥有有效的用户名和密码。请注意，在某些网络上，对\
  \ Active Directory 的访问可能会受到限制。如果你在使用本节时遇到问题，请咨询网络管理员。\n\n## 操作步骤...\n\n- 1. 首先以\
  \ **超级用户** 身份登录。\n- 2. 从“主机”菜单中选择 **扩展**。\n- 3. 向下滚动到 **身份验证系统** 部分。\n\n| 身份验证系统\
  \ | | |\n|---|---|---|\n| 默认身份验证 | DotNetNuke 的默认用户名/密码身份验证系统。 | 1.0.0 |\n| DNN_ActiveDirectoryAuthentication\
  \ | DotNetNuke Active Directory 身份验证项目是 DotNetNuke 的一个身份验证提供程序，它使用 Windows Active\
  \ Directory 身份验证协议来验证用户身份。 | 5.0.2 |\n| DNN_LiveIDAuthentication | DotNetNuke LiveID\
  \ 身份验证项目是 DotNetNuke 的一个身份验证提供程序，它使用 LiveID 身份验证协议来验证用户身份。 | 1.0.1 |\n| DNN_OpenIDAuthentication\
  \ | DotNetNuke OpenID 身份验证项目是 DotNetNuke 的一个身份验证提供程序，它使用 OpenID 身份验证协议来验证用户身份。 |\
  \ 2.0.0 |\n\n- 4. 你应该会看到 Active Directory 已列出。如果没有，请从操作菜单中选择 **安装可用扩展** 并安装它。\n\
  - 5. 确认 Active Directory 身份验证已安装后，从 **管理** 菜单中选择 **扩展**。\n- 6. 向下滚动到身份验证系统列表，点击\
  \ **DNN_ActiveDirectoryAuthentication** 旁边的编辑图标。这将显示 **身份验证设置** 页面。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_383_0.png)\n\
  \n- 7. 提供以下信息：\n\n  - **启用？**：选中（表示门户将使用 AD）\n  - **隐藏登录控件？**：未选中（不隐藏 Windows 登录按钮）\n\
  \  - **同步角色？**：未选中（不将 DNN 角色与 AD 角色同步）\n  - **不自动创建用户？**：未选中（允许现有的 AD 用户使用门户）\n\
  \  - **提供程序**：保留默认的 **ADSAuthenticationProvider**\n  - **身份验证类型**：保留默认的 **委托**\n\
  \  - **根域**：如果你知道网络中的根域，请使用它，否则留空\n  - **用户名**：为你的 Windows 网络提供一个可以访问 Active Directory\
  \ 的有效用户名\n  - **密码**：为该用户提供有效密码\n\n## 高级模块与安全性\n\n- **电子邮件域：**留空（如果 AD 不可用，则指定 **电子邮件域**）\n\
  - **默认域：**提供用户的默认域（如果留空，用户需要在登录时指定，例如 `MYDOMAIN\\\\jsmith`）\n- **自动登录 IP 地址：**留空（可选：根据\
  \ IP 地址启用自动登录）\n\n- 8. 点击 **更新身份验证设置** 以保存更改。稍等片刻后，你应该会看到一条成功消息。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_384_0.png)\n\
  \n- 9. 如果你没有看到成功消息，请确认你提供了有效的域、有效的用户名和密码，并且你的网络上 Active Directory 可用。\n- 10. 点击\
  \ **取消** 以关闭配置页面。\n- 11. 要测试结果，请以超级用户身份注销。\n- 12. Windows 现在将尝试让你重新登录门户。如果一切顺利，系统将提示你输入\
  \ Active Directory 用户名和密码，然后显示 DNN 主页。\n\n## 工作原理...\n\n一旦登录，你的用户就可以自由进出而无需再次登录，直到安全\
  \ cookie 超时（或他们使用注销链接），之后他们将需要通过登录页面再次提供用户名和密码。\n\n## 更多内容...\n\n如果 DNN 安装在较旧版本的\
  \ Windows（Vista/Windows 7 之前）上，你可能会遇到错误：“处理 Windows 身份验证时出错。请检查你的 IIS 设置。DesktopModules/AuthenticationServices/ActiveDirectory/WindowsSignin.aspx\
  \ 不应允许匿名访问。”在这种情况下，请参阅下一节以了解修复此问题或回滚并禁用 Active Directory 安全的说明。\n\n## 另请参阅\n\n在本节中，我们启用了\
  \ Active Directory 身份验证，使 AD 用户无需在 DNN 中预先存在即可访问你的 DNN 门户。在下一节中，我们将了解如何同步 Active\
  \ Directory 和 DNN 之间的安全角色，以便你可以向 Active Directory 角色授予对页面和模块的访问权限。\n\n## 使用 DNN\
  \ 同步安全角色\n\n一旦你将 Active Directory 用于 DNN 安全性，下一步就是将你的 AD 安全角色（或组）与 DNN 同步，以便你可以基于角色而不仅仅是用户名来控制对页面和模块的访问。\n\
  \n这不会自动创建安全角色（你必须手动创建）；相反，它会同步用户拥有的角色。因此，如果你在 AD 中撤销一个角色，用户也会自动在 DNN 中失去该角色。\n\n\
  在本节中，我们假设你的 Active Directory 中有一个名为 Users 的安全角色。在 DNN 中重新创建角色时，确保其拼写与 Active Directory\
  \ 中显示的完全相同，这一点很重要。\n\n## 准备工作\n\n要按照本节操作，你必须先完成以下小节：\n\n- *创建和分配安全角色。*\n- *授予模块访问权限*\n\
  - *将 Active Directory 与 DNN 结合使用*\n\n## 高级模块与安全性\n\n## 操作步骤...\n\n- 1. 首先以门户管理员身份登录。\n\
  - 2. 在“管理”菜单下查看，选择 **安全角色**。\n- 3. 此页面将显示你当前拥有的所有安全角色。使用 **添加新角色** 链接创建一个名为 **Users**\
  \ 的新角色。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_386_0.png)\n\n- 4. 既然我们已经在 Active\
  \ Directory 和 DNN 中都定义了角色，我们需要开启角色同步。从 **管理** 菜单中选择 **扩展**。\n- 5. 向下滚动到身份验证系统列表，点击\
  \ **DNN_ActiveDirectoryAuthentication** 旁边的编辑图标。这将显示配置页面。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_386_1.png)\n\
  \n- 6. 找到名为 **同步角色** 的复选框，确保其已 **选中**。\n- 7. 点击 **更新身份验证设置** 以保存更改。稍等片刻后，你应该会看到一条成功消息。\n\
  - 8. 最后，在门户中选择一个匿名用户（未登录的用户）无法看到的模块。使用“*授予模块访问权限*”一节中的说明，将对该模块的读取访问权限授予你上面创建的 Users\
  \ 角色。由于你没有将 Users 角色授予任何人，用户能看到此模块的唯一方式就是同步生效。\n- 9. 授予角色访问权限后，使用“注销”链接，以管理员身份注销。\n\
  - 10. 刷新浏览器，你现在将使用你的 Active Directory 凭据登录。你应该能够成功登录 DNN 门户，并看到授予 Users 角色的模块。\n\
  \n\n\n\n\n## 工作原理...\n\n通过将 Active Directory 身份验证配置为保持角色同步，在 Active Directory 中执行的授予和撤销操作将自动应用于匹配的\
  \ DNN 角色。\n\n## 纠正 Active Directory 问题\n\n在 DNN 中更改安全提供程序有一定风险，因为如果出现问题，您可能会被锁定在站点之外。在本节中，我们将了解如何修复常见的访问问题，以及如何在需要重新开始时回滚\
  \ Active Directory 提供程序。\n\n## 准备工作\n\n要遵循本节内容，您必须已完成以下教程：\n\n- *将 Active Directory\
  \ 与 DNN 结合使用*\n\n## 操作步骤...\n\n1. 如果在 DNN 中设置 Active Directory 安全性时遇到错误 `WindowsSignin.aspx`\
  \ 不应允许匿名访问，您需要按如下方式手动调整 `WindowsSignin.aspx` 文件的安全性：\n2. 在 Web 服务器上，打开 IIS 管理器并展开\
  \ `DesktopModules/AuthenticationServices/ActiveDirectory` 文件夹，直到看到列出的 `WindowsSignin.aspx`。\n\
  3. 右键单击 `WindowsSignin.aspx` 并选择**属性**。\n4. 在**文件安全**选项卡上，应有一个名为**匿名访问和身份验证控制**的部分。\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_387_0.png)\n\n5. 单击**编辑**按钮，然后取消选中“匿名访问”。\n\
  6. 单击**确定**关闭对话框，然后再次单击**确定**关闭属性。\n\n## 高级模块与安全\n\n7. 重新启动浏览器，错误应该会消失。\n\n8. 如果无法让\
  \ Active Directory 安全与您的 DNN 门户配合工作，并且发现无法以超级用户身份重新登录门户，则可以按照以下步骤禁用 Active Directory\
  \ 安全性并恢复 DNN 安全性：\n\n9. 使用开发工具连接到数据库。\n\n10. 找到名为 **PortalSettings** 的表。打开该表，查找\
  \ `PortalId` 为 0 的 `AD_WindowsAuthentication` 记录。\n\n11. 将该值更改为 False。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_388_0.png)\n\
  \n12. 关闭表，然后关闭并重新打开浏览器。门户将恢复为正常的 DNN 安全性，您可以作为管理员登录。\n"
- "## 高级皮肤设计\n\n- 使用 Rotator 部件\n- 使用 Visibility 部件\n- 使用 Stylesheet 部件\n- 创建并部署自定义部件\n\
  - 在皮肤中使用自定义部件\n- 使用圆角超级样式表\n- 在皮肤中显示门户设置\n- 为菜单添加动画\n\n### 简介\n\n在本章中，我们将更深入地探讨在*第\
  \ 8 章，基础皮肤设计*中探讨过的皮肤设计主题。我们将看到几个皮肤部件的示例、如何为菜单添加动画、超级样式表，以及在皮肤中使用变量。\n\n到目前为止，我们所见的大多数教程都是由\
  \ DNN 服务器上运行的代码（模块等）驱动的。皮肤部件是一种创建驻留在皮肤中的客户端代码的方式，以提供本地功能，而无需反复与服务器通信。\n\n部件包含可以放置在皮肤中并在客户端运行的\
  \ JavaScript 片段。它们与我们在*第 8 章，基础皮肤设计*中演示的皮肤对象非常相似，但具有更多功能，并且可以自定义以包含我们自己的 JavaScript。要使用部件，您需要在皮肤中通过\
  \ HTML 对象元素引用该项，并使用 PARAMS 指定配置选项。\n\nDNN 包含几个有用的部件，位于 DNN 服务器上的 `\\Resources\\\
  Widgets` 文件夹中，在本章中我们将探讨其中一些，并了解如何制作我们自己的部件。\n\n### 使用 Rotator 部件\n\n在本节中，我们将了解如何使用\
  \ Rotator 皮肤部件，它会自动在一张接一张的不同图形图像之间轮换。这对于动态横幅广告或照片幻灯片等内容非常有用。\n\nRotator 部件带有不同选项，用于控制图像如何切换以及显示多长时间。要使用\
  \ Rotator 部件，我们需要一组要轮换的图像。对于此示例，我们将使用普通 DNN 安装附带的一些标准供应商图像。\n\nRotator 使用索引变量来跟踪轮换，因此图像文件名中必须包含数字，例如\
  \ `image1.gif`、`image2.gif`、`image3.gif`。\n\n### 准备工作\n\n要遵循本节内容，您必须已完成*第 8 章，基础皮肤设计*中的以下教程：\n\
  \n- 创建简单的 ASCX 皮肤\n\nRotator 部件可用的参数如下：\n\n| 参数 | 描述 | 示例 |\n|---|---|---|\n| `Direction`\
  \ | 过渡期间图像移动的方向。 | 左侧、右侧、向上、向下或混合 |\n| `Height` | 图像的高度。 | 120 |\n| `Width` | 图像的宽度。\
  \ | 60 |\n| `ImageCount` | 轮换中图像的数量。 | 6 |\n| `ImageTemplate` | 指定要使用的所有图像文件的名称。\
  \ | `vendor{INDEX}.gif` |\n| `ImageURL` | 图像文件夹的位置。 | `<%=SkinPath %>images/` |\n\
  | `Interval` | 显示每张图像后到显示下一张图像前的毫秒数。每秒有 1000 毫秒，因此 2500 表示每张图像显示两秒半后切换到下一张。 | 2500\
  \ |\n| `Transition` | 过渡样式。像照片幻灯片一样，您可以让每张图像轻轻滑入或突然切入。 | 滑动或切入 |\n\n## 操作步骤...\n\
  \n1. 找到在*创建简单的 ASCX 皮肤*教程中创建的 `SampleASCXSkin` 文件夹。\n2. 在其中创建一个名为 `/images` 的新文件夹。\n\
  3. 从 DNN 安装中，从 `\\dotnetnuke\\Portals\\0` 文件夹中取任意六张示例供应商图像，并将它们复制到 `/images` 文件夹中。\n\
  4. 将图像文件重命名为 `vendor1.gif`、`vendor2.gif`，一直到 `vendor6.gif`。此时，`/images` 文件夹应包含以下图像：\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_391_0.png)\n\n5. 现在启动开发工具。\n6. 从**文件**菜单中选择**打开文件...**。\n\
  7. 浏览到 `SampleASCXSkin` 文件夹，打开 `SampleASCXSkin.ascx` 文件。\n8. 向下滚动到包含不同窗格的 HTML 表格，并将以下代码添加到“左侧窗格”：\n\
  \n```\n```html\n<div class=\"content\">\n    <table width=\"100%\" border=\"0\"\
  \ cellspacing=\"0\" cellpadding=\"0\">\n        <tr>\n            <td valign=\"\
  top\" id=\"LeftPane\" class=\"LeftPane\"\n                runat=\"server\" visible=\"\
  false\">\n\n                <object id=\"ContentRotator\" codeptype=\"dotnetnuke/client\"\
  \n                        codebase=\"RotatorWidget\" declare=\"declare\">\n    \
  \                <param name=\"imageCount\" value=\"6\" />\n                   \
  \ <param name=\"imageURL\" value=\"<%=SkinPath %>images/\" />\n                \
  \    <param name=\"imageTemplate\" value=\"vendor{INDEX}.gif\" />\n```\n```\n\n\
  ```\n<param name=\"width\" value=\"120\" />\n<param name=\"height\" value=\"60\"\
  \ />\n<param name=\"transition\" value=\"slide\" />\n<param name=\"direction\" value=\"\
  left\" />\n<param name=\"interval\" value=\"3000\" />\n</object>\n\n</td>\n<td valign=\"\
  top\" id=\"ContentPane\" class=\"ContentPane\" runat=\"server\" visible=\"false\"\
  >\n</td>\n<td valign=\"top\" id=\"RightPane\" class=\"RightPane\" runat=\"server\"\
  \ visible=\"false\">\n</td>\n</tr>\n</table>\n</div>\n```\n\n9. 由于我们希望将供应商图像包含在皮肤包中，我们需要更新清单，以便在重新部署皮肤时，图像将上传到服务器。\n\
  \n> Rotator 部件同样适用于位于门户特定文件夹中且不属于皮肤的图像。如果您使用的图像不属于您的皮肤，则无需将它们添加到清单中，可以跳过本教程的最后一部分。\n\
  \n10. 打开 SampleASCXSkin.dnn 文件。\n\n11. 向下滚动到 skinFiles 元素，并添加以下内容：\n\n```\n<skinFile>\n\
  <name>skin.css</name>\n</skinFile>\n<skinFile>\n<path>images</path>\n<name>vendor1.gif</name>\n\
  </skinFile>\n<skinFile>\n<path>images</path>\n<name>vendor2.gif</name>\n</skinFile>\n\
  <skinFile>\n<path>images</path>\n```\n\n\n<name>vendor3.gif</name>\n</skinFile>\n\
  <skinFile>\n    <path>images</path>\n    <name>vendor4.gif</name>\n</skinFile>\n\
  <skinFile>\n    <path>images</path>\n    <name>vendor5.gif</name>\n</skinFile>\n\
  <skinFile>\n    <path>images</path>\n    <name>vendor6.gif</name>\n</skinFile>\n\
  </skinFiles>\n\n+   12. 从**文件**菜单中选择**全部保存**以保存更改。\n+   13. 要查看新皮肤在网站上的效果，请以超级用户身份登录。\n\
  +   14. 按照*部署你的皮肤和容器*食谱中的说明，将皮肤从皮肤文件夹部署到 DNN 门户。确保在 ZIP 文件中包含新的 `/images` 文件夹。\n\
  +   15. 皮肤部署完成后，查看**管理**菜单并选择**皮肤**。\n+   16. 从**皮肤：**下拉列表中选择**SampleASCXSkin**，并点击**预览**链接。\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_393_0.png)\n\n17. 由于我们将 Rotator 控件放置在左侧窗格中，因此你会在页面左侧看到第一张图片。片刻之后，图片将随着旋转的开始而改变。我们选择了\
  \ `interval` 值为 `3000`，因此图片应每 3 秒更换一次。我们选择了 `slide` 作为过渡效果，`left` 作为方向，因此下一张图片应从右侧滑入到左侧。\n\
  \n## 更多内容...\n\n你可以尝试不同的参数值并查看结果。例如，将过渡效果改为 `snap`，图片会立即相互替换，而没有滑动动画；当图片较大时，使用更长的间隔会很有帮助。\n\
  \n## 另请参阅\n\n如果你仔细观察，会发现 ImageURL 中包含对 `<%=SkinPath %>` 变量的引用。要了解皮肤中可用的其他门户变量，请参阅本章末尾的*在皮肤中显示门户设置*食谱。\n\
  \n## 使用 Visibility 控件\n\n在本食谱中，我们将介绍 Visibility 皮肤控件。Visibility 控件会在你的皮肤上创建一个按钮，无需调用服务器即可动态切换\
  \ HTML 元素的可见性。\n\n> 由于我们在后台使用 JavaScript，目标元素必须可在文档对象模型（DOM）中访问。DOM 是一种在 HTML 表单中引用元素（如\
  \ DIV 元素）的简单方法。你可以在 http://www.w3.org/DOM/ 了解更多信息。\n\n为了演示该控件，我们将修改*创建一个简单的 ASCX\
  \ 皮肤*食谱中的示例 ASCX 皮肤，在 `DIV` 元素内添加 `BREADCRUMB` 和 `TEXT` 控件，然后重新部署皮肤以查看更改。\n\n##\
  \ 准备工作\n\n要继续本食谱，你必须已完成*第 8 章*《*基本皮肤制作*》中的以下食谱：\n\n-   ▸ *创建一个简单的 ASCX 皮肤*\n\n##\
  \ 操作步骤...\n\n-   1. 找到在*创建一个简单的 ASCX 皮肤*食谱中创建的名为 `SampleASCXSkin` 的文件夹。\n-   2.\
  \ 启动开发工具。\n-   3. 从**文件**菜单中选择**打开文件...**。\n-   4. 浏览到 `SampleASCXSkin` 文件夹并打开 `SampleASCXSkin.ascx`\
  \ 文件。\n\n5. 我们将在皮肤中添加 BREADCRUMB 和 TEXT 控件，因此首先在文件顶部添加以下注册：\n\n```\n<%@ Register\
  \ TagPrefix=\"dnn\" TagName=\"USER\"\n    Src=\"~/Admin/Skins/User.ascx\" %>\n<%@\
  \ Register TagPrefix=\"dnn\" TagName=\"LOGIN\"\n    Src=\"~/Admin/Skins/Login.ascx\"\
  \ %>\n<%@ Register TagPrefix=\"dnn\" TagName=\"TEXT\"\n    Src=\"~/Admin/Skins/Text.ascx\"\
  \ %>\n<%@ Register TagPrefix=\"dnn\" TagName=\"BREADCRUMB\"\n    Src=\"~/Admin/Skins/BreadCrumb.ascx\"\
  \ %>\n```\n\n6. 接下来，向下滚动到包含不同窗格的 HTML 表格，并将以下代码添加到 ContentPane 中：\n\n```\n<div class=\"\
  content\">\n<table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"\
  0\">\n    <tr>\n        <td valign=\"top\" id=\"LeftPane\" class=\"LeftPane\"\n\
  \            runat=\"server\" visible=\"false\">\n        </td>\n        <td valign=\"\
  top\" id=\"ContentPane\" class=\"ContentPane\"\n            runat=\"server\" visible=\"\
  false\">\n\n<object id=\"VisibiltyButton\" codetype=\"dotnetnuke/client\"\n    \
  \        codebase=\"VisibilityWidget\" declare=\"declare\">\n            <param\
  \ name=\"title\" value=\"Hide/Show Breadcrumbs\" />\n            <param name=\"\
  collapseClassName\" value=\"collapse_icon\" />\n            <param name=\"expandClassName\"\
  \ value=\"expand_icon\" />\n            <param name=\"targetElementID\" value=\"\
  testElement\" />\n        </object>\n\n        <div id=\"testElement\">\n      \
  \      <dnn:TEXT runat=\"server\" id=\"dnnTEXT\"\n                CssClass=\"breadcrumb_text\"\
  \ Text=\"You are here >\"\n                ResourceKey=\"Breadcrumb\" />&nbsp;<span>\n\
  \            <dnn:BREADCRUMB runat=\"server\" id=\"dnnBREADCRUMB\"\n           \
  \     CssClass=\"Breadcrumb\" RootLevel=\"0\"\n                Separator=\"&nbsp;&nbsp;\"\
  \ />\n        </div>\n\n        </td>\n        <td valign=\"top\" id=\"RightPane\"\
  \ class=\"RightPane\"\n            runat=\"server\" visible=\"false\">\n       \
  \ </td>\n    </tr>\n</table>\n</div>\n```\n\n-   7. 这就为我们提供了一个文本提示、一个面包屑导航和 Visibility\
  \ 控件。我们现在需要一个点击按钮。为了在按钮上显示隐藏/显示的图片，我们必须在 `skin.css` 文件中定义这些图片。打开 `skin.css` 文件。\n\
  \n-   8. 向下滚动，在**控件样式**之后添加以下样式元素：\n\n```\n/* Control Styles */\n#login_style  \
  \               {float: right; padding: 10px 17px 0px 10px;}\n\n/* Visibility widget\
  \ */\n\n.collapse_icon,\n.expand_icon\n{\n    width: 14px;\n    height: 14px;\n\
  \    float: right;\n    margin-top: 5px;\n    background-repeat: no-repeat;\n  \
  \  cursor: pointer;\n    border: 0;\n    background-color: Transparent;\n}\n\n.collapse_icon\n\
  {\n    background-image: url(\"/dotnetnuke/images/minus2.gif\");\n}\n\n.expand_icon\n\
  {\n    background-image: url(\"/dotnetnuke/images/plus2.gif\");\n}\n```\n\n-   9.\
  \ 这将创建一个小的图标按钮，它会显示一个加号或减号，并随可见性切换而变化。为简单起见，我们将使用 DNN 自带的一些图标。\n\n-   10. 最后，从**文件**菜单中选择**全部保存**以保存更改。\n\
  \n-   11. 要查看新皮肤在网站上的效果，请以超级用户身份登录。\n\n-   12. 按照*部署你的皮肤和容器*食谱中的说明，将皮肤从皮肤文件夹部署到\
  \ DNN 门户。\n\n-   13. 皮肤部署完成后，查看**管理**菜单并选择**皮肤**。\n\n14. 从**皮肤：**下拉列表中选择**SampleASCXSkin**，并点击预览链接。\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_397_0.png)\n\n15. 我们添加的面包屑导航旁边会出现一个小的减号图标。如果点击减号，面包屑导航将消失，并保留一个加号图标：\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_397_1.png)\n\n16. 点击加号图标将恢复面包屑导航。\n\n\
  ## 工作原理...\n\n这是一个方便的技巧，通过隐藏不需要始终可见的大元素来节省页面上的“空间”。由于该控件在客户端运行，因此它是一种非常快速高效的显示和隐藏\
  \ DOM 元素的方法。\n\n## 更多内容...\n\n在本例中，我们使用了一些常见的 DNN 加号和减号图标图片，但你可以自由创建自己的图片并将它们添加到皮肤中。只需更改\
  \ CSS 文件中的路径以指向你的图片，并将图片添加到皮肤清单中即可。\n\n## 使用 Stylesheet 控件\n\n正如 Rotator 控件可以在客户端动态循环显示一组图片一样，Stylesheet\
  \ 皮肤控件允许你动态切换皮肤的不同样式表。这是一个非常强大的工具，只需很少的编码即可在客户端更改 DNN 页面的整体外观。\n\n在本食谱中，我们将创建三个指定字体大小（小、中、大）的简单样式表，然后添加\
  \ Stylesheet 控件以在它们之间切换。\n\n## 准备工作\n\n要继续本食谱，你必须已完成*第 8 章，基本皮肤制作*中的以下食谱：\n\n- \
  \  - 创建一个简单的 ASCX 皮肤\n\n## 操作步骤...\n\n-   1. 找到在*创建一个简单的 ASCX 皮肤*食谱中创建的名为 `SampleASCXSkin`\
  \ 的文件夹。\n-   2. 在其中创建一个名为 `/css` 的新文件夹。\n-   3. 为了展示不同样式表之间的切换，我们需要创建三个新的 CSS 文件并将它们放入该文件夹。首先启动开发工具。\n\
  -   4. 然后从**文件**菜单中选择**新建文件...**。\n-   5. 在**新建文件**对话框中，选择**文本文件**并点击**打开**。\n-\
  \   6. 将以下代码放入文件中：\n\n```\n```css\n*\n{\n    font-size: 8pt;\n}\n```\n```\n\n- \
  \  7. 将文件保存为 `/css` 文件夹中的 `small_font.css`。\n-   8. 创建另一个文本文件并添加以下代码：\n\n```\n```css\n\
  *\n{\n    font-size: 14pt;\n}\n```\n```\n\n-   9. 将文件保存为 `/css` 文件夹中的 `med_font.css`。\n\
  -   10. 再创建一个文本文件并添加以下代码：\n\n```\n```css\n*\n{\n    font-size: 28pt;\n}\n```\n```\n\
  \n-   11. 将文件保存为 `/css` 文件夹中的 `large_font.css`。\n-   12. `/css` 文件夹现在应如下所示：\n\n\
  ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_398_0.png)\n\n\n+   13. 接下来，从**文件**菜单中选择**打开文件...**，然后打开`SampleASCXSkin.ascx`文件。\n\
  \n+   14. 向下滚动到包含不同窗格的HTML表格，并将以下代码添加到左侧窗格：\n\n```html\n<div class=\"content\">\n\
  \    <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n \
  \       <tr>\n            <td valign=\"top\" id=\"LeftPane\" class=\"LeftPane\"\n\
  \                runat=\"server\" visible=\"false\">\n\n                <object\
  \ id=\"TextSizeSelector\" codetype=\"dotnetnuke/client\"\n                    codebase=\"\
  StyleSheetWidget\" declare=\"declare\">\n                    <param name=\"baseUrl\"\
  \ value=\"<%= SkinPath %>css/\" />\n                    <param name=\"template\"\
  \ value=\"&lt; input type='button'\n                        title='{TEXT}' value='{TEXT}'\
  \ {ID} {CLASS} /&gt;\" />\n                    <param name=\"default\" value=\"\
  small_font\" />\n\n                    <param name=\"Small Font\" value=\"small_font\"\
  \ />\n                    <param name=\"Med Font\" value=\"med_font\" />\n     \
  \               <param name=\"Large Font\" value=\"large_font\" />\n           \
  \     </object>\n\n            </td>\n            <td valign=\"top\" id=\"ContentPane\"\
  \ class=\"ContentPane\"\n                runat=\"server\" visible=\"false\">\n \
  \           </td>\n            <td valign=\"top\" id=\"RightPane\" class=\"RightPane\"\
  \n                runat=\"server\" visible=\"false\">\n            </td>\n     \
  \   </tr>\n    </table>\n</div>\n```\n\n+   15. 由于我们希望将新的样式表作为皮肤包的一部分，因此需要更新清单，以便在重新部署皮肤时，CSS文件能够上传到服务器。\n\
  \n+   16. 打开`SampleASCXSkin.dnn`文件。\n\n+   17. 向下滚动到`skinFiles`元素，并添加以下内容：\n\n```xml\n\
  <skinFile>\n    <name>skin.css</name>\n</skinFile>\n<skinFile>\n    <path>css</path>\n\
  \    <name>small_font.css</name>\n</skinFile>\n```\n\n## 高级皮肤设计\n\n```xml\n<skinFile>\n\
  \    <path>css</path>\n    <name>med_font.css</name>\n</skinFile>\n<skinFile>\n\
  \    <path>css</path>\n    <name>large_font.css</name>\n</skinFile>\n</skinFiles>\n\
  ```\n\n+   18. 从**文件**菜单中选择**全部保存**以保存更改。\n+   19. 要查看新皮肤在网站上的显示效果，请以超级用户（SuperUser）身份登录。\n\
  +   20. 按照 _部署皮肤和容器_ 中的说明，将皮肤从皮肤文件夹部署到DNN门户。务必在ZIP文件中包含新的 `/css` 文件夹。\n+   21. 皮肤部署完成后，在**管理**菜单下选择**皮肤**。\n\
  +   22. 从**皮肤：**下拉列表中选择**SampleASCXSkin**，然后点击“预览”链接。\n+   23. 由于我们将样式表部件放在了左侧窗格中，您会看到出现了三个按钮。点击这些按钮将在我们创建的小、中、大字体样式表之间切换。这将使页面上的字体动态改变大小。\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_400_0.png)\n\n## 更多...\n\n在此示例中，我们使用了极其简单的样式表，除了更改字体大小之外没有做任何其他事情。但此部件的功能仅受限于您在样式表代码中的创造力。您可以尝试其他CSS元素和更多CSS文件，真正了解此部件的所有可能性。\n\
  \n## 另请参阅\n\n我们再次在皮肤中使用了`<%=SkinPath %>`变量。要了解皮肤中可用的其他门户变量，请参阅本章末尾的“在皮肤中显示门户设置”操作指南。\n\
  \n## 创建并部署自定义部件\n\n在之前的操作指南中，我们了解了如何使用DNN内置的各种皮肤部件来提供有趣且富有创意的客户端功能。在本操作指南中，我们将学习如何使用DNN自带的示例模板并添加我们自己的JavaScript来制作自定义皮肤部件。\n\
  \n自定义部件可以做很多事情。在本操作指南中，我们将演示一个简单的“淡出”部件，当您点击它时，它会淡出并消失。其工作原理是调整元素的透明度。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_401_0.png)\n\
  \n要使它工作，我们需要做三件事：\n\n+   1. 复制一个我们可以编辑的DNN部件模板。\n+   2. 编辑模板JavaScript文件并添加我们自己的点击处理程序。\n\
  +   3. 更新清单并部署皮肤。\n\n为了帮助我们初步了解自定义皮肤部件，DNN贴心地提供了一个完整的示例部件和JavaScript模板。我们只需修改按钮点击处理程序以触发功能即可。我们首先将示例部件模板从DNN安装目录复制到一个临时文件夹中。然后，我们将重命名这些文件并对其进行编辑以创建自定义部件。\n\
  \n## 准备工作\n\n要跟随本操作指南进行操作，您必须先完成第8章“基本皮肤设计”中的以下操作指南：\n\n+   ▸ 创建一个简单的ASCX皮肤\n\n\
  ## 操作步骤...\n\n+   1. 首先创建一个新文件夹，并将其命名为`ACME.SampleWidget`。\n+   2. 在DNN服务器上找到`\\\
  Resources\\Widgets\\User\\YourCompany`文件夹。\n+   3. 将此文件夹中的文件复制到新的`ACME.SampleWidget`文件夹中。\n\
  +   4. 将JavaScript文件`YourCompany.Widgets.SampleWidget.js`重命名为`ACME.Widgets.SampleWidget.js`。\n\
  +   5. 删除名为`/EmbedWidgetResources`的子文件夹，因为我们不会在本操作指南中使用它。\n+   6. 该文件夹现在应包含以下文件：\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_402_0.png)\n\n+   7. 启动开发工具。\n+   8.\
  \ 从**文件**菜单中选择**打开文件...**。\n+   9. 浏览到`ACME.SampleWidget`文件夹并打开`ACME.Widgets.SampleWidget.js`文件。\n\
  +   10. 我们需要做的第一件事是更改脚本中的文本“YourCompany”。您可以放置您实际的公司名称或缩写，而不是YourCompany。我们通过简单的查找和替换来完成此操作：在**编辑**菜单下，查看**查找和替换**，然后选择**快速替换**（或直接按`Ctrl+H`）。\n\
  +   11. 出现提示时：\n\n+   - **查找内容：** `YourCompany`\n+   - **替换为：** `ACME`\n+   - **查找范围：**\
  \ `当前文档`\n\n+   12. 点击**全部替换**。\n+   13. 要添加我们自己的自定义JavaScript，请向下滚动到模板脚本的底部，找到`ClickHandler`函数。我们需要添加一些代码，使得在点击链接时文本淡出：\n\
  \n```\nACME.Widgets.SampleWidget.ClickHandler = function(sender)\n{\n    var clickedObject\
  \ = sender.target;\n```\n\n```\n// perform a simple loop to increase the Opacity\n\
  \nvar i=0;\nfor (i=0;i<=100;i++)\n{\n    divFade.style.filter = \"Alpha(Opacity=\"\
  \ + i + \",style=3)\";\n}\n}\n```\n\n14. 代码不多，但足以展示JavaScript在部件中通过鼠标点击触发。\n\n15.\
  \ 最后，由于我们将皮肤作为扩展进行部署，还需要更新部件的清单。打开`SampleWidget.dnn`文件。\n\n16. 和之前一样，我们必须将文本“YourCompany”改为示例公司“ACME”。更改以下突出显示的行：\n\
  \n```\n<dotnetnuke type=\"Package\" version=\"5.0\">\n  <packages>\n    <package\
  \ name=\"ACME.SampleWidget\" type=\"Widget\" version=\"1.0.0\">\n      <friendlyName>Sample\
  \ Widget</friendlyName>\n      <description>The Sample Widget is a demonstration\
  \ widget for DotNetNuke.</description>\n      <owner>\n        <name>DotNetNuke</name>\n\
  \        <organization>DotNetNuke Corporation</organization>\n        <url>www.dotnetnuke.com</url>\n\
  \        <email>support@dotnetnuke.com</email>\n      </owner>\n      <license src=\"\
  license.txt\" />\n      <releaseNotes src=\"releasenotes.txt\" />\n      <components>\n\
  \        <component type=\"Widget\">\n          <widgetFiles>\n            <basePath>ACME</basePath>\n\
  \            <widgetFile>\n              <name>ACME.Widgets.SampleWidget.js</name>\n\
  \            </widgetFile>\n            <widgetFile>\n              <name>license.txt</name>\n\
  \            </widgetFile>\n```\n\n```xml\n<widgetFile>\n    <name>releasenotes.txt</name>\n\
  </widgetFile>\n</widgetFiles>\n</component>\n</components>\n</package>\n</packages>\n\
  </dotnetnuke>\n```\n\n+   17. 从**文件**菜单中选择**全部保存**以保存更改。\n+   \n+   18. 要部署该部件，请创建一个压缩ZIP文件，其中包含以下文件：\n\
  +      - `ACME.Widgets.SampleWidget.js`\n+      - `license.txt`\n+      - `releaseNotes.txt`\n\
  +      - `SampleWidget.dnn`\n+   \n+   19. 将ZIP文件保存为`SampleWidget.zip`。\n+   \n\
  +   20. 要部署该部件，请以超级用户身份登录。\n+   \n+   21. 从**宿主**菜单中，选择**扩展**，然后从操作菜单中选择**安装扩展向导**。\n\
  +   \n+   22. 出现提示时，浏览到`ACME.SampleWidget`文件夹并选择新的ZIP文件`SampleWidget.zip`。\n+  \
  \ \n+   23. 完成向导以安装扩展。它现在应该出现在您网站上已安装的部件列表中。\n+   \n+   24. 要查看新部件的实际效果，我们必须将其包含在皮肤中。下一个操作指南将描述在皮肤中使用该部件的步骤。\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_404_0.png)\n\n## 工作原理...\n\n部件功能是在JavaScript文件中编码实现的。在本示例中，我们将其保持得非常简单，但您可以根据自己的JavaScript技能，自由添加尽可能多的功能。\n\
  \n\n\n\n\n## 更多内容……\n\n> 要查看更多的皮肤控件示例及其工作原理，请下载并查看Extropy皮肤，可从www.codeplex.com获取（只需搜索“Extropy”）。\n\
  \n在本节中，我们创建了一个简单的自定义控件，并将其部署到DNN站点上，以便皮肤可以使用该控件。在下一节中，我们将看到如何在皮肤中使用自定义控件。\n\n##\
  \ 在皮肤中使用自定义控件\n\n一旦自定义皮肤控件被创建并安装到服务器上，它就会像DNN自带的控件一样可以使用。在本节中，我们将看到如何将上一节中创建的自定义皮肤控件与第8章“基本皮肤”中的SampleASCXSkin结合起来使用。\n\
  \n我们需要做三件事：\n\n1. 确保你已经完成了上一节，并更新了模板JavaScript。\n2. 将自定义控件添加到ASCX文件中。\n3. 部署皮肤并进行测试。\n\
  \n### 准备工作\n\n要跟随本节操作，你必须完成以下章节：\n\n- 创建一个简单的ASCX皮肤\n- 创建并部署自定义控件\n\n### 操作步骤……\n\
  \n1. 要在皮肤中使用ACME.SampleWidget控件，我们需要编辑“创建一个简单的ASCX皮肤”一节中的示例ASCX皮肤文件。首先找到名为SampleASCXSkin的文件夹。\n\
  2. 启动开发工具。\n3. 从“文件”菜单中选择“打开文件...”。\n4. 浏览到SampleASCXSkin文件夹，打开SampleASCXSkin.ascx文件。\n\
  \n11. 在左侧你会看到一个带有文本的小块。点击控件文本将导致DIV中的文本淡出：\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_407_0.png)\n\
  \n### 工作原理……\n\n这个自定义的ACME.SampleWidget通过一个简单的JavaScript点击处理程序使元素淡出，当点击包含示例文本的DIV元素时，它会动态修改该DIV的透明度。这足以演示自定义控件的工作方式，但更复杂的示例需要更多的JavaScript代码以及对JavaScript编程更深入的讨论。\n\
  \n> 创建自定义DNN控件本身就是一门艺术。你可以从Nik Kalyani的这篇优秀博客中了解更多关于制作自定义控件的内容：http://www.kalyani.com/2009/12/dotnetnuke-widgets-guide-part-1-of-4。\n\
  \n## 使用圆角超级样式表\n\n超级样式表是DNN 5版本中的一项新功能，通过最大化利用CSS来提供重用HTML布局的方法。在撰写本文时，有三个可用的超级样式表：Yahoo\
  \ YUI库、DNN布局样式表和圆角样式表。\n\n在本节中，我们将演示如何导入并使用圆角样式表，在皮肤内容周围创建一个图形框。\n\n为了实现盒子效果，我们首先使用一组自定义的边框图像，然后在皮肤中创建一组嵌套的DIV，最后使用DNN提供的`dnn-roundedcorners.css`文件将图像链接到DIV元素。这与第8章“基本皮肤”中的“使用图像设置容器样式”一节非常相似，但这次圆角样式表将使用CSS定位图像，而不是使用HTML表格。\n\
  \n### 准备工作\n\n要跟随本节操作，你必须完成第8章“基本皮肤”中的以下章节：\n\n- 创建一个简单的ASCX皮肤\n\n所有部分就位后，图形框将如下所示：\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_408_0.png)\n\n### 操作步骤……\n\n1. 找到“创建一个简单的ASCX皮肤”一节中创建的`SampleASCXSkin`文件夹。\n\
  2. 在其中创建一个新文件夹`\\images`，用于存放图像。\n3. 我们将使用一些图像来制作盒子的边框。在本示例中，我们将使用以下图像：\n\n- `box_e.png`：图形框的右侧\n\
  - `box_n.png`：图形框的顶部第一段\n- `box_ne.png`：图形框的右上角\n- `box_nw.png`：图形框的左上角\n- `box_s.png`：图形框的底部\n\
  - `box_se.png`：图形框的右下角\n- `box_sw.png`：图形框的左下角\n- `box_w.png`：图形框的左侧\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_409_0.png)\n\
  \n4. 将图像放入正确的文件夹后，启动开发工具。\n5. 从“文件”菜单中选择“打开文件...”，打开skin.css文件。\n6. 在文件顶部添加一条导入语句，引入DNN的roundedcorners.css文件。如果DNN运行在本地主机上，则代码为：\n\
  \n```\n@import url(\"http://localhost/dotnetnuke/resources/shared/stylesheets/dnn-roundedcorners.css\"\
  );\n```\n\n7. 在导入语句下方，添加以下代码，将图像链接到DNN的样式元素：\n\n```\n.RoundedCorners .N{background-image:\
  \ url(\"images/box_n.png\"); }\n.RoundedCorners .NE{background-image: url(\"images/box_ne.png\"\
  ); }\n.RoundedCorners .E{background-image: url(\"images/box_e.png\"); }\n.RoundedCorners\
  \ .SE{background-image: url(\"images/box_se.png\"); }\n.RoundedCorners .S{background-image:\
  \ url(\"images/box_s.png\"); }\n.RoundedCorners .SW{background-image: url(\"images/box_sw.png\"\
  ); }\n.RoundedCorners .W{background-image: url(\"images/box_w.png\"); }\n.RoundedCorners\
  \ .NW{background-image: url(\"images/box_nw.png\"); }\n/* 通用样式 */\n```\n\n8. 现在样式表已经设置好，下一步是修改控件。从“文件”菜单中选择“打开文件...”，打开SampleASCXSkin.ascx文件。\n\
  \n9. 向下滚动到包含各窗格的HTML表格，并将以下代码添加到左侧窗格中：\n\n```html\n<div class=\"content\">\n   \
  \ <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n    \
  \    <tr>\n            <td valign=\"top\" id=\"LeftPane\" class=\"LeftPane\"\n \
  \               runat=\"server\" visible=\"false\">\n            </td>\n       \
  \     <td valign=\"top\" id=\"ContentPane\" class=\"ContentPane\"\n            \
  \    runat=\"server\" visible=\"false\">\n\n                <div class=\"RoundedCorners\"\
  >\n                    <div class=\"W\">\n                        <div class=\"\
  E\">\n                            <div class=\"N\">\n                          \
  \      <div class=\"NW\">\n                                    <div class=\"NE\"\
  \ align=\"center\"\n                                         style=\"padding: 10px;\
  \ vertical-align: middle\">\n                                        你可以在皮肤中放置任意数量的内容，\n\
  \                                        RoundedCorners样式表会自动调整\n              \
  \                          图形框的大小以适配内容。即使你的内容需要换行，\n                           \
  \             图形框也会相应地调整大小。\n                                    </div>\n      \
  \                          </div>\n                            </div>\n        \
  \                    <div class=\"S\">\n                                <div class=\"\
  SW\">\n                                    <div class=\"SE\" align=\"center\">\n\
  \                                        [ 你可以在这里放置页脚内容 ]\n                    \
  \                </div>\n                                </div>\n              \
  \              </div>\n                        </div>\n                    </div>\n\
  \                </div>\n\n            </td>\n            <td valign=\"top\" id=\"\
  RightPane\" class=\"RightPane\"\n                runat=\"server\" visible=\"false\"\
  >\n            </td>\n        </tr>\n    </table>\n</div>\n```\n\n10. 最后一步是修改清单文件，在部署皮肤之前加入我们的图像。打开`SampleASCXSkin.dnn`文件。\n\
  \n11. 向下滚动到`SkinFiles`元素，并添加以下内容：\n\n```xml\n<SkinFile>\n    <name>skin.css</name>\n\
  </SkinFile>\n<SkinFile>\n    <path>images</path>\n    <name>box_n.png</name>\n</SkinFile>\n\
  <SkinFile>\n    <path>images</path>\n    <name>box_ne.png</name>\n</SkinFile>\n\
  <SkinFile>\n    <path>images</path>\n    <name>box_e.png</name>\n</SkinFile>\n<SkinFile>\n\
  \    <path>images</path>\n    <name>box_se.png</name>\n</SkinFile>\n<SkinFile>\n\
  \    <path>images</path>\n    <name>box_s.png</name>\n</SkinFile>\n<SkinFile>\n\
  \    <path>images</path>\n    <name>box_sw.png</name>\n</SkinFile>\n<SkinFile>\n\
  \    <path>images</path>\n    <name>box_w.png</name>\n</SkinFile>\n<SkinFile>\n\
  \    <path>images</path>\n    <name>box_nw.png</name>\n</SkinFile>\n</SkinFiles>\n\
  ```\n\n12. 从**文件**菜单中选择**保存全部**以保存更改。\n\n13. 要查看新皮肤在站点上的效果，请以超级用户身份登录。\n\n14. 按照“部署你的皮肤和容器”一节中的描述，将皮肤从皮肤文件夹部署到DNN门户。请务必在ZIP文件中包含新的`/images`文件夹。\n\
  \n\n\n\n\n## 高级换肤\n\n- 15. 皮肤部署完成后，在 **Admin** 菜单下查看并选择 **Skins**。\n- 16. 从 **Skins:**\
  \ 下拉列表中选择 **SampleACSXskin** 并点击 Preview 链接。\n- 17. 由于我们在 Content Pane 中放置了 DIV\
  \ 元素，包含内容的图形框将显示在页面的顶部：\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_412_0.png)\n\
  \n## 其工作原理...\n\n要使用圆角超样式表，我们做了三件事：首先将 DNN 圆角样式表导入皮肤 CSS 文件中。然后添加一些额外的规则来定义我们的自定义边框图像，然后添加一组嵌套的\
  \ DIV 元素来将我们的图像包裹在内容周围。\n\n## 在皮肤中显示门户设置\n\n正如我们在之前的一些食谱中所看到的，可以在我们的皮肤中引用一些 DNN\
  \ 变量。我们曾看到一个使用变量 SkinPath（<%= SkinPath %>）来检索当前皮肤路径的示例。但还有其他值可以在皮肤中访问，在本食谱中我们将看到如何在皮肤中访问门户设置变量。\n\
  \n下表显示了一些我们可以使用门户设置变量：\n\n| Variable | Description |\n|---|---|\n| `<%=PortalSettings.ActiveTab.TabName\
  \ %>` | 当前页面的名称。 |\n| `<%=PortalSettings.ActiveTab.TabID %>` | 当前页面的 ID。 |\n| `<%=\
  \ iif(Request.IsAuthenticated,\"Logged In\",\"Logged Out\") %>` | 显示登录状态。 |\n| `<%=PortalSettings.ActiveTab.Title\
  \ %>` | 当前页面的标题。 |\n| `<%= PortalSettings.PortalName %>` | 当前门户的名称。 |\n| `<%= PortalSettings.PortalId\
  \ %>` | 当前门户 ID（0、1、2 等）。 |\n| `<%= PortalSettings.AdministratorRoleName %>` | 管理员角色的名称。\
  \ |\n| `<%= PortalSettings.Email %>` | 门户管理员的电子邮件地址。 |\n| `<%= PortalSettings.FooterText\
  \ %>` | 页脚中显示的文本。 |\n| `<%= PortalSettings.HomeDirectory %>` | 当前门户的主目录。 |\n| `<%=\
  \ PortalSettings.Version %>` | 你的站点的 DNN 版本。 |\n| `<%= PortalSettings.UserInfo.DisplayName\
  \ %>` | 当前用户的显示名称。 |\n| `<%= PortalSettings.UserInfo.IsSuperUser %>` | 当前用户是否为 SuperUser（true/false）。\
  \ |\n\n为了演示门户设置变量，我们将在示例皮肤中添加一个状态框来显示一些当前门户设置。\n\n> 注：其中许多设置变量更易于（也更安全地）使用 Tokens（例如\
  \ [User:DisplayName]）在 Text 皮肤对象内部访问。请参阅 *第 8 章，基础换肤* 中的食谱 *Creating a simple HTML\
  \ skin* 以获取示例。\n\n## 准备工作\n\n要跟随本食谱，你必须已完成 *第 8 章，基础换肤* 中的以下食谱：\n\n- *Creating a\
  \ simple ASCX skin*\n\n## 如何操作...\n\n- 1. 找到在食谱 *Creating a simple ASCX skin* 中创建的名为\
  \ `SampleASCXSkin` 的文件夹。\n- 2. 启动 Development Tool。\n- 3. 从 **File** 菜单中选择 **Open\
  \ File...** 并打开 `SampleASCXSkin.ascx` 文件。\n- 4. 我们将添加一个小型 HTML 表格作为状态面板。将它放在 `LeftPane`\
  \ 中，使用以下代码：\n\n```html\n<div class=\"content\">\n    <table width=\"100%\" border=\"\
  0\" cellspacing=\"0\" cellpadding=\"0\">\n        <tr>\n            <td valign=\"\
  top\" id=\"LeftPane\" class=\"LeftPane\"\n                runat=\"server\" visible=\"\
  false\">\n```\n\n```\n<%= iif(Request.IsAuthenticated,\"Logged In\",\"Logged Out\"\
  ) %>\n</td>\n</tr>\n<tr>\n<td>\nCurrent Page:\n</td>\n<td>\n<%=PortalSettings.ActiveTab.TabName\
  \ %>\n</td>\n</tr>\n<tr>\n<td>\nUser:\n</td>\n<td>\n<%= PortalSettings.UserInfo.DisplayName\
  \ %>\n</td>\n</tr>\n<tr>\n<td>\nUser Email:\n</td>\n<td>\n<%= PortalSettings.UserInfo.Email\
  \ %>\n</td>\n</tr>\n<tr>\n<td>\nSuperUser?:\n</td>\n<td>\n<%= PortalSettings.UserInfo.IsSuperUser\
  \ %>\n</td>\n</tr>\n<tr>\n<td>\nFooter:\n</td>\n<td>\n```\n\n```\n<%= PortalSettings.FooterText\
  \ %>\n</td>\n</tr>\n</table>\n\n</td>\n<td valign=\"top\" id=\"ContentPane\" class=\"\
  ContentPane\" runat=\"server\" visible=\"false\">\n</td>\n<td valign=\"top\" id=\"\
  RightPane\" class=\"RightPane\" runat=\"server\" visible=\"false\">\n</td>\n</tr>\n\
  </table>\n</div>\n```\n\n- 5. 从 **File** 菜单中选择 **Save All** 以保存你的更改。\n- 6. 要查看新皮肤在我们站点上的外观，请以\
  \ SuperUser 身份登录。\n- 7. 从皮肤文件夹部署皮肤到 DNN 门户，如食谱 *Deploying your skins and containers*\
  \ 中所述。\n- 8. 皮肤部署完成后，在 **Admin** 菜单下查看并选择 **Skins**。\n- 9. 从 **Skins:** 下拉列表中选择\
  \ **SampleASCXSkin** 并点击 Preview 链接。\n- 10. 由于我们将 HTML 表格放在了 `LeftPane` 中，状态面板将出现在页面的左侧：\n\
  \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_416_0.png)\n\n## 其工作原理...\n\n此技术只能获取当前门户的信息。此外，`PortalSettings`\
  \ 是一个共享类，只能直接从皮肤访问，而不能从容器访问。\n\n## 如何操作...\n\n- 1. 找到在食谱 *Styling a menu with images*\
  \ 中创建的名为 ASCXMenuSkin 的文件夹。\n- 2. 启动 Development Tool。\n- 3. 从 **File** 菜单中选择 **Open\
  \ File...**。\n- 4. 浏览到 ASCXMenuSkin 文件夹并打开 ASCXMenuSkin.ascx 文件。\n- 5. 首先在文件顶部添加一个\
  \ register 指令：\n```\n<%@ Register TagPrefix=\"dnn\" Namespace=\"DotNetNuke.UI.Skins\"\
  \ Assembly=\"DotNetNuke\" %>\n```\n- 6. 然后，向下滚动一点直到看到 NAV 控件。要添加新的自定义属性，将 NAV 控件从此：\n\
  ```\n<div class=\"menu_style\">\n    <dnn:NAV runat=\"server\" id=\"dnnNAV\"\n \
  \           ProviderName=\"DNNMenuNavigationProvider\"\n            IndicateChildren=\"\
  false\"\n            ControlOrientation=\"Horizontal\"\n            CSSControl=\"\
  mainMenu\" />\n</div>\n```\n改为此：\n```\n<div class=\"menu_style\">\n    <dnn:NAV\
  \ runat=\"server\" id=\"dnnNAV\"\n            ProviderName=\"DNNMenuNavigationProvider\"\
  \n            IndicateChildren=\"false\"\n            ControlOrientation=\"Horizontal\"\
  \n            CSSControl=\"mainMenu\" mouseouthidedelay=\"100\">\n        <customattributes>\n\
  \            <dnn:customattribute value=\"Expand\" name=\"AnimationType\" />\n \
  \           <dnn:customattribute value=\"Sine\" name=\"EasingType\" />\n       \
  \     <dnn:customattribute value=\"In\" name=\"EasingDirection\" />\n          \
  \  <dnn:customattribute value=\"1\" name=\"AnimationLength\" />\n            <dnn:customattribute\
  \ value=\"10\" name=\"AnimationInterval\" />\n        </customattributes>\n    </dnn:NAV>\n\
  </div>\n```\n- 7. 这就是我们需要做的全部工作。通过添加菜单动画所需的自定义属性，皮肤就可以使用了。\n- 8. 要预览皮肤，首先以 SuperUser\
  \ 身份登录。\n- 9. 从皮肤文件夹部署皮肤到 DNN 门户，如 Deploying your skins and containers 食谱中所述。\n\
  - 10. 皮肤部署完成后，在 Admin 菜单下查看并选择 Skins。\n- 11. 从 Skins: 下拉列表中选择 ASCXMenuSkin 并点击 Preview\
  \ 链接。\n- 12. 菜单看起来与之前相同，但现在它们采用动画来轻轻滑开和关闭。你可以通过更改上述代码示例中 AnimationLength 的值来调整速度。值为\
  \ 1 时以正常速度移动，而值为 10 时会创建非常缓慢的菜单打开效果。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_419_0.png)\n\
  \n## 还有更多...\n\n你可以尝试可用的选项并观察菜单动画如何变化。例如，EasingType 可能是最有趣的选项。Sine 会创建流畅的菜单打开效果，Bounce\
  \ 会创建一种犹豫的扩展效果。Circ 提供更干净的“清脆”打开效果，而 Quad 则使动画更“柔和”。\n\n\n\n\n"
