  End If\n```\n\n16. 最后，当用户单击**更新（Update）**时，我们必须从窗体中获取这些值并将其保存到数据库。为此，我们需要更改 Update\
  \ 链接处理程序中的代码。当用户单击**编辑员工（Edit Employee）**窗体底部的 Update 链接时，会调用该链接处理程序。下面的代码会将用户输入的内容保存回数据库。我们需要做的是用我们的五个字段替换单个\
  \ Content 字段。首先向下滚动到 `cmdUpdate_Click` 过程。找到该行 Content 字段：\n\n```vbnet\nPrivate\
  \ Sub cmdUpdate_Click(ByVal sender As Object, ByVal e As EventArgs) Handles cmdUpdate.Click\n\
  \n    Try\n        Dim objEmployees As New EmployeeController\n\n        Dim objEmployee\
  \ As EmployeeInfo = New EmployeeInfo\n\n        objEmployee.ModuleId = ModuleId\n\
  \        objEmployee.ItemId = ItemId\n        objEmployee.EmpFirstName = txtContent.Text\n\
  \        objEmployee.CreatedByUser = Me.UserId\n```\n\n17. 用五行代码替换那一行，以获取我们的字段：\n\
