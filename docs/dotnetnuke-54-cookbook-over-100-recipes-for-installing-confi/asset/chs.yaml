  \n11. 接下来，双击打开新的 DisplayEmployee.ascx.vb 文件。\n\n12. 在此文件中，我们需要在 Page_Load 例程中添加代码，用所选员工的值来填充标签。将空的\
  \ Page_Load 例程替换为以下代码：\n\n```\nPrivate Sub Page_Load(ByVal sender As Object, ByVal\
  \ e As\nSystem.EventArgs) Handles MyBase.Load\nTry\n```\n\n```\n' Determine ItemId\
  \ of Employee to Update\nIf Not (Request.QueryString(\"ItemId\") Is Nothing) Then\n\
  \    ItemId = Int32.Parse(Request.QueryString(\"ItemId\"))\nEnd If\n\nIf Page.IsPostBack\
  \ = False Then\n    If Not Common.Utilities.Null.IsNull(ItemId) Then\n        '\
