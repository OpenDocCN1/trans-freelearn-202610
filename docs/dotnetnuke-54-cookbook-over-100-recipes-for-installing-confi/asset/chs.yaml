  \ 另存为...**。\n- 13. 浏览到 `SampleASCXSkin` 文件夹，并将文件保存为 `SampleASCXSkin.ascx`。\n- 14.\
  \ 要创建 CSS 文件，请从**文件**菜单中选择**新建文件...**。\n- 15. 在**新建文件**对话框中，选择**样式表**并单击**打开**。\n\
  - 16. 将文件内容替换为：\n\n```\n/* General Styles */\nbody                         {background:\
  \ #CCCCCC; height:\n100%; margin: 0px; padding: 0px;}\na, a:link, a:visited, a:active\
  \  {color: #800000; text-decoration:\nnone; font-family: Verdana, Arial, Helvetica,\
  \ sans-serif; font-\nweight: normal;}\n```\n\n```\na:hover {\n    color: #C00;\n\
