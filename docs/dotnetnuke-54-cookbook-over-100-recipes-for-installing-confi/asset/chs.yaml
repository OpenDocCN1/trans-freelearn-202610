  \n# 下载 DNN 5 源代码\n\n为了帮助我们为 DNN 开发自己的模块，我们可以下载源代码，以便我们的编译器可以访问随 DNN 5 提供的库。在本教程中，我们将下载压缩的\
  \ ZIP 文件并将其提取到项目的某个文件夹中。\n\n# 如何操作...\n\n+   1. 转到 `http://dotnetnuke.codeplex.com/`。\n\
  +   2. 点击页面顶部的 **Downloads** 选项卡。\n+   3. 向下滚动一点并点击标有 **Source Code (New Install\
  \ + Source Code)** 的按钮。\n+   4. 如果提示许可条款，点击 **I Agree**。\n+   5. 在提示 **Open** 或\
  \ **Save** 时，点击 **Save**。\n+   6. 选择一个临时文件夹来存放 ZIP 文件。\n+   7. 下载完成后，将文件提取到一个易于记住的文件夹中，例如\
  \ `My Documents\\DNNSource`。\n\n# 如何工作...\n\n这是一个可选教程。虽然您不需要源文件来运行 DNN 站点，也不是创建模块所必需的，但如果您想在调试时逐步查看\
  \ DNN 代码，它们很有用，并且能深入了解 DNN 的编写方式。\n\n# 另请参阅\n\n本教程中下载的文件在下一个教程 *Setting up a debugging\
  \ environment* 中使用。\n\n# 设置调试环境\n\n模块部署后，如何进行调试？如何逐步跟踪模块代码或设置断点？\n\n在本教程中，我们将配置开发工具，通过将\
  \ DNN 源代码和模块源代码组合为一个解决方案来创建强大的测试环境。然后我们可以设置断点并逐步查看模块和 DNN 代码。\n\n请注意，如果您已经使用本教程创建了测试环境，就不能再次运行教程来重建环境。如果需要重新安装开发环境，必须在再次使用本教程重新安装之前完全删除环境。\n\
  \n# 准备工作\n\n要跟随本教程，您必须已完成 *Chapter 4* 中的以下教程：\n\n+   ▸ *Installing Visual Web Developer\
  \ 2010 Express*\n+   ▸ *Downloading the DNN 5 source code*\n\n# 如何操作...\n\n+   1.\
  \ 首先找到您下载 DNN 源文件的文件夹（在这些示例中为 `My Documents\\DNNSource\\website`）。\n+   2. 找到文件\
  \ `release.config`。复制此文件并将其命名为 `web.config`。\n+   3. 现在启动您首选的开发工具（Visual Studio\
  \ 或 Visual Web Developer Express）。\n+   4. 从 **File** 菜单中选择 **Open Web Site....**\n\
  +   5. 在 **Open Web Site** 对话框中，选择 DNN 源文件夹（`My Documents\\DNNSource\\website`）并点击\
  \ **Open.**\n\n# 构建、调试和部署模块\n\n+   6. 网站加载后，通过查看 **Debug** 菜单并选择 **Start Without\
  \ Debugging**（或按 Ctrl+F5）来构建整个站点。\n+   \n+   7. 网站的所有源代码都将被编译，网站将在浏览器中启动。\n\n> 如果在构建时遇到错误，您可能需要添加额外的引用。例如，在\
  \ DNN 5.02 源代码中，在构建之前需要添加对 `\\Library\\Components\\Telerik\\Telerik.Web.UI.dll`\
