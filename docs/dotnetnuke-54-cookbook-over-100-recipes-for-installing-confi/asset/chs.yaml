  \n+   4. 当提示许可条款时，点击“我同意”。\n\n\n\n\n## 使用 Starter Kit 创建新模块\n\n在本教程中，我们将演示如何创建你的第一个\
  \ DNN 模块。我们将创建一个简单的模块，用于在 DNN 数据库中存储员工信息。\n\n## 准备工作\n\n要创建你的第一个 DNN 模块，你必须完成前面两个教程：\n\
  - 安装 Visual Web Developer 2010 Express\n- 安装 DNN 5 Starter Kit\n\n我们将使用 Visual Web\
  \ Developer，但该过程在 Visual Studio 中几乎相同。\n\n## 操作步骤...\n\n1. 启动你首选的开发工具（Visual Studio\
  \ 或 Visual Web Developer Express）。\n2. 在**文件**菜单下，选择**新建项目...**\n3. 在**新建项目**对话框中，在**我的模板**下查找，然后选择\
  \ **DotNetNuke Compiled Module** 作为模板。如果你在模板中没有看到 DotNetNuke，请参阅前面的教程 *安装 DNN 5\
  \ Starter Kit*。\n4. 为项目名称和**解决方案名称**键入 **Employee**。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_110_0.png)\n\
  \n5. 单击**确定**以创建项目。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_111_0.png)\n\n6.\
  \ 在开始之前，我们需要进行一个快速配置更改。屏幕右上角是**解决方案资源管理器**。找到标记为 **Employee** 的第一个图标，然后右键单击它以显示弹出菜单。\n\
  7. 从弹出菜单中选择**属性**。\n8. 清空名为**根命名空间**的字段。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_111_1.png)\n\
  \n9. 在**文件**菜单下，选择**全部保存**以保存更改。\n\n## 工作原理...\n\n选择一个好的模块名称非常重要。Starter Kit 会使用模块名称来创建过程和生成代码。要为模块选择名称，请确定模块最重要的功能是什么，并用一个单数单词来描述它。例如，*Employee*\
  \ 就是一个很好的名称，适合用于跟踪公司员工的模块。\n\n## 更多内容...\n\n在本示例中，我们保持简单，将模块命名为 **Employee**。在专业的开发环境中，更好的做法是将你的公司名称或缩写作为模块名称的前缀（例如\
  \ `YourCompany.Employee`）。这可以防止来自不同公司但恰好同名的两个模块之间发生冲突。\n\n## 另请参阅\n\n项目向导会创建模块所需的文件，但在项目部署到\
  \ DNN 站点之前，你必须编辑这些文件。请参阅本章中的其他教程，以创建表、存储过程和必要的代码更改。\n\n## 创建带有键的数据库表\n\n由于 DNN 是一个由数据库驱动的**内容管理系统（CMS）**，你的模块很可能会包含一个或多个数据库*表*。数据库表用于保存模块的信息。与电子表格类似，表由称为\
  \ `Fields` 的列和称为 `Records` 的行组成。由于我们正在创建一个名为 **Employee** 的模块，因此表中的字段将保存员工信息，例如名字和姓氏。表中的每条记录将保存一名员工。\n\
  \n数据库表比简单电子表格更强大的一个功能是，它能够自动验证记录中的信息。例如，表中的每条员工记录都有一个唯一值来标识该记录（称为 `Item ID`），这一点非常重要。数据库可以通过\
  \ `PRIMARY KEY`（主键）来强制执行该唯一值（之所以这样命名，是因为 `Item ID` 是员工记录最重要的键）。\n\n幸运的是，Starter\
  \ Kit 已经创建了用于创建 `Employee` 表和必要键的代码。在 Employee 项目中，你会找到一个名为 `01.00.00.SqlDataProvider`\
  \ 的脚本。该创建脚本在模块部署到 DNN 站点时运行，它负责创建模块所需的表、视图、键和存储过程。\n\n## 准备工作\n\n在本教程中，我们将修改创建脚本，以创建一个名为\
  \ Employee 的表以及必要的键。该脚本会在部署模块时创建表，你也可以直接将脚本内容复制并粘贴到数据库中，以便在开发时就能让表存在。\n\n要跟进本教程，你必须已完成之前的教程“使用\
  \ Starter Kit 创建新模块”。\n\n## 操作步骤...\n\n1. 首先，启动你首选的开发工具（Visual Studio 或 Visual Web\
  \ Developer Express）。\n2. 在屏幕左侧找到“最近项目”。单击 Employee 以加载项目。\n3. 在屏幕右侧的解决方案资源管理器中，双击\
  \ 01.00.00.SqlDataProvider。这将在编辑器中显示创建脚本。\n4. 在文件的最顶部，你会看到 CREATE TABLE 部分。Starter\
  \ Kit 向导已经创建了一条单独的 CREATE TABLE 语句，以及一个 PRIMARY KEY、一个索引和一个指向标准 DNN 模块表的外键。向导生成的脚本如下所示：\n\
  \n```\n/** Create Table **/\n\nif not exists (select * from dbo.sysobjects where\
  \ id = object_id(N'{databaseOwner} [{objectQualifier} YourCompany_Employee]') and\
  \ OBJECTPROPERTY(id, N'IsTable') = 1)\nBEGIN\n    CREATE TABLE\n        {databaseOwner}\
  \ [{objectQualifier}YourCompany_Employee]\n    (\n        [ModuleID] [int] NOT NULL,\n\
  \        [ItemID] [int] NOT NULL IDENTITY(1, 1),\n        [Content] [ntext] NOT\
  \ NULL,\n        [CreatedByUser] [int] NOT NULL,\n        [CreatedDate] [datetime]\
  \ NOT NULL\n    )\n\n    ALTER TABLE {databaseOwner}\n    [{objectQualifier}YourCompany_Employee]\n\
  \        ADD CONSTRAINT [PK_{objectQualifier}YourCompany_Employee] PRIMARY KEY CLUSTERED\
  \ ([ItemID])\n    CREATE NONCLUSTERED INDEX\n        [IX_{objectQualifier}YourCompany_Employee]\n\
  ```\n\n```\nON {databaseOwner}][{objectQualifier}\nYourCompany_Employee] ([ModuleID])\n\
  \nALTER TABLE {databaseOwner}\n  [{objectQualifier}YourCompany_Employee] WITH NOCHECK\
  \ ADD\nCONSTRAINT [FK_{objectQualifier}\nYourCompany_Employee_{objectQualifier}\
  \ Modules] FOREIGN\nKEY ([ModuleID]) REFERENCES {databaseOwner}\n  [{objectQualifier}Modules]\
  \ ([ModuleID]) ON DELETE CASCADE\nNOT FOR REPLICATION\nEND\nGO\n```\n\n5. 我们需要做的第一件事是更改脚本中的\
  \ YourCompany 文本。你可以将 YourCompany 替换为你实际的公司名称或其缩写。我们可以通过简单的查找和替换来完成——在编辑菜单下，查看“查找和替换”，然后选择“快速替换”（或直接按\
  \ Ctrl+H）。\n6. 出现提示时：\n   - 查找内容：YourCompany\n   - 替换为：ACME\n   - 范围：当前文档\n7. 单击“全部替换”。\n\
  8. 接下来，我们将所需的字段添加到表中。向导将 Content 作为单个字段。我们将用我们自己的字段名替换 Content。将单行 [Content] [ntext]\
  \ NOT NULL, 替换为以下六行：\n\n```\n[EmpFirstName] [nvarchar] (30) NOT NULL,\n[EmpLastName]\
  \ [nvarchar] (30) NOT NULL,\n[ManagerNo] [int] NULL,\n[HireDate] [datetime] NOT\
  \ NULL,\n[Salary] [float] NOT NULL,\n[DeptNo] [int] NOT NULL,\n```\n\n9. 我们的建表代码现在应该如下所示：\n\
  \n```\n/** Create Table **/\n\nif not exists (select * from dbo.sysobjects where\
  \ id =\nobject_id(N'{databaseOwner}][{objectQualifier}ACME_Employee]')\nand OBJECTPROPERTY\
  \ (id, N'IsTable') = 1)\nBEGIN\nCREATE TABLE {databaseOwner}][{objectQualifier}ACME_Employee]\n\
  (\n[ModuleID] [int] NOT NULL,\n[ItemID] [int] NOT NULL IDENTITY(1, 1),\n[EmpFirstName]\
  \ [nvarchar] (30) NOT NULL,\n```\n\n使用存储过程而不是直接在项目代码中编写 SQL，有几个原因。首先，存储过程通常性能更好；其次，与硬编码的\
  \ SQL 相比，代码更易于维护，并且我们能受益于更强的封装性。如果代码只处理数据库表和记录，那么将其保留在数据库中是有意义的。\n\n在本教程中，我们将演示如何修改向导生成的代码，以执行模块所需的实际添加、更新和删除操作。\n\
  \n## 准备工作\n\n要跟进本教程，你必须已完成以下之前的教程：\n- 使用 Starter Kit 创建新模块\n- 创建带有键的数据库表\n\n> 在本教程中，我们将再次查找并替换\
  \ YourCompany 短语的所有出现。如果你已经按照之前的教程操作，这一步已经完成，你可以直接跳到第 8 步。\n\n## 操作步骤...\n\n1. 首先，启动你首选的开发工具（Visual\
  \ Studio 或 Visual Web Developer Express）。\n2. 在屏幕左侧找到“最近项目”。单击 Employee 以加载项目。\n\
  3. 在屏幕右侧的解决方案资源管理器中，双击 01.00.00.SqlDataProvider。这将在编辑器中显示创建脚本。\n4. 向下滚动，越过脚本中的 CREATE\
  \ TABLE 部分，直到你看到“Drop Existing Stored Procedures”。\n\n```\n/** Drop Existing Stored\
  \ Procedures **/\n\nif exists (select * from dbo.sysobjects where id = object_id(N'{databaseOwner}\
  \ [{objectQualifier} YourCompany_GetEmployees]') and OBJECTPROPERTY (id, N'IsProcedure')\
  \ = 1)\n    drop procedure {databaseOwner} {objectQualifier} YourCompany_GetEmployees\n\
  GO\n\nif exists (select * from dbo.sysobjects where id = object_id(N'{databaseOwner}\
  \ [{objectQualifier} YourCompany_GetEmployee]') and OBJECTPROPERTY (id, N'IsProcedure')\
  \ = 1)\n```\n\n\n\n\n\n## 创建自己的模块\n\n+   15. 将第二部分改为：\n\n```\nvalues (\n    @ModuleId,\n\
  \    @EmpFirstName,\n    @EmpLastName,\n    @ManagerNo,\n    @HireDate,\n    @Salary,\n\
  \    @UserID,\n    getdate()\n)\n```\n\n+   16. 因此整个存储过程应为：\n\n```\ncreate procedure\
  \ {databaseOwner}{objectQualifier}\n                         ACME_AddEmployee\n\n\
  \    @ModuleId       int,\n    @EmpFirstName   nvarchar(30),\n    @EmpLastName \
  \   nvarchar(30),\n    @ManagerNo      int,\n    @HireDate       datetime,\n   \
  \ @Salary         float,\n    @UserID         int\n\nas\n\ninsert into {objectQualifier}_Employee\
  \ (\n    ModuleId,\n    EmpFirstName,\n    EmpLastName,\n    ManagerNo,\n    HireDate,\n\
  \    Salary,\n    CreatedByUser,\n    CreatedDate\n)\nvalues (\n    @ModuleId,\n\
  \    @EmpFirstName,\n    @EmpLastName,\n    @ManagerNo,\n    @HireDate,\n    @Salary,\n\
  \    @UserID,\n    getdate()\n```\n\n)\n\n```\nGO\n```\n\n17. 下一个存储过程 ACME_UpdateEmployee\
  \ 类似，因此我们有两个地方需要进行更改。将五个字段添加到存储过程的参数列表中，然后将五个字段添加到更新语句中。存储过程现在应如下所示：\n\n```\ncreate\
  \ procedure\n{databaseOwner}.{objectQualifier}ACME_UpdateEmployee\n\n@ModuleId \
  \         int,\n@ItemId            int,\n@EmpFirstName      nvarchar(30),\n@EmpLastName\
  \       nvarchar(30),\n@ManagerNo         int,\n@HireDate          datetime,\n@Salary\
  \            float,\n@UserID            int\n\nas\n\nupdate {objectQualifier}ACME_Employee\n\
  set    EmpFirstName   = @EmpFirstName,\n       EmpLastName    = @EmpLastName ,\n\
  \       ManagerNo      = @ManagerNo,\n       HireDate       = @HireDate,\n     \
  \  Salary         = @Salary,\n       CreatedByUser  = @UserID,\n       CreatedDate\
  \    = getdate()\nwhere  ModuleId = @ModuleId\nand    ItemId = @ItemId\n\nGO\n```\n\
  \n18. 最后的存储过程 ACME_DeleteEmployee 无需修改，因为它不引用任何字段。\n\n## 其工作原理...\n\nDNN 中的模块遵循\
  \ Microsoft 的 N-Tier 架构。这是一种将应用程序逻辑与业务和数据库逻辑分离的机制。在本教程中，我们构建了数据库层的存储过程。\n\n> 你可以从\
  \ David Chappell 和 Steve Kirk 的这篇优秀文章中了解更多关于 N-Tier 架构的信息，网址为 http://msdn.microsoft.com/en-us/library/ms978384.aspx。\n\
  \n## 还有更多...\n\n创建存储过程后，为新模块的最后一步是将其连接到数据库。教程《将模块连接到数据库》演示了如何创建支持数据库和业务逻辑层的过程。\n\
  \n## 将模块连接到数据库\n\n要将向导生成的代码连接到模块的数据库表，我们必须遍历项目代码并用我们的字段和数据类型替换名为 Content 的占位符。\n\
  \n## 准备工作\n\n要跟随本教程，你必须已完成以下先前的教程：\n\n-   - 使用 Starter Kit 创建新模块\n-   - 创建带键的数据库表\n\
  -   - 创建存储过程\n\n## 如何操作...\n\n-   1. 首先启动你喜欢的开发工具（Visual Studio 或 Visual Web Developer\
  \ Express）。\n-   2. 在屏幕左侧查找“最近的项目”。点击 Employee 以加载项目。\n-   3. 在屏幕右侧查看“解决方案资源管理器”，展开名为\
  \ Components 的文件夹并双击 DataProvider.vb。\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_123_0.png)\n\
  \n4. 滚动到文件底部并查找名为 Abstract methods 的代码区域。我们必须在这两个地方用实际的字段名替换占位符 Content。将代码改为：\n\
