    # Showing an e-mail link in an Datagrid


    As we have seen in the previous chapter, the Datagrid control is perfect for showing
    records from the database in a neatly formatted table. But the Datagrid can show
    many other types of information and in this recipe we will see how to display
    an e-mail hyperlink in a column.


    # Getting ready


    In this recipe, we will extend the Datagrid from the end of Chapter 6. To follow
    along you should successfully have completed and deployed the project Displaying
    a Datagrid with filter controls.


    > In this recipe we are using a function to generate an e-mail address for our
    example. This keeps the recipe simple, but isn''t really practical. In a real
    production environment you would store this in the database as part of the Employee
    table.'
  merge: -1
  img_proc: true
- pgno: 208
  md: "# How to do it...\n\n+   1. Launch the Development Tool and load the **Employee**\
    \ project.\n+   2. Double-click to open the ViewEmployee.ascx file.\n+   3. Locate\
    \ the Datagrid in the code and add a new column just after the **Salary** column:\n\
    +   4. Next, open the EmployeeInfo.vb file.\n+   5. Find the Public Properties\
    \ section and add the read-only property EmailAddress to provide an e-mail address\
