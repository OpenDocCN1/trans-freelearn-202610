  md: '# How to do it...


    +   1. Start by logging in as **SuperUser**.

    +   2. Select **Extensions** from the Host menu.

    +   3. Scroll down to **Authentication System** section.


    | Authentication System | | |

    |---|---|---|

    | Default Authentication | The Default UserName/Password Authentication System
    for DotNetNuke. | 1.0.0 |

    | DNN_ActiveDirectoryAuthentication | The DotNetNuke Active Directory Authentication
    Project is an Authentication provider for DotNetNuke that uses the Windows Active
    Directory authentication protocol to authenticate users. | 5.0.2 |

    | DNN_LiveIDAuthentication | The DotNetNuke LiveID Authentication Project is an
    Authentication provider for DotNetNuke that uses the LiveID authentication protocol
    to authenticate users. | 1.0.1 |

    | DNN_OpenIDAuthentication | The DotNetNuke OpenID Authentication Project is an
    Authentication provider for DotNetNuke that uses the OpenID authentication protocol
    to authenticate users. | 2.0.0 |


    +   4. You should see Active Directory listed. If not, select **Install Available
    Extensions** from the action menu and install it.

    +   5. Once you have confirmed Active Directory Authentication is installed, select
    **Extensions** from the **Admin** menu.

    +   6. Scroll down to the list of authentication systems and click on the edit
    icon next to **DNN_ActiveDirectoryAuthentication**. This will display the **Authentication
    Settings** page.'
