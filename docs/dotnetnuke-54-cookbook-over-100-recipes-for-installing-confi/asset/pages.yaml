  md: '# Creating a new module with the Starter Kit


    In this recipe we demonstrate how to create your first DNN module. We will create
    a simple module that stores Employee information in the DNN database.


    # Getting ready


    To create your first DNN module you must complete the two previous recipes:


    +   - Installing Visual Web Developer 2010 Express

    +   - Installing the DNN 5 Starter Kit


    We will use the Visual Web Developer, but the process is virtually identical in
    Visual Studio.


    # How to do it...


    +   1. Launch your preferred development tool (Visual Studio or Visual Web Developer
    Express).

    +   2. Under the **File** menu, select **New Project...**

    +   3. In the **New Project** dialog, look under **My Templates** and select **DotNetNuke
    Compiled Module** for the template. If you do not see DotNetNuke under your templates,
    see the previous recipe *Installing the DNN 5 Starter Kit*.

    +   4. Type **Employee** for the project name and **Solution name**.


