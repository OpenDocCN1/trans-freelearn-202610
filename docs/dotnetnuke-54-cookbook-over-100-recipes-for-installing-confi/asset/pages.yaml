- pgno: 173
  md: "# # Creating collapsible panels\n\nAnother useful control offered by DNN is\
    \ the `SectionHead` control that creates a collapsible panel on a data entry form.\
    \ This panel appears frequently in the DNN modules and is useful when you don't\
    \ want to waste space on the page with something the user won't always need.\n\
    \nIn this recipe we will create a collapsible panel that shows or hides an HTML\
    \ table containing sample text. In the recipes *Populating a drop-down list from\
    \ a DNN list* and *Populating a drop-down list from a stored procedure*, we will\
    \ replace the sample text with real controls to create a more practical example.\n\
    \n# ## Getting ready\n\nTo follow along with this recipe you must have completed\
    \ the following recipe:\n\n+   - *Creating a new module with the Starter Kit*\n\
    \n# ## How to do it...\n\n+   1. Start by launching the Development Tool and loading\
    \ the Employee project.\n+   2. Double-click to open the `ViewEmployee.ascx` file.\n\
    +   3. Look at the top of the file and find the register directives just before\
    \ the Datalist control:\n\n```\n```aspx\n<%@ Control language=\"vb\"\n    Inherits=\"\
    ACME.Modules.Employee.ViewEmployee\"\n    AutoEventWireup=\"false\" Explicit=\"\
    True\"\n    Codebehind=\"ViewEmployee.ascx.vb\" %>\n<%@ Register TagPrefix=\"\
    dnn\" TagName=\"Audit\"\n    Src=\"~/controls/ModuleAuditControl.ascx\" %>\n<asp:datalist\
    \ id=\"lstContent\" datakeyfield=\"ItemID\" runat=\"server\"\n    cellpadding=\"\
    4\">\n    <itemtemplate>\n```\n```\n\n+   4. Insert a new register directive just\
    \ before the Datalist control:\n\n```\n```aspx\n<%@ Register TagPrefix=\"dnn\"\
    \ TagName=\"SectionHead\"\n    Src=\"~/controls/SectionHeadControl.ascx\" %>\n\
    ```\n```\n\n+   5. The top of the file should now look like:\n\n```\n```aspx\n\
    <%@ Control language=\"vb\"\n    Inherits=\"ACME.Modules.Employee.ViewEmployee\"\
    \n    AutoEventWireup=\"false\" Explicit=\"True\"\n    Codebehind=\"ViewEmployee.ascx.vb\"\
    \ %>\n<%@ Register TagPrefix=\"dnn\" TagName=\"Audit\"\n    Src=\"~/controls/ModuleAuditControl.ascx\"\
    \ %>\n```\n```"
  merge: -1
  img_proc: true
- pgno: 174
  md: "```\n<%@ Register TagPrefix=\"dnn\" TagName=\"SectionHead\" Src=\"~/controls/SectionHeadControl.ascx\"\
    \ %>\n<asp:datalist id=\"lstContent\" datakeyfield=\"ItemID\" runat=\"server\"\
    \ cellpadding=\"4\">\n    <itemtemplate>\n```\n\n6. Next, we add a simple HTML\
    \ table and link it to the SectionHead control. Insert this code at the top of\
    \ the file as follows:\n\n```\n<%@ Control language=\"vb\" Inherits=\"ACME.Modules.Employee.ViewEmployee\"\
    \ AutoEventWireup=\"false\" Explicit=\"True\" Codebehind=\"ViewEmployee.ascx.vb\"\
    \ %>\n<%@ Register TagPrefix=\"dnn\" TagName=\"Audit\" Src=\"~/controls/ModuleAuditControl.ascx\"\
    \ %>\n<%@ Register TagPrefix=\"dnn\" TagName=\"SectionHead\" Src=\"~/controls/SectionHeadControl.ascx\"\
    \ %>\n<dnn:SectionHead ID=\"dshPanel\" runat=\"server\" CssClass=\"Head\" ResourceKey=\"\
    Settings\" Section=\"tblPanel\" Text=\"Collapsible Panel\">\n</dnn:SectionHead>\n\
    <table id=\"tblPanel\" cellspacing=\"2\" cellpadding=\"2\" border=\"0\" runat=\"\
    server\">\n    <tr>\n        <td width=\"20%\" class=\"SubHead\">\n          \
    \  [Put a label here]\n        </td>\n        <td width=\"25%\">\n           \
    \ [Put a control here]\n        </td>\n        <td width=\"10%\">\n          \
    \  &nbsp;\n        </td>\n        <td width=\"20%\" class=\"SubHead\">\n     \
    \       [Put a label here]\n        </td>\n        <td width=\"25%\">\n      \
    \      [Put a control here]\n        </td>\n    </tr>\n</table>\n<asp:datalist\
    \ id=\"lstContent\" datakeyfield=\"ItemID\" runat=\"server\" cellpadding=\"4\"\
    >\n    <itemtemplate>\n```"
