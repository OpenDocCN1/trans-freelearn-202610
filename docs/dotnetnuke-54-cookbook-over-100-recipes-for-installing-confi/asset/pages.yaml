- pgno: 104
  md: '# Installing Visual Web Developer 2010 Express


    In this recipe we will download and install Visual Web Developer 2010 Express
    — the free .NET development tool.


    # Getting ready


    To follow along with this recipe you must first complete the recipe *Downloading
    the Microsoft Web Platform Installer* from *Chapter 1*.


    # How to do it...


    +   1. Start by launching the Microsoft Web Platform Installer.

    +   2. When the list of available products is displayed, click on the **Web Platform**
    tab.

    +   3. Under the **Tools** section, click on the **Customize** link.


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_104_0.png)


    +   4. Make sure the following product is selected:

    +      - **Visual Web Developer 2010 Express**

    +   5. Click on the **Install** button to begin the install.

    +   6. The next dialog will list the file you are downloading and prompt **I Decline**
    or **I Accept**. Click on **I Accept**.

    +   7. The Web Platform installation will begin. You may be prompted one or more
    times to reboot. Click on **Yes** to reboot your machine and the installation
    will continue automatically after the reboot.

    +   8. When the install finishes and the **Congratulations** screen shows, click
    on **Finish**.'
  merge: -1
  img_proc: true
- pgno: 105
  md: '+   9. Close the Web Platform Installer by clicking on **Exit**.

    +   10. To confirm the installation was successful, look under **Start menu |
    All Programs** and the **Microsoft Visual Web Developer 2010 Express Edition**
    should appear under the `Microsoft Visual Studio 2010 Express` folder.


    # See also


    Completing this recipe gives you the tools to start programming, but to develop
    modules for DNN you will also need to complete the recipe *Installing the DNN
    5 Starter Kit*.


    # Viewing the database from Web Developer


    As you will be spending much time in Visual Web Developer, it is useful to create
    a connection to the database to see the tables, views, and stored procedures that
    your module will be using.


    # Getting ready


    To follow along with this recipe you need to have installed Visual Web Developer
    and have access to a local database like the one running your DNN site.


    # How to do it...


    +   1. Start by launching your preferred development tool (Visual Studio or Visual
    Web Developer Express).

    +   2. Under the **View** menu, select **Database Explorer** (or **Solution Explorer**
    in Visual Studio). This will show any database connections you have.


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_105_0.png)'
