- pgno: 294
  md: '# See also


    In this recipe we localized some of the items on the sample `ViewEmployee` control.
    To see how to localize the remaining items, see the other recipes in this chapter.


    # Localizing a drop-down list with a stored procedure


    As shown in *Chapter 6*, you can populate a drop-down list control from a stored
    procedure. In this recipe we will show how to localize a drop-down list by using
    the current locale to dynamically change the results returned from the stored
    procedure that populates the list.


    # Getting ready


    To follow along you must have completed the following recipes:


    +   - *Populating a drop-down list from a stored procedure*

    +   - *Localizing labels, titles, panels, and links*


    This recipe also requires a little data setup. To show how a drop-down list populates
    based on the selected locale, we need to create a special employee in the employee
    table. This employee will be the manager for employees working in Quebec.


    # How to do it...


    +   1. Start by launching the Development Tool and loading the **Employee** project.

    +   2. First we need to add a new field to the Employee table for each employee
    and manager. This new field is called `LocaleCode` and we will set the code so
    that we can tag some managers as English speaking and some as French speaking.
    The second task is to modify the `GetManagers` stored procedure from *Chapter
    6* and add `CurrentLocale` as a parameter.

    +   3. Double-click to open the `01.00.00.SqlDataProvider` file.


    > If you have already installed this module once, you can create a new file called
    `01.00.01.SqlDataProvider` to hold the updated procedure. For details see the
    recipe *Deploying a new module version* in *Chapter 11*.'
  merge: -1
  img_proc: true
- pgno: 295
  md: "4. Change the table creation code to include the new field:\n\n```\nCREATE\
    \ TABLE {databaseOwner} [{objectQualifier}ACME_Employee]\n(\n    [ModuleID] [int]\
    \ NOT NULL,\n    [ItemID] [int] NOT NULL IDENTITY(1, 1),\n    [EmpFirstName] [nvarchar]\
    \ (30) NOT NULL,\n    [EmpLastName] [nvarchar] (30) NOT NULL,\n    [ManagerNo]\
    \ [int] NULL,\n    [HireDate] [datetime] NOT NULL,\n    [Salary] [float] NOT NULL,\n\
    \    [LocaleCode] [nvarchar] (10) NULL,\n    [CreatedByUser] [int] NOT NULL,\n\
    \    [CreatedDate] [datetime] NOT NULL\n)\n```\n\n5. Next, scroll down and modify\
    \ the GetManagers routine as indicated. Add the new parameter at the top and add\
    \ it to the WHERE clause of the SELECT statement:\n\n```\ncreate procedure {databaseOwner}{objectQualifier}ACME_GetManagers\n\
    \n@ModuleId int,\n@CurrentLocale nvarchar(10)\n\nas\n\nselect Emp.ModuleId,\n\
    \    Emp.ItemId,\n    EmpFirstName,\n    EmpLastName,\n    ManagerNo,\n    HireDate,\n\
    \    Salary,\n    CreatedByUser,\n    Emp.CreatedDate,\n    'CreatedByUserName'\
    \ = Usr.FirstName + ' ' + Usr.LastName\nfrom {objectQualifier}ACME_Employee As\
    \ Emp\ninner join {objectQualifier}Users As Usr on Emp.CreatedByUser = Usr.UserId\n\
    where ModuleId = @ModuleId And ManagerNo = 0\nAnd LocaleCode = @CurrentLocale\n\
    \nGO\n```"
  merge: -1
  img_proc: true
