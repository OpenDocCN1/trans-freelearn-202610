- pgno: 96
  md: '# Easy Tricks with Existing Modules


    # How it works...


    RSS is really a set of different XML formats for syndicating news stories. It
    generally contains a summary of the story along with a link to the full text.
    One of the nice features in DNN is its ability to aggregate several feeds into
    a single feed on the page. Just use the **Add Link** to add more feeds. To display
    a feed in the News feeds module it must adhere to the RSS standard.


    # There''s more...


    Feeds often look good if the module is set in the right or left side of your DNN
    page. Experiment with positioning to see what looks best on your portal.


    # Configuring RSS news feeds


    In the recipe *Displaying RSS news feeds* we saw how to display RSS feeds in your
    DNN site. In this recipe we will see how to configure the News Feeds module to
    control how the feeds are formatted and displayed.


    # Getting ready


    To follow this recipe you must have the News Feeds module installed on your DNN
    site. See the recipe *Installing standard DNN modules in Chapter 1* for instructions.
    You must also have completed the previous recipe:


    +   - *Displaying RSS news feeds*


    This recipe will demonstrate two configuration features:


    +   - Use the **Settings** to control the number of stories displayed on the page

    +   - Using a XSL transformation file to display a feed as a news ticker


    # How to do it...


    +   1. Log in as the Portal Administrator (`sysadmin` in our examples).

    +   2. Look at the Control Panel and make sure you are in Edit mode.

    +   3. Navigate to the page that holds the News Feed created in the previous recipe.'
  merge: -1
  img_proc: true
