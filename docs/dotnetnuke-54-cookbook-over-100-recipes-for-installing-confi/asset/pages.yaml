- pgno: 385
  md: '# There''s more...


    If DNN is installed on an older version of Windows (before Vista/Windows 7) you
    might get an error "Error while processing Windows Authentication. Check your
    IIS settings. DesktopModules/AuthenticationServices/ActiveDirectory/WindowsSignin.aspx
    should NOT allow anonymous access." In this case see the next recipe for instructions
    for fixing this issue or rolling back and disabling Active Directory security.


    # See also


    In this recipe we enabled Active Directory Authentication to allow AD users to
    access your DNN portal without existing in DNN. In the next recipe we will see
    how to synchronize the security roles between Active Directory and DNN so you
    can grant access to your pages and modules to the Active Directory roles.


    # Synchronizing Security Roles with DNN


    Once you''re using Active Directory for your DNN security, the next step is to
    synchronize your AD security roles (or groups) with DNN so you can control access
    to pages and modules based on role, not just the username.


    This does not automatically create the security roles (you have to manually do
    that); instead it syncs what roles the user has. So if you revoke a role in AD,
    the user automatically loses that role in DNN as well.


    In this recipe we will assume there is a security role called Users in your Active
    Directory. It is important that when you recreate the roles in DNN that you spell
    them exactly the same as they appear in Active Directory.


    # Getting ready


    To follow along with this recipe you must have completed the following recipes:


    +   - *Creating and Assigning Security Roles.*

    +   - *Granting Access to Modules*

    +   - *Using Active Directory with DNN*'
  merge: -1
  img_proc: true
- pgno: 386
  md: '# Advanced Modules and Security


    # How to do it...


    +   1. Start by logging in as portal Administrator.

    +   2. Look under the Admin menu and select **Security Roles**.

    +   3. This page will display all the security roles you currently have. Use the
    **Add New Role** link to create a new role called **Users**.


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_386_0.png)


    +   4. Now that we have a role defined both in Active Directory and DNN, we need
    to turn on role synchronizing. Select **Extensions** from the **Admin** menu.

    +   5. Scroll down to the list of authentication systems and click the edit icon
    next to **DNN_ActiveDirectoryAuthentication**. This will display the configuration
    page.


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_386_1.png)


    +   6. Find the checkbox called **Synchronize Role** and make sure it is **checked**.

    +   7. Click **Update Authentication Settings** to save your changes. After a
    pause you should see a success message.

    +   8. Lastly, pick a module in your portal that anonymous users (those not logged
    in) cannot see. Use the instructions from the recipe *Granting access to modules*
    to grant read access to this module to the Users role you created above. Since
    you did not grant the Users role to anyone, the only way a user will see this
    module is if the synchronizing works.

    +   9. After granting access to the role, use the Logoff link and log off as Administrator.

    +   10. Refresh the browser and you will now log in using your Active Directory
    credentials. You should successfully log into the DNN portal and see the module
    granted to the Users role.'
  merge: -1
  img_proc: true
- pgno: 387
  md: '# How it works...


    By configuring the Active Directory Authentication to keep roles synchronized,
    grants and revokes made in Active Directory will automatically apply to the matching
    DNN role.


    # Correcting Active Directory issues


    Changing security providers in DNN is a little risky because if something goes
    wrong, you might get locked out of your site. In this recipe we''ll see how to
    fix a common access issue and also how to roll back the Active Directory provider
    should you need to start all over.


    # Getting ready


    To follow along with this recipe you must have completed the following recipe:


    +   - *Using Active Directory with DNN*


    # How to do it...


    +   1. If you encounter the error `WindowsSignin.aspx` should NOT allow anonymous
    access, while setting up Active Directory security in DNN, you will need to manually
    tweak the security on the `WindowsSignin.aspx` file as follows:

    +   2. On the web server, open the IIS Manager and expand the folder `DesktopModules/AuthenticationServices/ActiveDirectory`
    until you can see `WindowsSignin.aspx` listed.

    +   3. Right click on `WindowsSignin.aspx` and select **Properties**.

    +   4. On the **File Security** tab should be a section called **Anonymous access
    and authentication control**.


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_387_0.png)


    +   5. Click on the **Edit** button and uncheck Anonymous Access.

    +   6. Click **OK** to close the dialog then **OK** again to close the properties.'
  merge: -1
  img_proc: true
- pgno: 388
  md: "# Advanced Modules and Security\n\n+   7. Relaunch your browser and the error\
    \ should go away.\n+   \n+   8. If you cannot get the Active Directory security\
    \ working with your DNN portal and find you cannot log back into your portal as\
    \ SuperUser, you can disable Active Directory security and restore the DNN security\
    \ with the following steps:\n+   \n+   9. Use the Development tool to connect\
    \ to the database.\n+   \n+   10. Find the table called **PortalSettings**. Open\
