- pgno: 402
  md: "# How to do it...\n\n+   1. Start by creating a new folder and naming it `ACME.SampleWidget`.\n\
    +   2. Look on the DNN server and locate the folder `\\Resources\\Widgets\\User\\\
    YourCompany`.\n+   3. Copy the files in this folder to the new `ACME.SampleWidget`\
    \ folder.\n+   4. Rename the JavaScript file `YourCompany.Widgets.SampleWidget.js`\
    \ to `ACME.Widgets.SampleWidget.js`.\n+   5. Delete the subfolder called `/EmbedWidgetResources`\
    \ as we will not use it in this recipe.\n+   6. This folder should now contain\
    \ the following files:\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_402_0.png)\n\
    \n+   7. Launch the Development Tool.\n+   8. Select **Open File...** from the\
    \ **File** menu.\n+   9. Browse to the `ACME.SampleWidget` folder and open the\
    \ `ACME.Widgets.SampleWidget.js` file.\n+   10. The first thing we need to do\
    \ is change the text \"YourCompany\" in the script. Instead of YourCompany, you\
    \ can place your actual company name or initials. We do this with a simple search\
    \ and replace: Under the **Edit** menu, look under **Find and Replace** and select\
    \ **Quick Replace** (or just press `Ctrl+H`).\n+   11. When prompted:\n\n+   -\
    \ **Find What:** `YourCompany`\n+   - **Replace with:** `ACME`\n+   - **Look in:**\
    \ `Current Document`\n\n+   12. Click on **Replace All**.\n+   13. To add our\
    \ own little custom JavaScript, scroll down to the bottom of the template script\
    \ and find the `ClickHandler` function. We need to add some code to fade the text\
    \ when a link is clicked:\n\n```\nACME.Widgets.SampleWidget.ClickHandler = function(sender)\n\
    {\n    var clickedObject = sender.target;\n```"
  merge: -1
  img_proc: true
