- pgno: 196
  md: "# Adding a paging control to a Datagrid\n\nIn this recipe we will extend the\
    \ previous recipe by adding paging controls to the Datagrid and filters. DNN offers\
    \ a very good paging control that will take our filtered search results and break\
    \ them into multiple pages based on the page size we select.\n\nIn this recipe\
    \ we will add a new drop down on the `ViewEmployee` form to control the size of\
    \ our pages. Then we will modify our filter procedure to accept and use paging\
    \ variables.\n\n# Getting ready\n\nTo follow along with this recipe you must have\
    \ completed the following recipes:\n\n+   - Displaying a Datagrid with filter\
    \ controls\n\n# How to do it...\n\n+   1. Start by launching the Development Tool\
    \ and loading the Employee project.\n+   2. Double-click to open the `ViewEmployee.ascx`\
    \ file.\n+   3. At the top of the file is an HTML table that is holding the filters\
    \ we created in previous chapters. We need to add another drop-down control that\
    \ holds the options for the page sizes. Find the HTML table from the previous\
    \ recipe and change the code as follows:\n\n```\n<table id=\"tblPanel\" cellspacing=\"\
    2\" cellpadding=\"2\" border=\"0\"\n      runat=\"server\">\n    <tr>\n      \
    \  <td width=\"12%\" class=\"SubHead\">\n            <dnn:Label ID=\"lblManagerNo\"\
    \ runat=\"server\"\n                      ControlName=\"ddlManagerNo\" Suffix=\"\
    :\" >\n            </dnn:Label>\n        </td>\n        <td width=\"18%\">\n \
    \           <asp:DropDownList ID=\"ddlManagerNo\" runat=\"server\"\n         \
    \             DataTextField=\"ManagerName\"\n                      DataValueField=\"\
    ManagerNo\"\n                      AutoPostBack=\"true\">\n            </asp:DropDownList>\n\
    \        </td>\n        <td width=\"5%\">\n            &nbsp;\n        </td>\n\
    \        <td width=\"12%\" class=\"SubHead\">\n```"
  merge: -1
  img_proc: true
