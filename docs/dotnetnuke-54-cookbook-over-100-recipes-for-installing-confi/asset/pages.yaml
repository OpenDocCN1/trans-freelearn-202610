- pgno: 338
  md: 'DNN offers several module interfaces for developers. Unlike the one-way APIs
    used in previous DNN versions, these interfaces represent a two-way interaction
    between the developer and the portal framework. All modules can access these interfaces
    because they inherit from the PortalModuleBase class, but custom modules need
    custom code to link to the interface. The recipes in this chapter demonstrate
    four of the interfaces:


    +   - iSearchable

    +   - iPortable

    +   - iActionable

    +   - iUpdatable


    # Making modules searchable


    Most websites offer the ability for a visitor to search the site content. DNN
    provides a built-in search engine plus an interface for indexing the content coming
    from your modules.


    In this recipe we will add code to the sample Employee module that will take the
    content from the GetEmployees stored procedure and index it in the DNN default
    data store. When the data has been indexed it becomes searchable using the DNN
    search tool (depending on your site''s skin this appears as a little magnifying
    glass in the upper-right corner of the portal).


    # Getting ready


    To follow along with this recipe you must have completed the following recipe
    from Chapter 5, Building, Debugging, and Deploying Modules:


    +   - Deploying a module as a standalone package


    As the developer you must also decide which columns will be searchable for your
    module. You do not need to make all your fields searchable. Instead, choose the
    most important fields that help identify a unique record. For example, it is better
    to index the description and summary of a document, rather than the entire document
    itself. In this example we will use Employee full name, hire date, and salary
    as the searchable fields. As text fields make the best fields for searching we
    will format the date and salary fields into a searchable text string.


    To help identify how the values from a module should be indexed, DNN offers different
    properties we can assign to our module data:


    | Property | Description |

    |---|---|

    | Title | Text that is displayed in the search results (first and last name in
    this example). |

    | Description | Text that summarizes the content of the search results (name,
    hire date, and e-mail address in this example). |

    | Content | The fields users can search on (salary, hire date, e-mail address,
    new hire flag, and imageURL in this example). |'
  merge: -1
  img_proc: true
