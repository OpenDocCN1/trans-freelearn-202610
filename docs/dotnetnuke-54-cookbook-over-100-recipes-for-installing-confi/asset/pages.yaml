    # # Creating custom module actions


    In many recipes we have used the module action menu that appears next to the module
    title and is used to select additional module features. Modules that inherit from
    the `PortalModuleBase` class receive several default actions in the menu (things
    like Import/Export Content). In this recipe we will show how to add your own actions
    in the module menu using the `iActionable` interface.


    There are three basic tasks to define our own module actions:


    +   - Define the custom action menu item

    +   - Create a subroutine to handle the `Click` event

    +   - Connect the `Click` event handler to the menu item


    # ## Getting ready


    To follow along with this recipe you must have completed the following recipe
    from *Chapter 5, Building, Debugging, and Deploying Modules:*


    +   - *Deploying a module as a standalone package*


    For this recipe we will demonstrate the action menu processing by creating a simple
    HTML table of statistics on the View Employee form that is hidden until we click
    on the **Show Statistics** action menu item.'
  merge: -1
  img_proc: true
- pgno: 349
  md: "# How to do it…\n\n+   1. Start by launching the Development Tool and loading\
    \ the Employee project.\n+   2. Double-click to open the `ViewEmployee.ascx` file.\
    \ Scroll down to the bottom of the file and add this new hidden HTML table:\n\
    +   \n+   ```html\n+   <table id=\"tblStats\" cellspacing=\"2\" cellpadding=\"\
    2\" border=\"0\"\n+          runat=\"server\" style=\"width: 100%\" visible=\"\
    false\">\n+     <tr>\n+       <td width=\"25%\" class=\"SubHead\">\n+        \
    \ Total Company Sales:\n+       </td>\n+       <td width=\"75%\">\n+         $1,234,567.00\n\
    +       </td>\n+     </tr>\n+     <tr>\n+       <td width=\"25%\" class=\"SubHead\"\
    >\n+         Total Company Expenses:\n+       </td>\n+       <td width=\"75%\"\
    >\n+         $234,567.00\n+       </td>\n+     </tr>\n+   </table>\n+   ```\n\
    +   3. Next, double-click to open the `ViewEmployee.ascx.vb` file.\n+   4. At\
    \ the top of the file add the necessary import directive:\n+   \n+   ```vb\n+\
    \   Imports DotNetNuke.Entities.Modules.Actions\n+   ```\n+   5. Scroll down to\
    \ the **Optional Interfaces** region and look for the `ModuleActions` property.\n\
