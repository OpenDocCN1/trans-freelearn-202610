    # Showing checkboxes in a Datagrid


    An element that is useful to display in a Datagrid is a checkbox-like image to
    indicate the status of the database record. These are not functioning checkboxes
    but rather a visual indicator showing the data to be true or false.


    The control works by having two images, one with a checkmark that is shown when
    the value is true. The other is an unchecked image that is shown when the value
    is false.


    > This recipe will work with any image indicating true or false. Checkbox-like
    images are used in other DNN modules so they are familiar to users, but you can
    experiment with your own images as well.


    This recipe has two basic steps:


    +   We will create a new property of the EmployeeInfo object called NewHire. This
    property checks the date of hire from the database and returns true if the employee
    was hired less than 30 days ago.


    +   We will add a new column to the Datagrid that evaluates the NewHire property
    and shows one image if the NewHire is true and another image if the NewHire is
    false.'
  merge: -1
  img_proc: true
- pgno: 210
  md: "# Getting ready\n\nIn this recipe we will extend the Datagrid that we created\
    \ in *Chapter 6*. To follow along you should have successfully completed and deployed\
    \ the project *Displaying a Datagrid with filter controls*.\n\n# How to do it...\n\
    \n+   1. Launch the Development Tool and load the **Employee** project.\n+   2.\
    \ Double-click to open the `ViewEmployee.ascx` file.\n+   3. The first step is\
    \ to add a new column to the Datagrid that will show the checkbox images. We will\
    \ use the `Eval` function to check the `NewHire` function. Locate the Datagrid\
    \ and add a new column just after the `Salary` column:\n\n```\n```aspx\n<dnn:textcolumn\
    \ datafield=\"Salary\" headertext=\"Salary\"/>\n\n<asp:TemplateColumn HeaderText=\"\
    New Hire\">\n    <itemTemplate>\n        <asp:Image Runat=\"server\" ID=\"imgApproved\"\
    \n                  ImageUrl=\"~/images/checked.gif\" Visible='\\n<%# DataBinder.Eval(Container.DataItem,\"\
    NewHire\")=\"1\" %>'/>\n        <asp:Image Runat=\"server\" ID=\"imgNotApproved\"\
    \n                  ImageUrl=\"~/images/unchecked.gif\" Visible=\n'<%# DataBinder.Eval(Container.DataItem,\"\
    NewHire\")=\"0\" %>'/>\n    </ItemTemplate>\n</asp:TemplateColumn>\n\n</Columns>\n\
    </asp:datagrid>\n```\n```\n\n+   4. Next, open the `EmployeeInfo.vb` file.\n+\
    \   5. Find the `Public Properties` section and add the read-only property `NewHire`\
    \ that returns true or false if the employee was hired in the last 30 days:\n\n\
    ```\n```vb\n' public properties\n\nPublic ReadOnly Property NewHire() As Boolean\n\
    \    Get\n        Return (Today) - _HireDate).Days < 30\n    End Get\nEnd Property\n\
    ```\n```"
  merge: -1
  img_proc: true
