- pgno: 319
  md: "# Displaying an XML feed\n\nThe XML/XSL module is used to display a formatted\
    \ XML data feed on a DNN page. There are many different kinds of publically available\
    \ XML feeds and in this recipe will we see how to configure and format one.\n\n\
    # Getting ready\n\nTo use the XML/XSL module you need a URL to a local or remote\
    \ XML feed. In this recipe we will use the feed of a popular technology news site\
    \ call Digg. We will also create a stylesheet to describe how the XML feed should\
    \ be displayed. This is called the XSL Transformation (XSLT) file.\n\n# How to\
    \ do it...\n\n+   1. Before we can add an XML feed to our page, we must create\
    \ a text file that describes how the information should be displayed.\n+   2.\
    \ Launch your normal Development Tool.\n+   3. Select New File... from the File\
    \ menu.\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_319_0.png)\n\n+   4. Select\
    \ General as the Category and choose XSLT File as the template.\n+   5. Click\
    \ on Open.\n+   6. A template XSL file will appear in the editor. Modify the file\
    \ by adding the following code to describe how to display the XML elements:\n\n\
    ```\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<xsl:stylesheet version=\"1.0\"\
    \n    xmlns:xsl=\"http://www.w3.org/1999/XSL/Transform\"\n```"
  merge: -1
  img_proc: true
- pgno: 320
