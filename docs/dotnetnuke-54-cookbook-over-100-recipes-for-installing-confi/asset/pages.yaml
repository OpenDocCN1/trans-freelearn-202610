- pgno: 412
  md: "# Advanced Skinning\n\n+   15. Once the skin is deployed, look under the **Admin**\
    \ menu and select **Skins**.\n+   \n+   16. Select the **SampleACSXskin** from\
    \ the **Skins:** drop-down list and click on the Preview link.\n+   \n+   17.\
    \ As we placed the DIV elements in the Content Pane the graphic box with the content\
    \ will display at the top of the page:\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_412_0.png)\n\
    \n# How it works...\n\nTo use the rounded corners super stylesheet we had to do\
    \ three things: first import the DNN rounded corners stylesheet into the skin\
    \ CSS file. Then add some additional rules to define our custom border images,\
    \ and then add a set of nested DIV elements to wrap our images around our content.\n\
    \n# Showing portal settings in a skin\n\nAs we saw in some of the previous recipes,\
    \ it is possible to reference some DNN variables in our skins. We saw an example\
    \ of this where we used the variable SkinPath (<%= SkinPath %>) to retrieve the\
    \ path to the current skin. But there are other values we can access in the skin\
    \ and in this recipe we will see how to access portal settings variables in skins.\n\
    \nThe following chart shows some of the portal setting variables we can use:\n\
    \n| Variable | Description |\n|---|---|\n| `<%=PortalSettings.ActiveTab.TabName\
    \ %>` | Name of the current page. |\n| `<%=PortalSettings.ActiveTab.TabID %>`\
    \ | ID of the current page. |\n| `<%= iif(Request.IsAuthenticated,\"Logged In\"\
    ,\"Logged Out\") %>` | Displays login status. |\n| `<%=PortalSettings.ActiveTab.Title\
    \ %>` | Title of the current page. |\n| `<%= PortalSettings.PortalName %>` | Name\
    \ of the current portal. |\n| `<%= PortalSettings.PortalId %>` | The current portal\
    \ ID (0, 1, 2, and so on). |\n| `<%= PortalSettings.AdministratorRoleName %>`\
    \ | The name of the administrators role. |"
  merge: -1
  img_proc: true
- pgno: 413
  md: "| Variable | Description |\n|---|---|\n| `<%= PortalSettings.Email %>` | The\
    \ e-mail address of the portal administrator. |\n| `<%= PortalSettings.FooterText\
