- pgno: 405
  md: '> To see more examples of skin widgets and how they work, download and examine
    the Extropy skin available from www.codeplex.com (just search for "Extropy").


    # There''s more...


    In this recipe we created a simple custom widget and deployed it to the DNN site
    so that the widget is available to skins. In the next recipe we will see how to
    use the custom widget in a skin.


    # Using a custom widget in a skin


    Once a custom skin widget has been created and installed on the server it becomes
    available just like the widgets that come with DNN. In this recipe we will see
    how to use the custom skin widget created in the previous recipe by combining
    it with the SampleASCXSkin from Chapter 8, Basic Skinning.


    There are three things we need to do:


    +   1. Make sure you have completed the previous recipe and updated the template
    JavaScript.

    +   2. Add the custom Widget control to the ASCX file.

    +   3. Deploy the skin and test it.


    # Getting ready


    To follow along with this recipe you must have completed the following recipes:


    +   - Creating a simple ASCX skin

    +   - Creating and deploying a custom widget


    # How to do it...


    +   1. To use the ACME.SampleWidget widget in a skin, we''ll need to edit the
    sample ASCX skin files from the recipe Creating a simple ASCX skin. Start by finding
    the folder called SampleASCXSkin.

    +   2. Launch the Development Tool.

    +   3. Select Open File... from the File menu.

    +   4. Browse to the SampleASCXSkin folder and open the SampleASCXSkin.ascx file.'
  merge: -1
  img_proc: true
