- pgno: 83
  md: '# How it works...


    The reason why the host user must specify what files are allowed for distribution
    is because some types of files (like executable files) are more susceptible to
    viruses and malicious code. By controlling the kinds of files your portal can
    distribute or receive from users you reduce the chances of this happening.


    In this example, we selected Track Number Of Times This Linked is Clicked? This
    is used to keep track of how often users view the document. As we selected Clicks
    as one of the display columns we can see the count when the document is listed
    on the page.


    # There''s more...


    If the users can see the Documents module then they have access to download the
    documents within it. Limit access to your documents by setting the security on
    the module or the page as described in the recipe Granting access to modules in
    Chapter 2.


    # Publishing a Newsletter


    A good way to keep your users informed with current news and events or alert them
    to changes in your portal is with a newsletter. In DNN a newsletter is an e-mail
    that goes out at regular intervals to people registered with your site.


    # Getting ready


    Newsletters are sent out to security groups defined in your site, as well as any
    individual e-mail addresses you deem necessary. Sending a newsletter requires
    that your DNN site has been set up to send e-mails. See the recipe Setting up
    the SMTP Server with Gmail in Chapter 2 for instructions. Also, as we are using
    the Subscribers role in this example, you should have at least one user with the
    Subscriber role with a valid e-mail address to receive the newsletter.


    # How to do it...


    +   1. Log in as the Portal Administrator (`sysadmin` in our examples).'
  merge: -1
  img_proc: true
