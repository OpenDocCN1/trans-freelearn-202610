- pgno: 202
  md: "```\n/** If we pass -1 for a numeric filter it means ignore the filter **/\n\
    \nDECLARE @PageLowerBound int\nDECLARE @PageUpperBound int\n\n/** Calculate the\
    \ upper and lower bonds based on the PageIndex and PageSize **/\n\nSET @PageLowerBound\
    \ = @PageSize * @PageIndex\nSET @PageUpperBound = @PageLowerBound + @PageSize\
    \ + 1\n\n/** create a temp table to hold the Ids of our results **/\nCREATE TABLE\
    \ #PageIndex\n(\n    IndexID    int IDENTITY (1, 1) NOT NULL,\n    ItemId    \
    \ int\n)\n\n/** populate the temp temp with the filtered results **/\nINSERT INTO\
    \ #PageIndex (ItemId)\nSELECT ItemId\nFROM {objectQualifier}ACME_Employee\nWHERE\
    \ (ModuleId = @ModuleId) AND (ManagerNo = @MgrFilter OR @MgrFilter = -1) AND (Salary\
    \ >= @SalaryFilter)\nORDER BY ItemId DESC\n\n/** remember the count of the results\
    \ **/\nSELECT COUNT(*) as TotalRecords\nFROM #PageIndex\n\n/** join the filtered\
    \ Ids to the employee table to get our fields **/\nselect Emp.ModuleId,\n    \
    \   Emp.ItemId,\n       EmpFirstName,\n       EmpLastName,\n       ManagerNo,\n\
    \       HireDate,\n       Salary,\n       Emp.CreatedByUser,\n       Emp.CreatedDate,\n\
    \       'CreatedByUserName' = Usr.FirstName + ' ' + Usr.LastName\nFROM {objectQualifier}ACME_Employee\
    \ As Emp\nINNER JOIN {objectQualifier}Users As Usr on Emp.CreatedByUser = Usr.UserId\n\
    INNER JOIN #PageIndex PageIndex\n    ON Emp.ItemId = PageIndex.ItemId\nWHERE (\
    \ (PageIndex.IndexID > @PageLowerBound) OR @PageLowerBound is null )\n```"
  merge: -1
  img_proc: true
