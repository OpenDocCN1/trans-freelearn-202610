    # Creating and organizing pages


    In this example we will create a few blank pages to show how to create new content
    and organize it in a menu. We will create one page that will be the parent of
    several smaller pages.


    So what is a page? A page in DNN is really a place holder. When you create a new
    page it appears in the menu of your site and acts as a blank layout to hold your
    modules.


    In this recipe we will create a few blank pages, organize them into a hierarchy
    and then delete some of them to see how it is done.'
  merge: -1
  img_proc: true
