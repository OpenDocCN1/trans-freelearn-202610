- pgno: 131
  md: '# Building, Debugging, and Deploying Modules


    In this chapter we will cover the following topics:


    +   - Building a View control

    +   - Building an Edit control

    +   - Editing the Manifest File

    +   - Building for release or debug

    +   - Deploying a module as a standalone package

    +   - Downloading the DNN 5 source code

    +   - Setting up a debugging environment

    +   - Preparing a module for debugging

    +   - Setting a breakpoint and stepping through module code

    +   - Creating a Manifest from an installed module


    # Introduction


    In the previous chapter we saw how to install Web Developer Express and start
    creating our custom modules. In this chapter we will see how to create working
    *View* and *Edit* controls, how to deploy custom modules and how to configure
    the development tool for module debugging.'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# Development tools


    The recipes in this chapter and the following chapters work equally well with
    either Visual Studio 2008 or Visual Web Developer Express 2010. You can use whichever
    tool you are more familiar with or have access to. In these examples we will use
    Web Developer Express but for convenience we will use the term Development Tool
    when referring to Visual Studio or Web Developer.


    # WAP vs. WSP


    There are two ways to build a custom module. Which approach to use is based on
    what you need to do:


    +   - You can build it as a Web Application Project (WAP). This is good if you
    just want to code, build, and deploy your project. This method was described in
    the last chapter and most of this chapter.

    +   - You can put your module code in with the DNN source code and build the website
    as one Web Site Project (WSP). This gives the ability to set breakpoints and step
    through your module code. This method is demonstrated at the end of this chapter.


    # Controls in DNN


    Before we get started in earnest, here is a quick overview of what we want to
    accomplish. When we talk about module development in DNN we are really talking
    about four key parts:


    +   - User Controls: These are the user interface elements of your module. They
    will be dynamically placed on the pages of your DNN portal based on what part
    of the module you are viewing. In the examples of this chapter the first control
    that is displayed is the View user control. The Edit control is displayed when
    you click on an employee record and the Settings control is displayed when you
    click on the Settings link.

    +   - Assemblies: The code behind the user controls (the *.vb files) will be compiled
    into an assembly (a DLL file) when you build the Employee project. When the module
    is deployed the assembly will be placed in the portal''s /bin folder.

    +   - Database scripts: As we saw in the previous chapter, modules depend on database
    tables to hold information. As part of your module you will have an installation
    script to create your module database tables and an uninstall script to remove
    them when the module is uninstalled.

    +   - Module Manifest: An XML file that tells DNN how the module should be installed.
    In DNN version five the manifest can include release notes and a license agreement.'
  merge: -1
  img_proc: true
- pgno: 133
  md: '# # Building a View control


    Although DNN modules vary in the number and kind of controls they contain, a common
    approach (and the one generated by the Starter Kit) consists of three user controls:


    +   - View control: To display the module on the DNN page

    +   - Edit control: To edit your module data

    +   - Settings control: To change the settings of your module


    When you place a DNN module on a page the View control of the module is responsible
    for displaying the initial state of the module. In this recipe, we will look at
    the View control created by the Starter Kit and expand it to include the fields
    of the sample Employee table.


    The View control we will create will display all the Employee records in the table
    like this:


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_133_0.png)


    # ## Getting ready


    To follow along with this recipe you must have completed the following recipe
    from *Chapter 4:*


    +   - *Creating a new module with the Starter Kit*


    # ## How to do it...


    +   1. Start by launching your preferred development tool (Visual Studio or Visual
    Web Developer Express).

    +   2. Look for Recent Projects shown on the left side of the screen. Click on
    **Employee** to load the project.

    +   3. Double-click to open the `ViewEmployee.ascx` file.'
  merge: -1
  img_proc: true
