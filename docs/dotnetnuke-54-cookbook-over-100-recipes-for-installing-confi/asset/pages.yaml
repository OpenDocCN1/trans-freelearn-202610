- pgno: 103
  md: '# 4


    # Creating your Own Modules


    In this chapter we will cover the following topics:


    +   - Installing Visual Web Developer 2010 Express

    +   - Viewing the database from Web Developer

    +   - Installing the DNN 5 Starter Kit

    +   - Creating a new module with the Starter Kit

    +   - Creating a database table with keys

    +   - Creating stored procedures

    +   - Connecting a module to the database

    +   - Creating an uninstall script


    # Introduction


    The previous chapters introduced DNN and showed how to add existing modules to
    your DNN site. In this chapter, we will show how to download and install the tools
    you need to start writing your own DNN modules. We will also show how to get a
    jump start by creating a module using the DNN Starter Kit and the steps required
    to connect it to the database.'
