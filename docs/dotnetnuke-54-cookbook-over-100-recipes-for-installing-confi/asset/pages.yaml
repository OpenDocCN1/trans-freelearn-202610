    The DNN Multi-State checkbox control is used in situations when you want to show
    a visual indicator for the state of the control but you need more then checked
    and unchecked.


    You can see an example of this with the DNN page security where you grant, deny,
    or ignore access to a DNN page:


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_235_0.png)


    In this recipe we will add a four-state checkbox to the Edit Employee page representing
    the Bonus Level of the employee (None, Small, Medium, and Large) represented by
    color-coded star icons.


