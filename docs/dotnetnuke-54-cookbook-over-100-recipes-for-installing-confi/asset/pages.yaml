  md: "# How it works...\n\nWe can bind a drop-down list control directly to a DNN\
    \ list. This allows the host user to add values to the list without having to\
    \ redeploy the module.\n\n# There's more...\n\nAs we bind to the list when the\
    \ page is displayed, you can add more values to the DNN list and they will automatically\
    \ appear in the drop-down list when the page is refreshed.\n\n# Populating a drop-down\
    \ list from a stored\nprocedure\n\nIn this recipe we will see how to populate\
    \ a drop-down list from a stored procedure. This is similar to binding to a DNN\
    \ list, but now we can use any data stored in the database for the list.\n\n#\
    \ Getting ready\n\nTo follow along with this recipe you must have completed the\
    \ following recipes:\n\n+   - *Creating stored procedures* (from *Chapter 4*)\n\
    +   - *Populating a drop-down list from a DNN list*\n\n# How to do it...\n\n+\
    \   1. Start by launching the Development Tool and loading the Employee project.\n\
    +   2. Double-click to open the `ViewEmployee.ascx` file.\n+   3. Find the table\
    \ and the salary control you added from the previous recipe. Look for the two\
    \ placeholders and replace them with this label and control code so the HTML table\
    \ now looks like this:\n\n```\n```html\n<table id=\"tblPanel\" cellspacing=\"\
    2\" cellpadding=\"2\" border=\"0\"\n       runat=\"server\" >\n    <tr>\n    \
    \    <td width=\"20%\" class=\"SubHead\">\n            <dnn:Label ID=\"lblManagerNo\"\
    \ runat=\"server\"\n                      ControlName=\"ddlManagerNo\" Suffix=\"\
    :\" />\n        </td>\n        <td width=\"25%\">\n```\n```"
