    | First | Last | Manager # | Hire Date | Salary |\n| Henry1 | Smith1 | 0 | 10/10/2001\
    \ | 70000 |\n| Thomas | Brown | 0 | 9/9/2000 | 60000 |\n| Katie | Smith | 11 |\
    \ 8/8/2001 | 35000 |\n| James | Watson | 0 | 7/7/1992 | 95000 |\n| Debby | Smith\
    \ | 4 | 6/6/1996 | 45000 |\n| Prénom | Nom de famille | Gestionnaire # | Date\
    \ d'embauche | Salaire |\n| Henry1 | Smith1 | 0 | 2001-10-10 | 71849,4 |\n| Thomas\
