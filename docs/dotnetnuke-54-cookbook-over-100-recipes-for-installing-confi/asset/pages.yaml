- pgno: 182
  md: "```\n<asp:DropDownList ID=\"ddlManagerNo\" runat=\"server\"\n    DataTextField=\"\
    ManagerName\"\n    DataValueField=\"ItemNo\" AutoPostBack=\"true\">\n</asp:DropDownList>\n\
    </td>\n<td width=\"10%\">\n    &nbsp;\n</td>\n<td width=\"20%\" class=\"SubHead\"\
    >\n    <dnn:Label ID=\"lblSalaryRange\" runat=\"server\" ControlName=\"ddlddlSalaryRange\"\
