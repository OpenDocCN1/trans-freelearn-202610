- pgno: 239
  md: '# 8


    # Basic Skinning


    In this chapter we will cover the following topics:


    +   - Downloading and installing a skin

    +   - Creating a simple HTML skin

    +   - Creating a simple ASCX skin

    +   - Deploying your skins and containers

    +   - Exploring skin objects

    +   - Creating a simple HTML container

    +   - Creating a basic ASCX container

    +   - Creating custom container images

    +   - Styling a container with images

    +   - Styling a menu with images


    # Introduction


    In DNN, skinning is a term that refers to the process of customizing the look
    and feel of the DNN portal. One of the powerful features of DNN is that the functionality
    of the portal is separated from the presentation of the portal. This means we
    can change the appearance of the portal without affecting how the portal works.


    To create a skin in DNN we will work with three kinds of files: HTML, ASCX, and
    CSS. The HTML or ASCX file describes the layout of the page and the CSS file provides
    the styling. If you have worked with HTML and CSS before than you will be able
    to immediately get started. However, if you are familiar with ASCX (and as a DNN
    developer that is likely) you can achieve the same results faster than HTML. In
    the recipes, we will show primarily ASCX skinning with some brief examples of
    HTML skinning.'
  merge: -1
  img_proc: true
- pgno: 240
  md: "# Basic Skinning\n\n# ▸ **Skin Objects**\n\nBefore we start looking at the\
    \ recipes, we need a quick word about Skin Objects. Skin Objects are used in both\
    \ HTML and ASCX skin files as placeholders for different kinds of dynamic functionality.\
    \ In HTML skins, you place text tokens such as `[CURRENTDATE]` in your code and\
    \ when the code is parsed by the skin engine it will insert the matching skin\
    \ object. If you are working in ASCX, you register skin objects as controls that\
    \ you place directly in your code.\n\nDNN offers many different skin objects such\
    \ as CurrentDate, Logo, Login link, and others and we'll see many of these in\
    \ action in the recipes of this chapter.\n\n# # Downloading and installing a skin\n\
    \nOften the easiest way to start skinning is to download an existing skin package\
    \ and see the different files used for skinning. In this recipe we will download\
    \ an excellent skin created by Jon Henning from a site called CodePlex that demonstrates\
    \ the most common skin objects and layouts.\n\nAnother reason for starting with\
    \ an existing skin is that it allows incremental development. We can start with\
    \ a fully functional skin, deploy it to our DNN portal and then edit the source\
    \ files right on the server. In this way the changes we make are immediately displayed\
    \ and problems are easily spotted and fixed. However, as applying a skin can affect\
    \ the entire site, it is best to create and test skins on a development DNN site\
    \ before using them on a production site.\n\nFinally, it should also be noted\
    \ that as a skin is really just another type of extension in DNN, you are already\
    \ familiar with some of these steps.\n\n# ## How to do it...\n\n+   1. Open your\
    \ favorite web browser and go to the site  \n+      `http://codeendeavortemplate.codeplex.com/`.\n\
    \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_240_0.png)\n\n+   2. Click on **Downloads**\
    \ in the toolbar."
  merge: -1
  img_proc: true
- pgno: 241
  md: '![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_241_0.png)


    +   3. Scroll down a little and click on the **CodeEndeavors Template Skin** link.

    +   4. When prompted with the License Agreement, click **I Agree**.

    +   5. The File download dialog will ask if you want to **Open** or **Save**.
    Click on **Save** and select a temporary folder to hold the ZIP file.

    +   6. That''s all we need from the CodePlex site, so close the browser.

    +   7. To install the skin on the DNN site, begin by logging in as the SuperUser.

