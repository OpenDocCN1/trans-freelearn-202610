- pgno: 27
  md: '15. Click on Next. You will now see status messages as the database tables
    and stored procedures are created. At the end should be the message Installation
    of Database Complete. If the installation was successful, pat yourself on the
    back and click on Next.


    16. Now the wizard will create two users to start with: the SuperUser who controls
    the entire DNN installation and the Administrator user who administers the portals
    and has more limited privileges.


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_27_0.png)


    17. For the First Name, keep the default SuperUser.


    18. For the Last Name, type Account.


    19. Select a User Name (avoid the standard host for the username. It is too well
    known).


    20. Choose a good password and confirm it. Then write it down as you will need
    it later.


    21. Provide your Email Address to get system messages.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '22. Click on Next and provide the details for the Administrator user.


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_28_0.png)


    23. For the First Name, keep the default Administrator.


    24. For the Last Name, type Account.


    25. Select a User Name (avoid the standard admin for the username. It is too well
    known).


    26. Choose a good password and confirm it. Then write it down as you will need
    it later.


    27. Provide your Email Address to get system messages.


    28. Lastly, the wizard will prompt for the basic information for your site. Choose
    a title for your site and type it into Portal Title.


    29. Select Default Website for the Template.


    30. Click on Next.


    31. When you see the Congratulations screen, click on Finished (Goto Site) to
    complete the installation.


    32. After a pause you should see the Welcome screen to your new website. Congratulations!
    You have successfully installed and set up a DNN website.'
  merge: -1
