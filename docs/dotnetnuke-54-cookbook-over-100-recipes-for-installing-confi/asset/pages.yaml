- pgno: 281
  md: '# 9


    # Working with Foreign Languages


    +   - Downloading and installing a language pack

    +   - Creating a bilingual site with a single portal

    +   - Editing the language resource file

    +   - Creating your own module translations

    +   - Determining controls that need translations

    +   - Localizing labels, titles, panels, and links

    +   - Localizing a drop-down list with a stored procedure

    +   - Localizing a drop-down list with a DNN list

    +   - Localizing a stored procedure

    +   - Localizing a DataGrid control


    # Introduction


    As the world gets smaller everyday the ability for a website to support multiple
    languages becomes more important. Fortunately, DNN provides foreign language support
    through a process called Localization.


    DNN localization is built on the foundations of the .NET framework localization
    tools. As one language is often used in more than one country, foreign languages
    in .NET are organized by a locale code which is a combination of the language
    code and the country code. For example, the code `fr-CA` represents French spoken
    in Canada. `Fr-FR` represents French spoken in France.'
  merge: -1
  img_proc: true
