- pgno: 112
  md: '# How it works...


    Choosing a good module name is important. The Starter Kit uses the module name
    to create procedures and generate code. To choose a name for the module decide
    what is the most important thing the module will do and use a singular word to
    describe it. For example, *Employee* is a good name for a module that tracks the
    employees of a company.


    # There''s more...


    In this example we kept things simple and called the module **Employee**. In a
    professional development environment it is a better practice to use your company
    name or initials as a prefix to your module name (such as `YourCompany.Employee`).
    This prevents a collision between two modules from different companies that happen
    to have the same name.


    # See also


    The project wizard creates the files you need for a module, but you must edit
    these files before the project can deploy to a DNN site. See the other recipes
    in this chapter to create tables, procedure, and the necessary code changes.


    # Creating a database table with keys


    As DNN is a database driven **Content management system (CMS)**, it is likely
    your module will include one or more database *Tables*. A database table is used
    to hold information for your module. Similar to a spreadsheet, a table consists
    of columns called `Fields` and rows called `Records`. As we are creating a module
    called **Employee**, the fields in our table will hold employee information such
    as first and last name. Each record in the table will hold one employee.


    One of the things that makes a database table more powerful than a simple spreadsheet
    is its ability to automatically validate the information in the records. For example,
    it is important that each employee record in the table has a unique value that
    identifies the record (called the `Item ID`). The database can enforce the unique
    value with a `PRIMARY KEY` (named for the fact that the `Item ID` is the most
    important key to the employee record).


    Fortunately, the Starter Kit has already created the code to create an `Employee`
    table and the necessary keys. Looking in the Employee project you will find a
    script called `01.00.00.SqlDataProvider`. This creation script runs when your
    module is deployed to the DNN site and it has the responsibility for creating
    the tables, views, keys, and stored procedures that your module needs.'
  merge: -1
  img_proc: true
- pgno: 113
  md: "# Getting ready\n\nIn this recipe we will modify the creation script to create\
    \ a table called Employee along with the necessary keys. This script will create\
    \ the table when the module is deployed or you can copy and paste from the script\
    \ to the database directly so that the table exists while you are developing.\n\
    \nTo follow along with this recipe you must have completed the previous recipe\
    \ Creating a new module with the Starter Kit.\n\n# How to do it...\n\n+   1. Start\
    \ by launching your preferred development tool (Visual Studio or Visual Web Developer\
    \ Express).\n+   2. Look for Recent Projects shown on the left side of the screen.\
    \ Click on Employee to load the project.\n+   3. Look under the Solution Explorer\
    \ on the right side of the screen and double-click on 01.00.00.SqlDataProvider.\
    \ This will display the creation script in the editor.\n+   4. At the very top\
    \ of the file you will a see the CREATE TABLE section. The Starter Kit wizard\
    \ has already created a single CREATE TABLE statement along with a PRIMARY KEY,\
    \ an index, and a foreign key to the standard DNN module table. The script from\
    \ the wizard looks like this:\n\n```\n/** Create Table **/\n\nif not exists (select\
    \ * from dbo.sysobjects where id = object_id(N'{databaseOwner} [{objectQualifier}\
    \ YourCompany_Employee]') and OBJECTPROPERTY(id, N'IsTable') = 1)\nBEGIN\n   \
    \ CREATE TABLE\n        {databaseOwner} [{objectQualifier}YourCompany_Employee]\n\
    \    (\n        [ModuleID] [int] NOT NULL,\n        [ItemID] [int] NOT NULL IDENTITY(1,\
    \ 1),\n        [Content] [ntext] NOT NULL,\n        [CreatedByUser] [int] NOT\
    \ NULL,\n        [CreatedDate] [datetime] NOT NULL\n    )\n\n    ALTER TABLE {databaseOwner}\n\
    \    [{objectQualifier}YourCompany_Employee]\n        ADD CONSTRAINT [PK_{objectQualifier}YourCompany_Employee]\
    \ PRIMARY KEY CLUSTERED ([ItemID])\n    CREATE NONCLUSTERED INDEX\n        [IX_{objectQualifier}YourCompany_Employee]\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 114
  md: "```\nON {databaseOwner}][{objectQualifier}\nYourCompany_Employee] ([ModuleID])\n\
    \nALTER TABLE {databaseOwner}\n  [{objectQualifier}YourCompany_Employee] WITH\
    \ NOCHECK ADD\nCONSTRAINT [FK_{objectQualifier}\nYourCompany_Employee_{objectQualifier}\
    \ Modules] FOREIGN\nKEY ([ModuleID]) REFERENCES {databaseOwner}\n  [{objectQualifier}Modules]\
    \ ([ModuleID]) ON DELETE CASCADE\nNOT FOR REPLICATION\nEND\nGO\n```\n\n5. The\
    \ first thing we need to do is to change the text YourCompany in the script. Instead\
