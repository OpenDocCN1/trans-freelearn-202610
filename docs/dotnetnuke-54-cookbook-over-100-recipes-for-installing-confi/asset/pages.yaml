  md: "# Basic Skinning\n\n# How to do it...\n\n+   1. Start by locating the default\
    \ skin folder within your test DNN portal (`\\Portals\\_default\\Skins`).\n+ \
    \  2. Next, create a new folder to hold the skin files. Call this folder `SampleHTMLSkin`.\n\
    +   3. Launch the Development Tool.\n+   4. From the **File** menu, select **New\
    \ File...**.\n+   5. In the **New File** dialog, select **HTML Page** and click\
    \ on **Open**.\n+   6. This will give you a basic HTML file. Next, we need to\
    \ add a simple HTML table to lay out our page. To create the layout shown in the\
    \ sample diagram, our HTML table code should look like this:\n\n```\n```html\n\
    <!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Transitional//EN\"\n    \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
    >\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n<head>\n\n<link id=\"skin_css\"\
    \ href=\"skin.css\" type=\"text/css\"\n      rel=\"stylesheet\" />\n\n    <title>Untitled\
    \ Page</title>\n\n</head>\n<body>\n\n        <table width=\"100%\">\n        \
    \        <tr>\n                        <td width=\"60%\">\n                  \
    \              [MENU]\n                        </td>\n                       \
    \ <td width=\"40%\">\n                                [USER]\n\n             \
    \                   &nbsp;&nbsp;&nbsp;&nbsp;\n                               \
    \ [LOGIN]\n                        </td>\n                </tr>\n            \
    \    <tr>\n                        <td>\n```\n```"
  merge: -1
  img_proc: true
