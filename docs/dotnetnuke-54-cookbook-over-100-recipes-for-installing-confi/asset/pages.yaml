- pgno: 356
  md: "# # Deploying a new module version\n\nIn previous recipes we have seen how\
    \ to create and deploy a DNN module. But what happens when you have a new version\
    \ that you want to deploy? How do you redeploy a module so it upgrades the previous\
    \ version rather than replacing it?\n\nIn this recipe we will see how to assign\
    \ version numbers to a module and update the manifest file to create a seamless\
    \ module upgrade.\n\nThere are three things to consider when planning a module\
    \ upgrade:\n\n+   - What changes do you need to make to the database?\n+   - Has\
    \ the assemble (the DLL file) changed?\n+   - Have you added any new files (images,\
    \ forms, and so on)?\n\n# ## Getting ready\n\nTo follow along with this recipe\
    \ you must have completed the following recipe from *Chapter 5, Building, Debugging,\
    \ and Deploying Modules:*\n\n+   - *Deploying a module as a standalone package*\n\
    \nIn this recipe we will enhance the sample Employee project by adding three new\
    \ fields to the employee table: `DepartmentID`, `EmployeeURL`, and `SecurityLevel`.\
    \ This means adding new table columns, updating a stored procedure, and rewriting\
    \ the manifest file.\n\n# ## How to do it...\n\n+   1. We'll start by creating\
    \ a new `SqlDataProvider` script that will create the new fields in the database.\
    \ Launch the Development Tool and load the Employee project.\n+   2. In the Solution\
    \ Explorer, right-click on the Employee project.\n+   3. Select **New Item...**\
    \ from the **Add** pop-up menu.\n+   4. Pick **Text File** as the template and\
    \ called it `01.01.00.SqlDataProvider`.\n+   5. Click on **Add** to create the\
    \ file.\n+   6. To create the three new fields in the Employee table, add the\
    \ following code to the top of the file:\n\n```\n```sql\n/** Alter Table **/\n\
    \nif not exists (select * FROM syscolumns WHERE (name =\n    'DepartmentID') AND\
    \ (id = OBJECT_ID(N'{databaseOwner}\n    [{objectQualifier}ACME_Employee]')))\n\
    ```\n```"
  merge: -1
  img_proc: true
- pgno: 357
  md: "```\nBEGIN\n\nALTER TABLE {databaseOwner}][{objectQualifier}ACME_Employee]\n\
    ADD DepartmentID VARCHAR (30) ;\n\nALTER TABLE {databaseOwner}][{objectQualifier}ACME_Employee]\n\
    ADD EmployeeURL VARCHAR (120);\n\nALTER TABLE {databaseOwner}][{objectQualifier}ACME_Employee]\n\
    ADD SecurityLevel VARCHAR (30);\n\nEND\n\nGO\n```\n\n7. Next, we'll add the code\
    \ to drop the existing GetEmployeesByFilter procedure from version one and replaced\
    \ it with an improved version:\n\n```\n/** Drop Existing Stored Procedures **/\n\
    \nif exists (select * from dbo.sysobjects where id =\n    object_id(N'{databaseOwner}][{objectQualifier}\n\
    \    ACME_GetEmployeesByFilter]') and OBJECTPROPERTY(id,\n        N'IsProcedure')\
    \ = 1)\n    drop procedure {databaseOwner}{objectQualifier}ACME_\nGetEmployeesByFilter\n\
    GO\n```\n\n```\n/** Recreate stored procedure with new columns **/\n\nCREATE procedure\
    \ {databaseOwner}{objectQualifier}ACME_\nGetEmployeesByFilter\n@ModuleID int,\n\
    @MgrFilter int,\n@SalaryFilter  int,\n@PageIndex int,\n@PageSize int\nAS\n```\n\
    \n```\n/** If we pass -1 for a numeric filter it means ignore the filter **/\n\
    \nDECLARE @PageLowerBound int\n```"
  merge: -1
  img_proc: true
- pgno: 358
  md: "```\nDECLARE @PageUpperBound int\n\n/** Calculate the upper and lower bonds\
    \ based on the PageIndex and PageSize **/\n\nSET @PageLowerBound = @PageSize *\
    \ @PageIndex\nSET @PageUpperBound = @PageLowerBound + @PageSize + 1\n\n/** create\
    \ a temp table to hold the Ids of our results **/\n\nCREATE TABLE #PageIndex\n\
    (\n    IndexID    int IDENTITY (1, 1) NOT NULL,\n    ItemId     int\n)\n\n/**\
    \ populate the temp temp with the filtered results **/\n\nINSERT INTO #PageIndex\
    \ (ItemId)\nSELECT ItemId\nFROM {objectQualifier}ACME_Employee\nWHERE (ModuleId\
    \ = @ModuleId) AND  (ManagerNo = @MgrFilter OR @MgrFilter = -1) AND (Salary >=\
    \ @SalaryFilter)\nORDER BY ItemId DESC\n\n/** remember the count of the results\
    \ **/\n\nSELECT COUNT(*) as TotalRecords\nFROM #PageIndex\n\n/** join the filtered\
    \ Ids to the employee table to get our fields **/\n\nselect {objectQualifier}ACME_Employee.ModuleId,\n\
    \       {objectQualifier}ACME_Employee.ItemId,\n       EmpFirstName,\n       EmpLastName,\n\
    \       ManagerNo,\n       HireDate,\n       Salary,\n       DepartmentID,\n```"
  merge: -1
  img_proc: true
- pgno: 359
  md: "```\nEmployeeURL,\nSecurityLevel,\n{objectQualifier}ACME_Employee.CreatedByUser,\n\
    {objectQualifier}ACME_Employee.CreatedDate,\n'CreatedByUserName' = {objectQualifier}Users.FirstName\
    \ + ' ' + {objectQualifier}Users.LastName\nFROM {objectQualifier}ACME_Employee\n\
    INNER JOIN {objectQualifier}Users on\n    {objectQualifier}ACME_Employee.CreatedByUser\
    \ =\n    {objectQualifier}Users.UserId\nINNER JOIN #PageIndex PageIndex\nON {objectQualifier}ACME_Employee.ItemId\
    \ = PageIndex.ItemId\nWHERE ( (PageIndex.IndexID > @PageLowerBound) OR\n     \
    \   @PageLowerBound is null )\n    AND ( (PageIndex.IndexID < @PageUpperBound)\
    \ OR\n        @PageUpperBound is null )\nORDER BY\n    PageIndex.IndexID\nGO\n\
    ```\n\n+   8. Next we need to update the manifest file to include the new 01.01.00.\
    \ SqlDataProvider file. Double-click to open the Employee.dnn file.\n\n+   9.\
    \ At the top of the file, update the version number to 01.01.00:\n\n```\n<packages>\n\
    \  <package name=\"ACME.Employee\" type=\"Module\"\n          version=\"01.01.00\"\
    >\n    <friendlyName>ACME Employees</friendlyName>\n```\n\n+   10. Scroll down\
    \ until you see the <scripts> section and add the following code:\n\n```\n<scripts>\n\
    \  <basePath>DesktopModules\\ACME.Employee</basePath>\n  <script type=\"Install\"\
    >\n    <name>01.00.00.SqlDataProvider</name>\n    <version>01.00.00</version>\n\
    \  </script>\n  <script type=\"Install\">\n    <name>01.01.00.SqlDataProvider</name>\n\
    \    <version>01.01.00</version>\n  </script>\n  <script type=\"UnInstall\">\n\
    \    <name>Uninstall.SqlDataProvider</name>\n    <version>01.00.00</version>\n\
    \  </script>\n</scripts>\n```"
  merge: -1
  img_proc: true
- pgno: 360
  md: "11. The last change for the manifest is to update the version number on the\
    \ assembly:\n\n```\n<assemblies>\n    <assembly>\n        <path>bin</path>\n \
    \       <name>Employee.dll</name>\n        <version>01.01.00</version>\n    </assembly>\n\
    </assemblies>\n```\n\n12. Select Save All from the File menu to save your changes.\n\
    \n13. Rebuild the project and create an installation ZIP file according to the\
    \ instructions in the recipe Deploying a module as a standalone package from Chapter\
    \ 5, Building, Debugging, and Deploying Modules. Include both the 01.00.00 and\
    \ 01.01.00 SqlDataProvider files.\n\n14. Name the new ZIP file Employee_01.01.00_Install.zip.\n\
    \n15. The Employee_01.01.00_Install.zip file should now contain the following:\n\
    \n| Name | Type | Packe... | Has ... | Size |\n|---|---|---|---|---|\n| App_LocalResources\
    \ | File Folder | 0 KB |  | 0 KB |\n| Bin | File Folder | 0 KB |  | 0 KB |\n|\
    \ EditEmployee.ascx | ASP.NET User Control | 1 KB | No | 4 KB |\n| Settings.ascx\
    \ | ASP.NET User Control | 1 KB | No | 1 KB |\n| ViewEmployee.ascx | ASP.NET User\
    \ Control | 2 KB | No | 5 KB |\n| Employee.dnn | DNN File | 2 KB | No | 6 KB |\n\
    | 01.00.00.SqlDataProvider | SQLDATAPROVIDER File | 2 KB | No | 8 KB |\n| 01.01.00.SqlDataProvider\
    \ | SQLDATAPROVIDER File | 1 KB | No | 3 KB |\n| Employee.SqlDataProvider | SQLDATAPROVIDER\
    \ File | 1 KB | No | 3 KB |\n| Uninstall.SqlDataProvider | SQLDATAPROVIDER File\
    \ | 1 KB | No | 2 KB |\n\n16. To check the results, log in as SuperUser and use\
    \ the Install Extension Wizard to deploy the new ZIP file. The module should install\
    \ over the existing module without error.\n\n17. You can use the Database Explorer\
    \ in the Development tool to confirm the upgrade added the new columns:"
  merge: -1
  img_proc: true
- pgno: 361
  md: '![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_361_0.png)


    18. The Database Explorer will also show the updated stored procedure.


    # How it works...


    It is important that you think carefully about the changes you need to make in
    your module upgrade. Keep in mind you must perform the upgrade without affecting
    the previous module versions. For example, to add columns to the Employee table
    we used the ALTER TABLE command rather than the DROP TABLE command. This preserves
    any records that might already be in the table.


    Incremental updates like this are tricky and should be well tested before releasing
    your update. They also require a solid understanding of SQL.


    # There''s more...


    In this example we did not create any new objects so the original uninstall file
    still applies. If we create a new table for example, then we have to update the
    uninstall file with a new version number. As we never do incremental uninstalls,
    we only need to have one uninstall file.


    # Using multiple database connections


    There are some situations when you need to access a database that is not the one
    running the DNN installation. Perhaps you need to run a query against a legacy
    database or extract information from a different company database.'
  merge: -1
  img_proc: true
- pgno: 362
  md: "In this recipe we will see how to create a second database connection and use\
    \ it to populate the **Manager** drop-down list from the recipe *Populating a\
    \ drop-down list from a stored procedure*.\n\nFor this recipe we will use the\
    \ sample Northwind database that comes with MS Access.\n\n# Getting ready\n\n\
    To follow along with this recipe you must have completed the following recipe\
    \ from *Chapter 6, Data Entry Tricks*:\n\n+   - *Populating a drop-down list from\
    \ a stored procedure*\n\n# How to do it...\n\n+   1. Download the sample Northwind\
    \ database from the Microsoft site by going to http://www.microsoft.com/downloads\
    \ and searching for **Northwind Traders Sample Database.**\n+   2. Select **Access\
    \ 2000 Tutorial: Northwind Traders Sample Database** and click on the **Download**\
    \ button to begin the download.\n+   3. When prompted, select Run and agree to\
    \ the install and license agreement.\n+   4. Place the file on the C drive (c:\\\
    Nwind.mdb) of the DNN server.\n+   5. Look on the DNN server and locate the root\
    \ folder of the DNN installation.\n+   6. Find the web.config file and open it\
    \ in a text editor.\n+   7. Scroll down through the file until you see <connectionStrings>\
    \ and add the following key:\n+   ```\n+   <add name=\"LegacyAccess\"\n+     \
    \  connectionString=\"Provider=Microsoft.Jet.OLEDB.4.0;Data Source=C:\\Nwind.mdb;\
    \ User Id=admin;Password=\" />\n+   ```\n+   8. Next, double-click to open the\
    \ ViewEmployee.ascx.vb file.\n+   9. As we are accessing an old MS Access database\
    \ in this recipe, we need to use the OLE DB provider. So start by adding the necessary\
    \ import directive at the top of the file:\n+   ```\n+   Imports System.Data.OleDb\n\
    +   ```\n+   10. Next we'll create a new routine to connect to the MS Access database\
    \ file using the connection string we saved in the web.config file. Scroll down\
    \ to the bottom of the Public Methods region and add the following code:\n+  \
    \ ```\n+   Public Function GetLegacyManagers() As OleDbDataReader\n+   \n+   \
    \    Dim sqlConn As OleDbConnection\n+       Dim sqlCmd As OleDbCommand\n+   \
    \    Dim strConnection As String\n+   ```"
  merge: -1
  img_proc: true
