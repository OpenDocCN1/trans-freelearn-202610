- pgno: 407
  md: '11. On the left side you will see a small block with text. Clicking on the
    widget text will cause the text in the DIV to fade out:


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_407_0.png)


    # How it works...


    This custom ACME.SampleWidget fades elements by using a simple JavaScript click
    handler that dynamically modifies the Opacity of the DIV element containing the
    sample text when you click on it. That is enough to demonstrate how the custom
    widgets work, but a more complicated example would require a good bit more JavaScript
    and a more in-depth discussion of JavaScript programming.


    > Creating custom DNN widgets is really an art all to itself. You can learn more
    about crafting your own widgets from this excellent blog by Nik Kalyani: http://www.kalyani.com/2009/12/dotnetnuke-widgets-guide-part-1-of-4.


    # Using the rounded corner Super Stylesheet


    Super Stylesheets is a new feature in DNN version 5 that offers ways to reuse
    HTML layouts by maximizing the use of CSS. At the time of this writing there are
    three super stylesheets available: the Yahoo YUI Library, the DNN layouts stylesheet,
    and the rounded corners stylesheet.


    In this recipe we will demonstrate how to import and use the rounded corners stylesheet
    to create a graphic box around skin content.


    To achieve the box effect, we start with a set of custom images for the box border,
    then create a set of nested DIVs in the skin and then use the dnn-roundedcorners.css
    file provided by DNN to link the graphic images to the DIV elements. This is very
    similar to the recipe Styling a container with images from Chapter 8, Basic Skinning
    but this time the rounded Corners stylesheet will position the images using CSS
    instead of an HTML table.'
  merge: -1
  img_proc: true
- pgno: 408
  md: '# Getting ready


    To follow along with this recipe you must have completed the following recipe
    from Chapter 8, Basic Skinning:


    +   - Creating a simple ASCX skin


    When all the pieces are in place the graphic box will look like this:


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_408_0.png)


    # How to do it...


    +   1. Find the folder called `SampleASCXSkin` that was created in the recipe
    *Creating a simple ASCX skin*.

    +   2. Create a new folder inside to hold the images called `\images`.

    +   3. We''ll use some images to make the border of the box. In this example we''ll
    use the following images:


    +   - `box_e.png`: The right side of the graphic box

    +   - `box_n.png`: The first top side of the graphic box

    +   - `box_ne.png`: The upper-right corner of the graphic box

    +   - `box_nw.png`: The upper-left corner of the graphic box

    +   - `box_s.png`: The bottom of the graphic box

    +   - `box_se.png`: The lower-right corner of the graphic box

    +   - `box_sw.png`: The lower-left corner of the graphic box

    +   - `box_w.png`: The left side of the graphic box'
  merge: -1
  img_proc: true
- pgno: 409
  md: '![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_409_0.png)


    4. With the images in the correct folder, launch the Development Tool.


    5. Select Open File... from the File menu and open the skin.css file.


    6. Add an import statement at the top of the file to bring in the DNN roundedcorners.css
    file. If DNN is running on the localhost then the code would be:


    ```

    @import url("http://localhost/dotnetnuke/resources/shared/stylesheets/dnn-roundedcorners.css");

    ```


    7. Below that, add the following code to link the images to the style elements
    from DNN:


    ```

    .RoundedCorners .N{background-image: url("images/box_n.png"); }

    .RoundedCorners .NE{background-image: url("images/box_ne.png"); }

    .RoundedCorners .E{background-image: url("images/box_e.png"); }

    .RoundedCorners .SE{background-image: url("images/box_se.png"); }

    .RoundedCorners .S{background-image: url("images/box_s.png"); }

    .RoundedCorners .SW{background-image: url("images/box_sw.png"); }

    .RoundedCorners .W{background-image: url("images/box_w.png"); }

    .RoundedCorners .NW{background-image: url("images/box_nw.png"); }

    /* General Styles */

    ```


    8. Now that the stylesheet is set, the next step is to modify the control. Select
    Open File... from the File menu and open the SampleASCXSkin.ascx file.'
