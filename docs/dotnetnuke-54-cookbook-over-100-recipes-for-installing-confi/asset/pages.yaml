- pgno: 285
  md: '# See also


    In this recipe we saw how enabling a language pack will automatically localize
    certain shared resources. See the other recipes in this chapter to learn how to
    localize other resources.


    # Editing the language resource file


    DNN provides the ability to edit the language resources installed on your portal.
    This means you can modify the labels, systems messages, and other text that appears
    on the pages. Not only does this provide support for multiple languages, but it
    also means you can customize these messages with your own text (for example, changing
    "Login" to "Sign On").


    With DNN there are three levels of language resource support:


    +   - **Shared (Application):** These are translation strings shared throughout
    the controls in DNN, text such as "Update", "Cancel", or common system message
    strings.

    +   - **Local:** These are translation strings unique to a user control.

    +   - **Global:** These are translation strings for shared components that fall
    somewhere between Application and Local.


    In addition, DNN provides resource files at the Portal, Host, or System level.
    For example, this means even within the same language, you can have different
    strings displayed on different portals on your site.


    In this recipe, we will see how to modify the shared resources file by logging
    in as SuperUser and changing the text of the **Results Per Page** control used
    in the sample Employee project.


    # Getting ready


    To follow along you must have completed the following recipe from *Chapter 6:*


    +   - *Displaying a Datagrid with filter controls*


    # How to do it...


    +   1. Log in as SuperUser (*syshost* in our examples).

    +   2. Look under the **Admin** menu and select **Languages**. The installed language
    packs for your portal are shown.

    +   3. We''ll edit the English language in this example. Click on the edit icon
    (the little pencil) next to English under Portal.'
  merge: -1
  img_proc: true
