  img_proc: true
- pgno: 303
  md: "4. We'll start by changing the procedure to add the desired locale as a parameter:\n\
    \n```\n```sql\nCREATE procedure {databaseOwner}{objectQualifier}ACME_GetEmployeesByFilter\n\
    \    @ModuleID int,\n    @MgrFilter int,\n    @SalaryFilter int,\n    @CurrentLocale\
    \ nvarchar(30),\n    @PageIndex int,\n    @PageSize int\nAS\n```\n```\n\n5. Next,\
    \ we will change the SQL query to apply a fixed exchange rate to the employee\
    \ salaries when the locale is French Canadian:\n\n```\n```sql\n/** join the filtered\
    \ Ids to the employee table to get our fields\n**/\n\nselect {objectQualifier}ACME_Employee.ModuleId,\n\
    \       {objectQualifier}ACME_Employee.ItemId,\n       EmpFirstName,\n       EmpLastName,\n\
    \       ManagerNo,\n       HireDate,\n       CASE @CurrentLocale WHEN 'fr-CA'\
    \ THEN Salary * 1.02642 ELSE\n                            Salary END As Salary,\n\
    \       {objectQualifier}ACME_Employee.CreatedByUser,\n       {objectQualifier}ACME_Employee.CreatedDate,\n\
    \       'CreatedByUserName' = {objectQualifier}Users.FirstName + '\n         \
    \    ' + {objectQualifier}Users.LastName\nFROM {objectQualifier}ACME_Employee\n\
    INNER JOIN {objectQualifier}Users on {objectQualifier}ACME_Employee.CreatedByUser\
    \ =\n     objectQualifier}Users.UserId\n     INNER JOIN #PageIndex PageIndex\n\
    \          ON {objectQualifier}ACME_Employee.ItemId = PageIndex.ItemId\n     WHERE\
    \ (PageIndex.IndexID > @PageLowerBound) OR\n           @PageLowerBound is null\
    \ )\n       AND ( (PageIndex.IndexID < @PageUpperBound) OR\n             @PageUpperBound\
    \ is null )\n     ORDER BY\n          PageIndex.IndexID\n\nGO\n```\n```"
  merge: -1
  img_proc: true
- pgno: 304
  md: "# Working with Foreign Languages\n\n+   6. Next, open the `DataProvider.vb`\
    \ file and replace the `GetEmployeesByFilter` abstract method with this new version\
    \ that has the `CurrentLocale` as a parameter:\n\n```\nPublic MustOverride Function\
    \ GetEmployeesByFilter(ByVal ModuleId As Integer, ByVal MgrFilter As Integer,\
    \ ByVal SalaryFilter As Integer, ByVal CurrentLocale As String, ByVal PageIndex\
    \ As Integer, ByVal PageSize As Integer) As IDataReader\n```\n\n+   7. Repeat\
    \ the process in the `SqlDataProvider.vb` file. Replace the entire `GetEmployeesByFilter`\
    \ function with this new version:\n\n```\nPublic Overrides Function GetEmployeesByFilter(ByVal\
    \ ModuleId As Integer, ByVal MgrFilter As Integer, ByVal SalaryFilter As Integer,\
    \ ByVal CurrentLocale As String, ByVal PageIndex As Integer, ByVal PageSize As\
    \ Integer) As IDataReader\n    Return CType(SqlHelper.ExecuteReader(ConnectionString,\
    \ GetFullyQualifiedName(\"GetEmployeesByFilter\"), ModuleId, MgrFilter, SalaryFilter,\
    \ CurrentLocale, PageIndex, PageSize), IDataReader)\nEnd Function\n```\n\n+  \
    \ 8. Next, open the `EmployeeController.vb` file and replace the first part of\
    \ the `GetEmployeesByFilter` function with this new code:\n\n```\nPublic Function\
    \ GetEmployeesByFilter(ByVal ModuleId As Integer, ByVal MgrFilter As Integer,\
    \ ByVal SalaryFilter As Integer, ByVal CurrentLocale As String, ByVal PageIndex\
    \ As Integer, ByVal PageSize As Integer, ByRef TotalRecords As Integer) As ArrayList\n\
    \    Dim dr As IDataReader = DataProvider.Instance.GetEmployeesByFilter(ModuleId,\
    \ MgrFilter, SalaryFilter, CurrentLocale, PageIndex, PageSize)\n    Dim retValue\
    \ As ArrayList = Nothing\n    Try\n        While dr.Read\n            TotalRecords\
    \ = Convert.ToInt32(dr(\"TotalRecords\"))\n        End While\n        dr.NextResult()\n\
    \        retValue = CBO.FillCollection(dr, GetType(EmployeeInfo))\n    Finally\n\
    \        If Not dr Is Nothing Then\n            dr.Close()\n        End If\n \
    \   End Try\n    Return retValue\nEnd Function\n```\n\n+   9. Lastly, open the\
    \ `ViewEmployee.ascx.vb` file."
