- pgno: 128
  md: '# Creating your Own Modules


    # How it works...


    Completing this recipe creates the procedures used by the database and business
    logic layers. Using Procedures to connect to the database frees our code from
    having to call the database directly using SQL. It provides a better separation
    of the database logic and the business logic.


    # Creating an uninstall script


    When the Starter Kit creates a module it also builds an uninstall script that
    is run when you uninstall a module from DNN. This script is responsible for removing
    all the things created by your module: stored procedures, databases, views, tables,
    and so on.


    In this recipe we will take the uninstall script created by the Starter Kit and
    change the company name to match the company name used in the install script.


    # Getting ready


    To follow along with this recipe you must have completed the previous recipe _Creating
    a new module with the Starter Kit_


    # How to do it...


    +   1. Start by launching your preferred development tool (Visual Studio or Visual
    Web Developer Express).

    +   2. Look for **Recent Projects** shown on the left side of the screen. Click
    on **Employee** to load the project.

    +   3. Look under the **Solution Explorer** on the right side of the screen and
    double-click on `Uninstall.SqlDataProvider`. This will display the uninstall script
    in the editor.

    +   4. The only thing we need to do is change the text `YourCompany_` in the script.
    Instead of `YourCompany` you can place your actual company name or initials. We
