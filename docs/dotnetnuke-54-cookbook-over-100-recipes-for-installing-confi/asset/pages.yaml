- pgno: 205
  md: '# Cool Web Controls


    In this chapter we will cover the following topics:


    +   - Adding web controls to your Toolbox

    +   - Showing an e-mail link in a Datagrid

    +   - Showing checkboxes in a Datagrid

    +   - Showing a thumbnail image in a Datagrid

    +   - Creating labels you can edit

    +   - Suggest text while typing

    +   - Showing data in a Treeview

    +   - Using a Tabstrip to separate content

    +   - Using a CAPTCHA control for security

    +   - Creating a multi-state checkbox


    # Introduction


    One of the powerful features of DNN is the variety of flexible and reusable controls
    that are available for custom module development. These include many of the web
    controls seen on the core DNN pages, controls such as editable labels, tree views,
    CAPTCHA controls, and Tab controls. In this chapter, we will see how to add these
    web controls to custom modules and tie them to the tables in the database.


    In general, using these controls requires four simple steps:


    +   - Adding the control code to the View or Edit `.ascx` file

    +   - Adding a new property to the info object that will supply the values for
    the control

    +   - Binding the control to the values

    +   - Capturing the value from the control and saving to the database (if Edit
    page)'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# Cool Web Controls


    As the recipes in this chapter focus on web controls and values from the database,
    it is necessary that you have built and deployed the sample Employee module from
    *Chapter 6*. We will also extend the Datagrid from the *Chapter 6* and show the
    different kinds of columns it can display.


    # Adding web controls to your Toolbox


    If you frequently use the visual editor in the development tool to layout your
    pages, this short recipe will show you how to add the DNN web controls to the
    Toolbox.


    # How to do it...


    +   1. Launch the Development Tool.

    +   2. Change the editor to Design mode.

    +   3. Make sure the toolbox is displayed.

    +   4. Right-click on the toolbox and select **Choose Items...**.

    +   5. Click on the **Browse** button.

    +   6. Navigate to the `/bin` folder within the DNN source (`DNNSource/website/bin`).


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_206_0.png)


    +   7. Select the DotNetNuke.Webcontrols.dll and click on **Open**.

    +   8. Make sure the DNN controls are checked and click on **OK**.

    +   9. The web controls will now appear under the **General** section of the toolbox
    when you edit your code.'
  merge: -1
