- pgno: 30
  md: '4. The first thing you''ll notice is the Control Panel across the top of the
    page. It contains useful tools to maintain the site divided into four categories:
    Common Tasks, Current Page, Admin, and Host. Some of these tools are also available
    under the host or admin menus, but they''re easier to find here in the Control
    Panel.


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_30_0.png)


    5. Click on Admin to display the Admin tasks and click on the Site Settings icon
    in the upper-left corner.


    6. This presents the Site Settings form. This is a typical data entry form in
    DNN. You have fields with labels, but also titles such as Basic Settings with
    little minus signs next to them. These are collapsible panels. You can hide parts
    of the form by clicking on the minus sign. You''ll also see small Help icons next
    to all the fields. Clicking on these might provide more information about the
    field.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# Site Settings


    # Basic Settings


    In this section, you can set up the basic settings for your site.


    # Site Details


    7. Start filling out this form with the following information:


    +   - Title: My Own Personal DNN Website

    +   - Description: My first DNN site

    +   - Copyright: Copyright 2010 by DNN Newbee


    8. Click on the small plus sign next to Appearance to expand the panel and display
    fields dealing with the appearance of the site.


    9. You can upload your own logo to the site by clicking on the Upload File link
    next to the Logo: prompt.


    # Appearance


    10. This will make a Browse button and two new links appear. Click on the Browse
    button.


    11. When the Choose File dialog appears, navigate through your files and pick
    an image file to upload. In general, logo images look best if they are wide, but
    not too tall. Approximately 300 by 100 pixels.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '+   12. Click on **OK** to close the File dialog.

    +   13. Then click on the **Save File** link to actually bring your file up to
    the web server for DNN to display. The name of the file will now appear in the
    form.


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_32_0.png)


    14. Click on **Update** at the very bottom of the page to save your changes.


    # How it works...


    The **Site Settings** page has a variety of options you can set, many of which
    will be explored in later chapters. Feel free to try different options. If it
    doesn''t look right you can come back to this screen and change it back.


    # Choosing a skin for the site


    This is a quick and easy recipe for changing the color scheme (called the "Skin")
    of your DNN site. When you download DNN it comes with a basic skin. However, you
    can download different skins selecting the one which you want your visitors to
    see. You may even opt for a different skin for the site administrator.


    # Getting ready


    The typical installation of DNN has only one skin. In order to follow this recipe
    you will need to download at least one other skin to switch. If your site has
    only one skin you can still follow along to see how to change it. Or try the recipe
    *Downloading an extension (skin or module)* to download more skins for your site
    then come back and see how to change them.


    # How to do it...


    +   1. Log in as Portal Administrator (`sysadmin` in our example).'
  merge: -1
  img_proc: true
- pgno: 33
  md: "+   2. From the **Admin** menu, select **Skins**.\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_33_0.png)\n\
    \n+   3. Look for the drop-down list showing the available skins that have been\
    \ installed on your site. If you don't see the skin you want, refer to the recipe\
    \ *Downloading an extension (skin or module)* to install more skins.\n+   \n+\
    \   4. Select the skin you want from the drop-down list. Samples of the skin will\
    \ then be displayed.\n+   \n+   5. Click on **Preview** to see what your site\
    \ would look like with the selected skin.\n+   \n+   6. If you like how it looks,\
    \ click on **Apply** to apply the skin to your site.\n+   \n+   7. If you want\
    \ to have a different skin just for the Administrator user, then find the two\
    \ checkboxes labeled **Portal** and **Admin**. Uncheck **Portal** and leave **Admin**\
    \ checked, then apply the skin as described."
  merge: -1
  img_proc: true
- pgno: 34
  md: '# How it works...


    A skin in DNN is a kind of layout. Visual elements in DNN like the login link,
    the copyright phrase, and the site logo appear to the skin as simple tokens that
    are easily repositioned in the layout. The purpose of a skin is to separate the
    functionality of your site from the visual layout. It allows the artists to design
    the site without having to worry about how the code works; in turn the programmers
    can code the site without having to worry about how the graphics work. It provides
    a consistent look all over the pages of your website.


    # See also


    See the next recipe for more ways to change the visual appearance of your site.


    # Choosing a container for the site


    The skin controls the layout and color scheme of your site but the actual content
    of your DNN site (the blogs, news articles, and so on) are contained inside visual
    blocks called Containers. Containers help you lay out your site but you can also
    choose a visual style for these containers in the same way you pick a visual style
    for the page itself.


    # How to do it...


    +   1. Log in as Portal Administrator (`sysadmin` in our example).

    +   2. From the Admin menu, select **Skins**.

    +   3. Look for the drop-down list showing the available skins that have been
    installed on your site.

    +   4. Select a skin from the drop-down list. Samples of the skin will then display
    along with the containers within the skin.


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_34_0.png)'
  merge: -1
  img_proc: true
- pgno: 35
  md: '+   5. Look over the available containers and click on **Preview** to see what
    your site would look like with the selected container.

    +   6. If you like how it looks, click on **Apply** to apply the container to
    your site.

    +   7. If you want to have a different container just for the Administrator user,
    then find the two checkboxes labeled **Portal** and **Admin**. Uncheck **Portal**
    and leave **Admin** checked, then apply the container as above.


    # How it works...


    Containers are usually found within skins so the styles available for the containers
    are determined by the skin you have chosen. That is why you have to pick a skin
    before you can see the available containers. However, DNN is very flexible, allowing
    you to assign one skin to the pages of your site but also allowing the use of
    containers from a totally different skin. You are free to mix and match containers
    and skins to achieve the best appearance for your site.


    # See also


    For more information on how to change the appearance of your site pages, see the
    recipe *Choosing a skin for the site.*


    # Adding a module to a page


    A module in DNN is a way to organize content into easy-to-use (and easy to reuse)
    plugins. You create a forum or a blog once, but you can "plug it in" to any page
    in your site as many times as you like. That is how you build your site by creating
    pages and plugging in whatever modules you have.


    # Getting ready


    The only thing you need for this recipe is a page in your site. You can add modules
    to your home page or create a new page to hold your module. In this example we''ll
    add a Banner Ads module to a new page called **Our Sponsors.**'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# Installation and Setup


    # How to do it...


    +   1. Log in as Portal Administrator (`sysadmin` in our examples).

    +   2. Make sure the Control Panel is displayed across the top of the page (the
    Control Panel is the set of icons you see when you are logged in as administrator).


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_36_0.png)


    +   3. Click on the **New** icon on the left side. This will create a new page.

    +   4. For the **Page Name**, use Our Sponsors.

    +   5. For the **Page Title**, use Our Sponsors.

    +   6. Leave the rest as default and click on **Update** to create the page.

    +   7. Next, look at the top center of the Control Panel and make sure **Add Module:
    New** is selected.

    +   8. Locate the drop-down list that appears next to the **Module:** prompt.
    Select **Banners**.

    +   9. Find the drop-down list next to the **Pane:** prompt and make sure **ContentPane**
    is selected.

    +   10. In the **Title** box, type A Word from Our Sponsors.

    +   11. In the drop-down list labeled **Insert:** make sure **Bottom** is displayed.

    +   12. Click on the **Add Module** button to insert the Banners module into the
    page you’re looking at.

    +   13. That''s all there is to it. Once a module is added to a page you must
    set the options for the module before you use it. For more details on setting
    up specific modules, see *Chapter 3, Easy tricks with existing modules.*


    # How it works...


    Adding a module to a page is a simple task and one you will do often. Building
    a website in DNN is merely adding modules to pages to create the features you
    need.


    The Control Panel offers other options for positioning the module on the page.
    The example used ContentPane (which is the center pane) but you can also position
    modules in the left, right, top, and bottom panes.'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'When you already have modules on the page, the Insert drop-down list controls
    whether the new module should appear above or below the existing modules. Again
    these are just options to help position the module on the page you''ve selected.
    Feel free to experiment with module positioning to get a better feel for what
    looks good on your site.


    # Installing standard DNN modules


    DNN comes out of the box with many modules, but only the most popular are installed
    at first. This was a conscious decision by the makers of DNN so that new DNN websites
    would not be bogged down running a lot of modules that were not needed. This makes
    for an efficient install, but it also means you''ll want to install several standard
    modules once your site is created.


    # How to do it...


    +   1. Log in as a SuperUser (syshost in our examples).

    +   2. Look at the Control Panel and make sure you''re in Edit mode.

    +   3. Look under the Host menu and select Extensions.

    +   4. Scroll to the bottom and click on the link Install Available Extensions
    or hover the mouse over the module action menu and select it.


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_37_0.png)


    +   5. Check the modules you want to install. For the recipes in this book, select
    the following modules:

    +     □ Announcements

    +     □ Blog

    +     □ Documents

    +     □ Events

    +     □ FAQs'
  merge: -1
  img_proc: true
- pgno: 38
  md: '+   - Forum

    +   - IFrame

    +   - Links

    +   - Reports

    +   - Wiki


    6. Scroll to the bottom of the page and click on **Install Selected Extensions.**


    7. Now each of these modules will appear in the Control Panel.


    # How it works...


    By installing these additional modules you have many more features you can place
    on your pages.


    # Downloading an extension (skin or module)


    Extensions in DNN consist of a set of files put together in a compressed folder
    (also called a ZIP file). To install a new extension you just provide the ZIP
    file and the DNN extension wizard will do the rest. Only the SuperUser can install
    new skins and modules.


    A good way to get new extensions for your DNN site is to download them from the
    Internet. Sometimes they are free or cost only a nominal amount. In later chapters
    you will see how to make your own extensions. No matter how you get your extensions
    it will consist of a single ZIP file that you need to upload to the DNN server
    and install before it will appear in the Control Panel drop-down lists as we saw
    in Adding a module to a page.


    Popular sites for downloading DNN extensions are www.codeplex.com (free open source
    modules), DotNetNuke Forge (www.dotnetnuke.com), and www.snowcovered.com (mainly
    commercial modules). You may need to register for an account with the site, but
    the registration is free.


    This recipe will show how to download an extension (a free skin in this example)
    but the process is basically the same for all different extension types (such
    as modules and foreign language packs).


    # How to do it...


    +   1. Open your favorite browser and go to www.snowcovered.com.

    +   2. Find the **Register** link at the top of the screen (next to the **Help**
    icon) and click on it. If you already have an ID on this site, you can click on
    **Login**, provide your username and password, and skip to step 4.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '3. Fill in your name and pick a Username and Password to use with this site.
    Fill in any other required fields and click on Register.


    4. After a successful login or registration, you will see the Welcome page, showing
    the most recent modules and skins. In the upper left corner, click on DotNetNuke
    5 in the list of Browse links.


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_39_0.png)


    5. This will show a list of all the modules and skins for DNN 5. We''re looking
    to get a free skin, so find and click on the Skins link in the Browse list to
    the upper left.


    6. Next, locate the drop-down list that says Release Date and select Price: Low
    to High. Then click on the Sort link. This will show the free skins first.


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_39_1.png)


    7. Look over the free skins and pick one you think will look nice on your site.
    In this example we''ll pick one called Greyt ness, but you can pick whichever
    one you like. Click on it to go to the skin detail screen.


    8. Examine the details of the skin (especially the price which will be $0 if it
    is a free skin). Then click on the Add to Cart link on the right side of the page.


    9 A message will confirm the skin is added to your cart. Now click on the link
    called View Cart to complete the transaction.'
  merge: -1
  img_proc: true
