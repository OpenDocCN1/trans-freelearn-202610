    none; font-family: Verdana, Arial, Helvetica, sans-serif; font-\nweight: normal;}\n\
    a:hover                      {color: #C00; text-decoration:\nnone;}\n\n/* Styles\
    \ for Controlling the Layout */\n.template_style              {width: 960px; margin:\
    \ auto;}\n.content                     {background: white; border-left:\nsolid\
    \ 1px #EAEAEA; border-right: solid 1px #EAEAEA; padding: 10px;\nmargin: 0 5px\
    \ 0 5px;}\n```\n```\n\n+   13. Select **Save StyleSheet1.css As...** from the\
