    \    @HireDate,\n    @Salary,\n    @UserID,\n    getdate()\n)\n```\n\n+   16.\
    \ So the entire procedure should be:\n\n```\ncreate procedure {databaseOwner}{objectQualifier}\n\
    \                         ACME_AddEmployee\n\n    @ModuleId       int,\n    @EmpFirstName\
    \   nvarchar(30),\n    @EmpLastName    nvarchar(30),\n    @ManagerNo      int,\n\
    \    @HireDate       datetime,\n    @Salary         float,\n    @UserID      \
