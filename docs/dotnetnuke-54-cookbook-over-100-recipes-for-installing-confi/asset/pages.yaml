    # Using Active Directory with DNN


    As we saw in Chapter 2, Managing Users and Site Setup, DNN comes with built-in
    user security with roles and grants. This is fine in many cases, but sometimes
    your DNN site is located on a network that already has Active Directory (AD) security.
    How can you configure a DNN portal to use the existing security and not have to
    recreate all the AD users?


    The answer is to add the Active Directory Authentication provider to work along
    with the DNN security provider. In this way you can log in with user names defined
    in DNN or in Active Directory.


    In this recipe we will see how to configure a DNN portal to use Active Directory
    authentication along with the default DNN authentication.


    # Getting ready


    To follow along with this recipe you''ll need access to a network that uses Active
    Directory with a valid username and password. Note that on some networks access
    to Active Directory may be restricted. Check with the network administrator if
    you have trouble using this recipe.'
  merge: -1
  img_proc: true
