- pgno: 116
  md: "There are several reasons to use stored procedures instead of directly putting\
    \ the SQL in the project code. For one, stored procedures generally perform better;\
    \ also the code is easier to maintain than hard-coded SQL and we benefit from\
    \ the increased encapsulation. If the code is only working with database tables\
    \ and records, it makes sense to leave it in the database.\n\nIn this recipe we\
    \ will show how to modify the wizard-generated code to perform the actual add,\
    \ update, and deletes your module needs.\n\n# Getting ready\n\nTo follow along\
    \ with this recipe you must have completed these previous recipes:\n\n+   - Creating\
    \ a new module with the Starter Kit\n+   - Creating a database table with keys\n\
    \n> In this recipe we will again locate and replace any occurrences of the phrase\
    \ YourCompany. If you have followed the previous recipe this is already done and\
    \ you can skip right to step 8.\n\n# How to do it...\n\n+   1. Start by launching\
    \ your preferred Development Tool (Visual Studio or Visual Web Developer Express).\n\
    +   2. Look for Recent Projects shown on the left side of the screen. Click on\
    \ Employee to load the project.\n+   3. Look under the Solution Explorer on the\
    \ right side of the screen and double-click on 01.00.00.SqlDataProvider. This\
    \ will display the creation script in the editor.\n+   4. Scroll down past the\
    \ CREATE TABLE part of the script until you see Drop Existing Stored Procedures.\n\
    \n```\n/** Drop Existing Stored Procedures **/\n\nif exists (select * from dbo.sysobjects\
    \ where id = object_id(N'{databaseOwner} [{objectQualifier} YourCompany_GetEmployees]')\
    \ and OBJECTPROPERTY (id, N'IsProcedure') = 1)\n    drop procedure {databaseOwner}\
    \ {objectQualifier} YourCompany_GetEmployees\nGO\n\nif exists (select * from dbo.sysobjects\
    \ where id = object_id(N'{databaseOwner} [{objectQualifier} YourCompany_GetEmployee]')\
    \ and OBJECTPROPERTY (id, N'IsProcedure') = 1)\n```"
