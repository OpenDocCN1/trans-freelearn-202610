- pgno: 379
  md: "# Creating your own CBO Hydrator\n\nDNN includes a useful core service called\
    \ CBO Hydrator. The CBO Hydrator is a collection of methods for populating one\
    \ or more Custom Business Objects (CBOs) from the database. We've seen in previous\
    \ recipes how the CBO EmployeeInfo pulls records from the database and uses the\
    \ CBO Hydrator to populate a Datagrid.\n\nAs a DNN developer you have the ability\
    \ to write your own Hydrator by implementing the IHydrator interface. Implementing\
    \ IHydrator is more efficient and it also gives you the option of customizing\
    \ it to any special situations in your module, including \"massaging\" the data\
    \ before it is passed to the presentation layer or perhaps filtering the results\
    \ based on the user's security.\n\nIn this recipe, we will use the sample Employee\
    \ project to demonstrate the two pieces required to implement the IHydrator interface:\
    \ a property called KeyID and a method called Fill.\n\n# Getting ready\n\nTo follow\
    \ along with this recipe you must have completed the following recipe from Chapter\
    \ 6, Data Entry Tricks :\n\n+   Displaying a Datagrid with filter controls\n\n\
    # How to do it...\n\n+   1. Start by launching the Development Tool and loading\
    \ the Employee project.\n+   2. Double-click to open the EmployeeInfo.vb file.\n\
    +   3. Look at the top of the file and add the following Implements statement:\n\
    \n```\nPublic Class EmployeeInfo\n    Implements Entities.Modules.IHydratable\n\
    \n    ' local property declarations\n```\n\n+   4. Next, scroll down to the bottom\
    \ of the file, just after the last property and add the following new Optional\
    \ Interfaces region and Fill routine:\n\n```\n#Region \"Optional Interfaces\"\n\
    \nPublic Sub Fill(ByVal dr As IDataReader) Implements\n    DotNetNuke.Entities.Modules.IHydratable.Fill\n\
    \n    ItemId = Convert.ToInt32\n        (Null.SetNull(dr.Item(\"ItemID\"), ItemId))\n\
    ```"
  merge: -1
  img_proc: true
