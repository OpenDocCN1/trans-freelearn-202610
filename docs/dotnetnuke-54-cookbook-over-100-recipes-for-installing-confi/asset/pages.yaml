- pgno: 80
  md: '# Distributing documents online


    It is possible to publish a variety of documents on a DNN portal such as Word
    documents, PDF files, internal documentation, and images. This is useful for a
    company intranet that wants to distribute documents to employees without the task
    of e-mailing everybody.


    # Getting ready


    To follow this recipe you must have the Documents module installed on your DNN
    site. See the recipe in Chapter 1, Installing standard DNN modules for instructions.


    Document distribution in DNN has four steps:


    +   1. The host user decides what document types will be allowed.

    +   2. The host user creates a list of file categories to keep the files organized.

    +   3. A user (like the Portal Administrator) uploads a document.

    +   4. Another user downloads the document.


    # How to do it...


    +   1. Log in as the host user (`syshost` in our examples).

    +   2. Look under the Host menu and select Host Settings.

    +   3. Scroll all the way down and look for the section called Other Settings
    and expand it.


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_80_0.png)'
  merge: -1
  img_proc: true
- pgno: 81
  md: '4. Find Allowable File Extensions. This list affects both the files available
    to download and the files allowed for upload. For example, if you want to upload
    a JPG for the HTML module the extension has to be listed here. Review the list
    and remove any extensions you will not support on your site.


    5. Click on Update to save your changes.


    6. Log out as host and log in as the Portal Administrator (sysadmin in our examples).


    7. Navigate to a blank page (such as Useful Documents created in the recipe Creating
    and organizing pages in Chapter 2).


    8. Look at the Control Panel and make sure you are in Edit mode.


    9. From the Control Panel, pick the Common Tasks tab and select the Documents
    module from the drop-down list.


    10. Choose ContentPane from the drop-down list and click on the Add Module button.


    11. The Documents module will now appear on your blank page and show the current
    list of available documents. Before we add a document, let''s edit the settings
    of the module.


    12. Hover over the Documents module menu and select Settings.


    13. Scroll down to the Documents Module Settings.


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_81_0.png)'
