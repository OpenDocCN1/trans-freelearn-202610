    # How it works...


    In this recipe we saw the tasks to use a TabStrip control:


    +   - We placed the control in the .ascx file

    +   - We separated the existing content onto separate tabs


    # There''s more...


    Although the TabStrip is a technique for maximizing your screen "real estate"
    it is not to be confused with paging that we saw in Chapter 6. TabStrips are used
    in the ASCX file and save space by dividing content onto different tabs. Paging
    saves space by dividing groups of database records as they are retrieved from
    the database.


    # Using a CAPTCHA control for security


    CAPTCHA is a technique for detecting when a real person is typing at the keyboard.
    It works by presenting a word or phrase in an image that has been scrambled enough
    that a computer cannot read it but a person can.


    > Older DNN versions had bugs in the CAPTCHA control. To follow along with this
    recipe you should make sure your DNN version is 5.1 or later.


    In this recipe we will show how to add a CAPTCHA control to a data entry form
    that will block automated processes from updating a record.


    > CAPTCHA is an acronym that stands for "Completely Automated Public Turing test
    to tell Computers and Humans Apart". You can learn more about CAPTCHA at `http://www.captcha.net`.'
  merge: -1
  img_proc: true
