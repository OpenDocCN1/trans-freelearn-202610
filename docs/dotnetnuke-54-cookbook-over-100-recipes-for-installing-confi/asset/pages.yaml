- pgno: 401
  md: '# See also


    Once again we used the <%=SkinPath %> variable in the skin. To learn more about
    other portal variables usable in skins, see the recipe Showing portal settings
    in a skin at the end of this chapter.


    # Creating and deploying a custom widget


    In the previous recipes we saw how the different skin widgets that come with DNN
    can be used in our skins to provide interesting and creative client-side functionality.
    In this recipe we will see how to make our own skin widgets using the sample template
    that comes with DNN and adding our own JavaScript.


    There''s a lot you can do with custom widgets. In this recipe we will demonstrate
    a simple "fading" widget that fades out and disappears when you click on it. It
    works by adjusting the opacity of the element.


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_401_0.png)


    To make it work we need to do three things:


    +   1. Make a copy of the DNN widget template that we can edit.

    +   2. Edit the template JavaScript file and add our own click handler.

    +   3. Update the manifest and deploy the skin.


    To help us get our feet wet with custom skin widgets, DNN thoughtfully provides
    a complete sample widget with a JavaScript template. All we need to do is modify
    the button click handler to trigger the functionality. We start by copying the
    sample widget template from the DNN installation to a temporary folder. Then we
    will rename the files and edit them to create the custom widget.


    # Getting ready


    To follow along with this recipe you must have completed the following recipe
    from Chapter 8, Basic Skinning:


    +   ▸ Creating a simple ASCX skin'
  merge: -1
