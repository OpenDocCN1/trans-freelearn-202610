    # Creating a simple HTML container


    While skins set the styling of the entire page, DNN also allows skinning at the
    module container level. You can think of a container as the area around the module
    content. It includes the title of the module as well as the hover menu and the
    action links that usually appear beneath the content.


    In this recipe we will create a simple container using HTML. We will also introduce
    some of the Skin Objects available to containers.'
