- pgno: 290
  md: '# Getting ready


    To follow along with this recipe you must have completed the following recipe
    from Chapter 6:


    +   Displaying labels from the resource file


    # How to do it...


    +   1. Look on the DNN server and locate the root folder of the DNN installation.

    +   2. Find the web.config file and open it in a text editor.

    +   3. Scroll down through the file until you see the ShowMissingKeys key.

    +   4. Set the value of this key to true with the following code:

    +   <add key="AutoUpgrade" value="true" />

    +   <add key="UseInstallWizard" value="true" />

    +   <add key="InstallMemberRole" value="true" />

    +   <!--Force controls to show missing translation keys -->

    +   <add key="ShowMissingKeys" value="true" />

    +   <add key="EnableWebFarmSupport" value="false" />

    +   <add key="EnableCachePersistence" value="false" />

    +   <add key="HostHeader" value="" />

    +   5. Now log in the DNN site and navigate to the module you are developing.


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_290_0.png)


    +   6. The module will check for translation strings in the resource file. If
    no translation is found then the missing key is displayed. In this example, if
    we wanted to provide a translation for the collapsible panel we would need to
    add the key Settings.Text to the resource file.

    +   7. To turn off this feature and restore the normal appearance of the module,
    set the ShowMissingKeys to false.


