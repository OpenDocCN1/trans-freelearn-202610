- pgno: 73
  md: '# Easy Tricks with

    Existing Modules


    In this chapter we will cover the following topics:


    +   - Using the HTML module

    +   - Creating an Announcement

    +   - Distributing documents online

    +   - Publishing a Newsletter

    +   - Creating a calendar of events

    +   - Creating a Wiki

    +   - Publishing sets of popular links

    +   - Displaying RSS news feeds

    +   - Configuring RSS news feeds

    +   - Publishing a simple report

    +   - Publishing a survey questionnaire


    # Introduction


    In this chapter, we will look at the most popular modules that are included in
    the DotNetNuke community edition. We will explore everything from announcements
    to publishing content to displaying reports from the database. These recipes will
    give you everything you need to build a popular and useful portal.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# Easy Tricks with Existing Modules


    Most of the modules described in this chapter are included in the current version
    of DNN but are uninstalled. Limiting the number of installed modules keeps a new
    DNN site as simple and efficient as possible. Review the recipe from *Chapter
    1, Installing standard DNN modules* to install these additional modules before
    following these recipes.


    # Using the HTML module


    The HTML module is a very simple module but it offers a lot of possibilities.
    Think of it as an HTML file you can put inside a container on your DNN page. Whatever
    code you put in the module will be interpreted just like an HTML file placed on
    the web server.


    On the positive side, this means your HTML module can contain the same kind of
    code you would find in any HTML file: HTML, JavaScript, VBScript, even JQuery.
    On the negative side, as the HTML module sits inside the DNN page, it means there
    are some important limitations to what the HTML module can do. The principal consideration
    is that whatever code you place in the HTML module must play nice with the all
    other code running on the page outside of your module. It also means that you
    are responsible for the correct syntax of your HTML code. There is no error checking
    done on the code in the HTML module.


    In this recipe we will demonstrate simple HTML with CSS code. For more examples
    of the HTML module, you can look ahead to *Chapter 10*.


    # Getting ready


    To follow along with this recipe, it is handy to be familiar with HTML and CSS.


    # How to do it...


    +   1. Log in as Portal Administrator (`sysadmin` in our examples).

    +   2. Add the HTML module to a new or existing page.

    +   3. Select **Edit Content** from the module menu (or click on the **Edit Content**
    icon).

    +   4. On the **Edit Content** page, you will see the editor which has different
    modes. You can choose **Basic Text Box** for simple text entry. You can also choose
    **Rich Text Editor** if you prefer to use the automatic HTML formatting features.
    If you are working directly in HTML you can click on the **HTML** tab at the bottom
    to avoid any automatic formatting.'
  merge: -1
  img_proc: true
