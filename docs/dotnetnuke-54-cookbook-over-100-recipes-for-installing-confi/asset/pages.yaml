- pgno: 5
  md: '# # About the Reviewers


    **Jeff Cochran** is a Senior Network Specialist for the City of Naples, Florida.
    A large part of his job includes web design and coding, as well as web server
    management. Jeff has nearly two decades of experience with the Internet, having
    started one of the first Internet service providers in Southwest Florida, and
    has worked with Windows and Unix-based web servers. Now primarily concentrating
    on Windows technologies, Jeff has been a Microsoft MVP for Microsoft''s Internet
    Information Server for nearly a decade and is active in the ASP Classic and ASP.NET
    communities as well. Jeff co-authored Packt''s *"Building an ASP.NET Content Management
    System"* and has worked on several books by other publishers.


    **Sebastian Leupold** after studying Economics and Business Engineering at Karlsruhe
    University has acquired professional experience in software applications for about
    20 years now. He is the CEO of Gamma Concept, a solutions company specialized
    in developing database-driven software for PC and the Web, which is part of dnnWerk,
    the compound of leading DotNetNuke experts in Germany, providing all services
    around DotNetNuke, including hosting, training, advisory, skinning, and module
    development.


    As a member of the DotNetNuke Core Team, Sebastian added a couple of enhancements
    to the DotNetNuke Core Framework and is mainly responsible for module release
    testing. While also being a member of the User Experience Team, he focuses on
    improvements for DNN usability. In the past, he has been a project lead for UserDefinedTable
    module. Sebastian creates and maintains hundreds of German language packs for
    the DotNetNuke framework and modules.


    Sebastian is co-founder and co-lead of the German DotNetNuke User Group. He was
    also an initiator of DNN-Europe, the Network of DotNetNuke Professionals, for
    which he organized the first European Day of DotNetNuke 2010 in Paris. Sebastian
    has held a number of sessions in OpenForce DotNetNuke conferences in Europe and
    the U.S. as well as a number of user group meetings. Microsoft awarded his activities
    by the "Most Valuable Professional" (MVP) title.'
  merge: -1
  img_proc: true
