    # Localizing a stored procedure


    In this chapter, we have seen several ways to localize the different kinds of
    module content. Although you can localize much in the module code, you may need
    to consider localizing in the backend stored procedures.


    In this recipe we will see a simple example of passing the current locale to a
    stored procedure and using that information to change the results returned by
    the procedure.


    # Getting ready


    To follow along with this recipe you must have completed the following recipes:


    +   - *Creating stored procedures*

    +   - *Localizing a DataGrid control*


    In this example, we will demonstrate localization by applying a fixed exchange
    rate to the Salary values pulled from the database based on the locale. (Canadian
    dollars = `Salary * 1.02642`). This is not the most elegant way to perform currency
    conversion but it will suffice for this example.


    # How to do it...


    +   1. Launch the Development Tool and load the **Employee** project.

    +   2. Next, open the `01.00.00.SqlDataProvider` file.

    +   3. Scroll down until you find the `ACME_GetEmployeesByFilter` procedure.'
