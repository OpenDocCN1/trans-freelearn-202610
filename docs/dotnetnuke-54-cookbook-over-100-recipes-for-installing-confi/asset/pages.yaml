- pgno: 53
  md: '![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_53_0.png)


    The text that appears in the alert e-mails is completely customizable. You can
    find it by selecting Languages from the Admin menu (or from the Control Panel)
    and clicking on the pencil icon next to the language of your portal. To learn
    more about localizing text like this see the recipe in Chapter 9, Editing the
    language resource file.


    # There''s more...


    After creating a user and defining security access the last thing remaining is
    defining which security roles can see the portal modules.


    # See also


    To learn how to assign security access to different modules see the recipe Granting
    access to modules later in this chapter.


    # Creating and assigning security roles


    One of the first things you must do as a Portal Administrator is to define the
    security for the portal. Security roles grant access to all users assigned to
    the role and when combined with permissions permit some pages to be public and
    some to be private.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Getting ready


    To create a security role you need either the host or Portal Administrator login.
    To decide what security roles you need think about the different types of users
    accessing the site. For example, if you have a news site you may create a group
    called Contributors. By creating a security role for this group you can give them
    access to edit content that a normal user would not have.


    # How to do it...


    +   1. Begin by logging in as the Portal Administrator (`sysadmin` in our examples).

    +   2. Look at the Control Panel and make sure you are in Edit mode.

    +   3. Look under the **Admin** menu and select **Security Roles**.

    +   4. This page will display all the security roles you currently have.


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_54_0.png)


    +   5. Click on the link labeled **Add New Role** (or select it from the action
    menu).


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_54_1.png)'
  merge: -1
  img_proc: true
- pgno: 55
  md: '6. When the Edit Security Roles page is displayed, enter the following information:


    +   - Role Name: Contributor

    +   - Description: A role to designate users who can contribute content

    +   - Role Group: <Global Roles>

    +   - Public Role: Unchecked

    +   - Auto Assignment: Unchecked


    7. Click on the Update button to create the role.


    # How it works...


    Once a security role is created you can assign it to a user then take advantage
    of DNN''s flexible security and assign it to either the pages or the modules in
    your portal. This will control access to your portal''s content.


    # There''s more...


    When your DNN was installed, five security roles were created for you:


    +   - Administrator: This role grants full access to the selected portal.

    +   - Registered User: This is any user who has been given a username and password
    for the website.

    +   - Subscribers: This is a sample for a public role, intended to be used in
    Newsletter modules. Users can register and unregister for role membership by themselves.

    +   - Unregistered users: These are public users who are visiting your site but
    have not logged in.

    +   - All Users: This special role is used when you want to give access to all
    users, regardless of whether they are logged in or not.


    These security roles can provide most of the security control your portal needs,
    but sometimes you need to create roles that make more sense to your business.


    # See also


    For examples of how to use the role you''ve created see the next two recipes:


    +   - Granting access to modules

    +   - Banning and deleting users'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# Granting access to modules


    Once security roles are defined and assigned to users the last step is to decide
    which users can access the modules in the portal. You specify access to modules
    in two ways: a module can inherit access from the page where it is placed or you
    can turn off inheritance and specify directly on the module what security roles
    can access it. Some modules are available to all users while others are private.
    If you don''t have the security role required by the module you will not see the
    module when the portal page is displayed.


    # Getting ready


    For this recipe you need a module. The default DNN portal includes a small HTML
    module called **Sponsors** that displays some of the companies that support DNN.
    We will take the normally private module and make it public so everyone can see
    it. Keep in mind that the recipe below will work with any module in DNN, not just
    with Sponsors.


    # How to do it...


    +   1. Begin by logging in as the Portal Administrator (`sysadmin` in our examples).

    +   2. Look at the front page of the portal and scroll down to the bottom of the
    page. Look for the **Sponsors** or just use any module you see on the page.

    +   3. Locate the module action menu. It''s the small triangle next to the module
    name. Hover your mouse over the small triangle and the action menu will display.


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_56_0.png)'
  merge: -1
  img_proc: true
- pgno: 57
  md: '4. Select **Settings** from the action menu. This displays the **Module Settings**
    form.


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_57_0.png)


    5. Make sure **Inherit View permissions from Page** is unchecked. This will allow
    you to set the security at the module level.


    6. Listed under the Permissions prompt will be the five security roles that came
    with DNN plus any security roles you created. To give view access to unregistered
    users (that is the general public) make sure that:


    +   - **All Users** is checked

    +   - **Registered Users** is unchecked

    +   - **Unauthenticated Users** is unchecked


    7. Click on **Update** at the bottom of the page to save your changes.


    8. To test the security, click on the **Logout** link to become an unauthenticated
    user.


    9. Look at the home page and scroll to the bottom. The **Sponsors** module should
    now appear even when you''re not logged in. It is now a public module.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# There''s more...


    In this recipe we saw a simple example of controlling user access at the module
    level, but security in DNN is determined at several different levels. You can
    control access at the page level and the let modules on the page inherit the same
    access or you override at the module level for additional control. But there may
    be additional factors to consider when choosing security for your site. Users
    can have multiple security roles and some modules (such as the Blog module) have
    additional layers of security built into them as well. It is best to think carefully
    about your security decisions and test them before deploying them on a production
    site.


    # See also


    For more examples of user account security see the next recipe, *Banning and deleting
    users.*


    # Banning and deleting users


    Once you have created users and given them access to your portal you have two
    different ways to remove that access. You can ban them by stripping them of their
    privileges or you can delete and remove them all together.


    # Getting Ready


    For this recipe you will need some test users to ban and delete. See the recipe
    *Creating users and granting access* for more information.


    # How to do it...


    +   1. Begin by logging in as the Portal Administrator (`sysadmin` in our examples).

    +   2. Look at the Control Panel and make sure you are in Edit mode.

    +   3. Look under the **Admin** menu and select **User Accounts** or click on
    the **Users** icon in the Control Panel.

    +   4. The **User Accounts** page will display all the users in the portal. Look
    for an existing user or create a test user. Do not pick the administrator user!
    The administrator user cannot be banned or deleted.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '5. To ban a user without deleting you need to unauthorize him. Find the user
    you want to ban in the list and click on the small pencil icon next to their name.
    This will display the Edit User Accounts page.


