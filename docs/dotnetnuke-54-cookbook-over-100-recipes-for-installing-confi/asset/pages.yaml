- pgno: 216
  md: '# Getting ready


    To follow along with this recipe you must have completed the following recipes:


    +   - *Deploying a module as a standalone package*\n- *Adding web controls to
    your Toolbox*


    One of the important parts of this recipe is that once a label has been changed,
    we must save the new text somewhere. Fortunately DNN provides a place to save
    it: in the module settings. The module settings apply to all instances of a module
    regardless of how many pages they appear on (unlike Tab Module settings which
    are settings for a particular instance of a module). To access the module settings
    we use the routine `UpdateModuleSetting`, pass our module ID, a setting name,
    and setting value.


    # How to do it...


    +   1. Launch the Development Tool and load the **Employee** project.\n2. Double-click
    to open the `EditEmployee.ascx` file.\n3. Make sure the following register directive
    is at the top of the file:


    ```

    <%@ Register tagprefix="DNN" assembly="DotNetNuke.WebControls"\n           namespace="DotNetNuke.UI.WebControls"
    %>

    ```


    +   4. Find the HTML table holding the label and text controls and note the existing
    label control for the employee first name:


    ```

    <table width="650" cellspacing="0" cellpadding="0" border="0"\n       summary="Edit
    Table">\n\n<tr valign="top">\n        <td class="SubHead" width="125">\n            <dnn:label
    id="lblEmpFirstName" runat="server"\n                      controlname="lblEmpFirstName"
    suffix=":">\n            </dnn:label>\n        </td>\n\n        <td>\n            <asp:TextBox
    ID="txtEmpFirstName" runat="server"></asp:TextBox>

    ```


    +   5. Delete the original label control and replace it with this new label code.
    The source code will now look like this:


    ```

    <table width="650" cellspacing="0" cellpadding="0" border="0"\n       summary="Edit
    Table">\n\n<tr valign="top">\n        <td class="SubHead" width="125">\n            <DNN:DNNLabelEdit
    ID="dleEmpFirstName" runat="server">[click\n                                                        here
    to edit]\n            </DNN:DNNLabelEdit>

    ```'
  merge: -1
  img_proc: true
- pgno: 217
  md: "```\n```html\n</td>\n<td>\n<asp:TextBox ID=\"txtEmpFirstName\" runat=\"server\"\
    ></asp:TextBox>\n```\n```\n\n+   6. This is enough to let us edit the label, but\
    \ we want to save the text changes as well. To do that we must handle the event\
    \ when a label is retyped and save the information. Begin by opening the `EditEmployee.ascx.vb`\
    \ file.\n\n+   7. Create a new event handler by pasting this code at the end of\
    \ the **Event Handlers** region:\n\n```\n```vb\nPrivate Sub dleEmpFirstName_Updatelabel(ByVal\
    \ sender As Object,\n        ByVal e As DotNetNuke.UI.WebControls.DNNLabelEditEventArgs)\n\
    \        Handles dleEmpFirstName.UpdateLabel\n\n    Dim modCtrl As New\n     \
    \   DotNetNuke.Entities.Modules.ModuleController\n    Dim strLabel As String =\
    \ e.text.tostring()\n\n    ' save the updated label text in the module settings\n\
    \n    modCtrl.UpdateModuleSetting(ModuleId, \"EmpFirstName\",\n              \
    \                  strLabel)\n\nEnd Sub\n```\n```\n\n+   8. Lastly, add the following\
    \ code to the `Page_Load` procedure:\n\n```\n```vb\nIf Page.IsPostBack = False\
    \ Then\n\n    ' load the label text from the module settings\n\n    Dim strLabelText\
    \ As String = CType(Settings(\"EmpFirstName\"),\n                            \
    \           String)\n\n    ' if no text was saved in module settings, set it to\
    \ [click\n    '                                             here to edit]\n  \
    \  If strLabelText Is Nothing Then\n        ' pull the default label text from\
    \ the resource file\n        strLabelText = Localization.GetString(\"lblEmpFirstName\"\
    ,\n                                              LocalResourceFile)\n\n    End\
    \ If\n    dleEmpFirstName.Text = strLabelText\n```\n```\n\n+   9. Select **Save\
    \ All** from the **File** menu."
  merge: -1
