- pgno: 394
  md: '# There''s more...


    You can experiment with different parameter values and see the results. For example,
    changing the transition to `snap` will have the images immediately replace each
    other without the slide animation and using a longer interval is helpful when
    the images are larger.


    # See also


    If you look closely you will see the ImageURL contains a reference to the `<%=SkinPath
    %>` variable. To learn more about other portal variables usable in skins, see
    the recipe *Showing portal settings in a skin* at the end of this chapter.


    # Using the Visibility widget


    In this recipe we will take a look at the Visibility skin widget. The Visibility
    widget creates a button on your skin that dynamically toggles the visibility of
    an HTML element without calling the server.


    > As we are using JavaScript behind the scenes, the target element must be accessible
    in the Document Object Module (DOM). The DOM is an easy way to reference elements
    in an HTML form (like the DIV element). You can learn more at http://www.w3.org/DOM/.


    To demonstrate the widget we''ll modify the sample ASCX skin from the recipe *Creating
    a simple ASCX skin*, adding `BREADCRUMB` and `TEXT` controls inside a `DIV` element,
    then redeploying the skin to see the change.


    # Getting ready


    To follow along with this recipe you must have completed the following recipe
    from *Chapter 8*, *Basic Skinning*:


    +   ▸ *Creating a simple ASCX skin*


    # How to do it...


    +   1. Find the folder called `SampleASCXSkin` that was created in the recipe
    *Creating a simple ASCX skin*.

    +   2. Launch the Development Tool.

    +   3. Select **Open File...** from the **File** menu.

    +   4. Browse to the `SampleASCXSkin` folder and open the `SampleASCXSkin.ascx`
    file.'
  merge: -1
  img_proc: true
