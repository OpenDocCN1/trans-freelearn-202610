    # Displaying RSS news feeds


    A News Feed is a frequently updated source of information, similar to a blog or
    news headline that is published by websites such as Google and CNN. DNN offers
    a module that will display news feeds from the Internet on your portal.


    The format of these feeds is called **Really Simple Syndication (RSS)** so these
    are often called RSS News Feeds.


    # Getting ready


    To follow this recipe you must have the News Feeds module installed on your DNN
    site. See the recipe *Installing standard DNN modules* in *Chapter 1* for instructions.


    To use a RSS news feed you need the web address (the URL) of the feed. In this
    example, we will display a news feed from a popular technology news site called
    Digg. The URL for this feed is http://feeds.digg.com/digg/container/technology/popular.rss.


    ```

    http://feeds.digg.com/digg/container/technology/popular.rss

    ```


    # How to do it...


    +   1. Log in as the Portal Administrator (`sysadmin` in our examples).

    +   2. Look at the Control Panel and make sure you are in Edit mode.

    +   3. Navigate to the page that will hold the News Feed.

    +   4. From the Control Panel, pick the **Common Tasks** tab and select the **News
    Feeds (RSS)** module from the drop-down list.'
  merge: -1
  img_proc: true
