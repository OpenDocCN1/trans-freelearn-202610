    \ EmpFirstName,\n    EmpLastName,\n    ManagerNo,\n    HireDate,\n    Salary,\n\
    \    CreatedByUser,\n    CreatedDate\n)\nvalues (\n    @ModuleId,\n    @EmpFirstName,\n\
