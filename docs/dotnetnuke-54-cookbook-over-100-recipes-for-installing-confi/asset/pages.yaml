- pgno: 15
  md: '# 1


    # Installation and Setup


    In this chapter we will cover the following topics:


    +   - Downloading the Microsoft Web Platform Installer

    +   - Installing SQLServer Express

    +   - Downloading and installing DotNetNuke package

    +   - Running the DotNetNuke installation

    +   - Setting the site name and information

    +   - Choosing a skin for the site

    +   - Choosing a container for the site

    +   - Adding a module to a page

    +   - Installing Standard DNN Modules

    +   - Downloading an extension (skin or module)

    +   - Installing a new extension


    # Introduction


    DotNetNuke (which for brevity''s sake we''ll call "DNN" going forward) is a powerful
    and flexible content management system for building websites. It comes with many
    features for publishing content including tools to create Blogs, Banner Advertising,
    News Feeds, and much more. All of this comes right out of the box and if you use
    the Community Edition, all of it is free.'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'But setting up a website from scratch can be challenging. There are multiple
    pieces involved and each piece must be correct for the whole to work. Fortunately,
    the recipes in this chapter will safely navigate you around the obstacles and
    have your own website up and running in no time. It is important that you read
    the instructions of the recipes with care making sure each step is done as described.
    Following these recipes is very much like following a cooking recipe — if you
    leave out an ingredient or set the oven to the wrong temperature the result could
    be a mess.


    In the recipes of this chapter you will see the phrases web server and database
    server. If you are building a website for a company chances are the web server
    and database server are two different machines located on the network. To install
    and run DNN you need login access to each machine with privileges to install software.


    On the other hand, if you are developing a small test website everything will
    be installed on your desktop or laptop and the terms web server and database server
    refer to your machine to which of course, you already have full access.


    Internet access is necessary to download the DNN code and installation files but
    if you have made it this far we''ll assume you are properly equipped.


    Let''s get started.


    # Downloading the Microsoft Web Platform Installer


    In this recipe we will show how to prepare a machine for a DNN installation by
    installing Microsoft Web Platform Installer (Web PI). The Microsoft Web Platform
    Installer is a free tool for downloading applications from the Internet including
    the DotNetNuke installation, Internet Information Services (IIS), SQL Server Express,
    .NET Framework, and Visual Web Developer. To make installing DNN as simple as
    possible, it is best to install Web PI first.


    # How to do it...


    +   1. Open your favorite web browser and go to the site http://www.microsoft.com/web/Downloads/platform.aspx.

    +   2. Click on the Download It Now button on the right side of the page.

    +   3. Web PI will now start to download. When the Run/Save dialog appears, click
    on Run.

    +   4. If prompted by the Security Warning, click on Run.

    +   5. If you are prompted by the browser, click on the security bar at the top
    of the browser and allow the file to download.

    +   6. Lastly, if you are prompted to allow access to run the program, click on
    Allow.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '7. Web PI will now launch and show the products available for download.


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_17_0.png)


    8. From this dialog you can choose the software to download. Click on Exit when
    you are done downloading products.


    # See also


    With Web PI installed you can easily download the tools needed for the rest of
    this chapter. See the individual recipes for instructions.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Installing SQLServer Express


    This recipe will show you how to download and install Microsoft''s free version
    of SQLServer called Microsoft SQL Server 2008 Express. DNN currently supports
    SQL Server 2005 and 2008, but SQL Server Express is also a good solution for a
    website developer looking to run DNN from a single machine.


    # Getting ready


    For this recipe you should have Windows Server 2003, 2008, or 2008R2. For development
    you may use Windows XP Professional, Windows Vista, Windows 7 (Home Premium and
    above).


    In addition, you should complete the following recipe:


    +   - *Downloading the Microsoft Web Platform Installer*


    # How to do it...


    +   1. Start by launching the Microsoft Web Platform Installer.

    +   2. When the list of available products is displayed, click on the **Web Platform**
    tab.

    +   3. Under the **Database** section, click on the **Customize** link.


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_18_0.png)'
  merge: -1
  img_proc: true
- pgno: 19
  md: '4. Make sure the following products are selected:


    +   - SQL Server Express 2008

    +   - SQL Server 2008 Management Studio Express

    +   - SQL Server 2008 Management Objects


    5. Click on the **Install** button to begin the installation.


    6. The next dialog will list the file you are downloading and prompt **I Decline**
    or **I Accept**. Click on **I Accept**.


    7. Lastly, you must choose how you want to authenticate users in the database.
    As this installation is probably just for your local use, you can choose **Mixed
    Mode Authentication**.


    8. Pick a password for the SQL Server administrator (SA). It must be a strong
    password, so try to include numbers, special characters, and mixed case. Supply
    a good password and click on **Continue**.


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_19_0.png)


    9. Now the file will download and install by double-clicking it. It will take
    several minutes, even with a fast connection. Halfway through the installation
    it may prompt if you want to reboot, click on **No** so that the installation
    will continue.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '10. After the installation finishes you will see a congratulations message.
    If you are prompted to reboot, click on Yes.


    # How it works...


    Microsoft''s Web Platform Installer handles the details of the file download and
    installation. Once it is completed, you will have SQL Server Express running on
    your machine.


    # Downloading and installing the DotNetNuke package


    In this recipe we will walkthrough downloading and installing the DotNetNuke package
    using the Web PI tool.


    Some of the other ways to install DNN are:


    | Pre-installed by a hosting provider | This is certainly the easiest way. There
    are many hosting providers offering DNN as part of a hosting package. |

    | Manually uploading and installing | If you are familiar with SQL Server databases
    and IIS you can download the DNN installation files and manually install the package.
    This is a good way to see how the individual pieces fit together. |

    | Use DNN Starter Kit for Visual Studio 2008 | You can also run DNN from your
    development tool. For more information, see Chapter 5, Building, Debugging, and
    Deploying Modules |


    # Getting ready


    For this recipe you should have Windows Server 2003, 2008, or 2008R2. For development
    you may use Windows XP Professional, Windows Vista, Windows 7 (Home Premium and
    above).


    In addition, you should complete the following recipe:


    +   - Downloading the Microsoft Web Platform Installer


    # How to do it...


    +   1. Start by launching the Microsoft Web Platform Installer.

    +   2. When the list of available products is displayed, click on the Web Applications
    tab.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '3. Scroll down until you see DotNetNuke and make sure it is selected.


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_21_0.png)


    4. Click on the **Install** button to begin the installation.


    5. The next dialog will list the file you are downloading and prompt I **Decline**
    or I **Accept**. Click on I **Accept**.


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_21_1.png)


    6. Now DotNetNuke will download. Install by double-clicking on it. It will take
    several minutes, even with a fast connection. Halfway through the installation
    it may prompt if you want to reboot, click on **No** so that the installation
    will continue.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '7. Once DotNetNuke package has been downloaded, Web PI will immediately launch
    the installation. It starts by prompting for the details of your new DNN site:


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_22_0.png)


    8. Leave the defaults and click on Continue.


    9. Next is the prompt for the application information:'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# Step 2 of 2: Enter application information


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_23_0.png)


    10. Enter the application information:


    +   - **Database:** SQL Server

    +   - **Create new or use an existing database:** Create New database

    +   - **Database Administrator:** sa'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# Installation and Setup


    +   - **Database Administrator Password:** use the password you choose when the
    database was installed

    +   - **Database User Name:** Choose a user name (such as DNN5User)

    +   - **Database Password:** Choose a password (such as DNN5User2010)

    +   - **Database Server:** `\.\SQLExpress`

    +   - **Database Name:** DotNetNuke


    +   11. Click on **Continue**.

    +   12. Next, the status screen will be displayed as the installation runs. If
    you see a login failure instead, check that your database is up and running and
    you gave the correct password for the user sa.

    +   13. You should now see the congratulations screen. Click on **Finish**.

    +   14. Click on **Exit** to close the Web Platform Installer.


    # How it works...


    In this recipe we used the Web PI Installer to download and install the DNN site.
    To complete the installation, see the next recipe *Running the DotNetNuke installation*.


    # Running the DotNetNuke installation


    Once all the pieces are in place the final step is to access the DNN web and run
    the final installation code.


    # Getting ready


    At this point you must have successfully completed the following recipes:


    +   - *Downloading the Microsoft Web Platform Installer*

    +   - *Installing SQLServer Express*

    +   - *Downloading and installing DotNetNuke package*


    # How to do it...


    +   1. Open your favorite web browser and go to the new site (for example, `http://localhost/DotNetNuke`).'
  merge: -1
  img_proc: true
