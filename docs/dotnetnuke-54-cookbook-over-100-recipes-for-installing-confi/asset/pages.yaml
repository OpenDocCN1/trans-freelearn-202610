    # Creating a Manifest from an installed module


    In the previous recipe we saw how to modify the manifest file created by the Starter
    Kit as part of deploying a module. One shortcoming of that approach is that the
    manifest created by the Starter Kit is not always meant for the latest version
    of DNN. This is done so that starter modules are usable on the widest range of
    DNN versions. But if you know that your module will only deploy to the latest
