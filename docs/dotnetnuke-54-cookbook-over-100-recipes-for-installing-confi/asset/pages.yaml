  md: '14. Go to the page with the Employee module. The names in the Manager drop-down
    list are now coming from a second database connection to an MS Access database.


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_364_0.png)


    # How it works...


    In this example we used an OLE connection to a MS Access 2000 database, but this
    technique works with other database types. Here are some other example connection
    strings for different types of databases:


    | Database type | Sample connection string |

    | --- | --- |

    | Oracle Database using a TNSNames. ora file | <add name="LegacyOracle" connectionString="Data
    Source=LEGACY;User Id=legacyuser; Password=legacypassword;" /> |

    | MS Access | <add name="LegacyAccess" connectionString="Provider=Microsoft.Jet.OLEDB.4.0;Data
    Source=C:\northwind.mdb;User Id=legacyuser;Password=legacypassword;" /> |

    | SQL Server Express | <add name="LegacyExpress" connectionString="Data Source=.\SQLEXPRESS;Initial
    Catalog=LegacyDatabase;User ID=legacyuser;Password=legacypassword" /> |

    | MySQL | <add name="LegacyMySQL" connectionString="Server=localhost;Port=3306;Database=LegacyMySQL;Uid=legacyuser;Pwd=legacypass
    word;" /> |'
