- pgno: 146
  md: '# Editing the Manifest File


    Before deploying a new module you should review and update the Manifest File generated
    by the Starter Kit.


    The Manifest File is an XML file that tells DNN how to install and configure your
    module for use in a portal. DNN will read this file when you deploy the module
    and save it in the database. There are five elements in particular we want to
    edit before deployment.


    | <name> | This is the internal name of the module. Once the module is deployed,
    you should not change this name without completely uninstalling the module first.
    |

    | <friendlyname> | This is the friendly name for the module. It is displayed when
    the host lists installed modules and it is the name that appears in the drop down
    when you are placing a module on a page. |

    | <description> | The description of the module that appears in the list of installed
    modules. |

    | <module><friendlyname> | Displayed on the container holding the module. |

    | <src> | Gives the path to the user controls. |


    # Getting ready


    To follow along with this recipe you must have completed this recipe from Chapter
    4:


    +   - Creating a new module with the Starter Kit


    # How to do it...


    +   1. Start by launching your preferred development tool (Visual Studio or Visual
    Web Developer Express).

    +   2. Look for Recent Projects shown on the left side of the screen. Click on
    Employee to load the project.

    +   3. Double-click to open the Employee.dnn file. At the top of the file you
    should see the following:


    ```

    <dotnetnuke version="3.0" type="Module">

    <folders>

    <folder>

    <name>YourCompany.Employee</name>

    <friendlyname>Employee</friendlyname>

    <foldername>YourCompany.Employee</foldername>

    <modulename>YourCompany.Employee</modulename>

    <description>A Employee module</description>

    ```'
  merge: -1
  img_proc: true
