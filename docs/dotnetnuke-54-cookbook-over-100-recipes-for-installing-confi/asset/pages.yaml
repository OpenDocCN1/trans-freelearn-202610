- pgno: 418
  md: '# How to do it...


    +   1. Find the folder called ASCXMenuSkin that was created in the recipe *Styling
    a menu with images*.

    +   2. Launch the Development Tool.

    +   3. Select **Open File...** from the **File** menu.

    +   4. Browse to the ASCXMenuSkin folder and open the ASCXMenuSkin.ascx file.

    +   5. Start by adding a register directive at the top of the file:

    +   ```

    +   <%@ Register TagPrefix="dnn" Namespace="DotNetNuke.UI.Skins" Assembly="DotNetNuke"
    %>

    +   ```

    +   6. Then, scroll down a little until you see the NAV control. To add the new
    custom attributes, change the NAV control from this:

    +   ```

    +   <div class="menu_style">

    +       <dnn:NAV runat="server" id="dnnNAV"

    +               ProviderName="DNNMenuNavigationProvider"

    +               IndicateChildren="false"

    +               ControlOrientation="Horizontal"

    +               CSSControl="mainMenu" />

    +   </div>

    +   ```

    +   To this:

    +   ```

    +   <div class="menu_style">

    +       <dnn:NAV runat="server" id="dnnNAV"

    +               ProviderName="DNNMenuNavigationProvider"

    +               IndicateChildren="false"

    +               ControlOrientation="Horizontal"

    +               CSSControl="mainMenu" mouseouthidedelay="100">

    +           <customattributes>

    +               <dnn:customattribute value="Expand" name="AnimationType" />

    +               <dnn:customattribute value="Sine" name="EasingType" />

    +               <dnn:customattribute value="In" name="EasingDirection" />

    +               <dnn:customattribute value="1" name="AnimationLength" />

    +               <dnn:customattribute value="10" name="AnimationInterval" />

    +           </customattributes>

    +       </dnn:NAV>

    +   </div>

    +   ```'
  merge: -1
  img_proc: true
- pgno: 419
  md: '+   7. That''s all we need to do. By adding the custom attributes we need for
    menu animation the skin is ready to go.

    +   8. To preview the skin, start by logging in as the SuperUser.

    +   9. Deploy the skin from the skin folder to the DNN portal as described in
    the recipe Deploying your skins and containers.

    +   10. Once the skin is deployed, look under the Admin menu and select Skins.

    +   11. Select the ASCXMenuSkin from the Skins: drop-down list and click on the
    Preview link.

    +   12. The menus appear the same as before but now they employ animation to gently
    slide open and close. You can adjust the speed by changing the value of AnimationLength
    in the above code sample. A value of 1 moves at the normal rate while a value
    of 10 would create a very slow menu opening.


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_419_0.png)


    # There''s more...


    You can experiment with the available options and see how the menu animation changes.
    For example, the EasingType is probably the most fun option to play with. Sine
    creates a nice smooth menu opening, Bounce creates a kind of hesitant expansion.
    Circ offers a cleaner "snappy" opening while Quad makes a more "mellow" animation.'
  merge: -1
