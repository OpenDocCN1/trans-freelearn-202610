- pgno: 68
  md: '# Managing Users and Site Setup


    +   20. Now that we know how to move a page in the menu, let''s see how to delete
    a page.

    +   21. Select **Delete Me** in the list of pages on the left side.

    +   22. Click on the small red **X** under **Actions** on the right side of the
    page.

    +   23. You will be prompted **Are you Sure You Wish To Delete This Item?** Click
    on **OK**.

    +   24. The page is sent to the Recycle Bin and disappears from the menu and the
    list of pages. If you delete a page and change your mind later, see the next recipe
    *Using the Recycle Bin* to learn how to get it back.


    # How it works...


    Creating pages, organizing them in the menu and adding modules to them is a big
    part of building a website using DNN. We''ll see many more examples of adding
    pages and creating content in the next chapter.


    # See also


    Now that you have blank pages in your site you can start adding modules using
    the remaining recipes in this chapter and *Chapter 3*.


    # Using the Recycle Bin


    When you delete pages and modules in DNN, they are not actually deleted. Instead
    they are held in a Recycle Bin just like files on your computer. This recipe will
    show you how to "undelete" pages and modules.


    # Getting ready


    To follow along with this recipe you''ll need a deleted page. See the recipe *Creating
    and organizing pages* to learn how to delete a page.


    # How to do it...


    +   1. Begin by logging in as the Portal Administrator (sysadmin in our examples).

    +   2. Look at the Control Panel and make sure you are in Edit mode.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '+   3. Look under the **Admin** menu and select **Recycle Bin**.


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_69_0.png)


    +   4. The Recycle Bin maintains pages and modules you have deleted. To bring
    back a page click on the page to select it.

    +   5. Click on the small green recycle icon.

    +   6. After a pause the page will become active again and reappear in the menu.

    +   7. To restore a module, select the module in the list.

    +   8. Click on the recycle icon.

    +   9. After a pause the module will reappear on the page it was deleted from.


    # How it works...


    The Recycle Bin lets you undelete pages and modules but it also offers a link
    to empty the Recycle Bin. If you click on this link then all the pages and modules
    in the Recycle Bin will be deleted forever. Use this link with caution.


    # Setting up a SMTP server with Gmail


    DNN uses e-mail in many ways: when a new user is created, when you set up vendors,
    or when someone responds to a blog post.


    You can configure your site to send e-mails using the **Simple Mail Transfer Protocol
    (SMTP)** but this requires a SMTP Server.


    In this recipe, we''ll demonstrate how to use a free Gmail account (from Google)
    as your SMTP server and how to configure DNN to send e-mails via this account.'
  merge: -1
  img_proc: true
