- pgno: 198
  md: "6. For the paging to work, we need to remember what page number is currently\
    \ selected. To do that we create a private variable to hold the Page Index. The\
    \ Index starts at 0 (page one) and we pass it to the stored procedure so it can\
    \ calculate which records should appear on the page. Look at the top of the file\
    \ and add the Private Members region with a single variable declaration. Place\
    \ it just before the Private Methods region:\n\n```\n#Region \"Private Members\"\
    \n\n    Dim PageIndex As Integer = 1\n\n#End Region\n\n#Region \"Private Methods\"\
    \n\n    Private Sub BindData()\n```\n\n7. Scroll down a little to the BindData()\
    \ procedure and make the following changes:\n\n```\nPrivate Sub BindData()\n \
    \   Dim objEmployees As New EmployeeController\n    Dim colEmployees As ArrayList\n\
    \n    Dim TotalRecords As Integer\n    Dim PageSize As Integer = Convert.ToInt32(ddlRecordsPerPage.SelectedValue)\n\
    \n    Dim CurrentPage As Integer = PageIndex\n    If CurrentPage > 0 Then CurrentPage\
    \ = CurrentPage - 1\n\n    ' use the filter procedure to retrieve the records\n\
    \    colEmployees = objEmployees.GetEmployeesByFilter\n        (ModuleId, ddlManagerNo.SelectedItem.Value,\n\
    \        ddlSalaryRange.SelectedItem.Value,\n        CurrentPage, PageSize, TotalRecords)\n\
    \n    If colEmployees.Count > 0 Then\n        grdResults.Visible = True\n    \
    \    grdResults.DataSource = colEmployees\n        grdResults.DataBind()\n\n \
    \       ctlPagingControl.Visible = (PageSize < TotalRecords)\n        InitializePaging(ctlPagingControl,\
    \ TotalRecords, PageSize)\n    Else\n        ' hide the controls that need data\n\
    \        grdResults.Visible = False\n        ctlPagingControl.Visible = False\n\
    \    End If\n\nEnd Sub\n```"
  merge: -1
  img_proc: true
- pgno: 199
  md: "+   8. After the `BindData` procedure add this new procedure:\n\n```\n```vb\n\
    Private Sub InitializePaging(ByVal ctlPagingControl As DotNetNuke.UI.WebControls.PagingControl,\n\
    \                             ByVal TotalRecords As Integer,\n               \
    \              ByVal PageSize As Integer)\n\n    ctlPagingControl.TotalRecords\
    \ = TotalRecords\n    ctlPagingControl.PageSize = PageSize\n    ctlPagingControl.CurrentPage\
    \ = PageIndex\n    Dim strQuerystring As String = \"\"\n    If ddlRecordsPerPage.SelectedIndex\
    \ <> 0 Then\n        strQuerystring += \"&PageRecords=\" +\n                 \
    \         ddlRecordsPerPage.SelectedValue\n    End If\n\n    ctlPagingControl.QuerystringParams\
    \ = strQuerystring\n    ctlPagingControl.TabID = TabId\nEnd Sub\n```\n```\n\n\
    +   9. Next, find the `Page_Init` procedure and add this code to the very top:\n\
    \n```\n```vb\nPrivate Sub Page_Init(ByVal sender As System.Object,\n         \
    \             ByVal e As System.EventArgs)\n                      Handles MyBase.Init\n\
    \n    If Not Request.QueryString(\"CurrentPage\") Is Nothing Then\n        PageIndex\
    \ = CType(Request.QueryString(\"CurrentPage\"),\n                          Integer)\n\
    \    End If\n\n    ' Format the columns of the grid control\n\n    For Each column\
    \ As DataGridColumn In grdResults.Columns\n```\n```\n\n+   10. Scroll down to\
    \ the `Page_Load` procedure and add this code inside the `IsPostBack` check, just\
    \ before the binding calls:\n\n```\n```vb\nIf Not Page.IsPostBack Then\n\n   \
    \ If Not Request.QueryString(\"PageRecords\") Is Nothing Then\n        ddlRecordsPerPage.SelectedValue\
    \ =\n            Request.QueryString(\"PageRecords\")\n    End If\n\n    BindManagerDropDown()\n\
    \    BindSalaryDropDown()\n\n    BindData()\n\nEnd If\n```\n```"
