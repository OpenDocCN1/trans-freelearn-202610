- pgno: 238
  md: '14. Go to the **ACME Employee** page and click on the edit icon (the little
    pencil) next to an employee to display the **Edit Employee** page. The **Bonus
    Level** will appear at the bottom.


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_238_0.png)


    15. Clicking on the **Bonus Level** star icon will change the bonus level which
    will raise or lower the salary when you update the employee record.


    # How it works...


    In this recipe we saw the tasks to use a multi-state checkbox:


    +   - We placed the control in the .ascx file and defined how many states it has

    +   - For each state we picked an image

    +   - On the page load we set the current state

    +   - When a record was updated we saved the state to the database


    # There''s more...


    In this example we used existing images from the DNN site, but you are free to
    upload and use custom images as well. For a quick review of how to upload images
    to the portal see the recipe Showing a thumbnail image in a Datagrid earlier in
    this chapter.


    # See also


    Other control properties you can set:


    | Property | Meaning |

    |---|---|

    | ImagePath | The path on the server to the folder containing the images for the
    different checkbox states. |

    | ImageUrl | The name of the image file to display for the state. |

    | Text | A text message to display next to the image. |

    | ToolTip | A message displayed when you hover over the image. |'
  merge: -1
