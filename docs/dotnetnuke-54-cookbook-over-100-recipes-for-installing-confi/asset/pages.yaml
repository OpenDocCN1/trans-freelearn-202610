- pgno: 309
  md: '# 10


    # Advanced Tricks with

    # Existing Modules


    +   - Using the HTML module with jQuery

    +   - Using the HTML module with replacement tokens

    +   - Using the HTML module with Flash

    +   - Displaying an XML feed

    +   - Controlling the friendly URL rewriting

    +   - Tracking your site with Google Analytics

    +   - Publishing calendar events as an RSS feed

    +   - Designing your own forms

    +   - Styling your own forms


    # ## Introduction


    In previous chapters we saw recipes showing how to configure and use the core
    modules of DotNetNuke. As you become more familiar with administering a DNN portal
    and developing your own custom modules, you''ll want to dig a little deeper and
    see what other features these modules offer.


    In this chapter, we look at some new modules and explore what other features are
    available in DNN. We''ll see how flexible the HTML module can be, how some of
    the underlying processing occurs, and how to extend the DNN database with your
    own custom forms.'
  merge: -1
  img_proc: true
- pgno: 310
  md: '# Using the HTML module with jQuery


    jQuery is a compact JavaScript library with a focus on the interaction between
    JavaScript and HTML. Since version 5, DNN has supported using jQuery code in your
    DNN pages.


    In this recipe we will demonstrate a small jQuery program that extends the previous
    Image Bar example by adding thumbnails images that hover over the currently selected
    image.


    # Getting ready


    To follow along with this recipe you must have completed the recipe from *Chapter
    3:*


    +   - *Using the HTML module*


    # How to do it...


    +   1. Before coding in jQuery, it is important to check the version supported
    by your DNN installation. To see your version, start by logging in as SuperUser
    (`sys...` in our examples).

    +   2. Select **Host Settings** from the **Host** menu.

    +   3. Scroll down past the **Advanced Options** until you see **JQuery Settings**.


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_310_0.png)


    +   4. Under the **JQuery Settings** you will see the version your installation
    supports. In addition to the jQuery version you can see the available options.
    Here''s a quick summary:

    +      - Deselecting **Use jQuery debug version** will have DNN use the smaller,
    more compact library but will offer less debugging information.

    +      - **Use Hosted jQuery Version** means DNN will use the library at the URL
    given. Unchecked, it will use the local copy of the library.

    +   5. To see how to use jQuery in the HTML module, go to the page created in
    the recipe *Using the HTML module*.'
  merge: -1
  img_proc: true
