- pgno: 121
  md: ")\n\n```\nGO\n```\n\n17. The next procedure ACME_UpdateEmployee is similar,\
    \ so we have two places to make changes. Add the five fields to the procedure's\
    \ parameter list and then add the five fields to the update statement. The procedure\
    \ should now look like:\n\n```\ncreate procedure\n{databaseOwner}.{objectQualifier}ACME_UpdateEmployee\n\
    \n@ModuleId          int,\n@ItemId            int,\n@EmpFirstName      nvarchar(30),\n\
    @EmpLastName       nvarchar(30),\n@ManagerNo         int,\n@HireDate         \
    \ datetime,\n@Salary            float,\n@UserID            int\n\nas\n\nupdate\
    \ {objectQualifier}ACME_Employee\nset    EmpFirstName   = @EmpFirstName,\n   \
    \    EmpLastName    = @EmpLastName ,\n       ManagerNo      = @ManagerNo,\n  \
    \     HireDate       = @HireDate,\n       Salary         = @Salary,\n       CreatedByUser\
    \  = @UserID,\n       CreatedDate    = getdate()\nwhere  ModuleId = @ModuleId\n\
    and    ItemId = @ItemId\n\nGO\n```\n\n18. The final procedure ACME_DeleteEmployee\
    \ does not need to be modified as it does not reference any of the fields.\n\n\
    # How it works...\n\nModules in DNN follow Microsoft's N-Tier Architecture. This\
    \ is a mechanism for separating the logic of the application from the business\
    \ and database logic. In this recipe we constructed the stored procedures of the\
    \ database layer.\n\n> You can learn more about the N-Tier architecture from this\
    \ excellent article by David Chappell and Steve Kirk found at http://msdn.microsoft.com/en-us/library/ms978384.aspx."
