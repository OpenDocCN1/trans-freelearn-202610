    9. Clicking on the icon will allow users to subscribe to the RSS and see the events
    in a browser. For example, in a browser like Firefox the feed would appear as:


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_329_1.png)


    # There''s more...


    One of the things you can do with a feed of calendar events is create an "Upcoming
    Events" page by consuming the feed within your own portal.


    # Designing your own forms


    Forms and Lists (the successor of User Defined Table) is a powerful DNN module
    for creating your own forms and displaying them on your pages. As Portal Administrator
    you can define the data you want to collect and grant access to your users to
    add, update, and delete the records.


    In this recipe we will see how to define a new form with the data types provided
    by DNN and how to collect the data and display it in a searchable list.'
  merge: -1
  img_proc: true
- pgno: 330
  md: 'To make it easier to define the forms, DNN provides special data types to describe
    the data. This table shows some of the available types that we will use in this
    recipe.


    | Data Type | Description |

    |---|---|

    | Text | Used to hold text information from edit boxes, radio buttons, or drop-down
    lists. |

    | Currency | Holds a value rounded to 2 digits and formatted using the currency
    symbol of the current culture setting. |

    | Date | Holds a date value. When used in a form DNN will provide a pop-up calendar.
    |

    | Download | Holds a file attached to the record. |

    | Email | Creates a mailto link. |

    | Image | Holds an image with optional dimensions. |

    | Integer | Holds an integer number. |

    | User Profile Link | Displays a hyperlink to a user profile. |

    | Separator | Used to group columns on the form. |

    | True/False | Displays a checkbox. |

    | URL | Holds a formatted URL. |


