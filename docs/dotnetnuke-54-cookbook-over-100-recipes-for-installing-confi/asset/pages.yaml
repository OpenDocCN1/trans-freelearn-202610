- pgno: 337
  md: '# 11


    # Challenging Custom Modules


    +   - Making modules searchable

    +   - Exporting module data

    +   - Importing module data

    +   - Exporting and importing user defined tables

    +   - Creating custom module actions

    +   - Using HTML in the manifest

    +   - Deploying a new module version

    +   - Using multiple database connections


    # Introduction


    So far in this book we have looked at the different modules that are available
    in DNN along with how to develop your own custom modules. In this chapter, we
    will look at some advanced module development techniques. We will learn more about
    the DNN interfaces for searching, importing, exporting, and updating modules.
    We will also explore some lesser known techniques such as using HTML in the manifest
    and using multiple database connections.'
