- pgno: 314
  md: '# Using the HTML module with replacement tokens


    The HTML module allows the substitution of dynamic content to replace special
    text tokens. With tokens you can include information from the DNN database in
    your HTML content.


    Here are some of the tokens that we will use in this recipe:


    | Token | Description |

    |---|---|

    | `[Portal:Email]` | E-mail of the primary administrator. |

    | `[Portal:FooterText]` | The site copyright text. |

    | `[Portal:HomeDirectory]` | The home directory of the portal. |

    | `[Portal:PortalName]` | The name of the portal. |

    | `[User:DisplayName]` | The display name of the current user. |

    | `[User:Email]` | The e-mail of the current user. |

    | `[Tab:Description]` | Description of the current page. |

    | `[Tab:TabName]` | Name of the current page. |

    | `[DateTime:Now]` | Current date and time. |


    > To see more examples of Token replacements, there''s a good list on the Data
    Springs website: `http://www.datasprings.com/resources/ArticlesInformation/DNNTextHTMLTokenReplacementOptions.aspx`.


    # Getting ready


    To follow along with this recipe you should be familiar with the basic content
    management tasks from *Chapter 2, Managing Users and Site Setup* (such as *Adding
    a module to a page*).


    # How to do it...


    +   1. Log in as Portal Administrator (`sysadmin` in our examples).

    +   2. Add the HTML module to a new or existing page.

    +   3. From the **HTML Module** menu, select **Settings** (or click on the Settings
    icon).

    +   4. Scroll down to the **HTML Module Settings**:'
  merge: -1
  img_proc: true
- pgno: 315
  md: '![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_315_0.png)


    +   5. Make sure **Replace Tokens** is checked.

    +   6. Click on **Update** to save your changes.

    +   7. Select **Edit Content** from the module menu (or click on the **Edit Content**
    icon).

    +   8. When the HTML editor is displayed, click on the **HTML** button at the
    bottom. This will let us edit the HTML directly and avoid any automatic formatting.

    +   9. Type the following HTML into the editor:

    +   ```

    +   <p>Site Status Report ([DateTime:Now])</p>

    +   <hr />

    +   <p><strong>Current User:</strong></p>

    +   <p>Display Name: [User:DisplayName]</p>

    +   <p>Email: [User:Email]</p>

    +   <p><strong>Current Page:</strong></p>

    +   <p>Name: [Tab:TabName]</p>

    +   <p>Description: [Tab:Description]</p>

    +   <p><strong>Portal Information:</strong></p>

    +   <p>Name: [Portal:PortalName]</p>

    +   <p>Contact: [Portal:Email]</p>

    +   ```

    +   10. Click on **Save** to save your changes.'
