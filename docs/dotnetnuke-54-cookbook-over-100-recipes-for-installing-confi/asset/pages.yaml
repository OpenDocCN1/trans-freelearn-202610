  md: '# How it works...


    DNN does a lot of work behind the scenes to handle navigation through the site
    (things like friendly URL rewriting). Most navigation is handled automatically
    but if you need to control specific navigation in your module you can use NavigateURL
    with the appropriate parameters.


    # Displaying module messages and event logging


    When developing DNN modules, they are many times when it is useful to display
    a message on the page or log a message to the event log for later analysis. In
    this recipe we will see how to use the AddModuleMessage and AddLog methods.


    AddModuleMessage is a method in the DotNetNuke.UI.Skins.Skin namespace useful
    for simple messages you want to display on the page. There are four message types
    you can use to highlight your message:


    +   - `BlueInfo`: This is a good type to use when you want to inform the user
    something has happened, but it''s not a success or failure type of action.

    +   - `GreenSuccess`: This is a good type to use when the user has performed some
    action and you want to draw their attention to its success. If you use a message
    upon success, it''s a good idea to also use a message upon failure.

    +   - `YellowWarning`: A useful type when an action did not fully succeed but
    it''s not certain the action was a failure.

    +   - `RedError`: Most effective if used in moderation. This is good for serious
    errors or cases when the user cannot proceed until the error is fixed.


    AddLog is found in the DotNetNuke.Services.Log.EventLog namespace and writes a
    message to the site event log. It is useful when you want to record that an event
    has taken place but you do not want to display a message to the user. This is
    very useful for debugging a live site. Note that logging can be turned off by
    the Portal Administrator so you''ll need to make sure logging is turned on to
    follow this recipe.


    # Getting ready


    To follow along with this recipe you must have completed the following recipe
    from *Chapter 6, Data Entry Tricks:*


    +   - *Displaying a Datagrid with filter controls*'
  merge: -1
