    # Controlling the friendly URL rewriting


    Since version 3, DNN has provided a mechanism to automatically convert the real
    URLs used for DNN pages to "friendly" URLs more compatible with people and search
    engines. For example, as search engines tend to ignore pages that use parameters,
    the URL http://www.dotnetnuke.com/default.aspx?tabid=527 could be converted to
    the more friendly URL http://www.dotnetnuke.com/tabid/527/default.aspx.


    This URL Rewriting is done automatically by following a set of rules saved in
    a special file called SiteUrls.config found in the root folder of the DNN installation.
    But there are situations where you may want to change how the automatic rewriting
    is done.


    In this recipe, we will show how to override the URL rewriting to create our own
    friendly URL mapping to a specific DNN page.


    # Getting ready


    For this recipe imagine we have a DNN page we created with the URL http://localhost/dotnetnuke/default.aspx?tabid=123.
    As this is an awkward URL, we will create a friendly "alias" called http://localhost/dotnetnuke/SamplePage.aspx
    that goes to the same place.


    > The rules for URL rewriting are written using Regular Expressions. You can learn
    more about the syntax of regular expressions at http://www.regular-expressions.info.'
  merge: -1
  img_proc: true
- pgno: 323
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 324
  md: "3. To create our own URL rewrite, add the following rule:\n\n```\n<?xml version=\"\
    1.0\" encoding=\"utf-8\" ?>\n<RewriterConfig>\n    <Rules>\n        <RewriterRule>\n\
    \            <LookFor>.*/SamplePage.aspx</LookFor>\n            <SendTo>~/default.aspx?tabid=123</SendTo>\n\
    \        </RewriterRule>\n        <RewriterRule>\n            <LookFor>.*DesktopDefault.aspx(.*)</LookFor>\n\
    \            <SendTo>~/Default.aspx$1</SendTo>\n        </RewriterRule>\n    </Rules>\n\
    </RewriterConfig>\n```\n\n4. Save the file.\n\n5. With this rule in place anyone\
    \ navigating to http://www.yoursite.com/SamplePage.aspx will automatically redirect\
    \ to http://www.yoursite.com/default.aspx?tabid=123.\n\n# See also\n\nOne word\
    \ of warning when creating your own redirecting URL: you can get unexpected results\
    \ if you redirect to a similarly named file that exists in another location called\
    \ by the site. So always test your changes on a development site before making\
    \ them on a production site.\n\n# Tracking your site with Google Analytics\n\n\
    Google Analytics is a tool from Google for tracking the activity on your website.\
    \ It works by placing a tracking ID on your pages that Google can log and report\
    \ on as people visit your site.\n\nTo use Analytics in DNN, you need to configure\
    \ the Google Analytics module and you need a publically accessible DNN portal\
    \ so that you can track your visitors. You also need to sign up for an Analytics\
    \ account though you can use your Google Gmail account if you have one.\n\n# Getting\
    \ ready\n\nIn this recipe we will use a sample Gmail account to log into Google\
    \ Analytics and get a tracking number we can use in our DNN site.\n\nTo follow\
    \ along with this recipe you must have the following:\n\n+   - An Analytics or\
    \ Gmail account (you can get a free one by going to http://mail.google.com and\
    \ clicking on the Create an Account button).\n+   - The username and password\
    \ to your account."
  merge: -1
  img_proc: true
