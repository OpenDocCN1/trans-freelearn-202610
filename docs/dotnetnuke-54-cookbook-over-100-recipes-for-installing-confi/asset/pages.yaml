- pgno: 138
  md: '# There''s more...


    This recipe shows the simplest way to display data. In Chapter 6 we will see how
    to replace the datalist control with a more powerful datagrid control.


    # See also


    We''ve taken the first step in changing the module created by the Starter Kit
    into a module we can deploy to a DNN portal. See the recipe Building an Edit control
    for the next step in the process.


    # Building an Edit control


    In this recipe we will create a basic Edit control from the code generated by
    the Starter Kit. The Edit control displays a single record from the database using
    textboxes so we can edit the values. It also includes Update, Cancel, and Delete
    links to save, cancel, or delete the record.


    The Starter Kit creates the control with a single field labeled "Content", a textbox,
    and a validation control to print a warning message if the record is saved without
    a value. This is a good start but we want to take out the content field and replace
    it with the five fields from the sample Employee table creating a control that
    will look something like this:


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_138_0.png)


    In this recipe we''ll get a closer look at the EditEmployee control and see how
    it displays a selected employee record using four special pieces:


    +   - Label: The common control that displays the name of the edit field and includes
    a small help icon (?) to provide more information.

    +   - TextBox: A standard input control for typing text.

    +   - Required field validator: A special control that will show an error message
    if we do not supply a value in the TextBox.

    +   - Update link button: When clicked will trigger an event we can trap and write
    code for.'
  merge: -1
  img_proc: true
