- pgno: 342
  md: "# Exporting module data\n\nOne of the features available to a DNN module is\
    \ the ability to export data from the database into an XML file. This makes it\
    \ possible to save or transfer data collected through one portal to another portal\
    \ or other application. This feature appears in the module action menu but also\
    \ for the page export and portal template creation. Exporting and importing are\
    \ done with the `iPortable` interface and require defining what fields from the\
    \ module should be in the export.\n\nIn this recipe we'll use the sample Employee\
    \ module from *Chapter 5, Building, Debugging, and Deploying Modules* and see\
    \ the code we must add to implement the interface and perform an export.\n\n#\
    \ Getting ready\n\nTo follow along with this recipe you must have completed the\
    \ following recipe from *Chapter 5*:\n\n+   - *Deploying a module as a standalone\
    \ package*\n\n# How to do it...\n\n+   1. Start by launching the Development Tool\
    \ and loading the Employee project.\n+   2. Double-click to open the `EmployeeController.vb`\
    \ file.\n+   3. Scroll down to the **Optional Interfaces** region and look for\
    \ the `ExportModule` function.\n+   4. We need to define the fields of the module\
    \ that are available for export. The original Starter Kit created one temporary\
    \ field called Content. We need to replace Content with the actual module fields\
    \ as follows:\n\n```\nPublic Function ExportModule(ByVal ModuleID As Integer)\
    \ As String\n    Implements DotNetNuke.Entities.Modules.IPortable.ExportModule\n\
    \n    Dim strXML As String = \"\"\n\n    Dim colEmployees As List(Of EmployeeInfo)\
    \ = _\n                                      GetEmployees(ModuleID)\n    If colEmployees.Count\
    \ <> 0 Then\n        strXML += \"<Employees>\"\n        Dim objEmployee As EmployeeInfo\n\
    \        For Each objEmployee In colEmployees\n            strXML += \"<Employee>\"\
    \n\n                strXML += \"<EmpFirstName>\" &\n```"
  merge: -1
  img_proc: true
- pgno: 343
  md: "```\n```vb\nXMLEncode(objEmployee.EmpFirstName) & \"</EmpFirstName>\"\nstrXML\
    \ += \"<EmpLastName>\" &\n    XMLEncode(objEmployee.EmpLastName) & \"</EmpLastName>\"\
    \nstrXML += \"<ManagerNo>\" &\n    XMLEncode(objEmployee.ManagerNo) & \"</ManagerNo>\"\
    \nstrXML += \"<HireDate>\" &\n    XMLEncode(objEmployee.HireDate) & \"</HireDate>\"\
    \nstrXML += \"<Salary>\" &\n    XMLEncode(objEmployee.Salary) & \"</Salary>\"\n\
    \nstrXML += \"</Employee>\"\nNext\nstrXML += \"</Employees>\"\nEnd If\n\nReturn\
    \ strXML\n\nEnd Function\n```\n```\n\n+   5. That's all the code that is needed.\
    \ To test the results, start by rebuilding and redeploying the module.\n+   6.\
    \ Go to the page with the Employee module and select **Export Content** from the\
    \ module action menu.\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_343_0.png)\n\
    \n+   7. Select a temporary folder (Root for example) and click on the **Export**\
    \ link.\n+   8. To view the XML file it created look in the root folder of your\
    \ portal (for example, `dotnetnuke\\\\Portals\\\\0`). Look for the file content\
    \ `.ACMEEmployee.ACMEEmployees.xml`.\n+   9. Depending on how many records were\
    \ in the employee table, the file will look something like this:\n\n```\n```xml\n\
    <?xml version=\"1.0\" encoding=\"utf-8\" ?>\n- <content type=\"ACMEEmployee\"\
    \ version=\"01.00.00\">\n  - <Employees>\n    - <Employee>\n      - <EmpFirstName>\n\
    \        - <![CDATA[ John\n]]>\n```\n```"
  merge: -1
  img_proc: true
- pgno: 344
  md: "# Challenging Custom Modules\n\n```\n```xml\n</EmpFirstName>\n- <EmpLastName>\n\
    \  - <![CDATA[ Smith\n]]>\n</EmpLastName>\n- <ManagerNo>\n  - <![CDATA[ 0\n]]>\n\
    </ManagerNo>\n- <HireDate>\n  - <![CDATA[ 3/23/2010\n]]>\n</HireDate>\n- <Salary>\n\
    \  - <![CDATA[ 25000\n]]>\n</Salary>\n</Employee>\n</Employees>\n</content>\n\
    ```\n```\n\n# How it works...\n\nAdding the code to the `ExportModule` function\
    \ provided the XML tags needed to save our custom data in the XML file. The `iPortable`\
    \ interface did the rest.\n\n# There's more...\n\nYou may be tempted to export\
    \ all the fields in your module but there are a few simple rules when picking\
    \ the export fields:\n\n+   - Do not include ModuleId or ItemId as these are regenerated\
    \ by the system on import\n+   - Similarly, there is no need to export create\
    \ and update dates\n+   - You do not need to include calculated fields unless\
    \ the export is for another module or application\n+   - In general, export only\
    \ the fields needed for the insert routine used by your import code (the `AddEmployee`\
    \ routine for example)\n\n# See also\n\nTo see how to load your module table with\
    \ the records from this export, see the next recipe  \n*Importing module data.*"
  merge: -1
  img_proc: true
- pgno: 345
  md: "# Importing module data\n\nAs we saw in the Exporting module data recipe, DNN\
    \ provides tools for importing and exporting data in and out of the database using\
    \ the iPortable interface. To use the interface we must define the fields in the\
    \ export file and define how to save these fields when the file is imported.\n\
    \nIn this recipe we'll use the export file from the previous recipe to import\
    \ into the sample Employee module.\n\n# Getting ready\n\nTo follow along with\
    \ this recipe you must have completed the following previous recipes:\n\n+   -\
    \ Deploying a module as a standalone package\n+   - Exporting module data\n\n\
    # How to do it...\n\n+   1. Start by launching the Development Tool and loading\
    \ the Employee project.\n+   2. Double-click to open the EmployeeController.vb\
    \ file.\n+   3. Scroll down to the Optional Interfaces region and look for the\
    \ ImportModule subroutine.\n+   4. We need to define the fields in the XML file\
    \ we can import. The original starter kit created one temporary field called Content.\
    \ We need to replace Content with the actual fields as follows:\n\n```\nPublic\
    \ Sub ImportModule(ByVal ModuleID As Integer,\n    ByVal EmpFirstName As String,\
    \ ByVal Version As String,\n    ByVal UserId As Integer) Implements\n        DotNetNuke.Entities.Modules.IPortable.ImportModule\n\
    \nDim xmlEmployee As XmlNode\nDim xmlEmployees As XmlNode = GetContent(EmpFirstName,\n\
    \    \"Employees\")\n\nFor Each xmlEmployee In xmlEmployees.SelectNodes(\"Employee\"\
    )\nDim objEmployee As New EmployeeInfo\nobjEmployee.ModuleId = ModuleID\n\nobjEmployee.EmpFirstName\
    \ =\n    xmlEmployee.SelectSingleNode(\"EmpFirstName\").InnerText\nobjEmployee.EmpLastName\
    \ =\n    xmlEmployee.SelectSingleNode(\"EmpLastName\").InnerText\nobjEmployee.ManagerNo\
    \ =\n```"
  merge: -1
  img_proc: true
- pgno: 346
  md: "```\nxmlEmployee.SelectSingleNode(\"ManagerNo\").InnerText\nobjEmployee.HireDate\
    \ =\n    xmlEmployee.SelectSingleNode(\"HireDate\").InnerText\nobjEmployee.Salary\
    \ =\n    xmlEmployee.SelectSingleNode(\"Salary\").InnerText\n\nobjEmployee.CreatedByUser\
    \ = UserId\nAddEmployee(objEmployee)\n    Next\n\nEnd Sub\n```\n\n+   5. That's\
    \ all the code that is needed on the import side. To test the results, start by\
    \ rebuilding and redeploying the module.\n+   \n+   6. Go to the page with the\
    \ Employee module and select **Import Content** from the module action menu.\n\
    \n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_346_0.png)\n\n+   7. Select Root for\
    \ the Folder and select the file from your previous export.\n+   \n+   8. Click\
    \ on the Import link.\n+   \n+   9. The records from the XML export file will\
    \ now load into the Employee table. If you are importing back into the table that\
    \ created the export, you will likely see duplicate records. This occurs because\
    \ we don't include ItemID in our export. When the new records are imported, new\
    \ ItemIDs are generated.\n\n# How it works...\n\nAdding the code to the `ImportModule`\
    \ function defined how the fields from the XML file fit into the `EmployeeInfo`\
    \ object which saves the data in the database.\n\n# Exporting and importing user\
    \ defined tables\n\nIn the previous two recipes we saw how to import and export\
    \ data in and out of a module using an XML file. This is built-in functionality\
    \ that is available to all DNN modules. With the Form and List module you have\
    \ an extra option to import and export data from your custom table using a Comma\
    \ Separated Values (CSV) file instead of XML."
  merge: -1
  img_proc: true
