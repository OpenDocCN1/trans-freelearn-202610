    # Exploring Skin Objects


    In the previous recipes we saw examples of Skin Objects inserting DNN functionality
    like the Login link and the menu through text tokens (in HTML) or controls (in
    ASCX). In this recipe we will expand the sample ASCX skin and demonstrate additional
    Skin Objects you can use.


