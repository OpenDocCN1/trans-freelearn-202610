- pgno: 91
  md: '# How it works...


    A Wiki in DNN is really a collection of topics connected with hyperlinks. You
    designate a hyperlink in your Wiki topic by enclosing the target page name in
    double-brackets ([[ and ]]). Be sure the page name in brackets matches the actual
    page name of the Topic or the link will not work. You may also specify a different
    caption for the link by using the tag [[Target Page Name|Caption]]. For example,
    [[Physical Computing|Click here to see Physical Computing]] will create a link
    to the Physical Computing topic but the link will say "Click here to see Physical
    Computing".


    # Publishing sets of popular links


    A very useful feature offered by DNN is the links module. The links module is
    a set of popular website links you provide for your users. Not only are these
    links a convenience for your users but also a means of gathering statistics.


    # Getting ready


    To follow this recipe you must have the Links module installed on your DNN site.
    See the recipe Installing standard DNN modules in Chapter 1 for instructions.


    # How to do it...


    +   1. Log in as the Portal Administrator (`sysadmin` in our examples).

    +   2. Look at the Control Panel and make sure you are in Edit mode.

    +   3. Navigate to the page that will hold the list of Links.

    +   4. From the Control Panel, pick the **Common Tasks** tab and select the **Links**
    module from the drop-down list.

    +   5. Choose **ContentPane** from the drop-down list and click on the **Add Module**
    button.'
  merge: -1
  img_proc: true
