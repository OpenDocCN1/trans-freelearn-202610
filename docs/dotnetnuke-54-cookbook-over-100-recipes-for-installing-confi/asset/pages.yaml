- pgno: 248
  md: "# Creating a simple ASCX skin\n\nAlthough you can develop skins in HTML and\
    \ parse them into ASCX, many developers prefer to work directly in ASCX. This\
    \ has the advantage that changes in the file can be immediately displayed rather\
    \ than needing parsing first. Which approach you choose often depends on your\
    \ background. If you are more familiar with ASCX you may find it easier than using\
    \ HTML. However, if you do switch to ASCX make sure the original HTML file is\
    \ removed, otherwise your changes may be overwritten by anyone repairing the original\
    \ HTML file.\n\nThere are a few small differences when developing ASCX-based skins.\
    \ When using Skin Objects' controls in ASCX, you first place a register directive\
    \ for the control at the top of the file before referencing it in the body of\
    \ the ASCX file. After the control has been registered, you can use it as many\
    \ times as desired providing you give each one a unique ID.\n\nHere is a diagram\
    \ of the page layout we will create:\n\n| Menu | User   Login |\n|---|---|\n|\
    \ ContentPane | RightPane |\n\n# How to do it...\n\n+   1. Start by locating the\
    \ default skin folder within your test DNN portal (`\\\\Portals\\\\_default\\\\\
    Skins`).\n+   2. Next, create a new folder to hold the skin files. Call this folder\
    \ SampleASCXSkin.\n+   3. Launch the Development Tool.\n+   4. From the **File**\
    \ menu, select **New File...**.\n+   5. In the **New File** dialog, select **Web\
    \ User Control** and click on **Open.**\n+   6. The first step is to place the\
    \ following directive at the top of the file:\n\n```\n<%@ Control language=\"\
    vb\" AutoEventWireup=\"false\" Explicit=\"True\"\n             Inherits=\"DotNetNuke.UI.Skins.Skin\"\
    \ %>\n```\n\n> Older skins (before 5.x) did not inherit from DotNetNuke.UI.Skins.Skin,\
    \ so if you need to convert an older skin to 5.x, you will need to add this.\n\
    \n+   7. The next step is to add a register directive for each Skin Object we\
    \ plan to use:\n\n```\n<%@ Register TagPrefix=\"dnn\" TagName=\"NAV\"\n      \
    \       Src=\"~/Admin/Skins/Nav.ascx\" %>\n<%@ Register TagPrefix=\"dnn\" TagName=\"\
    USER\"\n             Src=\"~/Admin/Skins/User.ascx\" %>\n```"
  merge: -1
  img_proc: true
- pgno: 249
  md: "```\n```aspx\n<%@ Register TagPrefix=\"dnn\" TagName=\"LOGIN\"\n    Src=\"\
    ~/Admin/Skins/Login.ascx\" %>\n```\n```\n\n+   8. To create the navigation menu\
    \ we'll add a DIV and insert the NAV control:\n+   \n+   ```html\n+   <div >\n\
    +       <dnn:NAV runat=\"server\" id=\"dnnNAV\"\n+           ProviderName=\"DNNMenuNavigationProvider\"\
    \n+           IndicateChildren=\"false\"\n+           ControlOrientation=\"Horizontal\"\
    \ />\n+   </div>\n+   ```\n\n+   9. Then add the code to create the User and Login/Logout\
    \ links:\n+   \n+   ```html\n+   <div id=\"login_style\" class=\"user\">\n+  \
    \     <dnn:USER runat=\"server\" id=\"dnnUSER\" CssClass=\"user\" />\n+      \
    \ &nbsp;&nbsp;|&nbsp;&nbsp;\n+       <dnn:LOGIN runat=\"server\" id=\"dnnLOGIN\"\
    \ CssClass=\"user\" />\n+   </div>\n+   ```\n\n+   10. Lastly, we create the content\
    \ panes using an HTML table, but enclose it in a DIV:\n+   \n+   ```html\n+  \
    \ <div class=\"content\">\n+       <table width=\"100%\" border=\"0\" cellspacing=\"\
    0\" cellpadding=\"0\">\n+           <tr>\n+               <td valign=\"top\" id=\"\
    LeftPane\" class=\"LeftPane\"\n+                   runat=\"server\" visible=\"\
    false\">\n+               </td>\n+               <td valign=\"top\" id=\"ContentPane\"\
    \ class=\"ContentPane\"\n+                   runat=\"server\" visible=\"false\"\
    >\n+               </td>\n+               <td valign=\"top\" id=\"RightPane\"\
    \ class=\"RightPane\"\n+                   runat=\"server\" visible=\"false\"\
    >\n+               </td>\n+           </tr>\n+       </table>\n+   </div>\n+ \
    \  ```\n\n+   11. The entire file should now look like this:\n\n```\n```aspx\n\
    <%@ Control language=\"vb\" AutoEventWireup=\"false\" Explicit=\"True\"\n    Inherits=\"\
    DotNetNuke.UI.Skins.Skin\" %>\n\n<%@ Register TagPrefix=\"dnn\" TagName=\"NAV\"\
    \n    Src=\"~/Admin/Skins/Nav.ascx\" %>\n<%@ Register TagPrefix=\"dnn\" TagName=\"\
    USER\"\n    Src=\"~/Admin/Skins/User.ascx\" %>\n<%@ Register TagPrefix=\"dnn\"\
    \ TagName=\"LOGIN\"\n```\n```"
  merge: -1
  img_proc: true
