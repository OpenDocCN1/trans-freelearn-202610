    # Displaying a Datagrid with filter controls


    In this recipe we will replace the simple Datalist control with a more powerful
    Datagrid control and add a collapsible panel with filters. This is a useful combination
    of data entry controls that allows the searching and displaying of module records.


    # Getting ready


    To follow along with this recipe you must have completed the following recipes:


    +   - *Creating collapsible panels*

    +   - *Populating a drop-down list from a DNN list*

    +   - *Populating a drop-down list from a stored procedure*


    # How to do it...


    +   1. Launch the Development Tool and load the Employee project.

    +   2. Expand the `References` folder and make sure `DotNetNuke.WebControls` is
    shown.'
