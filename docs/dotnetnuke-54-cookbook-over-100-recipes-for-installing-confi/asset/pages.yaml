    \ within called `/images`.\n+   3. From the DNN installation, take any six of\
    \ the sample vendor images from the `\\dotnetnuke\\Portals\\0` folder and copy\
    \ them into the `/images` folder.\n+   4. Rename the image files `vendor1.gif`,\
    \ `vendor2.gif` all the way to `vendor6.gif`. At this point the `/images` folder\
    \ should contain the following images:\n\n![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_391_0.png)\n\
    \n+   5. Now launch the Development Tool.\n+   6. Select **Open File...** from\
    \ the **File** menu.\n+   7. Browse to the `SampleASCXSkin` folder and open the\
    \ `SampleASCXSkin.ascx` file.\n+   8. Scroll down to the HTML table holding the\
    \ different panes and add the following code to the `Left Pane`:\n\n```\n```html\n\
    <div class=\"content\">\n    <table width=\"100%\" border=\"0\" cellspacing=\"\
    0\" cellpadding=\"0\">\n        <tr>\n            <td valign=\"top\" id=\"LeftPane\"\
    \ class=\"LeftPane\"\n                runat=\"server\" visible=\"false\">\n\n\
    \                <object id=\"ContentRotator\" codeptype=\"dotnetnuke/client\"\
    \n                        codebase=\"RotatorWidget\" declare=\"declare\">\n  \
    \                  <param name=\"imageCount\" value=\"6\" />\n               \
    \     <param name=\"imageURL\" value=\"<%=SkinPath %>images/\" />\n          \
    \          <param name=\"imageTemplate\" value=\"vendor{INDEX}.gif\" />\n```\n\
    ```"
  merge: -1
  img_proc: true
