- pgno: 352
  md: '# How it works...


    When calling Actions.Add() to define the new action, nine key arguments are passed.
    In this table you can see the arguments and how they were used in this example:


    | Argument | Original template action | New action |

    |---|---|---|

    | Title | Pulled from resource file | Hardcoded "Show Statistics" |

    | Command name/Action | AddContent | AddContent |

    | Optional Parameter | None | "ShowStats" |

    | Icon to display | None | "view.gif" |

    | Optional URL | EditUrl() | None |

    | Action event T/F | False | False |

    | Required security level | Edit | View |

    | Visible T/F | True | True |

    | New window T/F | False | False |


    # There''s more...


    In this example we hardcoded our menu item text "Show Statistics" and the numbers
    for our statistics. This was done to make the example easier to read. In real
    modules you should avoid hard coding text by using the resource file (something
    like Localization.GetString("StatisticsPrompt", LocalResourceFile).


    # Using HTML in your manifest


    Although the manifest file is primarily for telling DNN where to install the various
    pieces of your module, the manifest does contain text for things like the release
    notes and the user license. Rather than using plain text for these documents it
    is possible to use HTML to format the information.


    In this recipe we will enhance the manifest file by using HTML formatting.


    # Getting ready


    To follow along with this recipe you must have completed the following recipe
    from Chapter 5, Building, Debugging, and Deploying Modules:


    +   - Editing the Manifest File'
  merge: -1
  img_proc: true
- pgno: 353
  md: '# How to do it...


