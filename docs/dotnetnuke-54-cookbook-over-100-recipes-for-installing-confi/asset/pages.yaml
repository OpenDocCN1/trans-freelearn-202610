- pgno: 183
  md: "```\nEmp.ItemId,\nEmp.FirstName,\nEmp.LastName,\nManagerNo,\nHireDate,\nSalary,\n\
    CreatedByUser,\nEmp.CreatedDate,\n'CreatedByUserName' = Usr.FirstName + ' ' +\
    \ Usr.LastName\nfrom {objectQualifier}ACME_Employee As Emp\ninner join {objectQualifier}Users\
    \ As Usr on Emp.CreatedByUser = Usr.UserId\nwhere ModuleId = @ModuleId And ManagerNo\
    \ = 0\n\nGO\n```\n\n7. Next we need to create the routines that will connect the\
    \ employee controller to this stored procedure. Double-click to open the DataProvider.vb\
    \ file.\n\n8. Scroll down to the bottom of the file and look for the region of\
    \ code called Abstract methods. Add the following function definition:\n\n```\n\
    Public MustOverride Function GetManagers(ByVal ModuleId As Integer) As IDataReader\n\
    ```\n\n9. Now, open the SqlDataProvider.vb and scroll to the bottom of the file\
    \ to the Public methods region. Add the new function:\n\n```\nPublic Overrides\
    \ Function GetManagers(ByVal ModuleId As Integer) As IDataReader\n    Return CType(SqlHelper.ExecuteReader(ConnectionString,\n\
    \        GetFullyQualifiedName(\"GetManagers\"),\n        ModuleId), IDataReader)\n\
    End Function\n```\n\n10. Next we need to change the EmployeeController file. Double-click\
    \ on EmployeeController.vb and scroll down to the bottom of the Public methods\
    \ region. Add the following code:\n\n```\nPublic Function GetManagers(ByVal ModuleId\
    \ As Integer) As List(Of EmployeeInfo)\n\n    Return CBO.FillCollection(Of EmployeeInfo)(DataProvider.Instance().GetManagers(ModuleId))\n\
    \nEnd Function\n```"
