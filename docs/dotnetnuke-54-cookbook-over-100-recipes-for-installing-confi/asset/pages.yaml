    +   2. Double-click to open the Employee.dnn file.

    +   3. Scroll down until you see the section labeled <license>.

    +      `<license src="license.txt" />.`

    +   4. Replace the reference to license.txt with a character data tag (CDATA)
    and the HTML representing your formatted license text:

