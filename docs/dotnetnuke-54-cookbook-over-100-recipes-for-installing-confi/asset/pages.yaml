- pgno: 253
  md: 'In previous recipes we saw how to create new skins directly on a test DNN portal.
    This allows you to edit the files and immediately see the results just by refreshing
    your browser. But once a skin has been fully developed, this recipe will show
    you how to package your skin into a portable ZIP file using the package wizard.


    Once created, you can install the skin package on the DNN site by logging in as
    SuperUser then uploading the ZIP file and installing the skin package as an extension.
    The skin is installed in the \Portals\_default\Skins folder.


    > As of DNN 5.x, only the SuperUser can deploy skins. This was done as a security
    precaution as skins can now contain user-written code.


    # Getting ready


    For this recipe you will need skin files to deploy. We will use the skin files
