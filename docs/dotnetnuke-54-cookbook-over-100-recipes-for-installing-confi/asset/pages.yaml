  md: '# How it works...


    This is an optional recipe. Although you don''t need the source files to run a
    DNN site and they are not required to create modules, they are useful if you want
    to step through the DNN code while debugging and they offer valuable insights
    into how DNN was written.


    # See also


    The files downloaded in this recipe are used in the next recipe *Setting up a
    debugging environment.*


    # Setting up a debugging environment


    Once a module is deployed, how is it debugged? How can you trace step by step
    through the module code or set a breakpoint?


    In this recipe, we will configure the development tool to create a robust testing
    environment by combining the DNN source code and the module source code as a single
    solution. Then we can set breakpoints and go step by step through both the module
    and DNN code.


    Note that if you have already used this recipe to create a test environment you
    can''t rebuild the environment by running the recipe again. If you need to reinstall
    your development environment it is necessary to completely remove the environment
    before using this recipe to reinstall it.


    # Getting ready


    To follow along with this recipe you must have completed these recipes from *Chapter
    4*:


    +   ▸ *Installing Visual Web Developer 2010 Express*

    +   ▸ *Downloading the DNN 5 source code*


    # How to do it...


    +   1. Start by finding the folder where you downloaded the DNN source files (in
    these examples it was `My Documents\DNNSource\website`).

    +   2. Locate the file `release.config`. Copy this file and name it `web.config`.

    +   3. Now launch your preferred development tool (Visual Studio or Visual Web
    Developer Express).

    +   4. From the **File** menu, select **Open Web Site....**

    +   5. At the **Open Web Site** dialog, select the DNN source folder (`My Documents\DNNSource\website`)
    and click on **Open.**'
  merge: -1
  img_proc: true
