    # Creating an announcement


    The Announcements module is an easy way to publish regular bits of news or small
    pieces of content. An announcement consists of a title and a body, optionally
    an illustrating image and link to continue. In this recipe we will take one of
    the blank pages created earlier, add the Announcements module to it and create
    our first announcement.


    # Getting ready


    We''ll need some text and a picture to put in the announcement. For this example,
    we''ll imagine we have a technology news site and we want to add some news concerning
    a new product called "Mirror" used for reading RFID tags on a home computer.


    # How to do it...


    +   1. Begin by logging in as the Portal Administrator (*sysadmin* in our examples).

    +   2. Look at the Control Panel and make sure you are in Edit mode.

    +   3. Navigate to a blank page (like **Announcements** created in the recipe
    *Creating and organizing pages*).

    +   4. From the Control Panel, pick the **Common Tasks** tab and select the Announcements
    module from the drop-down list (if you don''t see the Announcements module listed,
    see *Chapter 1, Installing standard DNN modules* for more information).'
