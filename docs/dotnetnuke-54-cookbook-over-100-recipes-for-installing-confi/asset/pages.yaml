- pgno: 175
  md: '> The SectionHead control has to know what to hide or show. We tell it by assigning
    the ID of the table (tblPanel) to the Section property (Section="tblPanel").


    7. When the module is built and deployed it looks like this:


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_175_0.png)


    8. You can show and hide the controls by clicking the small minus sign next to
    the title Collapsible Panel.


    # How it works...


    In this example we created a collapsible panel by connecting a SectionHead control
    to an HTML table. The power of this control is that you can put anything inside
    the table: labels, drop down lists, or images and they will all show or hide together.
    This works well when you have something that takes up a lot of space on the page,
    but you don''t need to see it all the time.


    # Populating a drop-down list from a DNN list


    This recipe will show how to populate a drop-down list control from a DNN list
    we create as Host user. Using DNN lists to populate data entry controls means
    we can update the lists through the site without having to change and redeploy
    our custom modules.


    # Getting ready


    To follow along with this recipe you must have completed the following recipe:


    +   Creating a new module with the Starter Kit


    # How to do it...


    +   1. Log in as Host user (syshost in our examples).


    +   2. Look under the Host menu and select Lists.'
