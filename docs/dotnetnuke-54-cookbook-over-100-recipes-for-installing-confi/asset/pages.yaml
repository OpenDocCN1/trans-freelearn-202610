- pgno: 389
  md: '# 13


    # Advanced Skinning


    +   - Using the Rotator widget

    +   - Using the Visibility widget

    +   - Using the Stylesheet widget

    +   - Creating and deploying a custom widget

    +   - Using a custom widget in a skin

    +   - Using the rounded corner Super Stylesheet

    +   - Showing portal settings in a skin

    +   - Adding animation to a menu


    # ## Introduction


    In this chapter, we will take a deeper look at the topic of skinning that we explored
    back in *Chapter 8, Basic Skinning*. We will see several examples of skin widgets,
    how to add animation to a menu, super stylesheets, and using variables in skins.


    Most of the recipes we have seen so far are driven by code placed on the DNN server
    (modules and so forth). Skin widgets are a way of creating client-side code residing
    directly in the skin to give local functionality without having to run back and
    forth to the server.


    Widgets contain pieces of JavaScript that can be placed in a skin and run on the
    client side. They are very similar to the Skin Objects we demonstrated in *Chapter
    8, Basic Skinning*, but have a lot more functionality and can be customized to
    include our own JavaScript. To use a widget, you reference the item in the skin
    using the HTML object element with PARAMS for the configuration options.


    DNN includes several useful widgets found in the `\Resources\Widgets` folder on
    the DNN server and in this chapter we will explore a few of them and see how to
    make our own.'
  merge: -1
  img_proc: true
- pgno: 390
  md: '# # Using the Rotator widget


    In this recipe we''ll see how to use the Rotator skin widget that automatically
    rotates between different graphic images one after another. This is useful for
    things such as animated banner ads or photo slide shows.


    The Rotator widget comes with different options controlling how the images are
    swapped and how long they are displayed. To use the Rotator widget we need a set
    of images to rotate. For this example we will use some of the standard vendor
    images that come with a normal DNN installation.


    The Rotator uses an index variable to track the rotation, so the images must include
    a number in the filename such as `image1.gif`, `image2.gif`, `image3.gif`.


    # ## Getting ready


    To follow along with this recipe you must have completed the following recipe
    from *Chapter 8, Basic Skinning:*


    +   - Creating a simple ASCX skin


    The available parameters to the Rotator widget are:


    | Parameters | Description | Examples |

    |---|---|---|

    | `Direction` | The direction the images move during transition. | Left, Right,
    Up, Down, or Blend |

    | `Height` | The height of the image. | 120 |

    | `Width` | The width of the image. | 60 |

    | `ImageCount` | The number of images in the rotation. | 6 |

    | `ImageTemplate` | Specifies the names of all the image files to use. | `vendor{INDEX}.gif`
    |

    | `ImageURL` | The location of the images folder. | `<%=SkinPath %>images/` |

    | `Interval` | How many milliseconds to display each image before the next image
    is displayed. There are 1000 milliseconds per second so 2500 means display each
    image for two and half seconds before changing to the next image. | 2500 |

    | `Transition` | The style of the transition. Like a photo slideshow, you can
    have each image gently slide in or suddenly snap in. | Slide or Snap |'
  merge: -1
  img_proc: true
- pgno: 391
  md: "# How to do it...\n\n+   1. Find the folder called `SampleASCXSkin` that was\
