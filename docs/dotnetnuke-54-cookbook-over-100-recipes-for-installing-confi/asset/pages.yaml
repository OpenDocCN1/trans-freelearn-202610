    \ ID=\"ddlSalaryRange\" runat=\"server\" DataTextField=\"Text\" DataValueField=\"\
    Value\" AutoPostBack=\"true\">\n    </asp:DropDownList>\n</td>\n</tr>\n</table>\n\
    ```\n\n+   4. Now that we have a drop-down control, the next step is to add the\
    \ routines we need to populate the drop-down control from a stored procedure in\
    \ the database. Let's start by creating the stored procedure.\n\n+   5. Double-click\
    \ to open the 01.00.00.SqlDataProvider file.\n\n> If you have already installed\
    \ this module once, you can create a new file called 01.00.01.SqlDataProvider\
    \ to hold the new procedure. For details see the recipe Deploying a new module\
    \ version in Chapter 11.\n\n+   6. We'll add a new procedure to the script that\
    \ is very similar to the GetEmployees procedure created by the Starter Kit but\
    \ with a small tweak. In the sample Employee table, there is a field called ManagerNo\
    \ holding the ID of the employee's manager. If the ManagerNo is 0 it means the\
    \ employee is a manager. Therefore to get the list of all managers for the drop-down\
    \ control the stored procedure needs to select all employees who have a ManagerNo\
    \ of 0. The code for the procedure looks like this:\n\n```\ncreate procedure {databaseOwner}{objectQualifier}ACME_GetManagers\n\
    \n    @ModuleId int\n\nas\n\nselect Emp.ModuleId,\n```"
  merge: -1
