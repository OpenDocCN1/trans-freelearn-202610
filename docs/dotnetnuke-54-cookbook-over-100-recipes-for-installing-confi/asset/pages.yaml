- pgno: 11
  md: '# Preface


    DotNetNuke 5.4 is a powerful and flexible content management system for building
    websites. It comes with many features for publishing content, including tools
    to create Blogs, Banner Advertising, News Feeds, and much more. The chapters in
    this book provide example recipes that will show how to download, install, configure,
    and customize DotNetNuke with your own plugin modules.


    # What this book covers


    Chapter 1, Installation and Setup, explains downloading and installing the tools
    you need to create your own DotNetNuke website.


    Chapter 2, Managing Users and Site Setup, explains creating users, assigning security,
    and configuring your site.


    Chapter 3, Easy Tricks with Existing Modules, discusses installing and configuring
    the most popular modules.


    Chapter 4, Creating your Own Modules, explains installing the development tool
    and creating your first custom module.


    Chapter 5, Building, Debugging, and Deploying Modules, has in-depth examples of
    module development and debugging.


    Chapter 6, Data Entry Tricks, takes a look at common data entry controls for DotNetNuke.


    Chapter 7, Cool Web Controls, shows examples of web controls such as TreeView,
    TabStrip, and CAPTCHA validation.


    Chapter 8, Basic Skinning, explains how to style your site by creating custom
    skins.


    Chapter 9, Working with Foreign Languages, explains how to use localization to
    create a bilingual site.'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'Chapter 10, Advanced Tricks with Existing Modules, shows examples of more complicated
    modules demonstrating Flash, jQuery, XML feeds, URL rewriting, and more.


    Chapter 11, Challenging Custom Modules, shows examples of searching, importing,
    and exporting from custom modules.


    Chapter 12, Advanced Modules and Security, explains advanced module examples and
    security techniques.


    Chapter 13, Advanced Skinning, takes a look at skinning in more detail with animated
    menus, CSS, and Widgets.


    # What you need for this book


    DotNetNuke is a web-based content management system that uses Windows Internet
    Information Server (IIS) and the .NET Framework. To follow along with the recipes
    in this book, you will need the following:


    +   - IIS 5 or later found in Windows Server 2003, 2008, or 2008R2. For development
    you may use Windows XP Professional, Windows Vista, or Windows 7 (Home Premium
    and above).

    +   - Microsoft .NET Framework 2.5 or higher.


    # Who this book is for


    If you are a .NET developer with beginner to intermediate knowledge of Visual
    Basic or C# and want to develop a website/CMS using DotNetNuke, this book is for
    you.


    Familiarity with DNN operation, CSS, and basic web development (ASP.NET) skills
    is required.


    # Conventions


    In this book, you will find a number of styles of text that distinguish between
    different kinds of information. Here are some examples of these styles, and an
    explanation of their meaning.


    Code words in text are shown as follows: "We can include other contexts through
    the use of the include directive."


    A block of code is set as follows:


    ```

    <asp:TextBox ID="txtSalary" runat="server"></asp:TextBox>

    <asp:RequiredFieldValidator ID="valSalary" resourcekey="valSalary.ErrorMessage"
    ControlToValidate="txtSalary" CssClass="NormalRed" Display="Dynamic" ErrorMessage="<br>Salary
    is required" Runat="server" />

    ```'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'When we wish to draw your attention to a particular part of a code block, the
    relevant lines or items are set in bold:


    ```

    <tr valign="top">

    <td class="SubHead" width="125">

    <dnn:label id="lblSalary" runat="server" controlname="lblSalary" suffix=":">

    </dnn:label>

    </td>

    ```


    New terms and important words are shown in bold. Words that you see on the screen,
    in menus or dialog boxes for example, appear in the text like this: "If you like
    how it looks, click on Apply to apply the container to your site.".


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_13_0.png)


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_13_1.png)


