    \ %>` | Home directory of the current portal. |\n| `<%= PortalSettings.Version\
    \ %>` | The DNN version of your site. |\n| `<%= PortalSettings.UserInfo.DisplayName\
    \ %>` | The display name of the current user. |\n| `<%= PortalSettings.UserInfo.IsSuperUser\
    \ %>` | Is the current user a SuperUser (true/false). |\n\nTo demonstrate the\
    \ portal settings variables we will add a status box to the sample skin to display\
