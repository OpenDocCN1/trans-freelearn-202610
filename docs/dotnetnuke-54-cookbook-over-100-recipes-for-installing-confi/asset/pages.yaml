- pgno: 316
  md: '# Advanced Tricks with Existing Modules


    11. When the page is viewed, the tokens will be substituted with the current values
    from the portal settings:


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_316_0.png)


    # How it works...


    Text token substitution gives you the ability to provide dynamic content from
    the normally static HTML module. Tokens are simple to use and give you direct
    access to values stored in the DNN database. That said, there are some limits
    on the use of tokens. Token replacement, which is done on-the-fly, conflicts with
    page caching which wants to preserve copies of the page for quick retrieval. This
    can kill performance if overused.


