    # How it works...


    The Form and List module saves your form definitions in a table called UserDefinedFields
    in the DNN database. As new records are created, the values for each of the columns
    are saved in a table called UserDefinedData. If you would like to export your
    custom records from the DNN database see the recipe *Exporting from a user defined
    form* in *Chapter 11, Challenging Custom Modules*.


    # There''s more...


    Simple search will look for the text contained within any searchable column. If
    you are looking for a field starting with a given text use "| elec" or look for
    trailing parts using "onics|" and exact matches by "| electronics|". Advanced
    Search offers these options in a drop-down list and allows you to specify the
    column to search in.


    # See also


    To learn more about the Form and List module and see how to control the format
    of the lists, see the next recipe *Styling your own forms*.


    # Styling your own forms


