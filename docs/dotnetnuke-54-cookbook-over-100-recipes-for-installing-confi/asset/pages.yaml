- pgno: 46
  md: '# # Enabling user registration for your site


    Once you have installed your DNN website, the first thing you''re going to think
    about is how to create the users for it. In DNN users are created through the
    process of User Registration. You control how users can join the site by choosing
    one of the four membership options:


    +   - None: Users cannot register themselves. Instead the Portal Administrator
    must create each user as needed.

    +   - Private: Users create their own registration but the Portal Administrator
    approves the user registration before the user can access the site.

    +   - Public: Users create their own registration and gain immediate access.

    +   - Verified: Users create their own registration and gain access by clicking
    on a link in the confirmation e-mail.


    In this recipe we will show how to set the user registration for the site and
    demonstrate how the Verified membership works.


    # ## Getting ready


    When using the Private, Public, or Verified memberships, both the Portal Administrator
    and the new user will receive an e-mail alert as part of the registration process.
    To see this entire process demonstrated in this recipe you need a valid e-mail
    address and the site must be set up to send e-mails. To set up your site this
    way, see the recipe *Setting up a SMTP server with Gmail* at the end of this chapter.


    # ## How to do it...


    +   1. Begin by logging in as the Portal Administrator (sysadmin in our examples).

    +   2. Look at the Control Panel and make sure you are in Edit mode.

    +   3. Look under the **Admin** menu and select **Site Settings**.

    +   4. Look under **Advanced Settings** and expand **Security Settings**.


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_46_0.png)


    +   5. Select **Verified** for the registration type.

    +   6. Click on **Update** at the bottom of the page to save your changes.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '7. To test the new setting, log out of the site by clicking on the Logout link.


    8. By selecting a membership type that is not None, you will now see a Register
    link next to the Login link:


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_47_0.png)


    9. The register link will now also appear on the Login page:


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_47_1.png)


    10. Clicking on the Register link will display the User Registration form where
    users can provide their information:


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_47_2.png)'
  merge: -1
  img_proc: true
- pgno: 48
  md: '11. Click on the Register link to create the user.


    12. As the membership is Verified, the new user will receive a special e-mail
    containing a link that will complete the registration and add the user to the
    site. The e-mail looks something like this:


    ```

    From: admin@mycompany.abc [mailto:admin@mycompany.abc]

    Sent: Friday, September 17, 2010 12:59 PM

    To: Richard Roe

    Subject: MyCompany Intranet New User Registration


    Dear Richard Roe,


    We are pleased to advise that you have been added as a Registered User to MyCompany
    Intranet. Please read the following information carefully and be sure to save
    this message in a safe location for future reference.


    Portal Website Address: www.mycompany.abc

    Username: sjones

    Password: dnnuser

    Verification Code: 0-7


    You can use the following link to complete your verified registration:


    http://www.mycompany.abc/default.aspx?ctl=Login&username=rroe&verificationcode=0-7


    Thank you, we appreciate your support...


    MyCompany Intranet

    ```


    13. When the new user clicks on the link in the e-mail they are taken to the Log
    in page where an additional Verification Code field now appears. Providing the
    password and verification code will now give access to the user:


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_48_0.png)'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# How it works...


    Allowing users to register themselves with your site takes the burden of user
    creation off of the administrator. With the options of Private, Public, and Verified
    you can control the user registration process as much or as little as needed.


    # There''s more...


    When a user has attempted to register with the site, the Portal Administrator
    will receive an e-mail alert so that the administrator can take the appropriate
    steps to complete the registration. Here is an example:


    ```

    From: admin@mycompany.abc [mailto:admin@mycompany.abc]

    Sent: Friday, September 17, 2010 12:59 PM

    To: System Administrator

    Subject: MyCompany Intranet New User Registration


    Date: Friday, September 17, 2010

    First Name: Richard

    Last Name: Roe

    Unit:

    Street:

    City:

    Region:

    Country: N/A

    Postal Code:

    Telephone:

    Email: rroe@mycompany.abc

    ```


    # See also


    The fields that appear on the user registration form (first name, last name, and
    so on) are part of the user''s profile. To see how you can add your own fields
    and make them required for registration, see the recipe *Managing profile properties*
    later in this chapter.


    # Creating users and granting access


    In the previous recipe we saw how to allow users to create themselves in your
    portal through the user registration process. As administrator you also have the
    option to create users directly (indeed if you turn off the user registration
    you must create the users directly). This recipe will show you how to create your
    own users, assign them a password, and grant them access to the different pages
    of your portal.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# Getting ready


    To create users all you need is the Portal Administrator login. But there are
    some decisions to make. Should the new user get an e-mail to notify them when
    their account has been created? Should you automatically authorize them so they
    can immediately log in? Should you give them a random password and force them
    to change it when they first log in? This recipe shows how to set these options.


    # How to do it...


    +   1. Begin by logging in as the Portal Administrator (`sysadmin` in our examples).

    +   2. Look at the Control Panel and make sure you are in Edit mode.

    +   3. Look under the **Admin** menu and select **User Accounts**. You can also
    select the Users icon in the Admin tab of the Control Panel.

    +   4. The page shows a list of users.


    ![](img/65b6b07ef38faa4ed1c549e9eb9aa24b_50_0.png)


    +   5. To create a new user look at the bottom of the page and click on the **Add
    New User** link (or select it from the action menu).'
  merge: -1
  img_proc: true
- pgno: 51
