  相关内容外，您还会发现许多关于决策管理和 AI 的发人深思的文章。


  ![](img/a4c90ee3d142c33743706d37c65779c2_332_0.png)

  '
- "## 衡量流程转型的商业价值\n\n随着我们在本书中的进展，您可能已经注意到我们强调了业务流程在数字化转型背景下的重要性，以及这对您职业生涯的影响。\n\n\
  参与流程转型、数字化自动化计划以及业务运营的全面改造，可以帮助您培养新技能，从而增强您在业务技术方面的专业知识。我们旨在激励您探索业务流程的世界，并将其视为您专业技能组合中不可或缺的组成部分。\n\
  \n如何在您的业务群体或公司中传达拥抱流程管理的重要性，尤其是当一些同事持怀疑态度时？\n\n在当今快节奏的商业环境中，公司不断寻求改进、自动化并增强其运营流程的战略适应性，以保持竞争力，并应对一个可能一日千变的世界。\n\
  \n数字化举措失败的原因很简单：没有人能看到工作是如何完成的。有时，在全球范围内了解工作内容可能会面临重大挑战。不可见性会导致浪费和延误，AI 项目往往无法通过\
  \ AI 合规性检查。没有强大的流程架构，关于数字化转型或 AI 自动化计划的讨论缺乏坚实的基础。\n\n在 AI 驱动的未来，结构良好的流程架构将对治理至关重要，确保\
  \ AI 解决方案按照组织设定的负责任标准执行任务。通过要求对业务运营的每个步骤进行文档记录，流程架构强制执行可追溯性，使审计 AI 决策和 AI 驱动的流程变得更加容易——这是监管和道德合规性的基本要求。\n\
  \n虽然获得新技能和参与创新项目的前景可以让我们在工作中充满活力，但我们的业务赞助商必须证明并认可这些转型是成功的。数字化举措的成败取决于一个关键问题：我们能否证明业务回报？优化工作流、启动自动化项目，甚至重新架构整个流程景观听起来很有说服力。然而，最终，您的赞助商仍然会问：“给我看看钱”或者“投资回报率（ROI）是多少？”这就需要准确预测和衡量此类举措的商业价值或收益，而本章将使您能够自信地回答这些问题。\n\
  \n本章解决以下关键问题：\n\n- 什么是商业价值？\n- 为什么有必要衡量商业价值？\n- 衡量商业价值的关键指标有哪些？\n- 商业价值分析有哪些公认的方法论？\n\
  - 可以使用哪些工具和技术来衡量商业价值？\n- 衡量商业价值时有哪些常见挑战？\n- 一个**商业价值评估（BVA）**的案例研究是什么样子的？\n- 我们如何衡量\
  \ AI 转型的商业价值？\n\n## 什么是商业价值？\n\n在业务和流程转型方面，商业价值是指组织通过发现和改进其流程所获得的有形和无形收益。\n\n当我们在\
  \ Nordstrom 的 Citizen Developer Automation 计划开始规模扩大、成本增加并需要额外资源时，副总裁并没有要求一个更漂亮的仪表板——他要求展示每天节省了多少美元。\n\
  \n当 UnitedHealthcare 开始将流程自动化应用于新用例，使业务用户能够在高度受控的环境中编写和部署业务规则，以支持数百万 Medicare 用户时，第一步涉及创建一个\
  \ BVA。\n\n当 Microsoft 运营团队开始将 RPA 自动化应用于其手动采购订单流程时，赞助商希望通过基于场景的分析来评估这项投资，可靠地预测三年的商业价值。然后，为了获得更高的结果信心和可预测性，团队希望标准化所有自动化项目中捕获和预测商业价值的方式。\n\
  \n像这样的问题迫使从业者衡量商业价值，而不是衡量流程步骤的改进，并且通常在举措的最初阶段提出，这使得在项目早期预测此类数字变得有些具有挑战性，原因有几个。\n\
  \n在业务和流程转型方面，商业价值是指组织通过发现和改进其流程所获得的有形和无形收益。**商业价值分析（BVA）** 是一种结构化方法，用于识别具有可衡量收益的痛点，将解决方案选项与技术可行性相连接，应用组织特定的缩放因子，量化有形（资本、工时）和无形（**净推荐值（NPS）**、风险）收益，并随时间跟踪收益的实现，以持续改进框架并保持赞助商的参与度。\n\
  \n可以借助 BVA 衡量的以下业务收益：\n\n- 收入增加\n- 运营成本降低\n- 流程错误减少\n- 由于流程效率提高而带来的生产力提升\n- 员工参与度和效率提高\n\
  - 员工流失率降低\n- 客户满意度提高，流失率降低\n- 市场上的更强竞争地位\n- 客户忠诚度增加\n- 避免或减少不合规罚款\n- 解决方案开发成本降低\n\
  - 风险缓解\n\n在工作流自动化中，企业通过优化流程、减少人工干预和加速决策来实现价值。这类举措会带来一个更加敏捷和灵敏的商业环境，这一特征被称为**战略适应性**。\n\
  \n衡量商业价值使组织能够验证其投资、与战略目标保持一致，并促进持续改进。\n\n以下是一些有形收益的示例：\n\n- 通过在销售渠道提供卓越的合作伙伴体验来提高销售额，从而增加收入（销售、财务）\n\
  - 通过优化资源利用率来降低运营成本（联络中心、运营）\n\n\n\n\n\n+   - 改进端到端业务流程的**服务级别协议 (SLAs)**，变化幅度可能令人印象深刻，例如将时间表从\
  \ 20 天缩短至 12 小时（例如，在保险、金融等领域）\n+   - 通过自动化对账和会计账簿更新等重复性任务来提高效率（金融）\n+   - 缩短新产品上市时间，从而提供更广泛的产品选择以应对季节性（产品设计）\n\
  +   - 通过更好的需求预测、货物跟踪和路线优化降低库存成本（供应链）\n+   - 通过实施解决盗窃、丢失和欺诈的安全流程来减少缩水（零售）\n+   -\
  \ 减少不合规问题的案例，从而降低罚款并改善患者信任（医疗索赔和事先授权）\n\n具体结果可以轻松衡量，并直接影响最终利润，通常表现为数值数据或百分比。另一方面，还有无形收益，更难以量化，但仍为组织提供显著价值，且不会立即反映在财务报表中。虽然这些收益易于识别，但有效衡量它们面临更大挑战。评估其价值需要更细致的评估方法，例如客户反馈调查、员工参与度评分或品牌认知分析。\n\
  \n以下是无形收益：\n\n+   - 由于更快、更准确的服务交付而提高客户满意度\n+   - 员工士气提升，源于更精简的工作环境以及减少琐碎、重复、耗费精力的任务\n\
  +   - 通过创新和敏捷性增强竞争地位\n+   - 品牌忠诚度提升以及更好的整体声誉\n+   - 更好地适应市场变化和不断变化的客户需求\n+   - 更短的部署周期\n\
  +   - 更短的上市时间\n+   - 业务赋能\n\n虽然这些收益可能更难以量化，但它们对组织的整体成功和可持续性至关重要，应将其纳入 BVA 作为影响因素。\n\
  \n## 认识量化业务价值的重要性\n\n转型举措对于在快速变化的商业环境中保持竞争优势至关重要。对于在组织内推动数字化变革的专业人士来说，阐述和量化业务价值至关重要。这项技能可以证明未来投资的合理性，确保与战略优先事项保持一致，并促进数据驱动的决策。虽然初始\
  \ ROI 可能不显著，但从一开始就以业务价值为重点来推动流程转型，将使您在项目追求目标 ROI 的过程中走上正确的长期道路。思考业务价值也迫使您寻找关键问题的答案。以下几个场景解释了为什么评估和验证收益至关重要。\n\
  \n### 构建业务案例以证明投资的合理性\n\n大规模转型通常需要在技术（如软件、平台、工具和基础设施）、人才（人力成本）、新技能（用于培训）和变革管理（涵盖时间和经验）方面进行重大投资。财务论证对利益相关者至关重要，必须作为要求包含在项目章程中。\n\
  \n一个明确定义的业务价值衡量框架可以提供预期回报的具体证据，使领导者能够获得董事会、指导委员会、决策者和运营领导者的支持。ROI、**净现值 (NPV)**、回收期和定性战略收益等指标，为涉及多个项目的转型举措创造了强有力的业务案例。\n\
  \n这种方法也可以应用于有潜力发展为更大规模转型的小型项目。公民开发者和业务专业人士常常面临挑战，因为他们缺乏顾问及其分析资源的支持。然而，起步小并不意味着旅程不能带来显著的转型节省。\n\
  \n在 Nordstrom 进行转型时，我们的计划完全由业务用户驱动，他们认识到使用低代码**数字流程自动化 (DPA)**解决自身问题的价值。下图展示了一些关键成果，这些成果已被识别、设计并推出，通过多项举措产生了显著的业务价值。这些举措通常起步较小，但有时会扩展为更大规模的实施。\n\
  \n我们的业务节省分为三类：每年少于 15,000 美元、50,000 美元和超过 100,000 美元。值得注意的是，有些项目每年产生的收益超过 1,200,000\
  \ 美元。重要的是要理解，即使是最小的项目也可能是更大规模计划的一部分，公民开发者识别的流程可能有潜力显著影响最终利润。因此，我们不应低估那些起初看似微不足道的项目。\n\
  \n当这些节省累积时，流程转型的故事就揭示了其真正的潜力，如图 10.1 所示。\n\n### 精选成果\n\n![](img/a4c90ee3d142c33743706d37c65779c2_338_0.png)\n\
  \n图 10.1 – 跟踪公民开发者流程应用的收益\n\n随着时间的推移，已实现的业务节省可以迅速累积，尤其是每过一个季度。当您计划中即使是最小的成功得到认可时，所创造的整体价值可以迅速倍增，并可能导致更大规模的举措。这就是为什么执行良好的流程转型计划的价值主张对企业如此有吸引力——仿佛节省的资金在树上生长。然而，重要的是要强调“执行良好”这一短语，因为管理不善的计划可能会对预算和声誉产生负面影响。\n\
  \n### 确保企业范围内的战略一致性\n\n业务专业人士认识到将举措与总体企业战略保持一致的重要性，这些战略通常通过**目标与关键结果 (OKRs)**来阐述。衡量业务价值对于确保转型项目直接为长期目标（如市场扩张、运营卓越和以客户为中心的创新）做出贡献至关重要。这种一致性最大限度地提高了资源和投资的影响，同时促进跨职能协作，确保所有部门朝着统一的愿景努力。\n\
  \n随着项目的启动和进展，OKR 和整体业务价值的可见性往往会下降。日常工作量可能占据优先地位，关于未来资金的讨论可能会排除直接参与者的意见。在大型矩阵式组织中，业务专业人士可能缺乏与领导者一对一互动的机会来展示其举措的成功，这使得将其工作与战略目标联系起来变得具有挑战性。\n\
  \n明智的领导者明白，持续产生小规模的业务价值可以带来显著影响，而无需处理涉及供应商和外部顾问的大规模计划的复杂性。这些顾问经常在项目之间转换，需要大量监督，并产生获取机构知识的成本，增加了可能只有在更大规模的转型中才合理的额外费用。\n\
  \n此外，较小的转型可以推动更大规模的计划向前发展，因为当实际业务挑战被识别、解决并运营化时，其直接影响会随时间不断滚雪球式增长。必须强调的是，民主化数字化变革工具需要同样民主化的方法来评估和衡量业务价值，即使该价值看起来很小。涉及实施团队的传统项目交付机制在公民开发者场景中面临更多挑战。\n\
  \n### 数据驱动的持续改进\n\n“可衡量即可管理”的格言在持续改进中尤其相关。通过跟踪与业务价值相关的**关键绩效指标 (KPIs)**，组织可以识别低效率，优先考虑优化领域，并为数字化制定可操作的路线图。定期评估业务价值提供必要的反馈，使公司能够快速适应重组或不断变化的市场条件，从而确认技术驱动的流程改进计划的好处。\n\
  \n该过程的初始阶段可能具有挑战性，因为数据收集涉及收集大量数据点并建立基线。虽然大多数领导者都同意数据收集至关重要——呼应 W. Edwards Deming\
  \ 的名言，“在上帝我们信赖；其他人必须带来数据”——但关于收集哪些类型的数据以及何时收集数据，以及用于计算业务价值的公式，可能会产生分歧。\n\n\n\n\n\
  \n## 推动员工参与度和客户忠诚度\n\n当员工和客户都能感受到明确的收益时，成功的流程转型就会发生。配备更好工具、优化工作流程和明确目标的积极员工，将成为数字化变革的坚定拥护者。他们的参与加速了采用进程并推动业务成功，使组织能够沿着流程架构师概述的方向前进。此外，可衡量的服务交付、速度和质量的改进直接提升了客户体验，培养了忠诚度和拥护力。\n\
  \n## 为未来的数字化创新奠定基础\n\n衡量当前举措的业务价值对于为未来的转型、计划扩展和公民开发者应用程序的开发奠定基础至关重要。即使是小规模公民开发者项目的初始指标，也能为扩展数字化创新提供关键基准，使组织能够更有效地证明未来投资的合理性。随着时间的推移，这种改进的价值衡量能力将增强组织在流程驱动环境中的韧性、敏捷性和竞争力。\n\
  \n随着我们向日益受 AI 工作流影响的世界过渡，采用知情实验的策略将至关重要，认识到路径可能并不总是一帆风顺。通过系统地记录业务收益并将其与初始业务假设进行比较，您可以有效地从一个业务挑战过渡到另一个挑战，同时最大限度地降低风险。\n\
  \n以下屏幕截图展示了公民开发者应用程序组合从构思到发布的 BVA 管理生命周期流程。该系统将概念通过多个阶段门：摄入、风险评估、技术适配性、设计评审、测试部署和生产部署。这种方法确保选择了适当的技术来解决相关的业务问题，同时在整个组合中捕获和跟踪\
  \ BVA：\n\n![](img/a4c90ee3d142c33743706d37c65779c2_341_0.png)\n\n图 10.2 – 公民开发者应用程序注册表（组合视图）\n\
  \n以下视图描述了一个单一应用程序，即名为 _Decision Registry_ 的自动化流程，该流程已完全部署到生产环境，已投入运营，并且风险等级较低，无需处理任何敏感数据：\n\
  \n![](img/a4c90ee3d142c33743706d37c65779c2_342_0.png)\n\n图 10.3 – 公民开发者应用程序注册表（应用程序视图）\n\
  \n以下视图显示了应用程序的审计跟踪，突出显示了应用于该流程的所有专家服务，包括其上线日期：\n\n![](img/a4c90ee3d142c33743706d37c65779c2_342_1.png)\n\
  \n图 10.4 – 公民开发者应用程序注册表（服务生命周期视图）\n\n以下视图概述了用于描述业务问题的数据，并突出显示了与拟议解决方案相一致的痛点。它还列举了业务价值的有形和无形驱动因素。要使应用程序被视为有效，自动化流程必须满足指定的成功标准：\n\
  \n![](img/a4c90ee3d142c33743706d37c65779c2_343_0.png)\n\n图 10.5 – 公民开发者应用程序注册表（BVA\
  \ 视图）\n\n此视图识别潜在的自动化平台，并收集预测 BVA 所需的初始数据元素。此外，对流程进行风险评估，并突出显示各种类型的解决方案组件，以确保技术一致性：\n\
  \n![](img/a4c90ee3d142c33743706d37c65779c2_343_1.png)\n\n图 10.6 – 公民开发者应用程序注册表（专家服务状态）\n\
  \n摄入流程完成后，该应用程序允许我们收集支持文档以及用户故事、测试用例和 Jira 或 Azure DevOps 仓库的链接，从而提高文档质量并提供额外的上下文：\n\
  \n![](img/a4c90ee3d142c33743706d37c65779c2_344_0.png)\n\n图 10.7 – 公民开发者应用程序注册表（应用程序文档）\n\
  \n工作和流程应用程序经历一个与其支持的业务流程相镜像的生命周期。类似于杂货，有些应用程序有保质期。新应用程序可以快速开发并添加到组合中以解决紧急的流程挑战，而其他应用程序可能仅服务于特定目的，并可在几周内逐步淘汰。这种方法与\
  \ **业务流程管理 (BPM)** 生命周期一致。关键是创建一个衡量这些应用程序为组织提供的价值的系统。\n\n## 衡量业务价值的关键指标\n\n在流程转型的动态环境中，各种指标在推动成功举措方面发挥着关键作用。此类指标包括财务、运营、客户和员工导向的指标。这些指标可用于为数字化变革实验创建基准，建议将其作为逐步大规模引入流程数字化技术的策略。让我们更详细地探讨每个指标。\n\
  \n### 财务指标\n\n- **ROI**：衡量相对于初始投资的流程转型所产生的财务收益或损失。\n- **NPV**：评估投资或项目的盈利能力。正 NPV\
  \ 表示预期收益超过预估成本，从而认定投资可行。\n- **投资回收期**：确定投资产生足够现金流以收回初始成本所需的时间。\n- **成本节约**：评估由于效率提高和消除浪费而降低的成本。\n\
  - **收入增长**：评估由于改进流程提高生产力和市场覆盖范围而带来的收入增长。\n\n单个转型（包括您的公民开发者举措）的业务收益应归入财务指标范畴。换句话说，如果您预期三年投资的\
  \ ROI 为 320%，那么作为您的计划一部分执行的所有单个项目的集体 ROI 应达到 320%。ROI、成本节约和收入增长将在整个计划执行过程中进行监控，而\
  \ NPV 将在开始时用于帮助您做出投资决策。\n\n### 运营指标\n\n- **周期时间缩短**：衡量完成流程从开始到结束所需时间的减少\n- **错误率**：跟踪错误和缺陷的减少，从而产生更高质量的输出\n\
  - **生产力提升**：评估每单位投入（例如，劳动工时、机器使用量）的产出增加\n\n这些指标将归入您公司的 OKR。它们也可以纳入您的个人绩效目标。\n\n\
  让我们考虑一些示例：\n\n- 在未来六个月内将延迟付款错误率降低 10%（质量改进场景）\n- 由于业务量增加和预算冻结，您的目标是在未来 6–9 个月内将团队的生产力提高\
  \ 20%（以少胜多场景）\n\n### 客户导向指标\n\n- **客户满意度**：通过调查和反馈机制衡量客户满意度的改进。**客户满意度评分 (CSAT)**\
  \ 是由客户通过量表评分来衡量的。\n- **NPS**：衡量客户向他人推荐公司产品或服务的可能性。这是在 0 到 10 的量表上衡量的，将客户分为推荐者（9-10）、中立者（7-8）或贬损者（0-6）。\n\
  - **客户保留率**：评估流程改进对客户忠诚度和保留率的影响。它表示在特定期间内继续开展业务的客户百分比。\n\n\n\n\n\n+   - **Customer\
  \ churn**: Also known as customer attrition, this refers to the percentage of customers\
  \ who discontinue using a company’s products or services over a certain period.\
  \ It is a crucial metric for businesses, especially those with subscription-based\
  \ models or long-term customer relationships, such as in the telecom, **Software-as-a-Service\
  \ (SaaS)**, and retail industries.\n\n## Employee-focused metrics\n\n+   - **Employee\
  \ satisfaction**: Measures increased employee morale and job satisfaction due to\
  \ streamlined processes. It’s expressed through surveys and **employee net promoter\
  \ score (eNPS)**.\n\n+   - **Training time**: Evaluates the reduction in training\
  \ time required for new processes, leading to quicker employee onboarding.\n\n+\
  \   - **Employee turnover**: Assesses the impact of process transformation on employee\
  \ retention and turnover rates.\n\nWorking with poorly designed or manually executed\
  \ processes can cause all types of challenges for your team or business. Employee-focused\
  \ metrics tend to be evaluated a bit on the sidelines, while core business metrics\
  \ get immediate visibility. There is a clear connection between the quality of your\
  \ processes’ execution and team thriving scores. Happy and high-performing teams\
  \ are not bugged by missing operating procedures, broken processes, or the need\
  \ to search for clarifications while performing work. Considering employee-focused\
  \ metrics in the scope of process design is a smart business strategy that directly\
  \ contributes to operational metrics. If you want to drive successful operations,\
  \ don’t neglect to include employee-focused metrics in the scope of your transformation.\
  \ Your leaders and your teams will thank you for it.\n\nIn addition to the reasons\
  \ mentioned here, defining and measuring metrics can serve as a compass that’s used\
  \ to evaluate the maturity of your DTX program. Let’s take a closer look:\n\n+ \
  \  - **Establishing a baseline for digital change experimentation**: The measured\
  \ benefits of the early stages of digital change programs will evolve as the program\
  \ progresses, and the organization becomes more comfortable adopting new skills,\
  \ frameworks, and technologies. This process will continually enhance the cycle\
  \ of BPM and continuous improvement. By establishing a baseline for your program’s\
  \ value, you will be able to immediately notice shifts in performance as your processes\
  \ launch and mature over time. Time spent transforming operations flies quickly\
  \ and, sooner rather than later, you will have to explain or contribute to a business\
  \ justification as your initiatives require additional funding or program extensions.\
  \ Coming to these discussions prepared with data collected over time will elevate\
  \ these conversations to a different level. The alternative is to scramble for data\
  \ and models while attending your day-to-day job, trying to piece together data\
  \ to demonstrate the work that’s been completed over the last few months. It’s harder\
  \ to do than it seems, as in this case, a methodical, forward-looking approach to\
  \ data collection and business value evaluation will be key. It is the most frustrating\
  \ feeling in the world trying to piece together the BVA story by chasing your project\
  \ stakeholders, refreshing assumptions and calculations from over 1-2 years ago,\
  \ and working with teams when people move and priorities shift. You may find yourself\
  \ in a tough spot, having to explain to others what you did and did not accomplish\
  \ with your time and resources. Leaders can suffer from short-term memory when it\
  \ comes to overcoming challenges if the numbers they present do not reflect well\
  \ on their historical decisions. Protect yourself from this type of self-preservation\
  \ and scapegoating by embedding fair and transparent methodologies for BVA and benefits\
  \ verification.\n\n+   • **Challenging assumptions**: Projects that promise significant\
  \ ROI but take much longer to deliver than initially planned require a reality check\
  \ through a thorough retrospective. Launching AI automation or process transformation\
  \ programs without using the critical BVA methodology, especially by individuals\
  \ lacking experience in this area, can lead to prolonged implementations, failure\
  \ to achieve the intended vision, or damage to the reputation of otherwise promising\
  \ initiatives. There is nothing wrong with an organization encouraging learning\
  \ and experimentation, so long as fundamental principles are firmly established\
  \ upfront. Your BVA framework should act as an anchor amid the uncertainty and chaos\
  \ that can arise when business professionals experiment with digital change. Capturing\
  \ and aligning people around assumptions will provide everyone with a unified starting\
  \ point, allowing learning through experimentation to take place. Unspoken assumptions\
  \ should be treated as cracks in the foundation of your initiative; it’s always\
  \ safer to bring them into the open.\n\nIn the following section, we will describe\
  \ the most commonly encountered techniques for measuring business value.\n\n## Models\
  \ and techniques for measuring business value\n\nAccurately measuring value is critical\
  \ to ensuring that investments provide tangible benefits. Different models and techniques\
  \ have been developed to drive companies in this endeavor, each offering unique\
  \ perspectives and advantages. Adopting different methodologies allows businesses\
  \ to modify their approach to specific needs or phases of the program, whether it’s\
  \ optimizing processes, evaluating financial implications, or assessing potential\
  \ program ROI. Leveraging a diverse set of methodologies allows us to make informed\
  \ decisions. Among these methodologies, the following six deserve a mention:\n\n\
  +   • **Six Sigma**: A data-driven methodology that focuses on improving processes\
  \ and reducing variation to enhance overall performance. An example of this is provided\
  \ in the Case study 3 section of this chapter.\n\n+   • **Cost-benefit analysis\
  \ (CBA)**: A systematic approach that’s used to evaluate the financial and non-financial\
  \ impacts of a project or decision. By comparing the total expected costs against\
  \ the total expected benefits, CBA helps organizations determine the feasibility\
  \ and profitability of an initiative. This method involves identifying and quantifying\
  \ all relevant costs, such as technology, implementation, training, and maintenance,\
  \ as well as the anticipated benefits, including cost savings, revenue increases,\
  \ productivity gains, and quality improvements. For an example, see Case study 1.\n\
  \n+   • **Analyst methodologies—Forrester TEI**: This comprehensive methodology\
  \ combines four key components: cost, benefits, flexibility, and risk. By assessing\
  \ these elements, organizations can gain a holistic view of the financial impact\
  \ of their initiatives. The TEI methodology involves detailed data collection and\
  \ analysis to quantify the costs associated with technology investments, implementation,\
  \ and ongoing operations. It also identifies and measures the benefits, such as\
  \ cost savings, productivity gains, and revenue growth. Additionally, the TEI technique\
  \ considers a solution’s flexibility to adapt to future changes and the risks that\
  \ may affect the expected outcomes. An example of this can be found at https://tools.totaleconomicimpact.com/go/forrester/teioftei/index.html.\n\
  \n+   • **Digitization platform vendor ROI calculators**: These serve as a structured\
  \ framework to quantify and articulate the business value generated from a process\
  \ transformation. By leveraging this toolkit, organizations can systematically assess\
  \ key value drivers such as cost savings, efficiency gains, risk reduction, and\
  \ enhanced user experience resulting from automation or optimization initiatives\
  \ led by citizen developers. The toolkit enables teams to capture tangible and intangible\
  \ benefits through standardized metrics, helping build a clear business case for\
  \ transformation efforts. Additionally, it supports continuous improvement by offering\
  \ insights into value realization and alignment with broader organizational goals,\
  \ ensuring that process transformations deliver measurable impact and strategic\
  \ advantage. Examples include UiPath Automation Hub, Microsoft Power Platform COE\
  \ Starter Kit, and Pega Solution Finder.\n\n+   • **Citizen developer COE business\
  \ value toolkit**: This is a powerful resource for measuring the business value\
  \ of process transformations led by citizen developers. This toolkit provides a\
  \ structured framework for evaluating initiatives’ financial and non-financial impacts,\
  \ ensuring that even small-scale projects can demonstrate their value effectively.\
  \ By leveraging this toolkit, organizations can quantify costs such as technology\
  \ investments, implementation expenses, and training while identifying benefits\
  \ such as cost savings, productivity gains, and revenue growth. The toolkit includes\
  \ data collection and analysis methodologies, enabling citizen developers to present\
  \ clear and compelling evidence of their projects’ ROI. Additionally, it offers\
  \ guidance on assessing flexibility and risk, ensuring that the solutions are adaptable\
  \ to future changes and resilient to potential challenges. An example of this can\
  \ be found at https://learn.microsoft.com/en-us/power-platform/guidance/coe/business-value-toolkit#the-business-value-toolkit.\n\
  \n+   • **Service-play-based BVA**: This methodology employs expert services to\
  \ systematically evaluate the various stages of a new initiative. It integrates\
  \ elements of process management, solution architecture, estimation, and risk management.\
  \ The analysis draws on historical use cases, industry benchmarks, and scaling factors\
  \ such as utilization, self-enablement levels, and experience. These factors are\
  \ adjusted dynamically to suit the specific scenario being assessed. Staying updated\
  \ on the latest technology and software options that are proposed as solutions is\
  \ essential. Additionally, this service provides valuable insights for financial\
  \ models that calculate values for CBA, ROI, and Net NPV. For an example, see Case\
  \ study 2. The method for assessing business value depends on your preference, the\
  \ type of project, the technology being utilized\n\n\n\n\nto solve the business\
  \ problem, and the organization’s maturity level. Moreover, the individual’s experience\
  \ in measuring the benefits is critical. This role demands strong analytical skills,\
  \ effective data collection, and prior experience in process improvement and work\
  \ automation. It’s essential not to underestimate the expertise required to conduct\
  \ this type of analysis, as it necessitates a diverse range of skills. According\
  \ to Wayne Padcayan, senior enterprise business and process architect, “It is helpful\
  \ to conduct BVA in partnership with other teams such as Finance to put together\
  \ a pro forma as supporting documentation.” A **pro forma** is a financial document\
  \ or projection that outlines expected results based on certain assumptions. It’s\
  \ often used to forecast future performance, evaluate potential investments or projects,\
  \ and support business cases during initiatives such as DTX or work automation.\n\
  \nWhile these methodologies provide robust frameworks for evaluating business value,\
  \ practitioners must remain vigilant to avoid common pitfalls that can undermine\
  \ the effectiveness of their analysis.\n\n## Common challenges in conducting BVA\n\
  \nAlthough analyzing business value may appear simple at first glance, numerous\
  \ pitfalls can unexpectedly hinder practitioners. To help you steer clear of these\
  \ mistakes and enhance your confidence in your analysis, I’m sharing the following\
  \ list of common errors to avoid:\n\n- Reinventing the wheel by developing multiple\
  \ internal Excel-based models that do not leverage the organization’s past experiences.\n\
  - Not sharing financial data with others and wanting to make your analysis perfect.\n\
  - Building financial models without adequate practical experience in transforming\
  \ and automating processes.\n- Failing to connect financial analysis with process\
  \ and solution architecture.\n- Not evaluating benefits across a range of scenarios.\n\
  - Neglecting to fully document and revise assumptions.\n- Not prioritizing improvements\
  \ to the BVA model.\n- Failing to treat business value analysis and benefits validation\
  \ as a mandatory, ongoing activity to support the goals of company transformation.\n\
  - Calculating the ROI of your projects at the wrong point in time. This is usually\
  \ caused by rushing to the financial part of the analysis without stepping through\
  \ and collecting inputs for the requirements review, process landscape, and technical\
  \ fit services.\n- Not validating BVAs after project implementation.\n- Overlooking\
  \ institutional learning as a scaling factor.\n- Underestimating the impact of a\
  \ missed BVA on the success of the program.\n\n## Measuring the business value of\
  \ agentic AI systems (experimental)\n\nSeveral robust methodologies and approaches\
  \ are employed to measure the effectiveness of AI-driven workflow automation and\
  \ transformation programs. The **Balanced Scorecard (BSC)** framework, Six Sigma,\
  \ and Lean Metrics stand out here. BSC provides a comprehensive view by evaluating\
  \ financial, customer, and internal processes, as well as learning and growth perspectives.\n\
  \nFor instance, a global insurance firm applied this methodology to measure the\
  \ impact of AI on their claims processing, achieving a 30% reduction in processing\
  \ time and a significant increase in customer satisfaction. With its focus on reducing\
  \ errors and improving quality, Six Sigma has been utilized by manufacturing giants\
  \ such as General Electric to optimize AI-driven predictive maintenance, resulting\
  \ in substantial cost savings and uptime improvements. Lean Metrics, emphasizing\
  \ waste reduction and efficiency, was instrumental for an e-commerce leader in streamlining\
  \ their AI-powered supply chain operations, leading to faster deliveries and reduced\
  \ operational costs. These methodologies provide quantifiable metrics and align\
  \ AI transformations with strategic objectives, supporting data-driven decision-making\
  \ and fostering a culture of continuous improvement.\n\n## BVA case studies\n\n\
  To provide a comprehensive understanding of how BVA can be applied in various scenarios,\
  \ I will explore three distinct case studies. Each case study will focus on a different\
  \ type of analysis, highlighting its unique approach and impact on business decision-making:\n\
  \n- **Case study 1: Retail industry**: This study examines how a company optimized\
  \ and automated its core processes by implementing a low-code DPA platform across\
  \ the enterprise.\n- **Case study 2: Financial services**: This analysis looks at\
  \ how a global finance business unit improved its core processes, reduced cycle\
  \ times, and achieved significant cost savings through process transformation and\
  \ **robotic process automation (RPA)**.\n- **Case study 3: Adaptive logistics and\
  \ fulfillment**: This hypothetical use case focuses on workflow automation driven\
  \ by agentic AI through the use of autonomous agents, with a focus on dynamic workflows\
  \ and intelligent systems that optimize supply chains, delivery networks, and customer\
  \ satisfaction through continuous adaptation and high-level autonomy.\n- **Case\
  \ study 4: Agentic AI and the modern ranch**: AgSights is transforming Canada’s\
  \ ranching sector by enabling smaller producers to access real-time insights, optimize\
  \ processes such as feed costs and grazing schedules, and compete more effectively\
  \ with larger operations. This technology, combined with strategic frameworks such\
  \ as BSC and BPA, empowers ranchers to align AI-driven actions with measurable growth\
  \ objectives and operational efficiency.\n\nLet’s take a look at each case study\
  \ in greater detail.\n\n## Case study 1: Calculating the BVA of enterprise adoption\
  \ of a low-code DPA platform\n\nA national retailer has transformed its core and\
  \ supporting processes by shifting from a brick-and-mortar model to a digital business\
  \ approach. To expedite this transformation, the company’s leadership is considering\
  \ investing in a DPA platform to enhance the automation of the existing process\
  \ architecture.\n\nPreferring in-house development, the company aims to launch,\
  \ manage, and support the initiative internally to minimize consulting costs. However,\
  \ this initiative carries significant risks due to past negative experiences with\
  \ scaling automation technologies. It requires careful planning, a non-standard\
  \ grassroots and bottom-up approach to project delivery, and multiple checkpoints\
  \ throughout the program.\n\nThe analysis is based on various inputs that need to\
  \ be collected in advance, resulting in several outputs that outline comprehensive\
  \ benefits over three years. You will need to invest time in collecting data used\
  \ for inputs.\n\nThe following are inputs:\n\n- Process discovery and repository\
  \ licensing costs\n- Process architect training costs\n- Investment in the internal\
  \ team\n- Citizen developer training costs (effort and certification)\n- DPA platform\
  \ licensing costs:\n  - Cloud infrastructure spend forecast, including connectivity\
  \ costs (varied by scenario)\n- Evangelism and community-building costs\n- 6-9 months’\
  \ worth of consulting costs in the staff augmentation model:\n  - Platform launch\n\
  \  - COE operating model\n  - Support of the first quick-win project\n  - Support\
  \ of the second quick-win project\n  - Monitor and grow\n\nThis analysis results\
  \ in several data points and outputs being calculated that help describe the scope\
  \ of the anticipated investment.\n\nThe following are outputs:\n\n- CBA:\n  - Gather\
  \ the benefits that have been calculated over the past three years:\n    - Reduction\
  \ in the risk of manual process errors, including driver value, driver growth, improvement\
  \ factor, financial factor, percentage of benefit accrued, and total\n    - Reduced\
  \ time to market for revenue-generating applications\n    - Reduction of customer\
  \ churn through improved customer experience\n    - Reduction of monitoring hours\
  \ for new business applications\n    - Improved business productivity through added\
  \ process efficiencies\n    - Reduction of labor costs through reduced reliance\
  \ on senior-level developers\n    - Reduction of BPA development costs\n  - Calculate\
  \ for worst, optimal, and best-case scenarios\n  - Express the ROI as follows:\n\
  \    - Three-year total cost\n    - Three-year total benefit\n    - Net benefits\n\
  \    - Net present value\n    - Payback period\n    - ROI\n\nCalculating outputs\
  \ over three years allows us to chart the benefits-to-costs ratio, clearly demonstrating\
  \ the positive impact of the investment from year 1 to year 3. See Figure 10.8:\n\
  \n\n\n\nFigure 10-8 – 三年内流程转型的成本效益分析（CBA）\n\n**Outcome:** 该公司在 DPA 平台的授权许可上进行了战略投资，其中包括咨询和云服务，以及内部流程自动化支持团队的资金。随后，这项投资在两年内孵化了\
  \ 60 个项目，包括 3 个大型项目、10 个中型项目、25 个小型项目和 22 个原型。\n\n## 案例研究 2：计算基于 RPA 的流程自动化的投资回报率\n\
  \n一家全球科技公司希望改进其核心基金投资流程。项目领导层旨在利用 RPA 改进这一业务流程。产品管理团队此前的工作涉及创建包含自定义计算的 Excel 电子表格，最终超出了最初估算，并削弱了自动化计划的可信度。为解决这一情况，采取了以下步骤：\n\
  \n1. 他们获得领导层的支持，在采用经过实战检验的方法论的同时重新计算业务价值。\n2. 他们创建了一份工作演示文稿，向利益相关者和领导层介绍正在实施的方法和时间表，并达成共识。\n\
  3. 他们根据现成信息设计了服务方案，以应对中型流程。\n4. 他们制定了现实的时间表，描述 BVA 工作的持续时间。\n5. 他们分享了时间表，并解释了 BVA\
  \ 各阶段的预期结果。结果令人惊讶。\n6. 他们收集并分析了需求。\n7. 他们通过审查核心流程和支持流程的流程图来评估流程图景，以识别已知差距。\n8. 他们对两种技术替代方案进行了适配性评估，随后突出了差异并从中汲取了经验。\n\
  9. 他们制作了 T 恤衫和 ROM 工作量估算。\n10. 他们将收益分为硬性收益和软性收益两组，将项目驱动因素与收益相关联。\n11. 他们利用 Excel\
  \ 或 Shark Finesse、Forrester TEI 等专业工具计算 ROI 和 NPV：\n   - i. 对于 ROI 计算模型，Excel 提供以下函数：NPV()、IRR()\
  \ 和 XNPV()。\n   - ii. 对于蒙特卡洛模拟，使用 RAND() 和 @RISK 来分析风险和不确定性。\n   - iii. 提示：为公民开发者自动化项目创建\
  \ ROI 分析。包括 ROI、NPV、IRR、回收期、TCO，以及关于初始投资成本和运营成本的输入。\n   - iv. 提供关于节省、收入影响、开发节省以及风险和敏感性分析的详细信息。包括情景分析和仪表板。\n\
  12. 他们回顾了经验教训，并将其纳入 BVA 流程。\n13. 他们启动了项目，并在上线后 3-6 个月验证了收益。\n\n**Outcome**: 最终演示文稿被小组负责人接受，其方向是根据此方法论简化和标准化\
  \ BVA。项目已获批：\n\n## 方法与方法论\n\nFigure 10.9 – 中型流程转型的 BVA 方法\n\n## 案例研究 3：自适应物流与履行：涉及\
  \ AI 和代理的 BVA 流程转型\n\n自适应物流与履行（Adaptive Logistics and Fulfillment，一家假设公司）利用基于代理的\
  \ AI 的变革力量，彻底改变供应链运营。这种方法涉及利用能够进行动态决策、实时分析和预测建模的 AI 代理。因此，组织可以优化履行流程、缩短前置时间并提高客户满意度。\n\
  \n引入基于代理的 AI 能够实现更具响应性的物流系统，该系统可以适应需求波动、资源限制和外部中断等不可预测因素。通过自动化流程，这些智能代理可以简化复杂工作流，并促进供应商、仓库和分销商之间的无缝协调。\n\
  \n其结果是一个不仅高效而且可扩展的物流框架，推动切实的业务价值和运营卓越。\n\n这个假设的案例研究为评估该项目的业务价值提供了详细模型。它包括方法论、指标和示例计算，以展示基于假设的美国本土全球组织的评估流程。\n\
  \n我们的模型假设年收入为 9000 万美元（7500 万至 1 亿美元范围），由于 AI 驱动的代理自动化，收入增加了 2.22%（200 万美元）。\n\n\
  ## BVA 模型的组成部分\n\n在此场景中，我们从四个不同的角度计算 BVA，每个角度都针对特定受众。任何 BVA 最耗时的方面之一是整个项目过程中数据的准确收集和验证，尤其是当新信息或更可靠的数据可用时。将您的\
  \ BVA 视为一个小型项目，包括时间表、里程碑和明确目标。根据受众，您可以利用 BVA、BSC、精益方法论、六西格玛或这些方法的组合来实现目标。对于供应链等高风险项目，进行多种类型的分析可能有助于有效地与组织内的不同利益相关者接触。\n\
  \n## 识别和量化成本\n\n首先，准确识别和量化与 AI 驱动的工作流自动化项目相关的所有成本。这些成本包括以下内容：\n\n- 技术成本：新软件、硬件和基础设施的费用\n\
  - 实施成本：咨询服务、项目管理和部署的成本\n- 培训成本：培训员工使用新数字工具和流程的费用\n- 维护和支持成本：维护和支持 AI 系统的持续费用\n\n\
