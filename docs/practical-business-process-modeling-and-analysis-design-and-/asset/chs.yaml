- "# BPMN 业务流程建模与分析实践：面向 AI 转型的渐进式业务流程设计与优化指南\n\n\n\n\n\n---\n---\n---\n\nThis book\
  \ is dedicated to my parents, who taught me values that have helped me throughout\
  \ my life.\n\n– Jim Sinur  \n\nI dedicate this book to Kasia (my wife) and Ewa (my\
  \ daughter). Life with you is a gift from God!\n\n– Zbigniew Misiak  \n\nI dedicate\
  \ this book to my parents—thank you for your unwavering love and inspiring strength;\
  \ my wife—you are my steadfast rock and loving anchor; and my children—may you lead\
  \ with kindness and humanity in a world of autonomous machines.\n\n– BJ Biernatowski\
  \  \n\n---\n"
- "## Foreword\n\nWe are living in an era where AI and digitalization are redefining\
  \ the rules of the business game. Automation is no longer optional; it is a strategic\
  \ necessity. Yet, as Bill Gates wisely pointed out: “The first rule of any technology\
  \ used in a business is that automation applied to an efficient operation will magnify\
  \ the efficiency. The second is that automation applied to an inefficient operation\
  \ will magnify the inefficiency.” In this context, business process modeling and\
  \ analysis have become essential pillars for successful digital transformation.\n\
  \nThis book, *Practical Business Process Modeling and Analysis*, arrives at a critical\
  \ moment. Zbigniew Miśiak, BJ Biernatowski, and Jim Sinur bring together a unique\
  \ blend of practical experience, deep technical knowledge, and strategic vision.\
  \ Zbigniew, widely known for his work as a BPM trainer and advocate through platforms\
  \ such as BPM Tips and Udemy, has helped thousands of professionals understand the\
  \ language and value of BPMN. BJ, in turn, enriches this perspective with his hands-on\
  \ experience in major enterprise implementations and his direct involvement with\
  \ platforms such as Microsoft Power Platform, K2, and Pega. Finally, Jim, one of\
  \ the most influential voices in digital transformation and intelligent automation,\
  \ provides the conceptual framework that binds the entire narrative together.\n\n\
  This is not merely a technical manual or academic guide—it is a roadmap, grounded\
  \ in real-world use cases, best practices, and lessons learned from diverse business\
  \ environments. The authors go beyond the “what” and “how” to also explain the “why,”\
  \ enabling you to tailor the content to your specific transformation challenges.\n\
  \nIn a world where tools such as RPA, Make, Power Automate, and AI-based GPTs empower\
  \ the automation of small workflows, it is vital not to bypass the process improvement\
  \ phase prior to automation. Modeling a process flow in BPMN allows us to visualize\
  \ the workflow, uncover redundancies and inefficiencies, identify areas for improvement,\
  \ and decide which activities are suitable for automation through RPA or AI.\n\n\
  Throughout its chapters, you will find clear answers to some of the most pressing\
  \ questions faced during any process improvement or redesign initiative: How can\
  \ we identify the processes with the greatest impact? What level of detail is appropriate\
  \ in our models? How do we build a sustainable process architecture? What role do\
  \ modern tools such as low-code platforms, process mining, and AI play?\n\nHaving\
  \ worked for more than two decades to promote and professionalize the BPM discipline\
  \ across Ibero-America and Europe, I can confidently state that this book is an\
  \ indispensable resource, both for those new to the world of process analysis and\
  \ for seasoned professionals looking to stay abreast of the latest trends. More\
  \ importantly, it offers an integrated vision that bridges technique and strategy,\
  \ modeling and execution, theory, and practice.\n\nIf you are a professional involved\
  \ in your organization’s digital transformation—be it as an analyst, process architect,\
  \ change leader, or citizen developer—this book will be your trusted guide. It will\
  \ help you structure your initiatives, avoid costly mistakes, and lay the groundwork\
  \ for a sustainable and agile future.\n\nThank you, Zbigniew, BJ, and Jim, for delivering\
  \ a work that educates, inspires, and empowers. And thank you, the reader, for taking\
  \ on the commitment to transform not just your processes, but the way your organization\
  \ delivers value.\n\nPedro Robledo  \nRegional Director – ABPMP International  \n\
  \n---\n"
- '## Contributors


  ## About the authors


