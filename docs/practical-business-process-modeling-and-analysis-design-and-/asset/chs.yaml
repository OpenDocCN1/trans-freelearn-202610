- '## 高级 BPMN


  在第 8 章中，我们了解了 BPMN 的关键元素。有了这些知识，你可以轻松理解大多数实际图表。但是，BPMN 还允许你创建用于流程分析和自动化的更复杂图表。为了帮助你从这些额外可能性中受益，我们将介绍
  BPMN 的更高级元素。


