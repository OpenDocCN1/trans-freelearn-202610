  \n外部流程：  \n否\n\n目标：  \n流程的目标。\n\n触发器：  \n触发流程的因素。\n\n结果：  \n流程的结果是什么。\n\n流程变体： \
  \ \n无条目\n\n图 6.4 – 流程属性示例（ADONIS 的截图）\n\n我们可能还希望记录流程的依赖关系（在价值链中，哪些流程在我们的流程之前和之后，我们的流程的父级是什么以及是否有任何子级（或子流程），以及也许它影响哪些流程或受哪些流程影响）。\n\
  \n如果我们想将流程架构用于决策，例如优先处理与以客户为中心或数字化转型相关的变革举措，我们还可以使用额外的分类和评估。这将使我们能够，例如，区分任何改进和自动化都是优先事项的关键流程，或者按客户满意度、成本、质量、法规合规性等对流程进行排名。\n\
  \n在自动化方面，我们可以对流程自动化的成本和潜在收益进行排名，或根据流程的可预测性、复杂性和频率计算流程的自动化潜力，仅举几个潜在选项。一些组织还喜欢使用 **全时等效\
  \ (FTEs)** 来记录参与流程的人数。\n\n当然，每个组织都不同，因此选择要使用的属性取决于组织希望如何使用流程架构，以及组织内部将与流程管理集成的管理系统。请注意，组织的工作方式会对此产生重大影响。\n\
  \n例如，一个在流程改进举措方面采取更集中方法、寻求协同效应并使用广泛的全组织视角的组织，可能需要一套更大的属性集，这些属性对许多领域都是强制性的。相反，如果组织倾向于由组织单位领导者发起旨在快速取得成果的单个项目，那么一套通用的属性可能要小得多。\n\
  \n请注意，与组织相关的主题将影响将记录的内容。因此，如果目标是为员工提供基本信息和便捷的导航，您可以期望看到描述、指向相关流程的链接、所有权信息、指向文档（程序、表格等）的链接以及少量额外属性。\n\
  \n对于风险管理和合规性是重要主题的组织，我们可以期望看到有关风险和控制、流程之间的链接以及各种合规要求的信息，以及用于 **业务连续性管理 (BCM)** 所需的信息。\n\
  \n另一方面，对于使用流程架构作为数字化转型举措的一部分来选择用于改进和自动化的流程的组织，除了我们已经提到的属性之外，还需要指向流程使用的应用程序的链接，以及有关项目的信息。在《如何使用流程架构》部分，我们将了解如何使用各种属性来对流程进行分类。\n\
  \n总结来说，如果我们希望确保为组织的许多不同管理系统提供一个共同的参考点，流程架构非常有用。虽然对单个流程进行建模可以实现其标准化和改进，但创建流程架构、维护它并使用它来管理组织，是实现更高水平的业务流程管理成熟度所必需的。\n\
  \n## 流程架构标准\n\n正如我们在上一节中所学，流程架构是成功流程管理的一个重要方面。它还与组织中的许多其他管理系统相关联。当然，这可能会让你想知道，是否有一个普遍认可的流程架构应涵盖的主题列表以及以图形方式展示它们的方法，以及是否有一种创建流程架构的标准方式。\n\
  \n有趣的是，没有一种被普遍接受的构建方法。有些组织发现，仅关注流程及其所有属性和与组织单位的链接就足够了。其他组织使用更多主题，例如应用程序、风险、KPI 等。\n\
  \n然而，其他组织使用 **ArchiMate** 标准进行企业架构管理，其中 _流程_（更准确地说是 **业务流程**）只是用于描述组织及其元素之间相互关系的数十种可用对象类型之一。这些元素可以按不同层进行分组，这些层代表诸如业务或技术之类的类别，以及被动结构或主动结构之类的方面，所有这些都有助于对图表中的元素进行分类。\n\
  \n在 ArchiMate 中，如 _图 6.5_ 所示，业务流程属于业务层，并包含 **业务参与者**、**业务角色**、**业务功能**、**业务事件**、**业务服务**、**业务对象**\
  \ 和 **产品** 等元素。请注意，这里 **价值流** 位于 **战略** 层。\n\n_图 6.5_ 还显示了 ArchiMate 对象中的几个示例，例如\
  \ **战略**、**业务** 和 **应用** 层。要完整了解 ArchiMate 的表示法（包含超过 60 种对象类型和 11 种关系），请查看本书仓库中提供的图片：`https://\
  \ github.com/PacktPublishing/Practical-Business-Process-Modeling-and- Analysis/tree/main/Chapter06`。\n\
  \n\n\n\n\n|    | 被动结构 | 行为 | 主动结构 |\n|---|---|---|---|\n| 策略 | 资源 | 能力价值流行动方案 |\
  \ |\n| 业务 | 业务对象 合同 表现 产品 | 业务流程 业务交互 业务事件 业务服务 业务功能 | 业务参与者 业务协作 业务角色 业务接口 |\n\
  | 应用 | 数据对象 | 应用流程 应用服务 应用交互 应用功能 应用事件 | 应用组件 应用接口 应用协作 |\n\n图 6.5 – ArchiMate 表示法的元素（图片来自免费的企业架构管理工具\
  \ ADOIT：社区版）\n\n\U0001F50D **快速提示**：需要查看此图像的高分辨率版本吗？在下一代 Packt Reader 中打开此书，或在 PDF/ePub\
  \ 副本中查看。\n\n\U0001F4D8 **下一代 Packt Reader 和免费的 PDF/ePub 副本** 随您购买的本书一起提供。扫描二维码 或访问\
  \ `packtpub.com/unlock`，然后使用搜索栏按名称查找此书。仔细核对显示的版本，以确保您获得正确的版本。\n\n![](img/a4c90ee3d142c33743706d37c65779c2_182_0.png)\n\
  \n除了 ArchiMate，针对业务架构师的几种其他方法，例如 **业务架构知识体系 (BIZBOK®)** 以及对象管理组标准，如 **价值交付建模语言**\
  \ 和 **业务架构核心元模型**，可以成为有价值的灵感来源，但迄今为止，其中没有一种可以被视为事实上的标准，因为它们没有提供关于如何创建流程架构的全面指导。\n\
  \n对于我有机会合作过的许多组织来说，这些标准可能对于立即实施来说有点过于复杂，因为它们需要一定的组织成熟度以及一群知道如何使用它们的人。在这种情况下，我的建议是将组织创建的\
  \ BPM 方法与这些标准进行交叉核对，以确保此阶段没有遗漏任何重要内容。\n\n现在，让我们介绍如何记录流程架构。除了组织避免图形建模并维护文本流程列表的情况外，通常，流程由箭头或尖括号表示。但是，这并未以任何方式标准化（除非您使用\
  \ ArchiMate），因此这只是一种常见做法，并受到迈克尔·波特工作的启发。\n\n剩下的最后一个问题是，如何创建流程架构？在实践中，我看到两种主要方法。第一种是利用最佳实践并使用可用的流程库。第二种是为特定组织准备定制的流程架构。\n\
  \n在本章的后续部分中，我们将介绍这两种选项。我们将使用这两种方法为一家名为 _BPMT Dishes_ 的虚构公司构建流程架构，该公司生产并销售碗、盘子和其他餐具。此示例还将在\
  \ _第 7 章至第 9 章_ 中使用，届时我们将使用该公司的投诉处理流程。当然，此示例将被简化，因为它仅用于说明目的。\n\n## APQC 的 PCF® 和其他流程库\n\
  \n让我们先讨论一下什么是流程库以及它们如何工作。我们将更深入地介绍最流行的一个，即 APQC 的 PCF，但也会提及其他几个。\n\n### 流程库简介\n\n\
  最常用的参考流程集是 APQC 提供的名为 PCF 的库。PCF 的文档以 Excel 和 PDF 文件形式提供，在 `www.apqc.org/pcf` 注册后即可免费获取。\n\
  \nAPQC 将 PCF 描述为流程分类法。它可用于多种目的——通常，组织首先描述流程，或者，如我们稍后将看到的，他们可能希望验证流程描述的完整性。但是，通常，流程改进和标准化会成为重要的用例。但这还不是全部：PCF\
  \ 还可用于对组织内创建的内容进行分类，以及用于流程 **基准测试** 目的，例如将组织的结果与同行组进行比较。\n\nAPQC 提供了十几种类型的 PCF。最基本的是通用\
  \ **跨行业** 类型。但也有针对特定行业定制的版本，例如 **航空公司**、**汽车**、**银行**、**市政府**、**消费品**、**教育**、**医疗保健提供商**、**生命科学**、**零售**\
  \ 和 **公用事业**。\n\nPCF 中的内容分为五个级别：\n\n- 1. **类别。**\n- 2. **流程组。**\n- 3. **流程。**\n\
  - 4. 活动。\n- 5. 任务。\n\n让我们使用跨行业版本来了解这些级别在实践中的应用。为了更有趣，我们将使用 13.0 开发和管理业务能力类别，因为它包含与流程管理相关的元素。\n\
  \n类别是 PCF 中流程的最广泛分组，代表第一级。每个类别包含流程组，代表第二级。\n\n在我们的示例中，有九个流程组，第一个是 13.1 管理业务流程。其他流程组包括管理组合、计划和项目\
  \ (13.2)、管理企业质量 (13.3)、管理变更 (13.4)、开发和管理企业范围知识管理 (KM) 能力 (13.5)、衡量和基准测试 (13.6)、管理环境健康与安全\
  \ (EHS) (13.7)、开发、管理和交付分析 (13.8)、以及管理可持续性 (13.9)。\n\n正如您所期望的，流程组包含流程。我们的 13.1 流程组包含五个流程：13.1.1\
  \ 建立和维护流程管理治理、13.1.2 定义和管理流程框架、13.1.3 定义流程、13.1.4 管理流程绩效、以及 13.1.5 改进流程。在我们的示例中，我们将专注于\
  \ 13.1.3。流程代表第三级，如其前缀所示。\n\n流程可以进一步分解为活动（第四级）。我们的活动将包括 13.1.3.1 范围界定流程、13.1.3.2\
  \ 分析流程、13.1.3.3 识别和标记流程控制点、13.1.3.4 建模和记录流程、以及 13.1.3.5 发布流程。\n\n有时，活动需要进一步分解。为此，使用代表第五级的任务。请注意，并非每个活动都有任务。在我们的示例中，13.1.3.1\
  \ 范围界定流程没有进一步分解，而 13.1.3.2 分析流程有一个任务：13.1.3.2.1 识别已发布的最佳实践。\n\n如果您想了解这些级别工作方式的更多示例，请查看\
  \ PCF 文件中的 PCF 级别说明部分。\n\n在当前版本的 PCF (7.4) 中，有 13 个流程类别，如图 6.6 所示。PCF 不采用经典的管理、主流程和支持流程划分，而是将以价值链形式呈现的运营流程进行划分，其中管理和支持流程被分组。\n\
  \n每个元素，除了名称之外，还有一个唯一标识符，以及一个层次标识符，这使得非常容易找出它在架构中的哪个级别出现以及其父级是什么。\n\n选定的流程还提供描述。对于有兴趣进行流程测量的组织来说，非常有用的是，对于选定的\
  \ APQC 流程领域，PCF 还包括拟议的指标以及计算它们的方法。\n\n通过这种方式，PCF 为流程从业者提供了一种通用语言。它可用于不同公司之间的流程比较以及基准测试流程指标\
  \ (KPI)。\n\n当您考虑 PCF 包含多少有价值的信息，以及许多行业变体包含约 1000 个描述的流程元素这一事实时，难怪它是许多组织在准备流程架构时的常见选择。重要的是，PCF\
  \ 不仅可以作为流程架构结构的模板，还可以用于对组织各种类型的信息资源进行分类。对于最后这一点，您可以将其类比为图书馆目录，其中每本书都被分配到特定的类别。\n\
  \n但是，值得记住的是，PCF 的较低级别应被视为给定流程中可能出现的元素列表，而不是可以一对一使用的详细流程描述。此外，列表中元素出现的顺序不一定转化为序列。\n\
  \nAPQC 的 PCF 是组织中流程管理团队的极其宝贵的资源，因为它帮助他们避免许多错误，并允许在流程计划中更快地交付更多价值。\n\n但是，您不应期望在每种情况下都简单地将\
  \ PCF 中包含的内容一对一地应用。相反，可能需要对内容进行一些修改，并根据实体所在的特定行业、组织或法律环境对内容进行定制。\n\n在这里，我将引用 Roger\
  \ Tregear 的话，他说：“_即使管理和支持流程在不同组织中可能相似甚至相同，核心流程也可能不同，甚至可能是独特的，如果使用组织的术语来命名它们，将大有帮助。_”\
  \ 这增加了共鸣和认同感。\n\n> 注意\n> 关于 PCF 的更多信息，以及关于其用途的大量资源，可以在 APQC 网站上找到 (https://www.apqc.org/process-frameworks)。\n\
  \n### APQC 的 PCF 在实践中的应用\n\n在本节中，我们将看到我们的虚构公司 _BPMT Dishes_ 如何使用 APQC 的 PCF 来构建流程架构。第一个问题是决定使用哪个版本的\
  \ PCF：跨行业版本，还是任何行业特定的变体。\n\n如前所述，虽然最高级别（拥有 13 个流程类别）非常相似，但并不完全相同，但我们越往下走，不同版本的 PCF\
  \ 之间的差异就越多。\n\n由于我们的示例公司 _BPMT Dishes_ 生产并销售餐具，我们可以轻松识别出两个可能与我们相关的行业特定变体。通过比较跨行业变体与消费品和零售版本，我们可以看到，虽然每个变体都有\
  \ 13 个类别，但这些流程类别的名称是根据组织的特定运营量身定制的。这些差异在下表中显示：\n\n\n\n| 过程类别（层级 ID） | 跨行业（PCF 7.4）\
  \ | 客户产品（PCF 7.2.2） | 零售（PCF 7.2.1） |\n|---|---|---|---|\n| 1.0 | 制定愿景和战略 | 制定愿景和战略\
  \ | 制定愿景和战略 |\n| 2.0 | 开发和管理产品与服务 | 设计和开发产品与服务 | 开发和管理客户体验 |\n| 3.0 | 市场营销和销售产品与服务\
  \ | 市场营销和销售产品与服务 | 市场营销产品与服务 |\n| 4.0 | 管理实物产品供应链 | 交付产品 | 商品化产品和服务 |\n| 5.0 | 交付服务\
  \ | 交付服务 | 交付产品 |\n| 6.0 | 管理客户服务 | 管理客户服务 | 交付服务 |\n| 7.0 | 开发和管理人力资本 | 开发和管理人力资本\
  \ | 开发和管理人力资本 |\n| 8.0 | 管理信息技术（IT） | 管理信息技术（IT） | 管理信息技术（IT） |\n| 9.0 | 管理财务资源\
  \ | 管理财务资源 | 管理财务资源 |\n| 10.0 | 获取、构建和管理资产 | 获取、构建和管理资产 | 获取、构建和管理资产 |\n| 11.0 |\
  \ 管理企业风险、合规性、补救和韧性 | 管理企业风险、合规性、补救和韧性 | 管理企业风险、合规性、补救和韧性 |\n| 12.0 | 管理外部关系 | 管理外部关系\
  \ | 管理外部关系 |\n| 13.0 | 开发和管理业务能力 | 开发和管理业务能力 | 开发和管理业务能力 |\n\n表 6.1 – PCF 三个选定变体中过程类别的比较\n\
  \n基于此比较，BPMT Dishes（一家向客户制造并销售产品的公司）可以选择客户产品版本。然后，该公司可以基于从 PCF 中提取的过程类别来创建其流程架构。图\
  \ 6.6 显示了一个示例。\n\n## 操作流程\n\n1.0 制定愿景和战略\n\n2.0 设计和开发产品与服务\n\n3.0 市场营销和销售产品与服务\n\
  \n4.0 交付产品\n\n5.0 交付服务\n\n6.0 管理客户服务\n\n## 管理和支持流程\n\n7.0 开发和管理人力资本\n\n8.0 管理信息技术（IT）\n\
  \n9.0 管理财务资源\n\n10.0 获取、构建和管理资产\n\n11.0 管理企业风险、合规性、补救和韧性\n\n12.0 管理外部关系\n\n13.0\
  \ 开发和管理业务能力\n\n图 6.6 – 基于 APQC 的 PCF 的流程架构顶层模型\n\n下一步是描述每个过程类别中发生的情况。在我们的示例中，我们将关注与客户服务相关的领域，因为处理投诉的领域也在那里。它将是一个名为\
  \ **Service products after sales** 的流程组，层级 ID 为 6.3：\n\n6.1 制定客户关怀/客户服务战略\n\n6.2\
  \ 计划和管理客户服务运营\n\n6.3 售后服务产品\n\n6.4 管理产品召回和监管审计\n\n6.5 评估客户服务运营和 cu...\n\n图 6.7 –\
  \ 过程类别分解示例\n\n![](img/a4c90ee3d142c33743706d37c65779c2_187_0.png)\n\n如图 6.7 所示，我们的流程组不仅有名称和层级\
  \ ID，还有一个描述，帮助我们更好地了解其范围。此外，对于我们的 6.3 流程组，还有提供更多信息的低级元素：五个流程（6.3.1 注册产品，6.3.2 处理保修索赔，6.3.3\
  \ 管理供应商追偿，6.3.4 管理客户自助服务材料，以及 6.3.5 服务产品）和 30 多个低级元素（活动和任务），例如 6.3.2.3 调查保修问题和 6.3.2.3.1\
  \ 定义问题。\n\n如您所见，APQC 的 PCF 包含大量描述流程的元素。例如，客户产品版本的分类法在五个层级中包含近 2,000 个元素，其中超过 1,800\
  \ 个包含描述。PCF 是用于识别、文档化、标准化和流程改进的宝贵辅助工具，也适用于许多其他应用，例如基准测试和组织内容。\n\n鉴于此，PCF 成为世界上最流行的流程库也就不足为奇了。然而，它并非唯一可用的选项。电信公司经常使用增强电信运营图（eTOM），物流是运营重要方面的公司使用供应链运营参考模型（SCOR），IT\
  \ 部门使用信息技术基础设施库（ITIL）。此外，参考流程库可以与 IT 系统（例如 SAP 的 ERP）一起提供，也可以由咨询公司提供。\n\n许多这些流程知识来源也可以由\
  \ AI 使用，因此从技术上讲，可以使用生成式 AI 解决方案基于这些流程库来准备流程架构的初稿。或者，也许更好的是，可以使用 AI 赋能的工具来确保不会遗漏流程架构中应涵盖的任何重要利益相关者群体或其他业务概念。\n\
  \n然而，到目前为止，还没有办法在不涉及员工的情况下自动创建人们会使用的良好流程架构。因此，如果您有兴趣自动化流程，并希望确保不会遗漏任何重要事项，在开始自动化的技术部分之前，创建某种流程架构是有意义的。\n\
  \n对于许多组织，像 PCF 这样的流程库也非常有用，可以确保公司不会花几个月时间试图重新发明轮子并犯常见错误。有时，让所有人都同意一种全球标准的流程方法，比在内部达成共识更容易，尤其是如果组织有强大的筒仓文化。\n\
  \n对于一些组织，将流程库调整以满足其需求还不足以确保员工感觉流程架构是为他们量身定制的。下一节将展示如何处理此类情况，以便我们可以获得更好的员工接受度，并保留使用全球标准的好处。\n\
  \n## 如何构建您自己的流程架构\n\n在本节中，我们将学习如何构建自定义流程架构。我们将首先讨论何时这样做有意义，然后看看为我们的虚构公司构建流程架构可能是什么样子。\n\
  \n### 为什么创建自定义流程架构是有意义的？\n\n如前所述，对于一些组织，量身定制的流程架构是一个非常有吸引力的选择。与之前的情况一样，这也涉及连接模型的多级结构。通常，它们是在与组织员工的研讨会上创建的。如您所料，这比采用\
  \ PCF 花费更多时间，但如果做得正确，它可以帮助在组织中建立更强大的流程文化。\n\n对于那些希望从现有最佳实践中受益，并拥有流程架构的自定义外观和感觉的人来说，混合方法也是可能的。可以基于研讨会的输入创建流程架构，但基于\
  \ APQC 的 PCF 等参考流程进行完整性的额外验证。这有助于加快整个过程并提高其质量。\n\n流程架构的构建通常受益于对组织战略的分析。这是因为流程应确保该战略的运营化，以及考虑组织通过其为其创造价值的利益相关者以及产品和服务。\n\
  \n有趣的是，通常会发现，在组织内部，关于通过哪些流程创造价值以及为谁创造价值、组织的利益相关者是谁，以及组织打算如何满足这些期望，经常存在许多相互冲突的想法。\n\
  \n共同词汇也是许多组织非常常见的问题。这可能导致不同单位对谁是客户没有共同定义的情况！您可以轻松想象这对重要举措有多有害。\n\n关于构建流程架构的不同方面的讨论有助于发展对组织如何运作及其流程如何融入整体价值创造生态系统的共同理解。这简直是无价之宝。架构工作本身的结果——例如，以互连模型形式记录的数十或数百个已识别和描述的流程集合——非常有用，但最重要的是确保这些模型是所有利益相关者之间达成协议的结果。\n\
  \n可以通过 BPM CoE 的一小群专家非常快速地准备流程架构，但真正的价值是来自组织中参与流程管理的人员之间的共同理解和协议所产生的架构。这充当了一份合同，总结了工作方式，并提供了已达成一致的组织共同视图。\n\
  \n\n\n\n\n也值得提醒的是，不要频繁陷入这种诱惑：试图通过组织结构来识别顶层流程，从而加快流程架构的工作进度。创造价值的流程贯穿整个组织，需要跨职能协作，因此基于组织结构构建流程架构将是徒劳的。\n\
  \n构建流程架构是流程知识中一个极其有趣的领域，它有许多方法和可能的解决方案。为了了解各种流程架构在实践中可能是什么样子，我邀请您访问 https://bpmtips.com/process-architecture-real-life-examples。\n\
  \n除了罗杰·伯顿（Roger Burlton）和罗杰·特雷加（Roger Tregear）等流程架构专家提供的一些额外示例外，在此页面上，您还将找到其他有用资源的链接，例如与罗杰·伯顿和马切洛·拉罗萨教授关于流程架构的访谈。这些资源提供了大量宝贵的见解。\n\
  \n## 在实践中构建自定义流程架构\n\n到此为止，我们知道如何使用 APQC 的 PCF 创建流程架构。现在，让我们讨论一下我们的虚构公司 BPMT Dishes\
  \ 如何构建自定义流程架构。\n\n当然，值得再次强调的是，构建自定义流程架构并不意味着我们必须从零开始，凭空发明一切。像 APQC 的 PCF 这样的库也可以并且应该被用来检查我们是否忽略了任何重要的流程领域。\n\
  \n构建流程架构第一级的一个有价值输入可能是关于我们公司战略和运营的信息。对于我们的虚构公司，我们可以说它是一家以客户为中心的家族企业，生产餐具（例如盘子和碗），并直接或通过合作伙伴将其销售给客户。\n\
  \n为了简化问题，我们将只关注生产餐具并直接销售给客户。在现实生活中，我们的公司可能还会提供合作伙伴公司的其他产品，例如餐具、餐桌布等，但我们不会在本书中涵盖这些内容。\n\
  \n您可能已经看出，有两个主要领域我们为客户创造价值。第一个**端到端流程**将涵盖产品开发的完整生命周期，从创意开始，经过生产，到产品管理，并就变更或可能退役产品做出决策。这将保证公司拥有可以销售给客户的优质餐具。\n\
  \n第二个端到端流程将专注于服务客户，同时涵盖从让客户了解我们的产品、销售和交付产品，到处理投诉（如果出现问题）的完整生命周期。该流程应保证第一个流程中生产的餐具能够送达客户。\n\
  \n这两个流程都是实现公司使命的重要方式。这一使命可能是**创造令人愉悦的产品，帮助客户在餐桌旁拥有难忘的时刻**\n\n![](img/a4c90ee3d142c33743706d37c65779c2_191_0.png)\n\
  \n图 6.8 – 流程架构自定义顶层模型示例\n\n\U0001F50D **快速提示**：需要查看此图像的高分辨率版本吗？在下一代 Packt Reader\
  \ 中打开此书，或在 PDF/ePub 副本中查看。\n\n\U0001F512 **下一代 Packt Reader** 和本书的**免费 PDF/ePub\
  \ 副本**包含在您的购买中。扫描二维码 或访问 `packtpub.com/unlock`，然后使用搜索栏按名称查找此书。仔细检查显示的版本，以确保您获得正确的那一本。\n\
  \n![](img/a4c90ee3d142c33743706d37c65779c2_191_1.png)\n\n图 6.8 显示了流程架构顶层模型可能的样子。如您可能猜到的，此类模型在不同公司之间差异很大。流程类别的名称、单个模型中的流程级别数量、图形和徽标等视觉方面、决定显示哪些属性（例如流程所有者），以及提供指向描述组织的其他相关模型的额外导航支持——这些只是影响流程架构顶层模型外观的一些方面。\n\
  \n关于将给定流程放置在管理或支持类别中的讨论也很常见。对某些人来说，即使是他们认为属于自己的流程的位置也可能很重要。通常，左上角的元素与定义战略和愿景，并确保其指导整个组织有关。在许多组织中，这个流程被称为**战略管理**，尽管这个名称并不十分具体。这个流程之后可能会跟随一些其他指导组织的流程。对于支持流程，情况就不那么明显了。我们是从人（我们的员工）、IT\
  \ 还是其他东西开始？这通常是一种被认为的重要性问题。\n\n幸运的是，随着组织中的人们习惯于流程思维，某些流程位置更突出或不那么突出等问题不再重要。这是一个很好的指标，表明人们理解流程管理是一项团队运动，重点在于管理跨职能流程以创造价值。\n\
  \n命名约定也很棘手。一种经常使用的方法是**动词 + 名词**命名约定（例如，**制定战略**）。但是，您也会注意到其他方法（例如，**战略管理**）或不太精确的名词（例如，**管理战略**）。著名的\
  \ BPM 专家 Alec Sharp 警告不要使用不明确说明流程目的名称，因为它们无法帮助建立共同理解。Alec 在其备受赞誉的书籍《Workflow Modeling:\
  \ Tools for Process Improvement and Applications Development》中用于描述此问题的一个生动名称是**模糊动词模糊性**。\n\
  \n虽然上述选项不如第一个示例那样清晰和优雅，在第一个示例中我们使用了动词，并且它们不能精确地显示流程的结果，但有时出于多种原因很难避免它们。有时，它们只是从流程库中获取的。其他时候，负责某些领域的人习惯于这样的名称（例如，**风险管理**）。通常，结果是某种妥协，但这通常会被广泛讨论，并且是共同协议的结果。\n\
  \n当然，我们在图形模型中_看到_的只是冰山一角：将收集到的关于流程的所有信息都可见化根本不切实际。基于讨论，每个流程都将被丰富必要的属性。当概览模型准备就绪后，通常接下来是一个决定，指定将按什么顺序进一步分解流程。\n\
  \n在理想世界中，流程架构顶层的每个流程都应该有一个显示较低级别流程的模型。然而，通常，组织首先只选择最重要的流程并更深入地记录它们。只有在这种方法显示出可见结果并且组织学会了如何构建流程架构后，才能处理剩余的流程领域。\n\
  \n## 如何使用流程架构\n\n在本章前面，我们讨论了拥有流程架构的一些好处。我们已经知道，流程架构提供了组织如何创造价值以及流程如何相互关联并与其他组织资源相关的概览。这是架构的**信息功能**。这对于培训新员工和确保每个人都步调一致非常有帮助。\n\
  \n流程架构还允许您轻松地从概览模型下钻到显示所选流程领域正在发生的情况的模型。这是**导航方面**。\n\n如果我们添加标准化和使用通用程序（可重用性）以及许多地方的协同效应所带来的巨大机遇的问题，我们可以看到，有几个其他业务领域可以作为良好实践的来源。\n\
  \n例如，**业务流程管理**的实践者可以从**企业架构管理**（特别是应用组合管理）、**产品组合管理**或**项目管理**等领域寻找灵感，在更高层次上，项目管理转化为**计划管理**，以便单个项目协同工作，以及**组合管理**，以便实践者可以为其实施选择合适的项目。\n\
  \n在每个领域，可重用性和寻求协同效应都是重要话题，因此在那里有效的方法在流程管理中也可能有用。\n\n这对于计划推出新产品并进入新市场的组织尤其重要，因为他们不需要从零开始准备一切；相反，他们可以重用一些现有流程。这有助于降低成本、加快速度、降低风险并提高组织的整体敏捷性。\n\
  \n此外，计划进行合并和收购的公司可以从流程架构中获益良多，因为它使他们能够找出哪些元素是冗余的，在哪里可以使用标准化，以及在哪里仍然需要单独的流程。\n\n\
  在**流程属性**部分，我们了解到，在流程架构中，每个流程通常由一组不同的属性描述，这些属性在图形模型中乍一看通常不可见，尽管它们可以用于流程分析。\n\n在本节中，我们将了解流程架构的其他实际应用可能是什么样子，以及流程架构如何在组织的数字化转型计划中发挥作用。\n\
  \n\n\n\n\n## 建立流程架构\n\n让我们从一个通常是选择应纳入进一步架构工作的流程的核心话题开始：评估流程的重要性。根据组织的具体情况以及指导构建流程架构的倡议目标，例如，按业务价值、客户满意度水平、IT\
  \ 支持、法规合规性等对流程进行分类可能会很有帮助。此类信息可以，例如，使用颜色可视化为热图，这有助于讨论进一步工作的优先级。图 6.9 展示了这种方法的示例。\n\
  \n![](img/a4c90ee3d142c33743706d37c65779c2_194_0.png)\n\n使用多个数据维度的更复杂的分析也是可能的。例如，选择流程以进行改进的常见方法可能是根据两个标准进行评估：重要性和紧迫性（即\
  \ **艾森豪威尔矩阵**）或痛点和收益。另一方面，在选择用于 **机器人流程自动化 (RPA)** 的流程时，通常会关注流程执行频率和标准化程度（或业务相关性）。\n\
  \n另一组属性示例将涉及评估自动化给定流程的收益和该自动化的成本。对于这种类型的分析，结果通常以图形分析的形式呈现，将流程评估显示为图中每个元素中的气泡。图 6.10\
  \ 展示了这种流程选择方法可能的样子。\n\n![](img/a4c90ee3d142c33743706d37c65779c2_195_0.png)\n\n气泡大小：业务价值\n\
  \n图 6.10 – 基于多级分析选择用于自动化的流程（自动化成本与自动化收益与业务价值）\n\n通过将这种流程选择方法作为数字化转型倡议的一部分，正确的流程被纳入的机会会增加，而不是由组织中高知名度的人士大声倡导的流程。作为进一步分析工作的额外好处，参与设计新解决方案的人将更了解流程。\n\
  \n知道流程负责人是谁以及我们的流程与哪些其他流程相关联，可以确定在规划中应让谁参与。了解流程使用哪些应用程序和数据，也可以帮助避免因缺乏知识而导致的昂贵错误。\n\
  \n由于流程架构提供了流程的综合描述，以及关键属性和关系，设计无法为整个组织提供最佳结果的零散解决方案的风险显著降低。\n\n拥有流程架构的另一个好处是，上述描述流程的属性，例如流程目标、流程描述、流程负责人等，不仅可以作为设计工作的一部分，还可以在日常工作中使用。通过使用正确的流程文档方法，我们可以确保所有利益相关方都能访问所需的知识。\n\
  \n## 如何展示流程架构的好处\n\n如前所述，流程架构不仅对于文档化流程非常有帮助，而且对于改进和自动化流程也非常有帮助。一旦我们选择了合适的流程（例如，高流量、改进潜力巨大且可以自动化的流程），下一步就是选择合适的自动化方法。\n\
  \n对于某些高流量、标准化且不需要处理非结构化数据的流程，ERP 和 CRM 等更传统的自动化方法可能就足够了。对于其他流程，如果流量不那么高，但流程相对标准化，您可能希望使用\
  \ BPMS 工具/工作流自动化。当然，也有可能您需要编排许多技术，例如 RPA 机器人和 AI 代理，同时确保您的员工在流程中协同工作。\n\n对流程有良好的了解将帮助您决定如何正确地自动化流程。这样，您就可以避免为一个\
  \ CRM 系统就完全足够的流程创建一个花哨且昂贵的 AI 代理解决方案。\n\n关于流程的信息还将帮助您设计和实施解决方案。在此，除了高级流程架构外，显示工作流的详细图表也会很有用。我们将在本书后面更深入地讨论这个话题。\n\
  \n一个额外的令人兴奋的机会，可以缩短交付流程架构价值所需的时间（例如，运行成功的自动化项目），就是 **流程挖掘**。这一在第 5 章中提到的概念，允许您根据流程日志发现流程并改进它们。对于中型和大型组织，此类项目可以带来显著的好处，拥有流程架构可能有助于决定首先应解决哪些领域。\n\
  \n根据组织的具体情况，这可以通过流程工具来组织，很可能使用第 5 章中提到的基于存储库的 **企业业务流程分析** 工具之一，发布到 SharePoint 或\
  \ Confluence 等解决方案，或创建包含流程关键信息的可打印文档。\n\n通过这种方法，可以在不为每个流程创建详细图表的情况下收集必要的流程信息，这在创建和更新方面都节省了大量时间。\n\
  \n## 总结\n\n在本章中，我们了解了什么是流程架构及其在流程管理中的作用。我们了解了组织的流程架构可以如何构建：要么使用 APQC 的 PCF 等流行的流程库，要么构建针对组织具体情况量身定制的流程架构。我们还有机会了解流程架构在实践中如何应用，并了解了拥有流程架构的好处。\n\
  \n在许多地方，我们也有机会看到，流程架构允许我们选择应该详细描述哪些流程，或者流程架构允许我们选择要优化或自动化的流程，这通常需要我们更详细地描述它们。但是，我们如何以更高的详细程度描述流程呢？我们将在下一章中解决这个问题。\n\
  \n## 延伸阅读\n\n- 如果您想了解更多关于流程命名以及构建涵盖流程架构及其与业务能力关系的业务架构的主题，我强烈推荐 Roger Burlton 的优秀书籍《业务架构：收集、连接和纠正要点》（_Business\
  \ Architecture: Collecting, Connecting, and Correcting the Dots_）。另一本很棒的书是 Roger\
  \ Tregear 的《重新想象管理：将流程置于业务管理的中心》（_Reimagining Management: Putting process at the\
  \ center of business management_）。这两本书都是纯金！\n\n- 如果您有兴趣构建将业务流程管理和企业架构管理相结合的组织架构，请查看\
  \ Roland Woldt 的书《成功架构实施：实施 EA/BPM 计划的实用指南》（_Successful Architecture Implementation:\
  \ A practical guide on how to implement your EA/BPM program_）。\n\n- 如果您有兴趣了解组织如何实施\
  \ BPM 的真实案例，我不知道有比 Jan vom Brocke、Jan Mendling 和 Michael Rosemann 编辑的《业务流程管理案例 Vol.\
  \ 3：实践中的实施》（_Business Process Management Cases Vol. 3: Implementation in Practice_）更好的书了。特别是，我建议您阅读关于在波兰财政部构建流程架构的有趣案例，以了解不同的流程架构方法。\n\
  \n- 您可以在 Serge Schiltz 的《全面业务流程管理：使用 BPMN 2.0 和 OCEB 2 基础取得成功》（_Holistic Business\
  \ Process Management: Successful with BPMN 2.0 and OCEB 2 Fundamental_）中找到创建流程架构的更多示例和最佳实践。如果您有兴趣获得\
  \ BPM 认证，这本书也是一个绝佳选择。更多关于此主题的内容将在第 11 章中介绍。\n\n\n\n\n"
- "## 过程建模符号\n\n第 1 章对图形建模的主要原因进行了很好的概述。过程管理历史悠久，因此在此期间出现许多建模方式——即所谓的建模符号——也不足为奇。正如我们在第\
  \ 6 章中发现的，过程建模可以在不同层面上使用。模型也可以面向不同的受众。\n\n由于没有一种符号能够满足所有用户和所有目的，在本章中，我们将学习如何建模过程，并讨论这些符号之间的差异。\n\
  \n由于存在数十种过程建模符号，我们无法全部深入介绍。相反，我们将回顾过程建模的历史，讨论当今仍然相关的重要符号，并简要提及那些目前不太流行但对当今最流行的过程建模符号——BPMN——产生了影响的符号。\n\
  \n在本章中，我们将介绍以下主要主题：\n\n- 过程建模的基础知识\n- 超越流程图——其他符号概述\n- BPMN——我们如何走到这一步，以及它与我们的相关性\n\
  \n> **Note**  \n> 本章由 Zbigniew Misiak 撰写。\n\n### 过程建模的基础知识\n\n很难想象，但业务流程建模可以追溯到\
  \ 100 多年前。1921 年，Frank 和 Lillian Gilbreth（杰出的工业工程师和效率专家）在向美国机械工程师学会（ASME）发表的题为《过程图表：寻找工作最佳方式的第一步》的演示中，提出了一种全新的展示流程的方式。\n\
  \n令我着迷的是，文章开头提出的观点至今仍然有效：\n\n> \"过程图表是一种可视化流程以改进流程的工具。流程的每个细节或多或少都受到其他每个细节的影响；因此，整个流程必须以这种形式呈现，以便在对其任何细分部分进行任何更改之前，一次性可视化整个流程\"\
  。\n\n除了提出过程建模的方法外，他们还为过程图表提出了几十种标准符号（形状）。他们的想法得到了认可，并于 1947 年，过程图表成为 ASME 标准（采用简化形式，形状更少，旨在减少错误）。\n\
  \nASME 过程图表使用圆形、箭头、正方形和三角形等形状。这种建模过程的方式非常简单，这是有意为之。这些图表旨在不仅由管理人员使用，也由执行流程的人员使用，以便他们能更好地理解流程、发现错误，并提出更精简的流程版本。\n\
  \nAlan Mogensen 的一段精彩引语（我在名为《人员优先》的文章中找到，网址为：http://www.worksimp.com/articles/keynoteworkflowcanada.htm），他曾在咨询项目中使用这种建模方式，清楚地表明流程改进被视为一种民主活动，而不仅限于管理人员或专家：\n\
  \n> \"做这项工作的人比世界上任何其他人都更了解它，因此他是最适合改进它的人。\"\n\n很可能，你已经见过一些流程图。但是，如果你决定查看显示原始流程图形状的图片，该图片可在本书第\
  \ 7 章资源的 GitHub 页面上找到，（https://github.com/PacktPublishing/Practical-Business-Process-Modeling-and-Analysis/tree/main/Chapter07）你可能不熟悉所有形状。这是因为流程图不断演变，尤其是在发现它们对于创建表示计算机代码的图表非常有用之后。\n\
  \n有几个标准规定了流程图中使用的形状，例如，ANSI 于 1970 年发布的《流程图符号及其在信息处理中的应用》和 ISO 5807 于 1985 年发布的《信息处理——数据、程序和系统流程图、程序网络图及系统资源图的文档符号和惯例》。\n\
  \n然而，在各种程序中，你仍可能遇到一些差异。由于我们将比较不同的符号，我们将使用一种通用的表格样式，以便你更容易地看到相似之处和差异。在这个表中，你将看到图表中经常使用的对象（形状）的概览，但请注意，它们还需要一些连接器（箭头）。每种符号都有自己的连接器样式，但正如你将看到的，显示流程流向的连接器通常用实线绘制。\n\
  \n| 建模概念 | 形状和名称 | 描述 |\n|---|---|---|\n| 过程图表的开始 | Start | 过程图表的第一个元素。开始和结束形状看起来相同。\
  \ |\n| 过程步骤（简单） | Process | 表示流程中要完成的某项工作的简单过程步骤。 |\n| 过程步骤（复杂） | Subprocess | 更复杂的过程步骤，可以有多个子步骤——通常在单独的图表中显示。\
  \ |\n| 过程分支 | Decision | 流程基于某个决定分为两条或多条路径的位置。 |\n| 过程图表的结束 | End | 过程图表的最后一个元素。开始和结束形状看起来相同。\
  \ |\n\n表 7.1 – 流程图形状（基础）\n\n正如你所想象的，前面表格中显示的形状非常有用，可以让你记录流程的许多有趣方面，但它们并不是流程图所能提供的一切。下表显示了一些使用频率较低的建模概念：\n\
  \n| 建模概念 | 形状和名称 | 描述 |\n|---|---|---|\n| 文档创建 | Document | 创建文档的步骤 |\n\n| 建模概念\
  \ | 形状和名称 | 描述 |\n|---|---|---|\n| 处理输入或输出 | Data or input/output | 从外部进入流程的数据或材料，或流程的输出\
  \ |\n| 导航 – 同一页 | On-page reference | 跳转到流程图的另一部分 |\n| 导航 – 另一页 | Off-page reference\
  \ | 指向流程图另一页的超链接 |\n\n表 7.2 – 流程图形状（高级）\n\n现在，让我们看看在实践中，一个业务流程如何作为流程图来记录。我们将继续使用你在前两章中看到的\
  \ B2C 公司投诉处理流程。\n\n该流程由客户报告投诉（通过电子邮件、电话或网站聊天）的通信启动。投诉专家会在自动化整个流程的系统中检查投诉的有效性。如果投诉无效，客户会收到关于其被拒绝的消息，并附有理由（理由应由专家在前一步中准备）。如果投诉有效，客户会收到投诉获批的信息，然后专家确定哪种解决方案能令客户满意：退还（部分）款项或用新产品更换产品。如果客户选择退款，相应的订单将转交给财务团队进行退款。如果客户偏好更换产品，订单将转交给物流团队发货相应产品。因此，该流程可以以三种方式结束：\n\
  \n1. 客户可能会收到关于投诉被拒绝的消息（附带理由）。\n2. 客户可能会收到货币退款。\n3. 客户可能会收到替换产品。\n\n\n\n\n\nAs you\
  \ can see, it is pretty difficult to get a good overview of what is happening in\
  \ this process simply by reading the text. Table 7.3 allows you to see how the tabular\
  \ form of a process description may increase the readability a bit. While this is\
  \ a step in the right direction, it does not make a huge difference either (e.g.,\
  \ the reader needs to guess that after step 5, we finish the process and do not\
  \ continue with step 6, as they represent two mutually exclusive process flows).\n\
  \n| # | Name of the step | Responsibility |\n|---|---|---|\n| 1 | Complaint valid?\
  \ Yes – go to step 2 No – go to step 8 | Complaint specialist |\n| 2 | Inform the\
  \ customer about the complaint’s validity | Complaint specialist |\n| 3 | How to\
  \ handle a complaint? Replacement – go to step 4 Refund – go to step 6 | Complaint\
  \ specialist |\n| 4 | Order shipping of the replacement product | Complaint specialist\
  \ |\n| 5 | Ship product | Logistics specialist |\n| 6 | Order refund | Complaint\
  \ specialist |\n| 7 | Process a refund | Finance specialist |\n| 8 | Inform the\
  \ customer about the rejection | Complaint specialist |\n\nTable 7.3 – Tabular description\
  \ of a process\n\nNow, let’s take a look at the same process shown as a flowchart.\n\
  \n![](img/a4c90ee3d142c33743706d37c65779c2_204_0.png)\n\nFigure 7.1 – Example process\
  \ as a flowchart (created in Lucidchart)\n\nAs you will immediately see, it is clear\
  \ what the steps of the process are and what the logic of the process is, including\
  \ where the process splits into exclusive paths (i.e., only one path can be taken:\
  \ the complaint is either valid or invalid).\n\nThis simple flowchart shows in practice\
  \ several things important for reading process diagrams:\n\n- The process needs\
  \ to have a specific place showing its start and end\n- You read the process diagram\
  \ by following the arrows connecting the objects\n- Process steps, that is, work\
  \ that needs to be done, are usually shown as rectangles\n- Places where the process\
  \ splits into several paths are usually shown as diamonds\n- If a certain part of\
  \ the process is complex, it may be helpful to simply mark it in what is called\
  \ a subprocess, that is, a process of a lower level, instead of trying to show everything\
  \ in one big diagram\n\nSimple flowcharts do not show responsibilities for process\
  \ steps, but this was added to more advanced versions of flowcharts (cross-functional\
  \ flowcharts) later on.\n\n## Going beyond flowcharts – overview of other notations\n\
  \nWhile flowcharts provided a nice way to show what is happening inside a process,\
  \ it quickly became apparent that there are additional ideas regarding how processes\
  \ can be modeled.\n\nNotations that I think are worth mentioning in this section\
  \ are the following:\n\n- IDEF\n- LOVEM\n- UML\n- EPC\n\n### IDEF\n\nThe **Integrated\
  \ DEFinition (IDEF)** method is a family of modeling notations developed for the\
  \ US Air Force and the Department of Defense in the 1970s. It contains several model\
  \ types serving various purposes – among them, IDEF3 is meant for modeling processes.\
  \ It is not very popular nowadays outside the US but it shares some of the characteristics\
  \ that we have already covered, such as representing activities as boxes and connecting\
  \ them with arrows. You can learn more about IDEF3 and see examples at `https://www.idef.com/idef3-process-description-capture-method`.\n\
  \n### LOVEM\n\n**Line of Visibility Engineering Methodology (LOVEM)** was introduced\
  \ by IBM in the mid-1990s to model processes for the purpose of reengineering initiatives.\
  \ As process reengineering lost its appeal, LOVEM also stopped being used frequently.\
  \ Just like IDEF, LOVEM also had several types of charts (so-called **Line of Visibility\
  \ Charts (LOVCs)**). You can see examples of various LOVCs and learn more about\
  \ LOVEM from the (archived) publication by IBM available thanks to the Internet\
  \ Archive: `https://web.archive.org/web/20140309022748/http://www.redbooks.ibm.com/redbooks/pdfs/sg242590.pdf`.\n\
  \nJust like in IDEF, LOVEM also used boxes representing activities and arrows, but\
  \ also **swimlanes** showing who does what. The innovation in LOVEM is the **line\
  \ of visibility** – a special line in a diagram showing the border between the company\
  \ and the customer. Apart from this, LOVEM also helped show additional information\
  \ such as data flows inside a process.\n\n### UML\n\nWhile IDEF and LOVEM are not\
  \ used often, our next notation is still popular. **Unified Modeling Language (UML)**\
  \ is a modeling standard still popular among IT specialists for documenting various\
  \ aspects of software development. Just like the previous examples, UML also has\
  \ many diagram types (14 in version 2.5) serving various purposes. Unlike other\
  \ notations, UML is a standard supported by an independent body – the **Object Management\
  \ Group (OMG)** – which oversees the standard and maintains it.\n\nUML also boasts\
  \ a long history – version 1.0 was proposed in 1997, and the latest update (version\
  \ 2.5.1) was published in December 2017. You can learn more about UML on the standard’s\
  \ website: `https://www.uml.org/`.\n\nOut of the many diagram types, **activity\
  \ diagrams** could be used for modeling processes. In the following figure, you\
  \ can see an example of a UML activity diagram.\n\n![](img/a4c90ee3d142c33743706d37c65779c2_207_0.png)\n\
  \nFigure 7.2 – Example process as a UML activity diagram (created in Enterprise\
  \ Architect)\n\nAs you can see, activity diagrams preserve the rules we have mentioned\
  \ so far. In addition, they introduce different visualizations for start and end\
  \ nodes (circles) and use rounded rectangles for the process steps instead of normal\
  \ rectangles. However, much more importantly, UML provides a metamodel and an XML-based\
  \ interchange mechanism so that diagrams are not only pretty pictures but can also\
  \ be shared among other tools.\n\n### EPC\n\nFinally, I want to mention a notation\
  \ for modeling processes that for a long time was one of the most popular among\
  \ business professionals: **Event-Driven Process Chain** (**EPC**). EPCs are part\
  \ of the **Architecture of Integrated Information Systems** (**ARIS**) method, developed\
  \ by Professor Scheer in the 1990s for the purpose of documenting organizations\
  \ and their processes. Of course, it was not the only notation serving this purpose\
  \ (e.g., the **BPMS** method was proposed by Professor Karagiannis around this time),\
  \ but EPCs were popularized by their usage in SAP **Enterprise Resource Planning**\
  \ (**ERP**) software.\n\nAs the name suggests, EPCs put a strong emphasis on events\
  \ in a process; however, they also introduce several other elements that allow you\
  \ to show who performs certain process steps (in case you are wondering: EPCs can\
  \ also use swimlanes to show responsibility, which documents and IT systems are\
  \ used, and so on). This allows conveying much more information in comparison to\
  \ plain flowcharts.\n\n> **Note**\n> To learn more about EPC and see an example\
  \ diagram prepared by Roland Woldt, visit the GitHub page with resources for this\
  \ chapter: `https://github.com/PacktPublishing/Practical-Business-Process-Modeling-and-Analysis/tree/main/Chapter07`.\n\
  \n## BPMN – how we got there and why it is relevant to us\n\nIn a previous section\
  \ of this chapter (_Going beyond flowcharts – overview of other notations_), you\
  \ had a chance to see how complex it was to communicate with others using process\
  \ models even 20 years ago. Numerous ways of describing processes made communication\
  \ within and between organizations difficult because everyone used their own way\
  \ of modeling. This resulted in the classic Tower of Babel syndrome. Local efforts\
  \ to solve this problem (e.g., the creation of a standard process modeling notation\
  \ for the German public administration) did not lead to a universally recognized\
  \ modeling method. The BPMN notation was conceived as a solution to this very problem.\n\
  \nThe first version of the standard was published by the **Business Process Management\
  \ Initiative** (BPMI) in 2004 as Business Process Modeling Notation. Since 2005,\
  \ when BPMI merged with OMG, an organization known for developing and maintaining\
  \ many technology standards, BPMN has been developed by OMG. As part of this work,\
  \ version 1.1 of the standard was published in 2008, followed by version 1.2 in\
  \ 2009.\n\nHowever, the most important moment in the development of BPMN was in\
  \ 2011, when version 2.0 of the specification was published, which, with minor modifications\
  \ (the latest version of the standard is 2.0.2, published in 2014 as the ISO/IEC\
  \ 19510 standard), is still in force today.\n\nVersion 2.0 of the BPMN standard\
  \ brought a lot of significant changes; many new object types and icons were added\
  \ and some of the elements introduced in the earlier version of the specification\
  \ were changed. So, in this book, we will be dealing with the current version.\n\
  \nThe first important thing to know about version 2.0 is that the BPMN acronym now\
  \ stands for **Business Process Model and Notation**. This name change naturally\
  \ has a deeper rationale, which we'll address in a moment, but for those uninterested\
  \ in the technical details, it has brought one very important benefit: if, in the\
  \ course of searching for answers to questions related to BPMN, you find an article\
  \ in which the author uses a different acronym expansion than Business Process Model\
  \ and Notation, it's quite likely outdated content that doesn't take into account\
  \ the latest version of the specification.\n\nAnother extremely important change\
  \ introduced by version 2.0 of the standard was the definition of how data is exchanged\
  \ between different tools supporting BPMN. This is very important as well. While\
  \ earlier versions of the standard allowed generating – for some types of process\
  \ diagrams – code to automate processes in **Business Process Execution Language\
  \ (BPEL)**, there was no reliable way to go from BPEL code to a BPMN diagram that\
  \ would work for every process diagram. For a while, another technology standard\
  \ served as a workaround for this problem: **XML Process Definition Language (XPDL)**,\
  \ developed by the – unfortunately no longer functional – **Workflow Management\
  \ Coalition (WfMC)**. However, this was not an optimal situation, because not all\
  \ elements possible to describe in WfMC could be exchanged between different tools\
  \ using XPDL.\n\nVersion 2.0 of the standard introduced a special data exchange\
  \ format, using the XML file format and described in the Diagram Interchange section\
  \ (_chapter 12.1_) of the standard, which is often referred to as BPMN DI or BPMN\
  \ XML. This ensures that any business process diagram can be saved as an XML file\
  \ for data exchange with other modeling or process automation tools.\n\nIn addition,\
  \ to take care of efficient data exchange, a special **BPMN Model Interchange Working\
  \ Group (BPMN MIWG)** was established – for more than 10 years, it has provided\
  \ a forum for tool developers to collaborate, conducted annual diagram exchange\
  \ demonstrations, and maintained and developed a library of test models through\
  \ which it is possible to verify the level of support of BPMN notation by a given\
  \ tool. Test results are presented in the form of a table, the current state of\
  \ which, at the time of writing this book, is shown in the following screenshot.\n\
  \n\n\n\n\n## BPMN Tools tested for Model Interchange\n\n| Vendor | Tool | BPMN 2.0\
