  \ This is extremely risky for the whole organization, because processes need the\
  \ involvement of many people from different parts of the organization to create\
  \ value. So, if they don’t have a common, agreed-upon view of how the organization\
  \ works, they may make wrong decisions.\n\nIf people simply think only about their\
  \ own organizational silo, it is quite possible that a change in a process that\
  \ seems to be beneficial, at least for the organizational unit responsible for a\
  \ part of a whole process, will be harmful to the entire organization. This situation\
  \ is called sub-optimization.\n\n\n\n\n\n如果人们试图采取更广阔的视角，但对他人的工作存在一些误解，或者根本不知道还有其他人正在从事相同的流程，这也可能导致各种问题，例如设计出的解决方案无法为所有利益相关方提供适当的支持，或者基于并非源于真实需求的需求来制定流程。\n\
  \n由于流程在复杂的生态系统中运行，那么将单个流程与其他流程隔离开来进行建模、优化或自动化是否有意义呢？或者，从另一个角度来看，如果我们想要提升组织在某个流程领域的绩效，我们如何知道那里存在哪些流程，又如何选择要分析的流程呢？\n\
  \n解决方案是 **流程架构**。它是一种全面的识别和展示流程的方式，为组织的流程提供了一个共同且经过认可的定义。\n\n流程架构有多个层级，使我们能够轻松地从总体概览导航到提供更多细节的更具体模型。它也是多维的，因为它展示了不同类别的流程及其相互依赖性，同时还考虑了其他维度——例如流程与\
  \ IT 架构之间的连接、策略和目标对流程的影响、与风险以及 **环境、社会和治理 (ESG)** 要求的关系，以及许多其他问题。\n\n在接下来的章节中，我们将查看一个顶级流程架构模型的示例。我们将在本章中对其进行扩展，以便您可以在实践中看到重要的概念。\n\
  \n## 流程类别\n\n创建流程架构的组织通常将其流程划分为不同的类别。通常使用三个类别：\n\n- **管理流程**（有时也称为 **指导流程**）：管理流程通过给予其他流程方向、约束和规则来指导它们。\n\
  \n- **核心流程**：核心流程实施组织的战略并创造价值。对于商业组织而言，这些是提供客户愿意付费购买的产品和服务的流程。\n\n- **支持流程**（也称为\
  \ **支持性流程** 或 **使能流程**）：支持流程提供其他流程所需的可重复使用资源，使它们能够按预期工作。\n\n图 6.1 展示了流程架构中顶级概览模型（有时称为\
  \ **第 0 级**）的示例。在这里，通用流程以图形方式排列，以显示它们属于哪个类别。此外，还使用形状（向上或向下指的箭头或 V 形箭头）和颜色来使区分更清晰。然而，情况并非总是如此；对于某些组织，一致性更为重要，它们在整个过程中使用相同的形状（通常是蓝色、向右指且宽大的\
  \ V 形箭头）。\n\n管理流程\n\n核心流程\n\n支持流程\n\n图 6.1 – 流程架构顶级模型示例\n\n有时，流程类别也可以通过字母数字前缀来表示——例如，不同的流程类别可能以\
  \ MP、CP 和 SP 开头。正如我们将在 *在实践中构建自定义流程架构* 章节中看到的那样，在流程名称中使用前缀并非强制性。对于某些组织，如果在名称中显示流程类型，甚至可能会造成一些误解。前缀还可以包含数字标识符，我们将稍后更详细地介绍这一点。\n\
  \n## 流程层级\n\n流程架构的下一个重要元素是 **层级**。就像建筑规划一样，我们可以查看提供不同详细程度的地图和计划，例如城市规划、我们正在建造的土地地块的计划、建筑物内单个公寓的计划（包含电气、管道和空调系统布局的信息）等，并根据需要在这些层级之间移动（放大和缩小）。流程架构也意味着以连接模型的形式存在多个层级的文档。\n\
  \n这很有用，因为为了在组织中支持流程思维，我们需要让许多具有不同信息需求的利益相关方参与进来。对某些人来说，快速了解流程及其与其他流程的关系的总体概念很重要。另一些人则需要关于流程的更精确信息来完成工作或改进和自动化该流程。\n\
  \n在流程架构中，对于多个层级并没有一种适用于所有情况的方法。一些专家建议应该有固定数量的层级。当组织使用某个标准并希望将其流程与使用该标准的其他组织进行比较时，可能会出现这种情况。\n\
  \n另一些人建议，即使在单个组织内部，层级的数量也可能不同。这允许在需要时更深入地进行灵活性。此外，关于在一个模型中可以展示多少个流程层级，也没有共识。因此，我将在这里介绍的是基于我经验的最佳实践。\n\
  \n这个流程层级如何运作呢？当我们有一个显示流程架构概览的顶级模型（例如，类似于图 6.1）时，它通常显示 10-20 个流程组，这些组也可以称为 **流程领域**\
  \ 或 **超级流程**。其中每个都可以分解为显示多个层级 **子** 流程的更详细模型。\n\n最后——至少对于某些流程——我们可能希望通过提供详细的流程图来记录它们，这些图通常使用\
  \ BPMN 符号描述——非常适合记录我们如何执行流程，但不适合展示高级流程架构。我们将在第 8 章 BPMN——你需要知道的内容 和第 9 章 高级 BPMN\
  \ 中介绍这一点。这些详细图表还可以分解为更详细的子流程，并可以丰富为单个流程步骤的说明。此类说明可以包括 **标准作业程序** (SOP) 文档，即使在不使用流程思维但只想通过提供精确信息并确保工作质量来帮助员工的组织中也经常使用。\n\
  \n除了与其他流程的连接之外，每个流程还可以包含更多信息。我们将在下一节中介绍这些流程属性。这样，我们就可以向感兴趣的人提供关于流程的必要信息，而无需为每个流程创建详细图表。这一点至关重要，因为创建和更新详细图表可能非常耗时。\n\
