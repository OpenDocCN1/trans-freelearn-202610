  然而，这还不是全部。我们还可以说明流程的目标（或目的）、触发流程的因素以及流程的结果。如果我们说明了流程目标，那么考虑该流程的 **关键绩效指标 (KPIs)**\
  \ 也就非常有意义了。对于某些流程，还可以添加 **服务级别协议 (SLA)**。\n\n除了在 **常规信息** 选项卡中显示的上述属性之外，我们还可以添加更多信息。其他可见选项卡的名称可以让您了解可以放置哪些类型的属性。\n\
  \n流程管理的一个非常重要的方面是流程与组织结构之间的连接。理想情况下，对于每个流程，我们都应该定义所有权和职责——谁是 **流程负责人**，谁支持负责人，哪些单位参与执行流程（通常称为参与者或\
  \ **参与方**），等等。\n\n## CP.01.02.02 流程 Kb2\n\n| 类型 | 名称 | 版本 | 状态 |\n|---|---|---|---|\n\
