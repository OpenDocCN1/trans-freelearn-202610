  \ 流程架构的多级结构及其导航\n\n## 流程属性\n\n图 6.3 展示了多级流程架构的示例。它能够清晰地概述流程之间的依赖关系，同时通过超链接，让您能够轻松在不同模型之间切换，从而只需单击一次即可深入导航。\n\
