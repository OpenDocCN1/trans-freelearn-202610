  \n## 计算 ROI\n\n通过将总利益与总成本进行比较来计算 ROI。ROI 公式如下：\n\nROI (%) = [(总利益 - 总成本) / 总成本]\
  \ x 100\n\n这里有一些需要考虑的假设。NPV 的 8% 折现率反映了美国中型公司的**加权平均资本成本（WACC）**。8% 属于保守側，用于项目风险中等且公司稳定且在各地区多元化的商业案例中。\n\
  \n| 利益 | $6,950,000 |\n|---|---|\n| 年度净利益 | $6,550,000 |\n| 成本 | $4,050,000 |\n\
  | 总投资（第 0 年 + 三年持续支持成本） | $4,050,000 + ($400,000 x3) = $5,250,000 |\n| 总净利益（第 1-3\
  \ 年） | $19,650,000 = (3 x $6,550,000) |\n| 三年期 ROI | [($19,650,000 – ($4,050,000\
  \ + $1,200,000)) / $5,250,000] x 100 = 274% |\n| NPV（使用 8% 折现率） | -$4,050,000 +\
  \ [$6,550,000/(1.08)] + [$6,550,000/(1.08)²] + [$6,550,000/(1.08)³] = $12,829,140\
