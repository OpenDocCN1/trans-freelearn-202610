  > **注意**

  > 本章由 Zbigniew Misiak 撰写。

  > 本章的其他资源已上传至：`https://github.com/PacktPublishing/Practical-Business-Process-Modeling-and-Analysis/tree/main/Chapter09`。


  ## 其他类型的事件


  在第 8 章中，我们了解了定义流程范围的最重要的启动和结束事件类型。但是，值得注意的是，BPMN 还允许你建模中间事件，顾名思义，这些事件发生在流程过程中：在流程开始后、结束前。






  ## 中间事件—基础


  **中间事件**表示为中心带有图标的圆形，指示其触发器，与所有其他事件一样。但是，您可以通过查看其边框轻松将其与开始事件和结束事件区分开来。开始事件始终以单细线作为边框，而结束事件具有一条单粗线，中间事件始终具有双细线。


  ![](img/a4c90ee3d142c33743706d37c65779c2_294_0.png)


  图 9.1 – 比较：开始、中间和结束事件


  中间事件有不同的变体。最常见的是，它们是流程的一部分，用于显示流程已达到某个特定状态，或者流程必须等待某个事件发生后才能继续。正如您所期望的，我们可以应用一个熟悉的概念：**抛出（主动）**和**捕获（被动）事件**。


  与开始和结束事件的情况一样，也可以存在没有定义触发器的中间事件。这种类型的事件内部没有图标，因此是一个边框为双细线的简单圆形。没有触发器的中间事件始终主动行为；它是一个抛出事件（尽管从视觉上无法猜测，因为没有图标）。这种情况相当少见，但可以用于显示流程已达到某个重要阶段（**里程碑**）。


  中间事件也可以用于标记流程中的异常、错误和特殊情况。为此，使用**边界中间事件**。它们始终附加到任务或子流程的边界，为这些任务或子流程提供异常处理。边界中间事件始终是捕获（被动）元素，其行为类似于哨兵。它们用于“监听”可能影响其所附加活动执行的事项，并指定如何处理这些情况。


  一般来说，有两种可能的选项：发生某些事情迫使我们中断正在进行的工作（这由**中断中间事件**描述），或者在不中断当前正在执行的活动的情况下，可以导致我们在“旁边”做一些额外的事情（这就是**非中断中间事件**的用途）。


  ## 消息事件—回顾


  让我们从学习**消息事件**开始——即消息作为触发器的事件。为了帮助您更轻松地了解这一点，我们将使用投诉处理流程的一个略有修改的版本，在该版本中，我们使用中间事件（而不是任务）与客户通信。


  ![](img/a4c90ee3d142c33743706d37c65779c2_295_0.png)


  图 9.2 – 使用示例：投诉处理流程中的开始、中间和结束事件


  由消息触发的开始事件与我们之前讨论的相同——它仅表示当客户关于投诉的消息到达我们公司时，流程开始。


  发送消息的结束事件也应该看起来很熟悉。它告诉我们，当我们的**产品发货**子流程结束时，处理投诉的主流程也结束，但除此之外，我们向客户发送一条消息（例如电子邮件），告知投诉已关闭，并很可能附带一个调查链接，以便我们了解客户对投诉处理流程的满意度。


  ## 捕获和抛出中间事件


  **图 9.2** 中值得注意的新项目是两个中间事件：**投诉已接受**和**交付详情已接收**。对于这两个事件，消息都是触发器，如对象内部的信封图标所示。正如您在示例中所见，主动（抛出）事件具有深色信封图标，而被动（捕获）事件具有浅色图标。所有中间事件都以这种方式行为，使图表的含义易于解释。


  让我们稍微复杂化一下示例，并添加两个边界中间事件，两者都将附加到**订单发货替换产品**任务。如明亮图标所示，两个事件都是被动的，因为它们的角色是“监听”其所附加活动执行期间是否发生特定事项，并指定我们的反应将是什么。


  ![](img/a4c90ee3d142c33743706d37c65779c2_296_0.png)


  图 9.3 – 使用示例：投诉处理流程中的边界中间事件


  ## 中断和非中断边界事件


  让我们想象一下，我们需要处理一种（假设的）情况，即客户撤回其索赔，因为他们确定问题不是我们公司或快递公司的过错，而是一个孩子在玩耍时撞到了包裹并导致其内容物损坏。在这种情况下，完成**订单发货替换产品**任务没有意义，因为我们不需要发送替换产品。在关闭投诉后（也许在
  CRM 系统中标记），我们可能希望感谢客户的诚实，并作为一份小礼物，给他们下次订单的折扣。


  我们可能希望响应的第二种情况是客户方面更改联系电话。如果我们的客户在投诉时不小心提供了错误的号码（例如商业电话），他们可能希望更改为不同的号码（例如私人电话），以便快递拨打正确的号码。在我们仍在订购发货期间，可以随时进行此更改，但必须在我们进入产品发货子流程之前发生（那时进行更改就太晚了）。


  正如您所见，在这两种情况下，边界事件包含相同的图标，因为它们正在等待消息。此外，两者都有指向处理这些特殊情况所需活动的传出序列流。用于边框的不同类型的线条表明，这些事件在中断其所附加活动方面可能具有不同的含义。


  非中断边界事件具有虚线双细线，而中断边界事件的边框为实线双细线。你如何记住这一点？这个技巧可能对你有帮助：实线表示“自信且果断”的事件。当它发生时，它会从其“父级”（其所附加的活动）中拿走令牌，从而中断该活动，并使用令牌进行其目的。另一方面，虚线表示事件是“害羞”的，为了不打扰其“父级”，它会产生自己的令牌并执行一些额外的流程步骤，而不打扰“父级”。


  有趣的是，中间捕获事件和边界捕获中断事件之间没有视觉差异——两者都有双实线和带有浅色填充的图标。然而，它们在属性方面有所不同（当然，这取决于您使用的工具），以及在事实方面有所不同：作为流程一部分的中间捕获事件具有入站和出站序列流，而附加到活动边界的边界事件只能具有出站序列流。


  值得注意的是，边界事件并不总是准备好执行其工作。边界事件（有一个例外，我们将在本章后面介绍）仅在其所附加的任务或子流程处于活动状态时才“监听”。


  在实践中，它是如何工作的？如果我们的边界事件正在等待的消息在我们开始任务之前或刚完成任务后到达，它将被忽略。其他类型的边界事件也会发生同样的情况。


  有时，这是好事，因为它允许我们准确地显示特定流程步骤的异常处理。但是，如果我们想显示两个任务的异常处理相同，我们应该为每个任务添加一个边界事件，或者将两个任务放入一个子流程中，并为其添加一个边界事件。


  如果我们想显示我们可以在整个流程中处理某种情况，该怎么办？幸运的是，BPMN 规范通过一种特殊的子流程和相关的特殊开始事件使这成为可能。


  ## 事件子流程


  这些特殊的子流程称为事件子流程。就其用途而言，它们是 BPMN 中相当不寻常的元素，因为我们不会将它们作为正常流程的一部分插入（没有序列流可以进入或退出它们），而只是将它们放置在泳道中的某个位置。这足以表明它们负责处理该流程的异常。






  Figure 9.4 – 事件子流程的可视化与使用


  另一个不寻常的方面是它们的可视化——与所有子流程一样，它们具有圆角矩形形状，但带有不寻常的虚线边框。


  与其他子流程一样，它们可以用于层次化建模（由 + 图标表示）。不过，更常见的是，它们以展开形式使用——内容立即可见，且没有 + 图标。


  这种第二种情况有时会导致混淆，尤其是当你使用的工具中所有记法元素都是黑白色时，因为很容易将此类子流程与组混淆，尤其是当图表缩小且难以区分虚线与点划线时。


  ![](img/a4c90ee3d142c33743706d37c65779c2_298_1.png)


  Figure 9.5 – 展开的事件子流程


  事件子流程更具挑战性，但值得学习，因为它们能够为整个流程启用异常处理，这有时非常有用。我发现，将事件子流程视为边界事件的“年长兄弟”很有帮助。它们可以中断整个流程，也可以在不中断流程的情况下执行。不过，它们也有更多相似之处。你将在下文中发现这些相似之处。


  ## 事件子流程中的启动事件


  每个事件子流程始终具有一个带有定义触发器的启动事件。同样，这里与边界事件有很强的相似性，因为绝大多数触发器组合对于边界事件和这些子流程的启动事件都是相同的。


  让我们以消息为例，看看这在实践中是如何工作的。由消息触发的边界事件可以是中断型或非中断型。要区分它们，只需查看它们的边框即可。中断事件用实线标记，而非中断事件用虚线标记。


  在中断型事件子流程中，由消息触发的启动事件带有一个浅色填充的信封图标。由于事件子流程以中断方式行为，启动事件的边框是用实线绘制的。这意味着中断型事件子流程的启动事件在视觉上与“正常”启动事件相同。相比之下，非中断型事件子流程中的启动事件的边框是用虚线绘制的。这两种变体都在
  Figure 9.6 中显示。


  ![](img/a4c90ee3d142c33743706d37c65779c2_299_0.png)


  Figure 9.6 – 事件子流程：中断型和非中断型（由消息触发）


  现在我们已经了解了使用消息示例的不同类型中间事件的工作原理，是时候讨论其余可能的触发器了。为了帮助你学习，我们将从一个与消息行为非常相似的触发器开始。


  ## 信号事件


  从上一节中，我们知道当我们想要展示不同池之间的信息交换时，消息非常有用，始终有一个发送者和一个接收者。但是，如果我们的流程中存在信息交换，但不满足这些条件怎么办？


  这时，**信号事件**就派上用场了。你可以将其视为消息的孪生兄弟，因为这种触发器类型出现在所有可以使用消息作为触发器的事件类型中。然而，它允许我们绕过消息事件的限制。


  虽然消息图标始终是一个信封，但信号图标是一个尖端向上的等边（正规）三角形。与往常一样，对于捕获信号事件，三角形具有浅色填充，而对于抛出信号事件，它具有深色填充。


  ![](img/a4c90ee3d142c33743706d37c65779c2_300_0.png)


  ## 信号与消息


  在讨论信号类型示例之前，值得提及信号的双重性质。首先，BPMN 的创建者希望描述这样一种情况：有一个发送者，但有许多可能的接收者——因此得名“信号”。正如救护车警笛不是针对某个特定司机，而是针对该地区的每个司机一样，信号会通知所有潜在相关方某个情况，但他们如何反应则由他们自己决定。一个很好的例子是在门户上发布招标公告。此类信息由一个实体发布，但通常有许多接收者。也没有确定性谁会对信号做出反应。


  其次，信号有源于克服消息限制的愿望而产生的额外用途。对许多人来说，发送和接收消息的概念非常有用，但他们发现很难接受这样一个限制：消息的发送者和接收者是拥有各自池的两个不同参与者。由于并非总是可能，信号有第二个用例：它们可以用于在不同池之间以及在一个池内传输信息。这样，你可以展示你正在接收来自同一组织同事的信息。此类信号启动事件的示例可能是
  **Payroll transfers confirmed**。


  如前所述，信号的行为与消息非常相似，因此以信号为触发器的中间事件既可以是捕获型也可以是抛出型，在边界事件的情况下，它们既可以是中断型也可以是非中断型。启动事件（包括与事件子流程关联的启动事件）和结束事件也是如此。


  _Figure 9.8_ 显示了各种信号事件的示例。假设信号 1、3、4、5、7 和 8 各不相同，我们以不同方式对它们做出反应。例如，**Signal 4**
  将导致我们中断 **Task 2**，而 **Signal 7** 将导致我们中断整个流程。


  ![](img/a4c90ee3d142c33743706d37c65779c2_301_0.png)


  Figure 9.8 – 信号事件


  ## 定时器事件


  现在我们已经讨论了消息和信号触发器，是时候讨论另一对孪生触发器：**定时器**和**条件**了。让我们从我们在 _Chapter 8_ 中已经了解的触发器开始：定时器。以时间为触发器的事件称为**定时器事件**。它们始终用时钟图标标记。


  说到时间，我们总是被动的（我们只能等待特定时刻，无法影响时间），因此图标仅出现在浅色填充的变体中。


  ![](img/a4c90ee3d142c33743706d37c65779c2_302_0.png)


  Figure 9.9 – 定时器事件：被动


  启动事件、流程流中的中间事件（显然，仅限捕获型）、中断型和非中断型边界事件，以及事件子流程的启动事件，对于定时器事件都是可能的。这些在 _Figure 9.10_
  中显示。


  当然，在此示例中，每个定时器事件都可以表示不同的时刻——例如，流程可能每个星期一早上启动（**Timer 1**）；执行 **Task 1** 后，我们等到中午（**Timer
  2**）；如果 **Task 2** 超过 1 小时（**Timer 3**），我们中断它，但在执行 45 分钟后（**Timer 4**），我们可以在不中断
  **Task 2** 的情况下做些事情，整个流程级别也是如此（**Timer 5** 和 **6**）。同样的方法也适用于我们将要讨论的其他事件。


  ![](img/a4c90ee3d142c33743706d37c65779c2_302_1.png)


  Figure 9.10 – 定时器事件


  ## 条件事件


  现在，让我们看看我们对定时器事件的了解如何应用于由条件触发的事件。**条件事件**，例如由时间触发的事件，仅以捕获（被动）形式出现。它们的图标始终是一张横线纸。


  ![](img/a4c90ee3d142c33743706d37c65779c2_303_0.png)


  启动事件（条件）


  Figure 9.11 – 条件事件：被动


  通过条件事件，我们可以展示我们的流程如何响应其环境中发生的事情。有许多情况可以使用条件。即使是规范中相当幽默的示例，涉及温度（很可能用于烹饪），我们也可以找到面向业务的案例，例如学校停课流程，该流程以启动事件
  **Temperature in the rooms where classes are held below 18 degrees Celsius/64 degrees
  Fahrenheit** 开始。


  条件也可以指库存（**Number of items in stock below the defined minimum**——如果我们要为公司提供的关键商品创建补货流程）、股票价格（**Stock
  price in market A lower than...** 用于所谓高频交易下的自动套利交易）以及许多其他方面。


  一般来说，如果有我们可以测量的东西，就可以添加条件来处理它。这使得流程能够响应广泛的事件，从我们引用的经典示例到更技术先进的案例，例如由 **Internet
  of Things (IoT)** 收集的传感器数据。


  与定时器事件一样，启动事件、流程流中的中间事件（捕获型）、中断型和非中断型边界事件，以及事件子流程的启动事件都可以是条件型。它们都在 **Figure 9.12**
  中显示。






  ## Escalation events


  The ability to describe error and exception handling is extremely important when
  modeling processes for automation. This allows us to specify what should happen
  if something undesirable occurs in the process so that we can handle it properly.


  Importantly, BPMN distinguishes two types of problems of different severity: less
  serious escalations and very serious errors (which we will cover shortly). An **escalation**
  is always indicated by an upward-facing arrowhead icon (which reminds me a bit of
  the _Star Trek_ insignia).


  Figure 9.13 – Escalation events: passive and active


  Events whose trigger is escalation can be both throwing and catching, but they have
  far fewer allowed options compared to the events we’ve covered so far. This is due
  to the nature of the trigger used to handle exceptions, such as a delay in a process
  that we need to inform someone about, the unavailability of a product, and so on.


  Therefore, escalation cannot be used for normal start events, but for intermediate
  events within the process flow, where it only occurs as a throwing event (it shows
  that the process is continuing, but something has gone wrong, and we need to handle
  this situation somehow). We can also throw an escalation in the end event and use
  escalation for interrupting and non-interrupting boundary events, as well as for
  both variants of event sub-processes. We can see all these options in Figure 9.14.


  Figure 9.14 – Escalation events


  It is worth noting a slight change in Figure 9.14 from the previous examples. Why
  do we have Sub-process 2 instead of Task 2? This is due to the nature of escalation,
  which is often used to inform a higher-level process that it needs to respond to
  something that happened (for example, a delay in a process, or an unusual process
  result that may require special handling).


  The example shown in Figure 9.14 could be extended by an additional diagram showing
  the content of Sub-process 2. Escalations 3 and 4 would be thrown (similar to how,
  in our example, escalations 1 and 2 are being thrown) so that we could catch them
  by boundary events attached to the border of Sub-process 2. This is because escalations
  should occur in "teams"—they must be thrown somewhere so that they can be caught
  and handled in a higher-level process.


  ## Error events


  As we know, escalations are used to describe situations when not all is lost, and
  the process can continue. However, there can be cases of severe problems in our
  process that do not allow the process to finish successfully. Error events are meant
  to provide handling for such situations. Error events have an easy-to-recognize
  and remember lightning bolt icon.


  Figure 9.15 – Error event: passive and active


  As you can see, just like it was the case for escalations, both throwing and catching
  error events are possible. However, error events have fewer options than escalations.
  This is because an error is something extremely serious, preventing the process
  from normal completion. That’s why there are no non-interrupting error events. Examples
  of situations where we could use error events are a critical IT failure that we
  cannot overcome, a big business problem such as failure to collect a payment from
  a customer’s credit card, or a lack of the item that the customer has ordered.


  The only type of throwing error event is an end event. If this end event were part
  of a diagram documenting the content of a sub-process, we would usually have a boundary
  event attached to this sub-process that would catch this error and provide some
  handling. For example, if our error was a failed payment, we could contact the customer
  and use an alternative payment method. We can also handle the error within the same
  diagram with an event sub-process. All these options are shown in Figure 9.16.


  Figure 9.16 – Error events


  Errors and escalations allow us to handle various problems with our processes. However,
  there are also additional options for handling emergencies.


  ## Compensation events


  Many people happen to do something in life that they regret and wish they could
  undo. While this is not always possible in relationships, there is a way to do it
  in business processes with **compensation events** and **compensation activities**.
  Compensation is symbolized by an icon commonly used in music players for rewinding.


  Figure 9.17 – Compensation icons: passive and active events and activities


  As you can see, compensation events can be both catching and throwing. Throwing
  occurs either as an intermediate event within the process flow or as an end event.
  Catching compensation can be a boundary event, or it can be the start event for
  an event sub-process, as shown in Figure 9.18.


  Figure 9.18 – Compensation events


  Compensation events have several unique features. These are visible in Figure 9.18
  and will be discussed here. First, since compensation is used to undo something
  that has already happened, we model it in a rather unusual way, so reading diagrams
  with compensations requires some preparation.


  For the so-called “sunny day scenario,” where everything is OK with our process,
  after performing Task 1 and Task 2, we would reach an end event, Normal end event.
  However, if we have determined that something is not right, we cannot finish the
  process normally, so we need to roll back something that has already happened in
  Task 1 (e.g., charging a customer account, setting a status in the system, saving
  data to a database, etc.), after which we need to throw appropriate compensation(s).


  Let’s start with a throwing intermediate event named Compensation 1. From the pure
  logic of the process, you can see that after this event, we go to the end event,
  where the token of our process instance can be consumed. However, since Compensation
  2 is also a compensation event, it will throw additional compensation, which will
  provide additional handling for this situation.


  Now, let’s look at a Compensation 1 boundary event, which is attached to the border
  of Task 1. This will help us understand the concept of undoing/reverting to a previous
  state. As you can see, next to Compensation 1, we have Task A, with a compensation
  marker. However, this does not look like the diagrams that we’ve covered so far.


  We can read it as follows: if we throw a specific compensation, it must be caught
  somewhere. Here, there is an exception to the rule, which states that boundary events
  can only “listen” so long as the element to which they are attached is active. This
  is completely different from compensation boundary events—they only start “listening”
  when the task or sub-process to which they are attached is completed. However, a
  compensation that is not a part of a normal flow does not follow the standard rules
  we’ve learned about so far. As you can see, there is nothing more after **Task A**.
  There is no outgoing sequence flow because it only shows what needs to be done to
  undo **Task 1**.


  Interestingly, **Task A** also has no incoming sequence flow! This is because it
  connects to the boundary event through an association relation—the same one that
  is used for attaching text annotations to elements of a process flow. However, this
  relation also has an arrowhead, indicating the direction of the flow.


  An important rule related to compensation events is that to undo specific process
  steps, you usually need to “call by name” their specific compensations. In our case,
  this was quite simple, but there may also be process diagrams in which we want to
  roll back many different steps. Does this mean we always need to throw many compensations
  in such situations?


  ## Cancel events


  Many people try to use cancel as a marker for an end event to signify, for example,
  the end of a process that occurred prematurely, such as a customer’s decision to
  cancel an order. **Cancel events**, however, are meant as a workaround for the problem
  of calling each of the many compensations separately. There are only two types of
  cancel events: the end event and the intermediate boundary event. Both have the
  icon of a rotated cross with dark and light fill, respectively.


  Figure 9.19 – Cancel events: passive and active


  However, cancel events always occur in tandem with a special type of sub-process:
  transaction. It can easily be recognized by its characteristic double-lined boundary.


  Figure 9.20 – Transaction sub-process






  A **transaction sub-process** 是用于标记流程中必须正确执行或必须撤销的部分的。顾名思义，我们可以将其用于银行交易或 IT（例如，数据库事务），但这只是众多示例中的两个。重要的是，如果附加到
  transaction sub-process 边界上的 cancel boundary event 被触发，其中我们已使用 compensation 定义了撤销能力的所有元素将被集体触发，而无需逐个调用它们的名称。


  ## Terminate events


  与 cancel events 类似，terminate events 也可能有点棘手，因为它们的名称似乎暗示与 BPMN 规范中不同的含义。**Terminate
  end event** 是具有此触发类型的唯一事件。该事件的标记是一个黑点。


  ![](img/a4c90ee3d142c33743706d37c65779c2_310_0.png)


  Figure 9.21 – Terminate end event: active


  通常，新接触 BPMN 的人会使用此类事件来强调流程结束。然而，terminate end event 还有其他含义。众所周知，标准 end event 会“消耗”进入它的
  token，但只要该流程实例中还有其他活跃的 token，实例就会继续存在。这种行为对应于我们最常见的业务需求：能够将流程划分为独立的路径并分别流转，只有当每条路径都结束时，我们才能认为整个流程完成。


  然而，有时我们可能会在流程中达到一种状态，继续进行其他活动已无意义。这时 terminate event 就派上用场了。当 token 达到此类事件时，流程实例内的所有其他
  token 都会被查找并移除。


  ## Link events


  现在是时候了解下一种（不寻常）的事件类型了。虽然我们迄今为止涵盖的其他类型的事件都与现实生活场景有明确联系，但 **link events** 仅用于导航目的。它们只能在流程流中作为中间事件使用。链接图标始终是一个指向右侧的箭头。不出所料，该箭头对捕获事件使用浅色填充，对抛出事件使用深色填充。


  ![](img/a4c90ee3d142c33743706d37c65779c2_311_0.png)


  Figure 9.22 – Link events: active and passive


  link events 的背后理念非常简单：在处理大型图表时，可读性是一个重要问题。在 2000 年代初期，当流程建模工具尚未像今天这样发达时，处理需要多于一张纸的图表可能会成为问题。即使在今天，对于包含许多元素和箭头的大型图表，也存在序列流相交的风险，这可能会让流程读者感到困惑，因为他们无法判断特定箭头通向何处。


  link events 使我们能够处理此类情况。它们允许将流程模型拆分为多个部分（每个部分都易于打印），并促进它们之间的导航，无论是数字形式还是打印形式。幸运的是，目前，体面的流程建模工具很少会在大型模型上出现问题，因此我们不再那么依赖
  link events。然而，还有一个额外原因：link events 允许我们避免序列流相交。与其绘制一条会与其他序列流交叉的长线（看起来有点凌乱），不如使用
  link events。


  Figure 9.23 展示了两个等效图表。在第一个图表中，流元素通过普通序列流连接（线条交叉处的桥接不是 BPMN 的一部分；这是 ADONIS 提供的功能）。在第二个图表中，我们有一对中间事件：A（抛出）和
  A（捕获）。


  ![](img/a4c90ee3d142c33743706d37c65779c2_311_1.png)


  Figure 9.23 – Using link events to improve the readability of big diagrams


