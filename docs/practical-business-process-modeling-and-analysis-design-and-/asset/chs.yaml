- '## 几点最后的想法


  在本书中，你有机会了解业务流程建模与分析如何支持数字化转型。本章对全书最重要的观点进行了总结。你还将发现一些进一步的想法，这些想法不仅能帮助你提升和实践流程建模技能，更重要的是，能为你的组织创造价值。


  在本章中，我们将涵盖以下主要主题：


  - 关键观点回顾

  - 你的下一步行动


  ### 关键观点回顾


  我们首先在第 1 章《通过流程建模赢得数字化转型》中讨论了流程建模如何支持成功的数字化转型。流程是运营卓越（这直接带来更好的财务结果）、有效性以及构建卓越客户体验的关键。良好的流程应当高效、有效（通常归功于流程自动化）、透明、灵活且合规。


  管理良好的业务流程可以为组织带来竞争优势，因为虽然竞争对手可以获取相同的技术，但复制有效的业务流程却是一项艰巨的任务。


  这是因为业务流程需要许多来自不同团队的人员协作，他们在流程中执行各种任务。如果没有流程模型，即使是同一组织内的人员也无法掌握流程及其所有依赖关系的整体设计。良好的流程模型不仅能促进沟通，还能支持流程分析和改进。


  虽然流程自动化已是一个非常流行的概念多年，但仍有许多领域需要数字化转型，因为许多高频流程仍未达到最佳运行状态。原因有多种。其中之一是，知识工作很难实现自动化（即使有
  AI 的支持）。许多人不理解流程理论，为工作选择了错误的工具，或者公司中待处理的流程太多，导致无法利用少数专家组成的自上而下方法来跟踪和自动化所有流程。在为你的组织寻找数字化转型驱动因素时，请考虑哪些主题最相关。你的流程管理越成熟，就越容易既改善客户体验，又使流程更高效（更透明、更快速、运行和变更成本更低）。


  流程模型展示了流程活动与资源之间的连接，提供对当前情况的共同理解，并帮助就未来解决方案达成共识。然而，我们在建模时需要考虑流程之外的方面，以更好地了解组织如何运作，并使智能流程能够利用
  AI。需要注意的是，不同的建模方法可以满足不同的需求。各种风格（例如，结构化流程、案例协作以及 IoT/机器人协作）根据复杂性和目的提供建模指南。GenAI 工具的采用已经通过从冗长描述中创建模型，或通过
  AI 支持的建模工具（例如 **ADONIS**（带 AI 助手）、Camunda 的 **Copilot** 或 **Lucidchart**）来帮助团队成员快速启动流程模型。例如，Camunda
  Copilot 的直观建议可转化为可操作的指导，提升质量并加速流程图的开发。这些 AI 驱动的建议提高了 BPMN 流程的准确性和效率，最终加速整体开发。使用这些建议可以加快流程模型的创建，节省时间和资源，同时向用户展示可能的艺术。


  流程建模的另一个新机遇领域涉及建模 AI 代理的交互，从而增强人力和机器资源。在不久的将来，自主代理将成为流程的主要控制器，管理动态交互并实时监控结果。能够掌握和可视化这些流程交互，可能决定
  AI 驱动的行动是否符合负责任 AI 政策或新兴立法的标准。AI 为流程建模带来的价值将取决于 AI 如何影响实际建模的流程，以及流程模型是代表未来设计，还是在结合流程和数据挖掘时，代表精确执行、执行中或事后的表现。最终，当
  AI 成为流程的控制管理者，从流程组件的动态组装和流程执行到监控流程结果并实时调整和补偿，你的流程架构将提供一组边界，确保人类仍然掌控其端到端流程。


  你从第 1 章的主要收获是：首先识别数字化转型背后的业务目标，以便明确你想要实现什么以及它如何影响你的流程。


  在第 2 章《成功数字化转型的支柱》中，我们探讨了数字化转型。这是一个复杂的话题，没有单一的真理来源或公认的定义。然而，许多定义强调，这不是为了使用技术而使用技术；相反，数字技术旨在改变组织的运作方式，为客户创造价值，并增强或引入新的业务流程。我们认为尤其重要的是数字化转型的战略适应性方面。


  描述现代组织具有挑战性，因为它们是不断演进的多维系统，包含业务、流程和数据架构、客户旅程、价值创造等多个维度。许多组织面临的挑战之一是缺乏定义明确或最新的流程设计，这通常会导致次优结果。


  数字化变革有几种场景：自上而下、基层驱动、旧系统现代化、由并购（M&A）触发，以及偶然发生。创建良好的数字化变革愿景对规划非常有帮助。确保员工参与，让他们感觉自己帮助定义了愿景，而不是愿景被从上往下强加。


  数字化转型计划的规划应涵盖持续适应性、由强大的自学习重点支持的劳动力变革、生成和管理知识产权、在交付短期目标的同时进行长期规划、定期计划更新、管理规模和范围，以及牢记增长。


  你从第 2 章的主要收获是：始终兑现数字化转型计划的短期目标，以建立可信度并保持长期成功所需的动力。


  第 3 章《驱动竞争优势的 BPM 飞轮》帮助你理解了数字化转型与流程管理之间的关系。如果不关注业务流程就启动数字化转型计划，将只能产生部分结果，几乎无法扩大成功规模并转型整个价值链。


  业务流程管理不仅有助于降低成本、提高生产力和质量，还能提升客户满意度，并使流程与组织战略保持一致。它不是关于开展一次性计划，而是关于建立持续改进和流程思维的文化。


  提高组织的流程成熟度需要时间。请记住，你需要时间来交付专注于数字化变革的项目的成果，并在组织中建立知识和技能（例如，公民开发者是指将自动化流程的人员，同时也包括所有员工的通用
  BPM 知识，以便他们理解基本的 BPM 概念）。从较小的成功开始，再进行更复杂、更具挑战性的项目，有助于建立动力，这些项目可以创造大规模的结果。


  启动 BPM 计划有许多理论框架。在第 3 章中，我们强调了以下框架：定义范围和目标（了解过去的流程相关计划是什么以及它们创建了哪些工件非常有帮助；在购买软件许可证之前，投资培训团队也是个好主意），识别改进的差距和机会（流程架构在此至关重要，可用于识别改进领域以及痛点和收益；选择合适的业务领域开始也非常重要），制定商业案例和路线图，沟通并统一愿景和战略（你可以从小处着手，稍后添加更复杂的方法，以确保有多种方式来传达你正在做的事情；高层管理对
  BPM 的支持将非常有帮助），以及建立变革的治理和角色（流程所有者、BPM 团队，以及适当的工具、手册和框架）。






  ## A Few Final Thoughts


  即使 BPM 计划启动，它仍然需要高层管理的支持和认可才能生存。在推销 BPM 时，确保你所提议的内容对其他人来说既相关又有说服力，符合公司文化，与战略保持一致，并且足够容易理解（而不至于过于技术化）。展示实践价值的快速胜利非常有帮助。


  说服不仅管理层（赞助商、业务领导者和流程负责人），而且说服计划中涉及的其他人（例如公民开发者）也非常有帮助。考虑你希望参与你计划的人的动机是什么，他们担心什么，以及他们需要知道什么才能有效地参与。


  你还应该投资于你在流程设计和发现、实施（这包括自动化）、监控和改进方面的 BPM 专业知识，以及演示、讲故事和公开演讲等咨询技能。


  你的 BPM 计划需要交付可衡量的结果和成果。跟踪与组织战略保持一致的 KPI（并将其传达给相关人员！）将帮助你证明 BPM 转型的好处。


  由于一个 BPM 计划只是一个开始，考虑构建一个可以演变为 BPM **卓越中心（COE）**的 BPM 实践社区是有帮助的，该中心可以通过跨越业务、流程和技术的专家服务来促进和加速
  BPM 转型。这个团队将花费大量时间与其他 BPM 实践者群体（例如公民开发者 COE）合作。


  创建 BPM 指南（即实施 BPM 的参考指南）也可能有帮助，它可以通过教育业务团队并提供一套最佳实践来帮助你避免许多常见错误。这应该降低陷阱的风险，例如 BPM
  计划与组织战略不相关联、未能交付可衡量的结果/收益，或者缺乏初始快速胜利。


  正如我们需要 KPI 来展示 BPM 计划的结果一样，KPI 也可以帮助衡量 BPM（或公民开发者自动化）的成功并确保资金。


  虽然“一统天下的平台”可能很有吸引力，但你可能需要使用几种不同的数字流程自动化工具和平台。每种工具对 BPM 标准（如 BPMN、DMN 和 CMMN）的支持可能有所不同；但是目前，BPMN
  是流程分析的最佳选择，并作为描述流程工作的通用语言。此外，使用 BPMN 可以更轻松地治理你的流程（理想情况下使用集中式和标准化的存储库）并编排由各种技术驱动的流程。


  在选择流程自动化工具时，你不仅需要考虑技术能力，还需要考虑可扩展性、对工作可预测性的理解、实现和跟踪 ROI 的能力、供应商与公司之间的文化契合度以及人才的可用性等方面。


  对于许多这些主题，我们需要企业流程架构来做出明智的决策，理想情况下由流程挖掘提供的洞察支持。


  避免启动 BPM 计划时常见错误的最佳方法是遵循一种方法论，以确保我们没有跳过必要的步骤。此外，从有志于成为实践者的人的错误中学习（例如只关注技术或未能将方法适应组织文化）至关重要。


  你从 _第 3 章_ 中的主要收获是，BPM 作为一门管理学科不仅可以帮助你提升业务流程的绩效、效率和敏捷性，还能为数字化变革计划奠定坚实基础，最终引导你的组织实现数字化转型。


  _第 4 章，长期趋势及其对你工作的影响_，涵盖了一个非常重要的主题：所有这些事情如何影响你的职业生涯？数字化转型不仅影响你的组织，也影响你的工作。由于你不能总是依赖雇主提供的培训，因此投资于你的技能非常有意义。


  数字化转型和 BPM 是广泛的领域，但幸运的是，你不需要知道一切才能开始。获得关键概念的基本理解就足够了，这样你就知道足够多的内容来避免因知识薄弱环节而经常造成的昂贵错误。


  虽然软件供应商提供许多功能性学习材料，但拥有更广泛、更具业务导向的视角（来自学习多个来源，而不是仅仅依赖单一软件产品或供应商）是有帮助的。没有任何公司拥有 BPM
  作为一门科学或业务实践的所有权。业务导向也是根本性的。通常，在数字化变革计划中，人们缺乏共同愿景，因为每个人对组织基础构建块（即业务流程）的理解都不同。这部分是因为业务流程是无形的并且在不断演变。


  业务流程至关重要，因为它们有助于提高运营效率、创造价值、将战略转化为行动、具有适应性，并允许组织持续改进。BPM 还引入了以流程为中心的组织视角，提供了一个考虑流程、人员、技术、文化和战略之间交互作用的整体视角。使用标准以某种正式方式对流程进行建模，以正确理解这些相互依赖关系和组织，这是有益的。


  除了了解数字化转型和 BPM 之外，你还应该意识到其他影响 DTX 和 BPM 的重要趋势，例如代理 AI、云计算、机器人流程自动化、流程挖掘等。它们的影响是巨大且非线性的，因此你应该预期变化可能比我们预期的发生得更快，未来将与现在截然不同。这些趋势还相互交互和影响，为更高级的流程管理创造了新的可能性。此外，它们在市场上创造了根本性的转变和转型。这可能对你的职业生涯构成风险，但如果你知道如何在这个新环境中创造价值，这也将是一个巨大的机遇。


  ## A Few Final Thoughts


  你需要学习的一些技能（例如 BPM 和变革管理）可以被视为你技能组合的核心基础。它们不会经常发生根本性变化（尽管 BPM 在过去经历过几次重大变化，例如从基于纸质的流程转向数字化流程，以及自动化技术的普及化）。在此基础上，你可以添加更多技术技能，这些技能可能需要持续学习才能保持相关性。因此，你还应该学习如何随着市场变化更新你的技能。最后，记住要跟上最新趋势，以识别你应该获取或更新的相关技能。


  你从第 4 章中的主要收获是，BPM 概念是你其他技能的坚实基础，并将帮助你在市场上保持相关性。


  第 5 章，业务流程 101，为你提供了 BPM 的必要理论。关于流程，你需要记住的最重要的事情是什么？业务流程对于创造价值至关重要，这对每个组织都很重要。建模（记录）流程可以对流程步骤及其与其他流程和资源的交互方式达成共同理解，以创造所需的结果，帮助组织实现其目标。


  通过管理流程，组织可以提高绩效、带来秩序、改善运营卓越性（以及利润！），并建立持续改进文化。管理流程还支持商业模式的变化。通过跨职能协作，BPM 促进公司转型，而这还不是全部！有效管理其流程的组织还可以增强合规性、提高客户体验并提升工作场所满意度。


  跨职能流程的概念对于专业 BPM 非常重要。为了能够有效地管理和改进流程，必须对流程生态系统有更广泛的视角，考虑与其他流程、输入、输出以及支持和指导流程的元素之间的连接。一个好的流程模型应该回答我们可能对流程提出的关键问题，并促进与组织相关目的（例如流程改进或流程自动化）的沟通和知识转移。对于跨越组织边界的流程来说，这一点至关重要。在这种情况下，当人们没有全局图景时，他们可能会创建范围有限的点状解决方案。这会在外部造成多个问题，从而在内部带来混乱。


  你从第 5 章中的主要收获是，流程是组织的支柱。当核心流程发生变化时，它们会影响组织的方方面面。


  在第 6 章，建立流程架构中，我们继续探讨流程管理的话题，这次重点关注流程架构。由于流程是具有许多相互依赖关系的非常复杂的实体，使用比带有名称的扁平列表、简单文本文档或电子表格更多的东西来管理它们是非常有帮助的。流程架构是促进流程端到端视图、理解依赖关系以及避免由孤岛思维或缺乏更广泛视图引起的问题的完美工具。






  Process architecture categorizes processes into groups that help understand their
  role in value creation (i.e., do they create value or provide guidance or resources
  needed for building value). It also provides a hierarchical view of the processes,
  allowing for drill-down from the top-level overview process landscapes to the detailed
  diagrams showing all the steps of each process. Process architecture can also store
  many process attributes that aid in their management, such as owner assignments
  or information that supports analysis, including which processes are best suited
  for automation. Depending on the organization’s experience and expectations, process
  architecture can be built using tried-and-tested standards such as the APQC Process
  Classification Framework or can be created internally.


  Your key takeaway from Chapter 6 is that building process architecture will help
  you with other process management activities, both related to detailed process modeling
  (as it shows you which processes need to be documented in more depth) and to implementing
  and running organization-wide transformation (because it helps understand the impacts
  and plan the scope and order of required work).


  Chapter 7, Process Modeling Notations, provided an overview of methods for process
  modeling. There are several approaches to creating detailed process diagrams, each
  utilizing different notations to visually represent process steps, various flows,
  and other crucial information. In addition to well-known flowcharts, the Business
  Process Model and Notation (BPMN) can be employed to document processes effectively.
  This method not only enhances a common understanding and collaboration between business
  and IT users but also supports more advanced documentation, analysis, improvement,
  and automation of processes. Your key takeaway from Chapter 7 is that the BPMN standard
  remains the preferred approach for those just starting their process management
  journey. But remember that you can start with a reduced set of the most popular
  and useful shapes instead of learning and using all elements from this notation.


  Chapter 8, BPMN – What You Need to Know, and Chapter 9, Advanced BPMN, were all
  about various aspects of BPMN. BPMN allows the creation of both simple diagrams
  for process documentation and more advanced ones for process analysis and automation.
  For those interested in creating simple diagrams, learning BPMN can be as easy as
  learning a handful of intuitive shapes.


  For those needing more, BPMN also allows additional object types and attributes
  that add more precision to process diagrams and enable the automation of such diagrams.
  Additionally, BPMN is a standard with defined rules of what is allowed and what
  is not, so if you are using a tool with full support for the standard, you can not
  only share your diagrams with other tools using common XML-based standards but also
  check the validity (i.e., whether all the rules of BPMN are maintained) and ideally
  well-formedness of your diagram with one click.


  Your key takeaways from Chapters 9 and 10 are that BPMN is a compelling method of
  documenting processes, but learning it does not have to be tough. Start with the
  basics and only use elements that are helpful and easy for your colleagues to understand.


  ## A Few Final Thoughts


  Chapter 10, Measuring the Business Value of Process Transformation, helped you understand
  how to approach process management initiatives to make sure they provide value to
  the organization. Modeling, improving, and managing processes can benefit the organization
  by enhancing the bottom line, improving customer and employee satisfaction, and
  many other key metrics. The best way to start with BPM is to build a solid business
  case focused on value, ensure strategic alignment, use measurements in continuous
  improvement, ensure that BPM benefits are also visible to customers and employees,
  and establish a foundation for future digital innovation.


  You can use several metrics for measuring business value: financial, operational,
  customer-focused, and employee-focused.


  These are your key takeaways from Chapter 10: BPM can bring many benefits to your
  organization, but if you want BPM to thrive as a new way of working, your responsibility
  is to deliver results and demonstrate how those results bring value to the organization.


  In this book, we have explored many ideas for implementing changes within your organization.
  As we conclude this chapter section, we want to share some final thoughts on processes
  and their value.


  Processes are one of the most commonly discussed concepts in business; however,
  many people still do not fully understand their true meaning or role within the
  scope of enterprise architecture. Terms such as capabilities, process optimization,
  and improvement are used loosely without aligning teams on their meaning. While
  process management may not seem as attractive, viral, or exciting as other current
  topics discussed within the enterprise, it is crucial. Process management forms
  the foundation for effectively transforming the organization and achieving its strategic
  vision. While the business strategy defines goals, competitive positioning, and
  value proposition, process architecture translates these into operational workflows.
  Well-developed process architectures provide the structure required to deliver strategic
  programs (including AI-enabled automation initiatives) and drive successful execution.


  Changes to core processes are significant because nearly every aspect of the company
  must adapt when these processes change. Moreover, process management is essential
  for operational excellence, driving continuous improvement, and harnessing innovation.
  It enhances performance and quickly brings order to chaos. By viewing operations
  through the lens of the business process lifecycle, we can accurately identify errors,
  exceptions, and process gaps rather than perceiving the operational world as an
  unruly Wild West.


  In modern organizations, artificial intelligence (AI) and automation significantly
  improve process capabilities. Leadership should make technological investment decisions
  based on a clear understanding of process architecture, ensuring that the right
  areas of operations are targets for automation and that business is ready to change
  how the work gets performed.


  Moreover, process models provide a blueprint for work that everyone can easily understand,
  making daily tasks simpler and changes more manageable. BPMN diagrams can serve
  as practical communication tools and can be integrated directly into process automation
  platforms, such as Pegasystems’ GenAI Blueprint. This integration allows for the
  automatic generation of enterprise case applications. Other vendors, such as Camunda,
  Bonitasoft, Microsoft Power Automate, Appian, and Bizagi, support direct modeling
  or importing of BPMN models, which helps accelerate development and shorten deployment
  times.


  So, why should people care about processes? When business processes run smoothly,
  they enhance the client’s experience and improve employees’ quality of work life,
  enabling us to focus on higher-level and more enjoyable tasks. By adequately describing
  your process layer, you open better opportunities for both life and work.


  ## Your next steps


  Through this book, you had a chance to learn a lot about the fundamental concepts
  of BPM, as well as about process modeling with BPMN. However, you should always
  remember that models are a great communication tool and a wonderful enabler, but
  they need to be complemented by other things to create real value. In this chapter,
  we will share with you a few suggestions for further areas closely linked with BPM
  and process modeling.


  Pick those that look interesting and relevant for you and your organization and
  combine them with the knowledge and skills from this book for even better results.


  If the concept of processes as vehicles for value creation resonates with you, lean
  management could be a valuable area for further study to help you minimize waste.
  Additionally, some individuals find that Six Sigma offers useful methodologies aimed
  at reducing errors and variability.


  To ensure the success of your organization’s Business Process Management initiatives,
  consider exploring topics such as Change Management, Center of Excellence (CoE)
  Playbooks, and Evangelism. Following a certification path, such as the OMG Certified
  Expert in BPM (OCEB), can also be beneficial. Engaging with peers in professional
  organizations for practitioners, such as the Association of Business Process Management
  Professionals (ABPMP), may also provide valuable insights.


  As highlighted in this book, process automation is a critical topic. Depending on
  your organization’s needs and maturity, you might want to investigate traditional
  process automation using Business Process Management Systems (BPMS) tools or explore
  more advanced options such as Robotic Process Automation (RPA), low-code platforms
  that support citizen developer initiatives, process and task mining, or tools that
  unify various automation solutions to orchestrate end-to-end processes. At the time
  of writing this chapter, a term introduced by Gartner, Business Orchestration and
  Automation Technologies (BOAT), is widely recognized as a key concept in for this
  rapidly evolving category of technologies. These tools facilitate autonomous automation
  and integrate elements such as human tasks, AI agents, RPA bots, API integrations,
  AI platforms, and more.






  ## 最后的想法


  在本书中，我们旨在向您介绍一个可能看似熟悉却在很大程度上尚未被探索的世界。我们希望能够拓宽您对这一领域的理解，根据我们的经验，这个领域往往被过度强调、误解或过度理论化。有些个人和公司对流程科学和
  BPM 的实际应用充满热情，他们的财务结果反映了这种承诺。不幸的是，这些声音往往被忽视，隐藏在 IT 或业务运营的领域中。他们不懈努力推动结果，直到达到无法忽视的关键规模。他们的努力为数字化转型创造了转折点，但这些声音往往需要数年而非数月才能获得可见性和认可。


  随着 AI 与商业世界的融合，了解如何为 AI 自动化实践奠定基础将比过去更加关键，需要本书中描述的基础知识。预计未来几年大型公司中 AI 自动化的密度将显著增加。根据麦肯锡的一份报告，92%
  的公司计划在未来三年增加 AI 投资。然而，只有 1% 的公司认为自己在 AI 部署方面是“成熟”的，这意味着完全集成到工作流程中并推动重大业务成果（https://www.mckinsey.com/capabilities/mckinsey-digital/our-insights/superagency-in-the-workplace-empowering-people-to-unlock-ais-full-potential-at-work?form=MG0AV3）。


  世界经济论坛的一项研究还表明，41% 的公司计划到 2030 年因 AI 自动化而减少员工数量。这些趋势表明，随着公司努力简化运营并提高效率，AI 自动化的密度很高。


  AI 的经济影响也很大，预计到 2028 年，全球企业将在 AI 解决方案上花费 6320 亿美元，到 2030 年将占全球 GDP 的 3.5%（https://moneycheck.com/wef-study-41-of-companies-plan-ai-related-job-cuts-by-2030/?form=MG0AV3）。


  正如您所料，这个领域经常发生变化和突破，与之前讨论的主题不同，后者随时间变化较慢。因此，虽然前面的章节包含了推荐书籍的进一步阅读部分，但我们建议查看本书的 GitHub
  仓库，以获取最新的书籍集合和作者推荐的材料：https://github.com/PacktPublishing/Practical-Business-Process-Modeling-and-Analysis/tree/main/Chapter11。


  如果您想了解 BPM 热门话题的概览，您可能也会喜欢 Zbigniew 的博客自 2016 年以来发布的关于 BPM 技能的一系列博客文章：https://bpmtips.com/category/bpm-skills/。


  AI 自动化将在大型公司中变得越来越普遍，改变它们运营和管理员工及流程的方式。您是否希望为这波创新做好准备并具备能力，将本书中提到的通用技能加入您的工具箱，以重塑就业市场？我们希望如此。


  我们想表达对您关注的感谢，并祝您在 AI 驱动、流程主导的转型中取得成功。我们希望本书分享的知识能帮助您避免不成功的举措和受挫的自尊。愿它加速您的职业发展，为您的组织创造价值，同时为您的客户、社会和世界带来积极的变化。


  满怀感激，


  BPM 实践者和作者：Jim、Zbigniew 和 BJ。


