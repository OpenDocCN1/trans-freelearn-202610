  \ 和 **Kb2**）。这些流程也可以以更详细的 BPMN 图表形式描述，以便您可以深入了解更多信息。\n\n请记住，您可以在不使用前缀的情况下创建流程架构。前缀可能很有帮助，因为它们立即显示我们的流程属于哪里，并使父子关系更清晰，这通常非常方便。这就是为什么我在这一节中使用它们；它们使多级流程架构的解释变得容易得多。\n\
