  focus on automation and customer excellence, intelligent business processes, business
  modeling, business process management technologies, process collaboration for knowledge
  workers, process intelligence/optimization, data management, AI, IoT, and leveraging
  business applications in processes. Jim is also one of the authors of _BPM: The
  Next Wave_.


