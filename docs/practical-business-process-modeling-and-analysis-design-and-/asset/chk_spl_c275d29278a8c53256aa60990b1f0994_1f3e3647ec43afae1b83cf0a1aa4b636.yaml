reviews:
- 'no': 5903
  overturn_probability: 0.98
  alternative: 书末索引（Index）标题，属于正文之后的附录性元数据，不应作为正文新章划分
  counter_evidence:
  - 该行内容为“## 索引”，紧随其后的 5905 行至 6673 行全部为按字母顺序排列的索引条目（如“5W1H 模型”、“### A”、“### B”等），每行带页码，典型的书末索引结构，而非正文章节标题。
  - 索引条目中大量出现“### A”、“### B”等仅为字母分组小标题，且条目末尾均带页码（如“157, 158”、“64-66”），符合索引特征而非章节特征。
  - 文本末尾（6625 行起）出现“Why subscribe?”、“Other Books You May Enjoy”、“Packt is searching
    for authors like you”等出版社营销与版权页内容，说明 5903 行已位于正文结束后的附录/索引区域。
  - 规则虽提及“文末索引也划分为一章”，但此处“索引”仅为整本书的索引入口标题，若将其作为独立章节，会导致后续数百行索引条目无章可属，或被错误拆分为多个章节，违背分章的实际意义。
  keep_split: false
