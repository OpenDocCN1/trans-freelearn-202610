- pgno: 130
  md: '# # Understanding the importance of digital change topics


    Why am I emphasizing the importance of familiarity with BPM science for people
    who drive digital change programs?


    Throughout my career, I have collaborated with numerous seasoned leaders, architects,
    and program managers who, thanks to their extensive experience, could easily helm
    a large-scale project in a different industry, such as building construction,
    purely through their leadership abilities. These leaders have exceptional organizational
    and leadership skills, and irrespective of the industry, a project remains a project;
    scope, risks, and issues hold the same significance.


    Transforming physical objects is different from changing business models or operations
    because the outcomes in the digital world are less tangible. Digital business
    can be abstract, especially with software, and involves navigating complex, multi-dimensional
    concepts. Unlike a physical object such as a brick, the unit of work in digital
    business can vary widely in meaning among different groups. This field requires
    metaphors, effective metamodels, and various diagrams to illustrate workflows,
    systems, and outcomes.


    When you present a brick to the construction crew, an inspector, or the homeowner,
    they all perceive the same object. However, if you show a business process or
    requirement to a business analyst, process architect, engineer, or citizen developer,
    their interpretations often differ. This variance is influenced by their individual
    experiences, cognitive abilities, the tools they use to document requirements,
    and their capacity to connect relevant information. When emotional and human factors
    are considered, it becomes clear why over 60% of digital transformation initiatives
    fail. Frequently, our stakeholders do not share the same vision.


    For the sake of an example, if you are building a fence, you will most likely
    use bricks or wooden planks to illustrate the design of your construction.


    ![](img/a4c90ee3d142c33743706d37c65779c2_130_0.png)


    Figure 4.1 – Farm fence in Watlington, Norfolk (“Farm fence in Watlington” by
    Lewis Collard, licensed under CC BY-SA 3.0)'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'Bricks or planks have multiple properties; it is possible to join them into
    walls or larger structures surrounding land or houses. In the world, there are
    many substitutes for clay bricks; for example, in Ireland, many walls are built
    with natural stone, resulting in beautiful landscapes in addition to their functional
    purpose.


    A small brick can be the foundation for an enormous structure. For instance, the
    Malbork Castle in Poland, the world’s largest brick castle, was constructed from
    clay bricks by the Teutonic Order in the 1400s


    ![](img/a4c90ee3d142c33743706d37c65779c2_131_0.png)


    Figure 4.2 – Malbork Castle, Poland is the largest brick castle in the world


