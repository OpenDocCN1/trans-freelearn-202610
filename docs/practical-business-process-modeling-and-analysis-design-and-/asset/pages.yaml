- pgno: 93
  md: 'As shown by multiple examples of people in the field, when applied correctly,
    the BPM skill set can lead to bigger and better things in one’s career. In a broader
    sense, think about investing in BPM as taking the insurance policy to ensure that
    such newly created jobs will stay within your company and will not end up cannibalized
    by professional services companies, each wanting to take a piece of the program
    pie that was started and nurtured by you. Your hard work and evangelism can translate
    into significant profits for service vendors if your company loses its grasp on
    the skills required to bring everything home.


    If you are in a leadership role, don’t lose sight of what’s at stake. You will
    want to invest in BPM to raise the competitiveness of your workforce and benefit
    local communities where you do business. There are many examples of transformations
    that hollowed out the internal job market, putting employees at a disadvantage
    after digital change programs started taking off quickly, one after another. Many
    such scenarios usually go hand in hand with digitization efforts performed with
    proprietary and hard-to-learn low-code DPA platforms.


    Ask yourself the following questions:


    +   - If BPM and digitization are so critical to my employer’s strategy, why is
    it that third-party software vendors own and drive most projects within my company?
    Is any “secret sauce” knowledge required to run these programs and platforms?

    +   - What’s so special about the knowledge and technology powering our business
    processes that it requires a regular contingent of long-term consultants supporting
    these systems all the time?

    +   - How challenging is learning and experimenting with the vendor’s low-code
    platform?

    +   - How aligned is the platform with the process-oriented view of the enterprise?
    Are we going to create technical debt quicker, or will our solutions align with
    the enterprise process architecture breaking the siloes and streamlining operations?

    +   - With proper training and some support, can I successfully lead BPM transformations
    and subsequent digital change initiatives on my own?

    +   - Does the platform or consulting company share the same vision of empowerment
    and democratization of DPA?

    +   - Is the same training set available to users, customers, and partners?


    # ## Identifying the gaps and opportunities for improvement


    This step involves assessing and analyzing the inventory of processes and creating
    the initial heat map of your business. Try to determine the state of the enterprise
    process architecture across the enterprise. Can we see one emerging?


    Can we identify areas for improvement, enumerate benefits and business pain points,
    and define strategic goals and transformation drivers in both business and technology
    domains?'
  merge: -1
  img_proc: true
