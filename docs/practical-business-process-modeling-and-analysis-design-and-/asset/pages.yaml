  md: '# # Long-Term Trends and the Impact on Your Job


    As of 2025, there is a significant number of bite-sized training courses that
    offer completion certificates. However, be cautious when investing your time in
    classes led by individuals attempting to ride the wave of hyperautomation buzz.
    Occasionally, you may encounter classes that are either very generic or taught
    by venture capitalists seeking attention in this booming market. Many trainers
    who teach DTX and BPM often lack practical experience. An effective coach or trainer
    should have participated in 30 to 50 programs or projects before instructing others.
    Given the considerable hype around hyperautomation, it is crucial to verify the
    credibility of the information before accepting it.


    Zbigniew Misiak at `http://bpmtips.com` frequently updates a list of high-quality
    free online resources for those seeking cost-effective BPM training. He dedicates
    substantial time each year to researching available BPM classes, and the insights
    shared on his blog can be invaluable for practitioners and organizations. _BPM
    Tips_ has emerged as a global, vendor-independent source of information, raising
    awareness of BPM’s value proposition as a practice. If free training is available
    on any BPM subject, you will likely find it on `bpmtips.com`.


    In addition to the various free resources, many software providers now offer complimentary
    online DTX training. Nevertheless, despite their positive intentions, these courses
    often dive into technical and implementation aspects without providing adequate
    foundational knowledge. Typically, vendor-specific training tends to focus on
    promoting their all-in-one platform solutions while overlooking the underlying
    reasons for DTX. Most software vendors I have encountered have rushed through
    their technical curricula, understandably motivated by the desire to drive the
    adoption of their platforms.


    It’s important to understand that adopting a platform does not guarantee success
    in digital change or DTX. If you choose to begin your learning journey with these
    resources, be aware that there may be hidden costs down the line. Ultimately,
    you may end up focusing more on learning about the tools rather than addressing
    the practical business challenges that necessitate the use of these platforms.


    I greatly enjoy the buffet-style and modular training courses offered by Microsoft
    Learn: `https://learn.microsoft.com/en-us/training/browse/`. Microsoft provides
    flexible training career paths that can be tailored to your professional experience,
    interests, products, or desired career directions. This approach enables you to
    create a custom curriculum without being limited to a specific job description,
    which may not align with your future roles. However, it’s worth noting that Microsoft
    Learn does not cover DTX topics in detail and you will need to complement your
    studies by reading blogs by a wide ecosystem of Microsoft’s **Most Valuable Professionals
    (MVPs)**. There are plenty of interesting blogs and podcasts to choose from. I
    highly recommend Mark Smith’s (`nz365guy`) _Microsoft Innovation_ podcast running
    for over 8 years. Mark features expert guests, including thought leaders, industry
    innovators, and community specialists, who are redefining the world with advancements
    in AI and cloud technologies. His website can be found at `http://www.nz365guy.com`.


    After spending considerable time reviewing and comparing various training programs,
    I observed that many vendors design their courses to prepare students for specific
    roles. In my experience, this approach can sometimes limit job seekers’ opportunities
    in the market. Throughout my career, I have preferred a skills-based approach
    over a role-based one, ensuring that my focus on digital technologies did not
    confine me to a particular niche within vendors’ sales strategy.'
