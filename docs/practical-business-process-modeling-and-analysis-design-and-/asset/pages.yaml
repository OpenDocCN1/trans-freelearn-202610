- pgno: 132
  md: 'We suggest that you regard the metamodel of a _business process_ as this fundamental
    building block.

    However, there are several caveats to consider:


    +   - Enterprise business processes, unlike fences or castles, are constantly
    changing and require flexibility.

    +     Some are still hiding in data logs, work instructions, or as tribal knowledge
    exercised daily.


    +   - A business process applies to a transformation of the unit of work, so you
    need to be able to

    +   describe both the work and the business processes that can be used to transform
    your work. I

    +   worked with many architects from different companies during my career, and
    only a handful

    +   could explain what work was using plain language. The number of architects
    who knew how

    +   to connect the unit of work to a process-driven business transformation and
    then launch one

    +   into motion is even smaller. This is caused by too many software applications
    designed in an ad

    +   hoc fashion, the lack of a uniform approach to the practice of enterprise
    **Business Architecture

    +   (BA)**, and not pushing enough information about BA concepts from the Ivory
    Towers of EA

    +   into the trenches of the enterprise. In that part of the company where pain
    points are lived daily,

    +   projects are executed without delivering their full value and people spend
    time continuously

    +   fixing and improving—the part of the company where we operate daily.


    +   - Let’s consider that the term _business process_ can be defined differently
    by the marketing department,

    +   engineering team, process architecture, and program manager. It is the same
    business process,

    +   each time defined using different visuals, words, and meta models. All these
    folks may not see

    +   the BPMN diagram underneath, which gets into the nitty gritty of work. There
    is a BPMN,

    +   **Case Management Model and Notation (CMMN)**, or **Decision Model and Notation
    (DMN)**

    +   diagram (or a few of them) for each business process discussed in the universe.
    Sometimes, it

    +   just takes a bit of effort to discover it.


    Let’s switch gears for a second now to the task of envisioning the blueprint of
    our company. What is

    the equivalent of the _brick, stone, or wood plank_ that can be used to represent
    our business?


    Is it a business process? No, because if you know something about business process
    naming, those are

    represented by a verb (a thing that’s being _done_). What we are looking for is
    the item on which the

    business process applies its transformation magic, converting inputs into business
    outputs.


    To quote the wisdom of Copilot, the _business process emerges as a foundational
    thread in the intricate

    tapestry of organizational dynamics_.


    # Defining business process


    A **business process** represents a sequence of interrelated activities or tasks
    that collectively achieve a

    specific organizational goal. These processes span various functions, departments,
    and roles within

    the organization.'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'Examples of business processes include **order fulfillment**, **inventory management**,
    **customer onboarding**, and **financial reporting**. It’s important to consider
    the role of verbs in naming conventions for these processes. Let’s take some time
    to discuss the characteristics of business processes to clarify the definition
    further:


    +   - **Fundamental role of business processes:**


    +   - **Operational efficiency**: Business processes streamline operations, ensuring
    that work is executed consistently and efficiently. They minimize redundancy,
    reduce errors, and enhance productivity.


    +   - **Value creation**: Processes directly contribute to value creation for
    customers, stakeholders, and shareholders. Whether it’s delivering a product,
    providing a service, or managing resources, processes drive outcomes.


    +   - **Alignment with strategy**: Effective processes align with the organization’s
    strategic objectives. They translate high-level goals into actionable steps, ensuring
    that everyone moves in the same direction.


    +   - **Adaptability and agility**: Well-designed processes are adaptable. They
    can evolve to accommodate changes in technology, market conditions, and customer
    preferences.


    +   - **Continuous improvement**: Organizations thrive when they embrace a culture
    of continuous improvement. Business processes provide a canvas for optimization,
    innovation, and refinement.


    +   - **Process-centric view:**


    +   - Some schools of thought emphasize a **process-centric view** of organizations.
    Here, processes take center stage, and organizational structures adapt to support
    these processes.


    +   - In this paradigm, roles, hierarchies, and functions exist to serve the efficient
    execution of processes. The focus shifts from silos to seamless flow.


    +   - **Holistic perspective:**


    +   - While business processes are fundamental, they don’t stand alone. They interact
    with other organizational elements, such as **people**, **technology**, **data**,
    **culture**, and **strategy**.


    +   - The synergy among these components creates a resilient and thriving organization.'
  merge: -1
