- pgno: 244
  md: 'Figure 8.24 shows a comparison between a diagram in which we used an exclusive
    gateway, a diagram

    in which we used an OR gateway, and a diagram in which we used only conditional
    flows to split the

    paths. Naturally, these aren’t fully equivalent diagrams because, for the exclusive
    gateway, we take

    the first path whose condition is true, while for the OR gateway and conditional
    flows, we check all

    conditions to determine which one is valid. In the first diagram, we can immediately
    see that only one

    of the conditions can be true. In the second and third, it isn’t obvious unless
    we examine the conditions.


    # Process steps – tasks


    We already know how to read the various types of process flows in the diagrams,
    but that’s not all

    we might be interested in. One of the basic things we need to know about any process
    model is what

    work needs to be done in it. For this, we use tasks. A task represents an indivisible
    piece of work to be

    done in a process. Why indivisible? As we mentioned at the beginning of this chapter,
    BPMN offers

    two types of objects (activities) to describe the work to be done – tasks and
    sub-processes.


    When our work is complex, can be broken down into multiple steps, and potentially
    performed by

    different actors, we should use a sub-process whose content can be described in
    a separate diagram.

    When there’s no need to add more details in such a way, the task will suffice,
    especially since we can

    add a description documenting what’s supposed to happen in a process step.


    Tasks are represented as rectangles with rounded corners, most often with a name
    in the center. As

    with most elements of the BPMN, we can either stop at using a simple task with
    no type specified,

    which is perfectly sufficient for models that serve documentation purposes. Alternatively,
    if we’re

    thinking of automating a process or need it for analytical purposes, we can set
    a specific type, which

    is symbolized by an icon in the top-left corner of the task. Those types tell
    us more about how the

    work of the task is done.


    ![](img/a4c90ee3d142c33743706d37c65779c2_244_0.png)


    Figure 8.25 – The most common types of tasks – none, manual, user, and service


    There are many different types of tasks, but it’s useful to start learning about
    them with three basic

    ones: a manual task, a user task, and a service task. While an ordinary task,
    without a type, tells us that

    a specific step of the process must be performed, any of the three types mentioned
    previously allows

    a simple analysis to be performed of the degree of automation of our process.


    At this point, it’s worth mentioning one of the quiet assumptions of the BPMN
    specification authors.

    Their idea was that any diagram described in BPMN could potentially be the basis
    for process

    automation (there’s even a special attribute stating whether a diagram is executable
    or not). Hence the

    name task – after automation, each task could potentially be routed to an employee
    to be performed.'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# # User task


    Let’s start describing the three basic types of tasks by looking at the user task.
    A user task is marked

    by the user avatar icon in the top-left corner. This icon is commonly used in
    applications, where it

    represents the user of the application. It also commonly allows the user to access
    personal settings

    in their account.


    The user’s task is performed by a person in the information system through which
    the process is

    coordinated. Such a system can be, for example, a workflow/BPMS tool, but also
    a CRM, ERP, or

    “helpdesk” system such as Jira.


    The important thing is that such a system controls the entire process. So, when
    a user performs the

    first task, the system, knowing what comes next based on the logic of the process,
    will assign the next

    task to the same or another user.


    # # Service task


    An even more advanced automation option is described by a service task. It’s marked
    with an icon of

    two cogwheels in the top-left corner of the task.


    A service task is a process step that’s performed fully automatically, without
    any user involvement.

    These tasks can include automatic calculations, document generation, data exchange
    between systems

    as part of integration, and more.


    Formally speaking, however, from the point of view of the specification, not every
    automatic activity

    is a service. By definition, a service is an element in which an engine that automates
    a process calls out

    other software that provides some service. We can refer to the concept of **service-oriented
    architecture**

    (SOA) or the more contemporary concept of microservices.


    # # Manual task


    As we well know, not all process steps and processes are automated. In this situation,
    a third type of

    task – a manual task – comes in handy. A manual task is indicated by a hand icon
    in the top-left corner.


    But what exactly should we consider manual tasks? The specification doesn’t give
    us much help

    here as it gives an obvious example of a technician installing a phone. What’s
    more, in addition to

    the obvious statement that a manual task is performed without support from a process
    automation

    engine (which is clear – otherwise, it would be a user task), the specification
    includes the note *nor any

    application*, while elsewhere it only states that a manual task isn’t performed
    or managed by a process

    automation tool. In an additional document accompanying the specification (*BPMN
    by example*), we

    can see examples of manual tasks that, while not coordinated by a process automation
    tool, require

    IT support (for example, by sending an email).'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'Unsurprisingly, I’m often confronted with the question of whether manual tasks
    are those in which we don’t use a computer at all. In my opinion, this isn’t necessarily
    the case. Since the key issue is whether the task is coordinated by some kind
    of process engine, I use manual tasks where there’s no coordination from the IT
    tool.


    For me, an example of a manual task could be preparing an offer for a customer
    – that is, unless it’s done in a CRM system, where you can see that someone is
    doing it and, if necessary, can forward the offer to the right person in the organization
    for approval before sending it to the customer. Similarly, if I’m working on a
    computer preparing a report in Excel, which I will then send via email to a colleague,
    the right kind of task here would be a manual task, not a user task.


    If our process isn’t automated, we can either not use task types at all or use
    manual tasks. If the process has been partially automated but contains steps that
    happen outside the system, then it may make sense to add user task steps where
    an employee can mark that they’ve performed some manual tasks. In the case of
    an automated process with manual tasks, the assumption is that the performers
    know what they’re supposed to do and when, and the system automating the process
    will simply skip the manual tasks because it will treat them as invisible.


    These three basic types of tasks allow us to analyze our processes very easily.
    For example, if we can see that all process steps are manual, then we can expect
    human error and delays. Most likely, adding support for employees through a process
    engine, using software robots, or more advanced process automation could greatly
    improve efficiency. However, even if our process can’t be automated, we can expect
    that documenting it will help reduce the number of errors, while increased visibility
    of the process steps and the logic of a process may bring valuable ideas for improvement.


    If we’re dealing with a process, where most of the steps are user tasks and service
    tasks, we can expect better process performance. Of course, even in such a process,
    there may be situations where the user manually transfers data between two systems
    that coordinate two separate steps of the process. In such a case, the use of
    either the RPA tool or some other method of system integration will enable further
    improvement of the overall process.


    # Send and Receive tasks


    The next two types of tasks we’ll discuss are useful for more advanced modeling
    because they’re used to describe the automated exchange of messages – one is used
    to send messages and the other to receive them. I’m introducing them at this point
    as a “foretaste” of what we’ll be exploring in Chapter 9, which is devoted to
    more advanced elements of BPMN. However, it will also help me explain one of the
    most important concepts in BPMN – sending and receiving messages.


    At this point, it’s worth mentioning a few principles of BPMN regarding messages
    and icons. First, as we already know, by definition, messages are sent and received
    between different process participants (pools) and can be associated with a message
    flow arrow.'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'Second, as you may recall from the introduction to this chapter, the BPMN icon
    that denotes a message is always an envelope. This knowledge will come in handy
    in a moment when we discuss different types of events.


    Third, in BPMN, active (throwing) elements always have dark icons, and passive
    (catching) elements have light icons. We’ll expand on that soon.


    ![](img/a4c90ee3d142c33743706d37c65779c2_247_0.png)


    Figure 8.26 – Tasks sending and receiving messages


    Now that we know all this, it won’t surprise us that a send task, which sends
    messages to other pools, will have a dark envelope icon in the top-left corner,
    while a receive task, which waits for a message from the outside for the process
    to continue, will have a light envelope icon in the top-left corner.


    When using tasks that send and receive messages, it can be helpful to show the
    pools with which message exchanges take place, and to present the message exchanges
    with a message flows. However, this isn’t mandatory, so you can present the sending
    and receiving tasks without showing message flows and other pools. This will help
    you save some space and avoid drawing many lines, although at the cost of losing
    some of the context.


    _Figure 8.27 shows the practical use of send-and-receive tasks in conjunction
    with message flows. Again, we’re using the familiar complaint handling process
    – however, to represent the occurrence of sending and receiving tasks in tandem
    (as is very often the case), I’ve modified the process fragment slightly to describe
    the following logic: the process starts with the receipt of a complaint, which
    is submitted by the customer (again, here, we can see the start event, which is
    triggered by a message, as indicated by the envelope icon)._


    Then, the employee must analyze the complaint and inform the customer that the
    complaint has been rejected (if it isn’t valid) or that the complaint has been
    accepted (if it’s valid). In either case, we’re sending a message outside our
    pool – in this case, to the customer.


    The rest of the process has been changed slightly to make the example clearer.
    On the one hand, we assume that we always replace the goods (that is, we don’t
    support refunds), while on the other hand, our acceptance also includes a request
    to the customer for shipping data.


    At this point, it’s worth noting the logic of the process: once we’ve informed
    the customer that the complaint is valid, our token immediately goes to the **Receive
    shipping details** task. However, since this is a receive task, we start waiting
    for a message from the customer. Only when the customer gives us the shipping
    data can we move on to the **Order shipping of a replacement product** task.'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# Figure 8.27 – Part of the example process – sending and receiving messages
    in practice'
  merge: -1
