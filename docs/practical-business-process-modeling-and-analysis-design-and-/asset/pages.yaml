- pgno: 141
  md: '+   - **Curiosity** drives the desire to seek new information and experiences
    that can broaden one’s perspective and challenge existing assumptions

    +   - **Exploration** involves actively pursuing various avenues for learning,
    such as reading, watching, listening, experimenting, or engaging with others

    +   - **Feedback** encompasses both receiving and providing constructive criticism
    and guidance to enhance performance and understanding

    +   - **Reflection** entails thinking critically and creatively about learning
