- pgno: 217
  md: '# # BPMN – What You Need to Know


    In Chapter 7, we briefly covered the history of process modeling notations and
    learned about the most important shapes of BPMN. BPMN is a very logical and easy-to-learn
    process modeling notation if you know how to approach it. In this chapter, we’ll
    cover its basics, including both its most crucial elements – that is, objects
    that can be used in a model (events, activities, gateways, swimlanes, artifacts,
    and data objects) and fundamental concepts that are important for having a proper
    understanding of BPMN diagrams.


    In this chapter, we’re going to cover the following main topics:


    +   - How to read a BPMN diagram

    +   - When and how to use gateways in BPMN

    +   - How start and end events can be used

    +   - How to show work in a process diagram with tasks and sub-processes

    +   - How to add more meaning to your BPMN diagram with additional elements, such
    as swimlanes, artifacts, and data objects


    > > Note

    > > This chapter is authored by Zbigniew Misiak.


    # ## How to read a BPMN diagram


    Let’s go back to the complaint handling process you know well from Chapter 7.
    This time, we’ll spend some more time discussing the basics of BPMN and explaining
    the usage of the key elements of the notation based on this example.


    The following is a horizontal version of the BPMN diagram. While BPMN allows both
    horizontal and vertical orientation of diagrams, the horizontal orientation is
    much more common:'
  merge: -1
  img_proc: true
- pgno: 218
  md: '![](img/a4c90ee3d142c33743706d37c65779c2_218_0.png)


    Figure 8.1 – Complaint handling process in BPMN'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'The following two figures (Figure 8.2 and Figure 8.3) will help you learn more
    about the most important shapes you can see in Figure 8.1:


    ![](img/a4c90ee3d142c33743706d37c65779c2_219_0.png)


    Figure 8.2 – Basic elements of BPMN (part 1)


    # ## Pools and lanes


    Let’s begin by looking at the two large rectangles that are visible in _Figure
    8.1_: **Company ABC** and **Customer**. In BPMN, we call them **pools**. This
    name is meant to suggest that the process flows inside the pool (just like people
    swim inside a swimming pool). This is a very important concept that we’ll develop
    further in a moment.


    As you can see, the diagram can contain several pools if you want to show the
    different participants involved in the collaboration, each with its own process.
    The pool can contain lots of elements inside, describing the process in more detail
    (this is visible for element **1a** in _Figure 8.2_), or just representing that
    there’s such a participant, without specifying how it performs its process (this,
    in turn, is option **1b**).


    For **Company ABC**, we can see not only elements representing what happens in
    the process but also some kind of structure showing us who performs what steps.
    Modeling **lanes** (see element **1c**) are used for this purpose.


    It’s worth noting that the name **lane** is another reference to a swimming pool;
    it can be divided into lanes to organize the way people swim. In our case, we
    have a lane representing the **complaints handling team**, an additional one for
    the **finance team**, and finally one for the **logistics team**.'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'The second pool, representing the customer, doesn’t contain any visible content.
    Such a pool is often

    called a **collapsed pool** or **black-box pool**. This suggests that from the
    point of view of the diagram,

    we either don’t know what the performer does or we don’t need to describe it in
    this diagram. Just

    in case you’re concerned about missing some important insights regarding customer
    activities, for

    example, the idea is to make a diagram more readable by hiding unnecessary details.
    However, they

    can be captured in another connected diagram.


    As you’ll see later in this chapter, pools (and lanes) are great not only for
    showing the responsibilities

    in a process but also for showing what the cooperation between different entities
    involved in a process

    looks like. Pools and lanes are part of the BPMN category called **swimlanes**.


    # ## Events


    While pools and lanes allow us to understand who does what in a process, we still
    need to understand

    the scope of the process, especially what makes the process start and how it ends.
    For this purpose,

    BPMN offers us events – elements that are always shown as circles. In our example
    diagram (**Figure 8.1**),

    we have two types of events: a **start event** (**2a**) and an **end event** (**2b**),
    which have a thin single border

    and a thick single border, respectively.


    BPMN also allows you to create slightly more complex intermediate events, something
    that will be

    covered in the following chapter (**Chapter 9, Advanced BPMN**). However, all
    the events represent some

    state of reality that’s important for the process. Unsurprisingly, start events
    represent situations that

    cause our process to start. End events, in turn, show the results of the process,
    its products, or final

    states (positive or negative). In our example, we have one start event, **complaint
    received**, and three

    end events: **complaint rejected**, **money refunded**, and **product delivered**.
    This allows us to see the

    scope of the process right away, even without knowing the individual steps of
    the process.


    # ## Activities


    Now that we know how to represent the scope of the process, it’s time to cover
    an equally important

    aspect: how to represent work that needs to be carried out in a process. Those
    steps representing work

    (called **activities** in BPMN) can be described as **tasks** and **sub-processes**
    and are shown as elements

    3 and 4, respectively. Without them, modeling a process diagram would be nearly
    pointless.'
  merge: -1
  img_proc: true
- pgno: 221
  md: '# How to read a BPMN diagram


    Tasks and sub-processes are always shown as rectangles with rounded corners. Tasks
    represent simple,

    indivisible process steps that we don’t need to decompose further for a more detailed
    description.

    Sub-processes, on the other hand, represent more complex process steps. These
    steps could be

    described in a more detailed model (this approach allows us to navigate from the
    main model to the

    lower-level diagrams) or simply serve as placeholders showing places where such
    decomposition

    could potentially take place.


    Often, sub-processes are useful when we have many diverse things (tasks) to do,
    and they’re carried

    out by different roles in the organization. Sub-processes are usually marked at
    the bottom with a +

    symbol, indicating that they may hide **something more** than ordinary tasks.


    We can see the division between simple and more complex elements in our example,
    where steps such

    as **Check complaint validity** and **Order refund** are tasks. On the other hand,
    more complex steps such

    as **Refund processing** and **Product shipping** are sub-processes because we
    could probably define at

    least several tasks for each of them, most likely being something more than a
    sequence of activities

    (for example, in the case of a payment refund, we perform it differently when
    the customer makes the

    payment by bank transfer and differently when the payment is made by credit card).


    # Gateways


    As we just mentioned, processes are rarely simple sequences of consecutive activities.
    Therefore, to be

    able to separate a process into different paths (splitting) and to connect these
    paths (merging), we must

    use another type of object in the BPMN: **gateways**. Gateways (see element 5)
    are always represented

    as diamonds (rhombuses) with incoming and outgoing arrows representing process
    sequence flows.


    In our example, the simplest type of gateway is used – that is, an **exclusive
    gateway**. Exclusive gateways

    represent places in the process where we have two or more paths available, of
    which only one can be

    selected. In the case of the **Complaint valid?** gateway, we have **Yes** and
    **No** as options, while for the

    **Selected option?** gateway, there are two mutually exclusive options for handling
    complaints: **Refund**

    and **Replacement** (of course, in practice, we would have more paths presenting
    other possible ways

    to handle a complaint, but this would make our diagram a bit harder to read).'
  merge: -1
  img_proc: true
- pgno: 222
  md: '![](img/a4c90ee3d142c33743706d37c65779c2_222_0.png)


    Activities, events, and gateways are called **flow elements** in BPMN and they
    allow us to document what happens during the process flow. However, simply placing
    those elements one after another wouldn’t allow us to figure out what the logic
    of the process is.


    # ## Connecting objects


    For this purpose, we would need an additional category of BPMN: so-called **connecting
    objects**, or colloquially speaking, arrows. The most important type of arrow
    in BPMN is the **sequence flow**, which is always marked by a black solid line
    with a full triangular arrowhead at the end (shown as element **A** in _Figure
    8.3_).


    As the name implies, this kind of arrow shows us in which sequence elements are
    activated as it connects events, gateways, and activities within a pool so that
    it’s always clear what comes before and what comes after the given element in
    the process. The sequence flow shows us the control we have over the elements
    of the process – either implemented by the process automation tool or by the process
    owner, who controls what happens in the process.


    Usually, the sequence flow is just a line without additional markers or texts
    but if it’s used where the process paths split (most commonly after the gateway),
    you’ll often see textual labels on the arrows that help you figure out which path
    represents which flow (in our example, it will help you figure out what will happen
    if our process needs to support the **Refund** option, and what will need to be
    done for the **Replacement** option).'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# How to read a BPMN diagram


    To summarize our principle regarding the process flow, we can say that a process
    always flows within

    a specific pool and can move between different lanes: from the start event through
    various activities

    and gateways to the end event, always following the sequence flow arrow (no gaps
    or jumps).


    Since a sequence flow can only occur within a single pool, how do we show that
    different entities work

    together? This is where an additional arrow type – message flow, labeled as element
    B – comes in handy.


    Unlike the sequence flow, we can only use it between pools. The message flow is
    always marked with a

    dashed line. At its beginning is a circle filled with white, and at the end is
    a triangular empty arrowhead.


    A different type of line might suggest that this type of flow behaves differently
    from a sequence flow,

    and indeed this is the case. While a sequence flow tells us about control and
    suggests that a process

    has a defined course that can be enforced one way or another, a message flow shows
    that different

    entities exchange messages, or information, with each other. However, those exchanges
    are more like

    requests, proposals, or suggestions to another entity. A customer has the right
    to make a complaint

    but can’t force an organization to acknowledge it if it’s unfounded.


    The elements that we’ve discussed so far allow us to describe the logic of the
    process and show how it

    interacts with other participants. With this knowledge, you can now read the vast
    majority of BPMN

    diagrams. However, apart from those key building blocks of the notation, there
    are also other categories

    of objects that give us more options in two additional areas – conveying additional
    information about

    the process and describing how to use data in the process.


    # Artifacts


    To provide additional information about the diagram for the people reading it,
    so-called artifacts

    are used in BPMN. There are two types of artifacts: text annotation and group.
    These are visible as

    elements 6a and 6b in Figure 8.3, respectively.


    These objects allow process modelers creating AS-IS or TO-BE diagrams to capture
    useful comments

    relating to how the process currently works or what we want to change about it.
    However, note that

    artifacts don’t change the meaning of the diagram, which is based on the elements
    that we discussed

    previously. So, for diagrams serving as documentation and for those used for automation,
    artifacts only

    provide more information without influencing the core message that’s captured
    in a process diagram.


    A text annotation is an element that allows you to place some text in the diagram.
    It has a very

    characteristic shape of a left square bracket with text inside. Text annotations
    can be placed anywhere

    inside a process diagram or connected with a particular diagram element. The former
    option makes

    sense if your comment is relevant to the whole process. The latter option is useful
    if we want to show

    that the comment applies to some specific diagram part. In this case, an additional
    type of arrow – an

    association drawn with a dotted line (element C) – is used. In our example, text
    annotation is visible

    next to the start event and shows the following text: Email, phone, or chat.'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'A group, in turn, allows us to visually distinguish certain elements of the
    diagram to emphasize that they have something in common and belong to some specific
    category. A group is shown as a rectangle with rounded corners, drawn with a line
    composed of dots and dashes (which reminds me of Morse code). The group isn’t
    connected to other elements of the diagram by arrows, so it’s easy to distinguish
    it from (nearly) all other elements of the notation. Groups can have labels that
    show what the contained elements have in common.


    The last category of BPMN objects is **data objects**, which (not surprisingly)
    allow us to show how data flows in the process. There are several types of data
    objects with different visualizations, but usually, they look like a sheet of
    paper with the top-right corner folded (in our example diagram shown in Figure
    8.1 it’s **complaint documentation** – that is, element 7a from Figure 8.3).


    In our example (Figure 8.1), we can also see a specific type of data object (**CRM
    system**) that looks like a cylinder with three stripes at the top (element 7b).
    To show how data flows from or to an activity in a BPMN diagram, we can use the
    **data association** arrow. This looks very similar to a plain association, but
    it has an arrowhead drawn with a black line (element D).


    As shown in Figure 8.1, objects in BPMN can differ within each type. For example,
    tasks may have icons in the top-left corner indicating what type they represent;
    inside the events, there may be special icons indicating how the process starts
    (for example, our start event has an envelope icon inside, which means that the
    process was triggered by a message from the customer); and sub-processes may differ,
    for example, in the style of the border. This way, BPMN allows us to convey additional
    information about the process. We’ll cover those shape differences in this and
    the following chapter.


    Overall, if we tried to count all the possible combinations of allowed shapes,
    icons, and line styles, there would be over a hundred shapes that have a specific
    meaning. Luckily for us, not all these elements are equally popular. Therefore,
    in this book, we’ll start with the most useful and popular elements and devote
    the most attention to them. For those that are less frequently used, we’ll allocate
    less space, but we’ll point out when and for whom they could be useful.


    # # How does the process flow?


    As we know from the previous section, one of the more important issues is to understand
    what work needs to be done in a process and what the relationships are between
    the various elements, or, more simply, what needs to be done and when.


    It seems trivial, but for someone who doesn’t know the whole process well, the
    mere information about what is to be done won’t be enough. It’s like giving a
    person learning how to cook a recipe for a dish but without information on when
    to add which ingredients. The mere fact that we’ll perform all the necessary steps
    isn’t enough – we can’t perform them in the wrong order or do something that wasn’t
    needed in that situation.'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'Process models can be small or large, simple or very complex, but regardless
    of their size and complexity, when we analyze them, we can distinguish certain
    recurring patterns. The concept of workflow/ process **patterns**, which were
    created for analyzing process automation (workflow) solutions, proves to be very
    useful in analyzing processes and learning modeling notations too. That’s why
    we’ll be using them in this book.


    While discussing various process patterns, we’ll be using an additional concept
    since it’s part of BPMN specification – the **token**. This isn’t one of the notation
    elements that can be used when drawing a BPMN diagram since it’s only a theoretical
    concept. However, it’s very useful for understanding how a process is executed,
    especially when there are several paths within a process. In case you’re curious,
    there are BPM tools that allow you to use tokens in practice – either for simulating
    business processes or for visualizing the progress of work in a process. However,
    BPMN specification doesn’t require tokens to be implemented in modeling or automation
    tools.


    A token is born when a start event is triggered and then flows through the process
    along the sequence flow arrow until it reaches the end event, where it’s consumed.


    # ## Sequence


    The simplest possible pattern is a **sequence** – a series of actions that are
    performed in succession. This sequence shows what should happen first so that
    it’s possible to move to the next stage of the process. To discuss this sequence,
    we’ll once again refer to the concept of a token.


    Imagine that we’re building a house. First, we must prepare the foundation. Only
    then can the walls be put up. Once the walls are standing, we can think about
    the roof. Common sense tells us that the idea of speeding up construction by putting
    up walls on an unfinished foundation and covering this with a roof is risky.


    Let’s look at an example of such a simple sequence:


    ![](img/a4c90ee3d142c33743706d37c65779c2_225_0.png)


    Figure 8.4 – Sequence


    When the process is started, the token goes to task A and makes it activated.
    This is a formal name from specification In practice, this doesn’t necessarily
    mean that someone has already started working on task A (for that, you still need
    a resource, such as an employee assigned to that task), but that if all the circumstances
    are favorable, you can start working on task A (as opposed to task B, which isn’t
    feasible yet).'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'Then, at some point, the work on task A begins and, after some time, when it
    is still in execution, it is completed. When modeling, it’s important to be clear
    where the scope of one process step ends and the next begins. When task A ends,
    the token flows along the sequence flow arrow to task B, and so on until the last
    task. When the last activity in the process is executed, the token reaches the
    end event and is consumed by it. Within a process instance for a sequence, we
    have only one token, so the moment this only token is “consumed,” the life of
    the instance ends, and we can consider that we have nothing more to do.


    If our process wrote a log or a diary (or if we had a system that documented what
    tasks were performed), we would always have the following entries in such a **process
    log**: ABCDE. There could be differences in who performed the tasks, when they
    were performed, and how long they lasted, but for such a process, it isn’t possible
    for steps to be skipped (ACDE), duplicated (ABBCDE), or to occur in a different
    order (AEDCB).


    Now, let’s turn to complaint handling and look at a slightly different example
    of a sequence – a simplified version of the diagram we’ve been working with so
    far, in which only one of the paths is included (we assume that the complaint
    is always valid and that we always make a refund):


    ![](img/a4c90ee3d142c33743706d37c65779c2_226_0.png)


    Figure 8.5 – Example of a sequential process with process steps in different lanes


    As shown in Figure 8.5, the elements of the sequence may be within a single lane,
    but the work may also flow between different units of the organization. In this
    case, process steps may be placed in different lanes. From the point of view of
    the sequence, this placement isn’t important – what’s important is that the moment
    one element of the process ends, we move on to the next – that is, only after
    analyzing the validity of the complaint can we inform the customer that their
    complaint has been accepted as valid, and only after that can we set up a refund
    order, without which payments can’t be processed.'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# # Exclusive gateway (XOR)


    In the previous section, we dealt with processes that were a simple sequence of
    steps. However, usually, our processes are more complex and some fragments are
    only performed if some condition has been met. The most common way to model such
    a situation is to use the exclusive gateway. This is often called the XOR gateway
    (exclusive OR):


    ![](img/a4c90ee3d142c33743706d37c65779c2_227_0.png)


    Figure 8.6 – Two possible visualizations of the XOR gateway


    The XOR gateway can be a simple diamond, or it can have an X marker in the center.
    Interestingly, while these two visualizations are allowed, they shouldn’t be mixed
    within a single model. Within the organization, it’s good practice to determine
    how XOR gateways should be drawn to avoid confusion. I’m in favor of using XOR
    gateways without the X marker in the middle, but I know that for many people,
    the X is a great mnemonic to help them remember that it’s an XOR gateway.


    # # Naming


    The BPMN specification doesn’t impose a specific way of naming exclusive gateways.
    So, in practice, you can encounter different approaches, as shown in Figure 9.7.
    In one approach, you don’t name XOR gateways, instead only making sure that the
    conditions/labels of the arrows coming from the gateway are sufficiently clear
    (for example, Complaint valid and Complaint invalid).


    I prefer the second approach, in which the XOR gateway is named with a question
    (for example, Complaint valid?), and the answers to this question are placed on
    the sequence flows coming out of this gateway (for example, Yes and No).'
  merge: -1
  img_proc: true
- pgno: 228
  md: '![](img/a4c90ee3d142c33743706d37c65779c2_228_0.png)


    It’s worth remembering that while we have some freedom regarding the way we name
    the conditions for sequence flows that come out of the exclusive gateway, we aren’t
    allowed to use tasks to represent which paths need to be taken and avoid using
    conditions on arrows. Such an anti-pattern is shown in Figure 8.8:


    ![](img/a4c90ee3d142c33743706d37c65779c2_228_1.png)


    # ## Alternative process paths


    We already know that the exclusive gateway is used to split the process into several
    mutually exclusive paths. But what can happen further down the process? From a
    notational point of view, each of these paths may lead to its end event. We had
    such a situation in our example process – the first gateway led to the **Complaint
    rejected** end event, or further, to the section where we dealt with an acknowledged'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'complaint, where the process split into two paths, ending with the **Money
    refunded** and **Product delivered** end events:


    ![](img/a4c90ee3d142c33743706d37c65779c2_229_0.png)


    Figure 8.9 – Example process with exclusive gateways and multiple end events'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'Using a simplified process with tasks named using letters, we could present
    the situation of multiple paths that don’t meet again and lead to different end
    events, as shown in Figure 8.10:


    ![](img/a4c90ee3d142c33743706d37c65779c2_230_0.png)


    Figure 8.10 – A process with multiple end events following the exclusive gateway


    Depending on the selected process execution variant, we could get the following
    process logs: AB, AC, and ADE. Two/three paths can’t be executed within a single
    instance, so we would never get an ABC, ABDE, or ABCDE entry.


    # ## Merging


    In addition to the situation where our paths split and don’t come together again,
    it’s also possible that only a certain part of the process differs, depending
    on the variant being executed; the rest remains identical because the process
    paths merge.


    As we’ll learn in a moment, merging is an extremely important concept in processes
    where more tokens are created. However, the exclusive gateway, as we know, doesn’t
    multiply the token – it only redirects the token to the correct path. So, how
    can we approach merging in this case?


    The specification gives us two possibilities. On the one hand, we can skip the
    XOR merging gateway and attach sequence flows directly to the next process step.
    On the other hand, we can insert a second exclusive gateway that will merge the
    process paths. This merging gateway doesn’t need to have a name. It’s also worth
    knowing that it passes through all the tokens that enter it.


    As you may imagine, the fact that the specification has given us such possibilities
    has led to the emergence of two schools of modeling with very strong views. Representatives
    of the first one opt for modeling without a merging XOR because it makes the diagrams
    simple and easy to read, plus it saves space.'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'Representatives of the second school, on the other hand, claim that XOR gateways
    should always be inserted in pairs – opening and closing – because only this makes
    diagrams readable.


    In my experience, the first approach is closer to those with **business** roots.
    The second, on the other hand, is more common among people with either IT or academic
    backgrounds. I hypothesize that those users associate closing gateways with closing
    parentheses in code, which becomes a habit.


    ![](img/a4c90ee3d142c33743706d37c65779c2_231_0.png)


    Figure 8.11 – Two possible approaches to modeling a process with mutually exclusive
    paths


    Regardless of which way we choose to model, the preceding two diagrams have identical
    meanings and could generate the same process logs: ABE, ACE, and ADE.'
  merge: -1
  img_proc: true
- pgno: 232
  md: '# # XOR gateways in practice


    Let’s return to our business scenario and see how the exclusive gateway works
    in practice (using the simplified example shown in Figure 8.12). As you can see,
    if the complaint is considered valid, then we proceed to the **Inform customer
    about complaint validity** task. Alternatively, it can be considered invalid,
    at which point we perform the **Inform customer about complaint rejection** task.
    It isn’t possible to perform both tasks within a single process instance.


    ![](img/a4c90ee3d142c33743706d37c65779c2_232_0.png)


    Figure 8.12 – Part of the example process – exclusive gateway in practice


    One interesting feature of BPMN is worth highlighting here. While in many modeling
    approaches, such as flowcharts, there are diamonds representing places where decisions
    are made, information is verified, and so on, BPMN gateways have a slightly different
    meaning. Although gateways are referred to as decisions according to the BPMN
    specification, it’s worth noting that the types of gateways that are often used
    in practice fall into a category called **data-based gateways**. This means that
    a gateway – especially an exclusive gateway – is something like a streetcar track
    gearbox. It determines which process paths get their token. By itself, a gateway
    doesn’t generate work, increase the duration of a process, or increase its cost.


    But how does the gateway *know* which flow should receive the token? This is influenced
    by comparing the data coming into the gateway from earlier elements of the process
    with the conditions found on the sequence flows. This data is often obtained from
    tasks or sub-processes before the gateway, but it doesn’t have to be this way
    – it could have been obtained much earlier before the occurrence of the gateway
    that will handle it. Again, let’s refer to our example – it could be that the
    **Identify way of complaint handling** task will provide us with the data based
    on which we’ll proceed further along the path of **Replacement** or **Refund**.'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'From a technical point of view, the user in charge of the **Identify way of
    complaint handling** task, who’s working in the IT system, would have a radio
    button on the case handling form where they would select the correct option –
    **Replacement** or **Refund**. This selection would affect which task would be
    received upon completion of the current task. It could also work like this in
    the earlier part of the process, where the user would have to mark whether the
    complaint is legitimate or not.


    ![](img/a4c90ee3d142c33743706d37c65779c2_233_0.png)


    Figure 8.13 – Part of the example process – gathering data in a task that’s been
    placed before a gateway


    However, it’s also possible to have a situation where the customer is asked to
    specify the preferred way to resolve the complaint earlier in the process. If
    we assume that the customer always completes the relevant fields in the form (and
    doesn’t change their mind afterward), our process will look like this: the data
    as to the preferred way of resolving the complaint is obtained in the **Receive
    the form** task and only affects the process in the **Selected option?** gateway.
    At this point, our employee would have to choose whether they recognize the complaint
    as valid or not. Whether they’d get the **Order refund** or **Order shipping of
    a replacement product** task wouldn’t depend on what they _click_ in the system
    because the data would already be available.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '![](img/a4c90ee3d142c33743706d37c65779c2_234_0.png)


    Figure 8.14 – Part of the example process – a gateway using data that was gathered
    in the earlier part of the process'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'Once we have the data, and the token has reached the gateway, the conditions
    that were defined

    for each path of the process are analyzed. In the case of an exclusive gateway,
    the first path whose

    condition is met will receive the token and the process will proceed. Naturally,
    such exclusive gateway

    behavior makes it very important to define the conditions on the paths properly.
    Therefore, a very

    popular approach is to try to document processes in such a way that exclusive
    gateways have only

    two outgoing paths, representing Yes and No options for the question asked in
    the gateway. We saw

    an example of this approach in Figure 8.14 for the Complaint valid? gateway.


    However, BPMN allows us to separate process paths in other ways so that process
    flows coming out

    of a gateway have conditions that are more complex than Yes and No. This gives
    us more options

    (especially if we have three or more possible flows in our process) and makes
    the diagrams more

    readable (otherwise, we might have to insert gateways one after the other), but
    it also forces us to take

    more care with well-thought-out conditions.


    # Watch out for errors with conditions


    Let’s use a slightly more elaborate version of our process to analyze an anti-pattern
    of how to handle

    this situation. Let’s assume that our organization has decided to simplify the
    claims handling process

    so that claims for low-value goods are automatically accepted so that no employees
    are involved.

    Figure 8.15 shows us that complaints with a value of less than 100 USD will be
    automatically accepted,

    and a refund will be issued (we assume that this is the condition of our fast
    track), while complaints

    of more than 100 USD will be analyzed by an employee.


    However, what about complaints worth exactly 100 USD? Unfortunately, our process
    would encounter

    an error in such a situation and won’t be able to continue because none of the
    provided paths supports

    such an amount. For the reader of the process, this is confusing, but for the
    automation of the process,

    it’s an even bigger problem.


    ![](img/a4c90ee3d142c33743706d37c65779c2_235_0.png)


    Figure 8.15 – Anti-pattern – unclear conditions regarding the amount of the claim


    It would also be problematic if our conditions overlapped. Such a case, however,
    would be less

    troublesome than the previous one, because then you can take the first path for
    which the condition

    was met.'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# # Default sequence flow


    But what if we can’t anticipate all the options that might exist? Here, BPMN offers
    us a solution that’s ingenious in its simplicity – the default sequence flow.
    We often use it to refer to process flows that are coming out of an exclusive
    gateway. The default flow has an additional designation that’s visible as a diagonal
    crossed line near the beginning of the arrow.


    ![](img/a4c90ee3d142c33743706d37c65779c2_236_0.png)


    Figure 8.16 – Default sequence flow


    The default sequence flow allows us to indicate which path the process should
    take if none of the conditions that have been defined on the other arrows are
    met. This guarantees that our process will never get stuck due to receiving data
    we didn’t expect.


    It’s worth remembering that the default flow doesn’t necessarily mean the most
    common way to execute the process or the option that’s most expected from the
    point of view of the organization (the so-called happy path). It’s simply a designation
    – if none of the defined conditions are met, take that path. IT professionals
    may associate it with the ELSE command present in many programming languages.


    # # Parallel gateway (AND)


    Another type of data-based gateway is the **parallel gateway**, also referred
    to as an **AND gateway**. This gateway is denoted by a + symbol in the middle.
    However, unlike the XOR gateway, this symbol isn’t optional, so in the case of
    this gateway, the + symbol must always be present.


    A parallel gateway is used to mark process paths that must be executed before
    the process can move on. Interestingly, this doesn’t mean that the activities
    along these paths must run at the same time (as its name might suggest), but simply
    that they must all be completed, before we can continue. The key point is that
    the order isn’t important to us (if it was, we could use a simple sequence), but
    that all the elements must be executed.'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'The AND gateway has a simple interpretation and behavior, so often, there’s
    no need to show its name

    on the diagram (although this is allowed). The principle is simple: when a token
    enters the parallel

    gateway, it’s multiplied so that each of the sequence flows coming out of the
    gateway gets its token

    (without checking the conditions). Since the token is generated independently
    of the conditions, it

    makes no sense to add conditions on the paths coming out of this gateway.


    However, what happens next with the tokens that are created in this way? Each
    of them flows further

    through the process and activates further tasks. This sounds harmless, but one
    of the biggest pitfalls

    lurks here for people new to BPMN. Let’s look at Figure 8.17 and consider what
    would happen in

    such a process.


    ![](img/a4c90ee3d142c33743706d37c65779c2_237_0.png)


    Figure 8.17 – A risky way of modeling – using only the opening (diverging) AND
    gateway


    To make it easier to describe this situation, let’s assume that task B takes 5
    minutes, task C takes 10

    minutes, task D takes 15 minutes, and tasks E and F take 1 minute each. There’s
    no problem with the

    availability of the resources responsible for these tasks.


    The beginning of the process is as we expected: after task A was performed, our
    token reached the

    parallel gateway and split into three tokens – one for each path – and thus activated
    tasks B, C, and

    D. After 5 minutes, task B was completed (our log is AB for now). Next, the token
    reaches task E and

    activates it. After another minute, task E is completed (our log is ABE) and the
    token reaches task F,

    which is activated. Another minute passes and the token reaches the end event,
    where it’s consumed.

    At this point, our process log is ABEF. Another 3 minutes pass and task C is executed
    (so we have

    ABEFC). Its token also goes to task E and activates it, after which it continues
    until the end event

    (when the second token disappears; we already have a log of ABEFCEF). Something
    similar will

    happen with the third token that goes out of task D. When the last token reaches
    the end event and

    thus the process instance (that is, its specific execution) ends, our process
    log will look as follows:

    ABEFCEFDEF. As you can see, we have executed tasks E and F three times!


    Paradoxically, this situation isn’t a mistake from the point of view of BPMN but
    the way of modeling,

    in which we have a splitting AND gateway without a closing (merging) gateway will
    likely be highly

    confusing for most people because they won’t expect multiple executions.'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'Of course there may be processes where we aim for such behavior, but usually,
    when people think about parallel process paths, they tend to expect a situation
    where we must wait until all the parallel parts are done before we move on. This
    behavior is extremely useful from a business point of view because it shows us
    that we can assemble a device only when we have all the parts ready, or that we
    can only prepare an offer to a customer when we have both the business part and
    the financial part ready. So, how can we get this behavior?


    The solution to our problem is the concept of synchronization. Unlike exclusive
    gateways, where the use of a merging gateway was optional, for parallel gateways,
    we’ll often want to insert a parallel merging gateway as well.


    Let’s see what inserting such a gateway will change in our example. For simplicity’s
    sake, I’m no longer inserting task F, which was previously intended to show what
    happens when tokens flow through the process uncontrolled. This time, we’re no
    longer assuming how long tasks take or what the availability of resources is because
    we want to focus on how synchronization using a merging parallel gateway looks
    like in practice.


    ![](img/a4c90ee3d142c33743706d37c65779c2_238_0.png)


    Figure 8.18 – Synchronization with a merging AND gateway


    The beginning is familiar: after task A is completed, the token arrives at the
    AND gateway. At this gateway, it’s multiplied (we can jokingly say that the token
    is photocopied) so that each of the sequence flows leaving the gateway gets its
    token. Then, each token flows independently and activates tasks on the paths.
    The availability of resources determines the order in which they’re performed.
    Thus, the ABCDE, ABDCE, and ACBDE orders are possible.


    But how do we know that we can already perform task E? And why do we perform it
    once? It’s all due to the merging parallel gateway, which provides synchronization.
    The moment the first token reaches the synchronizing gateway, it’s stopped because
    the gateway waits for tokens from all sequence flows that enter it. In our case,
    only when the third token arrives at the gateway will the gateway merge all of
    them into one and allow it to pass.'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'To make it work like this, we need to use a merging parallel gateway. That’s
    because using the exclusive gateway for merging would miss the mark as it would
    let every token through.


    A common question related to modeling parallel gateways is that by changing the
    position of tasks in the diagram, can we suggest what should happen earlier and
    what should happen later?


    ![](img/a4c90ee3d142c33743706d37c65779c2_239_0.png)


    Figure 8.19 – The placement of tasks within parallel paths doesn’t determine the
    timing of their execution


    BPMN suggests timing of the process steps by showing the logic of the flow. So,
    by following the sequence flow arrow, we can see that task B must happen after
    task A and before task E. However, whether we arrange tasks B, C, and D in a single
    line vertically, or they’re placed in some other way (like what’s shown in Figure
    8.19), it won’t affect how the diagram is interpreted.


    The order of execution depends solely on the resources performing the tasks and
    how the tokens arrive at the process steps to activate them. So, it’s worth remembering
    that if we want to guarantee a specific order of execution of process steps, the
    sequence is a good choice. On the other hand, a parallel gateway should be used
    when we want to guarantee some flexibility in the order of execution of certain
    process steps while ensuring that the process can only continue after selected
    elements are executed.


    # ## Inclusive gateway (OR)


    So far, we’ve discussed the two most common types of gateways: the exclusive gateway,
    which allows us to describe the situation where only one of many options can be
    selected, and the parallel gateway, in which all paths leaving the gateway must
    be executed for the process to continue. In practice, however, we also encounter
    processes in which certain paths are always executed and some only under certain
    circumstances.


    Naturally, we may be tempted to describe them as a combination of XOR and AND
    gateways, but we can also use another type of gateway – an inclusive gateway.
    An inclusive gateway behaves like a combination of XOR and AND gateways, thus
    allowing more complex process flows to be described more compactly.'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'An inclusive gateway is often referred to as an OR gateway. Like all gateways,
    it’s shown as a diamond,

    and the icon in the center indicating its type is a circle (which can be associated
    with the O in OR).


    How do you read the processes with an OR gate? Simply put, if a condition isn’t
    defined on the path

    coming out of the gateway, then this path will always get a token (that is, it
    will behave like an AND gate).


    If, on the other hand, a condition has been defined on the sequence flow coming
    out of the gateway, it

    will only get a token if the condition is true. Importantly, an OR gateway can
    have multiple outgoing

    paths with conditions that can be mutually exclusive but can also overlap.


    In practice, this means that when you see an OR gateway, you should take a closer
    look. In a situation

    where we have an OR gateway with sequence flows without conditions, it behaves
    like an AND gateway.

    If, on the other hand, we see an inclusive gateway whose paths all have mutually
    exclusive conditions,

    its behavior will be identical to that of an XOR gateway.


    Most often, however, the inclusive gateway is used in situations where multiple
    paths may be active.

    Since we’ll be reading the conditions found on the paths, it’s usually useful
    to give the gateway a name

    – just like exclusive gateways, and unlike parallel gateways.


    ![](img/a4c90ee3d142c33743706d37c65779c2_240_0.png)


    Figure 8.20 – Example of an OR gateway


    How will this work for our example? Since the sequence flow leading to task B
    has no condition,

    this path will always get a token. On the other hand, as we can see, the conditions
    for sequence flows

    leading tasks C and D are constructed in such a way that all, only one or neither
    of them can be

    satisfied at the same time.


    So, our process log could look like this: ABE (for cold spring), ABCE (for cold
    summer), ABDE (for

    warm spring), and ABCDE (for warm summer). However, there could be no ACE (because
    B must

    be executed since there’s no condition for this path) or AE (because the synchronizing
    gateway won’t

    let us through).'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'However, if a diagram doesn’t contain a path without a condition following
    an OR gateway (that is, the path that would always get a token), it might be a
    good idea to add a default sequence flow to prevent a situation where none of
    the conditions are met and there’s an error in a process causing the deadlock.


    It’s worth noting that our process could be modeled in a slightly different way:
    since task B is always performed, we could try to move it in front of the OR opening
    gateway. Of course, the requirement for this would be that tasks C and D can’t
    be performed before B.


    ![](img/a4c90ee3d142c33743706d37c65779c2_241_0.png)


    Figure 8.21 – Default sequence flow for an OR gateway


    While modeling in BPMN, it’s generally a good practice to make sure that the closing
    gateway is of the same type as the opening gateway. This is because if we were
    to insert a closing AND gateway, then in a situation where the opening OR gateway
    doesn’t generate a token for each path, our process will get stuck.


    # # Modeling without gateways


    One of the interesting aspects of BPMN is how much freedom the specification authors
    left to users by giving them many ways to model. However, as we’ve already mentioned,
    such freedom and having many options to choose from aren’t always helpful to us
    when we’re wondering how to model a particular process.


    In this section, we’ll address the issue of modeling without using gateways. The
    idea behind this is laudable – if we don’t use gateways, our models will be smaller
    and thus more user-friendly. However, as we’ll see in a moment, a smaller model
    isn’t always easier on the eyes. Therefore, the ways of modeling that are presented
    in this section shouldn’t be taken as recommended. I only want to show what’s
    allowed according to the rules of notation so that if you encounter such a model
    in practice or on an exam, will know how to interpret it.


    Let’s start with the parallel gateway. As we know, a token entering the AND gateway
    _multiplies_ in such a way that each process path leaving the gateway gets its
    token. A similar effect can also be achieved in another way – we just need to
    add several outgoing sequence flows (without conditions) to a task or sub-process.
    Then, each of the paths will get its token!'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'In practice, both diagrams in Figure 8.22 have the same meaning. The diagram
    on the left – with an AND gateway – takes up a bit more space, but you can immediately
    see how to interpret the model. In the case of the diagram on the right, you need
    to take a closer look at the process flows to make sure they don’t have conditions
    and that each path gets its token:


    ![](img/a4c90ee3d142c33743706d37c65779c2_242_0.png)


    Figure 8.22 – Comparison – splitting process paths with and without an AND gateway


    As we mentioned earlier, while it’s possible to split paths without gateways,
    in most cases, skipping the synchronization gateway isn’t a good idea. For example,
    Figure 8.23 shows a situation in which nothing synchronizes the three tokens that
    were created in task A, which of course results in task E being executed three
    times.


    As we mentioned for Figure 8.17, such a way of modeling is formally allowed, but
    you must be aware that many people will consider it a mistake and even more people
    will misread our intention, so this isn’t recommended.


    ![](img/a4c90ee3d142c33743706d37c65779c2_242_1.png)


    Figure 8.23 – A risky way of modeling – lack of synchronization


    It’s also possible to avoid using gateways when there are multiple flows with
    conditions (that is, the situations we discussed with XOR and OR gateways). In
    this case, a new type of sequence flow is needed – a conditional sequence flow.
    A conditional flow can come out of a task or sub-process, but'
  merge: -1
  img_proc: true
