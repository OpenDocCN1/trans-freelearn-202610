- pgno: 188
  md: 'As shown in Figure 6.7, our process group not only has a name and hierarchy
    ID, but also a description that helps us better understand its scope. In addition,
    for our 6.3 process group, there are also lower-level elements that provide additional
    information: five processes (6.3.1 Register products, 6.3.2 Process warranty claims,
    6.3.3 Manage supplier recovery, 6.3.4 Manage customer self-service materials,
    and 6.3.5 Service products) and more than 30 low-level elements (activities and
    tasks), such as 6.3.2.3 Investigate warranty issues and 6.3.2.3.1 Define issue.


    As you can see, APQC’s PCF contains a real wealth of elements describing processes.
    For example, the taxonomy for the Customer Products version contains almost 2,000
    elements at the five levels, of which more than 1,800 contain descriptions. The
    PCF is an invaluable aid for identification, documentation, standardization, and
    process improvement purposes, as well as for many other applications, such as
    benchmarking and organizing content.


    Given all this, it should come as no surprise that the PCF is the most popular
    process library in the world. However, it is not the only option available. Telecommunications
    companies frequently use Enhanced Telecommunications Operations Map (eTOM), companies
    for which logistics is an important aspect of operations use Supply Chain Operations
    Reference (SCOR), and IT departments use Information Technology Infrastructure
    Library (ITIL). In addition, reference process libraries can be provided alongside
    IT systems (e.g., ERP from SAP) or by consulting companies.


    Many of those sources of process knowledge can also be used by AI, so it is technically
    possible to use GenAI solutions to prepare first drafts of the process architecture
    based on those process libraries. Or, perhaps even better, AI-enabled tools can
    be used to make sure that no important group of stakeholders or other business
    concept that should be covered in a process architecture is forgotten.


    However, so far, there is no way to automatically create a good process architecture
    that people will be using without involving employees. Therefore, if you are interested
    in automating your processes and want to make sure you do not miss something important,
    it makes sense to create some kind of process architecture before you start the
    technical part of automation.


    For many organizations, a process library such as the PCF is also very useful
    for making sure that the company will not spend months trying to reinvent the
    wheel and making common mistakes. Sometimes, it is also easier to make everyone
    agree on one global standard approach to processes than to reach a consensus internally,
    especially if the organization has a strong silo culture.


    For some organizations, adapting the process library to their needs is not sufficient
    for ensuring that employees feel that the process architecture is tailored to
    their needs. The next section will show how to handle such situations so that
    we can have better employee acceptance and keep the benefits of using global standards.'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# # How to build your own process architecture


    In this section, we will learn how to build a custom process architecture. We
    will begin by discussing when it makes sense to do so, and then we will see what
    building a process architecture could look like for our fictional company.


    # ## Why does it make sense to create a custom process architecture?


    As mentioned previously, for some organizations, a process architecture tailored
    to their needs is a very compelling option. As in the previous cases, this also
    involves a multi-level structure of connected models. Typically, they are created
    during workshops with organization employees. As you may expect, it takes more
    time than adopting the PCF, but if done correctly, it can help build a stronger
    process culture in the organization.


    For those who want to benefit from the best practices available and have the custom
    look and feel of the process architecture, a hybrid approach is also possible.
    A process architecture can be created based on input from workshops, but with
    additional verification of completeness based on reference processes such as APQC’s
    PCF. This helps to speed up the whole process and improve its quality.


    The construction of the process architecture often benefits from an analysis of
    the organization’s strategy. This is because processes should ensure the operationalization
    of this strategy, as well as consider the stakeholders and the products and services
    through which the organization creates value for them.


    Interestingly, often, it turns out that, within an organization, there are frequently
    many conflicting ideas about through which processes value is created and for
    whom, who the organization’s stakeholders are, and how the organization intends
    to meet those expectations.


    A common vocabulary is also a very frequent problem for many organizations. This
    can lead to situations where different units do not have a common definition of
    who the customer is! You can easily imagine how harmful this can be for important
    initiatives.


    Discussions about different aspects of building the process architecture help
    develop a common understanding of how the organization works and how its processes
    fit into the overall value creation ecosystem. This is simply invaluable. The
    outcome of the architecture work itself—for example, a set of dozens or hundreds
    of identified and described processes documented in the form of interconnected
    models—is very useful, but the most important thing is to ensure that these models
    are the result of agreements between all stakeholders.


    It is possible to prepare a process architecture very quickly via a small group
    of specialists from the BPM CoE, but the real value is an architecture that results
    from a common understanding and agreement between people involved in process management
    in the organization. This acts as a contract that summarizes the way of working
    and provides a common view of the organization that has been agreed upon.'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'It is also worth cautioning against the frequent temptation to speed up the
    work that’s done on the process architecture by using the organizational structure
    to identify top-level processes. Value-creating processes run through the organization
    and require cross-functional cooperation, so building a process architecture based
    on the organizational structure would be fruitless.


    Building a process architecture is an extremely interesting area of process knowledge
    that has many approaches and possible solutions. To see what various process architectures
    might look like in practice, I invite you to visit https://bpmtips.com/process-architecture-real-
    life-examples.


    In addition to some additional examples from process architecture experts such
    as Roger Burlton and Roger Tregear, on this page, you will also find links to
    other useful resources, such as interviews on process architecture with Roger
    Burlton and Professor Marcello La Rosa. These provide lots of valuable insights.


    # # Building a custom process architecture in practice


    At this point, we know how to create a process architecture with APQC’s PCF. Now,
    let’s discuss how our fictional company, BPMT Dishes, could approach building
    a custom process architecture.


    Of course, it is worth stating again that building a custom process architecture
    doesn’t mean we have to start from scratch and invent everything ourselves. Libraries
    such as APQC’s PCF can and should also be used to check whether we are overlooking
    any important process areas.


    A valuable input for building the first level of a process architecture could
    be information about the strategy and operations of our company. For our fictional
    company, we could say that it is a family business with a strong customer focus
    that produces dishes (such as plates and bowls) and sells them to customers directly
    or via partners.


    To make things easier, we will only focus on producing dishes and selling them
    to customers directly. In real life, our company would probably also offer some
    other products from partner companies, such as cutlery, table linen, and so on,
    but we will not cover that in this book.


    As you can probably already see, there are two main areas where we produce value
    for our customers. The first **end-to-end process** would cover the full life
    cycle of product development from idea, through production, to managing the product,
    with decisions being made about changes or possibly retiring the product. This
    would guarantee that the company has great dishes that can be sold to customers.


    The second end-to-end process would focus on serving customers while also covering
    the full life cycle from making the customer aware of our products, selling and
    delivering them, to handling complaints if something goes wrong. This process
    should guarantee that the dishes produced in the first process reach the customers.


    Both processes would be an important way of making the company’s mission come
    true. This mission could be **creating delightful products that help customers
    have unforgettable moments around the table**'
  merge: -1
  img_proc: true
- pgno: 191
  md: '![](img/a4c90ee3d142c33743706d37c65779c2_191_0.png)


    Figure 6.8 – Example of a custom top-level model for process architecture


    🔍 **Quick tip**: Need to see a high-resolution version of this image? Open this
    book in the next-gen Packt Reader or view it in the PDF/ePub copy.


    🔒 **The next-gen Packt Reader** and a **free PDF/ePub copy** of this book are
    included with your purchase. Scan the QR code OR go to `packtpub.com/unlock`,
    then use the search bar to find this book by name. Double-check the edition shown
    to make sure you get the right one.


    ![](img/a4c90ee3d142c33743706d37c65779c2_191_1.png)


    Figure 6.8 shows what a top-level model for a process architecture could look
    like. As you may have guessed, such models differ a lot from company to company.
    The names of process categories, the number of process levels within one model,
    visual aspects such as graphics and logotypes, deciding which attributes should
    be shown (e.g., process owners), and providing additional navigational support
    to other related models describing the organization—these are only some of the
    aspects that impact what the top-level model of the process architecture looks
    like.'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'Discussions regarding the placement of a given process in the management or
    support category are also common. For some people, even the positions of the processes
    they see as their own can be important. Usually, the top-left element will have
    something to do with defining the strategy and vision, and making sure it guides
    the whole organization. In many organizations, this process would be called **strategy
    management**, even though this name is not very specific. This process could be
    followed by some other processes that guide the organization. For the support
    processes, this isn’t as obvious. Do we start with people (our employees), IT,
    or something else? It is often a matter of perceived importance.


    Luckily, as the people in an organization get used to process thinking, things
    such as more or less prominent positions of certain processes no longer matter.
    This is a good indicator that people grasp the concept of process management as
    a team sport, where the focus is on managing cross-functional processes to create
    value.


    Naming conventions are also tricky. A frequently used approach is the **verb +
    noun** naming convention (e.g., **Develop Strategy**). However, you will also
    notice other approaches (e.g., **Strategy Management**) or nouns that are not
    very precise (e.g., **Manage Strategy**). Well-known BPM expert Alec Sharp warns
    against using names that do not clearly state what the purpose of the process
    is because they do not help create a common understanding. A catchy name for this
    problem that was used by Alec in his acclaimed book, _Workflow Modeling: Tools
    for Process Improvement and Applications Development_, is **mushy verb fuzziness**.


    While the aforementioned options are not as clear and elegant as the first example
    provided, where we used an active verb, and they do not show precisely what the
    result of the process is, sometimes, it is hard to avoid them for several reasons.
    Sometimes, they are simply taken from a process library. Other times, the people
    responsible for some areas are used to such names (e.g., **Risk Management**).
    Usually, the result is a compromise of some kind, but this is typically widely
    discussed and a result of a common agreement.


    Of course, what we _see_ in a graphical model is just the tip of the iceberg:
    it is simply not practical to make all the information that was gathered about
    processes visible. Based on discussions, each process would be enriched with the
    necessary attributes. When the overview model is ready, usually what follows is
    a decision that specifies in which order processes will be decomposed further.


    In a perfect world, every process from the top level of the process architecture
    would have a model showing lower-level processes. However, often, organizations
    start by picking only the most important ones and documenting them in more depth.
    Only after this approach shows visible results and the organization learns how
    to approach the creation of process architecture can the remaining process areas
    be tackled.'
  merge: -1
  img_proc: true
- pgno: 193
  md: '# # How to use process architecture


    Earlier in this chapter, we discussed some of the benefits of having a process
    architecture. We already know that process architecture provides an overview of
    how an organization creates value and how processes are related to each other
    and other organizational resources. This is the **informational function** of
    the architecture. This is very helpful for training new employees and making sure
    that everyone is on the same page.


    Process architecture also allows you to easily drill down from overview models
    to models that show what is happening in a selected process area. This is the
    **navigational aspect**.


    If we add the issue of the huge opportunities that arise from standardization
    and the use of common procedures (reusability) and synergies in many places, we
    can see that we have a situation where several other business areas can serve
    as sources of good practices.


    For example, practitioners of **business process management** could find inspiration
    in domains such as **enterprise architecture management** (in particular, application
    portfolio management), **product portfolio management**, or **project management**,
    which at higher levels turns into **program management**, so that individual projects
    work well together, and **portfolio management**, so that practitioners can select
    the right projects for their implementation.


    In each domain, reusability and seeking synergy are important topics, so the methods
    that work there could also be useful in process management.


    This is especially important for organizations that plan to launch new products
    and enter new markets because they do not need to prepare everything from scratch;
    instead, they can reuse some of the existing processes. This helps reduce costs,
    speed everything up, reduce risks, and increase the overall agility of the organization.


    Also, companies planning mergers and acquisitions can greatly benefit from process
    architecture as it allows them to figure out which elements are redundant, where
    standardization can be used, and where separate processes are still needed.


    In the **Process attributes** section, we learned that, within a process architecture,
    each process is often described by a set of different attributes that are usually
    not visible in a graphical model at first glance, although they can be used for
    process analysis.


    In this section, we’ll look at what other practical applications of process architecture
    might look like and how process architecture can be useful in an organization’s
    digital transformation initiatives.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# # Establishing Process Architecture


    Let’s start with a topic that is often central to selecting processes that should
    be included in further architectural work: evaluating processes in terms of their
    importance. Depending on the specifics of the organization and the goals guiding
    the initiative within which the process architecture is being built, it can be
    helpful, for example, to classify processes in terms of their business value,
    level of customer satisfaction, IT support, compliance with regulatory requirements,
    and more. Such information can, for example, be visualized as a heat map using
    colors, which helps in the discussion of priorities for further work. An example
    of such an approach is shown in Figure 6.9.


    ![](img/a4c90ee3d142c33743706d37c65779c2_194_0.png)


    More sophisticated analyses using multiple data dimensions are also possible.
    For example, a common way to select processes for improvement might be to evaluate
    them based on two criteria: importance and urgency (i.e., the **Eisenhower Matrix**)
    or pain and gain. When selecting processes for **Robotic Process Automation (RPA)**,
    on the other hand, attention is often paid to the frequency of process execution
    and the degree of standardization (or business relevance).


    Another example set of attributes would involve assessing the benefits of automating
    a given process and the costs of that automation. For this type of analysis, the
    results are often presented in the form of a graphical analysis showing process
    evaluations as bubbles in each element of the graph. _Figure 6.10_ shows what
    this approach to process selection could look like.'
  merge: -1
  img_proc: true
