- pgno: 171
  md: '# # Establishing Process Architecture


    Every organization needs to run processes to create value. To get an overview
    of those processes, we need to have some kind of _table of contents_. However,
    since processes are interconnected, it is not sufficient to have one flat list
    containing hundreds of processes. We need something more sophisticated—something
    that will show what kind of processes we have, how they are connected, and what
    their details are, to mention just a few important aspects. The solution is **process
    architecture**.


    In this chapter, we''re going to cover the following main topics:


    +   - What is process architecture, and why is it useful?

    +   - How can **American Productivity & Quality Center’s (APQC’s) Process Classification
    Framework (PCF)** and other process libraries be used?

    +   - How can we build our own process architecture?

    +   - How can we use process architecture to select processes for improvement
    and automation?


    > > Note

    > > This chapter is authored by Zbigniew Misiak.


    # ## What is process architecture?


    In this section, we will learn what process architecture is and why it is useful
    for organizations to create one. Since many organizations are not sure why they
    should invest time and resources into building a process architecture, let''s
    start by discussing why it is needed.'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# # Why do we need process architecture?


    In Chapter 5, Business Process 101, we learned the basic concepts of business
    process management. We learned that processes can be seen as a way to create value
    for an organization. However, this requires many cross-functional processes to
    work together smoothly.


    Many organizations can identify hundreds of processes. Of course, not all of them
    are equally important, and often, one top-level process can be decomposed into
    many lower-level processes.


    To make things even more complex, organizations frequently model not only the
    current processes (as-is processes) but also design various possible future process
    variants (to-be processes) to compare them and pick the right one to implement.
    Not to mention, they also have an archive that contains models showing how the
    organization worked previously (e.g., for auditing purposes).


    To get a good understanding of what the entire ecosystem of processes looks like,
    which are interconnected in different ways, it is not enough to create hundreds
    of detailed process diagrams and try to organize them in a folder structure. Building
    a huge spreadsheet (or a wiki page) that contains a list of all the identified
    processes is not the answer either.


    This is because processes do not exist in a vacuum; instead, they influence each
    other. Processes are interrelated in many ways: very often, processes form a sequence
    or are part of a common value chain.


    This term can be defined in many ways; I will quote Roger Burlton, who says it
    is “a set of processes that need to be performed together to make the line of
    business succeed.” He also stresses that “companies may have multiple value chains
    for different types of customers, such as retail and business, and wealth for
    banking.”


    One process provides a product that is needed for the following process (and so
    on) before the result can be provided to the customer. In addition, to work properly,
    processes need certain resources, such as trained employees, well-functioning
    IT systems, and more, as well as guidance that is provided by other processes.
    An interesting point here is that even the best technology does not create value
    if the process and the strategic guidance are poor.


    Therefore, if we do not have the big picture of how our organization works through
    its processes, silo thinking is also a challenge, causing people to plan and act
    only from the perspective of their organizational unit, not the whole organization.
    This is extremely risky for the whole organization, because processes need the
    involvement of many people from different parts of the organization to create
    value. So, if they don’t have a common, agreed-upon view of how the organization
    works, they may make wrong decisions.


    If people simply think only about their own organizational silo, it is quite possible
    that a change in a process that seems to be beneficial, at least for the organizational
    unit responsible for a part of a whole process, will be harmful to the entire
    organization. This situation is called sub-optimization.'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'If people try to have a broader view, but either have some misconceptions about
    the work of others or simply do not know about others who are working in the same
    process, this can also lead to various kinds of problems, such as a solution being
    designed that does not provide proper support for all the interested parties or
    a process being prepared based on requirements that are not based on real needs.


    Since processes operate within a complex ecosystem, does it make sense to model
    and optimize or automate a single process in isolation from others? Or, looking
    at the situation from another side, if we want to improve the performance of an
    organization within a certain process area, how do we know what processes exist
    there, and how do we choose which ones to analyze?


    The solution is **process architecture**. It is a comprehensive way of identifying
    and presenting processes that provides a common and agreed-upon definition of
    the organization’s processes.


    Process architecture has many levels and allows us to easily navigate from the
    general overview to more specific models that provide more details. It is also
    multi-dimensional since it shows different categories of processes and their interdependencies,
    but also takes other dimensions into account— aspects such as connections between
    processes and IT architecture, the impact of strategies and goals on processes,
    relationships with risks and **environmental, social, and governance (ESG)** requirements,
    and many other issues.


    In the following section, we will look at an example of a top-level process architecture
    model. We will expand it throughout this chapter so that you can see important
    concepts in practice.


    # ## Process categories


    Organizations that create a process architecture usually divide their processes
    into different categories. Typically, three categories are used:


    +   - **Management processes** (sometimes also called **guiding processes**):
    Management processes guide the other processes by giving them direction, constraints,
    and rules.


    +   - **Core processes**: Core processes implement the organization’s strategy
    and create value. For commercial organizations, these are the processes that provide
    products and services that customers are willing to pay for.


    +   - **Support processes** (also known as **supporting** or **enabling processes**):
    Support processes provide reusable resources that are needed by other processes,
    allowing them to work as expected.


    _Figure 6.1_ shows an example of the top-level overview model (sometimes called
    **Level 0**) within the process architecture. Here, generic processes are arranged
    graphically to show which category they belong to. In addition, shapes (chevrons
    or arrows pointing upward or downward) and colors are used to make the distinction
    clearer. However, this is not always the case; for some organizations, consistency
    is more important, and they use the same shape throughout (it’s usually blue,
    right-facing, and wide chevron-like).'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# # Management processes


    ![](img/a4c90ee3d142c33743706d37c65779c2_174_0.png)


    # # Core processes


    ![](img/a4c90ee3d142c33743706d37c65779c2_174_1.png)


    # # Support processes


    ![](img/a4c90ee3d142c33743706d37c65779c2_174_2.png)


    Figure 6.1 – Example of a top-level model for process architecture


    Sometimes, the process category may also be indicated by an alphanumerical prefix—for
    example, the different process categories may begin with MP, CP, and SP. As we
    will see later, in the _Building custom process architecture in practice_ section,
    it is not obligatory to use prefixes in process names. For some organizations,
    it may even cause some misunderstandings if the process types are shown in names.
    Prefixes can also include numerical identifiers, something we will cover in more
    detail in a moment.


    # # Process hierarchy


    The next important element of process architecture is **hierarchy**. Just as for
    construction planning, we can look at maps and plans that provide different levels
    of detail, such as a city plan, a plan of the plot of land on which we are building
    something, a plan of individual apartments within a building that contain information
    about the layout of electrical, plumbing, and air-conditioning systems, and more,
    and move between those levels as needed (zoom in and zoom out). Process architecture
    also implies multiple levels of documentation in the form of connected models.'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'This is useful because, to support process thinking in an organization, we
    need to involve many different stakeholders with different information needs.
    For some people, it is important to have a quick overview and a general idea of
    the process and how it relates to other processes. Others need much more precise
    information about a process to do their work or to improve and automate this process.


    There is no one-size-fits-all approach to several levels in a process architecture.
    Some experts suggest that there should be a fixed number of levels. This may be
    the case when an organization uses a certain standard and wants to compare its
    processes to other organizations using this standard.


    Others suggest that the number of levels may differ even within a single organization.
    This allows some flexibility to go deeper where needed. Also, there is no common
    agreement regarding how many levels of processes can be shown within one model.
    Therefore, what I will be presenting here is a best practice based on my experience.


    How could this process hierarchy work? When we have a top-level model showing
    an overview of our process architecture (e.g., similar to Figure 6.1), it usually
    shows 10-20 groups of processes, which could also be called **process areas**
    or **mega-processes**. Each of those could be decomposed into more detailed models
    showing several levels of **children** processes.


    Finally—at least for some of the processes—we may want to document them by providing
    detailed process diagrams, often described using BPMN notation—perfect for documenting
    how we perform the process, but not suitable for showing high-level process architecture.
    This is something we will cover in Chapter 8, BPMN—What You Need to Know, and
    Chapter 9, Advanced BPMN. These detailed diagrams can also be decomposed into
    even more detailed sub-processes and can be enriched with instructions for individual
    process steps. Such instructions can include **Standard Operating Procedure**
    (SOP) documents, which are frequently used even in organizations that do not use
    process thinking but just want to help their employees by providing precise information
    and ensuring quality of work.


    Each of the processes can also contain more information apart from the connections
    with other processes. We will cover those process attributes in the next section.
    This way, we can provide necessary information about the processes to interested
    people without having to create detailed diagrams for every process. This is crucial
    because creating and updating detailed diagrams can be very time-consuming.'
  merge: -1
  img_proc: true
- pgno: 176
  md: '![](img/a4c90ee3d142c33743706d37c65779c2_176_0.png)


    Figure 6.2 shows an example of a lower-level model describing the contents of
    the **CP.01 Process K** process, which we saw in _Figure 6.1_, in more detail.
    In this case, we can see that this process has four processes as its children
    (**Ka**, **Kb**, **Kc**, and **Kd**) that form a single value chain (they follow
    each other sequentially). Apart from the visual aspect, you can also see that
    these processes are on the same level by looking at their prefixes (**CP.01.01**,
    **CP.01.02**, **CP.01.03**, and **CP.01.04**), which show that their parent process
    is a (core) process with **CP.01** as its prefix. In addition, one of the processes
    (**Kb**) has children (**Kb1** and **Kb2**). Those processes can also be described
    in the form of a more detailed BPMN diagram so that you can drill down for more
    information.


    Please bear in mind that you can create a process architecture without using prefixes.
    Prefixes can be helpful since they immediately show where our process belongs
    and make parent-child relationships clearer, which is often very convenient. That’s
    why I am using them in this section; they make explanations much easier for a
    multi-level process architecture.


    On the other hand, without some kind of IT tool support, it can be a daunting
    task to make sure all the prefixes for process models are up to date when, for
    example, new processes are created or existing processes are split, merged, or
    deleted, which causes changes in IDs that people become accustomed to.


    Generally speaking, it may be better if people treat prefixes as support and not
    a part of a real process name, especially if they do not focus on the prefixes,
    thereby forgetting the true meaning of the processes at hand. If people can recall
    the number of a process but do not remember its name and what exactly the process
    does, this is often a bad sign.'
  merge: -1
  img_proc: true
