- pgno: 30
  md: 'More than likely, there is an opportunity for more automation in those core
    processes. *Emerging digital technologies* combined with traditional technologies
    used in a new way or in different contexts hold potential benefits for organizations
    and their constituents. Examples under the watchful umbrella of modern cybersecurity
    include the following:


    +   - AI / generative / decisioning / learning

    +   - Analytics / poly analytics / mining

    +   - **Business Process Management (BPM)** / development / automation

    +   - Collaboration / content

    +   - Business application / models / templates / components

    +   - Cloud / integration / data fabrics / blockchain data

    +   - IoT / edge hardware / digital twins


    Making the existing processes friendlier and more intelligent is an excellent
    first step. Consider adding more robust assistance/intelligence to the participants
    (AKA resources) involved in process completion. *Typical process resources* include
    the following in the context of location and state:


    +   - Managers

    +   - Knowledge workers

    +   - Skilled workers

    +   - APIs, data meshes, and data and knowledge sources

    +   - System components, bots, and algorithms

    +   - Sensors, chips, controllers, and edge firmware

    +   - Robots, drones, cameras, and so on


    No matter the process that an organization chooses, a process model will point
    the way to the improvement opportunities for digital transformation efforts, especially
    when combined with AI, business analytics, process/data mining, and non-self-serving
    surveys of customers, employees, partners, contractors, and communities.


    # # Types of process modeling today with usage guidelines


    There may be a debate on whether to model or just jump into coding or composition
    and fail fast. We suggest modeling is a great way to plan more critical or complex
    processes. Today there are many options for developing processes and applications.
    There is great debate about modeling representation and even the need to model
    in the first place. Before we get into the representation issues, let’s think
    about the reasons to model in the first place. We know tremendous pressure exists
    to get to code quickly to show results. There are better ways to compose code,
    link APIs, and leverage low-code approaches'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'that might lead one away from models. After all, models generally don’t execute
    directly, or do they? Though models might not seem to get to code as quickly,
    they help code the right solution to meet the needs. There are three great *reasons*
    to create a visual model, and they are as follows.


    # # Visualize the connections between processes and resources


    Management, customers, partners, and employees often think they understand the
    operational efforts needed to complete work, but they don’t. Indeed, there is
    not a common understanding of operational processes and applications in all the
    contexts and views held by the collective participants. Creating an agreed-upon
    visual representation gives a solid construct for explanation to all managers
    and participants. Combining the different views and perspectives into a whole
    model makes a shared understanding of the likely outcome. The model identifies
    all the participant’s roles, decisions, actions, and results.


    # # Gain a common understanding of the current situation


    Often, there are processes, data, events, and patterns belonging to each participant
    in an application or process that may have been created by their organizational
    position, role, or specialty. By better understanding the moving parts and how
    they contribute to business outcomes, existing processes and applications work
    better without needing to change the base process or application. If changes are
    being considered, the current state models can enable better approaches or remind
    developers or participants of crucial constraints.


    # # Create a consensus on a future solution


    Gaining consensus on a set of target processes and applications is essential in
    all transformations, especially in digital transformations. Creating a group of
    participants to define a new way forward and enabling them with models allows
    for faster progress. Models can be used to verify whether the new solution is
    correct from several perspectives outside the core design group. Also, it allows
    management to understand the sticking points in significant changes and engage
    participants early in the change process.


    Often, organizations pick one of these approaches to start the modeling efforts
    and realize they need the other two to figure out the transformation efforts,
    including scope, skills, available resources, partners, technologies, and a reasonable
    schedule. It is crucial to determine what levels of pioneering and risk the transformation
    efforts will allow within the organization’s culture in charge of the digital
    efforts.


    Three different *process styles* require different process modeling approaches,
    each concentrating on representing how work is managed toward a business, process,
    or technical outcome. In more complex situations that deliver high-value outcomes,
    more than one style may be used. See the process styles in *Figure 1.4* for a
    visual representation of each style.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# # Process Styles


    ![](img/a4c90ee3d142c33743706d37c65779c2_32_0.png)


    Figure 1.4 – Process styles


    An explanation of each style is enumerated as follows.


    # ## Structured processes


    While multiple process sub-styles exist in this category, they all start with
    planning a process and identifying almost all the paths and exceptions. Then a
    process that is relatively static and brittle is put into place. These can be
    whole processes or process snippets, meaning partial cohesive pieces of processes
    that are bound steps for specific results. Structured processes work best for
    standard and straightforward outcomes. Still, they can be expanded to take advantage
    of BPM and rule agility to make them less static and more adaptable to new business
    requirements and exceptions. Some organizations build extensive and comprehensive
    structured processes that become hard to test and maintain. The relationship between
    bots and these processes is more around the bots serving the process than vice
    versa. The extensive process brain controls it all.


    # ## Case collaboration


    More dynamic processes start showing up in case management, where the goals and
    milestones are static, but the paths to these goals can vary. It is accurate for
    knowledge-intensive work, where one person does not understand how to solve or
    complete an individual case. Case collaboration can get even more agile and dynamic
    when the goals and milestones can change. This calls for adaptive'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'case management. Bots can be used in a couple of scenarios to start. One is
    that a bot could contain automated personal assistants in the cloud that could
    grok large amounts of information from data lakes or produce deep analytic efforts
    on behalf of the knowledge worker. In this situation, the structured part of the
    process becomes a minor part of the overall process and evolves to snippets of
    process sequences or bots/personal assistants. This way, you could swap out AI
    agents or people at the direction of management. It introduces more complexity,
    but the case brain will control events and patterns fired from bots for potential
    decisions and actions.


    # ## IoT bot collaboration


    Imagine a network of collaborating bots and IoT devices working together to decide
    what the next step should be and firing off another structured process, a case,
    or a set of bots to _meet dynamic goals_ set by a managing agent. Of course, these
    agent collaborations and actions would have to be bound by constraints to avoid
    violating governance policies or rules. It is a very dynamic approach where the
    brains of the operation are no longer a central control process or case in charge.
    In this case, goals and constraints with contexts now lead the way. Real-world
    examples are emerging every day. One such use case is automatically feeding farm
    fields with water and fertilizer for bigger yields. See `https:// jimsinur.blogspot.com/2013/07/smart-farm-operations-processes.html`
    for a case study.


    There are three significant reasons for modeling processes. The most common is
    understanding the current processes, which will likely include process/data mining
    techniques and technologies as it automates part of the understanding of the current
    processes more scientifically. The next most common reason is to create a future
    process model that will most likely use visual modeling tools and get more detailed
    throughout the phases of progress. In complex or wide-scoped processes that coordinate
    many resources, a model of the connections and the boundaries the process crosses
    is also essential. Often, significant efforts will employ all three. Three styles
    of processes are also employed to achieve unique business outcomes. It is essential
    to understand all three, but the point of control that the processes need will
    point to a particular style or combination.


    # # What is the future of process modeling in the context of other modeling disciplines?


    Process models do not exist in a vacuum; they interact with other essential factors
    in both human and automated digital solutions. While process flows, decisions,
    cases, data, and result visualizations are often modeled well in many organizations,
    more models are needed as more intelligent dynamics are applied to digital solutions.
    Process models have served processes and business results well to date, but organizations
    need much more to model. The importance of semiotic representations of process
    components can’t be overstated. However, digital solutions demand more modeling
    types over time. So far, we have identified another six underserved areas that
    have not been dealt with to date, represented in _Figure 1.5_ as other necessary
    models.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# # Process Models in the Context of Other Models


    ![](img/a4c90ee3d142c33743706d37c65779c2_34_0.png)


    Figure 1.5 – Necessary other models


    In the following sections, we enumerate areas that processes must deal with as
    larger scopes and more complexity are introduced to the process world.


    # ## Collaborations


    There are few accepted representations of approaches to collaboration patterns,
    though we have seen some attempts to represent social interactions captured during
    social mining and analytics. It may take a while for this area to produce some
    common patterns of representation, and longer still to have a standard representation
    that spans vendors that support the human interaction needed to complete business
    outcomes or manage improvement or change efforts.


    # ## Goals


    While there are a couple of great examples of goal models and goal interactions
    from a few brave vendors, no accepted modeling approach is universally embraced
    today. A few organizations have sensed the turn from flow-directed processes toward
    goal-driven processes. In processes that can self-determine direction and the
    next best action, the need for goals is essential.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# Constraints


    As processes become less structured and emergent, constraints will become more
    critical in the process

    governance and control arena. I have not seen any significant representation of
    boundary constraints

    showing a process surrounded by these protection mechanisms. Constraints and goals
    are necessary

    to allow for the inclusion of unsupervised AI in attaining business outcomes.


    # Math models


    While there are some models for singular analytic approaches (such as PMML for
    predictive analytics),

    there is no known modeling method for the multiple interacting analytics that
    one can find in the

    intelligent processes that exist today, much less the inclusion of various types
    of AI behavior.


    # Contexts


    As processes become more proactive in sensing active patterns and scenarios, there
    will be a need to

    represent the contexts that processes participate in and are interested in participating
    in to attain their

    outcomes or goals. These contexts will be inspected for advantages, threats, and
    learning experiences.

    Processes beyond internal and external organizational, industry, or geographic
    boundaries must be

    sensitive to meaning within different contexts.


    # Patterns


    Today organizations seem more interested in events to react to than patterns of
    interest. This will

    change over time, but there is no accepted way to represent patterns today. Patterns
    of interest will

    eventually need semiotic representations, along with a classification scheme.


    While we might all agree that modeling processes, decisions, goals, or data has
    significant benefits,

    there are disagreements on the modeling methods, standards, and the most important
    object to model.

    Let’s examine the areas of friction in and around modeling. We have identified
    five areas of friction,

    but I imagine more issues lurking below the surface like there is only data or
    rules.


    # Process modeling trade-offs


    Even within the process modeling domain itself, without consideration of other
    companion modeling

    assists, process modeling has some difficultbalances that need to be addressed,
    as outlined in the

    following sections.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# # Model the logical or the physical


    A common argument often revolves around modeling the target logical model instead
    of the physical implementation model as it represents the pure need and would
    include things such as operational manuals skipped by the implementer. The implementation
    folks usually argue that the logical future model does not essentially reflect
    reality, and synchronizing both is impossible. Some organizations use the logical
    model as a specification and throw the logical model away as soon as the physical
    model emerges. Those who believe in rapid innovation favor creating the implementation
    quickly and failing fast. We prefer a rough logical model that includes operations
    manuals and iterates to completion.


    # # Model to the standards or not


    Many folks believe in modeling standards and say that standard modeling makes
    training, communicating, and attracting instant contributors from outside the
    organization easier. There is also a benefit from moving models around from one
    vendor to another without nasty conversions when switching to another platform
    already in use inside the organization, or even a new one. Some say that standards
    are difficult to work with and miss critical nuances that make a difference. Why
    use clunky standards when they just slow things down? While we prefer the ease
    of development over standards, we are tempted to iterate rather than model to
    perfection. There is a balance to be struck here.


    # # Model cases over processes


    There is a brewing argument that **Case Management Model and Notation (CMMN)**
    is very close to **Business Process Model and Notation (BPMN)** and could be easily
    be extended to support cases. We would agree if BPMN included goal modeling because
    cases work to milestone goals, and flow can take a back seat.


    # # Model decisions over processes


    There is also a growing debate about whether processes embed decisions or whether
    decisions are on top, as they determine the tasks to perform. We think you need
    both for very complex processes, and they should work together, but **Decision
    Model and Notation (DMN)** is the new kid on the block and doesn''t get the respect
    it deserves.


    # # Model goals over processes


    The odd man out is goal modeling, as processes and decisions used to be rigid
    and unchanging. As both decisions and rules become more fluid, goal modeling makes
    more sense. The goals remain, and the goal target could change, but the path of
    decisions and process tasks can vary greatly. Goal and constraint modeling should
    get more attention than it does.'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'Modeling is excellent, but it can create religious wars when vendors try to
    make their approach and notation the center of the process world. Whatever models
    you embrace, make the decision at the beginning of the project and stick to your
    selection unless it needs significant adjustment. This is unlikely as fluid processes/cases
    are usually known about upfront, and approaches can be selected to support them.
    We strongly suggest that process models be selected to represent any real-world
    activity for process mining that will help improve any current/existing processes,
    as process visualization is great for business and technical professionals to
    understand activity in context. Process models are also handy for describing future
    states for stable and static processes or process snippets. It’s only when the
    problems become more emergent or change volatility becomes excessive.


    # What is the future of process modeling in the context of AI assistance?


    The value AI brings to process modeling will depend on how AI affects the actual
    processes modeled and whether the process model represents future designs or a
    representation of actual execution, in-flight or after the fact, when combined
    with process/data mining. We have identified three overlapping phases of AI’s
    impact on processes:


    +   • The first phase will be the augmentation of existing resources involved
    with the process completion/execution


    +   • The second phase will replace specific resources or steps in the context
    of a process with AI-heavy process snippets, IoT devices, or bots, AKA agents


    +   • The third phase is where AI becomes the controlling manager of processes,
    from a dynamic assembly of process components and execution of processes to monitoring
    process outcomes for adjustment in real time


    The journey to smarter, more intelligent processes will likely be an evolution
    starting with smarter actions considered in changing contexts. As intelligent
    processes become more efficient at handling change, they will need to stay that
    way by recognizing patterns of threat and opportunity. Once intelligent processes
    see potential changes, they will likely make decisions in an unsupervised fashion
    within guidelines provided by the organization.


    The resulting leverage of AI and analytics creates intelligent processes. AI will
    not be instantly included, but gradually adopted throughout a journey guided by
    the needs of processes built to support varied business outcomes. We have illustrated
    the journey to smarter processes in Figure 1.6, where processes not only service
    actions but also sense/recognize emergent patterns to support dynamic and informed
    business decisions to gain optimized business benefits.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# Journey to Smarter Processes


    ![](img/a4c90ee3d142c33743706d37c65779c2_38_0.png)


    Figure 1.6 – Journey to smarter processes


    Intelligent/smart processes show their IQ by the kind of work they include and
    the scope of impact they support. Standard processes/process snippets mainly support
    action steps for discrete tasks, typically with simple branching decisions to
    support static goals. These are depicted in the lower-left corner of Figure 1.6.
    The next level of intelligence is usually attained by including end-to-end processes
    and their actions or by recognizing patterns or events that might impact the process.
    As the complexity of the work increases, so does the number of resources along
    with the intelligence of the resources. The demand for intelligence takes off
    when the scope of processes crosses organizational and industry lines, often requiring
    more complex decisions that balance conflicting goals from various constituents.
    Often the next level of smart capacities is required by an emergent set of complex
    decisions that stem from dynamic change, requiring on-the-fly optimization. It
    implies the adaptable reuse of process snippets and bots that an intelligent AI-loaded
    bot might control. At some point in the evolution, processes change the point
    of control from flow directed to goal directed.


    # Flow directed versus goal directed


    Some feel that there should never be any sequence of steps in a process. Others
    state that there would be chaos in processes without sequence, and people would
    be confused. It raises the question, “Should processes be flow or goal-directed?”
    The appeal of goal-directed processes is that the process emerges as it seeks
    its set of goals at any point in time. As the goal changes, the process automatically
    adjusts to meet the new set of goals and the weights for those goals. It is perfect
    for emerging processes where the flow or portions of a flow emerge as the time
    and target move.'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'We see significant portions of goal-directed processes in **Adaptive Case Management**
    and late-bound processes. The problem with this approach is that sometimes, actions
    are not understood until visualized after the fact. The appeal of flow-directed
    processes is that better practices can be selected and followed based on conditions
    that are known at the time. People like flow-directed processes because they can
    visually study, understand, and improve flows by adding new paths and exceptions
    while maintaining control. The problem is that it takes time to do all this in
    a time-to-market fashion, and control is exercised centrally, something that the
    world is moving away from because of the increased speed of change combined with
    increased complexity.


    We think the days of extensive, centrally controlled, flow-directed processes
    are drawing to a close, but this doesn''t eliminate the need for sequencing. We
    think the overall process should be goal directed and somewhat decentralized (with
    authority pushed to the edge by intelligent resources such as people, agents,
    bots, and things). However, there will still be snippets of sequences that will
    be utilized. Eventually, all resources will bid for work, and the sequence-based
    process will wane significantly, but we are not convinced the sequence will completely
    disappear. Large and rigid processes are becoming a bit of a dinosaur. The world
    is changing from flow-directed to goal-directed processes and distributed intelligence,
    and we must learn new skills and habits to manage emerging work. The minimum required
    is to let flows freely flow within constraint boundaries and audit the results
    after the fact to check whether new constraints are required.


    # ## Phases of AI in intelligent processes


    There are three distinct phases that organizations will have to consider, but
    they could overlap in their application in any process. These phases are as follows.


    # ### AI and process phase 1


    Processes often coordinate, leverage, and consume resources. These resources comprise
    humans, systems/components, data sources, and machines. Humans can range from
    low-level workers to highly skilled professionals that are rare and highly paid.
    Systems range from simple one-function components to work-focused process snippets
    to complex, highly functional legacy systems. Data can range from detailed, single-source
    base data to highly refined informational sources available from a data mesh in
    the cloud leveraging various kinds of content/formats. Machines range from single-function
    chips to complex devices guided by processes.


    All these resources can be lifted to a higher level by adding smart capacities.
    Resources can learn through the assistance of AI/machine learning and pattern
    recognition. Resources can be augmented with **_smart actions_** to create better
    and faster. Generative AI resources can also be assisted through cognitive suggestions
    for decisioning. All these resources exercise supervised AI to make themselves
    smarter and faster. It used to be that humans were needed for creativity, but
    now generative AI can minimally generate a great starting spot, and finished deliverables
    at best. See **_Figure 1.7_** for examples of how resources combined with processes
    can assist in attaining business outcomes over and above'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'the everyday actions that processes do for organizations. Often, higher-skilled
    and more expensive resources can be freed up as the work trickles down to lower-skilled
    resources augmented with AI.


    # Smart Processes Go Beyond Actions


    ![](img/a4c90ee3d142c33743706d37c65779c2_40_0.png)


    Figure 1.7 – Smart processes


    # AI and process phase 2


    This second phase is more about displacing higher-paid and time-constrained resources
    with always-on resources and consistent bots and snippets. This will probably
    reduce the number of humans necessary for process/work completion. Where danger
    and timeliness are present in the solution, the more likely it is that AI automation
    will displace workers. In addition, where consistent precision is required, the
    AI bots are hard to beat. Where judgment and empathy are required, the human touch
    is essential. This calls for a semi-supervised AI where processes and humans interact
    to check the results of the AI in current processes or after the fact. Process
    control still resides with processes and humans are assisted by visual supports
    such as process models and dynamic real-time dashboards.


    # AI and process phase 3


    This is where AI becomes the decider and controller for processes, displacing
    process management functions. It is almost entirely unsupervised except for the
    presence of goals and guardrails (constraints). The goals are needed to make sure
    that desirable business results are pursued. The constraints are needed to keep
    AI compliant with the global and local legal frameworks in force at any time.
    Management will be focused on creating great goals and safe guidelines. Here,
    AI is making lots of decisions in real time, not only for speed and cost but to
    stay on course in emergent problem domains. AI will create the process paths dynamically,
    control the bots bidding to complete tasks, and give permissions to'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'services. Process models will likely be developed after the fact and combined
    with analytics and AI

    of their own. Explainability is the goal for AI and processes here.


    # # Collaboration between processes and bots


    As AI bots get smarter, they will replace certain decisions and actions in the
    process, but they will

    still collaborate. Processes will concentrate on sequential actions and likely
    become smaller snippets

    of what was an overall process of the past. Over time, this collaboration and
    sharing of decisions and

    work will become more fluid.


    AI will be essential to link and assist businesses in gleaning higher levels of
    change agility while

    increasing business profitability and satisfying constituents’ goals. See Figure
    1.8 for the goals businesses

    are looking to achieve with processes. We can see the role of more intelligent
    processes created,

    assembled, and managed by AI.


    # # Processes & Bots Can Direct Intelligence Applied to Outcomes


    ![](img/a4c90ee3d142c33743706d37c65779c2_41_0.png)


    Figure 1.8 – Desired process goals


    Process models as a critical representation of work progress will still be needed,
    but the role will likely

    change after the fact for at least the transparency of AI decisions and actions.
    AI is hard to audit, as are

    processes that employ AI. Process models, decision models, and other audit trails
    will aid businesses

    in trackability, bias, and privacy issues. As AI drives us into new laws and legal
    interactions, you can

    bet that after the fact, models will play a role. It can be assumed that process-modeling
    skills will

    be essential.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# What''s in it for my employer?


    Businesses need business models to keep their operations profitable and optimized
    in a changing world. It matters not whether process models are used in design
    or audit mode; key behaviors and improvement opportunities can be discerned by
    analyzing process instances. Constituents are serviced by extraordinary processes
    and the models that represent them. Simply ask customers or employees about the
    impact of a good or bad process.


    # What''s in it for me and my career?


    Understanding process models and their impact on various aspects of a business
    is an essential skill and will grow in importance during the creation and management
    of all operational, tactical, and strategic processes.


    # Creating visual/conceptual representations of an action journey


    Visualizations communicate better than most content and are great for collaborating
    across skill sets and organizational boundaries.


    # Enhancing the customer experience


    Extraordinary processes create loyal customers, and flawed processes chase customers
    away. In today’s world of change and lack of tolerance for poor interactions,
    tremendous and friendly processes help all constituents exude repeatable business
    and loyalty.


    # Delivering a balanced set of outcomes


    Extraordinary processes represented by process models not only deliver on the
    organizational goals of profitability but strike the balance of including customer
    goals and outcomes while pleasing employees who can walk to organizations with
    better processes.


    # Summary


    As you just read, the nature of processes will change over time. They will be
    involved in a dynamic dance of supporting changing goals within governance guidelines
    and constraints. Process modeling will be the explainable part of intelligent
    processes in the future. Until then, process models will be used to audit and
    optimize processes. Process models are a common communication vehicle for process
    planning and process auditing, whether the process is structured or dynamic; therefore,
    they are very valuable to organizations. Individuals will have to pick up modeling
    skills as visual communication becomes a key driver for future digital progress.'
  merge: -1
  img_proc: true
