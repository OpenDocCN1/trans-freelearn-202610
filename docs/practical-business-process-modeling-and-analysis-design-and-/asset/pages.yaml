- pgno: 326
  md: 'This example only contained BPMN extended with additional technical attributes,
    but it is also possible to extend BPMN with additional notations. For example,
    full case C.8.0 uses DMN and decision services to make some decisions about holiday
    requests fully automatic.


    # BPM+ (BPMN, DMN, and CMMN)


    We’ve already mentioned several times that OMG also created other standards that
    can be used together with BPMN. The trio of BPMN, DMN, and CMMN is called **BPM+**.
    This set of standards can be very useful in healthcare, but also in other areas.


    The **DMN** specification is a notation that allows business rules to be described
    in the form of decision requirements diagrams and an organization’s decisions
    to be automated.


    The **CMMN** specification deals with Adaptive Case Management, an area where
    it is not possible to specify exactly what needs to be done step by step since
    human decisions are needed. CMMN provides a graphical notation and interchange
    format for those purposes.


    While BPMN is mature, stable, and increasingly popular, DMN is not as popular
    yet, but is developing rapidly (as of June 2025, work on DMN 1.7 is in progress),
    while CMMN is not subject to such frequent updates (version 1.1 was published
    in 2016) and is the least popular of the three.


    # Why DMN?


    I find DMN a very interesting standard. It is gaining popularity rapidly and is
    very valuable for organizations with lots of complex rules that are frequently
    changing. Keeping those rules outside BPMN diagrams allows them to be easier to
    read and much easier to maintain.


    That’s because attempting to keep all the rules inside process diagrams would
    usually require a lot of gateways and additional tasks. This would not only make
    diagrams bigger but would often lead to other problems. Let’s see it in practice
    using our complaint-handling process.


    The process we’ve used so far (shown in _Figure 8.1_) assumed that the complaint
    documentation needs to be checked by an employee in some kind of IT system, automating
    the whole process. Based on a decision of an employee about complaint validity,
    two options were possible: a complaint could be rejected or found valid and accepted
    for further processing.'
  merge: -1
  img_proc: true
- pgno: 327
  md: 'Even though this process has IT support, this process would not be very fast
    since an employee needs

    to check all the documentation before the process can continue. How could we speed
    it up?


    While for some cases it may be necessary to involve the employee, perhaps we could
    identify cases

    where fully automated fast-track handling could be possible.


    For this example, I will assume that we can automatically reject cases where the
    complaint documentation

    does not confirm that the product was bought from our company. For cases that
    are not automatically

    rejected, we will have two types of handling. Some cases where it is obvious that
    the complaint should

    be accepted are accepted automatically to speed up the process, while cases that
    are not obvious are

    routed to employees so that they can be checked. This way, employees would only
    need to check

    complex cases while the rest could be done automatically.


    How should we decide whether a case is obvious or not? Perhaps if there were several
    valid complaints

    regarding the same product and delivery method within a short period of time,
    this means there is

    a common root cause of problems, so similar complaints should also be accepted.
    It would also be a

    valuable input for continuous improvement specialists, who could figure out what
    should be changed

    to avoid problems like this in the future.


    Maybe an additional rule could be suggested: for low-value complaints from long-term
    customers, we

    could automatically accept them too. This would probably trigger a suggestion
    to check whether those

    customers did not have too many complaints in the past year or too many rejections
    (to avoid fraud).


    Of course, real-life complaint-handling is much more sophisticated. We should
    consider more robust

    fraud protections (for example, not only covering cases of our long-term customers),
    ensuring that our

    process creates a good customer experience while gathering all the data needed
    for decision-making,

    plus ensuring legal compliance.


    This last point could be especially tricky if our company were serving customers
    in various countries

    with different legal systems because it would impact the way we handle customer
    data (e.g., GDPR for

    customers from the European Union), how returns are processed, and whether the
    customer gets all

    the necessary information about their rights regarding the complaint (e.g., that
    customers from the

    UK are informed that escalation to the Legal Ombudsman is possible and that vulnerable
    customers

    are treated fairly).'
  merge: -1
  img_proc: true
