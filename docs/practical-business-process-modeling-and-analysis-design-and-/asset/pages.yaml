- pgno: 55
  md: 'Think about this: our metaphors advance as technological progress advances;
    what does not change and stays constant is the definition of the business process.
    Many architects use the analogy of LEGO structures to represent business architecture.
    I have an issue with such a metaphor because this model assumes that networks
    of interconnected processes do not change or do not flex. If LEGO blocks were
    made from materials that twist, change shape, or stretch like slime, we’d add
    another dimension to this representation of our business. Another challenge I
    see is that LEGO blocks, once molded into a “house,” are a house. A business can
    process online orders one day, yet another day, its infrastructure may be used
    to deliver drugs to a country’s population, completely changing the business model
    and its purpose (and all design assumptions). What Amazon did during the COVID
    pandemic with the distribution of vaccines in the US is the best example of strategic
    adaptability at a massive scale.


    The massive scale and architectural and technical complexities of DTX are why
    we are focusing our book on managing DtC, with a laser focus on process-led transformations,
    a smaller but significant slice of the whole DTX pie. Small does not mean unimportant
    or insignificant.


    I’ve seen many small-scale projects that grew into programs over the years with
    the mission of completely changing the operations of the entire company. I was
    also part of large projects with lofty goals and armies of consultants that never
    grew outside one business unit. I have some theories about this phenomenon, and
    we will discuss those when we get into the **Business Value Assessments (BVAs)**
    and measuring ROI later in the book.


    The other issue with definitions of DTX that jumps at me immediately concerns
    using the term business process. Pay attention to the following phrases:


    +   - Bring together “process” to transform

    +   - Use business workflows to optimize, automate, and modernize

    +   - The use of digital technologies to create new or modify existing business
    processes

    +   - Digital capability empowers organizations to not only enhance existing processes
    and products but also improve or even create new business models

    +   - Apply technology to existing processes

    +   - And this one...

    +   - The rewiring of an organization


    Learning from such definitions while working with teams involved in DTX efforts,
    I wondered if the authors crafting them had lived through at least one project
    or a program. Use digital technology to create new business processes, enhance
    existing processes, and apply technology to existing processes – sure, that makes
    a lot of sense. How about the rewiring of an organization? Has anyone ever tried
    to rewire the whole company while on a project? Yes, these slogans would sound
    great when having a quick hallway discussion with the CTO or a CFO. After reading
    tons of so-called definitions, I concluded that, many times, authors’ intention
    was not to define; their intention was to sell – to sell digital technologies
    or supporting services to modernize business operations into a rewired version
    of your'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'organization that would magically appear from the abyss of your company’s legacy
    IT infrastructures like a phoenix. Throw more technology at your business problems,
    and your business problems will magically go away by “deploying tech at scale.”
    Another challenge with these definitions is that they don’t align with existing
    concepts from the business, process, and enterprise architecture domains used
    and practiced by influential professionals shaping DTX in many enterprises. To
    quote Jay Olvey, strategic business and process director and architect: “The challenge
    in today’s companies is not the lack of tech; it’s the lack of know-how of how
    to implement tech platforms in support of strategic company goals. It’s also the
    lack of a shared vision and performance metric alignment, along with communication
    and collaboration as well.”


    From the technical point of view, Microsoft’s definitions are most accurate, although
    I have an issue with the term workflow used in this context. It feels that the
    author of Microsoft 365’s explanation meant to say use business workstreams, not
    workflows. Workflows are instances of automated business processes executing activities
    and tasks within workflow orchestration engines, whether low-code, iBPMS platforms,
    or CRM systems. I reserve the right to be wrong in this case, given that I worked
    for Microsoft.


    Learning about advanced concepts from a variety of definitions can be challenging
    because universal truths don’t exist in the world of business. To say it differently,
    going after universal truths requires a lot of critical thinking and questioning
    of both authors’ intentions and the analysis of the timing of when such definitions
    were introduced to the market.


    As far as the “rewiring” of existing business processes goes, one of the most
    common challenges in the modern medium to large-sized enterprise is that many
    business processes are not well defined or undergo a cycle of continuous change
    that happens very quickly. These process-based operations are executed by teams
    utilizing a multitude of platforms and IT systems, but to risk repeating myself,
    many of these business processes are poorly designed, may not even be defined,
    or they exist as multiple variants, duplicated in various systems of records and
    Excel spreadsheets serving as workarounds. Poor process design leads to suboptimal
    execution, which is where this book should come to the rescue.


    Another elephant in the room worth mentioning: the majority of businesspeople
    in the modern enterprise, when asked about the definition of a business process,
    will stumble a little but most of the time will be able to explain in somewhat
    logical terms that a business process is a repeatable collection of steps a company
    uses to accomplish a goal with event-driven, end-to-end, and customer-oriented
    characteristics. Some will also add that a process is a standardized method the
    company or team uses to perform routine activities, and that they are critical
    to keeping your business on track and organized. BPM Institute’s definition is
    logical and easy to grasp. In subsequent chapters, we will dive deep into these
    definitions and build upon them to understand more advanced process concepts.


    The same person, when asked, may also bring an example of a business process they
    interact with daily, such as procure to pay, new employee onboarding, order processing,
    or customer onboarding. Things get tricky when you ask someone to capture the
    definition of their work. Sometimes it’s the notation; sometimes it’s the tooling;
    and sometimes it’s the fact that the knowledge about our work expressed through
    swim lanes is spread out across many teams, people, and time zones. Sometimes,
    different'
