    # # The statement-of-work approach and its benefits


    For large organizations, I recommend using statements of work to organize the
    service plays for your customers. These internal documents help clarify expectations,
    timelines, assumptions, and success criteria. When the service play meets its
    goal, it’s easier to evaluate satisfaction and share lessons learned. Avoid a
    self-service approach without guidance, as it’s crucial to integrate insights
    into your BPM playbook. In addition to custom playbooks, BPM CoE-in-a-box accelerators
    are available, offering best practices to quickly establish BPM CoEs. These toolkits
    can save time and effort with a proven framework, providing guidance on the following:


    +   - Business process governance

    +   - Project status reporting

    +   - Tracking delivered business value

    +   - Design and estimation standards

    +   - Access to reusable components and utilization

    +   - Simplifying automation platform onboarding

    +   - Learning paths for key CoE roles

    +   - Training for citizen developers


    # # What is the difference between a BPM CoE and a citizen developer CoE?


    Depending on your exposure to BPM, you might find it challenging to differentiate
    between a BPM and a citizen developer CoE. A BPM CoE is a centralized business
    unit that offers leadership, direction, and support for process transformation
    within your company. It streamlines and quickens BPM transfomation by coordinating
    activities, services, and resources. BPM CoEs are more closely linked to the business
    side. Conversely, a citizen developer CoE is an extension of the BPM program designed
    to enable employees to create their solutions using low-code and no-code platforms,
    such as Power Platform. Supported by a community nourished by the BPM program,
    the citizen developer CoE evolves alongside the BPM transformation. While BPM
    CoEs emphasize broad transformation, citizen developer CoEs empower staff to develop
    solutions and focus on technology, bridging ties to IT. In some instances, a citizen
    developer CoE can exist independently of a BPM CoE, which may suggest a gap in
    strategy or a still-developing program.'
