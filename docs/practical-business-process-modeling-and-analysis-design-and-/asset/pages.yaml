    # ## Professional networks


    Another effective way to discover and track new trends is by building and maintaining
    a strong professional network with other process professionals, experts, and peers.
    You can join online communities, forums, groups, or social media platforms that
    focus on BPM and DTX topics, such as BPM.com, BPM Forum, and Process Excellence
    Network.


    Additionally, you can participate in webinars, podcasts, blogs, and newsletters
    that showcase insights, best practices, case studies, and interviews with industry
    leaders and practitioners. Some notable sources include _BPM Leader_, _BPM Institute_,
    and _Process Street_.


    Furthermore, attending offline events such as conferences, workshops, seminars,
    and meetups offers great opportunities to network, learn, and exchange ideas with
    like-minded professionals. Popular events include BPM Conference, BPM Next, and
    OPEX Summit.


    My preferred method of connecting with fellow professionals is through LinkedIn
    groups. However, it’s important to recognize that many people may not openly discuss
    their work and projects due to confidentiality clauses and **non-disclosure agreements
    (NDAs)**. By following groups and companies that engage actively in BPM, rather
    than merely mentioning it in passing, you’ll discover organizations where genuine
    business transformation takes place.


    Here are some examples of groups to follow:


    +   - Business Process Management Professionals Group

    +   - Workflow/Business Process Management

    +   - Business Process Improvement

    +   - Workflow Management Coalition

    +   - World BPM Magazine

    +   - LinkedBPM


    # ## Academic and research sources


    One effective way to discover and track new trends in BPM and DTX is by following
    academic and research publications. These sources advance knowledge and innovation
    in the field. You can access journals, books, articles, reports, and white papers
    that present the latest findings and theories related to BPM and DTX. Notable
    examples include the _Business Process Management Journal_, the _International
    Journal of BPM_, and _IEEE Transactions on Services Computing_. Additionally,
    you can explore databases, repositories, or directories that collect and organize
    various resources related to BPM and DTX, such as the _BPM Academic Initiative_,
    _BPM Center_, and _BPM-Online_. Furthermore, consider engaging in'
  merge: -1
