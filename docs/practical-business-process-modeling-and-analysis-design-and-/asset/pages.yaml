- pgno: 339
  md: 'As projects are launched and progress, the visibility of OKRs and overall business
    value often diminishes. Daily workloads can take precedence, and discussions about
    future funding may exclude input from those directly involved. In large, matrixed
    organizations, business professionals might lack the opportunity for one-on-one
    interactions with leaders to showcase the success of their initiatives, making
    it challenging to connect their work to strategic objectives.


    Wise leaders understand that consistently generating small-scale business value
    can lead to significant impact without the complications of managing large-scale
    programs involving vendors and external consultants. These consultants often shift
    between projects, which require substantial oversight and incur the cost of acquiring
    institutional knowledge, adding additional expenses that may only be justified
    across larger transformations.


    Moreover, smaller transformations can propel much larger programs forward, as
    their direct impact tends to snowball over time when actual business challenges
    are identified, addressed, and operationalized. It is crucial to emphasize that
    democratizing digital change tools requires a similarly democratized approach
    to evaluating and measuring business value, even if that value appears small.
    Traditional project delivery mechanisms involving implementation teams present
    more challenges in a citizen developer scenario.


    # ## Data-driven continuous improvement


    The mantra “what gets measured gets managed” is particularly relevant in continuous
    improvement. By tracking **key performance indicators (KPIs)** linked to business
    value, organizations can identify inefficiencies, prioritize areas for optimization,
    and develop actionable roadmaps for digitization. Regular assessments of business
    value provide essential feedback, enabling companies to quickly adapt to reorganizations
    or changing market conditions, thereby confirming the benefits of technology-driven
    process improvement initiatives.


    The initial phase of this process can be challenging, as data collection involves
    gathering numerous data points and establishing baselines. While most leaders
    agree that data collection is crucial— echoing W. Edwards Deming’s saying, “In
    God we trust; all others must bring data”—disagreements can arise regarding which
    types of data to collect and when to collect it, as well as the formulas used
    to calculate business value.'
  merge: -1
  img_proc: true
