- pgno: 50
  md: '# Pillars of a Successful Digital Transformation


    According to **Forrester**: “Digital Transformation is the process of using digital
    assets to improve customer outcomes and operational agility. It is not just about
    applying technology to existing processes or experiences but reimagining a different
    business model that places technology at its core. Digital transformation is essential
    for businesses to survive and thrive in a changing industry landscape, and it
    requires digital maturity, agility, lean and fast execution.”


    Per **Gartner**, “digital transformation is a term used to describe the use of
    digital technologies to fundamentally change an organization’s business model.
    It involves the integration of digital technology into all areas of a business
    resulting in fundamental changes to how businesses operate and the delivery of
    value to customers.”


    **IDC** considers DTX as “the application of 3rd Platform technologies such as
    cloud, mobile, big data, and social, coupled with organizational, operational,
    and business model innovation to create new ways of operating and growing businesses.”


    **For MIT**, “digital transformation is the use of technology to radically improve
    performance or reach of enterprises. It involves integrating digital technologies
    and solutions into all areas of a company and is not only technological but also
    cultural in nature. DTX changes the conditions under which business is done, the
    ways that change the expectations of customers, partners and employees. Digital
    capability empowers organizations to enhance existing processes and products and
    improve or even create new business models.”


    **Harvard Business Review** sees DTX as “a process that involves the use of digital
    technologies to create new or modify existing business processes, culture and
    customer experiences. It can involve IT modernization, digital optimization, or
    the invention of new digital business models.”


    **BPMInstitute.org** defines DTX “as the process of integrating technology throughout
    and across an organization to fundamentally change the way it operates internally
    and presents its products or services externally.”


    **Microsoft** defines DTX as “bringing together people, data and processes to
    transform your company and create value for your business needs. It’s a business
    innovation fueled by the explosion of the cloud, AI, and the Internet of Things
    (IoT), providing organizations with new ways to understand, manage, and transform
    their business. It’s also the process of using new technologies and business workflows
    to optimize, automate, and otherwise modernize an organization’s business operations.
    Updating technological tools and approaches in this way helps organizations to
    improve internal processes, increase efficiency, and function with a greater level
    of flexibility and agility.”


    If you’ve been curious enough to read through the multiple preceding definitions,
    it’s hard not to notice that the rubber band applied to DTX is vast. The term’s
    meaning also varies based on the type of organization defining it. Consulting
    and analyst companies try to stay generic; with their global reach offering services
    and frameworks, some software vendors bring all technological pieces into the
    mix pretty quickly.'
  merge: -1
  img_proc: true
- pgno: 51
  md: "However, even the most prominent and focused tech vendors expand their definitions\
    \ of DTX over time as their technical capabilities offered to the market evolve.\
    \ Personally, I like the HBR, BPM Institute, and Microsoft definitions the most,\
    \ although what I am still missing in each one of them is the term strategic adaptability.\
    \ What I’ve learned in the past is that many companies pursue DTX to accelerate\
    \ the pace of internal change cascading through internal operations in response\
    \ to quickly changing market conditions, new legislation, or external market pressures.\
    \ Such an ability to evolve quickly can be extremely valuable in the marketplace,\
    \ quoting Darwin: “those who survive are the ones who most accurately perceive\
    \ their environment and successfully adapt to it.”\n\nThus, DTX can be a vast\
    \ topic, and even just having a conversation with anyone at your company about\
    \ it can be pretty challenging, as different people in your organization may have\
    \ different views of DTX. They can all be right, interestingly enough. The classic\
    \ fable by John G. Saxe, originating in India, explains the concept of the limitations\
    \ of perception.\n\n![](img/a4c90ee3d142c33743706d37c65779c2_51_0.png)\n\nFigure\
    \ 2.1 – “The Blind Men and the Elephant” fable by John Godfrey Saxe (1816-1887)\n\
    \nHere’s an excerpt from the fable/poem:\n\n> It was six men of Indostan\n> \n\
    > To learning much inclined,\n> \n> Who went to see the Elephant\n> \n> (Though\
    \ all of them were blind),\n> \n> That each by observation"
