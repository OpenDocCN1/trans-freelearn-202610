    # How does DTX start?


    In this section, I will focus on the five types of scenarios that can lead to
    the launch of a DtC program.

    Some efforts may ultimately lead to the DTX program involving parallel workstreams,
    and some never

    get enough support for enterprise-wide adoption. All five scenarios are based
