- pgno: 281
  md: 'If we wanted to show only the communication between pools, we could use a collaboration
    diagram with all pools collapsed, but this isn’t common.


    # # Good practices and errors to avoid


    Speaking of pools and lanes, it’s also worth remembering three BPMN modeling principles
    that can help us avoid many common mistakes (examples of which I’ve included in
    Figure 8.57):


    +   - The process flows within a specific pool and can move between different
    lanes, from the start event through various activities and gateways to the end
    event. It always flows along the sequence flow arrow (without “gaps” or “jumps”).


    +   - The sequence flow can only occur within the pool; it can’t cross the border
    of the pool.


    +   - The message flow can only occur between pools; it can’t take place within
    a single pool. This also applies to sending and receiving messages between lanes
    in the same pool.'
  merge: -1
  img_proc: true
- pgno: 282
  md: '![](img/a4c90ee3d142c33743706d37c65779c2_282_0.png)


    # ANTI-PATTERN


    Figure 8.57 – Anti-pattern – a summary of the most common errors related to pools
    and lanes'
  merge: -1
  img_proc: true
- pgno: 283
  md: '# # Responsibilities in a process – pools and lanes


    The first thing that strikes us is the sequence flow between **Task 1** and **Task
    A**, which are in two different pools. This is not in accordance with the rules
    of notation because the sequence flow can’t pass between different pools – it’s
    always related to a specific pool.


    If we take a closer look, we can also see a more subtle error – the process starts
    with **Start event 1** in **Pool 2** and then continues in **Pool 1**. This is
    also wrong because **Pool 1** should have its own start event, which would most
    likely have an incoming message flow coming out of **Task 1**.


    The next mistake is that **Lane 1** and **Lane 2** are too independent as they
    have their own start and end events, while the process should flow through the
    entirety of **Pool 1**. This would emphasize that the lanes are just divisions
    of the pool and the process is associated with the pool, not assigned to a specific
    lane.


    Another error that isn’t so easy to catch is that the message flow coming out
    of **Task B** doesn’t enter **Task 7** in **Pool 2** but is attached to the pool
    edge. Admittedly, BPMN allows us to start and end message flows at the edge of
    the pool, but this only makes sense for pools that don’t contain content (usually
    collapsed pools). If the pool does have content, then we should show precisely
    where our message flow is leading to or from.


    Errors occur in two more places: in **Pool 1**, we can see that **Task B** and
    **Task C** aren’t connected by the sequence flow. In **Pool 2**, on the other
    hand, we have a gap in the sequence flow between **Task 1** and **Task 7**. Both
    cases violate the rule that says that there can be no “gaps” or “jumps” in a sequence
    flow.


    In the case of **Pool 2**, we can also see that the process is incomplete. It
    has a start event and **Task 1**, but then there’s a break. Later, we can see
    that **Task 7** and **Task 8** exchange messages with the process contained in
    **Pool 1**, but we don’t know what comes after **Task 8** because there’s no end
    event at the end.


    This kind of modeling, in which we describe some but not all elements of a process
    and don’t even bother to connect them properly, isn’t appropriate.


    If we don’t need details, then representing the participant with a collapsed pool
    is enough. If we’re only interested in the elements that are important for communication,
    we use the public process, which may not contain all the elements (as in our example,
    where we have **Tasks 1**, **Task 7**, and **Task 8**), but it still needs to
    be valid. Of course, we could also model the process contained in **Pool 2** in
    detail.


    The last major error – sending messages within a single pool – also occurs in
    several places. The first time we saw it was between **End event 1** and **Start
    event 2**. This is a consequence of “slicing” the process into mini processes
    for each lane: not from the perspective of the whole organization (represented
    by the pool) but from the perspective of its organizational unit (represented
    by lanes).


    Of course, messages can’t be exchanged between **End event 1** and **Start event
    2** because we aren’t allowed to have message flows (or message exchanges) within
    a single pool.'
  merge: -1
  img_proc: true
- pgno: 284
  md: 'A second, slightly less drastic occurrence of the error related to message
    exchanges is seen at the end of **Pool 1**, where **Task D** and **Task E**, both
    of which are connected with a sequence flow, are marked as send and receive, respectively.


    This would only make sense if we were sending something to **Pool 2** and receiving
    from it, but we see nothing to indicate such use. Therefore, this isn’t correct
    – we aren’t allowed to send messages within a single pool, even if the reasoning
    goes: “But after all, I’m sending an email to colleagues in another department,
    and they receive it and get acquainted with its content.”


    The pools and lanes that we’ve become better acquainted with in this section can
    sometimes be extremely useful for conveying very important information about a
    process – that is, who’s involved in the process and who’s responsible for each
    step of the process. However, we might want to include some more information in
    our diagram.


    # # Adding more information to your diagram with artifacts


    As we already know, artifacts are used to convey more information about our diagram
    without affecting the way it’s interpreted and executed. In this section, we’ll
    learn more about **text annotations** and **groups**.


    # ## Text annotations


    The most used type of artifact is text annotation, which allows you to insert
    text into your diagram.


    This annotation is quite simple – it always has the shape of an opening square
    bracket, followed by text. Depending on our needs, we can only change the size
    of the object so that the text takes up more or less space.


    ![](img/a4c90ee3d142c33743706d37c65779c2_284_0.png)


    Despite this simplicity, annotations can be very useful. First, the text they
    contain is always visible within the diagram (unless, of course, we shrink the
    object so that the text no longer fits in the available space), making it easy
    to spot on the printout and accessible to viewers who aren’t BPMN experts and
    don’t realize that many objects may have additional, invisible information (descriptions,
    but not only). Thus, annotations allow us to convey relevant information relating
    to the context of the process.'
  merge: -1
  img_proc: true
- pgno: 285
  md: 'Second, because annotations are easy to see, we can use them to document problems
    in the process and ideas for improvement. Of course, such use mainly makes sense
    if the tool we’re using doesn’t offer a better change management mechanism.


    Third, text annotations can be used in a wide variety of scenarios. The BPMN specification
    defines quite a lot of different attributes, but – as we mentioned earlier – the
    authors decided that its goal isn’t to support all possible business modeling
    scenarios. So, if we’re using a tool that doesn’t provide support for time-cost
    analysis of a process, and wed like to show how much time it takes on average
    to execute individual process steps or classify process steps in terms of value-creation
    for documentation and improvement purposes, we can use annotations.


    In the same way, we could use a text annotation to record who is the process owner,
    or to document the purpose of a process or other attributes that are important
    to us.


    When using annotations, it’s worth remembering that anything we write in them
    is treated as text only – it doesn’t affect the behavior of the process being
    described, isn’t the basis for automating it, nor does it allow for more advanced
    analysis. We can jokingly say that annotations are the equivalent of colored sticky
    notes that we attach to important documents with information for recipients on
    what they should pay attention to, where to sign, and so on.


    Annotations can be linked to a selected element of the diagram, or they can refer
    to the diagram as a whole. In the first case, the annotation connects to another
    element (for example, a task) using an **association** arrow, which is indicated
    by a dotted line.


    ![](img/a4c90ee3d142c33743706d37c65779c2_285_0.png)


    Figure 8.59 – Text annotation and an association arrow


    In the second case, we can simply place the annotation *freely floating*, without
    connecting it to other elements of the diagram. We can see examples of both approaches
    in the following diagram fragment (*Figure 8.60*). The text annotation, which
    uses association, is linked to the start event, while the annotation that’s been
    placed *freely* shows how the process owner and its goal can be visualized.


    This diagram also illustrates some of the risks of using artifacts: they’re very
    useful for showing something important on a diagram, but the more you add, the
    worse the readability of the whole diagram gets, so it’s a good idea to exercise
    moderation.'
  merge: -1
  img_proc: true
- pgno: 286
  md: '![](img/a4c90ee3d142c33743706d37c65779c2_286_0.png)


    Figure 8.60 – Example of using annotations to provide additional information about
    a process


    # ## Groups


    Another type of artifact is a **group**. A group, like a text annotation, is always
    presented in one way. It’s shown as a rectangle with rounded corners, but it’s
    very difficult to confuse it with tasks and sub-processes because it has a very
    distinctive line composed of alternating dashes and dots (like in the Morse alphabet)
    and doesn’t connect to other elements of the diagram via an arrow.


    # ### Group


    ![](img/a4c90ee3d142c33743706d37c65779c2_286_1.png)


    Figure 8.61 – Group


    A group is used when we want to draw the recipient’s attention to the fact that
    the selected diagram elements have something in common – they belong to a certain
    common category. If we wanted to use a similar analogy as in the case of a text
    annotation, we would say that the use of a group is like marking certain elements
    of a document with a highlighter.


    In practice, adding a group involves adjusting its size to cover all the elements
    we want to have, and giving it a proper name that suggests what those elements
    have in common. This allows us to highlight diagram elements that represent a
    happy path or elements that will be handled in a similar way (for example, “To
    be eliminated after the implementation of XYZ system”).'
  merge: -1
  img_proc: true
- pgno: 287
  md: '![](img/a4c90ee3d142c33743706d37c65779c2_287_0.png)


    Figure 8.62 – Example of using a group to highlight part of a process'
  merge: -1
  img_proc: true
- pgno: 288
  md: '# Showing data flows in a diagram with data objects


    The BPMN specification also allows other types of artifacts to be added to diagrams.
    However, this is more of a theoretical possibility as they would have to be supported
    by a process modeling tool, something we don’t encounter very often in practice.
    It’s worth remembering that according to the rules of the BPMN specification,
    they would have to look different from the objects that have already been defined
    – that is, you can’t create a new type of artifact, which would be a circle with
    a single thin border (because such a symbol is already reserved for the start
    event), but the shape of the polygon would be allowed.


    The artifacts that were covered in this section make it possible to expand the
    BPMN diagram with additional information, but in a way that doesn’t translate
    to how the process is interpreted and executed.


    Now, it’s time to discover the last category of BPMN objects. These objects allow
    us to add more context about a process to the diagram but in a way that can be
    (at least in theory) more than purely informational.


    Data usage is another area where BPMN goes beyond its core focus of describing
    a process. It’s worth noting that the elements we’ll discuss in this section make
    it possible to show how data flows within a process, but that’s not all that IT
    professionals may need to model the data adequately – for example, they don’t
    provide support to ensure that data structures and their dependencies are represented.


    It’s also worth noting that the data layer in BPMN often has a weaker level of
    support in IT tools – especially those for process automation – than other elements
    of the notation. Many process automation tools use their methods for describing
    the data in a process, so the data modeling concepts included in the BPMN specification
    are often treated only as documentation and have no impact on how the process
    is executed. There are even situations where automation tools remove data objects
    when importing diagrams from other modeling tools!


    As we know, the basic object for representing data is the data object. Its symbol
    looks like a piece of paper with a folded top-right corner. However, it’s worth
    noting that a data object may or may not correspond to a physical document (the
    specification emphasizes that data can refer to physical or informational elements).
    Often, we use it to describe a certain set of data that’s processed as part of
    a process. Examples of such data may be “Complaint documentation,” “Transfer data,”
    and “Waybill”


    ![](img/a4c90ee3d142c33743706d37c65779c2_288_0.png)


    Figure 8.63 – Data object'
  merge: -1
  img_proc: true
- pgno: 289
  md: 'In addition to the name, data objects frequently have a status presented in
    square brackets after the name. Thanks to this status, we can immediately see
    what changes our data undergoes due to actions within the process. For example,
    in our process for the **complaint documentation** data object, we could define
    the following states: for analysis, rejected, accepted, and closed. Of course,
    such a way of modeling takes up more space, but it allows us to describe what
    happens in our diagram in terms of data in more detail.


    To show how data flows between activities within a process, we use **data association**
    arrows. Because they have arrowheads at the end, you can immediately see where
    the data is flowing from and to. Importantly, the data flow doesn’t have to coincide
    with the process flow, so we can have a sequence of ABCD tasks and a data flow
    where data comes out of task A and is the input for task D (assuming that it isn’t
    processed in steps B and C).


    ![](img/a4c90ee3d142c33743706d37c65779c2_289_0.png)


    Figure 8.64 – Using data associations to show the data flow


    It’s also worth mentioning that neither data objects nor data stores (which we’ll
    deal with in a moment) can be connected with tasks via a sequence flow. This kind
    of mistake is especially dangerous for people with long flowcharting experience
    who started using BPMN with simple diagramming tools, which often don’t have built-in
    rules for correct notation.


    Speaking of the data layer in BPMN, it’s good to be aware that a standard type
    of data object is something that’s processed as part of a given process – a kind
    of variable held in the computer’s RAM that’s “cleaned up” when the computer is
    turned off. This means that after a particular process instance is terminated,
    we have no way to reach this data as it isn’t permanent!


    If we want to show that the data in our process is stored permanently, we should
    use another type of object – a **data store**. A data store is represented by
    a database icon (cylinder). Here, you should be aware of another surprise – although
    its appearance suggests that the data is stored in electronic form, data stores
    can be used in physical form, such as filing cabinets.


    ![](img/a4c90ee3d142c33743706d37c65779c2_289_1.png)


    Figure 8.65 – Data store'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'Data stores can also connect to other diagram elements via data association
    arrows to show how the data flows. If the diagram is quite large, we may want
    to avoid too many connectors coming to and from the data store. In this case,
    it’s possible to insert the data store with the same name several times into different
    parts of the diagram to increase its readability. If you’re interested in the
    technical aspects, in this situation, our diagram has one data store definition
    and several references to this common definition, but this can only be noticed
    by analyzing the BPMN diagram export file.


    Since data stores look like stylized databases and because BPMN doesn’t have anything
    better to visually represent IT systems used in a process, it’s common to see
    data stores that represent applications used in a process. Of course, this is
    usually the case for simple modeling tools that don’t have shared repository mechanisms
    and dictionary definitions.


    The last two types of data objects are used to show data entering and leaving
    the process. These are called **data input** and **data output**, respectively.
    Since they represent data incoming and outgoing from a process, they don’t share
    non-permanent characteristics of plain data objects.


    The symbols for data input and data output are very similar to those for normal
    data objects, but they have an additional arrow icon in the top-left corner. As
    you may expect, the rules of marking activity and passivity in BPMN are kept,
    so the data input icon (data that enters a process, such as from a preceding process)
    has a light fill, while the data output icon (data leaving a process, perhaps
    to another process) has a dark fill.


    ![](img/a4c90ee3d142c33743706d37c65779c2_290_0.png)


    Figure 8.66 – Data input and data output


    In addition to the icons symbolizing types of data objects, there may be another
    marker – three vertical dashes. This is called a **collection**. In practice,
    such a marker can occur when we want to show that we’re working with not one invoice,
    but a whole bunch of invoices, or that we’re entering multiple items into the
    CRM system to be included in the offer we want to generate. Often, if we use this
    marker with data objects, we should consider whether the tasks and sub-processes
    in our diagram have been described in a way that indicates that more items are
    being processed. We’ll learn more about this topic in _Chapter 9_:


    ![](img/a4c90ee3d142c33743706d37c65779c2_290_1.png)


    Figure 8.67 – Collection'
  merge: -1
  img_proc: true
- pgno: 291
  md: 'A final interesting aspect related to data objects in BPMN is the accessibility
    of this data within multi- level process diagram structures. Within a single diagram,
    the behavior is quite logical as the data object contained in that diagram can
    be accessed by all activities from that diagram.


    But what happens if we insert a sub-process into our diagram that leads to another
    diagram, which also contains another data object? The data object located in the
    higher-level diagram will be accessible to all activities in its diagram and the
    lower-level diagram, but (and this is worth noting) the data object located in
    the lower-level diagram will only be accessible to the sub-process in the higher-level
    diagram, activities from its diagram, and possible activities from even lower-level
    diagrams.


    This may have sounded a bit technical, and for good reason – data modeling is
    a slightly more advanced element of BPMN that’s more useful in diagrams that are
    created with more sophisticated process analysis in mind. Before using the data
    objects and stores in diagrams intended to serve as process documentation for
    a wide audience, we should think carefully about whether it will help us achieve
    our communication goal.


    The same will be true for further elements of notation, something we’ll discuss
    in the next chapter. They offer many interesting possibilities, but they may not
    always be intuitive for everyone, so they should be used with caution.


    # ## Summary


    In this chapter, you learned about the most important elements of BPMN. With the
    help of BPMN, you can create diagrams that not only serve as process documentation
    and process analysis but also create the foundation for future process automation
    programs. The elements we learned about are very popular and most of them should
    be intuitive for people who read the diagrams, even if they’re not BPMN experts.
    Usually, it is a good idea to start with a diagram using such easy shapes and
    iteratively work on it by adding descriptions to the process steps or (when needed)
    providing more information using additional elements of BPMN.


    In the next chapter, we’ll cover more advanced concepts and shapes from BPMN based
    on what we’ve learned so far.


    # ## Further reading


    If you would like to learn more about the concepts covered in this chapter I would
    suggest checking BPMN Quick and Easy Using Method and Style: Process Mapping Guidelines
    and Examples Using the Business Process Modeling Standard from Bruce Silver –
    well known expert.


    In addition to the resources for this chapter available on `https://github.com/
    PacktPublishing/Practical-Business-Process-Modeling-and-Analysis/tree/ main/Chapter08`.
    I would also recommend checking the official webpage of the standard: `https://
    www.bpmn.org/`.'
  merge: -1
  img_proc: true
