- pgno: 97
  md: '# # Communicating and aligning the vision and strategy


    As with most projects in the business world, communication plays a key role. What
    remains unseen does not exist, and what’s communicated poorly usually does not
    get support.


    Launching a successful transformation takes quite a few activities, and if you
    are scrambling for resources, the timing of everything can make execution even
    more challenging. To help you succeed, start small, then expand to road shows,
    office hours, newsletters, workshops, project go-live celebrations, and perhaps
    even DTX days to create multiple opportunities to communicate your team’s mission
    and the opportunity for your company.


    If you start by prioritizing the right level of executive sponsorship and building
    the foundation of your citizen developer community, you will find yourself involved
    in discussions about potential project opportunities. These conversations will
    offer further validation that your pursuits are pertinent, necessary for the company,
    and appealing to the correct audience. By concentrating on recognizing genuine
    business challenges and addressing them with your skills and enthusiasm, individuals
    will respond positively to your message and embrace BPM as a practice that tackles
    real business issues.


    While working for one of my previous organizations, I was able to launch and grow
    a digital process automation practice to complement our process **center of competency
    (CoC)** under challenging business conditions in an environment that was IT-centric
    and did not support citizen developer initiatives. I accomplished my objectives
    on a shoestring budget with the support of my CoC director, who understood the
    power of process-led transformations and suggested taking a very entrepreneurial
    approach. My boss built a robust process culture, and he was trying to spin the
    wheel of BPM into its next cycle, expanding on the vision of the process-oriented
    enterprise into automated and optimizing stages. I helped the team carry the wheel
    momentum to the next program cycle, building the adoption wave from 0 to 60 citizen
    developers, navigating through meanders of corporate politics and not always opportunistic
    timing. Growing grassroots programs is not easy; it can take a bit of time and
    requires a long-term view of the place of the business process in the company
    strategy.


    Experienced leaders, enterprise and business architects, and management consultants
    typically recognize that BPM and business processes lay the groundwork for successful
    DTXs. It’s not merely about AI, low-code platforms, or the cloud; all technology
    aims to aid companies in executing their business processes more efficiently,
    quicker, at a lower cost, and with greater adaptability. Numerous technologists
    will attest that when business processes evolve, they often do so rapidly, causing
    the tech sector to race to support these changes.'
  merge: -1
  img_proc: true
