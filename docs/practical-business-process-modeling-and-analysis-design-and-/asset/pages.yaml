- pgno: 203
  md: 'As you can see, it is pretty difficult to get a good overview of what is happening
    in this process simply by reading the text. Table 7.3 allows you to see how the
    tabular form of a process description may increase the readability a bit. While
    this is a step in the right direction, it does not make a huge difference either
    (e.g., the reader needs to guess that after step 5, we finish the process and
    do not continue with step 6, as they represent two mutually exclusive process
    flows).


    | # | Name of the step | Responsibility |

    |---|---|---|

    | 1 | Complaint valid? Yes – go to step 2 No – go to step 8 | Complaint specialist
    |

    | 2 | Inform the customer about the complaint’s validity | Complaint specialist
    |

    | 3 | How to handle a complaint? Replacement – go to step 4 Refund – go to step
    6 | Complaint specialist |

    | 4 | Order shipping of the replacement product | Complaint specialist |

    | 5 | Ship product | Logistics specialist |

    | 6 | Order refund | Complaint specialist |

    | 7 | Process a refund | Finance specialist |

    | 8 | Inform the customer about the rejection | Complaint specialist |


    Table 7.3 – Tabular description of a process'
  merge: -1
