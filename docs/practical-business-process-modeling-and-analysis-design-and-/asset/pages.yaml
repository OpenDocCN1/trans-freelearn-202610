- pgno: 108
  md: '# # How do you grow your BPM expertise?


    A BPM transformation is an educational journey that involves cultivating and refining
    the process skills and competencies of those involved. These BPM skills and competencies
    encompass the knowledge, abilities, and behaviors necessary for the effective
    identification, execution, and management of business processes, including workflow
    automation. They can be categorized into four distinct groups aligned with the
    BPM life cycle:


    +   - **Process design**: The skills and competencies to analyze, model, and redesign
    business processes

    +   - **Process implementation**: The skills and competencies to automate, integrate,
    and deploy business processes as workflows

    +   - **Process monitoring**: The skills and competencies to measure, evaluate,
    and control business processes

    +   - **Process improvement**: The skills and competencies to identify, prioritize,
    and implement process improvement


    In addition to these categories, there is a subset of equally important skills,
    such as presentation and public speaking, strategy development, critical thinking,
    and evangelism.


    How can you grow your BPM expertise and become a BPM professional? How can you
    acquire and improve the BPM skills and competencies that are relevant and valuable
    for your role and organization?


    In Chapter 4, Long-Term Trends and the Impact on Your Job, we will explore the
    various sources and methods to increase your expertise, such as the following:


    +   - Learning from BPM literature and research

    +   - Participating in the BPM training and certification programs

    +   - Joining the BPM communities and networks

    +   - Applying the BPM tools and techniques

    +   - Practicing the BPM principles and methods

    +   - Receiving feedback and coaching'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# # How do we drive measurable results?


    A BPM transformation is a performance-focused effort designed to achieve quantifiable
    results that validate the investment and labor involved. These measurable outcomes
    are concrete, quantifiable indicators reflecting the success and influence of
    the BPM transformation. According to the balanced scorecard framework, measurable
    results and outcomes are categorized into four types:


    +   - **Financial**: The results and outcomes that affect the financial performance
    and profitability of the organization


    +   - **Customer**: The results and outcomes that affect customer satisfaction
    and loyalty to the organization


    +   - **Internal**: The results and outcomes that affect the operational efficiency
    and quality of the organization


    +   - **Learning**: The results and outcomes that affect the innovation and growth
    of the organization


    How can you drive measurable results and outcomes from a BPM transformation? How
    can you define and track the **key performance indicators (KPIs)** that can measure
    the value and benefits of the BPM transformation?


    In the following section, I will emphasize the most effective practices and strategies
    to achieve tangible results and outcomes from a BPM transformation, such as the
    following:


    +   - Aligning the BPM transformation goals and KPIs with the organizational strategy
    and vision


    +   - Setting the **specific, measurable, achievable, relevant, and time-bound
    (SMART)** objectives and targets


    +   - Collecting and analyzing the data and evidence to monitor and evaluate the
    BPM transformation performance


    +   - Reporting and communicating the BPM transformation results and outcomes
    to stakeholders and users


    +   - Recognizing and rewarding the transformation’s achievements and successes


    +   - Learning and improving from the transformation’s feedback and lessons'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# # Establishing CoEs


    A BPM transformation is a collaborative initiative that requires coordinating
    and integrating the BPM activities and resources across the organization. A CoE
    is a centralized and dedicated unit that provides the organization with BPM leadership,
    guidance, and support.


    A CoE can help to facilitate and accelerate the BPM transformation as follows:


    +   - Evangelizing the need for business process transformation and ongoing support

    +   - Defining and enforcing standards and policies

    +   - Providing and managing tools and platforms

    +   - Developing and sharing knowledge and best practices

    +   - Building and nurturing a process culture and community

    +   - Leading and sponsoring projects and initiatives

    +   - Coordinating and aligning BPM stakeholders and partners


    How can you establish and run a CoE for your BPM transformation?


    When is the right time to start one? What are the key elements and factors to
    consider when designing and operating a CoE? What is the difference between a
    BPM CoE and a citizen developer CoE?


    In this section, we will explore the steps and challenges related to establishing
    the CoE for your BPM transformation, such as the following:


    +   - Determining the scope and functions of the CoE

    +   - Securing the funding and resources

    +   - Selecting and organizing the team and roles

    +   - Developing and executing the strategy and plan

    +   - Measuring and improving the CoE performance and value

    +   - Adapting and evolving the CoE to the changing needs and expectations


    # # CoE timing dilemma


    One of the most pressing questions I’ve heard asked when companies are either
    amid a transformation or considering starting one is when a good time is to establish
    the BPM CoE.


    Why would we want to invest in one if we only have a single project in motion?'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'For many professionals and leaders, creating a CoE when they are either just
    starting to adopt low-code DPA tools or are simply discussing the need and potential
    benefits is a bit of a chicken-and-egg discussion. Which one should come first?


    ![](img/a4c90ee3d142c33743706d37c65779c2_111_0.png)


    Figure 3.13 – Do I need a CoE to be successful with my BPM initiative?


    When you are just beginning your journey, you have not yet established yourself
    as a business process champion, let alone have a team to support the mission.
    At this part of your journey, you are most likely looking for any free support
    you can get.


    You’d like to start small and gain experience with new concepts and technologies
    without attracting attention to your mistakes. It seems like a bad idea to throw
    the CoE discussions into the mix unless you are in a group of companies that already
    have their CoEs firmly established.


    While requesting CoE funding might seem ambitious, I want to share some insights
    from other companies’ experiences to shift your perspective.


    Planning and strategizing for the CoE should be a thoughtful exercise that incorporates
    strategy, meticulous planning, and several targeted assessments. This comprehensive
    preparation will position you well to request funding. However, planning for the
    CoE does not imply that you’ll immediately create job postings for it.


    The long-term value of strategic planning aids in adapting your transformation
    approach, even amid changing plans (which are inevitable). Planning is essential;
    without it, we set ourselves up for failure.


    Initiating small does not mean brief efforts. Many companies demonstrate that
    BPM transformations are extensive, spanning several months to years.'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# # The Wheel of BPM Driving Your Competitive Advantage


    When I started my first BPM project in 2005, I never imagined managing BPM at
    an enterprise level years later. With nearly two decades of experience across
    four employers, I see BPM as a practice that has grown significantly. My initial
    BPM transformation expanded from a single implementation to over 35 programs across
    various business domains over 6 years. Initially, my employer was unprepared for
    the need for a CoE as those BPM projects began. Recognizing this requirement earlier
    could have saved substantial person-hours, though it doesn’t mean forming teams
    for yet-to-exist initiatives. Many projects weren’t conceived at the beginning.


    Over the years, there has been persistent confusion between BPM transformations
    and technology-driven transformations due to rapid developments in DPA software
    platforms, low-code tools, AI, and marketing campaigns. Technology transformations
    tend to attract more attention due to their innovative and appealing software
    elements.


    Concentrating on CoE planning activities enables you to foresee the changes that
    will unavoidably impact you and your initiatives. In my experience as a BPM professional,
    I have witnessed significant enhancements in various areas, such as the following:


    +   - Intelligent automation

    +   - Cloud-based processes

    +   - Robotic process automation

    +   - Low-code platforms

    +   - Process mining

    +   - AI-driven adaptive processes

    +   - The sprawl of social channels and chatbots used to interact with our businesses

    +   - CoE-in-a-box accelerators

    +   - The advent of process frameworks

    +   - Standardization of DMN and CMMN

    +   - Universities starting to offer advanced BPM degrees, such as Stevens Institute
    of Technology, **Queensland University of Technology (QUT)**, University of Liechtenstein,
    and the University of San Francisco


    When I embarked on my BPM journey in 2005 at a pharmacy benefits management company
    in Southern California, I couldn’t have anticipated the developments that would
    follow. In 2025, BPM practitioners and citizen developers entering this field
    can expect significant technical innovations over the next two decades, closer
    integration of practice areas, and increased automation capabilities at progressively
    lower costs. However, these advancements will not necessarily make it easier or
    less effortful for practitioners to grasp the fundamental principles involved.'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'Viewing BPM as an evolving science is essential for sustaining your team, advancing
    your career, and supporting your employer’s transformation initiatives. Shift
    your perspective from short-term goals and deliverables over the next 1–3 months
    to a long-term vision because you, like me, might find yourself dedicated to this
    field for many years.


    Initiating CoEs can often be politically sensitive. Without firm executive support,
    it might be wise to initially refrain from labeling your efforts as a CoE. Proclaiming
    excellence too early can draw scrutiny and questions for which you may not yet
    have prepared answers. Instead, refer to your work as a _community of practice_
    while you concentrate on establishing the CoE operating model. When the time is
    right and your executive sponsor recognizes your efforts, you can seamlessly transition
    into a fully-fledged CoE.


    For the CoE to become formally recognized by your organization, you will need
    the following:


    +   - Official support and backing from your leadership

    +   - Broad peer recognition

    +   - A couple of successes behind your belt, demonstrating your expertise and
    your level of influence

    +   - Clearly defined service offering that’s relevant and mature enough to be
    offered to other parts of your business

    +   - Several tools and best practices that will keep the wheel of BPM in motion


    Direct engagements with the CoE champion or team should clearly showcase the benefits,
    the value proposition, and the high standards of services provided by the team.
    Effective selling should primarily be through actions rather than slide presentations,
    with the latter serving as supporting materials. Prematurely claiming the status
    of CoE can have negative repercussions, as corporate dynamics generally do not
    favor self-proclaimed centers of influence.


    In any organization, several teams might aspire to establish themselves as the
    CoE. This is because many individuals face similar challenges, and comprehensive
    information on addressing these issues using low-code technologies is widely accessible.
    Additionally, your company is likely targeted by software vendors promoting their
    tools and the concept of CoEs. Many perceive working on the CoE as more appealing
    than their routine responsibilities. After all, who wouldn’t want to be part of
    a team that garners attention from across the entire organization?


    That’s why securing executive buy-in is so essential. Don’t let multiple CoEs
    emerge, as this will lead to chaos and indicate misaligned leadership. I have
    worked at a large company where an IT-sponsored BPM CoE and a business BPM CoE
    were competing for resources, projects, and recognition, due to leaders being
    unable to collaborate toward a common objective. This approach undermines the
    principles of BPM, which aim for unified operations between business and technology
    practices. It also highlighted the inexperience of key executives who couldn’t
    unite for a greater purpose. Ideally, you want a single BPM CoE, even with multiple
    satellite teams executing parallel functions within a _tribe of tribes_ model.'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'These tribes should optimize company resources by consolidating and sharing
    IT assets such as competitive intelligence reports, cloud services, and teams
    conducting shared tasks such as testing. Each BPM CoE should offer a mix of business-oriented
    and technical services. If you allow BPM to break into separate teams, your projects
    will become fragmented as well.


    It’s best to think of the CoE as a cross-disciplinary team dedicated to establishing
    a long-term plan of execution in support of the executive vision. It systematically
    handles BPM and automation projects that align with your company’s culture and
    limitations. Additionally, it is responsible for defining and assessing the ROI
    of the transformation, providing a comprehensive perspective of your units’ initiatives.


    ![](img/a4c90ee3d142c33743706d37c65779c2_114_0.png)


    Figure 3.14 – Driving enterprise business transformations requires a cross-disciplinary
    CoE


    The CoE must demonstrate to its sponsors that the allocation of company resources
    has effectively achieved strategic objectives while delivering the desired ROI.
    Typically led by a senior manager or director, a well-established CoE has a mission
    that aims to capture and disseminate knowledge and best practices, ensure consistent
    standards, support various projects, and manage the shared services utilized by
    the program. The CoE evolves into a team dedicated to aiding other teams with
    advocacy, enablement, and technical assessments. It also acts as an informational
    hub for leaders seeking to align their initiatives with different segments of
    the company.


    CoEs may oversee relationships with software vendors, delivery services, and consulting
    firms; however, they must remain vigilant in preserving the objectivity and independence
    of their vision and the company’s interests.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# # How to select a digital business platform


    Markets and business requirements change over time, and the technology revolution
    consistently uncovers new capabilities that eventually enhance process digitization.
    Such progress frequently occurs through rapid, significant advancements rather
    than gradual evolution. Few software vendors are capable of supporting both the
    current technological landscapes and quickly emerging areas of innovation.


    Choosing the wrong digitization platform could reveal that your vendor’s vision
    does not align with yours; they may struggle to keep up with new market trends
    or fail to scale their resources to meet your business needs. You might also discover
    that your organization is at odds with the culture of the software vendor providing
    their expertise and tools. This could be due to differences in company culture,
    the relationship between your sponsor and the vendor’s account executive, or biases
    within leadership teams.


    It’s also easy to fall into the trap of making the BPM CoE a launch pad for software
    sales teams promoting process and workflow automation tools. In such cases, recall
    that even highly reputable vendors will push their agendas to boost platform adoption
    success. If a vendor’s transformation vision and track record don’t deliver results
    for your organization, you may ultimately need to seek alternative solutions with
    similar capabilities.


    The following visual illustrates the approach to selecting the best software platform
    for your company to support your long-term DTX strategy:


    ![](img/a4c90ee3d142c33743706d37c65779c2_115_0.png)


    Figure 3.15 – How to pick your DTX ecosystem'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'While I’m not suggesting that vendors are working against you—most have the
    best interests of their customers at heart—the reality is that many still exaggerate
    their capabilities by claiming they can fully automate a wide range of business
    processes to enhance their appeal. Typically, customers engage with two to three
    digital business software vendors to mitigate such risks, each provider focusing
    on specific areas of automation or addressing particular needs within the BPM
    framework. Analyst firms such as Forrester, Gartner, and IDC offer specialized
    tool rankings and commercial reports that shed light on the capabilities of various
    platform vendors, helping to manage these risks. However, it’s important to note
    that these assessments do not always consider project execution factors. Drawing
    from experience in implementing BPM across multiple companies, using a portfolio
    of tools deemed best-in-class by analysts does not invariably result in superior
    DTX outcomes. Practitioners often have divergent views on what constitutes value
    and excellence compared to those of analysts. Nonetheless, resources from Gartner
    and Forrester should not be disregarded; they provide valuable insights into market
    trends and the broader scope of process digitization.


    # BPM CoE mission statement examples


    Let’s review a few examples of CoE mission statements highlighting roles and responsibilities.


    Here is example 1:


    > “We exist to drive VALUE to our customers and shareholders.”


    > We exist to remove friction and gain stakeholder alignment in our core and strategic
    processes.”


    Here is example 2:


    > “We believe that a mature BPM program unlocks our ability to deliver customer
    wins and improve the efficiency and effectiveness of business activity. We accomplish
    these things by partnering with our stakeholders to embed BPM best practices that
    include: process discovery & architecture, analysis & improvement, work automation,
    process performance management, and optimization.”


    For example 3, let’s review a mission statement from a hypothetical company headquartered
    in the Pacific Northwest of the United States:


    > “The business process center of excellence team provides expertise in BPM practices
    and related automation technologies to drive efficiencies across our company.
    We drive best practices, process culture, and risk management services to help
    you drive successful digital change programs at optimal cost.”


    As demonstrated by the preceding examples, mission statements usually remain broad
    and avoid mentioning specific tools or vendors, instead concentrating on the capabilities
    offered by the team in line with the wheel of BPM. After creating your mission
    statement and solidifying a transformation strategy that links the CoE’s mission
    to your organizational transformation goals, it’s time to identify the expert
    services you and your team can provide from the service catalog. These expert
    services will encompass business, process, and technology, delivered through the
    BPM playbook.'
