- pgno: 369
  md: '# # A Few Final Thoughts


    In this book, you have had a chance to learn how modeling and analysis of business
    processes can support digital transformation. This chapter provides a summary
    of the most important ideas from the whole book. You will also find further ideas
    that will help you improve and practice your process modeling skills, but also,
    more importantly, create value for your organization.


    In this chapter, we’re going to cover the following main topics:


    +   - Recap of the key ideas

    +   - Your next steps


    # ## Recap of the key ideas


    We started by discussing how process modeling supports successful digital transformation
    in Chapter 1, Winning at Digital Transformation with Process Modeling. Processes
    are the key to operational excellence (which leads directly to better financial
    results), effectiveness, and the building of an exceptional customer experience.
    Good processes are efficient, effective (often thanks to process automation),
    transparent, flexible, and compliant.


    Well-managed business processes can give an organization a competitive advantage
    because, while competitors can acquire the same technology, replicating effective
    business processes is a challenging task.


    That’s because business processes require collaboration among many people from
    different teams, who perform various tasks throughout the process. Without process
    models, even people in the same organization would not grasp the overall design
    of a process with all its dependencies. Good process models facilitate communication
    but also allow process analysis and improvement.


    While process automation has been a very popular concept for several years, there
    are still many areas where digital transformation is needed, because many high-volume
    processes still do not operate optimally. There are several reasons for that.
    Among others, knowledge work can be challenging to automate (even with the support
    of AI). Many people don’t understand process theory, apply the wrong'
  merge: -1
  img_proc: true
- pgno: 370
  md: '# # A Few Final Thoughts


    tools for the job, or there are too many processes in the company to pursue, eliminating
    the ability to track and automate all of them using the top-down approach with
    a small group of specialists. While searching for digital transformation drivers
    for your organization, consider which topics are most relevant. The more mature
    your process management is, the easier it is to both improve the customer experience
    and make processes more efficient (more transparent, faster, and cheaper to run
    and change).


    Process models illustrate the connections between processes’ activities and resources
    providing a shared understanding of the current situation and helping build a
    consensus regarding the future solution. However, we need to consider aspects
    beyond processes in our modeling to better understand how organizations operate
    and to enable smart processes to utilize AI. It is important to note that different
    modeling approaches can benefit varying needs. Various styles (e.g., structured
    processes, case collaboration, and IoT/bot collaboration) offer modeling guidelines
    based on complexity and purpose. The adoption of GenAI tools already helps to
    jump-start process models for team members by creating models from verbose descriptions
    through prompting, or through AI-supported modeling tools such as **ADONIS** (with
    AI Assistant), Camunda’s **Copilot**, or **Lucidchart**. For example, Camunda
    Copilot’s intuitive suggestions become actionable advice, enhancing quality and
    accelerating the development of process maps. These AI-powered suggestions improve
    the accuracy and efficiency of BPMN processes , ultimately accelerating overall
    development. Using these suggestions speeds up the creation of process models
    and saves time and resources while educating users about the art of the possible.


    The other new area of opportunity for process modeling involves modeling the interactions
    of AI agents, thereby augmenting both human and machine resources. In the very
    near future, autonomous agents will become the primary controllers of processes,
    managing dynamic interactions and monitoring outcomes in real time. Being able
    to grasp and visualize these process interactions may determine whether AI-driven
    actions meet the standards of responsible AI policies or emerging legislations.
    The value AI brings to process modeling will depend on how AI affects the actual
    processes modeled and whether the process models represent future designs or representations
    of exact execution, in-flight, or after the fact, when combined with process and
    data mining. Ultimately, as AI becomes the controlling manager of processes, from
    the dynamic assembly of process components and the execution of processes to monitoring
    process outcomes and adjusting and compensating in real time, your process architecture
    will offer a set of boundaries, ensuring humans are still in control of their
    end-to-end processes.


    Your key takeaway from _Chapter 1_, is to start by identifying the business goal
    behind your digital transformation initiative so that it is clear what you want
    to achieve and how it impacts your processes.


    In _Chapter 2, Pillars of a Successful Digital Transformation_, we explored digital
    transformation. It is a complex topic, and there is no single source of truth
    or commonly agreed-upon definition of it. However, many definitions emphasize
    that it is not about using technology for its own sake sake; instead, digital
    technologies are are intended to transform the way an organization operates, create
    value for customers, and enhance or introduce new business processes. What we
    find especially important is the strategic adaptability aspect of digital transformation.'
  merge: -1
  img_proc: true
- pgno: 371
  md: 'It is challenging to describe modern organizations, as they are constantly
    evolving, multi-dimensional systems with various dimensions, including business,
    process, and data architecture, customer journeys, value creation, and more. One
    of the challenges faced by many organizations is the lack of properly defined
    processes or up-to-date designs, which often leads to suboptimal results.


    There are several scenarios for digital change: top-down, grassroots, legacy modernization,
    triggered by **mergers and acquisitions (M&A)**, and accidental. Creating a good
    vision of digital change helps a lot with planning. Ensure that employees are
    involved so they feel that they helped define the vision, not that it was pushed
    from the top.


    The planning of digital transformation initiatives should cover aspects such as
    continuous adaptability, disruption of the workforce supported by a strong focus
    on self-learning, generating and managing intellectual property, planning for
    the long term while delivering short-term goals, regular plan updates, managing
    size and scope, and keeping growth in mind.


    Your key takeaway from Chapter 2 is to consistently deliver on the short-term
    goals of your digital transformation initiative to build credibility and maintain
    the momentum needed for long-term success.


    _Chapter 3, The Wheel of BPM Driving Your Competitive Advantage_, helped you understand
    the relationship between digital transformation and process management. Starting
    a digital transformation initiative without focusing on business processes will
    create partial results, with minimal possibility to scale your success and transform
    the entire value chain.


    Business process management not only helps reduce costs and increase productivity
    and quality but also boosts customer satisfaction and aligns processes with an
    organization’s strategy. It is not about running a one-off initiative but rather
    building a culture of continuous improvement and process thinking.


    It takes time to increase an organization’s process maturity. It is helpful to
    remember that you need time to deliver results from projects focusing on digital
    change and build knowledge and skills in your organization (e.g. citizen developers
    for people who will be automating processes, but also general BPM knowledge for
    all employees so that they understand the basic BPM concepts). It helps to build
    momentum by starting with smaller successes, followed by more complex and challenging
    projects that can create large-scale results.


    There are many theoretical frameworks for launching a BPM program. In Chapter
    3, we highlighted the following framework: define the scope and objectives (it
    helps a lot to figure out what past process-related initiatives were and what
    artifacts they created; also, it is a good idea to invest in training your team
    before buying software licenses), identify the gaps and opportunities for improvement
    (process architecture is instrumental here for identifying areas for improvement
    as well as pain points and benefits; picking the right business area to start
    with is also very important), develop the business case and roadmap, communicate
    and align the vision and strategy (you can start small and later add more sophisticated
    methods to make sure there are many possible ways to communicate what you are
    doing; support for the BPM from the top management would be very helpful), and
    establish the governance and roles for the transformation (process owners, BPM
    team, and the proper tooling, playbooks, and frameworks).'
  merge: -1
  img_proc: true
- pgno: 372
  md: '# # A Few Final Thoughts


    Even when the BPM initiative takes off, it still needs the support and buy-in
    of senior management to survive. When pitching BPM, ensure that what you propose
    is relevant and compelling to others, compatible with the company culture, aligned
    with the strategy, and easy enough to understand (without being too technical).
    Quick wins showcasing the value of the practice are very helpful.


    It helps a lot to convince not only management (sponsors, business leaders, and
    process owners) but also other people involved in the initiative, such as citizen
    developers. Consider what motivates the people you want to be involved in your
    initiative, what worries them, and what they need to know to participate effectively.


    You should also invest in your BPM expertise in process design and discovery,
    implementation (this includes automation), monitoring, and improvement, as well
    as consulting skills such as presentation, storytelling, and public speaking.


    Your BPM initiative needs to deliver measurable results and outcomes. Tracking
    KPIs that are aligned with the organization’s strategy (and communicating them
    to the proper people!) will help you prove the benefits of your BPM transformation.


    Since one BPM initiative is just a start, it is helpful to consider building a
    BPM community of practice that can evolve into a BPM **Center of Excellence (COE)**
    that can help facilitate and accelerate BPM transformation through expert services
    spanning business, process, and technology. This team will spend a lot of time
    collaborating with other groups of BPM practitioners, such as the citizen developer
    COE.


    It may also be helpful to create a BPM playbook, i.e., a reference guide for implementing
    BPM that will help you avoid many common errors by educating business teams and
    providing a set of best practices. This should reduce the risk of pitfalls, such
    as a BPM initiative not linked with the organization’s strategy, failing to deliver
    measurable results/benefits, or lacking initial quick wins.


    Just as we needed KPIs to show the results of the BPM initiative, KPIs can also
    help measure the success of BPM (or citizen developer automation) and secure funding.


    While “one platform to rule them all” may be compelling, you may need to work
    with several different digital process automation tools and platforms. Each tool
    may differ its support for BPM standards such as BPMN, DMN, and CMMN; however
    for now, BPMN is the best option for process analysis and serves as a universal
    language for describing process work. Also, using BPMN allows easier governance
    of your processes (ideally with a centralized and standardized repository) and
    orchestration of the processes powered by various technologies.


    When selecting tools for process automation, you need to look not only at the
    technical capabilities but also at aspects such as scalability, understanding
    of work predictability, ability to realize and track ROI, cultural fit between
    the vendor and company, and availability of talent.


    For many of those topics, we need enterprise process architecture to make an informed
    decision, ideally supported by insights provided by process mining.'
  merge: -1
  img_proc: true
- pgno: 373
  md: 'The best way to avoid common mistakes in launching a BPM program is to follow
    a methodology that ensures we are not skipping needed steps and. Additionally,
    learning from the mistakes of aspiring practitioners, such as focusing on technology
    alone or failing to adapt the approach to the organization’s culture is crucial.


    Your key takeaway from _Chapter 3_ is that BPM as a management discipline not
    only helps you improve the performance, efficiency, and agility of your business
    processes but also creates a solid foundation for digital change programs, which
    ultimately lead to your organization’s digital transformation.


    _Chapter 4, Long-Term Trends and the Impact on Your Job_, covered a very important
    topic: how do all those things impact your career? Digital transformation impacts
    not only your organization but also your job. Since you cannot always count on
    the training provided by your employer, it makes a lot of sense to invest in your
    skills.


    Digital transformation and BPM are vast areas, but fortunately, you do not need
    to know everything to get started. It is sufficient to get a basic understanding
    of the key concepts so that you know just enough to avoid costly errors often
    caused by weak spots in knowledge.


    While software vendors provide many functional learning materials, having a broader
    and more business-oriented perspective that comes from learning from several sources
    instead of relying solely on one software product or vendor is helpful. No company
    owns BPM as a science or business practice. Business orientation is also fundamental.
    Often, in digital change programs, it turns out that people lack a shared vision
    because everyone has a different understanding of the foundational building blocks
    of the organization (i.e., business processes). That’s partly because business
    processes are in tangible and are constantly evolving.


    Business processes are critical because they help improve operational efficiency,
    create value, translate strategy into action, are adaptable, and allow for continuous
    organizational improvement. BPM also introduces a process-centric view of organizations,
    providing a holistic perspective that considers interactions between processes,
    people, technology, culture, and strategy. It is beneficial to model processes
    to properly understand those inter-dependencies and organization in some formal
    way using standards.


    Apart from gaining an understanding of digital transformation and BPM, you should
    also be aware of other significant trends that affect DTX and BPM, such as agentic
    AI, cloud computing, robotic process automation, process mining, and many others.
    Their impact is substantial and non-linear, so you should expect that changes
    may occur faster than we expect and that the future will be very different from
    the present. Those trends also interact with and influence one another, creating
    new possibilities for more advanced process management. In addition, they create
    fundamental shifts and transformations in the market. This can pose a risk to
    your career and present a great opportunity if you know how to create value in
    this new environment.'
  merge: -1
  img_proc: true
- pgno: 374
  md: '# A Few Final Thoughts


    Some skills you need to learn (such as BPM and change management) can be treated
    as the core foundation of your skillset. They will not change radically very often
    (even though there have been several significant changes in BPM in the past, such
    as the transition from paper-based processes to digital ones, and the democratization
    of automation technologies). On top of them, you can add more technical skills,
    which will likely require constant learning to stay relevant. Therefore, you should
    also learn how to update your skills along with changes in the market. Finally,
    remember to keep up with the latest trends to identify relevant skills you should
    acquire or update.


    Your key takeaway from Chapter 4 is that BPM concepts are a solid foundation for
    your other skills and will help you stay relevant in the market.


    Chapter 5, Business Process 101, provided you with the necessary theory of BPM.
    What are the most important things about the processes you need to remember? Business
    processes are vital for creating value, which is relevant for every organization.
    Modeling (documenting) processes allows for a common understanding of the process
    steps and how they interact with other processes and resources to create the desired
    outcomes, which help the organization achieve its goals.


    By managing processes, an organization can increase performance, bring order to
    chaos, improve operational excellence (as well as the bottom line!), and build
    a continuous improvement culture. Managing processes also supports changes in
    business models. Through cross-functional collaboration, BPM facilitates company
    transformation, and that is not all! Organizations that manage their processes
    effectively can also enhance compliance, increase customer experience, and boost
    workplace satisfaction.


    The concept of cross-functional processes is very important for professional BPM.
    To be able to manage and improve processes effectively, it is essential to have
    a broader view of the process ecosystem, taking into account connections with
    other processes, inputs, outputs, and elements that support and guide the process.
    A good process model should answer the key questions we may have about the process
    and facilitate communication and knowledge transfer for the purposes relevant
    to the organization (e.g., process improvement or process automation). It is crucial
    for processes that span outside the organization. In such a scenario, when people
    do not have the whole picture, they may create point solutions with limited scope.
    This creates multiple issues outside that bring chaos inside.


    Your key takeaway from Chapter 5 is that processes are the backbone of organizations.
    When core processes change, they impact every aspect of the organization.


    In Chapter 6, Establishing Process Architecture, we continued with the topic of
    process management, this time, focusing on process architecture. Since processes
    are very complex entities with many interdependencies, it is very helpful to use
    something more than a flat list with names, a simple text document, or a spreadsheet
    to manage them. Process architecture is a perfect tool to facilitate the end-to-end
    view of processes, understanding the dependencies, and avoiding the problems caused
    by silo thinking or lack of a broader view.'
  merge: -1
  img_proc: true
- pgno: 375
  md: 'Process architecture categorizes processes into groups that help understand
    their role in value creation (i.e., do they create value or provide guidance or
    resources needed for building value). It also provides a hierarchical view of
    the processes, allowing for drill-down from the top-level overview process landscapes
    to the detailed diagrams showing all the steps of each process. Process architecture
    can also store many process attributes that aid in their management, such as owner
    assignments or information that supports analysis, including which processes are
    best suited for automation. Depending on the organization’s experience and expectations,
    process architecture can be built using tried-and-tested standards such as the
    APQC Process Classification Framework or can be created internally.


    Your key takeaway from _Chapter 6_ is that building process architecture will
    help you with other process management activities, both related to detailed process
    modeling (as it shows you which processes need to be documented in more depth)
    and to implementing and running organization-wide transformation (because it helps
    understand the impacts and plan the scope and order of required work).


    _Chapter 7, Process Modeling Notations_, provided an overview of methods for process
    modeling. There are several approaches to creating detailed process diagrams,
    each utilizing different notations to visually represent process steps, various
    flows, and other crucial information. In addition to well- known flowcharts, the
    **Business Process Model and Notation (BPMN)** can be employed to document processes
    effectively. This method not only enhances a common understanding and collaboration
    between business and IT users but also supports more advanced documentation, analysis,
    improvement, and automation of processes. Your key takeaway from _Chapter 7_ is
    that the BPMN standard remains the preferred approach for those just starting
    their process management journey. But remember that you can start with a reduced
    set of the most popular and useful shapes instead of learning and using all elements
    from this notation.


    _Chapter 8, BPMN – What You Need to Know_, and _Chapter 9, Advanced BPMN_, were
    all about various aspects of BPMN. BPMN allows the creation of both simple diagrams
    for process documentation and more advanced ones for process analysis and automation.
    For those interested in creating simple diagrams, learning BPMN can be as easy
    as learning a handful of intuitive shapes.


    For those needing more, BPMN also allows additional object types and attributes
    that add more precision to process diagrams and enable the automation of such
    diagrams. Additionally, BPMN is a standard with defined rules of what is allowed
    and what is not, so if you are using a tool with full support for the standard,
    you can not only share your diagrams with other tools using common XML-based standards
    but also check the validity (i.e., whether all the rules of BPMN are maintained)
    and ideally well-formedness of your diagram with one click.


    Your key takeaways from _Chapters 9_ and _10_ are that BPMN is a compelling method
    of documenting processes, but learning it does not have to be tough. Start with
    the basics and only use elements that are helpful and easy for your colleagues
    to understand.'
  merge: -1
  img_proc: true
- pgno: 376
  md: '# A Few Final Thoughts


    Chapter 10, Measuring the Business Value of Process Transformation, helped you
    understand how to approach process management initiatives to make sure they provide
    value to the organization. Modeling, improving, and managing processes can benefit
    the organization by enhancing the bottom line, improving customer and employee
    satisfaction, and many other key metrics. The best way to start with BPM is to
    build a solid business case focused on value, ensure strategic alignment, use
    measurements in continuous improvement, ensure that BPM benefits are also visible
    to customers and employees, and establish a foundation for future digital innovation.


    You can use several metrics for measuring business value: financial, operational,
    customer-focused, and employee-focused.


    These are your key takeaways from Chapter 10: BPM can bring many benefits to your
    organization, but if you want BPM to thrive as a new way of working, your responsibility
    is to deliver results and demonstrate how those results bring value to the organization.


    In this book, we have explored many ideas for implementing changes within your
    organization. As we conclude this chapter section, we want to share some final
    thoughts on processes and their value.


    Processes are one of the most commonly discussed concepts in business; however,
    many people still do not fully understand their true meaning or role within the
    scope of enterprise architecture. Terms such as capabilities, process optimization,
    and improvement are used loosely without aligning teams on their meaning. While
    process management may not seem as attractive, viral, or exciting as other current
    topics discussed within the enterprise, it is crucial. Process management forms
    the foundation for effectively transforming the organization and achieving its
    strategic vision. While the business strategy defines goals, competitive positioning,
    and value proposition, process architecture translates these into operational
    workflows. Well-developed process architectures provide the structure required
    to deliver strategic programs (including AI-enabled automation initiatives) and
    drive successful execution.


    Changes to core processes are significant because nearly every aspect of the company
    must adapt when these processes change. Moreover, process management is essential
    for operational excellence, driving continuous improvement, and harnessing innovation.
    It enhances performance and quickly brings order to chaos. By viewing operations
    through the lens of the business process lifecycle, we can accurately identify
    errors, exceptions, and process gaps rather than perceiving the operational world
    as an unruly Wild West.


    In modern organizations, artificial intelligence (AI) and automation significantly
    improve process capabilities. Leadership should make technological investment
    decisions based on a clear understanding of process architecture, ensuring that
    the right areas of operations are targets for automationand that business is ready
    to change how the work gets performed.


    Moreover, process models provide a blueprint for work that everyone can easily
    understand, making daily tasks simpler and changes more manageable. BPMN diagrams
    can serve as practical communication tools and can be integrated directly into
    process automation platforms, such as Pegasystems’ GenAI'
  merge: -1
  img_proc: true
- pgno: 377
  md: 'Blueprint. This integration allows for the automatic generation of enterprise
    case applications. Other vendors, such as Camunda, Bonitasoft, Microsoft Power
    Automate, Appian, and Bizagi, support direct modeling or importing of BPMN models,
    which helps accelerate development and shorten deployment times.


    So, why should people care about processes? When business processes run smoothly,
    they enhance the client’s experience and improve employees’ quality of work life,
    enabling us to focus on higher-level and more enjoyable tasks. By adequately describing
    your process layer, you open better opportunities for both life and work.


    # # Your next steps


    Through this book, you had a chance to learn a lot about the fundamental concepts
    of BPM, as well as about process modeling with BPMN. However, you should always
    remember that models are a great communication tool and a wonderful enabler, but
    they need to be complemented by other things to create real value. In this chapter,
    we will share with you a few suggestions for further areas closely linked with
    BPM and process modeling.


    Pick those that look interesting and relevant for you and your organization and
    combine them with the knowledge and skills from this book for even better results.


    If the concept of processes as vehicles for value creation resonates with you,
    lean management could be a valuable area for further study to help you minimize
    waste. Additionally, some individuals find that Six Sigma offers useful methodologies
    aimed at reducing errors and variability.


    To ensure the success of your organization’s Business Process Management initiatives,
    consider exploring topics such as Change Management, Center of Excellence (CoE)
    Playbooks, and Evangelism. Following a certification path, such as the OMG Certified
    Expert in BPM (OCEB), can also be beneficial. Engaging with peers in professional
    organizations for practitioners, such as the Association of Business Process Management
    Professionals (ABPMP), may also provide valuable insights.


    As highlighted in this book, process automation is a critical topic. Depending
    on your organization’s needs and maturity, you might want to investigate traditional
    process automation using Business Process Management Systems (BPMS) tools or explore
    more advanced options such as Robotic Process Automation (RPA), low-code platforms
    that support citizen developer initiatives, process and task mining, or tools
    that unify various automation solutions to orchestrate end-to-end processes. At
    the time of writing this chapter, a term introduced by Gartner, Business Orchestration
    and Automation Technologies (BOAT), is widely recognized as a key concept in for
    this rapidly evolving category of technologies. These tools facilitate autonomous
    automation and integrate elements such as human tasks, AI agents, RPA bots, API
    integrations, AI platforms, and more.'
  merge: -1
  img_proc: true
- pgno: 378
  md: '# # Final thoughts


    In this book, we aimed to introduce you to a world that might have seemed familiar
    yet remained largely unexplored. We hope to have broadened your understanding
    of this area, which, in our experience, is often overemphasized, misunderstood,
    or overly theorized. There are individuals and companies deeply passionate about
    the practical application of process science and BPM, and their financial results
    reflect this commitment. Unfortunately, these voices are often overlooked and
    hidden within the realms of IT or business operations. They work tirelessly to
    drive results until they reach a critical scale that can no longer be ignored.
    Their efforts create tipping points for digital transformation, but these voices
    often take years rather than months to gain visibility and recognition.


    As the world of AI and business come together, knowing how to lay the foundation
    for AI automation practices will be even more critical than in the past, requiring
    the foundational knowledge described in this book. The predicted density of AI
    automation in large companies is expected to increase significantly in the coming
    years. According to a McKinsey report, 92% of companies plan to increase their
    AI investments over the next three years. However, only 1% of companies consider
    themselves “mature” in AI deployment, meaning fully integrated into workflows
    and driving substantial business outcomes (https://www.mckinsey.com/capabilities/mckinsey-digital/our-insights/superagency-in-the-workplace-empowering-people-to-unlock-ais-full-potential-at-work?form=MG0AV3).


    A World Economic Forum study also indicates that 41% of companies plan to reduce
    their workforce due to AI automation by 2030. These trends suggest a high density
    of AI automation as companies strive to streamline operations and enhance efficiency.


    The economic impact of AI is also substantial, with enterprises worldwide expected
    to spend $632 billion on AI solutions by 2028, accounting for 3.5% of global GDP
    by 2030 (https://moneycheck.com/wef-study-41-of-companies-plan-ai-related-job-cuts-by-2030/?form=MG0AV3).


    As you might expect, this area is subject to frequent changes and breakthroughs,
    unlike the previous topics discussed, which tend to change more slowly over time.
    Therefore, while the earlier chapters included a section for further reading with
    recommended books, we suggest checking this book’s GitHub repository for the most
    current set of books and authors’ recommended materials: https://github.com/PacktPublishing/Practical-Business-Process-Modeling-and-Analysis/tree/main/Chapter11.


    If you want to have an overview of the hot topics in BPM, you may also enjoy the
    series of blog posts about BPM skills published by Zbigniew’s blog since 2016:
    https://bpmtips.com/category/bpm-skills/.'
  merge: -1
  img_proc: true
- pgno: 379
  md: 'AI automation will become increasingly prevalent in large companies, transforming
    how they operate and manage their workforce and processes. Would you want to be
    ready and equipped for this wave of innovation, which is reshaping the job market
    by incorporating the universal skills mentioned in our book to your arsenal? We
    hope so.


    We would like to express our gratitude for your attention and wish you success
    in your AI-driven, process-led transformations. We hope that the knowledge shared
    in this book helps you avoid unsuccessful initiatives and bruised egos. May it
    accelerate your career growth, and creates value for your organization while fostering
    positive changes for your customers, society, and the world.


    With gratitude,


    BPM practitioners and authors: Jim, Zbigniew, and BJ.


