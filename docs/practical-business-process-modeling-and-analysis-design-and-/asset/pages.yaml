- pgno: 196
  md: 'By taking this approach to process selection as part of a digital transformation
    initiative, the chances that the right processes will be included increase, rather
    than processes being loudly advocated by a high-profile person in the organization.
    As an additional benefit during further analytical work, those involved in designing
    new solutions will know more about the process.


    Knowing who the process owner is and what other processes our process is linked
    to makes it possible to determine who to involve in planning. Being aware of what
    applications and data the process uses can also help with avoiding costly mistakes
    due to a lack of knowledge.


    Because process architecture provides a comprehensive description of the process,
    along with key attributes and relationships, the risk of designing piecemeal solutions
    that do not provide the entire organization with optimal results significantly
    decreases.


    Another benefit of having a process architecture is that the aforementioned attributes
    describing the process, such as the process goal, process description, process
    owner, and others, can be used not only as part of design work but also daily.
    By using the right approach to process documentation, we can ensure that all interested
    parties have access to the knowledge they need.


    # How to show the benefits of the process architecture


    As discussed previously in this section, process architecture can be very helpful
    not only for documenting processes but also for improving and automating them.
    Once we’ve picked the right processes (e.g. high-volume processes with big improvement
    potential that are possible to automate), the next step would be to pick the right
    approach to automation.


    For some processes that are high-volume, standardized, and do not require unstructured
    data to be handled, more traditional automation approaches such as ERP and CRM
    could be sufficient. For others, where volume is not as high, but processes are
    relatively standardized, you may want to use the BPMS tools/workflow automation.
    Of course, it is also possible that you will need to orchestrate many technologies,
    such as RPA bots and AI agents, while ensuring your employees are working together
    on your process.


    Having a good understanding of your process will help you decide how to automate
    your process properly. This way, you will avoid creating a fancy and expensive
    solution with AI agents for a process where a CRM system would be perfectly fine.


    Information about the process will also help you design and implement the solution.
    Here, apart from the high-level process architecture, a detailed diagram showing
    the workflows will be of use. We will cover this topic in more depth later in
    this book.


    An additional exciting opportunity that can shorten the time needed to deliver
    the value of the process architecture (e.g., running successful automation projects)
    is **process mining**. This concept, mentioned in _Chapter 5_, allows you to discover
    your processes based on process logs and improve them. For mid-sized and large
    organizations, such projects can bring significant benefits, and having a process
    architecture may help with deciding which areas should be tackled first.'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'Depending on the specifics of the organization, this can be organized through
    a process tool, most likely using one of the repository-based **enterprise business
    process analysis** tools mentioned in _Chapter 5_, publishing to a solution such
    as SharePoint or Confluence, or creating printable documents that contain key
    information about the process.


    With this type of approach, it is possible to gather the necessary process information
    without creating a detailed diagram for each process, which saves a lot of time
    both in terms of creating and updating.


    # ## Summary


    In this chapter, we learned what process architecture is and its role in process
    management. We learned how an organization’s process architecture can be built:
    either by using popular process libraries such as APQC’s PCF or by building a
    process architecture tailored to the specifics of the organization. We also had
    the opportunity to see how process architecture can be used in practice and learned
    about the benefits of having one.


    In many places, we also had the opportunity to see that process architecture allows
    us to choose which processes we should describe in detail, or that process architecture
    allows us to choose processes to optimize or automate, which often requires that
    we describe them more elaborately. But how can we describe processes at a greater
    level of detail? This is what we will address in the next chapter.


    # ## Further reading


    +   - If you would like to learn more about the naming of processes and the topic
    of building a business architecture that encompasses process architecture and
    how it’s related to business capabilities, I strongly recommend the great book
    _Business Architecture: Collecting, Connecting, and Correcting the Dots_, by Roger
    Burlton. An additional awesome book is _Reimagining Management: Putting process
    at the center of business management_, by Roger Tregear. Both books are pure gold!


    +   - If you are interested in building an organizational architecture that merges
    business process management and enterprise architecture management, check out
    the book _Successful Architecture Implementation: A practical guide on how to
    implement your EA/BPM program_, by Roland Woldt.


    +   - If you are interested in real-life cases showing how organizations implement
    BPM, I do not know a better book than _Business Process Management Cases Vol.
    3: Implementation in Practice_, whose editors are Jan vom Brocke, Jan Mendling,
    and Michael Rosemann. In particular, I recommend that you read the interesting
    case about building the process architecture at Poland’s Ministry of Finance to
    see different approaches to a process architecture.


    +   - You can find additional examples and best practices for creating a process
    architecture in _Holistic Business Process Management: Successful with BPMN 2.0
    and OCEB 2 Fundamental_, by Serge Schiltz. This book is also a great choice if
    you are interested in gaining a BPM certification. More on this topic will be
    covered in _Chapter 11_.'
  merge: -1
  img_proc: true
