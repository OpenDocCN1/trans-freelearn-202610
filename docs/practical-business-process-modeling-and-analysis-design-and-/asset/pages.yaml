- pgno: 293
  md: '# # Advanced BPMN


    In Chapter 8, we learned about the key elements of BPMN. With this knowledge,
    you can easily understand most real-life diagrams. However, BPMN also allows you
    to create more sophisticated diagrams for process analysis and automation. To
    help you benefit from those additional possibilities, we will cover more advanced
    elements of BPMN.


    We will also discuss how BPMN can be extended to support concepts such as decision
    management, knowledge-intensive processes implemented through case management,
    simulation, risk management, showing responsibilities with RACI, and more.


    In this chapter, we''re going to cover the following main topics:


    +   - How to handle special cases in BPMN with events

    +   - When and how to use additional types of tasks, sub-processes, and gateways

    +   - How to extend BPMN with additional notations and attributes


    > > **Note**

    > > This chapter is authored by Zbigniew Misiak.

    > > Additional resources for this chapter have been uploaded here: `https://github.com/PacktPublishing/Practical-Business-Process-Modeling-and-Analysis/tree/main/Chapter09`.


    # ## Additional types of events


    In Chapter 8, we learned about the most important types of start and end events
    that define the scope of a process. However, it''s worth knowing that BPMN also
    allows you to model intermediate events, which, as the name implies, occur during
    the process: after the process begins and before the process ends.'
  merge: -1
  img_proc: true
- pgno: 294
  md: 'BPMN also allows the use of more complicated types of start and end events—we
    will deal with them

    in this chapter too. We’ll begin our discussion of the more advanced elements
    of BPMN with events

    because they are a big part of all BPMN objects. In addition, without events,
    it is difficult to understand

    the use of many other advanced elements of the notation.


    # Intermediate events—basics


    **Intermediate events** are represented as circles with an icon in the center,
    indicating their trigger, just

    like all other events. However, you can easily distinguish them from start and
    end events by looking

    at their border. While start events always have a single thin line as a border
    and end events have a

    single thick line, intermediate events always have a double thin line.


    ![](img/a4c90ee3d142c33743706d37c65779c2_294_0.png)


    Figure 9.1 – Comparison: start, intermediate, and end events


    Intermediate events come in different variants. Most commonly, they are a part
    of a process flow,

    where they show that the process has reached some special state, or that the process
    must wait for

    some event to happen before it can continue. As you may expect, we can apply a
    familiar concept

    here: **throwing (active)** and **catching (passive) events**.


    As in the case of start and end events, there can also be intermediate events
    without a defined trigger.

    This type of event does not have an icon inside, so it is a simple circle with
    a double thin line as a

    border. An intermediate event without a trigger always behaves actively; it is
    a throwing event (although

    visually it is impossible to guess since there is no icon). It is rather uncommon,
    but it can be used to

    show that the process has reached some important stage (**milestone**).


    Intermediate events can also be used to mark exceptions, errors, and special situations
    in the process.

    For this purpose, **boundary intermediate events** are used. They are always attached
    to the borders of

    tasks or sub-processes for which they provide exception handling. Boundary intermediate
    events are

    always catching (passive) elements that behave like sentries. They are used to
    “listen” for things that may

    affect the execution of the activity to which they are attached and specify how
    to handle those cases.


    Generally speaking, there are two possible options: something can happen that
    forces us to interrupt

    the work we are doing (this is described by **interrupting intermediate events**),
    or without interrupting

    the activity we are currently performing, it can cause us to do something additional
    “on the side” (this

    is what **non-interrupting intermediate events** are for).'
  merge: -1
  img_proc: true
- pgno: 295
  md: '# # Message events—recap


    Let’s start learning with **message events**—that is events for which the message
    is a trigger. To help

    you learn about this more easily, we will use a slightly modified version of our
    complaint handling

    process, in which we use intermediate events (instead of tasks) to communicate
    with the customer.


    ![](img/a4c90ee3d142c33743706d37c65779c2_295_0.png)


    Figure 9.2 – Usage example: start, intermediate, and end events in a complaint
    handling process


    The start event triggered by the message is identical to the one we discussed
    earlier—it simply means

    that the process starts when a message from a customer about a complaint arrives
    at our company.


    The end event that sends the message should also look familiar. It informs us
    that when our **Product

    shipping** sub-process ends, the main process of handling the complaint also ends,
    but in addition, we

    send a message (e.g., an email) to the customer with information that a complaint
    has been closed and

    most likely a link to a survey, so that we can find out the customer’s satisfaction
    with the complaint

    handling process.


    # # Catching and throwing intermediate events


    The new items worth noting in **Figure 9.2** are two intermediate events: **Complaint
    accepted** and

    **Delivery details received**. For both, a message is a trigger, as shown by the
    envelope icons inside the

    objects. As you can see in our example, the active (throwing) event has a dark
    envelope icon, and the

    passive (catching) event has a light one. All intermediate events behave in this
    way, making it easy to

    interpret the meaning of the diagrams.


    Let’s complicate our example a bit and add two boundary intermediate events, both
    of which will be

    attached to the **Order shipping of a replacement product** task. As the bright
    icon shows, both events

    are passive, since their role is to “listen” whether something particular occurs
    during the execution of

    the activity to which they are attached and specify what our reaction will be.'
  merge: -1
  img_proc: true
- pgno: 296
  md: '![](img/a4c90ee3d142c33743706d37c65779c2_296_0.png)


    Figure 9.3 – Usage example: boundary intermediate events in a complaint handling
    process


    # # Interrupting and non-interrupting boundary events


    Let’s imagine that we need to handle a (hypothetical) situation in which the customer
    withdraws their claim because they have determined that the problem was not the
    fault of our company or courier, but that it was a child who hit the package while
    playing and caused damage to its contents. In this case, it does not make sense
    to finish the **Order shipping of a replacement product** task because we do not
    need to send a replacement product. After we close the complaint (perhaps marking
    it in the CRM system), we may want to thank the customer for their honesty and,
    as a small gift, give them a discount on their next order.


    The second situation we may want to respond to is a change of contact phone from
    the customer’s side. If our customer accidentally provided the wrong number (e.g.,
    a business phone) when making a complaint, they may want to change to a different
    number (e.g., a private phone) so that the courier calls the correct number. This
    change can be made at any time while we are still ordering the shipping, but it
    must occur before we proceed to the product shipping sub-process (it will be too
    late to make the change).


    As you can see, in both cases, the boundary events contain an identical icon as
    they wait for a message. Also, both have outgoing sequence flows leading to activities
    needed to handle those special cases. Different types of lines used for borders
    suggest that those events may have different meanings when it comes to interrupting
    the activity to which they are attached.'
  merge: -1
  img_proc: true
- pgno: 297
  md: 'Non-interrupting boundary events have a dashed double thin line, and interrupting
    boundary events

    have a solid double thin line for the border. How can you remember this? This
    trick may be helpful

    for you: a solid line means a “confident and assertive” event. When it occurs,
    it takes the token away

    from its “parent” (the activity to which it is attached), thereby interrupting
    that activity, and uses the

    token for its purposes. The dashed line, on the other hand, means that the event
    is “shy” and in order

    not to disturb its “parent,” it produces its token and executes some additional
    process steps without

    bothering the “parent.”


    Interestingly, there is no visual difference between the intermediate catching
    event and the boundary

    catching interrupting event—both have a double solid line and an icon with a light
    fill. However,

    they differ in their attributes (of course, this depends on the tool you are using)
    and in the fact that

    the catching intermediate event, which is part of the process flow, has an inbound
    and outbound

    sequence flow, while the boundary event, attached to the activity boundary, can
    only have an outgoing

    sequence flow.


    It is worth noting that boundary events are not always ready to do their job.
    Boundary events (with

    one exception, which we’ll cover later in this chapter) “listen” only when the
    task or sub-process to

    which they are attached is active.


    How does it work in practice? If the message that our boundary event is waiting
    for arrived before

    we started the task or just after we finished it, it would be ignored. The same
    would happen for the

    other types of boundary events.


    Sometimes, this is good because it allows us to accurately show exception handling
    for a specific process

    step. However, if we would like to show that exception handling is the same in
    two tasks, we should add

    one boundary event to each task, or put both tasks in a sub-process and add a
    boundary event to it.


    What if we wanted to show that we could handle a certain situation within a whole
    process? Fortunately,

    the BPMN specification makes this possible with a special type of sub-process
    and associated special

    start events.


    # Event sub-processes


    These special sub-processes are called event sub-processes. When it comes to their
    usage, they are

    rather unusual elements of BPMN, since we do not insert them as part of the normal
    process flow (no

    sequence flow can enter or exit them) but simply place them somewhere in a pool.
    This is enough to

    show that they are responsible for handling exceptions for this process.'
  merge: -1
  img_proc: true
- pgno: 298
  md: '![](img/a4c90ee3d142c33743706d37c65779c2_298_0.png)


    Figure 9.4 – Visualization and usage of an event sub-process


    Another unusual aspect is their visualization—like all sub-processes, they have
    a rectangular shape with rounded corners, but they have an uncommon, dotted border.


    Like other sub-processes, they can be used for hierarchical modeling (indicated
    by a + icon). Slightly more often, however, they are used in expanded form—with
    the contents immediately visible and without the + icon.


    This second case can sometimes lead to confusion, especially if you use a tool
    in which all the elements of the notation are black and white, since it is easy
    to confuse such a sub-process with a group, especially if a diagram is zoomed
    out and it is hard to distinguish a line drawn with dots from a line drawn with
    dashes and dots.


    ![](img/a4c90ee3d142c33743706d37c65779c2_298_1.png)


    Figure 9.5 – Expanded event sub-process'
  merge: -1
  img_proc: true
- pgno: 299
  md: 'Event sub-processes are more challenging, but they are worth learning about
    because they enable exception handling for the entire process, which can sometimes
    be extremely useful. I find it helpful to think about event sub-processes as older
    siblings of boundary events. They can either interrupt the entire process or be
    executed without interrupting the process. However, there are also more similarities.
    You will discover these next.


    # Start events in event sub-processes


    Each event sub-process always has one start event with a defined trigger. Here,
    too, there is a strong similarity to boundary events, because the vast majority
    of trigger combinations are identical for boundary events and start events for
    these sub-processes.


    Let’s see this in practice with the example of messages. The boundary events triggered
    by a message can be interrupting or non-interrupting. To distinguish between them,
    all you have to do is look at their border. Interrupting events are marked with
    a solid line, while non-interrupting events are marked with a dashed line.


    The start event triggered by a message in an interrupting event sub-process has
    an envelope icon with a light fill. Since the event sub-process behaves in an
    interrupting way, the start event has a border drawn with a solid line. This means
    that the start events for interrupting event sub-processes are visually identical
    to “normal” start events. In contrast, the start event in a non-interrupting event
    sub-process has a border drawn with a dashed line. Both variants are shown in
    Figure 9.6.


    ![](img/a4c90ee3d142c33743706d37c65779c2_299_0.png)


    Figure 9.6 – Event sub-processes: interrupting and non-interrupting (triggered
    by a message)'
  merge: -1
  img_proc: true
- pgno: 300
  md: 'Now that we''ve learned how different types of intermediate events work using
    the example of messages, it’s time to discuss the rest of the possible triggers.
    To help you learn, we’ll begin with a trigger that behaves in a pretty similar
    way to a message.


    # ## Signal events


    From the previous section, we know that messages are very useful when we want
    to show the exchange of information between different pools, with always one sender
    and one recipient. But what if there is an exchange of information in our process,
    but it does not meet those conditions?


    Here, a **signal event** comes in handy. You can think of it as a twin brother
    of the message, since this type of trigger occurs in all types of events where
    you could use the message as a trigger. However, it allows us to bypass the limitations
    of message events.


    While the message icon is always an envelope, the signal icon is an equilateral
    (regular) triangle with the tip pointing upward. As always, for catching signal
    events, the triangle has a light fill, while for throwing signal events, it has
    a dark fill.


    ![](img/a4c90ee3d142c33743706d37c65779c2_300_0.png)


    # ## Signals versus messages


    Before discussing examples of signal types, it is worth mentioning the dual nature
    of a signal. First, the creators of BPMN wanted to describe a situation in which
    there is one sender, but many possible recipients—hence the name _signal_. Just
    as an ambulance siren is not directed at one particular driver, but to every driver
    in the area, a signal informs all potentially interested parties of a certain
    situation, but how they react is up to them. A good example is the publication
    of a tender on the portal. Such information is published by one entity, but there
    are usually many recipients. There is also no certainty as to who will react to
    the signal.'
  merge: -1
  img_proc: true
- pgno: 301
  md: 'Secondly, the signal has additional usage derived from a desire to overcome
    the message limitations.

    For many people, the concept of sending and receiving a message is extremely useful,
    but they find it

    difficult to come to terms with the limitation that the sender and recipient of
    a message are two different

    participants who have their own pools. Since it is not always possible, signals
    have a second use case:

    they can be used to transmit information both between different pools and within
    one pool. In this

    way, you can show that you are receiving an information from colleagues in the
    same organization.

    An example of such a signal start event could be **Payroll transfers confirmed**.


    As we discussed earlier, a signal behaves quite similarly to a message, so intermediate
    events whose

    trigger is a signal can be both catching and throwing, and in the case of boundary
    events, they can be

    interrupting as well as non-interrupting. The same goes for start events (including
    those associated

    with event sub-processes) and end events.


    _Figure 9.8_ shows examples of various signal events. Let’s assume that the signals
    1, 3, 4, 5, 7, and 8

    are different, and we react to them in different ways. For example, **Signal 4**
    will cause us to interrupt

    **Task 2**, and **Signal 7** will cause us to interrupt the entire process.


    ![](img/a4c90ee3d142c33743706d37c65779c2_301_0.png)


    Figure 9.8 – Signal events'
  merge: -1
  img_proc: true
- pgno: 302
  md: '# # Timer events


    Now that we’ve discussed message and signal triggers, it’s time for another pair
    of twin triggers: **timer** and **conditional**. Let’s start with a trigger we
    already know from _Chapter 8_: timer. Events for which time is a trigger are called
    **timer events**. They are always marked with a clock icon.


    When it comes to time, we are always passive (we can only wait for a specific
    moment; we cannot influence the time), so the icon occurs only in a variant with
    light fill.


    ![](img/a4c90ee3d142c33743706d37c65779c2_302_0.png)


    Figure 9.9 – Timer event: passive


    Start events, intermediate events within the process flow (obviously, only catching),
    interrupting and non-interrupting boundary events, and start events of event sub-processes
    are all possible for timer events. These are shown in _Figure 9.10_.


    Of course, in this example, each of the timer events can signify a different moment—for
    example, a process may start every Monday morning (**Timer 1**); after executing
    **Task 1** we wait until noon (**Timer 2**); if **Task 2** takes more than 1 hour
    (**Timer 3**), we interrupt it, but after 45 minutes of execution (**Timer 4**),
    we can do something without interrupting **Task 2**, and similarly at the level
    of the whole process (**Timer 5** and **6**). The same approach will also work
    for other events we will be discussing.


    ![](img/a4c90ee3d142c33743706d37c65779c2_302_1.png)


    Figure 9.10 – Timer events'
  merge: -1
  img_proc: true
- pgno: 303
  md: '# # Conditional events


    Now, let’s see how what we’ve learned about timer events applies to events that
    are triggered by conditions. **Conditional events**, such as those triggered by
    time, come only in a catching (passive) form. Their icon is always a lined paper.


    ![](img/a4c90ee3d142c33743706d37c65779c2_303_0.png)


    Start event (conditional)


    Figure 9.11 – Conditional event: passive


    With conditional events, we can show that our processes respond to what happens
    in their environment. There are many cases where conditions could be used. Even
    for the rather humorous example from the specification, which refers to the temperature
    (most likely for cooking), we could find a business-oriented case, such as the
    process of suspending classes in a school, that begins with a start event of **Temperature
    in the rooms where classes are held below 18 degrees Celsius/64 degrees Fahrenheit**.


    Conditions can also refer to inventory (**Number of items in stock below the defined
    minimum**—if we were to create a replenishment process for key goods offered by
    the company), stock prices (**Stock price in market A lower than...** for automatic
    arbitrage transactions under so-called high-frequency trading), and many other
    aspects.


    In general, if there is something we can measure, a condition can be added to
    handle it. This allows processes to respond to a broad spectrum of events, from
    the classic examples we cited to more technically advanced cases, such as sensor
    data collected by the **Internet of Things (IoT)**.


    Just like timer events, start events, intermediate events within the process flow
    (catching), interrupting and non-interrupting boundary events, and start events
    of event sub-processes can be conditional. They are all shown in **Figure 9.12**.'
  merge: -1
  img_proc: true
- pgno: 304
  md: '![](img/a4c90ee3d142c33743706d37c65779c2_304_0.png)


    Figure 9.12 – Conditional events


    The two pairs of twins we covered so far (message and signal, as well as timer
    and conditional) allowed us to discuss the most important uses of events in BPMN.
    However, there are more trigger types available, as well as some other ways of
    using events that we have not covered so far. In the remainder of this chapter,
    we will briefly discuss the more technical and slightly more complicated uses
    of events. We’ll start with another pair of triggers, but this time, they are
    not as closely related as the ones we’ve already learned about.


    # Escalation events


    The ability to describe error and exception handling is extremely important when
    modeling processes for automation. This allows us to specify what should happen
    if something undesirable occurs in the process so that we can handle it properly.


    Importantly, BPMN distinguishes two types of problems of different severity: less
    serious escalations and very serious errors (which we will cover shortly). An
    **escalation** is always indicated by an upward- facing arrowhead icon (which
    reminds me a bit of the _Star Trek_ insignia).'
  merge: -1
  img_proc: true
- pgno: 305
  md: '# Figure 9.13 – Escalation events: passive and active


    Events whose trigger is escalation can be both throwing and catching, but they
    have far fewer allowed options compared to the events we’ve covered so far. This
    is due to the nature of the trigger used to handle exceptions, such as a delay
    in a process that we need to inform someone about, the unavailability of a product,
    and so on.


    Therefore, escalation cannot be used for normal start events, but for intermediate
    events within the process flow, where it only occurs as a throwing event (it shows
    that the process is continuing, but something has gone wrong, and we need to handle
    this situation somehow). We can also throw an escalation in the end event and
    use escalation for interrupting and non-interrupting boundary events, as well
    as for both variants of event sub-processes. We can see all these options in _Figure
    9.14_.


    # Figure 9.14 – Escalation events'
  merge: -1
  img_proc: true
- pgno: 306
  md: 'It is worth noting a slight change in Figure 9.14 from the previous examples.
    Why do we have Sub-process 2 instead of Task 2? This is due to the nature of escalation,
    which is often used to inform a higher-level process that it needs to respond
    to something that happened (for example, a delay in a process, or an unusual process
    result that may require special handling).


    The example shown in Figure 9.14 could be extended by an additional diagram showing
    the content of Sub-process 2. Escalations 3 and 4 would be thrown (similar to
    how, in our example, escalations 1 and 2 are being thrown) so that we could catch
    them by boundary events attached to the border of Sub-process 2. This is because
    escalations should occur in "teams"—they must be thrown somewhere so that they
    can be caught and handled in a higher-level process.


    # Error events


    As we know, escalations are used to describe situations when not all is lost,
    and the process can continue. However, there can be cases of severe problems in
    our process that do not allow the process to finish successfully. Error events
    are meant to provide handling for such situations. Error events have an easy-to-recognize
    and remember lightning bolt icon.


    ![](img/a4c90ee3d142c33743706d37c65779c2_306_0.png)


    Figure 9.15 – Error event: passive and active


    As you can see, just like it was the case for escalations, both throwing and catching
    error events are possible. However, error events have fewer options than escalations.
    This is because an error is something extremely serious, preventing the process
    from normal completion. That’s why there are no non-interrupting error events.
    Examples of situations where we could use error events are a critical IT failure
    that we cannot overcome, a big business problem such as failure to collect a payment
    from a customer’s credit card, or a lack of the item that the customer has ordered.


    The only type of throwing error event is an end event. If this end event were
    part of a diagram documenting the content of a sub-process, we would usually have
    a boundary event attached to this sub-process that would catch this error and
    provide some handling. For example, if our error was a failed payment, we could
    contact the customer and use an alternative payment method. We can also handle
    the error within the same diagram with an event sub-process. All these options
    are shown in Figure 9.16.'
  merge: -1
  img_proc: true
- pgno: 307
  md: '![](img/a4c90ee3d142c33743706d37c65779c2_307_0.png)


    Figure 9.16 – Error events


    Errors and escalations allow us to handle various problems with our processes.
    However, there are also additional options for handling emergencies.


    # ## Compensation events


    Many people happen to do something in life that they regret and wish they could
    undo. While this is not always possible in relationships, there is a way to do
    it in business processes with **compensation events** and **compensation activities**.
    Compensation is symbolized by an icon commonly used in music players for rewinding.


    ![](img/a4c90ee3d142c33743706d37c65779c2_307_1.png)


    Figure 9.17 – Compensation icons: passive and active events and activities'
  merge: -1
  img_proc: true
- pgno: 308
  md: 'As you can see, compensation events can be both catching and throwing. Throwing
    occurs either as

    an intermediate event within the process flow or as an end event. Catching compensation
    can be a

    boundary event, or it can be the start event for an event sub-process, as shown
    in Figure 9.18.


    ![](img/a4c90ee3d142c33743706d37c65779c2_308_0.png)


    Figure 9.18 – Compensation events


    Compensation events have several unique features. These are visible in Figure
    9.18 and will be discussed

    here. First, since compensation is used to undo something that has already happened,
    we model it in

    a rather unusual way, so reading diagrams with compensations requires some preparation.


    For the so-called “sunny day scenario,” where everything is OK with our process,
    after performing

    Task 1 and Task 2, we would reach an end event, Normal end event. However, if
    we have determined

    that something is not right, we cannot finish the process normally, so we need
    to roll back something

    that has already happened in Task 1 (e.g., charging a customer account, setting
    a status in the system,

    saving data to a database, etc.), after which we need to throw appropriate compensation(s).


    Let’s start with a throwing intermediate event named Compensation 1. From the
    pure logic of the

    process, you can see that after this event, we go to the end event, where the
    token of our process

    instance can be consumed. However, since Compensation 2 is also a compensation
    event, it will

    throw additional compensation, which will provide additional handling for this
    situation.


    Now, let’s look at a Compensation 1 boundary event, which is attached to the border
    of Task 1. This

    will help us understand the concept of undoing/reverting to a previous state.
    As you can see, next to

    Compensation 1, we have Task A, with a compensation marker. However, this does
    not look like the

    diagrams that we’ve covered so far.'
  merge: -1
  img_proc: true
- pgno: 309
  md: 'We can read it as follows: if we throw a specific compensation, it must be
    caught somewhere. Here,

    there is an exception to the rule, which states that boundary events can only
    “listen” so long as the

    element to which they are attached is active. This is completely different from
    compensation boundary

    events—they only start “listening” when the task or sub-process to which they
    are attached is completed.

    However, a compensation that is not a part of a normal flow does not follow the
    standard rules we’ve

    learned about so far. As you can see, there is nothing more after **Task A**.
    There is no outgoing sequence

    flow because it only shows what needs to be done to undo **Task 1**.

    Interestingly, **Task A** also has no incoming sequence flow! This is because
    it connects to the boundary

    event through an association relation—the same one that is used for attaching
    text annotations to

    elements of a process flow. However, this relation also has an arrowhead, indicating
    the direction of

    the flow.

    An important rule related to compensation events is that to undo specific process
    steps, you usually

    need to “call by name” their specific compensations. In our case, this was quite
    simple, but there may

    also be process diagrams in which we want to roll back many different steps. Does
    this mean we always

    need to throw many compensations in such situations?


    # ## Cancel events


    Many people try to use cancel as a marker for an end event to signify, for example,
    the end of a process

    that occurred prematurely, such as a customer’s decision to cancel an order. **Cancel
    events**, however,

    are meant as a workaround for the problem of calling each of the many compensations
    separately.

    There are only two types of cancel events: the end event and the intermediate
    boundary event. Both

    have the icon of a rotated cross with dark and light fill, respectively.


    ![](img/a4c90ee3d142c33743706d37c65779c2_309_0.png)


    Figure 9.19 – Cancel events: passive and active


    However, cancel events always occur in tandem with a special type of sub-process:
    transaction. It can

    easily be recognized by its characteristic double-lined boundary.


    ![](img/a4c90ee3d142c33743706d37c65779c2_309_1.png)


    Figure 9.20 – Transaction sub-process'
  merge: -1
  img_proc: true
- pgno: 310
  md: 'A **transaction sub-process** is used to mark parts of a process that either
    must be performed correctly

    or must be undone. As the name suggests, we may use it for banking transactions
    or IT (e.g., database

    transactions), but these are just two of many examples. The important thing is
    that if a cancel boundary

    event attached to the boundary of a transaction sub-process is triggered, all
    the elements in it for

    which we have defined the ability to undo using compensation will be triggered
    collectively, without

    the need to call each of them by name.


    # Terminate events


    Like cancel events, terminate events can also be a bit tricky, because their name
    seems to imply

    something different than what is in the BPMN specification. **Terminate end event**
    is the only event

    with this trigger type. The marker for this event is a black dot.


    ![](img/a4c90ee3d142c33743706d37c65779c2_310_0.png)


    Figure 9.21 – Terminate end event: active


    Typically, this type of event is used by new adepts of BPMN to emphasize that
    the process ends.

    However, terminate end event has some other meaning. As we know, a standard end
    event “consumes”

    the token entering it, but so long as there are other active tokens for this process
    instance, the instance

    lives. This behavior corresponds to our most common business need: to be able
    to divide a process

    into independent paths that flow separately, and only when each of them ends can
    we consider the

    entire process done.


    Sometimes, however, we may reach a state in our process where there is no point
    in continuing with

    other activities. This is when a terminate event comes in handy. When a token
    reaches such an event,

    all other tokens within the process instance are found and removed.


    # Link events


    It’s now time to look at the next (unusual) type of event. While the other types
    of events we’ve covered

    so far had clear connections with real-life scenarios, **link events** only serve
    navigational purposes.

    They can only be used as intermediate events within the process flow. The link
    icon is always an arrow

    pointing to the right. Not surprisingly, this arrow has a light fill for catching
    events and a dark fill for

    throwing events.'
  merge: -1
  img_proc: true
- pgno: 311
  md: '![](img/a4c90ee3d142c33743706d37c65779c2_311_0.png)


    Figure 9.22 – Link events: active and passive


    The idea behind link events is quite simple: when dealing with large diagrams,
    readability is an important issue. In the early 2000s, when process modeling tools
    were not yet as developed as they are today, it could be a problem to work with
    diagrams that needed more than one sheet of paper. Even today, in the case of
    large diagrams with many elements and arrows, there is a risk that the sequence
    flows will intersect, which may confuse the process readers because they will
    not be able to tell where a particular arrow leads.


    Link events allow us to deal with such situations. They allow a process model
    to be split into several parts (each easy to print) and facilitate navigation
    between them, both in digital and printed form. Luckily for us, currently, decent
    process modeling tools rarely have problems with big models, so we do not need
    link events as much. However, an additional reason remains: link events allow
    us to avoid intersecting sequence flows. Instead of drawing a long line that will
    be crossing other sequence flows (which looks a bit messy), we can use link events.


    Figure 9.23 shows two equivalent diagrams. In the first one, the flow elements
    are connected by a normal sequence flow (the bridges where the lines intersect
    are not part of BPMN; this is a feature available in ADONIS). In the second one,
    we have a pair of intermediate events: A (throwing) and A (catching).


    ![](img/a4c90ee3d142c33743706d37c65779c2_311_1.png)


    Figure 9.23 – Using link events to improve the readability of big diagrams'
  merge: -1
  img_proc: true
- pgno: 312
  md: 'Quick tip: Need to see a high-resolution version of this image? Open this book
    in the next- gen Packt Reader or view it in the PDF/ePub copy.


    The next-gen Packt Reader and a free PDF/ePub copy of this book are included with
    your purchase. Scan the QR code OR go to packtpub.com/unlock, then use the search
    bar to find this book by name. Double-check the edition shown to make sure you
    get the right one.


    ![](img/a4c90ee3d142c33743706d37c65779c2_312_0.png)


    Even though you can’t see the sequence flow line between them, you should interpret
    the diagram as if that line were there. This is important because sometimes, people
    learning BPMN try to use link events to circumvent the notation’s rules that do
    not allow a sequence flow to cross the boundary of a pool (or sub-process). They
    hope that link events can work as teleports that transfer the token from one pool
    to another. As you probably expect, this is not a recommended way of modeling,
    because even if the user manages to cheat the tool validation mechanism, the diagram
    itself will still be incorrect.


    # Multiple and parallel events


    We have already learned about many types of events and triggers. So far, however,
    one event has always had one trigger. This is by far the most common situation,
    but there are also possible exceptions to this rule. The specification allows
    us to use events that have multiple triggers, in two types, something we will
    discuss in this section.


    ![](img/a4c90ee3d142c33743706d37c65779c2_312_1.png)


    Figure 9.24 – Multiple and parallel events


    The first type is the **multiple event**. As you can see, it can be catching or
    throwing. Its icon is a regular pentagon. The second type is the **parallel multiple
    event**, whose icon is a plus sign. This event can only be catching.


    Let’s start with a simple introduction to understand the idea behind these events;
    we will learn more about them later.'
  merge: -1
  img_proc: true
- pgno: 313
  md: '# # How to start a process


    Often, while modeling a process diagram, we use a single start event so that it''s
    easy for readers to see where they should start reading the diagram. However,
    there are times when we need to show that our process can start in response to
    several events.


    BPMN allows us to add many start events to our diagram. For example, if our process
    starts at a specific point in time or in response to a customer request, we can
    insert two start events, triggered by time and message, respectively.


    It is also possible that a diagram has several start events leading to various
    parts of the process. A simple example would be the process of ordering new computer
    equipment. If a request for a new laptop is made by an ordinary employee, it will
    most likely take some time, and several verification steps will be needed. Only
    after a few people accept this purchase can IT provide the equipment to the employee.
    However, if the new laptop is needed by a director or CEO (or there is another
    case of higher urgency), we can expect that the verification part of the process
    will be skipped, or at least severely reduced, and the person ordering will quickly
    get the equipment he or she needs.


    However, the situation in which a process has many start events is the exception
    rather than the rule. Although it is allowed by the rules of BPMN, the more start
    events there are, the more difficult it is for the audience to read the diagram
    correctly. In addition, many start events are often a problem if we intend to
    perform process optimization using simulation mechanisms, since many simulation
    engines require that there is only one start event in a process diagram.


    For authors of the BPMN specification, multiple start events are the solution
    to the dilemma of whether to keep the diagram easy to read (and allow only one
    start event) or rather allow the diagram to document more complex situations too
    (by allowing many start events). Multiple start events allow us to have our cake
    and eat it too because we can have a single start event with many triggers. How
    does it work? For example, in the situation described previously, in which our
    process starts either at a certain time or when an order from a customer arrives,
    we could use only one multiple start event and mark that it can be triggered by
    time or a message.


    Interestingly, in the case of multiple events, one glance is not enough to determine
    what triggers the process: regardless of whether our trigger is a message and
    a timer, or a timer and a signal, or perhaps a condition and a message, the icon
    will always be the same, and it will be a pentagon. Therefore, to be able to communicate
    to the recipients what triggers the process, we have to give the start event a
    meaningful name, such as **Order received OR deadline reached**.


    The BPMN authors did not stop there—a **parallel multiple start event** is also
    possible. While for a multiple start event, *any of the triggers* is enough for
    the process to start, for a parallel multiple event, *all of them* must occur.


    As you can see, for catching events, the principle of using multiple and parallel
    events is simple. The multiple event (the one with the pentagon) shows that any
    of the triggers is enough to go forward, while the parallel event (the one with
    the plus) shows that all are required. Unfortunately, things become more complicated
    in the case of throwing events, as shown in *Figure 9.25*.'
  merge: -1
  img_proc: true
- pgno: 314
  md: '![](img/a4c90ee3d142c33743706d37c65779c2_314_0.png)


    Figure 9.25 – Multiple events


    As you can see, in the case of multiple throwing events, we are dealing with logic
    that we would rather expect from parallel multiple events. This is because _multiple
    throwing events throw all defined triggers_ (e.g., they send a message and a signal).
    Therefore, it should not come as a surprise that there are no multiple parallel
    throwing events, as shown in Figure 9.26.


    ![](img/a4c90ee3d142c33743706d37c65779c2_314_1.png)


    Figure 9.26 – Parallel multiple events'
  merge: -1
  img_proc: true
- pgno: 315
  md: 'In practice, neither multiple events nor parallel multiple events are used
    often, but it is worth remembering the pentagon icon. That’s because—as we will
    see in a while—it is used in a very interesting element of BPMN, for which understanding
    the mechanism of multiple events will prove very useful to us.


    # # Additional types of gateways


    The gateway types we’ve covered so far (XOR, AND, OR) are the most popular ones.
    However, BPMN also offers more advanced (and less frequently used) types of gateways.
    We will cover them in this section.


    # ## Event-based gateways


    All the gateways we have learned about so far are data-based. In practice, this
    means that when a token arrives at a gateway, we can instantly (by checking the
    type of gateway and, where necessary, the conditions on the sequence flows) determine
    which path or paths will get a token.


    Sometimes, however, we can’t tell that right away, because we have to wait for
    something to happen. In this case, **event-based gateways** come in handy. If
    you take a closer look at such a gateway, the marker shown inside will suggest
    to you that it is different from other gateways we’ve covered so far. Like all
    gateways, event-based gateways are diamonds (rhombuses), but they contain a distinctive
    icon that looks like an intermediate multiple (catching) event. Take a look at
    _Figure 9.27_ and compare it with the catching intermediate event from _Figure
    9.25_.


    ![](img/a4c90ee3d142c33743706d37c65779c2_315_0.png)


    Figure 9.27 – Event-based gateway


    How should these gateways be used? Event-based gateways are like exclusive gateways—after
    the gateway, there can be two or more outgoing sequence flows, but only one of
    them can be selected (i.e., get a token) at a time.


    The difference is that we do not select on the basis of conditions defined for
    the sequence flows, but by examining the intermediate catching events. The principle
    is simple: after the gateway, we can have several intermediate events, and each
    of them represents a certain option that we expect. The first event to occur determines
    the path we will take. If a moment after the first event occurs, something else
    happens too, then the other path event is ignored.


    The message, signal, conditional, timer, and multiple intermediate events can
    be used after an event- based gateway (but only with triggers we already mentioned).'
  merge: -1
  img_proc: true
- pgno: 316
  md: 'Interestingly, the specification allows not only intermediate events after
    this gateway, but also receive tasks. The only requirement is that we need to
    be consistent and not use receive tasks and intermediate catching message events
    at the same time. In practice, however, this kind of modeling is neither frequent
    nor recommended.


    How could we use an event-based gateway in practice? Let’s go back to our complaint
    handling process. Let’s assume that a customer makes a complaint via a chat. Our
    consultant asks for a choice of options, and we usually get one of two possible
    answers: to refund or replace the goods. However, it may happen that the customer
    does not give us an answer. Previous versions of our diagram couldn’t handle this
    (of course, we could add an additional sequence flow with a condition stating
    _No answer within 15 minutes_ and for people interested in process documentation
    it would probably be fine, but such a diagram would not be 100% correct), but
    by using an event-based gateway, we can show that if a response doesn’t arrive
    within a predefined time (e.g., 15 minutes), a reminder email and a link to a
    web form will be sent.


    ![](img/a4c90ee3d142c33743706d37c65779c2_316_0.png)


    Figure 9.28 – Event-based gateway in practice


    An event-based gateway is very useful, especially when our processes communicate
    with other participants (pools), and we want to show how we will respond to messages
    from them and what to do in case no response is received. It can also be used
    in any process where certain events must happen within a certain time, such as
    quick payments for online orders (if the payment is not made within a certain
    time, the order will be canceled).


    # ## (Partial) Alternative to event-based gateways


    While being useful, event-based gateways are also a somewhat more complex BPMN
    concept. Not every recipient may know how to interpret them correctly. Therefore,
    I want to present a method that allows you to handle the most common scenario—handling
    different messages when there is a time limit—without using event-based gateways.
    I learned this brilliant trick (which is allowed by the BPMN specification and
    not tool-specific) from my two colleagues from BPMN MIWG: Denis Gagné and Falko
    Menge.'
  merge: -1
  img_proc: true
- pgno: 317
  md: '![](img/a4c90ee3d142c33743706d37c65779c2_317_0.png)


    Figure 9.29 – Alternative to event-based gateways


    🔍 **Quick tip**: Need to see a high-resolution version of this image? Open this
    book in the next-gen Packt Reader or view it in the PDF/ePub copy.


    🔒 **The next-gen Packt Reader** and a **free PDF/ePub copy** of this book are
    included with your purchase. Scan the QR code OR go to `packtpub.com/unlock`,
    then use the search bar to find this book by name. Double-check the edition shown
    to make sure you get the right one.


    ![](img/a4c90ee3d142c33743706d37c65779c2_317_1.png)


    As you can see, the beginning of our diagram is identical to what we had in Figure
    9.28. The difference appears at the stage of handling messages with customer decisions.
    Instead of using two separate intermediate events to catch each of the messages,
    we insert a single receive task, where we get the information from the customer.
    After receiving the message, we have the data required to pick the correct sequence
    flow, so we can use an easy-to-understand exclusive gateway.


    But how do we deal with the time limit? We can’t just add a third path to the
    exclusive gateway and call it _Time elapsed_, because it’s clear from the diagram
    that we enter the gateway only after receiving a message, so without a message,
    we will never move on.


    Luckily, at this point, we know about the concept of exception handling with boundary
    events. Since our expected behavior is to stop waiting for a decision from the
    customer after 15 minutes and send an email, we can simply use an interrupting
    boundary timer event, which will make sure we don’t wait forever for an answer.'
  merge: -1
  img_proc: true
- pgno: 318
  md: '# # Other types of event-based gateways


    Event-based gateways occurring within process flows represent a more advanced—but
    useful in certain situations—element of the notation. However, it is worth mentioning
    that the specification also describes two more variants of these gateways that
    can start a process. They are called **instantiating event-based gateways**.


    ![](img/a4c90ee3d142c33743706d37c65779c2_318_0.png)


    Figure 9.30 – Instantiating event-based gateways


    As the icon inside suggests, those gateways are meant to replace start events
    in some way (that’s why they have a circle drawn with a single thin line), where
    several triggers are possible (a pentagon or plus icon with light fill as they
    need to be catching). Depending on the type, either any or all of these events
    must occur to start the process. This way of modeling is neither popular nor recommended;
    I just wanted to show them to you to help you avoid any misunderstandings.


    # # Complex gateways


    In addition to the event-based gateways that we have just discussed, there is
    another type of data- based gateway in BPMN. This is the **complex gateway**.
    It has a distinctive asterisk icon in the center and quite specific behavior.


    ![](img/a4c90ee3d142c33743706d37c65779c2_318_1.png)


    Figure 9.31 – Complex gateway


    The behavior of the XOR and AND gateways we started with was clear immediately
    (with XOR, only one path gets a token, while with AND, every path gets a token).
    For the OR gateway, this was a little more difficult, but it was also clear that
    by reading the conditions on the sequence flows (to determine which paths get
    a token), we would know what happens in a process. However, the complex gateway
    behaves in a more complex way (pun intended).'
  merge: -1
  img_proc: true
- pgno: 319
  md: 'This gateway can, in principle, behave like any other (or have super sophisticated
    behavior that we could not get with any other gateways)—its behavior depends on
    a special condition defined not for the sequence flows, but for the gateway itself.
    Unfortunately, this condition is one of the invisible attributes of BPMN, so a
    person seeing only the graphic of the BPMN diagram has no way to determine how
    this gateway will behave, unless the model creator decides to show the condition
    through a text annotation, for example.


    For some users, the possibility of a gateway that can behave so flexibly is very
    appealing. In my opinion, however, despite its apparent versatility, the complex
    gateway is of little use in practice as it has little informational value, but
    it has great potential to mislead less experienced diagram readers.


    The specification allows the use of complex gateways for both opening and closing
    flows, but in my experience, if the gateway is used at all, it is to merge paths
    and only for more advanced cases of modeling (e.g., for automation purposes).
    In general, I would not recommend its use unless your automation project really
    needs it.


    # Additional types of sub-processes


    In Chapter 8, we learned about the two most common types of sub-processes: embedded
    and call activity. In this chapter, while discovering additional types of events,
    we also learned about two more: event sub-processes and transactions. We also
    know that sub-processes can be used in two variants: a collapsed variant, which
    can lead to lower-level models, or an expanded variant (the contents of the sub-process
    are visible).


    Now, it’s time to cover the last type of sub-process, known as the ad hoc sub-process,
    which is denoted by a tilde (wave).


    ![](img/a4c90ee3d142c33743706d37c65779c2_319_0.png)


    Figure 9.32 – Ad hoc sub-process


    This sub-process allows us to document processes that are less structured and
    require much more knowledge from their performers. It does not contain the complete
    set of elements that we usually see in a process—for example, there are no start
    or end events, and the tasks or sub-processes we put inside do not have to be
    connected by a sequence flow.'
  merge: -1
  img_proc: true
- pgno: 320
  md: 'We can think of the entire contents of an ad-hoc sub-process as a buffet with
    lots of options to select from. This gives people performing a process lots of
    flexibility to choose the elements that they find useful, without being forced
    to execute all of them or perform them in any specific order.


    ![](img/a4c90ee3d142c33743706d37c65779c2_320_0.png)


    Figure 9.33 – Ad hoc sub-process in practice


    While the concept of providing more flexibility for a process is very valuable,
    ad-hoc sub-processes are not very popular in practice. One of the reasons may
    be that these elements are not supported by process automation solutions. There’s
    also an additional one—there are several other approaches for knowledge-intensive
    processes. They may be as simple (but powerful) as checklists or as formal as
    an additional specification provided by OMG, known as **Case Management Model
    and Notation (CMMN)**. This is something we will briefly cover in the last part
    of this chapter.


    # ## Additional types of tasks


    Earlier in this book, we learned about the most important types of tasks: those
    without a type and user, service, manual, send, and receive tasks. In this section,
    we will briefly discuss other types of tasks found in the BPMN specification.


    # ### Business rule tasks


    We will start with a **business rule task**. It is a bit more advanced than the
    other tasks we’ve covered so far, but it is very useful for complex processes,
    where many aspects impact the execution of the process, especially the processes
    we want to automate. This task type icon is a stylized table.'
  merge: -1
  img_proc: true
- pgno: 321
  md: '![](img/a4c90ee3d142c33743706d37c65779c2_321_0.png)


    Figure 9.34 – Business rule task


    A business rule task allows us to simplify our diagrams significantly by eliminating
    many unnecessary decision gateways and sequence flows, but most importantly, it
    makes our automated processes more flexible.


    Imagine a company that sells its products in different markets to different customer
    segments. Some order more, some order less. Some are regular, long-time customers.
    Some are new customers we don''t know yet. We can offer goods to the public sector
    through tenders or to private entities. Add to that different countries, legal
    systems, and currencies and, as you can see, the situation gets quite complicated.
    Will we offer the same price to everyone? Or will we vary the levels of discounts?


    If we were to model the sales process, we would have to decide how we would approach
    the discount calculation. Shall we try to describe everything in the form of a
    single diagram? Such a diagram would be large and complicated to read. Moreover,
    based on such a model, it is extremely difficult to determine whether our rules
    are consistent, free of internal contradiction, or whether we have forgotten some
    important combination of conditions relevant to a certain customer segment. Modifying
    rules described in such a way is difficult and risky.


    Such problems occur not only in processes related to discounts but also in determining
    insurance premiums, pricing complex services, sophisticated purchasing processes,
    or those related to accepting invoices or other documents, where there are multiple
    levels of acceptance, depending on the type and amount.


    As you can see, using business process diagrams to show such aspects of **decision
    management** may not always be an acceptable choice. Luckily, there is a better
    way, popularized by **The Business Rules Manifesto**, which suggests that business
    process models should not contain detailed written rules, but that rules should
    be described and managed differently.


    These rules are not only used for documentation purposes. A special type of software,
    known as a business rules engine, also allows those rules to be automated, and
    a BPMN business rule task assumes that a process can use this approach. By using
    a business rule task, we can greatly simplify our diagram by presenting a piece
    of the process where we refer to business rules, and then showing how this can
    affect our process.


    As you will learn in the last part of this chapter, we can extend this even further
    thanks to the additional specification provided by OMG: **Decision Model and Notation
    (DMN)**.


    If you would like to learn more about the concept of business rules, I would suggest
    reading The Business Rule Manifesto at `https://www.businessrulesgroup.org/brmanifesto.htm`.'
  merge: -1
  img_proc: true
- pgno: 322
  md: '# # Script task


    Another type of task in BPMN is the **script task**. Tasks of this type have an
    icon of a written scroll of paper, or simply a script.


    ![](img/a4c90ee3d142c33743706d37c65779c2_322_0.png)


    Figure 9.35 – Script task


    Like a service, it is a process element that is executed automatically, but in
    a slightly different way. As intended by the authors of the specification, a service
    is a step in which the process automation engine calls out external applications
    that provide certain services. A script, on the other hand, is a step in which
    certain simple actions are performed directly by the process execution engine.


    Examples of such elements include simple validation of user-entered data and running
    simple calculations. These are only theoretical recommendations; however, as in
    many models, these principles are not followed. In some tools, service tasks are
    used to call specific classes of Java code. In general, service tasks are much
    more common in BPMN diagrams than script tasks.


    # # Call activity


    The last type of task is the **call activity task**. It is unique in many respects.
    First, it does not have an icon specific to its type and instead features a thick
    border, identical to that of a call activity sub-process.


    ![](img/a4c90ee3d142c33743706d37c65779c2_322_1.png)


    Figure 9.36 – Call activity task


    BPMN allows us to have call activities that are tasks or sub-processes. In both
    cases, it refers to reusing a certain standard, but in a different way.


    The sub-process call activity, which allows us to call other process diagrams,
    is an extremely useful and popular element of BPMN. On the other hand, task call
    activity is neither very helpful nor popular.


    What is the reason for this? The authors of the BPMN specification wanted to make
    it possible to show that certain standardized activities occur in processes. Their
    idea makes it possible to define certain types of tasks (e.g., user, manual, script,
    and business rule tasks) as so-called **global tasks**, serving as a kind of definition
    of how things should be done.'
  merge: -1
  img_proc: true
- pgno: 323
  md: 'Global tasks can be referenced by a task call activity. The concept is quite
    interesting, but in my opinion, it doesn’t quite meet actual business needs. There
    is also no well-defined way in which modeling tools are supposed to support this,
    which means that the implementation of this piece of the specification can vary
    greatly. Thus, this is an element of notation that is unlikely to be used in practice
    in a standardized way across tools.


    # Multi-instances


    The last element of the BPMN specification that I want to mention in this chapter
    is the mechanism for marking activities as being performed many times.


    Usually, when we think of a process and its steps, what comes to our mind is that
    once a step is finished, we can move on. Sometimes, however, the situation is
    a bit more complex. It may be that after completing a step, a check is needed
    to see whether the desired result has been achieved—if so, we can move on, and
    if not, the step must be repeated. It is also possible that we can tell in advance
    that a certain process step will need to be performed several times for us to
    move on.


    For situations like this, BPMN provides special markers that can be applied to
    both tasks and sub-processes.


    ![](img/a4c90ee3d142c33743706d37c65779c2_323_0.png)


    Figure 9.37 – Loop, multi-instance, and sequential multi-instance tasks and sub-processes


    A **loop**, whose marker is an arrow in a circle, means that a given step must
    be performed several times, but we cannot tell how many times in advance. We can
    only say it will be done as many times as needed (until some condition is met).
    A classic example is negotiation—going into a meeting, we are not sure whether
    an agreement will be reached the first time, or whether further meetings will
    be necessary.


    **Multi-instance**, often shortened to **MI**, tasks have the familiar symbol
    of three vertical lines, which in BPMN indicates that there is more of something.


    Such elements also execute more than once, but this time, we know how many times
    it will be in advance. A perfect example is processing batch/group of invoices
    that need to be paid. While performing this activity, we know that all the transfers
    must be executed, and we cannot leave any invoice unpaid.'
  merge: -1
  img_proc: true
- pgno: 324
  md: 'A multi-instance marker can also have a **sequential** variant, indicated by
    three horizontal lines. This means that the work cannot be divided among different
    people who do it in parallel (which is what the standard MI version assumes),
    but that it must be done sequentially. If you are not sure how to remember which
    marker version is for parallel and which for sequential, there’s a great trick
    that I learned from Filip Stachecki from EduMAX: the parallel variant has three
    vertical lines in its name (three **l**s).


    # # Extending BPMN


    As you’ve seen, BPMN offers you many possibilities. It is an easy-to-use standard
    notation that can be used by both business and IT users. There are hundreds of
    tools that support it, and lots of learning materials that can help you deepen
    your knowledge.


    However, even a 500+ page specification of BPMN could not cover all business modeling
    scenarios (especially when you take into account that the BPMN 2.0 specification
    also covers so-called **choreography diagrams** and **conversation diagrams**—two
    additional types of diagrams that are not very popular). The authors clearly state
    that the scope of BPMN is about the processes and not about concepts such as organizational
    modeling, data and information modeling, and strategy modeling, as well as modeling
    business rules, process simulation, and monitoring. They do not even mention other
    important scenarios, such as risk and compliance management or process architecture.


    Luckily for us, BPMN contains the brilliant concept of extensions. It is possible
    to add new attributes, markers, or artifact shapes, so long as the changes do
    not conflict with already existing elements. Extensions are also saved in a special
    way in XML BPMN Diagram Interchange files.


    # # BPMN extensions in practice


    BPMN extensions allows tool vendors to store their extensions inside BPMN files
    (such as form definitions and other elements needed for process automation), but
    they also provide some add-ons for standards such as BPMN in Color and BPMN i18n
    (as you’ve probably guessed, the former allows colors to be exchanged in BPMN
    diagrams, while the latter provides support for internationalization, which involves
    storing diagram translations that are in several languages in a single file).


    I want to share a simple example taken from the reference files provided by BPMN
    MIWG at `https:// github.com/bpmn-miwg/bpmn-miwg-test-suite/tree/master/Reference`.
    If you would like to explore more than a small snippet of the BPMN XML taken from
    a full file, please check out the `C.8.0.bpmn` file:


    ```

    `<semantic:sendTask id="_a97cla48-faba-447b-bfa6-7aa81a6fe0a0"

    name="Notify Employee of Approval" triso:readOnly="false"

    implementation="##WebService">

    <semantic:extensionElements>

    <adonis:MailTo>${email}</adonis:MailTo>

    <adonis:MailSubject>Your Vacation Request ${SYS.PROCESSINSTANCE_ID}

    was approved manually</adonis:MailSubject>`

    ```'
  merge: -1
  img_proc: true
- pgno: 325
  md: '```

