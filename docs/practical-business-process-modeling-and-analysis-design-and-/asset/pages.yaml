- pgno: 92
  md: 'Assessing the current state and maturity of business processes will involve
    creating an inventory with

    a central repository and then evaluating the existing business processes to determine
    the quality

    and accuracy of artifacts representing the coverage area. Pay attention to the
    names of people who

    created such artifacts, versions, date stamps, policy manuals, and other supporting
    documentation.

    Business process maps are like vegetables in the grocery store; most will have
    an expiration date as

    work evolves, and some artifacts may not be up to date. Working with process models
    over one year

    old most likely means will have to validate them. Six months to one year old is
    a good benchmark

    for the need for some rework.


    Your assessment can help identify gaps and opportunities for improvement, providing
    a baseline for

    measuring the transformation’s progress and impact. Don’t stop with business processes
    alone; you

    could expand this step into a full-blown maturity assessment to gain a better
    understanding of the

    collective process IQ and digital business platform adoption readiness across
    different parts of the

    company. Stakeholder maps, historical information about old programs, and especially
    intelligence about

    transformations that did not go as planned will equip you with invaluable information.
    Most process

    consultants know that stepping into the footsteps of a program that did not deliver
    on its promise will

    require extra time, effort, and severe recalibration with your stakeholders. Recovery
    prospects can be

    challenging, as the institutional memory will keep penalizing you for the mistakes
    of your predecessors.

    Field experience suggests that you would not want to restart new programs in the
    ashes of the old,

    failed initiative if at least two years have not passed since the program folded.
    Sometimes, unsuccessful

    efforts are associated with a particular digitization software vendor or technology,
    especially if the

    company attempts to transform parts of its operations without establishing the
    proper theoretical

    foundation, or your collaboration with the vendor does not go as planned. You
    could be surprised to

    learn that your strategic software vendor is more interested in subsequent go-lives
    and securing the

    next set of license seats than in enabling you and your team.


    Many companies also make a mistake by associating investment in digital process
    automation or

    low-code platforms with the actual work required to build the BPM practice. Once
    you make the

    first investment in a set of licenses, the ROI clock will start ticking, making
    the new shiny software

    toy too tempting not to be used.


    Businesses would have done themselves a huge favor and saved lots of investment
    dollars by investing

    in BPM training and skills before they decided to invest in software licenses.
    To make a comparison,

    you’d want to get your driver’s license, which teaches you how to get from point
    A to point B, before

    you buy a new car unless you are already an experienced driver. In this case,
    driving and launching

    BPM transformations have a lot in common. A weeklong boot camp course could get
    you up to speed

    with all necessary topics and back it up with some hands-on practice.


    This preparation phase will take some time, and you should consider your relationship
    with BPM as

    a long-term journey. Future phases and likely challenges faced by your program
    will benefit from this

    preparation. While it’s true that BPM shines in combination with the citizen developer
    style of software

    delivery, you may not realize that the lifespan of BPM in your organization could
    be many years,

    creating many new jobs in the future, coupling or extending the practice with
    other tech inventions.'
