- pgno: 66
  md: "While understanding the pros and cons of accidental transformations sheds light\
    \ on their challenges, crafting a clear vision of DtC provides a strategic roadmap\
    \ to navigate and mitigate these complexities effectively.\n\n# How do I craft\
    \ a vision of DtC for my business group?\n\nNow that we understand that DtC programs\
    \ need a little bit of foresight to be successful, let’s talk about the creative\
    \ process that preempts the planning phase. Jointly crafting and socializing a\
    \ vision of DtC is a step that’s very often overlooked, which can have far-reaching\
    \ consequences for your DtC program. Rallying people around fuzzy and ill-defined\
    \ visions won’t generate enough support in the organization intending to transform\
    \ itself. Let’s face it: changing the way companies operate can be difficult.\
    \ Visions rally people around common goals while bringing perspectives that might\
    \ have been overlooked. They also define future benefits and the reasons behind\
    \ the work that’s just about to start and continue for months, if not years. Visions\
    \ should be drafted by a leader who stands behind the idea of the transformation,\
    \ who understands the business and challenges faced, and who can identify metaphors\
    \ that generate clarity versus muddying the waters. Let’s review the following\
    \ three examples:\n\n+   • **Vision Example 1 – Senior Director**\n+   \n+   “Our\
    \ goal is to provide a scalable digital solution that empowers employees to move\
    \ quickly in a way that works for them, which will, in turn, improve the speed\
    \ and quality of work delivered, providing the best customer experience possible\
    \ while raising employee morale.”\n\n+   • **Vision Example 2 – SVP of Engineering**\n\
    +   \n+   “We are aiming to deliver solutions that unleash and connect our people\
    \ and accelerate the business.”\n\n+   • **Vision Example 3 – Director, Workforce\
    \ Enablement**\n+   \n+   “Our goal is to increase employee satisfaction and productivity\
    \ by enabling a fast, frictionless, and empowering digital workplace.”\n\nThe\
    \ process of creating and socializing the vision should take time and involve\
    \ most stakeholders of the impacted organization to avoid the perception of “this\
    \ is what we are going to do to you” versus “this is what we are going to do with\
    \ you.” If you manage to avoid the dreaded feeling that DTC is pushed on teams\
    \ from the top versus being jointly defined, half of your future battles are already\
    \ won.\n\nBringing external consultants to help craft the vision is also not the\
    \ best idea, even if they have more experience and carry the weight of the top\
    \ 5 consulting brands. While this may sound illogical, please remember that the\
    \ process of defining, obtaining buy-in, and support goes hand in hand. Having\
    \ a senior director communicate the vision of your group’s digital operations\
    \ will carry much more weight and set you up for long-term success. Use consultants\
    \ to learn from and to expand your awareness of what is going on in the market\
    \ while leaving the definition of the North Star map to your direct leadership\
    \ with the right level of authority and influence."
  merge: -1
  img_proc: true
- pgno: 67
  md: '# # How to plan for the future


    The World War II leader and U.S. President Dwight D. Eisenhower made a paradoxical
    statement about preparation. Here are two versions:


    +   - Plans are useless, but planning is indispensable.

    +   - Plans are worthless, but planning is essential.


    The advice of the leader of the free world should be considered when anticipating
    all potential impacts of DTX. Planning is a creative exercise that helps to prepare
    for the future without fully knowing what the future holds. Each business leader
    usually relies on their past experience and competitive research when anticipating
    the future; however, I’d like to call out the following common scenarios, which
    will require some careful consideration.


    # ## Plan for continuous adaptability


    In today’s economic environment, the primary value of digital change programs
    revolves around supporting strategic adaptability. Your company can no longer
    rely on the economies of scale and drastic efficiencies that drove CTO digitization
    agendas for process improvement just a few years ago. In today’s environment,
    it’s the companies that adapt the quickest to changing market conditions while
    at the same time supporting scale and efficiencies that win in the marketplace.
    Such strategies require a different thinking style, one aligned with experimentation
    and total empowerment of your workforce. Strategic adaptability also calls for
    a drastic rethink of the approach to the business and solution architectures in
    the enterprise. If you’ve ever tried to standardize the adoption of citizen development
    low-code platforms in your company, you understand how these tools call for a
    set of new governance paradigms that push boundaries and break the relationship
    between business and traditional IT.


    If you extend the same paradigm to business and process analysis and empower business
    users to actively participate in the design of your business processes without
    the involvement of teams of process architects, we are talking about unleashing
    a mighty innovation force that not only experiences business pain points daily
    but one that is actively empowered to tackle their own issues. Of course, the
    adaptability of the employee onboarding process will mean something else in a
    global environment where local workforce rules and regulations change more frequently
    than in a process that supports the operation of a local county or province, so
    it’s always good to keep the scale in mind.


    A company’s need for adaptability should be considered through the lens of enterprise-wide
    process architecture, and I am a massive proponent of companies investing resources
    into this capability. Investing but not overinvesting, as we don’t want to create
    ivory towers of business professionals who carry with them pages of diagrams telling
    everyone to look at the world through the process lens. When you upskill enough
    people and start treating process skills in the same fashion as you would have
    treated presentation or negotiation skills, you will start noticing a shift in
    team thinking about business areas they support. It’s like people start communicating
    about their work and business'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# # Embrace the disruption of your workforce


    DTC programs can drive very aggressive optimization of work, changing the way
    people perform their day-to-day activities. The fear of being displaced by AI
    or software is real. That fear, though, is not founded on any data, and we should
    be fearful of how our jobs will change rather than how we will be able to compete
    against machines in our day-to-day work. Thomas Davenport, in his book titled
    _Only Humans Need Apply: Winners and Losers in the Age of Smart Machines_, mentions
    a couple of strategies that professionals can apply to rediscover themselves in
    the workplace that’s getting disrupted. Work automation implementation teams driving
    the adoption of DTX platforms are closely familiar with change management, which
    some describe as “fear management.”


    Emotions can inhibit the adoption of disruptive frameworks and solutions, creating
    the drag expressed by Forrester and Boston Consulting Group through the mind-boggling
    statistic of more than 60% of large-scale transformations failing. This is a very
    high number to ponder, especially considering the amount of hours and dollars
    that go into such programs.


    The other type of disruption faced by your workforce has to do with skills development.
    As digital change programs gain acceptance, new roles emerge, requiring the reskilling
    of your workforce. Business process owners, business process architects, and digital
    change managers are examples of such roles.


    In addition, your own business professionals will need to pick up or update their
    skills as well. While many good professional certificates specialize in DTX and
    DTC tracks, most graduates of business schools do not get enough exposure to these
    topics during their education, with vendors frantically trying to fill in the
    gaps by offering commercial courses packaged for college students.


    challenges using the same visual language, creating shared understanding of projects
    and processes they support, and helping to spot-check and diagnose issues. Speaking
    about, but more importantly, understanding the same process notation can be very
    powerful since visual notations can be easier to comprehend than pages of written
    work instructions. Citing the field experience of Igor Jericevich, Managing Director,
    ShareDo, Australia, who implements advanced case management solutions in the legal
    industry: “One of the core challenges I see repeatedly is the obsession with trying
    to nail down every permutation of a process before implementation. Analysts would
    draw boxes and lines, arguing over every exception and alternate paths, until
    the process became more of a prison than a guide.”


    Igor started to use the following analogy with his clients: “You’ve laid railway
    tracks, and now your business is the train. But what happens when a tree falls
    on the tracks? Process maps appear elegant and planned until the real world intervenes.
    Adaptability does not mean abandoning structure; it means embedding intelligent
    flexibility within it.” He suggests users stay cautious and don’t turn adaptability
    into an excuse for chaos. Guardrails are critical, and the best adaptive systems
    still have a strong definition of what “good” looks like. They allow multiple
    paths to get there.'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'Digital Change initiatives leave plenty of opportunities for HR and resource
    management professionals to step in and fill in the knowledge gaps created by
    aggressive project launches.


    # Plan to generate and manage lots of intellectual property


    Business process discovery, definition, and redesign create lots of metadata about
    the work performed by your organization. The number of attributes, questions,
    and KPIs that can be brought to light can be mindboggling. Many times, this is
    the first time many professionals have started seeing all of the attributes defining
    their business processes; many people discover that they’ve been using incorrect
    taxonomy and terminology, or did not consider the full scope of work. Stepping
    outside of your core work area to look at the operations of your business process
    end-to-end can be a scary proposition, primarily because we’ve been pigeonholed
    into our jobs, thinking about the work in terms of RACIs. Well, this is a mistake
    that’s caused by years of indoctrination by Master of Business Administration
    (MBA) and Project Management Professional (PMP) programs.


    > Note

    > RACIs refers to the RACI matrix, a project management and process tool used
    to clarify roles and responsibilities. RACI stands for: Responsible – Who does
    the work, Accountable – Who owns the outcome, Consulted – Who gives input, and
    Informed – Who needs to be kept in the loop.


    RACIs were designed for different reasons, not to look at work end-to-end. If
    you ever step outside of your core role or team to learn about how the activities
    and work of others impact your daily job, I guarantee it will be an eye-opener.
    Smart companies recognize the fact that business processes, their attributes,
    and interdependencies reflecting group relationships create the imprint of your
    business, and this knowledge is extremely valuable. Why rely on external consultants
    to capture and model your organization’s intellectual property, only for that
    knowledge to walk out the door with them at the end of the project? I’ve always
    struggled to understand the business rationale behind outsourcing process discovery
    and modeling to third-party firms. These consultants often leave with a deep understanding
    of your operations embedded in their “muscle memory”—not yours.


    Instead, empowering your own employees to discover, model, and categorize business
    processes is a far more sustainable strategy. Yes, it may feel riskier or more
    resource-intensive at first, but the long-term benefits will be substantial.


    What’s a better approach? Bring in experienced process architects not to do the
    work for you, but to teach, mentor, and guide your internal teams. Their expertise
    will accelerate your transformation while ensuring your people build lasting skills
    and process awareness. It’s a true win-win: your workforce grows more capable,
    and your organization gains a deeper understanding of how it operates.'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'The tricky part is that you need to be able to capture, present, and continuously
    enhance this great knowledge, but the spectrum of solutions ranges from SharePoint
    sites with highly organized folder structures reflecting layers of your company’s
    process architecture to specialized software repositories such as the ones from
    ADONIS or iGrafx. When choosing the vendor of choice, think about reusability,
    ease of access, and the compatibility of the product with the overall DtC strategy.
    You’d not want to invest in a cloud-based process repository from IBM if you were
    thinking about driving digitization using Microsoft’s Power Platform suite of
    tools. While all vendors offer some level of interoperability, placing the **Business
    Process Model and Notation (BPMN)** in the center, standard compatibility between
    tools from different camps can vary product by product. Some vendors, such as
    Pega or Microsoft, offer direct uplift in application design if the business process
    modeling starts in Visio.


    # # Plan for the long term, but focus on the short term


    DtC initiatives usually carry tons of risk, and for the right reason. Between
    technology, people, scope, and business constraints, the list of things that can
    go wrong is long. One of the primary objectives of the person creating strategic
    plans for such initiatives is maintaining executive support throughout the program.
    Anyone can create a multi-month schedule in MS Project; however, it’s the track
    record of hitting multiple milestones that will sustain the executive support
    throughout the length of the program.


    Project managers and engagement leaders don’t own crystal balls, but they understand
    that the tides may change, and they may change quite frequently, impacting the
    work of a team. Keeping milestones manageable will ensure the risk is properly
    managed and deadlines are met. This approach will build momentum to help you spread
    your wings a little. Another factor that can hinder the progress of your project
    is the scrutiny caused by the financial pressures of your sponsors. When your
    business sponsors invest millions of dollars into licensing and consulting labor,
    their expectations for the ROI will be super high, and the slightest project issue
    will get their attention. DTX projects can get very challenging technically, despite
    vendor promises of technological nirvana. Transforming businesses, even with the
    most expensive and sophisticated technology in the world, still depends on factors
    that mostly exist outside the realm of technological platforms. Old-fashioned
    project prioritization, lack of access to APIs and interfaces, an inability to
    get access to SMEs, leadership turnover, burnout, and the high turnover of resources
    on the project can successfully halt implementations for the best teams using
    the most sophisticated technology.


    If you don’t consistently deliver on your short-term goals, even the smallest
    ones, your credibility to deliver the long-term view will tarnish. Success builds
    on top of success, even the smallest ones, and in the initial stage, it’s super
    important to pay attention to credibility building.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# # Plan to regularly adjust your plans


    This may sound like a cliché, but build learnings from experimentation as a phase
    into your projects. As you step into the operations of your company and discover
    details that have not been considered in the past, your plans and thinking about
    your project will change. It’s best to make changes to your plans from a place
    of having data and knowledge on hand. There are a few situations that will cause
    shifts in strategy generated by worldwide issues, such as wars, geopolitical shifts,
    natural disasters, and shortages. These large grain shifts affect the DTX efforts
    and the ongoing work. While at Microsoft Finance, we’ve been faced with a situation
    requiring us to rapidly adjust our payment ecosystem caused by the war in Ukraine,
    trying to support all the great work of Microsoft partners. These unforeseen events
    delayed the execution of our optimization projects by weeks.


    # # Plan to size and scope properly


    Digital process transformation projects tend to grow in scope, and they can quickly
    multiply. Even the ones that start as tiny, itsy bitsy business process improvements
    can touch a nerve and expose business processes of monumental sizes. There are
    multiple reasons for this phenomenon, but the ones I’d like to call out are the
    interconnectedness of business processes, lack of experience with processed design,
    lack of familiarity with the estimation of DPA projects, and a lack of understanding
    of the maturity of the underlying architectural landscape of the business unit
    targeted for transformation.


    While at Nordstrom, I’ve seen process prototype ideas that turned into projects
    driving company-wide supply chain operations. I’ve also seen large-scale transformations
    that lasted for months due to the business criticality of the work they were improving.
    Don’t get into projects assuming you already know the scope; arriving with an
    open mind to allow for enough experimentation should expose the true size of the
    program, allowing you to properly size the work.


    The other critical detail of scoping has to do with the timing of when effort
    estimates get made. It’s usually best to approach sizing in an iterative fashion,
    starting with T-shirt sizing, then moving to **Rough Order of Magnitude (ROM)**,
    and finally providing budgetary guidance as you continue to receive more information
    about the scope and constraints, allowing you to apply technical contingencies
    (50%, 15%, 5%). Depending on field-proven estimation models that consider scaling
    factors grounded in the realities of your organization or similar organizations
    from the same industry will help increase the quality of your estimates. We touch
    on the topic of estimation in _Part 3, Chapter 11_. Knowing when to size is as
    important as knowing what to size. Keep that in mind. Such an approach may be
    hard to explain to leaders who want quick answers, but quick answers usually damage
    credibility. I’ve seen this scenario repeat itself repeatedly; a business architect
    pushed for quick answers creates a shiny Excel spreadsheet with the final schedule
    and cost information, damaging the reputation of the transformation program by
    not delivering projects on time due to incorrect assumptions and wrong timing
    of when assumptions and estimates were made.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# # Plan for growth


    From my experience, business process owners and sponsors who undertook digital
    change initiatives experienced significant business growth as process inefficiencies
    and kinks were worked out during the program. While it may not be easy or even
    possible to forecast upfront how much additional revenue will be generated in
    the future, we can safely anticipate business growth based on the following:


    +   - Business optimization will make the operations of your business more efficient,
    initially increasing the volume of work handled by the business process.


    +   - Elimination of waste, inefficiencies, and manual workarounds implemented
    as Excel spreadsheets will speed up the pace and the quality of the work flowing
    through business processes.


    +   - A higher quality of work usually reflects higher customer satisfaction.
    Increased satisfaction leads to additional work or projects. Take advantage of
    the old adage that good work creates more work, and good services or products
    generate more business value and additional sales opportunities.


    +   - Increased transparency offered through the digitization of business processes
    will create real-time metrics about ongoing operations. Such metrics can be used
    to analyze the process retroactively and also to support future process simulations.


    Digital change initiatives, if sustained to the end, will advance the organization’s
    operations to the fourth-fifth level of process maturity (managed/optimizing).
    At the optimizing stage, companies start experimenting with existing business
    models, introducing and piloting new ideas and models that can bring more revenue
    or cut costs.


    +   - Many digital change initiatives involve the introduction of new technology
    platforms to streamline and optimize business processes. As technology matures,
    new ways to increase capacity become available to support the global scalability
    of your processes through services such as Azure Autoscale or Azure SQL Database
    Hyperscale, further driving the scalability of business processes implemented
    on low-code platforms. Let’s not forget that cloud-based, on-demand services support
    growth while decreasing the need for constant IT resources consumed, helping to
    avoid overinvestments into infrastructure and energy and pushing the ROI of DtC
    initiatives to new highs.'
  merge: -1
  img_proc: true
