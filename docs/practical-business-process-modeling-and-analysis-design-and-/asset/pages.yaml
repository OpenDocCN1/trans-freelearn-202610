- pgno: 344
  md: 'After the intake process, the application allows us to collect supporting documentation
    and links to user stories, test cases, and Jira or Azure DevOps repositories,
    thereby enhancing the quality of the documentation and providing additional context:


    ![](img/a4c90ee3d142c33743706d37c65779c2_344_0.png)


    Figure 10.7 – Citizen developer app registry (app documentation)


    Work and process applications go through a life cycle that mirrors the business
    processes they support. Similar to groceries, some applications have an expiration
    date. New applications can be quickly developed and added to the portfolio to
    address immediate process challenges, while others may only serve specific purposes
    and can be phased out in just a few weeks. This approach is in line with the **business
    process management (BPM)** life cycle. What’s crucial is creating a system that
    measures the value these applications deliver to the organization.


    # ## Key metrics for measuring business value


    In the dynamic landscape of process transformations, various metrics play a key
    role in driving successful initiatives. Such metrics include financial, operational,
    customer, and employee-focused metrics. These can be used to create a baseline
    for digital change experimentation, which is recommended as a strategy to introduce
    process digitization technologies at scale incrementally. Let’s explore each in
    more detail.


    # ### Financial metrics


    +   - **ROI**: Measures the financial gains or losses resulting from process transformation
    relative to the initial investment.


    +   - **NPV**: Assesses the profitability of an investment or project. A positive
    NPV signifies that the expected earnings surpass the estimated costs, thereby
    deeming the investment feasible.


    +   - **Payback period**: Determines the time it takes for an investment to generate
    enough cash flow to recover the initial cost.'
  merge: -1
  img_proc: true
- pgno: 345
  md: '+   - **Cost savings**: Evaluates the reduction in costs due to improved efficiency
    and elimination of waste.

    +   - **Revenue growth**: Assesses the increase in revenue as a result of improved
    processes that enhance productivity and market reach.


    The business benefits of individual transformations, including your citizen developer
    initiatives, should roll under the financial metrics umbrella. In other words,
    if you expect the ROI of your three-year investments to be 320%, the collective
    ROI of all individual projects that are executed as part of your programs should
    amount to 320%. ROI, cost savings, and revenue growth will be monitored throughout
    the execution of your program, while NPV will be used at the beginning to help
    you make an investment decision.


    # ## Operational metrics


    +   - **Cycle time reduction**: Measures the decrease in the time taken to complete
    a process from start to finish

    +   - **Error rates**: Tracks the reduction in errors and defects, leading to
    higher-quality outputs

    +   - **Productivity improvement**: Evaluates the increase in output per unit
    of input (e.g., labor hours, machine usage)


    These metrics will roll under your company’s OKRs. They can also be included in
    your individual performance goals.


    Let’s consider some examples:


    +   - Reduce the rate of late payment errors by 10% over the next six months (quality
    improvement scenario)

    +   - Due to increasing business volumes and budgetary freeze, your goal is to
    improve the productivity of your team by 20% within the next 6–9 months (do more
    with less scenario)


    # ## Customer-focused metrics


    +   - **Customer satisfaction**: Gauges improvements in customer satisfaction
    through surveys and feedback mechanisms. **Customer satisfaction score (CSAT)**
    is measured by customers through a rating on a scale.

    +   - **NPS**: Measures the likelihood of customers recommending the company’s
    products or services to others. This is measured on a scale of 0 to 10, measuring
    customers as Promoters (9-10), Passives (7-8), or Detractors (0-6).

    +   - **Customer retention**: Assesses the impact of process improvements on customer
    loyalty and retention rates. It’s expressed as a percentage of customers who continue
    to do business over a specific period.'
  merge: -1
  img_proc: true
- pgno: 346
  md: '+   - **Customer churn**: Also known as customer attrition, this refers to
    the percentage of customers who discontinue using a company’s products or services
    over a certain period. It is a crucial metric for businesses, especially those
    with subscription-based models or long-term customer relationships, such as in
    the telecom, **Software-as-a-Service (SaaS)**, and retail industries.


    # ## Employee-focused metrics


    +   - **Employee satisfaction**: Measures increased employee morale and job satisfaction
    due to streamlined processes. It’s expressed through surveys and **employee net
    promoter score (eNPS)**.


    +   - **Training time**: Evaluates the reduction in training time required for
    new processes, leading to quicker employee onboarding.


    +   - **Employee turnover**: Assesses the impact of process transformation on
    employee retention and turnover rates.


    Working with poorly designed or manually executed processes can cause all types
    of challenges for your team or business. Employee-focused metrics tend to be evaluated
    a bit on the sidelines, while core business metrics get immediate visibility.
    There is a clear connection between the quality of your processes’ execution and
    team thriving scores. Happy and high-performing teams are not bugged by missing
    operating procedures, broken processes, or the need to search for clarifications
    while performing work. Considering employee-focused metrics in the scope of process
    design is a smart business strategy that directly contributes to operational metrics.
    If you want to drive successful operations, don’t neglect to include employee-focused
    metrics in the scope of your transformation. Your leaders and your teams will
    thank you for it.


    In addition to the reasons mentioned here, defining and measuring metrics can
    serve as a compass that’s used to evaluate the maturity of your DTX program. Let’s
    take a closer look:


    +   - **Establishing a baseline for digital change experimentation**: The measured
    benefits of the early stages of digital change programs will evolve as the program
    progresses, and the organization becomes more comfortable adopting new skills,
    frameworks, and technologies. This process will continually enhance the cycle
    of BPM and continuous improvement. By establishing a baseline for your program’s
    value, you will be able to immediately notice shifts in performance as your processes
    launch and mature over time. Time spent transforming operations flies quickly
    and, sooner rather than later, you will have to explain or contribute to a business
    justification as your initiatives require additional funding or program extensions.
    Coming to these discussions prepared with data collected over time will elevate
    these conversations to a different level. The alternative is to scramble for data
    and models while attending your day-to-day job, trying to piece together data
    to demonstrate the work that’s been completed over the last few months. It’s harder
    to do than it seems, as in this case, a methodical, forward-looking approach to
    data collection and business value evaluation will be key. It is the most frustrating
    feeling in the world trying to piece together the BVA story by chasing your project
    stakeholders, refreshing assumptions and calculations from over 1-2 years ago,
    and working with teams when people'
  merge: -1
  img_proc: true
- pgno: 347
  md: 'move and priorities shift. You may find yourself in a tough spot, having to
    explain to others what you did and did not accomplish with your time and resources.
    Leaders can suffer from short-term memory when it comes to overcoming challenges
    if the numbers they present do not reflect well on their historical decisions.
    Protect yourself from this type of self-preservation and scapegoating by embedding
    fair and transparent methodologies for BVA and benefits verification.


    +   • **Challenging assumptions**: Projects that promise significant ROI but take
    much longer to deliver than initially planned require a reality check through
    a thorough retrospective. Launching AI automation or process transformation programs
    without using the critical BVA methodology, especially by individuals lacking
    experience in this area, can lead to prolonged implementations, failure to achieve
    the intended vision, or damage to the reputation of otherwise promising initiatives.
    There is nothing wrong with an organization encouraging learning and experimentation,
    so long as fundamental principles are firmly established upfront. Your BVA framework
    should act as an anchor amid the uncertainty and chaos that can arise when business
    professionals experiment with digital change. Capturing and aligning people around
    assumptions will provide everyone with a unified starting point, allowing learning
    through experimentation to take place. Unspoken assumptions should be treated
    as cracks in the foundation of your initiative; it’s always safer to bring them
    into the open.


    In the following section, we will describe the most commonly encountered techniques
    for measuring business value.


    # Models and techniques for measuring business value


    Accurately measuring value is critical to ensuring that investments provide tangible
    benefits. Different models and techniques have been developed to drive companies
    in this endeavor, each offering unique perspectives and advantages. Adopting different
    methodologies allows businesses to modify their approach to specific needs or
    phases of the program, whether it’s optimizing processes, evaluating financial
    implications, or assessing potential program ROI. Leveraging a diverse set of
    methodologies allows us to make informed decisions. Among these methodologies,
    the following six deserve a mention:


    +   • **Six Sigma**: A data-driven methodology that focuses on improving processes
    and reducing variation to enhance overall performance. An example of this is provided
    in the Case study 3 section of this chapter.


    +   • **Cost-benefit analysis (CBA)**: A systematic approach that’s used to evaluate
    the financial and non-financial impacts of a project or decision. By comparing
    the total expected costs against the total expected benefits, CBA helps organizations
    determine the feasibility and profitability of an initiative. This method involves
    identifying and quantifying all relevant costs, such as technology, implementation,
    training, and maintenance, as well as the anticipated benefits, including cost
    savings, revenue increases, productivity gains, and quality improvements. For
    an example, see Case study 1.'
  merge: -1
  img_proc: true
- pgno: 348
  md: '+   • **Analyst methodologies—Forrester TEI**: This comprehensive methodology
    combines four key components: cost, benefits, flexibility, and risk. By assessing
    these elements, organizations can gain a holistic view of the financial impact
    of their initiatives. The TEI methodology involves detailed data collection and
    analysis to quantify the costs associated with technology investments, implementation,
    and ongoing operations. It also identifies and measures the benefits, such as
    cost savings, productivity gains, and revenue growth. Additionally, the TEI technique
    considers a solution’s flexibility to adapt to future changes and the risks that
    may affect the expected outcomes. An example of this can be found at https://tools.totaleconomicimpact.com/go/forrester/teioftei/index.html.


    +   • **Digitization platform vendor ROI calculators**: These serve as a structured
    framework to quantify and articulate the business value generated from a process
    transformation. By leveraging this toolkit, organizations can systematically assess
    key value drivers such as cost savings, efficiency gains, risk reduction, and
    enhanced user experience resulting from automation or optimization initiatives
    led by citizen developers. The toolkit enables teams to capture tangible and intangible
    benefits through standardized metrics, helping build a clear business case for
    transformation efforts. Additionally, it supports continuous improvement by offering
    insights into value realization and alignment with broader organizational goals,
    ensuring that process transformations deliver measurable impact and strategic
    advantage. Examples include UiPath Automation Hub, Microsoft Power Platform COE
    Starter Kit, and Pega Solution Finder.


    +   • **Citizen developer COE business value toolkit**: This is a powerful resource
    for measuring the business value of process transformations led by citizen developers.
    This toolkit provides a structured framework for evaluating initiatives’ financial
    and non-financial impacts, ensuring that even small-scale projects can demonstrate
    their value effectively. By leveraging this toolkit, organizations can quantify
    costs such as technology investments, implementation expenses, and training while
    identifying benefits such as cost savings, productivity gains, and revenue growth.
    The toolkit includes data collection and analysis methodologies, enabling citizen
    developers to present clear and compelling evidence of their projects’ ROI. Additionally,
    it offers guidance on assessing flexibility and risk, ensuring that the solutions
    are adaptable to future changes and resilient to potential challenges. An example
    of this can be found at https://learn.microsoft.com/en-us/power-platform/guidance/coe/business-value-toolkit#the-business-value-toolkit.


    +   • **Service-play-based BVA**: This methodology employs expert services to
    systematically evaluate the various stages of a new initiative. It integrates
    elements of process management, solution architecture, estimation, and risk management.
    The analysis draws on historical use cases, industry benchmarks, and scaling factors
    such as utilization, self-enablement levels, and experience. These factors are
    adjusted dynamically to suit the specific scenario being assessed. Staying updated
    on the latest technology and software options that are proposed as solutions is
    essential. Additionally, this service provides valuable insights for financial
    models that calculate values for CBA, ROI, and Net NPV. For an example, see Case
    study 2. The method for assessing business value depends on your preference, the
    type of project, the technology being utilized'
