    # ## Discovering new trends


    As a BPM and process practitioner, it is essential to keep up with the latest
    trends and innovations that shape the field and affect business outcomes in the
    workplace. By staying informed and adaptable, you can leverage the opportunities
    that arise from the changing market demands, customer expectations, and technological
    advancements. This section will discuss some methods and sources that can help
    you discover and track new trends impacting your career.


    # ## Online platforms


    One way to track the types of DTX jobs in the marketplace is to use online platforms
    that aggregate and analyze job postings from various sources, such as Indeed,
    Glassdoor, or LinkedIn. These platforms can help you search for relevant keywords,
    filter by location, industry, function, level, or salary, and compare the skills,
    qualifications, and responsibilities required for different roles. By monitoring
    the job market trends, you can also identify the gaps and opportunities in your
    profile and tailor your resume and portfolio accordingly. Additionally, you can
    follow the news and updates of the leading organizations and consultancies that
    offer BPM and DTX solutions, such as Accenture, McKinsey, and EY, and through
    regular publisher reports and whitepapers, learn about their current projects
    and achievements.


    # ## Social media


    User communities tend to group themselves around products and companies as they
    develop a strong affinity toward solutions from a particular vendor. Most process
    and DPA vendors tend to market very similar sets of product capabilities; what
    makes each different is the approach to the training, the ROI equation, and the
    size and strength of their user communities.'
