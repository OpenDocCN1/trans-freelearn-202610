- pgno: 118
  md: 'Consider the following statistics:


    +   • A survey indicates that 60 to 80% of process transformation projects fail.
    Another source mentions that 50% of BPM projects fail due to a lack of collaboration
    between business and IT.


    +   • 96% of executives who fail at BPM attribute this to a deficiency in employee
    buy-in (*What Business Process Management Statistics Experts Want You to Know*.
    Cflow. March 6, 2023. www. cflowapps.com/business-process-management-statistics/).


    +   • Over 50% of companies not using BPM software consider it too costly.


    +   • Only 26% of organizations employ process mining to evaluate their process
