- pgno: 178
  md: '# # Process attributes


    Figure 6.3 shows an example of the multi-level process architecture. It gives
    an easy overview of the dependencies between processes, but also allows you to
    move easily between different models thanks to hyperlinks, which make it easy
    to navigate in depth with a single click.


    In our example, we showed not only how processes impact each other but also how
    they can be decomposed further. Prefixes allow us to quickly determine what level
    we are at and what the _parent_ of our process is. For example, the **CP01.02.01**
    prefix shows that this is a process that’s described at the third level and that
    its parent will be the process with the **CP01.02** prefix. However, there are
    also more sophisticated ways to capture key information about processes, such
    as their relationships with other processes, that allow us to change the information
    about the process without the need to change its name.


    At first glance, models such as those shown in _Figure 6.1_ and _Figure 6.2_ may
    appear to be just pretty pictures, but a process architecture is much more than
    nice-looking graphics that allow for easy navigation. Usually, each object representing
    a process has many more attributes that are useful for information, management,
    and analytical purposes.


    _Figure 6.4_ shows an example of additional information that a process architecture
    could contain (using the ADONIS BPM tool). Apart from the process name (**CP01.02.02
    Process Kb2**), we could also have a link to a more detailed process landscape
    or a BPMN business process diagram and description that provides more information
    about what is happening in this process and how is it executed (this is especially
    important for processes that do not have linked models that provide more details).


    However, this is not all. We could also state what the goal (or aim) of the process
    is, what triggers the process, and what the results of the process are. If we
    state a process goal, it will also make a lot of sense to consider the **key performance
    indicators (KPIs)** for this process. For some processes, a **Service Level Agreement
    (SLA)** can also be added.


    Apart from the aforementioned attributes that are shown in the **General information**
    tab, we can add much more information. Names of other visible tabs can give you
    hints about what kind of attributes can be placed there.


    A very important aspect of process management is the connection between processes
    and organizational structure. Ideally, for each process, we should define ownership
    and responsibilities—who the **process owner** is, who supports the owner, what
    units are involved in performing the process (often called actors or **participants**),
    and more.'
  merge: -1
  img_proc: true
