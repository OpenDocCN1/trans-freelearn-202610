    | Benefits | $6,950,000 |

    |---|---|

    | Annual Net Benefits | $6,550,000 |

    | Costs | $4,050,000 |

    | Total Investment (year 0 + ongoing support costs over three years) | $4,050,000
    + ($400,000 x3) = $5,250,000 |

    | Total Net Benefits (years 1-3) | $19,650,000 = (3 x $6,550,000) |

    | Three-Year ROI | [($19,650,000 – ($4,050,000 + $1,200,000)) / $5,250,000] x
    100 = 274% |

    | NPV (using 8% discount rate) | -$4,050,000 + [$6,550,000/(1.08)] + [$6,550,000/(1.08)²]
    + [$6,550,000/(1.08)³] = $12,829,140 |

    | Payback | ~8 months into year 1 |


