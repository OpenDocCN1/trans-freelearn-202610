    It is evident that these KPI sets complement each other. Tracking these measures
    across a growing portfolio of projects is challenging; thus, when beginning with
    a small scope, you might not gather data for all metrics. When introducing your
    CoE operating model, prioritize two or three key measures based on sponsor guidance
    and expand as you mature, develop your team, and secure additional funding.


    # BPM program launch mistakes


    As detailed earlier, various business scenarios can initiate BPM program launches.
    However, these scenarios do not always facilitate sequential planning and preparation
    phases, as one might ideally prefer. These instances often lead to common errors
    you should strive to avoid. The most effective strategy is to pause, assess the
    current stage of the BPM wheel, and step back if necessary to ensure no essential
    activity is overlooked. Here are some frequent mistakes made by those new to BPM
    practice:


    +   - Advancing from the competency phase to excellence too quickly or too slowly.

    +   - Failing to align your CoE strategy with the company’s maturity level.

    +   - Approaching transformation solely through a technological perspective (i.e.,
    focusing on automation for technology adoption rather than business transformation
    driven by strategy, process, and technology).

    +   - Failing to secure two to three “quick win” projects and then successfully
    converting them into tangible outcomes.

    +   - Not adjusting external process and methodology standards to fit your company
    culture and existing practices.'
