- pgno: 49
  md: '+   - The global reach of this publication prompted us to designate 5% of book
    advances and royalties to the American Red Cross. We live on separate continents
    in three different geographies characterized by different climates. Despite being
    separated by about 5,880 miles (or 9,464 km), we’ve experienced and are worried
    about rising global temperatures and their impact on daily lives. Through a network
    of donors, volunteers, and employees, the American Red Cross shares a global mission
    of preventing and relieving suffering in areas impacted by climate change. We
    can teach you how to accelerate DTX for your employers from the comfort of your
    living room. The Red Cross’ work is based on countless hours of volunteers who
    help other people get out of dire situations they never thought were possible.
    Get involved, learn about their work, donate, and volunteer. There are no quick
    and easy fixes to problems the Red Cross works on, and we felt it was important
    to elevate the importance of their work and the sacrifices of their volunteers.
    One day, we all may find ourselves in the path of a wildfire, hoping the Red Cross
    will be there to offer its help.

    +   - We’d like to thank the multiple technical reviewers for their input on this
    book. Your deep experience and guidance are greatly appreciated.

    +   - We will consider ourselves successful with this book if your abilities to
    initiate, plan for, and execute DtC programs improve substantially. We have tons
    of skin in the game.


    With this quick introduction to the whys behind this project, let’s focus a little
    bit on the book’s topic to highlight the content we plan to cover in subsequent
    chapters.


    The book you are reading is intended for decision-makers, stakeholders, or participants
    in business change projects that are part of a broader DTX.


    # ## Multiple takes on DTX


    Before we start discussing different triggers of process-led **Digital Change
    (DtC)** programs, let’s spend a little bit of time discussing what DTX is and
    what it is not. This should help us then frame DtC in the context of the broader
    DTX.


    As of 2025, there are a couple of definitions of DTX worth noting. We will start
    by looking at **McKinsey & Company’s**:


    > > "Digital Transformation is the rewiring of an organization, with the goal
