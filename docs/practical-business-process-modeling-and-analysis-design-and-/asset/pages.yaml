- pgno: 205
  md: 'As you will immediately see, it is clear what the steps of the process are
    and what the logic of the process is, including where the process splits into
    exclusive paths (i.e., only one path can be taken: the complaint is either valid
    or invalid).


    This simple flowchart shows in practice several things important for reading process
    diagrams:


    +   • The process needs to have a specific place showing its start and end

    +   • You read the process diagram by following the arrows connecting the objects

    +   • Process steps, that is, work that needs to be done, are usually shown as
    rectangles

    +   • Places where the process splits into several paths are usually shown as
    diamonds

    +   • If a certain part of the process is complex, it may be helpful to simply
    mark it in what is called a subprocess, that is, a process of a lower level, instead
    of trying to show everything in one big diagram


    Simple flowcharts do not show responsibilities for process steps, but this was
    added to more advanced versions of flowcharts (cross-functional flowcharts) later
    on.


    # Going beyond flowcharts – overview of other notations


    While flowcharts provided a nice way to show what is happening inside a process,
    it quickly became apparent that there are additional ideas regarding how processes
    can be modeled.


    Notations that I think are worth mentioning in this section are the following:


    +   • IDEF

    +   • LOVEM

    +   • UML

    +   • EPC'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# # IDEF


    The **Integrated DEFinition (IDEF)** method is a family of modeling notations
    developed for the US Air Force and the Department of Defense in the 1970s. It
    contains several model types serving various purposes – among them, IDEF3 is meant
    for modeling processes. It is not very popular nowadays outside the US but it
    shares some of the characteristics that we have already covered, such as representing
    activities as boxes and connecting them with arrows. You can learn more about
    IDEF3 and see examples at `https://www.idef.com/idef3-process-description-capture-method`.


    # # LOVEM


    **Line of Visibility Engineering Methodology (LOVEM)** was introduced by IBM in
    the mid-1990s to model processes for the purpose of reengineering initiatives.
    As process reengineering lost its appeal, LOVEM also stopped being used frequently.
    Just like IDEF, LOVEM also had several types of charts (so-called **Line of Visibility
    Charts (LOVCs)**). You can see examples of various LOVCs and learn more about
    LOVEM from the (archived) publication by IBM available thanks to the Internet
    Archive: `https://web.archive.org/web/20140309022748/http://www.redbooks.ibm.com/redbooks/pdfs/sg242590.pdf`.


    Just like in IDEF, LOVEM also used boxes representing activities and arrows, but
    also **swimlanes** showing who does what. The innovation in LOVEM is the **line
    of visibility** – a special line in a diagram showing the border between the company
    and the customer. Apart from this, LOVEM also helped show additional information
    such as data flows inside a process.


    # # UML


    While IDEF and LOVEM are not used often, our next notation is still popular. **Unified
    Modeling Language (UML)** is a modeling standard still popular among IT specialists
    for documenting various aspects of software development. Just like the previous
    examples, UML also has many diagram types (14 in version 2.5) serving various
    purposes. Unlike other notations, UML is a standard supported by an independent
    body – the **Object Management Group (OMG)** – which oversees the standard and
    maintains it.


    UML also boasts a long history – version 1.0 was proposed in 1997, and the latest
    update (version 2.5.1) was published in December 2017. You can learn more about
    UML on the standard’s website: `https://www.uml.org/`.


    Out of the many diagram types, **activity diagrams** could be used for modeling
    processes. In the following figure, you can see an example of a UML activity diagram.'
  merge: -1
  img_proc: true
- pgno: 207
  md: '![](img/a4c90ee3d142c33743706d37c65779c2_207_0.png)


    Figure 7.2 – Example process as a UML activity diagram (created in Enterprise
    Architect)'
  merge: -1
  img_proc: true
- pgno: 208
  md: 'As you can see, activity diagrams preserve the rules we have mentioned so far.
    In addition, they introduce different visualizations for start and end nodes (circles)
    and use rounded rectangles for the process steps instead of normal rectangles.
    However, much more importantly, UML provides a metamodel and an XML-based interchange
    mechanism so that diagrams are not only pretty pictures but can also be shared
    among other tools.


    # EPC


    Finally, I want to mention a notation for modeling processes that for a long time
    was one of the most popular among business professionals: **Event-Driven Process
    Chain** (**EPC**). EPCs are part of the **Architecture of Integrated Information
    Systems** (**ARIS**) method, developed by Professor Scheer in the 1990s for the
    purpose of documenting organizations and their processes. Of course, it was not
    the only notation serving this purpose (e.g., the **BPMS** method was proposed
    by Professor Karagiannis around this time), but EPCs were popularized by their
    usage in SAP **Enterprise Resource Planning** (**ERP**) software.


    As the name suggests, EPCs put a strong emphasis on events in a process; however,
    they also introduce several other elements that allow you to show who performs
    certain process steps (in case you are wondering: EPCs can also use swimlanes
    to show responsibility, which documents and IT systems are used, and so on). This
    allows conveying much more information in comparison to plain flowcharts.


    > **Note**

    > To learn more about EPC and see an example diagram prepared by Roland Woldt,
    visit the GitHub page with resources for this chapter: `https://github.com/PacktPublishing/
    Practical-Business-Process-Modeling-and-Analysis/tree/main/ Chapter07`.


    # BPMN – how we got there and why it is relevant to us


    In a previous section of this chapter (_Going beyond flowcharts – overview of
    other notations_), you had a chance to see how complex it was to communicate with
    others using process models even 20 years ago. Numerous ways of describing processes
    made communication within and between organizations difficult because everyone
    used their own way of modeling. This resulted in the classic Tower of Babel syndrome.
    Local efforts to solve this problem (e.g., the creation of a standard process
    modeling notation for the German public administration) did not lead to a universally
    recognized modeling method. The BPMN notation was conceived as a solution to this
    very problem.'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'The first version of the standard was published by the **Business Process Management
    Initiative**

    (BPMI) in 2004 as Business Process Modeling Notation. Since 2005, when BPMI merged
    with OMG,

    an organization known for developing and maintaining many technology standards,
    BPMN has been

    developed by OMG. As part of this work, version 1.1 of the standard was published
    in 2008, followed

    by version 1.2 in 2009.


    However, the most important moment in the development of BPMN was in 2011, when
    version 2.0 of

    the specification was published, which, with minor modifications (the latest version
    of the standard

    is 2.0.2, published in 2014 as the ISO/IEC 19510 standard), is still in force
    today.


    Version 2.0 of the BPMN standard brought a lot of significant changes; many new
    object types and

    icons were added and some of the elements introduced in the earlier version of
    the specification were

    changed. So, in this book, we will be dealing with the current version.


    The first important thing to know about version 2.0 is that the BPMN acronym now
    stands for **Business**

    **Process Model and Notation**. This name change naturally has a deeper rationale,
    which we''ll address

    in a moment, but for those uninterested in the technical details, it has brought
    one very important

    benefit: if, in the course of searching for answers to questions related to BPMN,
    you find an article

    in which the author uses a different acronym expansion than Business Process Model
    and Notation,

    it''s quite likely outdated content that doesn''t take into account the latest
    version of the specification.


    Another extremely important change introduced by version 2.0 of the standard was
    the definition

    of how data is exchanged between different tools supporting BPMN. This is very
    important as well.

    While earlier versions of the standard allowed generating – for some types of
    process diagrams – code

    to automate processes in **Business Process Execution Language (BPEL)**, there
    was no reliable way

    to go from BPEL code to a BPMN diagram that would work for every process diagram.
    For a while,

    another technology standard served as a workaround for this problem: **XML Process
    Definition**

    **Language (XPDL)**, developed by the – unfortunately no longer functional – **Workflow
    Management**

    **Coalition (WfMC)**. However, this was not an optimal situation, because not
    all elements possible to

    describe in WfMC could be exchanged between different tools using XPDL.


    Version 2.0 of the standard introduced a special data exchange format, using the
    XML file format and

    described in the Diagram Interchange section (_chapter 12.1_) of the standard,
    which is often referred

    to as BPMN DI or BPMN XML. This ensures that any business process diagram can
    be saved as an

    XML file for data exchange with other modeling or process automation tools.


    In addition, to take care of efficient data exchange, a special **BPMN Model Interchange
    Working**

    **Group (BPMN MIWG)** was established – for more than 10 years, it has provided
    a forum for tool

    developers to collaborate, conducted annual diagram exchange demonstrations, and
    maintained and

    developed a library of test models through which it is possible to verify the
    level of support of BPMN

    notation by a given tool. Test results are presented in the form of a table, the
    current state of which,

    at the time of writing this book, is shown in the following screenshot.'
  merge: -1
  img_proc: true
