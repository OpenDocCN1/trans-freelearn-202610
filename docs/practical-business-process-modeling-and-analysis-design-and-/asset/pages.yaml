- pgno: 74
  md: '# # Summary


    DTX within a company will mean different things to different audiences based on
    people’s roles in the organization and the overall size of this topic. That’s
    why it is essential to craft the vision of the transformation that’s shared and
    to obtain buy-in from executives who are going to stand behind your execution
    plans. DTX initiatives don’t always start in a top-down fashion, and if they do,
    they require a tremendous number of resources to push everyone in the same direction.
    Process transformations can also start in an ad hoc manner with different timing
    and different organizational maturity; thus, once your efforts are underway, it’s
    important to organize work around workstreams that will support major pillars
    of the DTX, sustaining your efforts month after month within this stable framework.
    DTX requires both tons of commitment and a long span of planning. Professionals
    who have participated in such efforts compare them to marathons versus short sprints,
    following the sports metaphor. Timing the momentum of the DTX program inception
    can be challenging; however, there are usually many signs leading to the culmination
    of efforts in different parts of the organization. If your stakeholders and teams
    are sending signals about fragmented and painful processes, or if your leadership
    is asking to raise the performance or customer satisfaction metrics, tighten the
    belt, or prepare for a strategic initiative – a DtC program is most likely in
    your future.


    It’s smart to start planning and thinking in advance about building up the following
    capabilities, as they take time to mature:


    +   • Strategy

    +   • Organizational self-enablement

    +   • Scalable COE operating model

    +   • Cloud-based low-code ecosystem

    +   • Business process architectures supported by process culture

    +   • Access to data models

    +   • Mature change management practices


    Launching business-critical DTX initiatives while at the same time working on
    your transformation pillars will resemble the Tough Mudder race more than participation
    in the Seattle Marathon. For those of you unfamiliar with the Tough Mudder races,
    these extreme races include a number of signature obstacles, including electroshock
    therapy, plunging into a dumpster filled with ice water, climbing monkey bars
    slicked with butter and mud over a pit of cold water, and running up a pipe slicked
    with grease. Think and plan ahead to get your pillars ready in advance; no company
    ever succeeded in its DTX efforts without ample preparation. We are going to introduce
    BPM, its ramifications, and our philosophy in the next chapter.'
