- pgno: 99
  md: 'However, it’s important to acknowledge the effort and preparation needed for
    this phase—you will have significant work ahead. Unless your organization has
    already reached a mature stage in BPM, support for the practice needs to come
    from the highest levels of leadership, with its value clearly recognized among
    the C-suite. Although discussions about process optimization, automation, and
    transformation are common among leaders, practical skills in BPM are less so,
    as they were historically not included in MBA programs. While some progress has
    been made globally, only a select few business schools prioritize the BPM curriculum.


    Your executive team may lack direct experience with BPM’s theoretical and transformative
    potential. Executives with consulting backgrounds and firsthand knowledge of BPM’s
    benefits will be your greatest allies. It’s also important to recognize that while
    BPM is exciting, it struggles to sustain itself long-term without integration
    into the business architecture and process automation domains. These programs
    might be merged during cost-cutting periods. Your strategy should involve embedding
    the BPM practice within the organization, developing it into a robust process
    culture, and then leveraging it as citizen developer programs gain traction. In
    corporate settings, sustaining funding for specialist teams is challenging unless
    these teams directly contribute to the bottom line. Seek individuals who are not
    only passionate about processes but also excel in relationship-building, sales,
    and technology, as these attributes will enhance the likelihood of success. Despite
    its evolving scientific nature, the pragmatic goal of BPM is to support DTX programs,
    unless operating within an academic setting focused on the theory of work and
    process.


    # Establishing the governance and roles for the transformation


    The roles and governance models can vary from company to company; however, the
    following lineup will be required regardless of the size of your organization.
    Some roles can be played unofficially, some can be shared, and some can take time
    to evolve, all based on your company’s level of maturity. With so many processes
    driving your company, it’s common to find processes without owners, even at vast
    and mature companies:


    +   • **The BPM sponsor**: This senior executive plays a crucial role in supporting
    and advocating for the BPM vision and strategy. They provide direction and guidance,
    while also securing the necessary funding and resources. Your executive sponsor
    is the most important advocate for your program; it’s not just about obtaining
    financial support. Sponsors help raise visibility and protect your initiatives
    from outside influences that could undermine your work. Finding the right executive
    sponsor may take some time, so don’t be too concerned if you don’t have one immediately.
    It’s more beneficial to find a leader who aligns with your vision rather than
    to be continually sidelined by someone whose priorities differ from yours. You
    might also discover some initial funding in the budgets at the director level.
    However, it’s the support from a VP that will truly help you access the right
    opportunities.


    +   • **The BPM leader**: This is the person who leads the BPM transformation
    program, coordinates the activities and projects, and reports on the progress
    and outcomes. They are the coach, the salesperson, the one who knows it all, and
    the face of the program.'
  merge: -1
  img_proc: true
- pgno: 100
  md: '+   • **The BPM team**: This is a group of specialists aiding the BPM leader
    in implementing the transformation plan by providing expertise in process analysis,
    design, improvement, automation, monitoring, and governance. Given the complexity
    of the field, individuals often specialize in different areas, making it uncommon
    for one person to possess comprehensive experience across all BPM facets. If you
    have a team of two members, consider yourself fortunate; if your team is very
    lucky, count yourself very lucky and make the most of this opportunity. When building
    your team, avoid the pitfall of isolating them in an “ivory tower” or adopting
    a consulting approach within your organization too soon. You are not acting as
    a consultant unless you have earned the trust to be seen as an advisor by your
    internal stakeholders, a feat that takes time within a company. External consultants
    can quickly establish credibility but may also lose their positions once the project
    concludes. While developing your reputation internally takes longer, it better
    equips you to navigate internal politics and align with the core operations of
    your company as an insider.


    +   • **The BPM community**: Community-building activities will help you gain
    visibility, look for supporters, and identify new projects. If you organize your
    team correctly, you can solicit innovative ideas and tap into specialized knowledge.
    Come up with ideas to evangelize your mission and make it resonate with the needs
    of your community. Think about your community as the extension of your **center
    of excellence (CoE)** team, and don’t call your team a CoE from the start. A CoE
    needs secure executive support, a suitable service-oriented model (a team that
    supports other teams), and credibility from different company areas. Calling your
    team a CoE too early can attract the wrong type of attention from other parts
    of the company trying to accomplish the same. Trust me when I say it: in an average-sized
    company, there are many change champions, all full of innovative ideas, knowledge,
    and experience, who are getting ready to take on the challenge of digital change.
    You need to find these folks, establish relationships, offer them help, and expand
    your view of a team. These folks are the reason your practice exists. Don’t put
    yourself on the pedestal of the CoE; the right way to get there is to get elevated
    by your community to this role. You will know you are the one person destined
    to spearhead and introduce BPM to your business unit when your community says
    so. That usually takes many conversations, projects, help offered, evenings spent
    troubleshooting processes and apps, and building credibility. In this profession,
    like in any other, credibility is essential.


    +   • **The process owners**: These are the business managers who own and are
    responsible for the performance and results of the processes within their domain
    and work with the BPM team to identify and implement improvement opportunities
    or launch new transformation projects. This role may not be clearly defined in
    companies that are still new to process thinking. Search for business owners of
    critical applications and systems; these folks will step into such roles as your
    transformation accelerates.'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'For example, the director of a call center at a national healthcare insurance
    company can be accountable for new member onboarding, benefits and claims processing,
    and prior authorization processes.


    +   • **Process participants**: These are the employees who execute tasks and
    activities within processes while providing feedback and suggestions for enhancements.
    If your participants have the interest and technical ability, you might consider
    expanding your program with the citizen developer pillar. Your participants are
    at the core of the action; by staying connected with them, you can gain valuable
    insights into your processes, discover improvement opportunities, and receive
    appreciation for your work. There’s great satisfaction in being acknowledged for
    proficiently managing processes involving multiple people, machines, and occasionally
    external companies.


    +   • **Citizen developers**: BPM programs should support citizen developer initiatives,
    eventually merging into a unified digital process CoE. The method you choose,
    the duration required, and the funding source will vary based on your company’s
    strategy. Often, the business endorses BPM initiatives while citizen developer
    platforms receive funding from IT budgets. It is essential not to let this create
    discord between your teams; within the broader practice, citizen developers belong
    in the *work and process automation* segment of your transformation framework.
    A critical issue to avoid is competition between the business and IT sectors of
    the CoE, as it can hinder the progress of transformation. The CoE’s operations
    should be directed by a strong and competent leader capable of managing any political
    influences at this level. Failure to do so may lead to a ripple effect that destabilizes
    your promising practice. At this organizational level, you will encounter individuals
    with significant egos seeking recognition and fame. Managing such personalities
    requires considerable skill and, at times, might be impossible. While searching
    for highly recognized and experienced experts to collaborate with and support
    your company, prioritize those who are modest and can manage their egos. When
    some individuals are promoted to work on the CoE team, they transform into Lord
    Farquaad from the movie Shrek. You should identify digital change champions—individuals
    with a healthy ego grounded in their successful career trajectory. The distinction
    between a champion and a BPM Lord Farquaad lies in their ability to both articulate
    their vision and deliver consistent results.'
  merge: -1
  img_proc: true
