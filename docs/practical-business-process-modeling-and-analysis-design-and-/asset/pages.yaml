- pgno: 251
  md: 'When discussing send and receive tasks, it’s also worth mentioning another
    common mistake associated

    with these tasks, as shown in Figure 8.29. Many people who start working with
    BPMN associate the

    envelope symbol with the mail client icon and use send and receive tasks to show
    the exchange of

    emails between different teams (represented by lanes) within the same organization.


    ![](img/a4c90ee3d142c33743706d37c65779c2_251_0.png)


    Figure 8.29 – Anti-pattern—sending and receiving messages within one pool'
  merge: -1
  img_proc: true
- pgno: 252
  md: '# The scope of a process – start and end events


    This approach is tempting, but unfortunately wrong. Since, by definition, a message
    is transferred only between pools and we aren’t allowed to send messages within
    a single pool, we can’t use send and receive tasks in this way either.


    So, what can we do in a situation where we want to show that we’re sending an
    email between one team and another? We can use a pair of manual or user (or no
    type) tasks – that is, **Send refund order** and **Receive refund order**.


    This kind of modeling could make sense when, for our description or analysis,
    it’s important to show clearly how we communicate with others using more classical
    methods. An example could be a process where paper documents are still used –
    someone must physically carry an envelope with documents and leave it at the secretary’s
    office, and someone else must go and pick it up from there. By documenting those
    two tasks, we could show how much time this kind of work takes.


    However, if it’s a digital process, it may be enough for us to indicate that someone
    from team A sends something to someone from team B. This is because since the
    next task in the process will be in team B’s lane, the very logic of the process
    shows us that the work has been transferred.


    The task types that have been described so far are those most used in practice,
    but this isn’t a complete list. In Chapter 9, we’ll learn about some additional,
    slightly more advanced task types and discuss their use.


    What we’ve learned here about send and receive tasks will come in very handy in
    a moment when we discuss the most important types of events in BPMN. Later in
    this book, we’ll learn about special types of events that can replace send and
    receive tasks.


    We already know how tasks allow us to present the work that needs to be done in
    a process. But how do we show what causes our process to start, and what results
    it can end with? As we already know, events are used for this purpose.


    Events are an extremely useful element of the BPMN specification. They allow us
    to show what starts our process (start events) and what results our process may
    end up with (end events). In addition – and this distinguishes BPMN from other
    notations – we can use them to describe what important things may happen during
    the process (intermediate events) and how we’ll react to these events in handling
    errors, exceptions, and special situations.'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'There are many different types of events in BPMN, some of which are useful
    for more advanced modeling scenarios (for example, process specification/automation),
    and some of which are used occasionally in practice. Therefore, in this chapter,
    we’ll only focus on a few of the most common types of events, without which it’s
    impossible to model in BPMN. This will help us understand the basics of how events
    work.


    # Simple start event


    Start events are always shown as circles with a single thin line. The following
    is a start event with no trigger defined.


    ![](img/a4c90ee3d142c33743706d37c65779c2_253_0.png)


    Figure 8.30 – Start event (no trigger)


    Let’s start with a simple start event. The start event is always represented as
    a circle with a single thin border. It represents what must happen for the process
    to start (technically speaking – what needs to happen so that a process instance
    or execution of a specific “case” can begin). In this case, the start event doesn’t
    have a specific trigger defined (which is easily visible because there’s no icon
    inside).


    All start events are catching, which means that they passively listen to what’s
    going on, and only when something happens that triggers them will they create
    a token that flows further and makes the process begin. Before the start event,
    there’s nothing (at least from the perspective of the diagram of the process),
    so there can be no sequence flow arrows incoming to the start event.


    # Naming start events


    The BPMN specification doesn’t impose a specific way of naming start events. I
    like to name events so that their name clearly describes a certain state of reality
    that must exist for the process to start.


    Various other approaches are also encountered in practice (shown in Figure 8.31),
    some of which may, for example, be inspired by flowcharts (START). While none
    of the examples shown are wrong from a BPMN point of view, they differ in their
    informational value. I like to use the passive side, which avoids confusion with
    the work that’s done in the process. So, I could give the start event without
    a type a name such as Summary of reasons of complaints needed (for a process related
    to our complaint handling process) or New employee needed (for a process in which
    new employees are recruited).'
  merge: -1
  img_proc: true
- pgno: 254
  md: '![](img/a4c90ee3d142c33743706d37c65779c2_254_0.png)


    # Figure 8.31 – Possible approaches to naming start events


    A start event without a type is used often. It’s particularly useful in processes
    when the decision of the employee involved in the process causes the process to
    begin, that is, it doesn’t depend on external requests or isn’t executed at specific
    times. Another possibility is a situation where some other process triggers our
    process through the mechanism of sub-processes. We’ll discuss this case in more
    detail in the next section.'
  merge: -1
  img_proc: true
- pgno: 255
  md: '# # Simple end event


    End events are also shown as circles. However, they have a border drawn with a
    single thick line. The following is an end event without any trigger.


    ![](img/a4c90ee3d142c33743706d37c65779c2_255_0.png)


    End event


    Figure 8.32 – End event (no trigger)


    Now that we know how to use start events to show what starts our process, it’s
    a good time to look at the other end of the spectrum and think about how our process
    might end. End events are the second element of the process scope. They illustrate
    what result our process might end with. Start events are, by definition, passive
    elements. End events are their opposite – they’re always active, which in the
    BPMN specification is referred to as throwing.


    As we know, there can’t be anything before the start event in a process flow,
    so a sequence flow arrow can’t enter it; only outgoing flows are allowed. On the
    other hand, in the case of an end event, we can’t place any flow objects after
    them, such as events, gateways, or activities. Therefore, a sequence flow arrow
    can enter the end event, but there can be no outgoing sequence flow from it.


    Each end event will have a border drawn with a distinctive single thick line,
    which allows us to easily distinguish it from the start event (which always has
    a single thin line).


    # # Naming end events


    As in the case of start events, the BPMN specification doesn’t impose special
    ways of naming end events, so we have quite a bit of freedom. My preference is
    to name end events so that it’s clear what result the process ends up with – that
    is, what we achieved. Ideally, this name should emphasize what _happened_ in this
    process path and not something we _do_. This way, we can see _how_ the process
    ended, not just that it’s finished, as shown here.'
  merge: -1
  img_proc: true
- pgno: 256
  md: '![](img/a4c90ee3d142c33743706d37c65779c2_256_0.png)


    Figure 8.33 – Possible approaches to naming end events


    # One or more end events?


    It’s also worth noting that BPMN allows us to put multiple end events in a diagram,
    and this is a very useful option. As we saw in Figure 8.4, a glance was enough
    to determine what result our process could have, without us having to read the
    entirety of the diagram.'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'This is especially helpful when there are exclusive gateways in the diagram.
    Our process may finish in various other ways besides the “happy end,” and we want
    to show them clearly for process analysis and improvement.


    So, while it’s possible to connect multiple sequence flow arrows to a single end
    event to show that multiple paths of the process share a common end (for example,
    in our process, the **Money refunded** end event is sufficient for analytical
    purposes; we don’t need to emphasize how we make the refund), I’m not in favor
    of using only one end event where all paths – the happy one and the others – meet.


    The standard end event behaves as follows: when a token reaches it, this token
    is _consumed_ and disappears. If there are no more active tokens within that process
    instance, the process instance ends, and we can consider that the process has
    come to an end.


    If, on the other hand, there are more tokens in the process, then the entire instance
    “lives,” so long as at least one token is active. Let’s look at the process example
    shown in _Figure 8.34_. If we assume that each of the tasks (A through E) lasts
    for 1 day, how long will the entire process instance live, assuming there are
    no delays?


    ![](img/a4c90ee3d142c33743706d37c65779c2_257_0.png)


    Figure 8.34 – Example of a process with many paths (process instance life cycle)


    As you can easily calculate, even though the **bottom** token (that is, the one
    going to task E) will reach the **Bottom path finished** end event after just
    2 days, we still have the **top** token within our instance. So, for the entire
    process to complete the longest of the paths (ABCD), we need 4 days. Only when
    task D is completed and the token reaches the **Top path finished** end event
    can we say that the process instance was completed.


    Before we discuss start and end events with triggers, there’s one more interesting
    thing to say about start and end events without types. From a formal point of
    view, the BPMN specification doesn’t force us to insert start and end events without
    types. We can omit them from our diagrams because they’re assumed to be there
    as **invisible and default** elements.'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'The only limitation is that we must be consistent in this approach – that is,
    we can’t skip the start event without a type and must show the end events without
    a type. However, I don’t recommend such an approach because with properly named
    events, it only takes one glance to determine when the process starts and what
    it might end with. Figure 8.35 compares these two approaches:


    ![](img/a4c90ee3d142c33743706d37c65779c2_258_0.png)


    Now that we’ve learned the general rules for dealing with start and end events,
    we can move on to something a little more complex. As we know from the previous
    section, which was dedicated to tasks, we can define different types of tasks.
    These are marked with special icons.


    # Message events


    As we learned from our complaint handling process, events can also contain additional
    icons that represent possible triggers. Let’s begin by comparing events for which
    a message is a trigger since we already know a bit about messages. This will allow
    us to understand how different types of events behave.


    ![](img/a4c90ee3d142c33743706d37c65779c2_258_1.png)


    In addition to the rather obvious difference due to the type of events (a start
    event has a thin border, while an end event has a thick border), we can also see
    that the envelope icons differ in fill color. Using this example, we can observe
    a very important principle of BPMN: catching (passive) event icons are always
    light, while throwing (active) event icons are always dark.'
  merge: -1
  img_proc: true
- pgno: 259
  md: '# The scope of a process – start and end events 259


    Message start events indicate that a process is triggered by receiving some information
    from the outside – from some external entity, another organization, or perhaps
    a customer or partner. This information can be transmitted in a variety of ways
    – by letter, email, SMS, telephone, and so on.


    For each message, we must always have a specific sender and a specific recipient,
    and that message exchange is always done between different participants (pools).
    Messages can’t be sent or received within the same pool. As we’ve seen, the message
    icon is always an envelope, so the start event that’s triggered by the message
    must have a light envelope icon.


    If we want to show the readers of the diagram where the message comes from, we
    can draw an incoming message flow arrow, but this isn’t mandatory. A message flow
    is always drawn with a dashed line, with an open arrowhead at the end and an open
    circle at the beginning. Figure 8.37 shows the use of a message flow named Complaint,
    which flows from the Customer pool to the Complaint received start event.


    ![](img/a4c90ee3d142c33743706d37c65779c2_259_0.png)


    Figure 8.37 – Example of a message flow between a black-box (collapsed) pool and
    a start event'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'While this is often helpful, there’s no obligation to show other participants
    or message flows, so we might as well start our process more easily, as shown
    in Figure 8.38.


    ![](img/a4c90ee3d142c33743706d37c65779c2_260_0.png)


    Figure 8.38 – A simplified process without an external participant and message
    flow


    As for naming message start events, as in the case of plain start events, I would
    suggest using the passive side while referring to the message that starts the
    process. Possible examples include **Order received**, **Inquiry received**, **Invoice
    received**, and, as in our example of the complaint handling process, **Complaint
    received**.


    I don’t recommend using the active side so that you don’t confuse the audience
    by implying that some work is being done within the event (for example, **Receive
    order**).


    Now that we know how the message start event and regular end event behave, let’s
    consider how the message end event works.


    As you can easily guess, this type of end event is marked with a dark envelope
    icon. Like any end event, it consumes incoming tokens, but since it has a trigger
    defined, it also does something extra.


    Since nothing else happens in the process after the end event, this _something
    extra_ can be considered a _swan song_ – the last breath of our process, so to
    speak. For a message end event, this something extra is the action of sending
    a message.


    An example of this behavior might be sending an email to a customer regarding
    a record of a chat with a consultant or sending a request to evaluate an interaction
    – for example, a **Net Promoter Score (NPS)** satisfaction survey after the shipment
    was delivered.'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'At this point, it’s worth noting that sending messages by end events makes
    sense in the case of highly automated processes, where such sending doesn’t require
    human intervention. That’s why we usually send messages with tasks, and the end
    event is only used to summarize what’s already happened. This can be seen in Figure
    8.39.


    ![](img/a4c90ee3d142c33743706d37c65779c2_261_0.png)


    Figure 8.39 – Part of the example process – sending messages with tasks and proper
    naming of events


    However, if we wanted to (and our process was properly automated), we could send
    a message from the end event, as shown in Figure 8.40:'
