- pgno: 136
  md: 'These trends are not isolated phenomena, but rather interconnected and interdependent
    forces that create synergies and feedback loops. They also have different impacts
    and implications depending on the industry and application.


    However, there are some common characteristics and consequences of these technological
    trends that are often overlooked or underestimated by most people. Here are some
    of them:


    +   • The technological trends are exponential, not linear. This means they are
    growing at an accelerating rate, doubling their performance and impact every few
    years. For example, Moore’s law states that the number of transistors on a microchip
    doubles every two years while the cost halves. This leads to an exponential increase
    in computing power and a decrease in cost. Similarly, other trends such as AI,
    big data, and IoT follow exponential curves of improvement and adoption. This
    implies that the future will be radically different from the present and that
    the changes will happen faster than we expect.


    ![](img/a4c90ee3d142c33743706d37c65779c2_136_0.png)


    Figure 4.3 – The influence of Moore’s law on DTX'
  merge: -1
  img_proc: true
- pgno: 137
  md: '# Navigating major trends and their impact on skill requirements


    +   - Technological trends are convergent, not divergent. This means that they
    are merging and integrating with each other, creating new combinations and possibilities.
    For example, AI and cloud computing enable the analysis and processing of massive
    amounts of data, which can be used to optimize and automate business processes.
    Blockchain and IoT enable the creation of decentralized and distributed networks
    of smart devices, enabling new forms of collaboration and coordination. AR and
    VR enable the creation of immersive and interactive digital environments, which
    can enhance customer and employee experiences. These convergence scenarios create
    new value propositions and business models that transcend the boundaries of traditional
    industries and sectors.


    +   - The technological trends are also disruptive, not incremental. This means
    they are creating fundamental shifts and transformations in how things are done
    rather than minor improvements or modifications. For example, AI and robotics
    enhance human capabilities and augment human tasks and roles, creating new challenges
    and opportunities for workers and organizations. Cloud computing and blockchain
    provide more efficient and secure ways of storing and transferring information
    and enable new forms of governance and trust, challenging existing institutions
    and regulations.


    Many vendors aiming to lead in DTX often rapidly add new capabilities to digital
    business platforms. This results in high-density features that are difficult to
    master and sometimes even hard to discover, let alone comprehend. Such technologies
    challenge users, making staying on top of new and emerging features difficult.
    From the market perspective, vendors continuously innovate, playing catch up with
    others’ feature sets. This never-ending race of technological progress takes massive
    engineering resources, market maturity, innovativeness, and execution strength,
    all needed to provide DTX support to other companies.


    It is also very common to see new trends completely cannibalizing older approaches
    to digitization, putting a large customer base at a disadvantage, and making both
    customers and platform vendors rethink their digitization strategies. BPMS cannibalized
    workflow orchestration engines, iBPMS swallowed BPMS, low code gobbled up iBPMS,
    and now AI is transforming low coding and professional coding forever.


    Being aware of such dynamics prompts us to ask a few questions:


    +   - When and how will this never-ending continuum of progress end?


    +   - Who is to decide which approach or technology is no longer applicable or
    better at solving a business problem?


    +   - How do you position yourself and your future career amid constantly changing
    trends?


    As a participant in DTX, you may find that you have limited influence over the
    selection of the platform or technology used to drive digital change programs.
    However, when considering your career, there are decisions you can make regarding
    where to invest your time in upskilling. This will help you remain relevant in
    the job market and valuable to your employer. We would like to propose a set of
    foundational skills that are essential for a digital change practitioner:'
  merge: -1
  img_proc: true
- pgno: 138
  md: '![](img/a4c90ee3d142c33743706d37c65779c2_138_0.png)


    Figure 4.4 – A variety of skills and expertise is essential for successful digital
    change projects


    Until a few years ago, the primary strategy for digitization involved collaborating
    with consulting firms experienced in DTX across various platform vendors. While
    this method proved successful for some, it also led to delays in initiatives that
    couldn’t launch due to insufficient internal expertise or inadequate return on
    investment. Additionally, large workflow automation platforms often present broad
    solutions across many industries but frequently fail to meet expectations, attempting
    to impose a one-size-fits-all approach to transformation.'
