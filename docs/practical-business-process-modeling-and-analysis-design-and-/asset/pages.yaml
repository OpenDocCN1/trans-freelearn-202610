    \ continue using the process of complaint handling of a B2C company that you saw\
    \ in the previous two chapters.\n\nThe process is initiated by a communication\
    \ from a customer who reports a complaint (via email, phone, or chat on the website).\
    \ The complaint is checked by a complaint specialist for validity (within a system\
    \ that automates this entire process). If the complaint is invalid, the customer\
    \ receives a message about its rejection, with a justification (the justification\
    \ should have been prepared by the specialist in the previous step). If the complaint\
    \ is valid, the customer receives information about approval of the complaint,\
    \ and then the specialist determines which solution will be satisfactory to the\
    \ customer: refund (part of) the payment or replace the product with a new one.\
    \ If the customer opts for a refund, the corresponding order goes to the financial\
    \ team to make the refund. If the customer prefers a replacement, the order goes\
    \ to the logistics team to ship the appropriate product. The process can thus\
    \ end in three ways:\n\n+   1. The customer may receive a message about the rejection\
    \ of the complaint (along with a justification).\n+   2. The customer may receive\
