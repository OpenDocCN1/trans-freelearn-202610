- pgno: 77
  md: '# # The Wheel of BPM Driving Your Competitive Advantage


    Enterprise-scale **digital transformation (DTX)** requires strategic planning
    and **business process management (BPM)** practices, an essential component of
    digital change initiatives. By embracing BPM, companies can adapt to the rapidly
    changing landscape and drive innovation through new levels of automation-driven
    agility with the help of AI. As a scientific practice, BPM helps prepare and sustain
    wave after wave of digital change programs. It focuses on people, their expertise,
    and the many non-technical skills crucial in successfully implementing DTX initiatives.
    This contrasts with the common misconception that DTX is solely about technology.
    It’s about people, processes, and technology working together to drive business
    value.


    In this chapter, we will guide you through initiating and executing a BPM transformation
    in your organization.


    You will learn how to do the following:


    +   - Recognize the signs that indicate the need for a BPM transformation and
    the factors that influence its timing and scope

    +   - Define the objectives and expected outcomes of the transformation

    +   - Identify the current state of your processes, including the gaps and opportunities
    for improvement, using various techniques and tools

    +   - Develop a compelling business case and a realistic roadmap for the transformation
    that outlines the benefits, costs, and risks

    +   - Align the vision and strategy of the transformation with the key stakeholders
    and sponsors to gain their support and commitment'
  merge: -1
  img_proc: true
- pgno: 78
  md: '+   - Establish the governance and roles for the transformation and define
    the accountabilities of

    +   the different parties involved

    +   - Pitch the transformation to the decision-makers and influencers, and overcome
    the potential

    +   objections and barriers


    By the end of this chapter, you will have the skills and knowledge to plan and
    initiate a successful

    BPM transformation that will drive your competitive advantage and prepare you
    for the digital age.

    You will also learn from the best practices and most common mistakes of other
    organizations that

    have embarked on similar journeys. This chapter will help you build a solid foundation
    for your BPM

    transformation and set the stage for subsequent chapters covering the details
    of the BPM life cycle

    and methodology.


    > Note

    > This chapter is authored by BJ Biernatowski.


    # How do transformations start?


    BPM is a discipline that aims to improve the performance, efficiency, and agility
    of business processes.

    By automating business-critical processes, BPM can help organizations achieve
    strategic goals, optimize

    resources, and deliver value to customers. However, BPM is not a one-time project
    or a quick fix. It

    is a continuous journey that requires a holistic and systematic approach to managing
    and improving

    organizational processes. This journey is a BPM transformation, ultimately leading
    to DTX on a

    grand scale.


    Can you attempt to drive such programs without focusing on BPM? You can try. However,
    your

    results will remind us of an attempt to build a metro system akin to London’s
    Subway by building lines

    between 3–4 stations only instead of covering all 270 of them, omitting the maintenance
    facilities, and

    not planning for enough electric lines to power your trains. To paraphrase, engaging
    in DTX without

    consideration and focus on BPM will create partial results without the ability
    to expand your project

    into the automation program, effectively transforming work performed along major
    process routes

    supporting your company’s value chains. Such a lack of foresight may also inhibit
    your business’s

    ability to scale your company’s efforts to reach the full potential of the transformation.


    It would be best to approach DTX as a change initiative involving adopting BPM
    principles, methods,

    and tools to discover, redesign, automate, monitor, educate, and improve business
    processes. To

    paraphrase, a successful BPM transformation will also serve as a precursor to
    DTX, executed as a wave

    of multiple digital change projects driven by citizen developers and project teams.
    The foundation

    laid by the BPM transformation creates a shared vision and a common language for
    various parts of

    the organization.'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# # A BPM transformation can bring multiple benefits to your organization:


    +   - Reduction of costs and waste by offering a continuously self-optimizing
    vision of your enterprise

    +   - Increased productivity and quality by planning for growth and change, eliminating
    bottlenecks, and streamlining work handovers

    +   - Enhancing customer satisfaction and loyalty by designing processes from
    the customer’s point of view using the outside-in perspective

    +   - Aligning processes with strategy and vision to ensure that resources deployed
    offer maximum return on investment

    +   - Creating a culture of continuous improvement

    +   - Preparing the organization for the launch of digital change programs focused
    on the automation of work with the assistance of digital business platforms and
    AI


    ![](img/a4c90ee3d142c33743706d37c65779c2_79_0.png)


    Figure 3.1 – Launching Digital Change projects is a team activity


    Initiating a BPM transformation is neither straightforward nor easy. Such initiatives
    generally demand a clear vision, decisive leadership, a supportive culture, strong
    governance, and a long-term perspective. The launch process includes tackling
    numerous challenges, such as engaging stakeholders who might be uninterested in
    process methodologies, designing process architecture for significant portions
    of the business, standardizing and enhancing existing processes, and gaining and
    maintaining executive support to ensure that your efforts receive acknowledgment
    from company leaders.


    Additional challenges may involve managing change at a scale. How you manage change
    will ultimately decide the fate of your transformation projects, tipping the scale
    of success in your favor. In addition, you will need to learn how to demonstrate
    business value, invest time and resources into learning and development, and carefully
    navigate organizational politics.'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'How can you initiate and plan a BPM transformation to deliver optimal outcomes
    for your company?

    In the next sections, I will explore the key steps and best practices to start
    a BPM transformation,

    such as the following:


    +   - Timing the inflection points for the transformation

    +   - Defining the scope and objectives

    +   - Developing the business case and roadmap for the transformation

    +   - Communicating and aligning the vision and strategy

    +   - Establishing the governance and roles for the transformation


    # Timing the inflection point


    One of Massachusetts’ most lucrative yet controversial industries was whale hunting.
    From the 17th

    to 19th centuries, thousands of sailors braved the Atlantic and Pacific in search
    of oil, baleen, and

    ambergris. It was a perilous pursuit requiring courage, endurance, and skill.
    Whalers faced storms,

    shipwrecks, disease, and the sheer power of the whales themselves. Many never
    returned. Those who did

    often carried scars, both physical and emotional, and stories of survival that
    few others could imagine.


    Launching BPM transformations can feel daunting, complex, resource-intensive,
    and full of unknowns.

    Like the historic New England whalers, transformation leaders navigate through
    risk in pursuit of

    immense value.


    Such projects can be exhilarating; they require lots of endurance and continue
    to tempt many by

    promising bounties of unlimited potential in the form of almost unlimited return
    on investment

    (ROI). Who in their right mind would not be drawn to the modern hunt for the digital
    whale-sized

    BPM transformation?


    Having experienced firsthand the tremendous appetite of companies in pursuit of
    process digitization

    strategies, I’ve been fascinated by the idea of the inflection point in which
    the company decides to launch

    and pursue process-driven DTX, also referred to as an automation program with
    an enterprise-wide

    scope. The strategic inflection point is a business trigger that can be described
    as witnessing company

    executives look for the bounty of never-ending efficiencies, three-digit ROIs,
    and new business models

    promised by the fifth stage of process maturity resulting from advanced digitization.
    External factors,

    such as technological innovations, regulatory shifts, competitive moves, or internal
    pressures, such as

    changes in strategy, vision, or culture, can all cause it. A strategic inflection
    point can be an opportunity

    or a threat, depending on how well a company responds to it. A company that anticipates
    and embraces

    change can gain a competitive advantage and emerge more robust. In contrast, a
    company that resists

    or ignores the change can lose market share and relevance.'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'Launching your enterprise program at the wrong time, without much preparation,
    or with the wrong digitization platform can cost you and your sponsors a promotion
    or even a career.


    Andy Grove, the cofounder of Intel, described inflection points as events that
    “change the way we think and act.”


    ![](img/a4c90ee3d142c33743706d37c65779c2_81_0.png)


    The strategic inflection point theory was introduced by Andy Grove, Intel CEO
    in his book ‘Only the Paranoid Survive’


    Figure 3.2 – The inflection point of a BPM transformation indicates the right
    time to expand the program


    What business conditions led to this inflection point, and how can you predict
    the right mix of conditions to help you launch your program at the most opportunistic
    time?


    The answer to this question is relatively simple. However, it took me a few job
    changes to experience the correct set of conditions that led to the proverbial
    *perfect storm of digitization*. Companies that get their DTX launched properly
    focus on preparation and equipping employees with the proper set of skills. They
    also have a forward-looking view of the mission backed by the support of a bold
    executive, who helps drive executive alignment. These companies create their favorable
    timing by paying attention to business conditions that impact their environment.
    As prominent global consulting companies would want you to believe, until you
    prepare for the DTX hunt, you may never know whether the creature down below is
    the size of Moby Dick or a school of sardines when estimating the size of the
    transformation scope. Thus, just like 200 years ago, large consulting firms, much
    like transformation whalers of old, often deploy teams in pursuit of *high-value
    engagements* —the modern oil.'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'However, without careful planning, such efforts can lead to inflated costs
    and missed opportunities, diminishing the business impact of your program. When
    local workforce engagement is minimal and delivery costs are high, the business
    case for transformation can weaken, resulting in less impact than initially projected.


    ![](img/a4c90ee3d142c33743706d37c65779c2_82_0.png)


    Figure 3.3 – Timing the inflection point of the business transformation can be
    risky


    Just as whale hunting once defined Massachusetts’ industrial legacy, the East
    Coast also gave rise to early advancements in process analysis, thanks to pioneers
    such as Frederick Winslow Taylor, whose scientific management principles laid
    the foundation for modern operational thinking.


    Today, there are many more ways to pursue digitization, but not all paths lead
    to sustainable transformation. Through this book, we encourage you to consider
    a different route, one that avoids the fate of the “modern whale hunter.” Just
    as no bounty is worth risking the natural world, no DTX should jeopardize your
    workforce or outsource your operational knowledge in the name of efficiency.


    Too often, transformation programs rely on highly specialized, opaque skill sets
    that are only accessible through formal partnerships with global consulting firms.
    These skills, packaged and sold as part of implementation services, may deliver
    results, but at what cost? When your internal teams are excluded from training,
    governance, or design, key knowledge may walk out the door with external partners
    if not intentionally transferred or retained.


    This isn’t to say consulting is unethical or unnecessary. Far from it—many partnerships
    add real value. But overreliance on proprietary expertise can unintentionally
    displace local teams, increase implementation costs, and reduce the long-term
    ROI.'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'The issue isn’t that your people can’t learn these skills. The issue is that
    without access to the same

    materials and learning pathways offered to strategic partners, your teams are
    left at a disadvantage.

    And if you’re launching a DPA platform without that internal capability, how can
    you be sure your

    team’s roles—and even their jobs—won’t be sidelined?


    It’s one thing to benefit from a consultant’s experience. It’s another to build
    a program entirely around

    knowledge you can’t access or sustain.


    To counter these risks and build a lasting digital foundation, organizations must
    take a more deliberate

    approach. To lead a successful transformation, you need safeguards: open access
    to knowledge, hands-on

    learning, and a deliberate effort to keep your people at the center of the journey.


    We also hope that by being aware of the forces pulling your employer into such
    never-ending

    modernization programs and applying the tips and strategies in this book, you
    can anticipate and

    perhaps even time the inflection points of your company’s BPM program expansion.
    I also hope to

    convince you to prepare yourself for the scale of support needed before your program
    reaches the

    critical mass of enterprise-wide DTX by putting the BPM practice at its center.
    Based on experience

    gained from other businesses, it will be just a matter of time before your company
    expands its process

    digitization to an enterprise-wide scale. If you do it at the wrong time, with
    the wrong platform, or

    without the right level of preparation and support, the program will start declining.


    The race for DTX is a matter of survival and competitive business advantage for
    most companies

    worldwide. Bear in mind that some transformations can be driven by market forces
    that occur quickly

    and without much warning, dragging companies into multi-month efforts to digitize
    operations rapidly.

    Some transformations can be planned years in advance by a visionary executive,
    supported by the

    enterprise architecture or business transformation office. Some transformations
    happen by accident,

    and many result from an effort by very astute sales teams, regularly feeding and
    recycling visions of

    business benefits between companies and customers unaware of the events they are
    about to trigger.

    The most conventional but still somewhat uncommon way of creating the momentum
    behind DTX

    is to make a strategic investment in the practice of BPM, creating the process-centric
    culture that

    permeates most areas of your company through process champions. Although a bit
    effort-consuming,

    this approach involves teaching groups of employees about the value BPM can bring
    to their day-to-

    day work while connecting the vision and the practice with the pain points of
    your business areas.


    BPM is a vast practice, and depending on the starting point, you and your team
    may have quite a bit

    of learning to do. Your colleagues will ask many critical questions about how
    BPM can help them in

    their day-to-day jobs and what’s in it for them and their careers.


    In a fast-paced world that is used to instant results, the infusion of this scientific
    practice can sometimes

    be perceived as overly theoretical and disconnected from the more exciting act
    of building apps,

    executing projects, and managing software and cloud systems. It is also not as
    exciting as executing

    “automation” projects, hiring consulting companies, evaluating vendors, and investing
    in digital

    process platforms.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# # The Wheel of BPM Driving Your Competitive Advantage


    All the preceding activities involve _doing_ rather than _learning_ and making
    strategic plans to prepare for the long-term execution of future digital change
    initiatives. People usually get more satisfaction at work _doing_ than _planning
    and strategizing_, yet it’s the latter that helps accomplish strategic long-term
    objectives.


    Some negative perceptions of BPM may last until leaders experience firsthand the
    benefits of this science, such as challenging projects hitting targets for the
    first time, unsolvable problems getting fixed, and the slowly growing hype that
    follows successful implementations hitting or exceeding their objectives.


    To your surprise, you may also be challenged by Gen Z professionals who are known
    for their efficiency and preference for quick results, finding traditional, lengthy
    learning processes less appealing. The influence of social media has shaped a
    generation that values streamlined and efficient workflows. For instance, the
    simplicity of the online pizza ordering process (click, order, pay, and deliver)
    exemplifies their expectation for quick and effective solutions. Therefore, it’s
    important to adapt training methods to be more engaging and time-efficient to
    meet their expectations. The generation that grew up on the internet-powered pizza
    ordering process does not want to learn about the internals of the “order to deliver
    pizza” business process if that means hours of discovery and training.


    ![](img/a4c90ee3d142c33743706d37c65779c2_84_0.png)


    Figure 3.4 – Domino’s Pizza order tracker is one of the most popular business
    processes'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'The primary challenge with BPM lies in its extensive nature, which includes
    numerous theoretical areas that may only become relevant as needed. Not everyone
    can afford the luxury of time and resources to pursue a two-year BPM master’s
    program at institutions such as the University of Illinois, Springfield, or other
    schools offering BPM through professional education courses. Effectively packaging
    and delivering training to the appropriate audience will be crucial for the success
    of your DTX. Additionally, you must tailor your messaging to capture the attention
    of different user groups within your organization. It is well known that companies
    often find it hard to get enthusiastic about process improvement programs and
    business processes. The trend is toward building low-code apps or engaging with
    AI, often overlooking the essential foundational knowledge required to integrate
    such applications into adaptive and intelligent end-to-end process ecosystems
    that enable the digitization of enterprise value chains.


    Indeed, you can build a low-code app or even a few without knowing anything about
    the theory of the business process. However, if you genuinely want to transform
    your company’s operations and business processes, you must understand a few additional
    non-technical concepts. There are no shortcuts here.


    In addition, like any science that can depart too far from pragmatic outcomes,
    measuring the ROI from the investment into the BPM transformation program alone
    can be challenging and non-trivial. This book devotes a whole chapter to this
    topic.


    Great leaders know instinctively that long-term investments in BPM can yield results
    that other competitors can only dream of. But how do others do it? There are many
    published case studies of successful BPM transformations and fantastic results
    generated by such companies. Getting desired results—firstly, being able to define
    what such results should look like—can be initially easier said than done, as
    this task can be overwhelming.


    To simplify this concept, I propose that we start thinking about BPM transformations
    using the wheel metaphor, which will be used throughout the remainder of the book.


    Wheels are straightforward to grasp; whether in Tonka trucks, on the *Wheel of
    Fortune*, or referenced in religious texts, they have consistently held a crucial
    place throughout the history of civilization.


    At most organizations, the wheel of BPM will be organized around three phases:


    +   1. Process discovery, definition, and reuse.


    +   2. Automation, covering a wide variety of use cases. Many companies start
    their transformation journeys from this point, getting themselves into trouble
    quickly.


    +   3. Optimization, which is followed by phases 1 and 2, as the wheel spins continuously.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# The Wheel of BPM Driving Your Competitive Advantage


    As the wheel of BPM transformation continues to spin through these three cycles
    in the right order,

    with each successful turn, your program’s growth should amplify.


    The growth and reach of your program will be fueled by subsequent releases of
    digital change projects

    when _launched and change managed correctly_, and with _the increasing population_
    of the citizen developers

    community, who will become your biggest ally.


    While many organizations turn to external consulting firms for expertise, this
    approach should complement,

    not replace, the internal knowledge and commitment required to sustain meaningful
    transformation.


    In other words, the successful growth of your program will be related to the level
    of success you get

    with your digital change initiatives and the level of empowerment citizen developers
    will have. Once

    you reach the critical mass of the citizen developers population and your company’s
    unmet automation

    needs start to get addressed, the wheel will begin fueling continuous improvement
    initiatives, pushing

    your digitized processes to their next level of maturity.


    As this momentum builds, the wheel of BPM becomes more than a metaphor—it becomes
    a practical

    framework for guiding DTX.


    The wheel will keep turning for months and years until your company reaches the
    highest level of

    process maturity. Still, even at that time, a new tech or science development
    may push BPM to the new

    frontier, searching for the next best thing in process management and work automation.
    It is best to

    consider BPM as a business practice rather than a software category or a set of
    tools, even if both are

    intimately intermingled. The BPM adoption formula previously presented will drive
    the grassroots

    model of DTX in contrast to the top-down model still practiced by some consulting
    companies. While

    top-down transformation models remain common, particularly in consulting-led programs,
    more

    organizations are turning to citizen developer approaches that foster grassroots
    innovation, build

    internal ownership, and keep talent at the center of change.


    The wheel of BPM supports this shift by offering a practical, repeatable framework
    that anchors your

    DTX strategy in real-world process understanding and team-driven execution.'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'The following illustration offers a visual representation of these phases:


    ![](img/a4c90ee3d142c33743706d37c65779c2_87_0.png)


    Figure 3.5 – The wheel-based view of a DTX based on an example of a US-based retailer


    For the whole company to get comfortable with these concepts, the wheel must spin
    a couple of times, each creating the inflection point that leads to accelerated
    adoption of process-led solutions, a culture of continuous improvement, and genuine
    excitement created by successful projects. When BPM creates results, you will
    hear and feel the positive buzz in all parts of the company as many project teams
    start announcing their successes. It is a gratifying and fun part of the program
    as the success of others brings other use cases out of the woodwork, reenergizing
    everyone about the possibilities of improving operations. Success breeds more
    success, so you should prepare for it upfront and consider the potential scale
    of your program.'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'The wheel of BPM can be adjusted to each company’s approach, as depicted by
    the following example:


    ![](img/a4c90ee3d142c33743706d37c65779c2_88_0.png)


    Figure 3.6 – The Process Excellence framework defined by a global software company


    Jumpstarting the program can initially take some effort, so visualize the early
    stages of the practice adoption as a team exercise that involves pushing the boulder
    up a small mountain. The size of the hill (and your boulder) will vary based on
    where you work and how much executive support you get. Through this visualization,
    I am trying to help you envision the type and strength of drag your program will
    be exposed to, also defined as the stakeholder pushback. The first few pushes
    are the hardest; when you start, the boulder is still standing, with the force
    of gravity almost pushing back against you. Pushing the rock forward (jumpstarting
    the program) will require focus, grit, skills, a team, a bit of a budget, a strong
    sense of direction, and the unshaken sense of belief that what you are doing is
    going to work and create substantial results for your employer.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '![](img/a4c90ee3d142c33743706d37c65779c2_89_0.png)


    Figure 3.7 – Jumpstarting a BPM program is best done with a team


    It is essential to have a strong belief that successful BPM programs will yield
    numerous unexpected and positive outcomes, acting as a beneficial force that propels
    the company’s efficiency forward, even during difficult times. As your goals become
    clearer, resistance diminishes, and progress begins to build momentum on its own.
    Each phase that demands extra effort to tackle organizational challenges can reinforce
    the role of BPM programs in strengthening operational efficiency. When implemented
    well, these programs contribute to measurable improvements in business performance
    and strategic alignment—in some cases, influencing the company’s stock value.


    # Why does this happen?


    Because BPM provides a structured and repeatable approach to enhancing how work
    is done, it brings clarity to complex operations, supports cross-functional collaboration,
    and helps reduce waste. Over time, this leads to measurable gains, lower operating
    costs, faster decision-making, more effective use of talent, and a clearer understanding
    of what works and what doesn’t. These are the building blocks of ROI, and in many
    cases, they enable companies to take on more ambitious goals, including new business
    models. AI will only amplify these effects by turning well-structured processes
    into intelligent, adaptive systems. While it’s not always possible to pinpoint
    how much BPM alone contributes to a company’s valuation, improved operational
    discipline consistently leads to better execution, and that shows up in bottom-line
    results.'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'We’ve seen companies generate meaningful business outcomes by embracing BPM
    practices:


    +   • **UnitedHealth Group (UNH)** is a leading health care and well-being company
    providing health benefits, technology-driven care solutions, and pharmacy services
    to improve access, affordability, and outcomes. UNH launched its BPM initiatives
    to improve end-to-end care models, consolidate customer care, integrate clinical
    data and analytics, and simplify administrative processes while enhancing operational
    efficiency in its segments. Between 2007 and 2014, UNH’s stock increased 87.1%.


    +   • **Heineken (HEINY)** is a global brewing company that produces and distributes
    beer and other beverages across multiple markets. Heineken has utilized process
    digitization to drive employee innovation, improve productivity, enhance safety
    audits, and improve its point-of-sale systems. Between 2019 and 2025, HEINY’s
    stock price increased by 4.65%.


    +   • **Goldman Sachs (GS)** is a global investment banking, securities, and asset
    management firm that provides financial services to corporations, governments,
    and individuals. Goldman Sachs has utilized AI-driven automation for algorithmic
    trading, risk management, compliance monitoring, and fraud detection. GS’s stock
    price saw an approximate 116.9% increase between 2015 and 2022.


    It is important to recognize that pure financial performance, including stock
    prices, is also influenced by broader market trends, economic conditions, and
    industry-specific factors.


    Other leading companies that also launched BPM programs to enhance their competitive
    advantage, embed operational discipline, and lay a foundation for sustainable
    DTX include the following, and many others:


    +   • Google (and its parent company, Alphabet)

    +   • Nordstrom

    +   • Amazon

    +   • Coca-Cola

    +   • Microsoft

    +   • NHS Healthcare

    +   • Conoco-Philips

    +   • ABN Amro

    +   • NATO


    To unleash such forces, you and your team, if you are lucky to work with one,
    will need to firmly believe in the transformation’s vision. Without the ultimate
    commitment to the vision, the magic of BPM will not work. These projects usually
    require strong leadership skills, lots of grit, and the ability to collaborate
    with almost anyone, as your program, collective skill set, and its reach within
    the enterprise undergo multiple iterations and experience occasional roadblocks
    along the way.'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'Before you decide that pushing your boulder up the mountain is worth the effort,
    you must firm up

    the scope and objectives of the transformation for your business unit or department.
    I would strongly

    advise against starting with BPM at the enterprise-wide level unless you and your
    team have successfully

    launched similar initiatives in the past and/or your program has excellent leadership
    support. Even

    under these two conditions, starting smaller and gaining momentum with each wheel
    spin is strongly

    advisable. While there are known case studies of companies launching enterprise-wide
    automation

    programs almost overnight, such initiatives usually involve massive teams of consultants,
    and these

    scenarios are not in the scope of this book, as it’s hard to estimate the realized
    ROI.


    The approach to BPM presented in this book focuses on empowerment and democratization
    so that

    you and your company may capture the value of business transformation on your
    terms without the

    additional expense of large consulting teams.


    Going big right at the start involves tackling problems on a large scale, coupled
    with severe corporate

    political winds encountered at the very top of each organization. It is always
    less risky (and more

    fun) to learn and experiment within your immediate environment, realizing that
    the same business

    practices can be applied over time to problems at the highest level of your organization.
    My advice

    to you is, don’t rush it.


    There are a few very large companies out there that successfully transformed themselves
    overnight

    with the help of BPM. Even the most successful ones often iterate on their models,
    learning through

    experimentation before achieving long-term BPM success.


    # Defining the scope and objectives


    Defining the scope is a crucial step during the program launch phase. The scope
    and objectives should

    be clearly defined and aligned with the overall business strategy and vision of
    your organization. If the

    business strategy does not exist, search for it or find people accountable for
    defining it.


    You will need to study both to help you identify critical processes and areas
    of the business to be

    impacted by the transformation. Discuss desired outcomes and benefits that BPM
    transformation is

    expected to deliver with others. This activity involves thinking big and making
    connections across

    different parts of your company. The more connections you make, the more successful
    your program

    will be over time, as you will start running into other like-minded change champions
    attempting to

    solve similar problems.


    Reflect on the following objectives from a global high-tech business:


    > “The end state objective of BPM is for our company to become process-centric,
    with

    > end-to-end processes defined, analyzed, and optimized continuously. Technology

    > investments should align with business objectives as expressed by business process

    > requirements, leading to increased predictability, agility, reduced failure
    rates, lower

    > risk, and operational costs.”'
