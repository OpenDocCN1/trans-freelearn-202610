  md: '# # EXPERT SERVICE: BUSINESS VALUE ANALYSIS

    Version 1.0


    # ## Service description


    Effort estimation can be performed at multiple stages of your project, each time
    providing critical information to your business sponsors and program leadership.
    Our team can provide you with 2 types of estimator order of magnitude (aka T-Shirt
    sizing) and budgetary guidance. Each type of the estimate will require a different
    level of effort from the project team. It is not uncommon to spend between 1-4
    weeks of time conducting estimation to produce guidance estimates as they will
    require gathering of your vision and requirements. T-Shirt sizing estimates can
    be performed in matter of 3-5 days. Keep in mind that CoE estimates are not replacing
    delivery team estimates and should be treated as a baseline. Through close relationships
    with BPMS and workflow technology providers, we are in possession of proprietary
    models and best practices, which can be used to provide you with high quality
    estimates. Through internally developed scaling factors, we tailor external estimation
    models to Nordstrom realities.


    # ## Business value


    Many times, new business ideas cannot advance and flourish without the knowledge
    of how to approach their implementation. T-Shirt sizing will help you assess initial
    work complexity, helping to quickly navigate and reconfirm any assumptions being
    made at this critical time. Proper estimation techniques increase predictability
    of success by employing common criteria and methods. Hiring external consultants
    with the expertise for sometimes iterative, ad hoc work is not always feasible
    and will be costly. Our service reduces risks of misestimating effort of business
    initiatives. We will also tell you like it is, and you will not have to worry
    about the conflict of interests like in the case of estimates produced by consultants.


    # ## Inputs, requirements and assumptions


    Vary based on the type of the estimate. Requirements Evaluation and Fit Assessment
