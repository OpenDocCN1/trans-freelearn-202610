- pgno: 25
  md: '# # Winning at Digital Transformation with Process Modeling


    Process modeling is more than plotting out process steps in advance of creating
    an automated standard operation process that meets current business needs. Process
    modeling is used throughout the life cycle of both standard and emergent processes
    designed to respond to change in an emergent/blossoming fashion. A standard process
    example is that of underwriting risk that can adapt to changing business conditions
    and stakeholder needs or demands.


    In this chapter, you will learn the names of different processes, the different
    types of active processes today, and the future of processes as they adapt to
    changing conditions. This is particularly true of the impact of AI and its contribution
    to process intelligence. The shift in process behavior will put an emphasis on
    process modeling as a process auditing capability as well as a processing planning
    tool. The reader will be able to understand and leverage process modeling better
    than ever before.


    The following topics are covered in this chapter:


    +   - Is process modeling the key to real digital transformation?

    +   - How does process modeling contribute to digital transformation?

    +   - Types of process modeling today with usage guidelines

    +   - What is the future of process modeling in the context of other modeling
    disciplines?

    +   - What is the future of process modeling in the context of AI assistance?'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# # Is process modeling the key to real digital transformation?


    Digital transformation touches many aspects of an organization, including customer
    interaction, internal operations, management tactics, and the ability to adapt
    to changing business conditions. There are many on-ramps that organizations can
    take to achieve digital direction and velocity; however, processes are often the
    primary place for organizations to start or extend their digital efforts. Processes
    are heavily involved with the efficiency and effectiveness of customer interactions
    and operational excellence and effectiveness. It is not hard to understand the
    effectiveness of extraordinary processes as there are examples of successful businesses
    that leverage processes.


    Amazon is an excellent example of an organization that delivers extraordinary
    processes that please its customers while optimizing internal operations with
    the help of tons of automation. Those processes are rife with digital technology
    that augments human interactions with excellent transparency and a pronounced
    lack of friction for customers and employees. With built-in feedback loops and
    the ability to audit the progression of goods for customers, employees/contractors,
    and management, Amazon continues to leverage its processes for profitability and
    satisfaction. This is no accident, rather the planned leverage of processes being
    used as a primary competitive advantage.


    There are many known case studies in every industry in which agile processes are
    powered by combined business analytics and process modeling. While there is a
    rapid shift to include AI in these efforts, there are plenty of successful processes
    already without AI. Later in this chapter, we will talk about the impact of AI
    on processes. Typically, process models represent processes and the sequences
    and branches taken to attain the completion of a set of process goals. These models
    are static or dynamic visualizations of how a process progresses to a set of goals
    or outcomes. Processes are often created, crafted, and improved as human designers
    visually plot out the common happy paths of process progression and the exception
    paths before they are built. The visualization represented by the process models
    is often the critical content over which business professionals design their new
    or modified processes. Every decision and action step is plotted out, leveraging
    the highly visual process model.


    Business professionals often use business analytics to support the process model-building
    efforts. Once crafted, the business professional may delegate the composition
    or building of the modeled process to other technical professionals who can sort
    out the technical supports necessary for each decision or step/sub-step in the
    model using either existing components, newly crafted components, or new


    > > **Note**

    > > This chapter is authored by Jim Sinur. The chapter starts with the basics,
    projecting from the current value to the future value of processes and the process
    models that represent businesses. Jim brings significant credibility as a recognized
    process expert who has implemented processes and programming solutions.'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'wrappers for legacy systems/components. The process model then adds more value
    as a communication device across jobs with diverse skill sets. The process model
    becomes the “Rosetta Stone” across job functions by communicating the intent and
    context of the process and process steps. The value of a process model is in plotting
    out the steps in advance of creating an automated operational process that meets
    current and future business needs. Clever processes have options for anticipated
    change, making them even more valuable.


    Process models also are helpful once a process is built and operating in place,
    even if it is a legacy system. Process models can be combined with data and process
    mining technologies to represent what has happened during past executions of business
    events/transactions. It gives business professionals a visual means to understand
    what happened over selected periods. In some cases, animation can be added to
    help visualize trends and obvious process bottlenecks. The real power of business
    and process improvement is often unlocked by combining business analytics on the
    process instance data to highlight opportunities to tweak processes for better
    throughput, better average timing of process instances/cases, and trapped exceptions
    with no hope of resolution. Visualization combined with descriptive, prescriptive,
    or predictive analytics is powerful for better business outcomes over time. In
    some cases, changes can be pretested to watch changes in outcomes before the actual
    changes are completed, by leveraging useful approaches such as simulations or
    digital twins.


    To conclude, if processes are involved in your organization’s interactions or
    operations, they will be critical to digital transformation efforts. If processes
    are present, a process model for visualization to humans is a must to communicate
    its intent and possible paths to business outcomes.


    # How does process modeling contribute to digital transformation?


    Processes are everywhere in an organization; therefore, the process models are
    essential for digital transformation to progress. While only 20–30% of the most
    high-volume processes of an organization are automated in some way, there are
    ample opportunities for digital transformation. The easy step is to look at those
    processes, but sometimes the most essential and costly processes are outside the
    normal high-volume processes and looking for automation opportunities. For organizations
    to execute flawlessly, all processes are candidates for digital attention. Organizations
    can also benefit by finding procedural processes that can prevent risk, compete
    for skills more effectively, and stay compliant in a changing business environment.
    Finding these golden nuggets will require some digging. See Figure 1.1 for the
    common names for processes typically found in organizations. Industry groups and
    competitive benchmarks can point to the kinds of processes to transform over and
    above the typical high-volume processes.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# # Common Names for Processes


    +   - Actor, Step, Action

    +   - Precedence

    +   - Process Flows

    +   - Workflows

    +   - Activity Sets or Steps

    +   - Case Collaboration

    +   - Customer Journeys

    +   - Best Practices

    +   - Straight Through Processes

    +   - Business Process Management (BPM)


    ![](img/a4c90ee3d142c33743706d37c65779c2_28_0.png)


    Figure 1.1 – Common names for processes


    Often, organizations improve typical high-volume core processes by improving the
    customer experience and start to converge highly automated and internally focused
    processes to include the goals of the customer, making these processes more outside-in,
    AKA customer-centric over time. Most often, systems concentrate on internal organizational
    goals that are aimed at efficiency only. The primary goal of many organizational
    processes revolves around the cost and speed of transactional completion in a
    compliant manner, but not necessarily in favor of customer goals. Digital transformation
    is an opportunity to balance customer goals with internal organizational goals
    focusing primarily on profit. See Figure 1.2 for ideas on closing the gap between
    the customer experience and business processes. Many organizations believe they
    do not inflict pain on their customers when interacting with their core processes.
    These organizations need to classify the pain they cause and what characteristics
    cause the pain for customers. See Figure 1.3 for an example customer pain index.'
  merge: -1
  img_proc: true
