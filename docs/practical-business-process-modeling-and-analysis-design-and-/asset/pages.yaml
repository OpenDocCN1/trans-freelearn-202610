- pgno: 333
  md: '# # Measuring the Business Value of Process Transformation


    As we’ve progressed through the book, you may have noticed our emphasis on the
    significance of business processes in the context of digital transformation and
    how this impacts your career.


    Engaging in process transformations, digital automation programs, and comprehensive
    overhauls of business operations can help you develop new skills that enhance
    your expertise in business technology. We aim to inspire you to explore the world
    of business processes and view them as essential components of your professional
    skill set.


    How can you convey the importance of embracing process management within your
    business group or company, especially when some colleagues are skeptical?


    In today’s fast-paced business environment, companies continually seek ways to
    improve, automate, and enhance the strategic adaptability of their operational
    processes to remain competitive and navigate a world that can change from one
    day to the next.


    Digital initiatives fail for one simple reason: nobody can see how work gets done.
    Sometimes, understanding what work is on a global scale can present significant
    challenges. Invisibility breeds waste and delays, and AI projects often fail to
    pass AI compliance checks. Without a robust process architecture, discussions
    about digital transformation or AI automation programs lack a solid foundation.


    In an AI-driven future, a well-structured process architecture will be crucial
    for governance, ensuring that AI solutions perform tasks according to the responsible
    standards set by the organization. By requiring documentation for every step of
    business operations, process architecture enforces traceability, making it easier
    to audit AI decisions and AI-driven processes—an essential requirement for regulatory
    and ethical compliance.'
  merge: -1
  img_proc: true
- pgno: 334
  md: 'While the prospect of acquiring new skills and participating in innovative
    projects can energize us at work, our business sponsors must justify and recognize
    these transformations as successful. Digital initiatives succeed or fail based
    on one key question: Can we prove the business payoff? Optimizing workflows, launching
    automation projects, or even re-architecting an entire process landscape sounds
    compelling. However, at the end of the day, your sponsors will still ask, “Show
    me the money” or “What’s the Return on Investment (ROI)?” This necessitates accurately
    forecasting and measuring the business value or benefits of such initiatives,
    and this chapter equips you to answer these questions with confidence.


    This chapter addresses the following key questions:


    +   - What is business value?

    +   - Why is it necessary to measure business value?

    +   - What are the key metrics for measuring business value?

    +   - What recognized methodologies are available for business value analysis?

    +   - What tools and techniques can be used to measure business value?

    +   - What are some common challenges in measuring business value?

    +   - What does a case study of a **business value assessment (BVA)** look like?

    +   - How can we measure the business value of AI transformations?


    # ## What is business value?


    Business value, in terms of business and process transformation, refers to the
    tangible and intangible benefits that an organization gains by discovering and
    improving its processes.


    When our Citizen Developer Automation program at Nordstrom started to grow in
    size and costs, requiring additional resources, the VP didn’t ask for a prettier
    dashboard—he asked for a demonstration of how many dollars were saved each day.


    When UnitedHealthcare started applying process automation to new use cases, enabling
    business users to control the authoring and deployment of business rules in a
    highly controlled environment supporting millions of Medicare users, the first
    step involved creating a BVA.


    When the Microsoft Operations team started applying RPA automation to its manual
    purchase order process, the sponsor wanted to evaluate this investment with a
    scenario-based analysis, reliably projecting the business value over three years.
    Then, to gain higher confidence and predictability of results, the team wanted
    to standardize the way of capturing and forecasting business value for all automation
    projects.'
  merge: -1
  img_proc: true
- pgno: 335
  md: 'Questions like these force practitioners to measure business value instead
    of measuring the improvement

    of process steps, and they are usually asked at the very beginning of initiatives,
    making it somewhat

    challenging to forecast such numbers very early into the project for several reasons.


    Business value, in terms of business and process transformation, refers to the
    tangible and intangible

    benefits that an organization gains by discovering and improving its processes.
    **Business value analysis

    (BVA)** is a structured method for identifying pain points with measurable upside,
    connecting solution

    options with technical feasibility, applying organization-specific scaling factors,
    quantifying tangible

    (capital, hours) and intangible (**net promoter score (NPS)**, risk) benefits,
    and tracking the realization

    of benefits over time to continuously improve the framework and keep sponsors
    engaged.


    The following business benefits can be measured with the help of BVA:


    +   - Increased revenue

    +   - Reduced operational costs

    +   - Reduction of process errors

    +   - Improved productivity due to added process efficiency

    +   - Improved employee engagement and efficiency

    +   - Decreased employee turnover

    +   - Improved customer satisfaction and reduced churn

    +   - A stronger competitive position in the market

    +   - Increased customer loyalty

    +   - Avoidance or reduction of out-of-compliance fines

    +   - Reduction in solution development costs

    +   - Risk mitigation


    In workflow automation, businesses achieve value by optimizing processes, minimizing
    manual

    intervention, and accelerating decision-making. These types of initiatives lead
    to a more agile and

    responsive business environment, a characteristic referred to as **strategic adaptability**.


    Measuring business value enables organizations to validate their investments,
    align with strategic

    goals, and foster continuous improvement.


    Here are some examples of tangible benefits:


    +   - Increased revenue through higher sales by providing an exceptional partner
    experience on the

    +   sales channel (sales, finance)

    +   - Reduced operational costs by optimizing resource utilization (contact centers,
    operations)'
  merge: -1
  img_proc: true
- pgno: 336
  md: '+   - Improved **service-level agreements (SLAs)** for end-to-end business
    processes, with the possibility of changes as impressive as decreasing the timeline
    from 20 days to 12 hours (for example, in domains such as insurance, finance,
    and so on)

    +   - Enhanced efficiency by automating repetitive tasks such as reconciliation
    and accounting ledger updates (finance)

    +   - Shortened time to market for new products, allowing for a broader product
    selection to address seasonality (product design)

    +   - Lowered inventory costs through better demand forecasting, shipment tracking,
    and route optimization (supply chain)

    +   - Reduced shrinkage by implementing security processes that address theft,
    loss, and fraud (retail)

    +   - Fewer cases of non-compliance issues, leading to a reduction in penalties
    and improved patient trust (healthcare claims and prior authorizations)


    The concrete results can be easily measured and have a direct impact on the bottom
    line, which is typically expressed as numerical data or a percentage. On the other
    hand, there are intangible benefits that are more difficult to quantify but still
    offer significant value to the organization while not being immediately reflected
    in financial statements. While these benefits are easy to recognize, measuring
    them effectively poses a greater challenge. Assessing their value requires more
    nuanced evaluation methods, such as customer feedback surveys, employee engagement
    scores, or brand perception analyses.


    Here are the intangible benefits:


    +   - Enhanced customer satisfaction due to faster and more accurate service delivery

    +   - Improved employee morale, resulting from a more streamlined work environment
    and a reduction of mundane, repetitive, energy-draining tasks

    +   - A stronger competitive position through innovation and agility

    +   - Increase in brand loyalty and a better overall reputation

    +   - Greater adaptability to market changes and evolving customer needs

    +   - Shorter deployment cycles

    +   - Shorter time to market

    +   - Business empowerment


    While these benefits may be harder to quantify, they are crucial to the organization’s
    overall success and sustainability and should be included in your BVA as influencing
    factors.'
  merge: -1
  img_proc: true
- pgno: 337
  md: '# # Recognizing the importance of quantifying business value


    Transformation initiatives are crucial for maintaining a competitive edge in a
    rapidly changing business environment. For professionals driving digital change
    within organizations, articulating and quantifying business value is essential.
    This skill justifies future investments, ensures alignment with strategic priorities,
    and facilitates data-driven decision-making. While the initial ROI may not be
    significant, approaching process transformations with a focus on business value
    right from the start will set you on the right long-term path as your projects
    pursue the target ROI. Thinking about business value also compels you to seek
    answers to critical questions. The following few scenarios explain why assessing
    and validating benefits is essential.


    # ## Building the business case for justifying investments


    Large-scale transformations often require significant investments in technology
    (such as software, platforms, tools, and infrastructure), talent (labor costs),
    new skills (for training), and change management (which encompasses time and experience).
    Financial justification is crucial for stakeholders and must be included in the
    project charter as a requirement.


    A clearly defined framework for measuring business value provides concrete evidence
    of expected returns, allowing leaders to gain support from boards, steering committees,
    decision-makers, and operational leaders. Metrics such as ROI, **net present value
    (NPV)**, payback periods, and qualitative strategic benefits create a strong business
    case for transformation initiatives involving multiple projects.


    This same approach can be applied to smaller projects that have the potential
    to become larger transformations. Citizen developers and business professionals
    often face challenges because they lack access to consultants and their analytical
    resources. However, starting small does not mean the journey cannot lead to significant
    transformational savings.


    While working on a transformation at Nordstrom, our program was driven entirely
    by business users who recognized the value of solving their problems with low-code
    **digital process automation** (DPA). The following diagram illustrates some key
    wins that were identified, designed, and launched, generating significant business
    value through several initiatives. These initiatives often began small but sometimes
    expanded into larger implementations.


    Our business savings were categorized into three groups: less than $15,000, $50,000,
    and over $100,000 annually. Notably, some projects delivered benefits exceeding
    $1,200,000 in annual value. It’s important to understand that even the smallest
    project could be part of a much larger initiative, and a process identified by
    a citizen developer might have the potential to significantly impact the bottom
    line. Therefore, we should not underestimate projects that may initially seem
    minor.'
  merge: -1
  img_proc: true
- pgno: 338
  md: 'When these savings are compounded, the story of process transformation reveals
    its true potential, as shown in Figure 10.1.


    # # Featured Wins


    ![](img/a4c90ee3d142c33743706d37c65779c2_338_0.png)


    Figure 10.1 – Tracking the benefits of citizen developer process applications


    Over time, realized business savings can accumulate quickly, especially with each
    passing quarter. When even the smallest successes in your program get recognized,
    the overall value created can multiply rapidly, potentially leading to larger
    initiatives as well. This is why the value proposition of a well-executed process
    transformation program is so attractive to businesses—it’s as if the savings grow
    on a tree. However, it’s important to emphasize the phrase “well-executed,” as
    poorly managed programs can negatively impact both budgets and reputations.


    # ## Ensuring strategic alignment across the enterprise


    Business professionals recognize the importance of aligning initiatives with overarching
    corporate strategies, often articulated through **objectives and key results (OKRs)**.
    Measuring business value is essential to ensure that transformation projects contribute
    directly to long-term goals, such as market expansion, operational excellence,
    and customer-centric innovation. This alignment maximizes the impact of resources
    and investments while fostering cross-functional collaboration, ensuring that
    all departments work toward a unified vision.'
  merge: -1
