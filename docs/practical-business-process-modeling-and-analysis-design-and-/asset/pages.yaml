    # Avoiding common pitfalls


    During my career, I’ve been asked a few times to drive evangelism of process-led
    DtC programs, and

    such assignments taught me the following lessons:


    +   • DtC efforts usually span multiple business and tech areas, with numerous
    stakeholders owning

    +   the outcome, which may be defined differently based on the business group.


    +   • The topic of DTX can get very big very quickly, and people will challenge
    your authority to

    +   discuss programs so large in scale. Leaders don’t like to discuss initiatives
    that span the whole

    +   enterprise; such problems are simply too big to tackle.


    +   • Many times, people involved in digitization projects have been exposed to
    failed implementations

    +   in the past, facing leadership skepticism about any new work or technology
    that reattempts to

    +   drive the same type of change. Remember the statistic cited by Boston Consulting
    Group of

    +   60-70% of large transformation projects failing (*Flipping the Odds of Digital
    Transformation

    +   Success | BCG (https://www.bcg.com/publications/2020/increasing-odds-

    +   of-success-in-digital-transformation*)). No one likes to fail more than once,

    +   and no one wants to risk a career betting on another shiny vision of reality.
    The rule of thumb is

    +   that organizational memory retains information about failures for ~2 years,
    and if you attempt

    +   to relaunch process transformation projects that failed too early, you will
    struggle. Engaging in

    +   multiple root cause analyses to probe possible causes of failed digital change
    initiatives makes

    +   a lot of sense. Many times, prior failures are not attributed to technology
    and can be corrected

    +   if adequately diagnosed. The first instinct of any organization that failed
    DTX is to blame the

    +   software vendor providing the platform and tools; however, except for a few
    scenarios where

    +   DPA vendors were indeed to blame, most issues leading to failures were internal.
    This is not

    +   to say that software vendors don’t cut corners or overpromise on tech capabilities.
    Some do,

    +   and cleaning up after such projects is usually not much fun. Such projects
    can be great lessons

    +   learned, but tend to be very stressful and technically challenging.'
