- pgno: 58
  md: '+   • In many organizations, IT units hold bigger budgets than businesses and
    feel that this funding provides them with a stronger voice to drive DtC. Companies
    yield the best results with DTX or DtC in a business-led, technology-facilitated
    mode of operation. Try to address this dynamic before launching any major initiatives.


    +   • When organizations jump on the automation bandwagon, excited about the high
    potential, they often approach knowledge-intensive work in the same way as repeatable
    tasks and activities. Due to a lack of experience, it’s easy to treat case-based
    scenarios like structured workflows. These mistakes can paralyze complex industries,
    such as law and healthcare. Designing end-to-end flows for work that inherently
    variable leads to rigidity, workarounds, and user pushbacks. This pitfall occurs
    when work predictability levels are not considered, and the Fit Assessment service
    is skipped during the opportunity evaluation phase of the project. What’s needed
    for the automation of knowledge work is a stateful, context-aware model that gives
    users control while guiding work toward the right outcome. Some leaders and execs
    will drink the software vendor Kool-Aid, which comes with much vendor-infused
    flavor, at times overpowering the true objectives of the transformation. It’s
    only through the adoption of technology platforms and interactions with consulting
    teams that we learn about the authentic culture of the company brought in to help
    out or the true transformational power of their technology. Unfortunately, at
    the point of adoption, such discoveries come late.


    For example, if, as an employee of a company responsible for driving the vision
    of the DtC for your organization, you find yourself at odds with vendors courting
    or competing with you for access to decision-makers, even your best strategies
    will fail regardless of whether your strategies are superior to visions offered
    by external vendors. The situation can be even more complex if your company works
    with multiple “strategic” advisors, vendors, or IT service companies. Some vendors
    will pursue their business agendas aggressively, and sifting through the track
    record of projects to back up claims made by these companies can be impossible
    and impractical.


    To help you avoid all the challenges mentioned, I’d like to propose a model of
    a process-led DTX that, when applied correctly, guarantees success regardless
    of politics, technical complexities, or vendors brought in to help. Following
    this conceptual model to harness forces in the enterprise will ground most agendas
    on a shared view of DtC, ultimately leading to DTX.'
