- pgno: 65
  md: '"Success has many fathers and failure is an orphan" still rings true in companies
    with more traditional corporate cultures. Many new leaders, encouraged by the
    success of our very challenging transformation, quickly raised their hands, inspired
    by the excellent results reported by my IT director and business sponsor. Corporate
    leaders started to follow in the footsteps of our segments, stepping into the
    same set of mistakes of early adopters, self-promoting, and trying to take the
    credit for the transformation force that was already unleashed. Many “self-proclaimed”
    visionaries came out of the woodwork, connected to centers of corporate power,
    literally elevating their careers through PowerPoint slides built on top of the
    hard work of our unit. There is nothing wrong with building on the success of
    others; a lot of innovative companies do it. When you, however, start taking credit
    for the accomplishments of other people who paved the way for you, that’s not
    leadership; that’s a strategy taken directly from Machiavelli. It’s a known but
    not very well-publicized fact that DTX programs test corporate cultures for ethics
    and transparency because the business value unlocked can be very high. These high
    ROI programs can attract all types of corporate buffoons who thrive in corporate
    environments by attaching themselves to successful initiatives. However, if you
    asked them to raise their hands to help when the going was demanding and involved
    risk-taking and commitment, they’d prefer to hide behind recycled PowerPoint slideware.


    Our initial implementation team was small, mighty, hardworking, and committed
    to the bone to the success of the project. In the professional world of business
    and technology, such commitment should be evaluated by the number of overnights,
    family sacrifices, and weekends spent supporting DTX; however, these rarely see
    the light. Today, reflecting on the work accomplished during PAS implementation,
    I take my hat off to the team responsible for accidentally launching the most
    extensive process-led transformation in the world: Qing, Wendy, Solita, and Stacy.
    These ladies took this healthcare insurance giant to a place where not many companies
    ever went before, and I was fortunate to work alongside them.


    | Pros | Cons |

    |---|---|

    | • High levels of innovation and creativity • Can result in significant business
    ROI and positive results • Minimizes political turf wars in the early stages •
    Driven internally by FTEs increases work satisfaction | • Higher costs to launch,
    coupled with a number of early adopter mistakes • Insufficient preparation puts
    stakeholders and teams in a situation where they have to both prepare for and
    launch projects in parallel • Heavier dependency on software vendors drives implementation
    costs up and blocks specific initiatives from launching due to the lack of know-how
    |


    Table 2.5 – Advantages and disadvantages of an accidental transformation'
