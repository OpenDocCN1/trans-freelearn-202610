- pgno: 249
  md: 'If the customer didn’t respond to us, our process would never move on. Of course,
    this isn’t something we’re happy about because as part of the processes in which
    we communicate with others, we should be able to respond to the lack of response
    to our message. Fortunately, BPMN has several solutions to this problem, something
    we’ll cover in Chapter 9.


    In the case of sending and receiving tasks, it’s worth remembering that the specification
    treats them as automatic process steps, so they shouldn’t be used for steps in
    which an employee prepares and then sends an email. In such a situation, we could
    use, for example, a manual task or a user task, which can also send messages (this
    is denoted by an outgoing message flow arrow).


    It’s also worth noting that our **Inform customer about complaint validity** task
    is connected by a sequence flow with the **Receive shipping details** task. Some
    people assume that since we’re sending a message out and waiting for a return
    message, we can skip the sequence flow, as shown in Figure 8.28. However, this
    isn’t allowed as the two tasks must be connected by a sequence flow.


    Those who find the concept of a token helpful can imagine that a token that doesn’t
    have a sequence flow has no way to *jump* to the next task within the process
    as it isn’t allowed to travel along the message flow.


    Here, once again, the rule of reading BPMN diagrams comes in handy – we start
    from the start event and follow the sequence flow step by step, without breaks,
    always within a single pool, until the end event. As you can see, we would violate
    the *no-breaks* rule here.'
  merge: -1
  img_proc: true
