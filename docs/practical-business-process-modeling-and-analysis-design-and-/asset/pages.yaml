  md: 'it can’t be used after gateways (for obvious reasons). Its appearance suggests
    that it’s used to replace gateways since it has a special symbol of a small diamond
    at the beginning.


    ![](img/a4c90ee3d142c33743706d37c65779c2_243_0.png)


    ![](img/a4c90ee3d142c33743706d37c65779c2_243_1.png)


    ![](img/a4c90ee3d142c33743706d37c65779c2_243_2.png)


    Figure 8.24 – Comparison of modeling with gateways (XOR and OR) and conditional
