  md: 'As Betty-Jo Almond, General Manager of AgSights, puts it, “AI is giving ranchers
    access to insights from their own data. Simply asking questions using their phone...
    is unlocking tremendous potential.”


    For organizations invested in continuous improvement methodologies and to further
    refine operational excellence and translate insights into actionable metrics,
    methodologies such as Six Sigma and Lean Metrics offer a framework for assessing
    AI-driven solutions.


    # ## Six Sigma and Lean Metrics


    Six Sigma and Lean Metrics can be used as a framework for assessing the business
    value of solutions that incorporate AI and agents. By concentrating on reducing
    defects and eliminating inefficiencies, these methodologies help quantify improvements
    in quality and operational effectiveness. This dual approach enables organizations
    to align innovations with strategic goals while promoting continuous improvement
    across their processes. The following Six Sigma metrics-based BVA example focuses
    on reducing errors and improving quality:


    | Six Sigma Metric | Impact of AI Automation | Quantified Outcome |

    |---|---|---|

    | Defects per million opportunities (DPMO) | AI reduces manual errors in key processes
    (e.g., data entry, approvals) | 30% reduction in defects, moving from 4σ (6,210
    DPMO) to nearly 5σ (~233 DPMO) |

    | First pass yield (FPY) | AI automates routine processes and reduces rework |
    FPY improves from 85% to 95% due to fewer human errors |

    | Cost of poor quality (COPQ) | Lower rework and scrap due to AI decision-making
    accuracy | $400,000 annual savings (as previously quantified under quality improvements)
    |

    | Process sigma level | Shift from ~4σ to ~4.8σ-5σ across key processes | Improved
    process capability index (Cpk) > 1.67 |

    | Cycle time reduction | Automation decreases manual processing steps | ~25-30%
    cycle time reduction across automated workflows |


    Table 10.11 – Example calculation (Six Sigma metrics)'
  merge: -1
  img_proc: true
