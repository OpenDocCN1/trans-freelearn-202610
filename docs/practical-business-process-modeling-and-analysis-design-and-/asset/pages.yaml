- pgno: 64
  md: '# By accident


    As challenging as it may be to accept such a scenario as a possibility, there
    are situations when DTX

    efforts start by accident and continue moving forward in an uncontrolled fashion.
    How is that possible,

    you may ask? Well, I sometimes wonder about the impact of serendipity on DTX as
    well, but I can

    certainly attest from my professional experience, having been part of such a program
    myself, that

    such scenarios do happen and, in some situations, can lead to spectacular outcomes.
    There are usually

    a few factors that are needed to tip the scale or to tempt the proverbial fate,
    so to speak. Still, it all

    usually starts with a use case, a set of requirements addressing some very severe
    pain points in the

    organization, a working culture that favors experimentation, healthy and supportive
    team dynamics,

    and one or two change agents who are relentless about challenging the status quo.
    While the culture

    of heroes in the business usually carries some stigma attached to it, the culture
    of challengers, the

    so-called revolutionaries, can support accidental triggers of DTX.


    In 2005, working as part of the e-commerce team at Prescription Solutions, the
    pharmacy benefits

    management company, I was assigned to work on a project implementing experimental
    technology

    intended to optimize the operations of a high-volume call center. This team was
    constituted of two

    vendor companies and two .NET developers, one of them being me. At that time in
    my career, I was

    keeping my eyes open to new technologies, wanting to extend my Microsoft web and
    development

    skills with an additional skillset. Working on the team with Pegasystems and Cognizant
    consultants

    opened my eyes to a brand-new world of digital process automation, which both
    excited me and set

    my career in an unexpected direction.


    Fast-forward six years, our six-month project in Southern California created the
    small wave that created

    another wave that fed into another wave, ultimately leading to the enterprise-wide
    transformation

    of UnitedHealth Group with the use of the BPMS platform and related know-how.
    This was one

    of the most enormous process-led digital transformations in the world, creating
    multiple new

    job opportunities within the company, great learning projects, lots of excitement,
    and a few very

    innovative projects that gained attention from outside of the company. At the
    same time, the scale of

    this transformation created several headwinds related to the overall cost, technical
    and operational

    scalability, and challenging promotion paths for insiders involved in these efforts.
    You see, despite

    helping to release a force that digitized many parts of the organization, ultimately
    resulting in multi-

    million dollar returns on investment, many program participants did not win career-wise.
    As the

    news of the successful transformation started to do the rounds within the enterprise,
    pulling other

    business units and segments into the wave of business process management, organizational
    politics

    started to play a more prominent role, outshining true results.'
