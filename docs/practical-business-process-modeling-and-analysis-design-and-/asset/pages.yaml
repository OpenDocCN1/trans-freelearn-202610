- pgno: 139
  md: 'Project after project has proven that the **return on investment (ROI)** equation
    will take a hit if you hire process transformation and automation experts from
    large, global consulting companies versus reskilling your workforce that can be
    tapped within your organization with some consulting assistance. The hybrid approach,
    which initially hires consultants to jumpstart the project while simultaneously
    training internal staff, offered the best of both worlds.


    The **citizen developer** movement, which exploded not so long ago, benefits from
    a new generation of tooling that is simpler to use, quicker to deliver results,
    and taps into underutilized software delivery resources that, until recently,
    were not even considered. Citizen developer programs can provide massive results;
    however, they are not easy to launch as they require an unconventional delivery
    approach and changes to compliance models governed by IT. The big elephant in
    the room is that IT organizations are unwilling to give up their power to masses
    of DTX change champions delivering digitized processes without IT’s involvement.
    Creating cohesive business process ecosystems in this model also requires a specialized
    and innovative design, project, and change management approach.


    The citizen developer movement is also much more empowering to the existing workforce,
    increasing work satisfaction and fixing pain points that have finally been properly
    diagnosed. No more lost in translation requirements caused by issues explaining
    and describing business issues to multiple teams of business architects.


    Democratization of digitization technologies directly connects the issue with
    the solution, shortening the time to solve and the time to realize business benefits.
    This approach requires an entirely new work method as many companies are still
    used to source requirements through multiple teams, tools, methodologies, and
    software factories.


    The citizen developer movement also unleashed a wave of direct innovation, offering
    more gender equality on teams historically dominated by men. When I led the citizen
    developer program at Nordstrom in Seattle, over the 2+ years period, 95% of citizen
    developers who worked with our team were females attempting to solve business
    pain points with the help of low code, nicely counterbalancing male-dominated
    engineering teams. Many of our citizen developers used the experience gained on
    the program to springboard into other parts of technology, such as data science.
    When asked about their motivation, they cited positive experiences with low code
    as a motivating force pushing them toward bigger and bolder aspirations in the
    world of technology historically dominated by men. While I would not consider
    my two years of casual observations as a scientific study, the number of women
    citizen developers designing and launching low-code solutions made me think about
    the positive impact of such technologies on diversity in the tech field. There
    are no public studies I know of on the effects of low code on workplace diversity.


    The experience on a program involving 60+ citizen developers at Nordstrom in Seattle,
    WA, between 2016 and 2020 confirmed that by reducing the reliance on traditional
    engineering teams, the low-code platform allowed a broader range of perspectives
    and voices and improved the ROI of our work automation program, delivering quicker
    results and improving workforce diversity.'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# # Embracing the strategy of continuous learning


    As with any skill set, specific skills will offer higher premium value while changing
    more frequently, and other skills will not require frequent updates. Fundamental
    business analysis and process architecture, project management body of knowledge
    (PMBOK), or change management body of knowledge (CMBOK) curriculum does not advance
    as drastically as advances and revisions in AI, low code, and the cloud curriculum.


    With that information on hand, you can plan on how to build your core skills,
    then supplement them with technical courses, starting with generic and then diving
    into specialized as your career and interests develop. Building out your core
    skills will serve as your defense against major technological breakthroughs, which
    will always demand a bit of learning. One constant thing in the world of technology
    is the pace of change, which requires regular upskilling to stay on top of current
    and relevant trends.


    Given the exponential, convergent, and disruptive nature of technological trends,
    staying relevant and competitive in the world of BPM and DTX requires a constant
    and proactive effort of learning and adaptation. However, learning is not a one-time
    event or a static state but rather a dynamic and ongoing process that involves
    acquiring, applying, and updating knowledge and skills. Moreover, learning is
    not only an individual endeavor but also a collective and collaborative activity
    that involves interacting with other people and sources of information.


    Therefore, we propose a continuous learning strategy consisting of four main elements—curiosity,
    exploration, feedback, and reflection—as shown in the following figure and described
    in the list that follows:


    ![](img/a4c90ee3d142c33743706d37c65779c2_140_0.png)


    Figure 4.5 – The continuous learning framework'
