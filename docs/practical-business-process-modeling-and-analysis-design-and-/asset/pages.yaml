    # # DTX as an evolution versus revolution


    To be more precise, DTX is one of those constantly evolving concepts that’s changing
    as the software industry introduces new technical capabilities, allowing you to
    digitize and automate additional types of work that historically might have been
    out of reach. So, the metaphorical elephant from John Godfrey Saxe’s fable, over
    time, can transform into a woolly mammoth or even a titanosaur, the largest dinosaur
    that ever roamed Earth. How many blind men would it take to describe what a titanosaur
    is as the DTX scope continues to grow over time, in 2-3 years? I think you will
    get the point – discussing DtC is a lot easier than tackling the whole topic of
    DTX.'
