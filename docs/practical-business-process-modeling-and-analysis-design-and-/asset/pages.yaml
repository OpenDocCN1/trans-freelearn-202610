    becoming more relevant

    while others become obsolete. In response, companies are creating new job roles
    and eliminating

    those that are no longer needed.


    During major transformation initiatives, HR professionals play a crucial role
    in helping employees

    transition into new positions. Mary Claude Milot, a former chief transformation
    officer at Dairygold

    in Seattle, mentioned that HR teams aim to assist valuable employees in reskilling
    during times of

    business transformation. This strategy benefits the organization, as it is more
    advantageous to invest

    in existing employees and leverage learning and development teams rather than
    seeking new hires

    with the required skill sets.


    When Dairygold implemented its Oracle-based process modernization, this 1,300-person
    company

    in the Pacific Northwest adopted a learning-oriented approach. They integrated
    training into new

    business processes, which had the added benefit of mitigating turnover during
    the Great Resignation.

    The company experienced significant staff losses during this period, and its learning
    management

    system and standard operating procedures were not updated in time to retain critical
    knowledge

    from departing employees.


    Consider Dairygold’s example in the context of your own workplace. Reflect on
    the turnover rates you

    observe and the expertise leaving your team each month due to reorganization,
    attrition, promotions,

    or other factors causing employees to change roles.'
