- pgno: 60
  md: '# # Top-down transformation


    Top-down transformations have been mastered by software vendors who usually pursue
    monetization of opportunities from the sale of software licenses. This style of
    transformation involves an executive leader stepping up to announce the massive
    effort to redesign business processes at a large scale in the organization. Many
    times, the vision and know-how behind the plans come from software vendors who
    aggressively pursue their own agendas by introducing digitization platforms. While,
    on the surface, this style seems the least risky due to the centralized level
    of control, this style of transformation is the least enjoyable to employees and
    does not get into all corners of your company’s operations.


    The vision, the know-how, and any specialized knowledge required to drive the
    adoption of the vendor’s software comes directly from the vendor, putting workers
    at a significant disadvantage when they start realizing the need to complete work
    with external delivery providers or consultants who very quickly establish themselves
    as the go-to people for business knowledge. The organization’s politics also tends
    to get a lot messier, with vendors starting to get a lot of face time with your
    executives, talking the talk but not genuinely understanding all the intricate
    details of your business.


    The messaging from your leaders tends to be solid and consistent, yet the results
    promised by vendors don’t always match the realities of sales PowerPoint decks
    you’ve seen at the beginning of the project. Top-level execs tend to be convinced
    that such challenges are only temporary while their business decision and leadership
    reputation is at stake. The other challenge with this transformation style is
    related to sponsorship from a single leader. If the top leader leaves the organization
    or the company is acquired, transformation efforts will stall or stop completely.


    | Pros | Cons |

    | --- | --- |

    | • Clear vision and messaging driven from the top of the company • Internal program
    prioritization tends to be easier • Transformation investments have a long-term
    horizon | • Tend to be costlier and more challenging to realize the promised ROI
    • Put software-delivering tools in the driving seat • Less collaborative • Higher
    risk of job loss for employees |


    Table 2.1 – Advantages and disadvantages of a top-down transformation


    While top-down transformations emphasize centralized control and strategic vision,
    grassroots transformations rely on empowering individuals across the organization
    to drive change from within.


    # # Grassroot transformation


    This transformation style is most often associated with the citizen developer
    style of digital change programs. Companies sponsor citizen developers, bringing
    their ideas to DPA Centers of Excellence (COEs). DPA COEs, through a portfolio
    of expert services, including ideation and project pipeline'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'creation, enablement, process landscape assessment, solution consulting, risk
    management, ROI analysis, standards definition, and governance, support the roll
    out of these distributed initiatives all the way to their go-live. The role of
    the DPA COE or multiple COEs is to become the team that supports other groups
    with quick and timely services, unblocking **citizen developers (cit-devs)** on
    their journeys. While the COE is ultimately accountable for the overall DTC, and
    its funding depends on strategies and the quality of services provided year after
    year, the actual analysis and delivery work is performed by citizen developers
    and citizen architects. If your transformation initiative is led by the IT department,
    your company might establish a **Center for Enablement (C4E)**, which offers a
    limited set of services compared to a **Center of Excellence (COE)**. C4Es focus
    on promoting collaboration, reusability, and the sharing of reusable patterns.
    The main difference between COEs and C4Es lies in their functions: COEs provide
    expert-driven governance to ensure quality and compliance, while C4Es aim to empower
    teams and enable faster innovation and collaboration. In some cases, COEs may
    extend their mission to include functions typically associated with C4Es. However,
    it is rare for C4Es to expand their roles to encompass the full mission of a COE.


    In the early stages of grassroots DTC, citizen developers’ work may be described
    as shadow IT if not given enough recognition by company leaders. Don’t get discouraged,
    as this is just a sign of the lack of maturity of the company’s DTC strategy.
    Many companies successfully transformed their shadow IT programs into VP-accepted
    citizen developer adoption of digital process automation technologies, turning
    small improvement opportunities into large and successful projects. If your initiatives
    are not getting enough leadership attention, don’t give up. This book provides
    you with several techniques intended to help you succeed. While these types of
    programs can be the most challenging to launch, they offer the deepest penetration
    of DPA technologies and address the most demanding challenges faced by your organization.
    Frequently, pain points uncovered by cit devs don’t even get recognized by company
    leaders who prioritize their initiatives at the highest level, never getting into
    the weeds. The power of identifying and solving problems by people who live them
    every day can be mighty.


    | Pros | Cons |

    | --- | --- |

    | • Stronger and easier to prove adoption ROI • Transformation gets into all corners
    of the company • Bottom-up prioritization surfaces true business pain points |
    • Requires a significant level of investment in self-enablement and training •
    Requires familiarity with the COE operating model, which may be harder to operationalize
    without prior experience • Easier barrier to entry cost-wise, higher barrier to
    entry skillset-wise • Securing funding and resources to build can be a challenging
    and tedious process |


    Table 2-2 – Advantages and disadvantages of a grassroot transformation'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'While grassroots transformation delves deeply into organizational engagement
    and cultural shifts, legacy modernization efforts focus on the structural backbone
    of critical systems, presenting a contrasting approach to driving change.


    # # Legacy modernization efforts


    This less common but still popular trigger of DTX comes to life as the outcome
    of a decision to either replace or integrate with a major system of records, such
    as EPR, CRM, claims processing engines, or SAP. These types of systems tend to
    be harder to replace due to their business criticality and the complexity of the
    volume of business processes they support. Complete system replacement, while
    feasible in technical terms, assuming unlimited resources, tends to be both risky
    and very costly.


    | Pros | Cons |

    |---|---|

    | • More clarity about transformation objectives • Possibility to reuse already
    implemented business processes and established practices • High ROI | • Treated
    more as a project than a true business transformation program • Has a lot less
    impact on the transformation culture • Programs carry high business risk due to
    the criticality of these systems |


    Table 2.3 – Advantages and disadvantages of a legacy modernization transformation


    While legacy modernization focuses on revitalizing existing critical systems,
    acquisitions or mergers introduce a dynamic interplay of integration challenges
    and opportunities.


    # # Triggered by an acquisition or merger


    This type of DTX usually involves two companies: one acquiring and one being the
    acquisition target. In this situation, there is typically a bit of time allowed
    to prepare the execution as the business side of planning and negotiation does
    take ample time, creating enough signals about what’s to come a long time in advance.
    The business and technology teams of the acquiring company can focus on getting
    the complete inventory of their business processes with a thorough understanding
    of the technical capabilities of existing platforms.


    Taking on new business models and additional volumes of work to support the populations
    of new customers will more than likely put significant stress on your technology,
    forcing leaders to reconsider or, in some cases, even accelerate any process redesign
    plans that have been put on the back burner for months. To be successful and land
    the strategic business objectives that drove the acquisition, companies need to
    launch several very critical projects, driving the need for the tight integration
    of the business processes of both companies. Most of the time, the acquiring company
    will have a deciding voice in how such process integrations will proceed. One
    of the mistakes that can be made at this stage has'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'to do with the perception that the acquiring company’s business processes should
    completely replace

    the processes of the target company. This type of thinking may prevent the acquiring
    company from

    harvesting and learning about innovative business processes that drove business
    in segments of the

    market that were not accessible to the acquiring company. In other words, it’s
    prudent to plan for a

    thorough analysis of existing business processes before making decisions about
    what processes should

    stay, get extended, integrated, simplified, or discarded.


    If the acquiring company can quickly get access to an understanding of business
    processes driving the

    target, integration decisions become a lot easier. It’s also worth noting that
    many mergers or acquisitions

    approach such projects as system integrations of existing technologies, further
    complicating and

    delaying the business benefits of the integration.


    Integrating systems versus integrating business processes can sound like the same
    type of activity, but

    it’s not – the work is usually driven at a different layer of the enterprise architecture,
    and the types of

    decisions and issues that come to the forefront are different. Many people, though,
    still confuse these

    two styles of integration. I suggest taking the process-first approach, and this
    is an area where process

    mining can genuinely shine, given the scale, complexity, and pace of parallel
    workstreams that unfold.

    In some large-scale integrations, the pace of the change forces both companies
    to start from scratch

    entirely and to build new processes, but these types of primary new legislation-driven
    use cases are

    still not very common (i.e., in the healthcare industry, the occasional and frequent
    legislative change

    forces companies to reinvent themselves quickly). Most acquisitions involve integrations
    with large-

    scale legacy systems, which cannot be dropped without a significant impact on
    business operations

    (aka the loss of business).


    Another variant of such a scenario involves a situation in which an acquisition
    or a merger stops the

    ongoing DTX, which can be very frustrating if you’ve been incubating and building
    internal support for

    your program over an extended period. These scenarios do happen, and they happen
    more frequently

    than one would hope for. In these scenarios, companies throw away hard-earned
    insights and reusable

    IP only because the acquiring company assumed their processes were better.


    | Pros | Cons |

    |---|---|

    | • Can be executed with advanced planning • Significant focus on execution eases
    portfolio prioritization conflicts • Opportunity to harness the intellectual property
    of both companies | • Usually stops ongoing transformation initiatives at the
    acquired company • Involves more external consultants • Exposes blind corners
    in the existing process architecture and compounds existing technology issues
    |


    Table 2.4 – Advantages and disadvantages of a transformation triggered by acquisition


    While acquisitions often come with structured planning, transformations initiated
    by accident highlight

    the unpredictable yet impactful nature of serendipity in driving change.'
