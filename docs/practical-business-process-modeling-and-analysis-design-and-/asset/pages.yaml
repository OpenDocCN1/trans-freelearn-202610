    Figure 7.3 – An excerpt from a table summarizing the results of tool tests performed
    by the BPMN MIWG


    The purpose of the BPMN is to provide a common language for stakeholders interested
    in the process. In the specification document, the authors state that their goal
    was to create a notation that would be a _common language_ for various groups
    of users: business analysts, developers, and business users, both in terms of
    designing a process and automating it. They wanted to simplify communication between
    various process stakeholders: people running the process, implementers, customers
    and suppliers. To do so, they aimed to create a standard notation based on other
    already-existing notations and using their tried and tested elements.


    This is a rather bold assumption, because on the one hand, it should support business
    users who are interested in creating easy-to-read diagrams, and on the other,
    it should enable one of the notation’s goals, which is to allow any diagram to
    potentially serve as a basis for preparing process automation.


    The solution proposed by the specification is the concept of compliance levels
    (inspired by Bruce Silver’s method of teaching BPMN), which divides the elements
    of the notation into three groups. The first group consists of the most basic
    elements for documenting processes at the **descriptive level**. Diagrams using
    these elements are not much more complicated than flowcharts, but they ensure
    the transmission of information in a clear and standardized way.


    The second group includes elements that go beyond what users of flowcharts may
    be used to – they allow the creation of more sophisticated models, aimed more
    often at an audience interested in analyzing processes for automation. These elements
    belong to the **analytical level** of BPMN.


    The last group is generally made up of the most advanced elements, which are intended
    to automate processes, although nothing prevents you from using them for documentation
    and analytical purposes.'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'We will learn much more about elements of the BPMN notation in the following
    chapters (there, you will see more object types described, as well as information
    about the categories used in BPMN), but for the purpose of comparing it with other
    notations, we will start by reviewing the basic elements, which will be used in
    our example diagram. Please note that BPMN diagrams are usually drawn horizontally,
    but I am using a vertical representation to make it consistent with previous examples.


    | Modeling concepts | Shape and name | Description |

    |---|---|---|

    | Start of the process diagram | Start event | The first element of a process
    diagram representing an event that starts a process. Please note that all events
    are circles, but each type has a distinct look. |

    | End of a process diagram | End event | The last element of a process diagram
    representing that an event is the result of a process. Please note that all events
    are circles, but each type has a distinct look. |

    | Process split | Gateway | Split of a process into multiple outcomes. Please
    note that in BPMN, several types of gateways are possible with different icons
    inside. A diamond without an icon inside represents the most common type: exclusive
    gateway. |

    | Process step (simple) | Task | A simple process step representing some work
    to be done in a process. Please note that both tasks and subprocesses are shown
    as rectangles, but each type has a distinct look. |

    | Process step (complex) | Subprocess | A more complex step of a process, which
    can have several sub-steps – often shown in a separate diagram. Please note that
    both tasks and subprocess are shown as rectangles, but each type has a distinct
    look. |


    Table 7.4 – Basic shapes of BPMN'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'Apart from the basic shapes of BPMN, which represent the most important modeling
    concepts, there are, of course, more which will be covered in depth in _Chapters
    8_ and _9_. In the following table, you can see two more shapes, which you will
    see in the following figure.


    | Non-standard modeling concepts | Shape and name | Description |

    |---|---|---|

    | Data | Data object ![图片] | Data used in a process (also serving as an input
    or an output for the process) |

    | Storage/IT system | Data store ![图片] | Permanent storage of data in a form such
    as a cabinet or IT system |


    Table 7.5 – More advanced shapes of BPMN (selected)


    As you can see, there are many similarities between BPMN and previous notations.
    Now, let’s take a look at the complaint process modeled in BPMN.'
  merge: -1
  img_proc: true
