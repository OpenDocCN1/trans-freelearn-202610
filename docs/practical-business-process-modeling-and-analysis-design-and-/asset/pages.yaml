- pgno: 214
  md: '# Process Modeling Notations


    As you can see, BPMN took many of the proven methods introduced by other notations
    and extended

    them, so that the following apply:


    +   • Start and end events are both represented as circles but can easily be distinguished
    from one

    +   another based on the border thickness.


    +   • You read a process diagram by following an arrow called a sequence flow
    drawn with a solid

    +   line (we will cover additional types of flows in the following chapters).


    +   • Process steps (also known as activities) are rectangles with rounded edges.
    Those that do not

    +   need to be decomposed are called tasks, and those that are more complex (usually
    marked with

    +   a “+” icon) are called sub-processes.


    +   • Places where a process diagram splits are called gateways, and they follow
    the common shape

    +   of a diamond.


    +   • You can easily see who does what because elements of the BPMN diagram are
    placed inside

    +   pools and lanes representing process participants (e.g., companies) and more
    detailed logical

    +   divisions of those participants (e.g., departments or teams).


    Therefore, if you have already modeled a process using other notations, chances
    are that you will be

    able to read BPMN diagrams pretty easily.


    However, BPMN offers you many more options in comparison with other notations.
    There are also

    pitfalls – places where shapes and parts of models may look familiar, but in BPMN,
    they have a slightly

    different meaning.


    That’s why in the following chapter, we will dive deeper into BPMN and learn how
    to use it properly

    – beginning from the basics.


    # Summary


    In this chapter, you learned about different ways of modeling processes and how
    to read process

    diagrams. You saw how BPMN uses proven approaches from other notations and how
    it differs from

    those notations so that you can easily grasp visual differences in diagrams.


    In the next chapter, we will learn more about the things that you need to know
    about BPMN to use

    it in practice.'
  merge: -1
  img_proc: true
- pgno: 215
  md: '# # Further reading


    If you want to learn more about the modeling notations covered in this chapter
    (and more), I suggest you check out the following books and resources:


    +   - If you would like to learn more about the history of BPMN and its relationship
    with other standards, such as XPDL, I would recommend a very interesting free
    paper, _Business Process Model and Notation—BPMN_, by Mark von Rosing, Stephen
    White, Fred Cummins, and Henk de Man, available at `https://www.omg.org/news/whitepapers/Business_
    Process_Model_and_Notation.pdf`. You can also read the full book, _The Complete
    Business Process Handbook: Body of Knowledge from Process Modeling to BPM, Volume
    1_, by Mark von Rosing, Henrik von Scheel, and August-Wilhelm Scheer.


    +   - If UML is something you would like to explore further, I would suggest checking
    out this resource from my go-to expert in UML Filip Stachecki. Visit `https://www.uml-diagrams.org/`
    for a great overview of what UML has to offer.


    +   - If you prefer learning from books, on `https://modeling-languages.com/list-
    uml-books/`, you will find a list of many great titles. This website offers many
    useful resources about UML modeling (and more) as well.


    +   - Finally, I would recommend `https://agilemodeling.com/` by Scott Ambler.


    +   - For more resources, visit the GitHub repository for this book: `https://github.com/
    PacktPublishing/Practical-Business-Process-Modeling-and-Analysis/ tree/main/Chapter07`.
    You will also find information about notations such as VSM or UPN that we did
