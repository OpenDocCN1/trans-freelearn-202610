  md: '# # Contributors


    # ## About the authors


    **Jim Sinur** is an independent thought leader in applying **digital business
    platforms (DBPs), customer experience/journeys (CEJM), business process management
    (BPM), automation (RPA), low-code, advanced data management, and decision management**
    at the edge applied to business outcomes. His research and areas of personal experience
    focus on automation and customer excellence, intelligent business processes, business
    modeling, business process management technologies, process collaboration for
    knowledge workers, process intelligence/optimization, data management, AI, IoT,
    and leveraging business applications in processes. Jim is also one of the authors
    of _BPM: The Next Wave_.


    _I want to thank all the customers and vendors I have had the pleasure of interacting
    with during my tenure at Gartner. Solving business processes and customer experience
    challenges together was a privilege._


    **Zbigniew Misiak** is a BPM consultant with over 15 years of experience. He is
    currently employed at BOC Group as a senior consultant and helps customers introduce
    BPM as a management method and ADONIS as a process management tool. He is also
    a member of several Object Management Group Task Forces and the BPMN Model Interchange
    Working Group. Zbigniew is also a BPM trainer, both at BOC and on Udemy, where
    his courses about process modeling with BPMN help thousands of students worldwide.
    He runs a blog called _BPM Tips_.


    _I would like to thank my wife, Kasia, and daughter, Ewa, for their support, motivation,
    and feedback for the chapters I wrote._


    BJ and Jim, writing this book with you was an honor! Thank you! A huge shoutout
    to Pedro for the Foreword.


    Special thanks to the people who helped shape this book by reading my chapters
    and providing valuable contributions: Tony Benedict, Roger Burlton, Denis Gagné,
    Harald Kühn, Madison Lundquist, Serge Schiltz, Filip Stachecki, Roger Tregear,
    and Roland Woldt. Thank you very much for finding errors, suggesting improvements,
    answering my questions, and sharing your expertise!


    This book is a summary of what I learned about process management and modeling
    as a consultant, trainer, and blogger.'
