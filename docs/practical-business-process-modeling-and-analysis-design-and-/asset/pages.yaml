  img_proc: true
- pgno: 149
  md: '# # Business Process 101


    Business processes are key to value creation within any kind of organization.
    People often think about these processes only in terms of the series of steps
    that need to be taken. However, to reap the benefits of process thinking, you
    need to have a broader view of your processes. You need to understand the whole
    ecosystem of a process – other processes influencing your process and the ones
    influenced by it, but also supporting and governance processes, providing resources
    and guidance for your process. Without this broader view, it is very difficult
    to really understand a process and nearly impossible to implement meaningful improvement
    with long-term benefit.


    In order to manage a process, we need to document it somehow. Using textual descriptions
    of a process is not sufficient, so usually, graphical models are used as the main
    way of modeling a process. Modeling can be useful for various purposes. All those
    purposes (known as **modeling scenarios**) have some specific requirements that
    influence what we will document about a process and how much detail we will need.
    Process models can be created in various tools and in different ways – this chapter
    will show the most important ones. We will also briefly mention how process models
    can be used.


    In this chapter, we’re going to cover the following main topics:


    +   - Processes as a driver of value creation

    +   - Leveraging a broader process perspective for improvement and digital transformation

    +   - What is your scenario and why does it matter?

    +   - What do you need to know about your process?

    +   - Tools, people, and methods to create a process model and ways to use it


    > > **Note**

    > > This chapter is authored by Zbigniew Misiak.'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# # Key concepts in process thinking


    In Chapter 3, _The Wheel of BPM Driving Your Competitive Advantage_, and Chapter
    4, _Long-Term Trends and the Impact on Your Job_, you already had a chance to
    learn a little bit about the history of **business process management (BPM)**,
    see some key definitions (such as what BPM and a business process are), and understand
    a few important concepts of process management, such as the role of business processes
    and the importance of thinking about BPM activities as a cycle and not as a one-time
    activity.


    In this chapter, we will revisit some basics of process thinking to give you a
    chance to deepen your understanding, as well as suggesting additional readings
    and resources. Since many of my students often ask me for recommended books and
    additional materials, these will be provided in _Chapters 5 to 9_.


    BPM is a discipline with a long history. Not surprisingly, there are also many
    competing definitions of the key concepts (as was mentioned by BJ in previous
    chapters). Since there is no single body governing all things related to BPM worldwide,
    you can search for inspiration from many sources and pick the definition that
    works best for you and your organization.


    Here is a quote from the **Association of Business Process Management Professionals
    International (ABPMP®)**, which is one of the most authoritative organizations
    when it comes to BPM. ABPMP (https://www.abmp.org) is a global, non-profit professional
    association dedicated to BPM. It maintains a global standard for BPM practices
    and offers widely recognized certification. As of 2025, ABPMP has over 17,000
    members representing over 750 corporations and has 56 chapters worldwide.


    In its guide to the **Business Process Management Common Body Of Knowledge (BPM
    CBOK®)**, ABPMP uses the following definition:


    > "Business Process Management (BPM) is a disciplined approach to identify, design,
    execute, document, measure, monitor, and control both automated and non-automated
    business processes to achieve consistent, targeted results aligned with an organization’s
    strategic goals."


    > BPM involves the deliberate, collaborative and increasingly technology-aided
    definition, improvement, innovation, and management of end-to-end business processes
    that drive business results, create value, and enable an organization to meet
    its business objectives with more agility.


    > BPM enables an enterprise to align its business processes to its business strategy,
    leading to effective overall company performance through improvements of specific
    work activities either within a specific department, across the enterprise, or
    between organizations."


    You can learn more about the guide to BPM CMOK here: https://www.abmp.org/page/
    guide_BPM_CBOK.'
  merge: -1
  img_proc: true
- pgno: 151
  md: "> Note\n> \n> The body of knowledge needed for effective process management\
    \ (especially for high-impact processes) is comprehensive and covers many aspects\
    \ apart from process modeling and the usage of the models (which are the focus\
    \ of this book). If you would like to learn more about aspects such as process\
    \ governance, monitoring, and change management, as well as see other definitions\
    \ of BPM from reputable sources, see the resources for this chapter at `https://\
    \ github.com/PacktPublishing/Practical-Business-Process-Modeling- and-Analysis/tree/main/Chapter05`.\n\
    \nAs you can see, the definition from ABPMP shares a lot of similar ideas with\
    \ the definition used in Chapter 3. In the following section, we will cover those\
    \ important ideas one by one to give you a better understanding of the key concepts\
    \ in process thinking. We will start with the concept of **value creation**, since\
    \ it helps with understanding many other things in process management.\n\n# #\
    \ Processes as a driver of value creation\n\nThe definitions of BPM and business\
    \ processes that we have covered so far mention the extremely important concept\
    \ of value creation. Business processes represent some work that needs to be done.\
    \ However, we are not expecting simply for work to be done and then **output**\
    \ to be ready. Our ambition is to generate **outcomes** that help the organization\
    \ achieve its goals.\n\nThis shows a clear relationship between strategy and processes.\
    \ Processes should make the strategic vision become a reality in the everyday\
    \ work of an organization. The business processes should be designed and executed\
    \ in a way that is consistent with the organization’s **value proposition**.\n\
    \nThe results of the process should be valuable for the customers (either external\
    \ or internal). If it is a customer-facing end-to-end process, by starting with\
    \ a need of a customer and finishing with a result that satisfies this need, it\
    \ is easier to see what the value creation looks like.\n\nOf course, a good process\
    \ allows us to offer a product or service that a customer is willing to pay for,\
    \ so the value flows both ways. There are also many important processes that are\
    \ not visible to a customer. They support the value creation less directly, for\
    \ example, by providing necessary resources and guidelines for the customer-facing\
    \ processes and the whole organization.\n\nThe situation is a bit more complex,\
    \ for example, in the public sector (or for non-profits), where people who benefit\
    \ from the services may not be the ones who pay for them directly, but the idea\
    \ is the same: the organization needs to create value for someone to endure and\
    \ prosper. The same type of thinking can also be applied to processes that are\
    \ serving internal customers: only if we create value for the customer and the\
    \ organization does the process make sense."
  merge: -1
  img_proc: true
- pgno: 152
  md: 'As you can see, processes are very important for organizations that want to
    create value. Viewing an organization through the lens of processes helps to understand
    how work is done much better than using simply the perspective of organizational
    structure. However, there are even more aspects that we need to be aware of when
    it comes to processes. We will discuss this broader ecosystem of processes in
    the next section.


    # # Leveraging a broader process perspective for improvement and digital transformation


    In the previous section, we covered the concept of value in process management.
    Now, let’s see how to make sure that the value is created. To create products
    and/or services of value, work needs to be performed by people with the necessary
    knowledge and skills. Those people need to use various resources, such as IT systems
    or equipment, and the necessary information to get the work done.


    Since processes are often complex, it is not sufficient to have people from one
    organizational unit. We need various skills and competencies, so people from many
    teams, departments, or even organizations may be needed. You may also want to
    have a **hybrid workforce**, with people and AI agents collaborating to produce
    the desired outcomes (pretty soon, we may want to add robots to this as well).


    To make sure all those people do their job properly, they need some guidance.
    Needless to say, AI agents need some guidelines as well, so that they can work
    effectively and in a way that is consistent with the values of the organization.


    This guidance needs to cover the whole process and cannot be limited to a separate
    organizational unit (to avoid **silo thinking**). That’s why BPM underlines the
    importance of **cross-functional processes** and having a big-picture view of
    the whole process with all the dependencies.


    Cross-functional value creation is a very important concept in process management.
    A process does not operate in a vacuum; it is not a lonely island. There are many
    other processes that impact how it works. That’s why, in many cases, an improvement
    initiative that only has a single process in scope will at best bring limited
    success and at worst simply move problems to some other process. We need to have
    a broader view of the process that will consider the process as a part of a broader
    ecosystem with all its dependencies.


    Taking this broader view and analyzing processes together helps with identifying
    real causes of problems and coming up with much better ideas for process improvement/automation
    initiatives. We will learn more about the practical aspects of creating this broader
    view of processes in _Chapter 6_, which covers the concept of process architecture.'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'Now, let’s briefly discuss how to create a useful overview (or a so-called
    **helicopter view**) showing

    the context of our process so that we can understand it better without the need
    to create a detailed

    process diagram. Out of several possible approaches, I will mention here two very
    popular techniques

    that will help you get a much better understanding of a process than focusing
    only on the work that

    we plan to do in a single process.


    The first approach is **SIPOC**, which is very popular in **Lean management**.
    SIPOC diagrams describe

    the following aspects:


    +   - **Suppliers**: Organizations or people that provide inputs for the process


    +   - **Inputs**: Things needed by the process to run properly – information,
    documents, materials,

    +   know-how, and so on


    +   - **Process**: (Key) things that need to happen in a process to generate the
    desired results


    +   - **Outputs**: Results of the process (products or services)


    +   - **Customers**: (Internal or external) organizations or people who receive
    the outputs


    The second approach worth mentioning is the **IGOE** method, developed by Roger
    Burlton. IGOE

    considers the following aspects important for the proper understanding of a process:


    +   - **Inputs**: Elements, such as information and materials, needed to perform
    the process, which

    +   are transformed or consumed by the process


    +   - **Guides**: All elements, such as standards, regulations, and knowledge,
    that show us why, when (by

    +   showing which events define the scope of the process), and how our process
    should be performed


    +   - **Outputs**: All the results of the process (products, deliverables, and
    information)


    +   - **Enablers**: All the resources or assets (e.g., people, systems, facilities,
    or equipment) that we

    +   need for our process to run and that are not consumed by it'
  merge: -1
  img_proc: true
- pgno: 154
  md: '![](img/a4c90ee3d142c33743706d37c65779c2_154_0.png)


    Figure 5.1 – Example IGOE diagram (by Roger Burlton)


    What is important here is that IGOE doesn’t just provide a list of elements for
    each of the areas. It also shows you the connections, that is, with other processes.
    That’s why it is also called a **context diagram** or a **scope diagram**. In
    the GitHub repository, you will also find links to two helpful videos about IGOE:
    one from Roger Burlton and Sasha Aganova explaining the concept of IGOE and a
    second from Roger Tregear with an example of IGOE for a “make coffee” process.
    Both are well worth your time!


    If you are wondering why those methods of providing a quick overview of a process
    (and a deeper understanding of it) are important, let’s imagine that we are interested
    in improving the process of handling complaints in a company manufacturing customer
    products (this example will be used from this chapter to Chapter 9).


    If there are problems with the complaint-handling process, perhaps the first idea
    would be to make it faster. While this improvement could make a lot of sense since
    customers will certainly appreciate faster resolution, perhaps it would be worthwhile
    to find the root cause of why the process underperforms and not stop with some
    generic solution.'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'Maybe employees are overloaded with customer complaints due to problems with
    a new delivery company that was chosen due to lower prices, but that sadly does
    not have a good quality of service. Or maybe the problem is with packaging because
    people from the logistics team work in a hurry. Or even worse, maybe the product
    is simply too fragile because of errors in design.


    As you can see, to be able to understand the process and improve it, we very often
    need a lot more information than it might seem at first glance. To cope with this
    amount of knowledge about the process, we need a good description mechanism to
    ensure that we don’t miss anything important. We will cover this in more depth
    in Chapter 6, Establishing Process Architecture. We also need to decide what kind
    of information we need to gather for our purposes. This will be covered in the
    following section.


    # What is your scenario, and why does it matter?


    We already know that processes are an extremely important aspect of any organization’s
    operations and that they are difficult to manage when we are not aware of what
    processes we have at all and how they are interrelated.


    For this, we need business process models. Models provide a simplified representation
    of some aspects of reality (in our case, processes of the organization) in a form
    that helps us understand it more easily. Think of Google Maps, which shows us
    a digital representation of the city that helps us figure out where a location
    we are looking for is.


    However, as the famous saying goes, “The map is not the territory.” Our models
    provide valuable information, but they are not the same as the real objects that
    they represent. Models can also serve different purposes for different people.
    I will be referring to them as process modeling scenarios.


    Some users are interested in basic information, while others need to consider
    many aspects that would be very hard to understand without models. A tourist searching
    for attractions in an unknown city, an architect planning a new skyscraper, a
    utility company worker searching for information about the detailed location of
    a leaky sewage pipe – they all would search for different information with different
    levels of detail that would suit their purpose. It works the same for business
    process models, so there will be different levels of modeling and different levels
    of detail in those models.


    As an example, an overview of all top-level processes (process landscape) would
    be like the map of a whole city, while a detailed diagram of a process would be
    similar to the plan of a specific land lot with information about the pipes, fiber-optic
    cables, and other elements of infrastructure.


    Each organization that decides to model its business processes makes an investment
    of some kind. It requires people, time, and money to create process documentation,
    to use it, and to keep this documentation up to date. Process models as such do
    not create value – they need to support some goals of the organization. The better
    this support is, the more valuable process modeling can be for the organization.'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'Therefore, it is generally a good idea to decide what needs to be done – particularly,
    what kind of process-related work needs to be done – before we start the actual
    work. Otherwise, we may do things that will not be beneficial for the organization,
    and our work could be perceived as a wasted effort, or we may omit some key information.


    Think of providing a super detailed map of a sewage system to a tourist searching
    for the best place to take photos, or forgetting to add information about fiber-optic
    cables and other important infrastructure to a map provided to a utility worker
    who needs to make an excavation to replace a pipe.


    Process models can document the current state of an organization (so-called as-is
    models) or be blueprints of the future state that we are designing (those are
    known as to-be models).


    **As-is and to-be models**


    As-is models document the current state of the organization. They show the baseline
    and allow not only training new employees, facilitating communication, and so
    on but also gathering requirements and ideas for improvement.


    To-be models show the possible future state of the organization. They allow designing
    new ways of working, identifying dependencies and the impact of changes, comparing
    different variants, and picking for implementation the one that is the best for
    the organization.


    Models also help with planning the transformation within an organization, especially
    if there are several stages to reach the desired state. Apart from being used
    for documentation, analysis, knowledge, and change management, process models
    can also be used, for example, for process automation. Models are great for improving
    communication and building a shared understanding of complex situations with many
    interdependencies and several teams involved. This can help you a lot in automation
    cases, such as implementing a new IT system that will support a process, preparing
    **robotic process automation (RPA)** bots that will take over some repetitive
    tasks from your employees, or maybe designing a new version of a process using
    AI tools and agents.


    However, not all models are equally useful. We need to find the sweet spot between
    too little and too much information, so that they present useful content in a
    proper form to the intended audience. Our models must correctly describe reality
    (using some commonly agreed method), even though they are a simplification of
    it. This means, for example, that a good model should not miss key process steps.
    Finally, competent recipients should be able to read the model correctly without
    explanation from the model’s author. For this, it helps a lot to establish some
    common language within the organization and use modeling standards.


    Since many processes are getting more and more complex (e.g., due to regulatory
    requirements), the need for process models increases, especially when we are preparing
    some change in the organization and want to avoid errors caused by overlooking
    some important aspect, for example, focusing only on the costs of process steps
    and ignoring customer experience and compliance aspects.'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'With such a piecemeal view, there is a risk that a modification that seems
    to make a lot of sense from one team’s point of view will result in a lot more
    work for other teams and worse results for the process. It may also happen that
    the new process will be effective and efficient from the organization’s point
    of view but will not meet the needs of customers or not comply with laws or regulations.


    Of course, models as communication tools can have different target audiences.
    Models documenting the processes can be aimed at new employees to help them settle
    into the organization, so that they can acquire the knowledge needed faster and
    avoid rookie mistakes. They can also be helpful for current employees and serve
    as procedures to remind them of the best way to work, or as a tool for planning
    changes in the organization. Models can help us improve processes or automate
    them. They can also be created for the organization’s partners, to whom we need
    to explain our way of doing things, or for regulators, for whom the documentation
    will be proof of our compliance with regulations.


    Each of those process modeling scenarios has requirements regarding the level
    of detail and attributes (documenting information about various aspects) of a
    process that are needed. In the next section, we will see a few examples of what
    it could look like in practice and how to create a method that will help create
    models according to a common standard used in an organization.


    # ## Understanding the process – modeling method and level of detail


    If the model is to serve as a tool for communicating with others, it should contain
    information that is relevant to the recipient in a form that will allow the recipient
    to use it. But what kind of information should we cover? Isn’t it enough to describe
    the steps of the process?


    Just as in good journalism, in process modeling, we can say that the model should
    present information according to the **5W1H model**, also known as the **Kipling
    method** (**5W1H** stands for **who, what, when, where, why, and how**).


    Based on many discussions with customers and training participants regarding the
    information they want to have in their models, I have compiled the following list
    (based on 5W1H) to serve as an inspiration for you:


    +   - **Who** is responsible for performing the process steps? Who is the process
    owner?


    +   - **What** is processed in the process (products, documents, or data)?


    +   - **When** do things happen in a process? What has to happen for the process
    to start? Is something supposed to happen in the process at certain times or circumstances?
    When does the process end?


    +   - **Where** in physical locations or information systems does the process
    take place (e.g., in a CRM system)?


    +   - **Why** do we perform this process at all? What value does it create?'
  merge: -1
  img_proc: true
- pgno: 158
  md: '+   • How does the work inside the process look? What needs to be done? Are
    there more complex elements? How many steps does the process have? What are the
    dependencies between the elements of the model? For example, what are the possible
    paths of execution of the process? What exactly is to happen within the individual
    steps of the process? How is the work performed? What guidelines should be followed?


    Of course, this list is just an inspiration. For some modeling scenarios, you
    may need less information, and for others, much more. This depends heavily on
    the people who will be using your process models.


    Typical target audiences for your models, or stakeholders for your process-related
    initiative, could be directors of a process and project management departments,
    project managers of an ERP implementation project, business analysts involved
    in an RPA initiative, software engineers, programmers, quality management specialists,
    process improvement experts, or risk management specialists. Of course, employees
    who may need information on how to perform the processes should hopefully be interested
    in the process documentation! Each of these people may have their own expectations,
    based on how they want to use the process models.


    To prevent everyone from creating process models that meet only their needs and
    the needs of their coworkers, it is helpful to create common guidelines, serving
    as a style guide, including, among other things, a list of topics that should
    be included in the models.


    Such a standard set of topics will help the team create consistent process models
    (even if there are many process analysts/modelers), compare them with each other,
    and analyze the models with ease. The models, in this way, can serve as a common
    language across the organization, making it easier to communicate, avoid doing
    the same work over and over again, and achieve the desired results faster.


    The following is an overview of common process modeling scenarios with information
    on what each scenario looks like in practice:


    +   • **Documenting processes and creating procedures**: For such a scenario,
    models are usually created using a reduced number of notation elements to make
    them easy to read by non-experts, but with extensive descriptions of individual
    steps. Those models often contain information such as ownership of the process,
    history of changes and approvals, information about the responsibility for the
    steps of the process, and applications and documents used in the process.


    +   • **Process improvement**: For this scenario, the models also tend to use
    a simplified notation. What distinguishes models created with **process simulation**
    in mind is data about times and costs, allowing us to simulate processes and compare
    variants to determine a method of process execution that is faster and cheaper
    than the one used today. Depending on the requirements of an organization, we
    may also want to include information about risks and controls used to mitigate
    those risks.'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'To make process improvement work, we usually need to gather some information
    about problems and errors in the process, as well as ideas for improvement. Frequently,
    process improvement and **waste elimination** techniques from Lean management
    are used. As an example, value analysis of the process steps can be documented
    in process models to show which steps are **value adding (VA)**, **value enabling
    (VE)**, or **non-value adding (NVA)**.


    +   - **Process automation**: For this scenario, models are often more complex
    in terms of both the number of objects and the sophistication of the notation.
    The first step in process automation is very often an analysis of variants as
    part of process improvement, but models to automate processes are usually much
    more complex than models for business analysis. Apart from the attributes of a
    process model that we have covered so far, models used for automation will include
    technical attributes required by the specific tool used to automate the process,
    such as information about the forms that should be presented to people performing
    the process. If the automation tool also has process orchestration capabilities,
    you can expect additional information about RPA bots, AI agents, and many other
    methods that allow you to automate your process.


    As you can see, process models can contain lots of valuable information. However,
    we need to learn how to create these process models.


    # # Tools, people, and methods to create a process model and ways to use it


    In the previous sections, we learned that process models can be very helpful for
    managing processes. We also know that these models can contain various kinds of
    information. In this section, we will discuss how process models can be created
    and used in an organization.


    Before we dive into the details, it is worth mentioning again that process modeling
    should always serve some purpose. We model processes to bring some value to the
    organization. So, please remember that this section covers only a small part of
    all process management activities happening in organizations and that process
    modeling is usually not seen as a separate stage of the **process management life
    cycle (PMLC)** since it is a technique used in many such stages.'
  merge: -1
  img_proc: true
- pgno: 160
  md: '![](img/a4c90ee3d142c33743706d37c65779c2_160_0.png)


    Figure 5.2 – Process management life cycle by BOC Group


    For example, in BOC Group’s PMLC, most of the process modeling would take place
    in the design and documentation phase, but the first high-level models would already
    have been created in the strategy and conception phase. In the analysis and optimization
    phase, models would be used to come up with an improved version of a process.
    In the implementation and change phase, models would be used for change management
    and process automation, and so on.


    In other popular frameworks, such as **PDCA/PDSA** (which stands for **plan-do-check-act**
    or **plan- do-study-act**), popularized by W. Edwards Deming, and the **BPM life
    cycle** (described in the book _Fundamentals of Business Process Management_,
    2018), it would work in a similar way. The interesting thing to note is that those
    frameworks suggest an iterative and incremental approach to process management
    and improvement.


    Now, let’s see how models can be created. In the following sections, you will
    find an overview of a few common approaches. However, this information is not
    exhaustive as new options, such as modeling processes with GenAI tools, are emerging.'
  merge: -1
  img_proc: true
- pgno: 161
  md: "A general overview of different roles involved in BPM was already covered in\
    \ _Chapter 3_, so here I will focus only on roles involved in process modeling,\
    \ especially creating detailed process diagrams (as opposed to high-level process\
    \ landscapes), since this usually takes more time in an organization.\n\n> Note\n\
    > \n> One thing I would like to note is that my experience of working with people\
    \ from BPM centers of excellence has been very positive, and luckily, I have not\
    \ experienced any of the problems mentioned by BJ.\n\n# # Modeling by employees\
    \ of an organization versus modeling by outside experts\n\nThe first aspect of\
    \ modeling worth mentioning is who should do the modeling, that is, who will act\
    \ as the **process analyst/process modeler**. Many organizations prefer to create\
    \ process models on their own. This can be done either by specialized process\
    \ analysts from the process management team (the BPM CoE), by local process modeling\
    \ experts in departments/teams supported by the process management team, or in\
    \ a grassroots approach where people from departments/teams learn modeling on\
    \ their own without support from some center of excellence.\n\nThe second approach\
    \ is to involve people from outside the organization. This can be, for example,\
    \ external consultants who specialize in process management or analysts working\
    \ for contractors responsible for the introduction of some IT system, such as\
    \ an ERP suite.\n\nAs a consultant, I often help organizations model their processes,\
    \ define modeling guidelines and best practices, and train their employees to\
    \ do the modeling on their own. If you need to have lots of high-quality models\
    \ fast, involving external experts can be helpful. But if you want to have process\
    \ documentation that is always up to date and (more importantly) involve your\
    \ employees in process management and improvement, it helps a lot to have internal\
    \ experts who know how to model the processes. In the following sections, I will\
    \ share with you my experience with different approaches to process modeling.\n\
    \n# # Modeling based on various sources of knowledge about a process\n\nThe next\
    \ aspect that we will be covering is how we come up with a process model. There\
    \ are several different approaches that are possible, such as the following:\n\
    \n+   - Modeling based on your own knowledge\n+   - Modeling based on the knowledge\
    \ of interviewed **subject matter experts (SMEs)**\n+   - Modeling based on observations\
    \ of a process\n+   - Modeling based on pre-existing documentation"
  merge: -1
  img_proc: true
- pgno: 162
  md: '+   - Automated process discovery

    +   - Modeling based on workshops

    +   - Modeling based on best practices/reference models


    The first option is when a person creates a model of a process that they know
    well. Since SMEs usually do not know how to model processes, it is important to
    pick the correct people to do the process analysis and modeling as not everyone
    wants to learn how to model processes. Those people should also get some support
    from more experienced colleagues. Ideally, this would be training in modeling
    notation and the modeling tool, plus guidelines for creating models provided by
    the team of process experts. This will speed everything up and should help avoid
    situations where every expert creates a process model in a different tool, using
    different notations and different approaches.


    Since training many people to do the modeling takes time, and they will not be
    as skilled in process modeling as experts, very commonly, organizations decide
    to start with a smaller team of process analysts, who will create models based
    on interviews with process experts. A person with more modeling experience does
    the modeling and asks the questions, and a person familiar with the process tells
    them how the process looks in practice. With this approach, the models are created
    faster because the person with more experience does the modeling, and the person
    who knows the process doesn’t have to spend a lot of time learning how to model
    processes.


    For both options, it is very important to make sure to involve the correct people
    in modeling, that is, make sure that all teams involved in the process include
    SMEs. Otherwise, you may end up with incomplete process models because your experts
    did not know the whole process or failed to mention some steps for various reasons.


    It is also helpful to share widely the process documentation that was created
    and give your employees and collaborators a chance to not only view it but also
    provide their feedback in a convenient way. Those comments are very valuable because
    they allow you to see whether your process documentation is complete and accurate.
    As an added benefit, this approach promotes process thinking and getting people
    more involved (especially if they see that their feedback was heard and implemented).


    One of the ways to overcome this problem of incomplete description of the process
    is to model based on not only what people think or say but also reliable data.
    Historically, this usually meant that the person creating the model would observe
    people performing the process and would document all the steps happening in it.


    Documenting a process is not always easy, however. For example, the process analyst
    should not disrupt the work (too much) with questions. But without asking questions
    about the process, it may not always be obvious to the analyst what is happening,
    especially if some steps are automated.


    To make things more difficult, people tend to behave in a different way when they
    know that someone is watching them (this is called the **Hawthorne effect**).
    Taking all these elements into consideration, it is often a good idea to cross-check
    what the analyst can see with other sources, such as process documentation.'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'Existing process documentation can also be helpful as a source of knowledge
    for process analysts. However, sometimes it is not up to date, so it needs some
    additional work to make sure that it is known what is really happening. It is
    a good starting point, but sometimes it needs to be validated and should not be
    used as the single source of knowledge about the process.


    In the past few years, a new approach to gathering information about as-is processes
    has gained popularity: **automated process discovery**. By using **process mining**
    and **task mining** techniques, it is possible to analyze the logs from the IT
    systems automating the process or analyze the screens of employees performing
    the process to come up with a data-backed version of what the process really looks
    like.


    Of course, you should be aware that while process mining offers you many exciting
    possibilities for advancing your process management to the next level, it is not
    a panacea for process discovery. That’s because for a significant percentage of
    organizations, there are still many processes with parts that cannot be analyzed
    in an automated way.


    The next approach is to create a process model by involving teams performing the
    process as well as the **process owner** in a workshop. This requires careful
    coordination because it is not easy to have several busy people attend the workshop
    at the same time. However, by involving all interested teams in the modeling,
    we create a model that considers everyone’s voice. Such a model is a kind of contract
    between all the teams working together to document their shared understanding
    of a process. The participation of many people provides the opportunity to clarify
    any ambiguities and misconceptions. In addition, working together on the model
    helps build commitment among the participants.


    Interestingly, some organizations also hold workshops online with copilots providing
    input for creating process documentation based on transcripts.


    It is also worth mentioning that sometimes it makes sense to speed up the modeling
    by using existing reference models or best practices. This is especially helpful
    when we are not trying to document the existing process but want to design a new
    one and don’t want to do it from scratch.


    # ## Processes of process modeling


    Since we now know how a process model can be created, it would also make sense
    to briefly discuss what will happen when we already have the model. An organization
    that wants to manage its processes can benefit from defining some processes it
    will use in process management. While there are many such processes, I will mention
    the most common ones.


    First, we need a process that will help us identify what processes we have in
    the organization. Once we have done this, we should plan which processes require
    the detailed modeling that was described previously. This may be needed because
    we do not have a model at all or because the process model needs to be changed,
    for example, due to a process improvement initiative.'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'When the process model is ready, usually there will be some formal steps needed
    for approving it by

    the process owner, but possibly, other roles can be involved too. The approved
    model should be easily

    available to **process performers**, so that they can use it in their daily work,
    but also so that they can

    send feedback and improvement ideas for the process.


    More advanced organizations often have processes for monitoring the **key performance
    indicators**

    and/or periodic reviews of the process as well. This can trigger a need to improve
    a process, which

    will also require an update or a complete redesign of the process model.


    As you can see, there are many things needed to make sure that process models
    are up to date and

    useful for the organization. To make sure that all this work is not a burden for
    the organization, proper

    tools should be used that will support working with the process documentation.


    # # Tools for process modeling


    Since we now know who can do the process modeling and how this knowledge about
    processes will

    be gathered, it’s time to discuss how the process models can be created and what
    kinds of applications

    can be used.


    First of all, it is worth noting that it is not obligatory to use IT tools for
    process modeling. There are

    some organizations (especially those with a strong Lean or Agile culture) that
    prefer to use tools such

    as flipcharts, whiteboards, and sticky notes.


    However, in my experience, while those tools are great for workshops and making
    people engaged in

    process improvement initiatives and visual management, it is rather difficult
    to avoid using software

    if process management initiatives are broader and involve more people from different
    locations. That’s

    why we will focus on software supporting process modeling.


    There are many IT tools that can be used to create process models. Currently,
    more and more tools

    are available on the cloud via a browser, but there are still many standalone
    applications that you can

    download on your computer.


    Organizations will have different modeling scenarios and different visions of
    how processes should

    be documented, how this documentation should be published, and how to make sure
    that it will be

    a living system capable of gathering feedback and ideas, as well as supporting
    changes. That’s why

    there’s no one tool that would work best in every case and help get the whole
    organization involved

    in BPM. So, instead of giving you a recommendation for one single BPM tool to
    rule them all, I will

    provide an overview of various tool categories with information about their advantages,
    so that you

    can decide what would be best for you.'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'Some organizations start their adventure in process management by creating
    process documentation

    with general-purpose office suites. This mix of text documents, shapes representing
    processes, and

    so on is very easy to create, but keeping it up to date is very cumbersome and
    time-consuming. Also,

    it is very difficult to keep people engaged if the process documentation is available
    as slides, text

    documents, and spreadsheets.


    That’s why usually, more specialized tools are used. In my experience, there are
    four broad categories

    of applications that can be used by organizations that want to document their
    processes:


    +   - Diagramming tools

    +   - **Enterprise business process analysis (EBPA) tools**

    +   - **Model-based software engineering (MBSE) tools**

    +   - Modeling tools linked with process automation suites


    Let’s look at each of these in greater detail.


    # ## Diagramming tools


    As you could expect, **diagramming tools** allow for much easier creation of diagrams
    than office suites.

    Usually, they are very user-friendly tool suites with dozens of diagram types
    and hundreds of different

    templates that allow you to create a diagram for nearly any purpose you can dream
    of, from strategy

    planning to planning the layout of the office.


    Of course, they also allow you to create many kinds of diagrams that can be useful
    for process

    management: high-level process landscapes, detailed process maps (using various
    notations),

    organizational structure diagrams, and so on.


    Basic tools of this kind focus on creating nice-looking pictures with smooth collaboration,
    but they

    usually offer very limited features in terms of process analysis and governance
    (e.g., approvals).


    More advanced diagramming tools can also be integrated with external systems,
    for example, to reach

    a broader audience with process documentation or to import live data and visualize
    it in the diagrams.

    This makes them closer to the next category of tools: EBPA.


    Example tools of this kind that I frequently encounter are the following:


    +   - **Draw.io/Diagrams.net (JGraph Ltd and draw.io AG)**

    +   - **Lucidchart (Lucid Software)**

    +   - **Visio (Microsoft)**'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# # EBP A tools


    EBP A tools are much more specialized than diagramming tools. They allow you to
    create various

    types of process models very easily, but they are much more focused, so you can
    expect many types

    of models that you may need to create a comprehensive process documentation, but
    not as much in

    diagramming tools.


    Those models are usually much richer in attributes in comparison with diagramming
    tools. While a

    simple diagramming tool creates a diagram or a process map that is a nice-looking
    picture, a process

    model usually has strictly defined rules of what is allowed and what is not. Also,
    model types available

    in EBP A tools are much more advanced and contain special attributes, and features
    aimed at different

    roles involved in process management, and so on.


    Examples of EBP A tools are the following:


    +   - **ADONIS** (BOC Group)

    +   - **ARIS** (Software AG)

    +   - **iGrafx** (iGrafx)


    ADONIS is the tool I used to create most of the examples in this part of the book.
    This is the tool I

    know the best, since I work at BOC Group. If you wish, you can use the free version
    of the tool, called

    ADONIS Community Edition. The registration page can be found at `https://www.adonis-

    community.com`.


    With Visio, it is worth noting that it has some features that exceed the standard
    capabilities of drawing

    tools. For example, Visio BPMN diagrams can be exported to Power Automate.


    It is also worth mentioning that simple process documentation could also be created
    with **collaboration

    boards** such as Miro, Mural, or Klaxoon. Both diagramming tools and collaboration
    boards excel at

    visual collaboration over diagrams.'
  merge: -1
  img_proc: true
- pgno: 167
  md: '![](img/a4c90ee3d142c33743706d37c65779c2_167_0.png)


    Figure 5.3 – Overview of available diagram types in ADONIS as a representative
    EBPA tool


    # ## MBSE tools


    MBSE tools are also commonly referred to as **computer-aided software engineering
    (CASE)**. As the name suggests, those tools are aimed at more technical users
    involved in software engineering. There are many types of CASE tools, so we will
    focus on those that allow modeling systems with their business context.


    Those tools usually support many notations that are relevant to business analysts
    and IT specialists, such as **Unified Modeling Language (UML)** and **Systems
    Modeling Language (SysML)**, but also standards more relevant to business process
    modeling, such as ArchiMate and BPMN. Apart from creating precise models that
    can be analyzed and easily updated and preparing documentation (e.g., as requirements
    for the IT system), they often also allow you to generate code from the models
    and models from code.


    Examples of MBSE tools are the following:


    +   • **Enterprise Architect** (Sparx Systems)


    +   • **Visual Paradigm** (Visual Paradigm)'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# # Modeling tools linked to process automation suites


    The last category of tools that are often used for modeling processes is the tools
    linked to process automation suites (often referred to as BPMSs, or business process
    management suites). Modeling tools allow you to create process diagrams (often
    in BPMN notation) and enrich them with additional attributes needed for automation
    (e.g., information about forms, roles in a process, or integrations), often along
    with DMN diagrams for defining business rules important for automation.


    Example tools from this category are the following:


    +   - **Bizagi Modeler** (Bizagi)

    +   - **Camunda Modeler** (Camunda)

    +   - **IBM Blueworks Live** (IBM)


    It is worth noting that Camunda Modeler uses the BPMN .io library, developed by
    Camunda, which is used by dozens of other tools from many companies.


    Of course, apart from the tools that we have covered, there are many more tool
    categories that are important to companies interested in BPM. Companies managing
    their processes and using the hyperautomation approach will often use not only
    BPMSs and some tools for modeling their processes but also RPA tools, process/task
    mining tools, and so on.


    Ideally, they will also have a platform facilitating process orchestration, which
    allows running end-to-end processes that include people, RPA bots, AI agents,
    and interfaces (APIs). This type of technology platform is termed by Gartner business
    orchestration and automation technology (BOAT).


    # # Summary


    In this chapter, we learned about the basics of process thinking. We learned how
    processes help create value and why it is important to have a broader understanding
    of the processes before doing any analysis and improvement. We discussed various
    purposes of modeling processes and how they impact the content of the process
    models. Finally, we learned about the tools used to model processes and approaches
    to create process models and work with them. If you have a feeling that an organization
    may end up with many process models and that it would be helpful to arrange them
    somehow, you are right! This is what will be covered in the next chapter.'
  merge: -1
  img_proc: true
