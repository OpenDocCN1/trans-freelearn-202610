    that you will set the course on your own.


    +   - We decided not to use artificial examples and simplifications such as a
    pizza or coffee-making business process. The leave approval process is also not
    covered. While there are cases when such examples serve a purpose, work in an
    enterprise tends to be a lot more complex, and we’d hate to waste your time sharing
    our knowledge on simplistic examples. Our compilation of examples is pulled directly
    from projects we were part of.


    +   - Business analysis and process modeling skills are gained on projects with
    different business objectives. I recognize the vastness of this continuum and
    the fact that many great people are doing a lot of very innovative work. We don’t
    claim to know it all – we intend to share with you what we’ve learned throughout
    our journey, from thought leaders and mentors who shaped our thinking. Throughout
    our careers, we’ve been lucky to work with many top-notch teams and software vendors
    who are really pushing the boundaries of DTX.


    +   - The practice of business and process analysis itself is going through a
    transformation driven by the need for fast-paced adaptability taking place within
    the inside of the company. Just like the world of software development has been
    revolutionized through the empowerment of citizen developers driving low-code
    solutions, so is the world of business and process architecture. No business owner
    these days has enough time to wait for the assignment of an architect to help
    define their business process landscape. The job of an architect is becoming one
    of a mentor, as the needs for business and process analysis emerge everywhere
    on a daily basis. We propose recognizing this wave of skillset democratization
    that runs parallel with and trails what, in the world of software development,
    is known as _shadow IT_. We welcome others to help us define the proper name for
    these citizen architects – change agents who are leading the redesigning and rearchitecting
    of business processes without the involvement of centralized enterprise architecture
    or management consultant teams specializing in selling implementation contracts.'
