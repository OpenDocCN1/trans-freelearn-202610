- pgno: 350
  md: '# # Measuring the business value of agentic AI systems (experimental)


    Several robust methodologies and approaches are employed to measure the effectiveness
    of AI-driven workflow automation and transformation programs. The **Balanced Scorecard
    (BSC)** framework, Six Sigma, and Lean Metrics stand out here. BSC provides a
    comprehensive view by evaluating financial, customer, and internal processes,
    as well as learning and growth perspectives.


    For instance, a global insurance firm applied this methodology to measure the
    impact of AI on their claims processing, achieving a 30% reduction in processing
    time and a significant increase in customer satisfaction. With its focus on reducing
    errors and improving quality, Six Sigma has been utilized by manufacturing giants
    such as General Electric to optimize AI-driven predictive maintenance, resulting
    in substantial cost savings and uptime improvements. Lean Metrics, emphasizing
    waste reduction and efficiency, was instrumental for an e-commerce leader in streamlining
    their AI-powered supply chain operations, leading to faster deliveries and reduced
    operational costs. These methodologies provide quantifiable metrics and align
    AI transformations with strategic objectives, supporting data-driven decision-making
    and fostering a culture of continuous improvement.


    # ## BVA case studies


    To provide a comprehensive understanding of how BVA can be applied in various
    scenarios, I will explore three distinct case studies. Each case study will focus
    on a different type of analysis, highlighting its unique approach and impact on
    business decision-making:


    +   - **Case study 1: Retail industry**: This study examines how a company optimized
    and automated its core processes by implementing a low-code DPA platform across
    the enterprise.

    +   - **Case study 2: Financial services**: This analysis looks at how a global
    finance business unit improved its core processes, reduced cycle times, and achieved
    significant cost savings through process transformation and **robotic process
    automation (RPA)**.

    +   - **Case study 3: Adaptive logistics and fulfillment**: This hypothetical
    use case focuses on workflow automation driven by agentic AI through the use of
    autonomous agents, with a focus on dynamic workflows and intelligent systems that
    optimize supply chains, delivery networks, and customer satisfaction through continuous
    adaptation and high-level autonomy.

    +   - **Case study 4: Agentic AI and the modern ranch**: AgSights is transforming
    Canada’s ranching sector by enabling smaller producers to access real-time insights,
    optimize processes such as feed costs and grazing schedules, and compete more
    effectively with larger operations. This technology, combined with strategic frameworks
    such as BSC and BPA, empowers ranchers to align AI-driven actions with measurable
    growth objectives and operational efficiency.


    Let’s take a look at each case study in greater detail.'
  merge: -1
  img_proc: true
- pgno: 351
  md: '# # Case study 1: Calculating the BVA of enterprise adoption of a low-code
    DPA platform


    A national retailer has transformed its core and supporting processes by shifting
    from a brick-and-mortar model to a digital business approach. To expedite this
    transformation, the company’s leadership is considering investing in a DPA platform
    to enhance the automation of the existing process architecture.


    Preferring in-house development, the company aims to launch, manage, and support
    the initiative internally to minimize consulting costs. However, this initiative
    carries significant risks due to past negative experiences with scaling automation
    technologies. It requires careful planning, a non-standard grassroots and bottom-up
    approach to project delivery, and multiple checkpoints throughout the program.


    The analysis is based on various inputs that need to be collected in advance,
    resulting in several outputs that outline comprehensive benefits over three years.
    You will need to invest time in collecting data used for inputs.


    The following are inputs:


    +   - Process discovery and repository licensing costs

    +   - Process architect training costs

    +   - Investment in the internal team

    +   - Citizen developer training costs (effort and certification)

    +   - DPA platform licensing costs:

    +     - Cloud infrastructure spend forecast, including connectivity costs (varied
    by scenario)

    +   - Evangelism and community-building costs

    +   - 6-9 months’ worth of consulting costs in the staff augmentation model:

    +     - Platform launch

    +     - COE operating model

    +     - Support of the first quick-win project

    +     - Support of the second quick-win project

    +     - Monitor and grow


    This analysis results in several data points and outputs being calculated that
    help describe the scope of the anticipated investment.'
  merge: -1
