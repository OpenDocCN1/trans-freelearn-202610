    🔍 **Quick tip**: Need to see a high-resolution version of this image? Open this
    book in the next-gen Packt Reader or view it in the PDF/ePub copy.


    📘 **The next-gen Packt Reader and a free PDF/ePub copy** of this book are included
    with your purchase. Scan the QR code OR go to `packtpub.com/unlock`, then use
    the search bar to find this book by name. Double-check the edition shown to make
    sure you get the right one.


    ![](img/a4c90ee3d142c33743706d37c65779c2_182_0.png)


    Apart from ArchiMate, several other approaches aimed at business architects, such
    as **Business Architecture Body of Knowledge (BIZBOK®)** and Object Management
    Group standards such as **Value Delivery Modeling Language** and **Business Architecture
    Core Metamodel**, can be valuable sources of inspiration, but so far, none of
    them can be seen as the de facto standard as they do not provide comprehensive
    guidance on how to create a process architecture.


    For many organizations that I have had a chance to work with, those standards
    may be a bit too much to implement immediately since they need a certain level
    of organizational maturity and a group of people who know how to use them. In
    this situation, my suggestion would be to cross-check the BPM method that the
    organization creates against such standards to make sure nothing important is
    missing at this stage.'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'Now, let’s cover the topic of how to document the process architecture. Apart
    from the cases where organizations avoid graphical modeling and maintain textual
    lists of processes, typically, processes are indicated by arrows or chevrons.
    However, this is not standardized in any way (unless you use ArchiMate), so it
    is only a common practice and something that’s inspired by Michael Porter’s work.


    The last question that remains is, how do you create a process architecture? In
    practice, I see two main approaches. The first is to take advantage of best practices
    and use available process libraries. The second is to prepare a process architecture
    tailored to a specific organization.


    In the following sections of this chapter, we will cover both options. We will
    use both approaches to build a process architecture for a fictional company, _BPMT
    Dishes_, that manufactures and sells bowls, plates, and other dishes. This example
    will also be used in _Chapters 7 to 9_, where we will be using the complaint-handling
    process of this company. Of course, this example will be simplified since it’s
    for illustrative purposes.


    # # APQC’s PCF® and other process libraries


    Let’s begin by discussing what the process libraries are and how they work. We
    will cover the most popular one, APQC’s PCF, in more depth, but several others
    will be mentioned as well.


    # ## Introducing the process libraries


    The most commonly used set of reference processes is a library offered by APQC
    called the PCF. Documentation in the form of Excel and PDF files for the PCF is
    available for free after registering at `www.apqc.org/pcf`.


    APQC describes the PCF as a taxonomy of processes. It can be used for many purposes—often,
    organizations start by describing processes or, as we will see later, they may
    want to verify the completeness of process descriptions. However, often, process
    improvement and standardization become important use cases. But that’s not all:
    the PCF can be used to categorize content that has been created within an organization
    and for process **benchmarking** purposes, such as comparing the organization’s
    results with the peer group.


    APQC offers more than a dozen types of PCFs. The most basic is the generic **Cross-Industry**
    type. However, there are also versions tailored to specific industries, such as
    **Airline**, **Automotive**, **Banking**, **City Government**, **Consumer Products**,
    **Education**, **Healthcare Provider**, **Life Sciences**, **Retail**, **Telecommunications**,
    and **Utilities**.


    Content within the PCF is divided into five levels:


    +   1. **Category.**


    +   2. **Process Group.**


    +   3. **Process.**'
  merge: -1
  img_proc: true
- pgno: 184
  md: '+   4. Activity.

    +   5. Task.


    Let’s use the Cross-Industry version to see those levels in practice. To make
    things more fun, we will use the 13.0 Develop and Manage Business Capabilities
    category since it contains elements related to process management.


    Categories are the broadest groupings of the processes in the PCF and represent
    the first level. Each of them contains process groups, which represent level two.


    In our example, there are nine process groups, and the first one is 13.1 Manage
    business processes. Other process groups include Manage portfolio, program, and
    project (13.2), Manage enterprise quality (13.3), Manage change (13.4), Develop
    and manage enterprise-wide knowledge management (KM) capability (13.5), Measure
    and benchmark (13.6), Manage environmental health and safety (EHS) (13.7), Develop,
    manage, and deliver analytics (13.8), and Manage sustainability (13.9).


    As you may expect, process groups contain processes. Our 13.1 process group contains
    five of them: 13.1.1 Establish and maintain process management governance, 13.1.2
    Define and manage process frameworks, 13.1.3 Define processes, 13.1.4 Manage process
    performance, and 13.1.5 Improve processes. We will focus on 13.1.3 in our example.
    Processes represent level three, as indicated by their prefixes.


    Processes can be further decomposed into activities (level four). Our activities
    would include 13.1.3.1 Scope processes, 13.1.3.2 Analyze processes, 13.1.3.3 Identify
    and denote process control points, 13.1.3.4 Model and document processes, and
    13.1.3.5 Publish processes.


    Sometimes, activities need to be decomposed even further. For this purpose, tasks,
    representing level five, are used. Please note that not every activity has tasks.
    In our example, 13.1.3.1 Scope processes is not decomposed any further, while
    13.1.3.2 Analyze processes has one task: 13.1.3.2.1 Identify published best practices.


    If you would like to see additional examples of how those levels work, check out
    the PCF levels explained section of the PCF files.


    In the current version of the PCF (7.4), there are 13 categories of processes,
    as shown in Figure 6.6. Instead of the classic division into management, main,
    and support processes, the PCF divides operational processes presented in the
    form of a value chain, where management and support processes are grouped.


    Each element, in addition to its name, has a unique identifier, as well as a hierarchical
    identifier, which makes it very easy to find out on which level of the architecture
    it occurs and what its parent is.


    Selected processes also have descriptions available. What’s very useful for organizations
    interested in process measurement is that, for selected APQC process areas, the
    PCF also includes proposed metrics along with ways to calculate them.


    In this way, the PCF provides a common language for process practitioners. It
    can be used to process comparisons between different companies and benchmark process
    metrics (KPIs).'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'When you consider how much valuable information the PCF contains, and the fact
    that many sector variants have about 1,000 process elements described, it’s no
    wonder it’s a common choice for many organizations preparing process architectures.
    Importantly, the PCF can be used not only as a template for the process architecture
    structure but also to categorize an organization’s various types of information
    resources. For this last aspect, you can think of the analogy of a library catalog,
    where each book is assigned to a specific category.


    It is worth remembering, however, that the lower levels of the PCF should be viewed
    as a list of elements that can occur in a given process, rather than a detailed
    description of processes that can be used one to one. Nor does the order of occurrence
    of elements within a list necessarily translate into a sequence.


    APQC’s PCF is an extremely valuable resource for process management teams in organizations
    since it helps them avoid many mistakes and allows more value to be delivered
    quickly in process initiatives.


    However, you should not expect to simply apply the content contained in the PCF
    one-to-one in every case. Rather, it may be necessary to make some modifications
    and tailor the content to the specific industry, organization, or legal environment
    in which the entity operates.


    Here, I will quote Roger Tregear, who says that “_Even if management and support
    processes may be similar or even identical in different organizations, core processes
    may be different or perhaps even unique, and it helps a lot if they are named
    using the terminology of the organization._” This increases resonance and buy-in.


    > Note

    > More information about the PCF, along with a wealth of resources about its usage,
    can be found on the APQC website (https://www.apqc.org/process-frameworks).


    # ## APQC’s PCF in practice


    In this section, we will see how our fictional company, _BPMT Dishes_, could use
    the APQC’s PCF to build a process architecture. The first issue would be the decision
    of which version of the PCF to use: the Cross-Industry one, or any of the industry-specific
    variants.


    As mentioned earlier, while the highest level, with its 13 process categories,
    is quite similar, but not identical, the lower we go down, the more differences
    there are between the different versions of the PCF.


    Since our example company, _BPMT Dishes_, produces and sells dishes, we can easily
    identify two industry-specific variants that could be relevant for us. Comparing
    the Cross-Industry variant with the Customer Products and Retail versions, we
    can see that while we have 13 categories in each of these variants, the names
    of these process categories are tailored to the specific operations of the organization.
    These differences are shown in the following table:'
  merge: -1
  img_proc: true
