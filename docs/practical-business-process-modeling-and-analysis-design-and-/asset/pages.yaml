- pgno: 134
  md: '# # Long-Term Trends and the Impact on Your Job


    In essence, business processes form the backbone of an organization, weaving together
    its fabric of functionality and purpose. It is also relatively easy for a person
    in the business to go from a definition of the business process (a thing that
    transforms inputs into the business value) into a process map, then into a larger
    collection of business processes (architectures) representing capabilities of
    the whole business unit, into actual projects that drive implementations resulting
    in workflow ecosystems. I’d like to also propose that we look at a business process
    as a string of activities and tasks that can do the following:


    +   - Learn

    +   - Be adaptive

    +   - Change colors and distribute coffee and candy (not really, but wouldn’t
    that be nice?)


    Imagine now that the Order of Teutonic Knights attempts to design their next headquarters
    in Europe in 2025. If they took the business process-led design approach, the
    following could apply to their next castle:


    +   - It could have a few shape-shifting towers and moats, and be able to adjust
    to changing weather conditions, inside temperature, and the number of visiting
    guests. The Order of Teutons enjoyed entertaining their guests so the ability
    to flex the quarters by a few additional rooms would be worth a premium.

    +   - The design would also learn from Navajo, Spanish, Irish, British, French,
    Portuguese, South Indian, and Aztec castle designers about different architectural
    styles and layouts, selecting the most optimal building style for their needs
    depending on the occasion, situation, or the level of threat. The Teutonic Order
    had many enemies due to its aggressive stance toward non-Christians, and its location
    in Central Europe emphasized protection over openness.

    +   - The bricks would be made from LED-like material, charging from the sun.
    They could also change colors and translucency (adaptive and self-sustaining properties).

    +   - The castle could be built by peasants who were not part of the Teutonic
    Order and contributed a few hours per week to help create this fortress in their
    spare time.

    +   - The new castle could be built in 6 months on a parcel in the neighboring
    city, then overnight, the old structure would be destroyed and replaced by a new
    design.


    The preceding mental exercise is intended to overlay the qualities of a business
    process into the physical structure deployed at a large scale as in the enterprise-wide
    process transformation.


    Now, consider that there are some leaders who attempt to design and digitize core
    business processes without the right level of appreciation of process architecture,
    modeling, and execution. What they build is individual moats and bridges (they’d
    call such projects _automation_), hoping that, over time, these bridges will somehow
    connect and create the whole _castle_ of their enterprise or a business unit.'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'In other words, if you are invested in your career and would like to play an
    active role in digital change programs, you need to understand quite a bit about
    the foundational brick of the transformation and the theory of the business process
    itself. Look at the business process and learn it from every possible angle to
    later apply this knowledge to your company’s transformations.


    Carry the understanding that your core foundational skillset will need to be extended
    with technical skills based on your role, which may be closer to the implementation
    work (castle construction vs. castle design). The tech capabilities of digitization
    platforms change every few months, and you will need to stay on top of these features
    and refresh yourself with new certifications occasionally. One thing that will
    keep you grounded and allow you to navigate through new tools, new jargon, and,
    often, confusion is your understanding of the business process and BPM fundamentals.
    Such knowledge will put you ahead of 70% of your colleagues who claim that they
    are transforming and automating business processes without understanding what
    such business processes are, why they exist, and being aware of their life cycle.
    Such colleagues can be recognized by flowchart artworks full of logical errors
    that waste time and spread confusion. Many business professionals still do not
    understand and value basic process mapping notation and its purpose; they look
    at swim lanes as a necessary evil, getting satisfaction and a sense of empowerment
    when producing slideware. Democratization of domains creates the need to start
    treating areas of process design, mapping, and architecture as common skills that
    supplement MBA programs.


    # Navigating major trends and their impact on skill requirements


    There are many trends affecting BPM and DTX, such as the following:


    +   - AI

    +   - Cloud computing

    +   - Big data

    +   - Blockchain

    +   - Internet of things (IoT)

    +   - Robotics, 3D printing

    +   - Decision management

    +   - Customer journey mapping

    +   - Robotic process automation

    +   - Process mining

    +   - AI chatbots'
