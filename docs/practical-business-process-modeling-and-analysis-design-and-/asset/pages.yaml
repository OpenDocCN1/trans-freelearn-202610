- pgno: 103
  md: '# # How do you pitch a transformation?


    A BPM transformation as a strategic initiative requires the support and buy-in
    of the senior management and the critical stakeholders of the organization. Without
    their endorsement and sponsorship, a BPM transformation can face many obstacles
    and risks, such as the following:


    +   - Lack of funding and resources

    +   - Lack of alignment and coordination

    +   - Lack of accountability and ownership

    +   - Lack of trust and credibility

    +   - Lack of motivation and engagement

    +   - Waning executive support

    +   - Competing strategic priorities taking over the long-term focus


    Thus, it is crucial to present a BPM transformation in an engaging and persuasive
    manner that clearly illustrates its value and advantages to your organization.
    How can you successfully pitch a BPM transformation? In this section, we will
    cover the main components and strategies for effectively pitching a BPM transformation,
    including the following:


    +   - Identifying the audience’s needs and expectations

    +   - Emphasizing the current challenges and pain points

    +   - Depicting the vision and advantages of the future state

    +   - Utilizing stories and examples to demonstrate the impact and success of
    the transformation

    +   - Implementing “quick win” projects to achieve initial successes'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# Presenting the business case and roadmap for the transformation


    ![](img/a4c90ee3d142c33743706d37c65779c2_104_0.png)


    Figure 3.12 – Pitching business transformation is best done through storytelling


    Prior to embarking on any new project, evaluate your current business landscape
    and contemplate whether the timing is right. Here are a few real-world examples
    that led to the establishment of a robust BPM practice, except for the last one:


    +   • A company that invested in the process automation platform from the vendor
    Zeta discovered within 2–3 years that the product was difficult to use. The anticipated
    ROI remained out of reach, and the consulting teams responsible for driving transformation
    left behind a series of failed projects. These setbacks created a negative perception
    of BPM and automation.


    +   • A company faces intense market pressure resulting from new regulations,
    shifting business environments, or key strategic initiatives that necessitate
    a comprehensive revamp of its core operating processes to maintain economic sustainability.
    This situation is referred to as the _automate or die_ scenario.


    +   • Your new VP previously had successful experience with BPM at their former
    company and is eager to replicate that success at your organization.


    +   • Faced with highly demanding business objectives, you recognize that achieving
    these targets will be impossible without implementing work and process automation.
    Consequently, your leadership encourages you to initiate the automation program.


    +   • A successful business process automation project with the consulting firm
    Beta brought process-oriented thinking to your organization, leading to high satisfaction
    levels because of the positive ROI achieved. Other leaders within your company
    have heard about these successes and are interested in replicating them in various
    areas of the business.'
  merge: -1
  img_proc: true
- pgno: 105
  md: '+   - An adept process practitioner is promoted to a leadership position and
    chooses to apply greater rigor and discipline to business operations, drawing
    from their experience.

    +   - Lacking hobbies outside of work, you decide to use insights from recent
    sales and marketing webinars to influence your colleagues’ thinking. So, you propose
    the launch of the BPM CoE to your boss for recognition and advancement.


    All but the last one of these scenarios are correct, and you would tailor your
    pitch differently for each one. While your starting position doesn’t dictate your
    objectives and endpoint, it’s beneficial to be aware of it. The following tips
    can help you devise your action plan:


    +   - Define BPM using terms and language compatible with your company culture.
    Avoid corporate jargon that does not explain concepts.

    +   - Align your BPM terminology with the language of business architecture and
    the business itself. Avoid acronyms.

    +   - Don’t use scientific papers or presentations; your initial messaging needs
    to be crisp and businesslike.

    +   - Connect the vision and value of BPM with your company’s strategic DTX goals.

    +   - Address the “What’s in it for me?” for the following:

    +     - The sponsor

    +     - Business leaders

    +     - Process owners

    +     - Citizen process architects

    +     - Citizen developers

    +   - Develop a collection of reusable slides and maintain control over them.
    Avoid cluttering your presentation with content taken from vendors’ decks unless
    you are intentionally managing your partnership with the company.

    +   - Ensure that your training materials are vendor-neutral; avoid using resources
    from specific software vendors to teach BPM. You might be astonished at the number
    of vendors necessary for a successful BPM implementation in your company. It’s
    common to begin with one vendor, say Zeta, only to later find that another vendor,
    Alpha, provides the tools and capabilities better suited to your company’s needs.

    +   - Start by presenting your proposal to the business team; the most effective
    BPM programs are usually led by the business side, even when they involve a high
    degree of technical detail.

    +   - Pay attention to the underdog. Occasionally, areas of business that have
    traditionally lacked funding can provide significant visibility by presenting
    solutions to problems that other regions have been grappling with.'
