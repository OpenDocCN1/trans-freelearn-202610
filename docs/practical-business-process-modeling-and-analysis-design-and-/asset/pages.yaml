- pgno: 45
  md: '# # Pillars of a Successful Digital Transformation


    In the first chapter of our book, Jim Sinur made a case for the continuous importance
    of process and process modeling in consideration of how the blend of different
    work styles has historically driven enterprise optimization. These include structured
    processes, case-based collaboration, and IoT/bot collaboration – all of which
    are contributing to a shift from centralized operations to a more distributed,
    edge-based paradigm. Jim sees rapid advances in AI changing the role of business
    processes, taking companies from optimized and centrally controlled by “the brain”
    work organizations toward adaptive, goal-oriented, and fully distributed architectures.


    We can expect to see major shifts in companies’ technology landscapes as pervasive
    AI takes over responsibility for decision-making, control, and negotiations on
    how to best accomplish business goals and get work done between bots and humans.
    With wave after wave of technological progress sending shocks to operations via
    prototypes, new project releases, change management programs, and the continuous
    advancement of intelligent processes in work historically performed by us professionals,
    one may wonder how to avoid losing the human in the process. Being part of a digitization
    program without the right grounding/framework can create unpleasant and unintended
    consequences for workforces across all industries and geographies. Human brains
    operate best in routine environments, yet the frequency of change hitting us from
    multiple directions causes chaos, competing priorities, and difficulties adapting
    to quickly changing realities brought forth by **Digital Transformation (DTX)**
    agendas. To add to these challenges, DTX within a company may mean different things
    to different audiences based on people’s roles in the organization, making it
    harder to communicate across teams.


    This chapter discusses how to organize work around workstreams that will support
    major pillars of your company’s DTX. Regardless of how and when DTX efforts start,
    most work streams will end up revolving around such pillars, bringing much-desired
    order to unruly seas of change.'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'In this chapter, we will cover the following topics:


    +   - Introduction and overview of DTX

    +   - What are the key pillars supporting digital transformations?

    +   - How do digital transformations start?

    +     - Top-down

    +     - Grassroot

    +     - Legacy modernization

    +     - Triggered by an acquisition or merger

    +   - How to craft a vision for digital change for your business group

    +   - How to plan for the future


    > Note

    > This chapter is authored by BJ Biernatowski.


    # # Introduction and overview of DTX


    Several books have been written on DTX by a few highly recognized analysts, software
    architects, CEOs, and consultants. Over the last 15 years, as I’ve been studying
    the subject of process-led digital transformation, I have realized that the topic
    is vast, very quickly changing, and rife with business agendas of companies who
    aspire to own DTX, ultimately crowning themselves as your go-to source for everything
    DTX-related. These agendas manifest themselves through e-books, podcasts, and
    various _marchitecture_ (marketing and architecture) materials, printed on glossy
    slides and funded by marketing budgets.


    The challenge of learning about DTX from software vendors lies in the concern
    over “vendor lock-in.” This refers to the perception that companies are compelled
    to adopt a vision of DTX that aligns more closely with the software vendor’s perspective,
    rather than pursuing a path that aligns with their own strategic goals for digitizing
    and optimizing their operational processes.


    This is not to say that you cannot learn about DTX by perusing these marketecture
    white papers or books. The challenge with such materials is their need for objectivity
    and the view of DTX defined by companies ultimately seeking to reach a leading
    market position by selling their view of what the transformation should look like
    for your business, unit, or that process you are maintaining single-handedly.
    The other challenge is the amount of time it would take to sift the truth from
    aspirations or half-truths, perhaps even truths reached on projects that were
    overinvested in or redone multiple times.'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'When Packt approached me to craft the vision for this book, I thought quite
    a bit about how to make this position different from all the titles I’ve read
    in the past. The following principles defined our approach to this project:


    +   - Best practices and topics summarized in the book were gained by first-person
    participation in process transformation programs utilizing technologies and platforms
    from different vendors who’ve been in this space for many years. While this book
    highlights a few software products, we consciously try to separate creative and
    critical thinking from the toolset and any technology. The reason for this is
    that tools and technologies are continually expanding the definition of DTX without
    any clear boundaries. It’s essential to understand and master some critical concepts
    before testing even the most advanced tools. There’s an adage shared by a transformation
    consultant during a project: “A fool with the best tool is still a fool,” This
    still holds true for low code, AI, and DTX platforms such as **Intelligent Business
    Process Management Systems (iBPMS)**. An updated version of this adage states,
    “And now, thanks to AI and low code, you can make foolish decisions even faster.”


    +   - This book covers various topics that can be applied to **Digital Change
    (DtC)** programs led by teams from different technical backgrounds. When we refer
    to DtC programs, we mean the operational, tactical, and incremental improvements
    that contribute to the overall DTX journey. For us, DTX represents an evolution,
    and the path to this North Star involves implementing incremental DtC initiatives.


    +   - While your results may vary from those described in the book, there is no
    hard requirement that you experiment and utilize software products mentioned in
    the book. While we may bring up many arguments on why the tools we recommend would
    offer you the best bang for your buck with the best possible outcome, you are
    welcome to apply these concepts using your favorite process tools, and we won’t
    hold that against you. Your mileage may vary though.


    +   - Our book is written by practitioners for practitioners. Each author gained
    experience with the topics mentioned in the book through many years of practical
    work with demanding clients from medium to large Fortune 500 companies. Such work
    involved extensive air travel, long commutes, too many restaurant meals, working
    14-hour days, personal and family sacrifices, and sometimes working through the
    night to fix that pesky issue blocking the project. When it comes to DTX, the
    stakes are usually very high as these programs often respond to existential threats
    facing businesses. Betting on technology can often be associated with betting
    on your reputation.


    +   - Many topics addressed in this book exist as separate posts, documents, and
    templates generated through project teams, or consulting knowledge and frameworks
    kept close to the chest, as companies tend to protect the intellectual property
    that drives revenue. We intended to demystify and simplify some of these topics
    for you, understanding the value of your hard-earned dollars spent on this book.
    I like hanging out in bookstores and libraries, reviewing different positions
    related to DTX. You’d be surprised to find out that there are not that many practical
    positions out there, and many people literally learn about these topics by experimentation
    or watching'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'webinars. There are glimpses of hope as some business schools are starting
    to see demand for college-level courses that cover these topics; however, they
    usually come with a hefty price tag and a long-term commitment required to complete
    the degree. When you are placed or asked to lead a transformation project, you
    don’t have time for a two-year MBA degree, even in the online edition.


    +   - Writing a book about DTX for a global audience aspiring to or in the midst
    of transforming a business with analysis and process modeling requires experience
    gained on many types of projects. The collective expertise of authors involves
    working with global US and European companies. We are aware of many innovative
