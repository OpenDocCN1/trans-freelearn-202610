- pgno: 95
  md: 'Once the gaps and opportunities have been identified and a comprehensive heatmap
    of operating processes is developed, the next step involves translating these
    insights into actionable plans by crafting a compelling business case and a clear
    roadmap for transformation.


    # ## Developing the business case and a roadmap


    This step will involve creating a forward-looking roadmap for the transformation
    while keeping it regularly updated. The roadmap aims to organize individual projects
    around business objectives, generate clarity, and align multiple stakeholders
    around the same set of priorities. Transformation roadmaps should also serve as
    a stabilizing backbone, helping to assess progress against a set of objectives,
    steering efforts through the uncharted territory of organizational changes, and
    helping to educate stakeholders about the work being done.


    Your business case should demonstrate the transformation value and benefits, as
    well as its urgency and identified risks. Many budgetary requests follow such
    business cases, so you want to make sure that you scope and plan your team size
    for a suitable duration and the right level of effort.


    Your business case should also mention the need for a BPM strategy that will be
    used to accomplish your goals. This could be a _Catch-22_ situation where you
    must have pieces of your strategy before coming to your executives for funding.
    That’s why the launch of a BPM program can, at times, feel so challenging. Everyone
    will expect you to have answers to many questions, even before you start discussing
    transformation goals with your stakeholders. Hopefully, before the wave of questions
    comes your way, you will have a good grasp on your organization, its business
    needs, and long-term goals. Keep in mind that you are not inventing anything new;
    you are trying to rally support behind using the practice of BPM to transform
    your company over the long term with the help of low-code and other process digitization
    technologies.


    Gaining support and motivating your communities is effective only if you persuade
    stakeholders that their objectives align with yours and that they have a crucial
    role in the democratization of technology. Your communities should not rely on
    enterprise ivory tower teams to address their business challenges, as these teams
    typically operate slowly and do not prioritize business needs according to customers’
    timelines.'
  merge: -1
  img_proc: true
