- pgno: 180
  md: 'We may also like to have documented dependencies of our process (which processes
    precede and succeed our process in a value chain, what the parent of our process
    is and whether it has any children (or sub-processes), and perhaps which processes
    it influences or is influenced by).


    If we want to use process architecture for decision-making, such as prioritizing
    change initiatives related to customer-centricity or digital transformation, we
    could also use additional classifications and assessments. This would allow us
    to, for example, distinguish critical processes for which any improvement and
    automation is a priority, or to rank processes in terms of customer satisfaction,
    cost, quality, regulatory compliance, and more.


    When it comes to automation, we could rank the costs and potential benefits of
    process automation or calculate the automation potential of a process based on
    its predictability, complexity, and frequency, to name just a few potential options.
    Some organizations also like to document the number of people involved in the
    process by using **full-time equivalents (FTEs)**.


    Of course, each organization is different, so selecting the attributes to be used
    depends on how the organization wants to use the process architecture and what
    management systems will be integrated with process management within the organization.
    Note that the way the organization works influences this significantly.


    For example, an organization that takes a more centralized approach to process
    improvement initiatives, seeking synergy and using a broad organization-wide view,
    will probably need a bigger set of attributes that are obligatory for many areas.
    On the contrary, if the organization prefers running individual projects initiated
    by leaders of organizational units that seek quick results, a common set of attributes
    may be much smaller.


    Note that topics relevant to the organization will impact what will be documented.
    So, if the goal is to provide employees with basic information and convenient
    navigation, you can expect descriptions, links to related processes, ownership
    information, links to documents (procedures, forms, etc.), and a handful of additional
    attributes.


    For organizations where risk management and compliance are important topics, we
    could expect information about risks and controls, links between processes, and
    various compliance requirements, as well as information needed for **business
    continuity management (BCM)**.


    On the other hand, for an organization that uses process architecture to select
    processes for improvement and automation as part of digital transformation initiatives,
    apart from the attributes we’ve already mentioned, links to the applications used
    by the process would also be needed, as well as information about the projects.
    In the _How to use process architecture_ section, we will learn how various attributes
    can be used to classify processes.'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'To summarize, process architecture is very useful if we want to ensure that
    we are providing a common reference point for an organization’s many different
    management systems. While modeling individual processes allows for their standardization
    and improvement, creating a process architecture, maintaining it, and using it
    to manage an organization is necessary to achieve a higher level of business process
    management maturity.


    # # Standards for process architecture


    As we learned in the previous section, process architecture is an important aspect
    for successful process management. It is also linked to many other management
    systems in organizations. Of course, this may make you wonder whether there is
    a universally recognized list of topics that process architecture should address
    and ways to show them graphically, and whether there is a standard way to create
    a process architecture.


    Interestingly, there is no single universally accepted approach to its construction.
    Some organizations find it sufficient to only focus on the processes, along with
    all their attributes and links to organizational units. Others use more topics,
    such as applications, risks, KPIs, and others.


    However, other organizations use the **ArchiMate** standard for enterprise architecture
    management, in which _process_ (more precisely, **Business Process**) is just
    one of dozens of available object types used to describe the organization and
    the interrelationships between its elements. Those elements can be grouped with
    different layers that represent categories, such as business or technology, as
    well as aspects such as passive structure or active structure, all of which help
    categorize the elements of a diagram.


    In ArchiMate, as shown in _Figure 6.5_, business processes are part of the business
    layer and contain elements such as **Business Actor**, **Business Role**, **Business
    Function**, **Business Event**, **Business Service**, **Business Object**, and
    **Product**. Note that here, **Value Stream** is in the **Strategy** layer.


    _Figure 6.5_ also shows just a few of the ArchiMate objects that are available,
    such as the **Strategy**, **Business**, and **Application** layers. For a complete
    overview of ArchiMate’s notation, which contains over 60 object types and 11 relationships,
    check out the image provided in this book’s repository: `https:// github.com/PacktPublishing/Practical-Business-Process-Modeling-and-
    Analysis/tree/main/Chapter06`.'
  merge: -1
  img_proc: true
