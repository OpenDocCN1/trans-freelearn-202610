- pgno: 271
  md: 'Sub-processes aren’t only useful when we want to document our process with
    several hierarchically connected diagrams split for better readability. They also
    support the very important concept of reusing some standard service that’s available
    in the organization.


    # ## Call activity


    We saw an example of this approach in our complaint handling process, where there’s
    a sub-process called **Product shipping**. An additional example was visible in
    _Figure 8.46_, where we had a sub-process for money transfer processing that has
    some (standard) way of executing defined bank transfers.


    Cases like this – that is, situations where we don’t refer to a separate part
    of our process, but to some standard way of doing things – require a different
    kind of sub-process: a **call activity**. A call activity can be recognized very
    easily as it has a characteristically thick border, drawn with a single continuous
    line.


    ![](img/a4c90ee3d142c33743706d37c65779c2_271_0.png)


    Figure 8.48 – Call activity sub-process


    However, the differences between ordinary embedded sub-processes and call activities
    go much deeper. The contents of an ordinary embedded sub-process should be executed
    within the same lane as the sub-process linked with it (this is why, in the diagram
    describing the refunds, I didn’t use a pool or lane).


    Since we have a situation where a **child** diagram is called by its **parent**,
    the lower-level diagram must have a plain start event (without a trigger). This
    shows that this process doesn’t start by itself but is called by the higher-level
    process.


    In our case, this is quite intuitive because we wouldn’t want a situation where
    someone from the finance team starts making refunds on their own, without a request
    from the complaint handling team.


    On the other hand, when we use a call activity, the fact that this sub-process
    is placed in a particular lane of a higher-level diagram doesn’t determine where
    the work will be done within the lower-level diagram. Since the process can be
    called by many other processes, we also need a plain start event, as well as additional
    start events with some triggers apart from the required one.


    An additional element that distinguishes those two types of sub-processes is the
    approach to data. Simply put, we can say that for an embedded sub-process, we
    have a rather convenient situation because all the data of the “parent” is available
    within the “child.”


    In the case of call activity, however, we have a more complex situation as our
    processes must exchange data with each other in a more formalized way. This exchange
    requires interfaces to be established that guarantee that all required data will
    be passed to the called process, but also that results will be passed back for
    further processing.'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'A good example would be sending correspondence in the form of letters. If we
    do this ourselves, then we know what to send, how to send it, and to whom. However,
    if we need to send correspondence to hundreds of clients and we use the help of
    office clerks, it isn’t enough to ask them casually to send mailings.


    We need to clearly communicate what is to be sent (a letter template or all the
    required data), specify the method of sending (an ordinary letter, an express
    letter, or maybe a letter with proof of delivery), and provide addresses. We can
    also expect to receive a summary containing information regarding letters that
    were delivered successfully and those with invalid addresses.


    In Figure 8.46, we had two end events showing how our refund could be processed.
    However, we didn’t cover the case of a failed refund. In practice, however, our
    sub-process may have several possible outcomes, and not all of them are equally
    good for us. In such a situation, we often insert an exclusive gateway after the
    sub-process to show how to deal with the different outcomes of our sub-process.


    It’s worth knowing that sub-processes aren’t only used for hierarchical modeling.
    It may also happen that the entire content of a lower-level process is contained
    in a sub-process object, which is a kind of container within which its content
    is shown. Such an approach is called inline modeling. This way of modeling sub-processes
    in an expanded form isn’t usually recommended and generally makes sense when we
    use more advanced ways of modeling, allowing us to describe exception handling
    by boundary intermediate events (something we’ll talk about in Chapter 9).


    The following illustrations (Figures 8.49, 8.50, and 8.51) show an example of
    hierarchical modeling contrasted with inline modeling:


    ![](img/a4c90ee3d142c33743706d37c65779c2_272_0.png)


    Figure 8.49 – Example of hierarchical modeling – moving to a lower- level diagram
    through an embedded sub-process


    It’s worth noting that the expanded sub-process has no plus marker at the bottom
    and looks confusingly similar to the task, but most importantly, the sequence
    flow arrow coming out of task D reaches the edge of the embedded sub-process but
    doesn’t cross it.'
  merge: -1
  img_proc: true
- pgno: 273
  md: 'This is a very important rule – the sequence flow arrow can neither cross the
    boundary of the pool nor go from the outside to the center of the expanded sub-process.
    This reads as follows: when a token coming out of task D reaches an embedded sub-process,
    it activates it. In the start event located in the sub-process, another token
    is born and flows, triggering tasks E and F in turn. When it reaches the end event,
    it’s consumed and the embedded sub-process is considered to be finished, which
    causes our main token, which has been patiently waiting, to move on (in this case,
    to the end event).


    ![](img/a4c90ee3d142c33743706d37c65779c2_273_0.png)


    Figure 8.50 – Using an embedded sub-process for inline modeling


    Such a way of modeling takes up even more space than if we didn’t separate the
    elements into sub-processes but drew them within the main process. That’s why
    you can sometimes see diagrams whose authors have taken the opportunity to omit
    start and end events, as mentioned previously. This is a perfectly allowed way
    of modeling, but I try to avoid it because it can be a bit confusing for people
    who aren’t familiar with BPMN.


    ![](img/a4c90ee3d142c33743706d37c65779c2_273_1.png)


    Figure 8.51 – An inline sub-process without start and end events


    While sub-processes are very helpful for making diagrams easier to read by hiding
    some complexity, there are also times when we’ll decide that it makes sense to
    add some elements to the diagram because they provide valuable information that
    offsets the increased diagram size. One of the most important aspects is the topic
    of responsibilities in a process. We’ll cover this next.


    # # Responsibilities in a process – pools and lanes


    As we already know, BPMN lets us describe not only what happens within a process
    of our organization, but also how we interact with other entities. For this purpose,
    we use pools and lanes.


    A pool represents a participant in a process, whereas a lane represents a logical
    division of that pool. Both the pool and the lane are always represented as rectangles,
    but the name of the pool is usually separated from its contents by a line, while
    the lane has no such line.'
  merge: -1
  img_proc: true
- pgno: 274
  md: '![](img/a4c90ee3d142c33743706d37c65779c2_274_0.png)


    Figure 8.52 – A pool with two lanes


    Interestingly, in BPMN, a pool can represent both the organization that performs
    the process and a

    department of that organization or another business role. The key issue is perspective
    as we assume

    that within the pool, the process is controlled in some way. This could be control
    resulting from the

    fact that the process has been automated and its steps are governed by a workflow
    application. Of

    course control can also be exercised by the owner of the process, who makes sure
    that the process is

    done properly, and no problems arise in it.


    While both approaches are possible, I recommend modeling processes according to
    the assumption

    that the pool represents the entire organization, and the lanes represent individual
    departments and

    organizational units. This way of modeling supports the thinking of process management
    as a team sport.


    Let’s go back to the lanes – they always represent some kind of sub-partition
    of the pool, but we have

    a lot of freedom here. In theory, lanes could order tasks as, for example, value-adding
    or value-

    enabling, but in practice, lanes are often used to show responsibility for individual
    process steps. In

    this case, lanes correspond to organizational units or roles


    The alternative approach, in which each unit has its own process and messages
    are exchanged with

    other pools, may seem tempting if the scope of our optimization project is about
    a single department

    or team because we can ignore what others need to do in a process. However, it
    tends to reinforce silo

    thinking, so it isn’t a recommended modeling method.'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'These two approaches translate into different ways of naming pools. Often,
    a pool bears the name of a participant it represents. However, it’s quite common
    – especially for models created for process automation on platforms that have
    this requirement – that the pool has the same name as the process that flows in
    it. A similar approach can also be found in simple modeling tools that have no
    other place to enter the name of the process being described.


    As we have already seen in our example diagram, BPMN allows us to describe a pool
    with content, but also to show that there’s a process participant with whom we
    exchange messages, without showing the detailed process of this participant.


    In this case, we use a collapsed (black-box) pool, whose contents are not shown.
    Such a pool has no line separating the name from the content (because there is
    none), and its name is usually shown in the middle. Please note that you could
    also add a normal pool and leave it empty.


    ![](img/a4c90ee3d142c33743706d37c65779c2_275_0.png)


    Figure 8.53 – Collapsed (black-box) pool


    One of BPMN’s unique features is its support for showing how the process of one
    participant interacts with other participants. While other process modeling notations
    allow us to show who’s responsible for what with different kinds of lanes, BPMN
    allows much more.


    # ## Private processes


    The first interesting difference is that in BPMN, processes can be defined as
    private or public. A **private process** describes, at the appropriate level of
    detail, what’s going on in the organization being analyzed. They can be used for
    documentation and analysis purposes (**non-executable** private process model)
    or process automation purposes (**executable** private process model).


    By design, an executable diagram should contain much more technical information
    to automate the process, such as user forms, technical expressions to control
    the flow of the process through different paths (depending on the data that’s
    received), and more.


    A diagram that’s used for documentation, on the other hand, can contain only as
    much detail as what’s needed for the purpose for which it was created. _Figure
    8.54_, which shows a simplified version of our process, shows what a diagram that’s
    been created as process documentation may look like (it would also likely have
    descriptions of the process steps, but they’ve been hidden here).'
  merge: -1
  img_proc: true
- pgno: 276
  md: Figure 8.54 – Example process shown as a private process for documentation purposes
  merge: -1
  img_proc: true
- pgno: 277
  md: '# # Responsibilities in a process – pools and lanes


    Interestingly, from a formal point of view, we don’t always have to insert the
    pool into our diagram.

    The specification allows us to omit it for one selected process. So, once again,
    it invokes the concept

    of invisible default elements.


    I don’t recommend this way of saving space because for many audiences, the view
    of lanes dividing

    the invisible pool is highly confusing, and additionally, by getting rid of the
    lanes, we make it more

    difficult to see who’s responsible for which steps within the process.


    # # Public processes


    A **public process**, on the other hand, is used to show only those elements of
    the process that are relevant

    to the communication between the participants (basically, elements related to
    sending and receiving

    messages). A public process is a abridged version of a private process that allows
    us to quickly show

    business partners what they need to know about our way of doing business, without
    burdening them

    with unnecessary information about process steps that don’t interest them.'
  merge: -1
  img_proc: true
- pgno: 278
  md: '# Figure 8.55 – Example process shown as a public process'
  merge: -1
  img_proc: true
- pgno: 279
  md: '# # Collaboration diagrams


    Let’s go a little further and show how different participants work together using
    **collaboration diagrams**. These contain two or more pools (expanded or collapsed)
    between which messages are exchanged.


    Often, collaboration looks like the example we know from _Figure 8.1_ – within
    the main pool, we have all the necessary process steps, not only those needed
    for message exchanges. Additional pools can be collapsed or contain their processes
    inside.'
  merge: -1
  img_proc: true
