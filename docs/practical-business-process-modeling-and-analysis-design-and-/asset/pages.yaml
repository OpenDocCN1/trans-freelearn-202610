- pgno: 329
  md: 'Figure 9.38 shows a possible diagram of a process where all the mentioned rules
    are handled with tasks and gateways. As you can see, it is not very easy to read.
    If we need to change some values (e.g., 50 USD to 100 USD), this will take some
    time. If we need to add more rules or change their combinations, the situation
    becomes difficult. Spotting places where something is wrong with our rules is
    nearly impossible. Now, let’s see how this could be simplified with DMN.


    # ## Basics of DMN


    While DMN itself is a relatively new standard (DMN 1.0 was officially published
    in 2015), it is based on many best practices of business rules management experts.
    Just like BPMN, it can be used for documentation purposes, but also for automation.


    A graphical model that allows decisions to be documented in DMN is called **Decision
    Requirement Diagram (DRD)**. _Figure 9.39_ shows a very simple example DRD that
    could help us document our customer complaint process.


    As you can see, there are a few elements of DMN here, such as **Decision**, **Input
    Data**, and **Knowledge Source**. Other, more advanced ones, such as **Business
    Knowledge Model**, plus two types of **Decision Service**, are not shown.


    ![](img/a4c90ee3d142c33743706d37c65779c2_329_0.png)


    **Figure 9.39 – Simple DRD**


    The rectangles (**Complaint routing**, **Complaint category**, **Customer category**,
    and **Fraud analysis**) are **decisions**. In DMN, they show places where some
    input data needs to be analyzed to come up with some results (outputs).


    The oval shapes (**Purchase confirmation** and **Complaint value**) are **input
    data**. They represent data needed as input for the decisions.


    The element with three straight lines and one wavy (**Complaint handling guidelines**)
    is a **Knowledge Source**. It represents elements that influence decisions, such
    as regulations or pieces of legislation.


    DMN also offers several types of lines that connect objects. The solid line is
    called **Information Requirement**. The dashed line with a black dot is called
    **Authority Requirement**. There are also several other types of arrows not used
    in our example.'
  merge: -1
  img_proc: true
- pgno: 330
  md: '# # 330 Advanced BPMN


    While the graphical model showing the connections between decisions, input data,
    and other elements can be useful for a better understanding, it does not help
    us solve our problems with the complexity of decisions. For this purpose, we need
    another DMN element: **decision tables**.


    A decision table allows us to show, clearly and unambiguously, which combinations
    of input data lead to which outputs (i.e., the results of our decision). This
    is very useful as documentation, but even more powerful when used for automation.


    ![](img/a4c90ee3d142c33743706d37c65779c2_330_0.png)


    Figure 9.40 – Decision table


    _Figure 9.40 shows a simple example of a decision table. Each row represents a
    rule. Columns 2 (**Purchase confirmed**) to 6 (**Fraud possible**) represent inputs
    needed to make a decision. Column 7 (**Routing**) shows the output, which is the
    result of our decision. Column 8 (**Comments**) allows us to add some background
    information to those rules._


    As you can see, decision tables are meant to be easy to read and use. For example,
    the first row shows that if there is no confirmation that the item was bought
    from our company, the complaint will be automatically rejected, and we do not
    care about other inputs.


    The second row is also easy to read. If we know that the customer bought from
    us and that the item could be faulty due to our error (either in production, packaging,
    or shipping), we want to save time for the customer and the company, and we accept
    the case of known issues automatically.


    In rows 3 to 5, things start to get more interesting. Purchase is confirmed, but
    this time, we are not sure why the problem occurred. That’s why we will need to
    ask our employee to investigate the case.


    Those three rows are needed because we achieve the same results, but based on
    different inputs. Row 3 shows that if the value of the complaint is over 50 USD,
    we want a manual check due to the high value. Rows 4 and 5 cover cases when the
    value is up to 50 USD, but we have different categories of customers, while for
    long-time customers, we are concerned about possible fraud.


    To understand those rules better, we need to learn about an additional important
    concept covered by DMN: **Friendly Enough Expression Language (FEEL)**. Let’s
    take a look at the values in the **Complaint value** column. In row 3, we have
    > 50, while in rows 4 and 5, we have <= 50. As you may expect, this shows for
    which complaint amounts which rule will be applied.'
  merge: -1
  img_proc: true
- pgno: 331
  md: 'FEEL offers many types of operators. For numbers, we could use comparisons
    (less than, greater than,

    or equal to) or ranges. For example, ]30..50] would mean a range from over 30
    (but without it) to 50.

    There are also operators for texts. For example, row 5 shows that for customers
    of the “Long-time”

    type with a risk of fraud, we will trigger a manual check. Row 4 applies to all
    customers who are not

    of the “Long-time” category.


    DMN allows many interesting possibilities for process professionals. It can make
    automation much

    easier and reduce the risk of misunderstandings because the diagrams and decision
    tables make it

    abundantly clear what should be done in which situation. This is a very valuable
    extension to BPMN.

    However, as you will see next, there are other ways to extend BPMN to make it
    more valuable for

    both business and technical users.


    # BPMN fit for business


    Apart from extending BPMN with technical attributes for the purpose of automating
    processes or

    combining it with other OMG standards, it is also possible to link it with other
    attributes, objects,

    and models to support other business scenarios.


    Many vendors of EBPA tools add special attributes to BPMN diagrams so that they
    can be used for

    different purposes. I will show an example ADONIS from BOC Group where the so-called
    fit for

    business BPMN is available. You can learn more about this topic at https://docs.boc-group.

    com/adonis/en/docs/17.0/sample-models.


    Let’s go back to our complaint-handling process. How could we extend it? Apart
    from providing

    meaningful descriptions that could serve as documentation for people responsible
    for performing

    this process, most probably, we would like to specify roles in the organization
    that are responsible

    for executing tasks, along with people accountable for approving results and keeping
    them consulted

    and informed (RACI). We would also probably like to give process performers documents
    containing

    best practices and how-tos, mention which applications are used, how this step
    can be improved, and

    how we measure KPIs, what the risks are (e.g., fraud), how long it takes to perform
    this process step,

    and how much it costs.


    In the GitHub repository that contains the resources for this chapter (https://github.com/

    PacktPublishing/Practical-Business-Process-Modeling-and-Analysis/

    tree/main/Chapter09), you can find more information about extending BPMN, as well
    as

    examples showing elements such as risk management, simulations, and more.


    The key thing is that the elements of BPMN that you’ve learned about in this book
    are universal

    and the same from tool to tool. If your tool supports BPMN Diagram Interchange,
    you can move

    diagrams between tools so that you can work with business users in one tool, and
    when you have a

    vision of a future state process, you can move the diagram to the automation tool,
    where it can be

    extended by IT specialists with technical details. Therefore, you can use your
    BPMN skills not only

    to document processes, but also to analyze and improve them, as well as plan digital
    transformation

    and process automations.'
  merge: -1
  img_proc: true
- pgno: 332
