    the cultural aspect of work may be slightly different in those regions, applying
    our strategies to teams that practice diversity and empathy should result in similar
    results.


    +   - Each author brings unique expertise to this publication. The coalescence
    of our experience and, at times, conflicting opinions should present you with
    an objective view of the topic, highlighting angles of topics where uniform truths
    may not exist. We hope that you will take our experience as you trailblaze the
