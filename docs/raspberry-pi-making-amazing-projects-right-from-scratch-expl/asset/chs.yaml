  \n- 3. 然后，使用 `mv maestro-linux-100507.tar.gz\\?file_id\\=0J315 maestro-linux-100507.tar.gz`\
  \ 移动文件。\n\n- 4. 输入 `tar -xvf maestro-linux-100507.tar.gz` 解压文件。这会创建一个名为 `maestro_linux`\
  \ 的目录。输入 `cd maestro_linux` 进入该目录，然后输入 `ls`；你应该会看到类似这样的内容：\n\n![](img/631e8b200cce187082ee46b0eb1681b3_498_0.png)\n\
  \n`README.txt` 文档中会给出关于如何安装软件的明确说明。遗憾的是，你不能在树莓派上运行 **MaestroControlCenter**；它使用的\
  \ Windows 版本不支持图形界面，但你可以通过 **UscCmd** 命令行应用程序来控制舵机。首先，输入 `./UscCmd --list`，你应该会看到以下内容：\n\
  \n![](img/631e8b200cce187082ee46b0eb1681b3_499_0.png)\n\n设备识别到了你的舵机控制器。如果你直接输入 `./UscCmd`，就可以看到所有可以发送给控制器的命令：\n\
  \n![](img/631e8b200cce187082ee46b0eb1681b3_499_1.png)\n\n```python\n#!/usr/bin/python\n\
  import serial\nimport time\n\ndef setAngle(ser, channel, angle):\n    minAngle =\
  \ 0.0\n    maxAngle = 180.0\n    minTarget = 256.0\n    maxTarget = 13120.0\n  \
  \  scaledValue = int((angle / ((maxAngle - minAngle) / (maxTarget - minTarget)))\
  \ + minTarget)\n    commandByte = chr(0x84)\n    channelByte = chr(channel)\n  \
  \  lowTargetByte = chr(scaledValue & 0x7F)\n    highTargetByte = chr((scaledValue\
  \ >> 7) & 0x7F)\n    command = commandByte + channelByte + lowTargetByte + highTargetByte\n\
  \    ser.write(command)\n    ser.flush()\n\nser = serial.Serial(\"/dev/ttyACM0\"\
  , 9600)\n\n# Home position\n\nfor i in range(0, 9):\n    setAngle(ser, i ,90)\n\n\
  ser.close()\n```\n\n以下是对代码的解释：\n\n- `#!/usr/bin/python`：第一行用于让这个 Python 文件可以从命令行直接执行。\n\
  - `import serial`：这一行导入串行库。你需要串行库来通过 USB 与设备通信。\n- `def setAngle(ser, channel, angle)`：这个函数将你期望的舵机和角度设置转换为舵机电机控制器所需的串行命令。要了解用于控制舵机的代码细节，请参阅\
  \ https://www.pololu.com/docs/0J40。\n- `ser = serial.Serial(\"/dev/ttyACM0\", 9600)`：这会打开与舵机控制器之间的串口连接。\n\
  - `for i in range(0, 9)`：使用 For 循环访问全部九个舵机。\n- `setAngle(ser, i, 90)`：现在，你可以将每个舵机设置到中间（初始）位置。默认是将每个舵机设置为\
  \ 90 度。如果你的腿部不在中间位置，你可以通过调整每个舵机上舵盘的位置来进行校正。\n\n要访问串口，你需要确保已安装 Python 串行库。如果没有安装，请输入\
  \ `apt-get install python-serial`。安装串行库后，你可以通过输入 `python quad.py` 来运行程序。\n\n一旦设置好基本的初始位置，你就可以让机器人做一些动作了。我们先让双足机器人活动一下脚部。下面是\
