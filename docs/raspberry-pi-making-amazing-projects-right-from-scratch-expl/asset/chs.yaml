  现在，我们准备输入详细信息来创建用户并开始使用 WordPress 网站。输入详细信息，你就成功创建了它。


  对你来说，继续这个过程并尝试在树莓派上运行一个功能齐全的网站，看看它如何处理运行一个包含自定义主题、图片等的重量级网站时的负载，将是一个有趣的练习。


  ### 总结


  本章是前两章的总体延伸，扩展了之前构建的网络概念，并使用它们在我们的内网上设置了一个 Web 服务器。


  在本章中，我们在树莓派上安装了 Apache Web 服务器。为了设置 WordPress 网站，我们安装了所有依赖项，包括 PHP 和 MySQL。然后我们下载了
  WordPress 文件并设置了一个 MySQL 数据库来与其配合使用。


  最后，我们配置了安装并解决了我们产生的错误，最终完成了完整安装。


