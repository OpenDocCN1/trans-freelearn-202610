  \ False)\n\n    while GPIO.input(echo_pin)==0:\n        start = time.time()\n\n\
  \    while GPIO.input(echo_pin)==1:\n        end = time.time()\n\n    duration =\
  \ end - start\n    distance = duration * 17150\n    distance = round(distance, 2)\n\
  \    GPIO.cleanup()\n    return distance\n\nprint \"Distance: \", getDistance(),\
  \ \"cm\"\n```\n\n你还需要使用 `from compass import *` 语句导入此代码。你还将使用 time 库和 `time.sleep`\
  \ 命令，在代码中的不同语句之间添加延迟。下面是利用所有这些功能检测障碍物并向右转的代码的第一部分，也就是利用声纳传感器的 Python 代码的第一部分：\n\n\
  ![](img/631e8b200cce187082ee46b0eb1681b3_555_0.png)\n\n下面是代码的最后一部分：\n\n![](img/631e8b200cce187082ee46b0eb1681b3_556_0.png)\n\
  \n现在，这个算法相当简单；还有其他对障碍物的响应复杂得多的算法。你也会发现，通过在侧面添加声纳传感器，你的机器人实际上可以感知障碍物何时结束。你还可以提供更复杂的决策过程，来决定向哪个方向转弯以避开物体。此外，还有许多不同的寻路算法。参见\
  \ http://www.academia.edu/837604/A_Simple_Local_Path_Planning_Algorithm_for_Autonomous_Mobile_Robots\
  \ 中的示例。你可以利用本章中构建的基本功能来探索这些更复杂的算法。\n\n### 小结\n\n你现在已经为机器人增加了路径规划的能力。你的机器人现在不仅可以从\
  \ A 点移动到 B 点，还可以避开可能挡路的障碍物。在下一章中，你将学习如何为双足机器人添加摄像头。这将为你的机器人感知周围世界带来一套全新的方式。\n"
- "## 第 6 章 为你的双足机器人添加视觉\n\n既然你的双足机器人已经能够站起来并移动、能够发现障碍物，并且知道如何规划路径，你现在就可以让它自主移动了。不过，你可能希望机器人追踪颜色或运动。\n\
  \n在本章中，你将学习：\n\n- 如何为双足机器人添加网络摄像头\n- 如何为双足机器人添加 RaspiCam\n- 如何安装和使用 OpenCV（一个开源视觉软件包）\n\
  - 如何让双足机器人追踪运动\n\n### 在双足机器人上安装摄像头\n\n具备视觉能力对双足机器人来说是一个真正的优势；你将在许多不同的应用中使用这一功能。幸运的是，添加视觉硬件和软件既容易又便宜。就视觉硬件而言，有两种选择。你可以为系统添加\
  \ USB 网络摄像头，也可以添加专为树莓派设计的 RaspiCam 摄像头。\n\n\n\n\n\n## 在树莓派上安装 USB 摄像头\n\n连接 USB\
  \ 摄像头非常简单。只需将其插入 USB 插槽即可。为确保设备已连接，请输入 `lsusb`。您应该会看到以下内容：\n\n![](img/631e8b200cce187082ee46b0eb1681b3_558_0.png)\n\
  \n这里显示的是一个 Creative 摄像头，位于 Bus 001 Device 004: ID 041e:4095。为确保系统将其识别为视频设备，请输入 `ls\
  \ /dev/v*` 命令，您应该会看到类似以下内容：\n\n![](img/631e8b200cce187082ee46b0eb1681b3_558_1.png)\n\
  \n`/dev/video0` 就是摄像头设备。现在设备已连接，让我们实际看看能否捕获图像和视频。有多种工具可以访问摄像头，但其中一款带有视频控制功能的简单程序名为\
  \ `luvcview`。要安装它，请输入 `sudo apt-get install luvcview`。应用程序安装完成后，您需要运行它。为此，您需要直接连接显示器，或者能够通过远程\
  \ VNC 连接（如 `vncserver`）访问树莓派，因为显示图像需要图形界面。\n\n通过这种方式连接后，请在树莓派上打开终端窗口并运行 `luvcview`。您应该会看到类似以下内容：\n\
  \n![](img/631e8b200cce187082ee46b0eb1681b3_559_0.png)\n\n不用担心图像质量，您将在视觉框架 OpenCV\
  \ 中捕获和处理图像。\n\n## 在树莓派上安装 RaspiCam\n\n在树莓派上感知外部世界的另一个选择是使用 RaspiCam。安装这款摄像头要稍微复杂一些；您需要将其连接到树莓派上的一个专用连接器。以下是摄像头及其专用连接器的图片：\n\
  \n![](img/631e8b200cce187082ee46b0eb1681b3_560_0.png)\n\n您可能还想为摄像头加装保护盖；组装后看起来如下：\n\
  \n![](img/631e8b200cce187082ee46b0eb1681b3_560_1.png)\n\n现在您可以着手将摄像头连接到树莓派了。摄像头需要安装到树莓派上标有\
  \ Camera 的连接器中。要了解具体操作方法，请观看 http://www.raspberrypi.org/help/camera-module-setup/\
  \ 上的视频。\n\n摄像头连接好后，您需要使用 `raspi-config` 工具启用摄像头。输入 `sudo raspi-config`，然后选择 Enable\
  \ Camera（启用摄像头），如下面的截图所示：\n\n![](img/631e8b200cce187082ee46b0eb1681b3_561_0.png)\n\
  \n## 为您的双足机器人添加视觉\n\n现在重新启动树莓派。如果您在远程计算机上开发并希望查看图像，则需要在计算机和树莓派之间打开 `vncserver` 连接。详情请参阅第\
  \ 1 章“配置和编程树莓派”。要使用摄像头拍照，只需输入 `raspistill -o image.jpg`。这将使用摄像头拍摄一张照片，并将图像存储到 `image.jpg`\
  \ 文件中。拍好照片后，您可以通过打开树莓派图像查看器来查看它：选择左下角的 Menu（菜单）图标，然后依次选择 Accessories（附件）和 Image\
  \ Viewer（图像查看器），如下面的截图所示：\n\n![](img/631e8b200cce187082ee46b0eb1681b3_562_0.png)\n\
  \n打开**image.jpg**文件，您应该会看到照片的效果：\n\n![](img/631e8b200cce187082ee46b0eb1681b3_563_0.png)\n\
  \n在通过树莓派摄像头使用 OpenCV 之前，您需要做两件事。首先，需要添加一个 Python 库，名为 `picamera`。要获取它以及所需的库，请输入\
  \ `sudo apt-get install python-picamera python3-picamera python-rpi.gpio`。其次，您需要输入\
  \ `sudo modprobe bcm2835-v4l2`。现在，树莓派摄像头就可以用于下一节中的 OpenCV 示例了。\n\n## 下载并安装 OpenCV——一个功能完备的视觉库\n\
  \n现在摄像头已经连接好了，您可以开始体验开源社区提供的一些强大功能。打开一个终端窗口并输入以下命令：\n\n- 1. `sudo apt-get update`：您将下载许多新的软件包，因此最好先确保所有内容都是最新的。\n\
  - 2. `sudo apt-get install build-essential`：尽管您之前可能已经执行过此操作，但此库对于构建 OpenCV 至关重要。\n\
  - 3. `sudo apt-get install libavformat-dev`：该库提供了一种对音频和视频流进行编码和解码的方法。\n- 4. `sudo\
  \ apt-get install ffmpeg`：该库提供了一种转码音频和视频流的方法。\n- 5. `sudo apt-get install libcv2.4\
  \ libcvaux2.4 libhighgui2.4`：此命令会显示基本的 OpenCV 库。请注意命令中的数字。随着 OpenCV 新版本的出现，这个数字几乎肯定会变化。如果\
  \ 2.4 不起作用，请尝试 3.0 或在 Google 上搜索 OpenCV 的最新版本。\n- 6. `sudo apt-get install python-opencv`：这是\
  \ OpenCV 所需的 Python 开发套件，因为您将使用 Python。\n- 7. `sudo apt-get install opencv-doc`：此命令将显示\
  \ OpenCV 的文档，以备您需要时查阅。\n- 8. `sudo apt-get install libcv-dev`：此命令会显示编译 OpenCV 所需的头文件和静态库。\n\
  - 9. `sudo apt-get install libcvaux-dev`：此命令会显示更多用于编译 OpenCV 的开发工具。\n- 10. `sudo\
  \ apt-get install libhighgui-dev`：这是另一个提供编译 OpenCV 所需的头文件和静态库的软件包。\n- 11. 现在输入 `cp\
  \ -r /usr/share/doc/opencv-doc/examples /home/pi/`。这会将所有示例复制到您的主目录。\n\n现在 OpenCV\
  \ 已安装完成，您可以尝试其中一个示例。进入 `/home/pi/examples/python` 目录。执行 `ls`，您会看到一个名为 `camera.py`\
  \ 的文件。这个文件包含了捕获和显示图像流的最基础代码。在运行代码之前，先用 `cp camera.py myCamera.py` 复制一份。然后，编辑文件使其看起来如下所示：\n\
  \n```\n```python\nimport cv2.cv as cv\nimport time\n\ncv.NamedWindow(\"camera\"\
  , 1)\n\ncapture = cv.CaptureFromCAM(0)\ncv.SetCaptureProperty(capture, 3, 360)\n\
  cv.SetCaptureProperty(capture, 4, 240)\n\nwhile True:\n    img = cv.QueryFrame(capture)\n\
  \    cv.ShowImage(\"camera\", img)\n    if cv.WaitKey(10) == 27:\n        break\n\
  \ncv.DestroyAllWindows()\n```\n```\n\n您需要添加的两行代码就是带有 `cv.SetCaptureProperty` 的两行；它们会将图像分辨率设置为\
  \ 360×240。要运行此程序，您需要在树莓派上连接显示器和键盘，或者使用 `vncviewer`。运行代码时，您应该会看到如下所示的窗口：\n\n![](img/631e8b200cce187082ee46b0eb1681b3_565_0.png)\n\
  \n如果您使用的是 RaspCam 却看不到图像，则需要运行 `sudo modprobe bcm2835-v4l2` 命令。现在您可以看到外部世界了！\n\n\
  您可能需要调整分辨率，为您的应用找到最佳设置。更大的图像固然很好——它们能让您更细致地观察世界——但也会占用显著更多的处理能力。当您真正让系统执行实际的图像处理时，您会更深入地体验这一点。如果您打算使用\
  \ `vncserver`，请注意系统性能，因为它会显著降低更新速率。尺寸（宽度/高度）为两倍的图像将需要四倍的处理量。现在，您可以利用这一功能来完成许多令人印象深刻的任务。\n\
  \n## 边缘检测与 OpenCV\n\n幸运的是，OpenCV Python 示例集中有一个名为 `edge.py` 的程序。以下是该文件的内容（已删除空行）：\n\
  \n![](img/631e8b200cce187082ee46b0eb1681b3_566_0.png)\n\n该程序使用 OpenCV 实现的 Canny\
  \ 图像检测算法来查找任意图像中的边缘。有关 Canny 边缘算法的更多信息，请参阅 http://das1.mem.drexel.edu/alumni/bGreen/www.pages.drexel.edu/_weg22/can_tut.html\
  \ 或 http://opencv-python-tutroals.readthedocs.org/en/latest/py_tutorials/py_imgproc/py_canny/py_canny.html\
  \ 。您之前捕获过一张图像；可以使用此程序查看边缘，并了解设置不同阈值如何显示更多或更少的边缘。使用之前捕获的图像运行该程序，您将看到以下结果：\n\n![](img/631e8b200cce187082ee46b0eb1681b3_567_0.png)\n\
  \n\n\n\n\n## 为你的双足机器人添加视觉\n\n你会注意到顶部有一个阈值滑块设置。如果你将此阈值调高，它会找到更少的边缘——即具有更大阈值的边缘。设置为\
  \ 30 的图片如下所示：\n\n![](img/631e8b200cce187082ee46b0eb1681b3_568_0.png)\n\n### 颜色和运动查找\n\
  \nOpenCV 和你的网络摄像头也可以追踪彩色物体。如果你想让你的双足机器人跟随一个彩色物体，这将非常有用。OpenCV 通过提供一些高级库使这变得异常简单，这些库可以帮助我们完成此任务。要实现这一点，你需要编辑一个文件，使其看起来像以下屏幕截图中所示：\n\
  \n![](img/631e8b200cce187082ee46b0eb1681b3_570_0.png)\n\n让我们具体看看使隔离彩色球成为可能的代码：\n\
  \n- `hue_img = cv.CvtColor(frame, cv.CV_BGR2HSV)`: 这一行创建了一个新图像，该图像根据 **色相**（颜色）、**饱和度**\
  \ 和 **值（HSV）** 的值存储图像，而不是原始图像的 **红色**、**绿色** 和 **蓝色（RGB）** 像素值。转换为 HSV 更专注于颜色的处理，而非照射到其上的光量。\n\
  - `threshold_img = cv.InRangeS(hue_img, low_range, high_range)`: `low_range, high_range`\
  \ 参数决定了颜色范围。在这种情况下，它是一个橙色球，因此你想检测橙色颜色。有关使用色相指定颜色的良好教程，请参阅 http://www.tomjewett.com/colors/hsb.html。另请参阅\
  \ http://www.shervinemami.info/colorConversion.html，其中包含一个程序，你可以通过选择特定颜色来确定你的值。\n\
  \n运行程序。如果看到一个纯黑图像，移动此窗口，你将同时看到原始图像窗口。现在，拿起你的目标（在本例中为一个橙色乒乓球）并将其移入画面。你应该会看到如下屏幕截图中所示的内容：\n\
  \n![](img/631e8b200cce187082ee46b0eb1681b3_571_0.png)\n\n注意阈值图像中显示球所在位置的白色像素。你可以添加更多\
  \ OpenCV 代码来给出球的实际位置。在我们球位置的原始图像文件中，你实际上可以在球周围绘制一个矩形作为指示器。编辑文件使其如下所示：\n\n![](img/631e8b200cce187082ee46b0eb1681b3_572_0.png)\n\
  \n添加的行如下所示：\n\n- `hue_image = cv2.cvtColor(frame, cv2.COLOR_BGR2HSV)`: 这一行从捕获的 RGB\
  \ 图像创建了一个色相图像。当尝试捕获真实世界图像时，色相更容易处理；详情请参阅 http://www.bogotobogo.com/python/OpenCV_Python/python_opencv3_Changing_ColorSpaces_RGB_HSV_HLS.php。\n\
  - `threshold_img = cv2.inRange(hue_image, low_range, high_range)`: 这会创建一个新图像，其中仅包含在\
  \ low_range 和 high_range n 元组之间的像素。\n- `contour, hierarchy = cv2.findContours(threshold_img,\
  \ cv2.RETR_TREE, cv2.CHAIN_APPROX_SIMPLE)`: 这会在 threshold_img 图像中找到轮廓，即相似像素的组。\n\
  - `center = contour[0]`: 这标识了第一个轮廓。\n- `moment = cv2.moments(center)`: 这找到了该像素组的矩。\n\
  - `(x,y),radius = cv2.minEnclosingCircle(center)`: 这给出了将包围该像素组的最小圆的 x 和 y 位置以及半径。\n\
  - `center = (int(x),int(y))`: 找到 x 和 y 位置的中心。\n- `radius = int(radius)`: 圆的整数半径。\n\
  - `img = cv2.circle(frame,center,radius,(0,255,0),2)`: 在图像上绘制一个圆。\n\n现在代码已准备就绪，你可以运行它。你应该会看到如下屏幕截图所示的内容：\n\
  \n![](img/631e8b200cce187082ee46b0eb1681b3_573_0.png)\n\n你现在可以追踪你的物体。你可以通过更改 low_range\
  \ 和 high_range n 元组来修改颜色。你也有物体的位置，因此你可以使用该位置为你的机器人进行路径规划。\n\n### 总结\n\n你的双足机器人可以行走，使用传感器避障，规划路径，甚至可以看到障碍物或目标。在最后一章中，你将学习如何远程连接你的双足机器人，以便你可以控制它并监控它，而无需线缆。\n"
- "## 7 远程访问你的双足机器人\n\n现在你的双足机器人已经运行起来了，你会想要让它进入世界，但仍然能够远程监控和控制它。这将有助于你的开发以及部署，并将开启各种新的场景和应用。\n\
  \n在本章中，你将学习：\n\n- 如何为你的双足机器人添加一个无线 LAN 适配器并将其设置为无线接入点\n- 如何使用此接入和一个摇杆控制你的双足机器人\n\
  - 如何使用无线 LAN 连接获取第一人称视频（FPV），以便你可以看到你的双足机器人所看到的内容\n\n### 添加无线适配器并创建接入点\n\n在第 1 章《配置和编程\
  \ Raspberry Pi》中，你学习了如何添加无线适配器并让 Raspberry Pi 连接到你的无线网络。这是一种访问 Raspberry Pi 的有用方式，但如果你想将你的机器人带到无线\
  \ LAN 覆盖范围之外，你需要将其设置为接入点。\n\n执行此操作的第一个步骤是安装无线 LAN 设备。一个价格便宜且易于配置的设备是 Edimax Wifi\
  \ Adapter 设备（产品信息可在 http://www.edimax.com/edimax/merchandise/merchandise_detail/data/edimax/global/wireless_adapters_n150/ew-7811un\
  \ 获取）。它可在大多数在线电子商店获得：\n\n![](img/631e8b200cce187082ee46b0eb1681b3_576_0.png)\n\n\
  一旦你安装了设备并启动 Raspberry Pi，输入 lsusb 命令。这应该会显示如下屏幕截图中的内容：\n\n![](img/631e8b200cce187082ee46b0eb1681b3_576_1.png)\n\
  \nEdimax 设备列在连接到 USB 端口的设备集中。\n现在，执行以下步骤：\n\n1. 通过输入 `sudo apt-get install hostapd`\
  \ 确保你已安装 `hostapd`。此应用程序是一个后台应用程序，控制 Raspberry Pi 上无线配置。\n2. 默认版本的 `hostapd` 不幸地默认不支持\
  \ Edimax 芯片组。因此，你需要通过输入 `wget http://www.daveconroy.com/wp3/wp-content/uploads/2013/07/hostapd.zip`\
  \ 下载一个支持的版本。\n3. 现在，通过输入 `unzip hostapd.zip` 解压此文件。\n4. 通过输入 `sudo mv /usr/sbin/hostapd\
  \ /usr/sbin/hostapd.bak` 备份你的原始 `hostapd` 应用程序。这样，如果你以后想恢复它，你就有它了。\n5. 现在，通过输入 `sudo\
  \ mv hostapd /usr/sbin/hostapd.edimax` 将新版本的 `hostapd` 移动到正确目录。\n6. 对于下一步，输入 `sudo\
  \ ln -sf /usr/sbin/hostapd.edimax /usr/sbin/hostapd`；这将创建一个软链接到新文件，以便它作为 `hostapd`\
  \ 应用程序执行。\n7. 输入 `sudo chown root.root /usr/sbin/hostapd`，这将更改此文件的拥有者和组为 root。\n\
  8. 输入 `sudo chmod 755 /usr/sbin/hostapd` 使此文件对拥有者可执行。\n9. 现在你需要配置你的无线接入点。通过输入 `sudo\
  \ emacs /etc/hostapd/hostapd.conf` 编辑文件，使其看起来像以下屏幕截图：\n\n    ![](img/631e8b200cce187082ee46b0eb1681b3_577_0.png)\n\
  \n10. 你现在需要编辑 `/etc/network/interfaces` 文件，如以下屏幕截图所示：\n\n    ![](img/631e8b200cce187082ee46b0eb1681b3_578_0.png)\n\
  \n11. 这将把接入点的地址设置为 **10.10.0.1**。\n\n12. 现在，输入 `sudo apt-get install isc-dhcp-server`\
  \ 安装一个 dhcp 服务器，以便连接到它的设备能够获得动态地址。\n\n13. 现在，编辑 `/etc/dhcp/dhcpd.conf` 并添加这些行：\n\
  \n    ![](img/631e8b200cce187082ee46b0eb1681b3_578_1.png)\n\n\n\n14. 下一步是编辑 /etc/default/hostapd，以便在开机时启动所有服务，通过添加以下行：\n\
  \n![](img/631e8b200cce187082ee46b0eb1681b3_579_0.png)\n\n15. 现在输入以下两个命令；sudo update-rc.d\
  \ hostapd enable 和 sudo update-rc.d isc-dhcp-server enable，然后重启 Raspberry Pi。\n\n\
  现在你应该能够作为无线接入点连接到你的 Raspberry Pi。\n\n## 添加摇杆遥控器\n\n现在你可以通过远程计算机访问 Raspberry Pi，可以\
  \ SSH，就像你可能使用有线连接时所做的那样，发出命令，甚至使用远程计算机控制双足机器人。这引入了许多不同的可能性，其中之一就是使用连接到远程计算机的摇杆来控制你的项目。\n\
  \n要添加游戏控制器，你首先需要找到一个可以连接到计算机的游戏控制器。如果你使用的是 Microsoft Windows 作为主机计算机的操作系统，几乎任何可以连接到\
  \ PC 的 USB 控制器都可以使用。如果使用 Linux 作为远程计算机，同类型的控制器也适用。事实上，你可以使用另一台 Raspberry Pi 作为远程计算机。\n\
  \n由于摇杆将连接到远程计算机，你需要运行两个程序：一个在远程计算机上运行，一个在双足机器人上的 Raspberry Pi 上运行。你还需要一种在它们之间通信的方式。在以下示例中，你将使用无线局域网接口和客户端-服务器通信模型。你将在远程计算机上运行服务器程序，并在双足机器人上的\
  \ Raspberry Pi 上运行客户端程序。\n\n> 有关这种模型及其在游戏应用中使用的优秀教程，请参阅 http://www.raywenderlich.com/38732/multiplayer-game-programming-for-teens-with-python。\n\
  \n第一步是简单地将你的 USB 游戏控制器插入远程计算机。一旦将控制器连接到远程计算机，你需要在 Raspberry Pi 上创建一个 Python 程序，该程序将接收从远程计算机客户端发送的信号并将其发送到在\
  \ Raspberry Pi 上运行的服务器，以便你可以向双足机器人的舵机发送正确的信号。\n\n在执行此操作之前，你需要在 Raspberry Pi 上安装将使此功能正常工作的库。第一个是名为\
  \ pygame 的库。通过输入 sudo apt-get install python-pygame 安装它。你还需要通过输入 sudo apt-get install\
  \ python-setuptools 安装一套 Python 安装工具。然后，你需要一个名为 PodSixNet 的 LAN 通信层库。这将允许两个应用程序，即远程计算机上的客户端和在\
  \ Raspberry Pi 上运行的服务器进行通信。要安装它，请按照 http://mccormick.cx/projects/PodSixNet/ 上的说明进行操作。现在你可以在双足机器人的\
  \ Raspberry Pi 上创建程序了。程序的第一部分是你在第 3 章《双足机器人的运动》中创建的程序中的 Python 函数。在本节中，你将创建一个名为\
  \ QuadGame 的类。此类将接收连接到服务器的游戏控制器的输入，并将其转换为将发送到双足机器人舵机控制器的命令。\n\n以下是这些控制的表格：\n\n|\
  \ Joystick control | Biped control |\n|---|---|\n| Button 2 | Robot home position\
  \ |\n| Button 1 | Robot turn right |\n| Button 3 | Robot turn left |\n| Joystick\
  \ Up | Robot walk forward |\n\n现在，以下是代码的初始部分，即 Python 导入语句：\n\n![](img/631e8b200cce187082ee46b0eb1681b3_581_0.png)\n\
  \n以下是 BoxesGame 类，即将响应摇杆的代码：\n\n![](img/631e8b200cce187082ee46b0eb1681b3_581_1.png)\n\
  \n## 远程访问你的双足机器人\n\n这是代码的有趣部分。此代码接收来自远程计算机的输入并将其转换为动作。第一个 if 语句确定从连接有摇杆的远程计算机发送的数据类型。它可以是按钮按下，其中\
  \ data[\"type\"] == 10，然后语句 data[\"info\"][\"button\"] == 2 确定按钮 2 已被按下。在这种情况下，这将发送命令，使机器人移动到初始位置。如果\
  \ if data[\"type\"] == 7;，则这是一个摇杆事件，并且 if data[\"info\"][\"value\"] < - 0.9，则这将确定摇杆处于向上位置，机器人应向前移动。\n\
  \n以下是客户端程序的摇杆控制器部分的最后部分，以供完整参考：\n\n![](img/631e8b200cce187082ee46b0eb1681b3_582_0.png)\n\
  \n这最后一段代码初始化游戏循环，该循环在接收输入时将其发送到舵机控制器，然后发送到飞行控制器。\n\n你还需要在远程计算机上运行一个服务器程序，该程序将接收来自游戏控制器的信号并将其发送到客户端。你将使用\
  \ Python 版本 2.7 用 Python 编写此代码，可以从这里安装。此外，你还需要安装 pygame 库。如果你使用的是远程计算机上的 Linux，则输入\
  \ sudo apt-get install python-pygame。如果你使用的是远程机器上的 Microsoft Windows，则按照 http://www.pygame.org/download.shtml\
  \ 上的说明进行操作。\n\n你还需要前面描述的 LAN 通信层。你可以在 http://mccormick.cx/projects/PodSixNet/ 上找到可在\
  \ Microsoft Windows 或 Linux 上运行的版本。以下是服务器代码的两个部分的列表：\n\n![](img/631e8b200cce187082ee46b0eb1681b3_583_0.png)\n\
  \n## 远程访问你的双足机器人\n\n这第一部分创建了三个类：\n\n- 1. 第一个，class ClientChannel，建立了项目的通信通道。\n-\
  \ 2. 第二个，class BoxServer，设置了一个服务器，以便你可以将摇杆动作传达给双足机器人上的 Raspberry Pi。\n- 3. 最后，第三个类，Game，只是初始化了一个包含你所需的一切的游戏。\n\
  \n以下是代码的后半部分：\n\n![](img/631e8b200cce187082ee46b0eb1681b3_584_0.png)\n\n这部分代码初始化摇杆，以便所有控制都可以发送到双足机器人的\
  \ Raspberry Pi。\n\n你需要在两台计算机上运行这些程序，输入连接到摇杆的远程计算机的 Internet 地址。以下是在远程计算机上运行程序时的外观，在运行远程计算机上的程序之前：\n\
  \n![](img/631e8b200cce187082ee46b0eb1681b3_585_0.png)\n\n以下是程序在 Raspberry Pi 上运行并连接到机器人时的外观：\n\
  \n![](img/631e8b200cce187082ee46b0eb1681b3_585_1.png)\n\n最后，以下是当机器人的 Raspberry Pi\
  \ 启动并连接时，程序在远程计算机上的外观：\n\n![](img/631e8b200cce187082ee46b0eb1681b3_586_0.png)\n\n\
  现在你可以使用摇杆远程控制你的机器人！\n\n## 添加远程查看功能\n\n你的双足机器人现在可以从远程计算机获取信息并响应摇杆按键，但你可能希望能够通过网络摄像头看到双足机器人所看到的内容。这使用网络摄像头、vncserver\
  \ 和你在 *第 6 章， 为你的双足机器人添加视觉* 中使用的功能很容易配置。使用此方法，你可以轻松获得双足机器人所看到的图片，它应该类似于以下内容：\n\n\
  ![](img/631e8b200cce187082ee46b0eb1681b3_587_0.png)\n\n现在你既可以看到你的机器人正在去哪里，又可以通过摇杆控制它。\n\
  \n## 总结\n\n就是这样，但这真的只是开始。你的机器人有一些基本动作和一些基本控制能力，但现在你应该也有知识和技能将你的双足机器人提升到更远的水平。你可以教它如何跳舞，跟随手势，以及你能想象到的几乎任何事情。\n"
