  \ Python 文件中。\n\n## 你的机器人的动态路径规划\n\n现在你已经能够看到障碍物并知道方向，接下来你需要进行动态路径规划。动态路径规划简单来说就是，你无法预先了解整个环境中所有可能的障碍物。你的机器人必须在实际移动过程中决定如何前进。这可能是一个复杂的主题，但你可以先了解并应用一些基础知识，让你的机器人在环境中移动。让我们先解决“知道要去哪里，并且需要在没有障碍物的情况下执行路径”的问题，然后再加入障碍物。\n\
  \n### 基本路径规划\n\n为了讨论动态路径规划，即在不知道会遇到什么障碍物的情况下规划路径，你需要一个框架来了解机器人的位置以及确定目标的位置。一种常见的框架是\
  \ *x-y* 网格。以下是这种网格的示意图：\n\n![](img/631e8b200cce187082ee46b0eb1681b3_549_0.png)\n\
  \n\n\n\n\n## 路径规划与你的双足机器人\n\n有三个关键点：\n\n- 左下角点是一个固定参考位置。*x* 和 *y* 方向也是固定的，所有其他位置都将相对于该位置和这些方向进行测量。\n\
  - 另一个关键点是机器人的起始位置。机器人将利用自己的 *x* 坐标（相对于某个固定参考位置在 *x* 方向上的位置）和 *y* 坐标（相对于某个固定参考位置在\
  \ *y* 方向上的位置）来持续跟踪自己的位置，直到到达目标。它将使用罗盘来跟踪这些方向。\n- 第三个关键点是目标的位置，同样以相对于固定参考位置的 *x*\
  \ 和 *y* 坐标给出。如果你知道机器人的起始位置和起始角度，就可以规划到该目标的最优（最短距离）路径。为此，你可以使用目标位置和机器人位置，通过一些相当简单的数学运算计算机器人到目标的距离和角度。\n\
  \n要计算距离，请使用以下方程：\n\n$$d = \\sqrt{(X_{goal}-X_{robot})^2 + (Y_{goal}-Y_{robot})^2}$$\n\
  \n使用以下方程告诉你的机器人需要行进多远才能到达目标。第二个方程将告诉你的机器人需要行进的角度：\n\n$$\\theta = \\arctan\\left(\\\
  frac{Y_{goal}-Y_{robot}}{X_{goal}-X_{robot}}\\right)$$\n\n下图是这两项信息的图形表示：\n\n![](img/631e8b200cce187082ee46b0eb1681b3_551_0.png)\n\
  \n既然你已经有了目标角度和距离，就可以对机器人进行编程，让它移动。为此，你将编写一个执行路径规划的程序，并调用你在*第 3 章“双足运动”*中创建的运动函数。不过，你需要知道机器人每步行进的距离，这样才能以步数而不是距离单位来告诉机器人要行进多远。\n\
  \n你还需要能够换算机器人在转弯过程中可能走过的距离；不过，这个距离可能太小，无关紧要。如果你知道了角度和距离，就可以让机器人移动到目标。\n\n下面是你将编程实现的步骤：\n\
  \n- 1. 以单位计算机器人到达目标所需行进的距离。将其转换为达到该距离所需的步数。\n- 2. 计算机器人到达目标所需行进的角度。你将使用罗盘和机器人转弯函数来实现该角度。\n\
  - 3. 现在，以正确的次数调用步进函数，使机器人移动正确的距离。\n\n就这么简单。现在，我们将使用一些非常简单的 Python 代码来执行此操作，这些代码使用函数让机器人前进和转弯。在这种情况下，创建一个名为\
  \ `robotLib.py` 的文件是合理的，其中包含所有实际舵机设置函数，用于让双足机器人向前迈步和转弯。然后，你可以使用 `from robotLib import\
  \ *` 语句导入这些函数，你的 Python 程序就可以调用它们了。这使路径规划 Python 程序更小、更易于管理。对于罗盘程序，你也会这样做，即使用 `from\
  \ compass import *` 命令。\n\n> 有关如何将函数从一个 Python 文件导入另一个 Python 文件的更多信息，请参考 http://www.tutorialspoint.com/python/python_modules.htm\
  \ 。\n\n下面是该程序的清单：\n\n![](img/631e8b200cce187082ee46b0eb1681b3_552_0.png)\n\n在此程序中，用户输入目标位置，机器人首先通过读取角度来决定到达期望角度的最短方向。为简单起见，机器人被放置在网格中，并朝向\
  \ 0 度角方向。如果目标角度小于 180 度，机器人将向右转；如果大于 180 度，机器人将向左转。机器人会一直转弯，直到期望角度与测量角度相差几度以内。然后，机器人迈出相应的步数以到达目标。\n\
  \n### 避开障碍物\n\n如你所见，在无障碍物的情况下规划路径相当容易。然而，当你的机器人需要绕过障碍物行走时，就会变得更具挑战性。让我们看一个例子：在你之前计算的路径上出现了一个障碍物。它可能如下图所示：\n\
