  ```\n\n接下来，我们解压 .tgz 归档文件，假设它已下载到主文件夹。如果路径不同，我们需要输入正确的路径：\n\n```\ntar -xzvf ~/Gal.tgz\n\
  ```\n\n导航到文件夹：\n\n```\ncd Gal\n```\n\n我们需要使用 Makefile 在树莓派上成功构建 GalaxSee。为此，在终端中打开文件：\n\
  \n```\nnano Makefile\n```\n\n然后，将行：\n\n```\ncc = mpicc\n```\n\n改为：\n\n```\ncc =\
  \ mpic++\n```\n\n## 使用树莓派构建自己的超级计算机\n\n这将执行程序并打开一个新窗口，看起来如下：\n\n![](img/631e8b200cce187082ee46b0eb1681b3_216_0.png)\n\
  \n这里，白点是相互作用的物体，受重力作用。GalaxSee 中有一些你可以配置的选项来改变物体的数量或它们的相互作用。例如，运行以下命令：\n\n```\n\
  `./GalaxSee 200 400 10000`\n```\n\n这里，程序的第一个参数 200 给出要模拟的物体的数量。第二个参数给出模拟的速度。数字越高，速度越快。第三个参数给出模拟运行的时间，单位为毫秒。因此，在前面的命令中，我们将模拟\
  \ 200 个物体 10 秒。显然，我们可以尝试不同的变量，看看这些变量如何影响模拟。\n\n前面的示例是在单个树莓派上运行的。但正如所承诺的，我们现在将了解如何在集群上运行它。如果我们了解到该程序可以用单个命令在树莓派集群上运行，而且我们之前见过该命令，可能会令人惊讶。以下命令可以实现：\n\
  \n```\n`mpiexec -f ~/machinefile -n 3 ./GalaxSee`\n```\n\n在前面的命令中，mpiexec 在我们的主机计算机上启动\
  \ MPI 进程。这里，我们将为其提供三个数据点来执行 GalaxSee 程序。它们如下：\n\n- 包含网络中每个设备的 IP 地址的文件的路径\n- 要使用的设备数量\n\
  - 可执行文件的路径\n\n-f 选项指定 machinefile。-n 选项指定要使用的设备数量，最后，我们向其提供 GalaxSee 可执行文件。\n\n\
  自己试试！如果你尝试在单个树莓派上增加模拟中的物体数量，它可能会运行得更慢。但如果你在集群上尝试同样操作，它肯定会运行得更快，因为现在我们有更多可用的计算资源。\n\
  \n## 总结\n\n本章的独特之处在于，我们学习了如何不仅在单个树莓派上执行软件，而且在多个树莓派上执行。我们学习了使用并行计算的优势，并学习了如何构建我们自己的树莓派集群网络。我们还学习了如何安装并行计算所需的库，以便在集群中运行自己的软件。我们学习了如何配置网络中的树莓派，使它们能够相互通信并使通信无忧。一旦我们设置了系统，我们就对其进行了测试以测量响应形式为延迟。\n\
  \n最后，我们了解了 N 体模拟的概念，并配置了一个开源程序来模拟它。我们还看到了增加模拟中物体的数量如何影响程序执行的速度。\n\n在下一章中，我们将扩展关于集群的知识，并学习高级网络概念，例如\
  \ DNS 和 DHCP。我们将学习如何添加诸如域名服务和节点自动检测等功能，以及如何启动集群节点的远程关闭。\n"
- '## 12


  ## 使用树莓派进行高级网络


  在上一章中，我们构建了一个树莓派集群，它们在公共网络上相互交互，以比单个树莓派快得多的速度完成单一任务。事实上，MPI 库基本上是一个网络库，它将一些计算委托给网络中连接的其他处理器，以便主节点不必处理它们。现在，在本章中，我们将学习为这类集群计算机提供支持的特殊网络概念，事实上，整个互联网也是如此。在本章中，我们将学习关于：


  - 为我们的集群添加 DHCP 功能

  - 为我们的集群添加域名系统功能

  - 编写节点自动检测脚本

  - 编写集群节点远程关闭脚本


  ## 介绍 DHCP


  DHCP（动态主机配置协议）：主机只是一个服务器，这意味着主机计算机负责提供服务。服务可以是任何种类。例如，Web 服务器负责托管查看网站所需的文件。同样，服务器实现必要的通信协议以允许许多玩家相互对战。使用服务器提供的服务的计算机或应用程序称为客户端。现在你可能知道，互联网上的每台计算机都由一个唯一的地址标识，称为
  IP 地址。






  DHCP 服务器负责为网络中的所有节点分配此类 IP 地址，并跟踪已分配的地址。在 DHCP 中，dynamic 表示不断变化，host 表示服务器，configuration
  指配置你的网络设置，而 protocol 表示做事的一套规则。接下来描述的是 DHCP 服务器分配 IP 地址的流程。


  假设一个节点想要加入网络。它首先向服务器发送一条消息请求分配 IP 地址。服务器发送一条消息，其中包含一个 IP 地址和节点可以保留该 IP 地址的时间段。然后服务器在表中记录下分配给节点的
  IP 地址，以及分配时间和有效时长。


  现在，当节点加入网络时，它无法知道是否存在 DHCP 服务器。因此它向整个网络发送广播信号，仅 intended for DHCP 服务器。如果存在服务器，它会发送回复提供一个地址。


  现在，考虑节点正在关机或干净地离开网络的情况。它向服务器发送信号识别自身并将 IP 地址归还给 DHCP 服务器。然后服务器修改表，从 IP 地址中删除主机名，然后将其标记为可分配给网络中其他节点的地址。但如果节点没有干净地退出怎么办？例如，当机器断电或网络电缆被直接拔出时。这时分配的时间段就派上用场了。一旦该
  IP 地址的分配时长已过，节点就会自动从表中删除，该地址再次变得可用。每当服务器从主机接收到数据包时，其分配时长会自动刷新。


  ## 一些网络概念


  既然我们已经了解了 DHCP 服务器的工作原理，我们现在将介绍一些与网络相关的重要概念，这些概念有助于理解网络的运行以及调试我们可能遇到的任何错误。


  乍一看可能不像，但 IP 地址遵循预定义的一套约定，并不是随机分配的。可见的 IP 地址，例如 192.168.1.10，实际上是由二进制数字组成的。每个用小数点分隔的数字实际上是一个二进制八位组。所以前面的
  IP 地址实际上看起来如下：


  ```

  11000000 10101000 00000001 00001010

  ```


  现在，我们继续介绍子网掩码的概念。子网掩码基本上是一个 32 位地址，用于将 IP 地址划分为网络地址和主机地址。子网掩码将网络的全部位设为 1，将主机的全部位设为
  0。因此，不同类别网络的子网掩码如下所示：


  - Class A: 255.0.0.0

  - Class B: 255.255.0.0

  - Class C: 255.255.255.0


  Class D 和 Class E 没有子网地址，因为 Class D 有多播地址，而 Class E 仅由保留地址组成。


  ## 配置 Raspberry Pi 作为 DHCP 服务器


  现在，我们将通过设置集群中的一台 Raspberry Pi 作为 DHCP 服务器，对前述概念进行动手实现。用于此目的的 Raspberry Pi 应该正确标记以便识别，因为网络中只能有一个
  DHCP 服务器。多个服务器会引起很多问题！如果我们在同一个网络中有多个 DHCP 服务器，客户端节点会困惑该向哪个服务器发送 IP 分配请求。我们首先需要安装一个名为
  dnsmasq 的程序，可以使用以下命令完成：


  ```

  sudo apt-get update

  sudo apt-get install dnsmasq

  ```


  安装完成后，我们可以继续断开 LAN 的互联网连接并将网络连接到非 DHCP 集线器。为什么，你可能会问？因为我们使用的常规路由器内置了 DHCP 服务器。因此将
  Raspberry Pi 配置为服务器并将其连接到路由器可能会引起一些问题。所以我们只需将其连接到互连所有节点的网络集线器。我们现在准备修改 Raspberry
  Pi 使其作为服务器运行。


  按照惯例，DHCP 服务器将在网络的 IP 地址范围内具有最低的 IP 地址。对于许多私有网络，这个 IP 地址空间如下所示：192.168.0.x。这意味着
  DHCP 服务器通常将 192.168.0.1 作为 IP 地址，而其他节点将具有 192.168.0.2、3、4 等，直到 254 个 IP 地址。因此，逻辑上我们需要我们的
  Raspberry Pi 具有此地址并保留它，以便每次网络启动时都默认为 DHCP 服务器。因此，编辑网络接口文件：


  ```

  sudo nano /etc/network/interfaces

  ```


  在接口文件中，eth0 指的是以太网端口的连接。如果你连接了一个 Wi-Fi 适配器，你还会看到一个 wlan0 接口。这相当于无线局域网 0。现在，由于我们的
  Pi 通过以太网端口连接，我们找到以下语句：


  ```

  iface eth0 inet dhcp

  ```


  基本上，这一行负责 Raspberry Pi 充当 DHCP 客户端，因为它告诉 Pi 从接口 eth0 尝试从 DHCP 服务器获取 IP 地址。但由于我们希望我们的
  Raspberry Pi 在网络中充当 DHCP 服务器，我们注释掉这一行。然后，为了为服务器设置静态 IP 地址，我们添加以下行：


  ```

  # iface eth0 inet dhcp

  auto eth0

  iface eth0 inet static

  address 192.168.1.1

  netmask 255.255.255.0

  ```


  接口文件可能看起来像这样：


  ![](img/631e8b200cce187082ee46b0eb1681b3_223_0.png)


  static 选项告诉 Raspberry Pi 配置静态 IP 地址和子网掩码，如下面的语句所示。现在，通过按 Ctrl + X 并按 Enter 保存此文件。要重新启动网络服务，输入以下命令：


  ```

  sudo service networking restart

  ```


  最后，确保其他 Raspberry Pi 没有与我们的 DHCP 服务器冲突的静态 IP 地址。最好不要有任何 Pi 配置了静态 IP。`/etc/network/interfaces`
  文件应如下所示：


  ```

  iface eth0 inet dhcp

  # auto eth0

  # iface eth0 inet static

  # address 192.168.1.1

  # netmask 255.255.255.0

  ```


  退出 nano 并使用以下命令重新启动网络服务：


  ```

  sudo service networking restart

  ```


  现在，我们可以将所有客户端 Raspberry Pi 连接到网络集线器。一旦全部开机，它们应该能够立即从 DHCP 服务器获取各自的 IP 地址。我们也可以通过在客户端上运行
  `ifconfig` 命令来检查已分配的 IP 地址。IP 地址是从分配给 DHCP 服务器的范围内随机分配的。


  一旦获取 IP 地址，一切应该按预期工作。我们可以通过从另一个节点 ping 不同节点来检查连接。使用以下命令执行此操作：


  ```

  ping 192.168.1.x

  ```


  其中 x 是另一个节点的 IP 地址。我们也可以通过以下方式检查与 DHCP 服务器的连接：


  ```

  ping 192.168.1.1

  ```


  使用此设置可以进行另一个有趣的实验，即观察连接的上下变化。首先，我们可以关闭一个客户端并观察它将 IP 地址归还给服务器。在你选择的客户端上运行以下命令：


  ```

  sudo ifdown eth0

  ```


  这样做后，我们会看到类似以下的输出：


  ```

  Listening on LPF/eth0/b8:27:eb:a8:6b:cc

  Sending on   LPF/eth0/b8:27:eb:a8:6b:cc

  Sending on   Socket/fallback

  DHCPRELEASE on eth0 to 192.168.1.1 port 67

  ```


  DHCPRELEASE 是客户端将 IP 地址交还给服务器的实际语句。同样，我们重新启动 eth0 并观察 DHCP 地址被获取。运行以下命令：


  ```

  sudo ifup eth0

  ```


  我们会看到类似以下的输出：


  ```

  Listening on LPF/eth0/b8:27:eb:a8:6b:cc

  Sending on   LPF/eth0/b8:27:eb:a8:6b:cc

  Sending on   Socket/fallback

  DHCPDISCOVER on eth0 to 255.255.255.255 port 67 interval 7

  DHCPREQUEST on eth0 to 255.255.255.255 port 67

  DHCPOFFER from 192.168.1.1

  DHCPACK from 192.168.1.1

  bound to 192.168.1.X -- renewal in 40000 seconds

  ```


  在此交换中，DHCPDISCOVER、DHCPREQUEST、DHCPOFFER 和 DHCPACK 很重要。它们与通过 DHCP 服务器获取 IP 地址的获取流程相对应，如前所述。读者可自行研究它们各自的功能。


  ## 介绍域名系统 DNS


  在上一节中，我们学习了如何将 DHCP 服务器添加到我们的 Raspberry Pi 集群中。这主要是为了让集群中的每个 Raspberry Pi 都能通过唯一的
  IP 地址被识别。现在，正如你所能想象的，我们的集群越大，记住每个 Raspberry Pi 的 IP 地址就越困难。人类很难记住长串数字，而 IP 地址就是这样。但有一种方法可以让我们在不必记住
  IP 地址的情况下轻松连接到不同节点。


  这种方法称为域名系统 DNS。其基本功能是将 IP 地址翻译成单词，以便我们更容易记住。例如，DNS 服务器会将 IP 地址 192.168.5.43 翻译成
  raspberrypi.org，反之亦然，以便更轻松地连接。事实上，互联网上就是这样发生的。每个网站背后都有一个 IP 地址。






  当你在浏览器中输入一个 URL 时，你的计算机首先会联系 DNS 服务器，并询问与之关联的 IP 地址。DNS 服务器随后会在其数据库中搜索该名称，并将 IP
  地址返回给你的计算机。整个过程被称为 DNS 查询。


  现在，我们可以在单个网络中拥有多个 DNS 服务器。这样，当一个 DNS 服务器在其数据库中没有保存地址时，它可以将查询传递给第二个 DNS 服务器，以此类推。这被称为迭代
  DNS 查询。这就是互联网上实际发生的情况。互联网上有数百万个网站，拥有一个保存大型数据库的单一 DNS 服务器不仅不可行，而且也不可靠。因此，有数百万个 DNS
  服务器分布在世界各地，共同协作以解析来自数百万客户端的数十亿次转换请求。


  > 但这里有一个有趣的问题。在 DHCP 网络中，IP地址是动态的，这意味着节点的 IP 地址可能会发生变化。想想 DNS 服务器可能会如何处理这种情况。你可以把它作为练习来做。


  ## 在 Pi 上设置 DNS 服务器


  现在，我们将学习在我们自己的 Raspberry Pi 集群上设置域名系统服务器的实际操作，以便学习系统的复杂性。我们将在之前设置 DHCP 服务器的同一台 Pi
  上设置 DNS 服务器。由于我们已确保它可以从其他客户端 Raspberry Pi 中轻松识别，因此我们可以开始设置过程。


  我们使用的是与 DHCP 服务器相同的软件 dnsmasq，因为它也具有运行 DNS 服务器的能力。除此之外，我们不需要安装任何额外内容。作为健全性检查，在开始以下教程之前，请尝试从其中一个客户端
  ping 服务器。虽然可以配置多个 DNS 服务器，但为了本教程的目的，我们将只使用一台 Raspberry Pi 作为服务器。


  由于 DNS 服务器不像 DHCP 那样具有广播系统，客户端无法轻松找到它。因此它们需要被告知 DNS 服务器的 IP 地址，而一种方法是让 DHCP 服务器将
  IP 地址传递给客户端。这可以在 DHCP 服务器分配其自己的 IP 地址的同时完成。在这种情况下，DHCP 服务器和 DNS 服务器的 IP 地址是相同的。使用以下命令打开
  dnsmasq 配置文件（dnsmasq.conf）进行编辑：


  ```

  sudo nano /etc/dnsmasq.conf

  ```


  我们要做的第一件事是指定 DNS 服务器和 DHCP 服务器的 IP 地址是相同的。为此，在文件末尾添加以下行：


  ```

  dhcp-option=6,192.168.1.1

  ```


  现在客户端知道 DNS 服务器位于何处，我们需要创建一个包含 IP 地址与其对应名称的查找数据库。虽然在实际的 DNS 服务器中使用更复杂的数据库平台，例如 SQL，但在这里我们将使用一个简单的文本文件作为演示。将以下两行添加到配置文件中：


  ```

  no-hosts

  addn-hosts=/etc/hosts.dnsmasq

  ```


  这里，no-hosts 行告诉 dnsmasq 忽略默认的 /etc/hosts 文件用于 DNS 查询。而下一行指定应使用我们自己的文件 /etc/hosts.dnsmasq
  进行 DNS 查询。


  下一步是创建我们的 hosts 文件。为此，输入以下命令：


  ```

  sudo nano /etc/hosts.dnsmasq

  ```


  由于该文件之前不存在，我们现在应该正在编辑一个空白文件。可以在特定格式下添加新条目，即 IP 地址，后跟一个制表符，后跟名称。例如：


  ```

  192.168.1.1    server

  ```


  这里，第一部分是 IP 地址，第二部分是制表符间距，第三部分是与该 IP 地址关联的名称。


  > 我们必须添加制表符而不是多个空格才能使其工作。


  现在，保存并退出此文件。确保服务器是连接到网络交换机的唯一设备。在重新启动 dnsmasq 服务之前，先拔掉所有其他设备。使用以下命令重新启动服务：


  ```

  sudo service dnsmasq restart

  ```


  但还有一件事。由于我们的服务器使用静态 IP 地址设置，我们还需要告诉 DHCP 服务器使用其自己的 DNS 服务器。我们通过名为 /etc/resolv.conf
  的文件来完成此操作。通过以下方式打开它进行编辑：


  ```

  sudo nano /etc/resolv.conf

  ```


  将文件内容更改为：


  ```

  nameserver 127.0.0.1

  ```


  现在，127.0.0.1 是一个保留的 IP 地址，用于指代自己的系统。因此，如果我们将 192.168.1.1 作为 IP 地址，效果也是一样的。但是，如果服务器的
  IP 地址发生变化，我们就需要手动更改此文件。因此，我们将 127.0.0.1 作为 nameserver 的 IP 地址。退出文件并重新启动网络服务：


  ```

  sudo service networking restart

  ```


  最后，将所有客户端 Raspberry Pi 连接到网络集线器。它们应该开始接收分配的 IP 地址。一旦所有 Pi 都连接到网络，你可以运行：


  ```

  ping server

  ```


  你将开始收到响应。如果成功，则意味着 ping 请求首先被传递到服务器 Pi 内部的 DNS 服务器，并在主机名解析后，从服务器的 IP 地址获得了响应。


  ## 为 Web 服务器配置设置


  假设，例如，其中一台 Raspberry Pi 配置为 Web 服务器。因此，现在的任务将是设置集群，以便你可以在浏览器中输入一个名称并加载 Web 服务器的主页！


  按照惯例，Web 服务器应该具有静态 IP 地址。这样 DNS 服务器就可以存储其主机名，而不必担心 IP 地址发生变化。由于我们之前将可能的整个 IP 地址范围设为
  DHCP 服务器的范围，我们将修改该范围，以便我们可以为我们的 Web 服务器保留一些静态 IP 地址。为此，再次编辑 `/etc/dnsmasq.conf`
  文件并将 `dhcp-range` 变量修改为以下内容：


  ```

  dhcp-range=192.168.1.40,192.168.1.254,255.255.255.0,12h

  ```


  这样，我们现在就有从 192.168.1.2 到 192.168.1.39 的非 DHCP IP 地址，可以分配给 Web 服务器。实现此目的的一种方法是修改
  Web 服务器本身上的 `/etc/network/interfaces` 和 `/etc/resolv.conf`，并设置 Web 服务器始终获取静态 IP
  地址。但我们也可以通过其 MAC 地址来识别 Web 服务器，这是网络接口的唯一硬件地址，并每次都为其分配相同的 IP 地址。


  这需要修改 dnsmasq.conf 文件。我们需要知道我们的 Web 服务器 Pi 的 MAC 地址。为此，可以在新终端中执行 ifconfig 并查找 hwaddr
  字段；它将采用 b8:27:eb:a8:6b:cc 的形式。请记住此地址对每个设备都是唯一的。一旦我们有了此地址，我们将在服务器 Pi 上的 dnsmasq.conf
  文件中添加以下行，为此 MAC 地址分配特定的 IP 地址：


  ```

  dhcp-host=b8:27:eb:a8:6b:cc,192.168.1.5

  ```


  这将配置 DHCP 服务器始终为此 MAC 地址分配 192.168.1.5 IP 地址。现在，我们只需要在 hosts.dnsmasq 文件中为我们的 Web
  服务器添加一个名称。使用 nano 打开它进行编辑，并在文件末尾添加以下行：


  ```

  192.168.1.5  webserver

  ```


  这样，最终看起来像这样：


  ![](img/631e8b200cce187082ee46b0eb1681b3_230_0.png)


  通过以下方式重新启动 dnsmasq 服务以使更改生效：


  ```

  sudo service dnsmasq restart

  ```


  最后，我们必须让 Web 服务器 Pi 采用新的 IP 地址，以便它可以在 DNS 服务器中通过名称寻址。为此，执行以下命令：


  ```

  sudo ifdown eth0

  sudo ifup eth0

  ```


  这将使 Raspberry Pi 与 DHCP 服务器断开连接；当它尝试重新获取 IP 地址时，DHCP 服务器将分配我们在配置文件中定义的静态 IP 地址。






  要测试 DNS 服务器是否与 Web 服务器配合工作，可以从其他客户端 Pi 中的任意一个运行以下命令：


  ```bash

  ping webserver

  ```


  如果得到响应，则表示 DNS 服务器已正确设置。如果没有，则需要检查是否正确遵循了所有步骤。


  ### 在网络中自动发现节点


  目前，我们的网络中设备很少。但，将会出现网络中有大量节点的情况，而手动管理它们将是一项困难的任务。在大型集群中，会有许多处于非活动或无法服务的节点。如果我们尝试使用脚本连接到它们，而该脚本中硬编码了客户端的
  IP 地址，我们将遇到大量错误。这就是为什么需要自动节点检测的原因，它可以自动检测网络中的活动节点并保存该信息，以便其他程序可以使用它。其中一个这样的程序是 MPICH，我们在上一章中学习过它。正如你可能已经学到的，每当我们使用
  MPICH 执行程序时，我们都会指定一个包含可用于计算的活动节点列表的文件名。然而，如果其中一个节点处于非活动或无响应状态，脚本将无法正常工作，并浪费宝贵的计算资源。


  为了在网络中进行节点发现，我们将使用一个名为 Nmap 的程序，意为 network map。Nmap 是一个免费的安全扫描器、端口发现和网络探索工具。使用以下命令安装它：


  ```bash

  sudo apt-get install nmap

  ```


  在这里了解更多关于 Nmap 的信息：

  https://nmap.org/.


  正如我们在第二部分中关于 IP 地址所学到的，以下 IP 地址：


  ```

  192.168.1.1

  ```


  实际上看起来像这样：


  ```

  11000000 10101000 00000001 00000001

  ```


  现在我们有了这些信息，我们可以继续学习如何使用 Nmap 工具。扫描活动 IP 地址的命令为：


  ```bash

  nmap -sP 192.168.1.0/24

  nmap -sP 192.168.1.5-100

  ```


  输出如下所示：


  ![](img/631e8b200cce187082ee46b0eb1681b3_232_0.png)


  前面的是两个独立的命令，我们将学习它们各自的作用。第一个命令扫描网络中 `192.168.1.0` – `192.168.1.255` 的整个 IP 地址范围。在此命令中，我们指定了
  24 位的掩码，这基本上告诉 Nmap 不要更改 IP 地址的前 24 位，根据我们之前学到的信息，这意味着 IP 地址的前三个数字将保持不变，只有最后一个数字会被变化并检查响应。由于我们的网络将只包含以
  `192.168.1` 开头的 IP 地址，这是由于我们的 DHCP 服务器的设置方式，这种方法很好。


  第二个命令明确指定要扫描的 IP 地址范围。当你想在特定范围内查找活动节点时，这很有用。这种用例之一是查找网络中的所有客户端节点。


  ### 摘要


  在本章中，我们在上一章奠定的基础上，深入了解了网络概念以及它们如何应用于树莓派集群。


  具体来说，我们学习了如何在树莓派上设置 DHCP 服务器，并了解了 IP 地址如何分配给不同客户端的机制。我们还观察了分配发生的确切过程。


  作为下一步，我们还设置了一个 DNS 服务器，它与 DHCP 服务器配合工作，并为 IP 地址分配名称，以便节点易于访问。使用相同的方法，我们学习了如何为基于树莓派的
  Web 服务器分配名称，以便我们可以在自己的网络上打开网站。


  最后，我们学习了可以帮助我们发现网络上活动节点的工具，这样我们就不必面对将计算分配给非活动节点的麻烦，该节点可能会导致程序崩溃或产生错误的计算。

  '
- '## 13 在树莓派上设置 Web 服务器


  在前两章中，我们讨论了树莓派的网络功能。在第 11 章《使用树莓派构建自己的超级计算机》中，我们构建了一个树莓派设备网络，它们能够相互通信并分担计算负担，从而显著减少任务完成所需的时间。在上一章第
  12 章《树莓派高级网络》中，我们学习了更高级的网络概念，如 DHCP 服务器、DNS 系统等。此外，我们还用几台 Pi 设备建立了自己的内联网。


  延续同样的主题，我们现在将在一台树莓派上设置 Web 服务器，并在其上设置 WordPress 安装。我们将使用的 Web 服务器是 Apache，因为它是目前最流行的服务器之一，并在开源社区中有着很高的使用率。在本章中，我们将涵盖以下主题：


  - 介绍和安装 Apache

  - 学习提供 HTML 网站

  - 安装 PHP 和 MySQL

  - 安装 WordPress

  - 配置 WordPress


  ### 在 Raspbian 上介绍和安装 Apache


  Apache HTTP 服务器非常流行，目前是世界上使用最广泛的 Web 服务器软件。它因由 Apache 软件基金会旗下的一群开源开发者开发和维护而受到开源社区的支持。虽然最常用于类
  Unix 系统，但它也适用于包括 Microsoft Windows 在内的多种其他操作系统。2009 年，它成为使用量超过一亿个网站的第一个 Web 服务器，目前估计它为超过
  50% 的所有网站和 37% 的顶级域名服务器提供服务。


  它如此流行的一个原因是它支持各种功能，并且可以通过可编译的模块实现更多功能，从而扩展核心功能。例如，Apache 本身可以提供 HTML 文件通过 HTTP，但安装了额外的模块后，它也可以使用
  Python 等语言提供网页。它还具有多种语言接口，包括 Python、PHP 和 Perl。


  现在，在 Raspbian 发行版上安装 Web 服务器非常容易。我们需要使用以下命令安装 apache2 包：


  ```bash

  $ sudo apt-get install apache2

  ```


  在安装过程中，包会自动创建我们的演示 HTML 文件，你可以在 URL 栏中输入 127.0.0.1 或 http://localhost/ 时看到它。我们也可以从连接到同一网络的另一台机器上通过
  Pi 的 IP 地址看到它，例如 192.168.1.5。用网络中你自己的 Pi 的 IP 地址替换此 IP 地址。你可以通过在树莓派终端中输入以下命令找到 IP
  地址：


  ```bash

  $ hostname -I

  ```


  默认页面如下所示：


  ![](img/631e8b200cce187082ee46b0eb1681b3_237_0.png)


  如果我们看到此页面，则表示我们的安装已成功。这只是一个单一的 HTML 文件，可以在 `/var/www/html/index.html` 找到。让我们查看此文件夹的详细信息。通过以下方式导航到文件夹：


  ```bash

  $ cd /var/www/html/

  ```


  然后执行以下命令查看文件夹中文件的属性：


  ```bash

  $ ls -al

  ```


  此命令列出文件及其一些属性。你将看到以下输出：


  ```

  total 20

  drwxr-xr-x 2 root root 4096 Dec 11 12:13 .

  drwxr-xr-x 4 root root 4096 Dec 11 12:21 ..

  -rw-r--r-- 1 root root 11510 Dec 11 12:13 index.html

  ```


  各列的含义分别为：


  - 文件的权限

  - 目录中的文件数

  - 拥有文件/目录的用户

  - 拥有文件/目录的组

  - 文件大小

  - 最后修改日期


  由于 index.html 文件的所有者是 root，我们需要在编辑它之前获取该文件的所有权。为此，输入以下命令：


  ```bash

  $ sudo chown pi: index.html

  ```


  我们也可以用自己的 HTML 文件替换 index.html 文件，并提供一个功能齐全的 HTML 网站，包含 CSS 类。


  然而，一个简单的 HTML 网站听起来太基础了，对吧？由于我们已接近本书的最后阶段，我们应该做一些更高级的事情。对了，在以下章节中我们将学习如何设置 WordPress
  网站。为此，我们首先需要安装 WordPress 使用的一些工具。


  ### 安装 PHP 和 MySQL


  PHP 是当今 Web 上使用最广泛的编程语言之一。它是在服务器接收到网站请求时运行的代码。与 HTML 不同，PHP 可以生成动态网页，可以即时更改外观和内容。我们选择使用
  PHP 是因为 WordPress 使用 PHP。现在，使用以下命令安装 PHP 和随附的 Apache 包：


  ```bash

  $ sudo apt-get install php5 libapache2-mod-php5

  ```


  我们现在已安装 PHP 及其随附的 Apache 包，并将继续测试它。






  ## 在树莓派上搭建网页服务器


  导航到 HTML 文件夹并创建一个新的 index.php 文件：


  ```

  $ cd /var/www/html/

  $ sudo nano index.php

  ```


  在其中添加一行测试代码：


  ```

  <?php echo "hello world"; ?>

  ```


  按 Ctrl + X，然后按 Y 保存文件并退出。我们还需要删除 index.html 文件，因为 HTML 优先于 PHP。使用以下命令执行此操作：


  ```

  sudo rm index.html

  ```


  在浏览器中导航到 127.0.0.1 或 localhost，你将会看到 hello world 消息。现在让我们设置一些静态内容。


  将 hello world 行替换为以下内容：


  ```

  <?php echo date(''Y-m-d H:i:s''); ?>

  ```


  既然我们已经安装了 PHP 来处理所需的网页，下一步是安装数据库来存储一些数据。我们选择的数据库将是 MySQL，因为 WordPress 使用它来存储诸如文章、页面、评论、用户等内容的
  ID。


  要安装 MySQL 及其 PHP 包，请运行以下命令：


  ```

  sudo apt-get install mysql-server php5-mysql

  ```


  安装继续进行时，系统会要求你设置 root 密码以创建数据库。输入密码并记住以备将来使用。


  ### 安装 WordPress


  现在我们已经完成了依赖项的安装，下一步是将 WordPress 文件放入 HTML 文件夹。幸运的是，WordPress 在此链接上提供了最新版本的 tar 归档文件：http://wordpress.org/latest.tar.gz。我们现在需要将此文件夹中包含的文件放到我们的
  Web 服务器文件夹中。为此，我们首先需要取得该文件夹的所有权。要执行整个过程，我们运行以下命令：


  ```

  $ cd /var/www/html/

  $ sudo chown pi: .

  $ sudo rm *

  $ wget http://wordpress.org/latest.tar.gz

  ```


  简而言之，我们首先导航到 HTML 文件夹，取得文件夹所有权，删除所有预先存在的文件，然后获取 WordPress 归档文件。接下来，我们解压归档文件的内容并将它们放入
  HTML 文件夹。我们使用以下命令执行此操作：


  ```

  $ tar xzf latest.tar.gz

  $ mv wordpress/* .

  $ rm -rf wordpress latest.tar.gz

  ```


  现在，如果你运行 ls 命令，将看到以下输出：


  ![](img/631e8b200cce187082ee46b0eb1681b3_240_0.png)


  ### 配置 WordPress 安装


  一旦文件正确放置在适当的位置，要激活安装并开始使用 WordPress 网站，我们首先需要设置一个 WordPress 可以使用的 MySQL 数据库。要设置数据库，请执行以下命令：


  ```

  $ mysql -uroot -p

  ```


  为了完成安装，我们需要访问位于本地主机上的 WordPress 安装页面。所以请在浏览器中输入 127.0.0.1，你将看到以下页面：


  ![](img/631e8b200cce187082ee46b0eb1681b3_242_0.png)


  欢迎使用 WordPress。在开始之前，我们需要一些关于数据库的信息。在继续之前，你需要了解以下项目。


  - 1. 数据库名称

  - 2. 数据库用户名

  - 3. 数据库密码

  - 4. 数据库主机

  - 5. 表前缀（如果要在单个数据库中运行多个 WordPress）


  我们将使用这些信息来创建 wp-config.php 文件。如果由于任何原因这个自动文件创建不起作用，不用担心。这只是在填充配置文件中的数据库信息。你也可以直接在文本编辑器中打开
  wp-config-sample.php，填写你的信息，并将其保存为 wp-config.php。需要更多帮助？我们得到它了。


  在大多数情况下，这些项目是由你的虚拟主机提供商提供的。如果你没有这些信息，那么你需要先联系他们才能继续。如果你都准备好了……


  这意味着 WordPress 已正确配置。我们现在点击**开始吧！** 继续下一步。这将带我们进入以下页面：


  ![](img/631e8b200cce187082ee46b0eb1681b3_243_0.png)


  输入数据库的所有详细信息，包括你之前设置的密码。按照前面的截图在页面上输入详细信息，然后按提交。安装向导将显示一条错误消息，提示无法将 wp-config.php
  文件写入文件系统。这里没有必要惊慌，因为它还为我们提供了 wp-config.php 文件的内容，我们可以使用这些内容手动创建该文件。错误如下所示：


  ![](img/631e8b200cce187082ee46b0eb1681b3_244_0.png)


  所以，现在复制对话框中给出的文本，并打开一个新终端。使用以下命令在 HTML 文件夹中创建一个新的 wp-config.php 文件：


  ```

  $ cd /var/www/html

  $ sudo nano wp-config.php

  ```


  继续粘贴已复制的内容。我们可以右键单击粘贴，或直接按 Ctrl + Shift + V。按 Ctrl + X 然后按 Y 保存并退出文件。创建文件后，返回浏览器并点击“运行安装”按钮。经过几秒钟的处理，页面返回以下屏幕：


