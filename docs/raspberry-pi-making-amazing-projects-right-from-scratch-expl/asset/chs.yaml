  \n\n\n\n\n## 双足运动\n\n很明显，如果你抬起一条腿，机器人会朝被抬起的腿的方向倒下。你需要做的是利用可以让机器人左右倾斜的脚踝舵机，将重心移到仍留在地面上的那条腿上方，最终达到下图所示的状态：\n\
