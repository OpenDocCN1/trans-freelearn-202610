  \n现在你有了一个稳定的基础，可以开始编写简单的行走动作了。\n\n### 基本行走动作\n\n你的机器人已经准备好行走了，但首先你得让一条腿离地。当然，这很简单；只需通过改变膝关节的角度来抬起腿，你的腿就能离地。你可能还想改变脚踝前后方向的角度；这样可以让你抬起腿时不必抬得那么高。\n\
