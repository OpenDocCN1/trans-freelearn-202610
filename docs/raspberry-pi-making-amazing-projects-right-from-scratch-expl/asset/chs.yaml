- '## 使用传感器避开障碍


  你已经构建了双足机器人。现在，你的机器人可以四处移动了。但如果你希望机器人感知外部世界，以免撞到东西，该怎么办？在本章中，你将了解如何添加一些传感器来帮助避开障碍物。


  具体来说，你将学习：


  - 如何将 Raspberry Pi 连接到 **IR（红外）** 传感器

  - 如何将 Raspberry Pi 连接到 **USB 声呐传感器** 来感知世界

  - 如何将 Raspberry Pi 及其 GPIO 连接到声呐传感器来感知世界


  ### 将 Raspberry Pi 连接到红外传感器


  你的机器人现在可以四处移动，但你会希望它能够感知障碍物或目标。实现这一点的方法之一就是使用 IR 传感器。首先，需要了解一下 IR 传感器的知识。IR 传感器由一个发射器和一个传感器组成。发射器发出一束狭窄的光线，传感器接收这束光线。


  传播过程中的差异最终体现为传感器中的角度测量值，如下图所示：


  ![](img/631e8b200cce187082ee46b0eb1681b3_522_0.png)


  不同的角度可以指示物体与传感器之间的距离。传感器将这些角度测量值转换为电压，你可以通过检测该电压来确定距离。遗憾的是，传感器的输出与距离之间并非线性关系，因此你需要进行一些校准，才能预测实际距离及其与传感器输出之间的关系。


  > IR 传感器相当精确，出错率很低；不过，如果环境光线很强，它们可能无法正常工作。精度还会受到被测物体反射特性的影响。在决定使用哪些传感器时，这可以作为一个考虑因素。


  在开始之前，你需要先准备一个传感器。其中比较流行的一种是夏普（Sharp）公司生产的廉价 IR 传感器。许多在线电子商店都有出售，并且有检测不同距离的型号。你将使用
  **Sharp 2Y0A02** 型号，该型号可检测最远 150 cm 的距离。以下是传感器的图片：


  ![](img/631e8b200cce187082ee46b0eb1681b3_523_0.png)


  你还需要确保获得该设备的连接线；通常情况下它会随设备附带。以下是连接好线缆的传感器图片：


  ![](img/631e8b200cce187082ee46b0eb1681b3_523_1.png)


  正如教程中所述，传感器输出的电压将指示距离。然而，这是一个模拟信号，而 Raspberry Pi 没有模数转换器，无法将这个模拟电压转换为可在程序中读取的数字。你需要为项目添加一个模数转换器。






  There are two choices. If you want an analog-to-digital converter that plugs directly
  into the USB interface, there is one offered by www.phidgets.com. This board is
  really quite amazing; it takes the analog signals, turns them into digital numbers
  using an analog to digital converter, and then makes them available so that they
  can be read from the USB port. The model number of this part is **1011_0 - PhidgetInterfaceKit
  2/2** and it is shown in the following:


  ![](img/631e8b200cce187082ee46b0eb1681b3_524_0.png)


  Unfortunately, it takes a bit of programming expertise to get it up and running.
  The other choice is to use an analog-to-digital converter that connects to the GPIO
  pins of the Raspberry Pi. There is a part, the **ADC pi+** from www.abelectronics.co.uk,
  that does this. It is pictured here:


  ![](img/631e8b200cce187082ee46b0eb1681b3_524_1.png)


  This device is easier to program, so this is what you''ll use in this project. Now,
  let''s connect the sensor:


  - 1. Solder header pins to the ADC Pi+ board to connect it to the ADC, like this:

  - 2. Now, plug the board into the Raspberry Pi B 2. Here is a picture of the combination:


  ![](img/631e8b200cce187082ee46b0eb1681b3_525_0.png)


  ![](img/631e8b200cce187082ee46b0eb1681b3_525_1.png)


  3. Now, you''ll connect the IR sensor to the ADC. To connect this unit, you''ll
  connect the three pins that are available at the bottom of the sensor. Here is the
  connection list:


  | ADC-DAC Board | Sensor Pin |

  | --- | --- |

  | 5V | Vcc |

  | GND | Gnd |

  | In1 | Vo |


  Unfortunately, there are no labels on the unit, but here are the pins you''ll connect:


  ![](img/631e8b200cce187082ee46b0eb1681b3_526_0.png)


  It''s easiest to connect to the three-wire cable that normally comes with the sensor.
  Once the pins are connected, you are ready to access the data from the sensor via
  a Python program on the Raspberry Pi. The entire system looks like this:


  ![](img/631e8b200cce187082ee46b0eb1681b3_527_0.png)


  Now, you are ready to add some code to read the IR sensor. You''ll need to follow
  these steps to talk to the ADC:


  - 1. The first step in enabling the ADC is to enable the I2C interface. This is
  done by running raspi-config and selecting 8 Advanced Options like this:


  ![](img/631e8b200cce187082ee46b0eb1681b3_527_1.png)


  2. Once there, go to the A7 I2C selection to enable the I2C like this:


  ![](img/631e8b200cce187082ee46b0eb1681b3_528_0.png)


  Perform all the selections to enable the I2C interface and load the library, and
  then reboot the Raspberry Pi.


  You''ll also need to edit the /etc/modules file and add the following two lines:


  ![](img/631e8b200cce187082ee46b0eb1681b3_528_1.png)


  Reboot the Raspberry Pi. You can see whether the I2C is enabled by typing `sudo
