  \ + .masterswitch-label .masterswitch-switch {\n  right: 0px;\n}\n/* END OF SWITCH\
  \ STYLES */\n```\n\n# 构建基于 Web 的控制面板\n\nWeb 控制面板样式表 - `alarm-panel.css`\n\n应用样式表后，你得到的就是这个样子，我想你会同意它看起来更好一点：\n\
  \n![](img/631e8b200cce187082ee46b0eb1681b3_404_0.png)\n\n带样式的 Web 控制面板\n\n# 使其动态化\n\
  \n现在我们已经为控制面板页面定义了布局代码，我们可以将其插入到我们的 PHP 页面中，以便 Web 服务器上的 PHP 脚本可以根据家庭安防系统的状态动态修改它。\n\
  \nPHP 脚本将帮助我们实现以下基本功能：\n\n- 使用区域开关的位置更新配置文件\n- 布防和撤防系统\n- 在检测到入侵时告诉我们哪个区域被触发\n\n\
  同样，我不会详细介绍 PHP 代码的工作原理，但希望代码中的注释能帮助你了解正在发生的事情，并且如果想改变其行为，也能帮助你进行修改。\n\n# 先做一点准备\n\
  \n除非你更改了某些 PHP 配置，否则如果代码中有小错误，排查问题会是一场噩梦，因为基本上你看到的就是...什么都没有！\n\n因此，在创建和构建我们的 PHP\
  \ 页面之前，我们将更改 PHP 配置文件中的几个设置，以确保出现任何问题时我们能够知道：\n\n- 1. 使用 Nano 打开配置文件：\n  `$ sudo\
  \ nano /etc/php5/cgi/php.ini`\n- 2. 文件有点大且难以处理，但努力找到以下设置并按如下方式更改它们：\n  `error_reporting\
  \ = E_ALL`\n  `display_errors = On`\n- 3. 保存文件并退出 Nano。\n- 4. 最后，重启 Lighty：\n  `$\
  \ sudo /etc/init.d/lighttpd restart`\n\n# 主 PHP 代码\n\n就是它了... 但不要现在就运行它——还有一点要做...\n\
  \n你可以在 `chapter 7` 的代码文件夹中 `index.php` 文件里找到完整的核心 PHP 代码。在我们的 Web 服务器内容文件夹中，现在应该有以下文件：\n\
  \n```\npi@raspberrypi ~ $ ls -l /var/www\nalarm-panel.css\nalarm-panel.html\nindex.lighttpd.html\n\
  index.php\nphpinfo.php\n```\n\n# 我是别人\n\n现在，在我们成功打开这个 PHP 网页之前，我们需要意识到一个事实：Web 服务器默认实际上是以另一个名为\
  \ `www-data` 的用户运行的。这意味着它通常没有执行某些操作的权限；特别是与文件系统交互的操作。\n\n如果你完成了之前的 PHP 脚本，你会看到它实际上执行了一些\
  \ Linux 命令来读取和更新我们的 `alarm.cfg` 文件。\n\n正如我们因为不是 root 用户而需要在许多命令前加上 `sudo` 一样，这对其他用户也同样适用，包括\
  \ `www-data`。因此，为了让 Web 服务器有权执行某些命令，我们需要使用 **visudo** 实用工具将其添加为 **sudoer**。\n\n\
  运行该实用工具以打开 sudoer 配置文件：\n\n```\n$ sudo visudo\n```\n\n在文件底部，添加以下行：\n\n```\nwww-data\
  \ ALL=(ALL) NOPASSWD:/bin/cat,/etc/pi-alarm/update-alarm-setting.sh\n```\n\n然后保存文件并退出。\n\
  \n我们要做的最后一件事是创建一个小的 **Bash 脚本**，它将处理在我们的 `alarm.cfg` 文件中更新设置的工作。我们需要这样做的原因是我们将使用\
  \ Linux sed 命令来更新文件。我们调用 sed 命令的方式意味着它需要创建一个临时文件。除非我们对 Web 服务器进行一些与文件位置上下文相关的配置工作，否则它将无法工作。因此，更容易创建一个由\
  \ PHP 脚本调用的 stub Bash 脚本。这样，Bash 环境就能处理临时文件上下文。\n\n因此，我们将创建以下 Bash 脚本并将其保存在我们的 `/etc/pi-alarm`\
  \ 文件夹中：\n\n```\n```bash\n#!/bin/bash\n#/etc/pi-alarm/update-alarm-setting.sh\n###############################################\n\
  # Provides access to the sed command from  #\n# PHP as it needs write access to\
  \ a temp  #\n# folder.                                  #\n# $1 - Setting Name \
  \                       #\n# $2 - Setting Value                       #\n###############################################\n\
  \nsed -i \"s/^ ($1\\s*= *).*/\\1$2/\" /etc/pi-alarm/alarm.cfg\n```\n```\n\n`update-alarm-setting.sh`\n\
  \n然后我们需要给脚本执行权限：\n\n```\n```bash\n$ sudo chmod 777 /etc/pi-alarm/update-alarm-setting.sh\n\
  ```\n```\n\n此时，我们的 `/etc/pi-alarm` 文件夹中应该有以下内容：\n\n```\n```text\npi@raspberrypi\
  \ ~ $ ls -l /etc/pi-alarm\nalarm.cfg\nupdate-alarm-setting.sh\n```\n```\n\n好吧，经过这一切，我想我们现在可以在浏览器中启动控制面板页面，地址为\n\
  \n```\n```text\nhttp://<my-pi-ip>.\n```\n```\n\n`index.php` 已配置为 Lighty 中的默认页面，因此你无需在\
  \ URL 末尾添加它；只需 IP 地址即可。\n\n通过更改开关位置然后点击 **Update System** 按钮，你会发现 `alarm.cfg` 中的设置值会相应更新。你现在可以看到，这个文件将成为我们\
  \ Web 控制台与我们在 *第 9 章，把所有东西整合在一起* 中开发的安全系统脚本之间交换状态的方式。\n\n![](img/631e8b200cce187082ee46b0eb1681b3_408_0.png)\n\
  \n最终的运行控制面板\n\n# 远程访问我们的控制面板\n\n虽然我们可以设置系统在检测到入侵时接收电子邮件警报，但能够在任何地方访问我们的基于 Web 的控制面板以便在我们不在场时布防、撤防系统或关闭某些区域将会非常有用。\n\
  \n\n\n\n\n然而，要实现这一点，我们需要做几件事：\n\n## 设置动态 DNS 账户\n\n我们大多数人家里用于互联网连接的**固定 IP 地址**；它可能会不时发生变化，尤其是在我们重启或拔掉路由器时，我们的互联网服务提供商在我们下次连接时会为我们分配一个新的地址。正因为如此，我们不能依赖使用\
  \ IP 地址在外出时访问我们的家庭网络。为了解决这个问题，我们需要设置一个**动态 DNS 账户**，它将允许我们为家庭网络设置一个域名（例如，*myhomenetwork.com*）。\n\
  \n其工作原理是有一个在你的网络内部运行的服务，例如在你的路由器或笔记本电脑上，它会将托管你域名的动态 DNS 服务更新为你互联网连接的当前 IP 地址。然后，当你在浏览器中使用你的域名时，它会带你到家庭网络上的\
  \ Web 服务器。\n\n流行的动态 DNS 提供商包括 No-IP (www.noip.com) 和 DynDNS (www.dyn.com)。你也可以使用\
  \ OpenDNS 获取免费的 DnsOMatic 账户来管理你的服务 (www.dnsomatic.com)。\n\n![](img/631e8b200cce187082ee46b0eb1681b3_409_0.png)\n\
  \n我的 Netgear NAS 设备有一个 DnsOMatic 更新器服务插件\n\n![](img/631e8b200cce187082ee46b0eb1681b3_410_0.png)\n\
  \n我的 Netgear 路由器具有更新动态 DNS 服务的选项\n\n## Raspberry Pi 动态 DNS 客户端\n\n由于基于 Raspberry\
  \ Pi 的家庭安防系统很可能一直处于开启状态，你可能希望在上面安装 **ddclient** 更新器服务：\n\n```\nsudo apt-get install\
  \ ddclient\n```\n\n安装后，你可以使用以下配置文件为你的特定服务和账户详细信息进行设置：\n\n```\nsudo nano /etc/ddclient.conf\n\
  ```\n\n## 在 Raspberry Pi 上设置静态 IP\n\n为了让我们的家庭网络始终知道如何找到你的 Raspberry Pi，我们需要在其上设置一个**静态\
  \ IP 地址**，假设它目前每次启动时都从路由器的 DHCP 服务器获取 IP 地址。\n\n1. 为此，我们需要编辑 Raspberry Pi 上的网络设置。在\
  \ Nano 中打开以下配置文件：\n\n```bash\nsudo nano /etc/network/interfaces\n```\n\n2. 你可能会发现以太网端口配置设置为如下：\n\
  \n```\nauto eth0\nallow-hotplug eth0\niface eth0 inet manual\n```\n\n3. 将此配置更改为你网络上未使用的静态\
  \ IP 地址。在我的例子中，我将其设置为 192.168.0.99。网关设置是我互联网路由器的 IP 地址：\n\n```\nauto eth0\nallow-hotplug\
  \ eth0\niface eth0 inet static\n    address 192.168.0.99\n    netmask 255.255.255.0\n\
  \    gateway 192.168.0.1\n```\n\n4. 现在，我们需要重启网络服务——注意你将与终端会话断开连接。你需要使用新的 IP 地址重新连接：\n\
  \n```\n$ sudo /etc/init.d/networking restart\n```\n\n如果出现任何问题，只需使用 sudo reboot 重启\
  \ Pi，恢复后一切应该正常。\n\n## 端口转发\n\n这个难题的最后一部分是确保我们的互联网路由器会将特定端口上的传入流量定向到 Raspberry Pi\
  \ 的 Web 服务器。为本示例的目的，我将假设我们将坚持使用 Web 服务器上的默认端口 80。\n\n> 关于安全性的说明\n> 鉴于我们的 Web 服务器现在可以从外部世界访问，我们需要注意妥善保护系统。实现此目的的两种主要方法是更改\
  \ Web 服务器端口为 80 以外的随机数字（例如，8799）并通过应用基本身份验证为你的站点添加密码保护。这两者都可以在 lighttpd 配置文件中完成。\n\
  \n大多数路由器允许你在其**防火墙**配置的一部分中设置**端口转发**。本质上，设置此项意味着来自互联网的特定 TCP 端口上的任何传入流量都将被允许通过路由器并被定向到具有指定\
  \ IP 地址的设备。在我的 Netgear 路由器上，它设置如下图所示：\n\n![](img/631e8b200cce187082ee46b0eb1681b3_412_0.png)\n\
  \n现在，当你在浏览器中输入你的个人域名时，当你不在家时，你应该会被带到你的报警控制面板。\n\n> 你可能还想打开端口 22，以便你可以使用 PuTTY 和\
  \ SSH 从网络外部直接访问 Raspberry Pi。\n\n## 总结\n\n我们现在已经开始构建将控制我们的家庭安防系统的软件，通过确定主配置文件格式。我们还安装了一个\
  \ Web 服务器并使用 PHP、HTML5 和 CSS3 构建了一个基本的单页控制面板，可以很好地在我们的手机上访问，让我们能够配置系统并查看状态。\n\n\
  此外，我们还学习了如何配置我们的家庭网络和 Raspberry Pi，以便在我们不在家时访问我们的控制面板。\n\n在第 9 章《把所有东西整合起来》中，我们将把所有电子元件组合在一起并编写将运行家庭安防系统的主脚本。但在此之前，在下一章中，我们将研究一些其他零碎的东西，例如向我们的家庭安防系统添加其他传感器，不一定与入侵检测相关。我们还将研究如何使用\
  \ Web 浏览器远程管理整个 Raspberry Pi 系统，除了访问我们的家庭安防控制面板之外。\n\n在上一章的区域列表表中，你会注意到我将 Raspberry\
  \ Pi GPIO 上的输入 GP0 分配为我们的布防/撤防开关输入。该输入将与我们的控制面板开关协同工作。\n\n该输入可以简单到一个拨动开关，也可以更安全一些，例如**钥匙开关**或**电子键盘**。无论哪种方式，它都将在系统布防时连接到我们\
  \ Raspberry Pi 上的接地 GP0 (GPIO17)。\n\n![](img/631e8b200cce187082ee46b0eb1681b3_416_0.png)\n\
  \n我们的布防/撤防开关的电路图\n\n如果你有开关或其他将暴露在室外环境中的设备，你需要确保它们适合户外使用，以免损坏并损害系统的完整性。\n\n![](img/631e8b200cce187082ee46b0eb1681b3_416_1.png)\n\
  \n适用于户外使用的 IP67 额定钥匙开关（型号 Lorlin WRL-5-E-S-2-B）\n\n以下是我们带有一个 1N4007 **整流二极管**用于保护的数字负载驱动器的修改电路：\n\
  \n![](img/631e8b200cce187082ee46b0eb1681b3_418_0.png)\n\n带二极管保护的数字负载驱动器\n\n## 超越入侵\n\
  \n家庭安全不仅仅是保护我们的财产免受入侵，还包括保护免受其他风险，例如洪水、火灾、一氧化碳泄漏等等。因此，将我们的家庭安防系统扩展以检测这些其他风险是有意义的。\n\
  \n你可以选择设置系统，使某些类型的警报仅作为电子邮件发送到你的手机，而不是触发所有外部铃声、灯光和哨声。这可以通过调整下一章中的脚本以按你想要的方式运行来实现。\n\
  \n## 一个简单的水探测器\n\n没有什么比外出几天回家发现厨房因水槽下漏水而被淹更糟的了。我们的简单电路将检测水的存在并触发我们家庭安防系统上的一个输入，然后可以提醒你。你也可以购买套件和现成的模块来实现这一点，但以下电路便宜且采用了我们的光耦，因为我们将为实际探测器使用不同的电压。\n\
  \n![](img/631e8b200cce187082ee46b0eb1681b3_419_0.png)\n\n## 工作原理\n\n当水放置在探针之间时，电流会通过水流过，从而通过晶体管\
  \ Q1 基极上的 R3/R4 分压器。当基极电流足够高以使其饱和时，晶体管将完全导通，允许光耦内部的 LED 亮起。这反过来会通过光耦内部的光电晶体管将系统输入引脚拉低到地。\n\
  \n你可以使用微调电阻 R4 来校准传感器，通过调整其灵敏度。任何通用的 NPN 双极晶体管都可以在这里工作，但显然它们都有不同的工作参数，因此请选择合适的型号。\n\
  \n\n\n\n\n![](img/631e8b200cce187082ee46b0eb1681b3_422_0.png)\n\nSparkFun 提供的 Winsen\
  \ MQ-7 一氧化碳气体探测器。\n\n> 根据 ASHRAE（www.ashrae.org）的标准，人体长时间连续接触一氧化碳（CO）的安全上限为 9ppm（百万分比浓度），你不应长时间暴露在高于此浓度的\
  \ CO 环境中，而 35ppm 则是正常 8 小时工作日的绝对上限。\n\nMQ-7 探测器的灵敏度范围为 10 至 500ppm，因此在我看来，我希望它一旦检测到任何浓度就立即发出警报。所以，我们应该根据数据手册中的灵敏度曲线，将比较器的参考电压设定在量程的低端，如下图所示：\n\
  \n![](img/631e8b200cce187082ee46b0eb1681b3_422_1.png)\n\n取自 Winsen MQ-7 制造商数据手册的灵敏度曲线。\n\
  \n警告\n我加入这段关于一氧化碳检测的内容，更多是出于兴趣而非其他目的。一氧化碳是很危险的东西，虽然自己动手制作探测器对兴趣而言无妨，但请仅将其用于兴趣探索。将其加入我们的家庭安防系统，作为出门在外时提醒我们的附加功能是有用的，但它*绝不应*替代市售的商用探测器——那种安装在锅炉旁、具备各种认证和标准、且在家中时能发出极响亮警报的合格产品。\n\
  \n## 远程管理我们的树莓派\n\n在上一章中，我们学习了如何设置系统和家庭网络，以便无论身在何处都能远程访问报警控制面板。现在，我将向您展示如何扩展这一能力，从而管理和监控我们整个树莓派系统。\n\
  \n## 获取 Webmin\n\n**Webmin** 是一个相当出色且成熟的基于 Web 的 Unix/Linux 系统管理界面。你可以在其网站 www.webmin.com\
  \ 上找到关于 Webmin 的所有信息。和本书贯穿始终的假设一样，我假定你在树莓派上使用的是 Raspbian 发行版来安装 Webmin。\n\n安装 Webmin\
  \ 有两种方式：一种是手动下载并解压，另一种是更新我们的软件源，以便使用 `apt-get`。我选择后者，这样所有依赖项都会自动安装，将来更新也更容易管理。虽然需要几个步骤，但相当简单直接：\n\
  \n## 更新软件源\n\n- 1. 首先，我们需要更新软件源，以加入 Webmin 的仓库：\n  ```\n  $ sudo nano /etc/apt/sources.list\n\
  \  ```\n- 2. 在文件末尾添加以下两行：\n  ```\n  deb http://download.webmin.com/download/repository\
  \ sarge\n  contrib\n  ```\n\n```\ndeb\nhttp://webmin.mirror.somersettechsolutions.co.uk/repository\n\
  sarge contrib\n```\n\n3. 保存并退出 Nano。\n\n## 导入签名密钥\n\n1. 接下来，我们需要下载并导入仓库的签名密钥：\n\n\
  ```\n$ cd ~\n$ sudo wget http://www.webmin.com/jcameron-key.asc\n$ sudo apt-key\
  \ add jcameron-key.asc\n```\n\n2. 现在我们已经具备所需的一切，可以更新软件包安装器并安装 Webmin。这个过程可能需要一些时间，你不妨去给自己泡杯茶或咖啡：\n\
  \n```\n$ sudo apt-get update\n$ sudo apt-get install webmin\n```\n\n3. 安装完成后，你应在\
  \ shell 窗口中看到以下信息：\n\n![](img/631e8b200cce187082ee46b0eb1681b3_424_0.png)\n\n##\
  \ 本地访问 Webmin\n\nWebmin 默认运行在 10000 端口，并采用安全的 HTTPS 协议。因此，要访问它，你需要在浏览器中输入以下 URL：\n\
  \n```\nhttps://<my-ip>:10000\n```\n\n其中 <my-ip> 是你的树莓派的 IP 地址。\n\n在上一章中，我们为系统设置了静态\
  \ IP 地址；以我为例，我将地址设置为 192.168.0.99。所以，要在我的系统上访问 Webmin，我会使用：\n\n```\nhttps://192.168.0.99:10000\n\
  ```\n\n> **HTTPS 隐私错误**\n> \n> 在某些浏览器（如 Google Chrome）中，当你尝试访问 Webmin 网页时，可能会看到隐私错误。这是因为\
  \ HTTPS 连接背后的 SSL 证书未经公认机构签名。这没问题——只需告诉浏览器你接受该证书并继续即可（在 Chrome 中，你需要先点击**高级**链接才能看到该选项）。\n\
  \n![](img/631e8b200cce187082ee46b0eb1681b3_425_0.png)\n\nWebmin 带有大量模块，但并非全部默认安装。因此，你可能想浏览面板中的**未使用模块**部分，看看是否有想要添加到\
  \ Webmin 的内容。\n\n## 远程访问 Webmin\n\n与上一章中为报警控制面板设置远程访问的方式相同，你也可以对 Webmin 做同样的事情——只需在路由器上为\
  \ 10000 端口设置端口转发即可。然后，你就可以使用 https://<my-public-ip>:10000 从任何地方访问 Webmin。\n\n##\
  \ 小结\n\n好吧，在我们构建家庭安防系统框架之前，这一章的内容有点杂烩式的收尾。我希望你喜欢这些对前面章节的补充说明，也希望它们能给你一些启发，让你知道家庭安防系统能走多远。\n\
  \n我们首先探讨了如何在不访问 Web 控制面板的情况下对系统进行布防和撤防，方法是在布防/撤防输入端添加机械或数字开关。\n\n然后，我们探讨了如何为系统添加模拟类传感器。通过将运算放大器设置为电压比较器，当达到某个阈值时系统便能发出警报。这些比较器电路的设计思路可以应用于不同类型的传感器，只要你想知道模拟传感器输出何时达到特定电压阈值即可。\n\
  \n最后，我们学习了如何在树莓派上安装 Webmin，以便监控和配置 Linux 操作系统的许多方面。\n\n下一章是我们期待已久的时刻；我们将把前面章节中的所有元素和概念整合起来，构建一个包含我们所需功能的完整系统。其中最耀眼的将是我们的\
  \ Bash 脚本，它将把所有元素粘合在一起，并为整个系统提供控制逻辑。\n\n## 整合所有部分\n\n在过去的八章中，我们探讨了一个功能完备的家庭安防系统的各个元素和概念，这样的系统你也会希望安装在你的住宅中。我们以模块化的方式呈现内容，以便你可以为系统选择所需的功能，从而让它既可以是紧凑而基础的，也可以是庞大而复杂的。\n\
  \n从根本上说，家庭安防系统的核心理念是检测特定分区输入是否被外部传感器触发为高电平或低电平，无论该传感器是开关、运动探测器还是水浸探测器。归根结底，就控制软件而言，传感器的类型并不重要；系统软件的工作就是简单地检查其输入状态并相应发出警报。\n\
  \n在最后一章中，我们将把所有的概念整合在一起，设计出一个安防系统框架，并围绕它编写控制脚本。本章将涵盖以下内容：\n\n- 定义系统的高层概览，详细说明所连接的各个元素\n\
  - 构建完整的模块化安防系统框架控制脚本，并详细探索代码\n- 深入研究一些用于执行特定任务的详细 shell 脚本技巧\n- 学习如何让系统在启动时自动运行\n\
  - 通过创建基于 RAM 的文件系统来防止 SD 卡烧毁\n\n### 警报系统图解\n\n为了避免在这个过程中迷失方向，我首先推荐的做法是绘制一张完整的系统图解作为参考。我为自己设计和组装的任何系统都会这样做，以便能够以结构化的方式构建，并便于记录和修改。\n\
  \n\n\n\n\n对于本章的家庭安全系统，我设计了下面的系统图作为框架。整个概念采用模块化设计，因此你可以根据自己的需求设计自己的系统，并使用本章给出的脚本相应地实现它。\n\
  \n![](img/631e8b200cce187082ee46b0eb1681b3_430_0.png)\n\n最终的家庭安全系统图\n\n## 系统组件概览\n\
  \n前面的系统图包含了我们在前几章中讨论过的元件和模块。下面快速回顾一下：\n\n### +12V电源\n\n这是系统的主电源，我们将从外部市电适配器获得，该适配器可以带有**电池后备**。该电源需要平滑且经过稳压，以确保在当前负载下系统能保持稳定。\n\
  \n所有报警布线和传感器都将由该电源供电，诸如发声器和警铃等外设通常也使用12V电源供电。*第5章，添加被动红外运动传感器*讨论了在报警电路中使用12V电源的优点。\n\
  \n### +3.3V电源\n\n该电源是为数字端口扩展器电路提供的稳压+3.3V电源；它还通过光耦合器提供逻辑报警防区输入。+3.3V电源既可以来自+12V电源（推荐），也可以来自树莓派GPIO连接器的+5V电源，只需根据你需要的电流选择相应的稳压器即可。\n\
  \n*第3章，扩展你的树莓派以连接更多设备，*向你展示了如何构建+3.3V稳压电源。\n\n### 光隔离器输入模块\n\n该模块将+12V防区输入电源线与端口扩展器和GPIO数字输入隔离，后者在被触发为高电平时，只能承受最大+3.3V的电压。\n\
  \n这些光隔离输入模块的电路已在*第5章，添加被动红外运动传感器*中讨论并展示。\n\n### 端口扩展器\n\n端口扩展器是我们的主要数字输入/输出系统，它将接收报警防区输入，并通过I2C总线传输到树莓派，或者允许树莓派开关输出。\n\
  \n我们在*第3章，扩展你的树莓派以连接更多设备*中构建了基于MCP23017的端口扩展器电路，并在*第4章，添加磁力接触传感器*中为其配置了软件。\n\n###\
  \ 布防/撤防开关\n\n布防/撤防输入会覆盖我们基于Web的控制面板上的布防/撤防**软开关**功能，它是一个直接连接到树莓派GPIO连接器上的开关（钥匙开关、数字键盘或其他类型）。\n\
  \n请记住，任何开关电路都要正确连接到GPIO引脚，以免损坏树莓派。这一点已在*第2章，用GPIO将设备连接到你的树莓派*中讨论过。\n\n### 报警输出\n\
  \n在我们的系统中，有几个由树莓派通过输出驱动电路控制的输出设备。我们有一个用于进入/离开蜂鸣器的输出、一个布防状态LED、一个报警警铃，以及一个报警LED指示灯。\n\
  \n这些设备由树莓派GPIO连接器通过驱动电路进行开关控制，这些驱动电路允许我们使用GPIO引脚驱动大电流和感性负载。这些以TIP120达林顿晶体管为核心的驱动电路已在*第6章，为安全系统添加摄像头*和*第8章，其他杂项*中讨论过。\n\
  \n## 设计控制脚本\n\n在开始编写控制报警系统的脚本之前，最好先勾勒出系统的**高层**流程。下面的**流程图**有助于我们了解系统应如何工作，以及脚本需要做出的各种逻辑判断。\n\
  \n这个流程图可能看起来有点复杂，线条朝不同方向延伸，但实际上它是相当线性的，并且总体向下。参考流程图，它展示了控制脚本将要执行的以下任务：\n\n- 保持静默，直到系统通过硬件钥匙开关或基于Web的面板上的软开关完成布防。\n\
  - 当系统首次布防时，在实际布防之前，它会先让退出蜂鸣器响一段预设的时间。这样你就有机会离开房屋，或者在系统开始监控输入之前再次撤防。\n- 系统一旦布防，布防LED将点亮，系统会等待查看是否有任何报警防区输入被触发。它还会等待你返回房屋时撤防报警。我们可以选择在进入防区设置一个进入延时，以延迟触发报警。\n\
  - 如果报警最终被触发，那么主报警警铃和退出蜂鸣器都会被打开。根据所在社区的环境限制，主警铃只应响一段时间，因此它会在预定的时间后关闭，但内部蜂鸣器会保持开启。\n\
  - 触发后，系统会等待你撤防，然后进行复位。\n\n![](img/631e8b200cce187082ee46b0eb1681b3_433_0.png)\n\n\
  控制脚本流程图\n\n## 构建控制脚本\n\n现在我们已经按照预期的工作方式设计好了系统，可以开始编写Bash控制脚本了。和之前一样，我们会把脚本放在/etc/pi-alarm文件夹中，你还会记得，在第7章，构建基于Web的控制面板中，我们的基于Web的控制面板也会将配置状态文件alarm.cfg写入该文件夹。我们的脚本中也会引用这个文件。\n\
  \n在这个脚本中，我们将使用bc工具（Bash命令行计算器）将十六进制值转换为二进制值。默认情况下它没有安装，因此你需要获取该软件包：\n\n```\n$ sudo\
  \ apt-get update\n$ sudo apt-get install bc\n```\n\n![](img/631e8b200cce187082ee46b0eb1681b3_434_0.png)\n\
  \n> 我们的脚本文件相当长，所以和之前一样，你可能想坐在沙发上，用Notepad++之类的工具在笔记本电脑上编写。但要记住，如果你使用PC，请确保行尾（EOL）格式转换为Unix格式，否则当你将其复制到树莓派时，Bash脚本将无法运行。Notepad++可以为你完成此操作。\n\
  \n## 探索脚本代码\n\n现在我将带你逐段了解我编写的控制脚本代码，这些代码将作为我们系统的框架。我之所以说是“框架”，是因为尽管它会为你提供一个功能完整的系统控制脚本，但你仍然可以根据自己的特定需求对其进行修改和扩展。\n\
  \n以下代码清单全部来自同一个Bash脚本alarm-control.sh，该脚本的完整带注释版本可以从Packt Publishing网站下载。\n\n###\
  \ 声明\n\n我们首先设置跟踪系统状态所需的各种控制变量：\n\n```\n#!/bin/bash\n#/etc/pi-alarm/alarm-control.sh\n\
  \nALM_BELL_DURATION=600    #duration in seconds the alarm bell\nshould sound for\n\
  ALM_EXIT_DELAY=30    #entry/exit zone delay in seconds\n```\n\n```\nALM_KEY_ARMED=0\
  \      #status of the arm/disarm key switch\nALM_SYS_ARMED=0      #armed status\
  \ of the system\n\nALM_ZONE_INPUT_READ=\"\"      #this will store the value of the\
  \ zone\ninputs read\nALM_ZONE_INPUT_STAT=\"00000000\"      #binary representation\
  \ of the inputs\n(b7-b0)\nALM_ZONE_INPUT_PREV=\"\"      #previous zone input status\n\
  ALM_ZONE_TRIGGER=0      #this will be set to 1 if one or more zones is\ntriggered\n\
  ALM_ZONES_STAT=(0 0 0 0 0 0 0 0)      #dynamic array of normalised zone\nstatus\
  \ (z1 to z8 order) - 1 is triggered\n\nSTAT_RET_VAL=\"\"      #return value from\
  \ functions\n```\n\n由于根据配置和接线的不同，HIGH或LOW输入都可能表示某个防区被触发，因此我在变量ALM_ZONES_STAT中引入了一个归一化状态标志数组，就脚本而言，这将作为确定性的状态。我们稍后将研究处理此问题的函数。\n\
  \n### 更新配置设置\n\n在第7章，构建基于Web的控制面板中，我们引入了配置文件alarm.cfg，它存储系统状态和配置，供基于Web的控制面板使用。主控制脚本不仅需要读取该文件以获取通过控制面板所做的任何设置，还需要用主控制脚本中的状态值更新该文件，以便将这些值回传给控制面板，本质上是在两个子系统之间交换数据。\n\
  \n因此，我们将包含一个辅助函数，其中包含与Web页面PHP脚本调用相同的代码，用于从控制面板更新该文件：\n\n```\n#This helper function\
  \ will update the alarm config\n#file with the specified value (alarm.cfg) so that\n\
  #the Web panel can know the latest status\nfunction almUpdateConfigSetting()\n{\n\
  \    #$1 - Setting Name\n    #$2 - Setting Value\n    sudo sed -i \"s/^\\($1\\s*=\
  \ *\\).* /\\1$2/\" /etc/pi-alarm/alarm.cfg\n}\n```\n\n\n\n\n\n## 设置 GPIO\n\n我们需要按照前面的系统示意图来设置树莓派的\
  \ GPIO 引脚。以下命令最早在第 2 章“使用 GPIO 将设备连接到树莓派”中讨论过：\n\n```\n# GPIO SET UP ########################################\n\
  #Set up the Raspberry Pi GPIO pins\n#Refer to Chapter 2 for info\n#D0 (GPIO17) Arm/Disarm\
  \ Key Input\nsudo echo 17 > /sys/class/gpio/export\nsudo echo in > /sys/class/gpio/gpio17/direction\n\
  \n#D4 (GPIO23) Armed LED Output\nsudo echo 23 > /sys/class/gpio/export\nsudo echo\
  \ out > /sys/class/gpio/gpio23/direction\nsudo echo 0 > /sys/class/gpio/gpio23/value\n\
  \n#D5 (GPIO24) Exit Buzzer Output\nsudo echo 24 > /sys/class/gpio/export\nsudo echo\
  \ out > /sys/class/gpio/gpio24/direction\nsudo echo 0 > /sys/class/gpio/gpio24/value\n\
  \n#D6 (GPIO25) Alarm LED Output\nsudo echo 25 > /sys/class/gpio/export\nsudo echo\
  \ out > /sys/class/gpio/gpio25/direction\nsudo echo 0 > /sys/class/gpio/gpio25/value\n\
  \n#D7 (GPIO4) Alarm Bell Output\nsudo echo 4 > /sys/class/gpio/export\nsudo echo\
  \ out > /sys/class/gpio/gpio4/direction\nsudo echo 0 > /sys/class/gpio/gpio4/value\n\
  ```\n\n> 请注意，一个 GPIO 引脚只能导出一次，除非之后被取消导出。因此，如果脚本在再次导出该引脚时重新运行，你可能会看到错误：echo: write\
  \ error: Device or resource busy。你可以安全地忽略该错误。\n\n我们还将加入几个辅助函数，以便轻松切换各种输出的开关状态，从而简化主代码。我非常喜欢实现函数，即使它们很简单，因为这能让代码保持模块化、可重用，并且在大多数情况下更易阅读：\n\
  \n```\n#This helper function will switch a specified GPIO output on or off\nfunction\
  \ almSetGPIOValue()\n```\n```\n```sh\n{\n    #$1 - GPIO pin number\n    #$2 - Value\n\
  \    sudo echo $2 > /sys/class/gpio/gpio$1/value\n}\n#Helper functions to switch\
  \ on and off the outputs\nfunction almSetArmedLED()\n{\n    #$1 - 0 or 1 (Off or\
  \ On)\n    almSetGPIOValue 23 $1\n    echo \"[ALM] Armed LED set to $1\"\n}\nfunction\
  \ almSetExitBuzzer()\n{\n    #$1 - 0 or 1 (Off or On)\n    almSetGPIOValue 24 $1\n\
  \    echo \"[ALM] Exit Buzzer set to $1\"\n}\nfunction almSetAlarmLED()\n{\n   \
  \ #$1 - 0 or 1 (Off or On)\n    almSetGPIOValue 25 $1\n    echo \"[ALM] Alarm Trigger\
  \ LED set to $1\"\n}\nfunction almSetAlarmBell()\n{\n    #$1 - 0 or 1 (Off or On)\n\
  \    almSetGPIOValue 4 $1\n    echo \"[ALM] Alarm Bell set to $1\"\n}\n```\n```\n\
  \n此外，我们还会添加一个辅助函数，用于从树莓派的 D0（GPIO17）以及 Web 控制台读取布防开关状态，以判断布防软开关是否已设置：\n\n```\n```sh\n\
  #this function returns whether the system is armed via\n#either the web console\
  \ or key switch\nfunction almGetArmedSwitchStatus()\n{\n    STAT_RET_VAL=\"0\"\n\
  \    #read arm key switch input from\n    local L_VAL=$(sudo cat /sys/class/gpio/gpio17/value)\n\
  \    if [ $L_VAL -eq 1 ]; then\n        #system has been armed with key switch\n\
  ```\n```\n## 整合所有部分\n\n```\necho \"[ALM] System ARMED with key switch\"\nALM_KEY_ARMED=1\n\
  almUpdateConfigSetting \"SYSTEM_ARMED\" \"1\" #set system armed\n    console flag\n\
  STAT_RET_VAL=\"1\"\nelse\n    #read system armed value from web console config file\n\
  \    if [ $SYSTEM_ARMED == 1 ]; then\n        echo \"[ALM] System ARMED with web\
  \ console\"\n        STAT_RET_VAL=\"1\"\n    fi\nfi\n}\n```\n\n## 设置 I2C 端口扩展器\n\
  \n接下来的几行代码将设置 I2C 端口扩展器，将 A 口和 B 口的所有引脚都配置为输入。在我们的系统中，目前只使用 A 口，但这样如果我们要扩展系统，还可额外获得\
  \ 8 个输入。我们最初在*第 4 章“添加磁力门磁传感器”*中介绍过这一点：\n\n```\n# PORT EXPANDER SET UP ###########################\n\
  #Refer to Chapter 4 for more information about the I2C bus\n\n#We will set up I/O\
  \ BUS A as all inputs\nsudo i2cset -y 1 0x20 0x00 0xFF\n\n#Whilst we're not using\
  \ BUS B in our system,\n#we can set that up as all inputs too\nsudo i2cset -y 1\
  \ 0x20 0x01 0xFF\n```\n\n> 如果你的 I2C 端口扩展器没有连接，那么运行这些命令时会看到以下错误：*写入失败*\n\n## 解码防区输入状态\n\
  \n下一个函数是一个大函数，也是我们系统最关键的部分。它将从 I2C 端口扩展器读取端口 A 的值。该值将以十六进制返回，因此我们需要将其转换为二进制值，其中每一位用\
  \ 0 或 1 表示。我们将使用之前安装的 bc 工具来完成这一转换。\n\n一旦获得了每个输入位的状态，我们还需要判断 0 或 1 是否为有效触发，从而对状态进行归一化。最终输出的数组\
  \ `ALM_ZONES_STAT` 包含每个防区的状态，其中 1 表示该防区已被有效触发：\n\n```\n```bash\n#This function will\
  \ read the port inputs and set the\n#status of each zone\nfunction almReadZoneInputs()\n\
  {\n    #preserve previous zone status\n    ALM_ZONE_INPUT_PREV=$ALM_ZONE_INPUT_STAT\n\
  \    #read the 8-bit hex value of port a\n    ALM_ZONE_INPUT_READ=$(sudo i2cget\
  \ -y 1 0x20 0x12)\n\n    if [[ $ALM_ZONE_INPUT_READ = *\"Error\"* ]]; then\n   \
  \     #An error occurred reading the I2C bus - set default value\n        ALM_ZONE_INPUT_READ=\"\
  0x00\"\n    fi\n\n    #remove the 0x at the start of the value to get the hex value\n\
  \    local L_HEX=${ALM_ZONE_INPUT_READ:2}\n    #convert the hex value to binary\n\
  \    local L_BIN=$(echo \"obase=2; ibase=16; $L_HEX\" | bc )\n    #zero pad the\
  \ binary to represent all 8 bits (b7-b0)\n    ALM_ZONE_INPUT_STAT=$(printf \"%08d\"\
  \ $L_BIN)\n\n    echo \"[ALM] Zone I/O Status: $ALM_ZONE_INPUT_STAT\n        ($ALM_ZONE_INPUT_READ)\"\
  \n\n    #check each zone input to see if it's in a triggered state\n    #a triggered\
  \ state may be either 1 or 0 depending on the input's\n    #configuration\n    #you'll\
  \ need to set the logic here accordingly for each input\n    #the ALM_ZONES_STAT\
  \ array contains the definitive trigger value\n    #for each input\n\n    #zone\
  \ 1 test (bit 0)\n    local L_FLG=${ALM_ZONE_INPUT_STAT:7:1}\n    if [ $L_FLG -eq\
  \ 0 ]; then ALM_ZONES_STAT[0]=0; else\n        ALM_ZONES_STAT[0]=1; fi\n\n    #zone\
  \ 2 test (bit 1)\n    local L_FLG=${ALM_ZONE_INPUT_STAT:6:1}\n    if [ $L_FLG -eq\
  \ 0 ]; then ALM_ZONES_STAT[1]=0; else\n        ALM_ZONES_STAT[1]=1; fi\n}\n```\n\
  ```\n## 整合所有部分\n\n```\n```sh\n#zone 3 test (bit 2)\nlocal L_FLG=${ALM_ZONE_INPUT_STAT:5:1}\n\
  if [ $L_FLG -eq 0 ]; then ALM_ZONES_STAT[2]=0; else\n    ALM_ZONES_STAT[2]=1; fi\n\
  \n#zone 4 test (bit 3)\nlocal L_FLG=${ALM_ZONE_INPUT_STAT:4:1}\nif [ $L_FLG -eq\
  \ 0 ]; then ALM_ZONES_STAT[3]=0; else\n    ALM_ZONES_STAT[3]=1; fi\n\n#zone 5 test\
  \ (bit 4)\nlocal L_FLG=${ALM_ZONE_INPUT_STAT:3:1}\nif [ $L_FLG -eq 0 ]; then ALM_ZONES_STAT[4]=0;\
  \ else\n    ALM_ZONES_STAT[4]=1; fi\n\n#zone 6 test (bit 5)\nlocal L_FLG=${ALM_ZONE_INPUT_STAT:2:1}\n\
  if [ $L_FLG -eq 0 ]; then ALM_ZONES_STAT[5]=0; else\n    ALM_ZONES_STAT[5]=1; fi\n\
  \n#zone 7 test (bit 6)\nlocal L_FLG=${ALM_ZONE_INPUT_STAT:1:1}\nif [ $L_FLG -eq\
  \ 0 ]; then ALM_ZONES_STAT[6]=0; else\n    ALM_ZONES_STAT[6]=1; fi\n\n#zone 8 test\
  \ (bit 7)\nlocal L_FLG=${ALM_ZONE_INPUT_STAT:0:1}\nif [ $L_FLG -eq 0 ]; then ALM_ZONES_STAT[7]=0;\
  \ else\n    ALM_ZONES_STAT[7]=1; fi\n\necho \"[ALM] Zone Trigger Status: $ALM_ZONES_STAT[*]\"\
  \n}\n```\n```\n\n## 初始化\n\n在声明了模块级变量和辅助函数之后，我们将开始主程序。首先，我们要初始化系统，清除 SYSTEM_ARMED\
  \ 状态，并从配置文件中读取初始设置：\n\n```\n```sh\n# initialise system ########\necho \"[ALM] Initialising\
  \ system...\"\nalmUpdateConfigSetting \"SYSTEM_ARMED\" \"0\" #clear system armed\n\
  console flag\nsleep 1\nsudo cat /etc/pi-alarm/alarm.cfg\n```\n```\n```\n```sh\n\
  sleep 1\necho \"[ALM] Initialising done\"\n##############################\n```\n\
  ```\n\n## 系统监控循环\n\n接着，脚本进入一个无限循环，这就是主控制系统：监控布防/撤防状态；当处于布防状态时，监控防区输入状态并做出相应响应：\n\
  \n```\n```sh\n# loop continuously############\nwhile true\ndo\n\n    # wait for\
  \ system to be armed ###############\n    echo \"[ALM] Alarm now in STAND-BY state\
  \ - waiting to be armed\"\n    almSetArmedLED 0 #switch off armed LED\n    STAT_RET_VAL=\"\
  0\"\n    while [[ $STAT_RET_VAL = \"0\" ]]; do\n        sleep 1\n        #read the\
  \ control panel status file\n        . /etc/pi-alarm/alarm.cfg\n        almGetArmedSwitchStatus\
  \ #result is returned in STAT_RET_VAL\n        echo -n \"*\" # indicates standby\
  \ mode\n    done\n###############################################\n```\n```\n\n\
  ## 布防系统\n\n当系统进入布防状态时，会先打开退出蜂鸣器，然后等待一段预设时间。这段等待时间让你有机会离开房屋或撤防系统：\n\n```\n```sh\n\
  # perform exit delay ########################\necho \"[ALM] Alarm now in EXIT DELAY\
  \ state\"\nalmSetExitBuzzer 1 #switch on exit buzzer\nCOUNTER=$ALM_EXIT_DELAY\n\
  while [[ $STAT_RET_VAL = \"1\" && $COUNTER -gt 0 ]]; do\n    sleep 1\n    #read\
  \ the control panel status file\n    . /etc/pi-alarm/alarm.cfg\n    almGetArmedSwitchStatus\
  \ #result is returned in STAT_RET_VAL\n    COUNTER-=1\n    echo -n \"$COUNTER \"\
  \ # indicate exit mode\n```\n```\n\n\n\n\n\ndone\nalmSetExitBuzzer 0 #switch off\
  \ exit buzzer\n###################################################\n\n# system now\
  \ armed - monitor inputs ########\nALM_SYS_ARMED=1\necho \"[ALM] Alarm now in ARMED\
  \ state\"\nalmSetArmedLED 1 #switch on armed LED\n\n#read the control panel status\
  \ file\n. /etc/pi-alarm/alarm.cfg\nalmReadZoneInputs  # > ALM_ZONES_STAT[x]\n\n\
  ## Monitoring the zones\n\nOnce armed, the system will monitor the zone inputs in\
  \ a continuous loop until either the system is disarmed, or a zone input is triggered.\
  \ When a zone is triggered, it will check against the ZONE_ENABLE_n configuration\
  \ to see if that zone has been disabled (this is done in the Web-based control panel).\
  \ If the zone is not disabled, then the alarm system is deemed triggered.\n\nThe\
  \ ZONE_STATUS_n setting is also updated here so that the web-based control panel\
  \ indicates which zone or zones have been triggered:\n\n```\n#check each zone input\
  \ to set if it's enable\n#and has been triggered\n#NUM_ZONES setting is stored in\
  \ alarm.cfg\n\nwhile [[ $ALM_SYS_ARMED -eq 1 ]]; do\n    echo -n \"A\" #indicate\
  \ armed mode\n\n    ALM_ZONE_TRIGGER=0\n    for (( i=$NUM_ZONES; i>0; i-- )); do\n\
  \        if [[ $ALM_ZONES_STAT[$i-1] -eq 1 ]]; then\n            #zone has been\
  \ triggered\n            echo \"[ALM] Zone $i TRIGGERED\"\n            E_VAR=\"\
  ZONE_ENABLE_$i\"\n            E_VAL=`echo \"$E_VAR\"` #get zone enabled status loaded\
  \ from alarm.cfg\n\n            if [[ $E_VAL -eq 1 ]]; then\n                #zone\
  \ is enabled\n                ALM_ZONE_TRIGGER=1 #set alarm triggered flag\n   \
  \             echo \"[ALM] Zone $i ENABLED - alarm will be triggered\"\n```\n\n\
  ## Sounding the main alarm\n\nIf, at this point, the system hasn't been disarmed,\
  \ then we need to sound the main bell. We have a duration limit for sounding the\
  \ bell to cater to environmental noise restrictions; we wouldn't want the alarm\
  \ sounding for hours, annoying the neighbors until we got home. At this point, you\
  \ can also add code from Chapter 6, Adding Cameras to Our Security System, if you\
  \ want to be sent an alert email to your mobile device:\n\n```\n##############################\n\
  # STAY in TRIGGERED mode until system has been disarmed\nif [[ $STAT_RET_VAL = \"\
  1\" ]]; then\n    #alarm has not been disabled\n    almSetAlarmBell 1 #switch on\
  \ alarm bell\n    echo \"[ALM] Alarm now in TRIGGERED state\"\n\n    ## YOU CAN\
  \ INSERT CODE HERE TO SEND YOU AN EMAIL IF YOU\n        WANT##\n    ## REFER BACK\
  \ TO CHAPTER 6 ##\n\n    COUNTER=0\n    STAT_RET_VAL=\"0\"\n    while [[ $STAT_RET_VAL\
  \ = \"1\" ]]; do\n        echo -n \"T$COUNTER \" #indicate triggered mode\n    \
  \    sleep 1\n        #read the control panel status file\n        . /etc/pi-alarm/alarm.cfg\n\
  \        almGetArmedSwitchStatus #result is returned in STAT_RET_VAL\n\n       \
  \ COUNTER+=1\n        if [[ $COUNTER -gt $ALM_BELL_DURATION ]]; then\n         \
  \   almSetAlarmBell 0 #switch off alarm bell\n            echo \"[ALM] Bell has\
  \ been switched OFF\"\n        fi\n    done\nfi\n##############################\n\
  ```\n\n## Disarming and resetting the system\n\nWhen we disarm the system, we need\
  \ to reset its status and complete the monitoring loop so that we can start all\
  \ over again and wait for it to be re-armed:\n\n```\n# alarm has been disarmed ########\n\
  echo \"[ALM] Alarm has been DISARMED\"\n```\n\n```\nALM_SYS_ARMED=0\nalmSetAlarmBell\
  \ 0 #switch off alarm bell\nalmSetExitBuzzer 0 #switch off exit buzzer\nalmSetAlarmLED\
  \ 0\nalmSetArmedLED 0 #switch off armed LED\n\n########################################\n\
  fi\n\ndone\n##################################################\n\ndone\n########################################################\n\
  ```\n\n## We're done (almost)…\n\nAnd there we have it: a framework for an entire\
  \ alarm control script on our Raspberry Pi. Additional features that you may want\
  \ to implement within your script could include the following:\n\n- Sending a photo\
  \ or video clip from a zone's camera when it's triggered\n- Sending an email alert\
  \ with status details when the alarm has been triggered\n- Writing a regular log\
  \ file recording historical status information\n- Adding additional environmental\
  \ sensors to port B\n\n> Each of the script blocks is taken from the single script\
  \ file, `alarm-control.sh`, so you should be able to put all of the described pieces\
  \ together into one file to have a fully functional script.\n\nAs always, before\
  \ we can run it we need to give the script execute rights:\n\n```\n$ sudo chmod\
  \ 777 /etc/pi-alarm/alarm-control.sh\n```\n\nAfter we copy the script to our Raspberry\
  \ Pi, this is what we should see in our `/etc/pi-alarm` folder:\n\n```\npi@raspberrypi\
  \ ~ $ ls -1 /etc/pi-alarm\nalarm.cfg\nalarm-control.sh\nupdate-alarm-setting.sh\n\
  ```\n\n## Automatically starting the system\n\nNow, obviously, we don't want to\
  \ have to manually start the alarm control script each time the Raspberry Pi boots\
  \ up, for example, after a power failure — for a start, we may not even be there.\
  \ Therefore, we need to set up our operating system so that it will automatically\
  \ start up the alarm-control.sh script at boot time.\n\nTo do this, we need to edit\
  \ the rc.local file using Nano:\n\n```\n$ sudo nano /etc/rc.local\n```\n\nBefore\
  \ the line containing exit 0, insert the following line:\n\n```\nsudo /etc/pi-alarm/alarm-control.sh\
  \ &\n```\n\n> The & symbol at the end of the line is important because it will then\
  \ make the script run in a different process, otherwise the rc.local script would\
  \ never exit.\n\nYour rc.local file should now look something like this:\n\n```\n\
  #!/bin/sh -e\n#\n# rc.local\n#\n# This script is executed at the end of each multiuser\
  \ runlevel.\n# Make sure that the script will \"exit 0\" on success or any other\n\
  # value on error.\n#\n# In order to enable or disable this script just change the\
  \ execution\n# bits.\n#\n# By default this script does nothing.\n\n# Print the IP\
  \ address\n_IP=$(hostname -I) || true\nif [ \"$_IP\" ]; then\n    printf \"My IP\
  \ address is %s\\n\" \"$_IP\"\nfi\n\nsudo /etc/pi-alarm/alarm-control.sh &\nexit\
  \ 0\n```\n\nThe operating system runs the rc.local script after the system boots\
  \ up, so you can put anything in there that you want to happen automatically at\
  \ this time.\n\n## Preserving the SD card\n\nOne final topic I want to share with\
  \ you is that of preserving your Raspberry Pi's SD card. SD cards have a finite\
  \ write cycle, and continuous writing to the card will eventually burn it out. If\
  \ we're going to be writing lots of log file entries and taking lots of camera images,\
  \ we will want to protect our SD card in order to maintain the integrity and reliability\
  \ of our system; using the system RAM instead can help us with this.\n\n## Creating\
  \ a RAM-based file system\n\nOur Raspberry Pi has plenty of fast system RAM available\
  \ to us (1Gb on the latest models) that isn't susceptible to this write burn-out\
  \ issue. Therefore, I'm going to show you how to allocate some of it to create a\
  \ temporary disk in memory, which we can write files to that we don't need kept\
  \ on the SD card. Such files would include the, quite large, camera image files\
  \ that will be emailed out of the system — which, therefore, don't need to be stored\
  \ permanently. You should also consider any log files that are regularly written\
  \ to, which would then be shipped off the system at regular intervals.\n\n> Remember\
  \ that this is a RAM-based file system, so content will be lost when the Raspberry\
  \ Pi shuts down or reboots. So, don't store any data here that you want to persist\
  \ after a restart.\n\nLet's create a Bash script file called setup-ramfs.sh, and\
  \ copy it to our /etc/pi-alarm folder:\n\n```\n#!/bin/bash\n#/etc/pi-alarm/setup-ramfs.sh\n\
  \nRAM_DISK=\"/ramfs\"\nRAM_DISK_SIZE=64M\n\n# Create RAM Disk #############################\n\
  if [ ! -z \"$RAM_DISK\" ]; then\n    echo \"[INIT] Creating RAM Disk... $RAM_DISK\"\
  \n    mkdir -p $RAM_DISK\n    chmod 777 $RAM_DISK\n    mount -t tmpfs -o size=$RAM_DISK_SIZE\
  \ tmpfs $RAM_DISK/\n    echo \"[INIT] RAM Disk created at $RAM_DISK\"\nfi\n###############################################\n\
  ```\n\n## setup-ramfs.sh RAM disk creation script\n\nRunning the preceding script\
  \ will create a RAM disk folder at /ramfs – you can treat it just like any other\
  \ folder; it's just that it resides in the system memory rather than on the SD card:\n\
  \n```\n$ cd /ramfs\n$ ls\n```\n\nYou can call this script from the alarm-control.sh\
  \ script as part of the initialization process by including the line:\n\n```\n.\
  \ /etc/pi-alarm/setup-ramfs.sh\n```\n\n## Conclusion\n\nThe Raspberry Pi is a powerful\
  \ little beast and a great platform for building low-cost, but highly capable, embedded\
  \ systems. The interfaces built into its GPIO connector make it easy to bolt on\
  \ modules using simple low-cost electronics and a bit of configuration to create\
  \ very functional and flexible systems. The inclusion of a dedicated camera interface\
  \ and networking interfaces give you everything you could possible need for an Internet-connected\
  \ home security system.\n\nI've covered a lot of topics in this book, and I could\
  \ have gone on and on, but I hope that what I have presented has been done in a\
  \ structured and methodical way, and has given you the tools and techniques to carry\
  \ on this journey so that you are able to create the perfect home security system\
  \ for your needs.\n\n## Tips for building systems\n\nAs a systems guy who has to\
  \ work with many different technologies and disciplines on a day-to-day basis, I\
  \ just want to leave you with the following thoughts to consider, if you choose\
  \ to build upon the system we've put together in this book, which, of course, I\
  \ hope you will:\n\n- Create a high-level diagram of your proposed system first—a\
  \ bit like the one I produced earlier in this chapter.\n- Define everything in a\
  \ modular way so that you can build and test your system in small chunks. This makes\
  \ it much easier to spot issues early on.\n- Building the system using smaller modules\
  \ makes it easier to re-use and replace circuits and code, and don't be afraid to\
  \ mix-and-match technologies using what's best for the individual module.\n\n\n\n\
  \n"
- '## 模块 3：树莓派机器人核心知识


  利用树莓派结合六自由度（6DoF）技术，打造一台令人惊叹的步行机器人。

  '
- '### 1 配置和编程树莓派


  机器人正开始渗透进我们的世界。它们形状各异、大小不一，能力也各不相同。而且，就像之前个人电脑的演变一样，机器人开发领域的许多成果正来自业余爱好者和自己动手的创客，他们利用新一代廉价硬件以及免费的开源软件，来制造具备各种惊人能力的机器。在本书中，你将通过亲自动手制作一台机器人——一台具有传感器和视觉能力的四足机器人——来学习如何构建机器人。不过，你学到的技能同样可以应用于各种行走、滚动、游泳或飞行机器人。


  在本章中，你将学习：


  -   如何为机器人的控制中心——树莓派——配置 Raspbian 操作系统

  -   如何搭建远程开发环境，以便对机器人进行编程

  -   Python 和 C 语言的基础编程技能，使你能够创建和编辑机器人完成各种惊人任务所需的程序


  #### 配置树莓派——机器人的大脑


  机器人最重要的部件之一，是你用来控制所有不同硬件的处理器系统。在本书中，你将学习如何使用树莓派——一个体积小、价格低、易于使用的处理器系统。树莓派有几个版本——最初的
  A 和 B 型号，以及新型改进的 A+ 和 B+ 型号。B+ 型号最受欢迎，它拥有额外的输入/输出能力、四个 USB 接口和更大的内存，也将是本书重点介绍的型号。


  以下是搭建初始树莓派开发环境所需的物品：


  -   一个树莓派 2 型号 B。还有其他三种树莓派型号：B+、B 和 A。这些型号的处理能力较弱，硬件配置也有所不同。在本书中，我们将重点介绍树莓派 2 型号
  B；它拥有最强的处理能力和最实用的输入/输出接口。不过，书中涉及的许多内容也同样适用于树莓派 B+ 和 A 版本，可能只需要额外补充一些硬件。

  -   为板卡供电的 USB 数据线。

  -   一张 microSD 卡——至少 4GB。

  -   一个 microSD 卡读写器。

  -   另一台连接到互联网的计算机。

  -   为板卡准备的网络连接——在初始配置步骤中，你需要一根网线和有线局域网连接。

  -   一个无线局域网设备。


  以下是树莓派 2 型号 B 板卡的外观：


  ![](img/631e8b200cce187082ee46b0eb1681b3_455_0.png)


  你还应该熟悉板卡上的各种连接接口。它们在下图中已为树莓派 2 型号 B 标注出来，供你参考：


  ![](img/631e8b200cce187082ee46b0eb1681b3_455_1.png)


  #### 安装操作系统


  在开始之前，你需要下载并制作一张带有 Raspbian 操作系统的存储卡。你将把 Raspbian——Debian 版 Linux 的一个开源版本——安装到树莓派上。


  让树莓派装上 Raspbian 有两种方式。树莓派板卡现在已经相当普及，你可以直接买到预装 Raspbian 的 SD 卡，也可以下载到个人电脑上，再安装到存储卡中。如果你打算下载发行版，则需要决定是用
  Windows 电脑还是 Linux 机器来下载并制作 SD 卡。


  无论使用哪台机器，你都需要下载一个镜像文件。打开浏览器窗口，进入树莓派官网 www.raspberrypi.org，从页面顶部选择“Downloads”。这里会给出多种下载选项。进入
  Raspbian 部分，选择镜像标识符右侧的 .zip 文件。这将下载一个包含 Raspbian 操作系统镜像的压缩文件。请注意默认的用户名和密码，稍后你会用到。


  如果你使用的是 Windows，则需要使用 7-Zip 之类的解压程序解压该文件。解压后会得到一个 .img 扩展名的文件，这个文件可以写入你的存储卡。接下来，你需要一个能将镜像写入存储卡的程序。如果你打算使用
  Windows 机器制作存储卡，可以使用 Image Writer。你可以在 www.raspberrypi.org 网站下载部分的顶部找到该程序的链接。将存储卡插入电脑，运行该程序，你应当看到：


  ![](img/631e8b200cce187082ee46b0eb1681b3_456_0.png)


  选择正确的存储卡和镜像文件，界面看起来应类似这样：


  ![](img/631e8b200cce187082ee46b0eb1681b3_457_0.png)


  然后选择**写入**。这一步需要一些时间，完成后，从电脑中弹出存储卡。


  如果你使用的是 Linux，则需要解压文件，然后将其写入存储卡。所有这些操作都可以用一条命令完成。不过，你需要找到存储卡的 `/dev` 设备标识。你可以使用
  `ls -la /dev/sd*` 命令来查看。如果在插入存储卡之前运行该命令，你可能会看到类似下面的输出：


  ![](img/631e8b200cce187082ee46b0eb1681b3_457_1.png)


  插入存储卡后，你可能会看到类似下面的输出：


  ![](img/631e8b200cce187082ee46b0eb1681b3_458_0.png)


  注意，你的存储卡是 sdb。现在，进入你下载的压缩镜像文件所在目录，执行以下命令：


  ```

  sudo dd if=2015-01-31-raspbian.img of=/dev/sdX

  ```


  将 2015-01-31-raspbian.img 替换为你下载的镜像文件名，将 /dev/sdX 替换为你的存储卡标识；在本例中为 /dev/sdb。


  存储卡镜像制作完成后，将其安装到树莓派上。你还需要将树莓派接入网线，并将网线连接到有线局域网。


  如果你没有有线连接，也可以通过直接将树莓派连接到显示器、键盘和鼠标来完成以下步骤。


  给设备通电。POWER 指示灯应当亮起，设备应从存储卡启动。要配置系统，你需要远程访问它。为此，你需要通过 SSH 连接到设备。SSH 是一种安全协议，允许你从另一台计算机远程控制一台计算机。


  远程访问系统的一个挑战是，你需要知道板卡的 IP 地址。有一种方法可以通过 IP 扫描器应用来发现地址。可免费使用的扫描器有很多；在 Windows 上，一个可选方案是
  Advanced IP Scanner，可从 `http://www.advanced-ip-scanner.com/` 获取。下面是该程序运行时的界面：


  ![](img/631e8b200cce187082ee46b0eb1681b3_459_0.png)


  点击**扫描**按钮，将扫描网络中所有连接的设备。你也可以在 Linux 中执行此操作；Linux 中一个用于 IP 扫描的应用程序是 Nmap。要安装 Nmap，输入
  `sudo apt-get install nmap`。要运行 Nmap，输入 `sudo nmap -sP 10.25.155.1-154`，扫描器将扫描从
  10.25.155.1 到 10.25.155.154 的地址。


  这些扫描器可以让你知道哪些地址正在使用，从而帮助你找到树莓派的 IP 地址。由于你将通过 SSH 访问设备，你还需要在远程电脑上运行一个 SSH 终端程序。如果你使用微软
  Windows，可以下载这样的应用程序。一个简单易用的选择是 PuTTY。它是免费的，并且能很好地保存你的配置，这样你就不必每次重新输入。该程序可从 `www.putty.org`
  获取。


  在你的微软 Windows 机器上下载 PuTTY，然后运行 `putty.exe`。你应该会看到一个配置窗口，界面类似于以下截图：


  ![](img/631e8b200cce187082ee46b0eb1681b3_460_0.png)


  在**主机名**一栏中输入 IP 扫描器显示的 inet 地址，并确保选中 SSH。你也许想将此配置保存为 Raspberry Pi，以便每次可以重新加载。


  当你点击**打开**时，系统将尝试通过局域网连接在树莓派上打开一个终端窗口。第一次这样做时，你会收到一个关于 RSA 密钥的警告，因为两台计算机互不认识；Windows
  是在抱怨一台它不认识的计算机即将以相当私密的方式连接进来。只需点击 OK，你就会看到一个带有登录提示符的终端，如下图所示：






  ![](img/631e8b200cce187082ee46b0eb1681b3_461_0.png)


  现在你可以通过登录并向你的树莓派发出命令了。如果你想从 Linux 机器上操作，过程甚至更简单。打开一个终端窗口，然后输入 `ssh pi@xxx.xxx.xxx.xxx
  -p 22`，其中 xxx.xxx.xxx.xxx 是你的设备的 inet 地址。这样就会进入你的树莓派的登录界面，应该与之前的截图类似。


  登录后，你应该会看到如下屏幕：


  ![](img/631e8b200cce187082ee46b0eb1681b3_461_1.png)


  ## 配置和编程树莓派


  首先，你需要扩展文件系统以占用整张卡。所以，按下 *Enter* 键，你会看到以下屏幕：


  ![](img/631e8b200cce187082ee46b0eb1681b3_462_0.png)


  再次按 *Enter*，你就会返回主配置屏幕。现在，选择 **启用启动到桌面/Scratch** 选项。


  ![](img/631e8b200cce187082ee46b0eb1681b3_462_1.png)


  按下 Enter 后，你会看到以下屏幕：


  ![](img/631e8b200cce187082ee46b0eb1681b3_463_0.png)


  你也可以选择超频你的设备。这是一种让你获得更高系统性能的方法。然而，有风险可能会导致系统出现可靠性问题。


  完成后回到主配置菜单，按 Tab 键直到光标定位到 <Finish> 选择上，然后按 Enter。然后，再按一次 Enter 以重启你的树莓派。这次登录时，你将看不到任何配置选项。但是，如果你以后想更改配置选择，可以在命令行中输入
  raspi-config 运行配置工具。


  ### 添加远程图形用户界面


  在你的机器人构建的某些步骤中，你需要对系统有一个图形化的查看。你可以在树莓派上使用一个名为 vncserver 的应用程序来实现。你需要在树莓派上安装一个版本，方法是：在树莓派的终端窗口中输入
  sudo apt-get install tightvncserver。


  Tightvncserver 是一个应用程序，允许你远程查看完整的图形桌面。安装完成后，你可以执行以下操作：


  - 1. 你需要在树莓派的终端窗口中输入 `vncserver` 来启动服务器。

  - 2. 然后系统会提示你输入密码，验证密码，然后询问是否想要一个只读密码。记住你输入的密码；你需要它通过 VNC 查看器远程登录。

  - 3. 你需要为远程计算机准备一个 VNC 查看器应用程序；一个不错的选择是 Real VNC，可从 http://www.realvnc.com/download/viewer/
  获取。运行它时，你应该会看到如下内容：


  ![](img/631e8b200cce187082ee46b0eb1681b3_464_0.png)


  4. 输入 VNC 服务器地址，即你的树莓派的 IP 地址，然后点击 Connect。你会收到关于未加密连接的警告；选择 Continue，然后你会看到此弹出窗口：


  ![](img/631e8b200cce187082ee46b0eb1681b3_464_1.png)


  5. 输入你在启动 vncserver 时刚刚输入的密码，然后你应该会看到树莓派的图形视图，如下截图所示：


  ![](img/631e8b200cce187082ee46b0eb1681b3_465_0.png)


  现在你可以访问系统的所有功能，尽管如果你进行图形密集型数据传输，可能会变慢。为了避免每次启动树莓派时都要输入 vncserver，请使用 http://www.haveteknowhow.com/Configure-the-server/run-VNC-on-boot.html
  上的说明。


  Vncserver 也可通过 Linux 使用。你可以使用一个名为 Remote Desktop Viewer 的应用程序来查看远程树莓派 Windows 系统。如果你尚未安装此应用程序，请根据你所使用的
  Linux 系统类型，使用更新的软件应用程序进行安装。安装软件后，按以下步骤操作：


  - 1. 运行该应用程序，你应该会看到以下截图：


  ![](img/631e8b200cce187082ee46b0eb1681b3_466_0.png)


  - 2. 确保 vncserver 在树莓派上运行；最简单的方法是使用 SSH 登录并在提示符下运行 vncserver。现在，点击 Remote Desktop
  Viewer 上的 Connect。按如下方式填写屏幕。在协议选择下，选择 VNC，你应该会看到以下截图：


  ![](img/631e8b200cce187082ee46b0eb1681b3_467_0.png)


  3. 现在，输入 Host inet 地址 — 确保在末尾加上 :1，然后点击 Connect。你需要输入设置的 vncserver 密码，如下截图所示：


  ![](img/631e8b200cce187082ee46b0eb1681b3_467_1.png)


  你现在应该能看到树莓派的图形屏幕。你已准备好开始与系统交互！


  ### 建立无线访问


  系统配置完成后，下一步是使用无线方式将树莓派连接到你的远程计算机。为此，你需要添加一个无线 USB 设备并进行配置。参见 http://elinux.org/RPi_USB_Wi-Fi_Adapters
  以识别已验证可与树莓派配合使用的无线设备。以下是许多在线电子商店可买到的一种：


  ![](img/631e8b200cce187082ee46b0eb1681b3_468_0.png)


  要连接到你的无线局域网，启动系统并通过输入 `sudo nano /etc/network/interfaces` 编辑网络文件。然后，将文件编辑成如下所示：


  ![](img/631e8b200cce187082ee46b0eb1681b3_469_0.png)


  重启设备，它现在应该已连接到你的无线网络。


  > 如果你使用的是美国键盘，你可能需要为键盘编辑键盘文件以便有效使用 nano。为此，输入 sudo nano /etc/default/keyboard 并将
  XKBLAYOUT="gb" 改为 XKBLAYOUT="us"。


  你的系统具有许多功能。随意尝试系统，这将帮助你了解已有的功能以及从软件角度需要添加的内容。


  ### 在树莓派上编程


  最后一点介绍。你需要具备一些基础编程技能才能在项目上取得成功。本节将简要介绍树莓派上的 Python 和 C 编程。


  ### 在树莓派上创建和运行 Python 程序


  你将使用 Python 有两个原因。首先，它是一种简单、直观且非常易用的语言。其次，机器人领域的大量开源功能都以 Python 提供。要运行本节中的示例，你需要安装一个
  Python 版本。幸运的是，基础的 Raspbian 系统已预装了一个版本，所以你可以开始了。


  > 如果你刚开始编程，有许多网站提供交互式教程。如果你想使用这些工具练习 Python 中的一些基础编程概念，请访问 www.codecademy.com 或
  http://www.learnpython.org/ 并试试看。


  不过，为了让你入门，我们先介绍如何创建和运行 Python 文件。事实证明 Python 是一种交互式语言，所以你可以运行 Python 然后逐条输入命令。然而，你希望使用
  Python 创建程序，所以你将创建 Python 程序，然后从命令行通过调用 Python 来运行这些程序。


  通过输入 emacs example.py 打开一个示例 Python 文件。现在，在文件中加入一些代码。从以下截图中所示的行开始：


  ![](img/631e8b200cce187082ee46b0eb1681b3_470_0.png)


  你也可以在不输入 python example.py 的情况下直接从命令行运行程序，只需在程序中添加一行。现在，程序应如下截图所示：


  ![](img/631e8b200cce187082ee46b0eb1681b3_472_0.png)


  在第一行添加 #!/usr/bin/python 只是使该文件可在命令行执行。一旦保存文件并退出 emacs，输入 chmod +x example.py。这将更改文件的执行权限，这样计算机就会相信它并执行它。你应该只需输入
  ./example.py 程序就会运行，如下截图所示：


  ![](img/631e8b200cce187082ee46b0eb1681b3_472_1.png)


  请注意，如果你只输入 example.py，系统将找不到可执行文件。在这种情况下，文件未在系统中注册，所以你必须给出文件的路径。在这里，./ 是当前目录。





  ## C/C++ 编程语言简介


  现在你已经接触了 Python 这一简单编程语言，还需要了解一种更复杂但功能强大的语言——C。C 是 Linux 的原生语言，已经存在了几十年，但至今仍被开源开发者广泛使用。它与
  Python 相似，但也有所不同，而且由于你可能需要理解并修改 C 代码，你应该熟悉它并了解其用法。


  与 Python 一样，你需要能够使用语言功能。这些功能以编译器和构建系统的形式提供，它们将你的文本文件转换为包含机器码程序的文件，处理器才能实际执行。为此，输入
  sudo apt-get install build-essential。这将安装你所需的程序，以便将代码转换为系统可执行文件。


  现在工具已安装，让我们看一些简单示例。这是第一个 C/C++ 代码示例：


  ![](img/631e8b200cce187082ee46b0eb1681b3_473_0.png)


  以下是对代码的说明：


  - `#include <iostream>`：这是一个包含进来的库，使你的程序能够从键盘输入数据并向屏幕输出信息。

  - `int main()`：与 Python 一样，我们可以将函数和类放入文件中，但你总希望从一个已知点开始执行；C 将这一点定义为主函数。

  - `int a;`：这定义了一个名为 a、类型为 int 的变量。C 是我们所说的强类型语言，这意味着我们需要声明所定义变量的类型。常见类型包括 int（无小数点的数字）、float（需要小数点的数字）、char（文本字符）和
  bool（真或假值）。还要注意，C 中的每一行都以 ; 字符结尾。

  - `int b;`：这定义了一个名为 b、类型为 int 的变量。

  - `int c;`：这定义了一个名为 c、类型为 int 的变量。

  - `std::cout << "Input value: ";`：这将在屏幕上显示字符串 "Input value: "。

  - `std::cin >> a;`：用户输入的内容将存入变量 a。

  - `std::cout << "Input second value: ";`：这将在屏幕上显示字符串 "Input second value: "。

  - `std::cin >> b;`：用户输入的内容将存入变量 b。

  - `c = a + b`：该语句是两个值的简单相加。

  - `std::cout << c << std::endl;`：cout 命令打印出 c 的值。末尾的 endl 命令打印一个回车符，使下一个字符出现在下一行。

  - `return 0;`：主函数结束并返回 0。


  要运行此程序，你需要执行编译过程，将其转换为可运行的可执行程序。为此，在创建程序后，输入 g++ example2.cpp -o example2。然后它将处理你的程序，将其转换为计算机可以执行的文件。可执行程序的名称将是
  example2（由 -o 选项后面的名称指定）。


  如果在编译后对目录执行 ls，你应该会在目录中看到 example2 文件，如以下截图所示：


  ![](img/631e8b200cce187082ee46b0eb1681b3_475_0.png)


  如果遇到问题，编译器会尝试帮助你找出问题。例如，如果在表达式 int a 中在 a 前忘记写 int，则编译时会收到以下错误：


  ![](img/631e8b200cce187082ee46b0eb1681b3_475_1.png)


  错误消息指示 int main() 函数中存在问题，并告诉你变量 a 未成功声明。编译文件后，要运行可执行文件，请输入 ./example2，你应该能够得到以下结果：


  ![](img/631e8b200cce187082ee46b0eb1681b3_476_0.png)


  如果你有兴趣了解更多 C 编程知识，网上有几个不错的教程可以提供帮助——例如 http://www.cprogramming.com/tutorial/c-tutorial.html
  和 http://thenewboston.org/list.php?cat=14。


  关于 C，你还需要了解一个方面。刚才遇到的编译过程看起来相当直接。但是，如果你的功能分布在大量文件中，或者需要大量库，那么使用命令行方式执行编译可能会变得笨拙。


  C 开发环境提供了一种自动化此过程的方法；它被称为 make 过程。使用时，你创建一个名为 makefile 的文本程序，定义要包含和编译的文件，然后，无需输入一长串命令或一系列命令，只需输入
  make，系统就会根据 makefile 程序中的定义执行编译。有几个不错的教程会详细介绍该系统——例如 http://www.cs.colby.edu/maxwell/courses/tutorials/maketutor/
  或 http://mrbook.org/tutorials/make/。


  现在你已经具备了编辑和创建自己的编程文件的能力。接下来的章节将为你提供大量练习机会，让你在将代码行转换为酷炫的机器人功能时磨练技能。


  ## 总结


  恭喜！你的 Raspberry Pi 已经启动并正常工作。这块硬件不会在垃圾桶里积灰。现在，你已经准备好开始命令你的 Raspberry Pi 做一些事情了。


  下一章将向你展示如何构建你的双足机器人。

  '
- "## 2\n\n## 构建双足机器人\n\n现在你的 Raspberry Pi 2 Model B 已全部配置好并准备就绪，你需要添加一些硬件来进行控制和交互。在本章中，你将学习：\n\
  \n- 如何构建一个基本的 10 自由度（DOF）双足机器人\n- 如何使用连接到 Raspberry Pi USB 端口的舵机电机控制器来控制舵机，使你的机器人移动\n\
  \n### 构建能行走的机器人\n\n在考虑如何创建移动机器人时，有几种选择。其中一个更有趣的选择是能行走的机器人。这通常有三种版本：两条腿的双足机器人、四条腿的四足机器人和六条腿的六足机器人。虽然每种版本都提供了一组有趣且不同的可能性，但在本章中，你将构建一个基本的\
  \ 10 自由度双足机器人。\n\n你将在项目中使用总共 10 个舵机，因为每条腿有 5 个可以移动的点，即 5 个自由度（DOF）。由于舵机是这个项目中最关键的组件，因此不妨先学习一下舵机教程，了解如何控制它们。\n\
  \n### 舵机电机的工作原理\n\n舵机电机与直流电机有些相似。然而，有一个重要区别。直流电机通常设计为连续运动——以给定速度旋转 360 度——而舵机通常设计为移动到有限的角度集合。换句话说，在直流电机领域，你通常希望电机以可控的连续旋转速度旋转。在舵机领域，你希望电机移动到你可控的特定位置。\n\
  \n这是通过向舵机的控制连接器发送脉宽调制（PWM）信号来实现的。脉冲的长度将像这样控制舵机的角度：\n\n![](img/631e8b200cce187082ee46b0eb1681b3_480_0.png)\n\
  \n这些脉冲以 60 Hz 的重复率发送。你可以通过设置正确的控制脉冲，将舵机定位到任何角度。\n\n### 构建双足平台\n\n构建双足平台有几种方法。最简单的也许是购买一套基本零件；这是本章中你将看到的示例。市场上有几种套件可选，包括\
  \ http://www.robotshop.com/en/lynxmotion-biped-robot-scout-bps-ns-servos.html 的一种，像\
  \ http://www.ebay.com/itm/10-DOF-Biped-Robot-Mechanical-Leg-Robot-Servo-Motor-Bracket-NO-Servo-Motor-good-/131162548695?pt=LH_DefaultDomain_0&hash=item1e89e5a9d7\
  \ 提供的套件，或者 http://www.amazon.com/gp/product/B00DR7GA4I/ref=oh_aui_detailpage_o04_s00?ie=UTF8&psc=1\
  \ 的那种。这是我们在本章中使用的具体套件。\n\n最终，你的双足机器人会更像霸王龙的腿，而不是人类的腿，但这将使其更容易编程，并且关机时会更加优雅。它也会更稳定一些。\n\
  \n\n\n\n你还需要10个标准尺寸的舵机。有几种可能的选择，但**Hitec**舵机相对便宜，而且大多数模型店和在线电子零售商都有售。此过程中重要的一步是选择舵机的型号。舵机有不同的型号编号，主要基于它们能产生的扭矩大小。\n\
  \n扭矩是舵机为移动与其连接的部件所能施加的力。在这种情况下，你的舵机需要抬起并移动双足机器人的重量，因此你需要一个具有足够扭矩的舵机来完成这一任务。然而，你的双足机器人对扭矩的需求有所不同。踝关节不会抬起整条腿，因此可以使用额定值较低的舵机，例如HS-422舵机。对于膝关节舵机，你需要一个更强力的舵机。在这种情况下，我建议你使用HS-645MGHB型号的舵机。负责抬起腿部的髋关节是所需扭矩最大的地方。同样，我建议你使用HS-645MG型号的舵机。你也可以全部使用10个HS-645MG舵机，但它们更贵，所以使用不同舵机会省钱。\n\
  \n最后需要的一个部件是金属舵机摇臂。这些舵机摇臂不是必需的，但它们会让你的双足机器人比使用舵机自带的塑料摇臂更坚固。下面是其中一个摇臂的图片：\n\n![](img/631e8b200cce187082ee46b0eb1681b3_481_0.png)\n\
  \n以下是组装双足机器人的步骤：\n\n- 1. 将第一个踝关节舵机安装到脚上。为此，找到脚板，如下图所示：\n\n![](img/631e8b200cce187082ee46b0eb1681b3_482_0.png)\n\
  \n这是脚的底部。注意那些沉头孔——你将使用沉头螺栓将舵机支架连接到脚板上，如下图所示：\n\n![](img/631e8b200cce187082ee46b0eb1681b3_483_0.png)\n\
  \n- 2. 确保脚底是平的。在将舵机安装到此支架之前，你需要先用套件中的一个轴承将一个U形支架连接到这个舵机支架上，像这样：\n\n![](img/631e8b200cce187082ee46b0eb1681b3_483_1.png)\n\
  \n- 3. 最后，将其中一个舵机安装到支架中，并将U形支架连接到舵机摇臂上，如下图所示：\n\n![](img/631e8b200cce187082ee46b0eb1681b3_484_0.png)\n\
  \n- 4. 第一个舵机应能让你的双足机器人移动脚部，使其左右倾斜。现在，将第二个踝关节舵机添加到脚上。这将使你的双足机器人能够让踝关节前后倾斜。为此，将一个舵机支架连接到刚刚组装好的组件上，然后在这个组件上加一个U形支架，像这样：\n\
  \n![](img/631e8b200cce187082ee46b0eb1681b3_485_0.png)\n\n- 5. 现在，将这个支架添加到这个组件上，像这样：\n\
  \n![](img/631e8b200cce187082ee46b0eb1681b3_485_1.png)\n\n## 组装双足机器人\n\n- 6. 现在，你可以将膝关节舵机添加到双足机器人上。不过，你首先要将大腿（最长的U形支架）连接到一个舵机支架上，像这样：\n\
  \n![](img/631e8b200cce187082ee46b0eb1681b3_486_0.png)\n\n- 7. 现在，使用另一个轴承将这个组件连接到你已经组装好的小腿上，像这样：\n\
  \n![](img/631e8b200cce187082ee46b0eb1681b3_487_0.png)\n\n## 组装双足机器人\n\n- 8. 现在，你可以在这个位置安装膝关节舵机。如果你有不同的舵机，请在膝关节使用更强力的舵机。下面是一张图片：\n\
  \n![](img/631e8b200cce187082ee46b0eb1681b3_488_0.png)\n\n- 9. 最后一步是组装髋关节。首先，你将安装控制腿部转动的舵机，将其连接到一个舵机支架上，如下图所示：\n\
  \n![](img/631e8b200cce187082ee46b0eb1681b3_488_1.png)\n\n- 10. 现在，将这个舵机支架连接到长U形支架上，并安装用于抬起整条腿的舵机。这是另一个关键位置；如果你使用不同的舵机，需要选择一个扭矩较大的舵机。整个组件应该如下图所示：\n\
  \n![](img/631e8b200cce187082ee46b0eb1681b3_489_0.png)\n\n- 11. 组装另一条腿。它将是第一条腿的镜像。\n\
  \n- 12. 现在，你将两条腿连接到髋关节上，首先在髋关节部件的两个位置分别连接一个舵机支架连接器，像这样：\n\n![](img/631e8b200cce187082ee46b0eb1681b3_489_1.png)\n\
  \n- 13. 最后，将腿部舵机的顶部安装到支架中，像这样：\n\n![](img/631e8b200cce187082ee46b0eb1681b3_490_0.png)\n\
  \n你的双足机器人现在可以行走了。既然基本硬件已经组装完成，你可以将注意力转向电子部分。\n\n## 使用舵机控制器控制舵机\n\n要让你的双足机器人行走，首先需要将舵机电机控制器连接到舵机。本项目中你将使用的舵机控制器是一款利用USB的简易舵机电机控制器，来自Pololu公司——Pololu产品编号1354可在pololu.com购买——它可以控制18个舵机电机。下面是该设备的图片：\n\
  \n![](img/631e8b200cce187082ee46b0eb1681b3_491_0.png)\n\n请确保你订购的是组装好的版本。这个硬件会将来自树莓派的USB命令转换为控制舵机电机的信号。Pololu制造了多款不同版本的控制器，每款都能控制一定数量的舵机。在这种情况下，你可能希望选择18舵机版本，这样你可以用一个控制器控制全部12个舵机，还可以额外添加一个舵机来控制摄像头或传感器的方向。你也可以选择12舵机版本。18舵机控制器的一个优点是可以通过螺丝型连接器轻松为该设备供电。\n\
  \n要开始使用，你需要为舵机控制器进行两种连接：第一种连接到舵机电机，第二种连接到电池。\n\n首先，将舵机连接到控制器。为了保持一致，我们按照以下配置将你的12个舵机连接到控制器上标有0到11的连接端口：\n\
  \n| 舵机连接端口 | 舵机 |\n|---|---|\n| 0 | 右脚踝内/外 |\n| 1 | 右脚踝前/后 |\n| 2 | 右膝 |\n| 3 |\
  \ 右髋上/下 |\n| 4 | 右髋转动 |\n| 5 | 左脚踝内/外 |\n| 6 | 左脚踝前/后 |\n| 7 | 左膝 |\n| 8 | 左髋上/下\
  \ |\n| 9 | 左髋转动 |\n\n这是控制器背面的图片；它告诉我们应该在哪里连接舵机：\n\n![](img/631e8b200cce187082ee46b0eb1681b3_492_0.png)\n\
  \n现在，你需要将舵机电机控制器连接到电池。对于本项目，你可以使用一块2S遥控锂聚合物电池；它能提供7.4伏电压以及舵机所需的电流，电流大约为2安培。下面是图片：\n\
  \n![](img/631e8b200cce187082ee46b0eb1681b3_493_0.png)\n\n这块电池会附带两个连接器，一个使用较粗规格的导线用于正常使用，另一个较小的连接器用于连接到电池充电器。你可以使用XT60连接器对，将一些导线焊接到电池的配套连接器上，然后将导线的裸露端插入舵机控制器。\n\
  \n你的系统现在可以工作了。你可以将电机控制器连接到个人电脑，以检查是否能够与它通信。为此，请在舵机控制器和个人电脑之间连接一根迷你USB线。\n\n## 通过电脑与舵机控制器通信\n\
  \n现在硬件已连接，你可以使用Polulu提供的一些软件来控制舵机。让我们用你的个人电脑来完成这一步。首先，从 www.pololu.com/docs/0J40/3.a\
  \ 下载Polulu软件，并根据网站上的说明进行安装。安装完成后，运行该软件，你应该会看到这个界面：\n\n![](img/631e8b200cce187082ee46b0eb1681b3_494_0.png)\n\
  \n首先，你需要在“串口设置”中更改配置，因此选择“串口设置”选项卡，你应该会看到：\n\n![](img/631e8b200cce187082ee46b0eb1681b3_495_0.png)\n\
  \n确保选中“USB Chained”选项；这将允许你通过USB连接和控制电机控制器。现在，选择“状态”选项卡返回主界面；此时，你实际上可以开启10个舵机。界面应该如下所示：\n\
  \n![](img/631e8b200cce187082ee46b0eb1681b3_495_1.png)\n\n\n\n## 搭建双足机器人\n\n现在你可以使用滑块来实际控制舵机了。打开舵机\
  \ 0。确认舵机 0 控制的是右下脚踝处的舵机。你也可以用它来使舵机居中。将舵机 1 设为滑块位于中间的位置。然后，拧松舵机上的舵盘，直到舵机在这个位置处于居中状态。当所有舵机都位于零位时，你的双足机器人应该看起来像这样：\n\
  \n![](img/631e8b200cce187082ee46b0eb1681b3_496_0.png)\n\n### 将舵机控制器连接到树莓派\n\n你已经检查过舵机电机控制器和舵机。现在可以将电机控制器连接到树莓派，并确保你能从树莓派控制舵机。\n\
  \n接下来，让我们与电机控制器通信。步骤如下：\n\n- 1. 使用 Mini USB 线将树莓派连接到电机控制器。将线缆连接到树莓派的 USB 主机接口上，就像这样：\n\
  \n![](img/631e8b200cce187082ee46b0eb1681b3_497_0.png)\n\n- 2. 从 Pololu 官网 www.pololu.com/docs/0J40/3.b\
