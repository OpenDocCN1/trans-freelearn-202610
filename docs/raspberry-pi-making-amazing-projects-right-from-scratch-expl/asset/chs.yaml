  \ Python 编程控制舵机，可以实验一些基本姿态了。你首先要创建一个允许你单独设置每个舵机的程序，以便进行实验。下面是这个程序：\n\n![](img/631e8b200cce187082ee46b0eb1681b3_506_0.png)\n\
