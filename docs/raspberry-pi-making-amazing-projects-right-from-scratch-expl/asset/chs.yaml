  \ `setAngle` 命令来设置舵机，从而操控机器人的右脚踝。\n\n### 小结\n\n现在你拥有一个可以移动的机器人了！在下一章中，你将学习如何让机器人做出许多令人惊叹的事情。你将学习如何让它向前和向后行走，以及如何让它跳舞和转弯。掌握一些基础知识后，你就可以实现各种各样的动作。\n"
- "## 3 双足机器人的运动\n\n现在你的双足机器人已经能够正常运行了，你可以开始开发有趣的方式来让它移动。在本章中，你将学习：\n\n- 如何调整舵机的位置以实现霸王龙姿态\n\
