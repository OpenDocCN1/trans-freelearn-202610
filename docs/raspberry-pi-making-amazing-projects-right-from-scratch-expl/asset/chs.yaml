  \ CSI\n- 显示接口 DSI\n- micro-SD 卡槽 现为推拉式而非推推式\n- VideoCore IV 3D 图形核心\n\nPi 3 的外形尺寸与\
  \ Pi 2 和 Pi 1 Model B+ 相同。Pi 3 与 Pi 1 和 2 完全向后兼容。\n\n> Pi Zero 和 Pi 3 的产品描述可以在 Raspberry\
  \ Pi 的官方产品页面上找到：\n> https://www.raspberrypi.org/products/pi-zero/\n> https://www.raspberrypi.org/products/raspberry-pi-3-model-b/\n\
  \n\n\n\n"
- '## Module 2


  ## 使用 Raspberry Pi 构建家庭安防系统


  使用流行的 Raspberry Pi 板构建您自己的复杂的模块化家庭安防系统

  '
- "## 1\n\n## 设置您的 Raspberry Pi\n\n在我们开始构建家庭安防系统的领域之前，需要做一些准备工作来让我们的 Raspberry Pi\
  \ 正常运行。因此，我们将逐步介绍让 Pi 准备好进行工作的初始步骤。\n\n在本章中，我们将涵盖以下主题：\n\n- 探索可用的不同版本的 Raspberry\
  \ Pi\n- 为您的系统选择合适的 Raspberry Pi 版本\n- 使用 Raspbian 操作系统准备 SD 卡\n- 学习如何通过家庭网络远程访问\
  \ Raspberry Pi\n- 使用最新软件包更新我们的操作系统\n- 探索 Raspberry Pi 上的时间保持选项\n- 设置用户和 root 密码以保护我们的\
  \ Raspberry Pi\n\n## 哪种口味的 Pi？\n\n自 2012 年 Raspberry Pi 发布以来，已经发布了多个迷你 PC 板版本。我将介绍每个已发布的版本及其各自的功能，以便您可以选择适合您特定项目的版本。\n\
  \n## 设置您的 Raspberry Pi\n\n好消息是，就功率而言，使用哪个版本其实并不重要，因为我们的家庭安防系统并不一定需要大量的处理能力，当然这取决于您希望系统执行什么功能）。您可能有一块旧板子闲置着，可以为您使用。\n\
  \n另一个好消息是，所有版本的 GPIO 接口引脚布局都是相同的。较新的版本有更多引脚，但原始的 26 个引脚仍然保持在相同的位置。\n\n![](img/631e8b200cce187082ee46b0eb1681b3_290_0.png)\n\
  \n最新的 Raspberry Pi 版本 2\n\n### Raspberry Pi Model A\n\n家族中的小宝宝是 Model A；它作为 Model\
  \ B 的低成本版本发布，见下一节。与 Model B 的主要区别是它仅配备 256Mb 内存并且没有以太网端口；因此，如果您想将此板连接到网络，您只能使用 USB\
  \ Wi-Fi 适配器。\n\n![](img/631e8b200cce187082ee46b0eb1681b3_291_0.png)\n\n### Raspberry\
  \ Pi Model B\n\n这是首个发布的 Raspberry Pi 版本；后来发布了一个更新的修订版，改进了电源系统和 USB 端口保护。它配备 512Mb\
  \ 内存并具有以太网端口用于连接到您的网络。这可能是使用最广泛的版本，并且拥有以太网端口非常有用，尤其是在快速启动和运行以在无需键盘和显示器的情况下设置和配置\
  \ Pi 时。\n\n![](img/631e8b200cce187082ee46b0eb1681b3_292_0.png)\n\nRaspberry Pi Model\
  \ B 布局\n\n### Raspberry Pi Model B+ 和 Model 2\n\n在 2014 年，Raspberry Pi 基金会发布了与之前版本相比具有一些根本性变化的新板。最根本的变化是板布局、外形尺寸和安装点——这让众多外壳和配件制造商感到沮丧。\n\
  \n事实上，我们当时正在为基于 Raspberry Pi 开发的商业产品原型设计外壳——幸运的是我们在最后一刻得知了板材变更，并能够更改我们的外壳以支持即将推出的\
  \ Model B+。\n\n该板的主要电子更改是增加了 2 个可以为外设提供更多功率的 USB 端口、扩展的 GPIO 接口，以及移除了现在整合到音频插孔中的复合视频端口。它现在还使用\
  \ micro SD 卡并具有更好的卡槽。\n\n在 2015 年 2 月，一款更强大的 Raspberry Pi 发布了：Raspberry Pi Model\
  \ 2。它在外形尺寸和接口方面与 Model B+ 相似，但据报道其升级的 ARM 处理器和 1Gb 内存使其比 Model B/B+ 快 6 倍。\n\n以不到\
  \ £30 的低成本，它是一款很棒的小板，也是嵌入式系统的强大动力。\n\n![](img/631e8b200cce187082ee46b0eb1681b3_293_0.png)\n\
  \nRaspberry Pi Model B+ 和 Model 2 布局\n\n## 型号对比表\n\n|  | Model A | Model B | Model\
  \ B+ | Version 2 |\n|---|---|---|---|---|\n| Processor | ARM1176JZF-S 700 MHz processor,\
  \ VideoCore IV GPU | ARM1176JZF-S 700 MHz processor, VideoCore IV GPU | ARM1176JZF-S\
  \ 700 MHz processor, VideoCore IV GPU | Quad-core ARM Cortex-A7 CPU and a VideoCore\
  \ IV dual-core GPU |\n| Memory | 256Mb | 512Mb | 512Mb | 1Gb |\n| USB Ports | 2\
  \ | 2 | 4 | 4 |\n\n## 设置您的 Raspberry Pi\n\n|  | Model A | Model B | Model B+ | Version\
  \ 2 |\n|---|---|---|---|---|\n| Ethernet | No | Yes | Yes | Yes |\n| No. GPIO Pins\
  \ | 26 | 26 | 40 | 40 |\n| Storage | SD Card | SD Card | Micro SD Card | Micro SD\
  \ Card |\n\n## 那么选择哪一个？\n\n本质上，本书中介绍的任何模块都可以使用任何版本的 Raspberry Pi，但如果您想利用摄像头等功能，这可能需要更多的处理能力和内存，或想要以太网连接，您需要使用\
  \ Model B。\n\n如果您想开始将更多东西插入 USB 端口，例如 GSM 调制解调器，那么我建议您使用 Model B+，因为它可以为这类设备提供更多功率，而无需额外的\
  \ USB 集线器。\n\n如果您想对来自连接摄像头的视频和图像进行更多处理，或想连接很多东西，那么请选择最新的 **Model 2** 板。我将假设您为本项目选择的就是它，并且我将在整本书中使用它；如果您选择使用更早的型号，请注意任何限制。\n\
  \n> Raspberry Pi 基金会网站上有每个型号的更详细信息。您可以访问 `https://www.raspberrypi.org/products`。\n\
  \n## 准备 SD 卡\n\nRaspberry Pi 只能从 SD 卡启动（B+ 和 v2 型号为 micro SD 卡），并且无法从外部驱动器或 USB\
  \ 闪存盘启动（好吧，这并不完全正确，但超出了本书的范围）。\n\n建议您使用 Class 10 SD 卡以获得性能，但 Class 4 或 6 卡对于本项目也足够了。您需要至少\
  \ 4Gb 的卡容量。\n\n现在我们手头有了 Raspberry Pi 板和 SD 卡，我们需要专门为我们的家庭安防系统准备 SD 卡。我们将使用标准的 Raspbian\
  \ 操作系统，因为真的没有理由使用其他发行版；它是 Raspberry Pi 的事实标准选择。\n\n### 下载 Raspbian 镜像\n\n您需要从 Raspberry\
  \ Pi 网站 `https://www.raspberrypi.org/downloads` 获取最新的 **Raspbian OS** 镜像。\n\n将 Raspbian\
  \ OS ZIP 文件包含镜像下载到您的 PC。\n\n> 截至撰写时，最新版本为 Raspbian Jessie 版本 4.1（`2015-09-24-raspbian-jessie.zip`）。\n\
  \n下载后，解压文件，您将得到文件 `2015-09-24-raspbian-jessie.img`。\n\n下一步是将此镜像烧录到您的 SD 卡……\n\n\
  #### 使用 Microsoft Windows\n\n在 Windows PC 上，将镜像烧录到 SD 卡的最佳方式是使用 **Win32 Disk Imager**\
  \ 实用程序。可以从 `http://sourceforge.net/projects/win32diskimager` 下载。\n\n> 截至撰写时，当前版本为\
  \ 0.9.5。\n\n它没有安装程序，直接从 EXE 文件启动。\n\n现在，是时候创建您的 SD 卡镜像了：\n\n- 1. 将 SD 卡插入 PC 并启动\
  \ Win32 Disk Imager。\n- 2. 选择 SD 卡设备驱动器号（确保正确！）。\n- 3. 选择您刚刚下载的 Raspbian 镜像文件。\n\
  \n4. 单击写入按钮以创建 SD 卡镜像。\n\n![](img/631e8b200cce187082ee46b0eb1681b3_296_0.png)\n\n\
  ### 使用 Linux\n\n在 Linux PC 上，您需要使用 gparted 和 dd 实用程序将镜像烧录到 SD 卡。\n\n按照以下步骤创建您的 SD\
  \ 卡镜像：\n\n- 1. 将 2015-09-24-raspbian-jessie.img 解压到您的主文件夹。\n- 2. 将 SD 卡插入 PC。\n\
  - 3. 如果您尚未在 shell 终端窗口中，请打开一个（您可以在大多数基于图形的桌面系统上使用 Ctrl + Alt + T）。\n- 4. 在 shell\
  \ 终端中输入以下命令：\n  $ sudo fdisk -l\n  在列表中检查您的 SD 卡是否作为驱动设备出现（例如，/dev/sdb）。至关重要的是您要确保在下一步中使用正确的设备。我们假设您的设备是\
  \ /sdb。\n- 5. 要将镜像烧录到 SD 卡，请输入以下命令：\n  $ sudo dd if=2015-09-24-raspbian-jessie.img\
  \ of=/dev/sdb\n- 6. 按 Enter 并去泡杯茶或咖啡，因为这需要一段时间。当命令（$）提示符重新出现时，您就知道它完成了。\n- 7. 当命令提示符重新出现时，输入以下命令：\n\
  \  $ sudo sync\n- 8. 该命令完成后，您可以从 PC 中取出 SD 卡。\n\n\n\n\n\n## 启动你的 Pi\n\n你现在准备启动你的树莓派了。把你崭新的\
  \ SD 卡插入其中并接上电源。\n\n假设你的 Pi 已连接显示器，你应该能看到系统正常启动。虽然你可以等待其启动完成后再通过终端会话连接（我们稍后会讨论），但我建议你至少在第一次时连接显示器，以确保一切正常工作。\n\
  \n在新的 **Jessie** 版本的 Raspbian 中，你会直接启动到桌面 GUI，这与之前的版本有很大不同，之前版本在系统首次运行时会进入 **raspi-config**\
  \ 实用程序，在那里设置你的 Pi，并重要的是，扩展文件系统以使用 SD 卡上全部可用空间。\n\n![](img/631e8b200cce187082ee46b0eb1681b3_297_0.png)\n\
  \n*Debian Jessie 默认启动到 GUI*\n\n## 扩展文件系统\n\n当你首次创建 Raspbian SD 卡时，无论 SD 卡大小如何，文件系统里只剩下大约\
  \ 200Mb 的空间。这用处不大，所以我们需要扩展文件系统，使其使用卡上所有可用空间。\n\n幸运的是，现在在树莓派上这非常容易，因为该功能已在桌面的树莓派配置工具中提供。\n\
  \n要访问新的配置工具，请前往 **菜单** 并选择 **首选项 | Raspberry Pi 配置。**\n\n![](img/631e8b200cce187082ee46b0eb1681b3_298_0.png)\n\
  \n新的树莓派配置工具\n\n### 再见 GUI\n\n> 我们的大部分工作都将在命令行界面（CLI）中完成。因此，在一分钟后重启系统之前，让我们先更改 **启动**\
  \ 选项，选择 **To CLI**，如上一个截图所示，这样今后将启动到命令行。\n\n无论如何，现在我们点击 **Expand Filesystem** 按钮，几秒钟后你会看到确认消息。文件系统将在系统下次重启时扩展。\n\
  \n## 使用 raspi-config 实用程序\n\n如果你使用的是旧版本的 Raspbian，或不使用桌面 GUI，那么你需要使用 raspi-config\
  \ 实用程序（这比过去在 shell 中手动操作要好得多）。首次启动时，你会直接进入 raspi-config 实用程序。\n\n![](img/631e8b200cce187082ee46b0eb1681b3_299_0.png)\n\
  \n第一个选项是扩展文件系统选项；选择它，你会看到各种命令在屏幕上滚动。一旦完成，你会看到以下消息：\n\nRoot partition has been resized.\n\
  \nThe filesystem will be enlarged upon the next reboot\n\n点击确定。\n\n在配置屏幕上选择完成，并在提示时重启你的\
  \ Pi。\n\n在文件系统更充裕后重启 Pi 后，你会直接进入 shell 提示符，可以使用默认用户和密码登录。\n\nLogin: pi\n\nPassword:\
  \ raspberry\n\n## 设置你的 Pi\n\n当你启动到 shell 且以太网已连接时，希望 Pi 已连接到你的家庭网络并从路由器获取了 IP 地址。如果是这种情况，你应该在登录提示之前看到已分配的\
  \ **IP 地址**，如下图所示：\n\n![](img/631e8b200cce187082ee46b0eb1681b3_300_0.png)\n\n正如我截图中所见，它给了我\
  \ IP 地址 `192.168.0.118`。这很好，因为我现在可以使用安全 shell（SSH）客户端从我的笔记本电脑舒适地远程访问 Pi。这在我的 Pi\
  \ 在办公室而我想坐在沙发上看电视时仍想操作它时特别有用，我经常在懒惰时这样做。\n\n要做到这一点，请下载 PuTTY：一个允许你通过网络远程连接到 shell\
  \ 终端的实用程序。你可以从 http://www.putty.org 下载它。\n\n安装并启动 PuTTY，你就可以从沙发的舒适位置远程连接到你的 Pi 了。\n\
  \n![](img/631e8b200cce187082ee46b0eb1681b3_301_0.png)\n\n## 设置你的树莓派\n\n在主机名框中输入树莓派的\
  \ IP 地址，然后点击打开。你将在远程终端窗口中连接到你的 Pi。登录后，你几乎可以在 Pi 上做任何事情，就像坐在它面前一样。\n\n![](img/631e8b200cce187082ee46b0eb1681b3_302_0.png)\n\
  \n我们从现在起假设我们的大部分工作都将通过远程 shell 会话进行，除非另有说明。\n\n如果你想使用命令行启动树莓派远程 shell——例如从另一台 Linux\
  \ 系统——请从你的终端窗口使用以下命令：\n\n```\n# ssh pi@192.168.0.125\n```\n\n然后你将被提示输入 Pi 的密码并进入\
  \ shell 会话。\n\n![](img/631e8b200cce187082ee46b0eb1681b3_303_0.png)\n\n从 Debian 桌面终端窗口启动的\
  \ Pi shell 会话\n\n## 保持最新\n\n你应该养成定期更新操作系统的习惯；即使你安装了最新的镜像，也很可能有更新的软件包可用。要更新你的操作系统，输入以下命令：\n\
  \n```\n$ sudo apt-get update\n```\n\n之后，输入以下命令：\n\n```\n$ sudo apt-get dist-upgrade\n\
  ```\n\n这可能需要一段时间，具体取决于需要更新的数量。\n\n## 获取正确的时间\n\n树莓派没有板载实时时钟硬件。这是为保持板成本低而故意省略的。相反，Pi\
  \ 在启动时通过网络时间协议（NTP）从互联网上的时间服务器获取时间。但是，如果在启动时没有互联网连接，则时间会错误。\n\n> 在我们的安全系统中，保持时间准确非常重要，以便日志文件和图像上的时间戳正确。\n\
  \n## fake-hwclock\n\nfake-hwclock 软件包包含在最新的 Raspbian 发行版中，但在过去的其他版本中没有。如果需要安装它，请使用以下命令：\n\
  \n```bash\n$ sudo apt-get install fake-hwclock\n```\n\nfake-hwclock 用于在没有网络连接时让树莓派尽量保持时间。它会定期保存当前时间并在启动时恢复。明显的问题是，如果\
  \ Pi 已关闭几天，则时间将被设置为上次开机时的 fake-hwclock 时间。\n\n如果你想查看它上次记录的时间，输入以下命令：\n\n```bash\n\
  $ cat /etc/fake-hwclock.data\n```\n\n## ntp\n\n**网络时间协议（NTP）** 在有互联网连接时使用，它可以从互联网上的一个或多个时间服务器请求最新最准确的时间。\n\
  \n默认情况下，**ntp 服务** 在最新的 Raspbian 发行版上是启用的，但在没有互联网连接时，它最初会在启动时从 fake-hwclock 获取时间。可能有时候有必要强制\
  \ ntp 服务从互联网更新——例如，如果在启动后一段时间互联网连接恢复。\n\n要强制 ntp 服务从互联网更新，请使用以下命令：\n\n```bash\n\
  $ service ntp stop\n$ ntpd -gq\n$ service ntp start\n```\n\n## 说到安全……\n\n如果系统本身不安全，建立安全系统就毫无意义。所以，现在我们将更改\
  \ pi 用户的默认密码。\n\n从提示符输入以下命令：\n\n```text\n$ sudo passwd pi\npi@raspberrypi ~ $ sudo\
  \ passwd pi\nEnter new UNIX password:\nRetype new UNIX password:\npasswd: password\
  \ updated successfully\n```\n\n## 这个 sudo 到底是什么？\n\n你会注意到我们在终端窗口中运行的每个命令前都加上了 `sudo`。这是为了让命令以\
  \ **root 用户**——最高安全级别——运行。执行许多操作需要这种提升的权限。`sudo` 实际上意思是 *super do.*\n\n如果你不想每次都输入\
  \ `sudo`，那么你可以通过输入以下命令切换到超级用户：\n\n```\n$ sudo su\n```\n\n你会看到提示符从 $ 变为 #，这表示你现在以\
  \ root 用户运行。\n\n所以，这可能也是更改 root 用户密码的好时机！要做到这一点，输入以下内容：\n\n```\n# passwd\nroot@raspberrypi:/home/pi#\
  \ passwd\nEnter new UNIX password:\nRetype new UNIX password:\npasswd: password\
  \ updated successfully\nroot@raspberrypi:/home/pi#\n```\n\n## 通过 Wi-Fi 连接\n\n你也可以通过插入\
  \ USB  dongle 将树莓派连接到网络使用 Wi-Fi。使其工作需要额外的配置步骤，这超出了本章的范围，但有许多资源涵盖此主题。\n\n> 你可以在 Rick\
  \ Golden 所著的 **Raspberry Pi Networking Cookbook** 中找到使用 Wi-Fi 连接树莓派的配方，由 Packt Publishing\
  \ 出版（https://www.packtpub.com/hardware-and-creative/raspberry-pi-networking-cookbook）。\n\
  \n\n\n\n\n# 总结\n\n在本章中，我们将 Raspberry Pi 从包装盒中取出，并将其准备好作为家庭安防系统的核心设备。在此过程中，我们安装并设置了操作系统，将\
  \ Pi 连接到网络，并对其进行远程访问。我们还对 Pi 进行了安全设置，并确保它能够保持正确的时间。\n\n在下一章中，我们将探索 GPIO 端口及其提供的各种接口。我们会了解如何使用\
  \ GPIO 端口将各种设备连接到 Raspberry Pi，包括开关和传感器，同时开始构建我们的家庭安防系统。\n"
- "## 2\n使用 GPIO 将设备连接到 Pi\n\nRaspberry Pi 提供了许多连接设备的方式，例如将设备插入 USB 端口、将设备连接到板载摄像头和显示器端口，以及将设备连接到组成\
  \ GPIO 连接器的各种接口。作为家庭安防项目的一部分，我们将主要关注如何将设备连接到 GPIO 连接器。\n\n在本章中，我们将介绍以下主题：\n\n- 检查\
  \ GPIO 连接器以及各个引脚的功能\n- 了解后续章节中将使用的 I2C 和 SPI 总线\n- 安全地将 LED 和开关连接到数据引脚，并使用简单脚本访问这些数据引脚\n\
  - 了解 USB 端口及其限制\n\n### 前提条件\n\n除了 Raspberry Pi 之外，你还需要以下部件来完成本章中的项目：\n\n- 一个面包板\n\
  - 一个 LED\n- 一个 220 欧姆电阻（红、红、黑）\n- 一个 10K 欧姆电阻（棕、黑、橙）\n- 一个按钮或拨动开关\n- 一根连接线：\n\n\
  ![](img/631e8b200cce187082ee46b0eb1681b3_308_0.png)\n\n### 认识 GPIO\n\nGPIO 连接器是\
  \ Raspberry Pi 板边缘的一大组引脚。在较早的型号中，该连接器由 26 个引脚组成。但从 Model B+ 开始，一直配备 40 个引脚，尽管前 26\
  \ 个引脚与之前的型号完全相同，而我们将使用的正是这 26 个引脚。其余引脚无需担心。\n\nGPIO 连接器主要提供以下功能：\n\n- 电源\n- 数字 I/O\
  \ 引脚\n- I2C 总线\n- SPI 总线\n- UART 串行总线\n\nGPIO 上的某些引脚具有多种用途，具体取决于它们的编程方式。下图是 GPIO\
  \ 所有引脚的参考指南。黄色标签上的 GPIO 编号直接对应 Broadcom 芯片上的编号，也是脚本中通常使用的编号。\n\n![](img/631e8b200cce187082ee46b0eb1681b3_309_0.png)\n\
  \n### 数字 I/O 引脚\n\nGPIO 提供 8 个可用的数字输入/输出引脚。这些引脚既可以用于打开和关闭设备（输出模式），也可以用于检测外部设备何时打开和关闭（输入模式）。每个引脚都可以独立配置为输入或输出模式，我在前面的图中将它们标记为\
  \ D0 至 D7。\n\n显然，如果我们使用这些引脚分别驱动或检测单个设备，那么家庭安防系统最多只能连接 8 个设备。在许多情况下，这可能不够，因此在下一章中，我们将学习如何使用\
  \ GPIO 将更多设备连接到 Raspberry Pi。\n\n### I2C 总线\n\n集成电路间总线（Inter-Integrated Circuit，I2C）是一种低速接口，可以通过两线接口连接多个设备和简单传感器，而无需单独的时钟线或设备选择线。通常，该总线的运行速度最高可达\
  \ 100kbit/s。下一章将介绍这一总线，帮助我们扩展数字 I/O 并连接更多设备。\n\n### SPI 总线\n\n串行外设接口（Serial Peripheral\
  \ Interface，SPI）总线是主设备与从设备之间的同步双向串行连接。它可用于访问更复杂的传感器或驱动显示器。\n\n主设备负责提供同步信号，每次传输都通过\
  \ SCLK（GPIO11/引脚 23）上的时钟脉冲进行同步。数据通过 MOSI（主出从入）和 MISO（主入从出）传输，分别使用引脚 19 和 21。\n\n\
  ### UART 串行总线\n\n通用异步收发器（Universal Asynchronous Receiver and Transmitter，UART）总线是一种通过串行数据连接与外部设备通信的方式，也是\
  \ Raspberry Pi 访问设备数据的一种常见方法，例如 GPS 模块通常就带有串行连接。让 Pi 设置为与通过 UART 连接的设备通信可能会有些繁琐，因为\
  \ UART 还与操作系统的串行控制台有关联。\n\n### USB 端口\n\n我们可能都很熟悉通用串行总线（Universal Serial Bus，USB）端口，因为我们会使用它们将各种设备连接到\
  \ PC，例如键盘、鼠标和硬盘。在 Raspberry Pi 上也是如此；我们可以连接键盘、鼠标和网卡适配器，以获得 Wi-Fi 和蓝牙连接能力。\n\n![](img/631e8b200cce187082ee46b0eb1681b3_311_0.png)\n\
  \n官方 Raspberry Pi USB Wi-Fi 适配器\n\n在较早的 Raspberry Pi 型号中，USB 端口能够提供的电流相当小，如果连接的设备消耗过多电流，就会引发各种问题。从\
  \ Model B+ 开始，这一情况得到了显著改善，现在已经可以连接 GSM/LTE 适配器而不会出现问题。\n\n不过，如果你想连接硬盘驱动器之类的设备，仍然存在一些限制；这些设备消耗的电流可能超过\
  \ Raspberry Pi USB 端口所能提供的电流。因此，连接此类设备时，建议使用带供电功能的 USB 集线器或 USB 电源注入器。\n\n### 电源连接\n\
  \nGPIO 连接器还可以访问板载电源。+5V 连接（引脚 2 和 4）本质上是外部电源通过 micro-USB 电源端口输入的 +5V 电压。如果需要，可以使用它为小型外部电路供电，但如果需要较大的电流，建议使用额外的外部\
  \ +5V 电源。\n\n+3.3V 电源（引脚 1 和 17）来自板载 3.3V 稳压器，可提供最高 50mA 的小电流。如果外部电路需要消耗超过 50mA\
  \ 的电流，就应使用外部电源。本书后面会介绍如何制作一个外部电源。\n\n> Raspberry Pi 上的 I/O 引脚工作在 3.3V 电平。将高于此电压的电压连接到这些引脚，可能会对\
  \ Pi 造成不可逆的损坏。如果你按照本书中的说明操作，一切都应该没有问题；但如果随意将高功率设备连接到 Pi，就会损坏它！\n\n### 熟悉 GPIO\n\n\
  在开始将大量设备连接到 Pi 开发板之前，最好先通过几个简单项目熟悉 GPIO。这些项目将帮助我们了解如何使用 shell 脚本与数字 I/O 引脚进行交互。\n\
  \n### 让灯亮起来\n\n这个简单的小项目展示了如何将 GPIO 输出连接到 LED，并使用 shell 命令打开和关闭 LED。\n\n下图展示了如何使用面包板连接电路：\n\
  \n![](img/631e8b200cce187082ee46b0eb1681b3_312_0.png)\n\n> 你刚才看到的漂亮电路图是使用 fritzing\
  \ 提供的免费软件工具制作的。fritzing 是一个开源硬件项目，旨在让任何人都能将电子产品作为创作材料。请从 `fritzing.org` 下载该软件。\n\
  \nLED 的阳极（正极）连接到 D0 数字 I/O（连接器的引脚 11，即 GPIO17）。当该引脚打开时，它会向 LED 提供 3.3V 电源。\n\nLED\
  \ 的阴极（负极）通过一个 220R 电阻连接到接地引脚。该电阻用于限制 LED 两端的电压以及流经 LED 的电流，否则 LED 会烧坏，因为 LED 两端最多只能施加约\
  \ 2V 的电压。在 3.3V 电源下，LED 消耗的电流约为 10mA，使用 220R 电阻可以很好地保护 LED 和 GPIO。\n\n这是该电路的电路图：\n\
  \n![](img/631e8b200cce187082ee46b0eb1681b3_313_0.png)\n\n### 计算 LED 电阻值……\n\n虽然本书并不是电子学理论课程，但我觉得介绍如何使用欧姆定律计算\
  \ LED 的电阻值会很有帮助，因为稍后我们还会再次涉及这一内容。\n\n正如我提到的，典型 LED 两端的压降约为 2V，不过具体数值会因颜色和类型而有所不同。这称为器件的正向电压，记作\
  \ VLED。\n\nLED 所需的电流约为 10mA，同样取决于其规格。我们将这个流经 LED 的电流记作 ILED。\n\n基本上，电阻两端的电压等于电源电压减去\
  \ LED 两端的压降（例如 2V）。因此，如果我们有一个 12V 电源（VS），电阻两端的电压就是 10V（VS - VLED）。\n\n根据欧姆定律，电阻\
  \ R 等于其两端的电压除以流经它的电流：R = V / I。由于我们要求有 10mA 的电流流过电阻，而电阻两端的电压为 10V，因此所需电阻值为 10V 除以\
  \ 0.01A，即 1,000 欧姆或 1K。\n\n总结如下：R = (VS-VLED) / ILED。\n\n\n\n\n## 使用 GPIO 将外设连接到你的树莓派\n\
  \n现在，要让 LED 亮起和熄灭：GPIO 引脚实际上在 Linux 文件系统中被映射为设备，因此使用 shell 命令很容易，尽管市面上也有很多库，例如允许你用\
  \ Python 控制 GPIO 的库。不过，为了不必学习一门新语言，我们将全部使用 shell 命令来完成。\n\n我们连接的 D0 引脚，对于树莓派来说实际上就是\
  \ GPIO17（参考前面的示意图）。我们要做的第一件事是为这个 GPIO 引脚创建文件访问。我们使用以下命令：\n\n```bash\nsudo echo 17\
  \ > /sys/class/gpio/export\n```\n\n然后，我们必须将引脚的方向设置为输出（out）：\n\n```bash\nsudo echo\
  \ out > /sys/class/gpio/gpio17/direction\n```\n\n接下来，我们可以打开引脚来点亮 LED：\n\n```bash\n\
  sudo echo 1 > /sys/class/gpio/gpio17/value\n```\n\n要熄灭 LED，我们使用以下命令：\n\n```bash\n\
  sudo echo 0 > /sys/class/gpio/gpio17/value\n```\n\n当我们用完某个 GPIO 端口后，可以移除其文件访问：\n\
  \n```bash\nsudo echo 17 > /sys/class/gpio/unexport\n```\n\n### 闪烁起来…\n\n我们可以将这些命令组合到一个\
  \ Bash 脚本中，制作一个闪烁的 LED。要创建这个闪烁脚本，请在 `nano` 或其他文本编辑器中新建一个文本文件。或者，像我通常做的那样（别忘了我很懒），在笔记本电脑上创建文本文件，然后使用\
  \ **WinSCP** 将其复制到远程树莓派上（不过，如果你想避免一些心痛，请阅读下面框中的注释）。\n\n以下是 led-flash.sh 的代码：\n\n\
  ```bash\n#!/bin/bash\nsudo echo 17 > /sys/class/gpio/export\nsudo echo out > /sys/class/gpio/gpio17/direction\n\
  # loop forever\nwhile true\ndo\n    sudo echo 1 > /sys/class/gpio/gpio17/value\n\
  \    sleep 0.5\n    sudo echo 0 > /sys/class/gpio/gpio17/value\n    sleep 0.5\n\
  done\n```\n\n![](img/631e8b200cce187082ee46b0eb1681b3_315_0.png)\n\n> 如果你使用 Windows\
  \ 创建文件，请记得将文件的行尾格式保存为 Linux 格式（单个 0x0a 或换行符），而不是 Windows 格式（0x0a + 0x0d 或换行符 + 回车符），否则你可能会发现\
  \ Bash 脚本在树莓派上无法正常运行。Windows 上的文本编辑器，例如优秀的 Notepad++，会为你转换脚本的行尾格式。\n\n通过调用 led-flash.sh（假设你就是这样命名的）来运行脚本。如果你和脚本在同一目录下，可以输入以下命令：\n\
  \n```bash\n$ sudo bash ./led-flash.sh\n```\n\n由于这是一个无限循环，LED 以半秒为间隔闪烁，你需要使用 CTRL\
  \ + C 来跳出循环并停止脚本。\n\n别忘了使用以下命令将 GPIO 引脚从文件访问中移除：\n\n```bash\n$ sudo echo 17 > /sys/class/gpio/unexport\n\
  ```\n\n否则，如果你重新运行脚本，因为第一行试图再次为 GPIO17 创建文件访问，你会看到错误：echo: write error: Device or\
  \ resource busy。\n\n### 添加开关\n\n在这个项目中，我们将了解如何将开关连接到 GPIO 输入，并编写一个 shell 脚本来读取开关状态——即它是打开还是关闭。\n\
  \n将开关连接到树莓派的 GPIO27 引脚，如下图所示：\n\n![](img/631e8b200cce187082ee46b0eb1681b3_316_0.png)\n\
  \n### 上拉与稳定\n\n关于 GPIO 输入，有一件非常重要的事情需要认识到：它们处于所谓的“悬空状态”。这意味着，就操作系统而言，除非给它一个已知电压，否则它不知道其参考状态是什么。\n\
  \n这时我们的电阻就派上了用场——它将 GPIO 引脚上拉到已知的 3.3V 电压，使其默认状态为高电平（HIGH，或二进制 1）。\n\n当按下按钮开关时，这会使\
  \ GPIO 引脚变为 0V，即低电平状态（LOW，或二进制 0）。\n\n以下是我们 GPIO 开关的电路图：\n\n![](img/631e8b200cce187082ee46b0eb1681b3_317_0.png)\n\
  \n### 检测脚本\n\n现在我们已经将开关连接到树莓派，我们需要编写一个小脚本来检测开关何时被按下。\n\n它与前面显示的 LED 脚本类似，但这次我们将\
  \ GPIO 引脚设置为输入并读取其逻辑电平。\n\n在这个项目中，我们将开关连接到 D2，即 GPIO27（同样，请参考前面的 GPIO 引脚分布图）。和之前一样，我们需要通过输入以下命令为该引脚创建文件访问：\n\
  \n```bash\n$ sudo echo 27 > /sys/class/gpio/export\n```\n\n现在，将其方向设置为输入（in）：\n\n\
  ```bash\n$ sudo echo in > /sys/class/gpio/gpio27/direction\n```\n\n我们现在可以读取它的值了，使用以下命令即可：\n\
  \n```bash\n$ sudo cat /sys/class/gpio/gpio27/value\n```\n\n你会注意到它返回了 1，即高电平状态。这是因为我们之前提到的上拉电阻。这意味着当开关未被按下时，其默认状态为高电平。\n\
  \n当开关被按下时，该值应读为 0 或低电平。如果你有超过两只手，你可以尝试按下按钮并重新运行命令。或者，我们也可以创建一个脚本轮询开关状态。\n\npoll-switch.sh\
  \ 的代码如下：\n\n```bash\n#!/bin/bash\nsudo echo 27 > /sys/class/gpio/export\nsudo echo\
  \ in > /sys/class/gpio/gpio27/direction\n\n# loop forever\nwhile true\ndo\n    #\
  \ read the switch state\n    SWITCH=$(sudo cat /sys/class/gpio/gpio27/value)\n\n\
  \    if [ $SWITCH == 1 ]; then\n        #switch not pushed so wait for a second\n\
  \        sleep 1\n    else\n        #switch was pushed\n        echo \"You've pushed\
  \ my button\"\n    fi\ndone\n```\n\n当你运行脚本然后按下按钮时，你应该会看到“You've pushed my button”在控制台上持续滚动，直到你停止按压。\n\
  \n别忘了，一旦我们用完 GPIO 端口，我们可以移除其文件访问：\n\n```bash\n$ sudo echo 27 > /sys/class/gpio/unexport\n\
  ```\n\n我们现在已经了解了如何轻松读取开关输入，同样的电路和脚本也可用于读取其他传感器，例如门磁开关、干簧管开关，或任何其他有开和关状态的设备。\n\n\
  ### 世界上最精致的电灯开关\n\n通过结合前面两个小项目，我们现在可以创建一个系统，在按下按钮开关时做一些有用的事情——例如，打开我们同时连接着的 LED。诚然，我们可以直接将\
  \ LED 连接到开关和电池，但那不仅无聊，而且会违背我们正在努力实现的目标，即通过编程方式感知和控制事物。\n\n这是我们精致电灯开关的面包板布局：\n\n\
  ![](img/631e8b200cce187082ee46b0eb1681b3_319_0.png)\n\n这是电路图：\n\n![](img/631e8b200cce187082ee46b0eb1681b3_320_0.png)\n\
  \n### 点亮脚本\n\n接下来演示我们精致电灯开关的完整 Bash 脚本。它将无限循环，检测开关 GPIO 引脚的状态，并在开关被按下时打开 LED GPIO\
  \ 引脚。\n\nlight-switch.sh 的代码如下：\n\n```bash\n#!/bin/bash\n\n#set up the LED GPIO\
  \ pin\nsudo echo 17 > /sys/class/gpio/export\nsudo echo out > /sys/class/gpio/gpio17/direction\n\
  \n#set up the switch GPIO pin\nsudo echo 27 > /sys/class/gpio/export\nsudo echo\
  \ in > /sys/class/gpio/gpio27/direction\n\n# loop forever\nwhile true\ndo\n  # read\
  \ the switch state\n  SWITCH=$(sudo cat /sys/class/gpio/gpio27/value)\n\n  #0=Pushed\
  \ 1=Not Pushed\n  if [ $SWITCH = \"1\" ]\n  then\n    #switch not pushed so turn\
  \ off LED pin\n    sudo echo 0 > /sys/class/gpio/gpio17/value\n  else\n    #switch\
  \ was pushed so turn on LED pin\n    sudo echo 1 > /sys/class/gpio/gpio17/value\n\
  \  fi\n  #short delay\n  sleep 0.5\ndone\n```\n\n就这样——我们有了一个可以检测输入状态并做出响应的脚本；在本例中，它将点亮\
  \ LED。我们现在正在为组建家庭安防系统奠定基础。\n\n> 记住，不要将任何设备连接到树莓派上以取代 LED，例如蜂鸣器或其他消耗大量电流的设备。这很可能会永久性地损坏你的树莓派。我们将在本书后面介绍控制更高功率设备的方法。\n\
  \n### 小结\n\n在本章中，我们通过查看 GPIO 上可用的各种接口，介绍了将树莓派连接到外部世界的多种方式。我们了解了如何将外设连接到树莓派 GPIO\
  \ 连接器上的数字引脚，并使用简单的 Bash 脚本进行控制和读取。具体来说，我们已经安全且正确地将一个开关连接到数字输入引脚，这将为我们家庭安防检测电路奠定基础。\n\
  \n在下一章中，我们将探讨如何扩展可连接到树莓派的外设数量，克服 GPIO 上只有 8 个数字引脚可用的限制，方法是通过利用 GPIO 上的其他接口并构建我们自己的输入/输出扩展板。\n\
  \n\n"
- '## 3 扩展树莓派以连接更多设备


  现在，我们要探讨如何扩展树莓派可连接的设备数量，摆脱仅有8个数字引脚的局限。为此，我们将构建自己的扩展板，从而在理论上获得无限数量的数字输入和输出。


  我们还将通过构建自己的+3.3V电源来克服可用+3.3V电源的限制，该电源从树莓派的+5V电源中分接。


  本章将涵盖以下内容：


  - 详细了解I²C总线

  - 学习串行到并行以及并行到串行的转换

  - 构建+3.3V电源

  - 构建基于I²C的端口扩展器，以提供更多输入和输出

  - 了解其他现成的扩展板


  ### 前提条件


  除了你的树莓派之外，本章项目还需要以下部件：


  - 一块铜条板（或Veroboard®）

  - 一个LD1117V33电压稳压器

  - 2个100nF、16V陶瓷电容

  - 1个10µF、16V电解电容

  - 1个MCP23017 16位端口扩展器IC

  - 4个10K欧姆电阻

  - 一根连接导线


  ### I²C总线


  在上一章中，我们简要提到了I²C总线（即Inter-Integrated Circuit总线，集成电路间总线），这是一种仅用两根导线即可连接多个设备的方式。I²C由飞利浦公司于20世纪80年代初发明，旨在通过通用协议将计算机外设连接起来。你可以将I²C视为一种早期形式的USB。


  与以太网（通常高达1Gbit/s）或USB（最高可达480Mbit/s）等更快接口相比，I²C通常以相对较低的速度运行，最高可达100kbit/s。然而，这对于连接基本传感器、显示设备或其他外设（如实时时钟）来说已经足够快了——事实上，某些设备支持更快版本的协议。


  ### 仅需两根导线


  I²C是一种双向串行通信协议，通过两根导线工作：


  - 串行数据线（SDA）负责在主设备和其他设备之间传输数据。回顾第2章“使用GPIO将设备连接到你的树莓派”中的GPIO参考，这是GPIO连接器的第3脚。

  - 串行时钟线（SCL）负责总线上所有数据的时序和流控制。这是GPIO连接器的第5脚。


  你还会记得，我们在上一章中谈到过上拉电阻，它确保GPIO数字输入被拉至已知状态。I²C总线上的两条线也需要这样做，默认情况下，这些线应通过电阻上拉至高电平。不过，在树莓派上，这已经为我们做好了，因此我们无需为此担心。


  ### 你的地址是什么？


  那么，如果我们仅用两根导线就能与多个设备通信，树莓派如何知道要与哪个设备通话呢？这正是I²C协议发挥作用的地方。连接到总线的每个设备都有自己唯一的ID或地址，由7位或10位组成。有些设备允许你设置地址以确保其在系统内唯一，但其他设备的地址则由制造商硬编码。


  这两种寻址方式（7位和10位）可以互操作，而且同一总线上可以同时存在使用任一种方式的设备，因为树莓派本身支持这两种方式。因此，与GPIO上数量有限的数字引脚相比，使用10位寻址方案，你可以看到我们能够通过I²C总线将大量设备连接到树莓派！


  ### 存在一个并行世界


  数据通常以串行模式或并行模式传输，具体取决于所需的数据速度、电缆距离和功能等因素。系统之间的大多数数据通信通过几根导线以串行模式传输，例如前面提到的I²C总线，但也包括以太网、RS232/422和USB等。


  在计算机系统内部，数据以并行模式传输，所使用的总线宽度与芯片之间通信的数字系统的字长相匹配。在并行模式下，数据字的所有位同时通过总线中各自的数据线传输，而不是沿单条线按顺序逐位传输。


  我们一直在讨论的数字I/O引脚（包括树莓派GPIO连接器上的引脚）通常组合在一起形成并行总线。在我们的系统中，我们将使用8位宽的并行总线（即数字I/O引脚组）。也就是说，这条总线有8根导线，可以使用8位二进制值（即我们的字长）进行设置或读取。


  ![](img/631e8b200cce187082ee46b0eb1681b3_325_0.png)


  8位数据总线的表示图


  因此，在上图中，我们的总线有8根数字I/O导线。如果我们想让位（或导线）0、1和4变为**高电平**或**开启**，其余为低电平或关闭，那么我们需要对总线进行寻址并设置如下值：


  - 二进制为 `00010011`

  - 十六进制为 `0x13`

  - 十进制为19（表示为 `16+2+1`）


  换句话说，要打开数据线0、1和4，我们需要将字节值19发送到总线的地址。


  ### 串行到并行转换


  那么，既然我们知道要向总线发送什么数字来开启或关闭某些数字输出，或读取某些数字输入，我们如何使用串行接口I²C总线来实现这一点呢？


  幸运的是，有许多**集成电路（ICs）**可以让我们简单轻松地实现这一点。这些IC称为**移位寄存器**，执行**串行到并行转换**，即从串行I²C总线获取数据，并通过设置每个并行总线输出来将传入的位转换为并行表示。


  当读取并行总线数据线作为输入时，会发生相反的过程，将位转换为I²C总线上的串行形式；这称为**并行到串行转换**。


  这只是一个非常简化的概述，有很多资源可以解释这些操作；我们将在本章后面的部分看到实际应用，但首先……


  ### 给我电源


  你还会记得，在上一章中，大多数与GPIO相关的东西都在+3.3V电平下工作，而不是通常与数字电路相关的+5V电平。我们基于I²C的移位寄存器也是如此——它们也需要在+3.3V电平下工作，才能与树莓派兼容。


  不过，你还会记得，树莓派直接提供的+3.3V电流并不多——实际上只有50mA。这远不足以满足我们的接口需求。因此，在进一步操作之前，我们将构建自己的+3.3V电源，以满足我们系统的需求。


  对于我们的电源，我们将使用一个基本的3.3V **电压稳压器**（型号**LD1117V33**），它将从树莓派获取更充足的+5V电源，并将其调节为平滑稳定的+3.3V电源。我们应该能够从这个电源中获取几百毫安的电流——足以满足安全系统上的I/O电路。


  我们的电源所需部件如下：


  - 一个LD1117V33电压稳压器

  - 一个100nF、16V陶瓷电容

  - 一个10µF、16V电解电容


  这是我们的+3.3V电源的电路图：


  ![](img/631e8b200cce187082ee46b0eb1681b3_327_0.png)


  与我们的所有元件一样，LD1117V33稳压器在很多电子元件供应商处都很容易买到。


  我们的电源可以轻松地搭建在一小块铜条板上，如下所示：


  ![](img/631e8b200cce187082ee46b0eb1681b3_328_0.png)


  > 上述布局是从顶部俯视铜条板。也就是说，铜条位于板的底面，元件从光秃的顶面插入，并焊接到底部的铜条上。在这种布局中，无需切割铜条板上的任何铜条。


  ### 构建I²C扩展器


  好了，既然我们已经确定了如何获得更多数字I/O引脚，并为其构建了电源，现在我们可以构建扩展端口了。


  为此，我们将使用一款专门为此设计的芯片：MCP23017，由Microchip制造，在电子元件供应商处广泛有售。




  MCP23017 是一款集成电路，可直接连接到 I2C 总线（我们之前提到的 SDA 和 SCL 引脚），并为我们提供 16 个双向输入和输出引脚。如果需要，我们可以将多达
  8 个这样的芯片连接到同一总线上，从而获得多达 128 个输入和输出（是的，我知道我之前说过“几乎无限”，但我稍后会解释）。


  ![](img/631e8b200cce187082ee46b0eb1681b3_329_0.png)


  MCP23017 集成电路引脚图


  > MCP23017 的完整数据手册可在 Microchip 的网站上获取，网址为 www.microchip.com/MCP23017。


  ## I2C 端口扩展器电路


  构建端口扩展器所需的基本部件如下：


  - 1 x MCP23017 16 位端口扩展器 IC

  - 4 x 10K 欧姆电阻

  - 1 x 100nF、16V 陶瓷电容

  - 一块铜条板（或 Veroboard®）

  - 一根连接线


  以下是我们 I2C 端口扩展器电路的电路图。看起来复杂，但实际上大多数线路都是用于与外部世界连接的：


  ![](img/631e8b200cce187082ee46b0eb1681b3_330_0.png)


  ## 让我们仔细看看电路


  在右侧，连接器 CN1 是我们的 Raspberry Pi GPIO 连接器——请注意，我们只使用了其中的四个引脚：


  - +5V 输出（引脚 2）

  - I2C SDA（引脚 3）

  - I2C SCL（引脚 5）

  - 0V/GND（引脚 6）


  你将会看到我们之前讨论过的老朋友——+3.3V 稳压器（U1、C1 和 C2）。它从 Raspberry Pi 获取 +5V 输出，并提供 +3.3V 供电路其余部分使用。


  主要组件是 U2——我们的 MCP23017 端口扩展器芯片。芯片的引脚 9 和引脚 10 分别连接到 +3.3V 电源和 GND，C3 用作靠近芯片的去耦电容，以减少电源上的噪声。


  MCP23017 可以用作 16 位扩展器，或者用作 2 个 8 位扩展器。在我们的电路中，我们将设备分成两部分，得到 2 个 8 位总线：I/O 总线 A 和
  I/O 总线 B。总线上的每个引脚都可以编程为输入或输出。


  ## 将设备连接到输入/输出引脚


  我们总线上的输入和输出引脚通常不能直接连接到设备——它们提供的电流有限，需要正确接口到蜂鸣器、灯光等设备；还必须保护它们免受破坏性输入信号的影响。在下一章中，我们将学习如何安全地连接到我们的
  I/O 端口。


  来自 Raspberry Pi 的 I2C SDA/SCL 线连接到芯片的引脚 12 和 13。你会看到还有额外的 I2C 输出（PL1 至 PL3），以说明我们可以将其他设备连接到
  I2C 总线，例如另一个 MCP23017 芯片，以便再获得 16 个数字 I/O。


  电阻 R1 用于将 RESET 引脚（18）保持为高电平。通过将该引脚拉低，你可以重置芯片。


  电阻 R2 至 R4 用于将地址引脚 A0 至 A2（引脚 15-17）保持为低电平。


  ## 高电平和低电平


  当我们相对于数字引脚或输入使用术语“高”和“低”时，我们仅仅是在描述该引脚的逻辑电平分别是二进制 1 还是 0。数字引脚不喜欢处于悬空状态——即既不高也不低——因为这可能导致不可预测的操作。因此，我们始终确保它们保持在确定的逻辑电平。通常，将引脚连接到
  0V（或地）可确保其保持逻辑电平 0，连接到正电源（例如 3.3V）可确保其保持逻辑电平 1。


  还记得我之前提到过，你可以将大量设备连接到 I2C 总线，从而获得几乎无限的 I/O 引脚吗？嗯，实际上在很多情况下，这并不完全准确。这是因为 I2C 设备的寻址方案，该方案使得所有设备在连接到同一对导线（其唯一地址）时都能被识别。每个设备的地址由制造商预先商定，以确保每个人的设备都能在同一总线上和谐工作而不会产生冲突。因此，地址是预先编程到设备中的。


  MCP23017 有自己唯一的基地址，但可以通过将地址引脚 A0-A2 拉高或拉低来修改；因此，实际上，它可以配置为 8 个地址之一。这就是为什么同一 I2C
  总线上最多只能有 8 个这样的芯片，从而在理论上提供最多 128 个 I/O 引脚（即 16 个 I/O × 8 个芯片）。


  ## 构建你的扩展板


  这个电路很容易构建在一块小条板上。下图显示了一个布局示例，看起来比电路图简单一些。在下一章中，我们将学习如何连接我们的板子并对其进行编程，以便我们检查它是否工作。


  ![](img/631e8b200cce187082ee46b0eb1681b3_332_0.png)


  ![](img/631e8b200cce187082ee46b0eb1681b3_333_0.png)


  > 使用条板时，请确保切断 MCP23017 两排引脚之间的铜条，以免它们短路在一起。你可以从许多电子供应商那里购买轨道切割器，这会让这项任务变得容易。同样，在上述布局中，铜条位于板的下方，而元件位于无铜箔的一面。


  你可能还想将 +3.3V 电源电路添加到同一块条板上，以便将所有组件保持在一起。


  ![](img/631e8b200cce187082ee46b0eb1681b3_333_1.png)


  > 在下一章中，我们将学习如何对该设备进行编程，以便我们可以在家庭安全系统中使用它。


  ## 使用现成的扩展板


  虽然自己动手制作东西更有成就感，但如果你对自己的烙铁操作还不够自信，或者只是没有时间，你可能想考虑购买一些现成的扩展板用于你的家庭安全系统。


  下面是一些你可以获得的现成扩展板；它们应该可以作为我们家庭安全系统的一部分工作，只需对我们的脚本稍作修改，以支持硬件所需的库。


  ## Hobbytronics MCP23017 扩展器端口套件


  这款套件与我们本章前一节中的电路几乎相同。该套件包含一个 MCP23017、一个 PCB 和各种连接器。这些板设计为可菊花链连接在一起，这样你就可以拥有多个扩展器，以获得更多输入/输出端口。请注意，该套件不是预先组装好的，需要焊接，但我认为我还是应该把它包含进来，因为这是我在制作原型时用来构建此类系统的板子。你可以直接从
  Hobbytronics 获取，网址为 `http://bit.ly/mcp23017`。


  同样，本书中针对我们系统的代码需要修改才能与此板配合使用。


  Gertboard 可从 Farnell element14 获取，网址为 `http://bit.ly/2250034`。


  ![](img/631e8b200cce187082ee46b0eb1681b3_335_0.png)


  组装好的 Gertboard


  ## 总结


  我们现在已经详细了解了 I2C 总线，并学习了如何使用该接口构建扩展端口，以便我们可以将更多设备连接到 Raspberry Pi，而不是局限于 Raspberry
  Pi 的 GPIO 端口仅提供的 8 个数字 I/O 引脚。除此之外，我们还探索了其他现成的板，可用于将很多东西连接到我们的 Raspberry Pi。我们还构建了一个电源，为我们提供比直接从
  Raspberry Pi 获得的更多 +3.3V 电源。


  在下一章中，我们将开始实际将设备连接到我们的家庭安全系统，例如磁性传感器和其他类型的接触设备，并学习如何使用 Bash 脚本对我们的 I2C 扩展端口进行编程，以便我们可以读取传感器的状态并打开警告
  LED。我们还将开始为系统开发控制脚本，这些脚本将允许我们布防和撤防系统，并添加延迟定时器。

