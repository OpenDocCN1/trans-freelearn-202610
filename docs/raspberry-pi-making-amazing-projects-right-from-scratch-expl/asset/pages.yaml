- pgno: 115
  md: "This time, we will use the BCM convention when specifying GPIO pins. We will\
    \ connect the button to the GPIO17 pin. Then, we will modify the code so that\
    \ it looks like the following:\n\n```\nimport picamera\nfrom RPi import GPIO\n\
    \nGPIO.setmode(GPIO.BCM)\nGPIO.setup(17, GPIO.IN, GPIO.PUD_UP)\n\nwith picamera.PiCamera()\
    \ as camera:\n    camera.start_preview()\n    GPIO.wait_for_edge(17, GPIO.FALLING)\n\
    \    camera.capture('/home/pi/image.jpg')\n    camera.stop_preview()\n```\n\n\
    Save the preceding program as prog2.py and run it with the following command:\n\
    \n```\npython3 prog2.py\n```\n\nWe will now see what each line of code does, except\
    \ those that we already saw in the previous program. To use the GPIO pins, we\
    \ have to import the RPi.GPIO library, as we did in the previous chapter. Then,\
    \ we set the GPIO addressing mode as BCM, which uses the Broadcom convention rather\
    \ than numbering the pins on the board. This means that we can address the GPIO\
    \ pin by its GPIO number rather than its board number. With the setup() method,\
    \ we configure the pin to be an input and set it so that it is pulled up by default.\n\
    \nThe function that actually does the magic is wait_for_edge(). It takes the pin\
    \ number as the first argument and GPIO_FALLING as the second. This means that\
    \ the function will be triggered only when the signal at pin 17 goes from high\
    \ to low or when it falls. So, it will be triggered when the button goes from\
    \ the pressed state to the unpressed state; that is, it will be triggered when\
    \ we leave the button rather than when we press the button. The next statements\
    \ capture and save the image and then exit the preview. If we want to take a selfie,\
    \ then we can add a delay after the wait_for_edge() function in order to enable\
    \ us to get into position. Also, don't forget to add the two commands to correct\
    \ an upside down picture if such a need arises.\n\nNow that we have successfully\
    \ taken individual photos without a camera, it's time to try taking a series of\
    \ still images and combining them in order to make a stop-motion animation. Just\
    \ so that your home folder does not just get messy, we can create a new folder\
    \ and enter it with the following commands:\n\n```\nmkdir stopmotion\ncd stopmotion\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 116
  md: "Modify the given code and add a loop to take a picture every time the button\
    \ is pressed. The new code looks like the following:\n\n```\n```python\nimport\
    \ picamera\nfrom RPi import GPIO\n\nGPIO.setmode(GPIO.BCM)\nGPIO.setup(17, GPIO.IN,\
    \ GPIO.PUD_UP)\n\nwith picamera.PiCamera() as camera:\n    camera.start_preview()\n\
    \    frame = 1\n    while True:\n        GPIO.wait_for_edge(17, GPIO.FALLING)\n\
    \        camera.capture('/home/pi/stopmotion/frame%03d.jpg' % frame)\n       \
    \ frame += 1\n    camera.stop_preview()\n```\n```\n\nWhat we have done is create\
    \ an infinite while loop that keeps taking photographs as long as the button is\
    \ pressed. The frame variable keeps track of the current frame and saves the corresponding\
    \ image in the folder.\n\n> > But be careful about the space limitations of your\
    \ SD card. If we hold down the button for long, the Pi could run out of space\
    \ and crash once it run out of space, causing us to lose all the data and potentially\
    \ corrupting the SD card.\n\nNow, save the program as prog3.py and run it with\
    \ the following command:\n\n```\n```bash\npython3 prog3.py\n```\n```\n\nRun the\
    \ program and collect as many images as required for our stop-motion project.\
    \ Press *Ctrl + C* to exit the program and open the File Manager to see your images.\n\
    \n# Rendering the video\n\nWe are now ready to render the video from the sequence\
    \ of images we just collected. We will begin rendering the video by entering the\
    \ terminal window. Navigate to the stopmotion folder with the following command:\n\
    \n```\n```bash\ncd /home/pi/stopmotion\n```\n```\n\nThen, execute the following\
    \ command to begin rendering the video:\n\n```\n```bash\navconv -r 10 -qscale\
    \ 2 -i frame%03d.jpg animation.mp4\n```\n```"
  merge: -1
  img_proc: true
