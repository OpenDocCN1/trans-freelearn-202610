- pgno: 289
  md: '# 1


    # Setting Up Your Raspberry Pi


    Before we can get into the realms of building our home security system, there''s
    a bit of preparation work needed to get our Raspberry Pi up and running. So, we''re
    going to go through the initial steps needed to get our Pi ready to be worked
    on.


    In this chapter, we will cover the following topics:


    +   - Exploring the different versions of the Raspberry Pi that are available

    +   - Choosing the right Raspberry Pi version for your system

    +   - Preparing the SD Card with the Raspbian Operating System

    +   - Learning how to remotely access the Raspberry Pi over your home network

    +   - Updating our operating system with the latest packages

    +   - Exploring the time-keeping options on the Raspberry Pi

    +   - Setting the user and root passwords to secure our Raspberry Pi


    # Which flavor of Pi?


    Since the Raspberry Pi was released in 2012, there have been several versions
    of the mini-PC board released. I''ll go though each of the versions released with
    their respective features so that you can choose which one is suitable for your
    particular project.'
  merge: -1
  img_proc: true
- pgno: 290
  md: '# Setting Up Your Raspberry Pi


    The good news is that it doesn''t really matter which version you use in terms
    of power, as our home security system doesn''t necessarily need loads of processing
    power, depending on what you want your system to do, of course). You might have
    an older board kicking about that will work for you.


    The other piece of good news is that the GPIO interface pin layouts are the same
    across all the versions. The later versions have more pins, but the original 26
    pins still remain in the same place.


    ![](img/631e8b200cce187082ee46b0eb1681b3_290_0.png)


    The latest Raspberry Pi Version 2'
  merge: -1
  img_proc: true
- pgno: 291
  md: '# # Raspberry Pi Model A


    The baby of the family is the Model A; it was released as a lower-cost version
    of the Model B, shown in the following section. Its main differences from the
    Model B are that it features just 256Mb of memory and has no Ethernet port; so
    if you want to connect this board to a network, you are limited to using a USB
    Wi-Fi dongle.


    ![](img/631e8b200cce187082ee46b0eb1681b3_291_0.png)'
  merge: -1
  img_proc: true
- pgno: 292
  md: '# Raspberry Pi Model B


    This was the first version of Raspberry Pi to be released; an updated revision,
    which improved the power system and USB port protection, came later. It features
    512Mb of memory and has an Ethernet port for connecting to your network. This
    is probably the most common version used, and having the Ethernet port is incredibly
    useful, especially to get up and run quickly in order to set up and configure
    your Pi without the need for a keyboard and monitor.


    ![](img/631e8b200cce187082ee46b0eb1681b3_292_0.png)


    The Raspberry Pi Model B Layout


    # Raspberry Pi Model B+ and Model 2


    In 2014, the Raspberry Pi Foundation released a new version of the board that
    had some fundamental changes as compared to the previous version. The most fundamental
    changes were the board layout, form factor, and mounting points—much to the dismay
    of the many enclosure and accessory manufacturers out there.


    In fact, we were in the middle of prototyping an enclosure for a commercial product
    that we were developing based on the Raspberry Pi—fortunately we caught wind of
    the board change in the nick of time and were able to change our enclosure to
    support the upcoming model B+.'
  merge: -1
  img_proc: true
- pgno: 293
  md: 'The main electronic changes to this board are the addition of 2 more USB ports
    that can deliver more power to peripherals, an expanded GPIO interface, and the
    removal of the composite video port that is now consolidated into the audio jack.
    It also now uses a micro SD card with a better card slot.


    In February 2015, a more powerful Raspberry Pi was released: the Raspberry Pi
    Model 2. It''s similar to the Model B+ in terms of form-factor and interfaces,
    but is now reportedly 6-times faster than the Model B/B+ with its upgraded ARM
    processor and 1Gb of memory.


    At the same low cost of less than £30, it''s a fantastic little board and a great
    power-house for embedded systems.


    ![](img/631e8b200cce187082ee46b0eb1681b3_293_0.png)


    The Raspberry Pi Model B+ and Model 2 Layout


    # Model comparison table


    | | Model A | Model B | Model B+ | Version 2 |

    | Processor | ARM1176JZF-S 700 MHz processor, VideoCore IV GPU | ARM1176JZF-S
    700 MHz processor, VideoCore IV GPU | ARM1176JZF-S 700 MHz processor, VideoCore
    IV GPU | Quad-core ARM Cortex-A7 CPU and a VideoCore IV dual-core GPU |

    | Memory | 256Kb | 512Kb | 512Kb | 1Gb |

    | USB Ports | 2 | 2 | 4 | 4 |'
  merge: -1
  img_proc: true
- pgno: 294
  md: '# Setting Up Your Raspberry Pi


    |  | Model A | Model B | Model B+ | Version 2 |

    |---|---|---|---|---|

    | Ethernet | No | Yes | Yes | Yes |

    | No. GPIO Pins | 26 | 26 | 40 | 40 |

    | Storage | SD Card | SD Card | Micro SD Card | Micro SD Card |


    # So which one?


    Essentially, any version of the Raspberry Pi will work with the modules presented
    in this book, but if you want to exploit features such as the camera, which may
    require more processing power and memory, or want to have an Ethernet connection,
    you''ll need to use the Model B.


    If you want to start plugging additional stuff into the USB port, such as a GSM
    modem, then I recommend that you use the Model B+ as it delivers more power to
    those kinds of devices without the need for additional USB hubs.


    If you want to do more processing with video and images from an attached camera,
    or want to connect lots of things, then go for the latest **Model 2** board. I''m
    going to assume that''s the one you have chosen for this project, and that''s
    the one I''ll be using throughout this book; just be aware of any limitations
    if you choose to use an earlier model.


    > The Raspberry Pi Foundation site has more detailed information about each model.
    You can visit it at `https://www.raspberrypi.org/products`.


    # Preparing the SD card


    The Raspberry Pi only boots from an SD card (or micro SD card for the B+ and v2
    models), and cannot boot from an external drive or USB stick (well that''s not
    strictly true, but is beyond the scope of this book).


    It''s recommended that you use a Class 10 SD card for performance, but a Class
    4 or 6 card will be fine for this project. You''ll need to have a minimum card
    size of 4Gb.


    Now that we have our Raspberry Pi board and SD card to hand, we need to prepare
    the SD Card specifically for our home security system. We''re going to use the
    standard Raspbian operating system as there really is no reason to use any other
    distribution; it''s the de facto choice for the Raspberry Pi.'
  merge: -1
  img_proc: true
- pgno: 295
  md: '# # Downloading the Raspbian image


    You''ll need to grab the latest **Raspbian OS** image from the Raspberry Pi site
    at `https://www.raspberrypi.org/downloads`.


    Download the Raspbian OS ZIP file containing the image to your PC.


    > At the time of writing, the latest version was Raspbian Jessie version 4.1 (`2015-09-24-raspbian-jessie.zip`).


    Once downloaded, unzip the file and you''ll have the file, `2015-09-24-raspbian-jessie.img`.


    The next thing to do is burn this image to your SD card…


    # ## Using Microsoft Windows


    On a Windows PC, the best way to burn the image to your SD card is to use the
    **Win32 Disk Imager** utility. This can be downloaded from `http://sourceforge.net/projects/win32diskimager`.


    > The current version, at the time of writing, is 0.9.5.


    It doesn''t have an installer, and launches directly from the EXE file.


    Now, it''s time to create your SD card image:


    +   1. Insert your SD card into the PC and launch the Win32 Disk Imager.

    +   2. Select the SD card device drive letter (make sure it''s right!).

    +   3. Choose the Raspbian image file you''ve just downloaded.'
  merge: -1
  img_proc: true
- pgno: 296
  md: '4. Click on the Write button to create the SD card image.


    ![](img/631e8b200cce187082ee46b0eb1681b3_296_0.png)


    # Using Linux


    On a Linux PC, you''ll need to use the gparted and dd utilities to burn the image
    on your SD card.


    Carry out the following steps to create your SD card image:


    +   1. Extract 2015-09-24-raspbian-jessie.img to your Home folder.

    +   2. Insert your SD card into the PC.

    +   3. If you''re not already in a shell terminal window, open one (you can use
    Ctrl + Alt + T on most graphical-based desktop systems).

    +   4. Type the following command in the shell terminal:

    +      $ sudo fdisk -l

    +      In the list check, your SD card appears as a drive device (for example,
    /dev/sdb). It''s crucial that you ensure you use the right device in the next
    step. We''ll assume that your device is /sdb.

    +   5. To burn the image to the SD card, type the following command:

    +      $ sudo dd if=2015-09-24-raspbian-jessie.img of=/dev/sdb

    +   6. Hit Enter and go make a cup of tea or coffee as this will take a while.
    You''ll know that it''s finished when the command ($) prompt re-appears.

    +   7. When the command prompt does re-appear, type the following command:

    +      $ sudo sync

    +   8. Once that command has finished, you can remove the SD card from the PC.'
  merge: -1
  img_proc: true
- pgno: 297
  md: '# # Booting your Pi


    You''re now ready to boot up your Raspberry Pi. Pop your shiny new SD card into
    it and plug in the power.


    Assuming that you have a monitor attached to your Pi, you should see your system
    booting up nicely. Although you could wait for it to boot up and connect to it
    via a terminal session (we''ll look at that later), I recommend that you connect
    a monitor to it, at least in the first instance, just to make sure everything
    is working correctly.


    In the new **Jessie** version of Raspbian, you''ll boot straight into a desktop
    GUI, which is a major change from previous versions, where you''d be taken to
    the **raspi-config** utility, the first time the system is run, where you''d set
    up your Pi, and importantly, expand the file system to use the entire space available
    on your SD card.


    ![](img/631e8b200cce187082ee46b0eb1681b3_297_0.png)


    *Debian Jessie boots into the GUI by default*


    # # Expanding the file system


    When you first create your Raspbian SD card, you''ll only be left with about 200Mb
    of space in the file system, regardless of the size of your SD card. This is not
    much use, so we want to expand the file system so that it uses all of the available
    space on the card.


    Fortunately, this is very easy on the Raspberry Pi now, as this function is available
    in the Raspberry Pi Configuration Tool on the desktop.'
  merge: -1
  img_proc: true
- pgno: 298
  md: 'To access the new configuration tool, go to **Menu** and select **Preferences
    | Raspberry Pi Configuration.**


    ![](img/631e8b200cce187082ee46b0eb1681b3_298_0.png)


    The new Raspberry Pi Configuration Tool


    # Goodbye GUI


    > Most of our work is going to be done in the command-line interface (CLI). Therefore,
    before we reboot the system in a minute, let''s change the **Boot** option by
    selecting **To CLI**, as shown in the previous screenshot, so boot into the command
    line going forward.


    Anyway, now we click on the **Expand Filesystem** button, and in a couple of seconds,
    you''ll see a confirmation message. The filesystem will be expanded when the system
    next reboots.


    # Using the raspi-config utility


    If you have an older version of Raspbian, or you''re not using the desktop GUI,
    then you''ll need to use the raspi-config utility (which is still better than
    the old days when we had to do this manually in the shell). The first time you
    boot up, you''ll be taken straight to the raspi-config utility.'
  merge: -1
  img_proc: true
- pgno: 299
  md: '![](img/631e8b200cce187082ee46b0eb1681b3_299_0.png)


    The first option is the Expand Filesystem option; select this and you''ll see
    various commands scrolling up the screen. Once it''s finished, you''ll see the
