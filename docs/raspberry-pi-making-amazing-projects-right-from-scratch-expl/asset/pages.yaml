- pgno: 358
  md: 'The following diagram shows the wiring connections for my GardScan PIR sensor,
    but this is in fact typical for most off-the-shelf security system devices:


    ![](img/631e8b200cce187082ee46b0eb1681b3_358_0.png)


    Similar to the magnetic contact sensors that we looked at in the previous chapter,
    devices can come with either a normally closed (NC) or a normally open (NO) alarm.
    This particular device has a normally closed output, which means that the alarm
    circuit will be broken when the detector is triggered. This is the preferred configuration
    for our sensor devices as this means that they can be wired in a series within
    each of our zones.


    We can now add this sensor device into the alarm circuit that we started putting
    together in the previous chapter. The following diagram shows the circuit for
    all our sensors so far wired into a single zone:


    ![](img/631e8b200cce187082ee46b0eb1681b3_358_1.png)'
  merge: -1
