- pgno: 585
  md: 'This part of the code initializes the joystick so that all the controls can
    be sent to the biped''s Raspberry Pi.


    You''ll need to run these programs on both computers, entering the Internet address
    of the remote computer connected to the joystick. The following is what running
    the program on that computer will look like, before running the program on the
    remote computer:


    ![](img/631e8b200cce187082ee46b0eb1681b3_585_0.png)


    And the following is what the program will look like when run on the Raspberry
