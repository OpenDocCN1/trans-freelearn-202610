- pgno: 441
  md: "```\n```sh\nsleep 1\necho \"[ALM] Initialising done\"\n##############################\n\
    ```\n```\n\n# The system monitoring loop\n\nThe script then jumps into a never-ending\
    \ loop that will be the main control system, monitoring the arm/disarm status\
    \ and, when armed, monitoring the zone input status and responding accordingly:\n\
    \n```\n```sh\n# loop continuously############\nwhile true\ndo\n\n    # wait for\
    \ system to be armed ###############\n    echo \"[ALM] Alarm now in STAND-BY state\
    \ - waiting to be armed\"\n    almSetArmedLED 0 #switch off armed LED\n    STAT_RET_VAL=\"\
    0\"\n    while [[ $STAT_RET_VAL = \"0\" ]]; do\n        sleep 1\n        #read\
    \ the control panel status file\n        . /etc/pi-alarm/alarm.cfg\n        almGetArmedSwitchStatus\
    \ #result is returned in STAT_RET_VAL\n        echo -n \"*\" # indicates standby\
    \ mode\n    done\n###############################################\n```\n```\n\n\
    # Arming the system\n\nWhen the system goes into the ARMED state, it will first\
    \ switch on the exit buzzer and then wait for a pre-determined amount of time.\
    \ This will give you time to leave the property or disarm the system:\n\n```\n\
    ```sh\n# perform exit delay ########################\necho \"[ALM] Alarm now in\
    \ EXIT DELAY state\"\nalmSetExitBuzzer 1 #switch on exit buzzer\nCOUNTER=$ALM_EXIT_DELAY\n\
    while [[ $STAT_RET_VAL = \"1\" && $COUNTER -gt 0 ]]; do\n    sleep 1\n    #read\
    \ the control panel status file\n    . /etc/pi-alarm/alarm.cfg\n    almGetArmedSwitchStatus\
    \ #result is returned in STAT_RET_VAL\n    COUNTER-=1\n    echo -n \"$COUNTER\
    \ \" # indicate exit mode\n```\n```"
  merge: -1
