- pgno: 521
  md: '# Avoiding Obstacles

    Using Sensors


    You''ve constructed your biped robot. Now, your robot can move around. But what
    if you want the robot to sense the outside world, so you don''t run into things?
    In this chapter, you''ll discover how to add some sensors to help avoid barriers.


    Specifically, you''ll learn:


    +   - How to connect Raspberry Pi to an **IR (infrared)** sensor

    +   - How to connect Raspberry Pi to a **USB sonar sensor** to detect the world

    +   - How to connect Raspberry Pi and its GPIO to a sonar sensor to detect the
    world


    # Connecting Raspberry Pi to an infrared

    sensor


    Your robot can now move around, but you''ll want to be able to sense a barrier
    or a target. One of the ways to do this is with an IR sensor. First, a tutorial
    on IR sensors is required. An IR sensor has both a transmitter and a sensor. The
    transmitter sends out a narrow beam of light, and the sensor receives this beam
    of light.'
  merge: -1
  img_proc: true
- pgno: 522
  md: '# Avoiding Obstacles Using Sensors


    The difference in transit ends up as an angle measurement in the sensor, as shown
    in the following figure:


    ![](img/631e8b200cce187082ee46b0eb1681b3_522_0.png)


    The different angles give you an indication of the distance from the object. The
    sensor turns these angle measurements into a voltage that you can sense to determine
    the distance. Unfortunately, the relationship between the output of the sensor
    and the distance is not linear, so you''ll need to do some calibration in order
    to predict the actual distance and its relationship to the output of the sensor.


    > IR sensors are quite accurate, certainly with a low percentage of errors; however,
    they may not work well if the area is brightly lit. The accuracy is also affected
    by the reflective nature of the material being sensed. This can be a consideration
    when deciding which sensors to use.


    Before you get started, you''ll need to get a sensor. One of the more popular
    ones is an inexpensive IR sensor by Sharp. It is available at many online electronics
    stores, and it comes in models that sense various distances. You’ll be using the
    **Sharp 2Y0A02** model, a unit that provides sensing to a distance of 150 cm.
    Here is a picture of the sensor:'
  merge: -1
  img_proc: true
- pgno: 523
  md: '![](img/631e8b200cce187082ee46b0eb1681b3_523_0.png)


    You''ll also want to make sure you also get the connector cable for the device;
    it normally comes with the device. Here is a picture of the sensor with the cable
    attached:


    ![](img/631e8b200cce187082ee46b0eb1681b3_523_1.png)


    As noted in the tutorial, the voltage out of the sensor will be a voltage that
    will be an indication of the distance. However, this is an analog signal, and
    the Raspberry Pi doesn''t have an analog-to-digital converter that can convert
    this analog voltage to a number that you can read in your program. You''ll need
    to add an analog to digital converter to your project.'
  merge: -1
  img_proc: true
- pgno: 524
  md: 'There are two choices. If you want an analog-to-digital converter that plugs
    directly into the USB interface, there is one offered by www.phidgets.com. This
    board is really quite amazing; it takes the analog signals, turns them into digital
    numbers using an analog to digital converter, and then makes them available so
    that they can be read from the USB port. The model number of this part is **1011_0
    - PhidgetInterfaceKit 2/2** and it is shown in the following:


    ![](img/631e8b200cce187082ee46b0eb1681b3_524_0.png)


    Unfortunately, it takes a bit of programming expertise to get it up and running.
    The other choice is to use an analog-to-digital converter that connects to the
    GPIO pins of the Raspberry Pi. There is a part, the **ADC pi+** from www.abelectronics.co.uk,
    that does this. It is pictured here:


    ![](img/631e8b200cce187082ee46b0eb1681b3_524_1.png)'
  merge: -1
  img_proc: true
- pgno: 525
  md: 'This device is easier to program, so this is what you''ll use in this project.
    Now, let''s connect the sensor:


    +   1. Solder header pins to the ADC Pi+ board to connect it to the ADC, like
    this:

    +   2. Now, plug the board into the Raspberry Pi B 2. Here is a picture of the
    combination:


    ![](img/631e8b200cce187082ee46b0eb1681b3_525_0.png)


    ![](img/631e8b200cce187082ee46b0eb1681b3_525_1.png)'
  merge: -1
  img_proc: true
- pgno: 526
  md: '3. Now, you''ll connect the IR sensor to the ADC. To connect this unit, you''ll
    connect the three pins that are available at the bottom of the sensor. Here is
    the connection list:


    | ADC-DAC Board | Sensor Pin |

    | --- | --- |

    | 5V | Vcc |

    | GND | Gnd |

    | In1 | Vo |


    Unfortunately, there are no labels on the unit, but here are the pins you''ll
    connect:


    ![](img/631e8b200cce187082ee46b0eb1681b3_526_0.png)


    It''s easiest to connect to the three-wire cable that normally comes with the
    sensor. Once the pins are connected, you are ready to access the data from the
    sensor via a Python program on the Raspberry Pi. The entire system looks like
    this:'
  merge: -1
  img_proc: true
- pgno: 527
  md: '![](img/631e8b200cce187082ee46b0eb1681b3_527_0.png)


    Now, you are ready to add some code to read the IR sensor. You''ll need to follow
    these steps to talk to the ADC:


    +   1. The first step in enabling the ADC is to enable the I2C interface. This
    is done by running raspi-config and selecting 8 Advanced Options like this:


    ![](img/631e8b200cce187082ee46b0eb1681b3_527_1.png)'
  merge: -1
  img_proc: true
- pgno: 528
  md: '2. Once there, go to the A7 I2C selection to enable the I2C like this:


    ![](img/631e8b200cce187082ee46b0eb1681b3_528_0.png)


    Perform all the selections to enable the I2C interface and load the library, and
    then reboot the Raspberry Pi.


    You''ll also need to edit the /etc/modules file and add the following two lines:


    ![](img/631e8b200cce187082ee46b0eb1681b3_528_1.png)'
  merge: -1
