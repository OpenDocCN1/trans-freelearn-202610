- pgno: 416
  md: 'In the zone list table in the previous chapter, you''ll notice that I assigned
    input GP0 on the Raspberry Pi GPIO as our arm/disarm switch input. This input
    will work in conjunction with our control panel switch.


    This input can as be a simple as a toggle switch, or a bit more secure, such as
    a **key switch** or **electronic keypad**. Either way, it will be wired to ground
    GP0 (GPIO17) on our Raspberry Pi when the system is armed.


    ![](img/631e8b200cce187082ee46b0eb1681b3_416_0.png)


    The circuit diagram for our arm/disarm switch


    If you have switches or other such devices that will be outside and exposed to
    the elements, you''ll need to ensure that they are suitable for outdoor use so
    that they don''t get damaged and compromise the integrity of the system.


    ![](img/631e8b200cce187082ee46b0eb1681b3_416_1.png)


    The IP67-rated key switch, suitable for outdoor use (type Lorlin WRL-5-E-S-2-B)'
  merge: -1
  img_proc: true
