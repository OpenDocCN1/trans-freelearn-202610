- pgno: 32
  md: '# Booting up our Pi for the first time


    Let''s boot up our Pi for the first time with the microSD card:


    +   1. Insert the microSD card into the microSD card slot of the Pi.

    +   2. Connect the Pi to the HDMI monitor. If you are connecting the VGA monitor,
    connect it using the HDMI to VGA converter.

    +   3. Connect the USB mouse and the USB keyboard.

    +   4. Connect the Pi to a power supply using the micro USB power cable. Make
    sure the power is switched off at this point.

    +   5. Check all the connections once and then switch on the power supply of the
    Pi.


    At this stage, our Pi will start booting up. You will see a green light on the
    Pi board blinking. This means that it''s working! Now, there are few more things
    we need to do before we can really start using our Pi. Once it boots up, it will
    show the desktop as follows:


    ![](img/631e8b200cce187082ee46b0eb1681b3_32_0.png)'
  merge: -1
  img_proc: true
