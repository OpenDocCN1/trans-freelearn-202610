- pgno: 175
  md: "# Intruder detection system\n\nDo you have any data that would cause damage\
    \ if it fell into the wrong hands?\nOr do you wish to know who enters a specific\
    \ place when you're not present?\nWell, you can now easily answer these questions\
    \ by building your own intruder detection system!\n\nAs mentioned before, this\
    \ project uses an ultrasonic range sensor for the GrovePi and a PiCam to take\
    \ pictures if any movement is detected by the ultrasonic ranger. Connect the ultrasonic\
    \ ranger to port D4 of the Grove Pi, the buzzer to D5, the status LED to D3, and\
    \ the Pi Camera to the port provided on the Raspberry Pi as learned in Chapter\
    \ 4, Working with Webcam and Pi Camera. Following the theme of the book, we will\
    \ first look at the whole code, and then learn what each statement does, line\
    \ by line:\n\n```\nimport picamera\nimport grovepi\nfrom time import sleep\n\n\
    camera = picamera.PiCamera()\ncounter = 0\nled = 3\nbuzzer = 5\nultrasonic = 4\n\
    \nwhile True:\n    try:\n        if grovepi.ultrasonicRead(ultrasonic) < 100:\n\
    \            print 'Intruder Detected'\n            grovepi.analogWrite(buzzer,\
    \ 100)\n            grovepi.digitalWrite(led, 1)\n            sleep(.5)\n    \
    \        grovepi.analogWrite(buzzer, 0)\n            grovepi.digitalWrite(led,\
    \ 0)\n            camera.capture('image' + counter + '.jpg')\n            print\
    \ 'Image Captured'\n        sleep(2)\n    except IOError:\n        print \"Error\"\
    \n```"
