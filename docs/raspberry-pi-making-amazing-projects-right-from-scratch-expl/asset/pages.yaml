- pgno: 396
  md: '# Creating the web page


    Our Web-based control panel is going to be a single PHP-driven HTML5 web page
    which will be **mobile optimized**. HTML5 is the latest mark-up standard for web
    pages and is supported by most modern smartphones and browsers. We will also create
    a **cascading style-sheet (CSS)** that will make our page look half reasonable
    on mobile devices.


    To create the web files, I recommend that you use something like the excellent
    Notepad++ on your desktop computer, rather than doing it directly on the Raspberry
    Pi. Alternatively, if you are a seasoned web developer, you may already have your
    IDE of choice.


    # The control panel HTML template


    The first thing we''ll do is create an HTML file that we can use to test our layout
    before we put the HTML into a PHP file to make it interact with our system. This
    makes it easier to tweak the way we want it to look beforehand, without the PHP
    scripts getting in the way.


    > This is not a tutorial on Web development—there is a plethora of books out there
    on that subject—but I hope the code is clear enough for you to work out what''s
    going on. The code I''m going to show you is fully functional, so you can just
    use what I give you without having to do any more. Hopefully, it makes your control
    panel look OK too!


    The following mark-up gives you a basic control panel with status for our 8 zones,
    a master arm and disarm switch, and switches to enable or disable any of our zones.


    The <head> section of the code contains some <meta> tags that help mobile devices
    know that it''s a mobile-friendly site. In the main <body> mark-up, we have a
    section for each zone that contains the zone''s name and an on/off switch. Each
    zone is in its container so that we can also highlight a particular zone that
    needs our attention, for example, if it''s triggered.


    You can find the full HTML5 markup for our control panel in the `alarm-panel.html`
    file located inside the code folder of `chapter 7`.'
  merge: -1
  img_proc: true
- pgno: 397
  md: '# Giving it some style


    At the moment, this page doesn''t look that great (in fact, it looks awful, like
    something from the 1990s); it isn''t particularly good for mobile devices and
    would most certainly fail the *sausage test*. So, we''re going to apply some styling
    to make it look not half bad. Although the preceding mark-up contains a reference
    to a CSS file—we haven''t created that file—so this is what our page currently
    looks like (as I said: it looks awful):


    ![](img/631e8b200cce187082ee46b0eb1681b3_397_0.png)


    The web control panel without any styling


    The following CSS3 mark-up is designed specifically for our control panel, and
    it makes it look quite nice while also making it usable on **touch-screen** mobile
    devices. The CSS is quite long and seems overwhelming, but you don''t need to
    do anything with it, or understand it, if you don''t want to—the only thing you
    need to know is that it''s been designed for modern browsers and smartphones,
    so don''t expect it to work on Internet Explorer 7, or probably even IE9!'
  merge: -1
  img_proc: true
- pgno: 398
  md: "In essence, it contains the styling for the following:\n\n+   - Preparing the\
    \ browser for our mobile layout\n+   - Our text and zone areas\n+   - Creating\
    \ cool switches instead of boring checkboxes\n+   - Making an area flash on and\
    \ off when we need it to\n\n```\n/* Clear browser margin and padding defaults\
    \ */\nbody, div, dl, dt, dd, ul, ol, li, h1, h2, h3, h4, h5, h6, pre, form,\n\
    fieldset, input, textarea, p {\nmargin:0;padding:0;-webkit-text-size-adjust:none;\n\
    }\n\nbody {\n    background: #ffffff;\n    color: #4A5651;\n    font-family: \"\
    Trebuchet MS\", Helvetica, sans-serif;\n    font-size:10px;\n    height: 100%;\n\
    \    padding:0;\n    margin:0 auto;\n    max-width:320px;\n    min-width:240px;\n\
    \    text-align: left;\n    width:100%;\n    -webkit-box-shadow: 0px 20px 40px\
    \ 0px rgba(0,0,0,0.50);\n    -moz-box-shadow: 0px 20px 40px 0px rgba(0,0,0,0.50);\n\
