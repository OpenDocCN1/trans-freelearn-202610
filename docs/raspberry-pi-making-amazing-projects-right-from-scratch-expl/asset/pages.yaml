    You''ll then import these functions using the `from robotLib import *` statement,
    and your Python program can call these functions. This makes the path planning
    Python program much smaller and more manageable. You''ll do the same thing with
    the compass program, using the `from compass import *` command.


    > For more information on how to import the functions from one Python file to
    another, refer to http://www.tutorialspoint.com/python/python_modules.htm.


    The following is a listing of the program:


    ![](img/631e8b200cce187082ee46b0eb1681b3_552_0.png)'
