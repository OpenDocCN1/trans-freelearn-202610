- pgno: 106
  md: '# Introduction to GPIO Programming


    To understand what the following piece of code does, we will need to delve into
    the world of binary numbers and bitwise operations. You will also notice that
    in the argument of the `led()` function, we are doing a bitwise operation of the
    numbers. Why so? In the first iteration of the `for` loop, the value of x is 0,
    and the binary representation of 1 is 00000001. So, the bitwise shift operation
    will introduce no change. In the second iteration, however, the value of x will
    be 1. So, a 1-bit left shift will result in the binary number 00000010, which
    is the representation of integer 2. Similarly, the third iteration will result
    in 00000100, which is binary for 4. Now, there is also the bitwise AND operation
    on the variables holding the values of hours, minutes, and seconds. Consider,
    for example, that the current hour is 3 p.m. The binary representation will be
    00000011. If we do a bitwise AND operation in the first iteration, we get 00000001.
    This is 1 and it is multiplied with the ledbrightness variable; we light up the
    13 + 0 = 13th LED at a brightness of 10. This LED is the first LED of the arm
    that is represented by hours. Now, doing a bitwise AND in the second iteration,
    we have hour = 00000011 and 1 << x = 00000010. The result is 00000010, which is
    the integer 2. This means that the 14th LED will light with a brightness of 20.
    But in the third iteration, since 1 << x = 00000100, we get the integer 0 at the
    output, which means that the 15th LED will not light at all!


    Applying the same logic if the time is 4 pm, the 13th LED will not light up, the
    14th LED will not light up, but the 15th LED will light up with a brightness of
    40. Going in the same direction, we now have an intuitive understanding of how
    the hours, minutes, and seconds of the binary clock are represented.


    Finally, we design the program to flash all the white LEDs once the hour finishes.
    We also add 500-ms delays on both sides of the flash so that it doesn''t appear
    too sudden. Then, we decrement the hour count and the whole program repeats with
    the updated time.


    Now, save the code as `prog3.py` and run it with the following command:


    ```

    python prog3.py

    ```


    You will now be able to see the hours, minutes, and seconds represented as binary
    numbers on PiGlow!'
  merge: -1
  img_proc: true
