- pgno: 479
  md: '# 2


    # Building the Biped


    Now that you''ve got your Raspberry Pi 2 Model B all configured and ready to go,
    you''ll need to add some hardware to control and interface. In this chapter, you''ll
    learn:


    +   - How to build a basic 10 Degrees of Freedom (DOF) biped

    +   - How to use a servo motor controller connected to the USB port of the Raspberry
    Pi to control the servos to make your robot move


    # Building robots that can walk


    There are several choices when considering how to create a mobile robot. One of
    the more interesting choices is a robot that can walk. This normally comes in
    three versions: a biped robot with two legs, a biped robot with four legs, and
    a hexapod robot with six legs. While each offers an interesting and different
    set of possibilities, in this chapter, you''ll build a basic, 10 DOF biped.


    You''ll be using a total of 10 servos for your project, as each leg has 5 points
    that can move, or 5 degrees of freedom (DOF). As servos are the most critical
    component of this project, it is perhaps useful to go through a tutorial on servos
    and learn how to control them.


    # How servo motors work


    Servo motors are somewhat similar to DC motors. However, there is an important
    difference. While DC motors are generally designed to move in a continuous way
    – rotating 360 degrees at a given speed – servos are generally designed to move
    to a limited set of angles. In other words, in the DC motor world, you generally
    want your motors to spin with a continuous rotation speed that you control. In
    the servo world, you want your motor to move to a specific position that you control.'
  merge: -1
  img_proc: true
- pgno: 480
  md: 'This is done by sending a Pulse-Width-Modulated (PWM) signal to the control
    connector of the servo. The length of this pulse will control the angle of the
    servo like this:


    ![](img/631e8b200cce187082ee46b0eb1681b3_480_0.png)


    These pulses are sent out with a repetition rate of 60 Hz. You can position the
    servo to any angle by setting the correct control pulse.


    # Building the biped platform


    There are several approaches to building your biped platform. Perhaps the most
    simple is to purchase a set of basic parts; this is the example you''ll see in
    this chapter. There are several kit possibilities out there, including one at
    http://www.robotshop.com/en/lynxmotion-biped-robot-scout-bps-ns-servos.html, a
    kit like the one offered at http://www.ebay.com/itm/10-DOF-Biped-Robot-Mechanical-Leg-Robot-Servo-Motor-Bracket-NO-Servo-Motor-good-/131162548695?pt=LH_DefaultDomain_0&hash=item1e89e5a9d7,
    or the one at http://www.amazon.com/gp/product/B00DR7GA4I/ref=oh_aui_detailpage_o04_s00?ie=UTF8&psc=1.
    This is the specific kit we''ll use in this chapter.


    In the end, your biped will work more like the legs of a Tyrannosaurus Rex of
    a human, but this will make it easier to program, and it will power down more
    gracefully. It will also be a bit more stable.'
  merge: -1
  img_proc: true
- pgno: 481
  md: 'You''ll also need 10 standard size servos. There are several possible choices,
    but **Hitec** servos are relatively inexpensive servos and you can get them at
    most hobby shops and online electronics retailers. One of the important steps
    in this process is to select the model of the servo. Servos come in different
    model numbers, primarily based on the amount of torque they can generate.


    Torque is the force that the servo can exert to move the part connected to it.
    In this case, your servos will need to lift and move the weight associated with
    your biped, so you''ll need a servo with enough torque to do this. However, there
    are different torque needs for your biped robot. The angle joints will not lift
    the entire leg, so they can be servos with a lower servo rating, for example,
    the HS-422 servos. For the knee servo, you''ll need a more powerful servo. In
    this case, I suggest that you use model HS-645MGHB servos. The hip joint that
    lifts the leg is where you will need the most torque to be able to lift the leg.
    Here, too, I suggest that you use the model HS-645MG servos. You can also just
    use 10 HS-645MG servos for all the servos, but they are more expensive, so using
    different servos will save you some money.


    One final piece that you''ll need is some metal servo horns. These servo horns
    are optional, but they will make your biped robot much more solid than the plastic
    servo horns that normally come with the servos. Here is a picture of one of these
    horns:


    ![](img/631e8b200cce187082ee46b0eb1681b3_481_0.png)'
  merge: -1
  img_proc: true
