  img_proc: true
- pgno: 553
  md: 'In this program, the user enters the goal location and the robot first decides
    the shortest direction to the desired angle by reading the angle. To make it simple,
    the robot is placed in the grid with it heading in the direction of angle 0. If
    the goal angle is less than 180 degrees, the robot will turn right. If it is greater
    than 180 degrees, the robot will turn left. The robot turns until the desired
    angle and its measured angle are within a few degrees. Then, the robot takes the
    number of steps to reach the goal.


    # Avoiding obstacles


    Planning paths without obstacles, as has been shown, is quite easy. However, it
    becomes a bit more challenging when your robot needs to walk around obstacles.
    Let''s look at an instance where there is an obstacle in the path that you calculated
    previously. It might look like the following:


    ![](img/631e8b200cce187082ee46b0eb1681b3_553_0.png)


    You can still use the same path planning algorithm to find the starting angle;
    however, you''ll now need to use your sonar sensor to detect the obstacle. When
    your sonar sensor detects the obstacle, you''ll need to stop and recalculate a
    path to avoid the barrier, and then recalculate the desired path to the goal.
    One very simple way to do this, when your robot senses a barrier, is to turn right
    90 degrees, go a fixed distance, and then recalculate the optimum path. When you
    turn back to move toward the target, if you sense no barrier, you will be able
    to move along the optimum path.'
  merge: -1
  img_proc: true
- pgno: 554
  md: "# Path Planning and Your Biped\n\nHowever, if your robot encounters the obstacle\
    \ again, it will repeat the process, until it reaches the goal. In this case,\
    \ using these rules, the robot will travel the following path:\n\n![](img/631e8b200cce187082ee46b0eb1681b3_554_0.png)\n\
    \nThere is one more step you'll need to take before adding the sonar sensor's\
    \ capability to your robot. You'll need to change the sonar sensor code so that\
    \ it can be added to the Python code as a library. The following is that code:\n\
    \n```\nimport RPi.GPIO as GPIO\nimport time\nGPIO.setmode(GPIO.BCM)\n\ndef getDistance():\n\
    \    trig_pin = 23\n    echo_pin = 24\n    GPIO.setup(trig_pin,GPIO.OUT)\n   \
    \ GPIO.setup(echo_pin,GPIO.IN)\n\n    GPIO.output(trig_pin, False)\n    time.sleep(1)\n\
    \    GPIO.output(trig_pin, True)\n    time.sleep(0.00001)\n    GPIO.output(trig_pin,\
    \ False)\n\n    while GPIO.input(echo_pin)==0:\n        start = time.time()\n\n\
    \    while GPIO.input(echo_pin)==1:\n        end = time.time()\n\n    duration\
    \ = end - start\n    distance = duration * 17150\n    distance = round(distance,\
    \ 2)\n    GPIO.cleanup()\n    return distance\n\nprint \"Distance: \", getDistance(),\
    \ \"cm\"\n```"
