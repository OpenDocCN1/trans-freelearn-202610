- pgno: 442
  md: "```\ndone\nalmSetExitBuzzer 0 #switch off exit buzzer\n###################################################\n\
    \n# system now armed - monitor inputs ########\nALM_SYS_ARMED=1\necho \"[ALM]\
    \ Alarm now in ARMED state\"\nalmSetArmedLED 1 #switch on armed LED\n\n#read the\
    \ control panel status file\n. /etc/pi-alarm/alarm.cfg\nalmReadZoneInputs  # >\
    \ ALM_ZONES_STAT[x]\n```\n\n# Monitoring the zones\n\nOnce armed, the system will\
    \ monitor the zone inputs in a continuous loop until either the system is disarmed,\
    \ or a zone input is triggered. When a zone is triggered, it will check against\
    \ the ZONE_ENABLE_n configuration to see if that zone has been disabled (this\
    \ is done in the Web-based control panel). If the zone is not disabled, then the\
    \ alarm system is deemed triggered.\n\nThe ZONE_STATUS_n setting is also updated\
    \ here so that the web-based control panel indicates which zone or zones have\
    \ been triggered:\n\n```\n#check each zone input to set if it's enable\n#and has\
    \ been triggered\n#NUM_ZONES setting is stored in alarm.cfg\n\nwhile [[ $ALM_SYS_ARMED\
    \ -eq 1 ]]; do\n    echo -n \"A\" #indicate armed mode\n\n    ALM_ZONE_TRIGGER=0\n\
    \    for (( i=$NUM_ZONES; i>0; i-- )); do\n        if [[ $ALM_ZONES_STAT[$i-1]\
    \ -eq 1 ]]; then\n            #zone has been triggered\n            echo \"[ALM]\
    \ Zone $i TRIGGERED\"\n            E_VAR=\"ZONE_ENABLE_$i\"\n            E_VAL=`echo\
    \ \"$E_VAR\"` #get zone enabled status loaded from alarm.cfg\n\n            if\
    \ [[ $E_VAL -eq 1 ]]; then\n                #zone is enabled\n               \
    \ ALM_ZONE_TRIGGER=1 #set alarm triggered flag\n                echo \"[ALM] Zone\
    \ $i ENABLED - alarm will be triggered\"\n```"
  merge: -1
  img_proc: true
- pgno: 443
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 444
  md: "# Sounding the main alarm\n\nIf, at this point, the system hasn't been disarmed,\
    \ then we need to sound the main bell. We have a duration limit for sounding the\
    \ bell to cater to environmental noise restrictions; we wouldn't want the alarm\
    \ sounding for hours, annoying the neighbors until we got home. At this point,\
    \ you can also add code from Chapter 6, Adding Cameras to Our Security System,\
    \ if you want to be sent an alert email to your mobile device:\n\n```\n##############################\n\
    # STAY in TRIGGERED mode until system has been disarmed\nif [[ $STAT_RET_VAL =\
    \ \"1\" ]]; then\n    #alarm has not been disabled\n    almSetAlarmBell 1 #switch\
    \ on alarm bell\n    echo \"[ALM] Alarm now in TRIGGERED state\"\n\n    ## YOU\
    \ CAN INSERT CODE HERE TO SEND YOU AN EMAIL IF YOU\n        WANT##\n    ## REFER\
    \ BACK TO CHAPTER 6 ##\n\n    COUNTER=0\n    STAT_RET_VAL=\"0\"\n    while [[\
    \ $STAT_RET_VAL = \"1\" ]]; do\n        echo -n \"T$COUNTER \" #indicate triggered\
    \ mode\n        sleep 1\n        #read the control panel status file\n       \
    \ . /etc/pi-alarm/alarm.cfg\n        almGetArmedSwitchStatus #result is returned\
    \ in STAT_RET_VAL\n\n        COUNTER+=1\n        if [[ $COUNTER -gt $ALM_BELL_DURATION\
    \ ]]; then\n            almSetAlarmBell 0 #switch off alarm bell\n           \
    \ echo \"[ALM] Bell has been switched OFF\"\n        fi\n    done\nfi\n##############################\n\
    ```\n\n# Disarming and resetting the system\n\nWhen we disarm the system, we need\
    \ to reset its status and complete the monitoring loop so that we can start all\
    \ over again and wait for it to be re-armed:\n\n```\n# alarm has been disarmed\
    \ ########\necho \"[ALM] Alarm has been DISARMED\"\n```"
  merge: -1
  img_proc: true
- pgno: 445
