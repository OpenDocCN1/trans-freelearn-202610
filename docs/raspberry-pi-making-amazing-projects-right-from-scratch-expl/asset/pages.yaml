- pgno: 501
  md: "```\n#!/usr/bin/python\nimport serial\nimport time\n\ndef setAngle(ser, channel,\
    \ angle):\n    minAngle = 0.0\n    maxAngle = 180.0\n    minTarget = 256.0\n \
    \   maxTarget = 13120.0\n    scaledValue = int((angle / ((maxAngle - minAngle)\
    \ / (maxTarget - minTarget))) + minTarget)\n    commandByte = chr(0x84)\n    channelByte\
    \ = chr(channel)\n    lowTargetByte = chr(scaledValue & 0x7F)\n    highTargetByte\
    \ = chr((scaledValue >> 7) & 0x7F)\n    command = commandByte + channelByte +\
    \ lowTargetByte + highTargetByte\n    ser.write(command)\n    ser.flush()\n\n\
    ser = serial.Serial(\"/dev/ttyACM0\", 9600)\n\n# Home position\n\nfor i in range(0,\
    \ 9):\n    setAngle(ser, i ,90)\n\nser.close()\n```\n\nHere is an explanation\
    \ of the code:\n\n+   - `#!/usr/bin/python`: This first line allows you to make\
    \ this Python file execute from the command line.\n+   - `import serial`: This\
    \ line imports the serial library. You need the serial library to talk to your\
    \ unit via the USB.\n+   - `def setAngle(ser, channel, angle)`: This function\
    \ converts your desired setting of servo and angle into the serial command that\
    \ the servo motor controller needs. To understand the specifics of the code used\
