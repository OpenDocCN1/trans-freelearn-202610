- pgno: 158
  md: "# Creating Your Own Motion Detection and Tracking System\n\n`cv2.medianBlur()`\
    \ is used for the median blurring of the image using the median filter. It calculates\
    \ the median of all the values under the kernel, and the center pixel in the kernel\
    \ is replaced with the calculated median. In this filter, a window slides along\
    \ the image, and the median intensity value of the pixels within the window becomes\
    \ the output intensity of the pixel being processed. This is highly effective\
    \ against salt and pepper noise. We need to pass an input image and an odd positive\
    \ integer (not the rows, columns tuple like the previous two functions) to this\
    \ function. The following code introduces salt and pepper noise in the image and\
    \ then applies `cv2.medianBlur()` to that in order to remove the noise:\n\n```\n\
    ```python\nimport cv2\nimportnumpy as np\nimport random\nfrommatplotlib\nimport\
    \ pyplot as plt\n\nimg = cv2.imread('lena_color_512.tif', 1)\n\ninput = cv2.cvtColor(img,\
    \ cv2.COLOR_BGR2RGB)\n\noutput = np.zeros(input.shape, np.uint8)\np = 0.2# probability\
    \ of noise\nfor i in range(input.shape[0]):\n    for j in range(input.shape[1]):\n\
    \        r = random.random()\n        if r < p / 2:\n            output[i][j]\
    \ = 0, 0, 0\n        elif r < p:\n            output[i][j] = 255, 255, 255\n \
    \       else:\n            output[i][j] = input[i][j]\n\nnoise_removed = cv2.medianBlur(output,\
    \ 3)\n\nplt.subplot(121), plt.imshow(output), plt.title('Noisy Image')\nplt.xticks([]),\
    \ plt.yticks([])\nplt.subplot(122), plt.imshow(noise_removed), plt.title('Median\n\
    \    Filtering')\nplt.xticks([]), plt.yticks([])\nplt.show()\n```\n```\n\nYou\
    \ will find that the salt and pepper noise is drastically reduced and the image\
    \ is much more comprehensible to the human eye."
  merge: -1
  img_proc: true
