    OK...XOK...XOK...XOK...XOK...X

    OK...

    Hello

    OK...Hello

    How are you?

    OK...How are you?

    ```


    Use NCAT again to send messages to the UDP server, and the UDP server will reply
    back with OK... prefixed to the message.


    The server process terminal also displays the details about the client connected,
    as follows:


    ```

    $ python prog2.py

    Socket created

    Socket bind complete

    Message[127.0.0.1:46622] - Hello

    Message[127.0.0.1:46622] - How are you?

    ```


    It is important to note that unlike a TCP server, a UDP server can handle multiple
    clients directly as there is no explicit connection with a client (hence connectionless).
    It can receive from any client and send a reply to it. No threads are required
    as we do in TCP servers.


    # A UDP client


    The code for a UDP client is as follows:


    ```

    import socket  #for sockets

    import sys  #for exit

    ```'
