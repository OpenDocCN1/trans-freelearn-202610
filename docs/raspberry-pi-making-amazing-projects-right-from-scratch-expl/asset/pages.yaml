- pgno: 36
  md: 'The following image shows the last option:


    ![](img/631e8b200cce187082ee46b0eb1681b3_36_0.png)


    If we click on the preceding option, the following window will appear:


    ![](img/631e8b200cce187082ee46b0eb1681b3_36_1.png)


    Also, from Command Prompt LXTerminal, we can shut down Pi safely by issuing the
    following command:


    ```

    ```bash

    sudo shutdown -h now

    ```

    ```


    An alternative command for this is as follows:


    ```

    ```bash

    sudo halt

    ```

    ```


    You can reboot Pi with the following command:


    ```

    ```bash

    sudo reboot

    ```

    ```


    # Updating the Pi


    Now we have a working Pi running on the Raspbian OS. Let''s update our Pi. Make
    sure you have a working wired or wireless Internet connection with reasonable
    speed for this activity:


    +   1. Connect your Pi to an Internet modem or router with an Ethernet cable or
    plug in the Wi-Fi dongle to one of the USB ports.

    +   2. Run the following command to restart the networking service:

    +      ```bash

    +      sudo service networking restart

    +      ```'
