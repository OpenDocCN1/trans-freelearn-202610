  md: '# Otsu''s method


    Otsu''s method for thresholding automatically determines the value of the threshold
    for images that have two peaks in their histogram (bimodal histograms). The following
    is a bimodal histogram:


    ![](img/631e8b200cce187082ee46b0eb1681b3_152_0.png)


    This usually means that the image has background and foreground pixels and Otsu''s
    method is the best way to separate these two sets of pixels automatically without
    specifying a threshold value.


    Otsu''s method is not the best way for those images that are not in the background
    and foreground model and may provide improper output if applied.


    This method is applied in addition to other methods, and the threshold is passed
    as 0. Try out the following code:


    ```

    ret,output=cv2.threshold(image,0,255,cv2.THRESH_BINARY+cv2.THRESH_OTSU)

    ```'
