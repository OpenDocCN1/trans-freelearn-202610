- pgno: 209
  md: 'Connect one end of the Ethernet cable to the Raspberry Pi and the other end
    to the router for all the devices. Once we complete this networking setup, we
    can move on to connecting the Raspberry Pi devices with software.


    # Setting up SSH access from the host to the client


    In the setup described here, one master node will control the other slave nodes.
    The master is called the host and the slaves are called clients. To access the
    client from the host, we use something called SSH. It is used to get the terminal
    access to the client from the host, and the command used is as follows:


    ```

    ssh pi@192.168.1.5

    ```


    Here, the preceding IP address can be replaced with the IP address of our Raspberry
    Pi. The IP address of a Pi can be found by simply opening up a new terminal and
    entering the following command:


    ```

    ifconfig

    ```


    This will give you the IP address associated with your connected network and the
    interface, which is eth0 in our case. A small problem with using this is that
    every time we try to SSH into a client, we need a password. To remove this restriction,
    we need to authorize the master to log in to the client. How we do that is by
    generating an RSA key from the master and then transferring it to the client.
    Each device has a unique RSA key, and hence, whenever a client receives an SSH
    request from an authorized RSA device, it will not ask for the password. To do
    that, we must first generate a public private key pair from the master, which
    is done using a command in the following format:


    ```

    ssh-keygen -t rsa -C "your_email@youremail.com"

    ```'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'It will look something like this:


    ![](img/631e8b200cce187082ee46b0eb1681b3_210_0.png)


    To transfer this key into the slave Raspberry Pis, we need to know each of their
    IP addresses. This is easily done by logging into their Pi and entering ifconfig.


    Next, we need to copy our keys to the slave Raspberry Pi. This is done by the
    following command, replacing the given IP address with the IP address of your
    own Raspberry Pi:


    ```

    cat ~/.ssh/id_rsa.pub | ssh pi@192.168.1.5 "mkdir .ssh;cat >> .ssh/authorized_keys"

    ```


    Now that we have copied our keys to the slave Raspberry Pi, we should be able
    to log in without a password with the standard SSH command:


    ```

    ssh pi@192.168.1.5

    ```'
  merge: -1
  img_proc: true
- pgno: 211
  md: '# Running code in parallel


    We have now successfully completed the prerequisites for the running of code on
    multiple machines. We will now learn how to run our code on the Raspberry Pi cluster
    using the MPICH library. We will first run a demo included with the `mpi4py` module,
    and then we will run an N-Body simulation on our cluster. Sounds fun? Let''s get
    into it.


    First, we need to tell the MPICH library the IP address of each of the Pis in
    our network. This is done by simply creating a new file called `machinefile` in
    the home folder, which contains a list of the IP addresses of all the Raspberry
    Pis connected to our network. Execute the following command to create the file:


    ```

    nano machinefile

    ```


    Then, add the IP address of each Raspberry Pi in a new line so that the final
    result looks like this:


    ![](img/631e8b200cce187082ee46b0eb1681b3_211_0.png)


    Note that we have added three IP addresses because two Raspberry Pis are slaves
    and one is a master. So, the MPICH library knows that it needs to run the code
    on these three devices. Also, note that MPICH does not differentiate between devices.
    It just needs a valid installation of the library to run properly. This means
    that we can add different versions of Raspberry Pi to our cluster or even other
    computers such as a BeagleBone, which has a valid installation of MPICH.


    To test our setup, we navigate to the `mpi4py/demo` directory with the following
    command:


    ```

    cd ~/mpi4py/demo

    ```'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'Then, we run the following command:


    ```

    ```bash

    mpiexec -f ~/machinefile -n 3 python helloworld.py

    ```

    ```


    It will give an output similar to this:


    ![](img/631e8b200cce187082ee46b0eb1681b3_212_0.png)


    # # Performance benchmarking of the cluster


    Since we have successfully created a cluster of Raspberry Pis, we now need to
    test their performance. One way of doing that is to measure the latency between
    different nodes. To this end, Ohio State University has created some benchmarking
    tests that are included with the mpi4py library. We will run a few of these to
    measure the performance of our cluster. Simply put, latency measures the amount
    of time a packet takes to reach its destination and get a response. The lower
    the latency, the better a cluster will perform. The tests are given in the demo
    folder of the mpi4py directory. These run in this fashion: the osu_bcast benchmark
    measures the latency of the MPI_Bcast collective operation across N processes.
    It measures the minimum, maximum, and average latency for various message lengths
    and over a large number of iterations.


    To run the osu_allgather.py test, we execute the following command:


    ```

    ```bash

    mpiexec -f machinefile -n 3 python osu_allgather.py

    ```

    ```


    As an interesting experiment, try to gather the latency variation with different
    sizes of data. It should give you a unique insight into the functioning of the
    network.


    # # Introducing N-Body simulations


    An N-Body simulation is a simulation of a dynamic system of particles that are
    under the influence of physical forces, such as gravity or magnetism. It is mostly
    used in astrophysics to study the processes involving nonlinear structure formation,
    such as the formation of galaxies, planets, and suns. They are also used to study
    the evolution of the large-scale structure of the universe, including estimating
    the dynamics of a few body systems such as the earth, moon, and sun.'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'Now, N-body simulations require a lot of computational resources. For example,
    a 10-body system has 10*9 forces that need to be computed at the same time. You
    can see that, if we increase the number of particles, the number of forces increases
    exponentially. So a 100-body system will require 9,900 forces to be calculated
    simultaneously. That is why N-Body simulations are generally run on powerful computers.
    However, we are going to use our Raspberry Pi cluster to accomplish this task
    because it has three times the computational power of a single Raspberry Pi. For
    this task, we will use an open source library called **GalaxSee**.


    GalaxSee is modeled as discrete bodies interacting through gravity. The acceleration
    of an object is given by the sum of the forces acting on that object, divided
    by its mass. If you know the acceleration of a body, you can calculate the change
    in velocity, and if you know the velocity, you can calculate the change in the
    position. Consequently, you will have the position of each object at every point
    of time. The more objects you have, the more forces you will need to calculate,
    and every object must know about every other object. To reduce the computational
    load on a single processor, the Galaxy code is an implementation of simple parallelism.
    The most computationally heavy calculations involve calculating the forces on
    a single object, and hence, each client is involved with that calculation given
    the object''s information and the information about each object that exerts force
    on it. The master then collects the computed forces from the clients.


    ![](img/631e8b200cce187082ee46b0eb1681b3_213_0.png)'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'In this way, we can simulate an N-Body simulation with code running in parallel.
    Next, we will see how to install and get GalaxSee running.


    > To learn more about the GalaxSee library, visit https://www.shodor.org/master/galaxsee/.


    # Installing and running GalaxSee


    Now that we have a basic idea of what an N-Body simulation is and how different
    bodies interact with each other, we will proceed to the installation of the GalaxSee
    library.


    First, we need to download the archive of the source code. We can do this with
    the wget command:


    ```

    wget http://www.shodor.org/refdesk/Resources/Tutorials/MPIExamples/Gal.tgz

    ```


    Next, we extract the .tgz archive, assuming it was downloaded to the home folder.
    If the path is different, we need to enter the correct path:


    ```

    tar -xzvf ~/Gal.tgz

    ```


    Navigate to the folder:


    ```

    cd Gal

    ```


    We need to use Makefile to successfully build GalaxSee on our Raspberry Pi. To
    do that, open the file in the terminal:


    ```

    nano Makefile

    ```


    Then, change the line:


    ```

    cc = mpicc

    ```


    to:


    ```

    cc = mpic++

    ```'
  merge: -1
  img_proc: true
