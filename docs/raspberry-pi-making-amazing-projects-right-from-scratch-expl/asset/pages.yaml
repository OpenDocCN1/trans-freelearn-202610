- pgno: 531
  md: 'These raw readings are great, but now you''ll want to build a program that
    takes the data from the first ADC and translates it to the distance. To do this,
    you''ll need a graph of the voltage to distance readings for your sensor. Here
    is the graph for the IR sensor in this example:


    ![](img/631e8b200cce187082ee46b0eb1681b3_531_0.png)


    There are really two parts to the curve; the first is the distance up to about
    15 centimeters, and the second is the distance from 15 centimeters to 150 centimeters.
    It is easiest to build a simple mathematical model that ignores distances closer
    than 15 centimeters and models the distance from 15 centimeters. For more information
    on how to build this model, refer to http://davstott.me.uk/index.php/2013/06/02/raspberry-pi-sharp-infrared/.
    Here is the Python program using this model:


    ![](img/631e8b200cce187082ee46b0eb1681b3_531_1.png)'
  merge: -1
  img_proc: true
- pgno: 532
  md: 'The only new line of code is the distance = (1.0 / (adc.read_adc_voltage(1)
    / 13.15)) - 0.35 line. It converts your voltage to distance. You can now run your
    program and you''ll see the results in centimeters, like this:


    ![](img/631e8b200cce187082ee46b0eb1681b3_532_0.png)


    Now, you can measure the distance to objects using your IR sensor!


    # Connecting Raspberry Pi to a USB sonar sensor


    There is yet another way to sense the presence of objects: using a sonar sensor.
    But before you add this capability to your system, here''s a little tutorial on
    sonar sensors. This type of sensor uses ultrasonic sound to calculate the distance
    from an object. The sound wave travels out from the sensor, as illustrated in
    the following figure:'
  merge: -1
  img_proc: true
- pgno: 533
  md: '![](img/631e8b200cce187082ee46b0eb1681b3_533_0.png)


    The device sends out a sound wave 10 times a second. If an object is in the path
    of these waves, then the waves reflect off the object, sending waves that return
    to the sensor, as shown in the following figure:


    ![](img/631e8b200cce187082ee46b0eb1681b3_533_1.png)


    The sensor then measures any return. It uses the time difference between when
    the sound wave was sent out and when it returned to measure the distance from
    the object.'
  merge: -1
  img_proc: true
- pgno: 534
  md: '# Avoiding Obstacles Using Sensors


    > Sonar sensors are also quite accurate, normally with low percentage errors,
    and are not affected by the lighting or color in the environment.


    There are several choices if you want to use a sonar sensor to sense the distance.
    The first is to use a sonar sensor that connects to the USB port. The following
    is an image of a USB sonar sensor:


    ![](img/631e8b200cce187082ee46b0eb1681b3_534_0.png)


    This is the **USB-ProxSonar-EZ** sensor, and can be purchased directly from MaxBotix
    or on Amazon. There are several models, each with a different distance specification;
    however, they all work in the same way.


    You can also choose a sonar sensor that connects to the GPIO of the Raspberry
    Pi. Here is a picture of this sort of inexpensive sonar sensor:


    ![](img/631e8b200cce187082ee46b0eb1681b3_534_1.png)'
  merge: -1
  img_proc: true
- pgno: 535
  md: 'This sensor is less expensive and easy to use; it takes a bit of processing
    power to coordinate the efforts of timing the send and receive signals, but the
    Raspberry Pi B 2 has the processing power needed. Here are the steps to set up
    this sonar sensor to sense the distance:


    +   1. The first step is to understand the GPIO pins of the Raspberry Pi B 2.
    Here is a diagram of the layout of the pins:


    ![](img/631e8b200cce187082ee46b0eb1681b3_535_0.png)


    In this case, you''ll need to connect to the 5 volt connection of the Raspberry
    Pi B2, which is pin 2. You''ll also need to connect to the GND, which is pin 6.
    You''ll use pin 16 as an output trigger pin and pin 18 (GPIO24) as an input to
    time the echo from the sonar sensor.'
  merge: -1
  img_proc: true
- pgno: 536
  md: '# Avoiding Obstacles Using Sensors


    2. Now that you know the pins you''ll connect to, you can connect the sonar sensor.
    There is a problem, as you can''t connect the 5 volt return from the sonar sensor
    directly to the Raspberry Pi GPIO pins; they want 3.3 volts. You''ll need to build
    a voltage divider that will reduce the 5 volts to 3.3 volts. This can be done
    with two resistors, which are connected as shown in this diagram:


