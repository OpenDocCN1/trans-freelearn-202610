- pgno: 429
  md: '# # Putting It All Together


    Over the past eight chapters, we''ve explored the elements and concepts of a full-featured
    home security system that you''d expect to have installed in your property. It''s
    been presented in a modular fashion so that you can choose which features you
    want for your system, to allow you to make it as compact and basic or large and
    complex as you require.


    Fundamentally, the idea behind a home security system is to detect whether particular
    zone inputs are triggered high or low by an external sensor, be that a switch,
    motion detector, or water detector. At the end of the day, as far as the control
    software is concerned, the type of sensor is irrelevant and the system software''s
    job is to simply check the state of its inputs and alert accordingly.


    In this final chapter, we''re going to put all of the concepts together to come
    up with a security system framework and write the control scripts around it. This
    is what we will cover:


    +   - Defining a high-level overview of our system, detailing the connected elements

    +   - Building the entire modular security system framework control script, exploring
    the code in detail

    +   - Delving into some detailed shell scripting techniques to perform certain
    tasks

    +   - Learning how to make our system automatically start at boot-time

    +   - Preventing the burning out of our SD card by creating a RAM-based file system


    # ## Alarm system diagram


    So that we don''t get lost in this process, the first thing I recommend is to
    come up with a complete system diagram that we can follow. I do this for any system
    I design and put together so that it can be built in a structured way, and easily
    documented and modified.'
  merge: -1
  img_proc: true
- pgno: 430
