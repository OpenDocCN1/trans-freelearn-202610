  img_proc: true
- pgno: 204
  md: "Then, run the following command:\n\n```\nmpiexec -n 1 hostname\n```\n\nIf the\
    \ preceding command returns Pi1, or whatever you set your hostname to be, then\
    \ our MPICH installation is successful and we can proceed to the next step.\n\n\
    We will now look at a short C program that uses MPICH. This is given as follows:\n\
    \n```\n#include \"mpi.h\"\n#include <stdio.h>\n\nvoid main(int argc, char *argv[])\
    \ {\n    int rank, size\n    MPI_Init(argc, argv);\n    MPI_Comm_rank( MPI_COMM_WORLD,\
    \ &rank);\n    MPI_Comm_size( MPI_COMM_WORLD, &size);\n    printf(\"I have %d\
    \ rank and %d size \\n\", rank, size);\n    MPI_Finalize();\n}\n```\n\nThis program\
    \ runs on a single node and discovers the total number of nodes in a network.\
    \ It then communicates with the MPI processes on other nodes and finds out its\
    \ own rank.\n\nThe MPI_Init() function initiates the MPICH process on our computer\
    \ according to the given information about the IP addresses in a network. The\
    \ MPI_Comm_rank() function and the MPI_Comm_size() function get the rank of the\
    \ current process and the total size of the network and save them in rank and\
    \ size variables, respectively. The MPI_Finalize() function is nothing but an\
    \ exit routine that ends the MPI process cleanly.\n\nOn its own, MPICH can be\
    \ run using C and Fortran languages. But that might be a hindrance for a lot of\
    \ users. But fret not! We can use MPICH in Python by installing the Python API\
    \ called MPI4PY.\n\n# Installing MPI4PY\n\nThe conventional way of installing\
    \ the mpi4py module from a package manager such as apt-get or aptitude does not\
    \ work because it tries to install the openMPI library along with it, which conflicts\
    \ with the existing installation of MPICH."
  merge: -1
  img_proc: true
