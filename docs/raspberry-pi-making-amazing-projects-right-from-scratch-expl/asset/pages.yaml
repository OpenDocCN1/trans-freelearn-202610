    +   ```


    > Replace disk2 with your own SD card


    > To know more about the mpi4py library and to have a look at the various demos,
    you can visit the official Git repository on BitBucket at https://bitbucket.org/mpi4py/mpi4py.


    # Setting up the Raspberry Pi cluster


