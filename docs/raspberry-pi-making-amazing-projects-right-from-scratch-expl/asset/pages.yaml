- pgno: 63
  md: '# # Building Games

    # with PyGame


    In the previous chapter, we learned how to get started with Minecraft on Raspberry
    Pi and how to play it and use Python to manipulate things. Continuing with the
    same theme, we will now take a look at a gaming library in Python called PyGame
    and also learn how to create simple games with it. In this chapter, we will go
    through the following topics:


    +   - Introducing PyGame

    +   - Drawing a fractal tree

    +   - Building a simple snake game


    # ## Introducing PyGame


    PyGame is a set of Python modules designed for the writing of video games. It
    is built on top of the existing **Simple DirectMedia (SDL)** library, and it works
    with multiple backends, such as OpenGL, DirectX, X11, and so on. It was built
    with the intention of making game programming easier and faster without getting
    into the low-level C code that was traditionally used to achieve good real-time
    performance. It is also very flexible and comes with many operating systems. It
    is very fast as it can use multiple core CPUs very easily and also use optimized
    C and assembly code for core functions.'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'PyGame was built to replace PySDL after its development was discontinued. Originally
    written by Pete Shinners, it is a community project from 2004 and is released
    under the open source free software GNU''s lesser general public license. Since
    it is very simple to use and is open source, it has a lot of members in the international
    community and so it enjoys access to a lot of resources that other libraries may
    lack. There are many tutorials that can build different games with PyGame. It
    contains the following modules


    | Module | The description |

    |---|---|

    | cdrom | Manages CD-ROM devices and audio playback |

    | cursors | Loads cursor images and includes standard cursors |

    | display | Controls the display window or screen |

    | draw | Draws simple shapes onto a surface |

    | event | Manages events and the event queue |

    | font | Creates and renders Truetype fonts |

    | image | Saves and loads images |

    | joystick | Manages joystick devices |

    | key | Manages the keyboard |

    | mouse | Manages the mouse |

    | movie | Used for the playback of MPEG movies |

    | sndarray | Manipulates sounds with Numeric |

    | surfarray | Manipulates images with Numeric |

    | time | Controls timing |

    | transform | Scales, rotates, and flips images |


    > For more information on the PyGame library, you can visit www.pygame.org.


    # Installing PyGame


    PyGame usually comes installed with the latest Raspbian distribution, but if it
    isn''t you can use the following command to install it:


    ```

    sudo apt-get install python-pygame

    ```'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'Test your installation by opening a Python terminal by entering python in a
    regular terminal and pressing *Enter*. Now, execute the following command:


    ```

    import pygame

    ```


    Now that you have your system set up and you have hopefully checked out the PyGame
    website to explore its complete functionalities, we will move on to build the
    binary fractal tree to introduce you to the workings of PyGame. Let''s begin!


    # # Drawing a binary fractal tree


    A binary fractal tree is defined recursively by binary branching. Typically, it
    consists of a trunk of length 1, which splits into two branches of decreasing
    or equal length, each of which makes an angle Q with the direction of the trunk.
    Furthermore, both of these branches are divided into two branches, each making
    an angle Q with the direction of its parent branch, and so on. Continuing in this
    way, we can infinitely make branches, and the collective diagram is called a **fractal
    tree**. The following diagram visually shows what such a fractal tree might look
    like:


    ![](img/631e8b200cce187082ee46b0eb1681b3_65_0.png)'
  merge: -1
  img_proc: true
- pgno: 66
  md: "Now, let's move on to the code and take a look at how such a fractal tree can\
    \ be constructed with PyGame. Following this paragraph is the complete code, and\
    \ we will go through it statement by statement in further paragraphs:\n\n```\n\
    import pygame\nimport math\nimport random\nimport time\n\nwidth = 800\nheight\
    \ = 600\n\npygame.init()\nwindow = pygame.display.set_mode((width, height))\n\
    pygame.display.set_caption(\"Fractal Tree\")\nscreen = pygame.display.get_surface()\n\
    \ndef Fractal_Tree(x1, y1, theta, depth):\n    if depth:\n        rand_length=random.randint(1,10)\n\
    \        rand_angle=random.randint(10,20)\n        x2 = x1 + int(math.cos(math.radians(theta))\
    \ * depth * rand_length)\n        y2 = y1 + int(math.sin(math.radians(theta))\
    \ * depth * rand_length)\n        if ( depth < 5 ):\n            clr = ( 0 , 255\
    \ , 0 )\n        else:\n            clr = ( 255, 255 , 255 )\n        pygame.draw.line(screen,\
    \ clr , (x1, y1), (x2, y2), 2)\n        Fractal_Tree(x2, y2, theta - rand_angle,\
    \ depth - 1)\n        Fractal_Tree(x2, y2, theta + rand_angle, depth - 1)\n\n\
    Fractal_Tree( (width/2), (height-10) , -90, 12)\npygame.display.flip()\n\nwhile\
    \ True:\n    for event in pygame.event.get():\n        if event.type == pygame.QUIT\
    \ or event.type == pygame.KEYDOWN:\n            pygame.quit()\n            exit(0)\n\
    ```"
  merge: -1
  img_proc: true
