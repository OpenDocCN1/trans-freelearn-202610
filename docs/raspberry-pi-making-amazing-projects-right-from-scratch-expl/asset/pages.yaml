- pgno: 345
  md: "On our home security system, we are going to assign all of the pins on BUS\
    \ A as inputs for connecting our sensors to it. To do this, we use the following\
    \ command:\n\n```\n$ sudo i2cset -y 1 0x20 0x00 0xFF\n```\n\n> What does this\
    \ command mean?\n> \n> - `-y`: This runs the command without user interaction.\n\
    > - `1`: This is the ID of the bus (for example, `i2c-1`).\n> - `0x20`: This is\
    \ the address of the chip.\n> - `0x00`: This is the data register on the chip\
    \ (in this case, the PORT A pin assignment).\n> - `0xFF`: This is the value loaded\
    \ into the data register (in this case, all pins are inputs—binary `%11111111`).\n\
    \nYou can check that the data register has been set correctly by reading it using\
    \ the following:\n\n```\n$ sudo i2cget -y 1 0x20 0x00\n```\n\nThis should return\
    \ a value of `0xFF`, which is the value we set earlier.\n\n# Connecting our magnetic\
    \ contact sensor\n\nNow that we've got our port expander working with the Raspberry\
    \ Pi, we can start connecting things to it and create the scripts that will monitor\
    \ the sensors on the input pins.\n\nLet's go back to our port expander stripboard\
    \ that was built in the previous chapter and connect our magnetic sensor. But\
    \ first, we need to ensure that all of our inputs are pulled low by default using\
    \ 10Kohm resistors. This prevents them from being in a floating state and giving\
    \ us spurious data when we read the port's data.\n\n> In the following diagram,\
    \ I've connected the pull-down resistors externally, but you may want to include\
    \ them directly on the stripboard. Toward the end of this book, we'll have a new\
    \ board layout that brings everything that we've been prototyping so far together\
    \ in a single solution.\n\nTo check the port's input value, we use the `i2cget`\
    \ command:\n\n```\n$ sudo i2cget -y 1 0x20 0x12\n```\n\nThis should return `0x00`,\
    \ which means all inputs are off (binary `%00000000`)."
  merge: -1
  img_proc: true
- pgno: 346
  md: 'What does this command mean?


    +   - -y: This runs the command without user interaction.

    +   - 1: This is the ID of the bus (for example i2c-1).

    +   - 0x20: This is the address of the chip.

    +   - 0x12: This is the data register on the chip (in this case, the PORT A read
    value).


    Now let''s connect one side of our magnetic sensor''s reed switch to data pin
    0 of BUS A (which we''ll call GPA0 for reference), and the other side to our +3.3V
    line. By default, the switch is normally open (NO), which means that the input
    is still pulled low by the resistor.


    But when you move the accompanying magnet near to the sensor switch (for example,
    if the door is closed), the switch will close, pulling the input high to the +3.3V
    line. If you read the port''s input value now, by running the same command, you
    should see that it returns 0x01, indicating that the first bit is high (binary
    %00000001).


    ![](img/631e8b200cce187082ee46b0eb1681b3_346_0.png)'
  merge: -1
  img_proc: true
- pgno: 347
  md: "# Monitoring the sensor\n\nNow that we have everything in place and our magnetic\
    \ sensor is detecting whether the door is closed, we can monitor this sensor with\
    \ a simple Bash script that uses the I2C tool commands that we installed earlier.\n\
    \nThe code listing for poll-magnetic-switch.sh is as follows:\n\n```\n#!/bin/bash\n\
    sudo i2cset -y 1 0x20 0x00 0xFF\n\n# loop forever\nwhile true\ndo\n  # read the\
    \ sensor state\n  SWITCH=$(sudo i2cget -y 1 0x20 0x12)\n\n  if [ $SWITCH == \"\
    0x01\" ]\n  then\n    #contact closed so wait for a second\n    echo \"The door\
    \ is closed!\"\n    sleep 1\n  else\n    #contact was opened\n    echo \"The door\
    \ is open!\"\n  fi\ndone\n```\n\nWhen you run the script and then push the button,\
    \ you should see \"The door is open!\" scrolling up the console screen until you\
    \ stop pressing it.\n\nBy combining this with our elaborate light switch project\
    \ in chapter 2, we can switch on the LED connected to GPIO17 when the door is\
    \ opened:\n\n```\n#!/bin/bash\n\n#set up the LED GPIO pin\nsudo echo 17 > /sys/class/gpio/export\n\
    sudo echo out > /sys/class/gpio/gpio17/direction\n\n#set up port expander\nsudo\
    \ i2cset -y 1 0x20 0x00 0xFF\n```"
  merge: -1
  img_proc: true
- pgno: 348
  md: "```\n# loop forever\nwhile true\ndo\n    # read the sensor state\n    SWITCH=$(sudo\
    \ i2cget -y 1 0x20 0x12)\n\n    if [ $SWITCH == \"0x01\" ]\n    then\n       \
    \ #switch not pushed so turn off LED pin\n        sudo echo 0 > /sys/class/gpio/gpio17/value\n\
    \    else\n        #switch was pushed so turn on LED pin\n        sudo echo 1\
    \ > /sys/class/gpio/gpio17/value\n    fi\n    #short delay\n    sleep 0.5\ndone\n\
    ```\n\n> Later, as we add more sensors to different input pins, we will need to\
    \ be able to detect which one has been triggered. We'll look at writing a Bash\
    \ function later in the book, which will parse the returned hex value from the\
    \ i2cget command, and tell us exactly which of the 8 inputs is high.\n\n# Anti-tamper\
    \ circuits\n\nIf you take a closer look at our system, you might realize that\
    \ depending on whether you are detecting normally open or normally closed sensor\
    \ switches, it is possible to tamper with the sensor channel by simply cutting\
    \ the wire. So, in the case of a normally open switch, it wouldn't activate the\
    \ monitoring system if the wires were cut, as it would always appear to be open,\
    \ even if the switch was closed.\n\nTo mitigate this, most alarm systems feature\
    \ a 4-core wiring system to connect the sensor devices to the main control board\
    \ — two cores are used to connect the sensor and two are used to create an anti-tamper\
    \ loop, which then itself forms a sensor input for monitoring."
  merge: -1
  img_proc: true
- pgno: 349
  md: '![](img/631e8b200cce187082ee46b0eb1681b3_349_0.png)


    4-core alarm cable


    Take a look at the following circuit so that you see what I mean:


    ![](img/631e8b200cce187082ee46b0eb1681b3_349_1.png)'
