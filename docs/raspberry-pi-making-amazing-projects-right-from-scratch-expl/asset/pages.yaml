  md: 'However, the recently launched Raspberry Pi 2 is based on ARM Cortex A7, which
    is capable of running Windows 10 and Ubuntu (Snappy Core). The following operating
    systems are officially supported by all the models of Raspberry Pi and are available
    for download at the download page:


    +   - Raspbian: We will be using this with Raspberry Pi throughout the book

    +   - OpenELEC

    +   - Pidora (Fedora Remix)

    +   - RASPＢMC

    +   - RISC OS


    > Windows 10 and Ubuntu are only supported by the recently launched Pi 2.


    # Raspbian


    Raspbian is an unofficial variant of Debian armhf (ARM Hard Float) compiled for
    *hard float* code that will run on Raspberry Pi computers. It is a free operating
    system based on Debian optimized for the Raspberry Pi hardware.


    > To know more about Raspbian, visit `http://www.raspbian.org/`.


    # Setting up the Raspberry Pi


    We need the following hardware to set up a Pi.


    +   - Raspberry Pi 2 Model B (hereafter, this will be referred only as Pi).

    +   - Power Supply: A micro USB power supply.'
