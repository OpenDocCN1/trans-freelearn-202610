    Here, the first argument to the program, 200, gives the number of bodies to be
    simulated. The second argument gives the speed of the simulation. The higher the
    number, the higher the speed. The third argument gives the amount of time to run
    the simulation in milliseconds. So, in the preceding command, we will simulate
    200 bodies for 10 seconds. Obviously, we can experiment with different variables
    and see how these variables affect the simulation.


    The preceding example was running on a single Raspberry Pi. But as promised, we
    will now see how to run it on a cluster. It will probably be surprising if we
    learn that the program can run on a cluster of Raspberry Pi devices with a single
    command and one that we''ve seen before. The following command does the trick:


    ```

    `mpiexec -f ~/machinefile -n 3 ./GalaxSee`

    ```'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'In the preceding command, mpiexec initiates the MPI process on our host computer.
    Here, we will give it three points of data on which to execute the GalaxSee program.
    These are as follows:


    +   - The path to the file containing the IP addresses for each device in the
    network

    +   - The number of devices to be used

    +   - The path to the executable file


    The -f option specifies the machinefile. The -n option specifies the number of
    devices to be used, and finally, we give the GalaxSee executable file to it.


    Try it for yourself! If you try to increase the number of bodies in the simulation
    on a single Raspberry Pi, it would probably run slower. But if you try the same
    on a cluster, it will definitely run faster because now, we have a lot more computational
    resources at our disposal.


    # Summary


    This chapter was unique in the sense that we learned how to execute software not
    on a single Raspberry Pi but on multiple ones. We learned the advantages of using
    parallel computation and learned how to build our own network of clustered Raspberry
    Pi devices. We also learned how to install the libraries required for parallel
    computations so that we can run our own software in the cluster. We learned how
    to configure the Raspberry Pis in our network to communicate with each other and
    make the communication hassle-free. Once we set up a system, we tested it to to
    measure the response in the form of latency.


    Finally, we learned about the concept of N-body simulation and configured an open
    source program to simulate it. W also saw how increasing the number of bodies
    in the simulation could affect the speed of the program''s execution.


    In the next chapter, we will expand upon this knowledge about clusters and learn
    about advanced networking concepts, such as DNS and DHCP. We will learn how to
    add functionalities such as a domain name service and auto detection of nodes
    and how to initiate a remote shutdown of the cluster.'
  merge: -1
  img_proc: true
- pgno: 218
  md: <!-- no content -->
  merge: -1
