- pgno: 77
  md: '# # Working with a Webcam and Pi Camera


    In the previous chapter, we learned how to set up and write our own games using
    pygame. In this chapter, we will learn how to use different types and uses of
    cameras with our Pi. Let''s take a look at the topics we will study and implement
    in this chapter:


    +   - Working with a webcam

    +   - Crontab

    +   - Timelapse using a webcam

    +   - Webcam video recording and playback

    +   - Pi Camera and Pi NoIR comparison

    +   - Timelapse using Pi Camera

    +   - The PiCamera module in Python


    # ## Working with webcams


    USB webcams are a great way to capture images and videos. Raspberry Pi supports
    common USB webcams.


    > > To be on the safe side, here is a list of the webcams supported by Pi:

    > > http://elinux.org/RPi_USB_Webcams.'
  merge: -1
  img_proc: true
