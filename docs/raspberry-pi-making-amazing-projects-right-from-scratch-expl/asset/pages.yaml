    is located as a shortcut on the taskbar. Alternately, we can find it by navigating
    to **Menu | Accessories | Terminal**. We can start Python in interactive mode
    by typing python in the prompt and then pressing the *Enter* key. It will take
    us to the Python interactive shell, as follows:'
