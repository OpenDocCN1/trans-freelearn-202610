- pgno: 369
  md: '# 6

    Adding Cameras to Our Security System


    Until now, we''ve been putting together the elements that will allow us to connect
    sensors to our alarm system to detect intrusions using either switches or passive
    infra-red motion detectors, which in turn will tell our Raspberry Pi that something
    has happened in a particular zone. These elements will all come together as a
    whole system later in this book.


    Our system is now going to become a whole lot more sophisticated with the addition
    of cameras to take pictures and video clips, and e-mail them to us straightaway
    when it detects something.


    We''ll also use e-mail to send us alerts on our smart phone when we''re out and
    about when any of the sensors in the system are triggered.


    In this chapter we will cover the following topics:


    +   - Setting up the Raspberry Pi camera module and learning how to capture stills
    and video images

    +   - Learning how to overlay captured images with text and time-stamps

    +   - Triggering image captures with a motion detector

    +   - E-mailing the image and video files to us in real time

    +   - Understanding the differences between capturing images during the day and
    during the night

    +   - Switching on and off security lighting and other high-current devices when
    required

    +   - Connecting a USB webcam instead of the native camera module'
  merge: -1
  img_proc: true
- pgno: 370
  md: '# Prerequisites


    You''ll need the following parts for this chapter, on top of the components used
    in the previous chapter:


    +   - A Raspberry Pi standard camera module

    +   - A Raspberry Pi NoIR camera module

    +   - An Infra-Red LED array and/or visible LED array

    +   - A USB webcam


    # The Raspberry Pi camera module


    The Raspberry Pi Camera Module is an official Raspberry Pi accessory that works
    with all models of the Pi, and can be used to take high-definition stills and
    video images. It connects directly to the Pi board''s camera serial interface
    (CSI) port, which is dedicated to these modules to enable high-speed operation.


    The camera itself is a 5 megapixel fixed-focus sensor supporting 1080p, 720p,
    and VGA video modes and still captures.


    ![](img/631e8b200cce187082ee46b0eb1681b3_370_0.png)


    The official Raspberry Pi Camera Module'
  merge: -1
  img_proc: true
