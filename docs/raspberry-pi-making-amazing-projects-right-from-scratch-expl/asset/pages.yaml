- pgno: 257
  md: "# Creating a TCP socket\n\nHere is an example of creating a TCP socket:\n\n\
    ```\nimport socket    #for sockets\n\ncreate an AF_INET, STREAM socket (TCP)\n\
    s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)\n\nprint 'Socket Created'\n\
    ```\n\nThe socket.socket() function creates a socket and returns a socket descriptor,\
    \ which can be used in other socket-related functions.\n\nThis code will create\
    \ a socket with the following properties:\n\n+   - Address family: AF_INET (this\
    \ is for IP version 4, or IPv4)\n+   - Type: SOCK_STREAM (this specifies a connection-oriented\
    \ protocol, that is, TCP)\n\nIf any of the socket functions fail, then Python\
    \ throws an exception called socket.error, which must be caught as follows:\n\n\
    ```\nimport socket    #for sockets\nimport sys    for exit\n\ntry:\n    create\
    \ an AF_INET, STREAM socket (TCP)\n    s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)\n\
    except socket.error, msg:\n    print 'Failed to create socket. Error code: ' +\
    \ str(msg[0]) + ' , Error message : ' + msg[1]\n    sys.exit();\n\nprint 'Socket\
    \ Created'\n```\n\nIn this way, we have created a TCP socket successfully. We\
    \ can connect to a server, for example, https://www.google.com, using this socket.\n\
    \n# Connecting to a server with a TCP socket\n\nWe can connect to a remote server\
    \ on a certain port number. We need two things for this: the IP address of the\
    \ remote server we are connecting to and a port number to connect to. We will\
    \ use the IP address of https://www.google.com as a sample in the following code."
  merge: -1
  img_proc: true
- pgno: 258
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 259
  md: "```\nhost = 'www.google.com'\nport = 80\n\ntry:\n        remote_ip = socket.gethostbyname(\
    \ host )\n\nexcept socket.gaierror:\n        could not resolve\n        print\
    \ 'Hostname could not be resolved. Exiting'\n        sys.exit()\n\nprint 'Ip address\
    \ of ' + host + ' is ' + remote_ip\n\nConnect to remote server\ns.connect((remote_ip\
    \ , port))\n\nprint 'Socket Connected to ' + host + ' on ip ' + remote_ip\n```\n\
    \nRun the program and notice that its output in the terminal is as follows:\n\n\
    ```\npi@raspberrypi ~/book/chapter14 $ python prog4.py\nSocket Created\nIp address\
    \ of www.google.com is 74.125.236.83\nSocket Connected to www.google.com on ip\
    \ 74.125.236.83\n```\n\nIt creates a TCP socket and then connects to a remote\
    \ host. If we try connecting to a port different from port 80, then we should\
    \ not be able to connect, which indicates that the port is not open for any connections.\
    \ This logic can be used to build a port scanner.\n\n> The concept of *connections*\
    \ applies to SOCK_STREAM/TCP type of sockets. A connection means an explicit or\
    \ reliable stream or pipeline of data such that there can be multiple such streams\
    \ and each can have communication of its own. Think of this as a pipe that is\
    \ not interfered with by data from other pipes. Another important property of\
    \ stream connections is that the packets have an order or sequence; hence, they\
    \ are always sent, arrive, and are processed in order.\n> \n> Other sockets, such\
    \ as UDP, ICMP, and ARP, don't have the concept of an explicit *connection* or\
    \ pipeline. These are connectionless communications, as we have seen with an example\
    \ in the case of UDP. This means that we keep sending or receiving packets from\
    \ anybody and everybody."
  merge: -1
  img_proc: true
- pgno: 260
  md: "# Network Programming in Python with the Pi\n\nThe `sendall()` function will\
    \ send all the data. Let's send some data to `https://www.google.com`. The code\
