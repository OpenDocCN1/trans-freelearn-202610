- pgno: 37
  md: "+   3. Make sure that your Raspberry Pi is connected to the Internet by typing\
    \ the following command:\n+   \n+      `ping -c4 www.google.com`\n\n+   4. apt\
    \ (Advanced Package Tool) is the utility used to install and remove software in\
    \ Debian and its variants. We need to use it to update our Pi software.\n\n+ \
    \  5. Run the following commands in a sequence:\n+   \n+      - `sudo apt-get\
    \ update`: This command synchronizes the package list from the source. Indexes\
    \ of all the packages are refreshed. This command must be issued before we issue\
    \ the upgrade command.\n+   \n+      - `sudo apt-get upgrade`: This command will\
    \ install the newest versions of all the already installed software. Any obsolete\
    \ packages/utilities are not removed automatically. If any software is in its\
    \ newest version, then it's left as it is.\n+   \n+      - `sudo rpi-update`:\
    \ This command is used to upgrade the firmware. The kernel and firmware are installed\
    \ as a Debian package, and so they will also get updates. These packages are updated\
    \ infrequently after extensive testing.\n+   \n+      - `sudo reboot`: This will\
    \ reboot the computer.\n\n# # Getting started with Python\n\nPython is a high-level\
    \ general-purpose programming language. It supports multiple programming paradigms,\
    \ such as object-oriented programming, imperative programming, functional programming,\
    \ procedural programming, aspect-oriented programming, and metaprogramming. It\
    \ has a dynamic type system, automatic memory management, and a large standard\
    \ library to carry out various tasks. It emphasizes code readability, and its\
    \ syntax allows you to carry out tasks in fewer lines of code than other programming\
    \ languages, such as C or C++.\n\nPython was conceived and implemented by Guido\
    \ van Rossum at CWI in the Netherlands as a successor to the ABC language, capable\
    \ of exception handling and interfacing with the Amoeba operating system platform.\
    \ Van Rossum is Python's principal author, and he continues to have the central\
    \ role in deciding the direction of Python. He has been endowed with the title\
    \ **benevolent dictator for life (BDFL)** by the worldwide Python community."
  merge: -1
  img_proc: true
