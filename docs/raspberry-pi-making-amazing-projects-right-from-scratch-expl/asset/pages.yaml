- pgno: 149
  md: '# # Creating Your Own Motion Detection and Tracking System


    In the previous chapter, we studied the basics of the OpenCV library. We set up
    our Pi for OpenCV programming with Python and implemented a simple project to
    track an object based on the color in OpenCV with a live webcam feed. In this
    chapter, we will learn about some more advanced concepts and implement one more
    project based on OpenCV. In this chapter, we will learn about the following topics:


    +   - Thresholding

    +   - Noise reduction

    +   - Morphological operations on images

    +   - Contours in OpenCV

    +   - Real-time motion detection and tracking


    # ## Thresholding images


    **Thresholding** is a way to segment images. Although thresholding methods and
    algorithms are available for colored images, it works best on grayscale images.
    Thresholding usually (but not always) converts grayscale images into binary images
    (in a binary image, each pixel can have only one of the two possible values: white
    or black). Thresholding the image is usually the first step in many image processing
    applications.'
  merge: -1
  img_proc: true
- pgno: 150
  md: "# Creating Your Own Motion Detection and Tracking System\n\nThe way thresholding\
    \ works is very simple. We define a threshold value. For a pixel in a grayscale\
    \ image, if the value of grayscale intensity is greater than the threshold, then\
    \ we assign a value to the pixel (for example, white); otherwise, we assign a\
    \ black value to the pixel. This is the simplest form of thresholding. Also, there\
    \ are many other variations of this method, which we will look at now.\n\nIn OpenCV,\
    \ the `cv2.threshold()` function is used to threshold images. Its input includes\
    \ grayscale image, threshold values, maxVal, and threshold methods as parameters\
    \ and returns the thresholded image as the output. maxVal is the value assigned\
    \ to the pixel if the pixel intensity is greater (or lesser in some methods) than\
    \ the threshold. There are many threshold methods available in OpenCV; in the\
    \ beginning, the simplest form of thresholding we saw was `cv2.THRESH_BINARY`.\
    \ Let's look at the mathematical representation of some of the threshold methods.\n\
    \nSay (x,y) is the input pixel; then, operations for threshold methods will be\
    \ as follows:\n\n+   - `cv2.THRESH_BINARY`  \n+     If intensity(x,y) > threshold,\
    \ then set intensity(x,y)=maxVal; else, set intensity(x,y) = 0\n+   \n+   - `cv2.THRESH_BINARY_INV`\
    \  \n+     If intensity(x,y) > threshold, then set intensity(x,y)=0; else, set\
    \ intensity(x,y) = maxVal\n+   \n+   - `cv2.THRESH_TRUNC`  \n+     If intensity(x,y)\
    \ > threshold, then set intensity(x,y)=threshold; else, leave intensity(x,y) as\
    \ it is\n+   \n+   - `cv2.THRESH_TOZERO`  \n+     If intensity(x,y) > threshold,\
    \ then leave intensity(x,y) as it is; else, set intensity(x,y) = 0\n+   \n+  \
    \ - `cv2.THRESH_TOZERO_INV`  \n+     If intensity(x,y) > threshold, then set intensity(x,y)=0;\
    \ else, leave intensity(x,y) as it is\n\nThe demonstration of the threshold functionality\
    \ usually works best on grayscale images with a gradually increasing gradient.\
    \ In the following example, we are setting the value of the threshold as 127,\
    \ so the image is segmented in two sets of pixels depending on the value of their\
    \ intensity:\n\n```\nimport cv2\nimport matplotlib.pyplot as plt\n```"
  merge: -1
  img_proc: true
- pgno: 151
  md: "```\n```python\nimg = cv2.imread('gray21.512.tiff',0)\nth=127\nmax_val=255\n\
    ret,o1 = cv2.threshold(img,th,max_val,cv2.THRESH_BINARY)\nret,o2 = cv2.threshold(img,th,max_val,cv2.THRESH_BINARY_INV)\n\
    ret,o3 = cv2.threshold(img,th,max_val,cv2.THRESH_TOZERO)\nret,o4 = cv2.threshold(img,th,max_val,cv2.THRESH_TOZERO_INV)\n\
    ret,o5 = cv2.threshold(img,th,max_val,cv2.THRESH_TRUNC)\n\ntitles = ['Input Image','BINARY','BINARY_INV','TOZERO',\n\
