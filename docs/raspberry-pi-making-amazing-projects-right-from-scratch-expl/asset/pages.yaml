- pgno: 101
  md: '# # Using PiGlow


    PiGlow has a set of female GPIO railings, which cover the Raspberry Pi''s male
    GPIO rails. In case of Raspberry Pi 2 and B+, the size of the railing in PiGlow
    is shorter, so we need to make sure that PiGlow is attached to only lower numbered
    pins on the Raspberry Pi.


    > You can find out more about PiGlow on the Pimoroni website at

    > https://shop.pimoroni.com/products/piglow.


    We can now proceed to control the LEDs on the PiGlow board. Open up a Python terminal
    and execute the following statements in a sequential order:


    ```

    ```python

    import piglow

    piglow.red(64)

    ```

    ```


    Here, we import the particular library in Python first. The `red()` method selects
    all the red LEDs on the PiGlow board. It takes only one argument, the intensity
    of the LEDs, which can be a number from 0 to 255. You can also try to pass the
    number 255 to the `red()` method to see how it affects the intensity of the LED.
    In this case, passing 0 would mean that the LED is off. But once we execute the
    earlier two statements, nothing will happen. We have to update the PiGlow with
    our changes by issuing the following command:


    ```

    ```python

    piglow.show()

    ```

    ```


    Why? Because if we are setting up a pattern, lighting the LED costs time and resources.
    However, we can use the show method to draw the changes instantaneously. If you
    find this strange, you can turn this off by turning auto-update on with the following
    command:


    ```

    ```python

    piglow.auto_update = True

    ```

    ```


    Similar to the `red()` method used earlier, we also have functions to control
    different colors, namely white, blue, green, yellow, and orange.


    But maybe we want to control each arm of the light rather than all the lights
    of a single color. Well, we can do that with the `arm()` function! Take a look:


    ```

    ```python

    piglow.arm(0, 128)

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 102
  md: "The arm function takes two arguments. The first is the number of the arm, and\
    \ second is the intensity from 0 to 255. For example, in the earlier statement,\
    \ we set the LEDs of the first arm to an intensity of value 128, which is half\
    \ of the full level of brightness. Suppose we want to control arbitrary LEDs according\
    \ to what we specify. We're in luck! The set() function lets us control individual\
    \ LEDs. It can be used in the following ways:\n\n+   - `set(0, 255)`: This sets\
    \ LED 0 to full brightness\n+   - `set([1, 3, 5], 200)`: This sets LEDs 1, 3,\
    \ and 5 to a 200 level of brightness\n+   - `set(0, [255, 255, 255])`: This sets\
    \ three LEDs starting at 0 index to full brightness\n\nNow that we have learned\
    \ the basics of using PiGlow, we will move on to building real-life examples with\
    \ it. First, we will build a very simple example that looks like the arms of PiGlow\
    \ are like cycle's spokes. Cool, right? The code is given here, and an explanation\
    \ is as follows:\n\n```\nimport time\nimport piglow\n\ni = 0\n\nwhile True:\n\
    \    print(i)\npiglow.all(0)\npiglow.set(i % 18, [15, 31, 63, 127, 255, 127, 63,\
    \ 31, 15])\npiglow.show()\ni += 1\ntime.sleep(0.1)\n```\n\nNow save the program\
    \ as prog1.py and run it with the following command:\n\n```\npython prog1.py\n\
    ```\n\nAs with every Python program, we first import the dependencies required,\
    \ which in this case are the time library and the PiGlow library we just installed.\
    \ Next, we set up the counter to keep track of which LED we want to light up and\
    \ to execute the bulk of the program we enter into an infinite while loop. This\
    \ while loop will continue lighting the LEDs until we kill the program."
  merge: -1
  img_proc: true
- pgno: 103
  md: 'First, we print the status of the counter, and then we execute the all() function,
    which will refresh all the LEDs and ensure that they are turned off at the beginning.
    We then use the third form of the set() function we saw earlier. This means that
    starting from the zeroᵗʰ LED, we light up nine LEDs in an ascending and then descending
    fashion. The i % 18 will give the remainder of i divided by 18 so that the index
    of the LED remains within the range of 0 to 18 at all times. Then, we actually
    show the pattern that we set in the earlier statement via the show() function.
    Finally, we increment the counter and add a delay of 100 milliseconds.


    This pattern gets repeated for every LED, and when done in quick succession, it
    appears like the spokes are cycling.


    This was a very basic example, and now we''re ready to move on to a more complicated
    one, which involves building a binary clock. Let''s begin!


    # Building a binary clock


    In this example, we will be building a binary clock using the club PiGlow in which
    each hour, minute, and second is represented by the three arms of PiGlow. The
    numbers are displayed in the binary format. We will now look at the code and learn
    what each part does:


    ```

    import piglow

    from time import sleep

    from datetime import datetime


    piglow.auto_update = True


    show12hr = 1

    ledbrightness = 10


    piglow.all(0)


    hourcount = 0

    currenthour = 0

    ```'
  merge: -1
  img_proc: true
- pgno: 104
  md: "Like the previous example, we import PiGlow and the time libraries, but we\
    \ also import an additional library, datetime, which gives us the current time.\
    \ Then, we set the auto-update parameter to true so that PiGlow updates as soon\
    \ as we make a change to it rather than pushing all the changes at once. We will\
    \ now set some customization parameters, namely selecting between a 12-hour format\
    \ or a 24-hour format and the brightness of the LEDs. With that completed, we\
    \ refresh the LED to the 0 level and set the hour counters. Now we are ready to\
    \ move on the meat of the code:\n\n```\nwhile True:\n    time = datetime.now().time()\n\
    print(str(time))\nhour = time.hour\nmin = time.minute\nsec = time.second\n\nif\
    \ show12hr == 1:\n    if hour > 12:\n        hour = hour - 12\n\nif currenthour\
    \ != hour:\n    hourcount = hour\ncurrenthour = hour\n\nfor x in range(6):\n \
    \   piglow.led(13 + x, (hour & (1 << x)) * ledbrightness)\n\nfor x in range(6):\n\
    \    piglow.led(7 + x, (min & (1 << x)) * ledbrightness)\n\nfor x in range(6):\n\
    \    piglow.led(1 + x, (sec & (1 << x)) * ledbrightness)\n\nif hourcount != 0:\n\
    \    sleep(0.5)\npiglow.white(ledbrightness)\nsleep(0.5)\nhourcount = hourcount\
    \ - 1\nelse:\n    sleep(0.1)\n```\n\nThe main code logic is executed inside an\
    \ infinite while loop so that the program never stops."
  merge: -1
  img_proc: true
