- pgno: 141
  md: 'The `cv2.split()` method is used to split an image into three different intensity
    arrays for each color channel, whereas `cv2.merge()` is used to merge different
    arrays into a single multichannel array, that is, a color image. Let''s take a
    look at an example:


    ```

    ```python

    import cv2

    img = cv2.imread(''4.2.03.tiff'',1)

    b,g,r = cv2.split(img)

    cv2.imshow(''Blue Channel'',b)

    cv2.imshow(''Green Channel'',g)

    cv2.imshow(''Red Channel'',r)

    img=cv2.merge((b,g,r))

    cv2.imshow(''Merged Output'',img)

    cv2.waitKey(0)

    cv2.destroyAllWindows()

    ```

    ```


    The preceding program first splits the image into three channels (blue, green,
    and red) and then displays each one of them. The separate channels will only hold
    the intensity values of that color, and they will be essentially displayed as
    grayscale intensity images. Then, the program will merge all the channels back
    into an image and display it.


    # Negating an image


    In mathematical terms, the negative of an image is the inversion of colors. For
    a grayscale image, it is even simpler! The negative of a grayscale image is just
    the intensity inversion, which can be achieved by finding the complement of the
    intensity from 255. A pixel value ranges from 0 to 255 and, therefore, negation
    is the subtraction of the pixel value from the maximum value, that is, 255. The
    code for this is as follows:


    ```

    ```python

    import cv2

    img = cv2.imread(''4.2.07.tiff'')

    grayscale = cv2.cvtColor(img,cv2.COLOR_BGR2GRAY)

    negative = abs(255-grayscale)

    cv2.imshow(''Original'',img)

    cv2.imshow(''Grayscale'',grayscale)

    cv2.imshow(''Negative'',negative)

    cv2.waitKey(0)

    cv2.destroyAllWindows()

    ```

    ```


    > The negative of a negative will be the original grayscale image. Try this on
    your own by taking the image negative of a negative again.


    ![](img/631e8b200cce187082ee46b0eb1681b3_141_0.png)'
  merge: -1
  img_proc: true
