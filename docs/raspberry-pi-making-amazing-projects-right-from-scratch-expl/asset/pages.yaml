- pgno: 68
  md: 'The new tree looks considerably denser and more branched out than the original
    tree.


    Now, since you know what the output looks like, let''s grab our magnifying glasses
    and sift through the program to understand how it works!


    The first four lines are there to satisfy the dependencies required to build the
    program. These are PyGame, a math library, a library to generate random numbers,
    and a library to keep track of time for delay functions. Next, we specify the
    dimensions for the screen space required for our program.


    The pygame.init() method initializes all the modules that were loaded as part
    of importing pygame in the first statement. It is required to be executed if you
    want to be able use any functionality of PyGame. The display.set_mode() method
    creates a new Surface object, which represents the area on the screen that is
    visible to the user. It takes a tuple consisting of the dimensions of the window
    as the argument: the width and height variables in this case. It is literally
    the canvas on which you can draw. Anything you do to this object will be shown
    to the user. Images and other objects are represented as PyGame objects, and you
    can overlay them on the the main surface. Then, we set the title of the window
    using the caption() method, and finally, the screen variable actually gets the
    object that the display is stored in. So now, our canvas is stored in the screen
    variable, and we will use it to make any changes to the canvas.


    The Fractal_Tree function should be fairly easy to understand. It takes four arguments:
    the starting point of the branch (x1, y1), the angle of the branch with respect
    to the positive x axis — which is a horizontal line going to your right when you
    look at the computer screen, and the depth of the fractal tree (which indicates
    the levels in the tree). It is called for the first time in the 28th line with
    appropriate arguments. You might notice that towards the end of the function,
    it calls itself using different arguments. These kinds of function are called
    recursive functions and are very useful in tasks where there is repetition and
    where the same task needs to be performed with minor differences.


    If the depth is positive, it selects a random length and angle for the next branch
    by selecting a random integer from the randint() method of the random package.
    It then specifies the coordinates of the end of that branch, which are labeled
    x2 and y2. If the depth is less that 5, it selects the color of the line as green;
    otherwise, it is white. Here, it is important to understand that the color is
    represented in the RGB format. Hence, (0, 255, 0) means green. Similarly, (255,
    0, 0) will be red. The three numbers in the tuple represent the intensity of RGB
    colors; hence, we can select any color using a mixture of these three intensities.'
  merge: -1
  img_proc: true
- pgno: 69
  md: "Finally, there is a recursive call to itself (`Fractal_tree`), and the program\
    \ then draws the second level of the fractal tree and so on until the depth becomes\
    \ zero. There are two recursive calls: one to draw the left branch and the other\
    \ to draw the right branch. If you've noticed, the function isn't actually executed\
    \ until the 28th line. And once it is executed, the complete pattern is drawn\
    \ at once due to the recursiveness of the function, but it still isn't displayed.\
    \ The next line, `pygame.display.flip()`, is responsible for displaying the drawn\
    \ shapes on screen:\n\n```\nwhile True:\n    for event in pygame.event.get():\n\
    If event.type == pygame.QUIT or event.type == pygame.KEYDOWN:\n    pygame.quit()\n\
    \    exit(0)\n```\n\nThis block of code is there to ensure that PyGame quits properly\
    \ and specifies how to shut down the program. The `event.get()` method clears\
    \ the event queue so that you always get the last event that occurred. An event\
    \ queue consists of all the key presses and mouse clicks that happen, and they\
    \ are stored in a **Last In First Out (LIFO)** fashion. You will see this `while`\
    \ loop in almost every PyGame program as it handles the exit of the program properly.\
    \ If you are using IDLE, then not shutting down PyGame properly can cause it to\
    \ hang. In this case, PyGame quits when `pygame.quit()` is executed. Finally,\
    \ with `exit(0)`, Python also quits and closes the application.\n\nAs we are randomizing\
    \ the length and the angle every time the function calls itself, no two branches\
    \ will be exactly the same, giving it the appearance of the irregularity of real-life\
    \ trees. By induction, no two trees will be same.\n\nYou can modify parts of this\
    \ code to see for yourself how the tree behavior changes on changing a few variables,\
    \ such as `theta` and `depth`. Now that we have completed all the basics of PyGame\
    \ and can implement fairly complex problems, we are now ready to move on to a\
    \ real challenge: making an actual game.\n\n# Building a snake game\n\nWho doesn't\
    \ remember the classic game called Snake, which involves a snake chasing a morsel\
    \ of food? It is probably the very first game that you played as a child. The\
    \ basic premise of the game is that you control a snake and lead it to a morsel\
    \ of food. Every time the snake consumes that food, it grows by one unit length,\
    \ and if the snake hits a boundary wall or itself, it dies. Now as you can imagine,\
    \ the more you play the game, the longer the snake grows, which, consequently,\
    \ makes it more difficult to control the snake. In some versions of the game,\
    \ the speed of the snake also increases, making it even more difficult to control.\
    \ There comes a point where you simply run out of screen space and the snake inevitably\
    \ hits a wall or itself, and the game is over."
  merge: -1
  img_proc: true
- pgno: 70
  md: '# Building Games with PyGame


    Here, we will learn how to build such a game. The basic logic of playing the game
    will be to have a moving rectangle, of which we know the leading point coordinates.
    This will be our snake. It will be controlled by the four arrow keys. The piece
    of food is initialized randomly on the screen. At each point of time, we will
    check whether the rectangle has hit the boundary wall or itself since we know
    the position of the snake at every point of time. If it has, then the program
    will exit. Let''s now look at the code sectionwise; the code will be explained
    after each section:


    ```

    from pygame.locals import *

    import pygame

    import random

    import sys

    import time


    pygame.init()


    fpsClock = pygame.time.Clock()


    gameSurface = pygame.display.set_mode((800, 600))

    pygame.display.set_caption(''Pi Snake'')


    foodcolor = pygame.Color(0, 255, 0)

    backgroundcolor = pygame.Color(255, 255, 255)

    snakecolor = pygame.Color(0, 0, 0)

    textcolor = pygame.Color(255, 0, 0)


    snakePos = [120,240]

    snakeSeg = [[120,240],[120,220]]

    foodPosition = [400,300]

    foodSpawn = 1

    Dir = ''D''

    changeDir = Dir

    Score = 0

    Speed = 5

    SpeedCount = 0

    ```


    Now, we will learn what each block of code does, but for brevity the very basics
    are skipped as we have already learned about them in the previous sections.'
  merge: -1
  img_proc: true
- pgno: 71
  md: "The first few lines before the `finish()` function initialize PyGame and set\
    \ the game parameters. The `pygame.time.Clock()` function is used to track time\
    \ within the game, and this is mostly used for frames per second, or FPS. While\
    \ it seems somewhat trivial, FPS is very important and can be tweaked. We can\
    \ increase or decrease the FPS to control the speed of the game. Going further\
    \ into the code, we can choose options such as the screen size, the color of the\
    \ snake, the starting position, the starting speed, and so on. The `snakePos`\
    \ list variable has the head of the snake, and `snakeSeg` will contain the initial\
    \ coordinates of the segment of the snake in a nested list. The first element\
    \ contains the coordinates of the head, and the second element contains the coordinates\
    \ of the tail. This block of code also defines the initial food position, the\
