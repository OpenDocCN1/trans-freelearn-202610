- pgno: 195
  md: 'We have now built a weather station that not only monitors and saves weather
    information for you but also broadcasts it to the world! An interesting extension
    to this would be to add speech capabilities so that the Raspberry Pi speaks out
    the weather information via a speaker. The espeak library is an easy-to-use library
    that accomplishes this easily and effectively. Moreover, you can also hook up
    to a weather service that has a web API and get your Pi to speak out weather forecasts
    too!


    # Adding speech capabilities to our weather station


    Speech is one of the many ways in which humans communicate. And it''s fascinating
    to make machines do the things that humans do effortlessly. For precisely that
    reason, we will add speech capabilities to our tweeting weather station so that
    it can speak out the weather, and we no longer have to stare at our OLED screen
    or scroll our Twitter feed to learn about the weather. For this task, we will
    be using an open source tool called espeak, which is a text-to-speech engine and
    also has an API for Python.


    First, install the espeak library with the following commands:


    ```

    sudo apt-get install espeak

    sudo apt-get install python-espeak

    ```


    The good thing about this library is that we can use it from the terminal or from
    the Python console. To try it out, make sure that you have a speaker connected
    to the Pi and execute the following command from the Linux terminal:


    ```

    espeak I will tell you the weather''

    ```


    This will produce the speech output and we will be able to hear it from the speaker.
    Cool, right?


    Next, we will learn how to use it with Python and then also add it to our weather
    station project. Open a Python console by typing python in a Linux terminal. To
    import the dependencies, execute the following statement:


    ```

    >>> from espeak import espeak

    ```'
  merge: -1
  img_proc: true
- pgno: 196
  md: 'This imports the dependencies required for the speech output. Using espeak
    from Python is also as easy as:


    ```

    >>> espeak.synth("I am the weatherman")

    ```


    The synth method in the espeak module accepts a string and produces speech based
    on that. It''s not the best-sounding voice, but it works!


    To add this to the weather station, we can add the following statement inside
    our while loop:


    ```

    espeak.synth("The current temperature is : " + str(temp))

    ```


    ```

    espeak.synth("Humidity level is : " + str(hum) + "percent")

    ```


    This works because Python supports string concatenation. This means that we can
    combine two strings just by adding a + sign between them. However, the temp and
    hum variables are not string variables. So we need to convert them to strings
    by the str() method. The Str() method takes any type of variable and converts
    it into a string.


    We can also use the espeak library to tell us many different things about our
    environment by getting the state from the Grove Sensors.


    # Summary


    In this chapter, we learned how to use Python to communicate with Twitter by using
    an open source library, Tweepy. We learned how to use Tweepy to send tweets. We
    also learned how to create a database, save and update data in it, and get some
    data from an existing database. Toward the end, we extended the capabilities of
    the weather station we built in Chapter 9, Grove Sensors and the Raspberry Pi
    and added tweeting and data-saving functionalities to it. We also added speech
    capabilities to it to make it easier to use.


    In the next chapter, we will be exploring the interesting topic of parallel computing.
    We will be using multiple Raspberry Pis to create a cluster of computers that
    perform computations faster by working in tandem towards a single task. A master
    Pi will control other slave Pis and outsource its computations to them, so that
    the task is performed faster. We will use this setup to perform an n-body simulation,
    which is by itself a very computationally challenging task.'
  merge: -1
  img_proc: true
- pgno: 197
  md: '# 11

    Build Your Own

    Supercomputer with

    Raspberry Pi


    In the previous chapter, we learned how to get the Raspberry Pi to communicate
    with the Internet, along with some more topics. We learned how to set up the Twitter
    API and how to send out tweets using it. We also learned how to save data in a
    database and retrieve it later. Finally, we combined the two concepts and the
    weather station we built in Chapter 9, Grove Sensors and the Raspberry Pi to create
    a tweeting weather station that also saves the temperature and humidity data in
    a database.


    In all the chapters prior to this one, we explored the Raspberry Pi functionalities.
    But this chapter will be different in the sense that we will learn how to combine
    two or more Raspberry Pi devices to create a more powerful computer. Indeed, if
    you combine enough Raspberry Pi devices, you can make your own supercomputer!
    Sounds interesting? We will cover the following in this chapter:


    +   - Using a network switch to create a static network for Pi devices

    +   - Installing and setting up MPICH2 and MPI4PY and running on a single node

    +   - Using the static network of multiple Pi devices is to create an MPI (short
    for Message Parsing Interface) cluster

    +   - Performance the benchmarking of cluster

    +   - Running GalaxSee (N Body simulation)'
