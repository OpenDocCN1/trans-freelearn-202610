- pgno: 564
  md: '# Downloading and installing OpenCV – a fully featured vision library


    Now that you have your camera connected, you can begin to access some amazing
    capabilities that have been provided by the open source community. Open a terminal
    window and type the following commands:


    +   1. `sudo apt-get update`: You''re going to download a number of new software
    packages, so it is good to make sure that everything is up to date.

    +   2. `sudo apt-get install build-essential`: Although you may have done this
    earlier, this library is essential to build OpenCV.

    +   3. `sudo apt-get install libavformat-dev`: This library provides a way to
    code and decode audio and video streams.

    +   4. `sudo apt-get install ffmpeg`: This library provides a way to transcode
    audio and video streams.

    +   5. `sudo apt-get install libcv2.4 libcvaux2.4 libhighgui2.4`: This command
    shows the basic OpenCV libraries. Note the number in the command. This will almost
    certainly change as new versions of OpenCV become available. If 2.4 does not work,
    either try 3.0 or search on Google for the latest version of OpenCV.

    +   6. `sudo apt-get install python-opencv`: This is the Python development kit
    needed for OpenCV, as you are going to use Python.

    +   7. `sudo apt-get install opencv-doc`: This command will show the documentation
    for OpenCV just in case you need it.

    +   8. `sudo apt-get install libcv-dev`: This command shows the header file and
    static libraries to compile OpenCV.

    +   9. `sudo apt-get install libcvaux-dev`: This command shows more development
    tools for compiling OpenCV.

    +   10. `sudo apt-get install libhighgui-dev`: This is another package that provides
    header files and static libraries to compile OpenCV.

    +   11. Now type `cp -r /usr/share/doc/opencv-doc/examples /home/pi/`. This will
    copy all the examples to your home directory.


    Now that OpenCV is installed, you can try one of the examples. Go to the `/home/pi/examples/python`
    directory. If you do an `ls`, you''ll see a file named `camera.py`. This file
    has the most basic code for capturing and displaying a stream of picture images.
    Before you run the code, make a copy of it using `cp camera.py myCamera.py`. Then,
    edit the file to look like the following:'
  merge: -1
  img_proc: true
