- pgno: 174
  md: 'Next, we add an infinite while loop so that the program keeps on running until
    the user terminates it. Inside the while loop, we run the code that is responsible
    for getting the data from the sensor and displaying it on the OLED module. One
    of the common mistakes when getting data from any source is that the data might
    not be available. So we always check the validity and availability of data before
    executing any code to manipulate or use that data. This is why we must add a try
    catch statement so that if the data is not available, the program does not crash
    but gives us an error statement.


    Inside the try block, our first statement is to get the data from the DHT module
    using the dht() function. This function takes two arguments: the sensor port number
    and the type of board connected. We''ll enter 1 if the board is DHT Pro and 0
    if the board is DHT. It also gives us the output in the form of a list containing
    two elements: the temperature and humidity level.


    In the next statement, we print the humidity level and temperature to the terminal
    so that the user can look at it. The values that we get from the dht() command
    are integers, but to display them on the OLED screen we need to convert them to
    strings. This is what the str() method does. It takes an input like integer, float,
    list, and so on and gives a string output.


    The subsequent commands that begin with oled_ are all to manipulate the display
    of the data on the OLED screen. With the oled_setTextXY() method, we can set the
    cursor to display the data. It takes the X and Y coordinates as arguments and
    sets the cursor there. Next, with the oled_putString() method, we actually push
    the string data to be displayed on the cursor we just set. We do this three times:
    first to set the title as ''WEATHER'', second to set the temperature and its units,
    and finally to set the humidity and its percentage. Since this method only takes
    the string as input, it was necessary to convert the integer values of temperature
    and humidity to the string before using it here.


    Finally, we read the last statement that does nothing but handle any error that
    might be encountered in the try block. If it does encounter an error of any sort,
    it prints Error instead of crashing.


    We will now move on to our next project, which uses an ultrasonic sensor and a
    Pi Camera (or a normal webcam if you so choose). Any idea about what we''re going
    to make?'
  merge: -1
