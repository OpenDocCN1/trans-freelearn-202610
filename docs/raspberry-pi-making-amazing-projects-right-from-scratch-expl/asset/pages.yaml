- pgno: 359
  md: 'Up until now, we used the +3.3V power supply to pass through the sensor switches
    and alarm circuit. In fact, this is not a good idea, and we''ve been doing this
    only for convenience to test out our GPIO inputs.


    In reality, and in our final system, we really should use a 12V supply to pass
    through the sensor and antitamper circuits. This is because a higher voltage travels
    better through the system and is less susceptible to noise, which could prevent
    triggering or cause false triggering. This also makes it compatible with commercially
    available systems and accessories.


    # 12V alarm zone circuits


    Making our zone circuits use 12V instead of 3.3V is as simple as changing the
    power supply, and in fact all of sensors we used so far can handle 12V power passed
    through their switches.


    However, if we were to present the 12V circuit to the inputs on our GPIO port
    on the Raspberry Pi or our port expander, we would expect to see some magic smoke
    and smell something burning. So, we need to add some circuitry that allows us
    to use 12V alarm circuits as well as protect our control board inputs.


    # Alarm circuit protection


    An effective way to protect our zone inputs from 12V alarm inputs is to use a
    little low-cost device called an opto-isolator. As the name suggests, this isolates
    the alarm circuit from the digital inputs of the control board using light.


    Inside an opto-isolator (also called an opto-coupler) is an infrared LED, which
    transmits light to a photo-transistor when a current is passed through it, thus
    switching it on. The circuits are electrically isolated as they are controlled
    only by light.


    ![](img/631e8b200cce187082ee46b0eb1681b3_359_0.png)'
  merge: -1
  img_proc: true
- pgno: 360
  md: 'The 4N25 (shown in the preceding image) and 4N35 are low-cost, 6-pin opto-coupler
    devices, and most manufactures tend to use the pin layout shown in the following
    diagram:


    ![](img/631e8b200cce187082ee46b0eb1681b3_360_0.png)


    Now that we know how we will couple our 12V alarm circuit with the inputs on our
    control panel, let''s build the entire circuit, which we''ll use for each of the
    zones that we add to our system.


    ![](img/631e8b200cce187082ee46b0eb1681b3_360_1.png)


    A 12V zone circuit optically isolated from the GPIO input


    # How it works


    At this time, we''re assuming that our zone circuits are normally closed — that
    is, the alarm triggers when the circuit is broken.'
  merge: -1
  img_proc: true
- pgno: 361
  md: 'The 12V supply is passed through the LED of the opto-isolator with the current
    being limited by the 1-Kohm resistor. The 1N4148 diode, in reverse, is there to
    protect the opto-coupler from reverse-polarity voltages.


    > The 1-Kohm resistor is calculated from the fact that we have a 12V supply and
    a forward voltage drop (Vf) of 1.2V across the LED with a current (If) of about
    10 mA.


    While the alarm circuit is closed, the current flows, and the LED is on. This
    keeps the transistor on and the input to the GPIO port is held low. If the alarm
    circuit is broken, the opto-coupler LED switches off, and this in turn switches
    off the transistor. The GPIO input is then pulled high by the 10-Kohm resistor.


    This is quite simple but effective, eh?


    The other advantage of this circuit is that it should fail positive – that is,
    if the opto-coupler should fail for any reason, the alarm input on the GPIO port
    should be pulled high, thus triggering it rather than it just failing silently.


    # Wireless PIR motion sensors


    Wireless motion sensors are now commonly available at a low cost, allowing them
    to be installed practically anywhere without any wiring from the alarm control
    panel. Some of them still require an external power supply, but many operate on
    batteries. The alarm system must contain a wireless receiver compatible with the
    wireless sensor.


    In this section, we''ll take a look at how we can use our Raspberry Pi-based security
    system with wireless receiver devices.


    # 433-MHz wireless alarm systems


    Wireless systems use an unlicensed radio frequency to communicate between the
    various components of an alarm system. In the UK, the two most popular frequencies
    used are 433 MHz and 868 MHz. While the more recent systems now use the 868-MHz
    frequency, 433 MHz is still in widespread use as it has a slightly longer range
    than an 868-MHz system. However, the 433-MHz band is also used by many other devices,
    which makes it congested, whereas 868 MHz is generally used only for alarm systems.


    While wireless security systems can be convenient, it''s important to understand
    the advantages and disadvantages of using wireless rather than wired systems.'
  merge: -1
  img_proc: true
- pgno: 362
  md: 'The advantages are as follows:


    +   - Their ease and speed of installation

    +   - Their ease of removal, which means that you can take them anywhere with
    you

    +   - Expanding the system in the future can be easier, with most systems automatically
    detecting new units


    The disadvantages are as follows:


    +   - They are more expensive than wired systems, sometimes three or four times
    the cost

    +   - They are not as secure as wired systems and cannot achieve a security grading
    greater than two in accordance with European Standard BSEN 50131 (although, this
    grade is suitable for domestic properties)

    +   - Wireless devices need to have their batteries replaced at regular intervals

    +   - Wireless systems are less reliable and susceptible to interference and even
    radio jamming


    # Connecting a 433-MHz receiver


    In the past, it was possible to roll out your own 433-MHz receiver for the Raspberry
    Pi using an inexpensive receiver, such as the XY-MV-5V module along with the 433-Util
    library that was put together by a guy called Mark Wolfe, a contributor on GitHub.
    Essentially, he gathered together code relating to 433-MHz communications and
    put it all into this library. Originally developed for Arduino, this has now been
    ported to the Raspberry Pi.


    You can then use a readily available transmitter, such as a key fob or any other
    433-MHz transmitter, and take a look at the incoming code as you press each button
    on the transmitter.


    ![](img/631e8b200cce187082ee46b0eb1681b3_362_0.png)


    A XY-MK-5V Generic 433-MHz receiver module'
  merge: -1
  img_proc: true
- pgno: 363
  md: 'Finding a suitable 433-MHz receiver should be easy as websites such as Amazon
    and eBay are awash with them, and they cost as little as a couple of pounds.


    Note that the 433-MHz band is a free for many types of devices. As such, there
    are various different types of receiver, and although they may all state that
    they are 433-MHz receivers, they can operate using AM or FM, and some only detect
    certain types of data. Some, such as the Quasar QAM range, may also require special
    decoder chips in order to read transmitted data and may only work with paired
    transmitters.


    The receiver module can pick up signals from a key fob remote control, such as
    the one shown in the following image (this can be picked up from the home security
    section of any local DIY store), which gets an output as a series of square waves.
    These square waves are then decoded by the 433-Util software.


    ![](img/631e8b200cce187082ee46b0eb1681b3_363_0.png)


    A Novar/Blyss 433MHz wireless remote control


    I liked this particular remote control because I thought it would be good as the
    **arm** and **disarm** device for our home security system. I will talk about
    arming and disarming in *Chapter 8, A Miscellany of Things*, where we will look
    at the ways to achieve this.'
  merge: -1
  img_proc: true
