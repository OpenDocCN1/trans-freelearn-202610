    pir-camera-trigger.sh

    ```


    You''ll now see that we''ve started developing the foundations of the software
    that will control our home security system.


    # Is that a badger?


    If you don''t want to illuminate an area before capturing an image, you can use
    **infra-red lighting** in conjunction with a compatible camera. The standard Raspberry
    Pi camera module won''t work with infra-red lighting because it contains an infra-red
    filter, but we can use the NoIR version of the camera module instead.


    The Raspberry Pi NoIR camera module is exactly the same as the standard one, except
    that it doesn''t have an infra-red filter built in, which means it will see in
    the dark with the aid of infra-red lighting. This makes it good for watching badgers
    at night as well as for use in our home security system.


    You will need an infra-red LED array or cluster to invisibly illuminate the area
    you want to capture with the camera. These are readily available in various form
    factors and intensities, or you can build your own using individual infra-red
    LEDs purchased from an electronics store.


    ![](img/631e8b200cce187082ee46b0eb1681b3_384_0.png)'
  merge: -1
  img_proc: true
- pgno: 385
  md: 'Connecting and driving the LED cluster modules works exactly the same as our
    illuminating light above, using the TIP120 driver circuit. The only difference
    is that we humans can''t see when the LEDs are on.


    # Using USB cameras


    Instead of using the Raspberry Pi Camera Module, it''s also possible to use a
    standard USB webcam to take still images. You should be aware though that the
    dedicated camera module is far superior to a USB webcam in terms of image quality.
    Although, you may already have a webcam knocking about in your box of bits, so
    why not try it?


    # Installing the webcam


    After you''ve connected your webcam to a USB port on your Pi, you can check whether
    it''s been recognized using the `lsusb` command:


    ```

    ```bash

    $ lsusb

    ```

    ```


    I''m using a Logitech webcam that gets reported as follows with `lsusb` (Device
    006):


    ```

    ```text

    pi@raspberrypi ~ $ lsusb

    Bus 001 Device 002: ID 0424:9514 Standard Microsystems Corp.

    Bus 001 Device 001: ID 1d6b:0002 Linux Foundation 2.0 root hub

    Bus 001 Device 003: ID 0424:ec00 Standard Microsystems Corp.

    Bus 001 Device 006: ID 046d:08d8 Logitech, Inc. QuickCam for Notebook Deluxe

    ```

    ```


    > > Not all webcams will work with the Raspberry Pi. Even though it may be recognized
    as a USB device, it might not actually work properly with the operating system
    and create a video device (for example, `/dev/video0`). For example, an old cheap
    Trust webcam I had appeared as a USB device but wouldn''t capture any images.
    You can check whether your webcam is likely to work with the Pi by checking your
    make and model at http://elinux.org/RPi_USB_Webcams.


    So, now that the Pi knows that we have a webcam device attached, we can use the
    `fswebcam` utility to capture image frames. You can find out more about fswebcam
    from the developer''s site at http://www.sanslogic.co.uk/fswebcam.


    Install `fswebcam` with the following:


    ```

    ```bash

    $ sudo apt-get install fswebcam

    ```

    ```


    ![](img/631e8b200cce187082ee46b0eb1681b3_385_0.png)'
  merge: -1
  img_proc: true
- pgno: 386
  md: '# Taking a snap


    You can now test the webcam by capturing a still image, which can be done by running
    the following command:


    ```

    $ fswebcam test.jpg

    ```


    You should expect to see output similar to the following:


    ![](img/631e8b200cce187082ee46b0eb1681b3_386_0.png)


    > fswebcam has lots of options for things like the resolution and quality of the
    image. Use the command fswebcam -? to get a list of all options.


    # Snap snap snap


    fswebcam doesn''t take video streams, but you can set it up to take a series of
    frames at regular intervals. For example, to take a snap every 10 seconds, you
    can use the following command:


    ```

    $ fswebcam frame.jpg -l 10

    ```


    An example of how this would be useful can be demonstrated by setting the webcam
    to take a snap every few seconds in the background (the -q switch runs fswebcam
    in the background). When our security system is triggered, we could then take
    the latest image snapped with the webcam which could be looking down your pathway.


    For the purpose of putting together our entire system later in this book, we''ll
    be focusing on the Raspberry Pi Camera Module, but you can always replace the
    code with the previous examples if you want to use USB webcams instead.'
  merge: -1
  img_proc: true
- pgno: 387
  md: 'You''ll notice that `fswebcam`, unlike `raspistill`, has the ability to overlay
    the images with timestamp information, so you don''t need to worry about overlaying
    text as we did previously. Look at the `fswebcam` command line options for more
    information.


    # The multicamera setup


    It may have occurred to you that the Raspberry Pi has only one camera module input.
    Now, this is obviously limiting if you want to have multiple cameras around your
    property that are triggered by motion detectors.


    However, there is nothing stopping us from building standalone units that have
    a separate Raspberry Pi board with a PIR detector, Camera Module, and network
    connection, either using a Wi-Fi dongle or Ethernet.


    Because you only need a single input to the Raspberry Pi to detect when the PIR
    motion sensor is triggered, you can use the on-board GPIO port to connect the
    sensor, rather than using a port expander. The Raspberry Pi will email the alert
    over the network, and could alert the main controller Pi if required — making
    it a slave sensor device.


    You can readily obtain small PIR detectors, such as the Parallax one shown next,
    which you can mount onto a Raspberry Pi Case along with the camera module, creating
    a self-contained unit.


    ![](img/631e8b200cce187082ee46b0eb1681b3_387_0.png)'
  merge: -1
  img_proc: true
- pgno: 388
  md: '# The Slave driver


    While it may seem quite elaborate to have a Raspberry Pi for each camera — think
    about it — you can actually build each camera unit with all of the components
    for around £50, which is significantly cheaper than buying a wireless smart camera.
    If you really want to be clever, you could also use this as a slave device to
    accept further sensor inputs local to the unit.


    There is nothing to stop you from connecting a GPIO output pin on the slave unit
    to drive an input on the main controller and control the pin depending on the
    state of its local sensors. By running a 6-core cable between the units, you could
    even power the slave unit if your power supply is man enough (you''d need to have
    a supply of 5V @ 1A for the slave Pi running along the wire).


    I''m not going to go into any more detail about this configuration at this time,
    but you could set yourself a challenge to create a fully distributed home security
    system using multiple Raspberry Pis and the building blocks and concepts learned
    in this book.


    # Summary


    In this chapter, we learned how to connect both Raspberry Pi camera modules and
    USB cameras to our Pi board in order to take image and video captures when required
    by our home security system. We also learned how to overlay our images with informative
    text and have the files immediately emailed to us.


    In order to capture images from our camera at night, we also looked at ways to
    illuminate the capture area using both visible and infra-red lighting, with the
    ability to switch the lighting on and off as required by using a high-current
    Darlington transistor driver.


    In the next chapter, we''re going to get down to the business of putting together
    modules by building a mobile-optimized web-based control panel for our home security
    system. We''ll learn how to set up a Web server on our Raspberry Pi and manipulate
    files using our Web control panel, which means that we''ll start to explore how
    all of the elements we''ve encountered so far can come together as part of our
    final system.'
  merge: -1
  img_proc: true
- pgno: 389
  md: '# 7

    Building a Web-Based Control Panel


    We''ve now got all of our hardware elements together for us to create a complete
    home-security system featuring contact switches for our doors and windows, and
    motion detectors and cameras to take happy snaps of wannabe intruders! I''ve deliberately
    guided you through this in a modular fashion so that you can pick and choose and
    expand on the hardware sensor elements that suit your requirements. In Chapter
    9, Putting It All Together we will be wiring all of this together to form the
    complete system based on zones that we looked at earlier.


    One thing that all home security systems require is a **control panel** that allows
    us to **arm** and **disarm** the system and monitor the status of the zones within
    our system. We might also want to do things such as only arm certain zones, or
    have the system automatically arm and disarm at certain times of the day.


    The hardware required for this, such as switches, LEDs, and LCD displays, can
    be quite expensive and time-consuming to put together; they can also make the
    system less configurable and flexible. So, in our system, we''re going to build
    a Web-based control panel that we can access from our mobile phone browser. This
    also means that we can control the system remotely, when we are out of the house.


    In this chapter, we will cover the following:


    +   - Defining the scope of our home security in terms of the number of zones
    we will be monitoring and the I/O ports we will use

    +   - Learning how to install and configure a web server on our Raspberry Pi

    +   - Developing a basic HTML5 web page for our alarm control panel

    +   - Learning how to use PHP scripts to dynamically configure our system from
    the web page'
  merge: -1
  img_proc: true
- pgno: 390
  md: '# Installing the web server


    There are several **web servers** readily available that we could install on our
    Raspberry Pi, and they would all be suitable for our system. But I like the **lighttpd**
    web server as it''s easy to use and lightweight. lighttpd is often referred to,
    and affectionately known as, "Lighty" — which to be honest is less of a mouthful
    than lighttpd.


    As well as the Web server itself, we''re also going to install **PHP** support,
    which will allow us to write dynamic web pages to interact with the Linux system.
    Now, to be honest, I''m not a massive fan of PHP for commercial Web-based deployments
    for many reasons, but for a small embedded-Linux system such as our home security
    system, it''s perfect and works really well. It''s also quite straightforward
    to get into if you''ve never done server-side Web-scripting as well.


    To perform the following steps, you''ll need to be logged into your Raspberry
    Pi via the terminal console (for example, PuTTY):


    +   1. Update the package installer:

    +      ```

    +      $ sudo apt-get update

    +      ```

    +   2. Install the `lighttpd` Web server:

    +      ```

    +      $ sudo apt-get install lighttpd

    +      ```

    +      Once installed, it will automatically start up as a background service,
    and will do so each time your Raspberry Pi starts up.

    +   3. Install PHP5 support:

    +      ```

    +      $ sudo apt-get install php5-cgi

    +      ```

    +   4. Now, we need to enable the PHP FastCGI module in our web server:

    +      ```

    +      $ sudo lighty-enable-mod fastcgi-php

    +      ```

    +   5. And finally, we need to restart the Web server:

    +      ```

    +      $ sudo /etc/init.d/lighttpd

    +      ```


    That''s it! You should now have your PHP Web server installed. By default, the
    web content files get installed in the location, `/var/www`, and Lighty installs
    a test placeholder page in this location, which you can access from your browser
    by simply entering the IP address of your Raspberry Pi, as shown in the following
    screenshot:'
  merge: -1
  img_proc: true
- pgno: 391
