- pgno: 468
  md: 'You should now see the graphical screen of the Raspberry Pi. You are ready
    to start interacting with the system!


    # Establishing wireless access


    Now that your system is configured, the next step is to connect your Raspberry
    Pi to your remote computer using wireless. To do this, you''ll add a wireless
    USB device and configure it. See http://elinux.org/RPi_USB_Wi-Fi_Adapters to identify
    wireless devices that have been verified to work with Raspberry Pi. Here is one
    available at many online electronics outlets:


    ![](img/631e8b200cce187082ee46b0eb1681b3_468_0.png)


    To connect to your wireless LAN, boot the system and edit the network file by
    typing in `sudo nano /etc/network/interfaces`. Then, edit the file to look like
    this:'
  merge: -1
  img_proc: true
- pgno: 469
  md: '![](img/631e8b200cce187082ee46b0eb1681b3_469_0.png)


    Reboot your device and it should now be connected to your wireless network.


    > If you are using a US keyboard, you may need to edit the keyboard file for your
    keyboard to use nano effectively. To do this, type in sudo nano /etc/default/keyboard
    and change XKBLAYOUT="gb" to XKBLAYOUT="us".


    Your system has lots of capabilities. Feel free to play with the system, which
    will give you an understanding of what is already there and what you''ll want
    to add from a software perspective.


    # Programming on Raspberry Pi


    One last bit of introduction. You''ll need some basic programming skills to be
    successful on your project. This section will touch a little on Python and C programming
    on the Raspberry Pi.'
