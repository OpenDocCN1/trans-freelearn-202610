- pgno: 539
  md: '# 5


    # Path Planning

    and Your Biped


    Now that your biped is up and mobile and able to find barriers, you can now start
    to have it move around autonomously. However, you''ll want to have your robot
    planed his path, that is, if it knows where it has started and the desired end
    point, it can move from the starting point to the end point.


    In this chapter, you will be learning about:


    +   - How to add a compass to your biped, so you''ll have a sense of direction

    +   - Learning some basic path planning techniques for your robot


    # Connecting a digital compass to the Raspberry Pi


    One of the important pieces of information that might be useful for your robot,
    it if is going to plan its own path, is its direction of travel. So, let''s learn
    how to hook up a digital compass to the Raspberry Pi.'
