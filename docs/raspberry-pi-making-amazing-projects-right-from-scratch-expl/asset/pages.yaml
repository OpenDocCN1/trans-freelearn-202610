    the basic functionality that you have built in this chapter.


    # Summary


    You''ve now added path planning to your robot''s capability. Your robot can now
    not only move from point A to point B, but can also avoid barriers that might
    be in the way. In the next chapter, you''ll learn how to add a webcam to your
