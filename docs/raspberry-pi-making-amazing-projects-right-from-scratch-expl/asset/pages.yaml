    cd tweepy

    sudo python setup.py install

    ```


    > You can also find more information about using Tweepy and the full extent of
    its capabilities on its official documentation website: http://tweepy.readthedocs.org/en/v3.5.0/.


    # Using Tweepy


    Tweepy was built to be easy to set up and use, and in that regard it is of one
    of the most useable libraries for communicating with the Twitter API. It takes
