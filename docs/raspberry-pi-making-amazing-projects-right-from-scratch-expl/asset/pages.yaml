  md: "```\n```sh\ndo\n    # read the GPA inputs\n    GPA=$(sudo i2cget -y 1 0x20\
    \ 0x12)\n\n    # detect the zone on input 0\n    if [ $GPA == \"0x01\" ]\n   \
    \ then\n        #circuit normally closed so zone is OK\n        #short delay\n\
    \        sleep 0.5\n\n    else\n        #zone is activated so take a 20 sec video\
