- pgno: 425
  md: "# # Accessing Webmin locally\n\nWebmin, by default, runs on port 10000 and\
    \ uses the secure HTTPS protocol; so, to access it, you need to enter the following\
    \ URL in your browser:\n\n```\nhttps://<my-ip>:10000\n```\n\nWhere <my-ip> is\
    \ the IP address of your Raspberry Pi.\n\nIn the previous chapter, we set up a\
    \ static IP address on our system; in my case, I set up the address as 192.168.0.99.\
    \ So, to access Webmin on my system, I would use:\n\n```\nhttps://192.168.0.99:10000\n\
    ```\n\n> **HTTPS Privacy Errors**\n> \n> In some browsers, such as Google Chrome,\
    \ you might see a privacy error as you try to access the Webmin Web page. This\
    \ is because the SSL certificate behind the HTTPS connection is not signed by\
    \ a known authority. This is fine—just tell your browser that you want to accept\
    \ this and proceed (in Chrome, you need to click on the **Advanced** link first\
    \ to access that option).\n\n![](img/631e8b200cce187082ee46b0eb1681b3_425_0.png)"
