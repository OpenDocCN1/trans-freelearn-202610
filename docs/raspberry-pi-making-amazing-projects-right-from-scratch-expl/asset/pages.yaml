    # We''re done (almost)…


    And there we have it: a framework for an entire alarm control script on our Raspberry
    Pi. Additional features that you may want to implement within your script could
    include the following:


    +   - Sending a photo or video clip from a zone''s camera when it''s triggered

    +   - Sending an email alert with status details when the alarm has been triggered

    +   - Writing a regular log file recording historical status information

    +   - Adding additional environmental sensors to port B


    > Each of the script blocks is taken from the single script file, `alarm-control.sh`,
    so you should be able to put all of the described pieces together into one file
    to have a fully functional script.


    As always, before we can run it we need to give the script execute rights:


    ```

    $ sudo chmod 777 /etc/pi-alarm/alarm-control.sh

    ```


    After we copy the script to our Raspberry Pi, this is what we should see in our
    `/etc/pi-alarm` folder:


    ```

    pi@raspberrypi ~ $ ls -1 /etc/pi-alarm

    alarm.cfg

    alarm-control.sh

    update-alarm-setting.sh

    ```'
  merge: -1
  img_proc: true
- pgno: 446
  md: "# Automatically starting the system\n\nNow, obviously, we don't want to have\
    \ to manually start the alarm control script each time the Raspberry Pi boots\
    \ up, for example, after a power failure — for a start, we may not even be there.\
    \ Therefore, we need to set up our operating system so that it will automatically\
    \ start up the alarm-control.sh script at boot time.\n\nTo do this, we need to\
    \ edit the rc.local file using Nano:\n\n```\n$ sudo nano /etc/rc.local\n```\n\n\
    Before the line containing exit 0, insert the following line:\n\n```\nsudo /etc/pi-alarm/alarm-control.sh\
    \ &\n```\n\n> The & symbol at the end of the line is important because it will\
    \ then make the script run in a different process, otherwise the rc.local script\
    \ would never exit.\n\nYour rc.local file should now look something like this:\n\
    \n```\n#!/bin/sh -e\n#\n# rc.local\n#\n# This script is executed at the end of\
    \ each multiuser runlevel.\n# Make sure that the script will \"exit 0\" on success\
    \ or any other\n# value on error.\n#\n# In order to enable or disable this script\
    \ just change the execution\n# bits.\n#\n# By default this script does nothing.\n\
    \n# Print the IP address\n_IP=$(hostname -I) || true\nif [ \"$_IP\" ]; then\n\
    \    printf \"My IP address is %s\\n\" \"$_IP\"\nfi\n\nsudo /etc/pi-alarm/alarm-control.sh\
    \ &\nexit 0\n```\n\nThe operating system runs the rc.local script after the system\
    \ boots up, so you can put anything in there that you want to happen automatically\
    \ at this time."
  merge: -1
  img_proc: true
- pgno: 447
  md: "# Preserving the SD card\n\nOne final topic I want to share with you is that\
    \ of preserving your Raspberry Pi's SD card. SD cards have a finite write cycle,\
    \ and continuous writing to the card will eventually burn it out. If we're going\
    \ to be writing lots of log file entries and taking lots of camera images, we\
    \ will want to protect our SD card in order to maintain the integrity and reliability\
    \ of our system; using the system RAM instead can help us with this.\n\n# Creating\
    \ a RAM-based file system\n\nOur Raspberry Pi has plenty of fast system RAM available\
    \ to us (1Gb on the latest models) that isn't susceptible to this write burn-out\
    \ issue. Therefore, I'm going to show you how to allocate some of it to create\
    \ a temporary disk in memory, which we can write files to that we don't need kept\
    \ on the SD card. Such files would include the, quite large, camera image files\
    \ that will be emailed out of the system — which, therefore, don't need to be\
    \ stored permanently. You should also consider any log files that are regularly\
    \ written to, which would then be shipped off the system at regular intervals.\n\
    \n> Remember that this is a RAM-based file system, so content will be lost when\
    \ the Raspberry Pi shuts down or reboots. So, don't store any data here that you\
    \ want to persist after a restart.\n\nLet's create a Bash script file called setup-ramfs.sh,\
    \ and copy it to our /etc/pi-alarm folder:\n\n```\n#!/bin/bash\n#/etc/pi-alarm/setup-ramfs.sh\n\
    \nRAM_DISK=\"/ramfs\"\nRAM_DISK_SIZE=64M\n\n# Create RAM Disk #############################\n\
    if [ ! -z \"$RAM_DISK\" ]; then\n    echo \"[INIT] Creating RAM Disk... $RAM_DISK\"\
    \n    mkdir -p $RAM_DISK\n    chmod 777 $RAM_DISK\n    mount -t tmpfs -o size=$RAM_DISK_SIZE\
    \ tmpfs $RAM_DISK/\n    echo \"[INIT] RAM Disk created at $RAM_DISK\"\nfi\n###############################################\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 448
  md: '# setup-ramfs.sh RAM disk creation script


    Running the preceding script will create a RAM disk folder at /ramfs – you can
    treat it just like any other folder; it''s just that it resides in the system
    memory rather than on the SD card:


    ```

    $ cd /ramfs

    $ ls

    ```


    You can call this script from the alarm-control.sh script as part of the initialization
    process by including the line:


    ```

    . /etc/pi-alarm/setup-ramfs.sh

    ```


    # Conclusion


    The Raspberry Pi is a powerful little beast and a great platform for building
    low-cost, but highly capable, embedded systems. The interfaces built into its
    GPIO connector make it easy to bolt on modules using simple low-cost electronics
    and a bit of configuration to create very functional and flexible systems. The
    inclusion of a dedicated camera interface and networking interfaces give you everything
    you could possible need for an Internet-connected home security system.


    I''ve covered a lot of topics in this book, and I could have gone on and on, but
    I hope that what I have presented has been done in a structured and methodical
    way, and has given you the tools and techniques to carry on this journey so that
    you are able to create the perfect home security system for your needs.


    # Tips for building systems


    As a systems guy who has to work with many different technologies and disciplines
    on a day-to-day basis, I just want to leave you with the following thoughts to
    consider, if you choose to build upon the system we''ve put together in this book,
    which, of course, I hope you will:


    +   - Create a high-level diagram of your proposed system first—a bit like the
    one I produced earlier in this chapter.

    +   - Define everything in a modular way so that you can build and test your system
    in small chunks. This makes it much easier to spot issues early on.

    +   - Building the system using smaller modules makes it easier to re-use and
    replace circuits and code, and don''t be afraid to mix-and-match technologies
    using what''s best for the individual module.'
  merge: -1
  img_proc: true
