- pgno: 337
  md: '# 4


    # Adding a Magnetic Contact Sensor


    Now that we have built our port expander hardware, we need to learn how to program
    it so that our Raspberry Pi can detect the things that we connect to it as part
    of our home security system. We will begin by connecting switches to our system
    in the form of magnetic sensors — the most common component used in home security
    systems to detect intrusions through doors and windows.


    In this chapter we will cover the following topics:


    +   - Learning about reed switches and how they work as door sensors

    +   - Enabling and setting up the I2C bus on the Raspberry Pi

    +   - Connecting our sensor to an input on our port expander

    +   - Learning how to access our I2C port expander from a Bash script

    +   - Writing a script that will detect the state of our door sensor

    +   - Looking at other types of contact sensors that can be connected and programmed
    in the same way


    # Prerequisites


    You''ll need the following parts for the exercises in this chapter:


    +   - Our Raspberry Pi and Port Expander board

    +   - 8 x 10K ohm resistors

    +   - A magnetic door sensor and magnet

    +   - A hook-up wire

    +   - A 4-core alarm wire'
  merge: -1
  img_proc: true
- pgno: 338
  md: '# The working of magnetic contact sensors


    A **reed switch** is essentially what makes up our **magnetic contact sensor**.
    A reed switch comprises two metal contacts made of magnetic material (called reeds)
    placed inside a glass envelope. When the contacts touch, the switch is on, and
    when they spring apart, the switch is off and the circuit is broken. The way to
    control these contacts is by means of a **magnetic field** that makes or breaks
    the circuit when it is near to the switch.


    A normally open (NO) type of reed switch is normally switched off until a magnet
    comes close to the switch, which then pulls the contacts together.


    A normally closed (NC) variety works the other way with the switch being normally
    on until the magnet comes close to the switch, pulling the two contacts apart.


    ![](img/631e8b200cce187082ee46b0eb1681b3_338_0.png)


    A typical type of reed switch


    You can now see how a magnetic reed switch can be a useful sensor in security
    applications, and in particular for our home security system, to detect when **doors**
    and **windows** are opened and closed. We simply put a reed switch on the door
    frame and connect it to our security system, with the magnet placed opposite the
    switch on the actual door. When the door opens and closes, it makes or breaks
    the contacts in our reed switch.


    Reed switches and their magnets, which are designed for security systems, usually
    come enclosed in little plastic housings, making them easy to screw onto the door
    and frame.'
  merge: -1
  img_proc: true
- pgno: 339
  md: '![](img/631e8b200cce187082ee46b0eb1681b3_339_0.png)


    A door-frame-mounted magnetic sensor containing a reed switch (Type: Cherry MP201801)


    The magnetic sensor is mounted on the door frame (obviously, so it can connect
    to the alarm circuit wires), while the respective magnet will be attached to the
    door, close enough to the edge such that the sensor contacts connect (or break,
    depending on the type) when the magnet is directly opposite it.


    ![](img/631e8b200cce187082ee46b0eb1681b3_339_1.png)


    A respective door-mounted magnetic actuator (Type: Cherry AS201801)'
  merge: -1
