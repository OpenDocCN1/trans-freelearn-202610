- pgno: 239
  md: 'Navigate to the HTML folder and create a new index.php file:


    ```

    $ cd /var/www/html/

    $ sudo nano index.php

    ```


    Add a test line to it:


    ```

    <?php echo "hello world"; ?>

    ```


    Save the file and exit by pressing Ctrl + X and then Y. We also need to remove
    the index.html file because HTML takes precedence over PHP. Do that with the following
    command:


    ```

    sudo rm index.html

    ```


    Navigate to 127.0.0.1 or localhost in the browser and you will be greeted by the
    hello world message. Let''s now set up something static.


    Replace the hello world line with the following:


    ```

    <?php echo date(''Y-m-d H:i:s''); ?>

    ```


    Now that we have installed PHP to process the web pages that we want, the next
    step is to install a database to store some data. Our database of choice will
    be MySQL simply because WordPress uses it to store IDs of things such as Post,
    Pages, Comments, Users, and so on.


    To install MySQL and its PHP packages, run the following command:


    ```

    sudo apt-get install mysql-server php5-mysql

    ```


    Once the installation proceeds, you will be asked for a root password for creating
    the databases. Enter the password and remember it for future use.


    # Installing WordPress


    Now that we are done installing the dependencies, the next step is getting the
    WordPress files in the HTML folder. Fortunately for us, WordPress provides a tar
    archive of the latest version of WordPress on this link: http://wordpress.org/latest.tar.gz.
    We now need to place the files contained in this folder in our web server folder.
    To do that, we first need to take ownership of the folder. To carry out that entire
    process, we execute the following commands:


    ```

    $ cd /var/www/html/

    $ sudo chown pi:

    $ sudo rm *

    $ wget http://wordpress.org/latest.tar.gz

    ```'
