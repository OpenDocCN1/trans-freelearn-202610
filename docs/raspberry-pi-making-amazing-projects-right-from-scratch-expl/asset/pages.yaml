- pgno: 79
  md: 'Then, install the **fswebcam** utility by running the following command:


    ```

    sudo apt-get install fswebcam

    ```


    **fswebcam** is a simple command-line utility that captures images with webcams
    for Linux computers. Once the installation is done, you can use the following
    command to create a directory for output images:


    ```

    mkdir /home/pi/book/output

    ```


    Then, run the following command to capture the image:


    ```

    fswebcam -r 1280x960 --no-banner ~/book/output/camtest.jpg

    ```


    This will capture an image with a resolution of 1280 x 960. You might want to
    try another resolution for your learning. The **--no-banner** command will disable
    the timestamp banner. The image will be saved with the filename mentioned. If
    you run this command multiple times with the same filename, the image file will
    be overwritten each time. So, make sure that you change the filename if you want
    to save previously captured images. The text output of the command should be similar
    to the following output:


    ```

    --- Opening /dev/video0...

    Trying source module v4l2...

    /dev/video0 opened.

    No input was specified, using the first.

    --- Capturing frame...

    Corrupt JPEG data: 2 extraneous bytes before marker 0xd5

    Captured frame in 0.00 seconds.

    --- Processing captured image...

    Disabling banner.

    Writing JPEG image to ''/home/pi/book/output/camtest.jpg''.

    ```


    # Crontab


    **Cron** is a time-based job scheduler in Unix-like computer operating systems.
    It is driven by a **crontab** (cron table) file, which is a configuration file
    that specifies shell commands to be run periodically on a given schedule. It is
    used to schedule commands or shell scripts to run periodically at a fixed time,
    date, or interval.


    The syntax for **crontab** in order to schedule a command or script is as follows:


    ```

    1 2 3 4 5 /location/command

    ```'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# Working with a Webcam and Pi Camera


    Here are the definitions:


    +   - 1: Minutes (0-59)

    +   - 2: Hours (0-23)

    +   - 3: Days (0-31)

    +   - 4: Months [0-12 (1 for January)]

    +   - 5: Days of the week [0-7 (7 or 0 for Sunday)]

    +   - `/location/command`: The script or command name to be scheduled


    The **crontab** entry to run any script or command every minute is as follows:


    ```

    ```bash

    * * * * * /location/command 2>&1

    ```

    ```


    We will be using **crontab** in many chapters in this book. In the next section,
    we will learn how to use **crontab** to schedule a script to capture images periodically
    in order to create the timelapse sequence.


    > > You can refer to this URL for more details on crontab:

    > > http://www.adminschoice.com/crontab-quick-reference.


    # Creating a timelapse sequence using fswebcam


    **Timelapse photography** means capturing photographs in regular intervals and
    playing the images with a higher frequency in time than those that were shot.
    For example, if you capture images with a frequency of one image per minute for
    10 hours, you will get 600 images. If you combine all these images in a video
    with 30 images per second, you will get 10 hours of timelapse video compressed
    in 20 seconds. You can use your USB webcam with Raspberry Pi to achieve this.
    We already know how to use the Raspberry Pi with a webcam and the fswebcam utility
    to capture an image. The trick is to write a script that captures images with
    different names and then add this script in **crontab** and make it run at regular
    intervals.


    Begin with creating a directory for captured images:


    ```

    ```bash

    mkdir /home/pi/book/output/timelapse

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'Open an editor of your choice, write the following code, and save it as **timelapse.sh**:


    ```

    ```bash

    #!/bin/bash


    DATE=$(date +"%Y-%m-%d_%H%M")

    fswebcam -r 1280x960 --no-banner

    /home/pi/book/output/timelapse/garden_$DATE.jpg

    ```

    ```


    Make the script executable using:


    ```

    ```bash

    chmod +x timelapse.sh

    ```

    ```


    This shell script captures the image and saves it with the current timestamp in
    its name. Thus, we get an image with a new filename every time as the file contains
    the timestamp. The second line in the script creates the timestamp that we''re
    using in the filename. Run this script manually once, and make sure that the image
    is saved in the **/home/pi/book/output/timelapse** directory with the **garden_<timestamp>.jpg**
    name.


    To run this script at regular intervals, we need to schedule it in **crontab**.


    The **crontab** entry to run our script every minute is as follows:


    ```

    ```bash

    * * * * * /home/pi/book/chapter04/timelapse.sh 2>&1

    ```

    ```


    Open the **crontab** of the Pi user with **crontab -e**. It will open crontab
    with **nano** as the editor. Add the preceding line to crontab, save it, and exit
    it.


    Once you exit **crontab**, it will show the following message:


    ```

    ```text

    no crontab for pi - using an empty one

    crontab: installing new crontab

    ```

    ```


    Our timelapse webcam setup is now live. If you want to change the image capture
    frequency, then you have to change the crontab settings. To set it every 5 minutes,
    change it to ***/5 * * * ***. To set it for every 2 hours, use **0 */2 * * ***.
    Make sure that your MicroSD card has enough free space to store all the images
    for the time duration for which you need to keep your timelapse setup.'
  merge: -1
  img_proc: true
- pgno: 82
  md: "Once you capture all the images, the next part is to encode them all in a fast\
    \ playing video, preferably 20 to 30 frames per second. For this part, the mencoder\
    \ utility is recommended. The following are the steps to create a timelapse video\
    \ with mencoder on a Raspberry Pi or any Debian/Ubuntu machine:\n\n+   1. Install\
    \ mencoder using sudo apt-get install mencoder\n+   2. Navigate to the output\
    \ directory by using:\n+      cd /home/pi/book/output/timelapse\n+   3. Create\
    \ a list of your timelapse sequence images using:\n+      ls garden_*.jpg > timelapse.txt\n\
    +   4. Use the following command to create a video:\n+      mencoder -nosound\
    \ -ovc lavc -lavcopts vcodec=mpeg4:aspect=16/9:vbitrate=8000000 -vf scale=1280:960\
    \ -o timelapse.avi -mf type=jpeg:fps=30 mf://@timelapse.txt\n\nThis will create\
    \ a video with name timelapse.avi in the current directory with all the images\
    \ listed in timelapse.txt with a 30 fps frame rate. The statement contains the\
    \ details of the video codec, aspect ratio, bit rate, and scale. For more information,\
    \ you can run man mencoder on Command Prompt. We will cover how to play a video\
    \ in the next section.\n\n# Webcam video recording and playback\n\nWe can use\
    \ a webcam to record live videos using avconv. Install avconv using sudo apt-get\
    \ install libav-tools. Use the following command to record a video:\n\n```\navconv\
