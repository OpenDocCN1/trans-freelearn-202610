- pgno: 376
  md: "# Adding Cameras to Our Security System\n\nIf you want to play the file on\
    \ smartphones and conventional media players, then we will need to wrap it in\
    \ a container format, such as MPEG-4, and give the file a .mp4 extension.\n\n\
    To do this, we'll use the GPAC package, which is an open source multimedia framework.\
    \ It comes with a utility called MP4Box, which is a tool we'll use to create an\
    \ MP4 container for our video file:\n\n+   1. First, install the GPAC package:\n\
    +   \n+      ```bash\n+      $ sudo apt-get install gpac\n+      ```\n+   \n+\
    \   2. Once it's installed, run the command to convert the test video we created:\n\
    +   \n+      ```bash\n+      $ MP4Box -fps 30 -add test.h264 test.mp4\n+     \
    \ ```\n\nYou should now have the file, test.mp4, which you can download and play\
    \ on your PC or smartphone.\n\n> Another popular conversion tool is ffmpeg, which\
    \ I use a lot on Windows to convert video files; however, it can be quite complex\
    \ and although there is a package for the Raspberry Pi, I actually couldn't get\
    \ it to convert properly on the Pi. MP4Box is much more straightforward and fitting\
    \ for our needs.\n\n# Caught on camera\n\nSo, we now have a method of capturing\
    \ still images and video, which we can put to use in our security system. If we\
    \ want to have this running constantly, we could write a script to take video\
    \ constantly, but this would soon fill up our memory card and wouldn't be particularly\
    \ efficient. So, we'll combine our camera system with the motion detectors we\
    \ connected earlier.\n\nIn the last chapter, we created an alarm zone which had\
    \ a couple of sensors and a motion detector connected to our system on the input\
    \ GPA0. So, let's write a script that will take a video clip whenever the motion\
    \ detector is triggered:\n\n```\n```bash\n#!/bin/bash\n\n# set up port expander\n\
    sudo i2cset -y 1 0x20 0x00 0xFF\n\n# loop forever\nwhile true\n```\n```"
  merge: -1
  img_proc: true
