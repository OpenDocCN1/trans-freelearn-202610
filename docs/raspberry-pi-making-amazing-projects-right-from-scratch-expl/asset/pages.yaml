- pgno: 586
  md: 'Finally, the following is what the program will look like on the remote computer
    when the robot''s Raspberry Pi is up and connected:


    ![](img/631e8b200cce187082ee46b0eb1681b3_586_0.png)


    Now you can control you robot remotely using the joystick!


    # # Adding the capability to see remotely


    Your biped can now get information from your remote computer and respond to joystick
    key presses, but you may want to be able to see what the biped sees from its webcam.
    This is straightforward to configure with a webcam, vncserver, and the capability
    you used in *Chapter 6, Adding Vision to Your Biped*. Using this method, you can
    easily get a picture of what your biped is seeing, and it should be something
    like the following:'
  merge: -1
  img_proc: true
- pgno: 587
  md: '![](img/631e8b200cce187082ee46b0eb1681b3_587_0.png)


    Now you can both see where your robot is going and control it via a joystick.


    # Summary


    That''s it, but really it is only the beginning. Your robot has some basic motions
    and some basic control capability, but now you should also have the knowledge
    and skills to take your biped robot much further. You can teach it how to dance,
    follow gestures, and almost anything that you can imagine.'
