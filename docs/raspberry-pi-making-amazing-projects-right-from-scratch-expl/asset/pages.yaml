- pgno: 438
  md: "# Putting It All Together\n\n```\necho \"[ALM] System ARMED with key switch\"\
    \nALM_KEY_ARMED=1\nalmUpdateConfigSetting \"SYSTEM_ARMED\" \"1\" #set system armed\n\
    \    console flag\nSTAT_RET_VAL=\"1\"\nelse\n    #read system armed value from\
    \ web console config file\n    if [ $SYSTEM_ARMED == 1 ]; then\n        echo \"\
    [ALM] System ARMED with web console\"\n        STAT_RET_VAL=\"1\"\n    fi\nfi\n\
    }\n```\n\n# Setting up the I2C port expander\n\nThe next few lines of code set\
    \ up the I2C port expander to set all of the pins, on both Port A and Port B,\
    \ as inputs. In our system here, we're only using Port A, but this allows us to\
    \ have another 8 inputs if we want to expand our system. We originally looked\
    \ at this in *Chapter 4, Adding a Magnetic Contact Sensor*:\n\n```\n# PORT EXPANDER\
    \ SET UP ###########################\n#Refer to Chapter 4 for more information\
    \ about the I2C bus\n\n#We will set up I/O BUS A as all inputs\nsudo i2cset -y\
    \ 1 0x20 0x00 0xFF\n\n#Whilst we're not using BUS B in our system,\n#we can set\
    \ that up as all inputs too\nsudo i2cset -y 1 0x20 0x01 0xFF\n```\n\n> If you\
    \ don't have your I2C port expander attached, then you'll see the following error\
    \ when you try to run these commands: *Error: Write failed*\n\n# Decoding the\
    \ zone inputs status\n\nThe next function is a big one—and key to our system.\
    \ It will read the Port A value from the I2C port expander. It'll be returned\
    \ as a hexadecimal value, so we need to convert this to a binary value with a\
    \ 0 or 1 flag representing each input. We'll use the bc tool installed earlier\
    \ to do this."
  merge: -1
  img_proc: true
- pgno: 439
  md: "Once we have the status of each input bit, we then normalize the status by\
    \ determining whether a 0 or a 1 determines a positive trigger. The resulting\
    \ output is the array, `ALM_ZONES_STAT`, which contains the status of each zone—with\
    \ a 1 representing a positive triggered zone de-facto:\n\n```\n```bash\n#This\
    \ function will read the port inputs and set the\n#status of each zone\nfunction\
    \ almReadZoneInputs()\n{\n    #preserve previous zone status\n    ALM_ZONE_INPUT_PREV=$ALM_ZONE_INPUT_STAT\n\
    \    #read the 8-bit hex value of port a\n    ALM_ZONE_INPUT_READ=$(sudo i2cget\
    \ -y 1 0x20 0x12)\n\n    if [[ $ALM_ZONE_INPUT_READ = *\"Error\"* ]]; then\n \
    \       #An error occurred reading the I2C bus - set default value\n        ALM_ZONE_INPUT_READ=\"\
    0x00\"\n    fi\n\n    #remove the 0x at the start of the value to get the hex\
    \ value\n    local L_HEX=${ALM_ZONE_INPUT_READ:2}\n    #convert the hex value\
    \ to binary\n    local L_BIN=$(echo \"obase=2; ibase=16; $L_HEX\" | bc )\n   \
    \ #zero pad the binary to represent all 8 bits (b7-b0)\n    ALM_ZONE_INPUT_STAT=$(printf\
    \ \"%08d\" $L_BIN)\n\n    echo \"[ALM] Zone I/O Status: $ALM_ZONE_INPUT_STAT\n\
    \        ($ALM_ZONE_INPUT_READ)\"\n\n    #check each zone input to see if it's\
    \ in a triggered state\n    #a triggered state may be either 1 or 0 depending\
    \ on the input's\n    #configuration\n    #you'll need to set the logic here accordingly\
    \ for each input\n    #the ALM_ZONES_STAT array contains the definitive trigger\
    \ value\n    #for each input\n\n    #zone 1 test (bit 0)\n    local L_FLG=${ALM_ZONE_INPUT_STAT:7:1}\n\
    \    if [ $L_FLG -eq 0 ]; then ALM_ZONES_STAT[0]=0; else\n        ALM_ZONES_STAT[0]=1;\
    \ fi\n\n    #zone 2 test (bit 1)\n    local L_FLG=${ALM_ZONE_INPUT_STAT:6:1}\n\
    \    if [ $L_FLG -eq 0 ]; then ALM_ZONES_STAT[1]=0; else\n        ALM_ZONES_STAT[1]=1;\
    \ fi\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 440
  md: "# Putting It All Together\n\n```\n```sh\n#zone 3 test (bit 2)\nlocal L_FLG=${ALM_ZONE_INPUT_STAT:5:1}\n\
    if [ $L_FLG -eq 0 ]; then ALM_ZONES_STAT[2]=0; else\n    ALM_ZONES_STAT[2]=1;\
    \ fi\n\n#zone 4 test (bit 3)\nlocal L_FLG=${ALM_ZONE_INPUT_STAT:4:1}\nif [ $L_FLG\
    \ -eq 0 ]; then ALM_ZONES_STAT[3]=0; else\n    ALM_ZONES_STAT[3]=1; fi\n\n#zone\
    \ 5 test (bit 4)\nlocal L_FLG=${ALM_ZONE_INPUT_STAT:3:1}\nif [ $L_FLG -eq 0 ];\
    \ then ALM_ZONES_STAT[4]=0; else\n    ALM_ZONES_STAT[4]=1; fi\n\n#zone 6 test\
    \ (bit 5)\nlocal L_FLG=${ALM_ZONE_INPUT_STAT:2:1}\nif [ $L_FLG -eq 0 ]; then ALM_ZONES_STAT[5]=0;\
    \ else\n    ALM_ZONES_STAT[5]=1; fi\n\n#zone 7 test (bit 6)\nlocal L_FLG=${ALM_ZONE_INPUT_STAT:1:1}\n\
    if [ $L_FLG -eq 0 ]; then ALM_ZONES_STAT[6]=0; else\n    ALM_ZONES_STAT[6]=1;\
    \ fi\n\n#zone 8 test (bit 7)\nlocal L_FLG=${ALM_ZONE_INPUT_STAT:0:1}\nif [ $L_FLG\
    \ -eq 0 ]; then ALM_ZONES_STAT[7]=0; else\n    ALM_ZONES_STAT[7]=1; fi\n\necho\
    \ \"[ALM] Zone Trigger Status: $ALM_ZONES_STAT[*]\"\n}\n```\n```\n\n# Initialization\n\
    \nNow that we have declared our module-level variables and helper functions, we\
    \ will start our main routine. First, we'll initialize the system that clears\
    \ the SYSTEM_ARMED status and reads in the initial settings from the config file:\n\
    \n```\n```sh\n# initialise system ########\necho \"[ALM] Initialising system...\"\
    \nalmUpdateConfigSetting \"SYSTEM_ARMED\" \"0\" #clear system armed\nconsole flag\n\
    sleep 1\nsudo cat /etc/pi-alarm/alarm.cfg\n```\n```"
