- pgno: 505
  md: '# 3

    Motion for the Biped


    Now that you''ve got your biped all up and running, you can start developing interesting
    ways to make it move. In this chapter, you''ll learn


    +   - How to adjust the positions of your servos for the Tyrannosaurus Rex pose

    +   - The basic walking gait for your robot

    +   - The basic turn for your robot


    Before you begin, however, it will be best if you create a harness for your biped.
    Your robot is going to be inherently unstable with only two legs, and, as you
    experiment, you''re going to make some mistakes. With only two legs, these mistakes
    can, and probably will, result in your robot toppling over, which can damage the
    robot.


    If you have an electronics board vise, or an "Extra Hands" device, they can be
    useful for this purpose. Here is a picture of how to use this device to create
    a harness:


    ![](img/631e8b200cce187082ee46b0eb1681b3_505_0.png)'
  merge: -1
  img_proc: true
- pgno: 506
  md: 'If you don''t, you can easily create this sort of overhead support using a
    PVC pipe or wood. Really, just something to keep your biped from crashing over
    during your experimentation.


    # A basic stable pose


    Now that your biped is built and you know how to program the servos using Python,
    you can experiment with some basic poses. You''ll first create a program that
    allows you to set individual servos so that you can experiment. Here is the program:


    ![](img/631e8b200cce187082ee46b0eb1681b3_506_0.png)


    This code includes the Python setAngle function from Chapter 2, Building the Biped.
    The specifics were taken from the www.pololu.com website, but it simply allows
    you to set a specific servo to a specific angle.


    The next part of the code sets all of the servos to their center location. The
    final piece of the code, the while 1: code set, simply asks the user for a servo
    and an angle, and then sends the command to the servo controller.'
  merge: -1
