  md: "# The chat server\n\nThe chat server performs the following tasks:\n\n+   -\
    \ It accepts multiple incoming connections for the client.\n+   - It reads incoming\
    \ messages from each client and broadcasts them to all the other connected clients.\n\
    \nThe following is the code for the chat server:\n\n```\nimport socket, select\n\
    \n#Function to broadcast chat messages to all connected clients\ndef broadcast_data\
    \ (sock, message):\n    #Do not send the message to master socket and the client\
    \ who\n    has send us the message\n    for socket in CONNECTION_LIST:\n     \
    \   if socket != server_socket and socket != sock :\n            try :\n     \
    \           socket.send(message)\n            except :\n                # broken\
    \ socket connection may be, chat client\n                pressed ctrl+c for example\n\
    \                socket.close()\n                CONNECTION_LIST.remove(socket)\n\
    \nif __name__ == \"__main__\":\n\n    # List to keep track of socket descriptors\n\
    \    CONNECTION_LIST = []\n    RECV_BUFFER = 4096 # Advisable to keep it as an\
    \ exponent of 2\n    PORT = 5000\n\n    server_socket = socket.socket(socket.AF_INET,\n\
    \    socket.SOCK_STREAM)\n    # this has no effect, why ?\n    server_socket.setsockopt(socket.SOL_SOCKET,\n\
    \    socket.SO_REUSEADDR, 1)\n    server_socket.bind((\"0.0.0.0\", PORT))\n  \
    \  server_socket.listen(10)\n\n    # Add server socket to the list of readable\
    \ connections\n    CONNECTION_LIST.append(server_socket)\n\n    print \"Chat server\
    \ started on port \" + str(PORT)\n```"
