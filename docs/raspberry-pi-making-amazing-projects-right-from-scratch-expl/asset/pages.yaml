- pgno: 366
  md: "# Logging detection data\n\nWith any system, it's useful to be able to log\
    \ data when something happens. We can do this with our detectors too by writing\
    \ to a log file every time a detector in a zone is triggered. This way, you can\
    \ keep a log of every time someone enters a room, which you can review at a later\
    \ date even if the system isn't armed. You can also keep a log of when the system\
    \ is armed and disarmed.\n\nHere's a simple script that shows you how to do this\
    \ whenever an event happens on our zones connected to the GPIO inputs:\n\n```\n\
    #!/bin/bash\n\n#set up the I2C expansion port\nsudo i2cset -y 1 0x20 0x00 0xFF\n\
    \n#reset status\nCURR_STATE=\"0x00\"\nLAST_STATE=\"0x00\"\n\n#path to the log\
    \ file\nLOG_FILE=\"/etc/pi-alarm/zones.log\"\n\n# loop forever\nwhile true\ndo\n\
    \  # read the gpio inputs\n  CURR_STATE=$(sudo i2cget -y 1 0x20 0x12)\n\n  #check\
    \ if state has changed\n  if [ \"$CURR_STATE\" != \"$LAST_STATE\" ]\n  then\n\
    \    #write change to log file\n    TIMESTAMP=`date \"+%Y-%m-%d %H:%M:%S\"`\n\
    \    echo \"$TIMESTAMP Zone Status Changed from $LAST_STATE to $CURR_STATE\" >\
    \ $LOG_FILE\n  fi\n  $LAST_STATE = $CURR_STATE\n  sleep 1\ndone\n```\n\nThe preceding\
    \ example is quite simple, but it can be made more useful by actually writing\
    \ out the zone or zones that change by decoding the hex value that's returned\
    \ by the i2cget command in the constituent zones."
  merge: -1
  img_proc: true
- pgno: 367
  md: 'In *Chapter 9, Putting It All Together*, you''ll learn how this is done in
    order to display the individual status of each zone on a web page. You can use
    exactly the same technique to do this for your log files and, in fact, output
    to the log file by expanding on the same script.


    # Summary


    In this chapter, we started off by learning how passive infrared sensors are used
    to detect motion to protect a predefined coverage area from intrusion. We then
    looked at connecting these to the inputs on our port expander via opto-couplers
    as we will now use 12V to power the alarm zone circuits.


    We then looked at wireless alarm systems that operate on the open 433-MHz band,
    which is commonly used for security devices. After exploring the possibility of
    using the legacy 433-Util bit-banging software on our Raspberry Pi to decode the
    signals transmitted by devices using a simple receiver, we opted to use a paired
    receiver device that will interface easily with our alarm circuit inputs.


    Finally, we created a simple script that will log the changes in our alarm inputs
    to a text file, which can later be expanded to log exactly what''s going on with
    the system in detail.'
  merge: -1
  img_proc: true
