- pgno: 418
  md: 'Here''s the modified circuit for our digital load driver with a 1N4007 **rectifier
    diode** for protection:


    ![](img/631e8b200cce187082ee46b0eb1681b3_418_0.png)


    The digital load driver with diode protection


    # Beyond intrusion


    Home security is not just about protecting our property against intrusion, it''s
    also about protecting against other risks too, such as flood, fire, carbon monoxide
    leaks, and so on. So, it makes sense to extend our home security system to detect
    these other risks too.


    You may choose to set up the system so that certain types of alerts only come
    to your phone as emails, rather than triggering all of the outside bells, lights,
    and whistles. This can be done by adapting the scripts in the next chapter so
    that they operate how you want them to.


    # A simple water detector


    There''s nothing worse than being away for a few days and coming home to a flooded
    kitchen because a leak has developed under the sink. Our simple circuit will detect
    the presence of water and trigger an input on our home security system, which
    can then alert you. You can also buy kits and ready-built modules to do this,
    but the following circuit is cheap and features our opto-isolator as we''re going
    to have a different voltage for our actual detector.'
  merge: -1
  img_proc: true
- pgno: 419
  md: '![](img/631e8b200cce187082ee46b0eb1681b3_419_0.png)


    # How it works


    When water is placed across the probes, current flows through the water, and so,
    through the R3/R4 potential divider on the base of transistor Q1. When the current
    at the base is high enough to saturate it, the transistor will switch on fully,
    allowing the LED inside the opto-coupler to switch on. This in turn will pull
    down the input pin to our system to ground via the photo-transistor inside the
    optocoupler.


    You can use the trimmer, R4, to calibrate the sensor by adjusting its sensitivity.
    Any generic NPN bipolar transistor should work here, but obviously, they all have
    different operating parameters, so choose a suitable one.'
  merge: -1
  img_proc: true
