- pgno: 120
  md: '# Introducing Computer Vision


    Computer vision is an area of computer science, mathematics, and electrical engineering.
    It includes ways to acquire, process, analyze, and understand images and videos
    from the real world in order to mimic human vision. Also, unlike human vision,
    computer vision can also be used to analyze and process depth and infrared images.
    Computer vision is also concerned with the theory of information extraction from
    images and videos. A computer vision system can accept different forms of data
    as an input, including—but not limited to—images, image sequences, and videos
    that can be streamed from multiple sources to further process and extract useful
    information from it for decision making. Artificial intelligence and computer
    vision share many topics, such as image processing, pattern recognition, and machine
    learning techniques.


    # Introducing OpenCV


    **OpenCV** (short for **Open Source Computer Vision**) is a library of programming
    functions for computer vision. It was initially developed by the Intel Russia
    research center in Nizhny Novgorod, and it is currently maintained by Itseez.


    > You can read more about Itseez at `http://itseez.com/`.


    This is a cross-platform library, which means that it can be implemented and operated
    on different operating systems. It focuses mainly on image and video processing.
    In addition to this, it has several GUI and event handling features for the user''s
    convenience.


    OpenCV was released under a **Berkeley Software Distribution (BSD)** license,
    and hence, it is free for both academic and commercial use. It has interfaces
    for popular programming languages, such as C/C++, Python, and Java, and it runs
    on a variety of operating systems, including Windows, Android, and Unix-like operating
    systems.


    > You can explore the OpenCV homepage, `www.opencv.org`, for further details.'
  merge: -1
  img_proc: true
