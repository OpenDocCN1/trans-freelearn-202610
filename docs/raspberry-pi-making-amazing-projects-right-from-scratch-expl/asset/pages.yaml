- pgno: 422
  md: '![](img/631e8b200cce187082ee46b0eb1681b3_422_0.png)


    The Winsen MQ-7 carbon monoxide gas detector, available from SparkFun.


    > The maximum safe continuous exposure to carbon monoxide (CO) is 9ppm (parts-per-million)
    according to ASHRAE (www.ashrae.org), and you should certainly not be exposed
    to CO higher than this for prolonged periods of time, with 35ppm being the absolute
    maximum for a normal 8-hour working day.


    The MQ-7 detector has a sensitivity of between 10 and 500ppm, so in my mind, I''d
    want to be alerted as soon as it picks up anything, therefore we should set our
    comparator''s reference voltage to the lower end of the scale, in accordance with
    the sensitivity curve taken from the datasheet, shown as follows:


    ![](img/631e8b200cce187082ee46b0eb1681b3_422_1.png)


    The sensitivity curve taken from the Winsen MQ-7 manufacturer''s datasheet.'
  merge: -1
  img_proc: true
- pgno: 423
  md: 'Warning

    I''ve included this section on carbon monoxide detection more for interest than
    anything else. It''s nasty stuff, and while rolling out your own detector is OK
    for interest''s sake, please keep it just for that. It''s useful to have this
    in our home security system to alert us when we''re out of the house as an addition,
    but this *should not* be a replacement for a commercially available one that sits
    next to your boiler with all of the certifications, standards, and so on, and
    makes a very loud noise when we''re in the house.


    # Remote administration for our Raspberry Pi


    In the previous chapter, we learned how to set up our system and home network
    so that we can remotely access the alarm control panel from wherever we are. I''m
    now going to show you how to extend this to be able to administer and monitor
    our entire Raspberry Pi system.


    # Getting Webmin


    **Webmin** is a rather fine and well established web-based interface for administering
    Unix/Linux systems. You can find everything about Webmin on its website at www.webmin.com.
    I''m assuming, as throughout this book, that you are using the Raspbian distribution
    on our Pi when it comes to installing Webmin.


    There are a couple of ways to install Webmin: either by manually downloading and
    unpacking it, or by updating our repository sources so that we can use `apt-get`.
    I''m going to opt for the latter, so any dependencies are automatically installed
    and updates can be managed more easily in the future. There are a few steps, but
    it''s pretty straightforward:


    # Updating the repository sources


    +   1. The first thing we need to do is update our repository sources to include
    the Webmin repositories:

    +      ```

    +      $ sudo nano /etc/apt/sources.list

    +      ```

    +   2. Add the following two lines to the end of the file:

    +      ```

    +      deb http://download.webmin.com/download/repository sarge

    +      contrib

    +      ```'
  merge: -1
  img_proc: true
- pgno: 424
  md: '```

    deb

    http://webmin.mirror.somersettechsolutions.co.uk/repository

    sarge contrib

    ```


    3. Save and exit Nano.


    # Importing the signing key


    1. Next, we need to download and import the repository''s signing key:


    ```

    $ cd ~

    $ sudo wget http://www.webmin.com/jcameron-key.asc

    $ sudo apt-key add jcameron-key.asc

    ```


    2. Now that we have everything we need, we can update the package installer and
    install Webmin. It can take a while, so you might want to go and make yourself
    a cup of tea or coffee:


    ```

    $ sudo apt-get update

    $ sudo apt-get install webmin

    ```


    3. Once it''s installed, you should see the following message in the shell window:


    ![](img/631e8b200cce187082ee46b0eb1681b3_424_0.png)'
