- pgno: 84
  md: '# Working with the Pi Camera and NoIR Camera modules


    These camera modules are specially manufactured for Raspberry Pi and work with
    all the available models. You will need to connect the camera module to the CSI
    port, located behind the Ethernet port, and activate the camera using the `raspi-config`
    utility if you haven''t already.


    > You can find the video instructions to connect the camera module to Raspberry
    Pi at http://www.raspberrypi.org/help/camera-module-setup/.


    This page lists the types of camera modules available: http://www.raspberrypi.org/products/.


    Two types of camera modules are available for the Pi. These are Pi Camera and
    Pi NoIR camera, and they can be found at https://www.raspberrypi.org/products/camera-module/
    and https://www.raspberrypi.org/products/pi-noir-camera/, respectively.


    The following image shows Pi Camera and Pi NoIR Camera boards side by side:


    ![](img/631e8b200cce187082ee46b0eb1681b3_84_0.png)'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'The following image shows the Pi Camera board connected to the Pi:


    ![](img/631e8b200cce187082ee46b0eb1681b3_85_0.png)


    The following is an image of the Pi Camera board placed in the camera case:


    ![](img/631e8b200cce187082ee46b0eb1681b3_85_1.png)


    The main difference between Pi Camera and Pi NoIR Camera is that Pi Camera gives
    better results in good lighting conditions, whereas Pi NoIR (NoIR stands for No-Infra
    Red) is used for low light photography. To use NoIR Camera in complete darkness,
    we need to flood the object to be photographed with infrared light.


    > This is a good time to take a look at the various enclosures for Raspberry Pi
    Models. You can find various cases available online at https://www.adafruit.com/categories/289.'
