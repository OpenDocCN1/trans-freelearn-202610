- pgno: 379
  md: '# Sending attachments


    Now that we can send basic emails from our home security system, let''s try sending
    the still image taken from our camera earlier. But first, we need to install yet
    another package to help us with this:


    ```

    $ sudo apt-get install mpack

    ```


    Once that''s installed, you can send the test image file we took previously by
    using the following command:


    ```

    $ sudo mpack -s "Security Photo" test.jpg me@mydomain.com

    ```


    We now have all of the elements needed to send alerts and images from our home
    security system directly to our smartphone using email.


    # Where was that taken?


    Ordinarily, you could just annotate the email message with where and when the
    attached image was taken, but that wouldn''t be as cool as actually overlaying
    the image with some text, would it? So let''s do some magic with the help of imagemagick,
    which is a popular command-line image manipulation tool. Install it with the following
    line:


    ```

    $ sudo apt-get install imagemagick

    ```


    We''ll now use the command line to take the test photo that we took earlier, overlay
    some text using one of the imagemagick utilities, and save it to another file:


    ```

    $ convert test.jpg -fill red -pointsize 48 annotate +20+60 ''Camera 1'' annotated.jpg

    ```'
  merge: -1
  img_proc: true
- pgno: 380
  md: '# Adding Cameras to Our Security System


    After a few seconds, this will have generated a file called `annotated.jpg` containing
    our image with **Camera 1** written in red in the top corner. When we put all
    of this together in our final system, we''ll also overlay the image with a time
    stamp.


    ![](img/631e8b200cce187082ee46b0eb1681b3_380_0.png)


    > At the moment, the images generated by the `raspistill` tool are pretty large,
    being high resolution photos. This makes manipulating and sending them a bit time-consuming
    as far as processing time is concerned, so when we build our final system, we''ll
    be using the `raspistill` options, `-w`, `-h` and `-q`, to reduce the size and
    quality of the images to make the system more efficient.


    To capture smaller image files, try using the following command:


    ```

    ```bash

    $ raspistill -o test.img -h 768 -w 1024 -q 25

    ```

    ```


    # Night vision


    The standard Raspberry Pi camera is great for taking daytime snaps of people walking
    up the garden path, but when it comes to night time shots, it''s not really suitable.
    There are two ways of dealing with this: the first is to illuminate the capture
    area with a bright light when the PIR detector is triggered, and the second is
    to use the Raspberry Pi **NoIR camera module** and an infra-red LED array to let
    the camera see in the dark. More about that in a minute.'
  merge: -1
  img_proc: true
- pgno: 381
  md: '![](img/631e8b200cce187082ee46b0eb1681b3_381_0.png)


    The Raspberry Pi NoIR camera module; it looks similar to the standard model


    # An illuminating experience


    In order to switch on a light or LED array from the Raspberry Pi GPIO or our port
    expander circuit, we need something that will allow us to drive higher currents
    and voltages than can be provided by the GPIO ports alone.


    A good candidate for this is the TIP120 Darlington transistor, which will allow
    us to switch on and off loads of up to 80V and 5 A from our GPIO pins. In our
    full system later on, we''re going to use Port B of our MCP23017 port expander
    to control outputs, but the principle stands for any of the GPIO outputs available
    to us.


    ![](img/631e8b200cce187082ee46b0eb1681b3_381_1.png)


    TIP120 transistors can be bought cheaply but can drive large loads'
  merge: -1
  img_proc: true
- pgno: 382
  md: 'The following circuit shows how we can drive big loads from our GPIO port outputs.


    ![](img/631e8b200cce187082ee46b0eb1681b3_382_0.png)


    In our example circuit, we''re using a GPIO output pin to control the base of
    our transistor via a 220 ohm resistor. When the GPIO pin goes high, the transistor
    is switched on and allows the 12V circuit to flow through the LED array.


    In the preceding circuit, there is no current limiting for the LEDs because they
    are connected in series, and so with nine of them, each dropping about 1.5V across,
    this is about right for a 12V supply (yes I know I''ve only included six LEDs
    here but it''s just for illustration). Remember to adjust for your particular
    needs. This circuit could easily drive other loads, such as bulbs or sounders.


    > If you intend to drive high power loads, you will probably need to attach the
    TIP120 to a heat sink that will dissipate any heat and prevent it from over-heating
    and burning out. In our circuit that was demonstrated previously, however, you
    probably won''t need one as we''re only driving a couple of hundred milliwatts
    at most.


    # The Elaborate light switch re-visited


    Expanding once again on our elaborate light switch from previous chapters, we
    can once again write a Bash script that will switch on our camera light, take
    a snap with the camera, and e-mail it to us when a PIR detector is triggered.'
  merge: -1
  img_proc: true
- pgno: 383
  md: "For the following script, we're assuming that the output controlling the TIP120\
    \ transistor is the Raspberry PI GPIO17 pin (D0 or pin 11 of our connector), which\
    \ replaces the LED in our earlier set-up. The input from the PIR trigger is, again,\
    \ connected to the GPA0 (port A, data pin 0) of our MCP23017 port expander. All\
    \ the other inputs are tied low, as before, using 10 K resistors:\n\n```\n#!/bin/bash\n\
    \n#set up the High Load GPIO pin\nsudo echo 17 > /sys/class/gpio/export\nsudo\
    \ echo out > /sys/class/gpio/gpio17/direction\n\n#set up port expander Port A\
    \ for inputs\nsudo i2cset -y 1 0x20 0x00 0xFF\n\n#clear the output by default\
    \ to switch light off\nsudo echo 0 > /sys/class/gpio/gpio17/value\n\n# loop forever\n\
    while true\ndo\n  # read the sensor state\n  SWITCH=$(sudo i2cget -y 1 0x20 0x12)\n\
    \n  #PIR is normally closed so pin is held high\n  if [ $SWITCH != \"0x01\" ]\n\
    \  then\n    #PIR was triggered - pin taken low\n\n    #switch on lamp driver\n\
    \    sudo echo 1 > /sys/class/gpio/gpio17/value\n    sleep 0.5\n\n    #take a\
    \ still image\n    sudo raspistill -o -image.jpg -h 768 -w 1024 -q 25\n\n    #email\
    \ the image\n    mpack -s \"Security Alert Photo\" test.jpg me@mydomain.com\n\n\
    \    #switch off the lamp driver\n    sudo echo 0 > /sys/class/gpio/gpio17/value\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 384
