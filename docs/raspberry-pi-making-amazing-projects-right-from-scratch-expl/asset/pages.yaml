    \ -t 20000\n\n        #convert to MP4\n        MP4Box -fps 30 -add $sDate$sTime.h264\
    \ $sDate$sTime.mp4\n    fi\ndone\n```\n```\n\n# You have new mail\n\nHaving the\
    \ images stored on your Raspberry Pi is not really much use—ideally, you would\
    \ want the images sent to you straightaway, as soon as they are captured, so that\
    \ you can view them on your smartphone.\n\nAn easy, quick, and reliable way to\
    \ do this is to simply have them e-mailed to you. Hence we're going to add an\
