  md: '# Movement control in Minecraft Pi


    We can use a mouse to look around and also make use of the following keys for
    the movement:


    | Key | Action |

    | --- | --- |

    | W | Forward |

    | S | Backward |

    | A | Left |

    | D | Right |

    | Spacebar | Jump |

    | Double spacebar | Fly or fall |


    Like most first/third-person games, movement is controlled by WSAD keys on the
    keyboard. The character jumps if spacebar is pressed once. If we hit spacebar
    twice, the character is lifted in the air, as shown in the following screenshot:


    ![](img/631e8b200cce187082ee46b0eb1681b3_52_0.png)'
