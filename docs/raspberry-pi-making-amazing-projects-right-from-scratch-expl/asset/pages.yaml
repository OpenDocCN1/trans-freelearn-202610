- pgno: 323
  md: '# 3


    # Extending Your Pi to Connect More Things


    We''re now going to look at ways to expand the number of things we can connect
    to our Raspberry Pi, overcoming the limitation of having just the 8 digital pins
    available. We''re going to do this by building our own expansion board to give
    us what could in theory be an unlimited number of digital inputs and outputs.


    We''re also going to overcome the limitations of the +3.3V power available to
    us by building our own +3.3V power supply that taps off the Raspberry Pi''s +5V
    supply.


    In this chapter, we will cover the following:


    +   - Looking at the I²C bus in detail

    +   - Learning about serial-to-parallel and parallel-to-serial conversions

    +   - Building a +3.3V power supply

    +   - Building an I2C-based port expander to give us more inputs and outputs

    +   - Looking at alternative ready-made expansion boards


    # Prerequisites


    Along with your Raspberry Pi, you''ll need the following parts for the projects
    in this chapter:


    +   - A copper strip board (or Veroboard®)

    +   - An LD1117V33 voltage regulator

    +   - A 2 x 100nF, 16V ceramic capacitor

    +   - A 10uF, 16V electrolytic capacitor'
  merge: -1
  img_proc: true
- pgno: 324
  md: '+   - A 1 x MCP23017 16-bit port expander IC

    +   - A 4 x 10K-ohm resistor

    +   - A hook-up wire


    # The I2C bus


    In the previous chapter, we briefly touched on the I2C bus (or Inter-Integrated
    Circuit bus), which is a way to connect multiple devices together using just two
    wires. I2C was invented in the early 1980s by Philips as a way to link computer
    peripherals together using a common protocol. You can think of I2C as a kind of
    early form of USB.


    I2C typically operates at relatively low speeds of up to 100kbit/s, compared to
    much faster interfaces such as Ethernet, which typically operates at up to 1Gbit/s,
    or USB, which can operate at up to 480Mbit/s. However, this is fast enough to
    connect basic sensors, display devices, or other peripherals such as real-time
    clocks – in fact; there are faster versions of the protocol that some devices
    will support.


    # Just 2 wires


    I2C is a bi-directional serial communication protocol that operates over two wires:


    +   - The Serial Data Line (SDA) wire transmits the data to and from the master
    device. Referring back to the GPIO reference in Chapter 2, Connecting Things to
    Your Pi with GPIO, this is pin 3 of the GPIO connector.

    +   - The Serial Clock Line (SCL) wire handles all timing and flow control for
    the data on the bus. This is pin 5 of the GPIO connector.


    You''ll remember that we spoke about pull-up resistors, in the previous chapter,
    which ensure that the GPIO digital inputs are pulled to a known state. Well, this
    is required for the two lines on the I2C bus, and by default the lines should
    be pulled high with resistors. However, on the Raspberry Pi, this has already
    been done for us, so we don''t need to worry about it in our case.


    # What''s your address?


    So, if we can use just two wires to communicate with multiple devices, how does
    our Raspberry Pi know which device to talk to? This is where the I2C protocol
    comes into its own. Each device connected to the bus has its own unique ID, or
    address, made up of 7-bits or 10-bits. Some devices will allow you to set the
    address to ensure that it''s unique within your system, but other devices have
    their addresses hardcoded by the manufacturer.'
  merge: -1
  img_proc: true
- pgno: 325
  md: 'The two addressing methods (7- and 10-bit) are interoperable and you can have
    devices on the same bus that use either method, since the Raspberry Pi itself
    supports both methods. So, with a 10-bit addressing scheme, you can see that we
    can connect a lot of things to our Raspberry Pi using the I2C bus, as compared
    to the limited number of digital pins on the GPIO!


    # There is a parallel universe


    Data is normally transmitted in serial mode or parallel mode, depending on things
    such as the required data speed, cable distance, and functionality. Most data
    communication between systems is transmitted in serial mode over a couple of wires,
    such as the I2C bus mentioned earlier, but this also includes things such as the
    Ethernet, RS232/422, and USB.


    Within a computer system, data is transmitted in parallel mode using buses whose
    width matches the word size of the digital system communicating between chips.
    In parallel mode, all bits of the data word are transmitted simultaneously over
    their respective data lines within the bus, rather than as sequential bits along
    a single line.


    The digital I/O pins we''ve been talking about (including the ones on the Raspberry
    Pi''s GPIO connector) are usually grouped together as a parallel bus. On our system,
    we''ll be using parallel buses (groups of digital I/O pins) that are 8-bits wide.
    That is, the bus has 8 wires that can be set or read using 8-bit binary values
    (our word size).


    ![](img/631e8b200cce187082ee46b0eb1681b3_325_0.png)


    A representation of an 8-bit data bus'
  merge: -1
  img_proc: true
- pgno: 326
  md: '# Extending Your Pi to Connect More Things


    So, in the preceding diagram we have the 8 digital I/O wires on our bus. If we
    wanted to make the bits (or wires) 0, 1, and 4 **high** or **on**, with the rest
    low or off, then we''d address the bus and set it to the following values:


    +   - In binary, this would be `00010011`

    +   - In hex, this would be `0x13`

    +   - In decimal, this would be 19 (represented by `16+2+1`)


    So, in other words, to switch on data lines 0, 1, and 4, we send the byte value,
    19, to the bus''s address.


    # Serial-to-parallel conversion


    So, now that we know what numbers to send to our bus to switch on or switch off
    certain digital outputs, or read certain digital inputs, how do we do this using
    our I2C bus, which is a serial interface?


    Fortunately, there are many **integrated circuits (ICs)** available that allow
    us to do this simply and easily. These ICs are called **shift registers** and
    perform **serial-to-parallel conversions**, taking the data from the serial I2C
    bus and converting the incoming bits to a parallel representation by setting each
    of the parallel bus outputs.


    When reading the parallel bus data lines as inputs, the reverse happens, converting
    the bits into a serial form on the I2C bus; this is known as **parallel-to-serial
    conversion**.


    This is quite a simplistic overview and there are many resources available that
    explain these operations; we''ll see this in action later in the chapter, but
    first…


    # Give me power


    You''ll remember from the previous chapter that most things to do with the GPIO
    operate on a +3.3V level, rather than the +5V level that is often associated with
    digital circuits. This is the same with our I2C-based shift registers – they need
    to operate on +3.3V levels as well, in order to work with the Raspberry Pi.


    You''ll also recall, however, that there''s not much +3.3V juice available directly
    from the Raspberry Pi – in fact, just 50mA. This is really not enough for our
    interface. So, before we go any further, we''re going to build our own +3.3V power
    supply, which is sufficient for our system.'
  merge: -1
  img_proc: true
- pgno: 327
  md: 'For our power supply, we''re going to use a basic 3.3V **voltage regulator**
    (type **LD1117V33**) that will take our slightly more plentiful +5V supply from
    the Raspberry Pi and regulate it to a nice smooth +3.3V supply. We should be able
    to draw a few hundred milliamps from this supply—enough for the I/O circuitry
    on our security system.


    The parts required for our power supply are as follows:


    +   - A LD1117V33 voltage regulator

    +   - A 100nF, 16V ceramic capacitor

    +   - A 10uF, 16V electrolytic capacitor


    Here''s the circuit diagram for our +3.3V power supply:


    ![](img/631e8b200cce187082ee46b0eb1681b3_327_0.png)


    As with all our components, the LD1117V33 regulator is widely available from many
    electronic component suppliers.'
  merge: -1
  img_proc: true
- pgno: 328
  md: '# Extending Your Pi to Connect More Things


    Our power supply can be easily built on a small piece of strip board like this:


    ![](img/631e8b200cce187082ee46b0eb1681b3_328_0.png)


    > The strip board is shown from the top in the preceding layout. That is, the
    copper tracks are on the underside of the board and the components are inserted
    from the plain top-side and soldered to the strips underneath. In this layout,
    it''s not necessary to cut any of the tracks on the strip board.


    # Building an I2C expander


    Right, now that we''ve worked out what we need to do to give us more digital I/O
    pins, and built our power supply for it, we can build our expansion port.


    To do this, we''re going to use a chip designed exactly for the job: the MCP23017,
    manufactured by Microchip and widely available from electronic suppliers.'
  merge: -1
  img_proc: true
- pgno: 329
  md: 'The MCP23017 is an integrated circuit that connects directly to the I2C bus
    (the SDA and SCL pins we talked about earlier) and gives us 16 bi-directional
    input and output pins. If required, we can connect up to 8 of these chips to the
    same bus, giving us up to 128 inputs and outputs (yes, I know that I said "virtually
    unlimited" previously, but I''ll explain later).


    ![](img/631e8b200cce187082ee46b0eb1681b3_329_0.png)


    An MCP23017 integrated circuit pinout


    > The full datasheet for the MCP23017 is available on Microchip''s site, which
    can be found at www.microchip.com/MCP23017.


    # The I2C port expander circuit


    The basic parts you will need to build your port expander are as follows:


    +   - A 1 x MCP23017 16-bit port expander IC

    +   - A 4 x 10K-ohm resistor

    +   - A 1 x 100nF, 16V ceramic capacitor

    +   - A copper strip board (or Veroboard®)

    +   - A hook-up wire'
  merge: -1
  img_proc: true
- pgno: 330
  md: 'Here''s the circuit diagram for our I2C port expander circuit. It looks complicated,
    but actually most of the lines are for connections to the outside world:


    ![](img/631e8b200cce187082ee46b0eb1681b3_330_0.png)


    # Let''s walk through the circuit


    On the right-hand side, the connector, CN1, is our Raspberry Pi GPIO connector—note
    that we''re only using four of the pins:


    +   - The +5V Output (Pin 2)

    +   - The I2C SDA (Pin 3)

    +   - The I2C SCL (Pin 5)

    +   - The 0V/GND (Pin 6)


    You''ll see my friend, the +3.3V regulator (U1, C1, and C2), discussed earlier.
    This takes the +5V output from the Raspberry Pi and gives us our +3.3V for use
    by the rest of the circuit.


    The main component is U2—our MCP23017 port expander chip. Pins 9 and 10 on the
    chip are connected to the +3.3V supply and the GND, respectively, and C3 is used
    as a discoupling capacitor close to the chip to reduce any noise on the power
    supply.'
  merge: -1
  img_proc: true
- pgno: 331
  md: 'The MCP23017 can be used as a 16-bit expander, or as 2 x 8-bit expanders. In
    our circuit, we have split the device to give us 2 x 8-bit busses: I/O Bus A and
    I/O Bus B. Each pin on the busses can be programmed to work as an input or output.


    # Connecting things to the input/output pins


    The input and output pins on our busses can''t usually be connected to things
    directly – they provide limited current and need to be interfaced correctly to
    things such as buzzers and lights; they must also be protected against damaging
    input signals. In the next chapter, we''ll learn how to connect safely to our
    I/O ports.


    The I2C SDA/SCL lines from the Raspberry Pi are connected to pins 12 and 13 of
    the chip. You''ll see that there are also additional I2C outputs (PL1 to PL3)
    to illustrate that we can connect other devices to the I2C bus, such as another
    MCP23017 chip to give us a further 16 digital I/Os.


    Resistor R1 is used to hold the RESET pin (18) high. By bringing this pin low,
    you can reset the chip.


    Resistors R2 to R4 are used to hold the address pins A0 to A2 (pins 15-17) low.


    # Highs and lows


    When we use the terms high and low in respect to digital pins or inputs, we are
    simply describing whether the logic level of the pin is at a binary 1 or 0, respectively.
    Digital pins don''t like to be left floating – whereby they are neither high nor
    low – as this can cause unpredictable operations. Therefore, we always make sure
    they are held at a determined logic level. In general, connecting the pin to 0V
    (or ground) ensures that it''s held at logic level 0, and connecting to the positive
    supply (e.g. 3.3V) ensures that it''s held at logic level 1.


    Remember I mentioned earlier that you can connect a large number of devices to
    the I2C bus in order to give us a virtually unlimited number of I/O pins? Well,
    actually in many cases, this is not strictly true. This is because of the addressing
    scheme for I2C devices, which makes all devices identifiable when they are all
    connected to the same two wires (their unique address). The address of each device
    is agreed upon in advance by manufacturers to make sure that everyone''s devices
    will work together on the same bus without creating conflicts. As such, the address
    is pre-programmed into the device.'
  merge: -1
  img_proc: true
- pgno: 332
  md: 'The MCP23017 has been given its unique base address, but can be modified by
    changing the address pins A0-A2 high or low; thus, in effect, it can be configured
    to be one of 8 addresses. This is why you can only have a maximum of 8 of these
    chips on the same I2C bus, giving us a theoretical maximum of 128 I/O pins (that
    is, 16 I/Os x 8 chips).


    # Building your expansion board


    This circuit can easily be built on a small piece of stripboard. The following
