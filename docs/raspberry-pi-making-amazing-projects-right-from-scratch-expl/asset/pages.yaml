- pgno: 249
  md: '# 14


    # Network Programming in

    Python with the Pi


    A network socket is an endpoint of a connection across computer networks. Nowadays,
    almost all communication between computers and distinct networks is based on the
    Internet Protocol, which uses sockets as a basis of communication. A socket is
    an abstract reference that a local program can pass to the network API to make
    use of a connection. Sockets are internally often represented in network programming
    APIs simply as integers, which identify which connection to use. In brief, we
    will be covering the following topics in this chapter:


    +   - The basics of sockets

    +   - The difference between TCP and UDP sockets

    +   - UDP sockets

    +   - TCP sockets

    +   - The Telnet program

    +   - A chat application


    # The basics of sockets


    A socket API is an application programming interface, provided by the operating
    system (OS), that allows application programs to initiate, control, and use network
    sockets programmatically for communication. Internet socket APIs are usually based
    on the Berkeley sockets standard. In the Berkeley sockets standard, sockets are
    a form of file descriptor, adhering to the Unix philosophy that everything is
    a file. Thus, we can read, write, open, and close sockets in the same way as we
    do files. In inter-process communications, each end will have its own socket,
    but these may use different socket-programming APIs. However, they are abstracted
    by the network protocol.'
  merge: -1
  img_proc: true
- pgno: 250
  md: 'A socket address is a combination of an **Internet Protocol (IP)** address
    and a port number. Internet sockets deliver and receive data packets to and from
    the appropriate application process or thread. On a computer with an IP address,
    every network-related program or utility will have its own unique socket or set
    of sockets. This ensures that the incoming data is redirected to the correct application.


    # The difference between TCP and UDP


    There are two types of protocols in the IP suite. They are **Transmission Control
    Protocol (TCP)** and **User Datagram Protocol (UDP)**. TCP is a connection-oriented
    IP which means that once a connection is established, data can be sent in a bidirectional
    manner. UDP is a much simpler, connectionless Internet protocol. Multiple messages
    are sent as packets in chunks using UDP. Let''s distinguish between the two with
    clear points, as follows:


    | TCP | UDP |

    |---|---|

    | TCP is a connection-oriented protocol. | UDP is a connectionless protocol. |

    | Using this mode, a message makes its way across the Internet from one computer
    and network to another. This is connection based. | UDP is also a protocol used
    in message transport or transfer. It is not a connection-based protocol. A program
    using UDP can send a lot of packets to another, and that would be the end of the
    relationship. |

    | TCP is suited to applications that require high reliability, and transmission
    time is relatively less critical. | UDP is suitable for applications that need
    fast, efficient transmission, such as games and live-streaming videos. |

    | Protocols utilizing TCP include HTTP, HTTPS, FTP, SMTP, and Telnet. | Protocols
    utilizing UDP include DNS, DHCP, TFTP, SNMP, RIP, and VoIP. |

    | Data is read as a stream of bytes; no distinguishing indications are transmitted
    to signal message segment boundaries. | Packets are sent individually and are
    checked for integrity only on arrival. Packets have headers and endpoints. |

    | TCP performs error checking. | UDP performs error checking. However, it has
    no recovery options for missed or corrupt packets. |

    | The data transferred remains intact and arrives in the same order (known as
    in-order) in which it was sent. | There is no guarantee that the messages or packets
    sent will reach at all or will be in the same order as transmitted. |'
  merge: -1
  img_proc: true
