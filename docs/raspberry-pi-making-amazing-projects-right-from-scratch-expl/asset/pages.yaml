- pgno: 19
  md: '# 1

    Introduction to Raspberry Pi

    and Python


    One can learn about topics in computer science in an easy way with the Raspberry
    Pi and Python. The Raspberry Pi family of single-board computers uses Python as
    the preferred development language. Using Raspberry Pi and Python to learn programming
    and computer science-related concepts is one of the best ways to start your journey
    in this amazing world of computers that is full of creative possibilities. We
    will explore these possibilities in this book.


    We will commence our journey in this chapter by getting ourselves familiar with
    the following topics:


    +   - Single-board computers

    +   - Raspberry Pi

    +   - Raspbian

    +   - Setting up Raspberry Pi

    +   - Basics of Python

    +   - Turtle programming with Python


    # Single-board computers


    A single-board computer system is a complete computer on a single circuit board.
    The board includes a processor(s), RAM, input/output (I/O), and networking ports
    for interfacing devices. Unlike traditional computer systems, a single-board computer
    is not modular and its hardware cannot be upgraded as it is integrated on the
    board itself. Single-board computers are used as low-cost computers in academia,
    research, and embedded systems. The use of single-board computers in embedded
    systems is quite prevalent and many individuals and organizations have developed
    and released fully functional products based on single-board computers.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Introduction to Raspberry Pi and Python


    The Microcomputer Trainer MMD-1 designed by John Titus in 1976 is the first true
    single-board microcomputer that was based on the Intel C8080A. It was called **dyna-micro**
    in the prototyping phase, and the production units were called **MMD-1** (short
    for **Mini Micro Designer 1**).


    Popular single-board computers available in the market include but are not limited
    to Raspberry Pi, Banana Pro, BeagleBone Black, and Cubieboard. The following images
    are of the front view of BeagleBone Black, Banana Pro, and Cubieboard 4, respectively:


    ![](img/631e8b200cce187082ee46b0eb1681b3_20_0.png)'
  merge: -1
  img_proc: true
- pgno: 21
  md: "# # Raspberry Pi\n\nThe Raspberry Pi is a series of low-cost, palm-sized single-board\
    \ computers developed by Raspberry Pi Foundation in the UK. The intention behind\
    \ the creation of the Raspberry Pi is to promote the teaching of basic computer\
    \ skills in schools, which it serves very well. Raspberry Pi has expanded its\
    \ footprint well beyond its intended purpose by penetrating the embedded systems\
    \ market and computer science research.\n\n![](img/631e8b200cce187082ee46b0eb1681b3_21_0.png)\n\
    \n> This is the home page of Raspberry Pi Foundation:\n> \n> http://www.raspberrypi.org.\n\
    \nThe Raspberry Pi is manufactured with licensed agreements with Newark element14,\
    \ RS Components, Allied Electronics, and Egoman. These companies manufacture and\
    \ sell the Raspberry Pi. The hardware is the same across all manufacturers.\n\n\
    The following table displays the URLs of the manufacturers' websites, where you\
    \ can shop for Pi and related items online:\n\n| Manufacturer | Website |\n|---|---|\n\
    | Newark element14 | `http://www.newark.com` |\n| RS Components | `http://uk.rs-online.com`\
    \ |\n| Egoman | `http://www.egoman.com.cn` |\n| Allied Electronics | `http://www.alliedelec.com`\
    \ |\n\nYou can also shop for Pi and the other third-party add-ons at the following\
    \ links:\n\n+   - `http://shop.pimoroni.com`\n+   - `http://www.adafruit.com`\n\
    \n# # Raspberry Pi models\n\nThe following are, at the time of writing this, the\
    \ major models of Raspberry Pi:\n\n+   - Model A (not in production; discontinued\
    \ in favor of the production of later and upgraded models)\n+   - Model A+ (currently\
    \ in production and available for purchase)\n+   - Model B (available for purchase\
    \ but not in production)\n+   - Model B+ (currently in production and available\
    \ for purchase)\n+   - Raspberry Pi 2 Model B (currently in production and available\
    \ for purchase)"
  merge: -1
  img_proc: true
- pgno: 22
  md: 'Check out the **Product** page of Raspberry Pi at

    http://www.raspberrypi.org/products/.


    Additionally, Raspberry Pi is also available in a more flexible form factor intended
    for industrial and embedded applications. It is known as **Compute Module**. A
    Compute Module prototyping kit is also made available by the foundation.


    Check out the following URLs for the Compute Module and Compute Module development
    kit, respectively:

    http://www.raspberrypi.org/products/compute-module/

    http://www.raspberrypi.org/products/compute-module-development-kit/


    The following table compares the currently available models of Pi:


    | | Model A | Model B | Model B+ | Pi 2 Model B |

    |---|---|---|---|---|

    | SOC (System on a chip) | Broadcom BCM2835(CPU, GPU, DSP, SDRAM, one USB port)
    |  |  | Broadcom BCM2836 (CPU, GPU, DSP, SDRAM, one USB port) |

    | CPU | 700 MHz single-core ARM1176JZF-S |  |  | 900 MHz quad-core ARM Cortex-A7
    |

    | GPU | Broadcom videoCore IV @ 250 MHz |  |  |  |

    | Memory (shared with GPU) | 256 MB SDRAM | 516 MB SDRAM |  | 1 GB SDRAM |

    | USB 2.0 ports | 1 | 2 |  | 4 |

    | On Board Storage | MicroSD slot | SD / MMC / SDIO card slot |  | MicroSD slot
    |

    | Networking | None | 10/100 Mbit/s Ethernet, no Bluetooth or Wi-Fi |  |  |

    | Power Source | 5V via Micro USB or GPIO Headers ( Power supply through micro
    USB is recommended.) |  |  |  |

    | Power Ratings | 200mA (1 W) | 700mA (3.5 W) | 600mA (3.5 W) | 800mA (4 W) |'
  merge: -1
