- pgno: 436
  md: '# Setting up the GPIO


    We now need to set up the Raspberry Pi''s GPIO pins for our purposes, as outlined
    by the earlier system diagram. The following commands were first discussed in
    Chapter 2, Connecting Things to Your Pi with GPIO:


    ```

    # GPIO SET UP ########################################

    #Set up the Raspberry Pi GPIO pins

    #Refer to Chapter 2 for info

    #D0 (GPIO17) Arm/Disarm Key Input

    sudo echo 17 > /sys/class/gpio/export

    sudo echo in > /sys/class/gpio/gpio17/direction


    #D4 (GPIO23) Armed LED Output

    sudo echo 23 > /sys/class/gpio/export

    sudo echo out > /sys/class/gpio/gpio23/direction

    sudo echo 0 > /sys/class/gpio/gpio23/value


    #D5 (GPIO24) Exit Buzzer Output

    sudo echo 24 > /sys/class/gpio/export

    sudo echo out > /sys/class/gpio/gpio24/direction

    sudo echo 0 > /sys/class/gpio/gpio24/value


    #D6 (GPIO25) Alarm LED Output

    sudo echo 25 > /sys/class/gpio/export

    sudo echo out > /sys/class/gpio/gpio25/direction

    sudo echo 0 > /sys/class/gpio/gpio25/value


    #D7 (GPIO4) Alarm Bell Output

    sudo echo 4 > /sys/class/gpio/export

    sudo echo out > /sys/class/gpio/gpio4/direction

    sudo echo 0 > /sys/class/gpio/gpio4/value

    ```


    > Note that you can only export a GPIO pin once, unless it has been subsequently
    unexported. Therefore, you might see the error, echo: write error: Device or resource
    busy, if you re-run the script when it tries to export the pin again. You can
    safely ignore this.


    We''ll also throw in a few helper functions that will easily allow us to switch
    on or off various outputs to simplify the main code. I''m a big fan of implementing
    functions, however simple, as they keep the code modular, reusable, and simpler
    to read in most cases:


    ```

    #This helper function will switch a specified GPIO output on or off

    function almSetGPIOValue()

    ```'
  merge: -1
  img_proc: true
- pgno: 437
