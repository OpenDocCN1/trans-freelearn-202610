- pgno: 56
  md: '# Other controls in Minecraft Pi


    When a game is running, pressing the Tab key will take the focus away from the
    game, and the mouse cursor will be freed to enable interaction with other windows
    on the desktop. Pressing Esc will pause the game and will take us to the game
    menu, where we can toggle views (as seen earlier), enable/disable sound, and quit
    the main window.


    > Now, with all this information on the movements and the actions in the Minecraft
    Pi virtual game world, try to create a few things before continuing with the remainder
    of this chapter.


    # Python programming for Minecraft Pi


    Minecraft Pi comes with the Python programming interface. This means that it''s
    possible to script the action of a character in the game using Python. In this
    section, we will learn how to use Python programming to script the character actions
    as well as create amazing effects in the Minecraft world.


    Start Minecraft Pi and create the world. Once it''s done, while the game is running,
    free the mouse by pressing the Tab key and opening lxterminal. Create the /home/pi/book/chapter02
    directory. Navigate to the directory and write the following code in the prog1.py
    file:


    ```

    import mcpi.minecraft as minecraft


    mc = minecraft.Minecraft.create()


    mc.postToChat("Hello Minecraft World!")

    ```


    The preceding program first imports the Minecraft Pi Python API. The second statement
    creates the connection to Minecraft, and the third statement posts the message
    to the game chat.'
