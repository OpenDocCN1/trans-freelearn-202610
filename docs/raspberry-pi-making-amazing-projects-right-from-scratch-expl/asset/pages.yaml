  md: '# # Introducing GPIO pins


    Most of you may know where GPIO pins are located on the Raspberry Pi. If not,
    the following illustration will make it clear:


    ![](img/631e8b200cce187082ee46b0eb1681b3_92_0.png)


    The following is a top view of the Raspberry Pi B+ board, which will help you
    see the components even more clearly:


    ![](img/631e8b200cce187082ee46b0eb1681b3_92_1.png)'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'The following diagram of the GPIO pins gives information about the naming convention
    and the function of each of the pins:


    > Note that the GPIO pins of Raspberry Pi B+ and Pi 2 are the same.


    ![](img/631e8b200cce187082ee46b0eb1681b3_93_0.png)


    As you can see from the preceding diagram, there are four power pins, two for
    3.3V and two for 5V, 8 ground pins distributed across the rail, 26 GPIO pins—some
    of which also provide protocols such as UART, SPI, PCM, PWM, I2C—and two pins
    reserved for accessing the EEPROM via I2C.


    GPIO pins can be ON or OFF and HIGH or LOW. When a 3.3V pin is high, it outputs
    3.3V, and when it is low, it outputs 0V. A GPIO pin can act as an input as well
    as an output but not both at the same time. To use it as an output is as simple
    as setting the pin state to ON or OFF.'
  merge: -1
  img_proc: true
- pgno: 94
  md: "To use GPIO pins, we will use a simple Python library called RPi.GPIO, which\
    \ takes out all the effort and makes it easy to configure and use the pins. Configuring\
    \ a pin to be an output or an input requires only a single statement. We will\
    \ now see how to manipulate GPIO pins to use this library.\n\nTake care to use\
    \ Broadcom chip names for the GPIO pins. You can look this up in the diagram given\
    \ earlier. If our pin has been set to the output mode, we can also set its activation\
    \ or voltage level to HIGH or LOW. Keep in mind that in the case of the Raspberry\
    \ Pi, high voltage is represented by 3.3V, and low voltage is represented by 0V.\
    \ It will be damaging for the Raspberry Pi if you connect a 5V device to its 3.3V\
    \ GPIO pins. However, you can use two 5V pins to power a small add-on, such as\
    \ an LED or a buzzer. If you plan to use anything that requires more current,\
    \ ensure that you use a separate power supply as the Pi can supply only a limited\
    \ current. So, directly powering a motor from the Pi is not a good idea.\n\nYou\
    \ can do amazing things with the input pins. Not only can you take inputs from\
    \ a button, but you can also connect sensors, such as a light sensor, smoke sensor,\
    \ and temperature sensor to build all kinds of amazing projects. You can also\
    \ use an Internet-connected Raspberry Pi to control your outputs from anywhere\
    \ in the world! But the networking part is outside the scope of this chapter.\n\
    \nA simple project at this point would be to build a simple LED blinking program.\
    \ So let's see how that works!\n\n# Building an LED Blinker\n\nFor this project,\
    \ you will require a humble low-power LED with the color of your choice, which\
    \ can be obtained at your local hardware store or can be ordered online. The Raspberry\
    \ Pi will act as both the switch and the power supply. In fact, we will power\
    \ and switch the LED from the same output pin. The complete code and the wiring\
    \ diagram has been given here. We will learn the code line by line following the\
    \ diagram. Connect your LED to the Raspberry Pi, as shown. In an LED, the longer\
    \ leg is the positive pin by convention, and the shorter leg has negative polarity.\
    \ So take care to connect it the right way, or it might get damaged:\n\n```\n\
    import RPi.GPIO as GPIO\nimport time\n\nGPIO.setmode(GPIO.BOARD)\nGPIO.setup(7,\
    \ GPIO.OUT)\n\ndef Blink(speed):\n    GPIO.output(7,True)\n    time.sleep(speed)\n\
    ```"
