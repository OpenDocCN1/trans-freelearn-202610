- pgno: 575
  md: '# 7

    Accessing Your Biped Remotely


    Now that your biped is up and running, you''ll want to able to send it on its
    way into the world, but still be able to monitor and control it remotely. This
    will help you in development as well as deployment and will open up all sorts
    of new scenarios and applications.


    In this chapter, you will learn:


    +   - How to add a wireless LAN dongle to your biped robot and set it up as a
    wireless access point

    +   - How to control your biped robot using this access and a joystick

    +   - How to use the wireless LAN connection to get First Person Video (FPV) back
    so that you can see what your biped robot is seeing


    # Adding a wireless dongle and creating an access point


    In Chapter 1, Configuring and Programming Raspberry Pi, you learned how to add
    a wireless dongle and have the Raspberry Pi connect to your wireless network.
    This is a useful way to access the Raspberry Pi, but if you want to take your
    robot outside the coverage of your wireless LAN, you''ll want to set it up as
    an access point.'
  merge: -1
  img_proc: true
- pgno: 576
  md: '# Accessing Your Biped Remotely


    The first step in doing this is to install the wireless LAN device. One device
    that is inexpensive and easy to configure is the Edimax Wifi Adapter device (the
    product information is available at http://www.edimax.com/edimax/merchandise/merchandise_detail/data/edimax/global/wireless_adapters_n150/ew-7811un).
    It is available at most online electronic outlets:


    ![](img/631e8b200cce187082ee46b0eb1681b3_576_0.png)


    Once you have installed the device and booted Raspberry Pi, type lsusb command.
    This should display something like the following screenshot:


    ![](img/631e8b200cce187082ee46b0eb1681b3_576_1.png)'
  merge: -1
  img_proc: true
- pgno: 577
  md: 'The Edimax device is listed in the set of devices connected to the USB port.

    Now, execute the following steps:


    +   1. Make sure that you have `hostapd` installed by typing `sudo apt-get install
    hostapd`. This application is a background application that controls the configuration
    of wireless on Raspberry Pi.

    +   2. The default version of `hostapd` unfortunately does not support the Edimax
    chipset by default. So, you''ll need to download a version that does by typing
    `wget http://www.daveconroy.com/wp3/wp-content/uploads/2013/07/hostapd.zip`.

    +   3. Now, unzip this file by typing `unzip hostapd.zip`.

    +   4. Make a backup of your original `hostapd` application by typing `sudo mv
    /usr/sbin/hostapd /usr/sbin/hostapd.bak`. This way, you''ll have it if you want
    to restore it later.

    +   5. Now, move the new version of `hostapd` to the proper directory by typing
    `sudo mv hostapd /usr/sbin/hostapd.edimax`.

    +   6. For the next step, type `sudo ln -sf /usr/sbin/hostapd.edimax /usr/sbin/hostapd`;
    this will create a soft link to the new file so that it will be executed as the
    `hostapd` application.

    +   7. Type `sudo chown root.root /usr/sbin/hostapd`, and this will change the
    owner and the group of this file to root.

    +   8. Type `sudo chmod 755 /usr/sbin/hostapd` to make this file executable to
    the owner.

    +   9. Now you will want to configure your wireless access point. Edit the file
    by typing `sudo emacs /etc/hostapd/hostapd.conf` so that it looks like the following
    screenshot:


    ![](img/631e8b200cce187082ee46b0eb1681b3_577_0.png)'
  merge: -1
  img_proc: true
- pgno: 578
  md: '10. You''ll now want to edit the `/etc/network/interfaces` file, as shown in
    the following screenshot:


    ![](img/631e8b200cce187082ee46b0eb1681b3_578_0.png)


    11. This will set the address of the access point to **10.10.0.1**.


    12. Now, type `sudo apt-get install isc-dhcp-server` to install a dhcp server
    so that devices that connect to it will be able to get a dynamic address.


    13. Now, edit the `/etc/dhcp/dhcpd.conf` and add these lines:


    ![](img/631e8b200cce187082ee46b0eb1681b3_578_1.png)'
  merge: -1
  img_proc: true
- pgno: 579
  md: '14. The next step is to edit the /etc/default/hostapd so that this will all
    start at power up by adding this line:


    ![](img/631e8b200cce187082ee46b0eb1681b3_579_0.png)


    15. Now type the following two commands; sudo update-rc.d hostapd enable and sudo
    update-rc.d isc-dhcp-server enable and then reboot the Raspberry Pi.


    You should now be able to connect to your Raspberry Pi as a wireless access point.


    # Adding a joystick remote control


    Now that you can access your Raspberry Pi from a remote computer, you can SSH,
    just like you may have been doing with a wired connection, issue commands, and
    even control the biped using the remote computer. This introduces a number of
    different possibilities, one of which is to control your project with a joystick
    connected to the remote computer.


    To add the game controller, you''ll need to first find a game controller that
    can connect to your computer. If you are using Microsoft Windows as the OS on
    the host computer, pretty much any USB controller that can connect to a PC will
    work. The same type of controller also works if you are using Linux for the remote
    computer. In fact, you can use another Raspberry Pi as the remote computer.'
  merge: -1
  img_proc: true
- pgno: 580
  md: 'Since the joystick will be connected to the remote computer, you''ll need to
    run two programs: one on the remote computer and one on the Raspberry Pi on the
    biped robot. You''ll also need a way to communicate between them. In the following
    example, you''ll use the wireless LAN interface and a client-server model of communication.
    You''ll run the server program on the remote computer, and the client program
    on the Raspberry Pi on the biped robot.


    > For an excellent tutorial of this type of model and how it is used in a gaming
    application, see http://www.raywenderlich.com/38732/multiplayer-game-programming-for-teens-with-python.


    The first step is to simply plug in your USB game controller to the remote computer.
    Once you have the controller connected to the remote computer, you''ll need to
    create a Python program on the Raspberry Pi that will take the signals sent from
    the remote computer client and send the control to the server running on Raspberry
    Pi so that you can send the correct signals to the servos on your biped.


    Before you do this, you''ll need to install the libraries on Raspberry Pi that
    will allow this to work. The first is a library called pygame. Install this by
    typing sudo apt-get install python-pygame. You''ll also need to install a set
    of Python install tools by typing sudo apt-get install python-setuptools. Then,
    you''ll need a LAN communication layer library called PodSixNet. This will allow
    the two applications, the client on the remote computer and the server running
    on Raspberry Pi, to communicate. To install this, follow the instructions at http://mccormick.cx/projects/PodSixNet/.
    Now you are ready to create the program on Raspberry Pi on the biped. The first
    part of the program is the Python functions from the program you created in Chapter
    3, Motion for the Biped. In this section, you''ll create a class called QuadGame.
    This class will take the inputs from the game controller connected to the server
    and turn them into commands that will be sent to the servo controller for your
    biped robot.


    The following is a table of those controls:


    | Joystick control | Biped control |

    |---|---|

    | Button 2 | Robot home position |

    | Button 1 | Robot turn right |

    | Button 3 | Robot turn left |

    | Joystick Up | Robot walk forward |'
  merge: -1
  img_proc: true
- pgno: 581
  md: 'Now, the following is the initial part of the code, the Python import statements:


    ![](img/631e8b200cce187082ee46b0eb1681b3_581_0.png)


    And the following is the BoxesGame class, the code that will respond to the joystick:


    ![](img/631e8b200cce187082ee46b0eb1681b3_581_1.png)'
