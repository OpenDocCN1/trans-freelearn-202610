- pgno: 302
  md: '# Setting Up Your Raspberry Pi


    Type the IP address of the Raspberry Pi into the Host Name box and click on Open.
    You''ll be connected to your Pi in a remote terminal window. Once you''ve logged
    in, you can do pretty much everything on your Pi, as if you were sitting in front
    of it.


    ![](img/631e8b200cce187082ee46b0eb1681b3_302_0.png)


    We''ll assume from now on that most of the work we do will be through a remote
    shell session, unless highlighted otherwise.


    If you want to use the command line to launch the Raspberry Pi remote shell—for
    example, from another Linux system—use the following command from your terminal
    window:


    ```

    # ssh pi@192.168.0.125

    ```'
  merge: -1
  img_proc: true
- pgno: 303
  md: 'You''ll then be prompted for the Pi''s password and taken into a shell session.


    ![](img/631e8b200cce187082ee46b0eb1681b3_303_0.png)


    The Pi shell session launched from a Debian desktop terminal window


    # Getting up to date


    Something that you should get into the habit of doing is updating the operating
    system regularly; even though you may have the latest image installed, it''s very
    likely that there are updated packages available. To update your OS, enter the
    following command:


    ```

    $ sudo apt-get update

    ```


    After this, enter the following one:


    ```

    $ sudo apt-get dist-upgrade

    ```


    This may take a while, depending on the number of updates required.


    # Getting the right time


    The Raspberry Pi doesn''t have on-board real-time clock hardware. This is one
    of the deliberate omissions to keep the cost of the board down. Instead, the Pi
    gets its time when it boots up from time servers on the Internet using the Network
    Time Protocol (NTP). However, if there is no Internet connection at the time of
    booting up, then the time will be wrong.


    > In our security system, it''s important that the time is kept accurate so that
    timestamps on log files and images are correct.'
  merge: -1
  img_proc: true
- pgno: 304
  md: '# fake-hwclock


    The fake-hwclock package is included in the latest Raspbian distributions, but
    in other past versions it wasn''t. If you need to install it, use the command
    that follows:


    ```

    ```bash

    $ sudo apt-get install fake-hwclock

    ```

    ```


    fake-hwclock is used by the Raspberry Pi to try and keep time when there is no
    network connection. It will regularly save the current time and restore it at
    boot-up. The obvious problem with this is that if the Pi has been switched off
    a few days, then the time will be set to the last time that it was on, using fake-hwclock.


    If you want to see what time it last logged, type the following command:


    ```

    ```bash

    $ cat /etc/fake-hwclock.data

    ```

    ```


    # ntp


    The **Network Time Protocol (NTP)** is used when there is an Internet connection
    available and it can request the latest most accurate time from one or more time
    servers on the Internet.


    By default, the **ntp service** is enabled on the latest Raspbian distribution,
    but it will initially get its time at boot-up from fake-hwclock if there is no
    Internet connection. There may be times when it''s necessary to force the ntp
    service to update from the Internet—for example, if the Internet connection is
    restored sometime after boot-up.


    To force the ntp service to update from the Internet, use the following commands:


    ```

    ```bash

    $ service ntp stop

    $ ntpd -gq

    $ service ntp start

    ```

    ```


    # Talking of security…


    There''s no point in having a security system if the system itself is not secure.
    So, now we''ll change the default password for the pi user.


    From the prompt, type the following command:


    ```

    ```text

    $ sudo passwd pi

    pi@raspberrypi ~ $ sudo passwd pi

    Enter new UNIX password:

    Retype new UNIX password:

    passwd: password updated successfully

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 305
  md: '# What is this sudo thing anyway?


    You''d have noticed that we''ve been putting `sudo` at the start of each command
    that we run in the terminal window. This is so that commands are run as the **root
    user** — the highest security level. This elevated security is required to perform
    many operations. `sudo` actually means *super do.*


    If you can''t be bothered to type `sudo` every time, then you can switch to the
    super user by typing the following:


    ```

    $ sudo su

    ```


    You''ll see that the prompt changed from a $ to a #, which indicates that you
    are now running as the root user.


    So, this might be a good time to change the root user password too! To do this,
    type the following:


    ```

    # passwd

    root@raspberrypi:/home/pi# passwd

    Enter new UNIX password:

    Retype new UNIX password:

    passwd: password updated successfully

    root@raspberrypi:/home/pi#

    ```


    # Connecting via Wi-Fi


    You can also connect your Raspberry Pi to your network using Wi-Fi by plugging
    a USB dongle into it. There are additional configuration steps required to make
    this work, which are beyond the scope of this chapter, but there are many resources
    available covering this subject.


    > You can find recipes for connecting your Raspberry Pi using Wi-Fi in the **Raspberry
    Pi Networking Cookbook** by Rick Golden, published by Packt Publishing (https://www.packtpub.com/hardware-and-creative/raspberry-pi-networking-cookbook).'
  merge: -1
  img_proc: true
- pgno: 306
  md: '# Summary


    In this chapter, we took our Raspberry Pi out of its box and prepared it to be
    the centerpiece of our home security system. Along the way, we installed and set
    up the operating system, connected our Pi to the network, and accessed it remotely.
    We also secured our Pi and made sure it could keep the right time.


    In the next chapter, we''re going to explore the GPIO port and the various interfaces
    it features. We''ll look at the various things we can connect to the Raspberry
    Pi using the GPIO port, including switches and sensors, as we start to build our
    home security system.'
  merge: -1
  img_proc: true
- pgno: 307
  md: '# 2

    Connecting Things to Your Pi with GPIO


    The Raspberry Pi has lots of ways to connect things to it, such as plugging things
    into the USB ports, connecting devices to the on-board camera and display ports,
    and connecting things to the various interfaces that make up the GPIO connector.
    As part of our home security project, we''ll be focusing mainly on connecting
    things to the GPIO connector.


    In this chapter, we will cover the following topics:


    +   - Examining the GPIO connector and what each of the pins does

    +   - Learning about the I2C and SPI buses that will be used in later chapters

    +   - Connecting an LED and a switch safely to the data pins, and accessing these
    data pins using simple scripts

    +   - Understanding the USB ports and their limitations


    # Prerequisites


    Along with your Raspberry Pi, you''ll need the following parts for the projects
    in this chapter:


    +   - A breadboard

    +   - An LED

    +   - A 220 ohm resistor (red, red, black)

    +   - A 10K ohm resistor (brown, black, orange)

    +   - A pushbutton or toggle switch'
  merge: -1
  img_proc: true
- pgno: 308
  md: '+   - A hook-up wire:


    ![](img/631e8b200cce187082ee46b0eb1681b3_308_0.png)


    # Say hello to the GPIO


    The GPIO connector is the large group of pins on the edge of your Raspberry Pi
    board. On earlier models, there were 26 pins that made up this connector. But,
    ever since the Model B+, there have been 40 pins, although the first 26 pins are
    identical to the previous models, and it''s these 26 pins we''ll be working with.
    You won''t need to worry about the rest of the pins.


    Essentially, the GPIO connector provides access to following:


    +   - Power supplies

    +   - Digital I/O pins

    +   - I2C bus

    +   - SPI bus

    +   - UART Serial bus'
  merge: -1
  img_proc: true
- pgno: 309
  md: 'Some of the pins on the GPIO have more than one purpose, depending on how they
    are programmed. The following diagram is a reference guide to all of the pins
    on the GPIO. The GPIO numbers on the yellow labels relate directly to those on
    the Broadcom chip, and are numbers generally used within the scripts.


    ![](img/631e8b200cce187082ee46b0eb1681b3_309_0.png)


    # Digital I/O pins


    The GPIO has 8 digital input/output pins available for use. These can be used
    to switch things on and off (in output mode), and also to detect when external
    things are switched on and off (input mode). Each pin can be configured independently
    for input or output operation, and I have labelled them D0 to D7 in the preceding
    diagram.


    Obviously, if we were to use each of these pins to drive or sense an individual
    device, we would be limited to a maximum of 8 devices that could be connected
    to our home security system. In many scenarios, this is probably not enough, so
    in the next chapter we''ll learn how to use the GPIO to connect many more things
    to our Raspberry Pi.'
  merge: -1
  img_proc: true
- pgno: 310
  md: '# The I2C bus


    The Inter-Integrated Circuit (I2C) bus is a low-speed interface that can connect
    multiple devices and simple sensors using a 2-wire interface without the need
    for a separate clock or device select line. Typically, this bus can operate at
    speeds up to 100kbit/s. We''ll be covering this in the next chapter to help us
    expand our digital I/O and connect more things.


    # The SPI bus


    The Serial Peripheral Interface (SPI) bus is a synchronous two-way serial connection
    between a master and a slave device. It can be used to access more complex sensors
    or drive displays.


    The master device provides the synchronization, and each transmission is synchronized
    by a clock pulse on SCLK (GPIO11/pin 23). Data is transmitted on the MOSI (master-out-slave-in)
    and MISO (master-in-slave-out) (pins 19 and 21 respectively).


    # The UART serial bus


    The Universal Asynchronous Receiver and Transmitter (UART) bus is a way to communicate
    with external devices over a serial data connection, and is a common way for the
    Raspberry Pi to access data from devices such as GPS modules, which often come
    with serial connections. It can be a little bit fiddly getting the Pi set up to
    communicate with UART-connected devices, as it''s also tied in with the operating
    system''s serial console.


    # USB ports


    We''re probably all familiar with Universal Serial Bus (USB) ports as we use them
    to connect all sorts of things to our PCs, such as keyboards, mouses, and hard
    disks. On the Raspberry Pi, it''s just the same; we can connect keyboards, mouses,
    and dongles to give us Wi-Fi and Bluetooth connectivity.'
  merge: -1
  img_proc: true
- pgno: 311
  md: '![](img/631e8b200cce187082ee46b0eb1681b3_311_0.png)


    Official Raspberry Pi USB Wi-Fi Dongle


    On earlier Raspberry Pi models, the amount of current that the ports delivered
    was pretty low and caused all sorts of problems if too much current was drawn
    by the connected devices. This was significantly improved from the model B+ onwards,
    and it''s now possible to connect GSM/LTE dongles without any problems.


    There are still limitations, however, if you want to connect things such as hard
    disk drives; these can still draw more current than what can be supplied by the
    Raspberry Pi USB ports, so it''s recommended that a powered USB hub or USB power
    injector be used when connecting these types of devices to your Pi.


    # Power connections


    The GPIO connector also provides access to the on-board power supplies. The +5V
    connection (pins 2 and 4) is essentially the +5V input from the external power
    supply connected to the micro-USB power port. This can be used to power small
    external circuits if necessary, although it is recommended that an additional
    external +5V supply be used if significant current is required.


    The +3.3V supply (pins 1 and 17) is the output from the on-board 3.3V regulator
    and provides a small amount of current up to 50mA. If you need to draw more than
    50mA for your external circuits, then you should use an external power supply.
    I''ll show you how to build one later in this book.


    > The I/O pins on the Raspberry Pi operate at 3.3V levels. Connecting voltages
    higher than this to the pins could irreversibly damage your Pi. If you follow
    the instructions in this book, then everything should be fine, but randomly connecting
    things to your Pi that use lots of power will break it!'
  merge: -1
  img_proc: true
- pgno: 312
  md: '# Getting acquainted with the GPIO


    Before we embark on connecting lots of things to our Pi board, it might be a good
    idea to just get acquainted with the GPIO through a couple of simple projects
    that will help us understand how to interact with the digital I/O pins using shell
    scripts.


    # Let there be light


    This simple little project shows how to connect a GPIO output to an LED, and switch
    it on and off using shell commands.


    The following diagram shows how to connect up the circuit using a breadboard:


    ![](img/631e8b200cce187082ee46b0eb1681b3_312_0.png)


    > The pretty diagram that you just saw was produced using a free software tool
    from fritzing, which is an open-source hardware initiative to make electronics
    accessible as creative material for anyone. Download it from `fritzing.org`.'
  merge: -1
  img_proc: true
- pgno: 313
  md: 'The LED anode (the positive side) is connected to the D0 digital I/O (pin 11
    of the connector or GPIO17). When this pin is switched on, it will provide a 3.3V
    supply to the LED.


    The LED is connected to the Ground pin via a 220R resistor on the cathode (negative
    side). The resistor limits the voltage to the LED and the current through it,
    otherwise it would burn out, as you can only supply up to about 2V to LEDs. With
    a current of around 10mA being drawn by the LED on a 3.3V supply, a 220R resistor
    works well to protect both it and the GPIO.


    Here''s the circuit diagram for it:


    ![](img/631e8b200cce187082ee46b0eb1681b3_313_0.png)


    # Calculating LED Resistor Values...


    While this book is not really a course on electronics theory, I thought it would
    be handy to show you how to work out the resistor values for LEDs using Ohms Law,
    as we''ll be covering this again later.


    As I mentioned, a typical LED will drop about 2V across it, although this varies
    according to color and type. This is called the forward voltage of the device
    or VLED.


    The current required by an LED is around 10mA, again depending on its specification.
    We''ll call this current flowing through the LED, ILED.


    Essentially, the voltage across the resistor will be the supply voltage minus
    the voltage drop across the LED (for example, 2V). So, if we have a 12V supply
    (VS), the voltage across the resistor will be 10V (VS - VLED).


    According to Ohms Law, the resistance R is the voltage across it divided by the
    current flowing through it: R = V / I. As we require 10mA flowing through it,
    with a voltage of 10V across it, the resistance required is 10V divided by 0.01A,
    which is 1,000 ohms or 1K.


    In summary, R = (VS-VLED) / ILED.'
  merge: -1
  img_proc: true
- pgno: 314
  md: '# Connecting Things to Your Pi with GPIO


    Now, to turn the LED on and off: the GPIO pins are actually mapped as devices
    in the Linux file system, so using shell commands is easy, although there are
    many libraries available out there that allow you to control the GPIO using Python,
    for example. However, so that you don''t have to learn a new language, we''re
    going to do everything using shell commands.


    The D0 pin that we are connected to is actually GPIO17 as far as the Raspberry
    Pi is concerned (take a look at the previous diagram for reference). The first
    thing we need to do is create file access to this GPIO pin. We do this with the
    following command:


    ```

    ```bash

    sudo echo 17 > /sys/class/gpio/export

    ```

    ```


    We then have to set the pin''s direction to out:


    ```

    ```bash

    sudo echo out > /sys/class/gpio/gpio17/direction

    ```

    ```


    Next we can switch the pin on to turn the LED on:


    ```

    ```bash

    sudo echo 1 > /sys/class/gpio/gpio17/value

    ```

    ```


    To switch the LED off, we use this command:


    ```

    ```bash

    sudo echo 0 > /sys/class/gpio/gpio17/value

    ```

    ```


    Once we''ve finished with a GPIO port we can remove its file access:


    ```

    ```bash

    sudo echo 17 > /sys/class/gpio/unexport

    ```

    ```


    # Getting flashy…


    We can put these commands together in a single Bash script to create a flashing
    LED. To create the flashy script, create a new text file in `nano` or some other
    text editor. Or, as I usually do (don''t forget that I''m quite lazy), create
    the text file on your laptop, and then copy it to the remote Pi using **WinSCP**
    (although, read my note in the box that follows if you want to prevent some heartache).'
  merge: -1
  img_proc: true
- pgno: 315
  md: "The following is the code listing for led-flash.sh:\n\n```\n#!/bin/bash\nsudo\
    \ echo 17 > /sys/class/gpio/export\nsudo echo out > /sys/class/gpio/gpio17/direction\n\
    # loop forever\nwhile true\ndo\n    sudo echo 1 > /sys/class/gpio/gpio17/value\n\
    \    sleep 0.5\n    sudo echo 0 > /sys/class/gpio/gpio17/value\n    sleep 0.5\n\
    done\n```\n\n![](img/631e8b200cce187082ee46b0eb1681b3_315_0.png)\n\n> If you use\
    \ Windows to create your files, remember to save your files with the end-of-line\
    \ format being Linux (a single 0x0a or Line Feed character) rather than Windows\
    \ (0x0a + 0x0d or Line Feed + Carriage Return characters), otherwise you might\
    \ find that your Bash script does not run properly on the Raspberry Pi. Text editors\
    \ on Windows, such as the excellent Notepad++, will convert your script line ends\
    \ for you.\n\nRun the script by calling led-flash.sh (assuming that's what you've\
    \ called it). If you're in the same directory as the script, this can be done\
    \ by typing the following:\n\n```\n$ sudo bash ./led-flash.sh\n```\n\nSince this\
    \ is an endless loop with the LED flashing on and off at half second intervals,\
    \ you'll need to break out of it by using CTRL + C to stop the script.\n\nDon't\
    \ forget to remove the GPIO pin from file access by using the following command:\n\
    \n```\n$ sudo echo 17 > /sys/class/gpio/unexport\n```\n\nOtherwise, you'll see\
    \ the error, echo: write error: Device or resource busy, if you re-run the script,\
    \ as the first line tries to set GPIO17 for file access again."
  merge: -1
  img_proc: true
- pgno: 316
  md: '# Adding a switch


    In this project, we''ll see how to connect a switch to a GPIO input and write
    a shell script to read the state of the switch—that is, whether it''s switched
    on or off.


    Connect a switch to your Pi''s GPIO27 pin, as shown in the following diagram:


    ![](img/631e8b200cce187082ee46b0eb1681b3_316_0.png)


    # Pulling yourself together


    A really important thing to realize about GPIO inputs is that they are in what''s
    called a floating state. This means that, as far as the operating system is concerned,
    it doesn''t know what its reference state is unless it is presented with a known
    voltage.


    This is where our resistor comes into play—it pulls up the GPIO pin to a known
    voltage of 3.3V, which gives it a default state of HIGH (or binary 1).


    When the pushbutton switch is pressed, this takes the GPIO pin to 0V, which is
    a LOW state (or binary 0).'
  merge: -1
  img_proc: true
- pgno: 317
  md: 'Here''s the circuit diagram for our GPIO switch:


    ![](img/631e8b200cce187082ee46b0eb1681b3_317_0.png)


    # The detection script


    Now that we''ve connected the switch to our Raspberry Pi, we need to write a little
    script that will detect when the switch has been pushed.


    It''s similar to the previous LED script shown, but this time we''ll set the GPIO
    pin as an input and read its logic level.


    In this project, we''ve connected our switch to D2, which is GPIO27 (again, refer
    to the earlier GPIO pin-out diagram). As before, we need to create file access
    for the pin by entering the following command:


    ```

    $ sudo echo 27 > /sys/class/gpio/export

    ```


    And now, set its direction to in:


    ```

    $ sudo echo in > /sys/class/gpio/gpio27/direction

    ```


    We''re now ready to read its value, and we can do this with the following command:


    ```

    $ sudo cat /sys/class/gpio/gpio17/value

    ```


    You''ll notice that it will have returned 1, or a high state. This is because
    of the pull-up resistor we were talking about earlier. This means that its default
    state, when the switch isn''t pushed, is high.'
  merge: -1
  img_proc: true
- pgno: 318
  md: "When the switch is pushed, the value should be read as 0 or low. If you have\
    \ more than two hands, you can try this by pushing the button and re-running the\
    \ command. Or, we can just create a script to poll the switch state.\n\nThe code\
    \ listing for poll-switch.sh is as follows:\n\n```\n#!/bin/bash\nsudo echo 27\
    \ > /sys/class/gpio/export\nsudo echo in > /sys/class/gpio/gpio27/direction\n\n\
    # loop forever\nwhile true\ndo\n    # read the switch state\n    SWITCH=$(sudo\
    \ cat /sys/class/gpio/gpio27/value)\n\n    if [ $SWITCH == 1 ]; then\n       \
    \ #switch not pushed so wait for a second\n        sleep 1\n    else\n       \
    \ #switch was pushed\n        echo \"You've pushed my button\"\n    fi\ndone\n\
    ```\n\nWhen you run the script and then push the button, you should see You've\
    \ pushed my button scrolling up the console screen until you stop pressing it.\n\
    \nDon't forget that, once we've finished with the GPIO port, we can remove its\
    \ file access:\n\n```\n$ sudo echo 27 > /sys/class/gpio/unexport\n```\n\nWe've\
    \ now seen how to easily read a switch input, and the same circuit and script\
    \ can be used to read other sensors, such as door contact switches, reed switches,\
    \ or anything else that has an on and off state."
  merge: -1
  img_proc: true
- pgno: 319
  md: '# # The most elaborate light switch in the world


    By combining the two little projects earlier, we can now create a system that
    will do something useful when the pushbutton switch is pushed—for example, switching
    on the LED that we also have connected. Granted, we could just connect the LED
    directly to the switch and a battery, but not only would that be boring, it would
    defeat the point of what we''re trying to do, which is programmatically sensing
    and controlling things.


    Here''s the breadboard layout for our elaborate light switch:


    ![](img/631e8b200cce187082ee46b0eb1681b3_319_0.png)'
  merge: -1
  img_proc: true
- pgno: 320
  md: 'And here''s the circuit diagram:


    ![](img/631e8b200cce187082ee46b0eb1681b3_320_0.png)


    # The illuminating script


    Our full Bash script for our elaborate light switch is demonstrated next. This
    will loop endlessly, detecting the state of the switch GPIO pin, and will turn
    on the LED GPIO pin when the switch is pushed.


    The code listing for light-switch.sh is as follows:


    ```

    #!/bin/bash


    #set up the LED GPIO pin

    sudo echo 17 > /sys/class/gpio/export

    sudo echo out > /sys/class/gpio/gpio17/direction


    #set up the switch GPIO pin

    sudo echo 27 > /sys/class/gpio/export

    sudo echo in > /sys/class/gpio/gpio27/direction


    # loop forever

    while true

    ```'
  merge: -1
  img_proc: true
- pgno: 321
  md: "```\ndo\n  # read the switch state\n  SWITCH=$(sudo cat /sys/class/gpio/gpio27/value)\n\
    \n  #0=Pushed 1=Not Pushed\n  if [ $SWITCH = \"1\" ]\n  then\n    #switch not\
    \ pushed so turn off LED pin\n    sudo echo 0 > /sys/class/gpio/gpio17/value\n\
    \  else\n    #switch was pushed so turn on LED pin\n    sudo echo 1 > /sys/class/gpio/gpio17/value\n\
    \  fi\n  #short delay\n  sleep 0.5\ndone\n```\n\nSo, here we are—we have a script\
    \ that will detect an input state and do something in response; in this case,\
    \ it will switch on an LED. We're now forming the basis of how we are going to\
    \ put together our home security system.\n\n> Remember, don't connect anything\
    \ to your Raspberry Pi in place of the LED, such as a buzzer or any other device\
    \ that consumes lots of current. This is likely to irreversibly render your board\
    \ dead. We'll look at ways, later on in this book, to control devices with higher\
    \ power requirements.\n\n# Summary\n\nIn this chapter, we introduced various ways\
    \ to connect your Raspberry Pi to the outside world by looking at the various\
    \ interfaces available on the GPIO. We've understood how to connect things to\
    \ the digital pins on your Raspberry Pi's GPIO connector, and control and read\
    \ them using simple Bash scripts. In particular, we've safely and properly connected\
    \ a switch to a digital input pin, which will form the foundation for our home\
    \ security detection circuits.\n\nIn the next chapter, we'll look at ways to expand\
    \ the number of things we can connect to our Raspberry Pi, overcoming the limitation\
    \ of having just the 8 digital pins available to us on the GPIO by tapping into\
    \ other interfaces on the GPIO and building our own input/output expansion board."
