  md: "We can now proceed to learn how to use Tweepy to get a list of followers. The\
    \ code is given next, and the explanation follows:\n\n```\nimport tweepy\n\nauth\
    \ = tweepy.OAuthHandler(consumer_key, consumer_secret)\nauth.set_access_token(access_token,\
    \ access_token_secret)\n\napi = tweepy.API(auth)\n\nuser = api.get_user('twitter')\n\
    \nprint user.screen_name\nprint user.followers_count\nfor friend in user.friends():\n\
    \    print friend.screen_name\n\napi.update_status(' Tweepy says : Hello, world!')\n\
    ```\n\nIn this example, we first import the Tweepy library into Python to use\
    \ its functionality. We first need to register our Python script (client) to be\
    \ able to communicate with the Twitter API. For this, we will enter the Consumer\
    \ Key and the Consumer Secret in the argument of the OAuthHandler method of the\
    \ Tweepy API. Next, we set the access codes for opening up the Twitter API for\
    \ our client's use. This is important because we need to have an access token\
    \ for the app to be able to do things like send tweets, reading tweets, or viewing\
    \ followers, and so on. Access codes for the Twitter app can be found in its settings,\
    \ just below the Consumer Codes.\n\nWe have so far set the authentication details,\
    \ but we still need to do the authentication to send tweets. This is accomplished\
    \ by the API() function in the Tweepy module. We first create an api variable\
    \ that contains all the methods for interacting with the Twitter API.\n\nThe next\
    \ statement gets the user associated with our unique Consumer Key. Every registered\
    \ user will have this key and it is unique for every user so they can correctly\
    \ identify themselves. The get_user() method takes as an argument, the name of\
    \ the service (Twitter in this case) that we need from the user, and passes the\
    \ authentication codes that we have got from the previous statement to get the\
    \ user details. This is stored in the user variable. This variable will have members\
    \ such as the name, followers, following, and so on."
