- pgno: 127
  md: '# Working with images


    Let''s get started with the basics of OpenCV''s Python API. All the scripts we
    will write and run will use the OpenCV library, which must be imported with the
    import cv2 line. We will import few more libraries as required, and in the next
    sections and chapters, cv2.imread() will be used to import an image. It takes
    two arguments. The first argument is the image filename. The image should be in
    the same directory where the Python script is the absolute path that should be
    provided to cv2.imread(). It reads images and saves them as NumPy arrays.


    The second argument is a flag that specifies that the mode image should be read.
    The flag can have the following values:


    +   - cv2.IMREAD_COLOR: This loads a color image; it is the default flag

    +   - cv2.IMREAD_GRAYSCALE: This loads an image in the grayscale mode

    +   - cv2.IMREAD_UNCHANGED: This loads an image as it includes an alpha channel


    The numeric values of the preceding flags are 1, 0, and -1, respectively.


    Take a look at the following code:


    ```

    import cv2 #This imports opencv

    #This reads and stores image in color into variable img

    img = cv2.imread(''lena_color_512.tif'',cv2.IMREAD_COLOR)

    ```


    Now, the last line in the preceding code is the same as this:


    ```

    img = cv2.imread(''lena_color_512.tif'',1)

    ```


    We will be using the numeric values of this flag throughout the book.


    The following code is used to display the image:


    ```

    cv2.imshow(''Lena'',img)

    cv2.waitKey(0)

    cv2.destroyWindow(''Lena'')

    ```'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'The cv2.imshow() function is used to display an image. The first argument is
    a string that is the window name, and the second argument is the variable that
    holds the image that is to be displayed.


    cv2.waitKey() is a keyboard function. Its argument is the time in milliseconds.
    The function waits for specified milliseconds for any keyboard key press. If 0
    is passed, it waits indefinitely for a key press. It is the only method to fetch
    and handle events. We must use this for cv2.imshow() or no image will be displayed
    on screen.


    cv2.destroyWindow() function takes a window name as a parameter and destroys that
    window. If we want to destroy all the windows in the current program, we can use
    cv2.destroyAllWindows().


    We can also create a window with a specific name in advance and assign an image
    to that window later. In many cases, we will have to create a window before we
    have an image. This can be done using the following code:


    ```

    cv2.namedWindow(''Lena'', cv2.WINDOW_AUTOSIZE)

    cv2.imshow(''Lena'',img)

    cv2.waitKey(0)

    cv2.destroyAllWindows()

    ```


    Putting it all together, we have the following script:


    ```

    import cv2

    img = cv2.imread(''lena_color_512.tif'',1)

    cv2.imshow(''Lena'',img)

    cv2.waitKey(0)

    cv2.destroyWindow(''Lena'')

    ```'
  merge: -1
  img_proc: true
