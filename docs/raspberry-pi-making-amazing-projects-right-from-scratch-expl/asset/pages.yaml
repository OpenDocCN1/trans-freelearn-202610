- pgno: 462
  md: '# Configuring and Programming Raspberry Pi


    First, you''ll want to expand the file system to take up the entire card. So,
    hit the *Enter* key, and you''ll see the following screen:


    ![](img/631e8b200cce187082ee46b0eb1681b3_462_0.png)


    Hit *Enter* once again and you''ll go back to the main configuration screen. Now,
    select the **Enable Boot to Desktop/Scratch** option.


    ![](img/631e8b200cce187082ee46b0eb1681b3_462_1.png)'
  merge: -1
  img_proc: true
- pgno: 463
  md: 'When you hit Enter, you''ll see the following screen:


    ![](img/631e8b200cce187082ee46b0eb1681b3_463_0.png)


    You can also choose to overclock your device. This is a way for you to get higher
    performance from your system. However, there is a risk that you can end up with
    a system that has reliability problems.


    Once you are done and are back at the main configuration menu, hit the Tab key
    until you are positioned over the <Finish> selection, then hit Enter. Then, hit
    Enter again so that you can reboot your Raspberry Pi. This time, when you log
    in, you will not see any configuration selections. However, if you ever want to
    change your configuration choices, you can run the configuration tool by typing
    in raspi-config at the command prompt.


    # Adding a remote graphical user interface


    For some steps in your robot build, you will need a graphical look at your system.
    You can get this on your Raspberry Pi using an application called vncserver. You''ll
    need to install a version of this on your Raspberry Pi by typing in sudo apt-get
    install tightvncserver in a terminal window on your Raspberry Pi.'
  merge: -1
  img_proc: true
- pgno: 464
  md: 'Tightvncserver is an application that will allow you to remotely view your
    complete graphical desktop. Once you have it installed, you can do the following:


    +   1. You''ll need to start the server by typing in `vncserver` in a terminal
    window on the Raspberry Pi.

    +   2. You will then be prompted for a password, prompted to verify the password,
    and then asked if you''d like to have a view only password. Remember the password
    you entered; you''ll need it to remotely log in via a VNC viewer.

    +   3. You''ll need a VNC viewer application for your remote computer; a good
    choice is Real VNC, available from http://www.realvnc.com/download/viewer/. When
    you run it, you should see this:


    ![](img/631e8b200cce187082ee46b0eb1681b3_464_0.png)


    4. Enter the VNC server address, which is the IP address of your Raspberry Pi,
    and click on Connect. You will get a warning about an unencrypted connection;
    select Continue and you will get this pop-up window:


    ![](img/631e8b200cce187082ee46b0eb1681b3_464_1.png)'
  merge: -1
  img_proc: true
- pgno: 465
  md: '5. Type in the password you just entered while starting the vncserver, and
    you should then get a graphical view of your Raspberry Pi, which looks like the
    following screenshot:


    ![](img/631e8b200cce187082ee46b0eb1681b3_465_0.png)


    You can now access all the capabilities of your system, albeit they may be slower
    if you are doing a graphics-intense data transfer. To avoid having to type in
    vncserver each time you boot your Raspberry Pi, use the instructions at http://www.haveteknowhow.com/Configure-the-server/run-VNC-on-boot.html.'
  merge: -1
