    \ is the basic skeleton logic for all the live video processing with OpenCV. We\
    \ will make use of this in future.\n\n# Saving a video using OpenCV\n\nWe need\
    \ to use the cv2.VideoWriter() function to write a video to a file. Take a look\
    \ at the following code:\n\n```\nimport cv2\ncam = cv2.VideoCapture(0)\noutput\
    \ = cv2.VideoWriter('VideoStream.avi',\ncv2.cv.CV_FOURCC(*'WMV2'),40.0,(640,480))\n\
    \nwhile (cam.isOpened()):\n    ret, frame = cam.read()\n    if ret == True:\n\
    \        output.write(frame)\n        cv2.imshow('VideoStream', frame )\n    \
    \    if cv2.waitKey(1) == 27 :\n            break\n    else:\n        break\n\n\
    cam.release()\noutput.release()\ncv2.destroyAllWindows()\n```\n\nIn the preceding\
    \ code, cv2.VideoWriter() accepts the following parameters:\n\n+   - **Filename:**\
    \ This is the name of the video file.\n+   - **FourCC:** This stands for Four\
    \ Character Code. We have to use the cv2.cv.CV_FOURCC() function for this. This\
    \ function accepts FourCC in the *'code' format. This means that for DIVX, we\
    \ need to pass *'DIVX', and so on. Some supported formats are DIVX, XVID, H264,\
    \ MJPG, WMV1, and WMV2.\n+   - **Framerate:** This is the rate of the frames to\
    \ be captured per second.\n+   - **Resolution:** This is the resolution of the\
    \ video to be captured.\n\n> You can read more about FourCC at www.fourcc.org."
