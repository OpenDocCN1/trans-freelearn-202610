    +   1. Select **Expand Filesystem**.

    +   2. In **Boot Options**, select **B4 Desktop Autologin**, as shown in the following
    screenshot:


    ![](img/631e8b200cce187082ee46b0eb1681b3_34_0.png)


    The default username is pi and the password is raspberry. We need it when we don''t
    choose any of the preceding autologin options. We can change this password from
    the second option in the raspi-config menu.

    We can also choose to boot to the console by selecting any of the first two options
    in the preceding menu. The default shell of Raspbian is Bash. We can confirm it
    by typing the following command:

    `echo $SHELL`

    We can always go to the graphical desktop from the Command Prompt by typing the
    startx command in the console.


    +   3. Go to **Internationalisation Options | Change Timezone**.

    +   4. Go to **Internationalisation Options | Change Keyboard Layout | Change
    it to US** (the default is UK).'
