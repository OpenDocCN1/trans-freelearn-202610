    # Summary


    In this chapter, we revised how to use Pi Camera with the Raspberry Pi and take
    photos with it. We learned a neat trick to correct our photos if they are upside
    down. We also learned how to use a GPIO to use a tactile button to act as the
    trigger for our images.


    Once we obtained the images required for our animation, we proceeded to combine
    those images in a video, where we specified the frame rate and quality. Finally,
    we rendered the video using the ffmpeg library.


    In the next chapter, we will learn about the popular open source image processing
    library, OpenCV, and get it set up on the Raspberry Pi. We will also implement
