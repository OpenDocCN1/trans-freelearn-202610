- pgno: 236
  md: '# Introducing and installing Apache on Raspbian


    The Apache HTTP server is extremely popular and is the world''s most used web
    server software currently. It enjoys the support of the open source community
    because it is developed and maintained by an open community of developers under
    the umbrella of the Apache Software Foundation. Although most commonly used on
    a Unix-like system, it is available for a variety of other operating systems including
    Microsoft Windows. In 2009, it became the first web server to be used by more
    than a hundred million websites and currently it is estimated to serve over 50
    percent of all websites and 37 percent of the top servers across domains.


    One of the reasons it is so popular is that it supports a wide variety of features
    and many more features can be implemented as compiled modules that can extend
    the core functionality. For example, on its own, Apache can serve HTML files over
    HTTP, but with additional modules installed, it can also serve web pages using
    languages such as Python. It also has a variety of language interfaces that include
    Python, PHP, and Perl.


    Now, installing the web server on a Raspbian distribution is extremely easy.

    We need to install the apache2 package with the following command:


    ```

    ```bash

    $ sudo apt-get install apache2

    ```

    ```


    During installation, the package automatically creates our demo HTML file that
    you can see if you type 127.0.0.1 or http://localhost/ on your URL bar. We can
    also see this if we navigate to the Pi''s IP address from another machine connected
    to the same network such as 192.168.1.5. Replace this IP address with your own
    Pi''s IP address in the network. You can find the IP address by typing the following
    on the Raspberry Pi''s terminal:


    ```

    ```bash

    $ hostname -I

    ```

    ```'
  merge: -1
  img_proc: true
