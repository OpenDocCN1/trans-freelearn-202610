- pgno: 252
  md: "UDP is an Internet protocol. Just like its counterpart TCP (which we will discuss\
    \ soon), UDP is a protocol for the transfer of packets from one host to another.\
    \ However, as seen in the diagram, it has some important differences from TCP.\
    \ Unlike TCP, UDP is connectionless and is not a stream-oriented protocol. This\
    \ means a UDP server just catches incoming packets from any and many hosts without\
    \ establishing a reliable and dedicated connection for the transfer of data between\
    \ processes.\n\nA UDP socket is created as follows in Python:\n\n```\ns = socket.socket(socket.AF_INET,\
    \ socket.SOCK_DGRAM)\n```\n\nSOCK_DGRAM specifies a UDP socket.\n\n# Sending and\
    \ receiving data with UDP\n\nAs UDP sockets are connectionless sockets, communication\
    \ is done with the socket functions sendto() and recvfrom(). These functions do\
    \ not require a socket to be connected to another peer explicitly. They just send\
    \ and receive directly to and from a given IP address.\n\n# UDP servers and NCAT\n\
    \nThe simplest form of a UDP server in Python is as follows:\n\n```\nimport socket\n\
    port = 5000\ns = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)\ns.bind((\"\"\
    , port))\nprint \"waiting on port:\", port\nwhile 1:\n    data, addr = s.recvfrom(1024)\n\
    \    print data\n```\n\nInstead of having a listen() function, a UDP server has\
    \ to open a socket and wait to receive incoming packets. As is evident from the\
    \ code snippet, there is no listen() or accept() function. Save the above code\
    \ and execute it from a terminal and then connect to it using the NCAT utility.\
    \ NCAT is an alternative to Telnet, and it is more powerful than Telnet and packed\
    \ with more features. Run the program and, in another terminal window, use NCAT.\
    \ Here is the output of the execution of the program and NCAT:\n\n```\npi@raspberrypi\
    \ ~/book/chapter14 $ nc localhost 5000 -u -v\nConnection to localhost 5000 port\
    \ [udp/*] succeeded!\n\nHello\nOk\n```"
  merge: -1
  img_proc: true
- pgno: 253
  md: "The -- flag in the command indicates the UDP protocol. The message we send\
    \ should be displayed on the server terminal.\n\n# An echo server using Python\
    \ UDP sockets\n\nHere is the code for an echo server in Python:\n\n```\n```python\n\
    import socket\nimport sys\n\nHOST = ''   # Symbolic name meaning all available\
    \ interfaces\nPORT = 8888 # Arbitrary non-privileged port\n\n# Datagram (udp)\
    \ socket\ntry:\n    s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)\n   \
    \ print 'Socket created'\nexcept socket.error, msg :\n    print 'Failed to create\
    \ socket. Error Code : ' + str(msg[0]) + ' Message ' + msg[1]\n    sys.exit()\n\
    \n# Bind socket to local host and port\ntry:\n    s.bind((HOST, PORT))\nexcept\
    \ socket.error , msg:\n    print 'Bind failed. Error Code : ' + str(msg[0]) +\
    \ ' Message ' + msg[1]\n    sys.exit()\n\nprint 'Socket bind complete'\n\n#now\
    \ keep talking with the client\nwhile 1:\n    # receive data from client (data,\
    \ addr)\n    d = s.recvfrom(1024)\n    data = d[0]\n    addr = d[1]\n\n    if\
    \ not data:\n        break\n\n    reply = 'OK...' + data\n```\n```"
  merge: -1
  img_proc: true
