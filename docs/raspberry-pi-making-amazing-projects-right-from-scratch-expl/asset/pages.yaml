- pgno: 179
  md: '# # Internet of Things with the Raspberry Pi


    In the previous chapter, we learned to interface different kinds of sensors to
    the Raspberry Pi to get data from the real world and output some text so that
    the user can infer the state of his surroundings, such as temperature, humidity,
    and so on. We also built a surveillance system that takes pictures of any intruder.
    Now, these are all standalone systems and cannot communicate with any other systems.


    In this chapter, we will concentrate on the concept of the *Internet of Things*.
    This means that we can connect standalone systems, just like the ones we built
    in the previous chapters, to the Internet. We will connect devices to the Internet
    and learn how to interact with different *web services*. The following topics
    will be covered in this chapter:


    +   - Installing the Twitter API for Python

    +   - Using Tweepy

    +   - Setting up a SQLite database

    +   - Building a tweeting weather station'
  merge: -1
  img_proc: true
- pgno: 180
  md: "# Introducing the Internet of Things\n\nThe Internet of Things is all about\
    \ connecting the devices that were previously not connected to the Internet, in\
    \ order to make them smarter and more controllable. Since the size and cost of\
    \ electronic devices are dropping exponentially, we can now afford to incorporate\
    \ them in our daily use, are garden watering systems, home automation/monitoring\
    \ systems, and so on. The Internet of Things in this way has opened up a whole\
    \ host of opportunities, the advantages of which are being taken up by hobbyists,\
    \ startups, and major companies alike. At the heart of the Internet of Things\
    \ revolution are small micro computers and sensors that allow these devices to\
    \ connect to the Internet and exchange data between them.\n\nAs mentioned before,\
    \ in this particular chapter we will extend our previous projects by connecting\
    \ the Raspberry Pi to the Internet, and make additional projects to demonstrate\
    \ the capability of the Internet of Things.\n\nWe will now learn to exchange data\
    \ from the Twitter API and post our sensor readings to Twitter.\n\n# Installing\
    \ the Twitter API for Python\n\n**API** (Application Programming Interface) and\
    \ it allows developers to communicate with various web services. Since Python\
    \ is, by default, installed on the Raspberry Pi, we will use a Python script to\
    \ communicate with the Twitter API over the Web. For this, we will use an open\
    \ source library called **Tweepy**. It works with Python versions as old as 2.6\
    \ and is still under active development. So bugs are likely to be fewer and, if\
    \ any are found, they are likely to be fixed quickly.\n\n> The GitHub repository\
    \ for Tweepy can be found at the following link, so that new issues can be submitted\
    \ and the code can be understood much more clearly:\n> \n> https://github.com/tweepy/tweepy\n\
    \nWe will now proceed to install it and learn how to use it to do things such\
    \ as sending tweets.\n\nThis library can be installed using pip, with the following\
    \ command:\n\n```\nsudo pip install python-twitter\n```"
  merge: -1
  img_proc: true
- pgno: 181
  md: 'We can also install bleeding-edge versions of the library by cloning it from
