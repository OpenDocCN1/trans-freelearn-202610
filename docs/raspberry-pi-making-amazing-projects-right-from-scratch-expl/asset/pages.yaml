- pgno: 96
  md: "# Introduction to GPIO Programming\n\nGPIO.setmode() sets the addressing mode\
    \ of the GPIO pins. There are two modes, namely BOARD and BCM. The BOARD mode\
    \ addresses the pins by the numbering given on the board. For example, in the\
    \ preceding GPIO diagram, the GPIO04 is pin 7. The other mode is BCM and it defines\
    \ the pins according to the Broadcom Firmware on the Raspberry Pi. So, the GPIO04\
    \ pin will be referred to as 4 rather than 7. The next statement, GPIO.setup(),\
    \ configures the specified pin to be an output or input depending on the argument.\n\
    \nNow, we'll move on to the main chunk of the code, which is the Blink() function.\
    \ The GPIO.output() function takes two arguments: the pin number and the logical\
    \ operation to be performed. In the first output statement, we set pin 7 to HIGH,\
    \ and then in the second output statement, we set it to LOW. In between these\
    \ functions, we have the sleep() function from the time package, which takes only\
    \ one argument: the time in seconds. It does nothing but delay the execution of\
    \ the next statement by the input number of seconds, which could also be fractions\
    \ such as 0.5 or 0.2. The last statement in the Blink() function is the cleanup()\
    \ function, which resets all the ports you have used back to the input mode. This\
    \ prevents the pin from being damaged when you have set HIGH as an output and\
    \ then accidentally connect it to ground, which would short-circuit the port.\
    \ So, it's safer to leave the ports as inputs.\n\n# Connecting a button\n\nAs\
    \ we saw in the previous section, connecting an LED to a GPIO pin was easy, and\
    \ the code was simple. In this section, we will use the same general code in order\
    \ to program a GPIO pin to take an input from the button and if the button is\
    \ pressed, light the LED that we have already connected in the previous section.\
    \ We will now take a look at the code and then explain those lines that were not\
    \ encountered in the previous section:\n\n```\n```python\nimport RPi.GPIO as GPIO\n\
    import time\n\nGPIO.setmode(GPIO.BOARD)\n\nGPIO.setup(12, GPIO.IN, pull_up_down\
    \ = GPIO.PUD_UP)\nGPIO.setup(7, GPIO.OUT)\n\nwhile True:\n    input_state = GPIO.input(12)\n\
    \n    if input_state == False:\n        print('Button Pressed')\n    GPIO.output(7,\
    \ True)\n```\n```"
  merge: -1
  img_proc: true
- pgno: 97
  md: "```\nelse:\n    print('Button Not Pressed')\nGPIO.output(7, False)\n```\n\n\
    ![](img/631e8b200cce187082ee46b0eb1681b3_97_0.png)\n\nNow, save the code as `prog2.py`\
    \ and run it with the following command:\n\n```\npython prog2.py\n```\n\nIn this\
    \ section, we configure pin #12 (by board numbering) to be an output via the same\
    \ `GPIO.setup()` statement that we used in the previous section. But here, we\
    \ have an extra argument, `pull_up_down=GPIO.PUD_UP`. This means that the internal\
    \ resistor for the GPIO pin is being pulled up to 3.3V, and it will return `False`\
    \ when the button is pressed. This is a little counter-intuitive, but without\
    \ pulling up or down, the input will be left \"floating\", which means that the\
    \ Pi will not be able to determine a button press simply because it does not have\
    \ anything to compare the voltage level to!\n\nNow we enter the infinite `while`\
    \ loop, where it checks for the button state using the `GPIO.input()` function.\
    \ As mentioned earlier, if the button is pressed, `input_state` will return `False`\
    \ and the LED will be lit up. If, instead, the button is not pressed anymore,\
    \ the LED will go off!\n\nSimple, isn't it? Let's move on a more complicated add-on."
  merge: -1
