- pgno: 275
  md: 'The server handles multiple chat clients with multiplexing based on the select()
    function. The select() function monitors all the client sockets and the master
    socket for any readable activity. If any of the client sockets are readable, then
    it means that one of the chat clients has sent a message to the server.


    When the select() function returns, read_sockets will be an array consisting of
    all socket descriptors that are readable. When the master socket is readable,
    the server will accept the new connection. If any of the client sockets is readable,
    the server will read the message and broadcast it back to all the other clients
    except the one who sent the message. If the broadcast function fails to send the
    message to any of the clients, the client is presumed to be disconnected, the
    connection is closed, and the corresponding socket is removed from the connections
    list.


    # The chat client


    Now, let''s code the chat client that will connect to the chat server and exchange
    the messages. The chat client is based on the Telnet program in Python, which
    we have already worked on. It connects to a remote server and exchanges messages.


    The chat client performs the following tasks:


    +   - It listens for incoming messages from the server.

    +   - It checks for user input, in case the user types in a message and then sends
    it to the chat server to which it is connected.


    The client has to actually listen for server messages and user input simultaneously.
    To accomplish this, we can use the select() function. The select() function can
    monitor multiple sockets or file descriptors simultaneously for activity. When
    a message from the server arrives on the connected socket, it is readable, and
    when the user types a message from the keyboard and hits Enter, the stdin stream
    is readable.


    So, the select() function has to monitor two streams: the first is the socket
    that is connected to the remote web server, and the second is stdin or terminal
    input stream from the keyboard. The select() function waits until some activity
    happens. So, after calling the select() function, the function itself will return
    only when either the server socket receives a message or the user enters a message
    using the keyboard. If nothing happens, it keeps on waiting.


    We can create an array of the stdin file descriptor that is available from the
    sys module and the server sockets. Then, we call the select() function, passing
    it the list. The select() function returns a list of arrays that are readable,
    writable, or have an error.'
  merge: -1
  img_proc: true
