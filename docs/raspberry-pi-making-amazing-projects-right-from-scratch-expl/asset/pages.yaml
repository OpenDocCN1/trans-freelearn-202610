    The meaning of the columns respectively is:


    +   - Permissions of the file

    +   - Number of files in the directory

    +   - User that owns the file/directory

    +   - Group that owns the file/directory

    +   - File size

    +   - Last modified date


    Since the owner of the index.html file is root, we need to take ownership of the
    file before editing it. To do that, enter the following command:


    ```

    $ sudo chown pi: index.html

    ```


    We can also replace the index.html file with our own HTML file and serve a fully
    fledged HTML website complete with CSS classes.


    However, a simple HTML website sounds too basic, right? Since we are on the final
    leg of this book, we should do something more advanced. That''s right, in the
    following sections we will be learning how to set up a WordPress website. For
    that, however, we first need to install a few tools that WordPress uses.


    # Installing PHP and MySQL


    PHP is one of the most popular programming languages in use today for the web
    look at. It is the code that runs on the server when it receives a request for
    a website. Unlike HTML, PHP can generate dynamic web pages that can change the
    look and content on the fly. We chose PHP to work with because WordPress uses
    PHP. Now, install PHP and the accompanying Apache packages with the following
    command:


    ```

    $ sudo apt-get install php5 libapache2-mod-php5

    ```


    We now have PHP installed with its accompanying Apache packages, and we will proceed
    to test it.'
