    # Introducing NumPy


    NumPy is the fundamental package used for scientific computing with Python and
    it is matrix library for linear algebra. NumPy can also be used as an efficient
    multidimensional container of generic data. Arbitrary datatypes can be defined
    and used. NumPy is an extension to the Python programming language, adding support
    for large, multidimensional arrays and matrices, along with a large library of
    high-level mathematical functions to operate on these arrays. We will be using
    NumPy arrays throughout this book in order to represent images and carry out complex
    mathematical operations on them. NumPy comes with many built-in functions for
    all these operations so that we do not have to worry about all the basic array
    operations. We can directly focus on the concepts and code for computer vision.
    All OpenCV array structures are converted to and from Numpy arrays. So, whatever
    operations you can compute in Numpy, we can process them with OpenCV.


    In this book, we will be using NumPy with OpenCV a lot. Let''s start with some
    simple example programs that will demonstrate the real power of NumPy.


    Open python in the terminal and try out the upcoming examples.'
