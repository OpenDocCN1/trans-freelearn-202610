- pgno: 186
  md: "# # Setting up a SQLite database in Python\n\n**SQLite** (pronounced **Sequel\
    \ Lite**) is a lightweight disk-based database that doesn't require a separate\
    \ server process and uses a modified version of the SQL query language to access\
    \ the data. The entire database is saved in a single file and can be used for\
    \ internal data storage. It is also possible to make a prototype of an application\
    \ using SQLite and then port the code to work with a larger database with minimal\
    \ modifications. The Python standard library has a module called `sqlite3` included,\
    \ which is intended to work with this database. This module is SQL interface-compliant\
    \ with DB-API 2.0.\n\n> You can find more information and the full API reference\
    \ for the SQLite3 module on its official website: https://docs.python.org/2/library/sqlite3.html.\n\
    \nNext is an example on how to use the `sqlite3` module to create a SQLite database\
    \ to store and retrieve some data. We will go through the code, statement by statement,\
    \ and analyze what each statement does and also discuss any variations that might\
    \ be possible.\n\n```\n```python\nimport sqlite3\n\nconn = sqlite3.connect('raspi.db')\n\
    cursor = conn.cursor()\n\n#Inserting Data\ncursor.execute('''\n    CREATE TABLE\
    \ users(id INTEGER PRIMARY KEY, name TEXT,\n                       email TEXT\
    \ unique, password TEXT)\n''')\ncursor.execute(''' INSERT INTO users(name, email,\
    \ password)\n                   VALUES(?,?,?)''', ('luke',\n                 \
    \  'luke@skywalker.com', 'iamurfather'))\n\ncursor.execute(''' INSERT INTO users(name,\
    \ email, password)\n                   VALUES(?,?,?)''', ('Darth Vader',\n   \
    \                'darth@vader.com', 'darkside'))\n\nconn.commit()\n```\n```"
  merge: -1
  img_proc: true
- pgno: 187
  md: "```\n```python\n#Retrieving Data\n\nuser_id = 1\ncursor.execute('''SELECT name,\
    \ email, password FROM users WHERE id=?''', (user_id,))\nuser1 = cursor.fetchone()\n\
    print(user1[0])\nallusers = cursor.fetchall()\nfor row in allusers:\n    print('{0}\
    \ : {1}, {2}'.format(row[0], row[1], row[2]))\n```\n```\n\n```\n```python\n#Deleting\
    \ or Updating Data\n\nnew_email = 'vader@deathstar.com'\nuserid = 2\ncursor.execute('''UPDATE\
    \ users SET email = ? WHERE id = ?''', (new_email, userid))\n\ndel_userid = 1\n\
    cursor.execute('''DELETE FROM users WHERE id = ? ''', (del_userid,))\n\nconn.commit()\n\
    conn.close()\n```\n```\n\nWe will now study the data exchanges that took place\
    \ in the database in the preceding given Python script. Since `sqlite3` is a default\
    \ Python module, we don't need to install any additional dependencies. So we import\
    \ the module into our Python program, and create a new file to save the database\
    \ with the `sqlite.connect()` method. This method creates a new file for the database\
    \ if none exists, and if it does the method connects to it and loads the existing\
    \ database inside the file. Next, we create a cursor that acts as a pointer to\
    \ the data inside the database. As such, we can only manipulate the data that\
    \ the cursor is pointing to. We do this with the `cursor()` method that operates\
    \ on the connection variable, which we created in the last statement."
  merge: -1
  img_proc: true
- pgno: 188
  md: 'Currently, our file does not have a database, so with the next lines of code
    we create a database and insert some data in it. The execute() method takes SQL
    commands as one of the arguments to manipulate data. Hence, to create the database,
    we execute the CREATE TABLE query. In this case, we create a table named users
    that will have a minimum of one data column, which is the key number of the data.
    This ensures that the data has a unique serial ID by which it can be accessed.
    We save three fields for each user: the name, the e-mail ID, and the password.
    So this database can be used for logging in to an application where different
    users can log in. The TEXT type in SQL is the same as str in Python, INTEGER is
    int, REAL is float. To make sure that no two users enter the same e-mail ID, we
    add a "unique" marker to the e-mail column. Now that we have created a database,
    we need to add some data to it. We use the INSERT INTO command to accomplish this.
    After inserting into vi, mention the name of the database into which we want to
    insert the data with the names of the arguments. Then the values function will
    take the actual values of the data. The ? means that the data is given as a value
    in a tuple. We repeat the same process with different data to add rows to the
    database. Notice that we didn’t need to set the serial ID of the data for it to
    be saved properly. That is one advantage of having a cursor in the database. It
    automatically places new data in the next available row in the database. To actually
    write the data into the database file and save it, we need to commit our changes.
    This is done by the commit() function that operates on the connection variable.
    You can visualize the database with a free tool called SQLite Database Browser.
    This is what the database looks like after we have made the changes just specified:


    ![](img/631e8b200cce187082ee46b0eb1681b3_188_0.png)


    Now that we have learned how to insert new data into the database, we will see
    how to read existing data from the database.


    First, we need to know the serial-id, name, e-mail, or password of the user that
    we need to retrieve. Let’s assume in this case we want to retrieve the user details
    by the serial ID. So we execute the SELECT command, which selects a row based
    on the condition that is given. If no condition is given, it will automatically
    select the first row in the database. The whole statement is close to plain English,
    so should be easy to understand. Basically, it selects the columns specified from
    the database name that is given according to a condition given after WHERE.'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'So, after the preceding statement our cursor is pointing toward the row whose
    ID is 1. The `fetchone()` method fetches the data from the row that the cursor
    is pointing to, and saves it in the `user1` variable as a list. Then, we simply
    print the first element of the list, which is the user''s name in this case. However,
    if we want to fetch the data from all the rows in the database, we execute the
    `fetchall()` method. This points the cursor at all the rows in the database starting
    from the first one, and saves the result in the `allusers` variable. Then, we
    simply print the data in a `for` loop.


    We have now learned how to save and retrieve data from the database. But what
    if we want to update user details or delete data? The next block of code (in the
    preceding code snippet) teaches us exactly that.


    Assume that we want to update the e-mail ID of the second user in the database.
    We first set the new e-mail ID in a string variable, and then the user that we
    want to select in an integer variable. Then, to update the data, we use the `UPDATE`
    SQL query. It takes two or more arguments in addition to the database that we
    want to update: the data that we want to update and a condition, in this case
    the serial ID of the row. Both of which we give by using the `?` technique we
    described earlier. The condition operator `WHERE` operates in exactly the same
    way in `UPDATE` as it does in `SELECT`, pointing the cursor according to the condition
    given. After the update, this is what our table looks like:


    ![](img/631e8b200cce187082ee46b0eb1681b3_189_0.png)


    To delete some data, we use the `DELETE` query and select the database with the
    `FROM` query. We also employ the condition by using the `WHERE` query and giving
    it the serial ID we want to delete.'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'Since we have changed the data in the database, to write the changes into the
    file we use the `commit()` method, and finally release the file from the Python
    script with the `close()` method. This ensures that no new changes can be made
    to the file unless it is connected again. If we close the file without committing
    the changes, no changes will be reflected in the database and we will have lost
    any changes that we previously made. This is what the table looks like after we
    delete the first row:


