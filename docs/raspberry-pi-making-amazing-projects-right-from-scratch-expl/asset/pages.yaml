  md: "```\n```python\nimport cv2.cv as cv\nimport time\n\ncv.NamedWindow(\"camera\"\
    , 1)\n\ncapture = cv.CaptureFromCAM(0)\ncv.SetCaptureProperty(capture, 3, 360)\n\
    cv.SetCaptureProperty(capture, 4, 240)\n\nwhile True:\n    img = cv.QueryFrame(capture)\n\
    \    cv.ShowImage(\"camera\", img)\n    if cv.WaitKey(10) == 27:\n        break\n\
    \ncv.DestroyAllWindows()\n```\n```\n\nThe two lines that you'll add are the two\
    \ with the `cv.SetCaptureProperty`; they will set the resolution of the image\
    \ to 360 by 240. To run this program, you'll need to either have a display and\
    \ keyboard connected to Raspberry Pi or use vncviewer. When you run the code,\
    \ you should see the window displayed, as shown in the following image:\n\n![](img/631e8b200cce187082ee46b0eb1681b3_565_0.png)\n\
    \nIf you are using RaspCam and don't see an image, you will need to run the `sudo\
    \ modprobe bcm2835-v4l2` command. Now you can see the outside world!"
  merge: -1
  img_proc: true
- pgno: 566
  md: 'You may want to play with the resolution to find the optimum settings for your
    application. Bigger images are great—they give you a more detailed view on the
    world—but they also take up significantly more processing power. You''ll play
    with this more as you actually ask your system to do some real image processing.
    Be careful if you are going to use vncserver to understand your system performance,
    as this will significantly slow down the update rate. An image that is twice the
    size (width/height) will involve four times more processing. You can now use this
    capability to do a number of impressive tasks.


    # Edge Detection and OpenCv


    Fortunately, one of the examples in the OpenCV Python set is a program named edge.py.
    The following is that file (with blank lines removed):


    ![](img/631e8b200cce187082ee46b0eb1681b3_566_0.png)'
  merge: -1
  img_proc: true
- pgno: 567
  md: 'This program uses the Canny image detection algorithm implemented by OpenCV
    to find the edges in any image. For more on the Canny edge algorithm, refer to
    http://das1.mem.drexel.edu/alumni/bGreen/www.pages.drexel.edu/_weg22/can_tut.html
    or http://opencv-python-tutroals.readthedocs.org/en/latest/py_tutorials/py_imgproc/py_canny/py_canny.html.
    You captured an image earlier; you can use this program to look at the edges and
    to also see how setting a different threshold can show more/less edges. Run the
    program with the image captured earlier and you will see the following:


    ![](img/631e8b200cce187082ee46b0eb1681b3_567_0.png)'
  merge: -1
  img_proc: true
- pgno: 568
