- pgno: 582
  md: '# Accessing Your Biped Remotely


    This is the interesting part of the code. This code takes the input from the remote
    computer and translates it into action. The first if statement determines what
    type of data is being sent from the remote computer with the joystick attached.
    It can be a button press, where data["type"] == 10, and then the statement data["info"]["button"]
    == 2 determines that button 2 has been pressed. In this case, this will send commands
    that will cause the robot to go to the home position. If the if data["type"] ==
    7;, then this is a joystick event, and the if data["info"]["value"] < - 0.9, then
    this will determine that the joystick is in the up position and the robot should
    move forward.


    The following is the final part of the joystick controller aspect of the client
    program for completeness:


    ![](img/631e8b200cce187082ee46b0eb1681b3_582_0.png)


    This final piece of code initializes the game loop, which loops while taking the
    inputs, sends them to the servo controller, and on to the flight controller.


    You''ll also need a server program running on the remote computer that will take
    the signals from the game controller and send them to the client. You''ll be writing
    this code in Python using Python version 2.7, which can be installed from here.
    Additionally, you''ll need to install the pygame library. If you are using Linux
    on the remote computer, then type sudo apt-get install python-pygame. If you are
    using Microsoft Windows on the remote machine, then follow the instructions at
    http://www.pygame.org/download.shtml.'
  merge: -1
  img_proc: true
- pgno: 583
  md: 'You''ll also need the LAN communication layer described previously. You can
    find a version that will run on Microsoft Windows or Linux at http://mccormick.cx/projects/PodSixNet/.
    The following is a listing of the server code in two parts:


