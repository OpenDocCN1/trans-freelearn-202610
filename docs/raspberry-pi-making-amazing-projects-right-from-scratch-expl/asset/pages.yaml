- pgno: 405
  md: '# Making it dynamic


    Now that we have the layout code defined for our control panel page, we can insert
    it in our PHP page so that it can be modified dynamically by the PHP script on
    the Web server, depending on the status of our home security system.


    The PHP script will help us achieve the following basic functions:


    +   - Updating the configuration file with the position of the on/off switches
    for zones

    +   - Arming and disarming the system

    +   - Telling us which zone has been triggered when an intrusion has been detected


    Again, I''m not going to go into detail about how the PHP code works, but hopefully
    the comments within the code will help you follow what''s going on, and also help
    you modify it if you want to change its behavior.


    # Getting a bit of help first


    Unless you change some of the PHP configuration, it can be a nightmare trying
    to work out what''s gone wrong if you have a small bug in your code, as basically
    you are presented with...nothing!


    So, before we create and build our PHP page, we''ll change a couple of settings
    in the PHP configuration file to make sure we know if there are any issues:


    +   1. Open the configuration file with Nano:

    +      `$ sudo nano /etc/php5/cgi/php.ini`

    +   2. The file is a bit large and unwieldy, but battle your way through it, find
    these settings, and change them as follows:

    +      `error_reporting = E_ALL`

    +      `display_errors = On`

    +   3. Save the file and exit Nano.

    +   4. Finally, restart Lighty:

    +      `$ sudo /etc/init.d/lighttpd restart`'
  merge: -1
  img_proc: true
- pgno: 406
  md: '# The main PHP code


    And here it is... But don''t run it yet—there''s still a bit more to do...


    You can find the full main PHP code in the `index.php` file located inside the
    code folder of `chapter 7`. In our Web server content folder, we should now have
    the following files:


    ```

    pi@raspberrypi ~ $ ls -l /var/www

    alarm-panel.css

    alarm-panel.html

    index.lighttpd.html

    index.php

    phpinfo.php

    ```


    # I''m someone else


    Now, before we can actually open this PHP web page successfully, we need to be
    aware of the fact that the Web server, by default, actually runs as a different
    user called `www-data`. This means that it doesn''t ordinarily have the right
    to perform certain operations; in particular, those that interact with the file
    system.


    If you worked through the previous PHP script, you''ll see that it actually executes
    some Linux commands to read and update our `alarm.cfg` file.


    In the same way that we have to put `sudo` in front of many commands because we''re
    not the root user, it is true for other users as well, including `www-data`. So,
    to give the Web server rights to execute certain commands, we need to add it as
    a **sudoer**, using the **visudo** utility.


    Run the utility to open the sudoer configuration file:


    ```

    $ sudo visudo

    ```


    At the bottom of the file, add the following line:


    ```

    www-data ALL=(ALL) NOPASSWD:/bin/cat,/etc/pi-alarm/update-alarm-setting.sh

    ```


    Then save the file and exit.'
  merge: -1
  img_proc: true
- pgno: 407
  md: 'The final thing we have to do is create a small **Bash script** that will handle
    the task of updating settings in our `alarm.cfg` file. The reason why we need
    to do this is because we''re going to use the Linux sed command to update the
    file. The way that we are invoking the sed command means that it needs to create
    a temporary file. Unless we do a bit of work with configuring the Web server because
    of its file location context, it won''t work. So, it''s easier to create a stub
    Bash script that is called by the PHP script. In this way, the Bash environment
    deals with the temporary file context.


    So, we''ll create the following Bash script and save it in our `/etc/pi-alarm`
    folder:


    ```

    ```bash

    #!/bin/bash

    #/etc/pi-alarm/update-alarm-setting.sh

    ###############################################

    # Provides access to the sed command from  #

    # PHP as it needs write access to a temp  #

    # folder.                                  #

    # $1 - Setting Name                        #

    # $2 - Setting Value                       #

    ###############################################


    sed -i "s/^ ($1\s*= *).*/\1$2/" /etc/pi-alarm/alarm.cfg

    ```

    ```


    `update-alarm-setting.sh`


    And then we need to give the script execution rights:


    ```

    ```bash

    $ sudo chmod 777 /etc/pi-alarm/update-alarm-setting.sh

    ```

    ```


    This is what we should see in our `/etc/pi-alarm` folder at this time:


    ```

    ```text

    pi@raspberrypi ~ $ ls -l /etc/pi-alarm

    alarm.cfg

    update-alarm-setting.sh

    ```

    ```


    Right, after all that, I think we can now launch the control panel page in our
    browser at


    ```

    ```text

    http://<my-pi-ip>.

    ```

    ```


    `index.php` is configured as a default page in Lighty''s config, so you don''t
    need to add it to the end of the URL; just the IP address will suffice.'
  merge: -1
  img_proc: true
- pgno: 408
  md: 'By changing the switch positions and then clicking on the **Update System**
    button, you should find that the setting values get updated accordingly in `alarm.cfg`.
    You can now see how this file will be the way for the status to be exchanged between
    our web console and the security system scripts that we’ll develop in *Chapter
    9, Putting It All Together.*


    ![](img/631e8b200cce187082ee46b0eb1681b3_408_0.png)


    The final operational control panel


    # Remote access to our control panel


    While we can set up our system to receive email alerts when our system detects
    an intrusion, it would be really useful to be able to access our Web-based control
    panel wherever we are so that we can perhaps arm and disarm the system or switch
    off certain zones when we’re not there.'
  merge: -1
  img_proc: true
- pgno: 409
  md: 'However, in order to make this possible we need to do a few things:


    # Setting up a dynamic DNS account


    Most of us won''t have a **fixed IP address** for the Internet connection in our
    home; it is likely to change from time to time, especially when we reboot or unplug
    our router, whereby our Internet service provider assigns us a new one when we
    next connect to them. Because of this, we can''t rely on using the IP address
    to get to our home network when we''re out and about. To solve this, we need to
    set up a **dynamic DNS account** that will allow us to set up a domain name for
    our home network (for example, *myhomenetwork.com*).


    It works by having a service that runs inside your network, such as on your router
    or laptop, that updates the dynamic DNS service hosting your domain name with
    the current IP address of your Internet connection. Then, when you use your domain
    name in your browser, it will take you to a Web server on your home network.


    Popular dynamic DNS providers out there include No-IP (www.noip.com) and DynDNS
    (www.dyn.com). You can also get a free DnsOMatic account with OpenDNS to manage
    your services (www.dnsomatic.com).


    ![](img/631e8b200cce187082ee46b0eb1681b3_409_0.png)


    My Netgear NAS device has a DnsOMatic updater service add-on'
  merge: -1
  img_proc: true
- pgno: 410
  md: "![](img/631e8b200cce187082ee46b0eb1681b3_410_0.png)\n\nMy Netgear Router has\
    \ the option of updating a Dynamic DNS service\n\n# The Raspberry Pi dynamic DNS\
    \ client\n\nSince your Raspberry Pi-based home security system is likely to always\
    \ be on, you might want to install the **ddclient** updater service on there instead:\n\
    \n```\nsudo apt-get install ddclient\n```\n\nOnce installed, you can set it up\
    \ for your particular service and account details using the following config file:\n\
    \n```\nsudo nano /etc/ddclient.conf\n```\n\n# Setting up a static IP on your Raspberry\
    \ Pi\n\nSo that our home network always knows where to find your Raspberry Pi,\
    \ we need to set up a **static IP address** on it, assuming that it currently\
    \ acquires an IP address from your router's DHCP server each time it boots up.\n\
    \n+   1. To do this, we need to edit the network settings on the Raspberry Pi.\
    \ In Nano, open the following configuration file:\n+   \n+      ```bash\n+   \
    \   sudo nano /etc/network/interfaces\n+      ```"
  merge: -1
  img_proc: true
- pgno: 411
  md: "2. You'll probably find the Ethernet port configuration set to something like\
    \ this:\n\n```\nauto eth0\nallow-hotplug eth0\niface eth0 inet manual\n```\n\n\
    3. Change this configuration to be an unused static IP address on your network.\
    \ In my case, I've set it to 192.168.0.99. The gateway setting is the IP address\
    \ of my Internet router:\n\n```\nauto eth0\nallow-hotplug eth0\niface eth0 inet\
    \ static\n    address 192.168.0.99\n    netmask 255.255.255.0\n    gateway 192.168.0.1\n\
    ```\n\n4. Now, we need to restart the networking service – note that you'll be\
    \ disconnected from your terminal session. You'll need to reconnect using the\
    \ new IP address:\n\n```\n$ sudo /etc/init.d/networking restart\n```\n\nIf you\
    \ have any issues, simply restart the Pi with sudo reboot and all should be good\
    \ when it comes back up.\n\n# Port-forwarding\n\nThe final piece of this puzzle\
    \ is to make sure that our Internet router will direct incoming traffic on a given\
    \ port to our Raspberry Pi's Web server. For the purpose of this example, I'm\
    \ going to assume that we are going to stick to the default, port 80, on our Web\
    \ server.\n\n> A word about security\n> Given that our Web server will now be\
    \ accessible from the outside world, we need to be mindful about securing our\
    \ system properly. The two main ways to do this are to change the Web server port\
    \ to a random number other than 80 (for example, 8799) and add password protection\
    \ to your site by applying basic authentication. Both of these can be done in\
    \ the lighttpd configuration file."
  merge: -1
  img_proc: true
- pgno: 412
  md: 'Most routers will allow you to set up **port-forwarding** as part of their
    **firewall** configuration. Essentially, setting this means that any incoming
    traffic from the Internet on a given TCP port will be allowed to pass through
    the router and will be directed to the device with the specified IP address. On
    my Netgear router, it''s set up as shown in the following screenshot:


    ![](img/631e8b200cce187082ee46b0eb1681b3_412_0.png)


    Now, when you enter your personal domain name in your browser, when you''re away
    from home you should be taken to your alarm control panel.


    > You might also want to consider opening up port 22 so that you can access the
    Raspberry Pi directly using PuTTY and SSH from outside your network.'
  merge: -1
  img_proc: true
- pgno: 413
  md: '# Summary


    We''ve now started building the software that will control our home security system
    by determining the format of the main configuration file. We''ve also installed
    a Web server and built a basic single-page control panel with PHP, HTML5, and
    CSS3, which can be accessed nicely on our mobile phone, allowing us to configure
    our system and view the status.


    In addition, we''ve learned how to configure our home network and Raspberry Pi
    so that we can access our control panel when we''re away from home.


    In Chapter 9, Putting It All Together, we''ll put all of the electronic elements
    together and write the main scripts that will run the home security system. But
    before that, in the next chapter, we''re going to look at a few other bits and
    pieces, such as adding other sensors, not necessarily related to intruder detection,
    to our home security system. We''ll also look at how we can administer our entire
    Raspberry Pi system remotely using a Web browser, in addition to accessing our
    home security control panel.'
  merge: -1
  img_proc: true
