  md: "# # Logical operations on images\n\nOpenCV provides bitwise logical operation\
    \ functions on images. We will take a look at functions that provide bitwise logical\
    \ AND, OR, XOR (exclusive OR), and NOT (inversion) functionalities. These functions\
    \ can be better demonstrated visually with grayscale images. I am going to use\
    \ barcode images in horizontal and vertical orientations for demonstration. Look\
    \ at the following code:\n\n```\n```python\nimport cv2\nimport matplotlib.pyplot\
    \ as plt\n\nimg1 = cv2.imread('Barcode_Hor.png',0)\nimg2 = cv2.imread('Barcode_Ver.png',0)\n\
    not_out=cv2.bitwise_not(img1)\nand_out=cv2.bitwise_and(img1,img2)\nor_out=cv2.bitwise_or(img1,img2)\n\
    xor_out=cv2.bitwise_xor(img1,img2)\n\ntitles = ['Image 1','Image 2','Image 1 NOT','AND','OR','XOR']\n\
    images = [img1,img2,not_out,and_out,or_out,xor_out]\n\nfor i in xrange(6):\n \
    \   plt.subplot(2,3,i+1)\n    plt.imshow(images[i],cmap='gray')\n    plt.title(titles[i])\n\
    \    plt.xticks([]),plt.yticks([])\nplt.show()\n```\n```\n\nWe first read images\
    \ in the grayscale mode and calculate the NOT, AND, OR, and XOR, and then, with\
    \ matplotlib, we display them in a neat way. We are leveraging the `plt.subplot()`\
    \ function here to display multiple images. In this example, we are creating a\
    \ two row and three column grid for our images and displaying each image in every\
    \ part of the grid. You can modify this line and make it `plt.subplot(3,2,i+1)`\
    \ in order to create a three row and two column grid.\n\nWe can do this without\
    \ a loop in the following way. For each image, you have to write the following\
    \ statements. I am writing this for the first image here only. Go ahead and write\
    \ it for the rest of the five images:\n\n```\n```python\nplt.subplot(2,3,1) ,\
    \ plt.imshow(img1,cmap='gray') , plt.title('Image 1') , plt.xticks([]),plt.yticks([])\n\
    ```\n```"
