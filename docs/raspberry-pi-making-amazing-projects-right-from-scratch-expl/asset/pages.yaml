- pgno: 353
  md: '# 5

    Adding a Passive Infrared Motion Sensor


    In the previous chapter, we started adding basic but commonly used magnetic switch
    sensors to our home security system and reading their status to protect doors
    and windows from intrusion. We also looked at how we can divide our home into
    zones, such as by individual rooms, so that we can group our sensors into logical
    circuits, which can then be identified as part of these zones rather than as individual
    sensor inputs.


    We will now add **motion sensors** to our system in the form of **Passive Infra-Red
    (PIR)** detectors. These detectors come in a variety of types, and you may have
    seen them lurking in the corners of rooms. Fundamentally, they all work in the
    same way, which is detecting the presence of body heat within a certain range;
    so, they are commonly used to trigger alarm systems when somebody (or something,
    such as a pet cat) enters a room.


    ![](img/631e8b200cce187082ee46b0eb1681b3_353_0.png)


    A typical PIR motion sensor (type GardScan QX-PIR)'
  merge: -1
  img_proc: true
- pgno: 354
  md: 'In this chapter, we will:


    +   - Learn how PIR detectors work and how they are set up

    +   - Connect a wired PIR detector to an input on our port expander

    +   - Start using a 12V power supply instead of 3.3V in our zone circuits

    +   - Learn how to interface 12V circuits safely with our GPIO ports

    +   - Learn how to connect a 433 MHz wireless receiver to our Raspberry Pi

    +   - Connect a remote-controlled switch to our system using 433 MHz radio signals

    +   - Write a script that will detect and log the state of our detector inputs
    when it changes


    # Prerequisites


    You''ll need the following parts for this chapter (apart from the components used
    in the previous chapter):


    +   - A passive infrared detector, the wired type (this is available from any
    DIY store)

    +   - A 4N25/4N35 opto-isolator

    +   - A 1N4148 diode

    +   - A 1-Kohm resistor

    +   - A 10-Kohm resistor

    +   - A 433 MHz receiver module and remote transmitter (this is optional)

    +   - A 12V power supply

    +   - A hook-up wire

    +   - A 6 core alarm wire


    # Passive infrared sensors explained


    You might not realize it, but all objects radiate heat energy (including your
    coffee table); it''s just that you can''t see it because heat consists essentially
    of infrared waves, which are invisible to the human eye (exactly the same as your
    TV remote control). These waves can, however, be detected by electronic devices
    designed for such a purpose, such as the infrared receiver in your TV that detects
    the energy emitted by your remote control when the buttons are pressed.'
  merge: -1
  img_proc: true
- pgno: 355
  md: 'You probably do realize, however, that living things such as us, our cat, and
    the mouse under the floorboards generate quite a bit of heat. Passive infrared
    motion sensors used in security systems and automatic lights are designed to detect
    this level of heat. The term passive is used because the sensors themselves do
    not radiate any energy for detection purposes — instead, they just detect the
    infrared radiation emitted by objects. This is notably different from devices
    such as ultrasonic sensors and radars, which rely on detecting reflections from
    objects of the pulses of energy that the sensors send out.


    PIR sensors need to be a little smart because they effectively have to cope with
    constantly varying temperatures in the room. They settle on the background temperature
    of the room they are in, such as that of a wall or floor that they point to. When
    an object, such as one of us or our cat, moves between the detector unit and the
    background object, the temperature in front of the sensor rises to the body temperature
    quickly, and this in turn triggers the system.


    # Setting up your PIR sensor


    PIR sensor devices come in many formats, including different materials in sensor
    chips and the lens in front of the sensor view window that can widely affect the
    range, field of view, and sensitivity of the device. Therefore, your best guide
    to setting up a sensor will usually be in that little bit of instruction paper
    that comes with it.


    However, regardless of the type of PIR sensor you have, here are some general
    guidelines when considering where you mount your sensor in order to avoid false
    triggers:


    +   - Ensure that the device is mounted on a solid foundation and not affected
    by vibration

    +   - Never mount it in a location where direct or reflected sunlight can be picked
    up by the lens

    +   - Similarly, never mount the device facing or above heat sources

    +   - Don''t mount the unit in draughty locations as this will affect its background
    temperature calibration


    The location of the unit also depends on the area you want to protect. You may
    want to detect people entering your living room from the hallway, so your coverage
    area could be defined as being from the corner of the room where the device is
    mounted to the living room door.


    PIR sensors usually offer a fixed field of view (for example 90 or 110 degrees)
    but have a varying range, depending on the angle at which they are pointing down
    and the height at which they are located.'
  merge: -1
  img_proc: true
