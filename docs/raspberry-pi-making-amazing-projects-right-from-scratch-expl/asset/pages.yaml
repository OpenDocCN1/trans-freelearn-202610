    # The Pi camera versus the webcam


    Now, after using the webcam and the Pi Camera, it''s a good time to understand
    the differences, the pros, and the cons of using these.


    The Pi camera board does not use a USB port and is directly interfaced to the
    Pi. So, it provides better performance than a webcam in terms of the frame rate
    and resolution. We can directly use the `picamera` module in Python to work on
    images and videos. However, the Pi camera cannot be used with any other computer.


    A webcam uses an USB port for interface, and because of that, it can be used with
    any computer. However, compared to the Pi Camera its performance, it is lower
    in terms of the frame rate and resolution.


    # Summary


    In this chapter, we learned how to use a webcam and the Pi camera. We also learned
    how to use utilities such as `fswebcam`, `avconv`, `raspistill`, `raspivid`, mencoder,
    and omxplayer. We covered how to use `crontab`. We used the Python `picamera`
    module to programmatically work with the Pi camera board. Finally, we compared
    the Pi camera and the webcam. We will be reusing all the code examples and concepts
    for some real-life projects soon.


    In the next chapter, we will learn about programming Pi GPIO with PiGlow, which
    is a third-party add-on board for the Pi.'
