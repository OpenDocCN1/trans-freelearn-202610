  md: '![](img/631e8b200cce187082ee46b0eb1681b3_375_0.png)


    The test photo taken by the Raspberry Pi Camera Module


    > If you find that raspistill outputs errors when you run it, ensure that it is
    connected properly at both ends of the ribbon cable. One other catch is that sometimes
    the ribbon that connects the actual camera lens component to the tiny connector
    on the camera board can come loose. Just ensure that this is securely connected
    too. I''ve had this issue a couple times after the camera modules have been taken
    out of my box of random test bits to be used.


    The raspistill utility has loads of options for manipulating the images it captures,
    and we''ll use some of them a bit later in our capture script. In the meantime,
    to see the available options, run `raspistill` without any options and they will
    be listed:


    ```

    ```bash

    $ raspistill

    ```

    ```


    # # Be a video star


    Now that we know our camera module is working, we can try and capture some video.
    To do this, we''ll use the `raspivid` utility. The following command will take
    5 seconds of high-definition video and save the file to your Raspberry Pi:


    ```

    ```bash

    $ raspivid -o test.h264 -t 5000

    ```

    ```


    You''ll notice that file is called `test.h264`—this is because the video is captured
    as a raw **H.264** video stream. Unfortunately, not many media players will handle
    these files (although VLC player will—it rocks and handles practically anything
    you throw at it—get it on your PC at `www.videolan.org`).'
