- pgno: 74
  md: "# Building Games with PyGame\n\nNow, since we changed the position of the head\
    \ of the snake, we have to update the snakeSeg variable to reflect this change\
    \ in the snake body. For this, we use the `insert()` method and give the position\
    \ of object we want to append and the new coordinates. This adds the new coordinates\
    \ of the snake head into the snakeSeg variable. Then comes the interesting part,\
    \ where we check whether the snake has reached the food. If it has, we increment\
    \ the score, set the foodSpawned state to False, and increase SpeedCount by one.\
    \ So, once the speed count reaches five, the speed is increased by one unit. If\
    \ not, then we remove the last coordinate with the `pop()` method. This is interesting\
    \ because if the snake has eaten the food, then its length will increase; consequently,\
    \ the `pop()` method in the `else` statement will not be executed, and the length\
    \ of the snake will be increased by one unit.\n\nIn the next block of code, we\
    \ check whether the food is spawned; if not, we randomly spawn it, keeping in\
    \ mind the dimensions of the screen. The `randrange()` function from the random\
    \ package allows us to do exactly that.\n\nFinally, we get to the part where the\
    \ actual rendering takes place. Rendering is nothing but a term for the process\
    \ that is required to generate and display something on screen. The first statement\
    \ fills the screen with our selected background color so that everything else\
    \ on the screen is easily visible:\n\n```\nfor position in snakeSeg:\n    pygame.draw.rect(gameSurface,\
    \ snakeColor, Rect(position[0], position[1],\n    20, 20))\n```\n\nThe preceding\
    \ block of code loops through all the coordinates present in the snakeSeg variable\
    \ and fills the space between them with the color specified for our snake in the\
    \ initialization code. The rect function takes three inputs: the window name on\
    \ which the game will be played, the color of the rectangle, and the coordinates\
    \ of the rectangle that are given by the Rect function. The Rect function itself\
    \ takes four arguments: the x and y position and height and width of the rectangle.\
    \ This means that for every coordinate contained in the snakeSeg variable, we\
    \ draw on a rectangle that has dimensions of 20 x 20 pixels. So, we can see that\
    \ we do not have to keep track of the snake as a whole; we only have to keep track\
    \ of the coordinates that describe the snake.\n\nNext, we draw our food using\
    \ the `circle()` method from the draw module in the PyGame package. This method\
    \ takes five arguments: the window name, the color, the centre of the circle,\
    \ the radius, and the width of the circle. The centre of the circle is given by\
    \ a tuple that contains the x and y coordinates that we selected previously. The\
    \ next statement, `pygame.display.flip()`, actually displays what we have just\
    \ drawn."
  merge: -1
  img_proc: true
