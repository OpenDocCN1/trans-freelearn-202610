- pgno: 549
  md: '# # Dynamic path planning for your robot


    Now that you can see barriers and also know direction, you''ll want to do dynamic
    path planning. Dynamic path planning simply means that you don''t have a knowledge
    of the entire world with all the possible barriers before you encounter them.
    Your robot will have to decide how to proceed while it is in the middle and actually
    moving. This can be a complex topic, but there are some basics that you can start
    to understand and apply as you ask your robot to move around its environment.
    Let''s first address the problem of knowing where you want to go and needing to
    execute a path without barriers, and then adding in barriers.


    # ## Basic path planning


    In order to talk about dynamic path planning, that is, planning a path where you
    don''t know what barriers you might encounter, you''ll need a framework to understand
    where your robot is as well as to determine the location of the goal. One common
    framework is an *x-y* grid. The following is a drawing of such a grid:


    ![](img/631e8b200cce187082ee46b0eb1681b3_549_0.png)'
  merge: -1
  img_proc: true
- pgno: 550
  md: '# Path Planning and Your Biped


    There are three key points:


    +   - The lower left point is a fixed reference position. The directions *x* and
    *y* are also fixed, and all other positions will be measured with respect to this
    position and these directions.

    +   - Another important point is the starting location of your robot. Your robot
    will then keep track of its location by using its *x* coordinate, or position
    itself with respect to some fixed reference position in the *x* direction, and
    its *y* coordinate, its position with respect to some fixed reference position
    in the *y* direction to the goal. It will use the compass to keep track of these
    directions.

    +   - The third important point is the position of the goal, also given in *x*
    and *y* coordinates with respect to the fixed reference position. If you know
    the starting location and the starting angle of your robot, you can plan an optimum
    (shortest distance) path to this goal. To do this, you can use the goal location
    and the robot location, and some fairly simple math to calculate the distance
    and angle from the robot to the goal.


    To calculate the distance, use the following equation:


    $$d = \sqrt{(X_{goal}-X_{goal})^2 + (Y_{goal}-Y_{robot})^2}$$


    Use the following equation to tell your robot how far to travel to the goal. A
    second equation will tell your robot the angle it needs to travel:


    $$\theta = \arctan\left(\frac{Y_{goal}-Y_{robot}}{X_{goal}-X_{goal}}\right)$$


    The following is a graphical representation of these two pieces of information:'
  merge: -1
  img_proc: true
- pgno: 551
  md: '![](img/631e8b200cce187082ee46b0eb1681b3_551_0.png)


    Now that you have a goal angle and distance, you can program your robot to move.
    To do this, you will write a program to do path planning and call the movement
    functions that you created in *Chapter 3, Motion for the Biped*. You will, however,
    need to know the distance that your robot travels in a step so that you can tell
    your robot how far to travel in steps, not distance units.


    You''ll also need to be able to translate the distance that might be covered by
    your robot in a turn; however, this distance may be too small to be of any importance.
    If you then know the angle and the distance, you can move your robot to the goal.


    The following are the steps you will program:


    +   1. Calculate the distance in units that your robot will need to travel in
    order to reach the goal. Convert this to number of steps to achieve this distance.

    +   2. Calculate the angle that your robot will need to travel to reach the goal.
    You''ll use the compass and your robot turn functions in order to achieve this
    angle.

    +   3. Now, call the step functions the proper number of times required to move
    your robot the correct distance.'
  merge: -1
  img_proc: true
