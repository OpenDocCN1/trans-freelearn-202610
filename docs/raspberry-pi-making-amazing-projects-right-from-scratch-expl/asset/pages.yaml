- pgno: 89
  md: "# Using picamera in Python with the Pi Camera module\n\nThe picamera is a Python\
    \ package that provides a programming interface to the Pi Camera module. The most\
    \ recent version of raspbian has picamera preinstalled. If you do not have it\
    \ installed, you can install it using:\n\n```\nsudo apt-get install python-picamera\n\
    ```\n\nThe following program quickly demonstrates the basic usage of the picamera\
    \ module to capture an image:\n\n```\nimport picamera\nimport time\n\nwith picamera.PiCamera()\
    \ as cam:\n    cam.resolution=(1024,768)\n    cam.start_preview()\n    time.sleep(5)\n\
    \    cam.capture('/home/pi/book/output/still.jpg')\n```\n\nWe have to import time\
    \ and picamera modules first. cam.start_preview() will start the preview, and\
    \ time.sleep(5) will wait for 5 seconds before cam.capture() captures and saves\
    \ image in the specified file.\n\nThere is a built-in function in picamera for\
    \ timelapse photography. The following program demonstrates its usage:\n\n```\n\
    import picamera\nimport time\n\nwith picamera.PiCamera() as cam:\n    cam.resolution=(1024,768)\n\
