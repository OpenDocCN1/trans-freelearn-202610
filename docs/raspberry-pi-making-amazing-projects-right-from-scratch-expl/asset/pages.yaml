- pgno: 5
  md: '# Preface


    Machine learning and predictive analytics are becoming one of the key strategies
    for unlocking growth in a challenging contemporary marketplace .It is one of the
    fastest growing trends in modern computing and everyone wants to get into the
    field of machine learning. In order to obtain sufficient recognition in this field,
    one must be able to understand and design a machine learning system that serves
    the needs of a project. The idea is to prepare a Learning Path that will help
    you to tackle the real-world complexities of modern machine learning with innovative
    and cutting-edge techniques. Also, it will give you a solid foundation in the
    machine learning design process, and enable you to build customized machine learning
    models to solve unique problems


    # What this learning path covers


    *Module 1, Raspberry Pi By Example,* provides you an introduction to the Raspberry
    Pi. It helps in building games with PyGame and creation of real-life applications
    with the Raspberry Pi. It further demonstrates the GPIO and cameras with advanced
    concepts in OpenCV. This module further delves with setting up a web server and
    creating network utilities.


    *Module 2, Building a Home Security System with Raspberry Pi,* lets you explore
    the GPIO Port along with building input / output expansion board which helps in
    overcoming the limitations on GPIO. It helps you to create log files based on
    events using Bash Scripts. This module further covers a miscellany of things for
    accessing home security control panel.


    *Module 3, Raspberry Pi Robotics Essentials,* starts with configuring and programming
    Raspberry Pi, along with construction of biped platform. It further covers in-depth
    planning of biped with the details of connecting webcam, hardware and software
    in order to use input visual data into our system.'
  merge: -1
  img_proc: true
- pgno: 6
  md: '# What you need for this learning path


    +   - Module 1, Raspberry Pi By Example, recommends you to use the following kit:

    +     Raspberry Pi Model B, B+ or 2 (Multiple boards for last two chapters)

    +     USB hub, powered preferably

    +     Networking hub

    +     PC for preparing SD card

    +     Webcam and/or Pi Camera

    +   - Module 2, Building a Home Security System with Raspberry Pi,, will need
    the following software:

    +     Gparted dd fake-hwclock

    +     Win32 Disk Imager 0.9.5 PuTTY

    +     i2c-tools

    +   - Module 3, Raspberry Pi Robotics Essentials, asks you to use Raspbian, putty,
    Image Writer for Windows, libusb-1.0.0-dev and VncServer.


    # Who this learning path is for


    Novice programmers and hobbyists who want to understand how to use Raspberry Pi
    to build interesting projects and home automation systems, as well as for those
    who want to delve deeper into the world of Raspberry Pi


