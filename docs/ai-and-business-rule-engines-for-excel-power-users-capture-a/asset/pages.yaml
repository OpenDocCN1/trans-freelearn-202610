- pgno: 111
  md: 'KIE also has an incredible time-saving feature around Decision Engines – it
    can analyze the rules you are writing and highlight any gaps in them. This is
    especially powerful when we specify the range of input and output values when
    working with numbers or constrain the list of valid text as we did with our **Special
    Requests** data type. KIE knows you should write rules to address each of the
    **diabetic**, **vegan**, or **lactose intolerant** values. If you don’t, KIE will
    give you a warning (not an error) in the **Problems** tab on the editor.


    The more specific we can be in matching our rules, the easier it is for KIE to
    highlight any gaps we might have. Changing the HIT policy to match the **First**
    business rule made our sample easier to understand, but you can see KIE gives
    a warning that you should consider a more accurate HIT policy.


    Decision tables are also fast. Because they are business rules written in a When...
    Then format, Drools as a business rule engine can optimize the rules and will
    actually get faster over time. *Chapter 12, Inside the Rule Engine*, explains
    the mechanism behind this, but for now, consider Decision Tables as your go-to
    solution when modeling decisions.


    # Decision Tables as your go-to solution (other nodes are available)


    It is possible to use other types of nodes to make a decision. For example, our
    greeting example in *Chapter 3, Your First Business Rule with the Online KIE Sandbox*,
    made a decision based on a simple FEEL expression. In real life, we would not
    use a Decision Model or rule engine for such a simple example.


    Using Decision Tables as the default option for expressing our business rules
    makes it easier to understand what the other nodes and expressions do:


    +   - We use Decision Tables to express the business rules that make decisions


    +   - We use other nodes to prepare data to feed into the Decision Table


    We can see this pattern in our simple example that we populated from *Figure 4.11*
    onwards – the **Customer** data node defined the type of information we expected
    and the rules Decision Table in the **Recommend Product** node made the decision.
    So, what are the other types of nodes that can help prepare our data?


    # More nodes that you can use


    We’ve already covered the nodes that you will use most often to model your decisions.
    But there are several other nodes worth exploring. *Figure 4.15* showcases the
    different types of nodes available in KIE decision models:'
  merge: -1
  img_proc: true
- pgno: 112
  md: '![](img/48815d6f06dc8c7aeaa3963d289fb1e7_112_0.png)


    Figure 4.15 – The different Decision Model nodes in KIE


    Of all the nodes we see in *Figure 4.15*, we’ve already used Data and Decision
    nodes. But there are some other types that we’ll need soon:


    +   - **Text nodes** allow us to add comments to our Decision Models to explain
    what is going on. They are for information only and not evaluated.

    +   - **Knowledge Source nodes** also gives additional information but refers
    to an external source. For example, we might use a Knowledge Source to link to
    the document certifying which of our products are OK for each medical condition.
    They are for information only and are not evaluated.

    +   - **Decision Services nodes** help since our Decision Models can get quite
    complicated. Decision Service nodes allow us to *wrap* this complexity to hide
    some of the internals, making it clearer what input and output we expect.

    +   - **Business Knowledge Models** allow us to call external rules. These could
    be Decision Services, other Decision Models, an external system (via Java), or
    an external AI model. We can also use them to define reusable functions using
    FEEL, which we cover in more detail in *Chapter 9*.


    We’ll use these nodes in examples throughout the book. But while we’ve used Decision
    Tables, there are still some types of Decision nodes we haven’t explored – let’s
    take a look at them now.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# # Other types of Decision Nodes


    We’ve already created two types of decision nodes – the Decision Table that we
    used earlier in this chapter and the literal expression we used to generate our
    greeting in *Chapter 3*.


    But when we were creating our decision node, we had to choose from one of seven
    types. We’ll work through them in the following list. In some ways, the name decision
    node can be misleading; often, we will use these types as *data preparation* nodes
    to feed into a Decision table:


    +   - **Literal Expressions:** These are simple FEEL expressions, broadly similar
    to a formula you’d enter in Excel. They return a single value.

    +   - **Decision Tables:** We have covered these in this chapter. They allow us
    to group rules in a `when ... then` format.

    +   - **Functions:** This allows us to define reusable logic. We could write a
    function that takes the parameters of a chocolate bar’s weight and the percentage
    of chocolate, then returns the actual grams of chocolate the bar contains. We’ll
    work through a function example shortly.

    +   - **Invocations:** These are another way of calling external decision models.
    They overlap with functions but are more useful when working with logic outside
    of our current Decision Model.

    +   - **Contexts:** These make our decision models simpler. Instead of having
    lots of individual Literal Expressions, contexts allow us to group them in one
    place. They also give us options to execute these expressions in order.


    Finally, we have two decision node types that return structured data:


    +   - **Lists:** These return a simple collection of values. These can be specific
    values that don’t change, or we can use a FEEL expression to calculate the values
    within the list. *Figure 4.16* shows our country list, modeled as a List node.
    The editor will only allow us to enter one column of values:


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_113_0.png)


    Figure 4.16 – A List Decision Node showing country codes'
  merge: -1
  img_proc: true
- pgno: 114
  md: '+   - **Relations**: These are similar to lists but can group multiple values
    together, as shown in Figure 4.17. Each row in this relation contains useful information
    about our product. And each column is effectively a list, which is useful if we
    want to access a list of all our products:


    # Product Info (Relation)


    | # | Product (string) | Weight in Grams (number) | Vegan Suitable (boolean) |

    | --- | --- | --- | --- |

    | 1 | "Peanut Crunch" | 75 | true |

    | 2 | "Caramel Biscuit" | 125 | false |


    Figure 4.17 – Relation Decision Node showing product information


    # Relations are not Decision Tables


    Because of the table format, relations look very similar to Decision Tables. Despite
    their appearance, they work very differently. Relations return all of the information
    they contain. Decision Tables match the best line(s) and return only that information.


    Relations are great for defining information once and reusing it across many decision
    models. In practice, this table of product information would be pulled from an
    external system source using an invocation. For now, modeling the information
    as a relation in one place works well. It also makes it easier to change later
    as our system evolves.


    # Play around with the nodes


    Most of the nodes we presented in this section are quite easy to understand once
    you start using them. We encourage you to play around with them in the KIE Decision
    editor and see the outputs using the Runner. For example, Figure 4.18 shows the
    output of our Product Info relation node when we run it:'
  merge: -1
  img_proc: true
- pgno: 115
  md: '![](img/48815d6f06dc8c7aeaa3963d289fb1e7_115_0.png)


    Figure 4.18 – Output from a Relation Decision Node showing product information


    We’ll use some of these expressions and nodes in our examples to help you understand
    them better. Since all the nodes are part of the **Object Model Group (OMG)**
    Decision Model Standard, there is a lot of information and examples about each
    of them online. A good place to start is the learn DMN site (which is part of
    KIE): https://learn-dmn-in-15-minutes.com/learn/decision-logic. There is more
    detailed information on the Drools site (also part of KIE) at https://www.drools.org/learn/dmn.html.


    # Adding nodes to support our Decision Table


    Our previous decision table example was simple: one data input node and a table
    generating an output. Since the power of Decision models comes from combining
    many nodes together, let’s start building an example that links many nodes.


    This example will allow us to recommend different chocolate bars depending on
    which day of the week the customer was born on. This comes from a real-life example
    and is probably no crazier than some of the business rules that you have been,
    or will be, asked to model.'
  merge: -1
  img_proc: true
- pgno: 116
