- pgno: 319
  md: '# 12


    # What Next? A Look inside Neural Networks, Enterprise Projects, Advanced Rules,
    and the Rule Engine


    Since this is the final chapter of the book, we’re going to use it to extend some
    tools and concepts we met in the first 11 chapters. We also want to answer the
    question *what’s next?*, so we’ll focus on areas that you can explore after you
    finish this book. We’ll cover these areas in the following order:


    +   - We will start by evolving the notebook we used in the previous chapter,
    demonstrating **decision trees** as another classification algorithm.

    +   - Decision trees give us more **explainability**. We will explore this in
    more detail and show how they can be converted into the business rules and decision
    tables we first met in *Chapter 4*.

    +   - **Neural networks** are among the most complex classifiers that you’re likely
    to encounter. We will give you a high-level introduction via Excel, then show
    how you can generate them in Python.

    +   - Neural networks are powerful but not very transparent in how they generate
    results. We will introduce **Trusty AI** as part of the KIE toolset to explain
    decisions.

    +   - Another key feature of KIE is its ability to execute **combined ML and AI
    models**. We will show you how to execute them using the sample models that come
    with KIE.

    +   - KIE’s samples are comprehensive, but some readers may want an alternative
    method. We suggest using the tools we met in *Chapter 8*, combining **ML and rules
    models in a Power Automate flow**.

    +   - Another type of **enterprise solution** is based on Java. We will introduce
    Red Piranha as a template to build on, leveraging its ability to read entire Excel
    spreadsheets.

    +   - Red Piranha can also execute rules in the more **advanced DRL rule format**.
    We will look at this format and find that (under the covers) we’ve been using
    rules all along.'
  merge: -1
