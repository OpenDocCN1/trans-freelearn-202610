- pgno: 83
  md: '+   - A rules engine such as Drools is not the only way of executing a Decision
    Model. It is pretty effective, and the one we focus on in this book.

    +   - Some of the expressions available in FEEL used by Decision Models can be
    executed but not optimized by the business rule engine. In practice, you value
    this flexibility and will only be concerned if your FEEL expressions become too
    complicated to understand. At that point, you could rewrite your expression into
    a Decision Table format (which are business rules). We will cover Decision Tables
    in *Chapter 4*.

    +   - In Decision Models, the focus is on the decision to be made, and only then
    on how we make that decision. In our previous example, you created the Decision
    node first (*respond to greeting*) and only then created the rules on how to make
    that decision (*answer Hello + name*). It is possible to use KIE/Drools to create
    business rules without any graphical Decision nodes. The business rule engine
    then has complete freedom to decide when to fire – a more powerful approach for
    some applications where there are hundreds of thousands of business rules.


    In practice, Decision Models are so simple to understand and the graphical editor
    is so powerful that they make an excellent entry point into the world of business
    rules. Just keep the subtle difference in mind as you explore further outside
    of this book.


    # A tour of the UI


    Our Hello World example is a great start, but obviously, Decision Models and rules
    can do so much more. Let’s expand our Hello World example a bit more and explore
    KIE Sandbox along the way.


    To start, you may have noticed a blue box marked **Problems** at the bottom right
    of the KIE Sandbox decision model screen, as shown in *Figure 3.18*:


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_83_0.png)


    This screen shows when you click on the **Problems** button. But what do these
    messages mean? What is a variable, and how can it be missing a type reference?
    Let’s explain what variables and types are.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# What is a variable?


    You have almost certainly typed a formula into Excel to add two cells together
    – something such as = A1+B1. In this case, you’re telling Excel to go to the box
    (cell) named A1, take the value found there, and add it to the value that Excel
    finds in box (cell) B1. If the values in the boxes (cells) change, the result
    returned by the formula changes. Think of A1 and B1 as variables.


    If you have used Named Ranges in Excel, you’re a step closer to how Decision Models,
    KIE/Drools, and most other modern computer languages use variables. Your variables
    can be called whatever you like – in this case, the person’s name.


    The Input nodes in our decision diagrams are a type of variable, but there are
    other ways of creating them, as we’ll see in the next chapter.


    # What is a type?


    In general, Excel manages data types pretty well for you. Most of the time, you
    don’t need to think about it – you can put any value (number, text, or Boolean
    such as true and false) into a cell and Excel will do its best to work with it.
    The FEEL language used by KIE allows something similar – it’s called an Any data
    type.


    Sometimes in Excel, it is better to specify the type of variable (or cell) we
    use – for example, to tell Excel that it is a date and not a number that we are
    dealing with.


    KIE is similar. While you can use the Any data type, it is much better to specify
    the data type you are using. This helps KIE reduce hard-to-find errors in our
    business rules. As well as the many data types that we may be familiar with from
    Excel, KIE has a lot more powerful data types, which we’ll explore further in
    Chapter 4.


    Thankfully, these errors are only warnings and do not halt the decision model
    from producing a result. These error messages are a nudge for you to do the right
    thing. Let’s keep KIE happy and specify the data types in our example.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# How to fix these errors


    Go to our Decision Model and select the name input node, as shown on the left-hand
    side of *Figure 3.19*:


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_85_0.png)


    Figure 3.19 — Changing the name data type to string


    In this figure, we’ve already clicked on the *Properties* icon at the top right
    of the screen to bring up the **Properties** panel on the right-hand side.


    We then set Data type to **string** (bottom right of the figure). *String* is
    just another name for a piece of text.


    As soon as we make this change, one of the errors should disappear from the **Error**
    panel, since we told KIE to expect this node to supply strings as an input type.


    It’s a similar process for the *greeting* node (right-click the node, edit properties,
    and set Data type to **string**). The second warning error should be cleared since
    we told KIE that this decision node takes text as its input type.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# Giving our Decision Model a name


    Up to now, our Decision model has been called **Untitled**, but we can do better.
    Double-click on the name **Untitled** at the top left of the screen, which gives
    you the option to rename it `Hello World`, like in *Figure 3.20*:


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_86_0.png)


    Figure 3.20 – Changing the name of our DMN Model


    If you want to export a copy, click on the **Share** button at the top right of
    the screen, as we saw in *Figure 3.3*. As shown in *Figure 3.21*, this will allow
    you to download a copy of the current diagram as a DMN file:


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_86_1.png)


    Figure 3.21 – Downloading the DMN diagram


    If you want, you can open the downloaded file in Notepad or a similar editor (the
    layout used is XML). The format of the file is part of the OMG specification for
    Decision Models, meaning that you should be able to execute this DMN file in a
    tool from another vendor. Behind the scenes, the XML format enables the advanced
    code editing and collaboration techniques we will cover in *Chapter 5*.'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'But in practice, you’ll work mainly with the graphical editor, and the main
    use of this download function is that it makes it easier to share Decision Models
    with colleagues.


    # Previous autosaved decision models


    You notice that we talked about *exporting* and not *saving* the Decision Model.
    This is because KIE autosaves the DMN Model in browser storage, which is a standard
    feature of most modern web browsers. This means that even if we close the browser
    and reopen it, it will not disappear.


    Let’s try this – close and reopen the browser at https://sandbox.kie.org/#/. If
    you look toward the bottom of the main KIE home page, you will see something like
    Figure 3.22:


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_87_0.png)


    Figure 3.22 – Recent models


    As you create and edit more Decision Models, the list of recent models will grow.
    While browser storage is pretty robust, it’s unique to each browser. If you use
    Chrome and Edge on your laptop, each will have its own Recent models list. While
    this is good enough for us now, we’ll see a more sharable, more robust model storage
    mechanism in Chapter 5.


    # Uploading Decision Models from other sources


    Before we leave the KIE Sandbox home page, it’s worth highlighting a feature that
    we skipped over earlier. On the right-hand side of the screen, there are options
    as shown in Figure 3.23:


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_87_1.png)


    Figure 3.23 – Importing and uploading DMN Models on the KIE Sandbox home page'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'These options allow you to import a previously created Decision Model from
    a URL (web address) or upload a file already on your computer. As we move through
    the rest of the examples in this book, we’ll typically provide a file with the
    completed result to make it easier to follow along. This screen will allow you
    to easily import these sample files to your local KIE sandbox.


    Let’s continue to build on the example we just created.


    # An improved Decision Model for greetings


    Now that we know we can import samples, we can move a little bit faster in the
    next couple of pages. We’ll still work through the sample instructions step by
    step, and we’ll probably learn more by doing this, but we have the safety net
    of importing the final decision model in case there is any step that is not completely
    clear.


    Our Hello World Decision Model is good, but we know we can do more with it. Let’s
    try something a little bit more sophisticated. We’ll give you two options on how
    to follow along with this sample.


    # Option 1 – importing the sample


    While I hope you follow the step-by-step instructions that we list in the other
    options, here is the shortcut to import the sample decision model:


    +   1. Go to the GitHub book samples page at https://github.com/PacktPublishing/AI-and-Business-Rules-for-Excel-Power-Users
    and download the 03_sample_02_Good Morning.dmn model to your laptop.

    +   2. To download it, click on the filename in GitHub; a web page will open showing
    the file. Click on the raw button on this page to see only the file contents,
    no formatting.

    +   3. Right-click on the raw contents in the browser and select Save page as....
    When choosing a filename, check that you have all files rather than txt selected,
    since this will cause problems with the filename later.

    +   4. Open Windows explorer, making sure that view... file extensions is checked
    in the menu. Go to where you saved the file, and double-check that the file didn’t
    get .txt added to the end.

    +   5. Open the KIE Sandbox home page like in Figure 3.23. Click on Select files
    and choose the decision model you have just downloaded.

    +   6. Click ok to import the model – you should see a decision model like in
    Figure 3.24.


    It’s still worth reading the step-by-step instructions to understand how we built
    this decision model.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# Option 2 – step-by-step instructions


    Our step-by-step instructions start with the Hello World Decision Model that we
    last saw in Figure 3.20. We’re going to make the following changes to it, to give
    us a Decision Model like in Figure 3.24:


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_89_0.png)


    Figure 3.24 – Adding a second data node


    To do this, follow these steps:


    +   1. Double-click on the Decision Model name, and rename it to Good Morning.

    +   2. Add a new Data node to the diagram (drag and drop from the menu on the
    left).

    +   3. Double-click on this Data node and rename it AM.

    +   4. Select the AM Data node, click on the Arrow node that appears, then drag
    the arrow to connect it to the greeting decision node. Be careful of the arrow
    direction – it should go from the AM node to the greeting node.

    +   5. Select the AM Data node, and then click on the Properties icon (top right
    of the screen), to show the Properties editor panel.

    +   6. Using the Properties editor, change Data type for the AM Data node to boolean.'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# Boolean data types


    You’ve probably used Boolean data types in Excel – they are either True or False.
    Like in Excel, there is a third Boolean type of empty, where no value has been
    supplied.


    Sometimes, the impact of an empty value shows up as a Required Dependency ...
    not found message, which disappears when we pass in a value. Keep this in mind
    as we run the sample.


    Now that we are supplying additional information to our decision node, we want
    to update our decision to take advantage of it. To do this, follow these steps:


    +   1. Select the greeting Decision node in our Decision Model.


    +   2. Click on the Edit button that appears on the middle left as a context menu.


    +   3. Using the boxed editor, update the expression to if AM then "Good Morning
    "+name else "Good Afternoon "+name.


    +   4. The result should look like Figure 3.25 – note that the editor has captured
    the text, but won’t show all of it on screen unless we drag the right-hand side
    of the boxed editor to expand it:


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_90_0.png)


    Figure 3.25 – Updating the decision expression


    +   5. Click on the Problems tab at the bottom left of the screen to see whether
    KIE has highlighted any issues. A major source of errors is getting the characters
    for the quotes around the text wrong – it’s the same double-quote character you
    use in Excel.


    No doubt you’re keen to try out these changes. Like a previous example, click
    on the Run … as Form menu at the top right of the screen and enter some values
    like in Figure 3.26:


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_90_1.png)


    Figure 3.26 – Updated input/output form'
  merge: -1
  img_proc: true
- pgno: 91
  md: "On the **Inputs** side, you’ll see that our two inputs are automatically listed\
    \ – a textbox for entering a name and a checkbox for our Boolean **AM** value.\
    \ Like before, when we update the values, the decision model evaluates them and\
    \ outputs a value – in this case, a time-appropriate greeting.\n\nIn our Decision\
    \ node, the expression box used a FEEL expression (**If** ... **Else**) to decide\
    \ whether to say **Good Morning** or **Good Afternoon** based on whether the **AM**\
    \ box is checked or not.\n\n> **What is greeting (null)?**\n> You may have noticed\
    \ that before you input any values into the form, there may be a message in the\
    \ output, something such as **greeting (null)**.\n> \n> This is because of the\
    \ empty value in our Boolean – because we pass in an empty value, KIE doesn’t\
    \ have enough information to make a decision. Rather than KIE hiding this issue,\
    \ it tells us by passing back the null message.\n\nThis is still a relatively\
    \ simple example – we’re only scratching the surface of the FEEL expression language.\
    \ We haven’t get begun to chain multiple decision nodes to make more complicated\
    \ decisions. And we haven’t yet introduced decision tables that split our business\
    \ decisions into very simple **when ... then** rules. But you can already begin\
    \ to see the power of taking something normally crammed into a hard-to-read Excel\
    \ expression and editing it as a much clearer Decision Model.\n\nWe’ll cover all\
    \ of those items in the next chapter. But before we got onto more powerful tools,\
    \ it’s worth completing our tour of KIE Sandbox, as there are several other features\
    \ that we will find useful.\n\n# Other UI elements in KIE Sandbox\n\nOn the Decision\
    \ Model page of KIE Sandbox, if we click on the *Decision Navigator* icon (the\
    \ flag-like icon at the top right), KIE will show **Decision Navigator**, like\
    \ in Figure 3.27:\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_91_0.png)\n\nFigure\
    \ 3.27 – Decision Navigator view"
  merge: -1
  img_proc: true
- pgno: 92
  md: 'The **Decision Navigator** view is another layout to represent the same Decision
    Model – this time, as a tree-like structure. All the nodes are the same, but it
    is easier to see the content of the nodes (for example, when we use a literal
    expression to make our decision). Clicking on the elements in **Decision Navigator**
    will jump to the relevant part of the diagram.


    Also on the right-hand side of the screen is **Explore diagram**. The icon looks
    like an eye, as highlighted in Figure 3.28:


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_92_0.png)


    Figure 3.28 – Explore diagram


    **Explore diagram** is really useful for exploring larger decision models – which
    is why Figure 3.28 shows the more complicated sample Decision Model that comes
    with KIE. While you can’t read the text on the individual nodes, it allows you
    to zoom out and see the bigger picture.


    Returning to the Decision Model editor, just underneath our model name, you’ll
    see four tabs, as shown in Figure 3.29:


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_92_1.png)


    Figure 3.29 – Documentation tab'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'Let’s look at the tabs:


    +   - **Editor** is the visual decision model editor that we’ve been working with
    throughout this chapter.

    +   - **Documentation** summarizes our decision model into an easy-to-export format
    (such as PDF). We can share these PDF docs with the wider team and check for agreement
    on business decisions.

    +   - **Data Types** allows us to build more complex data types, which we will
    explore in the next chapter. We touched on these in our examples.

    +   - **Included Models** allows us to include other decision models that we can
    use to build our business decision. We don’t need to cram our decisions into one
    Decision Model.


    Finally, the down arrow beside our model name at the top is a shortcut that allows
    us to quickly navigate between other Decision Models we have created.


    # Note – KIE Sandbox is only a sandbox


    To be more precise, KIE Sandbox Extended Services is only a development tool.
    It’s easy to be impressed by the fluid nature of editing decision models, and
    you should be! The KIE Sandbox editor is one of the best, most robust, implementations
    of the OMG Decision Model standard and shows the time and effort that the IBM
    and Red Hat teams have put into it.


    However, please remember the runtime (KIE Sandbox Extended Services) is only a
    convenience to help you evaluate your decision models as you build them. It can
    only run on your local machine, accessible only to you, so it’s not suitable for
    deploying as a stable solution. In *Chapters 5 and 10*, we will show you how to
    run your business rules in a truly robust, scalable, enterprise solution.


    # Summary


    We achieved a lot in this chapter – we went from talking about business rules
    as an abstract concept, to executing business rules using hands-on tools such
    as KIE Sandbox.


    Along the way, we saw how Decision Models are another way to represent our business
    rules, and their highly visual format meant that we could quickly build two samples.
    We downloaded and ran KIE Sandbox Extended Services to evaluate our Decision Model
    and saw some of the different data types on which we can base our decisions.


    We took a tour of the UI to understand how we can import and export decision models,
    and where to access previous models that KIE has autosaved for us. We also saw
    some of the other views of Decision Models, which are especially useful when sharing
    them with colleagues for validation.


    However, there were several key points in the chapter where we understood Decision
    Models, rule engines, and the FEEL expression language are much more powerful
    than we’ve previously explored. Let’s stay within KIE Sandbox for our next chapter
    and do a deep-dive to explore the power these tools give you.'
