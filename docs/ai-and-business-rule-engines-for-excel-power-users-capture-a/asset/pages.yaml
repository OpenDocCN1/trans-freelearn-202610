- pgno: 4
  md: '# Foreword


    With the explosion of interest in **Artificial Intelligence (AI)** in recent years,
    I am more convinced than ever that the rules-based approach to AI alongside machine
    learning is the most accessible route for Excel users. That’s based on my own,
    and my team’s, work with business users like you, looking to capture business
    knowledge and rules in a way that can be easily shared and executed. Right now,
    the community is especially excited about the next generation of tools, making
    it easier than ever to deploy decision and machine learning models together.


    It has been about 15 years since my first code contribution was accepted by the
    Drools project team – a brand new parser for the **Drools Rule Language (DRL)**
    that landed just in time for Drools 5. Since then, I have had the privilege to
    learn and work with the most brilliant engineers in the industry and the opportunity
    to collaborate with an amazing open source community.


    Drools was already a widely used and mature open source rule engine. The community
    was about to release Guvnor, a set of integrated tools to support users managing
    their business rules, life cycles, from authoring to packaging to deployment.


    But so much more has happened since. The Drools engine not only evolved but also
    helped advance the whole field of rule engines and expert systems with the introduction
    of the PHREAK algorithm. Drools was also one of the first to introduce a unified
    programming model for business rules and workflow working side by side, sharing
    the same concepts and APIs.


    Outside the runtime engines, the tools also dramatically expanded. Guvnor evolved
    and became Business Central, a full **Business Rules Management System (BRMS)**.
    Business Central had the ambitious goal to provide a user-friendly interface where
    developers and business practitioners could collaborate; progress was made, laying
    a solid foundation for future improvement.


    In parallel with all these advances, the community itself evolved – from the single
    Drools project to a family of leading open source projects that play a role in
    delivering solutions around business automation and artificial intelligence named
    KIE (Knowledge Is Everything, pronounced the same way as the word key (/kē/) in
    English).


    One turning point in the business rules and BRMS landscape was the introduction
    of the **Decision Model and Notation (DMN)** specification by the OMG (**Object
    Management Group**). This powerful spec defines a graphical notation for decision
    models and a set of semantics for decision modeling and runtime execution.


    Today, DMN is already widely recognized as a leading standard for decision modeling
    and is used by organizations around the world to manage their decision-making
    processes. Moreover, the decision management discipline associated with AI has
    become more popular than ever, driven by the power of the DMN standard. Another
    advantage of the DMN is that it’s vendor-neutral, and it’s possible to find a
    variety of training material, books, methodologies, and other content from practitioners
    not limited to any specific vendor.'
  merge: -1
  img_proc: true
- pgno: 5
  md: 'Drools introduced official runtime support for DMN a couple of years after
    the first release of the spec. Since then, the team has joined the OMG to help
    shape the spec’s future and shift all high-level representation of business rules
    and decisions investments to it. With this strategy in place, and as the DMN spec
    increased in popularity, the KIE community was ready to start a new cycle of innovation…


    Kogito began as an initiative, which later also became a project. All KIE technologies
    were containerized at this point, and all investments had cloud-first in mind.
    However, the team felt the need to go one step further: we needed a new initiative
    to rethink business automation in a cloud-native fashion.


    A new set of tools also emerged from this initiative. First, the **Business Process
    Model and Notation (BPMN)** and DMN editors were extracted from Business Central
    and made available as extensions for VS Code. And the team didn’t stop there –
    we were motivated to make the KIE technology more accessible, and that’s when
    we introduced dmn .new, incorporating a runner that creates a dynamic data-input
    modeling experience inspired by spreadsheets.


    And this is where Paul’s new book comes in handy: Paul is a long-time community
    member with a talent for decoding the universe of business rules, decision management,
    and AI for practitioners and advanced Excel users using accessible language. With
    the content of this book, you’ll add new powerful tools to your tool belt.


    Very few technologies survive and can claim relevance for an extended period without
    a continuous track record of innovations. This community owes much of its success
    to its ability to foster a warm and welcoming environment. Mark Proctor, a long-time
    friend and mentor, has played an integral role in leading the community.


    The KIE community has been fortunate to attract, build, and retain many other
    talented individuals, starting with Edson Tirelli and Kris Verlaenen, who laid
    the foundation for its success—followed closely by Mario Fusco, Maciej Swiderski,
    and I, who have continued to expand and bring new ideas and perspectives. And
    now we have the rise of a new bright generation that includes names such as Eder
    Ignatowicz, Tiago Bento, Matteo Mortari, Daniele Zonca, Enrique Gonzales, Tibor
    Zimányi, and Ricardo Zanini, who represent the future of the community and are
    poised to help it continue to thrive for years to come.


    And just now, the KIE community is starting a new exciting chapter with IBM joining
    Red Hat in the stewardship of the community. I’m personally excited to share this
    part of the new chapter. KIE is in the process of moving to a new home: the Apache
    Software Foundation. At Apache IBM, Red Hat and the wider community (including
    you) will have the opportunity to expand the boundaries of business automation
    and AI even more, together!


    Alex Porcelli


    Chief Architect for IBM Process Automation and Decision Manager Open Edition


    IBM Business Automation'
