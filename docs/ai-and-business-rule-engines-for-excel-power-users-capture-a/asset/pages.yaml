    # Neural networks in machine learning


    This is not a book about neural networks. But since the tools we’ve introduced
    (KIE and Python notebooks) also allow you to work more effectively with neural
    networks, it’s worth having a simple introduction to them.


    To see the problem neural networks can help solve, imagine we took our sales graph
    (*Figure 11.4 from Chapter 11*) and added the sales data for our chocolate crunch
    bars. We might end up with a graph such as Figure 12.3:


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_324_0.png)


    Figure 12.3 – More complicated sales data


    This graph is more difficult to describe – while we’ve highlighted our Chocolate
    Crunch sales with red circles, the group in the top right is mixed in with Silk
    Tray orders. There is no single sentence we can use to describe the pattern and
    there is no extra feature (or dimension) that we can use to clarify this situation.
    It is for processing complex patterns like this that neural networks work best.'
  merge: -1
  img_proc: true
- pgno: 325
  md: "> **Reality check – don’t give up on simple classifiers too easily**\n> \n\
    > To clarify that last statement, since we need to keep our examples simple, for\
    \ this dataset simple classifiers such as **support vector machines** or **k-nearest\
    \ neighbors** would probably still give you good enough results. I encourage you\
    \ to try these classifiers first on your own data.\n> \n> However, at some stage,\
    \ you’re going to encounter a dataset that is too complicated for these algorithms,\
    \ which is where the power of neural networks is useful.\n\n# A neural network\
    \ implemented in Excel\n\nNeural networks are a big deal, and you’ve almost certainly\
    \ heard of them already. You may be surprised that we can implement one in Excel,\
    \ as shown in *Figure 12.4*. The actual Excel file is available on the book’s\
    \ GitHub site as `12_Neural_Network.xlsx`:\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_325_0.png)\n\
    \nYou should be able to easily understand the concept as you can work through\
    \ it in Excel:\n\n+   - Normally, all we care about are the **inputs** at the\
    \ top of sheet in green (**Customer Age** and **Country Code**) and the recommendation\
    \ **output** at the end of the sheet (also in green). The output is the percentage\
    \ chance that our customer will buy a Peanut Crunch bar.\n+   - To calculate our\
    \ output, we pass the inputs through three neurons each with the same pattern.\
    \ We have different weightings that we can set within each neuron (the light gray\
    \ box).\n+   - Those weighting values allow us to modify how much importance we\
    \ put on each input, which we use to calculate our **Inputs after weighting**\
    \ field."
  merge: -1
  img_proc: true
- pgno: 326
  md: '+   - We then have our **Activation Threshold**. In this example, the activation
    function is all or nothing. If the input after weighting is higher than the threshold,
    we pass it on. If not, we pass on zero. Other (more subtle and complicated) activation
    functions could be used.

    +   - Our **Output Layer** applies a weighting to the values coming out of the
    neuron in the previous layer. This weighting (in gray) can also be adjusted.

    +   - Finally, our **Result** is the sum of the three neurons in the output layer.
    This output represents the percentage chance that this customer will buy a Peanut
    Crunch bar.


    This type of network is a **feedforward perceptron**. Despite the impressive name,
    we can see from the Excel file that it’s just a bunch of simple calculations.
    And in the sheet, there are values we can tweak to build toward the result that
    we want. So, what makes such a network effective? It’s due to how we train the
    network. We’ll explain how training works in the next section.


    # Training our neural network – can you do better?


    If you’ve downloaded and tried out the Excel file, you’ll see that our model is
    pretty effective at predicting Peanut Crunch bar sales to US customers. But it’s
    not so good at recommending products for customers based in South Africa. For
    country codes around 400, it generates nonsensical values such as a 357% probability
    the customer will make a purchase.


    If you were given the challenge of tweaking the inputs in gray to help these customers
    *without changing the networks structure*, what would you do?


    +   1. You’d gather a set of training data (South African region codes across
    all ranges) in most cases saying we should predict a low chance of buying a Peanut
    Crunch bar.

    +   2. With this end goal in mind, you’d tweak the sheet values (in gray) to produce
    a result closer to what we want (**backpropagation**).

    +   3. You would test the changes with a range of values (from both US and South
    African values) and see how far the entire model is away from the ideal result.

    +   4. If our changes were an improvement, we continue making changes in the same
    direction (**gradient descent**); otherwise, we discard the last lot of changes
    and try another direction.

    +   5. We repeat this training for a set number of iterations, or until we’re
    no longer getting any noticeable improvement in our model’s results.


    If you’ve followed those instructions to tweak the spreadsheet, congratulations;
    you’ve trained your first neural network. If you held off the exercise because
    it was too tedious, or you guessed that the machine could do the work for us –
    also congratulations. You’ve already seen most of the tools that you will need.'
  merge: -1
  img_proc: true
