- pgno: 151
  md: '# Calling Business Rules from Excel Using Power Query


    In the previous chapter, we looked at how we could collaborate to share and edit
    our decision models. We also saw how to deploy them onto the OpenShift cloud so
    that other people could run them through an automatically generated web interface.


    That was very impressive, but our colleagues are still likely to be doing most
    of their work using Microsoft Excel. How can we link our business rules, AI, and
    decision models to Excel and make all the tools work together? That’s what this
    chapter covers, including the following:


    +   - Five different ways to link rules, AI, decision models, and Excel – using
    Power Query, Visual Basic for Applications, Script Lab, Office Scripts, and Power
    Automate

    +   - Machine-readable web pages using REST and how to link these to our decision
    service

    +   - Swagger – a more human-friendly link to KIE and Kogito decision services

    +   - Calling the decision service using Power Query with step-by-step examples
    to build a solution that you can expand on for your own work


    By the end of the chapter, you will have learned how Kogito publishes a machine-readable
    web page, and how we can use Power Query in Excel to link to it.


    # Prerequisites


    Before you start, it is best to have Microsoft Excel installed on your laptop.
    While the free online version (https://www.microsoft.com/en-us/microsoft-365/free-office-online-for-the-web)
    is getting more and more powerful, some techniques in this chapter (for example,
    using Power Query) will only fully work in the desktop version.'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'Fortunately, the Script Lab approach we will describe in the next chapter will
    work with the online version of Excel. And we will introduce other alternatives
    (such as Office Scripts and Power Automate) that work outside of Excel – and are
    compatible with other tools (such as Google Sheets and OpenOffice) that can read
    and write Excel format files.


    Since we will cover so many approaches to linking Excel to our business rules,
    let’s start with an overview of what they are.


    # Five different ways to link rules, AI, decision models, and Excel


    At the end of Chapter 5, we saw that KIE and Kogito autogenerate a web page based
    on our decision model. We’ll soon see that there is a machine-readable version
    of this page that we can link to Excel. That page won’t change no matter what
    technique we use. Figure 6.1 shows some of the ways we can make this link.


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_152_0.png)


    Figure 6.1 – Many different ways of linking Excel to our decision service


    You may be familiar with some of the techniques listed in this diagram – even
    if you’re not, we’ll run through them in the next section. The key point is that
    no matter which technique you choose, the core Kogito decision service (including
    your business rules and AI) stays the same. That allows you to choose the technique
    that works best for you now, knowing that your investment in decision models is
    still valid even as you evolve toward other tools.'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'It is highly likely that later in your journey with business rules, you will
    see colleagues calling them using full enterprise coding languages such as Python,
    Java, or C#. While this is outside the scope of this book, it does reassure you
    that Kogito gives you tools to capture, run, and share your business rules in
    a way that will still be valid in the future.


    First, let''s introduce the five techniques we will use to link Excel to our decision
    service as mentioned in Figure 6.1. It''s worth mentioning that all five techniques
    are industry-standard with a lot of books and web articles available for each
    of them. And whichever you choose, they are a good investment of your time. You
    will use these tools in a lot of other Excel work – not just linking to decision
    services.


    # VBA


    VBA was game-changing for Excel power users when it was introduced almost 30 years
    ago. It allows Excel users to record their actions, edit the generated script,
    and then play it back in an almost enterprise-level programming tool.


    While VBA has a huge install base, it is showing its age. If you''re using VBA,
    it''s because you have a legacy spreadsheet, or you''ve been working with it for
    a long while. Don''t worry – we haven''t forgotten about you. We cover how to
    link Excel to decision services in the next chapter.


    # Script Lab and Office Scripts


    If you are starting to automate Excel Spreadsheets today, we''d recommend using
    a more modern alternative from Microsoft – Script Lab or Office Scripts. Both
    are based on the same concept of manipulating Excel using code, and Office Scripts
    have a similar recorder to VBA, which allows you to capture actions and then edit
    the autogenerated script. The difference is that both Script Lab and Office Scripts
    integrate more easily with modern web technologies than VBA – for example, they
    use a version of JavaScript that you might already have played with when building
    web pages.


    There is a large degree of crossover between Script Lab and Office Scripts – both
    use the same JavaScript object model to manipulate Excel. Learning one automatically
    gives you a head start with the other. This is especially important as Office
    Scripts are newer, and it is expected that Microsoft will continue to build out
    its capabilities.


    Currently, Script Lab is better if you want to focus on the user of your spreadsheets.
    It allows you a choice of user interface elements and will run on both the web
    and desktop. It also allows you to build custom functions that you can call from
    within your spreadsheet in a format similar to =myCustomFunction (A1).


    Office Scripts are the better choice for running within Office 365 in the cloud
    (currently, they can be run but not edited from the desktop version of Excel).
    They are better for automated flows where a user does not need to be present since
    they can be called from Power Automate. While slightly less powerful (they don''t
    have as many user interface options), they are slightly easier to learn and do
    have the script recorder, which is a great help in getting started.'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'In real life, you’re likely to switch back and forth between Script Lab and
    Office Scripts depending on what you’re trying to achieve. We will cover Script
    Lab in the next chapter, then expand on it using Office Scripts as part of Power
    Automate flows in *Chapter 8*.


    # Microsoft Power Automate


    Remember back in *Chapter 3* when we said decision models aren’t workflows, since
    they execute all at once? Power Automate *is* workflow-based and allows you to
    get the computer to do a lot of the repetitive manual steps you may need to do
    in dealing with Excel and other Microsoft Office documents. Typically, a Power
    Automate flow will span several different systems, one of which could be calling
    our decision services for a key business decision, before maybe updating an Excel
    spreadsheet with the result. We’ll go into more detail on this approach in *Chapter
    8*.


    # Power Query


    Our final technique is the simplest. Power Query allows you to bring a wide range
    of data sources into Excel, manipulating it in a way that is repeatable and that
    allows you to refresh the data later from the original data source. It’s a very
    powerful element of a data analyst''s toolkit and one that is well worth learning
    about in its own right.


    Our interest in Power Query is that one of the many data sources it can pull data
    from is JSON, using a REST API. That is exactly the machine-readable format that
    Kogito generates from our decision service. Since all our techniques link into
    the same REST and JSON format, it’s worth looking at what we’re working with in
    more detail.


    # Machine-readable web pages using REST


    We’ve been talking about machine-readable web pages using REST and JSON as a common
    language.


    **REST** stands for **Representational State Transfer**, which is another way
    of describing machine-readable web pages. Let’s take a look at what that looks
    like with a simple example, before exploring the Kogito REST API in more detail.


    # A simple REST example


    REST uses a lot of the same infrastructure as browsing the web – so you can open
    a REST URL such as `https://api.github.com/repos/OfficeDev/office-js` using a
    web browser, like in *Figure 6.2*. This screenshot was taken using Firefox, as
    it colors the JSON for us, but Edge and Chrome will give you similar results.
    Note that a lot more information will be returned – we’ve edited the image for
    clarity.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '![](img/48815d6f06dc8c7aeaa3963d289fb1e7_155_0.png)


    Figure 6.2 – A simple REST call


    This REST call gives you information about a project hosted on GitHub. From the
    URL, you can guess that it contains information about a repo (project), and that
    project is the Office JavaScript example from the Microsoft team. Looking at the
    information returned, at the very bottom, we can see the “subscribers count” –
    the number of people following the project.


    While the REST format is mostly used by machines, it’s not unfriendly to humans.
    We have already learned the following:


    +   - REST calls are made over the web using standard transport (the HTTP that
    you’re familiar with). In particular, this is a GET request, where all the information
    we want to pass in is contained in the URL.

    +   - REST URLs are structured to give a clue about the information that will
    be returned. From the JSON returned, we get pointers to other URLs (or endpoints)
    that might be of interest.

    +   - The call returns JSON, a format we first met in Chapter 4, which allows
    us to guess the meaning of a lot of information. In fact, it returns too much
    information, but we can ignore everything except the field that we were looking
    for (Subscriber count).'
  merge: -1
  img_proc: true
- pgno: 156
  md: '+   - If we refresh the page, we get almost the same result (unless somebody
    else has followed the project in the meantime). This gives us a clue that the
    REST call is *stateless* – the server takes our request, deals with it, then forgets
    about us. Our next request will be treated as a fresh new inquiry using the information
    we pass in at that time.


    Our simple sample uses the browser to make web requests. As you might guess from
    our screenshot, REST doesn’t really care who or what is calling it, as long as
    it is a valid request. In this case, *valid* means that the client making the
    call knows how to “speak” HTTP, that the client is calling the right URL, and
    that it passes in the information expected to that URL.


    # More on REST – GET and POST requests


    In our previous example, we talked to the server using a GET request – all the
    information was in the URL. GET is the best option for simple requests – for example,
    Google uses it for its search queries where you can copy and paste a URL such
    as `https://www.google.com/search?q=packt+books` into different browsers and get
    the same response every time.


    Our requests are likely to pass in more complex information, which is why will
    use the POST option. You’re likely to have used this option without realizing
    it, for example, when filling out a form on a web page and then hitting submit.
    If the web page URL doesn’t change or show your data, then the way the information
    gets transmitted behind the scenes is via a POST call. While they are easy to
    use (as we’ll see shortly), in POST calls, information is more hidden but more
    powerful.


    You’ve probably guessed that there is a lot more to REST than the just-what-we-need-to-know
    introduction we’ve covered here. A good source of information if you want to read
    more about it is `https://restfulapi.net/`.


    Our focus on learning REST is to communicate with our Kogito decision server.
    Let’s look at what that looks like in more detail, starting with Swagger – a tool
    that makes REST easier.


    # Swagger – a more human-friendly link to Kogito


    While REST is not unfriendly, Kogito helpfully uses a tool called Swagger to make
    REST pages even easier to understand.


    We’ll pick up where we left off in *Chapter 5* where we deployed our decision
    model to the OpenShift cloud (dev sandbox) and shared the web page for our colleagues
    to admire. It’s worth going back to that web page now – remember that it looks
    similar to *Figure 6.3*.'
  merge: -1
  img_proc: true
