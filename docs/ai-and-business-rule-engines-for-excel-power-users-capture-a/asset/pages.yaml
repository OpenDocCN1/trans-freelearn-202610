    > Either way, it’s great to know that Kogito supports a range of deployment options.\
    \ The information shared in this chapter will help you convince your colleagues\
    \ that KIE, Kogito, and Drools is a scalable stack for solving the business and\
    \ IT problems you face.\n\n# Prerequisites\n\nThe step-by-step instructions in\
    \ this chapter are simple. The only thing you need is a laptop powerful enough\
    \ to run Docker. Most modern laptops will meet this requirement. More info can\
    \ be found at https://docs.docker.com/desktop/install/windows-install/.\n\nIf\
    \ your laptop isn’t powerful enough, ask your colleagues whether there is another\
    \ computer on the network that can host the container. The entire point of Docker\
    \ is that it gives you multiple deployment options. Since Business Central is\
    \ web based, you will be able to access it remotely.\n\n# Comparing business central\
    \ and the KIE sandbox\n\nBusiness Central, as a web-based editor for your decision\
    \ models, sounds a lot like KIE Sandbox. And you’d be right – if you know your\
    \ way around KIE Sandbox, there is much in Business Central that will be familiar.\
    \ But it’s a bit like comparing a family car with the latest Formula 1 model.\
    \ Both are cars with four wheels and an engine, but one is much easier to drive\
    \ and better for a trip to the supermarket. The other offers a lot more performance\
    \ but needs the support of a team of mechanics to operate effectively. Some key\
    \ differences in the features are as follows:\n\n+   - KIE Sandbox is designed\
    \ to be easy to use, with no setup, making it ideal for a book like this one.\
    \ Business Central may be easy to start but still needs about 15–20 minutes of\
    \ preparation to set up before you can write your first business rule.\n+   -\
    \ Business Central has a lot more features than KIE Sandbox, which focuses on\
    \ the core functionality of decision modeling. The core decision model editor\
