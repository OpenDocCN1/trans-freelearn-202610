- pgno: 119
  md: '# A more sophisticated Decision Table


    We added a function node to calculate the day of the week our customer was born
    on. But we still haven''t used that day of the week to recommend a suitable product.
    Let''s update our previous example (downloadable as 04_Customer_Birth_Day.dmn)
    to make this happen:


    +   1. Open the Decision Model, right-click on the **Recommended product** decision
    node, and choose the edit icon.

    +   2. Add **Input Clauses** (pale blue) so that you have the three input columns,
    as shown in Figure 4.24. You can do this by right-clicking on an existing input
    column and choosing **Add right**.

    +   3. Double-click on each input clause to set where the data is coming from,
    as shown in Figure 4.24. `Customer.Country of Residence` and `Customer.Number`
    come directly from our data model. `DayCalc(Customer.Date of Birth)` calls the
    function (once) that we created and makes the result available to match against
    our rules.

    +   4. We''ve resized some columns and dragged and dropped them to re-order them
    – but this doesn''t change the rule''s functionality.

    +   5. In the main body of the table, enter the values as shown. Pay attention
    to the quote marks needed for text values.

    +   6. The - values denote where no match is attempted, and the annotations are
    just comments to explain what is going on but are otherwise ignored.


    RecommendedProduct (Decision Table)


    | F | Customer.Country of Residence (string) | DayCalc(Customer.Date of Birth)
    (string) | Customer.Number (number) | RecommendedProduct (string) | annotation-1
    |

    |---|----------------------------------------|------------------------------------------|--------------------------|-----------------------------|--------------|

    | 1 | - | - | <10000 | "Silk Tray" | Only first 10000 custom |

    | 2 | "SA" | - | - | "Lumpy Fruit and Nut Bar" | |

    | 3 | "UK" | "Friday" | - | "Crunch Bar" | |

    | 4 | "US", "UK" | - | - | "Peanut Candy" | |

    | 5 | - | - | - | "Milk Chocolate" | |


    Figure 4.24 – A more sophisticated decision table


    7. Open the **Run** panel to evaluate our model. As expected, **US** customers
    get recommended **Peanut Candy**. **UK** customers get recommended a **Crunch
    Bar** – but only if they were born on **Friday**. Otherwise, customers will receive
    the default suggestion of a **Milk Chocolate** bar. And any person who is in the
    first 10,000 customers gets recommended our special **Silk Tray** offer.'
  merge: -1
