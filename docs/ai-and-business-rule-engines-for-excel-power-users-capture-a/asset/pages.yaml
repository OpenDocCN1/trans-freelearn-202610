- pgno: 272
  md: '4. After Command Prompt has finished updating, take a look at the Docker Desktop
    Containers tab. It should show Business Central running in a container, as shown
    in Figure 10.7:


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_272_0.png)


    Figure 10.7 – Docker running our Business Central image


    5. The values in Figure 10.7 match what we specified in our startup command. docker
    run asked Docker to run a container using the latest image from quay.io/kiegroup/business-central-workbench-showcase,
    downloading it if needed. We specified the ports using -p 8080:8080 -p 8001:8001;
    otherwise, we wouldn’t be able to talk to it in the next step and we gave it a
    --name value of business-central, to make it easier to spot in Docker Desktop.


    **Docker ports**

    Docker is great as it runs images in their own isolated containers. That’s great
    for security, but it does mean that if we don’t specify a port using the -p flag,
    we have no opening to communicate between our laptop and the secure container.


    6. In Docker Desktop, we encourage to you click the buttons on the line with the
    container name to explore more. Our container is already running, so we don’t
    need to click the button to start or stop it.


    7. It’s also useful to click on the container name, Business Central. This gives
    us additional information from the Business Central logs, as shown in Figure 10.8.
    Much of what is shown is technical, but it is a useful source of suggestions if
    things aren’t behaving as you’d expect.'
