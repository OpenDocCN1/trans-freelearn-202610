  md: '+   4. We need to build a payload of JSON that contains the information we
    want to pass into the decision service. This is contained in the `ds_req_body`
    variable. For simplicity, the JSON text is the same every time. But you could
    manipulate this string to take values from cells in the Excel spreadsheet using
    standard VBA.


    +   5. The `send` and `waitForResponse` messages make the actual call to the REST
    page.


    +   6. `getAllResponseHeaders` and `responseText` allow us to show the values
