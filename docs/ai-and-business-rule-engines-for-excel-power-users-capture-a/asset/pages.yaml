    If we have entered our formula correctly (no spelling mistakes), you should see
    an output in the Run panel of function DayCalc( DOB ) - Evaluated with success.


    While it''s useful to know that KIE can understand our function, we haven''t yet
    called it by passing in a date and received a response.


    # Running our function


    While we''ve wired our decision model to make the function available to the decision
    table, it is helpful to see exactly what is going on. To do this, we''re going
    to add another node to our decision model to allow us to visualize the output:


    +   1. Open our previous example, add another decision node, and call it Customer
    Birth Day.


    +   2. Link the new node from the DayCalc function. Your model should be similar
    to Figure 4.22:


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_117_1.png)


    Figure 4.22 – Creating a Decision Node to test the function'
