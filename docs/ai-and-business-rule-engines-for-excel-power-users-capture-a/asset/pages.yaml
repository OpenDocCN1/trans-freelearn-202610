- pgno: 224
  md: 'As expected, our flow has run, called the decision service, and then appended
    the results to our Excel table. Play around with the values when setting the Payload
    variable in step 2 of the Power Automated flow we have just created to confirm
    that the service behaves as expected.


    While this is a much more useful flow, the values are still hardcoded, and there
    are still a couple of steps missing compared to the customer service flow we sketched
    out in Figure 8.1 at the start of the chapter. Let’s fix that now.


    # Modeling our customer service flow in Power Automate


    Since the customer service flow gathers information, let’s start by taking a look
    at Microsoft Forms.


    # Introduction to Microsoft Forms


    Microsoft Forms is a free offering that forms (excuse the pun) part of Office
    online. You may have used it already, or similar offerings such as Google Forms
    or SurveyMonkey. Forms is available at https://forms.office.com/. It’s easiest
    to use the same Microsoft account that you’re hosting for your Power Automate
    flow, as it will help in linking them later.


    On this page, click New Flow to create a new form. We’ll edit it step by step:


    +   1. The form will initially be untitled – click to give it a name.

    +   2. Click Add New to add your first (text) question. Let’s call it Email.

    +   3. Click Add New again to add another text question. Let’s call it Customer
    Number.

    +   4. Click on the … options beside this question, select restrictions, and choose
    Number.

    +   5. Click Add New to add a choice question. Add the options of US, UK, NL,
    JN, and UK.

    +   6. On the screen, click on the … options beside this question. Select the
    option to make it a dropdown.

    +   7. At the top right, click on Preview. Our form should now look something
    like Figure 8.21:'
