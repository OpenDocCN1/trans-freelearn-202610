- pgno: 97
  md: '# More Decision Models, Business Rules, and Decision Tables


    In the previous chapter, we wrote our first business rule using *Decision Models*
    in the KIE Sandbox. While it gave a friendly greeting, that business rule wasn’t
    very powerful. This chapter will explore other features of KIE to write more powerful
    business rules that solve more real-life problems.


    Along the way, we’ll explore different formats for storing information. We’ll
    use the tools in KIE Sandbox to model these formats, making it a lot easier to
    understand the data we’re working with. We’ll create our first **Decision Table**
    and see how these are a very powerful way of expressing business rules. We’ll
    explore other node types to help us process information and help prepare it for
    the decision tables. Finally, we’ll combine all of these node types to create
    a very powerful decision-making example.


    Our aim is to capture our business decision-making processes to provide a useful
    service. For that, we will cover the following main topics:


    +   - Make your decisions easy to talk to

    +   - A more powerful Decision node – Decision Tables

    +   - Other types of Decision Nodes

    +   - Adding nodes to support our Decision Table

    +   - A more sophisticated Decision Table

    +   - Rule matching and HIT Policies

    +   - A safer Decision Table example


    Let’s start by thinking about how we can make our decision service easy to work
    with.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# # Make your decision service easy to work with


    You might not have realized it, but in the previous chapter, you wrote your first
    decision service. When running our *Greeting Example* in the KIE Sandbox, we supplied
    inputs (a name and if it was morning or not), made a decision, and then shared
    the output (**Good Morning** or **Good Afternoon**).


    While we can’t see many colleagues signing up to use this particular service,
    this will change quickly as we move into the more sophisticated examples in this
    chapter. It’s worth thinking now about what other people need to know when using
    our service:


    +   - How we make a decision – in general, the **Decision Model and Notation (DMN)**
    format makes this pretty clear. It is certainly much clearer than other solutions
    (such as functions hidden in code or in Excel).

    +   - The data needed to be passed into the decision service, and the format of
    the data we get back from it.


    In our greetings service, we expected a String (Text name) and Boolean (whether
    it was morning – true or false). But Decision Models allow us to be a lot more
    specific about the type of data we pass in and out. This is a good thing, as it
    makes it easier for people to use our service.


    Before we begin to specify the data we expect to pass into, and back out from
    our Decision Service, it’s worth thinking about how Excel models data.


    # ## What shape is your data – tables or trees?


    Excel is brilliant – you’ve never really needed to think about the shape or structure
    of your data. All Excel data is table based on a grid-type layout. A typical example
    would be *Figure 4.1* – a table of customer information that we might have if
    we were running an online chocolate shop:


    | Customer Number | Customer Name | Date of Birth | Country of Residence | Special
    Request |

    |---|---|---|---|---|

    | 1029 | Jane Smith | 10-Mar-2001 | Netherlands |  |

    | 2219 | Sita Patel | 18-Apr-1998 | New Zealand | Vegan |

    | 8781 | Joseph Okoru | 22-Sep-1963 | Sri Lanka |  |

    | 1123 | Peter Murphy | 04-Nov-02 | United States |  |


    *Figure 4.1 – A very simple customer table*


    It’s pretty simple, and in real life, we’d have more columns than the ones listed
    here – perhaps to store emails, shipping addresses, and similar information. But
    it’s good enough to demonstrate the grid-type layout that Excel encourages you
    to use. And there are obviously more sophisticated sheets – for modeling company
    financial projections, where an entire sheet would represent one company, instead
    of the one-row-per-client layout we show here. But our simple example is enough
    to show the limitations of grid-based data.'
  merge: -1
  img_proc: true
- pgno: 99
  md: "Of course, like most Excel sheets, it’s not a true grid – the values for **Special\
    \ Requests** are optional (it can be empty). A bigger problem, that you’ve probably\
    \ already seen in your own Excel sheets, is that additional data that doesn’t\
    \ quite fit into the grid pattern. For example, if we also want to track customer\
    \ orders in this spreadsheet, we have three options:\n\n+   - Add in another column\
    \ for the first order, yet another column for the second order, and so on – we\
    \ risk ending up with a very messy spreadsheet.\n+   - Or we could add another\
    \ row (duplicating customer numbers) and put separate order details in each row\
    \ we add. This gives us space to store more information but makes it difficult\
    \ to update customer-level information (such as name).\n+   - Or, we could create\
    \ a separate table for orders and cross-reference them using **Customer Number**.\
    \ If you’ve ever used SQL databases, you’ll be familiar with this approach. But\
    \ having information in two places makes it difficult to view information all\
    \ in one go.\n\nThe point is that the grid shape of our data doesn’t quite fit.\n\
    \nWhat if we tried a different, tree shape for our data instead? Figure 4.2 is\
    \ one line of our customer table in tree (JSON) format:\n\n```\n{\n  \"CustomerInfo\"\
    : {\n    \"Customer Number\": 1123,\n    \"Previous Order\": [\n      \"ord001\"\
    , \"Snap Crackle Bar\",\n      \"ord002\", \"Turkish Delight\"\n    ],\n    \"\
    Customer Name\": \"Paul Murphy\",\n    \"Special Request\": \"lactose intolerant\"\
    ,\n    \"Date of Birth\": \"2001-11-02\",\n    \"Country of Residence\": \"United\
    \ States\"\n  }\n}\n```\n\nFigure 4.2 – One customer in JSON format\n\nIf you’ve\
    \ seen a JSON file before, the layout will be familiar, but let’s highlight some\
    \ key features of this file format: we’ve indented the text to make the tree-like\
    \ structure clear:\n\n+   - This file is just a text file with an agreed layout.\
    \ It’s similar in many ways to a **comma-separated values (CSV)** file – another\
    \ type of text file with an agreed layout.\n+   - You can open and edit JSON files\
    \ in Notepad or another text editor. Figure 4.2 with color highlighting is from\
    \ VS Code (we’ll use that editor again in *Chapter 12*).\n+   - Each value is\
    \ named – so it’s very easy to identify key pieces of information, such as customer\
    \ names."
  merge: -1
  img_proc: true
- pgno: 100
