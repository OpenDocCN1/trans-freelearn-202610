    \ the Rest URL we are calling - you will need to\n    //update this with the value\
    \ from the Swagger API\n    // This example takes it from Excel\n    RestUrl =\
    \ Excel.CurrentWorkbook(){[Name=\"ParamsTable\"]}\n    [Content]{0}[Value],\n\
    ```\n\nThe next lines are new compared to our previous hardcoded example – we\
