- pgno: 121
  md: '+   - **Collect**: This allows multiple matches. If we used this policy, we
    would recommend at least two products to all US-based customers (**Silk Tray**
    and **Peanut Crunch**). There is a second drop-down option under this policy to
    specify an aggregator: **Min, Max, Count** (all of which work for text and numerical
    values), and **Sum** (which works for numbers only).

    +   - **Rule Order** and **Output order**: These also allow and collect multiple
    rule matches. Those matches are then sorted by the order of the rules (like in
    **First**), or the order of the outputs (like in **Priority**).


    Which HIT Policy works best will depend on the rules you are trying to write.
    Your focus should be on which gives the easiest and clearest-to-understand rules
    with the fewest gaps (since you’re trying to ensure all scenarios are covered).
    For now, we suggest you play around with the different HIT Policies to understand
    them better – paying attention to the **Problems** tabs when KIE complains about
    the rules being incompatible with the policy.


    While writing rules to be **unique** (or any of the more specific HIT Policies)
    is more difficult initially, it will save you time in the long run. This is because
    the automatic KIE analysis allows you to identify the gaps now (when it is easy
    to fix), rather than later on (when you have an annoyed customer on the telephone
    complaining that no suggestions were made of which candy bar they might like).


    # A safer Decision Table example


    While our Decision model is very powerful, in its current form, it’s very dangerous.
    It recommends milk-based products to lactose-intolerant customers. Even worse,
    it could be recommending products with nuts to people with severe allergies.


    We need to fix this. Our first thought is to update the **Product Recommendation**
    decision table. It is possible to write our rules to do this but it is also very
    likely that such an important decision will somehow get lost in all the rules
    we are writing. If not now, somebody in the future could forget this important
    rule with potentially fatal consequences.'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'Far better to *chain* our decision nodes to highlight in our Decision Model
    how important this health check rule is. *Figure 4.25* is an example of how we
    could design this:


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_122_0.png)


    Figure 4.25 – A safer product recommendation service


    This model is downloadable as 04_Product_Recommendation-collect.dmn but is simple
    to recreate yourself with the following changes to our previous decision table
    example:


    +   1. We removed the **Customer Birth Day** decision node since it was no longer
    needed for testing, but left the **DayCalc** function for use in our Decision
    Table.

    +   2. We updated the HIT policy on the **Recommended Product** Decision Policy
    to **Collect**. It doesn’t make a difference for our health checks, but it is
    better practice than using a HIT policy of **First**. Otherwise, the decision
    table is unchanged.

    +   3. We make no changes to the **Customer** data type.

    +   4. We’ve added a new Decision Node of a **List** type, specifying the key
    health issues we need to look out for. For our example, we specify the `lactose
    intolerant` and `nut allergy` values, as per *Figure 4.26*:'
  merge: -1
  img_proc: true
- pgno: 123
  md: "![](img/48815d6f06dc8c7aeaa3963d289fb1e7_123_0.png)\n\nFigure 4.26 – Health\
    \ Issues list\n\n+   5. We added a new Decision node of the **Health Checked**\
    \ product. While we could have used a small decision table, to keep things simple\
    \ we make this a literal expression like in *Figure 4.26*. The if `Customer.Special\
    \ Requests in Health Issues then \"Potential Health Issue - please check\" else\
    \ Recommended Product` expression ensures that any potential health issues get\
    \ highlighted if they are on the **Health Issues** list. Otherwise, the rule passes\
    \ through the recommendation from the Decision Table:\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_123_1.png)\n\
    \nFigure 4.27 – Implementing our heath check in a decision node\n\n+   6. Finally,\
    \ we wrap our decision model as a Decision Service to focus people’s attention\
    \ on using the correct **health checked Product** node and not any of the interim\
    \ calculations.\n\nWhen we run this decision model, we still make product recommendations\
    \ as before. However, if there are any potential health issues, they get flagged\
    \ for human intervention.\n\nThis layout is standard practice – we will err on\
    \ the side of caution with our business rules and allow a real-life person to\
    \ make the final decision in sensitive cases. Since the person only deals with\
    \ one or two interesting cases instead of thousands of boring ones, it is still\
    \ a much better experience for them. It also allows us to focus on writing rules\
    \ that will apply to the vast majority of cases, so we won’t waste too much time\
    \ on situations that will apply (hopefully) to only a small number of orders.\n\
    \n> ### Decision Models as a safety net for AI – neural networks\n> \n> Later,\
    \ when we have hundreds of thousands of orders, we might train a neural network\
    \ to replace our **Product Recommendation** decision table – as we do in *Chapter\
    \ 11*. But we would hesitate to trust a neural network to get life or death decisions\
    \ right (such as nut allergies).\n> \n> We can’t guarantee the output of a neural\
    \ network in every situation. Combining a rules-based approach (such as the **health\
    \ checked Product** node with a neural network) gives us a safety net, so we know\
    \ the important checks will be done exactly as we specify."
  merge: -1
  img_proc: true
- pgno: 124
  md: '# Summary


    This chapter saw us move from the idea of Decision Models being useful to using
    Decision Tables and business rules hands-on. Based on a business situation of
    a chocolate shop, we built a simple product recommendation engine that should
    give you lots of ideas for your own day-to-day work.


    We used many important tools along the way and learned how to model our data using
    the structured editor, making it clearer what information will be passed in and
    out of our decision model. We created decision tables, increasing in power and
    functionality to demonstrate just how scalable a decision-making solution they
    are. And we looked at the other node types and expressions that help us prepare
    data for use by decision tables.


    Behind these tools, we saw a lot of important concepts – we learned a little bit
    more about the power of FEEL expressions. We looked at how different HIT policies
    can make our business rules clearer to understand and avoid gaps. And we saw how
    to design a decision service to ensure we don''t lose sight of mission-critical
    decisions that might affect people''s health.


    So far in this book, we''ve used the KIE sandbox as a tool to write and execute
    our decision models and business rules. But since we spend much of our working
    life in Excel, we want to be able to leverage the power of KIE and Drools from
    within our spreadsheets. We''ll look at how we do that in the next chapter.'
  merge: -1
  img_proc: true
- pgno: 125
