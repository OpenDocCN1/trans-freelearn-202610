- pgno: 270
  md: 'Note that your screen will be slightly different from this screenshot – **paul.f**
    is my Windows username, but yours will be different. But the same ideas of typing,
    pressing *Enter*, and having the computer start working are the same.


    The good news is, in the next sections, once we use the commands in the console
    to download our sample images, the images automatically appear in Docker Desktop.
    After that, we’ll use Docker Desktop to manage them.


    # Running a simple Hello World image in Docker


    Now that we’ve downloaded Docker, we want to test a simple image. That way, we
    know Docker is running correctly and if something breaks, we know where to start
    looking to fix it.


    Traditionally, the first example is to get the computer to say `Hello World` to
    you. Docker makes this easy. To run the Docker Hello World example, follow these
    steps:


    +   1. Open the command prompt by pressing press *Windows Key* + R, then type
    `cmd`. Mac users, see the note in the preceding section on opening Terminal.

    +   2. In the console, type `docker run hello-world`, paying special attention
    to the spelling.

    +   3. Make sure you press the *Enter* key to run the command. You will get the
    message shown in *Figure 10.5*:


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_270_0.png)


    Figure 10.5 – Docker Hello World


    +   4. In *Figure 10.5*, we can see the command we typed (`docker run hello-world`)
    and then the text generated by Docker once we pressed the *Enter* key. Since it
    could not find the image locally, it automatically downloaded the latest version
    from the **Docker Hub** and ran it.'
  merge: -1
  img_proc: true
- pgno: 271
  md: "+   5. If you see `Hello from Docker` about half way down the text output from\
    \ Docker, then congratulations – you have just run your first image in a Docker\
