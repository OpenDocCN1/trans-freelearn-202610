- pgno: 191
  md: '![](img/48815d6f06dc8c7aeaa3963d289fb1e7_191_0.png)


    Figure 7.5 – Script Lab toolbar in Excel


    Before we write our first script, it’s worth looking into the new features we’ve
    just added to Excel.


    # Tour of Script Lab


    Now that we have Script Lab installed, let’s take a look at its key parts, starting
    with our new toolbar shown in Figure 7.5:


    +   - **Code**: This will open an editor where we can enter our scripts and supporting
    user interface elements.

    +   - **Run**: This will allow us to run our script. It also gives us a **Run
    side by side** option – meaning we can make a change in the code pane and see
    the effect immediately.

    +   - **Functions**: This allows us to create custom functions to augment the
    built-in functions, similar to functions such as =Sum() that are already built
    into Excel.

    +   - There are plenty of links to supporting materials provided through the remaining
    buttons – **Tutorial**, **Help**, **Reference Docs**, and **Ask the Community**.


    Click on the Code button. It will bring up the main Script Lab editing pane, as
    shown in Figure 7.6:


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_191_1.png)


    Figure 7.6 – Script Lab editor pane'
