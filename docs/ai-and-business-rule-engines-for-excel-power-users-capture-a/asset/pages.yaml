  md: '![](img/48815d6f06dc8c7aeaa3963d289fb1e7_311_0.png)


    # Figure 11.17 – PMML generated by the ML script


    As you can see, PMML is an XML format that is largely human-readable. It also
    has the advantage of being an industry standard, so even though sklearn and a
    Python notebook generated the model, we are able to import and execute the model
    in KIE. In general, the interoperability works smoothly—but a bit like assembling
    a cabinet from Ikea, sometimes a few gentle knocks from a mallet are needed to
    get everything into place.


    In our case, there are two edits needed to the PMML file so that Kogito can work
    with it:


    +   - On the second line, edit the version number (4_4) to the one that Kogito
    supports. At the time of writing, this is 4_2. This version number is listed twice
    on the line—edit both so that it reads <PMML xmlns="http://www.dmg.org/PMML-4_2"
    xmlns:data="http://jpmm1.org/jpmm1-model/InlineTable" version="4.2">.

    +   - Find the line starting <NaiveBayesModel and edit it so that it begins with
    <NaiveBayesModel modelName="chocolateRecommendation", keeping the rest of the
    line unchanged. This tells Kogito the name of the model, which it will display
    in the Decision Model and Notation (DMN) editor.

    +   - Export the edited file from Azure ML Studio and save a copy on your laptop.


    An edited version of the file is on the book’s GitHub site as 11_chocolate_recommendations.pmml.'
