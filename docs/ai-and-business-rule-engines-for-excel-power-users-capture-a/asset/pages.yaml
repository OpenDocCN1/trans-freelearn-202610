    \ skipped over the complexity of what Docker does for us – that’s why we’re using\
    \ Docker. But if you read the text after `Hello from Docker`, you’ll get a hint\
    \ of the steps happening behind the scenes that you don’t have to worry about.\n\
    \nThis example might be a bit underwhelming – we’ve spent a lot of time doing\
    \ setup, and all we’ve achieved so far is a `Hello World` message. But now that\
    \ we have Docker up and running, we can take advantage of what it can do – download\
