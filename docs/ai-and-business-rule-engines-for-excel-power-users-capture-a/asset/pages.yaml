- pgno: 81
  md: 'So, what is happening between the browser and your newly installed KIE Extended
    Services as you enter values on the KIE Sandbox page?


    +   1. When you edit a value in the input field, an event is triggered in the
    browser.

    +   2. The KIE Sandbox web page (using standard JavaScript) translates the input
    values into a format known as **Javascript Object Notation (JSON)**. It also includes
    a copy of the Decision Model (in XML format) that needs to be executed. More on
    both of these formats later in the book.

    +   3. The KIE Sandbox web page calls the extended service, passing the values
    to it. This process is similar to opening a web page in the browser.

    +   4. The extended service (powered by KIE/Drools) compiles the Decision Model
    into a format it can work with. The KIE/Drools engine then executes the diagram,
    passing the input information (name) to it.

    +   5. The result is passed back to the KIE Sandbox web page and processed so
    that the results can be displayed.


    If you’re curious about seeing these steps in action, the developer tools in your
    browser will allow you to peek behind the scenes in more detail. We don’t need
    to do this, since KIE handles all the details for us.


    Some of you may be keen to jump in and call this process from Excel, so take a
    look at *Chapter 6*, where we start linking Excel with the KIE/Drools rule engine.
    But for now, KIE Sandbox gives us a powerful environment to edit and run our decision
    models.


    If we are going to be editing more decision models to write our rules, it’s worth
    looking at them in more detail.


    # More on Decision Models


    Since we jumped into our example and focused on getting a working business rule,
    we only got a hint of what Decision models are. Officially called **DMN**, the
    three key benefits are as follows:


    +   - **Decision models are accessible to business users.** You could share the
    `Hello World` example with a colleague and have them understand what is going
    on – without any technical training.

    +   - **Decision models are executable.** Unlike other diagrams, there is no need
    for a technical colleague to translate them into executable code. We might take
    this for granted in Excel, but it’s a radical idea. In other solutions, the diagram
    and the code often drift apart, so we can never be totally sure of the business
    decision-making process. Since Decision Models are executable, we don’t have that
    problem – what is in the diagram is how the decision gets made.'
  merge: -1
  img_proc: true
- pgno: 82
