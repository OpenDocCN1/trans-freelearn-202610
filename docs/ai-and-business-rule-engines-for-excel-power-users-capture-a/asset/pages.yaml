- pgno: 27
  md: '# Wrestling with Excel?

    You Are Not Alone


    If you read the Preface, you will know that a lot of people use Excel, being one
    of them, and that you are not the only person frustrated with the limitations
    of it as a tool.


    Based on the fact that you have read on, you must now know that this book can
    help you. But before we can go into how exactly it can help, it’s worth exploring
    in detail the problems we’re trying to solve. In this chapter, we’ll cover the
    following:


    +   - Why do you use Excel?

    +   - Enterprise solutions and the gap between them and Excel

    +   - What’s your real business problem?

    +   - What is artificial intelligence and which type can help you best?

    +   - Practical artificial intelligence and business rules

    +   - Splitting Excel into different pieces


    # Why do you use Excel?


    If you ask most of the billion Excel users around the globe, most of them will
    say they use Excel for these two main reasons:


    +   - As a convenient place to store information – more structured than using
    post-it notes, but flexible enough to evolve over time

    +   - A convenient way to exchange information – because everybody else uses it


    If you are an Excel power user, you’ll add a third reason:


    +   - You use Excel to process important information. And your organization depends
    on the knowledge you have in your head to get the process right


    In working with Excel, you and your colleagues are using it as the core engine
    to drive your business. Let’s look at a couple of real-world examples.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# Excel as the engine room of the business


    There are many important jobs in every business (I’m using *business* as shorthand
    for *any organization*). But those jobs will grind to a halt without a way of
    capturing, processing, and sharing information. On the surface, it looks like
    Excel does these tasks very well:


    +   - If you work for a medical company, you might use Excel to capture orders
    for vaccines, process them to forecast demand, and then use Excel to share orders
    with various plants worldwide

    +   - If you’re in the aircraft leasing industry, you might use Excel to track
    how many planes you have placed with airlines worldwide, process the information
    to calculate different risk scenarios (for example, a major war breaking out),
    and then use Excel to share information with the banks that are funding you

    +   - If you’re a small business, you could use Excel to track salary information,
    process it to calculate payroll taxes due, and carefully share the relevant information
    with each employee


    The following diagram shows how you use Excel in each case:


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_28_0.png)


    Figure 1.1 – How you use Excel


    This diagram is so simple that you’ve probably never needed to think about it
    – you take some information in (for example, from a spreadsheet), process it (apply
    hand-crafted formulas or review it manually), and then share it (maybe save it
    to an internal drive or SharePoint for others to use).


    And that is the core of the problem – your processing is bundled up with how you
    gather and share your information. This workflow is great for getting started,
    but sooner or later, you’re going to run into problems as each of the steps in
    Figure 1.1 gets in the way of each other. We’ll look at how you might encounter
    this problem in your daily work, before beginning to talk about ways of solving
    it.


    # Day-to-day Excel problems


    How you use Excel is unique to you. But I’m guessing that you’ve run into several
    of the following common problems:


    +   - A large part of your day involves repeating tasks in Excel by hand. This
    includes capturing information by manually copying details from one sheet to another.

    +   - Emailing Excel files back and forth, not being sure whether you’re using
    the latest version, and losing information by editing the wrong version.

    +   - Wondering whether your formulas may have been broken by other users and
    spending hours rechecking them.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '+   - You use complex Excel formulas that no one else can really understand
    without spending hours drilling down into them. Formulas within formulas combined
    with more formulas. Sometimes, even those who write them can’t really remember
    how they work.


    These pain points are particularly harsh in a regulated environment (for example,
    financial or medical/life sciences) where data integrity and auditing how decisions
    are made are required. But these pain points also exist in sectors such as manufacturing
    and management, where the consequences of decisions made on faulty spreadsheets
    can get very expensive very quickly.


    The core part of most of these problems is that the file that contains the information
    is the same file that contains your functions for processing that information.
    What if you could separate them?


    # One solution – separating information and processing instructions


    One way of solving this problem is to use two Excel files – one data source containing
    the information we want to work with and the other for processing the instructions
    or business logic.


    Figure 1.2 gives an example:


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_29_0.png)


    Figure 1.2 – Separating information and processing instructions


    This diagram shows a solution, used by many Excel power users, to separate the
    original information from the formulas that act on this information:


    +   1. File 1 contains the information, and only information. You can share this
    file with other people and allow them to edit it.

    +   2. File 2 contains the processing instructions (formula), often a summary
    page or report that can be printed.

    +   3. The two files are linked using the standard Excel formula for linking spreadsheets,
    similar to the following:


    ```

    = [Workbook_name] Sheet_name!Cell_address

    ```'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'This solution is better – you can pass around the first file, knowing that
    your formulas can never get broken (either by accident or deliberately). The second
    file contains all your important formulas. It’s not perfect – updating the two
    files can be tricky, and it’s easy to break the link (for example, by saving the
    files in the wrong place).


    It’s a start toward a solution. In fact, most enterprise computer systems separate
    the information and information processing in this way. They will often refer
    to the information you’re working on as **data** and the processing instructions
    (for example, Excel functions) as **code**.


    If you’ve ever written your own functions or macros in Excel, using **Visual Basic
    for Applications (VBA)**, you’ll have come across these terms before. You’ll see
    the terms data and code a lot in the coming chapters. We’ll also be talking about
    enterprise solutions as we move through the book – it’s worth reminding ourselves
    what they are.


    # Keeping it simple and secure


    If this simple solution solves the problem for you, use it. More information on
    how to use a formula to reference a cell in another Excel file or spreadsheet
    is available on the Microsoft website.


    In fact, if there is one thing we recommend you take away from this book, it’s
    don’t fully trust any spreadsheet that another person can edit (even if it’s password
    protected). If you aren’t convinced, I recommend you read the story of how one
    trader almost put a major international bank out of business by fraudulently manipulating
    Excel – https://www.amazon.com/Panic-Bank-John-Rusnak-Million/dp/0717135632.


    # Enterprise solutions


    One core promise of this book is to build on your existing knowledge of Excel
    and help you find solutions that are more scalable, robust, and supported by a
    wider team. By this, we mean the following:


    +   - **Scalable:** Whatever we build can be used by tens or hundreds of users
    simultaneously, manipulating a very large dataset.

    +   - **Robust/durable:** What we build can be left to run by itself, since it
    won’t easily break and highlights any errors using tests that can be run automatically.

    +   - **Supported by a wider team:** Most Excel sheets are maintained by only
    one person. What if they leave? The solutions we build should be understood by
    many people.


    Typically, these are called enterprise solutions. In your organization, you’re
    likely to have several of these, supported by an internal or external IT team.
    Let’s look at a couple of examples.'
  merge: -1
  img_proc: true
- pgno: 31
  md: "# Examples of enterprise solutions\n\nWe gave an example before of a company\
    \ using Excel to track salaries paid to employees and manage the taxes to be paid.\
    \ But unless you’re an early-stage start-up, you’re likely to find another way\
    \ of doing this – using a pre-built solution. If you Google the term Payroll Software,\
    \ you will find hundreds of examples of it, and many will be tailored to the tax\
    \ system of the country that you live in. In general, for a generic requirement\
    \ such as this (since every company has to comply with the same local laws), you’re\
    \ better off using an off-the-shelf solution.\n\nThis is great if you’re a business\
    \ such as a fast-food franchise. Headquarters will tell you what enterprise systems\
    \ to use and then charge you for using them. But most businesses do things slightly\
    \ differently as they try to win new customers. Even if 80% of their requirements\
    \ (HR, property management, and finance) are the same, these businesses are likely\
    \ to have some things that they need to do differently.\n\nOne example might be\
    \ a home loan lender who focuses on lending to workers in the gig economy with\
    \ a fluctuating income. It may decide to build its own system to approve these\
    \ loans since the decision-making process is different from banks that lend to\
    \ people with a stable 9-5 job.\n\nFor these bespoke requirements, its IT department\
    \ will often build the solution using a language such as Java, C#, or Python.\
    \ They’ll build on top of standard libraries and tools such as Oracle, Microsoft\
    \ SQL Server, and even cloud-based services (e.g., from Amazon). If it doesn’t\
    \ have the skills in-house, it may contract an external company to build the system.\n\
    \nSimple then – we just get our IT department to rebuild our Excel sheets in an\
    \ enterprise software solution. Obviously, it’s not quite as simple as that; otherwise,\
    \ 1 billion people wouldn’t still be using Excel.\n\nIt’s probably worth underlining\
    \ that we think Excel is a great tool and should be used alongside your set of\
    \ enterprise solutions. Not only is it incredibly flexible and puts the power\
    \ in the hands of business users but it can often also fill the gap as a good-enough\
    \ solution while your IT team builds something longer-term. Either way, now that\
    \ Excel is a first-class programming language, don’t be afraid to use it. Just\
    \ know that this book gives you a roadmap to build from your current Excel sheets\
    \ when you need something better.\n\n> **What is a first-class language?**\n>\
    \ \n> For more details on what this means, see the following link. In general,\
    \ don’t let anybody intimidate you into thinking that Excel isn’t a proper solution\
    \ - https://www.microsoft.com/en-us/research/podcast/advancing-excel-as-a-programming-language-with-andy-gordon-and-simon-peyton-jones/."
  merge: -1
  img_proc: true
- pgno: 32
  md: '# The chasm between Excel and enterprise solutions


    So, why doesn’t your IT department just build a shiny new solution to solve all
    your Excel problems? It turns out there is a bit of a chasm between Excel and
    true enterprise solutions. We’ll cover three gaps that you may already have run
    into.


    # Gap 1 – the need to code


    Coding or programming is being able to write instructions in a language that a
    computer can understand. It’s not difficult – you’re doing it already in Excel.
    The set of functions, numbers, graphs, and so on that you put in Excel are instructions
    to the computer to produce the result you want.


    You’ve already done the hardest bit – breaking down a larger problem into smaller
    ones that the computer can then work through. But like Excel, even if coding is
    easy to do, it is harder to do well. It can take commercial developers (including
    your colleagues in the IT department) several years to fully master their craft.


    # Gap 2 – business experts and tech experts are now two different people


    As an Excel power user, you’re likely to be a business domain expert. You might
    be the person who knows everything about the forecasting demand for umbrellas
    in the mid-west region of the United States. You could be the person who knows
    how to tweak expenditure on online and traditional advertising to make the most
    sales in India. Or you could be the person who knows how to forecast the demand
    for spare computer parts in Europe for the next five years.


    This business knowledge is valuable as it is the one thing your business cannot
    do without.


    Very few people have this business knowledge and are also able to code. It’s not
    impossible, it’s just that mastering two things (business knowledge and coding)
    is more difficult than one. Also, both disciplines lead to different career paths,
    so being skilled in both is tricky.


    That’s OK. Two people can work together to build the solution. But having two
    people working on the solution leads to gap number 3.


    # Gap 3 – knowledge disappearing into code


    Take a look at the following mortgage tool (a home loan calculator, available
    at https://www.drcalculator.com/mortgage/) shown in Figure 1.3:'
  merge: -1
  img_proc: true
