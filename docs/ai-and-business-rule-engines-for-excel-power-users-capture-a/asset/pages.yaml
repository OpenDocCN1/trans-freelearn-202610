- pgno: 200
  md: 'It’s worth downloading and going through the script again. With some small
    changes, it can be used to call your own decision service. I’d also encourage
    you to look at the built-in Script Lab examples. They cover most of the ways that
    you might want to extend your project with even more sophisticated user interface
    elements.


    # Alternative approach – custom functions in Script Lab


    You may notice, as you work through the examples, an option to create a custom
    function using Script Lab. At first sight, this appears attractive – it would
    allow you to build your own bespoke function, then type something such as the
    following directly in a cell in Excel:


    ```

    = callDecisionService (customerNumber, countryOfResidence, dateOfBirth ..)

    ```


    However, for this approach to work, you need Script Lab installed, the custom
    function registered, and for the function to be entered into a spreadsheet. If
    you miss even one of these three steps, your spreadsheet will break.


    For most use cases, the Power Query approach we covered in the previous chapter
    is more robust. It acts in many ways like a custom function, it comes built into
    Excel, and it doesn’t need to be run on first-time use to register it with Excel.


    There is a lot more to learn about Script Lab and it can give you very powerful
    Excel-based solutions. Since it and Office Scripts, which we will cover in the
    next section, have a lot in common, it is a good investment of your time to go
    through the Microsoft docs at https://learn.microsoft.com/en-us/office/dev/add-ins/reference/overview/excel-add-ins-reference-overview.
    If you’re looking to do a deep-dive into either tool, I would also recommend the
    following book to fully explore the power of extending Excel using these tools
    – https://leanpub.com/buildingofficeaddins.


    # What is Office Scripts?


    While all Excel users have access to Script Lab, not everybody will have access
    to Office Scripts – yet. Since we already know it shares the Office.js approach
    to manipulating Excel through scripts, what is the difference between the two?


    +   - While it is very similar to Script Lab, Office Scripts is slightly easier
    to use. For example, some of the boilerplate async calls and error-handling functions
    are hidden from us.

    +   - Office Scripts has a recorder to make notes of our actions in Excel and
    transcribe them into scripts. This is very useful for learning about Office.js
    in particular.

    +   - Office Scripts comes pre-installed in Office 365 online – although it may
    need to be enabled by an administrator.

    +   - It is easier to share scripts. While (like in Script Lab) the script sits
    outside the workbook, by adding a button to the worksheet, anybody who can see
    the Excel sheet can also see the script.'
  merge: -1
  img_proc: true
