- pgno: 269
  md: "+   - **Volumes** are like disks where containers can store their information.\
    \ In general, Docker will manage them automatically for us.\n+   - The other tabs\
    \ on the left (**Dev Environments** and **Extensions**) are more advanced functionality.\
    \ We won’t need them for running samples in the book.\n\nAcross the top right\
    \ of the screen, there are some more interesting buttons:\n\n+   - **Upgrade**,\
    \ **Troubleshoot**, and **Debug** hint at the more advanced power of Docker. We\
    \ won’t use these buttons much.\n+   - **Account** allows you to sign in using\
    \ the username and password you created on docker.com earlier. It is a good idea\
    \ to sign into Docker Desktop now – it will help when we download the Docker images\
    \ in the next section.\n\n> **Shutting down the KIE Extended Services**\n> \n\
    > Since we’re about to run our first Docker image, now is a good time to remind\
    \ you to shut down the KIE Extended Services. If you forget, you will get a Port\
    \ already in use error, since both KIE services and (some of) the Docker images\
    \ attempt to do similar things and get in each other’s way.\n\n# First time use\
    \ of Docker Desktop\n\nDocker Desktop is a great tool for managing our sample\
    \ images once we have downloaded them. But it currently gives you no way to download\
    \ these images. To do that, you need to use the **console** (also known as a **terminal**\
    \ or **command prompt**). In general, we just need to use the console only once,\
    \ because after the image has been downloaded, we can manage it in Docker Desktop.\n\
    \nAs an Excel power user, you should have no fear of the console. It allows us\
    \ to type text commands, just like typing formulas in Excel. Just like in Excel,\
    \ it is very important to get the spelling right (it’s the number one source of\
    \ mistakes). And just like in Excel, it is important to hit the *Enter* (or *Return*)\
    \ key so the computer knows that you have finished typing and it can begin working.\n\
    \nTo open the console in Windows, press *Windows Key* + *R*, then type cmd (and\
    \ click OK). You should see a black-and-white window similar to *Figure 10.4*:\n\
    \n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_269_0.png)\n\nFigure 10.4 – Console\
    \ on Windows\n\nOn a Mac, press *Cmd* + *Space* to open Spotlight, then type *Terminal*\
    \ to search for it."
