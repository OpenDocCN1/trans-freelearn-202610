- pgno: 291
  md: '# 11


    # Rules-Based AI and Machine Learning AI – Combining the Best of Both


    When we introduced rules as the book''s main approach to **artificial intelligence
    (AI)** back in *Chapter 1*, we mentioned **machine learning (ML)** as a complementary
    technique. We''ve spent the 10 chapters since then focusing on business rules
    and integrating them with Excel. So, it''s about time that we returned to the
    ML side of AI—with a focus on how to combine the two approaches to AI to get the
    most effective use of AI in your business.


    Taking a graphical approach, we''ll explore the thinking behind ML based on sample
    data from our online chocolate shop. We''ll introduce notebooks, Python, and **Azure
    Machine Learning (Azure ML)** and apply these tools to train a simple ML model.
    We''ll integrate this trained model into a rules-based decision model to improve
    the recommendation sample we first met in *Chapter 4*. Finally, since this is
    only one chapter and very much opening the door for further learning, we''ll signpost
    other technical solutions and options on your ML journey. Specifically, we will
    explore the following topics:


    +   - Business rules as preparation for machine learning

    +   - Graphical introduction to machine learning

    +   - Training models in Azure ML

    +   - Deploying the two kinds of AI together (machine learning and rules)

    +   - Running our integrated model


    To start, we''ll take our first look at machine learning, and see how a rules-based
    approach to AI helps get your organization ready to use it.'
  merge: -1
  img_proc: true
- pgno: 292
  md: '# Technical requirements


    All the tools and techniques that we will use in this chapter are available in
    the cloud, so no new software needs to be installed on your laptop. While Azure
    is a highly sophisticated offering, it is fully online, and we guide you step
    by step through setting up your graphical machine learning notebook.


    Two items that you have met in previous chapters are worth reminding you about:


    +   - At the end of the chapter, we will combine our machine learning AI with
    a rules-based AI using KIE Sandbox. Having the KIE Extended Services running (which
    we set up in Chapter 3) may help.

    +   - As usual, all the samples for this chapter are on the GitHub site at https://github.com/PacktPublishing/AI-and-Business-Rules-for-Excel-Power-Users.


    # Business rules as preparation for Machine Learning


    In Chapter 1, we suggested combining the two AI approaches (rules and ML) to build
    a self-driving car. The ML approach is great for fuzzier requirements (to identify
    whether it is a dog or a child standing in the road). Rules are better for requirements
    we can state clearly and that must always be implemented (for example, swerve
    the car to avoid a child but do not swerve for an animal as it risks a more serious
    accident).


    Your organization should be able to follow a similar approach—there are rules
    that can be clearly written by a human expert (for example, buyers must have a
    20% deposit for their home loan). And there are experiences that are harder to
    express—a senior bank official might have a feeling that a loan application is
    fraudulent and need further investigation, but might struggle to explain exactly
    why. In our business, we are likely to need both rules and Machine learning approaches
    to mimic both these sets of knowledge.


    Which approach to start with? Unless you are Google, Amazon, or Meta (Facebook),
    your organization is not going to have the millions (or even hundreds or millions)
    of examples needed to train cutting-edge ML models. Even a bank may only see thousands
    of loan applications in a year. But most businesses will have an expert who knows
    the rules around those applications—which makes a rules-based approach the obvious
    place to start.


    But it’s not just a lack of data that holds organizations back from adopting machine
    learning. Later in this chapter, we’ll train an ML model in one simple step. So,
    why aren’t more organizations using them? To be blunt, it’s the time and the steps
    needed to gather and prepare the data and then afterward make use of the model’s
    recommendation that is the issue.


    Organizations will not dedicate teams to gathering and preparing data unless they
    know it will be valuable. But organizations don’t know which data is valuable
    until they actually train the models.


    Remember that ML projects are more like farming (you prepare the ground, then
    hope you get the harvest) than building (which is what corporate IT departments
    are very good at).'
  merge: -1
  img_proc: true
- pgno: 293
  md: 'In short, rules allow you to demonstrate the value of AI while putting the
    teams in place to gather the data needed to move to machine learning. You''ll
    see later in the chapter this is the approach we will take with our online chocolate
    shop. But before we get to that point, it''s worth a quick graphical introduction
    to machine learning.


    # Graphical introduction to Machine Learning


    Don''t be scared of math—it''s just numbers. And since every number can be plotted
    on a graph, we can think of machine learning as patterns and pictures and teaching
    the computer to recognize those pictures.


    While that approach is simplistic, the truth is that nobody is smart enough to
    carry out all the math needed for machine learning. Even if you fully understood
    the theory behind it, it is impossible for the human brain to think in the many
    trillions (yes—trillions) of dimensions of data points used in some ML projects.
    And even if we got that far, the sheer volume of calculations needed would take
    longer than a human lifetime to work through.


    Happily, the *machine* in machine learning means there are tools available to
    help us. There are prebuilt toolkits (libraries) available that we''ll use to
    train our models. And while it does help to understand the strengths of each toolkit,
    you can get a long way with the following approach:


    +   1. Gather and prepare our data, then split it into training and test sets.

    +   2. Understand the different algorithms at a high level, and choose three or
    four most likely to give us results (even if we are still not entirely sure which).

    +   3. Train a recommendation model against the data.

    +   4. Using the test set of data, see how well the model performs.

    +   5. Pick the model that works best and deploy it for day-to-day use.


    There are even tools from Microsoft and other vendors to help automate the process
    of selecting and testing the best models. While this chapter is only an introduction,
    the toolkits we use allow you to experiment and find the best approach for your
    data. Let''s start by working through our own data—from the online chocolate shop
    we met in previous examples.


    # Looking at the sales data from our online chocolate shop


    Let''s say that we implemented the rules-based recommendation engine for our chocolate
    shop that we walked through in previous chapters, and the recommendations have
    been so good that our sales have exceeded our expectations. We now have hundreds
    of thousands of customers, and when we run a report on our sales to see which
    products are most popular in different countries, we get a table like the one
    shown in Figure 11.1 (showing only the first 11 rows of many):'
