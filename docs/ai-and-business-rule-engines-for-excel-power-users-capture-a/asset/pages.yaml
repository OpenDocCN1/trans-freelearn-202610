- pgno: 337
  md: 'This section has given you multiple options for running decision models with
    machine learning and/or rules. Since the most likely longer-term deployment of
    your models is as part of a wider enterprise system, we wanted to show you Red
    Piranha as a template enterprise project for your rules.


    # Red Piranha as a template enterprise project


    The main focus of this book is to show you as an Excel power user how to leverage
    the power of a business rules engine. That gives you a workable solution, but
    it is likely that your decision models will sooner or later be deployed as part
    of a larger enterprise system. That’s a good thing! Remember the full enterprise
    system diagram we saw back in Chapter 2? Your decision models won’t need to change,
    but now they will have a more robust infrastructure around them.


    As an Excel power user or business rules author, you don’t need to know the full
    detail of how to do this. But since you’re investing your time in this area, it
    is very reassuring to see how it can be done. The section will show you a working
    example of such an enterprise system using the Red Piranha project.


    Before we start, we have two other reasons for introducing the Red Piranha project:


    +   - Red Piranha shows you another way of integrating Excel data with KIE. Previously,
    we passed selected cells. Red Piranha allows us to load entire Excel sheets into
    the rule engine.

    +   - Red Piranha is based on Spring Boot, a widely used Java framework. So, it’s
    a useful starting point for you if you wanted to explore the Java world.


    Red Piranha allows to you specify an input Excel file, then state which rules
    file or decision model to apply to it, and finally say which output Excel file
    you want to use (so your original file never gets overwritten). It’s a more robust
    approach since it works on named ranges within the Excel file – it’s harder for
    edits to make the Excel file break.


    The Red Piranha project grew out of the examples in the previous book by the author
    (JBoss Drools Business Rules) and subsequent work. But please view it as a proof
    of concept – a useful way to demonstrate the concepts of a full production system
    before building the actual system. We’ll shortly take a detailed look inside the
    Red Piranha project. But first, let’s use the Docker skills we acquired in Chapter
    10 to quickly download and run it.


    # Running the Red Piranha Docker image


    Make sure we have Docker Desktop or the background service running using the instructions
    in Chapter 10. Not only does Red Piranha package the KIE/Drools rule engine with
    examples to make it easier to use with Excel, it also provides an easy-to-use
    Docker image. Let’s get that Docker image up and running:


    +   1. Open Command Prompt by pressing Windows Key + R, then type cmd.'
  merge: -1
  img_proc: true
