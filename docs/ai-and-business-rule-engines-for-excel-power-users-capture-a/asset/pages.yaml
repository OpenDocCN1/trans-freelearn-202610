  md: "# Preface\n\n> *Think about a world without Excel. That's just impossible for\
    \ me.*\n> \n> *Satya Nadella, Microsoft CEO*\n\nMost of us agree with Microsoft\
    \ CEO, Satya Nadella. If you include similar products (and Google doesn’t release\
    \ the exact figures for Sheets), there are over a billion of us who can’t do without\
    \ Excel or a similar spreadsheet to organize our daily work and our professional\
    \ and personal lives.\n\nBut you’re a special member of this billion-strong group.\
    \ You’re a member of the group of Excel Power users that push the limits of this\
    \ tool. You’re the person that colleagues go to with the trickiest Excel problems,\
    \ and you get them fixed. You’re the person that knows it can be done in Excel,\
    \ even if you need to delve into the furthest corner of the web to get the answer.\
    \ You’re the person with the key knowledge that your business runs on – all captured\
    \ in the trusty Excel file format.\n\nIf you’re reading this book, you know you\
    \ have a problem. Excel will always be a core part of your working life – but\
    \ you know it can be better. You’ve lost track of the hours spent searching to\
    \ find a mistake in a sheet that somebody else introduced. You’re tired of having\
    \ to explain to colleagues how the sheets actually work, and you suspect they’re\
    \ not listening in order to avoid being burdened with maintaining them. In a world\
    \ where AI is popping up everywhere, your current Excel solution may require just\
    \ a bit too much human intervention.\n\nThis book suggests a better way by building\
    \ on your existing knowledge of Excel.\n\n# Who this book is for\n\nWhile there\
    \ are a billion people who will benefit from reading this book, it is written\
    \ with three key groups in mind:\n\n+   - Excel Power users who have reached the\
    \ limit of Microsoft Office 365 and are wondering what’s next, especially as AI\
    \ tools are becoming more and more powerful.\n+   - Business analysts and knowledge\
    \ workers looking for a tool to capture their knowledge and deploy it as part\
    \ of enterprise-grade systems.\n+   - People who are joining an existing rules,\
    \ AI, or workflow project using decision models, as many of the tools will already\
    \ be set up; they will find the introduction to DMN and FEEL particularly useful."
