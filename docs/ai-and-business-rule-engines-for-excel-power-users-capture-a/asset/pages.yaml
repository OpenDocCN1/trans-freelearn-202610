- pgno: 239
  md: '# Conversion functions


    You''ll notice our example uses a string() function to convert both the current
    date into a string and Some Input passed into a string – FEEL doesn''t convert
    values automatically in the way Excel does.


    There are equivalent functions for converting into numbers and dates, with more
    information on how to use them in the FEEL reference guide.


    While the items in this list are generated dynamically, it will always have the
    same four items in the same order. We can do something more, well, dynamic with
    lists. Take a look at Figure 9.2, also downloadable as 09 Step by Step Context.dmn.


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_239_0.png)


    Figure 9.2 – A more dynamic list


    The decision model for this sample is again simple – an input node feeding into
    the decision node – so we haven''t shown it. We do edit the properties of the
    Some Input node to specify that only numbers are allowed, which means we don''t
    have to convert in our functions. If you are trying to create this example yourself,
    it is worth noting that each of the boxes in the right-hand column of the table
    is a literal expression, and that the names should be consistent. For example
    the name Some Input has a space in it, so all expressions referring to it should
    also have that space.'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'We set the decision node to the Context type. While we’ll see another way to
    use contexts later in this chapter, this example allows us to specify step-by-step
    instructions, manipulating the list(s) at each step. Each step is a literal expression:


    +   1. We create `BaseList` using the FEEL syntax rather than a graphical format
    – `[30,10,20]`.

    +   2. We create another list, `AddedList`, combining `BaseList` with the number
    we passed in as **Some Input**.

    +   3. We create a third list, `SortedList`, and sort our list in it. Note how
    the `sort()` function takes named parameters and allows us to specify how we want
    to sort, which makes it very powerful.

    +   4. Our final line specifies the value we want to return, (`SortedList`). Changing
    this value will allow us to view the other lists we’ve created. Clearing this
    cell (right-click to get the menu option to do this) will return all three lists
    we have created.


    In the example shown in *Figure 9.2*, we pass in a value of 25, which gets added
    to the list and sorted, giving an output list of `[10,20,25,30]`. Note the syntax
    using the square brackets and commas, which allows you to write a list expression
    in a very compact form.


    # More on manipulating lists using FEEL expressions


    Now that you’ve seen the basics of lists and their syntax, the rest of the functions
    should make a lot more sense. We’ll do a quick run-through – most likely, you
    just need to know that these functions exist. When you need to use them in detail,
    you can then find out the exact parameters using the FEEL guide we mentioned earlier:


    +   - We’ve seen the `sort` and `append` functions in the example. `reverse` and
    `remove` are the opposite of these.

    +   - Max, Mean, Min, Sum, and Count work pretty much as you’d expect.

    +   - `distinct values()` removes duplicates from a list – for example, `distinct
    values(["One", "One", "Two"])` will return a shorter list with no duplicates,
    `["One", "Two"]`.

    +   - `index of()` returns where the item can be found in the list. For example,
    `index of(["One", "Two", "Three", "Four"], "Four")` will return the number 4.
    `contains` is similar but returns `true` or `false` depending on whether the list
    contains the value or not.


    Lists can also contain lists – while this is a simple concept, any example we
    could give would get complicated very quickly! We’ll just mention that `flatten()`
    will combine all the sublists into one big list. `concatenate()` is similar but
    gives you slightly more control over the order of the list that is created. `sublist()`
    allows you to chop up this list into shorter lists again.'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'One item that you may have picked up from our example in *Chapter 4* is that
    our custom data types can contain lists. Our `Customer` data type contained a
    list of previous orders. Just to show you the power of lists, the opposite is
    also true – we could have a list of customers, with each customer being represented
    by the `Customer` custom type.


    # Lambda functions


    One powerful feature recently added to Excel is **Lambda functions**. Basically,
    these are functions that we can pass around, not unlike the way we do with a variable
    or cell reference.


    Similar functions already exist in FEEL expressions. We saw an example of a Lambda
    function in *Figure 9.2* – the `sort()` command took a named parameter, `precedes`,
    which was defined as `function(x,y) x<y`. While the sort order we defined in this
    case, was simple, it does show how much we could customize the sort algorithm.


    There are three other list functions that operate in a similar way – remember
    that these are applied to the list as a whole. For the following examples, we’ll
    create `mylist`, a list of numbers – `[1,2,3,4,5]`:


    +   - `for i in mylist return i * 2` will return `[2,4,6,8,10]`

    +   - `some i in mylist satisfies i > 4` will return true as there is one value
    of 5 meeting the condition

    +   - `every i in mylist satisfies i > 4` will return false since only one (and
    not all) of the list elements meet the condition


    Lists are a basic building block of the FEEL expression language and many of the
    functions associated with relations and contexts will return a list. We’ll look
    at those soon, but first, we’ll take a look at ranges, which appear similar to
    lists, even if they address a slightly different problem.


    # Ranges instead of sequential lists


    In our previous example, we could have defined our list as `[1..5]` – that will
    still contain the same 5 numbers and is slightly shorter to type. This range syntax
    is shorter for longer number sequences such as `[1..100]`.


    Despite the similarity in syntax, ranges cannot always be dropped in to replace
    lists. In practice, you will use ranges in a different way – more like Venn diagrams,
    where you are interested in the overlap between ranges. For example, `overlaps(
    [1..5], [3..8] )` returns true as both ranges have 3, 4, and 5 in common.


    There are several related functions to test whether a range is before (`before()`)
    or after (`after()`) another, whether one range completely includes (`includes()`)
    another, or whether the start of one range matches the start or end of another
    range.'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'When reading range examples, pay attention to the two different types of brackets.
    (1 .. 10) is equivalent to [2 .. 9] – the rounded bracket syntax excludes the
    given number from the range, while the square bracket includes them. Both ranges
    contain 2, 3, 4, 5, 6, 7, 8, and 9.


    Ranges and lists are good but can contain values without meaning. Let’s look at
    relations and contexts, which address this issue.


    # Relations – tables of information


    Take a look at the relation in Figure 9.3, which we’ll build into the Bill of
    Materials example in the Graphical contexts section later in this chapter.


    # Product Details (Relation)


    | # | Name (string) | Weight (number) | Grams of Cocoa (number) | Grams of Sugar
    (number) | Grams Milk (number) |

    |---|---|---|---|---|---|

    | 1 | "Silk Tray" | 400 | 150 | 150 | 90 |

    | 2 | "Crunch" | 75 | 10 | 60 | 5 |


    Figure 9.3 – Relation showing the ingredients for our different products


    Even without us explaining, you can guess that this table of values shows the
    ingredients that go into our products. It is much more expressive and structured
    than a simple list.


    Building this relation in the KIE sandbox is simple – we create a decision node
    of the Relation type, then add as many rows and columns as needed. It’s also helpful
    to set the data type of each column. When creating this table, we set each box
    as a literal value – any FEEL expression is valid (not just the static values
    shown here). And while we kept this example simple, it is possible to nest other
    expressions within the boxed expressions (for example, to return a list of allergens
    contained in each product).


    This relation table is downloadable as part of the 09 Bill of Materials.dmn example
    at the book’s sample site.


    Now that we have our values defined as a relation table, how do we refer to them?
    The syntax is straightforward, and the following FEEL expressions refer to the
    table in Figure 9.3:


    +   - Product Details.Name returns a list, with the values from the Name column,
    [Silk Tray, Crunch].'
  merge: -1
  img_proc: true
- pgno: 243
  md: '+   - `Product Details[1]` returns the first row of the table as a **context**
    (more on that in the next section) – a set of key-value pairs, for example, `{Name
    : "Silk Tray", Weight : 400, Grams of Cocoa: 150 }`.

    +   - `Product [Name = "Crunch"] .Weight` gives the value of a single box in the
    table – in this case, 75.

    +   - `Product .Weight [2]` is an alternative syntax using line numbers. In this
    case, it also refers to the weight of the Crunch bar (so it returns the same value
    – 75).

    +   - `Product [Weight>25] .Name` is an example of **filtering** – a more sophisticated
    selection that will return a list of ["Silk Tray", "Crunch"] since both have weights
    greater than this.


    # Two common data patterns


    It is likely that this data on products will be used across many different decision
    models. A common pattern is to define the relation table once, then include it
    in the models that need it – more on that in the *Linking decision models* section.


    Another common data pattern is to read these values from an external database
    or Excel file. Our `Invocation` node can also read pretty much any data source.
    But because it uses Java code to do so, it is outside the scope of this book.
    More details are available in the KIE documentation at https://docs.kogito.kie.org/latest/html_single/#_kie_extended_functions.


    Relations are ideal for largely static data that doesn’t change very often. If
    we want a simple table-like layout, but with the dynamic nature of lists, we need
    to look at **contexts**.


    # Dynamic contexts


    We’ve already seen that our `Product Details[1]` expression in the previous line
    returned a context – in that case, a line from the table of `{Name : "Silk Tray",
    Weight : 400, Grams of Cocoa: 150 }`. Note the syntax we can use to create contexts
    in FEEL expressions:


    +   - Curly brackets to open and close

    +   - Commas to separate out items

    +   - Contents are a set of `key:value` pairs


    If you’ve programmed before, you may have come across contexts under the name
    of *map* or *dictionary* – both are maybe more descriptive suggesting that once
    we know the key, we can use it to look up the value associated with it.


    For example, if we stored the preceding context in the `myContext` variable, the
    `get value( myContext, "Weight" )` expression would return a value of 400.'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'What makes contexts more powerful is that it is easy to add values. For example,
    `context put (myContext, "Raising Agent", 1)` would add that item to our ingredient
    list.


    While the full list of context functions is well documented in the FEEL handbook,
    it is worth highlighting `context.merge()`, which allows us to combine contexts,
    and `context.get entries ()`, which returns a list of all the values in context.


    There are several other graphical ways of creating contexts that are worth exploring.


    # Graphical contexts


    Graphical contexts allow us to define contexts in a more visual format, which
    is useful for less experienced colleagues to understand what our models do. Remember
    we came across the other use of contexts in Figure 9.2. In that example, we used
    a FEEL expression context to generate values step by step, with a `result` statement
    to pass back only the final value.


    If we delete or clear that final `result` statement, all of the generated values
    will be returned as a set of `key:value` pairs. We’ll demonstrate this with an
    example that we’ll build out in the rest of this chapter – the Bill of Materials
    decision model. This is shown in Figure 9.4 and can be downloaded as `09 Bill
    of Materials.dmn` from the book’s GitHub repository.


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_244_0.png)


    Figure 9.4 – Our Bill of Materials decision service


    This decision model has two inputs: `Qty` (Number) and `Product` (String). The
    third node, `Product Details`, we saw earlier – it’s a decision node of the `Relation`
    type, holding information on the ingredients for each product.'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'All three of these feed into a decision node of the Context type, which is
    shown in detail in Figure 9.5.


    # Bill of Materials (Context)


    | # | Bill of Materials (Any) |

    | 1 | Name (string) | Product |

    | 2 | Grams of Cocoa in Product (number) | Product Details[Name = Product].Grams
    of Cocoa |

    | 3 | Grams of Cocoa in Order (number) | Qty*Grams of Cocoa in Product |

    |  | <result> | Select expression |


    Figure 9.5 – A graphical context


    Creating this context is similar to before – we added multiple lines with a key
    of the first column, and a literal expression to give the value. Like before,
    each line can build on the previous one – so we specify the product names, then
    use the product name to look up the value in the relation or table containing
    all the product details. Finally, we multiply the quantity (that we input) by
    the grams of cocoa needed to calculate the amount of cocoa we’re going to need
    to manufacture this order.


    Note that no result is specified – so when this is run, all the values will get
    returned, not just a single result. The result will be in key-value pairs – Name
    : Some-product-name.


    We can prove this by running this model in the KIE sandbox, where we’ll get the
    result as in Figure 9.6:


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_245_0.png)


    Figure 9.6 – Output from our context'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'Here, we have input a quantity of Silk Tray – this is quite a heavy product,
    with a lot of chocolate in it so it’s not surprising that it will take 18.75 kg
    of cocoa to manufacture it in total. The KIE sandbox displays the context in a
    clear key:value format – compare this to our list in Figure 9.1, which has a similar
    format but has numbers instead of keys beside each of the values.


    # More reading on FEEL functions


    This may be a surprise for a book that focuses on KIE from Red Hat and IBM – but
    I would also suggest looking at the FEEL guides from other vendors such as Oracle,
    Trisotech, and Camunda.


    Since FEEL is a standard, most of what they say is applicable to KIE – and each
    explains the concepts from a slightly different angle. It’s a good way of helping
    you if you get stuck in any area.


    This section focused on highlighting the difference between FEEL and Excel functions,
    walking through some areas that Excel users might find tricky to understand. The
    best way of learning is to dive in and try to model some decisions that apply
    to your organization.


    Before we leave functions, we’ll look at another expression language – Power FX.


    # Using Power FX expressions in decision models


    **Power FX** is a low-code expression language from Microsoft that is not too
    far from what FEEL tries to achieve. Roughly speaking, if you could take the formula
    you were already using in Excel, and remove the references to cells so that they
    were no longer tied to a spreadsheet, you would end up with something close to
    the Power FX language. This means that you can use Power FX in Power Apps to build
    mobile applications and, increasingly, the syntax will feature in Power Automate
    and other Microsoft platforms. More details on the language are at https://learn.microsoft.com/en-us/power-platform/power-fx/overview.


    Power FX goes further than FEEL – whereas FEEL is written to have no side effects,
    Power FX is quite happy to have an impact (for example, to update a cell value
    or to change the color of a range). Power FX also integrates with a wider range
    of systems than FEEL, which is focused on decision models.


    Using Power FX expressions is currently an experimental feature in KIE – as described
    by the team in the following post: https://blog.kie.org/2022/03/using-javascript-and-power-fx-with-dmn.html.


    So far in this chapter, we’ve focused on expression languages that we can use
    in our models. Let’s take a wider look at some more advanced features for designing
    and building our decision models.


    # More on building and editing decision models


    In previous chapters, we looked at building decision models and extended this
    knowledge by exploring the FEEL expression language. This section is going to
    extend our knowledge of decision models by looking at best practices.'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'Before we get into more heavyweight decision models, it’s worth looking at
    the keyboard shortcuts available to you in the KIE Sandbox editor – we’re highlighting
    the most useful ones in the table:


    | Key | What it does |

    |---|---|

    | *Esc* | Unselect the current selection |

    | *Delete/backspace* | Delete the current selection |

    | *Ctrl + C* | Copy |

    | *Ctrl + V* | Paste |

    | *Ctrl + X* | Cut |

    | *Ctrl + Z* | Undo the last edit |

    | *Shift + Ctrl Z* | Redo the last edit |

    | *Shift + Up arrow (or another arrow)* | Slowly move the selection up (or in
    another direction) |

    | *Ctrl + Up arrow (or another arrow)* | Quickly move the selection up (or in
    another direction) |

    | *Alt (hold) and drag the mouse* | Pan |

    | *Ctrl (hold) and drag the mouse* | Zoom |

    | *Shift + /* | Show the full list of keyboard shortcuts |


    Table 9.1 – Keyboard shortcuts in the KIE sandbox


    As well as these keyboard shortcuts, there are several other editing approaches
    that are useful to know:


    +   - While the KIE Sandbox editor is very good, sometimes it does get out of
    sync (especially if your laptop hibernates). Refreshing the web page (and trusting
    that the model is saved to local browser storage) will resolve many issues.

    +   - Working in the sandbox in the browser is great, but it can be confusing
    to switch between tabs for editing and tabs for reading documentation. Having
    a second browser installed on your PC and having one for each purpose is a simple
    trick to reduce confusion.

    +   - It’s trivial compared to other advice, but it is possible to bend the arrows
    in the diagram to make your diagrams neater and easier for other people to understand.

    +   - The DMN standards treat both the graphical and XML versions of the decision
    model equally. It is possible to edit the XML of the model directly (for example,
    using the VS Code editor, which we’ll introduce later in the chapter). While this
    is very powerful (for example, to copy-paste across decision models), it’s very
    easy to break things. So, make sure you have saved a backup copy (to GitHub) first.


    While we’ve focused up to now on the elements of the decision models, let’s talk
    about stylish decision models – using common patterns to make it easier for users
    to understand your model.'
  merge: -1
