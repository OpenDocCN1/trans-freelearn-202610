- pgno: 231
  md: "The new option allows you to replay the form submission you just made – not\
    \ only does it save you time but it also guarantees that you will be testing with\
    \ the same values on each run.\n\nBefore we leave flow in this chapter, it's worth\
    \ noting the **Flow runs** page, which allows you to see the results of each Power\
    \ Automate step. It also gives you an idea of how long each step should take to\
    \ complete. If your flow stalls for several seconds on `Http Request`, it is likely\
    \ that the `url` value is out of date and you may need to refresh the values.\n\
    \n# Suggestions to expand this example\n\nOur examples were very clear, but if\
    \ you've decided to add the other values from our form into the decision service\
    \ call, you'll notice that the example gets tedious very quickly – creating multiple\
    \ variables that you only use once, and multiple find/replace steps.\n\nYou're\
    \ likely to evolve these steps further in your own flows – and it may be worth\
    \ considering the following approaches:\n\n+   - Combine some steps. For example,\
    \ use the form value directly in the replace function, without creating a variable\
    \ first.\n+   - Use the `concat` expression to build our JSON payload all in one\
    \ go – with all the variables and the fragments of the JSON expression in one\
    \ line.\n+   - Use an external script (such as **JavaScript** or **Office Scripts**)\
    \ to build our JSON payload.\n+   - Calculate the JSON as an expression in Excel,\
    \ then read the value back before passing the JSON to the decision service. This\
    \ has the advantage of being the easiest to review and update.\n\n> **Why don’t\
    \ we call the decision service in a flow via Office Scripts?**\n> We just mentioned\
    \ that Power Automate flows can call Office Scripts. So why not use the techniques\
    \ from *Chapter 7* to call our decision service via those scripts?\n> \n> The\
    \ reason is that the security model restricts what scripts can do in a flow. This\
    \ doesn’t stop us from using Office scripts to manipulate data (e.g., to create\
    \ the payload). But the only way to make an external call is via the HTTP action,\
    \ as we used in our examples.\n\nIn our flow, we send the same email message,\
    \ relying on the message coming back from the decision service to highlight any\
    \ health warnings. In reality, you would probably add a test to your flow and\
    \ a branching action to send a different email depending on the product recommendation\
    \ result.\n\nWe won’t cover these techniques in detail, but you can explore them\
    \ to build on the key steps that we’ve shown in this chapter. If you are looking\
    \ to explore Power Automate, this book by Packt author *Aaron Guillemette* is\
    \ a good place to start: https://www.packtpub.com/product/workflow-automation-with-microsoft-power-automate/"
  merge: -1
  img_proc: true
- pgno: 232
  md: '# Other workflows – Kogito Business Automation and Power Automate Desktop


    This chapter focused on Power Automate for a reason, since it is the most (Power)
    user-friendly workflow tool. But there are two other workflow tools you are likely
    to encounter – Power Automate Desktop and the workflow that comes with Kogito
    Business Automation.


    # Power Automate Desktop


    You (briefly) saw the Desktop version of Power Automate, as it was an option when
    we were creating a new cloud flow in Figure 8.3. If you created a desktop flow,
    you would have been prompted to install the desktop tool (although it comes pre-installed
    in Windows 11; consult the Power Automate Desktop documentation for more details).
    You would have been presented with an opening screen as in Figure 8.32:


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_232_0.png)


    Figure 8.32 -- Power Automate Desktop


    Many of the concepts for using Power Automate Desktop are similar to using the
    cloud version. Power Automate Desktop also has an HTTP connector, which is available
    to all users without any premium restrictions. While that gives you additional
    options to link your flows to the decision service, it does come with a few trade-offs:


    +   - The actions in Desktop flows are very wide-ranging – pretty much anything
    that is possible using your laptop can be carried out from a Desktop flow.

    +   - Desktop flows only run when the user is logged in (even if the machine is
    locked). Cloud flows run (and can be triggered) all the time.'
  merge: -1
  img_proc: true
- pgno: 233
  md: '+   - Desktop flows essentially run as a sub-flow of cloud flows. They can
    be triggered manually for testing.

    +   - Linking cloud and Desktop flows is a premium feature not available to all
    users, which may limit how you can use it day to day.


    It is well worth exploring Power Automate Desktop to see how you might use it
    in your day-to-day work. But we’ll finish the chapter with a quick a look a workflow
    that you’re unlikely to use just yet – the Kogito business automation.


    # A quick look at Kogito business automation


    Way back in Chapter 3, we glimpsed the option to create a workflow in Figure 3.1.
    At the time, we focused on creating a decision service, but it might be worth
    going back to that screen and creating the sample workflow, as in Figure 8.33:


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_233_0.png)


    Figure 8.33 – Kogito business automation sample


    Since this workflow example is graphical, it is very easy to follow that it is
    dealing with business traveler reservations. Even better, since it is part of
    Kogito, the Process Traveler step integrates business rules seamlessly into the
    workflow. As you’d expect, the Kogito tooling follows industry standards – so
    you can use Kogito to develop process services using BPMN.'
  merge: -1
  img_proc: true
- pgno: 234
  md: 'However, while a Kogito workflow is business user-friendly, the tooling is
    not (yet) as standalone as the business rules and decision services. For example,
    there are more limited options to execute a Kogito workflow process in the KIE
    sandbox.


    There are many situations where we would recommend using Kogito workflow business
    automation (for example, if you''re a Java developer, or you''re working with
    a team who have the skills to support it). But as an Excel Power user looking
    for a tool that is highly integrated into Microsoft Office, Power Automate is
    likely to be a better choice for beginners.


    # Summary


    We set expectations at the start of the chapter for how, although we would introduce
    Power Automate, we would focus on how to link Excel into decision services as
    part of a complete end-to-end flow.


    What we covered in this chapter was workflows, and why we use Power Automate as
    the workflow tool for this book. We then moved on to how to call business rules
    and decision services from Power Automate. Finally, we built our full customer
    services flow in Power Automate, and looked at other workflow tools such as Power
    Automate Desktop and Kogito business automation.


    This chapter was the third (out of three) covering the Microsoft tools to link
    Excel to our decision service – not just using Power Automate, but other options
    such as Power Query, VBA, and Script Lab/Office Scripts. Given the power of all
    these tools, they are well worth exploring further.


    Now that we have linked Excel to our decision service, our attention in the next
    chapters focuses on doing more with it. We start by exploring the FEEL expression
    language to write more powerful rules and using testing to make sure the rules
    actually do what we want them to.'
  merge: -1
