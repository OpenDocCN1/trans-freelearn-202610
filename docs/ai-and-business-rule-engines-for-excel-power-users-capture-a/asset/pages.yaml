- pgno: 284
  md: '> Unlike Excel, KIE is an open source project, so you have the option of building
    a server to meet your exact needs. While this is an advanced technical topic,
    the instructions in *Appendix B* come very close to doing this. You may find if
    you run the samples that come with the project that you’ve accidentally built
    the equivalent of the KIE Extended Services.


    Running the KIE Extended Services in Docker is a useful demo, but useful only
    in limited circumstances as it’s intended to support local deployment only. Let’s
    move on to a more heavyweight example – running the full KIE Server in Docker.


    # Running the KIE Server in Docker


    Why do we want our own full KIE Server, if we’ve already got several good options
    for running rules? For the following reasons:


    +   - Business Central needs a separate server to deploy the rules into. It doesn’t
    have the easy deployment to OpenShift that is built into KIE Sandbox.

    +   - Your IT department may prefer to have your core business rules running on
    a server on site, not in the cloud (and certainly not on your laptop!).

    +   - Finally, you may have convinced your colleagues to buy into the rules-based
    approach to AI. At that point, the KIE Server becomes a repository of much of
    your business knowledge, with many systems calling on it to make key decisions.
    You will want more control over where this repository is stored.


    Fortunately, **Docker Compose** gives us a way to run multiple Docker images including
    the KIE Server.


    # Running Business Central and the KIE Server – Docker Compose


    **Docker Compose** is a tool that was automatically installed when you installed
    Docker Desktop. It allows us to start and stop multiple Docker containers at once,
    with all the settings that we need.


    Docker Compose is in some ways easier than running Docker, since all the tricky
    bits such as image names and port numbers are contained in a downloadable config
    file. The settings are stored in a structured text file that is meant to be easily
    read by humans (*YAML* format).


    We have prepared a Docker Compose file that details how Docker can download and
    run both Business Central and KIE Server images. If you’re looking for more detailed
    information, it is based on the instructions from the KIE team at https://quay.io/repository/kiegroup/kie-server-showcase.
    Let’s work through it:


    +   1. Download the `docker-compose.yaml` file from the book’s GitHub site at
    https://github.com/PacktPublishing/AI-and-Business-Rules-for-Excel-Power-Users.
    Opening it in any text editor will allow you to view it, as shown in Figure 10.24:'
  merge: -1
  img_proc: true
