- pgno: 323
  md: 'You might be tempted to dive in and start tweaking the weights to see whether
    you can make the model predict better results. But rather than tweaking this model,
    let''s show you a better way of doing this using a tool that you met in Chapter
    4.


    # Decision trees and decision tables


    Back in Chapter 4, we met decision tables as the key format for capturing business
    rules. If we take a look at the tree in Figure 12.2, we can imagine how we could
    write these rules. Since our tree has 25 nodes, we''re likely to have 25+ nodes
    – we''re only showing the first 3 here:


    | U | Customer Age | Country Code | Recommended Product |

    |---|---|---|---|

    | 1 | >20 | <100 | Peanut Candy |

    | 2 | >50 | >=100 and <400 | Silk Tray |

    | 3 | >50 | >=400 | Lumpy Bar |

    | ... |  |  |  |


    Table 12.1 – Decision table generated from the decision tree


    Remember that the first two columns (Customer Age and Country Code) are our inputs
    and the final column is the product we recommend.


    You''ll also notice that we''ve set the Table HIT Policy to U or unique. Decision
    trees branch until they come to a single, final, recommendation node. So, a decision
    table equivalent of a tree can only ever match one line or rule against a value.
    The KIE sandbox is smart enough to inspect the table and warn you if the rules
    overlap (if two rules would be triggered by the same value), but only if you set
    the HIT policy to unique.


    Even better, KIE gives you a tool (kie-dmn-ruleset2dmn) to automatically translate
    between the decision tree and table. The KIE documentation and blog cover how
    to use that tool in detail if you want to investigate further.


    More importantly, what we have learned in this section is as follows:


    +   - Machine learning doesn''t always have to be a black box – there are algorithms
    such as decision trees that can explain how a decision is made. This algorithm
    can effectively auto-discover the business rules in our data.

    +   - Whether we translate the tree into rules manually or via the rules2dmn tool,
    we can move our algorithm into a human-readable decision table format where we
    can edit as needed.


    We''ll come back in the section after the next to look at explainability in AI,
    and why it is so important. But right now, we have a dilemma – we might be forced
    to choose an algorithm (decision trees) that performs worse than an alternative
    (in this case, Naïve Bayes), purely because it can explain what it is doing.'
  merge: -1
  img_proc: true
- pgno: 324
  md: 'Let’s make that dilemma worse by introducing neural networks in the next section.
    They are even more powerful, but it’s even less clear how they make decisions.


    > **Spoiler alert – we solve this problem in the section after next**

    > In the *Ethics and explainability in decision making – how KIE helps* section,
    we solve this dilemma of how to choose the most powerful algorithm and still get
