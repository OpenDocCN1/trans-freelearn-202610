    \ notice in the metadata that the script type is listed as TypeScript. This can\
    \ do everything JavaScript can do, and more. While it’s slightly stricter, it’s\
    \ a good habit to use TypeScript as it allows the editor to make more useful suggestions\
    \ as you write your scripts.\n\n# Hello World in Script Lab\n\nAt first glance,\
