  md: 'Play around with it; you’ll see the inputs and outputs work as expected, but
    you won’t be able to view the model you’re using to generate these decisions.
    You wouldn’t want end users to change how you’re making your business rules.


    No doubt you’re proud of this achievement, so go ahead and share it with colleagues.
    Unlike the sandbox, they can access this page using the same URL as you used.
    They’ll be able to play with this decision model and marvel at you taking your
    first steps into business rules and AI.


    Before we get carried away, we do need to remember that we’re still using the
    Developer Sandbox, and that has certain limitations.


    # Important notes on the OpenShift Developer Sandbox


    The OpenShift Developer Sandbox is great because it is free (you can try before
    you buy) yet has most of the substantial features of the full-featured cloud offering.
    However, you need to remember a couple of limitations of the free version:


    +   - Tokens need to be renewed daily. This means you need to (re)link OpenShift
    and KIE Sandbox using the instructions in the previous section. It’s not onerous,
    but you need to remember to do it, or the sandbox will give you an error.

    +   - The Developer Sandbox needs to be renewed every 30 days, and prior to this
    renewal, everything within OpenShift data will be deleted. This isn’t a problem
    since you will always have a local copy of your decision model, and you shouldn’t
    be storing any data in your models in the sandbox.

    +   - By default, any model you deploy to OpenShift is public access. This is
    great for sharing the link with colleagues for them to test out, but you may want
    to investigate the security and access restrictions in OpenShift to limit who
    can see your models.


    A final point to remember is that if you leave your OpenShift sandbox running,
    it will be deactivated after 8 hours. You will get an email like this:


    ```

    In accordance with the usage terms of Developer Sandbox, we have

    reduced the number of instances of your application to zero (0). You

    can restart your application(s) by increasing the number of instances

    from the Developer Sandbox User Interface.

    ```


    There are a number of different ways to restart your application. Perhaps the
    quickest is to do the following:


    +   1. Open the OpenShift web console.

    +   2. At the top right of the screen, there will a set of icons like in *Figure
    5.15*:


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_136_0.png)


    Figure 5.15 — Command prompt icon in OpenShift'
  merge: -1
  img_proc: true
- pgno: 137
  md: '+   3. Click on >_. This will cause your application to restart; it will also
    open a panel at the bottom of the screen that looks like a terminal, but that’s
    a side effect and we don’t need to type anything into it.


    All of these restrictions won’t cause an issue during development, but if you
    do intend to deploy your decision models for real-life business use, it is much
    better to migrate to the paid-for tier.


    > **Remember the online resources**

    > The KIE Sandbox and Red Hat teams have put a lot of effort into the online resources
    we mentioned in *Chapter 2*. Now is a good time to go look at those again. There
    is a particularly good video on linking KIE Sandbox with OpenShift at https://youtu.be/2zY85TXFNuw
    (or search the KIE YouTube channel for *DMN Dev Sandbox Developing and deploying
    DMN decisions in the cloud*).


    Since we’ve made an important step into deploying our models outside of our own
    laptops, it’s probably a good time to have a conversation about how to treat data.


    # Taking care of your data


    We’re glad about the trend of legislation toward increased data privacy. As professionals
    who work with data, we have been known to curse the regulations sometimes, but
    in many ways, it’s just ensuring what we hope you would seek to do anyway: *be
    respectful when working with personal data.*


    Personal data is anything that could identify a person—a phone number associated
    with a name, an email (since that will often always include the first name or
    last name), or an address. For example, if we’re talking about a male, under 21,
    living at 59 Bolton Square, it may be obvious who the person we’re talking about
    is.


    Even if you don’t live in Europe, you’ve probably felt the impact of the EU’s
    **General Data Protection Regulation (GDPR)**. For example, if you’re US-based,
    and you’re dealing with a client that lives in the EU, the regulation still gives
    that client protection, with the thread of eye-watering fines to back it up. There
    are many other local equivalents (California in the US being the most notable).


    The regulations are pretty well written and it’s easier to start following them
    from day 1. Up to now, many of your decisions and personal data have been kept
    internal to your company (in an Excel sheet). The GDPR and data protection regulations
    still apply, but you’ll notice that we’ve started passing data to external services
    (just now IBM/Red Hat, and shortly Microsoft). This makes the topic of the GDPR
    even more important.


    The good news is that the approach that this book suggests is likely to make you
    more GDPR-compliant:


    +   - We talked in the last chapter about not using specific personal information
    in business rules. Since we should only pass in the information that we need to
    make a decision, it is far less likely that our system will be impacted by the
    GDPR.'
  merge: -1
  img_proc: true
- pgno: 138
  md: '+   - IBM and Red Hat have spent a lot of time on security and customer confidentiality
    and ensuring they are GDPR-compliant. These vendors stake their reputations on
    keeping data secure to a level that not every smaller company (including yours)
    will be able to achieve.

    +   - This book advocates more formal techniques for managing your data and making
    decisions. We’re on a journey from having Excel spreadsheets scattered around
    the organization (a data management nightmare) to storing and processing them
    in a coherent manner. This approach also makes GDPR compliance easier.


    Starting with good habits in managing data will make your life a lot easier later.
    Another good habit that you will be glad about later is to back up and version
    control your decision models. Let’s look at the built-in integration that KIE
    Sandbox has with GitHub to allow us to do this.


    # Saving and sharing your decision models using GitHub


    You probably haven’t thought about it too much (other than the **Ephemeral** message
    in KIE Sandbox), but you’re currently saving decision models in local storage
    associated with your web browser. While this is great for getting started, it
    isn’t something we’d recommend for long-term use. What if your laptop gets lost—do
    you have a backup? How can you share decision models with a colleague? What if
    you realize you made a mistake and want to revert to the version you had 5 minutes
    ago? Local storage doesn’t easily let you do any of these things.


    Luckily, the KIE Sandbox has a link to the best collaboration site available:
    GitHub. You may remember GitHub from *Chapter 2* when we introduced the KIE and
    Drools projects, allowing many hundreds of developers to collaborate, share files,
    and navigate through different versions of their work.


    GitHub has a private repository option that you can use for your own project and
    restrict to just the people that you want to collaborate with. It’s important
    to note that your repository is your space—it’s not linked to any Red Hat projects
    hosted on the same site, but it does mean we need to set up our own space and
    link it to KIE Sandbox. Let’s walk through that now.


    # Signing up for GitHub and getting your token


    To use GitHub, you need to sign up for an account. The site is owned by Microsoft,
    and logins from their other sites aren’t (yet) usable. To get your GitHub login,
    do the following:


    +   1. Go to the GitHub home screen at `www.github.com`.

    +   2. You’ll see a welcome page with a large **Sign up for GitHub** button.

    +   3. Clicking this button will take you to the account sign-up screen in *Figure
    5.16*:'
