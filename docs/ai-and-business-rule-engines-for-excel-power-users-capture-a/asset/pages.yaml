  md: "# A decision service combining rules and ML\n\nLet’s start by showing you the\
    \ decision model that we’re going to build, combining the best of rules and ML\
    \ in one decision service, as shown in Figure 11.18:\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_312_0.png)\n\
    \nFigure 11.18 – A decision service combining AI rules and Machine Learning\n\n\
    You may recognize this as being based on the product recommendation service that\
    \ we built in Chapter 4. There are two key differences that we will look at in\
    \ more detail shortly:\n\n+   - We import a **RecommendedProductPMML** external\
    \ model, using exactly the same technique for importing models that we used in\
    \ Chapter 9. This model is the PMML model that we just trained using Azure ML.\n\
    +   - We’ve updated the **RecommendedProduct** node so that it makes its recommendations\
    \ based on the external ML model (previously, we used a decision table).\n\nWhat\
    \ hasn’t changed is the two-step nature of our decision-making. We first recommend\
    \ a product, and then we do a second rules-based check to make sure we’re not\
    \ recommending a product that might cause health issues (for example, a peanut\
