- pgno: 365
  md: '# Appendix C


    # Troubleshooting Docker


    While this is a book mainly about KIE and not Docker, we did want to give enough
    detail to get things up and running. The topics in *Chapter 10* and this appendix
    are straightforward but are at the edge of what we would reasonably expect an
    Excel power user to know. Using Docker gives us a gateway to running Business
    Central and deploying it into the cloud – both areas that will take a team, not
    just an individual, to build. So don’t be afraid to ask colleagues for help!


    In an ideal scenario, you will not need to read this appendix, since it contains
    suggestions on how to fix things if something goes wrong in starting Docker. We
    have written these instructions with an Excel power user in mind – so if you are
    an experienced Docker developer, you may wish to go directly to the Docker guides
    to start your troubleshooting.


    There are three main sections in this appendix:


    +   - Preparing your laptop to use Docker

    +   - Troubleshooting error messages when you try to run Docker

    +   - More help on Docker


    Like in the other appendices, we will move faster than the main chapters of the
    book, and we assume a willingness to search on your own for additional information
    as needed. We can’t cover every possible error but we will try to address most
    of the common ones.


    As a final suggestion to get images working – remember that tools such as *Podman*
    provide a drop-in replacement for Docker. While we haven’t cover them in this
    book, it might be an alternative if all other attempts have failed.


    # Preparing your laptop for Docker


    There are also some simple steps you may need to take to prepare your computer
    before installing Docker:


    +   - Behind the scenes, Docker will use one of two sophisticated technologies
    to run containers: Hyper-V or WSL.'
  merge: -1
  img_proc: true
- pgno: 366
  md: '+   - Hyper-V is a very clever technology that allows software running in containers
    (such as Docker) to run almost as fast as native applications. It''s a combination
    of hardware and **operating system (OS)** support.

    +   - **Windows Subsystem for Linux (WSL)** allows you to run the full power of
    the Linux OS (and enterprise solutions that run on it) on your Windows laptop.
    If this sounds similar to what Docker gives you, you''d be correct. Both technologies
    use many of the same components, even if they are optimized for different things.

    +   - The approach Docker chooses will depend on the specification of your laptop.
    To keep things simple, the following instructions walk through how to switch between
    both.


    # Switching between Hyper-V and WSL


    To turn on Hyper-V and WSL on your laptop, do the following:


    +   1. Click on the Windows key icon.

    +   2. In the menu that appears, click on the settings icon to open settings.

    +   3. Right-click on the Windows button and select **Apps and Features**.

    +   4. Select **Programs and Features** on the right, under **Related settings**.

    +   5. Select **Turn Windows features on or off**.

    +   6. Check whether **Hyper-V**, **Virtual Machine Platform**, and **Windows
    Subsystem for Linux** are enabled (as shown in the screenshot); if not, check
    them and click **OK**.


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_366_0.png)


    Figure AC.1 – Turning on Hyper-V and WSL on your laptop'
  merge: -1
  img_proc: true
- pgno: 367
  md: '+   7. When the installation has been completed, you may be asked to restart
    your laptop.

    +   8. After your laptop has restarted, go back into **Settings** and ensure that
    these options are still selected.


    If you prefer, the official Microsoft guide to turning on Hyper-V is available
    at `https://docs.microsoft.com/en-us/virtualization/hyper-v-on-windows/quick-start/enable-hyper-v`.


    # Troubleshooting Docker – some obvious things


    Most people will not need this section of the book. But if you do need it, then
    you will be reassured that you’re not the only person to meet these common issues:


    +   - Check that your laptop meets the technical requirements (the type of laptop
    and version of Windows) for running Docker. These are listed at `https://docs.docker.com/desktop/windows/install/`.
    Docker will give you a clear error message if it doesn’t.

    +   - When installing software, you may have seen a popup similar to the following
    screenshot. It means that your computer is under the control of your IT team.
    This is mainly a good thing (as it stops malicious software), but it does mean
    you need their support to install Docker:


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_367_0.png)


    Figure AC.2 – An admin permission dialog


    +   - Windows Defender sometimes blocks network and internet access – we want
    to allow it as we need to be able to connect and run our samples.

    +   - Following a similar approach, check whether you have a connection to the
    internet (open a web browser) – connections can drop and cause strange errors.

    +   - If you have something break halfway through an install (for example, the
    connection dropping or you hit the wrong button), it can be worth uninstalling
    Docker and starting the install process again.'
  merge: -1
  img_proc: true
- pgno: 368
  md: '+   - Only half a joke, but have you tried turning your laptop off and on again?
    For some parts of the following instructions (for example, after switching on
    Hyper-V and WSL), restarting your laptop is required.

    +   - After installing Docker, it can sometimes take a couple of moments to start
    up. Check whether you have any container running or something worth pausing, and
    try the instructions again.

    +   - Remember we cover four different ways to run the samples in this book. You
    may run into an issue (such as your laptop is 32-bit and cannot support Docker
    or Hyper-V), for which there is no way around.


    # Troubleshooting Hyper-V and WSL


    If switching on Hyper-V and WSL worked for you – then feel free to skip this section.
    If not, you probably got an error message indicating whether the issue was related
    to Windows or hardware. Remember that you only need one of these to work to be
    able to run Docker.


    # Windows-related error messages


    Your version of Windows may not have support for Hyper-V. For example, it is not
    available in *Windows 10 Home*. You do have the option of taking advantage of
    the free upgrade to Windows 11 (including the insider preview), which appears
    to be more generous in allowing this feature. More information about updating
    to Windows 11 can be found here: `https://www.microsoft.com/en-gb/windows/windows-11`.


    It may be that you are *stuck* with Windows 10 Home and unwilling to pay for an
    upgrade to Windows 10 Pro. There are still workarounds if your hardware supports
    it, but you will need technical knowledge that you may need to request a friend
    or colleague to support. For example, the workaround at the following link explains
    how to use **VMware** (an alternative virtualization technology) to run Docker:
    `https://www.freecodecamp.org/news/how-to-run-docker-on-windows-10-home-edition/`.


    # Hardware-related error messages


    For hardware support, the good news is that most laptops sold in the last couple
    of years should support Hyper-V. And the better news is that strictly speaking,
    Docker doesn’t require it to run. So even if you are unable to enable Hyper-V,
    it is still worth checking whether Docker can be installed – but pay extra attention
    to the error messages.


    However, these hardware-related Hyper-V workarounds can become quite technical.
    We haven''t linked to these workarounds since they require in-depth technical
    knowledge – but know that they can be found on Google in the rare case that you
    need them and you are feeling technically confident enough to work through them.'
  merge: -1
  img_proc: true
- pgno: 369
  md: '# More help on Docker


    If you need more help, it’s worth looking at the Docker website (these links are
    for Windows, but there is equivalent detail for macOS and Linux): `https://docs.docker.com/desktop/windows/install/`
    and `https://docs.docker.com/desktop/windows/troubleshoot/`.


    If you don’t like the style of these guides, there are many other videos and *how-to*
    guides to walk you through the process:


    +   - `https://www.systemconf.com/2020/07/05/docker-installation-on-windows-10`

    +   - `https://www.geeksforgeeks.org/how-to-install-docker-on-macos/`

    +   - `https://www.digitalocean.com/community/tutorials/how-to-install-and-use-docker-on-ubuntu-20-04`


    There are also a lot of community forums to post questions and ask for help (both
    on Docker and third-party sites). And finally, if you don’t have colleagues to
    help you, there are many Docker experts that you can pay for support – Freelancer.com
    is a site I’ve used in the past, but there are many others out there.'
  merge: -1
