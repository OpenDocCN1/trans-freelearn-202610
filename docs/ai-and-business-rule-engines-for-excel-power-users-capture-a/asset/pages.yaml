    \ when the button is clicked (the link we set up in the previous line). The async\
    \ keyword means don’t wait for the function to complete – so Excel doesn’t freeze\
    \ while the function is running.\n+   3. The next line, starting with `await Excel.run(`\
    \ ..., is standard in Excel scripts. Basically, we pass the next couple of lines\
