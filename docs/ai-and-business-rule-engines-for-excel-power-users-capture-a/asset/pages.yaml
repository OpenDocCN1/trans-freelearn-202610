- pgno: 263
  md: '# 10

    Scaling Rules in Business Central with Docker and the Cloud


    In the previous chapter, we got our first glimpse of the **Scenario Simulation
    tool** as a device for testing complex decision models. The instructions we introduced
    in *Appendix B* might also have sparked your interest in exploring advanced techniques
    in VS Code. But since that technical approach isn''t for everybody, you could
    still be looking for another advanced way to test your models.


    Happily, **Business Central** provides the same Scenario Simulation tool in a
    more user-friendly package. This chapter shows you how to set up the Business
    Central editor and explores some of the additional rule editing techniques that
    it provides. In particular, we look at it as an enterprise-level collaboration
    tool for sharing and editing decision models.


    Since we are going to use **Docker containers** to run Business Central, we will
    also solve another problem we encountered in *Chapter 5*. While we already know
    how to host our decision models locally (on our laptop) or in the cloud (with
    RedHat OpenShift), your IT department may want something in between: hosting the
    decision services on the company network. We will explore containers as a way
    of enabling this and other deployment options.


    Specifically, we will cover the following:


    +   - Comparing Business Central and KIE Sandbox to edit our models

    +   - Images, containers, Docker, and getting help

    +   - Installing Docker on your laptop

    +   - Running Docker and a tour of Docker Desktop

    +   - Running the Business Central rule editor in Docker'
