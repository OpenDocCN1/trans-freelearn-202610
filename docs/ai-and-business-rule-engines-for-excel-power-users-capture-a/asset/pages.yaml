- pgno: 335
  md: 'This flow could be implemented in either Power Automate Online or Power Automate
    Desktop. Either way, the flow is very simple in concept and has only five steps:


    +   1. We start our flow in the normal way – this flow has a manual trigger, but
    it could easily be an online form submission.

    +   2. In the second step, we call our machine learning model (and only the machine
    learning model) from Power Automate.

    +   3. We update Excel with the results of the machine learning model.

    +   4. We make a separate call to our rules-based decision service using any one
    of the techniques we covered in Chapters 6, 7, and 8. We make sure to pass in
    all the information, including the results we gathered earlier from the machine
    learning model.

    +   5. We update Excel with the result of the final decision service call.


    > **Don’t worry – we’ll cover how to do this shortly**

    > *Step 2 is the only step we haven’t shown you yet – it’s pretty simple, as you’ll
    see in the next section.*


    If we used this approach for our chocolate bar recommendation service, step 2
    might recommend Peanut Crunch bars to US customers, while step 4 does a rules-based
    health check to stop us from causing harm to anybody with allergies.


    Many Excel power users find this Power Automate approach easier than using VS
    Code – not only are the tools within their control but also doing things as simple,
    separate steps is easier to understand and test. Since we know how to implement
    the other steps, let’s focus on how to call the machine learning model from Power
    Automate.


    # Calling the machine learning model from Power Automate


    There are many possible ways to call the machine learning model from a Power Automate
    action. We’ve used Python so much in this and the previous chapter, and Power
    Automate has good options for working with Python, so we’ll use that method. We’re
    going to keep our Python script simple even though there are many ways we could
    extend it. When you view the script on the book’s GitHub site at `12_use_existing_pmml_model.py`,
    it will look like Figure 12.9:'
  merge: -1
  img_proc: true
