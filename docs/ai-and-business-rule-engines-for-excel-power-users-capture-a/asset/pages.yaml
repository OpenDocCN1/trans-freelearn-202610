- pgno: 357
  md: 'It’s worth taking a tour of the VSCode screen in your browser. We’ll assume
    that you already took the tour of the VSCode screen from Chapter 9 but it’s worth
    confirming that everything looks familiar.


    We encourage you to make edits to the decision model, explore the source control
    tab (the icon third down from the top left), and push and pull items to and from
    GitHub (make sure you hit the sync button and check that they appear on the GitHub
    web page). While the mechanism is the same as in the KIE Sandbox editor, you have
    some more options (such as adding a commit message).


    If your files get out of sync (for example, if somebody has edited them in KIE
    Sandbox at the same time), there are options in VSCode to help you resolve these
    conflicts. A good starting point to learn more is at https://vscode.github.com/.
    In this appendix, we’ll continue on to setting up scenario testing within VSCode.


    # Setting up scenario testing in VSCode


    Now that we’re a little bit more familiar with the VSCode environment, let’s use
    it to set up the KIE Scenario Simulation and testing tools. Since VSCode is an
    advanced text editor focused on development, the test tools are designed to be
    run automatically as part of the build process.


    > **What is a build tool?**

    > A build tool is needed to transform text source files into a running project.
    The steps the build tool can take include downloading supporting libraries, compiling
    the text into runnable code, packaging the project into a deployable file, and
    running any specified tests. Since KIE and Kogito is a Java-based project, Maven
    is the standard build tool.


    As a build tool, Maven can also automate many of the setup steps for us. The steps
    we suggest in this section are based on the following article from the KIE team:
    https://blog.kie.org/2021/04/how-to-use-test-scenario-editor-to-test-your-dmn-asset-in-vscode.html.
    Because this article provides a clear sample, the following instructions use a
    slightly older version of KIE to match it. The benefits of the additional documentation
    are worth it if you are using the scenario testing tool for the first time.


    However, since KIE is evolving rapidly, it is important that we also give you
    instructions on how to use the latest versions. With that in mind, consider the
    following:


    +   - The *alternative method* listed in the next section can be run using the
    very latest version of the KIE Project source – at the price of delving slightly
    deeper into the project.

    +   - If you’re intending to set up a Kogito project for development purposes,
    you are better off following the official instructions here: https://docs.kogito.kie.org/latest/html_single/#proc-kogito-creating-project_kogito-creating-running.'
  merge: -1
  img_proc: true
