- pgno: 60
  md: '+   - There are a lot of useful videos on the site at https://www.drools.org/learn/video.html,
    as well as videos hosted on the KIE YouTube channel at https://www.youtube.com/channel/UCUjeymTM-TrwHs36388VRbw.

    +   - We talked earlier about how to interact with and ask questions on open source
    project mailing lists. The main Drools lists are https://groups.google.com/g/drools-setup
    and https://groups.google.com/g/drools-usage. There is a more technical-focused
    Kogito mailing list at https://groups.google.com/g/kogito-development/c/18JqnqYTQA.

    +   - Other good sources of help are listed on the Drools site at https://www.drools.org/community/getHelp.html.
    One key external support site is Drools on Stack Overflow, with good instructions
    on how to interact with people via the site: https://stackoverflow.com/questions/tagged/drools.

    +   - You’re unlikely to use it at this point, but as well as the source code
    hosted on GitHub, instructions on how to build the project from the source can
    be found at https://www.drools.org/code/sourceCode.html. Likewise, the project
    developers have a live chat channel (similar to Teams/Slack), which can be found
    at https://kie.zulipchat.com/. While it’s good to know where they are, most readers
    will not interact directly with them. Instead, let’s remind ourselves that IBM
    and Red Hat sponsors the project and offers support options at https://www.drools.org/product/services.html.


    Some of the resources we’ve just highlighted will only make sense as you explore
    future chapters. Come back to this section on a regular basis as you work through
    this book; you’ll get more out of it each time. There are also a huge number of
    other tutorials on the web, written for various levels of technical ability, which
    are worth exploring as you move through the chapters.


    # Contributing back to the community


    Even if you are not a developer, you can contribute back to the open source community.
    This could be as simple as posting the answer (once you find it) to a question
    that you may have previously put on a mailing list. Or it could involve filing
    a bug report (if requested by the team), or writing and updating the documentation.


    As an Excel power user, your skills and time are valuable. All it takes is a willingness
    to learn how the project works and find an area that needs your help. The diversity
    of skill sets is what makes open source projects work.


    Now that we understand more about Kogito as open source enterprise software, let’s
    take a look at the kind of solutions that it helps us build.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# How to design and build enterprise solutions


    You saw in the previous chapter that in solving your problems with Excel, you
    were taking steps toward more robust enterprise-type solutions. We explained that
    unlike Excel, enterprise solutions are built by many people, but can also be used
    by many people at one time.


    As you evaluate whether KIE/Drools can solve your immediate problems with Excel,
    you need to know that it will continue to solve your problems in the long term.
    That’s why we’re including this section – just enough about designing and building
    enterprise solutions. It should assure you that you have a roadmap to deploy and
    support Kogito as part of a bigger system over the longer term.


    Already in this book, you have seen hints that the enterprise software world is
    similar but also very different from the Excel world:


    +   - In the previous chapter, we broke Excel down into three parts (model/data,
    as well as view and controller). Whatever enterprise system we build using Kogito,
    will need to have all three parts.

    +   - In this chapter, we mentioned that unlike the more casual approach in Excel,
    enterprise systems move through a life cycle of proof of concept, develop, build,
    test, and production. There will be formal processes and a team to move between
    each.


    Let’s look at those key parts in more detail, so you understand how Kogito/Drools
    fits into the bigger picture. Let’s start with the team you will be working with.


    # Working with a team


    At the start of this chapter, we asked about your current situation – whether
    you’re working in a corporate environment (with or without official support) or
    you are at an earlier stage of personal learning, but still likely to apply those
    skills in a business environment.


    Whatever your situation, you’ve probably noticed that instead of working on a
    single file, supported by one person, we’re gradually moving to a system that
    is supported by an entire team. It’s worth taking a while to examine the different
    roles in this team to help you work better with them:


    +   - **Business knowledge expert**: That’s you. You understand how the business
    runs (or wants to run) so the team can translate the process into the appropriate
    technology.

    +   - **Software architect**: Sketches out the design of the software solution
    and makes key decisions on the tools and technologies to use.

    +   - **UX or user interface specialist**: Responsible for designing all elements
    of the system that interact with the user, to make it as easy to use as possible.

    +   - **Developers**: Write the complex part of the system in languages such as
    Java, C#, and Python.

    +   - **Testers**: Try to break the system once it is nearly complete. While other
    team members may not fully appreciate this, they will be secretly glad since the
    earlier a problem or bug is found, the easier and quicker it is to fix.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '+   - **Project managers**: Responsible for the entire team delivering the
    entire system on time, on spec, and on budget.


    +   - **System or cloud administrators**: Responsible for the infrastructure to
    run the system in the development, test, and production phases. Often, they will
    be the first to flag issues that happen when the system is running *in real life*.


    It is possible for several of these roles to be combined into smaller projects.
    Alternatively, larger organizations may have teams that split these roles. Either
    way, your role as a business knowledge expert is crucial to the entire team and
    a good business expert is invaluable to delivering a system that allows the organization
    to run effectively.


    # What software architects do


    Just like architects design houses, enterprise software architects design enterprise
    software. Both are great jobs, with many highly skilled and very opinionated individuals.
    Some software architects may be upset by the one-size-fits-all enterprise solution
    I have presented in the following diagram.


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_62_0.png)


    Figure 2.2 – One-size-fits-all enterprise software diagram


    *Figure 2.2* is simple but shows what most systems do: take information from a
    user, process it in some way, then store it somewhere. Splitting the design into
    three layers like this makes it easier to understand what each layer does:


    +   - The **user interface layer** communicates to and from a *real* person. Normally,
    this is a web page. But if we wanted to change to a voice interface (such as Amazon
    Alexa) or a 3D avatar, we would only have to change this layer.


    +   - The **business logic layer** is where we do something with the user information.
    It might use the dates selected to suggest flights, update your bank balance,
    or carry out any other process you need to run the business.'
  merge: -1
  img_proc: true
- pgno: 63
  md: "+   - Unless you want to forget everything within a couple of seconds, your\
    \ enterprise software needs a **storage layer**. Traditionally, these were databases\
    \ such as Oracle or Microsoft SQL Server (think of a much more robust and bigger\
    \ version of Excel). More recent technology is optimized for the cloud and can\
    \ handle hundreds of millions of users. The point is we don’t care too much about\
    \ the technology, just as long it stores and retrieves the information when we\
    \ need it.\n\nIn general, each layer does one thing and one thing only. While\
    \ this diagram suggests that everything runs on one computer, it doesn’t have\
    \ to. Each layer could be in its own container (more about those soon) hosted\
    \ in a different data center in a different country.\n\nNot surprisingly, we’re\
    \ mostly concerned with the business logic layer in this book, as that is where\
    \ the Drools rules engine will be deployed. But when we introduce our examples,\
    \ we will need to provide you with a user interface and a storage layer to get\
    \ you started.\n\nNo doubt you are reassured by having a long-term roadmap for\
    \ deploying your business rules. But it is worth reminding ourselves that many\
    \ software architects have only dealt with systems where the business logic layer\
    \ is coded in languages such as Python, C#, and Java. Remember the problem of\
    \ *business rules disappearing into code* that we discussed in the previous chapter?\
    \ That’s exactly the same problem.\n\nIf you need to convince your software architect\
    \ colleague to use a business rule engine in the business logic layer, talk them\
    \ through the following points:\n\n+   - **Separation of layers:** Tools and frameworks\
    \ exist for storing data and creating user interfaces. Rules engines give a similar\
    \ framework for the business layer. It makes it less likely that code will leak\
    \ across the different layers. This is a key topic for enterprise architects,\
    \ who try to design systems where each component does one thing and does it well.\n\
    +   \n+   - **Knowledge management:** Business rules, in other words, knowledge,\
    \ are the core of any big enterprise software. In the approach proposed by this\
    \ book, rules can be written by business users, and this same rule file can be\
    \ managed and executed, avoiding errors from miscommunication. Rule engines can\
    \ be the natural home to manage all of the knowledge essential to your business.\
    \ You’ll be able to code business rules that say *what to do*, not *how to do\
    \ it*, in a human-readable format.\n+   \n+   - **Versioning and authoring:**\
    \ The tools that come with Kogito/Drools allow business knowledge to be tested\
    \ and deployed on a separate timeline to code deployment. For example, in an online\
    \ home loan application, the lending rules could be updated independently of changes\
    \ to the website. This allows the business to react quickly to a changing environment\
    \ without the risk of introducing new bugs.\n+   \n+   - **Speed and scalability:**\
    \ When deploying in the cloud, time (and computing resources needed) is money.\
    \ The way rule engines work is mathematically more efficient than human-written\
    \ code since they are based on the PHREAK algorithm (an evolution of Rete) for\
    \ DRL-based rules and efficient algorithms in the DMN engine, for fast and effective\
    \ decision-making."
  merge: -1
  img_proc: true
- pgno: 64
  md: "+   - **Auditing:** Unlike other types of AI, rule systems are designed to\
    \ explain how and why a particular decision was made. While this is also possible\
    \ with handwritten code, in practice, it’s quite difficult as you often need to\
    \ examine log files line by line for the same information\n\nWe’ve spent a couple\
    \ of pages thinking long term to confirm that our choice of the KIE/Drools rules\
    \ engine is worth investing our time to learn. We have confirmed that it can solve\
    \ problems for us now and give us a scalable path to continue using it in the\
    \ future.\n\nBut we have a more immediate problem. We’re at the *proof-of-concept*\
    \ stage and we don’t yet have a full team of people to help us to build one. We\
    \ need to introduce supporting projects to fill this gap so you can easily run\
    \ the book samples.\n\n# Containers supporting Kogito, KIE, and Drools\n\nThis\
    \ book focuses on rule engines. But it is also a key aim of the book to help you\
    \ on the journey from using Excel-based solutions (running on your desktop) to\
    \ more powerful enterprise solutions that can be used by many people at once.\
    \ Containers make this journey easier, so let’s take a quick look at what the\
    \ technology is and how we will use it.\n\n> **Do I really need to learn about\
    \ containers?**\n> \n> The quick answer is no. This is a book about Excel and\
    \ the Kogito/Drools rule engine, and you’ll get value in your day-to-day work\
    \ even if you just focus on those areas.\n> \n> But a likely outcome is that other\
    \ people will be interested in what you have done and will want to contribute\
    \ to and/or run your business rules. Container technologies help you collaborate\
    \ and deploy your rules more effectively.\n\nIn some ways, you’ve already used\
    \ something similar to containers when you’ve used Excel. For most spreadsheets,\
    \ you can just share them with somebody else – and know that they work, regardless\
    \ of the particular setup they have on their laptop. This is also (mostly) true\
    \ even if they are using another type of spreadsheet – for example, OpenOffice\
    \ or Google Sheets. All the complexity of the software is hidden by Excel acting\
    \ as a container for you – it just works. Your colleague can view the spreadsheet\
    \ just as you made it.\n\nWith Kogito, KIE, and Drools, we’re using much more\
    \ complex software once we progress beyond the first examples with the online\
    \ sandbox (in the first half of this book). So, I have a challenge as an author\
    \ – how do I get this software into your hands in an easy-to-use way? Let’s work\
    \ through the options step by step:\n\n+   - The easiest option for you would\
    \ be for me to personally install the software on your laptop. But since there\
    \ is only one of me and thousands of readers, that is not really a realistic solution.\n\
    +   - The next approach would be to give you a detailed set of instructions to\
    \ follow. You’re an Excel power user and would have a reasonable chance of getting\
    \ it right – if everything goes smoothly."
  merge: -1
  img_proc: true
- pgno: 65
  md: 'But what if something goes wrong in more than one of the 20 steps that this
    would take? Every single computer setup is different, and there is no way of giving
    simple instructions to cover all possibilities.


    +   - The final option is to pull together a package of tools needed to run the
    samples in the book – let’s call it an **image**. We could then give you this
    image to drop into a preprepared space on your laptop (let’s call it a **container**).
    If the container was more than just a place to store files, but could somehow
    guarantee that the image would run exactly the same way on all machines, that
    would be an ideal solution. This is what **Docker** and other containerization
    technology give you.


    Containers take their name from the shipping containers you see on the backs of
    trucks, trains, and cargo ships. They have a similar purpose of moving software
    around. So long as everything fits in the container, everything works – the same
    crane can load and unload containers from a ship, no matter what is inside of
    it.


    # Containers are a big deal


    It’s hard to underestimate how much of a big deal the containerization of software
    is.


    For example, in a previous version of a similar book, the technology to run the
    samples took 2-3 hours to install if everything went correctly. But despite it
    being aimed at a more technical audience, things could go wrong – in part because
    everybody’s laptop has a different setup.


    Under the covers, the container approach enables us to use the KIE Sandbox software
    that we’ll use to write our first rules in the next chapter and allows us to start
    writing rules in 2-3 minutes.


    We’ll return to containers in more detail in later chapters, since we want to
    give you a smooth path from running and editing rules locally to deploying your
    rules in a robust, scalable production environment.


    Containers are now widely used. So, while we’ve chosen Docker (as it has the most
    user-friendly desktop tools), there are alternative tools listed at https://opencontainers.org/,
    including Podman. As you’ll see in Chapter 10, we can also run the same containers
    in the cloud with Microsoft Azure, Red Hat, Amazon, and Google. We’ll see more
    about Docker as we install it and use it to run samples in later chapters.


    Before we end the topic, it’s also worth underlining the security advantages of
    containers – especially if you need to ask permission from colleagues to install
    Docker. Containers (as their name suggests) are fully isolated from the computer
    running them. Even though you might feel you can trust me as an author (after
    all, we’re well into the second chapter of the book), and you can inspect both
    the contents and the source code running in it, Docker will still isolate the
    code in its own container, giving you another layer of security.'
  merge: -1
  img_proc: true
- pgno: 66
  md: "# Windows, Mac, and Linux\n\nBecause we’re using Docker and containers, all\
    \ the samples used in this book will run on recent versions of Windows, Mac, and\
    \ Linux (so long as your machine meets the Docker hardware specs). Our detailed\
    \ instructions for installing Docker will focus on Windows, but alternative instructions\
    \ are freely available on the web for Linux and Mac machines.\n\nNow that we’ve\
    \ met the supporting technologies, let’s look at the choices they give you to\
    \ run these book samples.\n\n# Four different ways to work with business rules\n\
    \nNow that we know about containers, let’s look at the four main ways we will\
    \ use them to run business rules as we work through this book. Remember that unlike\
    \ Excel, the choice of tool to edit rules is separate from the choice of engine\
    \ to run the rules. We present the four main choices here in a way that keeps\
    \ things simple, but you still have the option to pick and choose between them.\n\
    \nThese options start with the simplest and work up to the more powerful. This\
    \ is in line with our journey from Excel to enterprise-grade solutions. In all\
    \ four suggestions, we continue to use Excel from our laptop and call the business\
    \ rule engine no matter where it is located:\n\n+   1. **Editing in KIE Sandbox\
    \ online, using KIE extended services on your laptop as the engine:** This is\
    \ the solution we start with as it is the easiest to use. It hides a lot of the\
    \ complexity, which is great for getting started, but works best for single users.\n\
    +   \n+   2. **Editing in KIE Sandbox online, running our rules in the cloud using\
    \ OpenShift:** We’ll introduce this approach in *Chapter 5*, taking advantage\
    \ of the integration between KIE and OpenShift. *Appendix B* gives a variation\
    \ on this – where we use codespaces (hosted in the Azure cloud) to do something\
    \ similar but using VS Code as the editor.\n+   \n+   3. **Hosting both the editor\
    \ and the engine in containers on your laptop or another computer that you have\
    \ access to:** Once you have Docker installed, getting the Kogito container image\
    \ running in it is easy. We cover it as a stepping stone toward deploying your\
    \ rules in the cloud using a provider other than Red Hat (e.g., Microsoft, Amazon,\
    \ or Google). Containers may also be the preferred way for your IT department\
    \ to deploy the KIE tools and the Drools rules engine on-premises in your organization\
    \ (keeping all your knowledge in-house). We cover this approach in *Chapter 10*.\n\
    +   \n+   4. **The final method is to set up the technology stack yourself:**\
    \ This is relatively straightforward if you have the technical knowledge (or know\
    \ a colleague that does). We won’t go into detail, although some hints are given\
    \ in *Appendix B*. Full instructions are available at the KIE and Drools links\
    \ we shared earlier. This gives you full control of how you deploy your business\
    \ rules."
  merge: -1
  img_proc: true
- pgno: 67
  md: "Four different ways to run the book’s samples might appear a lot, but every\
    \ reader’s computer is different, and there are billions of combinations of hardware,\
    \ software, and configuration that make it impossible to test them all.\n\nFor\
    \ example, some organizations may block you from downloading and running an .exe\
    \ file (which is needed for the first option, using KIE Sandbox). In this case,\
    \ users may skip ahead and use the cloud approach to run the samples. By giving\
    \ four alternative options, we make it much more likely that every reader will\
    \ be able to run the samples.\n\n> **Some self-assembly required**\n> \n> IKEA\
    \ furniture is renowned for its design, but also that it comes flat-packed with\
    \ some self-assembly required. Often, I don’t manage to get it right the first\
    \ time, but I’m willing to try again and ask for help if needed.\n> \n> KIE, like\
    \ other enterprise software, is similar. You need to follow the instructions to\
    \ get it up and running. While these steps aren’t difficult, this will feel very\
    \ different from the Excel world (where it came prebuilt for you). If self-assembly\
    \ isn’t for you, that’s OK; you should be able to get to the end of *Chapter 9*\
    \ without too much difficulty. At that point, hopefully, we will have convinced\
    \ you that the power of business rules makes the effort worthwhile.\n\n# Summary\n\
    \nIn this chapter, we learned more about you as a reader and the amount of support\
    \ that might be available to you from your colleagues as you work your way through\
    \ this book.\n\nWe looked at the different business rules engines available and\
    \ why we recommend Kogito/Drools to work through in this book and saw a glimpse\
    \ of some other interesting projects from Red Hat. Since open source is a key\
    \ part of this decision, we looked at the support available from the community\
    \ and saw resources where we can learn a lot more about the technology.\n\nAs\
    \ we will be investing significant time in the KIE project, we provided reassurance\
    \ of the long-term benefits to you and your team in deploying it as part of a\
    \ wider software solution. This included understanding how enterprise solutions\
    \ are both more powerful and more complex than Excel, the team of people that\
    \ work on them, and how KIE and Drools fit into this overall enterprise solution.\n\
    \nFinally, since not everybody will have this team around them as they read this\
    \ book, we looked at containers as a supporting technology. That allows us as\
    \ Excel power users to quickly get up and running, while still giving us a roadmap\
    \ so that we can deploy what we are learning in a real-life business environment.\n\
    \nThe first two chapters introduced the problem with Excel, and how business rules\
    \ might solve them. So, you’ll be glad to hear that in the next chapter, we get\
    \ to write our first business rule."
  merge: -1
  img_proc: true
