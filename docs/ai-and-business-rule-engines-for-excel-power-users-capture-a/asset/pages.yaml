    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_282_0.png)


    Figure 10.22 – Successful test run


    It’s great to finish the section on Scenario Simulation with passing tests. While
    we only added two scenarios, you can see how setting up multiple scenarios and
    getting Business Central to highlight any failures could become a very useful
    safety net. It’s even better to run these tests automatically so you’ve no excuse
    for missing something that gets accidentally broken. The build tools we cover
    in Appendix B are a useful step in this direction.


    In this section, we used Docker to support editing our decision models. But we
    can also use Docker to widen the range of places where we can deploy and run our
    models.


    # The KIE Server in Docker and Azure


    So far in this book, the two main environments to deploy and execute our rules
    in have been the OpenShift Sandbox that we described in Chapter 5 and the KIE
    Extended Services that we introduced in Chapter 3. Even if the KIE Sandbox web
    page appears to be running the rules, a quick look at the logs shows that it is
    the KIE Extended Services that is doing the heavy lifting of executing the rules.


    This split between the editor where we write our rules and the server where we
    run our rules is very powerful. It means we can choose the editor that works best
    for us (KIE Sandbox, VS Code, or Business Central). And we can then choose the
    best server environment to deploy our rules.


    We’ll see in the next section that Docker containers give us an enormous choice
    of options for where we can deploy our rules, so much choice that we can’t cover
    every option! But we will give you places where you can learn more. We’ll focus
    on replacing the KIE Extended Services with its Docker-based equivalent, then
    on deploying the more heavyweight KIE Execution Server, and finally we give you
    pointers on deploying into the Azure cloud (to build on what you know about deploying
    to the OpenShift equivalent).'
