  md: '# About the reviewers


    **Karina Varela** has worked with enterprise technologies for over 10 years, focusing
    on cloud solutions, Java technologies, and the open source culture.


    Her solid knowledge is built on practical experience in development, architecture,
    delivery, and troubleshooting production applications and products. Having worked
    at Red Hat, the biggest open source company in the industry, not only does she
    bring a vast understanding of the open source model and the open communities but
    she is also largely involved in the delivery of architecture and the delivery
    of mission-critical software in multiple sectors around the globe. She has also
    been awarded the Red Hat champion recognition.


    Karina is well recognized within the Java community for articles and blogs, books,
    talks at international tech conferences, open source contributions, and active
    nurturing and management of communities such as SouJava.


    **Filippe Spolti** is a software engineer and an open source and cloud enthusiast.
    On a day-to-day basis, he works with Kogito Engine for Serverless Workflows. He
    worked on OpenShift V3 in its early stages, helping to bring middleware products
    to the cloud. He was also a technical support engineer who helped customers to
    solve issues and contributed to several open source projects, more recently with
    CNCF Serverless. He contributes to local conferences in Brazil as a speaker and
    track coordinator. He holds a bachelor’s degree in information systems and specializations
    in software engineering and information security and wrote the book *WildFly:
    New Feature*, and has helped other authors to be successful with their books.


    > *Sharing knowledge is rewarding and it also requires dedication and a little
    time away from family and friends. I am thankful for the support they have given
    me in recent years.*


    **Nishant Ravle** is an IT professional with more than 16 years of IT experience
    in BPM, SOA, and middleware technologies. He has extensively worked on Oracle
    and IBM product stacks. Currently, he is in the field of software consultancy
    and corporate and online training.


    Nishant’s technological expertise spans primary skills and expertise in business
    process management and the service-oriented architecture domain, developing BPM
    processes using IBM BPM, Oracle BPM, jBPM, Camunda BPM, and Activiti BPM in on-site
    assignments in the UK, Norway, Oman, Malaysia, South Africa, Dubai, Kenya, and
    Qatar for requirement gathering, development, consulting, architecting, and training.


    **Niall Browne** has worked extensively with Excel and web technologies. He studied
    maths and psychology at Dublin City University and has a keen interest in coaching
    and sports analytics. Most recently, he was a member of the team at The Mill in
    Drogheda, which co-created a financial payments project with PFS.'
