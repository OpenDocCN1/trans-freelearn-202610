- pgno: 117
  md: '9. Now that you are back at the node editor, enter day of week (DOB) in the
    expression box. You''ve guessed it – this is a FEEL expression that returns the
    day of the week (for example, Monday or Tuesday) linked to this date. With this
    edit, your node should look similar to Figure 4.21:


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_117_0.png)


