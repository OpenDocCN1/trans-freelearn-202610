  md: '# Step-by-step training of the Machine Learning model


    Whether we have our sample notebook (11-naive_bayes.ipynb) open in Azure ML or
    in another viewer, you should see a screen similar to the one shown in Figure
    11.14:


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_306_0.png)


    Figure 11.14 – Our ML notebook hosted in Azure


    The notebook format for ML (with text, executable cells, output, and a button
    that executes each cell) is exactly the same as the 3D graph notebook we saw earlier.
    So, we''ll focus on walking through the notebook step by step, and assume that
    you''re pressing the Execute ▶ button each time to run each step in the notebook.
    If you''re impatient, there is also an option at the top of the notebook to run
    all the steps at once—you''ll still see the output of each step.


    The notebook format means that each step is very well documented, so we''ll walk
    through at a high level what is going on:


    +   1. The first cell makes sure we have access to the ML toolkits we need to
    run our notebook. When you run this step for the first time, you''ll have to wait
    for a couple of minutes as Python downloads the required libraries. It will be
    faster from the second time onward:


    ```

    pip install numpy matplotlib seaborn scikit-learn nyoka sklearn2pmml

    ```'
  merge: -1
  img_proc: true
- pgno: 307
  md: '2. The next cell tells Python which of the supporting libraries and toolkits
    we want to use in our script. While this step appears redundant, it is helpful
    on larger scripts to know which supporting toolkits we are using when the names
    are similar:


    ```

    # Standard tools for manipulating numeric data

    import random

    import seaborn as sns; sns.set()

    import numpy as np

    import pandas as pd

    # For Generating our Graph later.

    import matplotlib.pyplot as plt


    #Import Gaussian Naive Bayes model

    import sklearn

    from sklearn.naive_bayes import GaussianNB


    # For exporting our model later

    from sklearn2pmml import sklearn2pmml

    from sklearn2pmml.pipeline import PMMLPipeline

    ```


    3. Now, the real work of our notebook begins. The next cell contains Pandas (a
    supporting library for working with tabular data) to load our sample dataset:


    ```

    # Load the information

    sales_data = pd.read_csv("11_ML_learning.csv")

    # print it so we can see a sample of the data we are

    working with

    print (sales_data)

    ```'
