- pgno: 353
  md: '# Appendix B


    # Testing Using VSCode, Azure, and GitHub Codespaces


    While using VSCode goes beyond the scope of this book, it should still be accessible
    to many readers. It has been made even easier by the release by Microsoft of GitHub
    Codespaces – an online version of the VSCode editor. Because it runs fully in
    the Azure cloud and can be accessed via your browser, it doesn’t require any installation
    of software on your laptop.


    If you’ve read Chapter 9, you may have come to this appendix to learn how to use
    VSCode (online) to run the Scenario Simulation tool. We’ll cover all the steps
    needed to set that up, as well as an alternative method that you might prefer
    since it also allows you to run the KIE samples showcasing scenario testing.


    This appendix also provides an introduction to VSCode. VSCode opens up a range
    of other possibilities if you are interested in exploring not only decision models
    but also data science, machine learning, and programming languages such as Python,
    JavaScript, Java, and C#. We won’t cover the specific plugins needed for that
    – but since we give instructions on how to install the DMN plugin, you’ll have
    a very good basis to take the next steps in those other areas. While this book
    isn’t aimed at developers, the steps in the chapter are also the ones you need
    to get started with more powerful developer tools.


    Like the other appendices, we assume a willingness to explore more technical topics.
    While step-by-step instructions have been provided that are accessible to Excel
    power users, we don’t go into a lot of detail on how to fix all possible problems.
    For that, we encourage you to get support from more technical colleagues as needed.
    If you do get stuck, there is another avenue to run the Scenario Simulation tool
    using Business Central, which we covered in Chapter 10.


    Finally, if you prefer to run VSCode on your laptop (rather than online in the
    cloud), we have some notes on how you can do this at the end of the appendix.
    Many of the steps will be the same.'
  merge: -1
  img_proc: true
