- pgno: 248
  md: '# Common decision patterns


    If you’ve created lots of spreadsheets, you probably found that you repeat common
    patterns again and again. This might be presenting instructions or top-level figures
    on the first tab of your spreadsheet. It might be a hidden (or locked) sheet containing
    the complex formula. Or it might be a pivot table displayed beside a graph so
    that people can see a quick overview or drill into the detail.


    We don’t repeat these patterns out of laziness, although saving time is a good
    thing. We will repeat these patterns because they work and because familiar patterns
    are easier for people to understand. Programmers call repeatable solutions like
    these **design patterns**, and actively look to apply the patterns they’ve used
    previously as part of the problem-solving process.


    In decision models, there are also repeatable patterns you will find yourself
    using again and again. Perhaps the most important is calling one decision model
    from another – since that allows us to break down our model into reusable and,
    more importantly, testable chunks. We’ll dedicate sections later in the chapter
    to those two concepts.


    Before that, you may notice that you have already (accidentally) created the patterns
    we’re about to mention in your own models. But, since patterns aim to give a common
    language between and across teams, I’m using the pattern names as used by Denis
    Gagne of Trisotech and Matteo Mortari of the KIE team:


    +   - **Scoring** – we build a value based on a combination of rules – adding
    or subtracting points depending on different rules matching. Exams are a classic
    scoring system, but credit ratings used by banks or airline passenger screening
    (for additional security checks) are similar examples.

    +   - **Classification** can be based on these scores – for example, an exam score
    based on a pure percentage, where A grades have more than 85% mark. This might
    be more subtle with the classification changing so only the top 10 people get
    this grade. Or classification can be done on multiple values – like our product
    recommendation service in *Chapter 4*, which considers the country of residence.

    +   - **Ranking** – real-life product recommendation services don’t suggest a
    single value. For example, Amazon suggests up to 10 products (out of millions)
    that it thinks you are most likely to buy. You can mimic this by sorting based
    on a score, perhaps modified by different classification rules.


    A final pattern is more of a framing of the problem – what question is the model
    trying to answer? Done correctly, it will make it much easier to both understand
    and design decision services.


    The key takeaway from this section is that other people will have encountered
    very similar problems to you, even if they work in a different area or industry.
    Be on the lookout for common patterns that you can reuse – a good starting point
    is Gange and Mortari’s presentation on the topic. The SlideShare link is https://www.slideshare.net/dgagne/introduction-to-some-dmn-patterns-and-their-value,
    with a YouTube video linked from the post on the KIE blog.'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# Another pattern – linking decision models together


    A common pattern in Excel, decision services, and most computer languages is to
    break larger solutions down into reusable pieces. A bit like Lego building blocks,
    it makes them easier to understand and reuse. And as you’ll see shortly, it makes
    them easier to test. But if we break the solution into many pieces, how do we
    link them together? Let’s work through an example.


    We’ve tried to make the examples in this book as realistic as possible. But if
    we show an example complicated enough to break into smaller modules, the mechanism
    for one decision model to call another will just get hidden in the complexity.
    So, we’ll go in the other direction – the simplest possible example to link models
    together.


    We’ll start with Figure 9.7, also downloadable as 09-a-SimpleModel.dmn.


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_249_0.png)


    Figure 9.7 – Hello World service


    This is a slightly updated version of the Hello world sample from Figure 3.19
    in Chapter 3. It takes a name as input, then says hello to that person.


    In Figure 9.7, we put the decision model and the decision node side by side to
    make it clearer – but there is no major change other than wrapping the node in
    a decision service. It’s also worth noting that the input node (Name) is of the
    String type. We also set the properties of the decision service to let KIE know
    it returns a type of String – which helps other people include and reuse this
    model.


    **A reminder about folders**

    Since we can only import models if they are in the same folder within KIE, it
    is helpful if the KIE sandbox is connected to GitHub – look at Chapter 5 if you
    need a reminder on how to do this. You’ll get asked what folder name to use –
    we used c09 as the name for the folder, but more importantly, both models that
    we want to link must be saved in it.'
  merge: -1
  img_proc: true
- pgno: 250
  md: 'Once you have created this model (or uploaded it into the sandbox), make sure
    it is synced to GitHub using the instructions we gave in Chapter 5. We named it
    `09-a-ImportModel.dmn`. Now, it’s time to create a second model that will reference
    our `Hello` service:


    +   1. Click **New file** and select **Decision** – it will create a blank folder
    within the same folder.


    +   2. Click on the **Included Models** tab – for the moment, it will show **No
    external models have been included.**


    +   3. Click **Include model** at the top right of the screen. You’ll see a list
    of models in the folder, as in Figure 9.8. If you don’t see the other models listed,
    go back and check that the KIE sandbox is linked to GitHub correctly – both models
    need to be in the same folder.


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_250_0.png)


    Figure 9.8 – Including another model


    +   4. Select `09-a-ImportModel.dmn` and give it a name. It’s better to keep it
    short (we called it `simple`), as we’ll be using that name often. Click on the
    **Include** button to confirm.


    +   5. If our included model had custom data types, they will appear (read-only)
    in the **Data Types** tab. The **Decision Navigator** tab in our model will also
    show the components we have just included, as in Figure 9.9. If Decision Navigator
    isn’t already open, you can view it by pressing the map icon at the top right
    of the screen.'
  merge: -1
  img_proc: true
- pgno: 251
  md: '![](img/48815d6f06dc8c7aeaa3963d289fb1e7_251_0.png)


    Figure 9.9 – Included components in Decision Navigator


    While it is possible to use all these components, the decision service is the
    one that is intended to be referenced outside of the model. Now that we’ve included
    our model, we can invoke it whenever we want. We’re going to build out the second
    of the two models we want to link, as in Figure 9.10.


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_251_1.png)


    Figure 9.10 – Included components'
  merge: -1
  img_proc: true
- pgno: 252
  md: 'While this second model is available to download as 09-a-ImportModel.dmn from
    the book’s GitHub site, it’s still simple to set up. From left to right in Figure
    9.10, we see the following:


    +   1. We dragged and dropped simple.Hello Service from Decision Navigator.

    +   2. We created a decision node and kept the default name, Decision-1.

    +   3. We linked from the Hello service to the decision node. This direction is
    important; fortunately, the sandbox editor won’t let you link in the other direction.

    +   4. We created a new input node (leaving the default name of InputData-1) and
    set its type to String. We connected the input node to the decision node.

    +   5. Editing the decision node, we set its type to Invocation.

    +   6. Editing the Invocation node, it’s important we get the names exactly right.
    The function name we set is Simple.Hello Service – exactly the same spelling and
    case as the node we included from the other model.

    +   7. The editor will have a line to enter the parameters we want to pass – change
    the first parameter name from p-1 to name. Again, this must exactly match the
    input node from our included model. Take a look at Decision Navigator to make
    sure you get the spelling right. We set the type of this parameter to String –
    again, to match the value our included model expects.

    +   8. We set the value we want to pass as a parameter; click on Select Expression,
    set it to Literal Expression, and include the value of our input node (Input-Node-1).
    The type of the parameter (String) must match the type the included service is
    expecting.

    +   9. In the KIE sandbox, double-check that no problems are highlighted. Then,
    click on Run and As Form. As shown in Figure 9.11, when we enter the name of Peter,
    we get Hello Peter in return.


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_252_0.png)


    Figure 9.11 – The result of calling out the external model


    # Small example, big implications


    This is a trivial example – we’d never split such a simple example as Hello World.
    But your models are going to become very complex very quickly and it’s good to
    know that you can split the models into reusable components.'
  merge: -1
  img_proc: true
- pgno: 253
  md: '# Linking the Bill of Materials example


    Since this is such a simple example, we’ve included a second more sophisticated
    example, where we reuse the Bill of Materials service that we created in Figure
    9.4. That example is available to download at 09-Call-BOM. The steps to import
    and the mapping to our decision model are similar to the hello world example.
    However, we want to pass over multiple parameters, which we can do by adding an
    additional line to our invocation table, as in Figure 9.12.


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_253_0.png)


    Figure 9.12 – Invoking our Bill of Materials service


    We’ll return to importing and invoking models in Chapter 11 – when we use a similar
    mechanism to use and import Machine Learning models to work alongside our business
    rules.


    Now that we know that we can split and recombine our models, the question becomes
    where to split our models. That is a judgment call since you need to trade off
    the convenience of being able to see everything on one page against the simplicity
    of having lots of smaller, easier-to-understand models. But two useful guidelines
    are as follows:


    +   - Model how people think about the existing business – the more your models
    follow existing department, team, and process boundaries, the easier it is for
    colleagues to understand them.

    +   - Model at a level that makes it easy to test. If your model is too big, it
    will be very unwieldy to test. If your models are too small, you will get tired
    of writing many trivial tests that add little value.


    Since testing is so important, KIE gives you several options on how to build and
    run them automatically – we look at them in the next section.'
  merge: -1
  img_proc: true
- pgno: 254
  md: '# Testing and breaking your rules (before somebody else does)


    If you are like me, it’s always a relief to get a spreadsheet, program, or decision
    model working. And sometimes we’re reluctant to push our new creation too hard
    in case it breaks. But whether we look for errors or not, any hidden errors are
    still there and will come back to bite us later.


    Even worse, errors get more expensive to fix the longer you ignore them. What
    is trivial to change now (while the model is fresh in your mind) could take you
    several hours to track down in a couple of months (when you have worked on several
    other projects in the meantime). And it could get very expensive if the problem
    is seen by real customers or end users—we could end up giving away a lot of free
    chocolate and hurt the reputation of our business.


    Even more depressing is that fixing this error could cause other things to break.
    For example, we might update our bill of materials, and then find out that another
    decision model relies on it and is now behaving incorrectly. But there are ways
    to fix this – often known as Agile, Scrum, or test-driven development.


    # Agile, Scrum, and test-driven development


    Happily, enough people have run into these problems for many years before us.
    So, there is a set of best practices and tooling to help us fix them. Broadly
    speaking, the solution is as follows:


    +   - To write our tests little by little, so they are easy to write. The focus
    of each is testing a single part. That way, we’re not tempted to leave them until
    the end and then maybe not write them at all. This approach is called **unit testing**
    and it’s much easier than the end-to-end testing that you may have been involved
    with before (although there is still a place for that approach).

    +   - To write our tests in a standard way, so while each unit test is simple,
    together they become a safety net that highlights whether we’ve accidentally broken
    another part of our solution.

    +   - To write our tests first, so that they become a contract for what we are
    trying to develop, and we know we have built everything we said we would.

    +   - To run those tests automatically, so they become part of a game – do our
    tests pass or not? If we get a green light, great! If not, because each test is
    so simple, it’s easy to find and fix the problem (and run again, to see whether
    we get the green light).

    +   - To write the tests using similar tools to the ones we used to build our
    solution, but to organize our tests a bit like scaffolding on a building. That
    way, it is clear what is the supporting testing framework, with the building (or
    core solution) being untouched.

    +   - To make these tests fun and easy to write, so they become part of the documentation.
    With good tests, a colleague looking at your decision model now has a working
    example of how to (re)use it.


    These bullet points are a philosophy and approach to building solutions. You may
    have been part of a project that follows these principles, often called **Agile,
    Scrum, or test-driven development.**'
  merge: -1
  img_proc: true
- pgno: 255
  md: 'Implemented correctly, the small upfront investment in writing tests will pay
    itself back tens or hundreds of times over. Even better, projects with tests are
    much less stressful to work on since you get notified of problems early when you
    have time to fix them without much fuss.


    > **Health warning – calling a project agile doesn’t make it agile**

    > There is a temptation for some managers to label a project Agile as an excuse
    to not do the hard work of project planning. But if you don’t invest in the tests,
    you will run into serious issues later (often when the original project managers
    have left). If you have had this experience, please keep an open mind for the
    next section – real test-first projects address a lot of the common pain points
    in developing technology solutions.


    There is a lot of information available on Agile, Scrum, and test-driven development.
    We’ll focus in the next section on the tools the KIE project provides to support
    this approach. We’ll cover one tool built into the KIE sandbox and one more advanced
    approach that you might want to implement in Excel. Finally, we’ll preview some
    of the advanced testing features available in Business Central (which we cover
    in more detail in *Chapter 10*) and Visual Studio Code (which we introduce in
    *Appendix B* and *Chapter 12*).


    # Run ... as Table


    You may have noticed when you were running previous examples in the KIE sandbox
    using the **Run ... as Form** option, that there was a second option (**Run ...
    as Table**). Let’s look at that now, since it’s a good step into the testing approach:


    +   1. We have the Bill of Materials option open in the KIE sandbox (downloaded
    model: `09 Bill of Materials.dmn`).

    +   2. In the sandbox, select **Run ... as Table**. A screen like *Figure 9.13*
    will appear. Note that we’ve removed some columns for clarity and added some test
    values to show more clearly how the table runner works.


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_255_0.png)


    Figure 9.13 – KIE sandbox table runner'
  merge: -1
  img_proc: true
- pgno: 256
  md: '+   3. Each line of this table is equivalent to using Run ... as Form as we
    tested our models with up until now. If we put the two values on the left (Qty
    and Product) as inputs, on the right, we can state the three outputs we expect
    (Grams of Cocoa in Product, Grams of Cocoa in PD: Please apply P-code style Order,
    and confirmation of the product name).


    +   4. The convenience here is that we can see multiple different orders at once,
    which allows us to quickly check for anything going wrong.


    While the table runner is a useful improvement, there are a couple of areas where
    it falls short of the test-first approach. The most important is that it does
    not flag where a test fails. For example, the third value in Figure 9.13 is a
    negative value, giving a spurious result. But it would be very easy to miss this
    – even if you spotted this the first time you looked at the image, could you guarantee
    to see the problem if this was one of the hundreds of output tables you needed
    to check?


    Fortunately, KIE does give tools to fix this problem. We’ll cover those tools
    later in this chapter – but since they are not (yet) embedded into the KIE sandbox,
    it’s worthwhile discussing an Excel-based solution to this problem.


    # Test cases using Excel


    If you look at Figure 9.14, you’ll see we’ve evolved our table runner in Excel
    to solve the problem of rogue tests being missed. While it has the same values
    as Figure 9.13, it’s immediately obvious when there is a problem, as it gets highlighted
    in red.


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_256_0.png)


    Figure 9.14 – A test scenario in Excel


    This is a very simple idea, with four main groups of columns:


    +   - Given are the values we are passing in

    +   - Expected are the values we think should be returned by the decision service

    +   - Actual are the values that came back in reality

    +   - Flag is the column to check whether the Expected and Actual values matched


    We won’t give a working example of running test cases in Excel since once you’ve
    grasped the key idea, the implementation is straightforward. You can set up this
    test spreadsheet, linking Excel with your decision service, using the approach
    you learned in Chapters 6 and 7.'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'The other details, such as conditional formatting, will be up to you, and the
    layout will be closely linked to the decision service that you have built.


    It’s worth highlighting that testing in Excel is a completely feasible approach.
    The scenario simulation approach we discuss in the next section is better again
    – but it does depend on tools that you may need support in setting up. You might
    find the next section hard, but achievable. As you work your way through it, know
    that you always have a backup plan for testing in Excel.


    # Scenario testing and simulation


    Testing in the Excel approach is good, but it is even better to write tests using
    similar tools to the one we built our model with. That way, our tests sit near
    our decision models and much more likely to be used and updated. Figure 9.15 gives
    a sample of KIE’s Scenario Simulation tool, which takes this approach.


    | # | Scenario description | GIVEN | | EXPECT | |

    | --- | --- | Product | Qty | Bill of Materials | Product Details |

    | --- | --- | value | value | value | value |

    | 1 | Silk Tray | "Silk Tray" | 125 | 18750 | 150 |

    | 2 | Crunch | "Crunch" | 10 | 100 | 10 |

    | 3 | Crunch | "Crunch" | -10 | 0 | 0 |


    Figure 9.15 – KIE Scenario Simulation editor


    Figure 9.15 is very similar in approach to the Excel test scenario in Figure 9.14.
    It has the same inputs (GIVEN) and expected outputs (EXPECT). When we run the
    scenario simulation, it highlights any variances between expected and actual.


    While this is a real screenshot from KIE, at the time of writing, the Scenario
    Simulation tool is not yet available in the sandbox. It is worth double checking,
    as the product roadmap is constantly evolving and may have changed by the time
    you read this. Instead, this Scenario Simulation tool is available in both of
    the advanced KIE decision modeling tools:


    +   - **Business Central**, the older decision modeling tool from the KIE team,
    still has more features than the sandbox. As you’ll see in Chapter 10, Business
    Central is very accessible to business users. There are a couple of setup steps
    that most Excel Power users will be able to follow, but some will need support.


    +   - **VS Code**, part of the toolkit aimed at developers rather than Business
    users. While many Excel users will be able to use it, not every reader of this
    book will want to take advantage of the power that it gives.'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'One key aim of this book is to give you a good foundation and clear next steps
    to explore further. VS Code from Microsoft is certainly one of these areas.


    # What is VS Code and why use it to test?


    You can use VS Code not just for writing decision models but also for a wide range
    of areas such as ML, web development, data science, and more traditional programming.
    To encourage you to take this next step, we''ll introduce VS Code in the following
    section, and explain (in Appendix B) how to use it to get started writing decision
    models and scenario tests. That Appendix uses the online version of VS Code with
    no installation, to get you up and running more quickly.


    VS Code is a free-to-use text editor and coding tool from Microsoft, with extensions
    that can handle pretty much any development project. In some of our earlier examples,
    we opened some files in a simple text editor such as Notepad. VS Code gives you
    a similar editor, but with the ability to have multiple text-like files open at
    once – look at the tabs across the top of the screen in Figure 9.16.


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_258_0.png)


    Even better, VS Code gives you code coloring and syntax highlighting, which might
    appear to be simple decoration, but do make the file a lot easier to read. On
    the left of the screenshot, you''ll also see that VS Code gives you a Windows
    Explorer-like view of all the files in your solution – including the decision
    model, scenario simulations (which can be seen in the main panel of the screenshot)
    as well as supporting files such as text, XML, and documentation in the .md markdown
    format.


    The dark gray bar on the left of the screenshot hints at the power available in
    VS Code. The icons change depending on the plugins we have installed – in this
    case, we have added the DMN extension from the KIE team. Other icons on this bar
    allow you to interact with GitHub repositories (in a more powerful way than we
    can do in the KIE sandbox), deploy items to Azure, and run individual files in
    your project.'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'What is even more impressive is that while there is a Desktop version of VS
    Code, this screenshot was taken using VS Code running within the web browser (which
    automatically sets up the Azure cloud-hosted Codespaces to do the heavy lifting).


    The final section of the screen (the bottom right) contains a lot of text. If
    you’ve used a terminal before (either on Linux, macOS, or Windows), this should
    be familiar. But since commands are typed rather than menus and mouse clicks,
    it may be intimidating to some readers who are seeing it for the first time. It
    is for that reason that we cover setting up and using scenario simulations and
    testing in VS Code in *Appendix B*, outside the main flow of this book.


    Since the instructions in *Appendix B* are given on a step-by-step basis, most
    users should be able to follow them. As VS Code is such a powerful tool that you
    will use across many different projects, I would highly recommend you dive in
    and give it a go – with the bonus of making the Scenario Simulation tools available
    to your project.


    # Summary and further reading


    We’ve linked to a lot of additional resources throughout this chapter. The KIE
    project blog has some very useful posts and videos about using test scenarios
    that are well worth spending time on. And if you want to explore DMN in more detail,
    an excellent next step is reading *DMN Method and Style* by Bruce Silver.


    But we’re not finished yet on these topics in this book. *Chapter 10* (where we
    cover installing Docker and Business Central) gives us another way to run our
    scenario testing editor. This is just as well, as the Machine Learning we cover
    in *Chapter 11* needs testing, even more than the rules-based AI that we’ve covered
    to date. Finally, in *Chapter 12*, we introduce the DRL format, a more advanced
    rule-writing format that works well alongside the graphical DMN notation that
    we learned more about in this chapter.


    This chapter aimed to give you a more advanced understanding of both decision
    models and the FEEL expression language embedded into them. Since more advanced
    models are more likely to break, we covered patterns to make your models more
    understandable, and techniques to link many simple models together. We learned
    about the importance of a test-first approach, and the tools that KIE provides
    to support it. Finally, we saw a glimpse of the advanced tooling in KIE as part
    of VS Code, as a way of encouraging you to explore more beyond the sandbox.


    *Beyond the Sandbox* might have been a good title for the next chapter – we continue
    to explore more ways to host both your decision editor and running models. Since
    that uses Docker, it gives us additional options to run both on-premises and in
    the cloud, building on the first glimpse of Azure that we saw with VS Code and
    Codespaces in this chapter. We’ll also look at Business Central as another way
    of running your scenario tests.'
  merge: -1
  img_proc: true
