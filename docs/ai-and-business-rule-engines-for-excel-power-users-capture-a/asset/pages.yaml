- pgno: 149
  md: '# A simple collaboration workflow using KIE


    We’ll assume that you have already linked KIE and GitHub:


    +   1. Invite your colleague to collaborate as per the previous instructions.

    +   2. Both of you will have a local copy (in KIE Sandbox) so you can continue
    to edit as before.

    +   3. You can continue to push your changes to GitHub, but your colleague may
    need to create a pull request asking you to inspect their work before accepting
    or rejecting it onto the main branch.

    +   4. Git will notify you of any conflicts (for example, if both of you edited
    the same file at the same time) and will give you the opportunity to resolve them.


    You’ll note that we haven’t described either of these workflows in great detail.
    There are many other ways of using Git and GitHub, but as an industry-standard
    collaboration tool, it is well worth learning the basics of versioning, main and
    other branches, repositories, and the concepts of pushing and pulling files. At
    a minimum, we recommend using the simple one-person workflow to back up your files,
    and to build your confidence with the GitHub tools.


    We’ll walk through one final example of using GitHub that isn’t really a workflow
    but is useful when trying out examples as you work through the book.


    # Importing models directly from GitHub


    As a reminder, there are several options to import decision models on the KIE
    Sandbox homepage. This includes the option like in *Figure 5.33* to import a model
    directly from GitHub, where the URL is the homepage of the project that you want
    to use.


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_149_0.png)


    Figure 5.33 – Importing a decision model directly from a GitHub repository


    This is very useful since GitHub hosts many samples (such as the ones for this
    book) that you just want to download and play with and don’t want to put under
    full version control.'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# Summary


    In this chapter, we moved from editing our decision models alone to being able
    to show our work to colleagues and collaborate to develop those models.


    We covered OpenShift as Red Hat’s cloud offering and deployed our KIE decision
    models into it. We also covered GitHub as a collaboration site and showed how
    to use it for common collaborative workflows.


    Since we now have a firm basis for building and deploying our decision models
    with our colleagues, we will move on to linking them to a tool that many of them
    use: calling our decision models from Excel.'
  merge: -1
