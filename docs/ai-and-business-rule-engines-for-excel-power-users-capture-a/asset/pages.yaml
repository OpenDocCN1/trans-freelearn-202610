- pgno: 300
  md: '# What is Python and why use it in the notebooks?


    If you opened the notebook, you would see that it uses a scripting language called
    **Python**.


    This is a good choice—not only is Python easily understandable by Excel power
    users but it also has perhaps the widest range of toolkits and ML libraries available
    to help you. As a bonus, you’re likely to find yourself using Python in other
    situations.


    The Python examples in this book are easily understandable. But if you are interested
    in learning more, Packt Publishing has many good books: `https://subscription.packtpub.com/search?query=python`.


    Before we start using notebooks and Python to train our ML models, we need to
    take a quick look at the various classifiers available to use in our models.


    # Naïve Bayes and other classifiers


    We’ve made some very simple statements in this chapter: all math is a graph; drawing
    a line can separate clusters on that graph; ML is about finding where to draw
    the line.


    The reason we can make those high-level statements is that a lot of work has already
    gone into the ML algorithms, and those algorithms are available for us to download
    and use in Python (for example, using the `sklearn` package). And we can swap
    between algorithms in that package to find out what works best, without understanding
    the full detail of the math behind it.


    Of course, understanding some of the math will help you get further faster, which
    is why I would encourage you to read the following article, which explains the
    key algorithms in a graphical, no-code way: `https://www.freecodecamp.org/news/a-no-code-intro-to-the-9-most-important-machine-learning-algorithms-today/`.


    While this article explains the different approaches, a good default approach
    is the **naïve Bayes** algorithm. It’s naïve in that it assumes there is no link
    between the various features or dimensions in your data, which is often not true.
    But it does provide a good starting point as it gives reasonable (but not outstanding)
    results on many datasets. Just to prove the math is understandable, google **naïve
    Bayes Excel implementation** to find a demonstration that it can be calculated
    in a spreadsheet. We’ll stick with the Python version as it is much faster.'
  merge: -1
  img_proc: true
- pgno: 301
  md: '# Simple classifiers versus neural networks


    We’ll refer to the ML algorithms we use in this chapter as simple classifiers.
    They are effective, simple to use, and fast. Typically, these types of classifiers
    can get to work after one pass through the training data. For many problems, these
    simple classifiers will get good results.


    For more complicated problems, we may use neural networks. We touch on those in
    *Chapter 12* as neural networks are responsible for much of the buzz around AI
    in recent years. Neural networks need to be *trained* over multiple passes through
    the training data and are much more configurable (both the structure of the network
    and the initial weightings used).


    We take a practical approach in this book, and toolkits such as `sklearn`, PMML,
    and KIE make it easy to switch between the approaches once you understand how
    each works.


    # Training models in Azure Machine Learning


    Since our aim in this chapter is to give a broad introduction, we’re going to
    train our first naïve Bayes model using Azure ML to give you a gateway into the
    other tools and techniques offered by Microsoft. Azure ML is not strictly required—the
    Python notebook will happily run in VS Code online using the method we introduced
    earlier in the chapter. If you’re following this approach, skip to the *Step-by-step
    training of the ML model* section. But since Azure gives additional ML tools aimed
    at Excel power users, it is worth following the instructions in the next section
    to get up and running in Azure ML (formerly known as ML Studio).


    # Setting up Azure Machine Learning


    To get started, if your organization doesn’t already have an account, sign up
    for the free trial at `https://azure.microsoft.com/en-us/products/machine-learning/`.
    Microsoft typically offers $200 of credits, with many services free for the first
    year.


    We won’t detail the account creation process (including verification via phone
    number) as it is typical of many online services. We’ll assume that you’ve created
    an account, have signed in, and are seeing the Azure home screen for the first
    time, as in *Figure 11.8:*


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_301_0.png)


    Figure 11.8 — Microsoft Azure home screen'
  merge: -1
  img_proc: true
