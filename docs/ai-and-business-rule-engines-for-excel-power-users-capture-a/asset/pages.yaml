  md: '![](img/48815d6f06dc8c7aeaa3963d289fb1e7_188_0.png)


    Figure 7.2 – Referencing the libraries our code sample needs


    +   2. Select the two libraries we need – Microsoft Scripting Runtime and Microsoft
    XML. You may need to scroll down to find them.


    +   3. Click OK, then run the code sample like before. Everything should now work
    correctly.


    # Next steps after VBA


    The good news is that Kogito exposes the KIE AI, decision services, and business
    rules via a standard REST web interface. It is agnostic to what technology is
    used to access that interface. So, most of the more advanced techniques described
    in this book remain available to you as a VBA developer.


    While we encourage you to look at other technology solutions, we recognize that
    there are good reasons for you to call the decision service using VBA. When done
    correctly, moving (some) of your decision logic out of Excel and into a Kogito-based
    decision model is an important first step to untangling what could be a messy
    legacy code base. Let’s take a look at a more modern approach – Microsoft Script
    Lab.


    # Meet Microsoft Script Lab – a modern version of VBA


    Script Lab is a free Microsoft add-in for Excel, downloadable from the official
    app store. If you’re new to scripting in Excel, here’s a rundown of what Script
    Lab gives you:


    +   It allows you to automate any boring, repetitive actions in Excel. So, a list
    of steps gets executed at a simple press of a button.


    +   It gives you an editor within Excel to write your scripts – with guidance
    as you type to suggest the keywords you are looking for.


    +   It gives you a way to save and share your solution with other users.'
  merge: -1
  img_proc: true
- pgno: 189
  md: "Microsoft Script Lab is what a modern version of VBA would look like. It leverages\
    \ familiar web technologies such as HTML and JavaScript and gives many more options\
    \ for a responsive user interface. Even if you don’t know these technologies,\
    \ you can see the value in investing your time to learn them. Script Lab also\
    \ runs within Excel, both on your laptop and on web versions of Excel. It comes\
    \ with a code editor that automatically refreshes, allowing you to have a rapid\
    \ code-test-update-test cycle to quickly build your solution.\n\nMicrosoft has\
    \ a 1-minute video that is well worth watching as an introduction: `https://www.youtube.com/watch?v=yt6os8zPUKc`.\n\
    \nLike all the tools we introduce in this book, Script Lab gives you a clear path\
    \ and the next steps to evolve your solutions even further. This could be using\
    \ Office Scripts (which we will cover later in this chapter, in the *What is Office\
    \ Scripts?* section), building full add-ins for Excel, or using Script Lab on\
    \ other Office products, such as Word or Outlook. Since Script Lab’s editor uses\
    \ similar technology to Visual Studio Code, not only is it powerful but it also\
    \ gives you a head start if you decide to use it as an advanced editor.\n\nOne\
    \ term that you’ll see mentioned often in this chapter is **Office.js**. Office.js\
    \ refers to the way that our scripts communicate with Excel, for example, to get\
    \ values from a range of cells, or to update the background color of a worksheet.\
    \ Office.js is used by both Script Lab and Office Scripts, which makes it easier\
    \ to switch between these two tools. More information is available at `https://developer.microsoft.com/en-us/office`.\n\
    \n> **Where’s the recorder?**\n> \n> If you’re familiar with VBA, the biggest\
    \ thing missing in Script Lab is the recorder – the ability for Excel to capture\
    \ your actions as a script that you can edit later. The recorder is particularly\
    \ useful for learning how to manipulate Excel objects such as ranges and worksheets.\
    \ Thankfully, Office Scripts (see the next section in this chapter) does have\
    \ this recorder, and the Office.js interface for manipulating ranges and worksheets\
    \ is similar in both tools.\n\nThere’s a lot we can do with Script Lab, not just\
    \ for linking Excel with our decision service. But first, we need to install it,\
    \ take a tour, and try out a `Hello World` example to get more familiar with it.\n\
    \n# Installing Script Lab in Excel\n\nInstalling Script Lab on either desktop\
    \ Excel or Excel 365 online is easy using the Microsoft official store. Our screenshots\
    \ show the steps on the desktop version. The online installation is very similar:\n\
    \n+   1. In Excel, click on the **Insert** menu, then on **Get Add-ins**.\n+ \
    \  2. In the Microsoft Store dialog that appears, search for `script lab`, as\
    \ in *Figure 7.3:*"
