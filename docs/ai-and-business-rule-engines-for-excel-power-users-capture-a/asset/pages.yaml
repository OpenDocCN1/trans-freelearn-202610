  img_proc: true
- pgno: 184
  md: '# Do I really need to know about Visual Basic for Applications?


    The simple answer to that question is no. If this is your first time scripting
    in Excel, you don’t need to know VBA since it is a legacy solution. Unless you
    or your company already use Visual Basic extensively, please skip to the next
    section, *Meet Microsoft Script Lab – a modern version of VBA*, to read about
    a better alternative.


    I have a lot of fondness for Visual Basic. It formed an important stepping-stone
    in my own career and still powers many Excel spreadsheets worldwide. So, it is
    with the greatest respect that I recommend you *avoid* using VBA wherever possible.
    Even in this short section, you’ll recognize its limitations – security restrictions
    that you cannot control on users’ machines, the ability to run only on desktops/laptops
    (not in Office 365), and its clumsiness in sending and receiving JSON data over
    the web. Remember that Visual Basic was born before the internet took off, and
    its age shows that.


    On a positive note, migrating business logic out of VBA and Excel and into Kogito
    decision services is a good first step to making the situation better. So, if
    you have one of these many older spreadsheets, or feel this is a route you must
    take, please read on! We need to start with something that the users of your spreadsheets
    will encounter – security checks.


    # Security checks in running Excel macros


    I feel compelled to give you a stern warning before you download the first sample
    for this chapter from the usual GitHub site: https://github.com/PacktPublishing/AI-and-Business-Rules-for-Excel-Power-Users.


    Immediately after downloading the sample file, 07_Decision_Service_VBA.xlsm, Windows
    will give a security warning. This is because Excel files containing VBA from
    malicious authors have been known to act as a virus.


    Compounding the problem is that Excel files are binary files, and the macro can
    be set to auto-run when you open them. You will not get the chance to inspect
    them properly like the other book examples, which you can open in a normal text
    editor before running. Remember the earlier caution we gave about trying to avoid
    using VBA if possible? The other approaches later in this chapter do not have
    these security limitations.


    # Security warnings can halt the adoption of your solution


    Keep in mind that any user you distribute your Excel workbook to (including the
    VBA scripts) will get similar security warnings. From personal experience, these
    warnings cause friction with users and will interfere with the successful rollout
    of a VBA-based solution – no matter how good it is.


    While I’d like to think you trust me as an author (after all, we’ve got to this
    point in the book together), encouraging you to execute VBA files you’ve downloaded
    from the internet is a bad idea. So, you might want to skip the download and just
    read through the text descriptions on the following pages instead.'
  merge: -1
  img_proc: true
