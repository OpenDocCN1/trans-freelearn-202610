- pgno: 18
  md: 'Other people will also find the book useful, such as machine learning experts
    looking for a rules-based safety net for their predictive models. The book will
    also have value for developers who are looking for a more structured approach
    to implementing AI and business logic, no matter what language they use.


    # When you should read this book


    The quick answer to when is now. More and more businesses are moving online and
    adopting digital tools – and that’s even before you consider the wave of disruption
    that AI is hit most office-based jobs with.


    Excel is a great starting point for this move, but sooner or later, you will need
    a pathway to more powerful solutions. This book gives you one clear pathway. It
    has the added bonus that capturing your knowledge in a when ... then format separates
    the business knowledge from the technical implementation, making your investment
    much more likely to last into the future.


    # What this book covers


    Chapter 1, Wrestling with Excel? You Are Not Alone, outlines the problems you
    might face in Excel, but reassures you that you are not the only person to encounter
    these issues and shows how an AI-based rules approach can help.


    Chapter 2, Choosing an AI and Business Rules Engine – Why KIE and Drools?, shows
    why the rules engine and AI tools from the KIE project are the best choices for
    you as an Excel user, and welcomes you to an open community supported by IBM and
    Red Hat in which you can get ongoing support.


