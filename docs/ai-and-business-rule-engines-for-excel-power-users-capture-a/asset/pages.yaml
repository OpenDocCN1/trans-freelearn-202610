- pgno: 37
  md: '# More reading on AI


    We’re focusing, in this section, on *AI for Excel power users*. It won’t surprise
    you that, with such a hot topic, there are many books on these and other AI-related
    techniques – with many going into very powerful but niche technical details. The
    Packt website has many suggestions: https://subscription.packtpub.com/search?query=artificial+intelligence.


    If you’re interested in “how we got here” and more details on AI concepts, *A
    Brief History of Artificial Intelligence* by Michael Wooldridge (Flatiron) provides
    a good summary. In this book, we’ll concentrate on practical tools that you can
    use now in your work based on a rules-based AI approach.


    We’ll return to the area of machine learning in *Chapter 11*, when we explore
    other types of AI tools in a little bit more detail.


    # *Artificial intelligence type one – machine learning*


    If you’ve only heard of AI in the last couple of years, most likely you’re.


    Hopefully, people working in the machine learning field won’t be insulted when
    I describe neural networks and other techniques to achieve this as a *load of
    fancy math*. It’s even possible to implement simple versions of these networks
    in Excel – take a look at *Chapter 12*. Of course, for most practical purposes,
    you’d use tools more optimized for machine learning.


    The math theory behind these tools is truly impressive, as are the breakthroughs
    in thinking in recent years. These tools have progressed and been packaged so
    that they can solve off-the-shelf problems for a non-technical user. We’ll use
    them as part of our wider solution in a later chapter.


    However, your problem is likely not one that can be solved with a fully off-the-shelf
    solution. If it was, you’d be using one of the pre-built solutions we mentioned
    earlier, instead of your own Excel spreadsheets.


    Another issue is that traditionally, neural networks have found it very hard to
    explain how a decision is made – you know the samples used to train the network,
    you know the output, but you can never be completely sure how it came to the answer
    it did.


    A final issue is that you’re unlikely to have the millions of samples needed to
    effectively train a neural network. More likely, you’ll have several hundred samples
    (for example, of a home loan application) and a human expert with the knowledge
    in their head.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# *Artificial intelligence type two – natural language processing*


    What if the business expert could *talk* to a computer in something close to normal
    human language, and have the computer understand what that expert meant? Until
    recently, this was the stuff of science fiction – humans previously needed to
    use a more constrained language with perhaps about 100 words, used in a very specific
    order. If you’re not a programmer, think of how you’d talk to a 2-year-old child.


    Recently, researchers solved this problem by using millions of documents to train
    different neural networks. You’ve probably used the results of these, for example,
    Google Translate. More recently, *GPT-3* and Microsoft tools such as *Copilot*
    (https://copilot.github.com/) have shown great promise in translating from normal
    English into Java, Python, and other computer code that computers can execute.


    While I think these tools will evolve rapidly, and welcome anything that gives
    more people the ability to program, we’ve just duplicated the problem that we
    ran into before with the web-based mortgage calculator. Whether it’s a colleague
    or a computer writing the code for us, once our knowledge is *translated* into
    code, it becomes much more difficult to check whether this code accurately represents
    the business rules we want.


    What we really want is a way to keep our business rules simple, and for the computer
    to learn how to apply these rules to our current business problem.


    # *Artificial intelligence type three – rule based*


    Some of the first attempts at AI consisted of making statements that were known
    to be true and letting the computer *figure it out* from there. Examples of these
    statements for a car-driving computer could include the following:


    ```

    When the driver says "go" start the engine.

    When there is a stop sign and there are humans on the road,

    then stop.

    When there are no stop signs and the road is clear, then

    accelerate to 50km/h.

    When there is a person visible in the road, then the road is

    not clear.

    ```


    Based on what we’ve said about other approaches, you may notice some things straight
    away:


    +   - These rules are written in something close to an English language format,
    even if they follow a slightly formal when ... then structure.

    +   - These rules did not need hundreds of millions of examples to create. It
    just took one author (who passed his driving test a long time ago) to write them,
    and a second person to review them to make sure they made sense.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '+   - To us as humans (and hopefully expert drivers), these rules are clear.
    If we need to change the rules (for example, if the law changes the speed limit),
    they are easy to review and edit.

    +   - The rules are independent of each other. If we edit the speed rule, we don''t
    need to revisit our rule about the stop signs. We let the computer worry about
    the interactions between the rules, which makes the rules themselves much easier
    to understand

    +   - While the rules are clear, we probably want to test the outcomes. For example,
    when the car is moving at 50 km/h and somebody steps out into the road, rules
    3 and 4 are no longer true – but will the car actually stop (we have no specific
    rule telling it to do so)?


    # Truth maintenance


    *Withdrawing* a rule when it is no longer true is called **truth maintenance**.
    In this case, it should cause the *when the road is clear* rule to be withdrawn
    and the car comes to a stop.


    Would you trust this rule? Most business rules will be more explicit – and include
    a rule such as *when there is no explicit signal to drive, then stop*. Even then,
    it is vital to scenario-test the rules – a topic we will cover in *Chapter 9*.


    Most Excel spreadsheets, while they may contain hundreds of business rules, are
    actually a lot simpler than our driving-based example. We’ve never had to teach
    an Excel spreadsheet how to recognize a stop sign. We’ve also never connected
    an Excel sheet to a car accelerator to make it move forward.


    This is just as well, since rules-based AI performs much worse at these general
    tasks. Can you imagine the hundreds of rules you’d need to describe traffic signs,
    and even then not be sure whether you’ve described them all? It’s a pretty open-ended
    problem. But for problems that can be fully written down (for example, the laws
    governing how to drive correctly), rules-based AI is a good match.


    By definition, problems that you can describe in Excel can be fully written down,
    making them a good match for rules-based AI.


    So, for most Excel applications, rules-based AI is what we’re going to be able
    to make the most progress with, and it’s the one we’ll focus on in this book.
    We’ll revisit complementary approaches later in the book, in *Part 3, Tools to
    Extend Business Rule Engines and Excel into a Complete Solution*, just to make
    sure we’re getting the full picture.


    # Types of AI working together


    If you really are building a self-driving car, then I highly recommend you read
    the other AI books from Packt. But otherwise, it’s a good example to show the
    different types of AI working together. You would use natural language processing
    to listen to driver commands (*drive to the restaurant*). You would use neural
    networks in computer vision to recognize road signs. And you would use rules-based
    AI to guarantee that you followed all relevant driving laws (*stop at the stop
    sign*).'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'Our self-driving car example highlights two more benefits of the rules-based
    approach:


    +   - The rules we are applying are pretty clear – they’re not hidden in obscure
    code or buried in the weightings of a neural network. This clarity extends to
    bias. If there is bias in our rules (they are written by humans after all), we
    can at least examine and challenge them. This is not always true for other types
    of AI, especially if they are trained on biased data.

    +   - We can almost guarantee that certain business rules will apply in certain
    situations. The *almost* but not certainly being able to guarantee the behavior
    is due to the interplay of different business rules. But we can test for this
    and modify our business rules as appropriate.


    Both these strengths address the weaknesses of the neural network AI approach
    in particular. This is not a book written for Google or Tesla AI engineers, but
    if you are one, consider using rules-based AI as a safety net underneath the systems
    you are developing!


    As great as the rules-based approach to AI is, we still need something to run
    these rules (we’ll talk more about rule engines shortly). While we haven’t yet
    addressed some of the problems we highlighted previously (for example, change
    tracking), we’ll see later how the tools around a rule engine will help us solve
    that problem as well. Before that, it’s worth looking more at what a business
    rule is in more detail, as it’s core to this approach to AI.


    # Practical artificial intelligence and business rules


    The preceding business rule examples deliberately used a when . . . then format.
    This was no accident; the format gives clarity about the knowledge we are trying
    to share with the AI system.


    # The when ... then format


    Let’s highlight the key format for writing business rules:


    ```

    When "something is true" then "take some action"

    ```


    This is a very simple concept, so simple that if you’re an Excel power user (or
    have programmed in other languages), this is something that might trip you up.


    In Excel, the flow is important – one cell references another, which might reference
    a third cell – but the order in which the values will be calculated is guaranteed.
    Likewise, in computer languages such as Java or VBA, statements are executed strictly
    in the order they are written (with options to loop and call functions).


    A business rule can activate any time the "when" part is true – there is no guarantee
    of the order the rule statements will fire in.


    The reminder is that we use when not if – when the first part of the rule is true,
    we should try to ensure that the then action is taken. Most programmers will struggle
    with this subtle difference – they are used to controlling if the code should
    branch, instead of trusting the rule engine to decide when something is true and
    that it should be executed on their behalf.'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'To an Excel user, this sounds like a recipe for chaos. Obviously, once we start
    executing these rules, we need some sort of engine to manage all of this for us.
    The engine will decide the following:


    +   1. Which rule(s) are activated and which have valid conditions and therefore
    should be fired.

    +   2. If more than one rule is ready to fire, which one goes first.

    +   3. If a rule is no longer true before it has fired, to remove it from the
    list.

    +   4. Repeat the steps from step 1, unless there are no more rules ready to fire.


    Thankfully, and as we’ll see soon, there are ready-to-go rule engines that can
    effectively manage all of this complexity for us.


    ```

    When "something is true" then "take some action"

    ```


    By the time you have written many hundreds of business rules, you’ll see that
    this simplicity makes the rules easy to maintain. At the same time, how the rules
    interact can give you some very sophisticated results.


    Don’t believe me? Let’s take a look at a real-life situation that shows the power
    of this format.


    # Triage – life or death business rules


    Imagine you are standing in the Accident & Emergency section of your local hospital
    when a major incident occurs. Ambulances are bringing in victims with different
    levels of injury and the doctors in the hospital are getting overwhelmed by the
    number of people arriving. More help is on its way, but by the time they arrive,
    it could be too late for many people.


    You ask whether you can do something, anything to help, weakly mentioning the
    basic first aid certificate you got many years ago (having covered nothing like
    situations like this). You get handed a set of cards like the ones represented
    in Figure 1.4 and are told to follow the instructions:


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_41_0.png)


    Figure 1.4 – Manchester triage system cards'
  merge: -1
  img_proc: true
- pgno: 42
  md: "In total, there are 84 cards like those shown in *Figure 1.4*. While these\
    \ cards are written for nursing professionals, they are so clear that even an\
    \ untrained person can follow the when ... then format:\n\n```\nWhen there is\
    \ Abdominal Pain ... then take the medical action listed\n```\n\nYou are never\
    \ going to be able to replace the years of training and experience of surgical\
    \ and nursing staff. But in a situation where all of those staff are busy, they\
    \ have successfully shared their knowledge with you using these cards. Or they’ve\
    \ shared enough knowledge that you can make a difference to the people who need\
    \ help.\n\n> **More on the triage system**\n> \n> Details of the Manchester triage\
    \ system and the PDF shown in *Figure 1.4* can be found here –\n> `http://www.gptriage.info/practice-nurse-triage-guidelines.html`.\n\
    > Both documents are great examples of business rules and are frequently updated\
    \ and revised with best practices – but they are medical guidelines, so take care\
    \ in reading them if you are slightly squeamish.\n\nThankfully, our particular\
    \ example is unlikely to happen to you. But there is a reason why people make\
    \ a considerable effort to capture their knowledge as a set of business rules:\n\
    \n+   - The intended audience for these cards is highly trained medical professionals.\
    \ But as *best practices* change over time, capturing such knowledge on the cards\
    \ allows everybody to review and agree on the best treatments for each situation\
    \ and continuously share this knowledge.\n+   - While we all would like to be\
    \ treated by the best surgeon, during an emergency, the best support available\
    \ is often from the person that gets to you first. Having these cards means that\
    \ *knowledge is shared*.\n+   - Many people will be involved in treating a patient\
    \ during their time in the hospital. *Consistency* is important – not having to\
    \ recheck the work of your colleagues means professionals can focus on their part\
    \ of the patient’s medical treatment.\n\n# Business rules in your organization\n\
    \nYou probably have (or should have) paper-based business rules in your organization.\
    \ Some examples could be safety guidelines for visitors to a construction site,\
    \ a checklist before running a major event (such as a product launch), or even\
    \ anti-fraud guidelines to be followed during an audit.\n\nWhere these business\
    \ rules become really powerful is when we have them not only documented but also\
    \ available for automated execution. This means that the rules don’t just exist\
    \ on *paper* – you guarantee that what is documented is also what is executed\
    \ and applied. This increases the importance of getting the rules “correct,” which\
    \ reinforces the value of having a centralized source of rules that can be discussed\
    \ and agreed upon with appropriate updates whenever best practices evolve."
