    # Extending our example


    To keep this example simple, we hardcoded the values that we passed. It is trivial
    to read these values from an Excel cell instead, using an approach like that shown
    in *Appendix A*. Another shortcut that we took is the previous script only shows
    the values in a message box. In real life, your solution would probably do something
    more sophisticated – such as updating the values back into the Excel spreadsheet.


    Since Excel is clumsy in dealing with JSON, you’re probably going to need some
    help in parsing the response to extract the values you need. Downloading and importing
    the widely used VBA-JSON library into your VBA project is a good first step. It’s
    available at `https://github.com/VBA-tools/VBA-JSON/releases`.


    The downloadable code sample from the book’s GitHub page gives some more lines
    where it iterates through the individual JSON values returned by our JSON call.
    But since the JSON will vary from service to service, we highly recommend you
    add error handling to it to handle all possible situations.


    When you write your VBA script, it is very possible that you will make mistakes
    in the text you are passing over to the REST API. Like in *Chapter 6*, we recommend
    using a tool such as HTTPie to test the values you are passing in and out to see
    whether the error is in the REST API or in your VBA code.


    You’ll see from even this short code sample that VBA suffers from not having native
    JSON handling. Another shortcoming is that on every machine that you want to run
    this code, you must manually set the project references. Let’s walk through how
    to fix it.


    # Fixing project references


    If you are getting an error similar to **User-defined type not defined** when
    trying to run your VBA script, then the most likely cause is that you’ve forgotten
    to specify the additional libraries you want to use. This is easy to do but will
    need to be done on every machine that you wish to run the project. The steps are
    as follows:


    +   1. In the Visual Basic editor, select **Tools** then **References** to open
    the references editor, as shown in *Figure 7.2*:'
