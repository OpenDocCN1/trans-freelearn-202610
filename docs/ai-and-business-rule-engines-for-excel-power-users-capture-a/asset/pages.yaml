    \nYou don’t need to have learned this reference material inside out – it is okay\
    \ to know that it is there when you need to reach in and use a particular function\
    \ from the toolkit. Let’s start by reminding ourselves of what we already know.\n\
    \n# DMN and FEEL expressions – extending what you know\n\nAs we worked through\
    \ *Chapters 3 and 4*, we covered many of the key points of the FEEL expression\
    \ language:\n\n+   - We saw that FEEL allows you to write boxed expressions (like\
    \ what you type into the Excel formula box). There are many different places that\
    \ you can use FEEL expressions – from decision nodes to lists to decision tables.\n\
    +   - One sort of FEEL expression was text and string manipulation – we used it\
    \ to create a `Hello [your name]` example. If you’ve read the reference docs,\
    \ you’ll have seen that most text functions in Excel have an equivalent in FEEL.\
    \ This includes converting strings into uppercase or lowercase, extracting text\
    \ from the beginning, middle, or end of the text, replacing values, testing whether\
    \ the text starts or ends with specific values, as well as splitting or combining\
    \ text.\n+   - We used variables as placeholders for different values. Looking\
    \ at the reference docs, you can see that the functions available to manipulate\
    \ Booleans and numbers are very similar to Excel. We’ll cover date and time handling\
    \ in a bit more detail as while the concepts are familiar, the format of the functions\
    \ is slightly different.\n\n> **Three types of Boolean values?**\n> \n> You would\
    \ expect Boolean values to evaluate to either True or False. However, FEEL allows\
    \ a third value, Null (or *empty*), where no value has explicitly been assigned."
