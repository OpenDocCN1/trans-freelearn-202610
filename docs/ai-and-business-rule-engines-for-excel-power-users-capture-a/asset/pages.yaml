- pgno: 163
  md: '> **Later – HTTPie as a debugging tool**

    > Even if you don''t install HTTPie now, keep it in mind for later – it can help
    us decide whether any issues are being caused by the formulas we write, by the
    request we send, or by the decision server we call. Knowing where the issue is
    helps us fix it more quickly.


    Since we now know how to make a successful machine-to-machine web request, let''s
    use Excel to make one of those requests in our decision service. Let''s start
    with the easiest way of doing this, using Power Query in Excel.


    # Calling the decision service using Power Query


    We explained earlier that Power Query allows you to connect Excel to a wide range
    of data sources. We''ll focus in the next section on using it to connect to the
    decision service REST API. But if you are curious about what else it can do, I''d
    encourage you to check out the Power Query and related Power BI series from Packt:
    https://subscription.packtpub.com/expert-reading-lists/power-bi-for-business-intelligence-beginner-to-advanced.


    Connecting Excel via Power Query takes lots of simple steps that we will cover
    one by one: a simple REST call, passing in parameters, and a more advanced POST
    call, before combining them to link Excel and our decision service.


    # A simple Power Query REST example


    We''re going to work through the most simple Power Query call to an external API
    possible – the GitHub API we encountered earlier at https://api.github.com/repos/OfficeDev/office-js.


    This a GET call, with no parameters, which makes it the perfect starting point.
    The completed example is downloadable from the book''s GitHub sample site – https://github.com/PacktPublishing/Business-Rule-Engines-and-AI-for-Excel-Power-Users
    as 06_simple_power_query.xlsx – but I''d encourage you to work through the following
    steps as well:


    +   1. In Excel, select the **Data** menu, then **Get Data**. You should see a
