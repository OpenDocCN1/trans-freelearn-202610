- pgno: 183
  md: '# Using Business Rules in Excel with Visual Basic, Script Lab, or Office Scripts


    In the previous chapter, we said that no matter what technique we use to link
    Excel to our decision service, the approach is similar. We''ll prove that in this
    chapter. Power Query is a great approach but has limitations. We''ll explore linking
    Excel and decision services using Visual Basic, Script Lab, or Office Scripts
    – which approach you use is your choice. Along the way, we''ll cover the following
    topics:


    +   - Calling decision services from Excel using Visual Basic for Applications

    +   - Installing Microsoft Script Lab and using it to link Excel with our decision
    service

    +   - Introduction to Office Scripts and making the link to our decision service
    using that Excel script online


    Why are we covering multiple ways of doing essentially the same thing? We''ll
    explain that in this chapter as well, exploring the strengths and weaknesses of
    each approach.


    Since it has by far the largest install base of all the approaches, a good place
    to start this chapter is with Visual Basic for Applications (VBA).


    # Calling decision services using Visual Basic for Applications


    There are plenty of good reasons to consider linking Excel and your decision service
    using VBA. You may have many years of experience in Visual Basic. Or you may have
    inherited a code base that uses a lot of VBA logic, and your organization isn''t
    ready to migrate away from it. Since this chapter assumes familiarity with Visual
    Basic, if it''s been a while since you used it, take a look at Appendix A, for
    a refresher.'
