- pgno: 316
  md: '# Running our integrated model


    As you’ve seen, KIE Sandbox supports editing decision models with both ML and
    rule-based elements. Up until now, we’ve taken for granted the ability to *edit*
    these combined models using KIE Sandbox.


    The ability to *execute* combined rules and ML model features is already present
    in the other KIE decision model tools—for example, the VS Code plugin you may
    have used in *Appendix B*. While it is on the roadmap to be added to the KIE Sandbox
    Extended Services, it has not yet (at the time of writing) been implemented.


    While we have already proven the main point of this chapter (an introduction to
    ML), showing the power of the two approaches working together, this is a practical
    book. I really want to leave you with tools for running these combined ML and
    rules models. So, *Table 11.1* shows the choices you have right now as an Excel
    power user to execute these combined models:


    | Option to run combined ML and rules models | Advantage | Disadvantage |

    |---|---|---|

    | *KIE Sandbox (and Extended Services)* | The easiest option when implemented.
    | On the roadmap—date to be confirmed. |

    | *The VS Code plugin* | Kogito provides working examples of PMML within DMN decision
    services. More in *Chapter 12*. | Slightly more technical, although no more so
    than using the test scenarios we covered in *Chapter 9*. |

    | *Business Central* | Examples are given in Drools’ documentation. Running Business
    Central is covered in *Chapter 10*. | Business Central works best if you have
    enterprise support with some knowledge of Java. |

    | *Integrate ML and rules models using Power Automate* | The most accessible solution
    to Excel power users—we will cover this in *Chapter 12*. | Need to bring several
    easy-to-use pieces together using Python. |


    Table 11.1 – Options to execute our combined rules and ML models


    As we’ll see in *Chapter 12* when running the full PMML samples that come with
    Kogito, the capability to execute combined rules and ML models is already available.
    The challenge is to make it easily usable by Excel power users—so, in the next
    chapter, we also suggest an easy-to-use method based on what we know already in
    Power Automate and Python. Before we look at that, let’s do a summary of what
    we have learned in this chapter.'
  merge: -1
  img_proc: true
- pgno: 317
  md: '# Summary


    The topics we covered in this chapter were the idea that ML is as simple as drawing
    a line on a graph, with the learning piece being teaching the machine to find
    where that line should go. We walked through a simple learning model based on
    naïve Bayes, and in the notebook that implemented the model, we highlighted where
    we could drop in other algorithms. We ran that notebook on Azure ML and generated
    a graph to test whether our predictions were in line with what we expected.


    Exporting our trained model as a PMML file, we included it in a rules-based decision
    model. We updated our previous chocolate bar recommendation service using this
    technique and showed that it was very feasible to build a model combining the
    best of each type of AI. Finally, we discussed our options as Excel power users
    for executing these combined models.


    This theme of introducing advanced topics to explore further continues in our
    next and final chapter. That extends several topics we glimpsed at in this chapter—including
    neural networks, explainable AI, and deploying combined ML and rule-based models
    in an enterprise situation.


    # Further reading


    This chapter was written to give you the confidence and the desire to know more
    about machine learning. We introduced several key topics that your interests may
    lead you toward, from learning more about Azure and Azure ML to taking a deeper
    dive into Python notebooks and the different algorithms implemented in them. All
    of these topics have Packt Publishing books available on them.


    At this point, it is also worth (re)viewing the Kogito and Drools documentation
    with a focus on the AI tools and integration, since much of the information there
    will now make a lot more sense to you, as well as giving practical steps on how
    to deploy combined rules and ML decision services.


    One non-Packt Publishing book that I highly recommend is *Mathematics for Machine
    Learning*. It’s available as a free/open book from `https://mml-book.github.io/`.
    While it is very clearly written and accessible, it is still a math book. So,
    while it is a fascinating read and will enhance your knowledge of ML, it is not
    essential to get value from the techniques we introduced in this chapter.'
  merge: -1
  img_proc: true
