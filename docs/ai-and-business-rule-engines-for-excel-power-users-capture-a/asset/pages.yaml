    with us:


    +   1. Open your project (not personal) settings page on GitHub. You’ll find this
    under the project name (like on the far right of Figure 5.31):


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_147_0.png)


    Figure 5.31 – Finding the project settings on GitHub


    +   2. Once you see the project settings screen, click on the collaborator’s options,
    and you’ll have the option to invite colleagues like in Figure 5.32.


    +   3. Of course, you will need to know their GitHub names. Once you invite them,
    they will have access to your repository (just this project).


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_147_1.png)


    Figure 5.32 – Inviting other people to collaborate on decision models


    Now that your colleagues have access, how do they collaborate with you on these
    decision models? What makes Git and GitHub so powerful is that there are a number
    of different workflows for you to do this, and which one is most appropriate for
    you is a matter of personal choice.'
