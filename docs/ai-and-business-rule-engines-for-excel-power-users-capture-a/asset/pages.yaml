    \ instead of numbers. There are also similar constructor options for **time**,\
    \ **date and time**, and **duration**.\n\nLet’s look at the example in *Figure\
    \ 9.1* from left to right:\n\n+   - We have a very simple decision model – just\
    \ one input called **Some Input**. This feeds the value into a decision node of\
    \ the `list` type (we’ve called it `Dynamic List`).\n+   - Our list has four values.\
    \ The first of these is static text. The second is today’s date. The third is\
    \ our input value, converted into uppercase. And the final item is a number that\
    \ we calculate.\n+   - On the right-hand side are the inputs and outputs. We pass\
    \ in a simple value (`hello`) and get a list of four values back – we can tell\
    \ it’s List as they are numbered **0-3**. While this is common for scripting languages,\
