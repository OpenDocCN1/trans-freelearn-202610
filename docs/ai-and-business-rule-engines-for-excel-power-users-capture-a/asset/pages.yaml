- pgno: 328
  md: '# Ethics and explainability in decision making – how KIE helps


    We touched on ethics in Chapter 5 when we talked about the importance of being
    respectful of customer data. While it made good business sense, our approach was
    also driven by the European GDPR legislation, which has a worldwide impact even
    if you don’t live in the region.


    The EU is proposing similar legislation for AI that is expected to have an equally
    wide impact. Like the GDPR, its focus is on things that also make good business
    sense. And since you’re reading a book on business rules and KIE, you’re better
    prepared than most people for when it comes into operation. There are many reasons,
    but we’ll focus on two – why AI rules are explainable by default, and how KIE
    shines a light to explain more on the decisions made by neural networks.


    # Business rules are explainable by default


    One of the things that attracted us to the business rule approach to AI is that
    rules are explainable by default. That (internally) allows our business experts
    to review and confirm that our rules-based business models are running as they
    should. This means that if there is a customer request under the EU’s new AI Act
    to explain why they were denied a home loan, the rules can be audited and the
    reason for the decision shared. It is important to note that the entire decision
    model need not be exposed, only the portion that directly contributed to the decision.


    There is no technical reason why we couldn’t write an unethical rule denying a
    home loan offer to somebody with an Irish-sounding name such as Murphy. But the
    fact that such a rule would be highly visible and reviewable across all levels
    of an organization means it would be quickly highlighted and deleted. And if not,
    it’s unlikely that you would want to work for a company that maintains clearly
    discriminatory rules.


    But what about more subtle discrimination that we may not even realize is happening?


    # Explainability in machine learning


    One (in)famous case of machine learning being biased was a sentencing guidance
    system used by the US courts. Since it was a neural network trained on biased
    data where people from poorer area codes had previously received harsher sentences,
    it inadvertently started discriminating against people from the ethnic groups
    that were more likely to live in those areas. At no point was there a rule (or
    training data) stating that any particular group should receive harsher treatment
    – but the effect was the same.


    Since the trained decision model was a black box, it was impossible to audit the
    decisions. And the fact that it operated at the group level (on average, a longer
    sentence was given out to certain groups) meant that the effect was subtle and
    not immediately obvious for any given individual. It shouldn’t take a new law
    for you to want to avoid a similar situation in your own business, so what practical
    steps can you take?'
  merge: -1
  img_proc: true
- pgno: 329
  md: 'One solution is to use decision trees as the basis for our machine learning
    system. As we saw earlier, we can convert decision trees into business rules and
    benefit from all the transparency and auditability that they provide. But like
    the earlier example, decision trees may not always give you the best predictions,
    and you may find yourself sacrificing accuracy for explainability.


    It is to address black-box situations that the KIE team is building out a set
    of **TrustyAI** tools. The KIE blog has technical details, and the videos on the
    KIE YouTube channel are very clear. There are three main techniques that the tools
    use to illuminate what were previously black-box prediction models:


    +   - **LIME** illustrates the relative importance of each feature (or type of
    data) to the result. If you think of *Figure 11.16* in the previous chapter (a
    plot of the predictions made by Naïve Bayes), it was possible to describe that
    graph as a series of shapes. While most prediction models will be more complex,
    LIME overcomes this by focusing on the local area around our prediction point.
    Generating this clear picture using LIME goes some way to being able to check
    it for bias.

    +   - **Counterfactuals** enable us to clarify the model by asking what the smallest
    changes are that we would need to make to the input values to get the result we
    want. Doing this systematically across the model can help us detect bias.

    +   - **Shapley Additive Explanations (SHAP)** aims to explain how much each input
    contributed to the final decision. It does so by getting an average decision and
    then generating hybrid data points (with additional data) around it.


    While this is a high-level introduction to TrustyAI technique, this section does
    validate the choice of KIE as a host for your AI models. KIE is already a good
    choice for future-proofing your AI as the business rules are inherently transparent.
    And when you move to combining rules and machine learning in your models, KIE
    gives you tools to maintain transparency and explainability for your business.


    Speaking of combining rules and machine learning models, we combined both types
    of AI in the KIE Sandbox editor in the previous chapter. Let’s look now at how
    to execute those combined models.


    # Executing combined rules and machine learning models


    At the end of *Chapter 11*, we set out four different ways to execute combined
    business rules and machine learning models in KIE. There are good reasons for
    wanting to explore the different options, so we’ll cover three of them in the
    following order:


