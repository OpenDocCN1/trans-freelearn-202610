- pgno: 205
  md: 'We’ll come back to Office Scripts in Chapter 8. But for the moment, congratulations!
    If you ran this example, along with the previous ones, you now have four different
    ways of linking Excel to your Kogito decision service (and know of two other methods).
    This now gives you a difficult choice – which method should you use?


    # Lots of choices – but which one to link with?


    There is a good reason why we have mentioned a lot of different approaches to
    linking Excel to your decision service. There is no one best method – your choice
    will depend on what else you are trying to achieve with your project. This table
    might help you decide:


    | Tool | Advantage | Disadvantage | Use when |

    |---|---|---|---|

    | Power Query | Built into Excel.

    Acts as a powerful function. | Users can break it.

    No UI elements. | Default method to get started. |

    | Visual Basic | Very powerful.

    Includes UI elements. | Security warnings scare users.

    Outdated. | Using a legacy code base or team has VBA. |

    | Script Lab | Modern version of Visual Basic based on web technologies. | Needs
    installing. | Looking for a rich user experience or if Office Scripts is not available.
    |

    | Functions in Script Lab | Easiest to use – feels like a normal Excel function.
    | Needs three items aligned to work (Script Lab, the function to be registered,
    and the function to be in the workbook). | Niche – consider Power Query instead.
    |

    | Office Scripts | Simpler than Script Lab.

    No installation needed. | Not available to all users.

    No UI elements. | After you outgrow Power Query – if it is available to you. |

    | Power Automate | External to Excel.

    Harder for users to break. | More powerful but more complicated. | Need to call
    the decision service as part of wider workflow. |


    Table 7.1 – Different methods for linking Excel and your decision service


    If you’re finding it difficult to choose, here’s some good news – any step you
    take to move your business rules out of Excel and into a decision service such
    as Kogito is a good one.'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'Once you’ve achieved this, it’s not as important which method you use to link
    Excel to your decision service – since that method is likely to evolve over time.
    No matter what happens, the business rules, now stored in Kogito, are under appropriate
    version control – so you know they are being well managed.


    For example, you may start with legacy Excel sheets using VBA. Migrating to decision
    services (but keeping VBA) is a quick win, and soon you may convince colleagues
    to use Script Lab as a modern equivalent. Later, you may decide to automate your
    entire workflow and call Office Scripts via Power Automate to make it happen.


    They’re all viable solutions, and all these steps are easy to take as your wider
    project evolves.


    # Summary


    This chapter was built on our previous knowledge of linking Excel to our decision
    service using Power Query. We added three other ways of achieving this link –
    using VBA, using Microsoft Script Lab, and using Office Scripts. For each option,
    you saw a fully working example that you can extend for your day-to-day work.
    Just as important, we gave a summary of which linking technique might be the best
    to use depending on your current project.


    You’ll notice that while we introduced Power Automate as a tool to link Excel
    and our decision service, we haven’t (yet) covered it in detail. In the next chapter,
    we complete the set of deep-dive instructions by looking at Power Automate workflows
    and how we can use our decision service as part of them.'
  merge: -1
  img_proc: true
- pgno: 207
  md: "# Using AI and Decision Services  \nWithin Power Automate  \nWorkflows\n\n\
    What we’ve achieved in the two previous chapters is to move business decisions\
    \ out of Excel and into our Drools decision service hosted in Kogito. That works\
    \ well, but we still have to trigger the process manually when needed.\n\nIn real\
    \ life, making a decision is likely to be one of many steps that we take to answer\
    \ a customer’s question. Wouldn’t it be great to automate this end-to-end work,\
    \ creating a flow that calls our decision as needed? This chapter shows you how\
    \ you can in the following topics:\n\n+   - What is a workflow?\n+   - What is\
    \ Power Automate, and why use it?\n+   - Calling business rules and decision services\
    \ from Power Automate\n+   - Implementing our customer service flow in Power Automate\n\
    +   - Alternatives, such as Power Automate Desktop and Kogito business automation\n\
    \nPower Automate is a very user-friendly tool – but also very powerful. Our aim\
    \ in this chapter is to give you an awareness of Power Automate and how it can\
    \ help you. We’ll show you flows where you link Excel and the decision services\
    \ as part of a wider process. But there will be many interesting parts of Power\
    \ Automate that, due to space constraints, we won’t be able to explore. Hopefully,\
    \ we’ll leave you with an appetite to learn more – so we will also give you pointers\
    \ as to the next steps on your learning journey."
  merge: -1
  img_proc: true
- pgno: 208
  md: "# ## Prerequisites\n\nPower Automate is a (mainly) online-hosted tool from\
    \ Microsoft – so it’s not surprising that you’re going to need a Microsoft account.\
    \ There are two main account types:\n\n+   - You may already have a Microsoft\
    \ account from the organization you work in or are affiliated with (if you’re\
    \ a student). If you have access to `Office.com` or `Outlook.com`, and if you\
    \ are able to sign in using something such as `yourname@companyname.com`, then\
    \ you have a corporate Microsoft account.\n+   - You may have a personal Microsoft\
    \ account (such as `yourname@live.com` or `yourname@hotmail.com`) – or you might\
    \ have signed up for the free online version of Office (`https://www.microsoft.com/en-us/microsoft-365/free-office-online-for-the-web`).\n\
    \nBoth these accounts should give you access to Power Automate, with most of the\
    \ standard features enabled. However, since we dive into connecting flows to decision\
    \ services, this chapter uses some premium features only available on corporate\
    \ or pay-monthly accounts. Happily, Microsoft gives you a free trial of Power\
    \ Automate with these features – click on the **Start Free** option at the following\
    \ link: `https://powerautomate.microsoft.com/`.\n\nThe examples used in this chapter\
    \ also assume that you have OneDrive running on your machine. While not strictly\
    \ necessary for running Power Automate, it’s probably easier to install it now\
    \ if you intend to follow the examples.\n\n> **Where are the downloadable samples\
    \ for this chapter?**\n> \n> Power Automate is great because it is so visual.\
    \ Unfortunately, that makes it harder to share samples – there are no easily readable\
    \ scripts that we can publish on the GitHub site.\n> \n> While there are ways\
    \ of sharing Power Automate solutions, due to space in this chapter, we focus\
    \ on giving you clear, step-by-step instructions that you can follow to link Power\
    \ Automate and your KIE decision services.\n\nNow that we understand which Microsoft\
    \ Account we will be using to access Power Automate, let’s start by reminding\
    \ ourselves what a workflow is."
