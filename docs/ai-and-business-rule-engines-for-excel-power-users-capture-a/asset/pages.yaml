- pgno: 148
  md: "> **Git and GitHub**\n> \n> This book talks about **Git** and **GitHub** as\
    \ if they were interchangeable, and since the tools we use in this book (KIE Sandbox,\
    \ and later Visual Studio Code) have the Git protocols embedded in them, you’re\
    \ never likely to use Git tools directly. However, it is useful to know that **Git**\
    \ is the tool that allows people to collaborate over multiple files on a project,\
    \ and **GitHub** is the website that helps you find these projects and groups\
    \ of people.\n\n# Different workflows\n\nYou may be used to Office 365, where\
    \ everybody works on a common version of a single file. Word and Excel are quick\
    \ enough that you see changes in real time, so conflicting changes don’t tend\
    \ to be an issue. Office 365 offers simple versioning: if somebody else makes\
    \ an edit you don’t like, you can roll back to the previous version, or the version\
    \ from last week that everybody agreed was OK.\n\nWhile we currently have a single\
    \ file, we will very quickly progress to multiple interlinked models that we want\
    \ to collaborate on. That’s why Git and GitHub offer you more powerful workflows\
    \ for collaboration.\n\nOne important difference is that while it is possible\
    \ to edit the files directly on GitHub, most of the time you’re working with a\
    \ local copy. When you’re happy that everything is working as it should, it’s\
    \ only then that you push your files up to the main branch on the upstream repository.\n\
    \nThere are many ways of using Git, which is what makes it so powerful. If you\
    \ want to know more, check out the Packt books on Git at `https://www.packt.com/?s=github&post_type=product`.\n\
    \nFor now, let us talk through two of the most common Git workflows.\n\n# A simple\
    \ one-person workflow using KIE\n\nPerhaps the easiest way to use Git and KIE\
    \ is as follows:\n\n+   1. Link KIE and GitHub as we described. This gives you\
    \ a local copy of your decision models and a backup copy on the GitHub site.\n\
    +   2. Make your changes to the decision models as before. Like before, these\
    \ changes are automatically stored locally.\n+   3. At regular intervals, push/commit\
    \ your local changes to your GitHub repository online.\n\nThis is good practice—you\
    \ will have a backup copy of your work in case you lose your laptop, and it allows\
    \ you to be braver in your editing since you will have all of your previous versions\
    \ that you can revert to. It also gets you used to using Git workflows.\n\nHowever,\
    \ the true power of Git tools becomes clearer when we collaborate. Here is one\
    \ simple collaboration workflow that you might use."
