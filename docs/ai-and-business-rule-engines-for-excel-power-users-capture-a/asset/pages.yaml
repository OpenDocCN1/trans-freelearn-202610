    If it is an area you are interested in, or maybe you want useful information to
    help you execute models better in VS Code, the following points may help you explore
    more:


    +   - Red Hat has two good articles on PMML models in Business Central, starting
    at `https://developers.redhat.com/blog/2021/01/14/knowledge-meets-machine-learning-for-smarter-decisions-part-1#artificial_intelligence__machine_learning__and_data_science`

    +   - The KIE team has a great video covering a similar topic on YouTube – search
    `[KIELive#42] The Intelligent Decisions journey with DMN and PMML`

    +   - The Pragmatic AI section of the Drools documentation includes a detailed
    walkthrough of a sophisticated home loan example using Business Central as the
    editor: `https://docs.drools.org/8.29.0.Final/drools-docs/docs-website/drools/pragmatic-ai/index.html`


    The Business Central and VS Code online approaches have a lot in common. It’s
    worth presenting a completely different alternative that is more workflow-focused,
    which many people will find the easiest.


    # Alternative – integrating rules and ML in a Power Automate flow


    Our alternative approach to combining rules and machine decision services is very
    simple and is based on the Power Automate tool that we introduced in *Chapter
    8*. *Figure 12.8* shows the flow we have in mind:


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_334_0.png)


    Figure 12.8 – A Power Automate flow integrating machine learning and rules'
