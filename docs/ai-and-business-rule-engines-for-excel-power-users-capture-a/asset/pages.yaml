    +   II. **Push** is used when you have made changes locally and you want to send
    them to GitHub to the main upstream repository


    We’ll demonstrate these concepts when we go through common workflows in editing
    and saving your decision models. Now that we’ve completed our tour of what has
    changed, let’s check how KIE actually saved our repository on GitHub.


    4. Go back to your personal page at GitHub.com. You’ll see that KIE has created
