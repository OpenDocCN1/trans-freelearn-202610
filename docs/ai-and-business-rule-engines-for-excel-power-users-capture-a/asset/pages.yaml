- pgno: 70
  md: '# Writing our first business rule


    Now that we are ready to write our first business rule, getting started is as
    simple as opening your browser. Most modern browsers will do – Chrome, Safari,
    or Edge. At the time of writing, the current version of Firefox is missing a feature
    to run the KIE Sandbox, but this is likely to be resolved soon. In your browser,
    go to http://dmn.new (mirrored at https://sandbox.kie.org). You should see a page
    similar to the one shown in Figure 3.1:


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_70_0.png)


    Figure 3.1 – KIE Sandbox home screen


    A lot of time is being invested in evolving the KIE editors, so there may be some
    differences between this screenshot and what you see on your laptop. However,
    there’s no need to worry since the decision editors are based on the DMN standard
    (more on that soon), so any differences will very likely be cosmetic.


    On the KIE Sandbox home page, there are three options:


    +   - We’ll touch on workflows in Chapter 8, AI and Decision Services within Excel
    and Power Automate Workflows'
  merge: -1
  img_proc: true
- pgno: 71
  md: '+   - Scorecards are related to PMML and machine learning, a topic we will
    cover in *Chapter 11*

    +   - Right now, we''re interested in decisions/rules


    Click on **New Decision** (shown in *Figure 3.1*) and the KIE decision editor,
    similar to *Figure 3.2*, will appear:


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_71_0.png)


    Figure 3.2 – KIE decision editor in the KIE Sandbox


    We know we''re in the right place, as it says **Decision** underneath the KIE
    logo in the top-left corner. There''s a lot to see on this screen. We''ll introduce
    the various elements in this **user interface (UI)** as we work through the `Hello
    World` sample in the next couple of pages.


    **Take the tour**

    You may see a pop-up menu in which KIE offers to take you through a 5-minute introduction
    tour. It''s worth spending a couple of minutes playing with that tour as another
    way of getting used to the screen. Clicking **Skip Tour** will take you back to
    the main KIE decision editor.'
  merge: -1
