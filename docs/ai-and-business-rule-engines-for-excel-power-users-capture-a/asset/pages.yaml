    took less than 10 minutes. Rather than repeating the previous steps, we’ll show
    how to import the updated example into Office Scripts, then run through and highlight
    the changes that we’ve had to make:


    +   1. Download the full script from the usual GitHub site. The example filename
    is 07_Office_Script_Decision_Service.txt. Note the .txt extension, as we have
    given the same example in two different formats.

    +   2. Open the file in an editor such as Notepad and copy all the contents.

    +   3. In the online version of Excel, select the Automate menu, then New Script,
    and paste the contents of the file to replace all the previous contents of this
    window.

    +   4. Save the result.


    If you’re more familiar with where Office Scripts saves files, it’s possible to
    download the example directly into the OneDrive folder under Documents | Office
    Scripts. Note the format of the file is slightly different – it’s the 07_Office_Script_Decision_Service.osts
    file that you need. Note the .osts extension.


    If downloading the example doesn’t work, check that you have the right file for
    the method you are trying to use.


    The biggest change in the example is since Office Scripts has no user interface
    elements, we’ve removed those from the sample. While the values we pass into the
    decision service are hardcoded to keep things simple, it would be easy to read
    these from a cell value instead.


    Other key changes in the script worth highlighting are as follows:


    +   - Office Scripts hides a lot of complexity from us. We have a simple main
