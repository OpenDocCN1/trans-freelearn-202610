- pgno: 235
  md: '# Advanced Expressions, Decision Models, and Testing


    If you listened to our encouragement after *Chapters 3 and 4*, you may have tried
    building your own decision models. Hopefully, you then explored the different
    ways of linking your model to Excel in *Chapters 6, 7, and 8* and found the one
    that works best for you. But as your models become more complex, you may find
    that things don’t work as smoothly as you’d like.


    This chapter aims to fix that – we’ll explain some more features of the FEEL expression
    language to make your business rules more expressive. We’ll cover ways to structure
    your decision models to reduce their complexity. We’ll introduce testing, and
    why it is always better for you to break your rules before anybody else. Along
    the way, we’ll give you glimpses of editing tools outside of the KIE sandbox that
    show you how powerful the tools within the KIE ecosystem are.


    The chapter will cover the following main topics:


    +   - Prerequisites and pre-reading

    +   - DMN and FEEL expressions – extending what you already know

    +   - Dynamic lists, contexts, and relations

    +   - Can you use Power FX expressions in decision models?

    +   - More on building and editing decision models

    +   - Common decision patterns to help build your models

    +   - Testing and breaking your rules (before somebody else does)


    # Prerequisites and pre-reading


    As you’d expect from a more advanced chapter, it helps if you’ve read the previous
    parts of the book! Much of what we will cover builds on *Chapters 3 and 4*. While
    we do a quick refresher, you’ll need access to the KIE sandbox with the extended
    services running, as described in *Chapter 3*.'
  merge: -1
  img_proc: true
