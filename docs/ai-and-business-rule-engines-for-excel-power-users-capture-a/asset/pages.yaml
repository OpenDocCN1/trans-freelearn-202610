- pgno: 265
  md: '+   - The Sandbox is designed for an individual user with some team features,
    whereas Business Central assumes many people will be working together on the project.
    Many of its advanced features assume that there is a *mechanic* on your team that
    knows Java (for example, to set up data types).

    +   - Both the KIE sandbox and Business Central use Git as the mechanism to store
    models, so it is possible to fashion a workflow where both editors work on the
    same decision model. However, as you’d expect from Business Central, it gives
    a much more powerful implementation, which can be intimidating for new users.


    In this chapter, we focus on the scenario testing tool, since that is a compelling
    reason for you to explore Business Central. We also use Business Central to demonstrate
    some of the more advanced features in *Chapter 12*. Our aim is to give you a good
    start and to suggest additional paths to explore.


    But first, we’ll need to get Business Central up and running, and to do that we’ll
    need containers.


    # Containers, Docker, and getting help


    We were introduced to **containers** in *Chapter 2* as the quickest way for readers
    to get tools and examples running. Even more importantly, containers help all
    readers run the examples consistently, which means the instructions in the book
    match what you’re seeing happen on your laptop.


    The process is simple; we install our container software of choice (Docker) and
    then use the Docker tools to download the images containing the software and examples
    we want.


    Many Excel power users will be comfortable with installing software. Even if this
    is something you’re doing for the first time, the step-by-step instructions in
    this section are very easy for you to follow. Before we start, let’s remember
    that not everything you tried in Excel worked the first time. What did you do
    to fix it?


    +   1. You checked your typing and spelling – this is the biggest cause of error
    messages.

    +   2. You read the error message carefully – chances are it is suggesting something
    you can do to fix it.

    +   3. If you were following a guide or book, you went back over the instructions
    to see whether there was a step that you missed.

    +   4. You copied and pasted the error message (or key parts of it) into a search
    engine. Most of the time, there will be people who have encountered the same problem
    and will know how to fix it. At the very least, there will be suggestions on how
    to move closer to a solution.

    +   5. After trying all these steps, you asked a colleague or friend. You shared
    the steps you have tried to show that you value their time and that you are genuinely
    seeking their expertise.


    The first part of our step-by-step instructions can be summed up as *install Docker
    Desktop on your computer*. There is a very supportive and active Docker community
    to help you do this. And because Docker is a corporate standard, there may be
    people near you who can help. *Appendix C* has some good starting points, in particular
    the *Preparing your computer for Docker* section.'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'Most readers will not need help as they work through the instructions to install
    Docker in the next section, but it’s good to know additional detail is there if
    needed.


    # Installing Docker


    Knowing that we have all this support, let’s walk through installing Docker on
    a laptop, step by step. The instructions in this chapter are in two clear parts:


    +   1. Install Docker to host containers.

    +   2. Download an image with the samples you want to run in this container.


    Make sure the first part is running before you start the second – it makes it
    much easier to ask for help if you know exactly which part is causing the problem.


    # Preparing your Docker Hub account


    You will be asked later for the details of your (free to register) Docker Hub
    account. Go to docker.com and click on Sign In in the top right-hand corner of
    the web page. You then have the option of creating an account. Make a note of
    your username and password for later.


    # Downloading and installing the Docker software


    Docker Desktop is quite a straightforward download and install:


    +   1. To get started, go to https://www.docker.com/products/docker-desktop/ and
    pick the appropriate installer for your system (for example, Windows, Linux, or
    Mac).

    +   2. Open the Docker installer that you downloaded in the previous step.

    +   3. Click Yes for Do you want to allow Docker Desktop to make changes to your
    PC. If you are asked for an admin username and password at this point, see the
    notes in Appendix C.

    +   4. Click OK in the next step – configuration. Note that your version number
    is likely to be higher (more recent) than shown in this screenshot:


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_266_0.png)


    +   5. Be patient while the installer downloads and unpacks the files. If all
    is well, you will get the Installation succeeded message – click OK and proceed
    to the next section (a tour of Docker Desktop).'
  merge: -1
  img_proc: true
