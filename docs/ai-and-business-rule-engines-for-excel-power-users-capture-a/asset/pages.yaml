  md: '# Troubleshooting your connection


    By far, the biggest issue is using the wrong project, host, or token name when
    trying to set up the connection. Or, you could have the right values but in the
    wrong place. You could also have most of the values but may be missing the last
    letter of the token.


    Tokens also change every 24 hours, so don’t be afraid to go back and check, and
    of course, always check that your internet connection is working and that your
    OpenShift instance is running.


