    This example shows three key things about ML:


    +   - Choosing the right chart reveals a lot, in the same way that choosing the
    right algorithm will make the patterns in our data a lot clearer.

    +   - Less information can sometimes mean more clarity—filtering our data can
    help us see the underlying patterns.

    +   - More features (or dimensions) often make it easier to distinguish groups.


    Most people can move from thinking in 2 to 3 dimensions but would struggle to
    visualize 4 dimensions, or even 40. Happily, we can get most of the work done
    using a computer, which is just as well as some models (such as GPT-4) effectively
    have 1.4 trillion dimensions to work with.


