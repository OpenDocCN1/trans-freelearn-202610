- pgno: 126
  md: 'Most websites are read-only, or close to it, but what if you could request
    space in that data center and install an app into it, just like you do on your
    mobile phone? You’d then communicate with that newly installed app in the data
    center rather than your phone. That, in very simple terms, is the cloud.


    Excel 365, the online version of Office, is an example. You’re unaware of the
    location of the data center that is hosting your document, but you are confident
    that Microsoft has all of the security checks to keep your information secure.
    Microsoft specializes in running Office 365 apps in their data centers, so they’ve
    gotten pretty good at it and can scale the computers needed up and down to meet
    demands.


    For running Kogito in the cloud and deploying your decision models, Red Hat has
    an almost-as-click-one-button deployment to host your decision models online.
    That is based on Red Hat’s cloud offering (**OpenShift**) which we’ll get up and
    running soon.


    # Reality check – why not connect Excel to the local KIE Sandbox?


    Technically, it is possible to modify the scripting techniques in this book to
    communicate between Excel and the KIE Sandbox Extended Services—the local tool
    you installed in *Chapter 3*.


    However, you really don’t want to do this for the following reasons:


    +   - The KIE Extended Services’ focus is to help your rules development, and
    they can change from version to version (which would break any Excel sheet connected
    to it).

    +   - The KIE Extended Services are not available outside of your laptop – which
    makes it harder for colleagues to use it.

    +   - The KIE Extended Services expect a copy of the DMN decision model sent every
    time. That’s OK from KIE Sandbox in the browser, but we have no easy access to
    the model from Excel.


    In practice, you’ll find the one-click deployment so easy to use that hosting
    your decision models on OpenShift is likely to become your preferred solution.
    As a bonus, deploying to the cloud automatically gives us a robust, scalable platform
    to use in production, which is an important aim of this book.


    If running decision models locally is vital to you (for example, on a computer
    on your company premises), take a look at the techniques using *Docker* in *Chapter
    10*, which should give you a suitable solution.


    # OpenShift – Red Hat’s piece of the cloud


    Red Hat’s (IBM) cloud offering is called **OpenShift**. It’s full-featured, meaning
    it can do most of the things the other major cloud vendors such as Google, Amazon,
    and Microsoft offer. While it is possible to deploy Kogito to these other cloud
    vendors, we’re choosing OpenShift as it offers an easy one-click deployment for
    Kogito and our decision models.


    Being full-featured also means OpenShift has a lot of buttons that we don’t need
    to cover in this book; we’re going to ignore those and focus on what you need
    to deploy your decision models. If you feel the need to learn more, we can recommend
    *OpenShift for the Absolute Beginner* from Packt at `https://`'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'www.packtpub.com/product/openshift-for-the-absolute-beginner-hands-on-video/9781838559090.


    OpenShift has a free layer called the Developer Sandbox (not to be confused with
    the KIE Sandbox). This allows you to try out the deployment with the option to
    upgrade to a paid-for subscription later. Obviously, the free offering has some
    limitations, which we will touch on at the end of the section. Broadly speaking,
    the Developer Sandbox is good enough for developing business rules, but you probably
    want to upgrade to the full version if you’re using it with paying customers.


    Let’s walk through signing up for the Developer Sandbox, accessing the Sandbox
    once it is set up, linking the Sandbox to the Developer Sandbox, and deploying
    our decision models to it.


    # Signing up for the OpenShift Developer Sandbox


    Signing up for the OpenShift Developer Sandbox is a similar process to joining
    a popular website such as Gmail or Facebook. You go to the website, provide some
    personal details, verify your email or mobile number, and then you’re logged into
    the site. We’ll walk through these steps one by one to get you started:


    +   1. Open the main Developer Sandbox page at https://developers.redhat.com/developer-sandbox.


    +   2. While this page has a lot of information, there is a lot here we don’t
    need. Click on the Start your sandbox for free button:


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_127_0.png)


    Figure 5.1 – Signing up for the OpenShift Sandbox


    +   3. Enter your email to begin the process of setting up your OpenShift account.


    You will be asked for basic details, including a password. When you’ve filled
    in all the necessary fields click on the button to Create My Account.


    +   4. During the account creation process, you will be asked to confirm your
    mobile number. That’s there to make it more difficult for people to sign up for
    multiple accounts. You will have to enter the code that gets sent to your mobile.'
  merge: -1
  img_proc: true
- pgno: 128
  md: '+   5. You’ll also be prompted to choose a project name during the setup process—this
    is something you can’t change later, so pick one that you’d be happy sharing with
    your business colleagues.


    +   6. Finally, after confirming your email address by clicking on the link in
    an email that gets sent to you, you should see the You’re ready to get started!
    message:


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_128_0.png)


    Figure 5.2 – Successful OpenShift sandbox setup


    During the signup process, you may see wording in the emails that get sent that
    you don’t quite understand. For example, see the following:


    ```

    Notice: Your Developer Sandbox for Red Hat OpenShift account is provisioned

    ```


    Sandboxes are a bit like renting an apartment condo. We don’t own it, but we’re
    the only ones that can access that piece of the building during the rental period.
    We expect it to be fully clean with no trace of the previous occupants when we
    check in, and we expect all the features listed (beds, coffee makers, and so on)
    to be ready to use. Provisioned means that this setup process is complete.


    A better comparison


    Since sandboxes are completely torn down and rebuilt after we use them, a better
    comparison would be German-style rentals where the apartment is stripped back
    to nearly bare walls, and each person renting must install their own appliances
    and furniture.


    Another reminder in the email is like so:


    ```

    Your account will be active for 30 days. At the end of the active period, your
    access will be deactivated and all your data on the Developer Sandbox will be
    deleted.

    ```


    Red Hat allows us to use their cloud for free, but they have to draw the line
    somewhere. 30 days is plenty of time to try out the ideas in this book, and you
    can sign up again (using the same contact details) for several more 30-day periods.


    In general, we’ll always have a local copy of our decision models, and we don’t
    store data once the decision model has finished its run, but it’s a useful reminder!'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# Accessing your OpenShift Developer Sandbox


    Now that we have our account set up, go to `https://developers.redhat.com/developer-sandbox`
    to start using our new cloud environment. The website should remember that you
    have logged in (but will give you the option to do so if needed), and you may
    have to click on **Start Using your Sandbox** to view the main OpenShift console
    like in *Figure 5.3*:


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_129_0.png)


    Figure 5.3 – The OpenShift console


    There is a lot in this image showing the power of the OpenShift cloud offering.
    We won’t do our normal tour of the screen; instead, we’ll take it as confirmation
    that we have the Developer Sandbox set up correctly. If you’re curious, take a
    look around, but we’ll focus on getting two key pieces of information to allow
    us to link our local KIE Sandbox with this piece of the cloud.


    # Two vital pieces of link information


    Before we leave the OpenShift console, let’s make a note of two key pieces of
