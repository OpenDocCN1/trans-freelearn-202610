  img_proc: true
- pgno: 174
  md: '+   4. The line `Response = ...` uses the `Web.Contents` connector from Power
    Query to do the POST call. You’ll see that this connector allows us to set the
    headers needed by our decision service.

    +   5. After the call is complete, `JsonResult = Json.Document(Response)` formats
    the text returned so that Power Query knows we’re using a JSON format.

    +   6. The final `in` part of the query specifies which of the variables we want
    to return as the result of our query.


    It’s great that we’ve finally connected Excel to our decision service using Power
    Query. But while we can edit the query, that’s not practical for day-to-day use.
    It’s very easy to break this query when editing by putting a comma or double quote
    in the wrong place. Let’s fix that, using the knowledge of Power Query parameters
    that we learned earlier.


    # Calling the decision service using parameters


    In this section, we’re bringing all the parts together – REST calls and parameters
    from Excel into Power Query, making a POST call, then bringing the information
    back to Excel. Since we’ve already walked through the individual steps, it makes
    sense to give you a complete downloadable sample at `06_power_query_decision_service.xls`
    on the book’s GitHub sample site. This allows us to highlight the key areas to
    allow you to extend the approach for your own work.


    If you open the example, you’ll see the main sheet, and two other worksheet tabs,
    as in *Figure 6.19*.


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_174_0.png)


    Figure 6.19 – Main sheet and other tabs of our full sample'
