- pgno: 288
  md: 'And if you do migrate to a paid service tier, the Red Hat OpenShift provides
    a managed service so that you need to deploy only the models, and not the entire
    decision service tier. This is much more cost-effective.


    However, it is likely that your organization has already chosen a single cloud
    service provider for strategic reasons. Happily, we can leverage the power of
    Docker containers to deploy onto all the other major cloud providers (including
    Google Cloud Platform and Amazon Web Services). The steps we give in this section
    focus on Azure since your organization probably has a subscription with Microsoft
    for the Office 365 platform.


    The instructions use the Docker command line since we want to show you how quickly
    we can do a deployment to Azure in just four steps. Since most people who are
    new to Azure will prefer a web-based interface, similar options are available
    via the Azure portal at https://azure.microsoft.com with free credits and tutorials
    to get started. We explore the Azure portal in more detail in Chapter 11.


    # You may already have deployed on Azure


    If you’ve followed the instructions in Appendix B, you may already have deployed
    rules in Azure – using GitHub Codespaces and VS Code online automatically create
    an Azure container for you. That container was optimized for the development and
    writing of rules and is not suitable for day-to-day business use.


    Docker tools are highly integrated with Azure. If you have an Azure account and
    an Azure Container Instance (ACI) set up to host the Docker containers online,
    the following four steps will allow you to deploy your containers into the Azure
    cloud:


    +   1. Open Command Prompt on our laptop like in our previous examples.

    +   2. Sign in to Azure using `docker login azure`.

    +   3. Create an online container to host our image using `docker context create
    aci myacicontext`.

    +   4. Run the container in Azure using the `docker --context myacicontext run
    -p 80:80 hello-world` command.


    You’ll notice that in our set of instructions, we deployed a hello-world image
    and not any of the KIE Server or Business Central images we used earlier in the
    chapter. This is because it’s a bit like handing you the keys to a Formula 1 racing
    car – you know how to drive Azure, but please pause for a minute before you race
    off.


    We want you to think before you carry out any deployment of the KIE Server in
    the cloud. In particular, familiarize yourself with the Azure security features,
    understand the billing and budget implications, and select an appropriate Docker
    image to deploy. The images we use in this chapter are optimized for ease of use
    rather than security, so please consult the KIE documentation to understand which
    of the other images best meet your needs.'
  merge: -1
  img_proc: true
- pgno: 289
  md: 'Deploying the KIE Server is similar to the four steps we list, except we deploy
    a *kie-server* image instead of *hello-world*. Now that we understand that we
    can deploy KIE Server to the cloud, it''s a good time to remind ourselves of all
    the deployment options we have covered in this book.


    # Roundup of decision model deployment options


    Back in *Chapter 2*, we promised you four main ways to run our decision models.
    Now that we''ve completed deploying our rules into Docker-based servers, let''s
    take a look at those options again. Our options for deploying our rules include
    the following:


    +   - *Running KIE Sandbox with the web-based rules editor*: We have used this
    solution for most of this book, starting with *Chapter 3* and *Chapter 4*, as
    it is so easy to get started.

    +   - *Running containers on your laptop or another computer (server) that you
    have access to*: We covered these methods in detail in this chapter and *Appendix
    C*, with containers giving us a wide range of deployment options.

    +   - *Running an image in the cloud (hosted by Microsoft or IBM/Red Hat)*: We
    introduced this approach in *Chapter 5*, where we deployed our rules into OpenShift.
    We expanded this approach in *Chapter 9* and *Appendix B* to deploy into Codespaces
    and VS Code online on Azure. And this chapter introduced more cloud-based options
    using containers.

    +   - We still have the final method to *set up the technology stack ourselves*:
    While we won''t cover this, perhaps you have a bit more confidence to consider
    exploring this option than when you started this book. We suggest the KIE documentation
    as the next step.


    # Summary


    This chapter gave you another option to access the Scenario Simulation tool, this
    time using Business Central. Since our method for running Business Central relied
    on Docker, we took advantage of container technology to explore many different
    ways of deploying KIE Server images, from locally on our laptop through to scaling
    a deployment into the cloud. That gives us the confidence that we have many more
    options to edit and deploy our Business Rules within our organization as the use
    of decision models grows.


    We will return to Business Central in *Chapter 12*, where we use it as a platform
    to demonstrate some advanced rule editing techniques. Docker will prove useful
    in the next chapter, as we use it to host Docker images for machine learning.
    And we''ll return to Azure, using Machine Learning Studio as a tool to train our
    models.


    This book set out to focus on rules-based decision models within AI. But we would
    be remiss if we didn''t touch on the other main area of AI – machine learning.
    In the next chapter, we will learn how to combine the best of both AI approaches,
    using the tools that KIE gives us.'
