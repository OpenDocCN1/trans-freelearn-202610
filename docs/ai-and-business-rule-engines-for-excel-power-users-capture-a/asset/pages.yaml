  md: '# Contributors


    # About the author


    **Paul Browne** is a product and program manager currently working for Europe’s
    largest VC by deal flow. Most recently, he led a team from three partner institutions
    that won an EFMD award for ecosystem development, training over 100 eurozone companies
    to implement digital solutions together. This continues Paul’s previous work leading
    business and technical projects in the public, financial, and life science sectors
    across Ireland, the UK, the US, the Netherlands, Belgium, and New Zealand.


    Paul’s qualifications include a degree in European business and French from Ulster
    University and more recent certifications in finance (ACCA), procurement (CIPS),
    and business strategy (ESMT). He has technical certifications from Microsoft,
    Oracle, and IBM and holds a master’s in advanced software engineering from University
    College Dublin.


    Paul is also the author of *JBoss Drools Business Rules*, by Packt Publishing,
    and has lectured in Excel and Visual Basic at third level.


    *I would like to thank the Drools, KIE, and Kogito communities, and the teams
    at Red Hat, IBM, and Microsoft for delivering great AI and business automation
    solutions, and for their ongoing support in writing this book.*'
