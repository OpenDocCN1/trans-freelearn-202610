- pgno: 106
  md: 'You’ll notice that our sample (as modeled in KIE) does not yet match the Customer
    (with Orders) we modeled in JSON and Excel. Since you’ve already used the data
    type editor, creating an order object and nesting it within the customer is easy:


    +   1. Create the **tOrder** type, with the fields you need.

    +   2. Edit the **tCustomer** data structure and add a (Previous) **orders** field
    using this **torder** type.

    +   3. Edit the **list** slider, which allows us to add multiple previous orders
    per customer.


    As before, the auto-generate form on the **run** screen will update – try it out!
    The downloadable copy of the data type we created is available as 04_Customer_Data.dmn
    on the book’s GitHub page https://github.com/PacktPublishing/AI-and-Business-Rules-for-Excel-Power-Users.


    Downloading it will make it easier if you don’t want to work your way through
    all these steps – but remind yourself of the GitHub download instructions we gave
    in the previous chapter to avoid the most common mistakes.


    Just because you can create extremely complicated custom data using the editor
    doesn’t mean that you should. Let’s think about what makes for a good design.


    # What makes a good custom data type?


    Since you’re building a service that other people (including you in the future)
    will use, it pays to make it as easy to use as possible. There are entire books
    written on good data design, but at this stage, a couple of simple guidelines
    will go a long way:


    +   - It’s better to follow how people talk in day-to-day business – customers,
    delivery addresses, orders, product recommendations, and other similar terms.
    Familiar, clear names makes it easier for people to understand since you mirror
    the way they already think.

    +   - Several simple data types are better than one large complex one. Not only
    are they easier to understand, but it makes it easier to reuse your decision service.

    +   - Data modeling can get very complicated very quickly. Copying existing spreadsheets
    and systems is a good start. Consistency is better than the confusion of having
    a slightly different data model.

    +   - Keep the names simple – our type used **number** instead of **customer_number**
    since it was already clear from the context that it was associated with a customer.


    Above all – don’t be afraid to experiment. At this stage in the book, we’re prototyping
    – playing with the technology with a focus on learning. And at some point, we
    will probably (re)start with a *clean-sheet* design. This clean-sheet design will
    be built a lot faster as we will have a much better idea of what we are doing
    at that point.


    Now that we can use data types to specify the data we expect to be passed in,
    let’s use it in a more powerful Decision Model using Decision Tables.'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# A more powerful Decision node – Decision Tables


    In Chapter 1, Wrestling with Excel? You Are Not Alone, we introduced business
    rules as decisions we can make using a when ... then format, for example; When
    time is AM - say Good morning.


    We are likely to have more than one business rule - otherwise, why bother using
    a rule engine? Decision tables are just a format to write multiple, similar business
    rules in a table format, like this:


    | First | Input Value 1 | Input Value 2 | Output |

    | --- | --- | --- | --- |

    | 1 | When value1 = "Something" | AND value2 > 100 | "Matched" |

    | OR 2 | When value1 = "Completely different" | AND value 2<100 | "Different match"
    |

    | OR 3 | - | Value 2 = 100 | "Match on number only" |


    Table 4.1 – Business rules mapped as a simple Decision Table


    Where are the Input Values coming from? That’s the data model we constructed earlier.
    The arrows we use to wire different nodes together mean that KIE knows what data
    is available for use by the decision table (and will try to autogenerate the table
    for you).


    Drools (the rule engine underlying KIE) takes these input values and tries to
    find the line in the Decision Table with the best match. There are different methods
    (HIT Policies) for finding the best match. We’ll use First in our example since
    it is simple to understand, but we’ll come to policies for matching later.


    When it finds a match, the value in the Output column is returned. We can have
    more than one output value, but we’re keeping things simple here.


    Note that not all values need to be provided. The hyphen, -, in line three of
    Table 4.1 tells KIE not to match in this column for this rule. There are a range
    of friendly enough expression language (FEEL) expressions we can use in the values
    we want to match, which means that any text we want to match has to be surrounded
    by quotes.


    We don’t actually use AND or OR in our decision table syntax – they are implied
    by the layout of the table. We include them here for clarity. Likewise, we just
    write something as the pattern we want to match (see Table 4.1 - the first column
    of our first rule).


    Now that we’ve understood the idea of a decision table, let’s capture our first
    decision table using the tools in the KIE Sandbox.


    # Our first Decision table in the KIE Sandbox


    The graphic editor in the KIE Sandbox makes creating our decision table easy.
    We’ll start using the data model we created in our previous exercise earlier in
    this chapter. This is also available on the samples page as 04_Customer Data.dmn.'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'To add a Decision Table to this decision model:


    +   1. Open the model in the KIE sandbox and rename the decision model to **First
    Decision Table**.

    +   2. In the editor view (which should currently be blank), drag and drop a data
    node. Call it **Customer**.

    +   3. Open the **Properties** view for this node and set the data type to **tCustomer**
    (the data structure that we created earlier in the chapter). This is shown in
    *Figure 4.11*.

    +   4. Back in the main model, drag and drop to create a decision node. Call it
    Recommended Product.

    +   5. Link the two nodes with an arrow (right-click on the **Customer** node
    to view this option). Your decision model should look similar to *Figure 4.11*:


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_108_0.png)


    Our data and decision nodes must be linked before taking the next steps. If not,
    KIE is not able to autogenerate the fields on the decision table since it won’t
    know what information is being passed in.


    Let’s now create a decision table within our **Recommended Product Decision**
    node:


    +   1. Select the **Recommended Product Decision** node and click **Edit**.

    +   2. In the screen that appears, select **Decision Table** as the type of expression
    we want to use. Remember -- we don’t get a chance to change this later -- so if
    you get this wrong, you’ll need to delete and create a new decision node.

    +   3. You should see an empty decision table similar to *Figure 4.12*. We have
