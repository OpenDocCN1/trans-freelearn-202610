  md: '![](img/48815d6f06dc8c7aeaa3963d289fb1e7_322_0.png)


    # Figure 12.2 – Decision tree generated by the algorithm


    We won’t walk through the entire tree, but the tree diagram does explain how the
    model makes its prediction. You can see the values it is using for Country_Code
    and Customer_Age, and branches down the tree depending on the value passed into
    the model. Sometimes it can come to a quick decision (for example, the box in
    the top left is an early recommendation for Lumpy Bars), sometimes it needs to
    work through several levels (for example, when recommending Silk Tray in the box
    at the bottom right).


    You’ll notice that there are several different paths to making the same product
    recommendation, which means decision trees can make quite nuanced predictions.
    But let’s remember two key points:


    +   - Decision trees are human-readable. We haven’t gone into too much detail,
    but you already have a high-level understanding of what is happening.

    +   - Decision trees are auto-generated. All of the values used in Figure 12.2
    were discovered by the machine learning where and how it should branch in order
    to fit the tree to the available data.'
