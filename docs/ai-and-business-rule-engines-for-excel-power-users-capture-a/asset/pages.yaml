- pgno: 345
  md: 'It is for that reason that we have given you (and colleagues) a glimpse within
    the rule engine and show the sophistication that almost 20 years of continual
    development gives you. Let’s summarize why we should use KIE instead of a home-grown
    solution:


    +   - Developers – you want to use KIE as the cutting-edge AI tool from Red Hat
    and IBM. That looks far better on your CV than building your own.

    +   - Business users – you want to get the benefit of almost 20 years of development
    and have a ready pool of technical people to support the project. And you get
    all the authoring tools, training, and support that comes from IBM, Red Hat, and
    the wider community.


    There are many areas where the many years of KIE development will outclass a home-grown
    solution (for example, you’re not going to get a home-built version with the clarity
    of KIE Sandbox). But we’ll focus on the RETE-PHREAK algorithm because that also
    explains why rules engines are fast – faster than Excel, and faster than custom
    code.


    # The RETE and PHREAK approach to running rules (fast)


    The initial RETE algorithm came from Dr Charles Forgy (written in papers between
    1974 and 1979) and underlines the theory underpinning rule engines such as KIE
    and Drools. The PHREAK algorithm is a fundamental rewrite by the Drools team,
    taking advantage of 40 years of technology updates since then. Details of both
    papers are easily found online and well worth a read, but the key point is that
    all this thinking is pre-baked into Drools; we don’t have to build it ourselves.


    Remember that almost all the elements of our decision models (including decision
    tables) can be translated into something similar to rules in a when...then format
    – perhaps with additional attributes of which rules should be grouped together.
    Of course, this is an oversimplification. The Drools documentation has full details
    of what is actually going on in working memory – the space within Drools where
    all this evaluation is being carried out. But here is a summary:


    +   1. Firstly, our rules (including decision models) are loaded into working
    memory. The left-hand side (when) of a rule is evaluated. If one or more rules
    have all or part of a when part in common, we don’t need to evaluate it twice
    – we can link this part of the rules. This means we can build our rules into a
    network, not unlike Figure 12.12.

    +   2. Note that in this network, Drools has also done some analysis on the right-hand
    side (the then part of the rule). This is because when a rule is fired, it may
    trigger changes in the then part that bring other rules into play.

    +   3. While we build this network as the very first step, it is possible to dynamically
    change it during rule execution, but we’ll ignore this ability to keep things
    simple.'
  merge: -1
  img_proc: true
- pgno: 346
  md: '![](img/48815d6f06dc8c7aeaa3963d289fb1e7_346_0.png)


    Figure 12.14 – Sample Rete tree from our simple project


    +   4. Next, we load the facts into working memory. Facts can be as simple as
    the customer data that we passed into our decision model in earlier examples in
    KIE Sandbox.

    +   5. The presence of facts in the working memory activates certain rules (the
    when part of the rule is now true). Unlike traditional code, if there is more
    than one rule available to fire (the Agenda), the rule engine decides which to
    fire (and in which order) using conflict resolution.

    +   6. It is possible that a rule change executing a then condition causes a change
    in facts in working memory so that a rule once on the agenda is no longer lined
    up to fire. But other when parts of rules may match, so they will be added to
    the agenda instead.

    +   7. The process of evaluating rules against new/updated facts is known as truth
    maintenance. There are also measures within the rule engine to avoid circular
    rules (where a rule updates a fact, which sooner or later causes the same rule
    to fire again).


    The fact is that a home-grown solution won’t have network analysis nor robustness
    that has been tested by hundreds of thousands of users. And building a RETE network
    means that only a small set of rules needs to be evaluated with every change –
    this is different from traditional solutions where all possible solutions need
    to be evaluated, perhaps multiple times. So the speed advantage of rule engines
    increases the more business rules you have.


    As a final word, this was only one small area out of many that the Drools team
    has worked on to optimize the engine. And hopefully, it helps confirm your choice
    of Drools rules and KIE decision services to evolve past the problems you previously
    faced in Excel.'
  merge: -1
  img_proc: true
