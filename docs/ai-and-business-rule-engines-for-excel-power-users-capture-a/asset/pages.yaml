- pgno: 237
  md: '+   - Custom data types allow us to build containers to hold our data, using
    the basic building blocks (such as text, number, and Boolean). We also looked
    at constraints on data, to limit the values that can be used.

    +   - Lists may have looked familiar (since they are like a range of cells). We’ll
    introduce more advanced functions to manipulate them that stretch this concept.
    We’ll also cover functions to test ranges (think of a list but with sequential
    values – for example, `[1..10]`).

    +   - Related to lists are **contexts** (also known as **maps** or **relations**),
    which are like a list of key-value pairs – more on those soon, since while they
    are easy to use, the idea may be new to you as an Excel Power User.

    +   - We saw `if... then` expressions for branching and will soon introduce loops
    to act on list data.

    +   - We covered previously all the different node types in DMN (text, decision
    nodes, including decision tables, input data, and functions), and will return
    to invocation to better organize your decision models.


    Before we (re)start, there are a couple of FEEL language basics worth remembering:


    +   - FEEL is designed to be **side effect-free** – evaluating an expression shouldn’t
    change the values passed into that expression. This is different from (for example)
    Visual Basic code, which might update the value or color of a cell in Excel.

    +   - FEEL is designed to be **human-readable**, even allowing spaces in variable
    and function names. If you’ve used another computer language (such as JavaScript),
    you may find this strange.

    +   - Because of this, it’s worth remembering that FEEL will evaluate any text
    not in quotes as a variable name. `"Friday"` (with quotes) will match that exact
    text, while `Friday` (no quotes) will make KIE complain if there is no variable
    defined with that name. Both (with or without quotes) are **FEEL literals** –
    an expression that KIE can evaluate to a value.


    We’ll start exploring the FEEL language with lists – a very powerful but easy-to-use
    concept. But since lists work slightly differently than Excel, it’s worth looking
    at a few more in-depth examples.


    # Dynamic lists, contexts, and relations


    You might remember in *Chapter 4* that we graphically created `List` using a decision
    node of the `List` type. Look at *Figure 4.25* if you want to refresh your memory
    – it was a great way to clearly show the health issues we were looking for. But
    lists are much more dynamic than that. We already said that we could use FEEL
    expressions anywhere – and that includes within lists. For example, the list in
    *Figure 9.1* is a valid syntax. This example can be downloaded from the sample
    site (`https://github.com/PacktPublishing/AI-and-Business-Rules-for-Excel-Power-Users`)
    as `c-09-dynamic-lists.dmn`.'
  merge: -1
  img_proc: true
