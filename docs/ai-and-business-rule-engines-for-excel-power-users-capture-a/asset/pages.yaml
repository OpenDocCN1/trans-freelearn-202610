- pgno: 340
  md: '*Congratulations* – you’ve just run your first business rule using Red Piranha.
    In the rules, we want to highlight three important things:


    +   - Near the top of screen, Red Piranha lists the Excel file it read (input)
    information from, the file with the Business Rules it supplied to the Drools rule
    engine, and the Excel file it wrote the output information to.

    +   - Further down the screen, we should see information about all the information
    being read in from Excel, messages as the rules fire, and what is about to be
    output into another Excel file. Much of this is clickable, so it’s worth spending
    a few moments to explore it now.


    # Too much information?


    Since Red Piranha maps all of the data available in Excel into a format KIE can
    use, a lot of information can be displayed. It uses **named ranges** in Excel
    to decide which data to extract and convert.


    We’ll explore the exact conversion format soon, but the data format being used
    within Red Piranha is similar to the custom data type we set up in the KIE sandbox
    in Chapter 4. Figure 12.11 shows (some) of the information it has converted from
    Excel during the conversion process.


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_340_0.png)


    Figure 12.11 – Information that Red Piranha has read from Excel'
  merge: -1
  img_proc: true
- pgno: 341
  md: 'All of this information is also printed to the console, if you prefer to view
    it there.


    You’ll notice that there are several other examples listed on the screen. It’s
    worth exploring them as well. But you’re probably keener to run your own examples
    within Red Piranha.


    > **Different versions of Red Piranha**

    > Red Piranha is under active development, so it likely that what you seen on
    screen will differ slightly from the screenshots shown here. There will always
    be a stable Docker image, and a stable main (default) branch.


    # Running your own files in Red Piranha


    While the samples are interesting, you probably want to run your own files through
    Red Piranha. Given that the web page (in Figure 12.10) has instructions on how
    to select your own files (an Excel input file, a rules file, or an output file),
    this is easy. There are also detailed notes on the Red Piranha GitHub page. But
    I’m highlighting four key points to save you time:


    +   - Docker runs Red Piranha in a container isolated from your laptop. That is
    great for security but means you need to think about how you make files from your
    laptop available to Red Piranha. Fortunately, our command to start the Docker
    container used the -mount flag to link a folder on your computer, c:\some-shared-folder,
    to a folder within the Docker container, \some-shared-folder.

    +   - Once we have these folders mounted, an Excel file containing our input data
    can be saved in the c:\some-shared-folder\someinput.xlsx folder. We can then tell
    Red Piranha (running within Docker) to read from that file by putting \some-shared-folder\someinput.xlsx
    in the Input File Name box that we saw in Figure 12.10.

    +   - Red Piranha converts Excel files (or the named ranges within Excel files)
    into a set of custom Cell objects. The details in Figure 12.11 show this conversion
    in progress, which is useful when writing rules to match against the data contained
    in these Cell objects.

    +   - While Red Piranha supports decision models, most of the examples use the
    more advanced DRL format. We’ll explore this format later in the chapter, as it
    is very useful to know.


    While Docker makes it easy to use Red Piranha, it is almost as easy to use Codespaces
    and VS Code online to customize the project to do exactly what you want. It is
    open source after all, so let’s try that out.


    # A look inside the Red Piranha project using Codespaces and VS Code


    Even if you don’t intend to dive into Java development using Red Piranha as a
    launching point, it is useful to take a look at the code. That way you can see
    more of the layout of the custom data model (Cells) and edit the sample DRL (rules)
    files.'
  merge: -1
  img_proc: true
- pgno: 342
  md: 'Running Red Piranha in Codespace is almost exactly the same as running the
    Kogito examples earlier in the chapter:


    +   1. Open the Project on GitHub: https://github.com/firstpartners-net/red-piranha.

    +   2. Click on the green <>Code button in the menu that appears, then click on
    the + button to create a Codespace on the default main branch.

    +   3. After a couple of moments, while Codespaces starts, the VS Code online
    editor will appear in the browser.

    +   4. In the terminal, type cd code to go to the correct directory. Then, to
    start Red Piranha using Spring and Maven, type mvn spring-boot:run.

    +   5. The project will start up (downloading libraries as needed) and show a
    message with the Spring logo and the directories it is using.

    +   6. Eventually, VS Code will display a message, like in Figure 12.12, showing
    that the application is on.


