- pgno: 43
  md: 'Every organization will have its own rules, it’s part of the reason why an
    organization exists. To make sure the idea is clear, here are other examples we
    can consider:


    +   - When a new employee starts, then add health and safety to the required training
    list

    +   - When a new employee starts, then issue them a badge

    +   - When a badge is issued, and the employee is a new start, then send the employee
    an email with instructions about the new starter discount at the canteen

    +   - When a badge is used for the first time to pay at the canteen, then give
    a 10% discount on this order


    Typically, there can be hundreds of such business rules, but the when ... then
    format makes them easier to review and maintain.


    Just from reading the preceding four rules, you can see how the condition of one
    rule firing (the then part) would trigger other rules to fire in a cascade. Note
    that they don’t necessarily have to fire in order (the first two could be valid
    at the same time). You may also have spotted that the third rule has an and clause
    – both parts must be true for the rule to fire.


    We’ll cover these and many more powerful and clearer ways to write business rules
    in later chapters. But first, since we can only get so far running business rules
    on paper, there must be a better and faster way of running these rules, right?


    # A business rule engine you already own


    It is no surprise that there is a way to automatically run these business rules.
    It’s called a rule engine. What may surprise you is that you already own a (very
    simple) rule engine in Excel. Take a look at Figure 1.5, showing a feature of
    Excel that you may have used many times – conditional formatting.


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_43_0.png)


    This editor can be found in Excel under Home | Conditional formatting dropdown
    | Manage Rules.'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'In this particular example, we have three rules:


    +   - When the value is greater than 80, then set the cell to green

    +   - When the value is less than 25, then set the cell to red

    +   - When the value is greater than 20 and the value is less than 80, then set
    the cell to yellow


    An important note for readers paying attention – notice that the last two conditions
    overlap. What color will Excel choose for cells with a value of 22? Figure 1.6
    shows the result:


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_44_0.png)


    Figure 1.6 – Conditional formatting rules applied to a spreadsheet


    As expected, the cell with a value of 100 is green, and the cell with a value
    of 40 is yellow. You may (or may not) be surprised to see the cell with the value
    22 is red. How did the formatting rules decide which of the two possible rules
    to apply?


    The answer, in this case, is salience. When there is a conflict between rules
    (that is, more than one rule can fire), the Excel conditional formatter executes
    the action of the first rule it finds. This is why the cell with a value of 22
    is formatted in red (as that rule is higher up in the list). More powerful rule
    engines give much more efficient ways to resolve conflicting rules. For now, a
    good habit would be to keep the rules as simple as possible, trust the rule engine
    to sort out any conflicts, and validate results when possible.


    Other rule engines in Microsoft Office 365

    If you’ve become a fan of hidden rule engines within Microsoft Office, take a
    look at the Inbox Rules feature in Outlook. It also contains a rule engine to
    help you respond to your many emails.


    # Don’t use Excel as a rule engine


    We don’t recommend using Excel as a rule engine. While the when part of the conditional
    formatting rule can hold some logic (users can use pretty much any formula in
    Excel), the then part is much more limited – it only allows setting the cell color
    or formatting. This results in limited interaction between the rules – the result
    of one rule firing cannot create or change conditions for other rules to start.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# More powerful business rule engines


    So far in this chapter, we have described the problems you may have encountered
    using Excel, and how AI and, in particular, rules-based AI might be able to help
    solve these problems. These ideas are not very useful without a tool to implement
    them, and you will be glad to know that more powerful rule engines exist.


    We will not go into too much detail (yet) on these rule engines, since we’ll start
    covering that in the next chapter. For now, we just want to prove that they exist,
    they are easy to use, and they follow the same when ... then format that we introduced
    earlier. Figure 1.7 gives an example of one more powerful business rule engine:


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_45_0.png)


    Figure 1.7 – A guided business rule editor


    Figure 1.7 shows a sample business rule written in the guided editor that we’ll
    see in Chapters 3 and 4. It uses the when ... then format that we’re now familiar
    with. The first three columns of the table are the when condition and the fourth
    is what action happens as soon as the condition is met.


    Remember that this is a web-based editor, so it’s easy to use. These rules are
    saved in executable format, being ready to run in a rule engine.


    Even without explaining the rule in detail, it is pretty easy to figure out what
    would activate it and then what will happen when it does. When a person resides
    in a particular location, then recommend them a particular chocolate (candy) bar.


    > **Where is the information stored for our rules?**

    > If you have an Excel background, where you’re used to referring to values in
    other cells such as =A4, you might wonder where values such as Country of Residence
    are coming from in the preceding example. For the moment, think of it like a named
    range in Excel – a convenient name to make things clearer.'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'As we begin to look at more powerful tools such as rule engines, it turns out
    there is a lot of hidden power from understanding details such as “where is the
    data stored” or “where is the data coming from.” The best way to introduce this
    concept is to understand some more of the very clever things Excel does for use.


    # Splitting Excel into different pieces


    We use Excel so much that we don’t pause to think how powerful it is. While it
    looks like a single block, Excel can be broken down into many different components.
    *Figure 1.8* shows one simple way of breaking out Excel into different parts.


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_46_0.png)


    Figure 1.8 – Excel broken into simple model, view, controller pieces


    This pattern is a way of breaking up Excel into more simple parts, each with one
    key job to do:


    +   - You give commands to Excel using the **controller**. Typically, this means
    clicking on a command in the toolbar, on the menu, or elsewhere on the page, which
    makes Excel do *something*. This *something* usually changes the model.

    +   - The **model** is how Excel stores its data. If you’ve imported CSV or other
    non-Excel formats before, you may have a clearer idea of this. These formats are
    *pure data*, without any functions or VBA code.

    +   - Excel can present this data as one or more views. When the model updates,
    the view updates automatically. In this example, there are two views, both showing
    different representations of the same model – one showing sales by region in a
    table format and the other as a graph.'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'Since Excel is composed of *many different parts*, many being behind the scenes,
    we can pick and choose the parts we want to use. This book proposes replacing
    the *controller* with a business rule engine solution that updates the Excel model
    (data file). That way, instead of having to use lots of repetitive clicks to get
    the output we want, everything can be automated, and we can still view the output
    in Excel.


    This is a more sophisticated version of the solution we introduced back in *Figure
    1.2*. It allows us to split our data in Excel from our business rules in a separate
    file, which makes for a more robust solution. In *Chapter 8*, we’ll see how we
    can combine lots of different approaches (manual Excel edits and automated business
    rules) in one workflow.


    > **Design patterns**

    > Some people would consider the way we have described Excel as being close to
    the Model View Controller design pattern. The key point is to think of Excel not
    as one monolithic block but composed of many different components. This book proposes
    swapping out and upgrading some key components while keeping the rest that are
    still familiar and useful to us.


    # Other solutions are available


    You may be surprised to read this in a book about rule engines and AI, but other
    solutions are available. These solutions could be as follows:


    +   - **Code-based**: For example, learning a language such as Python gives you
    tools to script and automate many Excel tasks. While great for repetitive tasks,
    be careful that you don’t encounter the *knowledge disappearing into code* problem
    we described earlier.

    +   - **No-code or low-code tools**: For example, Microsoft Power Automate. These
    allow you to chain a lot of simple steps together in a workflow. Business rule
    engines complement this approach really well, when you have a step that needs
    to make a more complex decision. We start looking at Power Automate (using it
    with rule engines) in *Chapter 8*.

    +   - **Pure AI and data science**: We mentioned before that rules are only one
    of the many types of AI. Excel has some great statistical model features and extensions,
    and Python will give you even more. We recommend this approach when you don’t
    have the answer, but you do know that the answer is hidden (somewhere) in the
    large amount of data that you have.


    More likely than not, the best solution for you will contain all of these elements.
    We’ll cover more of these approaches in the second half of this book. We’ll give
    you a flavor of what tools are available and how they can combine to enhance a
    business rules and Excel-based approach.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Future proof investments


    Banks were early adopters of technology, and they bought mainframe technologies
    when they first appeared. Their business rules were written in COBOL (an early
    type of programming language). The trouble is their business knowledge disappeared
    into code – and now several banks are stuck using the old-style mainframes. This
    means job security if you are a COBOL programmer, but it’s tough on banks competing
    with new Fintech startups.


    The when … then format is much more readable. While business rule engines and
    rules standards will continue to evolve, in a worst-case scenario, the rules are
    self-documenting and can be rewritten with whatever new approach appears. Will
    people still understand your spreadsheets as clearly in 10 years?


    # Summary


    In this chapter, you learned that you are not alone in your frustrations with
    Excel, but that it is far too important of a tool to abandon. We looked at enterprise
    solutions that can solve some of the problems you are facing, but often these
    have an overly large gap to bridge before they are useful to you. Trying to bridge
    this gap, we looked at the core business problems we might use Excel for and discovered
    that AI, and in particular a rules-based approach, might be able to help.


    One good surprise is that business rules are very familiar, and we might have
    used them already without knowing it. We discovered that Excel is actually a much
    more powerful tool than we give it credit for and that we don’t need to fully
    replace it, just upgrade certain parts – if we aren’t afraid to delve under the
    bonnet. We also mentioned that while other solutions are available, an approach
    based on business rules is a good investment since it has a large element of future-proofing
    built in.


    We promised practical solutions to Excel problems as part of this book. The next
    chapter begins to deliver on these as we move from the idea of a business rule
    engine to one that we can actually download and run.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# Choosing an AI and Business Rules Engine – Why Drools and KIE?


    In the previous chapter, you saw how a rules-based AI approach could help solve
    your Excel problems. However, you’re not going to get very far without choosing
    a full business rules engine to execute your rules.


    This chapter takes you through potential rule engine solutions available on the
    market and chooses one that we will use throughout the book. It also shows you
    why it’s important to think not only about solving your immediate problem but
    also about how you’re going to work with colleagues and scale your solution in
    the future. To do this, we are going to do the following:


    +   - Understand the different types of people reading this book and find out
    which group you fall into

    +   - Look at many of the available rule engines and evaluate them against our
    criteria

    +   - Explain why open source provides a huge advantage for support and how it
    helps confirm our choice of which rule engine to use now

    +   - Understand enterprise software better and understand where rule engines
    fit in the wider range of business solutions, so we know our choice is a good
    one for the future

    +   - Learn how to ask for help in the open source world

    +   - Introduce the projects to support running the rule engine samples

    +   - Look at four different ways we can host and run our business rules


    By the end of the book, you will be able to use the KIE/Drools rules engine to
    build more powerful solutions, extending what you can do in Excel. Since a large
    part of deploying these extended solutions in real life will involve working with
    colleagues, it is helpful to start with understanding the kind of reader you are.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# Are you reading this book for personal or business reasons?


    It is very likely that you’ll find yourself fitting into one of the following
    categories:


    +   - **Personal use or exploration:** You own the laptop that you are trying
    out these samples on, and your main aim is to improve your skills. While you have
    complete freedom to install software (a good thing), you do not have an IT helpdesk
    to turn to if things go wrong (not so good).


    +   - **Business user:** As one of the first people in the organization to try
    AI and business rules, you’re still driven by the need to improve your skills,
    but you may also have a business problem in mind. More likely than not, there
    will be restrictions on the software you can install on your laptop. On a positive
    note, there is an IT helpdesk to support you. While your colleagues may not understand
    business rules engines, they can help you work through these instructions to set
    one up.


    +   - **Business user, joining an existing rules project:** You’ve been handed
    this book by the team running the business rules project to help you get up to
    speed. It is likely that they have much of the technical setup already completed.
    It is still worth reading this chapter so you know more about the technologies
    they have chosen.


    No matter what situation you find yourself in, this book will walk you through
    the instructions step by step. First, we need to choose a business rules engine
    to install.


    # Which business rule engine to use


    We saw in the previous chapter that rules engines can be embedded in many places
    that you don’t expect (such as Excel and Outlook). There are hundreds of rule
    engine-like projects out there. So, how do we filter through these to pick one
    that can run the *hands-on* examples in this book? We’ll do this filtering based
    on the following criteria:


    +   - We need a good user interface for editing rules, aimed at business users.
    This rules out *Jess* and *Prolog*, which are very powerful but need a lot of
    technical knowledge.


    +   - The main focus of the product should be rules. For example, we’ll see other
    products later in the book that use workflows (for example, *Microsoft Power Automate*).
    These are great for doing steps in order but don’t have as powerful decision-making
    capabilities.


    +   - Since you’re in *learning* or *trying things out* mode, you want it not
    only to be free to download but also free from hefty license costs in the future.
    We’ll explain later how open source is a good fit for this, but for the moment,
    it rules out fully commercial vendors such as *Trisotec*, *TIBCO*, and *FICO*.


    +   - The program must be available to be downloaded and installed by an Excel
    power user. This excludes *Microsoft Biztalk Server*, which is a very powerful
    product but needs to run on the Server version of Windows.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '+   - If we’re investing time into learning a product, we want one that has
    been around for a while and has an active community – increasing the chances it
    will last into the future. This excludes many of the smaller hobby or proof-of-concept
    rule engines.

    +   - If all goes well, we might persuade colleagues to adopt the rule engine,
    which is easier to do if it comes from a *big-name* vendor. This rules out smaller
    vendors such as *Hyperon* (`Hyperon.io`), which is probably the harshest exclusion,
    since it is a very capable product with an active team behind it.


    KIE and Drools backed primarily by Red Hat and IBM meets all of these criteria,
    making it our choice for running most of the book’s samples. KIE and Drools gives
    us the following:


    +   - **A Business Rules Management System (BRMS)**: A lot of the alternatives
    we discarded had a core rule engine but not much more. Since KIE and Drools gives
    us the core engine *and* rule authoring tools, it is much easier to write and
    manage our business rules.

    +   - **An editor for Decision Model and Notation (DMN)**: An industry-standard
    way of modeling rules, it means that a lot of what you read in this book is applicable
    to other tools. KIE Sandbox, the VS Code plugin, and the Business Central web-based
    editor mean that you have access to more powerful diagnostic tools, over and above
    this standard.

    +   - **An Apache 2.0 license (open source)**: We’ll talk about open source later
    in this chapter. The key message is that this license gives you a wide choice
    of where and how to deploy your business rules without having to pay upfront.


    # What’s in a name – KIE, Kogito, or Drools?


    In this chapter, we’ve used the terms KIE, Drools, and Kogito almost as if they
    were the same project. While the three projects work very closely together, it’s
    useful to note that there are fundamental differences:


    +   - The original business rules community project is **Drools**. While it is
    possible to interact directly with Drools (and many advanced projects do so),
    we take the easier approach of using the tools provided by KIE. The Drools home
    page can be found at `https://www.drools.org/`.

    +   - **KIE** (or **Knowledge is Everything**) is the umbrella project of which
    Drools is now part. For example, it provides KIE Sandbox, which we’ll use to edit
    rules and decision models starting in *Chapter 3*. It also provides other knowledge
    management tools, such as integrating machine learning and rules, which we’ll
    cover in *Chapter 11*. The KIE home page can be found at `https://www.kie.org/`.

    +   - The **Kogito** project empowers KIE solutions with cloud capabilities. It
    allows Drools and the other KIE projects to be first-class citizens in cloud environments,
    which we’ll leverage when deploying our rules in *Chapters 5 and 10*. The Kogito
    home page can be found at `https://kogito.kie.org/`.'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'As an umbrella project, KIE provides several other tools that we don’t cover
    in this book. **OptaPlanner** is a project that leverages Drools, which could
    be described as a much more powerful version of the Solver tool in Excel. **jBPM**
    is a business process management tool (or workflow engine) that allows us to orchestrate
    key business steps in the right order. We’ll meet jBPM again briefly in *Chapter
    8*. More information on both tools is available on the KIE home page.


    Finally, IBM and Red Hat have released commercial versions of most of these products.
    You may see the name **Red Hat Decision Manager** or **IBM Decision Manager Open
    Edition**. For simplicity, we won’t use these corporate names, even though most
    of what we discuss in this book covers these products as well.


    Now that we understand the KIE, Kogito, and Drools projects better, let’s confirm
    that we’ve made the right choice to select them as our rule engine.


    # Why choose KIE and Drools as our Rule Engine?


    Let’s go over our criteria again and explain how KIE and Drools meet each of them:


    +   - KIE and Drools give us several options to edit rules, in particular, a powerful
    but simple-to-use web-based editor aimed at business users.

    +   - The Drools component of KIE is a very sophisticated rules engine. While
    it integrates into a wider toolkit, it can also be used standalone.

    +   - KIE and Drools are available as open source technology. This means you can
    try it out for free, without needing to commit to paying either now or in the
    future.

    +   - KIE and Drools are Java based, so will run in a variety of environments.
    It’s also extendible, for example, to make it work easier with Excel.

    +   - Drools (one of the core components of KIE) has been running as an extremely
    active open source project since 2001 and has recently delivered several key upgrades
    through the Kogito initiative.

    +   - KIE and Drools is backed by Red Hat and IBM, growing through community collaboration.
    *Nobody ever got fired for buying IBM products* used to be a saying in the IT
    industry. Bringing up IBM will help if you’re talking to colleagues to bring them
    on board with your solution.


    **I need to use another rule engine – what now?**

    From reading the preceding list, and even doing a Google search of the products,
    you will see there are many different *flavors* of rule engine, often packaged
    as part of a bigger enterprise solution. While we highlighted KIE as the most
    powerful one that is also easy to get started with, rest assured that much of
    what you’ll learn in this book can be applied to other products.


    You can understand why we’re such big fans of KIE and Drools. But two of the previous
    points appear to contradict each other. How can KIE be supported by both a vibrant
    community and a major multinational corporation (that is, Red Hat and IBM)? To
    explain this, and why it is a good thing, we need to look at the Red Hat and IBM
    business model.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Open source and the Red Hat and IBM business model


    Imagine you’ve bought a piece of land and are building your own house. In theory,
    this is easy. Standard plans are available on the web, including architectural
    drawings, lists of the materials you need, and videos on how to put it all together.
    For the trickier parts (plumbing and electrics), you can hire a suitably qualified
    person, give them instructions, and ask them to complete that piece.


    You could call these instructions **open source** – you might have heard the term
    before. In the software world, it’s where all of the necessary instructions to
    build products such as Kogito/Drools are freely available on the web. Even better,
    because the instructions can be run by a computer, with the right setup, you can
    push a button and everything builds itself. Easy – in the same way building a
    house is *easy if you know what you are doing.*


    So, why do people often choose not to build their own software, or build their
    own house?


    Sometimes you want something already built – just turn the key and it’s ready
    to go. Sometimes you don’t have the time or skills – it’s nice to buy something
    somebody else has already made. And sometimes you need a guarantee that everything
    will work in the way you expect it to – where the reassurance that comes from
    paying a major vendor (such as Microsoft for Excel, or Red Hat and IBM) means
    you get more sleep at night.


    This is how Red Hat makes money. It makes the plans for its software freely available
    on the web to increase the number of people using it. But if you need something
    prebuilt or with added support, you can buy a corporate-level subscription. It’s
    a very successful approach. IBM paid about $34 billion to acquire Red Hat in 2018,
    and its value has increased since.


    For you, deciding to use a Red Hat product such as KIE and Drools means two good
    things:


    +   - You can freely download and use the software, knowing that you’ll never
    be surprised with a bill at any point. The main websites for this approach are
    www.drools.org and https://kogito.kie.org/.

    +   - If you or your colleagues need the comfort of corporate-level support, that’s
    available for you as an optional commercial support contract. The main website
    for this offering is https://www.redhat.com/en/products/process-automation.


    Most readers of this book will never need commercial support from IBM and Red
    Hat. But even so, it’s good to know that it is there. So, let’s focus on what
    benefits KIE being open source brings to you.


    # How KIE being open source helps you


    In some ways, Excel spreadsheets (the file, not the Microsoft program) have their
    source open for viewing. Since most spreadsheet files aren’t password protected,
    if you have a copy of somebody else’s spreadsheet, you can often open it and learn
    how it works.'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'Within reason (for example, if you work at the same company as the creator),
    you can update the Excel sheet and make it even better. This is useful, for example,
    when the original author has left the company and the sheet is vital to keep the
    business running.


    Open source means that you have all the details of the software design available
    to you, instead of just downloading the end product as a binary file that you
    cannot change. It means that you can modify, build, and run the software both
    now and in the future – even if the original vendor goes out of business.


    Open source is supported by a set of tools to allow the easy sharing and building
    of these source files into usable software. While there are software license agreements,
    the focus of these is to ensure the source remains open and supported by an active
    community, both now and in the future.


    Red Hat gives a lot more detail on the background to the open source movement,
    the types of licenses, and what it means for us at https://www.redhat.com/en/topics/open-source/what-is-open-source.
    The Kogito/Drools rules engine is made available under the standard, business-friendly
    Apache license. This license guarantees you access without requiring you to share
    any changes you make to it.


    When you think about it, this *access to the source* is unusual for much of the
    software world. You don’t normally get to take things apart and make them better.
    But having open access means you have a range of support options. If you don’t
    like the support from the main vendor, you are free to get help elsewhere from
    a range of community and paid-for options.


    So, for most people reading this book, the advantages of open source are as follows:


    +   - A community of people to help you solve your problems as you try out Kogito
    (building a proof of concept)

    +   - Gives you a roadmap and long-term access to the Kogito tools when you commit
    to using Kogito long-term in production (for example, using it in real-life business
    situations)


    # From proof of concept to production, and everything in between


    When starting with Excel, we often start *playing* with it to find a solution
    to an immediate problem. If it works, we quickly use it in our day-to-day tasks
    without giving it much thought – often on the same laptop. That’s a great way
    to respond to problems quickly, but often we find ourselves *breaking* an existing
    Excel sheet to introduce new features.


    With enterprise software (such as KIE and Kogito) these steps are similar but
    much more formal. For much of this book, we’re at the **proof-of-concept** stage,
    playing with Kogito to see whether it can help us.


    In the final chapters, we discuss how to deploy a Kogito-based solution in **production**
    for real-life use, on a different computer, with the help of experienced colleagues.
    Before we get to that point, those colleagues will help us to move the solution
    through formal **development** and **testing** phases to ensure the project does
    what we need it to do.'
  merge: -1
  img_proc: true
- pgno: 55
  md: "While some contributors view open source as an end in itself, we take a more\
    \ pragmatic approach in this book. Let’s focus on three advantages – how open\
    \ source can be more secure, how open source can give you additional support,\
    \ and the specific resources that KIE/Drools make available as an open source\
    \ project.\n\n# Open can be more secure\n\nThe technologies and solutions proposed\
    \ in this book are secure...not because I say they are, but because you (and your\
    \ colleagues) can audit where the software and solutions come from. You’ll get\
    \ a lot of reassurance from the following:\n\n+   - The project’s source code\
    \ is viewable, so you can inspect the code before you run it\n+   - The projects\
    \ are often sponsored by major vendors such as IBM (Red Hat) and Docker, with\
    \ a lot of documentation on how to set up a secure production environment using\
    \ these technologies\n+   - The samples run within containers, so you can limit\
    \ access to other resources (less harm if things go wrong)\n\nHowever, it is important\
    \ to remember that the examples in this book emphasize ease of use over security.\
    \ For example, the version of the KIE Sandbox rules editor that we will use has\
    \ no username or password. This is great (as it’s one less thing to stop you from\
    \ running the sample), but please have a conversation with your IT colleagues\
    \ when you decide to move from trying things out to using it as a day-to-day business\
    \ system. A best practice to follow is setting up a fresh, secure environment\
    \ for you to deploy your work into. Instructions on how to do so can be found\
    \ are on the project site. See the KIE, Kogito and Drools Resources section.\n\
    \n# Asking for help in Drools (or in any open source project)\n\nKnowing where\
    \ to ask for help in the open source world is easy. We’ll introduce the main websites\
    \ of the three projects we will use later in this chapter. Since most open source\
    \ projects are hosted on a platform such as GitHub.com, once you get used to its\
    \ layout, you’ll find it very easy to navigate.\n\nFor the moment, think of GitHub\
    \ as a more powerful version of OneDrive or SharePoint, with a community wrapped\
    \ around it. Figure 2.1 presents a screenshot of the Drools (rule engine) home\
    \ page on GitHub. All projects hosted on GitHub will follow this format:\n\n>\
    \ **Looking under the bonnet (hood)**\n> Whenever I buy a car (automobile), I\
    \ typically open the bonnet (or hood) and look at the engine bay. I don’t know\
    \ why I do this – I won’t be doing my own repairs. Maybe I look to reassure myself\
    \ that the engine exists, it looks clean, and I can identify where to add oil\
    \ and water.\n> \n> Keep this in mind when you look at the following screenshot.\
    \ It’s good to know where our more technical colleagues will be working. But really,\
    \ what we’re looking for is the two or three user-friendly links that we can actually\
    \ use."
  merge: -1
  img_proc: true
- pgno: 56
  md: '![](img/48815d6f06dc8c7aeaa3963d289fb1e7_56_0.png)


    # Figure 2.1 – Drools home page on GitHub


    We’ve simplified this screenshot of https://github.com/kiegroup/drools as there
    are a lot more files and folders on the home page of GitHub (the folder icons
    at the middle left of the screen). These files allow you to modify and build the
    Drools/Kogito rule engine completely from the source if you want. We are not going
    to be doing this in this book, so let’s look for the information on this page
    that we need to use:


    +   - At the top right is an About section giving a one-line summary of the project.
    Since it describes the project as a rule engine, we know we’re in the right place.
    It also links to the main project site (drools.org), which we’ll explore in a
    couple of minutes, and gives mailing lists for user support.

    +   - At the bottom left is the readme.md – a more detailed description of the
    project. It repeats the link to the website but also shares more links to the
    documentation for the project.

    +   - At the top left are tools for collaboration (such as Code and Branches or
    Main). We won’t be going into this in detail, but if you do want to know more
    about how hundreds of people across the world can use these tools to work together
    on a complex product, take a look at the Packt book by George Lomidze, Git and
    GitHub: The Complete Git and GitHub Course, available at https://www.packtpub.com/product/git-and-github-the-complete-git-and-github-course-video/9781800204003.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '+   - On the right of the page are measures of project activity, such as people
    watching, stars, forks, and releases. Not surprisingly, this is a very active
    project – we wouldn’t ask you to invest your time in anything less.

    +   - This is not shown, but in the bottom right are the contributors to the project.
    At the time of writing, there are more than 200 contributors, which makes it one
    of the most active projects on GitHub. It’s good to see there are *real people*
    behind the project.


    We’ll come back and use GitHub in more detail as a place to save our business
    rules in *Chapter 5*. There, we’ll have the chance to get familiar with the standard
    GitHub page layout.


    # The best way to ask for help in the open source world


    While it’s easy to find *where* to ask for help, I don’t want to leave you with
    the impression that these 200 contributors are just sitting there waiting for
    a call from you. While they are passionate about the KIE project, these are busy
    people, all with a day job (like you). Knowing *how* to ask for help will get
    you better results. In one line, a little humility and a lot of trying to solve
    the problem first will go a long way.


    > **Try it on your colleagues**

    > The following *how to ask for help* steps are equally valid when it comes to
    working with your colleagues on the IT helpdesk as when reaching out to the open
    source community.


    The following are the steps to follow when you run into an issue. It is possible
    that you’ve already asked for help on Excel community forums in the past. If so,
    none of the following steps should appear unfamiliar to you:


    +   1. Always assume that it is your mistake, not a problem in the underlying
    project you are using. Ninety percent of the time, when you work through it step
    by step, you’ll find a spelling error, a problem with an internet connection,
    or some simple misunderstanding. You will lose a lot of credibility if you approach
    the project developers with something that turns out to be your fault and is a
    very simple error.

    +   2. **Read the Fantastic Manual (RTFM)** is age-old advice, with the addition
    of **Search the Fantastic Web (STFW)**. While the material we are working through
    in this book is new to us, plenty of people have tried similar things before.
    Take your time to read this book and the online documentation and double-check
    any other instructions you are working through.

    +   3. Google any error messages. Error messages make for great search terms as
    they are often very specific. The search engine will suggest plenty of pages with
    areas worth investigating to help solve your problem.'
  merge: -1
  img_proc: true
- pgno: 58
  md: "+   4. Turn it off and on again. It is only half a joke that your IT helpdesk\
    \ will ask you to restart your laptop to resolve a hard-to-fix problem. A less\
    \ radical approach is to close and reopen the individual pieces of software (for\
    \ example, the web browser, or restarting the Docker desktop service). Modern\
    \ software is complex with many moving parts that are easy to get out of sync\
    \ with each other. Reopening them gives them a fresh start, and makes it more\
    \ likely all the different pieces will line up correctly.\n+   \n+   5. Make sure\
    \ you are looking in the right place for help and information. Remember that this\
    \ book combines several different projects and technologies (Excel, Drools, Docker,\
    \ Azure, Power Automate and OpenShift, Visual Studio, and others). Asking an Excel-specific\
    \ question on a Drools mailing list is unlikely to return a response.\n+   \n\
    +   6. Look for similar problems. When you are searching mailing lists and the\
    \ web, be open to reading about problems that are similar but not an exact match\
    \ for your current issue. Some of the steps taken to solve that other project\
    \ may also help you.\n+   \n+   7. Two pairs of eyes are better than one. I've\
    \ lost count of the number of times a colleague spotted the issue within a couple\
    \ of minutes of looking at my project. This is also true where they don't have\
    \ expertise in that technology – a fresh approach is sometimes enough. At the\
    \ very least, having to talk through what you are doing and the Q&A that follows\
    \ will unlock several suggestions that will get you nearer to a solution.\n+ \
    \  \n+   8. Make your question standalone. Very few people will have the exact\
    \ same setup as you do. The more that you can remove special setup steps when\
    \ asking your question, the bigger the pool of people that will be able to help.\
    \ It's even better if you can include steps to reproduce the problem (as a step\
    \ 1, 2, 3 format or a code sample).\n+   \n+   9. Make your question smart. You're\
    \ asking for help, and the community is under no obligation to respond to you.\
    \ Taking the time to make your question clear and concise will increase your chances\
    \ of success. A well-known guide in asking smart questions, by Eric Raymond, can\
    \ be found here: https://github.com/selfteaching/How-To-Ask-Questions-The-Smart-Way.\n\
    +   \n+   10. Check again. Before you ask the question, go through all the preceding\
    \ steps and document the steps you have already taken. This will give you credibility\
    \ in asking your question, and avoid the frustration of getting back suggestions\
    \ that you've already attempted.\n+   \n+   11. Now, and only now, post your question\
    \ and wait. Since you're looking for community support, you need to be prepared\
    \ for a delay in receiving an answer (if at all). You may not receive a complete\
    \ answer, but steps toward a solution. For some people, this is fine. But if responsive\
    \ support is a must for you, it might be worth looking at the commercial support\
    \ options from Red Hat and other vendors.\n\nYou'll notice that we haven't (yet)\
    \ supplied you with the actual locations to ask questions. We'll share those shortly.\
    \ The open source community is friendly but might have been worn down by lazy\
    \ questions in the past. So with a bit of thought, your question will stand out\
    \ and get answered.\n\nWhen you find a solution (or part of one), share it back\
    \ via the mailing lists or help forum for that community. While this is good karma,\
    \ on a more practical level, it will help bolster your reputation in the community\
    \ and make it more likely that you will get help in the future."
  merge: -1
  img_proc: true
- pgno: 59
  md: 'Now that you know how to ask questions, let’s look at one of the places we
    can ask questions related to the Kogito/Drools project.


    # KIE, Kogito, and Drools resources


    We’ve touched on a lot of aspects of the Kogito/Drools project already. We’ve
    seen the various components of the project, alongside the Drools rules engine.
    We’ve seen the dual nature of the open source and commercially supported projects
    from Red Hat and IBM. We’ve also seen the Drools GitHub site as a jumping-off
    point to learn more about the project and ask for help.


    While this book will walk you through everything you need to get started with
    business rules, we want to give you resources to learn more, explore, and ask
    questions about the KIE/Drools rules engine.


    Before you follow the upcoming links, remember that the documentation is written
    for people already familiar with business rules and the underlying technologies.
    It will become more accessible to you as you work your way through this book.
    Just don’t be overwhelmed by the complexity and detail of information being shared
    on these sites now:


    +   - As we saw in our previous look at the GitHub site for Drools, the main Drools
    site is https://www.drools.org/.


    +   - The navigation bar at the top of this site contains links to the overall
    umbrella community (KIE). Many of these links (but not all) are relevant to the
    business rules engine – for example, the Kogito project home page at https://kogito.kie.org/.


    +   - More information on the corporate version of this product, Red Hat Decision
    Manager, can be found at https://developers.redhat.com/products/red-hat-decision-manager/overview,
    which is especially useful when making the business case to colleagues for using
    a rules-based solution.


    These three links are the most likely to stay relevant, while the following links
    might change over time. If any of them are broken, you should be able to search
    for the updated one:


    +   - Since the starting point for readers is KIE Sandbox, the resources listed
    on the main KIE page are probably best to look at first: https://kogito.kie.org/get-started/.
    This lists the main guides, examples, and technical documentation for the project.


    +   - The Kogito documentation is updated with every release and goes into more
    detail about the features we highlight in this book. It’s available online at
    https://docs.kogito.kie.org/latest/html_single/.


    +   - Remember that underneath, Kogito uses the Drools rules engine to power the
    decision services. There is a lot of rule engine documentation on the site at
    https://www.drools.org/learn/documentation.html. Over time, this documentation
    is becoming more business user friendly, but some of it may be more suitable for
    technical developers.'
