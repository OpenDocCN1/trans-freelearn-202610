- pgno: 171
  md: 'More importantly, we’ll take a look at what just happened in the formula we
    just entered. All M formulas follow a standard let ... in format. let sets out
    the steps to obtain data and transform it. in displays the data to the user. In
    this case, let has only one line, but there are four key things happening in it:


    +   - `Excel.CurrentWorkbook` gets the current workbook

    +   - `{ [Name="SourceUrl"] }` gets the range/table of that name from that workbook

    +   - `[Content]` returns the content of that range/table

    +   - Since we only want one value from the entire content, we use the `{1}[Column1]`
    expression to select the row number and column name that we are looking for


    If you wanted to use this example in your own workbook, all you would need to
    do is copy-paste these lines. It’s then simple to update it with the name of the
    range or table you are using, and the row/column you want from that table.


    **Working step by step will save you time later**

    In the downloadable samples, we kept this example as a separate query, even though
    we later build it into a more complex example. This allows us to check whether
    anything goes wrong – at least we know we can read the values from the spreadsheet
    correctly, and see what those values are.


    More info on `Excel.CurrentWorkbook` and other Power Query M formulas is available
    in the documentation from Microsoft: https://learn.microsoft.com/en-us/powerquery-m/excel-workbook.


    Since we’re going to have to close the Power Query editor to continue to the next
    step, we’ll save it as **Connection Only**. This keeps our query without displaying
    results in Excel. You can do this in the following ways:


    +   - Select **Close and Load** in the Power Query editor

    +   - Select **Connection Only** in the dialog that appears


    We’ll come back to parameters again soon in this chapter. But first, we need to
    figure out how to make a POST request in Power Query since we’ll need that to
    link to our decision service.


    # Calling our decision service from Excel using Power Query


    Earlier in this chapter, we did a simple GET request from Excel using Power Query.
    But the API we need to link our decision service is more complicated – it needs
    JSON data passed in via a POST request. Let’s build on our Power Query knowledge
    to do that now, starting with a hardcoded example without parameters.'
  merge: -1
  img_proc: true
- pgno: 172
  md: "This example is downloadable as 06_power_query_decision_service.xlsx and we\
    \ will work through it step by step:\n\n+   1. If not already open, open the editor\
    \ (**Data | Get Data | Launch power query editor**).\n+   2. Create a new query\
    \ (in the **Queries** pane on the left-hand side of the editor, right-click and\
    \ select **new query, other sources**, then **blank query**). You should also\
    \ rename the query to something more meaningful.\n+   3. Open **Advanced editor**\
    \ in the **Home** menu and then copy and paste the following text:\n\n```\nlet\n\
    \    // the Rest URL we are calling - you will need to\n    //update this with\
    \ the value from your Swagger API\n    RestUrl = \"https://dmn-dev-sandbox.openshiftapps.com/\n\
    Customer Recommendations/Product Recommendation Service\",\n\n    // The JSON\
    \ Values we will pass in to call the\n    //decision Service\n    Payload = \"\
    \n    {\"\"Customer\": {\n        \"\"Number\"\": 0,\n        \"\"Name\"\": \"\
    \"string\"\",\n        \"\"Date of Birth\"\": \"\"2022-10-15\"\",\n        \"\"\
    Country of Residence\"\": \"\"UK\"\",\n        \"\"Special Requests\"\": \"\"\
    lactose intolerant\"\",\n        \"\"Previous Orders\"\": [0]\n    }}\n    \"\
    ,\n    // Do the JSON Call\n    Response= Web.Contents(RestUrl, [Content=Text.\n\
    ToBinary(Payload),\n        Headers=[ #\"Content-Type\" = \"application/json\"\
    ,\n#\"Accept\" = \"application/json\"]]),\n    //Convert the response for display\n\
    \    JsonResult = Json.Document(Response)\n\n    // display the results\nin\n\
    \    JsonResult\n```"
  merge: -1
  img_proc: true
- pgno: 173
  md: '+   4. You will need to update the endpoint listed in the line starting `RestUrl`
    with the value of the one in your deployment of OpenShift. As a reminder, it’s
    the value we told you to make a note of in the *Some vital information* section
    – the URL starting ... `https://dmn-dev-sandbox-...`. Pay attention to quotation
    marks when editing this value in Power Query.


    +   5. When you have completed editing, click on **Done**, then **Refresh Preview**
    in Power Query. If you have forgotten to refresh your Power Apps key today, or
    you have entered an incorrect value for `RestUrl`, you will get a `[DataSource.Error]
    Web.Contents failed to get contents from ...` error. If so, go back to *step 4*
    and correct this.


    +   6. The first time you use this query, Power Query will ask whether you need
    to log in to use this service, as in *Figure 6.18*. For all our examples, **Anonymous**
    access is okay – but if you deployed this service in real life, you would want
    to review the security and login options. Click on **Connect** to exit this dialog.


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_173_0.png)


    Figure 6.18 – Power Query login check


    +   7. Congratulations! We get the expected response from the decision service.
    A **Potential Heath Issue – please check** message should be displayed in the
    main area of the Power Query window.


    Much of what is happening in this query we can guess – since it is merging the
    REST calls we saw in Swagger with the Power Query formula format. But it’s worth
    highlighting the key steps we’ve just taken in this query:


    +   1. Note that each line in the `in` section is separated by a comma. That is
    how Power Query knows that each line is a separate step. Be careful when editing,
    as Power Query will complain if you remove it!


    +   2. As we saw (and edited), the line starting `RestUrl = "http:// ..."` sets
    the REST endpoint we want to call. We save it as a variable as it makes it easier
    to edit later.


    +   3. We create another variable, `Payload`, which is almost exactly the same
    JSON text as we used before in Swagger. Since this text needs to have quotes in
    it, we’ve had to use double quotes so that M doesn’t get confused and think that
    we’ve finished the line prematurely.'
