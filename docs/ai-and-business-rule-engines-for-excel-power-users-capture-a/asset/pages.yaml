- pgno: 362
  md: "You’ll notice that in this case, we have a build failure – the scenario testing\
    \ tool has correctly highlighted that our Bill of Materials decision model doesn’t\
    \ handle negative values very well. We can see more details on this in the Suresfire\
    \ models and logs to help us investigate and fix the model.\n\n> **Test-first\
    \ approach – test failures are a good thing**\n> \n> We wanted to highlight that\
    \ the instructions in this part of the Appendix are setup deliberately to fail.\
    \ That it because we took a **test-first** approach – we wrote our tests modeling\
    \ the expected behaviour, before we had implemented that behaviour in the decision\
    \ model (for example, to handle negative numbers).\n\nThink of the tests as enforcing\
    \ the business contract we have with users. Our tests give us a safety net in\
    \ highlighting that our model is not behaving as expected, which reminds us of\
    \ the edits we still need to do, but also alerts us should we accidentally break\
    \ anything in the future. Since this is an appendix, we leave it to the reader\
    \ to make the necessary updates to model, and rerun the scenario tests to ensure\
    \ they pass. We will move on to demonstrating an alternation method of running\
    \ the scenario simulation tool.\n\n# Alternative method – starting with Kogito\
    \ scenario samples\n\nThe step-by-step instructions from the previous section\
    \ are very clear and help us understand the files we need to edit to carry out\
    \ testing.\n\nAs an alternative method, many people prefer to take an existing\
    \ project and then add their own scenarios to it. Because the Kogito samples are\
    \ part of the overnight KIE build, the samples should be in an always-working\
    \ condition. This method allows you to add your decision models and test scenarios\
    \ to a project that you know is set up correctly.\n\nIt is good to have worked\
    \ through the previous set of instructions. As we’ll soon see, there are a lot\
    \ of files in the Kogito samples. It helps if we know which ones we want to look\
    \ out for. The steps are as follows:\n\n+   1. Open the Kogito sample project\
    \ that demonstrates scenarios on GitHub at `https://github.com/kiegroup/kogito-examples/tree/stable/kogito-quarkus-examples/dmn-quarkus-example`.\n\
    +   2. Make sure you are logged in to GitHub, and then open this project in Codespaces.\
    \ If you are not on the main page of the project, you will need to navigate to\
    \ the top folder, `kogito-examples`, before the green **Code** button option appears.\n\
    +   3. Once you have opened the `kogito-examples` project in Codespaces, we need\
    \ to navigate to the specific example we were just looking at. In the terminal,\
    \ type `cd kogito-quarkus-examples/dmn-quarkus-example/`.\n+   4. We know we’re\
    \ in the correct folder if we type `ls` in the console and we see the `pom.xml`\
    \ build file."
