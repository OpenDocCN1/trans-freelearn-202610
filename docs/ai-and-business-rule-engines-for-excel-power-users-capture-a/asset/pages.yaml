- pgno: 73
  md: 'This model looks pretty but isn’t very descriptive. Double-clicking on each
    shape will allow you to edit its name. Since DMN is designed for business users,
    you can call them pretty much anything you like (there are fewer restrictions
    in naming than in Excel), but for this example, it’s easier if you use `greeting`
    as the Decision node name, and `name` for the InputData node, as in *Figure 3.5*:


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_73_0.png)


    Great – it is now much clearer that we’re expecting a name to be passed in (the
    rounded box), and we’ll make a decision on which greeting to reply with (the rectangular
    box).


    While it’s obvious in this simple diagram, we still need to tell KIE explicitly
    which data is used in the decision. We can do this by drawing an arrow from the
    name (InputData) node to the greeting (Decision) node.


    Start by clicking on the name node so additional icons appear around it, as in
    *Figure 3.6*:


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_73_1.png)


    We’ll come back to the other icons later, but for now, click on the arrow button
    (**Create DMN information requirement**). This allows you to draw an arrow from
    the data to the `greeting` node. The direction of the arrow is important, so make
    sure your diagram looks like *Figure 3.7*:


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_73_2.png)'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'Based on what we can see in the diagram, KIE now knows we want to feed a name
    into the greeting decision. But we still haven’t told KIE how it’s going to make
    its decision – let’s fix that now. Click on the rectangular box **greeting** node,
    as shown in *Figure 3.8*:


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_74_0.png)


    Figure 3.8 – Editing node properties


    Then, from the icons that appear, click on the **Edit** icon (the square with
    the pencil, on the middle left). The screen will change to something like the
    screenshot in *Figure 3.9*:


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_74_1.png)


    Figure 3.9 – Editing the Decision node type


    You may need to click on the **Select expression** box to view this drop-down
    menu to display the different logic types available. Select **Literal expression**.


    > > **A quirk of the editor**

    > >

    > > Be careful – in the current version of KIE Sandbox, there is no way to change
    the logic type once you have chosen it.

    > >

    > > If you do choose the wrong type of expression, you’ll need to go back to the
    main decision diagram, delete the entire greeting node, and then create an entirely
    new one (including renaming the node and connecting the InputData node to it).'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'We’ll run through the different logic types later but think of this as being
    similar to a function you’d type into Excel. You should see the Literal expression
    editor as shown in Figure 3.10:


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_75_0.png)


    Figure 3.10 – Expression added to decision node


    In Figure 3.10, we’ve already entered the formula into the box – we’ve used the
    "Hello "+name function.


    Like in Excel, when typing the expression, be careful to get the spelling right,
    pay attention to the double quotes, and make sure the name matches what we called
    our InputData node. There should be a pop-up suggestion in the boxed editor to
    guide you as you type.


    **Boxed expressions and FEEL**

    Typing a formula into a box like this should feel familiar – it’s very Excel-like.
    Not surprisingly, they are called **boxed expressions**. The language that boxed
    expressions use is called **Friendly Enough Expression Language (FEEL)** – a standard
    originally from Oracle. You’ll see in the next chapters that it is very powerful.
    But for the sake of this example, just understand that it is similar to, but not
    exactly the same as, Excel functions.


    When you’ve finished editing, click on the **Back to Untitled** link to return
    to the main decision diagram. While you’ve edited the decision criteria (and the
    expression has been saved), the diagram will still look like Figure 3.7 earlier.
    Don’t worry, you can click on the node, then edit again; you will see the expression
    has been successfully saved.


    Having a graphical editor is great, as it is so easy to understand the diagram.
    However, one downside is that following graphical instructions can be tricky –
    especially as getting one step wrong can lead to you getting very different results.


    For that reason, the Decision Model samples in this (and all the chapters) can
    be found on the book’s GitHub page ( https://github.com/PacktPublishing/Business-Rule-Engines-and-AI-for-Excel-Power-Users
    ). The Uploading decision models from other sources section later in this chapter
    shows how to load these samples into your local sandbox (hint – it’s pretty easy!).


    We have successfully designed our first Hello World rule in the web editor. But
    to run it, we have one program we need to download first.'
  merge: -1
  img_proc: true
- pgno: 76
  md: "# KIE Sandbox Extended Services\n\nExcel is very convenient – it bundles the\
    \ application to edit and execute your formulas into one package. Most enterprise\
    \ software (including KIE/Drools) split these into separate steps – you edit the\
    \ rules in one tool, and then make a conscious decision to execute them, often\
    \ using a separate software package. While a bit more work, it does mean that\
    \ you don’t accidentally *break* something when editing, which makes your rules\
    \ solution more robust.\n\nSo far in this chapter, we’ve been using the online\
    \ KIE editor. But we need a way to execute our decisions and rules. For that,\
    \ we need KIE Sandbox Extended Services.\n\nBrowsers have come a long way in the\
    \ last 20 years – to the point that it’s easy to forget that the KIE Sandbox editor\
    \ isn’t a native desktop app. While tools such as WebAssembly have the potential\
    \ to make the experience smoother in the future, it is difficult to make a complex,\
    \ enterprise-grade piece of software such as KIE or Drools run completely in the\
    \ browser. Or at least make it run in the browser so that it behaves *exactly*\
    \ as it would when deployed by your enterprise IT team. This is important, as\
    \ you don’t want any surprises with rules behaving differently at that point.\n\
    \nThankfully, the KIE team has a very good solution – they have taken the essentials\
    \ of the rules engine and packaged them so they can easily be downloaded and run.\
    \ This means we can get instant feedback as we edit our rules, and know that the\
    \ rules will run in the same way when we deploy our full solution later. This\
    \ packaged version is called **KIE Sandbox Extended Services**, and we’ll download\
    \ it in the next section.\n\n> **It pays to be cautious – but you may need to\
    \ ask for permission**\n> \n> One word of warning – while no installation is needed,\
    \ on Windows, the extended services are packaged as a .exe file. While we trust\
    \ where this file is coming from (see the *Open can be more secure* section in\
    \ *Chapter 2, Choosing an AI and Business Rules Engine – Why Drools and KIE?*),\
    \ Windows is a lot more cautious, since .exe files are very powerful and could\
    \ cause damage in the wrong hands. This applies to most software, and not just\
    \ the tools from KIE.\n\nFrom experience, most issues that you will encounter\
    \ with the next section will be because downloading or running .exe files has\
    \ been blocked for security reasons by your IT department. There are alternatives,\
    \ such as deploying into the cloud (which we will cover in *Chapter 5*, and again\
    \ in *Chapter 10*). But the edit-rule, test-rule cycle enabled by KIE Extended\
    \ Services is so productive, it is well worth asking for permissions to run it.\n\
    \nLet’s walk through the steps to download, answer some simple security questions,\
    \ start the extended services, and then connect to KIE Sandbox."
  merge: -1
  img_proc: true
- pgno: 77
  md: '# Downloading and running KIE Extended Services


    KIE Sandbox Extended Services is packaged to make it as easy to use as possible.


    At the top right of the KIE Sandbox web page, you should see a message similar
    to Figure 3.11. You may need to maximize the KIE Sandbox window in order to fully
    see it.


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_77_0.png)


    Figure 3.11 – Reminder to install Extended Services


    This warning message only appears if you don’t have KIE Extended Services installed.
    Thankfully, Click to install is the first step in fixing it. After seeing a screen
    explaining what Extended Services are (click on Setup to move to the next step),
    you should see a panel similar to Figure 3.12:


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_77_1.png)


    Figure 3.12 – KIE Sandbox Extended Services download screen


    This is the KIE Sandbox Extended Services setup screen, which allows you to select
    the appropriate package to download. Select your operating system, then click
    on Download to get the file you need.


    > Want a direct link to download?

    > The download URL in KIE Sandbox links to https://github.com/kiegroup/kie-tools/releases
    – normally, you take the most recent version, although you have the option to
    choose the earlier one. The source code for building the Extended Services tools
    is also on this site, should you or your IT colleagues wish to audit it for security
    reasons.'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'When the file has been fully downloaded, go to where you saved it, then double-click
    to open and run it. Again, it''s worth remembering that some IT departments may
    block you from doing this. If this happens, you''ll see an error message, and
    you will need to get in touch to request that they remove any blocks.


    Even if you have permission to run it, Windows will double-check that you know
    what you are doing. On Windows 11, you will see a screen like in Figure 3.13;
    other versions of Windows will have something similar:


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_78_0.png)


    Figure 3.13 – Windows 11 EXE warning screen


    If you get a warning screen like this one, click on More info. You should have
    the option to run anyway.


    You may also get a warning from Windows Defender (or similar antivirus software),
    as shown in Figure 3.14:


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_78_1.png)


    Figure 3.14 – Windows Defender permission screen'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'KIE Sandbox Extended Services is, in effect, a mini web server (so that the
    online editor can communicate with it), so it needs to communicate over the network.
    This is okay, so you can confirm this with Windows Defender by clicking on the
    **Allow access** button.


    Thankfully, these security checks need only need to be done once. If you see two
    screens like *Figures 3.15 and 3.16*, everything is working okay.


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_79_0.png)


    Figure 3.15 – Confirmation in the editor


    *Figure 3.15* shows the confirmation message in the KIE Sandbox editor that everything
    is running okay.


    ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_79_1.png)


    Figure 3.16 – Extended Services running


    *Figure 3.16* shows the console window that opens in the background. Two key messages
    are *Server started* at the beginning and *200 -> 200 OK* at the end, which show
    that the necessary service has started.


    # Troubleshooting KIE Sandbox Extended Services


    I’ll repeat it – by far the most likely cause of problems is security restrictions
    by your IT department. If you are having issues with installation, try the download
    process again (paying attention to any warning messages), and contact your colleagues
    to get the necessary permissions to run.


    If this isn’t the case, take a look at the *How to ask for help* section in the
    previous chapter. It’s also worth trying the following additional steps:


    +   - Look in the console window (*Figure 3.16*) for any helpful error messages.


    +   - Reboot your laptop (obviously, this also restarts your browser). After every
    reboot, you need to find the KIE Sandbox Extended Services file, and double-click
    on it to start it manually. It does not run automatically by default.'
  merge: -1
  img_proc: true
