  \n图 5.9 – 连接向导的步骤 3\n\n### Troubleshooting your connection\n\n最大的问题通常是设置连接时使用了错误的项目、主机或令牌名称。或者，你可能有正确的值但放在了错误的位置。你也可能有大部分值，但可能缺少令牌的最后一个字母。\n\
  \n令牌每 24 小时就会更改一次，所以不要害怕返回检查，并且当然要始终检查你的互联网连接是否正常以及你的 OpenShift 实例是否正在运行。\n\n###\
  \ Deploying your decision model to OpenShift\n\n现在我们已经建立了连接，返回 KIE Sandbox 中的主决策模型编辑器屏幕。你可能需要点击编辑器右上角的\
  \ X。\n\n我们将把上一章中制作的决策模型部署到 OpenShift。作为提醒，包含所有书籍示例的 GitHub 页面是 https://github.com/PacktPublishing/AI-and-Business-Rules-for-Excel-Power-Users，而你需要查找的具体示例是\
  \ 04_Product_Recommendation-collect.dmn。如果你还没有它，你需要先下载并导入到本地沙盒中：\n\n- 1. 在 KIE Sandbox\
  \ 屏幕右上角，点击 Try on OpenShift，然后，如图 5.10 所示，选择我们想要部署的模型名称（在本例中，是我们的 Product Recommendation\
  \ 示例）。\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_133_0.png)\n\n图 5.10 – 选择要部署的决策模型\n\
  \n- 2. KIE Sandbox 将会像图 5.11 那样要求确认：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_133_1.png)\n\
  \n图 5.11 – 确认部署\n\n- 3. 然后会出现一个简短的 *in progress* 消息，如 *Figure 5.12* 所示：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_134_0.png)\n\
  \n图 5.12 – 部署进行中\n\n- 4. 当你的部署完成后，你会看到如图 *Figure 5.13* 的消息：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_134_1.png)\n\
  \n图 5.13 – 部署成功消息\n\n- 5. 如果你点击绿色勾选框旁边的模型名称，如 *Figure 5.13* 所示（在本例中为 **Product Recommendation**），KIE\
  \ Sandbox 会非常贴心地打开一个新网页，指向我们在 OpenShift 上部署的模型，如 *Figure 5.14* 所示：\n\n图 5.14 – 我们在\
  \ OpenShift 上的已部署模型\n\n这个屏幕看起来非常熟悉 – 它是 KIE 沙盒中输入-输出屏幕的一个版本，应该看起来很熟悉；沙盒的目标是在生产部署后使用时实现快速、迭代的开发且没有意外。\n\
  \n随意尝试一下；你会看到输入和输出按预期工作，但你将无法查看用于生成这些决策的模型。你也不希望最终用户更改你制定业务规则的方式。\n\n毫无疑问你为这一成就感到自豪，所以请继续与同事分享。与沙盒不同，他们可以使用你使用的相同\
  \ URL 访问此页面。他们将能够使用此决策模型并惊叹于你迈出进入业务规则和 AI 的第一步。\n\n在我们过于兴奋之前，我们需要记住我们仍然在使用 Developer\
  \ Sandbox，而它有一定的限制。\n\n### Important notes on the OpenShift Developer Sandbox\n\n\
  OpenShift Developer Sandbox 很棒，因为它是免费的（你可以先试后买），但它具有完整云服务的大部分实质性功能。然而，你需要记住免费版本的几个限制：\n\
  \n- 令牌需要每天续期。这意味着你需要使用上一节中的说明重新链接 OpenShift 和 KIE Sandbox。这并不麻烦，但你需要记住去做，否则沙盒会给你一个错误。\n\
  - Developer Sandbox 需要每 30 天续期一次，在此续期之前，OpenShift 中的所有数据将被删除。这不是问题，因为你始终会有决策模型的本地副本，而且你不应该在沙盒中存储任何数据在你的模型中。\n\
  - 默认情况下，部署到 OpenShift 的任何模型都是公开访问的。这对于与同事分享链接以供他们测试来说很棒，但你可能想要调查 OpenShift 中的安全和访问限制以限制谁可以看到你的模型。\n\
  \n最后一点需要记住的是，如果你让 OpenShift 沙盒保持运行，它将在 8 小时后被停用。你会收到类似这样的电子邮件：\n\n```\nIn accordance\
  \ with the usage terms of Developer Sandbox, we have\nreduced the number of instances\
  \ of your application to zero (0). You\ncan restart your application(s) by increasing\
  \ the number of instances\nfrom the Developer Sandbox User Interface.\n```\n\n有多种方法可以重启你的应用程序。也许最快的方法是执行以下操作：\n\
  \n- 1. 打开 OpenShift 网页控制台。\n- 2. 在屏幕右上角，会有一组图标，如 *Figure 5.15* 所示：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_136_0.png)\n\
  \n图 5.15 — OpenShift 中的命令提示符图标\n\n- 3. 点击 >_。这将导致你的应用程序重启；它还会打开一个位于屏幕底部的面板，看起来像终端，但这是一个副作用，我们不需要在其中输入任何内容。\n\
  \n所有这些限制在开发期间不会造成问题，但如果你确实打算将决策模型部署用于真实的业务用途，最好迁移到付费层级。\n\n> **Remember the online\
  \ resources**\n> KIE Sandbox 和 Red Hat 团队在我们于 *Chapter 2* 中提到的在线资源上投入了大量精力。现在是重新查看它们的好时机。其中有一个特别好的关于将\
  \ KIE Sandbox 与 OpenShift 链接的视频，网址为 https://youtu.be/2zY85TXFNuw（或在 KIE YouTube\
  \ 频道搜索 *DMN Dev Sandbox Developing and deploying DMN decisions in the cloud*）。\n\
  \n由于我们已经迈出了将模型部署到我们自己的笔记本电脑之外的重要一步，现在可能是讨论如何处理数据的好时机。\n\n### Taking care of your\
  \ data\n\n我们很高兴看到立法朝着增加数据隐私的方向发展。作为处理数据的人员，我们有时会诅咒这些法规，但从很多方面来说，这只是确保我们希望无论如何都会寻求做到的事情：*在处理个人数据时保持尊重。*\n\
  \n个人数据是任何可以识别某人的信息——与姓名关联的电话号码、电子邮件（因为它通常包含名字或姓氏），或地址。例如，如果我们谈论的是一个男性，21 岁以下，住在\
  \ 59 Bolton Square，很明显我们谈论的是谁。\n\n即使你不住在欧洲，你也可能感受到了欧盟 **General Data Protection\
  \ Regulation (GDPR)** 的影响。例如，如果你位于美国，并且正在处理居住在欧盟的客户，该法规仍然会保护该客户，并附带令人瞠目结舌的罚款威胁。还有许多其他本地等效法规（美国加州是最值得注意的）。\n\
  \n法规写得相当好，而且从第 1 天就开始遵循它们更容易。迄今为止，你的许多决策和个人数据都保存在公司内部（在 Excel 表格中）。GDPR 和数据保护法规仍然适用，但你会注意到我们开始将数据传递给外部服务（现在是\
  \ IBM/Red Hat，很快是 Microsoft）。这使得 GDPR 的话题变得更加重要。\n\n好消息是，本书建议的方法可能会让你更符合 GDPR：\n\
  \n- 我们在上一章中谈到不要在业务规则中使用特定的个人信息。由于我们只应传递做出决策所需的信息，我们的系统受 GDPR 影响的可能性要小得多。\n\n\n\n\
  \n\n- IBM 和 Red Hat 在安全、客户保密以及确保符合 GDPR 方面花费了大量时间。这些厂商将声誉押在保持数据安全上，而这种安全级别并非每个小型公司（包括你的公司）都能达到。\n\
  - 本书提倡更正式的数据管理技术和决策方法。我们正从组织内散落的 Excel 电子表格（数据管理噩梦）转变为以连贯的方式存储和处理它们。这种方法也使 GDPR\
  \ 合规变得更容易。\n\n从良好的数据管理习惯开始，将使你的生活在以后变得轻松得多。另一个你以后会庆幸的好习惯是备份并对决策模型进行版本控制。让我们看看 KIE\
  \ Sandbox 与 GitHub 的内置集成是如何让我们做到这一点的。\n\n### 使用 GitHub 保存和共享你的决策模型\n\n你可能没有太在意（除了\
  \ KIE Sandbox 中的 **Ephemeral** 消息），但你目前是将决策模型保存在与你的网络浏览器关联的本地存储中。虽然这对于入门来说很棒，但我们不建议将其用于长期使用。如果你的笔记本电脑丢失了——你有备份吗？你如何与同事共享决策模型？如果意识到自己犯了错误，想恢复\
  \ 5 分钟前的版本怎么办？本地存储很难让你完成这些事情。\n\n幸运的是，KIE Sandbox 提供了通往最佳协作网站的链接：GitHub。你可能还记得在\
  \ *第 2 章* 中我们介绍 KIE 和 Drools 项目时提到的 GitHub，它让数百名开发者能够协作、共享文件并浏览他们工作的不同版本。\n\nGitHub\
  \ 提供了私有仓库选项，你可以将其用于自己的项目并限制为仅希望协作的人员。需要注意的是，你的仓库是你的空间——它与托管在同一站点上的任何 Red Hat 项目无关，但这意味着我们需要设置自己的空间并将其链接到\
  \ KIE Sandbox。现在让我们逐步进行。\n\n### 注册 GitHub 并获取你的 token\n\n要使用 GitHub，你需要注册一个账户。该网站由\
  \ Microsoft 所有，并且其其他网站的登录（目前）还不可用。要获取你的 GitHub 登录，请执行以下操作：\n\n1. 前往 GitHub 主页 `www.github.com`。\n\
  2. 你会看到一个欢迎页面，其中有一个大的 **Sign up for GitHub** 按钮。\n3. 点击此按钮将带你进入 *图 5.16* 中的账户注册屏幕：\n\
  \n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_139_0.png)\n\n图 5.16 – GitHub 注册屏幕\n\n\
  4. 在输入你的详细信息（包括新用户名和电子邮件地址）后，点击 **Create Account** 按钮。\n5. 你会收到一封验证电子邮件地址的消息。点击该邮件中的链接将带你进入\
  \ GitHub 上的个人主页。\n\n### GitHub 上个人主页的导览\n\n你在 *图 5.17* 中看到的页面与你在 *第 2 章* 中看到的 Kogito/Drools\
  \ 项目页面不同。这是你在 GitHub 上的个人页面，提供了探索你可能想要交互的多个项目的选项。\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_140_0.png)\n\
  \n图 5.17 – 你的个人 GitHub 主页\n\n这里有一个创建仓库的选项（使用此页面底部的绿色按钮），用于存储我们的决策模型文件，但 KIE Sandbox\
  \ 也能为我们做到这一点（我们将在本章后面看到具体如何操作）。让我们专注于将 KIE Sandbox 与我们刚刚创建的 GitHub 仓库链接所需的步骤。\n\n\
  要创建 KIE Sandbox 与 GitHub 之间的链接，我们需要在 GitHub 上拥有一个个人 token。就像 OpenShift 一样，这个 token\
  \ 替代了我们的用户名和密码，以便 GitHub 知道 KIE Sandbox 获准代表我们行事。要创建此 token，请按照以下步骤操作：\n\n1. 在 GitHub\
  \ 的右上角（任何屏幕），点击个人资料设置，如 *图 5.18* 所示。\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_140_1.png)\n\
  \n图 5.18 – 你的 GitHub 个人资料设置\n\n2. 搜索 **Developer settings**（左下角，列表末尾），然后像 *图 5.19*\
  \ 中那样突出显示 **Personal access tokens**。\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_141_0.png)\n\
  \n图 5.19 – GitHub 的 Personal access tokens 屏幕\n\n3. 点击 **Generate new token** 按钮，然后在提示时确认你的\
  \ GitHub 密码。\n\n4. *图 5.20* 中的屏幕将会出现，允许你设置与此 token 关联的权限。权限必须包括仓库范围，以便当 KIE Sandbox\
  \ 使用 token 时，它可以创建新的仓库来存储模型。请注意，还有更多选项，但我们已裁剪图像以适应页面。\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_141_1.png)\n\
  \n图 5.20 – 为新的个人访问 token 设置权限\n\n立即复制屏幕上出现的 token（如下图 5.21 所示），因为它不会再次显示。我们很快就会在下一节的第一步中使用它，将\
  \ token 添加到 KIE Sandbox 以将其链接到我们的 GitHub 账户。\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_142_0.png)\n\
  \n图 5.21 – 复制新生成的个人访问 token\n\n> **关于 GitHub token 的更多信息**\n> 我们只会给你足够的信息来使用 KIE\
  \ Sandbox 创建与 GitHub 的链接，但如果你想了解更多关于 GitHub token 的信息，一个不错的起点是 https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/creating-a-personal-access-token。\n\
  \n### 使用你的 token 在 KIE Sandbox 上协作\n\n由于我们已经设置了 GitHub 账户并记下了唯一的访问 token，我们希望将 KIE\
  \ Sandbox 与其链接：\n\n1. 你需要先在常用页面 https://sandbox.kie.org 上打开 KIE Sandbox。\n2. 点击右上角的人物图标选择\
  \ Connected Accounts，然后选择连接 GitHub 账户的选项。\n3. 在此屏幕上粘贴你的 GitHub token。粘贴 token 后，你应该会收到一条确认连接的消息（如图\
  \ 5.22）：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_143_0.png)\n\n图 5.22 – 成功链接\
  \ KIE Sandbox 和 GitHub\n\n4. 在收到此成功消息后，点击右上角的 x 关闭弹出窗口。\n\n5. 现在，如果我们点击主 KIE Sandbox\
  \ 右上角的 **Share** 菜单，你会看到我们有额外的选项，如 *图 5.23* 所示。请注意，我们为节省空间移除了几项菜单项，因此你可能需要在屏幕上向下滚动才能看到我们突出显示的选项，当然，你的\
  \ GitHub 用户名会有所不同。\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_143_1.png)\n\n图 5.23\
  \ – 使用我们新创建的 GitHub 连接进行共享\n\n6. 向下滚动并选择你刚刚连接的 GitHub 账户。\n\n现在 KIE Sandbox 和 GitHub\
  \ 已链接，让我们利用该链接解决之前看到的一些问题。\n\n### 用于保存和项目协作的 GitHub 流程\n\n一旦 KIE Sandbox 链接到 GitHub，我们将在屏幕右上角的\
  \ Share 菜单中拥有更多选项。由于我们担心本地存储，我们希望将决策模型保存在更稳健的地方：\n\n1. 在 Share 菜单中，我们现在有了 Create\
  \ repository 选项。点击它，你将看到如图 5.24 所示的选项屏幕：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_144_0.png)\n\
  \n图 5.24 – KIE Sandbox 在 GitHub 中为我们的决策模型创建仓库\n\n2. 输入仓库名称并选择创建为私有的选项（我们以后可以更改此设置）。\n\
  \n3. 经过几秒钟，你会看到一条确认消息，表明仓库已创建以及可以查看文件的链接，如图 5.25 所示：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_144_1.png)\n\
  \n图 5.25 – 仓库已成功在 GitHub 中创建\n\n\n\n\n\n在我们去检查保存在 GitHub 上的文件之前，花一分钟时间了解一下 KIE Sandbox\
  \ 和 GitHub 链接后屏幕的其他变化是值得的。主要变化已在图 5.26、图 5.27 和图 5.28 中突出显示。\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_145_0.png)\n\
  \n图 5.26 – 链接到 GitHub 时 KIE Sandbox 屏幕的变化，左上\n\n- 单词 Repository 取代了 ephemeral，表示我们的决策模型正在保存在\
  \ GitHub 中。\n- main 表示我们正在工作的分支。虽然完全在 main 上工作是可能的，但分支允许你在并行轨道上工作，并在准备好时将整套更改合并回主轨道\
  \ main。\n- KIE 还显示了用户名/Git 仓库名称以及一个绿色勾号，表示一切正常。\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_145_1.png)\n\
  \n图 5.27 – KIE Sandbox 屏幕的变化，右上，VS Code 的新选项\n\n屏幕上还出现了其他选项。在右上角，我们有在 Visual Studio\
  \ Code 中打开决策模型的选项。我们将在第 12 章中更详细地介绍这一点。\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_145_2.png)\n\
  \n图 5.28 – KIE Sandbox 屏幕的变化，右上，新的同步选项\n\n右上角还有一个新的同步菜单。Pull 和 Push 是你会经常使用的标准 GitHub\
  \ 概念：\n\n- **Pull** 用于你想要获取他人的更改并下载到本地副本以刷新时\n- **Push** 用于你在本地进行了更改并希望将其发送到 GitHub\
  \ 的主上游仓库时\n\n当我们介绍编辑和保存决策模型的常见工作流程时，我们将演示这些概念。现在我们已经完成了变化的巡视，让我们检查 KIE 实际上如何在 GitHub\
  \ 上保存了我们的仓库。\n\n4. 返回你在 GitHub.com 的个人页面。你会看到 KIE 创建了一个私有仓库，如图 5.29 所示：\n\n   ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_146_0.png)\n\
  \n   图 5.29 – 在 GitHub 上创建的新仓库\n\n5. 当你点击该仓库时，你会看到它包含我们所有的决策模型文件（如图 5.30 所示）：\n\n\
  \   ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_146_1.png)\n\n   图 5.30 – 决策模型在仓库中共享/存储\n\
  \n6. 如果你点击模型名称，你会看到它是一种标准的 XML 格式，充满了嵌套的 `<Tags>`；它只是一个 XML 文件。如果你使用 Chrome，KIE\
  \ 有一个插件可以可视化和编辑此 XML 文件作为决策模型。然而，其功能与 KIE Sandbox 编辑器非常相似，因此虽然安装它很有用，但我们不会详细介绍。\n\
  \n更重要的是，现在我们已经将文件安全地保存在 GitHub 仓库中，让我们邀请选定的同事与我们一起协作。\n\n### 分享你的仓库\n\n由于我们将仓库设置为私有，我们需要邀请同事与我们协作：\n\
  \n1. 在 GitHub 上打开你的项目（非个人）设置页面。你可以在项目名称下找到它（如图 5.31 的最右侧）：\n\n   ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_147_0.png)\n\
  \n   图 5.31 – 在 GitHub 上找到项目设置\n\n2. 一旦看到项目设置屏幕，点击协作者选项，你将有邀请同事的选项，如图 5.32 所示。\n\
  \n   ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_147_1.png)\n\n   图 5.32 – 邀请其他人协作决策模型\n\
  \n3. 当然，你需要知道他们的 GitHub 名称。一旦你邀请他们，他们将可以访问你的仓库（仅此项目）。\n\n现在你的同事可以访问了，他们如何与你协作这些决策模型呢？Git\
  \ 和 GitHub 如此强大的原因在于有许多不同的工作流程供你选择，而哪一个最适合你则取决于个人选择。\n\n> **Git 和 GitHub**\n>\n\
  > 本书将 **Git** 和 **GitHub** 视为可以互换的工具进行讨论，并且由于本书中使用的工具（KIE Sandbox，以及后来的 Visual Studio\
  \ Code）已嵌入了 Git 协议，你不太可能直接使用 Git 工具。然而，了解 **Git** 是允许人们在项目中的多个文件上协作的工具，而 **GitHub**\
  \ 是帮助你找到这些项目和人群的网站是有用的。\n\n### 不同工作流程\n\n你可能习惯于 Office 365，每个人都在一个文件的通用版本上工作。Word\
  \ 和 Excel 足够快，可以实时看到更改，因此冲突更改通常不是问题。Office 365 提供简单的版本控制：如果别人做了你不喜欢的编辑，你可以回滚到上一个版本，或上周大家都认为可以的版本。\n\
  \n虽然我们目前只有一个文件，但我们很快就会进展到多个相互关联的模型，我们希望在这些模型上协作。这就是 Git 和 GitHub 为你提供更强大的协作工作流程的原因。\n\
  \n一个重要的区别是，虽然可以直接在 GitHub 上编辑文件，但大多数时候你使用的是本地副本。当你确信一切按预期工作时，才会将文件推送到上游仓库的主分支。\n\
  \nGit 的使用方式有很多，这正是它如此强大的原因。如果你想了解更多，请查看 Packt 关于 Git 的书籍，网址为 `https://www.packt.com/?s=github&post_type=product`。\n\
  \n现在，让我们讨论两种最常见的工作流程。\n\n### 使用 KIE 的简单单人工作流程\n\n使用 Git 和 KIE 也许最简单的方法如下：\n\n1.\
  \ 如我们所述链接 KIE 和 GitHub。这为你提供了决策模型的本地副本和 GitHub 网站上的备份副本。\n2. 如前所述对决策模型进行更改。像以前一样，这些更改会自动保存在本地。\n\
  3. 定期将本地更改推送/提交到在线的 GitHub 仓库。\n\n这是良好的实践——如果你丢失笔记本电脑，你将拥有工作的备份副本，并且它允许你在编辑时更勇敢，因为你拥有可以恢复的所有先前版本。它也让你习惯使用\
  \ Git 工作流程。\n\n然而，Git 工具的真正威力在协作时变得更清晰。以下是你可能会使用的一种简单协作工作流程。\n\n### 使用 KIE 的简单协作工作流程\n\
  \n我们假设你已经链接了 KIE 和 GitHub：\n\n1. 按之前的说明邀请你的同事协作。\n2. 你们两人都会有本地副本（在 KIE Sandbox 中），因此可以继续像以前一样编辑。\n\
  3. 你可以继续将更改推送到 GitHub，但你的同事可能需要创建一个拉取请求，请求你在接受或拒绝其工作合并到主分支之前检查其工作。\n4. Git 会通知你任何冲突（例如，如果你们同时编辑了同一个文件），并给你机会解决它们。\n\
  \n你会注意到我们没有详细介绍这两种工作流程。Git 和 GitHub 的使用方式还有很多，但作为行业标准的协作工具，学习版本控制、主分支和其他分支、仓库以及推送和拉取文件的概念是非常值得的。至少，我们建议使用简单的单人工作流程来备份你的文件，并建立对\
  \ GitHub 工具的信心。\n\n我们将介绍一个使用 GitHub 的最后示例，这并不是真正的工作流程，但在本书中尝试示例时很有用。\n\n### 直接从\
  \ GitHub 导入模型\n\n作为提醒，KIE Sandbox 首页上有几个导入决策模型的选项。这包括如 *图 5.33* 所示的选项，可直接从 GitHub\
  \ 导入模型，其中 URL 是你想要使用的项目的首页。\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_149_0.png)\n\
  \n图 5.33 – 直接从 GitHub 仓库导入决策模型\n\n这非常有用，因为 GitHub 托管了许多示例（如本书的示例），你只想下载并试用，而不想将其置于完整的版本控制之下。\n\
  \n\n\n\n\n### 摘要\n\n在本章中，我们从单独编辑决策模型，转变为能够向同事展示工作成果并协作开发这些模型。\n\n我们介绍了 OpenShift\
  \ 作为 Red Hat 的云服务，并将我们的 KIE 决策模型部署到其中。我们还介绍了 GitHub 作为协作站点，并展示了如何将其用于常见的协作工作流程。\n\
  \n由于我们现在已经具备了与同事一起构建和部署决策模型的基础，我们将继续将其链接到许多同事使用的工具：从 Excel 调用我们的决策模型。\n\n### 使用\
  \ Power Query 从 Excel 调用业务规则\n\n在上一章中，我们探讨了如何协作共享和编辑决策模型。我们还看到了如何将它们部署到 OpenShift\
  \ 云中，以便其他人可以通过自动生成的 Web 界面运行它们。\n\n这非常令人印象深刻，但我们的同事很可能仍在使用 Microsoft Excel 进行大部分工作。我们如何将业务规则、AI\
  \ 和决策模型链接到 Excel，并使所有工具协同工作？本章将介绍这一点，包括以下内容：\n\n- 五种不同的链接规则、AI、决策模型和 Excel 的方法——使用\
  \ Power Query、Visual Basic for Applications、Script Lab、Office Scripts 和 Power Automate\n\
  - 使用 REST 的机器可读网页，以及如何将其链接到我们的决策服务\n- Swagger——与 KIE 和 Kogito 决策服务更人性化的链接\n- 使用\
  \ Power Query 调用决策服务，并通过逐步示例构建可扩展到您自己的工作的解决方案\n\n到本章结束时，您将了解 Kogito 如何发布机器可读的网页，以及如何使用\
  \ Excel 中的 Power Query 链接到它。\n\n#### 先决条件\n\n开始之前，最好在笔记本电脑上安装 Microsoft Excel。虽然免费的在线版本（https://www.microsoft.com/en-us/microsoft-365/free-office-online-for-the-web）变得越来越强大，但本章中的一些技术（例如使用\
  \ Power Query）只能在桌面版本中完全运行。幸运的是，我们将在下一章中描述的 Script Lab 方法将适用于 Excel 的在线版本。而且我们将介绍其他替代方案（例如\
  \ Office Scripts 和 Power Automate），它们可以在 Excel 之外运行——并且与可以读取和写入 Excel 格式文件的其他工具（如\
  \ Google Sheets 和 OpenOffice）兼容。\n\n由于我们将介绍很多将 Excel 链接到业务规则的方法，让我们先从概述开始。\n\n####\
  \ 五种不同的链接规则、AI、决策模型和 Excel 的方法\n\n在第 5 章末尾，我们看到 KIE 和 Kogito 会根据我们的决策模型自动生成一个网页。我们很快就会看到，这个页面的机器可读版本可以链接到\
  \ Excel。无论使用哪种技术，该页面都不会改变。图 6.1 显示了一些我们可以建立这种链接的方式。\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_152_0.png)\n\
  \n图 6.1 – 将 Excel 链接到我们的决策服务的多种方式\n\n您可能熟悉此图中列出的一些技术——即使不熟悉，我们也将在下一节中介绍它们。关键点是，无论您选择哪种技术，核心的\
  \ Kogito 决策服务（包括您的业务规则和 AI）都保持不变。这使您可以选择现在最适合您的技术，同时确信您在决策模型上的投资在您转向其他工具时仍然有效。\n\
  \n在您使用业务规则的旅程中，很可能会看到同事使用 Python、Java 或 C# 等完整的企业级编程语言来调用它们。虽然这超出了本书的范围，但它可以让您放心，Kogito\
  \ 为您提供了捕获、运行和共享业务规则的工具，这些工具在未来仍然有效。\n\n首先，让我们介绍一下图 6.1 中提到的用于将 Excel 链接到决策服务的五种技术。值得一提的是，这五种技术都是行业标准，每种都有大量书籍和网络文章可供参考。无论您选择哪一种，它们都是您时间的好投资。您将在许多其他\
  \ Excel 工作中使用这些工具——不仅仅是链接到决策服务。\n\n#### VBA\n\nVBA 在几乎 30 年前推出时对 Excel 高级用户来说是变革性的。它允许\
  \ Excel 用户记录其操作、编辑生成的脚本，然后以接近企业级编程工具的方式回放。\n\n虽然 VBA 的安装基数庞大，但它已经显露出年龄。如果您使用 VBA，那是因为您有一个遗留电子表格，或者您已经使用它很长时间了。别担心——我们没有忘记您。我们将在下一章介绍如何将\
  \ Excel 链接到决策服务。\n\n#### Script Lab 和 Office Scripts\n\n如果您今天开始自动化 Excel 电子表格，我们建议使用\
  \ Microsoft 的更现代的替代方案——Script Lab 或 Office Scripts。两者都基于使用代码操作 Excel 的相同概念，并且 Office\
  \ Scripts 具有类似于 VBA 的记录器，允许您捕获操作然后编辑自动生成的脚本。不同之处在于 Script Lab 和 Office Scripts 都比\
  \ VBA 更容易与现代 Web 技术集成——例如，它们使用您可能在构建网页时已经玩过的 JavaScript 版本。\n\nScript Lab 和 Office\
  \ Scripts 之间有很大程度的重叠——两者都使用相同的 JavaScript 对象模型来操作 Excel。学习其中一个会自动为您学习另一个提供先发优势。这尤其重要，因为\
  \ Office Scripts 更新颖，预计 Microsoft 将继续扩展其功能。\n\n目前，如果您想专注于电子表格的用户，Script Lab 更好。它允许您选择用户界面元素，并且可在\
  \ Web 和桌面上运行。它还允许您构建自定义函数，您可以从电子表格内部以类似于 =myCustomFunction (A1) 的格式调用它们。\n\nOffice\
  \ Scripts 更适合在 Office 365 云中运行（目前，它们可以在 Excel 桌面版中运行但不能编辑）。它们更适合用户无需在场的自动化流程，因为它们可以从\
  \ Power Automate 调用。虽然功能稍弱（用户界面选项较少），但它们更易于学习，并且具有脚本记录器，这在入门时非常有帮助。\n\n在现实生活中，您可能会根据要实现的目标在\
  \ Script Lab 和 Office Scripts 之间来回切换。我们将在下一章介绍 Script Lab，然后在 *第 8 章* 中使用 Office\
  \ Scripts 作为 Power Automate 流程的一部分进行扩展。\n\n#### Microsoft Power Automate\n\n还记得在\
  \ *第 3 章* 中我们说决策模型不是工作流，因为它们是一次性执行的吗？Power Automate *是* 基于工作流的，允许您让计算机完成处理 Excel\
  \ 和其他 Microsoft Office 文档时可能需要执行的许多重复手动步骤。通常，Power Automate 流程会跨越多个不同的系统，其中一个可能是为关键业务决策调用我们的决策服务，然后可能用结果更新\
  \ Excel 电子表格。我们将在 *第 8 章* 中更详细地介绍这种方法。\n\n#### Power Query\n\n我们最后一种技术是最简单的。Power\
  \ Query 允许您将各种数据源引入 Excel，以可重复的方式操作数据，并允许您稍后从原始数据源刷新数据。它是数据分析师工具包中非常强大的元素，本身也非常值得学习。\n\
  \n我们对 Power Query 感兴趣的是，它可以从的数据源之一是 JSON，使用 REST API。这正是 Kogito 从我们的决策服务生成的机器可读格式。由于所有技术都链接到相同的\
  \ REST 和 JSON 格式，因此值得更详细地了解我们正在处理的内容。\n\n#### 使用 REST 的机器可读网页\n\n我们一直在谈论使用 REST\
  \ 和 JSON 作为通用语言的机器可读网页。\n\n**REST** 代表 **Representational State Transfer**，这是描述机器可读网页的另一种方式。让我们通过一个简单的示例看看它是什么样的，然后更详细地探索\
  \ Kogito REST API。\n\n#### 一个简单的 REST 示例\n\nREST 使用与浏览网页相同的许多基础设施——因此您可以使用 Web 浏览器打开\
  \ REST URL，例如 `https://api.github.com/repos/OfficeDev/office-js`，就像 *图 6.2* 中那样。此屏幕截图使用\
  \ Firefox 拍摄，因为它为我们着色 JSON，但 Edge 和 Chrome 也会给出类似的结果。请注意，将返回大量信息——我们已编辑图像以提高清晰度。\n\
  \n\n\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_155_0.png)\n\n图6.2 – 一个简单的REST调用\n\
  \n这个REST调用为你提供关于托管在GitHub上的项目的信息。从URL中，你可以猜到它包含有关一个仓库（项目）的信息，而这个项目就是微软团队的Office\
  \ JavaScript示例。查看返回的信息，在最底部，我们可以看到“订阅者数”——关注该项目的人数。\n\n虽然REST格式主要由机器使用，但对人类也并非不友好。我们已经了解了以下几点：\n\
  \n- REST调用通过网络使用标准传输（你所熟悉的HTTP）进行。特别地，这是一个GET请求，我们想要传递的所有信息都包含在URL中。\n- REST URL的结构能够提示将要返回的信息。从返回的JSON中，我们可以得到指向其他可能感兴趣的URL（或端点）的指针。\n\
  - 该调用返回JSON，这是我们在第4章首次遇到的格式，它让我们能够猜测大量信息的含义。实际上，它返回的信息太多了，但我们可以忽略所有内容，只关注我们正在查找的字段（订阅者数）。\n\
  \n- 如果我们刷新页面，会得到几乎相同的结果（除非在此期间有人关注了该项目）。这让我们了解到REST调用是*无状态的*——服务器接收我们的请求，处理它，然后忘记我们。我们的下一个请求将根据当时传入的信息被视为全新的查询。\n\
  \n我们的简单示例使用浏览器发出Web请求。正如你从截图中可能猜到的那样，REST并不真正关心是谁或什么在调用它，只要它是一个有效的请求。在这种情况下，*有效*意味着发起调用的客户端知道如何“说”HTTP，客户端调用的是正确的URL，并且向该URL传递了预期的信息。\n\
  \n### 更多关于REST——GET和POST请求\n\n在前面的示例中，我们使用GET请求与服务器通信——所有信息都在URL中。GET是简单请求的最佳选择——例如，谷歌在搜索查询中使用它，你可以将诸如`https://www.google.com/search?q=packt+books`的URL复制粘贴到不同的浏览器中，每次都能得到相同的响应。\n\
  \n我们的请求很可能需要传递更复杂的信息，这就是为什么我们将使用POST选项。你可能在不知不觉中使用过这个选项，例如，在网页上填写表单然后点击提交。如果网页URL没有变化或没有显示你的数据，那么信息在幕后传输的方式就是通过POST调用。虽然POST调用很容易使用（我们很快就会看到），但在POST调用中，信息更隐蔽，但也更强大。\n\
  \n你可能已经猜到，REST远不止我们在这里介绍的“够用就好”的内容。如果你想了解更多，一个好的信息来源是`https://restfulapi.net/`。\n\
  \n我们学习REST的重点是与Kogito决策服务器通信。让我们更详细地看看这是什么样子，从Swagger开始——一个让REST更易于使用的工具。\n\n###\
  \ Swagger——连接Kogito的更友好方式\n\n虽然REST并非不友好，但Kogito贴心地使用了一个名为Swagger的工具，使REST页面更容易理解。\n\
  \n我们将从*第5章*结束的地方继续，当时我们将决策模型部署到OpenShift云（开发沙箱）中，并分享了网页供同事们欣赏。现在值得回到那个网页——记得它看起来类似于*图6.3*。\n\
  \n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_157_0.png)\n\n图6.3 – 提醒我们决策模型在云中的样子\n\
  \n### 记住——你可能需要重新启动/重新部署到OpenShift\n\n友善提醒：OpenShift开发沙箱在24小时后超时——你可能需要再次按照第5章的说明操作，将KIE沙箱链接到OpenShift。你可能对这个每24小时续期一次的限制感到厌倦。我们将在第10章解决这个问题，届时我们会研究更多可以部署决策模型的地方。\n\
  \n通过Swagger API访问此页面的机器可读版本非常简单——点击页面右上角的点（在图6.3中），然后点击出现的Swagger UI。你将看到Swagger页面，其中概述了Kogito代表我们生成的REST接口，如图6.4所示。\n\
  \n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_158_0.png)\n\n图6.4 – 为我们的决策服务生成的REST\
  \ API的Swagger摘要\n\n在详细查看此屏幕之前，把它想象成走酒店或公寓楼的消防通道。你仍然在同一栋楼里，仍然在使用楼梯，但你会看到比平时更多的幕后细节，例如暴露的管道、未隐藏在面板后面的电缆、裸露的混凝土和砖墙。同样，我们在这里看到很多技术细节——所以我们将专注于将Excel链接到决策服务所需的关键点。\n\
  \n我们从第4章创建的最终模型得知，Product Recommendation Service是我们想要使用的服务——我们将模型包装在这个决策模型节点中，正是为了强调这是供我们外部调用的那个。在进一步探索此服务之前，让我们快速看一下暴露的其他端点：\n\
  \n- GET /{modelname}：允许我们下载原始决策模型\n- POST / Upload：上传新模型——仅真正用于KIE工具\n- GET / Upload/status：允许我们查看上传模型时的任何错误\n\
  - POST - {modelname}以及类似的{modelname}/dmnresult：允许我们查看完整模型中所有决策节点执行的结果\n\nProduct\
  \ Recommendation Service还有一个带有/dmnResult标签的第二个版本。这与主服务相同，但添加了KIE执行决策模型时返回的Info、Warn和Error消息的信息。\n\
  \n设计像这样好的REST API是一门艺术——关于决策服务生成的主体（body）的更多信息，参见*图6.6*。\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_160_0.png)\n\
  \n图6.6 – Swagger显示我们成功的REST调用\n\n恭喜！你刚刚调用了你的第一个REST API！毫不奇怪，结果与网页相同。我们将花一些时间将Excel连接到这个REST\
  \ API——所以尝试一下，传入不同的客户编号、国家、日期等，看看返回值如何变化。\n\n在我们证明可以使用多个客户端调用决策服务之前，我们先来看一些关键信息。这也将帮助我们理解，在本章和后续章节的示例中，要成功进行REST调用需要做些什么。\n\
  \n### 一些关键信息——服务端点和内容\n\n就在*图6.6*中的文本下方，Swagger还很贴心地列出了你刚刚执行的命令，其格式可以直接复制粘贴到命令提示符中——例如以下列表：\n\
  \n```bash\ncurl -X 'POST' \\\n  'https://dmn-dev-sandbox-yu88rl6qu490-crt-openshift-dev.apps.sandbox.x8i5.pl.openshiftapps.com/CustomerRecommendations/Product\
  \ Recommendation Service' \\\n  -H 'accept: application/json' \\\n  -H 'Content-Type:\
  \ application/json' \\\n  -d '{\n  \"Customer\": {\n    \"Number\": 0,\n    \"Name\"\
  : \"string\",\n```\n\n\n\n\n```\n\"Date of Birth\": \"2022-10-23\",\n\"Country of\
  \ Residence\": \"string\",\n\"Special Requests\": \"diabetic\",\n\"Previous Orders\"\
  : [\n    0\n]\n}\n}'\n```\n\n我们不会运行 Curl，但将这段文本复制粘贴到记事本等工具中然后保存是很重要的。这段文本包含了我们成功进行\
  \ REST 调用所需的一切信息，对于本章和下一章中的示例运行至关重要。具体来说，我们将使用以下内容：\n\n- 网址（或 **端点**），以 `https://dmn-dev-sandbox...`\
  \ 开头（你的链接会略有不同）。这是云中决策模型，我们所有的示例都链接到它。\n- 我们要发送到该网址的 JSON（它在 `-d` 之后的部分，以 `{ \"\
  Customer ...` 开头）。它告诉我们需要发送的消息的布局。\n\n**重要 – 第 6、7 和 8 章的大多数示例都需要此信息**\n本章及接下来的两章中的大多数示例都会使用此端点，因此值得将通往此处的页面加入书签。在尝试将链接指向\
  \ Excel 之前，最好检查端点是否仍处于活动状态（你能看到图 6.3 中的网页吗？）。\n如果你看不到该网页，请记住 OpenShift 的免费版本在 24\
  \ 小时后会停止工作。在这种情况下，请按照第 5 章中的说明重新将 KIE 链接到 OpenShift 并重新部署决策模型。\n\n### 其他桌面 REST\
  \ 客户端 – HTTPie\n\n由于 Swagger 是一个网页，因此并不明显 Swagger 页面与 Kogito REST API 是分开的，并且调用在两者之间传递。如果你使用\
  \ **HTTPie** 等桌面客户端来发出调用，就能更清楚地看到这一点。以下步骤并非严格必要，但有助于更详细地了解正在发生的事情：\n\n- 1. 从 https://httpie.io/download\
  \ 下载并安装 HTTPie。\n- 2. 运行 HTTPie – 然后像图 6.7 中那样点击 **Headers** 按钮。这些头部值始终需要我们调用 Kogito\
  \ 决策服务。如果你仔细查看之前的 curl 代码列表，你会注意到它们也在那里使用 `-H` 标志设置。\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_162_0.png)\n\
  \n图 6.7 – 在 HTTPie 中设置头部\n\n- 3. 点击主 Body 标签，在屏幕顶部的图 6.8 中设置我们决策服务的 URL。该 URL 是我们部署的\
  \ OpenShift URL 和决策服务名称的组合。方便的是，我们可以直接从之前看到的 curl 示例中复制粘贴它 – 它看起来像一个正常的（如果很长的话）网页请求，以\
  \ https 开头。\n\n- 4. 在我们输入 URL 的框旁边，我们需要将请求类型设置为 POST。\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_162_1.png)\n\
  \n图 6.8 – 在 HTTPie 中设置我们的 REST 调用\n\n- 5. 我们需要指定 Body，或作为请求一部分发送的值。这些 JSON 值与我们之前的调用完全相同\
  \ – 因此复制并粘贴我们在 CURL 或 Swagger 列表中看到的 JSON。\n\n- 6. 要发出请求，点击屏幕右上角的绿色 Send 按钮。\n\n\
  - 7. REST 调用的结果显示在主窗格中。200 是成功的标准网页代码，你会注意到由于我们指定了一个乳糖不耐受的客户，因此我们正确地收到了健康警告作为响应。\n\
  \n> **稍后 – HTTPie 作为调试工具**\n> 即使你现在不安装 HTTPie，也请记住它以备后用 – 它可以帮助我们判断问题是否由我们编写的公式、我们发送的请求或我们调用的决策服务器引起。知道问题所在有助于我们更快地修复它。\n\
  \n既然我们现在知道如何进行成功的机器对机器网页请求，让我们使用 Excel 在我们的决策服务中发出其中一个请求。让我们从最简单的方式开始，使用 Excel 中的\
  \ Power Query。\n\n### 使用 Power Query 调用决策服务\n\n我们之前解释过，Power Query 允许你将 Excel 连接到各种数据源。我们将在下一节重点介绍如何使用它连接到决策服务\
  \ REST API。但如果你好奇它还能做什么，我鼓励你查看 Packt 的 Power Query 和相关的 Power BI 系列：https://subscription.packtpub.com/expert-reading-lists/power-bi-for-business-intelligence-beginner-to-advanced。\n\
  \n通过 Power Query 连接 Excel 需要许多简单的步骤，我们将逐一介绍：一个简单的 REST 调用、传递参数，以及更高级的 POST 调用，然后将它们组合起来链接\
  \ Excel 和我们的决策服务。\n\n#### 一个简单的 Power Query REST 示例\n\n我们将通过对外部 API 可能的最简单 Power\
  \ Query 调用进行练习 – 我们之前遇到的 GitHub API https://api.github.com/repos/OfficeDev/office-js。\n\
  \n这是一个 GET 调用，没有参数，这使其成为完美的起点。完成的示例可以从本书的 GitHub 示例站点下载 – https://github.com/PacktPublishing/Business-Rule-Engines-and-AI-for-Excel-Power-Users\
  \ 作为 06_simple_power_query.xlsx – 但我也鼓励你按照以下步骤操作：\n\n- 1. 在 Excel 中，选择 **数据** 菜单，然后选择\
  \ **获取数据**。你应该会看到各种数据源，如 *图 6.9* 所示。\n\n图 6.9 – Power Query 数据源选项\n\n- 2. 对于这个简单示例，我们将使用\
  \ **从 Web**。稍后，我们将使用空白查询并从头开始编写连接。\n- 3. 在打开的对话框中，输入我们的 API URL：`https://api.github.com/repos/OfficeDev/office-js`。你会看到此对话框只提供\
  \ GET 选项 – 对于我们的简单示例来说这很好。\n- 4. 点击 **确定** 将打开 Power Query 编辑器。\n- 5. 点击屏幕左上角的 **转换为表格**\
  \ 按钮。这会将结果转换为在 Excel 中更易于操作的表格。\n\n6. 你将能够在屏幕中央查看调用返回的结果 – 如 *图 6.10* 所示。\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_165_0.png)\n\
  \n图 6.10 – Power Query 显示 REST API 调用的结果\n\n我们将在 Power Query 编辑器中花费一些时间，因此值得查看一下这个屏幕：\n\
  \n- Power Query 返回的数据始终位于中央。毫不奇怪，它看起来与我们在网页浏览器中进行相同调用时的数据相同。\n- 上面是 *公式栏* – 类似于\
  \ Excel 电子表格。然而，这些公式使用 Power Query M 语言，描述转换数据的步骤。\n- 顶部是我们可以应用于此数据的各种命令。我们目前位于\
  \ **开始** 选项卡，但有选项可以转换数据、更改视图等等。\n- 由于 Power Query 会记录你对数据的操作步骤，因此刷新数据时可以再次重放它们。在右侧，你可以看到\
  \ **已应用步骤** – 你已进行的步骤，将在刷新时重放。\n- 左侧是当前 Excel 工作簿中所有查询的列表。由于这是我们的第一个 Power Query，只列出了一个。\n\
  \n#### 安全检查\n\nPower Query 是以安全为目的构建的，因此在运行此示例时，它可能会询问你对该数据的敏感程度，如 *图 6.11* 所示。\n\
  \n图 6.11 – Power Query 数据敏感性检查\n\n在这种情况下，数据是公开的，我们的 GET 调用中没有共享任何信息，因此在下拉菜单中选择公开值并点击保存。\n\
  \n现在我们能够在 Excel 中从 REST 网页源访问 JSON 数据，让我们做一些更有用的事情。\n\n#### 在 Excel 中使用 Power Query\
  \ REST 数据\n\n在 Power Query 中拥有 JSON 数据很棒，但信息太多了，无法直接使用。我们需要在返回 Excel 之前过滤和转换此信息：\n\
  \n- 1. 在屏幕左侧右键单击我们的查询名称，并将其重命名为 office_js。\n- 2. 在 Power Query 中右键单击表格的第一列。\n- 3.\
  \ 在出现的上下文菜单中，选择 文本筛选器 和 不以...结尾，如图 6.12 所示。提示：如果在上下文菜单中看不到此选项，请确保已执行上一个示例的第 5 步（将结果转换为表格）。\n\
  \n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_166_0.png)\n\n\n\n\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_167_0.png)\n\
  \n图6.12 – 筛选器上下文菜单\n\n- 4. 在筛选器框中，设置__url值（包括下划线）。单击“确定”后，你会看到数据列表现在短多了，并且**应用的步骤**列表中添加了一个额外的步骤。\n\
  - 5. 通过从菜单中选择**转换**，然后再选择**转置**，来交换行和列。\n- 6. 同样在**转换**菜单中，选择**将第一行用作标题**。\n- 7.\
  \ 虽然我们的数据比屏幕宽，但比之前整洁多了。它看起来与*图6.13*颇为相似：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_167_1.png)\n\
  \n图6.13 – 筛选器上下文菜单\n\n- 8. 数据现在可以返回Excel了。从**开始**菜单中，选择**关闭并加载**。\n- 9. 在出现的对话框中，选择新工作表作为工作簿中的目标位置。最好使用新工作表而不是现有工作表，因为如果外部来源的数据重叠，Excel会发出警告。一切顺利的话，Excel会将这些信息插入为表格，如*图6.14*所示：\n\
  \n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_167_2.png)\n\n图6.14 – 数据以表格形式加载到Excel中\n\
  \n# 1M-END：一种用于端到端图像压缩的两级深度神经网络统一架构\n\n作者：Di Ma，Zekun Li，Shuyuan Zhu，Shiyin Qin，Bing\
  \ Zeng\n\n摘要——近年来，许多工作聚焦于使用深度神经网络的端到端图像压缩。然而，这些工作大多使用超先验...\n\n索引词——端到端图像压缩，深度神经网络，学习型分析变换，学习型综合变换，量子...\n\
  \n## 1 引言\n\n近年来，深度神经网络（DNNs）引起了越来越多的关注。在图像压缩领域，基于DNNs的端到端图像压缩方法取得了显著的性能...\n\n\
  在本文中，我们提出了一种用于端到端图像压缩的两级深度神经网络架构。第一级是基于非局部注意力的卷积神经网络（NLA-CNN），第二级是...\n\n## 2 相关工作\n\
  \n传统的图像压缩方法，例如JPEG和HEVC，已被广泛使用...\n\n## 3 提出的方法\n\n本节将详细介绍所提出的架构。\n\n### 3.1 第一级：NLA-CNN\n\
  \nNLA-CNN由编码器网络和解码器网络组成。编码器网络由分析变换...\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_168_0.png)\n\
  \n图1：所提出的基于NLA-CNN的端到端图像压缩架构的3D视图。\n\n```\n```\nAlgorithm 1: Training Procedure\n\
  Input: Training images x;\nOutput: Reconstructed image x_hat;\n1: Initialize the\
  \ parameters...\n2: for each epoch do\n3:   ...\n```\n```\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_170_0.png)\n\
  \n图6.17 – 创建我们的表以供Power Query使用\n\n- 5. Power Query将创建一个以此名称命名的表，并打开Power Query编辑器。查询的名称将是在*步骤4*的对话框中给定的名称。\n\
  \n现在我们已经将该表命名并加载到Power Query中，可以在Power Query M公式中引用它。你应该已经从上一步打开了Power Query编辑器。让我们创建一个查询来读取此表中的信息：\n\
  \n- 1. 在编辑器左侧的**查询**窗格中，右键单击并选择**新查询**、**其他源**，然后选择**空白查询**。\n- 2. 创建的新查询将被称为`Query1`或类似名称。通过*右键单击*它来重命名——在可下载的示例中，我们将其命名为`RestUrl-onestep`。\n\
  - 3. 通过单击**开始**菜单上的**高级编辑器**打开高级编辑器。\n- 4. 出现的屏幕只是我们之前看到的公式栏的放大版本。替换Excel建议的任何文本。将其替换为以下查询：\n\
  \n```powerquery\nlet\n    // \"SourceUrl\" with quotes needs to match the named\n\
  \    // range on our Excel sheet. You may need to change {1} to\n    // {0} depending\
  \ on when your first line begins\n        pSourceUrl = Excel.CurrentWorkbook()\n\
  \    {[Name=\"SourceUrl\"]}[Content]{1}[Column1]\nin\n    pSourceUrl\n```\n\n- 5.\
  \ 确保文本与所示完全一致。单击屏幕右下角的**完成**以保存代码并退出屏幕。\n- 6. Power Query将运行并返回您在电子表格中输入的参数。我们不打算展示截图，因为我们所做的只是将信息从Excel的一个部分转移到另一个部分——但这是一个关键步骤！\n\
  \n更重要的是，我们来分析一下刚才输入的公式中发生了什么。所有M公式都遵循标准的let ... in格式。let列出获取数据并转换数据的步骤。in将数据显示给用户。在本例中，let只有一行，但其中有四个关键操作：\n\
  \n- `Excel.CurrentWorkbook` 获取当前工作簿\n- `{ [Name=\"SourceUrl\"] }` 从该工作簿获取该名称的范围/表\n\
  - `[Content]` 返回该范围/表的内容\n- 由于我们只想从整个内容中获取一个值，因此使用`{1}[Column1]`表达式来选择我们正在查找的行号和列名\n\
  \n如果你想在自己的工作簿中使用此示例，只需复制粘贴这些行即可。然后用你正在使用的范围或表的名称，以及你希望从该表获取的行/列来更新它即可。\n\n**逐步操作日后会节省你的时间**\n\
  在可下载的示例中，我们将此示例保留为一个单独的查询，即使我们稍后会将其构建到更复杂的示例中。这使我们能够检查是否有任何问题——至少我们知道我们可以正确地从电子表格中读取值，并查看这些值是什么。\n\
  \n有关`Excel.CurrentWorkbook`和其他Power Query M公式的更多信息，请参阅Microsoft文档：https://learn.microsoft.com/en-us/powerquery-m/excel-workbook。\n\
  \n由于我们将不得不关闭Power Query编辑器以继续下一步，我们将其保存为**仅限连接**。这样可以让我们的查询在Excel中不显示结果。可以通过以下方式完成此操作：\n\
  \n- 在Power Query编辑器中选择**关闭并加载**\n- 在出现的对话框中选择**仅限连接**\n\n我们稍后将在本章中再次讨论参数。但首先，我们需要弄清楚如何在Power\
  \ Query中发出POST请求，因为我们需要它来链接到我们的决策服务。\n\n## 使用Power Query从Excel调用我们的决策服务\n\n在本章前面，我们使用Power\
  \ Query从Excel执行了一个简单的GET请求。但我们需要链接决策服务的API更复杂——它需要通过POST请求传入JSON数据。现在让我们基于已有的Power\
  \ Query知识来构建这一功能，首先从一个不含参数的硬编码示例开始。\n\n此示例可下载为06_power_query_decision_service.xlsx，我们将逐步完成：\n\
  \n- 1. 如果尚未打开编辑器，请打开它（**数据 | 获取数据 | 启动Power Query编辑器**）。\n- 2. 创建一个新查询（在编辑器左侧的**查询**窗格中，右键单击并选择**新查询，其他源**，然后选择**空白查询**）。你还应将查询重命名为更有意义的名称。\n\
  - 3. 在**开始**菜单中打开**高级编辑器**，然后复制并粘贴以下文本：\n\n```\nlet\n    // the Rest URL we are\
  \ calling - you will need to\n    //update this with the value from your Swagger\
  \ API\n    RestUrl = \"https://dmn-dev-sandbox.openshiftapps.com/\nCustomer Recommendations/Product\
  \ Recommendation Service\",\n\n    // The JSON Values we will pass in to call the\n\
  \    //decision Service\n    Payload = \"\n    {\"\"Customer\": {\n        \"\"\
  Number\"\": 0,\n        \"\"Name\"\": \"\"string\"\",\n        \"\"Date of Birth\"\
  \": \"\"2022-10-15\"\",\n        \"\"Country of Residence\"\": \"\"UK\"\",\n   \
  \     \"\"Special Requests\"\": \"\"lactose intolerant\"\",\n        \"\"Previous\
  \ Orders\"\": [0]\n    }}\n    \",\n    // Do the JSON Call\n    Response= Web.Contents(RestUrl,\
  \ [Content=Text.\nToBinary(Payload),\n        Headers=[ #\"Content-Type\" = \"application/json\"\
  ,\n#\"Accept\" = \"application/json\"]]),\n    //Convert the response for display\n\
  \    JsonResult = Json.Document(Response)\n\n    // display the results\nin\n  \
  \  JsonResult\n```\n\n\n\n\n\n+   4. 你需要将以 `RestUrl` 开头的行中列出的端点更新为你在 OpenShift 部署中的值。提醒一下，这就是我们在\
  \ *Some vital information* 部分让你记下的值——以 ... `https://dmn-dev-sandbox-...` 开头的 URL。编辑此值时请注意引号。\n\
  \n+   5. 编辑完成后，点击 Power Query 中的 **Done**，然后点击 **Refresh Preview**。如果你今天忘记刷新 Power\
  \ Apps 密钥，或为 `RestUrl` 输入了错误的值，你会收到 `[DataSource.Error] Web.Contents failed to get\
  \ contents from ...` 错误。如果出现这种情况，请返回 *step 4* 并更正。\n\n+   6. 第一次使用此查询时，Power Query\
  \ 会询问你是否需要登录以使用此服务，如 *Figure 6.18* 所示。对于我们的所有示例，**Anonymous** 访问即可——但如果你在现实生活中部署此服务，你需要审查安全和登录选项。点击\
  \ **Connect** 退出此对话框。\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_173_0.png)\n\n\
  Figure 6.18 – Power Query login check\n\n+   7. 恭喜！我们从决策服务获得了预期的响应。Power Query 窗口的主区域应显示\
  \ **Potential Health Issue – please check** 消息。\n\n在这次查询中发生的大部分事情我们可以猜到——因为它将我们在\
  \ Swagger 中看到的 REST 调用与 Power Query 公式格式合并了。但值得强调一下我们在本次查询中采取的关键步骤：\n\n+   1. 请注意，`in`\
  \ 部分中的每一行都用逗号分隔。这就是 Power Query 知道每一行是单独步骤的方式。编辑时请小心，因为如果你将其删除，Power Query 会报错！\n\
  \n+   2. 如我们所见并编辑的那样，以 `RestUrl = \"http:// ...\"` 开头的行设置了我们想要调用的 REST 端点。我们将其保存为变量，因为这样以后编辑起来更容易。\n\
  \n+   3. 我们创建了另一个变量 `Payload`，它几乎与我们在 Swagger 中之前使用的 JSON 文本完全相同。由于此文本中需要包含引号，我们使用了双引号，以便\
  \ M 不会混淆并认为我们过早结束了该行。\n\n+   4. 行 `Response = ...` 使用 Power Query 的 `Web.Contents`\
  \ 连接器执行 POST 调用。你会看到此连接器允许我们设置决策服务所需的标头。\n+   5. 调用完成后，`JsonResult = Json.Document(Response)`\
  \ 格式化返回的文本，以便 Power Query 知道我们使用的是 JSON 格式。\n+   6. 查询最后的 `in` 部分指定了我们希望作为查询结果返回的变量。\n\
  \n很高兴我们终于使用 Power Query 将 Excel 连接到我们的决策服务。但虽然我们可以编辑查询，但这对于日常使用并不实用。编辑时很容易因逗号或双引号位置错误而破坏此查询。让我们使用我们之前学到的\
  \ Power Query 参数知识来修复这个问题。\n\n### Calling the decision service using parameters\n\
  \n在本节中，我们将所有部分结合起来——从 Excel 到 Power Query 的 REST 调用和参数，执行 POST 调用，然后将信息带回 Excel。由于我们已经逐步介绍了各个步骤，因此为你提供一个完整的可下载示例是有意义的，`06_power_query_decision_service.xls`\
  \ 位于本书的 GitHub 示例站点上。这使我们能够突出显示关键区域，以便你为自己的工作扩展此方法。\n\n如果打开示例，你会看到主工作表和另外两个工作表标签，如\
  \ *Figure 6.19* 所示。\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_174_0.png)\n\nFigure\
  \ 6.19 – Main sheet and other tabs of our full sample\n\n此电子表格中有几个关键的 Excel 项目值得强调：\n\
  \n- 灰色高亮的区域是一个名为 `ParamsTable` 的命名范围/表。它包含我们希望传递给决策服务以获取巧克力或糖果棒类型建议的信息。\n- 在 Params\
  \ 表中，我们可以轻松更新 `Rest_api` 值。重要的是你现在要将其编辑为你自己的 OpenShift 实例的有效端点；否则，此示例将无法运行。它与我们在前一个示例中用于\
  \ `RestUrl` 的值相同。\n- 第二个工作表标签 `1 DS no Param` 是我们前一个示例中硬编码 REST 调用的输出。\n- 第三个工作表标签\
  \ `2 DS with Params` 是我们运行此示例时的输出。\n\n如果打开 Power Query 编辑器，你会看到我们遵循了自己的建议，保留了几个早期查询以帮助调试。请注意，整个公式仍包含在一个名为\
  \ **2 Param-decision-service** 的单个查询中；否则，公式防火墙将阻止我们混合内部和外部数据源。\n\n我们示例中的其他查询并非必需，但对于你在日常工作中演进此示例时很有用：\n\
  \n- **1 DS No Params** 是我们之前的硬编码查询。它可用于确认我们的决策服务是否接受 POST 请求，但未在最终查询中使用。\n- 主要示例是\
  \ **2 DS With Params**。让我们在 Power Query 中以高级编辑器打开它并逐步介绍。以下脚本的前几行从电子表格中获取我们决策服务的\
  \ URL 并将其放入变量中：\n\n```\nlet\n    // the Rest URL we are calling - you will need\
  \ to\n    //update this with the value from the Swagger API\n    // This example\
  \ takes it from Excel\n    RestUrl = Excel.CurrentWorkbook(){[Name=\"ParamsTable\"\
  ]}\n    [Content]{0}[Value],\n```\n\n接下来的几行与我们之前的硬编码示例相比是新的——我们从 Excel 读取参数到 M 变量。这使得在下一步中构建\
  \ JSON 字符串变得清晰易读：\n\n```\n//We set our values into variables and then build the\n\
  //JSON - it means we are less likely to break the\n//Payload formula.\n```\n\n```\n\
  pCustomerNumber=Excel.CurrentWorkbook()\n{[Name=\"ParamsTable\"]}[Content]{1}[Value],\n\
  \    pDateOfBirth=Excel.CurrentWorkbook(){[Name=\"ParamsTable\"]}\n[Content]{3}[Value],\n\
  \    pCountryOfResidence=Excel.CurrentWorkbook()\n{[Name=\"ParamsTable\"]}[Content]{4}[Value],\n\
  \    pSpecialRequests=Excel.CurrentWorkbook()\n{[Name=\"ParamsTable\"]}[Content]{5}[Value],\n\
  ```\n\n以下步骤使用我们刚刚读取的值构建 JSON 有效负载字符串。虽然三重引号 \"\"\" 看起来很奇怪，但它们是获得正确格式的 JSON 所必需的。\n\
  \n实际上，当你为自己的决策服务构建时，编辑起来比看起来容易——你将替换字段名称（例如 Number），注意不要破坏引号。如果你遇到问题，请参阅故障排除部分，了解如何快速查找和修复错误：\n\
  \n```\n// The JSON values we will pass in to call the decision\n// service\nPayload\
  \ = \"\n\n{\"\"Customer\"\": {\n    \"\"Number\"\": \"\" & pCustomerNumber & \"\"\
  ,\n    \"\"Name\"\": \"\"Joe Bloggs\"\",\n    \"\"Date of Birth\"\": \"\" & pDateOfBirth\
  \ & \"\",\n    \"\"Country of Residence\"\": \"\"\" & pCountryOfResidence & \"\"\
  \",\n    \"\"Special Requests\"\": \"\"\" & pSpecialRequests & \"\"\",\n    \"\"\
  Previous Orders\"\": [0]\n}}\n\"\n,\n```\n\n我们的 JSON 调用几乎与之前完全相同，最终的 in 部分用于显示结果：\n\
  \n```\n// Do the JSON Call\n\nResponse= Web.Contents(RestUrl,\n    [\n        Content=Text.ToBinary(Payload),\n\
  \        Headers=[ #\"Content-Type\" = \"application/json\",\n                 \
  \ #\"Accept\" = \"application/json\"]\n```\n\n```\n]\n),\n\n//Convert the response\
  \ for display\nJsonResult = Json.Document(Response)\n\n// display the results\n\n\
  in\n    JsonResult\n```\n\n要使用此示例调用我们的巧克力店决策服务，无需 Power Query 知识。关闭 Power Query\
  \ 编辑器并返回 Excel，然后执行以下步骤：\n\n+   1. 在第一个屏幕的表格中输入值——确保你有一个有效的端点。端点通常应对用户隐藏，但为了方便起见，我们的示例将其显示出来。\n\
  +   2. 转到我们示例的输出标签 **2 DS with Params**。\n+   3. 右键单击表格并点击刷新以更新表格——有选项可每隔几分钟自动执行此操作。\n\
  +   4. 决策服务将处理提供的值并返回建议以在 Excel 表格中显示（如 Figure 6.20 所示）。对于示例而言，我们向提前订购的客户推荐 **Silk\
  \ Tray** 产品，而更通用的 **Milk Chocolate**。如果你之前编辑过决策模型并部署了它，你的结果可能会有所不同。\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_177_0.png)\n\
  \nFigure 6.20 – The results of our decision service call in Excel\n\n这看起来可能只是一个简单的步骤，但当我们接近本书的一半时，这是一个关键里程碑。我们能够将以前嵌入\
  \ Excel 中的知识部署到决策服务中，利用业务规则和 AI，并将该服务链接回 Excel，以便大多数用户仍能访问它。\n\n\n\n\n在您急于扩展此示例之前，我们想为您留下一些故障排除的关键步骤。您的\
  \ M 公式迟早会出问题，这些步骤将帮助您发现并解决问题：\n\n-   我们已经了解了如何逐步分解查询，即使主查询可以一次性地完成所有操作。这样，只要我们正确读取参数，就可以检查任何我们想要的内容。\n\
  -   如果我们需要查看中间值（例如，我们正在生成的 JSON Payload），我们可以将查询的最后一行改为返回 Payload——只要记得再改回来即可。\n\
  -   我们可以使用 // 或 /* multiple lines*/ 之类的注释来注释掉我们想跳过的代码。\n-   在这个示例中，我们将值显示为表格，但在实际中，我们会在\
  \ Excel 中进一步处理它们——使用我们之前见过的公式 =TableName[column_name] 来提取关键值。\n\n如果您遵循这些步骤，遇到的任何问题都会更容易解决。更大的问题在于，您需要知道何时应该使用\
  \ Power Query 而不是我们提到的其他方法。\n\n### 何时使用 Power Query\n\n我们将 Power Query 作为将 Excel\
  \ 与决策服务关联的首选方案是有原因的。它最接近 Excel 公式，而且 M 查询语言在构建解决方案方面非常强大。更好的是，所需工具都已内置于 Excel 中，因此任何收到您的电子表格的用户都能使用它。\n\
  \n然而，一切都在 Excel 中打包这件事本身也是一个不用的理由。用户对您的电子表格拥有完全控制权（即使您尝试锁定它）。大多数时候，这些更改是出于好意但很笨拙，但确实存在有人操纵\
  \ Excel 电子表格以掩盖其行为的欺诈案例。\n\n在下一章中，您将看到我们介绍其他基于脚本的方法。Power Query 仍然可能是您会考虑的方法，但根据您要构建的解决方案，或许还有更好的选择。\n\
  \n### 总结\n\n本章将您已熟悉的 Excel 世界与您在前几章中了解的 AI、业务规则和决策服务世界连接起来。为此，我们做了以下工作：\n\n-   介绍了五种将规则、AI、决策模型和\
  \ Excel 关联起来的不同方法。\n-   我们学习了使用 REST 的机器可读网页，以及如何使用 Swagger 链接到我们的决策服务——Swagger\
  \ 是一种对 Kogito 决策服务更友好的链接方式。\n-   我们使用 Power Query 调用了产品推荐决策服务。我们给出的分步示例是一个您可以在自己工作中扩展的解决方案。\n\
  \n即使您现在停止阅读本书，您也已经知道如何理清 Excel 电子表格并将业务规则转移到外部决策服务中。\n\n那么本书后半部分还有什么要讲的呢？我们将介绍一些技术，以更好、更快、更灵活、更具可扩展性的方式来实现这一点。我们将从本章提到的一个领域开始——使用更强大的基于脚本的方法（Visual\
  \ Basic、Script Lab 或 Office Scripts）将 Excel 链接到我们的决策服务。\n"
- "# 第 3 部分：\n将 Excel、决策模型和业务流程自动化扩展为完整的企业解决方案\n\n即使您在读完上一部分后停止阅读本书，您也会拥有一个将业务规则和\
  \ AI 集成到 Excel 中的端到端解决方案。但这些工具还有更强大的功能，非常值得进一步探索，以构建可扩展、健壮且企业级的解决方案。\n\n本部分包含以下章节：\n\
  \n-   *第 7 章，在 Excel 中使用 Visual Basic、Script Lab 和 Office Scripts 应用业务规则，* 提供了三种基于脚本的替代方法，让您在如何将\
  \ Excel 与业务规则关联方面拥有更多选择。\n-   *第 8 章，Excel 和 Power Automate 工作流中的 AI 与决策服务，* 介绍了微软的业务自动化工具，并展示了我们如何在流程中的关键节点使用模型做出决策。\n\
  -   *第 9 章，高级表达式、决策模型与测试，* 探索了 KIE 内置表达式语言的全部能力，并介绍了场景测试工具，以确保我们的决策模型按预期工作。\n\n\
  ## 在 Excel 中使用 Visual Basic、Script Lab 或 Office Scripts 应用业务规则\n\n在上一章中，我们说过，无论使用什么技术将\
  \ Excel 链接到决策服务，方法都是类似的。我们将在本章证明这一点。Power Query 是一个很好的方法，但也有局限性。我们将探索使用 Visual Basic、Script\
  \ Lab 或 Office Scripts 链接 Excel 和决策服务——使用哪种方法由您决定。在此过程中，我们将涵盖以下主题：\n\n-   使用 Visual\
  \ Basic for Applications 从 Excel 调用决策服务\n-   安装 Microsoft Script Lab，并使用它将 Excel\
  \ 与我们的决策服务关联\n-   Office Scripts 简介，以及使用该在线 Excel 脚本与我们的决策服务建立关联\n\n为什么我们要介绍多种本质上做同一件事的方法？我们将在本章中解释这一点，并探讨每种方法的优缺点。\n\
  \n由于 VBA 在所有方法中拥有迄今为止最大的安装基数，因此本章从 Visual Basic for Applications (VBA) 开始是一个不错的选择。\n\
  \n## 使用 Visual Basic for Applications 调用决策服务\n\n有很多充分的理由值得考虑使用 VBA 将 Excel 和您的决策服务关联起来。您可能拥有多年的\
  \ Visual Basic 经验。或者您可能继承了一个使用了大量 VBA 逻辑的代码库，而您的组织还没有准备好从中迁移。由于本章假设您熟悉 Visual Basic，如果距离您上次使用它已有一段时间，请参阅附录\
  \ A 以温习。\n\n## 我真的需要了解 Visual Basic for Applications 吗？\n\n这个问题的简单的答案是“不需要”。如果这是您第一次在\
  \ Excel 中编写脚本，您不需要了解 VBA，因为它是一个遗留解决方案。除非您或您的公司已经广泛使用 Visual Basic，否则请跳到下一节 *认识 Microsoft\
  \ Script Lab——VBA 的现代版本*，了解一个更好的替代方案。\n\n我对 Visual Basic 情有独钟。它是我职业生涯中一块重要的垫脚石，并且至今仍在为全球许多\
  \ Excel 电子表格提供支持。因此，怀着最大的敬意，我建议您尽可能*避免*使用 VBA。即使是在这一小节中，您也会认识到它的局限性——您无法控制用户机器上的安全限制、只能在台式机/笔记本电脑上运行（不能在\
  \ Office 365 中运行），以及在通过 Web 发送和接收 JSON 数据时的笨拙。请记住，Visual Basic 诞生于互联网腾飞之前，它的年代感已经说明了这一点。\n\
  \n从积极的一面来看，将业务逻辑从 VBA 和 Excel 迁移到 Kogito 决策服务是改善现状的良好第一步。所以，如果您拥有众多旧式电子表格之一，或者觉得这是必须走的路，请继续读下去！我们需要从电子表格用户会遇到的一个问题开始——安全检查。\n\
  \n## 运行 Excel 宏时的安全检查\n\n在您从常规 GitHub 站点下载本章的第一个示例之前，我觉得有必要向您发出严厉警告：https://github.com/PacktPublishing/AI-and-Business-Rules-for-Excel-Power-Users。\n\
  \n下载示例文件 07_Decision_Service_VBA.xlsm 后，Windows 会立即给出安全警告。这是因为包含 VBA 的 Excel 文件若来自恶意作者，可能会像病毒一样运作。\n\
  \n更麻烦的是，Excel 文件是二进制文件，而且宏可以设置为在打开时自动运行。您将没有机会像本书其他示例那样对它们进行适当检查，那些示例可以在运行前用普通文本编辑器打开。还记得我们之前给出的关于尽可能避免使用\
  \ VBA 的提醒吗？本章后面的其他方法没有这些安全限制。\n\n安全警告可能阻碍您的解决方案的采用\n\n请记住，任何接收您分发的工作簿（包括 VBA 脚本）的用户都会收到类似的安全警告。根据个人经验，这些警告会引起与用户的摩擦，并干扰基于\
  \ VBA 的解决方案的成功发布——无论该解决方案有多好。\n\n虽然我愿意相信您信任我这位作者（毕竟，我们一起读到了这本书的这个位置），但鼓励您执行从互联网下载的\
  \ VBA 文件并不是一个好主意。因此，您可能希望跳过下载，直接阅读后续页面上的文字说明。\n\n\n\n\n如果您决定从前面的链接下载，则需要明确告诉 Windows\
  \ 您信任该 Excel 示例文件。找到您保存文件的位置，右键单击它，然后选择 **属性**。在出现的对话框中，选择 **取消阻止**，如 *图 7.1* 所示。\n\
  \n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_185_0.png)\n\n图 7.1 – 授予示例宏运行权限\n\n##\
  \ 通过 VBA 向我们的决策服务发送 JSON 调用\n\n由于 Kogito 决策服务 Web API 无论何种类型的脚本调用它都相同，因此生成对其的 JSON\
  \ 网络调用非常简单。请看以下示例：\n\n```\n```vb\nSub DecisionService()\n\n    'Handle to the library\
  \ that helps VBA call JSON Objects\n    Dim ds_request As MSXML2.ServerXMLHTTP60\n\
  \    Set ds_request = New MSXML2.ServerXMLHTTP60\n\n    'Update this url to match\
  \ our decision service\n    'important – update this as your server key will be\n\
  \        different\n    ds_url = \"https://dmn-dev-sandbox-0x11ooclw216-crt-openshift-dev.apps.sandbox.x8i5.p1.openshiftapps.com/Customer%20Recommendations/Product%20Recommendation%20Service\"\
  \n```\n\n```\ncrt-openshift-dev.apps.sandbox.x8i5.p1\n.openshiftapps.com/Customer%20Recommendations/\n\
  Product%20Recommendation%20Service\"\n\n'use the library to setup our REST call\n\
  ds_request.Open \"POST\", ds_url, False\nds_request.setRequestHeader \"Accept\"\
  ,\n\"application/json\"\nds_request.setRequestHeader \"Content-Type\",\n\"application/json\"\
  \n\n'build up our body JSON\nds_req_body = \"{\"{Customer}\": {\" _\n    & \" \"\
  Number\": 0,\" _\n    & \" \"Name\": \"Joe Bloggs \", \" _\n    & \" \"Date of Birth\"\
  : \"2022-10-15\", \" _\n    & \" \"Country of Residence\": \"US\", \" _\n    & \"\
  \ \"Special Requests\": \"None\", \" _\n    & \" \"Previous Orders\": [0] }}\" \n\
  \n' send the request\nds_request.send (ds_req_body)\nds_request.waitForResponse\n\
  \nMsgBox (ds_request.getAllResponseHeaders)\nMsgBox (ds_request.responseText)\n\
  ```\n\n您会注意到，尽管这是一种非常不同的语言，但许多方法与第 6 章中的 Power Query M 示例相似。让我们逐步讲解关键部分：\n\n+  \
  \ 1. 我们从 Microsoft 创建辅助对象 MSXML2.ServerXMLHTTP60，它将执行实际的 JSON 调用。\n+   2. 我们捕获我们的\
  \ REST 端点 URL。在您的部署中它会不同——它是您在第 6 章中使用的来自 OpenShift 的端点链接。像之前一样，您可能需要检查决策服务是否仍在运行，并在需要时重新部署或重启。\n\
  +   3. 我们准备对该 URL 的调用。调用类型（POST）和标头与我们在第 6 章中使用的一样。\n\n+   4. 我们需要构建一个包含要传递给决策服务的信息的\
  \ JSON 有效负载。这包含在 `ds_req_body` 变量中。为简单起见，JSON 文本每次都相同。但您可以使用标准的 VBA 操作此字符串以从 Excel\
  \ 电子表格中的单元格取值。\n\n+   5. `send` 和 `waitForResponse` 消息会实际调用 REST 页面。\n\n+   6. `getAllResponseHeaders`\
  \ 和 `responseText` 允许我们显示从 JSON 调用返回给我们的值。\n\n## 扩展我们的示例\n\n为了保持此示例简单，我们对传递的值进行了硬编码。从\
  \ Excel 单元格读取这些值非常简单，可使用 *附录 A* 中所示的方法。另一个我们采用的捷径是之前的脚本仅在消息框中显示值。在现实生活中，您的解决方案可能会做更复杂的事情——例如将值更新回\
  \ Excel 电子表格。\n\n由于 Excel 处理 JSON 很笨拙，您可能需要一些帮助来解析响应以提取所需的值。将广泛使用的 VBA-JSON 库下载并导入到您的\
  \ VBA 项目中是一个不错的第一步。它可在 `https://github.com/VBA-tools/VBA-JSON/releases` 获取。\n\n\
  书籍 GitHub 页面上的可下载代码示例提供了更多行，其中遍历了我们 JSON 调用返回的各个 JSON 值。但由于 JSON 会因服务而异，我们强烈建议您为其添加错误处理以处理所有可能的情况。\n\
  \n当您编写 VBA 脚本时，很可能您会在传递给 REST API 的文本中犯错。像 *第 6 章* 一样，我们建议使用 HTTPie 等工具来测试您传递进出的数据，以查看错误是在\
  \ REST API 中还是在您的 VBA 代码中。\n\n即使从这段简短的代码示例中也能看出，VBA 存在没有原生 JSON 处理的问题。另一个缺点是，在您想要运行此代码的每台机器上，都必须手动设置项目引用。让我们看看如何修复它。\n\
  \n## 修复项目引用\n\n如果在尝试运行 VBA 脚本时收到类似 **用户定义类型未定义** 的错误，则最可能的原因是您忘记指定要使用的附加库。这很容易做到，但需要在您希望运行该项目的每台机器上执行。步骤如下：\n\
  \n+   1. 在 Visual Basic 编辑器中，选择 **工具** 然后 **引用** 以打开引用编辑器，如 *图 7.2* 所示：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_188_0.png)\n\
  \n图 7.2 – 引用我们的代码示例所需的库\n\n+   2. 选择我们需要的两个库——Microsoft 脚本运行时和 Microsoft XML。您可能需要向下滚动才能找到它们。\n\
  \n+   3. 单击确定，然后像之前一样运行代码示例。之后一切都应该能正常工作。\n\n## VBA 之后的下一步\n\n好消息是 Kogito 通过标准的\
  \ REST Web 接口公开 KIE AI、决策服务和业务规则。它与用于访问该接口的技术无关。因此，本书中描述的大多数更高级的技术对 VBA 开发者仍然可用。\n\
  \n虽然我们鼓励您查看其他技术解决方案，但我们也认识到您使用 VBA 调用决策服务是有充分理由的。正确操作后，将（部分）决策逻辑从 Excel 移出并放入基于\
  \ Kogito 的决策模型中，是理顺可能混乱的遗留代码库的重要第一步。让我们看一个更现代的方法——Microsoft Script Lab。\n\n## 认识\
  \ Microsoft Script Lab – VBA 的现代版本\n\nScript Lab 是 Excel 的免费 Microsoft 插件，可从官方应用商店下载。如果您是\
  \ Excel 脚本新手，以下是 Script Lab 为您提供的功能概述：\n\n+   它允许您自动化 Excel 中的任何枯燥、重复操作。因此，一系列步骤只需按一个按钮即可执行。\n\
  \n+   它在 Excel 内为您提供编辑器——在您输入时提供指导以建议您正在查找的关键字。\n\n+   它为您提供了一种保存和与他人共享解决方案的方法。\n\
  \nMicrosoft Script Lab 就像 VBA 的现代版本。它利用熟悉的 Web 技术，如 HTML 和 JavaScript，并为响应式用户界面提供更多选项。即使您不了解这些技术，您也能看到投入时间学习它们的价值。Script\
  \ Lab 也在您的笔记本电脑和 Excel 网页版中运行。它附带一个自动刷新的代码编辑器，让您能够快速进行代码-测试-更新-测试的循环，快速构建解决方案。\n\
  \nMicrosoft 有一个值得一看的 1 分钟视频作为介绍：`https://www.youtube.com/watch?v=yt6os8zPUKc`。\n\
  \n像本书中介绍的所有工具一样，Script Lab 为您提供了清晰的路径和下一步以进一步发展您的解决方案。这可能是使用 Office Scripts（我们将在本章后面\
  \ *什么是 Office Scripts？* 部分介绍）、为 Excel 构建完整的插件，或在其他 Office 产品（如 Word 或 Outlook）上使用\
  \ Script Lab。由于 Script Lab 的编辑器使用与 Visual Studio Code 相似的技术，不仅功能强大，而且如果您决定将其用作高级编辑器，也能让您领先一步。\n\
  \n您在本章中经常会看到提到的一个术语是 **Office.js**。Office.js 指的是我们的脚本与 Excel 通信的方式，例如从单元格范围获取值，或更新工作表的背景颜色。Office.js\
  \ 同时被 Script Lab 和 Office Scripts 使用，这使得在两者之间切换更容易。更多信息可在 `https://developer.microsoft.com/en-us/office`\
  \ 获取。\n\n> **记录器在哪里？**\n> \n> 如果您熟悉 VBA，Script Lab 中最大的缺失就是记录器——让 Excel 捕获您的操作作为稍后可编辑的脚本的能力。记录器对于学习如何操作\
  \ Excel 对象（如范围和工作表）特别有用。值得庆幸的是，Office Scripts（见本章下一节）确实有此记录器，并且在两个工具中操作范围和工作表的 Office.js\
  \ 接口是相似的。\n\n我们可以用 Script Lab 做很多事情，而不仅仅是链接 Excel 与我们的决策服务。但首先，我们需要安装它，进行一次游览，并尝试一个\
  \ `Hello World` 示例以更熟悉它。\n\n## 在 Excel 中安装 Script Lab\n\n在桌面版 Excel 或 Excel 365\
  \ 在线版上安装 Script Lab 都很容易，使用 Microsoft 官方商店。我们的屏幕截图显示了桌面版的步骤。在线安装非常相似：\n\n+   1.\
  \ 在 Excel 中，单击 **插入** 菜单，然后单击 **获取加载项**。\n+   2. 在出现的 Microsoft Store 对话框中，搜索 `script\
  \ lab`，如 *图 7.3* 所示：\n\n\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_190_0.png)\n\
  \nFigure 7.3 – Installing Script Lab through the Office Store\n\n- 3. Click on **Script\
  \ Lab** to make sure you have the official plugin from Microsoft.\n- \n- 4. Click\
  \ on the **Add** button, then accept the terms when requested. Click on **Trust\
  \ this add-in**, as in *Figure 7.4*:\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_190_1.png)\n\
  \nFigure 7.4 – New Office Add-in window\n\n> **A more trustable model than VBA**\n\
  > \n> The new plugin model that Script Lab uses is designed to be secure and trustable\
  \ from the ground up. When you clicked the **Trust this add-in** button, you gave\
  \ it much more limited access than the VBA equivalent. This is good news – when\
  \ we share our Script Lab solution with users, it’s much easier for them to trust\
  \ and use it.\n\nWhen you’ve completed these steps, you should have the **Script\
  \ Lab** add-in installed. You’ll see a new **Script Lab** option on the Excel toolbar,\
  \ and several icons, such as **Code**, **Run**, and **Help**, on the toolbar, as\
  \ in *Figure 7.5*:\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_191_0.png)\n\nFigure\
  \ 7.5 – Script Lab toolbar in Excel\n\nBefore we write our first script, it’s worth\
  \ looking into the new features we’ve just added to Excel.\n\n## Tour of Script\
  \ Lab\n\nNow that we have Script Lab installed, let’s take a look at its key parts,\
  \ starting with our new toolbar shown in Figure 7.5:\n\n- **Code**: This will open\
  \ an editor where we can enter our scripts and supporting user interface elements.\n\
  - **Run**: This will allow us to run our script. It also gives us a **Run side by\
  \ side** option – meaning we can make a change in the code pane and see the effect\
  \ immediately.\n- **Functions**: This allows us to create custom functions to augment\
  \ the built-in functions, similar to functions such as =Sum() that are already built\
  \ into Excel.\n- There are plenty of links to supporting materials provided through\
  \ the remaining buttons – **Tutorial**, **Help**, **Reference Docs**, and **Ask\
  \ the Community**.\n\nClick on the Code button. It will bring up the main Script\
  \ Lab editing pane, as shown in Figure 7.6:\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_191_1.png)\n\
  \nFigure 7.6 – Script Lab editor pane\n\nMost of our work with Script Lab is done\
  \ within this Code pane, in particular, the four main tabs:\n\n- **Script**: This\
  \ is the editor we use to write our scripts – the step-by-step instructions that\
  \ Excel will follow.\n- **HTML**: This allows us to build sophisticated user interfaces,\
  \ based on standard web and HTML technologies.\n- **CSS**: Also known as **Cascading\
  \ Style Sheets**, this allows us to set the look and feel of our user elements/HTML\
  \ pages. While we use the standard CSS in our examples, it’s good to know that we\
  \ can tweak it if needed.\n- **Libraries**: This allows us to import standard functionality\
  \ into our Script Lab projects. Typically, we use Office.js, which we mentioned\
  \ earlier, plus **jQuery** – an industry-standard library for interacting with HTML\
  \ and web pages.\n\nWe’ll write scripts using the editor here shortly. But it’s\
  \ worth completing our tour of this screen with some of the additional options on\
  \ the top row of the Script Lab pane. The visible options on the top row are as\
  \ follows:\n\n- **Run**: The **Run** option does the same thing as the **Run** button\
  \ we saw on the main **Script Lab** menu.\n- **Delete**: This allows us to delete\
  \ our current project.\n- **Share**: This gives us options to share our projects.\
  \ The gist options mentioned here are similar to how KIE Sandbox saves projects\
  \ in GitHub. There is also a **Copy to Clipboard** option, which allows you to copy-paste\
  \ the entire project in one go.\n- **Login / Logout** (of GitHub).\n\nFinally, we\
  \ can click on the hamburger menu on the top left (three lines stacked on top of\
  \ each other). This menu has additional options for managing snippets and projects,\
  \ as shown in Figure 7.7:\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_192_0.png)\n\
  \nFigure 7.7 – Snippets and samples\n\nThese options include creating a blank new\
  \ snippet and reviewing projects you previously created in **My Snippets**. There\
  \ are also many well-documented examples under **Samples** that are well worth working\
  \ through to explore Script Lab further. Finally, we'll use the **Import** option\
  \ in the next section to quickly bring in the examples that we'll use later in this\
  \ chapter.\n\nAs we finish our tour of Script Lab, it's worth taking a quick look\
  \ at the Microsoft documentation to learn more. A good starting point is https://docs.microsoft.com/en-us/office/dev/add-ins/overview/explore-with-script-lab.\n\
  \n## Saving projects in Script Lab\n\nLet's repeat something we mentioned in the\
  \ previous section: Script Lab projects are not saved in the location that you may\
  \ expect:\n\n- Unlike in VBA projects, Script Lab projects are not saved as part\
  \ of the current Excel sheet. This is a good thing as other users cannot modify\
  \ or break the script. But it does mean that users need to install Script Lab to\
  \ import the scripts. This is not a big deal but involves a separate step that we'll\
  \ describe shortly.\n- Scripts are not (as you also might expect) saved in the Excel\
  \ folder on your laptop. This is because they need to work with the Office 365 version\
  \ of Excel as well. In effect, they run within a web browser that is itself embedded\
  \ in Excel, so both the online and desktop versions have a similar environment to\
  \ work within.\n- Because of this, Script Lab projects are hosted and saved within\
  \ the web browser's local storage, not unlike KIE Sandbox. Like KIE Sandbox, there\
  \ is the option to save the scripts automatically to GitHub using gists. We won't\
  \ cover saving it in detail since it is so straightforward, using the **Login**\
  \ and **Share** buttons we encountered previously.\n\nHaving the script separate\
  \ from the Excel spreadsheet gives you more options. It is possible for you to give\
  \ instructions on how to install Script Lab to all users.\n\nBut more likely, you\
  \ would share the spreadsheet as normal, and then a smaller number of power users\
  \ would perform the checks using the scripts. For example, a mortgage broker might\
  \ pass out a loan application form in Excel to all clients, and only run the script\
  \ on the returned spreadsheets. That allows the broker to keep their business knowledge\
  \ about which loan to recommend private.\n\n## Importing scripts into Script Lab\n\
  \nWe previously shared and saved a Script Lab snippet in the book's sample GitHub\
  \ folder as `07_Script_Lab_Hello_world.yaml`. We're going to use that in the next\
  \ section, so it's worth importing that script into Script Lab now, as follows:\n\
  \n- 1. Download and open this script in an editor such as Notepad.\n- 2. You’ll\
  \ see that this text file contains some metadata about the platform it targets (Excel),\
  \ plus a summary of all the information from the four tabs of the Script Lab editor.\n\
  - 3. Copy all of the text from Notepad (or equivalent). Make sure you don’t miss\
  \ anything at the start or the end.\n- 4. Open the hamburger menu in the top left\
  \ of Script Lab, then select **Import**.\n- 5. In the dialog box that appears, paste\
  \ the text you previously copied, then click **Import**.\n\nThat’s it – you should\
  \ have the Hello World project available to use in your copy of Script Lab.\n\n\
  > **TypeScript or JavaScript?**\n> You’ll notice in the metadata that the script\
  \ type is listed as TypeScript. This can do everything JavaScript can do, and more.\
  \ While it’s slightly stricter, it’s a good habit to use TypeScript as it allows\
  \ the editor to make more useful suggestions as you write your scripts.\n\n## Hello\
  \ World in Script Lab\n\nAt first glance, our script is complicated. But it gets\
  \ easier to understand when you know that there is a standard format to our script\
  \ and one place (in the middle) that we edit to create our own scripts:\n\n```\n\
  // Register our function to run on Button click\n$(\"#run\").click(() => tryCatch(run));\n\
  // our hello world function\nasync function run() {\n    await Excel.run(async (context)\
  \ => {\n\n        // Our main sample starts here\n        console.log(\"Hello World\"\
  );\n        // Our main sample ends here\n\n        await context.sync();\n    });\n\
  }\n/** Default helper for invoking an action and cover errors. */\nasync function\
  \ tryCatch(callback) {\n    try {\n        await callback();\n```\n\n\n\n\n\n```javascript\n\
  } catch (error) {\n  // Note: In a production add-in, you'd want to\n  // notify\
  \ the user through your add-in's UI.\n  console.error(error);\n}\n}\n```\n\n让我们逐步分析脚本中的关键点。实际上，你只需要编辑我们在*第\
  \ 4 步*中突出显示的脚本来做你想做的事情，其他行都是标准模板：\n\n1. 第一行，以 `$(\"#run\")` 开始，使用 jQuery 将 HTML\
  \ 页面上的按钮（称为 **Run**）与同名函数关联起来。\n2. 你可能会认出 `function run()` 是定义当按钮被点击时将被调用的代码块（我们在上一行设置的链接）。async\
  \ 关键字意味着不要等待函数完成——这样 Excel 在函数运行时不会冻结。\n3. 下一行，以 `await Excel.run(` 开始，是 Excel 脚本中的标准写法。基本上，我们将接下来的几行脚本传递给\
  \ Excel 引擎，然后等待结果。\n4. 我们的代码将 `Hello World` 输出到控制台。在此行前后有注释，以显示这是主要编辑区域，如果你以后想扩展示例。\n\
  5. 由于之前的行告诉我们并行运行多个项目（前一行中的 async），`await context.sync` 强制 Excel 暂停并让所有内容跟上。\n6.\
  \ 注意闭合括号与开头括号的顺序相反。你可能不需要编辑此部分，但如果你要编辑，请注意保持这些括号对齐。\n7. 最后，有一个 `try/catch` 辅助函数。它捕获任何错误，以确保无论发生什么情况用户都能得到更新。你不太可能需要编辑它。\n\
  \n虽然我们从逐步讲解中知道应该发生什么，但让我们仍然运行脚本：\n\n1. 从 Excel 顶部左侧的主 Script Lab 工具栏中，点击 **Run**。选择并排运行的选项。\n\
  2. 侧边栏应如 *图 7.8* 所示进行更新。注意两个 Script Lab 图标，它们使我们能够并排查看正在运行的项目和脚本编辑器，并在两者之间进行实时更新：\n\
  \n   ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_195_0.png)\n\n   图 7.8 – 运行 Hello\
  \ World\n\n3. 点击主窗格中的 **Run** 按钮。控制台应出现在侧窗格底部显示 **Hello World**，如 *图 7.9* 所示：\n\n\
  \   ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_196_0.png)\n\n   图 7.9 – Hello World\
  \ 结果\n\n虽然这只是一个 Hello World 示例，但我们已经看到了标准 Script Lab 项目的结构。该结构不会改变——这使得我们下一步，从 Script\
  \ Lab 调用决策服务，比写起来容易得多。\n\n## 从 Script Lab 调用我们的决策服务\n\n由于 Hello World 项目遵循标准的 Script\
  \ Lab 格式，而我们对决策服务的调用也采用标准格式，因此不足为奇的是，当我们将两者结合起来从 Excel 中的 Script Lab 调用决策服务时，我们会熟悉大部分脚本。\n\
  \n与其重复大量熟悉的元素，我们建议你从 GitHub 书籍网站下载示例——它是 07_Script_Lab_Decision_Service.yaml。如前所述，将此文本在编辑器中打开，复制全部内容，然后打开\
  \ Script Lab 顶部左侧的汉堡菜单，选择 **Import**，并粘贴所有文本。\n\n这样，我们就可以专注于以下逐步讲解中的有趣部分。\n\n此文件中定义了用户界面的几个元素。在\
  \ Script Lab 中查看 **HTML** 选项卡，你可以看到客户号码的输入，如以下摘录所示。其他文本字段遵循类似的模式：\n\n```html\n<div\
  \ class=\"ms-TextField\">Customer Number\n  <input type=\"number\" id=\"cNumber\"\
  \ value=\"update me\"/>\n</div>\n```\n\n这些元素与其它 HTML 元素一起提供了如 *图 7.10* 所示的用户界面。为了保持简单，我们没有为所有可能传递给决策服务的信息包含字段——但如果你愿意，使用相同的模式添加它们是微不足道的。\n\
  \n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_197_0.png)\n\n图 7.10 – 我们在 Script Lab\
  \ 中决策服务示例的用户界面\n\n让我们逐步介绍脚本选项卡中的行，并重点关注我们更改以使用 Script Lab 将 Excel 链接到决策服务的项目：\n\n\
  1. 与之前的示例一样，我们有一些注释和使用 console.log 的日志记录来解释正在发生的事情。\n2. 我们将 url 设置为指向我们的决策服务。你需要更新此值。它与我们的\
  \ Power Query 示例相同；我们可以从 Swagger UI 获取。它是链接以 Customer Recommendations/Product Recommendation\
  \ Service 结尾的链接。\n3. 我们需要为 POST 调用设置 headers。我们将其定义为常量，因为调用 Kogito 决策服务时它们始终相同：\n\
  \n   ```javascript\n   const headers = {\n     Accept: \"application/json\",\n \
  \    \"Content-Type\": \"application/json\"\n   };\n   ```\n\n4. 我们定义了一个 payload，并带有默认值。这会生成与\
  \ Swagger UI 完全相同的 JSON。我们稍后将使用脚本更新这些默认值：\n\n   ```json\n   let payload = {\n  \
  \   Customer: {\n       Number: 10000,\n       Name: \"Jane Doe\",\n       \"Date\
  \ of Birth\": \"2022 - 10 - 15\",\n       \"Country of Residence\": \"NL\",\n  \
  \     \"Special Requests\": \"NA\",\n       \"Previous Orders\": [0]\n     }\n \
  \  };\n   ```\n\n5. 我们使用默认有效负载中的值更新用户界面。`$(\"#cNumber\")` 是 jQuery 查找 HTML 字段的方式。`.val`\
  \ 使用我们之前定义的负载 JSON 设置值。我们对所有字段重复此模式：\n\n   ```javascript\n   $(\"#cNumber\").val(payload.Customer.Number);\n\
  \   ```\n\n6. 如 `Hello World` 示例中所示，我们将按钮链接到在按钮被按下时运行我们的主函数 `callDecisionService`：\n\
  \n   ```javascript\n   $(\"#get-product-recommendation\").click(() =>\n   tryCatch(callDecisionService));\n\
  \   ```\n\n7. `callDecisionService` 使用与传递给 Excel 的相同 async 代码定义，正如我们在前一个示例中看到的那样：\n\
  \n   ```javascript\n   async function callDecisionService() {\n     await Excel.run(async\
  \ (context) => {\n   ```\n\n8. 以防用户表单上的值已更改，我们用它们更新我们的 JSON 有效负载。这是步骤 5 的逆过程；我们对所有字段重复。`+`\
  \ 符号强制值转换为数字：\n\n   ```javascript\n   payload.Customer.Number = +$(\"#cNumber\"\
  ).val();\n   ```\n\n9. 对决策服务的 `fetch` 调用被日志记录包围，这样我们可以看到传递到服务中和从服务返回的值。作为我们调用的一部分，我们使用之前设置好的\
  \ URL、headers 和 JSON 有效负载：\n\n   ```javascript\n   const response = await fetch(url,\
  \ {\n     method: \"POST\",\n     headers: headers,\n     body: JSON.stringify(payload)\n\
  \   });\n   const jsonResponse = await response.json();\n   ```\n\n10. 我们的决策服务返回大量我们不需要的\
  \ JSON 信息。我们使用 `let productRecommendation = jsonResponse[\"decisionResults\"][0][\"\
  result\"];` 获取我们想要的具体决策信息。\n\n值得下载并再次浏览脚本。只需做一些小的更改，它就可以用来调用你自己的决策服务。我还鼓励你查看内置的\
  \ Script Lab 示例。它们涵盖了你可能想要用更复杂的用户界面元素扩展项目的大多数方式。\n\n## 替代方法 – Script Lab 中的自定义函数\n\
  \n当你浏览示例时，你可能会注意到使用 Script Lab 创建自定义函数的选项。乍一看，这似乎很有吸引力——它允许你构建自己的专用函数，然后直接在 Excel\
  \ 单元格中输入如下内容：\n\n```\n= callDecisionService (customerNumber, countryOfResidence,\
  \ dateOfBirth ..)\n```\n\n然而，要使这种方法有效，你需要安装 Script Lab、注册自定义函数，并将函数输入到电子表格中。如果你错过了这三个步骤中的任何一个，你的电子表格就会损坏。\n\
  \n对于大多数用例，我们在上一章中介绍的 Power Query 方法更稳健。它在许多方面都像自定义函数一样运行，它内置于 Excel 中，并且不需要在首次使用时运行以将其与\
  \ Excel 注册。\n\n关于 Script Lab 还有很多东西可以学习，它可以为你提供非常强大的基于 Excel 的解决方案。由于它和我们将在下一节中介绍的\
  \ Office Scripts 有很多共同点，因此花时间浏览 Microsoft 文档是一个很好的投资，网址为 https://learn.microsoft.com/en-us/office/dev/add-ins/reference/overview/excel-add-ins-reference-overview。如果你想深入研究任一工具，我还推荐以下书籍，以充分探索使用这些工具扩展\
  \ Excel 的强大功能 – https://leanpub.com/buildingofficeaddins。\n\n## 什么是 Office Scripts？\n\
  \n虽然所有 Excel 用户都可以访问 Script Lab，但并非每个人都能访问 Office Scripts——目前还不能。由于我们已经知道它共享 Office.js\
  \ 通过脚本操作 Excel 的方法，两者之间有什么区别？\n\n- 虽然与 Script Lab 非常相似，但 Office Scripts 更易于使用。例如，一些样板\
  \ async 调用和错误处理函数对我们来说是隐藏的。\n- Office Scripts 具有记录器，可以记录我们在 Excel 中的操作并将其转录为脚本。这对于学习\
  \ Office.js 特别有用。\n- Office Scripts 预装在 Office 365 在线版中——尽管可能需要管理员启用。\n- 更容易共享脚本。虽然（像\
  \ Script Lab 一样）脚本位于工作簿之外，但通过向工作表添加按钮，任何可以看到 Excel 表的人也可以看到脚本。\n\n\n\n\n\n+   -\
  \ Office Scripts 与 Power Automate 深度集成——这是一个我们在下一章会介绍的工具，它将允许你自动化 Excel 中大量手动步骤，而不仅仅是\
  \ Excel。\n\n使用 Office Scripts 有好处，但也有一些缺点：\n\n- Microsoft 仍在推广 Office Scripts，从路线图来看尚不清楚它何时会面向个人（非商业）用户提供。\n\
  - Office Scripts 只能在 Excel 的网页版中编辑。实际上，编辑器足够好用（并且由更强大的 VS Code 在线编辑器支持），因此这不是一个主要问题。完成的脚本*可以*在网页版和桌面版\
  \ Excel 中运行。\n- Office Scripts 没有 Script Lab 完整的用户界面选项。\n\n最终，如何将 Excel 与你的决策服务链接的选择取决于你还想用该工具做什么。让我们通过参观\
  \ Office Scripts 来帮助你做出选择。\n\n## 熟悉 Office Scripts 环境\n\n要检查你是否可以使用 Office Scripts，请打开在线（Excel\
  \ 365）版本。如果已由管理员启用，你应该会看到 **Automate toolbar** 选项，如 *Figure 7.13* 所示。\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_201_0.png)\n\
  \nFigure 7.13 – Office Scripts toolbar\n\nOffice Scripts 的大部分布局与 Script Lab 相似。工具栏具有\
  \ **New Script** 和 **Sample Script Areas**。**Automate a Task** 按钮链接到 Power Automate（更多内容请见\
  \ *Chapter 8*）。\n\n**Record Actions** 按钮的工作方式与 VBA 中同名工具类似。点击它会捕获你在 Excel 中执行的操作，并以脚本形式显示在屏幕右侧的窗格中。以下脚本示例是我们设置\
  \ Excel 表格中某些值时录制的：\n\n```\n```typescript\nfunction main(workbook: ExcelScript.Workbook)\
  \ {\n  let selectedSheet = workbook.getActiveWorksheet();\n  // Set range B2 on\
  \ selectedSheet\n```\n```\n\n```\nselectedSheet.getRange(\"B2\").setValue(\"This\
  \ is a test\");\n// Set fill color to FFFF00 for range B2 on selectedSheet\nselectedSheet.getRange(\"\
  B2\").getFormat().getFill().\nsetColor(\"FFFF00\");\n}\n```\n\n屏幕右侧的窗格布局与 Script\
  \ Lab 类似——包含代码编辑器、运行代码的日志消息区域以及多个有用的命令按钮。\n\n代码编辑器具有保存按钮。文件保存在你的 OneDrive 文件夹下的\
  \ Documents | Office Scripts 中。这不是自动保存（不像 Script Lab），因此在运行前请确保已保存。\n\n右侧面板中的 ...\
  \ 菜单提供 Add 按钮选项。选择它（不出所料）会在当前工作簿中添加一个按钮来运行脚本，如 Figure 7.14 所示。\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_202_0.png)\n\
  \nFigure 7.14 – Sharing our script via a button in our workbook\n\n更重要的是，创建此按钮会自动将我们的脚本与可以查看工作簿的人共享。这可能是确保工作簿和脚本一起分发的\
  \ easiest 方法。但在 ... 菜单的 Share 菜单选项中还有更详细的共享选项。\n\n由于 Office Scripts 的大部分布局与 Script\
  \ Lab 相似，我们保持描述简短。了解更多的一个良好起点是 Office Scripts 文档 https://learn.microsoft.com/en-us/office/dev/scripts/。\n\
  \n让我们通过修改我们之前的 Script Lab 示例使其在 Office Scripts 中工作来证明这两种脚本方法相似。\n\n## 从 Office Scripts\
  \ 调用我们的决策服务\n\n当我撰写本节时，将之前的示例转换为在 Office Scripts 中工作不到 10 分钟。与其重复之前的步骤，我们将展示如何将更新的示例导入\
  \ Office Scripts，然后回顾并突出我们必须做出的更改：\n\n1. 从通常的 GitHub 站点下载完整脚本。示例文件名是 07_Office_Script_Decision_Service.txt。请注意\
  \ .txt 扩展名，因为我们以两种不同格式提供了相同的示例。\n2. 在 Notepad 等编辑器中打开文件并复制所有内容。\n3. 在 Excel 的在线版本中，选择\
  \ Automate 菜单，然后选择 New Script，并粘贴文件内容以替换此窗口中的所有先前内容。\n4. 保存结果。\n\n如果你更熟悉 Office\
  \ Scripts 保存文件的位置，也可以直接将示例下载到 OneDrive 文件夹下的 Documents | Office Scripts。请注意文件格式略有不同——你需要的是\
  \ 07_Office_Script_Decision_Service.osts 文件。请注意 .osts 扩展名。\n\n如果下载示例不起作用，请检查你是否使用了正确的方法对应的文件。\n\
  \n示例中最大的变化是由于 Office Scripts 没有用户界面元素，我们已将其从示例中删除。虽然我们将传递给决策服务的值硬编码以保持简单，但很容易改为从单元格值读取这些值。\n\
  \n脚本中其他值得突出的关键更改如下：\n\n- Office Scripts 为我们隐藏了大量复杂性。我们有一个简单的 main 方法，它始终以 ExcelScript.Workbook\
  \ 作为参数，以便脚本可以操作当前工作簿。\n- 由于示例使用 TypeScript，我们需要标记脚本使用的对象的类型——因此，我们的 main 方法中包含 workbook\
  \ 标签：\n- 我们的脚本设置 URL、标头、JSON 有效负载和 URL 并使用 Fetch 执行实际的 REST 调用，与之前相同。我们也以相同的方式从返回的值中选择产品推荐。\n\
  - 用于（重新）创建工作表和标题并显示产品推荐的脚本大致相同。任何细微差异都是由于使用了略有不同的 Office.js API 版本。\n- 错误处理已自动内置，因此我们无需编写自己的函数来执行此操作。\n\
  \n```\nasync function main(workbook: ExcelScript.Workbook) {\n```\n\n脚本注释良好，在按下\
  \ Run 按钮开始之前值得阅读一遍。点击按钮后，你应该会收到 Run Succeeded 消息，并且可以查看更新后的 Excel 表格，如 Figure 7.15\
  \ 所示：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_204_0.png)\n\nFigure 7.15 – Excel\
  \ sheet online, updated with decision service results\n\n由于我们保留了之前的示例中的日志记录，脚本输出信息窗口提供了大量关于刚刚发生的事情的信息，如\
  \ Figure 7.16 所示。同样，这些步骤与我们的 Script Lab 示例相同。\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_204_1.png)\n\
  \nFigure 7.16 – Script logging output\n\n我们将在第 8 章再次回到 Office Scripts。但就目前而言，恭喜！如果你运行了此示例以及之前的示例，你现在就有四种不同的方式将\
  \ Excel 与你的 Kogito 决策服务链接（并且知道另外两种方法）。这现在给你一个困难的选择——你应该使用哪种方法？\n\n## 选择很多——但该链接哪一个？\n\
  \n我们提到将 Excel 与决策服务链接的多种不同方法是有原因的。没有一种最佳方法——你的选择将取决于你希望在项目中实现的其他目标。此表可能有助于你决定：\n\
  \n| Tool | Advantage | Disadvantage | Use when |\n|---|---|---|---|\n| Power Query\
  \ | Built into Excel. Acts as a powerful function. | Users can break it. No UI elements.\
  \ | Default method to get started. |\n| Visual Basic | Very powerful. Includes UI\
  \ elements. | Security warnings scare users. Outdated. | Using a legacy code base\
  \ or team has VBA. |\n| Script Lab | Modern version of Visual Basic based on web\
  \ technologies. | Needs installing. | Looking for a rich user experience or if Office\
  \ Scripts is not available. |\n| Functions in Script Lab | Easiest to use – feels\
  \ like a normal Excel function. | Needs three items aligned to work (Script Lab,\
  \ the function to be registered, and the function to be in the workbook). | Niche\
  \ – consider Power Query instead. |\n| Office Scripts | Simpler than Script Lab.\
  \ No installation needed. | Not available to all users. No UI elements. | After\
  \ you outgrow Power Query – if it is available to you. |\n| Power Automate | External\
  \ to Excel. Harder for users to break. | More powerful but more complicated. | Need\
  \ to call the decision service as part of wider workflow. |\n\nTable 7.1 – Different\
  \ methods for linking Excel and your decision service\n\n如果你发现难以选择，这里有个好消息——将业务规则从\
  \ Excel 移出并放入 Kogito 等决策服务的任何步骤都是一个好的步骤。\n\n\n\n\n\n一旦你实现了这一点，使用哪种方法将 Excel 链接到你的决策服务就没那么重要了——因为该方法很可能会随着时间的推移而演进。不管发生什么情况，业务规则现在都存储在\
  \ Kogito 中，并处于适当的版本控制之下——因此你知道它们得到了良好的管理。\n\n例如，你可能从使用 VBA 的旧版 Excel 表开始。将迁移到决策服务（但保留\
  \ VBA）是一个快速的胜利，很快你可能会说服同事使用 Script Lab 作为现代等价物。之后，你可能会决定自动化整个工作流程，并通过 Power Automate\
  \ 调用 Office Scripts 来实现。\n\n它们都是可行的解决方案，而且随着更广泛项目的演进，这些步骤都很容易实现。\n\n### Summary\n\
  \n本章建立在我们之前关于使用 Power Query 将 Excel 链接到决策服务的知识之上。我们还增加了实现此链接的另外三种方法——使用 VBA、使用 Microsoft\
  \ Script Lab，以及使用 Office Scripts。对于每个选项，你都看到了一个完全可用的示例，可以为你的日常工作进行扩展。同样重要的是，我们给出了根据当前项目选择最佳链接技术的总结。\n\
  \n你会注意到，虽然我们将 Power Automate 引入作为链接 Excel 和决策服务的工具，但我们尚未（目前）对其进行详细讲解。在下一章中，我们将通过查看\
  \ Power Automate 工作流以及如何将决策服务用作其一部分，来完成深入指导的集合。\n\n### Using AI and Decision Services\
  \ Within Power Automate Workflows\n\n我们在前两章中所做的是将业务决策从 Excel 移出，并放入托管在 Kogito 中的\
  \ Drools 决策服务中。这效果很好，但我们仍需要在需要时手动触发该流程。\n\n在现实生活中，做出决策很可能只是我们回答客户问题所采取的众多步骤之一。是否可以将这项端到端的工作自动化，创建一个按需调用决策的流程？本章将向你展示如何在以下主题中实现这一点：\n\
  \n- What is a workflow?\n- What is Power Automate, and why use it?\n- Calling business\
  \ rules and decision services from Power Automate\n- Implementing our customer service\
  \ flow in Power Automate\n- Alternatives, such as Power Automate Desktop and Kogito\
  \ business automation\n\nPower Automate 是一个非常用户友好的工具——但也非常强大。我们在本章中的目标是让你了解 Power\
  \ Automate 以及它如何帮助你。我们将展示在更广泛流程中链接 Excel 和决策服务的流程。但由于篇幅限制，Power Automate 中还有许多有趣的部分我们无法探索。希望我们能让你产生进一步学习的兴趣——因此我们还将为你的学习之旅提供下一步的指引。\n\
  \n#### Prerequisites\n\nPower Automate 是 Microsoft 的（主要）在线托管工具——因此不足为奇的是，你需要一个 Microsoft\
  \ 账户。有两种主要账户类型：\n\n- 你可能已经拥有来自你工作或隶属组织的 Microsoft 账户（如果你是学生）。如果你可以访问 `Office.com`\
  \ 或 `Outlook.com`，并且能够使用诸如 `yourname@companyname.com` 之类的凭据登录，那么你就拥有企业 Microsoft\
  \ 账户。\n- 你可能拥有个人 Microsoft 账户（例如 `yourname@live.com` 或 `yourname@hotmail.com`）——或者你可能已注册免费的\
  \ Office 在线版（`https://www.microsoft.com/en-us/microsoft-365/free-office-online-for-the-web`）。\n\
  \n这两个账户都应能让你访问 Power Automate，并启用大多数标准功能。然而，由于我们深入讲解了将流程连接到决策服务，本章使用了仅在企业或按月付费账户中可用的一些高级功能。幸运的是，Microsoft\
  \ 为 Power Automate 提供了这些功能的免费试用——点击以下链接上的 **Start Free** 选项：`https://powerautomate.microsoft.com/`。\n\
  \n本章中使用的示例还假设你的机器上运行着 OneDrive。虽然对于运行 Power Automate 来说并非严格必要，但如果你打算跟随示例，现在安装它可能更容易。\n\
  \n> **Where are the downloadable samples for this chapter?**\n>\n> Power Automate\
  \ 很棒，因为它非常直观。不幸的是，这使得分享示例变得困难——我们无法在 GitHub 站点上发布易于阅读的脚本。\n>\n> 虽然有分享 Power Automate\
  \ 解决方案的方法，但由于本章篇幅限制，我们专注于为你提供清晰的逐步说明，以便你可以将 Power Automate 与你的 KIE 决策服务链接起来。\n\n\
  现在我们了解了将用于访问 Power Automate 的 Microsoft 账户，让我们先回顾一下什么是工作流。\n\n#### What is a workflow?\n\
  \n每个公司都遵循工作流，即使这些步骤可能是手动的。Figure 8.1 给出了我们的巧克力店在响应客户时可能遵循的示例工作流：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_209_0.png)\n\
  \nFigure 8.1 – Sample customer service workflow\n\n这个工作流相当简单——接听客户电话，查找之前的详细信息，利用这些知识做出产品推荐，然后与客户分享该推荐。你可能编写或遵循过更复杂的工作流，但基本构建块保持不变：\n\
  \n- 与外部参与者的交互——在本例中，客户的来电触发了工作流的开始，而我们发给客户的电子邮件完成了它。\n- 从内部系统读取和写入——例如，记录提出的问题，并在我们的系统中查找客户详细信息。\n\
  - 做出决策——在本例中，推荐最佳产品（包括健康检查）。这些步骤可能相当复杂（毫不奇怪），是我们可移交给托管在 Kogito 中的 KIE 决策服务的。\n-\
  \ 一旦做出决策，我们的工作流可能会分支到不同的路径——在我们的示例中，如果需要，我们会发送带有健康警告的不同类型的电子邮件。\n\n这个工作流是有意保持简单的，因为我们将在本章中在\
  \ Power Automate 中实现它。但请记住 *Chapter 1* 中的示例——对进入医院急诊部的患者进行分诊？使用相同的构建块，我们可以绘制出处理并为患者推荐治疗的工作流。\n\
  \n由于这是一本主要关于规则的书，值得提醒我们业务规则和工作流之间的区别。\n\n#### Differences between business rules\
  \ and workflows\n\n我们早在 *Chapter 3* 中就提到过这一点——由于业务规则和工作流都有图形格式，有时人们会感到困惑。需要记住的主要区别如下：\n\
  \n- 规则倾向于一次性工作，而我们的工作流可能需要数小时或数天才能完成。例如，如果我们需要执行手动步骤来审查我们的健康警告，我们就必须等待人类有空执行此任务。\n\
  - 工作流中的步骤相对简单（例如，发送电子邮件），而规则更适合复杂的决策。\n- 理想情况下，我们的业务规则应存放在一个地方，而我们的工作流可能使用多个系统。即使是我们的简单客户工作流也可能跨越五个系统：一次电话通话，在一个系统上保存问题，在另一个系统上查找客户，对决策服务的调用，然后发送电子邮件。\n\
  \n由于规则和工作流关注不同的领域，它们配合得非常好。我们在工作流的一个步骤中运行规则（*Figure 8.1* 中的 *recommend product*\
  \ 步骤）。你能想象如果工作流还描述了产品推荐流程会复杂多少吗？将其作为决策服务中的一个步骤来执行很有意义。\n\n工具的另一个共同点是，两者都以图形格式描述业务知识，并且以我们可以直接执行的方式描述它——规则引擎或工作流引擎可以直接作用于图形图示，因此我们知道所描述的内容就是实际发生的内容。在其他类型的系统中，如果开发人员需要为我们进行转换，这并不总是如此。\n\
  \n> **Workflows instead of scripting**\n>\n> 如果你来自编程背景，你可能会认为编写脚本来执行 *Figure 8.1*\
  \ 中的工作流是微不足道的——你是对的。\n>\n> 但随后，正如我们在 *Chapter 1* 中提到的，你会面临知识消失到代码中的问题。你会理解所遵循的步骤，但你的非技术同事不会。使用图形工作流允许他们与你一起审查和同意流程。\n\
  \n\n\n\n\n既然我们已经决定工作流和业务规则是一个良好的端到端解决方案，那么让我们认识一下 Power Automate，并了解为什么我们应该选择它作为我们的工作流工具。\n\
  \n## 什么是（以及为什么）Power Automate？\n\nMicrosoft Power Automate（以前称为 Flow）是市场上数百种工作流产品之一——如果你想自己查找，可以搜索\
  \ Workflow Engine。那么为什么本书选择它，尤其是在 Kogito 也内置了工作流引擎的情况下呢？\n\n- 作为微软的产品，Power Automate\
  \ 与 Office 深度集成，包括 Excel。托管版本可在线使用，无需设置，大多数 Office 用户均可使用。\n- Power Automate 面向\
  \ Excel Power 用户——这与本书的读者群有很好的交叉。而 Kogito 的工作流引擎更复杂，面向开发者。而 Power Automate 取得了不错的平衡——使用简单，同时比\
  \ IFTTT.com 等面向消费者的服务更强大。\n- Power Automate 遵循 Business Process Model Notation（BPMN）标准，因此本章中学到的许多概念都适用于其他图形化工作流引擎。我们将在本章末尾快速浏览\
  \ Kogito 工作流引擎（jBPM）时看到这一点。\n\n那么，Power Automate 是什么？它是一种将工作流（如图 8.1 所示）与我们在每个步骤中想要执行的具体操作相结合，然后在特定条件为真时触发（或启动）工作流的方式——例如，在收到电子邮件时启动工作流。\n\
  \n由于它是基于云的，即使你的笔记本电脑关闭，甚至你在度假时，工作流仍会继续运行。因此，让我们来看看 Power Automate 并创建我们的第一个流程。\n\
  \n## 开始使用 Power Automate 在线版\n\nPower Automate 可从 Microsoft Office 的多个区域链接，但最简单的地方是\
  \ https://powerautomate.microsoft.com/ 的主页。登录后（如果需要，可创建试用账户），你会看到一个主页/欢迎页面，其中包含大量示例流程模板，以及每个模板的学习材料指针。\n\
  \n值得探索这些资源（现在或以后）——本章范围之外还有很多其他 Power Automate 功能。相反，我们将在开始构建第一个流程之前快速浏览一下屏幕。\n\n\
  点击主页左侧的 My flows。你会看到类似图 8.2 的屏幕，虽然显然，你可能还没有列出任何流程（暂时）。这将是我们处理流程的主要区域，因此值得仔细查看屏幕。\n\
  \n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_212_0.png)\n\n图 8.2 – Microsoft Power\
  \ Automate 的主屏幕\n\n左侧是我们在 Home 和 My flows 屏幕之间导航时已使用的菜单。它有创建流程的选项，我们稍后会使用，以及 Templates\
  \ 选项，建议预建解决方案——在你自己的时间里值得探索，因为它展示了你可以用 Power Automate 做多少事情。\n\n本章不会涵盖其他选项，但我们会简要解释它们，以鼓励你在自己的时间里查看它们：\n\
  \n- **Approvals** 用于需要审批的流程运行，并且你是被指定说“是/否”的人。\n- **Connectors** 允许你将流程链接到许多不同的系统。\n\
  - **Data** 将你链接到底层的 Microsoft Dataverse，如果你已经使用过 Power Query 或 Power Apps，就会很熟悉。\n\
  - **Monitor** 允许你查看流程何时运行、流程是否成功完成，并提供解决任何问题的建议。\n- **AI Builder** 链接到 Microsoft\
  \ 人工智能（AI）工具——这里的选择可能非常具体。如果 Microsoft 为你准备了预建解决方案，那么使用它非常值得。但修改它们的选项很窄——在这种情况下，你最好使用本书中的其他\
  \ AI 方法或我们在第 11 章中会涉及的机器学习技术。\n\n顶部还有一些其他菜单项值得探索：\n\n- **Cloud flows** 就是我们将要创建的——它们在线运行，无论你的笔记本电脑是否开机。\n\
  - **Desktop flows** 是我们将在本章后面介绍的扩展。它们更强大（你笔记本电脑上能做的任何事情都可以用桌面流程自动化）和更受限制（你的笔记本电脑需要开机，并且通常由云流程触发）。\n\
  - **Shared with me** 允许你与同事协作和共享流程。请仔细阅读安全警告，如果/当你决定共享流程时。\n\n请注意你正在使用哪个账户（屏幕右上角，图中未显示）——尤其是在使用试用\
  \ Power Automate 账户时，因为使用错误的账户可能会导致问题。\n\n现在我们已经浏览了 Power Automate 屏幕，让我们深入并创建我们的第一个流程。\n\
  \n## 我们的第一个 Power Automate 流程\n\n传统上，我们会从 **Hello World** 示例开始。我们不会这样做，因为我们从 Power\
  \ Automate 的在线版本开始。由于流程托管在云中并旨在在你不在时独立运行，用户界面选项非常有限。在云中运行，即使你可以弹出消息框，谁会看到它呢？\n\n\
  相反，我们将从 *第 6 章* 中已经完成的一个示例开始——从在线 API 获取信息。你会记得这是一个简单的 GET 请求，返回有关托管在 GitHub 上的项目的的信息。我们的流程将有三个步骤：\n\
  \n1. 启动流程的触发器。\n2. HTTP 请求操作，用于获取有关 GitHub 项目的信息。\n3. 创建文件操作，以便我们可以保存结果并稍后查看。\n\n\
  要在 Power Automate 中开始构建此流程，请按照以下步骤操作：\n\n1. 点击 **Create** 按钮。你会看到流程类型的选择，如 *图 8.3*\
  \ 所示：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_213_0.png)\n\n图 8.3 – 创建 Power\
  \ Automate 流程\n\n2. 我们将选择 **Instant cloud flow**，因为它是最简单的——我们的流程将在按钮触碰时启动。\n\n###\
  \ 其他流程类型是什么？\n\n其他流程类型值得以后探索——**Automated cloud flow** 选项由触发器启动，例如收到电子邮件，或新文档更新到\
  \ SharePoint。**Scheduled cloud flow** 每 X 分钟/小时/天运行一次。**Desktop flow** 我们将在本章后面介绍，而\
  \ **Process advisor** 会提出建议以简化更复杂的流程。\n\n3. 选择 **Instant cloud flow** 后，我们将获得不同的手动触发器选择，如图\
  \ 8.4 所示（同样值得在自己的时间里探索）。在这里，我们为流程命名，然后选择 **Manually trigger a flow** 选项，然后点击 **Create**\
  \ 按钮：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_214_0.png)\n\n图 8.4 – 选择如何触发流程\n\
  \n4. Power Automate 将创建我们的流程，并带我们进入主流程编辑屏幕，如图 8.5 所示。我们流程中的第一步（手动触发器）已为我们创建。此屏幕还为我们提供了更改流程名称的选项（如果我们在上一步中没有更改），撤消/重做编辑步骤，保存我们的流程和流程检查器，以及我们稍后会使用的测试按钮。\n\
  \n6. Power Automate 将创建我们的 HTTP 操作。在图 8.7 中，我们已经输入了此操作的设置——不出所料，它们与我们在第 6 章中使用的相同——GET\
  \ 方法和 URI 为 https://api.github.com/repos/OfficeDev/office-js。我们可以留空其他值。\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_216_0.png)\n\
  \n图 8.7 – 流程中的第二步 – HTTP Connector\n\n7. 即使我们的流程现在更长，底部仍会有 New step 选项。点击它，然后搜索来自\
  \ OneDrive 的 Create file 选项。我们这次不会展示搜索过程；如果你有正确的操作，它将具有与图 8.8 相似的图标和外观：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_216_1.png)\n\
  \n图 8.8 – 创建文件的设置\n\n8. 在此操作中，我们选择文件夹路径——点击 Folder Path 字段将让你选择 OneDrive 中已存在的路径。注意，如果你刚刚为\
  \ Power Automate 创建了新用户名，你可能需要先使用此用户名和密码登录 OneDrive。我们选择了通用的 Downloads 文件夹，但任何现有文件夹都可以。\n\
  \n\n\n\n\n9. 在 **File Name** 中输入一个名称——我们选择了 test.json，因为那是我们将要保存的数据的格式。但对于本示例，任何允许的名称都可以。\n\
  \n10. 点击 **File Content** 框，我们会得到动态内容的选项。Power Automate 会根据之前的流程步骤建议值——在本例中，**HTTP**\
  \ 操作返回 **Body**，其中包含它收到的响应。选择它，如图 8.8 所示。\n\n11. 我们新创建的流程应如下图 8.9 所示。点击 **Save**\
  \ 按钮。注意 Power Automate 可能给出的任何警告。\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_217_0.png)\n\
  \n12. 点击屏幕右上角的 **Flow checker** 按钮。我们应该没有警告，但如果有警告，请按照建议解决。\n\n13. 现在，点击 **Test\
  \ Flow** 按钮。右侧会弹出一系列屏幕。由于流程类型，我们唯一的选项是手动测试。点击 **Test**，如图 8.10：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_217_1.png)\n\
  \n14. 运行流程所需的权限列表会出现在右侧。在本例中（如图 8.11），我们已经登录到 OneDrive，因此有权使用此账户。由于我们使用高级功能来简化示例（HTTP\
  \ 连接），如果您未使用企业账户或免费的 Power Automate 试用版，此时会收到警告。\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_218_0.png)\n\
  \n图 8.11 – 检查运行流程的权限\n\n15. 点击 Continue 后，会弹出一条消息，允许您前往 Flow Runs 页面。点击该链接后会显示类似图\
  \ 8.12 的图像。虽然我希望您也能看到 Succeeded 消息，但点击流程的日期可以查看该特定流程运行的更多详细信息。\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_218_1.png)\n\
  \n图 8.12 – 流程运行历史\n\n在流程历史中，如果您的流程在 HTTP 请求上卡住，则说明您使用了错误的 URL——请检查并重试（同时也值得在网页浏览器中检查该\
  \ URL）。\n\n由于添加更多操作到流程的步骤与我们之前的示例相同，我们不会再详细介绍。我们将展示我们要实现的目标流程，以及流程每个步骤的设置。凡是有其他不同之处，我们都会突出显示。其中一个不同之处是，我们需要准备一个\
  \ Excel 表格来输出结果。\n\n## 准备我们的 Excel 输出表格\n\n我们的 Excel 输出表格非常简单，但它会被 Power Automate\
  \ 中的一些操作自动拾取——因此让我们逐步讲解创建过程：\n\n- 1. 首先打开 Excel 并创建一个新的电子表格。\n- 2. 创建两个标题，ID 和 JSON。\n\
  - 3. 选择单元格 A1:B2——然后插入表格。点击 我的表格有标题，然后点击确定以创建表格。\n- 4. 使用 表格设计 菜单，为表格命名，如图 8.14\
  \ 所示：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_220_0.png)\n\n图 8.14 – 用于捕获输出的电子表格及表格\n\
  \n- 5. 将其保存在 OneDrive 中，使用一个您会记住的名称（如 Output.xls）。如果您的机器上正在运行 OneDrive，您可以直接将其保存到\
  \ OneDrive 文件夹中；否则，将其上传到网页版 OneDrive。\n\n## 创建调用决策服务的流程\n\n我们将创建的用于调用决策服务的流程将如下图\
  \ 8.15 所示：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_221_0.png)\n\n让我们逐步讲解创建过程：\n\
  \n- 1. 手动触发操作与之前的操作相同。\n- 2. 创建一个 初始化变量 操作，如图 8.16 所示：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_221_1.png)\n\
  \n- 3. 在此步骤中，**Name** 为 `Payload`，**Type** 为 `String`，**Value** 为我们将传递给决策服务的 JSON。此\
  \ JSON 与我们在 *第 6 章* 和 *第 7 章* 中使用的负载完全相同，因此最好从那里复制，以确保拼写完全正确。\n\n- 4. 添加另一个操作——**Create\
  \ file**，这将为您提供如图 *8.17* 所示的选项屏幕：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_222_0.png)\n\
  \n图 8.17 – 记录我们将要发送的负载\n\n- 5. 这是我们之前示例中使用的同一个 OneDrive 操作——但这次我们在 HTTP 调用之前执行它（确保保存\
  \ `Payload` 变量）。这在我们动态构建 JSON 的未来示例中会很有用，并且有助于检查我们发送给决策服务的内容。\n\n- 6. 我们更新 HTTP\
  \ 调用，如图 *8.18* 所示——注意我们已删除了一些空白字段：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_222_1.png)\n\
  \n图 8.18 – HTTP 调用的设置\n\n- 7. 根据 *图 8.18*，我们的 **Method** 类型现在为 `POST`。**URI** 是我们决策服务的端点（确保空格已转换为\
  \ `%20` 并且决策服务正在运行）。我们的标头按 POST 方法的要求设置，而 **Body** 是我们在流程中前面定义的 `Payload` 变量。\n\n\
  8. 在 HTTP 操作的高级设置中，检查我们未使用任何身份验证。\n\n9. 在 Excel Online（Business）的设置中，添加一行到表格中；它应如下图\
  \ 8.19 所示。确保您使用的是 Excel Business 连接器，因为有一个更简单的 Excel 连接器，选项要少得多：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_223_0.png)\n\
  \n图 8.19 – 向表格添加一行\n\n10. 在此操作中，如图 8.19 所示，选择位置为 OneDrive for Business。选择 OneDrive\
  \ 的文档库选项。文件行上的文件夹图标应允许我们选择之前创建的 output.xlsx 文件。\n\n11. Power Automate 会自动检测此 Excel\
  \ 文档中的表格，这将帮助我们选择表格选项 JSON_Table——即我们之前添加的名称。\n\n12. 从表格中，Power Automate 会自动检测其中的两个列——ID\
  \ 和 JSON。我们将其设置为使用 HTTP 调用的状态代码和 Body 响应进行更新（使用动态内容选项）。\n\n## 运行我们更新的示例\n\n然后我们保存、测试并运行流程，我们的输出表格将被更新，如图\
  \ 8.20 所示：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_223_1.png)\n\n图 8.20 – 表格中的调用结果\n\
  \n正如预期的那样，我们的流程已运行，调用了决策服务，然后将结果附加到我们的 Excel 表格中。尝试在我们刚刚创建的 Power Automate 流程第 2\
  \ 步中设置 Payload 变量的值，以确认服务按预期行为。\n\n虽然这是一个更有用的流程，但值仍然是硬编码的，与本章开头图 8.1 中勾勒的客户服务流程相比，仍然缺少几个步骤。让我们现在修复这个问题。\n\
  \n## 在 Power Automate 中建模我们的客户服务流程\n\n由于客户服务流程收集信息，让我们先来看看 Microsoft Forms。\n\n\
  ## Microsoft Forms 简介\n\nMicrosoft Forms 是一项免费服务，是 Office 在线的一部分。您可能已经使用过它，或类似的服务，如\
  \ Google Forms 或 SurveyMonkey。Forms 可在 https://forms.office.com/ 获取。最好使用与托管 Power\
  \ Automate 流程相同的 Microsoft 账户，这样有助于稍后将它们链接起来。\n\n在此页面上，点击 New Flow 创建新表单。我们将逐步编辑它：\n\
  \n- 1. 表单最初未命名——点击为其命名。\n- 2. 点击 Add New 添加您的第一个（文本）问题。让我们将其命名为 Email。\n- 3. 再次点击\
  \ Add New 添加另一个文本问题。让我们将其命名为 Customer Number。\n- 4. 点击此问题旁边的 … 选项，选择限制，并选择 Number。\n\
  - 5. 点击 Add New 添加一个选择题。添加 US、UK、NL、JN 和 UK 的选项。\n- 6. 在屏幕上，点击此问题旁边的 … 选项。选择将其设为下拉菜单的选项。\n\
  - 7. 在右上角，点击 Preview。我们的表单现在应类似于图 8.21：\n\n\n\n\n## 第8章示例\n\n1. 电子邮件\n\n输入你的答案\n\
  \n2. 客户编号\n\n该值必须是数字\n\n3. 居住国家/地区\n\n选择你的答案\n\n提交\n\n图 8.21 – 设置表单以收集信息\n\n8. 屏幕右上方有一个“发送”按钮。它会提供一个可共享的链接，类似于\
  \ https://forms.office.com/r/ETQ900ed1q7T （你的链接会有所不同）。记下这个链接，因为稍后我们需要用它来触发 Power\
  \ Automate 流。\n\n请注意，我们目前没有将出生日期或其他输入添加到决策服务中，因为我们可以稍后添加。目前，我们希望让示例保持简单。\n\n如果你之前使用过\
  \ Forms，就会知道它会自动捕获响应。我们想做些更具动态性的事情，所以让我们为表单添加一个 Power Automate 流。\n\n## 更新我们的 Power\
  \ Automate 流\n\n我们想要创建的流，模仿了本章开头的客户服务流，如图 8.22 所示。该流与之前步骤相同，但映射到了 Power Automate\
  \ 操作：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_226_0.png)\n\n图 8.22 – 我们将构建的流\n\
  \n该流是我们上一个示例中所用步骤的演进。但由于流开头的触发器不同，我们需要删除手动流程触发器。\n\n要删除先前流中的触发器，请点击现有触发器（第一步，“手动触发流”）边缘的\
  \ ...。选择“删除”。这样就空出了位置以添加替代触发器。\n\n让我们逐步完成更新流的其他步骤：\n\n+   1. 第一步是添加一个替代触发器。搜索 Forms\
  \ 触发器“提交新响应时”，如图 8.23 所示：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_226_1.png)\n\
  \n图 8.23 – 启动流的触发器\n\n+   2. 下拉菜单让我们选择用于触发流的表单 – 选择我们在上一节创建的表单。\n\n+   3. 在此触发器之后立即添加另一个操作\
  \ – **获取响应详细信息**。表单 ID 应为同一个表单，**响应 ID** 可以通过动态内容弹出窗口获取 – 它看起来应该像 *图 8.24*：\n\n\
  ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_227_0.png)\n\n图 8.24 – 获取表单信息的句柄\n\n如果我们忘记这一步，当我们尝试选择值时，表单\
  \ ID 不会作为建议弹出。\n\n+   4. 在此步骤之后立即添加另一个新操作 – **初始化变量** – 如图 *8.25* 所示：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_227_1.png)\n\
  \n图 8.25 – 从表单获取居住国家/地区\n\n+   5. 我们将变量命名为 `Country`，并将其类型设置为 `String`。我们设置的值（使用\
  \ **动态内容** 弹出窗口）是我们表单的 **居住国家/地区**。\n\n+   6. 注意，我们重命名了这个（以及其他操作）的名称，以使内容更清晰 – 你不必这样做，但之后你会庆幸自己这样做了！\n\
  \n+   7. 我们更新初始化负载的步骤，如图 *8.26* 所示。它被重命名为 `Payload_template`。请注意，该值也略有不同 – 在 `Country\
  \ of residence` 字段中有一个 `__cor__` 标记 – 我们稍后会查找并替换这个步骤。这个值没有什么特别之处 – 它只是一些易于理解、但不太可能自然出现在文件中的文本（以防止意外匹配）。\n\
  \n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_228_0.png)\n\n图 8.26 – 设置负载模板\n\n+  \
  \ 8. 添加一个新的 **初始化变量** 操作。现在定义 `Payload` 变量，类型为 `String`，如图 *8.27* 所示：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_228_1.png)\n\
  \n图 8.27 – 使用我们的值更新负载模板\n\n+   9. 你会注意到，这个值由一些我们之前没有遇到的动态内容设置。*图 8.28* 对此进行了详细展示。我们需要选择表达式，因此在\
  \ **表达式** 中输入 `replace(variables('Payload_template'), '__cor__', variables('Country'))`，然后点击\
  \ **更新**。\n\n通过这个流，该函数会查找负载模板中的 __cor__ 值，并用表单中的值替换它。\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_229_0.png)\n\
  \n图 8.28 – 动态表达式的特写\n\n10. 下一步，在发送之前保存负载，让我们能够发现任何错误。这与我们之前的示例类似，如图 8.29 所示。\n\n\
  ![](img/48815d6f06dc8c7aeaa3963d289fb1e7_229_1.png)\n\n图 8.29 – 保存生成的负载\n\n11. 接下来的步骤（执行实际的\
  \ HTTP 调用并将返回的值保存到 Excel 中）与我们之前的流相同 – 你可以通过查看图 8.18 和图 8.19 来确认。\n\n12. 我们在流的末尾添加一个新步骤\
  \ – 发送电子邮件。确保使用 Outlook V2 操作，因为还有其他可用的连接器。收件人框使用表单中提供的电子邮件地址（通过动态内容值查找）。正文可以包含你想要的任何文本，并包含\
  \ HTTP 正文值，因为我们将通过电子邮件将结果发送给提供数据的人 – 如图 8.30 所示：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_230_0.png)\n\
  \n图 8.30 – 通过电子邮件发送产品推荐的操作\n\n你会注意到，为了简洁，我们只使用了表单中的 `email` 地址和 `Country` 值。但重复*步骤\
  \ 5 到 8* 可以让我们在调用决策服务时添加其他表单值。\n\n## 运行我们的客户服务 Power Automate 流\n\n启动我们的流甚至比之前的示例更简单\
  \ – 使用我们之前记下的可共享链接进入表单（我们的链接是 `https://forms.office.com/r/ETQ900ed1c7T`，但你的链接会略有不同）。在表单中输入一些值，然后点击\
  \ **提交**。该流会自动运行，并将包含决策服务建议的电子邮件发送出去。\n\n如果你返回流并点击 **测试**，你会看到现在有另一个运行流的选项，如图 *8.31*\
  \ 所示：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_230_1.png)\n\n图 8.31 – 其他测试流选项\n\
  \n新选项允许你重放刚刚提交的表单 – 这不仅节省时间，还能确保每次运行都使用相同的值进行测试。\n\n在结束本章的流之前，值得注意 **流运行** 页面，它可以让你查看每个\
  \ Power Automate 步骤的结果。它还会让你了解每个步骤完成所需的时间。如果你的流在 `Http Request` 上停滞了几秒钟，很可能是 `url`\
  \ 值已过期，你可能需要刷新这些值。\n\n## 扩展此示例的建议\n\n我们的示例非常清晰，但如果你决定将表单中的其他值添加到决策服务调用中，你会很快发现这个示例变得繁琐——需要创建多个只使用一次的变量，以及多个查找/替换步骤。\n\
  \n你可能需要在自己的流中进一步演进这些步骤——以下方法值得考虑：\n\n- 合并一些步骤。例如，直接在替换函数中使用表单值，而无需先创建变量。\n- 使用 `concat`\
  \ 表达式一次性构建 JSON 负载——将所有变量和 JSON 表达式的片段放在一行中。\n- 使用外部脚本（如 **JavaScript** 或 **Office\
  \ Scripts**）构建 JSON 负载。\n- 在 Excel 中将 JSON 计算为表达式，然后在将 JSON 传递给决策服务之前读回该值。这样做的好处是最容易审查和更新。\n\
  \n> **为什么我们不在流中通过 Office Scripts 调用决策服务？**\n> 我们刚刚提到 Power Automate 流可以调用 Office\
  \ Scripts。那么为什么不使用*第 7 章*中的技术通过这些脚本调用决策服务呢？\n> \n> 原因是安全模型限制了脚本在流中能做什么。这并不妨碍我们使用\
  \ Office 脚本来处理数据（例如，创建负载）。但进行外部调用的唯一方式是通过 HTTP 操作，就像我们在示例中所做的那样。\n\n在我们的流中，我们发送相同的电子邮件内容，依靠决策服务返回的消息来高亮任何健康警告。实际上，你可能会在流中添加一个测试和一个分支操作，根据产品推荐结果发送不同的电子邮件。\n\
  \n我们不会详细讨论这些技巧，但你可以探索它们，以此为基础扩展本章所示的关键步骤。如果你想深入探索 Power Automate，Packt 作者 *Aaron\
  \ Guillemette* 的这本书是一个很好的起点：https://www.packtpub.com/product/workflow-automation-with-microsoft-power-automate/\n\
  \n\n\n\n## 其他工作流 – Kogito 业务自动化和 Power Automate Desktop\n\n本章之所以聚焦于 Power Automate\
  \ 是有原因的，因为它是使用最广泛、最适合（Power）用户的友好型工作流工具。但你很可能会遇到另外两种工作流工具——Power Automate Desktop\
  \ 以及随 Kogito 业务自动化而来的工作流。\n\n### Power Automate Desktop\n\n你（简要地）见过 Power Automate\
  \ 的桌面版，因为在图 8.3 中创建新的云流时它是一个选项。如果你创建了一个桌面流，你会被提示安装桌面工具（尽管它已预装在 Windows 11 中；请参阅\
  \ Power Automate Desktop 文档了解更多详情）。你会看到如图 8.32 所示的启动屏幕：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_232_0.png)\n\
  \n图 8.32 -- Power Automate Desktop\n\n使用 Power Automate Desktop 的许多概念与使用云版本相似。Power\
  \ Automate Desktop 也有 HTTP 连接器，且对所有用户开放，无任何高级限制。虽然这为你提供了将流链接到决策服务的额外选项，但也带来了一些权衡：\n\
  \n- 桌面流中的操作范围非常广泛——基本上使用笔记本电脑能做到的事情几乎都可以通过桌面流完成。\n- 桌面流仅在用户登录时运行（即使机器已锁定）。云流则全天候运行（并且可以被触发）。\n\
  - 桌面流本质上作为云流的子流运行。它们可以手动触发以进行测试。\n- 将云流和桌面流链接起来是一项高级功能，并非所有用户都可用，这可能会限制你日常的使用方式。\n\
  \n非常值得探索 Power Automate Desktop，以了解你如何在日常工作中使用它。但我们将在本章结束时快速了解一下你可能暂时不会使用的另一个工作流——Kogito\
  \ 业务自动化。\n\n### 快速了解 Kogito 业务自动化\n\n早在第 3 章中，我们在图 3.1 中瞥见了创建工作流的选项。当时，我们专注于创建决策服务，但可能值得返回该屏幕并创建示例工作流，如图\
  \ 8.33 所示：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_233_0.png)\n\n图 8.33 – Kogito\
  \ 业务自动化示例\n\n由于此工作流示例是图形化的，很容易看出它处理的是商务旅客预订。更棒的是，由于它是 Kogito 的一部分，Process Traveler\
  \ 步骤可将业务规则无缝集成到工作流中。正如你所料，Kogito 工具遵循行业标准——因此你可以使用 Kogito 基于 BPMN 开发流程服务。\n\n然而，虽然\
  \ Kogito 工作流对业务用户友好，但其工具（目前）并不像业务规则和决策服务那样独立。例如，在 KIE 沙箱中执行 Kogito 工作流流程的选项更为有限。\n\
  \n在许多情况下，我们会推荐使用 Kogito 工作流业务自动化（例如，如果你是 Java 开发者，或你与拥有支持技能的团队合作）。但作为一位寻求与 Microsoft\
  \ Office 高度集成的工具的 Excel Power 用户，Power Automate 对于初学者来说可能是一个更好的选择。\n\n### 总结\n\n\
  我们在本章开始时设定了期望，即虽然我们会介绍 Power Automate，但我们将重点放在如何将 Excel 链接到决策服务，作为完整端到端流程的一部分。\n\
  \n本章我们所涵盖的内容是工作流，以及为什么我们将 Power Automate 作为本书的工作流工具。然后我们转向如何从 Power Automate 调用业务规则和决策服务。最后，我们在\
  \ Power Automate 中构建了完整的客户服务流程，并查看了其他工作流工具，如 Power Automate Desktop 和 Kogito 业务自动化。\n\
  \n本章是关于将 Excel 链接到决策服务的 Microsoft 工具的第三章（共三章）——不仅使用 Power Automate，还包括 Power Query、VBA\
  \ 以及 Script Lab/Office Scripts 等其他选项。鉴于这些工具的强大功能，值得进一步探索。\n\n现在我们已将 Excel 链接到决策服务，我们在下一章中的注意力将集中在如何更充分地利用它。我们首先探索\
  \ FEEL 表达式语言以编写更强大的规则，并使用测试来确保规则确实按我们期望的方式运行。\n\n### 高级表达式、决策模型和测试\n\n如果你在听取了我们在*第\
  \ 3 章和第 4 章*之后的鼓励后，可能已经尝试构建自己的决策模型。希望你随后在*第 6、7 和 8 章*中探索了将模型链接到 Excel 的不同方式，并找到了最适合你的方法。但随着模型的复杂性增加，你可能会发现事情并不像你希望的那样顺利。\n\
  \n本章旨在解决这个问题——我们将解释 FEEL 表达式语言的更多功能，以使你的业务规则更具表达力。我们将介绍如何构建决策模型以降低其复杂性。我们将介绍测试，以及为什么让你自己先破坏规则总比让别人先破坏要好。在此过程中，我们将向你展示\
  \ KIE 沙箱之外的编辑工具，让你了解 KIE 生态系统内工具的强大之处。\n\n本章将涵盖以下主要主题：\n\n- 先决条件和预读材料\n- DMN 和 FEEL\
  \ 表达式——扩展你已知的知识\n- 动态列表、上下文和关系\n- 你可以在决策模型中使用 Power FX 表达式吗？\n- 关于构建和编辑决策模型的更多内容\n\
  - 帮助构建模型的常见决策模式\n- 测试和破坏你的规则（在别人之前）\n\n#### 先决条件和预读材料\n\n正如你所期望的，对于更高级的章节，有助于你阅读过本书的前几部分！我们将要涵盖的大部分内容都建立在*第\
  \ 3 章和第 4 章*的基础上。虽然我们会快速复习，但你需要访问运行扩展服务的 KIE 沙箱，如*第 3 章*所述。\n\n我们之前推荐过关于**决策模型与标注（DMN）**和\
  \ FEEL 语言的额外阅读。与其涵盖每个函数，本章将重点关注那些对 Excel Power 用户来说可能不那么自然的领域（例如列表）。我们假设你已快速浏览了以下文档：\n\
  \n- `https://kiegroup.github.io/dmn-feel-handbook/`\n- `https://learn-dmn-in-15-minutes.com/`\n\
  - `https://www.drools.org/learn/documentation.html` – 选择最新的 Drools 文档和用户指南\n\n像之前各章一样，示例可从本书的\
  \ GitHub 站点下载，地址为 `https://github.com/PacktPublishing/AI-and-Business-Rules-for-Excel-Power-Users`。\n\
  \n你不需要将这些参考资料倒背如流——知道它们在需要时可以查阅特定工具包中的函数即可。让我们先回顾一下我们已知的知识。\n\n#### DMN 和 FEEL 表达式——扩展你所知的知识\n\
  \n在*第 3 章和第 4 章*中，我们涵盖了 FEEL 表达式语言的许多关键点：\n\n- 我们看到 FEEL 允许你编写框式表达式（就像你在 Excel 公式框中输入的那样）。你可以在许多不同的地方使用\
  \ FEEL 表达式——从决策节点到列表再到决策表。\n- 一种 FEEL 表达式是文本和字符串操作——我们用它创建了 `Hello [your name]`\
  \ 示例。如果你阅读过参考文档，你会看到 Excel 中大多数文本函数在 FEEL 中都有等价物。这包括将字符串转换为大写或小写、从文本开头、中间或结尾提取文本、替换值、测试文本是否以特定值开头或结尾，以及拆分或合并文本。\n\
  - 我们使用变量作为不同值的占位符。查看参考文档，你会看到用于操作布尔值和数字的函数与 Excel 非常相似。我们将在稍后更详细地介绍日期和时间处理，因为虽然概念很熟悉，但函数的格式略有不同。\n\
  \n> **三种类型的布尔值？**\n> \n> 你会期望布尔值评估为 True 或 False。然而，FEEL 允许第三个值，Null（或 *空*），表示未显式分配值。\n\
  \n\n\n\n\n- 自定义数据类型允许我们使用基本构建块（例如文本、数字和布尔值）构建容器来保存我们的数据。我们还研究了数据的约束，以限制可使用的值。\n\
  - 列表可能看起来很熟悉（因为它们就像一系列单元格）。我们将介绍更多高级函数来操作它们，从而扩展这一概念。我们还将介绍用于测试范围的函数（想想列表，但具有顺序值——例如，`[1..10]`）。\n\
  - 与列表相关的是 **上下文**（也称为 **映射** 或 **关系**），它就像一组键值对——稍后会详细介绍，因为虽然它们易于使用，但对于 Excel 高级用户来说，这个概念可能还比较新。\n\
  - 我们看到了用于分支的 `if... then` 表达式，很快将介绍用于对列表数据进行操作的循环。\n- 我们之前涵盖了 DMN 中的所有不同节点类型（文本、决策节点，包括决策表、输入数据和函数），并将返回调用，以便更好地组织您的决策模型。\n\
  \n在我们（重新）开始之前，有几个 FEEL 语言基础知识值得记住：\n\n- FEEL 设计为 **无副作用**——评估表达式不应更改传递给该表达式的值。这与（例如）Visual\
  \ Basic 代码不同，后者可能会更新 Excel 中单元格的值或颜色。\n- FEEL 设计为 **可读性强**，甚至允许在变量和函数名中使用空格。如果您使用过另一种计算机语言（例如\
  \ JavaScript），您可能会觉得这很奇怪。\n- 因此，值得记住的是，FEEL 会将任何未加引号的文本评估为变量名。`\"Friday\"`（带引号）将匹配该确切文本，而\
  \ `Friday`（不带引号）如果没有定义该名称的变量，KIE 会抱怨。两者（带或不带引号）都是 **FEEL 字面量**——KIE 可以将其评估为值的表达式。\n\
  \n我们将开始探索 FEEL 语言中的列表——这是一个功能强大但易于使用的概念。但由于列表的工作方式与 Excel 略有不同，因此值得查看一些更深入的示例。\n\
  \n### 动态列表、上下文和关系\n\n您可能还记得在 *第 4 章* 中，我们通过使用 `List` 类型的决策节点图形化地创建了 `List`。如果您想刷新记忆，请查看\
  \ *图 4.25*——它非常清晰地展示了我们要查找的健康问题。但列表比这动态得多。我们已经说过，我们可以在任何地方使用 FEEL 表达式——这也包括在列表内部。例如，*图\
  \ 9.1* 中的列表是有效的语法。此示例可以从示例站点 (`https://github.com/PacktPublishing/AI-and-Business-Rules-for-Excel-Power-Users`)\
  \ 下载为 `c-09-dynamic-lists.dmn`。\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_238_0.png)\n\
  \n图 9.1 – 动态生成我们的列表值\n\n我们已操作该图，以便在一个图片中显示主图、我们的列表值以及输入/输出。您需要在屏幕上按 **Edit** 节点和\
  \ **Run** 按钮来查看类似结果。\n\n> **FEEL 中的日期和时间函数**\n> \n> 正如您所期望的，FEEL 参考列出了许多日期和时间处理函数。我们在此示例中使用了\
  \ `now()` 函数，大多数日期函数的行为与 Excel 中的等效函数类似。\n> \n> FEEL 指南对日期提供了很好的概述——即使它分散在指南的多个部分中。值得强调的一点是\
  \ `.` 语法——例如，表达式 `(2023,12,20).day` 函数将返回 20，类似地还有 `.year`、`.month` 等选项。\n> \n>\
  \ 您会注意到，对国际日期的支持不如 Excel  extensive——例如，它始终以年/月/日顺序列出——date(\"2023-12-20\") 是 2023\
  \ 年 12 月 20 日。请注意，我们如何使用字符串而不是数字创建了相同的日期。还有用于 **时间**、**日期和时间** 以及 **持续时间** 的类似构造函数选项。\n\
  \n让我们从左到右查看 *图 9.1* 中的示例：\n\n- 我们有一个非常简单的决策模型——只有一个名为 **Some Input** 的输入。它将值输入到\
  \ `list` 类型的决策节点（我们称之为 `Dynamic List`）。\n- 我们的列表有四个值。其中第一个是静态文本。第二个是今天的日期。第三个是我们输入值转换为大写。最后一个项目是我们计算的数字。\n\
  - 右侧是输入和输出。我们传入一个简单的值（`hello`）并得到四个值的列表返回——我们可以通过它们编号为 **0-3** 来判断它是列表。虽然这在脚本语言中很常见，但与\
  \ Excel 不同，Excel 从 1 开始计数行。\n\n值得下载示例并尝试操作以进一步探索。\n\n### 转换函数\n\n您会注意到我们的示例使用了 string()\
  \ 函数将当前日期转换为字符串并将 Some Input 传递为字符串——FEEL 不会自动转换值的方式像 Excel 那样。\n\n还有用于转换为数字和日期的等效函数，有关如何使用它们的更多信息可在\
  \ FEEL 参考指南中找到。\n\n虽然此列表中的项目是动态生成的，但它将始终具有相同的四个项目且顺序相同。我们可以用列表做一些更动态的事情。请看图 9.2，也可下载为\
  \ 09 Step by Step Context.dmn。\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_239_0.png)\n\
  \n图 9.2 – 更动态的列表\n\n此示例的决策模型再次很简单——输入节点馈送到决策节点——因此我们没有显示它。我们确实编辑了 Some Input 节点的属性以指定只允许数字，这意味着我们不必在函数中进行转换。如果您尝试自己创建此示例，值得注意的是，表格右列中的每个框都是字面表达式，并且名称应保持一致。例如，名称\
  \ Some Input 中包含空格，因此所有引用它的表达式也应包含该空格。\n\n我们将决策节点设置为 Context 类型。虽然我们将在本章后面看到另一种使用上下文的方法，但此示例允许我们指定逐步说明，在每个步骤中操作列表(s)。每个步骤都是字面表达式：\n\
  \n- 1. 我们使用 FEEL 语法而不是图形格式创建 `BaseList`——`[30,10,20]`。\n- 2. 我们创建另一个列表 `AddedList`，将\
  \ `BaseList` 与我们作为 **Some Input** 传入的数字结合。\n- 3. 我们创建第三个列表 `SortedList`，并在其中对我们的列表进行排序。请注意\
  \ `sort()` 函数采用命名参数并允许我们指定排序方式，这使其非常强大。\n- 4. 我们的最后一行指定我们想要返回的值（`SortedList`）。更改此值将允许我们查看我们创建的其他列表。清除此单元格（右键单击以获取菜单选项来执行此操作）将返回我们创建的所有三个列表。\n\
  \n在 *图 9.2* 中显示的示例中，我们传入的值为 25，它被添加到列表中并排序，给出输出列表 `[10,20,25,30]`。请注意使用方括号和逗号的语法，这使您能够以非常紧凑的形式编写列表表达式。\n\
  \n### 有关使用 FEEL 表达式操作列表的更多信息\n\n现在您已经了解了列表的基础知识及其语法，其余函数应该会更容易理解。我们将快速浏览一下——很可能，您只需要知道这些函数存在。当您需要详细使用它们时，您可以使用前面提到的\
  \ FEEL 指南找到确切的参数：\n\n- 我们在示例中看到了 `sort` 和 `append` 函数。`reverse` 和 `remove` 是它们的相反操作。\n\
  - Max、Mean、Min、Sum 和 Count 的工作方式与您预期的基本相同。\n- `distinct values()` 从列表中删除重复项——例如，`distinct\
  \ values([\"One\", \"One\", \"Two\"])` 将返回一个更短的无重复列表，`[\"One\", \"Two\"]`。\n- `index\
  \ of()` 返回项目在列表中的位置。例如，`index of([\"One\", \"Two\", \"Three\", \"Four\"], \"Four\"\
  )` 将返回数字 4。`contains` 类似，但根据列表是否包含该值返回 `true` 或 `false`。\n\n列表也可以包含列表——虽然这是一个简单的概念，但我们能给出的任何示例都会很快变得复杂！我们只提到\
  \ `flatten()` 将合并所有子列表为一个大列表。`concatenate()` 类似，但为您提供了对创建列表顺序的稍多控制。`sublist()` 允许您再次将此列表切分为更短的列表。\n\
  \n\n\n\n\n从我们在 *第 4 章* 中的示例中，你可能注意到我们的自定义数据类型可以包含列表。我们的 `Customer` 数据类型就包含了一个之前的订单列表。只是为了展示列表的强大功能，相反的情况也是成立的——我们可以有一个客户列表，每个客户都由\
  \ `Customer` 自定义类型表示。\n\n### Lambda 函数\n\n最近添加到 Excel 中的一项强大功能是 **Lambda 函数**。基本上，这些是我们可以在周围传递的函数，与我们使用变量或单元格引用时的方式类似。\n\
  \n类似的函数在 FEEL 表达式中已经存在。我们在 *图 9.2* 中看到了一个 Lambda 函数的例子——`sort()` 命令接受了一个命名参数 `precedes`，它被定义为\
  \ `function(x,y) x<y`。虽然我们在此案例中定义的排序顺序很简单，但它确实展示了我们能多大程度地自定义排序算法。\n\n还有另外三个列表函数以类似的方式运行——请记住，这些是应用于整个列表的。对于以下示例，我们将创建\
  \ `mylist`，一个数字列表——`[1,2,3,4,5]`：\n\n- `for i in mylist return i * 2` 将返回 `[2,4,6,8,10]`\n\
  - `some i in mylist satisfies i > 4` 将返回 true，因为存在一个值为 5 的值满足条件\n- `every i in mylist\
  \ satisfies i > 4` 将返回 false，因为只有其中一个（而非全部）列表元素满足条件\n\n列表是 FEEL 表达式语言的基本构建块，许多与关系和上下文相关的函数都会返回一个列表。我们很快就会查看这些内容，但在那之前，我们先来看看范围，它们看起来与列表相似，即使它们解决的是略有不同的问题。\n\
  \n### 范围而非顺序列表\n\n在我们之前的示例中，我们本可以把列表定义为 `[1..5]`——它仍然包含相同的 5 个数字，而且输入起来更短一些。这种范围语法对于更长的数字序列来说更简洁，例如\
  \ `[1..100]`。\n\n尽管语法相似，范围并不能总是直接替换列表。在实践中，你会以不同的方式使用范围——更像 Venn 图，其中你关注的是范围之间的重叠。例如，`overlaps(\
  \ [1..5], [3..8] )` 返回 true，因为两个范围都有 3、4 和 5 共同。\n\n还有几个相关的函数可以测试一个范围是否在另一个范围之前（`before()`）或之后（`after()`），一个范围是否完全包含（`includes()`）另一个范围，或者一个范围的开始是否与另一个范围的开始或结束匹配。\n\
  \n阅读范围示例时，请注意两种不同类型的括号。(1 .. 10) 等价于 [2 .. 9]——圆括号语法会排除给定数字，而方括号则包含它们。两个范围都包含 2、3、4、5、6、7、8\
  \ 和 9。\n\n范围和列表都很好，但可能包含没有意义的值。让我们看看关系和上下文，它们解决了这个问题。\n\n### 关系 – 信息表\n\n请看图 9.3\
  \ 中的关系，我们将在本章后面的图形上下文部分将其构建到物料清单示例中。\n\n#### 产品详情（关系）\n\n| # | Name (string) | Weight\
  \ (number) | Grams of Cocoa (number) | Grams of Sugar (number) | Grams Milk (number)\
  \ |\n|---|---|---|---|---|---|\n| 1 | \"Silk Tray\" | 400 | 150 | 150 | 90 |\n|\
  \ 2 | \"Crunch\" | 75 | 10 | 60 | 5 |\n\n图 9.3 – 显示我们不同产品的配料的关系\n\n即使没有我们解释，你也能猜到这个值表显示了进入我们产品的配料。它比简单的列表更具表现力和结构化。\n\
  \n在 KIE 沙盒中构建此关系很简单——我们创建一个类型为 Relation 的决策节点，然后添加所需的行和列。设置每列的数据类型也很重要。在创建此表时，我们将每个框设置为字面值——任何\
  \ FEEL 表达式都是有效的（不仅仅是此处显示的静态值）。而且虽然我们保持了此示例的简单性，但可以在框内表达式中嵌套其他表达式（例如，返回每个产品中包含的过敏原列表）。\n\
  \n此关系表可作为 09 Bill of Materials.dmn 示例的一部分从本书的示例站点下载。\n\n现在我们已将值定义为关系表，如何引用它们？语法很直接，并且以下\
  \ FEEL 表达式引用图 9.3 中的表：\n\n- Product Details.Name 返回一个列表，其中包含 Name 列的值，[Silk Tray,\
  \ Crunch]。\n- `Product Details[1]` 返回表中的第一行作为一个 **context**（更多内容见下一节）——一组键值对，例如\
  \ `{Name : \"Silk Tray\", Weight : 400, Grams of Cocoa: 150 }`。\n- `Product [Name\
  \ = \"Crunch\"] .Weight` 给出表中单个框的值——在本例中为 75。\n- `Product .Weight [2]` 是使用行号的替代语法。在本例中，它也引用\
  \ Crunch 棒的重量（因此返回相同的值——75）。\n- `Product [Weight>25] .Name` 是 **filtering** 的示例——更复杂的选择，将返回\
  \ [\"Silk Tray\", \"Crunch\"] 的列表，因为两者重量都大于此值。\n\n### 两种常见的数据模式\n\n很可能这些产品数据将在许多不同的决策模型中使用。一种常见模式是一次性定义关系表，然后将其包含在需要它的模型中——更多内容见\
  \ *链接决策模型* 部分。\n\n另一种常见的数据模式是从外部数据库或 Excel 文件读取这些值。我们的 `Invocation` 节点也可以读取几乎任何数据源。但由于它使用\
  \ Java 代码来实现，因此超出了本书的范围。更多细节可在 KIE 文档 https://docs.kogito.kie.org/latest/html_single/#_kie_extended_functions\
  \ 中找到。\n\n关系非常适合 largely 静态且不经常更改的数据。如果我们想要类似表格的布局，但具有列表的动态特性，我们需要查看 **contexts**。\n\
  \n### 动态上下文\n\n我们已经看到，前一行中的 `Product Details[1]` 表达式返回了一个上下文——在该情况下，是表格中一行 `{Name\
  \ : \"Silk Tray\", Weight : 400, Grams of Cocoa: 150 }`。注意我们在 FEEL 表达式中创建上下文时可使用的语法：\n\
  \n- 使用大括号打开和关闭\n- 使用逗号分隔项目\n- 内容是一组 `key:value` 对\n\n如果你以前编程过，你可能在 *map* 或 *dictionary*\
  \ 的名称下遇到过上下文——两者可能更具描述性，暗示一旦我们知道键，就可以使用它来查找与其关联的值。\n\n例如，如果我们将前面的上下文存储在 `myContext`\
  \ 变量中，`get value( myContext, \"Weight\" )` 表达式将返回 400 的值。\n\n使上下文更强大的原因是添加值很容易。例如，`context\
  \ put (myContext, \"Raising Agent\", 1)` 将把该项目添加到我们的配料列表中。\n\n虽然 FEEL 手册中完整记录了上下文函数的列表，但值得重点介绍\
  \ `context.merge()`，它允许我们合并上下文，以及 `context.get entries ()`，它返回上下文中所有值的列表。\n\n还有几种其他图形化创建上下文的方法值得探索。\n\
  \n### 图形上下文\n\n图形上下文允许我们以更直观的格式定义上下文，这对于让经验不足的同事理解我们的模型在做什么很有用。记住我们在图 9.2 中遇到了上下文的另一种用法。在那个示例中，我们使用\
  \ FEEL 表达式上下文逐步生成值，并使用 `result` 语句仅传回最终值。\n\n如果我们删除或清除最终的 `result` 语句，所有生成的 values\
  \ 都将作为一组 `key:value` 对返回。我们将通过一个示例来演示这一点，我们将在本章剩余部分构建它——物料清单决策模型。这在图 9.4 中显示，可从本书的\
  \ GitHub 仓库下载为 `09 Bill of Materials.dmn`。\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_244_0.png)\n\
  \n图 9.4 – 我们的物料清单决策服务\n\n此决策模型有两个输入：`Qty`（Number）和 `Product`（String）。第三个节点 `Product\
  \ Details` 我们之前见过——它是一个类型为 `Relation` 的决策节点，保存每个产品的配料信息。\n\n\n\n\n\n这三者都汇入了一个 Context\
  \ 类型的决策节点，其详细内容在图 9.5 中显示。\n\n### Bill of Materials (Context)\n\n| # | Bill of Materials\
  \ (Any) |\n| 1 | Name (string) | Product |\n| 2 | Grams of Cocoa in Product (number)\
  \ | Product Details[Name = Product].Grams of Cocoa |\n| 3 | Grams of Cocoa in Order\
  \ (number) | Qty*Grams of Cocoa in Product |\n|  | <result> | Select expression\
  \ |\n\n图 9.5 – 一个图形化上下文\n\n创建此上下文与之前类似——我们添加了多行，第一列的键相同，并使用字面表达式给出值。像之前一样，每一行都可以基于前一行——因此我们先指定产品名称，然后使用产品名称在包含所有产品详细信息的关联或表中查找值。最后，我们将输入的数量乘以所需的可可克数，以计算制造此订单所需的总可可量。\n\
  \n请注意没有指定结果——因此在运行时，所有值都将被返回，而不仅仅是单个结果。结果将以键值对的形式呈现——Name : Some-product-name。\n\
  \n我们可以通过在 KIE 沙箱中运行此模型来证明这一点，在那里我们将得到如图 9.6 所示的结果：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_245_0.png)\n\
  \n图 9.6 – 我们上下文的输出\n\n这里，我们输入了 Silk Tray 的数量——这是一种较重的产品，含有大量巧克力，因此用 18.75 kg 的可可来制造它也就不足为奇了。KIE\
  \ 沙箱以清晰的 key:value 格式显示上下文——将其与图 9.1 中的列表进行比较，后者具有类似的格式，但每个值旁边是数字而不是键。\n\n### More\
  \ reading on FEEL functions\n\n这对于一本专注于 Red Hat 和 IBM 的 KIE 的书籍来说可能令人惊讶——但我也会建议查看来自\
  \ Oracle、Trisotech 和 Camunda 等其他厂商的 FEEL 指南。\n\n由于 FEEL 是一个标准，他们所说的大部分内容都适用于 KIE——并且每个都从略微不同的角度解释概念。这是一种很好的方式，如果你在任何领域遇到困难，可以帮助你。\n\
  \n本节重点强调了 FEEL 与 Excel 函数之间的差异，逐步介绍了 Excel 用户可能难以理解的某些领域。最好的学习方式是深入实践，尝试为你的组织建模一些决策。\n\
  \n在离开函数之前，我们将查看另一种表达式语言——Power FX。\n\n### Using Power FX expressions in decision\
  \ models\n\n**Power FX** 是微软的一种低代码表达式语言，其目标与 FEEL 并无太大差异。大致来说，如果你能取你在 Excel 中使用的公式，并删除对单元格的引用，使其不再绑定到电子表格，你就会得到接近\
  \ Power FX 语言的东西。这意味着你可以在 Power Apps 中使用 Power FX 来构建移动应用程序，并且语法越来越多地出现在 Power Automate\
  \ 和其他 Microsoft 平台中。有关该语言的更多详细信息请见 https://learn.microsoft.com/en-us/power-platform/power-fx/overview。\n\
  \nPower FX 比 FEEL 更进一步——而 FEEL 是为无副作用而编写的，Power FX 完全可以产生影响（例如，更新单元格值或更改范围的颜色）。Power\
  \ FX 还可以与比 FEEL 更广泛的系统集成，而 FEEL 专注于决策模型。\n\n在 KIE 中使用 Power FX 表达式目前是一个实验性功能——正如团队在以下帖子中所述：https://blog.kie.org/2022/03/using-javascript-and-power-fx-with-dmn.html。\n\
  \n到目前为止，本章中我们专注于可在模型中使用的表达式语言。让我们更广泛地看看设计和构建决策模型的一些更高级功能。\n\n### More on building\
  \ and editing decision models\n\n在之前的章节中，我们研究了构建决策模型，并通过探索 FEEL 表达式语言扩展了这一知识。本节将通过研究最佳实践来扩展我们对决策模型的知识。\n\
  \n在进入更复杂的决策模型之前，值得先了解一下 KIE Sandbox 编辑器中可用的键盘快捷键——我们在表中重点介绍了最有用的快捷键：\n\n| Key |\
  \ What it does |\n|---|---|\n| *Esc* | Unselect the current selection |\n| *Delete/backspace*\
  \ | Delete the current selection |\n| *Ctrl + C* | Copy |\n| *Ctrl + V* | Paste\
  \ |\n| *Ctrl + X* | Cut |\n| *Ctrl + Z* | Undo the last edit |\n| *Shift + Ctrl\
  \ Z* | Redo the last edit |\n| *Shift + Up arrow (or another arrow)* | Slowly move\
  \ the selection up (or in another direction) |\n| *Ctrl + Up arrow (or another arrow)*\
  \ | Quickly move the selection up (or in another direction) |\n| *Alt (hold) and\
  \ drag the mouse* | Pan |\n| *Ctrl (hold) and drag the mouse* | Zoom |\n| *Shift\
  \ + /* | Show the full list of keyboard shortcuts |\n\n表 9.1 – KIE 沙箱中的键盘快捷键\n\n\
  除了这些键盘快捷键之外，还有几种其他编辑方法也很有用：\n\n- 虽然 KIE Sandbox 编辑器非常好用，但有时它会不同步（尤其是在你的笔记本电脑休眠时）。刷新网页（并相信模型已保存到本地浏览器存储中）可以解决许多问题。\n\
  - 在浏览器沙箱中工作很棒，但在编辑标签和阅读文档标签之间切换可能会令人困惑。在你的 PC 上安装第二个浏览器，一个用于每个用途，是减少混淆的一个简单技巧。\n\
  - 与其他建议相比，这很微不足道，但你可以弯曲图表中的箭头，使你的图表更整洁，更容易被他人理解。\n- DMN 标准将决策模型的图形和 XML 版本视为同等重要。可以直接编辑模型的\
  \ XML（例如，使用本章后面将介绍的 VS Code 编辑器）。虽然这非常强大（例如，在决策模型之间复制粘贴），但也很容易破坏东西。因此，请确保先保存备份副本（到\
  \ GitHub）。\n\n到目前为止，我们一直专注于决策模型的各个元素，让我们谈谈优雅的决策模型——使用通用模式使用户更容易理解你的模型。\n\n### Common\
  \ decision patterns\n\n如果你创建了大量电子表格，你可能会发现自己一次又一次地重复常见的模式。这可能是将说明或顶级数据放在电子表格的第一页。也可能是包含复杂公式的隐藏（或锁定）工作表。或者可能是旁边显示图表的透视表，以便人们可以快速概览或深入细节。\n\
  \n我们重复这些模式并非出于懒惰，尽管节省时间是件好事。我们会重复这些模式，因为它们有效，并且熟悉的模式更容易被人们理解。程序员称这些可重复的解决方案为 **设计模式**，并积极在问题解决过程中应用他们之前使用过的模式。\n\
  \n在决策模型中，你也会发现自己一次又一次地使用可重复的模式。其中最重要的是从一个决策模型调用另一个决策模型——因为这使我们能够将模型分解为可重用、更重要的是可测试的块。我们将在本章后面的部分专门讨论这两个概念。\n\
  \n在此之前，你可能会注意到，你已经（无意中）在自己的模型中创建了我们即将提到的模式。但是，由于模式旨在在团队之间和团队内部提供共同语言，我使用的是 Trisotech\
  \ 的 Denis Gagne 和 KIE 团队的 Matteo Mortari 使用的模式名称：\n\n- **Scoring** – 我们基于规则组合构建一个值——根据不同规则匹配情况加减分数。考试是经典的评分系统，但银行使用的信用评级或航空公司乘客筛查（用于额外安全检查）也是类似的例子。\n\
  - **Classification** 可以基于这些分数——例如，基于纯百分比的考试分数，其中 A 等级高于 85% 分数。这可能更微妙，分类会改变，使得只有前\
  \ 10 名的人获得此等级。或者分类可以在多个值上进行——就像我们在 *第 4 章* 中提到的产品推荐服务，它考虑了居住国家。\n- **Ranking** –\
  \ 真实的在线产品推荐服务不会只建议一个值。例如，亚马逊会建议最多 10 个产品（在数百万个产品中），它认为你最有可能购买。你可以通过基于分数排序来实现这一点，也许会根据不同的分类规则进行修改。\n\
  \n最后一种模式更多是问题的框架——模型试图回答什么问题？做得正确的话，它将使理解和设计决策服务变得容易得多。\n\n本节的关键收获是，其他人很可能遇到过与你非常相似的问题，即使他们在不同的领域或行业工作。留意可以重用的常见模式——一个良好的起点是\
  \ Gange 和 Mortari 关于该主题的演示文稿。SlideShare 链接是 https://www.slideshare.net/dgagne/introduction-to-some-dmn-patterns-and-their-value，KIE\
  \ 博客上的帖子中链接了 YouTube 视频。\n\n\n\n\n### 另一种模式——将决策模型链接在一起\n\n在 Excel、决策服务和大多数计算机语言中，一种常见模式是将较大的解决方案拆分成可复用的部分。有点像乐高积木一样，这样让它们更容易理解和复用。而且，正如你很快会看到的，这也让它们更容易测试。但如果我们把解决方案拆分成许多部分，如何将它们链接在一起呢？让我们通过一个例子来演示。\n\
  \n我们尽量让本书中的示例尽可能逼真。但如果展示一个复杂到足以拆分成较小模块的示例，一个决策模型调用另一个决策模型的机制就会被复杂性掩盖。所以，我们反其道而行之——用尽可能简单的示例来链接模型。\n\
  \n我们从图 9.7 开始，也可以下载为 09-a-SimpleModel.dmn。\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_249_0.png)\n\
  \n图 9.7 – Hello World 服务\n\n这是第 3 章中图 3.19 的 Hello world 示例的稍加更新版本。它接收一个名称作为输入，然后向那个人问好。\n\
  \n在图 9.7 中，我们将决策模型和决策节点并排放置，以便更清楚——但除了将节点包装在决策服务中之外，没有重大变化。还值得注意的是，输入节点（Name）是 String\
  \ 类型。我们还设置了决策服务的属性，让 KIE 知道它返回 String 类型——这有助于其他人包含并复用此模型。\n\n#### 关于文件夹的提醒\n\n\
  由于只有在模型位于 KIE 中的同一文件夹内时才能导入它们，因此如果 KIE 沙箱连接到 GitHub 会很有帮助——如果需要提醒如何操作，请查阅第 5 章。系统会询问你使用什么文件夹名称——我们使用了\
  \ c09 作为文件夹名称，但更重要的是，我们要链接的两个模型都必须保存在该文件夹中。\n\n创建此模型（或将其上传到沙箱）后，请按照我们在第 5 章中给出的说明，确保它同步到\
  \ GitHub。我们将其命名为`09-a-ImportModel.dmn`。现在，是时候创建第二个模型来引用我们的`Hello`服务了：\n\n1. 单击**新建文件**并选择**决策**——它会在同一文件夹中创建一个空白文件夹。\n\
  2. 单击**包含的模型**选项卡——目前，它将显示**尚未包含外部模型。**\n3. 单击屏幕右上角的**包含模型**。你将看到文件夹中的模型列表，如图 9.8\
  \ 所示。如果看不到其他模型，请返回并检查 KIE 沙箱是否正确链接到 GitHub——两个模型都需要位于同一文件夹中。\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_250_0.png)\n\
  \n图 9.8 – 包含另一个模型\n\n4. 选择`09-a-ImportModel.dmn`并给它一个名称。最好保持简短（我们称之为`simple`），因为我们将经常使用该名称。单击**包含**按钮确认。\n\
  5. 如果我们包含的模型有自定义数据类型，它们将（只读地）出现在**数据类型**选项卡中。模型中的**决策导航器**选项卡也会显示我们刚刚包含的组件，如图 9.9\
  \ 所示。如果决策导航器尚未打开，你可以点击屏幕右上角的地图图标查看它。\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_251_0.png)\n\
  \n图 9.9 – 决策导航器中包含的组件\n\n虽然可以使用所有这些组件，但决策服务才是用于在模型外部引用的那个组件。既然我们已经包含了模型，就可以随时调用它。我们将构建想要链接的两个模型中的第二个，如图\
  \ 9.10 所示。\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_251_1.png)\n\n图 9.10 – 包含的组件\n\
  \n虽然这个第二个模型可以从本书的 GitHub 网站下载为 09-a-ImportModel.dmn，但它仍然很容易设置。从图 9.10 从左到右，我们看到以下内容：\n\
  \n1. 我们从决策导航器中拖放了 simple.Hello Service。\n2. 我们创建了一个决策节点，并保留默认名称 Decision-1。\n3.\
  \ 我们从 Hello 服务链接到决策节点。这个方向很重要；幸运的是，沙箱编辑器不会让你按相反方向链接。\n4. 我们创建了一个新的输入节点（保留默认名称 InputData-1），并将其类型设置为\
  \ String。我们将输入节点连接到决策节点。\n5. 编辑决策节点时，我们将其类型设置为 Invocation。\n6. 编辑 Invocation 节点时，确保名称完全正确很重要。我们设置的函数名称是\
  \ simple.Hello Service——与我们从另一个模型包含的节点拼写和大小写完全相同。\n7. 编辑器会有一行用于输入我们想要传递的参数——将第一个参数名称从\
  \ p-1 改为 name。同样，这必须与我们包含的模型中的输入节点完全匹配。查看决策导航器以确保拼写正确。我们将此参数的类型设置为 String——也是为了与我们包含的模型期望的值匹配。\n\
  8. 我们设置要作为参数传递的值；单击“选择表达式”，将其设置为“字面表达式”，并包含我们输入节点（Input-Node-1）的值。参数的类型（String）必须与包含的服务期望的类型匹配。\n\
  9. 在 KIE 沙箱中，仔细检查没有突出显示的问题。然后，单击“运行”和“作为表单”。如图 9.11 所示，当我们输入名字 Peter 时，会得到 Hello\
  \ Peter 作为返回。\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_252_0.png)\n\n图 9.11 –\
  \ 调用外部模型的结果\n\n#### 小示例，大影响\n\n这是一个简单的例子——我们绝不会把像 Hello World 这样简单的示例拆分。但你的模型很快就会变得非常复杂，很高兴知道你可以将模型拆分为可复用的组件。\n\
  \n#### 链接物料清单示例\n\n由于这是一个非常简单的示例，我们还提供了第二个更复杂的示例，其中我们复用了在图 9.4 中创建的物料清单服务。该示例可在\
  \ 09-Call-BOM 下载。导入步骤以及到我们决策模型的映射与 hello world 示例类似。但是，我们想要传递多个参数，这可以通过在调用表中添加额外的一行来实现，如图\
  \ 9.12 所示。\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_253_0.png)\n\n图 9.12 – 调用我们的物料清单服务\n\
  \n我们将在第 11 章中回到导入和调用模型——届时我们将使用类似的机制来使用和导入机器学习模型，使其与我们的业务规则一起工作。\n\n既然我们知道可以拆分和重新组合模型，问题就变成了在哪里拆分模型。这是一个需要判断的决定，因为你需要权衡在一个页面上看到所有内容的便利性，与拥有许多更小、更容易理解的模型的简洁性。但两个有用的指导原则如下：\n\
  \n- 按照人们对现有业务的思考方式来建模——你的模型越遵循现有的部门、团队和流程边界，你的同事就越容易理解它们。\n- 在便于测试的层级建模。如果你的模型太大，测试起来会非常笨重。如果模型太小，你会厌倦编写许多价值不大的琐碎测试。\n\
  \n由于测试非常重要，KIE 为你提供了几种自动构建和运行测试的选项——我们将在下一节中讨论。\n\n#### 测试并破坏你的规则（在其他人之前）\n\n如果你像我一样，让电子表格、程序或决策模型正常工作总是一种解脱。有时我们不愿意过于用力考验新作品，以防它崩溃。但无论我们是否寻找错误，任何隐藏的错误仍然存在，之后会回来咬我们一口。\n\
  \n更糟糕的是，错误被忽略的时间越长，修复成本就越高。现在（当模型还清晰地印在你脑中时）微不足道的更改，在几个月后（其间你已参与其他几个项目）可能需要几个小时才能找到。而且，如果问题被真实客户或最终用户看到，可能会非常昂贵——我们最终可能赠送大量免费巧克力并损害我们业务的声誉。\n\
  \n更令人沮丧的是，修复这个错误可能导致其他东西崩溃。例如，我们可能会更新物料清单，然后发现另一个决策模型依赖它，现在行为不正确。但有办法解决这个问题——通常称为敏捷、Scrum\
  \ 或测试驱动开发。\n\n#### 敏捷、Scrum 和测试驱动开发\n\n幸运的是，在我们之前有很多人多年来遇到过这些问题。因此，有最佳实践和工具来帮助我们解决这些问题。从广义上讲，解决方案如下：\n\
  \n- 一点一点地编写测试，这样它们容易编写。每个测试的重点是测试单个部分。这样，我们就不会想留到最后，然后可能根本不写。这种方法称为**单元测试**，它比你之前可能参与的端到端测试要容易得多（尽管端到端测试仍有其用武之地）。\n\
  - 以标准方式编写测试，因此虽然每个单元测试都很简单，但它们共同形成了一个安全网，可以突出显示我们是否意外破坏了解决方案的另一个部分。\n- 先编写测试，使它们成为我们试图开发的内容的契约，并且我们知道我们已经构建了我们承诺的一切。\n\
  - 自动运行这些测试，使它们成为游戏的一部分——我们的测试是否通过？如果绿灯亮起，太好了！如果没有，因为每个测试都非常简单，很容易找到并修复问题（然后再次运行，看看我们是否获得绿灯）。\n\
  - 使用与构建解决方案类似的工具编写测试，但将测试组织得像建筑上的脚手架一样。这样，很明显什么是支撑测试框架，而建筑物（或核心解决方案）不被触及。\n- 让这些测试有趣且易于编写，使它们成为文档的一部分。有了良好的测试，查看你的决策模型的同事现在有了一个可用的示例，了解如何（重新）使用它。\n\
  \n这些要点是一种构建解决方案的理念和方法。你可能参与过遵循这些原则的项目，通常称为**敏捷、Scrum 或测试驱动开发。**\n\n\n\n\n\n正确实施的话，编写测试所需的小额前期投入将以数十倍甚至数百倍回报。更妙的是，有测试的项目工作压力会小得多，因为你能在有足够时间修复且不会大费周章时，就及早发现问题。\n\
  \n> **健康警告 – 给项目贴上敏捷标签并不会使其成为敏捷**\n> 一些管理者有诱惑将项目标记为敏捷，以此作为不做艰难项目规划工作的借口。但如果你不投入测试，后期会遇到严重问题（通常是在原项目经理离职后）。如果你有过这种经历，请对下一节保持开放心态——真正的测试优先项目解决了开发技术解决方案中的许多常见痛点。\n\
  \n关于敏捷、Scrum 和测试驱动开发，有大量信息可供查阅。我们将在下一节聚焦于 KIE 项目提供的支持这种方法的工具。我们将介绍 KIE 沙箱中内置的一个工具，以及一种更高级的方法，你可能希望在\
  \ Excel 中实现。最后，我们将预览 Business Central（我们在 *第 10 章* 中更详细地介绍）和 Visual Studio Code（我们在\
  \ *附录 B* 和 *第 12 章* 中介绍）中可用的一些高级测试功能。\n\n### Run ... as Table\n\n你可能在用 KIE 沙箱运行之前的示例时，使用\
  \ **Run ... as Form** 选项，注意到还有第二个选项（**Run ... as Table**）。让我们现在来看一下，因为这是迈向测试方法的一个良好步骤：\n\
  \n1. 我们在 KIE 沙箱中打开了物料清单选项（下载的模型：`09 Bill of Materials.dmn`）。\n2. 在沙箱中，选择 **Run ...\
  \ as Table**。会出现类似 *图 9.13* 的屏幕。请注意，我们已删除了一些列以提高清晰度，并添加了一些测试值以更清晰地展示表格运行器的工作方式。\n\
  \n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_255_0.png)\n\n图 9.13 – KIE 沙箱表格运行器\n\n\
  3. 此表格的每一行都等同于我们迄今为止测试模型时使用 Run ... as Form 的方式。如果我们将左侧的两个值（Qty 和 Product）作为输入，在右侧，我们可以声明我们期望的三个输出（产品中的可可克数、PD\
  \ 中的可可克数：请应用 P-code 风格 Order，以及产品名称的确认）。\n\n4. 这里的便利之处在于，我们可以同时看到多个不同的订单，从而能够快速检查是否有任何问题。\n\
  \n虽然表格运行器是一个有用的改进，但它在测试优先方法方面仍有不足之处。最重要的是，它不会标记测试失败的位置。例如，图 9.13 中的第三个值是一个负值，导致了虚假结果。但很容易就会错过这一点——即使你第一次看图时发现了这个问题，你能保证在需要检查的数百个输出表格中也能发现问题吗？\n\
  \n幸运的是，KIE 提供了修复此问题的工具。我们将在本章后面介绍这些工具——但由于它们尚未（嵌入）到 KIE 沙箱中，讨论一个基于 Excel 的解决方案是值得的。\n\
  \n### Test cases using Excel\n\n如果你查看图 9.14，你会看到我们已在 Excel 中改进了表格运行器，以解决 rogue 测试被遗漏的问题。虽然它与图\
  \ 9.13 的值相同，但一旦出现问题就会立即显而易见，因为它会被标红。\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_256_0.png)\n\
  \n图 9.14 – Excel 中的测试场景\n\n这是一个非常简单的想法，共有四组主要列：\n\n- Given 是我们传入的值\n- Expected 是我们认为决策服务应该返回的值\n\
  - Actual 是实际返回的值\n- Flag 是用于检查 Expected 和 Actual 值是否匹配的列\n\n我们不会给出在 Excel 中运行测试用例的工作示例，因为一旦你掌握了关键思想，实现起来就很直接。你可以使用你在第\
  \ 6 章和第 7 章中学到的方法，设置此测试电子表格，将 Excel 与你的决策服务链接起来。\n\n其他细节，例如条件格式，将由你决定，布局将与你构建的决策服务密切相关。\n\
  \n值得强调的是，在 Excel 中进行测试是一个完全可行的方案。我们在下一节中讨论的场景模拟方法更好——但它确实依赖于你可能需要支持才能设置的工具。你可能会发现下一节很困难，但可以实现。随着你逐步完成它，请记住你始终有在\
  \ Excel 中进行测试的备选方案。\n\n### Scenario testing and simulation\n\nExcel 方法的测试是好的，但使用与我们构建模型相似的工具编写测试会更好。这样，我们的测试就位于决策模型附近，更有可能被使用和更新。图\
  \ 9.15 给出了 KIE 的 Scenario Simulation 工具的示例，它采用了这种方法。\n\n| # | Scenario description\
  \ | GIVEN: Product | GIVEN: Qty | EXPECT: Bill of Materials | EXPECT: Product Details\
  \ |\n| --- | --- | --- | --- | --- | --- |\n| 1 | Silk Tray | \"Silk Tray\" | 125\
  \ | 18750 | 150 |\n| 2 | Crunch | \"Crunch\" | 10 | 100 | 10 |\n| 3 | Crunch | \"\
  Crunch\" | -10 | 0 | 0 |\n\n图 9.15 – KIE 场景模拟编辑器\n\n图 9.15 在方法上与图 9.14 中的 Excel\
  \ 测试场景非常相似。它具有相同的输入（GIVEN）和预期输出（EXPECT）。当我们运行场景模拟时，它会突出显示预期值和实际值之间的任何差异。\n\n虽然这是\
  \ KIE 的真实截图，但截至撰写时，Scenario Simulation 工具尚未在沙箱中提供。值得再次核实，因为产品路线图不断演进，到你阅读本文时可能已发生变化。相反，此\
  \ Scenario Simulation 工具可在 KIE 两个高级决策建模工具中使用：\n\n- **Business Central**，KIE 团队的较老决策建模工具，仍比沙箱功能更多。如你在第\
  \ 10 章中将看到，Business Central 对业务用户非常友好。有几个设置步骤，大多数 Excel 高级用户能够遵循，但有些人需要支持。\n\n-\
  \ **VS Code**，面向开发人员而非业务用户的工具包的一部分。虽然许多 Excel 用户能够使用它，但本书的并非每个读者都想利用它所提供的强大功能。\n\
  \n本书的一个关键目标是为你提供良好的基础和清晰的下一步探索方向。微软的 VS Code 绝对是这些领域之一。\n\n### What is VS Code and\
  \ why use it to test?\n\n你可以使用 VS Code 不仅用于编写决策模型，还可用于机器学习、Web 开发、数据科学和更传统的编程等广泛领域。为了鼓励你迈出这一步，我们将在下一节介绍\
  \ VS Code，并解释（在附录 B 中）如何使用它开始编写决策模型和场景测试。该附录使用 VS Code 的在线版本，无需安装，以便更快上手。\n\nVS\
  \ Code 是微软提供的免费文本编辑器和编码工具，其扩展程序可以处理几乎任何开发项目。在我们之前的一些示例中，我们在简单的文本编辑器（如记事本）中打开了一些文件。VS\
  \ Code 为你提供了类似的编辑器，但可以同时打开多个类似文本的文件——请看图 9.16 中屏幕顶部的标签。\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_258_0.png)\n\
  \n更妙的是，VS Code 为你提供代码着色和语法高亮，这看起来像是简单的装饰，但确实使文件更容易阅读。在屏幕截图左侧，你还会看到 VS Code 为你提供了类似\
  \ Windows 资源管理器的视图，显示解决方案中的所有文件——包括决策模型、场景模拟（可在屏幕截图的主面板中看到）以及支持文件，如文本、XML 和 .md\
  \ markdown 格式的文档。\n\n屏幕截图左侧的深灰色栏暗示了 VS Code 中可用的强大功能。图标会根据我们安装的插件而变化——在这种情况下，我们添加了\
  \ KIE 团队的 DMN 扩展。此栏上的其他图标允许你与 GitHub 仓库交互（比在 KIE 沙箱中更强大的方式），将项目部署到 Azure，并运行项目中的单个文件。\n\
  \n\n\n\n更令人印象深刻的是，尽管VS Code有桌面版，但这张截图是在Web浏览器中运行的VS Code中截取的（浏览器会自动设置Azure云托管的Codespaces来完成繁重的工作）。\n\
  \n屏幕的最后一部分（右下角）包含大量文本。如果你以前使用过终端（无论是Linux、macOS还是Windows），应该对此很熟悉。但由于需要输入命令而不是点击菜单和鼠标，这可能会让一些第一次看到它的读者感到畏惧。正是出于这个原因，我们在*附录B*中介绍了在VS\
  \ Code中设置和使用场景模拟与测试，而不在本书主体流程中展开。\n\n由于*附录B*中的说明是逐步给出的，大多数用户应该能够跟着操作。VS Code是一个强大工具，你将在许多不同项目中用到它，我强烈建议你深入尝试一下——附带的好处是让场景模拟工具可用于你的项目。\n\
  \n#### 总结与延伸阅读\n\n本章我们链接了大量额外资源。KIE项目博客上有一些关于使用测试场景的非常有用的帖子和视频，非常值得花时间阅读。如果你想更详细地探索DMN，一个极好的下一步是阅读布鲁斯·西尔弗（Bruce\
  \ Silver）的*DMN方法与风格*。\n\n但在本书中，我们还没有完成这些主题。*第10章*（我们将在其中介绍安装Docker和Business Central）为我们提供了另一种运行场景测试编辑器的方式。这也很好，因为我们在*第11章*中介绍的机器学习比我们目前介绍的基于规则的AI更需要测试。最后，在*第12章*中，我们介绍DRL格式，这是一种更高级的规则编写格式，与我们在本章中进一步学习的图形化DMN表示法配合得很好。\n\
  \n本章旨在让你更深入地理解决策模型以及嵌入其中的FEEL表达式语言。由于更高级的模型更容易出错，我们介绍了一些使模型更易理解的模式，以及将许多简单模型连接起来的技术。我们了解了测试优先方法的重要性，以及KIE为支持该方法提供的工具。最后，我们初步了解了KIE中作为VS\
  \ Code一部分的高级工具，以此鼓励你在沙盒之外进行更多探索。\n\n*超越沙盒*可能是下一章的一个好标题——我们将继续探索更多托管决策编辑器和运行模型的方式。由于这涉及Docker，它为我们提供了更多本地和云端运行选项，并基于本章通过VS\
  \ Code和Codespaces对Azure的初步了解继续深入。我们还将了解Business Central作为运行场景测试的另一种方式。\n"
- '# 第4部分：AI、机器学习和规则引擎的下一步


  本书的最后部分旨在为你提供一个良好的平台，让你进一步了解AI、机器学习和规则引擎。


  本部分包括以下章节：


  - *第10章，使用Docker和云在Business Central中扩展规则*，展示了KIE和Kogito决策工具的强大功能，利用容器来增加部署选项和编辑能力。

  - *第11章，基于规则的AI和机器学习AI——结合两者优势*，介绍AI的另一主要部分，并展示如何使用KIE和Azure ML Studio中的工具，将机器学习和基于规则的决策模型并排部署。

  - *第12章，下一步是什么？深入神经网络、企业项目、高级规则和规则引擎*，在前几章的基础上扩展，着眼于未来学习的关键领域，包括神经网络、企业Java项目以及道德、可解释AI的实用入门步骤。

  '
- "## 第10章 使用Docker和云在Business Central中扩展规则\n\n在上一章中，我们首次了解了**场景模拟工具**，它是一种测试复杂决策模型的手段。我们在*附录B*中介绍的说明可能也激发了你在VS\
  \ Code中探索高级技术的兴趣。但由于那种技术方法并不适合所有人，你可能仍在寻找另一种高级的模型测试方式。\n\n幸运的是，**Business Central**以更用户友好的包形式提供了相同的场景模拟工具。本章将介绍如何设置Business\
  \ Central编辑器，并探讨它提供的一些额外规则编辑技术。特别是，我们将其视为一个企业级协作工具，用于共享和编辑决策模型。\n\n由于我们将使用**Docker容器**来运行Business\
  \ Central，我们还将解决在*第5章*中遇到的另一个问题。虽然我们已经知道如何在本地（笔记本电脑上）或云端（使用Red Hat OpenShift）托管决策模型，但你的IT部门可能想要介于两者之间的方案：在公司网络上托管决策服务。我们将探索容器作为实现此目标及其他部署选项的一种方式。\n\
  \n具体来说，我们将涵盖以下内容：\n\n- 比较Business Central和KIE Sandbox来编辑我们的模型\n- 镜像、容器、Docker和获取帮助\n\
  - 在笔记本电脑上安装Docker\n- 运行Docker及Docker Desktop概览\n- 在Docker中运行Business Central规则编辑器\n\
  - Docker和Azure中的KIE Server\n- 决策模型部署选项摘要\n\n到本章结束时，你应该有信心自己和同事能够部署一个可扩展的企业级规则编辑器，并创建一个可扩展的企业级服务器来托管你编写的业务规则。这将为你提供许多书中未涉及的额外探索领域。\n\
  \n> **阅读本章的两种不同方式——动手实践，或仅仅了解它可以实现**\n> 虽然了解动手实践技术很有用，但本章的主要目的是为未来步骤指明方向。这为你提供了另一种阅读本章的方式；尝试理解什么是可能的，同时知道会有更懂技术的同事来执行部署。\n\
  > \n> 无论哪种方式，很高兴知道Kogito支持一系列部署选项。本章分享的信息将帮助你说服同事：KIE、Kogito和Drools是解决你所面临的业务和IT问题的可扩展技术栈。\n\
  \n### 前提条件\n\n本章中的分步说明很简单。你唯一需要的是一台性能足够强大的笔记本电脑来运行Docker。大多数现代笔记本电脑都能满足这一要求。更多信息请访问\
  \ https://docs.docker.com/desktop/install/windows-install/。\n\n如果你的笔记本电脑性能不够，可以询问同事网络上是否有其他计算机可以托管容器。Docker的全部意义在于它提供了多种部署选项。由于Business\
  \ Central基于Web，你将能够远程访问它。\n\n### 比较Business Central和KIE Sandbox\n\nBusiness Central作为决策模型的基于Web的编辑器，听起来很像KIE\
  \ Sandbox。如果你熟悉KIE Sandbox，你会发现Business Central中有很多相似之处，没错。但这有点像把家用车和最新的F1赛车作比较。两者都是四轮带引擎的汽车，但一个更容易驾驶，更适合去超市购物；另一个性能更强，但需要一队机械师的支持才能有效运行。功能上的一些关键差异如下：\n\
  \n- KIE Sandbox设计为易于使用，无需设置，非常适合像本书这样的教程。Business Central可能易于启动，但需要大约15-20分钟的准备才能编写第一条业务规则。\n\
  - Business Central比KIE Sandbox拥有更多功能，后者专注于决策建模的核心功能。核心决策模型编辑器和DMN实现完全相同，但有些附加功能（例如场景模拟工具）仅在Business\
  \ Central中可用。\n\n\n\n\n\n+   - The Sandbox 针对的是单个用户并带有一些团队功能，而 Business Central\
  \ 则假设会有很多人一起在项目上工作。其许多高级功能都假设你的团队中有 *mechanic* 知道 Java（例如，设置数据类型）。\n+   - KIE 沙盒和\
  \ Business Central 都使用 Git 作为存储模型的机制，因此可以构建一个工作流，让两个编辑器同时处理同一个决策模型。然而，正如你从 Business\
  \ Central 所预期的那样，它提供了更强大的实现，这对于新用户来说可能令人望而生畏。\n\n在本章中，我们将重点关注场景测试工具，因为这是你探索 Business\
  \ Central 的一个令人信服的理由。我们还使用 Business Central 来演示 *第 12 章* 中的一些更高级的功能。我们的目标是为你提供一个良好的起点，并建议进一步探索的路径。\n\
  \n但首先，我们需要让 Business Central 运行起来，为此我们需要容器。\n\n## 容器、Docker 和获取帮助\n\n我们在 *第 2 章*\
  \ 中介绍了 **容器**，它是让读者最快运行工具和示例的方式。更重要的是，容器可以帮助所有读者一致地运行示例，这意味着书中的说明与你在笔记本电脑上看到的情况相匹配。\n\
  \n过程很简单；我们安装我们选择的容器软件（Docker），然后使用 Docker 工具下载包含我们想要的软件和示例的镜像。\n\n许多 Excel 高级用户会习惯安装软件。即使这是你第一次做，本节中的逐步说明也非常容易遵循。在开始之前，让我们记住你在\
  \ Excel 中尝试过的事情并非第一次就成功。你是如何修复的？\n\n-   1. 你检查了你的输入和拼写——这是错误信息的最大原因。\n-   2. 你仔细阅读了错误信息——很可能它会建议你可以做的事情来修复它。\n\
  -   3. 如果你正在遵循指南或书籍，你会重新检查说明，看看是否有遗漏的步骤。\n-   4. 你将错误信息（或其关键部分）复制并粘贴到搜索引擎中。大多数时候，会有遇到相同问题的人知道如何修复它。至少，会有建议帮助你更接近解决方案。\n\
  -   5. 在尝试了所有这些步骤之后，你向同事或朋友求助。你分享了你尝试过的步骤，以表明你重视他们的时间，并且你确实在寻求他们的专业知识。\n\n我们逐步说明的第一部分可以概括为\
  \ *在你的电脑上安装 Docker Desktop*。有一个非常支持且活跃的 Docker 社区可以帮助你做到这一点。而且由于 Docker 是企业标准，可能附近有人可以帮助你。*附录\
  \ C* 有一些很好的起点，特别是 *为 Docker 准备你的电脑* 部分。\n\n大多数读者在按照下一节的说明安装 Docker 时不需要帮助，但知道如果需要的话有更多详细信息是很好的。\n\
  \n## 安装 Docker\n\n既然我们知道有所有这些支持，让我们一步步在笔记本电脑上安装 Docker。本章中的说明分为两个清晰的部分：\n\n-   1.\
  \ 安装 Docker 以托管容器。\n-   2. 下载一个包含你想在此容器中运行的示例的镜像。\n\n确保第一部分正在运行，然后再开始第二部分——如果你知道确切是哪一部分导致了问题，寻求帮助会容易得多。\n\
  \n## 准备你的 Docker Hub 账户\n\n稍后你将被要求提供你的（免费注册）Docker Hub 账户的详细信息。前往 docker.com 并点击网页右上角的\
  \ Sign In。然后你可以选择创建账户。记下你的用户名和密码以备后用。\n\n## 下载和安装 Docker 软件\n\nDocker Desktop 的下载和安装相当直接：\n\
  \n-   1. 开始时，前往 https://www.docker.com/products/docker-desktop/ 并选择适合你系统的安装程序（例如，Windows、Linux\
  \ 或 Mac）。\n-   2. 打开你在上一步中下载的 Docker 安装程序。\n-   3. 点击 Yes for Do you want to allow\
  \ Docker Desktop to make changes to your PC。如果此时要求输入管理员用户名和密码，请参阅附录 C 中的说明。\n- \
  \  4. 在下一步——配置中点击 OK。请注意，你的版本号可能比此屏幕截图中显示的更高（更新）：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_266_0.png)\n\
  \n-   5. 在安装程序下载和解压文件时耐心等待。如果一切顺利，你将收到 Installation succeeded 消息——点击 OK 并继续到下一节（Docker\
  \ Desktop 之旅）。\n\n4. 当 Docker 启动后，你应该会看到主屏幕，如 **图 10.3** 所示。如果没有看到此确切屏幕，请尝试点击左上角的\
  \ **Containers**：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_268_0.png)\n\n图 10.3\
  \ – Docker Desktop 主屏幕\n\n5. 如果你的屏幕显示绿色 Docker 鲸鱼图标（在左下角），那么恭喜你，Docker Desktop 和后台引擎（服务）都正确运行。\n\
  \n虽然这不是一本关于 Docker 的书，但你将在此屏幕上花费一些时间来运行示例。花几分钟浏览一下是值得的：\n\n-   - 屏幕底部中央的区域是 **Featured\
  \ Images**，显示可在 Docker 中运行的容器范围。还有许多其他镜像来源（尤其是 Docker Hub 和来自 Red Hat 的 Quay）——我们将使用它们来运行示例。\n\
  -   - **Images**（标签）是你可运行的可用镜像列表。镜像是只读的且永不改变。目前你的电脑上可能没有多少镜像；我们将在本章后面展示如何下载一些。\n\
  -   - 左上角的 **Container** 标签页也允许你返回主页。容器是镜像的工作副本。随着你与之交互，它们会发生变化。此标签页还显示你正在运行的容器，并允许你停止和重新启动它们以及查看运行容器的消息日志。\n\
  \n-   - **Volumes** 就像容器可以存储其信息的磁盘。一般来说，Docker 会自动为我们管理它们。\n-   - 左侧的其他标签页（**Dev\
  \ Environments** 和 **Extensions**）是更高级的功能。我们在书中运行示例时不需要它们。\n\n屏幕右上角还有一些更有趣的按钮：\n\
  \n-   - **Upgrade**、**Troubleshoot** 和 **Debug** 暗示了 Docker 更强大的高级功能。我们不会经常使用这些按钮。\n\
  -   - **Account** 允许你使用你在 docker.com 上创建的用户名和密码登录。现在登录 Docker Desktop 是个好主意——它会在我们下一节下载\
  \ Docker 镜像时提供帮助。\n\n> **关闭 KIE Extended Services**\n> \n> 由于我们即将运行第一个 Docker 镜像，现在是提醒你关闭\
  \ KIE Extended Services 的好时机。如果你忘记了，你将收到 Port already in use 错误，因为 KIE 服务和（部分）Docker\
  \ 镜像试图做类似的事情并互相干扰。\n\n## Docker Desktop 首次使用\n\nDocker Desktop 是在我们下载后管理示例镜像的绝佳工具。但它目前没有提供下载这些镜像的方法。为此，你需要使用\
  \ **console**（也称为 **terminal** 或 **command prompt**）。通常，我们只需要使用控制台一次，因为在镜像下载后，我们可以在\
  \ Docker Desktop 中管理它。\n\n作为 Excel 高级用户，你不必害怕控制台。它允许我们输入文本命令，就像在 Excel 中输入公式一样。就像在\
  \ Excel 中一样，拼写正确非常重要（这是错误的最大来源）。就像在 Excel 中一样，重要的是按下 *Enter*（或 *Return*）键，这样计算机就知道你已经输入完毕，可以开始工作了。\n\
  \n要在 Windows 上打开控制台，按 *Windows Key* + *R*，然后输入 cmd（并点击 OK）。你应该会看到一个类似 *图 10.4* 的黑白窗口：\n\
  \n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_269_0.png)\n\n图 10.4 – Windows 上的控制台\n\
  \n在 Mac 上，按 *Cmd* + *Space* 打开 Spotlight，然后输入 *Terminal* 搜索它。\n\n\n\n\n\n请注意，你的屏幕与此截图会略有不同\
  \ – **paul.f** 是我的 Windows 用户名，但你的会不同。但输入、按 *Enter* 以及让计算机开始工作的相同思路是一样的。\n\n好消息是，在接下来的章节中，一旦我们使用控制台中的命令下载示例图片，图片会自动出现在\
  \ Docker Desktop 中。之后，我们将使用 Docker Desktop 来管理它们。\n\n## 在 Docker 中运行简单的 Hello World\
  \ 镜像\n\n现在我们已经下载了 Docker，我们想测试一个简单的镜像。这样，我们就知道 Docker 运行正常，如果出现问题，我们就知道从哪里开始查找修复。\n\
  \n传统上，第一个示例是让计算机对你说 `Hello World`。Docker 让这变得很容易。要运行 Docker Hello World 示例，请按照以下步骤操作：\n\
  \n- 1. 通过按 *Windows Key* + R 打开命令提示符，然后输入 `cmd`。Mac 用户，请参阅前一节中有关打开终端的说明。\n- 2. 在控制台中，输入\
  \ `docker run hello-world`，请特别注意拼写。\n- 3. 确保按 *Enter* 键运行命令。你将看到 *Figure 10.5* 中显示的消息：\n\
  \n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_270_0.png)\n\nFigure 10.5 – Docker Hello\
  \ World\n\n- 4. 在 *Figure 10.5* 中，我们可以看到我们输入的命令（`docker run hello-world`），然后在我们按下\
  \ *Enter* 键后 Docker 生成的文本。由于它在本地找不到镜像，因此自动从 **Docker Hub** 下载最新版本并运行它。\n\n- 5. 如果你在\
  \ Docker 的文本输出大约一半的位置看到 `Hello from Docker`，那么恭喜你 – 你刚刚在 Docker 容器中运行了你的第一个镜像！\n\
  \n> **Containers hide the hard stuff**\n> \n> 在本示例中，我们跳过了 Docker 为我们做的复杂性 – 这就是我们使用\
  \ Docker 的原因。但如果你阅读 `Hello from Docker` 之后的文本，你会了解到幕后发生的步骤，而你不必担心这些步骤。\n\n这个示例可能有点令人失望\
  \ – 我们花费了大量时间进行设置，到目前为止我们所取得的成就只是一条 `Hello World` 消息。但现在 Docker 已经运行起来，我们可以利用它所能做的事情\
  \ – 下载镜像并尝试 Business Central 作为更高级的 Business Central 规则编辑器。\n\n## 在 Docker 中运行 Business\
  \ Central 规则编辑器\n\n既然我们已经设置了 Docker，让我们用它来运行 KIE 团队提供的第一个镜像。操作与运行我们的 Hello World\
  \ 示例一样简单。虽然在 *step 2* 中需要仔细输入，但我们只需要做一次，因为之后它已在 Docker Desktop 中设置好：\n\n- 1. 通过按\
  \ *Windows Key + R* 打开命令提示符，然后输入 cmd。\n- 2. 在控制台中，输入 `docker run -p 8080:8080 -p\
  \ 8001:8001 -d --name business-central quay.io/kiegroup/business-central-workbench-showcase:latest`，请特别注意拼写。\n\
  - 3. Docker 将花费数分钟下载和提取必要的层，如 *Figure 10.6* 所示：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_271_0.png)\n\
  \nFigure 10.6 – Docker downloading the layers in the Business Central image\n\n\
  4. 命令提示符更新完成后，查看 Docker Desktop 容器选项卡。它应该显示 Business Central 在容器中运行，如 Figure 10.7\
  \ 所示：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_272_0.png)\n\nFigure 10.7 – Docker\
  \ running our Business Central image\n\n5. Figure 10.7 中的值与我们在启动命令中指定的值相匹配。docker\
  \ run 要求 Docker 使用来自 quay.io/kiegroup/business-central-workbench-showcase 的最新镜像运行容器，如果需要则下载它。我们使用\
  \ -p 8080:8080 -p 8001:8001 指定了端口；否则，我们将无法在下一步中与之通信，我们还为其指定了 --name 值 business-central，以便在\
  \ Docker Desktop 中更容易找到它。\n\n**Docker ports**\nDocker 很棒，因为它在自己的隔离容器中运行镜像。这对安全性很好，但这也意味着如果我们不使用\
  \ -p 标志指定端口，我们就没有开口在笔记本电脑和安全容器之间通信。\n\n6. 在 Docker Desktop 中，我们鼓励你点击容器名称所在行上的按钮以探索更多。我们的容器已经在运行，因此我们无需点击按钮来启动或停止它。\n\
  \n7. 点击容器名称 Business Central 也很有用。这会给我们来自 Business Central 日志的额外信息，如 Figure 10.8\
  \ 所示。显示的大部分内容都是技术性的，但如果事情没有按预期运行，它是一个有用的建议来源。\n\nFigure 10.8 – Business Central\
  \ startup messages in the logs\n\n通过一个（几乎简单）的命令，你就让 Business Central 运行起来了。从这里开始，你可以使用\
  \ Docker Desktop 启动和停止镜像，而无需再次使用基于文本的控制台。而且由于镜像已被下载，下次启动会快得多。\n\n## 打开 Business\
  \ Central 规则编辑器\n\n本章的重点是让软件运行起来。为了庆祝我们走到这一步，让我们通过查看我们刚刚下载的 Business Central 规则编辑器镜像来犒劳自己。在\
  \ Business Central 容器仍在 Docker 中运行时，请按照以下步骤操作：\n\n- 1. 在你喜欢的浏览器中打开以下 URL：http://localhost:8080/business-central。\n\
  - 2. 第一次加载可能需要几分钟，然后你应该会看到登录屏幕，如 Figure 10.9 所示。相信我们，Business Central 在首次使用后会加快速度。\n\
  \n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_273_0.png)\n\nFigure 10.9 – Login screen\
  \ for Business Central, running in Docker on our laptop\n\n3. 标准 **username** 为\
  \ `krisv`，**password** 为 `krisv`。点击 **Sign In** 进入初始欢迎屏幕。\n\n> **A bigger team –\
  \ multiple roles in Business Central**\n> \n> 该镜像的网页（https://quay.io/repository/keigroup/business-central-workbench-showcase?tab=info）给出了\
  \ Business Central 团队性质的想法，列出了其他几个角色。我们建议的用户名对于首次查看最有用。\n> \n> 请注意，我们使用的是带有这些角色已定义的\
  \ showcase 镜像。RedHat 的 Quay.io 网站上还有其他更安全的镜像， intended for production deployment。\n\
  \n*Figure 10.10* 中显示的欢迎屏幕暗示了 Business Central 的强大功能，面向完整的企业用户。\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_274_0.png)\n\
  \nFigure 10.10 – Business Central welcome screen\n\n虽然我们不会探索 Business Central 的所有功能，但了解其功能很有用。从左到右，选项如下：\n\
  \n- **Design** 大致相当于 KIE Sandbox（但功能更多），我们将在一分钟内进一步探索。\n- **Deploy** 为我们提供了比仅 KIE\
  \ Sandbox 更多部署模型的目标。它还为我们提供了配置这些环境（例如，用于开发、测试、暂存或真实生产使用）的选项。\n- **Manage** 允许我们跟踪正在运行的决策流程和工作流。请记住，我们可能同时部署了多个决策模型需要关注。\n\
  - **Track** 为在部署流程中列为审批者的人提供了查看等待他们处理的请求的能力。\n\n类似的选项可从大多数 KIE 屏幕左上角的 **Menu** 获得。但我们想要创建一个项目，因此如果你点击\
  \ **Design**，你将看到你的空间列表，如 *Figure 10.11* 所示：\n\nFigure 10.11 – Spaces in Business\
  \ Central\n\n把空间想象成一个解决方案 – 在前几章的巧克力示例中，我们将所有决策模型（用于销售和营销，以及生产）包含在一个文件夹中。但实际上，使用\
  \ Business Central，每个部门都会有自己的空间。\n\n点击进入一个空间显示它可以包含多个项目，如 Figure 10.12 所示，每个项目都相当于\
  \ KIE Sandbox 中的一个文件夹。虽然这些用于组织我们的决策模型和其他资产的层级或嵌套文件夹在我们首次打开 Business Central 时可能令人困惑，但对于大型项目，你会欣赏它们提供的结构。\n\
  \nFigure 10.12 – Projects within a space\n\n\n\n\n\n现在我们快速浏览了 Business Central 中的一些初始屏幕后，让我们用它做点有用的事情。特别是，让我们运行\
  \ Scenario Simulation 工具来测试我们在 *Chapter 9* 中创建的模型。\n\n## Scenario Simulation and\
  \ testing in Business Central\n\n在空间屏幕打开的情况下，让我们创建一个新项目。虽然我们通常会创建一个空项目，但为了本练习，我们将使用一个现有的示例并将我们的模型添加到其中。这样在完成本练习后你就有额外的资产可以探索：\n\
  \n+   1. 在 **MySpace** 屏幕上（如 *Figure 10.12* 所示），点击 **Try Sample**。\n+   2. 在出现的选择屏幕上，选择\
  \ **Traffic Violation project**，然后点击屏幕右上角的 **OK**。\n+   3. 这将设置一个类似于 *Figure 10.13*\
  \ 的项目——此示例展示了司机因各种驾驶问题应支付多少罚款。\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_276_0.png)\n\
  \nFigure 10.13 – Example project with a decision model and test scenarios\n\n值得花一些时间浏览这个交通罚单示例。它是一个清晰的决策模型和测试场景的例子，值得详细检查。\n\
  \nFigure 10.13 中还展示了一些 Business Central 企业功能的清晰示例。面包屑显示了你通过项目层次结构到达此处的路径（**Traffic_Violation**）。屏幕还显示了与\
  \ Maven（**main**）的集成，运行此项目中所有测试场景的选项，将模型构建并部署到 KIE Server 的选项，跟踪变更请求和贡献者的选项，以及细粒度的设置；这些都是复杂的企业级功能。\n\
  \n## Setting up our test scenarios\n\n由于我们想展示可以编辑在 KIE Sandbox 中创建的 DMN 模型，我们将导入我们在第\
  \ 9 章中创建的模型，该模型可以作为 `09 Bill of Materials.dmn` 从本书的 GitHub 站点 https://github.com/PacktPublishing/AI-and-Business-Rules-for-Excel-Power-Users\
  \ 下载。\n\n要在 Business Central 中将我们现有的模型添加到此项目，请返回主项目屏幕（我们在 Figure 10.13 中展示的那个），然后执行以下步骤：\n\
  \n+   1. 点击 **Import Asset**，然后按 Figure 10.14 所示填写值，然后点击 OK。像在 KIE sandbox 中一样，选择一个简单但清晰的资产名称是个好主意——在本例中，我们使用\
  \ **bom**——因为我们在创建测试场景时以后需要它。\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_277_0.png)\n\
  \nFigure 10.15 – Importing our Bill of Materials decision model in Business Central\n\
  \n2. Business Central 将导入决策模型并按 Figure 10.16 所示显示它：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_278_0.png)\n\
  \nFigure 10.16 – Decision model editor in Business Central\n\n我们的决策模型编辑器中应该有很多熟悉的内容；它与\
  \ KIE Sandbox 的工作方式完全相同。你还会看到额外的企业级功能来帮助你与同事协作，例如版本控制、自动布局、验证模型的能力以及带注释的保存选项。\n\n\
  由于我们的重点是 Scenario Simulation 工具，让我们创建一个新的测试 Scenario Simulation。点击 Traffic_Violation\
  \ 返回到我们的主项目列表：\n\n+   1. 从主项目屏幕（Figure 10.13 所示的那个）开始，这次不是 Import Asset，而是选择 Add\
  \ Asset。Figure 10.17 所示的对话框将为我们提供各种可能的资产：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_279_0.png)\n\
  \n## Figure 10.17 – Possible assets we can add to the project\n\n2. 我们不会详细介绍全部资产范围，尽管其中许多是你在\
  \ KIE sandbox 中遇到过的项目的更强大的版本。我们将在第 12 章介绍其中一些内容。但目前，我们想专注于创建一个新的 Test Scenario 选项，因此我们将选择该选项，注意不要选择\
  \ (Legacy) 选项。\n\n3. 将出现一个 Create new Test Scenario 框，如 Figure 10.18 所示。我们为测试取了合适的名称，选择了默认包，选择了\
  \ DMN 作为 Source type（因为我们正在测试决策模型），并选择了我们刚刚导入的决策模型（bom.dmn）：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_279_1.png)\n\
  \n## Figure 10.18 – Creating a new test scenario\n\n4. 点击 OK 后，Business Central\
  \ 将根据它在我们的 BOM 决策模型中检测到的值自动生成一个测试场景。我们在 Figure 10.19 中展示了这一点。但请注意，我们已经在屏幕上填充了一些测试值并删除了一些建议的列，以更清晰地说明其工作原理。\n\
  \n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_280_0.png)\n\nFigure 10.19 – Test values\
  \ in our Scenario Simulation editor\n\n这种格式很熟悉；它就是我们在第 9 章中看到的场景测试工具：\n\n+   - 每行是一个我们想要尝试的单独场景，我们可以在\
  \ Scenario description 列中为每行命名。\n+   - 我们在每个场景中将 GIVEN 列的值传递到中间。场景测试工具已识别出我们模型的输入（Product\
  \ 和 Qty）并自动为我们设置了它们。\n+   - EXPECT 下的列是该测试运行应返回的值。我们清理了一些建议的列，并使用 FEEL 语法来表示我们期望返回的关键值对。例如，第一个场景应返回以下内容：\n\
  +     ```\n+     { Grams of Cocoa in Product : 10, Grams of Cocoa in Order : 100,\
  \ Name : \"Crunch\" }\n+     ```\n+   - 这种语法非常紧凑（因此在书本示例中效果很好）。但你也可以使用 Test Tools\
  \ 编辑器（如 Figure 20 所示）创建多个列并为其中每个列测试单个值。\n\n## Test Report\n\nOverview\n\nTest Results:\
  \ PASSED\n\nScenario Status\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_282_0.png)\n\
  \nFigure 10.22 – Successful test run\n\n能够以通过的测试结束 Scenario Simulation 部分真是太好了。虽然我们只添加了两个场景，但你可以看出设置多个场景并让\
  \ Business Central 突出显示任何失败的情况会变得非常有用作为安全网。最好自动运行这些测试，这样你就没有借口错过意外损坏的内容。我们在附录 B\
  \ 中介绍的构建工具是朝着这个方向迈出的有用一步。\n\n在本节中，我们使用 Docker 来支持编辑我们的决策模型。但我们也可以使用 Docker 来拓宽我们可以部署和运行模型的位置范围。\n\
  \n## The KIE Server in Docker and Azure\n\n到目前为止，本书中部署和执行规则的两个主要环境是我们在第 5 章中描述的\
  \ OpenShift Sandbox 和我们在第 3 章中介绍的 KIE Extended Services。即使 KIE Sandbox 网页似乎正在运行规则，快速查看日志会显示是\
  \ KIE Extended Services 在执行规则的重活。\n\n编辑器与服务器之间的这种分离非常强大。它意味着我们可以选择最适合我们的编辑器（KIE\
  \ Sandbox、VS Code 或 Business Central）。然后我们可以选择最佳的服务器环境来部署我们的规则。\n\n我们将在下一节看到，Docker\
  \ 容器为我们提供了巨大的部署规则选项选择，选项多到无法涵盖每一个！但我们会给你可以了解更多的地方。我们将重点关注用其基于 Docker 的等效物替换 KIE\
  \ Extended Services，然后部署更重量级的 KIE Execution Server，最后我们提供有关部署到 Azure 云的指针（以便在你了解部署到\
  \ OpenShift 等效环境的基础上进行构建）。\n\n## Replacing the KIE Extended Services\n\n让我们从最简单的例子开始：用其\
  \ Docker 等效物替换 KIE Extended Services。虽然这个例子展示了操作有多么容易，但大多数时候，KIE Extended Services\
  \ 工作得很好。例外情况可能是如果你有一个专注于安全的 IT 部门，他们更希望你运行一个安全的容器而不是一个控制性较差的 .exe 文件。\n\n为 KIE Server\
  \ 运行 Docker 镜像与我们运行 Business Central 时所做的工作类似：\n\n+   1. 打开命令提示符，按 *Windows Key*\
  \ + R，然后输入 cmd。\n+   \n+   2. 在控制台中，输入 `docker pull -p 21345:21345 --name kie-services\
  \ quay.io/kie-tools/kie-sandbox-extended-services-image:0.25.0`，特别注意拼写。\n+   \n\
  +   3. 镜像下载并启动后，打开 Docker Desktop。点击 **kie-services** 容器名称查看日志。你会看到一条消息，如 *Figure\
  \ 10.23* 所示，确认扩展服务现在在容器中运行。\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_283_0.png)\n\
  \nFigure 10.23 – The KIE Extended Services running in Docker\n\n+   4. 现在我们可以打开\
  \ KIE Sandbox `sandbox.kie.org`，它将识别我们有一个本地服务器正在运行。\n+   \n+   5. Sandbox 可能抱怨我们运行的是错误版本。如果是这样，请记下版本号并重复\
  \ *step 2*，将版本号（25）替换为它期望的那个。\n\n## Building your own server\n\n\n\n\n\n> 与 Excel\
  \ 不同，KIE 是一个开源项目，因此你可以选择构建一个服务器来满足你的确切需求。虽然这是一个高级技术主题，但 *附录 B* 中的说明几乎可以做到这一点。你可能会发现，如果运行项目附带的示例，你无意中构建了\
  \ KIE Extended Services 的等价物。\n\n在 Docker 中运行 KIE Extended Services 是一个有用的演示，但在有限的情况下才有用，因为它旨在仅支持本地部署。让我们继续看一个更重量级的示例\
  \ – 在 Docker 中运行完整的 KIE Server。\n\n### 在 Docker 中运行 KIE Server\n\n如果我们已经有几个运行规则的好选择，为什么我们还要自己的完整\
  \ KIE Server？原因如下：\n\n- Business Central 需要一个单独的服务器来部署规则。它没有像 KIE Sandbox 那样内置到\
  \ OpenShift 的便捷部署。\n- 你的 IT 部门可能更喜欢让你的核心业务规则在本地服务器上运行，而不是在云中（更不用说在你的笔记本电脑上了！）。\n\
  - 最后，你可能已经说服同事接受基于规则的 AI 方法。此时，KIE Server 成为你大部分业务知识的存储库，有许多系统调用它来做出关键决策。你将希望对该存储库的存储位置有更多控制。\n\
  \n幸运的是，**Docker Compose** 为我们提供了一种运行多个 Docker 镜像（包括 KIE Server）的方法。\n\n### 运行 Business\
  \ Central 和 KIE Server – Docker Compose\n\n**Docker Compose** 是一款在你安装 Docker Desktop\
  \ 时自动安装的工具。它允许我们同时启动和停止多个 Docker 容器，并带有我们所需的所有设置。\n\nDocker Compose 在某些方面比运行 Docker\
  \ 更容易，因为所有棘手的部分，例如镜像名称和端口号，都包含在一个可下载的配置文件中。设置存储在一个结构化文本文件中，该文件旨在便于人类阅读（*YAML* 格式）。\n\
  \n我们准备了一个 Docker Compose 文件，详细说明了 Docker 如何下载并运行 Business Central 和 KIE Server 镜像。如果你正在寻找更详细的信息，它基于\
  \ KIE 团队的说明 https://quay.io/repository/kiegroup/kie-server-showcase。让我们逐步了解：\n\n\
  - 1. 从 Packt 出版的 GitHub 网站 https://github.com/PacktPublishing/AI-and-Business-Rules-for-Excel-Power-Users\
  \ 下载 `docker-compose.yaml` 文件。在任何文本编辑器中打开它即可查看，如图 10.24 所示：\n\n```\nversion: '3'\n\
  \nservices:\n  business-central:\n    image: quay.io/kiegroup/business-central-workbench-showcase:7.73.0.Final\n\
  \    ports:\n      - \"8080:8080\"\n      - \"8001:8001\"\n  kie-server:\n    image:\
  \ quay.io/kiegroup/kie-server-showcase:7.73.0.Final\n    ports:\n      - \"8180:8080\"\
  \n      - \"8007:8001\"\n    environment:\n      KIE_SERVER_ID: sample-server\n\
  \      KIE_SERVER_LOCATION: http://0.0.0.0:8180/kie-server/services/rest/server\n\
  \      KIE_SERVER_CONTROLLER: http://0.0.0.0:8080/business-central/rest/controller\n\
  \      KIE_MAVEN_REPO: http://0.0.0.0:8080/business-central/maven2\n    depends_on:\n\
  \      - business-central\n```\n\n图 10.24 – 运行 Business Central 和 KIE Server 的 Docker\
  \ Compose 文件\n\n- 2. 如果我们快速阅读一下，有一些设置是熟悉的（Business Central 镜像和端口号），有些是新的（下载和运行 KIE\
  \ Server）。\n- 3. 由于我们有两个镜像，每个镜像都在自己的容器中隔离，它们使用一个假想的网络（地址为 0.0.0.0）相互通信。你的网络管理员可能会建议更改此设置（例如，改为计算机的\
  \ IP 地址），但对于大多数人来说，此处使用的默认值将正常工作。\n- 4. 如果尚未保存，请将此文件保存在你会记住的位置。确保文件名完全相同，全部小写：docker-compose.yml。\n\
  - 5. 要检查 Windows 是否未修改文件名，请打开 Windows 文件资源管理器，确保可以看到文件扩展名（打开选项并取消选中“隐藏已知文件类型的扩展名”旁边的复选框）。这允许你检查拼写是否与上一步完全相同。\n\
  - 6. 在文件名下方空白处右键单击，然后选择打开终端的选项。\n\n> **如果我没有“打开终端”选项？**\n> 就像之前一样，我们仍然可以使用 Windows\
  \ + R 打开系统终端，输入 cmd，然后按 Ok。我们可以使用 cd（更改目录）命令移动到我们保存文件的位置。\n> 在以下示例中，你必须输入 cd C:\\\
  Users\\paulf\\OneDrive\\Downloads – 但请注意，你计算机上的名称会不同。\n\n7. 通过在控制台中输入 dir 命令，然后按\
  \ Enter，检查我们是否在正确的位置（并且文件名正确）。你应该会看到类似于图 10.25 的内容：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_286_0.png)\n\
  \n图 10.25 – 确保我们的终端在正确的位置打开\n\n8. 确保我们的 .yml 文件的拼写完全相同，全部小写：docker-compose.yml。\n\
  \n9. 现在我们确定在正确的目录中，输入以下命令以使用此 Docker Compose 文件中的设置运行：docker-compose up（然后按 Enter）。\n\
  \n10. 你可能会收到一条要求先登录的消息。如果收到此消息，请输入 docker login，然后在提示时提供你的用户名和密码。登录后重复第 9 步。\n\n\
  11. 就像我们运行之前的镜像一样，Docker 会检查本地副本，然后在需要时获取 KIE Server 镜像。第一次下载可能需要几分钟。你会在控制台中看到进度消息。\n\
  \n12. 你可能会收到一条消息，称镜像名称与你计算机上已有的镜像名称冲突。如果发生这种情况，请打开 Docker Desktop，删除之前的镜像和容器副本，然后再次尝试\
  \ docker-compose up。\n\n13. 当控制台中的消息数量变慢时，值得打开 Docker Desktop 以检查一切是否已正确启动。你应该会看到图\
  \ 10.26 所示的屏幕：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_286_1.png)\n\n图 10.26\
  \ – Docker Desktop 显示我们使用 Docker Compose 启动的两个镜像\n\n14. 检查两个容器是否都正确运行 – 在图 10.26\
  \ 中，两者都是绿色（正在运行）。我们可以像之前一样看到 Business Central 正在运行，以及我们新的 KIE Server 镜像正在旁边运行。\n\
  \n### Docker Compose 只需一次\n\nDocker 的一个怪癖是 Docker Compose 只需第一次下载和运行镜像 – 之后，我们可以在\
  \ Docker Desktop 中启动和启动容器，就像我们之前的示例一样。由于运行两个 Docker 容器相当占用资源，你可能会选择在处理另一个时停止一个以加快速度。不要忘记在需要时再次启动容器！\n\
  \n- 15. 为证明我们已启动并运行 KIE Server，请打开 http://127.0.0.1:8180/kie-server/services/rest/server。\n\
  - 16. 你可能需要使用用户名/密码 krisv/krisv 登录，然后你将被 KIE Server 功能的摘要迎接，如图 10.27 所示：\n\n```\n\
  <response type=\"SUCCESS\" msg=\"Kie Server info\">\n  <kie-server-info>\n    <capabilities>KieServer</capabilities>\n\
  \    <capabilities>BRM</capabilities>\n    <capabilities>BPM</capabilities>\n  \
  \  <capabilities>CaseMgmt</capabilities>\n    <capabilities>BPM-UI</capabilities>\n\
  \    <capabilities>BRP</capabilities>\n    <capabilities>DMN</capabilities>\n  \
