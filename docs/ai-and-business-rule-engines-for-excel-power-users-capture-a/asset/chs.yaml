  \ 来绘制图表。\n- 输出——以等宽字体显示的单元格后的文本，以 `Requirement already satisfied` 开头。在图 11.6 中，我们保留了显示我们已拥有\
  \ Matplotlib 的输出。\n\n如果您在 GitHub 上查看此示例，您将看不到运行示例所需的 **Execute ▶** 按钮。如果您已经使用过 GitHub\
  \ Codespaces（参见附录 B），您会知道我们可以很容易地解决这个问题：\n\n1. 转到 GitHub 上项目的首页并单击绿色的 **Code** 按钮。\n\
