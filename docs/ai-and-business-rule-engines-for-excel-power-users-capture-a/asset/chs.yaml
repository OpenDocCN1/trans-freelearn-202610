  \    </location>\n    <mode>DEVELOPMENT</mode>\n    <name>sample-server</name>\n\
  \    <id>sample-server</id>\n    <version>7.73.0.Final</version>\n  </kie-server-info>\n\
  </response>\n```\n\n图 10.27 – 完整的 KIE Server 正在运行\n\n从此摘要可以明显看出，完整的 KIE Server 比\
  \ KIE Sandbox 具有更多功能。我们想向你展示服务器，以便你知道有一个功能齐全的平台可以部署到，随着你开始为业务构建更高级的决策模型。如需了解 KIE\
  \ Server 提供的全方位选项的更多信息（包括如何将模型从 Business Central 部署到此服务器），请查看 KIE 文档。\n\n本着解释部署有多容易的精神，让我们快速了解一下我们如何使用\
  \ Docker 将 KIE Server 部署到 Microsoft Azure 云。\n\n### 我们可以将 KIE Server 部署到 Azure 或其他云提供商吗？\n\
  \n如果我们只能选择一个云服务提供商来托管 KIE Server，那就是 Red Hat OpenShift。这是因为它具有集成（例如 KIE Sandbox\
  \ 与 OpenShift 沙箱之间的集成），使决策模型部署变得更加容易。\n\n\n\n\n\n而且如果你迁移到付费服务层，Red Hat OpenShift\
  \ 提供托管服务，因此你只需部署模型，而非整个决策服务层。这更具成本效益。\n\n然而，很可能出于战略原因，你的组织已经选择了单一的云服务提供商。好在，我们可以利用\
  \ Docker 容器的强大功能部署到所有其他主要云提供商（包括 Google Cloud Platform 和 Amazon Web Services）。本节中给出的步骤侧重于\
  \ Azure，因为你的组织很可能为 Office 365 平台与微软签订了订阅。\n\n说明使用 Docker 命令行，因为我们想向你展示只需四步即可快速部署到\
  \ Azure。 由于大多数 Azure 新手更喜欢基于 Web 的界面，类似的选项也可通过 Azure 门户 https://azure.microsoft.com\
  \ 获取，免费积分和入门教程。 我们将在第 11 章更详细地探讨 Azure 门户。\n\n### 你可能已经在 Azure 上部署了\n\n如果你按照附录 B\
  \ 中的说明操作，你可能已经在 Azure 上部署了规则——使用 GitHub Codespaces 和 VS Code 在线会自动为你创建一个 Azure 容器。\
  \ 该容器针对规则的开发和编写进行了优化，不适合日常业务使用。\n\nDocker 工具与 Azure 高度集成。 如果你拥有 Azure 账户并设置了 Azure\
  \ Container Instance (ACI) 在线托管 Docker 容器，以下四个步骤将允许你将容器部署到 Azure 云中：\n\n- 1. 如同我们之前的示例一样，在笔记本电脑上打开命令提示符。\n\
  - 2. 使用 `docker login azure` 登录 Azure。\n- 3. 使用 `docker context create aci myacicontext`\
  \ 创建一个在线容器来托管我们的镜像。\n- 4. 使用 `docker --context myacicontext run -p 80:80 hello-world`\
  \ 命令在 Azure 上运行容器。\n\n你会注意到，在我们的说明集中，我们部署的是 hello-world 镜像，而不是本章前面使用的 KIE Server\
  \ 或 Business Central 镜像。 这就像把一辆 F1 赛车的钥匙交给你——你知道如何驾驶 Azure，但请在冲出去之前先暂停一下。\n\n我们希望你在部署\
  \ KIE Server 到云中之前先三思而后行。 特别是，熟悉 Azure 安全功能，了解计费和预算影响，并选择合适的 Docker 镜像进行部署。 本章中使用的镜像针对易用性而非安全性进行了优化，因此请查阅\
  \ KIE 文档，了解哪些其他镜像最能满足你的需求。\n\n部署 KIE Server 与我们列出的四个步骤类似，只是我们部署的是 *kie-server* 镜像而不是\
  \ *hello-world*。 现在我们知道可以把 KIE Server 部署到云中，是时候提醒自己一下本书中涵盖的所有部署选项了。\n\n### 决策模型部署选项汇总\n\
  \n早在 *第 2 章*，我们就向你承诺了运行决策模型的四种主要方式。 现在我们已经完成了将规则部署到基于 Docker 的服务器的工作，让我们再次回顾这些选项。\
  \ 我们部署规则的选项包括以下内容：\n\n- - *使用基于 Web 的规则编辑器运行 KIE Sandbox*：我们自 *第 3 章* 和 *第 4 章*\
  \ 起在本书的大部分内容中都使用了此解决方案，因为它非常容易上手。\n- - *在你自己的笔记本电脑或其他可访问的计算机（服务器）上运行容器*：我们在本章和 *附录\
  \ C* 中详细介绍了这些方法，容器为我们提供了广泛的部署选项。\n- - *在云中运行镜像（由 Microsoft 或 IBM/Red Hat 托管）*：我们在\
  \ *第 5 章* 中介绍了这种方法，当时我们将规则部署到 OpenShift。 我们在 *第 9 章* 和 *附录 B* 中扩展了这种方法，将其部署到 Azure\
  \ 上的 Codespaces 和 VS Code 在线。 本章介绍了使用容器的更多云端选项。\n- - 我们仍有最后一种方法，即 *自行搭建技术栈*：虽然我们不会涵盖这一点，但也许你比刚开始阅读本书时更有信心去探索这个选项。\
  \ 我们建议将 KIE 文档作为下一步。\n\n### 总结\n\n本章为你提供了另一种访问 Scenario Simulation 工具的选项，这次使用 Business\
  \ Central。 由于我们运行 Business Central 的方法依赖于 Docker，我们利用容器技术探索了部署 KIE Server 镜像的多种方式，从笔记本电脑本地到扩展到云端部署。\
  \ 这让我们确信，随着决策模型的使用增长，我们在组织内部编辑和部署业务规则的选项还有很多。\n\n我们将在 *第 12 章* 重返 Business Central，在那里我们将其作为展示一些高级规则编辑技术的平台。\
  \ Docker 在下一章中也将派上用场，我们将使用它来托管机器学习的 Docker 镜像。 我们还将重返 Azure，使用 Machine Learning\
  \ Studio 作为训练模型的工具。\n\n本书的重点是 AI 中的基于规则的决策模型。 但如果我们不涉及 AI 的另一个主要领域——机器学习，那就说不过去了。\
  \ 在下一章中，我们将学习如何结合两种 AI 方法的优点，利用 KIE 提供的工具。\n\n## 11\n\n## 基于规则的 AI 和机器学习 AI——结合两者之长\n\
  \n当我们在 *第 1 章* 中将规则引入为本书对 **人工智能（AI）** 的主要方法时，我们提到 **机器学习（ML）** 是一种互补技术。 自那以后，我们花了\
  \ 10 章的时间专注于业务规则并将其与 Excel 集成。 所以，是时候我们重返 AI 的 ML 方面了——重点是如何结合这两种 AI 方法，以在你的业务中实现\
  \ AI 的最有效利用。\n\n采用图形化方法，我们将基于我们在线巧克力店的示例数据探索 ML 背后的思路。 我们将介绍笔记本、Python 和 **Azure\
  \ Machine Learning（Azure ML）**，并应用这些工具训练一个简单的 ML 模型。 我们将把训练好的模型集成到基于规则的决策模型中，以改进我们在\
  \ *第 4 章* 中首次遇到的推荐示例。 最后，由于本章篇幅有限，更多是为进一步学习打开大门，我们将指明你在 ML 之旅中可以探索的其他技术解决方案和选项。\
  \ 具体来说，我们将探讨以下主题：\n\n- - 业务规则作为机器学习的准备\n- - 机器学习的图形化介绍\n- - 在 Azure ML 中训练模型\n-\
  \ - 部署两种 AI（机器学习和规则）\n- - 运行我们的集成模型\n\n首先，我们将首次了解机器学习，并看看基于规则的 AI 方法如何帮助你的组织为使用它做好准备。\n\
  \n## 技术要求\n\n本章中我们使用的所有工具和技术都可在云中使用，因此无需在笔记本电脑上安装新软件。 虽然 Azure 是一个高度复杂的产品，但它完全在线，我们将逐步指导你设置图形化机器学习笔记本。\n\
  \n有两个你在前几章中遇到过的项目值得提醒你：\n\n- - 在本章末尾，我们将使用 KIE Sandbox 将机器学习 AI 与基于规则的 AI 结合起来。\
  \ 运行 KIE Extended Services（我们在第 3 章中设置）可能会有所帮助。\n- - 像往常一样，本章的所有示例都在 GitHub 站点 https://github.com/PacktPublishing/AI-and-Business-Rules-for-Excel-Power-Users\
  \ 上。\n\n## 业务规则作为机器学习的准备\n\n在第 1 章中，我们建议结合两种 AI 方法（规则和 ML）来构建自动驾驶汽车。 ML 方法非常适合模糊的需求（例如识别道路上站着的是狗还是孩子）。\
  \ 规则更适合我们能够明确表述且必须始终实施的需求（例如，避让孩子但不要为动物避让，因为这可能导致更严重的事故）。\n\n你的组织应采用类似的方法——有些规则可以由人类专家明确编写（例如，购房者必须为房屋贷款提供\
  \ 20% 的首付款）。 而有些经验更难表达——一位资深银行官员可能感觉贷款申请有欺诈嫌疑，需要进一步调查，但可能难以准确解释原因。 在我们的业务中，我们很可能需要规则和机器学习方法来模仿这两类知识。\n\
  \n先从哪种方法开始？ 除非你是 Google、Amazon 或 Meta（Facebook），否则你的组织不会拥有训练尖端 ML 模型所需的数百万（甚至数百或数百万）示例。\
  \ 即使是银行，一年也可能只看到数千份贷款申请。 但大多数企业都会有一位了解这些申请规则的专家——这使得基于规则的方法成为显而易见的起点。\n\n但阻碍组织采用机器学习的不仅仅是数据缺乏。\
  \ 稍后在本章中，我们将一步完成 ML 模型的训练。 那么，为什么不是更多组织使用它们呢？ 说白了，问题在于收集和准备数据所需的时间和步骤，以及之后如何利用模型的建议。\n\
  \n组织不会专门组建团队来收集和准备数据，除非他们知道它会很有价值。 但组织在实际训练模型之前并不知道哪些数据有价值。\n\n请记住，ML 项目更像耕种（你准备土地，然后希望获得收成），而不是建筑（这是企业\
  \ IT 部门非常擅长的）。\n\n\n\n简而言之，规则让你能够展示 AI 的价值，同时让团队就位以收集转向机器学习所需的数据。你将在本章后面看到，我们将用在线巧克力店来采用这种方法。但在到达那一点之前，先做一个快速的机器学习图形介绍是值得的。\n\
  \n## 对机器学习的图形介绍\n\n不要害怕数学——它只是数字而已。由于每个数字都可以在图表上绘制，我们可以将机器学习视为模式、图像以及教会计算机识别这些图像。\n\
  \n虽然这种方法很简化，但事实是，没有人足够聪明，能够完成机器学习所需的全部数学运算。即使你完全理解其背后的理论，人脑也不可能在某些 ML 项目中使用的数据点的数万亿（没错——万亿）个维度中思考。而且即使我们做到这一点，所需计算的\
  \ sheer 体量也需要比人类一生更长的时间来完成。\n\n幸运的是，机器学习中的 *machine* 意味着有工具可以帮助我们。有可用的预构建工具包（库），我们将用它们来训练我们的模型。虽然了解每个工具包的优势是有帮助的，但你可以用以下方法走得很远：\n\
  \n- 1. 收集并准备我们的数据，然后将其拆分为训练集和测试集。\n- 2. 在高层理解不同的算法，并选择三到四种最有可能给我们结果的算法（即使我们仍不完全确定哪一种）。\n\
  - 3. 根据数据训练一个推荐模型。\n- 4. 使用测试集数据，查看模型表现如何。\n- 5. 选择表现最好的模型并部署用于日常使用。\n\n微软和其他厂商甚至有工具来帮助自动化选择和测试最佳模型的过程。虽然本章只是介绍，但我们使用的工具包允许你进行实验并为你的数据找到最佳方法。让我们开始处理我们自己的数据——从我们在前几个示例中见过的在线巧克力店开始。\n\
  \n## 查看我们在线巧克力店的销售数据\n\n假设我们为巧克力店实施了我们在前几章中讲解的基于规则的推荐引擎，并且推荐效果非常好，以至于我们的销售额超出了预期。我们现在有数十万客户，当我们运行销售报告以查看不同国家哪些产品最受欢迎时，我们得到一个类似图\
  \ 11.1 所示的表格（仅显示许多行中的前 11 行）：\n\n| Order | Country | Customer Age | Country-Region\
  \ Code | Qty Silk Tray | Qty Lumpy Bar | Qty Peanut | Qty |\n|---|---|---|---|---|---|---|---|\n\
  | 1 | South Africa | 64 | 396 | 80 | 31 |  | 552 |\n| 2 | Netherlands | 44 | 214\
  \ | 55 |  |  | 166 |\n| 3 | South Africa | 63 | 400 | 79 |  |  | 237 |\n| 4 | New\
  \ Zealand | 56 | 228 | 70 |  |  | 210 |\n| 5 | South Africa | 72 | 398 | 91 |  |\
  \  | 548 |\n| 6 | United States | 80 | 139 | 100 |  |  | 300 |\n| 7 | Japan | 87\
  \ | 300 | 109 |  |  | 110 |\n| 8 | Ireland | 59 | 411 | 74 |  |  | 444 |\n| 9 |\
  \ South Africa | 64 | 402 | 81 |  | 55 | 244 |\n| 10 | United States | 68 | 122\
  \ | 86 |  |  | 260 |\n| 11 | Japan | 62 | 329 | 78 |  |  | 468 |\n\n图 11.1 – 我们在本章中将使用的部分示例数据\n\
  \n这些信息非常有价值——以前，我们的决策是基于我们在 *Wikipedia* 上找到的信息做出的最佳猜测。现在，我们知道人们真正想要什么。而且随着我们深入调查，肯定会有一些惊喜。\n\
  \n> **谨防 HIPPOs**\n> 分享这些信息时要小心——大多数公司都有 **高薪人士的意见（HIPPOs）**，它们可能正确也可能不正确，但往往很难改变。\n\
  \n你会注意到我们已经开始处理这些数据。我们根据出生日期计算了客户年龄，并在示例中为客户分配了国家-地区代码（在我们的示例中，地区代码在 100 左右的是美国，地区代码在\
  \ 400 左右的是南非）。我们还将销售额按产品线拆分到不同的列中。这些更改很有用，因为 ML 模型需要数字作为输入，但同时（正如我们很快会看到的）它们使我们的数据更容易绘制图表。\n\
  \n如果你愿意，可以从 GitHub 页面下载我们用于生成图表的数据副本。图表在 `11_ML_learning.xlsx` 中，还有一个 CSV 等价物（用逗号分隔的文本版本），对我们的工具包来说更容易使用。\n\
  \n> **关于示例数据的健康警告**\n> 本章示例使用虚构数据并不奇怪，这是一个约 100 行的简单数据集，旨在使我们的示例更清晰。真实生活中的数据会大得多、嘈杂得多，清晰的模式更少，但关于每个客户的信息也会多得多。\n\
  > \n> 简而言之，请不要基于此信息或分析开设网络商店。相反，请将其作为灵感来更详细地探索你自己的信息。\n\n使用示例图表，让我们在 Excel 中绘制一个简单的散点图，如图\
  \ 11.2 所示。我们对数据进行了一些过滤，只显示两个产品线的销售额。我们可以识别出两个清晰的集群——美国人（记住他们在我们的数据中地区代码在 100 左右）倾向于大量订购\
  \ Peanut Candy 棒。而南非人（地区代码在 400 左右）倾向于订购较小的 Lumpy Raisin and Nut 棒。\n\n在对现实的极小致敬中，我们在南非有一笔\
  \ Peanut Candy 棒的销售——也许是有人从纽约搬到约翰内斯堡学习。这不会影响我们的分析，但有时你可能需要从数据中删除此类异常值：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_295_0.png)\n\
  \n图 11.2 – 我们的销售数据绘制为散点图\n\n你会注意到在图 11.2 中，我们在图表上画了一条线来分隔两个集群。鉴于我们简单的图表，线以上的任何订单很可能都是\
  \ Peanut Candy，线以下的任何订单很可能都是 Lumpy 巧克力棒。因此，对于新客户，我们可以根据他们的国家代码和订单数量基于此简单模型做出推荐。\n\
  \n这条线可以用公式 x=3y 绘制。不要担心公式本身——记住这是虚构数据。重要的是我们可以画一条线来分隔这两个组。一旦我们知道公式是什么，我们就可以根据他们落在线的哪一侧来为新客户做出预测。这就是\
  \ ML——学习在哪里画线。\n\n到目前为止，我们的集群很容易识别，但我们已将信息过滤到两种产品。如果我们将 Silk Tray 销售添加到图表中，情况会混乱得多，如图\
  \ 11.3 所示：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_296_0.png)\n\n图 11.3 – 包含\
  \ Silk Tray 数据的销售数据图\n\n不要太努力在 *图 11.3* 中寻找模式——我们无法画一条线来分隔组。数据，尤其是美国销售数据（图表左上部），看起来非常混乱。\n\
  \n然而，如果我们向图表引入另一个特征（或维度），情况会清晰得多。在 *图 11.4* 中，你会看到我们添加了更多信息（客户年龄）将图表从 2D 移至 3D。\n\
  \n> **绘制图表的其他工具**\n> \n> Excel 很棒，但没有简单的方法来绘制 3D 散点图（甚至 4D，如果允许我们下一个图表中使用的颜色）。我们将在下一节介绍我们用于绘制此图表的\
  \ Python 笔记本。你将能够修改和旋转图表视图以检查数据。\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_296_1.png)\n\
  \n图 11.4 – Silk Tray 数据的 3D 散点图\n\n我们已仅过滤 Silk Tray 销售并旋转了图表视图。现在很清楚客户年龄是一个强预测因子——从左下到右上有一条趋势线显示，年长的客户更有可能购买\
  \ Silk Tray。\n\n这个例子展示了 ML 的三个关键点：\n\n- 选择合适的图表会揭示很多，就像选择合适的算法会使我们数据中的模式更清晰一样。\n\
  - 更少的信息有时意味着更清晰——过滤我们的数据可以帮助我们看到潜在模式。\n- 更多特征（或维度）通常使区分组更容易。\n\n大多数人可以从 2 到 3 维思考，但很难可视化\
  \ 4 维，甚至 40 维。幸运的是，我们可以用计算机完成大部分工作，这也很好，因为有些模型（如 GPT-4）实际上有效拥有 1.4 万亿个维度来处理。\n\n\
  在图 11.5 中，我们添加回了其他产品并尝试根据客户年龄、客户位置和订单规模对它们进行分组：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_297_0.png)\n\
  \n图 11.5 – 具有可能客户分组的 3D 散点图\n\n使用此图表，如果我们知道客户年龄、客户地区代码和订单规模，我们可以预测订单的主要部分会是什么：\n\
  \n- Peanut Candy——如果订单数量很高\n- Lumpy Bar——如果订单来自南非\n\n\n\n\n\n- Silk Tray——适用于所有国家/地区的老年客户，如果我们不确定推荐什么，这也是一种安全的猜测\n\
  \n这些线条在图表上很清晰，但我们如何将其描述为计算机可以用来自行预测的数学公式呢？幸运的是，有工具包可以帮助机器学习公式。我们将使用交互式 Python 笔记本来尝试这些工具包。\n\
  \n> **使用机器学习还是业务规则？**\n> \n> 我们的样本足够简单，您也可以将其作为业务规则实现——毕竟，我们仅用三条要点就描述了推荐模型。在下一章中，我们将认识到\
  \ *决策树* 算法，它可以帮助我们发现数据中隐藏的业务规则。\n> \n> 并非所有数据集都适合这种方法。现实生活中的数据会复杂得多，更适合机器学习。\n\n\
  ## 介绍笔记本和 Python\n\n我们在 *图 11.4 和 11.5* 中绘制的图表都是使用 Python 脚本在笔记本中绘制的。值得一看一下笔记本，以便熟悉格式，因为我们稍后将使用笔记本来训练我们的\
  \ ML 模型。我们用来绘制 3D 图表的笔记本位于 Packt Publishing 样本 GitHub 站点上。`c11_scatter.ipynb` 文件的开头如下所示：\n\
  \n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_298_0.png)\n\n图 11.6 – 用于生成 3D 散点图的 Python\
  \ 笔记本\n\n如果您查看图 11.6 中的笔记本，您会看到它混合了以下内容：\n\n- 文本，解释笔记本的作用。\n- 单元格，浅灰色。这些有点像 Excel\
