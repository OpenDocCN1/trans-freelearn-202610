  \ Python 将几个易于使用的组件组合在一起。 |\n\n表 11.1 – 执行组合规则和 ML 模型的选项\n\n正如我们将在 *第 12 章* 运行 Kogito\
  \ 附带的完整 PMML 示例时看到的那样，执行组合规则和 ML 模型的能力已经可用。挑战在于使其易于被 Excel 高级用户使用——因此，在下一章中，我们还将基于我们已经掌握的\
  \ Power Automate 和 Python 知识，提出一种易于使用的方法。在我们探讨这一点之前，让我们先总结一下本章所学的内容。\n\n\n\n\n\n\
  ### Summary\n\n本章所涵盖的主题是机器学习本质上就像在图表上画一条线的想法，而学习的部分则是教机器找到这条线应该放在哪里。我们通过基于朴素贝叶斯的简单学习模型进行了讲解，并在实现该模型的笔记本中，标出了可以插入其他算法的位置。我们在\
  \ Azure ML 上运行了该笔记本并生成了一个图表，以测试我们的预测是否与预期一致。\n\n将训练好的模型导出为 PMML 文件后，我们将其纳入了一个基于规则的决策模型。我们使用这种技术更新了之前的巧克力棒推荐服务，并展示了构建结合两种\
  \ AI 类型优势的模型是完全可行的。最后，我们讨论了作为 Excel 高级用户执行这些组合模型的选项。\n\n在下一章也是最后一章中，我们将继续介绍高级主题以供进一步探索。该章将扩展我们在本章中初步涉及的几个主题——包括神经网络、可解释\
  \ AI，以及在企业环境中部署组合的机器学习和基于规则的模型。\n\n### Further reading\n\n本章的写作目的是让你对机器学习充满信心并产生了解更多欲望。我们介绍了几个关键主题，你的兴趣可能会引导你深入其中，从了解更多关于\
  \ Azure 和 Azure ML，到深入 Python 笔记本及其实现的各种算法。所有这些主题在 Packt Publishing 都有相关书籍可供阅读。\n\
  \n此时，重新查看 Kogito 和 Drools 文档也很有价值，重点关注 AI 工具和集成，因为其中的大部分信息现在对你来说会更有意义，同时也能提供将规则和机器学习决策服务组合部署到生产环境的实用步骤。\n\
  \n我强烈推荐的一本非 Packt 出版的书籍是 *Mathematics for Machine Learning*。它可在 `https://mml-book.github.io/`\
  \ 免费/开放获取。虽然写得非常清晰易懂，但它仍然是一本数学书。因此，虽然阅读起来引人入胜并能提升你对机器学习的知识，但对于理解本章介绍的技术来说并非必需。\n"
