  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n## 前言\n\n> *想象一个没有 Excel 的世界。对我来说那是不可能的。*\n\
  > \n> *萨蒂亚·纳德拉，微软 CEO*\n\n我们大多数人都同意微软 CEO 萨蒂亚·纳德拉的看法。如果你把类似的产品也算进去（而谷歌没有公布 Sheets\
  \ 的确切数字），那么有超过十亿人离不开 Excel 或类似的电子表格来组织我们的日常工作以及职业和个人生活。\n\n但你是这十亿人组成的群体中的特殊一员。你是\
  \ Excel 高级用户群体中的一员，不断挑战这个工具的极限。你是同事们遇到最棘手的 Excel 问题时求助的人，而你能解决这些问题。你知道事情一定能在 Excel\
  \ 中完成，即使需要深入网络的某个角落才能找到答案。你的关键知识支撑着企业的运转——所有这些都保存在可靠的 Excel 文件格式中。\n\n如果你在读这本书，你清楚自己遇到了问题。Excel\
  \ 将永远是你工作生活的核心部分——但你知道它可以变得更好。你已经记不清花多少小时去寻找别人在表格中引入的错误。你厌倦了向同事解释表格实际上是如何工作的，而且你怀疑他们没有在听，只是为了避免承担维护它们的负担。在一个\
  \ AI 无处不在的世界里，你当前的 Excel 解决方案可能需要太多的人工干预。\n\n这本书建议在现有 Excel 知识的基础上，寻找一种更好的方式。\n\n\
  # 本书适合的读者\n\n虽然会有十亿人从这本书中受益，但写作时主要考虑了三类人群：\n\n- 已达到 Microsoft Office 365 极限并想知道下一步的\
  \ Excel 高级用户，尤其是随着 AI 工具变得越来越强大。\n- 寻找工具来捕获知识并将其部署到企业级系统中的业务分析师和知识工作者。\n- 正在加入使用决策模型的现有规则、AI\
  \ 或工作流项目的人，因为很多工具可能已经设置好了；他们会发现 DMN 和 FEEL 的介绍特别有用。\n\n\n\n\n\n其他人也会觉得这本书很有用，例如正在寻找预测模型规则化安全网的机器学习专家。这本书对那些希望以更结构化的方法实现\
  \ AI 和业务逻辑的开发者也很有价值，无论他们使用什么语言。\n\n## 何时阅读本书\n\n什么时候读？快速的答案是现在。越来越多的企业正在转向线上并采用数字工具——这还不包括\
  \ AI 对大多数办公室工作的冲击浪潮。\n\nExcel 是这一转变的绝佳起点，但迟早，你需要通往更强大解决方案的途径。本书为你提供了一条清晰的途径。它还有一个额外的好处：以\
  \ when ... then 格式捕捉你的知识，可以将业务知识与技术实现分离，使你的投资更有可能延续到未来。\n\n## 本书涵盖内容\n\n第 1 章，Wrestling\
  \ with Excel? You Are Not Alone，概述了你在 Excel 中可能遇到的各种问题，但向你保证你并非唯一遇到这些问题的人，并展示了基于\
  \ AI 的规则方法如何提供帮助。\n\n第 2 章，Choosing an AI and Business Rules Engine – Why KIE and\
  \ Drools?，展示了为什么 KIE 项目提供的规则引擎和 AI 工具是 Excel 用户的最佳选择，并欢迎你加入由 IBM 和 Red Hat 支持的开放社区，在其中你可以获得持续支持。\n\
  \n第 3 章，Your First Business Rule with the Online KIE Sandbox，深入讲解如何编写业务规则并在在线 KIE\
  \ 沙盒中使用经典的 Hello World 示例创建你的第一个决策模型。\n\n第 4 章，More Decision Models, Business Rules,\
  \ and Decision Tables，扩展了你对决策模型的知识，并构建了一个可运行的巧克力店示例，以展示更多可用工具。\n\n第 5 章，Sharing\
  \ and Deploying Decision Models Using OpenShift Cloud and GitHub，探讨如何使决策模型可共享，允许其他人将其在云中运行，并使用在线工具与同事协作设计模型。\n\
  \n第 6 章，Calling Business Rules from Excel Using Power Query，使用 Excel 内置的 Power Query\
  \ 工具将 Excel 与我们的 AI、规则和决策表连接起来。\n\n第 7 章，Using Business Rules in Excel with Visual\
  \ Basic, Script Lab, and Office Script，提供了三种基于脚本的替代方法，让你有更多选择来将 Excel 与业务规则连接。\n\
  \n第 8 章，AI and Decision Services within Excel and Power Automate Workflows，介绍了微软的业务自动化工具，并展示了如何使用我们的模型在流程的关键点做出决策。\n\
  \n第 9 章，Advanced Expressions, Decision Models, and Testing，探索了 KIE 内置表达式语言的全部功能，并介绍了场景测试工具，以便我们可以保证决策模型按预期运行。\n\
  \n*第 10 章，Scaling Rules in Business Central with Docker and the Cloud*，展示了 KIE 和\
  \ Kogito 决策工具的强大功能，利用容器来增加部署选项和编辑能力。\n\n*第 11 章，Rules-Based AI and Machine Learning\
  \ – Combining the Best of Both*，介绍了 AI 的另一主要部分，并展示了如何使用 KIE 和 Azure ML Studio 中的工具将机器学习和基于规则的决策模型并排部署。\n\
  \n*第 12 章，What Next? A Look Inside Neural Networks, Enterprise Projects, Advanced\
  \ Rules, and the Rules Engine*，扩展了前几章的内容，并为未来学习提供了关键领域，以及关于神经网络、企业 Java 项目和合乎伦理、可解释\
  \ AI 的实用第一步。\n\n*附录 A，Introduction to Visual Basic for Applications*，介绍了足够多的 **Visual\
  \ Basic for Applications (VBA)**，以便那些对该语言不熟悉的人能够理解 *第 7 章* 中 VBA 示例。\n\n*附录 B，Testing\
  \ Using VS Code, Azure, and GitHub Codespaces*，介绍了微软的 **Visual Studio Code (VS Code)**\
  \ 编辑器——虽然它比本书主要章节中的工具更高级，但许多人会欣赏其在 Azure 和 Codespaces 中进行测试和构建项目的强大功能。\n\n*附录 C，Troubleshooting\
  \ Docker*，支持 *第 10 章* 中给出的说明；大多数人不需要它，并且会体验到顺利的 Docker 安装——但如果需要，这里有支持是件好事。\n\n\
  ## 如何充分利用本书\n\n就像知道如何打开汽车的引擎盖（发动机舱盖）来更换机油和火花塞一样，能够打开 Excel 的引擎盖会给你带来更多力量。本书将逐步带你完成这一过程，并以\
  \ Excel 高级用户易于理解的方式解释事物。但请注意，你有时会弄脏手——并非一切都像微软交付 Office 应用那样整洁。\n\n要充分利用本书，需要满足以下要求：\n\
  \n你应该熟悉 Excel——例如，知道什么是电子表格，如何打开文件、输入公式、保存和重命名文件等等。没有必要是高级用户（例如，使用高级公式、Excel 的 Visual\
  \ Basic 或其他脚本工具），但尝试过这些工具将有助于你欣赏本书中提供的业务规则的全部威力。\n\n你应该非常熟悉使用网络浏览器。虽然本书以不比典型旅行预订网站更复杂的方式描述\
  \ Business Central 和 Azure Web Portal，但我们关注页面而非浏览器，因此假定你具备适度的网络素养。\n\n你应该能够将大问题分解为小问题并逐一解决。大多数\
  \ Excel 用户在编写公式时会自然地这样做，本书假定你会使用所描述的工具来解决你的问题，而不是期望得到一个完整即用的解决方案。\n\n## 前言\n\n对于\
  \ *第 10 章*，你应该知道如何在计算机上安装软件。提供了完整的说明来安装 Docker Desktop，这是一个方便的容器，让你确信示例在你的计算机上与书中完全一样运行。你需要下载并运行图形化安装程序并解决小问题（例如，如果需要管理员密码才能继续安装）。我们也提供了替代方案，因为并非每台计算机的设置都相同，有时事情就是不奏效。\n\
  \n你应该能够寻求帮助。这可能就像搜索常见的错误信息以了解其他人如何解决问题、阅读文档（提供了指针！）以编写自己的业务规则，甚至礼貌地向更技术性的同事或开源社区成员寻求支持。\n\
  \n虽然本书假定你没有任何编码经验，并且始终提供简单、非技术性的路线，但有（额外的）附录可以让更技术性的同事在你想探索这些领域时为你提供支持。\n\n对于一本技术书籍，必须拥有的工具清单出奇地短，因为我们尽可能使用免费的在线工具。\n\
