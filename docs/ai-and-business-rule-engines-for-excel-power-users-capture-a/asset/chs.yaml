  , GaussianNB(),)])\n```\n\n## 尝试其他学习算法\n\n这是我们编辑以切换到不同方法的行。请查阅 sklearn 文档了解详情，但它们的设计易于切换。测试每一种，看看哪种最适合你。\n\
