  \ ML 模型的大部分工作在于事先收集和准备数据。\n\n9. 包含 for loop in range(1000): 的单元格基于随机数据进行 1,000 次预测，并捕获结果以便在下一步轻松绘制图表。我们不会突出显示此代码示例，因为它相当长。关键行是：\n\
  \n```\npredicted= str(model.predict([[age,country_code]]))\n```\n\n此行调用我们的模型进行预测（并将预测转换为文本）。\n\
  \n10. 从 %matplotlib inline 开始的单元格生成如图 11.16 所示的图表，以可视化这组预测：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_309_0.png)\n\
  \n图 11.16 – 朴素贝叶斯预测的预测图\n\n我们的图表应显示三种关键类型的预测：\n\n- 默认推荐，以绿色覆盖图表的大部分，客户应购买我们的 Silk\
  \ Tray 巧克力盒\n- 在右下角（基于地区 100 左右的美国老年客户），我们建议他们购买 Peanut Candy 棒\n- 在右上角的一个小区域（基于南非的老年客户），模型应建议他们购买\
  \ Lumpy Raisin 巧克力棒\n\n如果你重新打开最初使用的 CSV 文件中的数据集，你会发现这些预测与我们的训练数据一致。请注意，我们正在绘制预测结果，而不是原始训练数据——多次运行此笔记本，你会看到我们的预测每次略有变化。\n\
  \n> **预测不佳？垃圾进，垃圾出**\n> 由于有些人将 ML 视为神奇的黑箱，值得提醒自己，模型的品质仅与用于训练的数据质量一样好。\n> 在这种情况下，由于样本数据量非常小，我们需要警惕**过拟合**——模型对与我们用于训练的小批量完全相同的客户效果非常好。但模型没有经验来处理训练之外的情况，很容易感到困惑。\n\
  \n由于下一节是要结合 ML 和基于规则的 AI，我们在笔记本中的最后一步是使用以下代码行导出我们新训练的模型：\n\n```\nsklearn2pmml(model,\
  \ \"11_chocolate_recommendations.pmml\")\n```\n\n这是在 ML 中常见的模式——在一个操作中训练模型，然后在单独的步骤中部署和使用训练好的模型。使用\
  \ PMML 和 KIE 部署训练好的模型是我们下一节将要介绍的内容。\n\n快速提醒——即使你使用的是 Azure 的免费积分，现在也是一个好时机点击 Azure\
  \ 门户中的 Compute 选项卡，并关闭你的计算实例以最大限度地减少账单。\n\n## 部署两个 AI 组合（ML 和规则）\n\nML 很棒，但这本书主要是关于\
  \ AI 业务规则的。我们将两者的结合的第一步是打开并编辑我们 Azure 中的 PMML 模型，如图 11.17 所示。此 PMML 模型是在我们 Python\
  \ 笔记本的最后一步生成的。你可能需要在 Azure ML 中点击 Refresh 按钮才能看到此新生成的模型：\n\n\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_311_0.png)\n\
  \n图 11.17 – 由 ML 脚本生成的 PMML\n\n如你所见，PMML 是一种 XML 格式，在很大程度上是人类可读的。它还有一个优点，即它是一种行业标准，因此，即使该模型是由\
  \ sklearn 和 Python notebook 生成的，我们也能够将其导入 KIE 并执行。一般来说，互操作性运行得很顺畅——但有点类似于组装宜家（Ikea）的柜子，有时需要用木槌轻轻敲几下才能把所有部件安装到位。\n\
  \n在我们的案例中，需要对 PMML 文件进行两处编辑，以便 Kogito 能够使用它：\n\n-   在第二行，将版本号（4_4）改为 Kogito 支持的版本号。在撰写本文时，这个版本是\
  \ 4_2。这一行中列出该版本号两次——请同时修改两处，使其成为 <PMML xmlns=\"http://www.dmg.org/PMML-4_2\" xmlns:data=\"\
  http://jpmml.org/jpmml-model/InlineTable\" version=\"4.2\">。\n-   找到以 <NaiveBayesModel\
  \ 开头的行，并编辑它以使其以 <NaiveBayesModel modelName=\"chocolateRecommendation\", 开头，保持该行其余部分不变。这会告诉\
  \ Kogito 模型的名称，Kogito 将在决策模型和表示法（DMN）编辑器中显示该名称。\n-   从 Azure ML Studio 导出编辑后的文件，并在你的笔记本电脑上保存一份副本。\n\
  \n该文件的编辑版本位于本书的 GitHub 网站上，文件名为 11_chocolate_recommendations.pmml。\n\n## 结合规则与机器学习的决策服务\n\
  \n首先，让我们向你展示我们将要构建的决策模型，它在一个决策服务中结合了规则和机器学习（ML）的优点，如图 11.18 所示：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_312_0.png)\n\
  \n图 11.18 – 结合 AI 规则和机器学习的决策服务\n\n你可能已经认出这是基于我们在第 4 章中构建的产品推荐服务。有两个关键差异，我们稍后将更详细地介绍：\n\
  \n-   我们导入一个 **RecommendedProductPMML** 外部模型，使用的模型导入技术与我们在第 9 章中使用的完全相同。该模型就是我们刚刚使用\
  \ Azure ML 训练的 PMML 模型。\n-   我们更新了 **RecommendedProduct** 节点，使其基于外部 ML 模型做出推荐（以前，我们使用决策表）。\n\
  \n没有改变的是我们决策的两步性质。我们首先推荐一个产品，然后进行第二次基于规则的检查，以确保我们不推荐可能引起健康问题的产品（例如，花生过敏）。\n\n> **规则和\
  \ ML 协同工作是一个关键概念**\n>\n> 当我第一次看到规则和 ML 以这种方式协同工作时，我非常兴奋——它非常清晰地将两种 AI 的优点结合在一起。\n\
  >\n> 我们可以使用机器学习来了解客户偏好，但仍然可以通过业务规则来保证重要规则（如健康检查）的执行。而将它们全部放在一个模型中，可以清楚地知道在我们的决策服务中实际将执行什么。\n\
  \n### 将 ML 模型导入决策模型的关键点\n\n如 *图 11.18* 所示，该模型可以下载为 `11_choc_recommendation-rules-ai.dmn`，并且可以轻松导入\
  \ KIE Sandbox。如果你希望构建自己的决策模型，可能需要导入更新的 PMML 文件，这里有一些步骤值得强调：\n\n-   1. ML 模型（PMML\
  \ 文件）可以像任何决策模型一样上传到 KIE Sandbox。上传后，模型将类似于 *图 11.19* 中显示的模型：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_313_0.png)\n\
  \n图 11.19 – KIE Sandbox 中的推荐服务\n\n-   2. 两种类型的模型都需要保存到同一个文件夹中，导入才能正常工作——在本例中，我们将该文件夹命名为\
  \ `c11`，如 *图 11.19* 右上角所示。\n\n-   3. 在我们的决策（DMN）模型中，我们需要引用新导入的 ML 文件。在 KIE Sandbox\
  \ 中，转到 **包含的模型（Included Models）** 选项卡，单击 + 图标以添加新模型，然后从下拉菜单中选择我们刚刚导入的模型。给它一个容易记住的名称，例如\
  \ CR。这些步骤与我们在 *第 9 章* 中执行的步骤相同，你的屏幕现在应如下所示：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_314_0.png)\n\
  \n图 11.20 – 在我们的决策模型中引用 ML 模型\n\n-   4. 在我们的决策模型中，我们拖入了一个新的业务模型知识节点——它是 *图 11.18*\
  \ 最左侧的节点。我们按照 *图 11.21* 对其进行编辑：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_314_1.png)\n\
  \n图 11.21 – 业务模型知识节点\n\n我们对节点进行了几处编辑，包括更改名称。我们将类型设置为 **PMML**，因此截图左上角有一个 P。这会提示\
  \ KIE Sandbox 询问我们要引用哪个文档和模型——通过随后出现的下拉菜单，我们选择了 `cr` 和 `chocolateRecommendation`\
  \ 值。\n\n我们还编辑了参数的名称和类型（Country_Code 和 Customer_Age）——KIE Sandbox 有一个编辑器可以指导你，但请确保两者与\
  \ PMML 模型中的内容一致。\n\n-   5. 对 ML 模型的实际调用是通过决策节点，即 **调用（Invocation）** 节点完成的。在我们之前在\
  \ *图 11.18* 中看到的决策模型中，它被称为 **推荐产品（Recommended Product）**。在 KIE Sandbox 编辑器中打开它，应该会显示如下内容：\n\
  \n*推荐产品（调用）*\n\n| # | 推荐产品 *（数字）* |\n|---|---|\n|  | `RecommendedProductPMML` |\n\
  | 1 | **Country_Code** *（数字）* — `=fn_convert_country_to_code(Customer.Country of\
  \ Residence)` |\n| 2 | **Customer_Age** *（数字）* — `=fn_convert_dob_to_age(Customer.Date\
  \ of Birth)` |\n\n图 11.22 – 调用节点\n\n就像我们在 *第 9 章* 中调用其他外部模型时一样，RecommendProduct\
  \ PMML 名称需要与业务模型知识节点的名称匹配，参数的名称和类型也需要完全相同。请注意，我们使用函数将出生日期和国家转换为 ML 模型期望的数值。\n\n\
  -   6. 我们不更改健康检查节点——它仍然是一个使用字面表达式的简单规则，但它也可以很容易地成为决策表或其他类型的 DMN 节点。我们在 *图 11.23*\
  \ 中再次展示它，因为它是证明 ML 和业务规则良好协作的关键部分：\n\n*经过健康检查的产品（字面表达式）*\n\n```text\nif Recommended\
  \ Product in Health Issues then \"Potential Health Issue - please check\" else Recommended\
  \ Product\n```\n\n图 11.23 – 未更改的健康检查业务规则\n\n如果我们运行这个决策服务并传入一位居住在美国的客户的大额订单，ML 模型很可能会推荐花生糖果棒。如果我们的客户已知有过敏史，我们的第二条业务规则将触发，产生\
  \ **存在潜在健康问题 – 请检查** 消息作为决策服务的推荐。\n\n### 运行我们的集成模型\n\n如你所见，KIE Sandbox 支持编辑同时包含\
  \ ML 和基于规则的元素的决策模型。到目前为止，我们理所当然地认为可以使用 KIE Sandbox *编辑*这些组合模型。\n\n*执行*组合规则和 ML 模型特性的能力已经存在于其他\
  \ KIE 决策模型工具中——例如，你可能在 *附录 B* 中使用过的 VS Code 插件。虽然它已列入路线图，将添加到 KIE Sandbox 扩展服务中，但（在撰写本文时）尚未实现。\n\
  \n虽然我们已经证明了本章的主要观点（ML 入门），并展示了这两种方法协同工作的强大威力，但这仍然是一本实用书籍。我真的很想为你留下一些工具，用于运行这些组合的\
  \ ML 和规则模型。因此，*表 11.1* 展示了你现在作为 Excel 高级用户执行这些组合模型的选择：\n\n| 运行组合 ML 和规则模型的选项 | 优点\
