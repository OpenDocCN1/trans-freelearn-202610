- '# Excel 高级用户的 AI 与业务规则引擎：将您的业务知识捕获并扩展到云端——使用 Microsoft 365、决策模型以及来自 IBM 和 Red Hat
  的 AI 工具
























  '
- "## 序言\n\n近年来，人们对 **人工智能（AI）** 的兴趣呈爆炸式增长，这让我比以往任何时候都更加坚信：基于规则的人工智能方法，连同机器学习，是 Excel\
  \ 用户最容易上手的路径。这一信念基于我和我的团队与像您这样的业务用户一起工作的经验，他们希望以易于共享和执行的方式捕获业务知识和规则。目前，社区对新一代工具尤为兴奋，这些工具让决策模型与机器学习模型的联合部署比以往任何时候都更加容易。\n\
  \n距我的第一份代码贡献被 Drools 项目团队接受已经过去约 15 年——这是一个全新的 **Drools 规则语言（DRL）** 解析器，正好赶上 Drools\
  \ 5 问世。自那时起，我有幸与业界最杰出的工程师们一起学习和工作，并有幸与一个令人惊叹的开源社区合作。\n\nDrools 已经是一个被广泛使用且成熟的开源规则引擎。社区即将发布\
  \ Guvnor——一套支持用户管理业务规则生命周期的集成工具，覆盖从编写、打包到部署的全过程。\n\n但此后发生的事情远不止于此。Drools 引擎不仅自身不断发展，还通过引入\
  \ PHREAK 算法推动了整个规则引擎和专家系统领域的进步。Drools 也是最早引入统一编程模型的项目之一，该模型让业务规则和工作流并肩运行，共享相同的概念和\
  \ API。\n\n除了运行时引擎，工具也急剧扩展。Guvnor 演变为 Business Central，一个完整的**业务规则管理系统（BRMS）**。Business\
  \ Central 曾有一个雄心勃勃的目标：提供一个用户友好的界面，让开发者和业务实践者能够协作；围绕这一目标取得了进展，为未来的改进奠定了坚实基础。\n\n\
  与所有这些进步并行的是，社区本身也在演进——从单一的 Drools 项目发展为一个领先开源项目家族，这些项目在提供业务自动化和人工智能解决方案方面发挥着重要作用，名为\
  \ KIE（Knowledge Is Everything，发音与英语单词 key (/kē/) 相同）。\n\n业务规则和 BRMS 领域的一个转折点是 OMG（**对象管理组织**）引入了**决策模型与表示法（DMN）**规范。这一强大的规范定义了决策模型的图形表示法，以及用于决策建模和运行时执行的一套语义。\n\
  \n如今，DMN 已被广泛公认为决策建模的领先标准，并被世界各地的组织用以管理其决策流程。此外，在 DMN 标准力量的推动下，与 AI 相关的决策管理学科比以往任何时候都更受欢迎。DMN\
  \ 的另一个优点是厂商中立，人们可以从不受限于任何特定厂商的从业者那里找到各种各样的培训材料、书籍、方法论和其他内容。\n\nDrools 在规范首次发布几年后引入了对\
  \ DMN 的官方运行时支持。自那时起，团队加入了 OMG，以帮助塑造规范的未来，并将对业务规则和决策高层表示的所有投入都转向 DMN。随着这一战略的落地以及\
  \ DMN 规范日益流行，KIE 社区已准备好开启新一轮创新周期……\n\nKogito 最初是一项倡议，后来也成为一个项目。彼时，所有 KIE 技术都已容器化，所有投资都以云优先为出发点。然而，团队感到有必要更进一步：我们需要一项新的倡议，以云原生的方式重新思考业务自动化。\n\
  \n这一倡议还催生了一套新工具。首先，**业务流程模型与表示法（BPMN）**和 DMN 编辑器从 Business Central 中抽取出来，并作为 VS\
  \ Code 的扩展提供。团队并未止步——我们决心让 KIE 技术更易访问，于是推出了 dmn .new，它包含一个运行器，带来一种灵感源自电子表格的动态数据输入建模体验。\n\
  \n这正是 Paul 的新书派上用场的地方：Paul 是社区资深成员，擅长用通俗易懂的语言，为从业者和高级 Excel 用户解读业务规则、决策管理和 AI 的领域。通过本书的内容，您将为自己的技能库增添新的强大工具。\n\
  \n很少有技术能在没有持续创新记录的情况下长期存活并保持其相关性。这个社区的成功很大程度上归功于其营造温暖、友好的环境的能力。Mark Proctor 是长期的朋友和导师，在领导社区方面发挥了不可或缺的作用。\n\
  \nKIE 社区有幸吸引、培养并留住了许多其他有才华的人，首先是 Edson Tirelli 和 Kris Verlaenen，他们为社区的成功奠定了基础；紧随其后的是\
  \ Mario Fusco、Maciej Swiderski 和我，我们继续拓展社区并带来新的想法和视角。如今，新一代优秀人才正在崛起，包括 Eder Ignatowicz、Tiago\
  \ Bento、Matteo Mortari、Daniele Zonca、Enrique Gonzales、Tibor Zimányi 和 Ricardo Zanini，他们代表着社区的未来，并将在未来许多年里助力社区继续蓬勃发展。\n\
  \n就在此刻，随着 IBM 加入 Red Hat 共同管理社区，KIE 社区正在开启一个激动人心的新篇章。我个人非常兴奋能分享这一新篇章。KIE 正在迁往新家：Apache\
  \ 软件基金会。在 Apache，IBM、Red Hat 和更广泛的社区（包括您）将有机会一起进一步拓展业务自动化和 AI 的边界！\n\nAlex Porcelli\n\
  \nIBM Process Automation and Decision Manager Open Edition 首席架构师\n\nIBM Business\
  \ Automation\n\n\n\n\n\n## 贡献者\n\n### 关于作者\n\n**Paul Browne** 目前是一名产品和项目经理，任职于按交易量计算的欧洲最大风投公司。最近，他领导了一个由三家合作机构组成的团队，该团队因生态系统发展而获得\
  \ EFMD 奖，培训了超过 100 家欧元区公司共同实施数字解决方案。这延续了 Paul 此前在爱尔兰、英国、美国、荷兰、比利时和新西兰的公共、金融和生命科学领域领导业务和技术项目的经验。\n\
  \nPaul 的资格包括来自 Ulster University 的欧洲商业和法语学位，以及近期的财务（ACCA）、采购（CIPS）和商业战略（ESMT）认证。他拥有微软、甲骨文和\
  \ IBM 的技术认证，并持有都柏林大学学院的先进软件工程硕士学位。\n\nPaul 也是 Packt Publishing 出版的 *JBoss Drools\
  \ Business Rules* 的作者，并在第三级讲授 Excel 和 Visual Basic。\n\n*我谨向 Drools、KIE 和 Kogito\
  \ 社区，以及 Red Hat、IBM 和 Microsoft 的团队表示感谢，他们提供了出色的 AI 和业务自动化解决方案，并在撰写本书期间给予持续支持。*\n\
