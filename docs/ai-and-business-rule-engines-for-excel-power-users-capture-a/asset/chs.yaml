- "# 更多决策模型、业务规则和决策表\n\n在上一章中，我们使用 KIE Sandbox 中的 *Decision Models* 编写了第一条业务规则。虽然那只是一个友好的问候，但该业务规则的功能并不强大。本章将探索\
  \ KIE 的其他功能，以编写更强大的业务规则，解决更多现实生活中的问题。\n\n在此过程中，我们将探索存储信息的不同格式。我们将使用 KIE Sandbox\
  \ 中的工具为这些格式建模，从而更容易理解正在处理的数据。我们将创建第一个 **决策表**，并了解它们是如何以非常强大的方式表达业务规则的。我们还将探索其他节点类型，以帮助我们处理信息并为决策表准备数据。最后，我们将组合所有这些节点类型，创建一个非常强大的决策示例。\n\
  \n我们的目标是捕获业务流程中的决策过程，以提供有用的服务。为此，我们将涵盖以下主要主题：\n\n+   - 让你的决策易于沟通\n+   - 更强大的决策节点——决策表\n\
  +   - 其他类型的决策节点\n+   - 添加节点以支持我们的决策表\n+   - 更复杂的决策表\n+   - 规则匹配与命中策略\n+   - 一个更安全的决策表示例\n\
  \n让我们首先思考如何让我们的决策服务易于使用。\n\n# 让你的决策服务易于使用\n\n你可能没有意识到，在上一章中，你已经编写了你的第一个决策服务。在 KIE\
  \ Sandbox 中运行我们的 *问候示例* 时，我们提供了输入（姓名以及是否是早上），做出决策，然后共享输出（**Good Morning** 或 **Good\
  \ Afternoon**）。\n\n虽然我们看不到很多同事会注册使用这项特定服务，但随着我们在本章中深入更复杂的示例，这种情况将迅速改变。现在值得思考的是，其他人在使用我们的服务时需要了解什么：\n\
  \n+   - 我们如何做出决策——一般来说，**决策模型与表示法（DMN）** 格式使这一点相当清晰。它肯定比其他解决方案（例如隐藏在代码或 Excel 中的函数）清晰得多。\n\
  +   - 需要传递给决策服务的数据，以及我们从中获得返回数据的格式。\n\n在我们的问候服务中，我们期望一个字符串（姓名）和一个布尔值（是否是早上——真或假）。但决策模型允许我们更具体地说明输入和输出的数据类型。这是一件好事，因为它让人们更容易使用我们的服务。\n\
  \n在开始指定期望传入决策服务以及从决策服务传回的数据之前，值得思考一下 Excel 是如何建模数据的。\n\n# ## 你的数据是什么形状——表格还是树？\n\
  \nExcel 非常出色——你从未真正需要考虑数据的形状或结构。所有 Excel 数据都是基于网格式布局的表格。一个典型的例子是 *图 4.1*——如果我们经营一家在线巧克力商店，可能会有的一张客户信息表：\n\
  \n| 客户编号 | 客户姓名 | 出生日期 | 居住国家 | 特殊请求 |\n|---|---|---|---|---|\n| 1029 | Jane Smith\
  \ | 10-Mar-2001 | Netherlands |  |\n| 2219 | Sita Patel | 18-Apr-1998 | New Zealand\
  \ | Vegan |\n| 8781 | Joseph Okoru | 22-Sep-1963 | Sri Lanka |  |\n| 1123 | Peter\
  \ Murphy | 04-Nov-02 | United States |  |\n\n*图 4.1——一张非常简单的客户表*\n\n这非常简单，在现实生活中，我们的列会比这里列出的更多——也许用来存储电子邮件、收货地址以及类似信息。但这足以展示\
  \ Excel 鼓励你使用的网格式布局。而且显然还有更复杂的工作表——例如对公司财务预测进行建模，整个工作表代表一家公司，而不是我们这里展示的每客户一行的布局。但我们的简单示例已经足以说明基于网格的数据的局限性。\n\
  \n当然，和大多数 Excel 工作表一样，它并不是一个真正的网格——**特殊请求** 的值是可选的（可以为空）。一个更大的问题（你可能已经在自己的 Excel\
  \ 工作表中遇到过）是，额外数据并不完全适合网格模式。例如，如果我们还想在此电子表格中跟踪客户订单，我们有三个选项：\n\n+   - 添加另一列存放第一笔订单，再添加一列存放第二笔订单，依此类推——我们可能会得到一个非常混乱的电子表格。\n\
  +   - 或者我们可以添加另一行（复制客户编号），并在添加的每一行中放入单独的订单详细信息。这给了我们更多存储信息的空间，但会使更新客户级别信息（如姓名）变得困难。\n\
  +   - 或者，我们可以为订单创建一个单独的表，并使用 **客户编号** 进行交叉引用。如果你使用过 SQL 数据库，就会熟悉这种方法。但将信息放在两个地方，会让人难以一次查看所有信息。\n\
  \n关键在于，数据的网格形状并不完全合适。\n\n如果我们改为尝试一种不同的树形数据形状呢？图 4.2 是客户表中一行以树形（JSON）格式表示的内容：\n\n\
  ```\n{\n  \"CustomerInfo\": {\n    \"Customer Number\": 1123,\n    \"Previous Order\"\
  : [\n      \"ord001\", \"Snap Crackle Bar\",\n      \"ord002\", \"Turkish Delight\"\
  \n    ],\n    \"Customer Name\": \"Paul Murphy\",\n    \"Special Request\": \"lactose\
  \ intolerant\",\n    \"Date of Birth\": \"2001-11-02\",\n    \"Country of Residence\"\
  : \"United States\"\n  }\n}\n```\n\n图 4.2——JSON 格式的一位客户\n\n如果你以前见过 JSON 文件，对这种布局会很熟悉，但让我们强调一下这种文件格式的一些关键特点：我们缩进了文本以使树状结构更清晰：\n\
  \n+   - 该文件只是一个具有约定布局的文本文件。它在很多方面类似于 **逗号分隔值（CSV）** 文件——另一种具有约定布局的文本文件。\n+   - 你可以在记事本或其他文本编辑器中打开和编辑\
  \ JSON 文件。图 4.2 中带有颜色高亮的效果来自 VS Code（我们将在 *第 12 章* 中再次使用该编辑器）。\n+   - 每个值都有名称——因此很容易识别关键信息，例如客户姓名。\n\
  \n+   - 虽然我们只显示客户表中的一行（因为树形格式不如网格/表格紧凑），但可以根据需要多次重复我们的 `CustomerInfo` 条目。\n+   -\
  \ 这种格式也更容易推断信息的类型（文本、数字和日期）。你还可以看到我们在哪里创建了自己的数据结构（主要的 `CustomerInfo` 结构，其中包含字符串、数字、日期，以及一个二级自定义订单结构）。\n\
  +   - 树形结构灵活得多。例如，我们能够为该客户添加多个订单。由于每个值都有名称，因此可以省略可选的 **特殊请求** 字段，而且文件仍然可读。\n\n虽然\
  \ JSON 的设计初衷是让我们人类易于阅读和编辑，但好消息是，我们几乎总会有样本文件作为起点。例如，前面展示的 JSON 格式实际上是由 KIE Sandbox\
  \ 生成的。我们将在 *第 5 章* 中连接 KIE Sandbox 到云端时展示更多相关内容。\n\n> **更多关于 JSON 的内容**\n> \n> 在上一节中，我们只介绍了\
  \ *足够的 JSON* 来为决策所需的数据建模。但 JSON 是一种广泛使用的格式，你很可能再次遇到它。如果你有兴趣了解更多，Microsoft 提供的指南相当不错，链接如下：`https://pnp.github.io/blog/post/introduction-to-json/.`\n\
  \n既然我们知道有更强大的数据格式可用，并且 KIE Sandbox 提供了数据类型编辑器来指定这些格式，那么我们如何使用该编辑器，让决策服务的其他用户更清楚地了解我们期望的输入数据格式以及我们将作为结果传回的数据类型呢？我们将通过一个示例，在编辑器中为客户数据建模。\n\
  \n## 在 KIE Sandbox 中为我们的数据建模\n\n开始为我们的数据建模：\n\n+   1. 打开 KIE Sandbox，网址为 `sandbox.kie.org`。\n\
  +   2. 在主页上，创建一个新的 **Decision**。\n+   3. 在新的决策模型中，点击 **Data Types**。你应该会看到类似 *图\
  \ 4.3* 所示的屏幕：\n\n\n\n## 图 4.3 – KIE 中的 Data Type 编辑器\n\n4. 点击 **Add a custom Data\
  \ Type** – 屏幕底部附近的蓝色方框。\n\n5. 输入名称 **tCustomer**。虽然我们可以选择几乎任何我们喜欢的名称，但开头加上的 **t**（代表\
  \ type）将使我们以后更容易将其识别为数据结构。\n\n> **What is a type?**\n> 把类型想象成一个饼干模具。用一个模具，我们可以切出并烤出任意多的饼干。\n\
  \n6. 在下拉菜单中，我们选择数据类型为 **Structure**。屏幕应类似于图 4.4：\n\n## Custom Data Types\n\nNew\
  \ Data Type\n\ntCustomer Structure\n\n## 图 4.4 – 新数据类型\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_101_0.png)\n\
  \n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_101_1.png)\n\n7. 我们的 **tCustomer** 等同于之前\
  \ Excel 电子表格中的一行。我们仍需告诉 KIE 每个客户类型内的各个信息片段。点击铅笔图标添加一个 **number** 类型的客户编号，然后点击勾选图标保存。\n\
  \n8. 点击 + 图标（客户编号下方）按顺序添加以下类型，如 *图 4.5* 所示：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_102_0.png)\n\
  \n图 4.5 – 自定义数据类型\n\n恭喜 -- 你刚刚在 KIE 沙箱中创建了你的第一个 **custom data type**。既然我们已经创建了 **custom\
  \ data type**，让我们看看它在 Decision Model 中是什么样子。\n\n> **Is customer name really needed\
  \ on our data type?**\n> \n> 在现实生活中，我们不太可能传入诸如客户姓名等个人身份信息。这是因为我们的决策服务不存储任何信息 --\
  \ 它只是对你传入的信息做出判断。\n> \n> 出于许多原因，你不应该基于单个客户姓名做出决策。更可能的情况是，对于非常重要的客户，你可能会创建一个 **Special\
  \ customer** 布尔字段。\n> \n> 这些设计选择在我们开始考虑客户数据伦理使用时尤其重要，我们将在下一章中涉及这个问题。\n\n### 在决策模型中使用我们的复杂数据类型\n\
  \n要开始在决策模型中使用我们的 tCustomer 数据类型，请执行以下步骤：\n\n- 1. 首先通过点击该标签返回 Model Editor 屏幕。\n\
  - 2. 在编辑器中，拖入一个 Input data 节点并将其命名为 Customer – 还记得我们的饼干客户示例吗？tCustomer 是模具，我们将用它来创建一个实际的客户形状。\n\
  - 3. 点击属性图标（记住 – 它在编辑器的右上角）。在 Properties 面板中，指定我们想要使用刚刚创建的 tCustomer 数据类型。它应类似于图\
  \ 4.6：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_103_0.png)\n\n图 4.6 - 在决策模型中使用我们的数据类型\n\
  \n我们之前提到过，像 tCustomer 这样的结构化数据类型是与调用此决策服务的人之间的契约的一部分。为了演示这一点，如果我们点击 Run .. as form\
  \ 按钮，我们可以看到 KIE 已根据我们的结构化数据类型自动生成了一个数据输入表单，如图 4.7 所示：\n\n2. **Data type constraints**\
  \ 屏幕出现。在 *图 4.9* 中，我们已经选择了 **enumeration**，它允许我们指定一组值。然后我们输入了在我们的 **Special Request**\
  \ 字段中可接受的文本：**diabetic**、**vegan** 或 **lactose intolerant**。请注意，也可以用 **expression**\
  \ 类型输入值列表（如果你选择这种方式，Sandbox 会给你一个示例来指导你）。\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_105_0.png)\n\
  \n图 4.9 – 带约束的复杂数据类型\n\n3. 记得点击 **OK**，或约束编辑器中的绿色箭头来保存我们的更新。\n\n当我们返回到 **Run** 菜单时，你会看到（*图\
  \ 4.10*）KIE 已识别新的契约并更新了用户界面，以便你只能选择与此限制一致的值：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_105_1.png)\n\
  \n图 4.10 – 更新后的数据输入表单建议受约束的值\n\n你会注意到，我们的示例（在 KIE 中建模）尚未匹配我们在 JSON 和 Excel 中建模的\
  \ Customer（带 Orders）。由于你已经使用过数据类型编辑器，创建订单对象并将其嵌套在客户中很容易：\n\n- 1. 创建 **tOrder** 类型，并包含你需要的字段。\n\
  - 2. 编辑 **tCustomer** 数据结构并添加一个使用此 **torder** 类型的 (Previous) **orders** 字段。\n- 3.\
  \ 编辑 **list** 滑块，这使我们能够为每个客户添加多个之前的订单。\n\n如前所述，**run** 屏幕上的自动生成表单将会更新 – 试试看！我们创建的数据类型的可下载副本可在本书的\
  \ GitHub 页面 https://github.com/PacktPublishing/AI-and-Business-Rules-for-Excel-Power-Users\
  \ 上作为 04_Customer_Data.dmn 获取。\n\n下载它会更容易，如果你不想一步步完成这些步骤 – 但请提醒自己上一章中给出的 GitHub\
  \ 下载说明，以避免最常见的错误。\n\n仅仅因为你可以用编辑器创建极其复杂的自定义数据并不意味着你应该这样做。让我们思考一下什么构成良好的设计。\n\n###\
  \ 什么构成良好的自定义数据类型？\n\n由于你正在构建一个供其他人（包括未来的你）使用的服务，花时间使其尽可能易用是值得的。关于良好数据设计的书籍汗牛充栋，但在这个阶段，几个简单的指导原则会大有帮助：\n\
  \n- - 遵循人们在日常业务中的说法更好 – customers、delivery addresses、orders、product recommendations\
  \ 以及其他类似术语。熟悉、清晰的名称使人们更容易理解，因为你镜像了他们已有的思维方式。\n- - 几个简单的数据类型比一个大型复杂的数据类型更好。它们不仅更容易理解，而且使重用你的决策服务变得更容易。\n\
  - - 数据建模可以变得非常复杂。复制现有的电子表格和系统是一个良好的开端。一致性比拥有略有不同的数据模型造成的混乱更好。\n- - 保持名称简单 – 我们的类型使用\
  \ **number** 而不是 **customer_number**，因为从上下文中已经很清楚它与客户相关。\n\n最重要的是 – 不要害怕尝试。在本书的这个阶段，我们正在原型设计\
  \ – 以学习为重点地使用技术。在某个时候，我们很可能会（重新）从 *clean-sheet* 设计开始。这个 clean-sheet 设计将构建得更快，因为到那时我们将对自己在做什么有更清晰的了解。\n\
  \n既然我们可以使用数据类型来指定我们期望传入的数据，让我们在使用 Decision Tables 的更强大的 Decision Model 中使用它。\n\n\
  ### 更强大的 Decision 节点 – Decision Tables\n\n在第 1 章 Wrestling with Excel? You Are Not\
  \ Alone 中，我们介绍了业务规则作为我们可以使用 when ... then 格式做出的决策，例如；When time is AM - say Good\
  \ morning。\n\n我们很可能有不止一条业务规则 – 否则，为什么要使用规则引擎呢？决策表只是以表格格式编写多个相似业务规则的一种格式，像这样：\n\n\
  | First | Input Value 1 | Input Value 2 | Output |\n| --- | --- | --- | --- |\n\
  | 1 | When value1 = \"Something\" | AND value2 > 100 | \"Matched\" |\n| OR 2 | When\
  \ value1 = \"Completely different\" | AND value 2<100 | \"Different match\" |\n\
  | OR 3 | - | Value 2 = 100 | \"Match on number only\" |\n\n表 4.1 – 映射为简单决策表的业务规则\n\
  \n输入值来自哪里？那就是我们之前构建的数据模型。我们用来连接不同节点的箭头意味着 KIE 知道决策表可用的数据（并会尝试为你自动生成表）。\n\nDrools（KIE\
  \ 底层的规则引擎）获取这些输入值并尝试在决策表中找到最佳匹配的行。寻找最佳匹配有不同的方法（HIT Policies）。我们将在示例中使用 First，因为它易于理解，但我们稍后会讨论匹配策略。\n\
  \n找到匹配后，输出列中的值将被返回。我们可以有多个输出值，但这里我们保持简单。\n\n请注意，并非所有值都需要提供。表 4.1 第三行的连字符 - 告诉 KIE\
  \ 对此规则在此列中不进行匹配。我们可以在想要匹配的值中使用一系列足够友好的表达式语言（FEEL）表达式，这意味着我们想要匹配的任何文本都必须用引号包围。\n\n\
  我们在决策表语法中实际上并不使用 AND 或 OR – 它们由表的布局隐含。我们在这里包含它们是为了清晰。同样，我们只是将模式写成我们想要匹配的内容（参见表 4.1\
  \ – 我们第一个规则的第一列）。\n\n既然我们已经理解了决策表的概念，让我们使用 KIE Sandbox 中的工具来捕获我们的第一个决策表。\n\n###\
  \ KIE Sandbox 中的第一个决策表\n\nKIE Sandbox 中的图形编辑器使创建决策表变得简单。我们将使用本章前面练习中创建的数据模型。这也在\
  \ samples 页面上作为 04_Customer Data.dmn 提供。\n\n\n\n\n\n要向此决策模型添加决策表：\n\n+   1. 在 KIE\
  \ 沙箱中打开模型并将决策模型重命名为 **First Decision Table**。\n+   2. 在编辑器视图中（目前应为空），拖放一个数据节点。将其命名为\
  \ **Customer**。\n+   3. 打开此节点的 **Properties** 视图并将数据类型设置为 **tCustomer**（我们在本章前面创建的数据结构）。这在\
  \ *Figure 4.11* 中显示。\n+   4. 返回主模型，拖放以创建一个决策节点。将其命名为 Recommended Product。\n+   5.\
  \ 使用箭头将两个节点连接起来（右键单击 **Customer** 节点以查看此选项）。你的决策模型应类似于 *Figure 4.11*：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_108_0.png)\n\
  \n在下一步之前，我们的数据节点和决策节点必须已连接。如果没有，KIE 将无法为决策表自动生成字段，因为它不知道传递了什么信息。\n\n让我们现在在 **Recommended\
  \ Product Decision** 节点内创建一个决策表：\n\n+   1. 选择 **Recommended Product Decision** 节点并单击\
  \ **Edit**。\n+   2. 在出现的屏幕中，选择 **Decision Table** 作为我们想要使用的表达式类型。记住——我们之后没有机会更改这一点——所以如果你弄错了，你需要删除并重新创建一个决策节点。\n\
  +   3. 你应该会看到一个类似于 *Figure 4.12* 的空决策表。我们删除了一些自动生成的列并调整了列宽以使此屏幕截图更清晰：\n\n### RecommendedProduct\
  \ (Decision Table)\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_109_0.png)\n\nFigure\
  \ 4.12 – Empty Decision Table\n\n现在我们创建了一个空决策表，让我们按 Figure 4.13 所示填充一些值：\n\n+  \
  \ 1. HIT Policy（表格左上角，见 Figure 4.13）– 要更改此值，双击并更改为 First。这样我们的示例更容易理解（如果匹配多条规则，则使用第一条规则）。\n\
  +   2. Output column（RecommendedProduct）。左键单击以将其类型设为 String，因为我们将推荐不同巧克力（糖果）棒的名称。\n\
  +   3. 要添加更多行，右键单击表格，然后从菜单中选择 Insert below。\n+   4. 双击单元格以编辑其值。输入文本值时，记得在它们周围加上引号（否则\
  \ KIE 会认为它是一个变量），并删除 KIE 可能添加的连字符以表示它可以忽略的空单元格：\n\n### RecommendedProduct (Decision\
  \ Table)\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_109_1.png)\n\nFigure 4.13 –\
  \ Decision Table with input and output values\n\nKIE 还具有围绕决策引擎的令人难以置信的节省时间功能——它可以分析你编写的规则并突出显示其中的任何空白。这在我们指定数字的输入和输出值范围或像我们对\
  \ **Special Requests** 数据类型那样限制有效文本列表时尤其强大。KIE 知道你应该编写规则来处理每个 **diabetic**、**vegan**\
  \ 或 **lactose intolerant** 值。如果你没有这样做，KIE 会在编辑器的 **Problems** 选项卡中给出警告（不是错误）。\n\n\
  我们对规则的匹配越具体，KIE 就越容易突出显示我们可能存在的任何空白。将 HIT 策略更改为匹配 **First** 业务规则使我们的示例更容易理解，但你可以看到\
  \ KIE 警告你应考虑更准确的 HIT 策略。\n\n决策表也很快。因为它们是以 When... Then 格式编写的业务规则，Drools 作为业务规则引擎可以优化规则，并且随着时间的推移实际上会变得更快。*Chapter\
  \ 12, Inside the Rule Engine* 解释了其背后的机制，但现在，请将决策表视为建模决策时的首选解决方案。\n\n### Decision\
  \ Tables as your go-to solution (other nodes are available)\n\n可以使用其他类型的节点来做出决策。例如，我们在\
  \ *Chapter 3, Your First Business Rule with the Online KIE Sandbox* 中的问候示例基于简单的\
  \ FEEL 表达式做出了决策。在现实生活中，我们不会对如此简单的示例使用决策模型或规则引擎。\n\n将决策表作为表达业务规则的默认选项使用，使得更容易理解其他节点和表达式的作用：\n\
  \n+   - 我们使用决策表来表达做出决策的业务规则\n+   - 我们使用其他节点来准备数据以输入到决策表\n\n我们可以在从 *Figure 4.11*\
  \ 开始填充的简单示例中看到这种模式——**Customer** 数据节点定义了我们期望的信息类型，而 **Recommend Product** 节点中的规则决策表做出了决策。那么，还有哪些其他类型的节点可以帮助准备我们的数据呢？\n\
  \n### More nodes that you can use\n\n我们已经介绍了你最常用来建模决策的节点。但还有几种其他值得探索的节点。*Figure\
  \ 4.15* 展示了 KIE 决策模型中可用的不同类型的节点：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_112_0.png)\n\
  \nFigure 4.15 – The different Decision Model nodes in KIE\n\n在 *Figure 4.15* 中看到的所有节点中，我们已经使用了数据和决策节点。但还有一些其他类型，我们很快就会用到：\n\
  \n+   - **Text nodes** 允许我们在决策模型中添加注释以解释正在发生的事情。它们仅用于信息，不会被评估。\n+   - **Knowledge\
  \ Source nodes** 也提供额外信息，但引用外部来源。例如，我们可能会使用知识来源链接到证明我们哪些产品对每种医疗状况安全的文件。它们仅用于信息，不会被评估。\n\
  +   - **Decision Services nodes** 有帮助，因为我们的决策模型可能会变得相当复杂。决策服务节点允许我们 *wrap* 这种复杂性以隐藏部分内部结构，使输入和输出期望更清晰。\n\
  +   - **Business Knowledge Models** 允许我们调用外部规则。这些可以是决策服务、其他决策模型、外部系统（通过 Java）或外部\
  \ AI 模型。我们还可以使用它们来使用 FEEL 定义可重用的函数，我们将在 *Chapter 9* 中更详细地介绍。\n\n我们将在全书的示例中使用这些节点。但虽然我们使用了决策表，但仍有一些类型的决策节点我们尚未探索——让我们现在来看看它们。\n\
  \n### Other types of Decision Nodes\n\n我们已经创建了两种类型的决策节点——本章前面使用的决策表和我们在 *Chapter\
  \ 3* 中用于生成问候语的字面表达式。\n\n但在创建决策节点时，我们必须从七种类型中选择一种。我们将在以下列表中逐一介绍它们。在某种程度上，决策节点这个名称具有误导性；通常，我们会将这些类型用作\
  \ *data preparation* 节点以输入到决策表：\n\n+   - **Literal Expressions:** 这些是简单的 FEEL 表达式，大致类似于你在\
  \ Excel 中输入的公式。它们返回单个值。\n+   - **Decision Tables:** 我们在本章中已介绍过这些。它们允许我们以 `when ...\
  \ then` 格式对规则进行分组。\n+   - **Functions:** 这允许我们定义可重用的逻辑。我们可以编写一个函数，接受巧克力棒重量和巧克力百分比的参数，然后返回该棒实际含有的巧克力克数。我们很快就会通过一个函数示例来讲解。\n\
  +   - **Invocations:** 这些是调用外部决策模型的另一种方式。它们与函数重叠，但在处理当前决策模型之外的逻辑时更有用。\n+   - **Contexts:**\
  \ 这些使我们的决策模型更简单。代替拥有大量单独的字面表达式，上下文允许我们将它们集中在一处。它们还为我们提供了按顺序执行这些表达式的选项。\n\n最后，我们有两个返回结构化数据的决策节点类型：\n\
  \n+   - **Lists:** 这些返回简单的值集合。这些可以是不会改变的具体值，或者我们可以使用 FEEL 表达式来计算列表中的值。*Figure 4.16*\
  \ 显示了我们的国家列表，建模为列表节点。编辑器只允许我们输入一列值：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_113_0.png)\n\
  \nFigure 4.16 – A List Decision Node showing country codes\n\n\n\n\n\n- **关系**：这些与列表类似，但可以把多个值组合在一起，如图\
  \ 4.17 所示。此关系中的每一行都包含有关我们产品的有用信息。而每一列本质上是一个列表，如果我们想要访问所有产品的列表，这很有用：\n\n### Product\
  \ Info (Relation)\n\n| # | Product (string) | Weight in Grams (number) | Vegan Suitable\
  \ (boolean) |\n| --- | --- | --- | --- |\n| 1 | \"Peanut Crunch\" | 75 | true |\n\
  | 2 | \"Caramel Biscuit\" | 125 | false |\n\nFigure 4.17 – Relation Decision Node\
  \ showing product information\n\n### Relations are not Decision Tables\n\n由于表格格式，关系看起来与决策表非常相似。尽管外观相似，但它们的工作方式截然不同。关系会返回其包含的所有信息。决策表会匹配最佳行并仅返回该信息。\n\
  \n关系非常适合定义一次信息并在多个决策模型中重复使用。实际上，此产品信息表将使用调用从外部系统源中提取。对于现在，将信息建模为一个地方的关系效果很好。随着系统的演进，这也使其更容易在以后进行更改。\n\
  \n### Play around with the nodes\n\n本节中介绍的大多数节点一旦开始使用就很容易理解。我们鼓励你在 KIE Decision\
  \ 编辑器中尝试使用它们，并使用 Runner 查看输出。例如，图 4.18 显示了我们运行 Product Info 关系节点时的输出：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_115_0.png)\n\
  \nFigure 4.18 – Output from a Relation Decision Node showing product information\n\
  \n我们将在示例中使用一些这些表达式和节点来帮助你更好地理解它们。由于所有节点都是 **Object Model Group (OMG)** 决策模型标准的一部分，网上有很多关于每个节点的信息和示例。开始的好地方是\
  \ learn DMN 网站（是 KIE 的一部分）：https://learn-dmn-in-15-minutes.com/learn/decision-logic。Drools\
  \ 网站（也是 KIE 的一部分）上有更详细的信息：https://www.drools.org/learn/dmn.html。\n\n### Adding nodes\
  \ to support our Decision Table\n\n我们之前的决策表示例很简单：一个数据输入节点和一个生成输出的表。由于决策模型的强大之处在于将许多节点组合在一起，让我们开始构建一个链接多个节点的示例。\n\
  \n此示例将允许我们根据客户出生所在的星期几推荐不同的巧克力棒。这来自真实的例子，可能并不比你被要求建模的一些业务规则更离谱。\n\n我们将基于之前决策表示例开始工作，可从本书的\
  \ GitHub 站点下载为 `04_First_Decision_Table.dmn`：\n\n- 1. 打开 Decision Model 编辑器，并添加\
  \ **DayCalc** 决策节点。\n- 2. 创建一条箭头连接现有的 **Customer Data Note** 以将数据馈送到这个新的 **DayCalc**\
  \ 节点。\n- 3. 创建另一条箭头连接 **DayCalc** 节点到现有的 **Recommended Product** 表。\n- 4. 打开 **DayCalc**\
  \ 节点的 **Properties editor** 并将输出设置为 **string**。它应如下 *Figure 4.19* 所示：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_116_0.png)\n\
  \nFigure 4.19 – Creating a Function Decision Node\n\n- 5. 接下来，通过单击节点旁边的钢笔图标编辑 **DayCalc**\
  \ 节点。\n- 6. 在出现的屏幕上，将 **Expression type** 设置为 **Function**。\n- 7. 通过单击 **Edit Parameters**\
  \ 框编辑此函数的参数。在弹出菜单中，单击 **Add parameter**，如 *Figure 4.20* 所示：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_116_1.png)\n\
  \nFigure 4.20 – Adding parameters to the function\n\n- 8. 输入一个名为 DOB 的参数，并将其数据类型设为\
  \ **Date**。单击任意位置退出空白菜单。\n\n9. 现在你回到节点编辑器，在表达式框中输入 day of week (DOB)。你猜对了——这是一个\
  \ FEEL 表达式，返回与此日期关联的星期几（例如 Monday 或 Tuesday）。通过此编辑，你的节点应类似于图 4.21：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_117_0.png)\n\
  \nFigure 4.21 – Entering the function\n\n如果我们正确输入了公式（没有拼写错误），你应该在 Run 面板中看到函数 DayCalc(\
  \ DOB ) - Evaluated with success 的输出。\n\n虽然知道 KIE 能理解我们的函数很有用，但我们还没有通过传入日期调用它并收到响应。\n\
  \n### Running our function\n\n虽然我们已将决策模型接线以使函数可用于决策表，但查看正在发生的事情会很有帮助。为此，我们将向决策模型添加另一个节点以允许我们可视化输出：\n\
  \n- 1. 打开我们之前的示例，添加另一个决策节点，并将其命名为 Customer Birth Day。\n- 2. 从 DayCalc 函数链接新节点。你的模型应类似于图\
  \ 4.22：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_117_1.png)\n\nFigure 4.22 –\
  \ Creating a Decision Node to test the function\n\n- 3. 打开 **Customer Birth Day**\
  \ 的属性，为其指定 **string** 数据类型。\n- 4. 编辑 **Customer Birthday** 决策节点，并将 **Logic type**\
  \ 设置为 **Context**。当然，调用函数的方式有很多，但这是一个练习上下文决策节点的有用借口。\n- 5. 在你选择上下文类型后出现的屏幕上，按如下方式添加条目，使其看起来像\
  \ *Figure 4.23*。你需要插入新行并从下拉菜单中选择 **string** 数据类型。`DayCalc(Customer.Date of Birth)`\
  \ 和 `Day of Week` 是字面表达式：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_118_0.png)\n\
  \n- 6. 打开 **Run** 面板并从 **Date of Birth** 输入字段的日期选择器中选择一个日期——例如 **2000-01-01**。\n\
  - 7. 立即，KIE 将评估决策模型，包括我们刚刚创建的 **Customer Birth Day** 节点。我们将看到客户出生的星期几；在此例中，是星期六。\n\
  \n> **Tricks of the trade**\n> \n> 添加输出节点以便我们可以看到正在发生的事情是调试的有用工具（尝试找出为什么某些东西没有按我们想要的方式工作）。由于没有人第一次就能做对，我们在\
  \ *Chapter 9* 中更详细地讨论了有用的测试技术。\n\n我们使用的 **context** 节点非常简单：一个计算和一个输出行。如果需要，我们可以添加额外的行并让\
  \ KIE 逐步构建结果。同样，在我们继续构建更复杂的决策表之前，值得在 KIE 编辑器中练习此示例。\n\n### A more sophisticated\
  \ Decision Table\n\n我们添加了一个函数节点来计算客户出生的星期几。但我们仍然没有使用该星期几来推荐合适的产品。让我们更新我们之前的示例（可下载为\
  \ 04_Customer_Birth_Day.dmn）以实现这一点：\n\n- 1. 打开 Decision Model，右键单击 **Recommended\
  \ product** 决策节点，并选择编辑图标。\n- 2. 添加 **Input Clauses**（淡蓝色），使你拥有图 4.24 所示的三个输入列。你可以通过右键单击现有输入列并选择\
  \ **Add right** 来实现。\n- 3. 双击每个输入子句以设置数据的来源，如图 4.24 所示。`Customer.Country of Residence`\
  \ 和 `Customer.Number` 直接来自我们的数据模型。`DayCalc(Customer.Date of Birth)` 调用我们创建的函数（一次）并使结果可用于与规则匹配。\n\
  - 4. 我们调整了一些列的大小并拖放以重新排序——但这不会改变规则的功能。\n- 5. 在表的正文中，输入如图所示的值。请注意文本值所需的引号。\n- 6.\
  \ - 值表示不尝试匹配，而注释只是解释正在发生的事情的注释，否则会被忽略。\n\nRecommendedProduct (Decision Table)\n\n\
  | F | Customer.Country of Residence (string) | DayCalc(Customer.Date of Birth) (string)\
  \ | Customer.Number (number) | RecommendedProduct (string) | annotation-1 |\n|---|----------------------------------------|------------------------------------------|--------------------------|-----------------------------|--------------|\n\
  | 1 | - | - | <10000 | \"Silk Tray\" | Only first 10000 custom |\n| 2 | \"SA\" |\
  \ - | - | \"Lumpy Fruit and Nut Bar\" | |\n| 3 | \"UK\" | \"Friday\" | - | \"Crunch\
  \ Bar\" | |\n| 4 | \"US\", \"UK\" | - | - | \"Peanut Candy\" | |\n| 5 | - | - |\
  \ - | \"Milk Chocolate\" | |\n\nFigure 4.24 – A more sophisticated decision table\n\
  \n7. 打开 **Run** 面板以评估我们的模型。据预期，**US** 客户会被推荐 **Peanut Candy**。**UK** 客户会被推荐 **Crunch\
  \ Bar**——但仅当他们出生于 **Friday** 时。否则，客户将收到默认建议的 **Milk Chocolate** 棒。并且任何在前 10,000\
  \ 名客户中的人都会被推荐我们的特别 **Silk Tray** 优惠。\n\n\n\n\n\n- **Collect**：这允许匹配多个。 如果我们使用此策略，我们建议至少向所有美国客户推荐两种产品（**Silk\
  \ Tray** 和 **Peanut Crunch**）。 在此策略下还有第二个下拉选项，用于指定聚合器：**Min、Max、Count**（这些都适用于文本和数值），以及\
  \ **Sum**（仅适用于数字）。\n- **Rule Order** 和 **Output order**：这些也允许并收集多个规则匹配。 然后这些匹配会按规则的顺序（像\
  \ **First** 一样），或按输出的顺序（像 **Priority** 一样）进行排序。\n\n哪种 HIT 策略效果最好，将取决于你试图编写的规则。 你的重点应该是哪种策略能让规则更容易理解、更清晰，并且漏洞最少（因为你试图确保所有场景都得到覆盖）。\
  \ 目前，我们建议你尝试不同的 HIT 策略以更好地理解它们——在 KIE 抱怨规则与策略不兼容时，注意 **Problems** 选项卡。\n\n虽然编写规则以使其**唯一**（或任何更具体的\
  \ HIT 策略）起初更困难，但从长远来看会为你节省时间。 这是因为自动 KIE 分析允许你在现在（修复很容易的时候）识别漏洞，而不是以后（当你有一个恼怒的客户打电话抱怨没有提出他们可能喜欢的糖果棒建议时）。\n\
  \n### 一个更安全的决策表示例\n\n虽然我们的决策模型非常强大，但就其当前形式而言，它非常危险。 它会向乳糖不耐受的客户推荐基于牛奶的产品。 更糟糕的是，它可能会向严重过敏的人推荐含有坚果的产品。\n\
  \n我们需要修复这个问题。 我们首先想到的是更新 **Product Recommendation** 决策表。 可以编写规则来实现这一点，但也很可能这样一个重要的决策会在我们编写的所有规则中丢失。\
  \ 如果不是现在，未来某人可能会忘记这个重要的规则，可能导致致命后果。\n\n更好的做法是*链式*我们的决策节点，以在决策模型中突出显示此健康检查规则的重要性。\
  \ *Figure 4.25* 是我们如何设计此方法的示例：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_122_0.png)\n\
  \nFigure 4.25 – A safer product recommendation service\n\n此模型可作为 04_Product_Recommendation-collect.dmn\
  \ 下载，但使用以下更改对我们之前的决策表示例进行重建也很简单：\n\n1. 我们移除了 **Customer Birth Day** 决策节点，因为它不再用于测试，但保留了用于决策表的\
  \ **DayCalc** 函数。\n2. 我们将 **Recommended Product** 决策策略上的 HIT 策略更新为 **Collect**。\
  \ 对于我们的健康检查来说这没有区别，但比使用 HIT 策略 **First** 更好的做法。 否则，决策表保持不变。\n3. 我们对 **Customer**\
  \ 数据类型不做任何更改。\n4. 我们添加了一个新的 **List** 类型的决策节点，指定我们需要关注的关键健康问题。 对于我们的示例，我们指定了 `lactose\
  \ intolerant` 和 `nut allergy` 值，如 *Figure 4.26* 所示：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_123_0.png)\n\
  \nFigure 4.26 – Health Issues list\n\n5. 我们添加了一个新的 **Health Checked** 产品决策节点。 虽然我们本可以使用一个小的决策表，但为了保持简单，我们将其设为如\
  \ *Figure 4.26* 中的字面表达式。 `if Customer.Special Requests in Health Issues then \"\
  Potential Health Issue - please check\" else Recommended Product` 表达式可确保任何潜在的健康问题如果在\
  \ **Health Issues** 列表中就会被突出显示。 否则，规则会将决策表的推荐传递下去：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_123_1.png)\n\
  \nFigure 4.27 – Implementing our health check in a decision node\n\n6. 最后，我们将决策模型包装为决策服务，以使人们关注使用正确的\
  \ **health checked Product** 节点，而不是任何中间计算。\n\n当我们运行此决策模型时，我们仍然像以前一样进行产品推荐。 然而，如果存在任何潜在的健康问题，它们将被标记以供人工干预。\n\
  \n这种布局是标准做法——我们会在业务规则上谨慎行事，并在敏感情况下允许真正的现场人员做出最终决定。 由于人员只需处理一两个有趣的案例，而不是成千上万的无聊案例，因此对他们来说体验仍然更好。\
  \ 它还使我们能够专注于编写适用于绝大多数情况的规则，因此我们不会浪费太多时间在可能只适用于极少数订单的情况上。\n\n> ### Decision Models\
  \ as a safety net for AI – neural networks\n> \n> 稍后，当我们有数十万个订单时，我们可能会训练一个神经网络来取代我们的\
  \ **Product Recommendation** 决策表——正如我们在 *Chapter 11* 中所做的那样。 但我们会犹豫是否要信任神经网络来正确处理生死攸关的决策（例如坚果过敏）。\n\
  > \n> 我们无法保证神经网络在每种情况下的输出。 将基于规则的方法（例如带有神经网络的 **health checked Product** 节点）结合起来可以为我们提供一个安全网，确保重要的检查会按我们指定的方式精确执行。\n\
  \n### Summary\n\n本章我们从决策模型有用的想法转变为亲手使用决策表和业务规则。 基于一家巧克力店的业务情况，我们构建了一个简单的产品推荐引擎，应该能为你的日常工作提供大量灵感。\n\
  \n我们在过程中使用了许多重要工具，并学习了如何使用结构化编辑器对数据建模，使其更清晰地显示信息将如何传入和传出我们的决策模型。 我们创建了决策表，功能日益强大，以展示决策解决方案的可扩展性有多强。\
  \ 我们还查看了其他节点类型和表达式，它们帮助我们为决策表准备数据。\n\n在这些工具背后，我们看到了许多重要概念——我们对 FEEL 表达式的强大功能有了更多了解。\
  \ 我们研究了不同的 HIT 策略如何使我们的业务规则更易于理解并避免漏洞。 我们还看到了如何设计决策服务，以确保我们不会忽视可能影响人们健康的使命关键决策。\n\
  \n到目前为止，在本书中，我们一直使用 KIE 沙箱作为编写和执行决策模型和业务规则的工具。 但由于我们大部分工作时间都在 Excel 中，我们希望能够从电子表格中利用\
  \ KIE 和 Drools 的强大功能。 我们将在下一章中了解如何做到这一点。\n\n大多数网站是只读的，或者接近只读，但如果你可以请求数据中心中的空间并像在手机上一样安装应用程序到其中呢？\
  \ 然后你将与数据中心中新安装的应用程序通信，而不是你的手机。 那就是云的非常简单的概念。\n\nExcel 365，Office 的在线版本，就是一个例子。\
  \ 你不知道托管你文档的数据中心的位置，但你确信 Microsoft 拥有所有安全检查来保护你的信息安全。 Microsoft 专注于在其数据中心运行 Office\
  \ 365 应用程序，因此他们做得相当好，并且可以根据需求上下扩展所需的计算机。\n\n对于在云中运行 Kogito 并部署你的决策模型，Red Hat 提供了一个几乎一键式部署按钮来在线托管你的决策模型。\
  \ 这基于 Red Hat 的云产品 (**OpenShift**)，我们很快就会启动并运行。\n\n### Reality check – why not connect\
  \ Excel to the local KIE Sandbox?\n\n从技术上讲，可以修改本书中的脚本技术，使 Excel 与 KIE Sandbox Extended\
  \ Services——你在 *Chapter 3* 中安装的本地工具——之间进行通信。\n\n然而，你真的不想这样做，原因如下：\n\n- KIE Extended\
  \ Services 的重点是帮助你的规则开发，并且它们可能会因版本而异（这会破坏连接到它的任何 Excel 表）。\n- KIE Extended Services\
  \ 在你的笔记本电脑之外不可用——这使得同事更难使用它。\n- KIE Extended Services 每次都期望发送一份 DMN 决策模型的副本。 这对于浏览器中的\
  \ KIE Sandbox 来说是可以的，但我们无法从 Excel 中轻松访问模型。\n\n实际上，你会发现一键式部署如此易于使用，以至于将决策模型托管在 OpenShift\
  \ 上很可能会成为你的首选解决方案。 作为奖励，部署到云中会自动为我们提供一个用于生产的强大、可扩展的平台，这是本书的一个重要目标。\n\n如果在本地运行决策模型对你至关重要（例如，在你公司场所的计算机上），请查看\
  \ *Chapter 10* 中使用 *Docker* 的技术，这应该能为你提供合适的解决方案。\n\n### OpenShift – Red Hat’s piece\
  \ of the cloud\n\nRed Hat（IBM）的云产品称为 **OpenShift**。 它功能齐全，意味着它可以完成 Google、Amazon\
  \ 和 Microsoft 等其他主要云供应商提供的几乎所有功能。 虽然可以将 Kogito 部署到这些其他云供应商，但我们选择 OpenShift，因为它为\
  \ Kogito 和我们的决策模型提供了一个简单的一键式部署。\n\n功能齐全也意味着 OpenShift 有很多我们不需要在本书记载的按钮；我们将忽略这些，专注于你部署决策模型所需的内容。\
  \ 如果你觉得需要了解更多，我们推荐 Packt 出版的 `https://` 上的 *OpenShift for the Absolute Beginner*。\n\
  \n\n\nwww.packtpub.com/product/openshift-for-the-absolute-beginner-hands-on-video/9781838559090.\n\
  \nOpenShift 有一个名为 Developer Sandbox 的免费层级（不要与 KIE Sandbox 混淆）。这让你可以尝试部署，并在之后选择升级到付费订阅。显然，免费版本有一些限制，我们将在本节末尾提到。总的来说，Developer\
  \ Sandbox 足以用于开发业务规则，但如果你是与付费客户一起使用，你可能需要升级到完整版本。\n\n让我们逐步了解如何为 Developer Sandbox\
  \ 注册、设置完成后如何访问 Sandbox、将 Sandbox 链接到 Developer Sandbox，以及将我们的决策模型部署到其中。\n\n### 为\
  \ OpenShift Developer Sandbox 注册\n\n为 OpenShift Developer Sandbox 注册的过程与加入 Gmail\
  \ 或 Facebook 等热门网站类似。你访问网站，提供一些个人信息，验证你的电子邮件或手机号码，然后即可登录到该网站。我们将一步步带你完成这些步骤以开始使用：\n\
  \n- 1. 打开主 Developer Sandbox 页面 https://developers.redhat.com/developer-sandbox。\n\
  - 2. 虽然该页面包含大量信息，但其中很多我们不需要。点击 Start your sandbox for free 按钮：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_127_0.png)\n\
  \n图 5.1 – 为 OpenShift Sandbox 注册\n\n- 3. 输入你的电子邮件以开始设置 OpenShift 账户的过程。\n\n你将被要求提供基本信息，包括密码。填写所有必要字段后，点击\
  \ Create My Account 按钮。\n\n- 4. 在账户创建过程中，你将被要求确认你的手机号码。这是为了让人们更难为自己注册多个账户。你需要输入发送到你手机上的验证码。\n\
  \n- 5. 你还将在设置过程中被提示选择一个项目名称——这个名称之后无法更改，因此请选择一个你愿意与业务同事分享的名称。\n\n- 6. 最后，在通过电子邮件发送给你的链接点击确认你的电子邮件地址后，你应该会看到\
  \ You’re ready to get started! 消息：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_128_0.png)\n\
  \n图 5.2 – OpenShift sandbox 设置成功\n\n在注册过程中，你可能会在收到的电子邮件中看到一些你不太理解的措辞。例如，见下文：\n\n\
  ```\nNotice: Your Developer Sandbox for Red Hat OpenShift account is provisioned\n\
  ```\n\n沙盒有点像租一间公寓公寓。我们不拥有它，但在租期内只有我们才能访问建筑物的这一部分。我们期望在入住时它完全干净，没有前租户的任何痕迹，并且我们期望列出的所有功能（床、咖啡机等）都可以使用。Provisioned\
  \ 意味着此设置过程已完成。\n\n更好的比较\n\n由于沙盒在我们使用后会被完全拆除并重建，更好的比较是德国式的租赁方式，即公寓被剥离到几乎只剩裸墙，每个租户都必须自行安装电器和家具。\n\
  \n电子邮件中的另一个提醒如下：\n\n```\nYour account will be active for 30 days. At the end of\
  \ the active period, your access will be deactivated and all your data on the Developer\
  \ Sandbox will be deleted.\n```\n\nRed Hat 允许我们免费使用他们的云，但他们必须在某处划清界限。30 天足够尝试本书中的想法，你可以使用相同的联系信息再次注册，获得多个\
  \ 30 天周期。\n\n总体而言，我们始终会保留决策模型的本地副本，并且决策模型运行结束后不会存储数据，但这是一个有用的提醒！\n\n### 访问你的 OpenShift\
  \ Developer Sandbox\n\n现在我们已经设置好账户，前往 `https://developers.redhat.com/developer-sandbox`\
  \ 开始使用我们的新云环境。网站应该会记住你已登录（如果需要也会提供选项），你可能需要点击 **Start Using your Sandbox** 以查看主\
  \ OpenShift 控制台，如 *Figure 5.3* 所示：\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_129_0.png)\n\
  \n图 5.3 – OpenShift 控制台\n\n这张图片展示了 OpenShift 云提供的强大功能。我们不会像往常一样对屏幕进行巡视；相反，我们将其作为我们已正确设置\
  \ Developer Sandbox 的确认。如果你好奇，可以四处看看，但我们将专注于获取两个关键信息，以便将本地 KIE Sandbox 与这片云链接起来。\n\
  \n### 两个重要的链接信息\n\n在离开 OpenShift 控制台之前，让我们记下两个关键信息，我们稍后需要将其链接到我们的 OpenShift 实例。*Figure\
  \ 5.4* 显示了控制台右上角项目名称下的菜单。你的项目名称会不同，但 **Copy login command** 保持不变。\n\n![](img/48815d6f06dc8c7aeaa3963d289fb1e7_129_1.png)\n\
  \n图 5.4 – 复制登录详细信息\n\n选择 **Copy login command** 后，你将看到类似 *Figure 5.5* 的页面。此过程中的操作很多，值得一步步讲解：\n\
  \n- 1. 由于这是访问敏感信息，你可能需要再次登录。你会看到一个简单的屏幕，显示 **Display Token**。点击此链接将显示两条信息。\n- 2.\
  \ 查找以 **Your API token is sha256~_oNI_uw-qyD6A~-EI-Qhg1-sddfFezCFZ-gZxLxFZUo** 开头的行。请注意，*你的令牌会不同，因为它是唯一的并且每天都会更改*。\n\
  - 3. 复制从 **sha256** 开始到该行末尾的文本。\n- 4. 最好将其保存到文本文件（使用记事本）中，因为我们需要从此页面复制第二个值。我们将使用此令牌代替用户名和密码，以便\
  \ OpenShift 在我们从 KIE Sandbox 连接时知道是我们。\n- 5. 我们的第二个值是用于查找我们在云中 OpenShift 实例的 URL（网络位置）。该值在下一行以\
  \ **oc login** 开始。你需要取 **server=** 之后到该行末尾的文本，如 *Figure 5.5* 中突出显示的那样。同样，你的值是唯一的，会与图片不同。\n\
  \n```\noc login --token=sha256~_oNI_uw-qyD6A~-EI-Qhg1-sddfFezCFZ-gZxLxFZUo\nserver=https://api.sandbox.x8i5.p1.openshiftapps.com:6443\n\
  ```\n\n图 5.5 – 复制服务器详细信息\n\n- 6. 将此服务器 URL 保存到某处——我们即将用它来链接到我们的 KIE Sandbox。\n\n\
