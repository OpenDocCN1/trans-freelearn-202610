  \ CNCF Serverless。他在巴西的本地会议上担任演讲者和轨道协调员。他拥有信息系统学士学位，并在软件工程和信息安全方面有专业化，并撰写了书籍 *WildFly:\
  \ New Feature*，并帮助其他作者成功出版书籍。\n\n> *分享知识既令人欣慰，也需要奉献和一些远离家人朋友的时间。我感谢他们在过去几年给予我的支持。*\n\
  \n**Nishant Ravle** 是一名 IT 专业人士，拥有超过 16 年的 IT 经验，涉及 BPM、SOA 和中间件技术。他在 Oracle 和 IBM\
  \ 产品栈方面有广泛的工作经验。目前，他从事软件咨询和企业及在线培训工作。\n\nNishant 的技术专长涵盖业务流程管理和面向服务架构领域的核心技能和专业知识，使用\
  \ IBM BPM、Oracle BPM、jBPM、Camunda BPM 和 Activiti BPM 在英国、挪威、阿曼、马来西亚、南非、迪拜、肯尼亚和卡塔尔的现场任务中开发\
