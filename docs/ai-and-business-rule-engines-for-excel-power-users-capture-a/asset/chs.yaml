  \n笔记本是一个标准概念，是 ML 的基石。因此，虽然在 VS Code 在线（Codespaces 或在您笔记本电脑上的 VS Code 本地）中使用它们很容易，但还有许多其他选项。您可能会看到它们被称为\
  \ **Jupyter** 笔记本（可在网上运行，或在浏览器中运行于 `mybinder.org`）。如果您更喜欢该平台，还有 Google Colab，或者如果您想在本地托管它们，还有\
  \ Jupyter Docker 镜像。\n\n最后，微软的 Azure ML 可以托管我们的笔记本。这就是我们将在本章后面用来训练模型的方法，因为它还为我们提供了许多额外的\
  \ ML 工具。\n\n## 什么是 Python 以及为什么在笔记本中使用它？\n\n如果您打开了笔记本，您会看到它使用了一种名为 **Python** 的脚本语言。\n\
  \n这是一个不错的选择——Python 不仅易于 Excel 高级用户理解，而且可能拥有最广泛的工具包和 ML 库供您使用。作为奖励，您可能会在其他情况下使用\
  \ Python。\n\n本书中的 Python 示例很容易理解。但如果您有兴趣了解更多，Packt Publishing 有很多好书：`https://subscription.packtpub.com/search?query=python`。\n\
  \n在我们开始使用笔记本和 Python 来训练我们的 ML 模型之前，我们需要快速了解一下在我们的模型中可用的各种分类器。\n\n## 朴素贝叶斯和其他分类器\n\
  \n我们在本章中提出了一些非常简单的陈述：所有数学都是一个图；画一条线可以分离该图上的簇；ML 是关于找到画线的地点。\n\n我们能够做出这些高层次的陈述的原因是，已经有很多工作投入到\
  \ ML 算法中，并且这些算法可供我们下载并在 Python 中使用（例如，使用 `sklearn` 包）。并且我们可以在此包中在算法之间切换，以找出什么效果最好，而无需理解其背后的数学细节。\n\
  \n当然，了解一些数学知识会帮助您更快地取得进展，这就是为什么我鼓励您阅读以下文章的原因，该文章以图形化、无代码的方式解释了关键算法：`https://www.freecodecamp.org/news/a-no-code-intro-to-the-9-most-important-machine-learning-algorithms-today/`。\n\
  \n虽然这篇文章解释了不同的方法，但一个好的默认方法是 **朴素贝叶斯** 算法。它之所以朴素，是因为它假设您的数据中的各个特征或维度之间没有联系，而这通常是不真实的。但它确实提供了一个良好的起点，因为它在许多数据集上提供了合理（但不突出）的结果。只要证明数学是可理解的，谷歌搜索\
  \ **naïve Bayes Excel implementation** 即可找到一个演示，证明它可以在电子表格中计算。我们将坚持使用 Python 版本，因为它速度快得多。\n\
  \n## 简单分类器与神经网络\n\n我们将在本章中使用的 ML 算法称为简单分类器。它们有效、简单易用且速度快。通常，这些类型的分类器只需一次遍历训练数据即可开始工作。对于许多问题，这些简单分类器会得到良好的结果。\n\
  \n对于更复杂的问题，我们可能会使用神经网络。我们在 *第 12 章* 中涉及了这些内容，因为神经网络是近年来 AI 喧嚣的主要原因。神经网络需要在训练数据上进行多次\
  \ *训练*，并且可配置性更强（网络的结构和使用的初始权重）。\n\n我们采取了实用方法，本书中的工具包如 `sklearn`、PMML 和 KIE 使您在了解每种方法的工作原理后轻松在方法之间切换。\n\
  \n## 在 Azure Machine Learning 中训练模型\n\n由于我们本章的目标是提供一个广泛的介绍，我们将使用 Azure ML 训练我们的第一个朴素贝叶斯模型，以为您提供进入微软提供的其他工具和技术的门户。Azure\
  \ ML 并不是严格必需的——Python 笔记本很乐意在 VS Code 在线中使用我们在本章前面介绍的方法运行。如果您遵循这种方法，请跳到 *逐步训练 ML\
  \ 模型* 部分。但由于 Azure 提供了面向 Excel 高级用户的额外 ML 工具，因此值得按照下一节中的说明在 Azure ML（以前称为 ML Studio）中启动并运行。\n\
