- pgno: 316
  md: '# 11


    # Strategies to Organize Data for Analytics


    You survey your team as they tap away diligently on their MacBooks scattered around
    their cubicle. You have been promoted to the position your old boss held and now
    have a small team of data scientists. Some are at standing desks, some are at
    minipods, and some are huddled around a small conference table in the middle of
    your area.


    Your boss, the VP of Connected Services, approaches down the hallway with a pleasant
    smile. He makes eye contact as soon as you see him.


    "How is the team settling in?" he asks. You give him positive status updates,
    and he nods and murmurs his approval.


    "I had a thought," he says, "Your team does great work. But the speed that they
    deliver analytics is the same now as it was a few months ago. Is there anything
    we can do that would help them iterate faster?"


    You smile with *what an interesting thought* expression. You have been thinking
    the same thing for weeks.


    "Most of the time spent for any analysis that we do is on collecting, cleaning,
    and massaging the data," you say, "It can be 80% or higher. I''ll get the team
    together with our database experts to brainstorm ways to reduce that. I think
    that will have the highest impact."


    He smiles and gives a quick nod. Then, he walks off to his next meeting. You know
    that means you had better deliver the time savings in order to meet his expectations.
    You are just not sure how to do it.'
  merge: -1
  img_proc: true
- pgno: 317
  md: 'This chapter is focused on how to organize data in a way that makes it much
    easier for data scientists to extract value. We will introduce the concept of
    **linked analytical datasets (LAD)** as a way to dramatically improve the speed
    of **machine learning (ML)** modeling development. You will learn how to balance
    maintainability with data scientist productivity.


    We will also discuss how to keep your data lake from turning into a data swamp.
    IoT data will not produce much value if it is difficult to work with. And it will
    produce even less value if no one is allowed to get to it.


    This chapter will also discuss developing a data retention strategy for IoT data.
    This will focus on retaining value for analytics while reducing the cost to maintain
    the large volumes of historical data.


    This chapter covers the following topics:


    +   - Introduction to the concept of LAD

    +   - The process to build LADs

    +   - Managing data lakes

    +   - Data retention strategies


    # Linked Analytical Datasets


    The concept of LAD ties together the well-established ideas of analytical datasets
    and relational databases. Combining them together accelerates how quickly data
    scientists can get to the part both you and they care about most—the analytics.


    The term LAD is being introduced in this book, although the general concepts are
    not new. However, there does not appear to be a common name for this arrangement,
    so the intent is to give it one. So, now that we have LAD, let''s see if it takes
    off.


    # Analytical datasets


    The process of creating analytical datasets is simple in concept but hard in execution.
    You have probably created one already, whether you know it or not. Analytical
    datasets combine a bunch of useful features together into each record instance.'
  merge: -1
  img_proc: true
- pgno: 318
  md: 'This is done for both data understanding purposes (think about Chapter 6, Getting
    to Know Your Data - Exploring IoT Data) and for ML purposes (think about Chapter
    10, Data Science for IoT Analytics). The goal is to combine at least 80% of what
    an IoT analyst would need to answer questions for a particular subject into one
    table. The table is also constantly and automatically created for them. It is
    as simple as that.


    # Building analytic datasets


    Analytical datasets are semi-denormalized tables. By semi-denormalized, this means
    including not just the ID code of a field but the description for it as well.
    You may also decide to create categories based on value ranges and include these
    as separate features.


    The goal is to make life easy for your analysts more than a focus on efficiently
    storing values, as it would be with purely relational database design. You are,
    essentially, prebuilding the transformed datasets that an analyst would be building
    using SQL to preprocess a dataset in preparation to train an ML model anyway.


    As data wrangling takes 80-95% of a typical analysts time, having most of this
    already built, tested, and the business logic incorporated saves a tremendous
    amount of time. And this happens not just once for one person, but many times,
    for many people. This compounding effect dramatically increases the value of prebuilding
    the analytical datasets.


    The mission should be to include features in the table that would be used for
    several different projects and subject matters. It requires some educated balancing
    to pick the optimal features. You will never get 100% of what analysts need into
    one table, but a goal of 80% can do a tremendous amount of good.


    The following process will help in deciding how to build an analytic dataset for
    a particular topic. We use an example of GPS positional data from an IoT device.
    Each instance in the dataset will be a combination of time and location:


    +   1. **Determine the resolution of the data**: What level of aggregation is
    needed? Will an individual record be at a device level, a reported instance level,
    or a time period level? This should be determined by what makes the most sense
    based on the incoming data resolution, and how it will probably be used for business
    purposes. In our example, the resolution is at a GPS position reporting frequency,
    which is every 10 seconds.'
  merge: -1
  img_proc: true
- pgno: 319
  md: '2. **List out all the variations, categories, calculations, and descriptions
    that are added or transformed from the data:** This should be what your team finds
    useful for modeling. This can also result from discussions with business experts
    on what could be useful to them. In our GPS position example, it is as follows:


    +   - Latitude

    +   - Longitude

    +   - The day of the week

    +   - Time since previous GPS position record

    +   - Speed (calculated from previous rolling set of records)

    +   - The current time zone offset

    +   - Daytime or nighttime

    +   - GPS grid identifier (refer to Chapter 9, *Applying Geospatial Analytics
    to IoT Data*)

    +   - The exact time at UTC

    +   - The exact local time

    +   - The current state of the device (driving, idling, or parked)


    3. **Review each item for how often they are likely to be used in analysis, ML
    modeling, or reporting:** Decide if the cost of creating and storing the information
    is worth it for how often it is used. In our example, the exact local time and
    the day of the week were eliminated. This is based on the expected frequency of
    use versus the storage and computational costs of keeping the information. This
    is a balancing act and your decision may shift over time as different fields become
    more or less valuable to your business.


    4. **Create data transformation code that automatically creates and maintains
    the information in one table:** The goal is to do this in an automated fashion
    so that the data scientists do not have to recreate it each time they need it.


    5. **Create a unique identifier for each record, if it does not already exist:**
    In this case, it would be the exact UTC time combined with the unique device identifier,
    so there is a need to create a separate ID field for the combination. This is
    done to make life easy for the data scientist, who should not have to worry about
    complicating their analytics by connecting datasets using two different fields.
    Combine it into one to simplify things for them:


    | UTCDeviceID | DeviceID | UTC Time | Latitude | Longitude | Time since previous
    (sec) | Speed (km) | Current time zone offset | Day/Night | GPS grid identifier
    | Current State |

    |---|---|---|---|---|---|---|---|---|---|---|

    | 20170619031504G0678991B1 | 0678991B1 | 6/19/2017 3:15:04 | 41.881832 | -87.623177
    | 15 | 0 | -8 | N | U2345 | Parked |

    | 20170619031524G0678991B1 | 0678991B1 | 6/19/2017 3:15:24 | 41.881834 | -87.623181
    | 20 | 5 | -8 | N | U2345 | Driving |

    | 20170619031544G0678991B1 | 0678991B1 | 6/19/2017 3:15:44 | 41.881828 | -87.623182
    | 20 | 20 | -8 | N | U2345 | Driving |

    | 20170619031604G0678991B1 | 0678991B1 | 6/19/2017 3:16:04 | 41.881841 | -87.623181
    | 20 | 25 | -8 | N | U2344 | Driving |


    Analytical dataset example in table form'
  merge: -1
  img_proc: true
- pgno: 320
  md: '# Linking together datasets


    When building each analytical dataset, you should ask yourself *how you can link
    them to other analytical datasets?* Which fields are natural bridges to related
    key datasets? Then, intentionally build the analytical dataset in a way that makes
    it easy to connect to others. This is typically done by creating a new or using
    an existing identifier key. The identify key would be the same in both datasets.


    If this sounds familiar it is the exact same concept as with relational database
    design. It is also closely related to the star schema design in Online Analytical
    Processing (OLAP) data warehousing. The goal is, however, somewhat different.


    With relational database design, the goal is to minimize or even eliminate data
    duplication by denormalizing the data into multiple linked tables. Denormalizing
    separates the identifier from its description in different tables, so that the
    description is only stored once.


    With star schema design, the goal is to make drill down, drill through, and predefined
    metric calculations easy and fast. Datasets are stored and linked along dimensions
    such as time, category, fiscal year, and company divisions.


    However, with LAD design, the goal is to minimize joins while still allowing easy
    creation of hybrid datasets, not previously conceived. The goal is to minimize
    data transformation work for the IoT analyst, who is building training sets for
    ML modeling. The tradeoff is in data size, the initial ETL complexity when developing
    the analytical datasets, and the duplication of data.'
  merge: -1
  img_proc: true
- pgno: 321
  md: <!-- no content -->
