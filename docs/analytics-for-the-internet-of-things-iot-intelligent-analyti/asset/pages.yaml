    # Centering and scaling


    Measurement values can be from vastly different ranges. Barometric pressure is
    typically measured in millibars with an average sea level at 1013 mbar while atmospheric
    temperatures normally range from -30 to 40 celsius. A method to adjust for these
    differences is called centering. You can center a feature by calculating the average
    of all the values in the feature, and then subtract it from each individual value.
    The resulting transformed feature has a mean of zero.


    Imaging drawing a right triangle where the first side is 100 m long, the second
    is 1 m, and the third is 100.03 m long. It would be barely distinguishable from
    a 100 m long line. Now, imagine that the first side grows to 10,000 m long with
    the second side remaining the same. It would be impossible to tell that it is
    even a triangle at all. This is a similar problem for many ML models where the
    feature values are on vastly different scales.'
  merge: -1
  img_proc: true
- pgno: 287
  md: "Some examples of where this can be a problem: precipitation amount versus elevation\
    \ or the price of a house versus the number of bedrooms. A solution to this is\
    \ a method called **scaling**. Scaling divides each value of a feature by its\
    \ standard deviation (calculated over all values in the feature). This forces\
    \ the values to have a standard deviation of one.\n\nCombine centering and scaling,\
    \ and now all the (continuous value) features are comparable to each other. You\
    \ just made it easier for ML models to tease out the signal from the noise.\n\n\
    The following sample code shows how this can be applied in R. This is a continuation\
    \ of the *mice* example code from the previous section:\n\n```\n#center and scale\
    \ the completed example data\nif(!require(caret)){\n  install.packages(\"caret\"\
    )\n}\nlibrary(caret)\n#create the object defining the pre-processing\ncs_example_prepocessObj\
    \ <- preProcess(completed_example_data, method =\n  c(\"center\",\"scale\"))\n\
    #apply the transformation\ncs_example_data <- predict(cs_example_prepocessObj,\
    \ completed_example_data)\n\n#view summary of centered and scaled data\nsummary(cs_example_data)\n\
    ```\n\nThe resulting dataset will be centered and scaled. The summary statistics\
    \ will now look like the following:\n\n| Ozone | Solar.R | Wind | Temp |\n|---|---|---|---|\n\
    | Min. : -1.2217 | Min. : -1.9818 | Min. : -2.34863 | Min. : -2.1993 |\n| 1st\
    \ Qu.: -0.7225 | 1st Qu.: -0.7877 | 1st Qu.: -0.73838 | 1st Qu.: -0.6155 |\n|\
    \ Median : -0.3407 | Median : 0.2847 | Median : -0.08863 | Median : 0.1235 |\n\
    | Mean : 0.0000 | Mean : 0.0000 | Mean : 0.00000 | Mean : 0.0000 |\n| 3rd Qu.:\
    \ 0.5990 | 3rd Qu.: 0.8044 | 3rd Qu.: 0.41987 | 3rd Qu.: 0.7570 |\n| Max. : 3.6825\
    \ | Max. : 1.6336 | Max. : 3.01888 | Max. : 2.0240 |\n\n# Time series handling\n\
    \nIoT data is commonly captured at regular intervals, and the position of the\
    \ value in the series can have a meaning. A dataset captured at regular intervals\
    \ is called a **time series**. Time series present their own complications for\
    \ ML."
