- pgno: 97
  md: 'Compute handles processing, calculations, and running applications. This is
    where the fun stuff happens - your analytics will operate here.


    Storage handles where you keep the input data and output results of your IoT analytics.
    This needs to match the requirements of your analytics.


    Managed services preconfigure a combination of the three categories so that much
    of the detail is handled automatically for you. The launching and configuring
    of underlying services is abstracted away and is handled under the covers. This
    enables you to add functionality quickly while reducing overall complexity. The
    penalty is that you are locking yourself into the AWS ecosystem. But the benefit
    typically outweighs the cost. There is enormous analytical power at your fingertips.


    # AWS key concepts


    Now, we will discuss some key concepts in the AWS cloud design. These include
    Regions, Availability Zones, subnets, and security groups.


    # Regions


    Regions are the major division in AWS and correspond to general data center geographic
    location areas. Singapore, Tokyo, and US East are some example Regions. Your environment
    exists within a Region. Environments in one Region are unaware and unable to communicate
    with environments in other Regions without setting up special pathways (outside
    the scope of this book). You can easily extend your global presence by duplicating
    your environment into another Region.


    # Availability Zones


    Within Regions, there are multiple Availability Zones (AZ). The number depends
    on the Region. These are physically separate locations but are closely linked
    to each other. Communication between Availability Zones is simple to configure.
    Your environment will likely cross multiple Availability Zones for availability
    reasons. If one AZ goes down, the other is unlikely to do so and the functionality
    can automatically be shifted.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# Subnet


    Subnets are divisions of your network, represented by IP ranges. Subnets are created
    within an Availability Zone. Resources are launched into a subnet and can talk
    to other resources in the same subnet. Communication outside subnets needs to
    be defined.


    # Security groups


    These define what network traffic is allowed in and also out. They wrap around
    the compute (and some other) resources that you launch. One or more resources
    can belong to a group. Server instances, databases, and cluster nodes all require
    them. They block everything by default, so you must specify what traffic to allow.
    This is an important safety net. For example, even if you launch a new Linux server
    and make it totally open and vulnerable to the world (but do not do that) as long
    as the security group is locked down, no malicious traffic can get to it. Cloud
    environments are very much a trust no-one world.


    # AWS key core services


    Now that we have covered some key concepts, we can hit the services of interest
    to IoT analytics. We will start with some core services.


    # Virtual Private Cloud (VPC)


    A VPC is your own logically isolated part of the AWS cloud. This is where you
    create and configure your own network as you define it. Think of it as your self-contained
    environment where your analytics will exist. You have complete control here, you
    create and can configure your own IP address range, subnets, network gateways,
    and route tables. Although it was not originally the case, there is now no escaping
    VPCs. Even if you do not create a custom VPC, AWS will create one for you (called
    a default VPC). You are not limited to one VPC; you could have several of your
    own little analytical worlds to lord over.'
  merge: -1
  img_proc: true
