- pgno: 289
  md: 'Another model is then trained on all but one of the subsets, but a different
    one this time. The fold that is held out is used to check on prediction error
    for the model trained on the other folds. This continues so that each fold is
    held out exactly once, and all the data is used in both training and validation.
    The resulting set of models will each run its own prediction and the average of
    the results will be given as the output.


    10 folds is the most commonly used amount, but the number is set more by convention
    than by anything special about the exact number of 10. 10-fold cross-validation
    is the typical terminology used to describe this. The advantage of using cross
    validation is that you simulate a variety of datasets using the same set of training
    data. This increases the chance that the resulting model will generalize well.
    It also allows you to have a robust validation process, even if your training
    data is limited:


    ![](img/9f2a55db1236f995dcd9392acbc82910_289_0.png)


    10-fold cross-validation. Validation set shown in blue for each fold, training
    set shown in white'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'The *caret* package in R makes it easy to incorporate cross-validation into
    your ML process. The ML process is commonly referred to as a **pipeline**.


    The following code example sets up the training process that will be used later
    on in the code, when the model is actually trained. We will use this again later
    in the chapter:


    ```

    ```r

    #Create train control object that defines how training will be done.

    #This example uses 10 fold cross validation which is repeated 5 time.

    library(caret)

    ctrl <- trainControl(method = "repeatedcv", number = 10, repeats = 5)

    ```

    ```


    # ## Test set


    It is best practice to keep a percentage of your training data aside, until you
    have found what you believe to be the optimal performing model or set of optimized
    models (from different techniques).


    This percentage of data held out, usually called the **test set**, will serve
    as your final test of the models that have been optimized through the validation
    process. If you are hiring a consulting company to perform the modeling, keep
    a test set to yourself and do not provide it to them. Use it to confirm the accuracy
    of their resulting optimized model. You should get similar results to what they
    reported. If not, you have something to discuss with them before you pay their
    fees.


    # ## Precision, recall, and specificity


    The results of testing the effectiveness of an ML model against test data can
    be summed up into four categories (assuming the model is predicting between two
    classes, such as **yes/no** or **broken/not broken**). We will use the example
    of a wearable IoT sensor where the sensor data is being used to predict if someone
    is **walking** or **not walking**:


    +   1. The ML model said the person was *walking*, but he was actually sitting
    on the couch watching *Dancing with the Stars* drinking a super-sized Sprite.
    This is a **False Positive (FP)**, also called a Type I error.

    +   2. The ML model said he was **not walking** when he, in fact, was **walking**
    quite quickly to the restroom due to the super-sized Sprite he just drank. This
    is a **False Negative (FN)** or a Type II error.

    +   3. The ML model said he was **walking**, and he was actually **walking**.
    This is called a **True Positive (TP)**.

    +   4. The ML model said he was **not walking** and he was, in fact, snoring up
    a storm in his bed at the time—so **not walking**. This is called a **True Negative
    (TN)**.'
  merge: -1
  img_proc: true
