  md: '# Summing it all up


    So, what have you learned so far just by some quick slicing and dicing of the
    data? You learned that the dataset does not have a complete history for every
    weather station over the period. We identified that records are probably sent
    when there is something to report, and there is not a record for every 15 minutes
    of every day. We found some stations that only report once a month on the 1st
    day.


    We detected a potentially useful pattern with the accumulated level of precipitation
    over time. An extreme event was identified in the data and was externally verified
    as an actual occurrence. You learned the statistical distribution of values for
    each field in the data using R.


    The geographical distribution of stations was also explored. You learned that
    stations are not evenly spaced across the state of Colorado (although not too
    bad for the range of area covered). We also identified some data values that appear
    to be acting as an indicator instead of a measurement (-9999, 999.990). All in
    all, you learned quite a bit about an unknown dataset.


    Now, we will review the dataset documentation to find out whether we were correct
    about the extreme values. This is what would normally be done first, but saving
    it to last makes the chapter a little more interesting.


    Reading through the documentation, we see that there is a value that indicates
    the beginning and end of precipitation accumulation. According to the document,
    this value is 99999 and coincides with a measurement flag of either a or A.


    However, we know from looking at the data, that there are no 99999 values anywhere
    in the dataset. There is also no measurement flag of a or A, although the other
    categories listed seem to be present. The values we did observe, though, seemed
    to be representing the intent as there is no other special value mentioned anywhere
    in the document.


    This is an important lesson for IoT data. Documentation can be wrong. Always check
    into what the data is telling you, trust but verify. Logic can also be implemented
    inconsistently across devices resulting in a mix of values, which may be the case
    here.'
  merge: -1
  img_proc: true
- pgno: 197
  md: '# # Solving industry-specific analysis problems


    We will touch on a few industries to discuss special consideration for IoT data
    exploration and analysis.


    # ## Manufacturing


    For IoT data generated during the manufacturing process, the accuracy of recorded
    values is especially important. Explore the data for outliers and analyze distributions
    carefully. Verify all the data ranges and distributions that you see with the
    experts on the manufacturing process.


    The benefits of making sure the measurement values are clean as possible are two
    fold. First, any machine learning models created to detect problems will be significantly
    more accurate. Secondly, false positives due to invalid data can have a high penalty.
    The manufacturing line and product deliveries may be halted while the issue is
    investigated. In manufacturing, this can get expensive quickly. More perniciously,
    the long-term effect of false positives tends to be the complete rejection of
    the analytics by company management, when they no longer trust the numbers. This
    can cause even more expense to your company in the long run.


    For IoT data generated from the product after it is delivered and in operation,
    the age of the product is key. Many issues are tied to how long the product has
    been in use, whether it is early in life (infant mortality) or late in life (wear
    out) problems. Age will need to be tracked carefully and investigated closely
    in your exploratory analytics.


    Something else to watch out for: many inexperienced analysts calculate problem
    rates by grouping populations by production periods and comparing them by dividing
    the number of failures by the number of units built. Failures are typically determined
    by an IoT device communicating a fault code or by an abnormality in a measured
    value. There is a problem with this though, and it is a big one.


    Since units built earlier have had more time in operation, they have more opportunity
    to experience a failure. Newer built units have had less opportunity. Units will
    continue to age, and the average time in operation for a production period will
    only grow over time. They are at uneven points in their operational life, as the
    datasets are not complete.'
  merge: -1
  img_proc: true
