- pgno: 177
  md: '+   5. Move the **Number of Records** value from the **Marks** card to the
    **Rows** shelf.

    +   6. Remove everything from the **Filter** shelf.


    We will now fast forward a bit on the assumption you have went through the online
    training and know your way around Tableau. Any of the methods we will review could
    be done with other visualization software as well.


    Completeness is not just about missing values but also about the continuity of
    data records. Even if all the values are complete, entire records could still
    be missing. Check for this by lining up record counts by date and time. Break
    out by station to look for periods when no data was recorded. If a data record
    was captured every 15 minutes, you should find 96 rows every day ((60 min/15 min)
    * 24 = 96):


    ![](img/9f2a55db1236f995dcd9392acbc82910_177_0.png)


    As can be seen in the preceding visual, there are not 96 records every day for
    each station. The record varies per day and some days have no records at all.
    Some weather stations are only reporting once a month on the first day. When you
    look into these records, it appears to be test records without usable precipitation
    values.


    This would be the time to call your engineering and field service teams to understand
    if the station is reporting as intended. If so, you will want to know how to identify
    stations that report only test data, so they can be handled differently for analytics.
    If not, you may have just stumbled on a service you can provide. Your analytics
    team can create an algorithm to identify this pattern and automatically notify
    your customer that the station is not reporting data.'
  merge: -1
