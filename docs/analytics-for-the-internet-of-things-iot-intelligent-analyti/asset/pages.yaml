- pgno: 220
  md: '+   - **Hide the complexity:** If it does not add information useful to drawing
    a conclusion, hide it.

    +   - **Start with the end:** Show your conclusions first, then follow up with
    the explanation of what led you there. The same is relevant with a dashboard;
    make the most prominent visual the one that will drive a user to make an action.
    Follow it up with the supporting information.


    +   - **Not considering how the analytics will be used:** Will the analytics and
    visualizations be used to update an executive team once a month? Or will it be
    used by support technicians on a daily basis? Very different visuals would be
    created for either circumstance, even if it is the same information. Here are
    some things to think about:

    +     - **Simplify for management reporting:** Executives have a lot of information
    thrown at them every day, from a variety of sources. Make yours simple to understand
    with clear trend lines and red, yellow, and green symbols indicating status.

    +     - **Add more detail for daily operations users:** They will need as much
    relevant information as you can display in single view without it being too busy
    to interpret. Find the right balance, but lean toward showing more useful data.


    +   - **Making it difficult to answer follow-up questions:** Follow-up questions
    from a visual should be easy and natural to answer. What caused this spike in
    the data? This should be simple to answer for a user of a dashboard. Here are
    some suggestions to avoid this mistake:

    +     - **Anticipate the follow-up questions:** Have the answer either already
    visible or just a simple click away.

    +     - **Layer the views:** Have the capability to drill into the data behind
    the visual elements. Link simpler summary visuals to more detailed visuals, such
    as tying a top 10 Pareto chart to monthly trends.'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'To illustrate how to transform a bad visual into a good one, we will start
    with a horrid example that would give Edward Tufte heart palpitations (Google
    him - then read his books):


    ![](img/9f2a55db1236f995dcd9392acbc82910_221_0.png)


    An example of a putrid chart. Don''t do this


    There are multiple problems with this visual. Dark backgrounds are distracting
    unless the entire theme of a presentation or dashboard is dark. Neither of the
    axes are labeled. It is unclear which line is more important, so the chart gives
    the impression to the audience that all are equally important.


    A character code is used in the legend instead of a more descriptive name. If
    someone is not intimately familiar with the code, they will have to look up the
    descriptions for them. 3D was used in a way that does not provide any informational
    value. It distracts attention away from the key data.


    Labels are applied to values without any rounding. This makes the chart cluttered
    and implies a precision that may not be accurate. If this is a chart reviewed
    monthly, the historical trend is important, but the exact values are not - with
    the exception of the current month.'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'The chart is both difficult to interpret and visually confusing. Now, let''s
    look at an improved version of the same chart:


    ![](img/9f2a55db1236f995dcd9392acbc82910_222_0.png)


    Much better visual, the key trend is obvious and the current month value is clearly
    stated


    This visual is much more clear about which trend line is the most important one.
    Lines are also clearly labeled so the audience does not have to reference a legend.
    The current month value, which is the number reported on each month, is clearly
    visible without an implied extreme precision.


    Both axes are labeled so that the audience does not have to guess at what is being
    measured. The axis labels for the month are perpendicular, which visually aligns
    with the value for the month. It takes a little more work to format a visual in
    this way, but the audience will understand the information faster and more clearly.
    This makes it worth the effort.


    # The Hierarchy of Questions method


    When designing visuals and dashboards, instead of just replicating the same charts
    and tables that you created for yourself when exploring the data, take a minute
    to think about things from the point of view of the audience. Think about how
    their perspective and needs differ from yours.'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'In your situation as an analyst, you know the data and environment well already;
    you do not need labels and descriptions on your charts. What you want is as much
    information as you can fit into one place, so you can easily find patterns. The
    people who will be either interacting with dashboards or viewing your presentation
    have different needs.


    They will want to be able to orient themselves visually with minimal effort. They
    want the key conclusions to be obvious. They do not want to have to spend a lot
    of time trying to figure it out, or have to ask a lot of questions just to understand
    what is being shown. They want simple and familiar, but with enough detail that
    they feel confident that the data is backing up their interpretation.


    It is useful to follow a framework when designing analytics interactions for others.
    This will help to organize your thoughts and plan out what visualizations and
    dashboards are needed to support analysis by other people.


    # The Hierarchy of Questions method overview


    Here, we will introduce a process to plan out visualizations, which we will call
    the Hierarchy of Questions method. Instead of starting with requirements and mockups,
    you start with mapping out the thought process of the audience.


    After this, you pull together the data needed to answer the questions identified
    in the mapped thought process. The data should be in a form that can be queried
    efficiently and in multiple different ways. We will discuss ways to do this in
    a later chapter.


    Finally, visuals are created which are aligned to the mapped thought process.
    The same data will probably be used multiple times in different ways. The benefit
    of following this process is that it puts the needs of the audience first, without
    anchoring to a starting visualization - which is likely to be whatever was easiest
    to create. The tendency, in that case, is to do what is simplest for the developer
    (you) to create and maintain, as opposed to what is best for the audience. Freeing
    yourself from a set starting place for a visualization allows you to be open to
    innovative ways of interacting with the analytics.'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'Remember, you are one person while the audience is many; and, in the case of
    dashboards, each person will have to use it many times over. The sum benefit of
    getting it right can be large, especially for customer-facing dashboards, which
    could have thousands of users.


    ![](img/9f2a55db1236f995dcd9392acbc82910_224_0.png)


    General process for the hierarchy of questions method


    # Developing question trees


    The first step in the process is to brainstorm a list of questions that the visualizations
    in a presentation or dashboard should answer. If at all possible, do this with
    a small group of end users. If it is not possible or you are preparing a small
    presentation, start by putting yourself in their shoes. Try to forget what you
    know about the data. Think what questions you would want answered, if you were
    in their place. List them out.


    The next step is to generalize the list of questions into the underlying concepts
    of what is really being asked for each one. For example, the question *Is the
    temperature sensor reading under 21 degrees in the summer?* would be turned into
    *Is the temperature sensor reading significantly different from the average at
    this time of year?* Some questions may get consolidated together. The idea is
    to get to a concept that can be applied over many situations versus a specific
    situation.


    Then, review the list and identify the questions that are the starting points.
    Starting points are the reasons that would motivate one to initially go to a dashboard
    or sit through a presentation in the first place. Then, identify which questions
    are really follow-up questions to the starting point question. The example question
    *Is the temperature sensor reading significantly different from the average at
    this time of year?* is probably not a starting point question. It is more likely
    to be *What is the average temperature reading trend for a region?*, followed
    up by *Are there any outlier readings?*, and then *Is the temperature sensor reading
    significantly different from the average at this time of year?*.'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'Arrange the questions in a hierarchy with the starting points at the left linked
    to their follow-up questions out to the right. If the same follow-up question
    relates to multiple starting point questions, duplicate it for each. It may be
    subtly different in each scenario. We will refer to the resulting diagram as a
    **question tree**. This can then be used as a reference when building the datasets
    and visualizations.


    To illustrate how this process works, we will use movie time information to walk-through
    the process. Most people can easily relate to it. The first step is to list out
    the questions that would lead you to want to know your movie time information:


    +   - When is *Transformers 12* playing?

    +   - What theaters are playing *Rocky Horror Picture Show*?

    +   - Is the cinema sold out for *Avengers vs. Justice League* at 8:10 pm tonight?

    +   - How many seats are left?

    +   - How much does a ticket cost at that theater?

    +   - How far away is Cineblast 128?

    +   - How long will it take to get to Cinema Cheap-o?

    +   - What movies are at Luxury Cinema tonight?

    +   - What movies are playing at around 9 pm tomorrow night?


    The next step is to generalize the questions and consolidate:


    +   - What times can I see the movie I want to see?

    +   - What theaters are playing the movie I want to see?

    +   - Will I be able to get good seats at a specific theater and time?

    +   - Will I be able to get good seats at a specific theater and time? (consolidate)

    +   - What is the price of a ticket at a specific theater and time?

    +   - What is the travel time to a specific theater at a specific time?

    +   - What is the travel time to a specific theater at a specific time? (consolidate)

    +   - What movies are at the theater I want to go to?

    +   - What movies can I see at a certain time?'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'Then, identify the main starting point questions. It is helpful to start documenting
    your reasoning for choosing the questions. In this example, there are three variables:
    movie, place, and time. You generally have decided on one of those already and
    need information to help you decide on the other two:


    +   - What times can I see the movie I want to see?

    +     - *I know the movie I want. I’m dying to see Transformers 12; I just need
    to know which times I can see it. Then, I’ll want to know where it is playing
    and whether I can still get good seats for me and my friends. Ticket price and
    how long it will take to get to the theater would be helpful too.*

    +   - What movies are at the theater I want to go to?

    +     - *I know the place I want. I love going to Luxury Cinema; it is such a
    great experience. I just want to know if there are any movies there that I want
    to see. Then, I’ll want to know the times and whether I can get good seats; I
    don’t want to pay top dollar and not even be able to sit next to my girlfriend.*

    +   - What movies can I see at a certain time?

    +     - *I know the time I want. We’re going out to dinner with reservations at
    7 pm, and I want to see if there are any movies in the area I can see afterwards.
    I’ll want to know the price and whether I can get good seats, and how long it
    will take to get there from the restaurant.*


    The final step is to organize the questions into a question tree. The following
    diagram shows a question tree for the movie time example:'
  merge: -1
  img_proc: true
