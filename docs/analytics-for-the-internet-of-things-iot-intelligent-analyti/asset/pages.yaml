- pgno: 86
  md: 'As your analytics develop, you will have a list of actions that is either transforming
    the data, running it through a model or algorithm, or reacting to the result.
    It can get complicated quickly. By encapsulating the analytics, it is easier to
    know where to make changes when needed down the road. You will also be able reconfigure
    parts of the process without affecting the other components.


    The encapsulation process follows these steps:


    +   1. Make a list of the steps.

    +   2. Organize them into groups.

    +   3. Think which groups are likely to change together.

    +   4. Separate the groups that are independent into their own processes.


    It is a good idea to have the data transformation steps separate from the analytical
    steps if possible. Sometimes, the analysis is tightly tied to the data transformation,
    and it does not make sense to separate, but in most cases, it can be separated.
    The action steps based on the results of the analysis should almost always be
    separate.


    Each group of steps will also have its own resource needs. By encapsulating them
    and separating the processes, you can assign resources independently and scale
    more efficiently where you need it. You can do more with less.


    # Decoupling with message queues


    Decoupling encapsulated analytics processes with message queues has several advantages.
    It allows for change in any process without requiring the other ones to adjust.
    This is because there is no direct link between them.


    It also builds in some robustness in case one process has a failure. The queue
    can continue to expand without losing data while the down process restarts, and
    nothing will be lost after things get going again.'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# What is a message queue?


    ![](img/9f2a55db1236f995dcd9392acbc82910_87_0.png)


    New data comes into a queue as a message, it goes into line for delivery, and
    then it is delivered to the end server when it gets its turn. The process adding
    a message is called the **publisher**, and the process receiving the message is
    called the **subscriber**.


    The message queue exists regardless of whether the publisher or subscriber is
    connected and online. This makes it robust against intermittent connections (intentional
    or unintentional). The subscriber does not have to wait until the publisher is
    willing to chat and vice versa.


    The size of the queue can also grow and shrink as needed. If the subscriber gets
    behind, the queue just grows to compensate until it can catch up. This can be
    useful if there is a sudden burst in messages by the publisher. The queue will
    act as a buffer and expand to capture the messages while the subscriber is working
    through the sudden influx.


    There is a limit, of course. If the queue reaches some set threshold, it will
    reject (and you will most likely lose) any incoming messages until the queue gets
    back under control.


    Here is a contrived but real-world example of how this can happen:


    > Joe Cut-rate (the developer): *Hey, when do you want this doo-hickey device
    to wake up and report?*


    > Jim Unawares (the engineer): *Every 4 hours*


    > Joe Cut-rate: *No sweat. I’ll program it to start at 12 a.m. UTC, then every
    4 hours after. How many of these you gonna sell again?*'
  merge: -1
  img_proc: true
