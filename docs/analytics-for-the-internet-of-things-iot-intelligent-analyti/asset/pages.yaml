- pgno: 60
  md: 'A newer category, **LTE Category 0 (LTE Cat 0)**, is designed for IoT requirements.
    It has lower data rates, capped at 1 Mbit/s maximum. LTE Cat 0 also reduces bandwidth
    ranges, which allows for significant complexity reduction. It is still able to
    operate on all existing LTE networks and supports low power constrained IoT devices.


    Cellular coverage is not available in all areas, though. There are still some
    places where you will not find a signal. For analytics, this means that if your
    IoT device moves around, it could venture into an area without a signal. Data
    could be lost in this case, unless it is buffered until the signal is recovered.


    # Common use cases


    Cellular is commonly used in the follow applications:


    +   - Freight tracking

    +   - Vehicle connectivity (telematics)

    +   - Smartphones (obviously)

    +   - Remote equipment monitoring


    # IoT networking data messaging protocols


    There are many strategies that IoT networked devices use to transfer data messages.
    Although connectivity and data messaging can sometimes blend together, we will
    discuss them separately for simplicity.


    Not that it is really all that simple, but we will cover the most commonly used
    protocols. We will spend more time with the more frequently used ones.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# Message Queue Telemetry Transport (MQTT)


    MQTT is the most common data messaging protocol associated with IoT. It is supported
    by all the major cloud infrastructure providers (AWS, Microsoft, and Google).
    And it is most likely the protocol that is being used to deliver your data. It
    was designed for minimal power loss and minimal bandwidth requirements. It originated
    to support remote oil and gas use cases over satellite communication networks.
    It translated well into the broader IoT world as it developed in recent years.


    ![](img/9f2a55db1236f995dcd9392acbc82910_61_0.png)


    At its heart, it is similar in concept to a messaging queue architecture but,
    despite the name, not a traditional queue. This means that new data comes into
    an intermediary broker as a message, and then it is delivered to the end server.
    The IoT device is called the publisher and the ending server is called the subscriber.
    Both connect to the broker but never to each other.


    MQTT follows the publish/subscribe architecture pattern or pub/sub, but it is
    implemented differently than a traditional message queue. It is a queue of one,
    in that the message for the topic is replaced with the latest data instead of
    being added to an expanding line of messages, as with a traditional message queue.


    The message on the broker exists regardless of if the publisher or the subscriber
    is online and willing to interact with it. This makes it robust against intermittent
    connections (intentional or unintentional). The subscriber does not have to wait
    until the publisher is awake and willing to chat. The publisher can send a message
    without caring about the details of who is willing and able to receive it.'
  merge: -1
  img_proc: true
- pgno: 62
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 63
  md: 'The concept of topic matching is supported for subscribers. This allows wildcard
    characters, + or #, to be used when subscribing to topics. This is not allowed
    for publishers.


    A + is a wildcard character for a single level. It works like a search pattern
    where all non + levels must match. A # is a wildcard character for multiple levels
    and must be used at the end of the string. It will return the entire hierarchy
    specified. Similar to copying a folder in your filesystem, it will subscribe to
    all subdirectories and files included for the level specified.


    The wildcard allows simpler subscription management to topics. You could subscribe
    to `vehicleID/engine/+/temperature` to get all the temperature values in the engine
    topic. You could also subscribe to `+/engine/oil/temperature` to get engine oil
    temperature values for all devices publishing to that broker. You could subscribe
    to `vehicleID/engine/#` to get all values in that hierarchy no matter how deep
    the levels go.


    It is important that the topic tree is designed with flexibility in mind. It should
    be extensible so that new branches can be added without requiring a redesign of
    the tree. From an analytical point of view, this means that adding more information
    from the devices is relatively inexpensive if designed well. If designed poorly,
    it requires a redesign of the topic tree, which makes it more expensive and therefore
    unlikely to happen. In the constantly adapting world of analytics where you learn
    new things and exploit them, you want flexibility at all levels.


    # Advantages to MQTT


    +   - **Packet agnostic:** Any type of data can be transported in the payload
    carried by the packet. The data could be text or binary. It does not matter as
    long as the receiving party knows how to interpret it.

    +   - **Reliability:** There are some **Quality of Service (QoS)** options that
    can be used to guarantee delivery.

    +   - **Scalability:** The publish/subscribe model scales well in a power-efficient
    way.

    +   - **Decoupled design:** There are several elements to the design that decouple
    the device and the subscribing server, which result in a more robust communication
    strategy.'
  merge: -1
  img_proc: true
- pgno: 64
  md: "+   - **Time:** A device can publish its data regardless of the state of the\
    \ subscribing server. The subscribing server can then connect and receive the\
    \ data when it is able. This decouples the two ends of the communication on a\
    \ time basis. Think of it like the ability to text someone on your phone. He can\
    \ reply whenever he gets the chance. If you called him, he would have to be available\
    \ to talk at the same time as you are. If you both are busy in meetings all day,\
    \ you end up trading voicemails and the communication slows. This allows the devices\
    \ to remain in sleepy states without having to worry about if the subscriber is\
    \ able to receive the data at the time the device wakes up to communicate.\n+\
    \   \n+   - **Space (delivery details):** The publisher needs to know the broker\
    \ IP address and how to communicate with it, but it does not need to know anything\
    \ about the subscribers. Subscribers do not need to know the network connection\
    \ details of the publisher. This keeps the communication overhead low on the device\
    \ side (usually much more constrained in terms of power availability). It also\
    \ allows both ends to operate independently. The subscriber can be changed or\
    \ upgraded and additional subscribers added with no change needed on the publishing\
    \ device end.\n+   \n+   - **Synchronizing:** Neither side has to pause what they\
    \ are doing to communicate or receive a message. The process is asynchronous.\
    \ There is no need to interrupt work in progress to publish a message.\n+   \n\
    +   - **Security:** This is in both the advantage and disadvantage lists. You\
    \ can have security with MQTT, which is why it is on the advantage list. Since\
    \ MQTT operates over TCP, you can and absolutely should use the TLS/SSL encryption\
    \ in the communication. But MQTT is natively unencrypted, which is why it is also\
    \ in the disadvantage list - more about this will be explained later.\n+   \n\
    +   - **Bidirectional:** A device can be both a publisher and a subscriber. In\
    \ this way, it can receive commands by subscribing to a topic on the broker. It\
    \ could also receive data from other devices that could be an input into the data\
    \ it publishes. In practice, a hub and spoke model is typically the case.\n+ \
    \  \n+   - **Maturity:** MQTT was invented by IBM with the first draft of the\
    \ protocol in 1999 based on its MQSeries product (this is where the message queue\
    \ part of the name comes from). It was released royalty free in 2010 and has since\
    \ been donated as an open source project to the Eclipse foundation. It is in use\
    \ by millions of connected products."
  merge: -1
  img_proc: true
- pgno: 65
  md: '# # Disadvantages to MQTT


    +   - **It operates over TCP:** TCP was designed for devices that had more memory
    and processing power than many of the lightweight, power constrained IoT devices
    have available to them. TCP requires more handshaking to set up communication
    links before any messages can be exchanged. This increases wake-up and communication
    times, which affects the long-term battery consumption. TCP connected devices
    tend to keep sockets open for each other with a persistent session. This adds
    to power and memory requirements.

    +   - **Centralized broker can limit scale:** The broker can affect scalability
    as there is additional overhead for each device connected to it. The network can
    only grow as large as the local broker hub can support it. This puts a limit on
    expansion for each hub and spoke group.

    +   - **Broker single point of failure:** It can also be a single point of failure
    in the network. A common situation is a broker device that is plugged into a wall
    socket with several publishing devices that are battery powered. In the event
    of a power failure, the publishing devices would keep operating but the broker
    would be offline. The network would be useless until the power is resumed.

    +   - **Security:** MQTT is unencrypted by default. This makes it natively unsecured
    and requires you to take additional steps and absorb some overhead to make sure
    TLS/SSL is implemented. If not, any communication over MQTT, including username
    and password, is open to hackers.


    # ## QoS levels


    There is a trade-off inherent to QoS levels. QoS is the MQTT terminology for message
    delivery reliability requirements. It is a common term in networking, and we will
    review how it is implemented specifically for MQTT.


    The trade-off is between bandwidth used and reliability of message delivery. More
    back and forth messaging is required to ensure higher reliability, which increases
    bandwidth requirements for the same message packet. MQTT gives you some options
    to choose between.


    ![](img/9f2a55db1236f995dcd9392acbc82910_65_0.png)


    QoS is set separately for both the ends of the communication. There is a QoS that
    is set for the publisher to broker messaging connection and a separate QoS that
    is set for the broker to subscriber connection. Often, QoS is the same for both,
    but not always.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# QoS 0


    **Fire and forget** - sir, yes, sir!


    QoS 0 is the minimal QoS level, often referred to as fire and forget. Messages
    are sent to the broker without confirmation that it has been sent on by the broker
    to subscribers. It still has all the guarantees of the TCP protocol, as do all
    forms of standard MQTT.


    As can be seen in the following diagram, there is minimal communication overhead,
    which translates into minimal power requirements. Once sent to the broker, the
    message is deleted on the device (publisher). The broker immediately sends on
    to subscribers that have an open connection. Unlike the other QoS levels, the
    message is not stored for offline subscribers when QoS is set to zero.


    QoS 0 is often used when there is a stable connection and disruption is unlikely,
    like in the case of a wired connection. It is also used when power constraints
    are more important than message delivery. In this case, either the resulting data
    is acceptable even with some messages lost, or the frequency of messages is high
    enough that if one is lost, then no big deal, another will be on the way shortly.


    ![](img/9f2a55db1236f995dcd9392acbc82910_66_0.png)


    # QoS 1


    **Deliver once** - I don''t care if you send it 10 times, just make sure they
    get it.


    QoS 1 is the most commonly used level. It guarantees the message is delivered
    at least once. Duplicate messages need to be handled either on the subscriber
    side or in some post processing. There is a higher communication overhead than
    QoS 0 but only half as much back and forth as QoS 2.'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'QoS 1 is used when delivery needs to be guaranteed and the use case can handle
    duplicate messages.


    ![](img/9f2a55db1236f995dcd9392acbc82910_67_0.png)


    # QoS 2


    **Deliver exactly once** - Make sure they get it, but make sure they only get
    it once - they get confused.


    QoS 2 guarantees the message is delivered and delivered only once. As can be seen
    in the diagram, there are multiple back and forth communications to orchestrate
    this guarantee. The state of the communication needs to be stored by both the
    sides until full confirmation of delivery is communicated back to the publisher.
    This requires both a higher level of power on the device and a larger memory footprint
    in order to store the more complex state. It also takes a bit longer to complete
    QoS 2 communications.'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'QoS 2 is used when delivery needs to be guaranteed and the end application
    or subscribing client is unable to handle duplicate messages.


    ![](img/9f2a55db1236f995dcd9392acbc82910_68_0.png)


    # Last Will and Testament (LWT)


    This creatively named feature helps MQTT deal with lossy networks and enhances
    scalability. It is a message that can be stored on the broker in case the publisher
    drops off the network unexpectedly.


    It stores state and purpose including the commands it published and its subscriptions.
    When it drops out, the broker notifies all subscribers of the LWT. When it returns,
    the broker sends it back to its prior state.'
  merge: -1
  img_proc: true
- pgno: 69
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 70
  md: '![](img/9f2a55db1236f995dcd9392acbc82910_70_0.png)


    # Representational State Transfer (REST) principles


    REST allows internet-enabled devices to inter-operate with each other using a
    uniform Application Programming Interface (API). A device or server that complies
    to this is called RESTful. It assumes interactions are client/server-based and
    are stateless. The following table shows the key commands supported by the HTTP
    REST API Interface:


    | HTTP REST API |

    | --- |

    | HTTP POST: Adds a new resource |

    | HTTP PUT: Updates a specific resource by replacing it with an updated version
    |

    | HTTP GET: Reads a specified resource |

    | HTTP PATCH: Partially updates a resource in a collection |

    | HTTP DELETE: Deletes a resource |'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# HTTP and IoT


    In many cases, HTTP is not ideal for IoT applications. The latency is not predictable,
    and it often depends on polling to detect state changes. It is a text-based protocol,
    which means message size tends to be large. This adds power needs and complexity
    overhead, for IoT devices to communicate using it.


    However, it is a mature standard and in wide use. This makes it an established
    and well supported interface.


    Connections are established from a client device to a server device and remain
    open until the communication is completed. Delivery is guaranteed and data message
    receipts are acknowledged at every step of the process. It operates on top of
    TCP and is reliable.


    # Advantages to HTTP


    There are several advantages to HTTP as an IoT protocol:


    +   - **Reliability**: Message delivery is guaranteed and acknowledged.

    +   - **Ubiquity**: HTTP is used all over the place and is very easy to implement.

    +   - **Ease of implementation**: If you can connect to the internet, you can
    use HTTP anywhere in the world. No special hardware or software is required.


    # Disadvantages to HTTP


    There are some disadvantages to HTTP as an IoT protocol:


    +   - **Higher power needs**: Communications have frequent back and forth interactions,
    connections need to be sustained, and plain text results in larger message sizes.
    All of this requires more power to support.

    +   - **The IoT device complexity**: The device needs enough memory and CPU power
    to support the TCP protocol and high level HTTP RESTful APIs.


    # Constrained Application Protocol (CoAP)


    CoAP is point-to-point communication over **User Datagram Protocol (UDP)**. It
    has low overhead requirements and was specifically developed for low-power devices
    operating over the internet. It was designed to work on microcontrollers with
    as low as 10 KiB of RAM and needs only 100 KiB for the operating codes.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '![](img/9f2a55db1236f995dcd9392acbc82910_72_0.png)


    CoAP was created by the Internet Engineering Task Force (IETF) to address the
    needs of power constrained IoT devices. It is also supported by the Eclipse foundation
    as an open standard.


    CoAP follows a client/server architecture and is a one-to-one communication convention.
    It does allow for some multicast capabilities, which are early in development
    at the time of this writing.


    CoAP is similar to HTTP in that it is a document transfer protocol and interoperates
    with the RESTful web. It is different from HTTP, in that it was designed for applications
    where networks are low-powered and often lossy.


    CoAP operates on UDP protocol where data packets are much smaller than HTTP, which
    uses larger TCP packets. Clients and servers communicate without established connections.
    Information is transferred using self-contained datagrams. Datagrams are the core
    of the UDP protocol and each datagram contains all necessary information for routing
    without any reliance on previous exchanges between client and server.'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'It may help to think of a datagram like communicating with someone over mail
    (old school snail mail). The envelope has a delivery address and a return address
    and the payload would be the letter inside, but this is hidden from the mail man.
    You send regular letters to your cousin in Poland. She sends regular letters to
    you.


    You have no guarantee that all your letters will be delivered or delivered in
    the same order that you sent them. It is your responsibility, once letters are
    received, to open them up, put them in the right order, and figure out if there
    are any missing. If you find one to be missing, you would handle mailing your
    cousin to request a resend of it.


    CoAP works in the same manner where the sending and receiving applications play
    the role of you and your cousin. Applications need to be programmed appropriately
    to handle the required level of delivery reliability.


    # Advantages to CoAP


    There are some advantages to CoAP:


    +   - **Reduced power requirements:** It operates over UDP, which requires minimal
    overhead for communications. It also allows faster wake up times and extended
    sleepy states. Taken together, this means batteries last longer for IoT devices.

    +   - **Smaller packet size:** Another advantage of UDP is small packet sizes.
    This leads to faster communication cycles. Again, this allows batteries to last
    longer.

    +   - **Security:** Like MQTT, this is on both the advantage and disadvantage
    lists. When **Datagram Transport Layer Security (DTLS)** is employed over UDP,
    communication is encrypted and secure. Even though there is some additional overhead
    required to implement this, you can and should use it.

    +   - **Asynchronous communication option:** Clients can request to observe a
    device by setting a flag. The server (IoT device) can then stream state changes
    to the client as they happen. Either side can cancel the observe request.

    +   - **IPv6 based:** It was designed from the beginning to support IPv6. This
    also allows for a multicasting option.

    +   - **Resource discovery:** Servers can provide a list of resources and media
    types. The client can then review and discover what is available.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# Disadvantages to CoAP


    There are also some disadvantages to CoAP:


    +   - **Message unreliability**: UDP does not guarantee the delivery of datagrams.
    CoAP adds a method to request a confirmation acknowledgement to confirm the message
    was received. This does not verify that it was received in its entirety and decoded
    properly.

    +   - **Standards are still maturing**: CoAP is still evolving, although there
    is a lot of market momentum behind it. It is likely to mature quickly as use becomes
    more widespread.

    +   - **NAT issues**: Network Address Translation (NAT) devices are commonly used
    in enterprise networks and cloud environments. CoAP can have problems communicating
    with devices behind a NAT since the IP can be dynamic over time.

    +   - **Security**: Like MQTT, CoAP is unencrypted by default. This makes it natively
    unsecure and you need to take additional steps to make sure communication is not
    open to hackers.


    # Message reliability


    This equates to MQTT QoS. With CoAP, there is an option to mark the request and
    response datagrams as confirmable. In this case, the receiver responds with an
    Acknowledgement (ACK) message.


    If this flag is not marked, datagrams are fire and forget. This is the equivalent
    of MQTT QoS 0.


    # Common use cases


    CoAP protocol is commonly used in the following applications:


    +   - Utility field area networks

    +   - Remote weather station sensors

    +   - Sealed battery-operated sensor devices'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# Data Distribution Service (DDS)


    DDS is a type of networking middleware. Its standards are managed by the Object
    Management Group (OMG). It is a bus-style architecture; a centralized node is
    not required. Communication is peer-to-peer and not centrally controlled.


    ![](img/9f2a55db1236f995dcd9392acbc82910_75_0.png)


    Endpoints for communication are automatically discovered by DDS through a process
    called dynamic discovery. DDS uses a variant of the publish/subscribe model, where
    nodes on the bus announce what data they are publishing and what data they want
    to subscribe to.


    DDS participants could be on the same machine or at the same factory or even spread
    over a wide area. It could be all of those combined when individual DDS domains
    are linked together. It is a very scalable architecture.


    Data exchange is real time and dependable with high transfer rates. DDS handles
    the details of the transfer work for you such as message addressing, delivery,
    flow control, retries, and data marshaling/demarshaling. Any node could be a publisher,
    a subscriber, or both at the same time.'
  merge: -1
  img_proc: true
