- pgno: 17
  md: '# Preface


    How do you make sense of the huge amount of data generated by IoT devices? And
    after that, how do you find ways to make money from it? None of this will happen
    on its own, but it is absolutely possible to do it. This book shows how to start
    with a pool of messy, hard-to-understand data and turn it into a fertile analytics
    powerhouse.


    We start with the perplexing undertaking of what to do with the data. IoT data
    flows through a convoluted route before it even becomes available for analysis.
    The resulting data is often messy, missing, and mysterious. However, insights
    can and do emerge through visualization and statistical modeling techniques. Throughout
    the book, you will learn to extract value from IoT big data using multiple analytic
    techniques.


    Next, we review how IoT devices generate data and how the information travels
    over networks. We cover the major IoT communication protocols. Cloud resources
    are a great match for IoT analytics due to the ease of changing capacity and the
    availability of dozens of cloud services that you can pull into your analytics
    processing. Amazon Web Services, Microsoft Azure, and PTC ThingWorx are reviewed
    in detail. You will learn how to create a secure cloud environment where you can
    store data, leverage big data tools, and apply data science techniques.


    You will also get to know strategies to collect and store data in a way that optimizes
    its potential. The book also covers strategies to handle data quality concerns.
    The book shows how to use Tableau to quickly visualize and learn about IoT data.


    Combining IoT data with external datasets such as demographic, economic, and locational
    sources rockets your ability to find value in the data. We cover several useful
    sources for this data and how each can be used to enhance your IoT analytics capability.


    Just as important as finding value in the data is communicating the analytics
    effectively to others. You will learn how to create effective dashboards and visuals
    using Tableau. This book also covers ways to quickly implement alerts in order
    to get day-to-day operational value.


    Geospatial analytics is introduced as a way to leverage location information.
    Examples of geospatial processing using Python code are covered. Combining IoT
    data with environmental data enhances predictive capability.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'We cover key concepts in data science and how they apply to IoT analytics.
    You will learn how to implement some examples using the R statistical programming
    language. We will also review the economics of IoT analytics and discover ways
    to optimize business value.


    By the end of the book, you will know how to handle scale for both data storage
    and analytics, how Apache Spark can be leveraged to handle scalability, and how
    R and Python can be used for analytic modeling.


    # What this book covers


    Chapter 1, Defining IoT Analytics and Challenges, defines, for the purposes of
    this book, what constitutes the Internet of Things. It will also define what is
    meant by the term Analytics when used in the book. The chapter will discuss special
    challenges that come with IoT data from the volume of data to issues with time
    and space that are not normally a concern with internal company data sets. The
    reader will have a good grasp of the scope of the book and the challenges that
    he or she will learn to overcome in the later chapters.


    Chapter 2, IoT Devices and Networking Protocols, reviews in more depth the variety
    of IoT devices and networking protocols. The reader will learn the scope of device
    and example use cases, which will be discussed in easy-to-understand categories.
    The variety of networking protocols will be discussed along with the business
    need they are trying to solve. By the end of the chapter, the reader will understand
    the what and the why of the major categories of devices and networking protocol
    strategies. The reader will also start to learn how to identify characteristics
    of the device and network protocol from the resulting data.


    Chapter 3, IoT Analytics for the Cloud, speaks about the advantages to cloud-based
    infrastructure for handling and analyzing IoT data. The reader will be introduced
    to cloud services, including AWS, Azure, and Thingworx. He or she will learn how
    to implement analytics elastically to enable a wide variety of capabilities.


    Chapter 4, Creating an AWS Cloud Analytics Environment, provides a step-by-step
    walkthrough on creating an AWS environment. The environment is specifically geared
    towards analytics. Along with screenshots and instructions on setting it up, there
    will be explanation on what is being done and why.


    Chapter 5, Collecting All That Data - Strategies and Techniques, speaks about
    strategies to collect IoT data in order to enable analytics. The reader will learn
    about tradeoffs between streaming and batch processing. He or she will also learn
    how to build in flexibility to allow future analytics to be integrated with data
    processing.'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'Chapter 6, Getting to Know Your Data - Exploring IoT Data, focuses on exploratory
    data analysis for IoT data. The reader will learn how to ask and answer questions
    of the data. Tableau and R examples will be covered. He or she will learn strategies
    for quickly understanding what the data represents and where to find likely value.


    Chapter 7, Decorating Your Data - Adding External Datasets to Innovate, speaks
    about dramatically enhancing value by adding in additional datasets to IoT data.
    The datasets will be from internal and external sources. The reader will learn
    how to look for valuable datasets and combine them to enhance future analytics.


    Chapter 8, Communicating with Others - Visualization and Dashboarding, talks about
    designing effective visualizations and dashboards for IoT data. The reader will
    learn how to take what they have learned about the data and convey it in an easy-to-understand
    way. The chapter covers both internal and customer-facing dashboards.


    Chapter 9, Applying Geospatial Analytics to IoT Data, focuses on applying geospatial
    analytics to IoT data. IoT devices typically have a diverse geographic location
    when deployed and sometimes even move. This creates an opportunity to extract
    value by applying geospatial analytics. The reader will learn how to implement
    this for their IoT analytics.


    Chapter 10, Data Science for IoT Analytics, describes data science techniques
    such as machine learning, deep learning, and forecasting using ARIMA on IoT data.
    The reader will learn the core concepts for each. They will understand how to
    implement machine learning methods and ARIMA forecasting on IoT data using R.
    Deep learning will be described along with a way to get started experimenting
    with it on AWS.


    Chapter 11, Strategies to Organize Data for Analytics, focuses on organizing data
    to make it much easier for data scientists to extract value. It introduces the
    concept of Linked Analytical Datasets. The reader will learn how to balance maintainability
    with data scientist productivity.


    Chapter 12, The Economics of IoT Analytics, talks about creating a business case
    for IoT analytics projects. It discusses ways to optimize the return on investment
    by minimizing costs and increasing opportunity for revenue streams. The reader
    will learn how to apply analytics to maximize value in the example case of predictive
    maintenance.


    Chapter 13, Bringing It All Together, wraps up the book and reviews what the reader
    has learned. It includes some parting advice on how to get the most value out
    of Analytics for the Internet of Things.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# What you need for this book


    This book will guide you to know how to get the most value out of Analytics for
    the Internet of Things explained with the examples. You will need to install R
    and Rstudio, Tableau, and Python to effectively run the code samples present in
    this book.


    # Who this book is for


    This book is for professionals that are either currently struggling with how to
    create value with IoT data or are thinking about building this capability in the
    near future. This includes developers, analytics practitioners, data scientists,
    and general IoT enthusiasts.


    This book is also intended to be useful for business executives, managers, and
    entrepreneurs who are investigating the opportunity of IoT. This book is for anyone
    who wants to understand the technical needs and general strategies required to
    extract value from the flood of data.


    A reader of this book wants to understand the components of the IoT data flow.
    This includes a basic understanding of the devices and sensors, the network protocols,
    and the data collection technology. They also want an overview of data storage
    and processing options and strategies. Beyond that, the reader is looking for
    an in-depth discussion of analytic techniques that can be used to extract value
    from IoT big data.


    Finally, they are looking for clear strategies to build a strong analytics capability.
    The goal is to maximize business value using IoT big datasets. The reader wants
    to understand how to best utilize all levels of analytics from simple visualizations
    to machine learning predictive models.


    Prior knowledge of IoT would be helpful but not necessary. Some prior programming
    experience would be useful.


    # Conventions


    In this book, you will find a number of styles of text that distinguish between
    different kinds of information. Here are some examples of these styles, and an
    explanation of their meaning.'
  merge: -1
  img_proc: true
