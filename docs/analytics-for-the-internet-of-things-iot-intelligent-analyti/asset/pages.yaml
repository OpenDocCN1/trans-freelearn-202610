- pgno: 199
  md: '# # Retail


    Analysis problems in retail will focus on location, demographics, and time, among
    other factors. Exploring data using geography (latitude and longitude of locations)
    in a software such as Tableau increases the likelihood of finding patterns that
    can be exploited for business value.


    When you can explore by geography, you can also integrate data with economic indicators
    for the region. Datasets about population in the area can be explored in combination
    with the IoT data. Date and time values for retail data needs to be especially
    accurate. Foot traffic during the day can impact sales. The IoT time values need
    extra analysis to ensure the accuracy.


    Knowing the location combined with accurate time values can allow you to calculate
    the correct local time along with whether it is dark or light outside. Incorporating
    local traffic patterns and the amount of daylight could end up being key predictive
    features for a predictive model. The model could lead to increased sales.


    Seasonal impact is also be a key factor for retail analytics. With accurate time
    and location, you can analyze IoT data for patterns related to the weather at
    the time the IoT data was captured.


    # # Summary


    In this chapter, you learned steps to explore IoT data in order to get to know
    and understand it well. The importance of reviewing raw data was discussed. Tableau
    was introduced, along with some walk-through on how to use it to explore and visualize
    data.


    We introduced R and RStudio as a powerful way to do some statistical analysis
    of datasets. The chapter also discussed some industry-specific considerations
    for IoT analytics.'
  merge: -1
  img_proc: true
