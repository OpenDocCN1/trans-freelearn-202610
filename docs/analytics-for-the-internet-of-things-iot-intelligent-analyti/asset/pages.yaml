- pgno: 24
  md: '# 1


    # Defining IoT Analytics and Challenges


    In this chapter, we will discuss some concepts and challenges associated with
    analytics on Internet of Things (IoT) data. We will cover the following topics:


    +   - The analytics maturity model

    +   - Defining the IoT

    +   - What is different about IoT data?

    +     - Data volume

    +     - Problems with time

    +     - Problems with space

    +     - Data quality

    +     - Analytics challenges

    +   - Concerns with finding business value


    # The situation


    The tense white-yellow of the fluorescent ceiling lights press down on you while
    you sit in your cubicle and stare at the monitors on your desk. You sense it is
    now night outside but can''t see over the fabric walls to know for sure. You stare
    at the long list of filenames on one screen and the plain text rows of opaque
    sensor data on the other screen.'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'Your boss had just left to angrily brood somewhere in the office, and you are
    not sure where. He had been glowering over your shoulder.


    "We spent $20 million in telecommunication and consulting fees last year just
    to get this data! The hardware costs $20 per unit. We''ve been getting data, and
    it has been piling up costing us $10,000 a month. There are 20 TB of files - that''s
    big data, isn''t it? And we can''t seem to do anything with it?"he had said.


    "This is ridiculous!", he continued, "It was supposed to generate $100 million
    in new revenue. Where is our first dollar? Why can''t you do anything with it?
    I have five consultants a week calling me to tell me they can handle it- they''ll
    even automate it. Maybe we should just pick one and hope they aren''t selling
    us snake oil."


    You know he does not really blame you. You were a whiz with Excel and knew how
    to query databases. A lot of analytics requests went to you. When the CEO decided
    the company needed a big data guy, they hired a VP out of Silicon Valley. But
    the new VP ended up taking a position with a different Silicon Valley company
    the day before he was supposed to start at your company.


    You were hastily moved into the new analytics group. A group of one - you. It
    was to be a temporary shift until another VP was found. That was six months ago.
    The company is freezing funds for outside training and revenues are looking tight.
    So, no training for you.


    Although many know the terms, no one in the company actually understands what
    Hadoop is or how to even start using this thing called machine learning. But others
    more and more seem to expect you to not only know it but already be doing it.


    Executives have been reading articles in HBR and Forbes about the huge potential
    of the IoT combined with Artificial Intelligence or AI. They feel like the company
    will be left behind, and soon, if it does not have its own IoT big data solution
    incorporating AI. Your boss is feeling the pressure. Executives have several ideas
    for him where AI can be used. They seem to think that getting the idea is the
    hard part, implementation should be easy. Your boss is worried about his job and
    it rolls downhill to you.'
  merge: -1
  img_proc: true
