- pgno: 228
  md: '# Pulling together the data


    IoT data is typically stored using big data technology such as Hadoop (HDFS specifically).
    Joining together tables in SQL statements for dashboards typically decreases performance,
    sometimes significantly in these systems.


    Pull together the data into as few tables as possible, so the table joins are
    only done during batch processing instead of every time a dashboard is used by
    someone. When considering what information to include in the dataset, reference
    the question tree and include what is needed to answer the questions.


    # Aligning views with question flows


    When designing visuals, align them with the question tree hierarchies. The first
    and most visible visual should answer the starting point question. The follow-up
    questions should be addressed in the same visual, if possible, but less prominently.
    If this is too unwieldy, then the follow-up should be a simple click away for
    a user to answer his question. The same is applicable with the follow-up question
    to the first follow-up question, and so on.


    You may need to do a different dashboard for each hierarchy tree if it is too
    cumbersome to answer in the same dashboard. The test here is to think what is
    easiest and most natural to a user. The goal is for the dashboard or presentation
    order to follow the thought processes of the audience.


    We will walk through a full example using an IoT data set later on in the chapter.


    # Designing visual analysis for IoT data


    We will review some important considerations when designing visual analysis with
    special attention for IoT data.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# # Using layout positioning to convey importance


    Layout position implies what is important and primary; you should take advantage
    of this to help communicate more effectively with your audience. In Western cultures,
    the eye starts in the upper-left position of a view. This is due to years of habit
    reading from left to right and top to bottom. This is where one''s eye goes first
    by habit. Put the key message here: the answer to your starting point question.


    As you travel right and lower in a view, put the visuals (including tables and
    text) in order of its position in the question tree. This will follow along with
    eye movement and the audience''s thought process:


    ![](img/9f2a55db1236f995dcd9392acbc82910_229_0.png)


    Recommended layout order when showing multiple visuals in same view


    In other cultures, apply the same concept but follow the position order that aligns
    with reading order. For example, in Pakistan the language Urdu is written right
    to left - so the most important information should be in the upper right.


    # # Use color to highlight important data


    Color is also a powerful way to communicate to an audience what they should interpret
    as important. Use it sparingly, however, as too many colors in the same view are
    confusing and diminish the impact.'
  merge: -1
  img_proc: true
- pgno: 230
  md: '# The impact of using a single color to communicate importance


    In order to reiterate how powerful color (or shades of gray if only grayscale
    is available) can be, we will look at an example. In the following image, look
    through the numbers and count how many 6s you see. What was your count? How long
    did it take?


    ![](img/9f2a55db1236f995dcd9392acbc82910_230_0.png)


    A random set of numbers. Count the number of times 6 is shown.


    Now, let''s take the same image and put the important information (the 6s) in
    the foreground using color and the less important information (the other numbers)
    in the background by lightening to a shade of gray.


    Looking at the changed image, how many 6s do you count? How long did it take you?
    You will find that it is far easier and faster to do with the key data highlighted
    with color. Do the same for your audience, and you will make it easier for them
    also to understand the key information:


    ![](img/9f2a55db1236f995dcd9392acbc82910_230_1.png)


    The same random set of numbers with the number 6 highlighted in color. Adapted
    from Cole Nussbaumer Knaflic''s book Storytelling with Data.'
  merge: -1
  img_proc: true
- pgno: 231
  md: '# Be consistent across visuals


    In a presentation or in a series of dashboards, make sure to keep your colors
    and formatting consistent. If the average temperature is shown as a solid blue
    line in the first chart, make sure it is also a solid blue line in all following
    charts. Keep colors consistent even if the type of chart changes. If a pressure
    sensor trend in a line chart is blue, make sure that in a following scatter plot,
    the points are also blue.


    This consistency saves your audience from having to reorient themselves between
    views. It also helps prevent misinterpretations as it is easy to assume the same
    color has the same meaning.


    # Make charts easy to interpret


    For IoT data, time series analysis is very common. Analyzing trends in IoT sensor
    values over time is useful for people in roles such as technical support, marketing,
    quality, and engineering. Time series charts communicate trend data more effectively
    than pareto charts or pie charts. Since you will be employing them quite a bit,
    it is important to make them as effective as you can. When creating charts, keep
    some things in mind to help make it easy for your audience to draw the conclusions
    that you intended.


    In most cases, you have looked at the data in far more ways than you will be making
    available to your audience. You picked the charts that best convey what you have
    learned from your analysis of the data. Make it easy for your audience to grasp.


    Here are some ways to help:


    +   - **Accentuate the key data**: Make the key trend line in a chart bright and
    bold. In a table, bold the row you found to be the most important. Make it obvious.
    You are not insulting their intelligence, you are saving them time and minimizing
    misinterpretations.

    +   - **Label chart items clearly**: Give the chart a clear title and make the
    font big enough to read easily. Make sure chart axes are labeled and avoid abbreviations.

    +   - **Point out key information**: Circle an area on a chart you want to make
    sure the audience notices. Draw an arrow pointing to it and add text that states
    how they should interpret it. If there is a spike in average temperature in December
    due to record high regional temperatures, and not due to a system issue, circle
    it and add a note. It will save the audience from having to ask the question or
    investigate it themselves.'
  merge: -1
  img_proc: true
- pgno: 232
  md: '# # Creating a dashboard with Tableau


    Tableau makes it easy to assemble a dashboard from the visual analysis tabs you
    have already created. We will use it to build from the weather station data example
    in Chapter 6, *Getting to Know Your Data - Exploring IoT Data*. We will also walk-through
    the hierarchy of questions process in the course of building the dashboard.


    # ## The dashboard walk-through


    There is also web server software for Tableau, called **Tableau Server**, that
    allows you to easily publish a dashboard from the desktop software so that it
    is viewable through a browser. Other users can then easily interact with it. Although
    Tableau Server is outside the scope of this book, you would most likely want to
    publish the dashboards you create to it.


    # ## Hierarchy of Questions example


    For this simple example, let''s assume the audience is a government water use
    planning group for the State of Colorado. The group wants to understand how many
    weather stations are reporting precipitation information and a sense of how well
    the information is being captured. The following steps show how this can be made
    into a question tree:


    +   - **Step 1: List out questions the audience wants to ask of the analytics:**

    +     - Did the number of stations reporting precipitation change from last month?

    +     - How many stations in total have sent precipitation numbers?

    +     - Where are the stations located?

    +     - How many have reported a significant rainfall?

    +     - Is there anything weird in the daily sums for each station that might
    indicate a problem?

    +     - Which areas of the state had some good rain last month?

    +   - **Step 2: Generalize the questions and consolidate:**

    +     - What is the trend of stations reporting usable precipitation data?

    +     - How many stations report data?

    +     - Where are the stations that reported usable data in the period?

    +     - Did a station report significant rainfall in the period?'
  merge: -1
  img_proc: true
- pgno: 233
  md: '+   - Are there abnormal precipitation values for a specific station?

    +   - Where are the stations that reported usable data in the period? (consolidate
    with the similar question earlier in the list)

    +   - Step 3: Identify starting point questions:

    +     - Based on conversations with the water planning group, you determine their
    first thought is to simply check the number of stations that report 15-minute
    precipitation data.

    +     - Starting point question: How many stations report data?

    +   - Step 4: Organize the questions into a question tree diagram:


    ![](img/9f2a55db1236f995dcd9392acbc82910_233_0.png)


    Weather station question hierarchy


    # Aligning visuals to the thought process


    Think through what visuals are needed and how to arrange them before creating
    them in Tableau. The most important thing, the starting point, should be the first
    thing the audience views. If there are to be multiple visuals in the same dashboard,
    it should be in the upper-left part of the screen.


    Since a simple count is all that is really needed to answer the question, this
    can just be a number. No chart is necessary. You should make it large, so it is
    instantly noticed. Make it what may feel uncomfortably large, and it will be obvious
    to the audience without needing to point out that it is the most important piece
    of information in the view.


    A trend of the number of reporting stations is needed so the audience can understand
    if more or less are reporting usable data over time versus the total number. This
    aligns with the first follow-up question. A monthly trend should work.'
  merge: -1
  img_proc: true
- pgno: 234
  md: 'Then, for any given period, the water planning group wants to know where the
    reporting stations are located and whether there was significant precipitation
    for the period at the stations. They also want some idea of locations in the state
    with significant reported precipitation. A map is a good way to fit in a lot of
    spatial information in a way that can be easily comprehended. This aligns with
    the secondary follow-up question.


    For any station or group of stations in an area, the planning group wants to be
    able to see daily trends, so anything unusual can be detected quickly for additional
    investigation. This aligns with the last follow-up question. Now, we can start
    building the views one at a time, then assemble them into a dashboard.


    # Creating individual views


    For the first view, use Tableau to connect to the 15-minute precipitation dataset
    from Chapter 6, Getting to Know Your Data - Exploring IoT Data. The starting point
    question can be answered by counting the number of unique stations in the dataset
    regardless of the validity of the values. Set up a calculated field called Number
    of Stations using the formula, COUNTD([Station]), which will aggregate based on
    a distinct count of unique stations. Drag the Number of Stations aggregation to
    the text box in the Marks shelf. Make the number big and bold, so it will be seen
    first.


    ![](img/9f2a55db1236f995dcd9392acbc82910_234_0.png)'
  merge: -1
