  md: '# 7


    # Decorating Your Data - Adding External Datasets to Innovate


    "What if rich women like their houses colder than poor women?"


    Oh no, you think. Your boss just asked an odd question and this usually means
    one thing. He has been assigned a SEWOTI, which means you have been assigned a
    SEWOTI (Stupid Executive Waste Of Time Idea). How would you even answer a question
    like that? Would that not require some extensive marketing surveys?


    "Interesting question, how did it come up?" you ask.


    "John, the Senior Vice President of Sales, was talking about how cold his wife
    likes to keep the house in the summer," he answered, "So we got to thinking that
    maybe wealthy women just like it colder. And if that was the case, maybe we should
    market the new top of the line thermostat to women instead of men."


    You nod your head like it is a great idea. But you do not think it is a great
    idea, certainly not without the marketing data that backs it up.


    "We were even talking about changing the color scheme on the faceplate to make
    it more feminine. Anna is working on pricing it right now," he continued, "And
    with the great work that you''ve done with analyzing and mapping the data from
    the field, I figured this would be an easy question for you to answer. So I told
