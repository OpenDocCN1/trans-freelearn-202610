- pgno: 201
  md: 'This chapter is about dramatically enhancing value by adding additional datasets
    to the stored IoT data. Valuable additions come from both internal sources, such
    as manufacturing or **Customer Relationship Management (CRM)** data, and external
    data sources, such as economic or demographic datasets. You will learn how to
    look for valuable datasets and combine them to enhance future analytics in the
    search for untapped business value.


    This chapter covers the following topics:


    +   - General strategies on extracting value from combining datasets

    +   - Internal datasets:

    +     - Which ones and why?

    +   - External datasets - geography:

    +     - Elevation

    +     - Weather

    +     - Map APIs

    +     - Transportation

    +   - External datasets - demographic:

    +     - Census statistics

    +     - World factbook

    +   - External datasets - economic:

    +     - Global economic data

    +     - Federal Reserve US time series

    +     - Using code and APIs to add data


    # Adding internal datasets


    IoT data by itself is only part of the story. There is a multitude of useful data
    already available to you that could be a store of hidden value. Internal datasets
    can be overlooked as a way to quickly enhance IoT data. They are an excellent
    place to start. IoT data should not be viewed in isolation; think of it as a continuation
    of data already stored about your company''s products, customers, and processes.


    Data should be combined into a 360-degree view of your business to maximize the
    opportunity of finding new value in it. The fastest and easiest place to start
    is usually (but not always) the internal datasets that you already have available.'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'The reason it may not always be the fastest and easiest comes from internal
    data security and legacy system hurdles; which can sometimes make it difficult
    to extract internal data to combine with IoT data. This may be a stumbling block
    for internal datasets, which, perhaps counter-intuitively, is not the case with
    external datasets. External datasets tend to be easier to obtain and have less
    security concerns, since they are publicly available. Either way, the potential
    value is still worth the effort of overcoming these hurdles.


    # Which ones and why?


    When deciding on which internal datasets to integrate with IoT data, think about
    which ones would help explain unusual changes in sensor values or would correlate
    with patterns in the data. These datasets are more likely to help uncover business
    value. There are many internal company datasets that will help you unlock value;
    we will discuss four areas to consider next.


    # Customer information


    As obvious as it may be, it bears pointing out how important incorporating information
    about the customer is to uncovering value from your IoT data. Information such
    as customer address can be geocoded to get the latitude and longitude coordinates.
    This can be used to establish a device location, which will allow you to build
    another layer of analytics.


    Understanding things such as sex, age, or income level can help identify patterns
    not visible otherwise. For industrial customers, knowing industry and application
    of the equipment where your device is located can be the key that unlocks hidden
    patterns in the data. For these and many other reasons, customer information should
    be at the top of the list of internal datasets to combine with IoT data.


    # Production data


    Production information about the equipment that is the source of your IoT data
    is also valuable to throw into the mix. Failures are often linked to the manufacturing
    date, plant, and line where the equipment was assembled. Subcomponents and third-party
    parts are tied to the equipment identifier.


    Production data can also be used to estimate time in the field if that is not
    directly available. This can be done by using manufacturing date as a starting
    place and estimating time to sale and in field operation. Different equipment
    configurations may also end up being key attributes that you can use to make assumptions
    for other data that you may not have.'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'For example, if a company builds vehicles, and red flashing lights are only
    included on vehicles built as fire trucks, you can probably classify the customer
    of these vehicles as fire departments even if you do not have this information
    directly in the customer data.


    # Field services


    Bringing in datasets from technician repair visits, maintenance records, and call
    center logs is another great place to start tapping value from your data. There
    will be key events such as repair work or complaint calls that can be linked to
    unusual patterns in IoT data.


    Maintenance records will be useful in developing predictive maintenance models.
    It may also tie into equipment failure predictive models. Call center logs could
    be mined to develop attributes of IoT data events beyond just reported numericals
    or categorical values. **Natural Language Processing (NLP)** can be used to extract
    attributes from text data.


    For a utility company that provides natural gas, for example, the phrase *rotten
    egg* in call log texts, corresponding to a pattern in the IoT data for low gas
    pressure, could be a tip off that a gas leak is occurring. Analytics could then
    be developed to recognize the pattern in future IoT data records for proactive
    investigation.


    # Financial


    The difference between revenue and cost is profit. The anticipation of profit
    is the driver for most investments in IoT systems. Linking customer payments (revenue)
    and company expenses (costs) to IoT datasets can shed light on potential value
    opportunities.


    You may find that customers spend money on your products after certain events
    identifiable in IoT data. This could be extended warranty purchases or service
    parts. You may also find that they do not spend money when you would expect they
    should. An example is IoT data indicating part failures but with no corresponding
    part purchased by the customer. This implies the service parts were bought from
    someone else. You will want to identify both the situations.


    # Adding external datasets


    There is a wide variety of useful external datasets available to download and
    integrate into your IoT analytics, often for free. There are far too many of these
    to do an exhaustive tour, but we will touch on some useful examples. Using these
    datasets is a great low-cost way to enhance the value of your IoT data.'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# External datasets - geography


    You have IoT devices distributed across many locations. Location is now an attribute
    that can allow you to find patterns in the data, which you can then monetize.
    The environment, the demographics in the area, the local economic conditions,
    and the weather can all be tied to the geographic location of the device. Use
    geographic datasets to enhance the potential value of your IoT data.


    # Elevation


    Elevation can be an important attribute in many situations as it is tied to the
    operating conditions of the device and the surrounding environment. Even if your
    device does not move, it can still be valuable to know its elevation. The maker
    of a smart oven, for example, would surely want to know elevation as it affects
    baking time and characteristics.


    # SRTM elevation


    In February 2000, the U.S. Space Shuttle Endeavor was launched specially equipped
    with two radar antennas on a mission to map the topography of most of the globe.
    As depicted in the following image, one of the radar antennas was inside the shuttle
    bay and the other was at the end of a 200 foot (60 meter) mast. The mast was extended
    once the shuttle was in the orbit. The combined radar swept the earth as the shuttle
    orbited in a pattern over the globe.


    ![](img/9f2a55db1236f995dcd9392acbc82910_204_0.png)


    The artist rendering of SRTM in operation. Courtesy NASA/JPL-Caltech'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'The mission was called the **Shuttle Radar Topography Mission (SRTM)** and
    in its 10 days of operation, it collected the most complete near-global dataset
    of high-resolution elevation mapping to date. This was an international mission
    led by the National Geospatial-Intelligence Agency (NGA) and the National Aeronautics
    and Space Administration (NASA).


    The data was captured using two sets of radar equipment: one referred to as C-band
    and the other as X-band. The C-band data was processed over two years by the Jet
    Propulsion Laboratory in California. The slightly higher resolution X-band data
    was processed by German Aerospace Center (DLR). Global data was fully released
    in 2015.


    The resolution of the data is at 90 meters globally and 30 meters within the United
    States. The dataset can be downloaded from the **U.S. Geological Services (USGS)**
    website (`https://lta.cr.usgs.gov/SRTM`). There are also R and Python packages
    (*SRTM.py* on GitHub is an example) built to handle downloading and manipulation
    of the SRTM dataset. The author recommends using one of these instead of the full
    dataset, unless you have a very large set of locations that you want to add elevation
    data for, all at once.


    # National Elevation Dataset (NED)


    The NED is a high-resolution elevation dataset covering the United States, including
    Alaska, Hawaii, and territorial islands. It is managed by the USGS, which updates
    it about every 2 months to include new and improved data. The data is assembled
    from a diverse set of sources and transformed to a common coordinate system and
    elevation scale (meters).


    The resolution ranges from 90 meters down to 3 meters (1/9th arc-second) in some
    areas. Processing and interpolation techniques are used to produce a seamless
    dataset for full coverage. The size of the total set of data files is quite large;
    the USGS has a map viewer to help identify regions to download the subsets of
    the data.


    NED includes the following sets of products:


    +   - **NED 3**: This data has the highest resolution (1/9 arc-second, which is
    approximately 3 meters) but has limited coverage.

    +   - **NED 10**: This data has high resolution (1/3 arc-second ,which is approximately
    10 meters) and is created from multiple **Digital Elevation Models (DEM)**. Sources
    can include LIDAR and aerial photography.

    +   - **NED 30**: This dataset has wide coverage and moderate resolution (1 arc-second,
    which is approximately 30 meters). It is assembled from multiple DEMs resampled
    to 1 arc-second.

    +   - **NED 60**: This is the lowest resolution data (2 arc-seconds, which is
    approximately 60 meters). It adds coverage for some areas of Alaska.'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'NED is useful for higher-precision elevation data needs. The downside is that
    it is limited in coverage to the United States. The author recommends using SRTM
    when possible as long as the resolution is acceptable for your use case. The elevation
    values will differ between the datasets, but in general, the author has found
    them to be fairly comparable.


    NED data can be downloaded using the map viewer tool at `https://viewer.nationalmap.gov/basic/`.
    The following screenshot shows the coverage of the NED 10 data. Data files are
    in GIS format, which we will discuss further in a later chapter. Files are also
    available for a direct download from an FTP site (`ftp://rockyftp.cr.usgs.gov/vdelivery/Datasets/Staged/Elevation/`).
    The following image shows the map and download interface:


    ![](img/9f2a55db1236f995dcd9392acbc82910_206_0.png)


    National map viewer data download tool. NED 10 coverage shown in orange.


    # Weather


    There are many sources for weather-related data, both paid and free. The **National
    Oceanic and Atmospheric Administration (NOAA)** has multiple free datasets available
    for download. From climatic data to daily averages, there is a lot of useful information
    to choose from.'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'The Integrated Surface Global Hourly dataset can be useful for many IoT analytics
    projects. This dataset includes weather attributes such as air quality, atmospheric
    pressure, temperature, dew point, wind speed and direction, clouds, and precipitation
    from over 20,000 global stations. The digital observations are forwarded from
    various operation centers or decoded directly at the Federal Climate Complex in
    Asheville, North Carolina, USA.


    All the data is stored in a single ASCII format that conforms to **Federal Information
    Processing Standards (FIPS)**. The data files are sorted by the weather station,
    year, month, day, hour, and then minute. An example of the dataset is shown in
    the following screenshot:


    ![](img/9f2a55db1236f995dcd9392acbc82910_207_0.png)


    The dataset can be downloaded in multiple ways, including with a map viewer. You
    can also get data definition and other useful documentation from https://data.noaa.gov/dataset/integrated-surface-global-hourly-data.


    If you know the latitude and longitude of your IoT devices, you can download the
    location information for the weather stations from the web page. This information
    is compiled in a KMZ file. Use this to link to the nearest weather station in
    order to add the weather attributes at the place and time of IoT data records.


    # Geographical features


    Elevation and weather conditions are valuable datasets to add when you know the
    location of your devices, but incorporating geographical features in relation
    to your device can also be a way to unlock hidden value through analytics. This
    becomes especially important when your device moves, such as when attached to
    a shipping container.'
  merge: -1
  img_proc: true
- pgno: 208
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 209
  md: 'You will need GIS tools to open and process the data. These will be discussed
    in a later chapter. Having a full dataset with details about roads (name and type
    of road for example) and points of interest (restaurant or gas station for example)
    can be especially useful for transportation-related IoT data. Incorporating a
    full-scale dataset into your Hadoop environment, for instance, allows you to operate
    geospatial analytics at scale.


    # Google Maps API


    Location data from IoT devices can also be decorated as needed versus integrating
    a full dataset into your environment. Third-party APIs are a good way to do this
    while leveraging the expertise of other companies that specialize in geospatial
    analytics. There are many good ones available, including APIs from Google, Bing
    (Microsoft), Esri, and OpenStreetMaps.


    Although mainly intended for web and mobile application developers, the web service
    APIs for Google Maps can be used to quickly add location identifiers, turn addresses
    into latitude and longitude coordinates, or calculate driving times between locations.
    The APIs can add many useful attributes to a dataset. Using them makes a lot of
    sense when your data record flow is in the tens of thousands per day versus tens
    of millions per day.


    The following screenshot shows the variety of currently available Google Map APIs.
    Each API has its own set of functionality and options, putting a lot of power
    at your fingertips:


    ![](img/9f2a55db1236f995dcd9392acbc82910_209_0.png)


    Google Maps web service APIs. Source: Google


    Leveraging the web service APIs to add attributes to IoT data can be done easily
    in R or Python. Google provides a Python Client Library to simplify the use for
    the programming language. There are packages available on CRAN, such as a googleway,
    that simplify Google Maps API calls for R.'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'To start using Google Maps API, you will need to obtain a developer key to
    use in your API calls that authenticates the code and sets up billing. There are
    links on the Maps API website to help you set this up.


    Here is a sample R code using the *googleway* package. You will need to install
    it first using the RStudio GUI or the code, `install.packages("googleway")`. Insert
    your Google Maps API key and run the code to get the time zone offset for the
    latitude and longitude coordinates:


    ```

    ```r

    #Load googleway package (assuming it is already installed)

    library(googleway)


    #Get the timezone offset information for a pair of latitude and longitude coordinates

    tz <- google_timezone(location = c(41.882702,-87.619392),timestamp = as.POSIXct("2017-03-05"),key
    = "< Replace everything between these quotes with your API Key >")


    #View results

    View (tz)

    ```

    ```


    This is a very simple example, but shows how easily it can be used to do something
    that would be quite complex to develop by yourself.


    # USGS national transportation datasets


    The **United States Geological Survey (USGS)** national transportation dataset
    is a collection of datasets that includes railroads, trails, airports, roads,
    waterways, and other transportation-related geographical features. The data was
    provided through U.S. Census Bureau sources and supplemented with road data from
    a specialist mapping company, HERE.


    Data not only includes the shapes of roads and railways but also tables of information
    about them. The coverage is limited to the United States but has standardized
    classification codes and descriptors. The dataset was compiled to support geospatial
    analysis related to traffic safety, congestion, disaster planning, and emergency
    responses.'
  merge: -1
  img_proc: true
- pgno: 211
  md: '# Decorating Your Data - Adding External Datasets to Innovate


    The dataset is available to download at no cost in either Esri File Geodatabase
    or Shapefile format. The following screenshot is a subset of the available data
    tables in the dataset:


    ![](img/9f2a55db1236f995dcd9392acbc82910_211_0.png)


    Partial view of USGS Best Practices data table definitions. Source: USGS


    # External datasets - demographic


    Another way to enhance the value of IoT data is to add demographic information
    based on time and location. Attributes such as healthcare coverage rate, average
    income in the area, and population ages could have predictive values when combined
    with your IoT data.


    # The U.S. Census Bureau


    For the U.S., the Census Bureau maintains demographic datasets down to the state
    and county level. Many other countries have similar governmental bodies with the
    same mission. There are multiple datasets available, but a great place to start
    is the QuickFacts dataset.'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'QuickFacts maintains statistics for all U.S. states and counties, along with
    cities and towns that have a population of 5,000 or more. It includes statistics
    on population size and density, age and sex, race, housing, education, economy,
    income, business, and health. The dataset uses the **Federal Information Processing
    Standards (FIPS)** code as the identifier. The FIPS code is normally what you
    would use to link to your IoT data.


    The FIPS code is a five-digit identifier that identifies counties (or county equivalents)
    in the United States. The first two digits signify the state and the last three
    identify the county. A list of FIPS codes can be downloaded from `https://www.census.gov/geo/reference/codes/cou.html`.


    The U.S. Census Bureau also maintains some useful geospatial datasets that have
    demographic information already integrated. Information about the **Topologically
    Integrated Geographic Encoding and Referencing (TIGER)** datasets is available
    at `https://www.census.gov/geo/maps-data/data/tiger.html`.


    | Product | Best For... | File Format | Type of Data | Level of Detail | Descriptive
    Attributes | Vintages Available |

    |---|---|---|---|---|---|---|

    | TIGER/Line Shapefiles | Most mapping projects—this is our most comprehensive
    dataset. Designed for use with GIS (geographic information systems). | Shapefiles
    (.shp) and database files (.dbf) | Boundaries, roads, address information, water
    features, and more | Full detail (not generalized) | Extensive | 2006–2016, 2013
    |

    | TIGER Geodatabases | Useful for users needing national datasets or all major
    boundary files. Designed for use in ArcGIS. Files are extremely large. | Geodatabase
    (.gdb) | Boundaries, roads, address information, water features, and more | Full
    detail (not generalized) | Limited | 2013–2016 |

    | TIGER/Line with Demographic and Economic Data | Data from selected attributes
    from the 2010 Census, 2006–2010 through 2010–2014 ACS 5-year estimates and County
    Business Patterns (CBP) for selected geographies. Designed for use with GIS. |
    Shapefiles (.shp) and Geodatabases | Boundaries, Population Counts, Housing Unit
    Counts, 2010 Census Demographic Profile 1 attributes, 2006–2010 through 2010–2014
    ACS 5-year estimates data profiles, CBP data | Full detail (not generalized) |
    Limited | 2012 CBP, 2010, 2006–2010 to 2010–2014 ACS 5-Year Estimates |

    | Cartographic Boundary Shapefiles | Small scale (limited detail) mapping projects
    clipped to shoreline. Designed for thematic mapping using GIS. | Shapefiles (.shp)
    | Selected boundaries | Less detail (generalized) | Limited | 2013–2015, 2010,
    2000, 1990 |

    | KML – Cartographic Boundary Files | KML — creating maps using Google Earth,
    Google Maps, or other platforms that use KML. | KML (.kml) | Selected boundaries
    | Less detail (generalized) | Limited | 2013–2015 |

    | TIGERweb | Viewing spatial data online or streaming to your mapping application.
    | Interactive viewer, HTML data files, plus REST and WMS map services | Boundaries,
    roads, address information, water features, and more | Detailed | Extensive |
    Current, 2015 ACS, 2014 ACS, 2010 Census |


    ![](img/9f2a55db1236f995dcd9392acbc82910_212_0.png)


    # CIA World Factbook


    The Central Intelligence Agency (CIA) of the United States maintains a free, useful,
    no-strings-attached (that we know about) database of information about the countries
    of the world. Despite the reputation of daring spywork, CIA also has the comparatively
    boring role of compiling useful information about places all over the world.


    The agency makes some of this information available to anyone that can use a web
    browser. If anyone from the agency is reading this book (hopefully through a purchase
    and not directly from the author''s laptop - but we kid, we kid), the author would
    like to thank you for making this great source of global information available
    for free. It is available as public domain, which means no worries about copyright
    or reserved publication rights issues.'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'The World Factbook includes information about over 260 world entities (as they
    term it, but think countries). The information is on things such as the history,
    people, government, economy, geography, communications, transportation, and military
    for each country.


    However, the World Factbook is not available in machine-readable form from the
    website; you can find a JSON version on GitHub. It is a useful reference for understanding
    various countries of the world if your IoT devices are globally distributed. It
    is available at https://www.cia.gov/library/publications/the-world-factbook/.


    # External datasets - economic


    Economic data and changes in trends can also be a source of predictive value when
    combined with IoT data. This information can help explain buying patterns for
    retail use cases, energy consumption for utility monitoring, and machinery utilization
    rates in manufacturing.


    # Organization for Economic Cooperation and Development (OECD)


    OECD is a forum where 34 democratic market-economy countries work together along
    with over 70 non-member countries to promote economic growth, prosperity, and
    sustainable development. As part of this mission, the organization compiles a
    database of economic and related statistics, which it makes available to everyone.


    > The Organization provides a setting where governments can compare policy experiences,
    seek answers to common problems, identify good practice, and coordinate domestic
    and international policies.


    The database is available on OECD.Stat (http://stats.oecd.org/). It has datasets
    that range from agriculture and fisheries to industry and services. Data is included
    for OECD member countries and some selected non-member economies. Since the information
    for all the countries follow the OECD statistic guidelines, they are much more
    comparable than when collected through different sources, which may have different
    statistical methods.'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'Each theme has subcategories and multiple measures within each of them. There
    are methods to export the datasets into machine readable form (such as .csv) and
    an API that can be used to grab the data with code. The site has functionality
    to create template API queries, which simplifies using it. The following screenshot
    is an example of what statistics are available in the **Monthly Economic Indicators**
    theme:


    ![](img/9f2a55db1236f995dcd9392acbc82910_214_0.png)'
  merge: -1
  img_proc: true
- pgno: 215
  md: '# Federal Reserve Economic Data (FRED)


    In the United States, the Federal Reserve Bank of St. Louis maintains a huge set
    of economic related time series data, mostly covering the U.S., but some are international.
    This collection is referred to as FRED. FRED is your friend, he knows a lot.


    He knows the Consumer Price Index For All Urban Consumers, by month. FRED knows
    the Civilian Unemployment Rate and Real Median Household Income. He knows the
    Estimate of People of All Ages in Poverty for United States and the number of
    internet users in the world.


    There are over 470,000 U.S. and international time series from over 80 different
    sources in FRED. FRED has useful tools such as a Microsoft Excel Add-in and some
    mobile apps for your smartphone. FRED even has a forecasting game you can play
    called FREDcast. FRED is located at https://fred.stlouisfed.org/.


    FRED has a geospatial component called GeoFRED. You can use it to create a map
    version of the time series data or to download shapefiles. The following screenshot
    is an example showing the 2014 90% Confidence Interval Lower Bound of Estimate
    of Median Household Income by County:


    ![](img/9f2a55db1236f995dcd9392acbc82910_215_0.png)


    2014 90% Confidence Interval Lower Bound of Estimate of Median Household Income
    by County. Source: GeoFRED'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'FRED has three developer APIs:


    +   - **FRED APIs**: This can be used to programmatically retrieve time series
    data from the FRED datasets.

    +   - **FRASER APIs**: This API can be used to retrieve metadata from the **Federal
    Reserve Archival System for Economic Research (FRASER)**. FRASER holds historical
    documents and archives.

    +   - **GeoFRED APIs**: This allows programmatic access to GeoFRED data and shapefiles.


    You will need to obtain an API key from the FRED website to use them. Another
    way to grab FRED data is from using an R package such as *Quandl*. Install the
    package from RStudio GUI or the `install.packages` function. You can then use
    it to get data from several financial data sources including FRED. The following
    is some sample R code that gets the U.S. GDP time series data:


    ```

    ```r

    #load Quandl library

    library(Quandl)


    #Grab US GDP time series data from FRED

    gdp_ts = Quandl("FRED/GDP")


    #Display

    View(gdp_ts)

    ```

    ```


    Using code libraries in R allows you to automate the process to incorporate the
    data on a regular basis into your analytics environment.


    # Summary


    In this chapter, we discussed how to enhance your IoT data with both internal
    and external datasets. This can greatly enhance the opportunity to find value.
    By adding this additional data, you can develop attributes to develop and test
    theories about your data.


    All theories should be tested with data. IoT data allows you to have a giant lab
    where you can run virtual experiments by segmenting and comparing the data you
    already have. By adding in external datasets, you can magnify the ability to find
    valuable patterns with IoT analytics.'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# # Communicating with Others - Visualization and Dashboarding


    It has been a few months since your analysis prevented the bright pink thermostat
    cover debacle. Your boss has been promoted to Director, IoT Analytics due to his
    leadership in developing the capability to use IoT field data to answer business
    questions. You, however, have the same job just more responsibilities.


    Your analytics is being used throughout the company. You are excited about it,
    but are now spending a lot of time pulling together standard reporting to be sent
    to various groups every week.


    "Klineman in Finance wants to see the active devices trend chart you do, but he
    wants it in a table. I don''t know why, but can you do a version like that for
    him?" your boss asks with an upbeat tone in his voice. He seems to get happier
    the more charts and graphs that people want. You get busier and busier.


    "Okay, that''s it!" you say as your anger slips out, "They need to get their own
    charts somehow. I can''t handle all these versions and questions that come back.
    I didn''t take this job to spend all my time doing basic reporting and answering
    basic questions. They need to be able to answer it themselves."


    Your boss is taken aback by your response; he probably assumed you were as happy
    as he was. "Okay, okay. We''ll figure this out. You just need to create some dashboards
    so they can answer their own questions. See, easy! I''ll back you up and make
    them do it, no worries."


    You are not sure how to do that, but definitely want to free up your time to do
    more advanced analytics.'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'After talking with Jim Klineman in Finance, you discover he only wants a table
    because he wants to average the count over the fiscal year. He is using it for
    financial planning purposes. The sales technicians, however, want to see charts,
    since they use it day to day as a quick check on increases and declines.


    You will have to think about this carefully. You do not want to create a different
    dashboard for everyone, but you also want each of them to be able to get effective
    use from whatever you create. And not bug you with follow-up questions.


    This chapter is about designing effective visualizations and dashboards for IoT
    data. Once you find valuable patterns in data, you will need to communicate them
    with others. Visualizations are an effective way to quickly communicate complex
    data.


    As your analytics develop, other people will be monitoring the data to identify
    patterns and track trends over time. Designing useful dashboards allows them to
    quickly identify patterns to investigate and also answer their own follow-up questions.
    Think of it as another type of communication.


    We will be using Tableau to build both visuals and dashboards. You will learn
    how to take what you have learned about the data and convey it in an easy to understand
    way. This chapter covers both internal and customer facing dashboards.


    This chapter covers the following topics:


    +   - Common mistakes when designing visuals:

    +     - Tips to avoid them

    +   - The hierarchy of questions method:

    +     - Mapping out end user thought processes

    +     - Developing question trees

    +     - Aligning visuals with a hierarchy of user questions

    +   - Designing visual analytics for IoT data:

    +     - Using position to convey importance

    +     - Using color effectively

    +     - Tips for creating effective charts

    +   - Creating a dashboard with Tableau:

    +     - Walk-through example using weather station data

    +   - Quickly create and visualize alerts:

    +     - Alert principles

    +     - Organizing alerts for Tableau dashboards'
  merge: -1
  img_proc: true
