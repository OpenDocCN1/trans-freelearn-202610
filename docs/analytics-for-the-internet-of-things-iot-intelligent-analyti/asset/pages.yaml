- pgno: 191
  md: 'Also view how values and record counts change over time on the map. In Tableau,
    this can be done by dragging the date value, Measurement date, to the Pages shelf.
    Change the aggregation level to Month with Year and move through the months to
    observe how the data changes.


    Look for invalid location data as well. If you have data filtered to the country
    code for Mexico yet see points in Canada, there is probably some data cleanup
    to perform.


    # Look for attributes that might have predictive value


    Attributes is another name for data fields. It is commonly used when discussing
    predictive analytics and machine learning (Features is another synonym). When
    first exploring datasets, it is a good idea to look for attributes that could
    have predictive value if machine learning techniques are applied.


    These are fields or categories that seem to influence the measurement values.
    Keep an eye out for them and take notes on what you find.


    # R (the pirate''s language...if he was a statistician)


    R is an open source statistical programming language. It has a wide variety of
    powerful libraries that are simple to download and plug into your analytics code.
    The packages are developed and maintained by a large community of statisticians
    and data scientists. It is very powerful and is continuously enhanced with new
    packages, which are released frequently.


    # Installing R and RStudio


    If you do not have R, install the latest version from https://cran.rstudio.com/.
    Then, install RStudio, an Integrated Development Environment (IDE) for R, from
    https://www.rstudio.com/products/rstudio/download/. Both are open source and free
    to download and use. RStudio is managed by the RStudio company, based in Boston,
    which also offers paid support and an enterprise version of the software.'
