    # Why do you need geospatial analytics for IoT?


    Imagine that your company sells a device that measures airborne pollutants. It
    is internet-enabled and reports data back to your company at regular intervals
    using MQTT. The target market for this product is environmentally-minded consumers
    who want to both measure pollutants near their home and contribute to the collective
    monitoring of the environment.


    The value proposition is that they get free analysis of their local air quality
    in exchange for donating their data to support a cause they probably believe in
    anyway. Your company is planning to aggregate and package analytics of high-quality
    air pollution data to sell it to government and private organizations.


    Since the device is sold to consumers indirectly through various retail outlets,
    your company is not initially aware of the location of the devices. The consumer
    connects the device to the internet after it is purchased, and then enters their
    addresses. At this point, the location can be determined.


    The device has multiple sensors that measure the level of different contaminants
    in the air. One of the sensors measures the level of nitrogen dioxide (NO2). NO2
    is not only a toxic gas by itself but has even more damaging side effects. It
    facilitates the creation of acid rain and photochemical smog and is a precursor
    to other harmful secondary air pollutants such as ozone.'
  merge: -1
  img_proc: true
- pgno: 249
  md: 'The following image shows an example of a Nitrogen Dioxide Sensor and Nitrogen
    Dioxide Analyzer Module made by the company, Aeroqual:


    ![](img/9f2a55db1236f995dcd9392acbc82910_249_0.png)


    Nitrogen Dioxide Sensor and Analyzer. Source: Aeroqual


    NO2 is produced by the burning of fossil fuels. The main contributor in urban
    areas is typically motor vehicle exhausts, but the gas can also come from power
    plants, manufacturing facilities, and welding work.


    Your company wants to build and sell a data package summarizing NO2 levels by
    distance from Interstate highways. It also wants to aggregate the resulting data
    by each of the 115 congressional districts in the United States. The company believes
    congressional lobbyists would pay well for this information.


    This task may seem daunting at first, as all you know about device locations is
    the address registered by the customers. The first thought may be a manual process
    of reviewing each device location on a map and categorizing it based on its distance
    to the nearest Interstate highway. This would be very labor intensive and cost
    prohibitive when you have 500,000 devices.


    Thankfully, geospatial analytics can do this type of analysis efficiently. We
    will introduce several concepts, and then revisit this example and show how it
    can be solved.'
