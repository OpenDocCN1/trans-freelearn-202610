- pgno: 77
  md: '# Analyzing data to infer protocol and device characteristics


    Back to the number-one rule in IoT analytics: *Never trust data you don’t know.*


    You need to get to know your data. Just like that new guy you just met, you Google
    him, ask around about him, and do a criminal background check (we know you do)
    before agreeing to go to dinner with him.


    Here is a step-by-step strategy to start to understand the source of the data:


    +   1. **Draw a picture of the device:** Sketch it out or use blueprints if you
    have them. This is where you make friends with the design engineer and ask her
    some questions. Draw the key sensors in the place they are located and note the
    sensor type and any limitations. Ask about any environmental conditions that affect
    accuracy and note it.

    +   2. **Find out how the device connects to a network:** Note the connectivity
    type on your sketch.

    +   3. **Determine what data messaging protocol the device uses to communicate:**
    Note this on your sketch. A simple example follows:


    ![](img/9f2a55db1236f995dcd9392acbc82910_77_0.png)'
  merge: -1
  img_proc: true
- pgno: 78
  md: '4. **If you can visit an actual site where the device is in use, do so:** Take
    pictures. If not, have someone that travels in the field take some for you. Try
    to get a few different locations. The idea is to capture real-world conditions
    for later reference.


    ![](img/9f2a55db1236f995dcd9392acbc82910_78_0.png)


    5. **Combine the real-world pictures and the sketch into a reference document:**
    Pin it to your cubicle wall for reference; you will probably need it.


    6. **Analyze your data to infer some things about it:**


    +   1. Take a few months worth of complete data. Keep it small enough to easily
    work with but large enough that you have some history.

    +   2. Calculate the frequency between records by subtracting the time of the
    previous record on the same individual device from the time of the current record.
    This will get an interval number for each message.

    +   3. Randomly select at least 30 individual devices and set aside all the records
    for them.

    +   4. For each device, visually review the records. If the interval number is
    consistent for the most part, you now know it has a regular frequency of reporting
    and the length of time between reports. If it is not consistent, there is probably
    not a set interval and data is communicated when the device gets in range of a
    network (it moves) or an irregular event triggers the communication. Either way,
    note this on your reference document.'
  merge: -1
  img_proc: true
- pgno: 79
  md: '+   5. Look for irregular increases in the interval numbers. If this happens
    frequently, the devices are likely in a lossy network situation. Note this on
    your reference document.

    +   6. If the interval is large, several hours or days and the message size (number
    of columns) is low, then your IoT device is probably constrained and dependent
    on a long-term battery. It is more likely to be in a lossy network situation.

    +   7. If the interval is small, every few seconds, or minutes, then it probably
    has easy access to power. It is less likely to be in a lossy network situation.

    +   8. Calculate the average interval by date for each device. Plot them on the
    same chart, each one having its own line. If the changes in the average interval
    happen on the exact same dates for all the devices, you have a network or data
    processing problem with the centralized data collection process.


    # Summary


    This chapter reviewed in more depth the variety of IoT devices and networking
    protocols. You learned the scope of devices and some example use cases. The variety
    of networking protocols were discussed along with the business need they are trying
    to solve.


    We reviewed how to understand the what and the why of the major categories of
    devices and networking protocol strategies. We also discussed some techniques
    to identify the characteristics of the device and the network protocol by analyzing
    the data.'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# # IoT Analytics for the Cloud


    Now that you know how your data is transmitted back to the corporate servers,
    you feel you have a better understanding of it. You also have a reference frame
    in your head of how it is operating out in the real world.


    Your boss stops by again.


    > "Is that rolling average job done running yet?" he asks impatiently.


    It used to run fine and finished in an hour three months ago. It has steadily
    taken longer and longer and now sometimes does not even finish. Today, it has
    been going on six hours, and you are crossing your fingers. Yesterday, it crashed
    twice with what looked like out-of-memory errors.


    You have talked to your IT group and finance group about getting a faster server
    with more memory. The cost would be significant and will probably take months
    to complete the process of going through purchasing, putting it on order, and
    having it installed. Your friend in finance is hesitant to approve it. The money
    was not budgeted for this fiscal year. You feel bad, especially since this is
    the only analytic job causing you problems. It just runs once a month but produces
    key data.


    Not knowing what else to say, you give your boss a hopeful, strained smile, and
    show him your crossed fingers.


    > "It''s still running...that''s good, right?"


    This chapter is about the advantages to cloud-based infrastructure for handling
    and analyzing IoT data. We will discuss cloud services including **Amazon Web
    Services** (AWS), **Azure**, and **ThingWorx**. You will learn how to implement
    analytics elastically to enable a wide variety of capabilities.'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'This chapter will cover the following:


    +   - Building elastic analytics

    +   - Designing for scale

    +   - Cloud security and analytics

    +   - Key cloud providers:

    +     - Amazon AWS

    +     - Microsoft Azure

    +   - PTC ThingWorx


    # Building elastic analytics


    IoT data volumes increase quickly. Analytics for IoT is particularly compute intensive
    at times that are difficult to predict. Business value is uncertain and requires
    a lot of experimentation to find the right implementation.


    Combine all this together and you need something that scales quickly, is dynamic
    and responsive to resource needs, and has virtually unlimited capacity at just
    the right time. And all of this needs to be implemented quickly with a low cost
    and low maintenance needs.


    Enter the cloud. IoT analytics and cloud infrastructure fit together like a hand
    in a glove.


    # What is cloud infrastructure?


    The National Institute of Standards and Technology defines five essential characteristics:


    +   - **On-demand self-service**: You can provision things such as servers and
    storage as needed and without interacting with someone.

    +   - **Broad network access**: Your cloud resources are accessible over the internet
    (if enabled) by various methods, such as web browser or mobile phone.

    +   - **Resource pooling**: Cloud providers pool their servers and storage capacity
    across many customers using a multi-tenant model. Resources, both physical and
    virtual, are dynamically assigned and reassigned as needed. The specific location
    of resources is unknown and generally unimportant.'
  merge: -1
  img_proc: true
- pgno: 82
  md: '+   - **Rapid elasticity:** Your resources can be elastically created and destroyed.
    This can happen automatically as needed to meet demand. You can scale out rapidly.
    You can also contract rapidly. The supply of resources is effectively unlimited
    from your viewpoint.

    +   - **Measured service:** The resource usage is monitored, controlled, and reported
    by the cloud provider. You have access to the same information, providing transparency
    to your utilization. Cloud systems continuously optimize resources automatically.


    There is a notion of private clouds that exist on the premises or that are custom
    built by a third party for a specific organization. For our concerns, we will
    be discussing public clouds only. By and large, most analytics will be done on
    public clouds, so we will concentrate our efforts there.


    The capacity available at your fingertips on the public clouds is staggering.
    AWS, in June 2016, had an estimated 1.3 million servers online. These servers
    were thought to be three times more efficient than enterprise systems.


    Cloud providers own the hardware and maintain the network and systems required
    for the available services. You just have to provision what you need to use, typically
    through a web application.


    Providers offer different levels of abstraction. They offer lower-level servers
    and storage where you have fine-grained control. They also offer managed services
    that handle the provisioning of servers, networking, and storage for you. These
    are used in conjunction with each other without much distinction between the two.


    Hardware failures are handled automatically. Resources are transferred to new
    hardware and brought back online. The physical components become unimportant when
    you design for the cloud, it is abstracted away, and you can focus on resource
    needs.


    The advantages of using the cloud are:


    +   - **Speed:** You can bring cloud resources online in minutes.

    +   - **Agility:** The ability to quickly create and destroy resources leads to
    ease of experimentation. This increases the agility of analytics organizations.

    +   - **Variety of services:** Cloud providers have many services available to
    support analytics workflows that can be deployed within minutes. These services
    manage hardware and storage needs for you.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# IoT Analytics for the Cloud


    +   - **Global reach:** You can extend the reach of analytics to the other side
    of the world with a few clicks.

    +   - **Cost control:** You only pay for the resources you need at the time you
    need them. You can do more for less.


    To get an idea of the power that is at your fingertips, here is an architectural
    diagram of something NASA built on AWS as part of an outreach program to school
    children:


    ![](img/9f2a55db1236f995dcd9392acbc82910_83_0.png)


    Source: Amazon Web Services, https://aws.amazon.com/lex/


    When given voice commands, it will communicate with a Mars rover replica to retrieve
    IoT data, such as temperature readings. The process includes voice recognition,
    natural speech generation from text, data storage and processing, interaction
    with an IoT device, networking, security, and the ability to send text messages.
    This was not a years’ worth of development effort, it was built by tying together
    cloud-based services already in place.


    And it is not just for well funded government agencies such as NASA. All of these
    services and many more are available to you today if your analytics runs in the
    cloud.


    # Elastic analytics concepts


    What do we mean by **elastic analytics**? Let''s define it as designing your analytics
    processes so that scale is not a concern. You want your focus to be on the analytics
    and not on the underlying technology. You want to avoid constraining your analytics
    capability so it will fit within some set hardware limitations. Focus instead
    on the potential value of your analytics versus the limit of what can be done
    with existing hardware.'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'You also want your analytics to be able to scale. It should go from supporting
    100 IoT devices to 1 million IoT devices without requiring any fundamental changes.
    All that should happen is that the costs increase as demand increases.


    This reduces complexity and increases maintainability. This translates into lower
    costs, which enables you to do more analytics. More analytics increases the probability
    of finding value. Finding more value enables even more analytics. Virtuous circle!


    Some core elastic analytics concepts:


    +   - **Separate compute from storage:** We are used to thinking about resources
    as we think about laptop specifications. You buy one device that has 16 GB memory
    and 500 GB hard drive because you think that will meet 90% of your needs, and
    it is the top of your budget. Cloud infrastructure abstracts this away. Doing
    analytics in the cloud is like renting a magic laptop where you can change 4 GB
    memory into 16 GB by snapping your fingers. Your rental bill increases for only
    the time you have it at 16 GB. You snap your fingers again and drop it back down
    to 4 GB to save some money. Your hard drive can grow and shrink independently
    of the memory specification. You are not stuck having to choose a good balance
    between them. You can match compute needs with requirements.

    +   - **Build for scale from the start:** Use software, services, and programming
    code that can scale from 1 to 1 million without changes. Each analytic process
    you put in production has continuing maintenance efforts that will build up over
    time as you add more and more processes. Make it easy on yourself later on. You
    do not want to have to stop what you are doing to re-architect a process you built
    a year ago because it hit the limits of scale.

    +   - **Make your bottleneck wetware not hardware:** By wetware, we mean brain
    power. *My laptop doesn’t have enough memory to run the job should never be the
    problem. It should always be I haven’t figured it out yet, but I have several
    possibilities in test as we speak.*

    +   - **Manage to a spend budget, not to available hardware:** Use as many cloud
    resources as you need as long as it fits within your spend budget. There is no
    need to limit analytics to fit within a set number of servers when you run analytics
    in the cloud. The traditional enterprise architecture purchases hardware ahead
    of time, which incurs a capital expense. Your finance guy does not (usually) like
    capital expense. You should not like it either, as it means a ceiling has just
    been set on what you can do (at least in the near term). Managing to spend means
    keeping an eye on costs, not on resource limitations. Expand when needed and make
    sure to contract quickly to keep costs down.'
  merge: -1
  img_proc: true
