- pgno: 240
  md: 'Now, a user of the dashboard can investigate a measurement month to quickly
    understand which weather stations are reporting data. They can also view one station
    or groups of stations by the daily summed precipitation values to identify unusual
    results. The example of following screenshot shows the mapped location for November
    2013 reporting stations and the daily trend for a few stations in the Denver area:


    ![](img/9f2a55db1236f995dcd9392acbc82910_240_0.png)


    Example of dashboard interaction


    # Creating and visualizing alerts


    IoT data is inherently noisy. There are often cases of invalid and missing values.
    This requires constant vigilance to identify and correct data issues when they
    occur. The correction could then be handled in the transformation of the raw data
    or in the software and design of the device.


    Either way, the faster an issue is detected, the quicker it can be resolved. For
    IoT data, consider bad data as lost money that can rarely be recovered. Minimize
    the loss by identifying and correcting issues quickly.'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'Dashboards can also be created for this purpose by following the same process
    we introduced in this chapter. Think about what you want to watch out for and
    set up an alert view to identify it for you.


    # Alert principles


    There are some principles to follow when designing an alert system, even a simple
    one that will be part of a dashboard:


    +   - **Balance alert sensitivity to minimize false positives**: People will learn
    quickly to ignore alerts if they rarely identify an actual problem. This has to
    be balanced against missing too many real issues though. A cost benefit calculation
    can be used to help in this decision.

    +     [*cost of investigating a problem*] * [*number of alerts*] < [*cost of actual
    problem*] * [*probability of true positive*]

    +     The left side of that equation should be noticeably less than the right
    side.

    +   - **Be wary of alert fatigue**: A long list of continuous alerts is daunting,
    and human brains tend to become conditioned over time to recognize it as a normal
    situation. Alerts will start to become background noise and will not get a response.
    Anyone with an Android smartphone knows how this feels - too many alerts are exhausting.
    There does not need to be an alert for every problem. Keep it to a manageable
    amount for the big ones.

    +   - **Make alerts like a to-do list**: A user should not have to search for
    where the problem is; it should be listed out for them if there are any. If there
    are no issues discovered, a blank list can be comforting - like leaving work an
    hour early!

    +   - **Incorporate a tracking system for alert responses**: Nothing is more frustrating
    than spending a couple of hours investigating a problem someone else has already
    discovered and corrected.


    # Organizing alerts using a Tableau dashboard


    A simple example can highlight how to use a dashboard for alerting purposes. Tableau
    server has an email functionality that a user can subscribe to that will email
    an image of the dashboard at a regular interval with an embedded link back to
    the interactive dashboard. This can then be read and digested like a morning newspaper.'
  merge: -1
  img_proc: true
- pgno: 242
  md: "You learned while investigating the 15 minute precipitation dataset that there\
    \ were measurement values that represented a state instead of an actual reading.\
    \ In these cases, the value was either -9999 or 999.99. What we would want to\
    \ see, if we were relying on this data on a daily basis, is that a station reports\
    \ valid precipitation measurements and little to no non-measurement values. We\
    \ can organize a simple question hierarchy to represent our thinking process:\n\
    \n![](img/9f2a55db1236f995dcd9392acbc82910_242_0.png)\n\nAlert question hierarchy\
    \ for stations reporting invalid precipitation data\n\nWe can create an alert\
    \ dashboard to monitor this on a daily basis. This will allow quick identification\
    \ of a problem. We will start by creating four additional calculated fields in\
    \ the following order:\n\n# Name: Precip Accumul Value Validity\n\n# Calculation:\n\
    \n```\nCASE [Qgag]\n    WHEN -9999 THEN\n        \"Invalid\"\n    WHEN 999.990\
    \ THEN\n        \"Invalid\"\n    ELSE\n        IF [Qgag] >= 0 AND [Qgag] <20 THEN\n\
    \            \"Valid\"\n        ELSE\n            \"Invalid\"\n        END\nEND\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 243
  md: "# Name: Precip Value Validity\n\n# Calculation:\n\n```\nCASE [Amount of Precipitation\
    \ (inches)]\n    WHEN -9999 THEN\n        \"Invalid\"\n    WHEN 999.99 THEN\n\
    \        \"Invalid\"\n    ELSE\n        IF [Amount of Precipitation (inches)]\
