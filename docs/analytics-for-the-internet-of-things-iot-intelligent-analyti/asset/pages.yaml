- pgno: 322
  md: '+   2. **If necessary, combine multiple fields to create a single field that
    identifies the linkage**: Big data systems handle single field joins much better
    than multiple field joins. It also makes it much simpler for the data scientist
    to use and therefore less likely to make a mistake in combining datasets. Following
    our example, you can combine a slightly rounded latitude and longitude value into
    a single identification field and store it in a separate field in your dataset.
    The rounding is to adjust for extremely precise GPS values that are at the location,
    but just in different areas of the parking lot.

    +   3. **Repeat for all linkable fields in the dataset**: The GPS grid identifier
    is another candidate.

    +   4. **Add the dataset and its links to a master diagram to use as reference.**


    The following diagram shows how our simple GPS example can link to other analytical
    datasets:


    ![](img/9f2a55db1236f995dcd9392acbc82910_322_0.png)'
