- pgno: 100
  md: '# Identity and Access Management (IAM)


    This is where users are defined (IAM user), access key pairs created, and security
    roles defined (IAM role). IAM roles are a key concept, as they allow a simple
    and secure way for your instances and other AWS services to communicate. You will
    assign these on creation of a resource, and it will then natively have permissions
    to the services defined in the role. This happens without storing any access keys
    on the server instance. This means that even if the server is compromised, the
    villains will not have the keys to the kingdom.


    # Elastic Compute (EC2)


    EC2 allows you to create virtual servers (called instances). You define the virtual
    hardware configuration (think CPU/RAM mix) and the amount of storage. Then, a
    few minutes later, it is up and running and ready for you to use. At the time
    of this writing, there are 55 different EC2 virtual hardware configuration options.
    Many operating systems are supported, including Windows and several versions of
    Linux. We will refer to a virtual server as an EC2 instance for the rest of this
    section.


    M4


    M4 instances are the latest generation of General Purpose Instances. This family
    provides a balance of compute, memory, and network resources, and it is a good
    choice for many applications.


    Features:

    - 2.3 GHz Intel Xeon® E5-2686 v4 (Broadwell) processors or 2.4 GHz Intel Xeon®
    E5-2676 v3 (Haswell) processors

    - EBS-optimized by default at no additional cost

    - Support for Enhanced Networking

    - Balance of compute, memory, and network resources


    | Model | vCPU | Mem (GiB) | SSD Storage (GB) | Dedicated EBS Bandwidth (Mbps)
    |

    |---|---|---|---|---|

    | m4.large | 2 | 8 | EBS-only | 450 |

    | m4.xlarge | 4 | 16 | EBS-only | 750 |

    | m4.2xlarge | 8 | 32 | EBS-only | 1,000 |

    | m4.4xlarge | 16 | 64 | EBS-only | 2,000 |

    | m4.10xlarge | 40 | 160 | EBS-only | 4,000 |

    | m4.16xlarge | 64 | 256 | EBS-only | 10,000 |


    AWS memory optimized EC2 instances. Source: Amazon Web Services'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'The EC2 instance is created from an **Amazon Machine Image (AMI)** and there
    are thousands of different types, when the community AMIs are included. Think
    of an AMI as an image of your hard drive after you get your favorite software
    and settings installed. With an EC2, you can effectively pause it, define a new
    hardware configuration, and restart it. Storage can also be dynamically added
    to it as needed. You can also stop the instance, pay only for storage, then restart
    it later when needed. This can save quite a bit of money using these for analytic
    jobs that run only periodically.


    # Simple Storage Service (S3)


    S3 is an object-based storage service. It automatically handles scaling and redundancy.
    The multiple copies of files are made across multiple devices and locations automatically.
    Durability is extremely high at 99.999999999% over a given year. A single file
    can be from 0 bytes to 5 terabytes. Overage storage size is limited only by your
    bank account.


    Objects are the base entity stored in Amazon S3, but you can think of it simply
    as a file that can be of (almost) any size or type. Everything is contained in
    what is called a **bucket**. Buckets are the highest level S3 namespace and are
    linked to the AWS account that owns it. S3 buckets are like internet domain names.
    Objects have a unique key value and are retrieved using a HTTP URL address.


    Taken all together for analytics purposes, this means you can stuff tons of data
    there and not worry about backups, hard drive failures, or running out of space.
    It can be accessed easily using a URL-like format (assuming you have the correct
    security keys/permissions).


    # AWS key services for IoT analytics


    There are far too many AWS services to cover in one section. We will cover the
    ones of interest for IoT analytics but know that there are many more with new
    services being added all the time (such as speech recognition and deep learning
    image recognition services).'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# # Amazon Simple Queue Service (SQS)


    This is the AWS managed message queue service. It handles the underlying compute
    and storage resources, you just need to create it. You pay only for the API calls
    to it for message processing.


    # # Amazon Elastic Map Reduce (EMR)


    EMR is a fully managed Hadoop framework that can be launched in minutes. It handles
    the tasks of node provisioning, cluster setup, configuration, and cluster tuning
    for you. It operates using EC2 instances and can scale from one node to thousands.


    You can increase or decrease the number of instances manually or use auto scaling
    to do it dynamically, even while the cluster is running. The EMR service monitors
    your cluster; it can handle retries for failed tasks and will replace poor performing
    instances automatically.


    Even though it is managed, you have complete control over the cluster, including
    root access. You can install additional applications. EMR has the option to choose
    from several Hadoop distributions and applications such as Apache Spark, Presto,
    and HBase.


    Data storage can be linked to S3 using the **EMR File System (EMRFS)**. You can
    store your data in Amazon S3 and use multiple EMR clusters to process the same
    dataset. This allows you to configure the cluster to the requirements for the
    task at hand without forcing a best compromise between all tasks. It aligns with
    the goal of separating compute and storage.


    You can also programmatically create an EMR cluster, run a job, then automatically
    shut it down when complete. This makes it very useful for large-scale batch processing
    or analytical jobs.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# AWS machine learning


    This service has wizards and visualization tools that guide you through the process
    of creating machine learning models. You can deploy the trained models to make
    predictions on new data without having to set up a separate system. You pay as
    you go, there are no upfront costs. It is highly scalable and can handle billions
    of predictions in a day.


    ![](img/9f2a55db1236f995dcd9392acbc82910_103_0.png)


    Amazon machine learning evaluation screenshot example. Source: Amazon Web Services'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# Amazon Relational Database Service (RDS)


    RDS is a set of managed relational databases and includes database engines such
    as Oracle, Microsoft SQL Server, PostgreSQL, MySQL, and MariaDB. You have full
    control over the database but do not have any access to the underlying server
    it is hosted on. RDS handles this part and also provides monitoring on the health
    of the database management system. You can connect to and manage databases on
    RDS using the same tools that you would use on a non-RDS Oracle or SQL Server
    database, for example.


    This is great for most standard relational database needs but can be limited for
    custom or complicated implementations. For analytics, this is rarely a problem.


    # Amazon Redshift


    Redshift is a fully managed, SQL-compliant data warehouse service. You can store
    up to a petabyte in a Redshift cluster. It has its own JDBC and ODBC drivers but
    also supports standard PostgreSQL drivers. This means most Business Intelligence
    (BI) tools can connect directly to it. Redshift is useful for commonly queried
    data and is a common place to put processed and summarized IoT data for wider
    enterprise consumption.


    # Microsoft Azure overview


    Microsoft offers a cloud infrastructure service called Azure that competes directly
    with AWS. It is generally ranked as number two in the industry in size and capabilities,
    although it has been closing that gap recently.


    The range of services is similar to AWS but with a Microsoft flavor. Microsoft
    markets the services as easier to integrate with corporate on-premise networks.
    Integration leans more toward Microsoft technology, such as the Windows operating
    system, the .NET programming language, and the SQL Server database.


    We will review some of the services of interest for IoT analytics.


    # Azure Data Lake Store


    Azure Data Lake Store is compatible with Hadoop Distributed File System (HDFS),
    which we will be discussing in Chapter 4, Creating an AWS Cloud Analytics Environment.
    It also has a REST interface for applications that is WebHDFS-compatible.'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'Data stored in Data Lake Store can be analyzed using analytic frameworks within
    the Hadoop ecosystem, such as MapReduce and Hive. Microsoft Azure HDInsight clusters
    can be provisioned and configured to directly access data stored in Data Lake
    Store.


    You can store a variety of data types for analytics and storage size is effectively
    unlimited. Individual files sizes can be from kilobytes to petabytes. Storage
    is durable as multiple copies are created and managed automatically.


    # Azure Analysis Services


    Azure Analysis Services is built on Microsoft SQL Server Analysis Services (SSAS)
    and is compatible with SQL Server 2016 Analysis Services Enterprise Edition. It
    supports tabular models. Functionality includes DirectQuery, partitions, row-level
    security, bidirectional relationships, and translations.


    You can use the same tools you use for SSAS to create data models for Azure Analysis
    Services. You can create and deploy tabular data models using SQL Server Data
    Tools (SSDT) or using some Azure templates in SQL Server Management Studio (SSMS).
    If you are a Microsoft shop, this will all feel familiar to you.


    You can connect to data sources in the Azure cloud and also to on-premise data
    in your organization. Connecting to cloud data sources is fairly seamless as it
    is essentially in the same local network from the perspective of the cloud server.
    Connecting to on-premises data sources is supported by an on-premises data gateway,
    which enables secure connections to your Analysis Services server in the cloud.


    ![](img/9f2a55db1236f995dcd9392acbc82910_105_0.png)


    * Some data sources are not yet supported in preview as of Microsoft December
    2016. Image source: Microsoft Azure'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'You can connect to data from Microsoft tools such as Power BI Desktop and Excel.
    You can also use connectors to link custom applications and some browser-based
    tools.


    ![](img/9f2a55db1236f995dcd9392acbc82910_106_0.png)


    * Power BI Embedded is not yet supported in preview as of Microsoft December 2016.
    Image source: Microsoft Azure


    # HDInsight


    Azure HDInsight uses the Hadoop components from the Hortonworks Data Platform
    (HDP) distribution. It deploys managed clusters in the cloud with a focus on high
    reliability and availability. Microsoft Active Directory is used for security
    and governance.


    HDInsight includes the implementations of Hadoop ecosystem tools, such as Apache
    Spark, HBase, Kafka, Storm, Pig, Hive, Interactive Hive, Sqoop, Oozie, and Ambari.
    It also integrates with Business Intelligence (BI) tools, such as Power BI, Excel,
    SQL Server Analysis Services, and SQL Server Reporting Services.


    Default storage for the HDFS used by HDInsight clusters can be either an Azure
    storage account or a Azure Data Lake store.


    # The R server option


    In 2015, Microsoft bought a company called revolution analytics, which maintained
    a managed version of the open source R distribution. Since then, Microsoft has
    been integrating R into several of its software products and Azure has been no
    exception.


    HDInsight includes an option to integrate an R Server into your HDInsight cluster
    when the cluster is created. This allows R scripts to use Hadoop to run distributed
    computations. Microsoft includes a big data analytics R package called ScaleR.'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'You can connect to your cluster and run R scripts on an edge node. You have
    the option of running parallelized distributed functions across the cores of the
    edge node server using ScaleR. You can also run them across the nodes of the cluster
    by using the ScaleR Hadoop MapReduce or Spark compute contexts.


    # The ThingWorx overview


    The company PTC, which has a long history in creating software for the world of
    machines talking to machines, developed ThingWorx. It is an application development
    environment for building IoT solutions. It is a software platform that abstracts
    IoT devices and related components and services into model-based development objects.
    You install the software on your own hardware (or using cloud providers virtual
    instances).


    The platform makes it easy to model your devices, the data, and has the ability
    to quickly create dashboards through a web-based application. No code is required.
    ThingWorx is also extensible to third-party components through its marketplace.
    This makes it easy to add in a third-party functionality without special configuration.
    It can also integrate with both AWS and Azure IoT hub services.


    There are multiple components of ThingWorx. ThingWorx Foundation is the center
    of the platform. It is divided into three areas, as shown in the following image:


    +   - ThingWorx Core

    +   - ThingWorx Connection Services

    +   - ThingWorx Edge


    ![](img/9f2a55db1236f995dcd9392acbc82910_107_0.png)


    ThingWorx Foundation. Source: thingworx.com'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# ThingWorx Core


    ThingWorx Core is a software platform environment that allows you to design, run,
    and implement analytics for IoT applications that control and report data from
    remote devices. These devices could be sensors, consumer electronics, or industrial
    equipment.


    ThingWorx uses a representational object-based design. This means that you create
    software objects to represent your IoT devices and other assets. The representation
    includes relevant properties and related data items.


    You then use the objects to create applications, which can monitor and manage
    your IoT devices. You can create dashboards, implement response logic, and integrate
    third-party applications.


    The ThingWorx Core is the hub of your ThingWorx environment. You logically define
    behavior and relationships between IoT devices or remote assets that are set up
    in your environment. Once the actual devices have been modeled in the software,
    they can register and communicate with the Core. You can then collect data and
    manage the physical devices.


    ThingWorx Core includes two main tools for you to create IoT solutions:


    +   - **ThingWorx Composer**: This is a modeling environment where you set up
    the remote assets, business logic, data storage, and security.

    +   - **ThingWorx Mashup Builder**: This is a drag and drop tool where you can
    quickly create dashboards and mobile interfaces without needing to write code.
    This is where you can do things like show a location on a map and chart sensor
    value trends.


    # ThingWorx Connection Services


    ThingWorx Connection Services handle communication and connectivity between the
    Core and remote assets. Components can handle connectivity over different protocols
    and with different device clouds. They handle message routing to and from the
    remote devices and also message translation when required.'
  merge: -1
  img_proc: true
- pgno: 109
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 110
  md: 'WS EMS is a standalone application that is installed on a remote device. It
    uses a ThingWorx protocol called AlwaysOn to communicate with the ThingWorx Core.
    The WS EMS supports several operating systems and has a small footprint. It can
    work with a large number of devices to provide a way to establish communication
    between an edge device and the ThingWorx Core.


    Depending on what language your developers are using for your IoT device code,
    there are several versions of **ThingWorx Edge SDKs** that allow you to add connectivity
    to your device. There are SDKs that support C, .NET (C#), and Java languages,
    along with the ones for the Android and iOS platforms.


    The SDK is embedded within the IoT device: one instance of it for each device.
    All the SDKs have common interfaces and provide secure communication channel to
    the Core.


    # ThingWorx concepts


    We will discuss the main objects and concepts used on the ThingWorx core to model
    your environment to get a good feel for how it works.


    # Thing templates


    A **thing template** sets up and defines the base functionality that you build
    multiple things from. This defines a general category with a common set of properties,
    services, events, and subscriptions. These will be included in any thing definition
    that is based upon the template. The thing will *inherit* from the thing template.


    # Things


    A **thing** is used to represent an object. It is based on a thing template but
    will often include additional properties, services, or events unique to the implementation
    of the more generic base thing, which was defined in the template.'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'There are several types of thing:


    +   - **Things:** This represents a real-world asset, device, or system.

    +   - **Remote thing:** A remote thing is a special type of thing that represents
    an asset in a remote location. When using a ThingWorx Edge SDK, the edge devices
    where your application is running needs to be created in ThingWorx Composer using
    the RemoteThing template.

    +   - **Custom things:** Extensions provide custom thing templates that you can
    use to create the custom things to represent your devices.


    # Properties


    A property is a variable that represents a behavior of a thing.


    Properties have either of the following:


    +   - **Remote bindings:** Remote bindings support egress. They can be written
    to the edge device when it connects to ThingWorx. The edge device must know of
    any Properties with Remote bindings.

    +   - **Non-remote bindings:** These are not sent to the edge device when written
    and are not read from the edge device when a value is requested.


    # Services


    A service represents a function that a thing can perform. It can be defined as
    part of a thing, a thing template, or a thing shape.


    # Events


    An event is triggered from a change in the state or value of a property. It sends
    data to an object that subscribes to it.'
