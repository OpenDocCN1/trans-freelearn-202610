    \ the other company data needs combined.\n\n# Problems with time\n\n> The only\
    \ reason for time is so that everything doesn’t happen at once.\n> \n> — Albert\
    \ Einstein\n\nTime is very tightly tied to geographical position and the date\
    \ on the calendar. The international standard way of tracking a common time is\
    \ using Coordinated Universal Time (UTC). UTC is geographically tied to 0° longitude,\
