- pgno: 184
  md: '# What is meant by time series?


    Time series analysis is very common; you run across it every day from stock market
    price trends to GDP graphs. It is intuitive and so pervasive that it feels awkward
    even giving it a name. Time series is simply ordering data values chronologically
    and analyzing the results for patterns. The order should be at equally-spaced
    intervals even when there is no data for the interval.


    Patterns can be discovered by the time of year (seasonal), by the business cycle,
    from values increasing or decreasing over time (trends), and even by the time
    of the day. Identified patterns can then be used in forecasting future values
    over time. We will look at the time series forecasting technique later in the
    book.


    # Applying time series analysis


    The first step in time series analysis is deciding which time interval to use
    when exploring the data. You can choose several, and it is good practice to do
    so when getting to know your IoT data. You can start with monthly trends, then
    weekly, then daily, and even to the minute.


    For our analysis, we will continue with the daily interval. Start with the **Qpcp**
    measure and view it by station to graph a daily summed **Qpcp** value. Filter
    out the extreme values that are almost certainly not actual measurements (you
    can use a 0 to 900 range in the filter). We have already identified an unusually
    high record count for the **Boulder 2 CO US** station that occurred in September
    2013.'
  merge: -1
  img_proc: true
