- pgno: 293
  md: '# Bias


    Bias is the propensity of an ML model to consistently learn the same thing. Consistency
    refers to the results of repeated iterations on variations on the same dataset.
    The higher the bias, the more off target the resulting learned model tends to
    be. If the bias is lower, the resulting trained models will consistently be more
    on target.


    A high bias model will have a large error rate on both the training data and the
    test data. This is referred to as **underfitting**. In other words, a more complex
    model could fit the data better in both situations (training and testing).


    The following example compares a linear model with low bias in regards to the
    dataset, and a high bias linear model in regards to a different dataset. We use
    the same simple model to show that the level of bias is not necessarily related
    to the choice of ML model. Although some models have a higher propensity to bias,
    it is the combination of the model and the data that matters:


    ![](img/9f2a55db1236f995dcd9392acbc82910_293_0.png)'
  merge: -1
  img_proc: true
- pgno: 294
  md: '# Variance


    **Variance** is associated with more complex models and refers to the ability
    of an ML model to contort itself to fit the training data too well. The resulting
    learned model will be very different depending on which variation of the dataset
    it is trained on. High variance models have the problem of **overfitting**.


    A high variance model will have a low error rate on training data and a high error
    rate on test data. The high variance model fits itself too well to the precise
    composition of the training data. It learned all the random noise as well as the
    underlying signal in the data.


    Variance is a big problem with more advanced ML models if they are left unchecked
    during the learning process. This is because of the incredible flexibility in
    the methods, which can effectively *memorize* almost any combination of data in
    the training set.


    # Trade-off and complexity


    In a perfect world, you would have ML models that, after the learning process,
    have both low bias and low variance. However, as you may be aware, we live in
    a far from perfect world. So, as in most things, there is a trade-off needed to
    get the optimal result.


    The goal of ML research efforts is to not only find the optimal trade-off combination
    but to also develop new ML techniques that sacrifice a little on one in exchange
    for a significant reduction in the other. For any given ML model, there is a trade-off
    to be made between bias and variance in order to find the optimal *configuration*
    that will generalize the best. Unfortunately, this optimal position is unknown
    and has to be inferred based on error calculations from the training and validation
    process.'
  merge: -1
  img_proc: true
- pgno: 295
  md: 'More complex models can fit the data better and reduce error in the training
    process. However, they are prone to overfitting, which will increase the error
    on test data, and later on new real world data. The following image represents
    a range of complexity *settings* for a model. The goal is to find the optimal
    place where both training and test error is minimized. This represents a best
    compromise, which you would expect to generalize well to future datasets when
    the trained model is put into production:


    ![](img/9f2a55db1236f995dcd9392acbc82910_295_0.png)


    Bias - Variance tradeoff as model complexity increases. Source: http://horicky.blogspot.com/2012/06/


    Fortunately, there are methods, such as **regularization**, designed to help prevent
    overfitting in order to increase the likelihood that the resulting trained model
    will be in the optimal trade-off area. These methods are incorporated into the
    R packages that you will be using to grow your ML models.


    # Comparing different models to find the best fit using R


    It is best practice to not only find the optimal version of a trained ML model
    but to compare multiple trained optimized ML algorithms. Each ML algorithm has
    its strengths and weaknesses. Choosing only one is limiting yourself. Select several
    ones that are likely to grow into good trained models given the particular problem
    you are solving. Then, compare them against each other, and let the best model
    win.'
  merge: -1
  img_proc: true
- pgno: 296
  md: 'There are several ways to compare ML models against each other. ROC charts
    and AUC measures are two of the more popular methods. We will introduce each next.


    # ROC curves


    Originating from World War II radar engineering, the **receiver operating characteristics**
    (**ROC**) curve is a common way to compare the effectiveness of ML models against
    each other. It measures the Recall rate against the **fall-out rate** (calculated
    as [*1-specificity*]) along a threshold measure. The fall-out rate is also known
    as the **False Positive Rate (FPR)** or the **probability of false alarm.**


    You may have noticed a trend in that a lot of the measures have several different
    names. It can get confusing but it is important to know the pseudonyms of the
    measures since different articles, blogs, and research papers will use different
    names for them.


    In most cases, the ROC curve will be used with binary classification problems.
    Some examples of binary classification questions include **failure/no failure**,
    **operating/not operating**, **raining/not raining**, and **purchase/no purchase**.
    An ROC curve shows the change in trade-off between the benefits of correct classifications
    (true positives) and the costs of incorrect classifications (false positives),
    along intervals of a threshold parameter.


    It can help to think of the true positive rate as follows:


    *True positive rate = Correctly classified positives / All positives in the training
    set*


    And think of the false positive rate as follows:


    *False positive rate = Incorrectly classified negatives / All negatives in the
    training set*'
  merge: -1
  img_proc: true
- pgno: 297
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 298
  md: '![](img/9f2a55db1236f995dcd9392acbc82910_298_0.png)


    A near perfect ML model. Don’t believe it, this is about as rare in the real world
    as leprechauns playing polo while riding unicorns


    ROC curves are generated by running the training data through the trained model
    to generate the predicted score (or probability) of the likelihood of a positive
    classification for each instance. The results are sorted in order with the most
    likely first. Each prediction is compared to the actual classification of the
    instance and a running score of the true positive rate and the false positive
    rate is kept as you move down the list.


    Each true positive rate and false positive rate combination is graphed on the
    chart with a line connecting the points. In reality, an ROC curve is a step function
    that approaches a true curve, as the size of your training set grows.


    As you move down the list into less and less likely positives (based on the model’s
    prediction), this effectively shifts through a range of thresholds from most conservative
    (your top scoring instance) to the most liberal (your lowest scoring instance).
    The resulting curve shows the performance of your ML model along a wide range
    of threshold scenarios. When you are comparing ML models using ROC curves, you
    are comparing their performance under many difference threshold conditions. This
    gives you a fuller picture of performance.'
  merge: -1
  img_proc: true
- pgno: 299
  md: "ROC curve charts can be generated easily in R. Using the pROC package, you\
    \ can generate chart images just using the roc and plot functions. Here is a simple\
    \ example:\n\n```\n#load pROC library\nlibrary(pROC)\n#create ROC object based\
    \ on the model and its class lables\nrocCurve <- roc(response = classFactors,\n\
    \    predictor = testPredictionsProb,\n    levels = rev(levels(classFactors)))\
    \ #roc function assumes the second class\nis the target, so we will reverse labels\n\
    \n#plot curve\nplot(rocCurve, legacy.axes = TRUE, identity = TRUE, col = \"blue\"\
    , add =\nFALSE)\n#you can also add another model curve to the chart by calling\
    \ this function\nagain with the 'add = TRUE' option\n```\n\nThe code will produce\
    \ an ROC curve plot similar to the following example:\n\n![](img/9f2a55db1236f995dcd9392acbc82910_299_0.png)\n\
    \nExample of an ROC curve plot in R."
  merge: -1
  img_proc: true
- pgno: 300
  md: 'The following are some benefits of using ROC curves:


    +   - **Not sensitive to changes in class distributions**: Shifts in the numbers
    of positive and negative examples will not affect the ML model’s ROC curve, assuming
    the model remains as effective in discriminating between them.

    +   - **Useful even if classification error costs are unequal**: When the costs
    of false positives or benefits of the correct classification of positives change,
    the ROC curve is unaffected. Only the region of interest along the curve changes.
    In other words, the optimal threshold setting will shift but the shape of the
    curve will not.

    +   - **Allows the comparison of the performance of different ML models along
    various threshold settings**: Some models will perform best at conservative settings
    while others may be the best at more liberal settings. The best model, therefore,
    depends on the underlying business case.


    The following are things to keep in mind with ROC curve analysis:


    +   - **Difficult to use intuitively for multi-class models**: It is hard to visualize
    beyond 2-dimensional space and the dimensions grow quickly with multi-class prediction
    models. There are methods to do this, but they are still not easy to interpret.

    +   - **Hard to explain to non-analytical audiences**: There is a learning curve
    to ROC curves (it is fun to use the word curve). However, non-specialist people
    can certainly learn how to understand it with repeated exposure. The author recommends
    educating them if possible. Organizations that understand these charts can use
    them when making cost/benefit business decisions. Once they get over the hump
    of learning to interpret the charts, they will find them very useful.


    # Area Under the Curve (AUC)


    AUC is simply the portion of the ROC chart "square" that is underneath the ROC
    curve of the ML. Since it is a proportion, it will always range from 0 to 1. An
    AUC of 1 represents a curve that covers the entire graph, and therefore it is
    perfectly aligned to the upper-left corner. This would be the aforementioned rarely
    observed, yeti-like *perfect model*.


    The random model represented by the dashed line in the ROC chart has an AUC of
    0.5. So, in real world situations, you will be looking at AUC numbers from 0.5
    to 1.0. How to interpret an AUC number depends a lot on the industry and business
    situation. An AUC of 0.6, indicating better than random, may be a fantastic model
    for stock picking in the finance industry; while the same AUC measure would be
    an utter failure for cancer detection in the medical industry.'
  merge: -1
  img_proc: true
- pgno: 301
  md: 'AUC numbers are a useful way to compare models using a single number instead
    of chart. This comparison could be between different models, or on a model against
    itself after it has been tweaked or retrained. However, there is a danger when
    only looking at the AUC value as you are losing some valuable information.


    An AUC number gives you a rough idea of performance but tells you little about
    the actual shape of the curve. You lose the ability to determine the performance
    of a model at different threshold settings. At more conservative settings, an
    ML model with a lower AUC value may actually perform better than another model
    with a higher AUC.


    AUC values are useful shorthand for doing quick comparisons and for boiling down
    an ROC curve to one number. But you should always review the full ROC curve before
    making any business decisions, especially if the AUC values are close.


    AUC values can be quickly generated in R using the pROC package also. Building
    on the prior ROC code example, the AUC values can be obtained by using the auc
    function:


    ```

    auc(rocCurve)

    ```


    # Random forest models using R


    Most ML textbooks start you off with a simple model like a Perceptron. But if
    you have made it this far in the book, you are a rock star and deserve to be introduced
    to the big guns. Since they usually provide better results, you will run into
    these modes far more frequently than perceptrons anyway.


    We will start with Random Forest models. Besides having a cool sounding name,
    they are flexible and tend to generalize well. They also have value in explaining
    the usefulness of input features using a method called variable importance.'
  merge: -1
  img_proc: true
- pgno: 302
  md: '# Random forest key concepts


    Random forest is a decision tree-based ML modelling process. Decision trees predict
    target variables by growing a hierarchy of successive splits across input features,
    based on the information gain of each split. If this sounds confusing, just think
    of it as a series of decision rules that result in a prediction at the end. The
    following diagram may help explain the idea:


    ![](img/9f2a55db1236f995dcd9392acbc82910_302_0.png)


    Decision tree ID3 algorithm simple diagram. Source: Wikimedia commons


    Random forests take this concept a step further by introducing randomness and
    repetition. From the original training set, a random variation of the training
    set is created by taking a random split and bootstrapping a dataset to train a
    tree. Bootstrapping uses random draws from a dataset to create a (usually) larger
    dataset as a way to simulate different datasets from the same population of data
    records.'
