- pgno: 161
  md: 'The Driver program must be able to listen and accept incoming communications
    from its executors. Executors must be able to talk to each other. All components
    should be "near" each other in the cluster. For this reason, it is not a good
    idea to be running a Driver program (Spark instance) on your laptop that is connected
    directly to the cluster.


    It is common and recommended practice to install Spark on the same cluster nodes
    as HDFS. This puts the processing close to the data and results in improved performance.


    It is very important to understand what portion of your application runs on the
    Driver and what portion runs across the worker nodes. The Driver is located on
    a single node and is limited to the CPU and memory available to it on that node.
    For this reason, data, memory, and computer requirements for operations must fit
    within those limits or the application will fail. What will run fine across the
    cluster, which has a much higher set of distributed resources, will crash and
    burn if unintentionally pulled back to the driver node.


    # Thinking about a single machine versus a cluster of machines


    Designing distributed computing analytics requires that you think what can be
    run in parallel and what has to be run one step after another. Running computations
    in parallel is where a lot of the speed advantage comes from in cluster computing
    systems such as Spark. But it does require a little differents are stored as a
    free form text field in each data row. You want to do a word count to see what
    are the top words respondents use. Hopefully, words such as **fantastic** and
    **educational** are on top and words such as **fraud** and **time wasting-junk-pile**
    are further down in the list.'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'The first step is to break up the text string for each row into a list of words.
    This can be done across many different nodes all at the same time. You would write
    Python code that does this, and then provide it to Spark to send to each executor
    so it can use it. This would be the first Map step. The next step would be to
    take each word and put a number next to it, so it can be summed up later. The
    form would be (fantastic, 1). At this point, the number would always be 1 as the
    same word will be in the dataset as often as it is present. This is the second
    map step, and you would use the same procedure as we discussed earlier.


    Next, the results should be ordered by the word across the cluster so it can be
    counted easier. This is a shuffle step. Then, each executor can add the numbers
    attached to each of the words together to get a total for the words it has on
    its plate. This reduces the rows to an individual word subtotal for each executor.
    Hence, this is called a Reduce step. Finally, all the subtotals are added together
    for an overall total for the cluster by each individual word in the final reduce
    step.


    Taken together, this concept is called Map/Reduce. This is a very simple example,
    and in practice, systems such as Spark handle much of the details for you. But,
    the overall concept holds even at higher-level applications where map and reduce
    is not directly called upon. You should think how to break apart the work so it
    can be distributed, then aggregate it into a much smaller result set for further
    analytics.


    # Using Spark for IoT data processing


    Using our conceptual diagram from earlier in the chapter, Spark fits into both
    the analysis interaction and the execution engine areas. You can write code directly
    on the core Spark objects and also make use of the programming modules that come
    along with it. The following image helps to visualize the Spark module stack:


    ![](img/9f2a55db1236f995dcd9392acbc82910_162_0.png)


    Spark Module Stack. Source: Apache Spark'
  merge: -1
  img_proc: true
- pgno: 163
  md: '**Spark SQL** is included with the SparkSession when it is created and allows
    you to write standard SQL that is interpreted into Spark actions and executed
    (using a DAG, of course). You can use it intermixed with other Spark code. This
    allows you to leverage the power and knowledge of SQL when appropriate and use
    code where it is appropriate, all without needing to switch languages.


    **Spark Streaming** is a set of libraries that allow the processing of stream
    data. Stream data is a high throughput, consistent feed of data from one to many
    sources. Spark Streaming provides higher-level abstracts to make it easier to
    analyze this type of data. The stream input is broken down into smaller batches
    of data for analytic operations using the Spark engine. Results can then be stored
    for additional longer-term analysis.


    **MLlib** is a set of machine learning libraries and commands that are optimized
    to run in parallel. This allows you to use very large datasets for training and
    run them much faster than other Hadoop-based projects. Machine learning algorithms
    are highly iterative which requires a lot of disk I/O for Hadoop MapReduce-based
    components. Spark operates mostly in memory, which greatly speeds up the iterations
    versus disk I/O.


    **GraphX** is a set of libraries designed for graph processing. The term *graph*
    used in this context is not about charts but is a branch of analytics specializing
    in network analysis. This is what is used to identify influential people in social
    networks as one example. A graph consists of **nodes** and **edges**, with the
    edges representing the connections between nodes.


    All of these modules can be used together and in a single application. This allows
    for a wide variety of applications and flexibility all within the same tool and
    programming construct. And everything scales with the size of the cluster.


    Spark works well as an ETL tool due to its scalability, speed, and flexibility.
    IoT data needs all three, so it is a good match. The incoming IoT data can be
    cleaned, processed, and enhanced using Spark. It can also create a machine learning
    pipeline to train algorithms as part of the same process.


    A common use case is to have a Spark job, most likely written in Pyspark, handle
    the initial ETL for long-term storage. Then, a separate set of jobs run on a daily
    or other regular schedule to enhance and further analyze the data. Finally, a
    visual analysis tool such as Tableau and statistical analysis libraries in either
    R or Python are linked to the resulting data for more advanced analytics.'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'The Spark SQL module is also fully compatible with HiveQL and can use the Hive
    metastore, Hive User Defined Functions (UDF), and SerDes. There is a HiveContext
    object that natively supports the integration when Spark is installed alongside
    Hive on the cluster. Spark also natively reads and writes to the Parquet format.
    The Parquet file could be in HDFS, S3, or another filesystem that Spark can access.
    Since Parquet includes schema information with the file, it is very simple to
    load and set up distributed datasets for analytics.


    ![](img/9f2a55db1236f995dcd9392acbc82910_164_0.png)


    *Spark Hive compatibility architecture. Source: Apache Spark*


    # # To stream or not to stream


    Streams are datasets that continuously update as each new data message arrives
    with little to no latency. Streaming analytics operate on this continuously updating
    dataset at much shorter intervals than batch processing. Real-time analytics is
    a little bit of a misnomer when applied to streaming analytics as intervals are
    typically in intervals rather than continuously ongoing. The frequency affects
    processing and technology requirements, so intervals should be set for longer
    time periods if possible in order to save costs.


    Stream datasets normally keep data for a window of time, and then discard it.
    There are specialized technology and processing options to handle streams, which
    are, for the most part, in addition to requirements for long term big data store
    technology we have focused on in this chapter. Amazon Kinesis is an example of
    a specialized data streaming technology service.


    The technology and the programming code base needed to support analytics are (usually)
    different for streaming than that needed for long-term historical analytics. This
    means that two systems and code bases are required for most use cases. There are
    multiple efforts underway to consolidate this into one; Spark 2.1 is a notable
    example with the Spark Streaming module, but this area is still maturing.'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'For IoT analytics, it is important to consider the use cases and what datasets
    you will need to support before deciding real-time streaming analytics is what
    you actually need. When you are looking for insights and new business opportunities,
    you will almost always be using datasets with long term history. Data from the
    latest hour or minute adds little incremental value for those use cases.


    Even though the lure of real-time analytics is tempting, you have to consider
    if the additional cost and maintenance of streaming technology is worth it. In
    most cases for IoT analytics, it is not and could be better served by increasing
    the batch processing frequency. You also have limitations in what you can do with
    streaming analytics versus batch analytics when incorporating additional datasets.
    Unless those datasets are also real-time, they are only usable for less frequent
    batch processing.


    While this is the case for *exploratory analytics* to find insights, it may not
    be the case for *productionalizing* the insights from those analytics. You may
    want near real-time analytics processing in some cases, such as when applying
    a predictive model to streaming sensor data to predict an equipment failure. You
    may want real-time streaming analytics for reporting dashboards that are monitored
    by fast reaction customer support teams.


    These are separate decisions, however. The recommendation is to avoid the overhead
    of adding streaming analytics unless there is a strong business case to do so.
    *Real-time* sounds good, but you need to make sure the incremental gain is worth
    the additional expense in both time and resources.


    # Lambda architectures


    Lambda architectures consists of an arrangement of data and processing technologies
    intended to serve both regular batch processing activities and near real-time
    streaming activities, in a way that allows results from both to be combined into
    a single view. The following descriptions and diagram highlight the conceptual
    components that make up the three layers to the architecture:


    +   - **Batch:** This layer keeps the master dataset and regular batch processing
    of the data to create views to support analytics, dashboards, and reporting linked
    to the Serving layer. The master dataset is immutable, meaning the data does not
    change once incorporated, and it is appended with new data as time goes on. A
    long-running Hadoop cluster would be an example.'
  merge: -1
  img_proc: true
- pgno: 166
  md: '+   - **Speed:** This layer is focused on recent data only (the streaming data).
    It handles requests that have low-latency requirements in terms of recency of
    data. Algorithms need to be fast and incremental to operate in the speed layer.
    Amazon Kinesis would be an example technology that operates in the speed layer.

    +   - **Serving:** This layer indexes batch views so they can be served up with
    low latency. This includes batch views from both the Batch and Streaming layers.


    ![](img/9f2a55db1236f995dcd9392acbc82910_166_0.png)


    Lambda architecture. Source: MapR technologies


    # # Handling change


    Change is constant, as contradictory as that sounds. The architecture, data model,
    and technology will constantly evolve over time. You will need to decide how to
    handle change in order to keep flexibility in your data storage and processing
    architecture. You will want to use tools that are decoupled from each other to
    allow future analytics to be easily integrated into the data processing stream.


    Fortunately, components in the Hadoop ecosystem were intentionally designed to
    be decoupled from each other. They allow the mixing and matching of components
    and were built to be extensible for new frameworks not even invented yet. Cloud
    infrastructures allow for easy testing and incorporation of new technologies and
    software.'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'You will need to design a process that takes your analytics and data processing
    code from experimentation, to development, to production. This holds true for
    your overall infrastructure as well. A common practice is to keep three separate
    environments: one for development, one for testing, and one for production.


    In order to save costs, you may decide to reduce this to two: a hybrid development
    and test environment, and a production environment. Either way, you will need
    a structured process to move your insights from initial ideas to fully-fledged
    parts of your standard operation.


    # Summary


    In this chapter, we discussed several cloud infrastructure technologies specific
    to IoT and processing incoming data from devices in the field. We also reviewed
    some strategies to collect and store IoT data in order to enable analytics. The
    Hadoop ecosystem and architecture was introduced with some detail on the key components
    for IoT analytics.


    You also learned when and why to use Spark for data processing. We discussed tradeoffs
    between streaming and batch processing. The Lambda architecture was introduced.
    Deciding how to handle change was discussed to build in flexibility to allow future
    analytics to be integrated with data processing.'
  merge: -1
  img_proc: true
