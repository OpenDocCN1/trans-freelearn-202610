- pgno: 45
  md: 'Most of these issues will be caught and corrected by the product validation
    processes. However, it is important to know if there are any product limitations
    or adjustments needed when it is near the edges of its operating ranges.


    # Networking basics


    Here is an oversimplified view of the networking protocol stack. There is much
    more going on here than we will cover in this chapter, but to help in understanding
    the discussion, it is useful to reduce it to a simple diagram:


    ![](img/9f2a55db1236f995dcd9392acbc82910_45_0.png)


    Network communications operates in layers with the bottom layers not needing to
    know about the layers above it. It can get confusing talking about all the options
    available at each layer of the stack. The diagram shows the key layers that we
    are concerned with for IoT analytics, but know that there is more to the story.


    The diagram is based on the simplified **OSI model**, which divides communication
    into five fundamental layers. There is a Physical layer at bottom that has more
    to do with device electrical engineering. We will leave that out to simplify things
    since we are focusing on analytics.'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'Connectivity will refer to options primarily in the Link layer of the stack.
    Data communication or messaging will be referring mainly to the Application layer.
    The Network layer is (usually) the Internet Protocol (IP) that we all know and
    love. It is a great consolidator that enables so much flexibility in the networking
    stack for internet communications.


    Transport is either TCP or UDP for most networking schemes that transmit data
    over long distances. TCP has more delivery guarantees but more overhead; UDP has
    less overhead but less guarantees on delivery.


    There is a wide variety of networking protocols for both connectivity from the
    internet to the IoT device and for the communication of the data the device generates.
    They solve two main problems:


    +   - **How do I establish communication, so I can send data packets?**

    +     - Let''s use snail mail as an analogy. If you have limited funds, you prefer
    sending brief postcards even it takes longer to arrive to the recipient. It costs
    less, and it does not take much effort to write. If money is not a problem, you
    would hire some professional authors and send prose approaching poetry. You would
    use airmail so it arrives quickly. In this analogy, battery power is like money
    and CPU/memory is like writing effort.

    +   - **How are the data packets delivered so that my needs are met?**

    +     - Do you and I agree to get each other''s address and send letters direct?
    Or do you always give them to Tom, in the cubicle down the hall, and he sends
    it out to whoever needs it? Do you send it certified mail because you have to
    be certain it was delivered? Or do you send it third-class post because it is
    much cheaper and not the end of the world if it gets lost?


    The network protocol used depends on the type of device and the environment in
    which it is located. It can also depend on the business priorities for which the
    data will be used.


    For example, in the case of monitoring aircraft engines in flight, it is more
    important to get the most recent data than to get all of the data. You need problems
    identified as soon as possible more than you need a complete recording of all
    in flight data, which is mostly the same. So if you have to make a choice between
    waiting but getting everything or never waiting but losing some data packets from
    time to time, you choose the latter.'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'This is different from the logistics provider that has a sensor, which detects
    tractor trailers entering and leaving a distribution hub. In this case, you want
    a complete record of traffic, and you would be willing to wait a minute or two
    to have it.


    Another important component to understand for IoT is that of a gateway. A gateway
    is a network node that connects two separate networks that use different protocols.
    The gateway handles the translation between them. A gateway is common in many
    IoT networks of constrained devices. It translates from the protocol optimized
    for the constrained devices to (usually) the protocol used by the wider internet
    (IP).


    There are multiple standards spread across several organizations such as the Industrial
    Internet Consortium, the IPSO Alliance, and the IEEE P2413. It is continuously
    evolving with many companies and alliances aligned along different connectivity
    protocols. It may be another five to 10 ten years before the options coalesce
    into a smaller group of consistently used standards.


    We will review the top ones you are likely to run across with an eye on the problems
    they are trying to solve.


    # IoT networking connectivity protocols


    Connectivity is all about solving the main problem - establishing a method to
    communicate. The strategies used are affected by the constraints on the network
    devices. Power availability often is the most significant one.


    # Connectivity protocols (when the available power is limited)


    The following protocols are specifically designed to address low power constraints.
    They are usually associated with lower complexity and bit transfer rates in the
    supported IoT devices.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Bluetooth Low Energy (also called Bluetooth Smart)


    Named after a tenth-century Danish king who unified several fractious tribes,
    Bluetooth is a familiar technology to most consumers. The specification is maintained
    by an organization called the **Bluetooth Special Interest Group (SIG)** made
    up of 25,000 companies. **Bluetooth Low Energy (BLE)** is a newer implementation
    that is not directly compatible with Bluetooth classic (of mobile phone headset
    fame). It was designed for low power needs and a less frequent data exchange rate.
    The following chart represents the network protocol stack for BLE:


    ![](img/9f2a55db1236f995dcd9392acbc82910_48_0.png)


    A BLE device is either a master or a slave in the network. A master acts as an
    advertiser in the connection while the slave acts as receiver. A master can have
    several slaves connected to it while a slave can link to only one master. The
    network group involving the slaves connected to a master is called a piconet.


    To make data available for analytics, the master device passes it over the internet
    using one of the data messaging protocols that will be discussed later in this
    chapter. There is typically a gateway device that is both part of the bluetooth
    network and also linked to the internet. It translates data reported from BLE
    nodes into the appropriate format for data messaging over the internet. It is
    commonly an unconstrained device that does not need to worry much about power.'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'Bluetooth 5.0 specification released mid-2016 promises to double the speed,
    quadruple the range, and bring an eight-fold increase in the capability for data
    broadcasting for low-power scenarios.


    ![](img/9f2a55db1236f995dcd9392acbc82910_49_0.png)


    Source: Bluetooth SIG


    # 6LoWPAN


    IPv6 over Low-Power Wireless Personal Area Networks (6LoWPANs) works as an adaptation
    layer in the data link portion of the protocol stack. It adapts wireless standard
    IEEE 802.15.4 devices to communicate using IPv6. This makes communication over
    the internet much easier since IP is the lingua franca.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '![](img/9f2a55db1236f995dcd9392acbc82910_50_0.png)


    6LoWPAN optimizes the IPv6 datagram transmission over low-power and lossy networks.
    One of the ways it does this is through header compression. This reduces the addressing
    information in the data packet down to a few bytes.


    Security can be implemented with Advanced Encryption Standard (AES)-128 encryption
    at the link layer. Transport Layer Security (TLS) encryption can also be used
    at the transport layer.


    Mesh style networks are supported. Devices inside the network use stateless auto
    configuration where they generate their own IPv6 addresses.


    The 6LoWPAN mesh network is connected to the IPv6 internet through an edge router.
    The edger router has three jobs:


    +   - Local data exchanges between devices in the 6LoWPAN

    +   - Data exchange between the internet and 6LoWPAN devices

    +   - The creation and maintenance of the 6LoWPAN wireless network


    6LoWPAN networks are connected to other networks using common IP-based routers.
    This connectivity can be through any type of linkage such as Wi-Fi, Ethernet,
    or cellular. This makes it simpler to connect to the wider internet than other
    connectivity options, which require stateful gateway devices in order to communicate
    to IP networks. Stateful gateway devices are more complicated as they need to
    remember the communication state and status for each IoT device.'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'There are two types of device inside a 6LoWPAN network, **hosts** and **routers**.
    Routers can forward datagrams to other devices. Hosts are simply endpoints. They
    can operate in sleepy states, periodically waking up and checking in with their
    parent device (router) for new data.


    ![](img/9f2a55db1236f995dcd9392acbc82910_51_0.png)


    Example of a 6LoWPAN network'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# ZigBee


    ZigBee is a little different animal than what we have talked about so far. It
    covers multiple layers of the protocol stack. It is the network protocol, the
    transport layer, and an application framework that is the underpinnings of a customer
    developed application layer.


    ![](img/9f2a55db1236f995dcd9392acbc82910_52_0.png)


    It has security builtin as a requirement and works using small, low power digital
    radios. It is a self-organizing wireless mesh-style network. The name comes from
    the waggle dance honey bees often do on returning to the hive.


    The range is short, up to 100 meters line of sight, but it can travel long distances
    by passing data through a mesh network of other ZigBee devices.


    The ZigBee alliance is a consortium of companies that maintain and publish Zigbee
    standards. ZigBee was first released as a standard in 2003. It is intended to
    be simpler and cheaper than other wireless protocols. Development code can be
    as little as 2% of equivalent code on Bluetooth.


    Data rates are low and devices tend to be simple. ZigBee standards require at
    least a two-year battery life for a device to qualify. The data transmission is
    periodic and intermittent. There are different categories of ZigBee device. A
    fully functioning device can act as a network coordinator and operates in both
    star and mesh topologies. A reduced functionality device can only communicate
    with a network coordinator and works in a star topology.'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'These devices form a **Personal Area Network (PAN)**. Network interaction times
    can be very fast. A device can join a network in 30 ms and change from sleeping
    to active in 15 ms.


    There are three types of ZigBee devices in a network:


    +   - A **coordinator device** that initiates network formation. There is one
    and only of these for each network. It may also act as a router once the network
    is formed. It serves as the trust center and is the repository for security keys.

    +   - A **router device** is optional. It can join with a coordinator or another
    router device and acts as a multi-hop intermediary in routing of messages.

    +   - An **end device** has just enough functionality to communicate with its
    coordinator. It is optional and cannot participate in the routing of messages.


    ![](img/9f2a55db1236f995dcd9392acbc82910_53_0.png)'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'The ZigBee networking routing protocol is reactive. It establishes a route
    path on demand instead of proactively such as IP. The network protocol used is
    **Ad hoc On-Demand Distant Vector (AODV)** which finds a destination by broadcasting
    to all its neighbors, which then send a requests to all their neighbors, until
    the destination is found.


    The network is silent between connections. Networks are self-healing. ZigBee networks
    are secured by 128 bit AES encryption. There is often a gateway device that is
    part of the ZigBee network and also linked to the internet. It translates data
    into the appropriate format for messaging over the internet. It can also convert
    ZigBee network routing protocol into IP routing protocol. The gateway is commonly
    an unconstrained device that does not need to worry much about power.


    # Advantages of ZigBee


    There are several advantages to ZigBee networks:


    +   - **Reliable and robust**: Networks are self-forming and self-healing.

    +   - **Low power requirements**: Devices can operate for years without needing
    a new battery. Solar power could last even longer.

    +   - **Global**: The wireless protocol it is built on is available globally.

    +   - **Security**: Encryption is part of the standard instead of an optional
    add on.


    # Disadvantages of ZigBee


    There are also some disadvantages:


    +   - **Not free**: It costs $3,500 USD at the time of writing to license the
    standard

    +   - **Low data rates**: It is not designed to support higher data rates

    +   - **Star network is limited**: The coordinator device supports up to 65,000
    devices


    # Common use cases


    ZigBee is commonly used in the following applications:


    +   - Home automation

    +   - Utilities monitoring and control

    +   - Smart lighting

    +   - Building automation

    +   - Security systems

    +   - Medical data collection'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# NFC


    **Near Field Communication (NFC)** allows two devices to communicate when brought
    within very short distances of each other - about 4 cm. It is a set of communication
    protocols that offer low speeds and simple setup. There is a variety of NFC protocol
    stacks depending on the type and use case.


    ![](img/9f2a55db1236f995dcd9392acbc82910_55_0.png)


    NFC logo


    NFC uses electromagnetic induction between two loop style antennas when devices
    exchange information. Data rates are around 100-400 kbit/s. It operates over radio
    frequency band 13.56 MHz, which is unlicensed and globally available.


    There is usually a full NFC device, such as a smartphone, and an NFC tag, such
    as a chip reader. All full NFC devices can operate in three modes:


    +   - **NFC peer-to-peer**: Devices exchange information on the fly.

    +   - **NFC card emulation**: Smartphones can act like smart cards in this mode,
    allowing mobile payments or ticketing.

    +   - **NFC reader/writer**: Full NFC devices can read information stored in inexpensive
    NFC tags, such as the type used on posters or pamphlets. You have probably used
    this at a conference to scan your attendee badge.


    NFC tags are usually read-only, but it is possible for them to be writeable. There
    is an initiator device and a target device in NFC communications. The initiator
    device creates an RF field that can power a target device. This means NFC tags
    do not need batteries in what is called passive mode. Unpowered NFC tag devices
    are very inexpensive, just a few pennies.'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'There is also an active mode where each device can communicate with the other
    by alternatively generating its own field to read data, then turning it off to
    receive data. This mode typically requires both the devices to have a power supply.


    For data records that eventually end up in an analytics dataset, the full NFC
    device would act as a gateway, translate the message, and then communicate over
    a different network protocol stack. In the case of a smartphone, it would take
    the NFC tag data and create its own data message to send over 4G/LTE for a destination
    on the internet.


    # Common use cases


    NFC is commonly used in the following applications:


    +   - Smartphone payments:

    +     - Apple pay

    +     - **Host Card Emulation (HCE)** - Android supported

    +   - Smart posters

    +   - Identification cards

    +   - Event logging

    +   - Triggering a programmable action


    # Sigfox


    Sigfox is a company based in France that has developed a cellular style, ultra
    low power, long-range networking technology. It is intended for small messages
    that are sent infrequently. Data rates are very low at 100 bits per second (bps).
    The signals used can travel up to 25 miles, and a base station can handle up to
    a million nodes. Similar to cellular, it is not intended to be for private networks,
    as it requires coverage in the area to use it.


    ![](img/9f2a55db1236f995dcd9392acbc82910_56_0.png)'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'Sigfox devices can be very low cost due to low complexity and power requirements.
    Power requirements could be as low as one thousandth of equivalent cellular communications.
    It has been used in inexpensive, but crucial, things such as smoke detectors and
    a fitness tracking collar for dogs (seriously).


    The current coverage includes the entirety of France and Spain, several other
    pockets in Europe, and some metropolitan areas in North America.


    # Connectivity protocols (when power is not a problem)


    These protocols are more about speed and high bit rates. Power constraints are
    less of a concern. They usually require more complexity in the supported IoT devices.


    # Wi-Fi


    Wi-Fi is any wireless network that follows IEEE 802.11 specifications. It is ubiquitous
    and global. Provided you have not been hiding in a cave for the last decade, you
    know it well. Many IoT devices use it to connect to the internet, so it is useful
    to review how it works.


    ![](img/9f2a55db1236f995dcd9392acbc82910_57_0.png)


    To connect to a **Wi-Fi Local Area Network (WLAN)**, a device needs a network
    interface controller. This may be a separate controller card or simply integrated
    as part of the chipset inside the device. Communication uses Ethernet-style data
    packets over pre-identified radio communication bands. Packet delivery is not
    guaranteed and uses best effort delivery mechanism. Network protocol layers higher
    up in the stack, such as TCP or UDP, can offer guarantees of data delivery on
    top of the Wi-Fi standards.'
  merge: -1
  img_proc: true
