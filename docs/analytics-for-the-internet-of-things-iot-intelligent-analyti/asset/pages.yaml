- pgno: 351
  md: '# The IoT data flow


    In order to understand a complex system, such as the flow of data from IoT devices,
    or the flow of risk and money in a Collateralized Debt Obligation (CDO), as depicted
    by the IMF in the following diagram, you need to map out the process. Then, you
    need to understand how each stop along the way contributes to the end result.
    This can help avoid unprofitable projects - and worldwide recessions.


    ![](img/9f2a55db1236f995dcd9392acbc82910_351_0.png)


    How AAA assets were created out of subprime mortgages - money flow diagram. Source:
    IMF'
