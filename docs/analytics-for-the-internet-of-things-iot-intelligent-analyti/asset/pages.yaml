- pgno: 170
  md: '# # Exploring and visualizing data


    The first step in any analytics, *especially* IoT analytics, is getting to know
    your data. Like a future spouse, you need to know everything you can about it.
    Know its flaws and its strong points. Know which attributes can be annoying and
    make sure you are able to live with them. Get to know its future earning potential.
    And find all this out before it is too late and you are bound to it.


    In this chapter, we will use a couple of tools to quickly learn quite a bit about
    a sample dataset. Examples will follow along with methods to dive into the data
    in order to find its strengths and weaknesses. For exploration and visualization,
    we will use Tableau. For more statistical evaluations, we will use the statistical
    programming language R.


    # ## The Tableau overview


    **Tableau** is a business intelligence and analytics software tool that allows
    you to connect to dozens of different database and file types, drag and drop to
    build visualizations, and easily share them with others. There are two main versions,
    desktop and server. The desktop is a high-powered tool you install on your laptop
    to connect and manipulate datasets. A server is a web-based component where you
    publish your desktop visualizations for others to easily interact with them.


    We will only focus on the Tableau desktop in this chapter as our mission is to
    explore data versus communicating analytic findings. It is free to try for a limited
    period. You can download it from the company''s website (https://www.tableau.com/products/desktop/download).


    The first step in working with your data using Tableau is to connect to your dataset.
    Tableau has many different connectors able to link to a wide variety of databases
    and file formats. Think of Tableau as a window into your data, a way to link to
    it and explore it. It is separate from your data though, keep them distinct in
    your mind.'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# Getting to Know Your Data - Exploring IoT Data


    After you connect to your data, there are four main sections of the workspace.
    They are highlighted in the following screenshot:


    ![](img/9f2a55db1236f995dcd9392acbc82910_171_0.png)


    Tableau desktop main view


    We will describe each section in detail next.


    +   - **Available data fields** (Data pane in Tableau terminology): This section
    shows the fields in the linked dataset. You can also create additional fields
    calculated from other data fields. You can create your own category groupings
    and hierarchies here. Data fields are split into two types.

    +     - **Dimensions:** A dimension is a field that holds categories or labels.
    A way to determine if a field should be a dimension is to think if it would make
    any sense to sum up or average its values. If the answer is no, it is better used
    as a dimension. Examples are customer names, segments, ID fields, phone numbers,
    state names, and dates.'
  merge: -1
  img_proc: true
- pgno: 172
  md: '+   - **Measures:** A measure is a number that does not represent a category
    and is from a continuous range of values. These are numbers that you would sum
    or average. Examples are units sold, temperature, and the lengths of time.

    +   - **Filtering and formatting** (the **Filter** shelf, the **Pages** shelf,
    and the **Marks** card): This is where you filter data records and determine the
    format of the charts and tables in the visual workspace.

    +   - **Column and row shelves** (the **Columns** shelf and the **Rows** shelf):
    This is where you drag fields to build your view in the visual space. Fields listed
    here are on deck in the interactive view.

    +   - **Visual workspace:** This shows the results of your manipulations in the
    other sections. You can also dig directly into the data records behind the points
    or numbers shown in this area.


    # # Techniques to understand data quality


    The dataset we will use for examples in this chapter is from the United States
    **National Oceanic and Atmospheric Administration (NOAA)**. It is a subset of
    the U.S. 15 Minute Precipitation Data, which is available on the NOAA website
    (direct link: `https://www.ncdc.noaa.gov/cdo-web/search?datasetid=PRECIP_15`).


    We are using the dataset from January 1, 2013 to January 1, 2014 for the U.S.
    state of Colorado. You can download it from NOAA or from the Packt website for
    this book. Make sure to check all the available fields when downloading the data
    from NOAA. Also download the documentation on the dataset, which has descriptions
    of the fields (`https://www1.ncdc.noaa.gov/pub/data/cdo/documentation/PRECIP_15_documentation.pdf`).


    For this exercise, you can save reading the documentation until the end of the
    chapter to see how it lines up with what we observe. For any other situation,
    you should scour the documentation first and take notes as if you are studying
    for a final exam in a class where you want the top grade.'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# Look at your data - au naturel


    The very first thing you should always do with unfamiliar data is to look at a
    good sample of it in raw form. This is a very important and an often overlooked
    step, even by experienced analysts. Your first instinct will be to run averages
    and standard deviations to look for trends. Resist the impulse.


    You want to view the file first without any formatting or interpretations, so
    you need to use a software tool that does not apply any formats to it. If you
    have a Windows laptop, Notepad is a good one to use as long as the file is not
    too large. Excel is not good to use for this, as it applies its own formatting
    and interpretations to text files, such as `.csv`.


    On a Mac or a Linux machine, use a command-line text viewing tool. On a Mac, you
    can open Terminal and navigate to the directory with the file, and type the command
    `cat filename.csv | less`. Pressing the spacebar will advance the screen; type
    `q` to exit. You can do the same from a Linux command line. The following shows
    how the raw data looks on a Mac or Linux machine. Windows will show a very similar
    format:


    ![](img/9f2a55db1236f995dcd9392acbc82910_173_0.png)


    From this initial look, you can learn a few things about the makeup of the data
    and areas you will need to investigate. Some examples are listed next:


    +   - **The first row has the names of the fields in it:** This is good as you
    will not have to figure it out and enter the names yourself. However, you will
    need to make sure that when the file is loaded into a data store such as HDFS,
    the first row is not considered a data row.'
  merge: -1
  img_proc: true
- pgno: 174
  md: '+   - **There are two fields each with the name of Measurement Flag, Quality
    Flag, and Units**: This could be duplicate data, or it could be that the order
    of the field has meaning in relation to another field. You will need to know what
    each means and which one is which when you are ready to analyze the dataset. The
    order may be different in the analysis tool than it is in the text file. To prepare
    for this, find some rows that have different values in each of the fields, then
    note the fields that uniquely identify it (such as **STATION** and **DATE**).
    You can use those in the analysis tool to verify which field is which.

    +   - **Values in the QPCP field are either very small positive numbers or -9999**:
    -9999 appears to signify something other than a measurement. Good thing you did
    not run averages using it.

    +   - **There are quite a few missing values in the Measurement Flag and Quality
    Flag fields**: You will definitely need to review the documentation to understand
    what this means.

    +   - **The date time values are not in a common standard format**: You might
    need to do some parsing to get your analytic tools to recognize the value as a
    date. Note the structure (`yyyymmdd hh:mm`).

    +   - **There may not be a record for every 15-minute interval**: The rows appear
    to be in date and time order, but there does not appear to be a record for every
    15-minute interval in a day. This may not be the case when the entire file is
    sorted, but you should note it as something to investigate.


    Scan through several screens worth of data and look for any patterns. If the dataset
    seems to be sorted, scan through at least one transition to another source device
    to see how values change. We are not attempting to be very scientific at this
    stage in getting to know your data. The goal is to look for any obvious patterns
    and data quality issues.


    # Data completeness


    Due to the nature of low-power sensors and unreliable connectivity, IoT data often
    has missing and incomplete values. You will want to get a sense of how often this
    occurs and if there are any patterns to it. For an initial look, we will use Tableau
    to connect to our sample dataset. It is recommended to go through the introductory
    training on the software website to familiarize yourself with it.'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# Getting to Know Your Data - Exploring IoT Data


    The first step is to connect to the `.csv` file that holds the weather data. In
    the starting screen, click on **Text file** as the data source type. Then, browse
    to and select the file to link to it.


    ![](img/9f2a55db1236f995dcd9392acbc82910_175_0.png)


    Review the field types assigned to the columns in the file. Note that the **Date**
    field is assumed to be a string format instead of a date-time format. If you attempt
    to change this, it will not be recognized due to the uncommon format. You will
    need to parse the date (as suspected during the raw file review):


    ![](img/9f2a55db1236f995dcd9392acbc82910_175_1.png)


    Click on the **Sheet1** tab to start building views into the data. We will need
    to do a little modification to the data fields to make exploring them a little
    easier. Right-click on the **Date** dimension and create in the pop-up menu and
    select the **Calculated** field. Call it `Measurement Date` and input the calculation,
    `DATEPARSE("yyyyMMdd hh:mm", [Date])`. This will take a string in the format described
    and interpret it as a date:'
