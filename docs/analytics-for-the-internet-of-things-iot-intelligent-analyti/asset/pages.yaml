- pgno: 345
  md: 'As can be seen in the resulting net cost and savings curves, based on the model''s
    predictions, the optimal savings would be from a proactive repair program of the
    top 30 percentile units. The savings decreases after this, although you would
    still save money when replacing up to 75% of the population. After this point,
    you should expect to spend more than you save. The following set of charts is
    the output from the preceding code:


    ![](img/9f2a55db1236f995dcd9392acbc82910_345_0.png)


    Cost and savings curves for the proactive repair $253 and failure cost at $1,000
    scenario'
  merge: -1
  img_proc: true
- pgno: 346
  md: 'Note how this changes in the following graph when the failure cost drops to
    $300 USD. At no point do you save money, as the proactive repair cost will always
    outweigh the reduced failure cost. This does not mean you should not do a proactive
    repair; you may still want to do so in order satisfy your customers. Even in such
    a case, this cost curve method can help in decisions on how much you are willing
    to spend to address the problem. You can rerun the code with **proactive_repair_cost**
    set to **253** and **failure_repair_cost** set to **300** to generate the following
    charts:


    ![](img/9f2a55db1236f995dcd9392acbc82910_346_0.png)


    Cost and savings curves for the proactive repair $253 and failure cost at $300
    scenario'
  merge: -1
  img_proc: true
- pgno: 347
  md: 'And finally, notice how the savings curve changes when the failure cost moves
    to $5,000. You will notice that the spread between the proactive repair cost and
    the failure cost determines much of when doing a proactive repair makes business
    sense. You can rerun the code with **proactive_repair_cost** set to **253** and
    **failure_repair_cost** set to **5000** to generate the following charts:


    ![](img/9f2a55db1236f995dcd9392acbc82910_347_0.png)


    Cost and savings curves for the proactive repair $253 and failure cost at $5,000
    scenario


    Ultimately, the decision is a business case based on the expected costs and benefits.
    ML modeling can help optimize savings under the right conditions. Utilizing cost
    curves helps to determine the expected costs and savings of proactive replacements.'
  merge: -1
  img_proc: true
- pgno: 348
  md: '# # Summary


    In this chapter, we discussed the economics of cloud computing and open source
    software. We reviewed cost considerations for IoT analytics and how to think about
    revenue opportunities. We also covered ways to think about an IoT analytics business
    case.


    The economics of predictive maintenance was discussed as an example of how to
    view the costs and benefits of an applied IoT analytics ML model. An example framework
    for calculating the cost benefit was presented along with some R code, demonstrating
    how to generate a cost curve based on the ML model.'
  merge: -1
  img_proc: true
- pgno: 349
  md: '# 13


    # Bringing It All Together


    The President of Operations at your company, previously the VP of Connected Services
    and your boss, smiles as he firmly shakes your hand.


    "Revenues are up 10% and it is clearly attributable to the work of your team,"
    he says. "The CEO and I have decided to create a new position, Vice President
    of Connected Analytics. I want you to lead it."


    "Thank you and I hope to earn the confidence placed in me," you say, trying to
    hide your smile.


    "Oh, you already have that," he winks, "You can tell your team. They stay with
    you and we''re adding a data management team and a frontend prototyping team to
    your group. Did I tell you that we are doubling the number of IoT products in
    the next fiscal year?"


    He nods and turns to stroll away still smiling.


    "You start immediately," he says over his shoulder.


    You think to yourself, *I finally made it. After all the work and stress, I made
    it.* You enjoy the thought for a few minutes. Until you come to the realization:
    *Wait, how am I going to manage double the products and a much larger team while
    still meeting the revenue expectations of the C...E...O?*


    But that would be a different book....


    This final chapter wraps up this book and reviews what you have learned. It includes
    some parting advice on how to get the most value out of Analytics for the Internet
    of Things. There is also a sample project included to challenge yourself and try
    on your own.'
  merge: -1
  img_proc: true
