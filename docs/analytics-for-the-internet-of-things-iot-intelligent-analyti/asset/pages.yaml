- pgno: 251
  md: 'All the locations are based in reference to some other starting point. To accurately
    represent a location, you need to know where the starting point is located and
    the framework on how position is determined from that starting point. There are
    many representations on how to do this. This is where **Coordinate Reference Systems
    (CRS)** come into play.


    # Coordinate Reference Systems


    A Coordinate Reference System, also referred to as **Spatial Reference System
    (SRS)** or a **map projection**, identifies what method was used to convert the
    three dimensional sphere-like Earth into a flat X,Y coordinate surface. In other
    words, it explains what method was used to project three dimensions onto a two
    dimensional surface.


    There are literally thousands of defined ways to do this, each with its own pluses
    and minuses. Each defined method is a separate CRS, the most common being **World
    Geodetic System 1984** or **WGS 84**, which is used by the **Global Positioning
    System (GPS)**.


    In order to correctly identify a position and accurately calculate things such
    as surface distance between two points, the CRS for a set of spatial data must
    be known. It is typically identified and stored as part of the file or geospatial
    database. One CRS can be converted into another CRS as long as both are known.


    # The Earth is not a ball


    The world is not a perfect sphere. It is an ellipsoid and like a middle-aged man,
    it bulges in the center. This means that using simple geometry calculations for
    a sphere on geospatial data will not be entirely accurate.


    Using methods for calculating distance across a sphere, such as the haversine
    formula for great circle distance calculation, will become more and more inaccurate
    as the distance between two points increases. You can still use the haversine
    method for calculating short distances without much loss in accuracy, but avoid
    it for longer distances.


    ![](img/9f2a55db1236f995dcd9392acbc82910_251_0.png)


    The haversine formula. Source: Wikipedia.org'
  merge: -1
  img_proc: true
- pgno: 252
  md: 'The following R code can be used to calculate the haversine distance for two
    points on the Earth. Remember that it is not entirely accurate over long distances.
    Instead, leverage code packages and database systems that are aware of the CRS,
    and are able to use it to calculate spatial data with precision. The R code uses
    two points that are far apart to give you an idea of the relative inaccuracy of
    the method. The actual distance between the points is 12,935 km:


    ```

    #code adapted from RosettaCode.


    #Coordinates for the two points

    #Chicago, USA O''Hare airport (ORD)

    Point1Lat = 41.978194

    Point1Long = -87.907739


    #Coordinates for Chhatrapati Shivaji International Airport near Mumbai,

    India airport (BOM)

    Point2Lat = 19.0895595

    Point2Long = 72.8656144


    #convert decimal degrees to radians

    degrees_to_rad <- function(deg) (deg * pi / 180)


    # Volumetric mean radius is 6371 km for the Earth, see

    http://nssdc.gsfc.nasa.gov/planetary/factsheet/earthfact.html

    # The diameter is thus 12742 km


    #function to calculate great circle distance using haversine method

    great_circle_distance <- function(lat1, long1, lat2, long2) {

    a <- sin(0.5 * (lat2 - lat1))

    b <- sin(0.5 * (long2 - long1))

    12742 * asin(sqrt(a * a + cos(lat1) * cos(lat2) * b * b))

    }


    #calculate distance for the two points

    haversine_distance <- great_circle_distance(

    degrees_to_rad(Point1Lat), degrees_to_rad(Point1Long),   # Nashville

    International Airport (BNA)

    degrees_to_rad(Point2Lat), degrees_to_rad(Point2Long))  # Los Angeles

    International Airport (LAX)


    #result shown in kilometers

    haversine_distance

    # 12,942.77km

    ```'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'There are different methods to adjust for the actual shape of the Earth. WGS
    84 CRS uses a few parameters in order to increase accuracy of the projections.
    The following table summarizes the parameters:


    | Parameter | Notation | Value |

    |---|---|---|

    | Flattening Factor of the Earth | 1/f | 298.257223563 |

    | Geocentric Gravitational Constant | GM | 3986004.418 10^8 m³/s² |

    | Nominal Mean Angular Velocity | ω | 7292115 10^-11 rad/s |

    | Semi-major Axis | a | 6378137.0 m |


    WGS 84 defining parameters. Source: United Nations Office for Outer Space Affairs


    Although you will mostly come across two dimensional coordinates for the WGS 84
    CRS, it is a three dimensional representation of the Earth. The starting point
    is based on the Earth''s center of mass. The following image from the Defense
    Mapping Agency shows how this is represented:


    ![](img/9f2a55db1236f995dcd9392acbc82910_253_0.png)


    WGS Reference Frame By Defense Mapping Agency - Section 1-5 PDF of the DMA TECHNICAL
    REPORT TR8350.2-b - (Second Printing, 1 December 1987) Supplement to DoD WGS 84
    Technical Report Part 2 - Parameters, Formulas, and Graphics. http://earth-info.nga.mil/GandG/publications/tr8350.2/TR8350.2-b/Sections%201-201-5.pdf.
    Public Domain, https://commons.wikimedia.org/w/index.php?curid=41796676'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'The point of highlighting this detail is to not only give an idea of the complexity
    behind map projections but to convince you to leverage the centuries of work already
    completed in this field. Do not attempt to duplicate it; take advantage of what
    has already been done.


    A great way to take advantage of what has already been done in geospatial analytics
    is by using Python geospatial libraries. There are many great packages for R that
    can be used as well, but there are more options with Python. They tend to be more
    mature due to the long use of Python in the geospatial community.


    Python also tends to scale better than R, so it can be a better fit for large-scale,
    compute-intensive processing. Geospatial calculations can get fairly intensive
    and IoT data, as we know well by this point in the book, becomes a large-scale
    effort in a short amount of time.


    Due to these considerations, Python for geospatial analytics is a great fit. In
    this chapter, we will shift our focus from R code to Python code. For big data
    analytics, you should be comfortable with both. An easy way to get started with
    Python is to download the Anaconda package from https://www.continuum.io/downloads.
    Anaconda includes Python, R, and over 720 packages, including more than 100 of
    the most popular packages for data science.


    It also includes both a Python IDE called Spyder and the browser-based notebook,
    Jupyter. Jupyter is important for IoT analytics as it can be run on a Hadoop cluster,
    allowing you to develop Python code in a distributed environment without having
    to run code through a console. It also can be used to develop Spark applications
    in Python, Scala, or R. The combination of Spark and Python geospatial libraries,
    installed across the cluster, provides the capability to scale geospatial analytics.


    # Vector-based methods


    There are two main categories of geospatial analysis and file types, vector and
    raster. Vectors are all about shapes, while rasters are more about grids. Vector
    is more common due to flexibility and efficient storage. Vectors can be defined
    simply by using a set of points. There are three main types of vector geometry:


    +   - **Points:** This can be defined in two or three dimensions. It is the common
    latitude, longitude pair you are probably very familiar with. The airport locations
    used in the R code previously are examples of points.'
  merge: -1
  img_proc: true
- pgno: 255
  md: '+   - **Lines or LineString:** A LineString is defined by a set of points and
    order is important. More than one LineString can be stored together; in that case
    it is called, unsurprisingly, a **MultiLineString**. A river system or roadway
    network is an example of a MultiLineString. A file that contains a MultiLineString
    for the US Interstate roadways network can be downloaded from the University of
    Iowa GIS Library (`ftp://ftp.igsb.uiowa.edu/gis_library/USA/us_interstates.htm`).
    The following image is a visualization of that file:


    ![](img/9f2a55db1236f995dcd9392acbc82910_255_0.png)


    The US Interstate system. Source: Environmental Systems Research Institute, Inc.
    (ESRI)


    +   - **Polygon:** A polygon is defined as a closed network of points. Order of
    the points is important and the starting point is also repeated as the ending
    point, thus closing out the shape. More than one polygon can be stored together,
    which is then called, you guessed it, a **MultiPolygon**. An example of this is
    a MultiPolygon representing the nation of Indonesia, which, according to the CIA
    World Factbook, consists of 13,466 islands:'
  merge: -1
  img_proc: true
- pgno: 256
  md: '![](img/9f2a55db1236f995dcd9392acbc82910_256_0.png)


    A Multipolygon image of Indonesia


    There are several Python packages developed for geospatial analytics. Two of the
    most popular related to vectors are *shapely* and *fiona*. *Shapely* has several
    computational geography algorithms while *fiona* interacts with vector files.
    You can install both packages using `conda` or `pip install` from the command
    line, as seen in the following code. Use `conda install` if you installed the
    Anaconda distribution:


    ```

    conda install shapely

    ```


    Or you can use the following:


    ```

    pip install shapely

    ```


    We will review some key vector concepts and the *shapely* code that implements
    them. There are many more than we cover here, but this should give you a good
    starting place. Use *fiona* to save the results into a file.


    # The bounding box


    An important concept in vector-based analysis is the **bounding box**. This plays
    into many aspects of geospatial processing, including spatial indexing. A box
    shape is computationally much easier to search and manipulate than an irregular
    LineString or Polygon. Putting things into a box first and then fine tuning specific
    to its shape later is a common pattern for efficient searching.'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'A bounding box is simply the smallest rectangle that will contain the vector
    object in question. This is often called a **Minimum Bounding Rectangle (MBR)**
    and is the basis for many geospatial search algorithms. The following image shows
    an MBR for a collection of polygons:


    ![](img/9f2a55db1236f995dcd9392acbc82910_257_0.png)


    Minimum bounding rectangle for a set of polygons. Source: Wikipedia commons


    An MBR can be determined with *shapely* using the bounds method:


    ```

    ```python

    #Import linestring class

    from shapely.geometry import LineString


    #create a linestring from a series of points

    MBRline = LineString([(1, 0),(1, 1),(3,5),(2,2)])


    #determine MBR bounding box

    MBRboundingBox = MBRline.bounds


    #output results

    MBRboundingBox


    #(1.0, 0.0, 3.0, 5.0)

    ```

    ```


    # Contains


    You can also test if one spatial object contains another, such as a point in a
    polygon or a city in a state using the contains function. This can be used to
    determine if a location is in a postal code, province, or congressional district.
    The within function is the inverse and determines if the object is within another
    object:


    ```

    ```python

    #import polygon class

    from shapely.geometry import Polygon

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 258
  md: '```

    ```python

    #create a square polygon

    polysquare = Polygon([(0,0),(0,2),(2,2),(2,0),(0,0)])


    #test if polygon contains the point

    print(polysquare.contains(Point(1,1)))


    #test if point is within the polygon

    print(Point(1,1).within(polysquare))


    #test if other point is within the polygon

    print(Point(5,7).within(polysquare))

    ```

    ```


    # Buffer


    A buffer expands a geometry object by a specified amount. If it is a LineString,
    a buffer will create a polygon in the shape of the LineString expanded on both
    sides by the buffer amount. To illustrate this, the following screenshot shows
    a closeup of the US Interstate system near Chicago with a buffer of 1 km:


    ![](img/9f2a55db1236f995dcd9392acbc82910_258_0.png)


    A closeup of US Interstates near Chicago with 1 km buffer'
  merge: -1
  img_proc: true
- pgno: 259
  md: '# Dilation and erosion


    With shapely, a positive buffer is a dilation and a negative amount is an erosion.
    A dilation works as previously described while an erosion shrinks a polygon by
    the buffer amount. Shapely also has some options for the shape of a cap (the buffer
    area at the ends of lines) and areas where the buffer joins to itself. The following
    shows the cap and join style options:


    # shapely.geometry.CAP_STYLE


    | Attribute | Value |

    |-----------|-------|

    | round     | 1     |

    | flat      | 2     |

    | square    | 3     |


    # shapely.geometry.JOIN_STYLE


    | Attribute | Value |

    |-----------|-------|

    | round     | 1     |

    | mitre     | 2     |

    | bevel     | 3     |


    The following code shows a simple example of how buffering works:


    ```

    #import linestring class, cap and join styles

    from shapely.geometry import LineString, CAP_STYLE, JOIN_STYLE


    unbufferedLine = LineString([(0, 0), (1, 1), (0, 2), (2, 2), (3, 1), (1, 0)])

    dilatedBufferedLine = unbufferedLine.buffer(0.5, cap_style = CAP_STYLE.square)

    erodedBufferedLine = dilatedBufferedLine.buffer(-0.3, join_style = JOIN_STYLE.round)


    #Show the polygon detail. This gets more complicated than a line!

    print(erodedBufferedLine)

    ```'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'The following image helps to visualize the results:


    ![](img/9f2a55db1236f995dcd9392acbc82910_260_0.png)


    Buffer example. Source: Shapely documentation


    # Simplify


    Sometimes, the exact detail is not necessary and a simpler version of a geometry
    object can be used to speed up computations. For our Interstates example, a line
    that follows a road precisely is probably not necessary for the use case. If the
    line is approximately close, it will work fine when a 1 km buffer is applied.
    The reduction in the complexity and size of the object can pay big dividends,
    especially in a parallelized big data environment. In that environment, the spatial
    objects could be held in memory on hundreds of nodes, so efficiency improvements
    can have a large impact.


    Shapely provides the simplify method to reduce the size and complexity of a geometry
    object while retaining much of the original shape. The tolerance variable controls
    the amount of reduction with a higher number resulting in more simplification.
    The following Python code demonstrates how this works (this example is an extension
    of the previous buffer code):


    ```

    #print area of polygon

    print(erodedBufferedLine.area)

    #show number of coordinates needed to define exterior of the polygon

    print(len(erodedBufferedLine.exterior.coords))


    #simplify

    erodedSimplified = erodedBufferedLine.simplify(0.05,

    preserve_topology=False)

    ```'
  merge: -1
  img_proc: true
- pgno: 261
  md: '```

    print(erodedSimplified.area) #note minimal change in area

    print(len(erodedSimplified.exterior.coords)) #big reduction in coordinates


    print(erodedSimplified)

    ```


    # Vector summary


    We have barely touched the surface of the functionality that is available to work
    with, manipulate, and analyze vector-based geometry. There are entire books on
    the subject, which are well worth your time for insight into ways to enhance your
    IoT analytics capability.


    # Raster-based methods


    **Raster** consists of a grid of cells arranged in rows and columns. Think of
    raster like pixels on a screen, except each pixel is defined using a set ground
    distance. There is a lot in common between raster files and image files. Raster
    files are sometimes saved using the same formats as image files. Images are often
    created straight from raster files; you see such examples all the time, from weather
    forecasts to terrain maps.


    The size of the cells in the grid is similar in concept to the resolution of an
    image. Unlike vector data, a raster contains information for the entire area it
    covers. It is useful for things that have values for an entire area, such as elevation
    and temperature. The downside is the resulting large file sizes.


    Multiple values per cell can be stored as different **bands** in the dataset.
    This is similar in concept to RGB values for a color image. The SRTM and Digital
    Elevation Model (DEM) datasets discussed in Chapter 7, *Decorating Your Data -
    Adding External Datasets to Innovate*, are examples of raster data models.


    The prime Python package for rasters is *GDAL*. It can interact with over 80 different
    raster file types and contains functions to read and transform raster data. Manipulating
    raster data can get complex and is outside the scope of this book. There are some
    great tutorials that can be found with a quick Google search. For the most part,
    you will be using vector-based methods for IoT analytics.'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# Applying Geospatial Analytics to IoT Data


    Raster and vector data layers can be used in combination. The following image,
    courtesy of NOAA, represents how they can be used to together in a representation
    of the real world:


    ![](img/9f2a55db1236f995dcd9392acbc82910_262_0.png)


    # Storing geospatial data


    There are many ways to store geospatial data. Depending on your intended use,
    a filesystem format or a relational database maybe the most appropriate. We will
    cover an introduction to both.


    # File formats


    There are hundreds of file formats for storing geospatial data. The most common
    for vector data is ESRI shapefiles. A shapefile actually consists of multiple
    different files with the .shp extension for the main file. Most geospatially-aware
    software and Python packages know to look for the other needed files when given
    the location of the .shp file.'
  merge: -1
  img_proc: true
- pgno: 263
  md: '**GeoJSON** is another storage format that is human readable. It uses a defined
    JSON format to store vector data definitions as text. It is easily readable but
    can get large in size.


    Another way to represent vector data, whether in a file or in code, is using the
    **Well-known text (WKT)** and **Well-known binary (WKB)** formats. WKT is human
    readable, while WKB is not. WKB offers significant compression in size, so is
    often a good choice for database storage. It can be converted into WKT upon reading.
    The following table summarizes the WKT formats for each geometry type:


    | Geometry primitives (2D) |

    | Type | Examples |

    | Point | POINT (30 10) |

    | LineString | LINESTRING (30 10, 10 30, 40 40) |

    | Polygon | POLYGON ((30 10, 40 40, 20 40, 10 20, 30 10))

    | Polygon | POLYGON ((35 10, 45 45, 15 40, 10 20, 35 10), (20 30, 35 35, 30 20,
    20 30)) |


    | Multipart geometries (2D) |

    | Type | Examples |

    | MultiPoint | MULTIPOINT ((10 40), (40 30), (20 20), (30 10))

    | MultiPoint | MULTIPOINT (10 40, 40 30, 20 20, 30 10) |

    | MultiLineString | MULTILINESTRING ((10 10, 20 20, 10 40), (40 40, 30 30, 40
    20, 30 10)) |

    | MultiPolygon | MULTIPOLYGON (((30 20, 45 40, 10 40, 30 20)), ((15 5, 40 10,
    10 20, 5 10, 15 5))) |

    | MultiPolygon | MULTIPOLYGON (((40 40, 20 45, 45 30, 40 40)), ((20 35, 10 30,
    10 10, 30 5, 45 20, 20 35), (30 20, 20 15, 20 25, 30 20))) |


    Well-known Text format examples. Source: Wikipedia


    Raster data is most commonly stored in the **Tagged Image File Format (TIFF)**
    (.tiff) files. It can also be stored as ASCII grid files but file size is a concern.
    There are some compressed formats, such as **Multi-resolution Seamless Image Database
    (MrSID)** with the .sid extension and **Enhanced Compression Wavelet (ECW)** with
    the .ecw extension.'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# Spatial extensions for relational databases


    With spatial extensions, relational databases can support storing geometry data
    in database tables and also perform some geospatial functions. These are typically
    not part of standard installation but can be enabled through administration settings
    or by installing software extensions.


    For open source Relational Database Management Systems (RDBMS), PostgreSQL, and
    MySQL both support spatial functionality. PostgreSQL is the by far most popular
    and is most fully functional. When the spatial components are enabled for PostgreSQL,
    it is commonly referred to as PostGIS. You will see the terms used interchangeably.
    PostgreSQL is a supported RDS option on AWS. The spatial extensions can be enabled,
    turning it into PostGIS.


    For closed source RDBMS, Oracle (Spatial and Graph), and SQL Server are popular.
    Oracle is generally considered as the most capable one. These are not the only
    options as more and more databases are supporting spatial data. Amazon Aurora,
    a MySQL-compatible managed RDS database on AWS, has recently added spatial support.


    # Storing geospatial data in HDFS


    HDFS and Hive do not natively support spatial data types. All is not lost, though,
    as HDFS can store any type of file, including geospatial files. Geometry can be
    stored in string (WKT) and binary (WKB) forms. They can be converted using code
    upon retrieval. Hive tables are schema-on-read and support User Defined Functions
    (UDF). A UDF can be created to interpret geospatial data.


    In fact, there are some open source projects that do just that. One is called
    SpatialHadoop and can be found at http://spatialhadoop.cs.umn.edu/index.html.
    Another is called spatial-framework-for-hadoop and can be found on GitHub (https://github.com/Esri/spatial-framework-for-hadoop).
    The downside is that these projects are not fully supported and are not a part
    of the Cloudera and Hortonworks Hadoop distributions.


    A more robust method is to store spatial data as WKT or WKB and use geospatial
    Python packages to manipulate it.'
  merge: -1
  img_proc: true
- pgno: 265
  md: '# Spatial indexing


    The world is a big place. Imagine trying to find where someone lives if you do
    not know their house address, postal code, or even the country they live in. You
    would have to visit every home until you run into the person you are looking for,
    which will take longer than you have left and would not be very enjoyable anyway.


    Thankfully, addresses allow a quick identification of where someone lives by identifying
    the country, the state or province within that country, the postal code, and the
    street name where you can drive, until you find their house number, which tends
    to follow an established order along the street.


    Spatial databases can get very large, so an efficient method of searching for
    geometry is needed in order to improve response times. This is where spatial indexing
    comes into play. There are a variety of methods that are employed to do this.
    We will cover one of the more popular methods next.


    # R-tree


    R-tree is a spatial indexing method used in both PostGIS and Oracle databases.
    It leverages the bounding box concept to create a hierarchical index tree. The
    tree is balanced in the sense that all branches have the same level of nodes.
    In order to understand how a basic R-tree index is built, we will walk through
    a simple example.


    For a given set of geometries, the MBR for each one is defined. The MBR for each
    is what is retained in the index. The following image shows an example of these
    first steps:


    ![](img/9f2a55db1236f995dcd9392acbc82910_265_0.png)


    MBR for a set of shapes. Source: OSGeo project'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'The R-tree index is built from the MBRs so that larger bounding boxes contain
    groups of smaller bounding boxes with the goal of optimizing the search time for
    the lowest level MBRs. The resulting set of bounding boxes forms a tree hierarchy,
    which is stored as an index. The index tree is then used to quickly find the matching
    geometry by working down the hierarchy. The following image helps to visualize
    an example R-tree index:


    ![](img/9f2a55db1236f995dcd9392acbc82910_266_0.png)


    R-tree index, Source: Wikipedia'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'A spatial database such as PostGIS can easily create an index on a geometry
    field. A simple SQL statement such as the following for PostGIS will build an
    R-tree index. PostGIS builds it on top of a **Generalized Search Tree (GiST)**
    layer for robustness. GiST is a generic algorithm that can be used with several
    types of indexing methods. The example of GiST is shown in the following code:


    ```

    ```sql

    CREATE INDEX [indexname] ON [tablename] USING GIST ( [geometryfield] );

    ```

    ```


    There is also a Python package called *rtree* that can be used to build an index
    as part of a code module. This can be useful for some heavy duty geospatial processing
    where you need to repeatedly scan through a set of geometries.


    # Processing geospatial data


    Specialized software can help in processing and visualizing geospatial data. This
    can be useful for small data and one-time analyses. Even if you have a big data
    solution, using these tools can help you communicate your findings more effectively
    to others.


    # Geospatial analysis software


    We will review the most popular **Geographic Information System (GIS)** tools,
    so you have some familiarity with them. They are useful support tools for geospatial
    analytics.


    # ArcGIS


    ArcGIS is the de facto standard for paid GIS software. It was developed and is
    maintained by the ESRI corporation. It has an awe-inspiring amount of functionality
    and is used by most professional geospatial analysts. It has world-class support
    by ESRI and many training options abound. It links to useful datasets and geospatial
    analytic capabilities, which are also maintained by ESRI.'
  merge: -1
  img_proc: true
- pgno: 268
  md: 'ArcGIS is available as a desktop application or as a cloud service. You can
    sign up for a 60-day free trial (https://www.arcgis.com/features/free-trial.html).
    You can use ArcGIS to do many different kinds of analytics, including geoprocessing
    your own custom shapefile. The following example shows how ArcGIS can be used
    to define polygon areas within a 4-minute drive time of a set of location points
    on a typical Friday afternoon at 5 pm:


    ![](img/9f2a55db1236f995dcd9392acbc82910_268_0.png)


    Drive time area analysis example. Source: ArcGIS


    # QGIS


    QGIS is open source and very powerful desktop GIS software. It is similar to ArcGIS
    but not to the full scope of capability as the paid ESRI software. But the price
    is right, and it still has a wide variety of capabilities. It can also be manipulated
    with Python code. There is a vast trove of documentation on it and many useful
    books on how to use it.'
  merge: -1
  img_proc: true
- pgno: 269
  md: 'You can download and install QGIS from the project site (http://www.qgis.org/en/site/forusers/download.html).
    If you are unable to get ArcGIS, make sure to keep QGIS handy. QGIS was used to
    create many of the images in this book. You can use both QGIS and ArcGIS to connect
    directly to geospatial databases, such as PostGIS and Oracle. The following image
    shows an example of what can be created with QGIS:


    ![](img/9f2a55db1236f995dcd9392acbc82910_269_0.png)


    QGIS example screenshot. Source: anitagraser.com


    # ogr2ogr


    ogr2ogr is part of the GDAL library. It is a command-line tool used to convert
    files from one OpenGIS Simple Features Reference Implementation (OGR) spatial
    format to another. It is a no-frills tool but is used heavily by geospatial analysts.
    The general format for a command-line conversion follows the following example:


    ```

    ogr2ogr -f "file_format" destination_data source_data

    ```


    You can use it to convert PostGIS data into shapefiles or load shapefiles into
    PostGIS for example. It supports conversion into over 90 file formats for vector
    data alone.'
  merge: -1
  img_proc: true
- pgno: 270
  md: '# PostGIS spatial functions


    PostGIS contains dozens of spatial functions that can be referenced in a standard
    SQL query. The following table provides an overview of some commonly used functions:


    | Function | Description |

    |---|---|

    | `ST_GeomFromText` | This returns a specified ST_Geometry value from WKT representation.
    |

    | `ST_GeomFromWKB` | This creates a geometry instance from a WKB geometry representation
    and optional SRID. |

    | `ST_Buffer` | This returns a geometry covering all points within a given distance
    from the input geometry. |

    | `ST_ConvexHull` | The convex hull of a geometry represents the minimum convex
    geometry that encloses all geometries within the set. |

    | `ST_Intersection` | This returns a geometry that represents the shared portion
    of geomA and geomB. |

    | `ST_Simplify` | This returns a simplified version of the given geometry using
    the **Douglas-Peucker** algorithm. |

    | `ST_Boundary` | This returns the closure of the combinatorial boundary of this
    geometry. |

    | `ST_Transform` | This returns a new geometry with its coordinates transformed
    to a different spatial reference. |

    | `ST_Centroid` | This returns the geometric center of a geometry. |

    | `ST_ClosestPoint` | This returns the 2-dimensional point on g1 that is closest
    to g2. This is the first point of the shortest line. |

    | `ST_Contains` | This returns true if and only if no points of B lie in the exterior
    of A, and at least one point of the interior of B lies in the interior of A. |

    | `ST_Covers` | This returns 1 (TRUE) if no point in geometry B is outside geometry
    A. |

    | `ST_Crosses` | This returns TRUE if the supplied geometries have some, but not
    all, interior points in common. |'
  merge: -1
  img_proc: true
