- pgno: 28
  md: 'At this point, you can''t begin to think how you would apply Machine Learning
    to this data. You are not quite sure what it even means. You know the data is
    difficult to manipulate for anything beyond recent datasets. Surely, long periods
    of time would be needed to extract value out of it.


    You hear a cough from behind you. Your boss is back.


    He says quietly and stiffly, "I''m sorry. We''re going to have to hire a consultant
    to take this over. I know how hard you''ve been working. You''ve done some amazing
    things considering the limitations, and nobody appreciates that enough. But I
    have to show results. It will probably take a month or two to fully bring someone
    on board. In the meantime, just keep at it—maybe we can make a breakthrough before
    then."


    Your heart sinks. You are convinced there is huge value in the connected device
    data. You feel like you could make a career out of IoT analytics if you could
    just figure out how to get there. But you are not a quitter.


    You decide you will not go down without a fight, you will find a way.


    # Defining IoT analytics


    In order to understand IoT analytics, it is helpful to separate it out and define
    both analytics and the IoT. This will help frame the discussion for the rest of
    the book.


    # Defining analytics


    If you ask a hundred people to define analytics, you are likely to get a hundred
    different answers. Each person tends to have his or her own definition in mind
    that can range from static reports to advanced deep learning expert systems. All
    tend to call efforts in the wide ranging territory analytics without much further
    explanation.


    We will take a fairly broad definition in this book as we are covering quite a
    bit of territory. In their best selling book *Competing on Analytics*, Tom Davenport
    and Jeanne Harris created a scale, which they called **Analytics Maturity**. Companies
    progress to higher levels in the scale as their use of analytics matures, and
    they begin to compete with other companies by leveraging it.'
  merge: -1
  img_proc: true
- pgno: 29
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 30
  md: 'We will also take the view that analytics maturity is about having the capability
    and knowing how to enable the full scale. It is not about what you are doing.
    It is about what you are capable of doing in order to maximize your sum total
    ROI across the full scale. Each level can be exploited if an opportunity is spotted.
    And we want there to be fertile ground for opportunities across the full scale.
    More about this will be covered throughout the book.


    # Defining the Internet of Things


    Sensors have been tracking data for decades at manufacturing plants, retail stores,
    and remote oil and gas equipment. Why all of sudden is there this IoT hype all
    over the media?


    The dramatic decrease in sensor costs, bandwidth costs, the spread of cellular
    coverage, and the rise of cloud computing all combine to create fertile conditions
    to easily connect devices over the internet. For example, as shown in the following
    graph, Goldman Sachs predicts an average sensor cost in 2020 of under $0.40 USD,
    30% of what it was in 2004. Whether all these devices should be connected or not
    is hotly debated:


    ![](img/9f2a55db1236f995dcd9392acbc82910_30_0.png)


    Data source: Goldman Sachs, BI estimates'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'The definitions of IoT seem to vary quite a bit; some include machine sensors
    only, others include RFID tags and smartphones.


    We will use this definition from Forrest Stroud on Webopedia:


    > > The IoT refers to the ever-growing network of physical objects that feature
    an IP address for the internet connectivity and the communication that occurs
    between these objects and other internet-enabled devices and systems.


    Or to get even more basic: stuff that talks to other stuff over the internet without
    requiring you to do anything. This clears it up, right?


    Even the number of things projected to be connected by 2020 varies widely. Some
    sources project 20.8 billion devices, others project up to 50 billion - over twice
    the amount.


    For our purposes, we are more concerned with how to analyze the data generated
    than we are about the scope of devices that should be considered part of the IoT.
    If something sends data remotely by way of the internet, it is fair game for us,
    especially if it is machine-generated on one end and machine-consumed on the other.


    We are more concerned with how to extract value from the data and adapt to circumstances
    inherent to it. IoT is not really new, as elements of it have been developing
    for decades. Remote detection of oil well spills was happening in the 1970s. GPS-based
    vehicle telematics has been around for 20 years. IoT is also not a separate market;
    it blends into current products and processes. Although much of the media reports
    on it as if it is a different animal (perhaps even the author of this book - guilty
    as charged?), you should not think of it this way.


    # The concept of constrained


    The term **constrained** is an important concept in understanding IoT devices,
    data, and impacts on analytics. It refers to the limited battery power, bandwidth,
    and hardware capability that has to be considered in the design of IoT devices.
    For many IoT use cases, one or more of these has to be balanced with the need
    to record useful data.


    # IoT analytics challenges


    There are some special challenges that come along with IoT data. The data was
    created by devices operating remotely, sometimes in widely varying environmental
    conditions that can change from day to day. The devices are often distributed
    widely geographically.'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'The data is communicated over long distances, often across different networking
    technologies. It is very common for data to first transmit across a wireless network,
    then through a type of gateway device to be sent over the public internet–which
    itself includes multiple different types of networking technology working together.


    # The data volume


    A company can easily have thousands to millions of IoT devices with several sensors
    on each unit, each sensor reporting values on a regular basis. The inflow of data
    can grow quite large very quickly. Since IoT devices send data on an ongoing basis,
    the volume of data in total can increase much faster than many companies are used
    to.


    To demonstrate how this can happen, imagine a company that manufactures small
    monitoring devices. It produces 12,000 devices a year, starting in 2010 when the
    product was launched. Each one is tested at the end of assembly and the values
    reported by the sensors on the device are kept for analysis for five years. The
    data growth looks like the following image:


    ![](img/9f2a55db1236f995dcd9392acbc82910_32_0.png)


    A chart showing data storage needs for production snapshot of 200 KB and 1,000
    units per month. Five years of production data is kept'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'Now, imagine the device also had internet connectivity to track sensor values,
    and each one remains connected for two years. Since the data inflow continues
    well after the devices are built, data growth is exponential until it stabilizes
    when older devices stop reporting values. This looks more like the blue area in
    the following chart:


    ![](img/9f2a55db1236f995dcd9392acbc82910_33_0.png)


    Chart shows the addition of IoT data at 0.5 KB per message, 10 messages per day.
    Devices are connected for two years from production


    In order to illustrate how large this can get, consider the following example.
    If you capture 10 messages per day and the message size is half of a full production
    snapshot, by 2017, data storage requirements would be over 1,500 times higher
    than production-only data.


    For many companies, this introduces some problems. The database software, storage
    infrastructure, and available computing horsepower is not typically intended to
    handle this kind of growth. The licensing agreements with software vendors tends
    to be tied to the number of servers and CPU cores. Storage is handled by standard
    backup planning and retention policies.


    The data volume rapidly leads to computing and storage requirements well beyond
    what can be held by a single server. It gets cost prohibitive very quickly under
    traditional architectures to distribute it across hundreds or thousands of servers.
    To do the best analytics, you need lots of historical data, and since you are
    unlikely to know ahead of time which data is most predictive, you have to keep
    as much as you can on hand.


    With large-scale data, computing horsepower requirements for analytics are not
    very predictable and change dramatically depending on the question being asked.
    Analytic needs are very elastic. Traditional server planning ratchets up on premise
    resources with the anticipated number of servers needed to meet peak needs determined
    in advance. Doubling compute power in a short amount of time, if even possible,
    is very expensive.'
  merge: -1
  img_proc: true
- pgno: 34
