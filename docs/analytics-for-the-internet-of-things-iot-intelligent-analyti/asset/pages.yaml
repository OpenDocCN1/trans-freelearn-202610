  md: 'Code words in text, database table names, folder names, filenames, file extensions,
    pathnames, dummy URLs, user input, and Twitter handles are shown as follows: `SRTM.py`
    on GitHub is an example.


    A block of code is set as follows:


    ```

    IF SUM([Amount of Precipitation (inches)]) >= 0.2 THEN

    "Yes"

    ELSE

    "No"

    END

    ```


    Any command-line input or output is written as follows:


    ```

    hdfs dfs -put lots_o_data.csv /user/hadoop/datafolder/lots_o_data.csv

    ```


