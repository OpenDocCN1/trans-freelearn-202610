- pgno: 36
  md: '![](img/9f2a55db1236f995dcd9392acbc82910_36_0.png)


    In early 2008, Central Brazil was one, two, or three hours ahead of eastern U.S.,
    depending on the date


    Source: Wikipedia commons


    When time is recorded for an event, such as a parking spot being vacated, it is
    essential for analytics that the time is as close to the actual occurrence as
    possible. In practice, though, the time available for analytics can be the time
    the event occurred, the time the IoT device sent the data, the time the data was
    received, or the time the data was added to your data warehouse.


    # Problems with space


    IoT devices are located in multiple geographic locations. Different areas of the
    world have different environmental conditions. Temperature variations can affect
    sensor accuracy. You could have less accurate readings in Calgary, Canada than
    in Cancun, Mexico, if cold impacts your device.'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'Elevation can affect equipment such as diesel engines. If location and elevation
    is not taken into consideration, you may falsely conclude from IoT sensor readings
    that a Denver-based fleet of delivery trucks is poorly managing fuel economy compared
    to a fleet in Indiana. Lots of mountain roads can burn up some fuel!


    ![](img/9f2a55db1236f995dcd9392acbc82910_37_0.png)


    Remote locations may have weaker network access. The higher data loss could cause
    data values for those locations to be underrepresented in the resulting analytics.


    Many IoT devices are solar powered. The available battery charge can affect the
    frequency of data reporting. A device in Portland, Oregon, where it is often cloudy
    and rainy will be more impacted than the same device in Phoenix, Arizona, where
    it is mostly sunny.


    There are also political considerations related to the location of the IoT device.
    Privacy laws in Europe affect how the data from devices can be stored and what
    type of analytics is acceptable. You may be required to anonymize the data from
    certain countries, which can affect what you can do with analytics.


    # Data quality


    Constrained devices means lossy networks. For analytics, it often results in either
    missing or inconsistent data. The missing data is often not random. As mentioned
    previously, it can be impacted by the location. Devices run on a software, called
    firmware, which may not be consistent across locations. This could mean differences
    in reporting frequency or formatting of values. It can result in lost or mangled
    data.'
  merge: -1
  img_proc: true
