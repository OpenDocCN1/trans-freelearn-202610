  md: '# Get to know categories in the data


    Now, explore the data by identifying categories and missing values. Drag various
    Dimensions to the Rows and Columns shelves to view categories, record counts,
    and missing values (Null). Compare some dimensions against each other to understand
    how they interact. Are both Null at the same time, or do they appear unrelated?


    Tableau allows you to interact this way quickly, so take advantage of it. An example
    is shown in the following screenshot comparing the Measurement Flag fields for
    Qgag and Qpcp against each other. You can see that they are frequently Null at
    the same time:


    ![](img/9f2a55db1236f995dcd9392acbc82910_189_0.png)


    Qgag versus Qpcp measurement flags using record counts


    # Bring in geography


    Geography is a very powerful aid in understanding IoT data when devices are located
    in a variety of places. A thousand devices centered in Denver, Colorado are likely
    to provide different data values than a thousand devices spread evenly across
    the state. Patterns that are not obvious from statistical analysis of the data
    can become very obvious when shown on a map.'
