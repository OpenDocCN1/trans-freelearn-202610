  md: '# Qgag Trend over Time


    ![](img/9f2a55db1236f995dcd9392acbc82910_188_0.png)


    Qgag values over time


    We can note a couple of interesting patterns. The first is that Qgag values are
    missing across all stations for a period around July 2013. This would warrant
    some phone calls to find out why. There are data records during that period; however,
    all have the -9999 Qgag values so are filtered out in this view.


    The second is that the Qgag values for a station increase over time and at irregular
    intervals suddenly drop to a significantly lower value. Knowing that the values
    indicate accumulated precipitation, the drop could be an indication that the vessel
