- pgno: 357
  md: 'Incorporating business case costs and benefits directly into your machine learning
    modeling will allow you to optimize the model''s output. A method to create cost
    curves in order to visualize the impact of machine learning models was introduced.
    We also covered a deep dive into predictive maintenance economics with a hypothetical
    example.


    In short, we covered the following recommendations:


    +   - Organize data for your data scientists, not your database administrators

    +   - Plan how an initial concept will grow into a production service

    +   - Develop a data retention plan that retains potential data value

    +   - Use the cloud appropriately to keep costs low

    +   - Build costs and benefits into your machine learning process

    +   - Predictive maintenance does not always make sense; incorporate costs and
    benefits to determine when it does


    # A sample project


    If you are ready to challenge yourself, the following is a project that you can
    work out how to do on your own. There is no education like actually doing the
    work yourself, especially when you are not sure of the right answers:


    The project steps are as follows:


    +   1. **Set up the AWS environment:** Follow Chapter 4, _Creating an AWS Cloud
    Analytics Environment_ to prepare a secure area for data storage and IoT analytics.

    +   2. **Build a data feed to NOAA hourly weather data:** You could use Python
    code in an AWS Lambda function or a service such as Amazon Kinesis to process
    the feed.

    +   3. **Import the dataset into a Hadoop environment** (store in HDFS): Practice
    querying data using Hive. Amazon EMR can be used for this or a Cloudera/Hortonworks
    distribution.

    +   4. **Combine with another data set:** You choose; have fun.

    +   5. **Analyze with Tableau to understand the data:** Connect to Hive and explore
    the combined data. Create a dashboard to communicate some metrics and alerts.

    +   6. **Use R to create a machine learning prediction model:** Use random forest
    and gradient boosting machines to fit models. Judge which one is best using an
    ROC curve chart. Predict the weather; be your own weatherman!'
  merge: -1
  img_proc: true
