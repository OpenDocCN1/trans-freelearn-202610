- pgno: 4
  md: '# About the Author


    **Andrew Minteer** is currently the senior director, data science and research
    at a leading global retail company. Prior to that, he served as the director,
    IoT Analytics and Machine Learning at a Fortune 500 manufacturing company.


    He has an MBA from Indiana University with a background in statistics, software
    development, database design, cloud architecture, and has led analytics teams
    for over 10 years.


    He first taught himself to program on an Atari 800 computer at the age of 11 and
    fondly remembers the frustration of waiting through 20 minutes of beeps and static
    to load a 100-line program. He now thoroughly enjoys launching a 1 TB GPU-backed
    cloud instance in a few minutes and getting right to work.


    Andrew is a private pilot who looks forward to spending some time in the air sometime
    soon. He enjoys kayaking, camping, traveling the world, and playing around with
    his six-year-old son and three-year-old daughter.


    > *I would like to thank my ever-patient wife, Julie, for her constant support
    and tolerance of so many nights and weekends spent working on this technical book.
    I also thank her for credibly convincing me that this book was not actually a
    sleep aid, she was just tired from watching the kids. I also want to thank my
    energetic little princess-dress-wearing daughter, Olivia, and my intelligent Lego-wielding
    son, Max, for inspiring me to keep at it. Thank you to my family for your constant
    support and encouragement, especially my father who I suspect is more excited
    about this book than I am.*


    > *While I am thanking everyone, I want to give a shout-out to all the fantastic
    people I have worked with over the years, both bosses and colleagues. I have learned
    far more from them than they have from me. I have been truly lucky to work with
    such talented people.*


    > *Last but not least, I want to thank all my editors and reviewers for their
    comments and insights in developing this book.*


    > *I hope you, the reader, not only learn a lot about analytics for IoT but also
    enjoy the experience.*'
  merge: -1
  img_proc: true
- pgno: 5
  md: '# # About the Reviewer


    **Ruben Oliva Ramos** is a computer systems engineer from Tecnologico of León
    Institute, with a master''s degree in computer and electronic systems engineering,
    teleinformatics, and networking specialization from the University of Salle Bajio
    in Leon, Guanajuato Mexico. He has more than 5 years of experience in developing
    web applications to control and monitor devices connected with Arduino and Raspberry
    Pi using web frameworks and cloud services to build applications using the Internet
    of Things.


    He is a mechatronics teacher at the University of Salle Bajio and teaches students
    on the master''s degree in design and engineering of mechatronics systems. He
    also works at Centro de Bachillerato Tecnologico Industrial 225 in Leon, Guanajuato
    Mexico, teaching subjects such as electronics, robotics and control, automation,
    and microcontrollers at Mechatronics Technician Career, consultant and developer
    projects in areas such as monitoring systems and datalogger data using technologies
    such as Android, iOS, Windows Phone, HTML5, PHP, CSS, Ajax, JavaScript, Angular,
    ASP .NET databases SQLite, mongoDB, MySQL, web servers Node.js, IIS, hardware
    programming Arduino, Raspberry pi, Ethernet Shield, GPS and GSM/GPRS, ESP8266,
    control, and monitor systems for data acquisition and programming.


    > > I would like to thank my savior and lord, Jesus Christ for giving me strength
