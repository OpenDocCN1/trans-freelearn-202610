- pgno: 89
  md: '# # Distributed computing


    Also called cluster computing, distributed computing refers to spreading processes
    across multiple servers using frameworks that abstract the coordination of each
    individual server. The frameworks make it appear as if you are using one unified
    system. Under the covers, it could be a few servers (called nodes) to thousands.
    The framework handles the orchestration for you.


    # # Avoid containing analytics to one server


    The advantage to this for IoT analytics is in scale. You can add resources by
    adding nodes to the cluster; no change to the analytics code is required. The
    most common framework in use today is Hadoop, which we will talk about in *Chapter
    4, Creating an AWS Cloud Analytics Environment*.


    Try and avoid containing analytics to one server (with a few exceptions). This
    puts a ceiling on scale.


    # # When to use distributed and when to use one server


    There is a complexity cost to distributed computing though. It is not as simple
    as single server analytics. Even though the frameworks handle a lot of the complexity
    for you, you still have to think and design your analytics to work across multiple
    nodes.


    Here are some guidelines on when to keep it simple and on one server:


    +   - **There is not much need for scale:** Your analytics process needs little
    change even if the number of IoT devices and data explodes. For example, the analytics
    process runs a forecast on data already summarized by month. The volume of devices
    makes little difference in that case.

    +   - **Small data instead of big data:** The analytics run on a small subset
    of data without much impact from data size. Analytics on random samples is an
    example.

    +   - **Resource needs are minimal:** Even at orders of magnitude more data, you
    are unlikely to need more than what is available with a standard server. In this
    case, keep it simple.'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# # Assuming that change is constant


    The world of IoT analytics moves quickly. The analytics you create today will
    change many times over as you get feedback on results and adapt to the changing
    business conditions. Your analytics processes will need to change. Assume this
    will happen continuously and design for change. This brings us to the concept
    of **continuous delivery**.


    Continuous delivery is a concept from software development. It automates the release
    of code into production. The idea is to make change a regular process. Bring this
    concept into your analytics by keeping a set of simultaneous copies that you use
    to progress through three stages:


    +   1. **Development:** Keep a copy of your analytics for improving and trying
    out new things.

    +   2. **Test:** When ready, merge your improvements into this copy where the
    functionality stays the same, but it is repeatedly tested. The testing ensures
    it is working as intended. Keeping a separate copy for test allows development
    to continue on other functionality.

    +   3. **Master:** This is the copy that goes into production. When you merge
    things from test to the master copy, it is the same as putting it into live use.
    Cloud providers often have a continuous delivery service that can make this process
    simpler.


    For any software developer readers out there, this is a simplification of the
    **git flow** method, which is a little outside the scope of this book. If the
    author can drop a suggestion, it is worth some additional research to learn git
    flow and apply it to your analytics development in the cloud.


    # # Leverage managed services


    Cloud infrastructure providers, such as AWS and Microsoft Azure, offer services
    for things such as message queues, big data storage, and machine learning processing.
    The services handle the underlying resource needs such as server, storage provisioning,
    and also network requirements. You do not have to worry about how this happens
    under the hood, and it scales as big as you need it.'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'Cloud providers also manage global distribution of services to ensure low latency.
    The following image shows the AWS regional data center locations combined with
    underwater internet cabling:


    ![](img/9f2a55db1236f995dcd9392acbc82910_91_0.png)


    This reduces the amount of things you have to worry about for analytics. It allows
    you to focus more on the business application and less on the technology. This
    is a good thing and you should take advantage of it.


    An example of a managed service is Amazon **Simple Queue Service (SQS)**. SQS
    is a message queue where the underlying server, storage, and compute needs are
    managed automatically by AWS systems. You only need to set it up and configure
    it, which takes just a few minutes.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# Use Application Programming Interfaces (API)


    APIs are a way for other processes, software, or services to access analytics
    code that you have created. It allows you to easily reuse your code in other applications.
    You can also allow your customers to directly access this functionality through
    web-based APIs.


    An API builds on of encapsulation principle. It is a defined list of supported
    actions and information that another system can call and retrieve. The calling
    system does not need to know how the action is performed or the information created
    and retrieved. The complexity is hidden.


    The API defines how to interact with an encapsulated set of analytic processes.
    It abstracts away the details. It also supports low friction change as the analytics
    processes can be improved without requiring other systems to alter what they are
    doing. As long as the API definition is held constant, the other systems will
    not know the difference.


    APIs are a great way to create building blocks for more complex analytics. You
    can use multiple APIs to build rich, fully-functional analytic applications in
    a short period of time. It is also far easier to adapt to changing business conditions
    by reconfiguring the assembled applications to use a different mix of APIs.


    A Web API uses the internet to handle the communication between systems. Cloud
    providers offer this as a managed service. It can help a great deal in handling
    security and scale. Using this service, you can quickly implement new analytics
    functionality securely and at scale. The API can be either public or private.
    Private is only accessible to your internal applications. Public opens it up to
    systems outside your company.


    ![](img/9f2a55db1236f995dcd9392acbc82910_92_0.png)


    Example architecture using Web API gateway. Source: Amazon Web Services'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'Cloud providers can even handle usage tracking and billing if you decide to
    offer the functionality behind your API as a paid service to your customers.


    # # Cloud security and analytics


    You can build security into analytics using several methods supported by major
    cloud infrastructure providers.


    # ## Public/private keys


    Cloud providers use asymmetric cryptography throughout their services. The public
    and private keys are generated. You keep the private key, so the service does
    not have a copy. The service holds the public key. Communication using public/private
    key is secure and has never been broken.


    The cloud provider could publish the public key in tomorrow''s newspaper and it
    would not matter; the encryption cannot be broken with just the public key. It
    may seem counterintuitive that a public key is used to encrypt data but cannot
    be used to decrypt it. But it works.


    Every time you visit a website starting with HTTPS; a public/private key encryption
    is being used. It is the basis of SSL and TLS encryption, which is employed for
    HTTPS communications.


    You will use the public/private keys often for IoT analytics when you build secure
    processes. Think of it like a username and password for your analytics, but better.
    Cryptography is a fascinating subject (for some of us at least); read up on it
    for more details. Otherwise, take it on faith that it is all good - it is!


    # ## Public versus private subnets


    When you set up a cloud environment for analytics, you are creating your own networking
    environment. You, or hopefully a skilled network guru, will need to define the
    networking structure. A basic component of this is the concept of subnets.'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'Subnets are logical subdivisions of the overall network in your cloud environment.
    You launch resources into a subnet where it will follow the internet addressing
    rules defining for the subnet. A public subnet has resources that can be addressable
    from the outside internet. This does not mean that all resources in the subnet
    can be found from the outside; you would need to assign a public IP address to
    it first.


    A private subnet is not addressable from the outside internet. There are methods
    to allow internet communication through a gateway device, usually a Network Address
    Translation (NAT) device, but an outside object cannot initiate communication
    directly with something in a private subnet.


    Most analytic processing should happen in a private subnet for security reasons,
    which adds some complexity in connecting with resources. This is why we are discussing
    it here. However, it is more than worth it to secure it from mischief. Know which
    of your subnets are private and make sure to spin up new resources there.


    # Access restrictions


    Restrict access to your analytic resources to named users only. Avoid the trap
    of keeping a single user ID and password that everyone uses. For resources accessed
    by public/private keys, make sure to keep the private key in a safe, secure place.


    For networking security, only allow network traffic through to your resources
    that are needed. Block all others. Lock everything down from the start and then
    open things up only when needed.


    In a distributed computing environment, such as you will use for IoT analytics,
    networking is a key element in both security and problem solving. You will run
    into situations where your analytic jobs will not run correctly and find that
    the source was a network or security related setting. It is best to understand
    this and use best practices from the start of your analytics projects.


    # Securing customer data


    Keep your IoT data secure, use access controls, and encrypt data files. IoT data
    can be used to infer things about your customers, so take special care with it.
    You are the guardian of their information. You could be unintentionally exposing
    your company to legal risk by not properly securing customer data.'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'Encryption can be enabled in two ways, in transit and at rest. In transit refers
    to network transmission such as SSL or TLS. Most cloud services require their
    use. Make sure all the network communication in support of your analytic process
    is encrypted in transit.


    Encryption at rest refers to data storage. This could be data files on a server
    or data inside a database. Cloud providers can encrypt your data and make it transparent
    to you if you are using public/private key pairs to secure it.


    Use this when data could be accessed by a wide set of users, such as all employees
    of your company. If the data is only accessible by a few people due to tight access
    controls and it is in a private subnet, you can be a little less strict - it is
    unlikely to get out. In general, if encryption is seamless, use it. If your data
    is accessible through the public internet, definitely use it.


    Cloud providers were born operating inside the public internet. Security is built
    in at every level. Take advantage of it and use public/private keys, private subnets,
    access control, and encryption to secure your valuable data.


    # # The AWS overview


    In the land of cloud infrastructure, AWS is the king. It was the first of its
    kind, launched in 2005, and is the largest by a wide margin. It is ranked number
    one in every segment of Gartner magic quadrants on cloud infrastructure providers.


    As reported by Computerworld in 2016, it has ten times the compute capacity of
    its 14 closest rivals combined. Entire companies, such as Netflix and AirBnB,
    run their operations on it. As can be seen in the following chart, AWS has over
    30% of the market share, with the next closest competitor at 9%.


    ![](img/9f2a55db1236f995dcd9392acbc82910_95_0.png)'
  merge: -1
  img_proc: true
