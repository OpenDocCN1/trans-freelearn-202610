    # # Deep learning


    **Deep learning** is an area of data science that is experiencing rapid advancement
    and generating a lot of excitement. Some deep learning models are better at certain
    types of image recognition than humans. When stories in the media mention artificial
    intelligence, they are usually referring to deep learning models.


    Deep learning models are very complex although several of the concepts are similar
    to the ML concepts we have discussed so far in this chapter (such as the bias-variance
    tradeoff). Deep learning models can have millions of features and can take days
    or weeks to train.'
  merge: -1
  img_proc: true
- pgno: 313
  md: '# Use cases for deep learning with IoT data


    Deep learning can do wonders for complex data, with thousands to millions of features
    and a large history of labeled examples to use as training sets. The rapid advancements
    in image recognition has as much to do with the vast trove of identified images
    that Google and others have collected over the years, as to the advances in the
    deep learning algorithms used.


    For IoT data, this can limit the usefulness of deep learning techniques. Most
    IoT data is relatively new without a long history of labeled examples. Many IoT
    devices have only a few sensors, so the feature set is not as complex. In these
    situations, many of the ML techniques discussed previously can do as good, if
    not better, job of prediction than deep learning techniques. Deep learning is
    also more computationally expensive in both time and compute power (that is, higher
    cost).


    However, if the IoT data flow includes a large number of features and hundreds
    of thousands to millions of labeled training data is available, deep learning
    techniques may be able to provide a significant boost in predictive power. This
    is clearly the case in autonomous vehicle development. It could also do wonders
    where images are captured as part of the device functionality (static or video).


    Deep learning packages tend to be interacted with best by Python as opposed to
    R. They are also relatively new, so expect documentation and tutorials to be limited.
    This makes them a little more finicky to work with than the prior examples in
    this chapter. You will need more time and expertise to develop deep learning models
    than for more well-trodden ML models, such as random forest.


    Use what method makes the most sense for the individual use case and available
    training data. Consider the effectiveness requirements and see whether using a
    deep learning modeling technique is likely to provide enough boost in accuracy
    to warrant the expense.


    # A Nickel Tour of deep learning


    Deep learning is a big umbrella that covers many projects and neural network configurations
    using a variety of methods. The following chart can give you an idea of the variety
    of architectures available. There is typically a trade-off between the accuracy
    obtainable and required computing time to train the models that has to be considered.
    The right trade-off depends on the use case. The y axis represents accuracy and
    the x axis represents compute requirements:'
  merge: -1
  img_proc: true
