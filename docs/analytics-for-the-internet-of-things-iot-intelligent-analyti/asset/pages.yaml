    \ repairs\nbaseline <- finalOutput$nochange_cumul_impact\n\n# Plot the cost curve\n\
    par(mfrow = c(2,1))\nplot(row(finalOutput)[,1],\n     finalOutput$glm_cumul_impact,\n\
    \     type = \"l\",\n     lwd = 3,\n     main = paste(\"Net Costs: Proactive Repair\
    \ Cost of $\",\nproactive_repair_cost, \", Failure cost $\", failure_repair_cost,\
    \ sep = \"\"),\n     ylim = c(min(finalOutput$glm_cumul_impact) - 100,\n     \
    \         max(finalOutput$glm_cumul_impact) + 100),\n     xlab = \"Percent of\
    \ Population\",\n     ylab = \"Net Cost ($) / Unit\")\n\n# Plot the cost difference\
    \ of proactive repair program and a 'do nothing' approach\nplot(row(finalOutput)[,1],\n\
    \     baseline - finalOutput$glm_cumul_impact,\n     type = \"l\",\n     lwd =\
    \ 3,\n     col = \"black\",\n     main = paste(\"Savings: Proactive Repair Cost\
    \ of $\",\nproactive_repair_cost, \", Failure cost $\", failure_repair_cost,sep\
    \ = \"\"),\n     ylim = c(min(baseline - finalOutput$glm_cumul_impact) - 100,\n\
    \              max(baseline - finalOutput$glm_cumul_impact) + 100),\n     xlab\
    \ = \"% of Population\",\n     ylab = \"Savings ($) / Unit\")\nabline(h=0,col=\"\
    gray\")\n```"
