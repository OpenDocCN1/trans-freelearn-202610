- pgno: 323
  md: '# # Managing data lakes


    Data lakes are places used to dump tons of potentially valuable data from multiple
    sources. Some sources will be IoT devices, while some sources will be internal
    company data such as production, purchasing, or customer service records. The
    concept is to put all of this variety of data in one place so it can be accessible
    through a unified interface. In the case of Hadoop, the data lake would be stored
    in HDFS and probably accessed through Hive or Spark.


    # # When data lakes turn into data swamps


    Swamps are formed when water flows into an area where it collects and stagnates.
    Algae covers over the water. When a data lake has a mass of raw data flowing in
    but no organization and little usage of it to mix up the waters, it becomes what
    is facetiously referred to as a data swamp.


    This often happens when the decision is made to copy data from many systems into
    one area, such as HDFS, without any changes to it. Analysts can find it difficult
    to access due to security restrictions. Even when they do have access it, they
    find it difficult to make sense of the plethora of (typically) relational tables,
    with no instruction key on what the ID field codes mean or what business logic
    should be used when working with the data.


    They often give up in frustration. In such a case, a huge amount of potentially
    valuable data festers, unused, eating up storage space and money.


    # # Data refineries


    Well functioning data lakes are not actually uniform pools of data water. They
    are more like a system of petroleum refineries. In a petroleum refinery system,
    the raw West Texas Intermediate crude flows in by pipeline or supertanker into
    several different refineries. The refineries then process it into several different
    refined petroleum-based products, from gasoline to petroleum jelly and even animal
    feed.


    Sometimes, the results of one refinery are an input into another refinery, which
    further processes and combines it with other refined products. Not to take the
    analogy too far, but nobody takes the crude oil out of the ground and puts it
    in their gas tank.'
  merge: -1
  img_proc: true
- pgno: 324
  md: 'A very similar process happens with data refineries. Nobody uses the raw crude
    data; they use the high-value processed and finished products. The following diagram
    demonstrates the concept:


    ![](img/9f2a55db1236f995dcd9392acbc82910_324_0.png)


    Data refineries operating inside your data lake


    # Developing a progression process


    Data science is all about experimentation. IoT analytics has great potential.
    However, no one is certain of how it will develop. Put them both together and
    an enormous amount of experimentation should be expected. To keep this from becoming
    an impossible-to-manage mess, there needs to be a way to progress ad hoc datasets
    from early development into repeatable and stable data products.'
  merge: -1
  img_proc: true
- pgno: 325
  md: 'Setting up a progression process will help manage this. Data science is highly
    iterative, which makes it difficult to find a clear point that signals a change
    in state, as with normal database development projects.


    A way to handle this is by setting up regular review periods where a team determines
    which datasets are ready to progress to the next stage of development. Decide
    how often this should happen, define the stages and the corresponding requirements
    for each, all based on your unique situation.


    We will review a suggested progression path that you can tailor to the needs of
    your unique IoT analytics environment.


    Segment your data lake into three general areas:


    +   - **Sandbox:** A data scientist has full access to read and write in this
    area. They may have a sandbox to themselves in addition to one for the team. This
    is for initial experimentation and model development.

    +   - **Mature:** A data scientist has full access to this area but does not have
    their own mature environment, the team shares it. All code and scripts used to
    generate datasets kept in this area should be under source code control.

    +   - **Production:** A data scientist has full read access but no write capability.
    Datasets in this area have been fully tested, code and scripts used to generate
    datasets are under source code control, and a change control process is in place.


    The suggested progression process to move datasets between areas is here:


    +   - **Establish a regular recurring review of your datasets:** This could be
    every month, every quarter, or semi-annually. Use whichever makes the most sense
    for how quickly your IoT analytics is developing. But the review should be regular
    and enforced. It is too easy to delay due to the small iterations that occur with
    analytics. Avoid this trap and force your team to do it.

    +   - **Review the datasets in all three areas for any that should be deleted:**
    These could be development datasets that never made it far, or old versions of
    ones that are now in production. Take a cue from Java and have a regular garbage
    collection event to keep your data lake optimized.

    +   - **Review Sandbox datasets that are ready to move to the Mature area:** These
    are the ones that are either project specific and ready for team testing, or are
    useful to the team for their general work. The latter should be set up as regularly
    recurring and scheduled jobs to build the datasets. This type of datasets will
    help accelerate many projects in the future.'
  merge: -1
  img_proc: true
- pgno: 326
  md: '+   - **Review Mature datasets for ones that are ready to move to Production**:
    These are typically more project-specific and have passed all the testing. Once
    it is moved into production, future changes should be minimal. At this point,
    control of the dataset should be handed over to a separate group to maintain and
    provide service-level support.


    # The data retention strategy


    Even big data eventually gets too big and costly to maintain. Remembering the
    goal of minimizing costs while still maximizing value, make sure to develop a
    retention strategy for IoT data. Data could be simply deleted after it is retained
    for a certain amount of time. However, by doing this, you could miss out on building
    a future profitable analytics service that was not thought of before the data
    was thrown away.


    There are other options that allow you to retain value of the data while minimizing
    the costs. We will discuss some of these next.


    # Goals


    The goals of a retention strategy for IoT analytics are twofold:


    +   - **Maintain Value**: Advanced modeling techniques, such as deep learning,
    need lots of history to maximize prediction effectiveness. It is also difficult
    to know ahead of time which fields will be valuable for a future unknown project.
    The traditional data retention strategies of storing records for a fixed period
    of time and then deleting the full dataset could result in lost profitable opportunities.
    A different mindset is needed.

    +   - **Minimize Costs**: IoT data can get big quickly. Even with cloud-based
    HDFS storage, costs can get large. Keeping everything forever could easily cost
    more than the value it provides. The more accessible data is, the more costly
    it becomes. There should be some compromises to keep your costs low.


    # Retention strategies for IoT data


    We will cover three strategies to reduce the storage size of data. These can be
    used individually or in combination. We will discuss the pros and cons of each
    and walk through an example retention plan that takes advantage of all three.'
  merge: -1
  img_proc: true
- pgno: 327
  md: '# Reducing accessibility


    You can reduce costs significantly without deleting any data by reducing the relative
    accessibility of the data. We will cover some ways to do this next:


    +   - **Compression**: Compression is your friend. Compressing data leaves you
    with all the information at the (typically) slight penalty of increased time to
    access it. Using compression formats such as Avro and Parquet can significantly
    reduce storage size (and therefore costs) in Hadoop clusters and S3 folders, while
    often improving performance. The performance improvements require some thoughtful
    design of the file format, but are a best practice anyway. HDFS supports other
    compression formats such as GZIP and Snappy as well. This should be the first
    thing you do to reduce the file size. Even better, plan for it as part of the
    initial storage design.

    +   - **Changing the storage technology to lower-cost options**: Keep the data,
    but move to lower-cost methods. There is usually a performance penalty, but this
    can easily be worth it if the data moved is not accessed often. This could be
    a change from SSD-backed storage to hard disk-backed storage. The final step could
    be from hard disk to tape.

    +   - **Changing accessibility service levels**: This method is more geared toward
    cloud storage services and is analogous to changing storage technology (although
    you can do that also in the cloud). For Amazon S3, this could be a change to Standard–Infrequent
    Access level service or to Amazon Glacier for very infrequently accessed data.
    S3 allows automated scheduling of when files should be moved into lower service
    levels based on rules, such as the age of the file.

    +   - **Changing redundancy levels**: HDFS keeps multiple copies of files for
    durability. The standard setting is three copies, but this is configurable. You
    could change the redundancy level for less valuable files and save some costs.
    Amazon S3 also has a reduced redundancy option.


    # Reducing the number of fields


    As you get to know your IoT data, you will find some fields are more valuable
    than others. Through your discoveries using techniques from Chapter 6, Getting
    to Know Your Data - Exploring IoT Data, and Chapter 10, Data Science for IoT Analytics,
    you will find fields (features) that keep coming up as statistically significant,
    and some that just never seem to matter.'
  merge: -1
  img_proc: true
- pgno: 328
  md: 'For older files, you can follow some methods to keep the useful fields, while
    getting rid of the ones that do not seem to have an impact:


    +   - **Transform older data to only keep useful fields**: Move older data to
    either a new file or table but only keep those useful fields. Then, delete the
    old records.

    +   - **Split out useful fields and treat them differently**: For older records,
    you could keep the useful fields in hot areas that are easily accessible, while
    shipping the less useful fields off into cold storage

    +   - **Summarize and remove large data fields such as text or binary files (such
    as image or sound)**: As an example, you could reduce a lengthy free-form text
    field to the count of key word occurrences.


    # Reduce the number of records


    Now, finally, you could simply just delete old records. But wait, there are some
    other options where you can at least retain some possibly useful information.
    Once you delete the history, it is gone for good. The fear should be that you
    will find out later that if you had just kept that data, it could have been used
    to create a more valuable ML model and generated some additional revenue. Some
    other options are listed next:


    +   - **Deleting raw data but keeping the refined versions of it**: After a certain
    amount of time, having both the raw data and the refined version probably does
    not add much value. You can delete older raw data files without losing much value.

    +   - **Summarizing old data**: Instead of deleting the data completely, summarize
    individual records into weekly or monthly summary values. The appropriate summary
    statistic may be an average or a sum, or preferably, an entire set of summary
    statistics. For example, you may want to save the mean, the standard deviation,
    the maximum, the minimum, and the record count. This can reduce thousands of rows
    into one, so it is perfectly fine to have a much wider resulting dataset. You
    will be losing some value in the data, as you will not have full resolution. But
    you are still retaining some informational value in the summary statistics. You
    could even use the statistics to simulate individual records later if you had
    to.

    +   - **Deleting old data**: This should be the final and last option. Remember,
    analytics is built from the data and once that data is gone, the analytics you
    could have done goes with it.'
  merge: -1
  img_proc: true
- pgno: 329
  md: '# The retention strategy example


    We will return to the GPS position data example to set up a retention policy.
    The raw data is landed into an HDFS table and kept uncompressed. A series of data
    refineries transforms the data into cleaned and useful analytical datasets. All
    of the analytical datasets are compressed in Parquet format—still in HDFS.


    Upon the review of the raw data, it was determined that any problems in the initial
    transformation are typically discovered within a week. No problems were found
    more than a month later. Due to this, the raw data was retained for the latest
    month, and then moved into S3 Standard. In S3, a ruleset was created to move the
    data into Standard-Infrequent Access after another month, and then into Amazon
    Glacier a month after it. After another three months, the data is scheduled to
    be deleted from Amazon Glacier.


    After several months of statistical analysis and modeling, several key fields
    were identified in each analytical dataset. It was also discovered that data records
    from more than two years prior were rarely accessed. Records from more than three
    years prior were never accessed.


    The data from two years prior was moved out of HDFS into S3 Standard. Data between
    two and three years old was transformed to only keep the key fields. The older
    data is moved to Amazon Glacier. After four years, the data is summarized at a
    daily aggregation with metrics on record counts, starting, ending, and average
    position for each device along with distance traveled and the travel time. This
    data is kept in S3 Standard as it is 10,000 times smaller in size. The full data
    is then removed.


    # Summary


    In this chapter, we reviewed how to increase data scientist productivity by reducing
    time spent manipulating data. The concept of LAD was introduced, along with a
    process to build them.


    Concepts to help prevent data lakes from turning into a data swamp was discussed.
    Changing perspectives from a data lake to a series of active refineries and production
    chains helps to plan for a useful data storage area.


    Strategies for data retention were also reviewed. Consider the twin goals of maximizing
    value while minimizing costs when designing a retention strategy. In the next
    chapter, we will discuss the economics of IoT analytics. The chapter covers ways
    to look for business value in the data along with a detailed predictive maintenance
    example.'
  merge: -1
  img_proc: true
- pgno: 330
  md: '# # The Economics of IoT Analytics


    You sit in your office staring out the window at the building across the street.
    You feel the tap, tap, tap of your pen against your forehead as you fiddle with
    it lost in thought. Your boss left your office twenty minutes ago.


    "We need a predictive maintenance program," he had said, "but it can''t lose money!
    We need more revenue coming in. But I don''t want you wasting your time on analytics
    that won''t make us money."


    You agreed and nodded your head with a thoughtful smile firmly held on your face.
    You know how to think about analytics but not necessarily how to look at it from
    a revenue and cost perspective.


    "And I want you to keep trying new things! Let''s keep up the experimentation.
    You are doing great! Just don''t lose money," he continued.


    *Okay, sure,* you think. *How do I do that?*


    This chapter will explain how to think about a business case for IoT analytics
    projects. It discusses ways to optimize the return on investment by minimizing
    costs and increasing the opportunity for revenue streams.


    The costs and benefits of the business case can and should be worked directly
    into the IoT analytics process. By doing this, the methods can not only have good
    predictive value but can also be optimized for producing profitable services.


    We will also review ways to apply analytics to maximize value with an example
    case of predictive maintenance. Predictive maintenance is a common application
    of IoT analytics and can lower costs if applied in such a way that the savings
    outweigh the costs.'
  merge: -1
  img_proc: true
- pgno: 331
  md: 'In this chapter, we will cover the following topics:


    +   - The economics of cloud computing and open source:

    +     - Variable versus fixed costs

    +     - The option to quit

    +     - Cloud costs can escalate

    +     - Open source software considerations

    +   - Thinking about revenue opportunities:

    +     - The extensions of current business practices

    +     - New services

    +   - The economics of predictive maintenance:

    +     - Valuation formula

    +     - The R code to calculate cost curve for the **machine learning (ML)** model
    implementation


    # The economics of cloud computing and open source


    At first glance, it may seem like cloud computing should be valued in the same
    way as on-premises systems. It may also seem that open source solutions always
    make the most sense as there are no license fees. It is free, right?


    We will walk through some ways to think about valuing cloud computing and open
    source software for IoT analytics. Like most things, it is more complicated than
    it seems at first.


    # Variable versus fixed costs


    Variable costs expand and contract with the amount of usage. Examples are automotive
    production parts for assembling vehicles, fuel in transportation, and cloud services.
    Fixed costs are constant no matter the amount of usage needed. Examples are data
    centers, rack servers, and equipment (or cloud environment) management.'
  merge: -1
  img_proc: true
- pgno: 332
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 333
  md: 'An option to quit has value and should be included when making a business case
    for IoT analytics. At the point an IoT analytics project is determined not to
    be viable, all costs can be terminated immediately. The following diagram illustrates
    this situation:


    ![](img/9f2a55db1236f995dcd9392acbc82910_333_0.png)


    Cloud IoT analytics variable costs with option to quit


    # Cloud costs can escalate quickly


    This is not all sunshine and roses though, as cloud services costs can escalate
    quickly if not well designed and closely monitored. If an IoT analytics project
    is designed with cloud services that call other cloud services more frequently
    than needed, the effect can be dramatic.


    For example, consider an AWS Lambda function that checks the stored status of
    all IoT devices on Amazon IoT Hub using a message queue service. A web developer
    creates a user interface that calls this function every time a page loads or is
    refreshed. All three of the services will generate charges each time the function
    is called. Costs can escalate quicker than anticipated. A better design would
    be to set up a schedule for the AWS Lambda function to run every few minutes and
    store the results in a cached reference for the web interface to use.'
  merge: -1
  img_proc: true
- pgno: 334
  md: 'If an IoT analytics application is created that does not scale both up and
    down, this can get expensive too. If the compute requirements are designed to
    meet maximum expected need instead of scaling as needed, you will be paying for
    unneeded capacity.


    # Monitoring cloud billing closely


    Most cloud infrastructure services, including AWS, provide a way to set up rules
    to alert you if costs are over a certain threshold. The rules can be set for hourly,
    daily, or monthly basis. These should be set up right away so that you know immediately
    if costs are more than expected.


    # Open source economics


    Open source software, such as R or Python, is low cost but not really free in
    practice. There are expenses that need to be considered for any IoT analytics
    business case where open source software components are used.


    # Intellectual property considerations


    Not all open source code is licensed for commercial and profit use. You will need
    to check under what type of **Intellectual Property (IP)** license the open source
    code is being offered before you incorporate it into a revenue generating commercial
    project. This will involve some legal fees at minimum to make sure you are in
    compliance with IP requirements. The following diagram shows a subset of open
    source license types:


    ![](img/9f2a55db1236f995dcd9392acbc82910_334_0.png)'
  merge: -1
  img_proc: true
- pgno: 335
  md: '# Scale


    Scaling IoT analytics on open source software can produce some challenges. You
    will probably be using R or Python to explore and productionalize your ML modeling
    and many other analytics. Both will scale to the size of a single compute instance.
    For example, R keeps everything in memory so the limitation is the size of memory
    on that instance.


    Neither of the programming languages is natively distributed (not many are), so
    to scale beyond a single compute instance, you need to employ additional frameworks
    and design complications. This is one of the benefits of using Apache Spark. If
    you can do your analytics in a parallel fashion, you can use Spark to manage the
    distributed computations. This is the same map and reduce concept introduced in
    Chapter 5, Collecting All That Data - Strategies and Techniques.


    With Spark, the Python code can be passed as a distributed job with results collected
    into a data frame. All library packages required for the code must be present
    on each node in the cluster however. To do this efficiently, you will need a package
    manager. The company Continuum offers a package manager called Anaconda Scale
    (https://docs.continuum.io/anaconda-scale/) for example. Package management software
    adds some costs, which should be included in your business case.


    The same concept can be achieved with R using the SparkR package. Again, a package
    manager should be used to install and manage libraries across the cluster.


    # Support


    Open source software is free...and without warranty or support. If there is a
    problem, you will need to fix it. Most likely, you will not have the skill set
    on your team to correct complicated problems. There are several companies that
    offer technical support for open source software. Some even provide a supported
    version of open software, but for a fee, of course.


    An example is Revolution Analytics, which is now owned by Microsoft. It offers
    a supported version of the R open source software. There is a support and licensing
    fee associated with it.


    In general, if you have open source code that you are dependent on to run revenue
    generating business, you will need support for when things go wrong. Either you
    will need to hire the skill set, or you should contract with a company that specializes
    in this support. These costs should be considered for any business case.'
  merge: -1
  img_proc: true
