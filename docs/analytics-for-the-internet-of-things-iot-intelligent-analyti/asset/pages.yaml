- pgno: 352
  md: 'We discussed the many challenges with IoT data. It is notoriously messy, and
    will often have missing and incorrect values. In Chapter 1, Defining IoT Analytics
    and Challenges, we reviewed problems with data quality, problems related to time,
    problems related to spatial position, and analytic challenges that are more pronounced
    with IoT data.


    Understanding the limitations of IoT devices and the various communication protocols
    associated with them will help you greatly when using the resulting data for analytics.
    In Chapter 2, IoT Devices and Networking Protocols, an introductory overview was
    provided along with some benefits and drawbacks for each communication architecture.


    Collecting and processing IoT data is challenging due to the scale and the uncertainty
    of how it will be used. Even anticipating what business opportunities will be
    found through analysis of it is difficult. In Chapter 3, IoT Analytics for the
    Cloud, the benefits of using cloud architecture was introduced, along with some
    key cloud service provides for IoT-related analytics.


    A walkthrough on how to create a secure cloud environment for analytics was covered
    in Chapter 4, Creating an AWS Cloud Analytics Environment. Big data technologies
    to store and process large volumes of IoT data were reviewed in Chapter 5, Collecting
    All That Data - Strategies and Techniques.


    In short, we covered the following recommendations:


    +   - IoT data is big and messy, expect it.

    +   - Know your devices and know how the data is transported.

    +   - Store and process IoT data in an environment that can grow and shrink as
    needed. Cloud services fit the bill.

    +   - Use big data technology, so your solution on a small scale needs few changes
    to function on a large scale.'
  merge: -1
  img_proc: true
- pgno: 353
  md: '# IoT exploratory analytics


    Exploring your data, combining it with external data (such as maps), and using
    visualization to communicate your findings can have a dramatic impact. The following
    image was created by John Snow in the late 19th century to demonstrate his analysis
    of Cholera illness data, which found that the 1854 Cholera epidemic was linked
    to water sources. This led to a better understanding of the causes of the disease,
    saving hundreds of thousands of lives.


    ![](img/9f2a55db1236f995dcd9392acbc82910_353_0.png)


    John Snow Cholera map. Source: Center for Disease Control


    Once the IoT data has been collected in a centralized place, you need to explore
    it to understand the data and learn its patterns. In Chapter 6, Getting to Know
    Your Data - Exploring IoT Data, you learned how to use Tableau to quickly understand
    your data, find problems, and view it on a map. This also starts the hunt for
    features that could have predictive value to use in data science techniques.


    Adding external data can greatly enhance the potential value of analytics. We
    discussed several sources for value-enhancing data including geographic, economic,
    and demographic datasets in Chapter 7, Decorating Your Data - Adding External
    Datasets to Innovate.'
  merge: -1
  img_proc: true
