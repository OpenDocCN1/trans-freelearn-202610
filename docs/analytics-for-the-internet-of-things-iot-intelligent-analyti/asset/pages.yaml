- pgno: 39
  md: '# Business value concerns


    Many companies are struggling to find value with IoT data. The costs to store,
    process, and analyze IoT data can grow quickly. With future financial returns
    uncertain, some companies are questioning if it is worth the investment.


    According to McKinsey & Company, a consulting agency, most IoT data is not used.
    From their research, less than 1% of data generated by an oil platform was used
    for decision-making purposes.


    Finding value with IoT analytics is often like finding a diamond in a mountain
    of rubble. We can accept that 1% of the data has value, but which 1% is it? This
    can vary depending on the question. One man''s worthless granite is another man''s
    priceless diamond.


    The business value challenge is how to keep costs low while increasing the ability
    to create superior financial returns. Analytics is a great way to get there.


    # Summary


    In this chapter, we defined, for the purposes of this book, what constitutes the
    IoT. We also defined what is meant by the term analytics when we use it here.
    We discussed special challenges that come with IoT data from volume of data to
    issues with time and space that are not normally a concern with internal company
    datasets. You should have a good idea of the scope of the book and the challenges
    that you will learn to overcome in the later chapters.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# 2


    # IoT Devices and Networking Protocols


    You have started your analysis and found that your IoT data is not always complete.
    You also suspect it is not always accurate. But you have no idea why that would
    be the case. You get several hundred records a day on average from each device.


    The IoT devices your company makes are attached to freight trailers and track
    location, and sometimes even temperature. The temperature is monitored when the
    trailer is a refrigerated unit, called a *reefer* in the industry. The inside
    temperature of a reefer must be kept in a certain range depending on what is being
    transported.


    Your device is located on the outside of the trailer with a lead line into the
    trailer to read temperature if the option is enabled. The trailer is pulled around
    by big rig trucks over roads all over the country.


    You have been so focused on finding value in the data, you never thought about
    how it was captured and communicated to your company’s servers. Now that you are
    thinking about it, you wonder about the problems you see in the data. You had
    assumed it was occurring randomly, but if this is not the case. A little tingle
    of fear creeps down your spine. It would affect much of the analysis you have
    already done, the analysis that the company is using to make business decisions.


    This chapter will provide an overview of the variety of IoT devices and networking
    protocols. We will also cover the business need they are trying to solve. By the
    end of the chapter, you will understand the what and the why of the major categories
    of devices and networking protocol strategies.'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'This chapter covers the following topics:


    +   - The range of IoT devices along with some example use cases

    +   - Common IoT networking protocols

    +   - Common IoT data messaging protocols

    +   - The advantages/disadvantages of different device and network protocol strategies

    +   - How to analyze the data to infer protocol and device characteristics


    # IoT devices


    There is a wide variety of IoT devices in use today. The range of designs and
    ingenuity in function is expanding at a furious pace. The scope of what is being
    measured, monitored, and tracked would be an entire book in itself. And it is,
    as you can find several through the publisher of this book.


    # The wild world of IoT devices


    For analytics purposes, it is helpful to understand the variety of devices and
    how they are being used. Ideas from one industry can cross-pollinate into another
    and create unexpected value. The combination of devices and use cases can also
    present very different analytics opportunities and challenges.


    # Healthcare


    Patients in acute care are having their vital signs monitored by low-power wireless
    sensors where the data can be analyzed remotely. There are several startups, such
    as Proteus Digital Health, that are developing pill-sized ingestible sensors.
    Proteus makes a digestible sensor pill that, in combination with a sensor patch
    worn on skin, monitors when and how often patients are taking their pills.


    # Manufacturing


    Tracking and analyzing data from monitoring sensors in manufacturing plants has
    a long history. There is a whole subset of media dedicated to this realm, commonly
    referred to as the Industrial Internet of Things (IIoT) or Industry 4.0. A wide
    variety of manufacturing industries are implementing IoT devices and sensors.'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'Ergon Refining has a facility in Mississippi that connects multiple sensor
    units such as vibration, acoustic, and position sensors to a central system that
    monitors and analyzes the data.


    Emerson Process Management makes wirelessly-monitored Enardo 2000 emergency pressure
    relief vents (EPRVs). There are hundreds of steam trap monitoring and pressuring
    relief vents in many process plants. Monitoring them with inexpensive sensing
    capabilities can provide value by avoiding unplanned downtime due to faulty equipment.


    # Transportation and logistics


    Geotab builds GPS tracking devices that logistics providers can attach to their
    vehicles to monitor and analyze routes, fuel economy, and detect accidents. These
    devices are referred to in the industry as **telematics** devices. Customers can
    create geofences on a map to receive notifications when a vehicle enters or exits
    the area.


    Devices can monitor driver behavior and send reports of speeding or harsh braking
    to the home office. They also read any fault codes reported by the vehicle and
    transmit the information instantly to fleet managers, so problems can be addressed
    before a major breakdown occurs. The following image shows an example of a telematics
    device, the GO7:


    ![](img/9f2a55db1236f995dcd9392acbc82910_42_0.png)


    Geotab GO7 telematics device. Source: Geotab'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# Retail


    Using its cell network and beacons in specific stores, Turkcell in Turkey along
    with its partners, provides customers in its loyalty program with in-store promotions
    when they are near certain retailers.


    Many retail chains use Radio Frequency Identification (RFID) tags and sensors
    to optimize stocking and monitor movements inside warehouses.


    Extreme Networks is partnering with the New England Patriots and their home stadium
    to monitor visitor traffic patterns. The stadium uses the data to understand where
    customers gather and price advertisements and product placements appropriately
    using traffic heat maps generated from the IoT sensor data.


    # Oil and gas


    One of the earliest pioneers in what is now called the IoT is the oil and gas
    industry. With advances in the IoT technology, oil wells can more easily connect
    sensors located throughout the well. Data readings can also be sampled more frequently,
    every 30 seconds as an example.


    In combination with edge analytics on sensor data, companies can do things such
    as optimize the oil well plunger lift cycle. As reported in an Intel industry
    article, this can increase the production up to 30 percent. Edge analytics refers
    to applied analytics that operate either on the device itself or at a nearby device
    that supports a hub of units. The analytic processing occurs at multiple locations
    at the boundary of the network or the edge, versus occurring at a centralized
    location.


    The same information is used by companies to optimize their asset portfolio management.
    They can reuse the data to rank wells by production efficiency.


    # Home automation or monitoring


    Ecobee Smart Wi-Fi thermostats connect with battery operated wireless sensors
    placed in different rooms throughout a home. It tracks not only Heating Ventilation
    and Air Conditioning (HVAC) but temperatures reported by each sensor. It can not
    only balance temperatures in the rooms, but it can also notify you when the furnace
    is not behaving properly.'
  merge: -1
  img_proc: true
