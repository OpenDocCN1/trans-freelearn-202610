- pgno: 137
  md: '# 5


    # Collecting All That Data - Strategies and Techniques


    You stare at your drawing of the IoT device hanging on the wall of your cubicle,
    lost in thought on the ways you might manipulate the data to squeeze out game
    changing insights. You can almost hear your colleagues cheer as you accept the
    Executive Award for best project of the year and the huge bonus that goes with
    it.


    "Ahem!" someone coughs behind you. You almost jump out of your chair.


    Your boss has sidled up to your cubicle. He looks both cheerful and amused. You
    are a little concerned at the amused part.


    "You did an excellent job selling them on using the cloud for analytics, and they
    are fully on board and want to start immediately," he says with a big grin. You
    perk up, as this is great news.


    "You did so well," he continues with a smirk, "that they want to double the data
    capture rate on the next generation of devices. They figure the cost will not
    change much if it is routed through cloud infrastructure. And since capacity restraints
    won''t be an issue anymore, they want the monthly reports on a weekly schedule
    now. And several of the executives in other departments were very excited and
    want their own people to be able to use the data as well. Good work!"


    He walks off chuckling to himself. You are, at the same time, happy at the outcome
    and bewildered about how to deliver on their expectations. How do you store the
    data in a way others can interact with it? And you are certain there will be a
    much broader set of questions that will need to be answered now, especially when
    other departments have people looking at the data as well. Whatever you do has
    to be able to handle huge scale with lots of flexibility.'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'This chapter is about strategies to collect IoT data in order to enable analytics.
    There are many options to store IoT data for analytics. We will review a common
    technology in the field, Hadoop, along with how to use Amazon S3 as a big data
    store. The chapter also describes when and why to use Spark for data processing.
    We will discuss tradeoffs between streaming and batch processing. Building flexibility
    into data processing in order to allow integration of future analytics will also
    be reviewed.


    The chapter covers the following topics:


    +   - Designing data processing for analytics

    +   - Applying big data technology to storage

    +   - Apache Spark for data processing

    +   - Handling change


    # Designing data processing for analytics


    There are some key cloud services that are likely to be employed in your IoT data
    processing environment. Both AWS and Microsoft Azure have IoT-specific services
    that we will review. There are also services that support data processing and
    transformation that are worth a review to increase your familiarity with them.


    # Amazon Kinesis


    Amazon Kinesis is a set of services for loading and analyzing streaming data.
    It handles all the underlying compute, storage, and messaging services for you.


    The services in the Kinesis family are as follows:


    +   - **Amazon Kinesis Firehose**: This enables loading of massive volumes of
    streaming data into AWS.

    +   - **Amazon Kinesis Streams**: This service allows you to create custom applications
    to process and analyze streaming data in real time. There are two ends to each
    stream; you use the Amazon **Kinesis Producer Library (KPL)** to build the application
    that sends data into the stream. The Amazon **Kinesis Client Library (KCL)** is
    used in the application that reads data from the stream - typically a real-time
    dashboard or rules engine-type application. Stream data can also be directed into
    other AWS services, such as S3 or SQS.'
  merge: -1
  img_proc: true
- pgno: 139
  md: '+   - **Amazon Kinesis Analytics**: This allows you to easily analyze stream
    data with standard SQL. Queries can run continuously, and AWS handles the scaling
    needed to run them automatically.


    # AWS Lambda


    Lambda allows you to run code without provisioning servers. Python, Node.js, C#,
    and Java programming languages are all currently supported. Scale is handled automatically.
    You only pay when your code executes. Everything runs in parallel and your code
    needs to either be stateless or manage state in an external database. The code
    is essentially event-driven since you configure when and under what conditions
    it executes.


    Using a service such as Lambda is often referred to as **serverless computing**
    and opens up a whole new range of possibilities. You could create a fully-functional
    web application with Lambda that has no server behind it. You can create analytic
    code that scales to millions of device events without ever having to worry about
    managing a server. The following diagram gives an overview of how it works in
    practice:


    ![](img/9f2a55db1236f995dcd9392acbc82910_139_0.png)


    # AWS Athena


    Athena is a new service launched in late 2016 and operates over the data stored
    in S3. It allows you to query datasets using ANSI SQL. No data needs to be loaded
    into Athena; it queries directly against the raw files in it. This allows you
    to analyze large amounts of data without any **Extract, Transform, and Load (ETL)**
    to load it into a data analysis system. There are no clusters or data warehouses
    to manage. You pay for the amount of data scanned, which means you can compress
    it to lower costs.'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'Combine this with Lambda and you could have yourself a fairly decent low-cost
    big data solution. Store raw IoT files in S3 and schedule a Lambda job to periodically
    transform new data into an analysis-ready dataset - also in S3. Use SQL in Athena
    to analyze. You can do all this without worrying about servers, clusters, scaling,
    or managing complicated ETL.


    # The AWS IoT platform


    The AWS IoT platform handles data messaging and security for communications between
    connected IoT devices and your AWS environment. It can support billions of devices
    and trillions of messages.


    MQTT, HTTP, and WebSockets protocols are also supported. It provides authentication
    and encryption services for communications. All AWS services can be used to process,
    analyze, and make decisions on IoT data. The communication can be both ways.


    **Device shadows** are used to store the latest state information on each IoT
    device. This makes it appear to applications that the device is always available,
    so commands can be given and values read without waiting for the device to be
    connected. The device shadow will sync with the IoT device when the device connects.


    The AWS IoT device SDK is installed on the remote IoT device to handle communications.
    Registration and authentication services are handled in the AWS IoT platform.
    A rules engine can direct messages to other AWS services, such as Lambda, when
    certain conditions are met (such as `[device temperature < 0 degrees Celsius]`).


    ![](img/9f2a55db1236f995dcd9392acbc82910_140_0.png)


    Basic overview of AWS IoT platform. Source: Amazon Web Services'
  merge: -1
  img_proc: true
- pgno: 141
  md: '**AWS Greengrass** is a new product in the IoT family, which was in the preview
    stage at the time of writing. It allows simplified edge analytics. This makes
    it exciting for the IoT analytic possibilities. It is software that is installed
    locally on a device or a nearby device hub. It can automatically handle buffering
    event data when the device is not connected. It also, and this is the exciting
    part, supports the same Lambda functions as the AWS cloud. You can build and test
    the functions in your AWS environment and then move them with minimal effort to
    operate at the edge using Greengrass.


    # Microsoft Azure IoT Hub


    Azure IoT Hub is a managed service for bidirectional communications between the
    Azure backend and IoT devices. Millions of devices can operate on the IoT Hub;
    the service can scale as needed. Communications can be one-way messaging, file
    transfer, and request-reply methods. It integrates with other Azure services.


    ![](img/9f2a55db1236f995dcd9392acbc82910_141_0.png)


    Example Azure IoT Hub solution architecture. Image source: Microsoft Azure'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'Azure IoT Hub has some key features, which give some insight into how it works:


    +   - **Authentication and connectivity security:** Each device is provisioned
    with its own security key that allows it to connect to IoT Hub. Identities and
    keys are stored in the IoT Hub identity registry.

    +   - **Device twins:** These are JSON documents that store state information
    such as configuration and parameter values. It is stored in the cloud and persists
    for each device connected to the IoT Hub. A twin allows you to store, synchronize,
    and query device data even if the device is offline.

    +   - **Connectivity monitoring:** Here, you can receive detailed logs on identity
    management and connectivity events for your devices.

    +   - **The IoT protocols support:** MQTT, HTTP, and AMQP protocols are supported
    by Azure IoT device SDKs that you would install on your IoT device. They are also
    supported through an exposed public protocol in the event you cannot use the SDK
    on your device.

    +   - **IoT protocol extensibility:** You can support custom protocols by either
    of the following:

    +     - **Creating a field gateway:** You can use the Azure IoT gateway SDK to
    convert your custom protocol to one of the three protocols understood by IoT Hub.

    +     - **Customizing the Azure IoT protocol gateway:** This runs in the Azure
    cloud and is an open source component.

    +   - **Scale:** Millions of devices can be connected at the same time with millions
    of events per second flowing through the hub.


    # # Applying big data technology to storage


    With IoT data flooding into your cloud environment and after processing and transforming
    it, the next problem to solve is how to store it. The solution should support
    holding large datasets and be easy to interact with for analytics.


    # ## Hadoop


    Hadoop is an open source effort that falls under the umbrella of the Apache Software
    Foundation. As defined by the official project documentation, *The Apache Hadoop
    project develops open source software for reliable, scalable, distributed computing.*
    Hadoop is available for free in its pure open source form.'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'Unless you have some Hadoop experts on your team, you should opt for one of
    the managed Hadoop distributions. This will give you a level of troubleshooting
    support and implementation advice. Cloudera and Hortonworks are two main providers
    of managed distributions and support. Amazon AWS and Microsoft Azure both have
    their own Hadoop managed services, EMR and HDInsights respectively.


    Hadoop is a little difficult to describe at first blush. It is commonly referred
    to in most media articles as if it was a new data warehouse program that you simply
    install and go forth to tossing in tons and tons of data. This is an oversimplified
    view as it is much more of an ecosystem of related projects than any one thing.


    Some components rely on other components and some can operate independently. Some
    have the role of data storage, some of data processing, and some of resource management.
    Some are even debatable whether they belong in the Hadoop category or if they
    should have their own.


    Reviewing them all in a single chapter would make your head spin, so we will focus
    on the key ones for IoT analytics. The following picture gives an idea of the
    number of projects in the ecosystem. It shows all of the Hadoop components included
    in the Hortonworks managed distribution (version 2.5). We will leave out most
    of the resource management, security, and developer-focused components, such as
    Zookeeper, Knox, and Pig:


    ![](img/9f2a55db1236f995dcd9392acbc82910_143_0.png)


    Hortonworks Data Platform (HDP) ecosystem. Source: Hortonworks'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'The Hadoop components are designed to operate distributed across multiple servers.
    One cluster could have thousands of separate servers. It is fault tolerant, server
    failures are expected by design, and adding or removing servers can be done while
    the cluster is up and operating normally.


    It can be helpful, from the viewpoint of analytics, to think of the Hadoop ecosystem
    as four interconnected but loosely coupled services. These services communicate
    with each other but handle their roles for the most part completely independently.
    A high-level view of this is shown in the following diagram:


    ![](img/9f2a55db1236f995dcd9392acbc82910_144_0.png)


    Analysis Interaction


    Execution Engine


    Resource Allocation


    Data Storage


    Big Data Guy


    Analytic queries/jobs


    Adding or retrieving data files'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'These four services in our conceptual view are as follows:


    +   - **Analysis interactions**: This is where you will spend most of your time.
    It is where you write and submit code, SQL, or link up a visualization tool. Components
    in this area take higher-level instructions and break them up into lower-level
    processing steps for the execution. They abstract away a lot of the messy details
    for you. Hive and SparkContexts are examples.

    +   - **Execution engines**: You should understand how components in this area
    work, but it is unlikely that you will directly interact with them. Apache MapReduce
    and Tez are examples. These services handle how and in what order the processing
    steps will be executed.

    +   - **Resource allocations**: This is important to understand for optimization
    purposes. Here is where each node is monitored and work is allocated. YARN is
    the key player.

    +   - **Data storage**: This area handles the organization and storage of data
    files. You will interact directly here, and it is important to understand what
    happens in these services and how they work. HDFS and S3 are the examples. File
    formatting and types are also important, as this directly impacts the flexibility
    and efficiency in the analysis interaction services.


    # Hadoop cluster architectures


    Next, we will review the node types that make up a Hadoop cluster, what role they
    play, and how they integrate to ensure the cluster is a functioning unit. Servers
    in the same cluster communicate frequently with each other; they are very chatty.


    Most cluster configurations keep the physical units close to each other (in networking
    terms) to minimize bandwidth bottlenecks. The managed cloud-based distributions
    of Hadoop handle this for you on the setup. But if you decide to go the route
    of manually creating your own cluster, you will need to keep networking considerations
    on top of mind when designing the architecture.'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# Getting to know Linux


    ![](img/9f2a55db1236f995dcd9392acbc82910_146_0.png)


    Linux is ubiquitous in big data computing clusters. Since it is open source, licensing
    costs are minimal to nonexistent. It has lower system overhead than **Operating
    Systems (OS)** such as Windows. This makes it ideal for cluster computing where
    nodes can get into the thousands, each with its own OS. Imagine paying Windows
    licensing fees for a thousand servers.... yikes.


    To put it simply, you *will* need to know how to interact with the Linux OS for
    IoT analytics. It is unavoidable and not so bad once you get used to it. You will
    not need to be an expert, but you will need to know how to find your way around,
    run programs, and do some basic scripting. Brush up on Bash! You''ll get to learn
    what a shebang is (Google it).


    # What is a Node?


    A node is a unit in a cluster that has control of its own amount of CPU and memory
    resources. It also has its own OS. In most implementations of Hadoop, this is
    a single server; although it is possible to have more than one node on a physical
    server if each node can control its assigned compute and memory resources (typically
    through virtualization).


    # Node types


    A Hadoop cluster has one **MasterNode** and one to many **slave** nodes. The MasterNode
    operates what is called the **NameNode**. The role of the NameNode is to track
    which other nodes are healthy and some other key information about the cluster,
    such as file locations. There is also the role of the **ResourceManager**, one
    per cluster, which may or may not be on the same server. You will learn more about
    the NameNode in the HDFS section and more about the ResourceManager in the YARN
    section.


    The rest of the machines in the cluster act as both **DataNode** and **NodeManager**.
    These are the workers. This is where, you guessed it, the data is distributed
    and where the distributed computing happens. There are several types of slave
    node that serve different roles for the cluster. Most of them will be referred
    to as data nodes. There can also be slave nodes that are primarily meant to interface
    with the outside network, these are called **edge nodes**.


    Some other services on the cluster, such as Web App Proxy Server and MapReduce
    Job History server, are usually run either on dedicated nodes or on shared nodes–typically
    the edge nodes. The decision on where to place them depends on the load requirements
    of the services sharing the resources of a node.'
  merge: -1
  img_proc: true
- pgno: 147
  md: '# Hadoop Distributed File System


    **Hadoop Distributed File System (HDFS)** is a filesystem spread across multiple
    servers and is designed to run on low-cost commodity hardware. HDFS supports a
    write-once and read many philosophy. It was designed for large-scale batch processing
    work on large to enormous sized files.


    Files are divided up into **blocks**. A typical block size is 128 MB. A file on
    HDFS is sliced up into 128 MB chunks (the blocks) and distributed across different
    data nodes. Files in HDFS normally range from gigabytes to terabytes.


    HDFS was designed for batch processing more than low-latency interactive queries
    from users. HDFS is not meant for files that frequently change with data updates.
    New data is typically appended to files or added in new files. Many small files
    are detrimental to HDFS operations, so files are often combined into a single
    larger file for performance reasons.


    The following diagram shows the general HDFS architecture. The NameNode controls
    file namespace and is the gatekeeper for file operations across the nodes. It
    tracks where file blocks are located and handles client requests for reading and
    update files:


    ![](img/9f2a55db1236f995dcd9392acbc82910_147_0.png)


    HDFS architecture. Source: Apache Software Foundation


    HDFS assumes hardware will fail and files will get lost or corrupted. One of the
    ways it address this is by keeping multiple copies of the file distributed across
    nodes. No single node will have all the copies of a file. The number of copies
    is configurable but the default setting is three. HDFS uses some intelligence
    on determining location and distribution of file blocks to balance fault tolerance
    and performance.'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'If a node fails and file blocks are lost, HDFS automatically generates another
    copy of the blocks from the remaining copies on other nodes to replace them. These
    are distributed across the other normally operating nodes. The NameNode keeps
    track of all these operations. File blocks are also moved around for performance
    optimization purposes. The actual duplication of file blocks is handled by the
    data nodes in communication with each other.


    To get an idea of how this works, we will describe the high-level process of writing
    a file. A client, which could be a command-line prompt on the MasterNode or some
    other software that connects to the cluster, requests a write or read of a file.
    This request goes to the NameNode, which returns the list of node identifiers
    where the file blocks can be retrieved or written to. When a file is written,
    the file blocks are written once by the client request to the nodes in the list.
    Then, the data nodes duplicate it the set number of times by communicating among
    themselves.


    HDFS file commands are very similar to Linux filesystem commands. The following
    example instructs HDFS to take the local file called lots_o_data.csv and distribute
    it across the HDFS cluster in the name space, /user/hadoop/datafolder:


    ```

    hdfs dfs -put lots_o_data.csv /user/hadoop/datafolder/lots_o_data.csv

    ```


    The following example would copy the same file from its distributed form in HDFS
    to the local (non-HDFS single server) file directory:


    ```

    hdfs dgs -get /user/hadoop/datafolder/lots_o_data.csv lots_o_data.csv

    ```


    The NameNode abstracts the true distributed location of the pieces of the file.
    This allows clients to address it with the familiar file folder nomenclature as
    if it was stored in one file on a single drive. The namespace automatically grows
    to incorporate new nodes, which add more storage space.


    Files can be of any type and do not have to be a standard format. You can have
    unstructured files, such as word documents, and also very structured files, such
    as relational database table extracts. HDFS is indifferent to the level of structure
    in the data that resides in the files.


    Many of the tools that interact with HDFS for analysis purposes do rely on structure.
    The structure can be applied as needed just before a file is read, known as schema-on-read.
    It could also be defined within the file itself as it is written. The second is
    what is called schema-on-write.'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'Schema-on-write is how relational databases, such as Oracle or Microsoft SQL
    Server, operate. This is a key thing that differentiates HDFS from traditional
    database systems: HDFS can be used to apply multiple structures to the same dataset
    (schema-on-read). The downside is that the application reading the dataset must
    know and apply the structure in order to use it for analytics. There are some
    open source projects meant to solve this downside for datasets which need a clear
    structure. We will discuss the two major ones next.


    # Parquet


    Apache Parquet is a columnar storage format for data where the structure of the
    data is incorporated into the file. It is available to any project in the Hadoop
    ecosystem and is a key format for analytics. It was designed to meet the goals
    of interoperability, space efficiency, and query efficiency. Parquet files can
    be stored in HDFS as well as non-HDFS filesystems.


    ![](img/9f2a55db1236f995dcd9392acbc82910_149_0.png)


    Parquet logo


    Columnar storage works well for analytics as the data is stored and arranged by
    table columns instead of rows. Analytics use cases typically select multiple columns
    and perform aggregation functions on the values, such as sum, average, or standard
    deviation. When the data is stored in columns, it is both faster and requires
    less disk **Input/Output (I/O)** to read in the requested data.


    The data is typically stored in an ordered form making it easy to grab the needed
    sections and only the data for the selected columns is read. In contrast, a row-oriented
    format typically requires the entire row to be read in order to get to the necessary
    column values. Columnar is great for analytics but not all sunshine and roses;
    it is poor for transactional use cases.


    Parquet is intended to support very efficient compression and encoding schemes.
    It allows different compression schemes for each column in the dataset. It was
    also designed to be extensible by allowing more encoding to be added as they are
    invented.


    A Parquet file is organized into nested components. A **row group** contains all
    data from a division of the dataset; the column data values are guaranteed to
    be stored next to each other to minimize disk I/O requirements.'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'Each dataset of the column values is called a **column chunk**. The column
    chuck is further divided into pages. The tail end of the file and footer stores
    the overall metadata on the file and the column chunks. It is at the end so that
    the write operation that creates the file can be done in one sweep. This is necessary
    since the full metadata is not known until all of the data is processed into the
    file. The following diagram represents the divisions within the Parquet file:


    ![](img/9f2a55db1236f995dcd9392acbc82910_150_0.png)


    The file metadata holds the information necessary to locate and interpret the
    data properly. There are three types of metadata, which match up with the key
    nested components: file metadata, column (chunk) metadata, and page header metadata.
    The following diagram shows the logical relationships of the metadata parts:'
  merge: -1
  img_proc: true
- pgno: 151
  md: '![](img/9f2a55db1236f995dcd9392acbc82910_151_0.png)


    Parquet file metadata detail. Source: Apache Parquet documentation


    The data types are intentionally simple to foster more options in frameworks that
    use it; see the enums box in the previous diagram for the supported types (Type).
    Strings are stored as binary with a ConvertedType set to UTF8.'
  merge: -1
  img_proc: true
- pgno: 152
  md: "The recommended row group size is 512 MB to 1 GB with a larger corresponding\
    \ HDFS file block size of the same setting. This allows an entire row group to\
    \ be read with one file block retrieval. The Parquet file extension is .parq.\n\
    \n# Avro\n\nAvro is an Apache open source data serialization system project. The\
    \ system processes data into a resulting container file that has some useful properties.\
    \ It uses binary data format to keep the file size small and compact. This also\
    \ results in faster read times.\n\n![](img/9f2a55db1236f995dcd9392acbc82910_152_0.png)\n\
    \nThe structure of the data is stored in the file container. Rich data structures\
    \ are supported. Avro file structures, or schemas, are defined using JSON. This\
    \ is a schema-on-write process as far as file creation is concerned. This has\
    \ the benefit of client applications not having to generate code to define the\
    \ data structure. This makes using Avro files for analytics purposes much simpler\
    \ since you do not need to discover and define the file schema in your analytics\
    \ code.\n\nThere are Python and Java libraries that can be used to create and\
    \ read Avro files. Most likely, you will use something such as Hive (discussed\
    \ later in the chapters) to store data into Avro files. Avro supports primitive\
    \ data types of null, boolean, int, long, float, double, bytes, and string. It\
    \ also supports complex data types such as arrays, record, and enums. The following\
    \ is an example JSON schema definition:\n\n```\n```json\n{\n  \"namespace\": \"\
    iotexample.avro\",\n  \"type\": \"record\",\n  \"name\": \"Sensor\",\n  \"fields\"\
    : [\n    {\"name\": \"sensor_id\", \"type\": \"string\"},\n    {\"name\": \"temperature\"\
    , \"type\": [\"double\", \"null\"]},\n    {\"name\": \"recorded_time\", \"type\"\
    : [\"string\", \"null\"]}\n  ]\n}\n```\n```\n\nData records are converted to binary\
    \ during serialization and can also be compressed to reduce size further. The\
    \ file extension for Avro files is .avsc."
  merge: -1
  img_proc: true
- pgno: 153
  md: '# Hive


    We now move on from file storage formats to data processing and retrieval components.
    Apache Hive is a project in the Hadoop ecosystem that fits within the analysis
    interaction area. It allows you to write queries in a SQL-like language, called
    Hive Query Language (HiveQL), which it interprets into processing commands for
    execution over HDFS. HiveQL is very similar to SQL and will be instantly usable
    to any SQL developer.


    Hive architecture consists of a User Interface (UI), a metastore database, a driver,
    a compiler, and an execution engine. These components work together to translate
    a user query into a Directed Acyclic Graph (DAG) of actions that orchestrate execution
    and return results utilizing Hadoop MapReduce (usually) and HDFS.


    ![](img/9f2a55db1236f995dcd9392acbc82910_153_0.png)


    Hive architecture. Source: Apache Hive project documentation


    The UI allows you to submit queries. It also supports other actions such as commands
    to create Hive tables. You will most probably not use it directly. An an IoT analyst,
    you are more likely to interact with it through a web-based interface, such as
    Hue, or through another application that uses a Hive ODBC driver, such as a programming
    IDE or visualization software such as Tableau.'
  merge: -1
  img_proc: true
- pgno: 154
  md: "The **metastore** database holds information about Hive tables. Hive tables\
    \ are very similar to relational database tables where the structure is defined\
    \ ahead of time. Hive tables can be managed by Hive in HDFS or they can be defined\
    \ to point to data files not managed by Hive (called **external tables**). External\
    \ tables are not necessary in HDFS. Amazon S3 is a common example where structured\
    \ files can be stored and still be queryable through Hive as long as a Hive table\
    \ definition has been created for it.\n\nThe metastore database can be housed\
    \ inside the cluster or remotely. If you are creating transient Hadoop clusters\
    \ for temporary use, such as through Microsoft HDInsights, the remote database\
    \ can be useful as the metadata can persist beyond the life of the cluster. This\
    \ allows it to be used by future incarnations of clusters. This is more common\
    \ when Hadoop is being used for batch processing jobs or for a temporary use case,\
    \ such as experimental analytics jobs. Hive metastores can also be used by other\
    \ Hadoop ecosystem projects, such as Spark and Impala.\n\nThe **driver** serves\
    \ as a coordinator. It creates a unique session ID for the query, sends it to\
    \ the compiler for a query plan, and then sends it to the execution engine for\
    \ processing. Finally, it coordinates the fetching of result records.\n\nThe **compiler**\
    \ communicates with the metastore to get information on the tables in the query.\
    \ It checks type and develops an execution plan. The plan takes the form of a\
    \ DAG of steps, which can either be a map or reduce job, a metadata operation,\
    \ or an HDFS operation. The execution plan is passed back to the driver.\n\nThe\
    \ **execution engine** submits actions to the appropriate Hadoop components based\
    \ on the execution plan. During the execution steps, data is stored in temporary\
    \ HDFS files to be used by later steps in the plan. The final results are retrieved\
    \ by the execution engine when the driver sends a fetch request.\n\nHere is an\
    \ example table creation statement:\n\n```\nCREATE TABLE iotsensor (\n       \
    \ sensorid BIGINT,\n        temperature DOUBLE,\n        timeoutc STRING\n)\n\
    STORED AS PARQUET;\n```"
  merge: -1
  img_proc: true
- pgno: 155
  md: 'Hive tables can support partitions and other performance enhancing options.
    Query statements are very similar to SQL, typically not distinguishable for most
    simple queries. This is an example query statement:


    ```

    SELECT stdev_samp (temperature) FROM iotsensor WHERE TO_DATE(timeread) > ''2016-01-01''

    ```


    Here are some tips for using Hive for IoT analytics:


    +   1. **Avoid too many table joins**: Keep less than five tables joined in a
    single query. If this is not possible, break the query up into multiple successive
    queries that build intermediate pieces into temp tables.

    +   2. **Experiment with Hive using execution engines other than Hadoop MapReduce**:
    Hive on Tez and Hive on Spark are two newer implementation projects that promise
    faster, more efficient query processing by minimizing disk I/O and leveraging
    more in-memory processing.

    +   3. **Store data in Parquet files**: The columnar storage better supports the
    types of query commonly run for analytics. File compression can reduce disk space
    requirements for IoT data.


    ![](img/9f2a55db1236f995dcd9392acbc82910_155_0.png)


    # Serialization/Deserialization (SerDe)


    You will see **SerDe** mentioned often in Hadoop-related documentation. SerDe
    is short for Serialization/Deserialization. The serialization and deserialization
    refers to how files are transformed from the saved state into a standardized readable
    format. Serialization is part of creation of the file when writing and deserialization
    happens when a file is read. This allows files to be compressed and structured.
    Metadata about the file contents and data structure can also be saved as part
    of the file.


    It is a way of *abstracting* away the details of decoding a file format from the
    client applications. It also allows multiple different formats to work seamlessly
    in the same environment. Some of these formats can even be invented later and
    it all still works.


    A SerDe in Hadoop would point to the application that handles the encoding and
    decoding of the file. This is often a setting in the hive table creation script
    that will be stored in the metastore and later referenced by a client when reading
    the schema.'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# Hadoop MapReduce


    Hadoop MapReduce is a core component of the Hadoop framework. It is a software
    framework that enables in-parallel processing distributed across nodes in the
    cluster. The topic can get confusing as people tend to refer to the concept of
    MapReduce and the Hadoop component interchangeably, as if they were all one and
    the same.


    The concept of Map and Reduce will be covered in the Spark section later on in
    this chapter. It is not tied to any specific framework or project. You may read
    articles that imply that MapReduce is going away, to be replaced by something
    else. It may not be clearly spelled out (and often it is not), but they are referring
    to the Hadoop component and not to the concept.


    The concept of Map and Reduce is not going anywhere; it has been around for a
    while and is even a key part of many newer distributed processing frameworks.
    We will always refer to the component in this book as Hadoop MapReduce to avoid
    any confusion.


    In the Hadoop component, the MapReduce job normally divides the input dataset
    into independent chunks. The chunks are processed by the map tasks in parallel
    across the nodes. The output of the map tasks is then sorted and is input into
    the reduce tasks. Hadoop MapReduce handles task scheduling, monitoring, and will
    re-execute tasks if they fail.


    Unless you are a professional Java programmer in the big data space, it is unlikely
    you will be interacting with Hadoop MapReduce directly. In analytics, you are
    far more likely to be using other higher level tools, which use Hadoop MapReduce
    under the covers. For this reason, we will not spend much time on this component
    even though it is a core part of the Hadoop ecosystem.


    # Yet Another Resource Negotiator (YARN)


    Despite its whimsical name, YARN is the resource allocation component that most
    Hadoop components rely on. The idea behind YARN was to split resource management
    away from job scheduling and monitoring. In YARN, these are separate processing
    units.


    As represented in the following diagram, there is a single ResourceManager for
    the cluster and ApplicationMaster for each job or set of jobs represented by a
    DAG, which runs on the nodes. The job or DAG of jobs is called an application.
    There is also a NodeManager for each node in the cluster. It is the job of the
    NodeManager to monitor the CPU, disk, memory, and network usage of the container
    on the node where the applications running on it are executed.'
  merge: -1
  img_proc: true
- pgno: 157
  md: '![](img/9f2a55db1236f995dcd9392acbc82910_157_0.png)


    YARN architecture. Source: Apache Software Foundation


    Containers are self-contained environments operating on top of the underlying
    OS; think of it like a system within a system. They allow for consistent operation
    of applications running inside the containers even if the underlying OS configuration
    and software differs between nodes. NodeManager also reports usage information
    back to the ResourceManager.


    The ApplicationMaster has the job of negotiating resources with the ResourceManager
    and operating with NodeManagers to execute and monitor application tasks. The
    ApplicationMaster can interact with containers on different nodes to execute its
    application.


    The ResourceManager handles the scheduling and allocation of resources to the
    running application based on the resource constraints of the various nodes. The
    ResourceManager can also restart individual application masters if there is a
    failure.'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# HBase


    Apache HBase is a distributed, non-relational database built to handle very large
    tables with quick response times. It is a NoSQL type database, which means it
    is non-relational and does not support the full SQL language for query processing.
    It is constructed on top of the Hadoop environment and uses HDFS for data storage.


    However, unlike HDFS, it has very fast response times and is built for random,
    real-time read/write access. It does this trick by putting data into indexed files
    that are then stored in HDFS.


    HBase is useful if you have large (in the realm of hundreds of millions of records
    or higher) datasets and need fast single record lookups.


    # Amazon DynamoDB


    DynamoDB is very similar to HBase in its operation and use cases. It manages underlying
    resources and storage for you, and you pay only for what you use. It is useful
    under many of the same conditions as HBase.


    # Amazon S3


    Amazon S3 is not just a place to dump files. You can use it like a data warehouse
    as it is highly available and extremely fault tolerant. File durability is 99.999999999%
    over the span of a year. S3 is also a Hadoop-compatible filesystem. And you do
    not have to keep three copies of the data as it already has data replication built
    in.


    S3 is not good for data that is updated frequently, but it is great for data that
    is appended frequently. IoT data tends to fall squarely in the latter category
    so S3 works well. Many companies that are advanced in analytics keep large datasets
    in S3 and create temporary Hadoop clusters for processing and analytics. Results
    are then stored, and the temporary Hadoop clusters are terminated to save costs.'
  merge: -1
  img_proc: true
- pgno: 159
  md: '# Apache Spark for data processing


    Apache Spark is a new-ish project (at least in the world of big data, which moves
    at warp speed) that integrates well with Hadoop but does not necessarily require
    Hadoop components to operate. It is a *fast and general engine for large-scale
    data processing* as described on the Spark project team welcome page. The tagline
    of *lightning fast cluster computing* is a little catchier: we like that one better.


    ![](img/9f2a55db1236f995dcd9392acbc82910_159_0.png)


    Apache Spark logo


    # What is Apache Spark?


    Good question, glad you asked. Spark was built for distributed cluster computing,
    so everything scales nicely without any code changes. The word *general* in the
    general engine description is very appropriate for Spark. It refers to the many
    and varied ways you can use it.


    You can use it for ETL data processing, machine learning modeling, graph processing,
    stream data processing, and SQL and structure data processing. It is a boon for
    analytics in a distributed computing world.


    It has APIs for multiple programming languages such as Java, Scala, Python, and
    R. It operates mostly in memory, which is where the speed improvement over Hadoop
    MapReduce mainly comes from. For analytics, Python and R are the popular programming
    languages. When interacting with Spark, you will probably be using Python, as
    it is better supported. The Python API for Spark is called Pyspark.


    The descriptions and architecture discussed in this chapter are for Spark 2.1.0,
    the latest version at the time of writing.'
  merge: -1
  img_proc: true
