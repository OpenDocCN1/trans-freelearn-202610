    # Forecasting using ARIMA


    Sometimes, you will have the need to forecast future values of a time series.
    For example, this could be a requirement to estimate the next several months of
    active IoT devices; or, it could be a need to project the usage hours of remote
    oil well pumps. One of the most popular methods to forecast time series is AutoRegressive
    Integrated Moving Average (ARIMA).'
  merge: -1
  img_proc: true
- pgno: 311
  md: 'ARIMA is not one model but a collection of related methods that attempt to
    describe autocorrelations in the data in order to forecast future values. ARIMA
    is a combination of moving average and autoregressive techniques. Autoregressive
    means that the forecasting of future values of a variable is based on the linear
    combination of the past values of variables.


    ARIMA incorporates both trend and seasonality effects into future forecasts. It
    can model both seasonal and nonseasonal data with a range of methods.


    # Using R to forecast time series IoT data


    The forecast package contains ARIMA functions in R. You can install it with the
    following code:


    ```

    install.packages("forecast")

    ```


    The Arima function has settings for the nonseasonal component of a forecast and
    the seasonal component (if needed). Each is composed of three numbers that represent
    the order of the autoregressive part, the degree of differencing to be used, and
    the order of the moving average part. This is commonly notated as (p,d,q) in R
    documentation. As with all things in data science, the right place to start is
    to look at your data, note any unusual trends, and perform some diagnostic statistical
    analysis to understand what are the appropriate values to use for (p,d,q) for
    both the nonseasonal and seasonal components.


    Fortunately, and also dangerously (has that been mentioned before?), R can handle
    a lot of this for you and automatically determine the appropriate values based
    on a series of tests. This is done using the auto.arima() function. You should
    also analyze the results and the residual values to determine if your forecast
    model is viable.


    The following example code takes the Wind values from the New York air quality
    dataset that we have been using in this chapter and fits an ARIMA model:


    ```

    #load forecast library

    library(forecast)


    #create a time series on the Solar radiation data. The air quality data was captured
    from May 1, 1973 to September 30, 1973

    windTS <- ts(completed_example_data$Wind,start = c(1973,5,1), frequency = 365.25)


    #show values over time

    plot.ts(windTS)


    #fit an arima model

    ```'
  merge: -1
  img_proc: true
