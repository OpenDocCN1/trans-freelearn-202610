- pgno: 272
  md: 'AWS also has a managed petabyte-scale data warehouse service called **Redshift**.
    This was introduced in `Chapter 3, IoT Analytics for the Cloud`. Redshift does
    not support geometry fields directly but does support Python UDFs. You can create
    UDFs using Python code and the *shapely* package, then call them from Redshift
    SQL statements. A similar strategy can be used for both Hive and Spark.


    ESRI supports an open source project called **GP tools for AWS** that allows ArcGIS
    users to connect to Amazon EMR and S3 data sources. The project is hosted on GitHub
    (`https://github.com/Esri/gptools-for-aws`).


    # Solving the pollution reporting problem


    From what you have learned in this chapter, you can now solve the IoT pollution
    sensor data by congressional districts problem introduced earlier. Follow these
    general steps using either Python code or spatial query functions in a database
    such as PostGIS:


    +   1. Download a shapefile for U.S. Interstates such as the U.S. National Transportation
    Atlas Interstate Highways shapefile available from the University of Iowa (`ftp://ftp.igsb.uiowa.edu/gis_library/USA/us_interstates.htm`).

    +   2. Download a shapefile for US congressional districts such as the TIGER/Line
    Shapefile available from the US Census (`https://www.census.gov/cgi-bin/geo/shapefiles/index.php?year=2016&layergroup=Congressional+Districts+%282815%29`).

    +   3. Load the shapefiles into a geospatial database using `ogr2ogr` or into
    Python using the *fiona* package.

    +   4. Add a 1 km buffer to the Interstates MultiLineString using the *shapely*
    package or `ST_Buffer` in PostGIS.

    +   5. Use a mapping API such as Google Maps to geocode each device address in
    order to get the latitude and longitude point pairs. This was discussed in `Chapter
    7, Decorating Your Data - Adding External Datasets to Innovate.`

    +   6. Load the IoT device locations as Point geometries.

    +   7. Optionally, apply R-tree indexes to the points and the congressional districts
    polygons to speed up calculations.

    +   8. Find Points contained within the buffered Interstates roadways polygon.
    The `contains` function would be one way to do this. Tag those points as within
    the bounds. Tag the remaining points as outside the range so they can be used
    as comparisons.'
  merge: -1
  img_proc: true
- pgno: 273
  md: '+   9. For each point, search for the congressional district polygon that contains
    it and track the results. This would be a great place to leverage the spatial
    indexing created earlier.

    +   10. Calculate the pollution values for each device and combine with the congressional
    district and the in/out of Interstates buffer tags.

    +   11. Pivot and compare the data to compile the report.

    +   12. Go ask for a raise, you have earned it!

    +   13. You can also use the erosion option in the `buffer` function to create
    Interstate polygons that identify several distance ranges. Start with the largest
    range as the buffer, then erode your way back down for each range level. Create
    a buffered polygon for each range. Search the smallest buffered polygon first,
    the next biggest, then the next, and so on. The points that are not in any of
    those are outside the range.

    +   14. Go ask for another raise!


    # Summary


    In this chapter, you learned about how to use geospatial analytics to find insights
    and answer complex questions about IoT data. The importance of geospatial analysis
    for geographically distributed IoT devices was discussed. The concept of CRS was
    introduced along with haversine distance and its limitations.


    The world is not a perfect sphere. Methods to adjust for that in order to accurately
    measure distance was covered. Python functions for geospatial analytics, such
    as `buffer` and `contains`, were discussed, along with some examples.


    Storing and processing geospatial data requires some specialized handling. Some
    geospatial databases and GIS software tools were reviewed. PostGIS spatial functions
    were also reviewed. We went over some tips for leveraging geospatial analytics
    in a big data world.


    Geospatial analytics offers a huge opportunity to analyze IoT data in new and
    innovative ways. It can help discover patterns in noisy data. New services can
    then be created as another way to extract value from your data.'
  merge: -1
  img_proc: true
- pgno: 274
  md: '# # Data Science for IoT Analytics


    "Revenues are up 5% due to your little geospatial search trick," the VP of Connected
    Services says, "You know your former boss''s position is still open. Maybe we
    should fill it from the inside..."


    Your pulse quickens, you were hoping he might come to this conclusion. You deserve
    a promotion after what your analytics has brought to the company. You now have
    one person working for you focusing on geospatial analysis. You can just imagine
    what you could do with a whole team.


    "There is something that we have been toying around with though," he continues,
    "With all this data we are collecting, we should be able to tap into machine learning
    models to predict equipment failures. Some think we should be hiring an outside
    consulting company to handle all of it. Sounds expensive to me. I sure wish we
    could coordinate this ourselves, work with data scientists of our own choosing...
    know anyone that might be up to it?"


    He winks and walks off, hands behind his back, whistling a Brahms tune.


    In this chapter, we introduce data science techniques such as machine learning,
    deep learning, and forecasting using ARIMA. Special focus is given on how to use
    these methods with IoT data. The core concepts for each will be reviewed along
    with examples in R. Deep learning will be described along with where to go to
    create an Amazon EC2 instance with TensorFlow.


    This chapter covers a lot of ground, so hold onto your hats.'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'This chapter covers the following topics:


    +   - Machine learning (ML):

    +     - Core concepts

    +     - Feature engineering

    +     - Validation methods

    +     - The Bias-variance tradeoff

    +     - Comparing models to find the best fit

    +     - Random forests

    +     - Gradient boosting machines

    +     - Anomaly detection

    +   - Forecasting using ARIMA

    +   - Deep learning:

    +     - Use cases with IoT data

    +     - Setting up and running a simple deep learning model using TensorFlow


    # Machine learning (ML)


    As a wise uncle of a human-arachnid hybrid once said, With great power, comes
    great responsibility. This is very true of ML. There are many ways to go wrong.
    When in the hands of a skilled practitioner, it truly is a form of art. It can
    be used to do some incredible things on a grand scale, but it should come with
    a big caution sign. Use it carefully. Be paranoid and validate, validate, validate.


    Although we will be going over some core concepts and providing code that you
    can take and run yourself, this is a big field with lots to learn. It takes years
    to skillfully and competently apply it. Each section in this chapter is really
    a book in itself. No, many books. If you plan to use it yourself on IoT data,
    read, read, read, and then read some more. This chapter is meant to able to provide
    you with a good foundation to have meaningful conversations with data scientists
    on the subject.'
  merge: -1
  img_proc: true
- pgno: 276
  md: '# What is machine learning?


    Ask a hundred experts for the definition of ML, and you are likely to get a hundred
    slightly different answers. Some will take a broad view and fully include deep
    learning, artificial intelligence, and some traditional statistical techniques,
    such as the sum of least squares linear regression. Others will be narrow and
    restrict their definition to a few modeling techniques, considering it separate
    from a related field called statistical learning.


    Some will say it does not even exist in the real world, only in over-hyped media
    stories. They feel it is all the same traditional statistical analysis that has
    been done for decades. Some will consider the term ML as completely interchangeable
    with the term artificial intelligence, while others will consider them very separate
    things.


    ML is an application of statistical techniques in an ordered set of steps (otherwise
    known as an algorithm). The statistical techniques are rarely new, many have been
    around for decades and some over a century. Many of the ML methods have also been
    around for several decades as well. What has changed is the dramatic decline in
    the cost of compute power along with a dramatic increase of computing capability.
    What would have taken months to calculate in 1980 now takes seconds or less.


    With the availability of some strong open source statistical software libraries,
    such as R and Python, combined with the low cost and available speed of modern
    computing hardware, ML has become practical to implement in a large variety of
    applications. With an increased use of ML came refinements to the existing methods
    and developments of new algorithms. This has led to a significant increase in
    predictive capability and a golden age for ML.


    We will use a (hopefully not overblown) analogy to help you think about this.
    With traditional statistical techniques, you are like a mechanical engineer, applying
    your expertise and knowledge of how things work to define a set of components
    that fit together. You use these methods to explicitly build your statistical
    model. You define the detail of each component based on testing and analysis of
    the data.'
  merge: -1
  img_proc: true
- pgno: 277
  md: 'With ML, you become more like an agricultural engineer. A farmer of data models.
    In this chapter, we will define ML as a method that has three general components
    that, when combined, *grow* a program from the soil of the provided data. This
    set of statistical techniques *learn* a representation of the underlying function
    that determines the target values or categories. Learning, in this case, is adaptation
    and not cognition, as it would be with us humans. At no point does your computer
    have even an inkling of what it all means—it is all zeros and ones to it.


    ![](img/9f2a55db1236f995dcd9392acbc82910_277_0.png)


    You as a ML practitioner.


    Illustration: Jim Campbell; Inlander; https://www.inlander.com/spokane/farming-data/Content?oid=2136658


    The true underlying function is never really known. So, the accuracy of the method
    can only be inferred from the error rates on new data examples. The goal of many
    of the ML algorithms (really a set of algorithms) is to iteratively find the right
    combination of levers to minimize these error rates. If the resulting ML model
    does a good job of this, then it is said to generalize well. More on this will
    be explained later.'
  merge: -1
  img_proc: true
- pgno: 278
  md: 'Any ML model can be viewed as having three interrelated components:


    +   - Representation

    +   - Evaluation

    +   - Optimization


    We will cover each in the next sections.


    # Representation


    Representation is how a model is formally constructed in a way which a computer
    can interpret. Examples are decision trees, support vector machines, and neural
    nets. ML models are commonly referred to by the name of the representation. A
    classifier is an instance in the set of possible models generated by the representation.
    When you make the choice of which representation to use, you are determining the
    possibilities of classifiers that your model is able to learn. The range of possibilities
    is known as the **hypothesis space**.


    If the true (and remember, *unknown*) classifier model is not in the hypothesis
    space, it cannot be learned. Most representation models you will use have a large
    hypothesis space, so this is probably not going to be a problem. But you should
    be aware of it, as you may need to expand your choices of representation models
    in order to expand the collective hypothesis space. This may be necessary if you
    are getting poor predictive performance from your normal *go-to* set of ML models.


    # Evaluation


    As the ML model *tunes itself*, there needs to be a way to evaluate how well it
    is doing. There needs to be a function that measures the performance to know which
    classifiers are good and which are bad. This is where the evaluation function
    comes into play. Some examples are accuracy, error rate, precision, recall, F-score,
    squared error, and information gain. These functions are also referred to as the
    **objective function** or **scoring function**.'
  merge: -1
  img_proc: true
- pgno: 279
  md: '# # Optimization


    Most of the ML model representations have large hypothesis spaces. A sequential
    search of all possibilities would take longer than you would ever want to wait
    for an answer; months, years, or lifetimes, depending on the complexity of the
    model representation. The choice of the optimization method determines the efficiency
    of the learning process. There are several general methods to search for the optimal
    classifier. Some examples are gradient descent, greedy search, and linear programming.


    | Representation | Evaluation | Optimization |

    |---|---|---|

    | Instances<br>　*K*-nearest neighbor<br>　Support vector machines<br>Hyperplanes<br>　Naive
    Bayes<br>　Logistic regression<br>Decision trees<br>Sets of rules<br>　Propositional
    rules<br>　Logic programs<br>Neural networks<br>Graphical models<br>　Bayesian networks<br>　Conditional
    random fields | Accuracy/Error rate<br>Precision and recall<br>Squared error<br>Likelihood<br>Posterior
    probability<br>Information gain<br>K-L divergence<br>Cost/Utility<br>Margin |
    Combinatorial optimization<br>　Greedy search<br>　Beam search<br>　Branch-and-bound<br>Continuous
    optimization<br>　Unconstrained<br>　　Gradient descent<br>　　Conjugate gradient<br>　　Quasi-Newton
    methods<br>　Constrained<br>　　Linear programming<br>　　Quadratic programming |


    The three components of ML algorithms. Source: A Few Useful Things to Know about
    Machine Learning by Pedro Domingos, University of Washington


    # # Generalization


    The fundamental goal of any ML project is to produce a model that operates well
    with datasets beyond what is available to you currently. You want it to predict,
    classify, or estimate with minimal errors. Not so much on the data you already
    have, but on data that you will have when the resulting model is implemented.


    The data that you already have to develop your ML model is called the **training
    set**. The training set should be representative of what you expect to find in
    the datasets that you will be applying the model to in the future. Even if you
    have a very large training set, it is unlikely that future datasets will be precisely
    the same. This great big, complex world produces a lot of variation.'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'The ability of an ML model to work as expected with a variety of future examples
    is called **generalization**. It is a key concept in ML, deep learning, and most
    other predictive modeling techniques. You want your ML model to predict accurately
    on both the data you have today and the data you will have in the future. You
    want the model to *generalize* beyond the dataset it was grown from. You should
    be willing to sacrifice accuracy on the training set in order to increase the
    probability of accuracy on the future, as yet unknown, datasets. After all, this
    is the whole point of developing an ML model in the first place.


    However, since the only data you have today is the training set and the underlying
    function that you are trying to approximate with the model is unknown, there is
    no choice but to use the error on the training data itself as a proxy for the
    error on the datasets of tomorrow, as the ML model optimizes itself. Yet this
    is dark and full of terrors – very dangerous!


    Thankfully, there are some methods to protect yourself from falsely optimistic
    ML models. These will be covered later. For now, know that practical ML is based
    on a foundation of mistrust. This is one of the things that makes it so powerful.
    If done properly, ML models that pass the rigors of validation go on to very successful
    applications in the wild and woolly real world.


    # Feature engineering with IoT data


    Beware of the siren call of the automated ML software tool, which takes all your
    data and determines what is important and automatically builds the best model
    from it–and all at the click of a button. Often, the raw data that you have is
    not in a form that ML models can be successful with. Using the data as it is can
    be a rocky proposition. Many an unaware ship has been wrecked on those rocks,
    lured by the lovely sound of automation.


    One of the best ways to dramatically improve the predictive ability of your ML
    models is not in the algorithms themselves, but in how the data that they are
    grown from is presented to them. The transformations of data, the addition of
    constructed new fields, and the removal of distracting fields is all done with
    the knowledge of how the representation model operates. This process is called
    **feature engineering**. Data fields are commonly referred to as **features**
    in ML. We will adopt that terminology for the rest of the chapter.


    The goal of feature engineering is to make it as easy as possible for your ML
    model to have good performance. Different representations have different requirements
    for what works well, so you will find yourself creating different versions of
    the same raw dataset geared specifically to the ML representation. Get to know
    each ML representation you are using to make sure you are giving it the best possible
    chance to perform.'
  merge: -1
  img_proc: true
- pgno: 281
  md: 'Feature engineering is an art and it is hard. But, it can add a lot of value
    and greatly increase your probability of success. We will introduce a few key
    concepts, but there is much, much more to learn.


    # Dealing with missing values


    IoT data is notoriously messy (just in case the message has not been driven home
    yet) and missing values are a common occurrence. There are some options to deal
    with this problem in order to enhance the quality of your ML models. This is where
    the art comes into play and judgment is important.


    The following are some methods for handling missing values:


    +   - **Remove data rows with missing values:** This is crude, but if only a small
    percentage is lost, and this percentage appears to be random, then it will have
    minimal effect on the results. Use a tool such as Tableau to analyze the data
    with missing values and compare it to the data without missing values to judge
    the impact of removing the rows. R and Python work well for this task also.

    +   - **Do not use features with a high number of missing values:** Just take
    them out. The effectiveness of a resulting model built with a feature that has
    a high percentage of imputed values will work about as well as a bicycle held
    together by bubble gum and toothpicks. The results will be questionable.

    +   - **You can impute the values using the mean, median, or mode of the valid
    values for the feature:** This is somewhat unrefined but can work well in some
    situations. Always analyze the data using techniques, such as that was introduced
    in *Chapter 6, Getting to Know Your Data - Exploring IoT Data*, to determine what
    makes sense.

    +   - **Create an ML model to impute the values based on the other features, then
    use the results in the ML model that predicts the target variable:** (what you
    want to predict, which is the purpose of building the model). Nested modeling.
    Now, we are cooking with gas!


    The *mice* package in R is useful for identifying and handling missing values.
    The name *mice* is short for Multivariate Imputation by Chained Equations. It
    has multiple functions to do some advanced imputation to fill in missing values.
    It can use ML techniques, such as random forests and logistic regression, to impute
    values.'
  merge: -1
  img_proc: true
- pgno: 282
  md: "![](img/9f2a55db1236f995dcd9392acbc82910_282_0.png)\n\nThe R mice package.\
    \ These guys impute missing values and live off residual keyboard cheese\n\nThe\
    \ following code demonstrates a very simple example of using *mice* to impute\
    \ values. We will start by loading in a sample dataset, *airquality*, which comes\
