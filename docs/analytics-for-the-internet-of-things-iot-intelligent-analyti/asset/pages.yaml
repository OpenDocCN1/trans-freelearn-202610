- pgno: 182
  md: 'We have shown some ways to look into data validity, but do not limit yourself
    to only what has been demonstrated. Continue exploring the data by slicing and
    dicing it in as many ways you can brainstorm. Talk with your design engineers
    on what range of measurement values should be expected and compare observations
    to that range. Refer back to your IoT device diagram in Chapter 1, Defining IoT
    Analytics and Challenges and use it to look for inconsistencies or distortions
    in the data.


    # Assessing Information Lag


    Data from IoT devices does not always arrive into your dataset in the same intervals
    of time. Some records maybe included quickly as the devices are located closer
    or are in more populated areas with better connectivity. Remote locations may
    have more of a lag between the device capturing the observation and the data records
    becoming a part of your dataset. There could also be differences between groups
    of IoT devices in the data transportation route, or in the ETL jobs which process
    it into the dataset used for analytics.


    Assessing the variation in lag times, which we will call Information Lag, is important
    to understand before applying more advanced analytics to the data. There could
    be significant bias in the faster arriving data records that does not exist after
    all records for the time period have been included. The following diagram shows
    variation in the Information Lag time for events that occurred at the same time.
    If the dataset were to be analyzed today, only the bottom event would be included:


    ![](img/9f2a55db1236f995dcd9392acbc82910_182_0.png)'
  merge: -1
  img_proc: true
