- pgno: 309
  md: '# # Anomaly detection using R


    Anomaly detection is a way to use historical data to identify unusual observations
    without requiring a labeled training set. Modern anomaly detection methods take
    into account long-term trends and cyclical variation in the data while determining
    which observations to flag as anomalies.


    Twitter has recently released an advanced open source anomaly detection package
    for R called *AnomalyDetection*. It is geared toward detecting anomalies in single
    value high frequency (less than a day) time series data; however, it is possible
    to set an option to handle datasets longer than a month. It can also be used on
    a vector of non-time series data.


    It is good at handling the effects of trends and seasonality - although seasonality,
    in this case, is at the minutes to days level not yearly. The GitHub page is located
    here (https://github.com/twitter/AnomalyDetection), and it can be installed easily
    as an R package using the following R code. Make sure to spell Anomaly with a
    capital A. *anomalyDetection* is a different package (welcome to the world of
    R):


    ```

    ```r

    install.packages("devtools")

    devtools::install_github("twitter/AnomalyDetection")

    ```

    ```


    The following example shows how anomaly detection can be used on sensor data.
    Anomaly detection is useful in itself, but the frequency of anomalies detected
    in a time window (hourly or daily) can have good predictive value when used as
    an input into other models. For example, the frequency of pressure sensor anomalies
    in the last hour combined, with an average temperature sensor reading, could be
    highly predictive of a future generator failure.


    The following example code takes the **Wind** values from the imputed dataset
    and looks for anomalies. The search can be either forward or backward, or both:


    ```

    ```r

    #load library

    library(AnomalyDetection)


    #This uses the vector method since no timestamp is present. If timestamp is

    present, use AnomalyDetectionTs

    res = AnomalyDetectionVec(cs_example_data$Wind, max_anoms=0.05, period=60,

    direction=''both'', only_last=FALSE, plot=TRUE)

    res$plot

    ```

    ```'
  merge: -1
  img_proc: true
