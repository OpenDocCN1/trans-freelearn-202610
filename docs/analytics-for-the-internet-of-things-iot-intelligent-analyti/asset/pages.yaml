  md: '# 4


    # Creating an AWS Cloud Analytics Environment


    This chapter is a step-by-step walk-through of creating an AWS cloud environment.
    The environment is specifically geared toward analytics and uses AWS best practices.
    Along with screenshots and instructions on setting things up, there will be explanations
    of what is being done and why. This walk-through will incur AWS usage charges.
    Make sure to delete all the resources after the walk-through if you do not intend
    on keeping the environment running as the total cost could be over $130 USD for
    a full month. Starting and stopping the EC2 instances as needed can reduce the
    cost somewhat.


    This chapter will cover the following topics:


    +   - AWS CloudFormation

    +   - Setting a best practice virtual private cloud setup:

    +     - NAT gateway

    +     - Bastion hosts

    +   - How to terminate and clean up the environment


    # The AWS CloudFormation overview


    AWS CloudFormation is, putting it simply, an infrastructure as code. It is an
    AWS service, you do not need to install any additional software. This allows developers
    and system administrators to design and implement the entire network and server
    configurations directly from a code template file. CloudFormation handles the
    ordering and creation of the resources automatically when the template is implemented.
    When a template is launched to create resources, it is called a stack.'
  merge: -1
  img_proc: true
- pgno: 114
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 115
  md: 'We will use one of the AWS quick start templates to create a secure environment
    to get started with IoT analytics. The quick start template incorporates AWS best
    practices into the design. You will have your own mini-data center up and running
    in a matter of minutes. The template we will be using was designed for high availability
    and will have room to grow if you decide to expand your use.


    Your author recommends that you bring in a consulting company that specializes
    in creating cloud environments, if you are setting up an environment for your
    company to use in standard operations. This is to ensure the underlying security
    and the architecture is set up correctly. It is far easier to have it configured
    properly from the start than to try to correct it later on.


    For experimentation and general analytic use, however, the environment we will
    create in the walk-through will work fine. It has several security and connectivity
    best practices in place.


    # The AWS Virtual Private Cloud (VPC) setup walk-through


    The walk-through assumes you already have the following set up:


    +   - **AWS account:** If you do not have an account, visit the AWS console page
    and follow the instructions to set up an account. The instructions are available
    at https://aws.amazon.com/free/.

    +   - **Root accounts with Multi-Factor Authorization (MFA) active:** This is
    essential for security purposes. If you have not turned on MFA, do it right away.
    Download an app on your phone such as Google Authenticator and set up MFA on your
    account. The instructions are available at https://aws.amazon.com/iam/details/mfa/.

    +   - **IAM users with administrative rights and MFA active:** Set up an IAM user
    for yourself with administrator rights to use for day-to-day operations. For security
    purposes, avoid using the root to log in. Also set up MFA for the IAM user.'
  merge: -1
  img_proc: true
