- pgno: 337
  md: 'Here are some revenue possibilities to consider:


    +   - **Extensions to your current business processes:** These ideas closely align
    with what you are already doing and can add additional value to your customers.
    It is always beneficial to think of services from the perspective of the end customer.
    Put yourself in their shoes and think what would save you costs and help you run
    your business better. Even better, ask them for their input. Some areas to think
    about are as follows:

    +     - **The monitoring of field operations:** Getting data instantly on the
    status of field equipment is often the reason for adding an IoT device in the
    first place. But you can add value to your customers by providing monitoring and
    alert services to them so they do not have to create it for themselves. You are
    in a position to have a greater economy of scale since your costs can be spread
    out among many customers.

    +     - **The tracking of field equipment location and status:** Again, you are
    in the position to spread your costs over many customers, so you can add this
    as a service to them inexpensively. It will be less costly for them than creating
    it on their own.

    +     - **Improved field repair services:** If your company also services the
    equipment connected to an IoT device, you have the opportunity to have faster
    and better field service levels. If you are also monitoring the equipment and
    tracking location and status, this is a natural next step. Not only do you know
    right away if there is a problem, you know exactly where it is located and which
    parts to bring to correct it. Even if you do not provide field service of the
    equipment, you can serve as an intermediary to companies that do provide that
    service. Since you are making the entire process more efficient, this has value
    to both the end customer and the field service company. There is a revenue stream
    from both sides that could be going into your pocket.

    +   - **New revenue opportunities:** These ideas are additional services not directly
    related to current business processes. Think about it; you have new information
    about location and operation of IoT devices flowing into a centralized location.
    This is information you did not have before. Take a minute to look at it differently,
    and think how your business would have generated revenue from it if the information
    had always been available. Try to get out of the mental context of how things
    have always been. Some things to think about are as follows:'
  merge: -1
  img_proc: true
- pgno: 338
  md: '+   - **Value from the pool of IoT data itself:** Think which other business
    and industries would find the data you have valuable. Package it up in a way that
    protects your customers and provides the information these other companies need.
    Then, charge them to get it. We discussed an example earlier in the book about
    IoT thermostat data, which was being aggregated and sold to power generating companies.
    Cellular network companies package up cell phone location data in a way that indicates
    current traffic congestion along highways. Some cell phone app companies collect
    GPS position and package that up to sell to retailers as an indicator of foot
    traffic at their stores. Financial and insurance companies certainly find value
    in indicators of business segment activity available earlier than official statistics.

    +   - **New business services:** Think about where having the IoT data and the
    analytics power you have created could put your company in a better position to
    provide a service than anyone else. It may even be in a currently unrelated business.
    Back to the IoT thermostat example. Since the company can both detect HVAC problems
    and know the location of the unit, it is in a position to efficiently schedule
    the correct repair procedure. This concept was mentioned earlier in the *extension
    of current business processes* section of this chapter. However, in this case,
    the IoT thermostat company currently has no service function. They may want to
    start one, however, as they are well positioned to do so. Imagine if the thermostat
    sends an email to the customer that it detected a problem and can have a repair
    person there to fix it in two hours at a predefined reasonable price. And all
    the customer has to do is click on Ok, as shown in the following image:


    ![](img/9f2a55db1236f995dcd9392acbc82910_338_0.png)'
  merge: -1
  img_proc: true
- pgno: 339
  md: '+   - **Services that would be very valuable to the customer that you could
    not have provided before:** Think about how a customer can use the data you now
    have to improve their business. They may already be doing some of these things,
    so again, it is very valuable to connect with them and ask them. Package up that
    service and sell to all the customers. An example, if you provide a GPS tracking
    device for logistic companies attached to on-road trailer units, think how customers
    could find that data valuable to them. You could provide bench marking services
    to customers to compare miles traveled for their units to similar companies. You
    could aggregate their position data over time to show them a route concentration
    map. You could compare their map to the industry, which may be very valuable to
    them when considering expansion planning.


    # The economics of predictive maintenance example


    Predictive maintenance is a common value proposition cited for IoT analytics.
    We will walk through an example as a way to highlight how to think financially
    about when it makes sense and when it does not.


    # Situation


    The economics of predictive maintenance may not be entirely obvious. Believe it
    or not, it does not always make sense, even if you can predict early failures
    accurately. It many cases, you will actually lose money by doing it. Even when
    it can save you money, there is an optimal point for when it should be used. The
    optimal point depends on the costs and the accuracy of the predictive model.'
  merge: -1
  img_proc: true
- pgno: 340
  md: '# The value formula


    A formula to guide decision making compares the cost of allowing a failure to
    occur versus the cost to proactively repair the component while considering the
    probability of predicting the failure:


    *Net Savings = (Cost of Failure * (Expected Number of Failures - Expected True
    Positive Predictions)) - (Proactive Repair Cost * (Expected True Positives + Expected
    False Positives))*


    If the cost of failure is the same as the proactive repair cost, even with a perfect
    prediction model, which we know from Chapter 10, Data Science for IoT Analytics
    is highly unlikely, then there will be no savings. Make sure to include intangible
    costs into the cost of failure. Some examples of intangible costs include legal
    expenses, loss of brand equity, and even the customer''s expenses.


    Predictive repair does makes sense when there is a large spread between the cost
    of failure and the cost of proactive replacement, combined with a well-performing
    prediction model. For example, if the cost of a failure is a locomotive engine
    replacement at $1 million USD and the cost of a proactive repair is $200 USD,
    then the accuracy of the model does not even have to be all that great before
    a proactive replacement program makes financial sense.


    On the other hand, if the failure is a $400 USD automotive turbocharger replacement,
    and the proactive repair cost is $350 USD for a turbocharger actuator subcomponent
    replacement, the predictive model would need to be highly accurate for that to
    make financial sense.


    # An example of making a value decision


    To illustrate the example, we will walk through a business situation and then
    some R code that simulates a cost benefit curve for that decision. The code will
    use a fitted predictive model to calculate the net savings (or lack thereof) to
    generate a cost curve. The cost curve can then be used in a business decision
    on what proportion of units with predicted failures should have a proactive replacement.


    Imagine you work for a company that builds diesel-powered generators. There is
    a coolant control valve that normally lasts for 4,000 hours of operation until
    there is a planned replacement. From analysis, your company has realized that
    the generators built two years prior are experiencing an earlier than expected
    failure of the valve.'
  merge: -1
  img_proc: true
- pgno: 341
  md: "When the valve fails, the engine overheats and several other components are\
    \ damaged. The cost of failure, including labor rates for repair personnel and\
    \ the cost to the customer for downtime, is an average of $1,000 USD. The cost\
    \ of a proactive replacement of the valve is $253 USD.\n\nShould you replace all\
    \ coolant valves in the population? It depends on how high a failure rate is expected.\
    \ In this case, about 10% of the current non-failed units are expected to fail\
    \ before the scheduled replacement. Also, importantly, it matters how well you\
    \ can predict the failures.\n\nThe following R code simulates this situation and\
    \ uses a simple predictive model (logistic regression) to estimate a cost curve.\
    \ The model has an AUC of close to 0.75. This will vary as you run the code since\
    \ the dataset is randomly simulated:\n\n```\n```r\n#make sure all needed packages\
    \ are installed\nif(!require(caret)){\n  install.packages(\"caret\")\n}\nif(!require(pROC)){\n\
    \  install.packages(\"pROC\")\n}\nif(!require(dplyr)){\n  install.packages(\"\
    dplyr\")\n}\nif(!require(data.table)){\n  install.packages(\"data.table\")\n}\n\
    \n#Load required libraries\nlibrary(caret)\nlibrary(pROC)\nlibrary(dplyr)\nlibrary(data.table)\n\
    \n#Generate sample data\nsimdata = function(N=1000) {\n\n#simulate 4 features\n\
    X = data.frame(replicate(4,rnorm(N)))\n#create a hidden data structure to learn\n\
    hidden = X[,1]^2+sin(X[,2]) + rnorm(N)*1\n#10% TRUE, 90% FALSE\nrare.class.probability\
    \ = 0.1\n#simulate the true classification values\ny.class = factor(hidden>quantile(hidden,c(rare.class.probability)))\n\
    return(data.frame(X,Class=y.class))\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 342
  md: "```\n```r\n#make some data structure\nmodel_data = simdata(N=50000)\n\n#train\
    \ a logistic regression model on the simulated data\ntraining <- createDataPartition(model_data$Class,\
    \ p = 0.6, list=FALSE)\ntrainData <- model_data[training,]\ntestData <- model_data[-training,]\n\
    glmModel <- glm(Class ~ ., data=trainData, family=binomial)\ntestData$predicted\
    \ <- predict(glmModel, newdata=testData, type=\"response\")\n\n#calculate AUC\n\
    roc.glmModel <- pROC::roc(testData$Class, testData$predicted)\nauc.glmModel <-\
    \ pROC::auc(roc.glmModel)\nprint(auc.glmModel)\n\n#Pull together test data and\
    \ predictions\nsimModel <- data.frame(trueClass = testData$Class,\n          \
    \             predictedClass = testData$predicted)\n\n# Reorder rows and columns\n\
    simModel <- simModel[order(simModel$predictedClass, decreasing = TRUE), ]\nsimModel\
    \ <- select(simModel, trueClass, predictedClass)\nsimModel$rank <- 1:nrow(simModel)\n\
    \n#Assign costs for failures and proactive repairs\nproactive_repair_cost <- 253\
    \   # Cost of proactively repairing a part\nfailure_repair_cost  <- 1000   # Cost\
    \ of a failure of the part (include all\n                                # costs\
    \ such as lost production, etc not just the repair cost)\n\n# Define each predicted/actual\
    \ combination\nfp.cost <- proactive_repair_cost # The part was predicted to fail\
    \ but did\n                                 # not (False Positive)\nfn.cost <-\
    \ failure_repair_cost   # The part was not predicted to fail and it\n        \
    \                         # did (False Negative)\ntp.cost <- (proactive_repair_cost\
    \ - failure_repair_cost) # The part was\n                                    \
    \                     # predicted to fail and it did (True Positive). This will\
    \ be negative for a\n                                                        \
    \ # savings.\ntn.cost <- 0.0                       # The part was not predicted\
    \ to fail and\n                                      # it did not (True Negative)\n\
    \n#incorporate probability of future failure\nsimModel$future_failure_prob <-\
    \ prob_failure\n\n#Function to assign costs for each instance\nassignCost <- function(pred,\
    \ outcome, tn.cost, fn.cost, fp.cost, tp.cost,\nprob) {\n  cost <- ifelse(pred\
    \ == 0 & outcome == FALSE, tn.cost, # No cost since no\n                 action\
    \ was taken and no failure\n```\n\n```"
  merge: -1
  img_proc: true
- pgno: 343
  md: "```\nifelse(pred == 0 & outcome == TRUE, fn.cost, # The cost\nof no action\
    \ and a repair resulted\n    ifelse(pred == 1 & outcome == FALSE, fp.cost, #\n\
    The cost of proactive repair which was not needed\n        ifelse(pred == 1 &\
    \ outcome == TRUE,\ntp.cost, 999999999)))  # The cost of proactive repair which\
    \ avoided a\nfailure\n    return(cost)\n}\n\n# Initialize list to hold final output\n\
    master <- vector(mode = \"list\", length = 100)\n\n#use the simulated model. In\
    \ practice, this code can be adapted to compare\nmultiple models\ntest_model <-\
    \ simModel\n\n# Create a loop to increment through dynamic threshold (starting\
    \ at 1.0 [no\nproactive repairs] to 0.0 [all proactive repairs])\nthreshold <-\
    \ 1.00\nfor (i in 1:101) {\n#Add predicted class with percentile ranking\ntest_model$prob_ntile\
    \ <- ntile(test_model$predictedClass, 100) / 100\n# Dynamically determine if proactive\
    \ repair would apply based on\nincrement threshold\ntest_model$glm_failure <-\
    \ ifelse(test_model$prob_ntile >= threshold, 1, 0)\ntest_model$threshold <- threshold\n\
    \n# Compare to actual outcome to assign costs\ntest_model$glm_impact <- assignCost(test_model$glm_failure,\n\
    test_model$trueClass, tn.cost, fn.cost, fp.cost, tp.cost,\ntest_model$future_failure_prob)\n\
    \n# Compute cost for not doing any proactive repairs\ntest_model$nochange_impact\
    \ <- ifelse(test_model$trueClass == TRUE,\nfn.cost, tn.cost) # *test_model$future_failure_prob)\n\
    \n# Running sum to produce the overall impact\ntest_model$glm_cumul_impact <-\
    \ cumsum(test_model$glm_impact) /\nnrow(test_model)\ntest_model$nochange_cumul_impact\
    \ <- cumsum(test_model$nochange_impact) /\nnrow(test_model)\n\n# Count the # of\
    \ classified failures\ntest_model$glm_failure_ct <- cumsum(test_model$glm_failure)\n\
    \n# Create new object to house the one row per iteration output for the\nfinal\
    \ plot\n```"
  merge: -1
