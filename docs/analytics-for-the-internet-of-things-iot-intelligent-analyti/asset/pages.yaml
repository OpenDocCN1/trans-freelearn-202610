- pgno: 306
  md: '# GBM key concepts


    The depth or shallowness of a decision tree refers to how many levels of hierarchies
    it has. The smaller the number of hierarchies, the more shallow the tree. GBM
    uses successive weak learners, which are trained on a measure of error from the
    previous model. A weak learner means it has some predictive power but not much.
    A shallow tree is typically weak, as it is only using one or a small number of
    features to split the training data.


    The resulting predictions are added together to arrive at a final prediction.
    There are several variants that use different methods of estimating error and
    determining how shallow to make each tree.


    GBMs work by successively dialing in on higher error areas using the error of
    the previous model to fit the next model, and so on and so forth. This addresses
    a problem when using a single decision tree. A single tree splits the data into
    smaller and smaller groups at each branch. This leads to overfitting as it begins
    to fit noise, especially when it gets into small sample sizes at the ends of the
    branches. GBMs avoid this by reusing the entire dataset at each successive learned
    tree:


    ![](img/9f2a55db1236f995dcd9392acbc82910_306_0.png)


    GBM concept diagram'
  merge: -1
  img_proc: true
- pgno: 307
  md: "# The Gradient Boosting Machines R example\n\nIn R, the gbm package can be\
    \ used to train a GBM. GBMs have the tuning parameters of tree depth and shrinkage.\
    \ As always, the beauty and danger of R is that it can tune these parameters for\
    \ you. The following code uses the caret package to fit a GBM model and optimize\
    \ the tuning parameters:\n\n```\n#make sure needed packages are installed, then\
    \ load them\nif (!require(gbm)) {\n  install.packages(\"gbm\")\n}\n\nlibrary(gbm)\n\
    \n#reuse train control and training data from random forest example\n\n#train\
    \ the random forest model and specify the number of trees. Use caret\n#to control\
    \ cross-validation\ngbmModel <- train (trainData[,predictors],\n trainData[,target],\n\
    \ method = \"gbm\",\n trControl = ctrlCV,\n verbose = FALSE)\n\n#run prediction\
    \ on test data to get class probabilities\ntestPredGBMProb <- predict(gbmModel,\
    \ testData, type = \"prob\")\n#run prediction again to get predicted class\ntestData$GBMclass\
    \ <- predict(gbmModel, testData)\n\n#grab the positive class probability (hot)\
    \ and the predicted classes\ntestData$GBMProb <- testPredGBMProb[,\"hot\"]\n\n\
    #Show confusion matrix for results\nconfusionMatrix(data = testData$GBMclass,\
    \ reference = testData$tempClass,\n positive = \"hot\")\n```\n\nThe confusion\
    \ matrix will look similar to the following table. In our small sample, GBM is\
    \ not doing so shabby:"
