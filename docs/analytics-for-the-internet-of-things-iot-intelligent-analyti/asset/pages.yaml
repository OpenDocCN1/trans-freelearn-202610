  md: '![](img/9f2a55db1236f995dcd9392acbc82910_227_0.png)


    Here''s a summary of the steps in creating your question tree hierarchy:


    +   1. List the questions the audience wants to ask of the analytics.

    +   2. Generalize the questions and consolidate.

