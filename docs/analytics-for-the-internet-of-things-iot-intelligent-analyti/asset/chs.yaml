  \n## CIA World Factbook\n\n中央情报局世界概况\n\n美国中央情报局 (CIA) 维护了一个免费、有用的、无附加条件（据我们所知）的关于世界各国信息的数据库。尽管以大胆的间谍工作而闻名，CIA\
  \ 还承担着收集世界各地有用信息的相对枯燥的角色。\n\n该机构将其中一些信息提供给任何可以使用网络浏览器的人。如果中央情报局的任何人正在阅读本书（希望是通过购买而不是直接从作者的笔记本电脑上\
  \ - 但我们开玩笑，我们开玩笑），作者想感谢您免费提供这个全球信息的重要来源。它作为公共领域提供，这意味着无需担心版权或保留出版权问题。\n\n\n\n\n\n\
  《世界概况》包含关于260多个世界实体（他们称之为实体，但可视为国家）的信息。这些信息涵盖每个国家的历史、人民、政府、经济、地理、通信、交通和军事等方面。\n\n\
  然而，《世界概况》并未以机器可读的格式在网站上提供；你可以在 GitHub 上找到 JSON 版本。如果你的物联网设备分布在全球各地，它是一个了解世界各国情况的有用参考。可访问\
  \ https://www.cia.gov/library/publications/the-world-factbook/ 获取。\n\n## 外部数据集——经济类\n\
  \n经济数据和趋势变化与物联网数据结合时，也能成为预测价值的来源。这些信息有助于解释零售场景中的购买模式、公用事业监控中的能源消耗，以及制造业中的设备利用率。\n\
  \n## 经济合作与发展组织（OECD）\n\nOECD 是一个论坛，34 个民主市场经济国家与超过 70 个非成员国共同致力于促进经济增长、繁荣和可持续发展。作为其使命的一部分，该组织汇编了一个经济及相关统计数据库，并向所有人开放。\n\
  \n> 该组织提供一个环境，让各国政府可以比较政策经验、寻求共同问题的解决方案、识别良好实践，并协调国内与国际政策。\n\n该数据库可在 OECD.Stat（http://stats.oecd.org/）上获取。其数据集范围从农业和渔业到工业和服务业。数据涵盖\
  \ OECD 成员国及部分选定的非成员国经济体。由于所有国家的信息都遵循 OECD 统计准则，因此与通过不同来源（可能采用不同统计方法）收集的数据相比，这些数据的可比性要高得多。\n\
  \n每个主题都有子类别，每个子类别中包含多种衡量指标。有多种方法可以将数据集导出为机器可读形式（如 .csv），并且有一个 API 可用于通过代码获取数据。该网站具有创建模板\
  \ API 查询的功能，从而简化了使用过程。以下截图是**月度经济指标**主题下可用统计信息的示例：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_214_0.png)\n\
  \n## 美国联邦储备经济数据（FRED）\n\n在美国，圣路易斯联邦储备银行维护着大量与经济相关的时间序列数据，大部分覆盖美国，但也有一些国际数据。这些数据被统称为\
  \ FRED。FRED 是你的朋友，他知道很多。\n\n他知道按月份统计的所有城市消费者的消费者价格指数。FRED 知道平民失业率和实际家庭收入中位数。他知道美国所有年龄段贫困人口的估算数，以及世界互联网用户数量。\n\
  \nFRED 中包含了来自 80 多个不同来源的超过 47 万个美国和国际时间序列。FRED 有实用的工具，如 Microsoft Excel 插件和一些智能手机移动应用。FRED\
  \ 甚至还有一个名为 FREDcast 的预测游戏。FRED 的网址是 https://fred.stlouisfed.org/。\n\nFRED 还有一个地理空间组件，称为\
  \ GeoFRED。你可以用它创建时间序列数据的地图版本，或下载 shapefile 文件。以下截图是2014年按县划分的家庭收入中位数估算的90%置信区间下界的示例：\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_215_0.png)\n\n2014 年按县划分的家庭收入中位数估算的 90%\
  \ 置信区间下界。来源：GeoFRED\n\nFRED 有三个开发者 API：\n\n- **FRED API**：可用于通过编程方式从 FRED 数据集中检索时间序列数据。\n\
  - **FRASER API**：此 API 可用于从**联邦储备经济研究档案系统（FRASER）**检索元数据。FRASER 保存着历史文件和档案。\n- **GeoFRED\
  \ API**：允许以编程方式访问 GeoFRED 数据和 shapefile 文件。\n\n你需要从 FRED 网站获取一个 API 密钥才能使用它们。获取\
  \ FRED 数据的另一种方式是使用 R 包，如 *Quandl*。你可以从 RStudio 图形界面或使用 `install.packages` 函数安装该包。然后，你可以用它从包括\
  \ FRED 在内的多个金融数据源获取数据。以下是一些示例 R 代码，用于获取美国 GDP 时间序列数据：\n\n```\n```r\n#load Quandl\
  \ library\nlibrary(Quandl)\n\n#Grab US GDP time series data from FRED\ngdp_ts =\
  \ Quandl(\"FRED/GDP\")\n\n#Display\nView(gdp_ts)\n```\n```\n\n在 R 中使用代码库，你可以自动化处理过程，定期将数据整合到你的分析环境中。\n\
  \n## 总结\n\n在本章中，我们讨论了如何通过内部和外部数据集增强你的物联网数据。这可以极大地增加发现价值的机会。通过添加这些额外数据，你可以开发属性，从而建立和验证关于数据的理论。\n\
  \n所有理论都应该用数据进行测试。物联网数据为你提供了一个巨大的实验室，你可以通过细分和比较已有的数据来进行虚拟实验。通过加入外部数据集，你可以增强通过物联网分析发现有价值模式的能力。\n"
- "## 与他人沟通——可视化与仪表板\n\n自从你的分析阻止了亮粉色恒温器盖板的危机以来，已经过去几个月了。你的老板因为他在开发利用物联网现场数据回答业务问题方面的领导力，已被晋升为物联网分析总监。而你，职位没变，只是责任更重了。\n\
  \n你的分析成果正在整个公司使用。你对此感到兴奋，但现在花费大量时间整理标准报告，每周发送给各个团队。\n\n“财务部的克莱恩曼想看你的活跃设备趋势图，但他想要表格形式。我不知道为什么，但你能为他做一个那样的版本吗？”你的老板以轻快的语气问道。他似乎对人们想要的图表越多就越高兴。而你却越来越忙。\n\
  \n“好吧，够了！”你忍不住发火，“他们得自己想办法弄图表。我没法应付所有这些版本和后续问题。我做这份工作不是要把时间都花在基本报告和回答基本问题上。他们应该自己解决这些问题。”\n\
  \n你的老板被你的反应吓了一跳；他可能以为你和他一样高兴。“好吧，好吧。我们会解决的。你只需要创建一些仪表板，让他们自己回答问题。看，多简单！我会支持你，让他们照着做，不用担心。”\n\
  \n你不确定该怎么做，但绝对希望腾出时间来做更高级的分析。\n\n在与财务部的吉姆·克莱恩曼交谈后，你发现他之所以想要表格，是因为他想计算财政年度的平均值。他将其用于财务规划目的。而销售技术人员则希望看到图表，因为他们每天都要用图表快速检查增长和下降情况。\n\
  \n你必须仔细思考这个问题。你不想为每个人创建不同的仪表板，但你又希望他们都能有效使用你所创建的内容，并且不要用后续问题来打扰你。\n\n本章讨论如何为物联网数据设计有效的可视化和仪表板。一旦你在数据中发现了有价值的模式，就需要与他人沟通。可视化是快速传达复杂数据的有效方式。\n\
  \n随着你的分析发展，其他人将监控数据以识别模式并跟踪长期趋势。设计有用的仪表板可以让他们快速识别需要调查的模式，并回答自己的后续问题。可以将其视为另一种形式的沟通。\n\
  \n我们将使用 Tableau 来构建可视化和仪表板。你将学习如何利用你对数据的理解，并以易于理解的方式传达出来。本章涵盖内部仪表板和面向客户的仪表板。\n\n\
  本章涵盖以下主题：\n\n- 设计可视化时的常见错误：\n  - 避免这些错误的技巧\n- 问题层级方法：\n  - 描绘最终用户的思维过程\n  - 开发问题树\n\
  \  - 将可视化与用户问题层级对齐\n- 为物联网数据设计可视化分析：\n  - 使用位置传达重要性\n  - 有效使用颜色\n  - 创建有效图表的技巧\n\
  - 使用 Tableau 创建仪表板：\n  - 使用气象站数据的分步示例\n- 快速创建和可视化警报：\n  - 警报原则\n  - 为 Tableau 仪表板组织警报\n\
  \n\n\n\n\n- **隐藏复杂性：** 如果它不能增加有助于得出结论的信息，就隐藏它。\n- **从终点开始：** 先展示你的结论，然后再解释你如何得出这一结论。仪表板也是如此；让最显眼的视觉元素是能促使用户采取行动的那个，然后用支持信息加以补充。\n\
  \n- **不考虑分析的使用方式：** 分析和可视化将用于每月向高管团队汇报一次？还是供技术支持人员每天使用？即使是相同的信息，这两种情况所需的视觉效果也会截然不同。以下是一些需要考虑的事项：\n\
  \  - **为管理层报告简化：** 高管们每天从各种来源接收到大量信息。让你的信息易于理解，使用清晰的趋势线和红、黄、绿三色符号来表示状态。\n  - **为日常操作用户添加更多细节：**\
  \ 他们需要你能在单个视图中显示的尽可能多的相关信息，同时又不能过于繁杂而难以解读。找到适当的平衡，但应倾向于展示更多有用的数据。\n\n为了说明如何将糟糕的可视化转变为优秀的可视化，我们先从一个糟糕透顶的例子开始，这个例子会让爱德华·塔夫特（Edward\
  \ Tufte）心跳加速（谷歌一下他，然后读读他的书）：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_221_0.png)\n\
  \n一个糟糕图表的例子。请勿这样做。\n\n这个可视化存在多个问题。除非演示文稿或仪表板的整个主题是深色的，否则深色背景会分散注意力。两个坐标轴都没有标注。也不清楚哪条线更重要，因此图表给观众的印象是所有线都同等重要。\n\
  \n图例中使用的是字符代码，而不是更具描述性的名称。如果某人不是非常熟悉这些代码，就必须查找它们的描述。3D 的使用方式没有提供任何信息价值，反而分散了对关键数据的注意力。\n\
  \n标签直接标注在未取整的数值上。这使图表显得杂乱，并暗示了一种可能不准确的精度。如果这是一张每月审阅的图表，历史趋势很重要，但精确值并不重要——除了当前月份。\n\
  \n该图表既难以解读，又视觉上令人困惑。现在，让我们看看同一图表的改进版本：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_222_0.png)\n\
  \n好得多的可视化，关键趋势显而易见，当前月份数值也清晰标注。\n\n这个可视化在表明哪条趋势线最重要方面要清晰得多。线条也标注清楚，观众无需参考图例。当前月份数值（即每月报告的数值）清晰可见，且没有暗示过度的精度。\n\
  \n两个坐标轴都进行了标注，因此观众无需猜测测量的是什么。月份的坐标轴标签是垂直的，这与该月的数值在视觉上对齐。以这种方式格式化可视化需要多花一点功夫，但观众会更快、更清楚地理解信息。这使它值得付出努力。\n\
  \n## 问题层级法\n\n在设计可视化和仪表板时，不要只是复制你探索数据时为自己创建的那些图表和表格，而应花点时间从观众的角度思考问题。想想他们的视角和需求与你有什么不同。\n\
  \n作为分析师，你对数据和环境已经非常熟悉；你的图表不需要标签和描述。你想要的是在一个地方容纳尽可能多的信息，以便轻松找到模式。而将要与仪表板交互或观看你演示的人们则有不同的需求。\n\
  \n他们希望无需费太多力气就能在视觉上定位自己。他们希望关键结论显而易见。他们不想花大量时间试图弄明白，也不想为了理解所展示的内容而问很多问题。他们希望简单熟悉，但又要足够的细节，让他们确信数据在支持他们的解读。\n\
  \n在为他人设计分析交互时，遵循一个框架会很有帮助。这将有助于你组织思路，并规划出支持他人分析所需的可视化和仪表板。\n\n## 问题层级法概述\n\n在这里，我们将介绍一种规划可视化的流程，称之为问题层级法。你不是从需求和原型开始，而是从梳理观众的思维过程开始。\n\
  \n之后，你汇总回答所映射思维过程中识别出的问题所需的数据。数据的形式应能够被高效地以多种不同方式查询。我们将在后面的章节中讨论如何做到这一点。\n\n最后，创建与所映射思维过程一致的可视化。相同的数据很可能会以不同方式被多次使用。遵循这一流程的好处是，它将观众的需求放在首位，而不会锚定于起始可视化——它很可能就是最初最容易创建的内容。在这种情况下，倾向是去做对开发者（你）来说最易于创建和维护的事情，而非对观众最有利的事情。将自己从可视化的固定起点中解放出来，能够让你对与分析数据进行交互的创新方式保持开放态度。\n\
  \n请记住，你是一个人，而观众是很多人；并且，对于仪表板来说，每个人都需要多次使用它。把它做对的总体收益可能很大，尤其是对于可能有数千用户的面向前台客户的仪表板。\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_224_0.png)\n\n## 构建问题树\n\n流程的第一步是集思广益，列出演示或仪表板中的可视化应该回答的问题清单。如果可能的话，与一小群最终用户一起进行。如果不可能，或者你正在准备一个小型演示，那就从设身处地开始。试着忘记你对数据的了解。想想如果你是他们，你希望哪些问题得到解答。把它们列出来。\n\
  \n下一步是将问题清单概括为每个问题真正在询问的底层概念。例如，问题*夏季温度传感器读数是否低于 21 度？*可以转化为*温度传感器读数是否与一年中该时期的平均值存在显著差异？*有些问题可能会合并在一起。其目的是得到一个可适用于多种情境而非特定情境的概念。\n\
  \n然后，审阅清单并识别作为起点的问题。起点是促使人们一开始就去查看仪表板或坐下来观看演示的动机。接着，识别哪些问题实际上是起点问题的后续问题。示例问题*温度传感器读数是否与一年中该时期的平均值存在显著差异？*可能不是一个起点问题。更可能的是*某个地区的平均温度读数趋势是什么？*，随后是*是否存在任何异常读数？*，然后才是*温度传感器读数是否与一年中该时期的平均值存在显著差异？*。\n\
  \n\n\n\n以层级结构排列问题，将起点问题放在左侧，与其向右延伸的后续问题相连。如果同一个后续问题与多个起点问题相关，则为每个起点问题复制该后续问题。每种场景中，该问题可能略有不同。我们将由此得到的图表称为**问题树**。在构建数据集和可视化时，可以将其作为参考。\n\
  \n为了说明这一过程是如何运作的，我们将以电影场次信息为例进行逐步讲解。大多数人都能轻松理解这个例子。第一步是列出那些会让你想要了解电影场次信息的问题：\n\n\
  - 《*变形金刚12*》什么时候上映？\n- 哪些影院在放映《*洛基恐怖秀*》？\n- 今晚8：10《*复仇者联盟 vs. 正义联盟*》的场次是否已售罄？\n\
  - 还剩多少个座位？\n- 那家影院的票价是多少？\n- Cineblast 128距离多远？\n- 到Cinema Cheap-o需要多长时间？\n- 今晚豪华影院（Luxury\
  \ Cinema）上映什么电影？\n- 明晚9点左右有哪些电影在上映？\n\n下一步是归纳并合并这些问题：\n\n- 我想看的电影在什么时间有场次？\n- 我想看的电影在哪些影院上映？\n\
  - 在特定的影院和时间，我能买到好座位吗？\n- 在特定的影院和时间，我能买到好座位吗？（合并）\n- 在特定的影院和时间，票价是多少？\n- 在特定的时间前往特定的影院，需要花多少时间在路上？\n\
  - 在特定的时间前往特定的影院，需要花多少时间在路上？（合并）\n- 我想去的影院上映哪些电影？\n- 在特定的时间我能看哪些电影？\n\n然后，确定主要的起点问题。建议从记录选择问题的理由开始。在这个例子中，有三个变量：电影、地点和时间。通常你已经确定了其中一个变量，需要信息来帮助你决定另外两个：\n\
  \n- 我想看的电影在什么时间有场次？\n    - *我知道我想看什么电影。我特别想看《变形金刚12》；我只需要知道什么时间能看。然后，我想知道在哪里上映，以及我和朋友是否还能买到好座位。票价和去影院需要多长时间也会很有帮助。*\n\
  - 我想去的影院上映哪些电影？\n    - *我知道我想去什么地方。我喜欢去豪华影院（Luxury Cinema）；那里的体验非常棒。我只是想知道那里有没有我想看的电影。然后，我想知道场次时间以及能否买到好座位；我可不想花了大价钱，结果连坐在女朋友旁边都做不到。*\n\
  - 在特定的时间我能看哪些电影？\n    - *我知道我想看什么时间。我们订了晚上7点的餐厅去吃晚饭，我想看看之后附近有没有什么电影可以看。我想知道票价、能否买到好座位，以及从餐厅到那里需要多长时间。*\n\
  \n最后一步是将问题组织成问题树。下图展示了电影场次示例的问题树：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_227_0.png)\n\
  \n以下是创建问题树层级结构的步骤摘要：\n\n- 1. 列出受众想要向分析提出的问题。\n- 2. 归纳并合并问题。\n- 3. 确定起点问题。\n- 4.\
  \ 将问题组织成问题树图。\n\n## 整合数据\n\nIoT数据通常使用Hadoop（具体来说是HDFS）等大数据技术进行存储。在仪表板的SQL语句中连接多张表通常会降低性能，在这些系统中有时性能会显著下降。\n\
  \n尽量将数据整合到尽可能少的表中，这样表连接只在批处理时执行，而不是每次有人使用仪表板时都执行。在考虑数据集中应包含哪些信息时，请参考问题树，并纳入回答问题所需的信息。\n\
  \n## 将视图与问题流对齐\n\n设计可视化时，要使其与问题树的层级结构对齐。第一个、也是最显眼的可视化应该回答起点问题。后续问题应尽可能在同一个可视化中呈现，但可以放在较不显眼的位置。如果这样做过于笨拙，那么用户只需再点击一下就能回答他的问题。第一个后续问题之后的后续问题也是如此，以此类推。\n\
  \n如果在同一个仪表板中回答所有问题过于繁琐，你可能需要为每个层级树制作一个单独的仪表板。这里的衡量标准是思考什么对用户来说最容易、最自然。目标是让仪表板或演示的顺序遵循受众的思维过程。\n\
  \n在本章后面，我们将使用一个IoT数据集来完整演示一个示例。\n\n## 为IoT数据设计可视化分析\n\n我们将回顾一些在设计可视化分析时的重要考虑因素，特别是针对IoT数据。\n\
  \n### 利用布局位置传达重要性\n\n布局位置暗示了什么是重要和首要的；你应该利用这一点来更有效地与受众沟通。在西方文化中，视线从视图的左上角开始。这是由于多年来从左到右、从上到下阅读的习惯。这是人眼习惯性最先看的地方。把关键信息放在这里：也就是起点问题的答案。\n\
  \n当你在视图中向右下方移动时，按照可视化（包括表格和文本）在问题树中的位置顺序来放置它们。这样将顺应视线的移动和受众的思维过程：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_229_0.png)\n\
  \n在同一视图中展示多个可视化时的推荐布局顺序\n\n在其他文化中，应用相同的概念，但要遵循与阅读顺序一致的位置顺序。例如，在巴基斯坦，乌尔都语是从右到左书写的——因此最重要的信息应该放在右上角。\n\
  \n### 使用颜色突出重要数据\n\n颜色也是一种强有力的方式，可以向受众传达哪些内容应该被理解为重要信息。不过要谨慎使用，因为同一视图中颜色过多会让人困惑，并削弱其影响力。\n\
  \n### 使用单一颜色传达重要性的效果\n\n为了重申颜色（如果只有灰度，则是灰色阴影）可以有多么强大，我们来看一个示例。在下图中，浏览这些数字并数一数你看到了多少个6。你数出了几个？花了多长时间？\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_230_0.png)\n\n一组随机数字。数一数6出现了多少次。\n\n\
  现在，我们取同一张图片，用颜色将重要信息（数字6）放在前景，将较不重要的信息（其他数字）放在背景，并通过淡化为一层灰色来处理。\n\n再看修改后的图片，你数出了多少个6？花了多长时间？你会发现，当关键数据用颜色突出显示时，做这件事要容易得多、快得多。对你的受众也这样做，你就能让他们更容易理解关键信息：\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_230_1.png)\n\n同一组随机数字，其中数字6用颜色突出显示。改编自Cole\
  \ Nussbaum Knaflic的著作《用数据讲故事》（Storytelling with Data）。\n\n### 在多个可视化之间保持一致\n\n在演示或一系列仪表板中，务必保持颜色和格式的一致性。如果平均温度在第一个图表中用蓝色实线显示，那么在所有后续图表中也应该用蓝色实线显示。即使图表类型改变，也要保持颜色一致。如果折线图中压力传感器的趋势线是蓝色的，那么在后续的散点图中，数据点也应该是蓝色的。\n\
  \n这种一致性可以避免受众在不同视图之间需要重新适应。它还有助于防止误解，因为人们很容易默认相同的颜色具有相同的含义。\n\n### 让图表易于解读\n\n对于IoT数据，时间序列分析非常常见。分析IoT传感器值随时间变化的趋势，对技术支持、市场营销、质量和工程等岗位的人员都很有用。时间序列图比帕累托图或饼图能更有效地传达趋势数据。由于你会经常使用它们，因此尽可能让它们高效就显得很重要。创建图表时，要记住一些要点，以帮助你的受众轻松得出你预期的结论。\n\
  \n在大多数情况下，你审视数据的方式远比提供给受众的方式多得多。你选择了最能传达你从数据分析中所获见解的图表。要让受众容易理解。\n\n以下是一些可以有所帮助的方法：\n\
  \n- **突出关键数据**：让图表中的关键趋势线明亮醒目。在表格中，将你认为最重要的那一行加粗。让它一目了然。这并不是在侮辱他们的智商，而是在为他们节省时间并尽量减少误解。\n\
  - **清晰地标注图表元素**：为图表设定清晰的标题，并让字体足够大、易于阅读。确保坐标轴有标注，并避免使用缩写。\n- **指出关键信息**：在图表上圈出你希望确保受众注意到的区域。画一个箭头指向该区域，并添加文字说明应如何解读。如果12月份平均温度出现尖峰，是因为该地区创纪录的高温，而不是系统问题，那么就把它圈出来并加上注释。这样受众就不必再提出疑问或自己去调查了。\n\
  \n\n\n\n\n## 使用 Tableau 创建仪表板\n\nTableau 使从您已创建的可视化分析选项卡中组装仪表板变得轻松。我们将使用它来基于第 6\
  \ 章 *了解您的数据 - 探索物联网数据* 中的天气站数据示例进行构建。在构建仪表板的过程中，我们还将逐步介绍问题层次结构流程。\n\n### 仪表板演练\n\
  \nTableau 还有一个名为 **Tableau Server** 的 Web 服务器软件，可让您轻松地从桌面软件发布仪表板，以便通过浏览器查看。其他用户然后可以轻松与其交互。虽然\
  \ Tableau Server 超出了本书的范围，但您很可能希望将创建的仪表板发布到它上面。\n\n### 问题层次结构示例\n\n对于这个简单示例，我们假设受众是科罗拉多州政府用水规划小组。该小组希望了解有多少气象站报告降水信息，以及信息被捕获的程度如何。以下步骤展示了如何将其制成问题树：\n\
  \n- **步骤 1：列出受众希望对分析提出的问题：**\n  - 与上个月相比，报告降水的站点数量是否发生了变化？\n  - 总共有多少个站点发送了降水数据？\n\
  \  - 站点位于何处？\n  - 有多少个站点报告了显著降雨？\n  - 每个站点的日汇总中是否有任何奇怪之处可能表明存在问题？\n  - 上个月州内的哪些地区下了一些好雨？\n\
  - **步骤 2：概括问题并合并：**\n  - 报告可用降水数据的站点数量趋势如何？\n  - 有多少个站点报告数据？\n  - 在该期间报告了可用数据的站点位于何处？\n\
  \  - 在该期间是否有站点报告了显著降雨？\n- 是否存在特定站点的异常降水值？\n- 在该期间报告了可用数据的站点位于何处？（与列表中前面类似的问题合并）\n\
  - 步骤 3：确定起始问题：\n  - 根据与用水规划小组的对话，您确定他们的第一个想法只是简单地检查报告 15 分钟降水数据的站点数量。\n  - 起始问题：有多少个站点报告数据？\n\
  - 步骤 4：将问题组织成问题树图：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_233_0.png)\n\n气象站问题层次结构\n\
  \n## 将可视化与思维过程对齐\n\n在 Tableau 中创建之前，先思考需要哪些可视化以及如何排列它们。最重要的东西，即起点，应该是最先让受众看到的东西。如果仪表板中要包含多个可视化，它应位于屏幕的左上部分。\n\
  \n由于只需一个简单的计数即可回答该问题，这可以只是一个数字。无需图表。您应该将其做得很大，以便立即注意到。使其大到可能令人不舒服的程度，受众就会显而易见地知道它是视图中最重要的信息，而无需指出这一点。\n\
  \n需要报告站点数量的趋势，以便受众能够了解随着时间的推移是否有更多或更少的站点报告可用数据与总站点数量相比。这与第一个后续问题一致。按月趋势应该有效。\n\n\
  然后，对于任何给定时期，用水规划小组希望知道报告站点的地理位置以及该时期站点是否有显著降水。他们还希望对州内有显著报告降水的地点有一个大致了解。地图是容纳大量空间信息并易于理解的一种好方法。这与次要后续问题一致。\n\
  \n对于任何站点或区域内的站点组，规划小组希望能够查看每日趋势，以便快速检测任何异常情况以进行进一步调查。这与最后一个后续问题一致。现在，我们可以一次构建一个视图，然后将它们组装成仪表板。\n\
  \n## 创建单个视图\n\n对于第一个视图，使用 Tableau 连接到第 6 章 *了解您的数据 - 探索物联网数据* 中的 15 分钟降水数据集。起始问题可以通过计算数据集中唯一站点的数量来回答，而不管值的有效性如何。设置一个名为\
  \ Number of Stations 的计算字段，使用公式 COUNTD([Station])，它将基于唯一站点的不同计数进行聚合。将 Number of\
  \ Stations 聚合拖到 Marks 架中的文本框。使数字变大且加粗，以便首先看到。\n\n![](img/9f2a55db1236f995dcd9392acbc82910_234_0.png)\n\
  \n下一个视图应与关于报告有效值的 **Number of Stations** 趋势的后续问题一致。由于受众对长期趋势感兴趣，因此按月分组是合适的。此时，让我们将\
  \ **Qpcp** 重命名为更好的描述。根据数据集文档，该值代表以英寸为单位测量的降水量。我们将 **Qpcp** 重命名为 **Amount of Precipitation\
  \ (inches)**。同时过滤掉 **Qgag** 或 **Qpcp**（现称为 **Amount of Precipitation (inches)**）中具有极端值的记录。\n\
  \n设置测量日期以显示月份和年份。将 **Number of Stations** 字段拖到 **Rows** 架以显示趋势。与总 **Number of Stations**\
  \ 的隐式比较，因此通过将 **Number of Stations** 拖到 **Marks** 架中的标签框使值可见。\n\n![](img/9f2a55db1236f995dcd9392acbc82910_235_0.png)\n\
  \n按月趋势视图\n\n最后，通过显示每个站点的每日汇总值来回答层次结构中的最后一个问题，即异常降水值。您在第 6 章 *了解您的数据 - 探索物联网数据* 中的数据调查中了解到，异常值可以通过按站点的每日条形图轻松找到。\
  \ resulting visual 应类似于以下屏幕截图：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_237_0.png)\n\
  \n按站点查看的每日趋势\n\n## 将视图组装成仪表板\n\n下一步是创建一个新的仪表板选项卡。将大小设置为 **Generic Desktop (1366\
  \ x 768)**。\n按本章前面讨论的优先级顺序添加四个视图。初始\n仪表板应如下所示屏幕截图：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_238_0.png)\n\
  \n使用 Tableau，您可以添加仪表板操作，允许用户根据在源视图中单击的内容过滤其他视图。遵循问题层次结构，在按月趋势视图中单击每月站点计数条应过滤地图视图。对地图视图中站点的选择应过滤每日趋势视图。\n\
  \n转到菜单栏中的 dashboards 并选择 Actions... 以向仪表板视图添加几个操作。从按月趋势视图向地图视图添加一个过滤器，链接字段为 MONTH([Measurement\
  \ date])，当选择条时生效。对地图视图执行相同操作，目标为每日趋势视图，链接字段为 Station：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_239_0.png)\n\
  \n添加仪表板操作\n\n现在，仪表板用户可以调查测量月份，以快速了解哪些气象站正在报告数据。他们还可以按每日汇总降水值查看一个站点或一组站点，以识别异常结果。以下屏幕截图示例显示了\
  \ 2013 年 11 月报告站点的地图位置以及丹佛地区几个站点的每日趋势：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_240_0.png)\n\
  \n仪表板交互示例\n\n## 创建和可视化警报\n\n物联网数据本质上是有噪声的。经常会出现无效和缺失值的情况。这需要持续的警惕以在发生时识别和纠正数据问题。更正然后可以在原始数据的转换中处理，也可以在设备软件和设计中处理。\n\
  \n无论哪种方式，问题检测得越快，就能越快解决。对于物联网数据，请将坏数据视为很少能收回的损失的资金。通过快速识别和纠正问题来最大限度地减少损失。\n\n\n\n\
  \n\nDashboards can also be created for this purpose by following the same process\
  \ we introduced in this chapter. Think about what you want to watch out for and\
  \ set up an alert view to identify it for you.\n\n## Alert principles\n\nThere are\
  \ some principles to follow when designing an alert system, even a simple one that\
  \ will be part of a dashboard:\n\n- **Balance alert sensitivity to minimize false\
  \ positives**: People will learn quickly to ignore alerts if they rarely identify\
  \ an actual problem. This has to be balanced against missing too many real issues\
  \ though. A cost benefit calculation can be used to help in this decision.\n- [*cost\
  \ of investigating a problem*] * [*number of alerts*] < [*cost of actual problem*]\
  \ * [*probability of true positive*]\n- The left side of that equation should be\
  \ noticeably less than the right side.\n- **Be wary of alert fatigue**: A long list\
  \ of continuous alerts is daunting, and human brains tend to become conditioned\
  \ over time to recognize it as a normal situation. Alerts will start to become background\
  \ noise and will not get a response. Anyone with an Android smartphone knows how\
  \ this feels - too many alerts are exhausting. There does not need to be an alert\
  \ for every problem. Keep it to a manageable amount for the big ones.\n- **Make\
  \ alerts like a to-do list**: A user should not have to search for where the problem\
  \ is; it should be listed out for them if there are any. If there are no issues\
  \ discovered, a blank list can be comforting - like leaving work an hour early!\n\
  - **Incorporate a tracking system for alert responses**: Nothing is more frustrating\
  \ than spending a couple of hours investigating a problem someone else has already\
  \ discovered and corrected.\n\n## Organizing alerts using a Tableau dashboard\n\n\
  A simple example can highlight how to use a dashboard for alerting purposes. Tableau\
  \ server has an email functionality that a user can subscribe to that will email\
  \ an image of the dashboard at a regular interval with an embedded link back to\
  \ the interactive dashboard. This can then be read and digested like a morning newspaper.\n\
  \nYou learned while investigating the 15 minute precipitation dataset that there\
  \ were measurement values that represented a state instead of an actual reading.\
  \ In these cases, the value was either -9999 or 999.99. What we would want to see,\
  \ if we were relying on this data on a daily basis, is that a station reports valid\
  \ precipitation measurements and little to no non-measurement values. We can organize\
  \ a simple question hierarchy to represent our thinking process:\n\n![](img/9f2a55db1236f995dcd9392acbc82910_242_0.png)\n\
  \nAlert question hierarchy for stations reporting invalid precipitation data\n\n\
  We can create an alert dashboard to monitor this on a daily basis. This will allow\
  \ quick identification of a problem. We will start by creating four additional calculated\
  \ fields in the following order:\n\n### Name: Precip Accumul Value Validity\n\n\
  ### Calculation:\n\n```\nCASE [Qgag]\n    WHEN -9999 THEN\n        \"Invalid\"\n\
  \    WHEN 999.990 THEN\n        \"Invalid\"\n    ELSE\n        IF [Qgag] >= 0 AND\
  \ [Qgag] <20 THEN\n            \"Valid\"\n        ELSE\n            \"Invalid\"\n\
  \        END\nEND\n```\n\n### Name: Precip Value Validity\n\n### Calculation:\n\n\
  ```\nCASE [Amount of Precipitation (inches)]\n    WHEN -9999 THEN\n        \"Invalid\"\
  \n    WHEN 999.99 THEN\n        \"Invalid\"\n    ELSE\n        IF [Amount of Precipitation\
  \ (inches)] >= 0 AND [Amount of Precipitation (inches)] <20 THEN\n            \"\
  Valid\"\n        ELSE\n            \"Invalid\"\n        END\nEND\n```\n\n### Name:\
  \ Invalid Count\n\n### Calculation:\n\n```\nIF [Precip Accumul Value Validity] =\
  \ \"Invalid\" AND [Precip Value Validity] = \"Invalid\" THEN\n    1\nELSE\n    0\n\
  END\n```\n\n### Name: Valid Count\n\n### Calculation:\n\n```\nIf [Invalid Count]\
  \ = 0 THEN\n    1\nELSE\n    0\nEND\n```\n\n## Summary\n\nIn this chapter, we discussed\
  \ common mistakes when creating visuals for IoT data. Some tips were given to avoid\
  \ making them. We introduced a method to develop dashboards and visualizations to\
  \ communicate analytics to an audience. The method has the goal of aligning the\
  \ visuals to the thought process of the person interacting with them.\n\nWe reviewed\
  \ the use of position on a dashboard to convey importance. The most important piece\
  \ of information should be in in the upper-left part for cultures that read left\
  \ to right. Color can also be used effectively to highlight key information to the\
  \ audience.\n\nTableau was used to demonstrate how to quickly create a dashboard\
  \ to communicate your analytics in an interactive way. We walked through an example\
  \ with the IoT weather data continued from a previous chapter. Some principles of\
  \ alerting were reviewed along with an example using Tableau.\n\nFor further exploration,\
  \ not discussed here but worthwhile for you to learn, there are also some great\
  \ visualization packages in R and Python. The author recommends *ggplot* for R and\
  \ *Seaborn* for Python.\n"
- "## Applying Geospatial Analytics to IoT Data\n\n\"I know it has been tough since\
  \ Willard left, but I have some good news; we will be getting you some help.\" These\
  \ words are coming to you accompanied by a concerned, paternal look from the Vice\
  \ President of Connected Product Development, who is standing in your cubicle.\n\
  \nWillard was your boss, now your former boss. He left recently to join another\
  \ company as Head of their IoT division. They were highly impressed with his accomplishments\
  \ building up a cloud-based IoT analytics capability, which was all your idea, of\
  \ course, but *c’est la vie*.\n\nNow, with your boss gone, the VP and other executives\
  \ are worried about the momentum stalling. You are a little bit miffed at this since\
  \ you had to twist your boss's arm to get him to go along with everything in the\
  \ first place. *Look on the bright side*, you tell yourself, *at least you are getting\
  \ some help*.\n\nHe continues, \"We want to up the ante, none of the competition\
  \ is aggregating their thermostat data and selling it to power companies. Maybe\
  \ the new guy can figure out how to do that.\"\n\n*Ha*, the new guy. \"I got this,\
  \ I developed what we have so far. I can certainly handle this,\" you state confidently,\
  \ holding his gaze. \"I've been looking for an excuse to do a little geospatial\
  \ anyway.\"\n\nYou feel capable now; it is time they started giving you some credit.\
  \ But you are not quite sure how to do it, as it seems a little daunting. The power\
  \ companies are going to have service areas that do not stick to state boundaries\
  \ or zip codes. You will need to somehow draw the service areas on a map and then\
  \ find the devices in the area. This sounds like a lot of manual work.\n\n\"Well,\
  \ we will see. I have lots of ideas if you can pull this one off,\" he replies.\
  \ With this, he turns around and strolls assuredly down the hallway on his way to\
  \ the next meeting. You hesitate for a second wondering if he knew all along that\
  \ you were the brains behind the IoT analytics and just manipulated you into putting\
  \ all your energy into his project. Then you shake your head thinking surely not,\
  \ and get back to work.\n\nThis chapter is about leveraging the field of geospatial\
  \ analysis to enhance IoT analytics. IoT devices are sometimes attached to equipment\
  \ that moves around geographically. Even if this is not the case, devices will probably\
  \ have diverse geographic locations when deployed. This creates an opportunity to\
  \ find patterns and develop valuable services by using location based analysis.\
  \ We will introduce some key concepts and technology for geospatial analytics.\n\
  \nThis chapter covers the following topics:\n\n- The benefit of geospatial analytics\
  \ for IoT\n- Geospatial analytics basics:\n  - Welcome to Null Island\n  - Coordinate\
  \ Reference Systems\n  - Python for geospatial analysis\n- Vector-based methods:\n\
  \  - A bounding box\n  - Contains\n  - Buffers\n  - Simplify\n  - The vector summary\n\
  - Raster-based methods\n- Storing geospatial data:\n  - File formats\n  - Spatial\
  \ extensions for relational databases\n  - Geospatial data in HDFS\n  - Spatial\
  \ indexing\n\n\n\n\n- 处理地理空间数据：\n  - 地理空间分析软件：\n    - ArcGIS\n    - QGIS\n    -\
  \ ogr2ogr\n  - PostGIS 空间函数\n  - 地理空间与大数据\n- 解决污染报告问题\n\n## 为什么物联网需要地理空间分析？\n\n\
  设想你的公司销售一种测量空气污染物的设备。它支持联网，并使用 MQTT 协议定期将数据传回公司。该产品的目标市场是具有环保意识的消费者，他们既希望测量自家附近的污染物，也希望为环境的集体监测做出贡献。\n\
  \n其价值主张是：消费者可以免费获得本地空气质量分析，代价是捐出他们的数据，以支持一项他们很可能本来就认同的事业。你的公司计划将高质量空气污染数据的分析结果进行汇总和打包，出售给政府和私人组织。\n\
  \n由于该设备通过多种零售渠道间接销售给消费者，公司最初并不知道设备的位置。消费者购买后会将设备连接到互联网，然后输入自己的地址。此时便可以确定设备位置。\n\n\
  该设备配备多个传感器，用于测量空气中不同污染物的浓度。其中一个传感器测量二氧化氮（NO2）的浓度。NO2 本身不仅是一种有毒气体，还会产生更具破坏性的副作用。它会促进酸雨和光化学烟雾的形成，并且是臭氧等其他有害二次空气污染物的前体。\n\
  \n下图展示了 Aeroqual 公司制造的二氧化氮传感器和二氧化氮分析模块的一个示例：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_249_0.png)\n\
  \n二氧化氮传感器和分析仪。来源：Aeroqual\n\nNO2 是由化石燃料燃烧产生的。在城市地区，主要来源通常是机动车尾气，但该气体也可能来自发电厂、制造设施和焊接作业。\n\
  \n你的公司希望构建并销售一个数据包，根据距州际公路的距离汇总 NO2 水平；同时希望将结果数据按美国 115 个国会选区进行聚合。公司认为，国会游说者会愿意为这些信息支付高价。\n\
  \n这项任务起初可能看似令人生畏，因为你所知道的设备位置仅仅是客户注册的地址。最先想到的可能是人工流程：在地图上逐一查看每个设备的位置，并根据其与最近州际公路的距离进行分类。当你有\
  \ 50 万台设备时，这将耗费大量人力且成本高昂。\n\n幸运的是，地理空间分析可以高效地完成这类分析。我们将介绍几个概念，然后回到这个示例，展示如何解决它。\n\
  \n所有位置都是相对于某个其他起点来确定的。要精确表示一个位置，你需要知道起点在哪里，以及从该起点确定位置的框架。实现这一点有多种表示方法。这就是 **坐标参考系（CRS）**\
  \ 发挥作用的地方。\n\n## 坐标参考系\n\n坐标参考系，也称为 **空间参考系（SRS）** 或 **地图投影**，用于标识将类似球体的三维地球转换为平面\
  \ X、Y 坐标面时所使用的方法。换句话说，它解释了用何种方法将三维投影到二维表面。\n\n这样的定义方式有成千上万种，每种都有自己的优缺点。每种定义的方法都是一个独立的\
  \ CRS，其中最常见的是 **1984 年世界大地测量系统** 或 **WGS 84**，它被 **全球定位系统（GPS）** 所使用。\n\n为了正确确定位置并准确计算诸如两点之间表面距离之类的数据，必须知道一组空间数据的\
  \ CRS。它通常会被标识并作为文件或地理空间数据库的一部分进行存储。只要两个 CRS 都已知，就可以相互转换。\n\n## 地球并不是一个球体\n\n世界不是一个完美的球体。它是一个椭球体，而且像中年男人一样，中部隆起。这意味着，对地理空间数据使用简单的球体几何计算不会完全准确。\n\
  \n随着两点间距离的增加，使用计算球面距离的方法（例如用于大圆距离计算的 haversine 公式）会变得越来越不准确。你仍然可以使用 haversine 方法计算短距离，精度损失不大，但应避免用于较长距离。\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_251_0.png)\n\nhaversine 公式。来源：Wikipedia.org\n\
  \n以下 R 代码可用于计算地球上两点的 haversine 距离。请记住，它在长距离上并不完全准确。相反，应利用了解 CRS 的代码包和数据库系统，它们能够使用\
  \ CRS 精确计算空间数据。这段 R 代码使用了相距很远的两个点，让你了解该方法的相对不准确性。两点之间的实际距离为 12,935 千米：\n\n```\n\
  #code adapted from RosettaCode.\n\n#Coordinates for the two points\n#Chicago, USA\
  \ O'Hare airport (ORD)\nPoint1Lat = 41.978194\nPoint1Long = -87.907739\n\n#Coordinates\
  \ for Chhatrapati Shivaji International Airport near Mumbai,\nIndia airport (BOM)\n\
  Point2Lat = 19.0895595\nPoint2Long = 72.8656144\n\n#convert decimal degrees to radians\n\
  degrees_to_rad <- function(deg) (deg * pi / 180)\n\n# Volumetric mean radius is\
  \ 6371 km for the Earth, see\nhttp://nssdc.gsfc.nasa.gov/planetary/factsheet/earthfact.html\n\
  # The diameter is thus 12742 km\n\n#function to calculate great circle distance\
  \ using haversine method\ngreat_circle_distance <- function(lat1, long1, lat2, long2)\
  \ {\na <- sin(0.5 * (lat2 - lat1))\nb <- sin(0.5 * (long2 - long1))\n12742 * asin(sqrt(a\
  \ * a + cos(lat1) * cos(lat2) * b * b))\n}\n\n#calculate distance for the two points\n\
  haversine_distance <- great_circle_distance(\ndegrees_to_rad(Point1Lat), degrees_to_rad(Point1Long),\
  \   # Nashville\nInternational Airport (BNA)\ndegrees_to_rad(Point2Lat), degrees_to_rad(Point2Long))\
  \  # Los Angeles\nInternational Airport (LAX)\n\n#result shown in kilometers\nhaversine_distance\n\
  # 12,942.77km\n```\n\n有多种方法可以针对地球的实际形状进行调整。WGS 84 CRS 使用了一些参数来提高投影的精度。下表总结了这些参数：\n\
  \n| 参数 | 符号 | 值 |\n|---|---|---|\n| 地球扁率因子 | 1/f | 298.257223563 |\n| 地心引力常数 | GM\
  \ | 3986004.418 10^8 m³/s² |\n| 标称平均角速度 | ω | 7292115 10^-11 rad/s |\n| 半长轴 | a\
  \ | 6378137.0 m |\n\nWGS 84 定义参数。来源：联合国外层空间事务厅\n\n尽管你接触到的 WGS 84 CRS 坐标大多是二维的，但它实际上是地球的三维表示。起点基于地球质心。下图来自国防测绘局（Defense\
  \ Mapping Agency），展示了其表示方式：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_253_0.png)\n\
  \nWGS 参考框架，来自国防测绘局的 DMA 技术报告 TR8350.2-b（1987 年 12 月 1 日第二次印刷）第 1-5 节 PDF，作为 DoD\
  \ WGS 84 技术报告第 2 部分（参数、公式和图形）的补充。http://earth-info.nga.mil/GandG/publications/tr8350.2/TR8350.2-b/Sections%201-201-5.pdf.\
  \ 公共领域，https://commons.wikimedia.org/w/index.php?curid=41796676\n\n强调这一细节不仅是为了让你了解地图投影背后的复杂性，更是为了说服你利用该领域数百年来已经完成的工作。不要试图重复这一工作；要利用已有的成果。\n\
  \n利用地理空间分析领域已有成果的一个好方法是使用 Python 地理空间库。R 语言也有很多优秀的包可以使用，但 Python 的选择更多。由于 Python\
  \ 在地理空间界长期使用，这些库往往更加成熟。\n\nPython 通常也比 R 具有更好的扩展性，因此更适合大规模、计算密集型的处理。地理空间计算可能变得相当密集，而物联网数据——正如我们在本书中已经熟知的那样——会在短时间内变成大规模任务。\n\
  \n基于这些考虑，Python 非常适合地理空间分析。在本章中，我们将把重点从 R 代码转向 Python 代码。对于大数据分析，你应该对两者都熟练掌握。开始使用\
  \ Python 的一个简单方法是从 https://www.continuum.io/downloads 下载 Anaconda 包。Anaconda 包含\
  \ Python、R 以及超过 720 个包，其中包括 100 多个最流行的数据科学包。\n\n它还包含一个名为 Spyder 的 Python IDE 和基于浏览器的笔记本\
  \ Jupyter。Jupyter 对物联网分析很重要，因为它可以在 Hadoop 集群上运行，让你能够在分布式环境中开发 Python 代码，而无需通过控制台运行代码。它还可以用于以\
  \ Python、Scala 或 R 开发 Spark 应用程序。Spark 与跨集群安装的 Python 地理空间库相结合，提供了扩展地理空间分析的能力。\n\
  \n## 基于矢量的方法\n\n地理空间分析和文件类型主要有两大类：矢量和栅格。矢量主要处理形状，而栅格则更侧重于网格。由于灵活性和高效存储，矢量更为常见。矢量可以简单地用一组点来定义。矢量几何有三种主要类型：\n\
  \n- **点：** 可以用二维或三维来定义。这就是你可能非常熟悉的常用经纬度坐标对。前面 R 代码中使用的机场位置就是点的示例。\n\n\n\n- **线（Line）或线串（LineString）：**\
  \ 线串由一组点定义，点的顺序很重要。多条线串可以存储在一起；在这种情况下，它理所当然地被称为**多线串（MultiLineString）**。河流系统或道路网络就是多线串的示例。包含美国州际公路网络多线串的文件可以从爱荷华大学地理信息科学图书馆下载（`ftp://ftp.igsb.uiowa.edu/gis_library/USA/us_interstates.htm`）。下图是该文件的可视化效果：\n\
  \n  ![](img/9f2a55db1236f995dcd9392acbc82910_255_0.png)\n\n  美国州际公路系统。来源：美国环境系统研究所公司（ESRI）\n\
  \n- **面（Polygon）：** 面被定义为一个闭合的点网络。点的顺序很重要，起点也会在终点处重复出现，从而闭合形状。多个面可以存储在一起，这被称为——你猜对了——**多面（MultiPolygon）**。一个示例是表示印度尼西亚国家的多面。根据《CIA世界概况》，印度尼西亚由13，466个岛屿组成：\n\
  \n  ![](img/9f2a55db1236f995dcd9392acbc82910_256_0.png)\n\n  印度尼西亚的多面图像\n\n有多个为地理空间分析开发的Python包。其中与矢量相关的两个最流行的包是*shapely*和*fiona*。*Shapely*拥有几种计算地理算法，而*fiona*则用于与矢量文件交互。你可以从命令行使用`conda`或`pip\
  \ install`安装这两个包，如下面的代码所示。如果你安装了Anaconda发行版，请使用`conda install`：\n\n```\nconda install\
  \ shapely\n```\n\n或者你可以使用以下命令：\n\n```\npip install shapely\n```\n\n我们将回顾一些关键的矢量概念以及实现这些概念的*shapely*代码。这里涉及的内容远比我们介绍的要多，但这应该能为你提供一个良好的起点。使用*fiona*将结果保存到文件中。\n\
  \n## 边界框（Bounding Box）\n\n基于矢量的分析中一个重要的概念是**边界框**。它在地理空间处理的许多方面都发挥作用，包括空间索引。相比于不规则的线串或面，盒状形状在计算上更容易搜索和操作。先将对象放入一个盒中，再根据其具体形状进行精细调整，是高效搜索的常见模式。\n\
  \n边界框就是能够包含所讨论的矢量对象的最小矩形。这通常被称为**最小外接矩形（MBR）**，是许多地理空间搜索算法的基础。下图展示了多边形集合的MBR：\n\n\
  ![](img/9f2a55db1236f995dcd9392acbc82910_257_0.png)\n\n一组多边形的最小外接矩形。来源：维基共享资源\n\n\
  可以使用*shapely*通过`bounds`方法确定MBR：\n\n```python\n#导入线串类\nfrom shapely.geometry import\
  \ LineString\n\n#从一系列点创建线串\nMBRline = LineString([(1, 0),(1, 1),(3,5),(2,2)])\n\n\
  #确定MBR边界框\nMBRboundingBox = MBRline.bounds\n\n#输出结果\nMBRboundingBox\n\n#(1.0, 0.0,\
  \ 3.0, 5.0)\n```\n\n## 包含（Contains）\n\n你还可以使用`contains`函数测试一个空间对象是否包含另一个对象，例如一个点是否在一个面内，或一个城市是否在一个州内。这可以用来确定某个位置是否位于某个邮政编码、省份或国会选区中。`within`函数则相反，它确定对象是否在另一个对象内部：\n\
  \n```python\n#导入面类\nfrom shapely.geometry import Polygon\n\n#创建一个正方形面\npolysquare\
  \ = Polygon([(0,0),(0,2),(2,2),(2,0),(0,0)])\n\n#测试面是否包含该点\nprint(polysquare.contains(Point(1,1)))\n\
  \n#测试点是否在该面内\nprint(Point(1,1).within(polysquare))\n\n#测试其他点是否在该面内\nprint(Point(5,7).within(polysquare))\n\
  ```\n\n## 缓冲区（Buffer）\n\n缓冲区会按指定量扩展几何对象。如果是线串，缓冲区将创建一个多边形，其形状为线串两侧按缓冲区量扩展后的形态。为了说明这一点，下面的截图展示了芝加哥附近美国州际公路系统1公里缓冲区的特写：\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_258_0.png)\n\n芝加哥附近美国州际公路1公里缓冲区特写\n\n\
  ## 膨胀与侵蚀（Dilation and erosion）\n\n在shapely中，正的缓冲区是膨胀，负的量则是侵蚀。膨胀如上文所述，而侵蚀则按缓冲区量缩小多边形。Shapely还提供了一些关于端帽形状（线端部的缓冲区区域）以及缓冲区自连接处的选项。下面展示了端帽和连接样式选项：\n\
  \n### shapely.geometry.CAP_STYLE\n\n| 属性 | 值 |\n|-----------|-------|\n| round \
  \    | 1     |\n| flat      | 2     |\n| square    | 3     |\n\n### shapely.geometry.JOIN_STYLE\n\
  \n| 属性 | 值 |\n|-----------|-------|\n| round     | 1     |\n| mitre     | 2    \
  \ |\n| bevel     | 3     |\n\n下面的代码展示了一个简单的缓冲区工作原理示例：\n\n```python\n#import linestring\
  \ class, cap and join styles\nfrom shapely.geometry import LineString, CAP_STYLE,\
  \ JOIN_STYLE\n\nunbufferedLine = LineString([(0, 0), (1, 1), (0, 2), (2, 2), (3,\
  \ 1), (1, 0)])\ndilatedBufferedLine = unbufferedLine.buffer(0.5, cap_style = CAP_STYLE.square)\n\
  erodedBufferedLine = dilatedBufferedLine.buffer(-0.3, join_style = JOIN_STYLE.round)\n\
  \n#Show the polygon detail. This gets more complicated than a line!\nprint(erodedBufferedLine)\n\
  ```\n\n下图有助于直观理解结果：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_260_0.png)\n\n缓冲区示例。来源：Shapely文档\n\
  \n## 简化（Simplify）\n\n有时，精确细节并非必要，使用更简化的几何对象可以加快计算速度。以我们的州际公路示例为例，一条完全贴合道路的线可能对特定用途来说没有必要。只要线大致接近，在应用1公里缓冲区时就能正常工作。降低对象的复杂性和大小可以带来巨大回报，尤其是在并行化的大数据环境中。在这种环境中，空间对象可能被保存在数百个节点的内存中，因此效率提升会产生很大影响。\n\
  \nShapely提供了`simplify`方法，在保留大部分原始形状的同时减少几何对象的大小和复杂性。`tolerance`变量控制简化程度，数值越大表示简化越多。下面的Python代码演示了其工作原理（此示例是之前缓冲区代码的扩展）：\n\
  \n```python\n#print area of polygon\nprint(erodedBufferedLine.area)\n#show number\
  \ of coordinates needed to define exterior of the polygon\nprint(len(erodedBufferedLine.exterior.coords))\n\
  \n#simplify\nerodedSimplified = erodedBufferedLine.simplify(0.05,\npreserve_topology=False)\n\
  \nprint(erodedSimplified.area) #note minimal change in area\nprint(len(erodedSimplified.exterior.coords))\
  \ #big reduction in coordinates\n\nprint(erodedSimplified)\n```\n\n## 矢量总结\n\n我们仅仅触及了可用于处理、操纵和分析基于矢量的几何对象的功能的皮毛。关于这个主题有整本整本的书籍，它们非常值得你花时间阅读，以深入了解如何增强你的物联网分析能力。\n\
  \n## 基于栅格的方法\n\n**栅格（Raster）**由排列成行和列的网格单元组成。可以把栅格想象成屏幕上的像素，只不过每个像素都由一个设定的地面距离来定义。栅格文件和图像文件之间有很多共同之处。栅格文件有时使用与图像文件相同的格式保存。图像通常直接从栅格文件生成；从天气预报到地形图，你随处可见这样的例子。\n\
  \n网格中单元的大小在概念上类似于图像的分辨率。与矢量数据不同，栅格包含其覆盖整个区域的信息。它适用于那些在整个区域都有值的现象，例如高程和温度。缺点则是会生成较大的文件大小。\n\
  \n每个单元的多个值可以作为数据集中的不同**波段（bands）**存储。这在概念上类似于彩色图像的RGB值。第7章“装饰你的数据——添加外部数据集以创新”中讨论的SRTM和数字高程模型（DEM）数据集就是栅格数据模型的示例。\n\
  \n处理栅格数据的主要Python包是*GDAL*。它可以与80多种不同的栅格文件类型交互，并包含读取和转换栅格数据的函数。操作栅格数据可能很复杂，超出了本书的范围。通过快速Google搜索可以找到一些很棒的教程。在大多数情况下，物联网分析会使用基于矢量的方法。\n\
  \n\n\n\n\n# 将地理空间分析应用于物联网数据\n\n栅格和矢量数据层可以组合使用。以下图片由 NOAA 提供，展示了它们如何共同用于现实世界的表示：\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_262_0.png)\n\n## 存储地理空间数据\n\n存储地理空间数据的方式有很多种。根据你的预期用途，文件系统格式或关系数据库可能是最合适的。我们将对两者进行介绍。\n\
  \n## 文件格式\n\n存储地理空间数据的格式有数百种。矢量数据最常见的是 ESRI shapefiles。shapefile 实际上由多个不同文件组成，主文件扩展名为\
  \ .shp。当提供 .shp 文件的位置时，大多数支持地理空间的软件和 Python 包都知道去查找其他所需文件。\n\n**GeoJSON** 是另一种可读的人类存储格式。它使用定义的\
  \ JSON 格式将矢量数据定义存储为文本。它易于阅读，但大小可能会变得很大。\n\n另一种表示矢量数据的方式，无论是在文件中还是在代码中，都是使用 **Well-known\
  \ text (WKT)** 和 **Well-known binary (WKB)** 格式。WKT 可读，而 WKB 不可读。WKB 在大小上提供了显著的压缩，因此通常是数据库存储的良好选择。它可以在读取时转换为\
  \ WKT。下面的表格总结了每种几何类型的 WKT 格式：\n\n| Geometry primitives (2D) |\n|---|---| \n| Type\
  \ | Examples |\n| Point | POINT (30 10) |\n| LineString | LINESTRING (30 10, 10\
  \ 30, 40 40) |\n| Polygon | POLYGON ((30 10, 40 40, 20 40, 10 20, 30 10)) |\n| Polygon\
  \ | POLYGON ((35 10, 45 45, 15 40, 10 20, 35 10), (20 30, 35 35, 30 20, 20 30))\
  \ |\n\n| Multipart geometries (2D) |\n|---|---| \n| Type | Examples |\n| MultiPoint\
  \ | MULTIPOINT ((10 40), (40 30), (20 20), (30 10)) |\n| MultiPoint | MULTIPOINT\
  \ (10 40, 40 30, 20 20, 30 10) |\n| MultiLineString | MULTILINESTRING ((10 10, 20\
  \ 20, 10 40), (40 40, 30 30, 40 20, 30 10)) |\n| MultiPolygon | MULTIPOLYGON (((30\
  \ 20, 45 40, 10 40, 30 20)), ((15 5, 40 10, 10 20, 5 10, 15 5))) |\n| MultiPolygon\
  \ | MULTIPOLYGON (((40 40, 20 45, 45 30, 40 40)), ((20 35, 10 30, 10 10, 30 5, 45\
  \ 20, 20 35), (30 20, 20 15, 20 25, 30 20))) |\n\nWell-known Text format examples.\
  \ Source: Wikipedia\n\n栅格数据最常见存储在 **Tagged Image File Format (TIFF)** (.tiff) 文件中。它也可以存储为\
  \ ASCII 网格文件，但文件大小是个问题。还有一些压缩格式，例如扩展名为 .sid 的 **Multi-resolution Seamless Image\
  \ Database (MrSID)** 和扩展名为 .ecw 的 **Enhanced Compression Wavelet (ECW)**。\n\n##\
  \ 关系数据库的空间扩展\n\n借助空间扩展，关系数据库可以支持在数据库表中存储几何数据并执行一些地理空间函数。这些通常不是标准安装的一部分，但可以通过管理设置启用或通过安装软件扩展来启用。\n\
  \n对于开源关系数据库管理系统 RDBMS，PostgreSQL 和 MySQL 都支持空间功能。PostgreSQL 是迄今为止最受欢迎的，也是功能最全面的。当为\
  \ PostgreSQL 启用空间组件时，通常被称为 PostGIS。你会看到这些术语可以互换使用。PostgreSQL 是 AWS 上受支持的 RDS 选项。空间扩展可以启用，将其转变为\
  \ PostGIS。\n\n对于闭源 RDBMS，Oracle (Spatial and Graph) 和 SQL Server 很受欢迎。Oracle 通常被认为是最有能力的。这些并不是唯一的选择，因为越来越多的数据库支持空间数据。Amazon\
  \ Aurora，一种在 AWS 上的 MySQL 兼容托管 RDS 数据库，最近已添加了空间支持。\n\n## 在 HDFS 中存储地理空间数据\n\nHDFS\
  \ 和 Hive 本身并不原生支持空间数据类型。不过一切都还没完，因为 HDFS 可以存储任何类型的文件，包括地理空间文件。几何图形可以以字符串 WKT 和二进制\
  \ WKB 形式存储。它们可以在检索时使用代码转换。Hive 表是模式即读，并支持用户定义函数 UDF。可以创建 UDF 来解释地理空间数据。\n\n事实上，有一些开源项目正是这样做的。其中一个名为\
  \ SpatialHadoop，可以在 http://spatialhadoop.cs.umn.edu/index.html 找到。另一个名为 spatial-framework-for-hadoop，可以在\
  \ GitHub 上找到 (https://github.com/Esri/spatial-framework-for-hadoop)。缺点是这些项目没有完全支持，并且不是\
  \ Cloudera 和 Hortonworks Hadoop 发行版的一部分。\n\n更稳健的方法是以 WKT 或 WKB 存储空间数据，并使用地理空间 Python\
  \ 包来操作它。\n\n## 空间索引\n\n世界很大。想象一下，如果你不知道某人的家庭住址、邮政编码，甚至他们居住的国家，要找到他们住在哪里。你必须拜访每一户人家，直到找到你要找的人，这将花费你剩余的时间，而且也不会很有趣。\n\
  \n幸运的是，地址允许快速识别某人居住地，通过识别国家、该国内的州或省、邮政编码以及可以开车前往的街道名称，直到找到他们的门牌号，门牌号通常沿街道按既定顺序排列。\n\
  \n空间数据库可能非常庞大，因此需要一种高效的几何搜索方法来提高响应时间。这就是空间索引发挥作用的地方。有多种方法可用于此。我们将介绍其中一种更流行的方法。\n\
  \n## R-tree\n\nR-tree 是一种空间索引方法，用于 PostGIS 和 Oracle 数据库。它利用边界框概念创建分层索引树。树是平衡的，因为所有分支都有相同级别的节点。为了理解基本\
  \ R-tree 索引是如何构建的，我们将通过一个简单示例进行说明。\n\n对于给定的几何集合，每个几何的 MBR 都会被定义。索引中保留的是每个的 MBR。以下图片显示了这些第一步的示例：\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_265_0.png)\n\nMBR for a set of shapes.\
  \ Source: OSGeo project\n\nR-tree 索引由 MBR 构建，使得较大的边界框包含一组较小的边界框，目标是优化最低层 MBR 的搜索时间。由此产生的边界框集合形成树层次结构，作为索引存储。然后使用索引树通过沿层次结构向下工作来快速找到匹配的几何。以下图片有助于可视化示例\
  \ R-tree 索引：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_266_0.png)\n\nR-tree index,\
  \ Source: Wikipedia\n\n像 PostGIS 这样的空间数据库可以轻松地对几何字段创建索引。以下 PostGIS 的简单 SQL 语句将构建\
  \ R-tree 索引。PostGIS 在 **Generalized Search Tree (GiST)** 层之上构建它以实现稳健性。GiST 是一种通用算法，可与多种索引方法一起使用。GiST\
  \ 的示例显示在以下代码中：\n\n```\n```sql\nCREATE INDEX [indexname] ON [tablename] USING GIST\
  \ ( [geometryfield] );\n```\n```\n\n还有一个名为 *rtree* 的 Python 包，可用于在代码模块的一部分中构建索引。这对于一些需要反复扫描一组几何图形的重型地理空间处理可能很有用。\n\
  \n## 处理地理空间数据\n\n专用软件可以帮助处理和可视化地理空间数据。这对于小数据和一次性分析很有用。即使你有大数据解决方案，使用这些工具也可以更有效地向他人传达你的发现。\n\
  \n## 地理空间分析软件\n\n我们将回顾最受欢迎的 **Geographic Information System (GIS)** 工具，以便你熟悉它们。它们是地理空间分析的有用支持工具。\n\
  \n## ArcGIS\n\nArcGIS 是付费 GIS 软件的事实标准。它由 ESRI 公司开发和维护。它具有令人惊叹的功能量，被大多数专业地理空间分析师使用。它由\
  \ ESRI 提供世界级支持，并且有许多培训选择。它链接到有用的数据集和地理空间分析能力，这些也由 ESRI 维护。\n\n\n\n\n\nArcGIS 可作为桌面应用程序或云服务使用。你可以注册\
  \ 60 天免费试用 (https://www.arcgis.com/features/free-trial.html)。你可以使用 ArcGIS 进行许多不同类型的分析，包括对你自己的自定义\
  \ shapefile 进行地理处理。以下示例展示了 ArcGIS 如何在典型的星期五下午 5 点，用于定义一组位置点 4 分钟车程范围内的多边形区域：\n\n\
  ![](img/9f2a55db1236f995dcd9392acbc82910_268_0.png)\n\n车程时间区域分析示例。来源：ArcGIS\n\n\
  ## QGIS\n\nQGIS 是开源且功能强大的桌面 GIS 软件。它与 ArcGIS 类似，但功能范围不及付费的 ESRI 软件。但价格合适，并且仍具有多种功能。它也可以用\
  \ Python 代码进行操作。关于它的文档非常丰富，并且有很多有用的书籍介绍如何使用它。\n\n你可以从项目网站下载并安装 QGIS (http://www.qgis.org/en/site/forusers/download.html)。如果你无法获得\
  \ ArcGIS，请务必保留 QGIS。QGIS 用于创建本书中的许多图像。你可以使用 QGIS 和 ArcGIS 直接连接到地理空间数据库，例如 PostGIS\
  \ 和 Oracle。以下图像展示了 QGIS 可以创建的示例：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_269_0.png)\n\
  \nQGIS 示例截图。来源：anitagraser.com\n\n## ogr2ogr\n\nogr2ogr 是 GDAL 库的一部分。它是一个命令行工具，用于将文件从一种\
  \ OpenGIS 简单要素参考实现 (OGR) 空间格式转换为另一种。它是一个功能简洁的工具，但被地理空间分析师广泛使用。命令行转换的通用格式如下例所示：\n\
  \n```\nogr2ogr -f \"file_format\" destination_data source_data\n```\n\n你可以用它将 PostGIS\
  \ 数据转换为 shapefile，或将 shapefile 加载到 PostGIS 中，例如。它支持将矢量数据单独转换为 90 多种文件格式。\n\n## PostGIS\
  \ 空间函数\n\nPostGIS 包含数十个可在标准 SQL 查询中引用的空间函数。以下表格提供了一些常用函数的概述：\n\n| Function | Description\
  \ |\n| --- | --- |\n| `ST_GeomFromText` | This returns a specified ST_Geometry value\
  \ from WKT representation. |\n| `ST_GeomFromWKB` | This creates a geometry instance\
  \ from a WKB geometry representation and optional SRID. |\n| `ST_Buffer` | This\
  \ returns a geometry covering all points within a given distance from the input\
  \ geometry. |\n| `ST_ConvexHull` | The convex hull of a geometry represents the\
  \ minimum convex geometry that encloses all geometries within the set. |\n| `ST_Intersection`\
  \ | This returns a geometry that represents the shared portion of geomA and geomB.\
  \ |\n| `ST_Simplify` | This returns a simplified version of the given geometry using\
  \ the **Douglas-Peucker** algorithm. |\n| `ST_Boundary` | This returns the closure\
  \ of the combinatorial boundary of this geometry. |\n| `ST_Transform` | This returns\
  \ a new geometry with its coordinates transformed to a different spatial reference.\
  \ |\n| `ST_Centroid` | This returns the geometric center of a geometry. |\n| `ST_ClosestPoint`\
  \ | This returns the 2-dimensional point on g1 that is closest to g2. This is the\
  \ first point of the shortest line. |\n| `ST_Contains` | This returns true if and\
  \ only if no points of B lie in the exterior of A, and at least one point of the\
  \ interior of B lies in the interior of A. |\n| `ST_Covers` | This returns 1 (TRUE)\
  \ if no point in geometry B is outside geometry A. |\n| `ST_Crosses` | This returns\
  \ TRUE if the supplied geometries have some, but not all, interior points in common.\
  \ |\n\nAWS 还提供了一个名为 **Redshift** 的托管 PB 级数据仓库服务。该服务在 `Chapter 3, IoT Analytics for\
  \ the Cloud` 中介绍。Redshift 不直接支持几何字段，但支持 Python UDF。你可以使用 Python 代码和 *shapely* 包创建\
  \ UDF，然后从 Redshift SQL 语句中调用它们。对于 Hive 和 Spark 也可以使用类似的策略。\n\nESRI 支持一个名为 **GP tools\
  \ for AWS** 的开源项目，该项目允许 ArcGIS 用户连接到 Amazon EMR 和 S3 数据源。该项目托管在 GitHub (`https://github.com/Esri/gptools-for-aws`)。\n\
  \n## 解决污染报告问题\n\n通过本章所学内容，你现在可以解决前面介绍的按国会选区划分的物联网污染传感器数据问题。使用 Python 代码或数据库中的空间查询函数（如\
  \ PostGIS）按照以下一般步骤操作：\n\n- 下载美国州际公路的 shapefile，例如爱荷华大学提供的美国国家交通图集州际公路 shapefile\
  \ (`ftp://ftp.igsb.uiowa.edu/gis_library/USA/us_interstates.htm`)。\n- 下载美国国会选区的\
  \ shapefile，例如美国人口普查局提供的 TIGER/Line Shapefile (`https://www.census.gov/cgi-bin/geo/shapefiles/index.php?year=2016&layergroup=Congressional+Districts+%282815%29`)。\n\
  - 使用 `ogr2ogr` 将 shapefile 加载到地理空间数据库，或使用 *fiona* 包在 Python 中加载。\n- 使用 *shapely*\
  \ 包或 PostGIS 中的 `ST_Buffer` 为州际公路 MultiLineString 添加 1 km 缓冲区。\n- 使用 Google Maps\
  \ 等地图 API 对每个设备地址进行地理编码以获取经纬度点对。这在 `Chapter 7, Decorating Your Data - Adding External\
  \ Datasets to Innovate.` 中有讨论。\n- 将物联网设备位置加载为 Point 几何。\n- 可选地，对点和国会选区多边形应用 R 树索引以加快计算速度。\n\
  - 查找位于缓冲州际公路多边形内的点。`contains` 函数就是一种方法。将这些点标记为在范围内。将剩余点标记为在范围外，以便用作比较。\n- 对于每个点，搜索包含它的国会选区多边形并跟踪结果。这将是利用之前创建的空间索引的好地方。\n\
  - 计算每个设备的污染值并与国会选区和州际公路缓冲区内外标签合并。\n- 透视并比较数据以编制报告。\n- 去要求加薪，你应得的！\n- 你还可以使用 `buffer`\
  \ 函数中的侵蚀选项创建识别多个距离范围的州际公路多边形。从最大的范围作为缓冲区开始，然后逐步侵蚀以获得每个范围级别。为每个范围创建缓冲多边形。先搜索最小的缓冲多边形，然后是下一个更大的，再下一个，依此类推。那些不在任何这些范围内的点就在范围之外。\n\
  - 去要求再加一次薪水！\n\n## Summary\n\n在本章中，你学习了如何使用地理空间分析来发现洞察并回答关于物联网数据的复杂问题。地理上分布的物联网设备进行地理空间分析的重要性得到了讨论。介绍了\
  \ CRS 概念以及 haversine 距离及其局限性。\n\n世界不是一个完美的球体。介绍了调整方法以便准确测量距离。讨论了用于地理空间分析的 Python\
  \ 函数，例如 `buffer` 和 `contains`，并提供了一些示例。\n\n存储和处理地理空间数据需要一些专门的处理。回顾了一些地理空间数据库和 GIS\
  \ 软件工具。还回顾了 PostGIS 空间函数。我们讨论了一些在大数据世界中利用地理空间分析的技巧。\n\n地理空间分析为以新颖创新的方式分析物联网数据提供了巨大机会。它可以帮助在嘈杂数据中发现模式。然后可以创建新服务，作为从数据中提取价值的另一种方式。\n"
- "## Data Science for IoT Analytics\n\n“由于你的小地理空间搜索技巧，收入上涨了 5%”，Connected Services\
  \ 副总裁说，“你知道你前老板的职位仍然空缺。也许我们应该从内部填补……”\n\n你的脉搏加快，你希望他能得出这个结论。在你的分析为公司带来的成果之后，你理应得到晋升。你现在有一名员工专注于地理空间分析。你可以想象，如果有一个完整的团队会怎样。\n\
  \n“不过我们一直在琢磨一件事，”他继续说，“有了我们收集的所有这些数据，我们应该能够利用机器学习模型来预测设备故障。有些人认为我们应该聘请外部咨询公司来处理所有事情。听起来很贵。我真希望我们能自己协调，使用我们自己选择的数据科学家……你认识可能胜任的人吗？”\n\
  \n他眨了眨眼，背着手，哼着布拉姆斯的曲调走开了。\n\n在本章中，我们介绍数据科学技术，如机器学习、深度学习和 ARIMA 预测。特别关注如何将这些方法与物联网数据一起使用。每个方法的核心概念都将回顾，并附有\
  \ R 中的示例。深度学习将被描述，并说明如何创建具有 TensorFlow 的 Amazon EC2 实例。\n\n本章涵盖了大量内容，所以系好安全带。\n\n\
  \n\n\n本章涵盖以下主题：\n\n- 机器学习（ML）：\n  - 核心概念\n  - 特征工程\n  - 验证方法\n  - 偏差-方差权衡\n  - 比较模型以找到最佳拟合\n\
  \  - 随机森林\n  - 梯度提升机\n  - 异常检测\n- 使用 ARIMA 进行预测\n- 深度学习：\n  - 使用物联网数据的用例\n  - 使用\
  \ TensorFlow 设置并运行一个简单的深度学习模型\n\n# 机器学习（ML）\n\n正如一位人类-蜘蛛混合体的睿智叔叔曾经说过，能力越大，责任越大。这对\
  \ ML 来说非常正确。出错的方式有很多。当在熟练从业者手中时，它确实是一种艺术形式。它可以大规模地做一些令人难以置信的事情，但它应该附带一个大大的警告标志。谨慎使用。保持偏执并验证，验证，再验证。\n\
  \n虽然我们将介绍一些核心概念并提供你可以自行运行的代码，但这是一个庞大的领域，有很多东西需要学习。要熟练且胜任地应用它需要数年时间。本章中的每个部分本身就是一本书。不，是一堆书。如果你计划在物联网数据上自行使用它，请阅读，阅读，再阅读，然后再读一些。本章旨在为你提供一个良好的基础，以便就该主题与数据科学家进行有意义的对话。\n\
  \n# 什么是机器学习？\n\n向一百位专家询问 ML 的定义，你很可能会得到一百个略有不同的答案。有些人会采取宽泛的观点，完全包含深度学习、人工智能，以及一些传统统计技术，例如最小二乘线性回归。其他人会很狭隘，将其定义限制在几种建模技术上，认为它与一个名为统计学习的相关领域是分开的。\n\
  \n有些人会说它在现实世界中根本不存在，只存在于过度炒作的媒体报道中。他们认为这不过是几十年来一直在做的传统统计分析。有些人会认为术语 ML 与术语人工智能完全可以互换，而其他人则认为它们是完全不同的东西。\n\
  \nML 是统计技术在有序步骤集中的应用（也称为算法）。统计技术很少是新的，许多已经存在几十年，有些超过一个世纪。许多 ML 方法也已经存在数十年了。发生变化的是计算能力的成本急剧下降以及计算能力的急剧增加。1980\
  \ 年需要数月才能计算的东西现在只需几秒或更短时间。\n\n随着一些强大的开源统计软件库的可用性，例如 R 和 Python，再加上现代计算硬件的低成本和可用速度，ML\
  \ 已变得在各种应用中切实可行。随着 ML 使用的增加，现有方法的改进和新算法的开发也随之而来。这导致预测能力显著提高，并迎来 ML 的黄金时代。\n\n我们将使用一个（希望不过度夸张）的类比来帮助你思考这个问题。使用传统统计技术时，你就像一名机械工程师，运用你对事物工作原理的专业知识和理解来定义一组相互配合的组件。你使用这些方法来显式构建你的统计模型。你根据对数据的测试和分析来定义每个组件的细节。\n\
  \n使用 ML 时，你更像一名农业工程师。数据模型的农夫。在本章中，我们将定义 ML 为一种方法，它具有三个一般组件，当结合在一起时，*grow* 从提供的土壤数据中生长出一个程序。这组统计技术\
  \ *learn* 决定目标值或类别的底层函数的表示。在这种情况下，学习是适应而不是认知，就像我们人类一样。你的计算机在任何时候都不会对这一切意味着什么有一点点概念——对它来说全是零和一。\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_277_0.png)\n\n你作为一名 ML 从业者。\n\n插图：Jim\
  \ Campbell；Inlander；https://www.inlander.com/spokane/farming-data/Content?oid=2136658\n\
  \n真正的底层函数永远无法真正知道。因此，该方法的准确性只能从新数据示例上的错误率推断出来。许多 ML 算法（实际上是一组算法）的目标是迭代地找到正确的杠杆组合以最小化这些错误率。如果\
  \ resulting ML 模型在这方面做得很好，则称其泛化良好。稍后会对此进行更多解释。\n\n任何 ML 模型都可以被视为具有三个相互关联的组件：\n\n\
  - 表示\n- 评估\n- 优化\n\n我们将在下一节中分别介绍每个组件。\n\n# 表示\n\n表示是模型以计算机可解释的方式正式构建的方式。示例有决策树、支持向量机和神经网络。ML\
  \ 模型通常以表示的名称命名。分类器是表示生成的可能模型集合中的一个实例。当你选择使用哪种表示时，你就决定了你的模型能够学习到的分类器的可能性范围。这种可能性范围被称为\
  \ **假设空间**。\n\n如果真正的（记住，*未知*）分类器模型不在假设空间中，就无法学习。大多数你将使用的表示模型都有一个很大的假设空间，所以这可能不会成为问题。但你应该意识到这一点，因为你可能需要扩展你的表示模型选择以扩展集体假设空间。如果你的常规\
  \ *首选* ML 模型集的预测性能不佳，则可能需要这样做。\n\n# 评估\n\n随着 ML 模型 *自我调整*，需要一种方法来评估它做得如何。需要一个函数来衡量性能，以了解哪些分类器是好的，哪些是坏的。这就是评估函数发挥作用的地方。一些示例有准确率、错误率、精确率、召回率、F\
  \ 分数、平方误差和信息增益。这些函数也被称为 **目标函数** 或 **评分函数**。\n\n# 优化\n\n大多数 ML 模型表示都有很大的假设空间。对所有可能性的顺序搜索将花费比你愿意等待答案的时间更长；几个月、几年或一生，取决于模型表示的复杂性。优化方法的选择决定了学习过程的效率。有几种通用方法可以搜索最佳分类器。一些示例有梯度下降、贪婪搜索和线性规划。\n\
  \n| 表示 | 评估 | 优化 |\n|---|---|---|\n| 实例<br>　*K*-最近邻<br>　支持向量机<br>超平面<br>　朴素贝叶斯<br>　逻辑回归<br>决策树<br>规则集<br>　命题规则<br>　逻辑程序<br>神经网络<br>图形模型<br>　贝叶斯网络<br>　条件随机场\
  \ | 准确率/错误率<br>精确率和召回率<br>平方误差<br>似然<br>后验概率<br>信息增益<br>K-L 散度<br>成本/效用<br>边际 |\
  \ 组合优化<br>　贪婪搜索<br>　束搜索<br>　分支定界<br>连续优化<br>　无约束<br>　　梯度下降<br>　　共轭梯度<br>　　拟牛顿方法<br>　有约束<br>　　线性规划<br>　　二次规划\
  \ |\n\nML 算法的三个组件。来源：A Few Useful Things to Know about Machine Learning by Pedro\
  \ Domingos, University of Washington\n\n# 泛化\n\n任何 ML 项目的根本目标都是产生一个模型，该模型在超出你当前可用的数据集之外也能良好运行。你希望它对未来数据进行预测、分类或估计时错误最小。不是对你已有的数据，而是对模型实现时你将拥有的新数据。\n\
  \n你用来开发 ML 模型的已有数据称为 **训练集**。训练集应代表你期望在未来应用该模型的数据集中找到的内容。即使你拥有非常大的训练集，未来数据集也不太可能完全相同。这个庞大而复杂的世界产生了大量的变化。\n\
  \n\n\n\n\nML 模型能够对各种未来示例按预期工作的能力称为 **泛化**。它是在 ML、深度学习以及大多数其他预测建模技术中的一个关键概念。你希望你的\
  \ ML 模型对今天的数据和未来数据都能准确预测。你希望模型能够 *泛化* 超出其所生长的数据集。你应该愿意在训练集上的准确性做出牺牲，以提高在未来、尚不为人知的\
  \ 数据集上准确的概率。毕竟，这正是开发 ML 模型初衷的全部意义。\n\n然而，由于今天你唯一拥有的数据是训练集，而你试图用模型逼近的底层函数是未知的，因此别无选择，只能使用训练数据本身的误差作为明天数据集误差的代理，随着\
  \ ML 模型自我优化。但这黑暗而充满恐怖——非常危险！\n\n幸运的是，有一些方法可以保护你免受虚假乐观的 ML 模型的侵害。这些将在后面介绍。目前，请知晓实践中的\
  \ ML 建立在不信任的基础之上。这正是它如此强大的原因之一。如果操作得当，通过验证严苛考验的 ML 模型将在狂野而毛糙的现实世界中取得非常成功的应用。\n\n\
  ## 使用物联网数据的特征工程\n\n要当心自动化 ML 软件工具的海妖呼唤，它获取你所有的数据并确定什么是重要的，并自动从中构建最佳模型——只需点击一下按钮即可。经常，你拥有的原始数据并不是\
  \ ML 模型能够成功的形式。按原样使用数据可能是一个冒险的提议。许多不知情的船只已被那些岩石击毁，被自动化的美妙声音所诱惑。\n\n显著提高你的 ML 模型的预测能力最好的方法之一，不在于算法本身，而在于数据如何被呈现给它们。数据的转换、构造新字段的添加以及分散注意力的字段的移除，都是在了解表示模型如何运作的知识下完成的。这个过程称为\
  \ **特征工程**。数据字段在 ML 中通常被称为 **特征**。我们将在本章剩余部分采用该术语。\n\n特征工程的目标是尽可能让你的 ML 模型获得良好的性能。不同的表示有不同的工作要求，因此你会发现自己为特定的\
  \ ML 表示创建同一原始数据集的不同版本。熟悉你正在使用的每个 ML 表示，以确保你给予它最佳的性能机会。\n\n特征工程是一门艺术，很难。但它可以增加很多价值并大大提高你成功的概率。我们将介绍一些关键概念，但还有很多很多东西需要学习。\n\
  \n### 处理缺失值\n\n物联网数据 notoriously 混乱（以防信息尚未传达到位）而缺失值是常见现象。有一些选项可以处理这个问题以增强你的 ML 模型的质量。这就是艺术发挥作用、判断力变得重要的地方。\n\
  \n以下是处理缺失值的一些方法：\n\n- **删除含有缺失值的行：** 这很粗糙，但如果丢失的比例很小，并且这种比例看起来是随机的，那么对结果的影响将很小。使用\
  \ Tableau 等工具分析含有缺失值的数据并将其与不含缺失值的数据进行比较，以判断删除行的影响。R 和 Python 也适用于此任务。\n- **不要使用缺失值数量高的特征：**\
  \ 直接将其剔除。用缺失值比例高的特征构建的模型，其效果与用泡泡糖和牙签粘起来的自行车一样好。结果将值得怀疑。\n- **你可以使用该特征有效值的均值、中位数或众数来插补值：**\
  \ 这有些粗糙，但在某些情况下可以很好地工作。始终使用 *第 6 章《认识你的数据 - 探索物联网数据* 中介绍的技术等分析数据，以确定什么是有意义的。\n-\
  \ **创建一个 ML 模型基于其他特征来插补值，然后在预测目标变量的 ML 模型中使用结果：** （你想要预测的内容，这是构建模型的用途）。嵌套建模。现在，我们开始用力了！\n\
