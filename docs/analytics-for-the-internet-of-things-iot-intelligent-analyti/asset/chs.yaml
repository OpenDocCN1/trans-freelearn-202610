  你可以将这些服务归为三大类，需要正确配置以支持你的分析：网络、计算和存储。\n\n网络包括安全并处理通信路由。你的服务需要能够相互通信。\n\n\n\n\n\n\
  Compute 处理计算、运行应用程序以及执行计算任务。这是有趣的事情发生的地方——你的分析将在这里运行。\n\nStorage 处理你存储物联网分析的输入数据和输出结果的位置。这需要与你的分析需求相匹配。\n\
  \n托管服务预先配置了三类服务的组合，因此大部分细节会为你自动处理。底层服务的启动和配置被抽象化并在幕后处理。这使你能够快速添加功能，同时降低整体复杂性。代价是你将自己锁定在\
  \ AWS 生态系统中。但好处通常超过成本。你指尖拥有巨大的分析能力。\n\n## AWS 关键概念\n\n现在，我们将讨论 AWS 云设计中的一些关键概念。这些包括区域、可用区、子网和安全组。\n\
  \n### Regions\n\n区域是 AWS 中的主要划分，对应于一般的数据中心地理位置区域。新加坡、东京和美国东部是一些示例区域。你的环境存在于一个区域内。一个区域内的环境无法感知也无法与其它区域内的环境通信，除非设置特殊路径（超出本书范围）。你可以通过将环境复制到另一个区域来轻松扩展你的全球影响力。\n\
  \n### Availability Zones\n\n在区域内部，有多个可用区（AZ）。数量取决于区域。这些是物理上分离的位置，但彼此紧密相连。可用区之间的通信配置起来很简单。出于可用性原因，你的环境很可能会跨越多个可用区。如果一个\
  \ AZ 宕机，另一个不太可能宕机，并且功能可以自动转移。\n\n### Subnet\n\n子网是你网络的划分，以 IP 范围表示。子网在可用区内创建。资源启动到子网中，可以与其他子网内的资源通信。子网外的通信需要定义。\n\
  \n### Security groups\n\n这些定义了允许进入和离开的网络流量。它们围绕你启动的计算（以及其他一些）资源。 一个或多个资源可以属于一个组。服务器实例、数据库和集群节点都需要它们。它们默认阻止所有内容，因此你必须指定允许的流量。这是一个重要的安全网。例如，即使你启动了一个新的\
  \ Linux 服务器并使其完全开放且对世界脆弱（但不要这样做），只要安全组被锁定，就没有任何恶意流量可以到达它。云环境是非常不信任任何人的世界。\n\n##\
  \ AWS 关键核心服务\n\n现在我们已经介绍了关键概念，我们可以进入对物联网分析感兴趣的服务。我们将从一些核心服务开始。\n\n### Virtual Private\
  \ Cloud (VPC)\n\nVPC 是你在 AWS 云中的逻辑隔离部分。在这里你可以创建和配置你自己的网络，如你所定义的那样。把它想象成你的自包含环境，你的分析将在其中存在。你在这里拥有完全控制权，你可以创建并配置自己的\
  \ IP 地址范围、子网、网络网关和路由表。尽管最初并非如此，现在已经无法逃避 VPC。即使你不创建自定义 VPC，AWS 也会为你创建一个（称为默认 VPC）。你不限于一个\
  \ VPC；你可以拥有多个自己的小分析世界来掌控。\n\n![](img/9f2a55db1236f995dcd9392acbc82910_99_0.png)\n\
  \n**主路由表**\n\n| Destination | Target |\n|---|---|\n| 10.0.0.0/16 | local |\n\nVPC\
  \ 和可用区架构示例。来源：Amazon Web Services\n\n### Identity and Access Management (IAM)\n\n\
  这里定义用户（IAM 用户）、创建访问密钥对并定义安全角色（IAM 角色）。IAM 角色是一个关键概念，因为它允许你的实例和其他 AWS 服务以简单且安全的方式通信。你将在创建资源时分配这些角色，它将原生拥有角色中定义的服务的权限。这是在服务器实例上不存储任何访问密钥的情况下发生的。这意味着即使服务器被入侵，恶徒也不会拥有通往王国的钥匙。\n\
  \n### Elastic Compute (EC2)\n\nEC2 允许你创建虚拟服务器（称为实例）。你定义虚拟硬件配置（想想 CPU/RAM 组合）和存储量。然后，几分钟后，它就会启动并运行，准备供你使用。在撰写本文时，有\
  \ 55 种不同的 EC2 虚拟硬件配置选项。支持多种操作系统，包括 Windows 和多个版本的 Linux。我们将在本节其余部分将虚拟服务器称为 EC2 实例。\n\
  \nM4\n\nM4 实例是通用实例的最新一代。该系列提供计算、内存和网络资源的平衡，是许多应用的良好选择。\n\n功能：\n- 2.3 GHz Intel Xeon®\
  \ E5-2686 v4（Broadwell）处理器或 2.4 GHz Intel Xeon® E5-2676 v3（Haswell）处理器\n- 默认 EBS\
  \ 优化，无额外费用\n- 支持增强型网络\n- 计算、内存和网络资源的平衡\n\n| Model | vCPU | Mem (GiB) | SSD Storage\
  \ (GB) | Dedicated EBS Bandwidth (Mbps) |\n|---|---|---|---|---|\n| m4.large | 2\
  \ | 8 | EBS-only | 450 |\n| m4.xlarge | 4 | 16 | EBS-only | 750 |\n| m4.2xlarge\
  \ | 8 | 32 | EBS-only | 1,000 |\n| m4.4xlarge | 16 | 64 | EBS-only | 2,000 |\n|\
  \ m4.10xlarge | 40 | 160 | EBS-only | 4,000 |\n| m4.16xlarge | 64 | 256 | EBS-only\
  \ | 10,000 |\n\nAWS 内存优化 EC2 实例。来源：Amazon Web Services\n\nEC2 实例是从 **Amazon Machine\
  \ Image (AMI)** 创建的，如果包括社区 AMI，则有数千种不同类型。把 AMI 想象成你在安装了自己喜欢的软件和设置后硬盘的镜像。有了 EC2，你可以有效地暂停它，定义新的硬件配置，然后重新启动。它也可以根据需要动态添加存储。你还可以停止实例，仅为存储付费，然后在需要时稍后重新启动。这对于仅定期运行的分析作业可以节省不少钱。\n\
  \n### Simple Storage Service (S3)\n\nS3 是一种基于对象的存储服务。它自动处理扩展和冗余。文件的多个副本会自动在多个设备和位置之间创建。耐久性极高，在一年内达到\
  \ 99.999999999%。单个文件可以从 0 字节到 5 TB。超出存储大小仅受你的银行账户限制。\n\n对象是 Amazon S3 中存储的基本实体，但你可以简单地将其视为可以是（几乎）任何大小或类型的<|message|>。所有内容都包含在称为\
  \ **bucket** 的容器中。存储桶是最高级别的 S3 命名空间，并与拥有它的 AWS 账户相关联。S3 存储桶就像互联网域名。对象具有唯一键值，并使用\
  \ HTTP URL 地址检索。\n\n综合起来用于分析，这意味着你可以把大量数据存放在那里，而不必担心备份、硬盘故障或空间不足。它可以使用类似 URL 的格式轻松访问（假设你拥有正确的密钥/权限）。\n\
  \n## AWS 物联网分析的关键服务\n\nAWS 服务实在太多，无法在一节中全部涵盖。我们将介绍对物联网分析感兴趣的服务，但请知晓还有许多更多服务，并且新服务不断添加（例如语音识别和深度学习图像识别服务）。\n\
  \n### Amazon Simple Queue Service (SQS)\n\n这是 AWS 管理的消息队列服务。它处理底层计算和存储资源，你只需要创建它。你只需为消息处理的\
  \ API 调用付费。\n\n### Amazon Elastic Map Reduce (EMR)\n\nEMR 是一个完全托管的 Hadoop 框架，可以在几分钟内启动。它为你处理节点配置、集群设置、配置和集群调优的任务。它使用\
  \ EC2 实例运行，可以从一个节点扩展到数千个节点。\n\n你可以手动增加或减少实例数量，或使用自动扩展在集群运行时动态执行。EMR 服务监控你的集群；它可以处理失败任务的重试，并会自动替换性能不佳的实例。\n\
  \n即使是托管的，你对集群拥有完全控制权，包括 root 访问权限。你可以安装额外的应用程序。EMR 可选择多种 Hadoop 发行版和应用程序，如 Apache\
  \ Spark、Presto 和 HBase。\n\n数据存储可以使用 **EMR File System (EMRFS)** 链接到 S3。你可以将数据存储在\
  \ Amazon S3 中并使用多个 EMR 集群处理同一数据集。这使你能够根据任务要求配置集群，而无需在所有任务之间做出最佳妥协。它符合分离计算和存储的目标。\n\
  \n你也可以以编程方式创建 EMR 集群，运行作业，然后在完成后自动关闭它。这使其非常适用于大规模批处理或分析作业。\n\n\n\n\n\n## AWS 机器学习\n\
  \n该服务提供向导和可视化工具，指导您完成创建机器学习模型的过程。您可以将训练好的模型部署到新数据上进行预测，而无需设置单独的系统。按需付费，无需前期成本。它具有高度可扩展性，每天可处理数十亿次预测。\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_103_0.png)\n\n亚马逊机器学习评估屏幕截图示例。来源：亚马逊网络服务\n\
  \n## Amazon Relational Database Service (RDS)\n\nRDS 是一套托管的关系型数据库，包括 Oracle、Microsoft\
  \ SQL Server、PostgreSQL、MySQL 和 MariaDB 等数据库引擎。您可以完全控制数据库，但无法访问其托管的底层服务器。RDS 处理这一部分，并提供对数据库管理系统健康状况的监控。您可以使用与在非\
  \ RDS Oracle 或 SQL Server 数据库上相同的工具来连接和管理 RDS 上的数据库，例如。\n\n这对于大多数标准关系型数据库需求来说非常理想，但在自定义或复杂实现方面可能有限。对于分析而言，这很少是个问题。\n\
  \n## Amazon Redshift\n\nRedshift 是一款完全托管的、符合 SQL 的数据仓库服务。您可以在 Redshift 集群中存储多达一\
  \ PB 的数据。它拥有自己的 JDBC 和 ODBC 驱动程序，但也支持标准的 PostgreSQL 驱动程序。这意味着大多数商业智能 (BI) 工具可以直接连接。Redshift\
  \ 适用于常用查询的数据，是将处理和汇总的物联网数据放置以供更广泛的企业使用的常见位置。\n\n## Microsoft Azure 概览\n\n微软提供了一项名为\
  \ Azure 的云基础设施服务，与 AWS 直接竞争。它在规模和能力方面通常被评为行业第二，虽然最近差距正在缩小。\n\n服务范围与 AWS 相似，但带有微软特色。微软将这些服务宣传为更易于与企业本地网络集成。集成更偏向微软技术，例如\
  \ Windows 操作系统、.NET 编程语言和 SQL Server 数据库。\n\n我们将回顾一些对物联网分析感兴趣的服务。\n\n## Azure Data\
  \ Lake Store\n\nAzure Data Lake Store 与 Hadoop 分布式文件系统 (HDFS) 兼容，我们将在第 4 章《创建 AWS\
  \ 云分析环境》中讨论它。它还为应用程序提供了一个 REST 接口，与 WebHDFS 兼容。\n\n存储在 Data Lake Store 中的数据可以使用\
  \ Hadoop 生态系统中的分析框架进行分析，例如 MapReduce 和 Hive。Microsoft Azure HDInsight 集群可以配置为直接访问存储在\
  \ Data Lake Store 中的数据。\n\n您可以存储各种类型的数据用于分析和存储，存储大小实际上是无限的。单个文件大小可以从千字节到拍字节不等。存储是持久的，因为多个副本会自动创建和管理。\n\
  \n## Azure Analysis Services\n\nAzure Analysis Services 基于 Microsoft SQL Server\
  \ Analysis Services (SSAS) 构建，与 SQL Server 2016 Analysis Services 企业版兼容。它支持表格模型。功能包括\
  \ DirectQuery、分区、行级安全性、双向关系和翻译。\n\n您可以使用用于 SSAS 的相同工具为 Azure Analysis Services 创建数据模型。您可以使用\
  \ SQL Server 数据工具 (SSDT) 或使用 SQL Server Management Studio (SSMS) 中的某些 Azure 模板创建和部署表格数据模型。如果您是微软用户，这一切对您来说都很熟悉。\n\
  \n您可以连接到 Azure 云中的数据源，也可以连接到组织中的本地数据源。连接到云数据源相当无缝，因为从云服务器的角度来看，它本质上位于同一本地网络中。连接到本地数据源由本地数据网关支持，该网关可实现与云中\
  \ Analysis Services 服务器的安全连接。\n\n![](img/9f2a55db1236f995dcd9392acbc82910_105_0.png)\n\
  \n*截至 2016 年 12 月微软，某些数据源在预览版中尚未受支持。图片来源：Microsoft Azure\n\n您可以从 Microsoft 工具（如\
  \ Power BI Desktop 和 Excel）连接数据。您也可以使用连接器将自定义应用程序和一些基于浏览器的工具链接起来。\n\n![](img/9f2a55db1236f995dcd9392acbc82910_106_0.png)\n\
  \n*截至 2016 年 12 月微软，Power BI Embedded 在预览版中尚未受支持。图片来源：Microsoft Azure\n\n## HDInsight\n\
  \nAzure HDInsight 使用来自 Hortonworks Data Platform (HDP) 发行版的 Hadoop 组件。它在云中部署托管集群，重点关注高可靠性和可用性。Microsoft\
  \ Active Directory 用于安全和治理。\n\nHDInsight 包括 Hadoop 生态系统工具的实现，例如 Apache Spark、HBase、Kafka、Storm、Pig、Hive、Interactive\
  \ Hive、Sqoop、Oozie 和 Ambari。它还与商业智能 (BI) 工具集成，例如 Power BI、Excel、SQL Server Analysis\
  \ Services 和 SQL Server Reporting Services。\n\nHDInsight 集群使用的 HDFS 默认存储可以是 Azure\
  \ 存储账户或 Azure Data Lake 存储。\n\n## R 服务器选项\n\n2015 年，微软收购了一家名为 revolution analytics\
  \ 的公司，该公司维护着开源 R 发行版的托管版本。此后，微软一直在将其产品和 Azure 中集成 R。\n\nHDInsight 在创建集群时提供集成 R Server\
  \ 到 HDInsight 集群的选项。这允许 R 脚本使用 Hadoop 运行分布式计算。微软包含一个名为 ScaleR 的大数据分析 R 包。\n\n您可以连接到集群并在边缘节点上运行\
  \ R 脚本。您可以使用 ScaleR 在边缘节点服务器的核心上运行并行化分布式函数。您也可以使用 ScaleR Hadoop MapReduce 或 Spark\
  \ 计算上下文在集群节点上运行它们。\n\n## ThingWorx 概览\n\n公司 PTC 拥有机器对机器世界软件开发的悠久历史，开发了 ThingWorx。它是用于构建物联网解决方案的应用程序开发环境。它是一个软件平台，将物联网设备和相关组件和服务抽象为基于模型的开发对象。您将软件安装在自己的硬件上（或使用云提供商的虚拟实例）。\n\
  \n该平台使建模设备和数据变得容易，并具有通过基于 Web 的应用程序快速创建仪表板的<|message|>。无需编码。ThingWorx 还可通过其市场扩展到第三方组件。这使得在无需特殊配置的情况下轻松添加第三方功能变得容易。它还可以与\
  \ AWS 和 Azure IoT 中心服务集成。\n\nThingWorx 有多个组件。ThingWorx Foundation 是平台的核心。它分为三个区域，如下图所示：\n\
  \n- ThingWorx Core\n- ThingWorx Connection Services\n- ThingWorx Edge\n\n![](img/9f2a55db1236f995dcd9392acbc82910_107_0.png)\n\
  \nThingWorx Foundation。来源：thingworx.com\n\n## ThingWorx Core\n\nThingWorx Core 是一个软件平台环境，允许您设计、运行和实现用于控制和报告远程设备数据的物联网应用程序的分析。这些设备可能是传感器、消费电子产品或工业设备。\n\
  \nThingWorx 使用基于代表性对象的设计。这意味着您创建软件对象来表示您的物联网设备和其他资产。表示包括相关属性和相关数据项。\n\n然后您使用对象创建应用程序，可以监控和管理您的物联网设备。您可以创建仪表板、实现响应逻辑并集成第三方应用程序。\n\
  \nThingWorx Core 是您 ThingWorx 环境的核心。您在环境中逻辑定义物联网设备或远程资产之间的行为和关系。一旦实际设备在软件中建模，它们就可以注册并与\
  \ Core 通信。然后您可以收集数据和管理物理设备。\n\nThingWorx Core 包含两个主要工具供您创建物联网解决方案：\n\n- **ThingWorx\
  \ Composer**：这是一个建模环境，您可以在其中设置远程资产、业务逻辑、数据存储和安全。\n- **ThingWorx Mashup Builder**：这是一个拖放工具，您可以在其中快速创建仪表板和移动界面而无需编写代码。在这里您可以做诸如在地图上显示位置和绘制传感器值趋势之类的事情。\n\
  \n## ThingWorx Connection Services\n\nThingWorx Connection Services 处理 Core 与远程资产之间的通信和连接。组件可以处理不同协议和不同设备云的连接。它们处理到远程设备的消息路由以及在需要时进行消息转换。\n\
  \n\n\n\n\nWS EMS 是一个独立的应用程序，安装在远程设备上。它使用一种名为 AlwaysOn 的 ThingWorx 协议与 ThingWorx\
  \ Core 通信。WS EMS 支持多种操作系统，且占用空间很小。它可以与大量设备配合使用，为边缘设备与 ThingWorx Core 之间的通信提供一种方式。\n\
  \n根据开发人员为 IoT 设备代码使用的语言，有多个版本的 **ThingWorx Edge SDKs** 可供选择，让你为设备添加连接性。有支持 C、.NET\
  \ (C#) 和 Java 语言的 SDK，以及 Android 和 iOS 平台的 SDK。\n\nSDK 嵌入在 IoT 设备中：每个设备一个实例。所有 SDK\
  \ 都有通用接口，并为 Core 提供安全通信通道。\n\n## ThingWorx 概念\n\n我们将讨论在 ThingWorx core 上用于建模环境的主要对象和概念，以更好地了解其工作原理。\n\
  \n## Thing 模板\n\n**thing template** 设置并定义了构建多个 things 的基础功能。这定义了一个通用类别，具有一组共同的属性、服务、事件和订阅。这些将包含在基于该模板的任何\
  \ thing 定义中。thing 将 *inherit* 自 thing template。\n\n## Things\n\n**thing** 用于表示一个对象。它基于\
  \ thing template，但通常会包含模板中定义的更通用基础 thing 特有的额外属性、服务或事件。\n\n有几种类型的 thing：\n\n- **Things:**\
  \ 这代表现实世界中的资产、设备或系统。\n- **Remote thing:** Remote thing 是一种特殊的 thing 类型，表示远程位置中的资产。使用\
  \ ThingWorx Edge SDK 时，运行应用程序的边缘设备需要在 ThingWorx Composer 中使用 RemoteThing 模板创建。\n\
  - **Custom things:** 扩展提供了自定义 thing 模板，你可以使用它来创建自定义 things 以表示你的设备。\n\n## Properties\n\
  \n属性是一个表示 thing 行为的变量。\n\n属性具有以下两种之一：\n\n- **Remote bindings:** Remote bindings\
  \ 支持 egress。当设备连接到 ThingWorx 时，可以写入边缘设备。边缘设备必须知道具有 Remote bindings 的任何属性。\n- **Non-remote\
  \ bindings:** 这些在写入时不会发送到边缘设备，也不会在请求值时从边缘设备读取。\n\n## Services\n\n服务代表 thing 可以执行的功能。它可以作为\
  \ thing、thing template 或 thing shape 的一部分定义。\n\n## Events\n\n事件是由属性的状态或值变化触发的。它向订阅它的对象发送数据。\n"
- "# 4\n\n## 创建 AWS 云分析环境\n\n本章是创建 AWS 云环境的逐步演练。环境专门针对分析和使用 AWS 最佳实践。除了屏幕截图和设置说明外，还将解释正在做什么以及原因。本演练会产生\
  \ AWS 使用费用。请确保在演练后删除所有资源，如果你不打算让环境持续运行，因为整个月的总成本可能超过 130 美元。视需要启动和停止 EC2 实例可以 somewhat\
  \ 降低成本。\n\n本章将涵盖以下主题：\n\n- AWS CloudFormation\n- 设置最佳实践虚拟私有云：\n  - NAT 网关\n  - Bastion\
  \ 主机\n- 如何终止和清理环境\n\n## AWS CloudFormation 概述\n\nAWS CloudFormation 换句话说就是基础设施即代码。它是一个\
  \ AWS 服务，你无需安装任何额外软件。这允许开发人员和系统管理员直接从代码模板文件设计和实现整个网络和服务器配置。当模板实施时，CloudFormation\
  \ 会自动处理资源的排序和创建。当模板启动以创建资源时，它被称为 stack。\n\n我们将使用其中一个 AWS 快速入门模板来创建一个安全环境，以便开始使用\
  \ IoT 分析。快速入门模板将 AWS 最佳实践纳入设计。你将在几分钟内拥有自己的迷你数据中心。 我们将使用的模板专为高可用性而设计，如果你决定扩展使用，它将有足够的空间增长。\n\
  \n如果你为公司设置用于标准操作的<|message|> 环境，作者建议你聘请一家专门创建云环境的咨询公司。这是为了确保底层安全性和架构设置正确。从一开始就正确配置要比以后尝试纠正容易得多。\n\
  \n然而，对于实验和一般分析使用，我们将在演练中创建的环境工作得很好。它已实施了若干安全和连接最佳实践。\n\n## AWS 虚拟私有云 (VPC) 设置演练\n\
  \n演练假设你已设置了以下内容：\n\n- **AWS account:** 如果你没有帐户，请访问 AWS 控制台页面并按照说明设置帐户。说明可在 https://aws.amazon.com/free/\
  \ 获取。\n- **Root accounts with Multi-Factor Authorization (MFA) active:** 这对安全至关重要。如果你尚未启用\
  \ MFA，请立即启用。在手机上下载 Google Authenticator 等应用并在帐户上设置 MFA。说明可在 https://aws.amazon.com/iam/details/mfa/\
  \ 获取。\n- **IAM users with administrative rights and MFA active:** 为自己设置一个具有管理员权限的\
  \ IAM 用户，用于日常操作。出于安全目的，避免使用 root 登录。还为 IAM 用户设置 MFA。\n\n- **Follow all other recommended\
  \ steps on the IAM welcome screen to secure your account:** 页面上的安全状态应全部为绿色勾选，并如下图所示：\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_116_0.png)\n\n现在，我们将开始演练的初始步骤：\n\n- 1.\
  \ 开始演练，使用你的 IAM 用户 ID 登录 AWS 管理控制台。如果登录屏幕要求输入电子邮件地址，则你处于 root 用户登录而非 IAM 用户登录。你需要转到\
  \ IAM 用户登录屏幕。如果你难以到达该页面，诀窍是输入以下格式的 URL\n  `https://[AccountName].signin.aws.amazon.com/console`，其中将\
  \ `[AccountName]` 替换为你自己的帐户名称。此链接也可以在登录后在 IAM 起始页上找到。\n- 2. 确保 AWS 区域设置为你想要创建环境的区域。对于大多数用例，最好将其设置为地理位置最近的区域。你可以通过查看管理控制台右上角来检查区域。如有必要，你可以通过单击名称右侧的小箭头来更改它：\n\
  \n## 为 NAT 和 bastion 实例创建密钥对\n\n你需要创建一个公钥/私钥对，以便稍后在快速入门设置中使用。密钥对将保存为文件，你应将其保存在安全的地方，只有需要的人才能访问：\n\
  \n- 1. 在屏幕顶部的 AWS 管理控制台中转到 **Services**：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_117_0.png)\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_117_1.png)\n\nServices location on console\n\
  \n2. 然后，在 **Compute** 部分单击 **EC2**：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_118_0.png)\n\
  \n3. 从 EC2 **Dashboard**，单击 **Key Pairs**：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_118_1.png)\n\
  \n4. 单击 **Create Key Pair** 按钮：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_118_2.png)\n\
  \n5. 为其命名，例如 `vpc_keypair` 并单击 **Create**。避免在名称中使用大写字母、空格或非标准字符。这将使其更易于在不同的操作系统和文件存储系统之间移植。\n\
  \n\n\n\n\n6. 单击创建按钮后，你将获得扩展名为 .pem 的密钥对文件（即 vpc_keypair.pem）。请确保你知道文件保存的位置。现在是将其移动到你想要保存的安全位置的好时机。控制台屏幕将会更新，你将看到列出你的新密钥对：\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_119_0.png)\n\n## 创建 S3 存储桶以存储数据\n\n你需要创建一个\
  \ S3 存储桶来存储数据文件。S3 存储桶名称需要在全球范围内唯一；任何 AWS 用户都不能有同名的存储桶。你可能需要做一些试错来获得一个可接受的名称：\n\n\
  +   1. 通过单击 Services 然后 S3（在 Storage 部分）导航到 S3 控制台：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_119_1.png)\n\
  \n2. 单击屏幕左上角的 **Create Bucket** 按钮：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_120_0.png)\n\
  \n3. 为你的存储桶命名一个不太可能已存在的名称。避免使用大写字母或空格。你可以使用连字符 (-) 来分隔单词，但不能使用下划线 (_) 。选择你在本次演练中一直使用的相同区域。S3\
  \ 存储桶是全球可访问的，但最佳实践是将数据保留在与分析工作相同的区域中。这样网络性能也会更好：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_120_1.png)\n\
  \n4. 你现在应该在 S3 控制台的列表中看到新的存储桶：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_120_2.png)\n\
  \n## 为 IoT Analytics 创建 VPC\n\n现在，我们将通过创建一个功能完善、高可用的云环境进入有趣的部分。你将在大约 20 分钟内拥有一个安全运行的数据中心。我们将利用\
  \ CloudFormation 和一个快速入门模板来创建一个 VPC，其中包含一些关键元素：\n\n+   - **Public subnets**：如果配置了公网\
  \ IP、附加的互联网网关和适当的路由表，则此子网中的资源可以通过公网互联网发现。你只想将诸如 Web 服务器或 NAT 实例之类的东西放在这里。\n+   -\
  \ **Private subnets**：这些子网中的资源对公众不可见。即使它具有公网 IP 地址，你的 VPC 外部的任何东西也找不到你放在这里的东西。出于安全原因；将诸如\
  \ Hadoop 集群、数据库和为分析处理目的创建的 EC2 实例之类的东西放在这里。\n+   - **NAT gateways**：**Network Address\
  \ Translation (NAT)** 网关充当私有子网中的资源与公网互联网之间的中介。\n+   - **Bastion hosts**：这些是必要的，以便让你能够连接到私有子网中的\
  \ EC2 实例和 Hadoop 集群。\n\n## 什么是 NAT 网关？\n\nNAT 网关在仍允许与外部互联网通信的同时隐藏有关你的资源的信息。它们通过将私有\
  \ IP 地址翻译成不同的公网 IP 地址并在内部资源请求外部通信时记住翻译和连接状态来工作。公网互联网中的任何内容都无法反向操作，并且永远不知道私有子网中资源的真实\
  \ IP 地址。\n\n![](img/9f2a55db1236f995dcd9392acbc82910_123_0.png)\n\nVPC 架构图。来源：AWS\n\
  \n每个公有子网中还将有一个 NAT 网关（尽管在前面的图中未显示）。为 VPC 定义的 IP 地址范围为你的未来分析项目提供了充足的增长空间。每个 EC2 实例、数据库或\
  \ Hadoop 集群中的节点都会占用一个 IP 地址编号。因此，可用 IP 地址的范围是你在 VPC 中可以拥有的资源数量的限制。我们将创建的 VPC 拥有超过\
  \ 65,000 个可用 IP 地址。\n\n## VPC 创建演练\n\n以下演练向你展示如何创建上一节中讨论的 VPC：\n\n+   1. 单击控制台页面左上角的\
  \ **Services**，然后在服务列表中单击 **CloudFormation**（在 **Management Tools** 部分）：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_124_0.png)\n\
  \n+   2. 单击 **Create Stack** 按钮：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_124_1.png)\n\
  \n3. 在 Choose a template 部分，单击 Specify an Amazon S3 template URL 的单选按钮。然后输入或复制并粘贴以下内容：\n\
  \n```\nhttps://s3.amazonaws.com/quickstart-reference/linux/bastion/latest/templates/linux-bastion-master.template:\n\
  ```\n\n![](img/9f2a55db1236f995dcd9392acbc82910_125_0.png)\n\n4. 单击 Next。\n\n5.\
  \ 将出现 Specify Details 部分。为你要创建的堆栈命名，但不要使用空格或特殊字符，只能使用连字符 (-) ：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_125_1.png)\n\
  \n6. 在同一页面的 **Parameters** 部分，单击 **Availability Zones** 的文本框。会出现一个下拉框，列出你所在区域中的可用可用区：\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_126_0.png)\n\n7. 在列表中单击一个可用区，然后再单击另一个可用区进行选择。你将在\
  \ AZ 文本框中看到两者，并且它应该如下所示，只是你选择的可用区位置不同：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_126_1.png)\n\
  \n8. 继续向下滚动页面，对公有和私有子网的 CIDR 块使用默认设置；这里无需更改任何内容。\n\n9. 在 **Allowed Bastion External\
  \ Access CIDR** 文本框中，输入代表你公司网络或地理区域的 IP 范围的 CIDR 块。这定义了允许甚至尝试与堡垒主机通信的源位置。**Classless\
  \ Inter-Domain Routing (CIDR)** 块是一种定义 IP 地址范围的表示法。如果你不确定该使用什么，请咨询你公司的网络专家。这应该只是用户可以接受地登录的范围。保持尽可能小和现实。CIDR\
  \ 块 0.0.0.0/0 可以工作，但会将流量开放给所有人和任何地方。对于堡垒主机来说，绝对不推荐。\n\n突出显示的 CIDR 块是一个示例；你将输入不同的一个：\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_127_0.png)\n\n10. 在 Amazon EC2 Configuration\
  \ 部分，单击 Key Pair Name 文本框。会出现一个下拉框。单击你之前创建的 Key Pair。对该部分中的其他选项使用已为你填写的默认值：\n\n\
  ![](img/9f2a55db1236f995dcd9392acbc82910_127_1.png)\n\n## 创建 AWS 云分析环境\n\n11. 在同一页面的\
  \ **Linux Bastion Configuration** 部分，将 banner 选项更改为 true。这对于使你的堡垒登录屏幕看起来不同很有用，这样你就可以将其与其它\
  \ Linux SSH 会话区分开来：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_128_0.png)\n\n12.\
  \ 使用 **AWS Quick Start Configuration** 部分中的默认值，然后单击 **Next** 按钮进入 **Options** 屏幕：\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_128_1.png)\n\n13. 在 **Options** 屏幕中，你可以为堆栈添加标签。标签是作为堆栈信息的一部分存储的键/值对。它们可以是你想要的任何内容，并且对于跟踪诸如谁创建了什么资源以及原因等信息很有用。建议你至少为名称和创建堆栈的个人创建一个键/值标签。要创建标签，你单击\
  \ **Key** 下的文本框。Key 文本字符串应跨资源保持一致（即，无论你是在创建 EC2 实例还是 Hadoop 集群，都始终使用完全相同的拼写的 Name）。单击\
  \ **Value** 下的文本框来完成标签。单击 + 按钮添加额外的标签。完成后，单击 **Next** 按钮查看你的选择：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_129_0.png)\n\
  \n14. 在 **Review** 屏幕上，向下滚动以再次检查堆栈的设置。在 **Capabilities** 部分底部，选中确认框，然后单击 **Create**\
  \ 按钮开始创建你的堆栈：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_130_0.png)\n\n15. 你将被发送回\
  \ CloudFormation 堆栈列表屏幕。你会注意到你的堆栈现在已列出，状态为 **CREATE_IN_PROGRESS**。快速入门模板会调用其他堆栈来创建\
  \ VPC 的各个部分。随着创建过程的进行，你会看到列表中添加了额外的堆栈：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_130_1.png)\n\
  \n16. 当堆栈创建过程完成时，每个堆栈（总共三个）的状态将更改为 **CREATE_COMPLETE**。你可以转到 **Services** 和 VPC\
  \ 来检查新环境中的网络资源：\n\n\n\n![](img/9f2a55db1236f995dcd9392acbc82910_131_0.png)\n\n-\
  \ 17. 前往 **服务** 并选择 EC2，进入 EC2 控制台检查您的 Linux 堡垒实例。它们需要完成启动并通过状态检查后，您才能连接到它们。\n-\
  \ 18. 要检查堡垒主机，请在 EC2 控制台中点击 **运行实例** 以查看 EC2 列表：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_131_1.png)\n\
  \n- 19. 当两个 Linux 堡垒主机的“实例状态”均为“运行中”且“状态检查”均为“已通过”时，它们就准备好了。这只需几分钟时间：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_131_2.png)\n\
  \n- 20. 连接到其中一个堡垒实例，以验证设置是否正确。您可以通过点击实例名称左侧的方框来选择该实例。然后，点击列表顶部的 **连接** 按钮。按照出现的说明建立连接。如果您使用的是\
  \ Windows 计算机，则需要下载并安装 PuTTY 或类似的终端软件才能进行 SSH 连接。说明窗口中的第 1 步中有一个链接，提供了相关操作指引：\n\n\
  ![](img/9f2a55db1236f995dcd9392acbc82910_132_0.png)\n\n## 如何终止并清理环境\n\n如果您不打算保留\
  \ VPC 环境，或者希望通过删除该环境来降低成本并在之后重新创建，请按照以下简单步骤操作：\n\n- 1. 前往 **服务**，然后选择 CloudFormation，返回\
  \ CloudFormation 堆栈列表。\n- 2. 逐个删除堆栈，从名称中包含 **BastionStack** 的堆栈开始。为此，请点击名称左侧的方框以选择该堆栈：\n\
  - 3. 点击 **Actions** 按钮，然后选择 **Delete Stack**：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_133_0.png)\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_133_1.png)\n\n- 4. 点击 **Yes, Delete**\
  \ 按钮确认删除。这将删除堡垒实例及相关的安全组：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_134_0.png)\n\
  \n- 5. 堆栈的状态将变为 DELETE_IN_PROGRESS。删除完成后，该堆栈将从列表中移除。如果几分钟后未看到变化，可以点击右上角的刷新按钮（圆形箭头）：\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_134_1.png)\n\n- 6. 对名称中包含 VPCStack 的堆栈重复步骤\
  \ 2 到 5，最后对创建时指定的名称的剩余堆栈执行相同操作（在本演练中为 IOTAnalyticsVPC）。\n\n- 7. NAT 网关和堡垒主机是环境中成本较高的项目。通过前往\
  \ **服务**，然后选择 VPC，验证 NAT 网关是否已被删除。控制台上的 NAT 网关计数可能不为零，并且在从列表中移除之前可能仍会显示为 2 达几个小时。点击控制台中的\
  \ NAT Gateways 以进入网关列表：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_135_0.png)\n\
  \n- 8. 您应该看到两个网关的状态均为“已删除”：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_135_1.png)\n\
  \n- 9. 通过前往 **服务**，然后选择 **EC2**，验证堡垒主机是否已被删除。**EC2 控制台** 的“运行实例”计数应为 **0**。您可以点击\
  \ **运行实例** 链接进入 EC2 列表。Linux 堡垒实例的状态应显示为“已终止”，或者根本不在列表中。如果您在删除堆栈后不久进行检查，实例很可能仍然在列表中可见。只要状态为“已终止”，您就不会被收费：\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_136_0.png)\n\n- 10. 重新创建环境时，您无需重新创建密钥对或\
  \ S3 存储桶。由于密钥对和 S3 存储桶不属于 CloudFormation 堆栈的一部分，因此即使所有堆栈都已删除，它们仍会保留在您的环境中。除非您在 S3\
  \ 存储桶中存储了数据，否则这些服务不会产生费用；即使有数据，成本也非常低。\n\n## 总结\n\n在本章中，我们在不到半小时的时间内创建了一个安全的虚拟私有云，它已准备好支持\
  \ IoT 分析。我们还回顾了在不再需要时如何删除和清理环境。我们讨论了 AWS CloudFormation、NAT 网关和 Linux 堡垒主机。您现在拥有了一个安全且灵活的场所来启动大规模分析，我们将在本书后面部分进行此操作。\n"
- "# 第 5 章 收集所有数据 - 策略与技术\n\n你盯着挂在工位墙上的 IoT 设备图纸，沉思着如何利用这些数据来挖掘颠覆性的见解。你几乎能听到同事们在你领取年度最佳项目执行奖和巨额奖金时为你欢呼的声音。\n\
  \n“咳咳！”有人在你身后咳嗽。你差点从椅子上跳起来。\n\n你的老板悄悄走到你的工位旁。他看起来既高兴又觉得有趣。你对那个“有趣”的表情有点担心。\n\n“你向客户推销使用云进行分析的工作做得非常出色，他们完全支持并希望立即开始，”他笑着说。你精神一振，因为这是个好消息。\n\
  \n“你做得太好了，”他得意地笑着说，“以至于他们希望下一代设备的数据采集率提高一倍。他们认为如果通过云基础设施路由，成本不会有太大变化。而且由于容量限制不再是问题，他们现在希望将月度报告改为每周报告。另外，其他部门的几位高管也非常兴奋，希望他们自己的团队也能使用这些数据。干得好！”\n\
  \n他暗自笑着走开了。你既对结果感到高兴，又对如何实现他们的期望感到困惑。如何以一种他人可以交互的方式存储数据？而且你确信现在需要回答的问题范围会更广，尤其是当其他部门的人员也在查看这些数据时。无论你做什么，都必须能够以高度的灵活性处理大规模数据。\n\
  \n本章介绍收集 IoT 数据以支持分析的策略。有许多选项可以存储 IoT 数据用于分析。我们将回顾该领域的一项常见技术 Hadoop，以及如何使用 Amazon\
  \ S3 作为大数据存储。本章还描述了何时以及为何使用 Spark 进行数据处理。我们将讨论流处理和批处理之间的权衡。还将回顾如何在数据处理中构建灵活性，以便将来集成分析功能。\n\
  \n本章涵盖以下主题：\n\n- 为分析设计数据处理\n- 将大数据技术应用于存储\n- 使用 Apache Spark 进行数据处理\n- 处理变化\n\n\
  ### 为分析设计数据处理\n\n在您的 IoT 数据处理环境中，可能会使用一些关键的云服务。AWS 和 Microsoft Azure 都有 IoT 特定服务，我们将对其进行回顾。此外，还有一些支持数据处理和转换的服务值得回顾，以增加您对它们的了解。\n\
  \n### Amazon Kinesis\n\nAmazon Kinesis 是一组用于加载和分析流式数据的服务。它为您处理所有底层计算、存储和消息传递服务。\n\
  \nKinesis 系列中的服务如下：\n\n- **Amazon Kinesis Firehose**：该服务支持将大量流式数据加载到 AWS 中。\n- **Amazon\
  \ Kinesis Streams**：该服务允许您创建自定义应用程序，以实时处理和分析流式数据。每条流都有两端；您使用 Amazon **Kinesis Producer\
  \ Library (KPL)** 构建将数据发送到流中的应用程序。Amazon **Kinesis Client Library (KCL)** 用于从流中读取数据的应用程序中\
  \ —— 通常是实时仪表板或规则引擎类型的应用程序。流数据也可以定向到其他 AWS 服务，例如 S3 或 SQS。\n\n\n\n\n\n- **Amazon\
  \ Kinesis Analytics**：这使你能够使用标准 SQL 轻松分析流数据。查询可以持续运行，AWS 会自动处理运行所需扩展。\n\n## AWS\
  \ Lambda\n\nLambda 允许你在无需预置服务器的情况下运行代码。Python、Node.js、C# 和 Java 编程语言目前均受支持。扩展由系统自动处理。你只需在代码执行时付费。所有内容均并行运行，你的代码要么无状态，要么需要在外部数据库中管理状态。代码本质上是事件驱动的，因为你可以配置何时以及在什么条件下执行。\n\
  \n使用 Lambda 等服务通常被称为 **无服务器计算**，并开启了全新的可能性。你可以用 Lambda 创建一个完全功能且没有后端服务器的 Web 应用程序。你可以创建可扩展至数百万设备事件的分析代码，而无需担心管理服务器。以下图表概述了其在实践中的工作原理：\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_139_0.png)\n\n## AWS Athena\n\nAthena\
  \ 是在 2016 年底推出的一项新服务，并在 S3 中存储的数据上运行。它允许你使用 ANSI SQL 查询数据集。无需将数据加载到 Athena 中；它直接查询其中的原始文件。这使你能够在无需\
  \ **提取、转换和加载 (ETL)** 将数据加载到数据分析系统即可分析大量数据。无需管理集群或数据仓库。你按扫描的数据量付费，这意味着你可以压缩数据以降低成本。\n\
  \n将此与 Lambda 结合，你就可以拥有一个相当不错的低成本大数据解决方案。将原始物联网文件存储在 S3 中，并安排 Lambda 作业定期将新数据转换为分析就绪的数据集——同样存储在\
  \ S3 中。使用 Athena 中的 SQL 进行分析。你可以在无需担心服务器、集群、扩展或管理复杂 ETL 的情况下完成所有这些操作。\n\n## The\
  \ AWS IoT platform\n\nAWS IoT 平台处理连接的物联网设备与你的 AWS 环境之间通信的数据消息和安全。它可以支持数十亿台设备和数万亿条消息。\n\
  \n还支持 MQTT、HTTP 和 WebSockets 协议。它为通信提供身份验证和加密服务。所有 AWS 服务都可用于处理、分析和对物联网数据做出决策。通信可以是双向的。\n\
  \n**设备影子** 用于存储每个物联网设备的最新状态信息。这使得应用程序看起来设备始终可用，因此可以在无需等待设备连接的情况下发出命令和读取值。设备影子会在设备连接时与物联网设备同步。\n\
  \nAWS IoT 设备 SDK 安装在远程物联网设备上以处理通信。注册和身份验证服务在 AWS IoT 平台中处理。规则引擎可以在满足某些条件时将消息定向到其他\
  \ AWS 服务，例如 Lambda（例如 `[device temperature < 0 degrees Celsius]`）。\n\n![](img/9f2a55db1236f995dcd9392acbc82910_140_0.png)\n\
  \nAWS IoT 平台的基本概述。来源：Amazon Web Services\n\n**AWS Greengrass** 是物联网家族中的一个新产品，在撰写本文时处于预览阶段。它允许简化边缘分析。这使其对物联网分析的可能性令人兴奋。它是安装在设备或附近设备集线器上的本地软件。它可以在设备未连接时自动处理事件数据的缓冲。它还——而且这是令人兴奋的部分——支持与\
  \ AWS 云相同的 Lambda 函数。你可以在 AWS 环境中构建和测试函数，然后只需最小的工作量即可将其迁移到 Greengrass 以在边缘运行。\n\n\
  ## Microsoft Azure IoT Hub\n\nAzure IoT Hub 是 Azure 后端与物联网设备之间双向通信的管理服务。数百万台设备可以在\
  \ IoT Hub 上运行；服务可根据需要扩展。通信可以是单向消息传递、文件传输和请求-应答方法。它与其它 Azure 服务集成。\n\n![](img/9f2a55db1236f995dcd9392acbc82910_141_0.png)\n\
  \n示例 Azure IoT Hub 解决方案架构。图片来源：Microsoft Azure\n\nAzure IoT Hub 具有一些关键功能，可让你了解其工作原理：\n\
  \n- **身份验证和连接安全性：** 每个设备都预置了自己的安全密钥以连接到 IoT Hub。身份和密钥存储在 IoT Hub 身份注册表中。\n- **设备双胞胎：**\
  \ 这些是存储诸如配置和参数值等状态信息的 JSON 文档。它存储在云中并为连接到 IoT Hub 的每个设备持久保存。双胞胎允许你在设备离线时存储、同步和查询设备数据。\n\
  - **连接监控：** 在这里，你可以接收有关设备身份管理和连接事件的详细日志。\n- **物联网协议支持：** MQTT、HTTP 和 AMQP 协议由你将安装在物联网设备上的\
  \ Azure IoT 设备 SDK 支持。即使你无法在设备上使用 SDK，它们也通过公开的公共协议支持。\n- **物联网协议可扩展性：** 你可以通过以下任一方式支持自定义协议：\n\
  \  - **创建现场网关：** 你可以使用 Azure IoT 网关 SDK 将你的自定义协议转换为 IoT Hub 理解的三种协议之一。\n  - **自定义\
  \ Azure IoT 协议网关：** 它在 Azure 云中运行，是一个开源组件。\n- **扩展：** 数百万台设备可以同时连接，数百万个事件每秒流经集线器。\n\
  \n## Applying big data technology to storage\n\n物联网数据涌入你的云环境并在处理和转换之后，下一个需要解决的问题是如何存储它。解决方案应支持保存大型数据集，并且易于用于分析进行交互。\n\
  \n### Hadoop\n\nHadoop 是 Apache 软件基金会旗下的一项开源项目。如官方项目文档所述，*The Apache Hadoop project\
  \ develops open source software for reliable, scalable, distributed computing.*\
  \ Hadoop 在其纯开源形式下可免费使用。\n\n除非你的团队中有一些 Hadoop 专家，否则你应选择托管的 Hadoop 发行版之一。这将为你提供故障排除支持和实施建议。Cloudera\
  \ 和 Hortonworks 是托管发行版和支持的两大主要提供商。Amazon AWS 和 Microsoft Azure 均有自己的 Hadoop 托管服务，分别为\
  \ EMR 和 HDInsights。\n\nHadoop 最初有点难以描述。在大多数媒体文章中，它通常被提及为一种新的数据仓库程序，你只需安装即可投入大量数据。这是一种过于简化的看法，因为它更像是一个相关项目的生态系统，而非单一事物。\n\
  \n一些组件依赖于其他组件，而一些可以独立运行。一些承担数据存储角色，一些承担数据处理，一些承担资源管理。甚至有些是否属于 Hadoop 类别存在争议，或者是否应拥有自己的类别。\n\
  \n在单一章节中回顾所有内容会让你头晕目眩，因此我们将重点关注物联网分析的关键组件。以下图片显示了生态系统中项目的数量。它显示了 Hortonworks 托管发行版（版本\
  \ 2.5）中包含的所有 Hadoop 组件。我们将省略大部分资源管理、安全和面向开发者的组件，例如 Zookeeper、Knox 和 Pig：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_143_0.png)\n\
  \nHortonworks 数据平台（HDP）生态系统。来源：Hortonworks\n\nHadoop 组件设计为跨多台服务器分布式运行。一个集群可能包含数千台独立服务器。它具有容错能力，服务器故障是设计中预期的一部分，并且可以在集群正常运行和操作时添加或移除服务器。\n\
  \n从分析的角度来看，将 Hadoop 生态系统视为四个相互连接但松散耦合的服务是有帮助的。这些服务相互通信，但在很大程度上完全独立地处理各自的角色。这种高层视图在以下图表中显示：\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_144_0.png)\n\nAnalysis Interaction\n\n\
  Execution Engine\n\nResource Allocation\n\nData Storage\n\nBig Data Guy\n\nAnalytic\
  \ queries/jobs\n\nAdding or retrieving data files\n\n\n\n\n\n在我们概念性的视角中，这四个服务如下：\n\
  \n- **分析交互**：这里将占用你大部分时间。在这里编写并提交代码、SQL，或者连接可视化工具。该区域的组件接收较高级别的指令，并将其分解为较低级别的处理步骤以供执行。它们为你抽象掉了许多繁复的细节。Hive\
  \ 和 SparkContext 就是例子。\n- **执行引擎**：你应该了解该区域中的组件如何工作，但不太可能直接与它们交互。Apache MapReduce\
  \ 和 Tez 就是例子。这些服务负责处理步骤将以何种方式、按何种顺序执行。\n- **资源分配**：这一点对于优化目的而言很重要。这里会监控每个节点并分配工作。YARN\
  \ 是关键角色。\n- **数据存储**：该区域负责数据文件的组织与存储。你将在这里直接交互，因此理解这些服务中发生的事情及其运作方式非常重要。HDFS 和 S3\
  \ 就是例子。文件格式和类型也同样重要，因为它们直接影响分析交互服务的灵活性和效率。\n\n## Hadoop 集群架构\n\n接下来，我们将回顾构成 Hadoop\
  \ 集群的节点类型、它们所扮演的角色，以及它们如何整合在一起，确保集群作为一个正常运转的整体。同一集群中的服务器之间会频繁通信；它们非常「健谈」。\n\n大多数集群配置都将物理单元（就网络而言）放在彼此靠近的位置，以最大限度减少带宽瓶颈。托管式的云\
  \ Hadoop 发行版会在设置时为你处理这一事宜。但如果决定自己手动创建集群，则需要在设计架构时把网络方面的考量放在心上。\n\n## 认识 Linux\n\n\
  ![](img/9f2a55db1236f995dcd9392acbc82910_146_0.png)\n\nLinux 在大数据计算集群中无处不在。由于它是开源的，许可成本极低甚至为零。它的系统开销低于\
  \ **操作系统（OS）** 如 Windows。这使它成为集群计算的理想选择，此类集群中节点数量可达数千个，每个节点都有自己的操作系统。想象一下为上千台服务器支付\
  \ Windows 许可费用……真是令人头疼。\n\n简而言之，对于 IoT 分析，你*确实*需要知道如何与 Linux 操作系统交互。这是不可避免的，而且一旦习惯了也没那么糟糕。你不必成为专家，但需要知道如何四处查找、运行程序以及做一些基本的脚本编写。好好补习\
  \ Bash！你会了解到什么是 shebang（谷歌一下）。\n\n## 什么是节点？\n\n节点是集群中的一个单元，拥有对自身一定数量 CPU 和内存资源的控制权。它也有自己的操作系统。在大多数\
  \ Hadoop 实现中，这是一个单独的服务器；不过，如果每个节点能够控制分配给它的计算和内存资源（通常通过虚拟化实现），一台物理服务器上也可以有多个节点。\n\
  \n## 节点类型\n\n一个 Hadoop 集群有一个 **MasterNode** 和一个到多个 **slave** 节点。MasterNode 运行所谓的\
  \ **NameNode**。NameNode 的职责是跟踪哪些其他节点健康以及有关集群的一些其他关键信息，例如文件位置。还有一个角色是 **ResourceManager**，每个集群一个，它可能与\
  \ NameNode 在同一台服务器上，也可能不在。你将在 HDFS 部分了解更多关于 NameNode 的信息，在 YARN 部分了解更多关于 ResourceManager\
  \ 的信息。\n\n集群中的其余机器同时充当 **DataNode** 和 **NodeManager**。这些是工作者。你猜对了，这里就是数据被分布存储以及分布式计算发生的地方。有几种类型的从节点为集群扮演不同角色。它们大多数被称为数据节点。也有主要用于与外部网络交互的从节点，这些被称为**边缘节点**。\n\
  \n集群上的一些其他服务，例如 Web 应用代理服务器和 MapReduce Job History 服务器，通常运行在专用节点或共享节点上——通常是边缘节点。将它们放在何处的决定取决于共享节点资源的服务的负载要求。\n\
  \n## Hadoop 分布式文件系统\n\n**Hadoop 分布式文件系统（HDFS）** 是一种分布在多台服务器上的文件系统，设计用于在低成本商用硬件上运行。HDFS\
  \ 支持一次写入、多次读取的理念。它专为在大到巨大的文件上进行的规模化批处理工作而设计。\n\n文件被分成**块**。典型的块大小为 128 MB。HDFS 上的文件会被切成\
  \ 128 MB 的块，并分布到不同的数据节点上。HDFS 中的文件通常从几千兆字节到数太字节不等。\n\nHDFS 是为批处理而设计的，而不是为用户的低延迟交互式查询。HDFS\
  \ 不适合那些频繁通过数据更新而改变的文件。新数据通常被追加到文件中，或添加到新文件中。许多小文件对 HDFS 的操作不利，因此出于性能原因，文件通常被合并成一个较大的文件。\n\
  \n下图展示了 HDFS 的一般架构。NameNode 控制文件命名空间，并充当跨节点文件操作的门卫。它跟踪文件块的位置，并处理客户端的读写文件请求：\n\n\
  ![](img/9f2a55db1236f995dcd9392acbc82910_147_0.png)\n\nHDFS 架构。来源：Apache 软件基金会\n\
  \nHDFS 假定硬件会故障、文件会丢失或损坏。它解决此问题的方法之一是在节点间保留文件的多个副本。没有哪个节点会拥有一个文件的全部副本。副本数量是可配置的，默认设置为三。HDFS\
  \ 会利用一些智能策略来决定文件块的放置和分布，以平衡容错与性能。\n\n如果某个节点发生故障并导致文件块丢失，HDFS 会自动根据其他节点上剩余的副本生成新的块来替换它们。这些新副本会分布到其他正常运行的节点上。NameNode\
  \ 会跟踪所有这些操作。文件块也会为了性能优化的目的而移动。文件块的实际复制由数据节点相互通信完成。\n\n为了了解其工作原理，我们将描述写入文件的高级过程。客户端（可以是\
  \ MasterNode 上的命令行提示符，或其他连接到集群的软件）请求写入或读取某个文件。该请求发送到 NameNode，NameNode 返回可以读取或写入文件块的节点标识符列表。当写入文件时，文件块由客户端请求一次性写入列表中的节点。然后，数据节点之间相互通信，将副本复制到设定的份数。\n\
  \nHDFS 文件命令与 Linux 文件系统命令非常相似。下面的示例指示 HDFS 将本地文件 lots_o_data.csv 分发到 HDFS 集群命名空间中的\
  \ /user/hadoop/datafolder：\n\n```\nhdfs dfs -put lots_o_data.csv /user/hadoop/datafolder/lots_o_data.csv\n\
  ```\n\n下面的示例会将同一文件从 HDFS 中的分布式形式复制到本地（非 HDFS 单服务器）文件目录：\n\n```\nhdfs dfs -get /user/hadoop/datafolder/lots_o_data.csv\
  \ lots_o_data.csv\n```\n\nNameNode 抽象了文件各部分的真实分布式位置。这使得客户端可以使用熟悉的文件夹命名方式来访问它，就像文件存储在一个驱动器上的单个文件中一样。命名空间会自动扩展以纳入新节点，从而增加更多存储空间。\n\
  \n文件可以是任何类型，不必是标准格式。你可以有无结构文件，例如 Word 文档，也可以有非常结构化的文件，例如关系数据库表导出文件。HDFS 不关心文件中所含数据的结构化程度。\n\
  \n许多用于分析目的而与 HDFS 交互的工具确实依赖结构。结构可以在读取文件前按需应用，这称为读时模式（schema-on-read）。也可以在文件写入时在文件内部定义结构。第二种方式称为写时模式（schema-on-write）。\n\
  \n\n\n\n\nSchema-on-write 是关系型数据库（如 Oracle 或 Microsoft SQL Server）的运作方式。这是 HDFS\
  \ 与传统数据库系统的主要区别之一：HDFS 可以对同一数据集应用多种结构（schema-on-read）。缺点是读取数据集的应用程序必须知道并应用该结构才能用于分析。有一些开源项目旨在解决数据集需要明确结构时的这一缺点。我们接下来将讨论其中两个主要项目。\n\
  \n## Parquet\n\nApache Parquet 是一种用于数据的列式存储格式，其中数据的结构被纳入文件中。它可供 Hadoop 生态系统中的任何项目使用，是分析的关键格式。它旨在满足互操作性、空间效率和查询效率的目标。Parquet\
  \ 文件可以存储在 HDFS 以及非 HDFS 文件系统中。\n\n![](img/9f2a55db1236f995dcd9392acbc82910_149_0.png)\n\
  \nParquet logo\n\n列式存储非常适合分析，因为数据按表列而不是行存储和排列。分析用例通常选择多个列并对值执行聚合函数，例如 sum、average\
  \ 或 standard deviation。当数据以列存储时，读取请求数据既更快也需要更少的磁盘 **Input/Output (I/O)**。\n\n数据通常以有序形式存储，使得抓取所需部分变得容易，并且仅读取所选列的数据。与之相比，行式格式通常需要读取整行才能获取到必要的列值。列式对于分析来说很棒，但并非全是优点和玫瑰；它不适合事务性用例。\n\
  \nParquet 旨在支持非常高效的压缩和编码方案。它允许为数据集中的每个列使用不同的压缩方案。它还通过允许随着发明而添加更多编码来设计为可扩展的。\n\n\
  Parquet 文件组织为嵌套组件。**row group** 包含数据集的一个分区的数据；列数据值保证存储在一起以最大限度地减少磁盘 I/O 需求。\n\n\
  每个列值的集合称为 **column chunk**。column chunk 进一步分为页面。文件的尾部和页脚存储有关文件和 column chunks 的整体元数据。它位于末尾，以便创建文件的写入操作可以一次性完成。这是必要的，因为在所有数据处理到文件中之前，完整的元数据是未知的。以下图表表示\
  \ Parquet 文件内的划分：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_150_0.png)\n\n文件元数据保存了正确定位和解释数据所需的信息。有三种类型的元数据，与关键的嵌套组件相对应：文件元数据、列（chunk）元数据和页面头元数据。以下图表显示了元数据各部分的逻辑关系：\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_151_0.png)\n\nParquet file metadata detail.\
  \ Source: Apache Parquet documentation\n\n数据类型有意保持简单，以促进使用它的框架提供更多选项；请参阅上一个图表中的\
  \ enums 框以获取支持的类型（Type）。字符串以二进制形式存储，并将 ConvertedType 设置为 UTF8。\n\n推荐的 row group\
  \ 大小为 512 MB 到 1 GB，对应的 HDFS 文件块大小为相同设置。这允许通过一次文件块检索读取整个 row group。Parquet 文件扩展名为\
  \ .parq。\n\n## Avro\n\nAvro 是一个 Apache 开源数据序列化系统项目。该系统将数据处理为具有一些有用属性的结果容器文件。它使用二进制数据格式以保持文件大小小且紧凑。这也导致读取速度更快。\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_152_0.png)\n\n数据的结构存储在文件容器中。支持丰富的复杂数据结构。Avro\
  \ 文件结构或 schemas 使用 JSON 定义。这就文件创建而言是一个 schema-on-write 过程。这带来的好处是客户端应用程序无需生成代码来定义数据结构。这使得使用\
  \ Avro 文件进行分析目的变得更简单，因为你无需在分析代码中发现和定义文件 schema。\n\n有 Python 和 Java 库可用于创建和读取 Avro\
  \ 文件。最有可能的是，你将使用诸如 Hive（将在后面的章节中讨论）之类的东西将数据存储到 Avro 文件中。Avro 支持 null、boolean、int、long、float、double、bytes\
  \ 和 string 的原始数据类型。它还支持数组、record 和 enums 等复杂数据类型。以下是示例 JSON schema 定义：\n\n```\n\
  ```json\n{\n  \"namespace\": \"iotexample.avro\",\n  \"type\": \"record\",\n  \"\
  name\": \"Sensor\",\n  \"fields\": [\n    {\"name\": \"sensor_id\", \"type\": \"\
  string\"},\n    {\"name\": \"temperature\", \"type\": [\"double\", \"null\"]},\n\
  \    {\"name\": \"recorded_time\", \"type\": [\"string\", \"null\"]}\n  ]\n}\n```\n\
  ```\n\n数据记录在序列化期间转换为二进制，并且也可以被压缩以进一步减小大小。Avro 文件的扩展名为 .avsc。\n\n## Hive\n\n我们现在从文件存储格式转向数据处理和检索组件。Apache\
  \ Hive 是 Hadoop 生态系统中的一个项目，位于分析交互区域。它允许你用一种类似 SQL 的语言编写查询，称为 Hive Query Language（HiveQL），它将其解释为在\
  \ HDFS 上执行的处理命令。HiveQL 与 SQL 非常相似，任何 SQL 开发人员都可以立即使用。\n\nHive 架构由用户界面（UI）、元存储数据库、驱动程序、编译器和执行引擎组成。这些组件协同工作，将用户查询转换为执行编排并利用\
  \ Hadoop MapReduce（通常）和 HDFS 返回结果的 Directed Acyclic Graph（DAG）操作。\n\n![](img/9f2a55db1236f995dcd9392acbc82910_153_0.png)\n\
  \nHive architecture. Source: Apache Hive project documentation\n\nUI 允许你提交查询。它还支持其他操作，例如创建\
  \ Hive 表的命令。你很可能不会直接使用它。作为物联网分析师，你更可能通过基于 Web 的界面（如 Hue）或通过使用 Hive ODBC 驱动程序的另一个应用程序（如编程\
  \ IDE 或 Tableau 等可视化软件）与之交互。\n\n**metastore** 数据库保存有关 Hive 表的信息。Hive 表与关系型数据库表非常相似，其中结构是预先定义的。Hive\
  \ 表可以由 Hive 在 HDFS 中管理，也可以定义为指向未由 Hive 管理的数据文件（称为 **external tables**）。在 HDFS 中外部表不是必需的。Amazon\
  \ S3 是一个常见示例，其中结构化文件可以存储并仍可通过 Hive 查询，只要为其创建了 Hive 表定义即可。\n\n元存储数据库可以托管在集群内部或远程。如果你在为临时使用创建临时\
  \ Hadoop 集群，例如通过 Microsoft HDInsights，远程数据库可能很有用，因为元数据可以在集群生命周期之外持久存在。这允许它被集群的未来实例使用。这在\
  \ Hadoop 用于批处理作业或临时用例（如实验性分析作业）时更为常见。Hive 元存储也可以被其他 Hadoop 生态系统项目使用，例如 Spark 和 Impala。\n\
  \n**driver** 充当协调器。它为查询创建唯一的会话 ID，将其发送给编译器进行查询计划，然后发送给执行引擎进行处理。最后，它协调结果记录的获取。\n\n\
  **compiler** 与元存储通信以获取查询中表的相关信息。它检查类型并制定执行计划。计划采用 DAG 步骤的形式，可以是 map 或 reduce 作业、元数据操作或\
  \ HDFS 操作。执行计划传回驱动程序。\n\n**execution engine** 根据执行计划向适当的 Hadoop 组件提交操作。在执行步骤期间，数据存储在临时\
  \ HDFS 文件中以供计划中的后续步骤使用。当驱动程序发送获取请求时，最终结果由执行引擎检索。\n\n下面是一个示例表创建语句：\n\n```\nCREATE\
  \ TABLE iotsensor (\n        sensorid BIGINT,\n        temperature DOUBLE,\n   \
  \     timeoutc STRING\n)\nSTORED AS PARQUET;\n```\n\n\n\n\n\nHive 表可以支持分区和其他提升性能的选项。查询语句与\
  \ SQL 非常相似，对于大多数简单查询通常无法区分。这是一个示例查询语句：\n\n```\nSELECT stdev_samp (temperature) FROM\
  \ iotsensor WHERE TO_DATE(timeread) > '2016-01-01'\n```\n\n以下是使用 Hive 进行物联网分析的一些提示：\n\
  \n- 1. **避免过多的表连接**：单个查询中连接的表应少于五个。如果无法做到这一点，请将查询拆分为多个连续的查询，将中间结果构建到临时表中。\n- 2.\
  \ **尝试使用除 Hadoop MapReduce 之外的执行引擎使用 Hive**：Hive on Tez 和 Hive on Spark 是两个较新的实现项目，它们通过最小化磁盘\
  \ I/O 并利用更多内存处理来提供更快、更高效的查询处理。\n- 3. **将数据存储在 Parquet 文件中**：列式存储更好地支持分析中常见的查询类型。文件压缩可以减少物联网数据的磁盘空间需求。\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_155_0.png)\n\n## 序列化/反序列化 SerDe\n\n你会在\
  \ Hadoop 相关文档中经常看到 **SerDe**。SerDe 是 Serialization/Deserialization 的缩写。序列化和反序列化指的是文件如何从保存状态转换到标准化的可读格式。序列化是写入时创建文件的一部分，而反序列化发生在文件被读取时。这使得文件可以被压缩和结构化。有关文件内容和数据结构的元数据也可以作为文件的一部分保存。\n\
  \n它是一种将解码文件格式的细节从客户端应用程序中*抽象*出来的方式。它还允许多种不同的格式在同一环境中无缝工作。甚至其中一些格式以后也可以被发明出来，一切仍然可以正常工作。\n\
  \nHadoop 中的 SerDe 会指向处理文件编码和解码的应用程序。这通常是 hive 表创建脚本中的一个设置，它将被存储在元存储中，后续客户端在读取模式时引用它。\n\
  \n## Hadoop MapReduce\n\nHadoop MapReduce 是 Hadoop 框架的核心组件。它是一个软件框架，使并行处理能够在集群中的节点间分布式执行。该主题可能会让人感到困惑，因为人们倾向于将\
  \ MapReduce 概念和 Hadoop 组件互换使用，好像它们完全一样。\n\nMap 和 Reduce 的概念将在本章后面的 Spark 部分中介绍。它与任何特定的框架或项目无关。你可能会读到一些文章暗示\
  \ MapReduce 即将消失，被其他东西取代。它可能没有明确说明（而且通常没有），但它们指的是 Hadoop 组件而不是概念。\n\nMap 和 Reduce\
  \ 的概念不会消失；它已经存在一段时间了，甚至是许多较新的分布式处理框架的关键部分。在本书中，我们将始终将该组件称为 Hadoop MapReduce，以避免任何混淆。\n\
  \n在 Hadoop 组件中，MapReduce 作业通常将输入数据集划分为独立的块。块由 map 任务在节点间并行处理。map 任务的输出随后会被排序并作为输入提供给\
  \ reduce 任务。Hadoop MapReduce 处理任务调度、监控，并在任务失败时重新执行任务。\n\n除非你是一名大数据领域的专业 Java 程序员，否则你不太可能直接与\
  \ Hadoop MapReduce 交互。在分析中，你更有可能使用其他更高级别的工具，这些工具在底层使用 Hadoop MapReduce。因此，尽管它是 Hadoop\
  \ 生态系统中的核心部分，但我们不会花费太多时间在此组件上。\n\n## 另一种资源协商器 YARN\n\n尽管名字有些 whimsical，YARN 是大多数\
  \ Hadoop 组件依赖的资源分配组件。YARN 背后的想法是将资源管理与作业调度和监控分离。在 YARN 中，它们是独立的处理单元。\n\n如以下图所示，集群有一个\
  \ ResourceManager，每个作业或由 DAG 表示的作业集有一个 ApplicationMaster，在节点上运行。作业或作业的 DAG 被称为应用程序。集群中的每个节点也有一个\
  \ NodeManager。NodeManager 的工作是监控容器上运行的应用程序所执行的节点的 CPU、磁盘、内存和网络使用情况。\n\n![](img/9f2a55db1236f995dcd9392acbc82910_157_0.png)\n\
  \nYARN 架构。来源：Apache 软件基金会\n\n容器是在底层操作系统之上运行的自包含环境；可以把它想象成系统中的系统。它们允许在容器内运行的应用程序即使底层操作系统配置和软件在节点之间不同也能一致运行。NodeManager\
  \ 还会将使用信息报告回 ResourceManager。\n\nApplicationMaster 的工作是与 ResourceManager 协商资源，并与\
  \ NodeManagers 协作执行和监控应用程序任务。ApplicationMaster 可以与不同节点的容器交互以执行其应用程序。\n\nResourceManager\
  \ 根据各个节点的资源限制处理对运行应用程序的资源调度和分配。ResourceManager 还可以在出现故障时重新启动单个应用程序主程序。\n\n## HBase\n\
  \nApache HBase 是一个分布式、非关系型数据库，构建用于处理具有快速响应时间的非常大的表。它是一种 NoSQL 类型数据库，这意味着它是非关系型的，并且不支持完整的\
  \ SQL 语言进行查询处理。它构建在 Hadoop 环境之上并使用 HDFS 进行数据存储。\n\n然而，与 HDFS 不同，它具有非常快的响应时间，并且构建用于随机、实时读写访问。它通过将数据放入索引文件然后存储在\
  \ HDFS 中来实现这一技巧。\n\n如果您拥有大型数据集（在数亿条记录或更高范围内）并且需要快速的单条记录查找，HBase 很有用。\n\n## Amazon\
  \ DynamoDB\n\nDynamoDB 在操作和用例上与 HBase 非常相似。它为您管理底层资源和存储，您只需为所使用的资源付费。在与 HBase 相同的许多条件下，它都很有用。\n\
  \n## Amazon S3\n\nAmazon S3 不仅仅是一个存放文件的场所。您可以像数据仓库一样使用它，因为它具有高可用性和极强的容错性。文件耐用性在一年内为\
  \ 99.999999999%。S3 也是一个 Hadoop 兼容的文件系统。而且您不必保留数据的三份副本，因为它已经内置了数据复制。\n\nS3 不适合频繁更新的数据，但非常适合频繁追加的数据。物联网数据通常完全属于后者，因此\
  \ S3 效果很好。许多在分析方面处于领先地位的公司将大型数据集保存在 S3 中，并为处理和分析创建临时 Hadoop 集群。然后将结果存储起来，并终止临时 Hadoop\
  \ 集群以节省成本。\n\n## 用于数据处理的 Apache Spark\n\nApache Spark 是一个新-ish 项目（至少在大数据世界中，大数据以超光速发展），它与\
  \ Hadoop 集成良好，但不一定需要 Hadoop 组件才能运行。它是*用于大规模数据处理的快速通用引擎*，正如 Spark 项目团队欢迎页面所述。*闪电般快速的集群计算*\
