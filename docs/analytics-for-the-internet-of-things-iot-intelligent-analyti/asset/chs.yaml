  \n你知道他其实并不真正怪你。你是 Excel 的高手，懂得查询数据库。很多分析请求都找你。当 CEO 决定公司需要一个大数据专家时，他们从硅谷聘请了一位 VP。但这位新\
  \ VP 在本该入职的前一天就去了另一家硅谷公司。\n\n你被匆忙调入新的分析团队。人数为一——就是你。这本应是临时调动，直到找到另一位 VP。那是六个月前的事了。公司正在冻结外部培训资金，收入也看起来紧张。所以，你没有培训。\n\
  \n虽然很多人都知道这些术语，但公司里没有人真正了解 Hadoop 是什么，或如何开始使用这种叫做机器学习的东西。但越来越多的人似乎期望你不仅要懂它，而且已经在做了。\n\
  \n高管们一直在阅读 HBR 和 Forbes 关于物联网结合人工智能或 AI 的巨大潜力的文章。他们觉得如果公司没有自己的融合 AI 的物联网大数据解决方案，很快就会被落下。你的老板感受到了压力。高管们给他提出了几个可以应用\
  \ AI 的想法。他们似乎认为想出想法是困难的部分，实现应该很容易。你的老板担心自己的工作，而压力层层传导到你身上。\n\n你左边的屏幕看起来像这样：\n\n\
  ![](img/9f2a55db1236f995dcd9392acbc82910_26_0.png)\n\n列表一页又一页地继续下去。你已经能够合并多个文件，并在\
  \ Excel 中做一些数据透视表和图表。但这占用了你大量时间，你最多只能实际处理一两个月的数据。问题来的速度比你回答的速度快。你和你的老板一直在讨论请临时工来做这项工作——他们不需要真正理解它，只要按照你为他们概述的步骤执行即可。\n\
  \n你右边的屏幕看起来像这样：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_27_0.png)\n\n你的 IT 部门一直在把许多小文件合并成几个非常大的文件。文件系统因文件数量过多而超载，所以解决方案是合并。遗憾的是，对你来说，许多文件现在太大而无法在\
  \ Excel 中打开，这限制了你能做的事情。你最终更多地对近期数据进行分析，仅仅因为它更容易（文件仍然很小）。\n\n查看数据行，很明显你能做的似乎仅限于求和和平均值。文件太大，无法在\
  \ Excel 中对生产记录等内容执行 VLOOKUP——而生产记录通常存储在文件太大而无法在 Excel 中打开的文件中。\n\n在这一点上，你甚至无法开始思考如何将机器学习应用于这些数据。你不太确定它到底意味着什么。你知道数据难以操纵，超出近期数据集之外几乎无法使用。显然，需要很长的时间才能从中提取价值。\n\
  \n你听到身后传来一声咳嗽。你的老板回来了。\n\n他冷冷而僵硬地说：“对不起。我们不得不聘请顾问来接手这项工作。我知道你工作有多努力。考虑到限制，你做了一些惊人的事情，而没有人足够欣赏这一点。但我必须展示成果。完全让某人上手可能需要一两个月。在此期间，继续努力——也许我们可以在那之前取得突破。”\n\
  \n你的心沉了下去。你确信连接设备数据中蕴含着巨大的价值。你觉得如果你能弄清楚如何实现，就能以物联网分析为职业。但你不是一个轻易放弃的人。\n\n你决定不会不战而败，你会找到办法。\n\
  \n## Defining IoT analytics\n\n为了理解物联网分析，有助于将其拆分并分别定义分析和物联网。这将为本书其余部分的讨论奠定框架。\n\n\
  ### Defining analytics\n\n如果你问一百个人来定义分析，你很可能会得到一百种不同的答案。每个人倾向于心中有自己的定义，其范围从静态报告到高级深度学习专家系统。所有人都倾向于在广泛的领域中称之为分析，而没有进一步解释。\n\
  \n在本书中，我们将采用一个相当宽泛的定义，因为我们涵盖了相当多的领域。在畅销书 *Competing on Analytics* 中，Tom Davenport\
  \ 和 Jeanne Harris 创建了一个量表，他们称之为 **Analytics Maturity**。公司随着分析使用的成熟而在该量表中逐步提升更高水平，并开始通过利用分析与其他公司竞争。\n\
  \n\n\n\n\n我们还将认为，分析成熟度关乎具备能力并知道如何实现全规模的启用。它并不是关于你在做什么。而是关于你能够做什么，以在全规模范围内最大化你的总投资回报率。每个层级都可以在发现机会时被利用。而我们希望在全规模范围内都有肥沃的机会土壤。关于这一点，整本书中都会进一步介绍。\n\
  \n## 定义物联网\n\n传感器几十年来一直在制造工厂、零售商店和远程石油天然气设备上追踪数据。为什么突然媒体上到处都是 IoT 的炒作？\n\n传感器成本、带宽成本的急剧下降、蜂窝覆盖的普及以及云计算的兴起共同创造了轻松通过互联网连接设备的肥沃条件。例如，如下图所示，高盛预测\
  \ 2020 年的平均传感器成本将低于 0.40 美元，仅为 2004 年的 30%。这些设备是否都应该被连接还是一个激烈争论的话题：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_30_0.png)\n\
  \n数据来源：高盛，BI 估计\n\n物联网的定义似乎差异很大；有些仅包括机器传感器，其他则包括 RFID 标签和智能手机。\n\n我们将使用 Webopedia\
  \ 上 Forrest Stroud 的这个定义：\n\n> > 物联网指的是日益增长的物理对象网络，这些对象具有用于互联网连接的 IP 地址，以及这些对象与其他互联网启用设备和系统之间发生的通信。\n\
  \n或者更基础地说：通过互联网与其他事物对话而无需你做任何事情的东西。这就说清楚了，对吧？\n\n即使到 2020 年预计连接的物数量也差异很大。一些来源预测\
  \ 208 亿台设备，其他预测高达 500 亿——是两倍多。\n\n就我们的目的而言，我们更关心如何分析生成的数据，而不是应该被视为物联网一部分的设备范围。如果某物通过互联网远程发送数据，对我们来说就是公平的游戏，尤其是当它在一端由机器生成、在另一端由机器消费时。\n\
  \n我们更关心如何从数据中提取价值并适应其固有的情况。物联网并不是真正的新事物，因为其元素已发展了数十年。20 世纪 70 年代就已经在进行石油井泄漏的远程检测。基于\
  \ GPS 的车辆远程信息处理已有 20 年历史。物联网也不是一个独立的市场；它融入了当前产品和流程。虽然媒体的许多报道都将其描述为不同的动物（也许甚至是本书的作者——罪名成立？），你不应该这样想。\n\
  \n## 受限的概念\n\n术语 **受限** 是理解物联网设备、数据和分析影响的重要概念。它指的是在物联网设备设计中必须考虑的有限电池电量、带宽和硬件能力。对于许多物联网用例，其中一个或多个必须与记录有用数据的需求相平衡。\n\
  \n## 物联网分析挑战\n\n物联网数据带来了一些特殊挑战。数据是由远程运行的设备创建的，有时在可能从一天到另一天变化的截然不同的环境条件下。设备通常在地理上广泛分布。\n\
  \n数据通过长距离通信，通常跨越不同的网络技术。数据首先通过无线网络传输，然后通过某种网关设备发送到公共互联网是很常见的——而公共互联网本身就包括多种不同类型的网络技术协同工作。\n\
  \n## 数据量\n\n一家公司很容易拥有数千到数百万台物联网设备，每个单元上有多个传感器，每个传感器定期报告值。数据流入量可以非常迅速地变得相当大。由于物联网设备持续发送数据，总数据量可能比许多公司习惯的增长得更快。\n\
  \n为了演示这种情况如何发生，想象一家制造小型监控设备的公司。它每年生产 12,000 台设备，从 2010 年产品推出时开始。每一台在组装结束时都会进行测试，并且设备上传感器报告的值会被保留用于分析五年。数据增长看起来像以下图像：\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_32_0.png)\n\n显示生产快照 200 KB 和每月 1,000\
  \ 台单位的数据存储需求的图表。保留五年的生产数据\n\n现在，想象该设备还具有互联网连接以跟踪传感器值，并且每台设备保持连接两年。由于数据流入在设备制造后仍在继续，数据增长呈指数级增长，直到较旧设备停止报告值时才稳定下来。这更像是以下图表中的蓝色区域：\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_33_0.png)\n\n图表显示 IoT 数据增加，每条消息 0.5 KB，每天\
  \ 10 条消息。设备从生产之日起连接两年\n\n为了说明这可能有多大，请考虑以下示例。如果每天捕获 10 条消息且消息大小为完整生产快照的一半，到 2017\
  \ 年，数据存储需求将比仅生产数据高出 1,500 多倍。\n\n对于许多公司来说，这会带来一些问题。数据库软件、存储基础设施和可用的计算能力通常并不打算处理这种增长。软件供应商的许可协议往往与服务器数量和\
  \ CPU 内核数挂钩。存储由标准备份计划和保留策略处理。\n\n数据量迅速导致计算和存储需求远超单台服务器所能容纳的范围。在传统架构下，将其分布到数百或数千台服务器上很快就会变得成本高昂。为了进行最佳分析，你需要大量历史数据，并且由于你不太可能提前知道哪些数据最具预测性，所以你必须尽可能多地保留在手边。\n\
  \n对于大规模数据，分析所需的计算能力需求并不十分可预测，并且会根据所问问题的不同而剧烈变化。分析需求非常弹性。传统的服务器规划会根据提前确定的满足峰值需求所需的预期服务器数量来提高本地资源。如果甚至可能的话，在短时间内将计算能力翻倍是非常昂贵的。\n\
  \n物联网数据量和计算资源需求可能迅速超过公司所有其他数据需求的总和。\n\n## 时间问题\n\n> 时间唯一的理由就是让一切不同时发生。\n> \n> ——\
  \ 阿尔伯特·爱因斯坦\n\n时间与地理位置和日历日期紧密相连。跟踪通用时间的国际标准方法是使用协调世界时（UTC）。UTC 在地理上与 0° 经线相连，该经线穿过英国的格林威治。虽然它与位置相关，但它实际上与格林尼治标准时间（GMT）不同。GMT\
  \ 是一个时区，而 UTC 是一个时间标准。UTC 不实行夏令时（DST）：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_34_0.png)\n\
  \n世界标准时区。来源：CIA 世界概况手册\n\n![](img/9f2a55db1236f995dcd9392acbc82910_36_0.png)\n\n\
  在 2008 年初，巴西中部比美国东部快一小时、两小时或三小时，取决于日期\n\n来源：维基共享资源\n\n当为事件记录时间时，例如停车位被腾空，对于分析来说，时间越接近实际发生越重要。实际上，用于分析的时间可能是事件发生的时间、物联网设备发送数据的时间、数据接收的时间，或数据添加到你的数据仓库的时间。\n\
  \n## 空间问题\n\n物联网设备位于多个地理位置。世界不同地区有不同的环境条件。温度变化会影响传感器精度。如果你设备受寒冷影响，那么在加拿大卡尔加里可能比在墨西哥坎昆的读数不那么准确。\n\
  \n\n\n\n\n海拔会影响柴油发动机等设备。如果未将地点和海拔考虑在内，你可能会根据物联网传感器读数错误地得出结论，认为丹佛的配送卡车车队相比印第安纳州的车队在燃油经济性方面管理不善。山路众多确实会消耗大量燃油！\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_37_0.png)\n\n偏远地区的网络接入可能较弱。更高的数据丢失率可能导致这些地点的数据值在最终分析中代表性不足。\n\
  \n许多物联网设备采用太阳能供电。可用的电池电量会影响数据上报的频率。位于俄勒冈州波特兰（经常多云多雨）的设备，相比位于亚利桑那州凤凰城（大多晴朗）的同类设备，受到的影响更大。\n\
  \n物联网设备的地点还涉及政治层面的考量。欧洲的隐私法律影响设备数据的存储方式以及可接受的分析类型。你可能需要对某些国家的数据进行匿名化处理，这会影响你能用分析做什么。\n\
  \n## 数据质量\n\n受限设备意味着有损网络。对于分析而言，这通常会导致数据缺失或不一致。缺失数据通常不是随机的。如前所述，它可能受到地点的影响。设备运行一种名为固件的软件，不同地点的固件可能不一致。这可能意味着上报频率或值格式的差异，并可能导致数据丢失或损坏。\n\
  \n## 业务价值考量\n\n许多公司都在努力从物联网数据中寻找价值。存储、处理和分析物联网数据的成本会迅速增长。由于未来财务回报不确定，一些公司开始质疑这项投资是否值得。\n\
  \n据咨询机构麦肯锡公司称，大多数物联网数据并未被使用。他们的研究显示，石油平台生成的数据中，只有不到1%被用于决策目的。\n\n通过物联网分析寻找价值，往往就像在废墟堆里找钻石。我们可以接受1%的数据有价值，但究竟是哪1%呢？这取决于具体问题。一个人的无用花岗岩，可能是另一个人的无价钻石。\n\
  \n业务价值的挑战在于，如何在降低成本的同时，提升创造卓越财务回报的能力。分析是实现这一目标的好方法。\n\n## 小结\n\n在本章中，我们为本书定义了物联网的构成，也定义了在此使用的“分析”一词的含义。我们讨论了物联网数据带来的特殊挑战，从数据量到通常内部公司数据集不会关注的时间和空间问题。你应该对本书的范围以及后续章节中将要学习克服的挑战有了清晰的认识。\n"
- "# 2 物联网设备与网络协议\n\n你开始了分析，发现你的物联网数据并不总是完整的。你还怀疑它并不总是准确的。但你不知道为什么会这样。每台设备平均每天你会收到几百条记录。\n\
  \n你公司制造的物联网设备附着在货运拖车上，跟踪位置，有时甚至跟踪温度。当拖车是冷藏单元时，温度会被监控，行业术语称为*冷藏集装箱*。冷藏集装箱的内部温度必须根据运输物品的不同保持在特定范围内。\n\
  \n你的设备位于拖车外部，通过一根引线进入拖车，如果启用该选项，可读取温度。拖车由大型卡车牵引，在全国各地的道路上行驶。\n\n你一直专注于在数据中寻找价值，从未想过数据是如何被采集并传送到公司服务器的。现在你开始思考这个问题，对数据中看到的问题感到疑惑。你曾假设这些问题是随机发生的，但如果并非如此，一丝恐惧感会顺着脊背袭来。这会影响你已经完成的大量分析，而公司正利用这些分析来做出业务决策。\n\
  \n本章将概述各种物联网设备和网络协议，还将介绍它们试图解决的业务需求。到本章结束时，你将理解主要设备类别和网络协议策略的“是什么”和“为什么”。\n\n本章涵盖以下主题：\n\
  \n- 物联网设备的范围及一些示例用例\n- 常见的物联网网络协议\n- 常见的物联网数据消息协议\n- 不同设备和网络协议策略的优缺点\n- 如何分析数据以推断协议和设备特征\n\
  \n### 物联网设备\n\n当今使用的物联网设备种类繁多。设计范围和功能巧思正在以惊人的速度扩展。被测量、监控和跟踪的对象范围本身就足以写成一本书。事实上确实如此，你可以通过本书的出版商找到好几本。\n\
  \n### 物联网设备的广阔世界\n\n出于分析目的，了解设备的多样性及其使用方式很有帮助。一个行业的想法可以跨界传播到另一个行业，创造意想不到的价值。设备与用例的组合也会带来截然不同的分析机会和挑战。\n\
  \n**医疗保健**\n\n重症监护患者的生命体征正通过低功耗无线传感器进行监测，数据可以远程分析。有几家初创公司，如 Proteus Digital Health，正在开发药丸大小的可吞咽传感器。Proteus\
  \ 制造了一种可消化的传感器药丸，与贴在皮肤上的传感器贴片配合使用，可以监测患者何时服药以及服药频率。\n\n**制造业**\n\n在制造工厂中跟踪和分析监测传感器的数据有着悠久的历史。有大量媒体专门关注这一领域，通常被称为工业物联网（IIoT）或工业4.0。各种制造行业都在部署物联网设备和传感器。\n\
  \nErgon Refining 在密西西比州有一家工厂，将振动、声学、位置等多种传感器单元连接到监控和分析数据的中央系统。\n\nEmerson Process\
  \ Management 制造了可无线监控的 Enardo 2000 紧急泄压阀（EPRV）。许多工艺工厂中有数百个疏水阀监控和泄压阀。使用廉价的传感能力对其进行监控，可以通过避免因设备故障导致的意外停机来创造价值。\n\
  \n**运输与物流**\n\nGeotab 制造 GPS 追踪设备，物流供应商可将其安装在车辆上，以监控和分析路线、燃油经济性并检测事故。这些设备在行业中被称作**远程信息处理**设备。客户可以在地图上创建地理围栏，当车辆进入或离开该区域时接收通知。\n\
  \n设备可以监控驾驶员行为，并将超速或急刹车的报告发送到总部。它们还会读取车辆报告的故障代码，并立即将信息传输给车队经理，从而在重大故障发生前解决问题。下图显示了一个远程信息处理设备\
  \ GO7 的示例：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_42_0.png)\n\nGeotab GO7 远程信息处理设备。来源：Geotab\n\
  \n**零售**\n\n土耳其的 Turkcell 利用其蜂窝网络和特定商店中的信标，与合作伙伴一起，在忠诚度计划客户靠近某些零售商时，向他们提供店内促销。\n\
  \n许多零售连锁店使用射频识别（RFID）标签和传感器来优化库存并监控仓库内的移动。\n\nExtreme Networks 正在与 New England Patriots\
  \ 及其主场体育馆合作，监控访客流量模式。体育馆利用这些数据来了解客户聚集的位置，并根据物联网传感器数据生成的流量热力图，合理地为广告和产品放置定价。\n\n\
  **石油和天然气**\n\n石油和天然气行业是如今所谓物联网最早期的先驱之一。随着物联网技术的进步，油井可以更轻松地连接分布于整个油井的传感器。数据读数也可以更频繁地采样，例如每30秒一次。\n\
  \n结合对传感器数据的边缘分析，公司可以执行诸如优化油井柱塞举升周期等操作。据 Intel 的一篇行业文章报道，这可以使产量提高多达 30%。边缘分析是指在设备本身或支持多单元集线器的附近设备上运行的应用分析。分析处理发生在网络边界（即边缘）的多个位置，而不是集中式位置。\n\
  \n公司还利用同样的信息来优化其资产组合管理。他们可以复用数据，按生产效率对油井进行排名。\n\n**家庭自动化或监控**\n\nEcobee Smart Wi-Fi\
  \ 恒温器可与放置在家中不同房间的电池供电无线传感器连接。它不仅跟踪供暖、通风和空调（HVAC）系统，还跟踪每个传感器报告的温度。它不仅能平衡各房间的温度，还能在炉子运行异常时通知你。\n\
  \n\n\n\n\n大多数这些问题都会被产品验证流程捕获并纠正。然而，了解产品在接近其工作范围边缘时是否存在任何限制或需要调整的情况是很重要的。\n\n## 网络基础\n\
  \n以下是网络协议栈的过度简化视图。在本章中我们不会涵盖这里发生的大量内容，但为了帮助理解讨论，将其简化为一个简单的图表是有用的：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_45_0.png)\n\
  \n网络通信按层运行，底层不需要知道其上层的存在。谈论协议栈每一层可用的所有选项可能会让人感到困惑。该图表显示了我们对物联网分析关心的关键层，但请知晓故事远不止于此。\n\
  \n该图表基于简化的**OSI 模型**，它将通信划分为五个基本层。底部有一个物理层，与设备的电气工程关系更大。为了简化，我们将省略它，因为我们关注的是分析。\n\
  \n连接性将主要指协议栈链路层中的选项。数据通信或消息传递将主要指应用层。网络层通常是我们熟知且喜爱的互联网协议（IP）。它是一个很好的整合者，为互联网通信的网络栈提供了极大的灵活性。\n\
  \n传输通常是 TCP 或 UDP，用于在长距离传输数据的网络方案。TCP 具有更强的交付保证但开销更大；UDP 开销更小但对交付的保证较少。\n\n用于从互联网到物联网设备连接以及设备生成的数据通信的网络协议种类繁多。它们解决了两个主要问题：\n\
  \n- **我如何建立通信，以便发送数据包？**\n  - 让我们以蜗牛邮件为例作类比。如果你资金有限，你更喜欢发送简短的明信片，即使到达收件人需要更长时间。它成本更低，而且写起来也不费力。如果金钱不是问题，你会聘请专业作者并发送接近诗歌的散文。你会使用航空邮件以便快速到达。在这个类比中，电池电量就像金钱，CPU/内存就像写作精力。\n\
  - **数据包如何被交付以满足我的需求？**\n  - 你和我是否同意互相获取地址并直接寄送信件？还是你总是把信交给隔壁隔间里的汤姆，由他发送给需要的人？你是否使用挂号信寄送，因为你必须确定它已被送达？还是你使用三等邮寄，因为它便宜得多，即使丢失也不是世界末日？\n\
  \n使用的网络协议取决于设备的类型以及其所在的環境。它也可能取决于数据用途的业务优先级。\n\n例如，在飞行中监控飞机引擎的情况下，获取最新数据比获取所有数据更重要。你需要尽快识别问题，而不是需要完整的飞行数据记录，而飞行数据大多相同。因此，如果你必须在等待但获得全部数据与永不等待但偶尔丢失一些数据包之间做出选择，你会选择后者。\n\
  \n这与拥有传感器的物流提供商不同，该传感器检测拖挂式卡车进入和离开配送中心。在这种情况下，你希望拥有完整的交通记录，并且愿意等待一两分钟来获取它。\n\n物联网中另一个需要理解的重要组件是网关。网关是连接使用不同协议的两个独立网络的网络节点。网关处理它们之间的转换。网关在许多受限设备的物联网网络中很常见。它将针对受限设备优化的协议转换为（通常）更广互联网使用的协议（IP）。\n\
  \n有多个标准分布在多个组织中，例如工业互联网联盟、IPSO 联盟和 IEEE P2413。随着许多公司和联盟沿着不同的连接协议结盟，它仍在不断演进。在选项凝聚成一小群一致使用的标准之前，可能还需要五到十年时间。\n\
  \n我们将回顾你最有可能遇到的顶级协议，并关注它们试图解决的问题。\n\n## 物联网网络连接协议\n\n连接性就是解决主要问题——建立通信方法。所采用的策略受网络设备约束的影响。可用电力通常是最重要的因素。\n\
  \n## 连接协议（可用电力受限时）\n\n以下协议专门设计用于解决低功耗约束。它们通常与支持的物联网设备中较低的复杂度和比特传输速率相关联。\n\n## Bluetooth\
  \ Low Energy（也称为 Bluetooth Smart）\n\n以十世纪统一了几个分裂部落的丹麦国王命名，蓝牙是大多数消费者熟悉的技术。该规范由一个名为**Bluetooth\
  \ Special Interest Group (SIG)**的组织维护，该组织由 25,000 家公司组成。**Bluetooth Low Energy (BLE)**是较新的实现，与蓝牙经典（移动电话耳机之名）不直接兼容。它专为低功耗需求和较少频繁的数据交换速率而设计。以下图表表示\
  \ BLE 的网络协议栈：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_48_0.png)\n\nBLE 设备在网络中要么是主设备要么是从设备。主设备在连接中充当广告者，而从设备充当接收者。一个主设备可以连接多个从设备，而一个从设备只能链接到一个主设备。与连接到主设备的从设备组成的网络组称为微微网。\n\
  \n为了使数据可用于分析，主设备通过本章后面将讨论的数据消息协议将其传递到互联网。通常有一个网关设备同时是蓝牙网络的一部分并且也链接到互联网。它将从 BLE 节点报告的数据转换为通过互联网进行数据消息的适当格式。它通常是一个不受约束的设备，不必太担心电力问题。\n\
  \n2016 年中期发布的蓝牙 5.0 规范承诺将速度提高一倍、范围提高四倍，并将低功耗场景下数据广播能力提高八倍。\n\n![](img/9f2a55db1236f995dcd9392acbc82910_49_0.png)\n\
  \n来源：Bluetooth SIG\n\n## 6LoWPAN\n\nIPv6 over Low-Power Wireless Personal Area Networks（6LoWPAN）作为协议栈数据链路部分中的适配层工作。它使无线标准\
  \ IEEE 802.15.4 设备能够使用 IPv6 进行通信。这使得通过互联网的通信变得容易得多，因为 IP 是通用语言。\n\n![](img/9f2a55db1236f995dcd9392acbc82910_50_0.png)\n\
  \n6LoWPAN 优化了 IPv6 数据报在低功耗和易受损网络上的传输。它实现此目的的一种方式是通过报头压缩。这将数据包中的寻址信息减少到几个字节。\n\n\
  安全性可以在链路层使用高级加密标准（AES）-128 加密实现。传输层安全性（TLS）加密也可以在传输层使用。\n\n支持网状网络。网络内部的设备使用无状态自动配置，在其中生成自己的\
  \ IPv6 地址。\n\n6LoWPAN 网状网络通过边缘路由器连接到 IPv6 互联网。边缘路由器有三项工作：\n\n- 6LoWPAN 内设备之间的本地数据交换\n\
  - 互联网与 6LoWPAN 设备之间的数据交换\n- 6LoWPAN 无线网络的创建和维护\n\n6LoWPAN 网络通过常见的基于 IP 的路由器连接到其他网络。这种连接可以通过任何类型的链路实现，例如\
  \ Wi-Fi、以太网或蜂窝网络。这使得连接到更广的互联网比其他需要有状态网关设备才能与 IP 网络通信的连接选项更简单。有状态网关设备更复杂，因为它们需要记住每个物联网设备的通信状态和状态。\n\
  \n\n\n\n6LoWPAN 网络中有两类设备：**主机**和**路由器**。路由器可以将数据报转发给其他设备。主机只是端点，可以处于休眠状态，定期唤醒并与父设备（路由器）登记以获取新数据。\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_51_0.png)\n\n6LoWPAN 网络示例\n\n## ZigBee\n\
  \nZigBee 与我们目前讨论的有所不同。它覆盖协议栈的多个层，包括网络协议、传输层，以及作为客户开发应用层基础的应用框架。\n\n![](img/9f2a55db1236f995dcd9392acbc82910_52_0.png)\n\
  \n它内置安全要求，并使用小型、低功耗的数字无线电工作。它是一种自组织的无线网状网络。名称来源于蜜蜂回巢时常跳的摇摆舞。\n\n传输距离较短，视线范围内可达 100\
  \ 米，但可以通过其他 ZigBee 设备组成的网状网络传递数据，从而实现长距离传输。\n\nZigBee 联盟是维护和发布 ZigBee 标准的公司联合体。ZigBee\
  \ 于 2003 年首次作为标准发布。它旨在比其他无线协议更简单、更便宜。开发代码可能仅为蓝牙等效代码的 2%。\n\n数据速率较低，设备往往很简单。ZigBee\
  \ 标准要求设备至少具备两年的电池寿命才能获得认证。数据传输是周期性和间歇性的。ZigBee 设备有不同的类别。全功能设备可以充当网络协调器，并支持星型和网状拓扑。精简功能设备只能与网络协调器通信，并工作在星型拓扑中。\n\
  \n这些设备形成一个**个人区域网（PAN）**。网络交互时间可以非常短。设备可在 30 ms 内加入网络，并在 15 ms 内从睡眠状态切换到活动状态。\n\n\
  网络中有三种 ZigBee 设备：\n\n- **协调器设备**：负责发起网络形成。每个网络有且仅有一个协调器。网络形成后，它也可以充当路由器。它作为信任中心，并存储安全密钥。\n\
  - **路由器设备**：可选。它可以加入协调器或其他路由器设备，并作为消息路由中的多跳中继。\n- **终端设备**：其功能仅足以与协调器通信。它是可选的，不能参与消息路由。\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_53_0.png)\n\nZigBee 网络路由协议是反应式的。它按需建立路由路径，而不是像\
  \ IP 那样主动建立。所使用的网络协议是**自组网按需距离矢量路由协议（AODV）**，该协议通过向所有邻居广播来查找目的地，邻居再向其所有邻居发送请求，直到找到目的地。\n\
  \n网络在连接之间是静默的，并且具有自愈能力。ZigBee 网络通过 128 位 AES 加密进行保护。通常有一个网关设备既是 ZigBee 网络的一部分，又连接到互联网。它负责将数据转换为适合互联网消息传递的格式，也可以将\
  \ ZigBee 网络路由协议转换为 IP 路由协议。网关通常是资源不受限的设备，不需要过多担心功耗问题。\n\n### ZigBee 的优势\n\nZigBee\
  \ 网络有几个优点：\n\n- **可靠且稳健**：网络自组织和自愈。\n- **低功耗要求**：设备可运行数年而无需更换电池。太阳能供电可持续更长时间。\n\
  - **全球性**：其底层无线协议在全球范围内可用。\n- **安全性**：加密是标准的一部分，而不是可选附加项。\n\n### ZigBee 的劣势\n\n\
  也存在一些缺点：\n\n- **非免费**：在撰写本文时，该标准的许可费为 3,500 美元。\n- **低数据速率**：不适用于支持更高的数据速率。\n- **星型网络受限**：协调器设备最多支持\
  \ 65,000 台设备。\n\n### 常见用例\n\nZigBee 常用于以下应用：\n\n- 家庭自动化\n- 公用事业监测与控制\n- 智能照明\n-\
  \ 楼宇自动化\n- 安全系统\n- 医疗数据采集\n\n## NFC\n\n**近场通信（NFC）**允许两台设备在相距非常近（约 4 厘米）时进行通信。它是一组提供低速度和简单设置的通信协议。根据类型和用例的不同，有多种\
  \ NFC 协议栈。\n\n![](img/9f2a55db1236f995dcd9392acbc82910_55_0.png)\n\nNFC 标志\n\nNFC\
  \ 在设备交换信息时使用两个环形天线之间的电磁感应。数据速率约为 100-400 kbit/s。它工作在 13.56 MHz 射频段，该频段无需许可且全球可用。\n\
  \n通常有一个完整的 NFC 设备（如智能手机）和一个 NFC 标签（如芯片读取器）。所有完整的 NFC 设备都可以在三种模式下运行：\n\n- **NFC 点对点**：设备随时交换信息。\n\
  - **NFC 卡模拟**：在此模式下，智能手机可以充当智能卡，实现移动支付或票务功能。\n- **NFC 读写器**：完整的 NFC 设备可以读取存储在廉价\
  \ NFC 标签中的信息，例如海报或小册子上使用的类型。您可能在会议上用过此功能来扫描与会者胸牌。\n\nNFC 标签通常是只读的，但也可能是可写的。NFC 通信中有发起设备和目标设备。发起设备产生一个射频场，可以为目标设备供电。这意味着在所谓的被动模式下，NFC\
  \ 标签不需要电池。无源 NFC 标签设备非常便宜，只需几美分。\n\n还有一种主动模式，每个设备通过交替生成自己的场来读取数据，然后关闭场以接收数据，从而相互通信。这种模式通常要求两个设备都有电源。\n\
  \n对于最终进入分析数据集的数据记录，完整的 NFC 设备将充当网关，转换消息，然后通过不同的网络协议栈进行通信。以智能手机为例，它会获取 NFC 标签数据，创建自己的数据消息，通过\
  \ 4G/LTE 发送到互联网上的目的地。\n\n### 常见用例\n\nNFC 常用于以下应用：\n\n- 智能手机支付：\n  - Apple Pay\n\
  \  - **主机卡模拟（HCE）** - 支持 Android\n- 智能海报\n- 识别卡\n- 事件记录\n- 触发可编程操作\n\n## Sigfox\n\
  \nSigfox 是一家总部位于法国的公司，开发了一种蜂窝式、超低功耗、远距离网络技术。它适用于不频繁发送的小型消息。数据速率非常低，仅为每秒 100 比特（bps）。所用信号可传输长达\
  \ 25 英里，一个基站可处理多达一百万个节点。与蜂窝网络类似，它不适用于专用网络，因为使用它需要所在区域有网络覆盖。\n\n![](img/9f2a55db1236f995dcd9392acbc82910_56_0.png)\n\
  \nSigfox 设备由于低复杂性和低功耗要求，成本可能非常低。功耗要求可低至同等蜂窝通信的千分之一。它已被用于廉价但重要的产品中，例如烟雾探测器和狗用健身追踪项圈（认真的）。\n\
  \n目前的覆盖范围包括法国和西班牙全境、欧洲其他几个区域，以及北美的一些大都市地区。\n\n## 连接协议（当功耗不是问题时）\n\n这些协议更关注速度和高速率。功耗限制相对不那么重要。它们通常要求所支持的物联网设备具有更高的复杂度。\n\
  \n## Wi-Fi\n\nWi-Fi 是遵循 IEEE 802.11 规范的任何无线网络。它无处不在，全球通用。除非你过去十年一直躲在洞穴里，否则你对它非常熟悉。许多物联网设备使用它连接到互联网，因此有必要回顾一下它的工作原理。\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_57_0.png)\n\n要连接到 **Wi-Fi 局域网（WLAN）**，设备需要网络接口控制器。这可以是单独的控制器卡，也可以简单地集成在设备内部的芯片组中。通信在预先确定的无线电通信频段上使用以太网风格的数据包。数据包投递不保证，采用尽力而为的投递机制。协议栈中较高的网络协议层（如\
  \ TCP 或 UDP）可以在 Wi-Fi 标准之上提供数据传输保证。\n\n\n\n一个较新的类别——**LTE 类别 0（LTE Cat 0）**——专为物联网需求而设计。它的数据速率较低，最高上限为\
  \ 1 Mbit/s。LTE Cat 0 还缩小了带宽范围，从而可以大幅降低复杂度。它仍然能够在所有现有 LTE 网络上运行，并支持功耗受限的物联网设备。\n\n\
  不过，蜂窝网络的覆盖并非在所有地区都可用。仍然有一些地方收不到信号。对于分析而言，这意味着如果你的物联网设备四处移动，它可能会进入没有信号的区域。在这种情况下，数据可能会丢失，除非将数据缓冲起来，直到信号恢复。\n\
  \n## 常见用例\n\n蜂窝网络通常用于以下应用场景：\n\n- 货运跟踪\n- 车辆互联（远程信息处理）\n- 智能手机（显然）\n- 远程设备监控\n\n\
  ## 物联网网络数据消息协议\n\n物联网联网设备在传输数据消息时有许多策略。尽管连接性和数据消息有时会混在一起，但为了简单起见，我们将分开讨论。\n\n请注意，事情并没有那么简单，但我们会介绍最常用的几种协议。对于更常用的协议，我们会多花些篇幅介绍。\n\
  \n## 消息队列遥测传输（MQTT）\n\nMQTT 是与物联网关联的最常见的数据消息协议。所有主要的云基础设施提供商（AWS、Microsoft 和 Google）都支持它。而且它很可能就是正在用于传输你的数据的协议。它的设计目标是实现最小的功耗损失和最低的带宽需求。它最初是为了通过卫星通信网络支持远程油气场景而诞生的。随着近年来的发展，它很好地融入了更广泛的物联网领域。\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_61_0.png)\n\n从本质上讲，它在概念上类似于消息队列架构，但尽管名称如此，它并不是传统意义上的队列。这意味着新数据会作为消息进入中间的代理（broker），然后被投递到终端服务器。物联网设备被称为发布者，终端服务器被称为订阅者。两者都连接到代理，但彼此之间从不直接连接。\n\
  \nMQTT 遵循发布/订阅架构模式（即 pub/sub），但它的实现方式与传统消息队列不同。它是一种只容纳一条消息的队列——主题的消息会被最新数据替换，而不是像传统消息队列那样被追加到不断增长的消息序列中。\n\
  \n代理上的消息始终存在，无论发布者或订阅者是否在线、是否愿意与之交互。这使得它在面对（有意或无意的）间歇性连接时依然稳健。订阅者不必等待发布者醒来并愿意通信。发布者可以发送消息，而无需关心谁愿意且能够接收它。\n\
  \n订阅者支持主题匹配的概念。这样，在订阅主题时可以使用通配符 + 或 #。发布者则不允许这样做。\n\n+ 是单层级的通配符。它的工作原理类似于搜索模式：所有非\
  \ + 的层级都必须匹配。# 是多层级的通配符，必须放在字符串末尾。它将返回指定的整个层级结构。就像在文件系统中复制文件夹一样，它会订阅指定层级下的所有子目录和文件。\n\
  \n通配符让主题订阅管理变得更简单。你可以订阅 `vehicleID/engine/+/temperature` 来获取 engine 主题下的所有温度值。你也可以订阅\
  \ `+/engine/oil/temperature` 来获取所有向该代理发布数据的设备的机油温度值。你还可以订阅 `vehicleID/engine/#`\
  \ 来获取该层级结构中的所有值，无论层级有多深。\n\n重要的是，在设计主题树时要将灵活性纳入考量。它应该是可扩展的，这样无需重新设计主题树即可添加新的分支。从分析的角度看，这意味着如果设计得当，从设备添加更多信息的成本相对较低。如果设计不佳，就需要重新设计主题树，这会使成本更高，因此往往不太可能进行。在分析领域这个不断变化的世界中，你会不断学习新事物并加以利用，因此你希望在各个层面都拥有灵活性。\n\
  \n## MQTT 的优势\n\n- **数据包无关性：** 数据包所携带的负载中可以传输任何类型的数据。数据可以是文本或二进制。只要接收方知道如何解析，就无所谓。\n\
  - **可靠性：** 可以使用一些**服务质量（QoS）**选项来确保消息投递。\n- **可扩展性：** 发布/订阅模型可以以节能的方式良好扩展。\n- **解耦设计：**\
  \ 该设计中有多个元素将设备与订阅服务器解耦，从而带来更稳健的通信策略。\n- **时间：** 无论订阅服务器处于何种状态，设备都可以发布其数据。订阅服务器随后可以在有能力时连接并接收数据。这在时间维度上对通信两端进行了解耦。可以将其想象成用手机给某人发短信。他可以在有空时回复。如果你给他打电话，他就必须与你在同一时间有空通话。如果你们俩整天都在开会，最终就只能互相留语音信箱，沟通就会变慢。这使设备能够保持在休眠状态，而不必担心当设备醒来通信时，订阅服务器是否能够接收数据。\n\
  - **空间（投递细节）：** 发布者需要知道代理的 IP 地址以及如何与它通信，但不需要知道订阅者的任何信息。订阅者也无需知道发布者的网络连接细节。这使设备端的通信开销保持在较低水平（设备端通常在可用电力方面受到更多限制）。它还允许两端独立运行。订阅者可以被更换或升级，也可以增加额外的订阅者，而发布设备端无需任何更改。\n\
  - **异步性：** 任何一方都不必暂停当前正在做的事情来通信或接收消息。该过程是异步的。无需中断正在进行的工作即可发布消息。\n- **安全性：** 这一点同时出现在优势和劣势列表中。使用\
  \ MQTT 可以实现安全性，因此它被列在优势列表中。由于 MQTT 运行在 TCP 之上，你可以在通信中使用 TLS/SSL 加密，而且绝对应该这样做。但 MQTT\
  \ 本身是未加密的，这也是它也出现在劣势列表中的原因——稍后将对此进行更多说明。\n- **双向性：** 设备既可以充当发布者，也可以充当订阅者。这样，它就可以通过订阅代理上的某个主题来接收命令。它还可以接收来自其他设备的数据，这些数据可以作为其发布数据的输入。在实践中，通常是中心辐射（hub\
  \ and spoke）模型。\n- **成熟度：** MQTT 由 IBM 发明，协议初稿于 1999 年基于其 MQSeries 产品制定（这就是名称中“消息队列”部分的由来）。它于\
  \ 2010 年免版税发布，此后作为开源项目捐赠给了 Eclipse 基金会。如今，数百万互联产品都在使用它。\n\n## MQTT 的劣势\n\n- **它运行在\
  \ TCP 之上：** TCP 是为内存和处理能力比许多轻量级、功率受限的物联网设备更强的设备而设计的。TCP 在交换任何消息之前，需要更多握手来建立通信链路。这会增加唤醒时间和通信时间，从而影响长期电池消耗。通过\
  \ TCP 连接的设备往往会以持久会话的方式为彼此保持套接字打开。这会增加功耗和内存需求。\n- **集中式代理可能限制规模：** 代理会影响可扩展性，因为每连接一个设备都会产生额外开销。网络的增长规模只能达到本地代理中心所能支持的上限。这限制了每个中心辐射组的扩展。\n\
  - **代理成为单点故障：** 代理也可能是网络中的单点故障。一种常见的情况是，代理设备插在墙上插座中，而若干发布设备使用电池供电。一旦停电，发布设备会继续运行，但代理会离线。在恢复供电之前，该网络将毫无用处。\n\
  - **安全性：** MQTT 默认不加密。这使其天生不安全，需要你采取额外步骤并承担一些开销，以确保实现 TLS/SSL。否则，通过 MQTT 进行的任何通信（包括用户名和密码）都对黑客敞开。\n\
  \n### QoS 级别\n\nQoS 级别本身存在一种权衡取舍。QoS 是 MQTT 中对消息投递可靠性要求的术语。这是网络领域中的一个常见术语，我们将回顾它在\
  \ MQTT 中具体是如何实现的。\n\n这种权衡存在于所用带宽与消息投递可靠性之间。为确保更高的可靠性，需要更多的往返消息，这会增加同一消息数据包的带宽需求。MQTT\
  \ 为你提供了一些可供选择的选项。\n\n![](img/9f2a55db1236f995dcd9392acbc82910_65_0.png)\n\nQoS 是针对通信两端分别设置的。发布者到代理的消息连接会设置一个\
  \ QoS，代理到订阅者的连接也会单独设置一个 QoS。通常两者的 QoS 相同，但也并非总是如此。\n\n\n\n\n## QoS 0\n\n**Fire and\
  \ forget** - sir, yes, sir!\n\nQoS 0 是最低的 QoS 级别，通常被称为 fire and forget。消息发送到代理时，不会确认代理是否已将其转发给订阅者。它仍然具有\
  \ TCP 协议的所有保证，就像所有标准 MQTT 形式一样。\n\n如以下图所示，通信开销最小，这意味着功耗最小。一旦发送到代理，消息就会在设备（发布者）上被删除。代理会立即向具有开放连接的订阅者转发。\
  \ 与其他 QoS 级别不同，当 QoS 设置为零时，消息不会为离线订阅者存储。\n\nQoS 0 通常用于连接稳定且中断可能性不大时，例如有线连接的情况。它还用于功耗限制比消息传递更重要时。在这种情况下，要么即使丢失一些消息，结果数据也是可以接受的，要么消息频率足够高，以至于丢失一条也没关系，很快就会有另一条到来。\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_66_0.png)\n\n## QoS 1\n\n**Deliver once**\
  \ - I don't care if you send it 10 times, just make sure they get it.\n\nQoS 1 是最常用的级别。它保证消息至少被传递一次。重复消息需要在订阅者端或后续处理中进行处理。通信开销高于\
  \ QoS 0，但只有 QoS 2 一半的来回次数。\n\nQoS 1 用于需要保证传递且用例可以处理重复消息时。\n\n![](img/9f2a55db1236f995dcd9392acbc82910_67_0.png)\n\
  \n## QoS 2\n\n**Deliver exactly once** - Make sure they get it, but make sure they\
  \ only get it once - they get confused.\n\nQoS 2 保证消息被传递并且只传递一次。如图所示，为了实现这一保证，需要多次来回通信。通信状态需要在双方之间存储，直到完整的传递确认传回发布者。这需要设备具有更高的功耗水平，以及更大的内存占用以存储更复杂的状态。完成\
  \ QoS 2 通信也需要稍长的时间。\n\nQoS 2 用于需要保证传递且终端应用程序或订阅客户端无法处理重复消息时。\n\n![](img/9f2a55db1236f995dcd9392acbc82910_68_0.png)\n\
  \n## Last Will and Testament (LWT)\n\n这个创意命名的功能有助于 MQTT 处理有损网络并增强可扩展性。它是可以在代理上存储的消息，以防发布者意外掉线。\n\
  \n它存储状态和目的，包括其发布过的命令及其订阅。当它掉线时，代理会通知所有 LWT 订阅者。当它返回时，代理会将其恢复到先前的状态。\n\n![](img/9f2a55db1236f995dcd9392acbc82910_70_0.png)\n\
  \n## Representational State Transfer (REST) principles\n\nREST 允许联网设备使用统一的应用程序编程接口（API）相互互操作。符合此标准的设备或服务器称为\
  \ RESTful。它假设交互基于客户端/服务器并且是无状态的。下表显示了 HTTP REST API 接口支持的关键命令：\n\n| HTTP REST API\
  \ |\n| --- |\n| HTTP POST: Adds a new resource |\n| HTTP PUT: Updates a specific\
  \ resource by replacing it with an updated version |\n| HTTP GET: Reads a specified\
  \ resource |\n| HTTP PATCH: Partially updates a resource in a collection |\n| HTTP\
  \ DELETE: Deletes a resource |\n\n## HTTP and IoT\n\n在许多情况下，HTTP 对于物联网应用来说并不理想。延迟不可预测，并且通常依赖轮询来检测状态变化。它是一种基于文本的协议，这意味着消息大小往往很大。这增加了功耗和复杂性开销，以便物联网设备使用它进行通信。\n\
  \n然而，它是一个成熟的标准并且被广泛使用。这使其成为一个成熟且得到良好支持的接口。\n\n连接由客户端设备建立到服务器设备，并在通信完成前保持打开。传递有保证，数据消息在过程的每一步都被确认。它运行在\
  \ TCP 之上并且可靠。\n\n## Advantages to HTTP\n\nHTTP 作为物联网协议有几个优点：\n\n- **Reliability**:\
  \ Message delivery is guaranteed and acknowledged.\n- **Ubiquity**: HTTP is used\
  \ all over the place and is very easy to implement.\n- **Ease of implementation**:\
  \ If you can connect to the internet, you can use HTTP anywhere in the world. No\
  \ special hardware or software is required.\n\n## Disadvantages to HTTP\n\nHTTP\
  \ 作为物联网协议有一些缺点：\n\n- **Higher power needs**: Communications have frequent back and\
  \ forth interactions, connections need to be sustained, and plain text results in\
  \ larger message sizes. All of this requires more power to support.\n- **The IoT\
  \ device complexity**: The device needs enough memory and CPU power to support the\
  \ TCP protocol and high level HTTP RESTful APIs.\n\n## Constrained Application Protocol\
  \ (CoAP)\n\nCoAP 是通过 **User Datagram Protocol (UDP)** 的点对点通信。它具有低开销要求，并专门为在互联网上运行的低功耗设备而开发。它被设计为可在\
  \ RAM 低至 10 KiB 的微控制器上运行，并且操作代码仅需要 100 KiB。\n\n![](img/9f2a55db1236f995dcd9392acbc82910_72_0.png)\n\
  \nCoAP 由互联网工程任务组（IETF）创建，以满足功耗受限的物联网设备的需求。它也由 Eclipse 基金会作为开放标准支持。\n\nCoAP 遵循客户端/服务器架构，并且是一种一对一的通信约定。它确实允许一些组播功能，这在本文撰写时仍处于早期开发阶段。\n\
  \nCoAP 与 HTTP 相似，因为它是一种文档传输协议并且与 RESTful 网络互操作。它与 HTTP 不同，因为它为网络功耗低且经常有损的应用而设计。\n\
  \nCoAP 运行在 UDP 协议上，其中数据包比使用较大 TCP 数据包的 HTTP 小得多。客户端和服务器在没有建立连接的情况下进行通信。信息通过自包含的数据报传输。数据报是\
  \ UDP 协议的核心，每个数据报都包含路由所需的所有必要信息，而无需依赖客户端和服务器之间的先前交换。\n\n可以把数据报想象成通过邮件与某人通信（老式蜗牛邮件）。信封上有投递地址和回邮地址，负载就是信封内的信件，但邮递员看不到。\
  \ 你定期给在波兰的表亲寄信。她也定期给你寄信。\n\n你无法保证所有信件都会被送达或按你发送的顺序送达。收到信件后，打开它们、按正确顺序排列并找出是否有遗漏是你的责任。如果你发现缺少一封，你会处理给表亲寄信请求重发。\n\
  \nCoAP 的工作方式相同，其中发送和接收应用程序扮演你和你表亲的角色。应用程序需要适当编程以处理所需的传递可靠性级别。\n\n## Advantages to\
  \ CoAP\n\nCoAP 有一些优点：\n\n- **Reduced power requirements:** It operates over UDP,\
  \ which requires minimal overhead for communications. It also allows faster wake\
  \ up times and extended sleepy states. Taken together, this means batteries last\
  \ longer for IoT devices.\n- **Smaller packet size:** Another advantage of UDP is\
  \ small packet sizes. This leads to faster communication cycles. Again, this allows\
  \ batteries to last longer.\n- **Security:** Like MQTT, this is on both the advantage\
  \ and disadvantage lists. When **Datagram Transport Layer Security (DTLS)** is employed\
  \ over UDP, communication is encrypted and secure. Even though there is some additional\
  \ overhead required to implement this, you can and should use it.\n- **Asynchronous\
  \ communication option:** Clients can request to observe a device by setting a flag.\
  \ The server (IoT device) can then stream state changes to the client as they happen.\
  \ Either side can cancel the observe request.\n- **IPv6 based:** It was designed\
  \ from the beginning to support IPv6. This also allows for a multicasting option.\n\
  - **Resource discovery:** Servers can provide a list of resources and media types.\
  \ The client can then review and discover what is available.\n\n\n\n\n\n## CoAP\
  \ 的不足之处\n\nCoAP 也存在一些缺点：\n\n- **消息不可靠**：UDP 不保证数据报的送达。CoAP 提供了一种请求确认应答（ACK）的方法，以确认消息已被接收。但这并不能验证消息是否被完整接收并被正确解码。\n\
  - **标准仍在完善中**:CoAP 仍在发展演进，尽管其背后有巨大的市场推动力。随着使用越来越广泛，它很可能会快速成熟。\n- **NAT 问题**：网络地址转换（NAT）设备在企业网络和云环境中很常见。由于\
  \ IP 可能随时间动态变化，CoAP 在与 NAT 后面的设备通信时可能会出现问题。\n- **安全性**：与 MQTT 一样，CoAP 默认不加密。这使得它在原生状态下不安全，你需要采取额外措施确保通信不会对黑客敞开。\n\
  \n## 消息可靠性\n\n这相当于 MQTT 的服务质量（QoS）。对于 CoAP，可以选择将请求和响应数据报标记为可确认（confirmable）。在这种情况下，接收方会回复一条确认（ACK）消息。\n\
  \n如果未标记该标志，数据报就是“发完即忘”的。这相当于 MQTT 的 QoS 0。\n\n## 常见用例\n\nCoAP 协议通常用于以下应用：\n\n- \
  \  ​​公用事业现场区域网络\n-   远程气象站传感器\n-   密封的电池供电传感器设备\n\n## 数据分发服务（DDS）\n\nDDS 是一种网络中间件。其标准由对象管理组织（OMG）管理。它是一种总线式架构；不要求有中心节点。通信是点对点的，并且不受集中控制。\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_75_0.png)\n\nDDS 通过称为动态发现的流程自动发现通信端点。DDS\
  \ 使用发布/订阅模型的一种变体，总线上的节点会公布它们正在发布什么数据，以及它们想要订阅什么数据。\n\nDDS 参与者可以位于同一台机器、同一个工厂，甚至分布在很大的区域内。当各个\
  \ DDS 域链接在一起时，所有这些情况可能同时存在。这是一种高度可扩展的架构。\n\n数据交换是实时的、可靠的，并且具有高传输速率。DDS 为你处理传输工作的细节，例如消息寻址、传递、流量控制、重试以及数据编组/解编组。任何节点都可以是发布者、订阅者，或者同时是两者。\n\
  \n## 分析数据以推断协议和设备特性\n\n回到物联网分析的第一要则：*绝不要信任你不了解的数据。*\n\n你需要去了解你的数据。就像你刚认识的新朋友一样，你会先用谷歌搜索他，打听他的情况，并做一次犯罪背景调查（我们知道你会这么做），然后才同意和他共进晚餐。\n\
  \n以下是一种逐步了解数据来源的策略：\n\n1.  **画出设备的示意图**：把它勾画出来，如果有蓝图就用蓝图。这是你与设计工程师交朋友并提出一些问题的好时机。在传感器所在的位置画出关键传感器，并标注传感器类型和任何限制条件。询问任何影响精度的环境条件并标记下来。\n\
  2.  **查明设备如何连接到网络**：在你的示意图上标注连接类型。\n3.  **确定设备使用哪种数据消息协议进行通信**：将此标注在你的示意图上。下面是一个简单示例：\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_77_0.png)\n\n4.  **如果你能实地访问设备正在使用的现场，那就去现场**：拍照。如果不能，请让常在外奔波的人帮忙拍一些照片。尽量获取几个不同的地点。目的是捕捉真实世界的情况，以备日后参考。\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_78_0.png)\n\n5.  **将实地照片和示意图合并成一份参考文档**：把它钉在工位隔板上方便参考；你以后可能会用到它。\n\
  \n6.  **分析你的数据，推断一些关于它的信息：**\n\n    1.  取几个月完整的 数据。数据量要足够小以便于处理，又要足够大以包含一些历史信息。\n\
  \    2.  通过用同一设备当前记录的时间减去上一条记录的时间，计算记录之间的频率。这将得到每条消息的间隔数值。\n    3.  随机选择至少 30 台设备，并将其所有记录单独放在一边。\n\
  \    4.  对每台设备，目视检查记录。如果间隔数值在大多数情况下是一致的，那么你现在知道它有一个固定的上报频率，以及上报之间的时间长度。如果间隔数值不一致，很可能没有固定的间隔，数据是在设备进入网络覆盖范围（设备移动时）或不规则事件触发通信时才进行传输。无论哪种情况，都要在参考文档中记录下来。\n\
  \    5.  注意间隔数值出现不规则增加的情况。如果这种情况频繁发生，设备很可能处于数据丢失严重的网络环境中。将这点记在参考文档中。\n    6.  如果间隔很长（数小时或数天），并且消息大小（列数）较小，那么你的物联网设备可能资源受限，并且依赖长期使用的电池。它更有可能处于丢包严重的网络环境中。\n\
  \    7.  如果间隔很短（每几秒或几分钟），那么它可能很容易获得电源。它不太可能处于丢包严重的网络环境中。\n    8.  计算每台设备按日期统计的平均间隔。将它们绘制在同一个图表上，每台设备对应一条单独的线。如果所有设备的平均间隔变化恰好发生在完全相同的日期，那么你的集中式数据收集过程存在网络或数据处理问题。\n\
  \n## 总结\n\n本章更深入地回顾了物联网设备的种类和网络协议。你了解了设备的范围以及一些示例用例。我们还讨论了各种网络协议以及它们试图解决的业务需求。\n\
  \n我们回顾了如何理解主要设备类别和网络协议策略的“是什么”和“为什么”。我们还讨论了一些通过分析数据来识别设备和网络协议特征的技术。\n"
- "## 云上的物联网分析\n\n既然你知道你的数据是如何被传回公司服务器的，你觉得自己对它有了更好的理解。你脑海中也有了一个关于它在现实世界中如何运作的参考框架。\n\
  \n你的老板又来了。\n\n> “那个滚动平均作业跑完了吗？”他焦急地问。\n\n三个月前它运行良好，一个小时内就能完成。后来它花费的时间越来越长，现在有时甚至无法完成。今天，它已经运行了六个小时，你正祈祷着它不要出问题。昨天，它两次崩溃，看起来像是内存不足的错误。\n\
  \n你与 IT 部门和财务部门讨论过，想获得一台更快、内存更大的服务器。这需要花费很大一笔钱，而且可能还需要几个月才能完成采购、下单和安装的流程。你在财务部门的朋友对此审批持犹豫态度。这笔钱不在本财年的预算之内。你感觉很不好，尤其是这是唯一一个给你带来麻烦的分析作业。它只是每月运行一次，但产生关键数据。\n\
  \n你不知道还能说什么，只能给你的老板一个充满希望但勉强的微笑，并向他展示你交叉的手指。\n\n> “它还在运行……这是好事，对吧？”\n\n本章将讨论基于云的基础设施在处理和分析物联网数据方面的优势。我们将讨论云服务，包括**Amazon\
  \ Web Services** (AWS)、**Azure** 和 **ThingWorx**。你将学习如何弹性地实施分析，以实现各种各样的功能。\n\n\n\
  \n\n\n本章将涵盖以下内容：\n\n- 构建弹性分析\n- 为扩展而设计\n- 云安全与分析\n- 主要云服务提供商：\n  - Amazon AWS\n\
  \  - Microsoft Azure\n- PTC ThingWorx\n\n## 构建弹性分析\n\n物联网数据量增长迅速。物联网分析在难以预测的时间点尤其计算密集。业务价值不确定，需要大量实验才能找到正确的实现方式。\n\
  \n将所有这些结合起来，你需要一种能够快速扩展、动态响应资源需求、并且在恰当的时间具有几乎无限容量的方案。而且所有这些都需要快速实现，成本低且维护需求低。\n\n\
  云登场了。物联网分析与云基础设施配合得天衣无缝。\n\n## 什么是云基础设施？\n\n美国国家标准与技术研究院定义了五个基本特征：\n\n- **按需自助服务**：你可以在无需与他人交互的情况下按需配置服务器和存储等资源。\n\
  - **广泛的网络访问**：你的云资源可通过互联网（如果已启用）通过各种方式访问，例如网络浏览器或手机。\n- **资源池化**：云提供商使用多租户模型在众多客户之间汇集其服务器和存储容量。资源，无论是物理还是虚拟，都根据需要动态分配和重新分配。资源的特定位置未知且通常不重要。\n\
  - **快速弹性：** 你的资源可以弹性地创建和销毁。这可以根据需求自动发生。你可以快速扩展。你也可以快速收缩。从你的角度来看，资源的供应几乎是无限的。\n-\
  \ **可计量服务：** 资源使用情况由云提供商监控、控制并报告。你可以访问相同的信息，从而对你的使用情况提供透明度。云系统会持续自动优化资源。\n\n存在一种私有云的概念，它们部署在本地或由第三方为特定组织定制构建。就我们的关注点而言，我们只讨论公共云。总体而言，大多数分析将在公共云上完成，因此我们将集中精力于此。\n\
  \n公共云上触手可及的容量令人震惊。AWS 在 2016 年 6 月估计有 130 万台服务器在线。这些服务器被认为比企业系统高效三倍。\n\n云提供商拥有硬件并维护网络和系统以提供可用服务。你只需通过通常的\
  \ Web 应用程序配置所需使用的资源即可。\n\n提供商提供不同级别的抽象。他们提供低级别的服务器和存储，让你拥有精细的控制权。他们还提供托管服务，可为你处理服务器、网络和存储的配置。这些服务相互结合使用，两者之间几乎没有区别。\n\
  \n硬件故障会自动处理。资源会被转移到新硬件并重新上线。当你为云设计时，物理组件变得不重要，它被抽象掉了，你可以专注于资源需求。\n\n使用云的优势有：\n\n\
  - **速度：** 你可以在几分钟内将云资源上线。\n- **敏捷性：** 快速创建和销毁资源的能力带来了实验的便利性。这提高了分析组织的敏捷性。\n- **服务多样性：**\
  \ 云提供商提供许多可支持分析工作流的服务，可在几分钟内部署。这些服务为你管理硬件和存储需求。\n- **全球覆盖：** 你只需点击几下即可将分析的覆盖范围扩展到世界另一端。\n\
  - **成本控制：** 你只需为所需时间所需的资源付费。你可以用更少的钱做更多。\n\n为了了解你触手可及的强大功能，这里有一个 NASA 在 AWS 上构建的架构图，作为面向学童的推广项目的一部分：\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_83_0.png)\n\n来源：Amazon Web Services,\
  \ https://aws.amazon.com/lex/\n\n当给出语音命令时，它将与火星探测车复制品通信以检索物联网数据，例如温度读数。该过程包括语音识别、从文本生成自然语音、数据存储和处理、与物联网设备的交互、网络、安全以及发送短信的能力。这不是一年的开发工作量，它是通过将已有的基于云的服务连接起来构建的。\n\
  \n而且这不仅仅适用于像 NASA 这样资金充足的政府机构。所有这些服务以及更多服务今天都可供你使用，如果你的分析运行在云中。\n\n## 弹性分析概念\n\n\
  我们所说的**弹性分析**是什么意思？让我们将其定义为设计你的分析流程，使扩展不再是问题。你希望专注于分析而不是底层技术。你希望避免限制你的分析能力以使其适应某些固定的硬件限制。相反，专注于分析的潜在价值与现有硬件所能实现的极限。\n\
  \n你还希望你的分析能够扩展。它应该能够从支持 100 台物联网设备扩展到 100 万台物联网设备，而无需任何根本性更改。唯一发生的事情是成本随着需求的增加而增加。\n\
  \n这降低了复杂性并提高了可维护性。这转化为更低的成本，使你能够进行更多分析。更多分析增加了发现价值的可能性。发现更多价值又能实现更多分析。良性循环！\n\n\
  一些核心弹性分析概念：\n\n- **将计算与存储分离：** 我们习惯于像思考笔记本电脑规格一样思考资源。你购买一台具有 16 GB 内存和 500 GB 硬盘的设备，因为你认为这将满足你\
  \ 90% 的需求，并且是你的预算上限。云基础设施将这一切抽象掉了。在云中进行分析就像租用一台神奇的笔记本电脑，你可以通过弹指一挥将 4 GB 内存变成 16\
  \ GB。你的租金账单仅在你使用 16 GB 的时间内增加。你再次弹指将其降回 4 GB 以节省一些钱。你的硬盘可以独立于内存规格增长和收缩。你不必被迫在两者之间选择一个良好的平衡。你可以将计算需求与要求相匹配。\n\
  - **从一开始就为扩展而构建：** 使用可以从 1 到 100 万扩展而无需更改的软件、服务和编程代码。你投入生产的每个分析流程都有持续的维护工作，随着你添加越来越多的流程而随时间累积。以后让自己轻松一些。你不希望不得不停止手头的工作来重新设计一年前构建的流程，因为它达到了扩展的极限。\n\
  - **让你的瓶颈是湿件而不是硬件：** 所谓湿件，我们指的是脑力。*我的笔记本电脑内存不足以运行该作业永远不应该是问题。它始终应该是我还没有想明白，但我正在测试几种可能性。*\n\
  - **按支出预算管理，而不是按可用硬件管理：** 只要符合你的支出预算，就使用你需要的云资源。当你在云中运行分析时，没有必要将分析限制在固定数量的服务器内。传统的企业架构会提前购买硬件，这会产生资本支出。你的财务人员通常不喜欢资本支出。你也不应该喜欢它，因为这意味着你能做的事情已经设定了一个上限（至少在短期内）。按支出管理意味着关注成本，而不是资源限制。需要时扩展，并确保快速收缩以保持成本低。\n\
  \n\n\n\n\n随着你的分析逐步发展，你将拥有一系列操作：要么转换数据，要么通过模型或算法运行数据，要么对结果作出反应。事情很快就会变得复杂。通过封装分析，当未来需要修改时，更容易知道该在何处下手。你还可以在不影响其他组件的情况下重新配置流程的某些部分。\n\
  \n封装过程遵循以下步骤：\n\n- 1. 列出所有步骤。\n- 2. 将它们分组。\n- 3. 思考哪些组可能会一起变化。\n- 4. 将独立的组拆分为各自的流程。\n\
  \n如果可能的话，最好将数据转换步骤与分析步骤分开。有时，分析与数据转换紧密耦合，分离没有意义，但在大多数情况下，它们是可以分离的。基于分析结果的操作步骤几乎总是应该单独分开。\n\
  \n每一组步骤也都有各自的资源需求。通过封装并将流程分开，你可以独立分配资源，并在需要的地方更高效地扩展。你可以用更少的资源做更多的事情。\n\n## 使用消息队列进行解耦\n\
  \n使用消息队列解耦封装后的分析流程有几个优点。它允许任何流程发生变化，而无需其他流程进行调整。这是因为它们之间没有直接联系。\n\n它还构建了一定的健壮性，以防某个流程发生故障。当宕机的流程重启时，队列可以继续扩展而不会丢失数据；一切恢复后，不会有任何数据丢失。\n\
  \n## 什么是消息队列？\n\n![](img/9f2a55db1236f995dcd9392acbc82910_87_0.png)\n\n新数据作为消息进入队列，排队等待投递，然后轮到时再被投递到最终服务器。添加消息的进程称为**发布者**，接收消息的进程称为**订阅者**。\n\
  \n无论发布者或订阅者是否连接在线，消息队列都会存在。这使得它能够抵御间歇性连接（无论是有意还是无意）。订阅者不必等待发布者愿意通信，反之亦然。\n\n队列的大小也可以根据需要增长和收缩。如果订阅者落后了，队列就会增长以补偿，直到它能赶上。这在发布者突然爆发大量消息时会很有用。队列会充当缓冲区并扩展以捕获消息，同时订阅者正在处理突然涌入的数据。\n\
  \n当然，也存在限制。如果队列达到某个设定的阈值，它将拒绝（并且你很可能会丢失）任何传入的消息，直到队列重新受控。\n\n下面是一个刻意设计但真实的例子，说明这种情况可能如何发生：\n\
  \n> Joe Cut-rate（开发者）：*嘿，你希望那个小玩意儿设备什么时候醒来并上报？*\n> \n> Jim Unawares（工程师）：*每 4 小时*\n\
  > \n> Joe Cut-rate：*没问题。我会把它编程为从 UTC 午夜 12 点开始，然后之后每 4 小时报告一次。顺便问一下，这种东西你打算再卖多少？*\n\
  \n## 分布式计算\n\n分布式计算，也称为集群计算，指的是使用框架将流程分散到多台服务器上，这些框架抽象了每台服务器的协调工作。这些框架让你感觉就像在使用一个统一的系统。在底层，可能只有几台服务器（称为节点），也可能有数千台。框架为你处理编排工作。\n\
  \n## 避免将分析局限于单台服务器\n\n这对物联网分析的优势在于规模。你可以通过向集群添加节点来增加资源；无需更改分析代码。目前最常用的框架是 Hadoop，我们将在*第\
  \ 4 章“创建 AWS 云分析环境”*中讨论它。\n\n尽量避免将分析局限于单台服务器（少数例外除外）。这会给扩展带来上限。\n\n## 何时使用分布式，何时使用单台服务器\n\
  \n不过，分布式计算也有复杂性成本。它不像单服务器分析那么简单。尽管框架为你处理了大量复杂性，你仍需要考虑并设计你的分析以便跨多个节点运行。\n\n以下是一些关于何时保持简单并运行在单台服务器上的指导原则：\n\
  \n- **没有太大的扩展需求：** 即使物联网设备和数据数量爆炸式增长，你的分析流程也几乎不需要变化。例如，分析流程对已经按月份汇总的数据运行预测。在这种情况下，设备数量几乎不产生影响。\n\
  - **小数据而非大数据：** 分析在少量数据子集上运行，受数据规模的影响不大。对随机样本进行分析就是一个例子。\n- **资源需求极低：** 即使数据量高出几个数量级，你也不太可能需要超出标准服务器所能提供的资源。在这种情况下，保持简单即可。\n\
  \n## 假设变化是常态\n\n物联网分析的世界发展迅速。今天你创建的分析，随着你获得结果反馈并适应不断变化的业务条件，将多次更改。你的分析流程需要改变。请假设这种情况会持续发生，并为变化而设计。这引出了**持续交付**的概念。\n\
  \n持续交付是软件开发中的一个概念。它自动化了代码发布到生产环境的过程。其理念是让变化成为常规流程。将这个理念引入你的分析，可以通过保留一组同时存在的副本来推进三个阶段：\n\
  \n- 1. **开发：** 保留一份你的分析副本，用于改进和尝试新事物。\n- 2. **测试：** 准备好后，将你的改进合并到这个副本中，功能保持不变，但要反复测试。测试确保它按预期工作。保留单独的测试副本可以让你在其他功能上继续开发。\n\
  - 3. **主版本：** 这是投入生产的副本。当你将内容从测试合并到主副本时，就等同于将其投入实际使用。云提供商通常提供持续交付服务，可以让这个过程变得更简单。\n\
  \n对于任何软件开发人员读者来说，这是**git flow**方法的一种简化，这有点超出本书范围。如果作者可以提出建议，那么值得做一些额外研究来学习 git flow，并将其应用于你在云中的分析开发。\n\
  \n## 利用托管服务\n\n云基础设施提供商，如 AWS 和 Microsoft Azure，提供消息队列、大数据存储和机器学习处理等服务。这些服务处理底层资源需求，如服务器、存储配置以及网络需求。你不必担心这些在底层是如何发生的，而且它可以根据你的需要扩展到任意规模。\n\
  \n云提供商还管理服务的全球分布，以确保低延迟。下图显示了 AWS 的区域数据中心位置与海底互联网电缆的结合：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_91_0.png)\n\
  \n这减少了你在分析方面需要担心的事情数量。它让你可以更多地关注业务应用，而不是技术。这是一件好事，你应该加以利用。\n\n托管服务的一个例子是亚马逊**简单队列服务（SQS）**。SQS\
  \ 是一种消息队列，其底层服务器、存储和计算需求由 AWS 系统自动管理。你只需要设置和配置它，只需几分钟即可完成。\n\n## 使用应用程序编程接口（API）\n\
  \nAPI 是其他进程、软件或服务访问你创建的分析代码的一种方式。它让你可以轻松地在其他应用程序中重用你的代码。你还可以让客户通过基于 Web 的 API 直接访问此功能。\n\
  \nAPI 建立在封装原则之上。它是一份定义好的受支持操作和信息列表，其他系统可以调用和检索。调用系统无需知道操作是如何执行的，也无需知道信息是如何创建和检索的。复杂性被隐藏了。\n\
  \nAPI 定义了如何与一组封装的分析流程进行交互。它抽象掉了细节。它还支持低摩擦变更，因为分析流程可以被改进，而无需其他系统改变它们正在做的事情。只要 API\
  \ 定义保持不变，其他系统就不会察觉其中的差异。\n\nAPI 是为更复杂的分析创建构建块的好方法。你可以在短时间内使用多个 API 构建丰富、功能完善的分析应用程序。通过重新配置组合好的应用程序以使用不同的\
  \ API 组合，也更容易适应不断变化的业务条件。\n\nWeb API 使用互联网来处理系统之间的通信。云提供商将其作为托管服务提供。它可以在处理安全和扩展方面提供很大帮助。使用此服务，你可以快速、安全地大规模实现新的分析功能。API\
  \ 可以是公开的，也可以是私有的。私有的只有你的内部应用程序才能访问。公开的则向公司外部的系统开放。\n\n![](img/9f2a55db1236f995dcd9392acbc82910_92_0.png)\n\
  \n使用 Web API 网关的示例架构。来源：Amazon Web Services\n\n\n\n\n云服务提供商甚至可以处理使用情况跟踪和计费，如果你决定将API背后的功能作为付费服务提供给客户的话。\n\
  \n## 云安全与分析\n\n你可以使用主流云基础设施提供商支持的多种方法，将安全构建到分析中。\n\n### 公钥/私钥\n\n云服务提供商在其所有服务中使用非对称加密。系统会生成公钥和私钥。你保留私钥，因此服务方没有副本。服务方持有公钥。使用公钥/私钥的通信是安全的，并且从未被攻破。\n\
  \n云服务提供商即使把公钥刊登在明天的报纸上也无妨；仅凭公钥无法破解加密。公钥用于加密数据却不能用于解密，这看起来有违直觉，但确实可行。\n\n每次访问以HTTPS开头的网站时，都在使用公钥/私钥加密。这是SSL和TLS加密的基础，而HTTPS通信正是采用这种加密方式。\n\
  \n在构建安全流程时，你会经常为物联网分析使用公钥/私钥。可以把它想象成你的分析工具的“用户名+密码”，但更胜一筹。密码学是一个引人入胜的学科（至少对我们中的一些人来说是这样）；想了解更多细节，不妨阅读相关资料。否则，你可以完全相信它没有问题——事实也确实如此！\n\
  \n### 公有子网与私有子网\n\n当为分析搭建云环境时，你实际上是在创建自己的网络环境。你需要（或者希望由一位熟练的网络专家来）定义网络结构。其中一项基本组件就是子网的概念。子网是云环境中整个网络的逻辑细分。你将资源部署到某个子网中，该资源将遵循为该子网定义的互联网寻址规则。公有子网中的资源可以从外部互联网被寻址。但这并不意味着子网内的所有资源都能从外部被发现；你需要先为其分配公网IP地址。\n\
  \n私有子网无法从外部互联网寻址。虽然可以通过网关设备（通常是网络地址转换（NAT）设备）实现互联网通信，但外部对象无法直接与私有子网中的资源发起通信。\n\n\
  出于安全原因，大多数分析处理应在私有子网中进行，这给资源连接增加了一些复杂性。这正是我们在这里讨论它的原因。然而，为了防范恶意破坏，这样做完全值得。请了解你的哪些子网是私有的，并确保在那里启动新的资源。\n\
  \n### 访问限制\n\n将分析资源的访问权限仅限制为指定的用户。避免使用单一的用户ID和密码让所有人共用的陷阱。对于通过公钥/私钥访问的资源，务必将私钥存放在安全可靠的地方。\n\
  \n对于网络安全，只允许必要的网络流量访问你的资源，阻止所有其他流量。从一开始就锁定一切，只在需要时才开放。\n\n在分布式计算环境中（例如用于物联网分析的环境），网络是安全和问题排查的关键要素。你会遇到分析任务无法正常运行的情况，并发现根源是网络或安全相关设置。最好从分析项目一开始就理解这一点并采用最佳实践。\n\
  \n### 保护客户数据\n\n确保物联网数据的安全，使用访问控制，并对数据文件进行加密。物联网数据可用来推断客户的有关信息，因此要特别小心。你是客户信息的守护者。如果没有妥善保护客户数据，你可能会无意中使公司面临法律风险。\n\
  \n加密可以通过两种方式实现：传输中加密和静态加密。传输中加密指网络传输，如SSL或TLS。大多数云服务都要求使用它们。确保支持分析流程的所有网络通信在传输中均经过加密。\n\
  \n静态加密指数据存储，可以是服务器上的数据文件，也可以是数据库中的数据。如果你使用公钥/私钥对来保护数据，云服务提供商可以为你加密数据，并且对你透明。\n\n\
  当数据可能被大量用户（例如公司全体员工）访问时，请采用加密。如果由于严格的访问控制，数据仅能被少数人访问，并且位于私有子网中，你可以稍微宽松一些——数据不太可能泄露出去。一般来说，如果加密是无缝的，就使用它。如果你的数据可通过公共互联网访问，那么一定要使用加密。\n\
  \n云服务提供商从诞生之初就在公共互联网环境中运营。安全内建于每一个层级。充分利用这一点，使用公钥/私钥、私有子网、访问控制和加密来保护你的宝贵数据。\n\n\
  ## AWS 概览\n\n在云基础设施领域，AWS是王者。它是同类服务中最早的，于2005年推出，并且遥遥领先于其他服务。在Gartner云基础设施提供商魔力象限的每一个细分领域，它都排名第一。\n\
  \n据《计算机世界》2016年报道，其计算能力是紧随其后的14家竞争对手总和的十倍。Netflix和AirBnB等整个公司都在其上运营业务。如下图所示，AWS拥有超过30%的市场份额，而最接近的竞争对手只有9%。\n\
