  \ 这个口号更有吸引力：我们更喜欢这个。\n\n![](img/9f2a55db1236f995dcd9392acbc82910_159_0.png)\n\n\
  Apache Spark logo\n\n## 什么是 Apache Spark？\n\n好问题，很高兴你问了。Spark 是为分布式集群计算而构建的，因此一切都可以很好地扩展而无需任何代码更改。*通用*\
  \ 这个词在通用引擎描述中非常合适。它指的是你可以用它做很多不同的方式。\n\n你可以用它进行 ETL 数据处理、机器学习建模、图处理、流数据处理以及 SQL\
  \ 和结构化数据处理。它是分布式计算世界中分析的福音。\n\n它为多种编程语言提供 API，例如 Java、Scala、Python 和 R。它主要在内存中运行，这就是它相对于\
  \ Hadoop MapReduce 的主要速度提升来源。对于分析，Python 和 R 是流行的编程语言。当与 Spark 交互时，你很可能会使用 Python，因为它支持更好。Spark\
  \ 的 Python API 称为 Pyspark。\n\n本章中讨论的描述和架构是针对 Spark 2.1.0 的，这是撰写本文时的最新版本。\n\n\n\n\
  \n\nDriver 程序必须能够监听并接受来自其执行器的传入通信。执行器必须能够相互通信。所有组件在集群中应彼此“接近”。因此，将 Driver 程序（Spark\
  \ 实例）运行在直接连接到集群的笔记本电脑上并不是一个好主意。\n\n在 HDFS 相同的集群节点上安装 Spark 是常见且推荐的做法。这使得处理靠近数据，从而提高性能。\n\
  \n非常重要的是要理解应用程序的哪一部分在 Driver 上运行，哪一部分在工作节点上运行。Driver 位于单个节点上，其资源受限于该节点可用的 CPU 和内存。因此，操作所需的数据、内存和计算资源必须在这些限制内，否则应用程序将失败。什么在集群上运行良好，集群具有更高级别的分布式资源，如果无意中被拉回\
  \ driver 节点，将会崩溃。\n\n## 思考单机与机器集群\n\n设计分布式计算分析需要你思考什么可以并行运行，什么必须一步接一步运行。并行运行计算是\
  \ Spark 等集群计算系统速度优势的来源。但它确实需要一种略有不同的思考方式。响应以自由格式文本字段的形式存储在每一行数据中。你想要做一个词频统计，看看受访者使用最多的词是什么。希望像\
  \ **fantastic** 和 **educational** 这样的词排在前面，而像 **fraud** 和 **time wasting-junk-pile**\
  \ 这样的词排在列表更下方。\n\n第一步是将每一行的文本字符串拆分为单词列表。这可以在许多不同的节点上同时完成。你会编写 Python 代码来执行此操作，然后将其提供给\
  \ Spark 以发送到每个执行器以使用。这将是第一个 Map 步骤。下一步是为每个单词加上一个数字，以便以后可以求和。形式为 (fantastic, 1)。此时，数字始终为\
  \ 1，因为同一个词在数据集中出现的次数与它出现的次数一样多。这是第二个 map 步骤，你将使用我们之前讨论过的相同程序。\n\n接下来，结果应按集群中的单词排序，以便更容易计数。这是\
  \ shuffle 步骤。然后，每个执行器可以将附加到每个单词的数字加在一起，以获得其处理的单词的总计。这将行减少为每个执行器的单个单词小计。因此，这被称为 Reduce\
  \ 步骤。最后，所有小计都加在一起，按每个单词得出集群的总体总计，这是最终的 reduce 步骤。\n\n综合起来，这个概念称为 Map/Reduce。这是一个非常简单的例子，实际上，Spark\
  \ 等系统会为你处理大部分细节。但总体概念即使在更高级别的应用中仍然成立，在这些应用中 map 和 reduce 并未直接调用。你应该思考如何拆分工作以便进行分发，然后将其汇总为更小的结果集以进行进一步分析。\n\
  \n## 使用 Spark 进行 IoT 数据处理\n\n使用本章前面的概念图，Spark 适用于分析交互和执行引擎区域。你可以直接在核心 Spark 对象上编写代码，并使用随附的编程模块。以下图像有助于可视化\
  \ Spark 模块堆栈：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_162_0.png)\n\nSpark Module\
  \ Stack. Source: Apache Spark\n\n- **Spark SQL** 在创建 SparkSession 时包含在内，允许你编写标准\
  \ SQL，将其解释为 Spark 操作并执行（当然使用 DAG）。你可以在其他 Spark 代码中混合使用它。这使你能够在适当时利用 SQL 的强大功能和知识，并在适当时使用代码，而无需切换语言。\n\
  \n- **Spark Streaming** 是一组允许处理流数据的库。流数据是从一个到多个源的高吞吐量、持续的数据馈送。Spark Streaming 提供了更高级别的抽象，使分析此类数据变得更容易。流输入被分解为较小的数据批，以便使用\
  \ Spark 引擎进行分析操作。然后结果可以存储以供进一步的长期分析。\n\n- **MLlib** 是一组机器学习库和命令，针对并行运行进行了优化。这使你可以使用非常大的数据集进行训练，并比其他基于\
  \ Hadoop 的项目运行得更快。机器学习算法具有高度迭代性，这需要 Hadoop MapReduce 组件进行大量磁盘 I/O。Spark 大多在内存中运行，这大大加快了迭代速度，而无需磁盘\
  \ I/O。\n\n- **GraphX** 是一组专为图处理设计的库。此上下文中使用的 *graph* 一词不是指图表，而是分析的一个分支，专门从事网络分析。这就是用于识别社交网络中有影响力的人的一个例子。图由\
  \ **nodes** 和 **edges** 组成，边表示节点之间的连接。\n\n所有这些模块可以一起使用，并且在单个应用程序中使用。这允许在同一工具和编程结构内实现各种各样的应用程序和灵活性。而且一切都随着集群规模的扩大而扩展。\n\
  \n由于其可扩展性、速度和灵活性，Spark 作为 ETL 工具效果很好。IoT 数据需要这三者，因此是很好的匹配。传入的 IoT 数据可以使用 Spark 进行清理、处理和增强。它还可以创建机器学习管道，在同一过程中训练算法。\n\
  \n一个常见的用例是让一个 Spark 作业，最有可能用 PySpark 编写，处理长期存储的初始 ETL。然后，一组单独的作业按每日或其他定期计划运行，以增强和进一步分析数据。最后，像\
  \ Tableau 这样的可视化分析工具以及 R 或 Python 中的统计分析库链接到结果数据以进行更高级的分析。\n\nSpark SQL 模块也完全兼容\
  \ HiveQL，并且可以使用 Hive metastore、Hive 用户定义函数 (UDF) 和 SerDes。有一个 HiveContext 对象，原生支持集成，当\
  \ Spark 与 Hive 一起安装在集群上时。Spark 还原生读取和写入 Parquet 格式。Parquet 文件可能在 HDFS、S3 或 Spark\
  \ 可以访问的其他文件系统上。由于 Parquet 包含文件的模式信息，因此加载和设置用于分析的分布式数据集非常简单。\n\n![](img/9f2a55db1236f995dcd9392acbc82910_164_0.png)\n\
  \n*Spark Hive compatibility architecture. Source: Apache Spark*\n\n## 要不要流式处理\n\n\
  流是随着每个新数据消息到达而持续更新的数据集，延迟极小或为零。流式分析以比批处理短得多的间隔在该持续更新的数据集上运行。实时分析在应用于流式分析时有点名不副实，因为它通常是基于间隔的，而不是持续进行的。频率会影响处理和技术要求，因此应尽可能将间隔设置为更长的时间段以节省成本。\n\
  \n流数据集通常保留一段时间的窗口数据，然后丢弃它。处理流有专门的技术和处理选项，这些选项在很大程度上是针对我们本章重点关注的长期大数据存储技术要求的补充。Amazon\
  \ Kinesis 就是专门的数据流技术服务的例子。\n\n支持分析所需的技术和编程代码库对于流式处理通常与长期历史分析所需的代码库不同。这意味着大多数用例需要两个系统和代码库。正在进行多项努力将此整合为一个；Spark\
  \ 2.1 是一个值得注意的例子，其中包含 Spark Streaming 模块，但该领域仍在成熟中。\n\n\n\n\n\n对于物联网分析，在决定实时流式分析是否真的是你所需要的之前，重要的是要考虑用例以及你需要支持哪些数据集。当你寻找洞察和新的商业机会时，你几乎总是会使用具有长期历史的数据集。对于这些用例而言，最近一小时或一分钟的数据几乎没有增量价值。\n\
  \n尽管实时分析的诱惑很诱人，但你必须考虑流式技术的额外成本和维护是否值得。在大多数物联网分析场景中，情况并非如此，并且可以通过提高批处理频率来更好地满足需求。当整合额外数据集时，流式分析与批处理分析相比在可做的事情上也有局限性。除非这些数据集也是实时的，否则它们只能用于较不频繁的批处理。\n\
  \n虽然对于*探索性分析*以寻找洞察而言情况如此，但对于将这些分析的洞察*产品化*而言可能并非如此。在某些情况下，你可能希望接近实时的分析处理，例如将预测模型应用于流式传感器数据以预测设备故障。你可能希望为由快速反应客户支持团队监控的报告仪表板提供实时流式分析。\n\
  \n然而这些是独立的决策。建议是避免增加流式分析的开销，除非有强有力的商业案例。*实时*听起来不错，但你需要确保增量收益值得在时间和资源上的额外支出。\n\n\
  ## Lambda 架构\n\nLambda 架构由一系列数据和处理技术组成，旨在同时服务常规批处理活动和接近实时的流式活动，并以一种允许将两者的结果合并为单一视图的方式进行。以下描述和图表突出了构成该架构三层的概念组件：\n\
  \n- **批处理：** 该层保存主数据集并对数据进行常规批处理，以创建视图来支持与服务层链接的分析、仪表板和报告。主数据集是不可变的，这意味着数据一旦纳入就不会改变，并且会随着时间的推移不断追加新数据。长期运行的\
  \ Hadoop 集群就是一个例子。\n- **速度：** 该层仅关注最近的数据（流式数据）。它处理对数据时效性有低延迟要求的请求。算法需要在速度层中快速且增量地运行。Amazon\
  \ Kinesis 就是一个在速度层中运行的示例技术。\n- **服务：** 该层对批处理视图进行索引，以便以低延迟提供服务。这包括来自批处理层和流式层的批处理视图。\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_166_0.png)\n\nLambda 架构。来源：MapR technologies\n\
  \n### 处理变化\n\n变化是恒定的，尽管听起来自相矛盾。架构、数据模型和技术会随着时间的推移不断演变。你需要决定如何处理变化，以便在数据存储和处理架构中保持灵活性。你希望使用彼此解耦的工具，以便未来的分析能够轻松集成到数据处理流中。\n\
  \n幸运的是，Hadoop 生态系统中的组件是专门设计为彼此解耦的。它们允许混合搭配组件，并且为尚未发明的新框架构建了可扩展性。云基础设施允许轻松测试和整合新技术和软件。\n\
  \n你需要设计一个流程，将你的分析和数据处理代码从实验、开发到生产。这同样适用于你的整体基础设施。常见做法是保留三个独立的环境：一个用于开发，一个用于测试，一个用于生产。\n\
  \n为了节省成本，你可能会决定将其减少到两个：一个混合的开发和测试环境，以及一个生产环境。无论如何，你都需要一个结构化流程，将你的洞察从初始想法转移到你标准运营的成熟部分。\n\
  \n## 总结\n\n在本章中，我们讨论了针对物联网和处理来自现场设备的传入数据的特定云基础设施技术。我们还回顾了一些收集和存储物联网数据以实现分析的策略。Hadoop\
  \ 生态系统和架构已介绍，并详细介绍了物联网分析的关键组件。\n\n你还学习了何时以及为何使用 Spark 进行数据处理。我们讨论了流式处理与批处理之间的权衡。介绍了\
  \ Lambda 架构。讨论了如何处理变化以建立灵活性，从而允许未来的分析与数据处理集成。\n"
- "# 6 了解你的数据 - 探索物联网数据\n\n“是的，我知道三个月的平均值是 45.2，但这意味着什么？我们现在有超过 2 太字节的数据。但它告诉我们什么？”\n\
  \n你的老板又在发脾气了。他不断向你提问，而你不确定如何回答。你本能的第一反应是回吐每周报告中的数字，但显然这不起作用。\n\n“数据甚至好吗？”他继续说，“我们在积累价值还是只是在地下室堆满垃圾？”\n\
  \n你开始耸肩，但明智地阻止了自己。你认为数据非常有价值，但你实际上对数据集的了解仅限于报告中包含的数字。你意识到你甚至不确定单个数据记录是什么样子。你知道平均值可以隐藏很多东西，但从未有人要求你深入研究。\n\
  \n你挺直肩膀自信地说：“数据是有价值的。我们只是没有查看它的所有方面。我会向你展示它还有更多内容。”\n\n你一点也不自信。你不确定如何展示商业价值被埋藏着等待被发现。但你隐藏得很好。\n\
  \n你的老板发出一声哼哼声，显然并不真正相信你在推销的东西。他转身走下走廊，边走边自言自语。\n\n> 数据是二十一世纪的剑，善用它的人，就是武士。\n> \n\
  > -Eric Schmidt and Jonathan Rosenberg in How Google Works\n\n本章重点介绍物联网数据的探索性数据分析。你将学习如何提问并回答数据的问题。本章的第一部分将介绍理解数据质量。然后，我们将继续更好地了解数据及其代表的内容。我们将使用\
  \ Tableau 和 R 作为示例。你将学习快速评估数据并开始寻找价值的策略。\n\n本章涵盖以下主题：\n\n- 探索和可视化数据\n- Tableau 快速概述：\n\
  \  - 了解数据质量的技术\n  - 基本时间序列分析\n  - 了解数据中的类别\n  - 使用地理进行分析\n- 寻找具有预测价值的属性\n- 使用 R\
  \ 增强可视化工具\n- 行业特定示例：\n  - 制造业\n  - 医疗保健\n  - 零售\n\n### 探索和可视化数据\n\n任何分析的第一步，*尤其是*物联网分析，就是了解你的数据。就像未来的配偶一样，你需要尽可能多地了解它。了解它的缺陷和优点。了解哪些属性会令人烦恼，并确保你能够接受它们。了解其未来的盈利潜力。并且在为时已晚、你被束缚于它之前弄清楚所有这些。\n\
  \n在本章中，我们将使用几个工具来快速了解一个样本数据集。示例将遵循深入数据以找到其优势和劣势的方法。对于探索和可视化，我们将使用 Tableau。对于更深入的统计评估，我们将使用统计编程语言\
  \ R。\n\n#### Tableau 概述\n\n**Tableau** 是一款商业智能和分析软件工具，允许你连接到数十种不同的数据库和文件类型，通过拖放构建可视化，并轻松与他人共享。主要有两个版本，桌面版和服务器版。桌面版是你安装在笔记本电脑上的功能强大的工具，用于连接和操作数据集。服务器是一个基于\
  \ Web 的组件，你可以在其中发布桌面可视化，以便他人轻松与其交互。\n\n在本章中，我们将只关注 Tableau 桌面版，因为我们的任务是探索数据而不是传达分析结果。它可以免费试用一段时间。你可以从公司网站下载（https://www.tableau.com/products/desktop/download）。\n\
  \n使用 Tableau 处理数据的第一步是连接到你的数据集。Tableau 有许多不同的连接器，能够链接到各种各样的数据库和文件格式。将 Tableau 视为你数据的窗口，一种链接到它并探索它的方法。它与你的数据是分开的，请在你的脑海中将它们区分开来。\n\
  \n\n\n\n\n## 了解你的数据 - 探索IoT数据\n\n连接到数据后，工作区中有四个主要区域。它们在以下截图中突出显示：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_171_0.png)\n\
  \nTableau桌面主视图\n\n接下来，我们将详细描述每个区域。\n\n- **可用数据字段**（Tableau术语中的数据窗格）：此部分显示已连接数据集中的字段。您还可以根据其他数据字段创建额外的计算字段。您可以在此处创建自己的类别分组和层次结构。数据字段分为两类。\n\
  \  - **维度：** 维度是包含类别或标签的字段。判断字段是否应为维度的方法是，想想对其值求和或求平均是否有意义。如果答案是否定的，则最好将其用作维度。例如客户名称、细分、ID字段、电话号码、州名和日期。\n\
  \  - **度量：** 度量是不代表类别且来自连续值范围的数字。这些是可以求和或求平均的数字。例如销售数量、温度和时间长度。\n- **筛选和格式设置**（**筛选器**架、**页面**架和**标记**卡）：在这里可以筛选数据记录，并决定可视化工作区中图表和表格的格式。\n\
  - **列和行架**（**列**架和**行**架）：在这里拖放字段，以在可视化空间中构建视图。列出的字段在交互视图中已就绪。\n- **可视化工作区：** 这里显示您在其他区域操作的结果。您还可以直接深入查看此区域中显示的点或数字背后的数据记录。\n\
  \n### 了解数据质量的技巧\n\n本章示例使用的数据集来自美国**国家海洋和大气管理局（NOAA）**。它是美国15分钟降水数据的一个子集，可在NOAA网站上获取（直接链接：`https://www.ncdc.noaa.gov/cdo-web/search?datasetid=PRECIP_15`）。\n\
  \n我们使用的是美国科罗拉多州从2013年1月1日到2014年1月1日的数据集。您可以从NOAA或本书的Packt网站下载。从NOAA下载数据时，务必勾选所有可用字段。同时下载数据集的文档，其中包含字段描述（`https://www1.ncdc.noaa.gov/pub/data/cdo/documentation/PRECIP_15_documentation.pdf`）。\n\
  \n对于本练习，你可以将阅读文档留到本章末尾，看看它与我们观察到的结果如何对应。在其他任何情况下，你都应该先仔细研读文档，并像为了在课堂上争取最高分而备战期末考试一样做笔记。\n\
  \n### 查看数据——原始形态\n\n面对不熟悉的数据时，你应该做的第一件事始终是查看其原始形式的一个良好样本。这是非常重要且常被忽视的一步，即便是经验丰富的分析师也是如此。你的第一反应可能是计算平均值和标准差来寻找趋势，但要抵制这种冲动。\n\
  \n你希望先查看没有任何格式或解释的文件，因此需要使用不会对其应用任何格式的软件工具。如果你有Windows笔记本电脑，只要文件不是太大，记事本就是一个不错的选择。Excel不适合用来做这件事，因为它会对文本文件（如\
  \ `.csv`）应用自己的格式和解释。\n\n在Mac或Linux机器上，使用命令行文本查看工具。在Mac上，你可以打开“终端”，导航到文件所在目录，然后输入命令\
  \ `cat filename.csv | less`。按空格键可前进屏幕；输入 `q` 退出。在Linux命令行中也可以这样做。下图显示了Mac或Linux机器上原始数据的样子。Windows会显示非常相似的格式：\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_173_0.png)\n\n通过这最初的查看，你可以了解到数据构成的一些情况以及需要调查的方面。下面列举一些例子：\n\
  \n- **第一行包含字段名称：** 这很好，因为你不必自己弄清楚并输入名称。但是，你需要确保当文件加载到如HDFS这样的数据存储中时，第一行不会被当作数据行。\n\
  - **Measurement Flag、Quality Flag 和 Units 各有两个同名字段：** 这可能是重复数据，也可能是字段顺序与另一个字段相关而有意义。当你准备分析数据集时，需要知道每个字段的含义以及哪一个是哪个。在分析工具中，字段顺序可能与文本文件中的不同。为应对这一点，请找出一些在这些字段中具有不同值的行，并记录下能唯一标识这些行的字段（如**STATION**和**DATE**）。你可以在分析工具中使用这些字段来验证哪个是哪个。\n\
  - **QPCP字段中的值要么是非常小的正数，要么是-9999：** -9999似乎表示测量值以外的其他含义。幸好你没有用它来计算平均值。\n- **Measurement\
  \ Flag和Quality Flag字段中有相当多的缺失值：** 你肯定需要查看文档来理解其含义。\n- **日期时间值不是常见的标准格式：** 你可能需要进行一些解析，才能让分析工具将该值识别为日期。注意其结构（`yyyymmdd\
  \ hh:mm`）。\n- **并非每个15分钟间隔都有记录：** 行看起来按日期和时间排序，但一天中似乎不是每个15分钟间隔都有一条记录。当整个文件排序后可能并非如此，但你应该将其作为待调查事项记下来。\n\
  \n浏览几屏数据，寻找任何模式。如果数据集看起来已排序，请至少扫描一次到另一个源设备的过渡，以查看值如何变化。在了解数据的这个阶段，我们并不试图做到非常科学。目标是寻找任何明显的模式和数据质量问题。\n\
  \n### 数据完整性\n\n由于低功耗传感器和不可靠连接的特性，IoT数据经常存在缺失和不完整的值。你希望了解这种情况发生的频率以及是否有任何模式。对于初步查看，我们将使用Tableau连接到示例数据集。建议先在软件官网完成入门培训，以熟悉它。\n\
  \n第一步是连接到包含天气数据的 `.csv` 文件。在起始界面中，单击**文本文件**作为数据源类型。然后，浏览并选择要链接的文件。\n\n![](img/9f2a55db1236f995dcd9392acbc82910_175_0.png)\n\
  \n检查文件列所分配到的字段类型。注意，**Date**字段被假定为字符串格式，而不是日期时间格式。如果你尝试更改它，由于其不常见的格式，将无法被识别。你需要解析日期（正如在原始文件检查中所怀疑的那样）：\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_175_1.png)\n\n单击**Sheet1**选项卡，开始构建数据视图。我们需要对数据字段稍作修改，以便更轻松地探索它们。右键单击**Date**维度，在弹出菜单中选择**计算字段**。将其命名为\
  \ `Measurement Date` 并输入计算 `DATEPARSE(\"yyyyMMdd hh:mm\", [Date])`。这将接受上述格式的字符串，并将其解释为日期：\n\
  \n5. 将**记录数**值从**标记**卡移动到**行**架。\n6. 从**筛选器**架中移除所有内容。\n\n现在我们将稍微快进，假设你已经完成了在线培训，并熟悉Tableau的基本操作。我们将要回顾的任何方法也可以用其他可视化软件来完成。\n\
  \n完整性不仅关乎缺失值，还关乎数据记录的连续性。即使所有值都完整，整个记录仍可能缺失。可以通过按日期和时间对齐记录数来检查这一点。按站点细分，查找没有记录数据的时间段。如果每15分钟捕获一条数据记录，那么每天应有96行（(60\
  \ min/15 min) * 24 = 96）：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_177_0.png)\n\
  \n从前面的可视化可以看出，并非每个站点每天都有96条记录。每天记录数各不相同，有些日子甚至没有任何记录。一些气象站每月只在第一天报告一次。当你查看这些记录时，似乎是测试记录，没有可用的降水值。\n\
  \n这时应该联系你的工程和现场服务团队，了解站点是否按预期报告数据。如果是，你将需要知道如何识别只报告测试数据的站点，以便在分析时区别处理。如果不是，你可能无意中发现了你可以提供的一项服务。你的分析团队可以创建一个算法来识别这种模式，并自动通知客户该站点未报告数据。\n\
  \n\n\n\n\n选择其中一个正在频繁发送记录的气象站对应的条形图，例如 Akron 4 E CO US。查看各个记录，并检查 Qgag 和 Qpcp 测量字段中的值。Qgag\
  \ 是记录捕获时测量容器中降水量的度量。Qpcp 是 15 分钟时间段内所发生的降水量的度量。查看这些时间，确认它们是否确实是 15 分钟间隔。数据记录有可能只在有情况需要报告时才会发送（换句话说，当时正在下雨）。\n\
  \n同样，请与开发设备和软件的人员核实这一结论。如果情况确实如此，你可能需要为没有下雨的时间间隔创建人工记录。这将取决于你所探索的分析内容。如果你要预测降雨概率，你就需要同时包含未下雨时段和下雨时段的数据。\n\
  \n这正是理解数据集完整性的重要之处。如果设备运行正常且没有网络问题，那么可以有把握地认为没有记录就意味着没有下雨。但如果设备因某种原因离线，就不能这样假设。否则，准确预测将变得非常困难。\n\
  \n查看其他几个站点，并记录任何异常情况。例如，你可能会注意到，有些气象站的记录计数在某个日期之后会显著改变频率水平。这种情况可能发生在设备此前未能正确报告、后来问题被修复的时候。你也需要对此进行调整；在设备修复之前的记录，在分析时可能需要被忽略：\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_178_0.png)\n\n一个记录计数增加的气象站示例\n\n注意记录计数中任何异常的激增。如果多个气象站在同一时间都出现这种情况，则可能表明存在数据问题，例如记录重复。但也有可能是真实情况，所以你需要以某种方式核实。即使看起来很奇怪，也不要断定它一定是数据问题。在示例数据集中，请注意\
  \ Boulder 2 CO US 站点在 2013 年 9 月出现的显著增长：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_179_0.png)\n\
  \nBoulder 2 CO US 气象站的记录计数在 2013 年 9 月出现激增\n\n该记录计数远远超出该站点任何其他时期的范围。你还会注意到，其他站点也在完全相同的时间出现增长。请记下这一点，以便进一步探索。我们将在本章后面再回到这个问题。\n\
  \n## 数据有效性\n\n完成完整性检查后，检查你所拥有记录中数据的有效性非常重要。对于度量架中的每个字段，查找远超任何其他数据点的离群值。同时检查以高频率出现的特定值。前者可能是错误值，也可能是某个非测量事件的指示值；后者可能是本应被实际测量值覆盖的默认值。异常值可能有多种解释；目标是识别这些值以及它们的大致出现频率。\n\
  \n在标度上查看 Qgag 值，可以明显看到负侧有一个常见离群值（-9999），正侧也有一个（999.990，在视图中可能四舍五入为 1,000）。在每个离群值区域中选择一些点，查看单独记录。看看实际值是始终一致，还是存在一些变化。一致的值很可能是刻意设置的指示值；变化则可能是由于计算错误或转换错误导致小数点位置不对：\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_180_0.png)\n\n按标度显示的 Qgag 值\n\n按站点逐一检查同一视图。所有站点都至少有一个\
  \ -9999 值，但并非所有站点都有 999.99。\n\n![](img/9f2a55db1236f995dcd9392acbc82910_180_1.png)\n\
  \n按站点显示的 Qgag 值\n\n由于这些极值看起来不是实际读数，请过滤掉高值和低值，将过滤范围设为 0 到 900。然后查看结果，以了解各气象站的典型值范围。这些值介于\
  \ 0 到 2.4 之间：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_181_0.png)\n\n按站点显示的已过滤\
  \ Qgag 值\n\n对数据集中的另一个度量 Qpcp 重复相同过程。你会看到它也有相同的极值（-9999 和 999.990），只是某些站点没有 -9999\
  \ 记录。另一个区别是，Qgag 值沿连续标度分布，而 Qpcp 似乎以 0.1 为增量上报：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_181_1.png)\n\
  \n按站点显示的已过滤 Qpcp 值\n\n选择一些点并查看单独的数据记录，看看 Qpcp 值是否精确到十分位，或者是否存在图表上看不到的变化。在本例中，所有值都精确到十分位。\n\
  \n我们已经展示了一些检查数据有效性的方法，但不要局限于这些演示过的方法。继续以你能想到的尽可能多的方式对数据进行切片和切块，不断探索。与你的设计工程师沟通，了解测量值预期应在什么范围内，并将观测结果与该范围进行比较。回顾第\
  \ 1 章“定义 IoT 分析与挑战”中的 IoT 设备图，并利用它来查找数据中的不一致或失真之处。\n\n## 评估信息延迟\n\n来自 IoT 设备的数据并不总是以相同的时间间隔到达你的数据集。有些记录可能会很快被纳入，因为设备所在位置更近，或位于人口更密集、连接更好的地区。偏远位置在设备捕获观测值到数据记录成为数据集一部分之间，可能有更长的延迟。不同\
  \ IoT 设备组之间在数据传输路径上，或在将数据加工成分析用数据集的 ETL 作业中，也可能存在差异。\n\n在将更高级的分析应用于数据之前，理解延迟时间的变化（我们称之为信息延迟）非常重要。较快到达的数据记录中可能存在显著偏差，而一旦该时段的所有记录都被纳入，这种偏差就可能不存在。下图显示了发生在同一时间的事件在信息延迟时间上的差异。如果今天分析数据集，则只会包含底部的事件：\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_182_0.png)\n\n## 时间序列是什么？\n\n时间序列分析非常常见；从股票市场价格趋势到\
  \ GDP 图表，你每天都会遇到。它直观而普遍，以至于给它命名都显得有些别扭。时间序列其实就是按时间顺序排列数据值，并分析结果以寻找模式。即使某个间隔没有数据，序列也应按等间距的时间间隔排列。\n\
  \n可以通过一年中的时间（季节性）、商业周期、数值随时间的增减（趋势），甚至一天中的时段来发现模式。识别出的模式随后可用于预测未来的数值。我们将在本书后面介绍时间序列预测技术。\n\
  \n## 应用时间序列分析\n\n时间序列分析的第一步是决定在探索数据时使用哪个时间间隔。你可以选择多个间隔，在熟悉 IoT 数据时这样做是一个好习惯。你可以从月度趋势开始，然后是周度、日度，甚至精确到分钟。\n\
  \n对于我们的分析，我们将继续使用日间隔。从 **Qpcp** 度量开始，按站点查看，并绘制每日汇总的 **Qpcp** 值图。过滤掉那些几乎可以确定不是实际测量的极值（你可以在过滤器中使用\
  \ 0 到 900 的范围）。我们已经发现 **Boulder 2 CO US** 站点在 2013 年 9 月出现了异常高的记录计数。\n\n\n\n\n你还了解到，并非每个\
  \ 15 分钟时间段都有数据记录，并且你已推断出数据主要是在有降水量需要报告时发送的。如果这一假设成立，那么一天内 Qpcp 值的总和就应该能表示当天的降水量：\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_185_0.png)\n\n2013 年 9 月，美国科罗拉多州博尔德 2\
  \ 号（Boulder 2 CO）气象站的 Qpcp 总和出现峰值\n\n上图显示，在 2013 年 9 月的几天里，当日降水总量也达到了前所未有的高位。选择该时间段并查看柱状图背后的数据记录。检查数值和记录的日期时间后，似乎并不存在重复记录：\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_186_0.png)\n\n美国科罗拉多州博尔德 2 号（Boulder\
  \ 2 CO）气象站 2013 年 9 月 11 日至 12 日期间的数据记录样本\n\n到目前为止，尽管记录数量和降水总量都非常反常，但还没有任何迹象表明数据存在缺陷。幸运的是，天气状况受到多家新闻媒体和环境机构的监测。如果物联网数据中的数值是真实的，那么借助外部来源应该很容易得到确认。\n\
  \n我们将借助物联网分析专家最强大的工具之一——谷歌搜索，看看能找到什么。不开玩笑地说，网页搜索技能对物联网分析非常重要，无论是研究机器学习模型还是理解传感器功能。\n\
  \n通过外部来源确认物联网数据中的异常模式也是一种必不可少的数据验证实践。我们在这里把它当作一个有趣的例子，但这是你应该定期进行的工作：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_187_0.png)\n\
  \n谷歌搜索“2013 年 9 月 11 日科罗拉多州博尔德暴雨”的结果\n\n从搜索结果可以看出，当时科罗拉多州博尔德地区确实发生了一次极端天气事件，降雨量之大甚至被称为“千年一遇”的暴雨。这大大增强了我们对报告结果真实性的信心。\n\
  \n现在，我们可以将 **Qgag** 值作为时间序列来探索。回想一下，**Qgag** 是测量设备中累积降水量的度量。下面是按站点绘制的 **Qgag** 随时间变化图（已过滤掉极值）：\n\
  \n## Qgag 随时间变化的趋势\n\n![](img/9f2a55db1236f995dcd9392acbc82910_188_0.png)\n\n随时间变化的\
  \ Qgag 值\n\n我们可以注意到几个有趣的模式。首先，在 2013 年 7 月前后的一段时间内，所有站点的 Qgag 值都缺失了。这种情况值得打几个电话去查明原因。在那段时间里确实有数据记录，但所有记录中的\
  \ Qgag 值都是 -9999，因此在此视图中被过滤掉了。\n\n其次，某个站点的 Qgag 值会随时间增加，并且在不规则的间隔后突然下降到显著较低的值。考虑到这些值表示累积降水量，这种下降可能表明设备上容纳降水的容器已被清空。\n\
  \n识别此类模式可以为你公司带来宝贵的商业机会。你可以开发一套分析流程，既能识别何时需要清空容器，又能验证该任务是否已完成。这对于那些不得不派遣技术人员到偏远地点执行工作的客户来说非常有价值。他们会非常乐意并高兴地为这项服务向你公司付费。这意味着你公司可以以很少的额外成本实现收入增长。\n\
  \n## 了解数据中的类别\n\n现在，通过识别类别和缺失值来探索数据。将各种“维度”拖到“行”和“列”功能区上，以查看类别、记录计数和缺失值（Null）。将一些维度相互比较，以了解它们之间如何交互。它们是同时为\
  \ Null，还是看起来互不相关？\n\nTableau 让你能够快速地进行这种交互，所以要充分利用它。下面的截图展示了一个示例，比较了 Qgag 和 Qpcp\
  \ 的“测量标志”字段。你可以看到，它们经常同时为 Null：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_189_0.png)\n\
  \n使用记录计数比较 Qgag 与 Qpcp 的测量标志\n\n## 引入地理信息\n\n当设备分布在不同地点时，地理信息是理解物联网数据的非常强大的辅助工具。一千台集中在科罗拉多州丹佛市的设备，与一千台均匀分布在全州的设备，很可能提供不同的数据值。通过对数据进行统计分析并不明显的模式，一旦显示在地图上就可能变得非常明显。\n\
  \n还要查看地图上的数值和记录计数如何随时间变化。在 Tableau 中，可以将日期值 Measurement date（测量日期）拖到“页面（Pages）”功能区。将聚合级别改为“年+月”（Month\
  \ with Year），然后逐月移动，观察数据如何变化。\n\n同时也要查找无效的位置数据。如果你已将数据过滤为墨西哥的国家代码，却仍看到加拿大境内的点，那可能就需要进行一些数据清理。\n\
  \n## 寻找可能具有预测价值的属性\n\n属性（Attributes）是数据字段的另一种叫法。在讨论预测分析和机器学习时通常使用这个词（Features 是另一个同义词）。在初次探索数据集时，最好寻找一下那些在应用机器学习技术后可能具有预测价值的属性。\n\
  \n这些是指看似会影响测量值的字段或类别。请留意这些字段或类别，并记下你的发现。\n\n## R（海盗的语言……如果他是统计学家的话）\n\nR 是一种开源的统计编程语言。它拥有各种强大的库，下载后即可轻松集成到你的分析代码中。这些软件包由庞大的统计学家和数据科学家社区开发并维护。它非常强大，并且不断通过频繁发布的新包得到增强。\n\
  \n### 安装 R 和 RStudio\n\n如果你还没有安装 R，请从 https://cran.rstudio.com/ 安装最新版本。然后，从 https://www.rstudio.com/products/rstudio/download/\
  \ 安装 RStudio（R 的集成开发环境，IDE）。两者都是开源且免费下载使用的。RStudio 由总部位于波士顿的 RStudio 公司管理，该公司还提供付费支持和企业版软件。\n\
  \n### 使用 R 进行统计分析\n\n在这个示例中，我们将使用 *datasets* 包，它包含各种示例数据集。在 RStudio 中，使用**软件包**选项卡来确认\
  \ *datasets* 包在列表中且旁边有勾选标记。**软件包**选项卡位于界面的右下象限。\n\n点击**导入数据集**按钮并选择**从 CSV...**，导入我们一直在使用的\
  \ NOAA 科罗拉多州 15 分钟降水数据集。导航到该文件，查看数据列预览和代码预览，然后点击**导入**按钮。\n\n![](img/9f2a55db1236f995dcd9392acbc82910_192_0.png)\n\
  \n注意系统为你生成的加载数据的代码。你也可以将其作为模板来加载数据文件，而无需通过图形界面菜单操作：\n\n```r\n#Bring in the code\
  \ library for reading in text files\nlibrary(readr)\n\n#Load the 15 minute precipitation\
  \ dataset\nNOAA15minPrecipColorado <- read_csv(\"~/Downloads/NOAA15minPrecipColorado.csv\"\
  )\n\n#Show the dataset in an RStudio window\nView(NOAA15minPrecipColorado)\n```\n\
  \n这段代码加载数据文件，然后执行 View() 函数在表格窗口中显示数据。你会在左上方面板中看到数据。在左下方面板（控制台）中，查看数据加载和解析过程中出现的任何错误。这里也会提供关于\
  \ R 如何解释数据列的有用信息。你需要判断这些数据错误对于你正在进行的分析来说是否可以接受。如果不能接受，则需要额外进行一些格式整理和解析。\n\n运行以下代码，对数据集中的每一列生成汇总统计信息：\n\
  \n```r\n#Run summary statistics on the data frame the file was loaded into\n\nsummary(NOAA15minPrecipColorado)\n\
  ```\n\n\n\n\n\n最终生成的汇总信息将如下所示：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_194_0.png)\n\
  \n请注意我们在Qgag和Qpcp中已经发现的Min.和Max.的极端值。我们判定这些值很可能是指示标志，而非实际测量值。我们可以通过一些数据操作将这些值移除。如果你尚未安装R的dplyr包，可以通过运行以下代码或使用RStudio图形界面来安装它。dplyr包在数据操作方面非常实用，经常用于R语言分析：\n\
  \n```\n#在您的电脑上安装dplyr包\ninstall.packages(\"dplyr\")\n```\n\ndplyr安装完成后，运行以下代码过滤掉Qgag或Qpcp中具有极端值的数据行。该代码还会重新运行汇总统计：\n\
  \n```\n```r\n#加载dplyr代码库\nlibrary(dplyr)\n\n#从数据集中过滤掉具有极端值的记录\nNOAAfiltered <- filter(NOAA15minPrecipColorado,\
  \ QPCP > 0, QPCP <900, QGAG >0, QGAG<900)\n\n#对过滤后的数据副本运行汇总统计\nsummary(NOAAfiltered)\n\
  ```\n```\n\n现在的汇总信息应如下所示。请注意，平均值、中位数和四分位数现在更能代表真实世界的降水值：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_195_0.png)\n\
  \n在实践中，当存在缺失或无效值时，需要仔细审查数据集，并判断是删除整个数据记录更好，还是用其他值替换该值更合适。当你过滤掉某一行时，会丢失其他字段，而这些字段可能包含有效值。你的决定将取决于所进行的分析类型。请仔细权衡。\n\
  \n## 总结汇总\n\n那么，通过刚才对数据的快速剖析，你学到了什么？你了解到该数据集并未涵盖每个气象站在该时间段内的完整历史记录。我们发现记录可能是在有需要报告的事件时才发送的，并非每天每15分钟都有一条记录。我们还发现有些站点每月只在第1天报告一次。\n\
  \n我们检测到了一个可能具有实用价值的模式，即降水随时间累积的水平。数据中识别出了一个极端事件，并经过外部验证确认其确实发生过。你学会了使用R来了解数据中每个字段的统计分布。\n\
  \n我们还探索了站点的地理分布。你了解到各站点在科罗拉多州并非均匀分布（但考虑到覆盖面积，情况尚可）。我们还识别出一些数据值似乎是指示符而非测量值（-9999、999.990）。总而言之，你对这个未知数据集有了相当多的了解。\n\
  \n现在，我们将查阅数据集文档，以确认我们对极端值的判断是否正确。这通常是应该首先进行的步骤，但将其放到最后会让本章更有趣一些。\n\n通读文档后，我们发现有一个值表示降水累积的开始和结束。根据文档，这个值为99999，并伴有a或A的测量标志。\n\
  \n然而，通过查看数据，我们知道整个数据集中不存在99999这个值。也没有a或A的测量标志，尽管文档中列出的其他类别似乎都存在。我们观察到的值似乎确实在表达文档所述的含义，因为文档中没有提到其他特殊值。\n\
  \n这是物联网数据的重要一课：文档也可能是错误的。始终要核查数据本身告诉你的信息，信任但要验证。逻辑在不同设备上的实现也可能不一致，导致数值混杂，这里的情况可能正是如此。\n\
  \n## 解决特定行业的分析问题\n\n我们将涉及几个行业，讨论物联网数据探索和分析的特别注意事项。\n\n### 制造业\n\n对于制造过程中生成的物联网数据，记录值的准确性尤为重要。探索数据中的异常值并仔细分析分布情况。与制造过程专家核实你看到的所有数据范围和分布。\n\
  \n确保测量值尽可能干净的好处有两方面。首先，任何用于检测问题的机器学习模型都会显著更加准确。其次，因无效数据导致的误报可能带来高昂代价。在问题调查期间，生产线和产品交付可能会被暂停。在制造业中，这很快就会产生高昂费用。更严重的是，误报的长期影响往往是企业管理层完全不再信任这些数据，从而彻底放弃分析。从长远来看，这会给你所在的公司带来更多开支。\n\
  \n对于产品交付并投入使用后生成的物联网数据，产品的使用年限是关键。许多问题都与产品已使用多长时间有关，无论是使用初期（早期失效）还是使用后期（磨损）的问题。在探索性分析中，需要仔细跟踪并深入研究使用年限。\n\
  \n还有一点需要注意：许多缺乏经验的分析师通过按生产周期对产品数量分组，将故障数除以生产数量来比较故障率。故障通常由物联网设备上报的故障代码或测量值异常来确定。但这存在一个问题，而且是个大问题。\n\
  \n由于早期生产的产品运行时间更长，它们有更多机会经历故障。较新生产的产品机会较少。产品会不断老化，一个生产周期的平均运行时间只会随着时间推移而增长。由于数据集并不完整，各产品在其运行寿命中处于不同的时间点。\n\
  \n### 零售业\n\n零售业中的分析问题将重点关注地理位置、人口统计特征和时间等因素。在Tableau等软件中使用地理信息（地点的纬度和经度）探索数据，可以增加发现有商业价值模式的可能性。\n\
  \n当你可以按地理区域进行探索时，还可以将数据与该地区的经济指标相结合。可以将该地区的人口数据集与物联网数据结合进行探索。零售数据的日期和时间值需要特别准确。白天的人流量会影响销售额。物联网时间值需要额外分析以确保准确性。\n\
  \n将地点与准确的时间值相结合，你可以计算出正确的当地时间以及室外是白天还是黑夜。将当地交通模式和日照时长纳入考量，最终可能成为预测模型的关键预测特征。该模型可能带来销售额的增长。\n\
  \n季节性影响也是零售分析的关键因素。有了准确的时间和地点，你可以分析物联网数据，找出与获取数据时天气相关的模式。\n\n## 本章小结\n\n在本章中，你学习了探索物联网数据的步骤，以便深入了解和掌握数据。我们讨论了查看原始数据的重要性。介绍了Tableau，以及如何使用它来探索和可视化数据的演练。\n\
  \n我们引入了R和RStudio，作为对数据集进行统计分析的强大工具。本章还讨论了一些物联网分析的行业特定注意事项。\n"
- "# 7\n\n## 装饰你的数据——添加外部数据集进行创新\n\n“如果富裕女性比贫穷女性更喜欢把房子弄得冷一些呢？”\n\n哦不，你心想。老板刚刚问了一个奇怪的问题，这通常意味着一件事。他被分配了一个SEWOTI，也就是说你被分配了一个SEWOTI（愚蠢的主管浪费时间想法）。你会怎么回答这样的问题呢？这不是需要大量的市场营销调查吗？\n\
  \n“有意思的问题，怎么会想到这个？”你问道。\n\n“销售高级副总裁约翰聊到他妻子夏天喜欢把家里温度调得多低，”他回答道，“所以我们就想，也许富裕女性就是喜欢更冷一些。如果是这样的话，也许我们应该把新款高端恒温器推销给女性，而不是男性。”\n\
  \n你点头表示这是个好主意。但你并不觉得这是个好主意，尤其是在没有市场数据支持的情况下。\n\n“我们甚至还在讨论改变面板的配色方案，让它更女性化。安娜正在核算定价。”他继续说道，“而且考虑到你在分析和绘制现场数据方面做的出色工作，我觉得这个问题对你来说应该很容易回答。所以我告诉约翰，我们接下来就干这个！”\n\
  \n你打算如何回答这个问题？你手上只有设备的数据，而没有按键操作者的收入水平数据。\n\n\n\n\n\n本章介绍通过向存储的物联网数据中添加额外的数据集来大幅提升价值。宝贵的补充数据既来自内部来源，例如制造或**客户关系管理\
  \ (CRM)** 数据，也来自外部数据源，例如经济或人口统计数据集。你将学习如何寻找有价值的数据集并将它们组合起来，以在寻找未开发的商业价值时增强未来的分析。\n\
  \n本章涵盖以下主题：\n\n- 结合数据集提取价值的通用策略\n- 内部数据集：\n  - 哪些以及为什么？\n- 外部数据集 - 地理：\n  - 海拔\n\
  \  - 天气\n  - 地图 API\n  - 交通运输\n- 外部数据集 - 人口统计：\n  - 人口普查统计\n  - 世界概况手册\n- 外部数据集\
  \ - 经济：\n  - 全球经济数据\n  - 联邦储备美国时间序列\n  - 使用代码和 API 添加数据\n\n## 添加内部数据集\n\n物联网数据本身只是故事的一部分。已经有大量有用的数据可供你使用，这些数据可能是隐藏价值的宝库。内部数据集常被忽视作为快速增强物联网数据的一种方式。它们是很好的起点。物联网数据不应孤立地查看；应将其视为公司产品、客户和流程已存储数据的延续。\n\
  \n数据应整合为对业务的 360 度视图，以最大化在其中发现新价值的机会。最快、最容易开始的地方通常（但并非总是）是你已有的内部数据集。原因可能并非总是如此最快、最容易的是由于内部数据安全和遗留系统障碍；有时这会使提取内部数据以与物联网数据结合变得困难。这可能是内部数据集的绊脚石，而这与外部数据集形成鲜明对比，外部数据集通常更容易获得且安全问题较少，因为它们是公开可用的。无论如何，潜在价值仍然值得付出克服这些障碍的努力。\n\
  \n### 哪些以及为什么？\n\n在决定将哪些内部数据集与物联网数据集成时，请考虑哪些数据集可以帮助解释传感器值的异常变化或与数据中的模式相关。这些数据集更有可能帮助发现商业价值。有许多内部公司数据集可以帮助你释放价值；我们接下来将讨论四个需要考虑的领域。\n\
  \n#### 客户信息\n\n尽管显而易见，但仍有必要指出，将客户信息纳入物联网数据以发现价值的重要性。诸如客户地址等信息可以被地理编码以获取经纬度坐标。这可用于建立设备位置，从而允许你构建另一层分析。\n\
  \n了解性别、年龄或收入水平等信息可以帮助识别否则不可见的模式。对于工业客户而言，了解设备所在位置的设备行业和应用可能是解锁数据中隐藏模式的关键。出于这些和其他许多原因，客户信息应列在与物联网数据结合的内部数据集的首位。\n\
  \n#### 生产数据\n\n有关物联网数据来源的设备生产信息也很有价值。故障通常与设备组装的制造日期、工厂和生产线相关。子组件和第三方零件与设备标识符相关联。\n\
  \n生产数据还可用于估算现场时间，如果该数据不可直接获得。可以通过使用制造日期作为起点并估算销售时间和现场运行时间来实现。不同的设备配置也可能成为关键属性，你可以用它来对可能没有的其他数据做出假设。例如，如果一家公司生产车辆，并且红色闪烁灯仅包含在作为消防车建造的车辆上，你就可以将这些车辆的客户归类为消防部门，即使你没有直接在客户数据中拥有此信息。\n\
  \n#### 现场服务\n\n引入技术人员维修访问、维护记录和呼叫中心日志的数据集是另一个从数据中挖掘价值的良好起点。将会有关键事件，例如维修工作或投诉电话，可以与物联网数据中的异常模式相关联。\n\
  \n维护记录在开发预测性维护模型时很有用。它也可能与设备故障预测模型相关联。呼叫中心日志可以被挖掘以开发物联网数据事件的属性，而不仅仅是报告的数值或分类值。**自然语言处理\
  \ (NLP)** 可用于从文本数据中提取属性。\n\n例如，对于提供天然气的水务公司，呼叫日志文本中出现的 *臭鸡蛋* 短语，对应于物联网数据中低气压的模式，可能表明正在发生天然气泄漏。然后可以开发分析来识别未来物联网数据记录中的模式以进行主动调查。\n\
  \n#### 财务\n\n收入与成本之间的差额是利润。利润的预期是大多数物联网系统投资的驱动力。将客户付款（收入）和公司支出（成本）与物联网数据集关联起来，可以揭示潜在的价值机会。\n\
  \n你可能会发现客户在物联网数据中可识别的某些事件后会购买你的产品。这可能是延长保修购买或服务零件。你也可能会发现他们在你期望他们花费时并未花费。例如，物联网数据表明零件故障，但客户并未相应购买零件。这意味着服务零件是从其他人那里购买的。你需要识别这两种情况。\n\
  \n## 添加外部数据集\n\n有大量有用的外部数据集可供下载并集成到你的物联网分析中，通常是免费的。这些数据集太多，无法进行详尽的介绍，但我们将介绍一些有用的示例。使用这些数据集是增强物联网数据价值的一种低成本方式。\n\
  \n### 外部数据集 - 地理\n\n你有分布在许多位置的物联网设备。位置现在是一个属性，可以让你在数据中找到模式，然后将其货币化。环境、该地区的 demographics、当地经济状况和天气都可以与设备的地理位置联系起来。使用地理数据集来增强物联网数据的潜在价值。\n\
  \n#### 海拔\n\n海拔在许多情况下是一个重要属性，因为它与设备的运行条件和周围环境相关。即使你的设备不动，了解其海拔也可能很有价值。例如，智能烤箱制造商肯定会希望知道海拔，因为它会影响烘焙时间和特性。\n\
  \n##### SRTM 海拔\n\n2000 年 2 月，美国航天飞机 Endeavour 特别配备了两个雷达天线发射升空，任务是绘制全球大部分地区的地形。如以下图像所示，其中一个雷达天线位于航天飞机舱内，另一个位于\
  \ 200 英尺（60 米）桅杆末端。桅杆在航天飞机进入轨道后展开。组合雷达在航天飞机绕地球轨道飞行时以全球模式扫描地球。\n\n![](img/9f2a55db1236f995dcd9392acbc82910_204_0.png)\n\
  \nSRTM 运行的艺术渲染图。Courtesy NASA/JPL-Caltech\n\n该任务被称为**航天飞机雷达地形任务 (SRTM)**，在 10 天的运行中，它收集了迄今为止最完整的高分辨率海拔测绘近全球数据集。这是一项由国家地理空间情报局（NGA）和美国国家航空航天局（NASA）领导的国际任务。\n\
  \n数据使用两套雷达设备捕获：一套称为 C 波段，另一套称为 X 波段。C 波段数据由加州喷气推进实验室处理了两年。分辨率略高的 X 波段数据由德国航空航天中心（DLR）处理。全球数据于\
  \ 2015 年完全发布。\n\n数据的分辨率为全球 90 米，美国境内 30 米。该数据集可从**美国地质调查局 (USGS)** 网站 (`https://lta.cr.usgs.gov/SRTM`)\
  \ 下载。还有 R 和 Python 包（GitHub 上的 *SRTM.py* 是一个例子）构建用于处理 SRTM 数据集的下载和操作。作者建议使用其中之一，而不是完整数据集，除非你有一组非常大的位置想要一次性为所有位置添加海拔数据。\n\
  \n##### 国家高程数据集 (NED)\n\nNED 是一个覆盖美国、包括阿拉斯加、夏威夷和领土岛屿的高分辨率高程数据集。它由 USGS 管理，约每 2 个月更新一次，以包含新的和改进的数据。数据汇集自多样化的来源，并转换到统一的坐标系统和海拔尺度（米）。\n\
  \n分辨率范围从 90 米到某些区域的 3 米（1/9 弧秒）。使用处理和插值技术生成无缝数据集以实现全面覆盖。整个数据集文件的大小相当大；USGS 提供地图查看器以帮助识别要下载的数据子集区域。\n\
  \nNED 包括以下产品集：\n\n- **NED 3**：该数据具有最高分辨率（1/9 弧秒，约为 3 米），但覆盖范围有限。\n- **NED 10**：该数据具有高分辨率（1/3\
  \ 弧秒，约为 10 米），并由多个**数字高程模型 (DEM)** 创建。来源可包括 LIDAR 和航空摄影。\n- **NED 30**：该数据集具有广泛覆盖范围和中等分辨率（1\
  \ 弧秒，约为 30 米）。它由多个重采样为 1 弧秒的 DEM 汇编而成。\n- **NED 60**：这是最低分辨率数据（2 弧秒，约为 60 米）。它为阿拉斯加的一些地区增加了覆盖范围。\n\
  \n\n\n\n\nNED 对于更高精度的高程数据需求很有用。缺点是其覆盖范围仅限于美国。作者建议在分辨率可接受的情况下尽可能使用 SRTM。高程值在各数据集之间会有所不同，但总体而言，作者发现它们相当可比。\n\
  \nNED 数据可通过地图查看工具 `https://viewer.nationalmap.gov/basic/` 下载。以下屏幕截图显示了 NED 10 数据的覆盖范围。数据文件采用\
  \ GIS 格式，我们将在后面的章节中进一步讨论。文件也可从 FTP 站点 (`ftp://rockyftp.cr.usgs.gov/vdelivery/Datasets/Staged/Elevation/`)\
  \ 直接下载。以下图像显示了地图和下载界面：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_206_0.png)\n\n\
  National map viewer data download tool. NED 10 coverage shown in orange.\n\n## Weather\n\
  \n天气相关数据的来源很多，既有付费也有免费。**国家海洋和大气管理局 (NOAA)** 提供了多个可免费下载的数据集。从气候数据到日平均值，有很多有用的信息可供选择。\n\
  \n综合地表全球逐时数据集可用于许多物联网分析项目。该数据集包含来自全球 20,000 多个站点的空气质量、大气压、温度、露点、风速和风向、云量和降水等天气属性。数字观测数据由各运营中心转发，或直接在美国北卡罗来纳州阿什维尔的联邦气候中心解码。\n\
  \n所有数据都存储在符合 **联邦信息处理标准 (FIPS)** 的单一 ASCII 格式中。数据文件按气象站、年份、月份、日期、小时然后分钟排序。以下屏幕截图显示了数据集的示例：\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_207_0.png)\n\n该数据集可以通过多种方式下载，包括使用地图查看器。您也可以从\
  \ https://data.noaa.gov/dataset/integrated-surface-global-hourly-data 获取数据定义和其他有用的文档。\n\
  \n如果您知道物联网设备的经纬度，您可以从网页下载气象站的位置信息。此信息编译在 KMZ 文件中。利用它可以链接到最近的气象站，以便在物联网数据记录的时间和地点添加天气属性。\n\
  \n## Geographical features\n\n地理特征\n\n当您知道设备的所在地时，添加高程和天气条件是有价值的数据集，但将地理特征与设备相关联也是通过分析释放隐藏价值的一种方式。当设备移动时，例如附着在集装箱上时，这变得尤为重要。\n\
  \n您需要 GIS 工具来打开和处理数据。这些将在后面的章节中讨论。拥有包含道路（例如道路名称和类型）和兴趣点（例如餐馆或加油站）详细信息的完整数据集对于与交通相关的物联网数据尤其有用。例如，将全规模数据集纳入您的\
  \ Hadoop 环境中，可以让您大规模进行地理空间分析。\n\n## Google Maps API\n\n物联网设备的定位数据也可以根据需要进行装饰，而无需将完整数据集集成到您的环境中。第三方\
  \ API 是一种很好的方式，可以在利用专门从事地理空间分析的其他公司的专业知识的同时实现这一点。有很多优秀的选择，包括来自 Google、Bing（微软）、Esri\
  \ 和 OpenStreetMaps 的 API。\n\n尽管主要面向网页和移动应用程序开发人员，但 Google Maps 的网络服务 API 可用于快速添加位置标识符、将地址转换为经纬度坐标，或计算地点之间的驾驶时间。API\
  \ 可以为数据集添加许多有用的属性。当您的数据记录流量每天在数万条而不是数百万条时，使用它们很有意义。\n\n以下屏幕截图显示了目前可用的各种 Google Map\
  \ API。每个 API 都有其自己的功能和选项，为您提供了强大的功能：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_209_0.png)\n\
  \nGoogle Maps web service APIs. Source: Google\n\n利用网络服务 API 为物联网数据添加属性，可以很容易地在\
  \ R 或 Python 中完成。Google 提供了 Python 客户端库来简化编程语言的使用。CRAN 上有可用的软件包，例如 googleway，可简化\
  \ R 的 Google Maps API 调用。\n\n要开始使用 Google Maps API，您需要获得一个开发人员密钥，用于在 API 调用中使用以验证代码并设置计费。Maps\
  \ API 网站上有链接可以帮助您设置此项。\n\n以下是使用 *googleway* 软件包的示例 R 代码。您需要先使用 RStudio GUI 或代码 `install.packages(\"\
  googleway\")` 安装它。插入您的 Google Maps API 密钥并运行代码以获取经纬度坐标的时区偏移：\n\n```\n```r\n#Load\
  \ googleway package (assuming it is already installed)\nlibrary(googleway)\n\n#Get\
  \ the timezone offset information for a pair of latitude and longitude coordinates\n\
  tz <- google_timezone(location = c(41.882702,-87.619392),timestamp = as.POSIXct(\"\
  2017-03-05\"),key = \"< Replace everything between these quotes with your API Key\
  \ >\")\n\n#View results\nView (tz)\n```\n```\n\n这是一个非常简单的示例，但显示了它可以很容易地用于完成单独开发起来会相当复杂的事情。\n\
  \n## USGS national transportation datasets\n\n**美国地质调查局 (USGS)** 国家交通数据集是一组包含铁路、步道、机场、道路、水道和其他交通相关地理特征的数据集。数据通过美国人口普查局来源提供，并辅以专业制图公司\
  \ HERE 的道路数据。\n\n数据不仅包括道路和铁路的形状，还包括有关它们的表格信息。覆盖范围仅限于美国，但具有标准化的分类代码和描述符。该数据集是为了支持与交通安全、拥堵、灾难规划和应急响应相关的地理空间分析而编制的。\n\
  \n## Decorating Your Data - Adding External Datasets to Innovate\n\n装饰您的数据 - 添加外部数据集以创新\n\
  \n该数据集可免费下载，格式为 Esri File Geodatabase 或 Shapefile。以下屏幕截图是数据集中可用数据表的子集：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_211_0.png)\n\
  \nPartial view of USGS Best Practices data table definitions. Source: USGS\n\n##\
  \ External datasets - demographic\n\n外部数据集 - 人口统计\n\n增强物联网数据价值的另一种方法是根据时间和位置添加人口统计信息。诸如医疗保健覆盖率、该地区平均收入和人口年龄等属性在与您的物联网数据结合时可能具有预测价值。\n\
  \n## The U.S. Census Bureau\n\n美国人口普查局\n\n对于美国，人口普查局维护到州和县级的人口统计数据集。许多其他国家也有类似的政府机构，承担相同的使命。有多个数据集可用，但一个很好的起点是\
  \ QuickFacts 数据集。\n\nQuickFacts 维护所有美国州和县的统计数据，以及人口在 5,000 人或以上的城市和城镇。它包括人口规模和密度、年龄和性别、种族、住房、教育、经济、收入、商业和健康方面的统计数据。该数据集使用\
  \ **联邦信息处理标准 (FIPS)** 代码作为标识符。FIPS 代码通常是您用来链接到物联网数据的内容。\n\nFIPS 代码是一个五位标识符，用于标识美国的县（或县级等价物）。前两位数字表示州，后三位标识县。FIPS\
  \ 代码列表可以从 `https://www.census.gov/geo/reference/codes/cou.html` 下载。\n\n美国人口普查局还维护了一些有用的地理空间数据集，其中已集成人口统计信息。有关\
  \ **拓扑集成地理编码和参考 (TIGER)** 数据集的信息可在 `https://www.census.gov/geo/maps-data/data/tiger.html`\
  \ 获取。\n\n| Product | Best For... | File Format | Type of Data | Level of Detail\
  \ | Descriptive Attributes | Vintages Available |\n|---|---|---|---|---|---|---|\n\
  | TIGER/Line Shapefiles | Most mapping projects—this is our most comprehensive dataset.\
  \ Designed for use with GIS (geographic information systems). | Shapefiles (.shp)\
  \ and database files (.dbf) | Boundaries, roads, address information, water features,\
  \ and more | Full detail (not generalized) | Extensive | 2006–2016, 2013 |\n| TIGER\
  \ Geodatabases | Useful for users needing national datasets or all major boundary\
  \ files. Designed for use in ArcGIS. Files are extremely large. | Geodatabase (.gdb)\
  \ | Boundaries, roads, address information, water features, and more | Full detail\
  \ (not generalized) | Limited | 2013–2016 |\n| TIGER/Line with Demographic and Economic\
  \ Data | Data from selected attributes from the 2010 Census, 2006–2010 through 2010–2014\
  \ ACS 5-year estimates and County Business Patterns (CBP) for selected geographies.\
  \ Designed for use with GIS. | Shapefiles (.shp) and Geodatabases | Boundaries,\
  \ Population Counts, Housing Unit Counts, 2010 Census Demographic Profile 1 attributes,\
  \ 2006–2010 through 2010–2014 ACS 5-year estimates data profiles, CBP data | Full\
  \ detail (not generalized) | Limited | 2012 CBP, 2010, 2006–2010 to 2010–2014 ACS\
