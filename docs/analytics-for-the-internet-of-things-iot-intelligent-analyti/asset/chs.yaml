  ## 中心化和缩放\n\n测量值可能来自截然不同的范围。气压通常以毫巴为单位测量，海平面平均值为 1013 毫巴，而大气温度通常范围为 -30 到 40 摄氏度。调整这些差异的一种方法称为中心化。你可以通过计算特征中所有值的平均值，然后从每个单独的值中减去它来对特征进行中心化。\
  \ resulting 转换后的特征均值为零。\n\n想象一下绘制一个直角三角形，其中第一条边长 100 m，第二条边长 1 m，第三条边长 100.03 m。它几乎无法与一条长\
  \ 100 m 的直线区分开。现在，想象第一条边增长到 10,000 m 长，第二条边保持不变。你甚至无法判断它是否是一个三角形。对于许多 ML 模型来说，当特征值处于截然不同的尺度上时，这是一个类似的问题。\n\
  \n一些可能出现问题的例子：降水量与海拔，或房屋价格与卧室数量。解决这个问题的方法称为 **缩放**。缩放将特征的每个值除以其标准差（在特征的所有值上计算）。这会使值的标准差变为一。\n\
  \n将中心化和缩放结合起来，现在所有（连续值）特征都彼此可比较。你刚刚使 ML 模型更容易从噪声中提取信号。\n\n以下示例代码显示了如何在 R 中应用它。这是上一节中\
  \ *mice* 示例代码的延续：\n\n```\n#center and scale the completed example data\nif(!require(caret)){\n\
  \  install.packages(\"caret\")\n}\nlibrary(caret)\n#create the object defining the\
  \ pre-processing\ncs_example_prepocessObj <- preProcess(completed_example_data,\
  \ method =\n  c(\"center\",\"scale\"))\n#apply the transformation\ncs_example_data\
  \ <- predict(cs_example_prepocessObj, completed_example_data)\n\n#view summary of\
  \ centered and scaled data\nsummary(cs_example_data)\n```\n\n resulting 数据集将被中心化和缩放。摘要统计数据现在将如下所示：\n\
  \n| Ozone | Solar.R | Wind | Temp |\n|---|---|---|---|\n| Min. : -1.2217 | Min.\
  \ : -1.9818 | Min. : -2.34863 | Min. : -2.1993 |\n| 1st Qu.: -0.7225 | 1st Qu.:\
  \ -0.7877 | 1st Qu.: -0.73838 | 1st Qu.: -0.6155 |\n| Median : -0.3407 | Median\
  \ : 0.2847 | Median : -0.08863 | Median : 0.1235 |\n| Mean : 0.0000 | Mean : 0.0000\
  \ | Mean : 0.00000 | Mean : 0.0000 |\n| 3rd Qu.: 0.5990 | 3rd Qu.: 0.8044 | 3rd\
  \ Qu.: 0.41987 | 3rd Qu.: 0.7570 |\n| Max. : 3.6825 | Max. : 1.6336 | Max. : 3.01888\
  \ | Max. : 2.0240 |\n\n## 时间序列处理\n\n物联网数据通常以固定间隔捕获，序列中值的位置可能具有意义。以固定间隔捕获的数据集称为 **时间序列**。时间序列为\
  \ ML 带来了自己的复杂性。\n\n然后在除一个子集之外的所有子集上训练另一个模型，但这次不同。被保留的子集用于检查在其他折上训练的模型的预测误差。这会继续进行，以便每个折恰好被保留一次，并且所有数据都用于训练和验证。\
  \ resulting 模型集将各自运行其预测，结果的平均值将作为输出给出。\n\n10 折是最常用的数量，但该数字更多是由惯例设定的，而不是因为 10 这个确切数字有什么特别之处。10\
  \ 折交叉验证是描述此操作的典型术语。使用交叉验证的优点是，你可以使用同一组训练数据模拟多种数据集。这增加了 resulting 模型泛化良好的机会。它还允许你在训练数据有限的情况下进行稳健的验证过程：\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_289_0.png)\n\n10 折交叉验证。每个折的验证集以蓝色显示，训练集以白色显示\n\
  \nR 中的 *caret* 包使将交叉验证纳入你的 ML 过程变得容易。ML 过程通常被称为 **pipeline**。\n\n以下代码示例设置了稍后在代码中实际训练模型时将使用的训练过程。我们将在本章后面再次使用它：\n\
  \n```\n```r\n#Create train control object that defines how training will be done.\n\
  #This example uses 10 fold cross validation which is repeated 5 time.\nlibrary(caret)\n\
  ctrl <- trainControl(method = \"repeatedcv\", number = 10, repeats = 5)\n```\n```\n\
  \n### 测试集\n\n在你找到认为是最优性能的模型或一组优化模型（来自不同技术）之前，最好将训练数据的一部分保留下来。\n\n这个被保留的数据百分比，通常称为\
  \ **测试集**，将作为通过验证过程优化的模型的最终测试。如果你聘请咨询公司进行建模，请自己保留一个测试集，不要提供给他们。用它来确认他们 resulting\
  \ 优化模型的准确性。你应该得到与他们报告相似的结果。如果不是，你在支付费用之前就有东西可以与他们讨论。\n\n### 精确率、召回率和特异性\n\n测试 ML\
  \ 模型相对于测试数据的有效性结果可以总结为四个类别（假设模型在两个类别之间进行预测，例如 **是/否** 或 **损坏/未损坏**）。我们将使用可穿戴物联网传感器的例子，其中传感器数据用于预测某人是否\
  \ **正在行走** 或 **未行走**：\n\n- 1. ML 模型说这个人正在 *行走*，但他实际上坐在沙发上看 *与星共舞* 喝着超大号雪碧。这是一个 **假阳性\
  \ (FP)**，也称为 I 型错误。\n- 2. ML 模型说他 **未行走**，而事实上他 **正在** 快速走向洗手间，因为他刚刚喝了超大号雪碧。这是一个\
  \ **假阴性 (FN)** 或 II 型错误。\n- 3. ML 模型说他正在 **行走**，而他实际上 **正在行走**。这称为 **真阳性 (TP)**。\n\
  - 4. ML 模型说他 **未行走**，而事实上他当时正躺在床上呼呼大睡——所以 **未行走**。这称为 **真阴性 (TN)**。\n\n\n\n\n\n\
  ## Bias\n\n偏差是指 ML 模型持续学习相同事物的倾向。一致性指的是对同一数据集的变体进行重复迭代的结果。偏差越高，结果学习到的模型就越容易偏离目标。如果偏差较低，结果训练的模型将更一致地接近目标。\n\
  \n高偏差模型在训练数据和测试数据上都会有较大的误差率。这被称为 **欠拟合**。换句话说，更复杂的模型可以在这两种情况下更好地拟合数据（训练和测试）。\n\n\
  以下示例比较了相对于数据集而言偏差较低的线性模型，以及相对于不同数据集而言偏差较高的线性模型。我们使用相同的简单模型来说明偏差水平不一定与 ML 模型的选择有关。虽然某些模型更容易产生偏差，但重要的是模型与数据的组合：\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_293_0.png)\n\n## Variance\n\n**方差** 与更复杂的模型相关，指\
  \ ML 模型过度拟合训练数据的能力。结果学习到的模型会因训练所用数据集的变体不同而大相径庭。高方差模型存在 **过拟合** 的问题。\n\n高方差模型在训练数据上的误差率低，而在测试数据上的误差率高。高方差模型对训练数据的精确构成拟合得过于完美。它学习了数据中的随机噪声以及底层信号。\n\
  \n如果在学习过程中不加以控制，方差对于更先进的 ML 模型来说是一个大问题。这是因为方法具有难以置信的灵活性，可以有效地 *记忆* 训练集中几乎任何数据组合。\n\
  \n## Trade-off and complexity\n\n在理想世界中，你希望 ML 模型在学习过程后同时具有低偏差和低方差。然而，正如你可能知道的，我们生活在一个远非完美的世界。所以，就像大多数事情一样，需要权衡才能获得最佳结果。\n\
  \nML 研究工作的目标不仅是找到最佳的权衡组合，而且是开发新的 ML 技术，在一方上做出少量牺牲以换取另一方的显著降低。对于任何给定的 ML 模型，都需要在偏差和方差之间进行权衡，以找到能够最好泛化的最佳\
  \ *配置*。不幸的是，这个最佳位置是未知的，必须根据训练和验证过程中的误差计算来推断。\n\n更复杂的模型可以更好地拟合数据并降低训练过程中的误差。然而，它们容易过拟合，这会增加测试数据上的误差，并在之后的新真实世界数据上增加误差。以下图像表示模型复杂度\
  \ *设置* 的范围。目标是找到训练误差和测试误差都最小化的最佳位置。这代表了最佳折中，你可以期望它在训练模型投入生产时能很好地泛化到未来数据集：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_295_0.png)\n\
  \n随着模型复杂度增加的偏差-方差权衡。来源：http://horicky.blogspot.com/2012/06/\n\n幸运的是，有方法，例如 **正则化**，旨在帮助防止过拟合，以增加结果训练模型处于最佳权衡区域的可能性。这些方法已纳入你将用于构建\
  \ ML 模型的 R 包中。\n\n## Comparing different models to find the best fit using R\n\n\
  最佳实践不仅是找到训练 ML 模型的最佳版本，还要比较多个训练优化的 ML 算法。每个 ML 算法都有其优势和劣势。只选择一个就是限制自己。选择几种在特定问题下可能成长为良好训练模型的算法。然后，将它们相互比较，让最好的模型获胜。\n\
  \n有几种方法可以比较 ML 模型。ROC 图和 AUC 指标是其中两种更流行的方法。我们将在下面介绍它们。\n\n## ROC curves\n\n源自二战雷达工程，**接收器操作特性**\
  \ (**ROC**) 曲线是比较 ML 模型有效性的常用方法。它沿阈值度量衡量召回率与 **误报率**（计算为 [*1-特异性*]）之间的关系。误报率也称为\
  \ **假阳性率 (FPR)** 或 **误报概率**。\n\n你可能已经注意到，很多指标都有几个不同的名称。这可能会让人困惑，但了解指标的别名很重要，因为不同的文章、博客和研究论文会使用不同的名称。\n\
  \n在大多数情况下，ROC 曲线将用于二元分类问题。二元分类问题的一些示例包括 **故障/无故障**、**运行/未运行**、**下雨/不下雨** 和 **购买/未购买**。ROC\
  \ 曲线显示了在阈值参数的区间内，正确分类的好处（真阳性）与错误分类的成本（假阳性）之间的权衡变化。\n\n可以这样思考真阳性率：\n\n*真阳性率 = 正确分类的阳性\
  \ / 训练集中所有阳性*\n\n可以这样思考假阳性率：\n\n*假阳性率 = 错误分类的阴性 / 训练集中所有阴性*\n\n![](img/9f2a55db1236f995dcd9392acbc82910_298_0.png)\n\
  \n近乎完美的 ML 模型。不要相信它，这在现实世界中与独角兽骑马打曲棍球的妖精一样罕见\n\nROC 曲线是通过将训练数据通过训练模型运行来生成每个实例为阳性分类的预测分数（或概率）而生成的。结果按最可能者优先的顺序排序。每个预测与实例的实际分类进行比较，并在向下移动列表时保持真阳性率和假阳性率的运行分数。\n\
  \n每个真阳性率和假阳性率组合在图表上绘制，并用线连接各点。实际上，ROC 曲线是一个阶梯函数，随着训练集规模的增长而接近真实曲线。\n\n随着你向下移动列表进入越来越不可能的阳性（基于模型的预测），这有效地通过了一系列阈值，从最保守（你的最高分实例）到最宽松（你的最低分实例）。生成的曲线显示了你的\
  \ ML 模型在广泛阈值场景下的性能。当你使用 ROC 曲线比较 ML 模型时，你是在比较它们在许多不同阈值条件下的性能。这为你提供了更全面的性能图景。\n\n\
  ROC 曲线图可以在 R 中轻松生成。使用 pROC 包，你只需使用 roc 和 plot 函数即可生成图表图像。以下是一个简单示例：\n\n```\n#load\
  \ pROC library\nlibrary(pROC)\n#create ROC object based on the model and its class\
  \ lables\nrocCurve <- roc(response = classFactors,\n    predictor = testPredictionsProb,\n\
  \    levels = rev(levels(classFactors))) #roc function assumes the second class\n\
  is the target, so we will reverse labels\n\n#plot curve\nplot(rocCurve, legacy.axes\
  \ = TRUE, identity = TRUE, col = \"blue\", add =\nFALSE)\n#you can also add another\
  \ model curve to the chart by calling this function\nagain with the 'add = TRUE'\
  \ option\n```\n\n代码将生成与以下示例类似的 ROC 曲线图：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_299_0.png)\n\
  \nR 中 ROC 曲线图的示例。\n\n\n\n\n\n以下是使用 ROC 曲线的一些好处：\n\n- **对类别分布变化不敏感**：正例和负例数量的变化不会影响\
  \ ML 模型的 ROC 曲线，前提是模型在区分它们方面的有效性保持不变。\n- **即使分类错误成本不相等时也很有用**：当假阳性的成本或正确分类正例的好处发生变化时，ROC\
  \ 曲线不受影响。只有曲线上感兴趣的区域会发生变化。换句话说，最优阈值设置会移动，但曲线的形状不会。\n- **允许在各种阈值设置下比较不同 ML 模型的性能**：有些模型在保守设置下表现最佳，而其他模型可能在更宽松的设置下表现最佳。因此，最佳模型取决于底层业务案例。\n\
  \n使用 ROC 曲线分析时需要注意以下事项：\n\n- **难以直观地用于多类模型**：在二维空间之外可视化很困难，并且随着多类预测模型的增多，维度会迅速增长。确实有方法可以做到这一点，但它们仍然不容易解释。\n\
  - **难以向非分析受众解释**：ROC 曲线存在学习曲线（使用单词 curve 很有趣）。然而，非专业人士完全可以通过反复接触学会如何理解它。作者建议如果可能的话对他们进行教育。理解这些图表的组织可以在做出成本/收益业务决策时使用它们。一旦他们克服了学习解释图表的障碍，就会发现它们非常有用。\n\
  \n## 曲线下面积（AUC）\n\nAUC 只是 ROC 图表“正方形”中位于 ML 的 ROC 曲线下方的部分。由于它是一个比例，因此始终介于 0 到 1\
  \ 之间。AUC 为 1 表示曲线覆盖整个图表，因此它完全与左上角对齐。这就是前面提到的很少观察到的、类似雪人的 *完美模型*。\n\nROC 图表中虚线表示的随机模型\
  \ AUC 为 0.5。因此，在现实世界情况下，您将看到 AUC 数值从 0.5 到 1.0。如何解释 AUC 数值在很大程度上取决于行业和业务情况。AUC 为\
  \ 0.6，表示优于随机，可能对金融行业的股票选择来说是一个很棒的模型；而同样的 AUC 衡量标准对于医疗行业的癌症检测来说将是彻底的失败。\n\nAUC 数值是使用单个数字而不是图表比较模型的有用方法。这种比较可以在不同模型之间进行，也可以在模型在调整或重新训练后与自身进行比较。然而，仅查看\
  \ AUC 值存在危险，因为您会丢失一些有价值的信息。\n\nAUC 数值可以让您大致了解性能，但几乎没有关于曲线实际形状的信息。您将失去确定模型在不同阈值设置下的性能的能力。在更保守的设置下，AUC\
  \ 值较低的 ML 模型实际上可能比 AUC 较高的模型表现更好。\n\nAUC 值是进行快速比较和将 ROC 曲线简化为一个数字的有用简写。但在做出任何业务决策之前，您应始终查看完整的\
  \ ROC 曲线，特别是当 AUC 值接近时。\n\nAUC 值也可以使用 R 中的 pROC 包快速生成。基于之前的 ROC 代码示例，可以通过使用 auc\
  \ 函数获得 AUC 值：\n\n```\nauc(rocCurve)\n```\n\n## 使用 R 的随机森林模型\n\n大多数 ML 教科书从像感知器这样简单的模型开始。但如果你已经读到本书的这一部分，你就是摇滚明星，值得被介绍给大炮。因为它们通常提供更好的结果，你会比感知器更频繁地遇到这些模式。\n\
  \n我们将从随机森林模型开始。除了名字听起来很酷之外，它们还很灵活，并且往往泛化能力很强。它们还具有使用称为变量重要性的方法来解释输入特征有用性的价值。\n\n\
  ## 随机森林关键概念\n\n随机森林是一种基于决策树的 ML 建模过程。决策树通过根据每个分割的信息增益在输入特征上生长一系列连续分割的层次结构来预测目标变量。如果这听起来令人困惑，只需将其视为一系列决策规则，最终得出预测。下面的图表可能有助于解释这个想法：\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_302_0.png)\n\n决策树 ID3 算法简单图示。来源：Wikimedia\
  \ commons\n\n随机森林通过引入随机性和重复来进一步发展这一概念。从原始训练集开始，通过随机分割并自助采样一个数据集来训练一棵树，从而创建训练集的随机变体。自助采样使用从数据集中随机抽取来创建（通常）更大的数据集，以模拟来自同一数据记录总体的数据集。\n\
  \n生成的混淆矩阵如下所示。这是一个比我们希望的样本量小得多的样本，模型性能也不算太好。但它确实具有一定的预测价值。对于一个简单的例子来说，它并不算太差：\n\n\
  ```\nConfusion Matrix and Statistics\n\n          Reference\nPrediction  cold hot\n\
  \       cold   14   5\n         hot    6  20\n\n                 Accuracy : 0.7556\n\
  \                     95% CI : (0.6046, 0.8712)\n        No Information Rate : 0.5556\n\
  \        P-Value [Acc > NIR] : 0.004499\n\n                  Kappa : 0.5025\n Mcnemar's\
  \ Test P-Value : 1.000000\n\n             Sensitivity : 0.8000\n             Specificity\
  \ : 0.7000\n          Pos Pred Value : 0.7692\n          Neg Pred Value : 0.7368\n\
  \              Prevalence : 0.5556\n          Detection Rate : 0.4444\n    Detection\
  \ Prevalence : 0.5778\n       Balanced Accuracy : 0.7500\n\n       'Positive' Class\
  \ : hot\n```\n\n随机森林建模的混淆矩阵摘要结果。\n\n## 使用 R 的梯度提升机（GBM）\n\n与随机森林类似，GBM 是一种基于决策树的模型，它将多个树的预测组合起来得出聚合响应。然而，与成千上万棵独立生长的树投票决定答案不同，GBM\
  \ 是一系列浅层树按顺序链接在一起。\n\n梯度提升机是一种流行且强大的 ML 技术。GBM 的一种变体，称为 XGBoost，已赢得最近的多个 Kaggle\
  \ 竞赛。\n\n## GBM 关键概念\n\n决策树的深度或浅度是指其具有的层次级别的数量。层次数量越少，树越浅。GBM 使用连续的弱学习器，这些学习器根据前一个模型的误差度量进行训练。弱学习器意味着它具有一定的预测能力，但不多。浅层树通常是弱的，因为它只使用一个或少数几个特征来分割训练数据。\n\
  \n生成的预测结果被加在一起得出最终预测。有几种变体使用不同的误差估计方法和确定每个树的浅度的方法。\n\nGBM 通过连续地在更高误差区域进行微调，使用前一个模型的误差来拟合下一个模型，依此类推，从而工作。这解决了使用单棵决策树时出现的问题。单棵树在每个分支处将数据分割成越来越小的组。这导致过拟合，因为它开始拟合噪声，尤其是在分支末端样本量很小时。GBM\
  \ 通过在每个连续学习树中重用整个数据集来避免这种情况：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_306_0.png)\n\
  \nGBM 概念图\n\n## 梯度提升机 R 示例\n\n在 R 中，可以使用 gbm 包来训练 GBM。GBM 具有树深度和收缩的调优参数。像往常一样，R\
  \ 的美妙之处和危险之处在于它可以为您调优这些参数。以下代码使用 caret 包拟合 GBM 模型并优化调优参数：\n\n```\n#make sure needed\
  \ packages are installed, then load them\nif (!require(gbm)) {\n  install.packages(\"\
  gbm\")\n}\n\nlibrary(gbm)\n\n#reuse train control and training data from random\
  \ forest example\n\n#train the random forest model and specify the number of trees.\
  \ Use caret\n#to control cross-validation\ngbmModel <- train (trainData[,predictors],\n\
  \ trainData[,target],\n method = \"gbm\",\n trControl = ctrlCV,\n verbose = FALSE)\n\
  \n#run prediction on test data to get class probabilities\ntestPredGBMProb <- predict(gbmModel,\
  \ testData, type = \"prob\")\n#run prediction again to get predicted class\ntestData$GBMclass\
  \ <- predict(gbmModel, testData)\n\n#grab the positive class probability (hot) and\
  \ the predicted classes\ntestData$GBMProb <- testPredGBMProb[,\"hot\"]\n\n#Show\
  \ confusion matrix for results\nconfusionMatrix(data = testData$GBMclass, reference\
  \ = testData$tempClass,\n positive = \"hot\")\n```\n\n混淆矩阵将看起来类似于以下表格。在我们的小样本中，GBM\
  \ 的表现并不算太差：\n\n\n\n\n\n混淆矩阵与统计信息\n\n实际\n预测 | cold | hot\ncold | 16 | 5\nhot | 4\
  \ | 20\n\n准确率：0.8\n95% 置信区间：(0.654, 0.9042)\n无信息比率：0.5556\nP值 [准确率 > 无信息比率]：0.0005445\n\
  \n卡帕系数：0.597\n麦克尼马尔检验 P值：1.0000000\n\n灵敏度：0.8000\n特异度：0.8000\n阳性预测值：0.8333\n阴性预测值：0.7619\n\
  流行率：0.5556\n检出率：0.4444\n检出流行率：0.5333\n平衡准确率：0.8000\n\n'阳性' 类别：hot\n\n上述混淆矩阵摘要由梯度提升机生成。\n\
  \n## 集成\n\n集成方法是一种将多个机器学习模型组合起来生成预测的方式。可以将它想象成一个机器学习模型委员会，每个模型都投出自己的一票，汇总后的结果就是预测。\n\
  \n有多种不同的投票汇总方式，你可能需要尝试不同方法，看看能否提升集成模型的性能。不过，这超出了本书的范围。\n\n研究和实际应用表明，集成方法往往比其中任何一个单独模型的表现都更好。集成方法通过减少单个模型的预测波动来提升实际性能。在物联网分析的数据科学工具包中，应当包含集成方法。\n\
  \n## 使用 R 进行异常检测\n\n异常检测是一种利用历史数据来识别异常观测的方法，无需带标签的训练集。现代异常检测方法在判断哪些观测需要标记为异常时，会考虑数据中的长期趋势和周期性变化。\n\
  \nTwitter 最近发布了一个先进的 R 开源异常检测包，名为 *AnomalyDetection*。它专门用于检测单值高频（小于一天）时间序列数据中的异常；不过，也可以通过设置选项来处理按月的更长数据集。它也可以用于非时间序列数据的向量。\n\
  \n它擅长处理趋势和季节性的影响——不过这里的季节性通常维持在分钟到天级别，而不是年度级别。GitHub 页面位于这里（https://github.com/twitter/AnomalyDetection），你可以使用以下\
  \ R 代码轻松将其作为 R 包安装。注意 *Anomaly* 的首字母要大写。*anomalyDetection* 是另一个不同的包（欢迎来到 R 的世界）：\n\
  \n```\ninstall.packages(\"devtools\")\ndevtools::install_github(\"twitter/AnomalyDetection\"\
  )\n```\n\n下面的例子展示了如何对传感器数据使用异常检测。异常检测本身很有用，但在一个时间窗口（小时或天）内检测到的异常频率，如果作为其他模型的输入，也会具有很好的预测价值。例如，过去一小时内压力传感器异常出现的频率，再加上平均温度传感器的读数，可能对未来发电机故障有很强的预测性。\n\
  \n以下示例代码从插补后的数据集中取 **Wind** 值，并查找异常。搜索方向可以是向前、向后，或两者兼有：\n\n```\n#load library\n\
  library(AnomalyDetection)\n\n#This uses the vector method since no timestamp is\
  \ present. If timestamp is\npresent, use AnomalyDetectionTs\nres = AnomalyDetectionVec(cs_example_data$Wind,\
  \ max_anoms=0.05, period=60,\ndirection='both', only_last=FALSE, plot=TRUE)\nres$plot\n\
  ```\n\n该代码会创建一个图，如下图所示。其中被判定为可能异常的点用蓝色圆圈标出：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_310_0.png)\n\
  \n示例数据集中 Wind 值的异常检测\n\n## 使用 ARIMA 进行预测\n\n有时候，你需要对时间序列的未来值进行预测。例如，可能需要估算未来几个月的活跃物联网设备数量；或者，需要预测远程油井泵的使用时长。最流行的时序预测方法之一就是自回归积分滑动平均（ARIMA）。\n\
  \nARIMA 并非单一模型，而是一系列相关方法的集合，这些方法试图描述数据中的自相关性，从而预测未来值。ARIMA 结合了滑动平均和自回归技术。自回归意味着对变量未来值的预测基于该变量过去值的线性组合。\n\
  \nARIMA 将趋势和季节性效应都纳入了未来预测中。它可以利用多种方法对季节性数据和非季节性数据进行建模。\n\n### 使用 R 预测物联网时间序列数据\n\
  \nR 的 forecast 包中包含 ARIMA 函数。你可以用以下代码进行安装：\n\n```\ninstall.packages(\"forecast\"\
  )\n```\n\nArima 函数对预测的非季节性部分和季节性部分（如果需要）都有相应设置。每个部分由三个数字组成，分别代表自回归部分的阶数、使用的差分次数以及滑动平均部分的阶数。在\
  \ R 文档中，通常记为 (p,d,q)。与数据科学中的所有事情一样，正确的起点是先查看数据，注意任何异常趋势，并进行一些诊断性统计分析，以了解非季节性和季节性部分应使用何种\
  \ (p,d,q) 数值。\n\n幸运的是，同样也是危险的是（前面是不是提到过？），R 可以帮你处理很多这种情况，并通过一系列检验自动确定合适的值。这可以通过\
  \ auto.arima() 函数完成。你还应该分析结果和残差值，以判断你的预测模型是否可行。\n\n以下示例代码使用本章一直在用的纽约空气质量数据集中的 Wind\
  \ 值，并拟合了一个 ARIMA 模型：\n\n```\n#load forecast library\nlibrary(forecast)\n\n#create\
  \ a time series on the Solar radiation data. The air quality data was captured from\
  \ May 1, 1973 to September 30, 1973\nwindTS <- ts(completed_example_data$Wind,start\
  \ = c(1973,5,1), frequency = 365.25)\n\n#show values over time\nplot.ts(windTS)\n\
  \n#fit an arima model\n```\n\n```\nfit <- auto.arima(windTS)\n\n#plot forecast for\
  \ the next month\nplot(forecast(fit, h=30))\n```\n\n得到的预测图显示出所预测的 **Wind** 值存在较大波动。基于这个简单的\
  \ R 代码 ARIMA 示例，你可不要辞职去当天气预报员：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_312_0.png)\n\
  \nWind 值的 ARIMA 预测。注意 auto.arima 函数选择了 3,1,1 模型（即 p,d,q 记号）。\n\n## 深度学习\n\n**深度学习**是数据科学中一个快速进展且令人兴奋的领域。某些深度学习模型在特定类型的图像识别上甚至比人类表现更好。当媒体提到人工智能时，通常指的就是深度学习模型。\n\
  \n深度学习模型非常复杂，尽管其中一些概念与本章到目前为止讨论的机器学习概念（如偏差-方差权衡）相似。深度学习模型可能拥有数百万个特征，并且训练可能需要数天甚至数周。\n\
  \n### 深度学习在物联网数据中的应用场景\n\n对于具有成千上百万个特征和大量带标签历史样本作为训练集的复杂数据，深度学习可以产生惊人的效果。图像识别的快速进展，既得益于深度学习算法的进步，也与谷歌等公司多年来收集的海量已识别图像密不可分。\n\
  \n对于物联网数据，这可能会限制深度学习技术的实用性。大多数物联网数据相对较新，缺乏长期带标签的样本历史。许多物联网设备只有少数几个传感器，因此特征集并不复杂。在这些情况下，前面讨论的许多机器学习技术在预测效果上可能与深度学习一样好，甚至更好。深度学习在时间和计算能力方面也更加昂贵（即成本更高）。\n\
  \n然而，如果物联网数据流包含大量特征，并且有数十万到数百万个带标签的训练数据可用，那么深度学习技术可能会显著提升预测能力。这在自动驾驶汽车开发中尤其明显。如果在设备功能中捕获了图像（静态或视频），它同样可以大显身手。\n\
  \n深度学习包通常更适合用 Python 而非 R 来交互。它们也相对较新，因此文档和教程可能有限。这使得它们比本章之前的示例更难使用一些。你需要投入更多时间和专业知识来开发深度学习模型，而不是像随机森林那样成熟的机器学习模型。\n\
  \n选择对特定用例和可用训练数据最有意义的方法。考虑有效性要求，并判断使用深度学习建模技术是否可能提供足够的准确率提升，以证明其成本是合理的。\n\n### 深度学习速览\n\
  \n深度学习是一个大保护伞，覆盖了许多项目和多种方法的神经网络配置。下面的图表可以让你对可用架构的多样性有所了解。通常需要在可获得的准确率与训练模型所需计算时间之间进行权衡。正确的权衡取决于具体用例。y\
  \ 轴表示准确率，x 轴表示计算需求：\n\n\n\n![](img/9f2a55db1236f995dcd9392acbc82910_314_0.png)\n\
  \n深度学习网络架构的比较。来源：medium.com\n\n这是一个广阔的领域，有许多方面值得探索。有的方法专门从图像、声音和文本中提取特征。有的方法用于对数以千计乃至数百万计的图像进行分类。有的方法用于词语翻译，会记住句子中已经翻译过的一些先前词语，以提高当前所译词语的准确性。\n\
  \n有些用例会结合多种网络架构类型。下面是一个用例示例：先从图像中提取特征，然后使用卷积神经网络（CNN）对图像中的元素进行分类，再使用循环神经网络（RNN）将提取的特征与词语选择进行匹配，从而为原始图像生成文字描述：\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_314_1.png)\n\n深度学习用例。来源：medium.com\n"
- "## 组织数据以进行分析的11种策略\n\n你环顾团队，他们正在格子间四周的 MacBook 上认真敲击键盘。你已晋升到前任老板的职位，现在手下有一支小型数据科学家团队。有些人使用站立式办公桌，有些人在迷你隔间里，有些人则围坐在你所在区域中央的一张小型会议桌旁。\n\
  \n你的老板——互联服务副总裁——带着愉快的微笑从走廊走来。你一看到他，他便与你目光相接。\n\n“团队适应得怎么样？”他问道。你给出了积极的状态更新，他点点头，低声表示赞许。\n\
  \n“我有个想法，”他说，“你的团队做得很出色。但他们在分析交付速度上和几个月前一样。我们能不能做些什么，帮助他们更快地迭代？”\n\n你带着*多么有趣的想法*的表情微笑。这个问题你已经思考了好几个星期。\n\
  \n“我们做的任何分析，大部分时间都花在收集、清理和处理数据上，”你说，“可能占到80%甚至更高。我会让团队和我们的数据库专家一起集思广益，想办法减少这部分时间。我认为那会带来最大的影响。”\n\
  \n他微笑着点了点头。然后，他走向下一个会议。你知道这意味着你最好真的节省出时间，以满足他的期望。只是你还不确定该怎么做。\n\n本章聚焦于如何以一种让数据科学家更容易提取价值的方式来组织数据。我们将引入**链接分析数据集（LAD）**的概念，以此显著提升**机器学习（ML）**建模开发的速度。你将学习如何在可维护性与数据科学家生产力之间取得平衡。\n\
  \n我们还将讨论如何防止数据湖变成数据沼泽。如果物联网数据难以使用，就不会产生太多价值；而如果没人被允许访问数据，它产生的价值就更少了。\n\n本章还将讨论为物联网数据制定数据保留策略。重点是在保留分析价值的同时，降低维护大量历史数据的成本。\n\
  \n本章涵盖以下主题：\n\n- LAD 概念简介\n- 构建 LAD 的流程\n- 管理数据湖\n- 数据保留策略\n\n### 链接分析数据集\n\nLAD\
  \ 的概念将已成熟的分析数据集和关系数据库思想联系在一起。将两者结合，能加速数据科学家到达他们和你最关心的部分——分析。\n\nLAD 一词是本书中引入的，尽管其总体概念并不新鲜。然而，这种安排似乎没有统一的名称，因此本书意图赋予它一个名称。那么，既然我们现在有了\
  \ LAD，就看看它是否能流行起来。\n\n### 分析数据集\n\n创建分析数据集的过程在概念上很简单，但执行起来很难。你可能已经创建过一个，无论你是否意识到。分析数据集将大量有用的特征组合到每条记录实例中。\n\
  \n这样做既是为了数据理解的目的（想一想第6章：了解你的数据——探索物联网数据），也是为了机器学习的用途（想一想第10章：物联网分析的数据科学）。目标是至少将物联网分析师针对特定主题回答问题所需特征的80%组合到一个表中。该表还会持续自动为他们生成。就是这么简单。\n\
  \n### 构建分析数据集\n\n分析数据集是半反规范化表。所谓半反规范化，是指不仅包含字段的ID代码，还包含其描述信息。你也可以决定基于值范围创建类别，并将这些类别作为单独的特征包含进来。\n\
  \n目标更多是让分析师的生活更轻松，而不是像纯关系数据库设计那样专注于高效存储值。本质上，你是在预构建分析师本来会使用SQL预处理数据集、以便训练ML模型时所需的转换后数据集。\n\
  \n由于数据整理通常占用分析师80-95%的时间，如果其中大部分已经构建好、测试过，并融入了业务逻辑，就能节省大量时间。而且这不仅是对一个人一次性的帮助，而是对许多人多次的帮助。这种复利效应大大增加了预构建分析数据集的价值。\n\
  \n任务应该是将可用于多个不同项目和主题的特征包含在表中。这需要一些有依据的权衡来挑选最佳特征。你永远不可能把分析师需要的100%都放进一个表里，但80%的目标可以带来巨大好处。\n\
  \n以下流程有助于决定如何为特定主题构建分析数据集。我们使用来自物联网设备的GPS位置数据作为示例。数据集中的每条实例将是时间和位置的组合：\n\n1. **确定数据的分辨率**：需要什么级别的聚合？单个记录是设备级、上报实例级，还是时间段级？这应该根据传入数据的分辨率以及业务上可能的用途来决定哪种最有意义。在我们的示例中，分辨率是GPS位置上报频率，即每10秒一次。\n\
  \n2. **列出从数据中添加或转换而来的所有变体、类别、计算和描述**：这应该是你的团队认为对建模有用的内容。也可能源自与业务专家讨论什么对他们有用。在我们的GPS位置示例中，如下所示：\n\
  \n    - 纬度\n    - 经度\n    - 星期几\n    - 距上一条GPS位置记录的时间\n    - 速度（根据之前一组滚动记录计算）\n\
  \    - 当前时区偏移\n    - 白天或夜晚\n    - GPS网格标识符（参考第9章，*将地理空间分析应用于物联网数据*）\n    - UTC精确时间\n\
  \    - 本地精确时间\n    - 设备当前状态（行驶中、怠速中或已停放）\n\n3. **审查每一项，评估其在分析、ML建模或报告中被使用的频率**：判断创建和存储这些信息的成本相对于其使用频率是否值得。在我们的示例中，本地精确时间和星期几被去掉了。这是基于预期使用频率与保留这些信息的存储和计算成本之间的权衡。这是一种平衡行为，随着不同字段对业务的价值变化，你的决定也可能随时间而改变。\n\
  \n4. **创建数据转换代码，自动在一个表中创建并维护这些信息**：目标是以自动化方式进行，这样数据科学家就不必在每次需要时重新创建。\n\n5. **为每条记录创建唯一标识符（如果尚不存在）**：在本例中，它将是精确的UTC时间与唯一设备标识符的组合，因此需要为该组合创建一个单独的ID字段。这样做是为了让数据科学家轻松，他们不必担心通过两个不同字段连接数据集而使分析复杂化。将其合并为一个字段，为他们简化事情：\n\
  \n| UTC设备ID | 设备ID | UTC时间 | 纬度 | 经度 | 距上一条的时间（秒） | 速度（公里/小时） | 当前时区偏移 | 白天/夜晚 |\
  \ GPS网格标识符 | 当前状态 |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- | ---\
  \ | --- |\n| 20170619031504G0678991B1 | 0678991B1 | 6/19/2017 3:15:04 | 41.881832\
  \ | -87.623177 | 15 | 0 | -8 | N | U2345 | 已停放 |\n| 20170619031524G0678991B1 | 0678991B1\
  \ | 6/19/2017 3:15:24 | 41.881834 | -87.623181 | 20 | 5 | -8 | N | U2345 | 行驶中 |\n\
  | 20170619031544G0678991B1 | 0678991B1 | 6/19/2017 3:15:44 | 41.881828 | -87.623182\
  \ | 20 | 20 | -8 | N | U2345 | 行驶中 |\n| 20170619031604G0678991B1 | 0678991B1 | 6/19/2017\
  \ 3:16:04 | 41.881841 | -87.623181 | 20 | 25 | -8 | N | U2344 | 行驶中 |\n\n表格形式的分析数据集示例\n\
  \n\n\n\n\n## 连接数据集\n\n在构建每个分析数据集时，你应该问自己：*如何将它们与其他分析数据集关联起来？* 哪些字段是通往相关关键数据集的天然桥梁？然后，有意识地以一种易于与其他数据集连接的方式构建分析数据集。这通常通过创建一个新的标识键或使用现有的标识键来完成。该标识键在两个数据集中应该是相同的。\n\
  \n如果这听起来耳熟，它与关系数据库设计的概念完全相同。它也与在线分析处理（OLAP）数据仓库中的星型模式设计密切相关。然而，目标却有所不同。\n\n在关系数据库设计中，目标是通过将数据规范化到多个关联表中，来最小化甚至消除数据重复。规范化将标识符与其描述拆分到不同的表中，这样描述只需存储一次。\n\
  \n在星型模式设计中，目标是让下钻、穿透以及预定义指标计算变得简单快速。数据集沿着时间、类别、财政年度和公司部门等维度进行存储和关联。\n\n然而，在 LAD\
  \ 设计中，目标是尽量减少连接，同时仍然允许轻松创建此前未曾设想的混合数据集。目的是尽量减少物联网分析师在构建机器学习建模训练集时的数据转换工作。这种权衡体现在数据大小、开发分析数据集时的初始\
  \ ETL 复杂度以及数据重复上。\n\n- 2. **如有必要，可合并多个字段，创建一个标识链接关系的单一字段**：大数据系统处理单字段连接远比多字段连接要好。这也让数据科学家使用起来更加简单，从而在合并数据集时更不容易出错。沿用我们的示例，你可以将略微取整后的经纬度值合并为一个标识字段，并存储在数据集中的一个单独字段中。取整是为了调整那些定位到该位置但位于停车场不同区域的极其精确的\
  \ GPS 值。\n- 3. **对数据集中所有可链接字段重复该过程**：GPS 网格标识符就是另一个候选字段。\n- 4. **将数据集及其链接添加到主图中，以供参考。**\n\
  \n下图展示了我们的简单 GPS 示例如何链接到其他分析数据集：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_322_0.png)\n\
  \n## 管理数据湖\n\n数据湖是用来存放来自多个来源的大量潜在有价值数据的地方。有些来源是物联网设备，有些则是公司内部数据，如生产、采购或客服记录。其概念是将所有这些各式各样的数据放在一个地方，以便通过统一的接口访问。就\
  \ Hadoop 而言，数据湖将存储在 HDFS 中，并可能通过 Hive 或 Spark 访问。\n\n### 当数据湖变成数据沼泽\n\n当水流进某个区域并聚积、滞留时，就会形成沼泽。藻类覆盖水面。当一个数据湖有大量原始数据涌入，却缺乏组织，也很少被使用来搅动“湖水”，它就会变成人们戏称为数据沼泽的东西。\n\
  \n当人们决定将许多系统中的数据复制到一个区域（如 HDFS）而不做任何更改时，这种情况经常发生。由于安全限制，分析师可能难以访问这些数据。即使他们确实拥有访问权限，也会发现很难理解大量的（通常是）关系型表，因为没有任何关键说明来指示\
  \ ID 字段代码的含义，或处理数据时应使用什么业务逻辑。\n\n他们常常沮丧地放弃。在这种情况下，大量潜在有价值的数据腐烂闲置，白白消耗存储空间和资金。\n\n\
  ### 数据精炼厂\n\n运作良好的数据湖实际上并不是统一的数据水池。它们更像是一个石油精炼系统。在石油精炼系统中，西德克萨斯中质原油通过管道或超级油轮流入多个不同的精炼厂。然后精炼厂将其加工成多种不同的精炼石油产品，从汽油到凡士林，甚至还有动物饲料。\n\
  \n有时，一个精炼厂的产品会成为另一个精炼厂的输入，后者会进一步加工并将其与其他精炼产品混合。不过，别把这个类比推得太远——没有人会把从地下开采出来的原油直接倒进自己的汽车油箱。\n\
  \n数据精炼厂也发生着非常相似的过程。没有人使用那种原始的“原油”数据；他们使用的是高价值的加工成品。下图演示了这一概念：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_324_0.png)\n\
  \n数据湖内部运行的数据精炼厂\n\n### 制定递进流程\n\n数据科学就是关于实验。物联网分析潜力巨大。然而，没有人确定它将如何发展。将这两者放在一起，可以预期会有大量实验。为了避免这变成一团无法管理的混乱，需要有一种方法，将临时数据集从早期开发推进到可重复且稳定的数据产品。\n\
  \n建立递进流程将有助于管理这一点。数据科学是高度迭代的，这使得很难像普通数据库开发项目那样找到一个清晰的信号点来表明状态变化。\n\n一种处理方式是设定定期的评审周期，由团队确定哪些数据集可以进入下一开发阶段。根据你的具体情况，决定评审发生的频率，定义各个阶段以及每个阶段的相应要求。\n\
  \n我们将介绍一个建议的递进路径，你可以根据自己独特的物联网分析环境需求进行调整。\n\n将你的数据湖划分为三个常规区域：\n\n- **沙盒：** 数据科学家在此区域具有完全的读写访问权限。除了团队共用的沙盒外，他们可能还有自己的沙盒。此区域用于初始实验和模型开发。\n\
  - **成熟：** 数据科学家对此区域具有完全访问权限，但没有自己的成熟环境，由团队共享。用于生成此区域中数据集的全部代码和脚本都应处于源代码控制之下。\n-\
  \ **生产：** 数据科学家具有完全读取权限，但没有写入能力。此区域中的数据集已经过全面测试，用于生成数据集的代码和脚本处于源代码控制之下，并且已建立变更控制流程。\n\
  \n以下是在区域之间移动数据集的建议递进流程：\n\n- **定期对数据集进行周期性评审：** 可以是每月、每季度或每半年一次。根据你的物联网分析发展速度选择最有意义的方式。但评审应定期进行并强制执行。由于分析中的小规模迭代，很容易推迟评审。要避免这个陷阱，并强制你的团队执行。\n\
  - **评审所有三个区域中应删除的数据集：** 这些可能是未能取得进展的开发数据集，或是已进入生产环境的数据集的旧版本。借鉴 Java 的做法，定期执行一次垃圾回收事件，以保持数据湖处于优化状态。\n\
  - **评审沙盒中准备好进入成熟区的数据集：** 这些数据集要么是项目专属且已准备好接受团队测试，要么对团队日常工作有用。后者应设置为定期重复运行的计划任务来构建数据集。这类数据集将有助于在未来加速许多项目。\n\
  - **评审成熟区中准备好进入生产区的数据集：** 这些通常更具项目特定性，并且已通过所有测试。一旦进入生产环境，未来的更改应尽可能少。此时，应将数据集的控制权移交给一个独立小组，由其进行维护并提供服务级支持。\n\
  \n### 数据保留策略\n\n即使是大数据，最终也会变得过于庞大且维护成本过高。记住在最大化价值的同时最小化成本的目标，确保为物联网数据制定保留策略。数据可以在保留一定时间后被简单删除。然而，这样做可能会让你错失构建一个未来盈利分析服务的机会，而该服务在数据被丢弃之前从未被想到。\n\
  \n还有其他选项可以让你在保留数据价值的同时最小化成本。我们接下来将讨论其中一些。\n\n#### 目标\n\n物联网分析的保留策略有两个目标：\n\n- **保持价值**：高级建模技术（如深度学习）需要大量历史数据来最大化预测效果。而且很难提前知道哪些字段对未来的未知项目有价值。传统的数据保留策略是在固定时间段内存储记录，然后删除整个数据集，这可能导致错失盈利机会。需要一种不同的思维方式。\n\
  - **最小化成本**：物联网数据可能会迅速膨胀。即使采用基于云的 HDFS 存储，成本也可能变得很高。永远保留所有数据很容易使其成本超过其提供的价值。数据越易于访问，其成本就越高。应该做出一些妥协来控制成本。\n\
  \n#### 物联网数据的保留策略\n\n我们将介绍三种减少数据存储量的策略。这些策略可以单独使用，也可以组合使用。我们将讨论每种策略的优缺点，并逐步讲解一个利用所有这三种策略的保留计划示例。\n\
  \n\n\n\n\n## 降低可访问性\n\n你可以在不删除任何数据的情况下，通过降低数据的相对可访问性来大幅降低成本。接下来我们将介绍一些实现方法：\n\n\
  -   **压缩**：压缩是你的得力助手。压缩数据能在保留全部信息的同时，通常只需付出访问时间略微增加的微小代价。使用如 Avro 和 Parquet 等压缩格式，可以显著减少\
  \ Hadoop 集群和 S3 文件夹中的存储占用（从而降低成本），并且往往还能提升性能。性能的提升需要精心设计文件格式，但这本身就是一种最佳实践。HDFS 也支持\
  \ GZIP 和 Snappy 等其他压缩格式。这应该是你缩减文件大小的首要举措。更好的做法是，在最初的存储设计阶段就将其纳入规划。\n-   **改用成本更低的存储技术**：保留数据，但迁移到成本更低的方法上。这通常会带来性能损失，但如果被迁移的数据访问频率不高，这点代价是值得的。例如，可以从\
  \ SSD 存储迁移到硬盘存储，最终甚至可以迁移到磁带存储。\n-   **更改可访问性服务级别**：此方法更适用于云存储服务，与更换存储技术类似（当然，在云环境中也可以更换存储技术）。对于\
  \ Amazon S3，这可以指切换到“标准-低频访问”服务级别，或者对于极不常访问的数据，使用 Amazon Glacier。S3 支持基于规则（例如文件年龄）自动调度文件迁移到更低服务级别。\n\
  -   **更改冗余级别**：HDFS 为保障持久性会保存数据的多个副本。标准设置是三个副本，但这是可配置的。你可以为价值较低的文件调整冗余级别，从而节省部分成本。Amazon\
  \ S3 也提供了“减少冗余”选项。\n\n## 减少字段数量\n\n随着你对物联网数据的了解加深，会发现某些字段比其他字段更有价值。通过运用第6章“了解您的数据\
  \ - 探索物联网数据”和第10章“物联网分析的数据科学”中的技巧，你会识别出哪些字段（特征）在统计上始终显著，而哪些似乎从未产生影响。\n\n对于较旧的文件，你可以采取一些方法保留有用的字段，同时舍弃那些似乎无关紧要的字段：\n\
  \n-   **转换旧数据，只保留有用字段**：将较旧的数据移动到新文件或新表，但仅保留那些有用的字段。然后，删除旧记录。\n-   **将有用字段拆分并区别对待**：对于旧记录，你可以将有用字段保留在易于访问的“热”区域，同时将不太有用的字段转移到“冷”存储中。\n\
  -   **汇总并移除大型数据字段，如文本或二进制文件（例如图像或声音）**：例如，你可以将一个冗长的自由格式文本字段缩减为关键词出现次数的计数。\n\n##\
  \ 减少记录数量\n\n最后，你也可以选择直接删除旧记录。但等等，还有一些其他选项可以让你至少保留一些可能有用的信息。一旦删除历史数据，就永远无法挽回了。值得担心的是，你可能会在事后发现，如果当初保留了那些数据，本可以用于构建更有价值的机器学习模型并带来额外收入。下面列出了其他一些选项：\n\
  \n-   **删除原始数据，但保留其精炼版本**：经过一段时间后，同时保留原始数据和精炼版本可能不会增加太多价值。删除较旧的原始数据文件不会损失太多价值。\n\
  -   **汇总旧数据**：与其完全删除数据，不如将单条记录汇总为每周或每月的摘要值。合适的汇总统计量可以是平均值、总和，或者最好是一整套汇总统计量。例如，你可能希望保存平均值、标准差、最大值、最小值和记录数。这样可以将数千行数据缩减为一行，因此即使生成的数据集字段更宽也完全没问题。你会丢失部分数据价值，因为无法再看到完整分辨率的信息。但你仍在汇总统计量中保留了一些信息价值。如果将来需要，你甚至可以使用这些统计量来模拟原始记录。\n\
  -   **删除旧数据**：这应该是最后的选择。请记住，分析是构建于数据之上的，一旦数据消失，你本可以进行的分析也随之而去。\n\n## 保留策略示例\n\n\
  我们回到 GPS 位置数据示例来制定保留策略。原始数据加载到 HDFS 表中，并保持未压缩状态。一系列数据精炼流程将数据转换为干净且有用的分析数据集。所有分析数据集都使用\
  \ Parquet 格式压缩，并且仍在 HDFS 中。\n\n对原始数据的审查表明，初始转换中的任何问题通常都会在一周内被发现。超过一个月后才发现的未解问题为零。因此，原始数据被保留最近一个月，之后迁移到\
  \ S3 Standard。在 S3 中，创建了一套规则，在一个月后将数据迁移到“标准-低频访问”，再一个月后迁移到 Amazon Glacier。再过三个月，数据计划从\
  \ Amazon Glacier 中删除。\n\n经过数月的统计分析和建模，在每个分析数据集中都识别出了几个关键字段。同时发现，两年多以前的数据记录很少被访问。三年多以前的记录从未被访问。\n\
  \n来自两年前的数据被移出 HDFS，进入 S3 Standard。对于介于两到三年之间的数据，进行了转换，只保留关键字段。更旧的数据被迁移到 Amazon Glacier。四年后，数据按日聚合进行汇总，包含每台设备的记录数、起始位置、结束位置、平均位置，以及行驶距离和行驶时间等指标。由于该数据集的体积比以前小了一万倍，因此保留在\
  \ S3 Standard 中。完整数据随后被删除。\n\n## 总结\n\n在本章中，我们探讨了如何通过减少数据处理耗时来提高数据科学家的生产力。介绍了湖敏捷数据（LAD）的概念，以及构建它们的流程。\n\
  \n我们讨论了如何防止数据湖演变成“数据沼泽”的概念。将视角从“数据湖”转变为一系列活跃的精炼流程和生产链，有助于规划出有用的数据存储区域。\n\n我们还回顾了数据保留策略。在设计保留策略时，请考虑在最大化价值的同时最小化成本这双重目标。在下一章中，我们将讨论物联网分析的经济性。该章节将涵盖如何在数据中寻找商业价值，并提供一个详细的预测性维护案例。\n"
- "## 物联网分析的经济性\n\n你坐在办公室里，凝视着窗外街对面的建筑。你一边沉思，一边无意识地用笔敲着额头，感到笔尖一下一下地触碰着皮肤。老板二十分钟前刚离开你的办公室。\n\
  \n“我们需要一个预测性维护计划，”他曾说，“但不能亏钱！我们需要更多收入。但我不想让你把时间浪费在无法为我们创造收益的分析上。”\n\n你表示同意并点了点头，脸上带着若有所思的微笑。你知道如何思考分析本身，但未必清楚如何从收益和成本的角度来看待它。\n\
  \n“而且我希望你继续尝试新事物！我们要保持实验性。你做得很好！只是别亏钱，”他继续说道。\n\n*好吧，当然，*你想。*那我该怎么做呢？*\n\n本章将解释如何为物联网分析项目构思商业案例。它讨论了如何通过最小化成本和增加收入流机会来优化投资回报。\n\
  \n商业案例的成本和收益可以而且应该直接融入到物联网分析流程中。通过这样做，这些方法不仅能具有良好的预测价值，还可以针对生成盈利服务进行优化。\n\n我们还将通过一个预测性维护的案例，回顾如何应用分析来最大化价值。预测性维护是物联网分析的一个常见应用，如果应用得当，使节省的成本超过投入的成本，就能降低总体费用。\n\
  \n\n\n\n\n在本章中，我们将涵盖以下主题：\n\n- 云计算和开源的经济学：\n  - 可变成本与固定成本\n  - 退出选项\n  - 云成本可能 escalate\n\
  \  - 开源软件考虑因素\n- 思考收入机会：\n  - 现有业务实践的延伸\n  - 新服务\n- 预测性维护的经济学：\n  - 估值公式\n  - 计算\
  \ **机器学习 (ML)** 模型实施成本曲线的 R 代码\n\n## 云计算和开源的经济学\n\n乍一看，云计算似乎应该与本地系统以相同的方式进行估值。看起来开源解决方案总是更有意义，因为没有许可费用。它是免费的，对吧？\n\
  \n我们将介绍一些思考物联网分析中云计算和开源软件估值的方法。就像大多数事情一样，乍一看比实际复杂得多。\n\n## 可变与固定成本\n\n可变成本会随着使用量的多少而扩张和收缩。示例包括组装车辆的汽车生产零件、运输中的燃料和云服务。固定成本无论需要多少使用量都是恒定的。示例是数据中心、机架式服务器和设备（或云环境）管理。\n\
  \n退出选项具有价值，应在为物联网分析制定商业案例时纳入其中。在确定物联网分析项目不可行时，所有成本都可以立即终止。以下图表说明了这种情况：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_333_0.png)\n\
  \n具有退出选项的云物联网分析可变成本\n\n## 云成本可能迅速 escalate\n\n不过，这并不是全是阳光和玫瑰，因为如果设计不当且监控不严，云服务成本可能会迅速\
  \ escalate。如果物联网分析项目设计为云服务比所需更频繁地调用其他云服务，其影响可能非常显著。\n\n例如，考虑一个 AWS Lambda 函数，它使用消息队列服务检查\
  \ Amazon IoT Hub 上所有物联网设备的存储状态。网页开发人员创建一个用户界面，每次页面加载或刷新时都会调用此函数。每次调用函数时，这三项服务都会产生费用。成本可能比预期更快地\
  \ escalate。更好的设计是设置 AWS Lambda 函数每隔几分钟运行一次，并将结果存储在缓存引用中，供 Web 界面使用。\n\n如果创建的物联网分析应用程序不能同时向上和向下扩展，这也可能变得昂贵。如果计算需求的设计是为了满足最大预期需求而不是根据需要进行扩展，您将为不需要的容量付费。\n\
  \n## 密切监控云账单\n\n大多数云基础设施服务，包括 AWS，都提供设置规则的方式，如果成本超过某个阈值则提醒您。规则可以按每小时、每天或每月为基础设置。这些应该立即设置，以便您立即知道成本是否超过预期。\n\
  \n## 开源经济学\n\n开源软件，例如 R 或 Python，成本低，但实际上并不完全免费。任何使用开源软件组件的物联网分析商业案例都需要考虑的费用。\n\n\
  ## 知识产权考虑\n\n并非所有开源代码都获得商业和盈利用途的许可。在将开源代码纳入产生收入的商业项目之前，您需要检查开源代码是在何种类型的 **知识产权 (IP)**\
  \ 许可下提供的。这至少需要一些法律费用，以确保您遵守 IP 要求。以下图表显示了开源许可类型的子集：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_334_0.png)\n\
  \n## 规模\n\n在开源软件上扩展物联网分析可能会产生一些挑战。您可能会使用 R 或 Python 来探索和生产化您的 ML 模型以及许多其他分析。两者都可以扩展到单个计算实例的大小。例如，R\
  \ 将所有内容保存在内存中，因此限制是该实例的内存大小。\n\n两种编程语言都不是原生分布式（很少有），因此要扩展到单个计算实例之外，您需要采用额外的框架和设计复杂性。这就是使用\
  \ Apache Spark 的好处之一。如果您能够以并行方式进行分析，您可以使用 Spark 来管理分布式计算。这就是第 5 章《收集所有这些数据 - 策略和技术》中介绍的相同\
  \ map 和 reduce 概念。\n\n使用 Spark，Python 代码可以作为分布式作业传递，结果收集到数据帧中。但是，代码所需的所有库包必须存在于集群中的每个节点上。为了高效地做到这一点，您需要一个包管理器。例如，Continuum\
  \ 公司提供了一个名为 Anaconda Scale 的包管理器（https://docs.continuum.io/anaconda-scale/）。包管理软件会增加一些成本，应纳入您的商业案例。\n\
  \n使用 SparkR 包可以用 R 实现相同的概念。同样，应使用包管理器在集群中安装和管理库。\n\n## 支持\n\n开源软件是免费的……并且没有保修或支持。如果出现问题，您需要自行修复。最有可能的是，您的团队没有技能来纠正复杂的问题。有几家公司提供开源软件的技术支持。有些甚至提供受支持的开源软件版本，但当然要收费。\n\
  \n例如 Revolution Analytics，现由 Microsoft 所有。它提供受支持的 R 开源软件版本。与其相关的是支持和许可费用。\n\n总体而言，如果您依赖开源代码来运行产生收入的业务，您将需要支持以防出现问题。您要么需要雇用该技能，要么应与专门从事此支持的公司签订合同。这些成本应考虑在任何商业案例中。\n\
  \n以下是一些需要考虑的收入可能性：\n\n- **对您当前业务流程的扩展：** 这些想法与您正在做的事情密切相关，可以为客户增加额外价值。始终有益的是从最终客户的角度思考服务。设身处地为他们着想，想想什么可以为您节省成本并帮助您更好地经营业务。更好的是，征求他们的意见。一些需要考虑的领域如下：\n\
  \  - **现场运营监控：** 即时获取现场设备状态的数据通常是首先添加物联网设备的原因。但您可以通过为客户提供监控和警报服务来为他们增加价值，这样他们就不必自己创建。您处于可以实现更大规模经济的位置，因为您的成本可以在众多客户之间分摊。\n\
  \  - **现场设备位置和状态跟踪：** 同样，您可以将成本分摊到众多客户，因此您可以以低成本将其作为服务添加到他们。比他们自己创建要便宜。\n  - **改进的现场维修服务：**\
  \ 如果您的公司还提供与物联网设备连接的设备的服务，您就有机会提供更快更好的现场服务水平。如果您也在监控设备并跟踪位置和状态，这就是自然的下一步。您不仅立即知道是否存在问题，还确切知道其位置以及需要带去纠正的零件。即使您不提供设备的现场服务，您也可以作为中介为提供该服务的公司服务。由于您使整个流程更高效，这对最终客户和现场服务公司都有价值。来自双方的收入流都可能进入您的口袋。\n\
  - **新的收入机会：** 这些想法是与当前业务流程没有直接关系的附加服务。想想看；您有关于物联网设备位置和操作的新信息流入集中位置。这是您以前没有的信息。花一点时间以不同的方式看待它，想想如果信息一直可用，您的业务将如何从中产生收入。尝试摆脱事情一直如此的思维定势。需要考虑的一些事情如下：\n\
  \n\n\n\n\n- **来自物联网数据池本身的价值：** 想想哪些其他企业和行业会觉得你手上的数据有价值。以一种保护客户的方式将其打包，并提供这些其他公司所需的信息。然后，向他们收取费用。我们在本书前面讨论过一个关于物联网恒温器数据的例子，该数据被汇总并出售给发电公司。蜂窝网络公司以一种指示高速公路沿线当前交通拥堵的方式打包手机位置数据。一些手机应用公司收集\
  \ GPS 位置并将其打包出售给零售商，作为其商店客流量指标的参考。金融和保险公司肯定会从比官方统计数据更早获得的业务细分活动指标中获得价值。\n- **新的业务服务：**\
  \ 想想拥有物联网数据和你所创建的分析能力，能让你的公司比任何人都更有利地提供服务。它甚至可能是在目前无关的业务中。回到物联网恒温器示例。由于公司既能检测 HVAC\
  \ 问题，又能知道设备的位置，因此它能够高效地安排正确的维修程序。这一概念在本书本章的 *当前业务流程的扩展* 部分中已提及。然而，在这种情况下，物联网恒温器公司目前没有服务职能。他们可能想要启动一项服务，因为他们处于有利地位。想象一下，如果恒温器向客户发送电子邮件，告知它检测到问题，并且可以在两小时内派维修人员以预先确定的合理价格修复。客户所要做的就是点击确定，如下图所示：\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_338_0.png)\n\n- **对客户非常有价值而你以前无法提供的服务：**\
  \ 想想客户如何利用你现在拥有的数据来改善其业务。他们可能已经在做其中一些事情，因此再次强调，与他们联系并询问他们非常重要。将该服务打包并出售给所有客户。例如，如果你为物流公司提供用于公路拖车单元的\
  \ GPS 跟踪设备，想想客户如何会觉得这些数据对他们有价值。你可以为客户提供基准服务，将其单元行驶里程与类似公司进行比较。你可以将他们的位置数据随时间聚合，为他们展示路线集中图。你可以将他们的地图与行业进行比较，这在考虑扩张计划时对他们可能非常有价值。\n\
  \n## 预测性维护示例的经济性\n\n预测性维护是物联网分析中常被引用的价值主张。我们将通过一个示例来说明如何从财务角度思考何时有意义、何时没有意义。\n\n\
  ## 情况\n\n预测性维护的经济性可能并不完全明显。信不信由你，即使你能准确预测早期故障，它也并不总是合算。在许多情况下，你实际上会通过这样做而亏钱。即使它能为你省钱，也有一个最佳使用点。最佳点取决于成本和预测模型的准确性。\n\
  \n## 价值公式\n\n指导决策的公式比较了允许故障发生的成本与在考虑预测故障的概率的同时主动维修组件的成本：\n\n*净节省 = (故障成本 * (预期故障数\
  \ - 预期真正阳性预测数)) - (主动维修成本 * (预期真正阳性 + 预期假阳性))*\n\n如果故障成本与主动维修成本相同，即使是完美的预测模型，我们从第\
  \ 10 章《物联网分析的数据科学》中知道这种情况极不可能发生，也不会有任何节省。务必将无形成本计入故障成本。无形成本的示例包括法律费用、品牌资产损失，甚至客户的费用。\n\
  \n当故障成本与主动更换成本之间存在较大差距，并且预测模型表现良好时，预测性维修才有意义。例如，如果故障成本是 $1 百万 USD 的机车发动机更换，而主动维修成本是\
  \ $200 USD，那么在进行主动更换计划在财务上合理之前，模型的准确性甚至不必太高。\n\n另一方面，如果故障是 $400 USD 的汽车涡轮增压器更换，而主动维修成本是\
  \ $350 USD 的涡轮增压器执行器子部件更换，则预测模型需要高度准确，这才在财务上合理。\n\n## 一个价值决策的例子\n\n为了说明示例，我们将介绍一个业务情况，然后是一些\
  \ R 代码，该代码模拟该决策的成本效益曲线。代码将使用拟合的预测模型来计算净节省（或缺乏节省）以生成成本曲线。然后成本曲线可用于业务决策，确定应主动更换多少比例的预测故障单元。\n\
  \n想象你在一家制造柴油发电机的公司工作。有一个冷却控制阀，正常使用 4,000 小时运行后才会计划更换。通过分析，你的公司意识到两年前制造的发电机出现了阀门比预期更早的故障。\n\
  \n当阀门故障时，发动机过热并损坏其他几个部件。故障成本，包括维修人员的劳动费率和客户停机成本，平均为 $1,000 USD。阀门的主动更换成本为 $253 USD。\n\
  \n你是否应该更换整个群体中的所有冷却阀？这取决于预期故障率有多高。在这种情况下，预计约 10% 的当前未故障单元会在计划更换前故障。此外，重要的是，你预测故障的能力如何。\n\
  \n以下 R 代码模拟了这种情况，并使用一个简单的预测模型（逻辑回归）来估计成本曲线。模型的 AUC 约为 0.75。由于数据集是随机模拟的，因此每次运行代码时都会有所不同：\n\
  \n```\n```r\n#make sure all needed packages are installed\nif(!require(caret)){\n\
  \  install.packages(\"caret\")\n}\nif(!require(pROC)){\n  install.packages(\"pROC\"\
  )\n}\nif(!require(dplyr)){\n  install.packages(\"dplyr\")\n}\nif(!require(data.table)){\n\
  \  install.packages(\"data.table\")\n}\n\n#Load required libraries\nlibrary(caret)\n\
  library(pROC)\nlibrary(dplyr)\nlibrary(data.table)\n\n#Generate sample data\nsimdata\
  \ = function(N=1000) {\n\n#simulate 4 features\nX = data.frame(replicate(4,rnorm(N)))\n\
  #create a hidden data structure to learn\nhidden = X[,1]^2+sin(X[,2]) + rnorm(N)*1\n\
  #10% TRUE, 90% FALSE\nrare.class.probability = 0.1\n#simulate the true classification\
  \ values\ny.class = factor(hidden>quantile(hidden,c(rare.class.probability)))\n\
  return(data.frame(X,Class=y.class))\n}\n```\n```\n\n```\n```r\n#make some data structure\n\
  model_data = simdata(N=50000)\n\n#train a logistic regression model on the simulated\
  \ data\ntraining <- createDataPartition(model_data$Class, p = 0.6, list=FALSE)\n\
  trainData <- model_data[training,]\ntestData <- model_data[-training,]\nglmModel\
  \ <- glm(Class ~ ., data=trainData, family=binomial)\ntestData$predicted <- predict(glmModel,\
  \ newdata=testData, type=\"response\")\n\n#calculate AUC\nroc.glmModel <- pROC::roc(testData$Class,\
  \ testData$predicted)\nauc.glmModel <- pROC::auc(roc.glmModel)\nprint(auc.glmModel)\n\
  \n#Pull together test data and predictions\nsimModel <- data.frame(trueClass = testData$Class,\n\
  \                       predictedClass = testData$predicted)\n\n# Reorder rows and\
  \ columns\nsimModel <- simModel[order(simModel$predictedClass, decreasing = TRUE),\
  \ ]\nsimModel <- select(simModel, trueClass, predictedClass)\nsimModel$rank <- 1:nrow(simModel)\n\
  \n#Assign costs for failures and proactive repairs\nproactive_repair_cost <- 253\
  \   # Cost of proactively repairing a part\nfailure_repair_cost  <- 1000   # Cost\
  \ of a failure of the part (include all\n                                # costs\
  \ such as lost production, etc not just the repair cost)\n\n# Define each predicted/actual\
  \ combination\nfp.cost <- proactive_repair_cost # The part was predicted to fail\
  \ but did\n                                 # not (False Positive)\nfn.cost <- failure_repair_cost\
  \   # The part was not predicted to fail and it\n                              \
  \   # did (False Negative)\ntp.cost <- (proactive_repair_cost - failure_repair_cost)\
  \ # The part was\n                                                         # predicted\
  \ to fail and it did (True Positive). This will be negative for a\n            \
  \                                             # savings.\ntn.cost <- 0.0       \
  \                # The part was not predicted to fail and\n                    \
  \                  # it did not (True Negative)\n\n#incorporate probability of future\
  \ failure\nsimModel$future_failure_prob <- prob_failure\n\n#Function to assign costs\
  \ for each instance\nassignCost <- function(pred, outcome, tn.cost, fn.cost, fp.cost,\
  \ tp.cost,\nprob) {\n  cost <- ifelse(pred == 0 & outcome == FALSE, tn.cost, # No\
  \ cost since no\n                 action was taken and no failure\n```\n\n\n```r\n\
  cost <- ifelse(pred == 0 & outcome == TRUE, fn.cost, # The cost of no action and\
  \ a repair resulted\n    ifelse(pred == 1 & outcome == FALSE, fp.cost, # The cost\
  \ of proactive repair which was not needed\n        ifelse(pred == 1 & outcome ==\
  \ TRUE, tp.cost, 999999999)))  # The cost of proactive repair which avoided a failure\n\
  \    return(cost)\n}\n\n# Initialize list to hold final output\nmaster <- vector(mode\
  \ = \"list\", length = 100)\n\n# use the simulated model. In practice, this code\
  \ can be adapted to compare multiple models\ntest_model <- simModel\n\n# Create\
  \ a loop to increment through dynamic threshold (starting at 1.0 [no proactive repairs]\
  \ to 0.0 [all proactive repairs])\nthreshold <- 1.00\nfor (i in 1:101) {\n# Add\
  \ predicted class with percentile ranking\ntest_model$prob_ntile <- ntile(test_model$predictedClass,\
  \ 100) / 100\n# Dynamically determine if proactive repair would apply based on increment\
  \ threshold\ntest_model$glm_failure <- ifelse(test_model$prob_ntile >= threshold,\
  \ 1, 0)\ntest_model$threshold <- threshold\n\n# Compare to actual outcome to assign\
  \ costs\ntest_model$glm_impact <- assignCost(test_model$glm_failure,\ntest_model$trueClass,\
  \ tn.cost, fn.cost, fp.cost, tp.cost,\ntest_model$future_failure_prob)\n\n# Compute\
  \ cost for not doing any proactive repairs\ntest_model$nochange_impact <- ifelse(test_model$trueClass\
  \ == TRUE,\nfn.cost, tn.cost) # *test_model$future_failure_prob)\n\n# Running sum\
  \ to produce the overall impact\ntest_model$glm_cumul_impact <- cumsum(test_model$glm_impact)\
  \ /\nnrow(test_model)\ntest_model$nochange_cumul_impact <- cumsum(test_model$nochange_impact)\
  \ /\nnrow(test_model)\n\n# Count the # of classified failures\ntest_model$glm_failure_ct\
  \ <- cumsum(test_model$glm_failure)\n\n# Create new object to house the one row\
  \ per iteration output for the final plot\nmaster[[i]] <- test_model[nrow(test_model),]\n\
  \n# Reduce the threshold by 1% and repeat to calculate new value\nthreshold <- threshold\
  \ - 0.01\n}\n\nfinalOutput <- rbindlist(master)\nfinalOutput <- subset(finalOutput,\n\
  \                    select = c(threshold,\n                               glm_cumul_impact,\n\
  \                               glm_failure_ct,\n                              \
  \ nochange_cumul_impact)\n)\n\n# Set baseline to costs of not doing any proactive\
  \ repairs\nbaseline <- finalOutput$nochange_cumul_impact\n\n# Plot the cost curve\n\
  par(mfrow = c(2,1))\nplot(row(finalOutput)[,1],\n     finalOutput$glm_cumul_impact,\n\
  \     type = \"l\",\n     lwd = 3,\n     main = paste(\"Net Costs: Proactive Repair\
  \ Cost of $\",\nproactive_repair_cost, \", Failure cost $\", failure_repair_cost,\
  \ sep = \"\"),\n     ylim = c(min(finalOutput$glm_cumul_impact) - 100,\n       \
  \       max(finalOutput$glm_cumul_impact) + 100),\n     xlab = \"Percent of Population\"\
  ,\n     ylab = \"Net Cost ($) / Unit\")\n\n# Plot the cost difference of proactive\
  \ repair program and a 'do nothing' approach\nplot(row(finalOutput)[,1],\n     baseline\
  \ - finalOutput$glm_cumul_impact,\n     type = \"l\",\n     lwd = 3,\n     col =\
  \ \"black\",\n     main = paste(\"Savings: Proactive Repair Cost of $\",\nproactive_repair_cost,\
  \ \", Failure cost $\", failure_repair_cost,sep = \"\"),\n     ylim = c(min(baseline\
  \ - finalOutput$glm_cumul_impact) - 100,\n              max(baseline - finalOutput$glm_cumul_impact)\
  \ + 100),\n     xlab = \"% of Population\",\n     ylab = \"Savings ($) / Unit\"\
  )\nabline(h=0,col=\"gray\")\n```\n\n从生成的净成本和节约曲线可以看出，基于模型的预测，最优节约来自于对前 30% 百分位单元进行主动维修。超过这一点后，节约额会下降，不过即使更换多达\
  \ 75% 的单元，你仍然可以省钱。超过这个点后，你应该预期支出会超过节约。下面这组图表就是上述代码的输出结果：\n\n![](img/9f2a55db1236f995dcd9392acbc82910_345_0.png)\n\
  \n主动维修成本为 253 美元且故障成本为 1,000 美元场景下的成本与节约曲线\n\n请注意，当故障成本降至 300 美元时，下图中的曲线发生了怎样的变化。在任何情况下你都无法省钱，因为主动维修成本总是会超过降低后的故障成本。这并不意味着你不应该进行主动维修；为了满足客户，你可能仍然希望这样做。即使在这种情况下，这种成本曲线方法也可以帮助决定你愿意为解决该问题花费多少。你可以将\
  \ **proactive_repair_cost** 设置为 **253**，将 **failure_repair_cost** 设置为 **300**，重新运行代码，以生成以下图表：\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_346_0.png)\n\n主动维修成本为 253 美元且故障成本为 300\
  \ 美元场景下的成本与节约曲线\n\n最后，请注意当故障成本变为 5,000 美元时，节约曲线会发生怎样的变化。你会注意到，主动维修成本与故障成本之间的差值，在很大程度上决定了何时进行主动维修才具有商业意义。你可以将\
  \ **proactive_repair_cost** 设置为 **253**，将 **failure_repair_cost** 设置为 **5000**，重新运行代码，以生成以下图表：\n\
  \n![](img/9f2a55db1236f995dcd9392acbc82910_347_0.png)\n\n主动维修成本为 253 美元且故障成本为 5,000\
  \ 美元场景下的成本与节约曲线\n\n最终，这是一个基于预期成本和收益的商业论证。在合适的条件下，机器学习建模可以帮助优化节约。利用成本曲线有助于确定主动更换的预期成本与节约。\n\
  \n### 总结\n\n在本章中，我们讨论了云计算和开源软件的经济性。我们回顾了物联网分析的成本考量，以及如何思考收入机会。我们还探讨了如何思考物联网分析商业论证。\n\
  \n我们以预测性维护的经济性为例，讨论如何审视已应用的物联网分析机器学习模型的成本与收益。我们展示了一个计算成本收益的示例框架，并附带了部分 R 代码，演示了如何基于机器学习模型生成成本曲线。\n"
