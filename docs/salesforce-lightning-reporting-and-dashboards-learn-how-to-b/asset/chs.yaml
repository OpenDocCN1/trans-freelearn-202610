- '# Salesforce 报表和仪表板的 fundamentals


  本章将为您提供 Salesforce 云技术的总体概述，包括云平台的优势、Salesforce Lightning Experience 的介绍、将 Salesforce
  扩展到客户关系管理 (CRM) 之外，以及导航 Salesforce 报表和仪表板。我们还将涉及 Salesforce 架构、设置菜单和 Lightning Experience
  用户界面。


  本章包含适用于业务用户和 Salesforce 系统管理员的信息。本章中的一些主题讨论了系统管理员专用的功能，但业务用户可能会对更好地了解 Salesforce
  架构感兴趣。


  在整本书中，我们将提供笔记和提示来帮助您轻松理解 Salesforce 技术。在接下来的几章中，我们将介绍构建高级报表和仪表板的各种技能，以满足您在 Lightning
  Experience 中的业务需求。动手活动将是大多数章节的一部分，而创建和管理报表和仪表板将在第 4 章《创建和管理报表》及以后进行介绍。


  本章将涵盖以下主题：


  - Salesforce 的概述和优势

  - Salesforce Lightning Experience

  - Salesforce 对象模型

  - 导航到设置菜单

  - 导航到报表和仪表板


  以下是 Salesforce 目前提供的一些云产品：


  - **Sales Cloud**：Sales Cloud 自动化您的销售流程

  - **Service Cloud**：Service Cloud 提供进化的客户服务流程

  - **Marketing Cloud**：Marketing Cloud 得益于数字营销自动化

  - **Community Cloud**：Community Cloud 与您的客户和合作伙伴连接

  - **Wave Analytic**：Wave Analytic 为业务用户和分析师提供分析

  - **App Cloud**：App Cloud 允许您为业务需求构建应用程序

  - **IoT Cloud**：IoT Cloud 用于存储和处理**物联网 (IoT)** 连接设备的 数据

  - **Commerce Cloud**：Commerce Cloud 使您能够构建统一的购物体验


  随着 Salesforce 不断收购和构建新产品，以上列表可能会随时更改。


  简而言之，与其他本地应用程序相比，使用 Salesforce 的优势如下：


  - 更快的实施计划

  - 更低的维护成本，因为您无需购买或支持内部服务器，也无需为其维护资源

  - 可扩展性和稳健性

  - 安全且高性能

  - 易于使用 AppExchange 上的预构建解决方案扩展功能

  - 可从台式机、笔记本电脑、平板电脑和移动应用程序访问

  - 面向中小型企业的企业级应用程序


  ## Salesforce Lightning Experience


  Lightning Experience 是一种现代、快速且美观的用户界面，旨在帮助您的销售用户提高生产力和效率。它以销售为中心构建，专注于帮助销售代表更自然地日常工作。有了
  Lightning Experience，您的用户将获得直观且智能的用户界面。


  Lightning Experience 采用经过验证的 Salesforce1 移动应用程序技术构建。您的销售代表已经使用移动设备输入潜在客户、记录客户会议后的任务和笔记、运行报表和仪表板等。Lightning
  Experience 将所有这些来自移动体验的酷炫功能带入了计算机网络浏览器。


  ## 让我们使用正确的术语


  在许多情况下，Lightning Experience 简称为 Lightning，尽管 Salesforce 平台中有许多以“Lightning”开头的项目，例如
  Lightning 登录、Lightning 应用构建器、Lightning for Outlook、Lightning 组件、Lightning 同步等。其中一些仅适用于
  Lightning Experience，但其他一些在 Lightning Experience 和旧版 Classic 用户界面中都可以使用，例如 Lightning
  Sync 用于在您的电子邮件服务器与 Salesforce 之间同步用户联系人和事件。


  为了明确，当您遇到 Salesforce 社区中的某个人，他问您是否使用 lightning 时，他很可能指的是 Lightning Experience。为了使用正确的术语，它是
  Lightning，而不是 Lightening 或 Lighting。


  ## Lightning Experience 之前是什么？


  如果您注意到了，我们在 *让我们使用正确的术语* 部分中提到了经典用户界面这个术语。是的，就是它——在 Lightning Experience 推出之前，Salesforce
  Classic 已服务多年。Salesforce Classic 仍然存在，并被许多客户广泛使用，但主要是，Salesforce 在最近版本中引入的新功能仅适用于
  Lightning Experience。


  如果您仍在使用 Classic，Salesforce 敦促您迁移到 Lightning。为什么我使用迁移这个术语？因为用户界面完全不同，并且您现有的一些自定义可能无法工作，例如由您的
  Salesforce 合作伙伴或 IT 团队构建的 JavaScript 按钮。您应在做出决定前咨询您的 Salesforce 成功经理、合作伙伴或 IT。


  由于用户界面与 Classic 完全不同，您的用户手册、培训视频和材料等需要更新，因此请使用适当的项目管理来规划此旅程，以推出 Lightning Experience。


  ## 让我们打开 Lightning Experience


  本节面向仍在 Salesforce Classic 中操作的系统管理员——只有系统管理员才有权限启用 Lightning Experience。如果您已在 Lightning
  Experience 上，可以跳过本节。


  让我们进行一个快速的动手练习，了解如何启用 Lightning Experience：


  1. 点击 **Setup** 导航到设置菜单，然后点击左上角菜单中的 **Lightning Experience**：


  ![](img/72d01bea5a9ccf02f9452aab7505d9de_27_0.png)


  2. 滚动到页面底部，查找 **Lightning Experience**，然后切换以启用它：


  ![](img/72d01bea5a9ccf02f9452aab7505d9de_27_1.png)


  3. 点击 **Finish Enabling Lightning Experience** 以确认：


  ![](img/72d01bea5a9ccf02f9452aab7505d9de_28_0.png)


  4. 一旦 Lightning Experience 启用，请注意开关变为绿色，标签更改为 **Enabled**：


  ![](img/72d01bea5a9ccf02f9452aab7505d9de_28_1.png)


  5. 点击右上角的姓名；您会注意到添加了一个新菜单 **Switch to Lightning Experience**，如下图所示：


  ![](img/72d01bea5a9ccf02f9452aab7505d9de_29_0.png)


  6. 完成！现在从菜单中点击 **Switch to Lightning Experience** 开始探索现代的 Lightning Experience。

  7. 此动手练习将允许您作为系统管理员（包括其他系统管理员）尝试并探索贵组织的 Lightning Experience。您的普通用户在您为他们配置之前将看不到新的菜单
  **Switch to Lightning Experience**。

  8. 要为业务用户启用 Lightning Experience，作为系统管理员，您可以选择按配置文件启用（针对该配置文件中的所有用户）或按权限集启用（按用户分配）。

  9. 要按配置文件启用，点击配置文件上的 **Edit**，滚动到 **Administrative Permissions** 部分，查找 **Lightning
  Experience User** 权限；启用它，然后保存配置文件。

  10. 要按权限集启用，相同的权限 **Lightning Experience User** 分配给需要切换到 Lightning Experience 的特定用户。


  系统管理员的最佳实践是在为所有 Salesforce 用户启用之前先评估 Lightning Experience，并找出切换到 Lightning Experience
  时可能无法工作的功能的差距。在启用 Lightning Experience 用户之前，另一个最佳实践是仅为一组试点用户启用，获取他们在使用 Salesforce
  作为日常工作一部分时的反馈。如果用户具有不同类型的配置文件，权限集将是选项。





  Salesforce 提供一个工具来帮助你检查组织对 Lightning Experience 的准备情况。在 Lightning Experience 设置菜单中，点击“检查你的
  Lightning Experience 就绪情况”下的 **评估（Evaluate）** 链接。Salesforce 将把一份就绪情况报告通过电子邮件发送给你。


