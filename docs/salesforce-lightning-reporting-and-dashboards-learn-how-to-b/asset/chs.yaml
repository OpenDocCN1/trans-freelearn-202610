  \ | Johan Yu（10条记录） | United Oil & Gas, Singapore | 客户 - 直接 | 5/24/2014 |\n| 2014年（12条记录）\
  \ | Johan Yu（10条记录） | Edge Communications | 客户 - 直接 | 5/24/2014 |\n| 2014年（12条记录）\
