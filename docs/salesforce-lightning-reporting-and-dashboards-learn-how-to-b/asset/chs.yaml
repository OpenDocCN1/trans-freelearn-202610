  \ Salesforce 用户使用。借助 Salesforce1 平台的强大功能，您现在可以自定义和构建任何应用程序，并通过 Salesforce1 应用程序即时部署该功能。最棒的是，对于客户来说，此应用程序可免费使用——您只需输入您的\
  \ Salesforce 用户名和密码即可。\n\n我们不会详细介绍 Salesforce1 应用程序：安装、权限、配置、通知、操作、审批、事件和导航。但我们将深入讨论诸如使用\
