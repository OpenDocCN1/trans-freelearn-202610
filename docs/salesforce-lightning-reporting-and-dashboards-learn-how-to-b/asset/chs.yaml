  \ | Customer - Direct | $0.00 | |\n|  | University of Arizona | Customer - Direct\
  \ | $100,000.00 | |\n| Subtotal |  |  | $855,000.00 | $855,000.00 |\n| GRAND TOTAL\
  \ (17 RECORDS) |  |  | $1,250,000.00 | $1,250,000.00 |\n\n在这种情况下，除非您需要隐藏每个商机的金额而只获取总计，否则无需创建汇总公式。本次实操中的示例并未展示报表公式汇总的真正威力；除了正常的汇总字段外，我们无法对其进行配置，并且它将始终在所有层级显示。让我们在下一个实操练习中查看汇总公式的更好用法。\n\
  \n## 使用汇总公式的实操练习\n\n让我们考虑一个用例：在 **Summary** 报表中，在所有汇总层级添加 **Total Amount of Closed\
  \ Opportunities**。假设已在 Account 中从 Opportunity 创建了名为 **Total Amount of Opportunities**\
  \ 和 **Total Amount of Open Opportunities** 的汇总求和字段，并且 **Total Amount of Open Opportunities**\
  \ 字段的详细信息已在之前的实操中讨论过，以下是 **Total Amount of Opportunities** 的汇总求和字段详细信息：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_178_0.png)\n\
  \n- 1. 创建一个新的自定义汇总公式字段，类似于我们在之前的实操练习中创建的，并将其命名为 `Total_Closed_Opportunities`，公式为：`Account.Total_Amount_of_Opportunities__c:SUM\
  \ - Account.Total_Amount_of_Open_Opportunities__c:SUM`\n\n2. 为了澄清本次练习，让我们在报表中添加\
  \ Total Amounts of Opportunities 和 Total Amount of Open Opportunities 汇总求和字段，然后使用\
  \ Sum 对其进行汇总。请考虑以下截图：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_179_0.png)\n\n\
  3. 在前面的报表中，Total Amount of Closed Opportunity（汇总公式）等于 Total Amount of Opportunity（汇总求和字段）减去\
  \ Total Amount of Open Opportunity（汇总求和字段）。我们在汇总公式之间使用 Subtract 运算符，我们也可以将此技术用于其他公式：\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_179_1.png)\n\n## 高级报表配置\n\n如果您注意到 **Custom\
  \ Summary Formula** 编辑器中 **Formula** 右侧的区域，有许多函数可用于增强您的公式；它们被归类为 **All, Logical,\
  \ Math,** 和 **Summary**。我们不会讨论每个可用函数，但让我们在下一节中看一个示例。\n\n## 使用 IF() 函数\n\nIF() 函数归类在\
  \ Logical 函数下，此公式的语法为 **IF(logical_test, value_if_true, value_if_false)**。\n\n此函数检查条件是否返回\
  \ true。如果是，它将返回定义的第一值；否则，它将返回第二值，例如，`IF(RowCount > 4, WON:SUM, CLOSED:SUM)`。\n\n\
  如果记录数超过四行，此公式将返回 WON 商机的总数；否则，它将返回 CLOSED 商机的总数。WON 和 CLOSED 可从 Opportunity 报表类型获得。\n\
  \n您不必真正输入 `WON:SUM` 和 `CLOSED:SUM` 或您想要使用的其他字段，但从 **Custom Summary Formula** 窗口，导航到\
  \ **Summary Fields | <field name> | Sum**。\n\n一旦您点击 **Sum**，它将自动填充到公式中；只需确保将光标放在公式编辑器中即可。\n\
  \n\n\n\n\n## 高级报表配置\n\n让我们使用前述公式查看报表结果：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_181_0.png)\n\
  \n让我们分析前述报表；**Check Count** 是一个汇总公式：\n\n- 对于 **OPPORTUNITY OWNER Alvin Lee**，由于有四条记录，公式将返回\
  \ **Alvin Lee** 的已关闭商机数量，为 2。在此练习中，一个商机为 **Won**，一个商机为 **Lost**。\n- 对于 **OPPORTUNITY\
  \ OWNER Johan Yu**，有五条记录；公式将返回 **Johan Yu** 的获胜商机数量，为 4。\n- 对于 **GRAND TOTAL**，总记录数为九；公式将返回总的获胜商机数量，为\
  \ 5：其中 **Alvin Lee** 的一个商机和 **Johan Yu** 的四个商机。\n\n## 使用 MAX() 函数\n\nMAX 函数被归类为数学函数；此公式的语法为\
  \ MAX(number,number,...)。\n\n此函数返回所有参数中的最大值，例如，\n\n```\nMAX(Opportunity.Projected_Revenue__c:SUM,\
  \ AMOUNT:SUM).\n```\n\n与前面解释的 IF() 函数相同；你只需点按即可获取前述公式填充。在此示例中，我们使用商机报表类型，MAX() 函数通过比较名为\
  \ PROJECTED REVENUE 的自定义字段的合计与 AMOUNT 的合计来返回最大值。示例报表如下所示：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_182_0.png)\n\
  \n让我们分析前述报表；MAX AMOUNT 是一个汇总公式：\n\n- 我们将 MAX AMOUNT 汇总字段设置为仅在分组级别显示，因此它不会在 GRAND\
  \ TOTAL 中显示\n- 因为这是一个汇总公式，它不会在记录级别比较 **AMOUNT** 值与 **PROJECTED REVENUE** 值，而只在 **Summary**\
  \ 中比较\n- 对于 **OPPORTUNITY OWNER** Alvin Lee，**AMOUNT** 大于 **PROJECTED REVENUE**，因此\
  \ **MAX AMOUNT** 等于 **AMOUNT**\n- 对于 **OPPORTUNITY OWNER** Johan Yu，**PROJECTED\
  \ REVENUE** 大于 **AMOUNT**，因此 **MAX AMOUNT** 等于 **PROJECTED REVENUE**。\n\n## 函数公式\n\
  \nSalesforce 中有两种仅在汇总公式中可用且被认为是最强大的报表公式的功能。它们被归类在汇总函数下：`PARENTGROUPVAL` 和 `PREVGROUPVAL`。\n\
  \n### PARENTGROUPVAL() 函数\n\n`PARENTGROUPVAL()` 函数返回指定分组的值；分组级别高于公式显示级别。\n\n公式语法取决于报表格式：\n\
  \n- 在 **Summary** 和 **Joined** 报表中：*PARENTGROUPVAL(summary_field, grouping_level)*\n\
  - 在 **Matrix** 报表中：*PARENTGROUPVAL(summary_field, parent_row_grouping, parent_column_grouping)*\n\
  \n### 在汇总报表中使用 PARENTGROUPVAL() 函数\n\n对于 **Summary** 报表，当你选择公式显示为 **All summary\
  \ levels** 或 **Grand summary only** 时，`PARENTGROUPVAL()` 函数不适用。只能显示为字段分组的公式可以使用此函数。\n\
  \n接下来，我们需要为两个参数 **Summary Fields** 和分组级别填充值。让我们从分组级别参数开始；我会告诉你为什么我先从分组级别而不是 **Summary\
  \ Fields** 参数开始。\n\n## 高级报表配置\n\n让我们通过一个动手练习来填充参数；在本次练习中，我们有一个 **Summary** 报表，有两个字段分组级别；第一级是\
  \ **OPPORTUNITY OWNER**，第二级是 **TYPE**：\n\n1. 确保你选择公式显示为字段分组，而不是所有汇总或总汇总；因为报表有两个字段分组级别，我们将有两个选项。它们是\
  \ **Grouping 1: Opportunity Owner** 和 **Grouping 2: Type**；让我们为本次练习选择 **Grouping\
  \ 2: Type**。\n2. 将鼠标放在 **Formula** 编辑器中并从下拉菜单中选择 **PARENTGROUPVAL** 函数。\n3. 如果汇总报表中只有一个字段分组级别，父\
  \ grouping_level 参数始终为 **GRAND_SUMMARY**，而如果像本次练习中那样有多个级别（两个分组级别），我们将有 **GRAND_SUMMARY**\
  \ 和第一个分组级别的字段名称作为父分组级别的选项，在我们的练习中为 Opportunity Owner。\n4. 当公式显示选择为第二级分组时，父分组级别中的第一级分组的字段名称将被启用。简而言之，父分组级别的可用性比所选公式显示高一个级别。比较以下截图；第一张是在选择\
  \ **Grouping 2: Type** 时：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_184_0.png)\n\
  \n将其与以下截图进行比较。当选择 **Grouping 1: Opportunity Owner** 时，**Opportunity Owner** 在父分组级别中变为禁用：\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_185_0.png)\n\n5. 让我们为本次练习选择 **Grouping\
  \ 2: Type** 并从单选按钮中选择 **Opportunity Owner** 作为父分组级别。\n6. 单击 **< Insert** 按钮，你将在我们的示例中获得公式添加：**PARENTGROUPVAL(summary_field,\
  \ FULL_NAME)**。\n7. 删除 **summary_field** 文本并将其更改为正确的字段汇总。要填充 **summary_field** 参数，将光标放在逗号前，单击\
  \ **Summary Fields**，选择你想要使用的字段名称（例如 **Amount**），并选择操作（例如 **Sum**）。现在你的公式应为 *PARENTGROUPVAL(AMOUNT:SUM,\
  \ FULL_NAME)*。\n\n以下是最终公式。查看以下截图中分组级别之间的关系箭头：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_186_0.png)\n\
  \n接下来，让我们创建一个新的汇总报表：\n\n1. 按 CLOSE DATE 对报表进行分组（按日历月分组日期），然后按 Opportunity Owner\
  \ 分组。\n2. 添加一个汇总公式并命名为 Amount by Close Date；添加此公式并在 Opportunity Owner（Grouping 2）处显示，公式为\
  \ PARENTGROUPVAL(AMOUNT:SUM, CLOSE_DATE):。\n3. 将创建的汇总公式添加到报表中。\n4. 添加 Amount 字段并将其汇总为\
  \ Sum。这在以下截图中显示：\n\n## 高级报表配置\n\n| CLOSE DATE | OPPORTUNITY OWNER | OPPORTUNITY\
  \ NAME | AMOUNT Sum | AMOUNT BY CLOSE DATE |\n|---|---|---|---|---:|---:|\n| June\
  \ 2016 (3 records) | Alvin Lee (1 record) | Pyramid Emergency Generators | $100,000.00\
  \ | |\n|  |  | Subtotal | $100,000.00 | $265,000 |\n|  | Johan Yu (2 records) |\
  \ Element Stage 1A | $85,000.00 | |\n|  |  | Element Stage 1B | $80,000.00 | |\n\
  |  |  | Subtotal | $165,000.00 | $265,000 |\n| Subtotal |  |  | $265,000.00 | -\
  \ |\n| July 2016 (3 records) | Alvin Lee (1 record) | Element Phase IIa | $38,000.00\
  \ | |\n|  |  | Subtotal | $38,000.00 | $213,000 |\n|  | Johan Yu (2 records) | Project\
  \ Motor Head | $100,000.00 | |\n|  |  | Project Motor Links in Kentica | $75,000.00\
  \ | |\n|  |  | Subtotal | $175,000.00 | $213,000 |\n| Subtotal |  |  | $213,000.00\
  \ | - |\n| GRAND TOTAL (6 RECORDS) |  |  | $478,000.00 | - |\n\n让我们从截图中分析报表：\n\n\
  - **在 2016 年 6 月**，Total Amount 为 **$265,000.00**。我们看到此值与汇总公式的值相同；这意味着汇总公式的值来自上一级，即\
  \ Close Date 的小计。\n- **在 2016 年 7 月**，Total Amount 为 **$213,000.00**，与汇总公式中的值相同。\n\
  - 公式的值将在报表中 **Opportunity Owner**（即第 2 级）分组中可用，父分组级别为 **CLOSE_DATE**。\n\n接下来，让我们在同一报表中创建另一个类似的公式：\n\
  \n1. 名称为 **Amount by Grand Total**。\n2. 选择并在 **Opportunity Owner (Grouping 2)**\
  \ 处显示汇总公式。\n3. 将父分组级别选择为 **Grand summary**。\n4. 公式为 *PARENTGROUPVAL(AMOUNT:SUM,\
  \ GRAND_SUMMARY)*。\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_188_0.png)\n\n让我们分析前述截图：\n\
  \n- 请注意，汇总公式值与 **GRAND TOTAL** 的值相同。\n- 汇总公式显示在 **Opportunity Owner** 分组中，即我们配置的\
  \ Grouping 2，值是从 **GRAND_SUMMARY** 复制的（这是 Opportunity Owner 层次结构中上两级）。\n- 然而，如果你将公式更改为在\
  \ **Close Date**（Grouping 1）中显示，值将与 **GRAND TOTAL** 相同（这是 Close Date 上一级）。参考以下截图：\n\
  \n\n\n\n\n# 高级报表配置\n\n| CLOSE DATE | OPPORTUNITY OWNER | OPPORTUNITY NAME | AMOUNT\
  \ Sum | AMOUNT BY CLOSE DATE | AMOUNT BY GRAND TOTAL |\n|---|---|---|---|---:|---:|---:|\n\
  | June 2016<br>(3 records) | Alvin Lee<br>(1 record) | Pyramid Emergency Generators\
  \ | $100,000.00 |  |  |\n|  |  | Subtotal | $100,000.00 | $265,000 | - |\n|  | Johan\
  \ Yu<br>(2 records) | Element Stage 1A | $85,000.00 |  |  |\n|  |  | Element Stage\
  \ 1B | $80,000.00 |  |  |\n|  |  | Subtotal | $165,000.00 | $265,000 | - |\n| Subtotal\
  \ |  |  | $265,000.00 | - | $478,000.00 |\n| July 2016<br>(3 records) | Alvin Lee<br>(1\
  \ record) | Element Phase IIa | $38,000.00 |  |  |\n|  |  | Subtotal | $38,000.00\
  \ | $213,000 | - |\n|  | Johan Yu<br>(2 records) | Project Motor Head | $100,000.00\
  \ |  |  |\n|  |  | Project Motor Links in Kentica | $75,000.00 |  |  |\n|  |  |\
  \ Subtotal | $175,000.00 | $213,000 | - |\n| Subtotal |  |  | $213,000.00 | - |\
  \ $478,000.00 |\n| GRAND TOTAL<br>(6 RECORDS) |  |  | $478,000.00 |  |  |\n\n从前面的示例中，我们可以很容易理解\
  \ `PARENTGROUPVAL()` 函数会从一个或多个更高层级获取汇总值，这也是它被称为 **父组值** 的原因。\n\n接下来，让我们将 `PARENTGROUPVAL()`\
  \ 函数用于实际操作中；我们希望了解每个月机会总额占总体的百分比。当然，没有自定义汇总公式是做不到的，这里是报表结果：\n\n| CLOSE DATE | OPPORTUNITY\
  \ OWNER | RECORD COUNT | AMOUNT Sum | % OF TOTAL |\n|---|---|---:|---:|---:|\n|\
  \ June 2016 | Alvin Lee | 1 | $100,000.00 | - |\n|  | Johan Yu | 2 | $165,000.00\
  \ | - |\n| Subtotal |  | 3 | $265,000.00 | 55.44% |\n| July 2016 | Alvin Lee | 1\
  \ | $38,000.00 | - |\n|  | Johan Yu | 2 | $175,000.00 | - |\n| Subtotal |  | 3 |\
  \ $213,000.00 | 44.56% |\n| GRAND TOTAL |  | 6 | $478,000.00 | - |\n\n**June 2016**\
  \ 的小计为 **55.44%**；这是通过 *265,000 / 478,000*100* 计算得出的。**July 2016** 同理，为 **44.56%**，计算方式为\
  \ *213,000 / 478,000*100*。其背后的公式非常简单，与我们之前使用过的公式并没有太大区别：*AMOUNT:SUM / PARENTGROUPVAL(AMOUNT:SUM,\
  \ GRAND_SUMMARY)*；简而言之，该公式会将月度小计除以 **GRAND TOTAL**。\n\n# 在矩阵报表中使用 PARENTGROUPVAL()\
  \ 函数\n\n在 **Matrix** 报表中，此函数的语法为 *PARENTGROUPVAL(summary_field, parent_row_grouping,\
  \ parent_column_grouping)*。\n\n与 **Summary** 报表相同；当你选择公式显示为 **All summary levels**\
  \ 时，`PARENTGROUPVAL()` 函数不适用。该函数仅在选择 **At a specific row/column grouping level...**\
  \ 时适用。\n\n**Summary** 报表中的分组层级参数在 **Matrix** 报表中被拆分为两个参数：**parent_row_grouping and\
  \ parent_column_grouping**。\n\n让我们创建一个新的 Opportunity 报表，采用 **Matrix** 格式，按 **Close\
  \ Date** 过滤为 3 个月，然后按 **Calendar Month (column)** 和 **Stage (row)** 分组。参考以下截图：\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_190_0.png)\n\n让我们考虑一个用例：我们希望了解每个阶段占 GRAND\
  \ TOTAL 的百分比：\n\n- 1. 创建一个名为 Total Amount 的公式汇总并显示在 Column Grand Summary 中。参考以下截图：\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_191_0.png)\n\n不必担心如何获取参数的关键字；参考前面 Summary\
  \ 报表中 PARENTGROUPVAL () 的动手练习；当你点击 < Insert 按钮时，关键字会自动填充；然后，将 AMOUNT:SUM 添加为 summary_field。运行报表，你应该会看到与以下截图类似的报表：\n\
