  \ |  | $50,000.00 |  | $265,000.00 |  | $645,000.00 |  |\n\n这里的 TOTAL AMOUNT 列意义不大；它只是将\
  \ GRAND TOTAL 复制到每个阶段的 TOTAL AMOUNT 中，而我们希望了解每个阶段占 GRAND TOTAL 的百分比。\n\n- 2. 编辑报表并更改汇总公式：\n\
