  \n\n\n## Salesforce1 移动应用中的仪表板和报告\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_371_0.png)\n\
  \n至少，你需要拥有“运行报告”权限才能打开仪表板，同时还需要拥有访问仪表板文件夹的权限，这与从网页打开仪表板所需的条件相同。\n\nSalesforce1 应用中仪表板的菜单可见性不依赖于用户配置文件中的选项卡设置。点击仪表板菜单后，会打开你最近打开过的仪表板列表。\n\
