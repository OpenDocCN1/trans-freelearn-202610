  \ | $0.00 |  | $0.00 |  | $100,000.00 |  | $100,000.00 |  |\n| Id. Decision Makers\
  \ | $0.00 |  | $50,000.00 |  | $0.00 |  | $50,000.00 |  |\n| Closed Won | $60,000.00\
  \ |  | $0.00 |  | $85,000.00 |  | $145,000.00 |  |\n| Closed Lost | $270,000.00\
  \ |  | $0.00 |  | $0.00 |  | $270,000.00 |  |\n| Total | $330,000.00 | 51.16% |\
  \ $50,000.00 | 7.75% | $265,000.00 | 41.09% | $645,000.00 |  |\n\n该报表显示了每个月的总金额占\
  \ **GRAND TOTAL** 的百分比。\n\n# PREVGROUPVAL() 函数\n\nPREVGROUPVAL() 函数返回同一层级层次结构中前一个分组的值。这使你能够准备显示例如月度机会对比的报表；与\
  \ PARENTGROUPVAL() 函数的主要区别在于返回值的层级更高。\n\nPARENTGROUPVAL() 函数的公式语法适用于所有报表格式：\n\n\
  *PREVGROUPVAL(summary_field, grouping_level [, increment]).*\n\n获取 PARENTGROUPVAL()\
  \ 函数公式参数的导航和提示与获取 PARENTGROUPVAL() 函数的几乎没有区别。语法中唯一的区别是增加了一个可选参数 **incremental**。如果我们跳过此参数，它将使用默认值\
  \ 1。increment 是当前汇总之前列或行的数量；**minimum** 和默认值是 1，而最大值是 12。\n\n虽然语法与 PARENTGROUPVAL()\
  \ 函数几乎相似，但功能完全不同。两个函数服务于不同的目的，使我们的报表更加强大。\n\n与 PARENTGROUPVAL() 函数相同；当你选择显示此公式为：At\
  \ **All summary levels, Grand summary only** 时，此函数不适用。它仅适用于 **Summary** 报表中的字段级分组，以及\
  \ **Matrix** 报表中的 **specific row/column grouping level**。\n\n\n\n\n\n## 在摘要报告中使用\
  \ PREVGROUPVAL() 函数\n\n要获取 PREVGROUPVAL() 函数中参数的关键字，请执行以下步骤：\n\n- 从下拉函数菜单中选择 **PREVGROUPVAL**。\n\
  - 对于**摘要**报告，就像 **PARENTGROUPVAL** 一样，您可以在符合条件的分组级别下选择字段；如果您有多个分组级别，我们将在后面的动手练习中详细介绍。\n\
  - 点击**插入**按钮；您将获得使用所选参数创建的公式，例如 `PREVGROUPVAL(summary_field, CLOSE_DATE)`。\n- 点击**汇总字段**，然后选择您想要的字段和操作，例如\
  \ **AMOUNT:SUM**。\n- 当您点击**插入**按钮时，增量参数默认不会被添加；您可以在需要时手动添加。\n\n让我们创建一个**摘要**报告：\n\
  \n- 1. 使用**机会**报告类型。\n- 2. 按**阶段**和**关闭日期**分组（按**日历月**对日期分组）。\n- 3. 添加汇总公式，并将其命名为“上月赢单”，公式如下：`PREVGROUPVAL(AMOUNT:SUM,\
  \ CLOSE_DATE)`。\n- 4. 在本练习中，我将过滤报告，仅显示 **关闭日期** 在两个月内的机会；这只是为了简化，以减少报告中的数据。详情请参见以下截图：\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_195_0.png)\n\n- 5. 将汇总公式添加到摘要报告。\n- 6.\
  \ 添加“金额”字段并使用“求和”汇总。您将看到类似以下报告的内容：\n\n| 阶段 ↑ | 关闭日期 ↑ | 机会名称 ↑ | 金额 求和 | 上月赢单 |\n\
  |---|---|---|---|---|\n| 发掘 | 2016 年 5 月 | Element Stage 1A | $85,000.00 |  |\n\
  |  |  | Grand Hotels Kitchen Generator | $15,000.00 |  |\n|  | 小计 |  | $100,000.00\
  \ | - |\n|  | 2016 年 6 月 | Element Stage 1B | $80,000.00 |  |\n|  | 小计 |  | $80,000.00\
  \ | $100,000.00 |\n| 小计 |  |  | $180,000.00 | - |\n| 资格认定 | 2016 年 6 月 | Pyramid\
  \ Emergency Generators | $90,000.00 |  |\n|  | 小计 |  | $90,000.00 | $80,000.00 |\n\
  | 小计 |  |  | $90,000.00 | - |\n| 确定决策者 | 2016 年 5 月 | Edge Emergency Generator |\
  \ $35,000.00 |  |\n|  | 小计 |  | $35,000.00 | $90,000.00 |\n| 小计 |  |  | $35,000.00\
  \ | - |\n\n让我们分析一下前面的报告：\n\n- 第一个小计是 2016 年 5 月的发掘；总计小计为 $100,000.00，因为这是第一个分组，所以\
  \ `PREVGROUPVAL()` 函数没有返回值。\n- 第二个小计是 2016 年 6 月的发掘；总计小计为 $80,000.00。现在 `PREVGROUPVAL()`\
  \ 函数将指向第一个分组，金额为 $100,000.00。\n- 第三个小计是 2016 年 6 月的资格认定；总计小计为 $90,000.00。`PREVGROUPVAL()`\
  \ 函数将指向第二个分组，金额为 $80,000.00。\n- 第四个小计是 2016 年 5 月的确定决策者；总计小计为 $35,000.00。`PREVGROUPVAL()`\
  \ 函数将指向第三个分组，金额为 $90,000.00。\n\n我们刚才看到的基于分组顺序，而不是基于分组的数值。\n\n让我们对现有报告的公式做一个小的更改，从\
  \ `PREVGROUPVAL(AMOUNT:SUM, CLOSE_DATE)` 改为 `PREVGROUPVAL(AMOUNT:SUM, STAGE_NAME)`，见以下截图：\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_197_0.png)\n\n这是生成的报告；请与之前的结果进行比较：\n\n\
  | 阶段 ↑ | 关闭日期 ↑ | 机会名称 ↑ | 金额 求和 | 上月赢单 |\n|---|---|---|---:|---:|\n| 发掘<br>（3 条记录）\
  \ | 2016 年 5 月<br>（2 条记录） | Element Stage 1A | $85,000.00 |  |\n|  |  | Grand Hotels\
  \ Kitchen Generator | $15,000.00 |  |\n|  | 小计 |  | $100,000.00 | - |\n|  | 2016\
  \ 年 6 月<br>（1 条记录） | Element Stage 1B | $80,000.00 |  |\n|  | 小计 |  | $80,000.00\
  \ | - |\n| 小计 |  |  | $180,000.00 | - |\n| 资格认定<br>（1 条记录） | 2016 年 6 月<br>（1 条记录）\
  \ | Pyramid Emergency Generators | $90,000.00 |  |\n|  | 小计 |  | $90,000.00 | $180,000.00\
  \ |\n| 小计 |  |  | $90,000.00 | - |\n| 确定决策者<br>（1 条记录） | 2016 年 5 月<br>（1 条记录） |\
  \ Edge Emergency Generator | $35,000.00 |  |\n|  | 小计 |  | $35,000.00 | $90,000.00\
  \ |\n| 小计 |  |  | $35,000.00 | - |\n\n这里的不同之处在于，前一个分组的值将来自**阶段小计**，而不是**关闭日期小计**，如之前的报告所示。\n\
  \n接下来，让我们使用之前的公式并添加一个值为 2 的增量参数；公式从 `PREVGROUPVAL(AMOUNT:SUM, CLOSE_DATE)` 改为 `PREVGROUPVAL(AMOUNT:SUM,\
  \ CLOSE_DATE, 2)`。以下截图显示了一个带有 `PREVGROUPVAL` 公式的**摘要**报告：\n\n## 在矩阵报告中使用 PREVGROUPVAL()\
  \ 函数\n\n让我们在矩阵报告中使用 PREVGROUPVAL() 函数。\n\n我们想知道每个月的**总金额**增长百分比：\n\n- 1. 创建一个**矩阵**报告，并按**关闭日期**（按**日历月**）作为行分组，**阶段**作为列分组。\n\
  - 2. 移除**计数**，并隐藏**详细信息**。仅筛选**未结**和**已赢得**的机会。\n- 3. 创建一个名为 `Month by Month`（逐月）的公式汇总；将其分组为**关闭日期**（按**日历月**）和**列总计**。\n\
  - 4. 将汇总格式设置为**百分比**，保留两位小数。\n- 5. 输入以下公式：`(AMOUNT:SUM - PREVGROUPVAL(AMOUNT:SUM,\
  \ CLOSE_DATE)) / PREVGROUPVAL(AMOUNT:SUM, CLOSE_DATE)`\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_200_0.png)\n\
  \n## 高级报告配置\n\n汇总公式将添加到每个月的金额小计旁边；从这里，我们可以轻松查看逐月百分比，并看到所有未结和已赢得的机会的百分比都在增长：\n\n\
  | 关闭日期 | 资格认定 金额求和 | 资格认定 逐月 | 确定决策者 金额求和 | 确定决策者 逐月 | 已赢得 金额求和 | 已赢得 逐月 | 总计 金额求和\
  \ | 总计 逐月 |\n|---|---:|---:|---:|---:|---:|---:|---:|---:|\n| 2016 年 3 月 | $0.00\
  \ |  | $15,000.00 |  | $22,000.00 |  | $37,000.00 | - |\n| 2016 年 4 月 | $27,000.00\
  \ |  | $0.00 |  | $40,000.00 |  | $67,000.00 | 81.08% |\n| 2016 年 5 月 | $55,000.00\
  \ |  | $50,000.00 |  | $0.00 |  | $105,000.00 | 56.72% |\n| 2016 年 6 月 | $80,000.00\
  \ |  | $10,000.00 |  | $0.00 |  | $90,000.00 | -14.29% |\n| 总计 | $162,000.00 | \
  \ | $75,000.00 |  | $62,000.00 |  | $299,000.00 |  |\n\n请注意，2016 年 3 月的公式中没有显示任何值，因为它是第一个值。**2016\
  \ 年 4 月**与上一个分组（即 **2016 年 3 月**）相比增长了 **81.08%**。**2016 年 5 月**与 **2016 年 4 月**相比增长了\
  \ **56.72%**，而最后一个分组与上一个分组相比下降了 **-14.29%**。如前所述，`PREVGROUPVAL()` 函数无法获知上一个分组的值。在此示例中，它显示良好只是因为报告中没有任何跳过的月份。\n\
  \n## 总结\n\n在本章中，我们详细探讨了分桶字段和**自定义汇总公式**。通过分桶字段，我们可以为报告目的对数据进行分类，而无需对对象中的字段进行任何操作。如果某个字段仅用于一两个报告，这将消除管理员创建自定义字段的需求。但是，分桶字段并非用于替代公式字段；您不能在分桶字段中进行公式计算；您可以使用它将值分组到一个分桶中。\n\
  \n分桶字段仅适用于某些字段类型，不同的字段类型将为分桶值配置不同的方式；您可以将范围用于货币、数字和百分比，但不能用于其他类型。\n\n**自定义汇总公式**与自定义公式字段不同。您无法使用**自定义汇总公式**从另一个对象检索值，而且**自定义汇总公式**仅存在于该报告中；它不影响其他报告、对象或字段，并且您不能从其他报告中使用它。\n\
  \n**自定义汇总公式**在**表格**报告类型中不可用，并且当您更改带有汇总公式的报告类型时，现有的汇总公式将被删除，因此请注意这一点。\n\n**自定义汇总公式**中有许多可用的函数；值将仅以数字、货币或百分比形式返回，并且您可以配置返回的小数位数。该公式仅接受有限的字段类型集，但其中包括公式字段和汇总字段。\n\
  \n`PARENTGROUPVAL()` 和 `PREVGROUPVAL()` 函数仅在**自定义汇总公式**中可用。您无法在 Salesforce 中的任何其他公式中找到它们；它们是非常强大的函数。您可以使用\
  \ `PARENTGROUPVAL()` 函数从父级分组层次结构中检索分组值，并使用 `PREVGROUPVAL()` 函数从同一层次结构中检索上一个分组的值。\n\
  \n在下一章中，我们将讨论与报告相关的更多功能、向报告添加图表，以及将报告中的图表嵌入父记录页面。\n\n\n\n\n"
- "# 7\n\n## 在报表和页面中添加图表\n\n从第 4 章《创建和管理报表》开始，您学习了如何创建和管理报表，接着在第 5 章《了解报表类型》中继续学习了报表类型，然后在第\
  \ 6 章《高级报表配置》中使用了桶字段和自定义汇总公式。\n\n在本章中，我们将继续在报表中添加图表，并讨论 Salesforce Lightning 中可用的多种图表类型以及支持添加图表的报表格式类型，并通过一个动手练习来讲解在报表中添加和使用图表。\n\
  \n接下来，我们将讨论如何将报表中的图表添加到记录页面，例如在账户页面中与账户相关的商机或案例；此处的图表将按打开的账户进行筛选，我们还将涵盖对此的动手练习。\n\
  \n到本章结束时，您将完全掌握报表中图表类型的知识，并学会如何添加和编辑图表。您还将了解如何将报表中的图表添加到记录页面布局中。\n\n在本章中，我们将提供注释和提示来帮助您理解重要事项。以下主题将被涵盖：\n\
  \n- Lightning 报表中的图表类型\n- 向报表添加图表\n- 向记录页面添加嵌入式图表\n\n## 在报表和页面中添加图表\n\n每种图表格式都有其自己的额外功能，例如内联图表，您可以在堆叠条形图中启用累积值，可以将所有条形长度设置为\
  \ 100%，等等。\n\n让我们了解 Salesforce 中可用的每种图表类型。\n\n### 水平条形图\n\n水平条形图以水平长度显示值，因此此格式适合比较值。当\
  \ y 轴上有许多值时，选择水平条形图格式，例如基于每个销售代表的 **金额合计** 和 **NRR 金额合计** 的管道报表。如果我们有 20 名销售代表，图表仍然看起来不错且不会过于拥挤。\n\
  \n当您将鼠标悬停在图表上方时，它会显示条形的更详细信息，包括 x 轴值、y 轴值以及条形相对于总数的百分比。以下屏幕截图显示了水平条形图，以及将鼠标悬停在条形上时显示的信息弹出窗口：\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_205_0.png)\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_207_0.png)\n\
  \n使用堆叠条形图时，您将有将堆叠设置为 100% 的选项；启用后，所有条形将具有相同的长度。前述水平条形图如果修改为水平堆叠条形图，将如以下屏幕截图所示：\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_207_1.png)\n\n### 堆叠垂直条形图\n\n堆叠垂直条形图与堆叠水平条形图基本相同。它会将条形改为垂直，并交换\
  \ x 轴和 y 轴。以下屏幕截图与前一个相同，但为垂直堆叠条形图：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_208_0.png)\n\
  \n### 折线图\n\n折线图适用于显示某一项目在时间序列中的值变化。以下是按商机负责人分组的商机折线图示例：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_209_0.png)\n\
  \n您可以将折线图配置为显示累积值；当您想显示一段时间内项目的总数时，这是一个不错的选择。以下屏幕截图显示了具有累积值的折线图：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_210_0.png)\n\
  \n### 圆环图\n\n使用圆环图，用户可以一目了然地看到最大部分和最小部分；除此之外，它还显示总金额和每个组的金额，例如按阶段的管道报表及其总价值。就像堆叠条形图一样，当您将鼠标悬停在组上时，它会显示组名称和组金额。以下示例显示了按关闭日期月份分组的圆环图：\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_211_0.png)\n\n## 在报表和页面中添加图表\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_213_0.png)\n\
  \n### 向报表添加图表的动手练习\n\n在本练习中，我们将创建一个按商机 **阶段** 分组的 **商机** 报表，格式为 **汇总**。让我们逐步进行：\n\
  \n- 1. 导航到 **报表** 选项卡并点击 **新建报表** 按钮。\n- 2. 选择 **商机** 报表类型并点击 **商机** 类别下的加号。\n-\
  \ 3. 点击 **创建** 按钮继续。\n- 4. 将 **显示** 改为 **所有商机**。\n- 5. 将 **日期字段范围** 改为 **上财年**。\n\
  - 6. 点击 **删除所有列** 链接以清除添加到报表的所有默认字段，然后点击 **确定** 按钮确认。\n- 7. 将报表格式更改为 **汇总**。\n-\
  \ 8. 将以下字段拖入报表：**商机名称**、**金额** 和 **预期收入**。要快速找到字段名称，请在字段文本框中输入字段名称并双击该字段将其添加到报表中。\n\
  - 9. 将 **阶段** 字段拖到分组放置区。\n- 10. 使用 **求和** 汇总 **金额** 和 **预期收入**。\n- 11. 点击 **显示**\
  \ 然后点击 **详细信息** 以隐藏报表详细信息。\n- 12. 点击 **保存** 按钮并输入以下信息：\n  - 报表名称为 `Previous FY Opportunities\
  \ by Stage`\n  - 报表文件夹为 **我的个人自定义报表**\n  - 点击 **保存** 按钮\n  - 点击 **运行报表** 按钮\n- 13.\
  \ 您应该会看到与以下屏幕截图类似的内容；这是一个标准的 Salesforce 报表：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_214_0.png)\n\
  \n14. 现在我们将向此报表添加图表；点击报表名称旁上方右侧的饼图图标；默认情况下，它将生成一个水平条形图：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_215_0.png)\n\
  \n15. 如果您对该图表满意，请点击 **编辑** 按钮旁箭头下的 **保存**：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_216_0.png)\n\
  \n16. 让我们将此图表自定义为 **圆环** 图表。\n\n17. 点击齿轮图标，即图表右侧上方的那个，而不是 **编辑** 按钮旁的齿轮图标：\n  -\
  \ 在 **显示为** 下，选择 **圆环**。\n  - 添加 **图表标题** 为 `Previous FY Opportunity`。\n  - 在 **值**\
  \ 下，我们可以选择 **金额合计**、**预期收入合计** 和 **记录数**；请记住在步骤 10 中我们对两个字段都使用了求和；目前只需保留为 **金额合计**。\n\
  \  - 在 **按切片** 下，您可以通过点击颜色图标更改图表颜色。\n  - 默认情况下，**显示值** 已被勾选；让我们保持原样。\n  - 您可以选择将\
  \ **图例位置** 显示在右侧或底部。如以下屏幕截图所示：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_217_0.png)\n\
  \n18. 点击图表中的任意位置以显示结果。记得保存报表。这将包含我们刚刚配置的图表；否则，添加的图表将不会被保存，并且在您或他人将来打开报表时将不会存在。\n\
