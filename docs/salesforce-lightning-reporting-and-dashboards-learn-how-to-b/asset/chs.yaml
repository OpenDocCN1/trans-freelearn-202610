  \n15. 让我们打开一个 **Sales Executive Dashboard** 仪表板；你可以使用全局搜索搜索仪表板名称，或转到 **Dashboards**\
  \ 选项卡查找该仪表板。\n\n4. 将上述报表克隆为一个名为 `Expired Pipeline` 的新报表，将其存储到同一个报表文件夹 **Global Sales**\
  \ 中，并使用以下内容更新克隆的报表：\n\n   - 将 **Close Date** 筛选器更改为 **All Time**\n   - 添加 **Close\
  \ Date** 作为 **Field filter**，选择操作为 **less than**，筛选值为 **Today**，勾选 **Locked** 以锁定筛选器，然后点击\
  \ **OK** 按钮\n   - 从分组中移除 **Close Date**，但将其添加到报表中\n   - 保存报表\n\n5. 将 **Expired Pipeline**\
  \ 报表克隆为一个名为 `Won Opportunities (YTD) by Sales Rep` 的新报表，将其存储到同一个报表文件夹 **Global Sales**\
  \ 中，并使用以下内容更新克隆的报表：\n\n   - 将 **Opportunity Status** 更改为 **Closed Won**\n   - 将\
  \ **Close Date** 作为 **Field filter** 的操作更改为 **less or equal**，然后点击 **OK** 按钮\n \
  \  - 从分组中移除 **Stage**，然后添加 **Opportunity Owner** 作为分组\n   - 保存报表\n\n6. 将 **Won Opportunities\
  \ (YTD) by Sales Rep** 报表克隆为一个名为 `Won Opportunities (YTD) by Month` 的新报表，并将其存储到同一个报表文件夹\
  \ **Global Sales** 中。使用以下内容更新克隆的报表：\n\n   - 从分组中移除 **Opportunity Owner**，然后添加 **Close\
  \ Date** 作为分组，将 **Close Date** 分组更改为 **Calendar Month**\n   - 保存报表\n\n7. 将 **Won\
  \ Opportunities (YTD) by Month** 报表克隆为一个名为 `Lost Opportunities (YTD)` 的新报表，将其存储到同一个报表文件夹\
  \ **Global Sales** 中，并使用以下内容更新克隆的报表：\n\n   - 将 **Opportunity Status** 更改为 **Any**\n\
  \   - 添加 **Stage** 作为 **Field filter**，选择操作为 **equals**，筛选值为 **Closed Lost**，勾选\
  \ **Locked** 以锁定筛选器，然后点击 **OK** 按钮\n   - 从分组中删除 **Opportunity Owner**，然后添加 **Lost\
  \ Reason** 作为报表分组。**Lost Reason** 是一个自定义选项列表字段；在本练习中，你需要创建这个自定义字段或改用其他字段\n   - 保存报表\n\
  \n8. 现在，我们在 **Global Sales** 报表文件夹中存储了五个 **Summary** 报表。\n\n让我们使用之前准备的报表再添加几个组件：\n\
  \n1. 添加第三个组件：\n\n   - 使用报表 **Won Opportunities by Sales Rep (YTD)**\n   - 使用的 **Chart\
  \ Type** 为 **Horizontal Bar Chart**\n   - 将组件移动到第二个组件右侧\n\n2. 添加第四个组件：\n\n   - 使用报表\
  \ **Pipeline for 120 days by Stage**\n   - 使用的 **Chart Type** 为 **Horizontal Bar\
  \ Chart**\n   - 在 **Y-Axis** 上选择 **Close Date**，并选择 **Sort Rows By Label Ascending**\n\
  \   - 由于报表有两个分组，默认情况下图表中也会有两个分组。将图表大小调整为 5x7 个网格。将图表放大是为了在未来几个月更好地可视化销售管道阶段\n\n\
  3. 添加第五个组件：\n\n   - 使用报表 **Expired Pipeline**\n   - 使用的 **Chart Type** 为 **Horizontal\
  \ Bar Chart**\n   - 在 **X-Axis** 上选择 **Record Count**，并选择 **Sort Rows By Label Ascending**\n\
  \   - 添加 **Subtitle** 为 **This needs to be clean!**，并将 **Footer** 设置为 **No record\
  \ should be here**\n   - 将组件移动到第四个组件右侧，并将图表大小设置为 4x4 个网格\n\n4. 添加第六个组件：\n\n   -\
  \ 使用报表 **Lost Opportunities (YTD)**\n   - 使用的 **Chart Type** 为 **Donut**\n   - 将组件移动到第五个组件下方，并将图表大小设置为\
  \ 2x3 个网格\n\n5. 保存仪表板。\n\n### 让我们看看现在的效果：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_321_0.png)\n\
  \n从这个仪表板中，有很多项目需要管理，销售经理需要重点关注和处理：\n\n1. 销售年初至今完成目标的 53%；我们需要再赢得至少 47% 的赢单机会。\n\n\
  2. 三月份和四月份的销售业绩不佳。\n\n3. 为排行榜顶部的销售代表颁发奖金，并为排行榜底部的销售代表提供指导。\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_323_0.png)\n\
  \n### 添加动态仪表板\n\n将仪表板启用为动态仪表板非常简单，只要您拥有所需的权限，并且尚未用完分配给您组织的动态仪表板数量：\n\n1. 编辑仪表板。\n\
  2. 点击齿轮图标编辑仪表板属性。\n3. 在 **View Dashboard As** 选项中，选择 **The logged-in user**，并启用\
  \ **Allow dashboard viewers to change this (dynamic dashboard)**。\n4. 保存仪表板。\n\n\
  刷新仪表板，现在您应该会在报表名称下方的 **Viewing as** 旁边看到 **Change** 链接。通过此功能，销售经理可以将仪表板查看者用户更改为经理角色层级下的任何销售代表。\n\
  \n### 总结\n\n本章对本书中的仪表板部分进行了总体收尾。我们首先实现了仪表板筛选器，以便一个仪表板可用于多种场景，而不是为每个条件创建一个仪表板。\n\n\
  接着，我们深入探讨了动态仪表板，了解了它们与普通仪表板的区别，介绍了如何创建动态仪表板，最后讨论了使用动态仪表板的限制。\n\n我们介绍了仪表板中与仪表板筛选器和报表筛选器相关的下钻选项，并解释了如何从\
  \ AppExchange 获取预构建的仪表板，无论是免费的还是付费的。在本章的最后一个主题中，我们从零开始构建了一个完整的示例仪表板，使用了报表、仪表板组件、仪表板筛选器，并启用了动态仪表板。\n\
  \n在下一章中，我们将讨论与报表和仪表板相关的高级技巧和窍门，这些内容可能对您在 Salesforce 中创建出色的分析非常有用。\n\n\n\n\n\n##\
  \ 利用 Chatter 开展报表和仪表板的协作\n\nSalesforce 在系统中提供了 **Chatter** 作为协作平台，类似于 Facebook，你可以发布消息、照片等内容。你还可以创建群组并在群组内进行协作。此外，通过\
  \ **Chatter 流**，你可以在记录级别与其他用户协作，例如**客户**、**商机**以及其他对象，其中就包括报表和仪表板。\n\n### 在报表中启用协作\n\
  \n你可以在报表中使用 **Chatter 流**与团队协作，例如，让团队关注销售管道报表或其他报表。\n\n让我们回顾一下打开报表时可用的项目——在“筛选器”旁边有一个名为“协作”的图标，如下面的截图所示：\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_326_0.png)\n\n由于这只是 Chatter 帖子或投票，你可以使用\
  \ Chatter 风格进行发布，例如使用 @ 来提及用户名。完成后点击“共享”按钮。如下面的截图所示：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_328_0.png)\n\
  \n与普通 Chatter 帖子类似，被提及的用户会收到通知。该用户只需点击右上角用户名旁边的“通知”图标，即可打开帖子并进行评论或点赞。为报表启用 Chatter\
  \ 帖子可能看起来很简单，但它是一项强大的功能，可作为报表内用户之间的协作工具。此功能与记录中的 Chatter 帖子非常相似，例如客户、商机等。下面的截图显示了右侧的\
  \ Chatter 面板：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_329_0.png)\n\n在上面的截图中，Chatter\
  \ 页面中只有“发帖”和“投票”操作。我们可以通过导航至“设置 | 用户界面 | 全局操作 | 发布者布局”来添加或删除操作。然后编辑布局并选择“Salesforce1\
  \ 与 Lightning 操作”。\n\n### 跟踪报表流\n\n如果你还记得，在之前的练习中，当启用报表的流跟踪时，我们还启用了以下项目的跟踪：\n\n\
  - 报表名称\n- 报表唯一名称\n- 描述\n\n让我们做一个简单的练习：通过编辑报表来更改报表名称——打开报表属性，更改“报表名称”和“报表唯一名称”。保存报表，让我们看看跟踪是如何工作的。从报表中点击“协作”图标打开\
  \ Chatter 面板。如下面的截图所示：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_330_0.png)\n\n\
  ### 仪表板协作与流跟踪\n\n与报表类似，你可以在仪表板中使用 Chatter 流跟踪进行协作。“协作”图标位于仪表板上的“刷新”按钮旁边；如果你没有看到该图标，请按照以下步骤操作：\n\
  \n1. 导航至“设置 | 功能设置 | Chatter | 流跟踪”。\n2. 查找“仪表板”并勾选“启用流跟踪”；在此处选择所有要跟踪的字段。\n3. 点击“保存”按钮。\n\
  \n以下是你可以在仪表板流中跟踪的五个项目：\n\n- **仪表板运行用户**\n- **仪表板唯一名称**\n- **描述**\n- **标题**\n- **使用网格布局**\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_331_0.png)\n\n上面的截图显示了仪表板流中的项目。\n\n让我们快速进行一个关于仪表板协作和流跟踪的动手练习：\n\
  \n1. 打开我们现有的仪表板“客户仪表板”。\n2. 点击“协作”图标打开 Chatter 窗口。如下面的截图所示：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_332_0.png)\n\
  \n3. 无论是 Chatter 帖子还是投票，你都可以提及其他用户以发送通知。在本练习中，让我们创建一个新的投票，看看用户是否更喜欢新的仪表板设计。请查看以下截图：\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_333_0.png)\n\n4. 用户也可以对投票进行点赞或评论。\n5.\
  \ 让我们为仪表板添加一个**描述**；请记住，我们之前在 **Chatter** 流跟踪中跟踪了**描述**。\n6. 编辑仪表板，编辑仪表板属性（齿轮图标），然后在**描述**文本框中添加文本。在本练习中，让我们输入`该仪表板包含与客户相关的所有项目。`\n\
  7. 点击**保存**按钮退出仪表板属性窗口。再次点击“保存”保存仪表板，然后点击**完成**。\n8. 再次打开 Chatter 面板（协作图标），注意在“发帖”下，我们对描述所做的更改被记录为一条帖子。\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_334_0.png)\n\n9. 由于这里的流是 Chatter 流的一部分，现在让我们打开\
  \ Chatter 选项卡。它也应当显示在那里，如下面的截图所示：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_335_0.png)\n\
  \n### 关注仪表板\n\n你可能知道，在 Salesforce 中，我们可以关注记录，例如客户、商机或其他记录。因此，当有人更改记录值时，我们会通过 **Chatter**\
  \ 流以及电子邮件收到更新通知（取决于每个用户的 **Chatter** 电子邮件设置）。仪表板也是如此；通过关注仪表板，用户会在自己的 **Chatter**\
  \ 流中收到更新通知。\n\n管理员需要为仪表板启用流跟踪，否则组织中的任何用户都将无法关注任何仪表板。如果未为仪表板启用流跟踪，你将看不到该按钮。\n\n需要明确的是，当我们关注仪表板时，我们关注的是仪表板本身，而不是该仪表板中的组件，因此更新的组件不会出现在我们的\
  \ Chatter 流中。请考虑以下截图：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_336_0.png)\n\n\
  点击“协作”图标旁边的**+ 关注**按钮以关注仪表板。这与关注对象中的记录（例如**客户**、**商机**等）相同。当你关注仪表板时，你会收到仪表板被跟踪字段更改的通知，例如**仪表板运行用户**、**描述**、**仪表板唯一名称**和**标题**。\n\
  \n让我们看一下下面的示例。用户会在其 Chatter 页面上看到仪表板中的帖子，不是因为该用户在该帖子中被提及，而是因为该用户关注了该仪表板，就像用户关注客户、联系人或其他记录一样：\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_337_0.png)\n\n### 发布仪表板组件快照\n\n通过将仪表板组件快照发布到\
  \ Chatter，你可以让团队对某个主题进行回应或提供反馈，例如显示商机管道下降的仪表板组件或其他内容。一旦为仪表板启用了流跟踪，你的用户就可以将仪表板快照共享到仪表板流、Chatter\
  \ 群组或用户流中。\n\n要启用仪表板组件快照，请导航至**设置 | 功能设置 | 分析 | 报表与仪表板设置**，并查找**启用仪表板组件快照**。如果你未启用流跟踪，用户将无法将仪表板组件发布到仪表板流。将组件发布到个人或群组的流中，可以让无权访问仪表板的人也能看到图表。\n\
  \n快照帖子是发布时仪表板组件的一张静态图像。如果仪表板应用了筛选器，快照图像将基于应用了筛选器的组件。快照发布和用户查看的时间信息将添加到快照帖子中。\n\n\
  以下是发布仪表板快照的三个选项：\n\n1. **此仪表板**\n2. **一个群组**\n3. **我的关注者**\n\n当快照发布到仪表板流时，所有能够打开仪表板的用户都会在\
  \ **Chatter** 中以**帖子**的形式看到某个时间点的仪表板快照。\n\n让我们快速进行一个发布仪表板快照的动手练习：\n\n1. 打开仪表板。\n\
  2. 选择要截取快照的组件；该组件将显示为一个大图表。\n3. 点击屏幕右下角的**共享**按钮。\n4. 你可以选择发布到此仪表板、一个群组或我的关注者。在本练习中，让我们选择**此仪表板**。\n\
  5. 你可以在**消息**框中输入消息。\n6. 点击**发布**按钮。如下面的截图所示：\n\n\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_339_0.png)\n\
  \n将快照发布到 **Chatter** 组会获得该 **Chatter** 组中用户的关注。发布到 **Chatter** 组动态中的快照可以被组内的所有人看到——即使是那些没有仪表板访问权限的人，因此不要发布敏感信息。要将快照发布到\
  \ **Chatter** 组，请执行以下步骤：\n\n- 1. 打开仪表板。\n- 2. 选择要截取快照的组件；该组件将显示为一张大图表。\n- 3. 点击屏幕右下角的\
  \ **分享** 按钮。\n- 4. 选择发布到 **一个组**，然后输入组名称。\n- 5. 你可以在 **消息** 框中输入消息。\n- 6. 点击 **发布**\
  \ 按钮。如下图所示：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_340_0.png)\n\n## 通过 URL\
  \ 参数筛选报告\n\n如果你熟悉 Classic，可以通过在报告 URL 后添加 `pv` 来实现报告参数。在 Lightning 中如何做到呢？幸运的是，Salesforce\
  \ 提供了同样的功能，但在查看示例并动手练习之前，先让我们讨论一下这个功能有多强大。\n\n借助此功能，你可以在报告 URL 中传递值，这些参数相当于报告的筛选值。其中一个用途是：从记录页面创建一个自定义按钮或链接，指向已创建的报告，并通过特定筛选条件，根据源记录生成动态报告。例如，为一个客户（Account）的所有相关商机（Opportunities）生成报告。\n\
  \nURL 参数化报告的另一个用途是：可以针对不同目的复用同一份报告，而无需创建两份相似的报告。例如，在 URL 参数的情况下，针对“新业务管道（Pipeline\
  \ for New Business）”和“现有业务管道（Pipeline for Existing Business）”的报告，一旦报告加载完成，你可以创建带有\
  \ URL 参数的两个书签。\n\n将参数用作报告筛选器，可以避免创建许多仅靠筛选器区分的相似报告，也无需不断编辑报告并修改筛选值。\n\n### 通过 URL\
  \ 参数实现报告筛选器的动手练习\n\n用例：我们想要分析某些在客户页面布局中不可见的 **客户（Account）** 字段。报告将按 **客户名称（Account\
  \ Name）** 进行筛选，但与其反复编辑报告来更改 **客户名称（Account Name）** 值，不如使用带有 URL 参数的报告筛选器。\n\n- 1.\
  \ 创建一份简单的 **客户表格（Tabular Account）** 报告，并将其命名为 `Account Name Report`。\n- 2. 将 **显示（Show）**\
  \ 字段选择为 **所有客户（All accounts）**。\n- 3. 将 **日期字段范围（Date Field Range）** 设置为 **所有时间（All\
  \ Time）**。\n- 4. 添加筛选条件：**客户名称包含** `blank`；点击 **OK** 确认筛选。\n- 5. 点击 **保存（Save）**\
  \ 按钮，然后点击 **运行报告（Run Report）**。\n- 6. 点击 **报告（Reports）** 选项卡，然后重新打开该报告（它应出现在列表顶部）。\n\
  - 7. 下面的截图显示了生成的报告，并获取报告的 URL。在我的示例中，URL 是 `https://gs0.lightning.force.com/one/one.app#/sObject/00OB0000001sBuoMAE/view`：\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_342_0.png)\n\n- 8. 好了，现在我们要向报告 URL 添加一个参数。\n\
  - 9. 假设我们希望显示所有名称中包含 united 的客户。\n- 10. 将 `united` 作为 URL 参数添加，然后在 Web 浏览器中按 Enter：`https://gs0.lightning.force.com/one/one.app#/sObject/00OB0000001sBuoMAE?fv0=united`。如下图所示：\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_343_0.png)\n\n正如你在前面的截图中所见，添加到参数中的 united\
  \ 成为报告的筛选值。如果你不保存报告，报告将保持原样；但如果保存报告，united 将被永久存储在该报告中。\n\n让我们分析一下前面的报告和 URL：\n\n\
  - 这里是原始 URL：\n\n  `https://gs0.lightning.force.com/one/one.app#/sObject/00OB0000001sBuoMAE/view`\n\
  \n- 然后我们通过添加参数来修改 URL，如下所示：\n\n  `https://gs0.lightning.force.com/one/one.app#/sObject/00OB0000001sBuoMAE/view?fv0=united`\n\
  \n- 我们在报告 ID（即 `00OB0000001sBuoMAE`）后面添加 `?`；`&` 表示 URL 中的新参数。如果有多个参数，从第二个参数开始，将\
  \ `?` 替换为 `&`。\n- 我们添加 `fv0`，其中 `fv` 代表筛选值（filter value），作为参数名。`0` 是筛选条件在报告中出现的顺序编号：第一个筛选条件是\
  \ 0，第二个是 1，第三个是 2，以此类推。要设置报告中第二个筛选条件的值，请将 `fv1` 指定为参数名。标准筛选条件不计入此顺序，也无法通过 URL 参数进行筛选。\n\
  - 我们将 `united` 作为参数值添加——请记住，筛选条件不区分大小写，因此无论你输入 `united` 还是 `United` 都没有关系。如果想添加一个包含空格的多词值，例如\
  \ `united oil`，你只需按原样输入即可，但浏览器会按照 URI 编码在中间添加 `%20`，因此它将变为 `https://gs0.lightning.force.com/one/one.app#/sObject/00OB0000001sBuoMAE/view?fv0=united%20oil.`\n\
  \n现在，如果我只想更改第二个参数的筛选值，而不想更改第一个参数的筛选值，该怎么办？这不成问题——你可以仅在参数中添加 `fv1`（不包含 `fv0`），例如：`https://gs0.lightning.force.com/one/one.app#/sObject/00OB0000001sBuoMAE/view?fv1=customer`。如下图所示：\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_344_0.png)\n\n关于使用 URL 参数进行筛选，有几点需要注意，如下所示：\n\
  \n- URL 参数仅支持手动添加到报告中的字段筛选条件。\n- 它们不支持报告提供的标准筛选条件，例如 **角色层级（Role Hierarchy）**、范围、区域、**商机状态（Opportunity\
  \ Status）**、**概率（Probability）** 和日期筛选条件。\n- 它们不支持 **交叉筛选（Cross Filter）** 和 **行数限制（Row\
  \ Limit）** 筛选条件。\n- 手动添加为筛选条件的第一个字段将被视为第一个参数，即 `fv0`。\n- 如果报告中添加了图表，则在应用报告筛选条件（包括使用\
  \ URL 参数的筛选条件）时，图表会相应调整。\n- 你不能通过 URL 参数添加、更改或删除被筛选的字段；只能修改现有筛选条件的值。\n- 参数的添加顺序不必与报告筛选条件的顺序一致，例如，我们将\
  \ `fv1` 放在 `fv0` 之前：`https://gs0.lightning.force.com/one/one.app#/sObject/00OB0000001sBuoMAE/view?fv1=customer&fv0=united`；这里，`fv1`\
  \ 作为第一个参数添加，但它对应第二个筛选条件。然后我们添加 `fv0`（对应第一个筛选条件）作为第二个参数。仅在第一个参数前使用 `?`，然后使用 `&` 分隔其他所有参数。\n\
  \n## 设置和使用字段历史跟踪\n\n字段历史跟踪是 Salesforce 的一项开箱即用功能，用于跟踪字段中的值更改。每个对象最多可以选择 20 个字段进行跟踪；如果需要跟踪更多字段，请联系\
  \ Salesforce 支持。对于 **长文本区域（Text Area (Long)）**、**富文本区域（Text Area (Rich)）** 和 **多选下拉列表（Picklist\
  \ (Multi-Select)）** 等字段类型，历史跟踪不会在记录更新时跟踪原始值和新值，而只跟踪该字段是否发生了更改。此功能虽然简单，但在审计用途上非常强大。\n\
  \nSalesforce 保留历史记录最长为 18 个月；但是，如果你需要更长时间的归档，请联系你的 Salesforce 支持以获取字段审计追踪（Field\
  \ Audit Trail），并定义你希望保留字段历史跟踪的时长策略。这项付费功能允许你将归档时间延长至最多 10 年。\n\n作为管理员，你可以通过几次点击自行启用字段历史跟踪——为标准对象和自定义对象选择某些重要字段进行跟踪。\n\
  \n请记住，在启用对象跟踪并选择字段进行跟踪之前，字段值不会被跟踪。这意味着，如果你今天启用了 **客户名称** 的跟踪，你将无法跟踪今天之前对 **客户名称**\
  \ 所做的更改。\n\n历史跟踪不仅用于跟踪你何时编辑记录，还用于跟踪你何时创建新记录，包括 **线索（Lead）** 被转换时创建的记录。当你创建新记录时，字段历史条目将被标记为\
  \ **已创建**；当记录由 **线索（Lead）** 记录转换而来时，则被标记为 **由线索转换创建**；旧值和新值都将为空。\n\n### 标准对象的历史跟踪\n\
  \n历史跟踪同时支持标准对象和自定义对象。但并非所有标准对象都支持字段跟踪；只有以下标准对象支持历史跟踪：**客户（Accounts）、文章（Articles）、资产（Assets）、营销活动（Campaigns）、个案（Cases）、联系人（Contacts）、合同（Contracts）、合同行项目（Contract\
  \ Line Items）、权利（Entitlements）、线索（Leads）、商机（Opportunities）、订单（Orders）、订单产品（Order\
  \ Products）、产品（Products）、服务合同（Service Contracts）和解决方案（Solutions）。**\n\n要在标准对象（如\
  \ **客户**）上启用历史跟踪，请执行以下步骤：\n\n- 1. 导航到 **设置 | 对象和字段 | 对象管理器 | 客户 | 字段和关系**，然后点击 **设置历史跟踪**\
  \ 按钮。\n- 2. 勾选 **启用客户历史** 复选框。\n- 3. 选择要跟踪的字段。\n- 4. 请注意，**描述** 将仅被跟踪更改情况。这是因为 **描述**\
  \ 是一个 **长文本区域（Text Area (Long)）** 字段，这与跟踪类型为 **长文本区域（Text Area (Long)）**、**富文本区域（Text\
  \ Area (Rich)）** 和 **多选下拉列表（Picklist (Multi-Select)）** 的字段时相同。\n- 5. 点击 **保存** 按钮以保存更改。\n\
  \n\n\n\n\n## 自定义对象上的历史跟踪\n\n对于自定义对象，您需要在对象详细信息中启用跟踪，然后再选择要跟踪的字段。假设我们有一个名为 `Claim`\
  \ 的自定义对象。请执行以下步骤：\n\n1. 导航到 **Setup | Objects and Fields | Object Manager**。\n2.\
  \ 点击 **Claim** 对象链接并点击 **Edit** 按钮。\n3. 在可选功能中启用 **Track Field History**，然后点击 **Save**\
  \ 按钮。这在以下屏幕截图中显示：\n\n    ![](img/72d01bea5a9ccf02f9452aab7505d9de_347_0.png)\n\n\
  4. 从左侧菜单中选择 **Fields & Relationships**。\n5. 点击 **Set History Tracking** 按钮，并选择您想要跟踪的字段。\n\
  6. 对标准对象中的 **Text Area (Long)**、**Text Area (Rich)** 和 **Picklist (Multi-Select)**\
  \ 字段执行相同的操作——它只会跟踪更改，而不会跟踪旧值和新值。\n7. 点击 **Save** 按钮保存更改。\n\n## 历史对象\n\n当您为对象启用 **Field\
  \ History Tracking** 时，在后端，Salesforce 会创建一个新对象。该对象的名称将以 **History** 结尾，例如 **AccountHistory**、**ContactHistory**\
  \ 等标准对象，对于自定义对象则为 **__History**，例如 `Claim__History`。\n\n当记录中跟踪的字段发生任何更改时，Salesforce\
  \ 会在此对象中创建一个新记录。例如，如果对象中有五个跟踪字段，而其中三个在一次事务中更改，Salesforce 将在此对象中创建三条记录。\n\n作为熟悉 SOQL\
  \ 的开发人员或管理员，您可以查看该对象以查询以下内容：\n\n- `CreatedById`：进行更改的用户\n- `CreatedDate`：更改日期\n\
  - `OldValue`：显示旧值\n- `NewValue`：显示新值\n- `ParentId`：(对于自定义对象)，与更改相关的记录 ID\n- `ObjectId`（例如：标准对象的\
  \ `AccountId` 或 `ContactId`）\n\n您不能手动创建、更新或删除此对象中的记录，只能查询。出于很好的原因，历史对象的存储使用量不计入数据存储。\n\
  \n## 读取历史跟踪值\n\n一旦启用历史跟踪，除了使用 API 查询之外，还有两种查看跟踪值的方法。接下来将讨论这两种方法。\n\n### 历史相关列表\n\
  \n将字段历史信息相关列表添加到对象页面布局。此信息将对分配给特定页面布局的所有用户可见，以防您有多个页面布局。\n\n要将历史相关列表添加到对象页面布局，请打开页面布局编辑器。在此练习中，让我们以\
  \ Account 对象为例，因此此处的相关列表为 Account History。选择 Related Lists 中的 Account History，并将其拖到页面布局中。这在以下屏幕截图中显示：\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_349_0.png)\n\n一旦历史相关列表被添加到页面布局，对跟踪字段的任何更新都将显示在此处，如以下屏幕截图中\
  \ Related 选项卡下所示（左箭头）；但您也可以将其作为 Lightning 组件中的相关列表添加（右箭头）：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_350_0.png)\n\
  \n让我们分析前面的屏幕截图：\n\n- 历史记录按日期以降序排序\n- 第一个历史记录显示记录何时创建\n- 在一次事务中更新多个字段时，它将作为两个不同的项目跟踪，但日期和时间相同；请参阅\
  \ Account Owner 和 Account Number 的更改\n- 因为 Description 是一个长文本区域字段，所以它不会跟踪原始值和新值，而只是跟踪发生了更改\n\
  \n所有对象都将具有相同的标签，并以 History 结尾，例如 Account History、Contact History、Claim History 等。但对于\
  \ Opportunity 对象，它是一个例外——它被称为 Opportunity Field History。请考虑以下屏幕截图作为 Opportunity\
  \ Field History 的示例：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_351_0.png)\n\n\
  对于 API 对象名称也是如此——它被称为 **Opportunity Field History** 而不是 **Opportunity History**。**Opportunity\
  \ History** 对象用于存储 **Opportunity Stage** 信息。\n\n### 历史报告\n\n获取历史跟踪值的另一种选择是使用报告。用户只需要拥有\
  \ **Run Report** 权限，以及运行所创建报告的对象的访问权限即可。\n\n要创建报告，首先选择自定义报表类型，例如 **Account History**\
  \ 报表，如以下屏幕截图所示：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_352_0.png)\n\n默认情况下，它将显示\
  \ **My accounts**，但您可以像普通报表一样修改它。添加筛选器、添加分组、更改报表格式，并添加/删除报表字段。如果您查看左侧面板的字段可用性，只有来自\
  \ **History Data** 组中的字段才包含历史数据，而其他字段如果您将该字段带入报表，则会在 Salesforce 中显示实时数据。请考虑以下屏幕截图中\
  \ **History Data** 下的字段：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_352_1.png)\n\
  \n如果您注意到前面的屏幕截图，**Account History** 报表类型的 Parent ID 为 **Account ID**。这对于其他对象也是相同的；例如，如果这是\
  \ **Contact History**，则 **Parent ID** 将为 Contact ID。\n\n对于自定义对象，一旦在对象详细信息中启用 **Track\
  \ Field History**，请创建一个新的自定义报表，并注意报表类型以 `History` 结尾可供您使用，例如 `Claim History`。与上述\
  \ **Account History** 类似，您可以像普通报表一样使用此报表类型。请考虑以下屏幕截图中的报表：\n\n| HISTORY ID | PARENT\
  \ ID | ACCOUNT NAME | EDITED BY | EDIT DATE | FIELD / EVENT | OLD VALUE | NEW VALUE\
  \ |\n|---|---|---|---|---|---|---|---|\n| 017B000002tGNh | 001B000000SWOQO | Electric\
  \ Inc Limited | Alvin Lee | 5/24/2017 9:10 PM | Account Number | - | 8001 |\n| 017B000002tGfz\
  \ | 001B000000SWOQO | Electric Inc Limited | Johan Yu | 5/24/2017 9:10 PM | Account\
  \ Owner | Johan Yu | Alvin Lee |\n| 017B000002tGcL | 001B000000SWOQO | Electric\
  \ Inc Limited | Johan Yu | 5/24/2017 9:09 PM | Description | - | - |\n| 017B000002tGcK\
  \ | 001B000000SWOQO | Electric Inc Limited | Johan Yu | 5/24/2017 9:08 PM | Account\
  \ Name | Electric Inc | Electric Inc Limited |\n| 017B000002tGyA | 001B000000SWOQO\
  \ | Electric Inc Limited | Johan Yu | 5/24/2017 9:08 PM | Created | - | - |\n| 017B000002tGVC\
  \ | 001B000000SWOQJ | Big Inc. Limited | Johan Yu | 5/24/2017 9:07 PM | Description\
