  | 总计（14条记录） | | | | |\n\n\n\n16. 点击下拉箭头中的“保存”以保存报表中的所有更改。通过这样操作，你可以在不通过报表生成器编辑的情况下保存报表：\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_98_0.png)\n\n## 矩阵报表格式\n\n矩阵报表与汇总报表非常相似，但增加了按行和列同时分组的能力。你还可以为行和列分别设置最多两个分组级别。\n\
  \n与表格和汇总报表格式类似，你可以在矩阵报表中添加可汇总字段。默认情况下，记录计数会添加到报表矩阵中。当你在矩阵报表中添加汇总字段时，该字段和汇总结果会显示在矩阵中，而不是像汇总或表格报表格式那样显示在列底部。一旦向矩阵报表添加了汇总字段，如果不需要，可以移除矩阵中的默认记录计数。\n\
  \n当你有大量数据需要汇总，并且需要使用矩阵报表比较同一字段中不同值的记录时，此报表格式非常适用。如果矩阵报表至少没有一个行分组和一个列分组，在运行报表时它将显示为汇总报表。\n\
  \n当你将报表从 **Summary** 更改为 **Matrix** 格式时，可以从 **Tabular** 或 **Summary** 报表更改为 **Matrix**\
  \ 报表：\n\n- 第一级分组将自动变为第一级行分组\n- 第二级分组将自动变为第一级列分组\n- 第三级分组将自动变为第二级行分组\n\n在以下示例中，我们使用之前创建的相同汇总格式报表\
  \ **All Account by creation Year and owner**；报表显示使用相同的数据和条件——只是格式不同。请注意，当你创建 **Matrix**\
  \ 报表时，记录计数会默认添加。以下屏幕截图向我们展示了从 **Summary** 格式报表转换而来的 **Matrix** 报表：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_99_0.png)\n\
  \n## 创建矩阵报表的动手练习\n\n让我们考虑一个用例：在 **Matrix** 格式中显示所有账户的记录计数，按 **Calendar Year** 的账户创建日期进行行分组，按\
  \ **Account Owner** 进行列分组：\n\n- 1. 不要从头创建，让我们修改现有的 **Summary** 报表 `All Account by\
  \ creation Year and owner` 并将其转换为 **Matrix** 报表。\n- 2. 打开 **All Account by creation\
  \ Year and owner** 报表并点击 **Edit** 按钮，或导航到 **Reports** 选项卡，找到该报表，点击最后一列的箭头，然后点击 **Edit**\
  \ 以打开报表生成器。\n- 3. 将报表格式从 **Summary** 更改为 **Matrix**。\n- 4. 汇总报表的第一个分组将自动变为行分组，而第二个分组将变为列分组；在我们的练习中，**Created\
  \ Date** 将成为行分组，**Account Owner** 将成为列分组。\n\n让我们看一下以下屏幕截图，注意汇总报表的第一级和第二级分组已被转换：\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_100_0.png)\n\n当报表格式从 **Summary** 更改为\
  \ **Matrix** 报表时：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_101_0.png)\n\n5. 由于该报表最初保存为汇总报表，你只需点击“运行报表”按钮即可以矩阵格式查看报表结果。在\
  \ Lightning Experience 中，报表需要在运行前保存：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_101_1.png)\n\
  \n6. 如果你只需要查看报表汇总而不查看任何明细，点击刷新图标旁边的齿轮图标（不是顶部带闪电的齿轮图标），然后取消选中“详细信息”复选框。通常我们在展示报表且只想关注汇总而不需查看明细时需要这样做，如以下屏幕截图所示：\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_102_0.png)\n\n7. 这是仅显示基于创建日期和账户所有者的汇总的报表结果，以矩阵格式呈现：\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_102_1.png)\n\n- 8. 如果你在此处点击 **Save**，这将覆盖你之前创建的\
  \ **Summary** 报表。因此，不要点击保存，而是点击 **Clone** 将报表另存为新报表，输入新的报表名称，选择文件夹，然后在弹出窗口中点击 **Create**\
  \ 按钮进行确认。\n- 9. 或者，当你在步骤 5 的报表生成器中时，不要点击 **Run Report** 按钮运行报表，而是点击 **Save As**\
  \ 按钮将报表另存为新报表。\n\n## 向矩阵报表添加汇总字段的动手练习\n\n让我们考虑一个用例：在 **Matrix** 格式中显示所有商机及其总金额，按\
  \ **Opportunity Stage** 进行行分组，按 **Opportunity Owner** 进行列分组：\n\n- 1. 导航到 **Reports**\
  \ 选项卡并点击 **New Report** 按钮。\n- 2. 选择 **Opportunities** 报表类型并点击 **Opportunities**\
  \ 类别下的加号。\n- 3. 点击 **Create** 按钮继续。\n- 4. 将 **Show** 更改为 **All opportunities**。\n\
  - 5. 将 **Date Field** 范围更改为 **All Time**。\n- 6. 请注意，**Opportunity Status** 和 **Probability**\
  \ 过滤器位于 **Show** 旁边；这些特定过滤器仅在使用 **Opportunity** 报表类型时出现。对于此练习，只需将 **Opportunity\
  \ Status** 的默认值保留为 **Any**，将 **Probability** 保留为 **All**。\n- 7. 将报表格式从 **Tabular**\
  \ 更改为 **Matrix**。\n\n8. 通过将其拖放到“字段”区域外，移除所有字段，只保留商机名称、金额、阶段和商机所有者字段。现在你应该看到与以下屏幕截图类似的内容：\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_104_0.png)\n\n9. 要对金额求和，将鼠标悬停在金额标题上，点击“汇总此字段...”中的箭头图标，选择\
  \ Sum，然后点击“应用”按钮，如以下屏幕截图所示：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_104_1.png)\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_105_0.png)\n\n如果要汇总的字段尚未添加到报表中，可以直接将可汇总字段（如货币、数字和百分比）拖入矩阵，系统将提示你按\
  \ Sum、Average、Max 或 Min 进行汇总。\n\n你可以通过拖放已汇总的字段来更改添加到矩阵中的字段顺序。要从矩阵中移除已汇总的字段，只需将其拖到左侧面板的字段区域即可。\n\
  \n- 10. 现在你应该在矩阵中看到金额及其值；请参考步骤 11 中的屏幕截图。\n- 11. 将 **Stage** 拖为行分组，将 **Opportunity\
  \ Owner** 拖为列分组，如以下屏幕截图所示：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_105_1.png)\n\
  \n- 12. 请注意，你可以为行分组和列分组分别拖入另一个字段作为第二级分组。\n- 13. 由于我们只想关注汇总值，让我们通过点击 **Remove All\
  \ Columns** 链接旁边的 **Show**，然后取消选中 **Detail** 来隐藏报表明细。\n\n- 14. 接下来，让我们也移除记录计数，因为我们只需要金额值。再次点击\
  \ **Remove All Columns** 链接旁边的 **Show**，然后取消选中 **Record Count**。请记住，只有在矩阵中添加了字段作为汇总字段时，我们才能移除记录计数。\n\
  \n- 15. 点击 **Save** 按钮；这将打开一个弹出窗口以保存报表：\n  - 输入 **Report Name** 为 `Opportunity by\
  \ Stage and Owner`\n  - **Report Unique Name** 将自动填充\n  - 为便于将来参考，输入一些 **Description**\
  \ 始终是良好做法\n  - 在 **Report Folder** 中选择 **My Personal Custom Reports**，这样无人可以访问它\n\
  \  - 点击 **Save** 按钮保存报表\n\n- 16. 点击 **Run Report**，你应该会看到与以下报表类似的报表：\n\n| OPPORTUNITY\
  \ OWNER | ALVIN LEE | JOHAN YU | Total |\n|---|---|---:|---:|---:|\n| **STAGE**\
  \ | **AMOUNT Sum** | **AMOUNT Sum** | **AMOUNT Sum** |\n| Prospecting | $0.00 |\
  \ $80,000.00 | $80,000.00 |\n| Qualification | $0.00 | $115,000.00 | $115,000.00\
  \ |\n| Needs Analysis | $675,000.00 | $0.00 | $675,000.00 |\n| Value Proposition\
  \ | $0.00 | $330,000.00 | $330,000.00 |\n| Id. Decision Makers | $0.00 | $110,000.00\
  \ | $110,000.00 |\n| Perception Analysis | $0.00 | $120,000.00 | $120,000.00 |\n\
  | Proposal/Price Quote | $270,000.00 | $100,000.00 | $370,000.00 |\n| Negotiation/Review\
  \ | $395,000.00 | $0.00 | $395,000.00 |\n| Closed Won | $0.00 | $3,716,000.00 |\
  \ $3,716,000.00 |\n| **Total** | **$1,340,000.00** | **$4,571,000.00** | **$5,911,000.00**\
  \ |\n\n\n\n\n\n## 创建联合报表的手工练习\n\n让我们考虑一个用例：在一份报表中展示过去一年中与账户相关的所有已赢得商机和案例。请记住，自 Summer\
  \ '17 版本发布以来，联合报表仅在 Classic 中可用，因此你只能在 Classic 用户界面中执行以下操作：\n\n- 1. 导航到 **Reports**\
  \ 选项卡并点击 **New Report...** 按钮。\n- 2. 选择 **Opportunities** 报表类型；它位于 **Opportunities**\
  \ 类别下。\n- 3. 点击 **Create** 按钮继续。\n- 4. 将 **Show** 字段更改为 **All opportunities**。\n\
  - 5. 将 **Date Field** 更改为 **Close Date**，并将 **Range** 更改为 **Previous CY**。\n- 6.\
  \ 点击 **Remove All Columns** 链接，点击 **OK** 确认，然后向报表添加以下字段：**Opportunity Name**、**Account\
  \ Name** 和 **Amount**。\n- 7. 点击 **Add** 按钮添加筛选条件，其中 **Won** 等于 **True**。\n- 8. 将鼠标悬停在\
  \ **Amount** 上，点击箭头，选择 **Summarize the Field...**，选中 **Sum** 复选框，然后选择 **Apply**\
  \ 按钮。将报表格式更改为 **Joined**。\n- 9. 一旦报表格式更改为 **Joined**，**Add Report Type** 按钮将可用，并且\
  \ **Opportunity** 块将被添加到报表中。\n- 10. 点击标有 **Opportunities block 1** 的块并将其更改为 Won\
  \ Opportunities Last Year：\n\n## 创建和管理报表\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_109_0.png)\n\
  \n- 11. 点击 **Add Report Type** 按钮继续。\n- 12. 在 **Customer Support Reports** 类别下选择\
  \ **Cases** 报表类型，然后点击 **OK** 按钮继续。\n- 13. 逐一删除案例块中的所有字段，除了 **Subject** 和 **Account\
  \ Name**。\n- 14. 点击块标签 **Cases block 2** 并将其更改为 `All Cases Last Year`。\n\n- 16.\
  \ 从左侧的 COMMON FIELDS 中，将 Account Name 拖到放置区；Account Name 将自动从两个块中移除。请考虑以下截图：\n\n\
  ![](img/72d01bea5a9ccf02f9452aab7505d9de_111_0.png)\n\n- 17. 默认情况下，Details 将被启用；让我们暂时禁用它。点击\
  \ Show 菜单并取消选中 Details。\n\n## 使用报表筛选器\n\n报表是 Salesforce 平台最强大的功能之一；根据你的权限，你可以在几分钟内构建自己的报表，并在无需\
  \ Salesforce 管理员或 Salesforce 开发人员帮助的情况下管理它们。\n\n我们在前几章中讨论了与报表相关的许多内容，包括创建报表的权限、与报表文件夹相关的权限，以及呈现报表布局的报表格式。\n\
  \n与报表相关的另一个重要项目是 **report filters**。报表筛选器允许你定义要使用的哪些数据条件，以便根据某些标准将记录包含在报表中。报表中的筛选条件几乎与我们在\
  \ Salesforce 的其他功能中发现的筛选条件相似，例如列表视图、工作流规则和 Salesforce 中的其他区域，但报表中的筛选条件甚至更强大。\n\n\
  对于每个筛选条件，你需要设置字段、运算符和值。你可以为报表设置多个筛选器。每个筛选器的默认关系是使用 AND，但你可以使用筛选逻辑来自定义它。\n\n当你在报表构建器中时，如果你点击筛选器的\
  \ **Add** 按钮，它将自动添加一个新筛选器，但请注意 **Add** 旁边有一个小箭头按钮；如果你点击此箭头，报表筛选器的可用选项如下：\n\n- **Field\
  \ Filter**：这与点击 **Add** 按钮的操作相同\n- **Filter Logic**\n- **Cross Filter**\n- **Row\
  \ Limit**：仅适用于 **Tabular** 报表格式\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_113_0.png)\n\
  \n## 字段筛选器\n\n只需在报表构建器中点击 **Add** 按钮即可添加字段作为筛选器，或者你也可以将字段从 **Fields** 面板拖到 **Filters**\
  \ 面板以添加报表筛选器。\n\n一旦字段被添加到 **Filters** 窗格中，选择运算符然后输入值。\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_114_0.png)\n\
  \n如果你想为筛选值添加多个值，只需使用逗号分隔值即可。\n\n对于每个筛选器，你可以根据该特定筛选器的字段类型输入特殊值。与报表筛选器相关的一些你需要了解的项目如下：\n\
  \n- 筛选值不区分大小写。\n- 当你筛选 **Date** 字段时，你可以输入特殊日期值，例如 `TODAY`、`NEXT WEEK`、`LASTWEEK`、`LAST\
  \ <x> DAYS`、`LAST <x> YEARS` 等等。有关完整的日期格式和日期文字，请参阅此 Salesforce 链接 `https://developer.salesforce.com/docs/atlas.en-us.soql_sosl.meta/soql_sosl/sforce_api_calls_soql_select_dateformats.htm`。\n\
  - 对于包含逗号的筛选值，请在文本周围加上引号，例如，`Johan, LLC`；否则，它将作为 `Johan` 或 `LLC` 进行筛选。\n- 如果你实施了多币种，你可以在筛选条件中添加货币代码，例如\
  \ `USD 2500`、`SGD 8000`、`JPY 10000`。\n- 对于选择列表字段，你可以使用放大镜选择一个或多个要包含在筛选器中的选项，或者也可以手动输入。但当你再次编辑筛选器时，使用放大镜时现有选定的值将不会被选中；如果现有值不再有效，请手动在文本框中删除它们。\n\
  - 对于多选选择列表字段，输入值并使用分号在值之间分隔以指定精确匹配。\n- 你可以通过勾选 **Locked** 复选框来锁定添加的筛选器，这样其他用户在运行报表时将无法更改或删除它们。\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_114_1.png)\n\n如果你无法访问定义为筛选器的字段，它将被从筛选条件中移除，并将基于剩余筛选器显示结果。\n\
  \n## 筛选逻辑\n\n如果报表中有多个筛选器，添加筛选逻辑将允许你使用筛选器之间的逻辑运算符为筛选器指定条件。当你向报表添加筛选器时，默认情况下，所有筛选器都作为\
  \ AND 逻辑相关，例如：\n\n- Type 包含 Customer\n- Country 等于 United States\n- Employees 大于\
  \ 1000\n\n配置到 Salesforce 中时，它看起来如下：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_115_0.png)\n\
  \n如果注意到，AND 将默认添加到新的筛选器行中。通过筛选逻辑，你可以指定是否使用 AND、OR 或 NOT 运算符。\n\n使用前述筛选条件，报表将生成所有\
  \ Type 包含 \"Customer\"、账单国家等于 \"United States\" 且员工人数超过 \"1000\" 人的账户。但如果我们想获取所有\
  \ Type 包含 \"Customer\" 且账单国家等于 \"United States\" 或员工人数超过 \"1000\" 人的账户，其中最后一个筛选器（员工）不依赖于\
  \ Type 和 Country，该怎么办。\n\n没有筛选逻辑，我们需要创建两个单独的报表并手动合并它们，一个报表筛选条件为 Type 包含 \"Customer\"\
  \ AND 账单国家等于 \"United States\"，另一个报表筛选条件为员工人数大于 \"1000\"。\n\n- 9. 点击 OK 按钮确认筛选器：\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_117_0.png)\n\n- 10. 在左侧的 **Fields** 文本框中输入\
  \ **employees**，将其拖到筛选区域，并勾选 **Locked** 复选框。\n- 11. 将运算符更改为 **greater than** 并输入值\
  \ 1000。\n- 12. 点击 **OK** 按钮确认筛选器：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_117_1.png)\n\
  \n\n\n\n\n13. 在 **Filters** 中，导航到 **Add** 按钮后点击箭头 | **Filter Logic**。\n参考以下截图：\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_118_0.png)\n\n+   14. 默认的过滤逻辑值为 **1 AND\
  \ 2 AND 3**；手动将其更改为 **( 1 AND 2 ) OR 3**。\n+   \n+   15. 点击 **OK** 按钮确认过滤逻辑。\n+\
  \   \n+   16. 点击 **Save** 按钮并执行以下操作：\n+      - **Report Name** 为 `Account with Filter\
  \ Logic`\n+      - **Report Description** 为 `All Accounts with No of Employee more\
  \ than 1000, or Customer in US or UK`\n+      - **Report Folder** 为 **My Personal\
  \ Custom Reports**\n+   \n+   17. 点击 **Run Report** 按钮生成报表。\n\n您可以根据需要增强前述的过滤逻辑；确保其具有正确的括号配对以及正确的值和运算符。\
  \ 从本次练习中我们学到的另一件事是，我们在过滤值中使用逗号；如果您有多个值，只需在过滤值中添加逗号，例如 **Billing Country equals United\
