  \n## 按角色层级筛选\n\n对于机会报告，我们有一个额外的报告用于按 **Role Hierarchy** 筛选报告。此筛选器在运行报告时可见，而非在报告构建器中配置报告时可见。\n\
  \n一旦应用筛选器，数据将被筛选以仅显示该角色下用户拥有的机会，包括该角色层级下 **Users** 中的所有用户。\n\n但如果您想筛选特定用户拥有的机会，请通过选择角色然后选择用户来缩小您的\
  \ **Role Hierarchy** 筛选器。以下截图展示了使用 **Role Hierarchy** 筛选机会报告：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_129_0.png)\n\
  \n## 按相对日期筛选\n\n如果您需要报告始终使用特定时间范围进行筛选，例如上个月、本月、上季度等，而不是使用固定日期，您可以选择相对日期选项。使用相对日期时，当您创建一个名为上月赢得机会的报告时，您无需每月手动调整关闭日期。\n\
  \n首先，在配置报告时，您需要将日期字段添加到筛选器放置区，而不是日期字段筛选器中的那个；以下截图展示了在放置区筛选器中添加筛选器：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_130_0.png)\n\
  \n当用户运行报告时，他们也可以在运行时修改此设置：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_131_0.png)\n\
  \n## 通过点击图表筛选\n\n当向报告添加图表时，您是否知道，当您点击图表中的某个细分时，报告将自动使用图表中选定的细分进行筛选？\n\n假设我有一个名为\
  \ **Opportunities by Stage** 的机会报告，并已添加图表。以下截图显示了添加了图表的报告：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_132_0.png)\n\
  \n## 锁定筛选器\n\n在报告构建器中向报告添加筛选器时，确定按钮前有一个锁定复选框。这决定了运行报告的用户在查看报告时编辑或删除筛选器的能力。请考虑以下截图：\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_134_0.png)\n\n当筛选器被锁定后，它们将显示在锁定筛选器区域下，运行报告的用户将无法编辑或删除它们。请考虑以下截图：\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_134_1.png)\n\n## 总结\n\n在本章中，我们对在 Salesforce\
  \ 平台上使用报告时组件有了更深入的了解。我们探讨了不同类型的报告格式，并查看了每种格式类型的独特性。我们看到了向报告添加筛选器是多么容易。为了进一步自定义报告，我们可以为\
  \ **Tabular** 报告包含 **Filter Logic**、**Cross Filter** 和 **Row Limit**。\n\n尽管本章多次提及仪表板，但我们并未详细讨论它们。仪表板将在\
  \ *第 9 章 Lightning Experience 中的构建仪表板* 及以后深入讨论。本章完全专注于报告。\n\n在下一章中，我们将详细讨论报告类型，查看报告类型为何如此重要，以及如何创建报告，正如您在本章中多次阅读到关于报告类型的介绍。\n"
- "# 5. 了解报告类型\n\n您已在第 4 章 创建和管理报告 中学习了创建和管理报告。在该章中，我们讨论了选择正确的报告格式以确定报告布局的重要性，并讨论了如何添加报告筛选器、筛选逻辑、交叉筛选和行限制以获得所需的报告结果。\n\
  \n您在前几章中多次阅读到关于报告类型的介绍。在本章中，我们将深入讨论报告类型，从报告类型类别、标准报告类型、自定义报告类型开始，最后通过几个动手练习来创建自定义报告类型、扩展自定义报告类型并通过创建新报告来应用它们。本章还将分享使用自定义报告类型的益处和局限性。\n\
  \n到本章结束时，您将了解报告类型是什么，在创建新报告时需要了解报告类型的哪些知识，如何创建自定义报告类型，以及如何从自定义报告类型中受益。报告类型设置用户界面在\
  \ Lightning 和 Classic 中相同，因此本章中的所有截图都适用于两种用户界面。\n\n在本章中，我们将提供注释和提示以帮助您理解重要事项。以下主题将被涵盖：\n\
  \n- Report Type introduction\n- Report Type category\n- Standard report type\n-\
  \ Custom report type\n\n### Report Type introduction\n\n如前几章所述，每个报告都需要基于一个报告类型构建：\n\
  \n- 什么是报告类型？\n- 我们如何检查现有报告使用的报告类型？\n- 当我们创建新报告时，选择正确的报告类型有多重要？\n\n所有这些问题都将在本章中得到解答。\n\
  \nSalesforce 报告，包括所有标准报告和自定义报告，都是基于报告类型构建的。报告类型是报告的基础。一旦报告创建完成，您就无法更改报告类型，但如果您有许多需要更改报告类型的报告，您可以聘请开发人员或顾问为您编写脚本，但我们不会在本手册中讨论这些高级主题。目前，如果您需要更改报告类型，您需要将其重新创建为新报告。\n\
  \n报告类型定义了基于主对象和定义的关联对象之间的关系可用于报告的记录集和字段。理想情况下，维护报告类型，包括报告类型的创建、编辑和删除，应属于 Salesforce\
  \ 管理员的工作范围，而非标准用户。作为系统管理员，您需要考虑可部署并供用户使用的报告类型的数量。提供过多的报告类型会导致用户在选择使用哪个报告类型以及它们之间的区别时感到困惑，因此请确保根据需要进行平衡。\n\
  \n当自定义对象启用报告时，Salesforce 将自动创建报告类型，其报告类型名称等于对象的复数名称，并且该报告类型将存储在其他报告类别文件夹中。\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_137_0.png)\n\
  \n要将自定义对象用于报告类型，请确保为该对象选择启用报告。\n\n为了更轻松地理解报告类型，让我们举一个例子——我们有一个名为 Expense 的自定义对象，其复数标签为\
  \ Expenses，您也可以使用其他自定义对象进行测试。该对象有一个指向 Opportunity 的查找关系字段，并且已激活启用报告和跟踪字段历史。让我们快速查看自定义对象设置中的详细信息：\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_138_0.png)\n\n导航到 **Reports** 选项卡并创建新报告；您将看到已创建与\
  \ **Expense** 相关的自定义报告类型或多个报告类型：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_138_1.png)\n\
  \n您可以输入报告类型名称进行快速搜索。\n\n在我的组织中，在搜索文本框中输入 **expense** 会筛选出与 Expense 对象相关的四个报告类型。您的组织中可能有所不同，因此如果您看不到相同的结果也没关系，但您应该至少看到一个报告类型。让我们分析我组织中的这四个报告类型：\n\
  \n- **Expenses**：此报告类型将包含与 Expense 对象相关的所有字段\n- **Expenses with Opportunity**：此报告类型是自动创建的，因为在我的组织中，Expense\
  \ 对象有一个指向 Opportunity 对象的查找字段\n- **Expenses and Connections**：此报告类型是创建的，因为在我的组织中，我已配置\
  \ Salesforce to Salesforce 连接\n- **Expense History**：此报告类型是创建的，因为已激活 **Track Field\
  \ History**；请参阅前面的截图\n\n### 报告类型类别\n\n报告类型类别存储并以文件夹形式呈现。这有助于我们在创建新报告时快速找到正确的报告类型。根据您订阅的\
  \ Salesforce 版本，您将获得不同的报告类型类别。\n\n您无法创建新的报告类型类别，但您可以创建自定义报告类型并将其存储在提供的类别之一中；始终是一个好做法将自定义报告类型存储在正确的类别中。\n\
  \n多年来，您可能创建了太多报告类型，但其中许多很少使用或仅使用一次；作为管理员，您可以删除这些报告类型或在创建新报告时将其从用户选择中隐藏；这包括标准和自定义报告类型。\n\
  \n以下是隐藏和删除报告类型的比较：\n\n| 操作 | 删除 | 隐藏 |\n|---|---|---|\n| 恢复报告类型 | 不可能 | 只需取消隐藏即可\
  \ |\n| 现有报告 | 全部删除 | 无影响 |\n| 开始位置 | **Setup** 菜单 | **Reports** 选项卡 |\n| 适用于 | 自定义报告类型\
  \ | 所有报告类型 |\n\n就个人而言，我更喜欢隐藏而不是删除自定义报告类型，以防将来某天需要该报告类型或被现有报告使用。\n\n\n\n\n\n## 理解报表类型\n\
  \n删除自定义报表类型将删除使用该报表类型构建的所有现有报表，包括存储在所有用户私有文件夹中的报表。因此在删除报表类型时要谨慎，并确保它不再被使用。\n\n删除自定义报表类型的最佳实践如下：\n\
  \n1. 隐藏报表类型。\n2. 运行报表以检查有多少个活动报表正在使用已识别的报表类型。我们将在本章后面详细讨论这一点。\n3. 将报表类型重命名并加上前缀（例如，加上**待删除**以及今天的日期）。此操作的目的是仅在\
  \ *x* 个月后没有活动报表使用时才删除报表类型。\n\n报表类型类别结构与标准报表文件夹非常相似，但不要将两者混淆。\n\n标准报表文件夹包含 Salesforce\
  \ 原生提供的所有标准报表；你无法覆盖它，但可以修改它并将报表另存为新报表到自定义公共报表文件夹或你的个人报表文件夹。\n\n**报表类型**类别存储所有报表类型，包括标准和自定义报表类型。你可以将自定义报表类型存储到任何**报表类型**类别中，但你无法创建或添加新的**报表类型**类别。\n\
  \n### 隐藏报表类型的动手练习\n\n使用场景：我们可用的报表类型太多，这导致用户在选择使用哪种报表类型以及某些报表类型之间的差异时感到困惑。与其删除自定义报表类型从而自动删除使用该报表类型创建的报表，不如只隐藏不再需要的现有报表类型。\n\
  \n1. 转到**报表**选项卡。\n2. 点击**新建报表**按钮。\n3. 点击**选择要隐藏的报表类型**复选框。\n4. 点击报表类别名称前的 + 图标以展开该类别中的所有报表类型。对于本练习，点击**账户与联系人**。\n\
  5. 报表类型带有绿色对勾表示该报表类型在创建新报表时可用，而带有黄色叉号的表示不可用。\n6. 点击报表类型名称可在可见和隐藏之间切换。对于本练习，点击**带资产的联系人**；图标将从绿色对勾变为黄色叉号。基于该报表类型构建的所有现有报表都不会被删除。如果报表类型用作仪表板组件的数据源报表，隐藏报表类型也不会影响仪表板。请考虑以下截图：\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_141_0.png)\n\n7. 再次点击**选择要隐藏的报表类型**以取消选择；所有被隐藏的报表类型将不再对所有用户在创建新报表时可见。\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_142_0.png)\n\n### 标准报表类型\n\n当你从**报表**选项卡点击**新建报表**按钮时，你将看到如下截图中所示的**报表类型**类别列表：\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_142_1.png)\n\n标准报表类型有两种：\n\n- Salesforce\
  \ 为标准对象提供的报表类型，例如**联系人与账户**。你很容易区分这种报表类型，因为在创建新报表时选择该报表类型时会显示**预览**。\n\n  ![](img/72d01bea5a9ccf02f9452aab7505d9de_143_0.png)\n\
  \n- 当你为自定义对象启用**允许报表**选项时自动生成的报表类型。这种报表类型不会有**预览**，而只会显示**无预览可用**。\n\n当你将一个对象关联到另一个对象且两个对象都已启用报表时，具体会发生什么取决于关系类型。在以下示例中，我们将使用\
  \ Customer（自定义对象）作为父对象，Claim（自定义对象）作为子对象。两个对象都已启用报表。让我们更仔细地查看主从关系和查找关系，并看看在建立这些对象之间的关系时报表类型会发生什么。\n\
  \n### 查找关系\n\n当你在对象之间添加查找字段关系时，报表类型相关的行为如下：\n\n- 当你为 Claim 对象激活**启用报表**时，系统将自动创建**索赔**报表类型。\n\
  - 当你以查找关系将**Claim**作为子对象关联到 Customer 对象时，系统会将 Customer 字段添加到 Claims 报表类型中。用户将看到\
  \ Claims 报表类型中可用的额外客户名称字段，但 Customer 对象的其他字段将不可用于报表。Claims 报表类型将包含有或无 Customer 的所有索赔记录：\n\
  \n  ![](img/72d01bea5a9ccf02f9452aab7505d9de_144_0.png)\n\n- 现有的**客户**报表类型不会发生变化，因为**Customer**是父对象。\n\
  - 一个名为**带客户的索赔**的新报表类型将在**其他报表**类别中创建。此报表类型将包含**Claim**和**Customer**对象的所有可用字段。\n\
  \n  ![](img/72d01bea5a9ccf02f9452aab7505d9de_145_0.png)\n\n- 此报表类型将仅显示**带客户的索赔**记录；这也意味着没有客户的**索赔**记录将不会出现在生成的报表中。\n\
  \n### 主从关系\n\n当你在对象之间添加主从关系时，报表类型相关的行为如下：\n\n- 当你为 Claim 对象激活**启用报表**时，系统将自动创建**索赔**报表类型。\n\
  - 当你以主从关系将**Claims**作为子对象关联到**Customers**对象时，现有的**Claims**报表类型将被移除，因为**Claim**对象在主从关系中成为\
  \ Customer 对象的子对象。\n- 现有的**Customers**报表类型没有变化，因为 Customer 是父对象。\n- 一个名为**带索赔的客户**的新报表类型将在**其他报表**类别文件夹中创建。请注意与前面讨论的**查找关系**部分中自动创建的报表类型的区别。此报表类型具有**Customer**和**Claim**对象的所有可用字段，并将仅显示**带索赔的客户**；这也意味着没有索赔的**客户**记录将不会出现在生成的报表中：\n\
  \n  ![](img/72d01bea5a9ccf02f9452aab7505d9de_146_0.png)\n\n让我们在矩阵中总结前述关系：\n\n| 描述\
  \ | 查找 | 主从关系 |\n|---|---|---|\n| 索赔报表类型 | 无变化，仅添加**客户**字段名 | **索赔**报表类型将被移除 |\n\
  | 客户报表类型 | 无变化 | 无变化 |\n| 新创建的报表类型 | **带客户的索赔**，包含两个对象的所有字段，仅显示有客户的索赔记录；此处主对象为**索赔**\
  \ | **带索赔的客户**，包含两个对象的所有字段，仅显示有索赔的客户记录；此处主对象为**客户** |\n\n### 自定义报表类型\n\n报表类型定义了报表可用的记录集和字段。报表类型的来源可以仅来自一个对象，也可以包含相关对象。报表类型还决定只有符合报表类型中定义的条件的记录才会在其中显示。\n\
  \n当提供的标准报表类型无法满足你的报表需求时，你的管理员可以创建自定义报表类型。自定义报表类型支持多级对象关系，从父级对象作为主对象定义，并关联到子对象和孙对象，而不是反过来。\n\
  \n让我们看一个例子——你有一个对象关系**客户 > 索赔 > 索赔付款**；在此关系中，你可以构建自定义报表类型**客户**包含**索赔**和**索赔付款**，而不是**索赔付款**包含**索赔**和**客户**。\n\
  \n使用标准报表类型部分中讨论的**客户**和**索赔**对象，在主从关系中，**带索赔的客户**报表类型将被自动创建。参见以下说明；灰色区域将是使用此报表类型时的报表结果：\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_147_0.png)\n\n在上图中，A 是客户对象，B 是索赔对象。**带索赔的客户**标准报表类型将在你关联对象时由系统自动创建。此报表类型将仅为**带索赔的客户**生成报表，而**无索赔的客户**将无法在报表中使用该报表类型获得。如果你需要生成包含所有客户的报表，可以使用**客户**报表类型，但**索赔**字段将不会在报表中可用。\n\
  \n\n\n\n\n## 理解报表类型\n\n在此场景中，自定义报表类型派上用场。我们可以创建一种客户的自定义报表类型，是否包含索赔均可。此报表类型将生成客户信息及索赔信息，即使客户没有任何索赔。此报表类型将生成包含所有客户数据的报表。请参阅以下截图中的灰色区域：\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_148_0.png)\n\n使用自定义报表类型，我们可以定义一个主对象并将其与子对象关联，其中：\n\
  \n- 主对象中的记录必须至少有一个相关对象的记录\n- 主对象中的记录可能有也可能没有相关对象的记录\n\n> 自定义报表类型从顶层对象作为**主对象**开始；它仅支持每个层级一个子对象，但允许您创建多层父子层级。\n\
  > \n> 使用自定义报表类型，您可以定义哪些对象的字段可用于报表列。如果某个字段从自定义报表类型中移除，该字段将从使用该报表类型构建的所有报表中移除。\n\n\
  ## 创建自定义报表类型的动手练习\n\n此练习仅适用于系统管理员或具有**管理自定义报表类型**权限的用户。在此练习中，我们将创建一个新的自定义报表类型，其中**客户**为主对象，它可能有也可能没有**索赔**，索赔可能有也可能没有索赔付款。请确保所有对象都已创建并已启用报表。\n\
  \n- 1. 导航到 **Setup | Feature Settings | Analytics | Reports & Dashboards | Report\
  \ Types**（或您可以在 **Setup** 菜单的 **Quick Find** 文本框中输入 `report types` 轻松找到该菜单）并单击 **New\
  \ Custom Report Type** 按钮。\n- 2. 在 **Primary Object** 中，所选对象将位于报表类型的顶层层级；在此练习中，选择\
  \ **Customers**。\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_149_0.png)\n\n> 记录类型保存后，您将无法更改主对象。\n\
  \n- 3. 输入 **Report Type Label** 和 **Report Type Name**。标签最长可达 255 个字符；对于此练习，将其标记为\
  \ `Customers with/without Claims with/without Payment`。名称将自动填充，您可以修改它，但在此练习中保持不变。\n\
  - 4. 为自定义报表类型输入 **Description**；您可以输入最多 1,000 个字符。此描述是必填项，并在用户选择报表类型创建报表时显示。提供有意义的描述，以便用户对报表可用数据有清晰了解，例如\
  \ `All customers with Claim information`。\n- 5. 选择 **Store in Category**；始终将报表类型存储在正确的类别中；为了让用户轻松找到报表类型，选择\
  \ **Other Reports**。\n- 6. 选择 **Deployment Status**；单击 **Next** 按钮继续。\n  - **In\
  \ Deployment：** 具有此状态的报表类型仅对系统管理员和具有 **Manage Custom Report Types** 或 **Customize\
  \ Application** 权限的用户可用。在设计和测试阶段选择此选项。报表类型及其报表对所有其他用户隐藏。\n  - **Deployed：** 此报表类型及其报表将对所有人可用。测试后且准备让所有用户访问时更改为此选项。\n\
  - 7. 单击 **Next** 按钮继续。\n- 8. 客户将显示为主对象；单击 **(Click to relate to another object)**\
  \ 以关联到子对象。在我们的练习中，选择 **Claims**，然后同样关联 Claims 到 **Claim Payments**。\n- 9. 单击 **Save**\
  \ 按钮完成。请考虑以下截图：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_150_0.png)\n\n## 理解报表类型\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_151_0.png)\n\n自定义报表类型从顶层对象作为主对象开始，例如，**Customer\
  \ with Claims**；此报表将获取所有有索赔和无索赔的客户。但如果您想报告所有索赔及客户信息，而不管是否链接到客户 - **Claim with Customers**\
  \ 呢。\n\n您仍然可以为此场景使用自定义报表类型。将索赔设为主对象而不关联到其他对象，然后使用 **Add fields related via lookup**\
  \ » 添加来自客户对象的字段。\n\n## 扩展自定义报表类型的动手练习\n\n让我们修改前面创建的 **Customers with/without Claims\
  \ with/without Payment** 报表类型，以满足以下要求：\n\n- 索赔对象还具有对 **Policy** 自定义对象的查找关系。我们希望从\
  \ **Policy** 对象获取状态字段。\n- 由于隐私原因，管理层决定不让用户在报表中使用 **Customer** 对象下的名为 **Tier** 的字段。\n\
  \n根据这些要求，让我们打开并编辑创建的报表类型：\n\n- 1. 通过导航到 **Setup | Feature Settings | Analytics |\
  \ Reports & Dashboards | Report Types**（或您可以在 **Setup** 菜单的 **Quick Find** 文本框中输入\
  \ *report types* 轻松找到该菜单）打开创建的报表类型并单击报表类型名称。\n- 2. 现在，您应该在该报表类型中看到 **Fields Available\
  \ for Reports** 部分。单击 **Edit Layout** 按钮将 **Policy Status** 字段添加到报表类型；默认情况下，策略相关字段不会对报表类型可用，如以下截图所示：\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_152_0.png)\n\n- 3. 将视图更改为 **Claim Fields**，然后在\
  \ Lookup 下方单击 **Add fields related via lookup »**。由于 **Policy** 是来自索赔对象的查找字段，您应该在此处看到\
  \ **Policy »** 链接。请考虑以下截图：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_153_0.png)\n\
  \n- 4. 选择 **Status** 旁边的复选框，然后单击 **OK** 按钮。\n- 5. 现在您应该看到 Status（带放大镜图标）已添加到 Claims\
  \ 部分。\n- 6. 接下来，我们希望从 **Customers** 中移除 **Tier** 字段；只需将 **Tier** 字段拖放到右侧的 **Customers\
  \ Fields** 面板中，如以下截图所示：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_154_0.png)\n\
  \n- 7. 单击保存按钮。\n- 8. 请注意，在 Fields Available for Reports 部分，Customers 字段现在变为七个字段，Claims\
  \ 变为 10 个字段。\n\n## 使用自定义报表类型的动手练习\n\n在此练习中，我们将使用前面练习中创建和编辑的报表类型：\n\n- 1. 单击 Reports\
  \ 选项卡，然后单击 New Report... 按钮。\n- 2. 在 Select Report Type 下的 Quick Find 文本框中输入 customer。\n\
  - 3. 选择 Customers with/without Claims with/without Payment，然后单击 Create 按钮。\n- 5.\
  \ 选择此报表类型时默认添加了三个字段-- **Customer Name, Claim Name, Claim Payment Name**。以下截图显示有三个字段被选中。因此，如果您想添加更多默认字段，例如\
  \ **Policy: Status**，双击该字段并选择 **Checked by Default** 复选框。请考虑以下截图：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_156_0.png)\n\
  \n- 6. 我们不打算存储此报表，因此可以忽略此处的报表生成器。但是，如果您想保存报表，请随意将其保存到您的个人报表文件夹。\n\n## 自定义报表类型的限制和优势\n\
  \n在阅读本章时，我们可以利用自定义报表类型实现以下功能：\n\n- 过滤与子对象相关的报表结果\n- 使用来自父对象的查找字段扩展报表\n- 隐藏字段将不可用于报表\n\
  - 设置创建新报表时添加的默认字段\n\n实施自定义报表类型时的一些限制如下：\n\n- 自定义报表类型最多可包含 60 个对象引用。\n- 每个自定义报表类型最多可添加\
  \ 1,000 个字段。\n- 报表类型名称的最大长度为 50 个字符，包括空格。\n\n\n\n\n\n- 有一些标准字段不适用于自定义报表类型，例如**产品计划**字段、个案和机会上的**年龄**字段等。\n\
  - 如果在创建报表类型后，向与该报表类型关联的对象添加字段，则新添加的字段默认不会在该报表类型中可用。管理员需要手动将这些字段添加到报表类型中。\n- 一个报表类型最多可以关联四级对象关系，每一级只能包含一个对象。\n\
  \n## 自定义报表类型的使用技巧\n\n为了以更低的维护成本充分利用自定义报表类型，作为管理员，在实施报表类型时，你需要注意以下几点：\n\n- 当在对象中创建新字段时，如果需要将新添加的字段添加到某个报表类型，请检查所有现有的报表类型。\n\
  - 始终使用能够反映报表类型内容和筛选条件的名称。在本章前面讨论的练习中，我们使用了**有/无索赔且有/无付款的客户**作为名称，它说明了主对象是什么以及它与子对象的关系。\n\
  - 始终添加有意义的**描述**。描述是必填项，并且对创建报表的用户可见。\n- 自定义报表类型会添加到报表类别的底部。如果你是创建报表类型的人，请提醒具有创建报表权限的用户。\n\
  - 记得将报表类型状态改为**已部署**；否则，你的用户在构建报表时将看不到该报表；请参阅*创建自定义报表类型的动手练习*一节。\n- 如果当前报表类型需要重大更改，例如添加或编辑对象关系，建议将该报表类型克隆为一个新报表类型，以免影响使用该报表类型构建的现有报表。\n\
  - 需要时更改字段分区文件夹名称。默认情况下，分区文件夹名称与对象名称一致。该名称会出现在报表生成器中，因此，当你从报表类型设置中更改它时，报表生成器中的分区文件夹名称也会随之更改。\n\
  - 轻松隐藏未使用的报表类型（标准和自定义报表类型），这样你的用户就不会被过多的报表类型所困扰。其中一些可能不再需要，如果你确定它们未在活跃报表中使用，可以在隐藏几个月后将其删除。\n\
  \n## 总结\n\n在本章中，我们详细介绍了报表类型，并探讨了为什么报表类型在构建报表时如此重要。我们还看到，当你为报表启用某个对象时，系统会自动为自定义对象生成新的报表类型。\n\
  \nSalesforce中有两种众所周知的关联类型：当将一个对象与另一个对象关联时，可以使用查找关系和主从关系。我们讨论了这如何影响报表类型。我们介绍了如何扩展父对象中的字段，以及如何移除用户无法在报表中使用的字段。\n\
  \n最后，我们分享了使用自定义报表类型的好处和限制，并意识到其中一个限制是，大多数人在添加新字段时会发现这些字段在报表类型中不可用。管理员需要手动添加它们；而使用标准报表类型时，当添加新字段时，对象的所有字段都会被自动添加。\n\
  \n在下一章中，我们将讨论与报表相关的更高级功能，包括自定义汇总公式、桶字段、向报表添加图表、向页面布局添加图表以及计划报表。\n"
- "## 高级报表配置\n\n你在第5章*理解报表类型*中详细学习了报表类型。在该章中，我们介绍了什么是报表类型，以及为什么报表类型对于构建报表如此重要。我们还讨论了报表类型类别、标准报表类型、自定义报表类型，并以一个动手练习结束：创建自定义报表类型、扩展自定义报表类型，以及通过创建新报表来应用它。\n\
  \n在本章中，我们将继续介绍桶字段和自定义汇总公式。与报表类型不同，创建报表时必须选择报表类型；桶字段和自定义汇总公式是可选的，你可以使用也可以不使用它们。但在许多场景下，我们可以利用这些功能来构建高级报表，例如使用自定义汇总公式按月显示百分比增长趋势。\n\
  \n学完本章后，你将完全理解桶字段的好处以及如何使用自定义汇总公式，这将有助于你构建报表。桶字段和自定义汇总公式都适用于Classic和Lightning环境，在Classic和Lightning环境中配置它们没有区别。\n\
  \n在本章中，我们将提供注释和提示，帮助你理解重要内容。将涵盖以下主题：\n\n- 使用桶字段对数据进行分类以用于报表\n- 介绍并创建自定义汇总公式\n- 自定义汇总公式中可用的函数\n\
  - 相关函数：`PARENTGROUPVAL` 和 `PREVGROUPVAL`\n\n### 对报表中的数据进行分类\n\n在第4章*创建和管理报表*中，我们使用**摘要格式**按可用字段将报表分组为多个级别。生成的报表将以分组形式显示，组的数量取决于用于分组的字段返回的值。这意味着，如果报表中没有返回某个值，该值将根本不会显示在分组中。例如，如果你按月份分组，可能会发现某些月份没有记录，因此这些月份不会显示。\n\
  \n如果我们需要将某个字段的多个值归类到一个类别中呢？使用`CASE()`函数创建公式字段可能是一种解决方案，但请思考该公式字段会被多频繁地使用，或者该公式字段是否只用于一个报表？该分类是整个组织的标准，还是仅适用于某个报表？此外，只有系统管理员才能创建公式字段。\n\
  \n如果答案仅是用于一个或极少数报表，而不是整个组织的标准，那么创建新的公式字段并不是一个好方案；此外，一个对象中可创建的公式字段数量是有上限的。对于这两种场景，桶字段就应运而生。\n\
  \n### 桶字段\n\n那么什么是桶字段？它是Salesforce在报表中提供的一项非常强大的功能。它允许你在报表中快速对某个字段的值进行分类，而无需在对象级别创建自定义公式字段。创建桶字段时，你可以根据记录值将多个类别定义到组中；该桶字段不会影响其他报表或对象本身。\n\
  \n例如，在**客户类型**中有以下值：\n\n- **潜在客户**\n- **客户 - 直接**\n- **客户 - 渠道**\n- **渠道合作伙伴/经销商**\n\
  - **安装合作伙伴**\n- **技术合作伙伴**\n- **其他**\n\n你需要将所有包含 Customer 的客户类型归类为**客户**，所有包含 Partner\
  \ 的**客户类型**归类为**合作伙伴**，所有包含 Prospect 的**客户类型**归类为**潜在客户**，其余归类为**其他**。使用桶字段，你将获得一个新字段，而无需专门在客户对象中创建自定义公式字段。对于此场景，桶字段将包含以下值：\n\
  \n- **潜在客户**\n- **客户**\n- **合作伙伴**\n- **其他**\n\n这些值仅适用于所配置的特定报表。\n\n大多数报表格式都支持桶字段：**表格**、**摘要**和**矩阵**。但是，**联接**报表不支持桶字段。当你将报表格式更改为另一种格式时，桶字段会保留。如果你有一个包含桶字段的报表，然后将报表格式更改为联接报表，则桶字段会被移除。\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_161_0.png)\n\n一份报表中最多可以添加五个桶字段。每个桶字段最多可包含20个桶。\n\
  \n可以使用以下字段类型作为桶字段的源字段：\n\n- **数字、货币、百分比**\n- **选择列表**\n- **文本**\n- **查找**\n\n这包括**公式**字段和**累计汇总**字段，它们返回前面所示的字段类型。\n\
  \n以下字段类型不能用作桶字段的源字段：\n\n- **日期和日期/时间——虽然桶字段不支持这些类型，但你仍然可以通过使用“摘要”和“矩阵”报表中讨论的“分组依据”功能来实现与桶字段类似的概念**\n\
  - **复选框——你可以创建一个返回1或0的自定义公式字段，或者一个返回文本“是/否”或“真/假”的自定义公式字段，然后在你的桶字段中使用该自定义公式字段**\n\
  - **电子邮件**\n\n\n\n\n\n- Phone\n- Picklist (Multi-Select)\n- Text Area, Long Text\
  \ Area, and Rich Text Area\n- URL\n\n## 为报表添加桶字段的动手练习\n\n在本练习中，我们将创建一个 Account 报表，并将包含\
  \ Customer 的所有 Account Type 分类为 Customer，将包含 Partner 的所有 Account Type 分类为 Partner，将包含\
  \ Prospect 的所有 Account Type 分类为 Prospect，其余的分类为 Other：\n\n- 1. 导航到 Reports 选项卡并点击\
  \ New Report... 按钮。\n- 2. 选择 Accounts 报表类型并点击 Accounts & Contacts 类别下的加号。\n- 3.\
  \ 点击 Create 按钮继续。\n- 4. 将 Show 改为 All Accounts。\n- 5. 将 Date Field Range 改为 All\
  \ Time。\n- 6. 点击 Remove All Columns 以清除报表中的所有列。此链接在您想要创建一个没有任何默认字段的新报表时很有用。\n- 7.\
  \ 通过在左侧面板中双击字段来添加 Account Name 和 Account Owner。\n- 8. 在左上角面板的 Bucket Fields 下双击\
  \ Add Bucket Field（或将其拖到报表区域）。\n- 9. 将 Source Column 设置为 Type。\n- 10. 在 Bucket Field\
  \ Name 中输入 Type (Core)。\n- 11. 点击 New Bucket 按钮并输入 Customer。对 Partner 和 Prospect\
  \ 重复相同的操作。\n- 12. 选择所有 Type contains Customer 并点击 Move To 按钮。然后选择 Customer，您会注意到所选的\
  \ picklist 字段上添加了桶标签。对 Partner 和 Prospect 重复操作。\n\n13. 勾选 Show Unbucketed values\
  \ as \"Other.\" 以将剩余部分分类为 Other。这在以下截图中显示：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_163_0.png)\n\
  \n14. 点击 OK 按钮继续。您会注意到报表中新增了一列 Type (Core)，标签前带有桶图标。\n\n15. 点击 Save 按钮并输入以下详细信息：\n\
  \n- Report Name 为 Account with Bucket Fields\n- Report Folder 为 My Personal Custom\
  \ Reports\n- 再次点击 Save 按钮\n\n16. 点击 **Run Report** 按钮生成报表。报表将如下所示：\n\n| ACCOUNT\
  \ NAME | ACCOUNT OWNER ↑ | TYPE (CORE) |\n|---|---|---|\n| United Oil & Gas, UK\
  \ | Alvin Lee | Customer |\n| United Oil & Gas Corp. | Alvin Lee | Customer |\n\
  | Element Industry Ltd | Alvin Lee | Prospect |\n| Accurate Glass | Alvin Lee |\
  \ Customer |\n| Mass-100 | Alvin Lee | Other |\n| PMA Manufacturing | Johan Yu |\
  \ Prospect |\n\n17. 点击 **Save As** 按钮：\n\n- **Report Name** 为 **Account with Bucket\
  \ Fields**\n- **Report Folder** 为 **My Personal Custom Reports**\n\n您可以将桶字段视为普通字段，您可以对以下项目使用桶字段：\n\
  \n- 用作 **Summary** 和 **Matrix** 报表的分组\n- 用作报表筛选器\n- 用于报表排序\n- 在导出报表时可用；我们将在本章后面讨论导出报表\n\
  - 当您在左侧面板输入以筛选字段时，会包含在字段搜索结果中\n\n## 根据源字段类型创建桶字段\n\n在前面的示例中，我们使用了 picklist 字段作为源字段；然而，不同的字段类型在定义桶字段时会有不同的方法。\n\
  \n在以下各节中，我们将讨论如何使用不同类型的字段作为字段源来创建桶字段。\n\n### Picklist 字段\n\n通过以 picklist 作为字段源创建桶字段，您将能够将\
  \ picklist 值分类到更小的类别中。使用 picklist 字段作为桶字段的源字段类型时需要注意以下几点：\n\n- 选择 picklist 值并将其移入桶中\n\
  - 一个 picklist 不能被分类到多个桶中\n- 并非所有 picklist 字段都可作为桶的源，例如记录类型\n- 如果您未选择 **Show unbucketed\
  \ values as \"Other,\"**，未被桶捕获的所有值将如以下截图所示：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_165_0.png)\n\
  \n### Currency、Number 和 Percent 字段\n\n通过以货币、数字和百分比作为字段源创建桶字段，您将能够对可以用数字描述的数据进行排序。使用这些字段类型创建桶字段时需要注意以下几点：\n\
  \n- 您需要为小范围和大范围值至少设置两个桶\n- 您可以添加多个桶范围，最多总共 20 个桶\n- 如果您未勾选 Treat empty <field name>values\
  \ in the report as zeros，源列的空白值将如下所示：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_166_0.png)\n\
  \n## 编辑桶字段\n\n您可以通过将鼠标悬停在左上角面板中的桶字段上，然后点击铅笔图标来编辑桶字段。您可以通过点击铅笔图标旁边的垃圾桶图标来删除桶字段。\n\
  \n点击铅笔图标将打开桶字段窗口；要从桶字段值中移除所选值，请执行以下步骤：\n\n- 1. 点击该桶；它将显示为该桶所选的所有值。\n- 2. 点击复选框以选择该值。\n\
  - 3. 点击 Move To 按钮，然后点击 Unbucketed Values 或另一个桶。请考虑以下截图：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_168_0.png)\n\
  \n## 自定义汇总公式\n\n不要将报表中的自定义汇总公式与对象的公式字段混淆。它们是完全不同的事物，彼此没有任何关系，尽管它们都有公式。\n\n自定义汇总公式仅在\
  \ Summary、Matrix 和 Joined 报表中可用。使用自定义汇总公式可根据报表中可用的数值字段或记录计数计算额外的总计。前面本章讨论的桶字段也是如此。在报表中创建的自定义汇总公式不会影响其他任何地方，也与其它报表无关。\n\
  \n当您需要从 Lookup 或 Master-Detail Relationship 对象获取值时，公式字段才是答案；您不能将自定义汇总公式用于此目的。因此，每当您需要为任何用途（包括报表）从父\
  \ lookup 对象获取字段值时，请创建公式字段，然后将其从页面布局中隐藏。但是，只有系统管理员才能创建公式字段。\n\n当您创建自定义汇总公式时，您需要定义返回的格式以及要返回的小数位数。以下是自定义汇总公式可返回的格式选项：\n\
  \n- Currency\n- Number\n- Percent\n\n只有以下字段类型可用于自定义汇总公式的公式中：\n\n- Currency\n- Number\n\
  - Percent\n- Record Count\n- 您还可以使用公式字段和汇总求和字段，这些字段返回上述字段类型\n- 与报表中的汇总字段选项类似，您可以在自定义汇总公式中使用这些选项：Sum、Max、Min\
  \ 和 Average；例如，`Account.Number_of_Branch__c:SUM`\n\n## Summary 和 Matrix 报表中的自定义汇总公式\n\
  \n在 Summary 报表中，自定义汇总公式可以显示在：\n\n- **All summary levels**：这与字段汇总类似\n- **Grand summary\
  \ only**：这与总计相同\n- **Grouping**：此选项具有 1 或 2 或 3 级（取决于报表中添加了多少个分组级别）\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_170_0.png)\n\
  \n前面的截图取自具有两个分组级别的 Summary 报表，Opportunity Owner 和 Type。\n\n对于 Matrix 报表，自定义汇总公式可以显示在：\n\
  \n- **All summary levels.**\n- **A specific row/column grouping level...**；选择此选项后，您将可以选择对行\
  \ (A) 和列 (B) 分组使用字段或 Grand Summary。如果您有多个行或列分组级别，您可以选择其中任何一个。\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_170_1.png)\n\
  \n前面的截图取自具有两个行分组级别（标记为 A）的 Matrix 报表，Opportunity Owner（第一级）和 Closed（第二级），以及一个列分组级别（标记为\
  \ B）：Type。\n\n\n\n\n\n## 高级报表配置\n\n- 1. 转到 **Reports** 选项卡并点击 **New Report...**\
  \ 按钮。\n- 2. 选择 **Accounts** 报表类型并在 **Accounts & Contacts** 类别下点击加号。\n- 3. 点击 **Create**\
  \ 按钮继续。\n- 4. 将 **Show** 改为 **All accounts**。\n- 5. 将 **Date Field Range** 改为 **All\
  \ Time**。\n- 6. 将格式改为 **Summary** 并点击 **Remove All Columns**。\n- 7. 从 **Fields**\
  \ 面板向报表添加 **Account Name** 和 **Type**。\n- 8. 将 **Account Owner** 拖到分组区域。\n- 9. 在左侧面板的\
  \ **Fields** 下双击 **Add Formula**。如下图所示：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_172_0.png)\n\
  \n- 10. 输入 **Column Name** 为 `Total Open Opportunities`。\n- 11. 输入 **Description**\
  \ 为 `Total Amount of Open Opportunities`。\n- 12. 选择 **Format** 为 **Currency** 和\
  \ **Decimal Places** 为 **2**。\n\n## 高级报表配置\n\n- 13. 选择 **Grand summary only**。\n\
  - 14. 在 **Formula** 字段中，导航到 **Summary Fields | Total Amount of Open Opportunities\
  \ | Sum**。请考虑以下截图：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_173_0.png)\n\n- 15.\
  \ 公式将自动填充为 **Account.Total_Amount_of_Open_Opportunities__c:SUM**。\n- 16. 点击 **OK**\
  \ 按钮并注意公式和报表列中添加的 **Total Open Opportunities** 选项。\n- 17. 请注意，公式汇总字段始终添加到报表的最后一列，并且您无法将其向左移动。\n\
  - 18. 将报表保存为 **Open Opportunities**。\n- 19. 点击 **Run Report**。\n\n以下是报表结果：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_174_0.png)\n\
  \n## 高级报表配置\n\n20. 现在让我们通过将鼠标悬停在 **Total Open Opportunities** 公式上然后点击铅笔图标来更改公式。\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_175_0.png)\n\n要编辑或删除公式，当报表处于报表构建器中时，将鼠标悬停在公式上并点击铅笔图标或垃圾桶图标；这与桶字段相同。\n\
  \n21. 从 **Grand summary only** 改为 **All summary levels**。如下图所示：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_175_1.png)\n\
