  \ |\n| 总计（2 条记录） |  |  |  |  |  |\n\n## 从 AppExchange 获取更多\n\n如果你不熟悉 AppExchange，它是\
  \ Salesforce.com 为 Salesforce 用户托管的商业应用商店。你可以找到成千上万的应用安装到你的 Salesforce 实例中，以满足或增强你的业务需求。其中一些应用是免费的，而许多应用需要许可费用。它们由\
  \ Salesforce 合作伙伴构建。此外，还有一些由 Salesforce Labs 提供的示例应用。Salesforce Labs 不支持他们在 AppExchange\
  \ 上发布的应用，但它提供了许多 Salesforce 功能的示例，帮助管理员学习如何使用这些功能。\n\n从 AppExchange 安装的应用被视为第三方应用，这意味着它不受\
  \ Salesforce 支持团队的支持。对于付费应用，通常由开发者为其应用提供支持。\n\n要访问 Salesforce AppExchange，请导航至 https://appexchange.salesforce.com，在那里你可以找到许多应用，或者你可以在文本框中借助关键字搜索它们。\n\
  \n要查找与仪表盘相关的应用，请在搜索文本框中键入 dashboard，你将获得许多由 Salesforce Labs 构建的仪表盘应用，你可以免费安装和使用它们，还有由\
  \ Salesforce 合作伙伴构建的应用，这些应用要么免费，要么付费。\n\n在将应用安装到生产环境之前，先将其安装到沙盒中进行试用总是一个好习惯。此外，即使你安装了\
  \ AppExchange 包，你也可以将其卸载，而不会对你的其他 Salesforce 组织造成任何问题。\n\n以下是一些由 Salesforce Labs\
  \ 构建的仪表盘应用：\n\n- SALESFORCE CRM DASHBOARDS\n- SALES ACTIVITY DASHBOARD\n- SERVICE\
  \ & SUPPORT DASHBOARDS\n- SALESFORCE1 ADOPTION DASHBOARD AND REPORTS\n\n\n\n\n\n\
  ## 学习高级仪表板配置\n\n4. 点击 **Get It Now** 按钮，如下图所示：\n\n   ![](img/72d01bea5a9ccf02f9452aab7505d9de_314_0.png)\n\
  \n5. 点击 **Log in to the AppExchange** 按钮，使用你的 Salesforce 凭据登录。\n\n6. 现在点击 **Install\
  \ in Production** 或 **Install in Sandbox** 按钮，如下面的截图所示：\n\n   ![](img/72d01bea5a9ccf02f9452aab7505d9de_315_0.png)\n\
