  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_372_0.png)\n\n### 动态仪表板\n\n当你在 Salesforce1\
  \ 移动应用中打开动态仪表板时，如果你有权限以其他用户的身份运行该仪表板，你也可以在移动应用中执行相同操作。点击“查看身份”图标，然后选择一位用户。如下图所示：\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_373_0.png)\n\n### 仪表板筛选器\n\n当你在 Salesforce1\
  \ 应用中打开配置了筛选器的仪表板时，你也可以从移动应用对仪表板进行筛选。点击“筛选器”图标，然后选择已定义的筛选器。如下图所示：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_374_0.png)\n\
  \n### 将仪表板快照分享到 Chatter 动态\n\n如果你还记得，在第11章“报告和仪表板的高级提示与技巧”中，我们解释了从浏览器中的 Salesforce\
  \ 将仪表板快照发布到仪表板动态或用户/群组动态的功能。你也可以在 Salesforce1 应用中执行相同操作。你可以将仪表板快照发布到你的动态中，并提及另一位用户或\
  \ Chatter 群组，操作如下：\n\n1. 从 Salesforce1 应用打开仪表板。\n2. 点击选择仪表板组件；注意组件周围的蓝色虚线——图表右上角会出现展开图标。如下图所示：\n\
  \n    ![](img/72d01bea5a9ccf02f9452aab7505d9de_375_0.png)\n\n3. 点击展开图标以全屏打开图表。\n\
  4. 在仪表板底部找到“分享”图标。\n5. 点击“分享”图标，然后在分享窗口中输入你想要的文本。你可以通过点击头像图标来提及用户或 Chatter 群组，或输入以\
  \ @ 开头的文本。如果 Chatter 电子邮件通知已启用“评论中提及我”，用户将收到一封电子邮件。请看下面的截图：\n\n    ![](img/72d01bea5a9ccf02f9452aab7505d9de_376_0.png)\n\
  \n6. 当其他用户查看你的 **Chatter** 页面时，他们会看到你 **Chatter** 动态中的仪表板快照。如下图所示：\n\n    ![](img/72d01bea5a9ccf02f9452aab7505d9de_377_0.png)\n\
  \n### 更改组件图表类型\n\n我们无法在 Salesforce1 中从头创建仪表板，而且似乎也没有必要在移动中创建仪表板，但你可以在 Salesforce1\
  \ 应用中更改组件图表，尽管可能无法保存。我们来详细讨论一下：\n\n1. 从 Salesforce1 应用打开仪表板。\n2. 点击仪表板组件；图表右上角会出现展开图标。\n\
  3. 点击展开图标以全屏打开图表。\n4. 找到并点击通知图标下方的齿轮图标。\n5. 系统将为你提供更改图表类型的机会，以便轻松分析数据。\n6. 完成后点击“完成”。图表会更改，但不会保存。\n\
  7. 当源报告中有多个分组时，你会看到堆叠条形图选项。如下图所示：\n\n    ![](img/72d01bea5a9ccf02f9452aab7505d9de_378_0.png)\n\
  \n### 图表详细信息和报告\n\n当仪表板在 Salesforce1 应用中打开时，与在浏览器中打开一样，你也可以点击图表的某个片段以获取该片段的更多信息。\n\
  \n当你展开仪表板时，你会看到图表下方的报告；你仍然可以点击图表的某个片段以获取更多信息。不仅如此，图表下方的报告也会根据所点击的图表分组进行筛选，如下图所示：\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_379_0.png)\n\n请注意上图中的情况：当我们点击条形时，图表下方显示记录被刷新了；从这里，你还可以看到关于该条形的更多信息，例如：金额合计。\n\
  \n### 在 Salesforce1 应用中处理报告\n\n在 Salesforce1 移动应用中有几种访问报告的选项。让我们详细讨论它们。\n\n### 报告菜单项\n\
  \n如果你在 Salesforce1 应用菜单中没有看到“报告”菜单，请确保添加它——导航到“设置 | 应用 | 移动应用 | Salesforce1 导航”，选择“报告”，然后添加所选项目。如下图所示：\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_380_0.png)\n\n### Salesforce1 移动应用中的仪表板和报告\n\
  \n当你在 Salesforce1 移动应用中打开报告时，报告格式将被忽略。**摘要**和**矩阵**格式的报告将仅以列的形式呈现，类似于**表格**报告。如果报告添加了图表，在\
  \ Salesforce1 中打开报告时该图表将不可见。\n\n在**表格**格式报告中，第一列将被冻结，因此当你向右滚动查看更多列时，第一列保持可见。对于**摘要**和**矩阵**报告，第一列（而非分组字段）将被冻结，而用作分组的字段将位于最后几列。\n\
  \n你可以通过点击列标题对报告进行排序；默认情况下，将按升序排序——你可以再次点击标题将其改为降序排序。\n\n### 从仪表板下钻\n\n如你所知，报告是仪表板的数据源。当你在\
  \ Salesforce1 移动应用中选择并展开仪表板组件时，你可以下钻到用作数据源的报告。报告打开时，会在报告上方显示图表。如果原始报告添加了图表，原始图表不会在\
  \ Salesforce1 移动应用中显示。\n\n你可以通过点击报告图表中的分组来基于仪表板分组筛选报告中的数据，**表格**和**矩阵**组件除外。当你点击图表中的某个项目时，系统会提示你显示该片段的更多信息，生成报告将自动刷新并按所选的片段进行筛选。如下图所示：\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_382_0.png)\n\n在上图中，两张截图来自同一份报告。左侧选择了阶段为“资格认定”，其下方的报告已按所有者“Johan\
  \ Yu”和阶段“资格认定”自动筛选。右侧选择了阶段为“价值主张”的条形，报告已按阶段“价值主张”自动筛选。\n\n### 下钻到记录\n\n当报告列是对象的名称时，你可以点击它以打开记录详情，例如**账户名称、机会名称、机会所有者**等。在记录详情页面，点击左上角的箭头可返回到报告。\n\
  \n### 离线访问\n\nSalesforce1 应用支持离线访问。你可以读取、创建和编辑最近访问过的现有记录。当重新连接到互联网时，新增或修改的数据将自动同步回\
  \ Salesforce。待同步的记录将用绿色三角形和白色箭头标记。但是，Salesforce 移动 Web 浏览器不支持离线访问。\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_383_0.png)\n\
  \n要为 Salesforce1 应用启用离线支持，请导航到**设置 | 应用 | 移动应用 | Salesforce1 离线**，勾选**在 Salesforce1\
  \ 中启用缓存**，并勾选**在 Salesforce1 中启用离线创建、编辑和删除**。这仅适用于你设备上安装的 Salesforce1 应用，不适用于 Salesforce1\
  \ 移动浏览器应用。\n\n启用离线设置后，你还可以在离线模式下访问最近打开的报告和仪表板，包括下钻到记录详情。\n\n### Salesforce1 应用的局限性\n\
  \n从移动应用访问仪表板报告存在一些局限性，但由于该应用对于移动访问非常有用，你可能不需要在小屏幕设备上使用仪表板报告的全部功能。\n\n以下是该应用的一些局限性总结：\n\
  \n- 无法创建和编辑仪表板及报告\n- 无法修改仪表板组件\n- 报告格式被忽略\n- 报告中添加的图表不可用\n- **Chatter** 动态不可用\n\n\
