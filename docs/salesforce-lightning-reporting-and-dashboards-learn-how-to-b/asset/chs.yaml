  \n一旦创建了报表，你可以将其私有保存、与其他用户共享、在报表中的数据发生变化并满足设定条件时订阅通知，也可以将其安排为定时发送给自己和其他用户。\n\n在 Salesforce\
  \ 中，报表是构建仪表盘的基本要求。仪表盘中的每个组件都需要有一个报表作为数据源。你可以在同一个仪表盘中的多个组件中重复使用同一个报表，也可以在多个仪表盘之间共享该报表。\n\
  \n你可以使用对象中可用的任何字段（无论字段类型是什么），也可以使用多个对象中的字段来创建报表。你需要对该对象和字段具有读取访问权限，但不需要拥有编辑数据的权限。如果你需要了解更多关于对象、字段和字段类型的信息，请参阅第\
  \ 1 章《Salesforce 报表和仪表盘基础》中的“Salesforce 对象模型”一节。正如你现在所看到的，对象和字段是创建报表的基础。\n\n## 生成报表和仪表盘\n\
  \n当你点击一个报表时，Salesforce 会在几秒钟内即时生成该报表，报表中显示的数据是来自你 Salesforce 组织的实时数据。但如果我想查看昨天或上周的数据呢？不行，你只能针对当前数据生成报表。如果你想查看历史数据，可以设置\
  \ Reporting Snapshot 或 Field History，但这不是某一特定日期的完整数据快照。\n\n在报表中，你只能看到你拥有访问权限的对象和字段，即使该报表是由其他人创建的。这意味着，对于同一个报表，你看到的字段或列可能会少于其他用户，因为你没有这些字段的权限。\n\
  \n同样，对于数据集，如果某条记录在 Salesforce 中对你是不可见的，你在报表中也不会看到它。这被称为对象共享设置和对象权限。\n\n然而，仪表盘的情况则有所不同。当你打开一个仪表盘时，它显示的是截至上一次仪表盘刷新时的数据。如果仪表盘最后一次刷新是由你的同事完成的，你将看到的是你同事上次刷新时的数据，你也可以手动刷新。Salesforce\
  \ 提供了自动刷新仪表盘的功能，但存在一定限制。\n\n## 报表和仪表盘文件夹\n\n报表和仪表盘存储在 Salesforce 中的什么位置？它们存储在**文件夹**中。你可以创建和存储的报表与仪表盘数量没有限制。为报表创建的文件夹只能用于存储报表，而为仪表盘创建的文件夹只能用于存储仪表盘。为了简化本书内容，我们称之为报表文件夹和仪表盘文件夹。\n\
  \n你可以在这里把文件夹想象成类似于 Windows 资源管理器中的文件夹，但没有驱动器，也没有子文件夹，它不存储文件，而是根据文件夹类型用来存储报表或仪表盘。作为文件夹管理员，你可以将文件夹的可见性共享给特定用户、角色、角色及其下属，或公共组。\n\
  \nSalesforce 中用于报表和仪表盘的文件夹类型：\n\n- 私有文件夹\n- 未归类的公共文件夹（仅用于报表）\n- 公共文件夹\n\n### 私有文件夹\n\
  \n私有文件夹是每个 Salesforce 用户都可使用的特殊文件夹，对于报表文件夹，它也被称为**我的个人自定义报表**文件夹。对于仪表盘，它被称为**我的个人仪表盘**（Classic\
  \ 界面）或**私有仪表盘**（Lightning Experience 界面）。在 Lightning Experience 中，存储在此文件夹中的报表被称为**私有报表**。\n\
  \n### 未归类的公共文件夹\n\nClassic 中的**未归类的公共报表**文件夹，在 Lightning Experience 中也被称为**公共报表**文件夹，是另一个特殊的报表文件夹。存储在此报表文件夹中的报表可供所有用户访问。如果你还拥有创建和自定义报表的权限，你就能将报表存入此文件夹。\n\
  \n### 公共文件夹\n\n要创建公共文件夹，你需要拥有创建报表文件夹或仪表盘文件夹的权限（我们将在第 3 章《在报表和仪表盘中实现安全性》中讨论与文件夹相关的所有权限）。公共文件夹是你为存储报表和仪表盘而创建的文件夹；通常，该文件夹会由许多用户共享。\n\
  \n创建新报表后，你需要保存报表才能运行它。你可以将报表存储在公共文件夹中，以便与同事共享，供将来使用或其他用途，例如作为仪表盘的数据源，或用于电子邮件发送。根据用户权限和文件夹级访问权限，这将决定文件夹对用户是否可见、可访问——是只读还是可读写。请记住，报表的可访问性是在文件夹级别配置的，而不是在报表本身中配置的。\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_50_0.png)\n\n当文件夹对用户可见时，该用户将能够查看并运行存储在该文件夹中的所有报表。因此，控制不是按报表进行的，而是按文件夹进行的。\n\
  \n当你从 AppExchange 安装应用时，某些应用会自带的报表，这些报表将存储在其自己的文件夹中。该文件夹会在你安装应用时创建。\n\n## 报表与仪表盘中的概念和权限\n\
  \n点击“报表”选项卡，然后点击“所有文件夹”，即可查看你有权访问的所有报表文件夹。让我们比较一下不同用户的情况。以下截图来自一个管理员，该管理员可以访问所有文件夹：\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_51_0.png)\n\n将上面的截图与下面这张来自销售用户的截图进行比较。该销售用户只能看到一个文件夹，而不是像上面的截图那样看到三个文件夹。报表文件夹管理员可以为每个用户设置文件夹可访问性：\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_52_0.png)\n\n每个公共文件夹只能存储报表或仪表盘，不能同时存储两者。一个好的做法是为报表名称和文件夹名称制定良好的命名模式，例如，用\
  \ “NA Sales Reports” 作为存储所有北美销售相关报表的文件夹名称，用 “EMEA Sales Dashboards” 作为存储所有与 EMEA\
  \ 销售相关的仪表盘文件夹名称。这将帮助你和其他用户轻松找到报表，并保持内容井然有序。\n\n\n\n\n\n## 标准报表和报表文件夹\n\n当你开始使用 Salesforce\
  \ 时，默认情况下，Salesforce 自带许多用于不同目的的标准报表。它们按对象名称和用途进行存储和分类，例如“客户和联系人报表”、“机会报表”等。\n\n\
  从 Summer '17 版本开始，带有文件夹的标准报表仅在 Classic 中可见，在 Lightning Experience 中尚不可见。\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_53_0.png)\n\
  \n上面的截图来自 Classic（请参阅*第1章，Salesforce 报表和仪表板基础知识*中的*切换到 Lightning Experience*部分，了解如何在\
  \ Classic 和 Lightning Experience 之间切换）。请注意，在 Classic 中，当你点击**报表**选项卡时，你会看到来自报表和仪表板的内容，并且你可以通过查看文件夹名称前的不同图标轻松区分报表文件夹和仪表板文件夹。\n\
  \n在 Classic 中，你可以在选项卡内进行搜索，而在 Lightning Experience 中，报表和仪表板位于不同的选项卡中。选项卡中没有搜索框，但你可以使用全局搜索来搜索报表和仪表板。\n\
  \n## 创建报表和仪表板文件夹\n\n在 Salesforce 中创建报表文件夹和仪表板文件夹非常简单。只要你拥有相应的权限，你应该会在“报表”选项卡中看到“新建文件夹”按钮以创建报表文件夹，并在“仪表板”选项卡中看到“新建文件夹”按钮以创建仪表板文件夹。你需要拥有适当的权限才能创建报表和仪表板文件夹。我们将在本章稍后详细讨论权限。\n\
  \n让我们进行一个快速的动手练习来创建报表文件夹。请记住，每个报表都需要存储在一个文件夹中，因此深入了解文件夹本身对你来说是有好处的。\n\n### 创建报表文件夹的动手练习\n\
  \n确保你拥有创建报表文件夹的适当权限。让我们按照以下步骤创建一个报表文件夹：\n\n1. 导航到“报表”选项卡。\n2. 单击窗口右上角的“新建文件夹”按钮，如下面的截图所示：\n\
  \n   ![](img/72d01bea5a9ccf02f9452aab7505d9de_54_0.png)\n\n3. 在“名称”中输入 `My First\
  \ Report Folder` 作为报表文件夹名称。\n4. 单击“保存”按钮；将出现一条弹出消息，指示文件夹是否已成功创建。\n5. 我们刚刚创建的文件夹\
  \ `My First Report Folder` 将显示在**所有文件夹**中，也会显示在**由我创建**的文件夹中，如下面的截图所示：\n\n   ![](img/72d01bea5a9ccf02f9452aab7505d9de_55_0.png)\n\
  \n查看上面的截图，让我们逐一了解“报表”下的每个菜单：\n\n- **最近使用的报表：** 这将显示您最近打开的所有报表，因此您的同事将拥有不同的最近打开的报表。\n\
  - **由我创建：** 这包含您创建的所有报表，无论这些报表存储在哪个文件夹中。\n- **私人报表：** 这是一个安全文件夹，用于存储供您个人使用的报表；存储在此处的报表其他用户无法访问，并且您无法与其他用户共享该文件夹。\n\
  - **公共报表：** 这包含所有对所有人可见的报表。\n\n> 提示：由于此文件夹对所有用户可访问，并且任何人都可以编辑或删除它，请注意不要将您的私人或重要报表存储在此文件夹中。\n\
  \n- **所有报表：** 这将显示您有权打开的所有报表。\n\n以下是**文件夹**下的菜单：\n\n- **由我创建：** 这将显示您创建的所有报表文件夹。\n\
  - **与我共享：** 这是由您的同事创建但与您共享的报表文件夹列表。\n- **所有文件夹：** 这将列出您有权访问的所有报表文件夹，包括由您的同事创建的或作为从\
  \ AppExchange 安装应用的一部分而安装的报表文件夹。\n\n## 报表和仪表板文件夹共享\n\n与创建报表和仪表板文件夹相同，从 Summer '17\
  \ 版本开始，共享公共报表和仪表板文件夹只能在 Classic 中完成。\n\n点击**报表**选项卡，将鼠标悬停在要共享的文件夹上，然后点击文件夹名称旁边的图钉图标——您将看到**共享**选项。如果您只看到**固定到顶部**和**共享**，但没有**编辑**和**删除**，这意味着您不是该文件夹的管理员。我们将在本章中介绍文件夹访问级别。以下是从\
  \ Classic 共享报表文件夹的截图：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_56_0.png)\n\n\
  用户可以与**用户、角色、角色及下属或公共组**共享文件夹，并具有**查看者**、**编辑者**和**管理者**的访问级别。查看以下与其他用户共享报表的截图：\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_57_0.png)\n\n要共享报表文件夹，用户必须满足以下条件：\n\n\
  - 对该报表文件夹具有**管理者**访问级别。\n- 拥有“管理公共文件夹中的报表”权限。\n\n> 当您创建文件夹时，您会自动被设置为该文件夹的**管理者**。\n\
  \n报表和仪表板文件夹有三种访问级别，如下表所示：\n\n| 查看者 | 编辑者 | 管理者 |\n|---|---|---|\n| • 在文件夹树中查看文件夹<br>•\
  \ 查看所有内容<br>• 运行报表，刷新仪表板 | • 拥有**查看者**访问权限的所有权限，以及以下权限：<br>• 编辑文件夹的所有内容<br>• 向文件夹添加内容<br>•\
  \ 从文件夹删除内容 | • 拥有**编辑者**访问权限的所有权限，以及以下权限：<br>• 编辑文件夹名称<br>• 编辑/删除/移除共享 |\n\n###\
  \ 共享报表文件夹的动手练习\n\n现在，让我们逐步说明如何共享报表文件夹。\n\n用例：您想将 `My First Report Folder` 文件夹共享给一个角色为\
  \ CEO 的用户，访问级别为**查看者**，并共享给一名财务经理，我们将其命名为 **Jack Fin**，作为文件夹的**管理者**（您可以使用其他用户名进行此练习）。假设角色\
  \ CEO 存在，并且已经创建了一个名为 `Jack Fin` 的用户。\n\n1. 导航到**报表**选项卡。\n2. 点击之前创建的报表文件夹 `My First\
  \ Report Folder`，将鼠标悬停在报表文件夹名称上，点击图钉图标，然后点击**共享**：\n\n   ![](img/72d01bea5a9ccf02f9452aab7505d9de_58_0.png)\n\
  \n3. 这将打开一个弹出窗口；点击**角色**链接，然后点击 CEO 旁边的**共享**按钮。将访问菜单保留为**查看者**，然后点击**完成**按钮继续。\n\
  4. 接下来，点击“用户”链接，搜索 Jack Fin。点击该用户旁边的“共享”按钮。默认访问级别为“查看者”；点击其旁边的箭头，选择“管理者”。现在点击“完成”按钮继续，如下面的截图所示：\n\
  \n   ![](img/72d01bea5a9ccf02f9452aab7505d9de_59_0.png)\n\n5. 点击“关闭”按钮关闭窗口。\n\n\
  在此动手练习中，您学习了如何与具有“管理者”访问级别的用户以及角色中的用户共享报表文件夹以查看报表。\n\n## 报表权限\n\n当我们在本章前面讨论报表和仪表板文件夹时，您可能已经注意到我们谈到了创建报表、创建报表文件夹等权限。权限是控制用户在\
  \ Salesforce 中执行操作（包括报表和仪表板）能力的基本设置。\n\n在我们开始创建报表之前，我们将讨论一些权限，这些权限决定了用户在 Salesforce\
  \ 中运行、创建、编辑、导出、计划以及订阅报表的能力。\n\n### 运行报表\n\n这是运行报表所需的基本权限。如果没有“运行报表”权限，您将无法在 Salesforce\
  \ 中运行任何报表。当您尝试点击报表时，您会收到一条错误消息，提示“您没有运行报表的权限。”请检查您是否拥有“运行报表”用户权限，如下面的截图所示：\n\n\n\
  \n\n\n## 报告和仪表板中的概念和权限\n\n### 运行报表\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_60_0.png)\n\
  \n当某个配置文件中的所有用户都需要运行报表时，管理员只需在配置文件下的“常规用户权限”部分启用此权限即可。要将此权限分配给不同配置文件中的用户，请使用权限集。记住，权限集仅按每个用户的基础添加权限，而不会移除权限，并且与用户配置文件无关。\n\
  \n此权限还控制用户访问仪表板的权限。我们将在第 9 章《Lightning Experience 中的构建仪表板》中详细介绍仪表板。如果您无法运行报表，请联系您的管理员以启用此权限。\n\
  \n快速检查：如果您已启用此权限，请单击报表选项卡，然后单击“所有报表”菜单。您应该在几秒钟内看到生成的报表，但如果您看到与上一张截图中类似的错误消息，则表示您没有权限运行报表。如果您完全看不到报表选项卡，请查看第\
  \ 1 章《Salesforce 报表和仪表板基础》中的“导航到报表和仪表板”部分。\n\n### 创建和自定义报表\n\n“创建和自定义报表”权限控制用户创建新报表或修改现有报表的能力。如果没有此权限，用户在报表选项卡下将看不到“新建报表”按钮。此权限需要“运行报表”权限，因此如果用户的“运行报表”权限被禁用，则“创建和自定义报表”权限也会自动为该用户禁用。同样，当您启用“创建和自定义报表”权限时，“运行报表”权限也会自动启用。\n\
  \n当您启用此权限时，您应该会看到**新建报表**按钮；否则，您将无法创建和自定义报表。如果您需要创建或自定义报表，请与您的管理员联系以启用此权限。以下截图显示用户有权创建报表：\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_61_0.png)\n\n### 导出报表\n\n**导出报表**权限管理用户将报表导出为\
  \ Excel 或 CSV 文件格式的能力。与**创建和自定义报表**权限类似，此权限也依赖于**运行报表**权限。禁用**运行报表**权限将自动禁用此权限。但此权限不依赖于**创建和自定义报表**权限，这意味着用户可能能够导出报表，即使她或他无法创建或自定义报表。\n\
  \n当您打开报表并且已启用此权限时，您将在**编辑**按钮旁边的箭头下拉菜单下看到**导出**链接。请考虑以下截图：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_62_0.png)\n\
  \n> \U0001F4A1 **提示**  \n> 在 Classic 中，有一个选项可以将报表导出为可打印视图。导出的 Excel 文件将保留格式，并且随报表生成的汇总信息将在\
  \ Salesforce 中生成。\n\n### 订阅报表\n\n**订阅报表**权限使用户能够订阅报表以将其发送到其电子邮件地址，而无需打开报表。当您在 Lightning\
  \ Experience 中订阅报表时，您将按您设置的计划——**每日、每周或每月**——通过电子邮件接收更新的报表结果。\n\n拥有此权限的用户在报表打开后会看到**订阅**按钮，如以下截图所示。我们将在第\
  \ 8 章 *使用报表* 中详细介绍订阅报表：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_63_0.png)\n\n\
  与此权限相关的有两个权限，分别是：\n\n- **通过添加收件人订阅报表**：此权限将允许您添加其他用户以接收电子邮件发送。默认情况下，您包含在内，但在添加其他人时您可以将自己移除。\n\
  - **通过设置运行用户订阅报表**：此权限将允许您将运行用户指定为其他人，只要该用户有权访问报表即可。\n\n### 仪表板权限\n\n在上一节查看了报表权限后，让我们现在来看一下\
  \ Salesforce 中可用的仪表板权限。仪表板中的权限决定用户在 Salesforce 中打开、创建和编辑仪表板的能力。\n\n#### 运行报表权限\n\
  \n我们在 *报表权限* 部分讨论了**运行报表**权限，我们在这里不会重复，但我们想强调的是，Salesforce 中的仪表板基于报表。Salesforce\
  \ 中每个仪表板组件都由报表作为后端数据源支持。\n\n要允许用户在 Salesforce 中打开或查看仪表板，用户需要拥有运行报表的权限，并且仪表板查看用户必须有权访问用作仪表板组件数据源的报表。如果没有**运行报表**权限，用户在打开仪表板时会收到错误消息，提示**您没有权限运行报表。请检查您是否具有运行报表用户权限。**\n\
  \n**运行报表**是每个在 Salesforce 中使用报表和仪表板的用户所需的基本权限，即使只是运行或打开报表或仪表板也需要此权限。\n\n#### 创建和自定义仪表板权限\n\
  \n**创建和自定义仪表板**权限控制用户创建新仪表板或修改现有仪表板的能力。如果没有此权限，用户在单击**仪表板**选项卡时将无法看到**新建仪表板**按钮。\n\
  \n此权限也需要**运行报表**权限。如果**运行报表**权限被禁用，则为用户启用**创建和自定义仪表板**是无用的。\n\n#### 管理动态仪表板权限\n\n\
  **管理动态仪表板**权限允许用户创建和编辑动态仪表板。我们将在 *第 10 章，学习高级仪表板配置* 中更详细地了解动态仪表板。但现在，您只需要了解动态仪表板允许已登录用户根据用户权限和角色层级选择其他用户作为查看用户。\n\
  \n在创建或编辑仪表板时，拥有此权限的用户将有选项将仪表板运行用户设置为已登录用户，或允许打开仪表板的用户更改查看用户。以下截图显示了启用动态仪表板：\n\n\
  ![](img/72d01bea5a9ccf02f9452aab7505d9de_65_0.png)\n\n#### 查看我的团队仪表板权限\n\n**查看我的团队的仪表板**权限允许用户查看角色层级中其下属人员拥有的仪表板。\n\
  \n在创建或编辑仪表板时，拥有**管理动态仪表板**权限和**查看我的团队的仪表板**权限的用户可以选择设置**仪表板运行用户**，并启用**允许授权用户更改运行用户**。\n\
  \n当打开动态仪表板时，没有**查看我的团队的仪表板**权限的用户将无法更改仪表板查看用户。然而，拥有此权限的用户将能够更改并在角色层级中输入其团队中的用户作为查看用户。拥有**查看所有数据**权限的用户将能够输入任何其他用户作为查看用户。以下截图显示了如何更改仪表板查看者：\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_66_0.png)\n\n#### 安排仪表板\n\n我们将在 *第 9\
  \ 章，Lightning Experience 中的构建仪表板* 中讨论仪表板，但现在您应该知道，当您打开仪表板时，它不会显示最新数据，而是显示您上次刷新仪表板的数据、您同事刷新过的数据，或安排自动刷新的数据。\n\
  \nSalesforce 为拥有**安排仪表板**权限的用户提供刷新仪表板的能力，刷新次数有限。我将在 *第 9 章，Lightning Experience\
  \ 中的构建仪表板* 中分享更多内容，但现在，只需注意我们可以安排仪表板刷新，并将仪表板通过电子邮件发送给自己或发送给其他用户。\n\n截至 Summer ’17\
  \ 版本，此功能仅在 Classic 中可用，尚未在 Lightning Experience 中提供。\n\n\n\n\n\n# 总结\n\n在本章中，我们首先讨论了源数据，以及\
  \ Salesforce 报告是基于 Salesforce 中的实时数据生成的。它只显示用户拥有访问权限和可见性的数据和字段。构建仪表板需要报告，因为每个仪表板组件都需要一个报告作为数据源。Salesforce\
  \ 中的仪表板在用户打开时不会自动刷新；用户需要手动刷新，或安排其定时刷新。\n\n接着我们讨论了报告和仪表板在 Salesforce 中的存储方式和存储位置，即文件夹。我们讨论了多种类型的文件夹：私有文件夹、公共文件夹和标准文件夹。我们还讨论了用户对文件夹的访问级别类型。\n\
  \n接下来，我们了解了权限，权限是控制用户在 Salesforce 中能做什么和看什么的基础，包括报告和仪表板。我们讨论了与报告和仪表板相关的多种权限。\n\n\
  在下一章中，我们将说明如何保护已创建的报告和仪表板——供个人使用或与团队共享。我们还将讨论所需的配置，以允许一个包含所有用户的组对报告具有读取访问权限，并允许某些成员修改报告。\n"
- "## 在报告和仪表板中实现安全性\n\n本章将说明如何在 Salesforce 中保护报告和仪表板。正如我们在第2章 *报告和仪表板中的概念与权限* 中所讨论的，每个报告和仪表板都存储在一个文件夹中，报告和仪表板的可访问性由存储它们的文件夹控制，而不是由报告或仪表板本身控制。\n\
  \n在上一章中，我们还讨论了与报告和仪表板相关的权限。在本章中，我们将继续讨论与报告和仪表板文件夹相关的权限。与文件夹相关的权限有很多，例如，拥有某些权限的用户将能够查看所有公共文件夹，即使该用户名没有被添加到文件夹中。我们将逐一介绍所有这些场景。\n\
  \n到本章结束时，你将深刻理解如何保护你的报告和仪表板，以及如何确保与团队共享的报告和仪表板是安全的。作为管理员，你将了解与报告和仪表板文件夹相关的多种权限类型，并且这些权限不应对每个用户都启用。\n\
  \n本章涵盖的主题如下：\n\n- 私有报告和仪表板\n- 未归档公共报告\n- 公共报告和仪表板\n- 报告文件夹权限\n- 仪表板文件夹权限\n- 应用权限\n\
  \n### 保护私有报告和仪表板\n\n私有报告是仅报告所有者（创建报告的用户）可以访问的报告，无论其用户角色或配置文件如何。私有仪表板也是如此。\n\n在第2章《报告和仪表板中的概念与权限》中，我们解释了管理员可能能够访问你的私有报告和仪表板。当“管理员可以以任何用户身份登录”设置启用时，就会出现这种情况——该设置位于“登录访问策略”设置下。你可以将这一场景类比为你的办公电子邮件，电子邮件服务器管理员可以访问它——除非必要，否则他们不应该这样做，并且该活动会被记录。\n\
  \n拥有创建报告或创建仪表板权限的用户可以将他们创建的报告和仪表板存储在各自的私有文件夹中。对于报告，文件夹名为 My Personal Custom Reports；对于仪表板，文件夹名为\
  \ Private Dashboards（在 Lightning 中）和 My Personal Dashboards（在 Classic 中）。请看以下截图：\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_69_0.png)\n\n要保护你的个人报告，即确保任何人都无法查看、更改或删除这些报告，请将报告存储在\
  \ **My Personal Custom Reports** 文件夹中。即使其他用户拥有 URL，也无法访问该报告。对仪表板同样可以如此——将其存储在 **Private\
  \ Dashboards** 文件夹中，以便私有访问。请看以下截图：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_70_0.png)\n\
  \n但即使是私有报告，它仍会遵循数据可见性；你只能在报告中看到你自己可见的数据。类似地，当你创建或编辑报告时，只能将你有权限的对象和字段添加到报告中。报告中的对象和字段可见性也受报告类型控制，我们将在第5章\
  \ *了解报告类型* 中讨论报告类型。\n\n简而言之，要保护你的私有报告和仪表板，只需将它们存储在个人文件夹中，仅此而已。由于这些报告和仪表板任何人都无法访问，你将无法与其他用户共享它们。\n\
  \n### 使用未归档公共报告\n\n在第2章 *报告和仪表板中的概念与权限* 中，我们简要讨论了 **未归档公共报告**。该文件夹可供任何用户访问，因此任何拥有\
  \ **运行报告** 权限的用户都可以运行存储在该文件夹中的报告，并将报告从该文件夹复制（另存为）到其他文件夹（包括用户自己的私有文件夹）。要保护此文件夹，实际上无计可施。\n\
  \n但这并不意味着你可以删除或修改存储在该文件夹中的任何报告。除非你拥有特定权限，否则你只能删除或修改自己创建并存储在该文件夹中的报告——这一点我们将在本章中进一步讨论。\n\
  \n### 使用公共报告和仪表板\n\n我们在第2章 *报告和仪表板中的概念与权限* 中讨论了公共文件夹。存储在公共文件夹中的所有报告和仪表板统称为公共报告和公共仪表板。公共报告是确保你的团队按照定义查看数据的最简单方法之一。例如，报告\
  \ **我的团队下一季度销售管道** 将显示你的团队（你本人及你的下属，包括下属的下属——可以将其想象为多层次层级结构）下所有需要在下一季度结束前关闭的商机。你的组织可能有自己的销售管道阶段，也可能有不同的季度周期。使用共享的团队报告，所有销售经理将看到其团队的正确销售管道，而销售代表（个人贡献者）将看到自己的销售管道，并带有定义的阶段和周期。\n\
  \n让我们看以下截图。Michael 是一位销售经理，Jack 是向 Michael 汇报的销售代表。当 Michael 打开报告时，他将看到以下报告：\n\n\
  ![](img/72d01bea5a9ccf02f9452aab7505d9de_71_0.png)\n\n由于 Jack 是角色层级中 Michael 的下属，Jack\
  \ 的销售管道将出现在 Michael 的报告中。\n\n理想情况下，Salesforce 中的每个用户都有一个由管理员定义的角色。该角色决定了用户在 Salesforce\
  \ 中的数据可见性。一个角色在其下可以有多个直接下级角色，但在其上只能有一个直接上级角色。这种关系形成了角色层级，它与公司的组织结构图非常相似。由用户拥有的记录，处于记录所有者之上角色层级的用户可以看到该记录。\n\
  \n当 Jack 打开同一份报告时，由于他没有任何下属，他只能看到自己的销售管道，如以下截图所示：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_72_0.png)\n\
  \n同一类型的报告可用于整个组织。该报告将遵循为所有用户定义的角色层级，从 CEO 一直到销售代表角色。要创建此类报告，从技术上讲，你只需使用筛选条件来显示“我的团队的商机”，如以下截图所示：\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_72_1.png)\n\n如果报告需要服务公司中的所有用户，请确保其存储在所有用户都可访问的文件夹中，例如全球销售报告。\n\
  \n若要与公司内的所有用户共享文件夹，你可以将其与名为 All Internal Users 的组共享。该组由系统自动生成，所有活跃用户都会作为成员被添加。\n\
  \n\n\n\n\n为什么我们需要将此报表存储在 **Global Sales Reports** 而不是前面讨论的 **Unfiled Public Reports**\
  \ 文件夹中？这是为了整理和最佳实践。从专门命名的文件夹中查找报表比将所有报表都放在 **Unfiled Public Reports** 中更容易。随着时间的推移，如果未妥善管理和清理，Unfiled\
  \ Public Reports 文件夹会因添加了所有报表而变得非常混乱。\n\n团队报表也可以用于个人使用。例如，**My Closed Opportunity\
  \ This Fiscal Year** 报表将显示运行该报表用户的名下所有已关闭商机——这应显示公司财年内你名下所有赢得和丢失的商机。运行报表时，每个用户都会根据所有权看到不同的商机。管理层可以为报表定义关键指标矩阵，每个团队成员应负责，例如\
  \ **Amount、Close Date、Probability** 等。创建这种报表甚至更简单——你只需使用筛选条件来显示 **My opportunities**\
  \ 即可。请考虑以下屏幕截图：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_73_0.png)\n\n## Sharing\
  \ and securing public reports and dashboards\n\n在本章前面部分，我们强调报表和仪表板的安全性和可访问性由其报表文件夹定义。因此，最佳实践是将团队的所有报表和仪表板存储在同一文件夹中。如果你是管理该文件夹的人，你需要创建报表文件夹权限，或让你的管理员为你创建报表文件夹，并将\
  \ Manager 级别访问权限分配给报表文件夹。这同样适用于仪表板。\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_73_1.png)\n\
  \n创建报表文件夹的人将自动拥有该文件夹的 Manager 级别访问权限。\n\n## The Create Report Folders permission\n\
  \n**Create Report Folders** 权限赋予用户创建新报表文件夹的能力。需要启用 **Create and Customize Reports**\
  \ 权限才能使用此权限。\n\n当此权限启用时，一旦进入 **Reports** 选项卡，你将看到 **New Folder** 按钮；要创建报表文件夹，请点击该按钮，并在\
  \ **Create Folder** 窗口下提供文件夹名称，如以下屏幕截图所示：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_75_0.png)\n\
  \n## The View Reports in Public Folders permission\n\n**View Reports in Public Folders**\
  \ 权限赋予用户查看和访问所有公共报表文件夹的可见性，即使该用户未列在该特定报表文件夹的共享访问列表中。当你通过报表文件夹中的 Share 菜单检查时，具有此权限的用户名将不会在那里列出。\n\
  \n此权限仅限于查看报表，不能创建新报表并存储到该文件夹，或自定义该文件夹中的现有报表。此权限不应授予标准用户。\n\n## The Manage All Private\
  \ Reports and Dashboards permission\n\n此权限与用户通过 Salesforce Lightning（包括 Classic）用户界面访问报表的能力无关。此权限的目的是报表清理，其中包括私有报表。\n\
  \n随着时间的推移，报表和仪表板会逐渐不再使用，或用户变得不活跃并在他们的私有文件夹中留下过时的报表和仪表板。有了此权限，用户能够查询并删除保存在其他用户私有文件夹中的报表和仪表板。\n\
  \n我们不会在本书中讨论查询，但作为参考，使用 WHERE 关键字在 USING SCOPE allPrivate 之后，并指定 WHERE 关键字之后的 OwnerId，例如：\n\
  \n```\nSELECT Id FROM Report USING SCOPE allPrivate WHERE OwnerId =\n'00541000001cTYgAAM'\n\
  ```\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_77_0.png)\n\n执行 **Salesforce Object\
  \ Query Language (SOQL)** 有许多选项，从使用 Developer Console、Data Loader 到一个著名的免费工具 **Workbench**。你可以通过\
  \ `http://workbench.developerforce.com/login.php` 打开 Workbench。\n\n## Dashboard\
  \ folder permissions\n\n现在我们已经在前一节中看到了与报表文件夹相关的权限，让我们继续了解与仪表板文件夹相关的权限。它们非常相似——仪表板文件夹中的权限决定了用户在\
  \ Salesforce 中查看、创建和编辑仪表板的能力。\n\n## The Create Dashboard Folders permission\n\n\
  **Create Dashboard Folders** 权限赋予用户创建新仪表板文件夹的能力。需要启用 **Create and Customize Dashboards**\
  \ 权限才能使用此权限。\n\n当此权限启用时，一旦进入 Dashboards 选项卡，点击 New Folder 按钮；你只需在 Create Folder\
  \ 窗口中提供文件夹名称。请考虑以下屏幕截图：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_78_0.png)\n\n\
  ## The Edit My Dashboards permission\n\n我们在一节前面提到了 Edit My Reports 权限。Edit My Dashboards\
  \ 是一种类似的权限，但针对仪表板。它允许用户编辑、移动、保存和删除他们在公共仪表板文件夹中创建的仪表板。\n\n当用户有权访问文件夹时，用户能够将仪表板保存到该文件夹。用户对该文件夹的访问权限仅为\
  \ Viewer。用户还能够在用户具有 Viewer 访问权限的公共仪表板文件夹中编辑和删除自己创建的报表。\n\n此权限不应授予标准用户，因为它会允许用户覆盖其他用户创建的仪表板；访问权限授予的仪表板文件夹仅具有\
  \ Viewer 访问权限。\n\n## The View Dashboards in Public Folders permission\n\n**View\
  \ Dashboards in Public Folders** 权限赋予用户查看和访问存储在公共仪表板文件夹中的所有仪表板的可见性，即使用户未列在该特定仪表板文件夹的共享访问列表中。\n\
  \n与 **Edit My Dashboards** 权限类似，此权限也不应授予普通终端用户。\n\n## The Manage Dashboards in Public\
  \ Folders permission\n\n**Manage Dashboards in Public Folders** 权限需要 **Create Dashboard\
  \ Folders、View Dashboards in Public Folders 和 Edit My Dashboards** 权限。有了此权限，用户能够访问和编辑存储在公共仪表板文件夹中的所有仪表板。\n\
  \n除此之外，此权限还允许用户共享、编辑和删除任何公共仪表板文件夹。因此，这是一个非常强大的权限。\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_79_0.png)\n\
  \n请谨慎地仅将此权限授予绝对需要它的用户。确保具有此权限的用户不会搞乱其他用户创建的仪表板。\n\n## Applying permission\n\n现在你已经了解了运行报表、创建报表、导出报表、创建仪表板等的能力由权限控制——只有被授予这些权限的用户才能执行此类活动，正如我们在前几节中讨论的那样。\n\
  \n保护报表或仪表板意味着确保报表或仪表板仅对应该有权访问的用户可访问；有些用户可能只需要能够运行报表，而不能修改它。这是在存储报表或仪表板的文件夹中控制，而不是报表或仪表板本身。文件夹的管理者能够配置并与其它用户共享文件夹，并确定他们的访问级别。\n\
  \n本章前面我们还提到，与报表和仪表板文件夹相关的权限类型有很多。有了额外的权限，用户将能够访问所有报表（私有报表和私有仪表板除外），即使用户未被添加到组可访问性中。作为管理员，你应确保仅将权限授予需要它的用户。\n\
  \n以下是通过 **Profile** 和 **Permission Set** 分配权限的差异：\n\n- **Profile**：配置文件中的所有用户都将获得为该配置文件启用的权限。当你需要向同一配置文件中的所有用户授予权限时，这是一个不错的选择，例如运行报表的权限。\n\
  - **Permission Set**：管理员可以创建一个仅包含一个权限或包含多个权限的权限集。当你需要向跨配置文件的用户授予某些权限时，这是一个更灵活的选择，例如创建报表文件夹的权限——你可能不希望每个人都能创建文件夹，否则如果不加以控制，你的报表文件夹可能会变得混乱。\n\
  \n## Hands-on exercise for adding permission in a Profile\n\n在此练习中，我们将向名为 **Sales\
  \ Ops** 的自定义 **Profile** 授予 **Create and Customize Reports** 权限。假设该配置文件已在之前创建。\n\
  \n- 1. 点击左上角菜单中的 **Setup** 齿轮图标，如以下屏幕截图所示：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_80_0.png)\n\
  \n- 2. 点击左侧菜单中的 **Users**，然后点击 **Profiles** 子菜单。\n\n\n\n\n\n+   3. 查找配置文件名称——在本练习中，我们将使用\
  \ Sales Ops 配置文件（在你的环境中可能不同）——然后在配置文件名称前点击 Edit 链接。\n+   \n+   4. 向下滚动，找到 **Create\
  \ and Customize Reports** 权限。它位于 **Administrative Permissions** 部分下。选中复选框以授予权限。请参考以下截图：\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_81_0.png)\n\n+   5. 点击 **Save** 按钮，即完成。\n\
  \n该配置文件中的所有用户现在都能够运行报表。\n\n## 使用权限集进行权限的动手练习\n\n接下来，我们将创建一个名为 **Regional Admin**\
  \ 的新权限集。拥有此权限集的用户将能够创建报表文件夹和仪表板文件夹。请按照以下步骤进行此练习：\n\n+   1. 点击左上角菜单中的 **Setup** 齿轮图标。\n\
  +   2. 点击左侧菜单中的 **Users**，然后点击 **Permission Sets** 子菜单。\n\n6. 在下一个屏幕中，在文本框中输入 create\
  \ report，系统将搜索包含输入字符的权限，如以下截图所示：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_83_0.png)\n\
  \n7. 点击 Create Report Folders；它将打开该权限，然后向上或向下滚动以点击 Edit 按钮。\n\n8. 再次找到该权限；勾选其旁边的文本框，如以下截图所示：\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_83_1.png)\n\n9. 你可能会注意到有一个信息图标，它告诉你该权限需要另一个权限——在本例中，Create\
  \ Report Folders 权限是 Create and Customize Reports 权限所必需的。因此，Create and Customize\
  \ Reports 权限将被自动启用到权限集中。\n\n10. 点击 Save 按钮以继续。\n\n11. 点击 **Manage Assignments**\
  \ 按钮以检查为此权限分配的任何用户。如果想为此权限添加用户，请点击 **Add Assignments** 按钮。\n\n12. 找到需要此权限集的所有用户；点击用户旁边的复选框，然后点击\
  \ **Assign** 按钮，如以下截图所示：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_84_0.png)\n\
  \n13. 添加到权限集的用户将被显示，点击 **Done** 按钮以结束。\n\n## 总结\n\n在本章中，我们首先从为个人使用保护私有报表和仪表板开始。然后，我们继续讨论\
  \ **Unfiled Public Report** 文件夹，其中具有创建报表权限的用户能够在此文件夹中存储创建的报表。此文件夹的一个用途是在真正的文件夹创建之前临时存储报表，但请注意，存储在此处的报表将可供组织中的每个人访问。\n\
  \n接下来，我们继续讨论共享和保护公共报表和仪表板。报表文件夹和仪表板文件夹相关的所有权限也被讨论。\n\n在结束本章之前，我们提供了动手练习，通过 **Profile**\
  \ 授予权限，该权限适用于具有该配置文件的全部用户，以及通过 **Permission Sets** 授予权限，我们可以在用户配置文件之间灵活地授予权限。\n"
- "## 创建和管理报表\n\n你在第 2 章 *Concepts and Permissions in Reports and Dashboards* 中了解了\
  \ Salesforce 报表的概念。我们学习了如何从数据源生成报表，报表在 Salesforce 中生成时数据如何显示，报表如何在 Salesforce 中存储，如何与团队或组织中的每个人共享报表，以及如何获取处理报表所需的权限。在第\
  \ 3 章 *Implementing Security in Reports and Dashboards* 中，我们学习了如何保护我们的报表和仪表板。\n\n\
  在本章中，我们将动手创建报表，讨论处理报表时的更多技术细节，探索在 Salesforce 中可以构建哪些类型的报表，以及创建新报表和维护现有报表是多么容易。我们将从\
  \ Salesforce 中可用的多种报表格式开始，报表格式为何与报表相关如此重要，以及每种格式的优点和局限性；然后我们将继续讨论向报表添加筛选器。\n\n到本章结束时，你将获得如何根据需求选择正确的报表格式的知识，并学习如何使用报表筛选器自定义报表。\n\
  \n在本章中，我们将提供注释和提示来帮助你理解重要事项。本章将深入涵盖以下主题：\n\n- 选择报表格式\n- 添加报表筛选器\n\n## 选择报表格式\n\n\
  为什么报表格式在创建报表时很重要？每个 Salesforce 报表都是由报表格式构建的，报表格式将决定报表的布局、选项和设置。它还决定报表是否可作为仪表板的数据源。\n\
  \nSalesforce 中有几种报表格式可供使用，从简单的表格报表到复杂的矩阵和联接报表。每种报表格式都有不同的用途和目的。\n\n### 报表格式类型\n\n\
  当你创建新报表时，**Tabular** 是默认选择的报表格式。你可以在任何时候修改报表格式，即使在保存报表之后，但你可能会丢失一些配置项，具体取决于原始和目标报表格式。\n\
  \nSalesforce 中有四种报表格式可用：\n\n- **Tabular**\n- **Summary**\n- **Matrix**\n- **Joined**\n\
  \n让我们分别理解它们。\n\n### 表格报表格式\n\n**Tabular** 报表是在创建新报表时默认的报表格式；此格式被认为是最简单的；它以类似电子表格的方式呈现数据。数据以行和列格式呈现；每一行呈现一条记录，每一列呈现一个字段，列也可以是桶字段或自定义汇总公式。报表可用的字段取决于使用的报表类型。\n\
  \n我们将在 *第 5 章，Understanding Report Types* 中彻底讨论报表类型，而桶字段和自定义汇总公式将在 *第 6 章，Advanced\
  \ Report Configuration* 中讨论。目前，报表类型将决定报表中可用的字段；它可能包含来自一个对象或来自几个相关对象的全部或部分字段。\n\n\
  尽管 **Tabular** 是最简单的格式，但它为你提供了许多能力，例如按列排序数据、添加筛选器、汇总字段、添加桶字段、记录计数、导出报表、订阅报表等。所有这些功能对\
  \ **Summary** 和 **Matrix** 报表也同样适用。**Tabular** 报表的重点是让你查看满足筛选条件的每条记录的详细信息，类似于电子表格。\n\
  \n让我们看一下 **Tabular** 格式的局限性：\n\n- 无分组\n- 无图表\n- 除非配置了 **Row Limit** 筛选器，否则不能用作仪表板的数据源\n\
  \n与 **Tabular** 格式相关的其他局限性如下：\n\n- 报表生成器预览最多显示 50 行。\n- 报表最多显示 2,000 行。要查看所有行，请将报表导出到\
  \ Excel。\n\n**Tabular** 报表格式在生成报表时具有最佳的性能表现。以下是 **Tabular** 报表的示例：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_87_0.png)\n\
  \n## 创建表格报表的动手练习\n\n让我们考虑一个用例。我们被要求显示按员工人数降序排序的前五个账户，并筛选账户类型包含 Customer。在本练习中，我们假设你有超过五个账户，其类型包含\
  \ Customer 文本，并且员工人数已填充：\n\n+   1. 导航到 **Reports** 选项卡并点击 **New Report..** 按钮。\n\
  +   2. 选择 **Accounts** 报表类型并点击 **Accounts & Contacts** 类别下的加号。\n+   3. 点击 **Create**\
  \ 按钮以继续。\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_88_0.png)\n\n4. 现在我们进入了 **Report\
  \ Builder**，预览显示有限数量的记录。\n\n\n\n\n- 5. 将“显示”字段更改为“所有账户”。将“日期字段范围”更改为“所有时间”。\n\n\
  ![](img/72d01bea5a9ccf02f9452aab7505d9de_89_0.png)\n\n- 6. 将“员工”字段添加到报表区域，并删除不必要的字段，如“上次活动”、“上次修改日期”、“评分”和“账单省/州”。\n\
  \n您可以在左侧面板的“快速查找”文本框中输入字段名称来快速查找字段；文本框下方显示的字段将随您的输入自动筛选。\n\n要向报表添加字段，请双击该字段；如果该字段之前未添加到报表中，它将被添加到最后一列。另一种选择是将字段拖放到报表区域；拖动字段时请注意绿色对勾和红色方块图标。\n\
  \n**提示：**\n\n要从报表中删除字段，请将字段标题拖放回左侧面板的字段区域；或者将鼠标悬停在报表中的字段标题上，单击箭头图标，然后点击“删除列”。\n\n\
  - 7. 点击“筛选器”中的“添加”按钮，然后继续执行以下操作：\n\n  - 从可用字段列表中选择“类型”（您也可以手动输入字段名称，然后选择该字段）。\n\
  \  - 从运算符列表中选择“包含”。\n  - 点击放大镜，从弹出的值中选择**客户**。就我而言，我有**客户 - 直接**和**客户 - 渠道**，但没有单独的“客户”，因此我手动输入“客户”。由于我们这里的运算符是**包含**，这将同时覆盖**客户\
  \ - 直接**和**客户 - 渠道**。\n  - 点击“确定”按钮进行确认。\n  - 点击**添加**按钮旁边的小箭头，然后选择**行数限制为 5，按员工数降序排序**，然后点击“确定”按钮应用。\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_90_0.png)\n\n  - 点击**保存**按钮；这将打开一个弹出窗口来保存报表。\n\
  \  - 将**报表名称**输入为 `Top 5 Customers by No of Employee`。**报表唯一名称**将自动填写。\n\n> 始终建议输入一些**描述**，以备将来参考。\n\
  \n  - 在**报表文件夹**选项中选择**我的个人自定义报表**，这样其他人就无法访问它。\n  - 再次点击**保存**按钮以保存报表。\n  - 点击**运行报表**按钮，您应立即看到生成的报表。\n\
  \n以下截图显示了生成的报表；您可能看到不同的数据，但结果中应有五条记录，如果您的 Salesforce 组织没有“账户”的“客户”类型，则可能少于五条或没有记录：\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_91_0.png)\n\n## 汇总报表格式\n\n**汇总**报表与**表格**报表之间的主要区别在于，**汇总**报表能够使用报表可用的任何字段（包括分桶字段）进行分组。如果**汇总**报表中没有定义分组字段，则报表将作为**表格**报表运行。\n\
  \n**汇总**报表被认为比**表格**报表更高级；除了**表格**格式中所述的功能外，**汇总**报表还提供以下额外能力：\n\n- 为了根据值对报表进行分组，您可以使用最多三级分组来对报表进行分组。您还可以汇总数字字段的数据，并显示每个组的记录数。\n\
  - 向报表添加图表。\n- 将报表用作仪表板的数据源；对于表格报表，只有配置了**行数限制**的报表才可以。\n- 按不同字段进行分组排序。\n- 探索隐藏单个记录详细信息的能力，以便更轻松地查看汇总的业务数据。\n\
  \n与**表格**报表相比，**汇总**格式报表中不能添加**行数限制**。\n\n以下是一个**汇总**报表的示例：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_92_0.png)\n\
  \n## 创建汇总报表的动手练习\n\n让我们考虑一个用例：显示所有账户，按创建账户的**日历年度**和**账户所有者**进行分组。请按照以下步骤完成此动手练习：\n\
  \n- 1. 导航到**报表**选项卡，然后点击**新建报表**按钮。\n- 2. 选择**账户**报表类型，然后点击**账户和联系人**类别下的加号。\n-\
  \ 3. 点击**创建**按钮继续。\n- 4. 将**显示**更改为**所有账户**。\n- 5. 将**日期字段范围**更改为**所有时间**。\n- 6.\
  \ 将报表格式从**表格**更改为**汇总**。\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_93_0.png)\n\
  \n- 7. 点击**筛选器**中的**添加**按钮，然后继续执行以下操作：\n\n  - 从可用字段列表中选择**类型**；您也可以手动输入字段名称，然后选择该字段。\n\
  \  - 从运算符列表中选择**包含**。\n  - 点击放大镜，从弹出的值中选择**客户**。就我而言，我有**客户 - 直接**和**客户 - 渠道**，但没有“客户”，因此我手动输入“客户”。由于我们这里的运算符是“包含”，这将同时覆盖**客户\
  \ - 直接**和**客户 - 渠道**。\n  - 点击**确定**按钮。\n\n- 8. 将**创建日期**拖到报表中的放置区域。\n\n您可以在**快速查找**文本框中输入字段名称以筛选字段名称。如果您看不到分组区域，请点击**显示**并选择**放置区域**。\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_94_0.png)\n\n- 9. 将字段添加到分组后，点击放置区域中**创建日期**左侧的箭头，然后导航到**按日期分组\
  \ | 日历年度**。**按日期分组**仅在您要分组的字段是“日期”和“日期/时间”字段时可用。请参考以下截图：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_95_0.png)\n\
  \n- 10. 将**账户所有者**拖到**创建日期**下方的放置区域。默认情况下，**显示**中的**详细信息**已选中；让我们隐藏该详情。\n\n- 11.\
  \ 点击**显示**菜单并取消选中**详细信息**：\n\n- 12. 点击**保存**按钮；这将打开一个弹出窗口来保存报表：\n\n  - 将**报表名称**输入为**按创建年份和所有者划分的所有账户**。**报表唯一名称**将自动填写。\n\
  \  - 始终建议输入**描述**以备将来参考。\n  - 在**报表文件夹**中选择**我的个人自定义报表**，这样其他人就无法访问它。\n  - 点击**保存**按钮保存报表。\n\
  \n- 13. 点击**运行报表**，您应该会看到类似于以下截图所示的报表：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_96_0.png)\n\
  \n- 14. 默认情况下，**汇总**报表将按第一个分组升序排序，然后按第二个分组升序排序。在我们的练习中，它是**创建日期**和**账户所有者**。您可以通过在报表生成器中编辑报表、点击放置区域中字段旁边的箭头并选择**分组排序依据**（如以下截图所示）来更改排序顺序：\n\
  \n![](img/72d01bea5a9ccf02f9452aab7505d9de_96_1.png)\n\n- 15. 要从打开的报表中显示数据详细信息，请点击齿轮图标并在“选项”窗口中勾选**详细信息**；请记住，在本练习的第\
  \ 11 步中，我们取消了**显示详细信息**。报表将重新生成并显示每条记录的详细信息，但报表分组和排序将保持不变：\n\n**报表：** 按创建年份和所有者划分的所有账户\
