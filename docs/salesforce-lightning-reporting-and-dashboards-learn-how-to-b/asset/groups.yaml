    post for the report may look simple, but it is a powerful feature to serve as
    a collaboration tool among users within the report. This feature is pretty similar
    to Chatter posts in records, such as Account, Opportunities, and so on. The following
    screenshot shows the Chatter panel at the right-hand side:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_329_0.png)


    In the preceding screenshot, we only have the Post and Poll actions in the Chatter
    page. We can add or remove actions by navigating to Setup | User Interface | Global
    Actions | Publisher Layouts. Then edit the layout and select Salesforce1 & Lightning
    Actions.


    ### Tracking report feed


    If you remember, in an earlier exercise when enabling report for feed tracking,
    we also enabled tracking for these items:


    - Report Name

    - Report Unique Name

    - Description


    Let''s do a simple exercise: change the report name by editing the report--open
    report properties and change the Report Name and Report Unique Name. Save the
    report, and let''s see how the tracking works. Open the Chatter panel from the
    report by clicking on the Collaborate icon. This is shown in the following screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_330_0.png)


    ### Dashboard collaboration and feed tracking


    Similar to a report, you can collaborate using Chatter feed tracking in the dashboard.
    The Collaborate icon is located next to the Refresh button on the dashboard; if
    you do not see the icon, follow these steps:


    1. Navigate to Setup | Feature Settings | Chatter | Feed Tracking.

    2. Look for Dashboard and tick Enable Feed Tracking; select all fields here for
    tracking.

    3. Click on the Save button.


    These are the five items that you can track in dashboard feeds:


    - **Dashboard Running User**

    - **Dashboard Unique Name**

    - **Description**

    - **Title**

    - **Using Grid Layout**


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_331_0.png)


    The preceding screenshot shows the items in the dashboard feed.


    Let''s have a quick hands-on exercise for dashboard collaboration and feed tracking:


