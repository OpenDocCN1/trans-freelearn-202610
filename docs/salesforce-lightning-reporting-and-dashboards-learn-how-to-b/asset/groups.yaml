    user has an edit permission and clicks on Save from the action button.


    ## The Collaborate field


    If **Chatter Feed Tracking for Report** is enabled, this icon will be visible
    to all users able to open the report. To enable this, navigate to **Setup | Feature
    Settings | Feed Tracking**, look for **Report** in the left-side panel and tick
    **Enable Feed Tracking.**


    By default, it will have **Post** and **Poll** for collaboration. The same is
    the case with all other **Chatter** posts; you can mention other users using @
    followed by the username. Other users can **like**, **comment**, and **bookmark**
    the post, while for the user who posts in **Chatter** feed, the user also will
    be able to **Delete** and **Edit** the post.


    ## Report settings


    For the **Matrix** and **Summary** reports, the user will have options to show
    or hide--**Details**, **Subtotals**, **Grand total**, and **Record counts**. Consider
    the following screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_241_0.png)


    For **Tabular** reports, options are limited to showing or hiding **Details**
    and **Grand total**. Consider the following screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_242_0.png)


    When the **Record Count** is hidden in **Summary** and **Matrix** reports, it
    will be hidden at the top as well. Hiding **Grand total** will hide the values
    from the bottom of the report as well as at the top, below the title. **Subtotals**
    are only available for the **Summary** and **Matrix** reports, which totally makes
    sense because there are no subtotals in the **Tabular** report.


    ## The action button


    These are complete actions you can perform in an open report. Consider the following
    screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_242_1.png)


    Depending on the user permissions, the user will see different actions; let''s
    quickly explain each of the action available:


    - **Edit**: This is used to edit the report in the report builder

    - **Clone**: This is used to clone to a new report; you will have the option to
    store it as a private report, make it public, or store it to a specific folder

    - **Save**: This saves the report with any changes made, such as adding a chart

    - **Subscribe**: This subscribes a report for email delivery on a schedule; we
    will discuss this in the next section

    - **Export**: This is used to export a report into comma-delimited `.csv` or Excel
    format `.xls`

    - **Delete**: The report deleted will be available in the Recycle Bin for 15 days
    and can be restored at that time


    ## Subscribing reports


    In Lightning Experience, you can subscribe to up to five reports and receive refreshed
    report results by email on a schedule that you set--Daily, Weekly, or Monthly.


    To subscribe to reports, you need to have the **Subscribe to Reports** permission
    granted from **Profile** or **Permission Set**. On top of that, there are two
    more additional permissions related to this:


    - **Subscribe to Reports: Add Recipients**

    - **Subscribe to Reports: Set Running User**


    These permissions require the **Subscribe to Reports** permission to be enabled.


    This is a sample of an email sent to you when you subscribe for a report; you
    can click on the report title to open the report directly in Salesforce or click
    on the record name, such as Account Name or Opportunity Name, to open the report
    in Salesforce:


