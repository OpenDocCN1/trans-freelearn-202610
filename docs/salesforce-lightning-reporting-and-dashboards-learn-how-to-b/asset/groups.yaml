    # # Creating and Managing Reports


    You learned about the concept of the Salesforce report in Chapter 2, *Concepts
    and Permissions in Reports and Dashboards*. We learned how to generate reports
    from the data source, how data will be shown when a report is generated in Salesforce,
    how reports are stored in Salesforce, how to share reports with your team or everyone
    in your organization, and how to acquire the permissions required to work with
    report. In Chapter 3, *Implementing Security in Reports and Dashboards*, we learned
    about how to secure our reports and dashboards.


    In this chapter, we will hands-on create reports, discuss more technical details
    when working with reports, explore what kinds of report you can build in Salesforce,
    and discover how easy it is to create a new report and maintain existing reports.
    We will start with multiple types of report format available in Salesforce, why
    a report format is so important in relation to reports and the benefits and limitations
    of each format; then we will continue with adding filters to reports.


    By the end of this chapter, you will gain knowledge on how to select the correct
    report format based on the requirements and also learn how to customize the reports
    using report filters.


    Throughout this chapter, we will provide notes and tips to help you to understand
    important items. The following topics will be covered in this chapter in depth:


    +   - Selecting the report format

    +   - Adding report filters'
