    \ (Multi-Select)** types of fields, you cannot track the original and new value\n\
    - Not all standard objects can be tracked; for example, **User**, **Task**, **Event**,\
    \ **Campaign**, and **Quote**\n- Not all fields can be tracked; for example, the\
    \ **Formula** field, **Roll-Up Summary**, auto-number fields, **Created By**,\
    \ **Last Modified By**, and **Expected Revenue** fields on **Opportunity**\n\n\
    ## Reporting on historical data with Reporting Snapshots\n\nCan we have a report\
    \ on data trending in Salesforce? Does Salesforce only report current data? Field\
    \ history tracking will store old and new values whenever value changes in fields\
    \ are detected. But to use it for trending would be too difficult, unless you\
    \ export the data to an external database and analyze it with live data—it will\
    \ not include deleted data either (if any).\n"
  mdcn: "\n\n## 自定义对象上的历史跟踪\n\n对于自定义对象，您需要在对象详细信息中启用跟踪，然后再选择要跟踪的字段。假设我们有一个名为 `Claim`\
    \ 的自定义对象。请执行以下步骤：\n\n1. 导航到 **Setup | Objects and Fields | Object Manager**。\n\
    2. 点击 **Claim** 对象链接并点击 **Edit** 按钮。\n3. 在可选功能中启用 **Track Field History**，然后点击\
    \ **Save** 按钮。这在以下屏幕截图中显示：\n\n    ![](img/72d01bea5a9ccf02f9452aab7505d9de_347_0.png)\n\
    \n4. 从左侧菜单中选择 **Fields & Relationships**。\n5. 点击 **Set History Tracking** 按钮，并选择您想要跟踪的字段。\n\
    6. 对标准对象中的 **Text Area (Long)**、**Text Area (Rich)** 和 **Picklist (Multi-Select)**\
    \ 字段执行相同的操作——它只会跟踪更改，而不会跟踪旧值和新值。\n7. 点击 **Save** 按钮保存更改。\n\n## 历史对象\n\n当您为对象启用\
    \ **Field History Tracking** 时，在后端，Salesforce 会创建一个新对象。该对象的名称将以 **History** 结尾，例如\
    \ **AccountHistory**、**ContactHistory** 等标准对象，对于自定义对象则为 **__History**，例如 `Claim__History`。\n\
    \n当记录中跟踪的字段发生任何更改时，Salesforce 会在此对象中创建一个新记录。例如，如果对象中有五个跟踪字段，而其中三个在一次事务中更改，Salesforce\
    \ 将在此对象中创建三条记录。\n\n作为熟悉 SOQL 的开发人员或管理员，您可以查看该对象以查询以下内容：\n\n- `CreatedById`：进行更改的用户\n\
    - `CreatedDate`：更改日期\n- `OldValue`：显示旧值\n- `NewValue`：显示新值\n- `ParentId`：(对于自定义对象)，与更改相关的记录\
    \ ID\n- `ObjectId`（例如：标准对象的 `AccountId` 或 `ContactId`）\n\n您不能手动创建、更新或删除此对象中的记录，只能查询。出于很好的原因，历史对象的存储使用量不计入数据存储。\n\
    \n## 读取历史跟踪值\n\n一旦启用历史跟踪，除了使用 API 查询之外，还有两种查看跟踪值的方法。接下来将讨论这两种方法。\n\n### 历史相关列表\n\
    \n将字段历史信息相关列表添加到对象页面布局。此信息将对分配给特定页面布局的所有用户可见，以防您有多个页面布局。\n\n要将历史相关列表添加到对象页面布局，请打开页面布局编辑器。在此练习中，让我们以\
    \ Account 对象为例，因此此处的相关列表为 Account History。选择 Related Lists 中的 Account History，并将其拖到页面布局中。这在以下屏幕截图中显示：\n\
    \n![](img/72d01bea5a9ccf02f9452aab7505d9de_349_0.png)\n\n一旦历史相关列表被添加到页面布局，对跟踪字段的任何更新都将显示在此处，如以下屏幕截图中\
    \ Related 选项卡下所示（左箭头）；但您也可以将其作为 Lightning 组件中的相关列表添加（右箭头）：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_350_0.png)\n\
    \n让我们分析前面的屏幕截图：\n\n- 历史记录按日期以降序排序\n- 第一个历史记录显示记录何时创建\n- 在一次事务中更新多个字段时，它将作为两个不同的项目跟踪，但日期和时间相同；请参阅\
    \ Account Owner 和 Account Number 的更改\n- 因为 Description 是一个长文本区域字段，所以它不会跟踪原始值和新值，而只是跟踪发生了更改\n\
    \n所有对象都将具有相同的标签，并以 History 结尾，例如 Account History、Contact History、Claim History\
    \ 等。但对于 Opportunity 对象，它是一个例外——它被称为 Opportunity Field History。请考虑以下屏幕截图作为 Opportunity\
    \ Field History 的示例：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_351_0.png)\n\n\
    对于 API 对象名称也是如此——它被称为 **Opportunity Field History** 而不是 **Opportunity History**。**Opportunity\
    \ History** 对象用于存储 **Opportunity Stage** 信息。\n\n### 历史报告\n\n获取历史跟踪值的另一种选择是使用报告。用户只需要拥有\
    \ **Run Report** 权限，以及运行所创建报告的对象的访问权限即可。\n\n要创建报告，首先选择自定义报表类型，例如 **Account History**\
    \ 报表，如以下屏幕截图所示：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_352_0.png)\n\n默认情况下，它将显示\
    \ **My accounts**，但您可以像普通报表一样修改它。添加筛选器、添加分组、更改报表格式，并添加/删除报表字段。如果您查看左侧面板的字段可用性，只有来自\
    \ **History Data** 组中的字段才包含历史数据，而其他字段如果您将该字段带入报表，则会在 Salesforce 中显示实时数据。请考虑以下屏幕截图中\
    \ **History Data** 下的字段：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_352_1.png)\n\
    \n如果您注意到前面的屏幕截图，**Account History** 报表类型的 Parent ID 为 **Account ID**。这对于其他对象也是相同的；例如，如果这是\
    \ **Contact History**，则 **Parent ID** 将为 Contact ID。\n\n对于自定义对象，一旦在对象详细信息中启用 **Track\
    \ Field History**，请创建一个新的自定义报表，并注意报表类型以 `History` 结尾可供您使用，例如 `Claim History`。与上述\
    \ **Account History** 类似，您可以像普通报表一样使用此报表类型。请考虑以下屏幕截图中的报表：\n\n| HISTORY ID | PARENT\
    \ ID | ACCOUNT NAME | EDITED BY | EDIT DATE | FIELD / EVENT | OLD VALUE | NEW\
    \ VALUE |\n|---|---|---|---|---|---|---|---|\n| 017B000002tGNh | 001B000000SWOQO\
    \ | Electric Inc Limited | Alvin Lee | 5/24/2017 9:10 PM | Account Number | -\
    \ | 8001 |\n| 017B000002tGfz | 001B000000SWOQO | Electric Inc Limited | Johan\
    \ Yu | 5/24/2017 9:10 PM | Account Owner | Johan Yu | Alvin Lee |\n| 017B000002tGcL\
    \ | 001B000000SWOQO | Electric Inc Limited | Johan Yu | 5/24/2017 9:09 PM | Description\
    \ | - | - |\n| 017B000002tGcK | 001B000000SWOQO | Electric Inc Limited | Johan\
    \ Yu | 5/24/2017 9:08 PM | Account Name | Electric Inc | Electric Inc Limited\
    \ |\n| 017B000002tGyA | 001B000000SWOQO | Electric Inc Limited | Johan Yu | 5/24/2017\
    \ 9:08 PM | Created | - | - |\n| 017B000002tGVC | 001B000000SWOQJ | Big Inc. Limited\
    \ | Johan Yu | 5/24/2017 9:07 PM | Description | - | - |\n| 017B000002tGVB | 001B000000SWOQJ\
    \ | Big Inc. Limited | Johan Yu | 5/24/2017 9:07 PM | Account Name | Big Inc.\
    \ | Big Inc. Limited |\n| 017B000002tGWM | 001B000000SWOQJ | Big Inc. Limited\
    \ | Johan Yu | 5/24/2017 9:07 PM | Created | - | - |\n\n## 使用字段历史跟踪的限制\n\n其中一些限制之前已经解释过，但让我们在这里总结一下：\n\
    \n- 默认情况下，最多只能跟踪 20 个字段\n- 对于 **Text Area (Long)**、**Text Area (Rich)** 和 **Picklist\
    \ (Multi-Select)** 类型的字段，您无法跟踪原始值和新值\n- 并非所有标准对象都可以跟踪；例如，**User**、**Task**、**Event**、**Campaign**\
    \ 和 **Quote**\n- 并非所有字段都可以跟踪；例如，**Formula** 字段、**Roll-Up Summary**、自动编号字段、**Created\
    \ By**、**Last Modified By** 和 **Opportunity** 上的 **Expected Revenue** 字段\n\n##\
    \ 使用 Reporting Snapshots 报告历史数据\n\n我们能否在 Salesforce 中对数据趋势进行报告？Salesforce 是否只报告当前数据？字段历史跟踪会在检测到字段值更改时存储旧值和新值。但要将其用于趋势分析会太困难，除非您将数据导出到外部数据库并使用实时数据进行分析——它也不会包含已删除的数据（如果有）。\n\
    \n"
