    # The Summary report format


    The main difference between a **Summary** report and a **Tabular** report is the
    **Summary** report''s ability to group using any field available (included bucket
    field) for the report. If there are no fields defined for grouping in the **Summary**
    report, the report will run as a **Tabular** report.


    A **Summary** report is considered more advanced than a **Tabular** report; in
    addition to the features stated in a **Tabular** format, the **Summary** report
    offers additional abilities, such as the following:


    +   - In order to group reports based on the values, you can group reports with
    up to three levels of grouping. You also can summarize data for numeric fields
    and display record counts for each group.'
