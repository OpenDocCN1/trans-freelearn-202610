    \ |  |  |\n\nFrom the preceding examples, we can easily understand that the `PARENTGROUPVAL()`\
    \ function gets the summary value from one or more levels above, and that's why\
    \ it is called **parent group value**.\n\nNext, let's use the `PARENTGROUPVAL()`\
