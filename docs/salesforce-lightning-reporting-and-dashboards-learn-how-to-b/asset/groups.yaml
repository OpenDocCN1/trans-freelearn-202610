  mdcn: "\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_339_0.png)\n\n将快照发布到 **Chatter**\
    \ 组会获得该 **Chatter** 组中用户的关注。发布到 **Chatter** 组动态中的快照可以被组内的所有人看到——即使是那些没有仪表板访问权限的人，因此不要发布敏感信息。要将快照发布到\
    \ **Chatter** 组，请执行以下步骤：\n\n- 1. 打开仪表板。\n- 2. 选择要截取快照的组件；该组件将显示为一张大图表。\n- 3. 点击屏幕右下角的\
    \ **分享** 按钮。\n- 4. 选择发布到 **一个组**，然后输入组名称。\n- 5. 你可以在 **消息** 框中输入消息。\n- 6. 点击 **发布**\
    \ 按钮。如下图所示：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_340_0.png)\n\n## 通过 URL\
    \ 参数筛选报告\n\n如果你熟悉 Classic，可以通过在报告 URL 后添加 `pv` 来实现报告参数。在 Lightning 中如何做到呢？幸运的是，Salesforce\
    \ 提供了同样的功能，但在查看示例并动手练习之前，先让我们讨论一下这个功能有多强大。\n\n借助此功能，你可以在报告 URL 中传递值，这些参数相当于报告的筛选值。其中一个用途是：从记录页面创建一个自定义按钮或链接，指向已创建的报告，并通过特定筛选条件，根据源记录生成动态报告。例如，为一个客户（Account）的所有相关商机（Opportunities）生成报告。\n\
    \nURL 参数化报告的另一个用途是：可以针对不同目的复用同一份报告，而无需创建两份相似的报告。例如，在 URL 参数的情况下，针对“新业务管道（Pipeline\
    \ for New Business）”和“现有业务管道（Pipeline for Existing Business）”的报告，一旦报告加载完成，你可以创建带有\
    \ URL 参数的两个书签。\n\n将参数用作报告筛选器，可以避免创建许多仅靠筛选器区分的相似报告，也无需不断编辑报告并修改筛选值。\n\n### 通过 URL\
    \ 参数实现报告筛选器的动手练习\n\n用例：我们想要分析某些在客户页面布局中不可见的 **客户（Account）** 字段。报告将按 **客户名称（Account\
    \ Name）** 进行筛选，但与其反复编辑报告来更改 **客户名称（Account Name）** 值，不如使用带有 URL 参数的报告筛选器。\n\n\
    - 1. 创建一份简单的 **客户表格（Tabular Account）** 报告，并将其命名为 `Account Name Report`。\n- 2.\
    \ 将 **显示（Show）** 字段选择为 **所有客户（All accounts）**。\n- 3. 将 **日期字段范围（Date Field Range）**\
    \ 设置为 **所有时间（All Time）**。\n- 4. 添加筛选条件：**客户名称包含** `blank`；点击 **OK** 确认筛选。\n- 5.\
    \ 点击 **保存（Save）** 按钮，然后点击 **运行报告（Run Report）**。\n- 6. 点击 **报告（Reports）** 选项卡，然后重新打开该报告（它应出现在列表顶部）。\n\
    - 7. 下面的截图显示了生成的报告，并获取报告的 URL。在我的示例中，URL 是 `https://gs0.lightning.force.com/one/one.app#/sObject/00OB0000001sBuoMAE/view`：\n\
    \n![](img/72d01bea5a9ccf02f9452aab7505d9de_342_0.png)\n\n- 8. 好了，现在我们要向报告 URL\
    \ 添加一个参数。\n- 9. 假设我们希望显示所有名称中包含 united 的客户。\n- 10. 将 `united` 作为 URL 参数添加，然后在\
    \ Web 浏览器中按 Enter：`https://gs0.lightning.force.com/one/one.app#/sObject/00OB0000001sBuoMAE?fv0=united`。如下图所示：\n\
    \n![](img/72d01bea5a9ccf02f9452aab7505d9de_343_0.png)\n\n正如你在前面的截图中所见，添加到参数中的\
    \ united 成为报告的筛选值。如果你不保存报告，报告将保持原样；但如果保存报告，united 将被永久存储在该报告中。\n\n让我们分析一下前面的报告和\
    \ URL：\n\n- 这里是原始 URL：\n\n  `https://gs0.lightning.force.com/one/one.app#/sObject/00OB0000001sBuoMAE/view`\n\
    \n- 然后我们通过添加参数来修改 URL，如下所示：\n\n  `https://gs0.lightning.force.com/one/one.app#/sObject/00OB0000001sBuoMAE/view?fv0=united`\n\
    \n- 我们在报告 ID（即 `00OB0000001sBuoMAE`）后面添加 `?`；`&` 表示 URL 中的新参数。如果有多个参数，从第二个参数开始，将\
    \ `?` 替换为 `&`。\n- 我们添加 `fv0`，其中 `fv` 代表筛选值（filter value），作为参数名。`0` 是筛选条件在报告中出现的顺序编号：第一个筛选条件是\
    \ 0，第二个是 1，第三个是 2，以此类推。要设置报告中第二个筛选条件的值，请将 `fv1` 指定为参数名。标准筛选条件不计入此顺序，也无法通过 URL\
    \ 参数进行筛选。\n- 我们将 `united` 作为参数值添加——请记住，筛选条件不区分大小写，因此无论你输入 `united` 还是 `United`\
    \ 都没有关系。如果想添加一个包含空格的多词值，例如 `united oil`，你只需按原样输入即可，但浏览器会按照 URI 编码在中间添加 `%20`，因此它将变为\
    \ `https://gs0.lightning.force.com/one/one.app#/sObject/00OB0000001sBuoMAE/view?fv0=united%20oil.`\n\
    \n现在，如果我只想更改第二个参数的筛选值，而不想更改第一个参数的筛选值，该怎么办？这不成问题——你可以仅在参数中添加 `fv1`（不包含 `fv0`），例如：`https://gs0.lightning.force.com/one/one.app#/sObject/00OB0000001sBuoMAE/view?fv1=customer`。如下图所示：\n\
    \n![](img/72d01bea5a9ccf02f9452aab7505d9de_344_0.png)\n\n关于使用 URL 参数进行筛选，有几点需要注意，如下所示：\n\
    \n- URL 参数仅支持手动添加到报告中的字段筛选条件。\n- 它们不支持报告提供的标准筛选条件，例如 **角色层级（Role Hierarchy）**、范围、区域、**商机状态（Opportunity\
    \ Status）**、**概率（Probability）** 和日期筛选条件。\n- 它们不支持 **交叉筛选（Cross Filter）** 和 **行数限制（Row\
    \ Limit）** 筛选条件。\n- 手动添加为筛选条件的第一个字段将被视为第一个参数，即 `fv0`。\n- 如果报告中添加了图表，则在应用报告筛选条件（包括使用\
    \ URL 参数的筛选条件）时，图表会相应调整。\n- 你不能通过 URL 参数添加、更改或删除被筛选的字段；只能修改现有筛选条件的值。\n- 参数的添加顺序不必与报告筛选条件的顺序一致，例如，我们将\
    \ `fv1` 放在 `fv0` 之前：`https://gs0.lightning.force.com/one/one.app#/sObject/00OB0000001sBuoMAE/view?fv1=customer&fv0=united`；这里，`fv1`\
    \ 作为第一个参数添加，但它对应第二个筛选条件。然后我们添加 `fv0`（对应第一个筛选条件）作为第二个参数。仅在第一个参数前使用 `?`，然后使用 `&`\
    \ 分隔其他所有参数。\n\n## 设置和使用字段历史跟踪\n\n字段历史跟踪是 Salesforce 的一项开箱即用功能，用于跟踪字段中的值更改。每个对象最多可以选择\
    \ 20 个字段进行跟踪；如果需要跟踪更多字段，请联系 Salesforce 支持。对于 **长文本区域（Text Area (Long)）**、**富文本区域（Text\
    \ Area (Rich)）** 和 **多选下拉列表（Picklist (Multi-Select)）** 等字段类型，历史跟踪不会在记录更新时跟踪原始值和新值，而只跟踪该字段是否发生了更改。此功能虽然简单，但在审计用途上非常强大。\n\
    \nSalesforce 保留历史记录最长为 18 个月；但是，如果你需要更长时间的归档，请联系你的 Salesforce 支持以获取字段审计追踪（Field\
    \ Audit Trail），并定义你希望保留字段历史跟踪的时长策略。这项付费功能允许你将归档时间延长至最多 10 年。\n\n作为管理员，你可以通过几次点击自行启用字段历史跟踪——为标准对象和自定义对象选择某些重要字段进行跟踪。\n\
    \n请记住，在启用对象跟踪并选择字段进行跟踪之前，字段值不会被跟踪。这意味着，如果你今天启用了 **客户名称** 的跟踪，你将无法跟踪今天之前对 **客户名称**\
    \ 所做的更改。\n\n历史跟踪不仅用于跟踪你何时编辑记录，还用于跟踪你何时创建新记录，包括 **线索（Lead）** 被转换时创建的记录。当你创建新记录时，字段历史条目将被标记为\
    \ **已创建**；当记录由 **线索（Lead）** 记录转换而来时，则被标记为 **由线索转换创建**；旧值和新值都将为空。\n\n### 标准对象的历史跟踪\n\
    \n历史跟踪同时支持标准对象和自定义对象。但并非所有标准对象都支持字段跟踪；只有以下标准对象支持历史跟踪：**客户（Accounts）、文章（Articles）、资产（Assets）、营销活动（Campaigns）、个案（Cases）、联系人（Contacts）、合同（Contracts）、合同行项目（Contract\
    \ Line Items）、权利（Entitlements）、线索（Leads）、商机（Opportunities）、订单（Orders）、订单产品（Order\
    \ Products）、产品（Products）、服务合同（Service Contracts）和解决方案（Solutions）。**\n\n要在标准对象（如\
    \ **客户**）上启用历史跟踪，请执行以下步骤：\n\n- 1. 导航到 **设置 | 对象和字段 | 对象管理器 | 客户 | 字段和关系**，然后点击\
    \ **设置历史跟踪** 按钮。\n- 2. 勾选 **启用客户历史** 复选框。\n- 3. 选择要跟踪的字段。\n- 4. 请注意，**描述** 将仅被跟踪更改情况。这是因为\
    \ **描述** 是一个 **长文本区域（Text Area (Long)）** 字段，这与跟踪类型为 **长文本区域（Text Area (Long)）**、**富文本区域（Text\
    \ Area (Rich)）** 和 **多选下拉列表（Picklist (Multi-Select)）** 的字段时相同。\n- 5. 点击 **保存**\
    \ 按钮以保存更改。\n\n"
