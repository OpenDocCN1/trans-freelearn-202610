  - '[PAGE 305]


    Note that when the user clicks on **View Report** from a dashboard component,
    it will show the records visible for that user only, not as the dashboard viewing
    user. Therefore, reports generated may differ for each user.


    A normal dashboard runs using the security settings of a specific user, which
    is the defined user. All users with access to the dashboard will see the same
    data, regardless of their own personal settings. One of the good use cases of
    using a normal dashboard is to show the dashboard as someone from top-level management
    in the company, such as the head of the business unit or the country head, so
    employees know the overall company performance. Also a good approach is to motivate
    team members by showing peer performance within a team.


    # What is a dynamic dashboard?


    Dynamic dashboards offer users the ability to view the dashboard with data based
    on the running user data visibility, or data visibility of someone in the team
    or in your organization; this depends on the user permissions and dashboard setting.
    With a dynamic dashboard, the user can see a dashboard based on running user data
    visibility; this is much more simpler, without having to create separate dashboards
    for each user.


    This is useful when you have the dashboard for each sales representative; when
    the sales representative logs in, they will see their own data, but when the manager
    logs in, they will see their team data. Also the manager will be able to see each
    of his team dashboards by changing the viewing user without the need to change
    the dashboard. Note that the manager needs to have the **View My Team''s Dashboards**
    permission for this purpose.


    Combining the dynamic dashboard with the dashboard filter discussed earlier will
    give the manager an overall view of the team pipeline or a view of the other statistics.


    In Chapter 2, *Concepts and Permissions in Reports and Dashboards*, we discussed
    permissions related to dashboards. Some of the permissions are specifically related
    to dynamic dashboards only:


    +   - The **Manage Dynamic Dashboards** permission

    +   - The **View My Team''s Dashboards** permission'
