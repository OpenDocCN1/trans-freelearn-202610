    # Creating a Summary report


    We will not go through each step to create a report, as it has been covered in
    detail in earlier chapters. This report needs to be in a Summary format--group
    by Stage, add the Amount column, and summarize it with Sum. See the next screenshot,
    and make sure you get a similar one.


    You can store the report in any folder as long as the running user is able to
    access the report. But, as a good practice, create a new report folder purposely
    only for Reporting Snapshot.


    Let us name this report as `Opportunity by Stage (for Snapshot)`:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_357_0.png)


    # Creating a custom object


    This custom object will be used to store all values when the snapshot is run on
    schedule. Navigate to Setup | Objects & Fields | Object Manager | Create | Custom
    Objects to create a new object; let us name the object as `Opportunity Snapshot`.
    Set the record name data type to Auto Number.'
  - '[PAGE 358]


    # Creating custom fields


    From the custom object created previously, create the following fields to store
    values from the report and snapshot running information, and make sure the fields
    created have the correct field type. Consider the screenshot for fields that need
    to be created:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_358_0.png)


    In this exercise, we will capture the group summary (this is defined by the report
    used as Source Report, which is in the Summary format), so we just need a few
    custom fields to store the summary information, which, for this exercise, are
    Record Count and Total Amount.'
