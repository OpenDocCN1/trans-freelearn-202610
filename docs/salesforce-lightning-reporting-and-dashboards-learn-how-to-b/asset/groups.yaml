    Depending on the user permissions, the user will see different actions; let''s
    quickly explain each of the action available:


    +   - **Edit**: This is used to edit the report in the report builder

    +   - **Clone**: This is used to clone to a new report; you will have the option
    to store it as a private report, make it public, or store it to a specific folder

    +   - **Save**: This saves the report with any changes made, such as adding a
    chart

    +   - **Subscribe**: This subscribes a report for email delivery on a schedule;
    we will discuss this in the next section

    +   - **Export**: This is used to export a report into comma-delimited `.csv`
    or Excel format `.xls`

    +   - **Delete**: The report deleted will be available in the Recycle Bin for
    15 days and can be restored at that time


    # Subscribing reports


    In Lightning Experience, you can subscribe to up to five reports and receive refreshed
    report results by email on a schedule that you set--Daily, Weekly, or Monthly.


    To subscribe to reports, you need to have the **Subscribe to Reports** permission
    granted from **Profile** or **Permission Set**. On top of that, there are two
    more additional permissions related to this:


    +   - **Subscribe to Reports: Add Recipients**

    +   - **Subscribe to Reports: Set Running User**


    These permissions require the **Subscribe to Reports** permission to be enabled.'
