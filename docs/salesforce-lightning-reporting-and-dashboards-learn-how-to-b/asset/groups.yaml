    \n我们在 *报表权限* 部分讨论了**运行报表**权限，我们在这里不会重复，但我们想强调的是，Salesforce 中的仪表板基于报表。Salesforce\
    \ 中每个仪表板组件都由报表作为后端数据源支持。\n\n要允许用户在 Salesforce 中打开或查看仪表板，用户需要拥有运行报表的权限，并且仪表板查看用户必须有权访问用作仪表板组件数据源的报表。如果没有**运行报表**权限，用户在打开仪表板时会收到错误消息，提示**您没有权限运行报表。请检查您是否具有运行报表用户权限。**\n\
    \n**运行报表**是每个在 Salesforce 中使用报表和仪表板的用户所需的基本权限，即使只是运行或打开报表或仪表板也需要此权限。\n\n#### 创建和自定义仪表板权限\n\
    \n**创建和自定义仪表板**权限控制用户创建新仪表板或修改现有仪表板的能力。如果没有此权限，用户在单击**仪表板**选项卡时将无法看到**新建仪表板**按钮。\n\
    \n此权限也需要**运行报表**权限。如果**运行报表**权限被禁用，则为用户启用**创建和自定义仪表板**是无用的。\n\n#### 管理动态仪表板权限\n\
    \n**管理动态仪表板**权限允许用户创建和编辑动态仪表板。我们将在 *第 10 章，学习高级仪表板配置* 中更详细地了解动态仪表板。但现在，您只需要了解动态仪表板允许已登录用户根据用户权限和角色层级选择其他用户作为查看用户。\n\
    \n在创建或编辑仪表板时，拥有此权限的用户将有选项将仪表板运行用户设置为已登录用户，或允许打开仪表板的用户更改查看用户。以下截图显示了启用动态仪表板：\n\n\
    ![](img/72d01bea5a9ccf02f9452aab7505d9de_65_0.png)\n\n#### 查看我的团队仪表板权限\n\n**查看我的团队的仪表板**权限允许用户查看角色层级中其下属人员拥有的仪表板。\n\
