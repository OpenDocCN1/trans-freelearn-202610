    button.


    You can add chart to other page layouts, including custom objects with the relationship:


    +   - For a Master-Detail Relationship, you do not need to change anything; the
    detail field for the page layout does not have to be in the report or chart to
    have the option to filter by the parent field.

    +   - For a Lookup Relationship, make sure the parent field is available for the
    report type; otherwise, create a new report type to accommodate it. The same goes
    for the Master-Detail relationship; you do not need to add that field in the report
    or chart.'
  - '[PAGE 226]


    # Summary


    In this chapter, we went through the types of chart available in Salesforce Lightning.
    Anyone able to run the report will be able to add or modify the chart on-the-fly
    when running the report. This includes users without the permission to create
    and customize the report. We also discussed report formats that support the addition
    of a chart.


    If a chart is added to the report and the report is stored in public folders,
    we can embed the chart into the record page layout. We can have up to two charts
    in a page record. Only the system admin or a user with a customizing application
    permission is able to add a chart to the page layout. You have the option to set
    the chart to auto-refresh in 24 hours or get it refreshed manually by the user.


    In the next chapter, we will discuss how to work with reports. Reports in Lightning
    offer many features for us the explore; we can then analyze the data generated
    from them.'
  - '[PAGE 227]


    # Working with Reports


    In our daily work, most of us deal with running a report rather than creating
    or editing the report. Therefore, it is important to equip ourselves with the
    knowledge to work with reporting in the Lightning Experience, including tips to
    make our job more effective and efficient.


    In this chapter, we will discuss how to work with a report, including opening
    a report, searching a report, and adding a report to favorites. Then, we will
    continue with navigating a report and components that you need to be aware of
    when running a report, including adding a chart, the show or hide report option,
    and change and remove report filters.


    By the end of this chapter, you will be fully equipped with the working knowledge
    of Salesforce reporting in Lightning, including subscribing reports for report
    delivery by email.


    Throughout this chapter, we will provide notes and tips to help you to understand
    important items. The following topics will be covered:


    +   - Opening and searching reports

    +   - Navigating to a report and report components

    +   - Subscribing reports


    # Opening a report


    Let''s start with opening a report in Salesforce Lightning; remember that reports
    are stored in the report folder, either in a private or public folder. Private
    reports are only accessible by the user who saves the report into the **My Personal
    Custom Reports** folder. We have discussed this in depth in *Chapter 2, Concepts
    and Permissions in Reports and Dashboards*, please refer to that chapter for a
    refresher on permissions.'
  - '[PAGE 228]


    There are multiple ways to open a report in Salesforce Lightning. First, click
    on the **Reports** tab.


    # The Reports tab


    You will see two main panels here: the left-hand side panel and the right-hand
    side panel. The left-hand side panel contains categories of **Reports** and **Folders**,
    and the right-hand side panel will show a list of reports or folders related to
    the menu selected in the left-hand side panel.


    # The Reports menu


    Once you click on the **Reports** tab, you will see all things related to reports.
    There are two main categories on the left panel, which are **Reports** and **Folders**.
    Under the **Reports** category, there are multiple menus which will filter the
    reports shown in the right-hand side panel. Consider the following screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_228_0.png)'
