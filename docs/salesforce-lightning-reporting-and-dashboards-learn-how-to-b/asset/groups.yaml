- raw:
  - "[PAGE 148]\n\n# Understanding Report Types\n\nIn this scenario, the custom report\
    \ type comes into the picture. We can create a custom report type customers with\
    \ or without claims. This report type will produce customer information with claim\
    \ information even if the customer does not have any claims. This report type\
    \ will generate reports with all customer data. See the gray area in the following\
    \ screenshot:\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_148_0.png)\n\nWith the\
    \ custom report type, we can define a Primary object and relate it to the child\
    \ objects, where:\n\n+   - The record in the primary object must have at least\
    \ one record of a related object\n+   - The record in the primary object may or\
    \ may not have records of a related object\n\n> Custom report types start from\
    \ the top-level object as the **Primary object**; they support only one child\
    \ object per hierarchy but allow you to create multiple levels of parent and child\
    \ hierarchies.\n> \n> With the custom report type, you can define which objects’\
    \ fields can be made available for report columns. If a field is removed from\
    \ the custom report type, that particular field will be removed from all reports\
    \ built with that report type."
  - "[PAGE 149]\n\n# Hands-on exercise for creating a Custom Report type\n\nThis exercise\
    \ is applicable only to the system admin or the user with the **Manage Custom\
    \ Report Types** permission. In this exercise, we will create a new custom report\
    \ type where **Customer** is the Primary object, it may or may not have **Claim**,\
    \ and claim may or may not have claim payment. Make sure all objects have been\
    \ created and enabled for reporting.\n\n+   1. Navigate to **Setup | Feature Settings\
    \ | Analytics | Reports & Dashboards | Report Types** (or you can easily find\
    \ the menu by entering `report types` in the **Quick Find** textbox in the **Setup**\
    \ menu) and click on the **New Custom Report Type** button.\n+   \n+   2. In **Primary\
    \ Object**, the selected object will be in the top hierarchy for the report type;\
    \ in this exercise, select **Customers**.\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_149_0.png)\n\
    \n> Once the record type is saved, you cannot change the primary object.\n\n+\
    \   3. Enter **Report Type Label** and the **Report Type Name**. The label can\
    \ be up to 255 characters long; for this exercise, label it `Customers with/without\
    \ Claims with/without Payment`. The name will be auto-populated, you can modify\
    \ it, but just leave it for this exercise.\n+   \n+   4. Enter **Description**\
    \ for the custom report type; you can enter up to 1,000 characters. This description\
    \ is mandatory and will be shown when users select the report type to create a\
    \ report. Provide a meaningful description so users have a good idea of which\
    \ data is available for reports, for example, `All customers with Claim information`.\n\
    +   \n+   5. Select **Store in Category**; always store the report type in the\
    \ correct category; for users to find the report type easily, select **Other Reports**."
  - "[PAGE 150]\n\n+   6. Select **Deployment Status**; click on the **Next** button\
    \ to continue.\n+      - **In Deployment:** The report type with this status is\
    \ only available for the system admin and users with the **Manage Custom Report\
    \ Types** or **Customize Application** permission. Select this option during the\
    \ design and testing phase. The report type and its reports are hidden from all\
    \ other users.\n+      - **Deployed:** This report type and its report will be\
    \ available for everyone. Change to this option after it is tested and you are\
    \ ready to let all users to access it.\n\n+   7. Click on the **Next** button\
    \ to continue.\n+   \n+   8. Customers will be shown as a Primary object; click\
    \ on **(Click to relate to another object)** to relate to a child object. In our\
    \ exercise, select **Claims** and then do the same to relate Claims to **Claim\
    \ Payments**.\n+   \n+   9. Click on the **Save** button to finish it. Consider\
    \ the following screenshot:\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_150_0.png)"
  - '[PAGE 151]


    # Understanding Report Types


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_151_0.png)


    Custom report types start from the top-level object as the Primary object, for
    example, **Customer with Claims**; this report will get all customers with and
    without claim. But how about if you would like to report all claims and the customer
    information regardless of whether it linked to customer or not - **Claim with
    Customers**.


    You still can use the custom report type for this scenario. Set claims as the
    primary object without relating to another object and then use **Add fields related
    via lookup** » to add fields from the customer object.


    # Hands-on exercise for extending Custom Report types


    Let''s modify the **Customers with/without Claims with/without Payment** report
    type created earlier with the following requirements:


    +   - The claim object also has a Lookup relationship to the **Policy** custom
    object. We would like to get status field from **Policy** object.

    +   - Because of privacy, the management decides not to make a field called **Tier**
    under the **Customer** object available for the user to use in the report.


    With these requirements, let''s open and edit the report type created:


    +   1. Open the report type created by navigating to **Setup | Feature Settings
    | Analytics | Reports & Dashboards | Report Types** (or you can easily find the
    menu by entering *report types* in the **Quick Find** textbox in the **Setup**
    menu) and click on the report type name.'
  - '[PAGE 152]


    # Understanding Report Types


    +   2. Now, you should see the **Fields Available for Reports** section in that
    report type. Click on the **Edit Layout** button to add the **Policy Status**
    field to the report type; by default, policy-related fields will not be available
    for the report type as shown in the following screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_152_0.png)'
  - '[PAGE 153]


    +   3. Change the View to **Claim Fields** and then click on **Add fields related
    via lookup »** below the Lookup. Because **Policy** is a lookup field from the
    Claim object, you should see the **Policy »** link here. Consider the following
    screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_153_0.png)


    +   4. Select the checkbox next to **Status** and then click on the **OK** button.

    +   5. Now you should see Status (with the magnifying glass icon) added to the
    Claims section.

    +   6. Next, we would like to remove the **Tier** field from **Customers**; just
    drag and drop the **Tier** field to the **Customers Fields** panel on the right-hand
    side as shown in the following screenshot:'
  - '[PAGE 154]


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_154_0.png)


    7. Click on the Save button.


    8. Note that, in the Fields Available for Reports section, the Customers field
    now becomes seven fields and Claims becomes 10 fields.


    # Hands-on exercise for using a Custom Report type


    In this exercise, we are going to use the report type created and edited in the
    preceding exercises:


    +   1. Click on the Reports tab and then click on the New Report... button.

    +   2. Type customer into the Quick Find textbox under Select Report Type.

    +   3. Select Customers with/without Claims with/without Payment and then click
    on the Create button.'
  - '[PAGE 155]


    <!-- no content -->'
  - '[PAGE 156]


    5. There are three fields added by default when you select this report type--
    **Customer Name, Claim Name, Claim Payment Name**. The following screenshot shows
    that there are three fields checked. So, if you would like to add more default
    fields, for example, **Policy: Status**, double-click on the field and select
    the **Checked by Default** checkbox. Consider the following screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_156_0.png)


    6. We do not plan to store this report, so we can just ignore the report builder
    from here. However, if you would like to save the report, feel free to save it
    to your personal report folder.


    # Limitations and benefits of Custom Report types


    As we went through this chapter, we can make use of custom report types for the
    following:


    +   - Filtering the report result related to the child object

    +   - Extending the report with look fields from the parent object

    +   - Hidden fields will not be available for the report

    +   - Setting default fields added when creating a new report


    Here are some limitations when implementing a custom report type:


    +   - A custom report type can contain up to 60 object references.

    +   - You can add up to 1,000 fields to each custom report type.

    +   - The maximum report type name length is 50 characters, including spaces.'
