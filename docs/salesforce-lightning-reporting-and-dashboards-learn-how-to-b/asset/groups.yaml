    +   - **Map Summary Fields from Source Report to Target Object.** This is shown
    in the following screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_360_0.png)


    +   - Click on the **Save** button to continue.


    # Scheduling a Reporting Snapshot


    Once the **Reporting Snapshot** is created, click on the **Edit** button in the
    **Schedule Reporting Snapshot** section.


    +   - Optionally, you can enable the email sent to you or to other users based
