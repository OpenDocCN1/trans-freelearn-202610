    - **订阅**：按计划订阅报告以通过电子邮件递送；我们将在下一节讨论

    - **导出**：用于将报告导出为逗号分隔的 `.csv` 或 Excel 格式 `.xls`

    - **删除**：已删除的报告将在回收站中保留 15 天，并可在此期间恢复


