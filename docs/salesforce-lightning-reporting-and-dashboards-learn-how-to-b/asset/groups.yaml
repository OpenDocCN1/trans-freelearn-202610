    Once you are in the **Edit** mode or the **Dashboard Builder**, you can add, delete,
    or modify existing components, the same as when you create a new dashboard. You
    can save the modified dashboard as a new dashboard by clicking on the **Save As**
    link under the arrow next to the **Save** button, or you can even delete the dashboard
    with the **Delete** link under **Save As**, as shown in the following screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_277_0.png)


    OK, let''s look at a hands-on exercise to edit the dashboard created earlier by
    adding a new component and then saving the dashboard as a new dashboard:


    1. Open **Account Dashboard**.

    2. Click on the **Edit** button.

    3. Click on the first component (leftmost) and change the size to four columns
    with three rows.

    4. Move the second component accordingly to the right of the first component.

    5. Add the new component by clicking on the **+ Component** button.

    6. Select the same **Account by Owner** report.

    7. Select the **Vertical Bar Chart**.

    8. Change **Sort Rows By** to **Value Ascending**.

    9. Add **Subtitle** as `All accounts` and **Footer** as `Date = all time`.

    10. Click on the **Add** button.

    11. Modify the component size to two columns with three rows and move it to the
    right of the second component.

    12. Click on the **Save As** link under the arrow next to the **Save** button;
    if you click on the **Done** button, the system will ask if you would like to
    save or discard changes.

    13. Enter the name as `Account Dashboard copy`; leave the folder as the existing
    folder.

    14. Click on the **Create** button. Refer to the following screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_278_0.png)


    15. Now we are no longer in the edit mode or the dashboard builder; we are in
    the view mode. Note that there are a few buttons and links in the top-right section:


    - **Refresh:** Click on this button to refresh the dashboard data.

    - **Edit:** Click on this button to edit the dashboard.

    - **Clone:** Click on this link to clone as a new dashboard without the need to
    edit, and save as a new dashboard.

    - **New Dashboard:** Click on this to create a new dashboard without the need
    to go back to the **Dashboards** tab.

    - **Delete:** Click on this to delete the existing dashboard; the deleted dashboard
    will be moved to the Recycle Bin (as of the Summer ''17 release, you need to switch
    to Classic to access the Recycle Bin).


    Next, let''s move the **Account Dashboard copy** dashboard from the **Company
    Dashboards** folder to a folder called **Asia Sales**:


    1. Edit the dashboard.

    2. Click on the gear icon **Edit Dashboard Properties** button.

    3. Click the existing folder, select the new folder, and then click on the **Save**
    button to close the properties window. This is shown in the following screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_279_0.png)


    4. Click on the **Save** button again to save the changes for the dashboard.

    5. Now the dashboard should be located in a new folder; you can double-check by
    clicking on the Dashboards tab, and it should be listed in the recent items.


    ## The dashboard components


    As mentioned earlier, one dashboard can contain up to 20 components, and each
    component can be present in the form of a chart, a matrix, or a table.


    The two main steps to build a dashboard are as follows:


    1. Select a report as the data source.

    2. Select the component type.


    ### Defining the dashboard components


    There are 11 types of dashboard components available in Salesforce Lightning (as
    of the Summer ''17 release):


    - Horizontal Bar Chart

    - Vertical Bar Chart

    - Stacked Horizontal Bar Chart

    - Stacked Vertical Bar Chart

    - Line Chart

    - Donut Chart

    - Metric Chart

    - Gauge Chart

    - Funnel Chart

    - Scatter Chart

    - Table


    The highlighted area in the following screenshot shows these:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_281_0.png)


    We will not discuss all the types of components, but let''s discuss a few of them.


    ### Tables


    Tables are useful in presenting information in an easy-to-scan format. Charts
    give dashboard readers information at a glance, and tables give more details.
    Add a table to your dashboard to show the data in summary, as shown in the following
    screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_282_0.png)


    | STAGE | SUM OF AMOUNT |

    |---|---:|

    | Value Proposition | $330,000.00 |

    | Qualification | $282,000.00 |

    | Negotiation/Review | $236,000.00 |

    | Id. Decision Makers | $170,000.00 |

    | Proposal/Price Quote | $100,000.00 |


    ### Funnel charts


    Use a funnel chart when you have multiple groupings in an ordered set and want
    to show the proportions among them. Funnel charts are ideal to show the stages
    of your opportunities. Consider the following screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_283_0.png)


    ### Gauge charts


    Gauge charts added to Lightning Experience dashboards show percentages and the
    total by default. You can manually set the value for each segment range, and you
    also can change the chart color. Consider the following screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_284_0.png)


    ### Stacked Bar charts


    Stacked bar charts are great to compare absolute values between bars. To use a
    stacked bar chart, the report must have at least two groupings, and one of the
    groupings must be a number.


    You can configure the stacked bar chart to 100%; this enables you to compare relative
    values for each bar. For example, the stacked bar lets you compare the proportion
    of opportunity among sales representatives.


    The following screenshot shows two stacked bar charts; the one on the right-hand
    side is configured with Stack to 100%:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_285_0.png)


    ### Scatter charts


    Scatter charts are useful to show one or two groups of report data plus summaries.
    They are also useful in identifying trends across large datasets. To use a Scatter
    Chart, the report must have at least two summarized fields. Scatter charts will
    easily show the opportunity age with the opportunity stage. Consider the following
    screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_286_0.png)


    ### Cumulative Line charts


    Instead of a normal line chart, you can configure the line chart as a cumulative
    line chart. You can make your line charts on cumulative reports to highlight closed
    won opportunities over months. Consider the following screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_287_0.png)


    ### Combination charts


    Combination charts plot two or more sets of data on a single chart, making charts
    *multimetric*. For example, the bar chart shows the pipeline **Amount** for each
    month, while the **Line Chart** shows the number of the pipeline for each month,
    adding the second y-axis on the right-hand side for additional measurement. This
    is shown in the following screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_288_0.png)


    ## Reports as a data source


    Salesforce gives you the flexibility to use any saved reports as the data source
    for the component. However, a component that uses the report saved in the **My
    Personal Custom Reports / Private Report** folder will not work for other users,
    unless the report is stored in a private report folder of the viewing user because
    the dashboard is viewed as the private report folder owner.


    You can use any report type of a report as the data source, but for a **Tabular**
    format report, only the **Tabular** report with a **Row Limit** filter added can
    be used as the data source. Consider the following screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_289_0.png)


    The takeaway from this section is not to assume that types of charts and features
    of the chart in a report and a dashboard are the same. They look similar, but
    they are not exactly the same.


    ## Summary


    In this chapter, we worked with reports, including opening a report, searching
    for a report, and adding a report to favorites. We also navigated reports and
    discussed each component available when running reports.


    When you click on the **Reports** tab, you will be presented with the recently
    opened reports. You can click on the header to sort in finding a report. There
    is a menu under **REPORTS**. Under **REPORTS** would be the **FOLDERS** category,
    where you can check the folder that you create, the folder shared with you, and
    all folders you have access to.


    The action button is available in the Reports tab for each report, and it is also
    available after opening a report depending on the user permission in general and
    user permission related to the specific report.


    You also learned about subscribing to reports; for report delivery to emails,
    you need to have permissions to subscribe to a report, and there are up to five
    reports you can subscribe to.


    In the next chapter, we will start working with dashboards, where a report serves
    as the data source for the dashboard component.

