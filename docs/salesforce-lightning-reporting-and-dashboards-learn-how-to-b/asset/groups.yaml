    # The PREVGROUPVAL() function


    The PREVGROUPVAL() function returns the value of the previous grouping on the
    same hierarchy level. This allows you to prepare reports that show, for example,
    the month-to-month opportunity comparison; the main difference with the PARENTGROUPVAL()
    function is the return value from the higher hierarchy level.


    The formula syntax for the PARENTGROUPVAL() function is the same for all report
    formats:


    *PREVGROUPVAL(summary_field, grouping_level [, increment]).*


    There is not much difference in the navigation and tips to get the formula parameters
    for the PARENTGROUPVAL() function compared to the PARENTGROUPVAL() function. The
    only difference in the syntax is an additional optional parameter **incremental**.
    If we skip this parameter, it will use the default value, which is 1. The increment
    is the number of columns or rows before the current summary; the **minimum** and
    the default value is 1, while the maximum is 12.


    Although the syntax is almost similar to the PARENTGROUPVAL() function, the functionality
    is totally different. Both functions serve a different purpose to make our report
    powerful.


    The same is the case with the PARENTGROUPVAL() function; this function is not
    applicable when you opt to display this formula: At **All summary levels, Grand
    summary only**. It will work only for field level groupings for the **Summary**
    report and **specific row/column grouping level** for the **Matrix** report.'
  md: "\n# Advanced Report Configuration\n\n| CLOSE DATE | OPPORTUNITY OWNER | OPPORTUNITY\
