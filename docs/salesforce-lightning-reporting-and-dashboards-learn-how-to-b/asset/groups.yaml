  mdcn: "\n\n13. 在 **Filters** 中，导航到 **Add** 按钮后点击箭头 | **Filter Logic**。\n参考以下截图：\n\
    \n![](img/72d01bea5a9ccf02f9452aab7505d9de_118_0.png)\n\n+   14. 默认的过滤逻辑值为 **1\
    \ AND 2 AND 3**；手动将其更改为 **( 1 AND 2 ) OR 3**。\n+   \n+   15. 点击 **OK** 按钮确认过滤逻辑。\n\
    +   \n+   16. 点击 **Save** 按钮并执行以下操作：\n+      - **Report Name** 为 `Account with\
    \ Filter Logic`\n+      - **Report Description** 为 `All Accounts with No of Employee\
    \ more than 1000, or Customer in US or UK`\n+      - **Report Folder** 为 **My\
    \ Personal Custom Reports**\n+   \n+   17. 点击 **Run Report** 按钮生成报表。\n\n您可以根据需要增强前述的过滤逻辑；确保其具有正确的括号配对以及正确的值和运算符。\
    \ 从本次练习中我们学到的另一件事是，我们在过滤值中使用逗号；如果您有多个值，只需在过滤值中添加逗号，例如 **Billing Country equals\
    \ United States, United Kingdom**。\n\n以下是针对用例需求的报表最终结果，因为我们锁定了所有过滤器；请注意，用户在运行报表时无法更改或删除过滤器。\
    \ 但如果您有权限编辑报表，请点击 **Edit** 按钮修改已添加的过滤器、删除现有过滤器或添加更多过滤器：\n\n| ACCOUNT OWNER | ACCOUNT\
    \ NAME | TYPE | EMPLOYEES | BILLING COUNTRY |\n|---|---|---:|---|\n| Johan Yu\
    \ | PMA Manufacturing | Prospect | 1,500 | - |\n| Alvin Lee | United Oil & Gas,\
    \ UK | Customer - Direct | 24,000 | - |\n| Johan Yu | United Oil & Gas, Singapore\
    \ | Customer - Direct | 3,000 | - |\n| Johan Yu | Burlington Textiles Corp of\
    \ America | Customer - Direct | 9,000 | USA |\n| Johan Yu | Pyramid Construction\
    \ Inc. | Customer - Channel | 2,680 | France |\n| Johan Yu | Grand Hotels & Resorts\
    \ Ltd | Customer - Direct | 5,600 | - |\n| Johan Yu | Express Logistics and Transport\
    \ | Customer - Channel | 12,300 | - |\n| Johan Yu | University of Arizona | Customer\
    \ - Direct | 39,000 | - |\n| Johan Yu | United Oil & Gas Corp. | Customer - Direct\
    \ | 145,000 | - |\n| Johan Yu | Super Force | Customer - Direct | 800 | United\
    \ States |\n| Alvin Lee | Accurate Glass | Customer - Channel | - | United States\
    \ |\n| Johan Yu | Quality Materials | Customer - Channel | - | United Kingdom\
    \ |\n| **Grand Total (12 records)** |  |  |  |  |\n\n**Show Me:** All accounts\n\
    \n**Created Date:** All time\n\n**Locked Filters**\n\n(1 AND 2) OR 3\n\n1. Type\
    \ contains Customer\n2. Billing Country equals United States, United Kingdom\n\
    3. Employees greater than \"1,000\"\n\n## The Cross Filter\n\n使用 **Cross Filter**，您可以为某个对象及其与其它对象和其字段的依赖关系创建报表。\
    \ 您可以使用 **WITH** 关键字，例如 **All Account WITH Opportunity**。 此外，您还可以使用 **WITHOUT**\
    \ 关键字创建例外报表，例如 **Account WITHOUT Closed Won Opportunity this year**。 该报表对于销售经理和管理团队评估休眠客户非常重要。\n\
    \n> > 此过滤器在 **Joined** 格式或报表类型不允许可选相关对象的任何报表中都不可用\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_119_0.png)\n\
    \n### Hands-on exercise for using the Cross Filter\n\n没有任何进一步解释，让我们逐步了解如何在报表中创建\
    \ **Cross Filter**。\n\n让我们考虑一个用例：**Show all accounts** 且 **Type** 为 **Customer**\
    \ 并拥有 **Opportunities**：\n\n+   1. 导航到 **Reports** 选项卡并点击 **New Report** 按钮。\n\
    +   2. 选择 **Accounts** 报表类型并点击 **Accounts & Contacts** 类别下的加号。\n+   3. 点击 **Create**\
    \ 按钮继续。\n+   4. 将 **Show** 更改为 **All accounts**。\n+   5. 将 **Date Field Range**\
    \ 更改为 **All Time**。\n+   6. 点击 **Add** 按钮并选择 **Type contains Customer - Direct,\
    \ Customer - Channel**。\n+   7. 点击 **OK** 按钮确认过滤器。\n+   8. 在 Filters 中，导航到 **Add**\
    \ 按钮后点击箭头 | **Cross Filter**。\n+   9. 选择 **Accounts with Opportunities**。 这在以下截图中显示：\n\
    \n![](img/72d01bea5a9ccf02f9452aab7505d9de_120_0.png)\n\n10. 点击 **OK** 按钮确认过滤器。\n\
    \n+   11. 点击 **Save** 按钮：\n+   - **Report Name** 为 `Customer with Opportunities`\n\
    +   - **Report Description** 为 `All Customer with Opportunities`\n+   - **Report\
    \ Folder** 为 **My Personal Custom Reports**\n\n12. 点击 **Run Report** 按钮生成报表。\n\
    \n让我们使用同一报表并对其进行自定义：\n\n+   1. 打开报表并点击 **Edit** 按钮。\n+   2. 点击 **Accounts with\
    \ Opportunities** 过滤器中的 **Edit** 链接。\n+   3. 点击 **Add Opportunities Filter** 链接。\n\
    +   4. 选择 **Won equals True**；由于这是选择列表字段，您可以使用放大镜图标选择值。\n+   5. 再次点击 **Add Opportunities\
    \ Filter** 链接。\n+   6. 输入 **Close Date greater or equal LAST 365 DAYS**；使用相对日期值是一个好主意，以使报表动态化而不是使用硬编码值。\n\
    +   7. 点击 **OK** 按钮确认过滤器。\n+   8. 点击 **Run Report** 按钮生成报表。\n\n此报表将生成所有在过去 1 年内\
    \ Closed Won 日期在今天之前的 Customers with Opportunity：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_122_0.png)\n\
    \n## Hands-on exercise for creating more scenarios using the Cross Filter (2)\n\
    \n让我们使用与前一个相同的报表，通过 **Cross Filter** 查看更多场景。 这里的用例是：管理层希望获取一份没有 Won 机会的 Customers\
    \ 列表，包括没有 Opportunities 的 Customers。\n\n首先，让我们查看以下两个报表：\n\n+   1. 报表具有以下过滤器 **Account\
    \ with Opportunities: Won equals True:**\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_123_0.png)\n\
    \n2. 报表具有以下过滤器 Account with Opportunities: Won equals False:\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_124_0.png)\n\
    \n前述截图中的几个账户，Edge Communications、Express Logistics and Transport、GenePoint、Grand\
    \ Hotels & Resorts Ltd、United Oil & Gas Corp. 和 University of Arizona 同时出现在两个报表中。\
    \ 这是因为这些账户既有 Stage 为 Closed Won 的机会，也有仍处于 Open 或 Closed Lost 的机会。 请记住，一个账户可能有多个机会。\n\
    \n对于此用例，使用交叉过滤器不是正确的方法。 解决方案是在账户中使用 Roll-up Summary 字段并将其添加到过滤逻辑中。\n\n9. 创建一个\
    \ Account 报表并使用 No of Won Opportunity 字段作为报表过滤器；让我们将其命名为 Customer with No Won\
    \ Opportunities：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_126_0.png)\n\n此报表显示我们并非所有场景都适合使用带附加过滤器的\
    \ Cross Filter。\n\n## The Row Limit filter\n\nRow Limit 过滤器仅适用于 Tabular 报表。 当您使用\
    \ Summary、Matrix 或 Joined 格式报表时，它将不可用。\n\n一旦在 Tabular 报表中添加了行限制，您可以配置 Dashboard\
    \ Settings。 从 Dashboard Settings 中，选择要在仪表板表格和图表中使用的名称和值。 表格同时显示名称和值，而图表按名称分组。\n\
    \n配置了 Dashboard Settings 的 Tabular 报表可作为 Dashboard 组件的数据源使用。\n\n## Hands-on exercise\
    \ for adding Row Limit and the Dashboard Settings button\n\n让我们考虑一个用例：创建一个报表，显示员工人数最多的前五名\
    \ Accounts 并将报表配置为仪表板的数据源：\n\n+   1. 导航到 **Reports** 选项卡并点击 **New Report** 按钮。\n\
    +   2. 选择 **Accounts** 报表类型并点击 **Accounts & Contacts** 类别下的加号。\n+   3. 点击 **Create**\
    \ 按钮继续。\n+   4. 将 **Show** 更改为 **All accounts**。\n+   5. 将 **Date Field** 范围更改为\
    \ **All Time**。\n+   6. 从报表中删除不需要的默认字段，只保留 **Account Owner** 和 **Account Name**。\n\
    +   7. 通过拖放将 **Employees** 字段添加到报表区域。\n+   8. 在 **Filters** 中，点击 **Add** 按钮旁边的箭头\
    \ | **Row Limit**。\n+   9. 将 **Row Limit** 更改为 **5**，**Sorted By Employees - Descending**。\
    \ 请考虑以下截图：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_127_0.png)\n\n+   10. 点击\
    \ **OK** 按钮。 您会注意到 **Dashboard Settings** 按钮出现在顶部行按钮中。\n+   11. 点击 **Dashboard\
    \ Settings** 按钮。\n+   12. 选择 **Account Name** 作为 **Name**，**Employees** 作为 **Value**\
    \ 并点击 **OK** 按钮。 一旦配置了 **Dashboard Settings** 按钮，此报表将能够用作仪表板组件的数据源。 我们将在 *Chapter\
    \ 8, Working with Reports* 中讨论仪表板。\n\n"
