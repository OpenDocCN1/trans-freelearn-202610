    When you expand the dashboard, you will see the report under the chart; you can
    still tap a segment of the chart for more information. Not just that, the report
    below the chart will also be filtered with a group of the charts tapped, as seen
    in the following screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_379_0.png)


