    ## 报表和仪表板的进阶技巧


    对于此示例，使用此报表，我们可以分析 **Record Count** 和 **Total Amount** 按 **Stage** 在一段时间内的变化情况。


    ### 摘要


    本章分享了许多技巧，从使用 **Chatter** 动态 feed 和群组在报表和仪表板中设置协作开始。我们继续介绍了在报表中使用参数的技巧，这是通过向 Web
    浏览器 URL 添加参数来完成的。此参数会覆盖报表中定义的值，并且可以暂时更改报表筛选器值，而无需不断编辑报表。我们继续介绍了 **Field History
    Tracking**，以及如何通过简单地为字段启用历史跟踪来利用它。我们不需要开发人员，并且可以在几分钟内完成。我们以一个动手练习结束本章，使用 **Reporting
    Snapshot** 将每日或每周数据存储在自定义对象中。


    在下一章中，我们将讨论从 Salesforce1 移动应用程序访问报表和仪表板，该应用程序支持 iOS 和 Android 设备。它还支持离线模式，供用户在没有互联网连接时需要读取、编辑和向
    Salesforce 添加数据。


    ## 12. Salesforce1 移动应用程序中的仪表板和报表


    本章将讨论如何使用默认的 Salesforce 移动应用程序 Salesforce1 访问您的报表和仪表板。Salesforce1 是一款可从任何移动和平板设备体验
    Salesforce 的应用程序，并将您的 Chatter、CRM、自定义应用程序和业务流程统一在一个现代化的体验中，供任何 Salesforce 用户使用。借助
    Salesforce1 平台的强大功能，您现在可以自定义和构建任何应用程序，并通过 Salesforce1 应用程序即时部署该功能。最棒的是，对于客户来说，此应用程序可免费使用——您只需输入您的
    Salesforce 用户名和密码即可。


    我们不会详细介绍 Salesforce1 应用程序：安装、权限、配置、通知、操作、审批、事件和导航。但我们将深入讨论诸如使用 Salesforce1 移动应用程序访问仪表板和报表、在没有互联网连接时使用离线模式、以及使用移动
    Web 浏览器访问报表和仪表板等主题。


    Salesforce1 可用于 iOS 和 Android 设备；但是，本书中使用的所有屏幕截图均来自 iPhone 或 iPad。通常，Salesforce
    会在每次发布时更新应用程序版本。本书基于 Salesforce1 应用程序版本 12.3 编写。


    ### Salesforce1 移动应用程序简介


    本章将涵盖以下主题：


    - Salesforce1 应用程序简介

    - 在 Salesforce1 应用程序中使用仪表板

    - 将仪表板快照分享到 **Chatter** feed

    - 在 Salesforce1 应用程序中使用报表

    - 离线访问您的报表和仪表板

    - Salesforce1 移动应用程序的限制


    Salesforce1 移动应用程序是由 Salesforce.com 构建的开箱即用的企业级移动应用程序。它适用于所有 Salesforce 用户，包括
    **Chatter Free** 用户。此应用程序适用于 iOS 和 Android 平台；您可以免费从 iOS 设备的 App Store 和 Android
    设备的 Google Play 下载并安装它。


    该应用程序支持智能手机和平板设备。Salesforce1 也可供用户使用支持的移动 Web 浏览器和支持的设备使用，提供与已安装应用程序相同的用户体验；对于此选项，您无需在移动设备上安装应用程序。


    该应用程序可直接使用，并尊重您的 Salesforce 配置、安全性和自定义设置，并且无需重新配置即可实现。唯一的例外是不经 Salesforce1 认证的
    AppExchange 产品以及未设计或配置用于在 Salesforce1 中使用的任何自定义 Visualforce 页面。此应用程序可让您实时访问与使用
    Web 浏览器在办公室看到的相同的 Salesforce.com 信息。


    在 Salesforce1 应用程序之前，Salesforce 构建了几个不同的移动应用程序，例如 Salesforce Classic、Salesforce
    Touch、Logger & ForcePad 和 **Chatter** Mobile。Salesforce1 应用程序将所有这些统一为一个单一平台，在
    iOS 和 Android 智能手机和平板电脑上提供统一的移动体验。


    除非由您的管理员关闭，否则 Salesforce1 应用程序会自动为所有现有和新客户启用。当您登录 Salesforce1 应用程序时，品牌、导航、通知和离线设置由您的
    Salesforce 配置控制。以下屏幕截图是来自 iOS 设备捕获的 Salesforce1 应用程序示例：


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_370_0.png)


    您可以使用仪表板名称搜索仪表板，并且应该能够找到您有权访问的所有仪表板，就像在 Salesforce Web 页面中一样。


    以下是与 Salesforce1 的仪表板相关的几项内容：


    - 当您在 Salesforce1 应用程序中打开仪表板时，仪表板中的所有组件都将可用。

    - 对于移动设备，仪表板将以一列显示。第一个仪表板将是位于左上角的那个，下一个将位于顶部左侧组件下方（而不是右侧），然后是所有其他组件。

    - 对于平板设备，仪表板将以两列显示；第一个仪表板将是位于左上角的那个，其后是右侧的组件，该组件原本位于第一个仪表板下方。这将继续显示仪表板的所有组件。请考虑以下屏幕截图：


