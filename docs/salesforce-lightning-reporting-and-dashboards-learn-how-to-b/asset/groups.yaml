    # Hands-on exercise for adding a Summary field to Matrix reports


    Let''s consider a use case: showing all opportunities with the total amount in
    a **Matrix** format, row grouping by **Opportunity Stage**, and column grouping
    by **Opportunity Owner**:


    +   1. Navigate to the **Reports** tab and click on the **New Report** button.

    +   2. Select the **Opportunities** Report Type and click on the plus sign under
    the **Opportunities** category.

    +   3. Click on the **Create** button to continue.

    +   4. Change **Show** to **All opportunities**.

    +   5. Change the **Date Field** range to **All Time**.

    +   6. Note that the **Opportunity Status** and **Probability** filters are next
    to **Show**; these specific filters are there only when we use the **Opportunity**
    Report Type. For this exercise, just leave the default value **Any** for **Opportunity
    Status** and **All** for **Probability**.

    +   7. Change the report format from **Tabular** to **Matrix**.'
