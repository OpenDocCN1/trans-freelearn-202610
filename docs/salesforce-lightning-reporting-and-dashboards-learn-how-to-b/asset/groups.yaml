    For this example, with this report, we can analyze how **Record Count** and **Total
    Amount** by **Stage** changed over a period of days.


    ### Summary


    This chapter shared many tips starting with setting up collaboration in reports
    and dashboards using **Chatter** feeds and groups. We continued with tips for
    using parameters in a report, which is done by adding parameters to the web browser
    URL. This parameter overwrites the existing value defined in the report, and with
    this, we can change the report filter value temporarily without the need to keep
    editing the report. We continued by introducing **Field History Tracking**, and
    how to take advantage of it by simply enabling a field for history tracking. We
    do not need developers for this, and it can be done within minutes. We ended the
    chapter by looking at a hands-on exercise to use **Reporting Snapshot** to store
    daily or weekly data in a custom object.


    In the next chapter, we will discuss accessing reports and dashboards from the
    Salesforce1 mobile app, which supports both iOS and Android devices. It also supports
    offline mode for users who need to read, edit, and add data to Salesforce when
    they do not have an internet connection.


    ## 12. Dashboards and Reports in the Salesforce1 Mobile App


    This chapter will discuss how to access your reports and dashboards using the
    default Salesforce mobile app called Salesforce1. Salesforce1 is an app to experience
    Salesforce from any mobile and tablet device, and brings all your Chatter, CRM,
    custom apps, and business processes together in a unified, modern experience for
    any Salesforce user. With the power of the Salesforce1 platform, you can now customize
    and build any app, and instantly deploy that functionality through the Salesforce1
    app. And the best part for customers is that this app is available for free--you
    just need to enter your Salesforce username and password.


    We will not go through the Salesforce1 app in detail: installation, permissions,
    configuration, notification, action, approval, event, and navigation. But we will
    discuss, in depth, topics such as accessing the dashboards and reports with the
    Salesforce1 mobile app, the offline mode when you do not have access to the internet
    from your device, and accessing reports and dashboards using a mobile web browser.


    Salesforce1 is available for both iOS and Android devices; however, all the screenshots
    used in this book have been taken from an iPhone or iPad. Usually, Salesforce
    updates the app version in every release. This book is written based on the Salesforce1
    app version 12.3.


    ### Introduction to the Salesforce1 mobile app


    The following topics will be covered in this chapter:


    - Introduction to the Salesforce1 app

    - Working with dashboards in the Salesforce1 app

    - Sharing dashboard snapshots to **Chatter** feed

    - Working with reports in the Salesforce1 app

    - Accessing your reports and dashboards offline

    - Limitations of the Salesforce1 mobile app


    The Salesforce1 mobile app is an enterprise class out of the box mobile app built
    by Salesforce.com. It is available for all Salesforce users including the **Chatter
    Free** users. This app is available for both iOS and Android platforms; you can
    download and install it for free from the App Store for iOS devices, and from
    Google Play for Android devices.


    This app supports both smartphones and tablet devices. Salesforce1, also available
    for users to use with a supported mobile web browser with supported devices, gives
    the same user experience as the installed app; for this option, you do not need
    to install the app on your mobile device.


    The app will work for you out-of-the-box, and respect your Salesforce configuration,
    security, and customization, and is implemented without any efforts to reconfigure
    it. The only exceptions are AppExchange products that are not certified for Salesforce1
    and any custom Visualforce pages not designed or configured for use in Salesforce1.
    This app gives you real-time access to the same Salesforce.com information as
    you see in the office using a web browser.


    Prior to the Salesforce1 app, Salesforce built a few different mobile apps, such
    as Salesforce Classic, Salesforce Touch, Logger & ForcePad, and **Chatter** Mobile.
    The Salesforce1 app combines all of these into one single platform as a unified
    mobile experience across iOS and Android smartphones and tablets.


    The Salesforce1 app is automatically enabled for all existing and new customers
    unless it is turned off by your admin. When you log into the Salesforce1 app,
    the branding, navigation, notifications, and the offline setting are controlled
    in your Salesforce configuration. The following screenshot is a sample of Salesforce1
    app captured from an iOS device:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_370_0.png)


    You can search the dashboard with the dashboard name, and you should be able to
    find all the dashboards you have access to as in the Salesforce web page.


    Here are a few items related to the dashboard for Salesforce1:


    - All the components in the dashboard will be available when you open the dashboard
    in the Salesforce1 app too.

    - For a mobile device, the dashboard will be displayed as a column. The first
    dashboard would be the one located at the top left, the next one will be located
    below (not to the right) of the top-left component, and then followed by all the
    other components.

    - For a tablet device, the dashboard will be displayed in two columns; the first
    dashboard would be the one located at the top left, followed by the right component,
    which was originally located below the first dashboard. This will continue to
    show all the components for the dashboard. Consider the following screenshot:

