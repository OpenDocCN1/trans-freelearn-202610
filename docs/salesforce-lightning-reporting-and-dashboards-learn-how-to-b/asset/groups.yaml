    \ | - |\n| Subtotal |  | 3 | $265,000.00 | 55.44% |\n| July 2016 | Alvin Lee |\
    \ 1 | $38,000.00 | - |\n|  | Johan Yu | 2 | $175,000.00 | - |\n| Subtotal |  |\
    \ 3 | $213,000.00 | 44.56% |\n| GRAND TOTAL |  | 6 | $478,000.00 | - |\n\nThe\
    \ subtotal for **June 2016** is **55.44%**; this is calculated by *265,000 / 478,000*100*.\
    \ The same is for **July 2016** which is **44.56%**, which is calculated by *213,000\
    \ / 478,000*100*. The formula behind this is pretty simple and not much different\
    \ from the one we used earlier: *AMOUNT:SUM / PARENTGROUPVAL(AMOUNT:SUM, GRAND_SUMMARY)*;\
    \ in short, this formula will divide the monthly subtotal by the **GRAND TOTAL**.\n\
    \n# Using the PARENTGROUPVAL() function in the Matrix report\n\nIn the **Matrix**\
    \ report, the syntax for this function is *PARENTGROUPVAL(summary_field, parent_row_grouping,\
    \ parent_column_grouping)*.\n\nThe same is true with the **Summary** report; the\
    \ `PARENTGROUPVAL()` function is not applicable when you select the formula displayed\
    \ as **All summary levels**. This function is applicable only when you select\
    \ **At a specific row/column grouping level...**.\n\nThe grouping level parameter\
    \ in the **Summary** report is split into two parameters in the **Matrix** report:\
    \ **parent_row_grouping and parent_column_grouping**.\n\nLet's create a new Opportunity\
    \ report with the **Matrix** format, filter the report by **Close Date** of 3\
    \ months, and then group by **Calendar Month (column)** and **Stage (row)**. Refer\
    \ the following screenshot:\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_190_0.png)\n\
    \nLet's consider a use case: we would like to know the percentage of each Stage\
    \ compared to the GRAND TOTAL:\n\n- 1. Create a formula summary called Total Amount\
