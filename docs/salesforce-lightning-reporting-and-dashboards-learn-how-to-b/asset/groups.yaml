    # Working with reports in the Salesforce1 app


    There are a few options to access reports in the Salesforce1 mobile app. Let us
    discuss them in detail.


    # Report menu items


    If you do not see the Reports menu in the Salesforce 1 app menu, make sure to
    add it-- navigate to Setup | Apps | Mobile Apps | Salesforce1 Navigation, select
    Reports, and add the selected items. This is shown in the following screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_380_0.png)'
  - '[PAGE 381]


    # Dashboards and Reports in the Salesforce1 Mobile App


    When you open a report in the Salesforce1 mobile app, the report format will be
    ignored. **Summary** and **Matrix** format reports will be presented just as columns,
    similar to **Tabular** reports. If the report has a chart added, it will not be
    visible when the report opens in Salesforce1.


    In the **Tabular** format report, the first column will be frozen, so, when you
    scroll to the right to see more columns, the first column will stay visible. For
    **Summary** and **Matrix** reports, the first column (not the group fields) will
    be frozen, while fields used as a group will be the last columns.


    You can sort the report by tapping on the column header; by default, it will be
    sorted in the ascending order--you can tap the header again to change it to sort
    in the descending order.


    # Drilling down from dashboards


    As you know, a report is the data source for the dashboard. When you select and
    expand the dashboard component in the Salesforce1 mobile app, you can drill down
    into the report used as the data source. When the report opens, it shows the chart
    above the report. If the original report has a chart added, the original chart
    will not show in the Salesforce1 mobile app.


    You can filter data in the report based on dashboard grouping by tapping on the
    group in a chart of the report, except for the **Table** and **Matrix** components.
    When you tap on an item of the chart, it will prompt you to show more information
    on that segment, and the report generated will be automatically refreshed and
    filtered with the segment selected. This is shown in the following screenshot:'
  - '[PAGE 382]


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_382_0.png)


    In the preceding image, the two screenshots have been taken from the same report.
    In the left one, Stage as Qualification is selected, and the report following
    it has been auto-filtered with Owner as Johan Yu and Stage as Qualification. In
    the one on the right, the bar for Stage as Value Proposition is selected, and
    the report has been auto-filtered with Stage as Value Proposition.'
  - '[PAGE 383]


    # Drilling down to records


    When the report column is the name of an object, you can tap on it to open the
    record detail, such as **Account Name, Opportunity Name, Opportunity Owner**,
    and so on. From the record detail page, tapping on the arrow at the top-left will
    bring you back to the report.


    # Accessing offline


    The Salesforce1 app supports offline access. You can read, create, and edit existing
    records that you recently accessed. When you get an internet connection again,
    the data added or modified will auto-sync back to Salesforce. Records pending
    sync will be marked with a green triangle and white arrow. However, offline access
    is not possible for Salesforce mobile web browsers.


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_383_0.png)


    To enable offline support for the Salesforce1 app, navigate to **Setup | Apps
    | Mobile Apps | Salesforce1 Offline**, tick **Enable Caching in Salesforce1**,
    and tick **Enable offline create, edit, and delete in Salesforce1**. This is only
    for the Salesforce1 app installed on your devices, not for the Salesforce1 mobile
    browser app.


    When the offline setting is enabled, you will also be able to access the reports
    and dashboards recently opened in the offline mode, including a drill down to
    the record detail.


    # Limitations of the Salesforce1 app


    There are a few limitations in accessing the dashboards and reports from the mobile
    app, but since this app is useful for on the go access, you may not need the full
    features of dashboards and reports on a small screen device.


    Here is a summary of some of the limitations of this app:


    +   - Inability to create and edit dashboards and reports

    +   - Inability to modify dashboard components

    +   - The report format is ignored

    +   - Charts added in reports are not made available

    +   - **Chatter** feeds are not available'
