    ## The FOLDERS menu


    As with the arrangement of DASHBOARDS, you will find a few menus under FOLDERS:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_257_0.png)


    There are three menus under **FOLDERS**:


    - 1. **Created by Me**: This will list all the dashboard folders you create.

    - 2. **Shared with Me**: This will list all the dashboard folders created by someone
    else but shared with you.

    - 3. **All Folders**: This will list all the dashboard folders you have access
    to, either created by yourself or someone else.


    When you select any menu here, the right-hand side panel will list all the report
    folders based on the menu selected on the left-hand side. There will be four columns
    and one action column. The columns will be **FOLDER NAME**, **CREATED BY**, **LAST
    MODIFIED BY**, **CREATED ON**, and the arrow icon for the dropdown of actions.


    Clicking on the arrow in the last column in the folder row will show the **Delete**
    menu if the user has permission to delete the folder. For users with permission
    to delete the dashboard folder, the user will be able to delete the dashboard
    folder from here, but only for folders without any dashboards in that folder;
    otherwise, the user will get an error message.


    You also can sort the list by any column by hovering your mouse over the header
    and clicking on the column header. Click once to sort by ascending order, and
    click again to sort by descending order.


    ## The favorites icon


    By now, you should be familiar with the favorites icon; just for a quick recap,
    you can add any records, including reports and dashboards as your personal favorites.
    Simply click on the star icon when the report or dashboard opens; you can do this
    for **Account**, **Opportunities**, or any other records.


    Once added, you can access records, reports and dashboards easily from anywhere
    within the Lightning environment because it is located in the top area and is
    always visible. Consider the following screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_259_0.png)


    ## The search textbox


    Similar to reports or any other records, you can search the dashboard from the
    global search textbox; just enter the whole dashboard name or partial name if
    you do not remember the complete dashboard name.


    Make sure that you are not in the SETUP menu when searching for the dashboard;
    otherwise it will not search any records but will just search for metadata in
    the SETUP menu, such as user, profile, objects, and so on. Refer to the following
    screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_260_0.png)


    ## Navigating to a dashboard


    Interactive dashboard components give viewers more information and links to data-supplying
    reports. Let''s look at all the items in a dashboard:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_261_0.png)


    - 1. **Refresh, Edit, Clone, New Dashboard, or Delete:** The buttons and drop-down
    menu at the top of each dashboard provide one-click access to administrative tasks.

    - 2. **View Report** underlying a component: Would you like to get the data behind
    a metric or a chart? Click on **View Report** to drill into the data.

    - 3. **Hover over charts to get more information:** Hovering over a chart segment
    reveals more information about the chart.

    - 4. **Expand dashboard components to get the big picture:** Click on the expand
    icon to see a larger version of the component and continue with the **View Report**
    button to drill into the data.


    ## Dragging and dropping in the Dashboard Builder


    The **Dashboard Builder** is a drag and drop interface to create and modify dashboards.
    You can use it to customize the whole dashboard, a column in the dashboard, or
    a component in the dashboard.


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_262_0.png)


    Let''s go through all the items in the Dashboard Builder from the preceding screenshot:


    - 1. **Editing the dashboard title (denoted by 1):** You can easily change the
    dashboard title from the pencil icon.

    - 2. **Editing the components (2):** Clicking on this pencil icon changes the
    component type, sort, max values displayed, title, subtitle, and footer.

    - 3. **The Delete component (3):** Click on this cross icon to delete the component.

    - 4. **The add + Component button (4):** Click on this to add a new component
    to the dashboard.

    - 5. **The add + Filter button (5):** Click on this to add a filter for the whole
    dashboard.

    - 6. **The undo button (6):** Click on this to undo items that have changed but
    haven''t been saved.

    - 7. **The redo button (7):** Click on this to redo items.

    - 8. **The edit properties button (8):** Click on this to edit the dashboard properties:
    title, description, folder, View Dashboard as, and enable Dynamic Dashboard.

    - 9. **The Save, Save As, and Delete buttons (9):** The **Save** button saves
    and overwrites an existing dashboard, the **Save As** button saves the dashboard
    as a new dashboard, and the **Delete** button deletes the dashboard.


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_263_0.png)


    A deleted dashboard can be recovered from the Recycle Bin within 15 days, but
    as of the Summer ''17 release, the Recycle Bin does not exist in Lightning Experience
    yet, so you need to switch to Classic to undelete.


    - 10. **The Done button (10):** Click on this to close the dashboard editor: If
    you haven''t saved the changes made, the system will prompt you to save or discard
    the changes.

    - 11. **Resize and move (11):** Drag a component corner to resize the component
    or hold the component to move it.


    ## Refreshing dashboards


    Dashboards are not the same as reports. When you open a report, the report data
    will be generated based on current data. On the other hand, for dashboards, when
    you open a dashboard, it will show the data as of the latest dashboard refreshed
    by any users or by a schedule.


    All users able to view the dashboard will be able to refresh the dashboard by
    simply clicking on the **Refresh** button after opening the dashboard. Even users
    who do not have permission to edit the dashboard are able to refresh the dashboard.
    Once refreshed, the other user that sees the dashboard will be based on latest
    refreshed data.


    Notice that in the following screenshot, information under the dashboard title
    will show us the data used for the dashboard, which is the same with the latest
    dashboard refresh:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_264_0.png)


    But if the dashboard hasn''t been refreshed in 24 hours, it lets you know with
    a helpful warning message with an exclamation icon, as shown in the following
    screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_265_0.png)


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_265_1.png)


    If you switch from Classic to Lightning and have the Visualforce Component developed
    by your vendor or consultant, the Visualforce Component is no longer supported
    in Lightning. This will cause you to not be able to refresh the dashboard. To
    resolve this, remove the Visualforce Component and you should be able to refresh
    the dashboard in Lightning Experience.


    ## Scheduling a dashboard refresh


    This is a very useful feature to get the system to auto refresh a dashboard on
    a schedule. You can also configure the system to email the dashboard to you and
    your team. Unfortunately, this feature is not available in Lightning until the
    Summer ''17 release, so you need to switch to Classic to configure this.

