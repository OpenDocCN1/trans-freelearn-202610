    \ for the user.\n\n#### Manage dynamic dashboards permission\n\nThe **Manage Dynamic\
    \ Dashboards** permission allows users to create and edit dynamic dashboards.\
    \ We will look into Dynamic Dashboards in more detail in *Chapter 10, Learning\
    \ Advanced Dashboard Configuration*. But for now, you just need to understand\
    \ that a dynamic dashboard allows the logged-in user to select other users as\
    \ viewing user, based on the user permissions and role hierarchy.\n\nWhen creating\
    \ or editing a dashboard, a user with this permission will have options to set\
    \ the dashboard running user as the logged-in user, or to allow a user who opens\
    \ the dashboard to change the viewing user. The following screenshot shows enabling\
    \ a dynamic dashboard:\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_65_0.png)\n\
    \n#### The View My Team's Dashboards permission\n\nThe **View My Team's Dashboards**\
    \ permission allows users to view dashboards owned by people under them in the\
    \ role hierarchy.\n\nWhen creating or editing a dashboard, the user with the **Manage\
    \ Dynamic Dashboards** permission and **View My Team's Dashboards** permission\
    \ has an option to set **Dashboard Running User**, and to enable **Let authorized\
    \ users change running user**.\n\nWhen opening a dynamic dashboard, the user without\
    \ the **View My Team's Dashboards** permission will not be able to change the\
    \ dashboard viewing user. However, a user with this permission will be able to\
    \ change and enter a user in his/her team in the role hierarchy as viewing user.\
    \ A user with the **View All Data** permission will be able to enter any other\
    \ user as a viewing user. The following screenshot shows how to change the dashboard\
    \ viewer:\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_66_0.png)\n\n#### Schedule\
    \ dashboards\n\nWe will discuss dashboards in *Chapter 9, Building Dashboards\
    \ in Lightning Experience*, but for now, you should know that when you open a\
    \ dashboard, it does not present the latest data, but the data of the dashboard\
    \ last refreshed by you, or refreshed by your colleague, or data scheduled for\
    \ auto-refresh.\n\nSalesforce offers the ability to refresh a dashboard up to\
    \ a limit for a user with the **Schedule Dashboard** permission. I will share\
    \ more on this in *Chapter 9, Building Dashboards in Lightning Experience*, but\
    \ for now, just note that we can schedule dashboard refresh, and e-mail the dashboard\
    \ to ourselves or to other users.\n\nAs of the Summer ’17 release, this feature\
    \ is only available in Classic, and not yet in Lightning Experience.\n"
  mdcn: "\n\n## 报告和仪表板中的概念和权限\n\n### 运行报表\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_60_0.png)\n\
    \n当某个配置文件中的所有用户都需要运行报表时，管理员只需在配置文件下的“常规用户权限”部分启用此权限即可。要将此权限分配给不同配置文件中的用户，请使用权限集。记住，权限集仅按每个用户的基础添加权限，而不会移除权限，并且与用户配置文件无关。\n\
    \n此权限还控制用户访问仪表板的权限。我们将在第 9 章《Lightning Experience 中的构建仪表板》中详细介绍仪表板。如果您无法运行报表，请联系您的管理员以启用此权限。\n\
    \n快速检查：如果您已启用此权限，请单击报表选项卡，然后单击“所有报表”菜单。您应该在几秒钟内看到生成的报表，但如果您看到与上一张截图中类似的错误消息，则表示您没有权限运行报表。如果您完全看不到报表选项卡，请查看第\
    \ 1 章《Salesforce 报表和仪表板基础》中的“导航到报表和仪表板”部分。\n\n### 创建和自定义报表\n\n“创建和自定义报表”权限控制用户创建新报表或修改现有报表的能力。如果没有此权限，用户在报表选项卡下将看不到“新建报表”按钮。此权限需要“运行报表”权限，因此如果用户的“运行报表”权限被禁用，则“创建和自定义报表”权限也会自动为该用户禁用。同样，当您启用“创建和自定义报表”权限时，“运行报表”权限也会自动启用。\n\
    \n当您启用此权限时，您应该会看到**新建报表**按钮；否则，您将无法创建和自定义报表。如果您需要创建或自定义报表，请与您的管理员联系以启用此权限。以下截图显示用户有权创建报表：\n\
    \n![](img/72d01bea5a9ccf02f9452aab7505d9de_61_0.png)\n\n### 导出报表\n\n**导出报表**权限管理用户将报表导出为\
    \ Excel 或 CSV 文件格式的能力。与**创建和自定义报表**权限类似，此权限也依赖于**运行报表**权限。禁用**运行报表**权限将自动禁用此权限。但此权限不依赖于**创建和自定义报表**权限，这意味着用户可能能够导出报表，即使她或他无法创建或自定义报表。\n\
    \n当您打开报表并且已启用此权限时，您将在**编辑**按钮旁边的箭头下拉菜单下看到**导出**链接。请考虑以下截图：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_62_0.png)\n\
    \n> \U0001F4A1 **提示**  \n> 在 Classic 中，有一个选项可以将报表导出为可打印视图。导出的 Excel 文件将保留格式，并且随报表生成的汇总信息将在\
    \ Salesforce 中生成。\n\n### 订阅报表\n\n**订阅报表**权限使用户能够订阅报表以将其发送到其电子邮件地址，而无需打开报表。当您在\
    \ Lightning Experience 中订阅报表时，您将按您设置的计划——**每日、每周或每月**——通过电子邮件接收更新的报表结果。\n\n拥有此权限的用户在报表打开后会看到**订阅**按钮，如以下截图所示。我们将在第\
    \ 8 章 *使用报表* 中详细介绍订阅报表：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_63_0.png)\n\
    \n与此权限相关的有两个权限，分别是：\n\n- **通过添加收件人订阅报表**：此权限将允许您添加其他用户以接收电子邮件发送。默认情况下，您包含在内，但在添加其他人时您可以将自己移除。\n\
    - **通过设置运行用户订阅报表**：此权限将允许您将运行用户指定为其他人，只要该用户有权访问报表即可。\n\n### 仪表板权限\n\n在上一节查看了报表权限后，让我们现在来看一下\
