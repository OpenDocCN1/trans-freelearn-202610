    +   - Grouping 1: Stage


    I = Required Information


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_355_0.png)


    The maximum number of records that will be stored is 2000 per snapshot run.


    +   2. To create a target object, create a custom object as the target object
    to store the data returned from the report. Make sure the target object is not
    included in the workflow.


    +   3. Create fields in the target object: By default, a Reporting Snapshot will
    give us information about three things, which we can capture in the target object
    fields: Reporting Snapshot Name, Reporting Snapshot Running User, and Execution
    Time. It is a good practice to create similar field names, or the represented
    data will be created from the Source Report. You need to create additional custom
    fields to capture the data being collected in the Source Report.'
