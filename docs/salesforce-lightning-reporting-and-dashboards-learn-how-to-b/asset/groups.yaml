    \ you to prepare reports that show, for example, the month-to-month opportunity\
    \ comparison; the main difference with the PARENTGROUPVAL() function is the return\
    \ value from the higher hierarchy level.\n\nThe formula syntax for the PARENTGROUPVAL()\
    \ function is the same for all report formats:\n\n*PREVGROUPVAL(summary_field,\
    \ grouping_level [, increment]).*\n\nThere is not much difference in the navigation\
    \ and tips to get the formula parameters for the PARENTGROUPVAL() function compared\
    \ to the PARENTGROUPVAL() function. The only difference in the syntax is an additional\
    \ optional parameter **incremental**. If we skip this parameter, it will use the\
