    \ and Install!!** 按钮。\n\n8. 系统可能会提示你输入 Salesforce 用户名和密码。\n\n9. 现在你可以选择安装应用的范围：**Admin\
    \ Only**、**All Users** 或 **Specific Profiles...**。在本练习中，我将选择 **Admin Only**，然后点击\
