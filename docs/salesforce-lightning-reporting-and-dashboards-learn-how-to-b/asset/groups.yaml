    Because Jack is Michael''s subordinate under the role hierarchy, Jack''s pipeline
    will show in Michael''s report.


    Ideally, each user in Salesforce has a role defined by the admin. The role determines
    data visibility of a user in Salesforce. A role may have multiple direct roles
    below that role, but only one direct role above. This relationship forms the role
    hierarchy, which pretty much resembles the company''s organization chart. A record
    owned by a user will be visible to users with role hierarchy above the record
    owner.


    When Jack opens the same report, since he doesn''t have any subordinate, he sees
    only his own pipeline, as shown in the following screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_72_0.png)


    The same type of report can be used for the whole organization. The report will
    respect the role hierarchy defined for all users, from CEO down to the sales representative
    role. To create this kind of report, technically you just need to filter with
    criteria to show My team''s opportunities, as shown in the following screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_72_1.png)


    If the report has to serve all the users in the company, make sure it is stored
    in a folder accessible by all users, such as report of global sales.


    To share a folder with all users within the company, you can share it with a group
    called All Internal Users. This group is auto-generated by the system, and has
    all active users added as members.

