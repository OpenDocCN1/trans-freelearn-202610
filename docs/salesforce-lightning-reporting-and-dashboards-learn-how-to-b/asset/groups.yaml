    In this case, it is not necessary to create a summary formula unless you need
    to hide the amount of each Opportunity and just get the total. The sample in this
    hands-on does not show the real power of the report formula summary; except for
    the normal Summarize field, we cannot configure it, and it will always show at
    all levels. Let''s look at a better usage of summary formula in the next hands-on
    exercise.


    ## Hands-on exercise for working with a summary formula


    Let''s consider a use case: in a **Summary** report, add **Total Amount of Closed
    Opportunities** in all summary levels. Assuming that roll-up summary fields in
    Account from Opportunity called **Total Amount of Opportunities** and **Total
    Amount of Open Opportunities** have been created and the detail for **Total Amount
    of Open Opportunities** field has been discussed in the previous hands-on, here
    is the roll-up summary field detail for **Total Amount of Opportunities**:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_178_0.png)


    - 1. Create a new custom summary formula field similar to the one we created in
    the hands-on exercise earlier and name it `Total_Closed_Opportunities`, with this
    formula: `Account.Total_Amount_of_Opportunities__c:SUM - Account.Total_Amount_of_Open_Opportunities__c:SUM`


    2. For the sake of clarifying for this exercise, let''s add both Total Amounts
    of Opportunities and Total Amount of Open Opportunities roll-up summary fields
    to the report and then summarize them with Sum. Consider the following screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_179_0.png)


    3. In the preceding report, Total Amount of Closed Opportunity (summary formula)
    is equal to Total Amount of Opportunity (roll-up summary field) minus Total Amount
    of Open Opportunity (roll-up summary field). We use the Subtract operator between
    summary formulas, and we can also use this technique for the other formulas:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_179_1.png)


    ## Advanced Report Configuration


    If you notice the area on the right of **Formula** in the **Custom Summary Formula**
    editor, there are many functions that you can use to enhance your formula; they
    are categorized as **All, Logical, Math,** and **Summary**. We will not discuss
    each function available, but let''s look at a sample in the next section.


    ## Using the IF() function


    The IF() function is categorized under the Logical function and the syntax for
    this formula is **IF(logical_test, value_if_true, value_if_false)**.


    This function checks whether a condition returns true. If it does, it will return
    the first value defined; otherwise, it will return the second value, for example,
    `IF(RowCount > 4, WON:SUM, CLOSED:SUM)`.


    This formula will return a total number of WON opportunities if the number of
    records is more than four rows; otherwise, it will return the total number of
    CLOSED opportunities. WON and CLOSED are available from the Opportunity report
    type.


    You don''t really have to type `WON:SUM` and `CLOSED:SUM` or other fields you
    would like to use, but from the **Custom Summary Formula** window, navigate to
    **Summary Fields | <field name> | Sum**.


    Once you click on **Sum**, it will automatically populate in the formula; just
    make sure that you place the cursor in the formula editor.

