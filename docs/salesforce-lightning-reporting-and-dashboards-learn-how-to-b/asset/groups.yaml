  md: "\n## 10 Learning Advanced Dashboard Configuration\n\nIn Chapter 9, Building\
    \ Dashboards in Lightning Experience, we introduced dashboards, starting with\
    \ opening a dashboard, navigating to the Dashboards tab, navigating to a dashboard,\
    \ and looking at the items in the Dashboard Builder. You learned the basic structure\
    \ of a dashboard and saw how it is related to the report, and how a dashboard\
    \ is defined and stored on the Salesforce platform. We continued with the dashboard\
    \ components, which are the heart and soul of dashboards in Salesforce. Finally,\
    \ we created a dashboard from scratch and then enhanced it with dashboard filters\
    \ and scheduled the dashboard for auto-refresh.\n\nIn this chapter, you will continue\
    \ to learn and create an advanced dashboard using out-of-the-box functions offered\
    \ by Salesforce. We will start with the dashboard filter and cover how to implement\
    \ it and other use cases for the dashboard filter. We will continue with the concept\
    \ of dynamic dashboards, and we will look into the dashboard drill down with filters\
    \ preserved from the dashboard to report. We will end with looking for a prebuilt\
    \ dashboard available in AppExchange and cover a hands-on exercise to install\
    \ it.\n\nThe following topics will be covered in this chapter:\n\n- Implementing\
    \ the dashboard filters\n- Using dynamic dashboards\n- Dashboards and reports\
    \ drill down\n- Getting more from AppExchange\n\n### Implementing the dashboard\
    \ filters\n\nHave you ever had the need to analyze a dashboard based on different\
    \ criteria? For example, we would like to look at the pipeline dashboard for the\
    \ current year, current quarter, and current month.\n\nFor this example, it is\
    \ not an issue to create three dashboards, but since the data source of the dashboard\
    \ is driven by reports, this means that we would need to create three sets of\
    \ reports for each dashboard, and if you have 10 components for the dashboard,\
    \ you will need 30 reports to support this.\n\nTherefore, instead of creating\
    \ multiple dashboards, it would be better to consolidate and easier for the user\
    \ to just have one dashboard only since all the components for the dashboard are\
    \ the same. Also, consider the maintenance effort for 30 reports and three dashboards\
    \ and compare this to one dashboard with 10 reports used as the data source.\n\
    \nThe dashboard filter comes into the picture for this scenario; with just one\
    \ dashboard, you can change the filter to include different records in the dashboard\
    \ based on the selected filters.\n\n### Getting to know the dashboard filters\n\
    \nThe dashboard filter is a great feature to filter the data in the dashboard\
    \ component. All components will be filtered according to the filters selected.\
    \ With the dashboard filter, you can use the same dashboard with different combinations\
    \ of data.\n\nAdding filters to a dashboard gives users the ability to have many\
    \ results using a dashboard, so one dashboard serves the purpose of multiple dashboards.\
    \ Without filters, you’d have to create multiple dashboards, with each dashboard\
    \ having the same components with different filters. For example, add a filter\
    \ in the industry field to track an account by industry. As admin, it is easier\
    \ to maintain fewer dashboards.\n\nIf you have selected filters on a dashboard,\
    \ the last filters selected by you will be applied by default when you reopen\
    \ the dashboard. Salesforce will remember this for each user filter it applied\
    \ for each dashboard.\n\nTo create a dashboard filter, you define a label for\
    \ the filter, select the field that contains the type of information you want\
    \ to filter, and then define how the filter returns the data. Each filter ideally\
    \ contains more than one value, including the operator. Each filter can have up\
    \ to 10 values maximum, and each dashboard can have up to three filters.\n\n###\
    \ Hands-on exercise for adding a filter to a dashboard\n\nLet's use the **Account\
    \ Dashboard** created in Chapter 9, *Building Dashboards in Lightning Experience*\
    \ for this exercise; we will add a filter based on **Industry** (a field in **Account**)\
    \ with the option equal to:\n\n- **Apparel** or **Education**\n- **Energy**\n\
    - Not blank\n\nThis allows users to analyze the numbers of accounts related to\
    \ the **Account Industry**:\n\n1. Open and edit the **Account Dashboard** dashboard.\
    \ If you come from the **Dashboards** tab, you can click on the **Edit** link\
    \ directly; it is located under the arrow action menu, as shown in the following\
    \ screenshot:\n   ![](img/72d01bea5a9ccf02f9452aab7505d9de_293_0.png)\n\n2. At\
    \ this moment, we have two components in this dashboard; let's add another component,\
    \ say, `Account by Type`:\n   ![](img/72d01bea5a9ccf02f9452aab7505d9de_294_0.png)\n\
    \n3. Create a new report `Account by Type`:\n    - Click on the **Reports** tab\n\
    \    - Click on the **New Report** button\n    - Select the **Accounts** record\
    \ type and then click on the **Create** button\n    - Change the filter to **Show\
    \ as All accounts** and **Date Field Range** as **All time**\n    - Change the\
    \ report format to **Summary**\n    - Drag **Type** into the grouping area\n \
    \   - Save the report with the name as `Account by Type` and Report Folder to\
    \ **Unfiled Public Reports**\n\n4. Go back to the dashboard from the Dashboard\
    \ Builder and click on the + **Component** button.\n\n5. Select the report just\
    \ created, **Account by Type**.\n\n6. Click on the **Add** button. This is shown\
    \ in the following screenshot:\n   ![](img/72d01bea5a9ccf02f9452aab7505d9de_295_0.png)\n\
    \n7. Move the new component added to the right of the second component.\n\n8.\
    \ Click on the + Filter button to add a filter.\n\n9. Select the field you would\
    \ like used as a filter; in this exercise, select Industry.\n\n10. In Display\
    \ Name, type Account Industry.\n\n11. Click on the Add Filter Value button.\n\n\
    12. In the filter options, select **equals** in **Operator**. For **Value(s)**,\
    \ select **Apparel** and **Education** and in **Display Text**, enter `Apparel\
    \ or Education`. Consider the following screenshot:\n    ![](img/72d01bea5a9ccf02f9452aab7505d9de_296_0.png)\n\
    \n13. Click on the **Apply** button for the first value and click on the **Add\
    \ Filter Value** button again to add the second filter value.\n\n14. In the filter\
    \ options, select **equals** in **Operator**. For **Value(s)**, select **Energy**,\
    \ in **Display Text**, enter `Energy`.\n\n15. Click on the **Apply** button for\
    \ the second value, and click on the **Add Filter Value** button again to add\
    \ the third filter value.\n\n16. In the filter options, select **not equal to**.\
    \ For **Value(s)**, leave it blank; in **Display Text**, enter blank.\n\n17. Click\
    \ on the **Apply** button for the third value and then click on the **Add** button.\
    \ This is what it would look like:\n    ![](img/72d01bea5a9ccf02f9452aab7505d9de_297_0.png)\n\
    \n18. Back to the Dashboard Builder, click on the Save button and then click on\
    \ Done to exit the Dashboard Builder.\n\n19. Now we have a filter called Account\
    \ Industry in the dashboard with three values defined. Consider the following\
    \ screenshot:\n    ![](img/72d01bea5a9ccf02f9452aab7505d9de_298_0.png)\n\n21.\
    \ To remove or edit the filter, go to the Dashboard Builder by clicking on the\
    \ **Edit** button in the dashboard; next, look for the pencil icon (**Edit Filter**),\
    \ as shown in the following screenshot:\n    ![](img/72d01bea5a9ccf02f9452aab7505d9de_300_0.png)\n\
    \nFrom here, you can add a filter by clicking on the **Add Filter Value** button\
    \ or delete the value by clicking on the cross icon. To edit the existing values,\
    \ click on the filter value name; for this example, let's click on **Energy**\
    \ and then select **Electronics** and change the Display Text to `Electronics\
    \ or Energy`. Click on the **Apply** button and then click on the **Update** button.\
    \ Click on the **Save** button and then click on **Done** to exit the Dashboard\
    \ Builder. Consider the following screenshot:\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_301_0.png)\n\
    \nYou can have up to three filters in a dashboard. To add more filters, click\
    \ on the Add Filter button in the dashboard edit mode.\n\n### Viewing a dashboard\n\
    \nIn terms of runtime, as we discussed in Chapter 9, Building Dashboards in Lightning\
    \ Experience, when you open a dashboard, it will show the data based on the latest\
    \ refresh (manual or scheduled); while for a report, when you open a report, it\
    \ always shows the current data.\n"
  mdcn: "\n## 10 学习高级仪表板配置\n\n在第9章“在Lightning Experience中构建仪表板”中，我们介绍了仪表板，从打开仪表板、导航到仪表板选项卡、导航到仪表板以及查看仪表板构建器中的项目开始。你学习了仪表板的基本结构，了解了它与报表的关系，以及仪表板如何在Salesforce平台上定义和存储。我们继续介绍了仪表板组件，它们是Salesforce仪表板的核心和灵魂。最后，我们从零开始创建了一个仪表板，然后通过仪表板过滤器对其进行了增强，并安排了仪表板的自动刷新。\n\
    \n在本章中，你将继续学习并使用Salesforce提供的开箱即用功能创建高级仪表板。我们将从仪表板过滤器开始，介绍如何实现它以及仪表板过滤器的其他用例。我们将继续探讨动态仪表板的概念，并研究从仪表板到报表保留过滤器的仪表板向下钻取。最后，我们将在AppExchange中查找可用的预构建仪表板，并进行动手练习来安装它。\n\
    \n本章将涵盖以下主题：\n\n- 实现仪表板过滤器\n- 使用动态仪表板\n- 仪表板和报表的下钻\n- 从AppExchange获取更多\n\n###\
    \ 实现仪表板过滤器\n\n你是否曾经需要根据不同的条件来分析仪表板？例如，我们想查看当前年度、当前季度和当前月份的机会管道（pipeline）仪表板。\n\
    \n对于这个例子，创建三个仪表板没有问题，但由于仪表板的数据源是由报表驱动的，这意味着我们需要为每个仪表板创建三组报表，如果你的仪表板有10个组件，你将需要30个报表来支持。\n\
    \n因此，与其创建多个仪表板，不如合并起来，对用户来说只使用一个仪表板更容易，因为仪表板的所有组件都是相同的。另外，考虑一下维护30个报表和三个仪表板的工作量，并将其与一个使用10个报表作为数据源的仪表板进行比较。\n\
    \n在这种情况下，仪表板过滤器就派上用场了；只需一个仪表板，你就可以根据选定的过滤器更改过滤器以在仪表板中包含不同的记录。\n\n### 了解仪表板过滤器\n\
    \n仪表板过滤器是一个很好的功能，可以过滤仪表板组件中的数据。所有组件都将根据选定的过滤器进行过滤。使用仪表板过滤器，你可以在同一个仪表板上使用不同的数据组合。\n\
    \n向仪表板添加过滤器可以让用户通过一个仪表板获得多种结果，因此一个仪表板可以起到多个仪表板的作用。如果没有过滤器，你将不得不创建多个仪表板，每个仪表板具有相同的组件但使用不同的过滤器。例如，在行业字段中添加一个过滤器，按行业跟踪客户。作为管理员，维护更少的仪表板更容易。\n\
    \n如果你在仪表板上选择了过滤器，重新打开仪表板时，默认会应用你上次选择的过滤器。Salesforce会记住每个用户对每个仪表板应用的过滤器。\n\n要创建仪表板过滤器，你需要为过滤器定义一个标签，选择包含要过滤的信息类型的字段，然后定义过滤器如何返回数据。理想情况下，每个过滤器包含多个值，包括运算符。每个过滤器最多可以有10个值，每个仪表板最多可以有3个过滤器。\n\
    \n### 向仪表板添加过滤器的动手练习\n\n让我们使用在第9章*在Lightning Experience中构建仪表板*中创建的**Account Dashboard**（账户仪表板）进行此练习；我们将添加一个基于**Industry**（行业）（**Account**（账户）中的一个字段）的过滤器，其选项等于：\n\
    \n- **服装**或**教育**\n- **能源**\n- 非空白\n\n这允许用户分析与**账户行业**相关的账户数量：\n\n1. 打开并编辑**Account\
    \ Dashboard**仪表板。如果你来自**Dashboards**（仪表板）选项卡，可以直接点击**Edit**（编辑）链接；它位于箭头操作菜单下，如下图所示：\n\
    \   ![](img/72d01bea5a9ccf02f9452aab7505d9de_293_0.png)\n\n2. 此时，此仪表板中有两个组件；让我们添加另一个组件，例如`Account\
    \ by Type`（按类型划分的账户）：\n   ![](img/72d01bea5a9ccf02f9452aab7505d9de_294_0.png)\n\
    \n3. 创建一个新报表`Account by Type`：\n    - 点击**Reports**（报表）选项卡\n    - 点击**New Report**（新建报表）按钮\n\
    \    - 选择**Accounts**（账户）记录类型，然后点击**Create**（创建）按钮\n    - 将筛选器更改为**Show as All\
    \ accounts**（显示为所有账户），并将**Date Field Range**（日期字段范围）设置为**All time**（所有时间）\n  \
    \  - 将报表格式更改为**Summary**（摘要）\n    - 将**Type**（类型）拖入分组区域\n    - 将报表保存为`Account\
    \ by Type`，报表文件夹保存到**Unfiled Public Reports**（未归档的公共报表）\n\n4. 从仪表板构建器返回到仪表板，然后点击+\
    \ **Component**（组件）按钮。\n\n5. 选择刚刚创建的报表**Account by Type**。\n\n6. 点击**Add**（添加）按钮。如下图所示：\n\
    \   ![](img/72d01bea5a9ccf02f9452aab7505d9de_295_0.png)\n\n7. 将新添加的组件移动到第二个组件的右侧。\n\
    \n8. 点击+ Filter（过滤器）按钮以添加过滤器。\n\n9. 选择要用作过滤器的字段；在此练习中，选择Industry（行业）。\n\n10. 在Display\
    \ Name（显示名称）中，输入Account Industry（账户行业）。\n\n11. 点击Add Filter Value（添加过滤器值）按钮。\n\
    \n12. 在过滤器选项中，在**Operator**（运算符）中选择**equals**（等于）。对于**Value(s)**（值），选择**服装**和**教育**，并在**Display\
    \ Text**（显示文本）中输入`Apparel or Education`。请看下面的截图：\n    ![](img/72d01bea5a9ccf02f9452aab7505d9de_296_0.png)\n\
    \n13. 点击第一个值的**Apply**（应用）按钮，然后再次点击**Add Filter Value**按钮以添加第二个过滤器值。\n\n14. 在过滤器选项中，在**Operator**中选择**equals**。对于**Value(s)**，选择**能源**，在**Display\
    \ Text**中输入`Energy`。\n\n15. 点击第二个值的**Apply**按钮，然后再次点击**Add Filter Value**按钮以添加第三个过滤器值。\n\
    \n16. 在过滤器选项中，选择**not equal to**（不等于）。对于**Value(s)**，将其留空；在**Display Text**中输入空白。\n\
    \n17. 点击第三个值的**Apply**按钮，然后点击**Add**按钮。效果如下所示：\n    ![](img/72d01bea5a9ccf02f9452aab7505d9de_297_0.png)\n\
    \n18. 返回仪表板构建器，点击Save（保存）按钮，然后点击Done（完成）退出仪表板构建器。\n\n19. 现在，仪表板中有一个名为Account Industry的过滤器，其中定义了三个值。请看下面的截图：\n\
    \    ![](img/72d01bea5a9ccf02f9452aab7505d9de_298_0.png)\n\n21. 要删除或编辑过滤器，请点击仪表板中的**Edit**按钮进入仪表板构建器；接下来，查找铅笔图标（**Edit\
    \ Filter**（编辑过滤器）），如下图所示：\n    ![](img/72d01bea5a9ccf02f9452aab7505d9de_300_0.png)\n\
    \n从这里，你可以通过点击**Add Filter Value**按钮添加过滤器，或通过点击叉号图标删除该值。要编辑现有值，请点击过滤器值名称；对于此示例，让我们点击**能源**，然后选择**电子产品**，并将Display\
    \ Text更改为`Electronics or Energy`。点击**Apply**按钮，然后点击**Update**（更新）按钮。点击**Save**按钮，然后点击**Done**退出仪表板构建器。请看下面的截图：\n\
    \n![](img/72d01bea5a9ccf02f9452aab7505d9de_301_0.png)\n\n一个仪表板中最多可以有三个过滤器。要添加更多过滤器，请在仪表板编辑模式下点击Add\
    \ Filter（添加过滤器）按钮。\n\n### 查看仪表板\n\n就运行时而论，正如我们在第9章*在Lightning Experience中构建仪表板*中讨论的，当你打开仪表板时，它会显示基于最新刷新（手动或计划）的数据；而对于报表，当你打开报表时，它总是显示当前数据。\n"
