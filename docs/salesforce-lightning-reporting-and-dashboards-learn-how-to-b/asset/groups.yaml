    In this chapter, we explored the bucket fields and **Custom Summary Formulas**
    in detail. With the bucket field, we can categorize data for report purposes,
    and nothing needs to be done on the field in the object. This will eliminate the
    need for an admin to create a custom field if that field only serves one or two
    reports. However, bucket fields are not used to replace formula fields; you can''t
    have a formula calculation in the bucket field; you can use it to group values
    into a bucket.


