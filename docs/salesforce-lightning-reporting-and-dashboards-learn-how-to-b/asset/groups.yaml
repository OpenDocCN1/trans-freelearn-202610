    # Creating your first dashboard


    If you switch from Classic to Lightning, a dashboard is one of the things that
    attract most people to switch to Lightning. In Classic, you can have up to three
    columns for dashboard components, while in Lightning, you can have up to nine
    columns for the components, although the maximum number of components for a dashboard
    stays the same, which is 20.


    We have discussed many topics in this chapter or earlier chapters related to creating
    a dashboard, including the following:


    +   - Dashboard permissions

    +   - Dashboard folders and permissions

    +   - Opening and searching dashboards

    +   - Navigating a dashboard tab


    Well, let''s start with creating a dashboard.


    # Hands-on exercise for creating a dashboard


    Let''s create a dashboard with a component showing the number of accounts per
    sales representative in a horizontal bar chart, but before that, we need to create
    a report for the dashboard component data source. Assume you have all permissions
    required to create a report and a dashboard.


    Creating a dashboard in Lightning is pretty cool; you just need to point and click
    to build the dashboard. Start with selecting a valid report for the dashboard:


    +   1. Navigate to the **Reports** tab to create a new report.

    +   2. A report is a basic requirement for a dashboard as it uses it as the data
    source for the dashboard component, so let''s create the report:

    +      1. Click on the **New Report** button.

    +      2. Select the **Accounts** report type by clicking on the **Accounts &
    Contacts** category.

    +      3. Click on the **Create** button to continue.

    +      4. Select **All accounts** in the **Show** filter.

    +      5. Change the **Create Date Range** to **All Time**.

    +      6. Change the report format to **Summary**.

    +      7. Remove all columns and add only **Account Name** to the report.'
