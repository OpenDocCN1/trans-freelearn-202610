  - '[PAGE 140]


    # Understanding Report Types


    Deleting a custom report type will delete all existing reports built with the
    report type, including reports stored in all user private folders. So be cautious
    when deleting a report type, and make sure that it is no longer used.


    Best practices for deleting a custom report type are as follows:


    +   1. Hide the report type.

    +   2. Run a report to check how many active reports are using the identified
    report type. We will look into this in detail later in this chapter.

    +   3. Rename the report type with a prefix (for example, to **be deleted** with
    today''s date). The purpose of this action is to delete the report type after
    *x* months only if there are no active reports used.


    The Report Type category structure is a pretty similar to the Standard Report
    Folder, but do not get confused between the two.


    The standard report folder contains all standard reports provided by Salesforce
    out-of-the-box; you will not be able to overwrite it, but you can modify it and
    save the report as a new report into a custom public report folder or your personal
    report folder.


    The **Report Type** category stores all report types, including the standard and
    custom report types. You can store custom report types into any **Report Type**
    category, but you cannot create or add a new **Report Type** category.


    # Hands-on exercise for hiding a report type


    Use case: We have too many report types available and this causes our user to
    get confused about which report type to use and the differences between some of
    the report types. Instead of deleting the custom report type, which will auto-delete
    the reports created with that report type, let''s just hide those existing report
    types that are no longer needed.


    +   1. to the **Reports** tab.

    +   2. Click on the **New Report** button.

    +   3. Click on the **Select Report Types to Hide** checkbox.

    +   4. Click on the + icon before the report category name to expand all report
    types in that category. For this exercise, click on **Accounts & Contacts**.

    +   5. A report type with a green checkmark means the report type is available
    to use when creating a new report, while the one with a yellow cross means it
    is not available for use.'
  - '[PAGE 141]


    6. Click on the report type name to toggle from visible to hide and from hide
    to visible. For this exercise, click on **Contacts with Assets**; the icon will
    change from a green tick to a yellow cross, and all existing reports built on
    that report will be not deleted, if the report is used as a data source report
    for a dashboard component, hiding the report type will not affect the dashboard
    too. Consider the following screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_141_0.png)


    7. Click on **Select Report Types to Hide** again to unselect it; all report types
    hidden will no longer be visible for all users to use when creating a new report.'
  - '[PAGE 142]


    # Understanding Report Types


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_142_0.png)


    # Standard Report Type


    When you click on the **New Report** button from the **Reports** tab, you will
    be presented with a list of the **Report Type** categories as shown in the following
    screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_142_1.png)'
  - '[PAGE 143]


    There are two types of Standard Report Types:


    +   - The report type that comes with Salesforce for standard objects, such as
    **Contacts & Accounts**. You can easily distinguish this report type, as it will
    have a **Preview** when you select that report type when creating a new report.


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_143_0.png)


    +   - The report type is autogenerated when you enable the **Allow Report** option
    for a custom object. This report type will not have **Preview**, but it will just
    say **No preview available**.


    When you relate an object to another object and both objects are enabled for reports,
    the following options will happen depending on the relationship. In the following
    example, we will use Customer (custom object) as the parent object and Claim (custom
    object) as the child object. Both objects have been enabled for the report. Let’s
    look closer at both Master-Detail Relationship and Lookup Relationship and see
    what will happen with the report type when the relationship between these objects
    is built.'
  - '[PAGE 144]


    # The Lookup relationship


    When you add a Lookup field relationship between objects, the following behavior
    will happen related to the report type:


    +   - When you activate **Enable Reports** for a claim object, the system will
    auto-create the **Claims** report type.

    +   - When you relate **Claim** to the customer object as a child with a Lookup
    relationship, the system will add the customer field to the claims report type.
    The user will see the additional customer name field available for the claims
    report type, but no other fields from the customer object will be available for
    the report. The Claims report type will contain all the claims recorded with or
    without customer:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_144_0.png)'
  - '[PAGE 145]


    +   - There will be no change in the existing **Customers** report type because
    **Customer** is the parent object.

    +   - A new report type called **Claims with Customer** will be created in the
    **Other Reports** category. This report type will contain all fields available
    from both **Claim** and **Customer** objects.


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_145_0.png)


    +   - This report type will show the **Claims with Customer** record only; this
    also means that the **Claims** record without Customer will not be in the report
    generated.


    # The Master-Detail Relationship


    When you add a Master-Detail Relationship between objects, the following behavior
    will happen related to the report type:


    +   - When you activate **Enable Reports** for the Claim object, the system will
    auto-create the **Claims** report type.

    +   - When you relate **Claims** to the **Customers** object as a child with a
    Master-Detail Relationship, the existing **Claims** report type will be removed
    because the **Claim** object became the child of the Customer object in a master-detail
    relationship.

    +   - There is no change in the existing **Customers** report type because customer
    is the parent object.'
  - '[PAGE 146]


    # Understanding Report Types


    +   - A new report type called **Customers with Claims** will be created in the
    **Other Reports** category folder. Note the difference with the report type auto-created
    in **Lookup Relationship** discussed earlier. This report has all fields available
    from both **Customer** and **Claim** objects and will show **Customer with Claim**
    only; this also means **Customer without Claim** records will be not in the report
    generated:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_146_0.png)


    Let''s summarize the preceding relationship in the matrix:


    | Description | Lookup | Master-Detail Relationship |

    |---|---|---|

    | Claim Report Type | No change, only add the **Customer** field name | **Claim**
    report type will be removed |

    | Customer Report Type | No change | No change |

    | New Report Type Created | **Claims with Customer** with all fields from both
    objects, only show claim records with customer; here, the primary object is **Claim**
    | **Customers with Claims** with all fields from both objects, only show customers
    records with claim; here, the primary object is **Customer** |'
  - '[PAGE 147]


    # The Custom Report type


    A report type defines the set of records and fields available to a report. The
    source of a report type can be only from an object, or it can include related
    objects. The report type also determines only those records that meet the criteria
    defined in the report displayed in it.


    When the standard report types provided do not meet your reporting needs, your
    admin can create a custom report type. The custom report type supports multi-level
    object relationships, defined from the parent level object as the Primary object
    and related to the child object and grandchild object, not the other way.


    Let''s look at an example--you have an object relationship of **Customer > Claim
    > Claim Payment**; in this relationship, you can build a custom report type **Customer**
    with **Claim** and Claim Payment, not Claim Payment Customer with **Claim** and
    **Customer**.


    Using **Customer** and **Claim** objects discussed in the Standard Report Type,
    in the Master-Detail Relationship, the **Customers with Claims** report type will
    be auto-created. See the following illustration, the grey area would be the report
    result when using this report type:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_147_0.png)


    In the preceding figure, A is the customer object and B is the Claim object. The
    **Customers with Claims** standard report type will be auto-created by the system
    when you relate the objects. This report type will generate reports for **Customers
    with Claim** only, and **Customers without Claim** will not be available in the
    report using the report type. If you need to generate a report to produce all
    customers, you can use the **Customers** report type, but **Claim** fields will
    not be available in the report.'
