    3. 点击屏幕右下角的**共享**按钮。

    4. 你可以选择发布到此仪表板、一个群组或我的关注者。在本练习中，让我们选择**此仪表板**。

    5. 你可以在**消息**框中输入消息。

    6. 点击**发布**按钮。如下面的截图所示：


