  - '[PAGE 60]


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_60_0.png)


    When all users in a profile need to run a report, the admin can simply enable
    this permission in Profile under the General User Permissions section. To assign
    this permission to users in different profiles, use Permission Set instead. Remember
    that Permission Set will only add permissions per user basis, not to remove permissions
    and is not related to the user Profile.


    This permission also controls the ability of a user to access a dashboard. We
    will cover dashboards in detail in Chapter 9, Building Dashboards in Lightning
    Experience. If you cannot run a report, contact your admin to get this permission
    enabled.


    Quick check if you have this permission enabled, click on the Reports tab, and
    then click on the All Reports menu. You should see the report generated in seconds,
    but if you see an error message as in the previous screenshot, this means you
    do not have permission to run the report. If you do not see the Reports tab at
    all, check out the Navigating to reports and dashboards section of Chapter 1,
    Fundamentals of Salesforce Reports and Dashboards.


    # Create and customize reports


    The Create and Customize Reports permission controls the user''s ability to create
    a new report, or modify an existing one. Without this permission, the user will
    not see the New Report button under the Reports tab. This permission requires
    the Run Reports permission, so, if the Run Reports permission is disabled for
    a user, automatically, the Create and Customize Reports is also disabled for the
    user. Similarly, when you enable the Create and Customize Reports permission,
    the Run Reports permission will be auto-enabled as well.'
  - '[PAGE 61]


    When you have this permission enabled, you should see the **New Report** button,
    otherwise, you will not be able to create and customize reports. Talk to your
    admin to get this enabled if you need to create or customize a report. The following
    screenshot shows the user has permission to create the report:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_61_0.png)


    # Export reports


    The **Export Reports** permission manages a user’s ability to export a report
    into Excel or CSV file format. Similar to the **Create and Customize Reports**
    permission, this permission also depends on the **Run Reports** permission. Disabling
    the **Run Reports** permission will auto disable this permission. But this permission
    does not depend on the **Create and Customize Reports** permission, which means
    that a user may be able to export a report even if she or he is not able to create
    or customize a report.'
  - "[PAGE 62]\n\n# Concepts and Permissions in Reports and Dashboards\n\nWhen you\
    \ open a report, and you have this permission enabled, you will see the **Export**\
    \ link under the arrow dropdown next to the **Edit** button. Consider the following\
    \ screenshot:\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_62_0.png)\n\n> \U0001F4A1\
    \ **TIP**  \n> In Classic, there is an option to export reports as printable view.\
    \ The exported Excel file will retain the format, and the summary information\
    \ with the report will be generated in Salesforce.\n\n# Subscribe to reports\n\
    \nThe **Subscribe** to reports permission enables users to subscribe to reports\
    \ for delivery to their email address without the need to open the report. When\
    \ you subscribe to reports in Lightning Experience, you will receive refreshed\
    \ report results by email on a schedule that you set—**Daily, Weekly, or Monthly**."
  - '[PAGE 63]


    A user with this permission will see the **Subscribe** button after the report
    opens, as shown in the following screenshot. We will discuss subscribing to a
    report in detail in Chapter 8, *Working with Reports*:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_63_0.png)


    There are two permissions related to this permission, which is as follows:


    +   - **Subscribing to reports by adding recipients**: This permission will allow
    you to add other users to get the e-mail delivery. By default, you are included,
    but you can remove yourself when you add someone else.


    +   - **Subscribing to reports by setting a running user**: This permission will
    allow you to specify the running user as someone else as long as that user has
    access to the report.


    # Dashboard permissions


    After looking at report permissions in the last section, let''s now look at dashboard
    permissions available in Salesforce. Permissions in dashboards determine the ability
    of a user to open, create, and edit dashboards in Salesforce.


    # Run reports permission


    We have discussed the **Run Reports** permission in the *Report permissions* section,
    and we are not going to repeat that here, but we would like to emphasize that
    dashboards in Salesforce are based on reports. Each dashboard component in Salesforce
    is supported by a report as the backend data source.'
  - '[PAGE 64]


    To allow a user to open or view a dashboard in Salesforce, the user needs to have
    the permission to run reports, and the dashboard viewing user must have access
    to the reports used as the data source for the dashboard components. Without the
    **Run Reports** permission, the user will get an error message saying **You don''t
    have permission to run reports. Check that you have the Run Reports user permission.**
    when opening a dashboard.


    **Run Reports** is a basic permission needed by every user working with reports
    and dashboards in Salesforce, even to just run or open a report or dashboard.


    # Creating and customizing dashboards permission


    The **Create and Customize Dashboards** permission controls the user''s ability
    to create a new dashboard or modify an existing one. Without this permission,
    the user will not be able to see the **New Dashboard** button when they click
    on the **Dashboards** tab.


    This permission requires the **Run Reports** permission too. If the **Run Reports**
    permission is disabled, enabling **Create and Customize Dashboards** is useless
    for the user.


    # Manage dynamic dashboards permission


    The Manage dynamic dashboards permission allows users to create and edit dynamic
    dashboards. We will look into Dynamic Dashboards in more detail in *Chapter 10,
    Learning Advanced Dashboard Configuration*. But for now, you just need to understand
    that a dynamic dashboard allows login user to select other users as viewing user,
    based on the user permissions and role hierarchy.'
  - '[PAGE 65]


    When creating or editing a dashboard, a user with this permission will have options
    to set the dashboard running user as the logged-in user, or to allow a user who
    opens the dashboard to change the viewing user. The following screenshot shows
    enabling a dynamic dashboard:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_65_0.png)


    # The View My Team''s Dashboards permission


    The View my team''s dashboards permission allows users to view dashboards owned
    by people under them in the role hierarchy.


    When creating or editing a dashboard, the user with the **Manage Dynamic Dashboards**
    permission and **View My Team''s Dashboards** permission has an option to set
    **Dashboard Running User**, and to enable **Let authorized users change running
    user**.'
  - '[PAGE 66]


    When opening a dynamic dashboard, the user without the **View My Team''s Dashboards**
    permission will not be able to change the dashboard viewing user. However, a user
    with this permission will be able to change and enter a user in his/her team in
    the role hierarchy as viewing user. A user with the **View All Data** permission
    will be able to enter any other user as a viewing user. The following screenshot
    shows how to change the dashboard viewer:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_66_0.png)


    # Schedule dashboards


    We will discuss dashboards in *Chapter 9, Building Dashboards in Lightning Experience*,
    but for now, you should know that when you open a dashboard, it does not present
    the latest data, but the data of the dashboard last refreshed by you, or refreshed
    by your colleague, or data scheduled for auto-refresh.


    Salesforce offers the ability to refresh a dashboard up to a limit for a user
    with the **Schedule Dashboard** permission. I will share more on this in *Chapter
    9, Building Dashboards in Lightning Experience*, but for now, just note that we
    can schedule dashboard refresh, and e-mail the dashboard to ourselves or to other
    users.


    As of the Summer ’17 release, this feature is only available in Classic, and not
    yet in Lightning Experience.'
