    \ discuss how to work with a report, including opening a report, searching a report,\
    \ and adding a report to favorites. Then, we will continue with navigating a report\
    \ and components that you need to be aware of when running a report, including\
    \ adding a chart, the show or hide report option, and change and remove report\
    \ filters.\n\nBy the end of this chapter, you will be fully equipped with the\
    \ working knowledge of Salesforce reporting in Lightning, including subscribing\
    \ to reports for report delivery by email.\n\nThroughout this chapter, we will\
    \ provide notes and tips to help you understand important items. The following\
    \ topics will be covered:\n\n- Opening and searching reports\n- Navigating to\
    \ a report and report components\n- Subscribing reports\n\n### Opening a report\n\
    \nLet’s start with opening a report in Salesforce Lightning; remember that reports\
    \ are stored in the report folder, either in a private or public folder. Private\
    \ reports are only accessible by the user who saves the report into the **My Personal\
    \ Custom Reports** folder. We have discussed this in depth in *Chapter 2, Concepts\
    \ and Permissions in Reports and Dashboards*; please refer to that chapter for\
    \ a refresher on permissions.\n\nThere are multiple ways to open a report in Salesforce\
    \ Lightning. First, click on the **Reports** tab.\n\n### The Reports tab\n\nYou\
    \ will see two main panels here: the left-hand side panel and the right-hand side\
    \ panel. The left-hand side panel contains categories of **Reports** and **Folders**,\
    \ and the right-hand side panel will show a list of reports or folders related\
    \ to the menu selected in the left-hand side panel.\n\n### The Reports menu\n\n\
    Once you click on the **Reports** tab, you will see all things related to reports.\
    \ There are two main categories on the left panel, which are **Reports** and **Folders**.\
    \ Under the **Reports** category, there are multiple menus which will filter the\
    \ reports shown in the right-hand side panel. Consider the following screenshot:\n\
    \n![](img/72d01bea5a9ccf02f9452aab7505d9de_228_0.png)\n"
  mdcn: "\n\n## 在报表和页面中添加图表\n\n22. 选择**折线图**图标；保留所有默认值，只需勾选**累计**复选框。\n23. 在报表中点击任意位置以关闭**编辑图表**面板。\n\
    24. 报表将立即显示；不要忘记再次保存报表以更新新的**折线图**：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_218_0.png)\n\
    \n25. 接下来，让我们修改报表，使其增加第二个分组维度：**商机所有者**。点击**编辑**按钮，并将**商机所有者**拖放到**阶段**下方的分组区域中。\n\
    26. 点击**运行报表**按钮；现在您应该看到**商机所有者**作为**阶段**之后的第二级分组被添加。\n27. 点击报表中的齿轮图标，在**编辑图表**面板中滚动到底部，注意**添加**下拉框，然后选择**分组**。\n\
    28. 因为我们只有一个额外的分组，即**商机所有者**，所以它会默认被添加。请参考以下截图：\n\n**显示为**\n\n**图表属性**\n\n| 字段\
    \ | 值 |\n|---|---|\n| 图表标题 | 上一财年商机 |\n| X轴 | 阶段 |\n| Y轴 | 金额合计 |\n| 显示参考线 | \
    \ |\n| 累计 |  |\n| 添加 | 分组 |\n| 分组 | 商机所有者 |\n| 编辑 |  |\n\n29. 在报表中点击任意位置以关闭**编辑图表**面板。\n\
    30. 现在您应该看到多条线；在我的示例中，因为我只有两个所有者，所以只显示两条线。请记住点击**保存**以保存报表更改。请参考以下截图：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_220_0.png)\n\
    \n### 在对象页面中嵌入报表图表\n\n如果您能够直接在**客户**页面上以图表形式展示某个客户的所有商机，并按**商机阶段**分组，那岂不是很好？同样，在**客户**页面上显示该客户提出的与客户支持相关的工单图表，或其他自定义对象的图表，也是如此。这是\
    \ Salesforce 开箱即用的一项强大功能，可以将报表图表嵌入标准或自定义对象页面中。\n\n关于记录页面中嵌入图表，需要注意以下几点：\n\n- \
    \  要将图表添加到页面布局中，您需要编辑页面布局，因此只有管理员或具有**自定义应用程序**权限的用户才能执行此操作。\n-   每个页面布局中最多只能添加两个图表。\n\
    -   记录页面上显示的图表基于在**摘要**或**矩阵**报表中添加的图表。\n-   您无法在页面布局中修改图表类型。\n-   您可以设置图表在用户打开页面布局时自动刷新。\n\
    -   当用户点击页面布局中的图表时，系统会打开报表，并根据用户正在查看的记录自动筛选报表，从而下钻到数据详情。\n\n### 将图表添加到页面布局的动手练习\n\
    \n让我们考虑一个用例：在**客户**页面布局中添加一个嵌入的商机图表和个案数量图表。\n\n1. 创建一个**商机**报表，按**阶段**分组，添加**金额**字段，对其进行汇总，将报表保存到公共文件夹，添加**垂直条形图**，然后再次保存报表。\n\
    2. 从**客户支持报表**报表类型类别中创建一个个案报表，按**状态**分组，将报表保存到公共文件夹，添加**环形图**，然后再次保存报表。\n3. 通过导航至**设置\
    \ | 对象和字段 | 对象管理器 | 客户 | 页面布局**来编辑客户页面布局。打开相应的页面布局，在左侧菜单中找到**报表图表**。点击**报表图表**，在右侧面板中找到该报表；只有包含图表的报表才会显示在这里，并且存储在公共文件夹中：\n\
    \n![](img/72d01bea5a9ccf02f9452aab7505d9de_223_0.png)\n\n4. 您将看到图表类型显示为报表的图标。\n\
    5. 将这两个报表拖放到报表区域。为了获得更好的用户体验，我倾向于创建一个新分区。\n6. 将组件添加到页面布局后，点击**属性**图标进行修改：\n  \
    \ -   **大小：** 小、中、大。\n   -   **外观：** 显示报表标题，有错误时隐藏图表。\n   -   **数据：** 筛选和刷新。请参考以下截图：\n\
    \n![](img/72d01bea5a9ccf02f9452aab7505d9de_223_1.png)\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_225_0.png)\n\
    \n因此，请确保该报表对公司中的所有人可见，除非有特定原因不这样做。\n\n在图表的底部，您会看到图表的最后刷新时间。如果您没有为图表勾选**每次用户打开页面时刷新**，请点击此处的图表，您应该会看到**刷新**按钮和**转到报表**按钮。\n\
    \n您可以将图表添加到其他页面布局，包括具有关联关系的自定义对象：\n\n-   对于**主从关系**，您无需更改任何内容；页面布局中的子对象字段不必在报表或图表中，即可按父字段进行筛选。\n\
    -   对于**查找关系**，请确保报表类型中提供父字段；否则，创建一个新的报表类型来容纳它。对于**主从关系**也是一样的；您不需要在报表或图表中添加该字段。\n\
    \n### 本章小结\n\n在本章中，我们了解了 Salesforce Lightning 中可用的图表类型。任何能够运行报表的用户都能够在运行报表时即时添加或修改图表，这包括没有创建和自定义报表权限的用户。我们还讨论了支持添加图表的报表格式。\n\
    \n如果将图表添加到报表中，并且该报表存储在公共文件夹中，我们就可以将图表嵌入记录页面布局。一个记录页面中最多可以有两个图表。只有系统管理员或具有**自定义应用程序**权限的用户才能将图表添加到页面布局。您可以选择将图表设置为每\
    \ 24 小时自动刷新一次，或由用户手动刷新。\n\n在下一章中，我们将讨论如何使用报表。Lightning 中的报表为我们提供了许多可供探索的功能；然后我们可以分析由这些报表生成的数据。\n\
    \n## 使用报表\n\n在日常工作中，我们大多数人处理的是运行报表，而不是创建或编辑报表。因此，掌握在 Lightning Experience 中使用报表的知识非常重要，包括一些能让我们的工作更高效、更省力的技巧。\n\
    \n在本章中，我们将讨论如何使用报表，包括打开报表、搜索报表以及将报表添加到收藏夹。然后，我们将继续介绍报表导航以及运行报表时需要注意的组件，包括添加图表、显示或隐藏报表选项，以及更改和删除报表筛选器。\n\
    \n到本章结束时，您将全面掌握在 Lightning 中使用 Salesforce 报表的工作知识，包括订阅报表以通过电子邮件接收报表。\n\n在本章中，我们将提供注释和提示，帮助您理解重要内容。将涵盖以下主题：\n\
    \n-   打开和搜索报表\n-   导航到报表和报表组件\n-   订阅报表\n\n### 打开报表\n\n让我们从在 Salesforce Lightning\
    \ 中打开报表开始；请记住，报表存储在报表文件夹中，可以是私有文件夹或公共文件夹。私有报表仅对将报表保存到**我的个人自定义报表**文件夹的用户可访问。我们已在*第\
    \ 2 章，报表和仪表板中的概念与权限*中深入讨论了这一点；如需复习权限，请参阅该章节。\n\n在 Salesforce Lightning 中，有多种打开报表的方法。首先，点击**报表**选项卡。\n\
    \n### 报表选项卡\n\n您将在这里看到两个主要面板：左侧面板和右侧面板。左侧面板包含**报表**和**文件夹**的类别，右侧面板将显示与左侧面板中所选菜单相关的报表或文件夹列表。\n\
    \n### 报表菜单\n\n一旦您点击**报表**选项卡，您将看到与报表相关的所有内容。左侧面板中有两个主要类别，即**报表**和**文件夹**。在**报表**类别下，有多个菜单，它们将筛选右侧面板中显示的报表。请参考以下截图：\n\
    \n![](img/72d01bea5a9ccf02f9452aab7505d9de_228_0.png)\n\n"
