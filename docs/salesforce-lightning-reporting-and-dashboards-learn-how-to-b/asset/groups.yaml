    To create a Master-Detail Relationship for an existing object that contains records
    as a child object, you can initially set it as a Lookup Relationship, populate
    the parent field for all child records, and then change the relationship to Master-Detail
    Relationship.


    Hierarchical Relationship is a special Lookup relationship available for the user
    object only. It lets users use a lookup field to associate one user with another,
    which does not directly or indirectly refer to itself. For example, you can create
    a custom Hierarchical Relationship field to store each user''s reporting manager.


    You can build a many-to-many object relationship using two Master-Detail Relationships
    in a single custom object; this is known as a **Junction object.**


    # Field types


    Salesforce provides various data types to fit your business model. Some of them
    are built with business logic, for example, emails have to follow a valid e-mail
    format, and URLs have to follow a valid URL format; an invalid value will be auto
    rejected by the system. For each data type, you can determine additional options
    to specify including Required, Unique, Case sensitive, External ID, and Default
    Value.


    Here is a list of the Salesforce data types:


    +   - Auto Number

    +   - Formula

    +   - Roll-Up Summary if an object is the parent in Master-Detail Relationship

    +   - Hierarchical relationship--only for a User object

    +   - Lookup Relationship

    +   - Master-Detail Relationship

    +   - Checkbox

    +   - Currency

    +   - Date

    +   - Date/Time

    +   - Email

    +   - Geolocation

