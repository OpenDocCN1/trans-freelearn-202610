    Salesforce 提供一个工具来帮助你检查组织对 Lightning Experience 的准备情况。在 Lightning Experience 设置菜单中，点击“检查你的
    Lightning Experience 就绪情况”下的 **评估（Evaluate）** 链接。Salesforce 将把一份就绪情况报告通过电子邮件发送给你。


    ## 切换到 Lightning Experience


    一旦启用了 Lightning Experience 并分配了权限，先点击你的姓名，再点击 **切换到 Lightning Experience**，如下图所示：


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_30_0.png)


    截至目前，并非所有 Classic 中的功能在 Lightning Experience 中都可用；你可能需要在必要时切换回 Classic。例如，回收站在
    Lightning Experience 中不可用。要切换回 Classic，点击你的头像，然后点击“切换到 Salesforce Classic”。你可以使用相同的路径切换回
    Lightning Experience：


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_32_0.png)


    Summer ''17 版本为管理员提供了移除用户切换回 Classic 的切换器（switcher）的能力。如果你不是系统管理员，请联系你的系统管理员；如果你是系统管理员，则有一个新的权限控制此功能——该权限名为“在配置文件中隐藏切换到
    Salesforce Classic 的选项”。


    ## Salesforce 对象模型


    无论用户界面是什么，Classic 还是 Lightning Experience，后端数据库都是相同的。你在 Classic、Lightning Experience
    甚至 Salesforce1 移动应用中都会看到相同的数据。所有可构建的报告和仪表板都基于你的 Salesforce 组织中实现的对象模型，从对象关系到字段类型级别。在学习构建高级报告和仪表板之前，将此作为基础来了解至关重要。


    本节将讨论 Salesforce 中的对象模型。对象是 Salesforce 中的关键组件，它们允许你存储数据。类似于数据库中的表，一个对象由多个字段组成以存储数据。你可以将某些字段设为必填，而另一些字段将由系统自动填充，例如**ID**、**创建日期**、**创建者**、**最后修改日期**和**最后修改者**。


    你可以将对象类比为表，字段类比为表中的列，记录类比为表中的行。在下表中，字段 1 存储所有名字的值，字段 2 存储出生日期，依此类推：


    | 记录 | 字段 1 | 字段 2 | 字段 3 |

    |---|---|---|---|

    | 记录 1 | John | 6月29日 | ... |

    | 记录 2 | May | 12月10日 | ... |

    | 记录 3 | Steve | 2月24日 | ... |


    Salesforce 中有两类对象：


    - 标准对象

    - 自定义对象


    ### 标准对象


    当你订阅 Salesforce 时，默认会提供标准对象；这取决于你订阅的云类型。每个对象在特定功能上都有其独特性，并且对象之间具有内置的关系。以下是你订阅
    Sales 和 Service Cloud 时的一些主要标准对象：


    - **Account**：Account 用于存储你的公司与之交互的业务和组织的信息。

    - **Contact**：Contact 存储与你共事的人员信息——潜在客户、客户或供应商。

    - **Opportunity**：Opportunity 用于存储与客户的销售交互信息；这通常被称为**销售周期**。

    - **Lead**：Lead 用于存储可能成为你公司客户或合作伙伴的人员信息。

    - **Case**：Case 存储与你提供的产品或服务相关的客户交互信息。

    - **Campaign**：Campaign 存储你公司的营销活动和响应信息。


    其他一些标准对象包括 Activity、Asset、Contract、Quote、Order、Products 和 Price Book。


    每个标准对象都带有基于对象用途的默认字段，例如，**Opportunity 中的阶段**、**Contact 中的移动电话** 等等。你可以在标准对象中创建自己的字段；这称为**自定义字段**。你可以创建的字段的最大数量取决于你订阅的
    Salesforce 版本。


    你可以将 Salesforce 版本升级到更高版本，例如从 Professional Edition 升级到 Enterprise Edition，只需联系你的客户经理（Account
    Executive）并支付增加的订阅费用即可。你将继续使用相同的组织、现有的数据库和自定义配置。但如果你计划降级到较低版本，实际上是不可能降级的。在合同结束时，Salesforce
    会为你提供一个全新的组织，你需要在其中重新配置并迁移所有数据。


    ### 自定义对象


    自定义对象是在组织内创建的对象，用于存储该组织业务特有的数据，这些数据无法使用标准对象存储。只有具有管理员访问权限的用户才能创建自定义对象。大多数 AppExchange
    软件包都会创建和使用自定义对象，因为它们提供特定的业务流程。与标准对象一样，自定义对象用于在 Salesforce 中存储特定数据。


    不要创建自定义对象来替代标准对象提供的功能。例如，如果你创建自定义 Lead 对象，你将浪费 Lead 对象提供的所有功能，例如 Lead Conversion（线索转换）。


    可以创建的自定义对象的数量是有限的，具体取决于你订阅的 Salesforce 版本。如果你具有管理员权限，则可以在 Salesforce 中通过简单的点击（Point
    and Click）创建对象和字段，而无需像传统数据库那样编写复杂的 SQL 脚本。


    在标准对象中，可用的标准字段取决于对象，但每个自定义对象都带有以下少量标准字段，这些字段对所有自定义对象都是相同的：


    - ID

    - 名称

    - 创建者和创建日期

    - 最后修改者和最后修改日期

    - 所有者（如果该对象不是主从关系（Master-Detail Relationship）中其他对象的子对象）


    与标准对象一样，你可以在自定义对象中创建自定义字段。


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_35_0.png)


    请按设计用途使用标准对象。例如，Salesforce CRM 提供了标准的 Account 和 Contact 对象，因此不要创建自定义字段，例如在 Account
    中创建联系人电子邮件地址。


    ### 对象关系


    你可以在 Salesforce 中将一个对象关联到其他对象。例如，将自定义对象 Expense 关联到自定义对象 Project。通过这种关系，你将知道哪条费用记录用于哪个项目。在此示例中，Project
    被视为父对象，Expense 为子对象。从记录层面来看，一个父对象可以拥有多个子对象，而一个子对象只能拥有一个父对象。要从子对象构建这种关系，需要创建一个指向父对象的查找关系（Lookup
    Relationship）或主从关系（Master-Detail Relationship）字段。


    Salesforce 中有三种类型的对象关系，如下所示：


    - 主从关系（Master-Detail Relationship）

    - 查找关系（Lookup Relationship）

    - 层次关系（Hierarchical Relationship）


    下表对主从关系和查找关系进行了比较：


    | 主从关系 | 查找关系 |

    |---|---|

    | 你可以在两个自定义对象之间，或在自定义对象与标准对象之间定义主从关系（标准对象必须为父对象）。 | 你可以在任意两个对象之间定义关系，无论是标准对象还是自定义对象。
    |

    | 当主对象（父对象）中的记录被删除时，与该主记录相关的所有明细对象（子对象）记录也将被删除。 | 你可以配置子对象，以便在父对象被删除时，要么清除子记录中的父记录值，要么不允许删除父记录。
    |

    | 所有子记录都必须有一个关联的父记录。 | 父记录可能不是必填的，但你可以配置为必填父字段。 |

    | 子记录的所有权由关联的父记录决定；子记录没有所有者。 | 每条子记录都有一个所有者。 |

    | 明细记录继承主记录的共享和安全设置。 | 关联的父记录和子记录之间没有安全共享或继承。 |

    | 你可以将现有自定义对象关联为子对象，但子对象中不应存在任何记录。 | 要将一个对象关联到另一个对象，对子对象的现有记录数量没有任何验证。 |

    | 如果父对象中有 Roll-Up Summary 字段，则子记录中的创建、编辑或删除操作将触发父对象中的编辑操作。如果父对象中有验证规则，则该验证规则也会被触发。
    | 你无法使用 Salesforce 开箱即用的功能在查找关系中创建 Roll-Up Summary。 |

    | 支持跨对象工作流；你可以定义使用子记录的值更新父记录中的字段。 | 不支持跨对象工作流。 |

    | 能够配置子记录以允许重新指定父记录为新父记录。 | 子记录始终可以重新指定父记录为另一条父记录。 |

    | 能够配置共享设置，以允许根据父记录上的权限创建、编辑或删除相关的明细记录。 | 父对象和子对象之间没有共享设置依赖关系。 |

    '
