    \ **Share** button next to CEO. Leave the access menu as **Viewer**, and click\
    \ on the **Done** button to continue.\n4. Next, click on the Users link, and look\
    \ for Jack Fin. Click on the Shared button next to that user. The default access\
    \ would be Viewer; click on the arrow next to it, and select Manager. Now click\
    \ on the Done button to continue as shown in the following screenshot:\n\n   ![](img/72d01bea5a9ccf02f9452aab7505d9de_59_0.png)\n\
    \n5. Click on the Close button to close the window.\n\nIn this hands-on exercise,\
    \ you learned how to share a report folder with a user with Manager-level access,\
    \ and with users in a role to view reports.\n\n## Report permissions\n\nWhen we\
    \ discussed the report and dashboard folders in the chapter earlier, you may have\
    \ noticed that we talked about permissions to create report, to create report\
    \ folder, and so on. Permission is the basic setting that controls the ability\
    \ of a user to do things in Salesforce including reports and dashboards.\n\nBefore\
    \ we start to create a report, we'll discuss a few permissions, which determine\
    \ the ability of a user to run, create, edit, export, schedule, and subscribe\
    \ reports in Salesforce.\n\n### Run reports\n\nThis is the basic permission needed\
    \ to run a report. Without the Run Reports permission, you will not be able to\
    \ run any report in Salesforce. When you try to click on the report, you will\
    \ get an error message that says You don't have permission to run reports. Check\
    \ that you have the Run Reports user permission, as shown in the following screenshot:\n"
  mdcn: "\n\n## 标准报表和报表文件夹\n\n当你开始使用 Salesforce 时，默认情况下，Salesforce 自带许多用于不同目的的标准报表。它们按对象名称和用途进行存储和分类，例如“客户和联系人报表”、“机会报表”等。\n\
    \n从 Summer '17 版本开始，带有文件夹的标准报表仅在 Classic 中可见，在 Lightning Experience 中尚不可见。\n\n\
    ![](img/72d01bea5a9ccf02f9452aab7505d9de_53_0.png)\n\n上面的截图来自 Classic（请参阅*第1章，Salesforce\
    \ 报表和仪表板基础知识*中的*切换到 Lightning Experience*部分，了解如何在 Classic 和 Lightning Experience\
    \ 之间切换）。请注意，在 Classic 中，当你点击**报表**选项卡时，你会看到来自报表和仪表板的内容，并且你可以通过查看文件夹名称前的不同图标轻松区分报表文件夹和仪表板文件夹。\n\
    \n在 Classic 中，你可以在选项卡内进行搜索，而在 Lightning Experience 中，报表和仪表板位于不同的选项卡中。选项卡中没有搜索框，但你可以使用全局搜索来搜索报表和仪表板。\n\
    \n## 创建报表和仪表板文件夹\n\n在 Salesforce 中创建报表文件夹和仪表板文件夹非常简单。只要你拥有相应的权限，你应该会在“报表”选项卡中看到“新建文件夹”按钮以创建报表文件夹，并在“仪表板”选项卡中看到“新建文件夹”按钮以创建仪表板文件夹。你需要拥有适当的权限才能创建报表和仪表板文件夹。我们将在本章稍后详细讨论权限。\n\
    \n让我们进行一个快速的动手练习来创建报表文件夹。请记住，每个报表都需要存储在一个文件夹中，因此深入了解文件夹本身对你来说是有好处的。\n\n### 创建报表文件夹的动手练习\n\
    \n确保你拥有创建报表文件夹的适当权限。让我们按照以下步骤创建一个报表文件夹：\n\n1. 导航到“报表”选项卡。\n2. 单击窗口右上角的“新建文件夹”按钮，如下面的截图所示：\n\
    \n   ![](img/72d01bea5a9ccf02f9452aab7505d9de_54_0.png)\n\n3. 在“名称”中输入 `My First\
    \ Report Folder` 作为报表文件夹名称。\n4. 单击“保存”按钮；将出现一条弹出消息，指示文件夹是否已成功创建。\n5. 我们刚刚创建的文件夹\
    \ `My First Report Folder` 将显示在**所有文件夹**中，也会显示在**由我创建**的文件夹中，如下面的截图所示：\n\n   ![](img/72d01bea5a9ccf02f9452aab7505d9de_55_0.png)\n\
    \n查看上面的截图，让我们逐一了解“报表”下的每个菜单：\n\n- **最近使用的报表：** 这将显示您最近打开的所有报表，因此您的同事将拥有不同的最近打开的报表。\n\
    - **由我创建：** 这包含您创建的所有报表，无论这些报表存储在哪个文件夹中。\n- **私人报表：** 这是一个安全文件夹，用于存储供您个人使用的报表；存储在此处的报表其他用户无法访问，并且您无法与其他用户共享该文件夹。\n\
    - **公共报表：** 这包含所有对所有人可见的报表。\n\n> 提示：由于此文件夹对所有用户可访问，并且任何人都可以编辑或删除它，请注意不要将您的私人或重要报表存储在此文件夹中。\n\
    \n- **所有报表：** 这将显示您有权打开的所有报表。\n\n以下是**文件夹**下的菜单：\n\n- **由我创建：** 这将显示您创建的所有报表文件夹。\n\
    - **与我共享：** 这是由您的同事创建但与您共享的报表文件夹列表。\n- **所有文件夹：** 这将列出您有权访问的所有报表文件夹，包括由您的同事创建的或作为从\
    \ AppExchange 安装应用的一部分而安装的报表文件夹。\n\n## 报表和仪表板文件夹共享\n\n与创建报表和仪表板文件夹相同，从 Summer\
    \ '17 版本开始，共享公共报表和仪表板文件夹只能在 Classic 中完成。\n\n点击**报表**选项卡，将鼠标悬停在要共享的文件夹上，然后点击文件夹名称旁边的图钉图标——您将看到**共享**选项。如果您只看到**固定到顶部**和**共享**，但没有**编辑**和**删除**，这意味着您不是该文件夹的管理员。我们将在本章中介绍文件夹访问级别。以下是从\
    \ Classic 共享报表文件夹的截图：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_56_0.png)\n\n\
    用户可以与**用户、角色、角色及下属或公共组**共享文件夹，并具有**查看者**、**编辑者**和**管理者**的访问级别。查看以下与其他用户共享报表的截图：\n\
    \n![](img/72d01bea5a9ccf02f9452aab7505d9de_57_0.png)\n\n要共享报表文件夹，用户必须满足以下条件：\n\
    \n- 对该报表文件夹具有**管理者**访问级别。\n- 拥有“管理公共文件夹中的报表”权限。\n\n> 当您创建文件夹时，您会自动被设置为该文件夹的**管理者**。\n\
    \n报表和仪表板文件夹有三种访问级别，如下表所示：\n\n| 查看者 | 编辑者 | 管理者 |\n|---|---|---|\n| • 在文件夹树中查看文件夹<br>•\
    \ 查看所有内容<br>• 运行报表，刷新仪表板 | • 拥有**查看者**访问权限的所有权限，以及以下权限：<br>• 编辑文件夹的所有内容<br>• 向文件夹添加内容<br>•\
    \ 从文件夹删除内容 | • 拥有**编辑者**访问权限的所有权限，以及以下权限：<br>• 编辑文件夹名称<br>• 编辑/删除/移除共享 |\n\n###\
    \ 共享报表文件夹的动手练习\n\n现在，让我们逐步说明如何共享报表文件夹。\n\n用例：您想将 `My First Report Folder` 文件夹共享给一个角色为\
    \ CEO 的用户，访问级别为**查看者**，并共享给一名财务经理，我们将其命名为 **Jack Fin**，作为文件夹的**管理者**（您可以使用其他用户名进行此练习）。假设角色\
    \ CEO 存在，并且已经创建了一个名为 `Jack Fin` 的用户。\n\n1. 导航到**报表**选项卡。\n2. 点击之前创建的报表文件夹 `My\
    \ First Report Folder`，将鼠标悬停在报表文件夹名称上，点击图钉图标，然后点击**共享**：\n\n   ![](img/72d01bea5a9ccf02f9452aab7505d9de_58_0.png)\n\
    \n3. 这将打开一个弹出窗口；点击**角色**链接，然后点击 CEO 旁边的**共享**按钮。将访问菜单保留为**查看者**，然后点击**完成**按钮继续。\n\
    4. 接下来，点击“用户”链接，搜索 Jack Fin。点击该用户旁边的“共享”按钮。默认访问级别为“查看者”；点击其旁边的箭头，选择“管理者”。现在点击“完成”按钮继续，如下面的截图所示：\n\
    \n   ![](img/72d01bea5a9ccf02f9452aab7505d9de_59_0.png)\n\n5. 点击“关闭”按钮关闭窗口。\n\n\
    在此动手练习中，您学习了如何与具有“管理者”访问级别的用户以及角色中的用户共享报表文件夹以查看报表。\n\n## 报表权限\n\n当我们在本章前面讨论报表和仪表板文件夹时，您可能已经注意到我们谈到了创建报表、创建报表文件夹等权限。权限是控制用户在\
    \ Salesforce 中执行操作（包括报表和仪表板）能力的基本设置。\n\n在我们开始创建报表之前，我们将讨论一些权限，这些权限决定了用户在 Salesforce\
    \ 中运行、创建、编辑、导出、计划以及订阅报表的能力。\n\n### 运行报表\n\n这是运行报表所需的基本权限。如果没有“运行报表”权限，您将无法在 Salesforce\
    \ 中运行任何报表。当您尝试点击报表时，您会收到一条错误消息，提示“您没有运行报表的权限。”请检查您是否拥有“运行报表”用户权限，如下面的截图所示：\n\n"
