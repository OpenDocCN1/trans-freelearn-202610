    # Tips on Custom Report types


    To fully make use of a custom report type with less maintenance, here are a few
    tips you should be aware of as an admin when implementing a report type:


    +   - When new fields are created in an object, scan through all the existing
    report types if the new fields added need to be added to that report type.

    +   - Always using a name that reflects what the content and filter of the report
    type are. In the exercise discussed earlier in this chapter, we used **Customers
    with/without Claims with/without Payment** as the name, which explains what the
    primary object is and how it relates to the child object.

    +   - Always add a meaningful **Description**. The description is mandatory and
    it will be visible to users who create reports.

    +   - Custom report types are added to the bottom of the Report Category. If you
    are the one who creates the report type, alert your users with the permission
    to create a report.

    +   - Remember to change the report type status to **Deployed**; otherwise, your
    users will not see the report when built; refer to the *Hands-on exercise for
    creating a Custom Report type, section*.

    +   - If the current report type needs to have a significant change, such as adding
    or editing object relationships, it is advisable to clone the report type to a
    new one so it will not affect existing reports built with that report type.

    +   - Change the field section folder name when needed. By default, the section
    folder name will follow the object name. This name will appear in the report builder,
    so when you change it from the report type setup, the section folder name will
    change in the report builder too.

    +   - Hide the unused report type easily (the standard and custom report type)
    so your user is not confused by so many report types. Some of them may no longer
    be needed, which you can delete after being hidden for a few months provided you
    are sure they are not used in active reports.'
