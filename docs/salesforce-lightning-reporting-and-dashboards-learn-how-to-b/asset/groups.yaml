  - '[PAGE 160]


    # # Categorizing data in reports


    In *Chapter 4, Creating and Managing Reports*, we used the **Summary format**
    to group reports into multiple levels with available fields. The report generated
    will be shown in groups, with the number of groups depending on the values returned
    for the field used for grouping. This means that if there is no value returned
    in the report, that value will not be shown in the grouping at all. For example,
    if you group by month, you may see that some months are missing if there are no
    records for those months.


    How about if we need to categorize multiple values of a field into one category?
    Creating a formula field with a `CASE()` function may be a solution, but think
    about how often that formula field will be used, or will that formula field be
    used for one report only? Is the category standard for the entire organization
    or only for a report? Furthermore, only the system admin will be able to create
    the formula field.


    If the answer is only for one or a very small number of reports and not standard
    for the whole organization, then creating a new formula field is not a good solution;
    furthermore, there is a maximum number of formula fields that you can create in
    an object. Bucket fields come into the picture for both these scenarios.


    # # Bucket fields


    So what is a bucket field? It is an incredibly powerful functionality offered
    by Salesforce in reporting. It lets you quickly categorize values for a field
    in a report without the need to have a custom formula field at the object level.
    When you create a bucket field, you define multiple categories into groups depending
    on the record values; this bucket field will not affect other reports or the object
    itself.


    For example, you have the following values in the **Account Type**:


    +   - **Prospect**

    +   - **Customer - Direct**

    +   - **Customer - Channel**

    +   - **Channel Partner / Reseller**

    +   - **Installation Partner**

    +   - **Technology Partner**

    +   - **Other**'
  - '[PAGE 161]


    You need to categorize all account types containing Customer as **Customer**,
    all **Account Type** containing Partner as **Partner**, all **Account Type** containing
    Prospect as **Prospect**, and the rest as **Other**. Using a bucket field, you
    will get a new field without having to create a custom formula field in the Account
    just for this purpose. For this scenario, the bucket field will contain the following
    values:


    +   - **Prospect**

    +   - **Customer**

    +   - **Partner**

    +   - **Other**


    These values will be available only for the particular report configured.


    Bucket fields are available in most report formats: **Tabular**, **Summary**,
    and **Matrix**. However, the **Joined** report does not support bucket fields.
    When you change the report format to another format, the bucket fields will stay.
    If you have a report with bucket fields, then change the report format into a
    Joined report and bucket fields will be removed.


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_161_0.png)


    You can add up to five bucket fields in a report. Each bucket field can contain
    up to 20 buckets.


    You can use the following field types as a source for the bucket field:


    +   - **Number, Currency, Percent**

    +   - **Picklist**

    +   - **Text**

    +   - **Lookup**


    This includes the **Formula** field and the **Roll-Up Summary** field, which return
    the field type as shown earlier.


    The following field types cannot be used as the source field for a bucket field:


    +   - **Date and Date/Time--Although this is not supported in bucket fields, you
    can still get a concept similar to bucket fields using the Group By feature discussed
    in Summary and Matrix reports**

    +   - **Checkbox--You can create a custom formula field that returns 1 or 0 or
    a custom formula field that returns the text Yes/No or True/False and use that
    custom formula field in your Bucket field**

    +   - **Email**'
