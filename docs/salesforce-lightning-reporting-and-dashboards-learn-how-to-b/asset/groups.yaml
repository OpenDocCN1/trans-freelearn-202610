  md: "\n16. Click on Save from the drop-down arrow to save all changes in the report.\
    \ With this, you can save the report without the need to edit it from report builder:\n\
    \n![](img/72d01bea5a9ccf02f9452aab7505d9de_98_0.png)\n\n## The Matrix report format\n\
    \nThe Matrix report is pretty similar to the Summary report, but with the additional\
    \ capability to group by both rows and columns. You also can have up to two levels\
    \ of grouping for both rows and columns.\n\nSimilar to the Tabular and Summary\
    \ report format, you can add summarizable fields in Matrix reports. By default,\
    \ the record count is added into the report matrix. When you add the summary field\
    \ in the Matrix report, the field and summary will be shown in the matrix, not\
    \ at the bottom of the column as in the Summary or Tabular report format. Once\
    \ you add a summary field to the Matrix report, you can remove the default record\
    \ count from the matrix if you don't need it.\n\nThis report's format is good\
    \ when you have large amounts of data to summarize and need to compare records\
    \ with different values in the same field with the Matrix report. The Matrix report,\
    \ without at least one row and one column grouping, will be shown as a Summary\
    \ report when you run the report.\n\nYou can change from the **Tabular** or **Summary**\
    \ report to the **Matrix** report when you change a report from **Summary** to\
    \ **Matrix** format:\n\n- First-level grouping will automatically become first-level\
    \ row grouping\n- Second-level grouping will automatically become first-level\
    \ column grouping\n- Third-level grouping will automatically become second-level\
    \ row grouping\n\nIn the following example, we use the same summary format report\
    \ created earlier in **All Account by creation Year and owner**; the report shows\
    \ the same data and criteria used--just in a different format. Note that the record\
    \ count is added by default when you create a **Matrix** report. The following\
    \ screenshot shows us a **Matrix** report converted from **Summary** format report:\n\
    \n![](img/72d01bea5a9ccf02f9452aab7505d9de_99_0.png)\n\n## Hands-on exercise for\
    \ creating a Matrix report\n\nLet's consider a use case: showing the record count\
    \ for all accounts in a **Matrix** format, row grouping by Account creation for\
    \ **Calendar Year**, and column grouping by **Account Owner**:\n\n- 1. Instead\
    \ of creating it from scratch, let's modify the existing **Summary** report `All\
    \ Account by creation Year and owner` and convert it into a **Matrix** report.\n\
    - 2. Open the **All Account by creation Year and owner** report and click on **Edit**\
    \ button or navigate to **Reports** tab, look for the report, click on the arrow\
    \ in the last column, and then click on **Edit** to open report builder.\n- 3.\
    \ Change the report format from **Summary** to **Matrix**.\n- 4. The first group\
    \ of the summary report will automatically become row grouping, while the second\
    \ group will become column grouping; in our exercise, **Created Date** will be\
    \ a row grouping and **Account Owner** will be a column grouping.\n\nLet's take\
    \ a look at the following screenshot and notice that the first-level and second-level\
    \ grouping of the Summary report has been transformed:\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_100_0.png)\n\
    \nWhen the report format changes from **Summary** to **Matrix** report:\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_101_0.png)\n\
    \n5. Since this report was originally saved as a Summary report, you can just\
    \ click on the Run Report button to see the report result in a Matrix format.\
    \ In Lightning Experience, a report needs to be saved before you are able to run\
    \ it:\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_101_1.png)\n\n6. If you just\
    \ need to see the report summary without any detail, click on the gear icon next\
    \ to the refresh icon (not the topmost gear icon with lightning inside the gear)\
    \ and then uncheck the Details checkbox. Often, we need to do this when we present\
    \ the report and want to focus on the summary only, without the need to see the\
    \ details, as shown in the following screenshot:\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_102_0.png)\n\
    \n7. Here is the report result which just shows the summary based on Created Date\
    \ and Account Owner in a Matrix format:\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_102_1.png)\n\
    \n- 8. If you click on **Save** from here, this will overwrite your **Summary**\
    \ report created earlier. So instead of clicking on Save, click on **Clone** to\
    \ save the report as a new report, enter the new report name, select the folder,\
    \ and then click on the **Create** button in the pop-up window to confirm.\n-\
    \ 9. Alternatively, when you are in report builder in step 5, instead of clicking\
    \ on the **Run Report** button to run the report, click on the **Save As** button\
    \ to store the report as a new report.\n\n## Hands-on exercise for adding a Summary\
    \ field to Matrix reports\n\nLet's consider a use case: showing all opportunities\
    \ with the total amount in a **Matrix** format, row grouping by **Opportunity\
    \ Stage**, and column grouping by **Opportunity Owner**:\n\n- 1. Navigate to the\
    \ **Reports** tab and click on the **New Report** button.\n- 2. Select the **Opportunities**\
    \ Report Type and click on the plus sign under the **Opportunities** category.\n\
    - 3. Click on the **Create** button to continue.\n- 4. Change **Show** to **All\
    \ opportunities**.\n- 5. Change the **Date Field** range to **All Time**.\n- 6.\
    \ Note that the **Opportunity Status** and **Probability** filters are next to\
    \ **Show**; these specific filters are there only when we use the **Opportunity**\
    \ Report Type. For this exercise, just leave the default value **Any** for **Opportunity\
    \ Status** and **All** for **Probability**.\n- 7. Change the report format from\
    \ **Tabular** to **Matrix**.\n\n8. Remove all fields by dragging and dropping\
    \ them out to the Fields area except for Opportunity Name, Amount, Stage, and\
    \ Opportunity Owner fields. Now you should see something similar to what is shown\
    \ in the following screenshot:\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_104_0.png)\n\
    \n9. To sum the amount, hover your mouse over the Amount header, click on the\
    \ arrow icon in Summarize this Field..., select Sum, and click on the Apply button\
    \ as shown in the following screenshots:\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_104_1.png)\n\
    \n![](img/72d01bea5a9ccf02f9452aab7505d9de_105_0.png)\n\nIf the field you would\
    \ like to summarize is not added to the report yet, you can drag the summarizable\
    \ fields (such as the currency, number, and percentage) directly into the matrix,\
    \ and the system will prompt you to summarize by Sum, Average, Max, or Min.\n\n\
    You can change the field order added to the matrix by dragging and dropping the\
    \ summarized field. To remove the summarized field from the matrix, you can just\
    \ simply drag it out to the field area in the left-hand side panel.\n\n- 10. Now\
    \ you should see the amount and its value in a matrix; refer to the screenshot\
    \ in Step 11.\n- 11. Drag **Stage** as the row grouping and **Opportunity Owner**\
    \ as the column grouping as shown in the following screenshot:\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_105_1.png)\n\
    \n- 12. Note that you can drag another field as a level 2 grouping for both the\
    \ row and column grouping.\n- 13. As we just want to focus on the summary value,\
    \ let's hide the report detail by clicking on **Show** next to the **Remove All\
    \ Columns** link and then unchecking **Detail**.\n\n- 14. Next, let's also remove\
    \ the record count as we just need the amount value. Click on **Show** again next\
    \ to the **Remove All Columns** link and then uncheck **Record Count**. Remember\
    \ that we can only remove the record count when a field has been added as the\
    \ summarized field in the matrix.\n\n- 15. Click on the **Save** button; this\
    \ will open a pop-up window to save the report:\n  - Enter **Report Name** as\
    \ `Opportunity by Stage and Owner`\n  - **Report Unique Name** will be auto-filled\n\
    \  - It is always a good practice to enter some **Description** for future reference\n\
    \  - Select **My Personal Custom Reports** in **Report Folder**, so no one can\
    \ access it\n  - Click on the **Save** button to save the report\n\n- 16. Click\
    \ on **Run Report**, and you should see a report similar to the following report:\n\
    \n| OPPORTUNITY OWNER | ALVIN LEE | JOHAN YU | Total |\n|---|---|---:|---:|---:|\n\
    | **STAGE** | **AMOUNT Sum** | **AMOUNT Sum** | **AMOUNT Sum** |\n| Prospecting\
    \ | $0.00 | $80,000.00 | $80,000.00 |\n| Qualification | $0.00 | $115,000.00 |\
    \ $115,000.00 |\n| Needs Analysis | $675,000.00 | $0.00 | $675,000.00 |\n| Value\
    \ Proposition | $0.00 | $330,000.00 | $330,000.00 |\n| Id. Decision Makers | $0.00\
    \ | $110,000.00 | $110,000.00 |\n| Perception Analysis | $0.00 | $120,000.00 |\
    \ $120,000.00 |\n| Proposal/Price Quote | $270,000.00 | $100,000.00 | $370,000.00\
    \ |\n| Negotiation/Review | $395,000.00 | $0.00 | $395,000.00 |\n| Closed Won\
    \ | $0.00 | $3,716,000.00 | $3,716,000.00 |\n| **Total** | **$1,340,000.00** |\
    \ **$4,571,000.00** | **$5,911,000.00** |\n"
  mdcn: "\n\n16. 点击下拉箭头中的“保存”以保存报表中的所有更改。通过这样操作，你可以在不通过报表生成器编辑的情况下保存报表：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_98_0.png)\n\
    \n## 矩阵报表格式\n\n矩阵报表与汇总报表非常相似，但增加了按行和列同时分组的能力。你还可以为行和列分别设置最多两个分组级别。\n\n与表格和汇总报表格式类似，你可以在矩阵报表中添加可汇总字段。默认情况下，记录计数会添加到报表矩阵中。当你在矩阵报表中添加汇总字段时，该字段和汇总结果会显示在矩阵中，而不是像汇总或表格报表格式那样显示在列底部。一旦向矩阵报表添加了汇总字段，如果不需要，可以移除矩阵中的默认记录计数。\n\
    \n当你有大量数据需要汇总，并且需要使用矩阵报表比较同一字段中不同值的记录时，此报表格式非常适用。如果矩阵报表至少没有一个行分组和一个列分组，在运行报表时它将显示为汇总报表。\n\
    \n当你将报表从 **Summary** 更改为 **Matrix** 格式时，可以从 **Tabular** 或 **Summary** 报表更改为 **Matrix**\
    \ 报表：\n\n- 第一级分组将自动变为第一级行分组\n- 第二级分组将自动变为第一级列分组\n- 第三级分组将自动变为第二级行分组\n\n在以下示例中，我们使用之前创建的相同汇总格式报表\
    \ **All Account by creation Year and owner**；报表显示使用相同的数据和条件——只是格式不同。请注意，当你创建 **Matrix**\
    \ 报表时，记录计数会默认添加。以下屏幕截图向我们展示了从 **Summary** 格式报表转换而来的 **Matrix** 报表：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_99_0.png)\n\
    \n## 创建矩阵报表的动手练习\n\n让我们考虑一个用例：在 **Matrix** 格式中显示所有账户的记录计数，按 **Calendar Year**\
    \ 的账户创建日期进行行分组，按 **Account Owner** 进行列分组：\n\n- 1. 不要从头创建，让我们修改现有的 **Summary**\
    \ 报表 `All Account by creation Year and owner` 并将其转换为 **Matrix** 报表。\n- 2. 打开 **All\
    \ Account by creation Year and owner** 报表并点击 **Edit** 按钮，或导航到 **Reports** 选项卡，找到该报表，点击最后一列的箭头，然后点击\
    \ **Edit** 以打开报表生成器。\n- 3. 将报表格式从 **Summary** 更改为 **Matrix**。\n- 4. 汇总报表的第一个分组将自动变为行分组，而第二个分组将变为列分组；在我们的练习中，**Created\
    \ Date** 将成为行分组，**Account Owner** 将成为列分组。\n\n让我们看一下以下屏幕截图，注意汇总报表的第一级和第二级分组已被转换：\n\
    \n![](img/72d01bea5a9ccf02f9452aab7505d9de_100_0.png)\n\n当报表格式从 **Summary** 更改为\
    \ **Matrix** 报表时：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_101_0.png)\n\n5.\
    \ 由于该报表最初保存为汇总报表，你只需点击“运行报表”按钮即可以矩阵格式查看报表结果。在 Lightning Experience 中，报表需要在运行前保存：\n\
    \n![](img/72d01bea5a9ccf02f9452aab7505d9de_101_1.png)\n\n6. 如果你只需要查看报表汇总而不查看任何明细，点击刷新图标旁边的齿轮图标（不是顶部带闪电的齿轮图标），然后取消选中“详细信息”复选框。通常我们在展示报表且只想关注汇总而不需查看明细时需要这样做，如以下屏幕截图所示：\n\
    \n![](img/72d01bea5a9ccf02f9452aab7505d9de_102_0.png)\n\n7. 这是仅显示基于创建日期和账户所有者的汇总的报表结果，以矩阵格式呈现：\n\
    \n![](img/72d01bea5a9ccf02f9452aab7505d9de_102_1.png)\n\n- 8. 如果你在此处点击 **Save**，这将覆盖你之前创建的\
    \ **Summary** 报表。因此，不要点击保存，而是点击 **Clone** 将报表另存为新报表，输入新的报表名称，选择文件夹，然后在弹出窗口中点击\
    \ **Create** 按钮进行确认。\n- 9. 或者，当你在步骤 5 的报表生成器中时，不要点击 **Run Report** 按钮运行报表，而是点击\
    \ **Save As** 按钮将报表另存为新报表。\n\n## 向矩阵报表添加汇总字段的动手练习\n\n让我们考虑一个用例：在 **Matrix** 格式中显示所有商机及其总金额，按\
    \ **Opportunity Stage** 进行行分组，按 **Opportunity Owner** 进行列分组：\n\n- 1. 导航到 **Reports**\
    \ 选项卡并点击 **New Report** 按钮。\n- 2. 选择 **Opportunities** 报表类型并点击 **Opportunities**\
    \ 类别下的加号。\n- 3. 点击 **Create** 按钮继续。\n- 4. 将 **Show** 更改为 **All opportunities**。\n\
    - 5. 将 **Date Field** 范围更改为 **All Time**。\n- 6. 请注意，**Opportunity Status** 和 **Probability**\
    \ 过滤器位于 **Show** 旁边；这些特定过滤器仅在使用 **Opportunity** 报表类型时出现。对于此练习，只需将 **Opportunity\
    \ Status** 的默认值保留为 **Any**，将 **Probability** 保留为 **All**。\n- 7. 将报表格式从 **Tabular**\
    \ 更改为 **Matrix**。\n\n8. 通过将其拖放到“字段”区域外，移除所有字段，只保留商机名称、金额、阶段和商机所有者字段。现在你应该看到与以下屏幕截图类似的内容：\n\
    \n![](img/72d01bea5a9ccf02f9452aab7505d9de_104_0.png)\n\n9. 要对金额求和，将鼠标悬停在金额标题上，点击“汇总此字段...”中的箭头图标，选择\
    \ Sum，然后点击“应用”按钮，如以下屏幕截图所示：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_104_1.png)\n\
    \n![](img/72d01bea5a9ccf02f9452aab7505d9de_105_0.png)\n\n如果要汇总的字段尚未添加到报表中，可以直接将可汇总字段（如货币、数字和百分比）拖入矩阵，系统将提示你按\
    \ Sum、Average、Max 或 Min 进行汇总。\n\n你可以通过拖放已汇总的字段来更改添加到矩阵中的字段顺序。要从矩阵中移除已汇总的字段，只需将其拖到左侧面板的字段区域即可。\n\
    \n- 10. 现在你应该在矩阵中看到金额及其值；请参考步骤 11 中的屏幕截图。\n- 11. 将 **Stage** 拖为行分组，将 **Opportunity\
    \ Owner** 拖为列分组，如以下屏幕截图所示：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_105_1.png)\n\
    \n- 12. 请注意，你可以为行分组和列分组分别拖入另一个字段作为第二级分组。\n- 13. 由于我们只想关注汇总值，让我们通过点击 **Remove All\
    \ Columns** 链接旁边的 **Show**，然后取消选中 **Detail** 来隐藏报表明细。\n\n- 14. 接下来，让我们也移除记录计数，因为我们只需要金额值。再次点击\
    \ **Remove All Columns** 链接旁边的 **Show**，然后取消选中 **Record Count**。请记住，只有在矩阵中添加了字段作为汇总字段时，我们才能移除记录计数。\n\
    \n- 15. 点击 **Save** 按钮；这将打开一个弹出窗口以保存报表：\n  - 输入 **Report Name** 为 `Opportunity\
    \ by Stage and Owner`\n  - **Report Unique Name** 将自动填充\n  - 为便于将来参考，输入一些 **Description**\
    \ 始终是良好做法\n  - 在 **Report Folder** 中选择 **My Personal Custom Reports**，这样无人可以访问它\n\
    \  - 点击 **Save** 按钮保存报表\n\n- 16. 点击 **Run Report**，你应该会看到与以下报表类似的报表：\n\n| OPPORTUNITY\
    \ OWNER | ALVIN LEE | JOHAN YU | Total |\n|---|---|---:|---:|---:|\n| **STAGE**\
    \ | **AMOUNT Sum** | **AMOUNT Sum** | **AMOUNT Sum** |\n| Prospecting | $0.00\
    \ | $80,000.00 | $80,000.00 |\n| Qualification | $0.00 | $115,000.00 | $115,000.00\
    \ |\n| Needs Analysis | $675,000.00 | $0.00 | $675,000.00 |\n| Value Proposition\
    \ | $0.00 | $330,000.00 | $330,000.00 |\n| Id. Decision Makers | $0.00 | $110,000.00\
    \ | $110,000.00 |\n| Perception Analysis | $0.00 | $120,000.00 | $120,000.00 |\n\
    | Proposal/Price Quote | $270,000.00 | $100,000.00 | $370,000.00 |\n| Negotiation/Review\
    \ | $395,000.00 | $0.00 | $395,000.00 |\n| Closed Won | $0.00 | $3,716,000.00\
    \ | $3,716,000.00 |\n| **Total** | **$1,340,000.00** | **$4,571,000.00** | **$5,911,000.00**\
    \ |\n\n"
