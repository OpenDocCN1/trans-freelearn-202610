    ![](img/72d01bea5a9ccf02f9452aab7505d9de_78_0.png)


    # The Edit My Dashboards permission


    We mentioned the Edit My Reports permission in an earlier section. Edit My Dashboards
    is a similar kind of permission, but for dashboards. It allows users to edit,
    move, save, and delete dashboards created by them in public dashboard folders.


    When a user has access to the folder, the user is able to save a dashboard to
    that folder. The user access to that folder is only as Viewer. The user is also
    able to edit and delete reports created by themselves in a public dashboard folder
    where the user has Viewer access.


    This permission should not be given to standard users, as it will allow the user
    to overwrite dashboards created by other users; access is given to that dashboard
    folder which has access only as Viewer.'
  - '[PAGE 79]


    # The View Dashboards in Public Folders permission


    The **View Dashboards in Public Folders** permission gives the user visibility
    and access to all dashboards stored in the public dashboard folders even if the
    user is not listed in the sharing access for that particular dashboard folder.


    Similar to the **Edit My Dashboards** permission, this permission is also not
    supposed to be given to a normal end user.


    # The Manage Dashboards in Public Folders permission


    The **Manage Dashboards in Public Folders** permission requires permissions to
    **Create Dashboard Folders, View Dashboards in Public Folders, and Edit My Dashboards**.
    With this permission, users are able to access and edit all dashboards stored
    in public dashboard folders.


    On top of that, this permission also allows users to share, edit, and delete any
    public dashboard folder. So, this is a very powerful permission.


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_79_0.png)


    Be careful to give this permission only to users who absolutely need it. Make
    sure users with this permission will not mess up dashboards created by other users.


    # Applying permission


    Now you''ve understood that the ability to run a report, create a report, export
    a report, create a dashboard, and so on is controlled by permissions--only users
    granted with these permissions are able to perform such activities, as we discussed
    in the previous sections.


    Securing a report or dashboard means to make sure the report or dashboard is accessible
    only to users that should have access; some users may just need to be able to
    run a report, but not to modify it. This is controlled in the folder that stores
    the report or dashboard instead of the report or dashboard itself. Managers of
    the folder are able to configure and share the folder with other users, and determine
    their access level.'
  - '[PAGE 80]


    Earlier in this chapter, we also mentioned that there are many types of permissions
    related to report and dashboard folders. With additional permission, a user will
    be able to access all reports (except private reports and private dashboards),
    even if the user is not added to the group accessibility. As admin, you should
    make sure just to grant permissions to users that need it.


    Here is the difference assigning permissions through **Profile** and **Permission
    Set**:


    +   - **Profile**: All users within the profile will get the permission enabled
    for the profile. This is a good option when you need to grant a permission to
    all users in the same profile, such as permission to run a report.

    +   - **Permission Set**: The admin can create a permission set with one permission
    only, or with multiple permissions. This is a more flexible option when you need
    to grant certain permissions to users across profiles, such as permission to create
    report folders--you may not want everyone to be able to create folders, which
    could make your report folders messy if not controlled.


    # Hands-on exercise for adding permission in a Profile


    In this exercise, we are going to grant **Create and Customize Reports** permission
    to a custom **Profile** called **Sales Ops**. Assume that the profile has been
    created earlier.


    +   1. Click on the **Setup** gear icon in the top-left menu, as shown in the
    following screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_80_0.png)


    +   2. Click on **Users** from the left menu, then on the **Profiles** submenu.'
