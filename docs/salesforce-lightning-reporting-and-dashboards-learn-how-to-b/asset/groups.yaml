    name. Alternately, you can open the dashboard and then click on the Edit button.


    2. Click on the gear icon; if you hover your mouse over, the label is called Edit
    Dashboard Properties.


    3. Under View Dashboard As, at this moment, Me should be selected.


    4. Change this to The logged in user, and select Allow dashboard viewers to change
