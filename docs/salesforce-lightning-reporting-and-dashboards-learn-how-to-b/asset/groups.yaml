    \ fields available to use in a report; it may have all or some fields from one\
    \ object or from a few related objects.\n\nAlthough **Tabular** is the simplest\
    \ format, it offers many abilities for you to sort data by columns, adding filters,\
    \ summarizing fields, adding a bucket field, record count, exporting reports,\
    \ subscribe report, and so on. All of these features are also true for **Summary**\
    \ and **Matrix** reports. The focus on a **Tabular** report is on letting you\
    \ see the details of each record that meets your filter criteria, similar to a\
    \ spreadsheet.\n\nLet's look at the limitations of the **Tabular** format:\n\n\
    - No grouping\n- No chart\n- Not used as the data source for a dashboard unless\
    \ the **Row Limit** filter is configured\n\nOther limitations related to the **Tabular**\
    \ format are as follows:\n\n- The report builder preview shows a maximum of 50\
    \ rows.\n- Reports display a maximum of 2,000 rows. To view all the rows, export\
    \ the report to Excel.\n\nThe **Tabular** report format has the best performance\
    \ figures when generating reports. Here is a sample of a **Tabular** report:\n\
    \n![](img/72d01bea5a9ccf02f9452aab7505d9de_87_0.png)\n\n## Hands-on exercise for\
    \ creating a Tabular report\n\nLet's consider a use case. We are tasked with showing\
    \ the first five accounts, sorted by the number of employees in descending order,\
    \ and filtering with account Type contains Customer. In this exercise, we assume\
    \ that you have more than five accounts with Type contains Customer text exists,\
    \ and the number of employees is populated:\n\n+   1. Navigate to the **Reports**\
    \ tab and click on **New Report..** button.\n+   2. Select the **Accounts** Report\
    \ Type and click on the plus sign under the **Accounts & Contacts** category.\n\
    +   3. Click on the **Create** button to continue.\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_88_0.png)\n\
    \n4. Now we are in the **Report Builder**, with the preview showing a limited\
    \ number of records.\n"
  mdcn: "\n\n+   3. 查找配置文件名称——在本练习中，我们将使用 Sales Ops 配置文件（在你的环境中可能不同）——然后在配置文件名称前点击\
    \ Edit 链接。\n+   \n+   4. 向下滚动，找到 **Create and Customize Reports** 权限。它位于 **Administrative\
    \ Permissions** 部分下。选中复选框以授予权限。请参考以下截图：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_81_0.png)\n\
    \n+   5. 点击 **Save** 按钮，即完成。\n\n该配置文件中的所有用户现在都能够运行报表。\n\n## 使用权限集进行权限的动手练习\n\n\
    接下来，我们将创建一个名为 **Regional Admin** 的新权限集。拥有此权限集的用户将能够创建报表文件夹和仪表板文件夹。请按照以下步骤进行此练习：\n\
    \n+   1. 点击左上角菜单中的 **Setup** 齿轮图标。\n+   2. 点击左侧菜单中的 **Users**，然后点击 **Permission\
    \ Sets** 子菜单。\n\n6. 在下一个屏幕中，在文本框中输入 create report，系统将搜索包含输入字符的权限，如以下截图所示：\n\n\
    ![](img/72d01bea5a9ccf02f9452aab7505d9de_83_0.png)\n\n7. 点击 Create Report Folders；它将打开该权限，然后向上或向下滚动以点击\
    \ Edit 按钮。\n\n8. 再次找到该权限；勾选其旁边的文本框，如以下截图所示：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_83_1.png)\n\
    \n9. 你可能会注意到有一个信息图标，它告诉你该权限需要另一个权限——在本例中，Create Report Folders 权限是 Create and\
    \ Customize Reports 权限所必需的。因此，Create and Customize Reports 权限将被自动启用到权限集中。\n\n\
    10. 点击 Save 按钮以继续。\n\n11. 点击 **Manage Assignments** 按钮以检查为此权限分配的任何用户。如果想为此权限添加用户，请点击\
    \ **Add Assignments** 按钮。\n\n12. 找到需要此权限集的所有用户；点击用户旁边的复选框，然后点击 **Assign** 按钮，如以下截图所示：\n\
    \n![](img/72d01bea5a9ccf02f9452aab7505d9de_84_0.png)\n\n13. 添加到权限集的用户将被显示，点击 **Done**\
    \ 按钮以结束。\n\n## 总结\n\n在本章中，我们首先从为个人使用保护私有报表和仪表板开始。然后，我们继续讨论 **Unfiled Public Report**\
    \ 文件夹，其中具有创建报表权限的用户能够在此文件夹中存储创建的报表。此文件夹的一个用途是在真正的文件夹创建之前临时存储报表，但请注意，存储在此处的报表将可供组织中的每个人访问。\n\
    \n接下来，我们继续讨论共享和保护公共报表和仪表板。报表文件夹和仪表板文件夹相关的所有权限也被讨论。\n\n在结束本章之前，我们提供了动手练习，通过 **Profile**\
    \ 授予权限，该权限适用于具有该配置文件的全部用户，以及通过 **Permission Sets** 授予权限，我们可以在用户配置文件之间灵活地授予权限。\n\
    \n## 创建和管理报表\n\n你在第 2 章 *Concepts and Permissions in Reports and Dashboards* 中了解了\
    \ Salesforce 报表的概念。我们学习了如何从数据源生成报表，报表在 Salesforce 中生成时数据如何显示，报表如何在 Salesforce\
    \ 中存储，如何与团队或组织中的每个人共享报表，以及如何获取处理报表所需的权限。在第 3 章 *Implementing Security in Reports\
    \ and Dashboards* 中，我们学习了如何保护我们的报表和仪表板。\n\n在本章中，我们将动手创建报表，讨论处理报表时的更多技术细节，探索在 Salesforce\
    \ 中可以构建哪些类型的报表，以及创建新报表和维护现有报表是多么容易。我们将从 Salesforce 中可用的多种报表格式开始，报表格式为何与报表相关如此重要，以及每种格式的优点和局限性；然后我们将继续讨论向报表添加筛选器。\n\
    \n到本章结束时，你将获得如何根据需求选择正确的报表格式的知识，并学习如何使用报表筛选器自定义报表。\n\n在本章中，我们将提供注释和提示来帮助你理解重要事项。本章将深入涵盖以下主题：\n\
    \n- 选择报表格式\n- 添加报表筛选器\n\n## 选择报表格式\n\n为什么报表格式在创建报表时很重要？每个 Salesforce 报表都是由报表格式构建的，报表格式将决定报表的布局、选项和设置。它还决定报表是否可作为仪表板的数据源。\n\
    \nSalesforce 中有几种报表格式可供使用，从简单的表格报表到复杂的矩阵和联接报表。每种报表格式都有不同的用途和目的。\n\n### 报表格式类型\n\
    \n当你创建新报表时，**Tabular** 是默认选择的报表格式。你可以在任何时候修改报表格式，即使在保存报表之后，但你可能会丢失一些配置项，具体取决于原始和目标报表格式。\n\
    \nSalesforce 中有四种报表格式可用：\n\n- **Tabular**\n- **Summary**\n- **Matrix**\n- **Joined**\n\
    \n让我们分别理解它们。\n\n### 表格报表格式\n\n**Tabular** 报表是在创建新报表时默认的报表格式；此格式被认为是最简单的；它以类似电子表格的方式呈现数据。数据以行和列格式呈现；每一行呈现一条记录，每一列呈现一个字段，列也可以是桶字段或自定义汇总公式。报表可用的字段取决于使用的报表类型。\n\
    \n我们将在 *第 5 章，Understanding Report Types* 中彻底讨论报表类型，而桶字段和自定义汇总公式将在 *第 6 章，Advanced\
    \ Report Configuration* 中讨论。目前，报表类型将决定报表中可用的字段；它可能包含来自一个对象或来自几个相关对象的全部或部分字段。\n\
    \n尽管 **Tabular** 是最简单的格式，但它为你提供了许多能力，例如按列排序数据、添加筛选器、汇总字段、添加桶字段、记录计数、导出报表、订阅报表等。所有这些功能对\
    \ **Summary** 和 **Matrix** 报表也同样适用。**Tabular** 报表的重点是让你查看满足筛选条件的每条记录的详细信息，类似于电子表格。\n\
    \n让我们看一下 **Tabular** 格式的局限性：\n\n- 无分组\n- 无图表\n- 除非配置了 **Row Limit** 筛选器，否则不能用作仪表板的数据源\n\
    \n与 **Tabular** 格式相关的其他局限性如下：\n\n- 报表生成器预览最多显示 50 行。\n- 报表最多显示 2,000 行。要查看所有行，请将报表导出到\
    \ Excel。\n\n**Tabular** 报表格式在生成报表时具有最佳的性能表现。以下是 **Tabular** 报表的示例：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_87_0.png)\n\
    \n## 创建表格报表的动手练习\n\n让我们考虑一个用例。我们被要求显示按员工人数降序排序的前五个账户，并筛选账户类型包含 Customer。在本练习中，我们假设你有超过五个账户，其类型包含\
    \ Customer 文本，并且员工人数已填充：\n\n+   1. 导航到 **Reports** 选项卡并点击 **New Report..** 按钮。\n\
    +   2. 选择 **Accounts** 报表类型并点击 **Accounts & Contacts** 类别下的加号。\n+   3. 点击 **Create**\
    \ 按钮以继续。\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_88_0.png)\n\n4. 现在我们进入了 **Report\
    \ Builder**，预览显示有限数量的记录。\n\n"
