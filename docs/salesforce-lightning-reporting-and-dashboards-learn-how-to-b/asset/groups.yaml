    # # Selecting the report format


    Why is the report format important in creating a report? Each Salesforce report
    is constructed with a report format, and the report format will determine the
    report layout, options, and settings for the report. It also determines whether
    the report can be used as the data source in a dashboard.


    There are a few report formats available in Salesforce, from the simple tabular
    report to the complex matrix and joined report. Each report format has different
    usages and purposes.


    # ## Types of report format


    When you create a new report, **Tabular** is the default report format selected.
    You will able to modify the report format anytime, even after you save the report,
    but you may lose some configured items, depending on the original and target report
    format.


    There are four report formats available in Salesforce:


    +   - **Tabular**

    +   - **Summary**

    +   - **Matrix**

    +   - **Joined**


    Let''s try to understand each of them individually.


    # ## The Tabular report format


    The **Tabular** report is the default report format when you create a new report;
    this format is considered the simplest; it presents data in a manner similar to
    that of a spreadsheet. Data will be presented in the row and column format; each
    row presents one record and each column presents one field, and a column can also
    be a bucket field or a custom summary formula. The availability of fields for
    a report depends on the report type used.


    We will discuss report types thoroughly in *Chapter 5, Understanding Report Types*,
    while bucket field and custom summary formulas will be discussed in *Chapter 6,
    Advanced Report Configuration*. For now, the report type will determine the fields
    available to use in a report; it may have all or some fields from one object or
    from a few related objects.'
  - '[PAGE 87]


    Although **Tabular** is the simplest format, it offers many abilities for you
    to sort data by columns, adding filters, summarizing fields, adding a bucket field,
    record count, exporting reports, subscribe report, and so on. All of these features
    are also true for **Summary** and **Matrix** reports. The focus on a **Tabular**
    report is on letting you see the details of each record that meets your filter
    criteria, similar to a spreadsheet.


    Let''s look at the limitations of the **Tabular** format:


    +   - No grouping

    +   - No chart

    +   - Not used as the data source for a dashboard unless the **Row Limit** filter
    is configured


    Other limitations related to the **Tabular** format are as follows:


    +   - The report builder preview shows a maximum of 50 rows.

    +   - Reports display a maximum of 2,000 rows. To view all the rows, export the
    report to Excel.


    The **Tabular** report format has the best performance figures when generating
    reports. Here is a sample of a **Tabular** report:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_87_0.png)'
