    \ Snapshot** section.\n\n- Optionally, you can enable the email sent to you or\
    \ to other users based on **Public Groups, Roles, Roles and Subordinates,** and\
    \ **Users**. For this exercise, we will select email **To me**.\n\n### Summary\
    \ and schedule\n\nLet us see what we have so far in the following screenshot:\n\
    \n![](img/72d01bea5a9ccf02f9452aab7505d9de_362_0.png)\n\n**Identification**\n\n\
    - Reporting Snapshot Name: Opportunity Snapshot\n- Reporting Snapshot Unique Name:\
    \ Opportunity_Snapshot\n- Description:\n- Running User: Jack Bob\n- Source Report:\
    \ All Opportunity (Snapshot)\n- Group Column: Stage\n- Next Run: 27/05/2017 23:00\n\
    - Last Run: 26/05/2017 23:11\n- Created By: Jack Bob, 24/05/2017 22:24\n- Last\
    \ Modified By: Jack Bob, 24/05/2017 22:26\n- Target Object: Opportunity Snapshot\n\
    \n**Field Mappings**\n\n| Source Report Column | Target Object Field |\n|---|---|\n\
    | Execution Time | Execution Time (Date/Time) |\n| Record Count [Record Count]\
    \ | Record Count (Number(16, 2)) |\n| Reporting Snapshot Running User | Running\
    \ User Id (Text(255)) |\n| Reporting Snapshot Name | Snapshot Name (Text(255))\
    \ |\n| Stage | Stage (Text(25)) |\n| Amount [Sum] | Total Amount (Currency(16,\
    \ 2)) |\n\n**Schedule Reporting Snapshot**\n\n| Frequency | Preferred Start Time\
    \ | Start Time | End Time |\n|---|---|---|---|\n| Every day | 11:00 PM | 24/05/2017\
    \ | 24/06/2017 |\n\nWe have done all the configurations needed to implement a\
    \ **Reporting Snapshot**. After this, what we can do is just wait until the **Preferred\
    \ Start Time**. This is a limitation, as we cannot test straight away. But you\
    \ can run the **Source Report** manually to make sure it shows you the summary\
    \ information you want to collect.\n\nAs we had enabled emailing of **Reporting\
    \ Snapshot**, once the snapshot schedule finishes for the day, we will get an\
    \ email from Salesforce with the subject `Reporting Snapshot: Name - Status -\
    \ Status`. The email content will describe when the snapshot was run, the status\
    \ of the snapshot run, how many records were inserted into the target object,\
    \ the number of failure records, and a link to the **Reporting Snapshot** log.\
    \ Here is a sample of the email:\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_363_0.png)\n"
  mdcn: "\n那么，在 Salesforce 中是否还有其他方式可以存储历史数据，以便我们轻松用于报表？有，如果你使用的是 Salesforce 企业版或更高版本，你可以配置**报表快照**来存储历史数据。\n\
    \n与字段跟踪一样，不要指望在配置**报表快照**之前就能获得旧的历史数据。只有在**报表快照**被正确配置并安排计划后，特定**报表快照**的历史数据才会可用。\n\
    \n每个 Salesforce 版本都有数量有限的**报表快照**可供创建和安排计划，所以请明智使用，或者你可以联系 Salesforce 支持以获取更多数量。\n\
    \n## 配置报表快照\n\n只有拥有**管理报表快照**权限的用户才能创建和配置报表快照。\n\n配置和实施**报表快照**的主要步骤如下：\n\n1.\
    \ **创建源报表**，步骤如下：\n\n   使用**表格**或**摘要**报表格式创建报表。在目标对象中创建的记录数取决于报表格式以及报表结果中返回的记录数。\n\
    \n   对于**表格**报表，它将是一对一的，即报表中的每条记录都将在目标对象中创建一条记录。\n\n   对于**摘要**报表，它可以是**组汇总**或**总计汇总**。**总计汇总**始终在目标对象中只创建一条记录，而**组汇总**会在目标对象中创建多条记录——数量与分组数相同。以下截图显示了**分组级别**的选项：\n\
    \n   **编辑报表快照 — 字段映射**\n\n   **1. 选择源报表汇总分组级别**\n\n   你已选择摘要报表作为源。摘要报表记录可能被分组为一到三个级别。如果你的源报表有多个分组级别，请选择要提取汇总数据所在的分组级别。\n\
    \n   **分组级别**\n\n   - 总计汇总\n   - 分组 1：阶段\n\n   *I = 必填信息*\n\n   ![](img/72d01bea5a9ccf02f9452aab7505d9de_355_0.png)\n\
    \n   每次快照运行最多存储 2000 条记录。\n\n2. 要创建目标对象，请创建一个自定义对象作为目标对象，以存储报表返回的数据。确保目标对象不包含在工作流中。\n\
    \n3. 在目标对象中创建字段：默认情况下，报表快照会提供三项信息，我们可以在目标对象字段中捕获这些信息：报表快照名称、报表快照运行用户和执行时间。创建相似的字段名称是一种好做法，否则将根据源报表创建所表示的数据。你需要创建额外的自定义字段来捕获源报表中收集的数据。\n\
    \n### 创建摘要报表\n\n我们不会逐步介绍如何创建报表，因为前面章节已经详细讲过了。此报表需要采用摘要格式——按阶段分组，添加金额列，并使用求和进行汇总。请看下面的截图，确保你的报表与之类似。\n\
    \n只要运行用户能够访问该报表，你可以将其存储在任何文件夹中。但作为良好实践，请专门为报表快照创建一个新的报表文件夹。\n\n我们将此报表命名为 `Opportunity\
    \ by Stage (for Snapshot)`：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_357_0.png)\n\
    \n### 创建自定义对象\n\n该自定义对象将用于在快照按计划运行时存储所有值。导航到设置 | 对象和字段 | 对象管理器 | 创建 | 自定义对象来创建新对象；我们将该对象命名为\
    \ `Opportunity Snapshot`。将记录名称数据类型设置为自动编号。\n\n### 创建自定义字段\n\n在之前创建的自定义对象中，创建以下字段以存储来自报表和快照运行信息的值，并确保所创建的字段具有正确的字段类型。请参考需要创建的字段的截图：\n\
    \n![](img/72d01bea5a9ccf02f9452aab7505d9de_358_0.png)\n\n在本练习中，我们将捕获组汇总（这由用作源报表的报表定义，该报表为摘要格式），因此我们只需要几个自定义字段来存储汇总信息，在本练习中即记录数和总金额。\n\
    \n但如果你使用**表格**报表作为**源报表**，它将捕获报表详细信息。你可能需要创建更多字段，因为你需要从**表格**报表中捕获数据。报表中的每一行都将在目标快照对象中创建一条记录。\n\
    \n### 创建报表快照\n\n在这里，我们按如下方式定义**报表快照**配置：\n\n1. 导航到**设置 | 功能设置 | 分析 | 报表和仪表板 |\
    \ 报表快照**。\n2. 单击**新建报表快照**按钮。\n3. 输入以下信息：\n   - **报表快照名称：** 我们将其命名为 `Opportunity\
    \ Snapshot`。\n   - **描述：** 这是可选的，但为快照添加描述始终是一种好的做法。\n   - **运行用户：** 该用户将决定快照运行时的数据可见性。\n\
    \   - **报表源名称：** 选择我们在步骤 1 中创建的报表，**按阶段划分的机会（用于快照）**。\n   - **目标对象：** 选择我们在步骤\
    \ 2 中创建的对象，**机会快照**。\n   - 单击**保存**按钮继续。请查看以下截图：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_359_0.png)\n\
    \n### 将字段从源报表映射到目标对象\n\n创建**报表快照**后，单击**字段映射**部分中的**编辑**按钮。\n\n- 选择分组级别为**分组 1：阶段**。\n\
    - **将源报表中的汇总字段映射到目标对象。** 如下面的截图所示：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_360_0.png)\n\
    \n- 单击**保存**按钮继续。\n\n### 安排报表快照计划\n\n创建**报表快照**后，单击**安排报表快照计划**部分中的**编辑**按钮。\n\
    \n- 可选地，你可以启用根据**公共组、角色、角色和下属，**以及**用户**向你或其他用户发送电子邮件。在本练习中，我们将选择电子邮件选项中的**我**。\n\
    \n### 摘要和计划\n\n我们来看一下目前所完成的内容，见下面的截图：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_362_0.png)\n\
    \n**标识**\n\n- 报表快照名称：机会快照\n- 报表快照唯一名称：Opportunity_Snapshot\n- 描述：\n- 运行用户：Jack\
    \ Bob\n- 源报表：所有机会（快照）\n- 分组列：阶段\n- 下次运行：27/05/2017 23:00\n- 上次运行：26/05/2017 23:11\n\
    - 创建者：Jack Bob，24/05/2017 22:24\n- 最后修改者：Jack Bob，24/05/2017 22:26\n- 目标对象：机会快照\n\
    \n**字段映射**\n\n| 源报表列 | 目标对象字段 |\n|---|---|\n| 执行时间 | 执行时间（日期/时间） |\n| 记录数 [记录数]\
    \ | 记录数（数字(16, 2)） |\n| 报表快照运行用户 | 运行用户 ID（文本(255)） |\n| 报表快照名称 | 快照名称（文本(255)）\
    \ |\n| 阶段 | 阶段（文本(25)） |\n| 金额 [求和] | 总金额（货币(16, 2)） |\n\n**安排报表快照计划**\n\n| 频率\
    \ | 首选开始时间 | 开始时间 | 结束时间 |\n|---|---|---|---|\n| 每天 | 晚上 11:00 | 24/05/2017 |\
    \ 24/06/2017 |\n\n我们已经完成了实施**报表快照**所需的全部配置。之后，我们能做的就是等待到达**首选开始时间**。这是一个限制，因为我们无法立即测试。但你可以手动运行**源报表**，以确保它显示你想要收集的汇总信息。\n\
    \n由于我们已启用**报表快照**的电子邮件通知，当天的快照计划完成后，我们将收到来自 Salesforce 的电子邮件，主题为 `Reporting Snapshot:\
    \ Name - Status - Status`。邮件内容将描述快照的运行时间、快照运行的状态、向目标对象插入了多少条记录、失败记录数，以及指向**报表快照**日志的链接。以下是电子邮件示例：\n\
    \n![](img/72d01bea5a9ccf02f9452aab7505d9de_363_0.png)\n"
