    \ screenshot:\n\n## Schedule Dashboard Refresh\n\nThis dashboard refreshes on\
    \ the schedule you set. To send email when the refresh is done, use the Email\
    \ Dashboard option.\n\nRunning User Johan Admin\n\nEmail Dashboard To me To others...\n\
    \nScheduled Refresh\n\nFrequency\n\n- Daily\n- Weekly\n- Monthly\n\n- Every weekday\n\
    - Every day\n\nStart 5/16/2017 [5/16/2017]\n\nEnd 6/16/2017 [5/16/2017]\n\nPreferred\
    \ Start Time 11:00 PM\n\nExact start time will depend on job queue activity.\n\
    \n## Building Dashboards in Lightning Experience\n\nHere is a sample of an email\
    \ delivered along with a dashboard refresh in a schedule:\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_268_0.png)\n\
    \nIf you click the dashboard title from the email, it will open the dashboard\
    \ in the web browser and it should show the same data and refresh date time as\
    \ the email delivered:\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_269_0.png)\n\
    \nFor the dashboard created in Lightning Experience, you will not able to edit\
    \ it in Salesforce Classic - the Edit button will not be visible. The same is\
    \ the case with the dashboard created in Classic; then, you edit and save in Lightning,\
    \ and you can't edit it again in Classic. You should consider cloning the dashboard\
    \ and saving it in Lightning Experience. With this, you can still edit the original\
    \ dashboard in Salesforce Classic when required.\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_269_1.png)\n\
    \nTo check whether all dashboards have been scheduled for auto-refresh, navigate\
    \ to Setup | Monitor | Jobs | Scheduled Jobs (from Classic), or Setup | Environments\
    \ | Jobs | Scheduled Jobs (from Lightning). You can delete the schedule from here.\n\
    \n## Creating your first dashboard\n\nIf you switch from Classic to Lightning,\
    \ a dashboard is one of the things that attract most people to switch to Lightning.\
    \ In Classic, you can have up to three columns for dashboard components, while\
    \ in Lightning, you can have up to nine columns for the components, although the\
    \ maximum number of components for a dashboard stays the same, which is 20.\n\n\
    We have discussed many topics in this chapter or earlier chapters related to creating\
    \ a dashboard, including the following:\n\n- Dashboard permissions\n- Dashboard\
    \ folders and permissions\n- Opening and searching dashboards\n- Navigating a\
    \ dashboard tab\n\nWell, let's start with creating a dashboard.\n\n## Hands-on\
    \ exercise for creating a dashboard\n\nLet's create a dashboard with a component\
    \ showing the number of accounts per sales representative in a horizontal bar\
    \ chart, but before that, we need to create a report for the dashboard component\
    \ data source. Assume you have all permissions required to create a report and\
    \ a dashboard.\n\nCreating a dashboard in Lightning is pretty cool; you just need\
    \ to point and click to build the dashboard. Start with selecting a valid report\
    \ for the dashboard:\n\n- 1. Navigate to the **Reports** tab to create a new report.\n\
    - 2. A report is a basic requirement for a dashboard as it uses it as the data\
    \ source for the dashboard component, so let's create the report:\n  - 1. Click\
    \ on the **New Report** button.\n  - 2. Select the **Accounts** report type by\
    \ clicking on the **Accounts & Contacts** category.\n  - 3. Click on the **Create**\
    \ button to continue.\n  - 4. Select **All accounts** in the **Show** filter.\n\
    \  - 5. Change the **Create Date Range** to **All Time**.\n  - 6. Change the report\
    \ format to **Summary**.\n  - 7. Remove all columns and add only **Account Name**\
    \ to the report.\n- 8. Drag Account Owner to grouping drop zones.\n- 9. Navigate\
    \ to Show | Details to hide record details.\n- 10. Save the report with the name\
    \ Account by Owner to the Unfiled Public Reports folder. The following screenshot\
    \ shows the report created:\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_271_0.png)\n\
    \n- 3. Navigate to the Dashboards tab and click on the New Dashboard button.\n\
    - 4. Enter Name as Account Dashboard.\n- 5. Remove Private Dashboards from the\
    \ folder by clicking on the cross icon and select a public folder; in my case,\
    \ I have a dashboard folder called Company Dashboards.\n- 6. Click on the Create\
    \ button to continue.\n- 7. Now you should see the matrix in nine columns and\
    \ many rows.\n- 8. Click on the + Component button to start adding dashboard components.\n\
    \n11. By default, the component just added will occupy three columns and three\
    \ rows. You can adjust the component to be smaller or bigger; let's change it\
    \ to two columns by three rows. Keep the default component title as it is, which\
    \ is the report title. Consider the following screenshot:\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_273_0.png)\n\
    \n- 15. Click on the **Save** button and then hit the **Done** button.\n- 16.\
    \ Here is our first dashboard:\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_273_1.png)\n\
    \nLet's continue by adding another dashboard component:\n\n- 1. Click on the **Edit**\
    \ button.\n- 2. Click on the **+ Component** button to add another dashboard component.\n\
    - 3. Select the same report created earlier, **Account by Owner**.\n- 4. Now select\
    \ the **Donut** chart.\n- 5. Add All `accounts` for **Subtitle** and `Date = all\
    \ time` for **Footer**.\n- 6. Click on the **Add** button.\n- 7. The new component\
    \ will be added below the existing component; drag it to the right of the existing\
    \ component and keep the size as a 3 x 3 box.\n- 8. Click on the **Save** button\
    \ and then hit the **Done** button; here is what you will see:\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_274_0.png)\n\
    \nIf you hover your mouse over both charts, you will get the details we saw in\
    \ the report.\nLet's analyze this dashboard:\n\n- Click on the chart or expand\
    \ the icon to get a full screen of the chart size.\n- Note the **View Report**\
    \ link; clicking on this link will open the report.\n- Hovering your mouse over\
    \ the chart will get you more information on that chart slice.\n- In this exercise,\
    \ we proved that we can use the same report for more than one component in the\
    \ same dashboard, and we can use it for a different type of chart.\n- Notice this\
    \ under the dashboard title, **As of May 14, 2017 10:22 PM - Viewing as Johan\
    \ Yu.** This means that other users who view the dashboard will see the same as\
    \ the user **Johan Yu**, with data refreshed on **May 14, 2017 10:22 PM**. If\
    \ the object sharing is private, the user will see the dashboard with the data\
    \ set where the user does not have the visibility.\n- A dashboard is not the same\
    \ as a report. When you open a report, it will show the current data, while for\
    \ a dashboard, by default, it will show the data as of the latest refresh. Other\
    \ users will be able to refresh the dashboard by clicking on the **Refresh** button,\
    \ even the user who does not have permission to edit the dashboard. Once refreshed,\
    \ other users will see the dashboard based on the latest refreshed data.\n- When\
    \ other users click on **View Report**, they will see the data as themselves (the\
    \ logged-in user); the report generated is not related to the dashboard viewing\
    \ user anymore; therefore, the number may not be the same as in the dashboard\
    \ data.\n\n## Hands-on exercise for editing and maintaining a dashboard\n\nThere\
    \ are two ways to edit a dashboard:\n\n- Open the dashboard and click on the **Edit**\
    \ button, as shown in the following screenshot:\n"
