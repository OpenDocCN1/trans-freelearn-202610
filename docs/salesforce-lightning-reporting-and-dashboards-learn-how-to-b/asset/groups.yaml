    \ Sum | TOTAL AMOUNT | AMOUNT Sum | TOTAL AMOUNT | AMOUNT Sum | TOTAL AMOUNT |\
    \ AMOUNT Sum | TOTAL AMOUNT |\n| Prospecting | $0.00 |  | $0.00 |  | $80,000.00\
    \ |  | $80,000.00 | $645,000.00 |\n| Qualification | $0.00 |  | $0.00 |  | $100,000.00\
    \ |  | $100,000.00 | $645,000.00 |\n| Id. Decision Makers | $0.00 |  | $50,000.00\
    \ |  | $0.00 |  | $50,000.00 | $645,000.00 |\n| Closed Won | $60,000.00 |  | $0.00\
    \ |  | $85,000.00 |  | $145,000.00 | $645,000.00 |\n| Closed Lost | $270,000.00\
    \ |  | $0.00 |  | $0.00 |  | $270,000.00 | $645,000.00 |\n| Total | $330,000.00\
    \ |  | $50,000.00 |  | $265,000.00 |  | $645,000.00 |  |\n\nThe TOTAL AMOUNT column\
    \ here does not have much meaning; it just copies GRAND TOTAL to TOTAL AMOUNT\
    \ for each stage, while we would like to know the percentage of each Stage compared\
    \ to GRAND TOTAL.\n\n- 2. Edit the report and change the summary formula:\n  -\
    \ Change the format to Percent\n  - Change the formula to AMOUNT:SUM / PARENTGROUPVAL\
    \ (AMOUNT:SUM, ROW_GRAND_SUMMARY, COLUMN_GRAND_SUMMARY)\n\nSo, we are dividing\
    \ Column Total to GRAND TOTAL and showing the percentage. Here is the report:\n\
    \n| CLOSE DATE | APRIL 2016 |  | MAY 2016 |  | JUNE 2016 |  | Total |  |\n| STAGE\
    \ | AMOUNT Sum | TOTAL AMOUNT | AMOUNT Sum | TOTAL AMOUNT | AMOUNT Sum | TOTAL\
    \ AMOUNT | AMOUNT Sum | TOTAL AMOUNT |\n| Prospecting | $0.00 |  | $0.00 |  |\
    \ $80,000.00 |  | $80,000.00 | 12.40% |\n| Qualification | $0.00 |  | $0.00 |\
    \  | $100,000.00 |  | $100,000.00 | 15.50% |\n| Id. Decision Makers | $0.00 |\
    \  | $50,000.00 |  | $0.00 |  | $50,000.00 | 7.75% |\n| Closed Won | $60,000.00\
