    \ **Done** 按钮。\n\n11. 安装完成后，你也会收到电子邮件通知；对于某些较大的软件包，你可能需要等待邮件通知，而不是在屏幕上看到完成状态。\n\
    \n12. 这将带你进入 **Installed Packages** 设置菜单，你将在这里找到该应用：\n\n    ![](img/72d01bea5a9ccf02f9452aab7505d9de_316_0.png)\n\
    \n13. 你可以点击软件包名称 **Salesforce.com CRM Dashboards** 查看软件包详细信息。你可以从这里卸载，或查看软件包组件。让我们点击\
    \ **View Components**。\n\n14. 请注意，该软件包会在多个仪表板文件夹中安装多个仪表板，包括报表，如下面的截图所示：\n\n  \
    \  ![](img/72d01bea5a9ccf02f9452aab7505d9de_316_1.png)\n\n15. 让我们打开一个 **Sales\
    \ Executive Dashboard** 仪表板；你可以使用全局搜索搜索仪表板名称，或转到 **Dashboards** 选项卡查找该仪表板。\n\n\
    4. 将上述报表克隆为一个名为 `Expired Pipeline` 的新报表，将其存储到同一个报表文件夹 **Global Sales** 中，并使用以下内容更新克隆的报表：\n\
    \n   - 将 **Close Date** 筛选器更改为 **All Time**\n   - 添加 **Close Date** 作为 **Field\
    \ filter**，选择操作为 **less than**，筛选值为 **Today**，勾选 **Locked** 以锁定筛选器，然后点击 **OK**\
    \ 按钮\n   - 从分组中移除 **Close Date**，但将其添加到报表中\n   - 保存报表\n\n5. 将 **Expired Pipeline**\
    \ 报表克隆为一个名为 `Won Opportunities (YTD) by Sales Rep` 的新报表，将其存储到同一个报表文件夹 **Global\
    \ Sales** 中，并使用以下内容更新克隆的报表：\n\n   - 将 **Opportunity Status** 更改为 **Closed Won**\n\
    \   - 将 **Close Date** 作为 **Field filter** 的操作更改为 **less or equal**，然后点击 **OK**\
    \ 按钮\n   - 从分组中移除 **Stage**，然后添加 **Opportunity Owner** 作为分组\n   - 保存报表\n\n6. 将\
    \ **Won Opportunities (YTD) by Sales Rep** 报表克隆为一个名为 `Won Opportunities (YTD)\
    \ by Month` 的新报表，并将其存储到同一个报表文件夹 **Global Sales** 中。使用以下内容更新克隆的报表：\n\n   - 从分组中移除\
    \ **Opportunity Owner**，然后添加 **Close Date** 作为分组，将 **Close Date** 分组更改为 **Calendar\
    \ Month**\n   - 保存报表\n\n7. 将 **Won Opportunities (YTD) by Month** 报表克隆为一个名为 `Lost\
    \ Opportunities (YTD)` 的新报表，将其存储到同一个报表文件夹 **Global Sales** 中，并使用以下内容更新克隆的报表：\n\
    \n   - 将 **Opportunity Status** 更改为 **Any**\n   - 添加 **Stage** 作为 **Field filter**，选择操作为\
    \ **equals**，筛选值为 **Closed Lost**，勾选 **Locked** 以锁定筛选器，然后点击 **OK** 按钮\n   - 从分组中删除\
    \ **Opportunity Owner**，然后添加 **Lost Reason** 作为报表分组。**Lost Reason** 是一个自定义选项列表字段；在本练习中，你需要创建这个自定义字段或改用其他字段\n\
    \   - 保存报表\n\n8. 现在，我们在 **Global Sales** 报表文件夹中存储了五个 **Summary** 报表。\n\n让我们使用之前准备的报表再添加几个组件：\n\
    \n1. 添加第三个组件：\n\n   - 使用报表 **Won Opportunities by Sales Rep (YTD)**\n   - 使用的\
    \ **Chart Type** 为 **Horizontal Bar Chart**\n   - 将组件移动到第二个组件右侧\n\n2. 添加第四个组件：\n\
    \n   - 使用报表 **Pipeline for 120 days by Stage**\n   - 使用的 **Chart Type** 为 **Horizontal\
    \ Bar Chart**\n   - 在 **Y-Axis** 上选择 **Close Date**，并选择 **Sort Rows By Label Ascending**\n\
    \   - 由于报表有两个分组，默认情况下图表中也会有两个分组。将图表大小调整为 5x7 个网格。将图表放大是为了在未来几个月更好地可视化销售管道阶段\n\n\
    3. 添加第五个组件：\n\n   - 使用报表 **Expired Pipeline**\n   - 使用的 **Chart Type** 为 **Horizontal\
    \ Bar Chart**\n   - 在 **X-Axis** 上选择 **Record Count**，并选择 **Sort Rows By Label\
    \ Ascending**\n   - 添加 **Subtitle** 为 **This needs to be clean!**，并将 **Footer**\
    \ 设置为 **No record should be here**\n   - 将组件移动到第四个组件右侧，并将图表大小设置为 4x4 个网格\n\n4.\
    \ 添加第六个组件：\n\n   - 使用报表 **Lost Opportunities (YTD)**\n   - 使用的 **Chart Type**\
    \ 为 **Donut**\n   - 将组件移动到第五个组件下方，并将图表大小设置为 2x3 个网格\n\n5. 保存仪表板。\n\n### 让我们看看现在的效果：\n\
    \n![](img/72d01bea5a9ccf02f9452aab7505d9de_321_0.png)\n\n从这个仪表板中，有很多项目需要管理，销售经理需要重点关注和处理：\n\
    \n1. 销售年初至今完成目标的 53%；我们需要再赢得至少 47% 的赢单机会。\n\n2. 三月份和四月份的销售业绩不佳。\n\n3. 为排行榜顶部的销售代表颁发奖金，并为排行榜底部的销售代表提供指导。\n\
    \n![](img/72d01bea5a9ccf02f9452aab7505d9de_323_0.png)\n\n### 添加动态仪表板\n\n将仪表板启用为动态仪表板非常简单，只要您拥有所需的权限，并且尚未用完分配给您组织的动态仪表板数量：\n\
    \n1. 编辑仪表板。\n2. 点击齿轮图标编辑仪表板属性。\n3. 在 **View Dashboard As** 选项中，选择 **The logged-in\
    \ user**，并启用 **Allow dashboard viewers to change this (dynamic dashboard)**。\n\
    4. 保存仪表板。\n\n刷新仪表板，现在您应该会在报表名称下方的 **Viewing as** 旁边看到 **Change** 链接。通过此功能，销售经理可以将仪表板查看者用户更改为经理角色层级下的任何销售代表。\n\
    \n### 总结\n\n本章对本书中的仪表板部分进行了总体收尾。我们首先实现了仪表板筛选器，以便一个仪表板可用于多种场景，而不是为每个条件创建一个仪表板。\n\
    \n接着，我们深入探讨了动态仪表板，了解了它们与普通仪表板的区别，介绍了如何创建动态仪表板，最后讨论了使用动态仪表板的限制。\n\n我们介绍了仪表板中与仪表板筛选器和报表筛选器相关的下钻选项，并解释了如何从\
    \ AppExchange 获取预构建的仪表板，无论是免费的还是付费的。在本章的最后一个主题中，我们从零开始构建了一个完整的示例仪表板，使用了报表、仪表板组件、仪表板筛选器，并启用了动态仪表板。\n\
    \n在下一章中，我们将讨论与报表和仪表板相关的高级技巧和窍门，这些内容可能对您在 Salesforce 中创建出色的分析非常有用。\n\n"
