    \ the grey area would be the report result when using this report type:\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_147_0.png)\n\
    \nIn the preceding figure, A is the Customer object and B is the Claim object.\
    \ The **Customers with Claims** standard report type will be auto-created by the\
    \ system when you relate the objects. This report type will generate reports for\
    \ **Customers with Claim** only, and **Customers without Claim** will not be available\
    \ in the report using the report type. If you need to generate a report to produce\
    \ all customers, you can use the **Customers** report type, but **Claim** fields\
    \ will not be available in the report.\n"
  mdcn: "\n\n## 理解报表类型\n\n删除自定义报表类型将删除使用该报表类型构建的所有现有报表，包括存储在所有用户私有文件夹中的报表。因此在删除报表类型时要谨慎，并确保它不再被使用。\n\
    \n删除自定义报表类型的最佳实践如下：\n\n1. 隐藏报表类型。\n2. 运行报表以检查有多少个活动报表正在使用已识别的报表类型。我们将在本章后面详细讨论这一点。\n\
    3. 将报表类型重命名并加上前缀（例如，加上**待删除**以及今天的日期）。此操作的目的是仅在 *x* 个月后没有活动报表使用时才删除报表类型。\n\n报表类型类别结构与标准报表文件夹非常相似，但不要将两者混淆。\n\
    \n标准报表文件夹包含 Salesforce 原生提供的所有标准报表；你无法覆盖它，但可以修改它并将报表另存为新报表到自定义公共报表文件夹或你的个人报表文件夹。\n\
    \n**报表类型**类别存储所有报表类型，包括标准和自定义报表类型。你可以将自定义报表类型存储到任何**报表类型**类别中，但你无法创建或添加新的**报表类型**类别。\n\
    \n### 隐藏报表类型的动手练习\n\n使用场景：我们可用的报表类型太多，这导致用户在选择使用哪种报表类型以及某些报表类型之间的差异时感到困惑。与其删除自定义报表类型从而自动删除使用该报表类型创建的报表，不如只隐藏不再需要的现有报表类型。\n\
    \n1. 转到**报表**选项卡。\n2. 点击**新建报表**按钮。\n3. 点击**选择要隐藏的报表类型**复选框。\n4. 点击报表类别名称前的 +\
    \ 图标以展开该类别中的所有报表类型。对于本练习，点击**账户与联系人**。\n5. 报表类型带有绿色对勾表示该报表类型在创建新报表时可用，而带有黄色叉号的表示不可用。\n\
    6. 点击报表类型名称可在可见和隐藏之间切换。对于本练习，点击**带资产的联系人**；图标将从绿色对勾变为黄色叉号。基于该报表类型构建的所有现有报表都不会被删除。如果报表类型用作仪表板组件的数据源报表，隐藏报表类型也不会影响仪表板。请考虑以下截图：\n\
    \n![](img/72d01bea5a9ccf02f9452aab7505d9de_141_0.png)\n\n7. 再次点击**选择要隐藏的报表类型**以取消选择；所有被隐藏的报表类型将不再对所有用户在创建新报表时可见。\n\
    \n![](img/72d01bea5a9ccf02f9452aab7505d9de_142_0.png)\n\n### 标准报表类型\n\n当你从**报表**选项卡点击**新建报表**按钮时，你将看到如下截图中所示的**报表类型**类别列表：\n\
    \n![](img/72d01bea5a9ccf02f9452aab7505d9de_142_1.png)\n\n标准报表类型有两种：\n\n- Salesforce\
    \ 为标准对象提供的报表类型，例如**联系人与账户**。你很容易区分这种报表类型，因为在创建新报表时选择该报表类型时会显示**预览**。\n\n  ![](img/72d01bea5a9ccf02f9452aab7505d9de_143_0.png)\n\
    \n- 当你为自定义对象启用**允许报表**选项时自动生成的报表类型。这种报表类型不会有**预览**，而只会显示**无预览可用**。\n\n当你将一个对象关联到另一个对象且两个对象都已启用报表时，具体会发生什么取决于关系类型。在以下示例中，我们将使用\
    \ Customer（自定义对象）作为父对象，Claim（自定义对象）作为子对象。两个对象都已启用报表。让我们更仔细地查看主从关系和查找关系，并看看在建立这些对象之间的关系时报表类型会发生什么。\n\
    \n### 查找关系\n\n当你在对象之间添加查找字段关系时，报表类型相关的行为如下：\n\n- 当你为 Claim 对象激活**启用报表**时，系统将自动创建**索赔**报表类型。\n\
    - 当你以查找关系将**Claim**作为子对象关联到 Customer 对象时，系统会将 Customer 字段添加到 Claims 报表类型中。用户将看到\
    \ Claims 报表类型中可用的额外客户名称字段，但 Customer 对象的其他字段将不可用于报表。Claims 报表类型将包含有或无 Customer\
    \ 的所有索赔记录：\n\n  ![](img/72d01bea5a9ccf02f9452aab7505d9de_144_0.png)\n\n- 现有的**客户**报表类型不会发生变化，因为**Customer**是父对象。\n\
    - 一个名为**带客户的索赔**的新报表类型将在**其他报表**类别中创建。此报表类型将包含**Claim**和**Customer**对象的所有可用字段。\n\
    \n  ![](img/72d01bea5a9ccf02f9452aab7505d9de_145_0.png)\n\n- 此报表类型将仅显示**带客户的索赔**记录；这也意味着没有客户的**索赔**记录将不会出现在生成的报表中。\n\
    \n### 主从关系\n\n当你在对象之间添加主从关系时，报表类型相关的行为如下：\n\n- 当你为 Claim 对象激活**启用报表**时，系统将自动创建**索赔**报表类型。\n\
    - 当你以主从关系将**Claims**作为子对象关联到**Customers**对象时，现有的**Claims**报表类型将被移除，因为**Claim**对象在主从关系中成为\
    \ Customer 对象的子对象。\n- 现有的**Customers**报表类型没有变化，因为 Customer 是父对象。\n- 一个名为**带索赔的客户**的新报表类型将在**其他报表**类别文件夹中创建。请注意与前面讨论的**查找关系**部分中自动创建的报表类型的区别。此报表类型具有**Customer**和**Claim**对象的所有可用字段，并将仅显示**带索赔的客户**；这也意味着没有索赔的**客户**记录将不会出现在生成的报表中：\n\
    \n  ![](img/72d01bea5a9ccf02f9452aab7505d9de_146_0.png)\n\n让我们在矩阵中总结前述关系：\n\n\
    | 描述 | 查找 | 主从关系 |\n|---|---|---|\n| 索赔报表类型 | 无变化，仅添加**客户**字段名 | **索赔**报表类型将被移除\
    \ |\n| 客户报表类型 | 无变化 | 无变化 |\n| 新创建的报表类型 | **带客户的索赔**，包含两个对象的所有字段，仅显示有客户的索赔记录；此处主对象为**索赔**\
    \ | **带索赔的客户**，包含两个对象的所有字段，仅显示有索赔的客户记录；此处主对象为**客户** |\n\n### 自定义报表类型\n\n报表类型定义了报表可用的记录集和字段。报表类型的来源可以仅来自一个对象，也可以包含相关对象。报表类型还决定只有符合报表类型中定义的条件的记录才会在其中显示。\n\
    \n当提供的标准报表类型无法满足你的报表需求时，你的管理员可以创建自定义报表类型。自定义报表类型支持多级对象关系，从父级对象作为主对象定义，并关联到子对象和孙对象，而不是反过来。\n\
    \n让我们看一个例子——你有一个对象关系**客户 > 索赔 > 索赔付款**；在此关系中，你可以构建自定义报表类型**客户**包含**索赔**和**索赔付款**，而不是**索赔付款**包含**索赔**和**客户**。\n\
    \n使用标准报表类型部分中讨论的**客户**和**索赔**对象，在主从关系中，**带索赔的客户**报表类型将被自动创建。参见以下说明；灰色区域将是使用此报表类型时的报表结果：\n\
    \n![](img/72d01bea5a9ccf02f9452aab7505d9de_147_0.png)\n\n在上图中，A 是客户对象，B 是索赔对象。**带索赔的客户**标准报表类型将在你关联对象时由系统自动创建。此报表类型将仅为**带索赔的客户**生成报表，而**无索赔的客户**将无法在报表中使用该报表类型获得。如果你需要生成包含所有客户的报表，可以使用**客户**报表类型，但**索赔**字段将不会在报表中可用。\n\
    \n"
