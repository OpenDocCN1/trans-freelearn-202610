    will return the number of closed opportunities for **Alvin Lee**, which is 2.
    In this exercise one opportunity is **Won** and one opportunity is **Lost**.

    - For **OPPORTUNITY OWNER Johan Yu**, there are five records; the formula will
    return the number of won opportunities for **Johan Yu**, which is 4.

    - For the **GRAND TOTAL**, the total records are nine; the formula will return
    the number of won opportunities in total, which is 5: one opportunity from **Alvin
    Lee** and four opportunities from **Johan Yu**.


    ## Using the MAX() function


    The MAX function is categorized as the Math function; the syntax for this formula
    is MAX(number,number,...).


    This function returns the greatest of all arguments, for example,


    ```

    MAX(Opportunity.Projected_Revenue__c:SUM, AMOUNT:SUM).

    ```


    The same is true with the IF() function explained earlier; you can just point
    and click to get the preceding formula populated. In this sample, we use the opportunity
    report type, and the MAX() function returns the maximum value by comparing the
    sum of a custom field called PROJECTED REVENUE with the sum of AMOUNT. A sample
    report is shown as follows:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_182_0.png)


    Let''s analyze the preceding report; MAX AMOUNT is a summary formula:


    - We set the MAX AMOUNT summary field to display only at the grouping level, and
    that''s why it does not show in GRAND TOTAL

    - Because this is a summary formula, it will not compare the **AMOUNT** value
    with the **PROJECTED REVENUE** value in record level but only compare it in the
    **Summary**

    - For **OPPORTUNITY OWNER** Alvin Lee, **AMOUNT** is greater than **PROJECTED
    REVENUE**, so **MAX AMOUNT** is equal to **AMOUNT**

    - For **OPPORTUNITY OWNER** Johan Yu, **PROJECTED REVENUE** is greater than **AMOUNT**,
    so **MAX AMOUNT** is equal to **PROJECTED REVENUE**.


    ## Function formulas


    There are two functions in Salesforce available only in the summary formula and
    considered the most powerful report formula. They are categorized under the Summary
    functions: `PARENTGROUPVAL` and `PREVGROUPVAL`.


    ### The PARENTGROUPVAL() function


    The `PARENTGROUPVAL()` function returns the value of a specified grouping; the
    grouping level is higher than the formula display level.


    The formula syntax is different depending on the report format:


    - In the **Summary** and **Joined** reports: *PARENTGROUPVAL(summary_field, grouping_level)*

    - In the **Matrix** report: *PARENTGROUPVAL(summary_field, parent_row_grouping,
    parent_column_grouping)*


    ### Using the PARENTGROUPVAL() function in Summary report


    For the **Summary** report, the `PARENTGROUPVAL()` function is not applicable
    when you select the formula displayed as **All summary levels** or **Grand summary
    only**. The only formulas displayed as field grouping can use this function.


    Next, we need to populate the value for both parameters **Summary Fields** and
    grouping level. Let''s start with the grouping level parameter; I''ll tell you
    why I start with grouping level instead of the **Summary Fields** parameter.


