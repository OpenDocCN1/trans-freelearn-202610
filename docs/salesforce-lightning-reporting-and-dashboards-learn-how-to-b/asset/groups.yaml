    \n当打开动态仪表板时，没有**查看我的团队的仪表板**权限的用户将无法更改仪表板查看用户。然而，拥有此权限的用户将能够更改并在角色层级中输入其团队中的用户作为查看用户。拥有**查看所有数据**权限的用户将能够输入任何其他用户作为查看用户。以下截图显示了如何更改仪表板查看者：\n\
    \n![](img/72d01bea5a9ccf02f9452aab7505d9de_66_0.png)\n\n#### 安排仪表板\n\n我们将在 *第\
    \ 9 章，Lightning Experience 中的构建仪表板* 中讨论仪表板，但现在您应该知道，当您打开仪表板时，它不会显示最新数据，而是显示您上次刷新仪表板的数据、您同事刷新过的数据，或安排自动刷新的数据。\n\
    \nSalesforce 为拥有**安排仪表板**权限的用户提供刷新仪表板的能力，刷新次数有限。我将在 *第 9 章，Lightning Experience\
    \ 中的构建仪表板* 中分享更多内容，但现在，只需注意我们可以安排仪表板刷新，并将仪表板通过电子邮件发送给自己或发送给其他用户。\n\n截至 Summer\
    \ ’17 版本，此功能仅在 Classic 中可用，尚未在 Lightning Experience 中提供。\n\n"
