  mdcn: "\n\n13. 点击 **Save** 按钮：\n    - **Report Name** 为 **Top 5 Accounts by Employee**\n\
    \    - **Report Description** 为 **Top 5 Accounts with most number of employees**\n\
    \    - **Report Folder** 为 **Unfiled Public Reports**；这样报告对所有其他用户可见\n\n14. 点击\
    \ **Run Report** 按钮以生成报告：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_128_0.png)\n\
    \n## 按角色层级筛选\n\n对于机会报告，我们有一个额外的报告用于按 **Role Hierarchy** 筛选报告。此筛选器在运行报告时可见，而非在报告构建器中配置报告时可见。\n\
    \n一旦应用筛选器，数据将被筛选以仅显示该角色下用户拥有的机会，包括该角色层级下 **Users** 中的所有用户。\n\n但如果您想筛选特定用户拥有的机会，请通过选择角色然后选择用户来缩小您的\
    \ **Role Hierarchy** 筛选器。以下截图展示了使用 **Role Hierarchy** 筛选机会报告：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_129_0.png)\n\
    \n## 按相对日期筛选\n\n如果您需要报告始终使用特定时间范围进行筛选，例如上个月、本月、上季度等，而不是使用固定日期，您可以选择相对日期选项。使用相对日期时，当您创建一个名为上月赢得机会的报告时，您无需每月手动调整关闭日期。\n\
    \n首先，在配置报告时，您需要将日期字段添加到筛选器放置区，而不是日期字段筛选器中的那个；以下截图展示了在放置区筛选器中添加筛选器：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_130_0.png)\n\
    \n当用户运行报告时，他们也可以在运行时修改此设置：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_131_0.png)\n\
    \n## 通过点击图表筛选\n\n当向报告添加图表时，您是否知道，当您点击图表中的某个细分时，报告将自动使用图表中选定的细分进行筛选？\n\n假设我有一个名为\
    \ **Opportunities by Stage** 的机会报告，并已添加图表。以下截图显示了添加了图表的报告：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_132_0.png)\n\
    \n## 锁定筛选器\n\n在报告构建器中向报告添加筛选器时，确定按钮前有一个锁定复选框。这决定了运行报告的用户在查看报告时编辑或删除筛选器的能力。请考虑以下截图：\n\
    \n![](img/72d01bea5a9ccf02f9452aab7505d9de_134_0.png)\n\n当筛选器被锁定后，它们将显示在锁定筛选器区域下，运行报告的用户将无法编辑或删除它们。请考虑以下截图：\n\
    \n![](img/72d01bea5a9ccf02f9452aab7505d9de_134_1.png)\n\n## 总结\n\n在本章中，我们对在 Salesforce\
    \ 平台上使用报告时组件有了更深入的了解。我们探讨了不同类型的报告格式，并查看了每种格式类型的独特性。我们看到了向报告添加筛选器是多么容易。为了进一步自定义报告，我们可以为\
    \ **Tabular** 报告包含 **Filter Logic**、**Cross Filter** 和 **Row Limit**。\n\n尽管本章多次提及仪表板，但我们并未详细讨论它们。仪表板将在\
    \ *第 9 章 Lightning Experience 中的构建仪表板* 及以后深入讨论。本章完全专注于报告。\n\n在下一章中，我们将详细讨论报告类型，查看报告类型为何如此重要，以及如何创建报告，正如您在本章中多次阅读到关于报告类型的介绍。\n\
    \n## 5. 了解报告类型\n\n您已在第 4 章 创建和管理报告 中学习了创建和管理报告。在该章中，我们讨论了选择正确的报告格式以确定报告布局的重要性，并讨论了如何添加报告筛选器、筛选逻辑、交叉筛选和行限制以获得所需的报告结果。\n\
    \n您在前几章中多次阅读到关于报告类型的介绍。在本章中，我们将深入讨论报告类型，从报告类型类别、标准报告类型、自定义报告类型开始，最后通过几个动手练习来创建自定义报告类型、扩展自定义报告类型并通过创建新报告来应用它们。本章还将分享使用自定义报告类型的益处和局限性。\n\
    \n到本章结束时，您将了解报告类型是什么，在创建新报告时需要了解报告类型的哪些知识，如何创建自定义报告类型，以及如何从自定义报告类型中受益。报告类型设置用户界面在\
    \ Lightning 和 Classic 中相同，因此本章中的所有截图都适用于两种用户界面。\n\n在本章中，我们将提供注释和提示以帮助您理解重要事项。以下主题将被涵盖：\n\
    \n- Report Type introduction\n- Report Type category\n- Standard report type\n\
    - Custom report type\n\n### Report Type introduction\n\n如前几章所述，每个报告都需要基于一个报告类型构建：\n\
    \n- 什么是报告类型？\n- 我们如何检查现有报告使用的报告类型？\n- 当我们创建新报告时，选择正确的报告类型有多重要？\n\n所有这些问题都将在本章中得到解答。\n\
    \nSalesforce 报告，包括所有标准报告和自定义报告，都是基于报告类型构建的。报告类型是报告的基础。一旦报告创建完成，您就无法更改报告类型，但如果您有许多需要更改报告类型的报告，您可以聘请开发人员或顾问为您编写脚本，但我们不会在本手册中讨论这些高级主题。目前，如果您需要更改报告类型，您需要将其重新创建为新报告。\n\
    \n报告类型定义了基于主对象和定义的关联对象之间的关系可用于报告的记录集和字段。理想情况下，维护报告类型，包括报告类型的创建、编辑和删除，应属于 Salesforce\
    \ 管理员的工作范围，而非标准用户。作为系统管理员，您需要考虑可部署并供用户使用的报告类型的数量。提供过多的报告类型会导致用户在选择使用哪个报告类型以及它们之间的区别时感到困惑，因此请确保根据需要进行平衡。\n\
    \n当自定义对象启用报告时，Salesforce 将自动创建报告类型，其报告类型名称等于对象的复数名称，并且该报告类型将存储在其他报告类别文件夹中。\n\n\
    ![](img/72d01bea5a9ccf02f9452aab7505d9de_137_0.png)\n\n要将自定义对象用于报告类型，请确保为该对象选择启用报告。\n\
    \n为了更轻松地理解报告类型，让我们举一个例子——我们有一个名为 Expense 的自定义对象，其复数标签为 Expenses，您也可以使用其他自定义对象进行测试。该对象有一个指向\
    \ Opportunity 的查找关系字段，并且已激活启用报告和跟踪字段历史。让我们快速查看自定义对象设置中的详细信息：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_138_0.png)\n\
    \n导航到 **Reports** 选项卡并创建新报告；您将看到已创建与 **Expense** 相关的自定义报告类型或多个报告类型：\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_138_1.png)\n\
    \n您可以输入报告类型名称进行快速搜索。\n\n在我的组织中，在搜索文本框中输入 **expense** 会筛选出与 Expense 对象相关的四个报告类型。您的组织中可能有所不同，因此如果您看不到相同的结果也没关系，但您应该至少看到一个报告类型。让我们分析我组织中的这四个报告类型：\n\
    \n- **Expenses**：此报告类型将包含与 Expense 对象相关的所有字段\n- **Expenses with Opportunity**：此报告类型是自动创建的，因为在我的组织中，Expense\
    \ 对象有一个指向 Opportunity 对象的查找字段\n- **Expenses and Connections**：此报告类型是创建的，因为在我的组织中，我已配置\
    \ Salesforce to Salesforce 连接\n- **Expense History**：此报告类型是创建的，因为已激活 **Track Field\
    \ History**；请参阅前面的截图\n\n### 报告类型类别\n\n报告类型类别存储并以文件夹形式呈现。这有助于我们在创建新报告时快速找到正确的报告类型。根据您订阅的\
    \ Salesforce 版本，您将获得不同的报告类型类别。\n\n您无法创建新的报告类型类别，但您可以创建自定义报告类型并将其存储在提供的类别之一中；始终是一个好做法将自定义报告类型存储在正确的类别中。\n\
    \n多年来，您可能创建了太多报告类型，但其中许多很少使用或仅使用一次；作为管理员，您可以删除这些报告类型或在创建新报告时将其从用户选择中隐藏；这包括标准和自定义报告类型。\n\
    \n以下是隐藏和删除报告类型的比较：\n\n| 操作 | 删除 | 隐藏 |\n|---|---|---|\n| 恢复报告类型 | 不可能 | 只需取消隐藏即可\
    \ |\n| 现有报告 | 全部删除 | 无影响 |\n| 开始位置 | **Setup** 菜单 | **Reports** 选项卡 |\n| 适用于 |\
    \ 自定义报告类型 | 所有报告类型 |\n\n就个人而言，我更喜欢隐藏而不是删除自定义报告类型，以防将来某天需要该报告类型或被现有报告使用。\n\n"
