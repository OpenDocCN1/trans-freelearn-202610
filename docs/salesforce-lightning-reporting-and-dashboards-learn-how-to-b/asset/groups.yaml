  - '[PAGE 135]


    # Summary


    In this chapter, we became more familiar with components when working with reports
    on the Salesforce platform. We explored the different types of report formats
    and looked at the uniqueness of each type of format. We saw how easy it is to
    add filters to a report. To customize the reports further, we can include **Filter
    Logic**, **Cross Filter**, and **Row Limit** for a **Tabular** report.


    Although we kept made many passing references to dashboards many times in this
    chapter, we did not discuss them in detail. Dashboards will be discussed in depth
    in *Chapter 9, Building Dashboards in Lightning Experience* onward. This chapter
    is completely focussed on reporting only.


    In the next chapter, we will discuss report types in detail, look at why the report
    type is so important, and also look at how to create a report, as you have read
    about report types so many times in this chapter.'
  - '[PAGE 136]


    # 5


    # Understanding Report Types


    You learned about creating and managing reports in Chapter 4, Creating and Managing
    Reports. In that chapter, we discussed how important it is to select the correct
    report format that determines report layout, and we also discussed how to add
    report filters, Filter logic, Cross Filter, and Row Limit to get the report result
    required.


    You read about report type many times in previous chapters. In this chapter, we
    will discuss report types in depth, starting with the report type category, standard
    report type, custom report type, and end with a few hands-on exercises to create
    custom report types, extend custom report types, and apply them by creating new
    reports. In this chapter, we will also share the benefits and limitations when
    using custom report types.


    By the end of this chapter, you will gain knowledge on what a report type is,
    what you need to know about report types when creating a new report, how to create
    a custom report type, and how to benefit from custom report type. The report type
    setup user interface is the same for both Lightning and Classic, so all screenshots
    in this chapter are applicable to both user interfaces.


    Throughout this chapter, we will provide notes and tips to help you understand
    important items. The following topics will be covered:


    +   - Report Type introduction

    +   - Report Type category

    +   - Standard report type

    +   - Custom report type'
  - '[PAGE 137]


    # Report Type introduction


    As mentioned in earlier chapters, each report needs to be built on a report type:


    +   - What is a Report Type?

    +   - How do we check the Report Type used in an existing report?

    +   - How important is it to select the correct report type when we create a new
    report?


    All of these questions will be covered in this chapter.


    Salesforce reports, including all standard reports and custom reports, are built
    on a report type. A report type is the foundation of a report. Once the report
    is created, you cannot change the report type, but if you have many reports that
    need to change the report type, you can engage a developer or consultant to write
    a script for you, but we will not discuss these advanced topics in this book.
    For now, if you need to change the report type, you need to recreate it as a new
    report.


    The Report Type defines the set of records and fields available to a report based
    on the relationships between a primary object and the related objects defined.
    Ideally, to maintain report type; including report type creation, edit, and delete
    should fall under the Salesforce admin job scope, not the standard user. As a
    system admin, you need to think about the number of report types deployable and
    available for the user to use. Too many report types available will cause your
    user to get confused as which report type to use and what the difference is between
    each of them, so make sure that you balance it as required.


    When a custom object is enabled for a report, Salesforce will auto-create a report
    type with Report Type Name equal to the Plural Name of the object name, and this
    report type will be stored in the Other Reports category folder.


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_137_0.png)


    To use a custom object for a report type, make sure that you select Enable Reports
    for the object.


    In order to understand report types easily, let''s have an example--we have a
    custom object called Expense with Plural Label Expenses, you can use other custom
    objects too for testing. The object has a Lookup relationship field to Opportunity,
    and it has also been activated for Enable Reports and Track Field History. Let''s
    have a quick look at the details in the Custom Object setup:'
  - '[PAGE 138]


    # Understanding Report Types


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_138_0.png)


    Navigate to the **Reports** tab and create a new report; you will see that a custom
    report type or multiple report types related to **Expense** has been created:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_138_1.png)


    You can type in the report type name for a quick search.'
  - '[PAGE 139]


    In my organization, typing **expense** in the search text box filter four report
    types related to the Expense object. It may differ in your org., so it is okay
    if you do not see the same result, but you should see at least one report type.
    Let''s analyze the four report types in my org.:


    +   - **Expenses**: This report type will contain all fields related to the Expense
    object

    +   - **Expenses with Opportunity**: This report type is automatically created
    because in my organization I have a Lookup field to Opportunity from the Expense
    object

    +   - **Expenses and Connections**: This report type was created because in my
    organization, I have configured Salesforce to Salesforce connection

    +   - **Expense History**: This report type is created as **Track Field History**
    is activated; refer to the preceding screenshot


    # Report type categories


    Report type categories are stored and presented in folders. This will help us
    find the right report type quickly when creating a new report. Depending on the
    Salesforce edition you subscribe to, you will get different report type categories.


    You cannot create a new report type category, but you can create a custom report
    type and store it in one of the categories provided; it is always a good practice
    to store a custom report type in the right category.


    Over the years, you may have too many reports types created, but many of them
    are seldom used or are only used once; as an admin, you can delete these report
    types or hide them from the user selection when creating a new report; this includes
    both standard and custom report types.


    Here is a comparison between hiding and deleting the report type:


    | Action | Delete | Hide |

    |---|---|---|

    | Restore report type | Not possible | Just unhide it |

    | Existing reports | All delete | No effect |

    | Start from | **Setup** menu | **Reports** tab |

    | Applicable to | Custom report type | All report types |


    Personally, I prefer to hide rather than delete custom report types just in case
    the report type is needed one day in the future or used by existing reports.'
