    the window, then click on the Setup link. This will open the Setup page in a new
    tab of the web browser.


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_38_0.png)


    In the left panel, there are many links for you to configure Salesforce. These
    links can be categorized into three main categories: ADMINISTRATION, PLATFORM
    TOOLS, and SETTINGS. Each category has many menus. For each menu, start with arrow
    >, click on the menu to open the submenu.


