    # Creating Reporting Snapshots


    This is where we define the **Reporting Snapshots** configuration as follows:


    +   1. Navigate to **Setup | Feature Settings | Analytics | Reports & Dashboards
    | Reporting Snapshots**.

    +   2. Click on the **New Reporting Snapshot** button.

    +   3. Enter the following information:

    +      - **Reporting Snapshot Name:** Let us name it `Opportunity Snapshot`

    +      - **Description:** This is optional, but it is always a good practice to
    put a description for the snapshot

    +      - **Running User:** This user will determine data visibility when the snapshot
    is run

    +      - **Report Source Name:** Selects the report we created in Step 1, **Opportunity
    by Stage (for Snapshot)**

    +      - **Target Object:** Selects the object we have created in Step 2, **Opportunity
    Snapshot**

    +      - Click on the **Save** button to continue. Check the following screenshot:


