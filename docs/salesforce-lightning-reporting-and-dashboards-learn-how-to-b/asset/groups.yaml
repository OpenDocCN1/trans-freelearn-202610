    ![](img/72d01bea5a9ccf02f9452aab7505d9de_231_0.png)


    Favorites are similar to bookmarks in a web browser but better because your favorites
    are available no matter which device or browser you use to log into in Lightning
    Experience. So, each user will have their own list of favorites.


    ## Hands-on exercise for adding an item to favorites


    Let''s consider a use case: because you always deal with reports, specifically
    a report called **Opty by Stage (2016 H1)**, add the reports tab and the report
    as a **Favorite**.


    You can add the **Reports** tab as a favorite item by following these steps:


    - 1. Click on the **Reports** tab.

    - 2. Click on the star icon.

    - 3. The system will pop up with the "**Reports**" was added to your favorites
    message. Consider the following screenshot:

    - 4. Once added, confirm that it has been added by clicking on the arrow next
    to the star in the favorite icon. Refer the following screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_232_0.png)


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_232_1.png)


    - 5. Now you should see **Reports** with the report icon under **MY FAVORITES**.

    - 6. If you click on **Reports** from here, it is the same as you clicking on
    the **Reports** tab.

    - 7. You can rename or delete it by clicking on the **Edit Favorites** link.


    Instead of just adding the **Reports** tab as a favorite, you can add an individual
    report as a favorite too. Let''s follow these steps:


    - 1. Open an existing report. In my case, I will open a report called **Opty by
    Stage (2016 H1)**.

    - 2. Click on the star icon.

    - 3. The system will pop up with the "**Opty by Stage (2016 H1)**" was added to
    your **favorites** message.

    - 4. Click on the arrow next to the star in the favorite icon, and you should
    see that **Opty by Stage (2016 H1)** is added to **MY FAVORITES** as shown in
    the following screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_233_0.png)


    Once **Reports** is added into favorites, it will be listed under **MY FAVORITES**
    of the **Reports** tab too. Instead of clicking on the **Reports** tab, click
    on the arrow next to the **Reports** tab to show reports in **MY FAVORITES** and
    **RECENT RECORDS** for recently opened reports. Consider the following screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_234_0.png)


    This step can be applied to **Dashboards**, **Account**, or any other records
    and tabs. The items added to favorites will be shown as **MY FAVORITES** in the
    object tab too. This is shown in the following screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_234_1.png)


    But if you hit the *Enter* button or click on the magnifying glass, the system
    will show all results on the Search Results page as shown in the following screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_236_0.png)


    - 6. **Chart:** Click on this to add or hide or change a chart in a report. We
    discussed charts in depth in *Chapter 7, Adding Charts in Reports and Pages.*

    - 7. **Filter:** Click on the icon to hide or show the filter panel, denoted by
    number 7 in the preceding screenshot.

    - 8. **Collaborate:** This will be visible only if **Chatter Feed Tracking** for
    report is enabled, we will discuss **Chatter Feed Tracking** for collaboration
    in *Chapter 11, Advanced Tips and Tricks for Reports and Dashboards.*

    - 9. **Refresh:** Click on the icon to refresh the data shown in the report, denoted
    by number 9 in the preceding screenshot.

    - 10. **Settings:** To show/hide the report result, the options available here
    will depend on the report format.

    - 11. **The action button:** If a user has more than one permission for the report
    open, there will be an arrow next to the button, and this button will include
    **Edit**, **Clone**, **Save**, **Subscribe**, **Export**, and **Delete**.


    ## Summarizing fields


    When your report has summarized fields configured in a report and **GRAND TOTAL**
    (under **Settings**) is enabled, all summarized fields will be shown next to the
    report title:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_238_0.png)

