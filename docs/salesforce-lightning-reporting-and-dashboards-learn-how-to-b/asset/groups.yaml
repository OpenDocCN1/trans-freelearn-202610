  - '[PAGE 98]


    16. Click on Save from the drop-down arrow to save all changes in the report.
    With this, you can save the report without the need to edit it from report builder:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_98_0.png)


    # The Matrix report format


    The Matrix report is pretty similar to the Summary report, but with the additional
    capability to group by both rows and columns. You also can have up to two levels
    of grouping for both rows and columns.


    Similar to the Tabular and Summary report format, you can add summarizable fields
    in Matrix reports. By default, the record count is added into the report matrix.
    When you add the summary field in the Matrix report, the field and summary will
    be shown in the matrix, not at the bottom of the column as in the Summary or Tabular
    report format. Once you add a summary field to the Matrix report, you can remove
    the default record count from the matrix if you don''t need it.


    This report''s format is good when you have large amounts of data to summarize
    and need to compare records with different values in the same field with the Matrix
    report. The Matrix report, without at least one row and one column grouping, will
    be shown as a Summary report when you run the report.'
  - '[PAGE 99]


    You can change from the **Tabular** or **Summary** report to the **Matrix** report
    when you change a report from **Summary** to **Matrix** format:


    +   - First-level grouping will automatically become first-level row grouping

    +   - Second-level grouping will automatically become first-level column grouping

    +   - Third-level grouping will automatically become second-level row grouping


    In the following example, we use the same summary format report created earlier
    in **All Account by creation Year and owner**; the report shows the same data
    and criteria used--just in a different format. Note that the record count is added
    by default when you create a **Matrix** report. The following screenshot shows
    us a **Matrix** report converted from **Summary** format report:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_99_0.png)'
  - '[PAGE 100]


    # # Hands-on exercise for creating a Matrix report


    Let''s consider a use case: showing the record count for all accounts in a **Matrix**
    format, row grouping by Account creation for **Calendar Year**, and column grouping
    by **Account Owner**:


    +   1. Instead of creating it from scratch, let''s modify the existing **Summary**
    report `All Account by creation Year and owner` and convert it into a **Matrix**
    report.

    +   2. Open the **All Account by creation Year and owner** report and click on
    **Edit** button or navigate to **Reports** tab, look for the report, click on
    the arrow in the last column, and then click on **Edit** to open report builder.

    +   3. Change the report format from **Summary** to **Matrix**.

    +   4. The first group of the summary report will automatically become row grouping,
    while the second group will become column grouping; in our exercise, **Created
    Date** will be a row grouping and **Account Owner** will be a column grouping.


    Let''s take a look at the following screenshot and notice that the first-level
    and second-level grouping of the Summary report has been transformed:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_100_0.png)


    When the report format changes from **Summary** to **Matrix** report:'
  - '[PAGE 101]


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_101_0.png)


    5. Since this report was originally saved as a Summary report, you can just click
    on the Run Report button to see the report result in a Matrix format. In Lightning
    Experience, a report needs to be saved before you are able to run it:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_101_1.png)'
