    # Embedding a report chart in an object page


    Wouldn’t it be nice if you could present in the chart all opportunities for an
    account, directly on the Account page and group by Opportunity Stage? The same
    is having a chart showing tickets raised by the account related to Customer Support
    on the Account page, or for other custom objects. This is a great feature out-of-the-box
    from Salesforce for embedding report charts into standard or custom object pages.'
