    如果启用了**报告的 Chatter 动态跟踪**，那么所有能够打开报告的用户都可以看到此图标。要启用此功能，请导航到**设置 | 功能设置 | 动态跟踪**，在左侧面板中找到**报告**并勾选**启用动态跟踪**。


    默认情况下，它将具有**帖子**和**投票**用于协作。其他所有 **Chatter** 帖子也是如此；您可以使用 @ 后接用户名来提及他人。其他用户可以**点赞**、**评论**和**收藏**该帖子，而对于在
    **Chatter** 动态中发帖的用户，该用户还可以**删除**和**编辑**该帖子。


    ## 报告设置


    对于**矩阵**和**汇总**报告，用户可以选择显示或隐藏--**详细信息**、**小计**、**总计**和**记录数**。考虑下面的截图：


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_241_0.png)


    对于**表格式**报告，选项仅限于显示或隐藏**详细信息**和**总计**。考虑下面的截图：


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_242_0.png)


    在**汇总**和**矩阵**报告中隐藏**记录数**时，它也会在顶部被隐藏。隐藏**总计**将同时隐藏报告底部以及顶部标题下方的值。**小计**仅适用于**汇总**和**矩阵**报告，这完全合理，因为**表格式**报告中没有小计。


    ## 操作按钮


    以下是在已打开报告中可以执行的完整操作。考虑下面的截图：


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_242_1.png)


