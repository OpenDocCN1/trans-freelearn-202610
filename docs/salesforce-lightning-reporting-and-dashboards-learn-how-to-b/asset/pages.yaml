    # Summary


    In this chapter, we started with securing private reports and dashboards for personal
    usage. Then, we continued to discuss the **Unfiled Public Report** folder, where
    users with permission to create reports are able to store the reports created
    in this folder. One of the purposes of this folder is to store the report temporarily
    before the real folder is created, but please note that reports stored here will
    be accessible by everyone in your organization.


    Next, we continued with sharing and securing public reports and dashboards. All
    permissions related to the report folders and dashboard folders were discussed
    as well.


    Before ending the chapter, we provided hands-on exercises to grant permissions
    through **Profile**, which is for all users with the profile, and to grant permissions
    via **Permission Sets**, where we have the flexibility to grant permission across
    user profiles.'
