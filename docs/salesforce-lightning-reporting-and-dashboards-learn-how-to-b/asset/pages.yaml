- pgno: 156
  md: '5. There are three fields added by default when you select this report type--
    **Customer Name, Claim Name, Claim Payment Name**. The following screenshot shows
    that there are three fields checked. So, if you would like to add more default
    fields, for example, **Policy: Status**, double-click on the field and select
    the **Checked by Default** checkbox. Consider the following screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_156_0.png)


    6. We do not plan to store this report, so we can just ignore the report builder
    from here. However, if you would like to save the report, feel free to save it
    to your personal report folder.


    # Limitations and benefits of Custom Report types


    As we went through this chapter, we can make use of custom report types for the
    following:


    +   - Filtering the report result related to the child object

    +   - Extending the report with look fields from the parent object

    +   - Hidden fields will not be available for the report

    +   - Setting default fields added when creating a new report


    Here are some limitations when implementing a custom report type:


    +   - A custom report type can contain up to 60 object references.

    +   - You can add up to 1,000 fields to each custom report type.

    +   - The maximum report type name length is 50 characters, including spaces.'
  merge: -1
  img_proc: true
- pgno: 157
  md: '+   - There are a few standard fields not available for the custom report type,
    such as **Product Schedule** fields, the **Age** field on cases and opportunities,
    and so on.

    +   - If you add fields after the report type created to an object related to
    the report type, the new fields added will not be available by default for the
    report type. The admin needs to manually add these fields to the report type.

    +   - You can associate up to four level of object relationships for a report
    type, where each level containing one object only.


    # Tips on Custom Report types


    To fully make use of a custom report type with less maintenance, here are a few
    tips you should be aware of as an admin when implementing a report type:


    +   - When new fields are created in an object, scan through all the existing
    report types if the new fields added need to be added to that report type.

    +   - Always using a name that reflects what the content and filter of the report
    type are. In the exercise discussed earlier in this chapter, we used **Customers
    with/without Claims with/without Payment** as the name, which explains what the
    primary object is and how it relates to the child object.

    +   - Always add a meaningful **Description**. The description is mandatory and
    it will be visible to users who create reports.

    +   - Custom report types are added to the bottom of the Report Category. If you
    are the one who creates the report type, alert your users with the permission
    to create a report.

    +   - Remember to change the report type status to **Deployed**; otherwise, your
    users will not see the report when built; refer to the *Hands-on exercise for
    creating a Custom Report type, section*.

    +   - If the current report type needs to have a significant change, such as adding
    or editing object relationships, it is advisable to clone the report type to a
    new one so it will not affect existing reports built with that report type.

    +   - Change the field section folder name when needed. By default, the section
    folder name will follow the object name. This name will appear in the report builder,
    so when you change it from the report type setup, the section folder name will
    change in the report builder too.

    +   - Hide the unused report type easily (the standard and custom report type)
    so your user is not confused by so many report types. Some of them may no longer
    be needed, which you can delete after being hidden for a few months provided you
    are sure they are not used in active reports.'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# Summary


    In this chapter, we went through report types in detail and explored why a report
    type is so important when building a report. We also saw that the system will
    autogenerate a new report type for a custom object when you enable an object for
    the report.


    There are two well-known types of relationships in Salesforce: Lookup and Master-Detail
    for when you relate an object to another object. We discussed how this will affect
    report types. We shared how to extend fields from the parent object and also remove
    fields not available for the user to use in the report.


    Lastly, we shared the benefits and limitations of using a custom report type and
    realized that one of the limitations is that most people will experience that
    when new fields are added, they will be not available in the report type. The
    admin needs to manually add them and while using a standard report type, all fields
    for the objects will be auto-added when new fields are added.


    In the next chapter, we will discuss more advanced features related to reports,
    including the custom summary formula, bucket fields, adding a chart to a report,
    adding a chart to a page layout, and scheduling a report.'
  merge: -1
