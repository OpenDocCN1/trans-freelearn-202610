- pgno: 25
  md: 'The following are a few cloud products offered by Salesforce right now:


    +   - **Sales Cloud**: Sales Cloud automates your sales process

    +   - **Service Cloud**: Service Cloud delivers an evolutionary customer service
    process

    +   - **Marketing Cloud**: Marketing Cloud gains from digital marketing automation

    +   - **Community Cloud**: Community Cloud connects with your customer and partner

    +   - **Wave Analytic**: Wave Analytic delivers analytics for business users and
    analysts

    +   - **App Cloud**: App Cloud allows you to build an app for your business needs

    +   - **IoT Cloud**: IoT Cloud is to store and process **Internet of Things (IoT)**
    data for connected devices

    +   - **Commerce Cloud**: The Commerce Cloud enables you to build a unified shopping
    experience


    As Salesforce keeps acquiring and building new products, the preceding list may
    change anytime.


    In short, these are the advantages of using Salesforce as compared to other on-premise
    applications:


    +   - Faster implementation schedule

    +   - Lower maintenance cost since you don''t have to buy or support in-house
    servers, and maintain resources for it

    +   - Scalability and robustness

    +   - Secure and high performance

    +   - Easy to expand the functionality using prebuilt solutions from AppExchange

    +   - Accessible from desktops, laptops, tablet, and mobile apps

    +   - Enterprise-level grade application for small and medium business


    # # Salesforce Lightning Experience


    Lightning Experience is a modern, fast, and beautiful user interface designed
    to help your sales users to be more productive and efficient. It is built with
    a sales-centric mindset, focusing on helping sales representatives work more naturally
    on a daily basis. With Lightning Experience, your users will get an intuitive
    and intelligent user interface.'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'Lightning Experience is built with proven Salesforce1 Mobile App technology.
    Your sales representatives already use mobiles to enter prospective customers,
    log tasks and notes after client meetings, run reports and dashboards, and more.
    All this cool stuff from the mobile experience is being brought into the computer
    web browser by Lightning Experience.


    # Let''s get the right term


    On many occasions, Lightning Experience is simply referred to as Lightning, although
    there are many items in the Salesforce platform which start with the word "Lightning",
    such as Lightning Login, Lightning App Builder, Lightning for Outlook, Lightning
    Components, Lightning Sync, and so on. Some of them are applicable in Lightning
    Experience only, but some others will work in both Lightning Experience and older
    Classic user interfaces, for example, Lightning Sync is used to sync your user
    contacts and events between your email server with Salesforce.


    Just to make it clear, when you meet someone from the Salesforce community, and
    he asks if you are on lightning, most probably, he is referring to Lightning Experience.
    To get the term right, it is Lightning, not Lightening or Lighting.


    # What was before the Lightning Experience?


    If you noticed, we mentioned the term classic user interface in the *Let’s get
    the right term* section. Yes, that is the one—Salesforce Classic had been serving
    well for many years before Lightning Experience was introduced. Salesforce Classic
    still exists, and is widely used by many customers, but mostly, the new features
    introduced by Salesforce in recent releases are only applicable for Lightning
    Experience.


    If you are still with Classic, Salesforce urges you to migrate to Lightning. Why
    do I use the term migrate? Because the user interface is totally different, and
    some of your existing customizations may not work, such as the JavaScript button
    built by your Salesforce partner or your IT team. You should consult with your
    Salesforce Success Manager, partners, or IT before making the decision.


    Because the user interface is totally different from Classic, your user manual,
    training video and material, and so on, need to be updated, so plan this journey
    with proper project management to roll out Lightning Experience.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# Let''s turn the Lightning Experience on


    This section is intended for system administrators who still operate in Salesforce
    Classic--only system administrators will have the permission to enable Lightning
    Experience. If you are on Lightning Experience already, you can skip this section.


    Let''s have a quick hands-on exercise on how to enable Lightning Experience:


    +   1. Click on **Setup** to navigate to the setup menu, and then click on **Lightning
    Experience** in the top-left menu:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_27_0.png)


    +   2. Scroll down to the bottom of the page, look for **Lightning Experience**,
    then switch to enable it:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_27_1.png)'
  merge: -1
  img_proc: true
- pgno: 28
  md: '3. Click on **Finish Enabling Lightning Experience** to confirm:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_28_0.png)


    4. Once Lightning Experienced is enabled, notice that the switch turns to green
    with the label changed to **Enabled**:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_28_1.png)


    5. Click on your name in the top-right corner; you will notice that a new menu,
    **Switch to Lightning Experience**, is added, as shown in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 29
  md: '![](img/72d01bea5a9ccf02f9452aab7505d9de_29_0.png)


    +   6. Done! Now click on **Switch to Lightning Experience** from the menu to
    start exploring the modern Lightning Experience.

    +   7. This hands-on exercise will allow you, as a system administrator (including
    other system administrators), to try and explore Lightning Experience for your
    organization. Your normal users will not see the new menu, **Switch to Lightning
    Experience**, until you configure it for them.

    +   8. To enable Lightning Experience for your business users, as a system admin,
    you have the option to enable it by Profile (for all the users in that Profile)
    or by Permission Set (to assign on the user by user basis).

    +   9. To enable by Profile, click on **Edit** on the Profile, scroll down to
    the **Administrative Permissions** section, and look for **Lightning Experience
    User** permission; enable it, then save the Profile.

    +   10. To enable by Permission Set, the same permission **Lightning Experience
    User** is assigned to specific users who need to switch to Lightning Experience.


    It is best practice for a system admin to evaluate Lightning Experience before
    he/she (system admin) enables it for all Salesforce users, and find the gap for
    the functions that may not work when you switch to Lightning Experience. Before
    enabling Lightning Experience users, another best practice is to enable it just
    for a group of pilot users, get their feedback when using Salesforce as part of
    the daily job. Permissions Set would be the option if the users have a different
    type of Profile.'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'Salesforce provides a tool to help you check your organization''s readiness
    for Lightning Experience. Click on the **Evaluate** link under **Check Your Lightning
    Experience Readiness** from the Lightning Experience setup menu. Salesforce will
    email a readiness report to you.


    # Switch to Lightning Experience


    Once Lightning Experience is enabled and permission assigned, click on **Switch
    to Lightning Experience** after clicking on your name, as seen in the following
    screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_30_0.png)'
  merge: -1
  img_proc: true
- pgno: 31
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 32
  md: 'As of now, not all features from Classic are available in Lightning Experience;
    you may need to switch back to Classic when needed. For example, Recycle Bin is
    not available in Lighting Experience. To switch back to Classic, click on your
    photo, then click on Switch to Salesforce Classic. You can use the same path to
    switch back to Lightning Experience:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_32_0.png)


    The Summer ''17 release offers the ability for admin to remove the switcher for
    a user to go back to Classic. If you are not the system admin, reach out to your
    system admin, but if you are the system admin, there is a new permission that
    controls this-- it is called Hide Option to Switch to Salesforce Classic in Profile.


    # The Salesforce object model


    No matter what the user interface, Classic or Lightning Experience, the backend
    database is the same. You will see the same data in Classic or in Lightning Experience,
    or even from the Salesforce1 Mobile App. All reports and dashboards which can
    be built are based on the object model implemented in your Salesforce organization,
    from objects relationship, down to the field type level. It''s crucial for you
    to know this as a basis, before learning to build advance reports and dashboards.'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'This section will discuss the object model in Salesforce. Objects are a key
    component in Salesforce. They allow you to store your data. Similar to a table
    in the database, an object comprises several fields to store data. You can set
    some fields as mandatory, while some other fields will be automatically populated
    by the system, such as **ID**, **Created Date**, **Created By**, **Last Modified
    Date**, and **Last Modified By**.


    You can illustrate an object as a table, field as a column in the table, and record
    as a row in the table. In the following table, field 1 will store values for all
    first names, field 2 for birth date, and so on:


    | records | field 1 | field 2 | field 3 |

    |---|---|---|---|

    | record 1 | John | 29 Jun | ... |

    | record 2 | May | 10 Dec | ... |

    | record 3 | Steve | 24 Feb | ... |


    There are two types of objects in Salesforce:


    +   - Standard objects

    +   - Custom objects


    # Standard objects


    Standard objects are provided by default when you subscribe for Salesforce; this
    is dependent on the cloud type you subscribe to. Each object has its own uniqueness
    for specific functions, and the objects have built-in relationships to each other.
    Here are a few main standard objects when you subscribe to Sales and Service Cloud:


    +   - **Account**: Account is used to store information about the businesses and
    organizations your company interacts with

    +   - **Contact**: Contacts store information about the people that you work with--prospects,
    customers, or suppliers

    +   - **Opportunity**: Opportunity is used to store information about sales interactions
    with your customers; this is often known as the **Sales Cycle**'
  merge: -1
  img_proc: true
- pgno: 34
  md: '+   - **Lead**: Lead is to store information about people who might become
    customers or partners of your company

    +   - **Case**: Case stores information about interactions with your customers
    related to the products or services you provide

    +   - **Campaign**: Campaign stores information about your company''s marketing
    activities and responses


    Some other standard objects are Activity, Asset, Contract, Quote, Order, Products,
    and Price Book.


    Each standard object comes with default fields based on the purpose of the object,
    for example, **Stage in Opportunity**, **Mobile Phone in Contact**, and so on.
    You can create your own fields in the Standard object; this is called as **custom
    field**. The maximum number of fields you can create depends on the Salesforce
    edition you subscribe to.


    You can upgrade your Salesforce edition to a higher edition, such as Professional
    Edition to Enterprise Edition, by simply contacting your Account Executive and
    paying for the increased subscription fee. You will continue using the same organization
    with your existing database and customization. But if you plan to downgrade to
    a lower edition, it is actually not possible to downgrade. By the end of your
    contract, Salesforce will give you a brand new organization where you need to
    reconfigure and transfer all your data.


    # Custom objects


    Custom objects are objects created within an organization to store data specific
    to that organization''s business, and which cannot be stored using standard objects.
    Only users with admin access can create a custom object. Most AppExchange packages
    create and use custom objects, since they provide specific business processes.
    Just like standard objects, custom objects are used to store specific data in
    Salesforce.


    Do not create custom objects to replace the functionality offered by standard
    objects. For example, if you create a custom Lead object, you will waste all the
    functionalities offered by Lead object, such as Lead Conversion.'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'A limited number of custom objects can be created depending on the Salesforce
    edition you subscribe to. If you have admin permission, you can create objects
    and fields in Salesforce with just Point and Click rather than complex SQL scripts
    as in the traditional database.


    In a standard object, the standard fields available depend on the object, but
    each custom object comes with the following few standard fields, which is the
    same for all custom objects:


    +   - ID

    +   - Name

    +   - Created By and Created Date

    +   - Last Modified By and Last Modified Date

    +   - Owner (if the object is not a child of other objects in Master-Detail Relationship)


    Just as with Standard objects, you can create custom fields in a custom object.


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_35_0.png)


    Use Standard object as it is designed for, for example, Salesforce CRM provides
    standard Account and Contact object, so do not create a custom field, such as
    a contact email address in Account.


    # Object relationships


    You can relate an object to other objects in Salesforce. For example, relating
    a custom object Expense to custom object Project. With this relation, you''ll
    know which expense record is used for which project. Project, in this example,
    will be considered as the parent object, and Expense as a child object. From the
    record-level perspective, one parent can have many children, while the child can
    only have one parent. To build this relationship from the child object, create
    a Lookup Relationship or Master-Detail Relationship field to the parent object.


    There are three types of object relationships in Salesforce, which are as follows:


    +   - Master-Detail Relationship

    +   - Lookup Relationship

    +   - Hierarchical Relationship'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'The following table compares the Master-Detail Relationship and Lookup Relationship:


    | Master-Detail Relationship | Lookup Relationship |

    |---|---|

    | You can define master-detail relationships between two custom objects, or between
    a custom object with a standard object (the standard object must be the parent).
    | You can define the relationship between any two objects, standard, or custom
    object. |

    | When a record in the master object (parent) is deleted, all records in the detail
    object (child) related to the master record will be deleted. | You can configure
    the child object to control when the parent is being deleted, either to clear
    the parent record value in the child record, or to not allow deletion of the parent
    record. |

    | All child records must have a related parent record. | The parent record may
    not be required, but you can configure to make the parent field required. |

    | The ownership of a child record is determined by the related parent record;
    the child record does not have an owner. | Each child record has an owner. |

    | A detail record inherits sharing and security from the master record. | There
    is no security sharing or inheritance between related parent and child records.
    |

    | You can relate an existing custom object as a child object, but no records should
    exist in the child object. | To relate an object to another object, there is no
    validation on the existing number of records for the child object. |

    | If you have a Roll-Up Summary field in the parent object, the create, edit,
    or delete actions in a child record will trigger edit action in the parent object.
    If you have validation rule in the parent object, it will trigger for the parent
    object as well. | You cannot create a Roll-Up Summary in Lookup Relationship using
    out-of-the-box Salesforce functionality. |

    | Supports cross-object workflow; you can define to update a field in the parent
    record using the value from the child record. | Does not support cross-object
    workflow. |

    | Ability to configure for a child record to allow re-parent to a new parent.
    | A child record can always re-parent to another parent record. |

    | Ability to configure the sharing setting to allow to create, edit, or delete
    related Detail records based on permission on the parent record. | No sharing
    setting dependency between parent and child objects. |'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'To create a Master-Detail Relationship for an existing object that contains
    records as a child object, you can initially set it as a Lookup Relationship,
    populate the parent field for all child records, and then change the relationship
    to Master-Detail Relationship.


    Hierarchical Relationship is a special Lookup relationship available for the user
    object only. It lets users use a lookup field to associate one user with another,
    which does not directly or indirectly refer to itself. For example, you can create
    a custom Hierarchical Relationship field to store each user''s reporting manager.


    You can build a many-to-many object relationship using two Master-Detail Relationships
    in a single custom object; this is known as a **Junction object.**


    # Field types


    Salesforce provides various data types to fit your business model. Some of them
    are built with business logic, for example, emails have to follow a valid e-mail
    format, and URLs have to follow a valid URL format; an invalid value will be auto
    rejected by the system. For each data type, you can determine additional options
    to specify including Required, Unique, Case sensitive, External ID, and Default
    Value.


    Here is a list of the Salesforce data types:


    +   - Auto Number

    +   - Formula

    +   - Roll-Up Summary if an object is the parent in Master-Detail Relationship

    +   - Hierarchical relationship--only for a User object

    +   - Lookup Relationship

    +   - Master-Detail Relationship

    +   - Checkbox

    +   - Currency

    +   - Date

    +   - Date/Time

    +   - Email

    +   - Geolocation

    +   - Number

    +   - Percent'
  merge: -1
  img_proc: true
- pgno: 38
  md: '+   - Phone

    +   - Picklist

    +   - Picklist (Multi-Select)

    +   - Text

    +   - Text Area

    +   - Text Area (Long)

    +   - Text Area (Rich)

    +   - Text (Encrypted)

    +   - URL


    # Navigating to the Setup menu


    Once you log into Salesforce, click on the gear icon in the top-right corner of
    the window, then click on the Setup link. This will open the Setup page in a new
    tab of the web browser.


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_38_0.png)


    In the left panel, there are many links for you to configure Salesforce. These
    links can be categorized into three main categories: ADMINISTRATION, PLATFORM
    TOOLS, and SETTINGS. Each category has many menus. For each menu, start with arrow
    >, click on the menu to open the submenu.


    If you are not a system admin, you may see fewer menu options in the Setup page,
    or you may not even see the Setup page at all--it depends on the permission given
    to you.'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'If you know a setup name, but do not remember where it is located, or whether
    it is a part of a menu, you can type the setup name into the Quick Find textbox
    at the top of the panel; this will filter all setup menus quickly, as shown in
    the following screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_39_0.png)


    The center panel shows the last ten items most recently used in the Setup page
    (not records). Click on any link in that panel to open the related setup item.
    The top-right panel will give an admin shortcut to quickly create single or multiple
    users, custom object, custom tab, email template, and workflow process.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# Navigating to reports and dashboards


    The **Reports** and **Dashboards** tabs in Salesforce Lightning Experience are
    located under different tabs, as seen in this screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_40_0.png)


    You may wonder, "Why do I not see those tabs when I am in Salesforce?". Here are
    two reasons why:


    +   - Make sure your **Profile** or **Permission Set** for the **Reports** tab
    and **Dashboards** tab setting is **Default On** or **Default Off**, and not **Tab
    Hidden**. You need to check with your Salesforce system admin for this setting.

    +   - Open **App Launcher** from the upper-left corner in the tab rows (under
    the logo); the icon for this is nine dots in a square. If you can find the Reports
    and Dashboards link here, it means that the app you opened does not have the Reports
    and Dashboards item added. You can access it from here, or ask your admin to add
    those items to the app as shown in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 41
  md: '![](img/72d01bea5a9ccf02f9452aab7505d9de_41_0.png)


    # ## Reports / Dashboards tab and menu


    When you click on the **Reports** tab, by default, you will see a list of reports
    recently opened. In the left panel, you will find a menu with the following items:


    +   - **Created by Me**

    +   - **Private Reports**

    +   - **Public Reports**

    +   - **All Reports**'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'The following folders are present in the **FOLDERS** subsection:


    +   - **Created by Me**

    +   - **Shared with Me**

    +   - **All Folders**


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_42_0.png)


    If you have the permission to create report, you will see the **New Report** button
    at the top-right corner of this page.


    To run a report, just click on the report name, and it will open the report. The
    report generated is live data pulled from your organization.


    In the main panel, there are few columns--**REPORT NAME, DESCRIPTION, FOLDER,
    LAST MODIFIED BY, and SUBSCRIBED**--and an arrow to perform a list of actions
    for the report. We will discuss most of these items in the next few chapters of
    this book.


    The same is applicable for dashboard when you click on the **Dashboards** tab.
    You''ll find the columns **DASHBOARD NAME, DESCRIPTION, FOLDER, and LAST MODIFIED
    BY** in the main panel.


    # Adding to favorites


    Notice that there is an arrow next to most of the tabs. Clicking on the arrow
    will list all the recently opened records. The same is applicable to reports and
    dashboards--when you open a report or dashboard, it will be added to the Recent
    Records.


    When your report or dashboard is open, you can bookmark that report or dashboard
    by clicking on **Add Favorite** (star icon), and the report or dashboard will
    be added to your personal favorites list, as seen in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 43
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 44
  md: 'Now check out the **MY FAVORITES** (star icon) button at the top of the page.
    On clicking the arrow next to the star icon, you will find the report or dashboard
    added earlier to your favorites. You can remove it from your favorite list by
    clicking on the **Edit Favorites** link:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_44_0.png)


    The same behavior is seen with Reports--you can also bookmark your favorite dashboards,
    and they will be added to the favorite icon. You click on the arrow next to the
    favorite icon to see it.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# Summary


    In this chapter, we started with a discussion on Salesforce architecture, the
    benefits of using the Salesforce technology, and the multiple products offered
    by Salesforce. Lightning Experience is the latest user interface, which offers
    many enhancements and more productivity over the older Salesforce Classic user
    interface. We discussed how to switch to Lightning Experience, and gave tips on
    rolling it out to your users if you are new to Lightning Experience.


    We continued to discuss the Salesforce object model, how data is stored in Salesforce,
    the types of objects, and the difference between Standard and Custom objects.
    Topics like how to relate objects, the relationship between objects using Master-Detail
    Relationship and Lookup Relationship, and a comparison between both the relationship
    models were explained in depth. You also learned about the multiple field types
    for the objects.


    Next, we explained how to navigate to the Setup menu, gave tips for **Quick Find**
    on the menu, and also mentioned about the recently open setup menu from the main
    panel. At the end of the chapter, we showed you where to find Reports and Dashboards
    in Salesforce, and gave you reasons if you can’t find them. Then we shared how
    to navigate to the **Reports and Dashboards** tab, and to behind the arrow next
    to the tab. We ended with how to bookmark reports and dashboards using the Favorite
    icon in Lightning Experience, and how we can take advantage of that feature.


    In the next chapter, we will cover the concept of Reports and Dashboards in Salesforce,
    how reports and dashboards are stored, backend data related to reporting, permissions
    related to reporting and dashboards, and the security built around them.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# 2


    # Concepts and Permissions in

    Reports and Dashboards


    This chapter will explain the concept of reports and dashboards in Salesforce,
    and discuss the data source to generate reports and dashboards. We will continue
    with the mechanism on reports and dashboards stored in Salesforce with an explanation
    of the types of report and dashboard folders.


    We will continue with permissions, which is a basic setting that controls what
    a user can do in Salesforce. The same is true for reports and dashboards; many
    permissions surface around reports and dashboards, such as the ability to create
    and modify reports, export reports, schedule reports, and so on.


    By end of this chapter, you will have gained a strong understanding of data use
    for reports and dashboards, permissions around users, and granting permissions
    to a user with Profile and Permission Set.


    Throughout the chapter, we will provide notes and tips to help you to understand
    important items. The topics covered in this chapter are as follows:


    +   - Data for reports and dashboards

    +   - Generating reports and dashboards

    +   - Report and dashboard folder

    +   - Report permissions

    +   - Dashboard permissions'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Data for reports and dashboards


    First things first. You can only generate a report for data that exists in your
    Salesforce organization, unless you purchase Salesforce Connect to connect to
    an external database, which maps data stored outside into your Salesforce organization;
    the external data source could also be another Salesforce organization. Your report
    quality depends on the data quality, cleanness, and completeness. Therefore, system
    adoption is one of the most important keys to have great data and reports in Salesforce.


    Once a report is created, you can store it privately, share with other users,
    subscribe to notifications when data in the report is changed and meets the conditions
    set, or schedule it for delivery to yourself and to other users.


    In Salesforce, a report is the basic requirement to build a dashboard. Each component
    in a dashboard needs to have a report to serve as the data source. You can use
    the same report for multiple components in a dashboard, or across multiple dashboards.


    You can use any field (with any field type) available in an object, or from multiple
    objects to create a report. You need to have read access to the object and the
    field, but it is not necessary to have permission to edit the data. If you need
    to learn more about object, field and field type, check out the The Salesforce
    object model section of Chapter 1, Fundamentals of Salesforce Reports and Dashboards.
    As you see now, objects and fields are foundations in creating reports.


    # Generating reports and dashboards


    When you click on a report, Salesforce generates the report on the fly within
    seconds, and the data shown in the report is live data from your Salesforce organization.
    But what if I would like to see a report from yesterday''s data or last week''s
    data? No, you can generate report only for current data. If you would like to
    see historical data, you can set up Reporting Snapshot or Field History, but that''s
    not the whole data snapshot on a certain date.


    In the report, you can only see objects and fields that you have access to, assuming
    that the report is created by someone else. This means that for the same report,
    you may see fewer fields or columns than other users, because you do not have
    permission to those fields.


    Similarly, for a data set, if the record is not visible to you in Salesforce,
    you will not see it in the report either. This is referred to as the object sharing
    setting and object permission.'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'However, dashboard is a different story. When you open a dashboard, it shows
    data as of the last dashboard refresh. If the dashboard was last refreshed by
    your colleague, you will see the data as of your colleague''s last refresh, or
    you can refresh it manually. Salesforce offers the ability to auto refresh the
    dashboard, but within a limit.


    # The report and dashboard folder


    Where are the reports and dashboards stored in Salesforce? They are stored in
    **Folders**. There is no limit on the number of reports and dashboards you can
    create and store. Folders created for reports can only be used to store reports,
    and the folders created for dashboards only to store dashboards. For simplicity
    in this book, let''s call them the report folder and dashboard folder.


    You can think of a folder here is similar to the folder in Windows Explorer, but
    without the drive and without a subfolder, and instead of storing files, it is
    used to store reports or dashboards depending on the folder type. As a folder
    manager, you can share the folder visibility to certain users, roles, roles and
    subordinates, or public groups.


    Types of folders in Salesforce for reports and dashboards:


    +   - A private folder

    +   - Unfiled Public Folder (only for report)

    +   - Public folder


    # A private folder


    A private folder is a special folder available for each Salesforce user, and is
    also known as the **My Personal Custom Reports** folder for a report folder. For
    dashboards, it is called **My Personal Dashboards** (in Classic), or **Private
    Dashboards** (in Lightning Experience). In Lightning Experience, reports stored
    in this folder are called **Private Reports**.'
  merge: -1
  img_proc: true
- pgno: 49
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 50
  md: '# Unfiled public folder


    The **Unfiled Public Reports** folder in Classic, also known as the **Public Reports**
    folder in Lightning Experience, is another special report folder. Reports stored
    in this report folder are accessible by all users. If you also have permission
    to create and customize reports, then you will be able to store the reports into
    this folder.


    # Public folder


    To create a public folder, you need to have the permission to create a report
    folder or a dashboard folder (we will discuss all permissions related to the folder
    in Chapter 3, *Implementing Security in Reports and Dashboards*). The public folder
    is the folder that you create for storing reports and dashboards; normally, this
    folder is shared by many users.


    After you create a new report, you need to save the report to run it. You can
    store the report in a public folder to share with your colleagues for future usage
    or other purposes, for example, as the data source for a dashboard, or for e-mail
    delivery. Depending on the user permission and folder-level access, this will
    determine the folder''s visibility and accessibility to a user--whether as read-only
    or with read-write accessibility. Remember, report accessibility is configured
    on the folder level, not in the report itself.


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_50_0.png)


    When a folder is visible to a user, the user will be able to see and run all the
    reports stored in that folder. So the control is not by report, but by folder.


    When you install an app from AppExchange, some apps will come with reports, and
    will be stored in their own folder. The folder will be created when you install
    the app.'
  merge: -1
  img_proc: true
- pgno: 51
