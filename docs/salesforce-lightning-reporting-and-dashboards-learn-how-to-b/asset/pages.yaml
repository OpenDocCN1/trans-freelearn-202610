- pgno: 292
  md: '# Implementing the dashboard filters


    Have you ever had the need to analyze a dashboard based on different criteria?
    For example, we would like to look at the pipeline dashboard for the current year,
    current quarter, and current month.


    For this example, it is not an issue to create three dashboards, but since the
    data source of the dashboard is driven by reports, this means that we would need
    to create three sets of reports for each dashboard, and if you have 10 components
    for the dashboard, you will need 30 reports to support this.


    Therefore, instead of creating multiple dashboards, it would be better to consolidate
    and easier for the user to just have one dashboard only since all the components
    for the dashboard are the same. Also, consider the maintenance effort for 30 reports
    and three dashboards and compare this to one dashboard with 10 reports used as
    the data source.


    The dashboard filter comes into the picture for this scenario; with just one dashboard,
    you can change the filter to include different records in the dashboard based
    on the selected filters.


    # Getting to know the dashboard filters


    The dashboard filter is a great feature to filter the data in the dashboard component.
    All components will be filtered according to the filters selected. With the dashboard
    filter, you can use the same dashboard with different combinations of data.


    Adding filters to a dashboard gives users the ability to have many results using
    a dashboard, so one dashboard serves the purpose of multiple dashboards. Without
    filters, you’d have to create multiple dashboards, with each dashboard having
    the same components with different filters. For example, add a filter in the industry
    field to track an account by industry. As admin, it is easier to maintain fewer
    dashboards.


    If you have selected filters on a dashboard, the last filters selected by you
    will be applied by default when you reopen the dashboard. Salesforce will remember
    this for each user filter it applied for each dashboard.'
  merge: -1
  img_proc: true
- pgno: 293
  md: 'To create a dashboard filter, you define a label for the filter, select the
    field that contains the type of information you want to filter, and then define
    how the filter returns the data. Each filter ideally contains more than one value,
    including the operator. Each filter can have up to 10 values maximum, and each
    dashboard can have up to three filters.


    # Hands-on exercise for adding a filter to a dashboard


    Let''s use the **Account Dashboard** created in Chapter 9, *Building Dashboards
    in Lightning Experience* for this exercise; we will add a filter based on **Industry**
    (a field in **Account**) with the option equal to:


    +   - **Apparel** or **Education**

    +   - **Energy**

