  md: '# # Reports and dashboards collaboration with Chatter


    Salesforce offers **Chatter** as a collaboration platform in the system, similar
    to Facebook, where you can post messages, photos, and so on. You will also be
    able to create a group and collaborate within the group. Furthermore, with a **Chatter
    feed**, you can collaborate with other users at the record level, such as **Account**,
    **Opportunity**, and other objects; this includes reports and dashboards.


    # ## Enabling collaboration in a report


    You can utilize a **Chatter feed** in a report to collaborate with your teams,
    for example, to give attention to the Sales Pipeline report or others.


    Let''s look back on the items available when you open a report--there is an icon
    called Collaborate next to Filters, as shown in the following screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_326_0.png)'
