    we explained the ability to post dashboard snapshots to the dashboard feed or
    user/group feed from Salesforce in web browsers. You can do the same from the
    Salesforce1 app. You can post the dashboard snapshot to your feed, and mention
    another user or Chatter group as follows:


    +   1. Open the dashboard from the Salesforce1 app.

    +   2. Select the dashboard component by tapping on it; notice the blue dash line
    around the component--the expand icon will appear at the top-right corner of the
    chart. This is shown in the following screenshot:


