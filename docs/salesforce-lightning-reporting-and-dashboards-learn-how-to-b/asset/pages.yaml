- pgno: 341
  md: '# # Filtering reports via URL parameters


    If you are familiar with Classic, you can implement the report parameter by adding
    pv after the report URL. How do we do that in Lightning? Fortunately, Salesforce
    offers the same feature, but before we look at the sample and do some hands-on
    exercise, let us discuss how powerful this feature is.


    With this feature, you can pass values in the report URL, as parameters act as
    filter values for the report. One of the uses is to create a custom button or
    link from the record page pointing to the report created, and with specific filters,
    you will be able to create a dynamic report based on the source record. For example,
    to generate a report for all opportunities related to an account.


    Another usage of the report with a URL parameter is the ability to reuse the same
    report for different purposes, instead of creating two similar reports. For example,
    in the case of Pipeline for New Business and Pipeline for Existing Business with
    URL parameters, once the report is loaded, you can create two bookmarks with the
    URL parameters.


    Using a parameter as a report filter will save us from creating many similar reports
    differentiated only by filters, or having to keep editing the report and changing
    the filter values.


    # ## Hands-on exercise for implementing a report filter via URL parameters


    Use case: we would like to analyze certain **Account** fields, which are not visible
    in the Account page layout. The report will be filtered by **Account Name**, but
    instead of repeatedly editing the report to change the **Account Name** value,
    let us use a report filter with a URL parameter.


    +   1. Create a simple **Tabular Account** report, and name it `Account Name Report`.

    +   2. Select the **Show** field to be **All accounts**.

    +   3. Set **Date Field Range** to **All Time**.

    +   4. Add the filter, **Account Name contains** `blank`; click on **OK** to confirm
    the filter.

    +   5. Click on the **Save** button, and click on **Run Report**.

    +   6. Click on the **Reports** tab, then open the report again (it should appear
    at the top of the list).'
  merge: -1
  img_proc: true
- pgno: 342
  md: '7. The following screenshot shows the report generated, and get the report''s
    URL. In my case, it is https://gs0.lightning.force.com/one/one.app#/sObject/00OB0000001sBuoMAE/view:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_342_0.png)


    8. Okay, now we are going to add a parameter to the report''s URL.


    9. Let''s say we would like to show all accounts that contain the name united.


    10. Add united as the URL parameter, and hit Enter in the web browser: https://gs0.lightning.force.com/one/one.app#/sObject/00OB0000001sBuoMAE?fv0=united.
    This is shown in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 343
  md: '![](img/72d01bea5a9ccf02f9452aab7505d9de_343_0.png)


    As you can see in the preceding screenshot, united added to the parameter becomes
    the filter value for the report. If you do not save the report, the report will
    stay as it is, but if you save the report, the report will have united stored
    permanently.


    Let us analyze the preceding report and URL:


    +   - Here is the original URL:

    +     https://gs0.lightning.force.com/one/one.app#/sObject/000B0000001sBuoMAE/view

    +   - Then we change the URL by adding a parameter as follows:

    +     https://gs0.lightning.force.com/one/one.app#/sObject/000B0000001sBuoMAE/view?fv0=united

    +   - We add ? after the report ID, which is 000B0000001sBuoMAE; & denotes a new
    parameter in the URL. If you have multiple parameters, substitute ? with & from
    the second parameter onwards.'
  merge: -1
  img_proc: true
- pgno: 344
  md: '+   - We add `fv0`, where `fv` stands for filter value, as the parameter name.
    The 0 is the numerical order in which the filter appears in the report; the first
    filter is 0, the second filter is 1, the third is 2, and so on and so forth. To
    set the value of the second filter in the report, specify `fv1` as the parameter
    name. Standard filters don''t count in this order, and can''t be filtered using
    URL parameters.

    +   - We add `united` as the parameter name--remember that filter is case-insensitive,
    so it doesn''t matter whether you type `united` or `United`. If you want to add
    more than one word with a space, such as `united oil`, you can just type as it
    is, but the browser will add `%20` in between to follow the URI encoded, so it
    will become

    +   `https://gs0.lightning.force.com/one/one.app#/sObject/000B0000001sBuoMAE/view?fv0=united%20oil.`


    Now, what if I just need to change the filter value for the second parameter,
    but not for the first one? Well, that should not be an issue--you can just add
    `fv1` in the parameter (without fv0), for example:

    `https://gs0.lightning.force.com/one/one.app#/sObject/000B0000001sBuoMAE/view?fv1=customer.`
    This is shown in the following screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_344_0.png)'
  merge: -1
  img_proc: true
- pgno: 345
  md: 'There are a few things to note related to filtering with URL parameters, which
    are as follows:


    +   - URL parameters only support field filters manually added to the report.

    +   - They do not support standard filters provided by the report, such as **Role
    Hierarchy**, scope, territory, **Opportunity Status**, **Probability**, and date
    filters.

    +   - They do not support **Cross Filter** and **Row Limit** filters.

    +   - The first field manually added as a filter will count the first parameter,
    which is `fv0`.

    +   - If a chart is added to the report, the chart will be adjusted as the report
    filter is applied, including the filter that uses the URL parameters.

    +   - You can''t add, change, or delete the fields being filtered via URL parameters;
    you can only modify the value of existing filters.

    +   - Parameters do not have to be added in the same sequence as the report filters,
    for example, we put `fv1` before `fv0`:

    +     `https://gso.lightning.force.com/one/one.app#/sObject/00OB0000001sBu0MAE/view?fv1=customer&fv0=united`;
    here, `fv1` is added as the first parameter, but `fv1` is for the second filter.
    Then we add `fv0`, which is the first filter, as the second parameter. Use `?`
    only before the first parameter, then use `&` to separate all other parameters.


    # # Setting and using field history tracking


    Tracking field history is an out-of-the-box Salesforce feature to track value
    changes in a field. You can select up to 20 fields per object to track; contact
    Salesforce Support if you need to track more fields. For field types, **Text Area
    (Long)**, **Text Area (Rich)**, and **Picklist (Multi-Select)**, history tracking
    does not track the original value and new value when a record is updated, but
    only tracks that a change has occurred for the field. This feature is simple,
    but powerful for audit purposes.


    Salesforce retains history for up to 18 months; however, if you need to archive
    for a longer period, contact your Salesforce Support to acquire Field Audit Trail
    and define a policy for how long you wish to retain field history tracking. This
    payable feature will allow you to extend the archive for up to 10 years.


    As an admin, you can enable field history tracking by yourself with a few clicks--select
    certain important fields to track for both standard and custom objects.'
  merge: -1
  img_proc: true
- pgno: 346
  md: 'Remember, with field tracking the field value is not tracked until the object
    is enabled and the fields are selected for tracking. This means that if you enable
    tracking the **Account Name** today, you will not be able to track **Account Name**
    changes made before today.


    History tracking is not just to track when you edit a record, but also when you
    create a new record, including records that are created when a **Lead** is converted.
    The field history entry will be marked as **Created** when you create a new record,
    or **Created by lead convert** when the record is converted from a **Lead** record;
    both, the old value and the new value will be blank.


    # # History tracking on standard objects


    History tracking supports both standard and custom objects. But not all standard
    objects are supported by field tracking; only the following standard objects support
    history tracking: **Accounts, Articles, Assets, Campaigns, Cases, Contacts, Contracts,
    Contract Line Items, Entitlements, Leads, Opportunities, Orders, Order Products,
    Products, Service Contracts, and Solutions.**


    To enable history tracking on a standard object, such as **Account**, perform
    these steps:


    +   1. Navigate to **Setup | Object and Fields | Object Manager | Accounts | Fields
    & Relationships**, and click on the **Set History Tracking** button.

    +   2. Check the **Enable Account History** checkbox.

    +   3. Select the fields you want to track.

    +   4. Notice that **Description** will be tracked for changes only. This is because
    **Description** is a **Text Area (Long)** field, the same when you track fields
    with the type of **Text Area (Long)**, or **Text Area (Rich)**, and **Picklist
    (Multi-Select)**.

    +   5. Click on the **Save** button to save the changes.'
  merge: -1
  img_proc: true
- pgno: 347
  md: '# # History tracking on custom objects


    For custom objects, you need to enable tracking in the object details before selecting
    the fields to track. Let''s say we have a custom object named `Claim`. Perform
    the following steps:


    +   1. Navigate to **Setup | Objects and Fields | Object Manager**.

    +   2. Click on the **Claim** object link and click on the **Edit** button.

    +   3. Enable **Track Field History** in optional features, and click on the **Save**
    button. This is shown in the following screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_347_0.png)


    +   4. Select **Fields & Relationships** from the menu on the left-hand side.

    +   5. Click on the **Set History Tracking** button, and select the fields you
    want to track.

    +   6. Do the same with the standard object, for the **Text Area (Long)**, **Text
    Area (Rich)**, and **Picklist (Multi-Select)** fields—it will track changes only,
    not the old and new values.

    +   7. Click on the **Save** button to save the changes.'
  merge: -1
  img_proc: true
- pgno: 348
  md: '# History objects


    When you enable **Field History Tracking** for an object, at the backend Salesforce
    will create a new object. The object name will end with **History**, for example,
    **AccountHistory**, **ContactHistory**, and so on for the standard object, and
    for the custom object it would be **__History**, for example, `Claim__History`.


    When any changes happen to a tracked field in a record, Salesforce will create
    a new record in this object. For example, if you have five tracked fields in an
    object, and three of them change in one transaction, Salesforce will create three
    records in this object.


    As a developer or admin familiar with SOQL, you can look into the object to query
    for the following:


    +   - `CreatedById`: User who makes the change

    +   - `CreatedDate`: Date of change

    +   - `OldValue`: Shows the old value

    +   - `NewValue`: Shows the new value

    +   - `ParentId`: (for custom object), the record ID related to the changes

    +   - `ObjectId` (for example: `AccountId` or `ContactId` for standard object)


    You cannot create, update, or delete records in this object manually, you can
    only query. For a good reason, the storage usage for history objects is not counted
    as data storage.


    # Reading the history tracking value


    Once you enable history tracking, there are two ways to see the tracking value,
    not including using an API query. These two ways are discussed next.'
  merge: -1
  img_proc: true
