    # Limitations of using field history tracking


    Some of the limitations have been explained previously, but let us summarize them
    here:


    +   - By default, only a maximum of 20 fields can be tracked

    +   - For **Text Area (Long)**, **Text Area (Rich)**, and **Picklist (Multi-Select)**
    type of field, you cannot track the original and new value

    +   - Not all standard objects can be tracked; for example, **User**, **Task**,
    **Event**, **Campaign**, and **Quote**

    +   - Not all fields can be tracked; for example, the **Formula** field, **Roll-Up
    Summary**, auto-number fields, **Created By**, **Last Modified By**, and **Expected
    Revenue** fields on **Opportunity**


    # Reporting on historical data with Reporting Snapshots


    Can we have a report on data trending in Salesforce? Does Salesforce only report
    current data? Field history tracking will store old and new values whenever value
    changes in fields are detected. But to use it for trending would be too difficult,
    unless you export the data to an external database and analyze it with live data--it
    will not include deleted data either (if any).'
  merge: -1
  img_proc: true
- pgno: 354
  md: "So, is there any other way to store historical data in Salesforce so that we\
    \ can easily use it for reporting? Yes, if you are using Salesforce Enterprise\
    \ Edition or later, you can configure **Reporting Snapshot** to store historical\
    \ data.\n\nThe same as field tracking, do not expect the old historical data to\
    \ be available before you configure the **Reporting Snapshot**. Only historical\
    \ data for a specific **Reporting Snapshot** will be available after it has been\
    \ properly configured and scheduled.\n\nEach Salesforce edition has a limited\
    \ number of **Reporting Snapshots** that can be created and scheduled, so use\
    \ it wisely, or you can contact Salesforce Support to acquire more.\n\n# # Configuring\
    \ a Reporting Snapshot\n\nOnly users with the **Manage Reporting Snapshots** permission\
    \ will be able to create and configure a Reporting Snapshot.\n\nThe major steps\
    \ to configure and implement a **Reporting Snapshot** are summarized as follows:\n\
    \n+   1. **Create a Source Report** as follows:\n+   \n+      Create a report\
    \ with the **Tabular** or **Summary** report format. The number of records created\
    \ in the target object depends on the report format and the number of records\
    \ returned in the report result.\n+   \n+      For a **Tabular** report, it will\
    \ be one-to-one, meaning each record in the report will create a record in the\
    \ target object.\n+   \n+      For a **Summary** report, it could be a **Group\
    \ Summary** or a **Grand Summary**. A **Grand Summary** will always create only\
    \ one record in the target object, while a **Group Summary** will create a number\
    \ of records in the target object—as many as the number of groupings. The following\
    \ screenshot shows options of **Grouping Level**:"
  merge: -1
  img_proc: true
- pgno: 355
  md: '# Edit Reporting Snapshot

    Field Mappings


    # 1. Select Source Report Summary Grouping Level


    You have selected a summary report as your source. Summary report records may
    be grouped into one to three levels. If your source report has more than one grouping
    level, select the level at which summary data should be extracted.


    Grouping Level


    +   - Grand Summary

    +   - Grouping 1: Stage


    I = Required Information


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_355_0.png)


    The maximum number of records that will be stored is 2000 per snapshot run.


    +   2. To create a target object, create a custom object as the target object
    to store the data returned from the report. Make sure the target object is not
    included in the workflow.


    +   3. Create fields in the target object: By default, a Reporting Snapshot will
    give us information about three things, which we can capture in the target object
    fields: Reporting Snapshot Name, Reporting Snapshot Running User, and Execution
    Time. It is a good practice to create similar field names, or the represented
    data will be created from the Source Report. You need to create additional custom
    fields to capture the data being collected in the Source Report.'
  merge: -1
  img_proc: true
