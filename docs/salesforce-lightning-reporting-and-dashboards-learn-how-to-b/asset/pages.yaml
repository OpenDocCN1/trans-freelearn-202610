- pgno: 165
  md: '# # Creating a bucket field depending on the source field type


    In the preceding example, we used the picklist field as the source field; however,
    different field types will have different ways to define the bucket field.


    In the following sections, we will discuss how we create bucket fields using a
    different types of fields as the field source.


    # ## The picklist field


    By creating a bucket field with picklist as the field source, you will be able
    to categorize the picklist values into a smaller category. Some points to note
    when using the picklist field as the source field type for the bucket field are
    as follows:


    +   - Select the picklist value and move it into a bucket

    +   - One picklist cannot be categorized for more than one bucket

    +   - Not all picklist fields can be used as a source for the bucket, such as
    a record type

    +   - If you do not select **Show unbucketed values as "Other,"**, all values
    not captured in the bucket will be as shown in the following screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_165_0.png)'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# The Currency, Number, and Percent fields


    By creating a bucket field with currency, number, and percent as the field source,
    you will be able to sort data that can be described in terms of numbers. Some
    points to note when using these field types for bucket fields are as follows:


    +   - You need to have a minimum of two buckets for small and big range values

    +   - You can add many bucket ranges up to a total of 20 buckets

    +   - If you do not tick Treat empty <field name>values in the report as zeros,
    blank values of the source column will be shown as follows:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_166_0.png)'
