- pgno: 261
  md: '# Navigating to a dashboard


    Interactive dashboard components give viewers more information and links to data-supplying
    reports. Let''s look at all the items in a dashboard:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_261_0.png)


    +   1. **Refresh, Edit, Clone, New Dashboard, or Delete:** The buttons and drop-down
    menu at the top of each dashboard provide one-click access to administrative tasks.

    +   2. **View Report** underlying a component: Would you like to get the data
    behind a metric or a chart? Click on **View Report** to drill into the data.

    +   3. **Hover over charts to get more information:** Hovering over a chart segment
    reveals more information about the chart.

    +   4. **Expand dashboard components to get the big picture:** Click on the expand
    icon to see a larger version of the component and continue with the **View Report**
    button to drill into the data.'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# Dragging and dropping in the Dashboard Builder


    The **Dashboard Builder** is a drag and drop interface to create and modify dashboards.
    You can use it to customize the whole dashboard, a column in the dashboard, or
    a component in the dashboard.


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_262_0.png)


    Let''s go through all the items in the Dashboard Builder from the preceding screenshot:


    +   1. **Editing the dashboard title (denoted by 1):** You can easily change the
    dashboard title from the pencil icon.

    +   2. **Editing the components (2):** Clicking on this pencil icon changes the
    component type, sort, max values displayed, title, subtitle, and footer.

    +   3. **The Delete component (3):** Click on this cross icon to delete the component.

    +   4. **The add + Component button (4):** Click on this to add a new component
    to the dashboard.

    +   5. **The add + Filter button (5):** Click on this to add a filter for the
    whole dashboard.

    +   6. **The undo button (6):** Click on this to undo items that have changed
    but haven''t been saved.

    +   7. **The redo button (7):** Click on this to redo items.'
  merge: -1
  img_proc: true
- pgno: 263
  md: "+   8. **The edit properties button (8):** Click on this to edit the dashboard\
    \ properties: title, description, folder, View Dashboard as, and enable Dynamic\
    \ Dashboard.\n+   \n+   9. **The Save, Save As, and Delete buttons (9):** The\
    \ **Save** button saves and overwrites an existing dashboard, the **Save As**\
    \ button saves the dashboard as a new dashboard, and the **Delete** button deletes\
    \ the dashboard.\n\n![](img/72d01bea5a9ccf02f9452aab7505d9de_263_0.png)\n\nA deleted\
    \ dashboard can be recovered from the Recycle Bin within 15 days, but as of the\
    \ Summer '17 release, the Recycle Bin does not exist in Lightning Experience yet,\
    \ so you need to switch to Classic to undelete.\n\n+   10. **The Done button (10):**\
    \ Click on this to close the dashboard editor: If you haven't saved the changes\
    \ made, the system will prompt you to save or discard the changes.\n+   \n+  \
    \ 11. **Resize and move (11):** Drag a component corner to resize the component\
    \ or hold the component to move it.\n\n# # Refreshing dashboards\n\nDashboards\
    \ are not the same as reports. When you open a report, the report data will be\
    \ generated based on current data. On the other hand, for dashboards, when you\
    \ open a dashboard, it will show the data as of the latest dashboard refreshed\
    \ by any users or by a schedule.\n\nAll users able to view the dashboard will\
    \ be able to refresh the dashboard by simply clicking on the **Refresh** button\
    \ after opening the dashboard. Even users who do not have permission to edit the\
    \ dashboard are able to refresh the dashboard. Once refreshed, the other user\
    \ that sees the dashboard will be based on latest refreshed data."
  merge: -1
