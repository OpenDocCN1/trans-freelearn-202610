- pgno: 357
  md: '# Creating a Summary report


    We will not go through each step to create a report, as it has been covered in
    detail in earlier chapters. This report needs to be in a Summary format--group
    by Stage, add the Amount column, and summarize it with Sum. See the next screenshot,
    and make sure you get a similar one.


    You can store the report in any folder as long as the running user is able to
    access the report. But, as a good practice, create a new report folder purposely
    only for Reporting Snapshot.


    Let us name this report as `Opportunity by Stage (for Snapshot)`:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_357_0.png)


    # Creating a custom object


    This custom object will be used to store all values when the snapshot is run on
    schedule. Navigate to Setup | Objects & Fields | Object Manager | Create | Custom
    Objects to create a new object; let us name the object as `Opportunity Snapshot`.
    Set the record name data type to Auto Number.'
  merge: -1
  img_proc: true
- pgno: 358
  md: '# Creating custom fields


    From the custom object created previously, create the following fields to store
    values from the report and snapshot running information, and make sure the fields
    created have the correct field type. Consider the screenshot for fields that need
    to be created:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_358_0.png)


    In this exercise, we will capture the group summary (this is defined by the report
    used as Source Report, which is in the Summary format), so we just need a few
    custom fields to store the summary information, which, for this exercise, are
    Record Count and Total Amount.'
  merge: -1
  img_proc: true
- pgno: 359
  md: 'But if you use a **Tabular** report as the **Source Report**, it will capture
    the report detail. You may need to create more fields, as you need to capture
    from the **Tabular** report. Each row in the report will create one record in
    the target snapshot object.


    # Creating Reporting Snapshots


    This is where we define the **Reporting Snapshots** configuration as follows:


    +   1. Navigate to **Setup | Feature Settings | Analytics | Reports & Dashboards
    | Reporting Snapshots**.

    +   2. Click on the **New Reporting Snapshot** button.

    +   3. Enter the following information:

    +      - **Reporting Snapshot Name:** Let us name it `Opportunity Snapshot`

    +      - **Description:** This is optional, but it is always a good practice to
    put a description for the snapshot

    +      - **Running User:** This user will determine data visibility when the snapshot
    is run

    +      - **Report Source Name:** Selects the report we created in Step 1, **Opportunity
    by Stage (for Snapshot)**

    +      - **Target Object:** Selects the object we have created in Step 2, **Opportunity
    Snapshot**

    +      - Click on the **Save** button to continue. Check the following screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_359_0.png)'
  merge: -1
  img_proc: true
- pgno: 360
  md: '# Mapping fields from Source Report to target object


    Once **Reporting Snapshots** are created, click on the **Edit** button in the
    **Field Mappings** section.


    +   - Select the grouping level to **Grouping 1: Stage**.

    +   - **Map Summary Fields from Source Report to Target Object.** This is shown
    in the following screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_360_0.png)


    +   - Click on the **Save** button to continue.


    # Scheduling a Reporting Snapshot


    Once the **Reporting Snapshot** is created, click on the **Edit** button in the
    **Schedule Reporting Snapshot** section.


    +   - Optionally, you can enable the email sent to you or to other users based
    on **Public Groups, Roles, Roles and Subordinates,** and **Users**. For this exercise,
    we will select email **To me**.'
  merge: -1
  img_proc: true
