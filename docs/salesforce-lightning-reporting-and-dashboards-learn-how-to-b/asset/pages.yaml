- pgno: 190
  md: 'The subtotal for **June 2016** is **55.44%**; this is calculated by *265,000
    / 478,000*100*. The same is for **July 2016** which is **44.56%**, which is calculated
    by *213,000 / 478,000*100*. The formula behind this is pretty simple and not much
    different from the one we used earlier: *AMOUNT:SUM / PARENTGROUPVAL(AMOUNT:SUM,
    GRAND_SUMMARY)*; in short, this formula will divide the monthly subtotal by the
    **GRAND TOTAL**.


    # Using the PARENTGROUPVAL() function in the Matrix report


    In the **Matrix** report, the syntax for this function is *PARENTGROUPVAL(summary_field,
    parent_row_grouping, parent_column_grouping)*.


    The same is true with the **Summary** report; the `PARENTGROUPVAL()` function
    is not applicable when you select the formula displayed as **All summary levels**.
    This function is applicable only when you select **At a specific row/column grouping
    level...**.


    The grouping level parameter in the **Summary** report is split into two parameters
    in the **Matrix** report: **parent_row_grouping and parent_column_grouping**.


