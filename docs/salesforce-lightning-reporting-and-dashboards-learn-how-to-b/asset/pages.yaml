- pgno: 168
  md: '# Editing a bucket field


    You can edit a bucket field by hovering your mouse over the bucket field in the
    top-left panel and then clicking on the pencil icon. You can delete a bucket field
    by clicking on the trash bin icon next to the pencil icon.


    Clicking on the pencil icon will open the bucket field window; to remove selected
    values from the bucket field value, perform the following steps:


    +   1. Click on the bucket; it will show all values selected for that bucket.

    +   2. Click on the checkbox to select the value.

    +   3. Click on the Move To button and then click on Unbucketed Values or a different
    bucket. Consider the following screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_168_0.png)


    # The Custom Summary Formula


    Do not confuse a custom summary formula in the report with a formula field for
    an object. They are totally different things and not related at all, although
    they both have a formula.


    The custom summary formula is only available in the Summary, Matrix, and Joined
    reports. Use a custom summary formula to calculate additional totals based on
    the numeric fields available in the report or the record count. The same holds
    true with the bucket field discussed earlier in this chapter. A custom summary
    formula created in a report will not affect any other places and is not related
    to other reports.'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'When you need to get a value from a Lookup or Master-Detail Relationship object,
    the formula field is the answer; you cannot use the custom summary formula in
    the report for this purpose. So whenever you need to get a field value from the
    parent lookup object for any usage (including for the report), create a formula
    field and then hide it from the page layout. However, only the system admin will
    be able to create the formula field.


    When you create a custom summary formula, you need to define the format to return
    and also define how many decimal points are to be returned. Here are the format
    options to be returned by the custom summary formula:


    +   - Currency

    +   - Number

    +   - Percent


    Only the following field types can be used in the formula for the custom summary
    formula:


    +   - Currency

    +   - Number

    +   - Percent

    +   - Record Count

    +   - You also can use the formula field and the roll-up summary fields that are
    returned in the preceding field types

    +   - Similar to the summarizing field option in the report, you can use these
    in the custom summary formula: Sum, Max, Min, and Average; for example, `Account.Number_of_Branch__c:SUM`


    # The Custom Summary Formula in Summary and Matrix reports


    In the Summary report, the custom summary formula can be displayed at:


    +   - **All summary levels**: This would be similar to field summarize

    +   - **Grand summary only**: This is the same with the grand total'
  merge: -1
  img_proc: true
