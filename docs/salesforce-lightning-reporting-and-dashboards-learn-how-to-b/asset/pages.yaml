- pgno: 53
  md: '# Standard reports and report folders


    When you start using Salesforce, by default, Salesforce comes with a lot of standard
    reports for different purposes. They are stored and categorized by the object
    name and purpose, such as, Account and Contact Reports, Opportunity Reports, and
    so on.


    As of the Summer ''17 release, standard reports with their folders are only visible
    in Classic, but not yet in Lightning Experience.


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_53_0.png)


    The preceding screenshot is taken from Classic (check the *Switch to Lightning
    Experience* section of *Chapter 1, Fundamentals of Salesforce Reports and Dashboards*,
    on how to toggle between Classic and Lightning Experience). Notice that in Classic,
    when you click on the **Reports** tab, you will see content from both reports
    and dashboards, and you can easily differentiate between the reports and dashboards
    folders by looking at the different icons before the folder name.


    In Classic, you will be able to search within the tab, while in Lightning Experience,
    reports and dashboards are located in different tabs. No search box is available
    in the tab, but you can use Global Search to search for reports and dashboards.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Creating report and dashboard folders


    Creating a report folder and dashboard folder in Salesforce is pretty simple.
    As long as you have the right permission, you should see the New Folder button
    in the Reports tab to create a report folder, and the New Folder button in the
    Dashboards tab to create a dashboard folder. You need to have the appropriate
    permissions to be able to create the report and dashboard folders. We''ll discuss
    permissions in detail later in this chapter.


    Let''s have a quick hands-on exercise to create a report folder. Remember, each
    report needs to be stored in a folder, so it is good for you to understand the
    folder itself in more detail.


    # Hands-on exercise to create a report folder


    Make sure you have appropriate permissions to create report folder. Let''s create
    a report folder with the help of the following steps:


    +   1. Navigate to the Reports tab.

    +   2. Click on the New Folder button on the top-right corner of the window, as
    shown in the following screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_54_0.png)


    +   3. Enter My First Report Folder in Name as the report folder name.

    +   4. Click on the Save button; a pop-up message will indicate whether the folder
    has been created successfully.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '5. The folder we just created, `My First Report Folder`, will be shown in **All
    Folders**, and also in the **Created by Me** folder, as shown in the following
    screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_55_0.png)


    Looking at the preceding screenshot, let''s walk through each menu under reports:


    +   - **Recent reports:** This will show all the reports recently opened by you,
    so your colleagues will have different recently opened reports

    +   - **Created by Me:** This contains all the reports you created no matter which
    folder the reports are stored in

    +   - **Private Reports:** This is a secure folder to store reports for your personal
    usage; reports stored here are not accessible by other users and you cannot share
    the folder with other users

    +   - **Public Reports:** This contains all reports which are visible to everyone


    > TIP: Since this folder is accessible by all users, and it can be edited or deleted
    by anyone, be careful not to store your private or important reports in this folder.


    +   - **All Reports:** This will show all the reports that you have access to
    open'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'And here is the menu under **FOLDERS**:


    +   - **Created by Me:** This will show all the report folders created by you

    +   - **Shared with Me:** This is the list of report folders created by your colleagues,
    but shared with you

    +   - **All Folders:** This will list all the report folders that you have access
    to including report folders created by your colleagues or installed as part of
    an app install from AppExchange


    # Report and dashboard folders sharing


    The same with creating the report and dashboard folder, as of the Summer ''17
    release, sharing the public reports and dashboards folder can be done in Classic
    only.


    Click on the **Reports** tab, hover your mouse over the folder you want to share,
    and click on the pin icon next to the folder name--you will see the **Share**
    option. If you just see **Pin to top** and **Share**, but not **Edit** and **Delete**,
    that means you are not the Manager for that folder. We''ll walk through the folder
    access level in this chapter. Following is the screenshot to share report folder
    from Classic:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_56_0.png)'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'A user can share a folder with **Users, Roles, Roles and Subordinates, or Public
    Groups**, and with the level of access of **Viewer, Editor,** and **Manager**.
    Check the following screenshot for sharing reports with other users:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_57_0.png)


    To share a report folder, a user must have the following:


    +   - **Manager** access level on that report folder

    +   - The Manage Reports in Public Folders permission


    > When you create a folder, you will be automatically set as **Manager** for the
    folder.


    There are three levels of access for report and dashboard folders, which are explained
    in the following table:


    | Viewer | Editor | Manager |

    |---|---|---|

    | • View a folder in the folder tree<br>• View all contents<br>• Run report, refresh
    dashboard | • Everything from **Viewer** access, and the following:<br>• Edit
    all contents of a folder<br>• Add contents to a folder<br>• Delete contents from
    a folder | • Everything from **Editor** access, and the following:<br>• Edit a
    folder name<br>• Edit/delete/remove shares |'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# Hands-on exercise for sharing report folders


    Now, let us explain, step-by-step, how to share a report folder.


    Use case: You would like to share the `My First Report Folder` folder with a user
    with the role as CEO with the level of access as **Viewer**, and to a Finance
    Manager, let''s name it **Jack Fin** as folder Manager (you can use other usernames
    for this exercise). Assume the role CEO exists, and a user with the name `Jack
    Fin` has been created.


    +   1. Navigate to the **Reports** tab.

    +   2. Click on the report folder `My First Report Folder` created earlier, hover
    your mouse over the report folder name, and click on the pin icon, then on **Share**:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_58_0.png)


    +   3. It will open a popup window; click on the **Roles** link, and then on the
    **Share** button next to CEO. Leave the access menu as **Viewer**, and click on
    the **Done** button to continue.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '4. Next, click on the Users link, and look for Jack Fin. Click on the Shared
    button next to that user. The default access would be Viewer; click on the arrow
    next to it, and select Manager. Now click on the Done button to continue as shown
    in the following screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_59_0.png)


    4. Click on the Close button to close the window.


    In this hands-on exercise, you learned how to share a report folder with a user
    with Manager-level access, and with users in a role to view reports.


    # Report permissions


    When we discussed the report and dashboard folders in the chapter earlier, you
    may have noticed that we talked about permissions to create report, to create
    report folder, and so on. Permission is the basic setting that controls the ability
    of a user to do things in Salesforce including reports and dashboards.


    Before we start to create a report, we''ll discuss a few permissions, which determine
    the ability of a user to run, create, edit, export, schedule, and subscribe reports
    in Salesforce.


    # Run reports


    This is the basic permission needed to run a report. Without the Run Reports permission,
    you will not be able to run any report in Salesforce. When you try to click on
    the report, you will get an error message that says You don''t have permission
    to run reports. Check that you have the Run Reports user permission, as shown
    in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 60
  md: '![](img/72d01bea5a9ccf02f9452aab7505d9de_60_0.png)


    When all users in a profile need to run a report, the admin can simply enable
    this permission in Profile under the General User Permissions section. To assign
    this permission to users in different profiles, use Permission Set instead. Remember
    that Permission Set will only add permissions per user basis, not to remove permissions
    and is not related to the user Profile.


    This permission also controls the ability of a user to access a dashboard. We
    will cover dashboards in detail in Chapter 9, Building Dashboards in Lightning
    Experience. If you cannot run a report, contact your admin to get this permission
    enabled.


    Quick check if you have this permission enabled, click on the Reports tab, and
    then click on the All Reports menu. You should see the report generated in seconds,
    but if you see an error message as in the previous screenshot, this means you
    do not have permission to run the report. If you do not see the Reports tab at
    all, check out the Navigating to reports and dashboards section of Chapter 1,
    Fundamentals of Salesforce Reports and Dashboards.


    # Create and customize reports


    The Create and Customize Reports permission controls the user''s ability to create
    a new report, or modify an existing one. Without this permission, the user will
    not see the New Report button under the Reports tab. This permission requires
    the Run Reports permission, so, if the Run Reports permission is disabled for
    a user, automatically, the Create and Customize Reports is also disabled for the
    user. Similarly, when you enable the Create and Customize Reports permission,
    the Run Reports permission will be auto-enabled as well.'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'When you have this permission enabled, you should see the **New Report** button,
    otherwise, you will not be able to create and customize reports. Talk to your
    admin to get this enabled if you need to create or customize a report. The following
    screenshot shows the user has permission to create the report:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_61_0.png)


    # Export reports


    The **Export Reports** permission manages a user’s ability to export a report
    into Excel or CSV file format. Similar to the **Create and Customize Reports**
    permission, this permission also depends on the **Run Reports** permission. Disabling
    the **Run Reports** permission will auto disable this permission. But this permission
    does not depend on the **Create and Customize Reports** permission, which means
    that a user may be able to export a report even if she or he is not able to create
    or customize a report.'
  merge: -1
  img_proc: true
- pgno: 62
  md: "# Concepts and Permissions in Reports and Dashboards\n\nWhen you open a report,\
    \ and you have this permission enabled, you will see the **Export** link under\
    \ the arrow dropdown next to the **Edit** button. Consider the following screenshot:\n\
    \n![](img/72d01bea5a9ccf02f9452aab7505d9de_62_0.png)\n\n> \U0001F4A1 **TIP** \
    \ \n> In Classic, there is an option to export reports as printable view. The\
    \ exported Excel file will retain the format, and the summary information with\
    \ the report will be generated in Salesforce.\n\n# Subscribe to reports\n\nThe\
    \ **Subscribe** to reports permission enables users to subscribe to reports for\
    \ delivery to their email address without the need to open the report. When you\
    \ subscribe to reports in Lightning Experience, you will receive refreshed report\
    \ results by email on a schedule that you set—**Daily, Weekly, or Monthly**."
  merge: -1
  img_proc: true
- pgno: 63
  md: 'A user with this permission will see the **Subscribe** button after the report
    opens, as shown in the following screenshot. We will discuss subscribing to a
    report in detail in Chapter 8, *Working with Reports*:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_63_0.png)


    There are two permissions related to this permission, which is as follows:


    +   - **Subscribing to reports by adding recipients**: This permission will allow
    you to add other users to get the e-mail delivery. By default, you are included,
    but you can remove yourself when you add someone else.


    +   - **Subscribing to reports by setting a running user**: This permission will
    allow you to specify the running user as someone else as long as that user has
    access to the report.


    # Dashboard permissions


    After looking at report permissions in the last section, let''s now look at dashboard
    permissions available in Salesforce. Permissions in dashboards determine the ability
    of a user to open, create, and edit dashboards in Salesforce.


    # Run reports permission


    We have discussed the **Run Reports** permission in the *Report permissions* section,
    and we are not going to repeat that here, but we would like to emphasize that
    dashboards in Salesforce are based on reports. Each dashboard component in Salesforce
    is supported by a report as the backend data source.'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'To allow a user to open or view a dashboard in Salesforce, the user needs to
    have the permission to run reports, and the dashboard viewing user must have access
    to the reports used as the data source for the dashboard components. Without the
    **Run Reports** permission, the user will get an error message saying **You don''t
    have permission to run reports. Check that you have the Run Reports user permission.**
    when opening a dashboard.


    **Run Reports** is a basic permission needed by every user working with reports
    and dashboards in Salesforce, even to just run or open a report or dashboard.


    # Creating and customizing dashboards permission


    The **Create and Customize Dashboards** permission controls the user''s ability
    to create a new dashboard or modify an existing one. Without this permission,
    the user will not be able to see the **New Dashboard** button when they click
    on the **Dashboards** tab.


    This permission requires the **Run Reports** permission too. If the **Run Reports**
    permission is disabled, enabling **Create and Customize Dashboards** is useless
    for the user.


    # Manage dynamic dashboards permission


    The Manage dynamic dashboards permission allows users to create and edit dynamic
    dashboards. We will look into Dynamic Dashboards in more detail in *Chapter 10,
    Learning Advanced Dashboard Configuration*. But for now, you just need to understand
    that a dynamic dashboard allows login user to select other users as viewing user,
    based on the user permissions and role hierarchy.'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'When creating or editing a dashboard, a user with this permission will have
    options to set the dashboard running user as the logged-in user, or to allow a
    user who opens the dashboard to change the viewing user. The following screenshot
    shows enabling a dynamic dashboard:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_65_0.png)


    # The View My Team''s Dashboards permission


    The View my team''s dashboards permission allows users to view dashboards owned
    by people under them in the role hierarchy.


    When creating or editing a dashboard, the user with the **Manage Dynamic Dashboards**
    permission and **View My Team''s Dashboards** permission has an option to set
    **Dashboard Running User**, and to enable **Let authorized users change running
    user**.'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'When opening a dynamic dashboard, the user without the **View My Team''s Dashboards**
    permission will not be able to change the dashboard viewing user. However, a user
    with this permission will be able to change and enter a user in his/her team in
    the role hierarchy as viewing user. A user with the **View All Data** permission
    will be able to enter any other user as a viewing user. The following screenshot
    shows how to change the dashboard viewer:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_66_0.png)


    # Schedule dashboards


    We will discuss dashboards in *Chapter 9, Building Dashboards in Lightning Experience*,
    but for now, you should know that when you open a dashboard, it does not present
    the latest data, but the data of the dashboard last refreshed by you, or refreshed
    by your colleague, or data scheduled for auto-refresh.


    Salesforce offers the ability to refresh a dashboard up to a limit for a user
    with the **Schedule Dashboard** permission. I will share more on this in *Chapter
    9, Building Dashboards in Lightning Experience*, but for now, just note that we
    can schedule dashboard refresh, and e-mail the dashboard to ourselves or to other
    users.


    As of the Summer ’17 release, this feature is only available in Classic, and not
    yet in Lightning Experience.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# Summary


    In this chapter, we started with a discussion on source data, and that a Salesforce
    report is generated based on the live data in Salesforce. It shows only the data
    and fields that the user has access to and visibility of. Reports are needed to
    build dashboards, because each dashboard component needs to have a report to serve
    as the data source. A dashboard in Salesforce is not auto-refreshed when the user
    opens it; the user needs to refresh it, or schedule it for a refresh.


    We continued with how and where reports and dashboards are stored in Salesforce,
    that is, folders. We discussed multiple types of folders: private, public, and
    standard. We also discussed the types of user access levels to the folders.


    Next, we learned about permissions, where permission is the basic that controls
    what a user can do and see in Salesforce, including reports and dashboards. We
    walked through multiple permissions related to reports and dashboards.


    In the next chapter, we will explain how to secure the reports and dashboards
    created--for your personal usage, or for sharing with your team. We''ll also discuss
    the configurations required to allow a group of all users to have a read access
    to the report, and allow some members to modify the report.'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# # Implementing Security in

    # Reports and Dashboards


    This chapter will explain how you can secure reports and dashboards in Salesforce.
    As we discussed in the Chapter 2, *Concepts and Permissions in Reports and Dashboards*,
    each report and dashboard are stored in a folder, and the report and dashboard
    accessibilities are controlled by the folder that stores the report and dashboard--not
    by the report or dashboard itself.


    We also discussed permissions related to reports and dashboards in the previous
    chapter. In this chapter, we will continue with permissions related to the reports
    and dashboards folder. There are many permissions available related to folders,
    for example, a user with certain permissions will be able to see all public folders,
    even if the username is not added in the folder. We''ll go through all these scenarios.


    By the end of this chapter, you will have gained a strong understanding of how
    to secure your reports and dashboards, and how to make sure that the reports and
    dashboards shared with your team are secure. As admin, you will become aware of
    the many types of permissions related to report and dashboard folders, and that
    these should not be enabled for each user.


    The topics covered in this chapter are as follows:


    +   - Private reports and dashboards

    +   - Unfiled public reports

    +   - Public reports and dashboards

    +   - Report folder permissions

    +   - Dashboard folder permissions

    +   - Applying permissions'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# Securing private reports and dashboards


    Private Reports are reports that are accessible to the report owner only (the
    user who creates the report) regardless of the user role or profile. The same
    also applies to Private Dashboards.


    In Chapter 2, Concepts and Permissions in Reports and Dashboards, we explained
    that your admin may be able to access your private reports and dashboards. This
    is possible when the setting for Administrators Can Log in as Any User is enabled--the
    setting is located under the Login Access Policies setup. You can imagine this
    similar scenario with your office email, which can be accessed by the email server
    admin--they should not do this unless it is necessary and this activity is logged.


    Users with the permission to create reports or create dashboards will be able
    to store the reports and dashboards that they create in their private folder.
    For reports, the folder is called My Personal Custom Reports, and for dashboards,
    it is called Private Dashboards (in Lightning) and My Personal Dashboards (in
    Classic). Consider the following screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_69_0.png)'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'To secure your personal reports, which means that no one should able to view,
    change, or delete the reports, store the report in the **My Personal Custom Reports**
    folder. The report will be not accessible by other users, even if they have the
    URL. The same can be done for dashboards--store them in the **Private Dashboards**
    folder for private access. Consider the following screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_70_0.png)


    But even if it is a private report, the report will still honor data visibility;
    you will see only that data in the report which only you can see. Similarly, when
    you create or edit a report, you can add only those objects and fields into the
    report which you have permission for. Object and field visibility in a report
    is also controlled by report type, and we will discuss report type in chapter
    5, *Understanding Report Types.*


    In short, to secure your private reports and dashboards, store them in your personal
    folders, that''s all. Since those reports and dashboards will not be accessible
    to anyone, you will not be able to share them with other users.


    # Using Unfiled Public Reports


    In Chapter 2, *Concepts and Permissions in Reports and Dashboards*, we discussed
    **Unfiled Public Reports** briefly. This folder is accessible by any user, so
    any user with **Run Report** permissions will be able to run the reports stored
    in this folder, and to copy (save as) the report from this folder to other folders
    (including to the user''s private folder). There is nothing that can be done to
    secure this folder.'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'But this does not mean you can delete or modify any reports stored in this
    folder. You will be only able to delete or modify reports that you create and
    store in this folder unless you have specific permissions--we will discuss this
    further in this chapter.


    # # Using public reports and dashboards


    We discussed Public Folder in Chapter 2, *Concepts and Permissions in Reports
    and Dashboards*, all reports and dashboards stored in public folder is known as
    public report and public dashboard. Public report is one of the easiest ways to
    make sure that your team sees its data as defined, for example, the report **My
    Team''s Pipeline Next Quarter** will show all the opportunities under your team
    (yourself and your subordinates, including the subordinates of your subordinates--imagine
    this as multilevel hierarchy) that need to be closed by the next quarter. Your
    organization may have its own pipeline stages, and maybe, a different quarter
    period. With a shared team report, all sales managers will see the correct pipeline
    for their team, while a sales representative (individual contributor) will see
    the pipeline for himself, with defined stages and period.


    Let''s take a look at the following screenshots. Michael is a sales manager, and
    Jack is a sales representative who reports to Michael. When Michael opens the
    report, he will see the following report:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_71_0.png)


    Because Jack is Michael''s subordinate under the role hierarchy, Jack''s pipeline
    will show in Michael''s report.'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'Ideally, each user in Salesforce has a role defined by the admin. The role
    determines data visibility of a user in Salesforce. A role may have multiple direct
    roles below that role, but only one direct role above. This relationship forms
    the role hierarchy, which pretty much resembles the company''s organization chart.
    A record owned by a user will be visible to users with role hierarchy above the
    record owner.


    When Jack opens the same report, since he doesn''t have any subordinate, he sees
    only his own pipeline, as shown in the following screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_72_0.png)


    The same type of report can be used for the whole organization. The report will
    respect the role hierarchy defined for all users, from CEO down to the sales representative
    role. To create this kind of report, technically you just need to filter with
    criteria to show My team''s opportunities, as shown in the following screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_72_1.png)


    If the report has to serve all the users in the company, make sure it is stored
    in a folder accessible by all users, such as report of global sales.


    To share a folder with all users within the company, you can share it with a group
    called All Internal Users. This group is auto-generated by the system, and has
    all active users added as members.'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'Why do we need to store this report in **Global Sales Reports** instead of
    the **Unfiled Public Reports** folder discussed earlier? Housekeeping and best
    practice. It is easier to find a report from a specifically named folder rather
    than putting them all together into **Unfiled Public Reports**. Over time, the
    Unfiled Public Reports folder will become very messy with all reports added if
    not properly managed and cleaned.


    The team report can also be used for individual consumption. For example, the
    **My Closed Opportunity This Fiscal Year** report will show all the closed opportunities
    owned by the user who runs the report--this should show all the won and lost opportunities
    owned by you within the company fiscal year. When the report is run, each user
    will see different opportunities based on ownership. Management can define the
    keys matrix for the report, which each team member should take care of, such as
    **Amount, Close Date, Probability**, and so on. To create this kind of report
    is even simpler--you just need to filter with the criteria to show **My opportunities**.
    Consider the following screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_73_0.png)


    # Sharing and securing public reports and dashboards


    In an earlier part of this chapter, we emphasized that report and dashboard security
    and accessibility is defined by their report folder. Hence, it is best practice
    to store all reports and dashboards for a team in the same folder. If you are
    the one who manages the folder, you need to create report folder permissions,
    or get your admin to create the report folder for you, and assign Manager-level
    access to the report folder. This also applies for dashboard as well.


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_73_1.png)


    The one who creates the report folder will automatically have Manager-level access
    for that folder.'
  merge: -1
  img_proc: true
