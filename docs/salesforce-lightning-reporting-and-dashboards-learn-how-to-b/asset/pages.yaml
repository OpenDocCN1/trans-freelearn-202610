- pgno: 113
  md: '# Working with report filters


    A report is one of the most powerful features of the Salesforce platform; depending
    on your permissions, you can build your own reports within minutes and manage
    them without help from Salesforce administrator or Salesforce developer.


    We have discussed many things related to the report in previous chapters, including
    the permissions to create a report, permissions related to the report folder,
    and the report format that presents the report layout.


    Another important item related to reporting is **report filters**. Report filters
    allow you to define which data conditions you want to use in order to include
    records in a report based on some criteria. The filter criteria in the report
    are almost similar to the filter criteria we found in other Salesforce features,
    such as List Views, Workflow Rules, and other areas in Salesforce, but the filter
    criteria in the report are even more powerful.


    For each filter criterion, you need to set the field, operator, and value. You
    can have multiple filters for a report. The default relationship for each filter
    is the one using AND, but you can customize it using filter logic.


    When you are in the report builder, if you click on the **Add** button for Filters,
    it will automatically add a new filter, but note that there is a small arrow button
    next to **Add**; if you click on this arrow, a few options available for the report
    filter are as follows:


    +   - **Field Filter**: This is the same action as clicking on the **Add** button

    +   - **Filter Logic**

    +   - **Cross Filter**

    +   - **Row Limit**: Only for the **Tabular** report format


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_113_0.png)'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# # Field filter


    Simply click on the **Add** button in the report builder to add a field as a filter,
    or you also can drag fields from the **Fields** panel to the **Filters** panel
    to add a report filter.


    Once the field is added to the **Filters** pane, select the operator and then
    enter the value.


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_114_0.png)


    If you would like to add multiple values to a filter value, simply use a comma
    to separate the values.


    For each filter, you can enter special values based on the field type for that
    particular filter. Some items you need to know related to the report filter are
    as follows:


    +   - The filter value is case-insensitive.

    +   - When you filter the **Date** field, you can enter special date values, such
    as `TODAY`, `NEXT WEEK`, `LASTWEEK`, `LAST <x> DAYS`, `LAST <x> YEARS`, and so
    on. For complete Date Formats and Date Literals, refer to this Salesforce link
    `https://developer.salesforce.com/docs/atlas.en-us.soql_sosl.meta/soql_sosl/sforce_api_calls_soql_select_dateformats.htm`.

    +   - For filtering values with a comma, put quotation marks around the text,
    for example, `Johan, LLC`; otherwise, it will filter as `Johan` or `LLC`.

    +   - If you implement Multi-Currency, you can add the currency code in the filter
    criteria, such as `USD 2500`, `SGD 8000`, `JPY 10000`.

    +   - For the picklist field, you can use the magnifying glass to select one or
    more choices to be included in the filter, or you can also manually type it in.
    But when you edit the filter again, the existing selected values will not be selected
    when you use the magnifying glass; if the existing values are no longer valid,
    delete them manually in the textbox.

    +   - For multi-select picklist fields, type in the values and use a semicolon
    between values to specify the exact match.

    +   - You can lock filters added by ticking the **Locked** checkbox, so other
    users will not be able to change or remove them when they run the report.


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_114_1.png)


    If you do not have access to a field defined as a filter, it will be removed from
    the filter criteria and will display results based on the remaining filters.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# The Filter Logic


    If you have more than one filter in a report, adding filter logic will let you
    specify conditions for your filters using logical operators between the filters.
    When you add filters to a report, by default, all filters are related as AND logic,
    for example:


    +   - Type contains Customer

    +   - Country equals United States

    +   - Employees greater than 1000


    This is how it would look when you configure it into Salesforce:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_115_0.png)


    If you notice, AND will be added to a new filter line by default. With filter
    logic, you can specify whether to use the AND, OR, or NOT operator.


    With the preceding filter criteria, the report will generate all accounts with
    Type contains "Customer", Billing Country equals to "United States", and Employees
    more than "1000" people. But how about if we would like to get all accounts with
    Type contains "Customer" and Billing Country equals to "United States" or Employees
    more than "1000" people, where the last filter (Employee) does not depend on Type
    and Country.


    Without filter logic, we need to create two separate reports and combine them
    manually, one report with the filter Type contains "Customer" AND Billing Country
    equals "United States" and another report with the filter Employees greater than
    "1000".'
  merge: -1
  img_proc: true
