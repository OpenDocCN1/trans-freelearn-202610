    +   - When other users click on **View Report**, they will see the data as themselves
    (the logged-in user); the report generated is not related to the dashboard viewing
    user anymore; therefore, the number may not be the same as in the dashboard data.


    # Hands-on exercise for editing and maintaining a dashboard


    There are two ways to edit a dashboard:


    +   - Open the dashboard and click on the **Edit** button, as shown in the following
