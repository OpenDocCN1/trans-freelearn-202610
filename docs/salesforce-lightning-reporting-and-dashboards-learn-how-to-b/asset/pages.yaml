- pgno: 381
  md: '# Dashboards and Reports in the Salesforce1 Mobile App


    When you open a report in the Salesforce1 mobile app, the report format will be
    ignored. **Summary** and **Matrix** format reports will be presented just as columns,
    similar to **Tabular** reports. If the report has a chart added, it will not be
    visible when the report opens in Salesforce1.


    In the **Tabular** format report, the first column will be frozen, so, when you
    scroll to the right to see more columns, the first column will stay visible. For
    **Summary** and **Matrix** reports, the first column (not the group fields) will
    be frozen, while fields used as a group will be the last columns.


    You can sort the report by tapping on the column header; by default, it will be
    sorted in the ascending order--you can tap the header again to change it to sort
    in the descending order.


    # Drilling down from dashboards


    As you know, a report is the data source for the dashboard. When you select and
    expand the dashboard component in the Salesforce1 mobile app, you can drill down
    into the report used as the data source. When the report opens, it shows the chart
    above the report. If the original report has a chart added, the original chart
    will not show in the Salesforce1 mobile app.


    You can filter data in the report based on dashboard grouping by tapping on the
    group in a chart of the report, except for the **Table** and **Matrix** components.
    When you tap on an item of the chart, it will prompt you to show more information
    on that segment, and the report generated will be automatically refreshed and
    filtered with the segment selected. This is shown in the following screenshot:'
  merge: -1
  img_proc: true
