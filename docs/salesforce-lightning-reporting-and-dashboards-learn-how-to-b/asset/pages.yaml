  md: '+   - Hovering your mouse over the chart will get you more information on that
    chart slice.

    +   - In this exercise, we proved that we can use the same report for more than
    one component in the same dashboard, and we can use it for a different type of
    chart.

    +   - Notice this under the dashboard title, **As of May 14, 2017 10:22 PM - Viewing
    as Johan Yu.** This means that other users who view the dashboard will see the
    same as the user **Johan Yu**, with data refreshed on **May 14, 2017 10:22 PM**.
    If the object sharing is private, the user will see the dashboard with the data
