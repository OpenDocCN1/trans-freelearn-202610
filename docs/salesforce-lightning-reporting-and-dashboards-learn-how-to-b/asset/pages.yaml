- pgno: 98
  md: '16. Click on Save from the drop-down arrow to save all changes in the report.
    With this, you can save the report without the need to edit it from report builder:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_98_0.png)


    # The Matrix report format


    The Matrix report is pretty similar to the Summary report, but with the additional
    capability to group by both rows and columns. You also can have up to two levels
    of grouping for both rows and columns.


    Similar to the Tabular and Summary report format, you can add summarizable fields
    in Matrix reports. By default, the record count is added into the report matrix.
    When you add the summary field in the Matrix report, the field and summary will
    be shown in the matrix, not at the bottom of the column as in the Summary or Tabular
    report format. Once you add a summary field to the Matrix report, you can remove
    the default record count from the matrix if you don''t need it.


    This report''s format is good when you have large amounts of data to summarize
    and need to compare records with different values in the same field with the Matrix
    report. The Matrix report, without at least one row and one column grouping, will
