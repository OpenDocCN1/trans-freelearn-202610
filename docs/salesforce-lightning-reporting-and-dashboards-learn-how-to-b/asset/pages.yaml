- pgno: 205
  md: '# Adding Charts in Reports and Pages


    Each chart format has its own extra features, such as an inline chart, and you
    can enable the cumulative value in a stacked bar chart, you can set all bar lengths
    to 100%, and so on.


    Let''s understand each type of chart available in Salesforce.


    # The Horizontal Bar chart


    The Horizontal Bar chart shows values as horizontal lengths, so this format is
    good for comparing values. Select a Horizontal Bar Chart format when you have
    many values on the y-axis, for example, a pipeline report based on **Sum of Amount**
    and **Sum of NRR Amount** for each sales representative. If we have 20 sales representatives,
    the charts will still look good and not be too crowded.


    When you hover your mouse above the chart, it will show you more detailed information
    of the bar, including the x-axis value, the y-axis value, and the percentage of
    the bar compared to the total. See the following screenshot for a Horizontal bar
    chart, including information popup when you hovering the mouse over a bar:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_205_0.png)'
  merge: -1
  img_proc: true
