- pgno: 75
  md: '# The Create Report Folders permission


    The **Create Report Folders** permission gives users the ability to create a new
    report folder. The **Create and Customize Reports** permission is required to
    be enabled for this permission.


    When this permission is enabled, once you are in the **Reports** tab, you will
    see the **New Folder** button; to create a report folder, click on the button,
    and provide the folder name under the **Create Folder** window, as shown in the
    following screenshot:


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_75_0.png)


    # The View Reports in Public Folders permission


    The **View Reports in Public Folders** permission gives the user visibility and
    access to all public report folders, although the user is not listed in the sharing
    access for that particular report folder. When you check through the Share menu
    in the report folder, the username with this permission will be not listed there.


    This permission is limited only to view a report, not to create a new report and
    store to that folder, or to customize the existing report in that folder. This
    permission should not be given to the standard user.'
  merge: -1
  img_proc: true
