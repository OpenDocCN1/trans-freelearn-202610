- pgno: 200
  md: '# Using the PREVGROUPVAL() function in Matrix report


    Let''s use the PREVGROUPVAL() function in the Matrix report.


    We would like to know the percentage of growth for **Total Amount** for each month:


    +   1. Create a **Matrix** report and group by **Close Date** (by **Calendar Month**)
    as the row grouping and **Stage** as the column grouping.

    +   2. Hide **Remove Count**, and hide **Details**. Filter only **Open** and **Won**
    opportunities.

    +   3. Create a formula summary called `Month by Month`; group it as **Closed
    Date** (by **Calendar Month**) and **Column Grand Summary**.

    +   4. Set the summary format to **Percent** with two decimal points.

    +   5. Enter this formula: `(AMOUNT:SUM - PREVGROUPVAL(AMOUNT:SUM, CLOSE_DATE))
    / PREVGROUPVAL(AMOUNT:SUM, CLOSE_DATE)`


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_200_0.png)'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# Advanced Report Configuration


    The summary formula will be added next to amount subtotal for each month; from
    here, we can easily check the month by month percentage and see that it increases
    for all Open and Won Opportunities:


    | CLOSE DATE | QUALIFICATION AMOUNT Sum | QUALIFICATION MONTH BY MONTH | ID. DECISION
    MAKERS AMOUNT Sum | ID. DECISION MAKERS MONTH BY MONTH | CLOSED WON AMOUNT Sum
    | CLOSED WON MONTH BY MONTH | Total AMOUNT Sum | Total MONTH BY MONTH |

    |---|---:|---:|---:|---:|---:|---:|---:|---:|

    | March 2016 | $0.00 |  | $15,000.00 |  | $22,000.00 |  | $37,000.00 | - |

    | April 2016 | $27,000.00 |  | $0.00 |  | $40,000.00 |  | $67,000.00 | 81.08%
    |

    | May 2016 | $55,000.00 |  | $50,000.00 |  | $0.00 |  | $105,000.00 | 56.72% |

    | June 2016 | $80,000.00 |  | $10,000.00 |  | $0.00 |  | $90,000.00 | -14.29%
    |

    | Total | $162,000.00 |  | $75,000.00 |  | $62,000.00 |  | $299,000.00 |  |


    Note that there are no value shown in the formula for March 2016 because it is
    the first value. In **April 2016**, an increase of **81.08%** is compared to the
    previous group, which is **March 2016**. **May 2014** sees an increase of **56.72%**
    compared to **April 2016**, and the last group shows a **-14.29%** decrease compared
    to the group earlier. As mentioned earlier, the `PREVGROUPVAL()` function will
    not know the value of the previous group. In this sample, it just shows nicely
    because there is no skipped month in the report.


    # Summary


    In this chapter, we explored the bucket fields and **Custom Summary Formulas**
    in detail. With the bucket field, we can categorize data for report purpose, and
    nothing needs to be done on the field in the object. This will eliminate the admin
    right to create a custom field, and if that field only serves for one or two reports.
    However, bucket fields are not used to replace formula fields; you can''t have
    a formula calculation in the bucket field; you can have it to group values into
    a bucket.


    Bucket fields only work for certain field types, and different field types will
    have different ways configured for the bucket value; you can use the range for
    currency, number, and percentage but not for others.'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'The **Custom Summary Formula** is not the same as a custom formula field. You
    can''t retrieve a value from another object using a **Custom Summary Formula**,
    and a **Custom Summary Formula** only lives in that report; it does not affect
    another report, object, or field, and you can''t use it from other reports.


    A **Custom Summary Formula** is not available in the **Tabular** report and when
    you change the report type with the summary formula, the existing summary formula
    will be deleted, so be aware of this.


    There are many functions available in **Custom Summary Formulas**; the value will
    be returned as a number, currency, or percentage only, and you can configure the
    decimal place returned. The formula accepts a limited type of field only, but
    this includes the formula field and the roll-up summary field.


    The `PARENTGROUPVAL()` and `PREVGROUPVAL()` functions are available only in **Custom
    Summary Formulas**. You can''t find them in another formula in Salesforce; they
    are very powerful functions. You can use the `PARENTGROUPVAL()` function to retrieve
    the group value from the parent group hierarchy and use the `PREVGROUPVAL()` function
    to retrieve the value from the previous group in the same level of the hierarchy.


    In the next chapter, we will discuss more features related to reporting, adding
    a chart to a report, and embedding a chart from a report into the parent record
    page.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# 7


    # Adding Charts in Reports and Pages


    Starting from Chapter 4, Creating and Managing Reports, you learned to create
    and manage reports, continued with report types in Chapter 5, Understanding Report
    Types, and then used bucket fields and Custom Summary Formula in Chapter 6, Advanced
    Report Configuration.


    In this chapter, we will continue by adding a chart to a report, and we will discuss
    multiple types of charts available in Salesforce Lightning and the types of report
    formats that support the addition of a chart, and we will walk through at a hands-on
    exercise on adding and working with charts in a report.


    Next, we will discuss how to add the chart from the report to the record page,
    for example, opportunities or cases related to an account in an account page;
    the chart here will be filtered by the account opened, and we will also cover
    a hands-on exercise on this.


    By end of this chapter, you will be fully equipped with knowledge of the types
    of charts in a report and will learn how to add and edit charts. You will also
    understand how to add charts in a report to the record page layout.


    Throughout this chapter, we will provide notes and tips to help you understand
    important items. The following topics will be covered:


    +   - Types of charts in a Lightning report

    +   - Adding a chart to a report

    +   - Adding embedded charts to the record page'
  merge: -1
  img_proc: true
