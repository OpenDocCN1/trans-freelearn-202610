    # Who this book is for


    This book is written for business analysts, reporting analysts, sales representatives,
    sales operations, and Salesforce administrators. This book is also for users who
    want to learn about Salesforce reporting and dashboards in depth using Lightning
    Experience. You will gain knowledge of items related to reports and dashboards
    in Salesforce, starting from creating basic reports and customizing them, and
    moving up to the most advanced reports and dashboards in Salesforce Lightning
    Experience.


    # Conventions


    In this book, you will find a number of text styles that distinguish between different
    kinds of information. Here are some examples of these styles and an explanation
    of their meaning.


    Code words in text, database table names, folder names, filenames, file extensions,
    pathnames, dummy URLs, user input, and Twitter handles are shown as follows: "Create
    an Account report and use the No of Won Opportunity field as the report filter."


    Any command-line input or output is written as follows:


    ```

    SELECT Id FROM Report USING SCOPE allPrivate WHERE OwnerId =

    ''00541000001cTYgAAM''

    ```


    New terms and important words are shown in bold. Words that you see on the screen,
    for example, in menus or dialog boxes, appear in the text like this: "Navigate
    to the Reports tab and click New Report button."


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_20_0.png)


    Warnings or important notes appear like this.


    ![](img/72d01bea5a9ccf02f9452aab7505d9de_20_1.png)


    Tips and tricks appear like this.'
