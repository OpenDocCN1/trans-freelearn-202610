  md: '# The Collaborate field


    If **Chatter Feed Tracking for Report** is enabled, this icon will be visible
    to all users able to open the report. To enable this, navigate to **Setup | Feature
    Settings | Feed Tracking**, look for **Report** in the left-side panel and tick
    **Enable Feed Tracking.**


    By default, it will have **Post** and **Poll** for collaboration. The same is
    the case with all other **Chatter** posts; you can mention other users using @
    followed by the username. Other users can **like**, **comment**, and **bookmark**
    the post, while for the user who posts in **Chatter** feed, the user also will
    be able to **Delete** and **Edit** the post.


    # Report settings


    For the **Matrix** and **Summary** reports, the user will have options to show
    or hide--**Details**, **Subtotals**, **Grand total**, and **Record counts**. Consider
