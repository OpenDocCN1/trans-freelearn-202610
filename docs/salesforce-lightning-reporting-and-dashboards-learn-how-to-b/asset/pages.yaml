- pgno: 312
  md: '# Getting more from AppExchange


    If you are not familiar with AppExchange, it is a business app store hosted by
    Salesforce.com for Salesforce users. You can find thousands of apps to be installed
    into your Salesforce instance to meet or enhance your business needs. Some of
    the apps are free, while many have a license fee. They are built by Salesforce
    partners. In addition, there are some sample apps that have been provided by Salesforce
    Labs. Salesforce Labs does not support the apps they post on the AppExchange,
    but it offers many examples of Salesforce features that help admins learn how
    to use these features.


    The app installed from AppExchange is considered a third-party app, which means
    it is not supported by the Salesforce Support team. For paid apps, usually, the
    developer will provide their support for their app.


    To reach Salesforce AppExchange, navigate to https://appexchange.salesforce.com
    and you will find many apps there, or you could search for them with the help
    of a keyword in the textbox.


    To find apps related to the dashboard, type dashboard in the search textbox, and
    you will get many dashboard apps built by Salesforce Labs which you can install
    and use it for free, and there are apps built by Salesforce partners, which are
    either free or paid apps.


    It is always a good practice to try the app installed into a Sandbox before installing
    it in a production environment. Also, even if you install an AppExchange package,
    you can uninstall it without causing any problems for your other Salesforce organizations.


    A few dashboard apps built by Salesforce Labs are as follows:


    +   - SALESFORCE CRM DASHBOARDS

    +   - SALES ACTIVITY DASHBOARD

    +   - SERVICE & SUPPORT DASHBOARDS

    +   - SALESFORCE1 ADOPTION DASHBOARD AND REPORTS'
  merge: -1
  img_proc: true
