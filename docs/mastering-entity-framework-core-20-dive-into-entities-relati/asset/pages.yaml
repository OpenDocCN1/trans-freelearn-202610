  md: "The source code required to add Required validation is shown here; it consumes\
    \ built-in validation and throws a default error message:\n\n```\npublic class\
    \ Blog\n{\n    public int Id { get; set; }\n    [Required]\n    public string\
    \ Url { get; set; }\n    public ICollection<Post> Posts { get; set; }\n    public\
    \ int AuthorId { get; set; }\n    public User Author { get; set; }\n}\n```\n\n\
