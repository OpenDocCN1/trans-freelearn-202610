    # Summary


    We have explored various built-in validations provided by EF in this chapter.
    We started with the Required field validator which was widely used, then looked
    into the email address validator, and then we covered other validators such as
    compare, MinLength, MaxLength and RegularExpression field validators. Finally,
    we configured these field validators for the blogging system we are building in
    this book. This chapter dealt only with built-in validations but never discussed
    how client-side validations are performed or custom validations handled. Let''s
    explore this and a few other things in Chapter 6, Save Yourself – Hack Proof Your
    Entities.'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# 6

    Save Yourself – Hack Proof Your Entities


    In Chapter 5, Know the Validation – Explore Inbuilt Validations, we understood
    about in-built validations available in the Entity Framework Core. We explored
    each one of the validation in detail by starting with how the validation were
    handled earlier, the way how framework handles it, the configurations required
    and the rendering performed by the framework.


    In this chapter, we will address the following concerns with respect to data security:


    +   - What should be done to the data before we send it over the network?

    +     - Could you make a wild guess on what should be performed before we send
    the data over the network?

    +   - What if someone hacks the client-side validation? Or the scripting stops
    working?

    +     - We could shield ourselves by introducing server-side validation.

    +   - Beyond client-side and server-side validations, do we need anything in addition?

    +     - Yes, usual server-side validations would look for any errors and validators
    of all properties of the model would be taken into account by manual validations.

    +   - Hoping we have custom implementations of validations as well?

    +     - Yeah, we do have provision to create custom validators and .NET Core''s
    data-attribute approach for custom validators as well.

    +   - Damn, we should have covered almost everything. Guess we didn''t leave behind
    anything else?

    +     - Except for one thing—remote validation. For instance, checking username
    availability could be done using remote validation from the client-side without
    adding any client-side code.'
  merge: -1
  img_proc: true
- pgno: 153
  md: "After addressing the concerns, we have a fair idea of what we will be covering\
    \ in this chapter:\n\n+   - Client-side validation\n+   - Consequences if the\
    \ client-side scripting stops working\n+   - Server-side validation\n+   - Manual\
    \ validation\n+   - Custom validation\n+   - Create client-side logic for custom\
    \ validation\n+   - Remote validation\n\n# Client-side validation\n\nThe client-side\
    \ validation is really a boon to modern web applications. There were many instances\
    \ that proved jQuery is helpful on both the development and the user experience\
    \ front. The client-side validations were the biggest advantage we had in saving\
    \ multiple round trips between client/browser to the server just to perform basic\
    \ validations.\n\nThe jQuery, jQuery Validate, and jQuery Validate Unobtrusive\
    \ libraries helped us in performing those basic validations on the client (browser)\
    \ end rather than relying on the server in performing the same. There were multiple\
    \ discussions or even arguments regarding validating the models at the client-side,\
    \ which opens security considerations. The following sections will address this\
    \ issue.\n\nThe task to enable client-side validation is just to provide a section\
    \ for MVC to inject validation errors in the user interface, which has nothing\
    \ to do with validation-related attributes (as it will be available in the model):\n\
    \n```\n```html\n<div class=\"form-group\">\n    <label asp-for=\"Title\" class=\"\
    col-md-2 control-label\"></label>\n    <div class=\"col-md-10\">\n        <input\
    \ asp-for=\"Title\" class=\"form-control\" />\n        <span asp-validation-for=\"\
    Title\" class=\"text-danger\"></span>\n    </div>\n</div>\n```\n```"
  merge: -1
  img_proc: true
- pgno: 154
  md: 'The MVC templating engine will generate the HTML tags with data- attributes,
    which will have the same behavior for both built-in and custom validations. The
    rendered HTML content for the previously mentioned Title field with the Required
    validation is displayed as follows:


    ```

    <div class="form-group">

    <label class="col-md-2 control-label" for="Title">Title</label>

    <div class="col-md-10">

    <input class="form-control" type="text" data-val="true" data-val-required="Title
    is required" id="Title" name="Title" value="" />

    <span class="text-danger field-validation-valid" data-valmsg-for="Title" data-valmsg-replace="true"></span>

    </div>

    </div>

    ```


    The validation is performed when the user tries to submit the form, which will
    end up in populating the error messages using client-side validation. Further,
    when we try to edit the messages, the Unobtrusive Validation library kicks in
    and does the validation way before the user submits the form again.


    We have seen what client-side validation does; now, let''s see what happens if
    the JavaScript stops working in the next section.


    # Validating data without client-side scripting


    We live in a world that recognizes the open source, performance-oriented, single
    page applications (reducing server round trips) as professional applications.
    Microsoft was too comfortable to move beyond server-side development. Later, they
    started experimenting client-side validations mainly, thanks to MVC2. Now, with
    MVC Core, they''re back in the game!


    This brings us to the million dollar question—is the client-side programming really
    safe? How long will it take for the hacker to break the client-side validation
    and get into the server? In today''s world, even a dummy who has just started
    to learn how to hack could do that in minutes. To be blunt, we have no control
    on the client, and we cannot blindly trust the data we receive from the client
    (which could be hacked/injected by anybody using tools such as Fiddler, REST Client,
    and many more).'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'Knowing that the data we receive may not be authentic, why do we still need
    client-side validation? Simple. We need better user experience, and we cannot
    simply ignore a mechanism that will provide us with a mechanism to achieve it.
    Not only authenticity, but also if somebody disables the JavaScript in their client,
    then we may be processing unsafe data (not validated) received from the client.


    The JavaScript could be disabled using the browser settings. The following screenshot
    shows how that can be performed using Chrome settings (Content | JavaScript):


