- pgno: 86
  md: "In the following code, the principal entity `Blog`, with its primary key `Id`,\
    \ will have the foreign key `BlogId` in the `Post` entity:\n\n```\npublic class\
    \ Blog\n{\n    public int Id { get; set; }\n    // Code removed for brevity\n\
    }\npublic class Post\n{\n    // Code removed for brevity\n    public int BlogId\
    \ { get; set; }\n}\n```\n\nThe following image illustrates the how a foreign key\
    \ is created in `Post` entity:\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_86_0.png)\n\
    \n+   - EF will create a foreign key relationship if the principal entity primary\
    \ key matches the dependent entity reference key."
