- pgno: 277
  md: '+   - If the concurrency column has valid data, then the update could be performed


    The algorithm could be visualized using the following flow chart:


    ![](img/17e01f90db603e72c0f0c6a7dce8920c_277_0.png)


    Let''s visualize the preceding algorithm to resolve the concurrency conflict we
    faced while updating the post:


    +   - The **Post** entity identifies and configures the `Timestamp` column as
    a concurrency check column

    +   - The concurrency implementation expects the `Timestamp` column to be valid:

    +     - The **Post** model, which we send to the framework to update, will have:

    +       - Current `Timestamp` value as a byte array

    +       - Original `Timestamp` value fetched from the database before presenting
    to the update screen'
  merge: -1
  img_proc: true
- pgno: 278
  md: "+   - The `Timestamp` value's original value should match with the existing\
    \ database value in the `Timestamp` value for the given row\n+   - If the value\
    \ doesn't match, concurrency exception should be thrown\n+   - If the value matches,\
    \ then the update is considered as valid and the framework allows the data store\
    \ to be updated\n\nWe will explore the way in which the Microsoft team actually\
    \ implemented the concurrency token mechanism:\n\n+   - EF Core introduced a custom\
    \ `Timestamp` attribute. Developers should mark one of the columns as the concurrency\
    \ column\n+   - The framework treats this column especially by marking the data\
    \ loaded on the concurrency column in the context as the original value of the\
    \ concurrency token\n+   - When the user tries to update the record, it would\
    \ check the original value against the value available in the database\n+   -\
    \ If the values don't match, then the framework throws a concurrency exception\n\
    +   - If both the values match, then the update is allowed by the framework\n\n\
    The concurrency token mechanism previously discussed matches with the flow diagram\
    \ we used in this section. The concurrency is handled using the `Timestamp` property\
    \ of the `Post` model, displayed as follows:\n\n```\npublic class Post\n{\n  \
    \  // Code removed for brevity\n    [Timestamp]\n    public string Timestamp {\
    \ get; set; }\n}\n```\n\nWe have exhaustively learnt about what is a concurrency\
    \ conflict, how it could be handled, and how Microsoft has supported concurrency\
    \ in EF Core. In the next section, we will learn how to configure and use them\
    \ in applications."
  merge: -1
  img_proc: true
- pgno: 279
  md: "# Non-timestamp based concurrency tokens\n\nThe knowledge we gained about concurrency\
    \ tokens and how the implementation was performed in the EF Core Framework would\
    \ be useful in introducing concurrency tokens in this section.\n\nIntroducing\
    \ the usages of concurrency tokens would be a meager topic, so we will implement\
    \ them in the blogging system and see them in action. After all, talking about\
    \ algorithms and scenarios would not be sufficient. In order to understand and\
    \ grasp the topic, we need to handle them in action, so let's do it.\n\nThe concurrency\
    \ token could be configured in the following ways:\n\n+   - Data annotations\n\
    +   - Fluent API\n\nWe will see how the configurations were performed using both\
    \ the approaches in our blogging system in the next two sections.\n\n# Configuring\
    \ non-timestamp tokens through data annotation\n\nThe data annotation configuration\
    \ is straightforward; we have already seen the annotation in the Introducing concurrency\
    \ tokens section of this chapter and it is not something new to us. Let's see\
    \ how the ConcurrencyCheck attribute is configured:\n\n```\npublic class Post\n\
    {\n    // Code removed for brevity\n    [ConcurrencyCheck]\n    public string\
    \ Url { get; set; }\n    // Code removed for brevity\n}\n```\n\nThe preceding\
    \ configuration will let EF Core consider the Url column as the concurrency check\
    \ column, and any further update to this column will restrict users from performing\
    \ parallel updates."
  merge: -1
  img_proc: true
