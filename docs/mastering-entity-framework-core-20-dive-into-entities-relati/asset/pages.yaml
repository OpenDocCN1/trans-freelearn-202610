- pgno: 344
  md: '# Summary


    We have explored multiple performance issues that we might run into, and the solutions
    required to tackle those issues. We started with the tracking behavior of EF Core
    and its projection behavior, then we explored detecting changes with bulk insert/updates,
    and how to handle them. We enhanced the application by supporting asynchronous
    operations, which allow us to handle threads effectively. Then we analyzed/fixed
    the data that was retrieved and transmitted over the network, right from volume,
    and columns until a number of database calls made to the data store. Finally,
    we saw how the data type mismatch affects us, also how the missing indexes affect
    our retrieval performance, and the way to improvise in those scenarios. The performance
    improvement measures we have been investigating in this chapter would help us
    in improving a system with worst performance (10,000ms+) to a system with best
    performance (<=1000 ms) which will be the performance **Service Level Agreement
    (SLA)** of most systems. So far, we have been dealing with only one tenant in
    the data store. In *Chapter 12, Isolation – Building a Multi-Tenant Database*,
    we will be dealing with a multi-tenant database and its row-level security.'
