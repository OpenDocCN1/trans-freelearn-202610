    ```


    We will be using the Post model to understand the following:


    +   - Dependent entity

    +   - Foreign key

    +   - Navigational property

    +   - Reference navigation property

    +   - Inverse navigation property


    As part of the Data model section, we captured key relationship terms in their
    appropriate models, now we will focus on each one of them in detail.


    # Principal entity


    The entity that will serve as a parent in a relationship is termed a principal
    entity. In the database world, this entity holds the primary key that will be
    used by the dependent entities in building relationships. Consider the following
    diagram:


    ![](img/17e01f90db603e72c0f0c6a7dce8920c_74_0.png)


    In our blogging system, the Blog entity serves as a parent to the Post entity,
    hence we could conclude Blog is the principal entity. The relationship we have
    between the two entities could be termed as an Association. Consider the following
    diagram:


    ![](img/17e01f90db603e72c0f0c6a7dce8920c_74_1.png)'
  merge: -1
  img_proc: true
- pgno: 75
  md: "In our blogging system, the `Person` entity serves as a parent to the `User`\
    \ entity, hence we could conclude `Person` is the Principal entity. The relationship\
    \ we have between the two entities could be termed a **Containment**. Consider\
    \ the following diagram:\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_75_0.png)\n\
    \nWe have seen the principal entity; let's explore the key of the relationships\
    \ built using a principal entity in the next section.\n\n# ## Principal key\n\n\
    The parent entity needs a unique key to associate itself with the child, and the\
    \ key used for this purpose is termed as the **principal key**. In our blogging\
    \ system, the `Id` property of the `Blog` entity would be the unique key/principal\
    \ key of the blog entry/item that will be used by the dependent `Post` entity\
    \ to build a relationship with the `Blog` entity:\n\n```\npublic class Blog\n\
    {\n    public int Id { get; set; }\n    public string Title { get; set; }\n  \
    \  public string Subtitle { get; set; }\n    public string Url { get; set; }\n\
    \    public string Description { get; set; }\n    public DateTime CreatedAt {\
    \ get; set; }\n    public DateTime ModifiedAt { get; set; }\n    public int CreatedBy\
    \ { get; set; }\n    public int ModifiedBy { get; set; }\n    public ICollection<Post>\
    \ Posts { get; set; }\n}\n```\n\nThe **Blog** table design is shown as follows.\
    \ In the table design, the highlighted `Id` field would be the unique primary\
    \ key of the table:"
