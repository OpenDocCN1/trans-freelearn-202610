- pgno: 38
  md: "```\n```csharp\n{\n    var services = scope.ServiceProvider;\n    try\n   \
    \ {\n        var context = services.GetRequiredService<BlogContext>();\n     \
    \   DbInitializer.Initialize(context);\n    }\n    catch (Exception ex)\n    {\n\
    \        var logger = services.GetRequiredService<ILogger<Program>>();\n     \
    \   logger.LogError(ex, \"An error occurred initializing\n            the database.\"\
    );\n    }\n}\nhost.Run();\n}\n```\n```\n\nOne last piece of the puzzle is missing;\
    \ we need to add migration whenever we add/manipulate data models, without which\
    \ EF doesn't know how the database needs to be created/updated. The migration\
    \ can be performed with the NuGet **Package Manager** console:\n\n```\n```powershell\n\
    Add-Migration InitialMigration\n```\n```\n\nThe preceding statement allows EF\
    \ to create a migration file with tables created from the models configured in\
    \ the DbContext. This can be done as follows:\n\n```\n```powershell\nUpdate-Database\n\
    ```\n```\n\nThe preceding statement applies the migration created to the database.\
    \ At this moment we are almost done with the EF configuration. We should run the\
    \ application and verify the database regarding whether or not the proper schema\
