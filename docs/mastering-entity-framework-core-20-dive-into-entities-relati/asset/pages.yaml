- pgno: 113
  md: "# # Fluent API\n\nWe already had a sneak peek into the Fluent API, without\
    \ which the relationship can never be complete (in a few cases, it is mandatory).\n\
    \n# ## Identifying navigation property and inverse navigation\n\nWe used the Fluent\
    \ API in one-to-one and many-to-many relationships. We will use the same method\
    \ to leverage the terminologies we have seen so far. The HasOne and HasMany methods\
    \ allow us to identify the navigation property in the dependent entity or simply\
    \ a reference navigation property.\n\nThe following code configures the foreign\
    \ key explicitly in the one-to-many relationship:\n\n```\nmodelBuilder.Entity<TagPost>()\n\
    \    .ToTable(\"TagPost\")\n    .HasOne(x => x.Tag)\n    .WithMany(x => x.TagPosts)\n\
    \    .HasForeignKey(x => x.TagId);\n```\n\nThe following diagram, the TagId highlighted\
    \ is required for the foreign key of the relationship:\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_113_0.png)"
  merge: -1
  img_proc: true
- pgno: 114
  md: "The `HasOne` method identifies the `Tag` navigation in the `TagPost` entity.\
    \ The `WithOne` and `WithMany` methods allow us to identify the inverse navigation\
    \ in the principal entity or simply a collection navigation property.\n\nThe code\
    \ required for inverse navigation property configuration is shown below:\n\n```\n\
    modelBuilder.Entity<TagPost>()\n    .ToTable(\"TagPost\")\n    .HasOne(x => x.Tag)\n\
    \    .WithMany(x => x.TagPosts)\n    .HasForeignKey(x => x.TagId);\n```\n\nThe\
    \ following diagram illustrates that we require an inverse navigation property\
    \ for the relationship:\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_114_0.png)\n\
    \nThe `HasOne` method identifies the `TagPosts` inverse navigation in the `Tag`\
    \ entity.\n\nWe have seen Fluent API identification and usages from a many-to-many\
    \ relationship; let's use the same approach to identify the usage in terminologies.\n\
    \n# Identifying the single navigation property\n\nIn the single navigation property,\
    \ we will never have a navigation property in a dependent entity, which makes\
    \ it hard for us in identifying the reference navigation property. This is where\
    \ `HasMany` comes into the picture, helping us to identify the relationship:"
  merge: -1
  img_proc: true
- pgno: 115
  md: "The following code contains entity and its configuration of single navigation\
    \ property, where Blog entity contains the navigation property and configuration\
    \ uses HasOne() to complete the relationship:\n\n```\npublic class Blog\n{\n \
    \   public int Id { get; set; }\n    public string Url { get; set; }\n    public\
    \ ICollection<Post> Posts { get; set; }\n}\npublic class Post\n{\n    public int\
    \ Id { get; set; }\n    public string Title { get; set; }\n    public string Content\
    \ { get; set; }\n    public DateTime PublishedDateTime { get; set; }\n    // Foreign\
    \ key \"BlogId\" and navigation property \"Blog\" was\n    removed here\n}\n\n\
    // onModelCreating method implementation inside context class\nmodelBuilder.Entity<Blog>()\n\
    \    .HasMany(x => x.Posts)\n    .WithOne()\n```\n\nThe following diagram, illustrates\
    \ the relationship built between entities with single navigation property:\n\n\
    ![](img/17e01f90db603e72c0f0c6a7dce8920c_115_0.png)"
