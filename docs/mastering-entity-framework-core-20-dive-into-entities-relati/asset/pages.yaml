    \ entity would be configured as inverse navigation properties:\n\n```\npublic\
    \ class Blog\n{\n    // Code removed for brevity\n    public ICollection<Post>\
    \ Posts { get; set; }\n}\npublic class Post\n{\n    // Code removed for brevity\n\
    \    public Blog Blog { get; set; }\n}\n```\n\nThe following image illustrates\
