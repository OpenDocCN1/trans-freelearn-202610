- pgno: 361
  md: '# Shared multi-tenant


    The shared multi-tenant model deals with a shared application and all the tenants
    shared the single database, isolating the application alone. It helps the developers
    to deploy features quickly, without affecting other vendors still maintaining
    the data in a single database. Any schema-related changes would be under much
    scrutiny as it affects all the other vendors as well as makes the database tightly
    coupled with other vendors.


    The following diagram explains the multi-tenant model where each application shares
    the same database:


    ![](img/17e01f90db603e72c0f0c6a7dce8920c_361_0.png)


    The main drawback in sharing a common database is that if any one of the vendor
    has more volume, it affects all the consuming vendors, forcing us to scale-up
    the database server. In the multi-tenancy terminology, multiple application instances
    of all the tenants share a single database. A company with different departments/modules
    sharing a single database will be a right candidate for this model. Each department
    will be considered as a tenant that will have its own users, yet it still shares
    the single database across the enterprise. It would be easy to deploy any feature
    quickly, but vendor customization would become difficult since the application
    shares a common database.


    We explored the multi-tenant model in this section. Now, let''s move on to the
    multi-tenancy implementation in the next section.'
  merge: -1
  img_proc: true
