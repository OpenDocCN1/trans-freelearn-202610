- pgno: 268
  md: 'We have seen the transaction created and maintained between multiple technologies
    in this section, which wraps up the implementation of transactions between multiple
    technologies.


    # Summary


    We have explored how to leverage the default transaction behavior in EF, which
    could be leveraged only if multiple operations are performed using a single `SaveChanges()`.
    Then we created a simple transaction, which allowed us to maintain transactions
    between multiple `SaveChanges()` commits. Later, we created cross-context transactions,
    identified their limitations, and overcame them with the custom `TransactionScope`
    that we built in this chapter. Finally, we created a transaction that was maintained
    between multiple technologies, provided it shares the connection and transaction
    objects. The different ways of handling transactions ensure that if anything goes
    wrong, they will be handled, ensuring we have built a fail-safe mechanism within
    single or between different data contexts, even between different technologies.


    So far, we have been working with a single user and haven''t factored in what
    will happen if we have concurrent users. In *Chapter 10, Make It Real – Handling
    Concurrencies*, we will revisit the application and handle concurrencies in all
    the transactions we have performed so far.'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# 10


    # Make It Real – Handling Concurrencies


    We have explored transactions, without which real-world transactions are not possible.
    We started with the default behavior and then went on to creating a transaction.
    Later, we learned about how a transaction could be shared between contexts, and
    finally we concluded by learning how external transactions were handled.


    Let''s identify the real-world problems available with respect to concurrencies,
    and we will see how we could handle them using the EF Core Framework:


    +   - In a real-world application, the same data store might be accessed by different
    modules at the same time. How does EF Core handle those persistences?

    +     - EF Core has a few concurrency techniques that help us in creating a fail-safe
    mechanism.

    +   - In which mechanism does EF Core expose concurrency techniques?

    +     - It exposes them using the usual techniques—data annotation and Fluent
    API.

    +   - Do we need to add anything to the design to support concurrency?

    +     - It''s a paradox; yes and no. If we are marking a column for concurrency
    checks then no schema change is required; otherwise, we need to introduce a timestamp/date
    row version column.'
  merge: -1
  img_proc: true
- pgno: 270
  md: '+   - Do we have any provision in not having such a column in a data model
    but still support concurrency tokens?

    +     - Yeah, it''s quite possible. In the *No foreign key property* section of
    `Chapter 3, Relationships - Terminology and Conventions`, we discussed shadow
    properties. The same concept could be applied here where EF Core does internal
    concurrency checks without exposing them in the data model in a context.

    +   - Nothing is fail-safe. Even if we build the mechanism to handle concurrencies,
    what control do we have if we face this conflict? What would be the action item
    and how do we ensure that the application is really fail-safe?

    +     - We could capture concurrency issues, and deal with current, original,
    and database values to resolve them.


    The sections we will be including in this chapter are:


    +   - Handling concurrency in EF

    +   - Introducing concurrency tokens

    +   - Concurrency tokens through shadow properties

    +   - Concurrency tokens based on timestamp/row version

    +   - Handling concurrency conflicts


    # Handling concurrency in EF


    Imagine we were the developers assigned to develop/handle concurrency in the blogging
    system, what would be the starting point for us? The analysis would provide us
    with an answer for what is required to handle concurrency. Most importantly, it
    would help us understand the concurrency conflict and how it needs to be handled.


    We will explore how concurrency conflict occurs and what needs to be done to handle
    it. Finally, we will see how it has been handled by the EF Core team.'
  merge: -1
  img_proc: true
- pgno: 271
  md: '# Understanding the concurrency conflicts


    We need to visualize where we would be facing this issue, in general, when the
    user tries to update data that is stale, which means the underlying data in the
    database has changed since the object was filled. Then we have a problem that
    needs to be addressed before we go live. If we don''t handle concurrency, then
    the user who updates it last would retain his change, overwriting the data updated
    by other users.


    In a real-world application, no single user accesses the application at a single
    point in time, multiple users use the application and it complicates the persistence
    of the data store.


    Let''s look at some scenarios that occur in such an application:


    +   - Two users try to update the same entity at the same time

    +   - If one of the users succeeds in the first persistence, then we end up overwriting
    the same entity by the second user


    This is our point of interest, which could be coined as **concurrency conflict**.
    To replicate the issue, open the **Edit Post** page in two tabs. Assume the first
    user in the first tab is updating the post information, such as editing a blog
    post''s **Title** and **Content**:


    ![](img/17e01f90db603e72c0f0c6a7dce8920c_271_0.png)'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'Another user in the second tab tries to modify the **Post Content**, who is
    unaware of the change performed in the **Post Title** and content by the other
    user (from the first tab):


    ![](img/17e01f90db603e72c0f0c6a7dce8920c_272_0.png)'
  merge: -1
  img_proc: true
- pgno: 273
  md: <!-- no content -->
