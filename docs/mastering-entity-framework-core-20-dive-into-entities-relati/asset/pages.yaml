- pgno: 48
  md: '# # Summary


    We started our journey with Entity Framework by knowing what difference it made
    when compared with the legacy approach at a high level. We also looked at building
    the .NET environment and creating and configuring a .NET Core web application
    with Entity Framework. We explored NuGet packages and package manager, which will
    be extensively used in the entire book. We also identified and installed the packages
    required for the Entity Framework in this chapter. Using the Code-First approach,
    we built the schema, configured them with EF and created and seeded the database
    with schema and seed data. Finally, we consumed the built schema in our MVC application
    using the scaffolding tool (which was installed along the way), and also looked
    at the usage of the database context in the controllers. The Code-First approach
    can be used for building new systems, but we need a different approach for existing
    systems. That''s where the **Database-First** approach comes into the picture.
    Let''s explore this in _Chapter 2_, The Other Way Around – Database First Approach.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# The Other Way Around –

    Database First Approach


    In Chapter 1, *Kickstart - Introduction to Entity Framework Core*, we were exposed
    to the **Entity Framework (EF)** Code-First approach, which might not be useful
    in all scenarios. We need a provision to reverse engineer existing databases using
    EF Core, which guides us in performing migrations and helps us in retaining model
    changes that won''t be lost during migrations.


    When EF was first released, it supported only the database-first approach, which
    means we could use the framework only on the existing database. As opposed to
    the Code-First approach discussed in the previous chapter, the database-first
    approach will be widely used while we decide to use EF in the existing system.


    The topics we will cover here are:


    +   - Preparing the database

    +   - Creating a new project

    +   - Installing Entity Framework

    +   - Reverse engineering the database

    +   - Registering context in services (.Net Core DI)

    +   - Performing CRUD operations'
  merge: -1
  img_proc: true
- pgno: 50
  md: "# # Preparing the database\n\nWe will use the same blogging system used in\
    \ *Chapter 1, Kickstart - Introduction to Entity Framework Core*. In this case,\
    \ we will create SQL queries required for the existing database and then we will\
    \ build our blogging system using the database-first approach. Let's write the\
    \ SQL query of `Blog` and `Post`, which were required for the blogging system.\n\
    \n# ## Blog entity script\n\nWe will create a `Blog` table, then alter it to add\
    \ a primary key constraint, and finally, insert some dummy data into the table.\
    \ The complete script is available in the GitHub repository at `https://github.com/PacktPublishing/Mastering-Entity-Framework-Core/blob/master/Chapter%202/Final/MasteringEFCore.DatabaseFirst.Final/dbo.Blog.sql`.\n\
    \nThe script required for creating the `Blog` table and inserting the data is\
    \ displayed as follows:\n\n```\n```sql\n// Code removed for brevity\nCREATE TABLE\
    \ [dbo].[Blog] (\n    [Id] INT            IDENTITY (1, 1) NOT NULL,\n    [Url]\
    \ NVARCHAR (MAX) NULL\n);\nGO\n// Code removed for brevity\nINSERT INTO [Blog]\
    \ (Url) VALUES\n('http://blogs.packtpub.com/dotnet'),\n('http://blogs.packtpub.com/dotnetcore'),\n\
    ('http://blogs.packtpub.com/signall')\nGO\n```\n```\n\nWe have looked at the `Blog`\
    \ table SQL script, now let's look at the `Post` table script that will introduce\
    \ a non-clustered index and foreign key.\n\n# ## Post entity script\n\nWe will\
    \ create a `Post` table and a non-clustered index for better performance, later\
    \ alter them to add a primary key and foreign key constraints, and finally, insert\
    \ some dummy data into the table. The complete script is available in the GitHub\
    \ repository at `https://github.com/PacktPublishing/Mastering-Entity-Framework-Core/blob/master/Chapter%202/Final/MasteringEFCore.DatabaseFirst.Final/dbo.Post.sql`."
  merge: -1
  img_proc: true
- pgno: 51
  md: "The script required for creating the Post table and inserting the data is displayed\
    \ below:\n\n```\n// Code removed for brevity\nCREATE TABLE [dbo].[Post] (\n  \
    \  [Id] INT IDENTITY (1, 1) NOT NULL,\n    [BlogId] INT NOT NULL,\n    [Content]\
    \ NVARCHAR (MAX) NULL,\n    [PublishedDateTime] DATETIME2 (7) NOT NULL,\n    [Title]\
    \ NVARCHAR (MAX) NOT NULL\n);\nGO\n// Code removed for brevity\nINSERT INTO [Post]\
    \ ([BlogId], [Title], [Content], [PublishedDateTime]) VALUES\n(1, 'Dotnet 4.7\
    \ Released', 'Dotnet 4.7 Released Contents', '20170424'),\n(2, '.NET Core 1.1\
    \ Released', '.NET Core 1.1 Released Contents', '20170424'),\n(2, 'EF Core 1.1\
    \ Released', 'EF Core 1.1 Released Contents', '20170424')\nGO\n```\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_51_0.png)\n\
    \nWhile inserting data time values, we should use the YYYYMMDD format, such as\
    \ 20170424, and if we are tuned with the DD-MM-YYYY hh:mm:ss xm format, then we\
    \ need to perform an explicit conversion, such as convert(datetime,'24-04-2017\
    \ 01:34:09 PM',5), otherwise we would get the message, the conversion of a varchar\
    \ data type to a datetime data type resulted in an out-of-range value.\n\nWe need\
    \ to figure out how to execute the previous script using LocalDB:\n\n+   1. Open\
    \ the SQL Server Object Explorer from the View menu.\n+   2. Expand SQL Server\
    \ and (localdb)\\MSSQLLocalDB.\n+   3. Right-click on Databases and select Add\
    \ New Database.\n+   4. In the Create Database dialog box, provide the Database\
    \ Name as MasteringEFCoreDbFirst and Database Location as your project path, and\
    \ click OK.\n+   5. Expand Databases, right-click on the MasteringEFCoreDbFirst\
    \ database, and select New Query."
