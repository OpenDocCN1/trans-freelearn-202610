    \ will restrict users from performing parallel updates.\n\nWe have seen the approaches\
    \ available for handling conflicts, let's discuss them in detail.\n\n# Applying\
    \ optimistic concurrency\n\nThe optimistic concurrency will let the user try to\
    \ update the entity. EF handles the overhead operations to ensure whether there\
    \ is any concurrency conflict or not. This operation does not hurt performance,\
    \ as pessimistic concurrency hurts, but it does handle concurrency in different\
    \ ways."
