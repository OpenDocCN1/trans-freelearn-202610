- pgno: 229
  md: "The concrete expression class implements IQueryExpression with concrete methods\
    \ and their interface counterpart and wraps the Where predicate inside the AsExpression\
    \ method, which returns a Func object. The following code provides a wildcard\
    \ search on all fields from the Post entity using the expression approach:\n\n\
    ```\npublic class GetPaginatedPostByKeywordQueryExpression :\n    IQueryExpression<Post>\n\
    {\n    public string Keyword { get; set; }\n    public Expression<Func<Post, bool>>\
    \ AsExpression()\n    {\n        return (x => x.Title.ToLower().Contains(Keyword.ToLower())\n\
    \        || x.Blog.Title.ToLower().Contains(Keyword.ToLower())\n        || x.Blog.Subtitle.ToLower().Contains(Keyword.ToLower())\n\
    \        || x.Category.Name.ToLower().Contains(Keyword.ToLower())\n        ||\
    \ x.Content.ToLower().Contains(Keyword.ToLower())\n        || x.Summary.ToLower().Contains(Keyword.ToLower())\n\
    \        || x.Author.Username.ToLower().Contains(Keyword.ToLower())\n        ||\
    \ x.Url.ToLower().Contains(Keyword.ToLower()));\n    }\n}\n```\n\nThe expression\
    \ tree is used in the query object, as shown. It is obvious that the expression\
    \ object is constructed and used as a parameter to the Where condition in the\
    \ LINQ query. The below GetPaginatedPostByKeywordQuery implementation consumes\
    \ the expression required for wild card search:\n\n```\npublic class GetPaginatedPostByKeywordQuery\
    \ : QueryBase,\n    IGetPaginatedPostByKeywordQuery<GetPaginatedPostByKeywordQuery>\n\
    {\n    // Code removed for brevity\n    public IEnumerable<Post> Handle()\n  \
    \  {\n        var expression = new GetPaginatedPostByKeywordQueryExpression\n\
    \        {\n            Keyword = Keyword\n        };\n        return IncludeData\n\
    \            ? Context.Posts.Include(p => p.Author).Include(p =>\n           \
    \     p.Blog).Include(p => p.Category)\n            .AsQueryable()\n         \
    \   .Where(expression.AsExpression())\n            .Skip(PageNumber - 1).Take(PageCount)\n\
    \            .ToList()\n            : Context.Posts\n            .AsQueryable()\n\
    ```"
