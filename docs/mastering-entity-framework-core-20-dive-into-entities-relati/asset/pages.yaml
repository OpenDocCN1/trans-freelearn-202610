- pgno: 165
  md: "In our blogging system, we can remove the `FutureOnly` attribute included in\
    \ the model and replace it with class-level validation. The business validation\
    \ will be triggered automatically (during model binding), and, as it happened\
    \ in the field-level validation, it updates the model state and error collection.\
    \ The business validation using `IValidatableObject` is furnished as follows:\n\
    \n```\npublic class Post : IValidatableObject\n{\n    public int Id { get; set;\
    \ }\n    [Required(ErrorMessage = \"Title is required\")]\n    public string Title\
    \ { get; set; }\n    [Required(ErrorMessage = \"Content is required\")]\n    public\
    \ string Content { get; set; }\n    public string Summary { get; set; }\n    public\
    \ DateTime PublishedDateTime { get; set; }\n    [Url(ErrorMessage = \"Provide\
    \ a valid url\")]\n    public string Url { get; set; }\n    public long VisitorCount\
    \ { get; set; }\n    public DateTime CreatedAt { get; set; }\n    public DateTime\
    \ ModifiedAt { get; set; }\n    public int CreatedBy { get; set; }\n    public\
    \ int ModifiedBy { get; set; }\n    [Required(ErrorMessage = \"Blog is required\"\
    )]\n    public int BlogId { get; set; }\n    public Blog Blog { get; set; }\n\
    \    [Required(ErrorMessage = \"Author is required\")]\n    public int AuthorId\
    \ { get; set; }\n    public User Author { get; set; }\n    [Required(ErrorMessage\
    \ = \"Category is required\")]\n    public int CategoryId { get; set; }\n    public\
    \ Category Category { get; set; }\n    public ICollection<TagPost> TagPosts {\
    \ get; set; }\n    public ICollection<Comment> Comments { get; set; }\n\n    public\
    \ IEnumerable<ValidationResult> Validate(ValidationContext validationContext)\n\
    \    {\n        var post = (Post)validationContext.ObjectInstance;\n        if\
    \ (post.PublishedDateTime.CompareTo(DateTime.Now) < 0)\n            yield return\n\
    \                new ValidationResult(\"Publishing Date cannot be in past, kindly\
    \ provide a future date\", new [] { \"PublishedDateTime\" });\n    }\n}\n```\n\
    \n```\n// One way to consume manual business validation\n```"
