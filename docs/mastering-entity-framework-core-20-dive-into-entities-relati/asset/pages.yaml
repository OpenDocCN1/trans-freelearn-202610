- pgno: 81
  md: "# Reference navigation property\n\nWe can work out what it actually does from\
    \ its name. Yes, it holds a reference to its parent entity and it always holds\
    \ a reference to a single item. In our blogging system, the `Blog` property of\
    \ the `Post` entity could be treated as a reference navigation property:\n\n```\n\
    public class Post\n{\n    ... // code removed for brevity\n    public int BlogId\
    \ { get; set; }\n    public Blog Blog { get; set; }\n}\n```\n\nThe `Blog` and\
    \ `Post` class diagrams are shown as follows. In the design, the highlighted `Blog`\
    \ field in the `Post` entity would be the reference navigation property:\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_81_0.png)\n\
    \nWe have seen the property that holds the reference to its parent, and it causes\
    \ some confusion as to what the inverse navigation property will be."
  merge: -1
  img_proc: true
- pgno: 82
  md: "# # Inverse navigation property\n\nYou guessed it, this is a little bit tricky\
    \ as it always refers to the other end of the relationship. In our blogging system,\
    \ the `Blog` property of the `Post` entity could be treated as an inverse navigation\
    \ property of the `Posts` property of the `Blog` entity:\n\n```\npublic class\
    \ Post\n{\n    ... // code removed for brevity\n    public Blog Blog { get; set;\
    \ }\n}\n```\n\nThis is also true vice versa, which means the `Posts` property\
    \ of the `Blog` entity could be treated as an inverse navigation property of the\
    \ `Blog` property of the `Post` entity:\n\n```\npublic class Blog\n{\n    ...\
    \ // code removed for brevity\n    public ICollection<Post> Posts { get; set;\
    \ }\n}\n```\n\nThe `Blog` and `Post` class diagrams are shown as follows. In the\
    \ design, the highlighted `Blog` field in the `Post` entity and the `Posts` field\
    \ in the `Blog` entity would be the inverse navigation properties:\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_82_0.png)"
  merge: -1
