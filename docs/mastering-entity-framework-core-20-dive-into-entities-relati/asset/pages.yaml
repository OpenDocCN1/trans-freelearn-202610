  md: '# Creating new project


    We have exhaustively seen how to create a new project in Chapter 1, Kickstart
    - Introduction to Entity Framework Core. Kindly refer to the steps involved in
    creating the project and use the following project information:


    Project name: MasteringEF Core.DatabaseFirst


