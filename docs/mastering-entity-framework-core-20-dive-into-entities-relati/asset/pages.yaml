- pgno: 15
  md: '# # Preface


    Being able to create and maintain data-oriented applications has become crucial
    in modern programming. This is why Microsoft came up with Entity Framework (EF),
    so architects can optimize storage requirements while also writing efficient and
    maintainable application code. This book is a comprehensive guide that will show
    you how to utilize the power of the EF to build efficient .NET Core applications.
    It not only teaches all the fundamentals of EF Core, but also demonstrates how
    to use it practically so you can implement it in your software development.


    This book is divided into three modules. The first module focuses on building
    entities and relationships. Here, you will also learn about different mapping
    techniques, which will help you choose the one best suited to your application
    design. Once you have understood the fundamentals of EF, you will move on to learn
    about validation and querying in the second module. It will also teach you how
    to execute raw SQL queries and extend the EF to leverage Query Objects using the
    Query Object Pattern. The final module of the book focuses on performance optimization
    and managing the security of your application. You will learn to implement fail-safe
    mechanisms using concurrency tokens. The book also explores row-level security
    and multitenant databases in detail.


    By the end of the book, you will be proficient in implementing EF on your .NET
    Core applications.


    # ## What this book covers


    Chapter 1, *Kickstart – Introduction to Entity Framework Core*, teaches you about
    installing/configuring Entity Framework Core in .NET Core applications. It guides
    us through performing CRUD (Create/Read/Update/Delete) operations.


    Chapter 2, *The Other Way Around – Database First Approach*, explains about reverse
    engineering and existing database using EF Core. It guides us through performing
    migrations and also helps us in retaining model changes that won''t be lost during
    migrations.


    Chapter 3, *Relationships – Terminology and Conventions*, provides knowledge about
    relationship terms related to entities, keys, and properties. We will also see
    different conventions available with respect to relationships.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Preface


    Chapter 4, *Building Relationships – Understanding Mapping*, helps you explore
    multiple relationship techniques and explains how to leverage them in your application
    design. We will also explore how to create relationships using Fluent API.


    Chapter 5, *Know the Validation – Explore Inbuilt Validations*, teaches you about
    how validation works in the framework, explores built-in validations, shows how
    they should be configured, covers the patterns each validation expects from the
    user, and shows how the validation error is rendered by the MVC engine.


    Chapter 6, *Save Yourself – Hack Proof Your Entities*, helps us with adding validations,
    explains why we need validations on both the client side and server side, and
    shows how to achieve it. It also introduces custom validation, and how to create
    client-side logic for validation and remote validation.


    Chapter 7, *Going Raw – Leveraging SQL Queries in LINQ*, teaches you about executing
    Raw SQL Queries while also teaching you how to execute parameterized queries,
    compose with LINQ, and, finally, execute without a DbSet or POCO object.


    Chapter 8, *Query Is All We Need – Query Object Pattern*, helps you understand
    the Query Object pattern, and extend EF to leverage query objects.


    Chapter 9, *Fail Safe Mechanism – Transactions*, helps you understand the existing
    behavior of transactions, how to create regular/cross-context transactions, and
    how to use external DBTransactions.


    Chapter 10, *Make It Real – Handling Concurrencies*, elaborates on how concurrency
    is wired in EF and how to handle it. It explains concurrency tokens in detail
    and shows how to create a fail-safe mechanism using it.


    Chapter 11, *Performance – It’s All About Execution Time*, teaches you how to
    improve EF''s performance by properly utilizing the framework, reducing abuses,
    and much more.


    Chapter 12, *Isolation – Building a Multi-Tenant Database*, explores row-level
    security and multi-tenant databases in detail.


    # What you need for this book


    To work with this text, we assume you are familiar with .NET Core and C#.'
  merge: -1
  img_proc: true
