- pgno: 228
  md: "We have covered exhaustively how commands are created and consumed along with\
    \ queries in repositories and controllers. Let's visit the solution required for\
    \ the previous assignment in the next section to proceed with the missing implementations.\n\
    \n# Solution to the command queries assignment\n\nThe solution to the command\
    \ queries assignment starts with the implementation of query objects, and is available\
    \ in the following Git repository path:\n\n```\nhttps://goo.gl/RFKed5\n```\n\n\
    The solution to the implementation of the remaining commands is available in the\
    \ following Git repository path:\n\n```\nhttps://goo.gl/6aW15n\n```\n\nThe solution\
    \ to the controller implementation for the commands and queries is available in\
    \ the following Git repository path:\n\n```\nhttps://goo.gl/ysNyc7\n```\n\nWe\
    \ have seen the exhaustive coverage of composing commands with queries. In the\
    \ next section, let's explore enhancing the queries using expression trees.\n\n\
    # Enhancing queries with expression trees\n\nAn expression tree is a mechanism\
    \ that allows developers to create expressions that are necessary for the filters\
    \ in the queries. In .NET, we have `Func<T, TResult>` to wrap a `Where` predicate\
    \ and use it in multiple occurrences. We could use the same mechanism to create\
    \ expression trees and leverage them in query objects.\n\nThe generic `IQueryExpression`\
    \ interface has a provision to create an expression through `Func`, the following\
    \ code creates contract for `AsExpression()`.\n\n```\npublic interface IQueryExpression<T>\n\
    {\n    Expression<Func<T, bool>> AsExpression();\n}\n```"
  merge: -1
