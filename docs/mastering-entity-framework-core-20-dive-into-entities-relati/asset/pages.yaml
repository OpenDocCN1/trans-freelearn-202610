  md: "# Dive into multi-tenancy\n\nThe multi-tenancy implementation is completely\
    \ dependent on the tenant configuration that was built in the row-level security\
    \ section in this chapter. The Entity Framework Core eradicates the necessity\
    \ of any custom implementation or any third-party package to handle tenant handling\
    \ in the system. EF Core 2.0 provides query-filtering features that allows us\
    \ to filter the tenant based on the configured ID right in the data-context level.\n\
    \nThe code required to implement the tenant configuration in the data context\
    \ is highlighted here:\n\n```\npublic class BlogContext: DbContext\n{\n    //\
    \ Code removed for brevity\n    public Guid TenantId { get; set; }\n    protected\
    \ override void OnModelCreating(ModelBuilder modelBuilder)\n    {\n        modelBuilder.Entity<Blog>()\n\
    \            .ToTable(\"Blog\")\n            .HasQueryFilter(item => item.TenantId.Equals(TenantId));\n\
    \        modelBuilder.Entity<Post>()\n            .ToTable(\"Post\")\n       \
    \     .HasQueryFilter(item => item.TenantId.Equals(TenantId));\n        // Code\
    \ removed for brevity\n    }\n}\n```\n\nThe controller implementation required\
    \ for tenant handling is pretty straightforward:\n\n+   - The User identity name\
    \ is used to retrive the Person information from the data store\n+   - From the\
    \ Person entity, the tenant id is retrieved\n+   - The retrieved identity is then\
    \ configured in the data context, which will be used in the corresponding data\
    \ context operations\n\nThe preceding implementation steps were followed in this\
    \ piece of code to configure tenants in the data context from a controller:\n\n\
    ```\npublic class BlogsController : Controller\n{\n    // Code removed for brevity\n\
    \    public async Task<IActionResult> Index()\n    {\n        SetTenantId();\n\
    ```"
  merge: -1
