  md: "# # Projections\n\nThere is another built-in support from EF Core that provides\
    \ tracking over projections (anonymous types or custom types that project the\
    \ entity) as well. In the following example, we are projecting the `Person` model\
    \ as `PersonViewModel`, which will contain both the type and an additional `NoOfComments`\
    \ field. In this case, EF Core will track changes performed over the `Person`\
    \ property of `PersonViewModel`, since it is part of the data context and the\
    \ `NoOfComments` will not be tracked. The following code provides the above discussed\
    \ projection:\n\n```\npublic async Task<IActionResult> Index()\n{\n    return\
    \ View(await _context.People\n        .AsNoTracking()\n        .Select(item =>\n\
    \            new PersonViewModel\n            {\n                Person = item,\n\
    \                NoOfComments = item.Comments.Count\n            }).ToListAsync());\n\
    }\n```\n\nThere is one more projection that will never perform any tracking. If\
    \ the projection takes only the fields rather than the entity itself, then it\
    \ will not track changes to the projected entity. Let's see them in action by\
    \ introducing an **About** panel, which will be displayed across the public post\
    \ that displays author information. A component is created to display author details,\
    \ and its View implementation creates a projection that takes only `Name` and\
    \ `Biography` from the `Person` entity. Since it's not projecting the entire entity,\
    \ the `AboutViewModel` will not be tracked.\n\nThe following projection ensures\
    \ that the data will never be tracked, as it does not contain any entities registered\
    \ in the data context:\n\n```\npublic class AboutViewComponent : ViewComponent\n\
    {\n    private readonly BlogContext _context;\n    private readonly IPersonRepository\
    \ _repository;\n    public AboutViewComponent(IPersonRepository repository,\n\
    \        BlogContext context)\n    {\n        _repository = repository;\n    \
    \    _context = context;\n    }\n\n    public IViewComponentResult Invoke(int\
    \ id)\n```"
