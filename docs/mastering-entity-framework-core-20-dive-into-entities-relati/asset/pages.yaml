- pgno: 111
  md: "# Building many-to-many relationship using the Fluent API\n\nWe should configure\
    \ the relationship in the Fluent API in two different one-to-many relationships\
    \ between the Tag and TagPost and Post and TagPost entities. The HasForeignKey\
    \ method doesn't need to be generic, since one-to-many relationships don't need\
    \ to mark the dependent type explicitly:\n\nThe many-to-many relationship between\
    \ Tag and Post entities require the following configuration:\n\n```\nprotected\
    \ override void OnModelCreating(ModelBuilder modelBuilder)\n{\n    modelBuilder.Entity<Blog>().ToTable(\"\
    Blog\");\n    modelBuilder.Entity<Post>().ToTable(\"Post\");\n    modelBuilder.Entity<User>()\n\
    \        .ToTable(\"User\")\n        .HasOne(x=>x.Address)\n        .WithOne(x=>x.User)\n\
    \        .HasForeignKey<Address>(x=>x.UserId);\n    modelBuilder.Entity<Address>().ToTable(\"\
    Address\");\n    modelBuilder.Entity<Tag>().ToTable(\"Tag\");\n    modelBuilder.Entity<TagPost>()\n\
    \        .ToTable(\"TagPost\")\n        .HasOne(x => x.Tag)\n        .WithMany(x\
    \ => x.TagPosts)\n        .HasForeignKey(x => x.TagId);\n    modelBuilder.Entity<TagPost>()\n\
    \        .ToTable(\"TagPost\")\n        .HasOne(x => x.Post)\n        .WithMany(x\
    \ => x.TagPosts)\n        .HasForeignKey(x => x.PostId);\n}\n```"
  merge: -1
  img_proc: true
