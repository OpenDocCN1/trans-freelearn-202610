  md: "In this section, we have incorporated query objects inside the repository.\
    \ In the next section, we will see how we can compose queries with commands.\n\
    \n# Composing queries with commands\n\nWe will streamline the implementation while\
    \ implementing commands in our repository. The following code will allow us to\
    \ create an interface which enforces `IncludeData` to be set for all queries:\n\
    \n```\n```csharp\npublic interface IQueryRoot\n{\n    bool IncludeData { get;\
    \ set; }\n}\n```\n```\n\nWe will use `IQueryRoot` as a base interface for the\
    \ query handler, which returns generic return typed data. The following code extends\
    \ the `IQueryRoot` and provide two interfaces to support synchronous and asynchronous\
    \ operations:\n\n```\n```csharp\npublic interface IQueryHandler<out TReturn> :\
    \ IQueryRoot\n{\n    TReturn Handle();\n}\npublic interface IQueryHandlerAsync<TReturn>\
    \ : IQueryRoot\n{\n    Task<TReturn> HandleAsync();\n}\n```\n```\n\nLet's keep\
    \ creating multiple generic interfaces required for different queries that inherit\
    \ the query handler with a configured return type, and additionally define the\
    \ fields required in each query type.\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_220_0.png)\n\
    \n> We will be using **Variant Generic Interfaces**. Even though they are out\
    \ of scope, let's discuss them briefly to understand the code. The **covariant**\
    \ generic interface expects the type to implement methods that have a return type\
    \ specified in the generic type parameters using the `out` keyword. The **contravariant**\
    \ generic interface expects the type to accept method arguments as the type specified\
    \ in the generic type parameters using the `in` keyword."
