- pgno: 233
  md: '# 9


    # Fail Safe Mechanism –

    Transactions


    We have applied query object patterns to isolate query objects from the repository,
    which maintains query logic in one single place. We created a simple query object,
    then invented a repository to illustrate how query objects could be accommodated
    in the repositories. We then moved from queries to commands to perform real transactions
    using a similar pattern. Finally, we worked with expression trees to simplify
    and configure the conditions in a query execution.


    Let''s discuss how we could handle failure scenarios using transactions, how the
    transaction could be accessed between contexts, and also between different data
    access technologies:


    +   - Is there any complex system that performs more than one data manipulation
    activity, then handles failures to maintain atomicity?

    +     - Transactions allow us to handle atomicity in failure scenarios.

    +   - Do we need to handle transactions in simple applications?

    +     - Not required. The default behavior in EF would handle transactions only
    if all the changes were committed through SaveChanges.

    +   - What if we need transactions to be maintained between multiple contexts
    in a complex system?

    +     - We do have provision to maintain transactions between multiple database
    contexts.'
  merge: -1
  img_proc: true
- pgno: 234
  md: "+   - What if we need transactions to be maintained between multiple technologies\
    \ (EF and ADO.NET) in a complex system?\n+     - We do have provision to maintain\
    \ transactions between EF and ADO.NET data manipulations.\n\nThe following topics\
    \ will be covered to handle transactions in multiple scenarios:\n\n+   - Default\
    \ behavior of a transaction\n+   - Creating a simple transaction\n+   - Creating\
    \ a cross-context transaction\n+   - Leveraging transactions between multiple\
    \ technologies\n\n# Default behavior of a transaction\n\nEF supports transactions\
    \ out of the box, all we need to do is perform SaveChanges() only once; it saves\
    \ changes only if the transaction has been executed successfully, otherwise, the\
    \ transactions will be rolled back automatically.\n\nLet's investigate how we\
    \ could practically leverage the default transactional behavior in our blogging\
    \ system:\n\n+   - We need two entities that need to be updated in a single web\
    \ request\n+   - Both the entities should be added/updated in the data context\n\
    +   - With a single SaveChanges(), both entities will be updated in the data store\n\
    \nIn the blogging system, let's include support to add one or more tags in posts\
    \ and learn about default transaction support in parallel with the Tags integration\
    \ in posts.\n\n# Adding tags support in the blogging system\n\nThe fields required\
    \ in the Post entity to incorporate Tags support in posts will be covered in this\
    \ section. Let's start the activity by including the fields required to persist\
    \ tag information in the Post model, as follows:\n\n```\npublic class Post\n{\n\
    \    // Code removed for brevity\n    [NotMapped]\n    public ICollection<Tag>\
    \ Tags { get; set; }\n}\n```"
