    \        .IsConcurrencyToken();\n    // Code removed for brevity\n}\n```\n\nThe\
    \ preceding configuration will let EF Core consider the Timestamp column as the\
    \ concurrency token, and any further update to this column will restrict users\
    \ from performing parallel updates, as it did in the data annotation configuration.\n\
    \nWe have exhaustively seen how this concurrency token works, so let's move on\
    \ to the next section, which explores how concurrency conflicts were handled.\n\
    \n# Handling concurrency conflicts\n\nWe have seen how to configure concurrency\
