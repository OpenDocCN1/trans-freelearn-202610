  md: '# # About the Author


    **Prabhakaran Anbazhagan** is a Microsoft Solution Architect living in Chennai,
    India. His passion for programming started while creating a website for his school,
    and that''s where the never-ending journey started. He became the secretary of
    a technology group in college, creating websites yet again, automating symposiums,
    and much more.


    He started his career at a prestigious product-based company; his knowledge was
    respected and recognized by his seniors, who let him develop tools and automation
    to sharpen his talents. Lucky guy! People hardly ever get to nurture their talent,
    but he got a handful of opportunities to sharpen his skills and become a Solution
    Architect, becoming a jack of all trades but still an expert in .NET.


    Prabhakaran has more than 12 years of IT experience in architecting, designing,
    and developing mission-critical desktop, web, and mobile applications. He has
    experience in full-stack development spanning ASP.NET MVC, Web API, C#, Mobility
    expert in Swift, Objective-C, Blackberry Cascades, hybrid apps, SharePoint, JavaScript,
    jQuery, and MEAN.JS.


    > > *I would like to thank my lovely wife, Girija, for standing beside me when
    I took the decision to write this book. She compromised a lot of quality time
    and was there beside me throughout this journey, and I dedicate this book to her.
    I also want to thank my wonderful children, Venha and Inba. They were my stress
    busters in hectic weekends, and I hope one day they will understand why I was
    busy with my laptop instead of playing with them. I’d like to thank my parents
    for taking care of the kids along with my wife while I was hooked on my laptop.
    My family, including my in-laws, have always supported me in authoring this book,
    and I really appreciate it.*'
