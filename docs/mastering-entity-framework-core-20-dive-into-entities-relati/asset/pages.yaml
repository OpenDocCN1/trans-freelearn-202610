- pgno: 150
  md: "If the field value doesn't follow the defined regular expression pattern, then\
    \ a validation error would be returned by the engine. For instance, if the regular\
    \ expression is configured to contain only letters of the alphabet, then any other\
    \ character inclusion would throw a validation error.\n\nThe RegularExpression\
    \ attribute/data annotation can be configured as follows:\n\n```\npublic class\
    \ Person\n{\n    public int Id { get; set; }\n    [Required(ErrorMessage = \"\
    First Name is required\")]\n    [RegularExpression(\"^[a-zA-Z]+$\")]\n    public\
    \ string FirstName { get; set; }\n    // Code removed for brevity\n}\n```\n\n\
    If the field value does not match the regular expression, then the validation\
    \ error, The field Username must match the regular expression '^[a-zA-Z]+$'. ,\
    \ would be thrown, which is shown as follows:\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_150_0.png)\n\
    \nWe can configure the custom error message on each model field, as follows:\n\
    \n```\npublic class Person\n{\n    public int Id { get; set; }\n    [Required(ErrorMessage\
    \ = \"First Name is required\")]\n    [RegularExpression(\"^[a-zA-Z]+$\", ErrorMessage\
    \ = \"Only alphabets were allowed\")]\n}\n```"
