- pgno: 178
  md: 'We never discussed assignment as of now, so let''s take that as a task and
    get the proper validation performed as displayed in the following screenshot:


    ![](img/17e01f90db603e72c0f0c6a7dce8920c_178_0.png)


    We learned about remote validation in this chapter, and that wraps up the custom
    validations we can perform beyond the built-in validations available in the framework.


    # Summary


    We learned about custom validations that were provided by Entity Framework and
    MVC in this chapter. We started with client-side validation, which changed the
    user experience completely, then looked at what would happen if somebody hacks
    in and bypasses the client-side validation. We overcame those issues by applying
    second-level validation at the server side. We saw the urge in performing manual
    validation rather than the framework doing it for us out of the box; we then performed
    some custom validation that was required beyond the built-in validations. We also
    applied the same validation to the client side by leveraging `IClientModelValidator`.
    Finally, we performed a remote validation that was not even a part of Entity Framework
    but was available in the MVC Framework.


    So far, we were accessing the data only through data context, and we have never
    written any plain SQL queries. In a few valid scenarios, we had a need for the
    provision to bypass the data context for better performance or to avoid heavy
    lifting tasks done by the framework. We will figure this out in Chapter 7, *Going
    Raw – Leveraging SQL Queries in LINQ*.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# 7


    # Going Raw – Leveraging SQL Queries in LINQ


    We have learned about custom validations, leveraging client-side validation, responding
    if somebody hacks into the system and bypasses the client-side validation, and
    additional layer security at the server side. Finally, we performed remote validation
    from the MVC framework.


    In this chapter, we will address the following concerns with respect to data security:


    +   - Do we have a provision in **Entity Framework (EF)** to control SQL queries?

    +     - We can perform or execute inline SQL queries directly from EF.

    +   - What if someone hacks the system and performs SQL injection? Do SQL queries
    actually open up those security issues?

    +     - We could use parametrized queries to avoid SQL injection.

    +   - If we go down the plain SQL queries route, can we leverage LINQ queries?

    +     - Yes, we can still leverage them in LINQ queries.

    +   - Can we execute the queries without the `DBSet` class or **POrtable COmponents
    (POCO)** object?

    +     - Yes, we do have a provision to execute queries without `DBSet` or a POCO
    object.'
  merge: -1
  img_proc: true
- pgno: 180
  md: "After addressing these concerns, we have a fair idea of what we will be covering\
    \ in this chapter:\n\n+   - Basic raw SQL queries\n+   - Building parameterized\
    \ queries\n+   - Composing with LINQ\n+   - Executing SQL query without a DBSet\
    \ class or POCO\n\n# Basic raw SQL queries\n\nThe main idea of abstracting SQL\
    \ queries from the framework is to perform implementation irrespective of the\
    \ data source that we will be using in the application. We might think that creating\
    \ raw SQL queries must be defeating the very purpose of EF Core's existence. There\
    \ are a few valid requirements that might need raw SQL instead of leaving Entity\
    \ to do the work for us.\n\nIt could be anything, something that could not be\
    \ achieved through LINQ queries or performance that was not optimized by Entity-generated\
    \ queries. The reason could be anything, but, at the end of the day, we all work\
    \ for an outcome, an optimized outcome with better performance. We might be ready\
    \ to take extreme measures in not aligning with the framework/APIs, provided the\
    \ reason is substantiated more than the API usage.\n\nWe could perform basic SQL\
    \ queries or execute stored procedures or functions from EF in raw mode. The framework\
    \ has a provision in the DBSet through the FromSql method that does the job for\
    \ us, allowing us to execute raw SQL using EF. It also allows us to create LINQ\
    \ queries based on SQL queries; because was made possible since it has been exposed\
    \ from the DBSet type.\n\nLet's extend the blogging system by making the blogs\
    \ controller execution into raw SQL queries, and we will begin with the Index\
    \ action using a raw SQL query, displayed as follows:\n\n```\npublic async Task<IActionResult>\
    \ Index()\n{\n    return View(await _context.Blogs.FromSql(\"Select *\n      \
    \  from dbo.Blog\").ToListAsync());\n}\n```"
  merge: -1
  img_proc: true
- pgno: 181
  md: "The preceding listed implementation produces the following output in the view,\
    \ and it doesn't make much difference to the existing rendered view:\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_181_0.png)\n\
    \nWe will create a new action just to illustrate the stored procedure (SP) GetLatestBlogs\
    \ execution using raw SQL query EF. The implementation of an SP using FromSql\
    \ is listed as follows:\n\n```\npublic async Task<IActionResult> LatestBlogs()\n\
