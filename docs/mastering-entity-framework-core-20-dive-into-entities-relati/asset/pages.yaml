- pgno: 167
  md: "# # Creating client-side logic for custom validation\n\nThe custom validator\
    \ we created in this chapter should provide client-side validation support as\
    \ well. By default, EF will only perform server-side validation (out of the box),\
    \ but the client-side validation should be performed manually. The framework has\
    \ provision to inject custom validation and its errors in the context attributes.\
    \ However, we need to perform/implement client-side validation on our own.\n\n\
    The `FutureOnly` custom validation attribute can be configured to support client-side\
    \ validation using `IClientModelValidator`, which expects us to implement the\
    \ `AddValidation` method. We should be injecting the required custom validation\
    \ values in the context attributes; the required implementation is displayed as\
    \ follows:\n\n```\n```csharp\npublic class FutureOnlyAttribute : ValidationAttribute,\n\
    \    IClientModelValidator\n{\n    protected override ValidationResult IsValid(object\
    \ value,\n        ValidationContext validationContext)\n    {\n        var post\
    \ = (Post) validationContext.ObjectInstance;\n        return post.PublishedDateTime.CompareTo(DateTime.Now)\
    \ < 0\n            ? new ValidationResult(\"Publishing Date cannot be in past,\n\
    \              kindly provide a future date\")\n            : ValidationResult.Success;\n\
    \    }\n\n    public void AddValidation(ClientModelValidationContext context)\n\
    \    {\n        if (context == null)\n        {\n            throw new ArgumentNullException(nameof(context));\n\
    \        }\n        context.Attributes[\"data-val\"] = \"true\";\n        context.Attributes[\"\
    data-val-futureonly\"] = \"Publishing Date\n            cannot be in past, kindly\
    \ provide a future date\";\n    }\n}\n```\n```"
  merge: -1
  img_proc: true
