- pgno: 358
  md: '# # Multi-tenancy


    The people living in a gated community could be easily related with the term multi-tenancy.
    We will be having multiple families living in their own flat/home (a user) within
    a building/phase (a tenant); together, they will form a gated community that is
    nothing but multi tenancy. In software terminology, a system supporting a set
    of users grouped together as a tenant (based on roles) would have their data stored
    in a single or shared database, and still serving data based on the tenant is
    called multi-tenancy.


    The multi-tenancy application can be classified as follows:


    +   - Standalone

    +   - Database-per-tenant

    +   - Shared multi-tenant


    We will explore each one of the applications individually in the next sub-sections.


    # # Standalone


    The standalone model deals with an individual application and its own database,
    isolating everything from different tenants, right from database to the application.
    It helps the developers to customize the application and have different schema
    for different customers, which will be widely used in product-based companies.
    Nowadays, companies were drifting toward this approach due to microservices architecture.
    Also, the need arises based on the volume of the transactions and the sensitivity
    of data.


    The following diagram explains the standalone model, where each application has
    its own database:'
  merge: -1
  img_proc: true
- pgno: 359
  md: '![](img/17e01f90db603e72c0f0c6a7dce8920c_359_0.png)


    If we watch closely, there is one more thing: the application will never interact
    with each other. In the multi-tenancy terminology, each application instance is
    owned by a tenant and the tenant has ownership to the complete the database. The
    financial institutions will have the standalone model due to sensitivity and volume
    of data. It would be easy for the developers to provide access to the vendors
    if they want to customize, have control over their data, scale the application
    or database without affecting others, and more, yet, still, its a costly solution
    since it deals with multiple database from a software company''s perspective.


    We explored the standalone model in this section. Now, let’s move on to database-per-tenant
    in the next section.


    # Database-per-tenant


    The database-per-tenant model deals with a single/shared application, but with
    its own database (tenant, have their own database), isolating the database alone.
    It will help developers have a single code base for the application having customization
    kept in the database; if they do not move all their customization to the database,
    they end up affecting every vendor whenever any new features/product support is
    included in the system. The database isolation will help the companies have control
    over data, even though the code base is shared across the vendors.'
  merge: -1
  img_proc: true
