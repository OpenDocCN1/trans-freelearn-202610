- pgno: 33
  md: "# # Data models\n\nWhen we think about creating data models in the .NET world\
    \ way before creating the database, we are a little bit off the legacy track,\
    \ and yes, it's been widely called the **Code-First approach**. Let's create entity\
    \ classes using code-first for the Blogging application, and put them into the\
    \ Models folder under the project.\n\n# ## Blog entity\n\nCreate a `Blog.cs` class\
    \ file and include the following properties:\n\n```\npublic class Blog\n{\n  \
    \  public int Id { get; set; }\n    public string Url { get; set; }\n    public\
    \ ICollection<Post> Posts { get; set; }\n}\n```\n\nThe Entity Framework will look\
    \ for any property with the name Id or TypeNameId and marks them as the primary\
    \ key of the table. The Posts property is a navigation property which contains\
    \ Post items related to this Blog entity. It doesn't matter whether we use `ICollection<T>`\
    \ or `IEnumerable<T>` for the navigation property, EF will create a collection\
    \ for us, `HashSet<T>` by default. We could also create a concrete collection\
    \ using `List<T>`.\n\n# ## Post entity\n\nCreate a `Post.cs` class file and include\
    \ the following properties:\n\n```\npublic class Post\n{\n    public int Id {\
    \ get; set; }\n    public string Title { get; set; }\n    public string Content\
    \ { get; set; }\n    public DateTime PublishedDateTime { get; set; }\n    public\
    \ int BlogId { get; set; }\n    public Blog Blog { get; set; }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 34
  md: "The `BlogId` property is a foreign key created for the corresponding `Blog`\
    \ navigation property. As you may notice in this case, we have an individual item\
    \ as the navigation property, as opposed to a list in the `Blog` entity. This\
    \ is where relationship type comes into the picture, which we will be exploring\
    \ more in Chapter 3, *Relationships – Terminology and Conventions*.\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_34_0.png)\n\
    \nEF will allow us to create an individual navigation property without any foreign\
    \ key in the entity. In those cases, EF will create a foreign key for us in the\
    \ database table using the `Blog-Id` pattern (the `Blog` navigation property along\
    \ with its `Id` primary key). EF will generate them automatically for all navigational\
    \ properties against the `Id` primary key, but it also allows us to name it differently\
    \ and decorate it via a custom attribute.\n\nWe have built the schema required\
    \ for the application so far, but it was not configured in EF, so let's see how\
    \ the data models get connected/configured with EF using database context.\n\n\
    # Database context\n\nThe main entry point for EF would be any class that inherits\
    \ the `Microsoft.EntityFrameworkCore.DbContext` class. Let's create a class called\
    \ `BlogContext` and inherit the same. We will keep the context and other EF related\
    \ configurations inside the `Data` folder. Create a `Data` folder in the project,\
    \ and also create `BlogContext.cs` inside this folder:\n\n```\npublic class BlogContext:\
    \ DbContext\n{\n    public BlogContext(DbContextOptions<BlogContext> options)\n\
    \        : base(options)\n    {\n    }\n\n    public DbSet<Blog> Blogs { get;\
    \ set; }\n    public DbSet<Post> Posts { get; set; }\n}\n```\n\nEF interprets\
    \ `DbSet<T>` as a database table; we have created a `DbSet<T>` property for all\
    \ the entities for our blogging system. We usually name the properties in plural\
    \ form as the property will hold list of entities, and EF will be using those\
    \ property names while creating tables in the database."
  merge: -1
  img_proc: true
- pgno: 35
  md: "Creating a DbSet for a parent entity is enough for EF to identify the dependent\
    \ entities and create corresponding tables for us. EF will be using plural form\
    \ while deciding table names.\n\n.NET developers and SQL developers debate plural\
    \ table names and often end up creating entities with two different conventions.\
    \ As a framework, EF supports those scenarios as well. We could override the default\
    \ plural naming behavior using Fluent API. Refer to the following Fluent API code:\n\
    \n```\npublic class BlogContext : DbContext\n{\n    ...\n    protected override\
    \ void OnModelCreating(ModelBuilder modelBuilder)\n    {\n        modelBuilder.Entity<Blog>().ToTable(\"\
    Blog\");\n        modelBuilder.Entity<Post>().ToTable(\"Post\");\n    }\n}\n```\n\
    \nWe have created a database context and configured the data models in it. You\
    \ may notice we cannot see any connection string pointing to the database. It\
    \ could have been done using the OnConfiguring() method with a hard-coded connection\
    \ string, but it would not be an ideal implementation. Rather, we will use built-in\
    \ dependency injection support from .NET Core to configure the same in the next\
    \ section.\n\n# Registering the context in services (.NET Core DI)\n\nThe dependency\
    \ injection support in the ASP.NET framework came too late for the .NET developers/architects\
    \ who were seeking shelter from third-party tools such as Ninject, StructureMap,\
    \ Castle Windsor, and so on. Finally, we gained support from ASP.NET Core. It\
    \ has most of the features from the third-party DI providers, but the only difference\
    \ is the configuration should happen inside the Startup.cs middleware.\n\nFirst\
    \ thing's first, let's configure the connection string in our new appSettings.json:\n\
    \n```\n\"ConnectionStrings\": {\n    \"DefaultConnection\": \"Server\n       \
    \ (localdb)\\\\mssqllocaldb;Database=MasteringEFCoreBlog;\n        Trusted_Connection=True;MultipleActiveResultSets=true\"\
    \n},\n```"
  merge: -1
  img_proc: true
