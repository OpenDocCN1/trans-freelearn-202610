- pgno: 274
  md: 'The **Post** list displays that the changes performed by the first user are
    overwritten by the second user:


    ![](img/17e01f90db603e72c0f0c6a7dce8920c_274_0.png)


    The change committed by the first user should not be removed/overwritten with
    the new data without considering the data updated in the database. This is a concurrency
    issue that we will be discussing further in the next section.


    # Optimistic concurrency


    Optimistic concurrency allows the concurrency conflict to occur and the application
    should respond appropriately, as mentioned in the following list:


    +   - Tracking the changes on every property/column of an entity, which allows
    us to persist changes without affecting the stale data in the database, provided
    both the changes were performed in different properties'
  merge: -1
  img_proc: true
- pgno: 275
  md: '+   - Prevents the changes from being updated, by highlighting the current
    value from the data store and allowing the user to revisit his data for further
    persistence

    +   - Overwrite the changes with the latest ones, and ignore the updated data
    in the data store


    Optimistic concurrency could be adopted in an application that is more focused
    on performance and only during conflicts; the user would be spending additional
    time. This ensures that the time is spent wisely on most occasions, since we do
    not have any overhead for regular operations. The trade-off in the optimistic
    concurrency approach is that we are leaving the developers and the users to handle
    conflicts and store appropriate data stored in the database.


    We have learnt about optimistic concurrency; let''s look into pessimistic concurrency
    in the next section.


    # Pessimistic concurrency


    As the name suggests, we perform locks at the data store that prevent users from
    updating stale data at the cost of performance. Yes, managing those locks by a
    data store consumes more resources, which in turn affects the performance. This
    could be achieved in the following way:


    +   - While reading/updating the data from/into the data store, we will request
    a lock for other read-only or update access:

    +     - Locking a row for read-only access will allow other users to gain a lock
    for read-only but not for update

    +     - Locking a row for an update access will not let any other users either
    lock for read-only or update


    Pessimistic concurrency could be adopted in the application where the users were
    too specific with the data and they do not compromise how the data was dealt with
    against the performance. The persisted data will always be valid, or in other
    words, we might never run into conflicts, but with a huge cost, performance. Every
    persistence will involve an overhead that ensures that we never run into conflicts
    with data persistence. In most scenarios, we will never compromise performance,
    and taking this approach would be very rare.'
  merge: -1
  img_proc: true
