- pgno: 191
  md: "# Composing with LINQ\n\nWe have performed flat SQL queries so far. This doesn't\
    \ involve LINQ queries. If we had a mechanism that could leverage flat queries\
    \ composed of LINQ to SQL queries, then we could get the best of both worlds.\
    \ Fortunately, we do have built-in support in Entity Framework, and the flat SQL\
    \ queries could be composed of LINQ queries, and we will cover them in detail\
    \ in this section.\n\nLet's comment the current implementation in LatestBlogs()\
    \ and perform the SP implementation using flat queries composed with LINQ. Ideally,\
    \ what we are trying to achieve is to get the table data using a LINQ query and\
    \ compose the result with a LINQ query to perform filtering and ordering from\
    \ a LINQ query (this might not be a real-world scenario, but it works well for\
    \ illustration):\n\n```\npublic async Task<IActionResult> LatestBlogs()\n{\n \
    \   //return View(\"Index\", await _context.Blogs.FromSql(\"EXEC [dbo].\n    [GetLatestBlogs]\"\
    ).ToListAsync());\n    var comparisonDateTime = DateTime.Now.AddMonths(-3);\n\
    \    return View(\"Index\", await _context.Blogs\n        .FromSql(\"Select *\
    \ from dbo.Blog\")\n        .Where(x=>x.CreatedAt >= comparisonDateTime)\n   \
    \     .OrderByDescending(x=>x.Id)\n        .ToListAsync());\n}\n```\n\nWe can\
    \ see the outcome as expected, and it reflects that of the earlier result set\
    \ for the latest blogs in the following screenshot:\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_191_0.png)"
  merge: -1
  img_proc: true
- pgno: 192
  md: "Let's dig in further and see what is happening internally and how Entity Framework\
    \ is processing these queries. We might be thinking that EF Core would be retrieving\
    \ blog entries and does a LINQ query with in-memory data. The following **SQL\
    \ Server Profiler** trace will prove us wrong. If we closely watch the highlighted\
    \ part of the trace, it is evident that Entity Framework is performing a LINQ\
    \ to an SQL query by translating the LINQ query into the required SQL query and\
    \ executing it in one shot in the database. Cool, right? The following screenshot\
    \ would illustrate that the parameterised execution is translated into SQL statement:\n\
    \n![](img/17e01f90db603e72c0f0c6a7dce8920c_192_0.png)\n\nWe have looked at the\
    \ mechanism to compose flat SQL queries with LINQ, but we haven't covered the\
    \ Include() data, which is a powerful feature of Entity Framework. You guessed\
    \ it right, we could perform the Include() operation on flat SQL queries composed\
    \ of LINQ queries as well. All we need to do is have the .Include() method as\
    \ usual before the .ToList() call, which translates the LINQ queries into SQL\
    \ queries. The following code would consume the .Include() functionality:\n\n\
    ```\npublic async Task<IActionResult> LatestBlogs()\n{\n    //return View(\"Index\"\
    , await _context.Blogs.FromSql(\"EXEC [dbo].\n        [GetLatestBlogs]\").ToListAsync());\n\
    }\n```"
