- pgno: 286
  md: "# Configuring non-timestamp tokens through\nFluent API\n\nThe Fluent API configuration\
    \ is made possible because Microsoft has exposed a series of extension methods,\
    \ which allows us to execute appropriate functionality against the property of\
    \ the model that supports it. In our blogging system, we will configure the Url\
    \ of the Post entity as the concurrency token by enabling the property using `IsConcurrencyToken()`\
    \ as shown in the following code:\n\n```\nprotected override void OnModelCreating(ModelBuilder\
    \ modelBuilder)\n{\n    // Code removed for brevity\n    modelBuilder.Entity<Post>()\n\
    \        .ToTable(\"Post\")\n        .Property(x=>x.Url)\n        .IsConcurrencyToken();\n\
    \    // Code removed for brevity\n}\n```\n\nThe preceding configuration will let\
    \ EF Core consider the Url column as the concurrency token, and any further update\
    \ to this column will restrict users from performing parallel updates, as it did\
    \ in the data annotation configuration.\n\nWe have exhaustively seen how this\
    \ concurrency token works, so let's move on to the next section that explores\
    \ timestamp-based concurrency tokens.\n\n# Timestamp-based concurrency tokens\n\
    \nWe have already explored `Timestamp`-based concurrency tokens in the *Introducing\
    \ concurrency tokens* section. We can jump directly into the configuration, consider\
    \ the same scenario and see how the conflicts were handled using the `Timestamp`\
    \ concurrency token.\n\nAs we did with the non-timestamp based concurrency token,\
    \ timestamp-based concurrency tokens could also be configured in the following\
    \ ways:\n\n+   - Data annotations\n+   - Fluent API\n\nWe will see how the configurations\
    \ were performed using both the approaches in our blogging system, and later we\
    \ will see them in action."
  merge: -1
  img_proc: true
- pgno: 287
  md: "# Configuring timestamp tokens through data annotation\n\nWe have already seen\
    \ how data annotation configuration works. For timestamp-based tokens, we need\
    \ a property that will have a byte array, and it should be marked using the Timestamp\
    \ data annotation. This is the only configuration required from our end; EF will\
    \ take care of the rest:\n\n```\npublic class Post\n{\n    // Code removed for\
    \ brevity\n    [Timestamp]\n    public byte[] Timestamp { get; set; }\n}\n```\n\
    \nThe preceding configuration will let EF Core consider the Timestamp column as\
    \ the concurrency column, and any further update to this column will restrict\
    \ users from performing parallel updates.\n\nSince we are introducing a new column\
    \ to the entity, related commands should be updated as well. In our scenario,\
    \ we need to update the UpdatePostCommand type with new byte array Timestamp property\
    \ and its usage as shown in the following code:\n\n```\npublic class UpdatePostCommand\
    \ : CommandBase, ICreatePostCommand<int>\n{\n    // Code removed for brevity\n\
    \    public byte[] Timestamp { get; set; }\n    // Code removed for brevity\n\
    \    public async Task<int> HandleAsync()\n    {\n        var post = new Post\n\
    \        {\n            // Code removed for brevity\n            Timestamp = Timestamp\n\
    \        };\n        // Code removed for brevity\n    }\n}\n```"
