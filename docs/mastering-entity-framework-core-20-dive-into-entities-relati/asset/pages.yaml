    .NET Core, the open source platform, paved the way for multi-platform support
    in Visual Studio 2017. The editors came in different flavors, supporting both
    platform-specific and cross-platform IDEs:


    +   - **Visual Studio:** An exclusive edition for Windows with Community, Professional
    and Enterprise editions:'
  merge: -1
