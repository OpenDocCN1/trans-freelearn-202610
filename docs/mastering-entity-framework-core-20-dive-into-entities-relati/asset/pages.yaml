- pgno: 124
  md: '# 5


    # Know the Validation – Explore Inbuilt Validations


    We have learned and built different kinds of relationships supported by EF in
    this chapter. We started with regular one-to-one, one-to-many, and many-to-many
    relationships, and from there applied a few Fluent API methods to achieve relationships.
    Then, we covered different usages of the Fluent API on the terminologies we saw
    in Chapter 3, Relationships – Terminology and Conventions. Finally, we have seen
    the behavior of Delete operations on dependent entities if a principal entity
    gets deleted. These sections dealt with relationships, but never looked at validations,
    except where required. Let''s explore them in the next chapter.


    We have explored about different kind in-built relationships, leveraged Fluent
    API methods in creating relationships. We have also looked at the use of the Fluent
    API on navigational properties, mandating certain fields using isRequired(), implementing
    principal and foreign keys using HasPrincipalKey() and HasForeignKey() methods,
    and much more.


    In this chapter, we will address the following concerns with respect to data security:


    +   - What should be done to the data before we send it over the network?

    +     - Add certain rules/conditions to the data (defined in the model)

    +     - Validate the models both on the client-side and server-side (supported
    out of the box)'
  merge: -1
  img_proc: true
- pgno: 125
  md: '+   - How are the validations handled in ASP.NET?

    +     - We started with JavaScript-based validation, then control-driven validations
    were performed and finally from MVC we started using data model-driven validations

    +     - We will be exploring how MVC handles validation through the data model

    +   - Do we need to explicitly use HTML5 validation?

    +     - Not required, as rendering the MVC engine internally converts the data-model
    driven validations into HTML5 data-attribute driven validations


    We will be covering all built-in validations in this chapter, listed as follows:


    +   - Built-in validations

    +   - `Required` field validation

    +   - `EmailAddress` field validation

    +   - `Compare` field validation

    +   - `Url` field validation

    +   - `MinLength` field validation

    +   - `MaxLength` field validation

    +   - `RegularExpression` field validation


    # Diving into built-in validations


    Data security plays a vital role in any application''s development, as almost
    everything revolves around data. So it is crucial that we store valid data in
    the database, ensuring that the data passed on from the user to the application
    server is safely transmitted; the data reaching the server also should contain
    valid data (probably having a valid datatype, length, and so on).'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'We started performing validations using JavaScript in ASP.NET Web Forms initially;
    sadly, most of the ASP.NET developers in the initial days used JavaScript only
    for validations. Then we moved onto control-driven validation which wraps up all
    the scripting inside ASP controls accepting parameters required for validation.
    Finally, we were exposed to data model-driven validation, which allows developers
    to configure validation through data annotation, automatically handling both client-side
    (using jQuery unobtrusive validation) and server-side (using MVC model binder
    validation).


    The **Entity Framework (EF)** allows us to achieve the same, using annotation/attribute
    validation, which reduces a lot of coding with respect to security (client-side
    and server-side validations are simplified due to this requirement). EF provides
    us with certain built-in validations:


    +   - Required

    +   - EmailAddress

    +   - Compare

    +   - Url

    +   - MinLength

    +   - MaxLength

    +   - RegularExpression


    The preceding list briefly covers most of the validators. If you would like to
    take a look at a complete list of validators, please visit `https://msdn.microsoft.com/en-us/library/system.componentmodel.dataannotations(v=vs.110).aspx`.
    Let''s take a look at each of the validators listed in detail.


    # Required field validation


    We will start with the `Required` built-in validation which allows validators
    to check whether the field has a value or not. The required validation is necessary
    to ensure that the mandatory fields are filled in or updated by the user before
    transmitting the data to the server for further processing.


    The following steps will help us in understanding how validation works:


    +   1. The `Required` field validator is added using data annotation in the model.

    +   2. The MVC engine performs validation on both client-side and server-side
    using this configuration.'
  merge: -1
  img_proc: true
- pgno: 127
  md: '+   3. When MVC engine generates the form view with the input field, it also
    scaffolds the `<span>` element along with each input field to hold error messages.

    +   4. When we run the application and submit the form without providing any value
    in the input field, which has `aria-required` field validation, a validation error
    would be added to the model state errors list.

    +   5. The errors would be displayed in the `<span>` associated with each element
    of the form.


    The validation error would be captured in the `Required` data annotation if the
    field is NULL or "" (empty) or has white space in it.


    ![](img/17e01f90db603e72c0f0c6a7dce8920c_127_0.png)


    Data type of the field value can be anything. So why on earth is the validator
    checking for an empty string? It''s simple. Because most of the datatypes were
    translated from a string into their appropriate types by the model binder, so
    it''s easy for the framework to check whether the value exists or not using `String`
    as the default datatype.


    The `Required` attribute/data annotation can be added in the `Blog` code shown
    as follows; the `DataAnnotations` reference should be included to configure validation.
    The following screenshot displays the intelli-sense that allows us to import required
    namespace (triggered using Ctrl + .):


    ![](img/17e01f90db603e72c0f0c6a7dce8920c_127_1.png)'
  merge: -1
  img_proc: true
