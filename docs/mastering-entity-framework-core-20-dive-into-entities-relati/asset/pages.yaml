- pgno: 185
  md: '# Building parameterized queries


    Building and executing parameterless queries would have fewer usages, whereas
    most usages in any application would be based on parameters/conditions. Introducing
    parameters in flat/raw queries would expose us to a threat of SQL injection. How
    are we going to protect our application from such a threat? We cannot ignore them
    in a real-world application, as we have applications that are hugely dependent
    on inline queries.


    SQL injection is a technique used by hackers to exploit any system, and it would
    shake it to its core in terms of security. It could be performed by embedding
    user inputs blindly with inline SQL queries.


    The most commonly injected value would be `OR 1 = 1`, which would pump an entire
    record set instead of using the input value for filtering. For instance, in our
    blogging system, if a hacker tries to retrieve user information he could tweak
    the following query (assuming we have such a query in the system):


    ```

    SELECT * FROM USERS WHERE Id = '' + userId + ''.userId

    ```


    Considering the `userId` passed as 5 from the application, it could be constructed
    as follows:


    ```

    SELECT * FROM USERS WHERE Id = 5

    ```


    The preceding query displays or returns only one user matching the Id as 5.


    If the hacker injects the previously mentioned value, it would be as follows:


    ```

    SELECT * FROM USERS WHERE Id = 5 OR 1 = 1

    ```


    The preceding SQL injection would return all users'' information, rather than
    returning only the user matching ID 5. This is a simple SQL injection.


    ![](img/17e01f90db603e72c0f0c6a7dce8920c_185_0.png)'
  merge: -1
  img_proc: true
- pgno: 186
  md: "Parameterized queries are the mechanism used to protect us from such threats.\
    \ They ensure that the SQL injection doesn't happen, and the previously mentioned\
    \ injection problem would not happen with the parameterized queries:\n\n```\n\
    public async Task<IActionResult> Details(int? id)\n{\n    if (id == null)\n  \
    \  {\n        return NotFound();\n    }\n\n    var blog = await _context.Blogs.FromSql(\"\
    Select * from dbo.Blog WHERE Id = {0}\", id).FirstOrDefaultAsync();\n    if (blog\
    \ == null)\n    {\n        return NotFound();\n    }\n\n    return View(blog);\n\
    }\n```\n\nInstead of directly passing the input value as a parameter in the FromSql\
    \ method, we could also use the SqlParameter object to construct the parameter,\
    \ which also ensures that the query is safe from SQL injection. The following\
    \ code would illustrate parameterised query execution in EF Core:\n\n```\npublic\
    \ async Task<IActionResult> Details(int? id)\n{\n    if (id == null)\n    {\n\
    \        return NotFound();\n    }\n\n    var blog = await _context.Blogs.FromSql(\"\
    Select * from dbo.Blog WHERE Id = @id\", new SqlParameter(\"id\", id)).FirstOrDefaultAsync();\n\
    \    if (blog == null)\n    {\n        return NotFound();\n    }\n\n    return\
    \ View(blog);\n}\n```"
