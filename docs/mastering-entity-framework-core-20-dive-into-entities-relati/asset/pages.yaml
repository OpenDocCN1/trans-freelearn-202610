  md: "```\n```csharp\nif (context.Blogs.Any())\n{\n    return;    // DB has been\
    \ seeded\n}\nvar dotnetBlog = new Blog {\n    Url = \"http://blogs.packtpub.com/dotnet\"\
    \ };\nvar dotnetCoreBlog = new Blog { Url =\n    \"http://blogs.packtpub.com/dotnetcore\"\
    \ };\nvar blogs = new Blog[]\n{\n    dotnetBlog,\n    dotnetCoreBlog\n};\nforeach\
    \ (var blog in blogs)\n{\n    context.Blogs.Add(blog);\n}\ncontext.SaveChanges();\n\
    var posts = new Post[]\n{\n    new Post{Id= 1,Title=\"Dotnet 4.7 Released\",Blog\
    \ = dotnetBlog,\n    Content = \"Dotnet 4.7 Released Contents\", PublishedDateTime\
