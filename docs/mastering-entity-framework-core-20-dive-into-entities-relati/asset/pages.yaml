- pgno: 31
  md: '# Installing Entity Framework


    The Entity Framework package should be installed as part of the NuGet package,
    and can be done in the following ways:


    +   1. Go to the Package Manager Console (Tools | NuGet Package Manager | Package
    Manager Console), select the project where the package should be installed:


    Add the following command in the PM Console to install the package on the selected
    project:


    ```

    Install-Package Microsoft.EntityFrameworkCore.SqlServer

    ```


    The Package Manager Console will be opened as shown in the following screenshot,
    Kindly use this space to install the package using the preceding command:


    ![](img/17e01f90db603e72c0f0c6a7dce8920c_31_0.png)


    +   2. Go to the Package Management tab (either from Tools or from Dependencies/Project).

    +     - For a solution-wide installation, and availability for all projects that
    are part of the solution, go to Tools | NuGet Package Manager | Manage NuGet Packages
    for Solution... or right-click on the solution from Solution Explorer and select
    Manage NuGet Packages for Solution...

    +     - For project wise installation, right-click on dependencies from the desired
    project or right-click on the desired project and select Manage NuGet Packages...'
  merge: -1
