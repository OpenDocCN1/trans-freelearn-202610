  md: "Since we already have an asynchronous implementation in place, we will start\
    \ examining them right from the controller up to the data context execution. Let's\
    \ take a look at the post controller `Index` action that is decorated with the\
    \ `async` keyword, which also requires a return type to be wrapped inside a `Task<>`\
    \ generic type. The asynchronous method should be invoked using the `await` keyword\
    \ as shown in the following code:\n\n```\npublic async Task<IActionResult> Index()\n\
    {\n    var posts = await _postRepository.GetAsync(\n    new GetAllPostsQuery(_context)\n\
    \    {\n        IncludeData = true\n    });\n    // Code removed for brevity\n\
    }\n```\n\nLet's dig in deep and investigate how this `GetAsync()` is implemented.\
    \ It is a generic implementation that invokes `HandleAsync()` using the async/await\
    \ keywords as shown here:\n\n```\npublic async Task<IEnumerable<Post>> GetAsync<T>(T\
    \ query)\n    where T : IQueryHandlerAsync<IEnumerable<Post>>\n{\n    return await\
    \ query.HandleAsync();\n}\n```\n\nThe `HandleAsync()` method is again implemented\
    \ inside `GetAllPostsQuery` (in our scenario), which consumes the EF Core asynchronous\
    \ `ToListAsync()` method, which wraps up our asynchronous implementation. This\
    \ ensures that the database execution happens in an asynchronous way, and the\
    \ operation continues after the data is returned from the data store. The following\
    \ code performs asynchronous execution on `ToListAsync()` methods which will perform\
    \ database operation:\n\n```\npublic class GetAllPostsQuery : QueryBase,\n   \
    \ IGetAllPostsQuery<GetAllPostsQuery>\n{\n    // Code removed for brevity\n  \
    \  public async Task<IEnumerable<Post>> HandleAsync()\n    {\n        var posts\
    \ = IncludeData\n            ? await Context.Posts\n            .Include(p =>\
    \ p.Author).Include(p => p.Blog)\n            .Include(p => p.Category).Include(p=>p.TagPosts)\n\
    \            .ToListAsync()\n            : await Context.Posts\n            .ToListAsync();\n\
    ```"
