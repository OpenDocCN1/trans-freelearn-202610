- pgno: 198
  md: '# Executing SQL query without a DBSet or POCO


    We need to investigate whether Microsoft supports flat SQL execution anonymously
    without requiring a DBSet or POCO object. Since it''s open source, it is easy
    for us to investigate this. We could directly get into their source code in the
    GitHub repository (https://github.com/aspnet/EntityFramework) and investigate
    whether they have any implementation of the expected behavior.


    Microsoft does have a couple of extension methods for a relational database as
    a façade, which is available at https://github.com/aspnet/EntityFramework/blob/0024373adae7e331ed217de2b4bd12be5eedf925/src/EFCore.Relational/RelationalDatabaseFacadeExtensions.cs.


    The extension method located in the preceding GitHub location is illustrated as
    follows. We need to capture it, as we will be discussing the implementation in
    this section:


    ![](img/17e01f90db603e72c0f0c6a7dce8920c_198_0.png)'
  merge: -1
