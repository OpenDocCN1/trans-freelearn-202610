- pgno: 253
  md: "# Custom transaction scope support\n\nThe transaction scope could be created\
    \ by defining an interface, which requires us to either Commit() or Rollback().\
    \ The contract required for the custom transaction interface code is shown in\
    \ the following code:\n\n```\npublic interface ITransactionScope\n{\n    void\
    \ Commit();\n    void Rollback();\n}\n```\n\nThe database transactions were maintained/logged\
    \ in a transaction list, which is then used to either Commit() or Rollback() for\
    \ the entire set of transaction objects. In order to use TransactionScope within\
    \ a using statement, we need to inherit and implement IDisposable as well. The\
    \ custom TransactionScope implementation which maintains the Commit() and Rollback()\
    \ is shown in the following code:\n\n```\npublic class TransactionScope : ITransactionScope,\
    \ IDisposable\n{\n    // Flag: Has Dispose already been called?\n    private bool\
    \ disposed = false;\n    public TransactionScope()\n    {\n        Transactions\
    \ = new List<IDbContextTransaction>();\n    }\n    ~TransactionScope()\n    {\n\
    \        Dispose(false);\n    }\n    public List<IDbContextTransaction> Transactions\
    \ { get; set; }\n    public void Commit()\n    {\n        Transactions.ForEach(item\
    \ =>\n        {\n            item.Commit();\n        });\n    }\n    public void\
    \ Rollback()\n    {\n        Transactions.ForEach(item =>\n        {\n       \
    \     item.Rollback();\n        });\n    }\n    public void Dispose()\n```"
  merge: -1
  img_proc: true
