- pgno: 77
  md: '# Dependent entity


    The entity that cannot survive on its own (always dependent on its parent) ends
    up being a child. In a relationship, this would be termed a Dependent entity.
    Consider the following diagram:


    ![](img/17e01f90db603e72c0f0c6a7dce8920c_77_0.png)


    In our blogging system, the Post entity depends on the Blog entity (posts are
    made for the corresponding blog, so without a blog entry the post wouldn''t exist),
    hence we could conclude Post is the dependent entity. In the database world, this
    entity holds a foreign key that will hold the reference to the primary entity
    in the relationships. This is depicted in the following diagram:


    ![](img/17e01f90db603e72c0f0c6a7dce8920c_77_1.png)


    In our blogging system, the User entity depends on the Person entity, hence we
    could conclude User is the dependent entity. This is depicted in the following
    diagram:


    ![](img/17e01f90db603e72c0f0c6a7dce8920c_77_2.png)'
  merge: -1
  img_proc: true
