- pgno: 199
  md: "They have an implementation for raw SQL queries, but it is a limited implementation.\
    \ It has `ExecuteSqlCommand` that supports only `ExecuteNonQuery` functionality,\
    \ which means we couldn't use this method for processing SQL queries that return\
    \ result sets:\n\n```\n```csharp\npublic static int ExecuteSqlCommand(\n    [NotNull]\
    \ this DatabaseFacade databaseFacade,\n    RawSqlString sql,\n    [NotNull] params\
    \ object[] parameters);\n\n// Note that this method doesn't start a transaction\
    \ hence it doesn't use ExecutionStrategy\npublic static int ExecuteSqlCommand(\n\
    \    [NotNull] this DatabaseFacade databaseFacade,\n    [NotNull] FormattableString\
    \ sql)\n    => ExecuteSqlCommand(databaseFacade, sql.Format, sql.GetArguments());\n\
    \n// Note that this method doesn't start a transaction hence it doesn't use ExecutionStrategy\n\
    public static int ExecuteSqlCommand(\n    [NotNull] this DatabaseFacade databaseFacade,\n\
    \    RawSqlString sql,\n    [NotNull] IEnumerable<object> parameters)\n{\n   \
    \ Check.NotNull(databaseFacade, nameof(databaseFacade));\n    Check.NotNull(sql,\
    \ nameof(sql));\n    Check.NotNull(parameters, nameof(parameters));\n\n    var\
    \ concurrencyDetector = databaseFacade.GetService<IConcurrencyDetector>();\n\n\
    \    using (concurrencyDetector.EnterCriticalSection())\n    {\n        var rawSqlCommand\
    \ = databaseFacade\n            .GetRelationalService<IRawSqlCommandBuilder>()\n\
    \            .Build(sql, parameters);\n\n        return rawSqlCommand\n      \
    \      .RelationalCommand\n            .ExecuteNonQuery(\n                databaseFacade.GetRelationalService<IRelationalConnection>(),\n\
    \                rawSqlCommand.ParameterValues);\n    }\n}\n```\n```"
