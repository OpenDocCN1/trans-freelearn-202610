    # RegularExpression field validation


    Regular expression validation is the only solution used for most validations such
    as email, phone number, zip code, username, password, and so on. Most of the patterns
    used with regular expressions are wrapped into separate validations. Still, the
    usage is vast and requires a method to define custom validation. That''s where
    RegularExpression validation comes in handy. Lets investigate regular expressions
    in this section.'
