- pgno: 365
  md: "# Blocking cross-tenant write operation\n\nThe multi-tenant implementation\
    \ does not restrict users from performing cross-tenant updates like we handled\
    \ in the row-level security section. We should add this support in our blogging\
    \ system through multi-tenant implementation. The current code base does not allow\
    \ us to extend the behavior. So far, the information of tenants was stored only\
    \ in the entities that do not let's validate them generically on data context.\
    \ We have a strong requirement to get a taste of Domain-driven design (DDD) so\
    \ we can start using EntityBase in our application. The following entity code\
    \ has Id and TenantId fields that contain entity identifier and tenant identifier\
    \ of the user who owns the entity:\n\n```\npublic class EntityBase\n{\n    public\
    \ int Id { get; set; }\n    public Guid TenantId { get; set; }\n}\n```\n\nThe\
    \ EntityBase class should be consumed by the entities that should be a part of\
    \ a tenant implementation; this enforcement will help us in handling cross-tenant\
    \ updates. This does not stop the user to implement tenants without inheriting\
    \ from EntityBase, it just does not handle cross-tenant updates out of the box.\
    \ The Blog entity should inherit EntityBase; this enforces us to remove the redundant\
    \ Id and TenantId fields as shown here:\n\n```\npublic class Blog : EntityBase\n\
    {\n    // Remove the Id and TenantId fields\n    // Code removed for brevity\n\
    }\n```\n\nThe cross-tenant update should be handled in BlogContext, which will\
    \ allow us to override the SaveChanges() method. The EntityBase type is the key\
    \ in differentiating entities that support tenants from the others. The following\
    \ piece of code filters ChangeTracker entries based on EntityBase and projects\
    \ TenantId as a distinct list, which would allow us to validate and throw an exception\
    \ if there are more than one tenants present in the filtered tenantIds:\n\n```\n\
    public class BlogContext : DbContext\n{\n    public override int SaveChanges()\n\
    \    {\n        ValidateMultiTenantPersistence();\n        return base.SaveChanges();\n\
    \    }\n    // Override other save changes as well\n```"
  merge: -1
  img_proc: true
- pgno: 366
  md: "```\nprivate void ValidateMultiTenantPersistence()\n{\n    var tenantIds =\
    \ ChangeTracker.Entries()\n        .Where(item => item.Entity is EntityBase)\n\
    \        .Select(item => ((EntityBase)item.Entity).TenantId)\n        .Distinct();\n\
    \    if (!tenantIds.Any()) return;\n    if (tenantIds.Count() > 1 ||\n       \
    \ !(tenantIds.Count().Equals(1) &&\n        tenantIds.First().Equals(TenantId)))\n\
    \    {\n        throw new MultiTenantException(\"Invalid tenant id(s) found: \"\
    \ + string.Join(\",\", tenantIds));\n    }\n}\n```\n\nWe have used a custom exception\
    \ in the preceding implementation, but we haven't implemented it, so let's do\
    \ it now. The custom exception is expected to inherit an Exception type, and it\
    \ should also have a provision to contain the error message to pass it on or the\
    \ data required to build the error message. In the following code snippet, we\
