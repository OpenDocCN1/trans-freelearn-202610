    }\npublic async Task<IEnumerable<Post>>\n    HandleAsync(GetAllPostsQuery query)\n\
    {\n    return query.IncludeData\n        ? await _context.Posts.Include(p => p.Author).Include(p\n\
    \            => p.Blog).Include(p => p.Category).ToListAsync()\n        : await\
