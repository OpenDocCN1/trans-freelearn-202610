  md: "# # Incorporating the query object pattern into repositories\n\nIn the *Introduction\
    \ to query objects* section of this chapter, the query object pattern we had explored\
    \ need to be incorporated into the repository. Since we know the steps that need\
    \ to be followed in creating query objects, let's start creating the required\
    \ types.\n\n# ## List query object support in the repository\n\nWe have seen the\
    \ `GetAllPosts` method, which includes related data for all implementations. Since\
    \ we are creating a common query, which could be consumed in multiple places,\
    \ we need to include this as a filter in the `GetAllPostsQuery` object:\n\n```\n\
    public class GetAllPostsQuery\n{\n    public GetAllPostsQuery(bool includeData)\n\
    \    {\n        this.IncludeData = includeData;\n    }\n    public bool IncludeData\
    \ { get; set; }\n}\n```\n\nThe `GetAllPostsQuery` consumes only the `IncludeData`\
    \ filter in the type, which doesn't filter any data from the result set, but only\
    \ excludes/includes related data. The following code would create a contract to\
    \ enforce consumers to implement handle methods:\n\n```\npublic interface IPostQueryHandler<T>\
    \ where T : class\n{\n    IEnumerable<Post> Handle(T query);\n    Task<IEnumerable<Post>>\
    \ HandleAsync(T query);\n}\n```\n\nThe generic query handler interface now supports\
    \ both synchronous and asynchronous operations, which returns a list of Posts.\
    \ The `GetAllPostsQueryHandler` would perform the concrete implementation which\
    \ will yield a list of Posts in synchronous and asynchronous manner as displayed\
    \ in the following code:\n\n```\npublic class GetAllPostsQueryHandler :\n    IPostQueryHandler<GetAllPostsQuery>\n\
    {\n    private readonly BlogContext _context;\n    public GetAllPostsQueryHandler(BlogContext\
    \ context)\n    {\n        this._context = context;\n```"
