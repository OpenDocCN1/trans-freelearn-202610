- pgno: 129
  md: "The preceding method would force EF to emit the standard validation error message,\
    \ **The Url field is required**, if the field contains invalid data during validation.\
    \ The scaffolded `<span>` element is used for populating the validation error\
    \ as displayed in the following screenshot:\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_129_0.png)\n\
    \nWe can also perform validation using a custom error message using the `ErrorMessage`\
    \ field; the configuration is highlighted as follows:\n\n```\npublic class Blog\n\
    {\n    public int Id { get; set; }\n    [Required]\n    public string Url { get;\
