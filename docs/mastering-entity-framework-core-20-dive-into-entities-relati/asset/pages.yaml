- pgno: 172
  md: 'We explored the complete configuration and implementation required for the
    client-side validation of custom validator; now, let''s explore the remote validation
    feature available with us that will perform something in addition to the custom
    validation.


    # Remote validation


    The validations we have done so far were configured at model level, and when we
    say model, it happens within its own domain. We may have a requirement where we
    need to operate across models. Entity Framework has a provision to achieve the
    same since it is data driven and the validation required outside the model is
    not available in Entity Framework. To fill this gap, MVC has a provision to achieve
    the same using RemoteAttribute, which allows the user to consume the controller
    action that follows a certain pattern in the implementation.


    The remote validation requires the following boundary conditions:


    +   - RemoteAttribute requires two properties—controller and action

    +   - Configured field name should be used as the action parameter name

    +   - The action should return a Json data

    +   - The returned data must have a boolean value


    The blogging system has a similar requirement that requires remote validation:


    +   - Validation should be performed without submitting the entire form

    +   - Username can be verified on the fly when the user types in the value

    +   - The remote validation should verify the value against the database and respond
    whether the username is available or not


    RemoteAttribute should be implemented in the user model described as follows:


    +   - Create an action named IsUsernameAvailable in the Users controller.

    +   - The action should have the parameter name as username and type as String.

    +   - Perform the validation on the username value against the users table and
    capture the result in a boolean variable.'
  merge: -1
  img_proc: true
- pgno: 173
  md: "+   - Return the boolean value in the `Json` method against the data parameter.\
    \ This is shown in the following code snippet:\n\n```\npublic async Task<IActionResult>\
    \ IsUsernameAvailable(string username)\n{\n    var usernameAvailable =\n     \
    \   await _context.Users.AnyAsync(x =>\n            x.Username.Equals(username,\n\
    \                StringComparison.OrdinalIgnoreCase));\n    return Json(data:\
    \ !usernameAvailable);\n}\n```\n\n+   - Configure `RemoteAttribute` in the `User`\
    \ model against the `Username` property.\n+   - The validation should pass the\
    \ parameter's controller as `Users` and action as `IsUsernameAvailable`\n\nThe\
    \ following code would configure the remote validation in the `User` entity:\n\
    \n```\npublic class User\n{\n    public int Id { get; set; }\n    [Required(ErrorMessage\
    \ = \"Display Name is required\")]\n    public string DisplayName { get; set;\
    \ }\n    [Required(ErrorMessage = \"Username is required\")]\n    [Remote(action:\
    \ \"IsUsernameAvailable\", controller:\"Users\")]\n    public string Username\
    \ { get; set; }\n    [Required(ErrorMessage = \"Password is required\")]\n   \
    \ public string PasswordHash { get; set; }\n    [Required(ErrorMessage = \"Email\
    \ is required\")]\n    [EmailAddress(ErrorMessage = \"Provide a valid email address\"\
    )]\n    public string Email { get; set; }\n    public DateTime CreatedAt { get;\
    \ set; }\n    public DateTime ModifiedAt { get; set; }\n    public int CreatedBy\
    \ { get; set; }\n    public int ModifiedBy { get; set; }\n    public ICollection<Blog>\
    \ Blogs { get; set; }\n    public ICollection<Post> Posts { get; set; }\n    public\
    \ ICollection<Comment> Comments { get; set; }\n    public int? AddressId { get;\
    \ set; }\n    public Address Address { get; set; }\n    public int PersonId {\
    \ get; set; }\n    public Person Person { get; set; }\n}\n```"
  merge: -1
