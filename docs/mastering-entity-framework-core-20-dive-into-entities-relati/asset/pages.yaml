    # Limitations to the transaction scope


    There is a limitation with EF Core with respect to multiple data contexts that
    work between two different connections. We will get the following error if we
    try to execute the current code, throwing the message, "The specified transaction
    is not associated with the current connection. Only transactions associated with
    the current connection may be used":


    ![](img/17e01f90db603e72c0f0c6a7dce8920c_251_1.png)'
