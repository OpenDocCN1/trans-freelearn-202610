  md: "# Collection navigation property\n\nWe can work out what it actually does from\
    \ its name, it holds a collection of dependent entities (or references to a list\
    \ of dependent items) and it always holds references to multiple items. In our\
    \ blogging system, the `Posts` property of the `Blog` entity could be treated\
    \ as a collection navigation property:\n\n```\npublic class Blog\n{\n    ... //\
    \ code removed for brevity\n    public ICollection<Post> Posts { get; set; }\n\
    }\n```\n\nThe `Blog` and `Post` class diagrams are displayed as follows. In the\
    \ design, the highlighted `Posts` field in the `Blog` entity would be the collection\
