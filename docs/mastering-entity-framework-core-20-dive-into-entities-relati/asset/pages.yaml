- pgno: 355
  md: "# # Filter predicate\n\nWe will start with creating the tenant predicate using\
    \ the following code that will allow the user to perform read operations based\
    \ on the given tenant id or return all data if no tenant id is provided:\n\n```\n\
    ```sql\nCREATE FUNCTION dbo.TenantPredicate (@TenantId uniqueidentifier)\n   \
    \ RETURNS TABLE\n    WITH SCHEMABINDING\nAS\n    RETURN SELECT 1 AS TenantPredicateResult\n\
    \    WHERE (@TenantId = CAST(SESSION_CONTEXT(N'TenantId') AS uniqueidentifier))\n\
    \    OR\n    (SESSION_CONTEXT(N'TenantId') =\n    convert(nvarchar(50),cast(cast(0\
    \ as binary) as uniqueidentifier)))\n```\n```\n\nThe preceding `TenantPredicate`\
    \ function will accept tenant id as an input parameter and returns a bit value\
    \ as a table if the tenant id matches with the one from the session, or if it's\
    \ empty. The tenant id will be matched for the authorized users and the empty\
    \ tenant id will be used to display all posts for admins or anonymous users (anonymous\
    \ user do not have a tenant id).\n\nOnce the predicate is created, we can use\
    \ them in creating security policies, and since we are dealing with filter predicate,\
    \ let's create a tenant policy for read operations. The following piece of code\
    \ will create a filter predicate on blogs and posts, and whenever a read operation\
    \ is performed on those entities, the predicate kicks in and verifies and filters\
    \ data based on the session value:\n\n```\n```sql\nCREATE SECURITY POLICY dbo.TenantPolicy\n\
    ADD FILTER PREDICATE dbo.TenantPredicate(TenantId) ON dbo.Blog,\nADD FILTER PREDICATE\
    \ dbo.TenantPredicate(TenantId) ON dbo.Post\nGO\n```\n```\n\nThe session context\
    \ of `TenantId` could be set using the following SQL query that passes key and\
    \ value to the `sp_set_session_context` stored procedure. The code sets the `Prabhakar-Tenant`\
    \ in the session context, which means it will serve data only specific to that\
    \ tenant unless and until the session is changed or cleared:\n\n```\n```sql\n\
    EXEC sp_set_session_context @key=N'TenantId', @value='743302BD-C230-4BB9-9358-0F4D68F4E820'\n\
    ```\n```"
  merge: -1
  img_proc: true
