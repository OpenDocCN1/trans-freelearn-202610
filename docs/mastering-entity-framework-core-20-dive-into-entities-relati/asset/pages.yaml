    \ with the query object pattern\n+   - Composing queries with commands\n+   -\
    \ Enhancing queries with expression trees\n\n# Introduction to query objects\n\
    \nThe query object pattern could be incorporated by introducing a query type and\
    \ processing the query through the type, instead of processing it directly. Please\
    \ perform the following approach we need to follow in order to incorporate the\
    \ pattern in any application:\n\n+   1. Create a query type with the fields required\
    \ for the query, as follows:\n+      - Have a parameterized constructor that enforces\
    \ the type instance to be created only if mandatory field values were provided\n\
    +      - The mandatory fields required for the query must be included in the constructor\n\
    \nLet's create a query type that filters posts by Id; we need a query type that\
    \ has an Id field and a constructor that populates the Id field:\n\n```\npublic\
    \ class PostDetailQuery\n{\n    public PostDetailQuery(int? id)\n    {\n     \
    \   this.Id = id;\n    }\n    public int? Id { get; set; }\n}\n```\n\nThe query\
    \ type is ready for implementation; let's proceed to the next step, creating handlers."
