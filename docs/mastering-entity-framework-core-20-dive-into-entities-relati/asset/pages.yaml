    ,Blog=\n    dotnetCoreBlog,\n    Content = \".NET Core 1.1 Released Contents\"\
    , PublishedDateTime\n    =\n        DateTime.Now},\n    new Post{Id= 1,Title=\"\
    EF Core 1.1 Released\",Blog=\n    dotnetCoreBlog,\n    Content = \"EF Core 1.1\
    \ Released Contents\", PublishedDateTime =\n        DateTime.Now}\n};\nforeach\
    \ (var post in posts)\n{\n    context.Posts.Add(post);\n}\ncontext.SaveChanges();\n\
    }\n```\n```\n\nIn **Program.cs**, initialize **DbInitializer** in **Main()** by\
    \ creating the **BlogContext** using dependency injection and pass the same to\
    \ the **DbInitializer.Initialize()**:\n\n```\n```csharp\npublic static void Main(string[]\
    \ args)\n{\n    var host = BuildWebHost(args);\n    using (var scope = host.Services.CreateScope())\n\
    ```\n```"
