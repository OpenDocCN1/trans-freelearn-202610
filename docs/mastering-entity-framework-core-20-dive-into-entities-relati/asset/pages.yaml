    # Creating a new project


    Open Visual Studio and create a new project either from the **File** menu or from
    the **Start** page.


    # The Start page


    From the **New Project** section, create a new project using any one of the following
    approaches:


    +   1. Select **Create new project...** On the left pane, select **Templates |
    Visual C# | .NET Core**. Select the **ASP.NET Core Web Application** template
    from the list.'
