- pgno: 306
  md: '# Summary


    We started by exploring what is a concurrency conflict, and how Microsoft would
    have handled them in the Entity Framework implementation. We have seen how the
    concurrency token implementation would solve our issue, and then started with
    using concurrency tokens with the non-timestamp approach. Later, we used the timestamp-based
    concurrency token to catch the conflicts. Finally, we have found ways to handle
    those concurrency conflicts using both optimistic and pessimistic approaches.
    We can choose between the two based on our priority; if performance is vital to
    the project then pick optimistic concurrency, or if the business users are keen
    on data and are ready to have a trade-off with performance, then pick pessimistic
    concurrency. We have built the blogging system to illustrate certain features
    covered in the book, but it was not created to provide better performance. We
    might have used approaches that would yield better performance through muscle
    memory, but it''s time to explore all possible options available in the framework
    to improve the application''s performance. Let''s explore them in Chapter 11,
    Performance – It''s All About Execution Time.'
  merge: -1
  img_proc: true
- pgno: 307
  md: '# 11


    # Performance – It''s All About Execution Time


    We have created transactions to ensure every transaction will be committed only
    if all the transactions were successful. We have started with identifying conflicts,
    resolved them using the built-in/default transactions supported by Entity Framework
    (EF), then worked with simple transactions. Then we covered handling transactions
    using timestamp and non-timestamp fields. Finally, we created transactions that
    could handle different data contexts and different technologies.


    Let''s discuss the performance issues we commonly face in EF, or any other data
    access layer implementation, and a way to address those performance concerns.


    In this chapter, we will be covering the following:


    +   - `AsNoTracking()` method

    +   - Detecting changes

    +   - Asynchronous operations

    +   - Unnecessary volume returned

    +   - N + 1 `Select` problem

    +   - More data than required

    +   - Mismatched datatypes

    +   - Missing indexes'
  merge: -1
  img_proc: true
- pgno: 308
  md: "# # The AsNoTracking() method\n\nEF's tracking behavior depends on the entry\
    \ available in the change tracker; it is the default behavior. We could override\
    \ this behavior to achieve performance improvements in certain scenarios where\
    \ tracking is not required; for example, the read-only operations such as displaying\
    \ a list of posts, displaying post information, and so on. This tracking is the\
    \ key to EF in arriving at the changes required to be persisted during `SaveChanges()`\
    \ execution.\n\n# ## How does tracking work?\n\nAs discussed in the previous section,\
    \ any query that returns an entity (registered in data context) will be a part\
    \ of tracking. Also as mentioned about how persistence occurs, the changes performed\
    \ on those entities will be tracked and those changes will be persisted during\
    \ `SaveChanges()` execution.\n\nLet's look at the following code, which illustrates\
    \ how tracking works in the framework:\n\n```\npublic async Task<IActionResult>\
    \ Edit(int id,\n    [Bind(\"Id,FirstName,\n    LastName,NickName,Url,Biography,ImageUrl\"\
    )] Person person)\n{\n    // Code removed for brevity\n    var personToUpdate\
    \ = await\n    _context.People.SingleOrDefaultAsync(\n        item => item.Id.Equals(person.Id));\n\
    \    // Code removed for brevity\n    personToUpdate.Biography = person.Biography;\n\
    \    personToUpdate.Comments = person.Comments;\n    personToUpdate.FirstName\
    \ = person.FirstName;\n    personToUpdate.ImageUrl = person.ImageUrl;\n    personToUpdate.LastName\
    \ = person.LastName;\n    personToUpdate.ModifiedAt = DateTime.Now;\n    personToUpdate.NickName\
    \ = person.NickName;\n    personToUpdate.PhoneNumber = person.PhoneNumber;\n \
    \   personToUpdate.Url = person.Url;\n    personToUpdate.User = person.User;\n\
    \    _context.Update(personToUpdate);\n    await _context.SaveChangesAsync();\n\
    \    // Code removed for brevity\n}\n```"
  merge: -1
  img_proc: true
- pgno: 309
  md: "The `personToUpdate` retrieved from the data context will be part of tracking\
    \ as it is returning the `Person` entity that is registered in the data context.\
    \ The following code registers the `Person` entity to enable tracking in the framework:\n\
    \n```\npublic class BlogContext : DbContext\n{\n    // Code removed for brevity\n\
    \    public DbSet<Person> People { get; set; }\n    // Code removed for brevity\n\
    }\n```\n\nSince the entity is part of the data context, any changes performed\
    \ in the returned item(s) will be tracked by EF Core irrespective of its usages,\
    \ which could be read-only or might perform a write operation as well.\n\n# No-tracking\
    \ queries\n\nIn the blogging system, the Person index screen will load a list\
    \ of people available in the data store, which will not perform any write operation.\
    \ In this use case, the code doesn't require any tracking as once the data is\
    \ rendered in the View, the scope is complete. Having tracking over here is an\
    \ overhead.\n\nThe following code would allow us to disable tracking in the executing\
    \ query:\n\n```\npublic async Task<IActionResult> Index()\n{\n    var people =\
    \ await _context.People\n        .AsNoTracking()\n        .ToListAsync();\n  \
    \  // Code removed for brevity\n}\n```\n\nThe tracking could be disabled using\
    \ `AsNoTracking()`, as used in the preceding query against the navigational property\
    \ of data context in the LINQ query. This instructs EF Core that we do not require\
    \ an overhead tracking operation as we are not intending to perform any changes\
    \ with the result set."
  merge: -1
  img_proc: true
