  md: "The changes required in the individual `Post` Add/Edit view are listed as follows:\n\
    \n+   - `Tags`: This tag information is a filtered list of tags associated with\
    \ the `Post`\n+   - `TagIds`: This tag information is a list of filtered tag IDs\n\
    +   - `TagNames`: This tag information is the filtered tag names in a comma-separated\
    \ string\n\nLet's incorporate the code required to expose the filtered tag list,\
    \ tag ID list, and tag names flattened to a string in the `GetPostByIdQuery` object.\
    \ These values will enable us to pre-select the tags while adding/editing `Post`:\n\
    \n```\npublic class GetPostByIdQuery : QueryBase,\n    IGetPostByIdQuery<GetPostByIdQuery>\n\
    {\n    // Code removed for brevity\n    private Post IncludeTags(Post post)\n\
    \    {\n        int idValue = Id ?? 0;\n        post.Tags = (from tag in Context.Tags\n\
    \                     join tagPost in Context.TagPosts\n                     on\
    \ tag.Id equals tagPost.TagId\n                     where tagPost.PostId == idValue\n\
    \                     select tag).ToList();\n        post.TagIds = post.Tags.Select(x\
    \ => x.Id).ToList();\n        post.TagNames = string.Join(\", \",\n          \
    \  post.Tags.Select(x => x.Name).ToArray());\n        return post;\n    }\n}\n\
    ```\n\nThe tags that were selected while creating/editing the `Post` must be persisted\
    \ in a different entity `Tag`. Let's see how this persistence occurs along with\
    \ the `Post` persistence in the `CreatePostCommand` object. If we notice, there\
    \ is no change to the `Post` persistence, but the `Tag` persistence consumes a\
