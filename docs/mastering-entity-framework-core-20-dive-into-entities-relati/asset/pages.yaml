- pgno: 89
  md: "# No foreign key property\n\nWe usually create entities using fully-defined\
    \ relationships, but this is not expected by Entity Framework. In a relationship,\
    \ the foreign key is not required, but it is recommended to have one:\n\nThe following\
    \ code does not contain foreign key in the Post entity and still the relationship\
    \ is formed:\n\n```\npublic class Blog\n{\n    // code removed for brevity\n \
    \   public ICollection<Post> Posts { get; set; }\n}\npublic class Post\n{\n  \
    \  // code removed for brevity\n    // Foreign key BlogId was removed from here\n\
    \    public Blog Blog { get; set; }\n}\n```\n\nThe following image illustrates\
    \ that without foreign key, the relationship is built:\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_89_0.png)"
  merge: -1
  img_proc: true
- pgno: 90
  md: "We have removed the BlogId foreign key from the Post entity, and it still works\
    \ as expected.\n\n# No foreign key property - under the hood\n\nThe relationship\
    \ works even if the foreign key is not available because Entity Framework creates\
    \ a shadow property for us. It follows the naming convention of navigational property\
    \ with primary key name:\n\nIn the following code the foreign key in the Post\
    \ entity is injected by the framework:\n\n```\npublic class Blog\n{\n    ... //\
    \ code removed for brevity\n    public ICollection<Post> Posts { get; set; }\n\
    }\npublic class Post\n{\n    ... // code removed for brevity\n    public int BlogId\
    \ { get; set; } // shadow property created by EF\n    public Blog Blog { get;\
    \ set; }\n}\n```\n\nThe following image illustrates that foreign key is injected\
    \ by the framework:\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_90_0.png)"
  merge: -1
  img_proc: true
- pgno: 91
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 92
  md: "![](img/17e01f90db603e72c0f0c6a7dce8920c_92_0.png)\n\nWe have removed the Blog\
    \ navigation property from the Post entity, and it still works as expected.\n\n\
    # Foreign key\n\nWe could use a different naming convention for a foreign key\
    \ and still map that foreign key against the navigation property (using the ForeignKey\
    \ data annotation does the trick). In a relationship, a navigation property is\
    \ not required in the dependent entity, meaning that having a single navigation\
    \ property on a principal entity is more than sufficient:\n\nIn the following\
    \ code, the custom foreign key is mapped against the navigation property:\n\n\
    ```\npublic class Blog\n{\n    ... // code removed for brevity\n    public ICollection<Post>\
    \ Posts { get; set; }\n}\npublic class Post\n{\n    ... // code removed for brevity\n\
    \    public int BlogSomeId { get; set; }\n    [ForeignKey(\"BlogSomeId\")]\n \
    \   public Blog Blog { get; set; }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 93
  md: "The following image illustrates that the custom foreign key is mapped against\
    \ the navigation property:\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_93_0.png)\n\
    \nWe have modified the foreign key to BlogSomeId and configured it against the\
    \ navigation property which is the Blog of the Post entity, and it still works\
    \ as expected.\n\n# Inverse property\n\nIf we have more than one navigation property\
    \ in an entity, it makes sense to use an inverse property to pair the navigational\
    \ properties for a relationship. There will be occurrences where even though we\
    \ have a fully-defined relationship, we still need an inverse property in order\
    \ to pair up the navigational properties due to custom naming conventions that\
    \ don't fall into any of EF's discovery mechanisms:\n\nIn the following code,\
    \ the custom foreign key and navigation property were configured in the inverse\
    \ navigation property:\n\n```\npublic class Blog\n{\n    ... // code removed for\
    \ brevity\n    [InverseProperty(\"SomeBlog\")]\n    public ICollection<Post> SomePosts\
    \ { get; set; }\n}\npublic class Post\n{\n    ... // code removed for brevity\n\
    \    public int SomeBlogId { get; set; }\n    public Blog SomeBlog { get; set;\
    \ }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 94
  md: 'The following image illustrates that the custom foreign key and navigation
    property were configured in the inverse navigation property:


    ![](img/17e01f90db603e72c0f0c6a7dce8920c_94_0.png)


    We have introduced the `SomeBlog` inverse property in the `Blog` entity, which
    pairs with the `SomeBlog` navigation property of the `Post` entity.


    # Summary


    In this chapter, we were introduced to the terminologies and conventions used
    for relationships in Entity Framework. We started right from a fully-defined relationship,
    and from there we started trimming the relationship, but still made the relationship
    work. Finally, we customized and paired up navigational properties with customized
    properties, and still made the relationship work. This chapter has introduced
    us to relationships (we also had a peek at the Fluent API), but we didn’t get
    the chance to understand different relationships. Let’s explore them in Chapter
    4, *Building Relationships – Understanding Mapping*.'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# 4

    Building Relationships — Understanding Mapping


    In Chapter 3, Relationships – Terminology and Conventions, we studied terminologies
    and conventions used in a relationship; let’s start using them in building relationships.
    We have been using only Blog and Post entities so far, which doesn’t do any good
    to the blogging system. Let’s expand them to other entities such as Comment, Tag,
    and so on, and we will leverage them to understand the relationships as well.


    The relationship was introduced right from the initial Entity Framework (EF) version,
    but there was a limitation on the bi-directional relationship. In the matured
    framework, we have support for multiplicity, enabling that multiple entities can
    be related together.


    The topics we will cover in this chapter are:


    +   - Relationships:

    +     - One-to-one

    +     - One-to-many

    +     - Many-to-many

    +   - Fluent API:

    +     - Identifying navigation property and inverse navigation

    +     - Identifying single navigation property

    +     - Relationship-building techniques

    +     - Cascade delete'
  merge: -1
  img_proc: true
