- pgno: 161
  md: "```\nreturn RedirectToAction(\"Index\");\n}\nelse\n{\n    ViewBag.Message =\
    \ \"Error occurred while validating the user\";\n}\n\nreturn View(user);\n}\n\
    ```\n\nThe preceding implementation illustrates how we perform manual validation,\
    \ and it does the following:\n\n+   - Maps the data from **Registration View Model**\
    \ to **User Data Model**\n+   - We should always suspect that the mapped data\
    \ may not be valid\n+   - It is always safer to validate the mapped data manually\
    \ before we persist the data back to the data store\n+   - If we have any validation\
    \ errors, we would be publishing the information to the user through the `ViewBag`\
    \ message\n\nThe `IsValid` property of the model would be false before we trigger\
    \ `TryValidateModel`, and later it will be updated based on validation. We have\
    \ seen how to perform manual validation, and now we will move to custom validation\
    \ in the next section.\n\n# Custom validation\n\nThe built-in validations exposed\
    \ in the framework may be solving most of our technical validation problems, but\
    \ there may be some business needs/requirements that require additional provision\
    \ on top of built-in validations.\n\nThe custom validation can be performed at\
    \ two levels:\n\n+   - Field level\n+   - Class level\n\nThe field-level custom\
    \ validator can be created using the following:\n\n+   - Inherit the custom validation\
    \ class from the `ValidationAttribute` base type\n+   - Override the `IsValid`\
    \ method and handle your business validation\n+   - The `IsValid` method accepts\
    \ two parameters—value and `validationContext`"
  merge: -1
  img_proc: true
- pgno: 162
  md: "+   - The `value` field is the actual field value against which the attribute\
    \ is configured\n+   - The `validationContext` field would have `ObjectInstance`\
    \ of the model that contains the configured field\n\nIn our blogging system, we\
    \ can provide a business validation to the publication date; it needs a validation\
    \ that prohibits the user from publishing the post in a past date. Let's call\
    \ the custom validation attribute `FutureOnly` and perform the following validation\
    \ in the overridden `IsValid` method:\n\n```\npublic class FutureOnlyAttribute\
    \ : ValidationAttribute\n{\n    protected override ValidationResult IsValid(object\
    \ value,\n        ValidationContext validationContext)\n    {\n        var post\
    \ = (Post) validationContext.ObjectInstance;\n        return post.PublishedDateTime.CompareTo(DateTime.Now)\
    \ < 0\n            ? new ValidationResult(\"Publishing Date cannot be in past,\
    \ kindly provide a future date\")\n            : ValidationResult.Success;\n \
    \   }\n}\n```\n\n```\npublic class Post\n{\n    public int Id { get; set; }\n\
    \    [Required(ErrorMessage = \"Title is required\")]\n    public string Title\
    \ { get; set; }\n    [Required(ErrorMessage = \"Content is required\")]\n    public\
    \ string Content { get; set; }\n    public string Summary { get; set; }\n    [FutureOnly]\n\
    \    public DateTime PublishedDateTime { get; set; }\n    [Url(ErrorMessage =\
    \ \"Provide a valid url\")]\n    public string Url { get; set; }\n    public long\
    \ VisitorCount { get; set; }\n    public DateTime CreatedAt { get; set; }\n  \
    \  public DateTime ModifiedAt { get; set; }\n    public int CreatedBy { get; set;\
    \ }\n    public int ModifiedBy { get; set; }\n    [Required(ErrorMessage = \"\
    Blog is required\")]\n    public int BlogId { get; set; }\n    public Blog Blog\
    \ { get; set; }\n    [Required(ErrorMessage = \"Author is required\")]\n    public\
    \ int AuthorId { get; set; }\n    public User Author { get; set; }\n    [Required(ErrorMessage\
    \ = \"Category is required\")]\n```"
  merge: -1
