- pgno: 117
  md: "We have modified the foreign key as `SomeBlogId` and configured against the\
    \ `Blog` navigation property of the `Post` entity, and it is configured using\
    \ the Fluent API.\n\n# Building relationships using a principal key\n\nThe principal\
    \ key doesn't require a Fluent API configuration if it's a primary key, but what\
    \ if we had to apply a relationship against an alternate key? Then, we need the\
    \ Fluent API to complete the configuration. We could achieve the same using the\
    \ `HasPrincipalKey` Fluent API method exposed to us:\n\nThe code required for\
    \ custom foreign key mapping in entity and configuration using principal key instead\
    \ of primary key were displayed as follows:\n\n```\npublic class Blog\n{\n   \
    \ public int Id { get; set; }\n    public string Url { get; set; }\n    public\
    \ ICollection<Post> Posts { get; set; }\n}\npublic class Post\n{\n    public int\
    \ Id { get; set; }\n    public string Title { get; set; }\n    public string Content\
    \ { get; set; }\n    public DateTime PublishedDateTime { get; set; }\n    public\
    \ int SomeBlogId { get; set; }\n    [ForeignKey(\"SomeBlogId\")]\n    public Blog\
    \ Blog { get; set; }\n}\n\n// onModelCreating method implementation inside context\
    \ class\nmodelBuilder.Entity<Post>()\n    .HasOne(x => x.Blog)\n    .WithMany(x\
    \ => x.Posts)\n    .HasForeignKey(x => x.SomeBlogId)\n    .HasPrincipalKey(x =>\
    \ x.Url); // not a valid\n        relationship in real time\n```\n\nWe have created\
    \ a relationship using the modified foreign key `BlogSomeId` against the alternate\
    \ key `Url` from `Blog`. This was achieved using the `HasPrincipalKey` Fluent\
    \ API method."
  merge: -1
  img_proc: true
- pgno: 118
  md: "# Building relationships using the IsRequired method\n\nWe can configure the\
    \ relationship as required or optional using the same Fluent API with the IsRequired\
    \ method. We can use the same approach to define whether a relationship is mandatory\
    \ or optional:\n\n```\npublic class Blog\n{\n    public int Id { get; set; }\n\
    \    public string Url { get; set; }\n    public ICollection<Post> Posts { get;\
    \ set; }\n}\npublic class Post\n{\n    public int Id { get; set; }\n    public\
    \ string Title { get; set; }\n    public string Content { get; set; }\n    public\
    \ DateTime PublishedDateTime { get; set; }\n    public int BlogSomeId { get; set;\
    \ }\n    [ForeignKey(\"BlogSomeId\")]\n    public Blog Blog { get; set; }\n}\n\
    \n// onModelCreating method implementation inside context class\nmodelBuilder.Entity<Blog>()\n\
    \    .Property(x => x.Url)\n    .IsRequired()\nmodelBuilder.Entity<Post>()\n \
    \   .HasOne(x => x.Blog)\n    .WithMany(x => x.Posts)\n    .IsRequired();\n```\n\
    \nThe first configuration applies the Url property on the Blog entity to be a\
    \ mandatory/required field, and the second configuration enforces the relationship\
    \ as mandatory."
  merge: -1
  img_proc: true
- pgno: 119
  md: "# Cascade delete\n\nThe relationship we have created so far allows us to build\
    \ the data with relationship, and the deletion mechanism need to be configured\
    \ as well. What would happen if we try to delete a principal entity row? Would\
    \ that do nothing on dependent elements or remove them as well? Let’s see the\
    \ different ways available to perform those operations:\n\n+   - **Cascade:**\
    \ If we delete the principal entity row, the dependent entity rows get deleted\
    \ as well\n+   The following code would configure that the dependent rows would\
    \ be deleted as well if the primary row is deleted:\n\n```\npublic class Blog\n\
    {\n    public int Id { get; set; }\n    public string Url { get; set; }\n    public\
    \ ICollection<Post> Posts { get; set; }\n}\npublic class Post\n{\n    public int\
    \ Id { get; set; }\n    public string Title { get; set; }\n    public string Content\
    \ { get; set; }\n    public DateTime PublishedDateTime { get; set; }\n    public\
    \ int BlogSomeId { get; set; }\n    [ForeignKey(\"BlogSomeId\")]\n    public Blog\
    \ Blog { get; set; }\n}\n\n// onModelCreating method implementation inside context\
    \ class\nmodelBuilder.Entity<Post>()\n    .HasOne(x => x.Blog)\n    .WithMany(x\
    \ => x.Posts)\n    .OnDelete(DeleteBehavior.Cascade);\n```\n\nThis enforces EF\
    \ to delete Post elements if a Blog element is deleted.\n\n+   - **SetNull:**\
    \ If we delete the principal entity row, the dependent entity row's foreign key\
    \ will be set to null values:\n+   The following code would configure the dependent\
    \ rows to be set to null if the primary row is deleted:\n\n```\npublic class Blog\n\
    {\n    public int Id { get; set; }\n```"
  merge: -1
  img_proc: true
- pgno: 120
  md: "```\n```csharp\npublic string Url { get; set; }\npublic ICollection<Post> Posts\
    \ { get; set; }\n}\npublic class Post\n{\n    public int Id { get; set; }\n  \
    \  public string Title { get; set; }\n    public string Content { get; set; }\n\
    \    public DateTime PublishedDateTime { get; set; }\n    public int BlogSomeId\
    \ { get; set; }\n    [ForeignKey(\"BlogSomeId\")]\n    public Blog Blog { get;\
    \ set; }\n}\n\n// onModelCreating method implementation inside context class\n\
    modelBuilder.Entity<Post>()\n    .HasOne(x => x.Blog)\n    .WithMany(x => x.Posts)\n\
    \    .OnDelete(DeleteBehavior.SetNull);\n```\n```\n\nThis enforces EF to set null\
    \ values on the `Blog` column of the `Post` entity elements if a `Blog` element\
    \ is deleted:\n\n+   - **Restrict:** If we delete the principal entity row, the\
    \ dependent entity's rows remain untouched:\n+   \n+     The following code would\
    \ configure that the dependent rows would retain their values even though the\
    \ primary row is deleted:\n\n```\n```csharp\npublic class Blog\n{\n    public\
    \ int Id { get; set; }\n    public string Url { get; set; }\n    public ICollection<Post>\
    \ Posts { get; set; }\n}\npublic class Post\n{\n    public int Id { get; set;\
    \ }\n    public string Title { get; set; }\n    public string Content { get; set;\
    \ }\n    public DateTime PublishedDateTime { get; set; }\n    public int BlogSomeId\
    \ { get; set; }\n    [ForeignKey(\"BlogSomeId\")]\n    public Blog Blog { get;\
    \ set; }\n}\n\n// onModelCreating method implementation inside context class\n\
    modelBuilder.Entity<Post>()\n```\n```"
