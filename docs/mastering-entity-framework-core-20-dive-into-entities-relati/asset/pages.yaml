- pgno: 72
  md: '# 3

    Relationships – Terminology and Conventions


    In Chapter 2, The Other Way Around – Database First Approach, we re-engineered
    the existing database using Entity Framework''s Database-First approach. Let''s
    now start to understand the terminologies and conventions used in relationships.


    Entities are of no use if we don''t give them an identity. The relationship terms
    we will be exploring in this chapter will provide an identity for the entities,
    which not only describes them, but also helps us in creating relationships between
    different entities.


    The topics we will cover in this chapter are:


    +   - Understanding relationship terms:

    +     - Data models

    +     - Principal entity

    +     - Principal key

    +     - Dependent entity

    +     - Foreign key

    +     - Navigation property

    +   - Conventions in a relationship:

    +     - Fully-defined relationships

    +     - No foreign key property

    +     - Single navigation property

    +     - Foreign key

    +     - Inverse property'
  merge: -1
  img_proc: true
- pgno: 73
  md: "# Understanding relationship terms\n\nWe have created and used data models\
    \ or entities so far, but we haven't figured out how they are related. Let's understand\
    \ how they are related and the terminologies used for those relationships.\n\n\
    # Data models\n\nWe will revisit the data models we created and consumed in Chapter\
    \ 1, Kickstart - Introduction to Entity Framework Core (using the Code-First approach),\
    \ which could be used to understand the relationship terminologies. For illustration\
    \ purposes, we will tweak those objects to understand different terminologies\
    \ that were not used in the system.\n\n# Blog entity\n\nThe Blog entity/data model\
    \ we created using the Code First approach is displayed as follows:\n\n```\npublic\
    \ class Blog\n{\n    public int Id { get; set; }\n    public string Url { get;\
    \ set; }\n    public ICollection<Post> Posts { get; set; }\n}\n```\n\nWe will\
    \ be using the Blog model to understand the following:\n\n+   - Principal entity\n\
    +   - Principal key\n+   - Navigational property\n\n# The Post entity\n\nThe Post\
    \ entity/data model we created using the Code-First approach is displayed as follows:\n\
    \n```\npublic class Post\n{\n    public int Id { get; set; }\n    public string\
    \ Title { get; set; }\n    public string Content { get; set; }\n}\n```"
  merge: -1
  img_proc: true
