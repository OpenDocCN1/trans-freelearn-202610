- pgno: 60
  md: "# Refactoring the OnConfiguring() method\n\nIf we recap on how we have configured\
    \ the database context, the auto-generated code had a hardcoded connection string\
    \ used for configuration. To avoid it, we should have a mechanism to pass on the\
    \ database context options to the DbContext base class; let’s see how to do it:\n\
    \n```\npublic partial class MasteringEF CoreDbFirstContext : DbContext\n{\n  \
    \  public virtual DbSet<Blog> Blog { get; set; }\n    public virtual DbSet<Post>\
    \ Post { get; set; }\n    protected override void OnConfiguring(DbContextOptionsBuilder\
    \ optionsBuilder)\n    {\n        // Move this connection string to config file\
    \ later\n        optionsBuilder.UseSqlServer(@\"Server=(localdb)\\mssqllocaldb;Database=MasteringEF\
    \ CoreDbFirst;Trusted_Connection=True;\");\n    }\n}\n```\n\nAlso include a constructor\
    \ for the MasteringEF CoreDbFirstContext class, which will initialize the DbContext\
    \ through dependency injection from the Startup class:\n\n```\npublic\n    MasteringEF\
    \ CoreDbFirstContext(\n        DbContextOptions<MasteringEF CoreDbFirstContext>\
    \ options)\n    : base(options)\n    {\n    }\n```\n\nWe have seen how to pass\
    \ on the options to the database context base class, now we will see how the options\
    \ were configured with a connection string.\n\n# Refactoring the ConfigureServices\
    \ method\n\nWe will use the ConfigureServices() method to include the database\
    \ context framework service to the service collection. Add the following using\
    \ statements to configure the DbContext options and to add database context to\
    \ the services list:\n\n```\nusing Microsoft.EntityFrameworkCore;\nusing MasteringEF\
    \ Core.DatabaseFirst.Final.Models;\n```"
  merge: -1
  img_proc: true
- pgno: 61
  md: "As we did in Chapter 1, *Kickstart - Introduction to Entity Framework Core*,\
    \ we will configure context as a service and add `DbContext` (created using `UseSqlServer()`\
    \ through `DbContextOptionsBuilder`) to the services collection:\n\n```\npublic\
    \ void ConfigureServices(IServiceCollection services)\n{\n    // Add framework\
    \ services.\n    services.AddDbContext<MasteringEFCoreDbFirstContext>(options\
    \ =>\n    options.UseSqlServer(Configuration.GetConnectionString(\n        \"\
    DefaultConnection\")));\n    services.AddMvc();\n}\n```\n\nWe have configured\
    \ the database context in the framework, but if we watch closely, we see that\
    \ the connection string is coming from a configuration. Next, we will see how\
    \ the configuration is included in `appsettings.json`.\n\n# The appsettings.json\
    \ setting\n\nThe application settings, as we explored earlier, are based on JSON,\
    \ and in order to include a setting, we need to add a JSON key-value pair. In\
    \ our case, `ConnectionStrings` is the key and the value is again a JSON object\
    \ that defines `DefaultConnection`:\n\n```\n{\n  \"ConnectionStrings\": {\n  \
    \  \"DefaultConnection\": \"Server=(localdb)\\mssqllocaldb;Database=MasteringEFCoreDbFirst;Trusted_Connection=True;MultipleActiveResultSets=true\"\
    \n  },\n  \"Logging\": {\n    \"IncludeScopes\": false,\n    \"LogLevel\": {\n\
    \      \"Default\": \"Warning\"\n    }\n  }\n}\n```"
  merge: -1
  img_proc: true
