  md: "# The many-to-many relationship\n\nThe many-to-many relationship is a tricky\
    \ one; we need to understand how these kinds of relationships are built. Usually,\
    \ we will build two different entities that require a many-to-many relationship,\
    \ create an entity that will be purely used to join the first two entities, and\
    \ then map one-to-many between this entity (created to join two separate one-to-many\
    \ relationships) and the two entities (created first) separately:\n\n```\npublic\
    \ class Post\n{\n    public int Id { get; set; }\n    public string Title { get;\
    \ set; }\n    public string Content { get; set; }\n    public string Summary {\
    \ get; set; }\n    public DateTime PublishedDateTime { get; set; }\n    public\
    \ string Url { get; set; }\n    public long VisitorCount { get; set; }\n    public\
    \ DateTime CreatedAt { get; set; }\n    public DateTime ModifiedAt { get; set;\
    \ }\n    public int CreatedBy { get; set; }\n    public int ModifiedBy { get;\
    \ set; }\n    public int BlogId { get; set; }\n    public Blog Blog { get; set;\
    \ }\n    public int AuthorId { get; set; }\n    public User Author { get; set;\
    \ }\n    public int CategoryId { get; set; }\n    public Category Category { get;\
    \ set; }\n    public ICollection<TagPost> TagPosts { get; set; }\n    public ICollection<Comment>\
    \ Comments { get; set; }\n}\n\npublic class Tag\n{\n    public int Id { get; set;\
    \ }\n    public string Name { get; set; }\n    public DateTime CreatedAt { get;\
    \ set; }\n    public DateTime ModifiedAt { get; set; }\n    public int CreatedBy\
    \ { get; set; }\n    public int ModifiedBy { get; set; }\n    public ICollection<TagPost>\
    \ TagPosts { get; set; }\n}\n\npublic class TagPost\n{\n    public int Id { get;\
    \ set; }\n    public DateTime CreatedAt { get; set; }\n    public DateTime ModifiedAt\
    \ { get; set; }\n```"
