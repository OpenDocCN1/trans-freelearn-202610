  md: '![](img/17e01f90db603e72c0f0c6a7dce8920c_285_0.png)


    There is an internal operation carried out by EF to finalize whether the update
    is valid or not; that''s the reason it says 1 row(s) is expected but 0 row(s)
    affected.


    EF will translate the update into an SQL query that will contain the where clause,
    including the identity column and the concurrency check column. If the value is
    changed, then obviously no record would be available for the update operation
    (which was supposed to exist), and that''s the reason it simply responds back
    saying it expected 1 row(s) to be updated but 0 row(s) were affected.


    We have seen how non-timestamp concurrency works, along with annotation configuration.
    In the next section, let''s see how the same concurrency token could be configured
    through Fluent API.'
