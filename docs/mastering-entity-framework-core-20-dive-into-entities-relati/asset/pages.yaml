- pgno: 252
  md: 'The explicit `TransactionScope` is required to support transactions between
    different data contexts (even between different connections); it is still not
    available in the current EF.


    ![](img/17e01f90db603e72c0f0c6a7dce8920c_252_0.png)


    The `TransactionScope` available in EF is yet to be supported by EF Core. It was
    initially planned to be shipped in EF Core 2.0 but was not released in the framework.
    Now the Microsoft EF team is currently targeting the first half of 2018 for the
    v2.1 framework, `System.Transactions` should be part of the release.


    We have to closely watch the releases for the further updates; the following screenshot
    confirms that the transactions will be supported in EF Core 2.1 release:


    ![](img/17e01f90db603e72c0f0c6a7dce8920c_252_1.png)


    The limitation with the EF Core transaction scope should never stop us from the
    development. So, in the next section, let’s create our own custom `TransactionScope`,
    which will perform the same functionality.'
