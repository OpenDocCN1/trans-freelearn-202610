- pgno: 166
  md: "```\nvar results = new List<ValidationResult>();\nvar isBusinessValid = Validator.TryValidateObject(post,\n\
    \    new ValidationContext(post, null, null), results, false);\n```\n\nThe IValidatableObject\
    \ implementation also does business validation, and updates the error collection\
    \ with the validation error, **Publishing Date cannot be in past, kindly provide\
    \ a future date**, if it encounters any business validation issues.\n\nThe same\
    \ scenario was present in the earlier `FutureOnly` attribute validation. Providing\
    \ a past date would be validated in the `Validate` method. The only difference\
    \ in both of the approaches was the former does the implementation once and applies\
    \ to all applicable fields, whereas the latter requires implementation for each\
    \ field done on the class level. In layman’s terms, if we need to include one\
    \ more field for the validation, we will need to perform the validation for the\
    \ field again in the `Validate` method:\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_166_0.png)\n\
    \nWe explored custom validation that is performed at server side; now, let’s explore\
    \ the custom validation that could be leveraged at a client side as well in the\
    \ next section."
