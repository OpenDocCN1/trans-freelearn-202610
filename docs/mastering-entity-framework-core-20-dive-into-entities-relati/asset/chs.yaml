  \ - Introduction to Entity Framework Core\n\n我仍然記得我們花費大量時間處理關聯式資料庫而不是專注於解決業務問題的那些日子；那些日子肯定已經一去不復返了。為了闡述這一點，讓我們列出\
  \ ORM 之前我們遇到的問題：\n\n- 資料存取層不可移植，這使得從一個平台更改到另一個平台變得困難。\n- 沒有抽象層，這迫使我們在面向物件物件和資料實體之間手動映射。\n\
  - 供應商特定的 SQL 語句，這需要知識才能在不同的 RDBMS 系統之間移植。\n- 嚴重依賴觸發器和預存程序。\n\n整個產品開發流程轉向工具和開源平台，甚至微軟也從\
  \ .NET Core 起走上了這條道路。如果我們繼續花時間編寫可以通過工具實現的程式碼，我們可能會變得像穴居人一樣。\n\nEntity Framework\
  \ 的創建就是為了解決這個問題；它並不是隨初始 .NET 框架一起引入的，而是隨 .NET Framework 3.5 SP1 引入的。\n\n如果我們仔細觀察，很明顯\
  \ .NET 團隊出於以下原因構建了它：\n\n- 減少開發人員/架構師在抽象和可移植資料存取層等事項上花費的時間\n- 使開發人員不需要供應商特定的 SQL\
  \ 知識\n- 使我們能夠通過消除觸發器和 SP 來構建面向物件的業務邏輯\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_22_0.png)\n\
  \n本書使用 Visual Studio 2017（撰寫時的最新版本）和 ASP.NET Core 2.0 MVC 以及 Entity Framework 2.0。儘管\
  \ Entity Framework 2.0 是最新版本，但它仍在不斷發展，因此 .NET 團隊需要時間才能基於完整的 .NET Framework 開發 Entity\
  \ Framework 6.2 的所有現有功能。\n\n我們將在此涵蓋以下主題：\n\n- 先決條件\n- 建立新專案\n- 安裝 Entity Framework\
  \ 2.0\n- 資料模型\n- 資料庫內容\n- 在服務中註冊內容（.Net Core DI）\n- 建立和播種資料庫\n- 執行 CRUD 操作\n\n##\
  \ 先決條件\n\n.NET Core，這個開源平台，為 Visual Studio 2017 中的多平台支援鋪平了道路。編輯器有不同的風格，支援平台特定和跨平台\
  \ IDE：\n\n- **Visual Studio:** Windows 的獨家版本，提供社群、專業和企業版：\n\nVisual Studio for Mac\
  \ 可從 `https://www.visualstudio.com/vs/visual-studio-mac/` 下載。\n\n- **Visual Studio\
  \ Code:** 微軟為 Windows、Linux 和 macOS 提供的跨平台編輯器：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_24_0.png)\n\
  \n從 `https://www.visualstudio.com/downloads/` 下載您想要的 Visual Studio Code 版本/版本。\n\
  \nVisual Studio 2017 安裝程式分為工作負載、個別元件和語言包。我們將安裝並使用 **Visual Studio Community 2017**，其工作負載為\
  \ **ASP.NET and web development** 和 **.NET Core cross-platform development**。工作負載是一組一個或多個個別元件的組合，也可以從安裝程式的\
  \ **Individual components** 標籤中安裝，如下所示：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_25_0.png)\n\
  \n我們已經了解了可供我們使用的 Visual Studio 的不同風格/版本，我們將在旅程中使用 Visual Studio Community，它可免費用於私人和小規模測試用途。讀者可以根據自己的需求選擇適合的版本（IDE\
  \ 中可用的工具和腳手架可能會有所不同）。\n\n## 建立新專案\n\n開啟 Visual Studio 並從 **File** 選單或 **Start**\
  \ 頁面建立新專案。\n\n## Start 頁面\n\n從 **New Project** 區段，使用以下任一方法建立新專案：\n\n- 1. 選擇 **Create\
  \ new project...** 在左側窗格中，選擇 **Templates | Visual C# | .NET Core**。從清單中選擇 **ASP.NET\
  \ Core Web Application** 模板。\n\n\n\n\n2. 在项目模板中搜索“ASP.NET Core Web 应用程序”并选择它。如下面的截图所示，在“名称”中输入\
  \ MasteringEFCore.Web，在“解决方案名称”中输入 MasteringEFCore，然后点击“确定”：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_26_0.png)\n\
  \n新项目\n\n## 文件菜单\n\n从文件菜单中，执行以下步骤：\n\n1. 选择“新建”|“项目”。\n2. 在左侧窗格中，选择“模板”|“Visual\
  \ C#”|“.NET Core”。\n3. 从列表中选择“ASP.NET Core Web 应用程序”模板。\n4. 如上图所示，在 **名称** 中输入 `MasteringEFCore.CodeFirst.Starter`，在\
  \ **解决方案名称** 中输入 `MasteringEFCore`，然后点击 **确定**。\n\n无论采用上述哪种方式，所选模板都会提供 **“新建 ASP.NET\
  \ Web 应用程序 (.NET Core)”** 对话框，让我们从以下选项中选择：\n\n- **空**\n- **Web API**：创建一个 Web API\
  \ 项目\n- **Web 应用程序（模型-视图-控制器）**：创建一个 MVC Web 应用程序，也允许我们创建 API\n\n我们将从对话框中选择 **Web\
  \ 应用程序（模型-视图-控制器）**，如下所示：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_27_0.png)\n\
  \n新建 ASP.NET Web 项目对话框\n\n5. 在我们的案例中，选择 **.NET Core**、**ASP.NET Core 2.0** 和 **Web\
  \ 应用程序（模型-视图-控制器）** 模板，同时将身份验证设置为 **无身份验证**。点击“确定”：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_28_0.png)\n\
  \n生成的 Web 应用程序显示了一个对我们来说全新的选项卡式界面（而不是显示 `index.cshtml`）。它允许我们直接从起始页访问文档、连接任何服务，甚至决定发布选项。\n\
  \n> \U0001F4A1 **提示**\n>\n> 如果仔细观察，你会注意到 Visual Studio 正在静默还原包；在 .NET Core 中，几乎所有东西都是某个包的一部分。不再有即使我们不需要也会加载大量\
  \ DLL 的重量级框架了！现在一切都被拆分为更轻量的包，我们可以根据需求来使用它们。\n\n我知道深入讲解 MVC 可能稍微超出本章的范围，但在深入探讨 Entity\
  \ Framework 之前，让我们先了解一些细节。\n\n## Web 应用的结构\n\n一个 .NET Core Web 应用程序由以下文件夹组成：\n\n\
  - `Dependencies`：SDK、服务器和客户端依赖项\n- `wwwroot`：所有静态资源都应放在这里\n- `Connected Services`：用于连接\
  \ Marketplace 中提供的外部服务\n- `launchSettings.json`：启动 Web 应用程序所需的设置\n- `appSettings.json`：配置，例如日志记录和连接字符串\n\
  - `bower.json`：客户端依赖项应在此处配置\n- `bundleConfig.json`：捆绑功能现已移至 JSON 配置中\n- `Program.cs`：一切都从\
  \ `Main()` 开始，任何程序都可以使用 WebHostBuilder API 变成 Web 应用程序\n- `Startup.cs`：用于添加和配置启动服务，如\
  \ MVC 支持、日志记录、静态文件支持等\n- `Controllers, Views`：属于 MVC 的一部分，包含操作和对应的视图\n\n到目前为止我们讨论的结构如下图所示：\n\
  \n![](img/17e01f90db603e72c0f0c6a7dce8920c_29_0.png)\n\n在 Views\\Shared\\_Layout.cshtml\
  \ 中，下面突出显示的部分应修改为所需的应用程序名称：\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"\
  utf-8\" />\n<meta name=\"viewport\" content=\"width=device-width,\n    initial-scale=1.0\"\
  \ />\n<title>@ViewData[\"Title\"] - MasteringEF Core.Web</title>\n...\n</head>\n\
  <body>\n<nav class=\"navbar navbar-inverse navbar-fixed-top\">\n<div class=\"container\"\
  >\n<div class=\"navbar-header\">\n...\n<a asp-area=\"\" asp-controller=\"Home\"\
  \ asp-action=\"Index\" class=\"navbar-brand\">MasteringEF Core.Web</a>\n...\n<div\
  \ class=\"container body-content\">\n...\n<footer>\n<p>&copy; 2017 - MasteringEF\
  \ Core.Web</p>\n</footer>\n...\n</body>\n```\n\n我们已经创建了一个不带身份验证的 .NET Core Web 应用程序，并探索了项目结构，这可能有助于我们理解\
  \ .NET Core 中的 MVC。如果展开依赖项，就会明显发现我们没有对 Entity Framework (EF) Core 的内置支持。我们将介绍识别和安装包的几种不同方法。\n\
  \n## 安装 Entity Framework\n\nEntity Framework 包应作为 NuGet 包的一部分安装，可通过以下方式完成：\n\n1.\
  \ 转到“包管理器控制台”（工具 | NuGet 包管理器 | 包管理器控制台），选择要安装包的项目：\n\n   在 PM 控制台中添加以下命令，以在所选项目上安装包：\n\
  \n   ```\n   Install-Package Microsoft.EntityFrameworkCore.SqlServer\n   ```\n\n\
  \   包管理器控制台将打开，如下面的截图所示，请在此处使用上述命令安装包：\n\n   ![](img/17e01f90db603e72c0f0c6a7dce8920c_31_0.png)\n\
  \n2. 转到“包管理”选项卡（可以从“工具”或“依赖项/项目”中进入）。\n   - 若要为整个解决方案安装包，并使其对该解决方案中的所有项目可用，请转到“工具”|“NuGet\
  \ 包管理器”|“管理解决方案的 NuGet 包...”，或在解决方案资源管理器中右键单击解决方案，然后选择“管理解决方案的 NuGet 包...”。\n  \
  \ - 若要按项目安装包，请右键单击目标项目中的“依赖项”，或右键单击目标项目，然后选择“管理 NuGet 包...”。\n\n3. 搜索 Microsoft.EntityFrameworkCore.SqlServer，选择稳定版本\
  \ 2.0.0 并安装该包。它也包含所有依赖包（关键依赖项，如 System.Data.SqlClient 和 Microsoft.EntityFrameworkCore.Relational）：\n\
  \n   ![](img/17e01f90db603e72c0f0c6a7dce8920c_32_0.png)\n\nNuGet 包管理器窗口\n\n到目前为止，我们已经了解了使用包管理器控制台的不同方式，并安装了与\
  \ EF Core 相关的包。在下一节中，我们将开始构建架构，然后使用 EF 来处理所创建的实体。\n\n## 数据模型\n\n在 .NET 世界中，如果我们在创建数据库之前很久就开始创建数据模型，那么我们有点偏离传统做法。没错，这被广泛称为\
  \ **Code-First（代码优先）方法**。让我们使用 code-first 为 Blogging 应用程序创建实体类，并将它们放入项目下的 Models\
  \ 文件夹中。\n\n### Blog 实体\n\n创建一个 `Blog.cs` 类文件，并包含以下属性：\n\n```\npublic class Blog\n\
  {\n    public int Id { get; set; }\n    public string Url { get; set; }\n    public\
  \ ICollection<Post> Posts { get; set; }\n}\n```\n\nEntity Framework 会查找任何名为 Id 或\
  \ TypeNameId 的属性，并将它们标记为表的主键。Posts 属性是一个导航属性，包含与此 Blog 实体相关的 Post 项。对于导航属性，我们使用\
  \ `ICollection<T>` 还是 `IEnumerable<T>` 并不重要，EF 会为我们创建一个集合，默认是 `HashSet<T>`。我们也可以使用\
  \ `List<T>` 创建具体集合。\n\n### Post 实体\n\n创建一个 `Post.cs` 类文件，并包含以下属性：\n\n```\npublic\
  \ class Post\n{\n    public int Id { get; set; }\n    public string Title { get;\
  \ set; }\n    public string Content { get; set; }\n    public DateTime PublishedDateTime\
  \ { get; set; }\n    public int BlogId { get; set; }\n    public Blog Blog { get;\
  \ set; }\n}\n```\n\n`BlogId` 属性是为相应的 `Blog` 导航属性创建的外键。你可能已经注意到，在这种情况下，我们有一个单项作为导航属性，而不是\
  \ `Blog` 实体中的列表。这就是关系类型发挥作用的地方，我们将在第 3 章 *关系 – 术语和约定* 中进行更深入的探讨。\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_34_0.png)\n\
  \nEF 允许我们在实体中创建没有外键的单个导航属性。在这些情况下，EF 将使用 `Blog-Id` 模式（`Blog` 导航属性及其 `Id` 主键）在数据库表中为我们创建外键。EF\
  \ 会针对 `Id` 主键自动为所有导航属性生成外键，但也允许我们以不同方式命名，并通过自定义特性对其进行修饰。\n\n到目前为止，我们已经构建了应用程序所需的架构，但尚未在\
  \ EF 中进行配置，因此让我们看看如何使用数据库上下文将数据模型与 EF 连接/配置。\n\n### 数据库上下文\n\nEF 的主要入口点是任何继承 `Microsoft.EntityFrameworkCore.DbContext`\
  \ 类的类。让我们创建一个名为 `BlogContext` 的类并继承该类。我们将把上下文和其他 EF 相关配置放在 `Data` 文件夹中。在项目中创建一个\
  \ `Data` 文件夹，并在该文件夹中创建 `BlogContext.cs`：\n\n```\npublic class BlogContext: DbContext\n\
  {\n    public BlogContext(DbContextOptions<BlogContext> options)\n        : base(options)\n\
  \    {\n    }\n\n    public DbSet<Blog> Blogs { get; set; }\n    public DbSet<Post>\
  \ Posts { get; set; }\n}\n```\n\nEF 将 `DbSet<T>` 解释为数据库表；我们已经为博客系统的所有实体创建了 `DbSet<T>`\
  \ 属性。我们通常以复数形式命名这些属性，因为该属性将持有实体列表，并且 EF 在数据库中创建表时将使用这些属性名。\n\n\n\n\n\n为父实体创建 DbSet\
  \ 就足够让 EF 识别出依赖实体并为我们创建对应的表。EF 在决定表名时会使用复数形式。\n\n.NET 开发者和 SQL 开发者经常就表名的复数形式进行争论，并最终创建出使用两种不同约定的实体。作为框架，EF\
  \ 也支持这些场景。我们可以使用 Fluent API 来覆盖默认的复数命名行为。参考以下 Fluent API 代码：\n\n```csharp\npublic\
  \ class BlogContext : DbContext\n{\n    ...\n    protected override void OnModelCreating(ModelBuilder\
  \ modelBuilder)\n    {\n        modelBuilder.Entity<Blog>().ToTable(\"Blog\");\n\
  \        modelBuilder.Entity<Post>().ToTable(\"Post\");\n    }\n}\n```\n\n我们已经创建了一个数据库上下文并在其中配置了数据模型。你可能会注意到我们看不到任何指向数据库的连接字符串。它本可以使用带有硬编码连接字符串的\
  \ OnConfiguring() 方法来完成，但这不会是一个理想的实现。相反，我们将在下一节中使用 .NET Core 内置的依赖注入支持来配置它。\n\n\
  ## 在服务中注册上下文（.NET Core DI）\n\nASP.NET 框架中的依赖注入支持来得太晚了，对于那些寻求 Ninject、StructureMap、Castle\
  \ Windsor 等第三方工具庇护的 .NET 开发者/架构师来说。最终，我们获得了 ASP.NET Core 的支持。它具有第三方 DI 提供程序的大部分功能，但唯一的区别是配置应该在\
  \ Startup.cs 中间件内部进行。\n\n首先，让我们在新的 appsettings.json 中配置连接字符串：\n\n```json\n\"ConnectionStrings\"\
  : {\n    \"DefaultConnection\": \"Server=(localdb)\\\\mssqllocaldb;Database=MasteringEFCoreBlog;Trusted_Connection=True;MultipleActiveResultSets=true\"\
  \n},\n```\n\n```csharp\nif (context.Blogs.Any())\n{\n    return;    // DB has been\
  \ seeded\n}\nvar dotnetBlog = new Blog {\n    Url = \"http://blogs.packtpub.com/dotnet\"\
  \ };\nvar dotnetCoreBlog = new Blog { Url =\n    \"http://blogs.packtpub.com/dotnetcore\"\
  \ };\nvar blogs = new Blog[]\n{\n    dotnetBlog,\n    dotnetCoreBlog\n};\nforeach\
  \ (var blog in blogs)\n{\n    context.Blogs.Add(blog);\n}\ncontext.SaveChanges();\n\
  var posts = new Post[]\n{\n    new Post{Id= 1,Title=\".NET 4.7 Released\",Blog =\
  \ dotnetBlog,\n        Content = \".NET 4.7 Released Contents\", PublishedDateTime\
  \ =\n            DateTime.Now},\n    new Post{Id= 1,Title=\".NET Core 1.1 Released\"\
  ,Blog=\n        dotnetCoreBlog,\n        Content = \".NET Core 1.1 Released Contents\"\
  , PublishedDateTime\n            = DateTime.Now},\n    new Post{Id= 1,Title=\"EF\
  \ Core 1.1 Released\",Blog=\n        dotnetCoreBlog,\n        Content = \"EF Core\
  \ 1.1 Released Contents\", PublishedDateTime =\n            DateTime.Now}\n};\n\
  foreach (var post in posts)\n{\n    context.Posts.Add(post);\n}\ncontext.SaveChanges();\n\
  ```\n\n在 **Program.cs** 中，在 **Main()** 中通过依赖注入创建 **BlogContext** 来初始化 **DbInitializer**\
  \ 并将其传递给 **DbInitializer.Initialize()**：\n\n```csharp\npublic static void Main(string[]\
  \ args)\n{\n    var host = BuildWebHost(args);\n    using (var scope = host.Services.CreateScope())\n\
  \    {\n        var services = scope.ServiceProvider;\n        try\n        {\n\
  \            var context = services.GetRequiredService<BlogContext>();\n       \
  \     DbInitializer.Initialize(context);\n        }\n        catch (Exception ex)\n\
  \        {\n            var logger = services.GetRequiredService<ILogger<Program>>();\n\
  \            logger.LogError(ex, \"An error occurred initializing the database.\"\
  );\n        }\n    }\n    host.Run();\n}\n```\n\n最后一块拼图还缺失；我们需要在添加/操作数据模型时添加迁移，否则\
  \ EF 不知道数据库需要如何创建/更新。迁移可以使用 NuGet **Package Manager** 控制台执行：\n\n```powershell\n\
  Add-Migration InitialMigration\n```\n\n前面的语句允许 EF 创建一个迁移文件，其中包含从 DbContext 中配置的模型创建的表。可以按如下方式完成：\n\
  \n```powershell\nUpdate-Database\n```\n\n前面的语句将创建的迁移应用到数据库。此时我们几乎完成了 EF 配置。我们应该运行应用程序并验证数据库，检查适当的模式和种子数据是否已更新。\n\
  \n我们可以使用以下 SQL Server 对象资源管理器验证表是否包含种子数据：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_39_0.png)\n\
  \n数据库创建成功\n\n我们可以看到模式已正确创建在 MSSQLLocalDB 实例中，我们应该展开表并验证种子数据是否已更新。Blog 实体的种子数据已正确更新，这已通过以下截图验证：\n\
  \n![](img/17e01f90db603e72c0f0c6a7dce8920c_39_1.png)\n\nBlog 表已按配置的模式和种子数据创建\n\n\
  此时，Visual Studio 已包含用于脚手架 Controller 和 View 所需的工具，我们已准备好再次开始脚手架过程：\n\n- 1. 右键单击\
  \ Controllers 文件夹并选择 Add | New Scaffolded Item\n- 2. 在 Add Scaffold 对话框中，选择 MVC\
  \ Controller with views, using Entity Framework，如下所示：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_41_0.png)\n\
  \n- 3. 在 **Add Controller** 对话框中，选择适当的 **Model** 和 **Data context class**（在我们的例子中为\
  \ *Blog* 和 *BlogContext*），以及自动生成的控制器名称 *BlogsController*：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_42_0.png)\n\
  \n- 4. 点击 **Add**，如下所示：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_43_0.png)\n\n\
  - 5. 脚手架代码包括 MVC **Controllers** 和 **Views** 中的 CRUD 操作。检查脚手架的 MVC 代码将超出本章范围，因此我们将仅关注\
  \ EF 脚手架部分：\n\n```csharp\npublic class BlogsController : Controller\n{\n    private\
  \ readonly BlogContext _context;\n    public BlogsController(BlogContext context)\n\
  \    {\n        _context = context;\n    }\n    // GET: Blogs\n    public async\
  \ Task<IActionResult> Index()\n    {\n        return View(await _context.Blogs.ToListAsync());\n\
  \    }\n    ...\n}\n```\n\n- 6. 在前面的代码块中，你可能会注意到在将 BlogContext（MasteringEFCoreBlog\
  \ 数据库上下文）传递给控制器时使用了依赖注入，这也在 Index() 操作中使用了：\n\n```html\n<div class=\"navbar-collapse\
  \ collapse\">\n<ul class=\"nav navbar-nav\">\n<li><a asp-area=\"\" asp-controller=\"\
  Home\" asp-action=\"Index\">Home</a></li>\n<li><a asp-area=\"\" asp-controller=\"\
  Blogs\" asp-action=\"Index\">Blogs</a></li>\n...\n```\n\n- 7. 我们需要在 Views\\Shared\\\
  _Layout.cshtml 中更新导航，如前面的代码所示，否则我们将无法查看 Blogs 模块中的 CRUD 操作。准备就绪。让我们运行并查看 CRUD 操作的实际效果：\n\
  \n![](img/17e01f90db603e72c0f0c6a7dce8920c_44_0.png)\n\n更新后的导航菜单包含 Blogs\n\n前面的截图是\
  \ ASP.NET Core Web 应用程序的首页。我们在导航菜单中突出显示了 Blogs 超链接。Blogs 超链接将用户带到 Index 页面，该页面会列出所有博客条目：\n\
  \n![](img/17e01f90db603e72c0f0c6a7dce8920c_45_0.png)\n\nBlogs 列表\n\n让我们尝试在系统中创建一个博客条目，如下所示：\n\
  \n![](img/17e01f90db603e72c0f0c6a7dce8920c_45_1.png)\n\n创建 Blog\n\n**Create** 页面提供了创建实体所需填充的输入元素，因此让我们提供所需数据并验证它：\n\
  \n![](img/17e01f90db603e72c0f0c6a7dce8920c_46_0.png)\n\n**Details** 页面显示实体，前面的截图显示了刚刚创建的实体。**Edit**\
  \ 页面提供了所需输入元素并预先填充现有数据，可以通过使用和更新数据进行编辑：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_46_1.png)\n\
  \n\n\n\n\n**删除**页面提供了一个确认视图，让用户可以确认是否要删除该项：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_47_0.png)\n\
  \n当用户在列表页面的项目行中选择**删除**超链接时，将显示此**删除**页面。我们不会直接从操作中删除博客，而是将用户路由到**删除**页面，在执行操作前获取确认。\n\
  \n我们已经了解了如何使用 EF Core 执行 CRUD 操作。由于探索 MVC 超出了本书的范围，我们只坚持分析与 EF 相关的脚手架。\n\n### 小结\n\
  \n我们从实体框架开始，首先从高层次了解了它与传统方法相比有何不同。我们还研究了如何构建 .NET 环境，以及如何使用实体框架创建和配置 .NET Core Web\
  \ 应用程序。我们探索了 NuGet 包和包管理器，它们将在整本书中被广泛使用。在本章中，我们还确定并安装了实体框架所需的包。使用 Code-First 方法，我们构建了架构，使用\
  \ EF 对其进行了配置，并使用架构和种子数据创建和填充了数据库。最后，我们使用脚手架工具（在过程中安装）在 MVC 应用程序中使用了构建的架构，并查看了控制器中数据库上下文的使用。Code-First\
  \ 方法可用于构建新系统，但对于现有系统，我们需要不同的方法。这就是**Database-First**方法的用武之地。让我们在*第 2 章*《另一种方式——数据库优先方法》中探讨这一点。\n\
  \n## 另一种方式——数据库优先方法\n\n在第 1 章《快速入门——实体框架核心简介》中，我们接触了**实体框架（EF）**的 Code-First 方法，但这种方法并非在所有场景中都有用。我们需要一种使用\
  \ EF Core 逆向工程现有数据库的机制，它指导我们执行迁移，并帮助我们保留模型更改，这些更改在迁移过程中不会丢失。\n\n当 EF 首次发布时，它只支持数据库优先方法，这意味着我们只能在现有数据库上使用该框架。与前一章讨论的\
  \ Code-First 方法不同，当我们决定在现有系统中使用 EF 时，数据库优先方法将被广泛使用。\n\n我们在这里将涵盖的主题有：\n\n- 准备数据库\n\
  - 创建新项目\n- 安装实体框架\n- 逆向工程数据库\n- 在服务中注册上下文（.NET Core DI）\n- 执行 CRUD 操作\n\n### 准备数据库\n\
  \n我们将使用*第 1 章《快速入门——实体框架核心简介》*中使用的同一博客系统。在这种情况下，我们将为现有数据库创建所需的 SQL 查询，然后使用数据库优先方法构建我们的博客系统。让我们编写博客系统所需的\
  \ `Blog` 和 `Post` 的 SQL 查询。\n\n#### Blog 实体脚本\n\n我们将创建 `Blog` 表，然后修改它以添加主键约束，最后向表中插入一些示例数据。完整的脚本可在\
  \ GitHub 仓库中获得，地址为 `https://github.com/PacktPublishing/Mastering-Entity-Framework-Core/blob/master/Chapter%202/Final/MasteringEFCore.DatabaseFirst.Final/dbo.Blog.sql`。\n\
  \n创建 `Blog` 表并插入数据所需的脚本如下所示：\n\n```sql\n// 为简洁起见，代码已移除\nCREATE TABLE [dbo].[Blog]\
  \ (\n    [Id] INT            IDENTITY (1, 1) NOT NULL,\n    [Url] NVARCHAR (MAX)\
  \ NULL\n);\nGO\n// 为简洁起见，代码已移除\nINSERT INTO [Blog] (Url) VALUES\n('http://blogs.packtpub.com/dotnet'),\n\
  ('http://blogs.packtpub.com/dotnetcore'),\n('http://blogs.packtpub.com/signalr')\n\
  GO\n```\n\n我们已经查看了 `Blog` 表的 SQL 脚本，现在让我们看一下 `Post` 表的脚本，它将引入一个非聚集索引和外键。\n\n####\
  \ Post 实体脚本\n\n我们将创建 `Post` 表和一个非聚集索引以获得更好的性能，然后修改它们以添加主键和外键约束，最后向表中插入一些示例数据。完整的脚本可在\
  \ GitHub 仓库中获得，地址为 `https://github.com/PacktPublishing/Mastering-Entity-Framework-Core/blob/master/Chapter%202/Final/MasteringEFCore.DatabaseFirst.Final/dbo.Post.sql`。\n\
  \n创建 Post 表并插入数据所需的脚本如下所示：\n\n```sql\n// 为简洁起见，代码已移除\nCREATE TABLE [dbo].[Post]\
  \ (\n    [Id] INT IDENTITY (1, 1) NOT NULL,\n    [BlogId] INT NOT NULL,\n    [Content]\
  \ NVARCHAR (MAX) NULL,\n    [PublishedDateTime] DATETIME2 (7) NOT NULL,\n    [Title]\
  \ NVARCHAR (MAX) NOT NULL\n);\nGO\n// 为简洁起见，代码已移除\nINSERT INTO [Post] ([BlogId],\
  \ [Title], [Content], [PublishedDateTime]) VALUES\n(1, 'Dotnet 4.7 Released', 'Dotnet\
  \ 4.7 Released Contents', '20170424'),\n(2, '.NET Core 1.1 Released', '.NET Core\
  \ 1.1 Released Contents', '20170424'),\n(2, 'EF Core 1.1 Released', 'EF Core 1.1\
  \ Released Contents', '20170424')\nGO\n```\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_51_0.png)\n\
  \n插入时间值时，我们应使用 YYYYMMDD 格式，例如 20170424，如果我们习惯使用 DD-MM-YYYY hh:mm:ss xm 格式，则需要执行显式转换，例如\
  \ `convert(datetime,'24-04-2017 01:34:09 PM',5)`，否则我们会收到消息：varchar 数据类型到 datetime\
  \ 数据类型的转换导致值超出范围。\n\n我们需要弄清楚如何使用 LocalDB 执行上述脚本：\n\n1. 从“视图”菜单中打开 SQL Server 对象资源管理器。\n\
  2. 展开 SQL Server 和 (localdb)\\MSSQLLocalDB。\n3. 右键单击“数据库”，然后选择“添加新数据库”。\n4. 在“创建数据库”对话框中，将数据库名称提供为\
  \ MasteringEFCoreDbFirst，数据库位置提供为你的项目路径，然后点击“确定”。\n5. 展开“数据库”，右键单击 MasteringEFCoreDbFirst\
  \ 数据库，然后选择“新建查询”。\n6. 复制 `Blog.sql` 内容并将其粘贴到**新建查询**窗口中，然后点击执行图标或按 Ctrl+Shift+E：\n\
  \n   Blog 脚本的执行如下所示：\n\n   ![](img/17e01f90db603e72c0f0c6a7dce8920c_52_0.png)\n\n\
  7. 复制 `Post.sql` 内容并将其粘贴到**新建查询**窗口中，然后点击执行图标或按 Ctrl+Shift+E：\n\n   Post 脚本的执行如下所示：\n\
  \n   ![](img/17e01f90db603e72c0f0c6a7dce8920c_53_0.png)\n\n   在“新建查询”窗口上执行 Post.sql\n\
  \n我们已经为数据库优先方法准备好了数据库；现在让我们看看如何在现有数据库上利用实体框架。\n\n### 创建新项目\n\n我们已经在第 1 章《快速入门——实体框架核心简介》中详细了解了如何创建新项目。请参考创建项目的相关步骤，并使用以下项目信息：\n\
  \n项目名称：MasteringEFCore.DatabaseFirst\n\n解决方案名称：MasteringEFCore\n\n### 安装实体框架\n\n\
  实体框架包的包含和所涉及的步骤也在第 1 章《快速入门——实体框架核心简介》中进行了广泛讨论。因此，让我们关注逆向工程（数据库优先方法）所需的包。实体框架与 SQL\
  \ Server 集成所需的基本包如下：\n\n在 PM 控制台中添加以下命令以安装以下包：\n\n```powershell\nInstall-Package\
  \ Microsoft.EntityFrameworkCore.SqlServer\n```\n\n我们也可以使用 NuGet 包管理器窗口搜索并安装 Microsoft.EntityFrameworkCore.SqlServer\
  \ 包：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_54_0.png)\n\n逆向工程（从数据库自动生成模型）所需的包列在下面。我们可以将以下命令添加到\
  \ PM 控制台以安装这些包：\n\n\n\n```\nInstall-Package Microsoft.EntityFrameworkCore.Tools\n\
  Install-Package Microsoft.EntityFrameworkCore.SqlServer.Design\n```\n\n我们也可以使用 NuGet\
  \ 程序包管理器窗口搜索并安装前面列出的程序包，如下所示：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_55_0.png)\n\
  \nMicrosoft.EntityFrameworkCore.Tools NuGet 程序包\n\n安装 Microsoft.EntityFrameworkCore.Tools\
  \ 程序包。此程序包将 Entity Framework 命令公开给 NuGet 程序包管理器控制台，我们可以使用它执行诸如脚手架数据库上下文之类的某些操作：\n\
  \n![](img/17e01f90db603e72c0f0c6a7dce8920c_55_1.png)\n\nMicrosoft.EntityFrameworkCore.SqlServer.Design\
  \ NuGet 程序包\n\n安装 `Microsoft.EntityFrameworkCore.SqlServer.Design` 程序包。此程序包让我们可以从\
  \ SQL Server 数据库脚手架模型。\n\n> 在撰写本文时，`Microsoft.EntityFrameworkCore.SqlServer.Design\
  \ 2.0.0` 仅作为预览版发布。\n\n我们已安装了用于在 EF Core 中反向工程现有数据库实体的所需程序包。在下一节中，我们将开始反向工程以将 EF\
  \ Core 配置为数据库。\n\n## 反向工程数据库\n\n反向工程可以在 **NuGet 程序包管理器**控制台上执行。我们已经了解了如何打开它，因此只需执行以下命令即可脚手架上下文和模型文件：\n\
  \n```\nScaffold-DbContext \"Server=(localdb)\\mssqllocaldb;Database=MasteringEFCoreDbFirst;Trusted_Connection=True;\"\
  \n    Microsoft.EntityFrameworkCore.SqlServer -OutputDir Models\n```\n\n> 有时我们可能会收到\
  \ **The package could not be located** 的错误。解决方法是单独在另一个解决方案中打开项目。如果我们收到 **Unable\
  \ to open the database** 错误，则在 SQL Management Studio 中提供访问权限（从工作室连接本地）将解决该问题。**SQL\
  \ Server Management Studio (SSMS)** 是免费版本，可以从 `https://docs.microsoft.com/en-us/sql/ssms/download-sql-server-management-studio-ssms`\
  \ 下载。\n\n请参考以下屏幕截图：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_57_0.png)\n\n脚手架过程会生成数据库上下文文件和相应的数据模型（在我们的例子中，总共三个文件）。\n\
  \n## 配置数据上下文\n\n自动生成的数据库上下文（在以下代码中呈现）将包括：\n\n- 表/实体的虚拟属性，用于保存相应数据。\n- OnConfiguring\
  \ 方法，它将使用数据库配置 EF。\n- OnModelCreating 方法，它将在创建数据库时确保某些约束和关系被构建。在我们的数据库优先方法中它将不会被使用，因为我们已经有了它们。\n\
  \n数据库上下文应包含以下配置：\n\n```\npublic partial class MasteringEFCoreDbFirstContext : DbContext\n\
  {\n    public virtual DbSet<Blog> Blog { get; set; }\n    public virtual DbSet<Post>\
  \ Post { get; set; }\n    protected override void OnConfiguring(DbContextOptionsBuilder\
  \ optionsBuilder)\n    {\n        if (!optionsBuilder.IsConfigured)\n        {\n\
  \            // Move this connection string to config file later\n```\n\n```\n```csharp\n\
  optionsBuilder.UseSqlServer(@\"Server=\n    (localdb)\\mssqllocaldb;Database=MasteringEFCoreDbFirst;\n\
  \    Trusted_Connection=True;\");\n}\nprotected override void OnModelCreating(ModelBuilder\
  \ modelBuilder)\n{\n    modelBuilder.Entity<Post>(entity =>\n    {\n        entity.HasIndex(e\
  \ => e.BlogId).HasName(\"IX_Post_BlogId\");\n        entity.Property(e => e.Title).IsRequired();\n\
  \        entity.HasOne(d => d.Blog).WithMany(p => p.Post)\n            .HasForeignKey(d\
  \ => d.BlogId);\n    });\n}\n```\n```\n\n如果您注意到警告，我们需要删除使用依赖注入的部分，这将在 *Registering\
  \ Context in Services (.NET Core DI)* 部分中执行。\n\n## 使用 Blog 实体\n\n我们在第 1 章 *Kickstart\
  \ - Introduction to Entity Framework Core* 中详细讨论了 `Blog` 模型，但仍然，以下突出显示的部分对我们来说看起来很新：\n\
  \n- `Blog()` 构造函数初始化 `Post` 属性，这确保集合有一个具体的 HashSet 列表创建并准备好接受任何新项目\n- `Post` 属性具有\
  \ `virtual` 关键字，这指示 EF 延迟加载导航属性 `Post`：\n\n```\npublic partial class Blog\n{\n \
  \   public Blog()\n    {\n        Post = new HashSet<Post>();\n    }\n    public\
  \ int Id { get; set; }\n    public string Url { get; set; }\n    public virtual\
  \ ICollection<Post> Post { get; set; }\n}\n```\n\n在 `Blog` 类中没有什么太多可探索的，所以，让我们继续到\
  \ `Post` 类。\n\n## 使用 Post 实体\n\n在第 1 章 *Kickstart - Introduction to Entity Framework\
  \ Core* 中，甚至 `Post` 模型也被详细讨论了，除了我们有一个虚拟的 `Blog` 属性，它只是一个导航属性：\n\n```\npublic partial\
  \ class Post\n{\n    public int Id { get; set; }\n    public int BlogId { get; set;\
  \ }\n    public string Content { get; set; }\n    public DateTime PublishedDateTime\
  \ { get; set; }\n    public string Title { get; set; }\n    public virtual Blog\
  \ Blog { get; set; }\n}\n```\n\n我们已经看到了第 1 章 *Kickstart - Introduction to Entity\
  \ Framework Core* 中手动创建的模型与自动生成的模型之间的差异。让我们看看如何使数据库上下文配置更通用，而不是将连接字符串硬编码在代码中。\n\n\
  ## 在服务中注册上下文（.NET Core DI）\n\n`OnConfiguring(DbContextOptionsBuilder optionsBuilder)`\
  \ 方法中显示的警告需要解决。因此让我们删除该方法（在以下代码中突出显示）并在 `Startup.cs` 文件中使用依赖注入执行配置。\n\n## 重构 OnConfiguring()\
  \ 方法\n\n如果我们回顾一下我们如何配置数据库上下文，自动生成的代码使用了硬编码的连接字符串用于配置。为了避免它，我们应该有一个机制将数据库上下文选项传递给\
  \ DbContext 基类；让我们看看如何操作：\n\n```\npublic partial class MasteringEFCoreDbFirstContext\
  \ : DbContext\n{\n    public virtual DbSet<Blog> Blog { get; set; }\n    public\
  \ virtual DbSet<Post> Post { get; set; }\n    protected override void OnConfiguring(DbContextOptionsBuilder\
  \ optionsBuilder)\n    {\n        // Move this connection string to config file\
  \ later\n        optionsBuilder.UseSqlServer(@\"Server=(localdb)\\mssqllocaldb;Database=MasteringEFCoreDbFirst;Trusted_Connection=True;\"\
  );\n    }\n}\n```\n\n还为 MasteringEFCoreDbFirstContext 类包含一个构造函数，该构造函数将通过 Startup\
  \ 类中的依赖注入初始化 DbContext：\n\n```\npublic MasteringEFCoreDbFirstContext(\n    DbContextOptions<MasteringEFCoreDbFirstContext>\
  \ options)\n    : base(options)\n    {\n    }\n```\n\n我们已经了解了如何将选项传递给数据库上下文基类，现在我们将了解如何使用连接字符串配置选项。\n\
  \n## 重构 ConfigureServices 方法\n\n我们将使用 ConfigureServices() 方法将数据库上下文框架服务包含到服务集合中。添加以下\
  \ using 语句以配置 DbContext 选项并将数据库上下文添加到服务列表：\n\n```\nusing Microsoft.EntityFrameworkCore;\n\
  using MasteringEFCore.DatabaseFirst.Final.Models;\n```\n\n正如我们在第 1 章 *Kickstart\
  \ - Introduction to Entity Framework Core* 中所做的那样，我们将上下文配置为服务并将 `DbContext`（使用 `UseSqlServer()`\
  \ 通过 `DbContextOptionsBuilder` 创建）添加到服务集合：\n\n```\npublic void ConfigureServices(IServiceCollection\
  \ services)\n{\n    // Add framework services.\n    services.AddDbContext<MasteringEFCoreDbFirstContext>(options\
  \ =>\n    options.UseSqlServer(Configuration.GetConnectionString(\n        \"DefaultConnection\"\
  )));\n    services.AddMvc();\n}\n```\n\n我们已在框架中配置了数据库上下文，但如果我们仔细观察，会发现连接字符串来自配置。接下来，我们将了解配置如何包含在\
  \ `appsettings.json` 中。\n\n## appsettings.json 设置\n\n应用程序设置，如我们之前探索的那样，基于 JSON，并且为了包含一个设置，我们需要添加一个\
  \ JSON 键值对。在我们的例子中，`ConnectionStrings` 是键，值又是定义 `DefaultConnection` 的 JSON 对象：\n\
  \n```\n{\n  \"ConnectionStrings\": {\n    \"DefaultConnection\": \"Server=(localdb)\\\
  mssqllocaldb;Database=MasteringEFCoreDbFirst;Trusted_Connection=True;MultipleActiveResultSets=true\"\
  \n  },\n  \"Logging\": {\n    \"IncludeScopes\": false,\n    \"LogLevel\": {\n \
  \     \"Default\": \"Warning\"\n    }\n  }\n}\n```\n\n\n\n\n在本节中，我们已在 ConfigureServices()\
  \ 方法中配置了数据库上下文，并利用了 appsettings.json 使连接可配置。至此，所有必要的配置已完成，EF 已准备好使用数据库进行后续实现。让我们看看如何使用\
  \ EF 执行 CRUD 操作（我们在第1章《快速入门——实体框架核心介绍》中已经见过这些操作，但仍然会探讨一些之前未涉及的与渲染相关的部分）。\n\n## 执行\
  \ CRUD 操作\n\n我们已经了解了如何为 Blog 模型搭建控制器及其对应视图来创建 CRUD 操作，因此本节将为 Post 模型创建这些操作：\n\n\
  - 1. 右键单击 Controllers 文件夹，然后选择“添加”|“新建搭建项”。\n- 2. 在“添加脚手架”对话框中，选择“使用实体框架的带有视图的MVC控制器”：\n\
  \n![](img/17e01f90db603e72c0f0c6a7dce8920c_62_0.png)\n\n3. 在“添加控制器”对话框中，选择相应的模型类和数据库上下文类（在本例中为\
  \ Post 和 MasteringEF CoreDbFirstContext），以及自动生成的控制器名称 PostsController：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_63_0.png)\n\
  \n屏幕上会反映这些更改，我们可以看到博客 URL 而不是之前列出的 ID 被渲染出来：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_65_0.png)\n\
  \n帖子列表视图\n\n我们已经搭建了 CRUD 操作，并在 Post 索引操作中将博客 ID 的用法修改为 URL。让我们在其他操作中也进行同样的更新。\n\n\
  ## 创建控制器操作\n\n我们在上一节所做的更改需要在 SelectList 集合中更新，MVC 将使用该集合渲染下拉列表。默认情况下，MVC 脚手架提供的\
  \ SelectList（我们已对该行进行注释）的 Value 字段中具有 Id，需要将其修改为 Url，否则屏幕上只会显示数值（这是一个严重的安全问题，也不太用户友好）：\n\
  \n```\npublic IActionResult Create()\n{\n    //ViewData[\"BlogId\"] = new SelectList(_context.Blog,\
  \ \"Id\", \"Id\");\n    ViewData[\"BlogId\"] = new SelectList(_context.Blog, \"\
  Id\", \"Url\");\n    return View();\n}\n```\n\n以下截图显示了映射到 BlogId 控件的 Url，但还有一些额外的问题需要修复。BlogId\
  \ 应该只是 Blog 或博客 URL。\n\n我将把这部分留作练习，请对与 BlogId 列关联的所有标签进行修改：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_66_0.png)\n\
  \n帖子创建视图\n\n同样的更改也需要应用于 Create 的 Post 操作：\n\n```\n[HttpPost]\n[ValidateAntiForgeryToken]\n\
  public async Task<IActionResult>\nCreate([Bind(\"Id,BlogId,Content,PublishedDateTime,Title\"\
  )]\n    Post post)\n{\n    ...\n    ViewData[\"BlogId\"] = new SelectList(_context.Blog,\
  \ \"Id\", \"Url\",\n        post.BlogId);\n    return View(post);\n}\n```\n\n以下截图显示了映射到\
  \ BlogId 控件的 URL，作为练习的一部分，请按照你在“创建控制器操作”一节中所做的字面更改，对 BlogId 标签进行修改：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_68_0.png)\n\
  \n编辑帖子\n\n同样的更改也需要应用于 Edit 的 Post 操作：\n\n```\n[HttpPost]\n[ValidateAntiForgeryToken]\n\
  public async Task<IActionResult> Edit(int id,\n[Bind(\"Id,BlogId,Content,PublishedDateTime,Title\"\
  )] Post post)\n{\n...\nViewData[\"BlogId\"] = new SelectList(_context.Blog, \"Id\"\
  , \"Url\",\npost.BlogId);\nreturn View(post);\n}\n```\n\n这些更改反映在屏幕上显示的更新项中：\n\n\
  ![](img/17e01f90db603e72c0f0c6a7dce8920c_69_0.png)\n\n我们已在 Post **Edit**（HTTP、Get\
  \ 和 Post）操作中将对博客 ID 的引用更新为博客 URL。让我们在剩余的 **DELETE** 操作中也进行更新。\n\n## 删除视图\n\n在 `Delete`\
  \ 视图中，也应显示 `Blog.Url` 而不是博客 ID：\n\n```\n```html\n<dl class=\"dl-horizontal\">\n\
  \    ...\n    <dd>\n        @Html.DisplayFor(model => model.Blog.Url)\n    </dd>\n\
  </dl>\n```\n```\n\n这些更改反映在删除确认屏幕上，现在显示博客 URL 而不是博客 ID：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_70_0.png)\n\
  \n删除帖子\n\nPost 列表页面不显示已删除的项，这确保了数据已从表中删除：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_70_1.png)\n\
  \n删除帖子后的列表视图\n\n我们已经发现了第1章 *快速入门——实体框架核心介绍* 中涵盖的 CRUD 操作中某些缺失的部分，因为数据库优先方法中需要解决的具体更改并不多。\n\
  \n## 小结\n\n我们已经学会了如何在具有实时数据库的现有系统上利用实体框架（为了说明目的，我们创建了 SQL 脚本来创建和模拟现有数据库）。我们探索了公开反向工程数据库所需\
  \ API 的 NuGet 包（包括数据库上下文和相应的数据模型）。最后，我们使用脚手架工具（在过程中安装）在 MVC 应用程序中使用了现有数据库，并且还看到了对自动生成的代码所做的更改（第1章\
  \ *快速入门——实体框架核心介绍* 中未涵盖）。数据库优先方法只是一种用于构建现有系统的机制（在现有系统中利用 EF）。到目前为止，我们已经使用了关系（新的或现有的），但尚未弄清楚实体框架支持的关系。让我们在第3章\
  \ *关系——术语与约定* 中探讨它们。\n"
- "# 3 理解关系术语\n关系——术语与约定\n\n在第2章《另一个方向——数据库优先方法》中，我们使用实体框架的数据库优先方法重新设计了现有数据库。现在让我们开始理解关系中使用的术语和约定。\n\
  \n如果我们不给实体一个身份，实体就毫无用处。我们将在本章探讨的关系术语将为实体提供身份，这不仅描述了它们，还帮助我们创建不同实体之间的关系。\n\n本章将涵盖的主题如下：\n\
  \n- - 理解关系术语：\n- - 数据模型\n- - 主体实体\n- - 主体键\n- - 依赖实体\n- - 外键\n- - 导航属性\n- - 关系中的约定：\n\
  - - 完全定义的关系\n- - 无外键属性\n- - 单一导航属性\n- - 外键\n- - 反向属性\n\n## 理解关系术语\n\n到目前为止，我们已经创建并使用了数据模型或实体，但尚未弄清楚它们是如何关联的。让我们理解它们是如何关联的以及用于这些关系的术语。\n\
  \n## 数据模型\n\n我们将重新审视在第1章《快速入门——实体框架核心介绍》（使用代码优先方法）中创建和使用的数据模型，这些模型可用于理解关系术语。出于说明目的，我们将对这些对象进行调整，以理解系统中未使用的不同术语。\n\
  \n## Blog 实体\n\n我们使用代码优先方法创建的 Blog 实体/数据模型如下所示：\n\n```\npublic class Blog\n{\n \
  \   public int Id { get; set; }\n    public string Url { get; set; }\n    public\
  \ ICollection<Post> Posts { get; set; }\n}\n```\n\n我们将使用 Blog 模型来理解以下内容：\n\n- -\
  \ 主体实体\n- - 主体键\n- - 导航属性\n\n## Post 实体\n\n我们使用代码优先方法创建的 Post 实体/数据模型如下所示：\n\n```\n\
  public class Post\n{\n    public int Id { get; set; }\n    public string Title {\
  \ get; set; }\n    public string Content { get; set; }\n}\n```\n\n\n\n\n```\npublic\
  \ DateTime PublishedDateTime { get; set; }\npublic int BlogId { get; set; }\npublic\
  \ Blog Blog { get; set; }\n}\n```\n\n我们将使用 Post 模型来理解以下概念：\n\n-   依赖实体\n-   外键\n\
  -   导航属性\n-   引用导航属性\n-   反向导航属性\n\n在数据模型部分，我们已经在相应模型中捕捉了关键的关系术语，现在我们将逐一详细讨论它们。\n\
  \n## 主体实体\n\n在关系中充当父级的实体被称为主体实体。在数据库世界中，该实体持有主键，供依赖实体在建立关系时使用。请看下图：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_74_0.png)\n\
  \n在我们的博客系统中，`Blog` 实体充当 `Post` 实体的父级，因此我们可以得出结论：`Blog` 是主体实体。我们在这两个实体之间建立的关系可以称为\
  \ **关联（Association）**。请看下图：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_74_1.png)\n\
  \n在我们的博客系统中，`Person` 实体充当 `User` 实体的父级，因此我们可以得出结论：`Person` 是主体实体。我们在这两个实体之间建立的关系可以称为\
  \ **包含（Containment）**。请看下图：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_75_0.png)\n\
  \n我们已经了解了主体实体；接下来在下一节中探讨使用主体实体构建的关系的键。\n\n## 主体键\n\n父实体需要一个唯一键来与子实体关联，用于此目的的键被称为**主体键**。在我们的博客系统中，`Blog`\
  \ 实体的 `Id` 属性将是博客条目的唯一键/主体键，依赖的 `Post` 实体将使用它来与 `Blog` 实体建立关系：\n\n```\npublic class\
  \ Blog\n{\n    public int Id { get; set; }\n    public string Title { get; set;\
  \ }\n    public string Subtitle { get; set; }\n    public string Url { get; set;\
  \ }\n    public string Description { get; set; }\n    public DateTime CreatedAt\
  \ { get; set; }\n    public DateTime ModifiedAt { get; set; }\n    public int CreatedBy\
  \ { get; set; }\n    public int ModifiedBy { get; set; }\n    public ICollection<Post>\
  \ Posts { get; set; }\n}\n```\n\n**Blog** 表的设计如下所示。在表设计中，高亮显示的 `Id` 字段将是该表的唯一主键：\n\
  \n![](img/17e01f90db603e72c0f0c6a7dce8920c_76_0.png)\n\n除了主键之外，非主键也有可能用于构建关系，这种键被称为**备用键**。在我们的博客系统中，**Blog**\
  \ 实体的 **Url** 属性可以作为构建关系的备用键：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_76_1.png)\n\
  \n我们已经了解了主体键，它定义了使用主体实体构建的关系；接下来在下一节中探讨依赖实体。\n\n## 依赖实体\n\n无法独立存在（始终依赖其父级）的实体最终会成为子实体。在关系中，这被称为依赖实体。请看下图：\n\
  \n![](img/17e01f90db603e72c0f0c6a7dce8920c_77_0.png)\n\n在我们的博客系统中，`Post` 实体依赖于 `Blog`\
  \ 实体（帖子是为相应的博客创建的，因此没有博客条目，帖子就不存在），因此我们可以得出结论：`Post` 是依赖实体。在数据库世界中，该实体持有一个外键，该外键将在关系中保存对主体实体的引用。如下图所示：\n\
  \n![](img/17e01f90db603e72c0f0c6a7dce8920c_77_1.png)\n\n在我们的博客系统中，`User` 实体依赖于 `Person`\
  \ 实体，因此我们可以得出结论：`User` 是依赖实体。如下图所示：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_77_2.png)\n\
  \n我们已经了解了依赖实体；接下来在下一节中探讨使用依赖实体构建的关系的键。\n\n## 外键\n\n子实体需要一个唯一键来与父实体关联。该键通常保存主体键的值，以标记其与父实体的关系，称为**外键**。在我们的博客系统中，`Post`\
  \ 实体的 `BlogId` 属性保存了对父实体唯一键/主体键的引用，以表示与 `Blog` 实体的关系：\n\n```\npublic class Post\n\
  {\n    public int Id { get; set; }\n    public string Title { get; set; }\n    public\
  \ string Content { get; set; }\n    public string Summary { get; set; }\n    public\
  \ DateTime PublishedDateTime { get; set; }\n    public string Url { get; set; }\n\
  \    public long VisitorCount { get; set; }\n    public DateTime CreatedAt { get;\
  \ set; }\n    public DateTime ModifiedAt { get; set; }\n    public int CreatedBy\
  \ { get; set; }\n    public int ModifiedBy { get; set; }\n    public int BlogId\
  \ { get; set; }\n    public Blog Blog { get; set; }\n    public int AuthorId { get;\
  \ set; }\n    public User Author { get; set; }\n    public int CategoryId { get;\
  \ set; }\n    public Category Category { get; set; }\n    public ICollection<TagPost>\
  \ TagPosts { get; set; }\n    public ICollection<Comment> Comments { get; set; }\n\
  }\n```\n\n## 集合导航属性\n\n我们可以从其名称推断出它的实际作用：它持有一组依赖实体（或对依赖项列表的引用），并且始终持有对多个项目的引用。在我们的博客系统中，`Blog`\
  \ 实体的 `Posts` 属性可以被视为集合导航属性：\n\n```\npublic class Blog\n{\n    ... // code removed\
  \ for brevity\n    public ICollection<Post> Posts { get; set; }\n}\n```\n\n`Blog`\
  \ 和 `Post` 类图如下所示。在设计中，`Blog` 实体中高亮显示的 `Posts` 字段将是集合导航属性：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_80_0.png)\n\
  \n我们已经了解了持有子集合的属性；接下来在下一节中探讨依赖实体如何持有对其父实体的引用。\n\n## 引用导航属性\n\n我们可以从其名称推断出它的实际作用。是的，它持有对其父实体的引用，并且始终持有对单个项目的引用。在我们的博客系统中，`Post`\
  \ 实体的 `Blog` 属性可以被视为引用导航属性：\n\n```\npublic class Post\n{\n    ... // code removed\
  \ for brevity\n    public int BlogId { get; set; }\n    public Blog Blog { get;\
  \ set; }\n}\n```\n\n`Blog` 和 `Post` 类图如下所示。在设计中，`Post` 实体中高亮显示的 `Blog` 字段将是引用导航属性：\n\
  \n![](img/17e01f90db603e72c0f0c6a7dce8920c_81_0.png)\n\n我们已经了解了持有对其父实体引用的属性，而这对于反向导航属性是什么造成了一些困惑。\n\
  \n## 反向导航属性\n\n你猜对了，这有点棘手，因为它总是指关系的另一端。在我们的博客系统中，`Post` 实体的 `Blog` 属性可以被视为 `Blog`\
  \ 实体 `Posts` 属性的反向导航属性：\n\n```\npublic class Post\n{\n    ... // code removed for\
  \ brevity\n    public Blog Blog { get; set; }\n}\n```\n\n反之亦然，这意味着 `Blog` 实体的 `Posts`\
  \ 属性也可以被视为 `Post` 实体 `Blog` 属性的反向导航属性：\n\n```\npublic class Blog\n{\n    ... //\
  \ code removed for brevity\n    public ICollection<Post> Posts { get; set; }\n}\n\
  ```\n\n`Blog` 和 `Post` 类图如下所示。在设计中，`Post` 实体中高亮显示的 `Blog` 字段和 `Blog` 实体中的 `Posts`\
  \ 字段将是反向导航属性：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_82_0.png)\n\n\n\n\n\n\
  Blog 和 Post 类的类图如下所示。在设计中，高亮的属性将是导航属性：\n\n- Post 实体中的 Blog 字段和 Blog 实体中的 Posts 字段将是反向导航属性\n\
  - Post 实体中的 Blog 字段将是引用导航属性\n- 前述两个导航属性完成了关系，因此它被称为完全定义的关联\n\n下图说明了 Blog 和 Post\
  \ 实体之间完全定义的关联：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_84_0.png)\n\n我们迄今为止使用的数据模型具有完全定义的关联。我们将在后面的章节中调整这些数据模型以说明其他约定。\n\
  \n## 完全定义的关联 - 内部原理\n\nEF Core 在以下场景的基础上内部使用机制在实体之间创建关联：\n\n- 如果两个实体具有指向彼此的导航属性；EF\
  \ 将把它们配置为反向导航属性\n\n在下面的代码中，Blog 实体的 Posts 属性和 Post 实体的 Blog 属性将被配置为反向导航属性：\n\n```\n\
  public class Blog\n{\n    // Code removed for brevity\n    public ICollection<Post>\
  \ Posts { get; set; }\n}\npublic class Post\n{\n    // Code removed for brevity\n\
  \    public Blog Blog { get; set; }\n}\n```\n\n下图说明了基于导航属性创建的关联：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_85_0.png)\n\
  \n- 如果命名约定使用主实体名称与主键属性名称，EF 将认为该属性是外键：\n\n在下面的代码中，主实体 `Blog`，其主键为 `Id`，将在 `Post`\
  \ 实体中具有外键 `BlogId`：\n\n```\npublic class Blog\n{\n    public int Id { get; set;\
  \ }\n    // Code removed for brevity\n}\npublic class Post\n{\n    // Code removed\
  \ for brevity\n    public int BlogId { get; set; }\n}\n```\n\n下图说明了如何在 `Post` 实体中创建外键：\n\
  \n![](img/17e01f90db603e72c0f0c6a7dce8920c_86_0.png)\n\n- 如果主实体主键与从实体引用键匹配，EF 将创建外键关联。\n\
  \n在下面的代码中，`Blog` 实体的主键 `BlogId` 将在 `Post` 实体中具有外键 `BlogId`：\n\n```\n```csharp\n\
  public class Blog\n{\n    public int BlogId { get; set; }\n    // code removed for\
  \ brevity\n}\npublic class Post\n{\n    // code removed for brevity\n    public\
  \ int BlogId { get; set; }\n}\n```\n```\n\n下图说明外键与其匹配的主实体的标识符相关：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_87_0.png)\n\
  \n- EF 将创建外键\n\n在下面的代码中，Post 实体的 SomeBlog 导航属性与 Blog 实体的主键 Id 将在 Post 实体中具有外键 SomeBlogId：\n\
  \n```\npublic class Blog\n{\n    public int Id { get; set; }\n    // code removed\
  \ for brevity\n}\npublic class Post\n{\n    // code removed for brevity\n    public\
  \ Blog SomeBlog { get; set; }\n    public int SomeBlogId { get; set; }\n}\n```\n\
  \n下图说明外键基于从实体导航属性名称：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_88_0.png)\n\n我们已经使用\
  \ EF 在识别关联时期望的不同命名约定探索了完全定义的关联；让我们在接下来的章节中了解其他约定。\n\n## 无外键属性\n\n我们通常使用完全定义的关联创建实体，但这不是\
  \ Entity Framework 所期望的。在关联中，外键不是必需的，但建议有一个：\n\n下面的代码在 Post 实体中不包含外键，关联仍然形成：\n\n\
  ```\npublic class Blog\n{\n    // code removed for brevity\n    public ICollection<Post>\
  \ Posts { get; set; }\n}\npublic class Post\n{\n    // code removed for brevity\n\
  \    // Foreign key BlogId was removed from here\n    public Blog Blog { get; set;\
  \ }\n}\n```\n\n下图说明了在没有外键的情况下，关联是如何构建的：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_89_0.png)\n\
  \n我们已从 Post 实体中删除了 BlogId 外键，它仍然按预期工作。\n\n## 无外键属性 - 内部原理\n\n即使没有外键，关联也能工作，因为 Entity\
  \ Framework 会为我们创建影子属性。它遵循导航属性与主键名称的命名约定：\n\n在下面的代码中，Post 实体中的外键由框架注入：\n\n```\n\
  public class Blog\n{\n    ... // code removed for brevity\n    public ICollection<Post>\
  \ Posts { get; set; }\n}\npublic class Post\n{\n    ... // code removed for brevity\n\
  \    public int BlogId { get; set; } // shadow property created by EF\n    public\
  \ Blog Blog { get; set; }\n}\n```\n\n下图说明外键由框架注入：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_90_0.png)\n\
  \n![](img/17e01f90db603e72c0f0c6a7dce8920c_92_0.png)\n\n我们已从 Post 实体中删除了 Blog 导航属性，它仍然按预期工作。\n\
  \n## 外键\n\n我们可以使用不同的命名约定为外键命名，并且仍然可以将该外键映射到导航属性（使用 ForeignKey 数据注释即可）。在关联中，从实体中不需要导航属性，这意味着在主实体上仅有一个导航属性就足够了：\n\
  \n在下面的代码中，自定义外键映射到导航属性：\n\n```\npublic class Blog\n{\n    ... // code removed for\
  \ brevity\n    public ICollection<Post> Posts { get; set; }\n}\npublic class Post\n\
  {\n    ... // code removed for brevity\n    public int BlogSomeId { get; set; }\n\
  \    [ForeignKey(\"BlogSomeId\")]\n    public Blog Blog { get; set; }\n}\n```\n\n\
  下图说明自定义外键映射到导航属性：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_93_0.png)\n\n我们已将外键修改为\
  \ BlogSomeId 并将其配置为 Post 实体的 Blog 导航属性，它仍然按预期工作。\n\n## 反向属性\n\n如果实体中有多个导航属性，使用反向属性来配对关系中的导航属性是有意义的。即使我们有完全定义的关联，由于自定义命名约定不属于\
  \ EF 的任何发现机制，我们仍然需要反向属性来配对导航属性的情况也会出现：\n\n在下面的代码中，自定义外键和导航属性在反向导航属性中进行了配置：\n\n```\n\
  public class Blog\n{\n    ... // code removed for brevity\n    [InverseProperty(\"\
  SomeBlog\")]\n    public ICollection<Post> SomePosts { get; set; }\n}\npublic class\
  \ Post\n{\n    ... // code removed for brevity\n    public int SomeBlogId { get;\
  \ set; }\n    public Blog SomeBlog { get; set; }\n}\n```\n\n下图说明自定义外键和导航属性在反向导航属性中进行了配置：\n\
  \n![](img/17e01f90db603e72c0f0c6a7dce8920c_94_0.png)\n\n我们在 `Blog` 实体中引入了 `SomeBlog`\
  \ 反向属性，它与 `Post` 实体的 `SomeBlog` 导航属性配对。\n\n## 总结\n\n在本章中，我们介绍了 Entity Framework\
  \ 中用于关联的术语和约定。我们从完全定义的关联开始，从那里开始修剪关联，但仍然使关联工作。最后，我们自定义并配对了导航属性与自定义属性，并且仍然使关联工作。本章介绍了我们对关联的了解（我们也瞥见了\
  \ Fluent API），但我们没有机会了解不同的关联。让我们在第 4 章 *构建关联 - 了解映射* 中探索它们。\n\n\n\n\n"
- "# 4 构建关系 — 理解映射\n\n在第 3 章《关系 — 术语和约定》中，我们学习了在关系中使用的术语和约定；让我们开始在构建关系时使用它们。我们到目前为止只使用了\
  \ Blog 和 Post 实体，这对博客系统没有任何好处。让我们将它们扩展到 Comment、Tag 等其他实体，我们也将利用它们来理解关系。\n\n关系从最初的\
  \ Entity Framework (EF) 版本就引入了，但对双向关系存在限制。在成熟的框架中，我们支持多重性，使得多个实体可以相互关联。\n\n本章我们将涵盖的主题是：\n\
  \n- Relationships:\n  - One-to-one\n  - One-to-many\n  - Many-to-many\n- Fluent\
  \ API:\n  - Identifying navigation property and inverse navigation\n  - Identifying\
  \ single navigation property\n  - Relationship-building techniques\n  - Cascade\
  \ delete\n\n## Relationships\n\n我们可以在 EF 中轻松地在实体关系中建立传统的 one-to-one、one-to-many\
  \ 和 many-to-many 关系。让我们在本节中详细探讨它们。为了增加趣味性，让我们在理解关系的过程中设计博客系统的数据库：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_96_0.png)\n\
  \n我们已经看到了博客系统的拟议设计；现在让我们学习关系以及如何使用相同的设计来构建它们。\n\n### The one-to-one relationship\n\
  \n我们需要一个新的实体来解释 one-to-one 关系，因为现有实体没有提供解释的途径。所以让我们从拟议设计中选择 Address 实体，看看 one-to-one\
  \ 关系是如何构建的：\n\n说明 User 和 Address 实体之间 one-to-one 关系的代码如下所示：\n\n```\npublic class\
  \ User\n{\n    public int Id { get; set; }\n    public string DisplayName { get;\
  \ set; }\n    public string Username { get; set; }\n    public string PasswordHash\
  \ { get; set; }\n    public string Email { get; set; }\n    public DateTime CreatedAt\
  \ { get; set; }\n    public DateTime ModifiedAt { get; set; }\n    public int CreatedBy\
  \ { get; set; }\n    public int ModifiedBy { get; set; }\n    public ICollection<Blog>\
  \ Blogs { get; set; }\n    public ICollection<Post> Posts { get; set; }\n    public\
  \ ICollection<Comment> Comments { get; set; }\n    public int? AddressId { get;\
  \ set; }\n    public Address Address { get; set; }\n    public int PersonId { get;\
  \ set; }\n    public Person Person { get; set; }\n}\n\npublic class Address\n{\n\
  \    public int Id { get; set; }\n    public string FlatHouseInfo { get; set; }\n\
  \    public string StreetName { get; set; }\n    public string Locality { get; set;\
  \ }\n    public string City { get; set; }\n    public string State { get; set; }\n\
  \    public string Country { get; set; }\n    public string LatitudeLongitude {\
  \ get; set; }\n    public DateTime CreatedAt { get; set; }\n    public DateTime\
  \ ModifiedAt { get; set; }\n    public int CreatedBy { get; set; }\n```\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_99_0.png)\n\
  \n我们已经确定了该配置关系所需的字段，即 UserId 字段，它将允许实体配置关系。让我们在下一节中使用 Fluent API 构建关系。\n\n### Building\
  \ one-to-one relationships using the Fluent API\n\n我们可以使用 Fluent API 中的 HasOne、WithOne\
  \ 和 HasForeignKey 方法来配置关系。HasForeignKey 方法在 one-to-one 关系中需要是泛型的（一对多关系不需要此方法），因为我们需要显式标记依赖类型。在我们的例子中，我们为外键指定了\
  \ Address 实体：\n\n```\nprotected override void OnModelCreating(ModelBuilder modelBuilder)\n\
  {\n    modelBuilder.Entity<Blog>().ToTable(\"Blog\");\n    modelBuilder.Entity<Post>().ToTable(\"\
  Post\");\n    modelBuilder.Entity<User>()\n        .ToTable(\"User\")\n        .HasOne(x=>x.Address)\n\
  \        .WithOne(x=>x.User)\n        .HasForeignKey<Address>(x=>x.UserId);\n  \
  \  modelBuilder.Entity<Address>().ToTable(\"Address\");\n}\n```\n\nFluent API 配置将为我们提供预期的关系，这反映在以下数据库图中。User\
  \ 和 Address 实体之间现在建立了 one-to-one 关系，只是 AddressId 字段是可选的，因为在创建用户时它不是强制性的，但创建地址需要用户：\n\
  \n![](img/17e01f90db603e72c0f0c6a7dce8920c_100_0.png)\n\n我们可以在博客系统中捕获更多属于 one-to-many\
  \ 关系的关联。以下图表显示了 Person 和 User 实体之间的一对多关系：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_101_0.png)\n\
  \n我们已经看到了 User 表设计；让我们看看 Person 表设计内容：\n\n```\npublic class Person\n{\n    public\
  \ int Id { get; set; }\n    public string FirstName { get; set; }\n    public string\
  \ LastName { get; set; }\n    public string NickName { get; set; }\n    public string\
  \ Url { get; set; }\n    public string Biography { get; set; }\n    public string\
  \ ImageUrl { get; set; }\n```\n\n```\n```csharp\npublic DateTime CreatedAt { get;\
  \ set; }\npublic DateTime ModifiedAt { get; set; }\npublic int CreatedBy { get;\
  \ set; }\npublic int ModifiedBy { get; set; }\npublic int? UserId { get; set; }\n\
  public User User { get; set; }\npublic ICollection<Comment> Comments { get; set;\
  \ }\n}\n```\n```\n\n我们在本节中查看了 one-to-one 关系。让我们在下一节中探索 one-to-many 关系。\n\n### The\
  \ one-to-many relationship\n\n到目前为止，`Blog` 和 `Post` 实体之间进行的说明都具有 one-to-many 关系。如果我们仔细观察，我们可能能够弄明白；`Blog`\
  \ 实体是主实体，`Post` 实体是依赖实体，其中 `Blog` 实体可以包含一个或多个帖子（瞧！one-to-many 已经就位）：\n\n```\n```csharp\n\
  public class Blog\n{\n    public int Id { get; set; }\n    public string Title {\
  \ get; set; }\n    public string Subtitle { get; set; }\n    public string Url {\
  \ get; set; }\n    public string Description { get; set; }\n    public DateTime\
  \ CreatedAt { get; set; }\n    public DateTime ModifiedAt { get; set; }\n    public\
  \ int CreatedBy { get; set; }\n    public int ModifiedBy { get; set; }\n    public\
  \ ICollection<Post> Posts { get; set; }\n}\n\npublic class Post\n{\n    public int\
  \ Id { get; set; }\n    public string Title { get; set; }\n    public string Content\
  \ { get; set; }\n    public string Summary { get; set; }\n    public DateTime PublishedDateTime\
  \ { get; set; }\n    public string Url { get; set; }\n    public long VisitorCount\
  \ { get; set; }\n    public DateTime CreatedAt { get; set; }\n    public DateTime\
  \ ModifiedAt { get; set; }\n    public int CreatedBy { get; set; }\n```\n\n```\n\
  public int ModifiedBy { get; set; }\npublic int BlogId { get; set; }\npublic Blog\
  \ Blog { get; set; }\npublic int AuthorId { get; set; }\npublic User Author { get;\
  \ set; }\npublic int CategoryId { get; set; }\npublic Category Category { get; set;\
  \ }\npublic ICollection<TagPost> TagPosts { get; set; }\npublic ICollection<Comment>\
  \ Comments { get; set; }\n}\n```\n\n模型中前面完全定义的这种关系将提供以下关系。它不需要 Fluent API 配置，除非我们有很多导航属性：\n\
  \n![](img/17e01f90db603e72c0f0c6a7dce8920c_103_0.png)\n\n由于我们有一个 one-to-many 关系，并且很明显\
  \ Blog 是主实体而 Post 是依赖实体，因此 EF 不需要任何显式配置来定义关系的性质，因此它是通过隐式完成的。\n\n我们可以在博客系统中捕获更多属于\
  \ one-to-many 关系的关联。以下图表显示了博客系统中其他一对多关系：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_104_0.png)\n\
  \n\n\n\n\n其他一对多关系是在以下实体之间：\n\n- Blog 和 Post\n- Blog 和 User\n- Blog 和 Category\n\n\
  从前面的实体来看，我们已经看到了除 `Category` 类之外的所有表设计。让我们看看它的设计内容：\n\n```\npublic class Category\n\
  {\n    public int Id { get; set; }\n    public string Name { get; set; }\n    public\
  \ DateTime CreatedAt { get; set; }\n    public DateTime ModifiedAt { get; set; }\n\
  \    public int CreatedBy { get; set; }\n    public int ModifiedBy { get; set; }\n\
  \    public int? ParentCategoryId { get; set; }\n    public Category ParentCategory\
  \ { get; set; }\n    public ICollection<Category> Subcategories { get; set; }\n\
  \    public ICollection<Blog> Blogs { get; set; }\n    public ICollection<Post>\
  \ Posts { get; set; }\n}\n```\n\n到目前为止，我们在博客系统设计中已经看到了三种关系；下图显示了博客系统中另外一些一对多关系：\n\
  \n![](img/17e01f90db603e72c0f0c6a7dce8920c_106_0.png)\n\n另外的一些一对多关系是在以下实体之间：\n\n\
  - Post 和 Comment\n- User 和 Comment\n- Person 和 Comment\n\n从前面的实体来看，我们已经看到了除 `Comment`\
  \ 之外的所有表设计。让我们看看它的设计内容：\n\n```\npublic class Comment\n{\n    public int Id { get;\
  \ set; }\n    public string Content { get; set; }\n    public DateTime CommentedAt\
  \ { get; set; }\n    public DateTime CreatedAt { get; set; }\n    public DateTime\
  \ ModifiedAt { get; set; }\n    public int CreatedBy { get; set; }\n    public int\
  \ ModifiedBy { get; set; }\n    public int PostId { get; set; }\n    public Post\
  \ Post { get; set; }\n    public int? PersonId { get; set; }\n    public Person\
  \ Person { get; set; }\n    public int? UserId { get; set; }\n    public User User\
  \ { get; set; }\n}\n```\n\n我们遇到了具有一些不同关系的 `Comment` 实体。它具有自引用关系（坦率地说，它指向自身），它也属于一对多关系，唯一的区别是，在这种情况下，父实体和从属实体是相同的：\n\
  \n![](img/17e01f90db603e72c0f0c6a7dce8920c_107_0.png)\n\n我们已经涵盖了博客系统设计中的一对多关系。让我们在下一节中探索多对多关系。\n\
  \n## 多对多关系\n\n多对多关系是棘手的一种；我们需要了解这类关系是如何构建的。通常，我们将构建两个需要多对多关系的实体，创建一个将纯粹用于连接前两个实体的实体，然后在此实体（创建用于连接两个单独的一对多关系）和两个实体（最先创建）之间分别映射一对多关系：\n\
  \n```\npublic class Post\n{\n    public int Id { get; set; }\n    public string\
  \ Title { get; set; }\n    public string Content { get; set; }\n    public string\
  \ Summary { get; set; }\n    public DateTime PublishedDateTime { get; set; }\n \
  \   public string Url { get; set; }\n    public long VisitorCount { get; set; }\n\
  \    public DateTime CreatedAt { get; set; }\n    public DateTime ModifiedAt { get;\
  \ set; }\n    public int CreatedBy { get; set; }\n    public int ModifiedBy { get;\
  \ set; }\n    public int BlogId { get; set; }\n    public Blog Blog { get; set;\
  \ }\n    public int AuthorId { get; set; }\n    public User Author { get; set; }\n\
  \    public int CategoryId { get; set; }\n    public Category Category { get; set;\
  \ }\n    public ICollection<TagPost> TagPosts { get; set; }\n    public ICollection<Comment>\
  \ Comments { get; set; }\n}\n\npublic class Tag\n{\n    public int Id { get; set;\
  \ }\n    public string Name { get; set; }\n    public DateTime CreatedAt { get;\
  \ set; }\n    public DateTime ModifiedAt { get; set; }\n    public int CreatedBy\
  \ { get; set; }\n    public int ModifiedBy { get; set; }\n    public ICollection<TagPost>\
  \ TagPosts { get; set; }\n}\n\npublic class TagPost\n{\n    public int Id { get;\
  \ set; }\n    public DateTime CreatedAt { get; set; }\n    public DateTime ModifiedAt\
  \ { get; set; }\n    public int CreatedBy { get; set; }\n    public int ModifiedBy\
  \ { get; set; }\n    public int TagId { get; set; }\n    public Tag Tag { get; set;\
  \ }\n    public int PostId { get; set; }\n    public Post Post { get; set; }\n}\n\
  ```\n\nPost 和 Tag 实体需要多对多关系，为此创建了 TagPost 实体，其唯一工作就是连接 Post 和 Tag 实体。\n\n下图说明了通过\
  \ TagPost 实体在 Post 和 Tag 实体之间的多对多关系：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_109_0.png)\n\
  \nTag 实体表图显示如下\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_110_0.png)\n\n将包含 PostId\
  \ 和 TagId 以形成多对多关系的 TagPost 实体显示如下\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_110_1.png)\n\
  \n为了在 Post 和 Tag 实体之间建立多对多关系，我们创建了一个 TagPost（一种联结表）实体，纯粹是为了让 EF 能够连接 Post 和 Tag\
  \ 实体。这是通过在 Tag 和 TagPost 以及 Post 和 TagPost 实体之间建立一对多关系来实现的。\n\n### 使用 Fluent API\
  \ 构建多对多关系\n\n我们应该在 Fluent API 中配置关系，即在 Tag 和 TagPost 以及 Post 和 TagPost 实体之间建立两个不同的一对多关系。HasForeignKey\
  \ 方法不需要是泛型的，因为一对多关系不需要显式标记从属类型：\n\nTag 和 Post 实体之间的多对多关系需要以下配置：\n\n```\nprotected\
  \ override void OnModelCreating(ModelBuilder modelBuilder)\n{\n    modelBuilder.Entity<Blog>().ToTable(\"\
  Blog\");\n    modelBuilder.Entity<Post>().ToTable(\"Post\");\n    modelBuilder.Entity<User>()\n\
  \        .ToTable(\"User\")\n        .HasOne(x=>x.Address)\n        .WithOne(x=>x.User)\n\
  \        .HasForeignKey<Address>(x=>x.UserId);\n    modelBuilder.Entity<Address>().ToTable(\"\
  Address\");\n    modelBuilder.Entity<Tag>().ToTable(\"Tag\");\n    modelBuilder.Entity<TagPost>()\n\
  \        .ToTable(\"TagPost\")\n        .HasOne(x => x.Tag)\n        .WithMany(x\
  \ => x.TagPosts)\n        .HasForeignKey(x => x.TagId);\n    modelBuilder.Entity<TagPost>()\n\
  \        .ToTable(\"TagPost\")\n        .HasOne(x => x.Post)\n        .WithMany(x\
  \ => x.TagPosts)\n        .HasForeignKey(x => x.PostId);\n}\n```\n\nFluent API 配置将为我们提供预期的关系，这反映在以下数据库图中。多对多关系现在已通过\
  \ TagPost 实体在 Post 和 Tag 实体之间建立：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_112_0.png)\n\
  \n我们已在本节学习了多对多关系。让我们在下一节中探索更多关于 Fluent API 的内容。\n\n## Fluent API\n\n我们已经对 Fluent\
  \ API 有了初步了解，没有它，关系永远无法完成（在某些情况下是强制性的）。\n\n### 识别导航属性和反向导航\n\n我们在一对一和多对多关系中使用了 Fluent\
  \ API。我们将使用相同的方法来利用我们迄今为止看到的术语。HasOne 和 HasMany 方法允许我们识别从属实体中的导航属性，或简单地引用导航属性。\n\
  \n以下代码在 一对多关系中显式配置外键：\n\n```\nmodelBuilder.Entity<TagPost>()\n    .ToTable(\"TagPost\"\
  )\n    .HasOne(x => x.Tag)\n    .WithMany(x => x.TagPosts)\n    .HasForeignKey(x\
  \ => x.TagId);\n```\n\n在下图中，高亮显示的 TagId 是关系外键所必需的：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_113_0.png)\n\
  \n`HasOne` 方法标识 `TagPost` 实体中的 `Tag` 导航。`WithOne` 和 `WithMany` 方法允许我们识别主实体中的反向导航，或简单地集合导航属性。\n\
  \n下面显示了反向导航属性配置所需的代码：\n\n```\nmodelBuilder.Entity<TagPost>()\n    .ToTable(\"TagPost\"\
  )\n    .HasOne(x => x.Tag)\n    .WithMany(x => x.TagPosts)\n    .HasForeignKey(x\
  \ => x.TagId);\n```\n\n下图说明我们需要反向导航属性来建立关系：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_114_0.png)\n\
  \n`HasOne` 方法标识 `Tag` 实体中的 `TagPosts` 反向导航。\n\n我们已经从多对多关系中看到了 Fluent API 的识别和使用；让我们使用相同的方法来识别术语中的用法。\n\
  \n### 识别单个导航属性\n\n在单个导航属性中，我们永远不会在从属实体中拥有导航属性，这使得我们很难识别引用导航属性。这就是 `HasMany` 发挥作用的地方，帮助我们识别关系：\n\
  \n\n\n以下代码包含实体及其单导航属性的配置，其中 Blog 实体包含导航属性，并且配置使用 HasOne() 来完成关系：\n\n```csharp\n\
  public class Blog\n{\n    public int Id { get; set; }\n    public string Url { get;\
  \ set; }\n    public ICollection<Post> Posts { get; set; }\n}\npublic class Post\n\
  {\n    public int Id { get; set; }\n    public string Title { get; set; }\n    public\
  \ string Content { get; set; }\n    public DateTime PublishedDateTime { get; set;\
  \ }\n    // Foreign key \"BlogId\" and navigation property \"Blog\" was\n    removed\
  \ here\n}\n\n// onModelCreating method implementation inside context class\nmodelBuilder.Entity<Blog>()\n\
  \    .HasMany(x => x.Posts)\n    .WithOne()\n```\n\n以下图表说明了使用单导航属性在实体之间建立的关系：\n\n\
  ![](img/17e01f90db603e72c0f0c6a7dce8920c_115_0.png)\n\n我们已将外键修改为 `SomeBlogId` 并针对\
  \ `Post` 实体的 `Blog` 导航属性进行配置，并且使用 Fluent API 进行配置。\n\n## 使用主鍵构建关系\n\n如果主鍵是主键，则不需要\
  \ Fluent API 配置，但如果我们必须针对备用键应用关系怎么办？那么，我们需要 Fluent API 来完成配置。我们可以通过我们提供的 `HasPrincipalKey`\
  \ Fluent API 方法来实现同样的目的：\n\n使用主鍵而不是主键在实体和配置中进行自定义外键映射所需的代码显示如下：\n\n```csharp\npublic\
  \ class Blog\n{\n    public int Id { get; set; }\n    public string Url { get; set;\
  \ }\n    public ICollection<Post> Posts { get; set; }\n}\npublic class Post\n{\n\
  \    public int Id { get; set; }\n    public string Title { get; set; }\n    public\
  \ string Content { get; set; }\n    public DateTime PublishedDateTime { get; set;\
  \ }\n    public int SomeBlogId { get; set; }\n    [ForeignKey(\"SomeBlogId\")]\n\
  \    public Blog Blog { get; set; }\n}\n\n// onModelCreating method implementation\
  \ inside context class\nmodelBuilder.Entity<Post>()\n    .HasOne(x => x.Blog)\n\
  \    .WithMany(x => x.Posts)\n    .HasForeignKey(x => x.SomeBlogId)\n    .HasPrincipalKey(x\
  \ => x.Url); // not a valid\n        relationship in real time\n```\n\n我们已使用修改后的外键\
  \ `BlogSomeId` 针对 `Blog` 中的备用键 `Url` 创建了一个关系。这是通过 `HasPrincipalKey` Fluent API 方法实现的。\n\
  \n## 使用 IsRequired 方法构建关系\n\n我们可以使用相同的 Fluent API 和 IsRequired 方法将关系配置为必需或可选。我们可以使用相同的方法来定义关系是强制性的还是可选的：\n\
  \n```csharp\npublic class Blog\n{\n    public int Id { get; set; }\n    public string\
  \ Url { get; set; }\n    public ICollection<Post> Posts { get; set; }\n}\npublic\
  \ class Post\n{\n    public int Id { get; set; }\n    public string Title { get;\
  \ set; }\n    public string Content { get; set; }\n    public DateTime PublishedDateTime\
  \ { get; set; }\n    public int BlogSomeId { get; set; }\n    [ForeignKey(\"BlogSomeId\"\
  )]\n    public Blog Blog { get; set; }\n}\n\n// onModelCreating method implementation\
  \ inside context class\nmodelBuilder.Entity<Blog>()\n    .Property(x => x.Url)\n\
  \    .IsRequired();\nmodelBuilder.Entity<Post>()\n    .HasOne(x => x.Blog)\n   \
  \ .WithMany(x => x.Posts)\n    .IsRequired();\n```\n\n第一个配置将 Blog 实体上的 Url 属性应用为强制/必需字段，第二个配置强制关系为必需。\n\
  \n## 级联删除\n\n我们到目前为止创建的关系允许我们使用关系构建数据，并且删除机制也需要配置。如果我们尝试删除主实体行会发生什么？这会对依赖元素没有任何作用还是也会删除它们？让我们看看执行这些操作的不同可用方式：\n\
  \n- **Cascade:** 如果我们删除主实体行，则依赖实体行也会被删除\n  以下代码将配置为如果删除主行，则依赖行也会被删除：\n\n```csharp\n\
  public class Blog\n{\n    public int Id { get; set; }\n    public string Url { get;\
  \ set; }\n    public ICollection<Post> Posts { get; set; }\n}\npublic class Post\n\
  {\n    public int Id { get; set; }\n    public string Title { get; set; }\n    public\
  \ string Content { get; set; }\n    public DateTime PublishedDateTime { get; set;\
  \ }\n    public int BlogSomeId { get; set; }\n    [ForeignKey(\"BlogSomeId\")]\n\
  \    public Blog Blog { get; set; }\n}\n\n// onModelCreating method implementation\
  \ inside context class\nmodelBuilder.Entity<Post>()\n    .HasOne(x => x.Blog)\n\
  \    .WithMany(x => x.Posts)\n    .OnDelete(DeleteBehavior.Cascade);\n```\n\n这强制\
  \ EF 在删除 Blog 元素时删除 Post 元素。\n\n- **SetNull:** 如果我们删除主实体行，则依赖实体行的外键将被设置为 null 值：\n\
  \  以下代码将配置为如果删除主行，则依赖行将被设置为 null：\n\n```csharp\npublic class Blog\n{\n    public\
  \ int Id { get; set; }\n    public string Url { get; set; }\n    public ICollection<Post>\
  \ Posts { get; set; }\n}\npublic class Post\n{\n    public int Id { get; set; }\n\
  \    public string Title { get; set; }\n    public string Content { get; set; }\n\
  \    public DateTime PublishedDateTime { get; set; }\n    public int BlogSomeId\
  \ { get; set; }\n    [ForeignKey(\"BlogSomeId\")]\n    public Blog Blog { get; set;\
  \ }\n}\n\n// onModelCreating method implementation inside context class\nmodelBuilder.Entity<Post>()\n\
  \    .HasOne(x => x.Blog)\n    .WithMany(x => x.Posts)\n    .OnDelete(DeleteBehavior.SetNull);\n\
  ```\n\n这强制 EF 在删除 `Blog` 元素时将 `Post` 实体元素的 `Blog` 列设置为 null 值：\n\n- **Restrict:**\
  \ 如果我们删除主实体行，则依赖实体的行保持不变：\n  以下代码将配置为即使删除主行，依赖行也会保留其值：\n\n```csharp\npublic class\
  \ Blog\n{\n    public int Id { get; set; }\n    public string Url { get; set; }\n\
  \    public ICollection<Post> Posts { get; set; }\n}\npublic class Post\n{\n   \
  \ public int Id { get; set; }\n    public string Title { get; set; }\n    public\
  \ string Content { get; set; }\n    public DateTime PublishedDateTime { get; set;\
  \ }\n    public int BlogSomeId { get; set; }\n    [ForeignKey(\"BlogSomeId\")]\n\
  \    public Blog Blog { get; set; }\n}\n\n// onModelCreating method implementation\
  \ inside context class\nmodelBuilder.Entity<Post>()\n```\n\n它可以通过卸载项目文件并手动在 `.csproj`\
  \ 文件内容中包含 `DotNetCliToolReference` 代码块，然后重新加载项目并恢复 NuGet 包来解决。这应该可以解决与包相关的问题：\n\n\
  ```xml\n<ItemGroup>\n    <DotNetCliToolReference Include=\n        \"Microsoft.EntityFrameworkCore.Tools.DotNet\"\
  \ Version=\"2.0.1\" />\n</ItemGroup>\n```\n\n转到 `Developer Command Prompt for VS\
  \ 2017`（在开始菜单中搜索该命令），并执行以下 .NET CLI 命令以添加迁移：\n\n```bash\ndotnet ef migrations add\n\
  ```\n\n以下屏幕截图添加了迁移 \"Models with relationship\"，并且执行日志显示 `Done`。要撤消此操作，请使用 `ef migrations\
  \ remove`，这意味着数据迁移成功：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_122_0.png)\n\n\
  数据库更新可以使用以下 .NET CLI 命令执行：\n\n```bash\ndotnet ef database update\n```\n\n以下屏幕截图确认数据库已成功更新，并显示\
