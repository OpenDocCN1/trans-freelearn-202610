  \ Post 表中可用的 .NET Core 条目是否匹配。下面的截图确认了帖子条目仅来自 .NET Core 博客：\n"
- "# 8 查询即所需 – 查询对象模式\n\n## 查询即所需 – 查询对象模式\n\n我们已经介绍了 Entity Framework（EF）中的原生 SQL\
  \ 查询执行，在少数有效场景下，这可能是为了控制查询或提高性能所必需的。我们看到了一个简单的 SQL 查询、它可能带来的安全威胁，以及相应的解决方案。然后，我们介绍了在\
  \ Entity Framework 中执行原生 SQL 查询的不同方式。最后，我们创建了一个扩展方法，用于在没有 `DbSet` 和 POCO 模型的情况下执行原生\
  \ SQL 查询。\n\n让我们讨论一下当前在对象关系映射（ORM）层中使用的仓储模式，审视其设计问题，我们将看到查询对象模式如何帮助我们高效地实现这一点。本章将讨论以下设计问题：\n\
  \n- 仓储模式最初是为了抽象 ORM 层，但最近仓储中包含的方法急剧增加，这违背了它的初衷：\n  - 简化数据访问层的必要性催生了查询对象模式\n- 我们一直在仓储中创建多个方法，这些方法仅因查询性质不同而有所区别：\n\
  \  - 查询对象模式概括并改进了仓储方法\n- 仅靠查询不足以简化数据访问层：\n  - 将查询与通用命令组合，可将该模式扩展到所有 CRUD 操作\n- 查询对象模式仍然不允许用户动态扩展查询：\n\
  \  - 简单的查询对象在查询内部执行实现，而表达式树将实现委托给用户，从而为用户提供了所需的可扩展性\n\n理想情况下，我们将涵盖以下主题：\n\n- 查询对象简介\n\
  - 使用查询对象模式改进仓储\n- 将查询与命令组合\n- 使用表达式树增强查询\n\n### 查询对象简介\n\n查询对象模式可以通过引入查询类型并通过该类型处理查询来整合，而不是直接处理查询。请按照以下步骤将该模式整合到任何应用程序中：\n\
  \n1. 创建一个查询类型，其中包含查询所需的字段，如下所示：\n   - 拥有一个参数化构造函数，强制只有在提供了必填字段值时才创建类型实例\n   - 查询所需的必填字段必须包含在构造函数中\n\
  \n让我们创建一个按 Id 筛选帖子的查询类型；我们需要一个具有 Id 字段和填充 Id 字段的构造函数的查询类型：\n\n```csharp\npublic\
  \ class PostDetailQuery\n{\n    public PostDetailQuery(int? id)\n    {\n       \
  \ this.Id = id;\n    }\n    public int? Id { get; set; }\n}\n```\n\n查询类型已准备好实现；让我们继续下一步，创建处理器。\n\
  \n2. 创建一个查询处理器接口，强制该类型处理查询；在接口中创建 `Handle()` 方法，强制类型实现它。\n\n处理器必须分两步创建：首先，应创建一个接口，其中包含处理执行所需的约定：\n\
  \n```csharp\npublic interface IPostDetailQueryHandler\n{\n    Task<Post> Handle(PostDetailQuery\
  \ query);\n}\n```\n\n约定已就绪；让我们使用具体的查询处理器类型来创建实现。\n\n3. 创建一个使用数据上下文执行查询的查询处理器类型，通过构造函数注入数据库上下文\n\
  \n`BlogContext` 数据库上下文通过构造函数注入到处理器中，如下所示：\n\n```csharp\npublic class PostDetailQueryHandler\
  \ : IPostDetailQueryHandler\n{\n    private readonly BlogContext _context;\n   \
  \ public PostDetailQueryHandler(BlogContext context)\n    {\n        _context =\
  \ context;\n    }\n}\n```\n\n数据上下文现在可用；让我们使用查询对象的上下文来执行查询：\n\n- 使用数据上下文通过实际查询实现\
  \ `Handle()`\n\n查询处理器实现使用了之前创建的查询类型，数据上下文利用查询对象中可用的数据创建筛选器并执行查询：\n\n```csharp\n\
  public class PostDetailQueryHandler : IPostDetailQueryHandler\n{\n    // Code removed\
  \ for brevity\n    public async Task<Post> Handle(PostDetailQuery query)\n    {\n\
  \        return await _context.Posts\n            .Include(p => p.Author)\n    \
  \        .Include(p => p.Blog)\n            .Include(p => p.Category)\n        \
  \    .FirstOrDefaultAsync(x => x.Id == query.Id);\n    }\n}\n```\n\n现在查询处理器实现已完成，但应用程序中尚未在任何地方使用它。让我们看看如何在控制器中使用它。\n\
  \n4. 在控制器中使用查询处理器，通过构造函数注入查询处理器\n\nPostDetailQueryHandler 类型通过构造函数，使用 .NET Core\
  \ 支持的依赖注入（正如我们之前对 BlogContext 所做的那样），针对 IPostDetailQueryHandler 接口进行注入：\n\n```csharp\n\
  public class PostsController : Controller\n{\n    private readonly BlogContext _context;\n\
  \    private readonly IPostDetailQueryHandler\n        _postDetailQueryHandler;\n\
  \n    public PostsController(BlogContext context,\n        IPostDetailQueryHandler\
  \ postDetailQueryHandler)\n    {\n        _context = context;\n        _postDetailQueryHandler\
  \ = postDetailQueryHandler;\n    }\n    // Code removed for brevity\n}\n```\n\n\
  查询处理器现在已在构造函数中可用；让我们使用它来执行所需操作。找到（控制器中）需要该查询的操作，并使用查询处理器来执行。\n\n控制器中的 Details 操作需要基于帖子\
  \ Id 执行查询，因此让我们使用为此需求创建的 PostDetailQuery 来使用该查询。以下代码将在控制器中使用查询处理器：\n\n```csharp\n\
  public async Task<IActionResult> Details(int? id)\n{\n    // Code removed for brevity\n\
  \    var post = await _postDetailQueryHandler.Handle(new\n        PostDetailQuery(id));\n\
  \    // Code removed for brevity\n}\n```\n\n前面的实现将根据传递给查询对象的 id 触发帖子筛选，从而将核心实现封装到查询类型中，满足查询对象模式：\n\
  \n- 最后，不要忘记在 `Startup.cs` 的 `ConfigureServices` 方法中支持依赖注入中的构造函数执行：\n\n```csharp\n\
  services.AddScoped<IPostDetailQueryHandler, PostDetailQueryHandler>();\n```\n\n\
  我们已经了解了如何创建查询对象和处理器，以及如何在控制器中使用它们。在*第 9 章，故障安全机制 – 事务*中，我们将了解如何通过使用查询对象来利用或改进仓储。\n\
  \n### 使用查询对象模式改进仓储\n\n我们需要一个前提来解释查询对象模式的必要性，所以让我们创建这样一个需求，然后我们将研究查询对象。我们将在系统中为博客创建一个仓储，我们将看到它为应用程序带来的优点和缺点，最后，我们将了解什么是查询对象，以及它们如何帮助我们改进仓储。\n\
  \n### 仓储简介\n\n我们一直在控制器中直接使用数据上下文执行 CRUD 操作；我们可以先在应用程序中引入仓储，之后，可以在仓储中实现查询对象。\n\n\
  让我们从创建仓储所需的接口开始。它包括基本检索、业务特定检索以及其余的 CRUD 操作。以下代码包含 `IPostRepository` 所需的方法：\n\n\
  ```csharp\npublic interface IPostRepository\n{\n    IEnumerable<Post> GetAllPosts();\n\
  }\n```\n\n\n```csharp\nTask<IEnumerable<Post>> GetAllPostsAsync();\nPost GetPostById(int?\
  \ id, bool includeData = true);\nTask<Post> GetPostByIdAsync(int? id, bool includeData\
  \ = true);\nIEnumerable<Post> FindPostByTitle(string title);\nIEnumerable<Post>\
  \ FindPostByAuthor(string author);\nIEnumerable<Post> FindPostByPublishedYear(int\
  \ year);\nIEnumerable<Post> FindPostByHighestVisitors();\nIEnumerable<Post> FindPostByCategory(string\
  \ category);\nIEnumerable<Post> FindPost(string keyword, int pageCount,\n    int\
  \ pageSize);\nint AddPost(Post item);\nTask<int> AddPostAsync(Post item);\nint UpdatePost(Post\
  \ item);\nTask<int> UpdatePostAsync(Post item);\nint DeletePost(int? id);\nTask<int>\
  \ DeletePostAsync(int? id);\n}\n```\n\n仓库实现首先从数据库上下文注入开始，在本例中是 `BlogContext`。接着，接口实现从\
  \ `FindPost` 开始，它接收 `keyword`、`pageCount` 和 `pageSize`，这三个参数被 LINQ 查询用于过滤帖子。`keyword`\
  \ 被用作对 `Post` 实体中所有可用字段进行的通配符搜索：\n\n```csharp\npublic class PostRepository : IPostRepository\n\
  {\n    private readonly BlogContext _context;\n    public PostRepository(BlogContext\
  \ context)\n    {\n        _context = context;\n    }\n\n    public IEnumerable<Post>\
  \ FindPost(string keyword, int pageCount,\n        int pageSize)\n    {\n      \
  \  return _context.Posts\n            .Where(x =>\n                x.Title.ToLower().Contains(keyword.ToLower())\n\
  \                || x.Blog.Title.ToLower().Contains(keyword.ToLower())\n       \
  \         || x.Blog.Subtitle.ToLower().Contains(keyword.ToLower())\n           \
  \     || x.Category.Name.ToLower().Contains(keyword.ToLower())\n               \
  \ || x.Content.ToLower().Contains(keyword.ToLower())\n                || x.Summary.ToLower().Contains(keyword.ToLower())\n\
  \                || x.Author.Username.ToLower().Contains(keyword.ToLower())\n  \
  \              || x.Url.ToLower().Contains(keyword.ToLower()))\n            .Skip(pageCount\
  \ - 1).Take(pageSize);\n    }\n}\n```\n\n我们可以通过一个练习来涵盖控制器所需的其他实现（以及按类别、作者等筛选帖子的新操作），因为我们大多将控制器实现移植到仓库方法中；例如，`Get`\
  \ 操作的动作实现就归入仓库的 `GetAllPosts` 方法。在本章中，由于我们正在处理一个需要进入下一节的练习，我们也会将解决方案收进去，以确保在进入下一节之前所有内容都已实现。\n\
  \n## 仓库练习的解决方案\n\n我们可以为应用程序设计以下 URI，用于筛选帖子。我们确实需要提供按类别、作者、访问量等筛选帖子的功能，而这些 URI 应以\
  \ JSON 格式返回响应，供 AJAX 调用使用。以下操作将提供可供 AJAX 调用使用的 JSON 数据：\n\n- `Posts/FindPostByAuthor`\n\
  - `Posts/FindPostByCategory`\n- `Posts/FindPostByHighestVisitors`\n- `Posts/FindPostByPublishedYear`\n\
  - `Posts/FindPostByTitle`\n\n让我们先构建这些 JSON 端点，然后再将现有操作移植到仓库中。\n\n要实现由 JSON 驱动的 HTTP\
  \ 操作，需要执行以下步骤：\n\n1. 设置合适的 HTTP 谓词，在本例中为 `[HttpGet]`。\n2. 使用 `[Produces(\"application/json\"\
  )]` 将返回类型设置为 JSON。\n3. 方法实现非常直接：\n   1. 定义具有合适返回类型和输入参数的控制器操作。\n   2. 使用输入参数筛选数据上下文，并返回筛选后的数据。\n\
  4. 该操作的代码如下所示：\n\n```csharp\n[HttpGet]\n[Produces(\"application/json\")]\npublic\
  \ IEnumerable<Post> FindPostByAuthor(string author)\n{\n    return _context.Posts\n\
  \        .Where(x => x.Author.Username.ToLower().\n            Contains(author.ToLower()));\n\
  }\n```\n\n仅此实现并不足够，因为我们偏离了常规的 MVC 内容协商。此操作要求我们返回 JSON，因此需要配置服务以支持这一点。此外，我们将忽略 `ReferenceLoopHandling`，以避免响应中包含不必要的数据。\n\
  \n在 `Startup.cs` 中，在 `ConfigureServices` 方法内添加以下配置：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_211_0.png)\n\
  \n```csharp\nservices.AddMvc().AddJsonOptions(options =>\n{\n    options.SerializerSettings.ContractResolver\
  \ =\n        new DefaultContractResolver();\n    options.SerializerSettings.ReferenceLoopHandling\
  \ =\n        Newtonsoft.Json.ReferenceLoopHandling.Ignore;\n});\n```\n\n其余 URI 也需要进行类似的更改；我们把它作为一个练习来做：\n\
  \n- `Posts/FindPostByCategory`\n- `Posts/FindPostByHighestVisitors`\n- `Posts/FindPostByPublishedYear`\n\
  - `Posts/FindPostByTitle`\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_211_1.png)\n\
  \n其余 JSON 操作以及需要移植到仓库的其他操作都应遵循相同的模式。此练习的解决方案可在以下 Git 仓库中获取：https://goo.gl/DGBZMK\n\
  \n仓库实现现在要完整得多。在下一节中，我们将开始把查询对象模式整合到仓库中。\n\n## 将查询对象模式整合到仓库中\n\n在本章的*“查询对象简介”*一节中，我们探讨过的查询对象模式需要整合到仓库中。既然我们知道创建查询对象需要遵循的步骤，那就开始创建所需的类型吧。\n\
  \n### 在仓库中支持列表查询对象\n\n我们已经见过 `GetAllPosts` 方法，它为所有实现包含了相关数据。由于我们正在创建一个可在多处使用的公共查询，因此需要将其作为筛选器包含在\
  \ `GetAllPostsQuery` 对象中：\n\n```csharp\npublic class GetAllPostsQuery\n{\n    public\
  \ GetAllPostsQuery(bool includeData)\n    {\n        this.IncludeData = includeData;\n\
  \    }\n    public bool IncludeData { get; set; }\n}\n```\n\n`GetAllPostsQuery`\
  \ 仅使用类型中的 `IncludeData` 筛选器，它不会从结果集中筛选任何数据，而只是排除/包含相关数据。以下代码将创建一个协定，强制使用者实现处理方法：\n\
  \n```csharp\npublic interface IPostQueryHandler<T> where T : class\n{\n    IEnumerable<Post>\
  \ Handle(T query);\n    Task<IEnumerable<Post>> HandleAsync(T query);\n}\n```\n\n\
  这个泛型查询处理器接口现在支持同步和异步两种操作，返回帖子列表。`GetAllPostsQueryHandler` 将执行具体的实现，以同步和异步方式生成帖子列表，如下面的代码所示：\n\
  \n```csharp\npublic class GetAllPostsQueryHandler :\n    IPostQueryHandler<GetAllPostsQuery>\n\
  {\n    private readonly BlogContext _context;\n    public GetAllPostsQueryHandler(BlogContext\
  \ context)\n    {\n        this._context = context;\n    }\n\n    public IEnumerable<Post>\
  \ Handle(GetAllPostsQuery query)\n    {\n        return query.IncludeData\n    \
  \        ? _context.Posts.Include(p =>\n                p.Author).Include(p => p.Blog).Include(p\
  \ => p.Category).ToList()\n            : _context.Posts.ToList();\n    }\n\n   \
  \ public async Task<IEnumerable<Post>>\n        HandleAsync(GetAllPostsQuery query)\n\
  \    {\n        return query.IncludeData\n            ? await _context.Posts.Include(p\
  \ => p.Author).Include(p\n                => p.Blog).Include(p => p.Category).ToListAsync()\n\
  \            : await _context.Posts.ToListAsync();\n    }\n}\n```\n\n`GetAllPostsQuery`\
  \ 使用这个泛型查询处理器来返回所有帖子，并决定是否包含相关数据。`IPostRepositoryWithQueries` 将通过 `Get()` 和 `GetAsync()`\
  \ 方法创建一个协定，用于检索帖子列表，代码如下：\n\n```csharp\npublic interface IPostRepositoryWithQueries\n\
  {\n    IEnumerable<Post> Get<T>(BlogContext context, T query)\n        where T :\
  \ class;\n    Task<IEnumerable<Post>> GetAsync<T>(BlogContext context,\n       \
  \ T query) where T : class;\n}\n```\n\n创建 `PostRepositoryWithQueries` 仓库是为了容纳查询对象，通过泛型方法接受任意查询类型并执行，从而减少之前在仓库中创建的多个方法。该仓库的具体实现如下所示，它会根据查询类型委托查询执行：\n\
  \n```csharp\npublic class PostRepositoryWithQueries : IPostRepositoryWithQueries\n\
  {\n    private readonly BlogContext _context;\n\n    public PostRepositoryWithQueries(BlogContext\
  \ context)\n    {\n        _context = context;\n    }\n\n    public IEnumerable<Post>\
  \ Get<T>(BlogContext context, T query)\n        where T : class\n```\n\n\n\n```csharp\n\
  new GetAllPostsQuery(true));\n}\n\n// Code removed for brevity\n}\n```\n\nWe can\
  \ see the controller started using the new repository through dependency injection\
  \ and corresponding to the Get action being called using the appropriate query object.\
  \ In the preceding scenario, we have been using the GetAllPostsQuery object that\
  \ was passed on to the GetAsync method of the new repository. In the next section,\
  \ let's explore the implementation required to return an individual post object\
  \ from the repository.\n\n## Single query object support in the repository\n\nWe\
  \ have seen how a list of objects was returned from the repository in a generic\
  \ fashion. Let's have a provision to return a single object from the repository:\n\
  \n```csharp\npublic interface IPostRepositoryWithQueries\n{\n    // Code removed\
  \ for brevity\n    Post GetSingle<T>(T query) where T : class;\n    Task<Post> GetSingleAsync<T>(T\
  \ query) where T : class;\n}\n```\n\nThe preceding code adds synchronous and asynchronous\
  \ methods to return a single Post object from the repository, still retaining the\
  \ generic implementation since it could be used by multiple query objects that might\
  \ return individual Post objects:\n\n```csharp\npublic class GetPostByIdQuery\n\
  {\n    public GetPostByIdQuery(int? id, bool includeData)\n    {\n        this.Id\
  \ = id;\n        this.IncludeData = includeData;\n    }\n\n    public int? Id {\
  \ get; set; }\n    public bool IncludeData { get; set; }\n}\n```\n\nThe query type\
  \ we have created now has one more filter by `Id`, apart from retaining `IncludeData`\
  \ from the previous query type. The handler interface required to return a single\
  \ `Post` type is defined below:\n\n```csharp\npublic interface IPostQuerySingleHandler<T>\
  \ where T : class\n{\n    Post Handle(T query);\n    Task<Post> HandleAsync(T query);\n\
  }\n```\n\nWe have a corresponding generic query handler to handle a single object\
  \ from the handler implementation, which has synchronous and asynchronous support\
  \ as well. The following code provides concrete implementation required for the\
  \ `GetPostByIdQueryHandler` to filter Posts by identifier:\n\n```csharp\npublic\
  \ class GetPostByIdQueryHandler :\n    IPostQuerySingleHandler<GetPostByIdQuery>\n\
  {\n    private readonly BlogContext _context;\n\n    public GetPostByIdQueryHandler(BlogContext\
  \ context)\n    {\n        this._context = context;\n    }\n\n    public Post Handle(GetPostByIdQuery\
  \ query)\n    {\n        return query.IncludeData\n            ? _context.Posts.Include(p\
  \ => p.Author)\n                .Include(p => p.Blog)\n                .Include(p\
  \ => p.Category).SingleOrDefault(x =>\n                    x.Id.Equals(query.Id))\n\
  \            : _context.Posts\n                .SingleOrDefault(x => x.Id.Equals(query.Id));\n\
  \    }\n\n    public async Task<Post> HandleAsync(GetPostByIdQuery query)\n    {\n\
  \        return query.IncludeData\n            ? await _context.Posts.Include(p\
  \ => p.Author)\n                .Include(p => p.Blog)\n                .Include(p\
  \ => p.Category).SingleOrDefaultAsync(x =>\n                    x.Id.Equals(query.Id))\n\
  \            : await _context.Posts\n                .SingleOrDefaultAsync(x =>\
  \ x.Id.Equals(query.Id));\n    }\n}\n```\n\nThe query handler now ports the filter\
  \ by id implementation to the handler; additionally, it includes/excludes related\
  \ data based on the `IncludeData` filter:\n\n```csharp\npublic class PostRepositoryWithQueries\
