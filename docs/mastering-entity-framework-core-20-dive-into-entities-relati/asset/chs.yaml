  \ (int tagId in TagIds)\n            {\n                Context.Add(new TagPost\n\
  \                {\n                    TagId = tagId,\n                    Post\
  \ = post\n                });\n            }\n            returnValue = await Context.SaveChangesAsync();\n\
  \n            transaction.Commit();\n        }\n        return returnValue;\n  \
  \  }\n```\n\n同样，事务也支持 Update 和 Delete 操作；相关代码如下所示：\n\n```csharp\npublic class UpdatePostCommand\
