  数据库获胜 282\n客户端获胜 283\n用户自定义特定解决 284\n应用悲观并发 287\n\n## 前言\n\n能够创建和维护面向数据的应用程序已成为现代编程中的关键因素。这就是微软推出\
  \ Entity Framework (EF) 的原因，以便架构师在编写高效且可维护的应用程序代码的同时优化存储需求。本书是一本全面的指南，将向您展示如何利用\
  \ EF 的强大功能构建高效的 .NET Core 应用程序。它不仅教授 EF Core 的所有基础知识，还演示了如何实际使用它，以便您可以在软件开发中实现它。\n\
  \n本书分为三个模块。第一个模块侧重于构建实体和关系。在这里，您还将学习不同的映射技术，这将帮助您选择最适合您应用程序设计的映射技术。一旦您理解了 EF 的基础知识，您将进入第二模块学习验证和查询。它还将教您如何执行原始\
  \ SQL 查询并扩展 EF 以利用查询对象，使用查询对象模式。书籍的最后一个模块侧重于性能优化和管理应用程序的安全性。您将学习如何使用并发令牌实现容错机制。本书还详细探讨了行级安全和多租户数据库。\n\
  \n到本书结束时，您将熟练地在 .NET Core 应用程序上实现 EF。\n\n### 本书涵盖内容\n\n第1章，*入门 – Entity Framework\
  \ Core 简介*，教您如何在 .NET Core 应用程序中安装/配置 Entity Framework Core。它指导我们执行 CRUD（创建/读取/更新/删除）操作。\n\
  \n第2章，*反向操作 – 数据库优先方法*，解释了使用 EF Core 进行逆向工程和现有数据库的方法。它指导我们执行迁移，并帮助我们在迁移期间保留不会丢失的模型更改。\n\
  \n第3章，*关系 – 术语和约定*，提供有关实体、键和属性相关的关系术语的知识。我们还将看到与关系相关的不同约定。\n\n第4章，*构建关系 – 理解映射*，帮助您探索多种关系技术并解释如何在应用程序设计中利用它们。我们还将探讨如何使用\
  \ Fluent API 创建关系。\n\n第5章，*了解验证 – 探索内置验证*，教您框架中验证的工作方式，探索内置验证，展示它们应如何配置，涵盖每个验证对用户期望的模式，并展示\
  \ MVC 引擎如何呈现验证错误。\n\n第6章，*自救 – 为实体加固*，帮助我们添加验证，解释为什么我们需要在客户端和服务器端都进行验证，并展示如何实现。它还介绍了自定义验证，以及如何为验证创建客户端逻辑和远程验证。\n\
  \n第7章，*原始操作 – 在 LINQ 中利用 SQL 查询*，教您如何执行原始 SQL 查询，同时教您如何执行参数化查询、与 LINQ 组合、最后在没有 DbSet\
  \ 或 POCO 对象的的情况下执行。\n\n第8章，*查询就是我们所需 – 查询对象模式*，帮助您理解查询对象模式，并扩展 EF 以利用查询对象。\n\n第9章，*容错机制\
  \ – 事务*，帮助您理解事务的现有行为，如何创建常规/跨上下文事务，以及如何使用外部 DBTransactions。\n\n第10章，*使其真实 – 处理并发*，详细阐述并发在\
  \ EF 中的连接方式以及如何处理它。它详细解释了并发令牌，并展示如何使用它创建容错机制。\n\n第11章，*性能 – 全在于执行时间*，教您如何通过正确利用框架、减少滥用等来提高\
  \ EF 的性能。\n\n第12章，*隔离 – 构建多租户数据库*，详细探讨行级安全和多租户数据库。\n\n### 阅读本书所需条件\n\n要使用本文，我们假设您熟悉\
  \ .NET Core 和 C#。\n\n\n\n\n\n要成功执行本书中的代码，您需要以下工具：\n\n- Visual Studio 2017 Express\n\
