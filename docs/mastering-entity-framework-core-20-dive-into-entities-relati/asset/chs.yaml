  \      parameterValues: rawSqlCommand.ParameterValues);\n        }\n    }\n\n  \
  \  public static async Task<RelationalDataReader>\n        ExecuteSqlQueryAsync(this\
  \ DatabaseFacade databaseFacade,\n        string sql,\n        CancellationToken\
  \ cancellationToken = default(CancellationToken),\n        params object[] parameters)\n\
  \    {\n        var concurrencyDetector =\n            databaseFacade.GetService<IConcurrencyDetector>();\n\
  \        using (concurrencyDetector.EnterCriticalSection())\n        {\n       \
  \     var rawSqlCommand = databaseFacade\n                .GetService<IRawSqlCommandBuilder>()\n\
  \                .Build(sql, parameters);\n\n            return await rawSqlCommand\n\
  \                .RelationalCommand\n```\n\n\n\n\n```csharp\n.ExecuteReaderAsync(\n\
  \    databaseFacade.GetService<IRelationalConnection>(),\n    parameterValues: rawSqlCommand.ParameterValues,\n\
  \    cancellationToken: cancellationToken);\n}\n}\n```\n\n下面的代码用法非常简单；它所做的只是将 ExecuteSqlQueryAsync\
  \ 扩展方法所需的 SQL 查询传递进去，并以 DbDataReader 的形式返回结果集：\n\n```csharp\nvar results = await\
  \ _context.Database\n    .ExecuteSqlQueryAsync(@\"select b.Title as BlogTitle, p.*\
  \ from\n        Post p join Blog b on b.Id = p.BlogId\");\nwhile (results.DbDataReader.Read())\n\
  {\n    Console.Write(\n        $\"Blog Title: '{results.DbDataReader[\"BlogTitle\"\
  ]}', \" +\n        $\"Post Title: '{results.DbDataReader[\"Title\"]}'\");\n}\n```\n\
  \n我们遍历了 DbDataReader，它会将帖子及其博客标题打印出来。下面的截图证明，使用我们自己的扩展方法，从 Entity Framework 的扁平\
