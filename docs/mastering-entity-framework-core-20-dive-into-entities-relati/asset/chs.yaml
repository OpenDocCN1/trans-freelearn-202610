  \n**制作协调员**\nDeepika Naik\n\n## 关于作者\n\n**Prabhakaran Anbazhagan** 是居住在印度金奈的微软解决方案架构师。他对编程的热爱始于为学校创建网站，也是从那刻起，这段永无止境的旅程开始了。在大学期间，他成为技术社团的秘书，再次创建网站，让研讨会实现自动化，等等。\n\
  \n他的职业生涯始于一家著名的产品型公司；他的知识得到了前辈们的尊重和认可，他们让他开发工具和自动化来磨炼才华。真是个幸运儿！人们很少有機會能够培养自己的天赋，但他得到了不少机会来精进技能，并成为一名解决方案架构师，成为多面手的同时，仍然是\
  \ .NET 领域的专家。\n\nPrabhakaran 拥有超过 12 年的 IT 经验，负责架构、设计和开发关键任务的桌面、Web 和移动应用程序。他在全栈开发方面经验丰富，涵盖\
  \ ASP.NET MVC、Web API、C#，以及移动开发领域中的 Swift、Objective-C、Blackberry Cascades、混合应用、SharePoint、JavaScript、jQuery\
  \ 和 MEAN.JS。\n\n> *我要感谢我亲爱的妻子 Girija，在我决定写这本书时一直陪伴在我身边。她牺牲了大量宝贵的时光，陪伴我走完这段旅程，我将这本书献给她。我还要感谢我可爱的孩子们，Venba\
  \ 和 Inba。在忙碌的周末，他们是我缓解压力的良药。我希望有一天他们会明白，为什么我忙着敲电脑，而不是陪他们玩耍。我要感谢我的父母，在我埋头写作时，他们与我的妻子一同照顾孩子。我的家人，包括我的姻亲，始终支持我撰写这本书，我由衷感激。*\n\
  \n## 关于审稿人\n\n**Jason De Oliveira** 是 MEGA International (http://www.mega.com) 的首席技术官，该公司位于法国巴黎，是一家提供业务转型、企业架构以及企业治理、风险和合规管理建模工具的软件公司。他是一位经验丰富的经理和高级解决方案架构师，在软件架构和企业架构方面拥有高超的技能。\n\
  \n他喜欢通过博客分享知识和经验，参加会议演讲，撰写技术书籍，在技术媒体上发表文章，作为 MCT 讲授软件课程，并在公司内指导同事。他经常与微软合作，经常可以在巴黎的微软技术中心\
  \ (MTC) 见到他。\n\n6 年多来，微软因他对微软社区的众多贡献，授予他 Microsoft® 最有价值专家（MVP C#/.NET）称号。微软希望用\
