  \n## 事务范围的限制\n\nEF Core 在涉及两个不同连接之间的多个数据上下文时存在一个限制。如果我们尝试执行当前代码，将会收到以下错误，提示消息：“指定的事务未与当前连接关联。只能使用与当前连接关联的事务”：\n\
  \n![](img/17e01f90db603e72c0f0c6a7dce8920c_251_1.png)\n\n为了支持不同数据上下文（甚至不同连接）之间的事务，需要显式的\
  \ `TransactionScope`；它在当前的 EF 中仍然不可用。\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_252_0.png)\n\
  \nEF 中可用的 `TransactionScope` 尚未得到 EF Core 的支持。它最初计划在 EF Core 2.0 中发布，但最终未包含在该框架中。现在，微软\
  \ EF 团队目前计划在 2018 年上半年推出 v2.1 框架，`System.Transactions` 应该会成为该版本的一部分。\n\n我们必须密切关注后续更新的发布；以下截图确认了事务将在\
  \ EF Core 2.1 版本中得到支持：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_252_1.png)\n\n\
  EF Core 事务范围的局限性绝不应阻碍我们的开发。因此，在下一节中，让我们创建自己的自定义 `TransactionScope`，它将实现相同的功能。\n\n\
  ## 自定义事务范围支持\n\n可以通过定义一个接口来创建事务范围，该接口要求我们实现 Commit() 或 Rollback()。自定义事务接口所需的契约如下代码所示：\n\
  \n```\npublic interface ITransactionScope\n{\n    void Commit();\n    void Rollback();\n\
  }\n```\n\n数据库事务被维护/记录在一个事务列表中，该列表随后用于对整组事务对象执行 Commit() 或 Rollback()。为了在 using 语句中使用\
  \ TransactionScope，我们还需要继承并实现 IDisposable。维护 Commit() 和 Rollback() 的自定义 TransactionScope\
  \ 实现如下代码所示：\n\n```\npublic class TransactionScope : ITransactionScope, IDisposable\n\
  {\n    // Flag: Has Dispose already been called?\n    private bool disposed = false;\n\
  \    public TransactionScope()\n    {\n        Transactions = new List<IDbContextTransaction>();\n\
  \    }\n    ~TransactionScope()\n    {\n        Dispose(false);\n    }\n    public\
  \ List<IDbContextTransaction> Transactions { get; set; }\n    public void Commit()\n\
  \    {\n        Transactions.ForEach(item =>\n        {\n            item.Commit();\n\
  \        });\n    }\n    public void Rollback()\n    {\n        Transactions.ForEach(item\
  \ =>\n        {\n            item.Rollback();\n        });\n    }\n    public void\
  \ Dispose()\n    {\n        Dispose(true);\n        GC.SuppressFinalize(this);\n\
  \    }\n    protected virtual void Dispose(bool disposing)\n    {\n        if (disposed)\n\
  \            return;\n        if (disposing)\n        {\n            // Free any\
  \ other managed objects here.\n            //\n        }\n        // Free any unmanaged\
  \ objects here.\n        //\n        disposed = true;\n    }\n}\n```\n\n我们已经了解了博客系统的文件实现/支持，我们可以开始创建一个允许执行持久化的仓库。目前，让我们在仓库中支持\
  \ Execute() 和 ExecuteAsync()，接口所需的契约定义如下代码所示：\n\n```\npublic interface IFileRepository\n\
  {\n    int Execute<T>(T command) where T : ICommandHandler<int>;\n    Task<int>\
  \ ExecuteAsync<T>(T command)\n        where T : ICommandHandlerAsync<int>;\n}\n\
  ```\n\nFileRepository 的具体实现将使用博客文件上下文，并调用为持久化操作创建的文件命令，控制器则使用该仓库来实现相应功能，如下代码所示：\n\
  \n```\npublic class FileRepository : IFileRepository\n{\n    private readonly BlogFilesContext\
  \ _context;\n    public FileRepository(BlogFilesContext context)\n    {\n      \
  \  _context = context;\n    }\n    public int Execute<T>(T command) where T : ICommandHandler<int>\n\
  \    {\n        return command.Handle();\n    }\n    public async Task<int> ExecuteAsync<T>(T\
  \ command)\n        where T : ICommandHandlerAsync<int>\n    {\n        return await\
  \ command.HandleAsync();\n    }\n}\n```\n\n只有在 ConfigureServices() 中为 FileRepository\
  \ 提供支持时，才能进行仓库注入，它会将具体对象注入到任何需要的地方。以下配置会将具体对象注入到任何需要该类型的地方：\n\n```\npublic void\
  \ ConfigureServices(IServiceCollection services)\n{\n    // Code removed for brevity\n\
  \    services.AddScoped<IFileRepository, FileRepository>();\n}\n```\n\n我们可以在下面的\
  \ PostsController 中看到代码实现，它通过构造函数使用依赖注入来使用 FileRepository：\n\n```\npublic class\
  \ PostsController : Controller\n{\n    // Code removed for brevity\n    private\
  \ readonly IFileRepository _fileRepository;\n    public PostsController(BlogContext\
  \ context, BlogFilesContext filesContext, IPostRepository repository, IFileRepository\
  \ fileRepository)\n    {\n        // Code removed for brevity\n        _fileRepository\
  \ = fileRepository;\n    }\n}\n```\n\n注入的仓库随后将用于文章的 CRUD 操作。我们的主要焦点是自定义 TransactionScope\
  \ 的用法，其中添加了多个事务。当文件仓库和文章仓库都成功执行时，我们提交事务范围，否则回滚更改。自定义事务范围实现所需的代码突出显示如下：\n\n```\n\
