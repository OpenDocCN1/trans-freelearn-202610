  \ SaveChanges() 内的事务的默认行为，如果我们有一个业务需求需要多次 SaveChanges()，并且仍然需要维护事务范围怎么办？我们有明确定义事务并将所需更改引入此范围的机制；EF\
  \ 在 Context 中公开了 Database 类型，该类型具有 BeginTransaction() 功能。\n\n让我们尝试在 CreatePostCommand\
  \ 类型中实现上述功能，同时仍然维护事务范围。我们可以通过使用 BeginTransaction() 函数检索事务对象来实现相同目的；检索到的对象可用于提交或回滚更改。以下代码在持久化\
