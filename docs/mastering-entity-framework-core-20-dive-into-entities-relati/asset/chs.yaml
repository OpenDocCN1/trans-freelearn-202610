  \ `Tag` 持久化需要具体的 `Post` 对象才能持久化标签。我们需要 `PostId`，它只有在调用 `SaveChanges()` 后才可用，但我们需要在调用\
  \ `SaveChanges()` 之前建立这种关联；我们稍后再讨论这一点。在持久化 `Tag` 和 `Post` 后，我们只调用一次 `SaveChanges()`\
  \ 或 `SaveChangesAsync()`；这确保了持久化在单个事务中发生（EF 默认行为）。\n\n\n\n\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_238_0.png)\n\
  \n通常，我们会执行两次 SaveChanges()，一次用于 Post，另一次用于 Tag 对象。第一次 SaveChanges() 会插入 Post 并允许我们获取自动生成的\
  \ PostId，该 PostId 将用于 Tag 行的创建。我们可以通过只进行一次 SaveChanges() 调用并将整个 Post 对象传递给 Tag 对象来利用默认事务，EF\
  \ 确保在 Post 行创建后填充 PostId。\n\nEF 确保即使其中任何一个事务失败，变更也会回滚，因为 EF 默认会为我们兜底，我们需要确保只进行一次\
  \ SaveChanges() 以利用此事务行为。以下实现对 Post 和 Tag 实体执行写操作，但仅有一次 SaveChanges() 确保事务得以维护：\n\
  \n```csharp\npublic class CreatePostCommand : CommandBase,\n    ICreatePostCommand<int>\n\
  {\n    // Code removed for brevity\n    public ICollection<int> TagIds { get; set;\
  \ }\n    public int Handle()\n    {\n        Post post = new Post\n        {\n \
  \           // Code removed for brevity\n        };\n        Context.Add(post);\n\
  \        foreach (int tagId in TagIds)\n        {\n            Context.Add(new TagPost\n\
  \            {\n                TagId = tagId,\n                Post = post\n  \
  \          });\n        }\n        return Context.SaveChanges();\n    }\n\n    public\
  \ async Task<int> HandleAsync()\n    {\n        Post post = new Post\n        {\n\
  \            // Code removed for brevity\n        };\n        Context.Add(post);\n\
  \        foreach (int tagId in TagIds)\n        {\n            Context.Add(new TagPost\n\
  \            {\n                TagId = tagId,\n                Post = post\n  \
  \          });\n        }\n        return await Context.SaveChangesAsync();\n  \
  \  }\n```\n\n标签将在 Posts **Add** 视图中列出，显示如下：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_239_0.png)\n\
