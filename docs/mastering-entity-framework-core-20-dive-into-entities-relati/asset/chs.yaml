- "# 5 了解验证 – 探索内置验证\n\n## 了解验证 – 探索内置验证\n\n在本章中，我们学习并构建了 EF 支持的各种关系。我们从常规的一对一、一对多和多对多关系开始，然后应用了一些\
  \ Fluent API 方法来实现关系。随后，我们在第三章《关系 – 术语和约定》中看到的术语上介绍了 Fluent API 的不同用法。最后，我们看到了如果主实体被删除，依赖实体的删除操作的行为。这些部分处理的是关系，但从未涉及验证，除非必要。让我们在下一章中探索它们。\n\
  \n我们已经探索了不同类型的内置关系，利用 Fluent API 方法创建关系。我们还查看了 Fluent API 在导航属性上的使用，使用 isRequired()\
  \ 强制某些字段，使用 HasPrincipalKey() 和 HasForeignKey() 方法实现主外键等等。\n\n在本章中，我们将针对数据安全提出以下问题：\n\
  \n- 在将数据发送到网络之前应该对数据做什么？\n  - 向数据添加某些规则/条件（在模型中定义）\n  - 在客户端和服务器端验证模型（开箱即支持）\n-\
  \ ASP.NET 中如何处理验证？\n  - 我们从基于 JavaScript 的验证开始，然后执行了控件驱动的验证，最后从 MVC 开始使用数据模型驱动的验证\n\
  \  - 我们将探索 MVC 如何通过数据模型处理验证\n- 我们是否需要显式使用 HTML5 验证？\n  - 不需要，因为渲染 MVC 引擎会将数据模型驱动的验证内部转换为\
  \ HTML5 data-attribute 驱动的验证\n\n本章将涵盖所有内置验证，列示如下：\n\n- 内置验证\n- `Required` 字段验证\n\
  - `EmailAddress` 字段验证\n- `Compare` 字段验证\n- `Url` 字段验证\n- `MinLength` 字段验证\n- `MaxLength`\
  \ 字段验证\n- `RegularExpression` 字段验证\n\n## 深入内置验证\n\n数据安全在任何应用程序的开发中都起着至关重要的作用，因为几乎一切都围绕数据展开。因此，确保我们将有效数据存储在数据库中至关重要，确保从用户传递到应用程序服务器的数据能够安全传输；到达服务器的数据也应包含有效数据（可能具有有效的数据类型、长度等）。\n\
  \n我们最初在 ASP.NET Web Forms 中使用 JavaScript 执行验证；遗憾的是，最初的许多 ASP.NET 开发人员仅使用 JavaScript\
  \ 进行验证。然后我们转向控件驱动的验证，它将所有脚本封装在接受验证所需参数的 ASP 控件中。最后，我们接触到数据模型驱动的验证，它允许开发人员通过数据注释配置验证，自动处理客户端（使用\
  \ jQuery unobtrusive validation）和服务器端（使用 MVC model binder validation）。\n\n**Entity\
  \ Framework (EF)** 允许我们使用注释/属性验证实现同样的功能，这减少了与安全相关的许多编码（由于此要求，客户端和服务器端验证得以简化）。EF\
  \ 为我们提供了一些内置验证：\n\n- Required\n- EmailAddress\n- Compare\n- Url\n- MinLength\n-\
  \ MaxLength\n- RegularExpression\n\n上述列表简要涵盖了大多数验证器。如果您想查看验证器的完整列表，请访问 `https://msdn.microsoft.com/en-us/library/system.componentmodel.dataannotations(v=vs.110).aspx`。让我们详细查看每个列出的验证器。\n\
  \n## Required 字段验证\n\n我们将从 `Required` 内置验证开始，该验证允许验证器检查字段是否有值。required 验证对于确保在将数据传输到服务器进行进一步处理之前，必填字段已被用户填写或更新是必要的。\n\
  \n以下步骤将帮助我们理解验证的工作方式：\n\n1. `Required` 字段验证器使用数据注释添加到模型中。\n2. MVC 引擎使用此配置在客户端和服务器端执行验证。\n\
  3. 当 MVC 引擎生成带有输入字段的表单视图时，它还会为每个输入字段脚手架一个 `<span>` 元素以保存错误消息。\n4. 当我们运行应用程序并在具有\
  \ `aria-required` 字段验证的输入字段中未提供任何值的情况下提交表单时，验证错误将被添加到模型状态错误列表中。\n5. 错误将显示在表单每个元素关联的\
  \ `<span>` 中。\n\n如果字段为 NULL 或 \"\"（空）或包含空白，则验证错误将被捕获在 `Required` 数据注释中。\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_127_0.png)\n\
  \n字段值的 数据类型 可以是任何类型。那么为什么验证器要检查空字符串呢？很简单。因为大多数数据类型是由模型绑定器从字符串转换为其适当类型，所以框架很容易使用\
  \ `String` 作为默认数据类型来检查值是否存在。\n\n`Required` 属性/数据注释可以添加到如下所示的 `Blog` 代码中；应包含 `DataAnnotations`\
  \ 引用以配置验证。以下屏幕截图显示了允许我们导入所需命名空间的 intelli-sense（使用 Ctrl + . 触发）：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_127_1.png)\n\
  \n添加 Required 验证所需的源代码如下所示；它使用内置验证并抛出默认错误消息：\n\n```\npublic class Blog\n{\n    public\
  \ int Id { get; set; }\n    [Required]\n    public string Url { get; set; }\n  \
  \  public ICollection<Post> Posts { get; set; }\n    public int AuthorId { get;\
  \ set; }\n    public User Author { get; set; }\n}\n```\n\n脚手架的 HTML 代码具有 data-attribute\
  \ 驱动的验证，该验证由 jQuery validate unobtrusive 库使用，以下屏幕截图中突出显示的脚手架 HTML 内容由该库使用：\n\n```\n\
  <form action=\"/Blogs/Create\" method=\"post\" novalidate=\"novalidate\">\n  <div\
  \ class=\"form-group\">\n    <label class=\"control-label\" for=\"Url\">Url</label>\n\
  \    <input name=\"Url\" class=\"form-control input-validation-error\" id=\"Url\"\
  \ aria-required=\"true\" aria-describedby=\"Url-error\" type=\"text\" data-val-required=\"\
  The Url field is required.\" data-val=\"true\" value=\"\" />\n    <span class=\"\
  text-danger field-validation-error\" data-valmsg-replace=\"true\" data-valmsg-for=\"\
  Url\">...</span>\n  </div>\n  <div class=\"form-group\">...</div>\n  <div class=\"\
  form-group\">...</div>\n  <input name=\"__RequestVerificationToken\" type=\"hidden\"\
  \ value=\"CfdJ8DLg-LbAetFJsIxRp6SZ1z-oUwc6FnIJwIAD_KayOildb55oDB_ZOx2nE6J2uwQVRIensHgY\
  \ Ehw d8E8kSBKDmwNKYtucHwpCLS9THwY7aRaBxBwMJ54goCFkdbo-F7J4wdLx cOb5KpoC0fSN g6EAQOs\"\
  \ />\n</form>\n```\n\n上述方法将强制 EF 在验证期间字段包含无效数据时发出标准验证错误消息，**The Url field is required**。脚手架的\
  \ `<span>` 元素用于填充验证错误，如以下屏幕截图所示：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_129_0.png)\n\
  \n我们也可以使用 `ErrorMessage` 字段执行自定义错误消息验证；配置如下所示突出显示：\n\n```\npublic class Blog\n{\n\
  \    public int Id { get; set; }\n    [Required]\n    public string Url { get; set;\
  \ }\n    public ICollection<Post> Posts { get; set; }\n    [Required(ErrorMessage\
  \ = \"Author is required, kindly pick one!\")]\n    public int AuthorId { get; set;\
  \ }\n    public User Author { get; set; }\n}\n```\n\n上述配置将使用自定义错误消息在 `data-val-required`\
  \ 属性中，而不是标准验证错误消息：\n\n\n\n```html\n<form action=\"/blogs/Create\" method=\"post\"\
  \ novalidate=\"novalidate\">\n  <div class=\"form-group\">...</div>\n  <div class=\"\
  form-group\">\n    <label class=\"control-label\" for=\"AuthorId\">AuthorId</label>\n\
  \    <select name=\"AuthorId\" class=\"form-control\" id=\"AuthorId\"\n      data-val-required=\"\
  Author is required, kindly pick one!\"\n      data-val=\"true\"></select>\n  </div>\n\
  \  <div class=\"form-group\">...</div>\n  <input name=\"__RequestVerificationToken\"\
  \ type=\"hidden\" value=\"CfDJ8DLg-LbAetFJsIxRp6SZI-zb4jVCS7PjXp-ZauwW1pO_dluOlPRtCOIvEXWfB1cyBOfpUrgKnNqg-29zwdcYBb0aJoYqPzY21zYWSqURiNIFD7A9WNeXwPw0mBvidhCONWnaikpz1PhyIqwkqtTEzo\"\
  \ />\n</form>\n```\n\n对于 `<select>` 字段，MVC 脚手架引擎不会包含用于显示错误信息的 `<span>` 元素，因此请包含以下部分：\n\
  \n```html\n<form asp-action=\"Create\">\n    <div asp-validation-summary=\"ModelOnly\"\
  \ class=\"text-danger\">\n    </div>\n    // Code removed for brevity\n    <div\
  \ class=\"form-group\">\n        <label asp-for=\"AuthorId\" class=\"control-label\"\
  ></label>\n        <select asp-for=\"AuthorId\" class=\"form-control\"\n       \
  \     asp-items=\"ViewBag.AuthorId\"></select>\n        <span asp-validation-for=\"\
  AuthorId\" class=\"text-danger\">\n        </span>\n    </div>\n    // Code removed\
  \ for brevity\n</form>\n```\n\n上述方法将强制 EF 在验证期间字段包含无效数据时发出自定义错误信息，**Author is required,\
  \ kindly pick one!**，如下图所示：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_131_0.png)\n\
  \n一旦用户开始在字段中输入任何值，显示的错误信息将被清除。\n\n> 客户端验证逻辑基于 jQuery validate 库工作，并在用户输入值时通过使用 jQuery\
  \ validate unobtrusive 库即时执行。\n\n我们已通过在 `Blog` 实体中配置来探索了 `Required` 字段验证；让我们在下一节中为博客系统的剩余实体配置验证。\n\
  \n验证错误可以在以下情况下在 EmailAddress 数据注释中捕获：\n\n- 如果字段没有 @ 符号后跟一个或多个字符（例如 a 或 a@），则会向用户报告验证错误\n\
  - 在提供 @ 符号后跟一个或多个字符后，如果我们引入一个 . （句点），则验证引擎将期望字段值后跟一个或多个字符，如果不满足则会抛出验证错误（例如 a@a.）\n\
  \nEmailAddress 属性/数据注释可以按如下方式配置：\n\n```\npublic class User\n{\n    // Code removed\
  \ for brevity\n    [EmailAddress]\n    public string Email { get; set; }\n}\n```\n\
  \n如前一节所示，脚手架生成的 HTML 代码遵循相同的基于数据属性的验证方法。以下截图中突出显示的部分说明验证是使用基于数据属性的验证执行的：\n\n```\n\
  <form action=\"/Users/Create\" method=\"post\" novalidate=\"novalidate\">\n  <div\
  \ class=\"form-horizontal\">\n    <h4>User</h4>\n    <hr />\n    <div class=\"form-group\"\
  >...</div>\n    <div class=\"form-group\">...</div>\n    <div class=\"form-group\"\
  >...</div>\n    <div class=\"form-group\">\n      <label class=\"col-md-2 control-label\"\
  \ for=\"Email\">Email</label>\n      <div class=\"col-md-10\">\n        <input name=\"\
  Email\" class=\"form-control valid\" id=\"Email\" aria-invalid=\"false\" aria-describedby=\"\
  Email-error\" type=\"email\" data-val=\"true\" data-val-email=\"Provide a valid\
  \ email address\" value=\"\" />\n        <span class=\"text-danger field-validation-valid\"\
  \ data-valmsg-replace=\"true\" data-valmsg-for=\"Email\"></span>\n      </div>\n\
  \    </div>\n  </div>\n</form>\n```\n\n上述方法将强制 EF 在验证期间字段包含无效数据时发出标准验证错误信息，**The\
  \ Email field is not a valid e-mail address.**，如下图所示：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_134_0.png)\n\
  \n我们可以看到，在 @ 符号后提供值后，错误就会被移除，即使电子邮件尚未完成，如下图所示：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_134_1.png)\n\
  \n我们可以按如下方式为每个模型字段配置自定义错误信息：\n\n```\npublic class User\n{\n    // Code removed for\
  \ brevity\n    [Required(ErrorMessage = \"Email is required\")]\n    [EmailAddress(ErrorMessage\
  \ = \"Provide a valid email address\")]\n    public string Email { get; set; }\n\
  \    // Code removed for brevity\n}\n```\n\n上述方法将强制 EF 在验证期间字段包含无效数据时发出自定义错误信息，**Provide\
  \ a valid email address**，如下所示：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_136_0.png)\n\
  \n自定义错误仍然有效或可用于抛出无效域名验证错误：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_137_0.png)\n\
  \n一旦用户开始在字段中输入有效的电子邮件值，显示的错误信息将被清除。\n\n有效电子邮件值的判定是通过检查值的 @ 符号；神秘的是，它在用户完成电子邮件的合法域名（gmail.com\
  \ 或 yahoo.com）之前就清除了验证（test@somedomain）。一旦再次提供 . 值，它就会显示错误信息，要求用户提供任何域名扩展值，例如 .com\
  \ 或 .net（即使我们提供 .abc 也能完美工作）。\n\n## 将 EmailAddress 验证纳入博客系统模型\n\n我们将更新博客系统模型以在视图模型中容纳\
  \ EmailAddress 字段验证：\n\n```\npublic class RegistrationViewModel\n{\n    // Code\
  \ removed for brevity\n    [Required(ErrorMessage = \"Email is required\")]\n  \
  \  [EmailAddress(ErrorMessage = \"Provide a valid email address\")]\n    public\
  \ string Email { get; set; }\n    [Required(ErrorMessage = \"Email is required\"\
  )]\n    [EmailAddress(ErrorMessage = \"Provide a valid email address\")]\n    public\
  \ string ConfirmEmail { get; set; }\n}\n```\n\n我们已详尽地研究了 EmailAddress 字段验证；让我们在下一节中探索\
  \ Compare 验证。\n\n## Compare 字段验证\n\n我们将在本节中探索 Compare 验证，并且由于除模式外的所有内置验证的步骤都是通用的，我们将在其他验证部分仅涵盖验证模式。Compare\
  \ 验证将避免 UI 与服务之间的往返，提供客户端验证以比较密码、电子邮件，甚至是银行账号等敏感信息，这些信息需要此 Compare 验证。\n\n验证错误可以在以下情况下在\
  \ Compare 数据注释中捕获：\n\n- 如果字段为 NULL 或为空或空白\n- 如果字段具有与配置字段值不匹配的值\n\nCompare 属性/数据注释可以按如下方式配置：\n\
  \n```\npublic class RegistrationViewModel\n{\n    // Code removed for brevity\n\
  ```\n\n```\n[Required(ErrorMessage = \"ConfirmPassword is required\")]\n[Compare(\"\
  Password\")]\npublic string ConfirmPassword { get; set; }\n}\n```\n\n我们可以验证如果 Password\
  \ 和 ConfirmPassword 字段不匹配，则标准验证错误信息 'ConfirmPassword' and 'Password' do not match.\
  \ 会出现：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_139_0.png)\n\n我们可以按如下方式为每个模型字段配置自定义错误信息：\n\
  \n```\npublic class RegistrationViewModel\n{\n    // Code removed for brevity\n\
  \    [Required(ErrorMessage = \"ConfirmPassword is required\")]\n    [Compare(\"\
  Password\", ErrorMessage = \"Password does not match\")]\n    public string ConfirmPassword\
  \ { get; set; }\n}\n```\n\n我们也可以得出结论，compare 验证同样会使用自定义验证错误信息。我们的测试场景将发出 Password\
  \ does not match 验证错误信息，如下所示：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_140_0.png)\n\
  \n一旦用户开始在字段中输入有效的密码值，显示的错误信息将被清除。\n\n## 将 Compare 验证纳入博客系统模型\n\n我们将更新博客系统模型以在视图模型中容纳\
  \ Compare 字段验证：\n\n```\npublic class LoginViewModel\n{\n    [Required(ErrorMessage\
  \ = \"Username is required\")]\n    public string Username { get; set; }\n    [Required(ErrorMessage\
  \ = \"Password is required\")]\n    public string Password { get; set; }\n    [Required(ErrorMessage\
  \ = \"ConfirmPassword is required\")]\n    [Compare(\"Password\", ErrorMessage =\
  \ \"Password does not match\")]\n    public string ConfirmPassword { get; set; }\n\
  }\n```\n\n\n\n\n\n我们已经全面地研究了 Compare 字段验证。让我们在下一节中探索 Url 验证。\n\n## Url 字段验证\n\n\
  我们将研究 Url 验证，它应该如何配置，以及它如何与 MVC 引擎配合工作。它对 URL 值执行基本的语法检查，而不是验证 URL 本身，因此最好有一个一致的机制来执行，例如验证，以在系统之间保持统一的行为。Url\
  \ 验证是基于以下模式进行的 -\n\n<protocol>://<domain-name>.<extension>。让我们详细探索该模式：\n\n- **Protocol:**\
  \ 它应该是 HTTP、https 或 FTP\n- **Domain name:** 它应为一个或多个字符\n- **Extension:** 它应为两个或多个字符（例如，http://a.bc\
  \ 是有效的，因为它遵循了前面的模式）\n\nUrl 属性/数据注释可以用以下方式使用：\n\n```csharp\npublic class Blog\n{\n\
  \    // Code removed for brevity\n    [Required(ErrorMessage = \"Url is required\"\
  )]\n    [Url]\n    public string Url { get; set; }\n}\n```\n\n**Url** 验证将以下值报告为错误\
  \ **The Url field is not a valid fully-qualified http, https, or ftp URL.** 因为该值仅包含协议并且不满足\
  \ URL 模式：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_142_0.png)\n\n如果字段值正确遵循 URL\
  \ 模式，则错误将被移除，我们可以在以下屏幕截图中看到字段值似乎是有效的（遵循模式）：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_143_0.png)\n\
  \n我们可以按如下方式为每个模型字段配置自定义错误消息：\n\n```csharp\npublic class Blog\n{\n    // Code removed\
  \ for brevity\n    [Required(ErrorMessage = \"Url is required\")]\n    [Url(ErrorMessage\
  \ = \"Provide a valid url\")]\n    public string Url { get; set; }\n}\n```\n\n上述方法将强制\
  \ EF 在验证期间如果字段包含无效数据时发出自定义错误消息，**Provide a valid url**，如下所示：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_144_0.png)\n\
  \n一旦用户开始在字段中输入有效的 URL 值，显示的错误消息将被清除。\n\n### 将 Url 验证纳入博客系统模型\n\n我们将更新我们的博客系统模型以适应\
  \ Url 字段验证，数据模型驱动的 Url 验证在以下实体中执行：\n\n```csharp\npublic class Blog\n{\n    // Code\
  \ removed for brevity\n    [Required(ErrorMessage = \"Url is required\")]\n    [Url(ErrorMessage\
  \ = \"Provide a valid url\")]\n    public string Url { get; set; }\n}\n```\n\n```csharp\n\
  public class Post\n{\n    // Code removed for brevity\n    [Url(ErrorMessage = \"\
  Provide a valid url\")]\n    public string Url { get; set; }\n}\n\npublic class\
  \ Person\n{\n    // Code removed for brevity\n    [Url(ErrorMessage = \"Provide\
  \ a valid url\")]\n    public string Url { get; set; }\n    [Url(ErrorMessage =\
  \ \"Provide a valid image url\")]\n    public string ImageUrl { get; set; }\n}\n\
  ```\n\n我们已经全面地看到了 Url 字段验证；让我们在下一节中探索 `MinLength` 验证。\n\n## MinLength 字段验证\n\n`MinLength`\
  \ 验证有助于为某些字段创建约束，例如用户名、邮政编码等。我们将在本节开始研究 `MinLength` 验证。\n\n在以下情况下，可以在 `MinLength`\
  \ 数据注释中捕获验证错误：\n\n- 如果字段为 `NULL` 或为空或空白。\n- 如果字段值的长度小于配置的长度。例如，如果 `MinLength` 配置为\
  \ 6，则如果字段中提供的字符数少于 6，则会抛出最小长度验证错误。\n\n`MinLength` 属性/数据注释可以按如下方式配置：\n\n```csharp\n\
  public class RegistrationViewModel\n{\n    [Required(ErrorMessage = \"Username is\
  \ required\")]\n    [MinLength(6)]\n    public string Username { get; set; }\n \
  \   // Code removed for brevity\n}\n```\n\n如果字段值不满足最小长度要求，则会抛出验证错误 **The field Username\
  \ must be a string or array type with a minimum length of '6'**，而错误消息的字段名和长度基于字段名和配置，如下所示：\n\
  \n![](img/17e01f90db603e72c0f0c6a7dce8920c_146_0.png)\n\n一旦满足长度约束，错误消息将从用户界面中移除，如下所示：\n\
  \n![](img/17e01f90db603e72c0f0c6a7dce8920c_146_1.png)\n\n我们可以按如下方式为每个模型字段配置自定义错误消息：\n\
  \n```csharp\npublic class RegistrationViewModel\n{\n    [Required(ErrorMessage =\
  \ \"Username is required\")]\n    [MinLength(6, ErrorMessage = \"Username needs\
  \ minimum 6 characters\")]\n    public string Username { get; set; }\n    // Code\
  \ removed for brevity\n}\n```\n\n上述方法将强制 EF 在验证期间如果字段包含无效数据时发出自定义错误消息，**Username\
  \ needs minimum 6 characters**，如下所示：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_147_0.png)\n\
  \n我们已经全面地研究了 `MinLength` 字段验证；让我们在下一节中探索 `MaxLength` 验证。\n\n## MaxLength 字段验证\n\n\
  `MaxLength` 验证有助于为某些字段创建约束，例如用户名、邮政编码等。我们将在本节研究 `MaxLength` 验证。\n\n如果字段值的长度大于配置的长度，则可以在\
  \ MaxLength 数据注释中捕获验证错误。例如，如果最大长度配置为 30，则如果字段中提供的总字符长度大于 30，则会抛出最大长度验证错误。\n\nMaxLength\
  \ 属性/数据注释可以按如下方式配置：\n\n```csharp\npublic class RegistrationViewModel\n{\n    [Required(ErrorMessage\
  \ = \"Username is required\")]\n    [MinLength(6, ErrorMessage = \"Username needs\
  \ minimum 6 characters\")]\n    [MaxLength(30)]\n    public string Username { get;\
  \ set; }\n    // Code removed for brevity\n}\n```\n\n如果字段值不满足最大长度要求，则会抛出验证错误，The\
  \ field Username must be a string or array type with a maximum length of '30'，而错误消息的字段名和长度基于字段名和配置，如下：\n\
  \n![](img/17e01f90db603e72c0f0c6a7dce8920c_148_0.png)\n\n我们可以按如下方式为每个模型字段配置自定义错误消息：\n\
  \n```csharp\npublic class RegistrationViewModel\n{\n    [Required(ErrorMessage =\
  \ \"Username is required\")]\n    [MinLength(6, ErrorMessage = \"Username needs\
  \ minimum 6 characters\")]\n    [MaxLength(30, ErrorMessage = \"Username cannot\
  \ exceed 30 characters\")]\n    public string Username { get; set; }\n    // Code\
  \ removed for brevity\n}\n```\n\n上述方法将强制 EF 在验证期间如果字段包含无效数据时发出自定义错误消息，Username cannot\
  \ exceed 30 characters，如下所示：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_149_0.png)\n\
  \n我们已经全面地研究了 MaxLength 字段验证；让我们在下一节中探索 RegularExpression 验证。\n\n## RegularExpression\
  \ 字段验证\n\n正则表达式验证是用于大多数验证的唯一解决方案，例如电子邮件、电话号码、邮政编码、用户名、密码等。大多数与正则表达式一起使用的模式被封装到单独的验证中。尽管如此，使用范围很广并且需要一种方法来定义自定义验证。这就是\
  \ RegularExpression 验证派上用场的地方。让我们在本节研究正则表达式。\n\n如果字段值不遵循定义的正则表达式模式，则引擎会返回验证错误。例如，如果正则表达式配置为仅包含字母表中的字母，则任何其他字符的包含都会抛出验证错误。\n\
  \nRegularExpression 属性/数据注释可以按如下方式配置：\n\n```csharp\npublic class Person\n{\n   \
  \ public int Id { get; set; }\n    [Required(ErrorMessage = \"First Name is required\"\
  )]\n    [RegularExpression(\"^[a-zA-Z]+$\")]\n    public string FirstName { get;\
  \ set; }\n    // Code removed for brevity\n}\n```\n\n如果字段值与正则表达式不匹配，则会抛出验证错误，The\
  \ field Username must match the regular expression '^[a-zA-Z]+$'，如下所示：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_150_0.png)\n\
  \n我们可以按如下方式在每个模型字段上配置自定义错误消息：\n\n```csharp\npublic class Person\n{\n    public int\
  \ Id { get; set; }\n    [Required(ErrorMessage = \"First Name is required\")]\n\
  \    [RegularExpression(\"^[a-zA-Z]+$\", ErrorMessage = \"Only alphabets were allowed\"\
  )]\n}\n```\n\n\n\n\n\n```\npublic string FirstName { get; set; }\n// Code removed\
  \ for brevity\n}\n```\n\n前述方法将强制 EF 在验证期间如果字段包含无效数据时发出自定义错误消息，**仅允许字母**，如下所示：\n\n\
  ![](img/17e01f90db603e72c0f0c6a7dce8920c_151_0.png)\n\n我们在本章中已全面研究了 RegularExpression\
  \ 字段验证和其他内置验证。我们也在构建博客系统的过程中为其构建了验证。\n\n## Summary\n\n本章中我们探索了 EF 提供的各种内置验证。我们从使用广泛的\
  \ Required 字段验证器开始，然后研究了电子邮件地址验证器，接着我们涵盖了其他验证器，如 compare、MinLength、MaxLength 和 RegularExpression\
  \ 字段验证器。最后，我们为本书中正在构建的博客系统配置了这些字段验证器。本章仅涉及内置验证，但从未讨论客户端验证是如何执行的或自定义验证如何处理。让我们在第\
  \ 6 章《Save Yourself – Hack Proof Your Entities》中探索这一点以及其他一些内容。\n"
- "# 6 客户端验证\nSave Yourself – Hack Proof Your Entities\n\n在第 5 章《Know the Validation\
  \ – Explore Inbuilt Validations》中，我们了解了 Entity Framework Core 中可用的内置验证。我们通过从验证过去是如何处理的、框架如何处理它、所需的配置以及框架执行的渲染开始，详细探索了每一个验证。\n\
  \n在本章中，我们将针对数据安全提出以下关注点：\n\n- 在我们将数据发送到网络之前应该对数据做什么？\n- 你能大胆猜测在我们将数据发送到网络之前应该执行什么吗？\n\
  - 如果有人入侵客户端验证？或者脚本停止工作怎么办？\n- 我们可以通过引入服务器端验证来保护自己。\n- 除了客户端和服务器端验证之外，我们还需要什么额外的东西吗？\n\
  - 是的，通常的服务器端验证会查找任何错误，并且所有模型属性的验证器都将被手动验证所考虑。\n- 希望我们也有自定义验证的实现？\n- 是的，我们确实有创建自定义验证器的\
  \ provision 以及 .NET Core 的数据属性方法用于自定义验证器。\n- 该死，我们应该已经涵盖了几乎所有内容。猜猜我们没有留下任何其他东西？\n\
  - 除了一件事——远程验证。例如，可以使用远程验证从客户端检查用户名可用性，而无需添加任何客户端代码。\n\n在解决这些关注点之后，我们对本章将涵盖的内容有了大致的了解：\n\
  \n- 客户端验证\n- 如果客户端脚本停止工作会产生的后果\n- 服务器端验证\n- 手动验证\n- 自定义验证\n- 为自定义验证创建客户端逻辑\n- 远程验证\n\
  \n### Client-side validation\n\n客户端验证对于现代 Web 应用程序来说真是一个福音。有很多实例证明 jQuery 在开发和用户体验方面都有帮助。客户端验证是我们节省客户端/浏览器与服务器之间多次往返以执行基本验证的最大优势。\n\
  \njQuery、jQuery Validate 和 jQuery Validate Unobtrusive 库帮助我们在客户端（浏览器）端执行这些基本验证，而不是依赖服务器执行相同的操作。关于在客户端验证模型存在多次讨论甚至争论，这引发了安全考虑。以下各节将解决这个问题。\n\
  \n启用客户端验证的任务只是为 MVC 提供一个部分来在用户界面中注入验证错误，这与验证相关属性无关（因为它将存在于模型中）：\n\n```\n```html\n\
  <div class=\"form-group\">\n    <label asp-for=\"Title\" class=\"col-md-2 control-label\"\
  ></label>\n    <div class=\"col-md-10\">\n        <input asp-for=\"Title\" class=\"\
  form-control\" />\n        <span asp-validation-for=\"Title\" class=\"text-danger\"\
  ></span>\n    </div>\n</div>\n```\n```\n\nMVC 模板引擎将生成带有 data- 属性的 HTML 标签，这对于内置验证和自定义验证的行为都相同。之前提到的带有\
  \ Required 验证的 Title 字段的渲染 HTML 内容显示如下：\n\n```\n<div class=\"form-group\">\n<label\
  \ class=\"col-md-2 control-label\" for=\"Title\">Title</label>\n<div class=\"col-md-10\"\
  >\n<input class=\"form-control\" type=\"text\" data-val=\"true\" data-val-required=\"\
  Title is required\" id=\"Title\" name=\"Title\" value=\"\" />\n<span class=\"text-danger\
  \ field-validation-valid\" data-valmsg-for=\"Title\" data-valmsg-replace=\"true\"\
  ></span>\n</div>\n</div>\n```\n\n验证是在用户尝试提交表单时执行的，这将最终使用客户端验证填充错误消息。此外，当我们尝试编辑消息时，Unobtrusive\
  \ Validation 库会介入并在用户再次提交表单之前尽早执行验证。\n\n我们已经看到了客户端验证的作用；现在，让我们在下一节中看看如果 JavaScript\
  \ 停止工作会发生什么。\n\n### Validating data without client-side scripting\n\n我们生活在一个将开源、性能导向的单页应用程序（减少服务器往返）视为专业应用程序的世界。微软对超越服务器端开发感到过于舒适。后来，他们主要开始尝试客户端验证，这要归功于\
  \ MVC2。现在，随着 MVC Core，他们又回来了！\n\n这就引出了一个价值百万美元的问题——客户端编程真的安全吗？黑客破坏客户端验证并进入服务器需要多长时间？在当今世界，即使是一个刚刚开始学习如何入侵的菜鸟也能在几分钟内做到这一点。说实话，我们无法控制客户端，我们也不能盲目信任从客户端接收到的数据（它可能被任何人使用\
  \ Fiddler、REST Client 等工具入侵/注入）。\n\n既然我们知道接收到的数据可能不真实，为什么我们仍然需要客户端验证？很简单。我们需要更好的用户体验，我们不能简单地忽略一种能够帮助我们实现这一目标的机制。不仅是真实性，如果有人在客户端禁用\
  \ JavaScript，那么我们可能会处理未经过验证的（未验证的）从客户端接收到的不安全数据。\n\nJavaScript 可以通过浏览器设置禁用。以下屏幕截图显示了如何使用\
  \ Chrome 设置（内容 | JavaScript）执行此操作：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_155_0.png)\n\
  \n它将使用户能够在没有客户端验证的情况下提交任何表单，因此以下表单将在 **Title**、**Content**、**Summary** 等没有值的情况下提交也不会有任何问题：\n\
  \n![](img/17e01f90db603e72c0f0c6a7dce8920c_156_0.png)\n\n```\nreturn RedirectToAction(\"\
  Index\");\n}\nelse\n{\n    ViewBag.Message = \"Error occurred while validating the\
  \ user\";\n}\n\nreturn View(user);\n}\n```\n\n前述实现说明了我们如何执行手动验证，并且它执行以下操作：\n\n-\
  \ 将数据从 **Registration View Model** 映射到 **User Data Model**\n- 我们应该始终怀疑映射的数据可能无效\n\
  - 在我们将数据持久化回数据存储之前，手动验证映射的数据始终更安全\n- 如果我们有任何验证错误，我们将通过 `ViewBag` 消息将信息发布给用户\n\n\
  在我们触发 `TryValidateModel` 之前，模型的 `IsValid` 属性将为 false，并且稍后它将根据验证进行更新。我们已经看到了如何执行手动验证，现在我们将进入下一节的自定义验证。\n\
  \n### Custom validation\n\n框架中公开的内置验证可能解决了我们大多数技术验证问题，但可能存在一些业务需求/要求，需要在内置验证之上提供额外的\
  \ provision。\n\n自定义验证可以在两个级别执行：\n\n- 字段级别\n- 类级别\n\n字段级自定义验证器可以使用以下方式创建：\n\n- 从\
  \ `ValidationAttribute` 基类型继承自定义验证类\n- 重写 `IsValid` 方法并处理你的业务验证\n- `IsValid` 方法接受两个参数——value\
  \ 和 `validationContext`\n\n\n\n\n- `value` 字段是实际应用该特性的字段值\n- `validationContext`\
  \ 字段将持有包含该字段的模型的 `ObjectInstance`\n\n在我们的博客系统中，我们可以对发布日期进行业务验证；该验证需要禁止用户将文章发布到过去的日期。我们将自定义验证特性命名为\
  \ `FutureOnly`，并在重写的 `IsValid` 方法中执行如下验证：\n\n```csharp\npublic class FutureOnlyAttribute\
  \ : ValidationAttribute\n{\n    protected override ValidationResult IsValid(object\
  \ value,\n        ValidationContext validationContext)\n    {\n        var post\
  \ = (Post) validationContext.ObjectInstance;\n        return post.PublishedDateTime.CompareTo(DateTime.Now)\
  \ < 0\n            ? new ValidationResult(\"Publishing Date cannot be in past, kindly\
  \ provide a future date\")\n            : ValidationResult.Success;\n    }\n}\n\
  ```\n\n```csharp\npublic class Post\n{\n    public int Id { get; set; }\n    [Required(ErrorMessage\
  \ = \"Title is required\")]\n    public string Title { get; set; }\n    [Required(ErrorMessage\
  \ = \"Content is required\")]\n    public string Content { get; set; }\n    public\
  \ string Summary { get; set; }\n    [FutureOnly]\n    public DateTime PublishedDateTime\
  \ { get; set; }\n    [Url(ErrorMessage = \"Provide a valid url\")]\n    public string\
  \ Url { get; set; }\n    public long VisitorCount { get; set; }\n    public DateTime\
  \ CreatedAt { get; set; }\n    public DateTime ModifiedAt { get; set; }\n    public\
  \ int CreatedBy { get; set; }\n    public int ModifiedBy { get; set; }\n    [Required(ErrorMessage\
  \ = \"Blog is required\")]\n    public int BlogId { get; set; }\n    public Blog\
  \ Blog { get; set; }\n    [Required(ErrorMessage = \"Author is required\")]\n  \
  \  public int AuthorId { get; set; }\n    public User Author { get; set; }\n   \
  \ [Required(ErrorMessage = \"Category is required\")]\n    public int CategoryId\
  \ { get; set; }\n    public Category Category { get; set; }\n    public ICollection<TagPost>\
  \ TagPosts { get; set; }\n    public ICollection<Comment> Comments { get; set; }\n\
  }\n```\n\n前面的实现将验证发布日期是否仅允许未来日期；如果遇到任何过去日期，它将抛出**发布日期不能是过去的时间，请提供一个未来日期**验证错误。\n\
  \n让我们在 `FutureOnly` 特性字段中提供一个无效值，看看验证是如何执行的：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_163_0.png)\n\
  \n`IsValid` 参数处理传入 `value` 和 `validationContext` 两个参数的实际值；如前所述，两者都将包含用户提供的值。我们在实现中使用了\
  \ `validationContext`，很明显所提供的值是过去的日期（与当前日期相比），因此验证错误会被抛出；如下所示：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_164_0.png)\n\
  \n可以通过以下方式创建类级自定义验证器：\n\n- 继承验证对象接口 `IValidatableObject`\n- 实现 `Validate` 方法并处理你的业务验证\n\
  - 如果存在验证错误，`Validate` 方法必须产出这些错误\n\n在我们的博客系统中，我们可以移除模型中包含的 `FutureOnly` 特性，并用类级验证替代。业务验证将在模型绑定期间自动触发，并且如同字段级验证一样，会更新模型状态和错误集合。使用\
  \ `IValidatableObject` 的业务验证如下所示：\n\n```csharp\npublic class Post : IValidatableObject\n\
  {\n    public int Id { get; set; }\n    [Required(ErrorMessage = \"Title is required\"\
  )]\n    public string Title { get; set; }\n    [Required(ErrorMessage = \"Content\
  \ is required\")]\n    public string Content { get; set; }\n    public string Summary\
  \ { get; set; }\n    public DateTime PublishedDateTime { get; set; }\n    [Url(ErrorMessage\
  \ = \"Provide a valid url\")]\n    public string Url { get; set; }\n    public long\
  \ VisitorCount { get; set; }\n    public DateTime CreatedAt { get; set; }\n    public\
  \ DateTime ModifiedAt { get; set; }\n    public int CreatedBy { get; set; }\n  \
  \  public int ModifiedBy { get; set; }\n    [Required(ErrorMessage = \"Blog is required\"\
  )]\n    public int BlogId { get; set; }\n    public Blog Blog { get; set; }\n  \
  \  [Required(ErrorMessage = \"Author is required\")]\n    public int AuthorId {\
  \ get; set; }\n    public User Author { get; set; }\n    [Required(ErrorMessage\
  \ = \"Category is required\")]\n    public int CategoryId { get; set; }\n    public\
  \ Category Category { get; set; }\n    public ICollection<TagPost> TagPosts { get;\
  \ set; }\n    public ICollection<Comment> Comments { get; set; }\n\n    public IEnumerable<ValidationResult>\
  \ Validate(ValidationContext validationContext)\n    {\n        var post = (Post)validationContext.ObjectInstance;\n\
  \        if (post.PublishedDateTime.CompareTo(DateTime.Now) < 0)\n            yield\
  \ return\n                new ValidationResult(\"Publishing Date cannot be in past,\
  \ kindly provide a future date\", new [] { \"PublishedDateTime\" });\n    }\n}\n\
  ```\n\n```csharp\n// One way to consume manual business validation\nvar results\
  \ = new List<ValidationResult>();\nvar isBusinessValid = Validator.TryValidateObject(post,\n\
  \    new ValidationContext(post, null, null), results, false);\n```\n\n`IValidatableObject`\
  \ 实现同样执行业务验证，并在遇到任何业务验证问题时，将验证错误**发布日期不能是过去的时间，请提供一个未来日期**添加到错误集合中。\n\n同样的场景也出现在之前的\
  \ `FutureOnly` 特性验证中。提供过去的日期会在 `Validate` 方法中被验证。两种方法的唯一区别在于：前者一次性实现并应用于所有适用字段，而后者需要在类级别对每个字段分别实现。通俗地说，如果我们需要为验证增加一个字段，就需要在\
  \ `Validate` 方法中再次对该字段执行验证：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_166_0.png)\n\
  \n我们已经探讨了在服务端执行的自定义验证；接下来，让我们在下一节中探讨可以在客户端使用的自定义验证。\n\n## 为自定义验证创建客户端逻辑\n\n我们在本章创建的自定义验证器也应该提供客户端验证支持。默认情况下，EF\
  \ 仅执行服务端验证（开箱即用），但客户端验证应手动执行。框架提供了在上下文特性中注入自定义验证及其错误的机制。但是，我们需要自行执行/实现客户端验证。\n\n\
  可以通过 `IClientModelValidator` 配置 `FutureOnly` 自定义验证特性以支持客户端验证，这要求我们实现 `AddValidation`\
  \ 方法。我们应该在上下文特性中注入所需的自定义验证值；所需实现如下所示：\n\n```csharp\npublic class FutureOnlyAttribute\
  \ : ValidationAttribute,\n    IClientModelValidator\n{\n    protected override ValidationResult\
  \ IsValid(object value,\n        ValidationContext validationContext)\n    {\n \
  \       var post = (Post) validationContext.ObjectInstance;\n        return post.PublishedDateTime.CompareTo(DateTime.Now)\
  \ < 0\n            ? new ValidationResult(\"Publishing Date cannot be in past, kindly\
  \ provide a future date\")\n            : ValidationResult.Success;\n    }\n\n \
  \   public void AddValidation(ClientModelValidationContext context)\n    {\n   \
  \     if (context == null)\n        {\n            throw new ArgumentNullException(nameof(context));\n\
  \        }\n        context.Attributes[\"data-val\"] = \"true\";\n        context.Attributes[\"\
  data-val-futureonly\"] = \"Publishing Date cannot be in past, kindly provide a future\
  \ date\";\n    }\n}\n```\n\n\n\n\n上下文属性除非我们在元素的上下文中手动配置，否则不会具有自定义属性；下面的屏幕截图显示上下文不具有这些自定义属性：\n\
  \n![](img/17e01f90db603e72c0f0c6a7dce8920c_168_0.png)\n\nMVC 渲染引擎将使用客户端验证所需的数据属性渲染\
  \ HTML 内容，并且我们在 AddValidation 中注入的值已作为属性添加到元素上下文中：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_168_1.png)\n\
  \n此注入的数据属性将在实现客户端验证时被利用，用于验证的渲染 HTML 代码如下所示突出显示：\n\n```\n<div class=\"form-group\"\
  >\n    <label class=\"col-md-2 control-label\" for=\"PublishedDateTime\">PublishedDateTime</label>\n\
  \    <div class=\"col-md-10\">\n        <input name=\"PublishedDateTime\" class=\"\
  form-control valid\" id=\"PublishedDateTime\" aria-invalid=\"false\" aria-required=\"\
  true\" aria-describedby=\"PublishedDateTime-error\" type=\"datetime\" value=\"\"\
  \ data-val-required=\"The PublishedDateTime field is required.\" data-val=\"true\"\
  \ data-val-futureonly=\"Publishing Date cannot be in past, kindly provide a future\
  \ date\">\n        <span class=\"text-danger field-validation-valid\" data-valmsg-replace=\"\
  true\" data-valmsg-for=\"PublishedDateTime\"></span>\n    </div>\n</div>\n```\n\n\
  客户端验证应通过在 jQuery validator 中配置它们来执行，这也需要一个无侵入式适配器。以下提供了 FutureOnly 自定义字段验证所需的实现，它将在\
  \ PublishedDateTime 中处理，该字段使用 FutureOnly 自定义验证：\n\n```\n@section Scripts {\n   \
  \ @(await Html.RenderPartialAsync(\"_ValidationScriptsPartial\"));\n    <script>\n\
  \    (function ($) {\n        jQuery.validator.addMethod('futureonly',\n       \
  \     function (value, element, params) {\n                return (new Date($(params[0]).val()))\
  \ > (new Date());\n            });\n        jQuery.validator.unobtrusive.adapters.add('futureonly',\n\
  \            [ 'element' ],\n            function (options) {\n                var\
  \ element = $(options.form).find('input#PublishedDateTime')[0];\n              \
  \  options.rules['futureonly'] = [element];\n                options.messages['futureonly']\
  \ = options.message;\n            });\n    })(jQuery);\n    </script>\n}\n```\n\n\
  前述实现将使 JavaScript 引擎在页面加载期间将无侵入式验证嵌入到自定义属性元素中，从而使应用程序能够执行客户端验证。我们可以在下面的屏幕截图中验证客户端验证在将数据发送到网络之前执行：\n\
  \n![](img/17e01f90db603e72c0f0c6a7dce8920c_170_0.png)\n\n当用户移动到其他控件时，无侵入式验证会启动，它使用自定义\
  \ JavaScript 实现验证控件，如下所示：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_171_0.png)\n\
  \n验证结果要么允许用户继续其输入操作，要么显示错误并阻止用户提交表单（而不到达服务器）。在以下示例中，它是一个无效日期，自定义错误消息已填充到错误集合中，并在视图中显示，如以下屏幕截图所示：\n\
  \n![](img/17e01f90db603e72c0f0c6a7dce8920c_171_1.png)\n\n我们探索了自定义验证器客户端验证所需的完整配置和实现；现在，让我们探索我们可用的远程验证功能，它将在自定义验证之外执行一些操作。\n\
  \n## 远程验证\n\n我们迄今为止所做的验证是在模型级别配置的，当我们说模型时，它发生在自己的域内。我们可能有跨模型操作的需要。Entity Framework\
  \ 没有提供实现相同功能的规定，因为它是数据驱动的，并且在 Entity Framework 中不可用模型外部所需的验证。为了填补这一空白，MVC 提供了使用\
  \ RemoteAttribute 实现相同功能的规定，它允许用户使用遵循特定模式实现的控制器操作。\n\n远程验证需要以下边界条件：\n\n- RemoteAttribute\
  \ 需要两个属性——controller 和 action\n- 配置的字段名应用作 action 参数名\n- action 应返回 Json 数据\n- 返回的数据必须具有布尔值\n\
  \n博客系统有一个类似的要求，需要远程验证：\n\n- 验证应在不提交整个表单的情况下执行\n- 用户名可以在用户输入值时即时验证\n- 远程验证应将值与数据库进行核对并响应用户名是否可用\n\
  \nRemoteAttribute 应在如下所述的用户模型中实现：\n\n- 在 Users 控制器中创建一个名为 IsUsernameAvailable 的\
  \ action。\n- action 应具有参数名为 username 且类型为 String。\n- 对 username 值在 users 表上执行验证并将结果捕获到布尔变量中。\n\
  - 在 `Json` 方法中返回布尔值作为 data 参数。这在以下代码片段中显示：\n\n```\npublic async Task<IActionResult>\
  \ IsUsernameAvailable(string username)\n{\n    var usernameAvailable =\n       \
  \ await _context.Users.AnyAsync(x =>\n            x.Username.Equals(username,\n\
  \                StringComparison.OrdinalIgnoreCase));\n    return Json(data: !usernameAvailable);\n\
  }\n```\n\n- 在 `User` 模型中针对 `Username` 属性配置 `RemoteAttribute`。\n- 验证应传递参数，controller\
  \ 为 `Users` 且 action 为 `IsUsernameAvailable`。\n\n以下代码将在 `User` 实体中配置远程验证：\n\n```\n\
  public class User\n{\n    public int Id { get; set; }\n    [Required(ErrorMessage\
  \ = \"Display Name is required\")]\n    public string DisplayName { get; set; }\n\
  \    [Required(ErrorMessage = \"Username is required\")]\n    [Remote(action: \"\
  IsUsernameAvailable\", controller: \"Users\")]\n    public string Username { get;\
  \ set; }\n    [Required(ErrorMessage = \"Password is required\")]\n    public string\
  \ PasswordHash { get; set; }\n    [Required(ErrorMessage = \"Email is required\"\
  )]\n    [EmailAddress(ErrorMessage = \"Provide a valid email address\")]\n    public\
  \ string Email { get; set; }\n    public DateTime CreatedAt { get; set; }\n    public\
  \ DateTime ModifiedAt { get; set; }\n    public int CreatedBy { get; set; }\n  \
  \  public int ModifiedBy { get; set; }\n    public ICollection<Blog> Blogs { get;\
  \ set; }\n    public ICollection<Post> Posts { get; set; }\n    public ICollection<Comment>\
  \ Comments { get; set; }\n    public int? AddressId { get; set; }\n    public Address\
  \ Address { get; set; }\n    public int PersonId { get; set; }\n    public Person\
  \ Person { get; set; }\n}\n```\n\n由于我们依赖外部功能来验证模型字段，因此明智的做法是对远程验证执行单元测试。让我们通过提供一个可用的用户名来验证代码是否符合成功场景（您可以在以下屏幕截图中看到，高亮的\
  \ watch 控制台窗口显示用户名“prabhakaran”仍然可用）：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_174_0.png)\n\
  \n有效的用户名不会在 **创建用户** 屏幕上抛出任何验证错误。我们可以看到屏幕上的用户名，然后高亮到下一个字段，仍然没有验证错误；这意味着用户名可用（在 **Username**\
  \ 字段中显示内容是老式的 EF！）。这在以下屏幕截图中显示：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_175_0.png)\n\
  \n让我们通过提供一个不可用的用户名来验证代码是否符合失败场景（您可以在以下屏幕截图中看到，高亮的 watch 控制台窗口显示用户名“prabhakar”不可用）：\n\
  \n![](img/17e01f90db603e72c0f0c6a7dce8920c_176_0.png)\n\n\n\n\n\n这个无效用户名会在创建用户界面中抛出验证错误。我们可以看到，文本框中提供的用户名在数据库中不存在，相应的验证错误会显示在文本框旁边：\n\
  \n![](img/17e01f90db603e72c0f0c6a7dce8920c_177_0.png)\n\n最后一件事，在边界情况下，我们提到参数名应该与为远程验证配置的字段名匹配。我们需要知道如果出现偏差会发生什么吗？如果参数名与配置的名称不同该怎么办？那么，值绑定将不会发生，值反而会是\
  \ null。\n\n到目前为止，我们还没有讨论过赋值，那么就把它作为一个任务，完成如下图所示的正确验证：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_178_0.png)\n\
  \n本章我们学习了远程验证，这也结束了我们在框架内置验证之外可以执行的自定义验证。\n\n## 总结\n\n本章我们学习了 Entity Framework 和\
  \ MVC 提供的自定义验证。我们从客户端验证开始，它彻底改变了用户体验，然后我们研究了如果有人入侵并绕过客户端验证会发生什么。我们通过在服务端应用第二层验证解决了这些问题。我们看到了手动验证的必要性，而不是让框架开箱即用地替我们完成；我们随后执行了一些内置验证之外所需的自定义验证。我们还通过\
  \ `IClientModelValidator` 将相同的验证应用到了客户端。最后，我们执行了一个远程验证，它甚至不是 Entity Framework 的一部分，而是\
  \ MVC 框架中提供的。\n\n到目前为止，我们只通过数据上下文访问数据，从未编写过任何纯 SQL 查询。在一些合理的场景中，我们需要绕过数据上下文以获得更好的性能，或者避免框架执行繁重的任务。我们将在第\
  \ 7 章《*使用原始 SQL – 在 LINQ 中利用 SQL 查询*》中解决这个问题。\n\n## 7 使用原始 SQL – 在 LINQ 中利用 SQL\
  \ 查询\n\n我们已经了解了自定义验证、如何利用客户端验证、当有人入侵系统并绕过客户端验证时如何响应，以及在服务端增加额外的安全层。最后，我们执行了来自 MVC\
  \ 框架的远程验证。\n\n在本章中，我们将讨论以下与数据安全相关的问题：\n\n- 在 **Entity Framework (EF)** 中，我们有控制 SQL\
  \ 查询的机制吗？\n  - 我们可以直接从 EF 执行内联 SQL 查询。\n- 如果有人入侵系统并执行 SQL 注入会怎样？SQL 查询真的会带来这些安全问题吗？\n\
  \  - 我们可以使用参数化查询来避免 SQL 注入。\n- 如果我们走纯 SQL 查询这条路，还能利用 LINQ 查询吗？\n  - 是的，我们仍然可以在 LINQ\
  \ 查询中利用它们。\n- 我们能在没有 `DbSet` 类或 **普通旧 CLR 对象 (POCO)** 对象的情况下执行查询吗？\n  - 是的，我们确实有这样的机制，可以在没有\
  \ `DbSet` 或 POCO 对象的情况下执行查询。\n\n解决了这些问题之后，我们对本章将要介绍的内容就有了清晰的认识：\n\n- 基本的原始 SQL 查询\n\
  - 构建参数化查询\n- 与 LINQ 组合使用\n- 在没有 DbSet 类或 POCO 对象的情况下执行 SQL 查询\n\n### 基本的原始 SQL 查询\n\
  \n将 SQL 查询从框架中抽象出来的主要目的是，无论应用程序中使用何种数据源，都可以执行实现。我们可能会认为创建原始 SQL 查询必定违背了 EF Core\
  \ 存在的初衷。有一些合理的需求可能需要原始 SQL，而不是让 Entity 替我们完成工作。\n\n原因可以是任何东西，比如通过 LINQ 查询无法实现的功能，或者\
  \ Entity 生成的查询未能优化性能。原因可以是任何东西，但归根结底，我们都在为一个结果而工作，一个性能更优的优化结果。只要理由比 API 的使用更充分，我们甚至可能愿意采取极端措施，不与框架/API\
  \ 保持一致。\n\n我们可以使用原始模式从 EF 执行基本 SQL 查询、存储过程或函数。框架通过 DbSet 中的 FromSql 方法为我们提供了这一机制，让我们可以使用\
  \ EF 执行原始 SQL。它还允许我们基于 SQL 查询创建 LINQ 查询；因为 FromSql 是从 DbSet 类型公开的，所以这成为可能。\n\n让我们扩展博客系统，将博客控制器的执行改为使用原始\
  \ SQL 查询，我们将从一个使用原始 SQL 查询的 Index 操作开始，如下所示：\n\n```csharp\npublic async Task<IActionResult>\
  \ Index()\n{\n    return View(await _context.Blogs.FromSql(\"Select * from dbo.Blog\"\
  ).ToListAsync());\n}\n```\n\n上述实现会在视图中产生以下输出，并且与现有的渲染视图没有太大区别：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_181_0.png)\n\
  \n我们将创建一个新的操作，只是为了演示在 EF 中使用原始 SQL 查询执行存储过程（SP）GetLatestBlogs。下面列出了使用 FromSql 实现\
  \ SP 的代码：\n\n```csharp\npublic async Task<IActionResult> LatestBlogs()\n{\n    return\
  \ View(\"Index\", await _context.Blogs.FromSql(\"EXEC [dbo].[GetLatestBlogs]\").ToListAsync());\n\
  }\n```\n\n上述实现会在视图中产生以下输出。它所做的只是在现有的 Index 视图中渲染 SP 的结果：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_181_1.png)\n\
  \nFromSql 只有在返回的数据是所访问的 DbSet 类型时才能执行原始 SQL 查询。在前面的示例中，我们使用了 Blogs 和 DbSet，它期望查询返回\
  \ blogs，而其他实体不会被框架接受。\n\n让我们尝试返回一个不同于为 DbSet 配置的类型，看看 EF 会有什么行为：\n\n```csharp\n\
  public async Task<IActionResult> Index()\n{\n    return View(await _context.Blogs.FromSql(\"\
  Select * from dbo.Post\").ToListAsync());\n}\n```\n\n由于返回的数据与它试图映射的类型不匹配，上述查询将触发一个无效操作：\n\
  \n![](img/17e01f90db603e72c0f0c6a7dce8920c_182_0.png)\n\n从上面显示的错误来看，很明显这里发生了一些超出类型不匹配的问题，因为错误没有指明任何关于类型不匹配的信息。\n\
  \n![](img/17e01f90db603e72c0f0c6a7dce8920c_183_0.png)\n\n`FromSql` 要求从数据库返回的列名与映射对象中可用的列名匹配。如果对象中存在不匹配，框架将抛出一个无效操作异常。\n\
  \n如果我们需要在原始 SQL 查询中使用 `FromSql` 消费匿名类型，那么在 EF Core 2.0 之前我们肯定无法实现，相关信息可以在以下共享链接\
  \ `https://github.com/aspnet/EntityFramework/issues/1862` 中看到，其中写道：\n\n> “这是我们仍在努力在\
  \ 2.0 中实现的功能，但时间安排很紧，而且我们很可能会把它推迟到 2.0 之后的下一个次要版本。” —— Diego Vega.\n>\n> “遗憾的是，我们没有时间在\
  \ 2.0 版本中实现这一点。我们将其视为 2.0 之后的高优先级。” —— Arthur Vickers\n\n上述回复来自 Entity Framework\
  \ GitHub 仓库的所有者和成员，因此这是官方的说法：我们今年可能无法获得这个功能。\n\n让我们尝试限制从数据库返回的列，看看是否会对应用程序产生影响。`SELECT`\
  \ 语句被调整为只选择 `Blog` 实体中的部分列：\n\n```csharp\npublic async Task<IActionResult> Index()\n\
  {\n    return View(await _context.Blogs.FromSql(\"Select [Id],[Title],[Subtitle],[Description],[Url]\
  \ from dbo.Blog\").ToListAsync());\n}\n```\n\n\n\n\n\n该框架不支持未向数据模型的所有属性/字段提供数据的内联查询。在\
  \ SQL 查询满足所有字段之前，它会开始抛出错误，如下所示：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_184_0.png)\n\
  \n到目前为止，我们已经见过不带任何参数的查询或存储过程（SP），在实时应用程序中只有少数场景会使用它们。我们将在下一节探讨接受参数的内联查询，并了解如何安全地利用它们。\n\
  \n## 构建参数化查询\n\n构建和执行无参数查询的用途较少，而任何应用程序中的大多数用途都基于参数/条件。在平面/原始查询中引入参数会使我们面临 SQL 注入的威胁。我们该如何保护应用程序免受此类威胁？在现实世界的应用程序中，我们不能忽视它们，因为有些应用程序严重依赖内联查询。\n\
  \nSQL 注入是黑客用来攻击任何系统的一种技术，它会在安全方面从根本上动摇系统。攻击者可以通过将用户输入盲目嵌入内联 SQL 查询来实施攻击。\n\n最常见的注入值是\
  \ `OR 1 = 1`，它会导致返回整个记录集，而不是使用输入值进行过滤。例如，在我们的博客系统中，如果黑客试图检索用户信息，他可以篡改以下查询（假设系统中存在这样的查询）：\n\
  \n```\nSELECT * FROM USERS WHERE Id = ' + userId + '.userId\n```\n\n考虑到应用程序传入的 `userId`\
  \ 为 5，该查询可以构造如下：\n\n```\nSELECT * FROM USERS WHERE Id = 5\n```\n\n上述查询只显示/返回 Id\
  \ 为 5 的一个用户。\n\n如果黑客注入前面提到的值，查询将变为如下：\n\n```\nSELECT * FROM USERS WHERE Id = 5 OR\
  \ 1 = 1\n```\n\n上述 SQL 注入会返回所有用户的信息，而不是仅返回 ID 为 5 的用户。这是一个简单的 SQL 注入示例。\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_185_0.png)\n\
  \n参数化查询是用于保护我们免受此类威胁的机制。它们确保 SQL 注入不会发生，使用参数化查询时，前面提到的注入问题也不会出现：\n\n```\npublic\
  \ async Task<IActionResult> Details(int? id)\n{\n    if (id == null)\n    {\n  \
  \      return NotFound();\n    }\n\n    var blog = await _context.Blogs.FromSql(\"\
  Select * from dbo.Blog WHERE Id = {0}\", id).FirstOrDefaultAsync();\n    if (blog\
  \ == null)\n    {\n        return NotFound();\n    }\n\n    return View(blog);\n\
  }\n```\n\n除了直接在 FromSql 方法中将输入值作为参数传递外，我们还可以使用 SqlParameter 对象来构造参数，这同样可以确保查询免受\
  \ SQL 注入。以下代码演示了在 EF Core 中执行参数化查询：\n\n```\npublic async Task<IActionResult> Details(int?\
  \ id)\n{\n    if (id == null)\n    {\n        return NotFound();\n    }\n\n    var\
  \ blog = await _context.Blogs.FromSql(\"Select * from dbo.Blog WHERE Id = @id\"\
  , new SqlParameter(\"id\", id)).FirstOrDefaultAsync();\n    if (blog == null)\n\
  \    {\n        return NotFound();\n    }\n\n    return View(blog);\n}\n```\n\n\
  以下屏幕截图像往常一样显示一个博客项，其之前的状态没有任何变化。唯一的区别在于它是通过参数化查询呈现的：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_187_0.png)\n\
  \n如果我们尝试通过以下任一方式注入值，由于我们处理的是以整数形式公开的标识符，系统仍然会由模型绑定器本身处理注入。让我们访问以下路径：\n\n```\nhttp://localhost:54346/Blogs/Details/1OR1=1\n\
  ```\n\n```\nhttp://localhost:54346/Blogs/Details?id=1OR1=1\n```\n\n尝试访问上述任一链接都会抛出以下错误：\n\
  \n![](img/17e01f90db603e72c0f0c6a7dce8920c_188_0.png)\n\n为了便于讨论，让我们将标识符的参数类型改为字符串，并再次向\
  \ `Details` 操作注入该值，以了解参数化查询实际上是如何处理 SQL 注入的。从下图中可以明显看出，参数化查询试图将该值转换为整数，但转换失败，执行被停止，从而保护应用程序免受\
  \ SQL 注入攻击：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_188_1.png)\n\n还是不相信？我也不相信。除非我们处理字符串列上的注入，否则我无法相信。为了演示，让我们对系统稍作修改，添加以下操作：在\
  \ Title 列中使用通配符搜索来过滤博客，从结果集中返回第一项，并最终在现有的 Details 视图中渲染它：\n\n```\npublic async Task<IActionResult>\
  \ GetBlogByTitle(string keyword)\n{\n    if (keyword == null)\n    {\n        return\
  \ NotFound();\n    }\n\n    var blog = await _context.Blogs.FromSql(\"Select * from\
  \ dbo.Blog WHERE Title like '%' + @keyword + '%',\n    new SqlParameter(\"keyword\"\
  , keyword)).FirstOrDefaultAsync();\n    if (blog == null)\n    {\n        return\
  \ NotFound();\n    }\n\n    return View(\"Details\", blog);\n}\n```\n\n尝试像之前一样注入值，访问以下路径：\n\
  \n```\nhttp://localhost:54346/Blogs/GetBlogByTitle/keyword=core OR 1=1\nhttp://localhost:54346/Blogs/GetBlogByTitle?keyword=core\
  \ OR 1=1\n```\n\n系统仍然会处理注入，但这次是在数据库端处理，因为该值会被当作字符串值。查询无法返回任何记录，因此操作返回 NotFound()：\n\
  \n![](img/17e01f90db603e72c0f0c6a7dce8920c_189_0.png)\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_190_0.png)\n\
  \n## 安全阀产品使用说明\n\n### 1. 产品概述\n\n本安全阀适用于压力系统，当系统压力超过设定值时，阀瓣自动开启，排放介质，保护设备安全；当压力恢复正常后，阀门自动关闭。该产品采用弹簧直接加载式结构，具有结构紧凑、密封可靠、启闭灵敏等特点。\n\
  \n### 2. 主要技术参数\n\n| 项目 | 参数 |\n|------|------|\n| 公称通径 | DN25~DN100 |\n| 公称压力 |\
  \ 1.6MPa |\n| 适用介质 | 空气、水、蒸汽 |\n| 适用温度 | -20℃~+120℃ |\n| 阀体材质 | 碳钢、不锈钢 |\n| 排放压力\
  \ | ≤1.1倍整定压力 |\n| 回座压力 | ≥0.85倍整定压力 |\n| 密封性 | 零泄漏 |\n| 连接方式 | 法兰、螺纹、焊接 |\n\n###\
  \ 3. 安装要求\n\n- 安全阀应垂直安装于压力容器或管道的最高点。\n- 安装前应清除管道内杂质，防止异物损伤密封面。\n- 安全阀排放口应引至安全地点，避免介质喷出伤及人员。\n\
  - 安装位置应便于检修和日常维护。\n\n### 4. 调试方法\n\n1. 松开锁紧螺母，旋动调节螺杆，改变弹簧预紧力。\n2. 升压至整定压力，观察阀瓣是否在设定值时开启。\n\
  3. 若开启压力不符，重新调节螺杆并再次升压校验。\n4. 确认合格后，拧紧锁紧螺母并加铅封。\n\n### 5. 维护保养\n\n- 定期检查密封面有无损伤，如有划痕应及时研磨修复。\n\
  - 定期校验整定压力，确保在校验周期内运行。\n- 阀体表面应有防锈涂层，室外安装应加装防护罩。\n- 对长期不动作的安全阀，应定期进行手动排放试验。\n\n\
  ### 6. 注意事项\n\n- 严禁将安全阀作为截止阀使用。\n- 严禁随意拆卸铅封或调整整定压力。\n- 排放管道应有足够的支撑，避免附加载荷传递至阀体。\n\
  - 若发现泄漏或异常振动，应立即停机检修。\n\n> 注意：安全阀应每年至少校验一次，由具有资质的检测机构进行。\n\n## 使用 LINQ 进行组合\n\n\
  到目前为止，我们执行的都是平面 SQL 查询。这并不涉及 LINQ 查询。如果我们有一种机制可以借助平面查询与 LINQ to SQL 查询的组合，那么我们就能兼得两者之长。幸运的是，Entity\
  \ Framework 提供了内置支持，平面 SQL 查询可以与 LINQ 查询组合使用，我们将在本节中详细讨论。\n\n让我们注释掉 LatestBlogs()\
  \ 中的当前实现，并使用与 LINQ 组合的平面查询来实现 SP。理想情况下，我们想要实现的是：使用 LINQ 查询获取表数据，并将结果与 LINQ 查询组合，以通过\
  \ LINQ 查询执行过滤和排序（这可能不是实际场景，但非常适合演示）：\n\n```\npublic async Task<IActionResult> LatestBlogs()\n\
  {\n    // return View(\"Index\", await _context.Blogs.FromSql(\"EXEC [dbo].[GetLatestBlogs]\"\
  ).ToListAsync());\n    var comparisonDateTime = DateTime.Now.AddMonths(-3);\n  \
  \  return View(\"Index\", await _context.Blogs\n        .FromSql(\"Select * from\
  \ dbo.Blog\")\n        .Where(x => x.CreatedAt >= comparisonDateTime)\n        .OrderByDescending(x\
  \ => x.Id)\n        .ToListAsync());\n}\n```\n\n我们可以看到结果符合预期，与之前最新博客的结果集一致，如下图所示：\n\
  \n![](img/17e01f90db603e72c0f0c6a7dce8920c_191_0.png)\n\n\n\n\n\n让我们进一步深入探究内部发生了什么，以及\
  \ Entity Framework 是如何处理这些查询的。我们可能会认为 EF Core 会检索博客条目并使用内存中的数据执行 LINQ 查询。下面的 **SQL\
  \ Server Profiler** 跟踪将证明我们是错误的。如果我们仔细观察跟踪中突出显示的部分，就很明显 Entity Framework 是通过将 LINQ\
  \ 查询翻译成所需的 SQL 查询并一次性在数据库中执行来实现 LINQ 到 SQL 查询的。很酷，对吧？下面的截图将说明参数化执行被翻译成 SQL 语句的情况：\n\
  \n![](img/17e01f90db603e72c0f0c6a7dce8920c_192_0.png)\n\n我们已经研究了如何使用 LINQ 组合扁平 SQL\
  \ 查询的机制，但我们还没有介绍 `Include()` 数据，而这正是 Entity Framework 的一项强大功能。你猜对了，我们也可以对由 LINQ\
  \ 查询组成的扁平 SQL 查询执行 `Include()` 操作。我们需要做的就是像往常一样在 `.ToList()` 调用之前加上 `.Include()`\
  \ 方法，这会将 LINQ 查询翻译成 SQL 查询。下面的代码将使用 `.Include()` 功能：\n\n```\npublic async Task<IActionResult>\
  \ LatestBlogs()\n{\n    //return View(\"Index\", await _context.Blogs.FromSql(\"\
  EXEC [dbo].\n        [GetLatestBlogs]\").ToListAsync());\n}\n```\n\n同样的操作也适用于第一个博客\
  \ Posts 数组中的第二个帖子项，这确保了 `Include()` 方法按预期工作，为博客项返回对应的帖子：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_194_0.png)\n\
  \n作为额外检查，我们可以验证第二个博客项及其对应的单个帖子，该帖子也被包含在内：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_195_0.png)\n\
  \n我们已经看到了 `Include()` 功能如何与使用 LINQ 组合的扁平 SQL 查询一起工作；让我们看看它是如何被翻译成 SQL 查询的（LINQ to\
  \ SQL）。下面的截图显示我们执行了两个 SQL 语句，其中第一个语句与之前从 `Blog` 表检索数据的语句类似：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_196_0.png)\n\
  \n第二个语句为我们完成了任务，执行了将帖子表数据包含到 LINQ 查询中的所需代码。这在下面的截图中有所体现：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_197_0.png)\n\
  \n在本节中，我们已经了解了如何使用 LINQ 将扁平 SQL 查询消费为 SQL 查询，到目前为止我们已经看到了相对于 DBSet 或 POCO 对象的扁平\
  \ SQL 查询的执行。让我们研究一下在 *Executing SQL query without a DBSet or POCO* 部分是否可以匿名实现同样的功能。\n\
  \n## Executing SQL query without a DBSet or POCO\n\n我们需要研究 Microsoft 是否支持在不需要 DBSet\
  \ 或 POCO 对象的情況下匿名执行扁平 SQL。由于它是开源的，我们很容易调查这一点。我们可以直接进入 GitHub 仓库（https://github.com/aspnet/EntityFramework）中的源代码，调查他们是否对预期行为有任何实现。\n\
  \nMicrosoft 确实为关系数据库提供了一个外观的几个扩展方法，可在 https://github.com/aspnet/EntityFramework/blob/0024373adae7e331ed217de2b4bd12be5eedf925/src/EFCore.Relational/RelationalDatabaseFacadeExtensions.cs\
  \ 获取。\n\n位于前述 GitHub 位置的扩展方法如下所示。我们需要捕获它，因为我们将在本节中讨论其实现：\n\n![](img/17e01f90db603e72c0f0c6a7dce8920c_198_0.png)\n\
  \n他们对原始 SQL 查询有实现，但这是一个有限的实现。它具有 `ExecuteSqlCommand`，仅支持 `ExecuteNonQuery` 功能，这意味着我们不能使用此方法来处理返回结果集的\
  \ SQL 查询：\n\n```\n```csharp\npublic static int ExecuteSqlCommand(\n    [NotNull]\
  \ this DatabaseFacade databaseFacade,\n    RawSqlString sql,\n    [NotNull] params\
  \ object[] parameters);\n\n// Note that this method doesn't start a transaction\
  \ hence it doesn't use ExecutionStrategy\npublic static int ExecuteSqlCommand(\n\
  \    [NotNull] this DatabaseFacade databaseFacade,\n    [NotNull] FormattableString\
  \ sql)\n    => ExecuteSqlCommand(databaseFacade, sql.Format, sql.GetArguments());\n\
  \n// Note that this method doesn't start a transaction hence it doesn't use ExecutionStrategy\n\
  public static int ExecuteSqlCommand(\n    [NotNull] this DatabaseFacade databaseFacade,\n\
  \    RawSqlString sql,\n    [NotNull] IEnumerable<object> parameters)\n{\n    Check.NotNull(databaseFacade,\
  \ nameof(databaseFacade));\n    Check.NotNull(sql, nameof(sql));\n    Check.NotNull(parameters,\
  \ nameof(parameters));\n\n    var concurrencyDetector = databaseFacade.GetService<IConcurrencyDetector>();\n\
  \n    using (concurrencyDetector.EnterCriticalSection())\n    {\n        var rawSqlCommand\
  \ = databaseFacade\n            .GetRelationalService<IRawSqlCommandBuilder>()\n\
  \            .Build(sql, parameters);\n\n        return rawSqlCommand\n        \
  \    .RelationalCommand\n            .ExecuteNonQuery(\n                databaseFacade.GetRelationalService<IRelationalConnection>(),\n\
  \                rawSqlCommand.ParameterValues);\n    }\n}\n```\n```\n\n同样的实现也有异步版本，这告诉我们在计划扩展我们的需求时需要执行两个实现。下面的截图将显示异步实现：\n\
  \n```\n154 RawSqlString sql,\n155 CancellationToken cancellationToken = default(CancellationToken)\n\
  156 => ExecuteSqlCommandAsync(databaseFacade, sql, Enumerable.Empty<object>(), cancellationToken);\n\
  157\n158 // Note that this method doesn't start a transaction hence it doesn't use\
  \ ExecutionStrategy\n159 public static Task<int> ExecuteSqlCommandAsync(\n160 [NotNull]\
  \ this DatabaseFacade databaseFacade,\n161 RawSqlString sql,\n162 [NotNull] params\
  \ object[] parameters)\n163 => ExecuteSqlCommandAsync(databaseFacade, sql, (IEnumerable<object>)parameters);\n\
  164\n165 // Note that this method doesn't start a transaction hence it doesn't use\
  \ ExecutionStrategy\n166 public static async Task<int> ExecuteSqlCommandAsync(\n\
  167 [NotNull] this DatabaseFacade databaseFacade,\n168 RawSqlString sql,\n169 [NotNull]\
  \ IEnumerable<object> parameters,\n170 CancellationToken cancellationToken = default(CancellationToken)\n\
  171 {\n172 Check.NotNull(databaseFacade, nameof(databaseFacade));\n173 Check.NotNull(sql,\
  \ nameof(sql));\n174 Check.NotNull(parameters, nameof(parameters));\n175\n176 var\
  \ concurrencyDetector = databaseFacade.GetService<IConcurrencyDetector>();\n177\n\
  178 using (await concurrencyDetector.EnterCriticalSectionAsync(cancellationToken))\n\
  179 {\n180 var rawSqlCommand = databaseFacade\n181 .GetRelationalService<IRawSqlCommandBuilder>()\n\
  182 .Build(sql.Format, parameters);\n183\n184 return await rawSqlCommand\n185 .RelationalCommand\n\
  186 .ExecuteNonQueryAsync(\n187 databaseFacade.GetRelationalService<IRelationalConnection>(),\n\
  188 rawSqlCommand.ParameterValues,\n189 cancellationToken);\n190 }\n```\n\nEF Core\
  \ 社区针对我们的需求创建了一个开放问题，可在 https://github.com/aspnet/EntityFramework/issues/1862#issuecomment-220787464\
  \ 获取。\n\n在前述问题线程中，用户 sirentek 为我们在 Microsoft 在框架中修复之前提供了一个变通方法。让我们实现匿名 SQL 查询执行所需的扩展方法：\n\
  \n- 1. 创建一个 DatabaseExtensions 静态类来保存扩展方法。\n- 2. 实现 `ExecuteSqlQuery` 用于返回结果集的 SQL\
  \ 查询，而 `ExecuteSqlCommand` 不返回任何内容。\n- 3. 实现 `ExecuteSqlQueryAsync` 用于异步操作，与 Microsoft\
  \ 的 `ExecuteSqlCommandAsync` 实现相匹配。\n\nMicrosoft 目前没有计划在 EF Core 2.0 中包含它们，甚至也不在当前时间。这与我们之前讨论的匿名类型支持类似：\n\
  \n```\npublic static class DatabaseExtensions\n{\n    public static RelationalDataReader\
  \ ExecuteSqlQuery(this\n        DatabaseFacade databaseFacade, string sql, params\n\
  \        object[] parameters)\n    {\n        var concurrencyDetector =\n      \
  \      databaseFacade.GetService<IConcurrencyDetector>();\n        using (concurrencyDetector.EnterCriticalSection())\n\
  \        {\n            var rawSqlCommand = databaseFacade\n                .GetService<IRawSqlCommandBuilder>()\n\
  \                .Build(sql, parameters);\n\n            return rawSqlCommand\n\
  \                .RelationalCommand\n                .ExecuteReader(\n         \
