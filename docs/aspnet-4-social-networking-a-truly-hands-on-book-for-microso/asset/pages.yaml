- pgno: 127
  md: 'If we only had this code, we wouldn''t have any navigation. This is where the
    `OnItemDataBound="repPrimaryNav_ItemDataBound"` property comes in handy. It basically
    states that the `repPrimaryNav_ItemDataBound()` method will be our `OnItemDataBound`
    event handler.


    This method will be responsible for displaying all the links. It also takes care
    of formatting the links to properly show which section you are in.


    ```

    protected void repPrimaryNav_ItemDataBound(object sender,\n    RepeaterItemEventArgs
    e)\n{\n    HyperLink linkPrimaryNav = e.Item.FindControl("linkPrimaryNav")\n                              as
    HyperLink;\n    SiteMapNode node = (SiteMapNode) e.Item.DataItem;\n    linkPrimaryNav.Text
    = node.Title;\n    linkPrimaryNav.NavigateUrl = node.Url;\n    if (node == _navigation.CurrentNode
    || node ==\n                                      _navigation.CurrentNode.ParentNode)\n    {\n        linkPrimaryNav.CssClass
    = "PrimaryNavLinkActive";\n    }\n\n    //TODO: For Chapter 3 these links will
    be kept disabled\n    linkPrimaryNav.Enabled = false;\n}

    ```


    # # Summary


    In this chapter we implemented user registration. This allowed us to gather data
    about our users so that they could become a member of our community. In addition
    to gathering the data, we briefly covered the ways to store some of the more important
    information. We also created a reCAPTCHA tool to reduce the amount of spam our
    community would have to deal with. We also provided some tools for the newly registered
    users so that they could remind themselves of their passwords and edit their account
    data. Once the registration tools were put in place, we then discussed and implemented
    an easy way to manage site-wide navigation and security.


    With the account creation and management tools in place, we can now move on to
    other chapters. It was important to get this chapter under our belts as all the
    following chapters will use many of the features we created here.'
  merge: -1
  img_proc: true
