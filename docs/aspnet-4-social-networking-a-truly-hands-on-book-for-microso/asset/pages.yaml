  md: "# Upload avatar\n\nPretty much all the work for this feature occurs in the\
    \ presenter. The UI presents a file upload box with a standard browse button and\
    \ an additional button to submit the selected file. When the Submit button is\
    \ clicked, the view passes the PostedFile to the UploadFile() method of the presenter.\n\
    \n```\n//Fisharoo/Web/Profiles/Presenters/UploadAvatarPresenter.cs\npublic void\
    \ UploadFile(HttpPostedFile File)\n{\n    string extension = Path.GetExtension(File.FileName).ToLower();\n\
    \    string mimetype;\n    byte[] uploadedImage = new byte[File.InputStream.Length];\n\
    \    switch (extension)\n    {\n        case \".png\":\n        case \".jpg\"\
    :\n        case \".gif\":\n            mimetype = File.ContentType;\n        \
    \    break;\n        default:\n            _view.ShowMessage(\"We only accept\
    \ .png, .jpg, and .gif!\");\n            return;\n            break;\n    }\n\
    \    if (File.ContentLength / 1000 < 1000)\n    {\n        File.InputStream.Read(uploadedImage,\
    \ 0, uploadedImage.Length);\n        profile.Avatar = uploadedImage;\n       \
    \ profile.AvatarMimeType = mimetype;\n        profile.UseGravatar = 0;\n     \
    \   _profileRepository.SaveProfile(profile);\n        _view.ShowCropPanel();\n\
    \    }\n    else\n    {\n        _view.ShowMessage(\"The file you uploaded is\
    \ larger than the 1mb limit. Please reduce the size of your file and try again.\"\
    );\n    }\n}\n```"
