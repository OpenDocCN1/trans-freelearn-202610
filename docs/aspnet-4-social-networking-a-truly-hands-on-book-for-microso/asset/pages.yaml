    ```\n\nAs you can see, this method accepts a **Dictionary** collection, that contains\
    \ a list of **FileIDs** and fileDescriptions. We then open up the DataContext.\
    \ Then from the Dictionary collection we get a list of unique **FileIDs**. We\
