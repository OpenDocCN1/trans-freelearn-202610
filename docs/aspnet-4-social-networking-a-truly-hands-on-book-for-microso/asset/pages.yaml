- pgno: 339
  md: '# 11

    User Interactivity


    Giving our users the ability to comment, tag, and rate the content on our site
    provides them a level of interactivity that will make them want to come back again
    and again. There are mainly two reasons for these features to arouse the curiosity
    of users. First, it is human nature to want to provide their opinions about anything
    available to them. Once a group of users has offered its opinion on everything,
    you will find that a second group of users will rear their heads to look at and
    interact with the highest rated, most heavily commented and tagged content.


    In this chapter, we will delve into what it takes to create a flexible system
    that will allow us to tag, rate, vote, and comment any object in our system (at
    the database level). We will apply tagging, rating, and commenting systems to
    our photo gallery section and vote, mark as answer, and medals to our forums section.
    Tagging and commenting will be somewhat straightforward in that they will simply
    take raw user input and tie it to the various content areas. The rating system
    on the other hand will use the ASP.NET AJAX library to provide multiple attributes
    in a modal window with the rating control, which when aggregated will provide
    us with an average score for that item.'
  merge: -1
  img_proc: true
