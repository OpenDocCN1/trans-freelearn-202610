- pgno: 293
  md: "Notice that the first part of this method is just like every other save method.\
    \ If the ID of the object being saved is greater than zero, we reattach the object\
    \ to the data context as a new version of that object. We then call the SaveChanges()\
    \ method and persist it back to the database.\n\nThis is where everything else\
    \ changes. If the item is a new post or thread then we have a whole bunch of things\
    \ to do. The first thing that we want to do is get the parent objects. We get\
    \ the BoardCategory and BoardForum off the post's related ForumID. We then check\
    \ to see if the new post is also a thread. If it is, then we update the ThreadCount\
    \ for our parent objects.\n\nIf the post is just a post then we update the PostCount\
    \ for the parent objects. We also get that post's parent thread. With the parent\
    \ thread in hand we update the reply count. We then perform the task that we are\
    \ used to and insert the object. Finally we call the SaveChanges method on the\
    \ data context.\n\nFinally, we come to the DeletePost method. Remember that a\
    \ post can also be a thread which means that it can have children. We can't delete\
    \ a thread that has children as this will create a referential integrity issue\
    \ (also called dirty data) for us.\n\n```\npublic void DeletePost(BoardPost boardPost)\n\
    {\n    using (FisharooDataContext dc = _conn.GetContext())\n    {\n        dc.BoardPosts.Attach(boardPost);\n\
    \        //If this is a thread then we need to delete all of\n        //it's children\n\
    \        if (boardPost.IsThread)\n        {\n            IEnumerable<BoardPost>\
    \ posts = dc.BoardPosts\n                .Where(bp => bp.ThreadID == boardPost.PostID)\n\
    \                .ToList();\n            foreach(BoardPost bp in posts)\n    \
    \        {\n                dc.BoardPosts.DeleteObject(bp);\n            }\n \
    \       }\n        dc.BoardPosts.DeleteObject(boardPost);\n        dc.SaveChanges();\n\
    \    }\n}\n```\n\nSo, in order for us to address this issue, we have to test the\
    \ post that is up for deletion to see if it is also a thread with its IsThread\
    \ property. If there is, then we iterate through the BoardPost and delete by calling\
    \ DeleteObject() on the BoardPosts collection."
