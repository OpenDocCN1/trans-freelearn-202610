- pgno: 391
  md: '# # 12

    ## Moderation


    We are finally at a point where we have a community with pretty much every feature
    that represents a great community. To that point, a lot of the things that we
    allow our users to create are text-based or resource-based content items such
    as images, movies, and so on. This is wonderful! Now all we have to do is deploy
    our site, invite some users, and watch our community grow.


    Not so fast! Allowing your user base to have complete freedom in filling your
    site with content is not a good idea. It means that you don''t have any control
    over the destiny of your site. It also means that you will eventually have someone
    adding inappropriate material. You might even have a tech-savvy user attempting
    to steal some of your user''s information for less than appropriate ventures.
    All these issues might eventually drive out all the good users leaving you only
    with bad users. Possibly, in the worst case, you might end up with legal issues
    on your hands due to the actions of your uncontrolled users.


    We don''t mean to scare you. We only mean to inform you that with a community
    driven by your user''s content, you will need to take some responsibility and
    keep a tight grip on the reigns. This tight grip that we''re talking about is
    what this chapter is all about.


    In this chapter, we will discuss various forms of moderation. With user-generated
    content, we can take advantage of user-generated moderation. After all, why not
    give the offended a method to report what offended them? We will also discuss
    gagging users who are habitual offenders. And we will create a filter that will
    block bad words, and competitor''s spams.'
  merge: -1
  img_proc: true
- pgno: 392
  md: '# Problem


    The core problem in this chapter is that we do not want to give willy-nilly control
    to our user base. We should maintain as much control over our site as possible
    with regards to what goes into it and what is displayed on it. Let''s discuss
    the core features.


    # Community moderation


    The user moderation takes place with a simple AJAXed ImageButton that allows them
    to flag inappropriate content inline along with the content.


    ![](img/15a62e134135dde036b0ac3cbb01dab6_392_0.png)


    The content that is flagged by the community will show up in the administration
    console under the Moderation section as shown in the following screenshot. Here
    you can approve or deny the content.


    ![](img/15a62e134135dde036b0ac3cbb01dab6_392_1.png)'
  merge: -1
  img_proc: true
- pgno: 393
  md: '# # Gagging users


    Once you have a list of moderated content, you will eventually start to notice
    some repeat offenders. For that reason, we need a way to slap the hands of those
    offenders. When viewing your flagged content, you will also see the owner of the
    content. If you find that you are seeing repeat offenders, you can apply a Gag
    to the user. A Gag will restrict the user from continuing to add content to the
    site as a form of punishment for bad behavior. Part of the Gag is to specify the
    reason and the date that the Gag order ends, as shown in the following screenshot.
    If you don''t want to specify an end data, you can apply a 20 year ban!


    ![](img/15a62e134135dde036b0ac3cbb01dab6_393_0.png)


    # # Dynamic filter


    The dynamic filter will address a few issues. You can use it to effectively remove
    profanity from your site. You can also use it to intercept competitor postings
    or advertisements on your site. And most importantly, you can use it to restrict
    the types of scripting that you allow. This tool could block HTML, JavaScript,
    and just about anything else that you don''t want on your site, which can aid
    you in dealing with cross-site scripting issues.'
  merge: -1
  img_proc: true
