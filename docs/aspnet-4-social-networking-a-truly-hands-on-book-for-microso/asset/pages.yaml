- pgno: 342
  md: 'In the modal window, the user will have several dynamically generated attributes
    to apply individual ratings to. All these ratings are then aggregated to provide
    the final rating for that item. Once we have received the rating for an item,
    we will thank the user for his/her input and then display the average rating as
    shown in the next screenshot:


    ![](img/15a62e134135dde036b0ac3cbb01dab6_342_0.png)


    # Tagging


    Tagging is a feature that allows us to attach keywords to any object (images in
    our case). Each keyword has a score attached to it that allows us to build a tag
    cloud with the largest tags shifted to the top showcasing the keywords that have
    the most use in the system. This particular control will be created in a flexible
    manner that allows us to capture new tags, display the tags that are attached
    to an object, display tags that are attached to a section, and those attached
    to the entire site.


    We allow users to tag an image and then display the tags as sub cloud for that
    image.


    ![](img/15a62e134135dde036b0ac3cbb01dab6_342_1.png)'
  merge: -1
