- pgno: 126
  md: "# Security\n\nUp until now we have discussed navigational aspects of this class.\
    \ But seeing how security is rolled into this so deeply, it makes sense that we\
    \ would also have something to check the current node for security reasons rather\
    \ than just displaying links. This brings us to the CheckAccessForCurrentNode()\
    \ method.\n\nThe CheckAccessForCurrentNode() method wraps the CheckAccessForNode()\
    \ method and passes in the current SiteMap node. If there is sufficient access\
    \ to the current node, no action is performed. However, if access to the current\
    \ node is denied, then the user is automatically redirected to the access denied\
    \ page by way of the Redirector class.\n\n# Implementing navigation and security\n\
    \nWith this wrapper in place we now have a way to easily restrict where our users\
    \ go and what forms of navigation they see. All we have to do is make calls into\
    \ this class to get a list of nodes for the appropriate navigation section. We\
    \ also need to make a call into the CheckAccessForCurrentNode() method at some\
    \ global point.\n\nIn our case these calls will be made from our master page as\
    \ it controls both global access and navigational display. So the first thing\
    \ we will do is add a call to the CheckAccessForCurrentNode() in the Page_Load()\
    \ method of the Site.Master.cs page.\n\n```\nprotected void Page_Load(object sender,\
    \ EventArgs e)\n{\n    _navigation.CheckAccessForCurrentNode();\n    ...\n}\n\
    ```\n\nFor navigational purposes (not really covered too much to this point) we\
    \ have a simple repeater that will iterate over SiteMapNodes. In the design view\
    \ we have a repeater that looks like this:\n\n```\n<asp:Repeater ID=\"repPrimaryNav\"\
    \ OnItemDataBound=\"repPrimaryNav_ItemDataBound\" runat=\"server\">\n    <ItemTemplate>\n\
    \        <asp:HyperLink ID=\"linkPrimaryNav\" CssClass=\"PrimaryNavLink\" runat=\"\
    server\"></asp:HyperLink>\n    </ItemTemplate>\n</asp:Repeater>\n```\n\nThen for\
    \ the Page_Load() method, we have the following binding code in the Master page's\
    \ code behind:\n\n```\nrepPrimaryNav.DataSource = _navigation.PrimaryNodes();\n\
    repPrimaryNav.DataBind();\n```"
