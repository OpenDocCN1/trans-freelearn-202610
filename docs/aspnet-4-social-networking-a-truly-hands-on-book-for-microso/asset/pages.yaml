- pgno: 46
  md: '# Voting


    Voting is a way to moderate the content on a community site and also recognize
    people who are contributing by providing valuable comments in forums. Users need
    to have the right to vote positively and negatively on a question or a reply posted
    on the forum. This helps other users to not read the entire question and associated
    replies, but focus on those that are voted higher. Similar to *Mark as Answer*,
    Voting also helps build an individual''s reputation.


    # Medals


    Once users start to accrue points based on their replies that are either marked
    as answers or voted in favor of, they start to earn medals. This is a visual indication
    of their reputation (see the following screenshot) on the site and the higher
    the number of medals, the higher the confidence that community will have in what
    this person has to say.


    ![](img/15a62e134135dde036b0ac3cbb01dab6_46_0.png)


    # Framework


    Anyone can build a mom and pop community site with the features that we discussed.
    However, if you want to build a site that can grow with your community, we will
    want to start building it in a certain way from the beginning. For that reason
    we will follow a few design patterns and concepts upfront. We will use an n-layered
    approach to build our site using Domain-driven design, Model View Presenter, Factory
    Pattern, and Repository Pattern. We will also make use of **Managed Extensibility
    Framework (MEF)**, the ADO.NET Entity framework and related tools and Windows
    Server AppFabric that Microsoft has provided with .NET 4 as well as a few great
    open source tool sets such as Lucene.NET, and MemCached.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# # Scaling up


    Once we have our core community built out, we will begin discussing some concepts
    to help you support a large number of users on your social network. We will discuss
    how application can be tiered, transformed into Service Oriented Architecture
    (SOA), deployment on IIS and look at some key concepts around web farming. We
    will discuss how to create and search indexed data with Lucene.NET. We will also
    cover how to optimize your data retrieval and content creation by implementing
    a caching farm inside your web farm using the new Windows Server AppFabric or
    MemCached Win32 server. We can also look at optimizing our email communications
    by implementing some form of mail queuing concepts.


    # # Summary


    We have taken a look at some of the features that constitute a social networking
    site and looked at some examples of successful community sites. Next, we discussed
    key features that a community site must provide and also briefly looked at POST
    and SLATES. Finally, we discussed what features we will build through the course
    of this book.'
  merge: -1
  img_proc: true
