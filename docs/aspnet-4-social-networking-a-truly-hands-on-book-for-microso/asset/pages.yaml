- pgno: 239
  md: '![](img/15a62e134135dde036b0ac3cbb01dab6_239_0.png)


    # # Files


    The most important thing to consider storing while in the database is of course
    our primary interest files. As with most other conversations regarding a physical
    binary file we always have to consider if we want to store the file in the database
    or on the file system. In this case we think it makes sense to store the file
    (and in the case of a photo, its various generated sizes) on the file system.
    This means that we will only be storing metadata about each file in our database.


    The most important field here to discuss is the **FileSystemName**. As you can
    see this is a GUID value. We will be renaming uploaded files to GUIDs in addition
    to the original extension. This allows us to ensure that all the files in any
    given folder are uniquely named. This removes the need for us to have to worry
    about overwriting other files.


    Then we see the **FileSystemFolderID**. This is a reference to the **FileSystemFolders**
    table, that lets us know the root folder location where the file is stored.


    Next on our list of items to discuss is the **IsPublicResource** flag. By its
    name it is quite clear that this flag will set a file as public or private and
    can therefore be seen by all or by its owner (**AccountID**).'
  merge: -1
  img_proc: true
- pgno: 240
  md: '# Media Galleries


    We then come to a field that may be somewhat confusing: **DefaultFolderID**. This
    has nothing to do with the file system folders. This is a user created folder.
    When files are uploaded initially they are put in a virtual folder. That initial
    virtual folder becomes the file''s permanent home. This doesn''t mean that it
    is the file''s only home. As you will see later we have the concept that files
    can live in many virtual folders by way of subscription to the other folders.


    # File system folders


    As mentioned previously, the **FileSystemFolders** table is responsible for letting
    us know where our file''s root directory is. This allows us to expand our system
    down the road to have multiple roots, that could live on the same server but different
    disks, or on totally different servers. The fields in the table are **Key**, **Path**
    (URL), and a **Timestamp**.


    # File types


    The FileTypes table will help us to keep track of what sort of files we are storing
    and working with. This is a simple lookup table that tells us the extension of
    a given file.


    # Folders


    Folders are virtual in this case. They provide us with a way to specify a container
    of files. In our case we will be containing photos, in which case folders will
    act as photo albums. The only field worth explaining here is the flag **IsPublicResource**,
    which allows us to specify whether a folder and its resources are public or private,
    that is, viewable by all or viewable only by the owner.


    # Folder types


    The FolderTypes table allows us a way to specify the type of folder. Currently
    this will simply be Name, photos, movies, and so on. However, down the road you
    may want to specify an icon for each folder type in which case this is the place
    where you would want to assign that specification.


    # Account folders


    In the AccountFolders table we are able to specify additional ownership of a folder.
    So in the case that a folder is a public resource and external resources can own
    folders, we simply create the new ownership relationship here. This is not permanent
    ownership. It is still specified with the Folders table''s **AccountID**. This
    is a temporary ownership across many Accounts.'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'As you can see in the previous screenshot we have the owner (**AccountID**)
    and the folder that is to be owned (**FolderID**).


    # Account files


    Similar to the AccountFolders table, the AccountFiles table allows someone to
    subscribe to a specific file. This could be used for the purposes of **Favorites**
    or similar concepts. The makeup of this table is identical to AccountFolders.
    You have the owner and the file being owned.


    # Folder files


    The FolderFiles table allows an Account to not only subscribe to a file, similar
    to the Favorites concept, but it also allows a user to take one of my files and
    put it into one of their folders as though the file itself belonged to them.


    As you can see in the previous screenshot this is primarily a table that holds
    the keys to the other tables. We have the **FolderID**, **FileID**, and **AccountID**
    for each file. This clearly specifies who is taking ownership of what and where
    they want it to be placed.


    # Creating the relationships


    Once all the tables are created we can then create all the relationships.


    For this set of tables we have relationships between the following tables:


    +   - **Files and FileSystemFolders**

    +   - **Files and FileTypes**

    +   - **Files and Folders**

    +   - **Files and Accounts**

    +   - **Folders and Accounts**

    +   - **Folders and FolderTypes**

    +   - AccountFolders and Accounts

    +   - AccountFolders and Folders

    +   - AccountFiles and Accounts

    +   - AccountFiles and Files

    +   - FolderFiles and Accounts

    +   - FolderFiles and Folders

    +   - FolderFiles and Files'
  merge: -1
  img_proc: true
- pgno: 242
  md: "# Setting up the data access layer\n\nThe data access layer can be set up in\
    \ a similar manner as done in earlier chapters. We need to open Fisharoo.edmx\
    \ file, right-click and select **Update Model from Database**, and select the\
    \ new tables. Save the file and you now have the domain objects to work with for\
    \ this chapter.\n\n# Building repositories\n\nWith the addition of new tables\
    \ will come the addition of new repositories so that we can get the data stored\
    \ in those tables. We will be creating the following repositories to support our\
    \ needs.\n\n+   - `FileRepository`\n+   - `FolderRepository`\n\nEach of our repositories\
    \ will generally have a method for selecting by ID, select all by parent ID, save,\
    \ and delete. Once you have seen one repository you have pretty much seen them\
    \ all. Review previous chapters, the appendices, or the included code for examples\
    \ of a standard repository. Here we will discuss anything that varies from the\
    \ standard!\n\n# FileRepository\n\nOther than the normal methods that all the\
    \ XRepository classes have, the FileRepository also has a couple of additional\
    \ more interesting methods.\n\n+   - `UpdateDescriptions`\n+   - `DeleteFilesInFolder`\n\
    +   - `DeleteFileFromFileSystem`\n\nThe UpdateDescriptions() method is an interesting\
    \ concept. This method is the first example of performing multiple updates all\
    \ at once rather than doing them one at a time. This obviously will be much more\
    \ performance-oriented than individual update executions.\n\n```\n///Fisharoo/DataAccess/Repositories/FileRepository.cs\n\
    public void UpdateDescriptions(Dictionary<int,string> fileDescriptions)\n{\n \
    \   using(FisharooDataContext dc = conn.GetContext())\n    {\n        List<Int64>\
    \ fileIDs = fileDescriptions.Select(f => Convert.ToInt64(f.Key)).Distinct().ToList();\n\
    \        IEnumerable<File> files = dc.Files.Where(f => fileIDs.Contains(f.FileID));\n\
    ```"
  merge: -1
  img_proc: true
