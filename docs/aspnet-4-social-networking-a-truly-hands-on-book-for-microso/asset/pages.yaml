    \ the request and make these two users friends, via the **FriendService** we discussed\
    \ earlier. However, before making friends, we need to validate if the friend request\
    \ is really meant for the account that has been logged into. If not we display\
    \ appropriate error message and don't allow the user to log in.\n\n```\n```csharp\n\
