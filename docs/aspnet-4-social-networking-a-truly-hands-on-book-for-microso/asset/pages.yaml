- pgno: 453
  md: '**Horizontal partitioning** is where you would take a physical set of data
    – the whole row – and store it in an identical table (schema wise). Each set is
    generally a ranged set of data. So for an ordering system you might put one quarter
    worth of data in table A, another quarter in table B, and so on. Generally, you
    would want to work with dates or numbers or geographies as your range set. However,
    in our case, we would only know the users by their usernames and passwords. So
    we might keep an indexed table of Usernames and UserIDs. Once we have the User''s
    ID, we could then go to a partitioned table of user data partitioned on UserID
    in the range of 1-100000, 100001-200000, and so on. Horizontal partitions speed
    up queries due to the fact that we are working with smaller sets of data. Also
    we can easily and quickly work with smaller sets of data in terms of adding to
    and deleting from those sets.


    > If you follow the Cloud Computing related trends, you would know what Microsoft''s
    Azure Table storage essentially follows this horizontal partitioning pattern.


    We will focus on how to build and utilize a partitioned table. Keep in mind that
    we only need to do this once the database has gotten to a point where it is starting
    to feel a bit sluggish (actually, you want to do this prior to feeling sluggish!).
    These are the general steps for creating the horizontal partition:


    +   1. Create filegroups if you want to put the data on multiple physical disks.
    This is the best way to feel the most gain out of this particular performance
    hop up. This way when you are querying across the partition, the work is split
    up across multiple disks.

    +   2. Create a partition function. This defines the range that we will be working
    with.

    +   3. Create a partition scheme. This allows us to specify which partition sits
    on which filegroup.

    +   4. With these steps out of the way, we can then start to create the partition
    tables.


    # FileGroups


    To create a new filegroup, use this syntax:


    ```

    Alter Database Fisharoo ADD FILEGROUP FG1

    ```'
  merge: -1
  img_proc: true
- pgno: 454
  md: "Once the filegroup is created, you can then add files to it.\n\n```\nALTER\
    \ DATABASE Fisharoo\nADD FILE\n(\n    NAME = FILE1,\n    FILENAME = 'c:\\Projects\\\
    Fisharoo\\Trunk\\DataBase\\ FILE1.ndf',\n    SIZE = 1MB,\n    MAXSIZE = 10MB,\n\
    \    FILEGROWTH = 1MB\n)\nTO FILEGROUP FG1;\n```\n\nYou can add as many files\
    \ to the file group as you think you will need. One file per disk per partition\
    \ is the best thing you could do! You can always add to and modify this later.\n\
    \n# Partition function\n\nTo create a partition function, use the following code:\n\
    \n```\nCREATE PARTITION FUNCTION pfAccounts(int)\nAS\nRANGE LEFT FOR VALUES(10,000,20,000,30,000)\n\
    ```\n\nThis partition function specifies that there will be three partitions.\
    \ Each partition will hold 10,000 account records (you would probably want to\
    \ define larger ranges). In the first partition, we will have accounts 1 through\
    \ 10,000. The second partition will have 10,001 through 20,000. The third partition,\
    \ that is, the final one will have accounts 20,001 through 30,000.\n\n# Partition\
    \ scheme\n\nTo create a partition scheme use the following code (assuming that\
    \ you made these file groups):\n\n```\nCREATE PARTITION SCHEME psAccounts\nAS\n\
    PARTITION pfAccounts TO (FG1,FG2,FG3,[PRIMARY])\n```\n\nIf you only have one file\
    \ group defined then you can use this code:\n\n```\nCREATE PARTITION SCHEME psAccounts\n\
    AS\nPARTITION pfAccounts ALL TO (FG1)\n```"
  merge: -1
  img_proc: true
- pgno: 455
  md: "# # Partition tables\n\nWith these items in place we can then create the actual\
    \ partition table.\n\n```\nCREATE TABLE Accounts\n(\n    AccountID INT,\n    Username\
    \ VARCHAR(20),\n    ...\n)\nON psAccounts(AccountID)\n```\n\n# ## How does this\
    \ affect our current system?\n\nUnfortunately, this is not a behind-the-scenes\
    \ fix all for your system like the indexes are. Querying a partitioned table requires\
    \ a bit more syntax as you need to tell the SQL Server in which partition to look.\
    \ This is not overly complex though. To get the account of a user with an AccountID\
    \ of 25,000, you would run this query:\n\n```\nSELECT *\nFROM Accounts\nWHERE\
    \ $PARTITION.pfAccounts(AccountID) =\n      (SELECT $PARTITION.pfAccounts(25,000))\n\
    ```\n\nThe key here is the SELECT statement in the WHERE clause.\n\n```\nSELECT\
    \ $PARTITION.pfAccounts(25,000)\n```\n\nThis line returns the partition number\
    \ to search for based on the range value that we build our partition function\
    \ around. In this case, it knows that you are interested in the third partition.\
    \ So it returns a 3 as partition 3 holds the account with AccountID 25,000. Beyond\
    \ this querying, data is unchanged.\n\nTake a look at this resource for further\
    \ information regarding partitioned tables:\n\n**http://www.dotnetspider.com/resources/1082-Partitioning-Tables-SQL-SERVER.aspx**\n\
    \nFor SQL Server 2008 R2, look at\n\n**http://msdn.microsoft.com/en-us/library/ms188730.aspx**"
  merge: -1
  img_proc: true
- pgno: 456
  md: '# Scaling Up


    # Gotchas


    Do take note that table partitioning, as described in the previous section, is
    available only in the Enterprise Edition (EE) of SQL Server.


    Scaling is a wide subject area; we could go on and on. With constraint on the
    number of pages, we would like to close this discussion here and suggest that
    you take a look at this blog for some additional points:


    http://www.infosysblogs.com/microsoft/2009/10/considerations_for_developing.html


    # Searching


    Although a properly implemented set of indexes and a caching layer can really
    improve the performance of your site, it is not a fix all for everything. There
    is no reason to add search results to cache as each search could differ and produce
    different results. This would quickly fill our cache with bogus data. In addition
    to this shortcoming from cache, indexing doesn''t fix everything up either. While
    an index can add some new legs to our search, it is not the best option for searching
    as people are generally interested in searching fields of text (not something
    we would want to index). And while we could implement FREETEXT search capabilities
    in SQL Server, there are better solutions out there.


    In this section, we will discuss using Lucene.NET, which is a tool that allows
    you to index and search data efficiently. There are many big sites out there that
    currently use Lucene for their search capabilities, and we will show you how to
    do it. While we won''t be able to create a Google search engine, we can create
    all the fast searching features that any community site might need.


    > You can find Lucene here at: **http://incubator.apache.org/lucene.net/**.


    We talked about database optimizations from the point of view of creating indexes,
    streamlining our deletion process, and partitioning our data. It is apparent that
    the deletion process won''t help us here. Let''s discuss why the other two don''t
    really help us either.


    You might think that adding indexes to a table will help optimize our search process.
    But if you think about it, we need to search within the data of a column. We will
    rarely have the full string that exactly matches the string that is found. In
    addition to that, we need to be able to support something more than wild card
    searches. We also want to support Boolean searches, multiphrase queries, and so
    on. For these reasons, indexing doesn''t help us with searching.'
  merge: -1
  img_proc: true
