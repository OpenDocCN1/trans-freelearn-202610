- pgno: 395
  md: '# # Moderation


    For us to enable Moderation, we will take advantage of the same concepts that
    we used in Chapter 11. This feature will be implemented as another UserControl
    that we can plug in wherever we need it. As it will tie in to the SystemObjects
    table of objects, we are free to allow our users to moderate any database-oriented
    content — be it textual, image based, or just about anything else. As long as
    it has a record ID and a table associated to it, we can moderate it.


    In addition to letting our users flag content for approval, we will need to create
    a page to manage what was flagged. We will implement a simple administration page
    that will show everything that is listed. For each listed item we can approve
    or deny the content. Approved content will no longer be visible on the site. This
    page will also house our gagging capabilities, which we will discuss later.


    This structure is identical to our other users of the SystemObjects table. It
    has a SystemObjectID and a SystemObjectRecordID, which allow us to add a Moderation
    entry and see where it points to. When we build the administration page, you will
    see how we can use this data to get all the objects, regardless of the type, for
    administration viewing purposes. In addition to the SystemObjects table, we are
    also linking to the Accounts table with the AccountID of the account that published
    the questionable content and the AccountID of the user that took action on the
    questionable content. Tracking this second AccountID is useful as it helps us
    keep track of which user is raising flags. If we find that the content isn''t
    questionable, we can actually track the user who raised the request to find out
    if this is a malicious user attempting to get other innocent users banned.


    # ## Gags


    To gag a user—such as in a legal gag order—is to suppress them from being able
    to make comments publicly. We will extend this concept to say that we will not
    allow a user to publish content on our system if they have a gag order placed
    on them! As with flagging of questionable content, not having an automatic gagging,
    but having a moderator intervene will help to prevent instances where innocent
    users may otherwise be gagged.


    The most important thing to note in the Gags table is the GagUntilDate field as
    shown in the preceding screenshot. The date in this field is the date that the
    user can interact with the community again.'
  merge: -1
  img_proc: true
- pgno: 396
  md: '# Filtering


    The filtering system will provide us with the ability to map out content that
    we don''t want, and swap it with the content that we actually need. We will first
    address this simple mapping issue with the concept that someone has used foul
    language on our site. We will be able to add the word that we don''t like to our
    content filter list and insert a better word in its place so that our content
    is less offensive. In the case of the "dude" scenario we swapped in "[Filtered]".


    While our filter can and should be used in this simple way, it can also be used
    to destroy a client-side script. To possibly destroy a script, you can add these
    text strings to our filter list (two different entries) <script> and </script>
    along with an empty string as the replacement value. This will effectively replace
    all <script> and </script> entries with an empty string. This will leave the code/text
    between the remaining script tags. That would effectively break the script—we
    think.


    In order to just use this concept of filtering, we would have to have an extensive
    database of possible entries to test for. Not only is this difficult, it would
    also be tremendously inefficient! Even if we had the greatest dictionary in the
    world, there is still a chance that we could miss something. And of course it
    would be fairly ugly as you would have all the code that we didn''t catch displayed
    in the page. But at least they couldn''t run the script at that point. It''s a
    step in the right direction.


    In order to address the issue of unaccounted for tags, and to bypass the need
    for a tag library, we will use UrlEncode() on the string to be filtered prior
    to filtering it. The first pass of UrlEncode() will convert the <script> and </script>
    tags into &lt;script&gt; and &lt;/script&gt;. It will also convert all the other
    special characters in the entry and make them encoded as well. This effectively
    renders all the HTML, CSS, and JavaScript code useless!


    Now that we have killed all the possible markup and script in the text, what about
    the stuff that we want to allow on my site? We can make exceptions in our filter
    list by adding encoded words to be translated back to acceptable terms. In the
    case of a bold tag <b> the encode function would make it look like &lt;b&gt;.
    We can simply add the &lt;b&gt; to our list of words to be filtered with a replacement
    value <b>. Now we can build back what we want to accept. An acceptance list is
    much easier to manage than a database of possibilities for the content to be filtered.


    # Solution


    Now let''s take a look at the solution.'
  merge: -1
  img_proc: true
