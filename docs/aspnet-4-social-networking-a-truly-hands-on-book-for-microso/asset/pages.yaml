- pgno: 103
  md: "The View passes a reference of itself to the presenter by way of the interface\
    \ that defines the view. Using the interface provides us with a decoupled structure.\
    \ This is what allows us to easily swap out our UI if we so choose. As long as\
    \ the UI implements the interface appropriately it can use the presenter.\n\n\
    The presenter is the acting controller in this scenario. Once it is spun up and\
    \ has a reference to the code behind, it can actively decide how to handle events\
    \ in the front end. The presenter is also the only part of our front end that\
    \ is capable of interacting with our domain logic (or model).\n\nIn the following\
    \ sections, we will discuss the login process. This is more to illustrate how\
    \ the MVP pattern works and less about ASP.NET, as the code itself is very simple.\n\
    \n> An **Account** folder was created when we created the ASP.NET 4 application\
    \ (in Chapter 2). It added basic files related to login, user registration, changing\
    \ the password, etc. along with the code that uses ASP.NET membership services.\
    \ However, since we wanted to write custom logic for authentication and authorization,\
    \ we deleted all files in this folder and wrote custom logic as discussed in the\
    \ following sections.\n\n# View\n\nWe will start with the front end ASP.NET code.\
    \ It basically defines a username and password text box and a button to click\
    \ for login. It also has two link buttons for simple navigational tasks—one to\
    \ go to the recover password page and another to take you to the registration\
    \ page.\n\n```\n```aspx\n//Fisharoo/Web/Account/Login.aspx\n<%@ Page Language=\"\
    C#\" MasterPageFile=\"~/Site.Master\"\nAutoEventWireup=\"true\" CodeBehind=\"\
    Login.aspx.cs\"\nInherits=\"Fisharoo.Web.Account.Login\" %>\n\n<asp:Content ContentPlaceHolderID=\"\
    Content\" runat=\"server\">\n    <div class=\"divContainer\">\n        <div class=\"\
    divContainerBox\">\n            <fieldset class=\"login\">\n                <legend>Enter\
    \ your Username and Password</legend>\n                <asp:Table CssClass=\"\
    tableLogin\" runat=\"server\">\n                    <asp:TableRow>\n         \
    \               <asp:TableCell HorizontalAlign=\"Left\">\n                   \
    \         <asp:Panel ID=\"Panel1\"\nDefaultButton=\"btnLogin\" runat=\"server\"\
    >\n                                <p>\n                                    <asp:Label\
    \ ID=\"UserNameLabel\"\n```\n```"
