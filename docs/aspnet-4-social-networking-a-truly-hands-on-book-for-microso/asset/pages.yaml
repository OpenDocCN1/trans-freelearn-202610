    \        HttpContext.Current.Request.RawUrl);\n    }\n}\n```\n\nThe ProfileDisplay\
    \ control also has a couple of properties—one to show/hide the delete friend button\
    \ and the other to show/hide the invite friend button. These buttons are not appropriate\
    \ for every page that the control is used in. In the search results page we want\
    \ to hide the Delete button as the results are not necessarily friends. We would\
