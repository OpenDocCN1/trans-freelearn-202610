- pgno: 149
  md: '# Other services


    +   - **Profile Attribute service:** This service is responsible for assembling
    a `ProfileAttribute` with its corresponding `ProfileAttributeType` based on the
    `ProfileAttributeTypeID` that is stored with the `ProfileAttribute`. This is pretty
    straightforward to implement as it simply makes a call into the `ProfileAttributeRepository`
    to get a list of `ProfileAttributes` by the specified `ProfileID`. We have just
    implemented this from a code completion perspective. This service may not be invoked
    or used as we are already loading all the `ProfileAttribute` with each Profile
    in `ProfileRepository.cs`

    +   - **Level of Experience type service:** This is a simple wrapper service that
    invokes the `LevelOfExperienceTypeRepository` to get the list of all levels of
    experience types. This is written to avoid the presentation layer directly invoking
    the repository classes.

    +   - **Permission service:** This is similar to `LevelOfExperienceTypeService`
    and invokes method on `PermissionRepository` to get the permissions associated
    with names as used in the `Web.sitemap`.


    Check out the code associated with this chapter to look at the details of these
    services.


    # Implementing the presentation layer


    Now that the entire backend is created and ready to go, let''s move on to discussing
    how we will make the presentation work for us. While the privacy features could
    just as easily be implemented after everything else, we think it will be easiest
    if we get it ready first. Then as we build the other areas out, we can sew in
    our privacy checking where it is needed.


    # Privacy


    Now, let''s implement the privacy feature.'
