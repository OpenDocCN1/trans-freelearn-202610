- pgno: 97
  md: "# # Implementing the application layer\n\nThis layer can be called as application\
    \ or business logic or components or services layer. In our code, we have called\
    \ this as **Components**. They are all one and the same. This layer should be\
    \ relatively thin and lightweight. It is not supposed to hold any business logic\
    \ or data access logic. It is more of a working layer that is responsible for\
    \ keeping the business layer easier and cleaner to use. Often, it will combine\
    \ several items from the business layer and several methods from the data layer\
    \ to present an easy-to-use interface for a complex task.\n\nAn example of this\
    \ would be our AccountService. The AccountService provides a few simple methods\
    \ that utilize several of our more infrastructure-oriented classes. Here is the\
    \ code:\n\n```\n```csharp\n//Fisharoo/Components/AccountService.cs\nnamespace\
    \ Fisharoo.Components\n{\n    [Export(typeof(IAccountService))]\n    public class\
    \ AccountService : IAccountService\n    {\n        [Import]\n        private IAccountRepository\
    \ _accountRepository;\n        [Import]\n        private IPermissionRepository\
    \ _permissionRepository;\n        [Import]\n        private IUserSession _userSession;\n\
    \        [Import]\n        private IRedirector _redirector;\n        [Import]\n\
    \        private IEmail _email;\n        public AccountService()\n        {\n\
    \            MEFManager.Compose(this);\n        }\n        public bool UsernameInUse(string\
    \ Username)\n        {\n            Account account =\n                _accountRepository.GetAccountByUsername(Username);\n\
    \            if(account != null)\n                return true;\n            return\
    \ false;\n        }\n    }\n}\n```\n```"
