  md: "# GagRepository\n\nThere are two methods in this repository that we will discuss:\n\
    \n+   - **GetActiveGags()** will give us the ability to get a listing of all the\
    \ Gags in the system so that we can manage who is gagged, who is about to be ungagged,\
    \ and possibly a user who may need a Gag extension.\n+   - **IsGagged()** will\
    \ allow us to check to see if a user is currently gagged. It will allow us to\
    \ restrict a gagged user from creating new content. We can also use it to make\
    \ changes to the display such as hiding the new post button.\n\n```\n```csharp\n\
    //Fisharoo/DataAccess/Repositories/Gagpository.cs\npublic List<Gag> GetActiveGags()\n\
    {\n    List<Gag> result = new List<Gag>();\n    using(FisharooDataContext dc =\
    \ conn.GetContext())\n    {\n        result = dc.Gags.Where(g => g.GagUntilDate\
    \ >\n            DateTime.Now).OrderBy(g => g.GagUntilDate).\n            ToList();\n\
    \    }\n    return result;\n}\npublic bool IsGagged(Int32 AccountID)\n{\n    bool\
    \ result = false;\n    using(FisharooDataContext dc = conn.GetContext())\n   \
    \ {\n        if(dc.Gags.Where(g=>g.AccountID == AccountID &&\n            g.GagUntilDate\
    \ > DateTime.Now).\n            FirstOrDefault() != null)\n        {\n       \
    \     result = true;\n        }\n    }\n    return true;\n}\n```\n```\n\n# ContentFilterRepository\n\
    \nThe ContentFilterRepository currently has only one job. It returns a list of\
    \ all the filters in the system."
  merge: -1
  img_proc: true
- pgno: 404
  md: "# Implementing the services/application layer\n\nOnce all the repositories\
    \ are built for single-serving purposes, we can begin to create the service layer.\
    \ Again this layer is responsible for assembling aggregates and performing complex\
    \ actions with our entities. We will create and modify the following services:\n\
    \n+   - ContentFilterService\n+   - Extensions\n\n# ContentFilterService\n\nThe\
    \ ContentFilterService is responsible for applying our ContentFilters. This method\
    \ consolidates the call into the ContentFilterRepository, the HtmlEncode() of\
    \ the string, and the actual work of applying the filters to the string being\
    \ filtered.\n\n```\n//Fisharoo/BusinessLogic/ContentFilterService.cs\npublic string\
    \ Filter(string StringToFilter)\n{\n    List<ContentFilter> _contentFilters =\
    \ _contentFilterRepository.GetContentFilters();\n    StringBuilder sb = new StringBuilder(StringToFilter);\n\
    \    //encode the final output for further security\n    sb = new StringBuilder(HttpUtility.HtmlEncode(sb.ToString()));\n\
    \    //replace all the dirty words and forbidden tags\n    foreach (ContentFilter\
    \ cf in _contentFilters)\n    {\n        sb.Replace(cf.StringToFilter, cf.ReplaceWith);\n\
    \    }\n    return sb.ToString();\n}\n```\n\nOur initial entry into this method\
    \ provides us with the string that we will be working with. Next, we get a list\
    \ of ContentFilters to work with. In order to work with our string in a more efficient\
    \ manner we are going to create a new StringBuilder. Our first pass of filtering\
    \ our string will start with encoding our string using the HttpUtility.HtmlEncode()\
    \ method. Once we have our base string to work with, we can begin iterating over\
    \ our collection of ContentFilters. With each ContentFilter, we perform a Replace()\
    \ where we swap out our StringToFilter for our ReplaceWith value. We then convert\
    \ our StringBuilder back to a string prior to returning the result of our filtering\
    \ process."
  merge: -1
  img_proc: true
