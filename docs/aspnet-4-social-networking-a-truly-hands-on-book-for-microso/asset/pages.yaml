- pgno: 49
  md: '# 2


    # An Enterprise Approach to our Community Framework


    We have all worked on application development. It typically starts small with
    limited feature requirements and doesn''t seem to have a need in the future. However,
    then you found yourself constantly adding features to this application. It continued
    to grow and grow uncontrollably. Had you known that this application was going
    to be so important and was going to be used so extensively, you would probably
    have built it differently? It is most likely that you would have designed your
    application with extensibility in mind rather than just hurrying to get the project
    finished and out of the door!


    # Application design


    The application design is as follows:


    # Key principles


    While designing Fisharoo solution, we will try to adhere to certain architecture
    principles, some of the important ones are:


    +   - **Modular and Loosely Coupled**: We will try to build Fisharoo by dividing
    the related functionality into various modules having no or relatively low inter-dependencies.

    +   - **Separation of Concerns (SoC)**: It is the process of breaking down your
    application into specific units of functionality in such a way that each unit
    only addresses the needs of one concern with as little overlap as possible with
    other units in terms of functionality. More information regarding this topic is
    at: http://en.wikipedia.org/wiki/Separation_of_concerns.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '+   - **Extensibility:** We will try to build the greater part of the application
    in extensible manner so that if needed to we can replace parts of the functionality
    without having to recompile the entire application or even redesign.

    +   - **Build versus Buy:** Wherever possible we will try and utilize out-of-box
    functionality in the .NET stack or look for third party/open source components
    that can help fill the gap.


    Each of the above principles is discussed in the following section. As we go along,
    we will also see how they can be realized with the help of technology and architectural
    patterns.


    # Layered architecture


    Knowing that our application is going to be a large undertaking that should last
    for some time, we need to design something that can be easily extended as the
    need arises. For that we will try to design this application with extensibility
    in mind. The easiest way to do that is to follow the general rule of maintaining
    "separation of concerns (SoC)".


    # Layers


    The easiest way to maintain SoC is to first break major areas of your application
    into layers. In most applications, this might be broken down into the presentation,
    business logic, and data access layers.


    +   - **Presentation Layer:** This layer would normally hold anything pertaining
    to the user interface of your application—the buttons, links, and other controls
    that a user would click on and interact with while using your application.

    +   - **Business Logic Layer:** This is where the rules of your application would
    live. This could be as simple as formatting the currency of a price in your product
    catalogue to something more complex such as enforcing rules regarding data input.

    +   - **Services Layer:** While building **Service Oriented Architecture (SOA)**,
    services layer is built on top of the business logic layer. Since we are not aiming
    SOA implementation we will not create this layer. However, in Chapter 13, we will
    show you how to introduce this layer in the existing design without a lot of changes.

    +   - **Data Access Layer:** The data access layer is responsible for connecting
    to a data source and interacting with the data that is stored in that location.
    This could be a database, some XML files, text files, or even a web service.'
  merge: -1
  img_proc: true
