- pgno: 82
  md: '# User Accounts


    Having said that forcing your users to have a strong password, can become an inconvenience
    to them. Believe it or not, there are many users who would prefer to have a password
    as "password". While we are not for letting your users become lazy and placing
    their account at risk, you do need to be aware that there is a chance that you
    will lose signups due to this requirement. It is up to you to decide how important
    a secure site is.


    # Terms and conditions


    While terms and conditions are not a necessary requirement for a good site, this
    section is the place to cover the concept. We will create a simple way to manage
    your terms and conditions. Terms and conditions are a legal thing. Knowing that
    terms and conditions can change over time, it is important that you track which
    version of terms and conditions your users last agreed to. It is also important
    that you track when they agreed to them.


    # reCAPTCHA


    **CAPTCHA, or Completely Automated Public Turing test to tell Computers and Humans
    Apart,** is a form of challenge-response test to determine if the user of your
    site is a computer or human. reCAPTCHA is a CAPTCHA service from Google, that
    helps in digitizing books, newspapers, and old time radio shows.


    reCAPTCHA presents two words to the user and of these two, one is a word that
    the **Optical Character Recognition (OCR)** process is able to convert from image
    to text. The other is the word that the OCR cannot translate. The system assumes
    that if the user provided the right answer for the word for which the translation
    was known, the other one for which it wasn''t known is also translated correctly.
    The system will then reuse this new word in multiple instances to gain higher
    confidence in correctness of translation. reCAPTCHA provides plugins for various
    programming environments and we will be using the one for ASP.NET. For more details
    check out this website: **http://www.google.com/recaptcha.**


    Here is an example of an image that will be generated by our system:


    ![](img/15a62e134135dde036b0ac3cbb01dab6_82_0.png)'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# # Email confirmation and verification


    There are several reasons to use email communications in our community. For example,
    our site will require registration confirmation and email validation.


    When a user signs up at our site, we need to be able to let them know that the
    registration was completed successfully. This email will usually welcome a user
    to the site. It may also provide them with some frequently asked questions, a
    list of benefits received upon registration, and any other pertinent information
    that a user may need prior to using your site.


    In addition to the registration receipt, we need a way to check whether the email
    address that the user has provided is a valid account (that it actually exists),
    and one to which the user actually has access. We will validate this by embedding
    a link in the email that the user will have to click. Once this link is clicked,
    we will assume that the email address is valid!


    # # Security


    Security is obviously one of the most important aspects of building a site. Not
    only should you be able to provide access to certain areas of your site a specific
    user, but more important is the ability to deny access to various users of your
    site. All sites have areas that need to be locked down. For example, one of the
    most important areas could be the administration section of your site, or paid
    areas of your site. Therefore, it is very important to make sure that you have
    some form of security.


    # # Permissions


    There are a number of ways to handle permissions (also called as authorization).
    We could make something really complex by implementing a permission-based system
    using permissions, roles, groups, and so on. We could even make it as complex
    as Microsoft''s Active Directory system. However, I find that keeping something
    only as complex as your current requirement is the best thing to do. We can always
    add to the system as our needs increase.


    Our permissions system will simply encompass a name/role (Administrator, Editor,
    Restricted, and so on). This permission name will then be statically mapped to
    each page (using the **Sitemap** file that .NET provides us!). As long as we keep
    our pages to serve a single functionality, this should always suit our needs.
    As this is a good design practice anyway, we shouldn''t have any problems here.
    Of course, a user can have many permissions tied to their accounts so that they
    can traverse various sections of our site. Once this is in place, all we need
    to do is have a system that checks a user''s permissions upon entering each page
    to ensure that they have the permission that the page requires.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# User Accounts


    We will have a Permissions table, that relates to the Accounts table through the
    AccountPermissions table. This is a pretty straightforward and simple design.


    # Password encryption/decryption


    When working with passwords, there is an important question to answer. Do we have
    one way hashing, or do we store encrypted passwords and provide a way to decrypt
    them? If we don''t provide decryption facilities, then we won''t be able to send
    reminder emails to our users who have their passwords. If we were creating a banking
    system, sending passwords via email would not be acceptable. However, as we are
    creating something slightly less confidential, the convenience for users to be
    able to retrieve their passwords without too much hassle is a great reason for
    decrypting the password and sending it to the user.


    # Logging in


    Once a user has created an account, it is important for them to be able to re-identify
    themselves to us. For this reason, we will need to provide a way for them to do
    this. This will come in the form of a page that accepts a username and a password.
    Once they have authenticated themselves to us, we will need to make sure that
    they are still allowed to get into our site (if they are valid users).


    # Password reminder


    A user will inevitably forget his/her password. As we require a strong password,
    and a fair number of users would rather not have a password at all, or would like
    to use the word "password" as their password, it is highly possible that they
    forget what they registered with. Not a problem! As we decided to use a two-way
    encryption, we will be able to decrypt their chosen password and email it to them.
    This way, our user will never be locked out for too long!


    # Manage account


    In order to keep customer service calls to a minimum, we will need a way for our
    customers to manage their own accounts. Our customers will need a way to update
    most of the information they provide us. While we will not allow them to change
    their username, we will allow them to edit the rest. And when we allow them to
    change their email address we need to make sure that we force them to validate
    their new address.'
  merge: -1
