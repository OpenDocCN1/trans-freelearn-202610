  img_proc: true
- pgno: 290
  md: "This is a fairly straightforward method that gets a board category by its page\
    \ name.\n\n# BoardForumRepository\n\nThe BoardForumRepository also has a GetForumByPageName\
    \ method but it is exactly the same as the previous method BoardCategoryRepository.\n\
    \n# BoardPostRepository\n\nNow this repository is full of interesting items to\
    \ cover! To start, as our users will be creating posts and threads but will not\
    \ be allowed to create forums or categories, we need to be able to make sure that\
    \ they don't create page names that are not unique. It is no good to try to get\
    \ a thread by its name and end up getting several different threads instead of\
    \ just the one we expected.\n\n```\n```csharp\n//Fisharoo/DataAccess/Repositories/BoardPostRepository.cs\n\
