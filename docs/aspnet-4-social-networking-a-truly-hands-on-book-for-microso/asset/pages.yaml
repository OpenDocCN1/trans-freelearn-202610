- pgno: 146
  md: "# Account service\n\nNow that we have our ProfileService created, let's extend\
    \ our AccountService to take advantage of our new features. Note that we are loading\
    \ Profiles and AccountPermissions along with Account in AccountRepository.cs and\
    \ hence these will be available as navigational properties with account object.\
    \ Let's start by extending our Login method in the AccountService.cs file. When\
    \ the user attempts to log in, we get their account with the method that we just\
    \ extended (GetAccountByID). This means that we now have their profile as well!\
    \ We can now make a decision as to whether we have a user with a fully created\
    \ profile or not and redirect them accordingly. Let's update the AccountService.cs\
    \ Login() method with the following code:\n\n```\n//Fisharoo/BusinessLogic/AccountService.cs\n\
    if (account.EmailVerified)\n{\n    _userSession.LoggedIn = true;\n    _userSession.Username\
    \ = Username;\n    _userSession.CurrentUser = GetAccountByID(account.AccountID);\n\
    \    if(_userSession.CurrentUser.Profile != null &&\n        _userSession.CurrentUser.Profile.ProfileID\
