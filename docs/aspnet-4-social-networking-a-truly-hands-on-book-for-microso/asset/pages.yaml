- pgno: 413
  md: '# # 13

    ## Scaling


    If you have made it this far then you must be the proud new owner of a community
    site that is ready to start accepting new community members. We know from experience
    that you did not go this far to start a community that will only ever have 100
    users. You, like everyone else, would like very much to start building a social
    network that gets 100,000 or more active users. Ten thousand users is considered
    a success. One hundred thousand users and you might be able to sell your community
    to someone else.


    To get that many users to your site will require several things. You will have
    to have a great new concept for your site. Something that really makes it stand
    out as different. It will require excellent marketing skills either by way of
    viral marketing or through a more traditional marketing campaign. It will also
    mean that your site will need to stand up under a heavy daily load of users continuously
    until you reach your goals. This last point is what this chapter is all about.


    # ## Problem


    There are many aspects of a site with a large number of users that can bring the
    site to its knees. Some of this can be slowness of the features while others can
    be physically locking the system to a point that it is no longer responsive. In
    this chapter, we will address some of the possible issues that might come up with
    a community and ways to fix them.


    We will discuss issues at the database level in the form of indexing and partitioning
    our data. We will dive into how we can address scalability by application tier-ing,
    application slowness by throwing more hardware at it, and then load balancing
    that hardware. We will also discuss how to cache data dips and complex object
    creation so that we don''t have to perform the queries or object manipulation
    every time. Next, we will speed up our search by creating highly optimized, indexed
    data sets. And finally we will look at reducing the number of systems our website
    speaks to directly so that our user experience is not directly impacted by infrastructure.'
  merge: -1
  img_proc: true
