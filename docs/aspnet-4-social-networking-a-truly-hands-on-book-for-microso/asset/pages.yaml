    \                                          imageBytes.Length))\n{\n    ms.Write(imageBytes,\
    \ 0, imageBytes.Length);\n    System.Drawing.Image img =\n        System.Drawing.Image.FromStream(ms,\
    \ true);\n    Bitmap bmpCropped = new Bitmap(200, 200);\n    Graphics g = Graphics.FromImage(bmpCropped);\n\
    \    Rectangle rectDestination = new Rectangle(0, 0,\n                       \
    \       bmpCropped.Width, bmpCropped.Height);\n    Rectangle rectCropArea = new\
    \ Rectangle(X,Y,Width,Height);\n    g.DrawImage(img, rectDestination, rectCropArea,\n\
    \                GraphicsUnit.Pixel);\n    g.Dispose();\n    MemoryStream stream\
    \ = new MemoryStream();\n    bmpCropped.Save(stream,\n                    System.Drawing.Imaging.ImageFormat.Jpeg);\n\
    \    Byte[] bytes = stream.ToArray();\n    profile.Avatar = bytes;\n    _profileRepository.SaveProfile(profile);\n\
    }\n_view.ShowApprovePanel();\n```\n```\n\nThis method expects the X and Y coordinates\
    \ of where the crop is to start as well as the width and height of the crop. This\
    \ gives us the location of the square that we plan to extract from our uploaded\
    \ image.\n\nWe then load the image that is currently stored in the profile into\
    \ the `imageBytes` byte array. Once we have the data stored in the array, we load\
    \ it into the memory. Note that we perform this task inside a `using` statement.\
    \ This ensures that all the resources are released once we complete our operation.\n\
    \nWe then load the memory stream into an Image. Now, we create a new Bitmap object,\
    \ bmpCropped with the size of the avatar that we wish to achieve. This will store\
    \ our completed avatar. We then create a Graphics object, g, that will actually\
    \ carry out the cropping on the bmpCropped Bitmap. We are now ready to actually\
    \ perform the surgery on our image! We will start by creating two rectangles—one\
    \ rectangle to hold our final image, and the other to hold the image to be cropped\
    \ from our original image. We then call the DrawImage() method on our Graphics\
    \ object and pass in our Image, the destination coordinates, the crop coordinates,\
    \ and the unit of measure—pixels in this case. This results in the bmpCropped\
    \ image having the appropriately cropped portion of our originally uploaded image.\n\
    \nNow, we pass that new image back into memory. We then convert it into a byte\
    \ array, and finally save it back to our profile."
  merge: -1
  img_proc: true
- pgno: 164
  md: "# User Profiles\n\n# # Gravatar\n\nAs we discussed earlier, Gravatar is a service\
    \ that allows you to store your avatars in a central place. It allows you to associate\
    \ an avatar to your email address so that other sites (like ours) can reference\
    \ it later. This is great for a user who has profiles scattered all over the Internet!\n\
    \nIn order for our users to use the Gravatar service, all they have to do is check\
    \ the box on the initial page of the upload avatar screen. When they hit **submit**,\
    \ we set the UseGravatar property of their **Profile** to 1. Then whenever we\
    \ call the **ProfileImage.aspx** page to display the avatar, we must use the Gravatar\
    \ instead of the locally stored avatar.\n\nIn order to make a call into the Gravatar\
    \ service, we have to create an URL with a properly formatted email address in\
    \ the form of a hexadecimal MD5 hash. We created a method in our Cryptography\
    \ class to perform this conversion for us.\n\n```\npublic static string CreateMD5Hash(string\
    \ StringToHash)\n{\n    MD5 md5Hasher = MD5.Create();\n    byte[] data =\n   \
    \     md5Hasher.ComputeHash(Encoding.Default.GetBytes(StringToHash));\n    StringBuilder\
    \ sBuilder = new StringBuilder();\n    for (int i = 0; i < data.Length; i++)\n\
    \    {\n        sBuilder.Append(data[i].ToString(\"x2\"));\n    }\n    return\
    \ sBuilder.ToString();\n}\n```\n\nWe then created a simple extension method that\
    \ handles the conversion for us in a more simplified manner than calling into\
    \ the Cryptography suite directly.\n\n```\npublic static string ToMD5Hash(this\
    \ string s)\n{\n    return Cryptography.CreateMD5Hash(s);\n}\n```\n\nWith this\
    \ background let's see the method.\n\n```\n//Fisharoo/Web/Images/ProfileAvatar/ProfileImage.aspx.cs\n\
    public string GetGravatarURL()\n{\n    defaultAvatar = Server.UrlPathEncode(__webContext.RootUrl\
    \ +\n        \"/images/ProfileAvatar/Male.jpg\");\n    gravatarURL = \"http://www.gravatar.com/avatar.php?\"\
    ;\n    gravatarURL += \"gravatar_id=\" + account.Email.ToMD5Hash();\n```"
  merge: -1
  img_proc: true
- pgno: 165
  md: "```\ngravatarURL += \"&rating=r\";\ngravatarURL += \"&size=80\";\ngravatarURL\
    \ += \"&default=\" + defaultAvatar;\nreturn gravatarURL;\n}\n```\n\nThe properties\
    \ that we discussed are fairly easy to figure out. However, you can get a full\
    \ listing of how to work with the Gravatar service here: http://site.gravatar.com/site/implement#section_1_1.\n\
    \n# Public profile\n\nNow that we have figured out privacy, provided a way for\
    \ our users to manage their profile data, and allowed them to upload and appropriately\
    \ format their avatar, we need to provide our users with a page that displays\
    \ all their data.\n\nFor the most part this is simply another \"plumbing page\"\
    , meaning that we are just displaying the data here. Nothing overly complex! So\
    \ we will skip most of the legwork and get right to the nitty gritty, which is\
    \ how our privacy stuff is handled.\n\nIn the Profile.aspx page, we have stored\
    \ everything within the panels such as this:\n\n```\n//Fisharoo/Web/Profiles/Profile.aspx\n\
    <asp:Panel ID=\"pnlPrivacyAccountInfo\" runat=\"server\">\n    <fieldset>\n  \
    \      <div class=\"divContainerTitle\"> Account Info</div>\n        <table class=\"\
    profileInfo\">\n            <tr> <td>Email: </td>\n                <td><asp:Literal\
    \ ID=\"litEmail\" runat=\"server\" /></td>\n            </tr>\n            <tr>\
    \ <td>Zip:</td>\n                <td><asp:Literal ID=\"litZip\" runat=\"server\"\
    \ /></td>\n            </tr>\n            <tr> <td>Birthday: </td>\n         \
    \       <td><asp:Literal ID=\"litBirthDate\" runat=\"server\" />/</td>\n     \
    \       </tr>\n            <tr> <td>Updated: </td>\n                <td><asp:Literal\
    \ ID=\"litLastUpdateDate\" runat=\"server\" />\n                </td> </tr>\n\
    \        </table> </fieldset>\n</asp:Panel>\n```"
  merge: -1
  img_proc: true
- pgno: 166
  md: "# User Profiles\n\nThis allows us to easily lock down an area of data as needed\
    \ (to hide for example). In the presenter for this page, we have a TogglePrivacy()\
    \ method.\n\n```\n///Fisharoo/Web/Profiles/Presenters/ProfilePresenter.cs\nprivate\
    \ void TogglePrivacy()\n{\n    _view.pnlPrivacyIMVisible(_privacyService.ShouldShow((int)PrivacyFlagType.PrivacyFlagTypes.IM,_accountBeingViewed,\
    \ _account, _privacyFlags));\n    _view.pnlPrivacyAccountInfoVisible(_privacyService.ShouldShow((int)PrivacyFlagType.PrivacyFlagTypes.AccountInfo,_accountBeingViewed,\
    \ _account, _privacyFlags));\n    _view.pnlPrivacyTankInfoVisible(_privacyService.ShouldShow((int)PrivacyFlagType.PrivacyFlagTypes.TankInfo,_accountBeingViewed,\
    \ _account, _privacyFlags));\n}\n```\n\nThis method makes a call to the PrivacyService.ShouldShow()\
    \ method, that returns a Boolean value of whether or not the item should be displayed.\
    \ This Boolean value is directly set to the Panel.Visible property in the view\
    \ that effectively shows or hides the data in question.\n\n# Custom homepage\n\
    \nWhen we say \"custom homepage\", we are really referring to the public profile\
    \ page in an easy to get manner. This is really a fancy URL, something like **http://www.fisharoo.com/profiles/atulg\
    \ upta**. We could even take it as far as **http://atulg upta.fisharoo.com** or\
    \ something along those lines! We will however stick with the first example in\
    \ our case.\n\nTo implement this we will use ASP.NET Routing support. ASP.NET\
    \ 4 improves on its URL routing feature in a number of ways. These are now SEO-friendly\
    \ URLs and ASP.NET 4 MVC relies heavily on this feature. At the very core, URL\
    \ routing is a feature that allows your application to accept URLs that do not\
    \ map to physical files. The friendly URL that we mentioned above (**http://www.fisharoo.com/profiles/atulg\
    \ upta**) doesn't map to a physical file on the server, yet our application is\
    \ capable of serving it.\n\nImplementation logic for this is fairly straightforward.\
    \ We need to first define an URL pattern that we would like to accept as valid\
    \ for our application. This is added to a RouteTable. The entry in the table also\
    \ specifies which page to redirect to in case the pattern matches. Finally in\
    \ the specific page, we query for the values that were passed in to the page (similar\
    \ to query string parameters) and then go ahead and process in the way we want\
    \ to. The RouteTable entry is added to the Global.asax.cs file in Application_Start\
    \ method."
  merge: -1
  img_proc: true
- pgno: 167
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 168
  md: "The values from the routed URL are added to the RouteData collection and are\
    \ accessible from the Page class. We extract this value, cast it is as string\
    \ and then pass it to our presenter to take further action based on this value.\
    \ The specific part of the presenter's Init() method, which is of interest here\
    \ is as follows:\n\n```\nif (string.IsNullOrEmpty(username))\n    _accountBeingViewed\
    \ = userSession.CurrentUser;\nelse\n    _accountBeingViewed = accountService.\n\
    \        GetAccountByUsername(username);\n```\n\nIf the passed in username is\
    \ valid then we query for that account and display it. That's all there is to\
    \ URL routing and getting it to support our fancy URL requirement.\n\nIn case\
    \ you are wondering won't a direct call to the Profile.aspx page (http://www.fisharoo.com/profiles/profile.aspx)\
    \ match the URL route we have defined and the username parameter being set to\
    \ profile.aspx, the answer is No. The routing engine by default excludes all calls\
    \ that match to physical files.\n\n# News feed/Alerts\n\nThe last concept that\
    \ we will cover in our discussion about building profiles is news feed (or alerts).\
    \ A news feed allows us to see what we have been doing with our account, friends,\
    \ our photos, and any other changes in the system. More importantly, it will allow\
    \ us to see what our friends have been doing with all their data such as when\
    \ they add a new photo.\n\nThis system will be built on the alerts system that\
    \ we have already discussed. Any time we want to add a new alert to the system\
    \ based on an action performed by our user or the system, we simply make a call\
    \ into the AlertService and select the appropriate method such as AddNewAvatarAlert().\
    \ Once the site is peppered with the addition of alerts to the system we will\
    \ have fairly active news feed to follow. Now, we just need a place to read this\
    \ feed!\n\nKnowing that this news feed will easily be one of the most active pages\
    \ on our site, we should put it on the users' homepage so that they can see it\
    \ as soon as they log in. To implement this, all we need is a repeater with a\
    \ label in it, on the homepage, which we can hook up to a list of alerts for the\
    \ current user. See the code for //Fisharoo/Web/Profiles/Default.aspx page."
  merge: -1
  img_proc: true
- pgno: 169
  md: "Then from the presenter, we need to pass the view, the appropriate data to\
    \ bind to. We get the list of alerts, convert them into a list of strings and\
    \ pass it to the view to display.\n\n```\n///Fisharoo/Web/Profiles/Presenters/Defaultpresenter.cs\n\
    private void ShowDisplay()\n{\n    List<string> msgs = new List<string>();\n \
    \   List<Alert> alerts = _alertService.GetAlertsByAccountID(\n        _userSession.CurrentUser.AccountID);\n\
    \    foreach (Alert item in alerts)\n    {\n        msgs.Add(item.Message);\n\
    \    }\n    _view.ShowAlerts(msgs);\n}\n```\n\nOnce we get into the concept of\
    \ *Friends*, this page will be much more active as users can see their alerts\
    \ as well as their friends'!\n\n# Summary\n\nWe have covered a lot of ground in\
    \ this chapter. We have discussed the concept of a profile and a way for our users\
    \ to manage their data. We have also built a way for our users to manage their\
    \ privacy regarding their profile data. We have also created tools for our users\
    \ to manage a custom avatar as well as a way to hook up to their centrally stored\
    \ Gravatar. With all of these features out of the way, we have created a public\
    \ profile for our users. And finally, we also created a default landing page for\
    \ users where they can see their alerts."
  merge: -1
  img_proc: true
