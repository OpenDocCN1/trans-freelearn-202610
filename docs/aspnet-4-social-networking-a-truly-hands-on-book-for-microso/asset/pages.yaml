  md: "```\npublic void SendFriendRequest(Int32 AccountIdToInvite)\n{\n    _redirector.GoToFriendsInviteFriends(AccountIdToInvite);\n\
    }\n\npublic void DeleteFriend(Int32 FriendID)\n{\n    if (_userSession.CurrentUser\
