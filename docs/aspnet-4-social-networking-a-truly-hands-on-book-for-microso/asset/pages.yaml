  md: '# Data Access layer


    To implement the domain model as discussed in domain driven design section above,
    we will use the Entity Framework to create the data access layer. For this we
    need to add a new project to our solution. We will call it DataAccess.


    In this project, we will create two classes and one edmx file. The first class
    will be our connection object (named Connection.cs), and the second file will
    be called PersonRepository.cs. Once you have those class files created, add a
    new ADO.NET Entity Data Model by right-clicking the DataAccess project and select
    Add New Item. From the Data tab select ADO.NET Entity Data model as shown in the
    following screenshot:


    ![](img/15a62e134135dde036b0ac3cbb01dab6_74_0.png)


    Let''s call it Fisharoo.edmx. After this the wizard will drive you through various
    steps as explained below. Since we have already created a table in the database
    and want our model to be based on that table, we will select **Generate from database**
    in the first screen and click **Next**. Select appropriate connection string settings
    and click **Next**.


    In the next screen choose your Database objects from **Tables | Person** as follows
    and provide Model Namespace as **FisharooModel** and click **Finish**.'
