- pgno: 100
  md: "> The subject of Cryptography is an extensive one, and is beyond the scope\
    \ of this book. However, the Cryptography class that is included in this project\
    \ is heavily commented if you want to understand `System.Security.Cryptography.Rijndael`\
    \ a bit better! You can find that class in the **Common** project.\n\nTo start\
    \ let's look at how we were able to call `Encrypt()` from a **string** variable.\
    \ To achieve this is actually very simple. Although the **string** class is sealed,\
    \ meaning that we can't technically extend it in any way that we are used too,\
    \ we can use the feature of .NET called \"extension methods\".\n\n```\n```csharp\n\
    //Fisharoo/Common/Extensions.cs\nnamespace Fisharoo.Common\n{\n    public static\
    \ class Extensions\n    {\n        public static string Encrypt(this string s,\
    \ string key)\n        {\n            return Cryptography.Encrypt(s, key);\n \
    \       }\n        public static string Decrypt(this string s, string key)\n \
    \       {\n            return Cryptography.Decrypt(s, key);\n        }\n    }\n\
    }\n```\n```\n\nAn extension method allows us to extend a class without affecting\
    \ the way that it would normally work. The way to do this is by defining a static\
    \ method in a static class. The thing to notice is that the first parameter of\
    \ the method starts with the target type, a **string** in this case. Therefore\
    \ we have effectively defined an `Encrypt()` and `Decrypt()` method for the **string**\
    \ class. Note that the only difference between this method and one you would normally\
    \ write is the **this** reference preceding the first parameter. It's that simple!\n\
    \n# Implementing the domain layer\n\nAs we are using Entity Framework, it has\
    \ facilities that are now part of the .NET framework; our business layer has been\
    \ greatly simplified for us. We can recall that in our previous applications different\
    \ sorts of data access layers were used, that required us to spend a great deal\
    \ of time writing SQL in the database, connection logic, providers, and hydration\
    \ and persistence logic for objects. In addition to all that, we would still need\
    \ to define business objects. Of those objects, 95 percent of the logic was simply\
    \ to shuttle data around in a more manageable manner."
  merge: -1
  img_proc: true
- pgno: 101
  md: "With Entity Framework so much of this has gone away! We now have fully generated\
    \ classes that take care of shuttling our data around. But what happens if we\
    \ need custom logic? While we could simply add logic to the generated classes,\
    \ this would not be the best route. The next time we make a change we will have\
    \ to regenerate our classes. This would resort in the loss of all that custom\
    \ functionality.\n\nFortunately for us the classes that are generated are partial\
    \ classes. This means that we can make a new partial class file of the same name\
    \ within the same namespace and extend our generated classes. Here is our custom\
    \ Account object, which extends the generated Account object.\n\n```\n```csharp\n\
    //Fisharoo/DataAccess/Account.cs\nnamespace Fisharoo.DataAccess\n{\n    public\
    \ partial class Account\n    {\n        private List<Permission> _permissions\
    \ = new List<Permission>();\n        public List<Permission> Permissions\n   \
    \     {\n            get { return _permissions; }\n        }\n\n        public\
    \ void AddPermission(Permission permission)\n        {\n            _permissions.Add(permission);\n\
    \        }\n\n        public bool HasPermission(string Name)\n        {\n    \
    \        foreach (Permission p in _permissions)\n            {\n             \
    \   if (p.Name == Name)\n                    return true;\n            }\n   \
    \         return false;\n        }\n    }\n}\n```\n```\n\nWith this new partial\
    \ class, we can now extend our existing generated Account class. We have added\
    \ a few important features to the Account class. We now have methods for adding\
    \ and checking permissions. We also have a property that returns a list of permissions.\n\
    \nThis can easily be done for any partial class in our project!"
  merge: -1
  img_proc: true
