- pgno: 61
  md: '+   1. On loading, the view would instantiate its presenter. It then passes
    a reference of itself to that presenter by calling an **init** method in the presenter.

    +   2. This passes the control of the view to the presenter. The presenter is
    now responsible for initializing the page (loading the initial state of the page).

    +   3. The presenter works with our domain objects (the model) to get a list of
    people.

    +   4. The presenter then passes the newly acquired list of people to the view
    by calling appropriate method provided by the view.

    +   5. The view then attaches the list of people to the data source of a repeater
    and asks the repeater to bind on that list.


    If someone were to click on a person in that list, the process would be repeated
    up through the view, into the presenter, over some domain objects, and back down
    to the view.


    # Creating the .NET Solution


    So far we have looked at layering, MVP, MEF, and Entity Framework concepts, etc.
    Let''s now start with implementation and for that let''s create an empty .NET
    solution called Fisharou under which we can start creating various layers designed
    in the form of .NET projects.


    # Presentation layer


    In the Fisharou solution, create a new ASP.NET web application project, that will
    act as a presentation layer. We call it Web. Once the project is created you will
    see a structure as shown in following screenshot:


    ![](img/15a62e134135dde036b0ac3cbb01dab6_61_0.png)'
