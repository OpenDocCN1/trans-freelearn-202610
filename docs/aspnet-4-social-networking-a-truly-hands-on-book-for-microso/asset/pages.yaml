- pgno: 463
  md: '# Comparing ASP.NET MVP

    with ASP.NET MVC


    Web application development on Microsoft Platforms has evolved from CGI-based
    development to classic ASP pages to ASP.NET Web Form development to the most recent
    ASP.NET MVC. ASP.NET was introduced in early 2000 and it brought a significant
    change in the way web application were built and with its plethora of server controls
    (new controls were added with each new release), provided a tremendous productivity
    boost to application development.


    The ASP.NET Web Form development model looks at providing the Windows Form type
    application development environment to web developers. Windows Form development
    is itself highly influenced by the rapid application development environment that
    VB 6.0 (and earlier) offered.


    # ASP.NET Web Forms


    ASP.NET Web Forms solved a significant number of issues with the earlier classic
    ASP way of building web applications. Some of these are:


    +   - Less spaghetti code and cleaner separation of HTML and code across ASPX
    and code behind files

    +   - The ability to use first class citizen languages of .NET like C# and VB.NET

    +   - Compiled code which gives a boost to performance

    +   - The availability of server controls that enabled great productivity boost
    and helped write complex applications quickly

    +   - An eventing model that again made it easy to deal with user actions on the
    page'
  merge: -1
  img_proc: true
- pgno: 464
  md: '# Comparing ASP.NET MVP with ASP.NET MVC


    +   - ViewState and ASP.NET Engine helped handle retaining the data between post
    backs (this had its side effects as well)

    +   - Easy programming model and anyone can become productive quickly


    The other benefits, like a better threading model, garbage collection, etc. came
    along with the core .NET framework and very soon a lot of developers had jumped
    onto this technology.


    While this model solved lot of issues, it did introduce some of it''s own as well.
    Some of these are:


    +   - There isn''t much adherence to web programming standards, such as the MVC
    pattern

    +   - Testing ASP.NET applications isn''t easy

    +   - While business logic can still be tested, testing the UI code is a big hassle

    +   - The code itself didn''t promote separation of concerns and while spaghetti
    code was avoided in the ASPX page, it was seen at the backend in the mixing of
    data access logic with UI code

    +   - Building cross browser and accessible applications wasn''t always easy due
    to limited control over generated HTML


    However, all is not lost and some patterns did evolve to address some of these
    short comings.


    # Web presentation patterns


    Microsoft **Patterns and Practices (PnP)** team came up with various patterns
    categorized as Web Presentation patterns. These are as discussed briefly below.

    To know more details on these, check this: **http://msdn.microsoft.com/en-us/library/ff650511.aspx**.


    # Page cache


    Many times it happens that users accessing a web page get to view similar information
    on the page. The page itself is dynamically constructed, but possibly due to the
    nature of the query, the resultant view is similar. So similar to data caching
    that there is a way in which we can ASPX page caching itself by making use of
    the expiration policies. This behavior is what the Page Cache pattern supports.'
  merge: -1
  img_proc: true
