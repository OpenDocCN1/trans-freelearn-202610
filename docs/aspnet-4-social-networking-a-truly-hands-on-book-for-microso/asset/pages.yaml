  md: "# An Enterprise Approach to our Community Framework\n\nThis takes care of the\
    \ base framework for some demonstrations. Now, let's dig into those two class\
    \ files that we have created — **Connection.cs** file and the **PersonRepository.cs**\
    \ file. The **Connection** class gives us a way to encapsulate our **DataContext**\
    \ creation. It has one method that returns the **FisharooDataContext** object.\
    \ If we have more data contexts to work with down the road, they could go here\
    \ too and we can rename the current **GetContext()** method to a more meaningful\
    \ name.\n\n```\n```csharp\n//Fisharoo/DataAccess/Connection.cs\nnamespace Fisharoo.DataAccess\n\
    {\n    public class Connection\n    {\n        public static FisharooDataContext\
    \ GetContext()\n        {\n            FisharooDataContext fdc = new FisharooDataContext(ConfigurationManager.ConnectionStrings[\"\
    FisharooConnectionString\"].ToString());\n            return fdc;\n        }\n\
    \    }\n}\n```\n```\n\nNote that we are spinning up a new instance of our **FisharooDataContext**\
    \ class with a reference to our connection string that we had put in the **web.config**\
    \ file earlier.\n\nNow, let's move over to the **PersonRepository** class. The\
    \ Person table that we created earlier is only for demonstration purposes, and\
    \ so is the repository. Here is that class.\n\n```\n```csharp\n//Fisharoo/DataAccess/PersonRepository.cs\n\
    using System.Collections.Generic;\nusing System.ComponentModel.Composition;\n\
    using System.Linq;\nusing Fisharoo.Interfaces;\n\nnamespace Fisharoo.DataAccess\n\
    {\n    [Export(typeof(IPersonRepository))]\n    public class PersonRepository\
    \ : IPersonRepository\n    {\n        public List<string> GetAllNames()\n    \
    \    {\n            List<string> names = new List<string>();\n```\n```"
  merge: -1
  img_proc: true
- pgno: 77
  md: "```\nFisharooDataContext dc = Connection.GetContext();\n\nvar people = from\
    \ p in dc.People\n             select p;\n\nforeach (Person p in people)\n{\n\
    \    names.Add(p.FirstName + \" \" + p.LastName);\n}\n\nreturn names;\n}\n}\n\
    }\n```\n\nNote that it has an Export attribute so that we can swap the implementation\
    \ out later if we need to. As with all MEF classes (and for good design reasons)\
    \ we have also inherited from an IPersonRepository interface, which clearly defines\
    \ this class.\n\nThere is only one method in our repository now. It is responsible\
    \ for simply selecting all the people in the Person table and returning a list\
    \ of the first and the last names of those people. We have a list of type strings\
    \ for the names collection, which will be returned at the end of the method. We\
    \ then fetch our DataContext for our query. Once we have the DataContext defined,\
    \ we can perform our query.\n\nWe declare a local variable with the var keyword.\
    \ This allows us to declare a variable with a dynamic type. In this case, we will\
    \ be selecting a collection of our Person classes. But we don’t really know that\
    \ for sure! Nor do we really need to know that.\n\nThe query we see in the code\
    \ is to select all the people from the Person table and return a collection of\
    \ those people. It is very much like SQL, however in reverse order, i.e. from\
    \ comes first and select comes last. This is how LINQ queries are written and\
    \ it is due to this ordering that Visual Studio Intellisense works with.\n\nOnce\
    \ the query is executed the results are fetched into the people variable which\
    \ is of type ObjectSet<Person>. This helps us to iterate over it in a loop. When\
    \ we created edmx, Entity Framework automatically creates People ObjectSet as\
    \ part of FisharooDataContext class.\n\nFinally in the code we have a loop, where\
    \ we concatenate the first name and last name of each person and add them to our\
    \ names collection. Once this is completed, we simply return that collection back\
    \ to the user of this method."
