- pgno: 330
  md: "# Default\n\nThe homepage of our Groups section (see the first screenshot of\
    \ this Chapter), the default.aspx page, is responsible for listing all the groups\
    \ in the system when a user first enters this section of the site. This page makes\
    \ a call to the GroupService to get all the latest groups. It then binds that\
    \ collection of data to a ListView and outputs each group. Be aware that each\
    \ of the group names has actual links to the custom group PageName.aspx (we will\
    \ cover more on this in a moment). Nothing more to this page though.\n\nSee the\
    \ code for specific examples of how this works.\n\n# URL routing\n\nBefore we\
    \ dig too deep into data management, we find ourselves at a crossroads where we\
    \ need to dig into our URL routing again. As we have a PageName field in our Groups\
    \ we need to discuss how to handle Group PageNames. Once this is complete, we\
    \ can move on to pulling up and viewing a group. This is handled by creating an\
    \ additional routing entry in our route collection in global.ascx.cs in the RegisterRoutes\
    \ method.\n\n```\n//Fisharoo/Web/Global.ascx.cs\npublic static void RegisterRoutes(RouteCollection\
    \ routeCollection)\n{\n    routeCollection.MapPageRoute(\"GroupRoute\",\n    \
    \    \"groups/{groupname}.aspx\", \"~/Groups/ViewGroup.aspx\");\n}\n```\n\nOnce\
    \ we locate the appropriate keyword, we can load up an instance of our group by\
    \ the specified page name. This part is handled in ViewGroup.aspx page.\n\n# ViewGroup\n\
    \nThis page is responsible for showing the group details. The first thing to look\
    \ at is the handling of URL routing. In the code behind, we extract the group\
    \ page name from the route data collection and pass it to the presenter to load\
    \ the specific page.\n\n```\n//Fisharoo/Web/Groups/ViewGroup.aspx.cs\nstring groupname\
    \ = Page.RouteData.Values[\"groupname\"] as string;\npresenter.Init(this, IsPostBack,\
    \ groupname);\n```"
  merge: -1
  img_proc: true
