  md: "# User Interactivity\n\nThere are minor changes in the code behind where we\
    \ set the property value of these newly added controls. In the presenter, we make\
    \ changes to our load method. The MarkAnswer control will be displayed only if\
    \ the user is logged in and is the same user as the one who had asked the initial\
    \ question. Also along with querying the post details, we also need to make additional\
    \ call to the AccountService to get appropriate scores for the user accounts so\
    \ that the medals can be displayed.\n\n```\n```csharp\n//Fisharoo/Web/Forums/Presenters/ViewPostPresenter.cs\n\
    private void LoadData(string categoryname, string forumname, int postID)\n{\n\
    \    List<BoardPost> list = _postService.GetPostsByThreadID(postID);\n    BoardPost\
    \ bp = _postService.GetPostByID(postID);\n\n    bool displayMarkAnswer = IsUserLoggedIn()\
    \ && (bp.AccountID ==\n                             _webContext.CurrentUser.AccountID)\
    \ ? true : false;\n    int score = _accountService.GetAccountByID(bp.AccountID).Score;\n\
    \n    _view.LoadData(Translator.BoardPostToBEBoardPost(bp, score),\n         \
    \          Translator.BoardPostToBEBoardPost(list, _accountService,\n        \
    \           displayMarkAnswer), categoryname, forumname, score);\n}\n```\n```\n\
    \n# ProfileDisplay User Control\n\nFinally we will also add the Medals control\
    \ to the ProfileDisplay user control. The changes are similar to what we have\
    \ done for the scenarios just discussed. We will register the Medals control in\
    \ the UserControl/ProfileDisplay.ascx and add it at a relevant place. In the code\
    \ behind we set the Medals.Score property to the Account.Score.\n\nThat's it!\
    \ Your new user controls are officially ready for action.\n\n# Tags page\n\nNow\
    \ that our user controls are built and plugged into our site, we have one final\
    \ thing to do. In our tag cloud, each Tag links to the tag name directly, which\
    \ take the users to the Tags.aspx page so that we can see all the objects that\
    \ share the same tag. The tags could eventually be used to perform search on the\
    \ site as well. This page is fairly straightforward as most of the heavy lifting\
    \ is done behind the scenes. Let's take a look."
