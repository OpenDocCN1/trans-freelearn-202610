- pgno: 283
  md: '# # 9

    ## Forums


    In this chapter we will be discussing forums. A **forum** is a place where users
    can post messages to the community in a way that all the responses will be viewable
    no matter how much time passes between each post—think of it as a long running
    conversation. As the threads or topics and their posts get older, newer content
    will start to bury the older content. This makes this section of the site a very
    dynamic area that many users will want to watch. This is considered a somewhat
    sticky feature! Given the topic of our community—salt water fish—a forum is a
    perfect feature for our site. It will allow a user to post an issue that they
    are having with their aquarium in a way that the entire community can then read
    and interact with that user''s issue. Over time your community will bubble up
    certain users as subject matter experts on specific topics. And eventually (you
    hope) your site''s forum will become the place to go for your specific type of
    information. If nothing else, our dear friends Google and Bing will lead people
    your way.


    # ## Problem


    To get started we should first discuss the proper terminology. A forum is really
    a set of containers for storing data. We will have the ability to first create
    categories. A **category** is the highest level of container and therefore will
    have a very generic topic. Each category can hold as many forums as is needed.
    The forum is related to the top level category''s subject but is slightly more
    specific. In each forum we can have a number of threads. Each thread is a very
    specific subject that users can discuss. The discussion is performed with posts
    that are simply replies to the containing thread or a post on the thread.'
  merge: -1
  img_proc: true
