- pgno: 360
  md: "+   - WebContext\n+   - Extensions\n+   - AccountService\n\n# TagService\n\n\
    The TagService has a few things that are responsible for adding tags and calculating\
    \ font sizes.\n\n# AddTag()\n\nWe have the AddTag() method that takes care of\
    \ adding Tags to our database. You may ask why we can't just take care of that\
    \ in our TagRepository. In this case, we are doing more than just shoving a new\
    \ record into the system. Here we need to see if we already have the tag or not.\
    \ If we don't, then we need to create a new tag. If we do have the tag already,\
    \ then we need to increment the count for that tag and we can save the tag back\
    \ into the system.\n\nIn addition to adding a tag into the system, we also need\
    \ to create the relationship for that tag and the object it is related to. This\
    \ is a straightforward job. We simply spin up a new SystemObjectTag with the appropriate\
    \ TagID. Then we can toss that into the database.\n\n```\n//Fisharoo/BusinessLogic/TagService.cs\n\
    public void AddTag(string TagName, int SystemObjectID, long SystemObjectRecordID)\n\
    {\n    Tag tag = _tagsRepository.GetTagByName(TagName);\n    if (tag == null)\n\
    \    {\n        tag = new Tag();\n        tag.CreateDate = DateTime.Now;\n   \
    \     tag.Name = TagName;\n        tag.Count = 1;\n    }\n    else\n    {\n  \
