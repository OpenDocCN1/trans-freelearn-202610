    # CalculateFontSize()


    The CalculateFontSize() method is responsible for taking a collection of Tags
    and calculating the font size for each one. There is a bit to this calculation
    in that some tags may have a very large count while other tags may only have been
    applied to a couple of items. If those were the numbers we used to calculate the
    font size, we may end up with a tag that is larger than the page or one that is
    so small that you can''t read it. For this reason, we need to get the numbers
    to fit between something more reasonable. This is the calculation that we will
    discuss.


    Before we look at the method in its entirety, let''s discuss some of the variables
    that we will be working with:


    +   - **MinimumRange**: This variable will hold the smallest count in our set
    of tags. This will form the lower bound of our collection. It is global to the
    calculation.

    +   - **MaximumRange**: This variable will hold the largest count in our set of
    tags. This will form the upper bound of our collection. It is global to the calculation.

    +   - **Delta**: This variable will hold the difference between our **MinimumRange**
    and our **MaximumRange**. It is global to the calculation.

    +   - **Tag.InitialValue**: This will hold a copy of the Count for each tag.

    +   - **Tag.MinimumOffset**: This is the **InitialValue**–**MinimumRange**.

    +   - **Tag.Ranged**: This value is the **MinimumOffset** divided by the **Delta**.

    +   - **Tag.PreCalculatedValue**: This is the **Ranged** value multiplied by the
    difference of the largest font size and the smallest font size subtracted by one
    (largest-smallest-1).

    +   - **Tag.FinalCalculatedValue**: This is the **PreCalculatedValue** plus one.

    +   - **Tag.FontSize**: This is the **FinalCalculatedValue** plus the smallest
    font size.


    The result of all of these calculations is a set of tags that grow smoothly regardless
    of the difference between your smallest tag count and your largest tag count and
    regardless of the difference between your smallest and largest font size.'
