  md: "```\nvar permissions = from p in dc.Permissions.Where(\n    p=>p.Name.Equals(Name))\n\
    select p;\nreturn permissions.ToList();\n}\n}\n```\n\nKey advantages with Lambda\
    \ Expressions over standard query are type inference, simplicity, and increased\
    \ readability of code.\n\n> Lambda Expression consists of a lambda operator '=>'\
    \ (goes to), left side of which signifies the input parameter (for more than one\
    \ input parameter, make it comma separated) and right side signifies the expression\
    \ or statement block to be evaluated. The compiler performs automatic type inference\
    \ based on the usage of arguments.\n\n# Terms repository\n\nIn the GetCurrentTerm()\
    \ method of the TermRepository(), there is a new LINQ query statement item added.\n\
    \n```\n//Fisharoo/DataAccess/TermRepository.cs\npublic Term GetCurrentTerm()\n\
    {\n    using (FisharooDataContext dc = conn.GetContext())\n    {\n        Term\
    \ term = (from t in dc.Terms\n                     orderby t.CreateDate descending\n\
    \                     select t).FirstOrDefault();\n        return term;\n    }\n\
    }\n```\n\nHere, you will see that we have an orderby clause introduced as well\
    \ as a descending keyword. This allows us to take all the terms ever created and\
    \ put the most recent ones at the top of the stack."
