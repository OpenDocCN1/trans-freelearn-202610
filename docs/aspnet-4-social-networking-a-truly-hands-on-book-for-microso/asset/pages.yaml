  md: "The code to include the Silverlight XAP package in the UI is:\n\n```\n///Fisharoo/Web/Photos/AddPhotos.aspx\n\
    <object data=\"data:application/x-silverlight-2,\" type=\"application/x-silverlight-2\"\
    \ width=\"550\" height=\"510\">\n    <param name=\"source\" value=\"/ClientBin/FileUpload.xap\"\
    \ />\n    <param name=\"onError\" value=\"onSilverlightError\" />\n    <param\
    \ name=\"background\" value=\"white\" />\n    <param name=\"minRuntimeVersion\"\
    \ value=\"4.0.50401.0\" />\n    <param name=\"autoUpgrade\" value=\"true\" />\n\
    \    <param name=\"initParams\" value=\"UploadPage=/Handlers/FileUpload.ashx?AlbumID=<%Response.Write(ctx.AlbumID);\
    \ %>&FileTypeID=<%Response.Write(ctx.FolderType); %>&AccountID=<%Response.Write(ctx.AccountID);\
    \ %>,Filter=Images (*.jpg)|*.jpg\" />\n    <a href=\"http://go.microsoft.com/fwlink/?LinkID=149156&v=4.0.50401.0\"\
    \ style=\"text-decoration: none\">\n        <img src=\"http://go.microsoft.com/fwlink/?LinkId=161376\"\
    \ alt=\"Get Microsoft Silverlight\" style=\"border-style: none\" />\n    </a>\n\
    </object>\n```\n\nMost of this is the standard code that is used in any Silverlight\
    \ application while including a Silverlight control in the application. The only\
    \ main point of interest is the `initParams` parameter, to which we pass the value\
    \ of the `httpHandler` that will help with the file upload. The code for this\
    \ handler can be found in `Fisharoo/Web/Handlers/Fileupload.ashx.cs` file. Usually\
    \ `httpHandlers` need to be registered in the web.config file, however since we\
    \ have the handler as an `.ashx` file, it is managed automatically by the ASP.NET\
    \ runtime and we don't need to explicitly register it.\n\nThis handler hands over\
    \ the processing to **FileProcessor** class (`Web/HelperClasses/FileProcessor.cs`)\
    \ that manages the GUID creation, creation of the various sized images, and appropriate\
    \ sections in the backend. The code here is similar to that already discussed\
    \ in earlier section: **Multiple file upload.**\n\nNow that we are uploading files,\
    \ let's move on to discussing the display of those photos."
