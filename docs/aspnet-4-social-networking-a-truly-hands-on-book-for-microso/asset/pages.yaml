- pgno: 287
  md: '# # Alerts


    Finally, we will extend our system to use our pre-existing alert system so that
    each time someone makes a post or creates a new thread; we will see an alert on
    both the creator''s filter as well as one on the friends''. This will help us
    to promote the new content across the site.


    # # Solution


    Let''s take a look at our solution.


    # ## Implementing the database


    Let''s start our solution by first discussing the implementation of our database.


    ![](img/15a62e134135dde036b0ac3cbb01dab6_287_0.png)


    # ## Categories


    As we discussed before, the concept of a category is our top level container of
    data. Let''s take a look at the table structure for categories:


    The **SortOrder** field is in charge of setting the display order in case we have
    multiple categories on one page. We already discussed the count fields earlier.
    The last X fields are to control who made the last post and when. **PageName**
    controls the friendly URLs that our system will use later.'
  merge: -1
  img_proc: true
- pgno: 288
  md: '# Forums


    Forums are the next level container that holds our entire individual user created
    threads.


    Similar to categories we maintain the counts of our low level posts and threads.
    We also maintain who created the last post and when. Notice that we have a foreign
    key reference to the BoardCategorys table.


    # Posts


    As we have stated earlier, the BoardPosts table is really a dual purpose table
    containing both posts and threads. We did this primarily because for most part
    each item has the same data in it with the exception of the parent **ThreadID**
    column.


    The field to note here is the **IsThread** field. This is the easiest way to know
    when a post is also a Thread. In addition to that we have the **ThreadID**, that
    also denotes the difference between a post and a thread where a thread won''t
    have a **ThreadID**—a thread is never a part of a thread (at least not yet!).
    Also notice here that we have a foreign key for the forum that this thread is
    part of in the form of the **ForumID** foreign key. For threads, we also store
    the number of times it was viewed as well as how many replies it has.


    A nice side effect of this post/thread structure is that any run-of-the-mill post
    can easily be moved off and treated as its own thread. Often a moderator will
    find that a post within a thread is generating more traffic than the initial thread
    itself. In this case that post can easily be promoted to a thread in its own right!


    # Creating the relationships


    Once all the tables are created we can then create all the relationships.


    For this set of tables, we have relationships between the following tables:


    +   - BoardForums and BoardCategories

    +   - BoardPosts and Accounts

    +   - BoardPosts and BoardForums

    +   - BoardPosts and BoardPosts (for post to thread reference)'
  merge: -1
  img_proc: true
