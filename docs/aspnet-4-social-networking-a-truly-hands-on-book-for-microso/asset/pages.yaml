- pgno: 269
  md: '# # Blogs


    The blogs table has the same attributes as the Blog entity above. We have discussed
    most of this under this section.


    The one thing that is interesting here is the **Post** column. Notice that we
    have this set to a **varchar(MAX)** field. This may be too big for your community,
    so feel free to change it. For our community we can work with this data type.
    We can always add a UI restriction without impacting the database design using
    a validation control. After that we will look at the **IsPublished** flag. This
    flag tells the system whether or not to show the post in the public domain. Next
    to that we will also be interested in the **PageName** column. This column is
    what we will display in the browser''s address bar. As it will be displayed in
    the address bar, we need to make sure that the input is clean so that we don''t
    get hit with SQL injection attacks or parsing issues (responsible for causing
    data type exceptions). We will handle that on the input side in our presenter
    later.


    # # Creating the relationships


    Once all the tables are created we can then create all the relationships. We have
    created relationships between the Blogs and Accounts tables:


    # # Setting up the data access layer


    To set up the data access layer follow the steps mentioned next:


    +   1. Open the Fisharoo.edmx file and include the new Blog table as described
    in Chapter 3.

    +   2. Hit Save and you should now have the Blog domain object to work with!


    # # Building repositories


    With the addition of new tables will come the addition of new repositories so
    that we can get at the data stored in the corresponding table. We will be creating
    the BlogRepository repository at Fisharoo\DataAccess\Repositories to support our
    needs.


    Our repository will generally have a method for selecting by ID, select all by
    parent ID, save, and delete. Once you have seen one repository you have pretty
    much seen all of them. Review previous chapters, the appendices, or the included
    code for examples of a standard repository. We will discuss anything that varies
    from what is considered standard!'
  merge: -1
  img_proc: true
