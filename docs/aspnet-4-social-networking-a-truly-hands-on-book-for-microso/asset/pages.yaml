- pgno: 175
  md: '![](img/15a62e134135dde036b0ac3cbb01dab6_175_0.png)


    The box in the preceding screenshot is where the user can enter his/her **Status
    Updates**. Each of these updates will also be shown on the updates view and in
    their alerts view.


    ![](img/15a62e134135dde036b0ac3cbb01dab6_175_1.png)


    Such alerts/notifications keep the people aware of what their friends are up to
    and keep them involved with their friends.


    # Design


    Now let''s talk about the design of these features.


    # Friends


    This chapter is an attempt to throw light on the infrastructure needs and more
    heavily focus on the UI side for creating and managing relationships. That being
    said, there is always some form of groundwork that has to be in place prior to
    adding new features.'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# Friends


    In this case we need to add the concept of a friend prior to having the ability
    to create friendships. This concept is a relatively simple one as it is really
    only defining a relationship between two accounts. We have the account that requested
    the relationship and the account that accepted the relationship. This allows an
    account to be linked to as many other accounts as they wish.


    # Finding friends


    The Friends feature will not go anywhere if there is no way for people to find
    friends. For that reason the various ways to locate and invite someone to be your
    friend is our first topic.


    # Searching for a friend


    The easiest way to locate friends who might be interested in the same site as
    you are is to search through the existing user base. For that reason we will need
    to create a simple keyword search box that is accessible from any page on the
    site. This search feature should take a look at several fields of data pertaining
    to an account and return all possible users. From the search results page we should
    be able to initiate a friend request.


    # Inviting a friend


    The next best thing to locating friends who are already members of the site is
    to invite people who you know out of the site. The quickest way to implement this
    is to allow a user to manually enter an email address or many email addresses,
    type a message, and then submit. This would be implemented with a simple form
    that generates a quick email to the recipient list. In the body of the email will
    be a link that allows the recipients to come in to our site.


    # Importing friends from external sources


    An obvious extension of the last topic is to somehow automate the importing process
    of contacts from an email management tool. We will show how the user can export
    their contacts from Outlook and import them via a web form. The user should then
    be able to select the contacts that they want to invite.'
  merge: -1
  img_proc: true
- pgno: 177
  md: '# # Sending an invitation


    With all three of the above methods we will end up sending out an invitation email.
    We could simply send out an email with a link to the site. However, we need to
    maintain:


    +   - Who has been invited?

    +   - Who initiated the invitation? and

    +   - When this occurred?


    In the email, rather than just inviting people in, we want to assign the user
    a key so that we can easily identify them on their way in. We will use a system-generated
    GUID to do this. In the case of inviting an existing user, we will allow him/her
    to log in to acknowledge the new friendship. In the case of a non-member user
    who was invited, we will allow him/her to create a new account. In both cases
    we will populate the invitation with the invited user''s Account ID so that we
    have some history about the relationship.


    # ## Adding friend alerts


    Once we have the framework in place for inviting and accepting friendship requests,
    we need to extend our existing system with alerts. These alerts should show up
    on the existing user''s Alerts page to show that they sent an invitation. For
    existing users, we should have alerts showing that they have been invited. Once
    a user has accepted a friendship we should also have a related alert.


    # ## Interacting with your friends


    Now let''s discuss some of the features that we need to interact with our friends.


    # ## Viewing your friends


    Friends are only good if a user can interact with them. The first stop along this
    train of thought is to provide a page that allows a user to see all the friends
    he/she has. This is a jumping off point for a user to view the profile of friends.
    Also, as the concept of a user''s profile grows, more data can be shown about
    each friend in an at-a-glance format.


    In addition to an all **Friends** page, we can add friends'' views to a user''s
    public profile so that other users can see the relationships.'
  merge: -1
  img_proc: true
- pgno: 178
  md: '# Managing your friends


    Now that we can see into all the relationships we can finally provide the users
    with the ability to remove a relationship, in our initial pass this will be a
    permanent deletion of the relationship.


    # Following your friends


    We can extend the alert system so that when alerts are generated for a user, such
    as updating their profile information, uploading a new photo, or any other user-specific
    task, all the user''s friends are also notified via their Alerts page.


    # Providing status updates to your friends


    We have briefly touched on this already in earlier sections. Users can write a
    short message as their status update/micro blob and this will show up on the Alerts
    page of all the user''s friends. This feature creates a lot of dynamic content
    on an end user''s homepage, which keeps things interesting.


    # Solution


    Now let''s look at our solution.


    # Implementing the database


    Let''s look at the tables that are needed to support these new features.


    # The friends table


    As the concept of friends is our base discussion for this chapter, we will immediately
    dive in and start creating the tables around this subject. As you have read previously
    this is a very straightforward table structure that simply links one account to
    the other.


    ![](img/15a62e134135dde036b0ac3cbb01dab6_178_0.png)'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# # Friend invitations


    This table is responsible for keeping track of who has been invited to the site,
    by whom, and when. It also holds the key (GUID) that is sent to the friends so
    that they can get back into the system under the appropriate invitation. Once
    a friend has accepted the relationship, their AccountID is stored here too, so
    that we can see how relationships were created in the past.


    | Column Name | Data Type | Allow Nulls |

    |---|---|---|

    | InvitationID | int | ☐ |

    | AccountID | int | ☐ |

    | Email | varchar(200) | ☐ |

    | GUID | uniqueidentifier | ☐ |

    | CreateDate | smalldatetime | ☐ |

    | BecameAccountID | int | ☐ |

    | Timestamp | timestamp | ☐ |


    # # Status updates


    Status Updates allow a user to tell their friends what they are doing at that
    time. This is a micro blog so to speak.


    > > A **micro blog** allows a user to write small blurbs about anything. Examples
    of this are Twitter and Yammer. For more information take a look here at: **http://en.wikipedia.org/wiki/Micro-blogging**.'
  merge: -1
  img_proc: true
