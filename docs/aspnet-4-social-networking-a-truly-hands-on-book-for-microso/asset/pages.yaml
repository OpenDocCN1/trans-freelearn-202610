- pgno: 344
  md: '# User Interactivity


    We will cover the algorithm used to determine the font size dynamically as well
    as some of the flexibilities that are baked into this control later in this chapter.


    # Commenting


    Commenting allows our users to give more specific input about a resource. This
    can be integrated later into our search features to also help us get our content
    to our users. In addition to this, it allows our users to exchange comments about
    a resource, generating curiosity from other users.


    ![](img/15a62e134135dde036b0ac3cbb01dab6_344_0.png)


    # Mark as answer


    For any forum to be successful, it is important to have the basic infrastructure
    to post a question and to reply to existing posts. Once the basic infrastructure,
    which we created in Chapter 9, is available, the next important thing is to ensure
    resolution/responses to posted queries because ultimately that is what will drive
    the number of users to the forums. To ensure the forums are successful, they should
    provide the ability to accept a reply as an answer and at the same time allow
    other users to also vote on the question and its replies. These actions are internally
    linked to a scoring system. When a user attains a certain total score, they will
    be awarded a medal.'
  merge: -1
  img_proc: true
- pgno: 345
  md: 'While each post that gets accepted as an answer will get some score, other
    posts also need to be valued to ensure users continue to show interest in posting
    replies. This is done by awarding scores to all replies, even if they aren''t
    accepted as answers. The scores awarded in such cases are obviously lower than
    what one gets for posting an answer. We will go with a score of 10 for the accepted
    answer and 5 for all other posts.


    ![](img/15a62e134135dde036b0ac3cbb01dab6_345_0.png)


    # Voting


    Mark as answer, as discussed, is to be used by the user who raised the initial
    query. But how can we keep the community involved in the discussions? One way
    to address it is via voting. Users may find the questions and the replies useful
    for their own purposes and hence will like to give a positive vote. Similar users
    may not find the content relevant and can give a negative vote. A negative vote
    will cause the relevant user to lose on total score and will cause them to lose
    medals as well. This will act as deterrent for users to post irrelevant replies
    to threads.


    # Medals


    Over a period the users build their credentials by accumulating scores. These
    credentials can be viewed as grades through medals. In Fisharoo, as the user attains
    certain total score, we assign him or her a medal. After attaining next level
    of score, we assign him or her additional medals and so on. The more medals the
    user has, the stronger the credentials the user carries on the social networking
    site. Similar to rating system, the medals will range from 1 to 5 with 1 being
    a beginner and 5 being the most reputed users on the site.


    ![](img/15a62e134135dde036b0ac3cbb01dab6_345_1.png)'
  merge: -1
  img_proc: true
- pgno: 346
  md: '# Design


    Let''s take a look at the design for this feature.


    # Ratings


    With the ASP.NET AJAX Control Toolkit you are able to create horizontal or vertically
    positioned stars; stars that can be run from left-to-right, and right-to-left.
    You can even swap out the stars for any other image such as happy faces, if you
    really want to.


    ![](img/15a62e134135dde036b0ac3cbb01dab6_346_0.png)


    > More information regarding the toolkit can be found here:

    > **http://www.codeplex.com/AjaxControlToolkit** and

    > **http://www.asp.net/ajax/ajaxcontroltoolkit/**.


    The one thing that the control in the toolkit does not do, is allow you to show
    multiple attributes to be rated for an item. It also does not allow you to aggregate
    those ratings to be rolled up into one global rating. It is this more flexible
    control that we will discuss and build here.


    Before we discuss rating attributes of an item, we need to discuss what an item
    is. In our community site, we may want to rate just about anything that is awfully
    vague and generally hard to work with. So we will say that our definition of "anything"
    is any table in the database (you will see more use of this object concept when
    we discuss comments and tags). In order to keep track of our objects, we will
    need to create a container which we can use as a hard reference.


    For this, we will create a SystemObjects table. This will hold the name and SystemObjectID
    for each of the tables that we want to add ratings to. If we add more tables to
    our system that could benefit from ratings, we can easily extend our rating tool
    to work with the next object.


    Now that we know what our objects are, we can discuss our attributes that will
    actually get individual ratings. For this, we will need the ability to have a
    flexible system that allows each unique object to have its own attribute definitions.
    We will create a SystemObjectRatingOptions table to manage these attributes. Here
    you will see the name of the attribute and its description. We will show the name
    in our display and add the description to a tooltip. In addition to this, we will
    create the relationship to our SystemObjects table. This will allow us to have
    custom attributes for something like images—as many as we like.'
  merge: -1
  img_proc: true
- pgno: 347
  md: 'From there, we will need the ability to capture the actual end user feedback
    in the form of a rating. Each rating will apply to each attribute of a given **SystemObject**
    (or table). As individuals will be rating a unique item (an actual record) of
    the defined type of **SystemObject**, we will also need to track the record ID
    of the rated item in question. This will allow us to know that we are rating a
    specific record in the **Files** or **Photos** table so that we can easily query
    the data that we need.


    With each rating we will also capture a score (1-5 in our demo). This will allow
    us to have an aggregate rating for each attribute. It will also allow us to have
    an aggregated rating for the actual rated item. We will simply average all scores
    collected for an item to provide us with a high-level, generic rating. With this
    system, we will also have the data that we would need for more sophisticated reports
    and displays as time permits.


    # Tags


    Tagging allows the users of your community to provide keywords that categorize
    your content. This in turn helps other users to locate the appropriate content
    in your site. The more who apply a specific keyword to the content of your site,
    the larger that particular keyword will appear in the cloud.


    This system will be built using the same **SystemObjects** concept. This will
    allow us to apply tags to any object defined in our system. In addition to the
    **SystemObjects** table, we will also have a Tags table. This will allow us to
    keep track of all of the unique tags that we collect over time. And this is where
    we will maintain our aggregated tag counts. While we could sum the count on the
    fly, it is easier and more efficient to build the sum as we collect new tags.


    In addition to collecting new tags and maintaining the definition of our **SystemObjects**,
    we also need to maintain the relationship between our tags and the **SystemObjects**.
    We will do this with our **SystemObjectTags** table. This table will also keep
    track of who applied the tag and when.


    With the tables defined, we should keep in mind that we want to build a flexible
    control. In our case, we will build a control that will not only collect tags
    for an object, but will also display the tags for a given item (a mini tag cloud
    if you will). We will also be able to keep track of all the tags for a parent
    (in case if we are tagging images, we can have a tag cloud for our image gallery).
    And finally, we will add functionality to our control that will allow us to build
    a high-level global tag cloud that could be used on your site''s homepage. This
    cloud will display the most popular tags for all of the collected tags.'
  merge: -1
  img_proc: true
- pgno: 348
  md: '# User Interactivity


    The final complexity is what completes the tag cloud. We will have the tables
    in place to hold the data appropriately. We will have the control to capture and
    display the data. But the real kicker to a tag cloud is how it is displayed. A
    **tag cloud** displays each tag (a keyword or words) with a size relative to its
    own ranking in the overall popularity of the cloud. This means that the more the
    tag is used in your cloud, the larger the tags will be in the cloud. On the other
    hand, a tag that is used less often will appear smaller in the cloud. We will
    fully discuss the algorithm behind this sorting when the time comes.


    # Comments


    Compared to our fancy ratings and tagging controls, the commenting control is
    not very distinctive. Though it is not distinctive, it still fits this chapter
    where this is another method for your users to provide very specific content about
    your content. The comments will come in handy later when you integrate the gathered
    content into your site''s search results. Also, our friendly search engines will
    love to eat up your new content-specific comments.


    This system, like the other two, will be built around the SystemObject table.
    In addition to that table, we will have a Comments table. The Comments table will
    not only gather all the normal data but also the body of the comment. That''s
    it!


    # Voting


    To keep track of votes we have added not null integer column called as **VoteCount**
    in BoardPost table. To keep track of posts that are marked as answers, we also
    added the bit column **isAnswer** (not null) to the BoardPost table.


    # Medals


    To keep track of the total Score for a particular account/user, we have added
    an integer column in Accounts table as **Score**. The score will be incremented
    based on the rules defined in the design section and accordingly Badges will be
    awarded.


    # Solution


    Let''s take a look at our solution.'
  merge: -1
  img_proc: true
- pgno: 349
