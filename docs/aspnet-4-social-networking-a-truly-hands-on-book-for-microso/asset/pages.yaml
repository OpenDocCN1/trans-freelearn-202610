- pgno: 184
  md: "# StatusUpdateRepository\n\nThe method of interest in this repository is the\
    \ one that gets topN StatusUpdates for use on the profile page.\n\n```\n//Fisharoo/DataAccess/Repositories/StatusUpdateRepository.cs\n\
    public List<StatusUpdate> GetTopNStatusUpdatesByAccountID(Int32 AccountID, Int32\
    \ Number)\n{\n    List<StatusUpdate> result;\n    using (FisharooDataContext dc\
    \ = conn.GetContext())\n    {\n        IEnumerable<StatusUpdate> statusUpdates\
    \ = (from su in dc.StatusUpdates\n            where su.AccountID == AccountID\n\
    \            orderby su.CreateDate descending\n            select su).Take(Number);\n\
    \        result = statusUpdates.ToList();\n    }\n    return result;\n}\n```\n\
    \nThis is done with a standard LINQ to Entity query with the addition of the Take()\
    \ method, that translates into a TOP statement in the resulting SQL.\n\n# AccountRepository\n\
    \nWith the addition of our search capabilities we will require a new method in\
    \ our AccountRepository. This method will be the key for searching accounts.\n\
    \n```\npublic List<Account> SearchAccounts(string SearchText)\n{\n    List<Account>\
    \ result = new List<Account>();\n    using (FisharooDataContext dc = conn.GetContext())\n\
    \    {\n        IEnumerable<Account> accounts = from a in dc.Accounts\n      \
    \      where(a.FirstName + \" \" + a.LastName).Contains(SearchText) || a.Email.Contains(SearchText)\
    \ || a.Username.Contains(SearchText)\n            select a;\n        result =\
    \ accounts.ToList();\n    }\n    return result;\n}\n```"
