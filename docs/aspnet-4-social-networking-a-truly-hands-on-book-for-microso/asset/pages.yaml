- pgno: 460
  md: '# Scaling Up


    Once we have a method to initialize our search, we can safely start the search
    process. In our case, we will be searching the Profiles and Blogs indexes (we
    created an index for both). Note that in the beginning of the search we have an
    array of indexes to search. Then we iterate through that list to perform searches
    on each index in the collection.


    We then open the appropriate index. Also note that we are initializing a Hits
    object, which will hold the results of our search. In this implementation, we
    have created three types of searches. One is a wild card search, which will allow
    our user to specify an * as the wild card to search with. We then check to see
    if we have multiple words in our search phrase, which to us will represent a MultiPhraseQuery.
    And finally, we have a simple PhraseQuery.


    The wild card search will look for whatever you specify with anything else in
    place of the wild card. If we specify "Atul*" as our search phrase, it should
    easily pick up "Atul Gupta" or anything else that starts with Atul. Be careful
    with this type of search as you might return a slew of data no different from
    Select all from SQL.


    A MultiPhraseQuery query allows you to search for the first word in the phrase
    query, then search for the second word within the search results of the first
    word, and so on. This can be used to whittle down the search results with a fair
    amount of accuracy. Finally, we have a simple PhraseQuery. This query takes in
    one word and searches the index for instances of that word.


    With each search we are returned a collection of Hits. The Hits object holds all
    the documents that were found via your search. Each hit has a relevancy as well
    as the document so that you can use the record IDs of the found document and hence
    can get back to the data you have stored in your SQL table.


    From there, we then iterate through each of our hits creating a new SearchResult
    (a custom structure that we made), which we can use to generically feed our UI.
    Please refer code at // Fisharoo/BusinessLogic/LuceneSearchService.cs.


    We use this structure to populate a grid or a repeater in our search result UI.


    We did not plug this directly into the site instead we created a simple webpage,
    LuceneSearch.aspx, for you to see how it works. There is a code to build the indexes
    from this page as well as to perform a search. The code is very simple and we
    didn''t do any MVP implementation for this as we wanted to just highlight how
    to put this to quick use. You can look up the code associated with this chapter
    for details.'
  merge: -1
  img_proc: true
- pgno: 461
  md: '# Summary


    In this chapter, we discussed various areas of the application that might experience
    some growing pains over time. We addressed issues surrounding application layer
    validation, looked at application tiering from the Web, Application and Database
    Server perspectives, and also looked at the possible strategies in each tier that
    we can employ to ready that specific tier to handle future user growth (scale).


    In Application tier, we looked at how we can Service enable existing application
    without significant changes in the existing code. We looked at a way to speed
    up data and object access on the site by implementing a Caching layer using Windows
    Server AppFabric or MemCached.NET. Next, we looked at how network communications,
    emails in particular, could be speeded up by adding asynchronicity between your
    website and the actual process used to send emails. Then we looked at how we can
    better manage the various alerts that are sent out between users, for the actions
    that the users take on the site.


    In the Database tier, we looked at possible inefficiencies in the database by
    discussing a better way to delete data, partition, and index it. We moved on to
    making our search capabilities better and faster.


    The key to this chapter is leveraging existing technology stack to extract maximum
    features that help support scale, then look at your site for possible pain points,
    and addressing them with approaches that may not necessarily be ASP.NET or C#
    related. Frequently, your code may be optimized to a greater level, but may still
    appear to be slow. Poke around a bit to determine for yourself all the aspects
    that are involved with a problem, and learn to address it outside the box if that
    is best.'
  merge: -1
  img_proc: true
