  md: "# Media Galleries\n\n```\nNewWidth = pair.Value;\ndecimal Temp = bitmap.Height\
    \ * Ratio;\nNewHeight = (int)Temp;\n}\nelse\n{\n    Ratio = (decimal) pair.Value\
    \ / bitmap.Height;\n    NewHeight = pair.Value;\n    decimal Temp = bitmap.Width\
    \ * Ratio;\n    NewWidth = (int)Temp;\n}\n}\n```\n\nOnce we have our sizes determined\
    \ we can resize it and save it to the file system. We do this by again setting\
    \ a reference to the uploaded file and reconstructing a new Bitmap. With this\
    \ in hand we can then save the bitmap to the file system with its new dimensions.\
    \ Do note though that in this case when we save the file to the file system, we\
    \ are not adding a section to the name using the key name from the dictionary.\
    \ This results in a file name that is made up of {GUID}__{key}-{extension}. This\
    \ means that every file will be unique and will have uniquely named files of various\
    \ sizes.\n\n```\nusing(System.Drawing.Image image =\n        System.Drawing.Image.FromStream(F_InputStream))\n\
    using(Bitmap bitmap = new Bitmap(image, NewWidth, NewHeight))\n{\n    bitmap.Save(Server.MapPath(SaveToFolder\
    \ + \"/\" +\n        SystemFileNamePrefix.ToString() + \"__\"\n        + pair.Key\
    \ + \"-\" + Extension),\n        image.RawFormat);\n}\n```\n\nWe continue to loop\
    \ through all the different file sizes in our dictionary creating new files for\
    \ each one. Once complete we will move to the next file that was uploaded. Let's\
    \ now write a test page to test our receiving page.\n\n# Receiving files with\
    \ Flash uploader\n\nNow that we have a way of receiving uploaded files, let's\
    \ create the UI to upload a handful of files. This is a Flash-based UI. You can\
    \ either download a trial copy of Flash or look at alternatives in a product such\
    \ as Swish or Flex.\n\nAs this is not so much a Flash book, we will skim over\
    \ this topic quickly. We will create a simple Flash UI that has a browse box,\
    \ a couple of dynamic text boxes, and some labels. We will build the entire UI\
    \ on one frame and the UI looks something as shown in the following screenshot:"
