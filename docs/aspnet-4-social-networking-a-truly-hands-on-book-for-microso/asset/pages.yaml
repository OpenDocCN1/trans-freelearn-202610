  md: "# Blogs\n\nWe will start with a method that will allow us to get at a blog\
    \ by its page name, that we can capture from the browser's address bar.\n\n```\n\
    ```csharp\n//Fisharoo/DataAccess/Repositories/BlogRepository.cs\npublic Blog GetBlogByPageName(string\
    \ PageName, Int32 AccountID)\n{\n    Blog result = new Blog();\n    using (FisharooDataContext\
    \ dc = _conn.GetContext())\n    {\n        result = dc.Blogs.Include(\"Account\"\
    ).Where(b =>\n            b.PageName == PageName && b.AccountID == AccountID).\n\
    \            FirstOrDefault();\n        //we can do this since there will be only\
    \ one result\n        result.account = result.Account;\n    }\n    return result;\n\
    }\n```\n```\n\nNotice that for this system to work we can only have one blog with\
    \ one unique page name. If we force our entire community to use unique page names,\
    \ we would eventually have some upset users. We want to make sure to enforce unique\
    \ page names across users only for this purpose. To do this, we require an AccountID\
    \ to be passed in with the page name, which gives our users more flexibility with\
    \ their page name overlaps! We will show you how we get the AccountID later. Other\
    \ than that we are performing a lambda expression to select the appropriate blog\
    \ out of the collection of blogs in the data context.\n\nNext we will discuss\
    \ a method to get all the latest blog posts via the GetLatestBlogs() method. This\
    \ method will also get and attach the appropriate Account for each blog. Before\
    \ we dive into this method we will need to extend the Blog class to have an Account\
    \ property.\n\nTo extend the Blog class we will need to create a public partial\
    \ class under the DataAccess project.\n\n```\n```csharp\nnamespace Fisharoo.DataAccess\n\
    {\n    public partial class Blog\n    {\n        public Account account { get;\
    \ set; }\n    }\n}\n```\n```\n\nNow we can look at the GetLatestBlogs() method.\n\
    \n```\n```csharp\npublic List<Blog> GetLatestBlogs()\n{\n    List<Blog> result\
    \ = new List<Blog>();\n```\n```"
