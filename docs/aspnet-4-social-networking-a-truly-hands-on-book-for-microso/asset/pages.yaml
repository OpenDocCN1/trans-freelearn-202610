  md: "All we did here is pointed the isFriend variable at the result of the new IsFriend()\
    \ method in the FriendService. Everything else was handled previously!\n\n# Implementing\
    \ the Presentation layer\n\nNow that we have the base framework in place we can\
    \ start discussing what it will take to put it all together. Like we said earlier,\
    \ this chapter is less about framework and more about the UI that utilizes the\
    \ new and existing framework!\n\n# Searching for friends\n\nLet's see what it\
    \ takes to implement a search for friends.\n\n# SiteMaster\n\nLet's begin with\
    \ searching for friends. We haven't covered too much regarding the actual UI and\
    \ nothing regarding the master page of this site. We don't want this to be about\
    \ design! So we will simply say that we have added a text box and a button to\
    \ the master page to take in a search phrase.\n\nWhen the button is clicked the\
    \ site redirects to Search.aspx page, passing the search phrase along with it.\n\
    \n# Search\n\nThe Search.aspx page has no interface. It expects a value to be\
    \ passed in from the previously discussed text box in the master page. With this\
    \ text phrase we hit our AccountService and perform a search using the Contains()\
    \ operator. The returned list of Accounts is then displayed on the page.\n\nFor\
    \ the most part, this page is all about MVP plumbing. We are going to assume that\
    \ you are up to speed with MVP, from this point on stick to only the fun stuff.\
    \ Here is the repeater that displays all our data.\n\n```\n//Fisharoo/Web/Search.aspx\n\
    <%@ Register Src=\"~/UserControls/ProfileDisplay.ascx\" TagPrefix=\"Fisharoo\"\
    \ TagName=\"ProfileDisplay\" %>\n...\n<asp:Repeater ID=\"repAccounts\" runat=\"\
    server\" OnItemDataBound=\"repAccounts_ItemDataBound\">\n    <ItemTemplate>\n\
    \        <Fisharoo:ProfileDisplay ShowDeleteButton=\"false\" ID=\"pdProfileDisplay\"\
    \ runat=\"server\" />\n    </ItemTemplate>\n</asp:Repeater>\n```"
