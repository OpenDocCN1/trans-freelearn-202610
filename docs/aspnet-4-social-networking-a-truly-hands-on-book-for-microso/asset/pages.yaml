    \ method. This is useful if we end up changing our route pattern, as defined in\
    \ Global.asax.cs, we don't need to make the changes to regenerate the URL. The\
    \ GetRouteURL method will use the current route definition and return a valid\
    \ URL.\n\n# Invite your friends\n\nThis page allows us to manually enter email\
