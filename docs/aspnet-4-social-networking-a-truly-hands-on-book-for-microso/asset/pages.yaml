- pgno: 285
  md: 'Here is a thread that would also have a list of its posts:


    ![](img/15a62e134135dde036b0ac3cbb01dab6_285_0.png)


    As you may have guessed, the topic of forums is a very large one and you can evaluate
    and integrate any off the shelf that party message board if you find it a good
    fit. However, we will go about explaining some of the key constituents of forums
    such as while creating we will go over the basics of creating categories, forums,
    threads, and posts. Each of these sections will be able to keep count of how much
    data lives beneath it. And all of the content will have the ability to be linked
    to in an SEO-friendly manner (meaning will support friendly URLs). Friendly URLs
    are also easier for our users to remember and work with. We will also tie in the
    ability to add alerts to our filters and our friends'' filters so that they know
    when we have new content available.


    > **SEO (Search Engine Optimization)** is generally defined as the process that
    optimizes organic search traffic. This generally translates to building your site
    in a search engine-friendly manner that presents your site and its content in
    a way that makes the search engine''s job easier to index your pages. Generally
    a long ugly query string such as `default.aspx?userid=324568` is less friendly
    than `domain.com/atulgup­ta` would be. More information can be found on the topic
    here: `http://en.wikipedia.org/wiki/Search_engine_optimization`.'
