  md: "# # Installing the new user controls\n\nNow that we have our controls built\
    \ and ready for use, let's plug them into our existing pages.\n\n# ## Photos UI\n\
    \nLet's start with ViewAlbum.aspx page for this purpose. This page displays uploaded\
    \ photos, which is fairly good content to collect ratings, comments, and tags\
    \ from our users.\n\nTo get started, we need to register our user controls to\
    \ the page so that we have access to them. We do that by adding Register declarations\
    \ to the top of the page.\n\n```\n```aspx\n<%@ Register Src=\"~/UserControls/Ratings.ascx\"\
    \ TagName=\"Ratings\"\n    TagPrefix=\"Fisharoo\" %>\n<%@ Register Src=\"~/UserControls/Tags.ascx\"\
    \ TagName=\"Tags\"\n    TagPrefix=\"Fisharoo\" %>\n<%@ Register Src=\"~/UserControls/Comments.ascx\"\
    \ TagName=\"Comments\"\n    TagPrefix=\"Fisharoo\" %>\n```\n```\n\nOnce they are\
    \ registered we are free to plug them in anywhere we like. We have chosen to add\
    \ them just beneath the display of each photo.\n\n```\n```aspx\n//Fisharoo/Web/Photos/ViewAlbum.aspx\n\
    <li>\n    <asp:Label Style=\"font-weight: bold;\" ID=\"lblFileName\"\n       \
    \ Text='<%#((PEFile)Container.DataItem).FileName %>'\n        runat=\"server\"\
    \ /><br />\n    <asp:HyperLink ID=\"linkImage\" NavigateUrl='<%#((PEFile)Container.\n\
    \        DataItem).Year + ((PEFile)Container.DataItem).Month %>'\n        runat=\"\
    server\"></asp:HyperLink>\n    <br />\n    <asp:Label ID=\"lblDescription\" runat=\"\
    server\" Text='<%#((PEFile)\n        Container.DataItem).Description %>' />\n\
    \    <br />\n    <Fisharoo:Ratings ID=\"Ratings1\" runat=\"server\" SystemObjectID=\"\
    5\"\n        SystemObjectRecordID='<%#Convert.ToInt64(((PEFile)Container.\n  \
    \      DataItem).FileID) %>'></Fisharoo:Ratings>\n    <br />\n    <Fisharoo:Tags\
    \ ID=\"Tags1\" runat=\"server\" SystemObjectID=\"5\" SystemObjectRecordID='<%#Convert.ToInt64(((PEFile)Container.DataItem).FileID)\
    \ %>' Display=\"ShowCloudAndTagBox\"></Fisharoo:Tags>\n    <br />\n    <Fisharoo:Comments\
    \ ID=\"Comments1\" runat=\"server\" SystemObjectID=\"5\" SystemObjectRecordID='<%#Convert.ToInt64(((PEFile)Container.DataItem).FileID)\
    \ %>'></Fisharoo:Comments>\n</li>\n```\n```"
