  md: "# Messaging\n\nLoading messages into the UI is simply a matter of binding the\
    \ DataSource to the repeater.\n\n```\npublic void LoadMessages(List<PMessage>\
    \ Messages)\n{\n    repMessages.DataSource = Messages;\n    repMessages.DataBind();\n\
    }\n```\n\nAs this requires no further explanation, let's jump right into how we\
    \ go about building our page navigation. Recall that in the Init() of our presenter\
    \ we had a call into _view.DisplayPageNavigation(), which received the PageCount\
    \ of the folder we were working with, and the current page we were viewing. Here\
    \ is that method:\n\n```\npublic void DisplayPageNavigation(Int32 PageCount, MessageFolders\
    \ folder, Int32 CurrentPage)\n{\n    if(PageCount == CurrentPage)\n        linkNext.Visible\
    \ = false;\n    if (CurrentPage == 1)\n        linkPrevious.Visible = false;\n\
    \    linkNext.NavigateUrl = \"~/mail/default.aspx?folder=\" + ((int)folder).ToString()\
    \ + \"&page=\" + (CurrentPage + 1).ToString();\n    linkPrevious.NavigateUrl =\
    \ \"~/mail/default.aspx?folder=\" + ((int)folder).ToString() + \"&page=\" + (CurrentPage\
    \ - 1).ToString();\n    for(int i = 1; i<=PageCount;i++)\n    {\n        HyperLink\
    \ link = new HyperLink();\n        link.Text = i.ToString();\n        link.NavigateUrl\
    \ = \"~/mail/default.aspx?folder=\" + ((int)folder).ToString() + \"&page=\" +\
    \ i.ToString();\n        phPages.Controls.Add(link);\n        phPages.Controls.Add(new\
    \ LiteralControl(\"&nbsp;\"));\n    }\n}\n```\n\nThis chunk of code interacts\
    \ with three controls in our UI—two hyperlinks, one that displays **Previous**\
    \ and one displaying **Next**, and a **PlaceHolder** control that will hold the\
    \ individual page numbers of all the pages for this data set."
  merge: -1
  img_proc: true
- pgno: 229
  md: "This method initially determines if we should show the **Next** or **Previous**\
    \ links based on our current page and our total page count. We then hook up the\
    \ navigation property of each of those links to take us to the next page or the\
    \ previous page of data. After that we use a for loop to iterate through all the\
    \ possible pages, from 1 to PageCount, making a new hyperlink for each iteration\
    \ that contains the location of that page.\n\nThe other feature of this page is\
    \ the ability to delete messages—as many or as few as we like. This is primarily\
    \ achieved with a helper function in the code behind the view that extracts all\
    \ the messages that are selected, that can be called from within the presenter.\
    \ This allows the presenter to remain in control!\n\n```\npublic List<Int32> ExtractSelectedMessages()\n\
    {\n    List<Int32> result = new List<Int32>();\n    foreach (RepeaterItem item\
    \ in repMessages.Items)\n    {\n        if(item.ItemType == ListItemType.Item\
    \ || item.ItemType ==\n           ListItemType.AlternatingItem)\n        {\n \
    \           CheckBox chkMessage = item.FindControl(\"chkMessage\") as\n      \
    \                               CheckBox;\n            Int32 messageID =\n   \
    \             Convert.ToInt32(chkMessage.Attributes[\"MessageID\"]);\n       \
    \     if(chkMessage.Checked)\n                result.Add(messageID);\n       \
    \ }\n    }\n    return result;\n}\n```\n\nThis method iterates through all the\
    \ check boxes to see if they are selected or not. If they are, then it extracts\
    \ the MessageID from an attribute that was created when we loaded the display.\
    \ A collection of MessageIDs is then returned to the caller.\n\nThis then brings\
    \ us to the **Delete** method in the presenter. It is called from a button click\
    \ event that is bubbled up to the presenter, which then calls into the view to\
    \ get a list of selected MessageIDs. Then using the MessageService we get a copy\
    \ of that message. With the copy, we then call into the MessageRecipientService.DeleteMessageRecipient()\
    \ method and delete each selected message."
  merge: -1
