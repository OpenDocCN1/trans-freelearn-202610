- pgno: 222
  md: '# Implementing the presentation layer


    Now that our framework has been updated to handle the new concept of messaging,
    let''s start creating some UI features so that we can use our new tools. We are
    going to need at least three pages to really utilize our messaging features. We
    will need a way to create and send a new message, a way to receive and view the
    messages, and a way to read an individual message. In addition to the creation
    of a message, we will need a way to easily choose from our list of friends, the
    recipients of our new messages. Also, while viewing our list of messages, we will
    need a way of drilling into different folders of messages. Let''s get started!


    # New message


    The UI for the new message page is trivial. It consists of a **To** field, a **Subject**
    field, a message field, and a button to signify that we are ready to send the
    message. Where things are significantly different in the use of the Xinha WYSIWYG
    editor! This is a JavaScript library that allows you to transform a multiline
    text box into a full-featured editor.


    ![](img/15a62e134135dde036b0ac3cbb01dab6_222_0.png)


    To get started with the integration of Xinha, we will first need to get the latest
    code base. This can be acquired from the code base of this book or by going to
    **http://xinha.webfactional.com/wiki/DownloadsPage**. Install this code base into
    a new Xinha directory off the root of the site.'
  merge: -1
  img_proc: true
- pgno: 223
  md: "Then open the **Site.Master** page. Add the following JavaScript directly after\
    \ the body:\n\n```\n```javascript\n<script type=\"text/javascript\">\n    xinha_editors\
    \ = null;\n    xinha_editors = xinha_editors ? xinha_editors : [];\n</script>\n\
    ```\n```\n\nThis code is not part of the standard installation process. What it\
    \ does is allow us to spin up multiple instances of the editor all throughout\
    \ a single page. You will see this later.\n\nThen further down in our master page,\
    \ just before the ending body tag, we will insert another huge blob of JavaScript.\
    \ As this is a very large blob we are not going to show it here. Please open the\
    \ existing master page from this chapter to see it.\n\nYou will see that this\
    \ blob is responsible for setting the vast amount of configuration options that\
    \ Xinha exposes. This code is heavily commented and so should be understandable.\
    \ Also, the configuration of this package is covered extensively on the net!\n\
    \nThe only thing, but definitely the special one, we added to in this configuration\
    \ is the very first line that sets the base URL of the site. In this case, we\
    \ changed it to point to the path where XINHA files are installed.\n\n```\n```text\n\
    ---\n_editor_url = \"/Scripts/Xinha\";\n---\n```\n```\n\nThis brings us back to\
    \ our NewMessage.aspx page. Now that we have Xinha installed, we can add a line\
    \ below our page UI that effectively ties our multiline text box control to the\
    \ Xinha library. This is done with a snippet of JavaScript.\n\n```\n```javascript\n\
    <script type=\"text/javascript\">\n    xinha_editors[xinha_editors.length] = 'Content_txtMessage';\n\
    </script>\n```\n```\n\nNote that this is using the same **xinha_editors** variable\
    \ that we defined initially in the Master page! What we have done here is inserted\
    \ this new control into an array of Xinha editors. Note the **ClientID** of the\
    \ text box that we want associated as an editor. This is different than what we\
    \ are used to in the previous versions of ASP.NET (as discussed earlier in Chapter\
    \ 4)."
