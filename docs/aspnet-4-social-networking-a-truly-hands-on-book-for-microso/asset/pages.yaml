  md: "Now we are ready to start the work. If the goodFile flag is still true then\
    \ we can commit our file object to the database. We then save the actual uploaded\
    \ file to the file system with its new file name. And finally if the fileType\
    \ is a Picture, we scrub the file against our Resize() method to generate the\
    \ various sizes of files we want to end up with.\n\n```\nif (goodFile)\n{\n  \
    \  _fileService.SaveFile(file);\n    F.SaveAs(fullFileName);\n    if(Convert.ToInt32(fileType)\
    \ == ((int)Folder.Types.Photo))\n    {\n        Resize(F,saveToFolder,guidName,extension);\n\
    \    }\n}\n```\n\nTo get into the Resize() method we have to pass in the uploaded\
    \ file that we are working with, the folder that we want to save the files to,\
    \ the generated GUID for the file system name, and the extension of the uploaded\
    \ file. Once in the Resize() method, we can create all the size variations that\
    \ we need for our uploaded photo. We start off by setting up a foreach loop that\
    \ will iterate through the dictionary in the class wide sizesToMake collection.\n\
    \n```\npublic void Resize(HttpPostedFile F, string SaveToFolder, Guid\n      \
    \               SystemFileNamePrefix, string Extension)\n{\n    //Makes all the\
    \ different sizes in the sizesToMake collection\n    foreach (KeyValuePair<string,\
    \ int> pair in sizesToMake)\n    {\n```\n\nInside of our loop we will start up\
    \ a new System.Drawing.Image and we will initialize it from the uploaded files\
    \ input stream. We then move to creating a new Bitmap that is initialized from\
    \ the newly created Image. With the Bitmap we can then create new variations on\
    \ the size of that uploaded image. First we look to see if the file that was uploaded\
    \ is longer on the top or on the side so that we know how to appropriately determine\
    \ the ratio of the image's height and width.\n\n```\nusing(System.Drawing.Image\
    \ image =\n        System.Drawing.Image.FromStream(F.InputStream))\n//determine\
    \ the thumbnail sizes\nusing(Bitmap bitmap = new Bitmap(image))\n{\n    decimal\
    \ Ratio;\n    if(bitmap.Width > bitmap.Height)\n    {\n        Ratio = (decimal)\
    \ pair.Value / bitmap.Width;\n```"
