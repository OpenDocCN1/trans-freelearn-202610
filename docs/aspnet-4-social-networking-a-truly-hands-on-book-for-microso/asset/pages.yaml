    \ and logged in. If they are logged in we automatically redirect them to the login\
    \ screen. Otherwise we prompt them to log in or create an account. If the **friendInvitation**\
    \ can't be loaded properly then we show an error explaining that.\n\nThe real\
    \ magic occurs for the invitation process in the login and registration pages.\n\
    \n# Login\n\nIn the login presenter we have added some logic to the **Init** method\
