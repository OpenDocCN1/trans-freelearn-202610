- pgno: 114
  md: "# User Accounts\n\nThe new thing here, that is somewhat interesting, is the\
    \ mention of the Email object. You may recall when we built the Email object a\
    \ while back. It provides us with the facilities to send an email in various ways.\
    \ What we have done here is extended the Email object so that it also encapsulates\
    \ the messages that are sent by the system. Here is the new code for the Email\
    \ object that allows us to send an email verification of the validity and ownership\
    \ of an email address.\n\n```\n```csharp\n//Fisharoo/Components/Email.cs\npublic\
    \ void SendEmailAddressVerificationEmail(string Username, string To)\n{\n    MEFManager.Compose(this);\n\
    \    string rootURL = _configuration.GetConfigurationSetting(\n        typeof(string),\
    \ \"RootURL\").ToString();\n    string encryptedName = Cryptography.Encrypt(Username,\
    \ \"verify\");\n\n    string msg = \"Please click on the link below or paste it\
    \ into a\n                 browser to verify your email account.<BR><BR>\" +\n\
    \                 \"<a href=\\\"\" + rootURL + \"Account/VerifyEmail.aspx?a=\"\
    \ +\n                 encryptedName + \"\\\">\" +\n                 rootURL +\
    \ \"Account/VerifyEmail.aspx?a=\" +\n                 encryptedName + \"</a>\"\
    ;\n\n    SendEmail(To, \"\", \"Account created! Email verification required.\"\
    , msg);\n}\n```\n```\n\nAlso notice the link that is embedded here encrypts the\
    \ registrant's username with a salt of \"verify\". This way we know who we are\
    \ dealing with after they receive the email and follow the link back to our site\
    \ (more about this in the next section).\n\nIn the Wizard's stepped environment,\
    \ it is very easy to present small chunks of data like this without having too\
    \ much coding overhead. While it is not as easy as the .NET membership widgets,\
    \ we think it is quite a bit more flexible. Also, we can easily test this whole\
    \ process now.\n\n# Email verification\n\nWe lightly touched upon this subject\
    \ in the previous section. Basically, the registration process triggers an email\
    \ to be sent to the newly registered user asking them to verify their email address.\
    \ This process usually sends an email to the email address that the user provided\
    \ us when they signed up. If the user can receive the email on their end, then\
    \ we know that the email address is valid. If they can click on the link that\
    \ is embedded in the email, then we know that they have access to the email as\
    \ well. This doesn't necessarily mean that they own the account, but we can't\
    \ really verify that, and hence we can't really worry about it."
