  md: "# MarkAnswer.ascx.cs\n\nIn this file we have two properties to work with. The\
    \ PostID property that indicates which post we are working with and the IsAnswer\
    \ property that indicates if this post has been marked as answer or not. When\
    \ the button is clicked we pass it to the presenter for further processing. The\
    \ relevant code is as below:\n\n```\n```csharp\n//Fisharoo/Web/UserControls/MarkAnswer.ascx.cs\n\
    public void ToggleDisplay(bool value)\n{\n    btnAnswer.Visible = value ? false\
    \ : true;\n    imgAnswer.Visible = value ? true : false;\n}\n\nprotected void\
    \ btnAnswer_Click(object sender, EventArgs e)\n{\n    _presenter.MarkAsAnswer(PostID);\n\
    }\n```\n```\n\n# MarkAnswerPresenter.cs\n\nThe only relevant part is saving the\
    \ post stating that it is accepted as the answer and incrementing the score for\
    \ the account appropriately.\n\n```\n```csharp\n//Fisharoo/Web/UserControls/Presenters/MarkAnswerPresenter.cs\n\
    public void MarkAsAnswer(long PostID)\n{\n    BoardPost post = _postService.GetPostByID(PostID);\n\
    \    post.IsAnswer = true;\n    _postService.SavePost(post);\n    _accountService.SaveAccount(post.Account,\n\
    \                                BoardPost.ScoreInput.MarkedAsAnswer);\n}\n```\n\
    ```\n\n# Medals page\n\nFinally let's look at the medals page, which uses the\
    \ score for the account to show relevant medals on the UI. Since this control\
    \ is used only for the display of medals, there are no updates linked to it and\
    \ hence there is no presenter also associated with this control."
