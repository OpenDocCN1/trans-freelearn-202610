- pgno: 37
  md: '# This book''s approach


    In each chapter we will follow a pattern to build a feature or set of features.
    We will start with the problem that the chapter addresses. We will then attempt
    to figure out a design that addresses the feature that we need to build. Finally,
    we will discuss what is needed to meet the design requirements.


    # Problem


    In the problem section we will outline exactly what we need to do to achieve success
    for the chapter''s topic. We will show you some screenshots of the finished product.
    And we will cover any major gotchas for building out the features.


    # Design


    This section of each chapter is about defining what exactly we want from a feature
    or features. Here we will decide on and write down the physical requirements so
    that in the next section we can start to build out the feature set. Here we will
    start to look at what the database might look like, whether or not we need to
    make a page or two, or if a user control might work better, and if an open source
    tool might help us address our needs.


    # Solution


    In the solution section of our chapters we will discuss how to implement all the
    requirements for each feature. This section will go deep into the actual code
    for implementing the feature from the database, out to the user interface. We
    will be using ASP.NET 4 for the implementation with Visual Studio 2010 as the
    IDE for this. Along with ASP.NET we will also be leveraging certain features from
    .NET Framework 4, third party tools, and SDKs in our implementation. We will provide
    the relevant code inline in the book. The entire code can be downloaded from the
    Packt website. At the end of this section, you should have something that you
    can play with.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# Features of our social network


    Following are the desirable features that our social networking site will possess:


    # Accounts


    User accounts are pretty much given on any data-driven site where you have users
    who are contributing to the site. If you need to know who your users are, then
    you need some way of tracking their accounts. Instead of showing you accounts
    from the pure ASP.NET way, this section will show you how to build your own Account
    system from scratch.


    This will include looking at the registration process where our users create their
    initial accounts. To make sure that we block bots and other programs from creating
    accounts in an automated manner, we will implement a reCAPTCHA system and discuss
    some other options that are out there for this. We will implement an email verification
    system to make sure that our users actually are what they claim to be. With all
    this in place we will also discuss setting up a permissions system that we can
    build onto over time. And no chapter on account creation is complete until we
    discuss password encryptions (an often missed topic).


    ![](img/15a62e134135dde036b0ac3cbb01dab6_38_0.png)


    # Profiles


    A user''s profile is really just an extension of his/her account. The difference
    being that the account holds the login information and the profile holds all the
    personal identifiers. It holds the description of the user, the user''s attributes,
    and their photo (avatar). We will discuss creating a user''s profile in a way
    that is flexible enough for all systems to use. We will also discuss how to handle
    creating an avatar in such a way that a user can upload a picture and then crop
    it suitably. As the profile contains a great deal of information about the user,
    we will also implement some forms of privacy to allow them to hide some bits and
    show others. Finally, we will discuss the creation of a personal page for our
    user that will allow them to have a vanity URL, implemented using the URL routing
    feature of ASP.NET, (www.site.com/profiles/AtulGupta) to send to their friends.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '![](img/15a62e134135dde036b0ac3cbb01dab6_39_0.png)


    # # Friends


    The concept of having friends in a community is the glue that keeps people coming
    back to your site. A friend is a user whom you have stated, whom you trust and
    allow to see information about you, and about whom you are generally interested
    in knowing. Think of a friend as a connection, a colleague, and so on. Different
    terms describe the same concept for different community topics.


    In this section, we will not only show you how to implement the **Friends** feature,
    but will also discuss how to search for them, find them in the site''s listings,
    and import your contacts into the site to find your friends. We will also implement
    a microblog allowing your users to provide a status about where they are and what
    they are currently doing.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# Social Networking


    This status will then show up on your microblog and your friend''s microblog as
    an alert.


    ![](img/15a62e134135dde036b0ac3cbb01dab6_40_0.png)


    # Messaging


    Messaging is essential to any community site as it allows users to communicate
    with one another directly. This can come in many forms. You can send a message
    to a user, that is sent directly to the user via email. Or you can allow your
    user to send a message via the site, that is then stored in the recipient''s inbox.
    A notification is then sent out to the recipient. This last form will be easier
    for you to manage as a site administrator.


    In this section we will create a full blown messaging system that will resemble
    a web-based email application similar to Hotmail or Gmail. As part of our interface
    we will show a list of existing friends to send messages to. And we will learn
    how to implement the Xinha WYSIWYG editor in a way that can be re-used easily
    across the site for complex input. We will cover Xinha editor in more detail in
    later chapters.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '![](img/15a62e134135dde036b0ac3cbb01dab6_41_0.png)


    # Media galleries


    There are many communities that are very dependent upon media galleries. An example
    of this is YouTube or something similar. This is frequently the feature that can
    draw the largest percentage of your community back to your site. For that reason,
    it is very important to understand how to build a media system rather than an
    image gallery, video gallery, and so on. We will build a generic media management
    system that will allow you to host videos, photos, resumes, or any number of physical
    files with limited additional tweaking.


    In addition to the media management system, we will take a look at addressing
    one of the biggest limitations of many web programming environments — multi-file
    upload. ASP.NET is great at handling one file at a time, but when managing a photo
    gallery, for instance, you will find that you frequently have a handful or hundreds
    of photos to upload. Rather than creating a Java-based or Active-X-based control,
    which may require some additional installations to your users'' systems, we will
    look at a Silverlight and also a Flash-based implementation.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# Social Networking


    With this we will be able to browse to a directory and upload as many files as
    we want as shown in the following screenshot:


    ![](img/15a62e134135dde036b0ac3cbb01dab6_42_0.png)


    # Blogging


    Blogging is often a major feature in any community site as it gives those who
    enjoy speaking to the world a tool to do just that. On the other hand though,
    the output of your blog generates free content for those who are more on the voyeuristic
    side to read up and follow along with your blogs. One of the biggest benefits
    for a community with active bloggers is that you are acquiring a large amount
    of free content to feed the various search engine spiders with. This in turn will
    help you get your search ranking up, that will drive more traffic to your site,
    and will in turn grow your community.'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'With search engines, users, and security in mind, we will invest some time
    to address an issue that plagues many dynamic websites—query string data being
    used to determine page output. Let''s face it, from a user''s point of view, seeing
    a bunch of variable names in the query string with random auto-generated record
    IDs and 32 character GUIDs is just not that user-friendly and at times downright
    confusing. Add to this that search engines these days seem to be able to navigate
    some of this query string mumbo jumbo, but we are losing a key opportunity to
    optimize our site for keywords by spoofing URLs as though our keywords were directories.
    We will continue from our profile''s example and extend our vanity URL support
    so that we can have something along the lines of www.sitename.com/blogs/AtulGupta/my-article-name.aspx.


    # Forums


    Everyone is well aware of what a forum is. For a social network, it is a disconnected
    form of communication where people can post something to discuss and others can
    happen across the posted item over time to add their two cents. Frequently in
    the developer world, you will have a community that is 100 percent focused around
    this sort of feature in the form of a technical help forum. For our site that
    centers on helping others figure out how to run an aquarium, we will find this
    feature useful.


    ![](img/15a62e134135dde036b0ac3cbb01dab6_43_0.png)


    The above screenshot shows how the message board will look.'
  merge: -1
