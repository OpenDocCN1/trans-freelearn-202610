- pgno: 212
  md: '# Messages


    A message will primarily be made up of the subject and its body. In addition to
    that we will need to know what type of message we are sending so that we can do
    some more fancy things in the UI down the road. In addition to this, we are going
    to maintain who owns/created the message at this level.


    There aren''t really any major complexities to note here other than the fact that
    the **Body** is made up of a **varchar(MAX)** data type. If you feel this is too
    large for your system, feel free to make it anything you are comfortable with.
    The value you eventually use will drive the message for your system.


    # MessageTypes


    Message Types allows us to assign a type to our messages. This is purely a lookup
    table that will allow us to know what the types are during queries. We will keep
    a list of enums in the code to make the lookups easier from that end.


    # MessageRecipients


    A message recipient is simply the receiving party to the message. But as we try
    to minimize the data that we manage in our system, the message recipient is also
    a very important part of the message. In our case, it is the receiving party as
    well as all the things that the receiving party does with their subscription of
    that message. We will use this subscription to denote which folder the receiver
    is keeping the message in, and whether the receiver has read the message or not.
    Also, if the receiver chooses to delete the message, he/she can just delete the
    subscription to a message (unless they are the last subscription, in which case
    we will delete the message as well).


    The SQL for this subscription is actually quite straightforward. It tracks a relationship
    to the message, a relationship to the receiver, which folder the subscription
    is currently in, and the status of the message for this receiver.


    # MessageRecipientTypes


    The message recipient type allows us to track the receiver of this message addressed
    in the **TO**, **CC**, or **BCC** fields. Initially, our interface will only have
    a **TO** field. We should add this bit of metadata though just in case we want
    to expand our capabilities down the road! This is another example of a lookup
    table that we might need to use in the SQL queries. In our case, we will have
    an enum defined that maintains this lookup for us on the code side.'
  merge: -1
  img_proc: true
