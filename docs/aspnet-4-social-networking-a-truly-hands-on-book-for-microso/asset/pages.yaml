- pgno: 185
  md: "This method currently searches through a user's first name, last name, email\
    \ address, and username. This could of course be extended to their profile data\
    \ and many other data points (all in good time!).\n\n+   - Implementing the services/application\
    \ layer\n\nNow that we have the repositories in place we can begin to create the\
    \ services that sit on top of those repositories. We will be creating one service\
    \ per repository added and in addition to that we will also be extending these\
    \ services:\n\n+   - AlertService\n\n+   - PrivacyService\n\n# FriendService\n\
    \nThe FriendService currently has a couple of duties. We will need it to tell\
    \ us whether or not a user is a Friend or not so that we can extend the PrivacyService\
    \ to consider friends (recall that we currently only understand public and private\
    \ settings!). In addition to that we need our FriendService to be able to handle\
    \ creating Friends from a FriendInvitation.\n\n```\n//Fisharoo/BusinessLogic/FriendService.cs\n\
    public bool IsFriend(Account account, Account accountBeingViewed)\n{\n    if(account\
    \ == null)\n        return false;\n    if(accountBeingViewed == null)\n      \
    \  return false;\n    if(account.AccountID == accountBeingViewed.AccountID)\n\
    \        return true;\n    else\n    {\n        Friend friend = _friendRepository.GetFriendsByAccountID(accountBeingViewed.AccountID).Where(f\
    \ => f.MyFriendsAccountID == account.AccountID).FirstOrDefault();\n        if(friend\
    \ != null)\n            return true;\n    }\n    return false;\n}\n```"
