- pgno: 144
  md: "> Lambda Expression consists of a lambda operator '=>' (pronounced as goes\
    \ to), left side of which signifies the input parameter and right side signifies\
    \ the expression or statement block to be evaluated. The main advantages of these\
    \ over standard query are type inference, simplicity, and increased readability\
    \ of code.\n\nOther repositories are built on similar lines and we will not be\
    \ showing the code here. You can check out the code associated with this chapter\
    \ for more details.\n\n# Implementing the services/application layer\n\nOnce all\
    \ the repositories are built for single-serving purposes, we can begin creating\
    \ the service layer. Service layer will be consumed by Presentation layer project.\
    \ The Repository classes (except entities) will never be accessed directly in\
    \ Presentation layer project and will be always accessed only in BusinessLogic\
    \ project. This will help maintain the coupling and cohesion between various layers\
    \ in the application. Not only this, it also helps in establishing the design\
    \ principle of \"separation of concerns\" that means each layer will only perform\
    \ dedicated activities expected from it.\n\nWe will create some services, namely\
    \ ProfileService, PrivacyService, AlertService, ProfileAttributeService, LevelOfExperienceTypeService,\
    \ and PermissionService.\n\nIn addition to the above services, we will also need\
    \ to modify a couple of services.\n\n# ProfileService\n\nNow we can look at building\
    \ our ProfileService. Create a new class in the BusinessLogic project called ProfileService.\n\
    \n```\n//Fisharoo/BusinessLogic/ProfileService.cs\nnamespace Fisharoo.BusinessLogic\n\
    {\n    //CHAPTER 4\n    [Export(typeof(IProfileService))]\n    public class ProfileService\
    \ : IProfileService\n    {\n        [Import]\n        private IProfileRepository\
    \ _profileRepository;\n        [Import]\n        private IAlertService _alertService;\n\
    \        [Import]\n```"
