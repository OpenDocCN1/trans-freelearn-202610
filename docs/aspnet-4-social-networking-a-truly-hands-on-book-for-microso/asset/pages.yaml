  md: "# User Accounts\n\nHere are the added Redirector methods:\n\n```\n```csharp\n\
    //Fisharoo/Components/Redirector.cs\n...\n    public void GoToAccountRegisterPage()\n\
    \    {\n        Redirect(\"~/Account/Register.aspx\");\n    }\n...\n    public\
    \ void GoToAccountRecoverPasswordPage()\n    {\n        Redirect(\"~/Account/RecoverPassword.aspx\"\
    );\n    }\n...\n```\n```\n\n> We hope you are noticing that as each file is responsible\
    \ for a very specific set of tasks, each file is also short and sweet. While this\
    \ is a complex way of thinking about things, it is very nice to work with!\n\n\
    # Registration page\n\nWe will admit that using the standard .NET controls to\
    \ create an account is so much easier! Having said that, it was quite a bit of\
    \ fun creating the registration page for this site. We ended up using a wizard\
    \ control to display the various steps of the registration process and also used\
    \ the out-of-box formatting for it. Our steps are as follows (as the ASPX code\
    \ takes up lot of space, we have put images of how the screens look instead. For\
    \ code refer to the code associated with this chapter):\n\n+   1. We always start\
    \ by grabbing the email, username, and password of the users. There is validation\
    \ in place for all of these. We want to validate their email addresses for their\
    \ authenticity. We also want to make sure that their username conforms to some\
    \ length rules. Then we allow them to enter their password and require them to\
    \ re-enter their password to verify that what they have entered is what they meant\
    \ to enter. And of course, all these fields are required!\n\n![](img/15a62e134135dde036b0ac3cbb01dab6_108_0.png)"
  merge: -1
  img_proc: true
- pgno: 109
  md: '+   2. The next step is to get some descriptive information about the users
    such as their first names and last names. When building a community site of any
    type, it is usually important that you also harvest their birthday and zip code
    or postal code. This lets you know what is appropriate for them and where in the
    world they are. There is validation in place to make sure that the date of birth
    they enter is a valid date (MM/DD/YYYY format) and that the zip code is a valid
    format for US. Though we have validated for only US zip codes, in a community
    site you will need to validate based on different formats for different countries.
    All these fields are also required fields.


    ![](img/15a62e134135dde036b0ac3cbb01dab6_109_0.png)


    +   3. The third step presents the terms and conditions. This is the one step
    that requires you to fetch some data for display. This data is retrieved from
    the `TermRepository.GetCurrentTerm()` (which we covered earlier). All the user
    needs to do here is read the terms (most of your users won''t do this of course!)
    and check the box indicating that they agree with your terms (we have kept it
    checked by default).


    ![](img/15a62e134135dde036b0ac3cbb01dab6_109_1.png)'
