- pgno: 428
  md: '# Web farming


    **Web farming** (or load balancing) is the concept of spreading out your site''s
    traffic over many servers. This addresses most of the performance problems whether
    in the application or on the server, by expanding your infrastructure and sharing
    the load across many servers. Generally, whoever is doing your load balancing
    will take a look at all the servers in your farm and route the user to the server
    with the lowest load. There are several ways to do this, and we will touch upon
    many of them lightly.


    We are going to assume that we are interested in learning how to create a web
    farm in a windows environment.


    > For those who need a Linux solution you might try **Ha Proxy** (http://haproxy.1wt.eu/)
    or something similar.


    Specifically, we are going to talk about setting up a web farm using Windows using
    the **Network Load Balancing (NLB)**. This allows you to host a handful of servers
    behind one virtual IP address on your network.


    For this to work, each server in the farm needs to be configured identically so
    that any request that goes to any server will be handled in the same fashion.
    When a request comes to the virtual IP address, the packet will be routed to the
    least busy server. This configuration allows support of the concept of a reliable
    service. Meaning that if one server goes down, the farm will simply rebalance
    itself and route traffic to the servers that are still up.


    To set this up, you need at least two machines running the Windows Server 2008.
    Each machine will need to have one fixed IP address. While the machine can run
    on one network card, two cards are preferred—one card having the fixed IP address
    and the other using the virtual IP address. The IP addresses must be on the same
    class C network.


    Windows Server 2008 comes with limited preinstalled features. You will need to
    enable **Network Load Balancing** on it. For this go to **Server Manager** from
    **Administrative Tools** and in **Features** section select **Add Features** option.'
  merge: -1
  img_proc: true
- pgno: 429
  md: '![](img/15a62e134135dde036b0ac3cbb01dab6_429_0.png)


    Once installed, open the **Network Load Balancing Manager** from **Administrative
