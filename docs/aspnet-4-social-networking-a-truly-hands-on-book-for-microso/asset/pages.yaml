    \ the user and cast the object as a person. This is much better OOP-wise. Let's\
    \ look at the wrapper and for brevity, we will only look at key or new aspects\
    \ in this code.\n\nLet us look at some of the public method definitions. These\
    \ are all pretty easy to understand and primarily work with the HttpContext object.\
    \ We have a ClearSession() method that simply resets the session. We have a ContainsInSession()\
    \ method that takes a key value. It checks whether that key is present in the\
    \ session and returns true or false. The RemoveFromSession() method that takes\
    \ in a key and attempts to remove that key from the session.\n\nAfter our public\
    \ methods, we have a few private methods, namely, GetQueryStringValue(), SetInSession(),\
    \ GetFromSession(), and UpdateInSession(). Before we discuss these methods, we\
    \ need you to understand why they are private. We could make all of these public\
    \ and they would work just fine. However, making them public would also mean that\
    \ we would scatter code about our application that directly interacts with the\
    \ session. Our preference is that we extend this object to provide more specific\
    \ methods that work with these private methods, that in turn work with the session.\
    \ This provides us a bit more encapsulation regarding the session interaction."
  merge: -1
  img_proc: true
- pgno: 67
  md: "The **GetQueryStringValue()** method takes in a key value and retrieves the\
    \ item from the query string. The **SetInSession()** method allows you to pass\
    \ in a key and an object. The object is then stored in the session under that\
    \ key name. **GetFromSession()** does just that—it takes a key and retrieves that\
    \ corresponding object. **UpdateInSession()** is very similar to **SetInSession()**\
    \ with the exception that it assumes that a key already exists and updates the\
    \ value that is currently stored there. This method will throw an error if a key\
    \ does not exist. Therefore prior to using this method, you should check that\
    \ your key exists in the session collection!\n\n# Redirection\n\nFrom an OOP point\
    \ of view, Response.Redirect is about as useful as the session object is (we're\
    \ starting to see a trend here). It simply provides a way of sending you from\
    \ one place to another. It would be nice if we could work with it using methods.\
    \ It would be even better if we could hide some logic in those methods if need\
    \ be. Our initial implementation is very easy.\n\n```\n```csharp\n//Fisharoo/Components/Redirector.cs\n\
    using System.ComponentModel.Composition;\nusing System.Web;\nusing Fisharoo.Interfaces;\n\
    \nnamespace Fisharoo.Components\n{\n    [Export(typeof(Redirector))]\n    public\
    \ class Redirector : IRedirector\n    {\n        public void GoToHomePage()\n\
    \        {\n            Redirect(\"~/Default.aspx\");\n        }\n\n        public\
    \ void GoToErrorPage()\n        {\n            Redirect(\"~/Error.aspx\");\n \
    \       }\n\n        private void Redirect(string path)\n        {\n         \
    \   HttpContext.Current.Response.Redirect(path);\n        }\n    }\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 68
  md: "This class, like the others, uses MEF so that it can be stubbed out for testing\
    \ later. Currently there are two methods—one an example, and another handling\
    \ redirection. Let's look at the Redirect() method. It takes a path parameter\
    \ and then uses the HttpContext object to redirect the user to the appropriate\
    \ location. An example is the GoToHomePage() method. It asks the Redirect() method\
    \ to send the user to the homepage. If the homepage of the application changes\
    \ later, we need to edit only this method.\n\nOf course, this class can be expanded\
    \ with as many new methods as needed to redirect for any purpose. We can extend\
    \ this object to be a bit more versatile too. We can also perform all sorts of\
    \ logic inside these methods prior to using the redirection, obviously without\
    \ degrading the overall design and where actually required.\n\n# # Email\n\nSending\
    \ emails is one task that every website has to be capable of. How many emails\
    \ you plan to send should certainly determine how you go about sending that email.\
    \ As we do not yet know how many emails we plan to send, we will initially rely\
    \ upon the tools that are provided in the .NET framework to send our email. For\
    \ brevity, we will look at the specific methods from this class here.\n\nAs with\
    \ all our objects, we will have the MEF Export attribute in place that makes this\
    \ a Pluggable class. The class itself inherits from our IEmail interface. We will\
    \ have a couple of constants declared—one for the website's receiving the email\
    \ account and another for the website's sending the email account. (We could have\
    \ used one variable for both, but a little flexibility never hurt anyone!) We\
    \ then jump into our first method:\n\n```\npublic void SendEmail(string From,\
    \ string Subject, string Message)\n{\n    MailMessage mm = new\n    MailMessage(From,TO_EMAIL_ADDRESS);\n\
    \    mm.Subject = Subject;\n    mm.Body = Message;\n    Send(mm);\n}\n```\n\n\
    This method is one of the various overrides for the SendEmail() method. This one\
    \ is a bit different from the others in that it is used for the site to send email\
    \ to another site rather than to a user. The user of this method will provide\
    \ the email address that the message is from, the subject and the message. This\
    \ method would be used in a 'Contact Us' page or a similar mail form. At the bottom\
    \ of this method, you will see a Send() method call. This method spins up an SmtpClient\
    \ and sends the email message as do each of the other SendEmail() methods."
  merge: -1
  img_proc: true
- pgno: 69
  md: "The remaining `SendEmail()` methods are used in various ways for the site to\
    \ send an email to the users of the site. These allow sending email to a single\
    \ user (single user for **To**, **CC**, and **BCC** inputs) or to an array of\
    \ users (multiple users for **To**, **CC**, and **BCC** inputs). The `SendIndividualEmailsPerRecipient()`\
    \ method accepts multiple user names but sends individual emails per user.\n\n\
    Finally, we get to the `Send()` method that is used by all of the other methods.\
    \ This method is responsible for actually sending the emails. But before this\
    \ method performs any action, we need to add the following section to our `web.config`\
    \ just after the configuration tag. It is responsible for telling the .NET framework\
    \ how to connect to our mail server.\n\n```\n```xml\n<system.net>\n    <mailSettings>\n\
    \        <smtp>\n            <network host=\"localhost\" port=\"25\"\n       \
    \              defaultCredentials=\"true\" />\n        </smtp>\n    </mailSettings>\n\
    </system.net>\n```\n```\n\nNow, we can define the last method `Send()` as:\n\n\
    ```\n```csharp\nprivate void Send(MailMessage Message)\n{\n    SmtpClient smtp\
    \ = new SmtpClient();\n    smtp.Send(Message);\n}\n```\n```\n\nThis configuration\
    \ is very flexible in how it sends the email. However, it still requires the webpage\
    \ to be responsible for sending emails directly. This creates a page with lots\
    \ of overheads given that there could be a lot of recipients to process, or a\
    \ lot of network lag involved in the transactions.\n\nThe nice thing about having\
    \ this class is that we can easily create another class that implements the `IEmail`\
    \ interface but uses a mail queue instead of requiring the page to send the email.\
    \ This would allow the website to just create mail messages and put them in the\
    \ queue, which is much faster than actually processing and sending the emails.\
    \ We could then have a queue processor somewhere that would be responsible for\
    \ sending our emails. We will look at this further in Chapter 13."
  merge: -1
  img_proc: true
- pgno: 70
  md: '# # Error handling and logging


    We don''t think any "enterprise application" can truly be called "enterprise"
    if it doesn''t handle errors well and notify someone to address them. In an ASP.NET
    site, there are basically two forms of errors—errors that you have caught, and
    the ones you couldn''t. Pretty simple, right? Well, not so fast! Whether you have
    trapped an error or not, the user of your application is still going to end up
    with some form of disruption in their surfing experience. So we need a way to
    not only provide users with a smooth disruption but also to fix the disruption
    so that it doesn''t happen again.


    Error handling is the act of doing your best to trap expected or possible errors.
    It is also the act of not allowing ugly error messages to get in front of your
    customers. Logging is to capture details of these errors so that we can fix them
    down the road.


    # ## Logging


    Logging can either be overly complex, or really easy. As we don''t have loads
    of time on our hands, we usually opt not to reinvent the wheel whenever possible!
    So in this case, we will be using the log4net framework that provides an extensive
    set of tools for various forms of logging.


    ![](img/15a62e134135dde036b0ac3cbb01dab6_70_0.png)


    > > For more information regarding the log4net project look here:

    > > **http://logging.apache.org/log4net/**


    To get log4net working, you will need to copy the log4net.dll and the log4net.xml
    files into your bin directory in the Components project. Once it is there, add
    a reference to log4net. Then you will need to create a log4net.config file in
    the root or bin directory of your Web project.


    ![](img/15a62e134135dde036b0ac3cbb01dab6_70_1.png)


    > > For more information about log4net configuration look here: **http://logging.apache.org/log4net/release/config-examples.html.**


    Now, we can create a class which implements our ILogger interface and helps us
    to interact with what log4net provides us. Since this is a routine code, we are
    not going to discuss it in detail here. You can refer to the code associated with
    this chapter for the implementation. Once the logging class is complete, all we
    have to do is send something to the log. Let''s go back to the Global.asax.cs
    file and add this line at the bottom of the Application_Error() method:


    ```

    ```csharp

    Log.Error(sender,"Error caught by the Global.asax: " + e.ToString());

    ```

    ```


    That should take care of our logging needs!'
  merge: -1
  img_proc: true
