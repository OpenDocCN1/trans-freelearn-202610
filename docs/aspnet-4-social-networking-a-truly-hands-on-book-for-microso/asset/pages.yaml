    \ can be created.\n\nLet's extend our Profile object by creating a new Profile\
    \ partial class in the DataAccess project. In this class, let's add a property\
    \ to store the list of profile attributes and a property to hold the level of\
    \ experience for the profile. We don't need to have corresponding scalar properties\
    \ as these would be available and hence we need not worry about adding them in\
    \ this partial class. The Profile partial class would look like as:\n\n```\n//Fisharoo/DataAccess/Profile.cs\n\
    namespace Fisharoo.DataAccess\n{\n    public partial class Profile\n    {\n  \
