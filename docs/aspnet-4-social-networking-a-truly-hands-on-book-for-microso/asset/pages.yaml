  md: "# Messaging\n\nNow, we will move on to the presenter of this page. This page\
    \ has three primary tasks:\n\n+   - To send a message\n+   - To preload a recipient\
    \ of a message (if linked to from an Alert) and\n+   - To send a reply to a message\n\
    \nThis is really the same thing with the exception that to send a reply to a message,\
    \ we would first have to load that reply. We will get to that down the road!\n\
    \nTo send a message, we have to bubble up the button click event through our code\
    \ behind and into our presenter. As we have covered this concept of MVP extensively\
    \ in earlier chapters, we will not cover it here. So, in the presenter, we have\
    \ added a method called SendMessage(), that takes in the Subject, Message, and\
    \ an array of To entries.\n\n```\n```csharp\n//Fisharoo/Web/Mail/Presenters/NewMessagePresenter.cs\n\
    public void SendMessage(string Subject, string Message, string[] To)\n{\n    _messageService.SendMessage(Message,\
    \ Subject, To);\n}\n```\n```\n\nThis method then calls the MessageService.SendMessage()\
    \ method and sends the message.\n\nThe preloading of a recipient is handled in\
    \ the Init() method of the presenter. It checks to see if we have an AccountID\
    \ in the QueryString (via our WebContext wrapper). If so, it gets the Accounts\
    \ Username property and adds that to the To field in the UI.\n\nLoading a reply\
    \ message into the UI is very similar to loading a username. The Init() method\
    \ checks the WebContext to see if we have a MessageID in the QueryString and loads\
    \ the previous Message details into the UI. This is done if the page request isn't\
    \ a post back request.\n\n```\n```csharp\n//Fisharoo/Web/Mail/Presenters/NewMessagePresenter.cs\n\
    public void Init(INewMessage view, bool IsPostBack)\n{\n    _view = view;\n  \
    \  if(!IsPostBack)\n    {\n        if(_webContext.MessageID != 0)\n          \
    \  _view.LoadReply(_messageService.GetMessageByMessageID(\n            _webContext.MessageID,_userSession.CurrentUser.AccountID));\n\
    \    }\n}\n```\n```"
