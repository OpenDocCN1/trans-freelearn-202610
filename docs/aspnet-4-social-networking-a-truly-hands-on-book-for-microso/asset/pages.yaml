- pgno: 458
  md: "# Scaling Up\n\nNote that we have an object declaration at the top of the class\
    \ called `_indexBuildLocker`. We can then place a lock on this object any time\
    \ we call into the `BuildIndexes()` method. If the object is locked when another\
    \ call is made to this method, the call will be blocked until the lock is released.\n\
    \nWith this method in place as the gateway to our other methods that will build\
    \ our indexes, we can get started. Let's start by creating a `BuildBlogIndex()`\
    \ method. This method will be responsible for building the index for our blog\
    \ data. Refer code at `// Fisharoo/BusinessLogic/LuceneSearchService.cs`.\n\n\
    The first major step to build an index is to open an `IndexWriter`. This is done\
    \ by passing in a `Directory` and a `StandardAnalyzer`. As we will have more than\
    \ one index builder, we pulled out the `Directory` logic and put it into the `getCacheDirectory()`\
    \ method to return the appropriate `Directory`.\n\n```\nprivate Directory getCacheDirectory(string\
    \ SubFolder)\n{\n    if (!System.IO.Directory.Exists(_indexPath + \"\\\\\" + SubFolder))\n\
    \    {\n        System.IO.Directory.CreateDirectory(_indexPath + \"\\\\\" +\n\
    \                                            SubFolder);\n    }\n    _directory\
    \ = FSDirectory.GetDirectory(_indexPath + \"\\\\\" +\n                       \
    \                   SubFolder, false);\n    return _directory;\n}\n```\n\nThe\
    \ `StandardAnalyzer` is used to clean out the busy words from the index that is\
    \ being created. This way, words such as 'the', 'and', 'is', and so on, will be\
    \ removed.\n\n![](img/15a62e134135dde036b0ac3cbb01dab6_458_0.png)\n\n> It is important\
    \ that if you clean the words going into your index, you also need to remove any\
    \ busy words from your queries!\n\nThe next set of code allows us to work with\
    \ smaller sets of data. We don't want to get a million records to work with as\
    \ we build our index. Instead, we will work in smaller sets of data. So we are\
    \ carefully watching to see if we have more records using the while (moreRecords)\
    \ statement. Once we get the remaining records from our `BlogRepository` we will\
    \ set the moreRecords variable to `false`.\n\nAs we get the records for building\
    \ into our index, we need to iterate through each record to actually add to the\
    \ index. A Lucene.NET index is made up of Documents. So with each new Blog record\
    \ we want to create a new Document, as done in the foreach block in the code above."
  merge: -1
