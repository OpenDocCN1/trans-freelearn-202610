    # Configuration


    The Configuration class is responsible for reading the values in our config files.
    In this last round of coding features we have added the following properties:


    +   - TagCloudLargestFontSize: This value sets the largest font size for display
    in the tag cloud.

    +   - TagCloudSmallestFontSize: This value sets the smallest font size for display
    in the tag cloud.

    +   - CloudSortOrder: This value sets the sort order of the tags in the cloud.

    +   - NumberOfTagsInCloud: This value sets the number of tags to be displayed
    in the cloud.


