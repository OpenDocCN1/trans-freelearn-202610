- pgno: 161
  md: 'This method is responsible for receiving the file and performing some basic
    checks on the file. We first get the extension of the file being uploaded and
    check to make sure that the file that was uploaded is an image that we support.
    If not, we show a message stating the issue.


    Once we make it past that check, we check to make sure that the file size is not
    too large. If the file is in an acceptable size, we read the file into the uploadedImage
    byte array. We then pass the byte array into the current profile''s Avatar property
    along with its mimetype (we also set the UseGravatar flag to 0, which we will
    discuss shortly). Finally, we save this data to the user''s profile and update
    the display to show the cropping UI. Alternatively, if the file size was too large,
    we show an error message.


    # Image manipulation


    To start with, the entire UI for this image-cropping tool is located at: http://www.defusion.org.uk/code/javascript-image-cropper-ui-using-prototype-scriptaculous/.
    This is an open source JavaScript tool that provides us with all the fancy interface
    options that can be dragged and resized. It uses prototype (http://www.prototypejs.org/),
    scriptaculous (http://script.aculo.us/), and some fancy footwork from Dave Spurr.
    To implement this script, download the source from the defusion site above and
    include the references to the prototype, scriptaculous, and cropper files in the
    UploadAvatar.aspx.


    ```

    //Fisharoo/Web/Profiles/UpdateAvatar.aspx

    <script type="text/javascript" src="/js/cropper/lib/prototype.js" language="javascript"></script>

    <script type="text/javascript" src="/js/cropper/lib/scriptaculous.js?load=builder,dragdrop"
    language="javascript"></script>

    <script type="text/javascript" src="/js/cropper/cropper.js" language="javascript"></script>

    ```


    Once you have the JavaScript side plugged in, you need to add some items to your
    ASPX page to get this widget factory working. To start with, we need to add an
    image control that will load the image that we want to operate on.


    ```

    <asp:Image ImageUrl="~/images/ProfileAvatar/ProfileImage.aspx" id="imgCropImage"
    runat="server"/>

    ```


    > Note that this Image control has an ImageUrl reference to a page rather than
    an image. The images/ProfileAvatar/ProfileImage.aspx page displays a user''s avatar
    depending on the current configuration of his/her profile. If it doesn''t have
    an avatar, it shows a default avatar. If it is decided to use the Gravatar service
    instead (discussed shortly) it shows the avatar stored on Gravatar.'
