- pgno: 265
  md: '# # 8

    ## Blogs


    People join a community to either look for or provide information on a pre-specified
    topic. Often this is performed by way of a blog. A blog allows people to freely
    express themselves by way of providing stories, articles, or quick blurbs generally
    on any topic with the community.


    Building this key feature into your community is actually one of the easiest things
    to do. Having built so many features to this point, snapping in the blog module
    and its required components will go quite smoothly. We will cover not only creating
    a blog but also how to add friendly URLs to our blog posts. Once this is in place
    we will follow it up by attaching our blogging system to our alerts system.


    # ## Problem


    In this chapter we will add the blogging feature to our site. This will handle
    creating and managing a post. It will also handle sending alerts to your friends''
    alert page. And finally we will handle creating a friendly URL for your blog posts.'
  merge: -1
  img_proc: true
