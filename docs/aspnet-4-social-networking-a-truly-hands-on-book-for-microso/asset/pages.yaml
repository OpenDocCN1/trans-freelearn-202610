    \ so we will not be discussing them here.\n\n# AccountRepository\n\nThis particular\
    \ repository is the one that has grown over several chapters. In order to support\
    \ Groups we had to add a couple of new methods to this class — GetApprovedAccountsByGroupID\
    \ and GetAccountsToApproveByGroupID. These allow us to use our GroupMembers table\
    \ to look up an actual Account from a membership point of view. We will get users\
    \ who would like to be a part of our group, and the members who are already a\
    \ part of the group.\n\n# GetApprovedAccountsByGroupID\n\nThis method is primarily\
    \ of interest for the reason that it supports server-side paging, that is to say,\
    \ it has the ability to show a subset of records within the larger selection.\
    \ This is accomplished using some standard LINQ expressions—Skip() and Take().\n\
    \n```\n```csharp\n//Fisharoo/DataAccess/Repositories/AccountRepository.cs\npublic\
    \ List<Account> GetApprovedAccountsByGroupID(int GroupID,\n                  \
    \                                 int PageNumber, int\n                      \
    \                             NumberOfRecordsInPage)\n{\n    List<Account> result\
    \ = null;\n    using (FisharooDataContext dc = conn.GetContext())\n    {\n   \
    \     IEnumerable<Account> accounts = (from a in dc.Accounts\n               \
    \                          join m in dc.GroupMembers on a.AccountID equals\n \
    \                                        m.AccountID\n                       \
    \                  where m.GroupID == GroupID && m.IsApproved\n              \
    \                           orderby a.AccountID\n                            \
    \             select a).Skip((NumberOfRecordsInPage *\n                      \
    \                   (PageNumber - 1))).Take(NumberOfRecordsInPage);\n        result\
    \ = accounts.ToList();\n    }\n    return result;\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 321
  md: "In this method, we are accepting the GroupID and PageNumber. This tells us\
    \ the set and also the subset of the data that we are interested in. The LINQ\
    \ to Entity query is very standard up to the point of call to the Skip() method.\
    \ This call allows us to tell the query which record we want to start at in the\
    \ set of data. Directly after that we call the Take() method, that tells the query\
    \ how many records from the starting record we want to include in our returned\
    \ set of data.\n\nThe easiest way to perform the skip logic is to take the number\
    \ of records we want our page size to be (stored in a config file somewhere) and\
    \ multiply it by the page number we are currently on (minus one as this is technically\
    \ a zero-based way of doing things). The Take() method just wants to know how\
    \ many records you are interested in to make up your page set of data.\n\n# GetAccountsToApproveByGroupID\n\
    \nThis method isn't anything more than a simple query around GroupMembers and\
    \ Groups.\n\n```\n```csharp\n//Fisharoo/DataAccess/Repositories/AccountRepository.cs\n\
    public List<Account> GetAccountsToApproveByGroupID(int GroupID)\n{\n    List<Account>\
    \ result = null;\n    using (FisharooDataContext dc = conn.GetContext())\n   \
    \ {\n        IEnumerable<Account> accounts = (from a in dc.Accounts\n        \
    \                                 join m in dc.GroupMembers on a.AccountID equals\
    \ m.AccountID\n                                         where m.GroupID == GroupID\
    \ && !m.IsApproved\n                                         select a);\n    \
    \    result = accounts.ToList();\n    }\n    return result;\n}\n```\n```\n\n#\
    \ Implementing the services/application layer\n\nOnce all the repositories are\
    \ built for single serving purposes we can begin to create the services layer.\
    \ Again, this layer is responsible for assembling aggregates and performing complex\
    \ actions with our entities. We will create and modify the following services:\n\
    \n+   - GroupService\n+   - AlertService\n+   - Redirector\n+   - WebContext"
  merge: -1
  img_proc: true
