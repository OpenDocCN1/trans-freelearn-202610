- pgno: 80
  md: '# User Accounts


    In this chapter, we will discuss many of the common features that are related
    to user accounts. This will include handling registration, authentication, permissions,
    and security. We will also go over some basic tools such as password reminders,
    account administration, and reCAPTCHA. This chapter will provide the foundation
    for our users upon which we will be able to build all of our other features.


    # # Problem


    With most sites these days, regardless of their purpose, you need to know who
    your users are. You need to know this so that you can restrict how users interact
    with the site, or you might need this information so that you can provide a dynamic
    experience to your user. No matter what your reason is, the task of identifying
    and controlling the users has a few basic requirements.


    In order to get to know our users, we will need a way to register them on our
    site. This would give us a footprint for that user, that we can use each time
    the user returns. The registration process is fairly straightforward most of the
    time so that we can easily bring onboard new users. We need to capture the data
    that we are interested in (such as username, password, email, and so on). We must
    make sure that we store their password properly so that their identification is
    safe not only from the other users of the site but also from the administrators
    and staff of the site. Also, given the amount of fraud and spam on the Internet
    these days, we need to equip our site with some form of intelligence to guard
    it from automated registrations. In another attempt to protect the site, we need
    to make sure that our users are providing us with valid information. We can do
    this by validating the email provided by them to check if it is a functioning
    account under their control. As part of the registration process, we also need
    to inform the user about our current terms and conditions so that they know the
    rules of our site up-front.


    > > When we refer to automated registrations, we are really describing the act
    of a bot (or program) that is used to create accounts with the sole purpose of
    posting advertisements to public areas such as message boards, blogs, and so on.


    Once a user has successfully registered, we will need to provide them with tools
    so that they can identify themselves to us each time they return. This is typically
    done using a centralized login screen. Upon successful authentication, we can
    track that user through the site. Knowing that users frequently forget the information
    that they provided us with, we will need to offer tools to remind the users how
    to get into our site with a password reminder feature. After the users have authenticated
    themselves, we would need to define where a user can go and what they can do on
    our site with some kind of permissions-based system.'
  merge: -1
  img_proc: true
