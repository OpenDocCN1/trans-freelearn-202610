  md: '# Friends


    The presenter promptly passes the selected items to the **Email** class to handle
    the invitations. This is the same method that we used in the last section to invite
    users.


    We then output the result of the emails that we invited into the third view/panel,
    that is a simple message that displays the emails to which the invitation was
    sent.


    # Confirm friendship


    Having covered all these ways to invite someone into our site, we now need to
    look at what the invited user sees in the invitation. Let''s start with what they
    would see in their inbox. The user gets an email in their inbox telling them that
    someone has invited them to become part of the Fisharoo community.


    Once they open that email they can see the link that they can follow to the site
    to take advantage of the invitation. Clicking the link brings them to server/appname/Friends/ConfirmFriendshipRequest.aspx
    with a GUID for an invitation key. There are two screens that the user might see
    after this point.


    The first screen is for the users who are already members and are currently logged
    into the site. It asks them to log in again to confirm the friendship.


    ![](img/15a62e134135dde036b0ac3cbb01dab6_198_0.png)


    The other screen is for the users who aren''t members, or the users who aren''t
    logged in.'
