- pgno: 125
  md: '# ## All nodes


    By default the SiteMap class doesn''t return all nodes so to speak. It provides
    you with a call to the RootNode and a call to its children. As you can see in
    our first method, we simply created an AllNodes() call that returns "all nodes".


    # ## Navigation


    Our site will have several navigation sections. Here we have:


    +   - Top navigation

    +   - Primary navigation

    +   - Secondary navigation

    +   - Left navigation

    +   - Footer navigation


    If we had to dig through all of the navigation collections, each time we needed
    them we may find it quite cumbersome. Instead we will add methods to the classes
    that produce the required sub-selection of nodes.


    The PrimaryNodes() method is the first example of such a method. It produces a
    list of nodes that go in the primary navigation section by iterating through all
    the nodes returned by the AllNodes() method looking for each node with a custom
    topnav attribute. You will notice a special filter though in addition to this.
    With each topnav node that is found, a security check is performed to see if the
    current user should have access to this node. If not, the node is not displayed.


    The FooterNodes() method is exactly the same as the PrimaryNodes() method with
    the exception that it looks for a footernav attribute. This method also checks
    to make sure that the user has access to a specified collection of nodes.


    # ## Checking access


    This brings us to the CheckAccessForNode() method, that we are using in our other
    methods. This method looks at the passed in node and checks its Roles collection.
    It first checks to see if the PUBLIC role is specified. If so, all remaining checks
    are not performed. We then move to see if there is an account present, that is,
    whether any user has logged in. If there is a user, we check their permissions
    property. If that exists, we check to see if there are any permissions in the
    permission list. We then iterate through each role specified in the node and check
    to make sure that the account has that permission. If the account doesn''t contain
    any of the specified permissions we return false. If all the permissions are valid
    then we return true.'
