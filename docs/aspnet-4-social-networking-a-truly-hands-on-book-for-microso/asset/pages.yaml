    \ in the earlier chapter.\n+   - Hit **Save** and you should have the above discussed\
    \ domain objects to work with!\n\nYour design surface should have all the same\
    \ items as you see in the previous screenshot (though perhaps in a different arrangement!).\n\
    \n# ## Building repositories\n\nWith the addition of new tables will come the\
    \ addition of new repositories so that we can get at the data stored in those\
    \ tables. We will be creating the following repositories to support our needs.\n\
    \n+   - BoardCategoryRepository\n+   - BoardForumRepository\n+   - BoardPostRepository\n\
    \nEach of our repositories will generally have a method for selecting by ID, select\
    \ all by parent ID, save, and delete. Once you have seen one repository you have\
    \ pretty much seen them all. Review previous chapters, the appendices, or the\
    \ included code for examples of a standard repository. We will, however, discuss\
    \ anything that varies from the standard approach we are following so far!\n\n\
    # ### BoardCategoryRepository\n\nOne of the most important features of our message\
    \ board that may be a bit different from other message boards is that it is very\
    \ important for us to support friendly URLs. This means that we will need a method\
    \ in each of our repositories to get the object by page name. Here is the method\
    \ for this repository:\n\n```\npublic BoardCategory GetCategoryByPageName(string\
    \ PageName)\n{\n    BoardCategory category;\n    using(FisharooDataContext dc\
    \ = _conn.GetContext())\n    {\n        category = dc.BoardCategories.Where(bc\
    \ => bc.PageName ==\n                                      PageName).FirstOrDefault();\n\
    \    }\n    return category;\n}\n```"
