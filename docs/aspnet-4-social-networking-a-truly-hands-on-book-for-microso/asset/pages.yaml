- pgno: 171
  md: '# # 5

    ## Friends


    The subject of this chapter is the key to the success of any community. Your friend
    features will be the main reason for people to interact with your community. It
    is also the biggest drive for your users to advertise for you. "Hey Peter, come
    and check this out. I love it, so will you!" — a friend in a community site, like
    in life, is someone who you have something in common with, enjoy the company of,
    or turn to when you have something to discuss. A circle of friends can be thought
    of as a sub-community within a community.


    This chapter will show you how to take advantage of people''s nature to congregate
    around things that they enjoy, find useful, or that intrigue them. We will start
    this chapter by extending the framework to allow for relationships to be built
    between our users. We will then add some features that allow our users to locate
    all of their existing friends, as well as make new friends. Then we will have
    a discussion about providing real time status updates in the form of a micro blog
    so that all of our friends can stay in touch with everything we are doing.


    # ## Problem


    There are many aspects to building relationships in any community — real or virtual.
    First and foremost is initiating contact with the people whom you will eventually
    call your friends. The easiest way to locate someone who you might want to call
    a friend is to directly invite the people who you already know as a friend. We
    will do this in a few ways.'
  merge: -1
  img_proc: true
- pgno: 172
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 173
  md: '+   3. Third, we will create a form that allow you to import all of your contacts
    from the Outlook.


    ![](img/15a62e134135dde036b0ac3cbb01dab6_173_0.png)


    All of these methods of inviting a friend into the system would of course generate
    an email invite (and eventually a system-based message—see next chapter). The
    user will have the ability to then follow the link into the system and either
    sign up or log in to accept the request. Once the user has clicked on the link
    in their email, he/she will be taken to a page displaying the request.


    ![](img/15a62e134135dde036b0ac3cbb01dab6_173_1.png)'
  merge: -1
  img_proc: true
