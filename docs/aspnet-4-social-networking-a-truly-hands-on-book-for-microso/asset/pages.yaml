  md: "Finally, we have the **btnTag_Click()** method, which handles the passed through\
    \ click event and captures the TagName of a new tag entry. This TagName is passed\
    \ to the TagService.AddTag() method with the SystemObjectID and SystemObjectRecordID.\
    \ We then determine if we have a cloud as part of our Display options. If we do,\
    \ then we clear the cloud and rebuild it so that the new tag can be shown.\n\n\
    ```\n```csharp\n//Fisharoo/Web/UserControls/Presenters/TagsPresenter.cs\npublic\
    \ void DetermineClientState()\n{\n    if (_webContext.CurrentUser != null &&\n\
    \                         _view.Display == TagState.ShowCloud) {\n        _view.ShowTagCloud(true);\n\
    \        BuildTagCloud();\n    }\n    else if (_webContext.CurrentUser != null\
    \ &&\n                         _view.Display == TagState.ShowCloudAndTagBox)\n\
    \    {\n        _view.ShowTagBox(true);\n        _view.ShowTagCloud(true);\n \
    \       BuildTagCloud();\n    }\n    else if (_webContext.CurrentUser == null\
    \ &&\n                         _view.Display == TagState.ShowCloudAndTagBox)\n\
    \    {\n        _view.ShowTagBox(false);\n        _view.ShowTagCloud(true);\n\
    \        BuildTagCloud();\n    }\n    else if (_view.Display == TagState.ShowCloud)\
    \ {\n        _view.ShowTagBox(true);\n    }\n    else if (_view.Display == TagState.ShowParentCloud)\
    \ {\n        _view.ShowTagCloud(true);\n        _view.ShowTagBox(false);\n   \
    \     BuildParentTagCloud();\n    }\n    else if (_view.Display == TagState.ShowGlobalCloud)\
    \ {\n        _view.ShowTagCloud(true);\n        _view.ShowTagBox(false);\n   \
    \     BuildGlobalTagCloud();\n    }\n    else {\n        _view.ShowTagBox(false);\n\
    \        _view.ShowTagCloud(false);\n    }\n}\n\npublic void BuildGlobalTagCloud()\n\
    {\n```\n```"
