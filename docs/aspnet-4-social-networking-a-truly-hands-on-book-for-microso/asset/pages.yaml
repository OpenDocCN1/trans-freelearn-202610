- pgno: 434
  md: '# Scaling Up


    First we use MEF to plug ICache in our class using the Import attribute.


    In GetFoldersByAccountID() we check if the Folders exists in cache and if it exists
    it returns from the cache directly. If it doesn''t exist in the cache, we call
    the appropriate method in FolderRepository and make it a point to store the returned
    value in the Cache.


    In DeleteFolder() first we check if the Folder exists in the cache. If exists,
    we remove the folder from the cached object and then also delete it from backend
    using FolderRespository.DeleteFolder() method.


    You should also consider the ways in which to invalidate the cache data in case
    if the data gets stale. This can be done using Notification Services feature with
    AppFabric.


    Windows Server AppFabric provides failover solution for cache data which was not
    possible with State Server or SQL Server based OutProc caching solutions prior
    to AppFabric. It has lot more application in distributed caching and covers more
    varied kinds of caching needs. For more details on Windows Server AppFabric, check
    http://msdn.microsoft.com/en-us/windowsserver/ee695849.aspx.


    # Caching—MemCached solution


    The page at http://memcached.org/about explains that:


    > > memcached is a high-performance, distributed memory object caching system,
    generic in nature, but intended for use in speeding up dynamic web applications
    by alleviating database load.


    Simply put, the MemCached software allows you to create a farm within your web
    farm. This tool is used to create and manage a state farm. There aren''t any limitations
    as to how many servers you can have in this farm. There aren''t any hardware requirements
    for this tool either. This means that you can easily set up some very cheap Linux
    boxes with a load of RAM, and expand your state farm as your application(s) require.


    Did you say Linux? This is what we used to say too. No worries though. MemCached
    has been ported to the Windows platform, and is now offered as MemCached for Windows
    (http://code.google.com/p/memcached/wiki/PlatformWindows). The same rules apply
    to this product from the hardware perspective. The only reason we brought up the
    Linux option is that every instance of Windows that you set up will cost you an
    initial outlay of cash for both a new box and the OS. On the other hand, the Linux
    boxes could be a farm of deactivated desktops and a free copy of your favorite
    Linux distro. This cache implementation can do for you exactly the same thing
    as the one done by AppFabric caching solution. You can point your session wrapper
    (or Context in our case) to your memcache implementation.'
  merge: -1
  img_proc: true
- pgno: 435
  md: '# The server


    Get the windows version of MemCached from the URL given in the Caching section.
    You can download the assemblies or the source code. If you downloaded the source
    code, you need to build the solution. With the assemblies in hand, you can unzip/put
    them into a directory on your local drive. Once you have the assemblies installed,
    you can run these simple directions:


    +   1. Unzip the assemblies in your desired directory (eg. c:\memcached).

    +   2. Install the service using the command:

    +      c:\memcached\memcached.exe -d install

    +   3. Start the server from the Microsoft Management Console or by running the
    following command:

    +      c:\memcached\memcached.exe -d start

    +   4. Use the server, by default listening to port 11211.


    You can run several instances of this program on each server if you need to. Also,
    you can change the port that you run the server(s) on. You could run a different
    instance per application if you like.


    That''s it!


    # The client


    Once you have the server installed and running you will need a client. There are
    the currently a few C# clients available:


    +   - https://sourceforge.net/projects/memcached-dotnet/

    +   - http://code.google.com/p/beitmemcached/

    +   - http://memcached.enyim.com


    There is also a host of other clients for other languages too.


    http://memcached.org/


    In our implementation, we will use the Enyim Memcached client. We have used this
    client on several projects and have not seen it having any issues. This client
    comes in the form of a solution that you can get from codeplex.com. It has a test
    client, the actual code, and so on. We take the Enyim.Caching project from within
    the solution and plug it into my current project solution.


    With this in place you can then add a reference to Enyim.Caching from your project.'
  merge: -1
  img_proc: true
- pgno: 436
  md: "# Scaling Up\n\n# Using the client\n\nWith our new client in place we can then\
    \ create a new cache wrapper that inherits from the same interface as our current\
    \ cache wrapper.\n\nWe will call the new cache wrapper MemcachedCache. The big\
    \ difference here is that we have a different Pluggable attribute of MemCached.\n\
    \n```\n```csharp\n//Fisharoo/Components/MemecachedCache.cs\nusing System.ComponentModel.Composition;\n\
    using System.Web.Caching;\nusing Enyim.Caching;\nusing Enyim.Caching.Memcached;\n\
    \nnamespace Fisharoo.Components\n{\n    [Export(typeof(ICache))]\n    public class\
    \ MemcachedCache : ICache\n    {\n        private MemcachedClient cache;\n\n \
    \       public MemcachedCache()\n        {\n            cache = new MemcachedClient();\n\
    \n            List<string> keys = new List<string>();\n            cache.Store(StoreMode.Add,\
    \ \"keys\", keys);\n        }\n        public object Get(string cache_key)\n \
    \       {\n            return cache.Get(cache_key);\n        }\n        ............\n\
    \    }\n}\n```\n```\n\n# Caching in the Business logic layer\n\nWe can now wire\
