    \ all the data management tasks that surround the photo album concepts.\n\n# ##\
    \ MyPhotos\n\nIn this page we will display all the photo albums that an account\
    \ has. We will use a ListView to do this.\n\n```\n```aspx\n//Fisharoo/Web/Photos/MyPhotos.aspx\n\
