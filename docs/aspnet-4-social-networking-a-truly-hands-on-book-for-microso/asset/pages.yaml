- pgno: 417
  md: 'However, it is not as simple as just moving the specific assemblies to different
    machines. The calls from presentation to business are now going to be outside
    of the machine boundary as the respective code would exist on different physical
    machines. To resolve this, one of the things we can do is to enable **Service
    Oriented Architecture (SOA)** for this application. SOA is a very well known paradigm,
    and you can read it from http://en.wikipedia.org/wiki/Service-oriented_architecture.


    In the following sections we will show how we can modify the current implementation
    to make it SOA enabled.


    # # Presentation and application tier scaling


    Before we dig further into scaling, let''s do some architecture compliance validations.


    # ## Layered architecture validation


    Architecture validation is an important aspect that we should be able to perform
    during various phases of the project. This helps in ensuring the architecture
    rules defined as part of the process are adhered to consistently throughout the
    development phases and are not violated unknowingly. Rules, such as presentation
    layer code should not directly call data access layer code, are essential, but
    difficult to locate unless code is reviewed thoroughly.


    Visual Studio (VS) 2010''s Architecture Validation feature provides this facility
    out of box. You need to first create an architecture diagram in the designer and
    then attach different projects in the solution to different layers in the diagram.
    VS can then validate calls across different projects as per the architecture diagram
    and point out violations.


    Let''s add a new project to our existing solution called as ModelingProject and
