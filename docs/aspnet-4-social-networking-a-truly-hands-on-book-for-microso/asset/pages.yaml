  md: "# AccountService\n\nWe discussed this Service earlier so we will discuss only\
    \ the changes here.\n\n# SaveAccount ()\n\nThis method invokes the corresponding\
    \ repository's save method to save the account along with the updated score in\
    \ the database. It also handles the logic of incrementing the scores for the account\
    \ based on the ScoreInput variable. This score will be used to display medals\
    \ for the user.\n\nIf the post is a reply to an existing question, then the post\
    \ owner's account score is incremented by one. If the reply is voted as useful\
    \ then the post owner's score is incremented by five and if it is voted as not\
    \ useful the score is decremented by five. When decrementing we make sure that\
    \ we don't go below zero. If the reply is marked as an answer then the post owner's\
    \ account score is incremented by ten.\n\n```\npublic void SaveAccount(Account\
    \ account, BoardPost.ScoreInput value)\n{\n    if(account.AccountID > 0)\n   \
    \ {\n        switch (value)\n        {\n            case BoardPost.ScoreInput.ReplyPost:\n\
    \                account.Score += 1;\n                break;\n            case\
    \ BoardPost.ScoreInput.VoteUseful:\n                account.Score += 5;\n    \
