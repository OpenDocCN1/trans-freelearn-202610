  md: "As stated earlier we will be building a Flash-based file upload client. This\
    \ client will be responsible for selecting a group of files on the local file\
    \ system. It will then pass the files one at a time to our server side receiving\
    \ page. When we discuss photo files (JPG, GIF, and so on) we will also look at\
    \ some basic image processing concepts. We will also provide a Silverlight upload\
    \ control as an alternate option and will reuse the control already available\
    \ on codeplex (http://s1verlightfileupld.codeplex.com/) for this. There are other\
    \ options like AJAX-based controls as well, but we wanted to bring in a bit of\
    \ Rich Internet Application (RIA) flavor and hence the use of Flash and Silverlight.\n\
    \n# Multiple file upload\n\nOur file receiver will be able to receive multiple\
    \ files at any one time. In our case we will be primarily concerned with receiving\
    \ image files. But we will set it up to receive other files as well. The receiver\
    \ in our case (ReceiveFiles.aspx.cs) will be housed inside a webpage in our Files\
    \ directory. We will explain the code here, but will only show the relevant parts\
    \ here and not the entire code.\n\nThe beginning of our receiver will be responsible\
    \ for spinning up some variables and objects. The only interesting thing to note\
    \ here is the sizesToMake collection. This will hold all the sizes, which we will\
    \ generate further down the line. If we want to add an additional size or modify\
    \ one of our existing sizes we would do that here.\n\n```\nDictionary<string,int>\
    \ sizesToMake = new Dictionary<string,int>();\n```\n\nThen in the Page_Load()\
    \ method we have the initialization of our objects and our sizes collection. We\
    \ then interrogate a query string value to see what sort of file we are dealing\
    \ with. In our case we will be working with photos, but we might deal with something\
    \ else later.\n\n```\n```csharp\n//determine save-to folder\nswitch (_webContext.FileTypeID)\n\
    {\n    case 1:\n        saveToFolder = \"Photos/\";\n        break;\n    case\
    \ 2:\n        saveToFolder = \"Videos/\";\n        break;\n    case 3:\n     \
    \   saveToFolder = \"Audios/\";\n        break;\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 250
  md: "# Media Galleries\n\nOnce we have decided which folder we are working with,\
    \ we would then need to check to make sure that folder is actually on the file\
    \ system. If not, then we may want to create it.\n\n```\n```csharp\n//make sure\
    \ the directory is ready for use\nsaveToFolder += DateTime.Now.Year.ToString()\
    \ +\n                DateTime.Now.Month.ToString() + \"/\";\nif (!Directory.Exists(Server.MapPath(saveToFolder)))\n\
    \    Directory.CreateDirectory(Server.MapPath(saveToFolder));\n```\n```\n\nWe\
    \ then have a few other variables that we want to set up. We need to get the Account\
    \ that we are working with. We also need to receive the uploaded files. And finally,\
    \ we will need to obtain the full path to the folder that we are saving our files\
    \ to.\n\n```\n```csharp\nAccount account = _accountService.GetAccountByID(\n \
    \   _webContext.AccountID);\nHttpFileCollection uploadedFiles = Request.Files;\n\
    string Path = Server.MapPath(saveToFolder);\n```\n```\n\nNow that we have a collection\
    \ of uploaded files we need to work with each file one at a time. To do this we\
    \ will start a for loop. At the top of each iteration we will need to get a single\
    \ file that we want to process.\n\n```\n```csharp\nfor(int i = 0 ; i < uploadedFiles.Count\
    \ ; i++)\n{\n    HttpPostedFile F = uploadedFiles[i];\n}\n```\n```\n\nWe then\
    \ need to initialize some more variables to be set up where the files will be\
    \ stored and how we will do it. We will get the folder ID from the query string.\
    \ Notice that we are currently assuming that we are playing with image files with\
    \ a static fileType of 1. If we were to create another page to upload say audio\
    \ files, we would want to pass in the fileType. Next we attempt to get the uploadedFileName\
    \ by parsing the end of the file name of the uploaded file. Once we have the file\
    \ name we get the file extension. As we will be saving the files to the file system,\
    \ we run the risk of overwriting files if we do not ensure that the file has a\
    \ unique name. To do this, we create a new GUID string that will act as our file\
    \ system's file name. With all this data in place we then have enough to create\
    \ the final file name. We then create the domain object file.\n\n```\n```csharp\n\
    string folderID = _webContext.AlbumID.ToString();\nstring fileType = \"1\";\n\
    string uploadedFileName =\n    F.FileName.Substring(F.FileName.LastIndexOf(\"\\\
    \\\") + 1);\nstring extension =\n    uploadedFileName.Substring(uploadedFileName.LastIndexOf(\"\
    .\") + 1);\n```\n```"
