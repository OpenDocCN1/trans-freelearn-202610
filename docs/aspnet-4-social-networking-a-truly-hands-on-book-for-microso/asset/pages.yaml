- pgno: 72
  md: "# An Enterprise Approach to our Community Framework\n\nWe would need to create\
    \ the composition logic for composing every part we deal with. For example Log,\
    \ Cache, Email, Configuration, Redirector, etc. so instead of repeating the composition\
    \ logic all over the code, we will create a static class to have centralized logic\
    \ for composition.\n\n```\n```csharp\n//Fisharoo/Common/MEFManager.cs\nusing System;\n\
    using System.ComponentModel.Composition;\nusing System.ComponentModel.Composition.Hosting;\n\
    using System.IO;\n\nnamespace Fisharoo.Common\n{\n    public static class MEFManager\n\
    \    {\n        public static void Compose(object o)\n        {\n            var\
    \ container = new CompositionContainer(\n                new DirectoryCatalog(Path.Combine(\n\
    \                AppDomain.CurrentDomain.BaseDirectory, \"bin\")));\n\n      \
    \      var batch = new CompositionBatch();\n            batch.AddPart(o);\n  \
    \          container.Compose(batch);\n        }\n    }\n}\n```\n```\n\nTo read\
    \ the assembly from directory, **DirectoryCatalog()** method is used. Once the\
    \ assembly providing the implementation for **IRedirector** is found, it is picked\
    \ up by a program and composed in application using **container.ComposeParts()**.\n\
    \nWe invoke this composition logic from **Application_Start()** method.\n\n```\n\
    ```csharp\nvoid Application_Start(object sender, EventArgs e)\n{\n    // Code\
    \ that runs on application startup\n    MEFManager.Compose(this);\n    log.EnsureInitialized();\n\
    }\n```\n```"
