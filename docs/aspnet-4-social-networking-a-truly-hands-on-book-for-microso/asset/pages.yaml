- pgno: 85
  md: '# # Solution


    Now, let''s take a look at how we can go about implementing all the new features.


    # ## Implementing the database


    We will start by implementing our database, and we will work our way up from there.


    # ## The Accounts table


    The Accounts table will store all the base information for a user. Most of this
    is easy

    to figure out as they have indicative names (a sign of good design).


    ![](img/15a62e134135dde036b0ac3cbb01dab6_85_0.png)


    However, there are a few columns that may not be 100 percent clear at first glance.

    We will explain those here.


    | Column | Description |

    |---|---|

    | **EmailVerified** | This is a bit flag to let us know if a user''s email address
    has been verified or not. |

    | **CreateDate** | This is the date on which the record was created. It has a
    default value of GetDate(). |

    | **LastUpdateDate** | This is similar to the **CreateDate** with the exception
    that we should update it every time we update the record. This could be done with
    a trigger, or done programmatically. |

    | **AgreedToTermsDate** | This is used to track the date on which the user agreed
    to the terms and conditions. |


    # ## The Permissions table


    The Permissions table primarily acts as a lookup table for the various types of

    permissions. It holds the name of each permission with a unique ID.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# The AccountPermissions table


    The AccountPermissions table allows us to create a many-to-many type of relationship
    between our Permissions and our Accounts. It simply holds a reference to a record
    the end of the relationship.


    # The Terms table


    The Terms table is a lookup for our terms and conditions. Also, it provides us
    with a historical view of the terms our customers have agreed to in the past.


    # Creating the relationships


    First, while you could work in a database without any enforced relationships,
    we wouldn''t advise it. Secondly, if you don''t have all your database constraints
    clearly defined, you might find yourself working with corrupt data.


    For this set of tables we have relationships between the following tables:


    +   - Accounts and AccountPermissions

    +   - Permissions and AccountPermissions

    +   - Accounts and Terms


    # Implementing the data access layer


    Now that we have our database defined for all the features required by this chapter,
    let''s take a look at how we go about accessing that data! Keep in mind that this
    chapter will not have a step that we discussed in an earlier chapter, i.e. telling
    Entity Framework how to connect to our database so that it can generate Entity
    classes for us based on our table structure.


    # Update Model from Database


    In Chapter 2, we created EDMX and added Person table from Database. In this chapter,
    so far we have discussed various tables and relationships that we created in SQL
    Server. Now it''s time to get them reflected in our EDMX. This can be done by
    double clicking Fisharoo.EDMX (you need to first open the solution in Visual Studio
    2010) and it will open it in designer interface. Right click the designer interface
    and select Update Model from Database. In the wizard that comes up (as shown in
    the following screenshot) select the necessary tables that need to be added.'
  merge: -1
