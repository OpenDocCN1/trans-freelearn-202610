    # Database tier scaling


    Up to this point in the book, we have not spent too much time discussing the database
    level. We will try to maintain that theme here as well, this book being more about
    ASP.NET and C# than it is about SQL! That being said, there are some things that
    we can do at the database level that we just can''t do elsewhere.


    # Flagged for delete


    Flagging content to be deleted rather than actually deleting it is not only going
    to be faster from the user''s perspective but also from the database''s perspective.
    When you attempt to delete a record, the database must lock that table prior to
    performing the delete. Also, with each deletion an entry must be made to the transaction
    log. And when a record is finally deleted, the database maintains the log sequence
    number and doesn''t necessarily de-allocate the data pages for the deleted information.
    The bottom line is that a delete statement is one of the most expensive commands
    that can be executed.


    So, instead of deleting the record when the application says it needs an item
    deleted, we could set the FlaggedForDelete column to true. Then when our queries
    fetch data from this table, we could have a parameter in our WHERE clause checking
    that the data that we are selecting is not flagged for delete. We could then have
    an administrative process that runs however frequently best for the current load
    that selects all the active data out of our table into a temp table, drops the
    table with our flagged for delete data, and then renames our temp table to the
    original name. When the table is truncated, the data pages are re-allocated to
    the system for re-use.


    Keep in mind that there is no "undo" feature for this method. If you need your
    data to be persisted to the transaction logs for auditing purposes, this may not
    be the best method for you. Also, if you have any foreign key references to the
    table that you are truncating, you must drop those references prior to performing
    the truncate command. When you are through with your process, you will then have
    to recreate your keys.'
  merge: -1
  img_proc: true
- pgno: 451
  md: 'The **FlaggedForDelete** concept is not one we are going to spend too much
    time on. You simply need to add **FlaggedForDelete** columns to each of your tables
    with **false** as the default value. As we are using Entity framework, you would
    then need to update all the tables in your design surface. Then specify the default
    value of the **FlaggedForDelete** field as **false** in all your INSERT statements
    (you will need to set this value as objects come in to be inserted). With this
    in place, you would next need to update all your SELECT statements to check against
    the FlaggedForDelete field excluding items that are marked **true**. Don''t forget
    that when you are running joined queries check the FlaggedForDelete field on the
    linked tables as well.


    # Indexing


    Indexing is a way of optimizing your database in such a way that the data is organized
    for fast searches. Analyzing Query in Database Engine Tuning Advisor can help
    in creating indexes. Without an index, various functions such as WHERE, ORDER
    BY, GROUP BY, TOP, and DISTINCT will have to perform a full table scan, which
    will impact performance heavily. Without an index, when you are looking for a
    user''s profile where ProfileID = 89734, SQL Server will have to look at every
    row to find the data that it is looking for. With an index in place, SQL Server
    will keep a list of ProfileIDs in a specific order so that locating the one we
    are interested in will be easy.


    With an index in place, you will find that querying with a WHERE clause will be
    much faster. The downside to an index is that each time data is deleted from the
    index; the index must be rebuilt or recreated. The creation or rebuilding of an
    index can take time if the data set is large. This is a known downside and but
    it is generally accepted that having an index is better than not having one.


    There are several types of indexes that can be created on a table—unique, clustered,
    non-clustered, and so on. A **unique** index is one where the key of the index
    is unique across the entire table. Think of an auto-generated **int** value as
    a unique index. A **clustered** index keeps the sort of the table''s data the
    same as the sort of the index. This makes for a very fast index. There can be
    only one clustered index on a table, as the table can have only one physical sort
    order! And then there is the non-clustered index. This index type keeps the indexed
    keys sorted logically, but this does not impact the physical sort of the table''s
    data. An index can be made up of a single column such as the primary key of the
    **int** type. Or, you can create a composite key which is made of up to sixteen
    columns.'
  merge: -1
  img_proc: true
