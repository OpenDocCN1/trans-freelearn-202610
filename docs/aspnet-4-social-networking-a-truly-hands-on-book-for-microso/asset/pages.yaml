- pgno: 324
  md: '# Groups


    This method takes in the newly-created alert. It then gets a list of groupMembers
    for the specified group. With these items in hand, it iterates through each groupMember
    and adds their AccountID to the Alert and then sends the Alert.


    > This could potentially be a performance bottleneck. A better way to possibly
    do this is to create all the alerts first and then create a new SaveAlert() method
    that takes in a list of Alerts to do a bulk insert.


    # Redirector


    While the Redirector class is not that complex, it is very important as it abstracts
    our redirection logic out of the pages and puts it higher up into the business
    layer. This means that if things change in our page structure we have one place
    to go and make changes. There are of course times when we can''t fit redirection
    into the Redirector class—just be sure that you don''t put your redirection logic
    in a page out of sheer convenience! Look up the source code associated with this
    chapter to see the new methods added to this class.


    # WebContext


    Similar to the Redirector, the WebContext class is not all that complex. Its purpose
    is simple and the way it conforms to its purpose is equally simple. This class
    is responsible for acting as a gateway to all requests to the HttpContext class.
    This means that any time we are making a call to query string items, post form
    items, or anything directly represented by the HttpContext class such as application
    variables; we should be hitting this class rather than going to the source.


    There are two additions made to this class—we now have a NewGroup property and
    a GroupID property. You can look up the source code associated with this chapter
    to see these.


    # Implementing the presentation layer


    With all the backend out of the way, let''s get to building the front end. It
    is always difficult to decide where to begin when creating an application of this
    nature. Do you populate the database with some sample test data and build the
    display page first? Or do you start with the data creation pages first and then
    work on the display pages? This time we will work with the data creation pages
    first, and then work our way out to the display pages towards the end. With that
    in mind, let''s get started.'
  merge: -1
  img_proc: true
- pgno: 325
  md: "# ManageGroup\n\nWhile we could have created two pages to manage our group\
    \ data—one for new groups and the other to edit groups—we find it far easier to\
    \ create one page and one UI that allows us to both create and edit groups. This\
    \ particular page has a couple of interesting features in it that we are providing\
    \ a WYSIWYG editor as well as an image upload feature. These two topics are the\
    \ features that we will work with the most in this discussion.\n\nBefore we get\
    \ started, it is important to know that the page knows its different states by\
    \ the presence of two query string variables. The first variable is newgroup=1.\
    \ This obviously tells the page that we intend to create a new group. The second\
    \ variable is GroupID={number}, which allows us to populate the page with a specified\
    \ group's data.\n\n# WYSIWYG\n\nOur WYSIWYG editor of choice is Xinha (which we\
    \ have covered before in the previous chapters). To use this editor, all we have\
    \ to do is drop a textbox with the TextMode set to MultiLine. Then further down\
    \ the page, we have to pass the full control ID into the Xinha engine with the\
    \ following code:\n\n```\n//Fisharoo/Web/Groups/ManageGroup.aspx\n<script type=\"\
    text/javascript\">\n    xinha_editors[xinha_editors.length] = 'Content_txtDescription';\n\
    \    xinha_editors[xinha_editors.length] = 'Content_txtBody';\n</script>\n```\n\
    \nThis creates the full-featured WYSIWYG editor and you can configure more or\
    \ less options globally depending on what you need.\n\n# Image upload\n\nWhile\
    \ we covered the topic of file uploads in the chapter that covers files, folders,\
    \ image galleries, and the like we felt that we might want to recover some ground.\
    \ In that chapter, we had the FileUpload logic stored in a helper page called\
    \ ReceiveFiles.aspx. While this approach worked well when we had only one area\
    \ of the site that required uploads, it no longer works when we have two areas\
    \ of the site that require upload capabilities.\n\nFor that reason, we moved all\
    \ the upload logic into an UploadService. It is pretty much 100 percent duplicated\
    \ from that file (so we won't recover it here). Then in the ReceiveFiles page,\
    \ we removed all the old code and replaced it with a single call to the UploadService.UploadPhotos\
    \ method. Once this refactoring was completed, we were able to turn back to address\
    \ the fact that we wanted the users to be able to upload a photo as their group's\
    \ logo."
  merge: -1
  img_proc: true
