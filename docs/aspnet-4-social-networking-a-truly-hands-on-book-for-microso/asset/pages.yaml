- pgno: 411
  md: '# # Summary


    In this chapter we discussed how and why to implement some form of moderation.
    We looked at how our community provided content could be managed by the same community
    using a very simple flagging tool that is flexible enough to be added to any major
    entity on our site. We also looked at methods to deal with habitual rule breakers
    in the form of gagging them or suspending their content by adding privileges.
    Finally, we took a high-level look at how to implement a filtering system to filter
    out unwanted language/words from the site content.'
