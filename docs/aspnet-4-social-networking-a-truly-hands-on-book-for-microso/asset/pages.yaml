- pgno: 466
  md: '# Comparing ASP.NET MVP with ASP.NET MVC


    # Intercepting filter


    The intercepting filter pattern extends the concept of Front Controller by actually
    using an HTTP Module so that it can intercept the requests before and also after
    they are processed by the ASP.NET runtime engine.


    # ASP.NET MVC


    We looked at the various patterns and also briefly discussed the key issues that
    developers today are facing while building web applications using ASP.NET Web
    Forms techniques. It has been close to a decade and in a way we had to have some
    new model coming out soon. However let''s clarify that ASP.NET MVC is not a replacement
    to the ASP.NET Web Form style of programming. It does address some of the key
    concerns and should really be treated as a new programming paradigm in the ASP.NET
    world. In short it means that when you start to build a new web application, you
    have to pick between ASP.NET Web Form and ASP.NET MVC.


    But before we get into the choice, let''s quickly highlight the key aspects of
    ASP.NET MVC. **Model-View-Controller (MVC)** is an architectural pattern and has
    been around for many years now. The pattern as such is fairly easy to understand.
    The **model** represents the data of the application as per the need of the application
    domain. Many times it will also support capturing updates to the data and storing
    it back to the appropriate storage. The **view** is how this data is visualized
    on the user interface. The **controller** is the one that handles requests for
    resources/data, reaches out to the right model and then passes it in suitable
    format to the view for the final display to the user. You can read more on MVC
    pattern here: **http://en.wikipedia.org/wiki/Model-view-controller**.


    Microsoft has modified the way the incoming requests are processed and passed
    to the ASP.NET engine. The requests no longer are in the form of .aspx pages and
    instead are as more RESTful in nature and are action oriented. A handler intercepts
    these requests and passes them to the right action/method in the controller.


    ASP.NET MVC enforces following the SoC principle to the core. Since controller
    is pure logic, it is easy to instantiate it from within a testing framework and
    test the functionality without having the need to get the entire ASP.NET runtime
    engine to load. While you can''t still test how the final data has rendered, you
    can very well test the data that has to be rendered. This coupled with some manual
    UI validation can help in overall testing of the application. Unlike ASP.NET MVP,
    this pattern still relies on the full runtime engine, ASP.NET MVC was designed
    with testability in mind. It has abstract classes for intrinsic objects like HttpContext,
    HttpRequest, and HttpResponse, thus allowing easier testing.'
  merge: -1
  img_proc: true
- pgno: 467
  md: 'The view in the ASP.NET is built by MVC using standard HTML (done by using
    HTML helper methods). There are no ASP.NET server controls available and hence
    the developers end up writing most of the HTML themselves, but in turn this provides
    them complete control over the HTML and thus handle the accessibility requirements
    in a much better way. While the support in Visual Studio at this time is limited
    in terms of HTML controls for ASP.NET MVC, you need not write everything on your
    own as you get the option to use different view engines. There are third party
    controls available today that can be used with ASP.NET. You can pick from NVelocity,
    Brail, NHaml, Spark, etc. view engines to build your views.


    > For more details on ASP.NET MVC you can refer to the MSDN library here: http://msdn.microsoft.com/en-us/library/dd381412.aspx.


    Now let''s address the final question on selecting between MVP (essentially using
    ASP.NET Web Forms approach) and MVC.


    # Choosing between MVP and MVC


    Both MVP and MVC patterns are capable of generating enterprise class applications.
    While MVC is definitely a much better pattern, it is also true that as of today
    the productivity benefits that you get with the MVP approach is far superior.
    MVC pattern adds a significantly steep learning curve for the current web developers
    or even the new ones who are just starting.


    Given the expectation of rich user interface for a social networking site, using
    MVC also additionally means lot more work towards creating custom controls for
    almost every display requirement. MVP allows us to work with the large number
    of ASP.NET server controls.


    When starting on a new application you can argue more convincingly in favor of
    MVC. However in our case, since this is an update of the book and the associated
    source code is building on top of the previous edition, using MVC would have meant
    a significantly long cycle.


    There are no migration wizards available today that help in easily taking some
    MVP based code and converting it to MVC. Had we selected MVC, it would have meant
    a rewrite of the presentation layer and would have impacted the release timelines
    of this book.'
  merge: -1
  img_proc: true
- pgno: 468
  md: '# Summary


    We have discussed the various web presentation patterns available when working
    with ASP.NET Web Form application development. We also looked at what ASP.NET
    MVC has to offer and compared between the MVP pattern that we used in previous
    edition of this book and MVC. After multiple debates we eventually concluded that
    it is best to retain the MVP pattern for the presentation layer. In future if
    time permits, we will definitely look at an MVC based front end for our Fisharoo
    website.'
  merge: -1
