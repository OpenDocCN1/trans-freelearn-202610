  md: "# Friends\n\nThis method needs to know who (user account) is making the request\
    \ as well as to whom the request is made to made to? It then verifies that both\
    \ of the accounts are valid so that we can use them down the road and returns\
    \ **false** if either of them is invalid. We then check to see if the user that\
    \ is doing the viewing is the same user as is being viewed. If so we can safely\
    \ return **true**. Then comes the fun part—currently we are using the **GetFriendsByAccountID**\
    \ method found in the **FriendRepository**. We iterate through that list to see\
    \ if our friend is there in the list or not. If we locate it, we return **true**.\
    \ Otherwise the method has failed to locate a result and returns **false**.\n\n\
    > Keep in mind that this way of doing things could quickly become a major performance\
    \ issue. If someone had 500 friends this would not be acceptable. As our goal\
    \ is for people to have lots of friends, we generally would not want to follow\
    \ this way. Your best bet then is to create a LINQ query in the FriendsRepository\
    \ to handle this logic directly only by returning **true** or **false**. An alternative\
    \ will be to use caching.\n\nNow comes our **CreateFriendFromFriendInvitation**\
    \ method, which as the name suggests creates a friend from a friend invitation.\n\
    \n```\n```csharp\n//Fisharoo/BusinessLogic/FriendService.cs\npublic bool CreateFriendFromFriendInvitation(Guid\
    \ InvitationKey,\nAccount InvitationTo, bool ExistingMember)\n{\n    //update\
    \ friend invitation request\n    FriendInvitation friendInvitation = _friendInvitationRepository.GetFriendInvitationByGUID(InvitationKey);\n\
