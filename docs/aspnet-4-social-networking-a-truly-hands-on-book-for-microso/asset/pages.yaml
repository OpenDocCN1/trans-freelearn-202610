- pgno: 7
  md: '# Acknowledgement


    Effort of this kind needs help wishes and blessings from many, colleagues, co-workers,
    mentors, and personal friends. Though the book has been a result of work of last
    one year but over this period of life I have been blessed to have support from
    many in many forms without which I would not have reached thus far.


    I would like to profusely acknowledge my co-author Atul Gupta, who provided me
    an opportunity to work with him on this book. With each other''s help and encouragement,
    we kept sailing through the difficult times in this book.


    I would also like to also profusely thank my managers and mentors Naveen Kumar,
    and Prasad Joshi for their executive support and directions in shaping this book.
    They not only displayed faith in my abilities on every turn at Infosys which has
    kept me going but were kind enough to support my time and effort in writing this
    book.


    Andrew Siemer''s excellent work provided us nice foundation to take off. Reviewers
    did a stupendous job of keeping us sharp. This book wouldn''t have been possible
    without the help from some key people from publishing house Susmita Panda, Shubhanjan
    Chatterjee, and Pallavi Kachare who patiently answered our several queries in
    the journey of completing this book.


    Last but not least, significant credit goes to my beloved parents, younger brother
    Gaurav, wife Amruta, and two year old son, Aalhoad. I draw my daily source of
    energy and motivation to come to work with smile from Aalhoad, and love from Amruta;
    sustain it with extraordinary support from my extremely loving parents and brother.'
