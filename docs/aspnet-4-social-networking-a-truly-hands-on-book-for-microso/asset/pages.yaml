  md: "```\nelse\n    folder.FullPathToCoverImage = \"default.jpg\";\nif(account !=\
    \ null)\n    folder.Username = account.Username;\n}\nresult = folders.ToList();\n\
    }\nreturn result;\n}\n```\n\nThe next interesting method in this repository is\
    \ the GetFriendsFolders. This method introduces a new LINQ concept – Union. The\
    \ Union takes all the items from one collection and merges it with another collection\
    \ of items. The items that are the same in both the lists are merged so that the\
    \ resulting list of items is unique.\n\n```\n//Fisharoo/DataAccess/Repositories/FolderRepository.cs\n\
    public List<Folder> GetFriendsFolders(List<Friend> Friends)\n{\n    List<Folder>\
    \ result = new List<Folder>();\n    foreach (Friend friend in Friends)\n    {\n\
    \        if (result.Count < 50)\n        {\n            List<Folder> folders =\n\
    \                GetFoldersByAccountID(friend.MyFriendsAccountID);\n         \
    \   IEnumerable<Folder> result2 = result.\n                Union(folders);\n \
    \           result = result2.ToList();\n        }\n        else\n            break;\n\
    \    }\n    return result;\n}\n```\n\nIn our method we take in a list of our Friends.\
    \ We then iterate over this collection and with each pass we check to see if we\
    \ have less than 50 folders (we chose a random number of items to show on our\
    \ album homepage). If we have less than 50, then we get all the folders for the\
    \ current friend and merge it into our result list using the Union method. We\
    \ continue to do this until we are either out of Friends or have 50 folders to\
    \ show on the homepage."
