    \    pn1Result.Visible = false;\n    pn1Emails.Visible = true;\n    cb1Emails.DataSource\
    \ = Emails;\n    cb1Emails.DataBind();\n}\n```\n```\n\nThe user can go through\
    \ the list and select the ones that they want to invite into our system. Once\
    \ they are through selecting the emails that they want to invite, they can click\
    \ on the Invite button.\n\nWe then iterate through all the items in the checkbox\
