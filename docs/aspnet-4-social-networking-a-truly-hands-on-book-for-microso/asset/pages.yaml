  md: "# Selecting contacts\n\nOnce we have handled the upload process and parsed\
    \ out the emails, we then need to display all the emails to the user so that they\
    \ can select the ones they want to invite. This is another view/panel in the ASPX\
    \ page.\n\nWe essentially have a checkbox list in our panel. This checkbox list\
    \ is bound to the list of email addresses returned post-parsing in the presenter\
    \ class.\n\n```\n```csharp\n//Fisharoo/Web/Friends/OutlookCsvImporter.aspx.cs\n\
