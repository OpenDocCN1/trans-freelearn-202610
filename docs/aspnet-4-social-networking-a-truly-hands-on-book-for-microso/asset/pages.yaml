  md: "# # URL routing\n\nIn order to support our user-friendly URLs we will once\
    \ again use the URL routing feature. Our additional code will be inserted in the\
    \ RegisterRoute() method in Global.ascx.cs. There are four different URL patterns\
    \ that we will support for our forums. Let's quickly look at each pattern:\n\n\
    +   - An URL like **http://server/appname/forums/categoryname/forumname.aspx**\
    \ is used to access a particular forum within a particular category. This request\
    \ will be serviced by **ViewForum.aspx**.\n+   - A URL like **http://server/appname/forums/categoryname/forumname/postid**\
    \ is used to access a particular post/thread within a forum. This request will\
    \ be serviced by **ViewPost.aspx**.\n+   - A URL like **http://server/appname/forums/categoryname/forumname.aspx/new**\
    \ is used to create a new thread in a forum. This request will be serviced by\
    \ **Post.aspx**.\n+   - A URL like **http://server/appname/forums/categoryname/forumname.aspx/reply**\
    \ is used to create a new thread in a forum. This request will be serviced by\
    \ **Post.aspx**.\n\nYou can look at the code to see how these patterns are formed\
    \ and added to the route collection.\n\n# # ViewForum.aspx\n\nThe view forum page\
    \ is responsible for displaying a single forum and all of its threads as shown\
    \ in the second screenshot of this chapter.\n\nThe view forum page first extracts\
    \ the category name and the forum name from the routed data collection and passes\
    \ it to the presenter. The presenter returns the collection of all the threads\
    \ in the particular forum. With this collection in hand the view then populates\
    \ the display of the page. Upon each iteration of a forum the repTopics_ItemDataBound\
    \ method loads the NavigateUrl property of the linkViewTopic HyperLink control,\
    \ which is the fancy path to the particular post page. Part of this path is the\
    \ IsThread=1 variable. The reason for this is that this is a dual purpose page\
    \ for both creating a post and a thread.\n\n```\n```csharp\n//Fisharoo/Web/Forums/ViewForum.aspx.cs\n\
    public partial class Forum : System.Web.UI.Page, IViewForum\n{\n    private ViewForumPresenter\
    \ _presenter;\n\n    protected void Page_Load(object sender, EventArgs e)\n  \
    \  {\n```\n```"
