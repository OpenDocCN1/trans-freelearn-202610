- pgno: 398
  md: "# Moderations\n\nThe moderation table shown in the previous screenshot holds\
    \ the SystemObjectID and SystemObjectRecordID as well as the Account that created\
    \ the content in question. It also carries the Account that executed the resulting\
    \ action as well as what that action is.\n\nIn addition to tables, we are going\
    \ to need a way to quickly and easily obtain moderated files. We hate to say it,\
    \ but we are going to dip into the actual SQL for this one. We will create a stored\
    \ procedure that will take a FolderID and will return all the moderated files\
    \ in that folder.\n\n```\nCREATE PROCEDURE [dbo].[pr_GetModeratedFiles]\n@DefaultFolderID\
    \ bigint\nAS\nBEGIN\n    SELECT f.* FROM Files f WHERE f.DefaultFolderID = @DefaultFolderID\
    \ AND f.FileID\n    NOT IN (SELECT f.FileID FROM Files f, Moderations m\n    \
    \        WHERE\n            f.DefaultFolderID = @DefaultFolderID\n           \
    \ AND\n            m.SystemObjectID = 5\n            AND\n            m.systemobjectrecordid\
    \ = f.FileID\n            AND\n            m.IsApproved = 1\n    )\nEND\n```\n\
    \nWe can then work with this information inside and outside of our queries quickly\
    \ and easily.\n\n# Gags\n\nThe Gags table, as shown in the previous screenshot\
    \ is responsible for determining if a user is on house arrest with regards to\
    \ adding content to the community. It holds the gagged user's AccountID, their\
    \ AccountUsername, when the gag was applied, why it was applied, who applied it,\
    \ and when it is to be lifted."
  merge: -1
  img_proc: true
- pgno: 399
  md: '# # ContentFilters


    Though the content filter has a great deal of responsibility, it is a relatively
    simple system. All it keeps track of is which patterns to filter, what to replace
    each pattern with, who created each filter, and when. The strength of the system
    is more in the implementation than in the storage!


    # ## Creating the relationships


    Once all the tables are created, we can create all the relationships.


    For this set of tables we have relationships between the following tables:


    +   - Moderations and Accounts

    +   - Moderations and SystemObjects

    +   - Gags and Accounts

    +   - ContentFilters and Accounts


    # ## Setting up the data access layer


    To set up the data access layer, we follow the steps as already done in earlier
    chapters. Open the Fisharoo.edmx file and add all the above mentioned tables we
    have discussed in this chapter.


    # ## Building repositories


    With the addition of new tables will come the addition of new repositories so
    that we can get the data stored in those tables. We will create the following
    repositories to support our needs.


    +   - ModerationRepository

    +   - GagRepository

    +   - ContentFilterRepository


    Each of our repositories will generally have a method—for select by ID, select
    all by parent ID, save, and delete. Once you have seen one repository, you have
    pretty much seen them all. Review previous chapters, the appendices, or the included
    code for examples of a standard repository. However, we will discuss anything
    that varies from the standard.'
  merge: -1
  img_proc: true
- pgno: 400
  md: "# ModerationRepository\n\nFor this repository, we have a standard save method\
    \ that will take in one ModerationRepository at a time and deal with it appropriately.\
    \ It essentially creates entries as our users flag content. This is great for\
    \ one-at-a-time record creation for our community users.\n\n# GetModerationsGlobal()\n\
    \nOnce we have our Moderation records created, we need to be able to see the issues\
    \ so that we can accept some content and deny the others. To do this, we have\
    \ a method that gets all the moderations from a global point of view GetModerationsGlobal().\n\
    \n```\n///Fisharoo/DataAccess/Repositories/ModerationRepository.cs\npublic List<Moderation>\
    \ GetModerationsGlobal()\n{\n    List<Moderation> result = new List<Moderation>();\n\
    \    using(FisharooDataContext dc = conn.GetContext())\n    {\n        var groups\
    \ = (from m in dc.Moderations\n                      where m.IsDenied == null\
    \ || m.IsApproved == null\n                      group m by m.SystemObjectRecordID\n\
    \                      into g\n                      select new { g, NumberOfReports\
    \ = g.Count() }\n                      ).OrderByDescending\n                 \
    \     (g1 => g1.NumberOfReports);\n\n        foreach (var v in groups)\n     \
    \   {\n            result.Add(v.g.ToList()[0]);\n        }\n    }\n    return\
    \ result;\n}\n```\n\nThis method allows us to get all the moderations, grouped\
    \ by the SystemObjectRecordID as many people could report the same bit of content.\
    \ This reduced view is what we will see in our admin screens so that we can accept\
    \ and reject content in a more streamlined fashion. There is no need to view every\
    \ complaint!"
