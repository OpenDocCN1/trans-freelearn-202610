- pgno: 92
  md: "# User Accounts\n\nThe first thing you will notice here is the Export() attribute\
    \ of MEF as well as the IAccountRepository interface. As we may want to swap this\
    \ repository out during testing, these are important. Also, don't forget that\
    \ the use of MEF allows us to easily ensure that coupling is reduced once we start\
    \ using the Repository. This means that we could technically swap out the entire\
    \ repository without requiring a change to our code.\n\nThen in the constructor\
    \ we initialize the Connection object for use throughout the rest of the AccountRepository\
    \ class.\n\n# Selecting accounts\n\nOnce our Connection object is ready for use,\
    \ we can look at any of the methods from a generic point of view. Let's start\
    \ with the GetAccountByID() method.\n\nThis method is set up to retrieve an account\
    \ with an ID. We first start out by defining our return variable (account in this\
    \ case) outside the using statement. We then retrieve a FisharooDataContext inside\
    \ a using statement, that ensures that the DataContext is disposed of once we\
    \ have finished with it. We then move to the LINQ query itself inside the using\
    \ statement. This looks very much like a standard SQL SELECT statement with a\
    \ twist. We have to define the from statement first so that intellisense can interrogate\
    \ the collection we are working with. This allows us to work with our query as\
    \ though we were working with any other collection of objects using dot syntax.\
    \ We then define a where clause to restrict what is returned. Finally, we select\
    \ the object that we want to use.\n\nYou will then notice that the entire query\
    \ is wrapped in parenthesis. This allows us to chain methods on top of the result\
    \ set. In this case, we are calling the FirstOrDefault() function. This restricts\
    \ our dataset to the first record returned by the query or default value if no\
    \ element is found. As we know that there can only be one account associated with\
    \ an ID, this should be acceptable here!\n\n> We could use var as the query result\
    \ if we didn't know what type to expect back from our query.\n> \n> `var account\
    \ = [your LINQ query here];`\n> \n> var is called an anonymous type. It is used\
    \ heavily by LINQ. The caveat to using an anonymous type is that it can only be\
    \ used locally. So if your intent is to use the queried objects outside of the\
    \ scope from which they were retrieved, you will have to do some form of casting,\
    \ looping, or otherwise, to move them away from their anonymous status.\n\nThe\
    \ GetAccountByEmail() and GetAccountByUsername() methods are almost identical\
    \ in the way they function. So we are not going to explain them in detail."
  merge: -1
  img_proc: true
- pgno: 93
  md: '# Saving an account


    Now that we have a way to select Account objects out of the database in various
    ways, we now need to consider how we are going to get the data into the database.
    This brings us to our SaveAccount() method. We could have created two methods
    out of this one method – an Insert() and an Update() method. However, the only
    difference is in the one line of code between those two methods. So we chose to
    roll these two methods up and replace them with the SaveAccount() method.


    As you will see, with all our Repository methods, we have wrapped the acquisition
    of the FisharooDataContext in a using statement. This makes our clean up automatic!
    (Technically speaking, that is!). Once we have our DataContext to work with, we
    interrogate the object that was passed in to see if it already has an AccountID.
    If the object does have an AccountID, it can''t be new. If it doesn''t have an
    AccountID, it must be new.


    A new object is easy to work with. We simply call the dc.Accounts.AddObject()
    method and then we call dc.SaveChanges(). This tells the DataContext that it needs
    to persist all the changed data into the database – in our case it needs to save
    that new Account record.


    Our code makes updating data look almost as easy as inserting new data. However,
    while updating, we first create stand-in Account object by assigning the AccountId
    of the received Account and then Apply Values. This is achieved by telling the
    DataContext that the object that is being passed in is the modified version of
    the current original. In the end we still need to call dc.SaveChanges().


    # Deleting an account


    Now that we have a way to add accounts into the system it only makes sense that
    we would also want to know a way to delete an account, which is achieved with
    the DeleteAccount() method.


    We think deleting an object from the DataContext is one of the easiest things
    to do! Simply locate the collection that you want the object to delete from, pass
    the object to be deleted to the DeleteObject() method, and then call dc.SaveChanges().
    It doesn''t get any easier than that!


    # Adding permissions to an account


    Shouldn''t adding permission go in a Permission repository or something? No, not
    really. In reality, we are not really adding permission. We are creating a record
    in the non-entity table, AccountPermissions, to link a Permission to an Account.
    Recall that we had stated that we will not create non-entity repositories so that
    we can at least try and stick to DDD. So this leaves us to add permissions to
    accounts in the Permissions repository or in the Accounts repository. Adding permissions
    to the Accounts repository makes more sense to us!'
  merge: -1
  img_proc: true
- pgno: 94
  md: "# User Accounts\n\nThe code is also pretty simple as you can see in the AddPermission()\
    \ method (you will find that this is a recurring statement!).\n\n```\npublic void\
    \ AddPermission(Account account, Permission permission)\n{\n    using(FisharooDataContext\
    \ dc = conn.GetContext())\n    {\n        AccountPermission ap = new AccountPermission();\n\
    \        ap.AccountID = account.AccountID;\n        ap.PermissionID = permission.PermissionID;\n\
    \        dc.AccountPermissions.AddObject(ap);\n        dc.SaveChanges();\n   \
    \ }\n}\n```\n\nThis method is going to simply link an Account object to a Permission\
    \ object. To do this, it expects an Account and Permission object to be passed\
    \ in. It then creates a new AccountPermission object and assigns the AccountID\
    \ and PermissionID properties based on the objects that were passed in. This new\
    \ AccountPermission object is then inserted into the AccountPermissions collection\
    \ in the DataContext. Finally, the SaveChanges() method is called.\n\nIf you think\
    \ back to our DDD discussions (covered in the Appendices), Entity objects are\
    \ important enough to recreate and track with a unique ID. Value objects are less\
    \ important and can't (or shouldn't) exist without a parent Entity object. In\
    \ this case, the value object, AccountPermission, can exist with Permission or\
    \ an Account as its parent. While this is a true statement, the overall design\
    \ can be simplified by stating that Accounts can have AccountPermissions and that\
    \ Permissions can't. This makes keeping track of the objects easier when they\
    \ only have one entry point into the world.\n\nNow, having said that, we can think\
    \ of a scenario where we might need to be able to say: \"For this permission,\
    \ show me all the related accounts\". This might be useful in an Administration\
    \ console. We will see that when we get there. We could just as easily run a query\
    \ that says: \"Show me all the accounts with this permission\".\n\n# The other\
    \ repositories\n\nNow that we have had a fairly detailed look at the AccountRepository,\
    \ we are going to quickly cover the remaining repositories. We will discuss some\
    \ interesting points here and there, but for the most part, once you have seen\
    \ one repository, you have seen them all!"
  merge: -1
