    \ Places to consider wrapping with cache might be the database, file system access,\
    \ web service results, and so on.\n\nWhile implementing a caching layer, be cautious\
    \ to take into account what happens when new data is added and more importantly\
    \ when the data is deleted. If the data that is added is not in the cache, it\
    \ may or may not be important to update the cached item. However, leaving deleted\
    \ data in the cache is pretty much never a good idea! For that reason, we want\
    \ to add some code to our **delete** method that will remove a deleted folder\
