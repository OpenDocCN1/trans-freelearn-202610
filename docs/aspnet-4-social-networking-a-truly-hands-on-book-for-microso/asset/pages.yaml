- pgno: 4
  md: '# # About the Authors


    **Atul Gupta** is a Principal Technology Architect at Infosys Technologies Limited.
    He has more than 15 years of experience working on Microsoft Technologies. The
    technology experience is spread across VC++, MFC, COM/DCOM, SQL, .NET, Microsoft
    ASP.NET, Microsoft ASP.NET AJAX, Microsoft ASP.NET MVC, C#, ADO.NET, VS (various
    versions), BizTalk Server, Commerce Server and he has worked across all SDLC life
    cycle phases like architecture definition, design, development, and testing.


    His current focus is User Experience Technologies from Microsoft like Windows
    Presentation Foundation and Silverlight. He is also exploring Microsoft Surface,
    Windows Touch, Windows Phone 7, Pivot, and Augmented Reality. He blogs on latest
    technologies at: http://blogs-infosys.com/microsoft/. Some of his other publications
    can be accessed at Infosys'' Technology Showcase (http://www-infosys.com/microsoft/resource-center/Pages/technology-showcase.aspx).
    Working on latest technologies is his passion and this had helped him bag the
    Microsoft Most Valuable Professional (MVP) award for six consecutive years. He
    has also spoken on events like Microsoft Virtual Tech Days.


    Atul holds a Bachelor''s degree in Chemical Engineering and Master''s in Software
    Systems from Premier Universities in India.


    He recently helped review the book titled *Refactoring with Microsoft Visual Studio
    2010* from Packt Publishing.'
  merge: -1
  img_proc: true
- pgno: 5
  md: '# Acknowledgement


    I have had experience in writing short notes, blogs and even hand books, and always
    thought about writing a book. The credit to finally get me into this space clearly
    goes to Neha Patwari, the Development Editor at Packt who convinced me that I
    could write and introduced me to other fellow editors who reached out to me for
    this particular book.


    Next I would like to acknowledge Sudhanshu Hate, my co-author in this book, who
    kindly agreed to work on this book with me, inspite of his very busy schedule.
    We have had many an interesting debates when writing this book over a cup of hot
    tea in the afternoons.


    My co-workers and managers, with special mention of Naveen Kumar and Prasad Joshi,
    at Infosys were kind enough to support my time and effort in writing this book
    and always provided necessary guidance as and when required.


    I cannot thank my immediate team members enough for their support as well. They
    continued to drive their work even when I would disappear for days when working
    on various chapters in this book. Shashikant, Vidyadhar, Nimisha, Deepika, Ravi,
    Nachiket, and Vikas, I appreciate your support.


    Andrew Siemer, the author of the previous edition of this book, also needs a special
    mention. He has indeed done a wonderful work in writing the .NET 3.5 Social Networking
    book. We got lot of help from his work and the code snippets. I also would like
    to acknowledge the support and guidance from the editorial team at Packt and also
    the various technical reviewers. Their comments have helped bring out the finer
    shades in this book that will make it interesting to read.


    Finally, significant credit also goes to my wife, Shilpi and daughter, Anukriti,
    who waited patiently for me on numerous weekends to finish my work and spend time
    with them. Their understanding and patience helped me concentrate on the book
    and get it out quickly.'
  merge: -1
  img_proc: true
