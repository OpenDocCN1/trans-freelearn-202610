    \ + \"__s.\" + file.Extension))\n    System.IO.File.Delete(fullPath + file.FileSystemName\
    \ + \"__s.\" + file.Extension);\nif (System.IO.File.Exists(fullPath + file.FileSystemName\
    \ + \"__m.\" + file.Extension))\n    System.IO.File.Delete(fullPath + file.FileSystemName\
    \ + \"__m.\" + file.Extension);\nif (System.IO.File.Exists(fullPath + file.FileSystemName\
    \ + \"__l.\" + file.Extension))\n    System.IO.File.Delete(fullPath + file.FileSystemName\
    \ + \"__l.\" + file.Extension);\n\nif (Directory.GetFiles(fullPath).Count() ==\
    \ 0)\n    Directory.Delete(fullPath);\n}\n}\n```\n```\n\nThis method starts off\
    \ first by attempting to identify the **FileType** that we are dealing with, which\
    \ gets us the root folder for that type of file.\n\nKeep in mind that if you want\
    \ to store files at multiple locations and use the **FileSystemFolders**, then\
    \ this will need to be tweaked a bit. The concept shown here is for a single root\
    \ file folder!\n\n> > Another point worth noting is that the file deletion may\
    \ run into issues if the file is locked. If you run into issues, you can possibly\
    \ create an entry into a separate table and have a job running that regularly\
    \ scans the table and deletes the files.\n\nWith the root path identified we then\
    \ create the **fullPath**. This variable is created by making a call into our\
    \ WebContext class, that determines the root path on the server. We then add **Files**,\
    \ which is the files' root folder. Then comes the path that we just configured.\
    \ The next portion may seem odd at the moment. When we upload files (coming later)\
    \ we upload to a directory with the name of the folder's creation date, year,\
    \ and month.\n\nWith the **fullPath** configured appropriately we then check to\
    \ make sure that the directory actually exists. Now we can step through each file\
    \ that we created. We check to see if the file exists at the specified location\
    \ and then call System.IO.File-Delete. We do this for each type of file we create\
    \ in our upload process. Keep in mind that the upload and delete processes are\
    \ fairly tied at the hip. So if we change something on one end we need to make\
    \ the changes at the other end too!"
