- pgno: 209
  md: '# Messaging


    Given that our site''s focus is to gather people together so that they can interact
    with each other, we need a way for them to interact. The primary way for people
    to interact with one another is through direct communication. We will build a
    system to perform this communication in a way that is similar to sending an email
    from a standard email client such as Outlook or Hotmail.


    We will provide a way for our users to create and send messages via the Xinha
    WYSIWYG editor.


    ![](img/15a62e134135dde036b0ac3cbb01dab6_209_0.png)


    Once a user can create and send messages, we will then create a way for other
    users to receive and read those messages. The emails will queue up in their inbox,
    and from there they will be able to read their messages.


    Once we have this messaging subsystem in place we can hook up our other features
    in a way that they too can send messages — such as when a user accepts a friend
    request we can show the acceptance of that request in the friend''s Inbox.'
  merge: -1
  img_proc: true
- pgno: 210
  md: '# Messaging


    # # Problem


    A basic messaging system should be able to manage messages, senders and recipients,
    folders that contain the messages, and email notifications. In our case, we are
    going to try and keep things simple where it makes sense to do so, but in one
    area, we will do things in a more complicated way simply because it will result
    in less wear and tear on the overall system. This is how the messages will be
    delivered to the users.


    Rather than following a standard email messaging system where each person gets
    a physical copy of a message, we are going to build our system in the same way
    that the MS Exchange server works. We are going to make one copy of a message
    and subscribe users to that message. So rather than have 50 messages for 50 recipients,
    we will have one message and 50 recipient subscriptions.


    The next problem lies in building a WYSIWYG (what you see is what you get) messaging
    editor. For this feature, there are many open source WYSIWYG editors; we will
    use one of those to save us a bit of time. We will be using one of the popular
    editors—XINHA. This editor can be downloaded for free here at **http://xinha-webactional.com/**.
    You may have seen this editor already as it is widely used across many popular
    community sites.


    # # Design


    Let''s take a look at the design of these features.


    # # Messages


    Messages are the core of any messaging system. Generally, a message would contain
    details like the sender of the message, receiver of the message, and other metadata
    like time sent, server from where it was sent, etc. and the message, subject,
    and body. In our case, the message will contain the sender, subject, body, and
    the data sent. It will also contain one additional field, i.e. the type of message
    (message, friend request, and so on).


    We will need to create a page that allows a user to compose a new message (as
    seen in the image at the start of this chapter). This interface should also allow
    a user to add his/her friends easily rather than force them to remember everyone.
    Also, this interface should allow a user to quickly snap together some HTML without
    ever having to look at HTML. This can be accomplished with a WYSIWYG editor.'
  merge: -1
  img_proc: true
- pgno: 211
