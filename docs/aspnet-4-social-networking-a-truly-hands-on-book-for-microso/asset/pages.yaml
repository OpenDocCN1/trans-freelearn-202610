  md: "# SiteMap\n\nThe primary .NET widget that we will use to lock down our site\
    \ is the ASP.NET sitemap. This is a wonderful tool that can be used not only for\
    \ security but also to display breadcrumb trails, your primary navigation, and\
    \ many other useful page/file-oriented tasks.\n\nA sitemap file is made up of\
    \ several siteMapNodes. Each node contains things such as URL, title, description,\
    \ and roles by default. You can also add your own custom attributes. In our site\
    \ we will use attributes for identifying links that belong in the topnav, the\
    \ footer nav, as well as allowing the siteMap to help us with each page's title.\
    \ Our current siteMap looks like this:\n\n```\n```xml\n//Fisharoo/Web/Web.Sitemap\n\
    <?xml version=\"1.0\" encoding=\"utf-8\" ?>\n<siteMap xmlns=\"http://schemas.microsoft.com/AspNet/\n\
    \                 SiteMap-File-1.0\" >\n    <siteMapNode url=\"default.aspx\"\
    \ title=\"Home\" description=\"Home\n                         page\" pageTitle=\"\
    Welcome to Fisharoo.com!\"\n                 roles=\"PUBLIC\">\n\n    <!-- TOP\
    \ NAV NODES -->\n        <siteMapNode url=\"/account/default.aspx\" title=\"My\
    \ Account\"\n                     description=\"\" pageTitle=\"\" roles=\"PUBLIC\"\
    >\n            <siteMapNode url=\"/account/EditAccount.aspx\" title=\"Edit\n \
    \                        Account\" description=\"\" pageTitle=\"\" roles=\"PUBLIC\"\
    \ />\n            <siteMapNode url=\"/account/Login.aspx\" title=\"Login\"\n \
    \                        description=\"\" pageTitle=\"\" roles=\"PUBLIC\" />\n\
    \            <siteMapNode url=\"/account/RecoverPassword.aspx\"\n            \
    \             title=\"Recover Password\" description=\"Recover Your\n        \
    \                 Password\" pageTitle=\"Recover your password\"\n           \
    \              roles=\"PUBLIC\" />\n            <siteMapNode url=\"/account/Register.aspx\"\
    \ title=\"Register\"\n                         description=\"\" pageTitle=\"\"\
    \ roles=\"PUBLIC\" />\n            <siteMapNode url=\"/account/VerifyEmail.aspx\"\
    \ title=\"Verify\n                         Email\" description=\"Verify your email\
    \ address\"\n                         pageTitle=\"Email Verification\" roles=\"\
    PUBLIC\" />\n            <siteMapNode url=\"/account/AccessDenied.aspx\" title=\"\
    Access\n                         Denied\" description=\"Access Denied\"\n    \
    \                     pageTitle=\"Access Denied\" roles=\"PUBLIC\" />\n      \
    \  </siteMapNode>\n        <siteMapNode url=\"/profile/default.aspx\" title=\"\
    Profile\"\n                     description=\"\" topnav=\"1\" pageTitle=\"\"\n\
    \                     roles=\"PUBLIC\"></siteMapNode>\n        <siteMapNode url=\"\
    /friends/default.aspx\" title=\"Friends\"\n                     description=\"\
    \" topnav=\"1\" pageTitle=\"\"\n                     roles=\"PUBLIC\"></siteMapNode>\n\
    \        <siteMapNode url=\"/mail/default.aspx\" title=\"Mail\"\n```\n```"
