- pgno: 306
  md: '# Forums


    If we are working with a post instead of a thread, then we get the post that we
    are replying to. With this in mind, we check to see if it is a thread or is just
    a simple post as well. If it is a thread then we set our new post''s ThreadID
    property to that post''s PostID. Otherwise we set our post''s ThreadID to that
    post''s ThreadID. We also set the ForumID from the postToReplyToo''s ForumID property.


    With these determinations made and initial values set, we can then continue setting
    additional properties such as the create date, update date, accountID, and so
    on. We finally save the post and get the newly-created post''s PostID.


    With the post created, we then need to determine what type of alert to send out
    to our friends. If it is a thread then we send out a new thread alert. Otherwise
    we send out a new post alert.


    Finally we create the user-friendly URL that will redirect the user to see their
    new post.


    # # Summary


    In this chapter we created the core features for managing forums—categories, forums,
    threads, and posts. Along with these features we have also heavily implemented
    friendly URLs to help our content be more SEO-friendly. This should feed the various
    search engine spiders effectively. In order to spread the word about our new content
    we have also integrated our forum section into our alert service. This takes each
    new post and broadcasts its arrival to homepages of friends of each of the posting
    users''.


    As discussed earlier, the subject of forums is a large one. While we implemented
    a great foundation this section is by no means feature complete. If you look at
    the many options for forums and message boards in the market you will quickly
    notice that there are many other features that you could implement on top of what
    we built. Voting and medals are two important features that make forums a lot
    richer. We will look at extending our implementation in a later chapter to support
    these. This is a great start though!'
  merge: -1
  img_proc: true
- pgno: 307
  md: '# # 10 Groups


    What are Groups? In the social network context, **Groups** allow users of your
    community to interact with each other around a common topic. Groups start bringing
    together our other, already created concepts. Items such as forums, blogs, images,
    and many other features can be better utilized from the group point of view.


    Take forums for example. As a user of our community you can interact with the
    pre-created forums and you are able to post topics or replies to any public forum
    in the system. You hope that other users who have similar interests as you, or
    those who have an answer for your posted question, will stumble upon your post.
    Many people will see your post, some will reply. There is no guarantee that the
    right person will see it and even less guarantee that the right person will give
    you the response that you are seeking. If you are able to post your topic to a
    forum that is somewhat related to your interest, then your chances go up a bit.


    On the other hand, with a group-owned forum you know that there is a specific
    community, within the global community, paying extra close attention to your forum
    posts. In addition to that, when you post to a group-owned forum, you know that
    the entire user base of that group will be made aware of your post (typically
    via appropriate notifications). This increases your odds of getting to the information
    that you are seeking. And you know that the majority of people looking at your
    post most likely have the information you are interested in.'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# Groups


    Think of groups as sub-communities with special interests. Because they are sub-communities,
    they have the same life as a user in the system with the exception that they act
    on behalf of many users. By becoming part of a group you have taken on many new
    friends with common interests. You gain access to special interest forums and
    you could get to see the hidden image galleries!


    Here is an example of what we will be building:


    ![](img/15a62e134135dde036b0ac3cbb01dab6_308_0.png)


    # # Problem


    Given that there are so many features in our example site it is impossible for
    us to integrate them all with our group feature. However, when you read through
    this chapter, keep in mind that just about anything that applies to a person in
    our community can be morphed to apply to a group of people. In this chapter, we
    will focus on creating the core framework for a group.


    The framework we are building will allow us to create a group that will have both
    public and private presence in our site. A group will also be able to have a dedicated
    group page.


    Here is the interface that will be built for group creation:'
  merge: -1
  img_proc: true
- pgno: 309
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 310
  md: '# Groups


    In addition to membership of a group, we will provide a way to have some of those
    members be considered owners or administrators of a group.


    Once the foundation is in place, we will start to connect to some of our other
    features. We will allow each group to have its own forum. This forum will have
    some differences in that when a user posts to the forum, the forum will not send
    alerts to their friends, but instead will send alerts to all the members of that
    group.


    Down the road, we could also extend the group feature to have its own filter to
    catch user alerts to an account in a similar manner. We could also have related
    blog posts show up on the homepage of the group. We could also show the latest
    forum posts on the group''s homepage. We could show the latest uploaded images.
    And many other things could be done off the group foundation.


    # Design


    Let''s take a look at the design for this feature.


    # Groups


    In the same way that the Accounts table is the core hub for many items in our
    system, the Groups table could be built out to be an additional hub. For that
    reason, we will address the creation of this feature first. The table structure
    for a group is not overly complex.


    You are probably getting used to seeing the counts bubbled up at the parent level.
    We will explain again that we are doing this to remove the need to run aggregate
    queries. Instead, when we load the object we will automatically have the count
    in hand already.


    Something else that you are probably used to seeing is the concept of a page name.
    As the group page will become a major center of information, we want to make sure
    that as far as Google or other search engine spiders are concerned, this is a
    true page rather than some server-generated page. We do this in the hope of getting
    those cherished SEO points. Also it is much easier for the user to know where
    they are and it allows our user to send a human readable URL to their friends,
    which promotes sharing!


    The last thing of importance to note is the IsPublic flag that we have in our
    group entry. This will be the key to tell us whether or not anyone can gain access
    to this group or only group members. We will touch upon this requirement a bit
    more later.'
  merge: -1
  img_proc: true
- pgno: 311
  md: '# # GroupMembers


    Generally in a group there is more than one user who will help operate the group.
    We will therefore have an AccountID in the group, which will help us identify
    the owner of the group. But we will also need a method to track all the members
    of the group as well as the members who are also administrators.


    You can see from the structure in the screenshot that we are going to track the
    GroupID and the AccountID to create the relationship between Groups and Accounts.
    In addition to that information, we are also going to keep track of when the member
    requested the membership, whether they are approved or not (IsApproved) and whether
    the account is also an administrator (IsAdmin). This gives us everything we need
    to create the members for our groups.


    # # GroupTypes


    We will eventually have many different groups in our system. As an added feature
    we want an easy way for our users to locate groups that they may have some interest
    in. In order to provide this functionality, we will have a system to track what
    type a group is. Down the road we could use this system for searching groups or
    grouping them. This system will also allow us to make the statement: "If you like
    this group you might also be interested in these related groups".


    As you can see from the relationships in the screenshot, groups can be associated
    with many group types (and vice versa). The structure itself is very straightforward.


    # # GroupForums


    As we have covered earlier, when a user creates a group they also get a group-owned
    forum. In order to accomplish this, we have to create a link between the group
    and a new forum.


    This is a simple many-to-many relationship that allows us to technically have
    many forums and many groups related to one another. We don''t like to introduce
    limitations by design though. So just in case we need to have multiple forums
    for a group or one group with many forums, we can.


    # # Solution


    Now let''s take a look at our solution.'
  merge: -1
  img_proc: true
- pgno: 312
  md: '# Implementing the database


    Let''s take a look at what we need to implement the database. The following screenshot
    shows the relevant tables.


    ![](img/15a62e134135dde036b0ac3cbb01dab6_312_0.png)


    # Groups


    Refer to the Groups table structure in the previous screenshot. The majority of
    this table is self-explanatory. However, one thing to be very aware of is the
    **Body** field, which is **varchar(MAX)** here. This means that people could technically
    put any amount of text that they want here. If this is not the functionality that
    you want to provide, either make this field smaller or put some form of client-side
    validation on this field to restrict its size.'
  merge: -1
  img_proc: true
- pgno: 313
  md: 'You may also be wondering why we have a large **Description** field and an
    even larger **Body** field. The primary reason for this is so that we have public
    and private fields of text. A description could simply be the first paragraph
    of the groups'' page text, or it could be a brief synopsis. This totally depends
    on how you structure your output. We have set it up so that the description and
    body show up together, with the description on top.


    Another item worth noting is that we are tracking a **FileID** with each group.
    This reference will allow us to upload a photo to the system to be used as the
    group''s avatar or logo.


    # GroupMembers


    The GroupMembers table allows us to define who can be our group members. In addition
    to defining membership, this table will allow us to accept or reject members.
    Once we have members, we can also use this structure to define additional administrators
    in the group.


    # GroupTypes


    This table allows us to define the different group types that we want provided
    by our system. If you wanted to allow your users to provide their own group type,
    you could add an additional field to define whether it should be system-defined
    or user-defined. We would probably call this flag IsSystemType. This will help
    us to define our initial library.


    Once we have the GroupTypes table created, we can then turn our attention to capturing
    relationships between groups and their type(s). Keep in mind that the users will
    be able to associate their groups with more than one type, if appropriate.


    This is a simple many-to-many relationship definition table that tracks both the
    **GroupID** and **GroupTypeID**.


    # GroupForums


    This table, like many of the others described earlier, is simply a many-to-many
    relationship table. This table allows each of our groups to also have a forum.
    We do this by tracking the **GroupID** and the **ForumID**.'
  merge: -1
  img_proc: true
