  md: "# Medals.ascx\n\nThe UI has five images that are used to display the medals\
    \ that the user has earned.\n\n```\n```aspx\n//Fisharoo/Web/UserControls/Medals.ascx\n\
    <%@ Control Language=\"C#\" AutoEventWireup=\"true\" CodeBehind=\"Medals.ascx.cs\"\
    \ Inherits=\"Fisharoo.Web.UserControls.Medals\" %>\n<!-- keeping one visible to\
    \ help with UI layout. Actual visibility is controlled from code behind -->\n\
    <asp:Image ID=\"medal1\" runat=\"server\" ImageUrl=\"~/Images/medal.png\" />\n\
    <asp:Image Visible=\"false\" ID=\"medal2\" runat=\"server\" ImageUrl=\"~/Images/medal.png\"\
    \ />\n<asp:Image Visible=\"false\" ID=\"medal3\" runat=\"server\" ImageUrl=\"\
    ~/Images/medal.png\" />\n<asp:Image Visible=\"false\" ID=\"medal4\" runat=\"server\"\
    \ ImageUrl=\"~/Images/medal.png\" />\n<asp:Image Visible=\"false\" ID=\"medal5\"\
    \ runat=\"server\" ImageUrl=\"~/Images/medal.png\" />\n```\n```\n\n# Medals.ascx.cs\n\
    \nThere is only one property of relevance here and that is the Score, which is\
    \ used to decide how many medals to display on the UI.\n\n```\n```csharp\n//Fisharoo/Web/UserControls/Medals.ascx.cs\n\
    public int Score\n{\n    get {\n        if (ViewState[\"MedalScore\"] != null)\n\
    \            return Convert.ToInt32(ViewState[\"MedalScore\"]);\n        else\n\
    \            return 1; }\n    set {\n        ViewState[\"MedalScore\"] = value;\n\
    \        /* We have picked some range to display medals. These are\n         \
    \  easily customizable based on specific needs\n         * 0 - 5 = no medal\n\
    \         * 6 - 20 = 1 medal\n         * 21 - 100 = 2 medals\n         * 101 -\
    \ 500 = 3 medals\n         * 501 - 2000 = 4 medals\n         * > 2001 = 5 medals\n\
    \         */\n        medal1.Visible = (value > 5) ? true : false;\n        medal2.Visible\
    \ = (value > 20) ? true : false;\n        medal3.Visible = (value > 200) ? true\
    \ : false;\n        medal4.Visible = (value > 500) ? true : false;\n        medal5.Visible\
    \ = (value >2000) ? true : false;\n    }\n}\n```\n```"
