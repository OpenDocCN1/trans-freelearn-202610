    SiteButton\" ID=\"btnTag\" runat=\"server\"\n                        Text=\"Tag\
    \ It!\" OnClick=\"btnTag_Click\" />\n        </asp:Panel>\n        <asp:Panel\
    \ runat=\"server\" ID=\"pnlTagCloud\" Visible=\"false\">\n            <asp:PlaceHolder\
    \ ID=\"phTagCloud\" runat=\"server\" />\n        </asp:Panel>\n    </ContentTemplate>\n\
    </asp:UpdatePanel>\n```\n```\n\n# ## Tags.ascx.cs\n\nIn this file we have defined\
    \ both a class and an enum. The enum of TagState is defined to modify the various\
    \ states of the tag control. We have the following entries defined:\n\n+   - **ShowCloud:**\
    \ This option shows only the cloud for the object that the control is configured\
    \ for.\n+   - **ShowTagBox:** This option shows the text box to collect tags.\
    \ It does not show any cloud.\n+   - **ShowCloudAndTagBox:** This option shows\
    \ both the cloud and the text box.\n+   - **ShowParentCloud:** This option shows\
    \ the cloud for a parent. This option can be used to show all the tags for something\
    \ like a photo album.\n+   - **ShowGlobalCloud:** This option shows all the tags\
    \ from the site's point of view.\n\nThe Tags class implements a Display property,\
    \ which is of type TagState (our previously mentioned enum). In the Page_Load()\
    \ method, we initialize our TagsPresenter and in doing so set the state of the\
    \ control and load the tags that were already collected."
