  md: '# User Accounts


    At this time VS 2010 will update Fisharoo.Designer.cs and generate Entity classes
    corresponding to all the tables selected. You won''t see these classes as files
    in your project, but we can see them in the class viewer. Open your class viewer
    by going into the **View** menu and selecting **Class View**. Then expand the
    **DataAccess** project.


    ![](img/15a62e134135dde036b0ac3cbb01dab6_88_0.png)


    To start with you should see a class for each table you put on the Fisharoo.EDMX
    design surface. These are partial classes that you can extend by making an additional
    partial class of the same name in the same namespace (we will do this in a while).
    Do not edit the generated classes directly as your additions will get lost the
    next time you generate them!


    The only other item here that you should see other than the classes that represent
    your tables is FisharooDataContext. This class handles all the LINQ facilities
    for your tables and classes. It tracks what changes you have made to your objects,
    what objects can be worked with, how you can query those objects, and so on. Any
    time we work with our LINQ classes or data, we will be going through the FisharooDataContext
    class.'
