  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 27
  md: '*Chapter 13, Scaling* discusses some concepts to help you support a large number
    of users on your social network. It starts by looking at some key concepts of
    tiered architecture and web farming. It also discusses ways to create and search
    indexed data, methods to optimize data retrieval and content creation, and some
    mail queuing concepts.


    *Appendix* covers a discussion on the Microsoft ASP.NET MVP and MVC patterns and
    explains why we continued to use the MVP pattern for this book.


    # What you need for this book


    This book describes how to build a Social Network using Microsoft ASP.NET 4, Microsoft
    C# 4, and Microsoft SQL Server 2008. To use this book effectively, you will need
    access to Microsoft Visual Studio 2010 and Microsoft SQL Server 2008. Most of
    this book can be used with the various Express editions of Microsoft Visual Studio
    2010 and SQL Express, but you will find that having the Professional edition of
    Microsoft Visual Studio 2010 will make your work flow more efficient. As we are
    not just discussing Microsoft ASP.NET, but are instead more interested in what
    is needed for the features of social networking, there may be times when we turn
    to an open source solution. All the examples in this book will clearly point out
    where to get the needed software, and how to configure that software as we work
    through our examples.


    # Who is this book for


    This book is written for Microsoft ASP.NET and C# developers who want to build
    an enterprise-grade Social Network, either for their own business purposes or
    as a contract job for another company. The book assumes you have a prior experience
    of developing web applications using Microsoft ASP.NET 4, Microsoft C# 4, Microsoft
    SQL Server 2008, and Microsoft Visual Studio 2010; it focuses on topics that will
    be of interest to existing developers—not on providing step-by-step examples for
    each detail.


    # Conventions


    In this book, you will find a number of styles of text that distinguish between
    different kinds of information. Here are some examples of these styles, and an
    explanation of their meaning.


    Code words in text are shown as follows: "Create a new class in the `Fisheroo/BusinessLogic`
    directory called `ProfileService`."'
