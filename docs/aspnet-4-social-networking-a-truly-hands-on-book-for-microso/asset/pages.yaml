    \ result = true;\n    }\n    return result;\n}\n```\n```\n\nIn this method we\
    \ attempt to load a post by the PageName that was specified. If we return a null\
    \ object then we know that the PageName is unique and we can return a true response.\
    \ Otherwise we have to return a false result. Not fancy, but it gets the job done.\n\
    \nThe next method is responsible for getting all the posts for a given thread.\
    \ This by itself is not that interesting. But as we know that we are only using\
    \ this method on the page where a thread is viewed, we can insert some logic to\
