- pgno: 9
  md: '# About the Reviewers


    **Robert S. Robbins** is a freelance web developer with 11 years of experience
    in software development. He has an Associate''s Degree in Computer Science.


    Currently, he is a programmer for a community action agency which still maintains
    programs written in the old IBM mainframe language RPG II. But in his spare time
    he continues web application development in Microsoft ASP.NET and PHP. Robert''s
    involvement in social networking began with the YouTube community which eventually
    led to customizing the Ning platform for a group of vloggers. He now creates plugins
    for the Elgg open source social networking web application.


    He blogs at http://www.williamsportwebdeveloper.com/cgi/wp/index.php and could
    be reached at robert@williamsportwebdeveloper.com. You can also follow him on
    twitter http://twitter.com/#!/Robert_Robbins.


    **Sergey Suchok** graduated in 2004 with honors from the Faculty of Cybernetics,
    Taras Shevchenko National University of Kyiv (Ukraine) and has since then been
    keen on information technology. He is currently working in the banking area. Sergey
    is the co-author of more than 45 articles and participated in more than 20 scientific
    and practical conferences devoted to the economic and mathematical modeling. He
    is a member of the ''New Atlantis'' Youth Public Organization (newatlantida.org.ua)
    and devotes his leisure time to environmental protection issues, historical and
    patriotic development, and popularization of a grateful attitude toward the Earth.
    He is also developing a social network for Kombucha''s owners called Latusho,
    and he also writes poetry and short stories and makes macramé.


    > I would like to express gratitude to the author for this opportunity to improve
    my knowledge of social networking, as well as Packt Publishing for providing such
    an interesting experience in the reviewing process.'
  merge: -1
  img_proc: true
