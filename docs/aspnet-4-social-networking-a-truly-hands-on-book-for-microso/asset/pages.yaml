  md: "# User Profiles\n\nThis is optional, but the cropper script provides us with\
    \ a preview of what we are doing. To implement this, we need to have a location\
    \ for the preview to output in the form of a div tag.\n\n```\n```html\n<div id=\"\
    previewWrap\"></div>\n```\n```\n\nWe then need to add a JavaScript function that\
    \ hooks up the cropper scripts to our UI. This script sets some of the basic properties\
    \ such as what the image's ID is, where to stash the output for the preview, the\
    \ minimum height and width, a fixed ratio (forcing the cropper to be a square\
    \ in our case), and what to do when the cropping is complete. Also note that the\
    \ name of the image control (Content_imgCropImage) is unlike what you would have\
    \ typically seen working with earlier versions of ASP.NET. With ASP.NET 4, the\
    \ control name is much simpler to get to and no longer uses the ctl00 prefix.\n\
    \n```\n```javascript\n<script type=\"text/javascript\" language=\"javascript\"\
    >\n    Event.observe(window, 'load', function() {\n        new Cropper.ImgWithPreview(\n\
    \            'Content_imgCropImage',\n            {\n                previewWrap:\
    \ 'previewWrap',\n                minWidth: 100,\n                minHeight: 100,\n\
    \                ratioDim: {x: 100,y: 100},\n                displayOnInit: true,\n\
    \                onEndCrop: onEndCrop\n            }\n        );\n    });\n</script>\n\
    ```\n```\n\nWe want the cropper to store some of the data that is captured in\
    \ some hidden fields so that we can work with it on the server side. We then need\
    \ to add a function that handles the onEndCrop event that is fired off by the\
    \ cropper. This will actually handle storing the data into the HiddenField controls.\
    \ We skip showing this part of the code as it is fairly trivial.\n\nMoving on,\
    \ once a user has selected the area of the image that he/she would like to use\
    \ for the avatar and submits that selection to the server, we have what we need\
    \ to perform an image crop. The presenter's CropFile() method will handle this\
    \ task.\n\n```\n```csharp\n//Fisharoo/Web/Profiles/Presenters/UploadAvatarPresenter.cs\n\
    public void CropFile(Int32 X, Int32 Y, Int32 Width, Int32 Height)\n{\n    byte[]\
    \ imageBytes = profile.Avatar.ToArray();\n```\n```"
