- pgno: 350
  md: '# Ratings


    The **Ratings** table is responsible for holding all the end user ratings. As
    you can see each rating ties back to the **SystemObjects** table and also directly
    to the record within the specified table. In addition to that, we are also tracking
    the option that was rated. The most important part of this table though is the
    **Score** field. The **Score** tracks the selected number of stars (in our case)
    that the end user has selected.


    # System object rating options


    In addition to the ratings table we also have the **SystemObjectRatingOptions**
    table. This table tracks all the options that are available for each of our system
    objects.


    # Tags


    The Tags table is responsible for holding all the textual tags that our users
    attach to the various objects in our system. Knowing that we intend to collect
    a number of the same tags for multiple objects in our system, it is important
    that we maintain a unique list of tags with counts rather than a single entry
    for every tag entered into the system and then having to sum up the tags to get
    a count. Performance-wise, maintaining the aggregate value as we collect tags
    will easily outperform determining the summed value each time we need the count.


    # System object tags


    This then brings us to our **SystemObjectTags** table. It is responsible for maintaining
    details of which tag is connected to which record of a certain type of object.
    This table simply maintains various record IDs to keep track of the relationships.


    # Comments


    This finally brings us to the Comments table. Of the five features, this is by
    far the easiest to implement as this table keeps track of everything for us directly.
    Each comment in this case is assumed to be unique and is therefore directly tied
    to an object and a record within that object. We also keep track of the user who
    left the comment (**CommentByAccountID**) and when (**CreateDate**) he/she did
    so. The current size of the comment can be up to 2,000 characters. However, if
    your community requires large comments, you can of course increase this number.'
  merge: -1
  img_proc: true
- pgno: 351
  md: '# Votes and Mark as Answer


    Votes are managed at individual thread/post level. We don''t need a new table
    for this, but extend our BoardPosts table to add two new columns to it—VoteCount
    and IsAnswer. The change in vote count or setting of answer will result in the
    change of score for the relevant user.


    # Medals


    The medals depend on the total score earned by a user. For this purpose we will
    extend the existing Accounts table and add a new column called Score. The Medals
    user control will display appropriate number of medals. We will look into that
    later when we discuss the presentation layer details.


    # Creating the relationships


    Once all the tables are created, we can create all the relationships.


    For this set of tables, we have relationships between the following tables:


    +   - Ratings and Accounts

    +   - Ratings and SystemObjectRatingOptions

    +   - Ratings and SystemObjects

    +   - SystemRatingOptions and SystemObjects

    +   - SystemObjectTags and Accounts

    +   - SystemObjectTags and SystemObjects

    +   - SystemObjectTags and Tags

    +   - Comments and Accounts

    +   - Comment and SystemObjects


    # Setting up the data access layer


    To set up the data access layer, we follow the steps as already done in earlier
    chapters. Open the Fisharoo.edmx file and add all the above mentioned tables.'
  merge: -1
  img_proc: true
