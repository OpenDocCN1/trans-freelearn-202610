- pgno: 236
  md: '# Problem


    Apart from the standard infrastructure issues that we have to consider when building
    a system such as this, one of the core issues in any web-based file management
    system is file upload. As we all know, most server side technologies allow only
    one file to be uploaded at a time and ASP.NET is no different. And while we could
    easily buy a third-party plug-in to handle multiple files at once, we decided
    to provide for options to upload the files either via Silverlight or via Flash.


    Once we get our file upload process working we are only one-third of the way there!
    As we are going to be mostly concerned with uploading images, we need to consider
    that we will need to provide some image manipulation. With each file that is uploaded
    to our system we need to create a handful of different sizes of each image to
    be used in various scenarios across our site. To start with, we will create thumbnail,
    small, medium, large, and original size photos.


    Now while creating different size files is technically working with the file storage
    system, we wanted to take an extra breath with regards to the file storage concepts.
    As we discussed in the earlier chapters, we could choose to store the files on
    the file system or in a database. For avatars it made sense to store each with
    the profile data whereas for image galleries it makes more sense to store the
    file on the file system. While storing files to the file system we need to be
    very cautious as to how the file structure is defined and where and how the individual
    files are stored. In our case we will use system-generated GUIDs as our file names
    with extensions to define the different sizes that we are storing. We will dig
    into this more as we start to understand the details of this system.


    Once we have uploaded the files to the server and they are ready for our use across
    the system, we will take up the concept of user files versus system files. If
    we build the system with some forethought regarding this topic we can have a very
    generic file management system that can be extended for future use. We will build
    a personal system in this chapter. But as you will see with some flags in just
    the right places, we could just as easily build a system file manager or a group
    file manager.


    # Design


    Let''s take a look at the design for this feature.'
  merge: -1
  img_proc: true
- pgno: 237
  md: '# # Files


    For our site, as we are not storing our files in the database, we need to take
    a closer look at what actually needs to be managed in the database so as to keep
    track of what is going on in the file system. In addition to standard file metadata,
    we need to keep a close eye on where the file actually lives—specifically which
    file system folder (directory on the hard drive) the file will reside in. We also
    need to be able to maintain which accounts own which files, or in the case of
    system files, which files can be viewed by anyone.


    # # Folders


    You may be wondering why we have a separate section regarding folders when we
    just touched upon the fact that we will be managing which file system folder we
    will be storing files in. In this section we are going to discuss folder management
    from a site perspective rather than a file system perspective—user folders or
    virtual folders if you desire.


    Very similar to file storage, we will be storing various metadata about each folder.
    We will also have to keep track of who owns which folder, who can see which folder,
    or in the case of system folders whether everyone can see that folder. And of
    course as each folder is a virtual container for a file, we will have to maintain
    the relationship between folders and files.


    # # File upload


    The file upload process will be handled by a Silverlight/Flash client. While this
    is not really a book about either Silverlight or Flash, we will show you how simple
    it is to create this Flash client, that is really just providing a way to store
    many files that need to be uploaded, and then uploading them one at a time in
    a way that the server can handle each file. For the Silverlight option, we are
    using code from Codeplex—**http://silverlightfileuplo1d.codeplex.com/**.


    # # File system management


    Managing the file system may seem like a non-issue to begin with. However, keep
    in mind that for a community site to be successful we will need at least 10,000
    or so unique users. Given that sharing photos and other files is such a popular
    feature of most of today''s community sites, this could easily translate into
    a lot of uploaded files.'
  merge: -1
  img_proc: true
