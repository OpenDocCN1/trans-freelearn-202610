  md: "# Media Galleries\n\nWith the files deleted we take the file system beautification\
    \ one step further. We need to check to see if the folder is now empty. If it\
    \ is, then we delete the folder too!\n\n# FolderRepository\n\nThere are a couple\
    \ of methods in the FolderRepository that are worth covering.\n\n+   - GetFoldersByAccountID\n\
    +   - GetFriendsFolders\n\nThe GetFoldersByAccountID does just what it says! It\
    \ takes in an AccountID and performs a search to get all the folders by the passed\
    \ in AccountID. It does go a bit beyond that. It then iterates through each folder\
    \ in the resulting list and generates the file system path for the folder's cover\
    \ image. This determination is then assigned to the FullPathToCoverImage. If there\
    \ is no cover image found then the default image is assigned. Once we have this\
    \ taken care of, we return the list of folders.\n\n```\n```csharp\n//Fisharoo/DataAccess/Repositories/FolderRepository.cs\n\
    public List<Folder> GetFoldersByAccountID(Int32 AccountID)\n{\n    List<Folder>\
    \ result = new List<Folder>();\n    using(FisharooDataContext dc = conn.GetContext())\n\
    \    {\n        var account = dc.Accounts.Where(a => a.AccountID == AccountID).FirstOrDefault();\n\
    \n        IEnumerable<Folder> folders = (from f in dc.Folders\n              \
    \                         where f.AccountID == AccountID\n                   \
    \                    orderby f.CreateDate descending\n                       \
    \                select f);\n        foreach (Folder folder in folders)\n    \
    \    {\n            var fullPath = (from f in dc.Files.Include(\"FileType\")\n\
    \                            join ft in dc.FileTypes on f.FileTypeID equals ft.FileTypeID\n\
    \                            where f.DefaultFolderID == folder.FolderID\n    \
    \                        select f).FirstOrDefault();\n            if (fullPath\
    \ != null)\n            {\n                String FullPathToCoverImage = fullPath.CreateDate.Year.ToString()\
    \ + fullPath.CreateDate.Month.ToString() + \"/\" + fullPath.FileSystemName.ToString()\
    \ + \"_S_\" + fullPath.FileType.Name;\n                folder.FullPathToCoverImage\
    \ = FullPathToCoverImage;\n            }\n        }\n    }\n}\n```\n```"
