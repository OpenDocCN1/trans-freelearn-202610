- '# 1 社交网络


  随着互联网和移动设备行业的蓬勃发展，世界各地的人们比以往任何时候都更加紧密相连。社交网络正是当下的热潮。本书的主题就是如何构建一个社交网络网站或社区网站。在本书中，我们将研究一些知名社交网络和一些不太知名的网络，以了解哪些功能受欢迎。然后，我们将讨论在本书中要构建的社区。一旦我们了解了其他人在做什么以及我们的社区会是什么样，我们将立即投入去构建自己的演示社区。


  ## 为什么这个主题如此重要


  **社交网络**的核心在于发展朋友和伙伴之间的联系或纽带。虽然人们自古以来就在相互建立联系，但互联网使我们能够以全球化的方式进行。一些广受欢迎的社交网络的典型示例包括
  Digg、LinkedIn、Facebook 和 Twitter。大多数人听说过这些服务，许多人每天都在使用它们。这些社区能够通过广告和额外的付费服务产生收入。


  ## 社区遍地开花


  `Digg.com` 是一个聚合其他网站信息的信息聚合器。它允许人们发布有趣视频、博客、新闻源以及其他形式的媒体和内容的链接。这些帖子会根据站内其他用户对它的喜爱程度被推送到网站顶部。最终，帖子会沉到首屏之下，逐渐被遗忘。他们网站的关键之处在于，你实际上并不会在他们网站上查看内容的正文。这项服务本质上就是一个动态链接农场，而且有过之而无不及。






  ## 社交网络


  **LinkedIn.com** 将社交网络的概念进行了打磨，并增添了专业色彩。通过此服务，你可以建立专业档案，与招聘人员建立联系，与所在地区的其他专业人士建立联系，最重要的是，与他们所联系的每个人建立联系。LinkedIn
  真正抓住了扩展网络概念的力量。


  Facebook.com 最初始于哈佛大学。该网站本质上是学校发给新生的一本数字版书籍，以便每个人都能互相认识。该网站非常注重建立个人资料并通过 Facebook
  称之为“墙”的窥探功能将这些个人资料链接起来。该功能本质上会捕获你在网站上朋友所进行的所有活动。墙是另一种形式的聚合。Facebook 也以其可扩展性功能而闻名，这些功能允许开发者直接在
  Facebook 环境中创建和托管应用程序。


  Twitter.com 大多数人会称其为微型博客。该网站允许你向你的博客发布非常小的短语，然后将其推送给你的订阅者（朋友）。该服务主要用于让人们知道你正在做什么。此功能的一个很好的用途是发布：“我正在某某咖啡店。如果附近有人，欢迎过来一起喝杯咖啡。”


  这些都是非常庞大的社区网站，很容易就拥有数百万订阅者/成员。然而也有趣的是，在通常庞大的用户群体中，只有很小一部分是活跃的，而大多数人是被动用户。人们可能加入这些网站更多是为了社交地位，但可能并不是真正的活跃用户。


  也有许多成功的社区网站以更小的规模运营。其中一些包括 Rockero.com、AnimeDates.com 和 Ning.com。虽然它们没有 LinkedIn、Facebook
  等那么大或知名，但这些都是非常活跃的社区，能够通过社区上的广告谋生。像 Ning 这样的一些社区甚至收取会员费。


  ### 一旦我有了自己的社交网络，然后呢？


  尽管已经有这么多社交网络网站，但仍不断涌现出新的网站。每个人都想建立自己的网站，认为自己有更好的想法，能比别人做得更好。下面列出了任何社交网络网站经常被忽略的一些关键考虑因素。


  这个社交网络将专注于帮助新老海水鱼缸主人设置和照顾他们的海水鱼缸。它还将帮助他们选择合适的鱼类组合。而且，作为一个社区，它将为他们提供一个可以提供建议并接受建议的地方。


  ![](img/15a62e134135dde036b0ac3cbb01dab6_36_0.png)


  ### 本书的方法


  在每一章中，我们将遵循一种模式来构建功能或一组功能。我们将从本章要解决的问题开始。然后我们将尝试找出一种设计来解决我们需要构建的功能。最后，我们将讨论满足设计要求所需的内容。


  #### 问题


  在问题部分，我们将概述为了实现本章主题的成功，我们需要做什么。我们将向你展示成品的一些屏幕截图。并且我们将涵盖构建功能时需要注意的主要陷阱。


  #### 设计


  本章的这一部分是关于定义我们对功能或功能的期望。在这里，我们将决定并写下物理需求，以便在下一节开始构建功能集。在这里，我们将开始查看数据库可能是什么样子，是否需要制作一页或两页，或者用户控件是否会更好，以及开源工具是否可以帮助我们满足需求。


  #### 解决方案


  在我们章节的解决方案部分，我们将讨论如何实现每个功能的全部要求。本节将深入探讨从数据库到用户界面的功能实现实际代码。我们将使用 ASP.NET 4 进行实现，Visual
  Studio 2010 作为 IDE。除 ASP.NET 外，我们还将在实现中利用 .NET Framework 4 的某些功能、第三方工具和 SDK。我们将在书中内联提供相关代码。整个代码可以从
  Packt 网站下载。在本节结束时，你应该拥有可以玩的东西。


  ### 我们社交网络的功能


  以下是我们社交网络网站将具备的理想功能：


  #### 账户


  用户账户在任何有用户为网站做出贡献的数据驱动网站上几乎是必须的。如果你需要知道你的用户是谁，那么你就需要某种方式来跟踪他们的账户。与其向你展示纯 ASP.NET
  方式的账户，本节将向你展示如何从头开始构建自己的账户系统。


  这将包括查看注册流程，我们的用户在此创建初始账户。为了确保我们阻止机器人和其他程序以自动方式创建账户，我们将实现 reCAPTCHA 系统并讨论此方面的其他选项。我们将实现电子邮件验证系统，以确保我们的用户确实是他们声称的那样。在此基础上，我们还将讨论设置权限系统，以便我们随着时间的推移对其进行构建。并且，没有一章关于账户创建是完整的，除非我们讨论密码加密（一个经常被忽略的话题）。


  ![](img/15a62e134135dde036b0ac3cbb01dab6_38_0.png)


  #### 个人资料


  用户的个人资料实际上只是其账户的扩展。区别在于账户保存登录信息，而个人资料保存所有个人标识符。它保存用户的描述、用户的属性以及他们的照片（头像）。我们将讨论以一种足够灵活的方式创建用户个人资料，以便所有系统都可以使用。我们还将讨论如何处理头像的创建，以便用户可以上传图片然后适当地裁剪它。由于个人资料包含大量关于用户的信息，我们还将实现一些隐私形式，允许他们隐藏某些部分并显示其他部分。最后，我们将讨论为我们的用户创建个人页面，允许他们拥有一个虚荣
  URL，使用 ASP.NET 的 URL 路由功能实现（www.site.com/profiles/AtulGupta）发送给他们的朋友。


  ![](img/15a62e134135dde036b0ac3cbb01dab6_39_0.png)


  #### 好友


  在社区中拥有好友的概念是让人们不断回到你网站的粘合剂。好友是你声明的、你信任并允许查看你的信息的用户，并且你通常对他们感兴趣。把好友想成一个联系人、同事等等。不同的术语描述了不同社区主题的相同概念。


  在本节中，我们不仅会向你展示如何实现 **好友** 功能，还将讨论如何搜索他们、在网站列表中找到他们，以及导入你的联系人到网站以找到你的好友。我们还将实现一个微型博客，允许你的用户提供他们所在位置和正在做什么的状态。此状态随后将作为提醒显示在你的微型博客和你的好友的微型博客上。


  ![](img/15a62e134135dde036b0ac3cbb01dab6_40_0.png)


  #### 消息


  消息对于任何社区网站都是必不可少的，因为它允许用户直接相互通信。这可以有多种形式。你可以向用户发送消息，直接通过电子邮件发送给用户。或者你可以允许你的用户通过网站发送消息，然后存储在收件人的收件箱中。然后向收件人发送通知。这种最后一种形式对你作为网站管理员来说更容易管理。


  在本节中，我们将创建一个完整的消息系统，其外观类似于 Hotmail 或 Gmail 等基于网络的电子邮件应用程序。作为我们界面的一个部分，我们将显示现有好友列表以发送消息。并且我们将学习如何以一种可以在整个网站中轻松重复使用的方式实现
  Xinha WYSIWYG 编辑器，用于复杂输入。我们将在后面的章节中更详细地介绍 Xinha 编辑器。






  ![](img/15a62e134135dde036b0ac3cbb01dab6_41_0.png)


  ## 媒体库


  有很多社区非常依赖媒体库。YouTube 或类似的网站就是一个例子。这通常是能将最大比例的社区成员带回你网站的功能。因此，非常重要的是要了解如何构建一个媒体系统，而不是构建图像库、视频库等。我们将构建一个通用的媒体管理系统，让你能够托管视频、照片、简历或任何数量的物理文件，只需做少量额外调整即可。


  除了媒体管理系统之外，我们还将探讨解决许多 Web 编程环境中最大的限制之一——多文件上传。ASP.NET 在处理一次一个文件时很出色，但在管理照片库时，例如，你会发现自己经常需要上传几张或数百张照片。与其创建基于
  Java 或 Active-X 的控件，这可能需要用户系统进行额外安装，我们将研究基于 Silverlight 的实现以及基于 Flash 的实现。


  ## 社交网络


  通过此功能，我们能够浏览到一个目录并上传任意数量的文件，如下图所示：


  ![](img/15a62e134135dde036b0ac3cbb01dab6_42_0.png)


  ## 博客


  博客通常是任何社区网站中的主要功能，因为它为喜欢向世界发言的人提供了这样做的工具。另一方面，你的博客输出为那些更具窥视欲的人提供了免费内容供他们阅读和跟进。活跃的博主对社区最大的好处之一是，你获得了大量免费内容来喂养各种搜索引擎蜘蛛。这反过来会帮助你提高搜索排名，从而为你的网站带来更多流量，并进而壮大你的社区。


  考虑到搜索引擎、用户和安全性，我们将投入一些时间来解决困扰许多动态网站的一个问题——使用查询字符串数据来确定页面输出。说实话，从用户角度来看，在查询字符串中看到一堆变量名、随机自动生成的记录
  ID 和 32 个字符的 GUID 根本不友好，有时甚至令人困惑。再加上如今搜索引擎似乎能够导航这种查询字符串乱码，但我们却失去了通过伪装 URL 使其看起来像我们的关键词是目录，从而优化网站关键词排名的关键机会。我们将继续从个人资料的示例出发，扩展我们的个性化
  URL 支持，以便我们可以拥有类似 www.sitename.com/blogs/AtulGupta/my-article-name.aspx 的地址。


  ## 论坛


  每个人都知道论坛是什么。对于社交网络来说，这是一种脱节的沟通形式，人们可以在其中发布内容供讨论，其他人可以在一段时间后偶然发现该帖子并发表自己的看法。在开发人员世界中，你经常会有一个完全围绕这种功能构建的社区，例如技术帮助论坛。对于我们专注于帮助他人弄清如何运营水族馆的网站来说，此功能将非常有用。


  ![](img/15a62e134135dde036b0ac3cbb01dab6_43_0.png)


  上图显示了留言板的外观。


  ## 投票


  投票是管理社区网站内容并认可通过在论坛中提供有价值评论而做出贡献的人的一种方式。用户需要有权对论坛上发布的问题或回复进行正面和负面投票。这有助于其他用户不必阅读整个问题及相关回复，而是专注于投票更高的内容。与
  *标记为答案* 类似，投票也有助于建立个人的声誉。


  ## 奖章


  一旦用户开始根据被标记为答案或被投票支持的回复累积积分，他们就开始获得奖章。这是对其在网站上声誉的视觉体现（见下图），奖章数量越高，社区对其言论的信任度就越高。


  ![](img/15a62e134135dde036b0ac3cbb01dab6_46_0.png)


  ## 框架


  任何人都可以构建一个具有我们讨论过的功能的家庭式社区网站。然而，如果你想构建一个能够随着社区成长而成长的网站，我们希望从一开始就以某种方式构建它。为此，我们将提前遵循一些设计模式和概念。我们将使用
  n 层方法构建我们的网站，采用领域驱动设计、模型视图演示者、工厂模式和仓储模式。我们还将使用微软随 .NET 4 提供的 **托管可扩展性框架 (MEF)**、ADO.NET
  实体框架及相关工具和 Windows Server AppFabric，以及一些优秀的开源工具集，如 Lucene.NET 和 MemCached。


  ### 扩展


  一旦我们完成了核心社区的构建，我们将开始讨论一些概念，以帮助你在社交网络上支持大量用户。我们将讨论应用程序如何分层、转变为面向服务架构 (SOA)、部署在 IIS
  上以及围绕 Web 农场的某些关键概念。我们将讨论如何使用 Lucene.NET 创建和搜索索引数据。我们还将介绍如何通过在 Web 农场内部使用新的 Windows
  Server AppFabric 或 MemCached Win32 服务器实现缓存农场来优化数据检索和内容创建。我们还可以探讨通过实现某种邮件队列概念来优化电子邮件通信。


  ### 总结


  我们已经查看了一些构成社交网络网站的功能，并查看了一些成功的社区网站示例。接下来，我们讨论了社区网站必须提供的关键功能，并简要介绍了 POST 和 SLATES。最后，我们讨论了我们将在本书中构建的功能。

  '
- "# 2 企业级社区框架方法\n\n我们都做过应用程序开发。通常它从小开始，具有有限的功能需求，似乎未来不需要。但随后你发现自己不断为该应用程序添加功能。它持续不受控制地增长和增长。如果你知道该应用程序会如此重要并会被如此广泛使用，你可能就会以不同的方式构建它。很可能你会考虑到可扩展性来设计应用程序，而不是急于完成项目并交付！\n\
  \n### 应用程序设计\n\n应用程序设计如下：\n\n### 关键原则\n\n在设计 Fisharoo 解决方案时，我们将尝试遵循某些架构原则，其中一些重要原则是：\n\
  \n- **模块化且松耦合**：我们将尝试通过将相关功能划分为各种模块来构建 Fisharoo，这些模块之间没有或只有相对较低的相互依赖。\n- **关注点分离\
  \ (SoC)**：这是将应用程序分解为特定功能单元的过程，以使每个单元仅解决一个关注点的需求，并且在功能方面与其他单元的重叠尽可能少。有关此主题的更多信息请见：http://en.wikipedia.org/wiki/Separation_of_concerns。\n\
  - **可扩展性：** 我们将尝试以可扩展的方式构建应用程序的大部分内容，以便如果需要，我们可以替换部分功能，而无需重新编译整个应用程序甚至重新设计。\n- **构建还是购买：**\
  \ 在可能的情况下，我们将尝试利用 .NET 堆栈中的开箱即用功能，或寻找第三方/开源组件来填补空白。\n\n上述每个原则将在以下部分中讨论。随着我们的进展，我们还将看到它们如何借助技术和架构模式得以实现。\n\
  \n### 分层架构\n\n知道我们的应用程序将是一项庞大的工作，应该持续一段时间，我们需要设计一个能够在需要时轻松扩展的东西。为此，我们将尝试以可扩展性为目标来设计此应用程序。最简单的方法是遵循保持“关注点分离\
  \ (SoC)”的一般规则。\n\n### 层\n\n保持 SoC 的最简单方法是首先将应用程序的主要区域划分为层。在大多数应用程序中，这可能分为表示层、业务逻辑层和数据访问层。\n\
  \n- **表示层：** 此层通常包含与应用程序用户界面相关的任何内容——用户在使用应用程序时点击和交互的按钮、链接和其他控件。\n- **业务逻辑层：** 这里是应用程序规则的所在。这可能像在产品目录中格式化价格货币那样简单，也可能像强制执行数据输入规则那样复杂。\n\
  - **服务层：** 在构建 **面向服务架构 (SOA)** 时，服务层建立在业务逻辑层之上。由于我们不以 SOA 实现为目标，我们将不会创建此层。然而，在第\
  \ 13 章中，我们将向你展示如何在现有设计中引入此层而无需大量更改。\n- **数据访问层：** 数据访问层负责连接到数据源并与存储在该位置的数据进行交互。这可能是一个数据库、一些\
  \ XML 文件、文本文件，甚至是一个 Web 服务。\n\n\n\n\n\n领域驱动设计（Domain-driven Design）是一个宏大的主题。为了帮助你开始理解其高层概念，我们这里只概述基础内容。随着我们继续构建框架和应用程序，你将看到以下一些原则得到应用。\n\
  \n如需了解更多关于领域驱动设计的信息，请访问这个网站：http://www.domaindrivendesign.org。\n\n## 重要方面\n\n领域驱动设计的重要方面如下：\n\
  \n## 通用语言\n\n**通用语言**（ubiquitous language）的概念很简单。它基本上指出，所有参与软件开发项目的人员——业务所有者、项目经理、开发人员，也就是几乎所有人——都使用同一种语言来描述正在开发的软件的各个方面。这减少了混乱，从而提高了整体开发速度。\n\
  \n这一概念不仅仅用于讨论。它还延伸到类、方法等的实际命名上。一旦做到这一点，无论谁参与讨论，所有讨论听起来都会相似。当遵循这一点，并且每个人在所有对话中都使用同一种语言时，混乱就完全消除了，不再有专业知识孤岛。\n\
  \n最终，领域和领域逻辑变得更加精炼。应用程序也因此变得更好！\n\n## 实体\n\n**实体**（entity）是应用程序中在应用整个生命周期内保持自身状态的对象。这意味着它可以从\
  \ XML 文件中重新加载、保存到数据库、之后从该数据库实例中加载、序列化并通过网络发送——在所有情况下都能得到相同的对象。这是通过使用唯一 ID 来实现的。这个\
  \ ID 可以是任何东西，从自增数字 ID、GUID，到**社会安全号码（SSN）**，包括系统中任何唯一的值。\n\n一个例子可以是美国（U.S.）的一个人。在这种情况下，我们可以使用一个人的\
  \ SSN，每个生成的人都是唯一的。当我们放眼全世界的人时，SSN 就不再被视为一种好的唯一 ID 形式，因为并非世界上所有人都有 SSN。因此在这种情况下，我们可能不得不开始查看一个人的多个属性来定义其唯一性。我们可以取他们的出生日期、姓氏、国家/州、城市等等。这些信息的组合应该能在你的系统中产生一个唯一的实体。实体是领域中最重要的对象。\n\
  \n应用程序中的所有对象都需要唯一吗？所有对象都必然是实体吗？嗯，答案是“不是”。在下一节中，我们将通过值对象来回答这些问题。\n\n## 值对象\n\n值对象（value\
  \ object）没有实体那么重要。它不需要身份标识，因此可以轻松创建，无需担心确定其唯一性。我们更关心这个对象是什么，而不是它是谁。值对象应该是不可变的。如果需要修改值对象，请丢弃它并创建一个新的。但如果你发现该对象不是不可变的，或者没有自己的身份就无法存在，那么它很可能是一个实体对象。\n\
  \n为了进一步扩展我们在*实体*一节中的人物示例，我们可以创建一个“地址”值对象，而不是让一个人拥有州、城市、邮政编码、街道或任何其他与地址相关的属性。然后，值对象将存储州、城市、邮政编码、街道等信息。这个地址对象随后可以成为一个人的一部分。因此你可以使用它，如\
  \ *person.Address.City*。从技术上讲，这个地址可以被同一所房子里的所有人共享。我们不太关心地址本身，而是关心它附着在某个特定的人身上这一事实。\n\
  \n为什么我们需要值对象？值对象很重要，因为它们提供了一种对信息位进行分组的方式，正如你在上面的示例中看到的那样。作为“轻量级”对象，它们减少了应用程序中使用的资源量。它们还简化了应用程序，因为值对象不需要唯一性。\n\
  \n## 服务\n\n![](img/15a62e134135dde036b0ac3cbb01dab6_53_0.png)\n\n> 这里的“服务”一词不应与**面向服务架构（SOA）**领域中的服务混淆。\n\
  \n当我们使用通用语言讨论应用程序时，我们很快就会得到一个由名词（实体和值对象）和动词（这些对象的方法）组成的词汇表。然而，并非我们最终得到的所有动词都能轻松地融入我们定义的实体和值对象中。我们该如何处理这些同样重要却无家可归的动词呢？应用程序显然需要它们。我们要不要因为找不到更好的位置而把它们塞进现有的某个对象中？这样做会造成混乱，并使这些对象变得难以使用。因此，前面问题的答案是“不”。我们宁愿创建一个服务。\n\
  \n**服务**（service）既不是实体也不是值对象。话虽如此，鉴于我们使用的是基于**面向对象编程（OOP）**的语言，我们必须创建某种对象。因此我们创建一个基于服务的对象，为应用程序提供所需的动作（动词）。以电子商务应用程序为例。我们可能有一个客户和一个供应商，其中一方需要通过电子邮件联系另一方。在客户对象中添加一个方法，用于从供应商向客户发送电子邮件，这合适吗？在供应商对象中添加这个方法合适吗？放在任何一个对象中似乎都不太对。因此我们可以创建一个电子邮件服务。现在，当我们的客户需要联系供应商，或者供应商需要联系客户时，任何一方都可以使用该服务来处理通信。\n\
  \n## 模块\n\n即使你从未听说过或使用过领域驱动设计，你也很容易理解什么是模块。**模块**（module）是应用程序中一组特性和功能。模块是将庞大而复杂的领域逻辑组织成更小、更易理解的单元的一种方式。模块还有助于遵循高内聚、低耦合的原则，将高度内聚的代码放在一起。\n\
  \n在这个应用程序中，我们将有账户、博客、图片画廊以及许多其他功能。虽然我们可以轻松地创建一个庞大的代码库来涵盖所有这些功能，但对我们来说，创建更小的代码单元来分别描述每个模块的特性会更容易。显然，模块之间会有一些重叠，因为账户在画廊和博客中都会用到。博客也可能引用图片画廊中的图片。正如你所看到的，模块不仅让你的代码更易于理解，而且由于你将代码进一步细化到另一个容器中，它们还有助于保持解耦！\n\
  \n## 聚合\n\n到目前为止，我们已经讨论了必须使用通用语言来定义应用程序词汇表的思想。根据该定义，我们将提取出实体和值对象。当方法不适合我们的实体或值对象时，我们可以创建服务。而所有这些项都可以分组到模块中。现在我们将继续讨论如何使用聚合、工厂和仓储来管理、创建和存储这些项。\n\
  \n对于复杂的应用程序，我们将有大量对象需要处理。到目前为止，我们一直试图通过定义良好的词汇表并将该词汇表分组到更小的容器中来降低复杂性。此外，我们还通过声明某些对象需要在应用程序中保持状态，而其他对象则不需要，来尝试降低复杂性。\n\
  \n我们尚未讨论的是如何维护对象的生命周期。我们知道它们会被创建、存储、传递等等。但是当需要从系统中彻底删除其中一个对象时该怎么办？如果我们不密切管理对象的使用，最终可能会导致对象无缘无故地随机漂浮在我们的系统中。这反过来又会给我们带来问题，例如内存泄漏、缓冲区溢出、空指针访问，最终导致系统崩溃。\n\
  \n因此，规划对象之间交互的简单性非常重要。与其让对象随意地互相创建，不如设置一些守门人，我们必须通过它们才能访问其他对象。例如，对象 Z 访问对象 B 的唯一方式是通过对象\
  \ A。这样，当对象 Z 用完对象 A 和对象 B 后，我们可以直接移除对象 A，对象 B 也会随之消失。\n\n**聚合**（aggregation）是我们可以在对象中使用的一个边界。我们之前讨论过**人**对象是一个实体对象，地址信息是一个值对象。让我们扩展这个示例，假设我们还有一个处理人联系信息的对象，其中可能包含电话号码、电子邮件地址等。这同样是一个值对象。与其让外部对象直接访问地址和联系信息，我们可以强制它们通过实体对象来读取这些数据。此外，如果外部对象想向一个人的电话号码列表中添加一个号码，我们可以强制规定唯一的方式是通过人对象，而不是通过联系信息对象。\n\
  \n沿着这一概念继续推进，通过将类结构进一步分解为更小的代码块，我们的领域逻辑得以进一步简化。这不仅从开发的角度来看更容易操作，而且管理对象在应用程序中的来去也更为简单。\n\
  \n\n\n\n\n## 工厂\n\n在设计过程中我们力求简洁，但如何限制创建对象所涉及的复杂性呢？将这部分逻辑存储在待创建的对象本身并不合理。在对象构造函数中放一些简单逻辑、让对象自行构建是一回事，但当该对象是一个实体，并且自身包含多个值对象作为其组成部分（即聚合）时，就是另一回事了。在这种情况下，我们希望将创建逻辑放入一个名为“工厂”的组件中。\n\
  \n在力求让对象专注于单一职责的同时，建立一个“人”工厂来创建一个人及其地址信息和联系方式，而不是让人对象既知道如何完成这些任务，又知道如何做一个人，就显得合情合理。为了更好地理解这一概念，以购买电视为例。如果你想要一台新电视，会去当地的电器商店购买。你不会期望商家给你一块屏幕、一个外壳、一些电子元件、几根线缆、一些塑料、一把按钮和组装说明，让你自己组装电视。你会走到货架前，挑一台电视，买一个装有一台可正常工作电视的盒子，然后回家。我们应该让我们的对象也以同样的秩序运转。把工厂想象成电器商店，把你的对象想象成组装好的电视。你的对象应该做它最擅长的事——像人一样行事，而不必操心如何读取遗传密码和组装细胞。\n\
  \n## 仓储\n\n我们已经明白工厂的唯一目的是创建对象，那么对于已经存在的对象的水合（hydration）又该如何处理呢？也许我们在数据存储中保存了一个人员列表。工厂是否应该负责检索这些人员？在\
  \ DDD 中，这被认为是仓储（Repository）的职责。\n\n**仓储**是一种对象，其用途专门针对单个实体对象。例如，我们会有一个 PersonRepository\
  \ 对象，它知道如何根据某些明确定义的参数获取一个人（或多个人），也懂得如何将人员对象持久化到数据存储中。\n\n请注意，我们使用的是“数据存储”而非“数据库”。仓储与应用程序的基础结构代码紧密协作。它应该知道如何处理应用程序可能适用的各种数据存储，这可以是数据库、Web\
  \ 服务、XML 文件集合或任何其他数据存储。虽然你的仓储足够智能以与基础结构代码协作，但它向其他领域对象呈现的接口应当面向领域，并且便于其他领域对象使用。\n\
  \n## 实体框架\n\n在上一节中，我们讨论了领域驱动设计。现在来看看如何实现同样的概念。Microsoft ADO.NET 实体框架提供了一个数据访问框架，用于构建以领域为中心、需要解决对象关系阻抗失配问题的应用程序。对象关系阻抗失配主要是由于底层关系实体或表的结构与领域/业务概念的结构（这些概念通常以类、聚合、继承等面向对象概念建模，在上面领域驱动设计一节中称为实体和值对象）之间的差异造成的。\n\
  \n实体框架通过在现有关系或非关系数据源之上实现一个逻辑抽象层来解决阻抗失配问题，该抽象层称为实体数据模型（EDM），它托管实体与关系表之间的映射。此映射可以轻松更改，而无需修改在此逻辑抽象之上编写的数据访问代码。因此，实体框架可以支持连接到多个数据库，如\
  \ Microsoft SQL Server、ORACLE、DB2 等。\n\n实体框架是 .NET Framework 4 的一个组成部分，并通过模型优先方法、对纯旧式\
  \ CLR 对象（POCO）的支持等有趣特性，在其早期版本之上进行了构建。鉴于实体框架的简单性、灵活性和日益广泛的采用，我们决定使用它来构建数据访问层。\n\n\
  ## 仓储模式与实体框架\n\n之前我们曾对仓储进行了高层讨论。现在准备进一步深入。我们知道，仓储的核心在于为领域逻辑提供一种访问外部世界资源的方式。我们也知道它们可以用于\
  \ Web 服务、XML 文件以及几乎任何其他资源。在我们的场景中，将讨论如何使用 EF 访问数据库中的数据。\n\n到目前为止，我们还没有真正涉及与 Fisharoo\
  \ 应用程序相关的任何内容，这意味着数据库中还没有可供我们操作的数据。为此，我们创建了一个简单的 Person 表供使用。它具有以下字段：PersonID、FirstName、LastName\
  \ 和 Email。然后我们在数据库中创建了四条记录供使用。\n\n```\nCREATE TABLE [dbo].[Person](\n    [PersonID]\
  \ [int] IDENTITY(1,1) NOT NULL,\n    [FirstName] [varchar](30) NULL,\n    [LastName]\
  \ [varchar](30) NULL,\n    [Email] [varchar](150) NULL\n) ON [PRIMARY]\n```\n\n\
  此 Person 表稍后将在我们的 .NET 解决方案中通过 ADO.NET 实体框架（.edmx 文件）使用。\n\n## 使用托管扩展框架（MEF）构建可扩展性\n\
  \n为了支持可扩展架构，我们需要构建多个扩展点，以便在需要时可以无缝地替换为不同的实现。例如，将一种缓存实现替换为另一种缓存实现。\n\n然而，这应该以最小的影响实现，即不应该需要更改代码和重新编译应用程序。理想情况下，替换应该像将现有程序集替换为新实现一样简单。\n\
  \n有几个框架有助于实现这一点，包括 Unity 框架、Structure Map、Castle Windsor 等。不过，我们决定使用托管扩展框架（MEF），它是\
  \ .NET 4 的组成部分。Visual Studio 2010 本身就在内部使用 MEF 来提供扩展性。\n\n我们选择 MEF 而不是其他框架，是因为它提供的简单性，包括以更少的代码实现所需功能、支持属性式编程的简单\
  \ API，以及无需维护任何配置文件。\n\n以下是 MEF 的三个核心概念：\n\n- **导出（Export）** 是应用程序中可以在运行时替换的潜在候选组件。它公开“契约”，而契约可以是任何东西，如\
  \ .NET 接口、类或属性。\n\n```\n[Export(typeof(ICache))]\npublic class Caching: ICache\n\
  {\n    public object Get(string cache_key)\n    {\n        //Specific caching implementation\
  \ goes here\n    }\n}\n```\n\n- **导入（Import）** 用于消费导出的实例。消费应用程序如下所示：\n\n```\n[Import()]\n\
  private ICache cache;\n```\n\n- **目录（Catalog）** 承载需要组合的组件：\n\n```\npublic static\
  \ void Compose(object o)\n{\n    var container = new CompositionContainer(\n   \
  \     new DirectoryCatalog(Path.Combine(\n            AppDomain.CurrentDomain.BaseDirectory,\n\
  \            @\"bin\\\\MEFBin\")));\n    var batch = new CompositionBatch();\n \
  \   batch.AddPart(o);\n    container.Compose(batch);\n}\n```\n\n组合在运行时将所有部分绑定在一起以交付功能。在组件层（本章稍后介绍）中，我们将更详细地了解如何实现\
  \ MEF。\n\n![](img/15a62e134135dde036b0ac3cbb01dab6_59_0.png)\n\n## 模型-视图-演示者模式\n\
  \n> 在撰写本书时，Microsoft 已经发布了模型-视图-控制器（MVC）框架（目前作为 .NET 4 的一部分，版本 2 已经可用）。我们曾讨论过是否在该版本中使用它，最终决定不使用。关于\
  \ MVC 以及我们为什么没有使用的讨论，请参阅附录 A。\n\n\n\n\n\n- 1. 加载时，视图会实例化其Presenter。然后，它通过调用Presenter中的**init**方法，将自身的引用传递给该Presenter。\n\
  - 2. 这将视图的控制权移交给Presenter。Presenter现在负责初始化页面（加载页面的初始状态）。\n- 3. Presenter与我们的领域对象（模型）协作，获取人员列表。\n\
  - 4. 随后，Presenter通过调用视图提供的适当方法，将新获取的人员列表传递给视图。\n- 5. 视图随后将人员列表附加到重复器的数据源，并要求重复器绑定该列表。\n\
  \n如果有人点击该列表中的某个人，这个过程将重复执行：通过视图向上传递至Presenter，再传递到某些领域对象，然后返回视图。\n\n## 创建 .NET 解决方案\n\
  \n到目前为止，我们已经了解了分层、MVP、MEF 和 Entity Framework 概念等。现在让我们开始实现，为此我们需要创建一个名为 Fisharoo\
  \ 的空 .NET 解决方案，在该解决方案下，我们可以开始创建以 .NET 项目形式设计的各个层次。\n\n## 表示层\n\n在 Fisharoo 解决方案中，创建一个新的\
  \ ASP.NET Web 应用程序项目，它将作为表示层。我们将其命名为 Web。项目创建完成后，您将看到如下图所示的目录结构：\n\n![](img/15a62e134135dde036b0ac3cbb01dab6_61_0.png)\n\
  \n为了获得真正的可扩展性，每个插件（Configuration、Caching、Email 等）都应放在各自独立的类库项目中，这样我们就可以替换任何一个组件，而不影响其他任何内容。不过，对于我们当前的站点来说，这对这个应用程序而言有些过度设计，因此我们决定将所有这些功能的实现都包含在一个\
  \ Components 项目中。\n\n## 配置\n\n对于配置工具，我们希望创建一些能够从配置源返回强类型项（strongly typed item）的能力。当然，这个配置源最初将是标准的\
  \ web.config。由于 web.config 仅保存字符串值，我们的配置对象将负责转换出适当的类型。\n\n```csharp\n//Fisharoo/Components/Configuration.cs\n\
  using System;\nusing System.ComponentModel.Composition;\nusing System.Configuration;\n\
  using Fisharoo.Interfaces;\n\nnamespace Fisharoo.Components\n{\n    [Export(typeof(IConfiguration))]\n\
  \    public class Configuration : IConfiguration\n    {\n        public object GetConfigurationSetting(Type\
  \ expectedType, string key)\n        {\n            string value = ConfigurationManager.AppSettings.Get(key);\n\
  \            if (value == null)\n            {\n                throw new Exception(string.Format(\"\
  AppSetting: {0} is not configured.\", key));\n            }\n\n            try\n\
  \            {\n                if (expectedType.Equals(typeof(int)))\n        \
  \        {\n                    return int.Parse(value);\n                }\n\n\
  \                if (expectedType.Equals(typeof(string)))\n                {\n \
  \                   return value;\n                }\n\n                throw new\
  \ Exception(\"Type not supported.\");\n            }\n            catch (Exception\
  \ ex)\n            {\n                throw new Exception(string.Format(\"Config\
  \ key:{0} was expected to be of type {1} but was not.\", key, expectedType), ex);\n\
  \            }\n        }\n    }\n}\n```\n\n正如您所见，从一开始我们就在类定义上方添加了 MEF 特性（Export），这样如果将来需要，我们可以轻松地将其替换为另一个实现。为了支持\
  \ MEF，我们需要添加对 System.ComponentModel.Composition 程序集的引用。\n\nConfiguration 类目前仅公开了一个方法\
  \ GetConfigurationSetting()，用于以通用方式检索应用程序配置项。它使用 ConfigurationManager 与配置文件通信，并获取由传入的键指定的字符串值。其余代码相当不言自明。我们测试检索到的值是否为\
  \ null，如果是则抛出错误。然后我们尝试通过解析为 int 或 string 来返回期望的类型。如果期望的类型既不是 int 也不是 string，那么我们将抛出一个错误，说明所请求的类型不受支持。\n\
  \n## 缓存\n\n本着可扩展性的原则，我们将构建一个实现 ICache 接口的缓存对象。我们的缓存实现将包装 System.Web.Caching 中的 HttpContext.Current.Cache\
  \ 对象。如果将来需要，我们可以用 MemCached 或 AppFabric 等替代此实现。\n\n该逻辑将涉及使用键作为引用标识缓存项，并处理从缓存中保存和检索项。缓存还将支持基于时间的缓存，一旦时间限制结束，缓存项将过期。我们还将支持从缓存中删除条目。这可以用于在缓存开始填满时为较新的条目腾出空间，或者仅用于移除应用程序不再需要的项。请参阅本书附带的代码以了解此类的实现细节。\n\
  \n## 会话\n\n会话对象是大多数 Web 应用程序中频繁使用的另一项。话虽如此，它也是我们未来可以从中挖掘性能的东西。即使性能不是问题，会话对象本身也并不是很符合最基本的面向对象编程（OOP）原则。与其试图凭空或从\
  \ HttpContext.Current.Session 中转换出一个对象，如果我们能够调用一个返回适当对象的对象，那会好得多。以下是基本实现：\n\n```csharp\n\
  //Fisharoo/Components/Session.cs\nusing System.ComponentModel.Composition;\nusing\
  \ System.Web;\nusing Fisharoo.Interfaces;\n\nnamespace Fisharoo.Components\n{\n\
  \    [Export(typeof(WebContext))]\n    public class WebContext : IWebContext\n \
  \   {\n        public void ClearSession()\n        {\n            HttpContext.Current.Session.Clear();\n\
  \        }\n\n        public bool ContainsInSession(string key)\n        {\n   \
  \         return HttpContext.Current.Session[key] != null;\n        }\n\n      \
  \  public void RemoveFromSession(string key)\n        {\n            HttpContext.Current.Session.Remove(key);\n\
  \        }\n\n        private string GetQueryStringValue(string key)\n        {\n\
  \            return HttpContext.Current.Request.QueryString.Get(key);\n        }\n\
  \n        private void SetInSession(string key, object value)\n        {\n     \
  \       if (HttpContext.Current == null || HttpContext.Current.Session == null)\n\
  \            {\n                return;\n            }\n            HttpContext.Current.Session[key]\
  \ = value;\n        }\n\n        private object GetFromSession(string key)\n   \
  \     {\n            if (HttpContext.Current == null || HttpContext.Current.Session\
  \ == null)\n            {\n                return null;\n            }\n       \
  \     return HttpContext.Current.Session[key];\n        }\n\n        private void\
  \ UpdateInSession(string key, object value)\n        {\n            HttpContext.Current.Session[key]\
  \ = value;\n        }\n    }\n}\n```\n\n我们将继续扩展此对象，使其具有一些可以处理某些繁琐工作的特定方法。假设我们将一个人员作为当前用户存储在会话中。我们可以定义一个\
  \ GetCurrentUserFromSession() 方法，它与我们的包装方法交互。它会检索用户并将该对象转换为人员类型。从面向对象编程的角度来看，这要好得多。让我们看一下包装器，为了简洁起见，我们只关注此代码中的关键或新方面。\n\
  \n让我们来看一些公共方法定义。这些方法都非常容易理解，并且主要与 HttpContext 对象协作。我们有一个 ClearSession() 方法，它只是重置会话。我们有一个\
  \ ContainsInSession() 方法，它接受一个键值。它检查该键是否存在于会话中并返回 true 或 false。RemoveFromSession()\
  \ 方法接受一个键并尝试从会话中移除该键。\n\n在我们的公共方法之后，我们有几个私有方法，即 GetQueryStringValue()、SetInSession()、GetFromSession()\
  \ 和 UpdateInSession()。在讨论这些方法之前，我们需要您理解它们为什么是私有的。我们可以将所有这些方法设为公共，它们也能正常工作。然而，将它们设为公共也意味着我们会在应用程序中散布直接与会话交互的代码。我们的偏好是扩展此对象，使其提供更具体的方法来处理这些私有方法，而这些私有方法又与会话交互。这为我们提供了关于会话交互方面的更多封装。\n\
  \n\n\n\n**GetQueryStringValue()** 方法接收一个键值，并从查询字符串中检索对应条目。**SetInSession()** 方法允许你传入一个键和一个对象，该对象随即以该键名存储在会话中。**GetFromSession()**\
  \ 方法正是如此——它接收一个键，并检索对应的对象。**UpdateInSession()** 与 **SetInSession()** 非常相似，区别在于它假定键已存在，并更新当前存储在该键下的值。如果键不存在，此方法将抛出错误。因此，在使用此方法之前，你应该检查该键是否已存在于会话集合中！\n\
  \n## 重定向\n\n从面向对象编程的角度来看，Response.Redirect 与会话对象一样有用（我们这里开始看到一种趋势了）。它只是提供了一种将你从一个地方发送到另一个地方的方式。如果我们可以通过方法来使用它，那就太好了。如果能在这些方法中按需隐藏一些逻辑，那就更好了。我们的初步实现非常简单。\n\
  \n```csharp\n//Fisharoo/Components/Redirector.cs\nusing System.ComponentModel.Composition;\n\
  using System.Web;\nusing Fisharoo.Interfaces;\n\nnamespace Fisharoo.Components\n\
  {\n    [Export(typeof(Redirector))]\n    public class Redirector : IRedirector\n\
  \    {\n        public void GoToHomePage()\n        {\n            Redirect(\"~/Default.aspx\"\
  );\n        }\n\n        public void GoToErrorPage()\n        {\n            Redirect(\"\
  ~/Error.aspx\");\n        }\n\n        private void Redirect(string path)\n    \
  \    {\n            HttpContext.Current.Response.Redirect(path);\n        }\n  \
  \  }\n}\n```\n\n这个类与其他类一样，使用 MEF，以便日后在测试时可以将其打桩（stub）。目前有两个方法——一个是示例，另一个处理重定向。让我们看看\
  \ Redirect() 方法。它接收一个路径参数，然后使用 HttpContext 对象将用户重定向到适当的位置。一个例子是 GoToHomePage() 方法。它请求\
  \ Redirect() 方法将用户发送到主页。如果应用程序的主页日后更改，我们只需编辑这一个方法即可。\n\n当然，这个类可以根据需要扩展出任意多的新方法，以用于任何目的的重定向。我们也可以将这个对象扩展得更通用一些。我们还可以在这些方法中使用重定向之前执行各种逻辑，当然这不会降低整体设计，并且在实际需要时才会这样做。\n\
  \n## 电子邮件\n\n发送电子邮件是每个网站都必须具备的能力之一。计划发送的邮件数量肯定应当决定你如何发送这些邮件。由于我们还不知道计划发送多少邮件，因此最初我们将依赖\
  \ .NET 框架提供的工具来发送邮件。为简洁起见，我们在这里只看这个类中的具体方法。\n\n与所有对象一样，我们将使用 MEF Export 属性，使其成为可插拔（Pluggable）类。这个类本身继承自我们的\
  \ IEmail 接口。我们会声明几个常量——一个用于网站接收邮件的账户，另一个用于网站发送邮件的账户。（我们可以用一个变量同时表示两者，但稍微灵活一点总没坏处！）然后我们进入第一个方法：\n\
  \n```csharp\npublic void SendEmail(string From, string Subject, string Message)\n\
  {\n    MailMessage mm = new\n    MailMessage(From,TO_EMAIL_ADDRESS);\n    mm.Subject\
  \ = Subject;\n    mm.Body = Message;\n    Send(mm);\n}\n```\n\n此方法是 SendEmail()\
  \ 方法的各种重载之一。它与其他方法略有不同，因为它用于站点向另一个站点发送邮件，而不是向用户发送。此方法的使用者需要提供发件人地址、主题和正文。此方法可用于“联系我们”页面或类似的邮件表单。在此方法的末尾，你会看到一次\
  \ Send() 方法调用。该方法会启动一个 SmtpClient，并像其他 SendEmail() 方法一样发送邮件消息。\n\n其余的 `SendEmail()`\
  \ 方法以各种方式用于站点向用户发送邮件。这些方法支持向单个用户（**收件人**、**抄送**和**密送**输入均为单个用户）或一组用户（**收件人**、**抄送**和**密送**输入为多个用户）发送邮件。`SendIndividualEmailsPerRecipient()`\
  \ 方法接受多个用户名，但为每个用户单独发送邮件。\n\n最后，我们来看所有其他方法都使用的 `Send()` 方法。这个方法负责实际发送邮件。但在该方法执行任何操作之前，我们需要在\
  \ `web.config` 的 configuration 标记之后添加以下节。它负责告诉 .NET 框架如何连接到我们的邮件服务器。\n\n```xml\n\
  <system.net>\n    <mailSettings>\n        <smtp>\n            <network host=\"localhost\"\
  \ port=\"25\"\n                     defaultCredentials=\"true\" />\n        </smtp>\n\
  \    </mailSettings>\n</system.net>\n```\n\n现在，我们可以定义最后一个方法 `Send()`，如下所示：\n\n```csharp\n\
  private void Send(MailMessage Message)\n{\n    SmtpClient smtp = new SmtpClient();\n\
  \    smtp.Send(Message);\n}\n```\n\n这个配置在发送邮件的方式上非常灵活。然而，它仍然需要网页直接负责发送邮件。这会导致页面产生大量开销，因为可能需要处理大量收件人，或者事务中涉及大量网络延迟。\n\
  \n拥有这个类的好处在于，我们可以轻松创建另一个实现 `IEmail` 接口但使用邮件队列的类，而不是要求页面发送邮件。这样，网站只需创建邮件消息并将其放入队列中，这比实际处理和发送邮件要快得多。然后，我们可以让某个地方的队列处理器负责发送我们的邮件。我们将在第\
  \ 13 章进一步讨论这一点。\n\n## 错误处理与日志记录\n\n我们认为，任何“企业应用程序”如果无法妥善处理错误并通知相关人员加以解决，就不能真正称为“企业级”。在\
  \ ASP.NET 网站中，基本上有两种形式的错误——你捕获到的错误，以及你未能捕获的错误。很简单，对吧？嗯，别急着下结论！无论你是否捕获到了错误，应用程序的用户仍然会在浏览体验中遇到某种形式的中断。因此，我们需要的不仅是为用户提供尽可能平顺的中断体验，还要修复这种中断，使其不再发生。\n\
  \n错误处理就是尽力捕获预期或可能出现的错误。同时，它也是不让难看的错误信息出现在客户面前的行为。日志记录则是捕获这些错误的详细信息，以便我们日后修复它们。\n\
  \n### 日志记录\n\n日志记录既可能过于复杂，也可能非常简单。由于我们手头没有太多时间，我们通常尽可能选择不重复造轮子！因此，在这种情况下，我们将使用 log4net\
  \ 框架，它提供了大量工具来支持各种形式的日志记录。\n\n![](img/15a62e134135dde036b0ac3cbb01dab6_70_0.png)\n\
  \n> 有关 log4net 项目的更多信息，请访问：\n> **http://logging.apache.org/log4net/**\n\n要让 log4net\
  \ 正常工作，你需要将 log4net.dll 和 log4net.xml 文件复制到 Components 项目的 bin 目录中。放置好后，添加对 log4net\
  \ 的引用。然后，你需要在 Web 项目的根目录或 bin 目录中创建一个 log4net.config 文件。\n\n![](img/15a62e134135dde036b0ac3cbb01dab6_70_1.png)\n\
  \n> 有关 log4net 配置的更多信息，请访问：**http://logging.apache.org/log4net/release/config-examples.html。**\n\
  \n现在，我们可以创建一个实现 ILogger 接口的类，帮助我们对 log4net 提供的功能进行交互。由于这是常规代码，我们在这里不再详细讨论。你可以参考本章附带的代码来了解实现。日志类完成后，我们要做的就是向日志发送一些内容。让我们回到\
  \ Global.asax.cs 文件，在 Application_Error() 方法底部添加这一行：\n\n```csharp\nLog.Error(sender,\"\
  Error caught by the Global.asax: \" + e.ToString());\n```\n\n这应该就能满足我们的日志需求了！\n\n\
  \n\n## 我们社区框架的企业级方法\n\n我们需要为处理的每个部分创建组合逻辑，例如日志（Log）、缓存（Cache）、电子邮件（Email）、配置（Configuration）、重定向器（Redirector）等。因此，为了不在代码中到处重复组合逻辑，我们将创建一个静态类来集中组合逻辑。\n\
  \n```csharp\n//Fisharoo/Common/MEFManager.cs\nusing System;\nusing System.ComponentModel.Composition;\n\
  using System.ComponentModel.Composition.Hosting;\nusing System.IO;\n\nnamespace\
  \ Fisharoo.Common\n{\n    public static class MEFManager\n    {\n        public\
  \ static void Compose(object o)\n        {\n            var container = new CompositionContainer(\n\
  \                new DirectoryCatalog(Path.Combine(\n                AppDomain.CurrentDomain.BaseDirectory,\
  \ \"bin\")));\n\n            var batch = new CompositionBatch();\n            batch.AddPart(o);\n\
  \            container.Compose(batch);\n        }\n    }\n}\n```\n\n为了从目录读取程序集，使用了\
  \ **DirectoryCatalog()** 方法。一旦找到为 **IRedirector** 提供实现的程序集，它就会被程序拾取，并通过 **container.ComposeParts()**\
  \ 组合到应用程序中。\n\n我们从 **Application_Start()** 方法中调用此组合逻辑。\n\n```csharp\nvoid Application_Start(object\
  \ sender, EventArgs e)\n{\n    // Code that runs on application startup\n    MEFManager.Compose(this);\n\
  \    log.EnsureInitialized();\n}\n```\n\n### 数据访问层\n\n为了实现上面领域驱动设计部分所讨论的领域模型，我们将使用实体框架（Entity\
  \ Framework）创建数据访问层。为此，我们需要在解决方案中添加一个新项目。我们将其命名为 DataAccess。\n\n在这个项目中，我们将创建两个类和一个\
  \ edmx 文件。第一个类是我们的连接对象（命名为 Connection.cs），第二个文件将命名为 PersonRepository.cs。创建好这些类文件后，右键单击\
  \ DataAccess 项目并选择“添加新项”来添加新的 ADO.NET 实体数据模型。在“数据”选项卡中选择“ADO.NET 实体数据模型”，如下面的截图所示：\n\
  \n![](img/15a62e134135dde036b0ac3cbb01dab6_74_0.png)\n\n我们将其命名为 Fisharoo.edmx。之后，向导将引导你完成以下解释的各种步骤。由于我们已经创建了数据库中的表，并且希望模型基于该表，因此我们将选择第一个屏幕中的**从数据库生成**，然后点击**下一步**。选择适当的连接字符串设置，然后点击**下一步**。\n\
  \n在下一个屏幕中，按如下方式从 **Tables | Person** 中选择数据库对象，并将模型命名空间命名为 **FisharooModel**，然后点击**完成**。\n\
  \n这为一些演示提供了基础框架。现在，让我们深入研究我们创建的两个类文件——**Connection.cs** 文件和 **PersonRepository.cs**\
  \ 文件。**Connection** 类为我们提供了一种封装 **DataContext** 创建的方式。它有一个方法返回 **FisharooDataContext**\
  \ 对象。如果将来有更多的数据上下文需要使用，它们也可以放在这里，我们可以将当前的 **GetContext()** 方法重命名为更有意义的名字。\n\n```csharp\n\
  //Fisharoo/DataAccess/Connection.cs\nnamespace Fisharoo.DataAccess\n{\n    public\
  \ class Connection\n    {\n        public static FisharooDataContext GetContext()\n\
  \        {\n            FisharooDataContext fdc = new FisharooDataContext(ConfigurationManager.ConnectionStrings[\"\
  FisharooConnectionString\"].ToString());\n            return fdc;\n        }\n \
  \   }\n}\n```\n\n请注意，我们正在创建一个新的 **FisharooDataContext** 类实例，并引用之前放在 **web.config**\
  \ 文件中的连接字符串。\n\n现在，让我们转向 **PersonRepository** 类。我们之前创建的 Person 表仅供演示之用，这个 repository\
  \ 也是如此。以下是该类。\n\n```csharp\n//Fisharoo/DataAccess/PersonRepository.cs\nusing System.Collections.Generic;\n\
  using System.ComponentModel.Composition;\nusing System.Linq;\nusing Fisharoo.Interfaces;\n\
  \nnamespace Fisharoo.DataAccess\n{\n    [Export(typeof(IPersonRepository))]\n  \
  \  public class PersonRepository : IPersonRepository\n    {\n        public List<string>\
  \ GetAllNames()\n        {\n            List<string> names = new List<string>();\n\
  \            FisharooDataContext dc = Connection.GetContext();\n\n            var\
  \ people = from p in dc.People\n                         select p;\n\n         \
  \   foreach (Person p in people)\n            {\n                names.Add(p.FirstName\
  \ + \" \" + p.LastName);\n            }\n\n            return names;\n        }\n\
  \    }\n}\n```\n\n请注意，它有一个 Export 属性，以便我们以后需要时可以替换实现。与所有 MEF 类一样（出于良好的设计原因），我们也继承自\
  \ IPersonRepository 接口，这清晰地定义了这个类。\n\n现在我们的 repository 中只有一个方法。它负责简单地从 Person 表中选择所有人，并返回这些人的名字和姓氏列表。我们有一个字符串类型的\
  \ names 集合列表，将在方法末尾返回。然后我们获取 DataContext 用于查询。一旦定义了 DataContext，就可以执行查询。\n\n我们使用\
  \ var 关键字声明一个局部变量。这允许我们声明动态类型的变量。在这种情况下，我们将选择 Person 类的集合。但我们并不确定！而且也不需要知道。\n\n\
  我们在代码中看到的查询是从 Person 表中选择所有人并返回这些人的集合。它非常像 SQL，但顺序相反，即 from 在前，select 在后。LINQ 查询就是这样编写的，正是由于这种顺序，Visual\
  \ Studio 智能感知才能正常工作。\n\n查询执行后，结果会被获取到 people 变量中，其类型为 ObjectSet<Person>。这帮助我们可以在循环中遍历它。当我们创建\
  \ edmx 时，实体框架会自动创建 People ObjectSet 作为 FisharooDataContext 类的一部分。\n\n最后，在代码中有一个循环，我们将每个人的名字和姓氏连接起来，并将它们添加到\
  \ names 集合中。完成后，我们简单地将该集合返回给此方法的使用者。\n\n这里给出的演示非常简单，因为我们不想让你感到困惑。你会了解 Repository\
  \ 在此应用程序中的工作方式。我们还涉及了 LINQ 的基础知识。\n\n此时，解决方案结构如下面的截图所示：\n\n![](img/15a62e134135dde036b0ac3cbb01dab6_78_0.png)\n\
  \n### 摘要\n\n在本章中，我们介绍了创建一个企业级框架来满足大多数 Web 应用程序的基本需求。我们讨论了架构分层、领域驱动设计、相关模式和最佳实践。我们还通过一些代码为将在应用程序中使用的基本框架类创建了组件。我们讨论了如何使用一些新技术和现有模式来处理数据访问。我们还了解了如何在表示层使用\
  \ MVP 模式。本章应为你提供坚实的基础，在此基础上我们现在可以开始构建应用程序。\n\n## 用户账户\n\n没有人，你的社区就不存在！\n\n任何社区网站要被认为成功，首先必须拥有一群忠实的用户。尽管还有其他衡量标准，但在大多数情况下，社区的人口越多，就被认为越成功。因此，我们应该创建一种方式让用户来到我们的站点、创建账户，并成为社区的一部分。下面的截图显示了注册页面的外观：\n\
  \n![](img/15a62e134135dde036b0ac3cbb01dab6_79_0.png)\n\n\n\n\n## 用户账户\n\n在本章中，我们将讨论许多与用户账户相关的常见功能。这将包括处理注册、认证、权限和安全。我们还将介绍一些基本工具，例如密码提醒、账户管理和\
  \ reCAPTCHA。本章将为我们的用户提供基础，在此基础上我们能够构建所有其他功能。\n\n### 问题\n\n如今大多数网站，无论其目的如何，都需要知道你的用户是谁。你需要知道这一点，以便限制用户与网站的交互方式，或者你可能需要这些信息来为用户提供动态体验。无论你的原因是什么，识别和控制用户的任务都有一些基本要求。\n\
  \n为了了解我们的用户，我们需要一种在网站上注册他们的方法。这将为我们提供该用户的足迹，以便每次用户返回时我们都可以使用。大多数情况下，注册过程相当简单，以便我们可以轻松地引入新用户。我们需要捕获我们感兴趣的数据（例如用户名、密码、电子邮件等）。我们必须确保正确存储他们的密码，这样他们的身份不仅对网站的其他用户安全，而且对网站的管理员和工作人员也是安全的。此外，考虑到当今互联网上的欺诈和垃圾邮件数量，我们需要为网站配备某种智能形式，以防备自动注册。为了进一步保护网站，我们需要确保用户向我们提供有效的信息。我们可以通过验证他们提供的电子邮件来检查它是否是他们控制下的有效账户。作为注册过程的一部分，我们还需要告知用户我们当前的条款和条件，以便他们提前了解网站的规则。\n\
  \n> 当我们提到自动注册时，我们实际上是在描述使用机器人（或程序）创建账户的行为，其唯一目的是将广告发布到公共区域，例如留言板、博客等。\n\n一旦用户成功注册，我们需要为他们提供工具，以便他们每次返回时都可以向我们表明身份。这通常通过集中式登录屏幕完成。成功认证后，我们可以通过网站跟踪该用户。知道用户经常忘记他们提供给我们的信息，我们需要提供工具，通过密码提醒功能提醒用户如何进入我们的网站。在用户认证身份后，我们需要定义用户在网站上可以去哪里以及他们可以做什么，这就需要某种基于权限的系统。\n\
  \n话虽如此，强制用户设置强密码可能会给他们带来不便。信不信由你，有很多用户更喜欢将密码设置为“password”。虽然我们不赞成让你的用户变得懒惰并将他们的账户置于风险之中，但你确实需要意识到，这个要求可能会导致你失去一些注册用户。由你来决定安全网站有多重要。\n\
  \n### 条款和条件\n\n虽然条款和条件对于好的网站来说不是必需的，但本节将介绍这个概念。我们将创建一种简单的方法来管理你的条款和条件。条款和条件是法律事务。鉴于条款和条件会随着时间而变化，跟踪你的用户最后同意的条款和条件版本非常重要。跟踪他们何时同意也很重要。\n\
  \n### reCAPTCHA\n\n**CAPTCHA，即完全自动化的公共图灵测试，用于区分计算机和人类，** 是一种挑战-响应测试形式，用于确定你的网站用户是计算机还是人类。reCAPTCHA\
  \ 是 Google 的一项 CAPTCHA 服务，帮助将书籍、报纸和旧时代广播节目数字化。\n\nreCAPTCHA 向用户展示两个单词，其中一个是 **光学字符识别（OCR）**\
  \ 过程能够从图像转换为文本的单词。另一个是 OCR 无法转换的单词。系统假设，如果用户对已知翻译的单词提供了正确答案，那么另一个未知翻译的单词也被正确翻译了。然后系统会在多个实例中重用这个新单词，以获得更高的翻译正确性信心。reCAPTCHA\
  \ 为各种编程环境提供插件，我们将使用 ASP.NET 的插件。有关更多详细信息，请查看此网站：**http://www.google.com/recaptcha**。\n\
  \n以下是我们系统生成的图像示例：\n\n![](img/15a62e134135dde036b0ac3cbb01dab6_82_0.png)\n\n### 电子邮件确认和验证\n\
  \n在我们的社区中使用电子邮件通信有几个原因。例如，我们的网站将需要注册确认和电子邮件验证。\n\n当用户在网站注册时，我们需要能够让他们知道注册已成功完成。这封电子邮件通常会欢迎用户访问网站。它还可能向用户提供一些常见问题解答、注册后获得的福利列表，以及用户在使用网站之前可能需要的任何其他相关信息。\n\
  \n除了注册回执之外，我们需要一种方法来检查用户提供的电子邮件地址是否是有效账户（它确实存在），并且用户确实有权访问。我们将通过在电子邮件中嵌入一个用户必须点击的链接来验证这一点。一旦点击此链接，我们就认为该电子邮件地址是有效的！\n\
  \n### 安全性\n\n安全性显然是构建网站最重要的方面之一。你不仅应该能够向特定用户提供对你网站特定区域的访问权限，更重要的是能够拒绝你的网站的各种用户的访问。所有网站都有需要锁定的区域。例如，最重要的区域之一可能是你网站的管理部分，或网站的付费区域。因此，确保你有某种形式的安全措施非常重要。\n\
  \n### 权限\n\n处理权限（也称为授权）的方式有很多种。我们可以通过使用权限、角色、组等实现基于权限的系统，从而使事情变得非常复杂。我们甚至可以让它变得像\
  \ Microsoft 的 Active Directory 系统一样复杂。然而，我认为保持事物仅与你当前需求一样复杂是最好的做法。随着需求的增加，我们随时可以向系统添加内容。\n\
  \n我们的权限系统将简单地包含一个名称/角色（管理员、编辑者、受限等）。然后，此权限名称将通过 .NET 提供给我们的 **Sitemap** 文件静态映射到每个页面。只要我们保持页面提供单一功能，这应该始终满足我们的需求。无论如何，这是一个好的设计实践，我们在这里不应该有任何问题。当然，一个用户可以将许多权限绑定到他们的账户上，以便他们能够浏览我们网站的不同部分。一旦就位，我们需要做的就是有一个系统，在用户进入每个页面时检查他们的权限，以确保他们拥有该页面所需的权限。\n\
  \n我们将有一个 Permissions 表，通过 AccountPermissions 表与 Accounts 表关联。这是一个相当简单直接的设计。\n\n\
  ### 密码加密/解密\n\n在处理密码时，有一个重要的问题需要回答。我们是使用单向哈希，还是存储加密密码并提供解密方法？如果我们不提供解密功能，那么我们将无法向忘记密码的用户发送提醒邮件。如果我们正在创建银行系统，通过电子邮件发送密码是不可接受的。然而，由于我们创建的内容保密性稍低，用户能够轻松找回密码而不必太过麻烦，这成为解密密码并将其发送给用户的一个很好的理由。\n\
  \n### 登录\n\n一旦用户创建了账户，能够重新向我们确认身份对他们来说很重要。因此，我们需要为他们提供一种方式。这将采用接受用户名和密码的页面的形式。一旦他们向我们完成了身份验证，我们需要确保他们仍然被允许进入我们的网站（如果他们是有效用户）。\n\
  \n### 密码提醒\n\n用户将不可避免地忘记他/她的密码。由于我们要求强密码，而且相当多的用户宁愿根本没有密码，或者希望使用“password”一词作为他们的密码，他们很可能忘记注册时使用的密码。没问题！由于我们决定使用双向加密，我们将能够解密他们选择的密码并通过电子邮件发送给他们。这样，我们的用户永远不会被锁定太长时间！\n\
  \n### 管理账户\n\n为了将客户服务电话降至最低，我们需要一种方式让客户管理自己的账户。我们的客户需要一种更新他们向我们提供的大部分信息的方法。虽然我们不会允许他们更改用户名，但我们将允许他们编辑其余信息。当我们允许他们更改电子邮件地址时，我们需要确保强制他们验证新地址。\n\
  \n\n\n\n## 解决方案\n\n现在，让我们来看看如何实现所有这些新功能。\n\n### 实现数据库\n\n我们将从实现数据库开始，然后从那里逐步深入。\n\
  \n### Accounts 表\n\nAccounts 表将存储用户的所有基本信息。其中大部分内容都很容易理解，因为它们的名称具有指示性（这是良好设计的标志）。\n\
  \n![](img/15a62e134135dde036b0ac3cbb01dab6_85_0.png)\n\n然而，有几列乍一看可能不是百分之百清楚。我们将在这里解释这些列。\n\
  \n| 列 | 描述 |\n|---|---|\n| **EmailVerified** | 这是一个位标志，用于让我们知道用户的电子邮件地址是否已经过验证。\
  \ |\n| **CreateDate** | 这是记录创建的日期。它的默认值为 GetDate()。 |\n| **LastUpdateDate** | 这与\
  \ **CreateDate** 类似，不同之处在于我们每次更新记录时都应该更新它。这可以通过触发器或编程方式完成。 |\n| **AgreedToTermsDate**\
  \ | 此列用于跟踪用户同意条款和条件的日期。 |\n\n### Permissions 表\n\nPermissions 表主要用作各种权限类型的查找表。它保存每个权限的名称以及唯一\
  \ ID。\n\n### AccountPermissions 表\n\nAccountPermissions 表允许我们在 Permissions 和 Accounts\
  \ 之间创建多对多类型的关系。它只是在关系末端保存对记录的引用。\n\n### Terms 表\n\nTerms 表是我们条款和条件的查找表。此外，它为我们提供了客户过去同意的条款的历史视图。\n\
  \n### 创建关系\n\n首先，尽管你可以在没有任何强制关系的数据库中工作，但我们不建议这样做。其次，如果你没有明确定义所有数据库约束，你可能会发现自己正在处理损坏的数据。\n\
  \n对于这组表，我们有以下表之间的关系：\n\n- Accounts 和 AccountPermissions\n- Permissions 和 AccountPermissions\n\
  - Accounts 和 Terms\n\n### 实现数据访问层\n\n现在我们已经为本章所需的所有功能定义了数据库，让我们来看看如何访问这些数据！请记住，本章不会包含我们在前面章节中讨论过的步骤，即告诉\
  \ Entity Framework 如何连接到我们的数据库，以便它可以根据我们的表结构为我们生成 Entity 类。\n\n### 从数据库更新模型\n\n\
  在第 2 章中，我们创建了 EDMX 并从数据库中添加了 Person 表。在本章中，到目前为止，我们讨论了在 SQL Server 中创建的各种表和关系。现在是时候让它们反映在我们的\
  \ EDMX 中了。这可以通过双击 Fisharoo.EDMX（你需要先在 Visual Studio 2010 中打开解决方案）来实现，它将在设计器界面中打开。右键单击设计器界面，然后选择“从数据库更新模型”。在出现的向导中（如下面的截图所示），选择需要添加的必要表。\n\
  \n![](img/15a62e134135dde036b0ac3cbb01dab6_87_0.png)\n\n单击“完成”，所选表将添加到 EDMX 设计器中，如下面的截图所示：\n\
  \n![](img/15a62e134135dde036b0ac3cbb01dab6_87_1.png)\n\n### 用户账户\n\n此时，VS 2010 将更新\
  \ Fisharoo.Designer.cs，并生成与所有选定表对应的 Entity 类。你不会在项目中看到这些类作为文件，但我们可以在类视图中看到它们。通过进入\
  \ **视图** 菜单并选择 **类视图** 打开类查看器。然后展开 **DataAccess** 项目。\n\n![](img/15a62e134135dde036b0ac3cbb01dab6_88_0.png)\n\
  \n首先，你应该会看到 Fisharoo.EDMX 设计图面上的每个表都有一个对应的类。这些是分部类，你可以通过在同一命名空间中创建另一个同名的分部类来扩展它们（我们稍后会这样做）。不要直接编辑生成的类，因为你的添加在下次生成时会丢失！\n\
  \n除了代表表的类之外，你在这里应该看到的唯一其他项是 FisharooDataContext。这个类处理你的表和类的所有 LINQ 功能。它跟踪你对对象所做的更改、可以处理哪些对象、如何查询这些对象等等。任何时候我们处理\
  \ LINQ 类或数据，我们都会通过 FisharooDataContext 类。\n\n```csharp\nselect a).FirstOrDefault();\n\
  }\nreturn account;\n}\n\npublic Account GetAccountByEmail(string Email)\n{\n   \
  \ Account account = null;\n    using (FisharooDataContext dc = conn.GetContext())\n\
  \    {\n        account = (from a in dc.Accounts\n                   where a.Email\
  \ == Email\n                   select a).FirstOrDefault();\n    }\n    return account;\n\
  }\n\npublic Account GetAccountByUsername(string Username)\n{\n    Account account\
  \ = null;\n    using (FisharooDataContext dc = conn.GetContext())\n    {\n     \
  \   account = (from a in dc.Accounts\n                   where a.Username == Username\n\
  \                   select a).FirstOrDefault();\n    }\n    return account;\n}\n\
  \npublic void AddPermission(Account account,\n                          Permission\
  \ permission)\n{\n    using (FisharooDataContext dc = conn.GetContext())\n    {\n\
  \        AccountPermission ap = new AccountPermission();\n        ap.AccountID =\
  \ account.AccountID;\n        ap.PermissionID = permission.PermissionID;\n     \
  \   dc.AccountPermissions.AddObject(ap);\n        dc.SaveChanges();\n    }\n}\n\n\
  public void SaveAccount(Account account)\n```\n\n你在这里注意到的第一件事是 MEF 的 Export() 特性和\
  \ IAccountRepository 接口。因为我们可能希望在测试期间替换此存储库，所以这些很重要。另外，不要忘记，使用 MEF 可以让我们轻松确保一旦开始使用\
  \ Repository，耦合度就会降低。这意味着从技术上讲，我们可以替换整个存储库而无需更改代码。\n\n然后在构造函数中，我们初始化 Connection\
  \ 对象，以便在 AccountRepository 类的其余部分中使用。\n\n### 选择账户\n\n一旦我们的 Connection 对象可以使用，我们就可以从通用的角度来看任何一个方法。让我们从\
  \ GetAccountByID() 方法开始。\n\n此方法用于通过 ID 检索账户。我们首先在 using 语句之外定义返回变量（本例中为 account）。然后我们在\
  \ using 语句中获取一个 FisharooDataContext，这确保我们在使用完 DataContext 后将其释放。然后我们在 using 语句中处理\
  \ LINQ 查询本身。这看起来非常像标准的 SQL SELECT 语句，但有所不同。我们必须先定义 from 语句，以便 IntelliSense 可以检查我们正在处理的集合。这允许我们像处理任何其他对象集合一样使用点语法来处理查询。然后我们定义一个\
  \ where 子句来限制返回的内容。最后，我们选择要使用的对象。\n\n然后你会注意到整个查询都包裹在圆括号中。这允许我们在结果集之上链式调用方法。在本例中，我们调用的是\
  \ FirstOrDefault() 函数。这会将我们的数据集限制为查询返回的第一条记录，如果找不到任何元素，则返回默认值。因为我们知道一个 ID 只能关联一个账户，所以这在这里应该是可以接受的！\n\
  \n> 如果不知道查询返回什么类型，我们可以使用 var 作为查询结果。\n>\n> `var account = [your LINQ query here];`\n\
  >\n> var 被称为匿名类型。LINQ 大量使用它。使用匿名类型的注意事项是它只能在本地使用。因此，如果你打算在检索对象的作用域之外使用查询到的对象，你将必须进行某种形式的强制转换、循环或其他操作，以使它们脱离匿名状态。\n\
  \nGetAccountByEmail() 和 GetAccountByUsername() 方法在功能上几乎相同。因此我们不会详细解释它们。\n\n\n\n\n\
  \n## 用户账户\n\n### 保存账户\n\n现在我们已经有了以各种方式从数据库中选出 Account 对象的方法，接下来需要考虑如何将数据放入数据库。这让我们想到了\
  \ SaveAccount() 方法。我们本可以从这一个方法中拆出两个方法——Insert() 和 Update()。但两者之间只差一行代码，因此我们选择将这两个方法合并，并用\
  \ SaveAccount() 方法替代。\n\n正如你将看到的，在我们所有 Repository 方法中，我们都在 using 语句中获取 FisharooDataContext。这让我们的清理工作自动完成！（严格来说是这样！）一旦有了可用的\
  \ DataContext，我们就会检查传入的对象，看它是否已有 AccountID。如果对象已有 AccountID，它就不可能是新对象。如果没有 AccountID，那它一定是新对象。\n\
  \n处理新对象很容易。我们只需调用 dc.Accounts.AddObject() 方法，然后调用 dc.SaveChanges()。这会告诉 DataContext\
  \ 需要将所有更改过的数据持久化到数据库中——在我们的场景中，就是保存这条新的 Account 记录。\n\n我们的代码让更新数据看起来几乎和插入新数据一样简单。不过，在更新时，我们首先要通过给接收到的\
  \ Account 对象赋予 AccountId 来创建一个临时的 Account 对象，然后再应用值。这是通过告诉 DataContext：传入的这个对象是当前原始对象的修改版来实现的。最后我们仍然需要调用\
  \ dc.SaveChanges()。\n\n### 删除账户\n\n既然我们有办法向系统中添加账户，自然也想知道如何删除账户，这通过 DeleteAccount()\
  \ 方法来完成。\n\n我们认为从 DataContext 中删除对象是最简单的事情之一！只需定位你想从中删除对象的集合，将要删除的对象传给 DeleteObject()\
  \ 方法，然后调用 dc.SaveChanges()。没有比这更简单的了！\n\n### 向账户添加权限\n\n难道不应该把添加权限的操作放在 Permission\
  \ 仓储或其他什么地方吗？不，并非如此。实际上，我们并不是真正地添加权限。我们是在非实体表 AccountPermissions 中创建一条记录，将 Permission\
  \ 链接到 Account。回想一下，我们曾经说过，为了尽可能坚持 DDD，我们不会创建非实体仓储。这样，我们只能在 Permissions 仓储或 Accounts\
  \ 仓储中添加账户权限。把添加权限的操作放在 Accounts 仓储中对我们来说更合理！\n\n代码也非常简单，正如你在 AddPermission() 方法中所看到的（你会发现这句话会反复出现！）。\n\
  \n```csharp\npublic void AddPermission(Account account, Permission permission)\n\
  {\n    using(FisharooDataContext dc = conn.GetContext())\n    {\n        AccountPermission\
  \ ap = new AccountPermission();\n        ap.AccountID = account.AccountID;\n   \
  \     ap.PermissionID = permission.PermissionID;\n        dc.AccountPermissions.AddObject(ap);\n\
  \        dc.SaveChanges();\n    }\n}\n```\n\n这个方法只是简单地将 Account 对象与 Permission 对象关联起来。为此，它期望传入一个\
  \ Account 对象和一个 Permission 对象。然后它创建一个新的 AccountPermission 对象，并根据传入的对象给 AccountID\
  \ 和 PermissionID 属性赋值。随后将这个新的 AccountPermission 对象插入到 DataContext 的 AccountPermissions\
  \ 集合中。最后，调用 SaveChanges() 方法。\n\n如果你回顾一下我们对 DDD 的讨论（见附录），实体对象足够重要，需要用唯一 ID 进行重新创建和跟踪。值对象则没那么重要，没有父实体对象就无法（也不应该）存在。在本例中，值对象\
  \ AccountPermission 可以以 Permission 或 Account 作为父对象存在。虽然这种说法没错，但整体设计可以进一步简化，即：Account\
  \ 可以拥有 AccountPermission，而 Permission 不能拥有。这样，当对象只有一个入口进入系统时，跟踪起来会更容易。\n\n话说回来，我们可以设想这样一种场景：我们可能需要说：“对于这个权限，显示所有相关的账户”。这在管理控制台中可能很有用。我们会在讲到那里时看到。我们同样可以轻松地执行一个查询：“显示所有拥有此权限的账户”。\n\
  \n### 其他仓储\n\n现在我们已经比较详细地看了 AccountRepository，接下来将快速介绍其余的仓储。我们会零零星星地讨论一些有趣的点，但大多数情况下，一旦你看过了一个仓储，你就已经看过了所有仓储！\n\
  \n```csharp\nvar permissions = from p in dc.Permissions.Where(\n    p=>p.Name.Equals(Name))\n\
  select p;\nreturn permissions.ToList();\n}\n}\n```\n\n与标准查询相比，Lambda 表达式的主要优势是类型推断、简洁性以及更高的代码可读性。\n\
  \n> Lambda 表达式由 lambda 运算符“=>”（读作“goes to”）组成，其左侧表示输入参数（如果有多个输入参数，请用逗号分隔），右侧表示要求值的表达式或语句块。编译器会根据参数的使用情况自动执行类型推断。\n\
  \n### 条款仓储\n\n在 TermRepository 的 GetCurrentTerm() 方法中，新增了一个 LINQ 查询语句项。\n\n```csharp\n\
  //Fisharoo/DataAccess/TermRepository.cs\npublic Term GetCurrentTerm()\n{\n    using\
  \ (FisharooDataContext dc = conn.GetContext())\n    {\n        Term term = (from\
  \ t in dc.Terms\n                     orderby t.CreateDate descending\n        \
  \             select t).FirstOrDefault();\n        return term;\n    }\n}\n```\n\
  \n在这里，你会看到我们引入了一个 orderby 子句以及一个 descending 关键字。这让我们能够取出所有已创建的条款，并将最近的条款放在最前面。\n\
  \n## 实现应用层\n\n这一层可以称为应用层、业务逻辑层、组件层或服务层。在我们的代码中，我们将其称为**组件**。它们都是同一个东西。这一层应当相对轻薄。它不应该包含任何业务逻辑或数据访问逻辑。它更多是一个工作层，负责让业务层使用起来更简单、更干净。通常，它会将业务层的若干项与数据层的若干方法组合起来，为一个复杂任务提供易于使用的接口。\n\
  \n其中一个例子就是我们的 AccountService。AccountService 提供了一些简单的方法，这些方法使用了好几个更偏基础结构的类。代码如下：\n\
  \n```csharp\n//Fisharoo/Components/AccountService.cs\nnamespace Fisharoo.Components\n\
  {\n    [Export(typeof(IAccountService))]\n    public class AccountService : IAccountService\n\
  \    {\n        [Import]\n        private IAccountRepository _accountRepository;\n\
  \        [Import]\n        private IPermissionRepository _permissionRepository;\n\
  \        [Import]\n        private IUserSession _userSession;\n        [Import]\n\
  \        private IRedirector _redirector;\n        [Import]\n        private IEmail\
  \ _email;\n        public AccountService()\n        {\n            MEFManager.Compose(this);\n\
  \        }\n        public bool UsernameInUse(string Username)\n        {\n    \
  \        Account account =\n                _accountRepository.GetAccountByUsername(Username);\n\
  \            if(account != null)\n                return true;\n            return\
  \ false;\n        }\n        public bool EmailInUse(string Email)\n        {\n \
  \           Account account =\n                _accountRepository.GetAccountByEmail(Email);\n\
  \            if (account != null)\n                return true;\n            return\
  \ false;\n        }\n        public void Logout()\n        {\n            _userSession.LoggedIn\
  \ = false;\n            _userSession.CurrentUser = null;\n            _userSession.Username\
  \ = \"\";\n            _redirector.GoToAccountLoginPage();\n        }\n        public\
  \ string Login(string Username, string Password)\n        {\n            Password\
  \ = Password.Encrypt(Username);\n            Account account =\n               \
  \ _accountRepository.GetAccountByUsername(Username);\n\n            //if there is\
  \ only one account returned - good\n            if(account != null)\n          \
  \  {\n                //password matches\n                if(account.Password ==\
  \ Password)\n                {\n                    if (account.EmailVerified)\n\
  \                    {\n                        _userSession.LoggedIn = true;\n\
  \                        _userSession.Username = Username;\n                   \
  \     _userSession.CurrentUser =\n                            GetAccountByID(account.AccountID);\n\
  \                        _redirector.GoToHomePage();\n                    }\n  \
  \                  else\n                    {\n                        _email.SendEmailAddressVerificationEmail(\n\
  \                            account.Username, account.Email);\n               \
  \         return @\"The login information you provided\nwas correct\nbut your email\
  \ address has not yet\nbeen verified.\nWe just sent another email\nverification\
  \ email to you.\";\n                    }\n                }\n            }\n  \
  \      }\n    }\n}\n```\n\n\n\n> 密码学是一门内容广泛的学科，超出了本书的范畴。不过，如果你想把 `System.Security.Cryptography.Rijndael`\
  \ 理解得更透彻一些，本项目中所包含的 Cryptography 类带有详尽的注释！你可以在 **Common** 项目中找到这个类。\n\n首先，让我们来看看我们是如何能够从一个\
  \ **string** 变量调用 `Encrypt()` 的。要实现这一点其实非常简单。尽管 **string** 类是密封的，意味着我们无法按常规方式对其进行扩展，但我们可以使用\
  \ .NET 中名为“扩展方法”的特性。\n\n```csharp\n//Fisharoo/Common/Extensions.cs\nnamespace Fisharoo.Common\n\
  {\n    public static class Extensions\n    {\n        public static string Encrypt(this\
  \ string s, string key)\n        {\n            return Cryptography.Encrypt(s, key);\n\
  \        }\n        public static string Decrypt(this string s, string key)\n  \
  \      {\n            return Cryptography.Decrypt(s, key);\n        }\n    }\n}\n\
  ```\n\n扩展方法允许我们在不影响类正常工作方式的前提下扩展一个类。实现方式是在一个静态类中定义一个静态方法。需要注意的一点是，该方法的第一个参数以目标类型开头，在这里就是\
  \ **string**。因此，我们实际上为 **string** 类定义了一个 `Encrypt()` 和 `Decrypt()` 方法。请注意，这个方法与你平时编写的方法之间唯一的区别，就是第一个参数前面的\
  \ **this** 引用。就是这么简单！\n\n## 实现领域层\n\n由于我们使用的是 Entity Framework，它拥有一些现在已经属于 .NET\
  \ 框架一部分的功能；我们的业务层因此被大大简化了。我们可以回想一下，在之前的应用程序中，我们使用了各种不同的数据访问层，这要求我们花费大量时间在数据库中编写\
  \ SQL、连接逻辑、提供程序，以及对象的实例化和持久化逻辑。除此之外，我们还需要定义业务对象。在这些对象中，有 95% 的逻辑仅仅是为了以更易于管理的方式传输数据。\n\
  \n有了 Entity Framework，这些繁琐的工作大多都消失了！我们现在有了完全生成的类来负责传输数据。但如果我们还需要自定义逻辑该怎么办呢？虽然我们可以简单地将逻辑添加到生成的类中，但这并不是最佳途径。下次我们做修改时，就必须重新生成类。这会导致所有自定义功能丢失。\n\
  \n幸运的是，生成的类是分部类。这意味着我们可以在同一个命名空间中创建一个同名的新分部类文件，从而扩展我们生成的类。下面是我们自定义的 Account 对象，它扩展了生成的\
  \ Account 对象。\n\n```csharp\n//Fisharoo/DataAccess/Account.cs\nnamespace Fisharoo.DataAccess\n\
  {\n    public partial class Account\n    {\n        private List<Permission> _permissions\
  \ = new List<Permission>();\n        public List<Permission> Permissions\n     \
  \   {\n            get { return _permissions; }\n        }\n\n        public void\
  \ AddPermission(Permission permission)\n        {\n            _permissions.Add(permission);\n\
  \        }\n\n        public bool HasPermission(string Name)\n        {\n      \
  \      foreach (Permission p in _permissions)\n            {\n                if\
  \ (p.Name == Name)\n                    return true;\n            }\n          \
  \  return false;\n        }\n    }\n}\n```\n\n借助这个新的分部类，我们现在就可以扩展现有的已生成 Account\
  \ 类。我们为 Account 类添加了一些重要功能。现在我们有了添加和检查权限的方法。我们还有一个返回权限列表的属性。\n\n这可以轻松地应用于我们项目中的任何分部类！\n\
  \n视图通过定义视图的接口将自身的引用传递给 presenter。使用接口为我们提供了一种解耦的结构。这就允许我们在需要时轻松地替换 UI。只要 UI 恰当地实现了该接口，它就可以使用\
  \ presenter。\n\n在这个场景中，presenter 扮演着控制器的角色。一旦它被启动并拥有了对 code-behind 的引用，它就能主动决定如何处理前端的事件。presenter\
  \ 也是我们前端中唯一能够与领域逻辑（即模型）交互的部分。\n\n在接下来的小节中，我们将讨论登录过程。这更多是为了说明 MVP 模式的运作方式，而不是关于 ASP.NET\
  \ 本身，因为代码本身非常简单。\n\n> 我们在创建 ASP.NET 4 应用程序（第 2 章）时创建了一个 **Account** 文件夹。它添加了与登录、用户注册、更改密码等相关的基文件，以及使用\
  \ ASP.NET 成员资格服务的代码。但是，由于我们希望为身份验证和授权编写自定义逻辑，我们删除了这个文件夹中的所有文件，并按照后面小节中讨论的方式编写了自定义逻辑。\n\
  \n## 视图\n\n我们将从 ASP.NET 前端代码开始。它基本上定义了一个用户名和密码文本框，以及一个用于登录的按钮。它还有两个用于简单导航任务的链接按钮——一个用于转到密码恢复页面，另一个用于带你到注册页面。\n\
  \n```aspx\n//Fisharoo/Web/Account/Login.aspx\n<%@ Page Language=\"C#\" MasterPageFile=\"\
  ~/Site.Master\"\nAutoEventWireup=\"true\" CodeBehind=\"Login.aspx.cs\"\nInherits=\"\
  Fisharoo.Web.Account.Login\" %>\n\n<asp:Content ContentPlaceHolderID=\"Content\"\
  \ runat=\"server\">\n    <div class=\"divContainer\">\n        <div class=\"divContainerBox\"\
  >\n            <fieldset class=\"login\">\n                <legend>Enter your Username\
  \ and Password</legend>\n                <asp:Table CssClass=\"tableLogin\" runat=\"\
  server\">\n                    <asp:TableRow>\n                        <asp:TableCell\
  \ HorizontalAlign=\"Left\">\n                            <asp:Panel ID=\"Panel1\"\
  \nDefaultButton=\"btnLogin\" runat=\"server\">\n                               \
  \ <p>\n                                    <asp:Label ID=\"UserNameLabel\"\n```\n\
  \n## 用户账户\n\n你会在上面注意到，在 Page_Load() 中我们初始化了 presenter。一旦我们启动了 presenter，我们立即通过 _presenter.Init(this)\
  \ 方法调用将 code-behind 的引用传递给 presenter。你还应该注意到，code-behind 捕获了一个按钮点击事件。但这个方法所做的只是通知\
  \ presenter 需要执行 Login() 方法，并传递原始的 username 和 password 值。最后，请注意 code-behind 确实通过其\
  \ DisplayMessage() 方法实现了该接口。由于 presenter 可以访问 code-behind 类，它就能根据需要调用任何公共方法。\n\n\
  另一个需要注意的方面是，当你开始编写代码时，Visual Studio 会在文件顶部添加许多 using 语句。Visual Studio 2010 的重构支持提供了删除未使用\
  \ using 语句的功能。你可能会想尝试一下，以保持代码的组织性。\n\n![](img/15a62e134135dde036b0ac3cbb01dab6_106_0.png)\n\
  \n我们这样做了，最终只剩下了三条 using 语句，而之前有十四条。\n\n## Presenter\n\n以下是 presenter 代码：\n\n```csharp\n\
  //Fisharoo/Web/Account/Presenters/LoginPresenter.cs\nnamespace Fisharoo.Web.Account.Presenters\n\
  {\n    public class LoginPresenter\n    {\n        private ILogin _view;\n     \
  \   [Import]\n        private IAccountService _accountService;\n        [Import]\n\
  \        private IRedirector _redirector;\n        public void Init(ILogin view)\n\
  \        {\n            _view = view;\n            MEFManager.Compose(this);\n \
  \       }\n        public void Login(string username, string password)\n       \
  \ {\n            string message = _accountService.Login(username,\n            \
  \                                        password);\n            _view.DisplayMessage(message);\n\
  \        }\n        public void GoToRegister()\n        {\n            _redirector.GoToAccountRegisterPage();\n\
  \        }\n        public void GoToRecoverPassword()\n        {\n            _redirector.GoToAccountRecoverPasswordPage();\n\
  \        }\n    }\n}\n```\n\n请注意，在 **Init()** 方法中，presenter 使用 MEF 框架来设置它完成工作所需的对象。如果页面需要在初始加载时显示数据，就是在这里实现的。除了\
  \ presenter 的初始化之外，你还会注意到 presenter 还有其他三个方法：Login()、GoToRegister() 和 GoToRecoverPassword()。\n\
  \nLogin() 方法处理 **View** 传递给它的按钮点击事件。请注意，即使在这里，我们也没有太多需要管理的逻辑。Presenter 会迅速将用户登录的职责转交给前面讨论过的\
  \ AccountService 对象。它只是期望从 AccountService 得到一个友好的消息，来描述登录过程进行得如何。我们知道，如果它收到了消息，那就意味着登录失败；否则\
  \ AccountService 会适当地重定向用户。一旦登录完成，presenter 就会使用视图的 DisplayMessage() 方法将状态告知用户。\n\
  \nGoToRegister() 和 GoToRecoverPassword() 方法只是利用 Redirector 对象将用户发送到站点上相应的页面。虽然这看起来可能有些极端，但请记住，它遵循了良好的设计原则。如果你在整个站点中遵循这一点，你将获得以下三个好处：\n\
  \n1.  你可以轻松地替换 UI，并以最小的努力获得相同的结果。\n2.  由于你的重定向代码集中在一个地方，当多个链接使用相同的方法重定向到某个位置时，你可以在这个地方更改重定向，从而影响整个站点的所有链接。\n\
  3.  这有助于提高你站点的可测试性！\n\n\n\n\n\n## 用户账户\n\n以下是新增的Redirector方法：\n\n```csharp\n//Fisharoo/Components/Redirector.cs\n\
  ...\n    public void GoToAccountRegisterPage()\n    {\n        Redirect(\"~/Account/Register.aspx\"\
  );\n    }\n...\n    public void GoToAccountRecoverPasswordPage()\n    {\n      \
  \  Redirect(\"~/Account/RecoverPassword.aspx\");\n    }\n...\n```\n\n> 我们希望你已经注意到，由于每个文件都只负责一组非常具体的任务，每个文件也短小而精悍。虽然这是一种复杂的思考方式，但使用起来非常愉快！\n\
  \n### 注册页面\n\n我们承认，使用标准的.NET控件创建账户要简单得多！话虽如此，为这个网站创建注册页面还是相当有趣的。我们最终使用了向导控件来展示注册过程的各个步骤，并使用了它的现成格式。我们的步骤如下（由于ASPX代码占用了大量空间，我们使用了屏幕截图来代替。有关代码，请参阅本章配套代码）：\n\
  \n1. 我们总是先获取用户的电子邮件、用户名和密码。所有这些都有相应的验证。我们希望验证他们的电子邮件地址的真实性。我们还希望确保他们的用户名符合一定的长度规则。然后我们允许他们输入密码，并要求他们重新输入密码以确认他们输入的是他们想要输入的。当然，所有这些字段都是必填的！\n\
  \n    ![](img/15a62e134135dde036b0ac3cbb01dab6_108_0.png)\n\n2. 下一步是获取一些用户的描述性信息，如名字和姓氏。在构建任何类型的社区网站时，通常还需要收集他们的生日和邮政编码或邮编。这让你知道什么适合他们，以及他们身处世界的哪个角落。这里有验证，以确保他们输入的出生日期是有效日期（MM/DD/YYYY格式），并且邮编是美国有效格式。虽然我们只验证了美国邮编，但在社区网站中，你需要根据不同的国家验证不同的格式。所有这些字段也都是必填的。\n\
  \n    ![](img/15a62e134135dde036b0ac3cbb01dab6_109_0.png)\n\n3. 第三步显示条款和条件。这一步需要你获取一些数据来展示。这些数据从`TermRepository.GetCurrentTerm()`（我们之前介绍过）中检索。用户在这里需要做的就是阅读条款（当然，大多数用户不会阅读！）并勾选表示同意条款的复选框（我们默认已勾选）。\n\
  \n    ![](img/15a62e134135dde036b0ac3cbb01dab6_109_1.png)\n\n```csharp\n{\n    recaptcha.SkipRecaptcha\
  \ = value;\n}\n\n- - - -\n\n}\n}\n```\n\nreCAPTCHA验证与页面验证集成在一起，因此如果Page.IsValid返回true，我们就知道reCAPTCHA验证已成功。另请注意，要使用reCAPTCHA，我们需要在ASPX页面中添加一个新的register指令：\n\
  \n```aspx\n<%@ Register TagPrefix=\"recaptcha\" Namespace=\"Recaptcha\" Assembly=\"\
  Recaptcha\" %>\n```\n\n在开发过程中，我们不希望一直看到reCAPTCHA验证屏幕。为避免这种情况，我们将控件上的SkipRecaptcha属性设置为false（针对调试配置）。这使得reCAPTCHA控件在验证时始终返回true。我们希望控件在最终部署时能正常工作，因此我们为此使用了web.release.config文件。该文件中相关的标记是：\n\
  \n```xml\n//Fisharoo/Web/Web.Release.Config\n<appSettings>\n    <add key=\"reCaptcha\"\
  \ value=\"false\" xdt:Transform=\"Replace\"\n    xdt:Locator=\"Match(key)\" />\n\
  </appSettings>\n```\n\n> 我们在之前的章节中简要提到过多个配置文件。这是Visual Studio 2010中ASP.NET 4应用程序的一个新功能。适当的构建任务会负责将相应配置文件中的值替换为主配置文件中的值。要了解更多信息，请阅读此处：**http://msdn.microsoft.com/en-us/library/dd465326.aspx.**\n\
  \n现在我们来谈谈这个页面的核心内容。一旦我们收集了所有数据，就需要处理它们。接下来是展示器（这么说很有趣！）。我们还将只关注代码中的Register()方法，因为大部分操作都在那里进行。\n\
  \n```csharp\n//Fisharoo/Web/Account/Presenters/RegisterPresenter.cs\nnamespace Fisharoo.Web.Account.Presenters\n\
  {\n    public class RegisterPresenter\n    {\n        - - -\n\n        public void\
  \ Register(string Username, string Password,\n            string FirstName, string\
  \ LastName, string Email,\n            string Zip, DateTime BirthDate, bool isCaptchaValid,\n\
  \            bool AgreesWithTerms, Int32 TermID)\n        {\n            if (AgreesWithTerms)\n\
  \            {\n                if (isCaptchaValid)\n                {\n       \
  \             Fisharoo.DataAccess.Account acc = new Fisharoo.DataAccess.Account();\n\
  \                    acc.FirstName = FirstName;\n                    acc.LastName\
  \ = LastName;\n                    acc.Email = Email;\n                    acc.BirthDate\
  \ = BirthDate;\n                    acc.Zip = Zip;\n                    acc.Username\
  \ = Username;\n                    acc.Password = Password.Encrypt(Password);\n\
  \                    acc.TermID = TermID;\n                    //TODO: For development\
  \ marked as verified already\n                    acc.EmailVerified = true;\n\n\
  \                    if (_accountService.EmailInUse(Email))\n                  \
  \  {\n                        _view.ShowErrorMessage(\"This email is already in\
  \ use!\");\n                        _view.ToggleWizardIndex(0);\n              \
  \      }\n                    else if (_accountService.UsernameInUse(Username))\n\
  \                    {\n                        _view.ShowErrorMessage(\"This username\
  \ is already in use!\");\n                        _view.ToggleWizardIndex(0);\n\
  \                    }\n```\n\n这里比较有意思的新内容是Email对象的提及。你可能还记得我们之前构建Email对象时的情景。它为我们提供了以各种方式发送电子邮件的功能。我们在这里所做的是扩展Email对象，使其也封装系统发送的消息。以下是Email对象的新代码，允许我们发送电子邮件来验证电子邮件地址的有效性和所有权。\n\
  \n```csharp\n//Fisharoo/Components/Email.cs\npublic void SendEmailAddressVerificationEmail(string\
  \ Username, string To)\n{\n    MEFManager.Compose(this);\n    string rootURL = _configuration.GetConfigurationSetting(\n\
  \        typeof(string), \"RootURL\").ToString();\n    string encryptedName = Cryptography.Encrypt(Username,\
  \ \"verify\");\n\n    string msg = \"Please click on the link below or paste it\
  \ into a browser to verify your email account.<BR><BR>\" +\n                 \"\
  <a href=\\\"\" + rootURL + \"Account/VerifyEmail.aspx?a=\" +\n                 encryptedName\
  \ + \"\\\">\" +\n                 rootURL + \"Account/VerifyEmail.aspx?a=\" +\n\
  \                 encryptedName + \"</a>\";\n\n    SendEmail(To, \"\", \"Account\
  \ created! Email verification required.\", msg);\n}\n```\n\n还要注意这里嵌入的链接使用“verify”作为盐值对注册者的用户名进行加密。这样，在他们收到电子邮件并点击链接返回我们的网站后，我们就能知道正在处理的是谁（更多内容将在下一节介绍）。\n\
  \n在向导的分步环境中，很容易像这样呈现小块数据，而无需太多编码开销。虽然它不如.NET成员控件那么容易，但我们认为它更加灵活。此外，我们现在可以轻松测试整个流程。\n\
  \n### 电子邮件验证\n\n我们在上一节中简要提到了这个主题。基本上，注册过程会触发向新注册用户发送一封电子邮件，要求他们验证其电子邮件地址。这个过程通常会将电子邮件发送到用户在注册时提供的电子邮件地址。如果用户能收到邮件，我们就知道该电子邮件地址是有效的。如果他们能点击邮件中嵌入的链接，我们就知道他们也能访问该电子邮件。这并不一定意味着他们拥有该账户，但我们无法真正验证这一点，因此也无法真正担心它。\n\
  \n\n\n\n## 用户账户\n\n上面我们没有涉及到的内容，是接收电子邮件中链接点击的页面。这一系列代码相对简单。因此，首先我们将按使用顺序列出所有文件（设计、代码隐藏和\
  \ Presenter），然后再讨论它。\n\n```aspx\n//Fisharoo/Web/Account/VerifyEmail.aspx\n<%@ Page\
  \ Language=\"C#\" MasterPageFile=\"~/Site.Master\"\nAutoEventWireup=\"true\" CodeBehind=\"\
  VerifyEmail.aspx.cs\"\nInherits=\"Fisharoo.Web.Account.VerifyEmail\" %>\n<asp:Content\
  \ ContentPlaceHolderID=\"Content\" runat=\"server\">\n    <asp:Label ID=\"lblMsg\"\
  \ runat=\"server\" ForeColor=\"Red\"></asp:Label>\n</asp:Content>\n```\n\n```csharp\n\
  //Fisharoo/Web/Account/VerifyEmail.aspx.cs\nnamespace Fisharoo.Web.Account\n{\n\
  \    public partial class VerifyEmail : System.Web.UI.Page,\n                  \
  \                    IVerifyEmail\n    {\n        private VerifyEmailPresenter _presenter;\n\
