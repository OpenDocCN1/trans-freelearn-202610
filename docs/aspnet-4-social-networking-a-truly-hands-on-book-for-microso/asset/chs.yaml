  SiteButton\" Style=\"font-size: 9px; padding-left: 1px; padding-right: 1px;\"\n\
  \            ID=\"btnAddStatus\" runat=\"server\" Text=\"Add\"\n            OnClick=\"\
  btnAddStatus_Click\" /><br />\n        <asp:Repeater runat=\"server\" ID=\"repStatus\"\
  >\n            <ItemTemplate>\n                <asp:Label ID=\"Label1\" Text='<%#\
