  \      new Guid(_webContext.FriendshipRequest), newAccount,\n        false);\n \
  \   }\n    ...\n}\n```\n\n## Show friends\n\n现在我们已经拥有邀请和接受好友所需的一切，我们需要能够查看我们的好友。为此，我们将在我们的\
  \ Friends 部分着陆页 Default.aspx 中添加我们所有好友的列表。这实际上会非常容易，因为我们将使用我们在搜索页面中创建的 ProfileDisplay\
