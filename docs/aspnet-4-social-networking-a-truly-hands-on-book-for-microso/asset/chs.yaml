  \n### 上传头像\n\n此功能的几乎所有工作都发生在 Presenter 中。UI 提供一个文件上传框，带有一个标准的浏览按钮和一个用于提交所选文件的附加按钮。当点击“提交”按钮时，视图会将\
  \ PostedFile 传递给 Presenter 的 UploadFile() 方法。\n\n```csharp\n//Fisharoo/Web/Profiles/Presenters/UploadAvatarPresenter.cs\n\
  public void UploadFile(HttpPostedFile File)\n{\n    string extension = Path.GetExtension(File.FileName).ToLower();\n\
  \    string mimetype;\n    byte[] uploadedImage = new byte[File.InputStream.Length];\n\
  \    switch (extension)\n    {\n        case \".png\":\n        case \".jpg\":\n\
  \        case \".gif\":\n            mimetype = File.ContentType;\n            break;\n\
  \        default:\n            _view.ShowMessage(\"We only accept .png, .jpg, and\
  \ .gif!\");\n            return;\n            break;\n    }\n    if (File.ContentLength\
  \ / 1000 < 1000)\n    {\n        File.InputStream.Read(uploadedImage, 0, uploadedImage.Length);\n\
  \        profile.Avatar = uploadedImage;\n        profile.AvatarMimeType = mimetype;\n\
  \        profile.UseGravatar = 0;\n        _profileRepository.SaveProfile(profile);\n\
  \        _view.ShowCropPanel();\n    }\n    else\n    {\n        _view.ShowMessage(\"\
  The file you uploaded is larger than the 1mb limit. Please reduce the size of your\
  \ file and try again.\");\n    }\n}\n```\n\n此方法负责接收文件并对文件执行一些基本检查。我们首先获取上传文件的扩展名，并检查确保上传的文件是我们支持的图像格式。如果不是，我们会显示一条消息说明问题。\n\
  \n通过该项检查后，我们检查以确保文件大小不太大。如果文件大小可接受，我们将文件读取到 uploadedImage 字节数组中。然后，我们将字节数组连同其 MIME\
  \ 类型一起传递给当前个人资料的 Avatar 属性（我们还将 UseGravatar 标志设置为 0，稍后将讨论）。最后，我们将此数据保存到用户的个人资料中，并更新显示以显示裁剪\
  \ UI。如果文件太大，则显示错误消息。\n\n### 图像处理\n\n首先，这个图像裁剪工具的完整 UI 位于：http://www.defusion.org.uk/code/javascript-image-cropper-ui-using-prototype-scriptaculous/。这是一个开源的\
  \ JavaScript 工具，为我们提供了所有可以拖拽和调整大小的华丽界面选项。它使用了 prototype (http://www.prototypejs.org/)、scriptaculous\
  \ (http://script.aculo.us/) 以及 Dave Spurr 的一些巧妙技巧。要实现此脚本，请从上述 defusion 网站下载源代码，并在\
  \ UploadAvatar.aspx 中引用 prototype、scriptaculous 和 cropper 文件。\n\n```\n//Fisharoo/Web/Profiles/UpdateAvatar.aspx\n\
  <script type=\"text/javascript\" src=\"/js/cropper/lib/prototype.js\" language=\"\
  javascript\"></script>\n<script type=\"text/javascript\" src=\"/js/cropper/lib/scriptaculous.js?load=builder,dragdrop\"\
  \ language=\"javascript\"></script>\n<script type=\"text/javascript\" src=\"/js/cropper/cropper.js\"\
  \ language=\"javascript\"></script>\n```\n\n一旦你插入了 JavaScript 部分，就需要在 ASPX 页面中添加一些元素，才能让这个控件工厂正常工作。首先，我们需要添加一个图像控件，用来加载我们要操作的图像。\n\
  \n```\n<asp:Image ImageUrl=\"~/images/ProfileAvatar/ProfileImage.aspx\" id=\"imgCropImage\"\
  \ runat=\"server\"/>\n```\n\n> 请注意，此 Image 控件的 ImageUrl 引用的是一个页面而不是一张图片。images/ProfileAvatar/ProfileImage.aspx\
  \ 页面会根据用户个人资料的当前配置显示其头像。如果用户没有头像，则显示默认头像。如果决定改用 Gravatar 服务（稍后讨论），则显示存储在 Gravatar\
  \ 上的头像。\n\n这是可选的，但裁剪脚本会为我们提供当前操作的预览。要实现这一点，我们需要一个以 div 标签形式输出预览的位置。\n\n```html\n\
  <div id=\"previewWrap\"></div>\n```\n\n然后，我们需要添加一个 JavaScript 函数，将裁剪脚本挂接到我们的 UI\
  \ 上。此脚本设置了一些基本属性，例如图像的 ID 是什么、预览输出存放在哪里、最小高度和宽度、固定比例（在我们的例子中强制裁剪器为正方形）以及裁剪完成时要执行的操作。另请注意，图像控件的名称（Content_imgCropImage）与您在早期版本的\
  \ ASP.NET 中所见到的名称不同。对于 ASP.NET 4，控件名称更简单，不再使用 ctl00 前缀。\n\n```javascript\n<script\
  \ type=\"text/javascript\" language=\"javascript\">\n    Event.observe(window, 'load',\
  \ function() {\n        new Cropper.ImgWithPreview(\n            'Content_imgCropImage',\n\
  \            {\n                previewWrap: 'previewWrap',\n                minWidth:\
  \ 100,\n                minHeight: 100,\n                ratioDim: {x: 100,y: 100},\n\
  \                displayOnInit: true,\n                onEndCrop: onEndCrop\n  \
  \          }\n        );\n    });\n</script>\n```\n\n我们希望裁剪器将捕获的一些数据存储在隐藏字段中，以便我们可以在服务器端处理这些数据。然后，我们需要添加一个函数来处理裁剪器触发的\
  \ onEndCrop 事件。该函数实际上会将数据存储到 HiddenField 控件中。这部分代码我们略过不展示，因为它相当简单。\n\n接下来，一旦用户选择了希望用作头像的图像区域，并将该选择提交给服务器，我们就拥有了执行图像裁剪所需的条件。Presenter\
  \ 的 CropFile() 方法将处理此任务。\n\n```csharp\n//Fisharoo/Web/Profiles/Presenters/UploadAvatarPresenter.cs\n\
  public void CropFile(Int32 X, Int32 Y, Int32 Width, Int32 Height)\n{\n    byte[]\
  \ imageBytes = profile.Avatar.ToArray();\n```\n\n\n\n## 用户个人资料\n\n### Gravatar\n\
  \n正如我们之前讨论过的，Gravatar 是一项允许你把头像集中存储的服务。它让你可以将一个头像与你的电子邮件地址关联起来，这样其他网站（比如我们的网站）之后就可以引用它。对于那些在互联网上到处都留有个人资料的用户来说，这非常棒！\n\
  \n为了让用户使用 Gravatar 服务，他们只需在上传头像界面的初始页面上勾选复选框即可。当他们点击**提交**时，我们会将他们的**个人资料**中的 UseGravatar\
  \ 属性设置为 1。之后每当我们调用 **ProfileImage.aspx** 页面来显示头像时，都必须使用 Gravatar 而不是本地存储的头像。\n\n\
  为了调用 Gravatar 服务，我们必须创建一个 URL，其中包含以十六进制 MD5 哈希形式正确格式化的电子邮件地址。我们在 Cryptography 类中创建了一个方法，来为我们执行此转换。\n\
  \n```csharp\npublic static string CreateMD5Hash(string StringToHash)\n{\n    MD5\
  \ md5Hasher = MD5.Create();\n    byte[] data =\n        md5Hasher.ComputeHash(Encoding.Default.GetBytes(StringToHash));\n\
  \    StringBuilder sBuilder = new StringBuilder();\n    for (int i = 0; i < data.Length;\
  \ i++)\n    {\n        sBuilder.Append(data[i].ToString(\"x2\"));\n    }\n    return\
  \ sBuilder.ToString();\n}\n```\n\n接着，我们创建了一个简单的扩展方法，它以一种比直接调用 Cryptography 套件更简化的方式为我们处理转换。\n\
  \n```csharp\npublic static string ToMD5Hash(this string s)\n{\n    return Cryptography.CreateMD5Hash(s);\n\
  }\n```\n\n了解了这些背景后，让我们来看看这个方法。\n\n```csharp\n//Fisharoo/Web/Images/ProfileAvatar/ProfileImage.aspx.cs\n\
  public string GetGravatarURL()\n{\n    defaultAvatar = Server.UrlPathEncode(__webContext.RootUrl\
  \ +\n        \"/images/ProfileAvatar/Male.jpg\");\n    gravatarURL = \"http://www.gravatar.com/avatar.php?\"\
  ;\n    gravatarURL += \"gravatar_id=\" + account.Email.ToMD5Hash();\n    gravatarURL\
  \ += \"&rating=r\";\n    gravatarURL += \"&size=80\";\n    gravatarURL += \"&default=\"\
  \ + defaultAvatar;\n    return gravatarURL;\n}\n```\n\n我们讨论的这些属性相当容易理解。不过，你可以在这里获取有关如何使用\
  \ Gravatar 服务的完整说明：http://site.gravatar.com/site/implement#section_1_1。\n\n### 公开个人资料\n\
  \n现在我们已经解决了隐私问题，为用户提供了管理其个人资料数据的方式，并允许他们上传和适当格式化头像，接下来我们需要为用户提供一个显示其所有数据的页面。\n\n\
  在很大程度上，这不过是另一个“管道页面”，也就是说我们只是在这里展示数据。一点也不复杂！因此，我们将跳过大部分基础工作，直接切入正题，也就是我们的隐私处理方式。\n\
  \n在 Profile.aspx 页面中，我们把所有内容都存放在类似这样的面板中：\n\n```aspx\n//Fisharoo/Web/Profiles/Profile.aspx\n\
  <asp:Panel ID=\"pnlPrivacyAccountInfo\" runat=\"server\">\n    <fieldset>\n    \
  \    <div class=\"divContainerTitle\"> Account Info</div>\n        <table class=\"\
  profileInfo\">\n            <tr> <td>Email: </td>\n                <td><asp:Literal\
  \ ID=\"litEmail\" runat=\"server\" /></td>\n            </tr>\n            <tr>\
  \ <td>Zip:</td>\n                <td><asp:Literal ID=\"litZip\" runat=\"server\"\
  \ /></td>\n            </tr>\n            <tr> <td>Birthday: </td>\n           \
  \     <td><asp:Literal ID=\"litBirthDate\" runat=\"server\" />/</td>\n         \
  \   </tr>\n            <tr> <td>Updated: </td>\n                <td><asp:Literal\
  \ ID=\"litLastUpdateDate\" runat=\"server\" />\n                </td> </tr>\n  \
  \      </table> </fieldset>\n</asp:Panel>\n```\n\n这让我们可以轻松地按需锁定某个数据区域（例如，为了隐藏数据）。在此页面的\
  \ presenter 中，我们有一个 TogglePrivacy() 方法。\n\n```csharp\n///Fisharoo/Web/Profiles/Presenters/ProfilePresenter.cs\n\
  private void TogglePrivacy()\n{\n    _view.pnlPrivacyIMVisible(_privacyService.ShouldShow((int)PrivacyFlagType.PrivacyFlagTypes.IM,_accountBeingViewed,\
  \ _account, _privacyFlags));\n    _view.pnlPrivacyAccountInfoVisible(_privacyService.ShouldShow((int)PrivacyFlagType.PrivacyFlagTypes.AccountInfo,_accountBeingViewed,\
  \ _account, _privacyFlags));\n    _view.pnlPrivacyTankInfoVisible(_privacyService.ShouldShow((int)PrivacyFlagType.PrivacyFlagTypes.TankInfo,_accountBeingViewed,\
  \ _account, _privacyFlags));\n}\n```\n\n这个方法会调用 PrivacyService.ShouldShow() 方法，该方法返回一个布尔值，指示该项是否应显示。这个布尔值会直接设置到视图中的\
  \ Panel.Visible 属性上，从而有效地显示或隐藏相关数据。\n\n### 自定义主页\n\n当我们说“自定义主页”时，实际上指的是以一种易于访问的方式呈现的公开个人资料页面。这实际上是一个花哨的\
  \ URL，例如 **http://www.fisharoo.com/profiles/atulgupta**。我们甚至可以更进一步，使用 **http://atulgupta.fisharoo.com**\
  \ 或类似的 URL！但在我们的例子中，我们将坚持使用第一个示例。\n\n为了实现这一点，我们将使用 ASP.NET 路由支持。ASP.NET 4 在很多方面改进了其\
  \ URL 路由功能。现在有了对 SEO 友好的 URL，ASP.NET 4 MVC 在很大程度上依赖这一功能。从核心来说，URL 路由是一项允许应用程序接受不映射到物理文件的\
  \ URL 的功能。我们上面提到的友好 URL（**http://www.fisharoo.com/profiles/atulgupta**）并不映射到服务器上的物理文件，但我们的应用程序仍然能够提供该\
  \ URL 的内容。\n\n这部分的实现逻辑相当直接。我们首先需要定义一个我们希望应用程序接受为有效的 URL 模式。这个模式会被添加到 RouteTable\
  \ 中。表中的条目还指定了当模式匹配时要重定向到哪个页面。最后，在特定页面中，我们查询传入该页面的值（类似于查询字符串参数），然后按照我们希望的方式继续处理。RouteTable\
  \ 条目是在 Application_Start 方法中添加到 Global.asax.cs 文件中的。\n\n\n\n\nThe values from the\
  \ routed URL are added to the RouteData collection and are accessible from the Page\
  \ class. We extract this value, cast it as a string, and then pass it to our presenter\
  \ to take further action based on this value. The specific part of the presenter's\
  \ Init() method, which is of interest here, is as follows:\n\n```\nif (string.IsNullOrEmpty(username))\n\
  \    _accountBeingViewed = userSession.CurrentUser;\nelse\n    _accountBeingViewed\
  \ = accountService.\n        GetAccountByUsername(username);\n```\n\nIf the passed-in\
  \ username is valid, then we query for that account and display it. That's all there\
  \ is to URL routing and getting it to support our fancy URL requirement.\n\nIn case\
  \ you are wondering, won't a direct call to the Profile.aspx page (http://www.fisharoo.com/profiles/profile.aspx)\
  \ match the URL route we have defined, with the username parameter being set to\
  \ profile.aspx? The answer is no. The routing engine by default excludes all calls\
  \ that match to physical files.\n\n## News feed/Alerts\n\nThe last concept that\
  \ we will cover in our discussion about building profiles is news feed (or alerts).\
  \ A news feed allows us to see what we have been doing with our account, friends,\
  \ our photos, and any other changes in the system. More importantly, it will allow\
  \ us to see what our friends have been doing with all their data, such as when they\
  \ add a new photo.\n\nThis system will be built on the alerts system that we have\
  \ already discussed. Any time we want to add a new alert to the system based on\
  \ an action performed by our user or the system, we simply make a call into the\
  \ AlertService and select the appropriate method such as AddNewAvatarAlert(). Once\
  \ the site is peppered with the addition of alerts to the system, we will have a\
  \ fairly active news feed to follow. Now, we just need a place to read this feed!\n\
  \nKnowing that this news feed will easily be one of the most active pages on our\
  \ site, we should put it on the users' homepage so that they can see it as soon\
  \ as they log in. To implement this, all we need is a repeater with a label in it,\
  \ on the homepage, which we can hook up to a list of alerts for the current user.\
  \ See the code for //Fisharoo/Web/Profiles/Default.aspx page.\n\nThen from the presenter,\
  \ we need to pass the view the appropriate data to bind to. We get the list of alerts,\
  \ convert them into a list of strings, and pass them to the view to display.\n\n\
  ```\n//Fisharoo/Web/Profiles/Presenters/DefaultPresenter.cs\nprivate void ShowDisplay()\n\
  {\n    List<string> msgs = new List<string>();\n    List<Alert> alerts = _alertService.GetAlertsByAccountID(\n\
  \        _userSession.CurrentUser.AccountID);\n    foreach (Alert item in alerts)\n\
  \    {\n        msgs.Add(item.Message);\n    }\n    _view.ShowAlerts(msgs);\n}\n\
  ```\n\nOnce we get into the concept of *Friends*, this page will be much more active,\
  \ as users can see their alerts as well as their friends'!\n\n## Summary\n\nWe have\
  \ covered a lot of ground in this chapter. We have discussed the concept of a profile\
  \ and a way for our users to manage their data. We have also built a way for our\
  \ users to manage their privacy regarding their profile data. We have also created\
  \ tools for our users to manage a custom avatar as well as a way to hook up to their\
  \ centrally stored Gravatar. With all of these features out of the way, we have\
  \ created a public profile for our users. And finally, we also created a default\
  \ landing page for users where they can see their alerts.\n\n# 5\n\n### Friends\n\
  \nThe subject of this chapter is the key to the success of any community. Your friend\
  \ features will be the main reason for people to interact with your community. It\
  \ is also the biggest drive for your users to advertise for you. \"Hey Peter, come\
  \ and check this out. I love it, so will you!\" — a friend in a community site,\
  \ like in life, is someone who you have something in common with, enjoy the company\
  \ of, or turn to when you have something to discuss. A circle of friends can be\
  \ thought of as a sub-community within a community.\n\nThis chapter will show you\
  \ how to take advantage of people's nature to congregate around things that they\
  \ enjoy, find useful, or that intrigue them. We will start this chapter by extending\
  \ the framework to allow for relationships to be built between our users. We will\
  \ then add some features that allow our users to locate all of their existing friends,\
  \ as well as make new friends. Then we will have a discussion about providing real-time\
  \ status updates in the form of a micro blog so that all of our friends can stay\
  \ in touch with everything we are doing.\n\n### Problem\n\nThere are many aspects\
  \ to building relationships in any community — real or virtual. First and foremost\
  \ is initiating contact with the people whom you will eventually call your friends.\
  \ The easiest way to locate someone who you might want to call a friend is to directly\
  \ invite the people who you already know as a friend. We will do this in a few ways.\n\
  \n- 3. Third, we will create a form that allows you to import all of your contacts\
  \ from Outlook.\n\n![](img/15a62e134135dde036b0ac3cbb01dab6_173_0.png)\n\nAll of\
  \ these methods of inviting a friend into the system would of course generate an\
  \ email invite (and eventually a system-based message—see next chapter). The user\
  \ will have the ability to then follow the link into the system and either sign\
  \ up or log in to accept the request. Once the user has clicked on the link in their\
  \ email, he/she will be taken to a page displaying the request.\n\n![](img/15a62e134135dde036b0ac3cbb01dab6_173_1.png)\n\
  \n![](img/15a62e134135dde036b0ac3cbb01dab6_175_0.png)\n\nThe box in the preceding\
  \ screenshot is where the user can enter his/her **Status Updates**. Each of these\
  \ updates will also be shown on the updates view and in their alerts view.\n\n![](img/15a62e134135dde036b0ac3cbb01dab6_175_1.png)\n\
  \nSuch alerts/notifications keep the people aware of what their friends are up to\
  \ and keep them involved with their friends.\n\n### Design\n\nNow let's talk about\
  \ the design of these features.\n\n### Friends\n\nThis chapter is an attempt to\
  \ throw light on the infrastructure needs and more heavily focus on the UI side\
  \ for creating and managing relationships. That being said, there is always some\
  \ form of groundwork that has to be in place prior to adding new features.\n\nIn\
  \ this case we need to add the concept of a friend prior to having the ability to\
  \ create friendships. This concept is a relatively simple one, as it is really only\
  \ defining a relationship between two accounts. We have the account that requested\
  \ the relationship and the account that accepted the relationship. This allows an\
  \ account to be linked to as many other accounts as they wish.\n\n### Finding friends\n\
  \nThe Friends feature will not go anywhere if there is no way for people to find\
  \ friends. For that reason, the various ways to locate and invite someone to be\
  \ your friend is our first topic.\n\n### Searching for a friend\n\nThe easiest way\
  \ to locate friends who might be interested in the same site as you are is to search\
  \ through the existing user base. For that reason, we will need to create a simple\
  \ keyword search box that is accessible from any page on the site. This search feature\
  \ should take a look at several fields of data pertaining to an account and return\
  \ all possible users. From the search results page, we should be able to initiate\
  \ a friend request.\n\n### Inviting a friend\n\nThe next best thing to locating\
  \ friends who are already members of the site is to invite people who you know outside\
  \ the site. The quickest way to implement this is to allow a user to manually enter\
  \ an email address or many email addresses, type a message, and then submit. This\
  \ would be implemented with a simple form that generates a quick email to the recipient\
  \ list. In the body of the email will be a link that allows the recipients to come\
  \ into our site.\n\n### Importing friends from external sources\n\nAn obvious extension\
  \ of the last topic is to somehow automate the importing process of contacts from\
  \ an email management tool. We will show how the user can export their contacts\
  \ from Outlook and import them via a web form. The user should then be able to select\
  \ the contacts that they want to invite.\n\n\n\n\n\n## 发送邀请\n\n通过以上三种方法，我们最终都会发出一封邀请邮件。我们可以简单地发送一封包含网站链接的邮件。但我们需要记录：\n\
  \n- 谁已被邀请？\n- 谁发起的邀请？\n- 此事发生在什么时候？\n\n在邮件中，我们不直接邀请用户进来，而是要为该用户分配一个密钥，以便在其进入系统时轻松识别。我们将使用系统生成的\
  \ GUID 来完成此操作。如果是邀请现有用户，我们会允许其登录以确认新的好友关系。如果是被邀请的非会员用户，我们会允许其创建新账户。在这两种情况下，我们都会在邀请中填入被邀请用户的\
  \ Account ID，以便保留关于这段关系的历史记录。\n\n## 添加好友提醒\n\n一旦我们搭建好了邀请和接受好友请求的框架，就需要用提醒功能扩展现有系统。这些提醒应显示在现有用户的“提醒”页面上，表明他们发出了邀请。对于现有用户，我们还应有提醒显示他们被邀请了。一旦用户接受了好友关系，我们也应该有一条相关提醒。\n\
  \n## 与好友互动\n\n现在让我们讨论一些与好友互动所需的功能。\n\n### 查看好友\n\n只有在用户能够与之互动时，好友才有意义。沿着这个思路的第一步是提供一个页面，让用户能够看到他/她的所有好友。这是用户查看好友个人资料的一个跳板。此外，随着用户个人资料概念的扩展，还可以以一目了然的格式展示每位好友的更多数据。\n\
  \n除了完整的**好友**页面，我们还可以将好友视图添加到用户的公开个人资料中，以便其他用户能够看到这些关系。\n\n### 管理好友\n\n既然我们已经能看到所有关系，最终就可以让用户删除一段关系。在我们的初次设计中，这将是对该关系的永久删除。\n\
  \n### 关注好友\n\n我们可以扩展提醒系统，使得当为用户生成提醒时（例如更新个人资料信息、上传新照片或任何其他与用户相关的操作），该用户的所有好友也会通过其“提醒”页面收到通知。\n\
  \n### 向好友提供状态更新\n\n在前面的章节中我们已经简要提到了这一点。用户可以写一条短消息作为其状态更新/微博客，这将显示在用户所有好友的“提醒”页面上。此功能会在终端用户的首页上产生大量动态内容，从而保持趣味性。\n\
  \n## 解决方案\n\n现在让我们看看我们的解决方案。\n\n### 实现数据库\n\n让我们看看支持这些新功能所需的表。\n\n### friends 表\n\
  \n好友的概念是本章讨论的基础，因此我们将立即开始围绕该主题创建表。正如你之前读到的，这是一个非常直接的表结构，仅将一个账户与另一个账户关联起来。\n\n![](img/15a62e134135dde036b0ac3cbb01dab6_178_0.png)\n\
  \n### Friend invitations\n\n这张表负责跟踪谁被邀请到网站、被谁邀请以及何时邀请。它还保存发送给好友的密钥（GUID），以便他们能够在相应的邀请下重新进入系统。一旦好友接受了关系，他们的\
  \ AccountID 也会存储在这里，这样我们就能看到关系是在何时以何种方式建立的。\n\n| 列名 | 数据类型 | 允许为空 |\n|---|---|---|\n\
  | InvitationID | int | ☐ |\n| AccountID | int | ☐ |\n| Email | varchar(200) | ☐\
  \ |\n| GUID | uniqueidentifier | ☐ |\n| CreateDate | smalldatetime | ☐ |\n| BecameAccountID\
  \ | int | ☐ |\n| Timestamp | timestamp | ☐ |\n\n### 状态更新\n\n状态更新允许用户告诉好友他们此刻在做什么。可以说这是一种微博客。\n\
  \n> **微博客**允许用户针对任何事情写简短文字。例子包括 Twitter 和 Yammer。更多信息请看这里：**http://en.wikipedia.org/wiki/Micro-blogging**。\n\
  \n### FriendRepository\n\n此方法查询该账户拥有的所有好友。请注意，LINQ to Entity 查询返回 IEnumerable\\\
  <T\\>，其中 T 是类。我们希望返回 List\\<Friend\\>，这是通过调用 friends.ToList() 实现的。\n\n然后它查询反向关系，即该账户被另一个账户拥有。接着将第二个查询添加到第一个查询中，并返回该结果。\n\
  \n下面是获取我们好友账户的方法。\n\n```\n//Fisharoo/DataAccess/Repositories/FriendRepository.cs\n\
  public List<Account> GetFriendsAccountsByAccountID(Int32 AccountID)\n{\n    List<Friend>\
  \ friends = GetFriendsByAccountID(AccountID);\n    List<int> accountIDs = new List<int>();\n\
  \    foreach (Friend friend in friends)\n    {\n        accountIDs.Add(friend.MyFriendsAccountID);\n\
  \    }\n\n    List<Account> result = new List<Account>();\n    using (FisharooDataContext\
  \ dc = conn.GetContext())\n    {\n        IEnumerable<Account> accounts = from a\
  \ in dc.Accounts\n                                         where accountIDs.Contains(a.AccountID)\
  \ select a;\n        result = accounts.ToList();\n    }\n    return result;\n}\n\
  ```\n\n此方法首先收集所有好友（通过我们讨论过的第一个方法），然后查询所有相关账户并返回结果。\n\n### FriendInvitationRepository\n\
  \n与其他仓库一样，这个仓库也有标准方法，我们这里不再列出。有关详细信息，请参考本章附带的代码。除此之外，我们还需要能够通过 GUID 或发送给好友的邀请密钥来检索邀请。\n\
  \n```\n//Fisharoo/DataAccess/Repositories/FriendInvitationRepository.cs\npublic\
  \ FriendInvitation GetFriendInvitationByGUID(Guid guid)\n{\n    FriendInvitation\
  \ friendInvitation;\n    using (FisharooDataContext dc = conn.GetContext())\n  \
  \  {\n        friendInvitation = dc.FriendInvitations.Where(fi => fi.GUID\n    \
  \                                          == guid).FirstOrDefault();\n    }\n \
  \   return friendInvitation;\n}\n```\n\n这是一个非常直接的查询，匹配 **GUID** 值。除了上述方法外，我们还需要一种清理邀请的方式。为此，我们有下面这个方法：\n\
  \n```\n//Fisharoo/DataAccess/Repositories/FriendInvitationRepository.cs\npublic\
  \ void CleanUpFriendInvitationsForThisEmail(FriendInvitation friendInvitation)\n\
  {\n    using (FisharooDataContext dc = conn.GetContext())\n    {\n        IEnumerable<FriendInvitation>\
  \ friendInvitations\n                              = from fi in dc.FriendInvitations\n\
  \                                where fi.Email == friendInvitation.Email &&\n \
  \                               fi.BecameAccountID == 0 &&\n                   \
  \             fi.AccountID == friendInvitation.AccountID\n                     \
  \           select fi;\n        foreach (FriendInvitation invitation in friendInvitations)\n\
  \        {\n            dc.FriendInvitations.DeleteObject(invitation);\n       \
  \ }\n        dc.SaveChanges();\n    }\n}\n```\n\n此方法负责清除系统中从账户 A 发送给账户 B 且尚未被激活（账户\
  \ B 从未对邀请进行任何操作）的任何邀请。我们不会在创建邀请时检查邀请是否已存在，而是允许它们被反复创建（在导入 500 个联系人的过程中每次都检查邀请可能会大大拖慢速度！）。当账户\
  \ B 最终接受其中一个邀请时，其他所有邀请将被清除。另外，如果账户 B 从未对这些邀请做任何操作，我们将需要一个数据库进程来定期清理旧邀请。\n\n### StatusUpdateRepository\n\
  \n这个仓库中值得关注的方法是用于在个人资料页面上获取前 N 条状态更新的方法。\n\n```\n//Fisharoo/DataAccess/Repositories/StatusUpdateRepository.cs\n\
  public List<StatusUpdate> GetTopNStatusUpdatesByAccountID(Int32 AccountID, Int32\
  \ Number)\n{\n    List<StatusUpdate> result;\n    using (FisharooDataContext dc\
  \ = conn.GetContext())\n    {\n        IEnumerable<StatusUpdate> statusUpdates =\
  \ (from su in dc.StatusUpdates\n            where su.AccountID == AccountID\n  \
  \          orderby su.CreateDate descending\n            select su).Take(Number);\n\
  \        result = statusUpdates.ToList();\n    }\n    return result;\n}\n```\n\n\
  这是通过一个标准的 LINQ to Entity 查询完成的，并添加了 Take() 方法，该方法会在生成的 SQL 中转换为 TOP 语句。\n\n### AccountRepository\n\
  \n随着搜索功能的增加，我们需要在 AccountRepository 中添加一个新方法。这个方法将是搜索账户的关键。\n\n```\npublic List<Account>\
  \ SearchAccounts(string SearchText)\n{\n    List<Account> result = new List<Account>();\n\
  \    using (FisharooDataContext dc = conn.GetContext())\n    {\n        IEnumerable<Account>\
  \ accounts = from a in dc.Accounts\n            where(a.FirstName + \" \" + a.LastName).Contains(SearchText)\
  \ || a.Email.Contains(SearchText) || a.Username.Contains(SearchText)\n         \
  \   select a;\n        result = accounts.ToList();\n    }\n    return result;\n\
  }\n```\n\n\n\n\n\n该方法目前会搜索用户的名字、姓氏、电子邮件地址和用户名。当然，这可以扩展到他们的个人资料数据以及许多其他数据点（慢慢来！）。\n\
  \n## 实现服务/应用层\n\n现在我们已经建立了存储库，就可以开始创建位于这些存储库之上的服务了。我们将为每个添加的存储库创建一个服务，除此之外我们还会扩展这些服务：\n\
  \n- AlertService\n- PrivacyService\n\n### FriendService\n\nFriendService 目前有几个职责。我们需要它来告诉我们某位用户是否是好友，以便我们可以扩展\
  \ PrivacyService 来考虑好友（请回忆，我们目前只理解公开和私有设置！）。除此之外，我们还需要 FriendService 能够处理从 FriendInvitation\
  \ 创建好友。\n\n```csharp\n//Fisharoo/BusinessLogic/FriendService.cs\npublic bool IsFriend(Account\
  \ account, Account accountBeingViewed)\n{\n    if(account == null)\n        return\
  \ false;\n    if(accountBeingViewed == null)\n        return false;\n    if(account.AccountID\
  \ == accountBeingViewed.AccountID)\n        return true;\n    else\n    {\n    \
  \    Friend friend = _friendRepository.GetFriendsByAccountID(accountBeingViewed.AccountID).Where(f\
  \ => f.MyFriendsAccountID == account.AccountID).FirstOrDefault();\n        if(friend\
  \ != null)\n            return true;\n    }\n    return false;\n}\n```\n\n### Friends\n\
  \n此方法需要知道是谁（用户账户）在发起请求以及请求发给谁。它随后验证两个账户是否有效，以便我们以后可以使用它们，如果任一账户无效则返回 **false**。我们然后检查查看用户是否与被查看用户相同。如果是，我们可以安全地返回\
  \ **true**。然后是有趣的部分——目前我们使用的是 **FriendRepository** 中的 **GetFriendsByAccountID**\
  \ 方法。我们遍历该列表以查看我们的好友是否在列表中。如果找到它，我们返回 **true**。否则方法未能找到结果并返回 **false**。\n\n> 请记住，这种做法很快就会成为严重的性能问题。如果某人有\
  \ 500 个好友，这将是不可接受的。由于我们的目标是让人们拥有大量好友，我们通常不希望这样做。你最好的选择是在 FriendsRepository 中创建一个\
  \ LINQ 查询来直接处理此逻辑，只返回 **true** 或 **false**。另一种选择是使用缓存。\n\n接下来是我们的 **CreateFriendFromFriendInvitation**\
  \ 方法，其名称所示，它会从好友邀请中创建好友。\n\n```csharp\n//Fisharoo/BusinessLogic/FriendService.cs\n\
  public bool CreateFriendFromFriendInvitation(Guid InvitationKey,\nAccount InvitationTo,\
  \ bool ExistingMember)\n{\n    //update friend invitation request\n    FriendInvitation\
  \ friendInvitation = _friendInvitationRepository.GetFriendInvitationByGUID(InvitationKey);\n\
  \    //validate if the friend request is for the same person who has logged in\n\
  \    //however if this is a new member (new registration), then don't validate as\
  \ the friend request\n    //person may use a different email during registration\n\
  \    if(ExistingMember && (friendInvitation.Email != InvitationTo.Email))\n    \
  \    return false;\n\n    friendInvitation.BecameAccountID = InvitationTo.AccountID;\n\
  \    _friendInvitationRepository.SaveFriendInvitation(friendInvitation);\n    _friendInvitationRepository.CleanUpFriendInvitationsForThisEmail(friendInvitation);\n\
  \n    //create friendship\n    Friend friend = new Friend();\n    friend.AccountID\
  \ = friendInvitation.AccountID;\n    friend.MyFriendsAccountID = InvitationTo.AccountID;\n\
  \    _friendRepository.SaveFriend(friend);\n\n    Account InvitationFrom = _accountRepository.\n\
  \    GetAccountByID(friendInvitation.AccountID);\n    _alertService.AddFriendAddedAlert(InvitationFrom,\
  \ InvitationTo);\n    return true;\n}\n```\n\n此方法期望 InvitationKey（以系统生成的 GUID 形式提供）以及希望建立关系的账户。它随后获取\
  \ FriendInvitation 并更新新好友的 BecameAccountID 属性。我们随后调用一次清理这两个用户之间的其他好友邀请。清理完成后，我们向系统添加一条新提醒（稍后会介绍），通知发起此邀请的账户邀请已被接受。\n\
  \n请注意，我们还需要在此处添加一些内容以通过消息系统发送消息（在下一章中介绍！）。\n\n### AlertService\n\nAlert 服务本质上是向用户个人资料发布提醒的包装器。所有相关实现已在前一章中介绍。因此，我们添加的额外方法与之前所做的工作非常相似。我们不会在此描述这些方法。你可以在\
  \ AlertService 类中查找 AddStatusUpdateAlert()、AddFriendRequestAlert() 和 AddFriendAddedAlert()\
  \ 方法（作为本章相关代码的一部分提供）。\n\n### PrivacyService\n\n现在我们有了检查两个人是否互为好友的方法，我们终于可以扩展 PrivacyService\
  \ 以考虑好友。请记住，到目前为止，我们只是在检查某物是否标记为私有或公开。代码中只有很小的改动。\n\n```csharp\n//Fisharoo/BusinessLogic/PrivacyService.cs\n\
  public bool ShouldShow(Int32 PrivacyFlagTypeID,\nAccount AccountBeingViewed, Account\
  \ Account, List<PrivacyFlag>\nFlags)\n{\n    bool result;\n\n    bool isFriend =\
  \ _friendService.IsFriend(Account,AccountBeingViewed);\n    ...\n    //rest of the\
  \ code is as is\n}\n```\n\n我们所做的只是将 isFriend 变量指向 FriendService 中新的 IsFriend() 方法的结果。其余所有内容之前都已处理！\n\
  \n## 实现表示层\n\n现在基础框架已经就位，我们可以开始讨论将其全部整合起来需要什么。如前所述，本章更少关于框架，更多关于利用新旧框架的 UI！\n\n\
  ### 搜索好友\n\n让我们看看实现好友搜索需要什么。\n\n### SiteMaster\n\n让我们从搜索好友开始。我们尚未介绍太多关于实际 UI 的内容，也没有介绍该站点的母版页。我们不想让这变成关于设计的问题！因此我们简单地说，我们已在母版页上添加了一个文本框和一个按钮来接收搜索词。\n\
  \n当按钮被点击时，站点会重定向到 Search.aspx 页面，并将搜索词一并传递过去。\n\n### Search\n\nSearch.aspx 页面没有界面。它期望从前面讨论的母版页上的文本框中传入一个值。借助此文本短语，我们调用\
  \ AccountService 并使用 Contains() 运算符执行搜索。返回的账户列表随后在页面上显示。\n\n在很大程度上，此页面全部是关于 MVP\
  \ 管道。我们假设你已经熟悉 MVP，从现在开始只关注有趣的部分。以下是显示所有数据的中继器。\n\n```aspx\n//Fisharoo/Web/Search.aspx\n\
  <%@ Register Src=\"~/UserControls/ProfileDisplay.ascx\" TagPrefix=\"Fisharoo\" TagName=\"\
  ProfileDisplay\" %>\n...\n<asp:Repeater ID=\"repAccounts\" runat=\"server\" OnItemDataBound=\"\
  repAccounts_ItemDataBound\">\n    <ItemTemplate>\n        <Fisharoo:ProfileDisplay\
  \ ShowDeleteButton=\"false\" ID=\"pdProfileDisplay\" runat=\"server\" />\n    </ItemTemplate>\n\
  </asp:Repeater>\n```\n\n以下屏幕截图显示了搜索结果的显示方式：\n\n![](img/15a62e134135dde036b0ac3cbb01dab6_189_0.png)\n\
  \n本例中有趣的部分来自于 **ProfileDisplay** 用户控件的创建，以便我们能够以一种易于在各处显示简洁个人资料数据的方式，使用一个可重用的代码块来允许进行全局更改。\n\
  \n你应该会看到我们有 `<Fisharoo:ProfileDisplay ... />`。你还会注意到我们的标签在标签定义中设置了自定义属性。在本例中你可以看到\
  \ `ShowDeleteButton=\"false\"`。\n\n所有逻辑和显示都非常标准。你有 MVP 管道，这构成了大部分内容。**ProfileDisplay**\
  \ 控件还具有 `LoadDisplay()` 方法，负责加载该控件的 UI。这是在 Search 页面中的 `repAccounts_ItemDataBound()`\
  \ 方法中调用的。\n\n```csharp\n//Fisharoo/Web/Search.aspx.cs\nprotected void repAccounts_ItemDataBound(object\
  \ sender,\n                                         RepeaterItemEventArgs e)\n{\n\
  \    if(e.Item.ItemType == ListItemType.Item || e.Item.ItemType ==\n           \
  \                           ListItemType.AlternatingItem)\n    {\n        ProfileDisplay\
  \ pd = e.Item.FindControl(\"pdProfileDisplay\") as\n                           \
  \           ProfileDisplay;\n        pd.LoadDisplay((Account)e.Item.DataItem);\n\
  \        if(_webContext.CurrentUser == null)\n            pd.ShowFriendRequestButton\
  \ = false;\n    }\n}\n```\n\n让我们按显示顺序、代码隐藏和演示者查看 **ProfileDisplay** 用户控件代码（通常省略视图接口）。\n\
  \n```aspx\n//Fisharoo/Web/UserControls/ProfileDisplay.ascx\n<%@ Control Language=\"\
  C#\" AutoEventWireup=\"true\"\nCodeBehind=\"ProfileDisplay.ascx.cs\"\n```\n\n```aspx\n\
  Inherits=\"Fisharoo.Web.UserControls.ProfileDisplay\" %>\n<div style=\"height: 116px;\
  \ float: left;\">\n    <table>\n        <tr>\n            <td style=\"width: 102px\"\
  >\n                <%-- NavigationURL and Image's URL will be set in code --%>\n\
