  \n\n\n\n最后，我们来看程序的核心部分：\n\n```\nusing System.ComponentModel.Composition;\nusing\
  \ Fisharoo.BusinessLogic.Interfaces;\nusing Fisharoo.Common;\n\nnamespace Fisharoo.MailQueueProcessor\n\
  {\n    public class Program\n    {\n        [Import]\n        private static IEmailService\
  \ _emailService;\n\n        static void Main(string[] args)\n        {\n       \
  \     MEFManager.Compose(null);\n            _emailService.ProcessEmails();\n  \
  \      }\n    }\n}\n```\n\n由于我们的大部分工作已经在 `DBMailService` 中完成，实际处理邮件队列所需的工作已经所剩无几。我们导入一个\
  \ `IEmailService` 接口，组合它，然后调用 `ProcessEmails()` 方法。我们只是想向你展示，这件事可以轻而易举地完成。也就是说，处理队列中邮件的整个应用程序只需要两行代码！\n\
  \n## 警报\n\n警报是网站用户之间发送的通知。你可能会问，这会对网站性能产生什么影响？随着社区中的人越来越多，他们互相成为好友，加入群组、写博客、访问论坛等，系统中流动的警报消息数量也会增加。这意味着需要存储并显示给每个用户的数据会快速增长。\n\
  \n下面我们会讨论数据库优化，其中会涉及数据文件大小的问题。对于警报而言，我们既要处理警报消息的增长，也需要考虑提供删除不再有用的警报的方法。这将有助于控制数据增长。我们还可以按需自动清除早于某个日期的数据。另一个改动是将警报限制为仅发送给好友。没有必要给自己发送警报，因为用户自己已经知道自己在网站上做了什么。\n\
  \n我们还可以轻松添加另一个功能，比如订阅警报。在我们当前的设计中，警报总是发送给所有好友（以及群组成员）。我们可以为用户提供选项，让他们选择希望接收的警报类型，这可以进一步减轻系统负载。我们已经更新了\
  \ Profiles 文件夹中的 `Default.aspx`，为用户提供一个复选框，他们可以用它来选择要删除哪些警报。此外，我们已修改 `AlertService`，使其不会向自己发送警报，只向好友发送警报。你可以在与本章相关的代码中查看这些更新。\n\
  \n## 数据库层扩展\n\n到本书目前这一部分为止，我们还没有花费太多时间讨论数据库层面。这里我们也将尽量延续这一主题，毕竟这本书更侧重于 ASP.NET 和\
  \ C#，而不是 SQL！话虽如此，有些操作我们只能在数据库层面完成，其他地方则无法实现。\n\n### 标记为删除\n\n将内容标记为删除而不是实际删除，不仅从用户角度看会更快，从数据库角度看也是如此。当你尝试删除一条记录时，数据库必须先锁定该表，然后才执行删除操作。此外，每次删除都必须在事务日志中写入一条条目。而当一条记录最终被删除时，数据库会维护日志序列号，但不一定会为已删除的信息释放数据页。归根结底，`DELETE`\
  \ 语句是可能执行的最昂贵的命令之一。\n\n因此，当应用程序要求删除某个条目时，我们不必真正删除该记录，而是可以将 `FlaggedForDelete` 列设置为\
  \ true。然后，当我们的查询从该表中获取数据时，我们可以在 `WHERE` 子句中添加一个参数，检查所选数据是否未被标记为删除。接着，我们可以运行一个管理进程，根据当前负载选择最合适的频率，将该表中的所有活动数据复制到一个临时表中，删除包含标记为删除数据的原表，然后将临时表重命名为原名。当表被截断时，数据页会重新分配给系统以供复用。\n\
  \n请记住，这种方法没有“撤销”功能。如果你需要将数据持久化到事务日志中以满足审计要求，这可能不是最适合你的方法。此外，如果你要截断的表有任何外键引用，在执行截断命令之前，必须先删除这些引用。处理完成后，你还需要重新创建这些键。\n\
  \n**标记为删除**这个概念我们不会花太多时间讨论。你只需在每个表中添加 **标记为删除** 列，并将默认值设置为 **false** 即可。由于我们使用 Entity\
  \ Framework，你需要更新设计界面中的所有表。然后在所有 `INSERT` 语句中，将 **标记为删除** 字段的默认值指定为 **false**（当对象传入待插入时，你需要设置该值）。完成这些之后，你还需要更新所有\
  \ `SELECT` 语句，检查 **标记为删除** 字段，排除标记为 **true** 的条目。别忘了，在执行联接查询时，也要检查关联表上的 **标记为删除**\
  \ 字段。\n\n### 索引\n\n索引是一种优化数据库的方式，它使数据为快速搜索而组织起来。使用数据库引擎优化顾问分析查询有助于创建索引。如果没有索引，`WHERE`、`ORDER\
  \ BY`、`GROUP BY`、`TOP` 和 `DISTINCT` 等各种功能都必须执行全表扫描，这会严重影响性能。如果没有索引，当你查找 `ProfileID\
  \ = 89734` 的用户配置时，SQL Server 将不得不查看每一行来寻找所需数据。有了索引，SQL Server 会按特定顺序保存一份 `ProfileID`\
  \ 列表，这样一来，定位我们感兴趣的那条记录就变得容易了。\n\n有了索引，你会发现使用 `WHERE` 子句的查询会快得多。索引的缺点是，每次从索引中删除数据，都必须重新生成或重建索引。如果数据集很大，创建或重建索引可能会耗费时间。这是一个已知的缺点，但通常来说，有索引总比没有索引好。\n\
  \n可以在表上创建多种类型的索引——唯一索引、聚集索引、非聚集索引等。**唯一**索引是指索引的键在整个表中是唯一的。可以把自动生成的 **int** 值想象成唯一索引。**聚集**索引使表数据的物理排序与索引的排序保持一致，这使得索引非常快。一个表只能有一个聚集索引，因为表只能有一种物理排序顺序！然后是**非聚集**索引。这种索引类型在逻辑上对索引键进行排序，但不会影响表数据的物理排序。索引可以由单个列组成，例如\
  \ **int** 类型的主键。也可以创建由多达十六个列组成的复合键。\n\n### 水平分区\n\n**水平分区**是指将一组物理数据——整行——存储到一个结构相同的表（架构相同）中。每组数据通常是一个范围数据集。例如，对于订单系统，你可以将一个季度的数据放在表\
  \ A 中，另一个季度的数据放在表 B 中，依此类推。通常，你会希望使用日期、数字或地理位置作为范围集。但是，在我们的场景中，我们只能通过用户名和密码来识别用户。因此，我们可能会保留一个包含用户名和用户\
  \ ID 的索引表。一旦获得用户 ID，我们就可以进入一个按用户 ID 分区的用户数据分区表，范围可以是 1-100000、100001-200000，依此类推。水平分区可以加快查询速度，因为我们处理的是更小的数据集。此外，我们也可以轻松快速地处理较小的数据集，包括向其中添加数据或从中删除数据。\n\
  \n> 如果你关注云计算相关的趋势，你就会知道微软的 Azure 表存储本质上遵循的就是这种水平分区模式。\n\n我们将重点讨论如何构建和使用分区表。请记住，我们只需要在数据库开始变得有点迟缓时（实际上，你应该在感到迟缓之前就做这件事！）这样做。以下是创建水平分区的一般步骤：\n\
  \n1. 如果希望将数据放在多个物理磁盘上，请创建文件组。这是从这一特定的性能提升中获得最大收益的最佳方式。这样，当你跨分区进行查询时，工作会被拆分到多个磁盘上。\n\
  2. 创建分区函数。这定义了我们将要处理的范围。\n3. 创建分区方案。这允许我们指定哪个分区位于哪个文件组上。\n4. 完成这些步骤后，我们就可以开始创建分区表了。\n\
  \n### 文件组\n\n要创建新的文件组，请使用以下语法：\n\n```\nAlter Database Fisharoo ADD FILEGROUP FG1\n\
  ```\n\n\n\n创建文件组后，就可以向其中添加文件了。\n\n```\nALTER DATABASE Fisharoo\nADD FILE\n(\n  \
  \  NAME = FILE1,\n    FILENAME = 'c:\\Projects\\Fisharoo\\Trunk\\DataBase\\FILE1.ndf',\n\
  \    SIZE = 1MB,\n    MAXSIZE = 10MB,\n    FILEGROWTH = 1MB\n)\nTO FILEGROUP FG1;\n\
  ```\n\n你可以根据需要向文件组中添加任意数量的文件。每个磁盘上的每个分区对应一个文件，这是最佳做法！之后你随时可以添加或修改。\n\n### 分区函数\n\
  \n要创建分区函数，请使用以下代码：\n\n```\nCREATE PARTITION FUNCTION pfAccounts(int)\nAS\nRANGE\
  \ LEFT FOR VALUES(10000,20000,30000)\n```\n\n这个分区函数指定了将有三个分区。每个分区将保存 10,000 条账户记录（你可能会希望定义更大的范围）。在第一个分区中，我们将存放账户\
  \ 1 到 10,000。第二个分区将存放 10,001 到 20,000。第三个分区，也就是最后一个分区，将存放账户 20,001 到 30,000。\n\n\
  ### 分区方案\n\n要创建分区方案，请使用以下代码（假设你已经创建了这些文件组）：\n\n```\nCREATE PARTITION SCHEME psAccounts\n\
  AS\nPARTITION pfAccounts TO (FG1,FG2,FG3,[PRIMARY])\n```\n\n如果你只定义了一个文件组，则可以使用以下代码：\n\
  \n```\nCREATE PARTITION SCHEME psAccounts\nAS\nPARTITION pfAccounts ALL TO (FG1)\n\
  ```\n\n### 分区表\n\n有了这些元素之后，我们就可以创建实际的分区表了。\n\n```\nCREATE TABLE Accounts\n(\n  \
  \  AccountID INT,\n    Username VARCHAR(20),\n    ...\n)\nON psAccounts(AccountID)\n\
  ```\n\n#### 这对我们当前的系统有什么影响？\n\n不幸的是，这不像索引那样是对系统的一种幕后修补。对分区表进行查询需要更多的语法，因为你需要告诉 SQL\
  \ Server 在哪个分区中查找。不过这并不算太复杂。要获取 AccountID 为 25,000 的用户账户，你可以运行以下查询：\n\n```\nSELECT\
  \ *\nFROM Accounts\nWHERE $PARTITION.pfAccounts(AccountID) =\n      (SELECT $PARTITION.pfAccounts(25000))\n\
  ```\n\n这里的关键是 WHERE 子句中的 SELECT 语句。\n\n```\nSELECT $PARTITION.pfAccounts(25000)\n\
  ```\n\n这一行根据我们构建分区函数时所依据的范围值，返回要搜索的分区编号。在这种情况下，它知道你要查找的是第三个分区。因此它返回 3，因为分区 3 保存着\
  \ AccountID 为 25,000 的账户。除此之外，数据查询方式没有改变。\n\n有关分区表的更多信息，请查看以下资源：\n\n**http://www.dotnetspider.com/resources/1082-Partitioning-Tables-SQL-SERVER.aspx**\n\
  \n对于 SQL Server 2008 R2，请查看\n\n**http://msdn.microsoft.com/en-us/library/ms188730.aspx**\n\
  \n## 向上扩展\n\n### 注意事项\n\n请务必注意，上一节中描述的表分区功能仅在 SQL Server 的企业版（EE）中可用。\n\n扩展是一个广泛的领域，我们可以一直讲下去。由于页数限制，我们希望在此结束讨论，并建议你查看以下博客以获取一些补充要点：\n\
  \nhttp://www.infosysblogs.com/microsoft/2009/10/considerations_for_developing.html\n\
  \n### 搜索\n\n尽管合理实现的索引集和缓存层确实可以显著提升网站性能，但它并不是解决所有问题的万能药。我们没有理由将搜索结果添加到缓存中，因为每次搜索都可能不同并产生不同的结果。这会很快用无用的数据填满我们的缓存。除了缓存的这一缺点之外，索引也不能解决所有问题。虽然索引可以为搜索增添一些新的优势，但它并不是搜索的最佳选择，因为人们通常感兴趣的是搜索文本字段（这不是我们希望索引的内容）。虽然我们可以在\
  \ SQL Server 中实现 FREETEXT 搜索功能，但市面上有更好的解决方案。\n\n在本节中，我们将讨论如何使用 Lucene.NET，这是一个允许你高效索引和搜索数据的工具。目前有许多大型网站使用\
  \ Lucene 来提供搜索功能，我们将向你展示如何实现。虽然我们无法创建一个谷歌搜索引擎，但我们可以创建任何社区网站可能需要的所有快速搜索功能。\n\n> 你可以在这里找到\
  \ Lucene：**http://incubator.apache.org/lucene.net/**。\n\n我们之前从创建索引、优化删除流程和分区数据等角度讨论了数据库优化。很明显，删除流程在这里帮不上忙。让我们讨论一下为什么另外两种方法其实也对搜索帮助不大。\n\
  \n你可能会认为向表中添加索引有助于优化搜索过程。但仔细想想，我们需要在列的数据中进行搜索。我们很少会拥有与完全匹配的字符串完全相同的完整字符串。除此之外，我们还需要支持不仅仅是通配符搜索。我们还想支持布尔搜索、多短语查询等等。基于这些原因，索引对搜索没有太大帮助。\n\
  \n请注意，在类的顶部有一个名为 `_indexBuildLocker` 的对象声明。每当我们调用 `BuildIndexes()` 方法时，都可以对该对象加锁。如果在该方法被再次调用时对象已被锁定，调用将被阻塞，直到锁被释放。\n\
  \n有了这个作为我们其他构建索引方法入口的方法，我们就可以开始了。让我们先创建一个 `BuildBlogIndex()` 方法。这个方法负责为我们的博客数据构建索引。请参考\
  \ `// Fisharoo/BusinessLogic/LuceneSearchService.cs` 中的代码。\n\n构建索引的第一步重要操作是打开一个\
  \ `IndexWriter`。这需要传入一个 `Directory` 和一个 `StandardAnalyzer`。由于我们有多个索引构建器，我们将 `Directory`\
  \ 的逻辑提取出来，放入 `getCacheDirectory()` 方法中以返回适当的 `Directory`。\n\n```\nprivate Directory\
  \ getCacheDirectory(string SubFolder)\n{\n    if (!System.IO.Directory.Exists(_indexPath\
  \ + \"\\\\\" + SubFolder))\n    {\n        System.IO.Directory.CreateDirectory(_indexPath\
  \ + \"\\\\\" +\n                                            SubFolder);\n    }\n\
  \    _directory = FSDirectory.GetDirectory(_indexPath + \"\\\\\" +\n           \
  \                               SubFolder, false);\n    return _directory;\n}\n\
  ```\n\n`StandardAnalyzer` 用于清除正在创建的索引中的干扰词。这样，像“the”、“and”、“is”等单词将被移除。\n\n![](img/15a62e134135dde036b0ac3cbb01dab6_458_0.png)\n\
  \n> 重要的是，如果你清理了要进入索引的词语，那么你同样需要从查询中移除任何干扰词！\n\n下一组代码允许我们处理较小的数据集。在构建索引时，我们不想处理一百万条记录。相反，我们将使用较小的数据集来处理。因此，我们使用\
  \ while (moreRecords) 语句来仔细检查是否还有更多记录。一旦我们从 `BlogRepository` 中获取了剩余记录，我们就会将 moreRecords\
  \ 变量设置为 `false`。\n\n当我们获取用于构建索引的记录时，我们需要遍历每条记录以实际添加到索引中。一个 Lucene.NET 索引由文档（Documents）组成。因此，对于每条新的博客记录，我们都要创建一个新的\
  \ Document，就像上面代码中的 foreach 块所做的那样。\n\n一旦我们有了初始化搜索的方法，就可以安全地开始搜索过程了。在我们的案例中，我们将搜索\
  \ Profiles 和 Blogs 索引（我们为两者都创建了索引）。请注意，在搜索开始时，我们有一个要搜索的索引数组。然后我们遍历该列表，对集合中的每个索引执行搜索。\n\
  \n接着我们打开相应的索引。还要注意，我们在初始化一个 Hits 对象，它将保存搜索的结果。在此实现中，我们创建了三种类型的搜索。一种是通配符搜索，它允许用户指定\
  \ * 作为搜索的通配符。然后我们检查搜索短语中是否有多个单词，如果有，则将其视为 MultiPhraseQuery。最后，我们还有一个简单的 PhraseQuery。\n\
  \n通配符搜索将查找你指定的内容，并用任何其他内容代替通配符。如果我们指定“Atul*”作为搜索短语，它应该能轻松匹配到“Atul Gupta”或任何其他以 Atul\
  \ 开头的内容。请注意这种搜索方式，因为你可能会返回大量数据，与从 SQL 中 Select all 没什么区别。\n\nMultiPhraseQuery 允许你先搜索短语查询中的第一个词，然后在第一个词的搜索结果中搜索第二个词，以此类推。这可以用来相当准确地缩小搜索结果范围。最后，我们还有一个简单的\
  \ PhraseQuery。这个查询接收一个单词，并在索引中搜索该单词的实例。\n\n每次搜索我们都会返回一个 Hits 集合。Hits 对象保存了通过搜索找到的所有文档。每个命中结果都带有相关性和文档，因此你可以使用找到文档的记录\
  \ ID，从而回到存储在 SQL 表中的数据。\n\n然后，我们遍历每个命中结果，创建新的 SearchResult（我们自定义的结构），用于通用地填充我们的\
  \ UI。请参考 `// Fisharoo/BusinessLogic/LuceneSearchService.cs` 中的代码。\n\n我们使用这个结构来在搜索结果\
  \ UI 中填充网格或中继器。\n\n我们没有直接将这个功能接入网站，而是创建了一个简单的网页 LuceneSearch.aspx，让你看看它是如何工作的。这个页面中也有构建索引和执行搜索的代码。代码非常简单，我们也没有为其实现\
  \ MVP 模式，因为我们只想强调如何快速使用它。你可以查看本章相关的代码以了解详细信息。\n\n\n\n\n\n## 摘要\n\n在本章中，我们讨论了应用程序中可能随着时间的推移而出现增长痛点的各个领域。我们解决了应用程序层验证的相关问题，从\
  \ Web、应用和数据库服务器三个角度审视了应用分层，并研究了每一层中可用于让该特定层应对未来用户增长（扩展）的可行策略。\n\n在应用层，我们探讨了如何在不显著更改现有代码的情况下，为现有应用程序启用服务化功能。我们研究了一种通过使用\
  \ Windows Server AppFabric 或 MemCached.NET 实现缓存层来加快站点数据和对象访问速度的方法。接下来，我们探讨了如何通过在网站与实际发送电子邮件的进程之间引入异步机制来加速网络通信，尤其是电子邮件。然后，我们研究了如何更好地管理用户之间针对其在站点上执行操作而发送的各种警报。\n\
  \n在数据库层，我们通过讨论更好的数据删除、分区和索引方式来审视数据库中可能存在的低效问题。随后我们探讨了如何让搜索功能变得更好、更快。\n\n本章的关键在于利用现有技术栈充分提取有助于支撑扩展的功能，然后审视你的站点以找出可能的痛点，并采用那些不一定与\
  \ ASP.NET 或 C# 相关的方法来解决这些问题。通常，你的代码可能已经优化到了更高的水平，但看起来仍然很慢。不妨稍微深入探查，自行判断与某个问题相关的所有方面，并学习在必要时以跳出常规思维的方式去解决它。\n"
- '## 比较 ASP.NET MVP 与 ASP.NET MVC


  微软平台上的 Web 应用程序开发已经从基于 CGI 的开发演进到经典 ASP 页面，再到 ASP.NET Web Form 开发，直至最新的 ASP.NET
  MVC。ASP.NET 于 2000 年初推出，它给 Web 应用程序的构建方式带来了重大变化，并且凭借其丰富的服务器控件（每次新版本都会新增控件），为应用程序开发带来了极大的生产力提升。


  ASP.NET Web Form 开发模型旨在为 Web 开发者提供类似 Windows Form 的应用程序开发环境。而 Windows Form 开发本身又深受
  VB 6.0（及更早版本）所提供的快速应用程序开发环境的影响。


  ### ASP.NET Web Forms


  ASP.NET Web Forms 解决了早期经典 ASP 构建 Web 应用程序方式中的大量问题。其中一些如下：


  - 减少了面条式代码，ASPX 和代码后置文件中的 HTML 与代码实现了更清晰的分离

  - 能够使用 .NET 的一等公民语言，如 C# 和 VB.NET

  - 编译后的代码带来了性能提升

  - 服务器控件的可用性极大地提升了生产力，并帮助快速构建复杂应用程序

  - 事件模型使得处理页面上的用户操作变得容易

  - ViewState 和 ASP.NET 引擎帮助在回发之间保留数据（这也带来了一些副作用）

  - 编程模型简单，任何人都能快速上手


  其他好处，如更好的线程模型、垃圾回收等，都随 .NET 核心框架一起到来，很快便有大量开发者涌入这项技术。


  虽然这一模型解决了很多问题，但它也引入了一些自身的问题。其中一些如下：


  - 对 Web 编程标准（如 MVC 模式）的遵循度不够

  - 测试 ASP.NET 应用程序并不容易

  - 虽然业务逻辑仍然可以测试，但测试 UI 代码非常麻烦

  - 代码本身没有促进关注点分离，虽然在 ASPX 页面中避免了面条式代码，但在后端却出现了数据访问逻辑与 UI 代码混在一起的情况

  - 由于对生成的 HTML 控制有限，构建跨浏览器和可访问的应用程序并不总是那么容易


  然而，情况并非毫无希望，确实也出现了一些模式来解决其中的部分缺陷。


  ### Web 表示模式


  微软 **Patterns and Practices (PnP)** 团队提出了多种归类为 Web 表示模式（Web Presentation patterns）的模式。下面将对这些模式进行简要讨论。要了解更多细节，请查看：**http://msdn.microsoft.com/en-us/library/ff650511.aspx**。


  ### 页面缓存


  很多时候，用户访问某个网页时看到的页面信息是相似的。页面本身是动态构建的，但由于查询性质的原因，最终呈现的视图却可能是相似的。因此，与数据缓存类似，我们可以通过利用过期策略来启用
  ASPX 页面本身的缓存。这种特性正是页面缓存（Page Cache）模式所支持的。


  ### 拦截过滤器


  拦截过滤器（Intercepting filter）模式扩展了前端控制器（Front Controller）的概念，它通过使用 HTTP 模块，在 ASP.NET
  运行时引擎处理请求之前和之后都可以拦截这些请求。


  ### ASP.NET MVC


  我们探讨了各种模式，也简要讨论了当前开发者在使用 ASP.NET Web Forms 技术构建 Web 应用程序时面临的关键问题。将近十年过去了，某种程度上我们确实需要有某种新模型尽快出现。不过，我们要明确一点：ASP.NET
  MVC 并不是对 ASP.NET Web Form 编程风格的替代。它的确解决了某些关键问题，并且应当被视为 ASP.NET 世界中的一种新编程范式。简而言之，这意味着当你开始构建一个新的
  Web 应用程序时，你必须在 ASP.NET Web Form 和 ASP.NET MVC 之间做出选择。


  但在我们进入选择之前，先快速强调一下 ASP.NET MVC 的关键方面。**模型-视图-控制器（Model-View-Controller，MVC）** 是一种架构模式，已经存在很多年了。这个模式本身相当容易理解。**模型**代表了应用程序领域中按需组织的数据。很多时候它还会支持捕获数据的更新并将其存储回适当的存储介质。**视图**是将这些数据在用户界面上的可视化表现。**控制器**负责处理对资源/数据的请求，找到合适的模型，然后以合适的格式将其传递给视图，最终呈现给用户。你可以在这里阅读更多关于
  MVC 模式的内容：**http://en.wikipedia.org/wiki/Model-view-controller**。


  微软修改了传入请求的处理方式以及传递给 ASP.NET 引擎的方式。请求不再采用 .aspx 页面的形式，而是更具 RESTful 风格并且面向操作。一个处理器会拦截这些请求，并将它们传递给控制器中正确的操作/方法。


  ASP.NET MVC 强制将 SoC（关注点分离）原则贯彻到底。由于控制器是纯逻辑，很容易在测试框架中实例化它并测试功能，而无需加载整个 ASP.NET 运行时引擎。虽然你仍然无法测试最终数据的渲染效果，但你完全可以测试需要渲染的数据。再加上一些手动
  UI 验证，就可以帮助完成整个应用程序的测试。与 ASP.NET MVP 不同，这种模式不依赖完整的运行时引擎；ASP.NET MVC 在设计时就考虑到了可测试性。它为
  HttpContext、HttpRequest 和 HttpResponse 等内在对象提供了抽象类，从而让测试更加容易。


  ASP.NET MVC 中的视图是使用标准 HTML（通过 HTML 辅助方法完成）构建的。这里没有 ASP.NET 服务器控件可用，因此开发者最终需要自己编写大部分
  HTML，但反过来这也让他们对 HTML 有了完全的控制权，从而能更好地处理可访问性需求。虽然此时 Visual Studio 对 ASP.NET MVC 的
  HTML 控件支持有限，但你也不必完全自己动手，因为你可以选择使用不同的视图引擎。目前已有第三方控件可以与 ASP.NET 一起使用。你可以从 NVelocity、Brail、NHaml、Spark
  等视图引擎中挑选来构建你的视图。


  > 关于 ASP.NET MVC 的更多细节，可以参考 MSDN 库：http://msdn.microsoft.com/en-us/library/dd381412.aspx。


  现在，我们来回答最后一个问题：如何在 MVP（本质上使用 ASP.NET Web Forms 方法）和 MVC 之间进行选择。


  ### 在 MVP 和 MVC 之间选择


  MVP 和 MVC 模式都能够生成企业级应用程序。虽然 MVC 无疑是更好的模式，但同样真实的是，就目前而言，使用 MVP 方法所获得的生产力优势要远远胜出。MVC
  模式对当前的 Web 开发者，甚至刚入门的新手来说，都意味着一条相当陡峭的学习曲线。


  考虑到社交网站对丰富用户界面的期望，使用 MVC 还意味着，几乎每一个显示需求都需要额外做大量工作来创建自定义控件。MVP 则允许我们使用大量 ASP.NET
  服务器控件。


  在开始构建一个新应用程序时，你可以更有说服力地支持 MVC。然而，就我们的情况而言，由于这是本书的更新版，且相关源代码是在上一版基础上构建的，使用 MVC 将意味着一个非常长的周期。


  目前还没有迁移向导可以帮助轻松地将某些基于 MVP 的代码转换为 MVC。如果我们选择了 MVC，那将意味着对表示层的重写，并且会影响本书的发布时间表。





  ## 摘要


  我们已经讨论了在 ASP.NET Web Forms 应用程序开发中可用的各种 Web 呈现模式。我们还了解了 ASP.NET MVC 所提供的功能，并将我们在本书上一版中使用的
  MVP 模式与 MVC 进行了比较。经过多次讨论，我们最终得出结论：在表示层保留 MVP 模式是最好的选择。将来如果时间允许，我们一定会为我们的 Fisharoo
  网站探索基于 MVC 的前端。

