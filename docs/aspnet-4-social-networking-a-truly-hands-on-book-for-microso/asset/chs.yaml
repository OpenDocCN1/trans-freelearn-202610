  \n## 前言\n\n社交网络已成为互联网的一大驱动力。许多人至少加入了某一个社交网络，但更常见的情况是，人们往往是许多不同社区的成员。因此，许多商界人士正试图利用这一潮流，争相搭建自己的社交网络。随着社交网络的持续发展，我们看到越来越多垂直领域的社区如雨后春笋般涌现，取代那些规模更大、包罗万象的网络，试图抢占一小块市场份额。\n\
  \n在本书中，我们将讨论构成当今大多数社交网络或在线社区的诸多方面和功能。我们不仅会讨论这些功能、它们的目的以及如何构建它们，还会从大规模企业级视角来审视这些功能的构建方式。目标是探讨如何以可扩展的方式创建社区。\n\
  \n## 本书涵盖内容\n\n- *第1章，社交网络* 会让你了解本书的整体结构，即读者可以从本书中获得什么。\n- *第2章，社区框架的企业级方法* 帮助你创建一套企业级框架，以满足大多数\
  \ Web 应用程序的需求。其中讨论了设计模式、最佳实践以及一些能简化工作的工具，还涵盖了错误处理和日志记录。\n- *第3章，用户账户* 通过电子邮件验证系统和权限系统来确保安全，涵盖了注册和账户创建过程。它还涉及密码加密/解密技术。\n\
  - *第13章，扩展* 讨论了一些帮助你在社交网络上支持大量用户的概念。它首先介绍分层架构和 Web 场的一些关键概念，还讨论了创建和搜索索引数据的方法、优化数据检索和内容创建的方式，以及一些邮件排队概念。\n\
