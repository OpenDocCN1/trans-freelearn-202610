  \ UI，如前所述，这是我们从 codeplex 网站获取的一个控件。\n\n\n\n\n\n## 媒体画廊\n\n### 使用 Silverlight 上传器接收文件\n\
  \n与应用程序集成后的界面如以下截图所示。当前有三个文件被选中用于上传（desert.jpg、jellyfish.jpg 和 penguins.jpg）。我们可以上传文件时启用缩略图预览，但这会减慢上传过程。文件上传控件的代码（取自\
