  }\n```\n"
- "# 12 审核\n\n我们终于到达了一个拥有社区的地步，这个社区具备几乎代表一个伟大社区的所有功能。就此而言，我们允许用户创建的许多内容都是基于文本或基于资源的内容项，例如图片、影片等等。这太棒了！现在我们要做的就是部署站点，邀请一些用户，然后看着我们的社区成长。\n\
  \n别急！允许用户群完全自由地在你的站点上填充内容并不是一个好主意。这意味着你无法控制站点的命运。这还意味着最终会有人添加不当材料。甚至可能有精通技术的用户试图窃取你部分用户的信息，用于不当目的。所有这些问题最终可能会赶走所有好用户，只留下坏用户。最坏的情况下，由于这些不受控制的用户的行为，你可能最终会面临法律问题。\n\
  \n我们并不是想吓唬你。我们只是想告诉你，对于一个由用户内容驱动的社区，你需要承担一些责任，并牢牢掌控局面。我们所说的这种严格控制正是本章的内容。\n\n在本章中，我们将讨论各种形式的审核。对于用户生成的内容，我们可以利用用户生成审核。毕竟，为什么不给受冒犯者一种方法来举报冒犯他们的内容呢？我们还将讨论对惯犯用户进行禁言。我们还将创建一个过滤器，用来屏蔽不良词语和竞争对手的垃圾信息。\n\
  \n\n\n\n\n## 问题\n\n本章的核心问题是，我们不希望将控制权随意交给用户群体。对于网站的内容输入和显示，我们应当尽可能保持对网站的最大控制。让我们来讨论核心功能。\n\
  \n## 社区审核\n\n用户审核通过一个简单的 AJAX 化 ImageButton 来实现，该按钮允许用户随内容一起对内联的不当内容进行标记。\n\n![](img/15a62e134135dde036b0ac3cbb01dab6_392_0.png)\n\
  \n被社区标记的内容将显示在管理控制台的“审核”部分下，如以下截图所示。在这里，你可以批准或拒绝该内容。\n\n![](img/15a62e134135dde036b0ac3cbb01dab6_392_1.png)\n\
  \n## 禁言用户\n\n一旦你有了待审核内容的列表，你最终会开始注意到一些重复违规者。因此，我们需要一种方式来约束这些违规者。在查看被标记的内容时，你还会看到内容的拥有者。如果你发现看到了重复违规者，你可以对该用户施加禁言（Gag）。禁言将限制该用户继续向网站添加内容，作为对其不良行为的一种惩罚。禁言的一部分是指定原因和禁言令结束的日期，如以下截图所示。如果你不想指定结束日期，可以施加\
  \ 20 年的封禁！\n\n![](img/15a62e134135dde036b0ac3cbb01dab6_393_0.png)\n\n## 动态过滤器\n\n\
  动态过滤器将解决几个问题。你可以用它有效地从网站上删除不雅内容。你也可以用它拦截竞争对手的帖子或广告。最重要的是，你可以用它限制允许的脚本类型。该工具可以阻止\
  \ HTML、JavaScript 以及几乎任何其他你不希望在网站上出现的内容，这有助于你处理跨站脚本问题。\n\n## 审核\n\n为了启用审核功能，我们将利用在第\
  \ 11 章中使用的相同概念。此功能将实现为另一个 UserControl，我们可以将其插入到任何需要的地方。由于它将与 SystemObjects 对象表关联，我们可以自由地让用户审核任何数据库导向的内容——无论是文本、图像还是几乎其他任何内容。只要它有记录\
  \ ID 和关联的表，我们就可以对其审核。\n\n除了让用户标记内容以供批准外，我们还需要创建一个页面来管理被标记的内容。我们将实现一个简单的管理页面，显示所有列出的内容。对于每个列出的项目，我们可以批准或拒绝该内容。被批准的内容将不再在网站上可见。这个页面还将承载我们的禁言功能，我们将在后面讨论。\n\
  \n这个结构与我们对 SystemObjects 表的其他用法相同。它有 SystemObjectID 和 SystemObjectRecordID，这使我们能够添加审核条目并查看它指向的位置。当我们构建管理页面时，你会看到我们如何使用这些数据来获取所有对象，无论其类型如何，以供管理查看。除了\
  \ SystemObjects 表之外，我们还连接到 Accounts 表，使用发布可疑内容的账户的 AccountID 和对可疑内容采取行动的用户的 AccountID。跟踪第二个\
  \ AccountID 很有用，因为它帮助我们跟踪哪个用户正在发起标记。如果我们发现内容没有问题，我们实际上可以追踪发起请求的用户，以查明这是否是一个试图让无辜用户被禁言的恶意用户。\n\
  \n### 禁言\n\n禁言用户——就像法律上的禁言令一样——是限制他们公开发表评论。我们将扩展这个概念，即如果用户被施加了禁言令，我们将不允许他们在我们的系统上发布内容！与标记可疑内容一样，不采用自动禁言，而是由仲裁者介入，将有助于防止无辜用户被错误禁言的情况。\n\
  \n在 Gags 表中最需要注意的字段是 GagUntilDate，如前面的截图所示。此字段中的日期是用户能够再次与社区互动的日期。\n\n## 过滤\n\n\
  过滤系统将使能够映射出我们不想要的内容，并将其替换为实际需要的内容。我们首先用一个简单的映射场景来说明：有人在我们的网站上使用了脏话。我们可以将不喜欢的词添加到内容过滤列表中，并在其位置插入一个更好的词，从而使我们的内容不那么冒犯。在“dude”的例子中，我们将其替换为“[Filtered]”。\n\
  \n虽然我们的过滤器可以并且应该在这种简单的方式下使用，它也可以用于销毁客户端脚本。为了可能销毁脚本，你可以将以下文本字符串（两个不同的条目）添加到过滤列表中：`<script>`\
  \ 和 `</script>`，并将替换值设置为空字符串。这将有效地将所有 `<script>` 和 `</script>` 条目替换为空字符串。这将在剩余的脚本标签之间留下代码/文本。我们认为，这实际上会破坏脚本。\n\
  \n为了仅仅使用过滤这个概念，我们需要一个包含可能条目的庞大数据库来进行测试。这不仅困难，而且效率极其低下！即使我们拥有世界上最全面的词典，仍然有可能遗漏某些内容。而且，这也会相当难看，因为你会在页面中看到所有未捕获的代码。但至少他们此时无法运行脚本。这是朝着正确方向迈出的一步。\n\
  \n为了解决未捕获标签的问题，并绕过对标签库的需求，我们将在过滤之前对要过滤的字符串使用 `UrlEncode()`。`UrlEncode()` 的第一遍会将\
  \ `<script>` 和 `</script>` 标签转换为 `&lt;script&gt;` 和 `&lt;/script&gt;`。它还会将条目中的所有其他特殊字符转换为编码形式。这有效地使所有\
  \ HTML、CSS 和 JavaScript 代码失效！\n\n既然我们已经杀死了文本中所有可能的标记和脚本，那我们想在网站上允许的内容呢？我们可以通过在过滤列表中添加编码后的单词，将它们翻译回可接受的术语，从而在过滤列表中做出例外。对于粗体标签\
  \ `<b>`，编码函数会使其看起来像 `&lt;b&gt;`。我们可以简单地将 `&lt;b&gt;` 添加到要过滤的单词列表中，并设置替换值为 `<b>`。现在我们可以重新构建我们想要接受的内容。接受列表比内容过滤可能的数据库更容易管理。\n\
  \n## 解决方案\n\n现在让我们看一下解决方案。\n\n## 实现数据库\n\n首先让我们看看需要哪些表。以下截图显示了相关的表：\n\n![](img/15a62e134135dde036b0ac3cbb01dab6_397_0.png)\n\
  \n## 审核记录\n\n上一张截图中的审核表包含 SystemObjectID 和 SystemObjectRecordID，以及创建所讨论内容的账户。它还包含了执行相应操作的账户以及该操作是什么。\n\
  \n除了表之外，我们还需要一种快速简便的方式获取已审核的文件。我们不想这么说，但这次我们要深入实际 SQL。我们将创建一个存储过程，它接收一个 FolderID\
  \ 并返回该文件夹中所有已审核的文件。\n\n```\nCREATE PROCEDURE [dbo].[pr_GetModeratedFiles]\n@DefaultFolderID\
  \ bigint\nAS\nBEGIN\n    SELECT f.* FROM Files f WHERE f.DefaultFolderID = @DefaultFolderID\
  \ AND f.FileID\n    NOT IN (SELECT f.FileID FROM Files f, Moderations m\n      \
  \      WHERE\n            f.DefaultFolderID = @DefaultFolderID\n            AND\n\
  \            m.SystemObjectID = 5\n            AND\n            m.systemobjectrecordid\
  \ = f.FileID\n            AND\n            m.IsApproved = 1\n    )\nEND\n```\n\n\
  然后，我们可以在查询内外快速轻松地使用这些信息。\n\n## 禁言记录\n\n如前面截图所示，Gags 表负责判断用户是否被限制向社区添加内容（即被“软禁”）。它包含被禁言用户的\
  \ AccountID、他们的 AccountUsername、禁言生效时间、禁言原因、施加禁言的管理员以及禁言解除时间。\n\n\n\n\n\n## 内容过滤器\n\
  \n尽管内容过滤器承担着重大责任，但它是一个相对简单的系统。它只需跟踪要过滤哪些模式、将每个模式替换成什么、每个过滤器由谁创建，以及创建时间。该系统的优势更多体现在实现上，而非存储上！\n\
  \n### 创建关系\n\n一旦所有表创建完成，我们就可以创建所有关系。\n\n对于这组表，我们有以下表之间的关系：\n\n-   Moderations 和\
  \ Accounts\n-   Moderations 和 SystemObjects\n-   Gags 和 Accounts\n-   ContentFilters\
  \ 和 Accounts\n\n### 设置数据访问层\n\n要设置数据访问层，我们按照前面章节中已经完成的步骤进行操作。打开 Fisharoo.edmx 文件，并添加我们在本章中讨论过的上述所有表。\n\
  \n### 构建存储库\n\n随着新表的增加，也会新增相应的存储库，以便我们能够获取存储在这些表中的数据。我们将创建以下存储库来满足我们的需求。\n\n-  \
  \ ModerationRepository\n-   GagRepository\n-   ContentFilterRepository\n\n我们的每个存储库通常都会有一个方法——用于按\
  \ ID 选择、按父 ID 选择全部、保存和删除。一旦你看过一个存储库，基本上就看过了所有的存储库。请回顾前面的章节、附录或随附代码，了解标准存储库的示例。不过，我们将讨论任何与标准不同的地方。\n\
  \n#### ModerationRepository\n\n对于这个存储库，我们有一个标准的保存方法，它一次接收一个 ModerationRepository\
  \ 并适当地处理它。当我们的用户标记内容时，它实质上是创建条目。这对于我们社区用户的一次一条记录创建非常有用。\n\n**GetModerationsGlobal()**\n\
  \n一旦我们创建了审核记录，我们需要能够查看问题，以便我们可以接受某些内容并拒绝其他内容。为此，我们有一个方法可以从全局视角获取所有审核项：GetModerationsGlobal()。\n\
  \n```csharp\n///Fisharoo/DataAccess/Repositories/ModerationRepository.cs\npublic\
  \ List<Moderation> GetModerationsGlobal()\n{\n    List<Moderation> result = new\
  \ List<Moderation>();\n    using(FisharooDataContext dc = conn.GetContext())\n \
  \   {\n        var groups = (from m in dc.Moderations\n                      where\
  \ m.IsDenied == null || m.IsApproved == null\n                      group m by m.SystemObjectRecordID\n\
  \                      into g\n                      select new { g, NumberOfReports\
  \ = g.Count() }\n                      ).OrderByDescending\n                   \
  \   (g1 => g1.NumberOfReports);\n\n        foreach (var v in groups)\n        {\n\
  \            result.Add(v.g.ToList()[0]);\n        }\n    }\n    return result;\n\
  }\n```\n\n此方法允许我们获取所有审核项，并按 SystemObjectRecordID 分组，因为许多人可能会举报同一段内容。这种简化后的视图将出现在我们的管理界面中，以便我们能够以更精简的方式接受或拒绝内容。无需查看每一条举报！\n\
  \n#### GagRepository\n\n我们将讨论这个存储库中的两个方法：\n\n-   **GetActiveGags()** 使我们能够获取系统中所有禁言（Gag）的列表，从而管理谁被禁言、谁即将解禁，以及可能需要延长禁言的用户。\n\
  -   **IsGagged()** 允许我们检查用户当前是否被禁言。它允许我们限制被禁言的用户创建新内容。我们还可以用它来更改显示，例如隐藏“新帖”按钮。\n\
  \n```csharp\n//Fisharoo/DataAccess/Repositories/GagRepository.cs\npublic List<Gag>\
  \ GetActiveGags()\n{\n    List<Gag> result = new List<Gag>();\n    using(FisharooDataContext\
  \ dc = conn.GetContext())\n    {\n        result = dc.Gags.Where(g => g.GagUntilDate\
  \ >\n            DateTime.Now).OrderBy(g => g.GagUntilDate).\n            ToList();\n\
  \    }\n    return result;\n}\npublic bool IsGagged(Int32 AccountID)\n{\n    bool\
  \ result = false;\n    using(FisharooDataContext dc = conn.GetContext())\n    {\n\
  \        if(dc.Gags.Where(g=>g.AccountID == AccountID &&\n            g.GagUntilDate\
  \ > DateTime.Now).\n            FirstOrDefault() != null)\n        {\n         \
  \   result = true;\n        }\n    }\n    return true;\n}\n```\n\n#### ContentFilterRepository\n\
  \nContentFilterRepository 目前只有一个职责：返回系统中所有过滤器的列表。\n\n### 实现服务/应用程序层\n\n一旦所有存储库都为单一用途构建完成，我们就可以开始创建服务层了。同样，这一层负责组装聚合体，并对我们的实体执行复杂操作。我们将创建和修改以下服务：\n\
  \n-   ContentFilterService\n-   Extensions\n\n#### ContentFilterService\n\nContentFilterService\
  \ 负责应用我们的内容过滤器（ContentFilters）。该方法将调用 ContentFilterRepository、对字符串进行 HtmlEncode()\
  \ 编码，以及实际将过滤器应用到待过滤字符串的工作整合在一起。\n\n```csharp\n//Fisharoo/BusinessLogic/ContentFilterService.cs\n\
  public string Filter(string StringToFilter)\n{\n    List<ContentFilter> _contentFilters\
  \ = _contentFilterRepository.GetContentFilters();\n    StringBuilder sb = new StringBuilder(StringToFilter);\n\
  \    //encode the final output for further security\n    sb = new StringBuilder(HttpUtility.HtmlEncode(sb.ToString()));\n\
  \    //replace all the dirty words and forbidden tags\n    foreach (ContentFilter\
  \ cf in _contentFilters)\n    {\n        sb.Replace(cf.StringToFilter, cf.ReplaceWith);\n\
  \    }\n    return sb.ToString();\n}\n```\n\n我们进入此方法时，首先获得要处理的字符串。接下来，我们获取要处理的 ContentFilters\
  \ 列表。为了更高效地处理字符串，我们将创建一个新的 StringBuilder。我们过滤字符串的第一步是使用 HttpUtility.HtmlEncode()\
  \ 方法对字符串进行编码。一旦我们有了可处理的基础字符串，就可以开始遍历 ContentFilters 集合。对于每个 ContentFilter，我们执行一次\
  \ Replace()，将 StringToFilter 替换为 ReplaceWith 值。然后，在返回过滤结果之前，我们将 StringBuilder 转换回字符串。\n\
  \n## 审核（Moderation）\n\n代码后置文件中没什么特别之处，所以我们来看看 presenter。在那里，我们为控件设置所有属性，并决定是否应该显示该控件。\n\
  \n```csharp\n///Fisharoo/Web/UserControls/Presenters/ModerationPresenter.cs\npublic\
  \ class ModerationPresenter\n{\n    - - -\n\n    public void Init(Moderations view,\
  \ bool IsPostBack)\n    {\n        _view = view;\n\n        if (_webContext.CurrentUser\
  \ == null)\n            _view.ShowFlagThis = false;\n        else if (_moderationRepository.HasFlaggedThisAlready(\n\
  \                _webContext.CurrentUser.AccountID, _view.SystemObjectID,\n    \
  \            _view.SystemObjectRecordID))\n            _view.ShowFlagThis = false;\n\
  \        else\n            _view.ShowFlagThis = true;\n    }\n\n    public void\
  \ SaveModeration(int SystemObjectID, long SystemObjectRecordID)\n    {\n       \
  \ if (_webContext.CurrentUser != null)\n        {\n            Moderation moderation\
  \ = new Moderation();\n            moderation.AccountID = _webContext.CurrentUser.AccountID;\n\
  \            moderation.AccountUsername = _webContext.CurrentUser.Username;\n  \
  \          moderation.CreateDate = DateTime.Now;\n            moderation.SystemObjectID\
  \ = _view.SystemObjectID;\n            moderation.SystemObjectRecordID = _view.SystemObjectRecordID;\n\
  \            _moderationRepository.SaveModeration(moderation);\n        }\n    \
  \    _view.ShowFlagThis = false;\n    }\n}\n```\n\nSaveModeration() 方法是从代码后置文件传输到\
  \ presenter 的按钮点击事件。在 presenter 中，我们创建一个新的 Moderation 并将其保存到数据库。\n\n\n\n\n\n## 审核\n\
  \n```csharp\nmr.IsApproved = false;\nresults.Add(mr);\n}\n}\nif(!string.IsNullOrEmpty(txtGagDate.Text))\n\
  {\n    _presenter.GagUserUntil(Convert.ToInt32\n        (litAccountID.Text),\n \
  \       litAccountUsername.Text,\n        DateTime.Parse(txtGagDate.Text),\n   \
  \     txtReason.Text);\n}\n}\n}\n}\nif(results.Count() > 0)\n    _presenter.SaveModerationResults(results);\n\
  }\n```\n\n这里看起来有很多内容，但方法顶部的代码很大程度上用于定位并加载 UI 上的控件。一旦我们拿到这些控件，我们就可以检查每个被标记项目的状态。当我们发现有复选框被选中用于批准或拒绝时，我们就将该项目添加到我们的\
  \ ModerationResults 列表中（请回顾我们在上一节的存储库中创建了它）。\n\n一旦我们处理完数据，就将修改列表发送到 ModerationRepository，在那里批量保存。\n\
  \n### 禁言\n\n在审核页面 UI 中，你可以看到我们有两个文本框控件。我们有一个文本框用于捕获我们决定禁言用户的理由。另一个文本框用于提供日期，该日期表示用户的禁言将最终被撤销的时间。\n\
  \n在 **btnSubmit_Click()** 方法中（之前讨论过），你也会看到一些检查这些文本框状态的代码。如果我们在 Repeaters 控件集合中找到内容，那么我们就会调用\
  \ presenter 的 GagUserUntil() 方法，有效地禁言该用户。Presenter 创建一个新的 Gag 对象并将其持久化到数据库中。\n\n\
  ```csharp\n//Fisharoo/AdminConsole/Moderations/Presenters/DefaultPresenter.cs\n\
  public void GagUserUntil(int AccountID, string AccountUsername,\n              \
  \           DateTime GagTillDate, string Reason)\n{\n    Gag gag = new Gag();\n\
  \    gag.AccountID = AccountID;\n    gag.CreateDate = DateTime.Now;\n    gag.AccountUsername\
  \ = AccountUsername;\n    gag.GagUntilDate = GagTillDate;\n    gag.Reason = Reason;\n\
  \    gag.GaggedByAccountID = _webContext.CurrentUser.AccountID;\n    _gagRepository.SaveGag(gag);\n\
  }\n```\n\n### 过滤\n\n过滤过程负责移除粗俗语言、竞争对手广告、恶意中伤以及 XSS 攻击。\n\n我们已将此功能添加到我们的 PEBoardPost\
  \ 展示实体中以演示它。一个帖子/主题有两个文本部分——标题和主要内容。我们修改了 PEBoardPost，使其返回标题和内容的已过滤数据。代码更改如下所示：\n\
  \n```csharp\n//Fisharoo/Web/HelperClasses/PEBoardPost.cs\nprivate string _name;\n\
  public string Name\n{\n    get { return _contentFilterService.Filter(_name); }\n\
  \    set { _name = value; }\n}\n\nprivate string _post;\npublic string Post\n{\n\
  \    get { return _contentFilterService.Filter(_post); }\n    set { _post = value;\
  \ }\n}\n```\n\n好了，终于完成！实现此功能的所有工作都在后端——对于这种性质的功能至关重要。越容易使用，就越可能被使用。在可能的情况下，我们最好在\
  \ presenter 中甚至更上层链路中过滤文本。越接近实际数据检索完成此任务，就越不可能被遗忘！但正如你所见，它足够灵活，可以在任何需要时使用。\n\n###\
  \ 总结\n\n在本章中，我们讨论了如何以及为何实现某种形式的审核。我们查看了我们的社区提供的内容如何由同一社区使用一个非常简单的标记工具进行管理，该工具足够灵活，可以添加到我们网站上的任何主要实体。我们还查看了处理习惯性违规者的一些方法，即通过禁言他们或通过添加权限来暂停其内容。最后，我们从高层次审视了如何实现过滤系统以从网站内容中过滤掉不需要的语言/词语。\n"
- "# 13 扩展\n\n如果你能坚持到这里，那么你一定是拥有了一个社区网站的自豪新主人，该网站已准备好开始接受新的社区成员。我们从经验中知道，你不会走到这一步只是为了建立一个永远只有\
  \ 100 个用户的社区。你和其他人一样，非常希望建立一个拥有 10 万或更多活跃用户的社交网络。一万名用户被认为是一项成功。十万名用户，你也许能够把你的社区卖给别人。\n\
  \n要让这么多用户访问你的网站需要多方面的条件。你必须为你的网站提供一个很棒的新概念。一些真正使其与众不同之处。它需要出色的营销技巧，无论是通过病毒式营销还是通过更传统的营销活动。它还意味着你的网站需要在达到目标之前承受每天大量用户的持续重载。这最后一点正是本章要讨论的内容。\n\
  \n### 问题\n\n拥有大量用户的网站有许多方面可能导致网站瘫痪。有些可能是功能缓慢，而其他则可能是物理上锁定系统，导致其不再响应。在本章中，我们将讨论社区中可能出现的一些问题以及如何解决它们。\n\
  \n我们将在数据库层面讨论索引和分区数据等形式的问题。我们将深入探讨如何通过应用分层来解决可扩展性问题，通过增加硬件来解决应用缓慢问题，然后对该硬件进行负载均衡。我们还将讨论如何缓存数据访问和复杂对象创建，以便不必每次都执行查询或对象操作。接下来，我们将通过创建高度优化的索引数据集来加快搜索速度。最后，我们将研究减少网站直接对话的系统数量，以便用户体验不会直接受到基础设施的影响。\n\
  \n然而，这并不像只是将特定程序集移动到不同机器那么简单。从展示层到业务层的调用现在将超出机器边界，因为相应的代码将存在于不同的物理机器上。为了解决这个问题，我们可以做的一件事是为此应用程序启用\
  \ **面向服务的架构 (SOA)**。SOA 是一个非常著名的范式，你可以从 http://en.wikipedia.org/wiki/Service-oriented_architecture\
  \ 阅读它。\n\n在以下各节中，我们将展示如何修改当前实现以使其支持 SOA。\n\n### 展示层和应用层扩展\n\n在进一步深入扩展之前，让我们先进行一些架构合规性验证。\n\
  \n#### 分层架构验证\n\n架构验证是我们应该能够在项目的各个阶段执行的重要方面。这有助于确保作为流程一部分定义的结构规则在整个开发阶段始终得到遵守，并且不会无意中被违反。例如，展示层代码不应直接调用数据访问层代码等规则至关重要，但除非彻底审查代码，否则很难定位。\n\
  \nVisual Studio (VS) 2010 的架构验证功能开箱即提供此功能。你需要先在设计器中创建一个架构图，然后将解决方案中的不同项目附加到图中的不同层。VS\
  \ 然后可以根据架构图验证不同项目之间的调用并指出违规行为。\n\n让我们向现有解决方案添加一个名为 ModelingProject 的新项目，并使用图层图模板添加一个新项。使用\
  \ View | Toolbox 菜单在画布上拖动三个水平层和一个垂直层。从上到下的水平层分别命名为展示层、业务层和数据访问层。垂直层称为实用程序层。\n\n\n\
  \n\n# 扩展\n\n一旦创建了这些层，从解决方案资源管理器中将 Web、AdminConsole 和 SilverlightUpload 项目拖到表示层。类似地，将相应项目拖到其他层，如下面的屏幕截图所示。所有层都与项目映射后，右键单击画布并选择“生成依赖项”，这将显示各个项目之间的关系。箭头的方向表示从源层到目标层的调用。\n\
  \n![](img/15a62e134135dde036b0ac3cbb01dab6_418_0.png)\n\n还可以右键单击画布并选择“验证体系结构”选项，这将有助于确认体系结构是否有效。当我们验证\
  \ Fisharoo 体系结构时，它给出了一些错误，如下面的屏幕截图所示：\n\n![](img/15a62e134135dde036b0ac3cbb01dab6_419_0.png)\n\
  \n要追溯到与错误关联的源代码，你可以双击错误，它将打开关联的代码，如下所示。我们得到的错误是在表示层（Web 项目中）直接使用了数据访问层中的接口和实体。你可以修复所有此类错误，也可以选择忽略它们。\n\
  \n在接下来的过程中，我们将展示如何修复这些问题。如果我们没有遵循分层、模块化和基于对象的设计，将现有应用程序转换为 SOA 可能会极其困难。但正因为我们遵循了这些设计原则，我们只需做一些更改就可以将现有解决方案转换为基于\
  \ SOA 的应用程序。请注意，SOA 的一个关键方面是将业务逻辑作为服务公开。虽然我们将业务逻辑项目中的所有类都称为服务，但它们并不是真正的 SOA 服务。让我们看看如何将其中一个业务功能转换为服务。其他业务组件可以类似方式进行转换。我们将使用\
  \ **Windows Communication Foundation (WCF) 4** 来实现我们的服务。\n\n## 将业务逻辑启用为服务\n\n你需要按照以下步骤将现有业务逻辑转换为\
  \ WCF 服务：\n\n- 1. 我们使用 Entity Framework 的基于实体对象的方法（默认选项）构建了数据访问层。对于 SOA 设计，我们需要使用基于自跟踪实体的解决方案。右键单击\
  \ Fisharoo.edmx 设计器，选择 **添加代码生成项**，然后选择 **ADO.Net 自跟踪实体生成器** 模板，并提供模型的名称。它将生成 `Fisharoo.Model.Context.tt`\
  \ 和 `FisharooModel.tt` 作为基于文本转换工具包的文件。\n\n   DataAccess 项目中的实体承载数据并跨层移动。我们将创建一个独立的类库项目作为\
  \ Entities，并将 `Fisharoo.Model.tt` 及其关联的实体类移到该项目下。我们还将把扩展分部类（如 Account、Profile 等）移到这个新项目中一个名为\
  \ ExtendedEntities 的文件夹中。现在我们的所有实体都位于 Fisharoo-Entities 命名空间下。这有助于消除 Web 项目对 DataAccess\
  \ 项目的依赖，这是我们之前在体系结构验证中遇到的一个违规情况。现在我们需要在 Web、BusinessLogic、Components 和 Common 项目中引用\
  \ Entities 项目。\n\n- 2. 现在我们将 AccountService 类（BusinessLogic 项目）转换为 WCF 服务。无 SVC\
  \ 激活是 WCF 4 的一项新功能，它允许我们将逻辑作为服务公开，而不必将该逻辑写在具有 SVC 扩展名的文件中。这就是我们在将类转换为 WCF 服务时将使用的功能。\n\
  \n- 3. 在 BusinessLogic 项目中添加对 `System.ServiceModel` 和 `Fisharoo.Entities` 程序集的引用。\n\
  \n- 4. 转到 `IAccountService.cs`，使用 `ServiceContract` 特性修饰接口，并使用 `OperationContract`\
  \ 特性修饰所有需要在服务外部公开的公共方法。如果有任何重载方法，请在 OperationContract 中使用 Name 特性，如 SaveAccount\
  \ 方法中所示。下面是我们展示的文件的相关部分：\n\n  ```csharp\n  //Fisharoo/BusinessLogic/Interfaces/IAccountService.cs\n\
  \  [ServiceContract]\n  public interface IAccountService\n  {\n      [OperationContract]\n\
  \      bool UsernameInUse(string Username);\n      [OperationContract]\n      bool\
  \ EmailInUse(string Email);\n      ...\n      [OperationContract(Name = \"SaveAccountWithScore\"\
  )]\n      void SaveAccount(Account account, BoardPost.ScoreInput value);\n     \
  \ ...\n  }\n  ```\n\n  在 **Entities** 项目中生成的 Account 等实体已经使用 DataContract 特性进行了标记，因此无需修改它们。\n\
  \n- 5. 要托管 WCF 服务，我们需要创建服务主机。使用 **WCF 服务应用程序** 项目模板创建 WCFServiceHost 项目。同时添加对 BusinessLogic\
  \ 项目的引用。\n\n- 6. 更新 WCFServiceHost 配置文件中的相对地址：\n\n  ```xml\n  <system.serviceModel>\n\
  \      <serviceHostingEnvironment multipleSiteBindingsEnabled=\"true\"\n      aspNetCompatibilityEnabled=\"\
  false\">\n          <serviceActivations>\n              <add relativeAddress=\"\
  AccountService.svc\"\n              service=\"Fisharoo.BusinessLogic.AccountService\"\
  />\n          </serviceActivations>\n      </serviceHostingEnvironment>\n      <behaviors>\n\
  \          <serviceBehaviors>\n              <behavior>\n                  <serviceMetadata\
  \ httpGetEnabled=\"true\"/>\n                  <serviceDebug includeExceptionDetailInFaults=\"\
  true\"/>\n              </behavior>\n          </serviceBehaviors>\n      </behaviors>\n\
  \  </system.serviceModel>\n  ```\n\n  请注意，此 .config 文件未提及终结点和行为信息，因为它使用了默认信息。WCF\
  \ 4 的这一功能有助于降低 WCF 配置的复杂性。\n\n  如果你打算为每个服务提供终结点和绑定，可以按照以下方式操作：\n\n  ```xml\n  <system.serviceModel>\n\
  \      <services>\n          <service name=\"Fisharoo.BusinessLogic.AccountService\"\
  \ behaviorConfiguration=\"AccountServiceBehavior\">\n              <endpoint name=\"\
  AccountServiceEndpt\" address=\"\" binding=\"basicHttpBinding\" contract=\"Fisharoo.BusinessLogic.Interfaces.IAccountService\"\
  \n                  bindingConfiguration=\"AccountBinding\" ></endpoint>\n     \
  \     </service>\n      </services>\n      <serviceHostingEnvironment multipleSiteBindingsEnabled=\"\
  true\" aspNetCompatibilityEnabled=\"true\">\n          <serviceActivations>\n  \
  \            <add relativeAddress=\"AccountService.svc\" service=\"Fisharoo.BusinessLogic.AccountService\"\
  />\n          </serviceActivations>\n      </serviceHostingEnvironment>\n      <behaviors>\n\
  \          <serviceBehaviors>\n              <behavior name=\"AccountServiceBehavior\"\
  >\n                  <serviceMetadata httpGetEnabled=\"true\" />\n             \
  \     <serviceDebug includeExceptionDetailInFaults=\"true\"/>\n              </behavior>\n\
  \          </serviceBehaviors>\n      </behaviors>\n      <bindings>\n         \
  \ <basicHttpBinding>\n              <binding name=\"AccountBinding\" allowCookies=\"\
  true\">\n              </binding>\n          </basicHttpBinding>\n      </bindings>\n\
  \  </system.serviceModel>\n  ```\n\n  > 确保 DataAccess 项目的连接字符串在 WCFServiceHost 项目的\
  \ `.config` 中进行了配置。\n\n  ```xml\n  <connectionStrings>\n      <add name=\"FisharooDataContext\"\
  \n           connectionString=\"metadata=res://*/Fisharoo.csdl|res://*/Fisharoo.ssdl|res://*/Fisharoo.msl;\n\
  \           provider=System.Data.SqlClient;\n           provider connection string=&quot;Data\
  \ Source=.\\SQLEXPRESS;Initial Catalog=Fisharoo;Integrated Security=True;MultipleActiveResultSets=True&quot;\"\
  \n           providerName=\"System.Data.EntityClient\" />\n  </connectionStrings>\n\
  \  ```\n\n- 7. 确保 DataAccess 程序集被显式加载，以便成功建立数据库连接。程序集在 BusinessLogic 层的 AccountService.cs\
  \ 构造函数中被显式加载，如下所示：\n\n  ```csharp\n  public AccountService()\n  {\n      MEFManager.Compose(this);\n\
  \      Assembly.Load(\"FisharooDataAccess\");\n  }\n  ```\n\n  这是一种快速完成的方式。更优雅的方式是在\
  \ .config 文件中指定程序集名称，并从那里读取它，而不是硬编码。\n\n- 8. 现在我们已经准备好客户端使用服务。为此，我们需要在 Web 项目中为\
  \ Account 服务添加服务引用（AccountProxy）。\n\n  最终我们将服务托管在 IIS 上，但目前我们需要从 ASP.NET 环境中添加代理\
  \ URL。如果我们将其留给 ASP.NET 运行时，它每次运行服务时都会分配一个新端口。但是，我们希望为生成的代理分配一个静态端口。因此，我们在服务项目属性中为其分配了一个静态端口。我们将端口设置为\
  \ 63043。\n\n  要生成服务代理，右键单击 Web 项目，选择添加服务引用，并提供服务的 URL：http://localhost:63043/AccountService.svc\n\
  \n  请记住，在 WcfServiceHost 的 .config 中，我们为 AccountService 提供了相对地址，上述 URL 在 machinename:port\
  \ 之后必须使用相同的相对地址。\n\n  将服务代理命名为 AccountProxy，点击页面上的“高级”按钮，将出现“服务引用设置”窗口。勾选“在所有引用的程序集中重用类型”复选框，如下面的屏幕截图所示，然后点击“确定”，代理将在\
  \ Web 项目下创建。\n\n  ![](img/15a62e134135dde036b0ac3cbb01dab6_423_0.png)\n\n我们可以通过两种方式应对这一设计变更。我们可以用完全自治的方式设计服务操作，包含所有相关的输入输出参数；也可以将\
  \ HttpContext 和 Session 信息传递给 WCF 服务。\n\n10. 虽然第一种方法是更好的方案，但它的侵入性更强，需要我们对代码做出更多更改。目前我们先采用第二种方案。为此，我们需要添加一个特性来修饰我们的服务：\n\
  \n```\n[AspNetCompatibilityRequirements(RequirementsMode = AspNetCompatibilityRequirementsMode.Required)]\n\
  public class AccountService : IAccountService\n```\n\n并且在 WcfServiceHost 项目的 web.config\
  \ 文件中，将 aspNetCompatibilityEnabled 设置为 true。\n\n```\n<system.serviceModel>\n   \
  \ <serviceHostingEnvironment multipleSiteBindingsEnabled=\"true\" aspNetCompatibilityEnabled=\"\
  true\">\n        <serviceActivations>\n            <add relativeAddress=\"AccountService.svc\"\
  \ service=\"Fisharoo.BusinessLogic.AccountService\"/>\n        </serviceActivations>\n\
  \    </serviceHostingEnvironment>\n</system.serviceModel>\n```\n\n至此，我们已经完成了将 AccountService\
  \ 转换为 WCF 服务，并在 Web 客户端项目中调用它的工作。\n\n## Web 服务器与应用服务器——Windows IIS 7.5 和 AppFabric\n\
  \n我们必须将表示层和应用层部署到可扩展的软件上，这一点非常重要。我们将使用 Windows Internet 信息服务（IIS）7.5 来部署表示层（Web\
  \ 项目），并使用 Windows Server AppFabric 来部署服务、业务逻辑和数据访问逻辑。\n\nWindows Server AppFabric\
  \ 是微软提供的一个服务器，用于托管和管理 WCF 与工作流基础（WF）服务，同时还提供分布式缓存服务。它需要安装在 IIS 7 或更高版本之上。Web 项目和\
  \ WcfServiceHost 项目在 IIS 中的部署可以按以下步骤完成。\n\n请确保你已安装 IIS 7.5（假设你运行在 Windows Server\
  \ 2008 R2 上）。Windows Server AppFabric 是免费软件，可以从以下网站下载：\n\nhttp://www.microsoft.com/downloads/en/details.aspx?displaylang=en&FamilyID=467e5aa5-c25b-4c80-a6d2-9f8fb0f337d2\n\
  \n### 扩展\n\n有关该软件的安装与配置信息，你可以参考以下链接：http://msdn.microsoft.com/en-us/library/ff637707.aspx\n\
  \n安装完成后，启动 IIS 并按以下步骤部署 Web 项目：\n\n- 右键单击**默认网站**，选择**添加应用程序**。\n- 提供应用程序池的别名，并确保你选择一个在\
  \ .NET v 4.x.x.x 下运行的专用应用程序池（可以在**应用程序池**节点下创建专用应用程序池）。\n\n![](img/15a62e134135dde036b0ac3cbb01dab6_426_0.png)\n\
  \n> 应用程序必须拥有一个专用的应用程序池，这一点非常重要。这有助于确保必要的应用程序隔离级别，因为每个应用程序池都运行在独立的 w3wp 进程中。如果多个应用程序在同一个应用程序池下运行，而其中一个应用程序出现任何问题导致\
  \ w3wp 崩溃，那么在同一 w3wp 下运行的其他应用程序也会崩溃。\n\n这样，你就会看到 **Fisharoo** Web 应用程序已创建在默认网站下。\n\
  \n现在，我们来看看如何部署服务。为此，首先需要打包服务。打包时，选择 WcfServiceHost 项目，右键单击，并提供打包属性，例如**将部署包创建为 zip\
  \ 文件**选项、部署包的创建位置以及 Web 应用程序名称。\n\n![](img/15a62e134135dde036b0ac3cbb01dab6_427_0.png)\n\
  \n完成这一步后，右键单击该项目并选择**生成部署包**。这将创建一个部署包，我们需要将其导入 IIS。右键单击**默认网站 | 部署 | 导入**，并提供导入路径。\n\
  \n这样服务就会被安装。你可以通过 AppFabric 的仪表板来配置、管理和监控 WCF 服务。\n\n## Web 场\n\n**Web 场**（或负载均衡）是指将网站流量分散到多台服务器上的概念。通过扩展基础设施并在多台服务器之间分担负载，它可以解决应用程序或服务器层面的大部分性能问题。一般来说，负责负载均衡的人会查看你服务器场中的所有服务器，并将用户路由到负载最低的服务器。实现这一目标有多种方式，我们将对其中许多方式做简要介绍。\n\
  \n我们假设你有兴趣了解如何在 Windows 环境中创建 Web 场。\n\n> 如果你需要 Linux 解决方案，可以尝试 **HAProxy**（http://haproxy.1wt.eu/）或类似的软件。\n\
  \n具体来说，我们将讨论如何使用 Windows 的**网络负载均衡（NLB）**来搭建 Web 场。这样你就可以在网络中的单个虚拟 IP 地址后面托管多台服务器。\n\
  \n要实现这一点，服务器场中的每台服务器都必须配置成完全相同，这样发送到任何服务器的任何请求都会以相同的方式处理。当请求到达虚拟 IP 地址时，数据包会被路由到最不繁忙的服务器。这种配置支持可靠服务的概念。也就是说，如果一台服务器出现故障，服务器场会自动重新平衡，并将流量路由到仍然正常运行的服务器。\n\
  \n要搭建这样的环境，你至少需要两台运行 Windows Server 2008 的机器。每台机器都需要有一个固定的 IP 地址。虽然机器可以只使用一块网卡，但最好使用两块——一块网卡使用固定\
  \ IP 地址，另一块使用虚拟 IP 地址。这些 IP 地址必须位于同一个 C 类网络上。\n\nWindows Server 2008 预装的功能有限。你需要在其上启用**网络负载均衡**。为此，请从**管理工具**进入**服务器管理器**，在**功能**部分选择**添加功能**选项。\n\
  \n![](img/15a62e134135dde036b0ac3cbb01dab6_429_0.png)\n\n安装完成后，从**管理工具**中打开**网络负载均衡管理器**。右键单击**网络负载均衡群集**，选择**新建群集**，然后继续按照向导步骤配置负载均衡。\n\
  \n有关在 Windows Server 2008 中设置网络负载均衡 Web 场的更详细信息，请参阅：\n\n- http://technet.microsoft.com/en-us/library/cc771300(WS.10).aspx\n\
  - http://www.techotopia.com/index.php/Building_a_Windows_Server_2008_Network_Load_Balancing_Cluster\n\
  - http://telnetport25.wordpress.com/2008/03/24/quick-tip-configuring-network-load-balancing-nlb-on-windows-2008-for-exchange-cas-servers/\n\
  \n## 缓存\n\n通常，缓存就是从后端数据库获取某些数据或对象，并将它们存储在内存中以供以后使用。当我们需要数据/对象时，可以直接从缓存（内存）中检索。就数据库数据缓存而言，我们可以将查询结果存储到内存中。这意味着当我们再次需要这些信息时，不必进行服务器与服务器之间的连接，不必等待查询执行，也不必等待结果返回。我们可以直接从\
  \ RAM 中获取数据。沿着这条链路再向前一步，我们可以获得更多的优化。我们可以从数据库获取数据，解析这些数据，构建一个完全填充（hydrated）对象的列表，然后将该列表存储在缓存中。这意味着除了跳过数据库相关操作外，我们还可以跳过对象的创建和填充过程。\n\
  \n### 扩展\n\n缓存与索引一样，也有一些缺点。如果我们把数据放入缓存，然后从数据库中修改或删除这些数据，我们可能会发现网站使用的是过期数据。例如，如果我们尝试使用一个已不存在的账户来创建博客条目，就会收到数据库错误。因此，在实现缓存层时，我们必须保持警惕，确保数据保持干净。\n\
  \n另一个问题是，如果缓存中的数据已过期但仍然有效，我们最终可能会向用户显示不正确的数据。同样，我们也必须维护干净数据这一方面！\n\n还有一个方面是决定缓存多少数据。缓存过多数据会导致内存不足问题，因为缓存数据会消耗服务器内存。如果打算缓存大量数据，就应该规划配备大内存（多\
  \ GB 到 TB）的服务器，这在社交网站中很常见。\n\n### 缓存——AppFabric 解决方案\n\nWindows Server AppFabric\
  \ 缓存服务非常适用于在分布式和非分布式场景中构建高度可扩展且可用的应用程序。让我们看看如何在我们的解决方案中使用它。\n\n#### 客户端\n\n在 Components\
  \ 项目中，创建一个 AppFabricCache 类。该类将实现 ICache 接口，并公开 AppFabric 缓存 API。与 AppFabric 缓存服务所能提供的功能相比，当前的\
  \ ICache 接口（我们在第 2 章中曾介绍过）方法有限。不过目前我们将只保留这些方法。如果你打算使用更多 AppFabric API，可以在 ICache\
  \ 接口中添加相应的方法签名，并在 AppFabricCache.cs 类中实现这些方法。\n\n我们需要在 Components 项目中添加对以下 AppFabric\
  \ 缓存程序集的引用。\n\n- `Microsoft.ApplicationServer.Caching.Client.dll`\n- `Microsoft.ApplicationServer.Caching.Core.dll`\n\
  \n这些程序集包含应用程序将使用的缓存方法。这些程序集可以在 ~:\\Windows\\System32\\AppFabric 文件夹中找到。\n\nAppFabricCache\
  \ 包装类及相关方法如下所示。我们实现了一些 get 和 set 方法。AppFabric 缓存服务还提供了许多其他 API 可以包装，但为了简单起见，我们只关注这两个方法，其他方法我们只是抛出异常。有关该类的完整代码，请参见本章附带的代码。\n\
  \n\n\n\n\n```csharp\n//Fisharoo/Components/AppFabricCache.cs\nusing System.Web.Caching;\n\
  using System.ComponentModel.Composition;\nusing Microsoft.ApplicationServer.Caching;\n\
  \nnamespace Fisharoo.Components\n{\n    [Export(typeof(ICache))]\n    public class\
  \ AppFabricCache : ICache\n    {\n        private static DataCache dataCache;\n\
  \        private static TimeSpan timeSpan = new TimeSpan(\n            Settings.Default.DefaultCacheDuration_Days,\n\
  \            Settings.Default.DefaultCacheDuration_Hours,\n            Settings.Default.DefaultCacheDuration_Minutes,\
  \ 0);\n\n        private static DataCacheFactory dataCacheFactory;\n        private\
  \ static string namedCache = \"FisharooCachedData\";\n\n        static AppFabricCache()\n\
  \        {\n            if (dataCacheFactory == null)\n            {\n         \
  \       dataCacheFactory = new DataCacheFactory();\n                dataCache =\
  \ dataCacheFactory.GetCache(\"FisharooCachedData\");\n            }\n        }\n\
  \n        public object Get(string cache_key)\n        {\n            return dataCache.Get(cache_key);\n\
  \        }\n\n        public void Set(string cache_key, object cache_object)\n \
  \       {\n            dataCache.Put(cache_key, cache_object);\n        }\n    }\n\
  }\n```\n\n## 扩展\n\n首先，我们使用 MEF 通过 Import 特性将 ICache 插入我们的类中。\n\n在 GetFoldersByAccountID()\
  \ 中，我们检查 Folders 是否存在于缓存中，如果存在则直接从缓存返回。如果缓存中不存在，我们调用 FolderRepository 中的相应方法，并确保将返回值存储到缓存中。\n\
  \n在 DeleteFolder() 中，首先检查 Folder 是否存在于缓存中。如果存在，我们从缓存对象中移除该文件夹，然后还使用 FolderRepository.DeleteFolder()\
  \ 方法将其从后端删除。\n\n如果数据过期，还应考虑如何使缓存数据失效。可以使用 AppFabric 的通知服务功能来实现这一点。\n\nWindows Server\
  \ AppFabric 为缓存数据提供了故障转移解决方案，而在 AppFabric 之前，基于 State Server 或 SQL Server 的 OutProc\
  \ 缓存解决方案是无法实现这一点的。它在分布式缓存中有更多应用，并覆盖更多不同类型的缓存需求。有关 Windows Server AppFabric 的更多详细信息，请查看\
  \ http://msdn.microsoft.com/en-us/windowsserver/ee695849.aspx。\n\n### 缓存——MemCached\
  \ 解决方案\n\nhttp://memcached.org/about 页面解释：\n\n> memcached 是一个高性能、分布式的内存对象缓存系统，本质上很通用，但旨在通过减轻数据库负载来加速动态\
  \ Web 应用程序。\n\n简而言之，MemCached 软件允许你在 Web 服务器场内创建一个服务器场。该工具用于创建和管理状态服务器场。这个服务器场中可以容纳的服务器数量没有任何限制。该工具也没有任何硬件要求。这意味着你可以轻松地用一些内存很大的廉价\
  \ Linux 机器来搭建，并根据应用程序的需求扩展你的状态服务器场。\n\n你说 Linux？我们之前也这么说。不过别担心。MemCached 已经移植到 Windows\
  \ 平台，现在以 MemCached for Windows 的形式提供（http://code.google.com/p/memcached/wiki/PlatformWindows）。从硬件角度来看，同样的规则也适用于这个产品。我们之所以提到\
  \ Linux 选项，是因为你设置的每个 Windows 实例都需要为新机器和操作系统支付初始费用。另一方面，Linux 机器可以是一群停用的台式机，再加上一份你喜欢的免费\
  \ Linux 发行版。这种缓存实现可以为你提供与 AppFabric 缓存解决方案完全相同的功能。你可以将会话包装器（在我们的例子中是 Context）指向你的\
  \ memcache 实现。\n\n### 服务器\n\n从“缓存”部分给出的 URL 获取 Windows 版本的 MemCached。你可以下载程序集或源代码。如果下载了源代码，需要构建解决方案。拿到程序集后，你可以将其解压/放入本地驱动器上的某个目录。安装好程序集后，可以按照以下简单步骤操作：\n\
  \n- 1. 将程序集解压到你想要的目录（例如 c:\\memcached）。\n- 2. 使用以下命令安装服务：\n  - `c:\\memcached\\\
  memcached.exe -d install`\n- 3. 从 Microsoft 管理控制台或运行以下命令启动服务器：\n  - `c:\\memcached\\\
  memcached.exe -d start`\n- 4. 使用服务器，默认监听端口 11211。\n\n如果需要，你可以在每台服务器上运行该程序的多个实例。也可以更改运行服务器的端口。如果愿意，你可以为每个应用程序运行不同的实例。\n\
  \n就是这样！\n\n### 客户端\n\n安装并运行服务器后，你需要一个客户端。目前有几个可用的 C# 客户端：\n\n- https://sourceforge.net/projects/memcached-dotnet/\n\
  - http://code.google.com/p/beitmemcached/\n- http://memcached.enyim.com\n\n还有大量用于其他语言的客户端。\n\
  \nhttp://memcached.org/\n\n在我们的实现中，我们将使用 Enyim Memcached 客户端。我们已在多个项目中使用过这个客户端，没有发现任何问题。这个客户端以一个解决方案的形式提供，你可以从\
  \ codeplex.com 获取。它包含一个测试客户端、实际代码等。我们从该解决方案中取出 Enyim.Caching 项目，并将其插入到我当前的项目解决方案中。\n\
  \n有了这些，你就可以从项目中添加对 Enyim.Caching 的引用。\n\n### 使用客户端\n\n有了这个新客户端，我们就可以创建一个新的缓存包装器，它继承自我们当前缓存包装器相同的接口。\n\
  \n我们将这个新的缓存包装器命名为 MemcachedCache。这里的主要区别在于我们使用了不同的 MemCached 可插拔特性。\n\n```csharp\n\
  //Fisharoo/Components/MemcachedCache.cs\nusing System.ComponentModel.Composition;\n\
  using System.Web.Caching;\nusing Enyim.Caching;\nusing Enyim.Caching.Memcached;\n\
  \nnamespace Fisharoo.Components\n{\n    [Export(typeof(ICache))]\n    public class\
  \ MemcachedCache : ICache\n    {\n        private MemcachedClient cache;\n\n   \
  \     public MemcachedCache()\n        {\n            cache = new MemcachedClient();\n\
  \n            List<string> keys = new List<string>();\n            cache.Store(StoreMode.Add,\
  \ \"keys\", keys);\n        }\n        public object Get(string cache_key)\n   \
  \     {\n            return cache.Get(cache_key);\n        }\n        ............\n\
  \    }\n}\n```\n\n### 业务逻辑层中的缓存\n\n现在，我们可以将缓存概念接入到现有的业务逻辑层中。例如，我们将把它添加到 FolderService\
  \ 中。具体来说，我们将专门针对 GetFoldersByAccountID()。\n\n```csharp\n//Fisharoo/BusinessLogic/FolderService.cs\n\
  public List<Folder> GetFoldersByAccountID(int AccountID)\n{\n    //CHAPTER 13, Implemented\
  \ a sample for Caching\n    List<Folder> cachedFolders = _cacheService.Get(AccountID.ToString())\n\
  \        as List<Folder>;\n    if (cachedFolders != null)\n    {\n        return\
  \ cachedFolders;\n    }\n    else\n    {\n        cachedFolders = _folderRepository.GetFoldersByAccountID(AccountID);\n\
  \        _cacheService.Set(AccountID.ToString(),\n            cachedFolders);\n\
  \        return cachedFolders;\n    }\n}\n```\n\n缓存不只是处理数据库调用。同样值得对那些执行长时间处理并返回不会随每次调用而改变的结果集的复杂代码进行包装。可以考虑用缓存包装的地方包括数据库、文件系统访问、Web\
  \ 服务结果等。\n\n在实现缓存层时，要谨慎考虑添加新数据时会发生什么，更重要的是删除数据时会发生什么。如果添加的数据不在缓存中，更新缓存项可能重要也可能不重要。但是，将已删除的数据留在缓存中几乎从来都不是一个好主意！因此，我们想在\
  \ **删除** 方法中添加一些代码，从缓存条目中移除已删除的文件夹。\n\n```csharp\n//Fisharoo/BusinessLogic/FolderService.cs\n\
  public void DeleteFolder(Folder folder)\n{\n    //CHAPTER 13 - first removing the\
  \ folder from the cache\n    if (_cacheService.Exists(folder.AccountID.ToString()))\n\
  \    {\n        _cacheService.Delete(folder.AccountID.ToString());\n    }\n    //actual\
  \ physical delete\n    _folderRepository.DeleteFolder(folder);\n}\n```\n\n现在，当用户删除文件夹时，如果缓存中存在该文件夹，我们会将其从缓存中移除。然后，当用户获取曾经包含已删除文件夹的文件夹列表时，我们将重新构建列表，而不是在缓存中找到它。\n\
  \n\n\n\n\n## 配置\n\n我们演示了三种缓存方案：一种使用 System.Web.Caching（参见代码中的 Cache.cs），一种使用 AppFabric\
  \ Caching，最后一种使用 MemCached。为此，我们构建了一个接口 ICache，并在 Components 项目中分别针对每种方案实现了具体的包装类\
  \ Cache.cs、AppFabricCache.cs 和 MemcachedCache.cs。\n\n在实际环境中，你只需要一种方案；而我们展示了三种，是为了让你能够逐一理解每种方案。当你真正要运行项目时，应该只使用一种缓存实现，并从\
  \ Components 项目中排除另外两个缓存类实现，因为如果不这样做，MEF 在运行时就会抛出异常。这是因为 MEF 会发现 ICache 接口有三个匹配的导入（来自三个类实现），而组合容器将不知道应该使用哪一个。\n\
  \n不过，MEF 也通过提供 ImportMany 特性解决了此类问题，该特性可以将多个匹配的 Import 接口对应到一个 Export 接口。或者，也可以在\
  \ [Metadata] 特性中注明匹配导入的优先级，优先级最高的导入会被分配。但为了简单起见，你可以在这里排除另外两个类文件。\n\n### 我应该从哪里开始？\n\
  \n要了解缓存应该放在哪里，最简单的方法是分析网站的性能，找出最慢的部分。有时候，某些代码段可能通过调整来获得更好的性能。但通常也存在一些已经高度优化的代码段，它们已经无法运行得更快了。这些区域可能更适合使用缓存包装器。要从缓存中获得显著收益，你不一定需要将项目长期存放在缓存中。哪怕只缓存几秒钟，你也能看到效果。关键在于你的数据变化的频率，以及用户访问该数据的频率。如果数据不断变化且被频繁访问，哪怕只缓存几秒钟也能带来巨大的收益。如果数据变化不大，你可以将其放入缓存，只在数据变化时移除。\n\
  \n## 电子邮件\n\n发送电子邮件怎么会让网站变慢？如果你想一想正常的邮件发送过程，就会发现 Web 服务器至少必须连接到 SMTP 服务器。这个连接可能会耗费时间。如果你需要发送数百封邮件，那么你可能需要建立同样多的\
  \ SMTP 服务器连接。\n\n为了减少这种缓慢，我们将构建一个系统，允许我们将邮件塞进队列，然后由另一个系统稍后发送。这将大大改善用户体验，因为用户不必等待\
  \ Web 服务器建立到 SMTP 的连接并发送邮件。相反，我们会将邮件塞进队列，并假设邮件将从另一个系统投递出去。这些邮件在投递前会有一些延迟，但针对我们社区网站的需求，我们并不期望用户需要实时通信。\n\
  \n到目前为止，我们已经从硬件和缓存的角度讨论了加速网站的方法。我们确信，不需要太多说服，你也会认为这些都是从网站中压榨出最后一点性能的明智之处。现在，我们将从基础设施的角度来讨论加速网站。具体来说，我们将研究如何处理邮件处理过程，以减少网站直接需要建立的网络连接数量。\n\
  \n> 将系统间通信排队的概念并不新鲜。几乎任何不需要实时反馈的通信都可以做到这一点。任何异步通信都是首选候选。而且你不一定需要把数据库当作队列。你可以使用 MSMQ、文件系统或任何其他响应迅速的本地或半本地资源。尽管技术差异很大，但概念基本上相同。\n\
  \n具体来说，每当你的网站需要连接到外部服务器——比如 FTP、HTTP 或 SMTP——网站在尝试建立连接时都会受到重大影响，而一旦连接成功，还要实际与第三方资源进行交互。每当我们能想出办法消除这种连接时，用户都会高兴得多。从用户的角度来看，他们想创建一条消息、点击一个按钮，然后得到关于他们的消息是否已发送的反馈。我们可以通过允许他们创建消息、将其塞入数据库，然后告诉用户消息已发送来模拟这个过程。与数据库建立连接进行事务处理比与\
  \ SMTP 服务器建立连接要快得多。因此，我们将消息存储在数据库中，并让另一个应用程序稍后处理外发邮件。\n\n### 创建用于发送电子邮件的服务\n\n目前我们有一个\
  \ Email 类，它负责创建电子邮件、实际连接基础设施，以及最终发送电子邮件。你会同意这个类被赋予了过多职责。因此，我们将把基础设施和发送电子邮件的功能转移到\
  \ EmailService 中。\n\n### 扩展\n\n该服务一开始将有一个方法——Send()。该方法负责接收一个 MailMessage，通过 SmtpClient\
  \ 连接到邮件服务器，最后发送电子邮件。\n\n```csharp\n//Fisharoo/BusinessLogic/EmailService.cs\npublic\
  \ void Send(MailMessage Message)\n{\n    Message.Subject = _configuration.SiteName\
  \ + \" - \" +\n                      Message.Subject;\n    SmtpClient smtp = new\
  \ SmtpClient();\n    smtp.Send(Message);\n}\n```\n\n然后我们将进入 Email 类，修改 Send() 方法的实现，使其调用\
  \ EmailService：\n\n```csharp\n//Fisharoo/Components/Email.cs\nprivate void Send(MailMessage\
  \ Message)\n{\n    _emailService.Send(Message);\n}\n```\n\n现在我们的基础设施已经稍微分离出来，我们可以解决将电子邮件以某种队列形式存储而不是直接发送的需求。为此，我们将首先解决队列需求。我们将使用数据库中的队列。\n\
  \n> 我们也可以轻松地使用 MSMQ 或带有一些 XML 文件的文件系统。与其给项目添加新东西，我们不如基于现有框架进行构建！\n\n### 数据库\n\n\
  我们需要构建三张表。每张表的结构完全相同，但用途不同。我们会有一张接收表，用于接收新邮件。这张表不能被中断。我们希望能够在处理现有邮件的同时接收新邮件。为此，我们需要一张工作表，将需要处理的所有邮件放入其中。最后，由于我们记录了所有已发送的通信，我们还会有一张历史表。这张表将保存我们随时间处理的所有邮件。\n\
  \n我们的表将保存序列化后的电子邮件。这意味着我们将实际拥有完整的、按发送时状态存储的邮件。这也意味着如果我们有需要，可以轻松地对一批邮件重新序列化以重新发送。这些表之间唯一不同的就是它们的名称！\n\
  \n为了处理收到的邮件，我们可能需要超出 LINQ 的设计范围。因此，我们将创建几个存储过程来帮助我们。我们将有两个过程——一个用于将接收表中的数据放入工作表，另一个用于将工作表中的数据放入历史表。这只是一个想法，不是实际实现！\n\
  \n```sql\ncreate procedure [dbo].[pr_MailQueue_SwapReceivingAndWorking_GetWorking]\n\
  as\nbegin tran\n--rename working to temp\nexecute sp_rename\n    @objname = 'MailQueue_Working',\n\
  \    @newname = 'MailQueue_Temp'\n--rename receiving to working\nexecute sp_rename\n\
  \    @objname = 'MailQueue_Receiving',\n    @newname = 'MailQueue_Working'\n--rename\
  \ temp to receiving\nexecute sp_rename\n    @objname = 'MailQueue_Temp',\n    @newname\
  \ = 'MailQueue_Receiving'\nselect * from MailQueue_Working\ncommit tran\n```\n\n\
  这个过程以一种比实际移动数据更高效的方式将数据从一张表移动到另一张表。我们首先将工作表（此时是一张空表）重命名为 MailQueue_Temp。然后我们将接收表（一张满表）重命名为\
  \ MailQueue_Working。最后，我们将临时表重命名为 MailQueue_Receiving，以便继续收集新邮件。完成这些操作后，我们返回工作表中的所有记录。如果这个过程运行得不够频繁，你可能会发现这张表中的数据比你单次能处理的数据还要多。因此，你需要么更频繁地处理，要么修改选择逻辑以分页选择数据。我们的实现将假设你处理队列足够频繁，使处理器永远不会过载。\n\
  \n下一个过程 pr_MailQueue_MoveWorkingToHistory 在我们的邮件处理器完成工作后进行清理。\n\n```sql\ncreate\
  \ procedure [dbo].[pr_MailQueue_MoveWorkingToHistory]\nas\nbegin tran\n```\n\n\n\
  \n```csharp\n{\n    using (FisharooDataContext dc = conn.GetContext())\n    {\n\
  \        dc.MailQueue_Receivings.InsertOnSubmit(MailQueue);\n        dc.SubmitChanges();\n\
  \    }\n}\npublic List<pr_MailQueue_SwapReceivingAndWorking_GetWorkingResult>\n\
  \    GetMailQueueToProcess()\n{\n    List<pr_MailQueue_SwapReceivingAndWorking_GetWorkingResult>\n\
  \        results = new List<pr_MailQueue_SwapReceivingAndWorking_GetWorkingResult>();\n\
  \    using (FisharooDataContext dc = conn.GetContext())\n    {\n        results\
  \ =\n        dc.pr_MailQueue_SwapReceivingAndWorking_GetWorking().ToList();\n  \
  \  }\n    return results;\n}\npublic void MoveMailQueueWorkingToHistory()\n{\n \
  \   using (FisharooDataContext dc = conn.GetContext())\n    {\n        dc.pr_MailQueue_MoveWorkingToHistory();\n\
  \    }\n}\n```\n\n## 服务\n\n在存储库和数据库就绪之后，我们需要创建一个新的服务。我们已经有一个通过SMTP服务器直接发送邮件的EmailService。但我们需要的是一种可以替代EmailService的新服务——DBMailService。该服务需要符合我们的IEmailService接口，这样我们的应用程序就无需知道邮件是如何发送的。\n\
  \n回想一下，我们的EmailService只有一个方法——Send()。我们将有一个Send()方法，将邮件存入新的EmailRepository。但我们的DBMailService还需要一种让邮件处理器处理邮件的方式。所以我们需要第二个方法ProcessEmails()。\n\
  \n```csharp\n//Fisharoo/BusinessLogic/EmailService.cs\npublic void Send(MailMessage\
  \ Message)\n{\n```\n\n另一方面，ProcessEmails()方法稍微复杂一些。首先也是最重要的一点是，这个方法应该一次只运行一个。我们不希望这个方法被任何东西访问，所以需要锁定它。接下来，我们需要获取要处理的邮件列表。然后遍历每封邮件。注意，在遍历邮件消息时，我们正在对每条消息进行反序列化（稍后我们将介绍这一点）。然后我们连接到邮件服务器并发送邮件。\n\
  \n> 与其连接到IIS SMTP服务器或其他非批量发送应用程序，不如连接到PMTA之类的批量邮件投递系统。这些系统会使这个过程更快，因为它们像数据库一样接收邮件，并在接收后处理邮件。IIS\
  \ SMTP会尝试立即发送，这可能会导致任何尝试发送邮件的应用程序出现延迟。\n\n由于我们向DBMailService添加了一个新方法，我们还需要更新IEmailService接口和EmailService类（以便在所有情况下都能通过MEF获取DBMailService和EmailService）。为此，请为EmailService添加一个针对ProcessEmails()方法的新方法。此方法将抛出一个错误，因为我们不打算实现它。\n\
  \n```csharp\npublic void ProcessEmails()\n{\n    throw (new Exception(\"ProcessEmails\
  \ is not implemented by this class!\"));\n}\n```\n\n## 序列化邮件\n\n开始本节时，我们得先发点牢骚！我们试图通过队列进程发送MailMessage。这意味着我们需要能够序列化MailMessage。我们认为很多人需要类似的功能，要么将其塞入数据库，要么放入MSMQ，要么放到文件系统。然而MailMessage不可序列化！\n\
  \n这个问题有两种方法。我们可以深入MailMessage的序列化过程，指定MailMessage中每个对象的序列化方式。或者我们可以伪造序列化。深入研究并重写序列化本身就可以写成一章。所以我们打算伪造它。\n\
  \n为了伪造这个过程，我们创建了一个名为MyMailMessage的类，其中包含一个子类MailAddress。这包含了我们目前在邮件中需要表示的所有特性。我们避开了标题、附件等。目前，我们只关心发件人、收件人、主题、正文以及其他一些内容。\n\
  \n```csharp\n//Fisharoo/BusinessLogic/MailMessageService.cs\n[Serializable]\npublic\
  \ class MyMailMessage\n{\n    public MailAddress[] Bcc { get; set; }\n    //refer\
  \ to actual file for complete code\n    public MailAddress Sender { get; set; }\n\
  \    public string Subject { get; set; }\n    [Serializable]\n    public class MailAddress\n\
  \    {\n        public string Address { get; set; }\n        public string DisplayName\
  \ { get; set; }\n    }\n}\n```\n\n请注意，它被标记为**可序列化**！\n\n有了这个基础，我们就能创建一些方法，有效地在MailMessage类和新MyMailMessage对象之间来回传输数据。\n\
  \n```csharp\n//Fisharoo/BusinessLogic/MailMessageService.cs\nprivate static MailAddressCollection\
  \ ConvertMyMailAddressesToMailAddresses(List<MyMailMessage.MailAddress> MyMailAddresses)\n\
  {\n    MailAddressCollection mac = new MailAddressCollection();\n    foreach(var\
  \ a in MyMailAddresses)\n    {\n        mac.Add(ConvertMyMailAddressToMailAddress(a));\n\
  \    }\n    return mac;\n}\nprivate static MailAddress ConvertMyMailAddressToMailAddress(MyMailMessage.MailAddress\
  \ MyMailAddress)\n{\n    MailAddress ma = null;\n    if(MyMailAddress != null &&\
  \ MyMailAddress.Address != null &&\n       MyMailAddress.DisplayName != null)\n\
  \        ma = new MailAddress(MyMailAddress.Address,\n                         \
  \    MyMailAddress.DisplayName);\n    return ma;\n}\n```\n\n最后，我们还有Serialize()和Deserialize()方法，它们借助辅助方法来操作MailMessage。\n\
  \n作为这个类的一个很好的副产品，我们还创建了SerializeEncrypted()和DeserializeEncrypted()方法，它们从Serialize()方法获取返回的字符串，并分别使用我们的Cryptography.Encrypt()和Cryptography.Decrypt()方法对其进行处理。\n\
  \n## 连接新的DBMailQueueService\n\n既然我们已经启动并运行了这个新服务，并准备进行测试，我们就可以使用MEF方法将其挂接到现有系统中，而无需更改太多现有代码。\n\
  \n### 队列\n\n现在，我们实际上能够从我们的网站收集邮件并将其存入MailQueue。由于这一新功能的实现对于网站是透明的，所有发送邮件的区域现在都会将其存入我们的队列。\n\
  \n> 请记住，您可以选择对要存储在队列中的电子邮件进行加密。考虑到有些电子邮件会包含用户密码，这或许是个好主意。只是提供一些思考！\n\n### 处理队列\n\
  \n队列中有几封邮件后，我们现在可以专注于构建一个示例处理器。我们将构建一个快速的控制台应用程序来演示这一点。从技术上讲，您可以将该控制台应用程序作为计划任务挂接到Windows服务器上。但对于生产环境，我们建议您将此控制台应用程序转换为Windows服务，后者要可靠得多（只是不太容易演示！）。\n\
  \n首先，我们添加了一个名为MailQueueProcessor的新控制台应用程序项目。我们添加了一个app.config文件。该app.config文件包含Configuration类所期望看到的所有属性的副本，以及一个指向邮件服务器的system.net/mailSettings条目。\n\
