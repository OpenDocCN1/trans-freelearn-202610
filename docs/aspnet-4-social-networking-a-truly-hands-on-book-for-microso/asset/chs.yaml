  CloudSortOrder\" value=\"Random\"/>\n        <add key=\"TagCloudSmallestFontSize\"\
  \ value=\"10\"/>\n        <add key=\"TagCloudLargestFontSize\" value=\"30\"/>\n\
  \        <add key=\"RootURL\" value=\"http://localhost:64810/\"/>\n        <add\
