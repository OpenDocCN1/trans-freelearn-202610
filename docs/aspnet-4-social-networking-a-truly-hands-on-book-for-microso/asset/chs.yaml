  \nfooternav=\"1\" pageTitle=\"\"\nroles=\"PUBLIC\"></siteMapNode>\n<!-- /FOOTER\
  \ NODES-->\n<!-- NONE NAVIGATION NODES -->\n<siteMapNode url=\"Search.aspx\" title=\"\
  Search\"\ndescription=\"Click here to perform a site\nsearch\" pageTitle=\"\"\n\
  roles=\"PUBLIC\"></siteMapNode>\n<siteMapNode url=\"Error.aspx\" title=\"Error\"\
  \ description=\"An\nerror has occurred\" pageTitle=\"\"\nroles=\"PUBLIC\"></siteMapNode>\n\
  <!-- /NONE NAVIGATION NODES -->\n</siteMapNode>\n</siteMap>\n```\n\n### 所有节点\n\n\
  默认情况下，`SiteMap` 类并不会返回所有节点，可以这么说。它为你提供了对 `RootNode` 的调用，以及对它的子节点的调用。如你在第一个方法中所见，我们只是创建了一个\
  \ `AllNodes()` 调用，它返回“所有节点”。\n\n### 导航\n\n我们的站点将有多个导航区域，包括：\n\n- 顶部导航\n- 主导航\n-\
  \ 次级导航\n- 左侧导航\n- 页脚导航\n\n如果每次需要时都要翻阅所有这些导航集合，我们可能会觉得很麻烦。取而代之的是，我们会在类中添加方法来生成所需的节点子集。\n\
  \n`PrimaryNodes()` 方法就是这类方法的第一个例子。它遍历 `AllNodes()` 方法返回的所有节点，查找带有自定义 `topnav` 属性的节点，从而生成主导航区域中的节点列表。不过，除此之外，你还会注意到一个特殊过滤器。每找到一个\
  \ `topnav` 节点，都会执行一次安全检查，以确定当前用户是否有权访问该节点。如果没有访问权限，则该节点不会显示。\n\n`FooterNodes()`\
  \ 方法与 `PrimaryNodes()` 方法完全相同，只是它查找的是 `footernav` 属性。该方法还会检查用户是否有权访问指定的节点集合。\n\n\
  ### 检查访问权限\n\n这就引出了我们在其他方法中使用的 `CheckAccessForNode()` 方法。该方法会检查传入的节点，并检查其 `Roles`\
  \ 集合。它首先检查是否指定了 `PUBLIC` 角色。如果指定了，则不再执行其余检查。然后我们继续检查是否存在账户，即是否有用户已登录。如果有用户，我们会检查他们的权限属性。如果该属性存在，我们会检查权限列表中是否有任何权限。然后我们遍历节点中指定的每个角色，并确认该账户拥有相应权限。如果账户不包含任何指定权限，则返回\
  \ false。如果所有权限都有效，则返回 true。\n\n### 安全性\n\n到目前为止，我们已经讨论了该类的导航方面。但考虑到安全性已经如此深入地融入其中，我们也应该有一些东西来检查当前节点的安全性，而不只是显示链接。这就引出了\
  \ `CheckAccessForCurrentNode()` 方法。\n\n`CheckAccessForCurrentNode()` 方法包装了 `CheckAccessForNode()`\
  \ 方法，并传入当前 SiteMap 节点。如果当前节点具有足够的访问权限，则不执行任何操作。但是，如果对当前节点的访问被拒绝，则用户将通过 `Redirector`\
  \ 类自动重定向到访问被拒绝页面。\n\n### 实现导航和安全性\n\n有了这个包装器，我们现在就可以轻松地限制用户访问的位置以及他们看到的导航形式。我们只需调用这个类中的方法，就能获取相应导航区域的节点列表。我们还需要在某个全局位置调用\
  \ `CheckAccessForCurrentNode()` 方法。\n\n在我们的案例中，这些调用将从母版页发出，因为它同时控制全局访问和导航显示。因此，我们要做的第一件事就是在\
  \ `Site.Master.cs` 页面的 `Page_Load()` 方法中添加对 `CheckAccessForCurrentNode()` 的调用。\n\
  \n```\nprotected void Page_Load(object sender, EventArgs e)\n{\n    _navigation.CheckAccessForCurrentNode();\n\
  \    ...\n}\n```\n\n出于导航目的（到目前为止并没有真正涉及太多），我们有一个简单的 Repeater 控件，它将遍历 SiteMapNodes。在设计视图中，我们有一个如下所示的\
  \ Repeater：\n\n```\n<asp:Repeater ID=\"repPrimaryNav\" OnItemDataBound=\"repPrimaryNav_ItemDataBound\"\
  \ runat=\"server\">\n    <ItemTemplate>\n        <asp:HyperLink ID=\"linkPrimaryNav\"\
  \ CssClass=\"PrimaryNavLink\" runat=\"server\"></asp:HyperLink>\n    </ItemTemplate>\n\
  </asp:Repeater>\n```\n\n然后，针对 `Page_Load()` 方法，我们在母版页的代码隐藏文件中编写了以下绑定代码：\n\n```\n\
  repPrimaryNav.DataSource = _navigation.PrimaryNodes();\nrepPrimaryNav.DataBind();\n\
  ```\n\n如果我们只有这些代码，就不会有任何导航。这时 `OnItemDataBound=\"repPrimaryNav_ItemDataBound\"`\
  \ 属性就派上用场了。它基本上表明 `repPrimaryNav_ItemDataBound()` 方法将成为我们的 `OnItemDataBound` 事件处理程序。\n\
  \n此方法将负责显示所有链接，并会格式化链接，以正确显示你当前所在的区域。\n\n```\nprotected void repPrimaryNav_ItemDataBound(object\
  \ sender,\n    RepeaterItemEventArgs e)\n{\n    HyperLink linkPrimaryNav = e.Item.FindControl(\"\
  linkPrimaryNav\")\n                              as HyperLink;\n    SiteMapNode\
  \ node = (SiteMapNode) e.Item.DataItem;\n    linkPrimaryNav.Text = node.Title;\n\
  \    linkPrimaryNav.NavigateUrl = node.Url;\n    if (node == _navigation.CurrentNode\
  \ || node ==\n                                      _navigation.CurrentNode.ParentNode)\n\
  \    {\n        linkPrimaryNav.CssClass = \"PrimaryNavLinkActive\";\n    }\n\n \
  \   //TODO: For Chapter 3 these links will be kept disabled\n    linkPrimaryNav.Enabled\
  \ = false;\n}\n```\n\n### 总结\n\n在本章中，我们实现了用户注册。这使我们能够收集用户数据，使他们能够成为社区的一员。除了收集数据，我们还简要介绍了一些重要信息的存储方式。我们还创建了一个\
  \ reCAPTCHA 工具，以减少社区需要处理的垃圾信息量。我们还为新注册用户提供了一些工具，让他们可以找回密码并编辑账户数据。注册工具就绪后，我们讨论并实现了一种简单的方法来管理整个站点的导航和安全性。\n\
  \n随着账户创建和管理工具的到位，我们现在可以进入其他章节了。掌握本章内容非常重要，因为后续所有章节都会使用我们在这里创建的许多功能。\n\n\n\n\n##\
  \ 用户资料\n\n用户账户是系统运行的基础，而用户资料则是社区运转的关键。用户资料让你的用户能够分享关于自身的各种细节信息。它应当非常灵活，以便随着社区的发展和演变，你能轻松扩展用户资料的功能。\n\
  \n在本章中，我们将讨论用户资料设置的基础内容。这包括收集关于用户的各种个人数据片段、联系方式等等。我们还会介绍允许用户上传**头像**（与用户资料关联的图标或图像）的概念，以及与第三方头像服务\
  \ **Gravatar** 的集成。自定义头像上传的一部分工作将涉及图像处理，以确保我们网站上的所有头像都具有统一的大小和形状！\n\n完成这些工作后，我们就可以着手整合用户的公开资料，并讨论如何通过自定义主页或美观的\
  \ URL 来访问该资料。一旦我们收集了用户的一些数据——供网站上的其他用户查看——我们就需要讨论如何让用户控制自己的隐私设置，并允许他们限制这些数据的显示。\n\
  \n本章的最后一个部分将涉及创建动态消息 / 提醒，用于记录用户的活动。在下一章引入“好友”概念后，这将成为一个非常重要的功能。\n\n![](img/15a62e134135dde036b0ac3cbb01dab6_130_0.png)\n\
  \n### 问题\n\n我们不会讨论 .NET 的配置文件功能，原因与之前不写 .NET 成员资格功能相同。这个话题在许多书籍和顶级博客站点上已经被广泛覆盖。我们认为，讨论自定义实现配置文件及动态属性可能会更有意思，这样成员的配置文件可以随着时间推移不断扩展。此外，这也能让我们更深入地了解\
  \ LINQ 以及我们的框架是如何运作的。\n\n在构建配置文件时另一个必须讨论的有趣话题是头像。头像是一个小图标或图像，与每个用户的资料相关联。这样你就可以轻松地从人群里直观地辨认出某个资料。通常，头像会显示在用户所进行或交互的几乎所有内容旁边，例如他们的博客文章、论坛帖子、评论等。这提供了一种虚拟的面对面感觉。\n\
  \n当然，我们也可以采取更简单的方法，不允许用户创建自定义头像——某些社区就是这么做的。我们可以只提供一个通用头像图库，让用户从中选择一个关联到自己的资料。但任何社区网站最大的吸引力在于让用户尽可能自由地表达。因此，在自定义头像方面，我们将讨论另一个极端。\n\
  \n我们需要一种方式让用户上传他们自己的图片，尺寸几乎不限（不过我们会有文件大小限制！请别上传 10 MB 的图片来处理！）。由于头像通常更接近图标大小而非海报大小，我们将需要处理图像缩放。此外，既然我们知道图片可以是各种形状，如果能设计一个\
  \ UI，让用户选择上传图片的特定区域，并将该选区限制为特定形状，那就太棒了。我们倾向于使用正方形，因为它最容易处理。\n\n![](img/15a62e134135dde036b0ac3cbb01dab6_131_0.png)\n\
  \n除了自定义头像，如今许多服务也提供集中式头像。这样用户可以在一处上传和管理头像，然后自动同步到他们所属的所有网站。我们将研究如何使用最大、最流行的服务之一\
  \ Gravatar。\n\n一旦我们完成了所有数据收集和配置文件配置工具，接下来就要处理向社区展示这些数据的问题。这里一个很好的特性是美观 URL，它允许我们的用户在社区中拥有自己的个人主页，如下所示：www.fisharoo.com/profiles/atul\
  \ gupta。\n\nFacebook 的一个非常流行的功能是持续动态流，显示关于你、你的朋友以及社区活动的内容。这类功能现在已经非常流行，以至于 MySpace\
  \ 最近也实现了一个版本。这是一个重要的功能，因为它每天都会给我们提供一些新的内容。你关注的朋友越多（详见第 6 章），你需要跟踪的动态就越多。由于这些动态或提醒通常会显示在用户的私人主页上，并且它是一个主要子系统，许多其他功能都会向其中写入内容，所以我们应该现在而不是以后再处理底层框架。\n\
  \n### 设计\n\n让我们看看这些功能的整体设计会是怎样的。\n\n#### 资料\n\n我们的资料将收集用户的基本数据。我们要收集的一些项目包括：\n\n\
  - 各种 IM（即时通讯）ID\n- 用户的帖子 / 评论\n- 一些与鱼相关的基本信息，例如他们拥有多少个鱼缸以及多少条鱼\n\n除此之外，我们还将允许资料拥有动态属性。虽然从用户角度来看这些属性可以是动态的，但目前我们会限制这一功能，只允许站点管理员添加额外属性。动态属性的一些示例包括“关于你”、“职业”和“你的（珊瑚礁/水族箱）配置”。\n\
  \n### 管理资料\n\n由于我们要管理好几类数据，我们需要考虑如何最好地向用户呈现这些内容。同时，我们也不想创建一堆不同的管理页面，因为那对我们来说会变成一场噩梦。我们将使用简单的分步向导式界面，这样我们就能将数据收集/管理过程分解为逻辑步骤。\n\
  \n#### 头像\n\n在系统中管理图像有许多方法。多年来争议最大的两种方法是将图像存储在数据库中，或者将它们存储在文件系统上。对于日常的图片库，我们完全支持将它们存储在文件系统上。然而，像头像这样频繁使用的东西（考虑到头像形状较小）可以直接与资料一起存储在数据库中。\n\
  \n#### 自定义头像\n\n我们大多数人会认为上传图像或文件很简单。然而，以一种不会让图像看起来失真的方式缩放图像确实是一个挑战。此外，我们还要放大和/或裁剪图像，使其成为完美的正方形。但我们不能把用户的图像强行压扁成正方形。也不能随便从上传的图片中随机截取一个方形区域！那样头像最终可能只包含鼻子而不是整个头部。所以我们需要创建一个\
  \ UI（或找到一个），让用户指定要使用上传图像的哪个部分。\n\n#### Gravatar\n\nGravatar.com 和其他类似网站还有另一个有趣的想法。它们允许你在一个集中的位置存储头像，并从其他网站引用它。这样，如果你想更换头像，只需前往这一个地方进行修改，你的头像就会在所有引用它的网站上同步更新。我们认为这是我们应该在站点中支持的功能。\n\
  \n#### 公开资料\n\n随着人们加入网站，他们希望了解站点的其他成员并与他们互动。我们需要提供一个公共区域，让用户表达自我并与世界分享。这也将成为我们在后续章节中其他功能的主要展示平台。\n\
  \n### 自定义主页\n\n大多数互联网用户习惯看到这样的 URL：\n\nhttp://www.domain.com/somepage.aspx?id=asduiw8921s1cm&t=89889\n\
  \n虽然计算机可以轻松读取这种链接，但对人来说完全没有意义。既然我们已经为每个用户提供了公开资料页面，为什么不提供一个简单的方式让好奇的人找到该页面呢？更重要的是，为什么不提供一种简单的方法让用户分享他们的公开资料？我们将不再使用之前的\
  \ URL，而是建立一个更像这样的 URL：**http://www.fisharoo.com/profiles/YourUsername**。\n\n###\
  \ 隐私\n\n一旦我们为用户提供了所有这些工具来输入个人数据，那么为他们提供一种管理谁可以看到这些数据的方式就非常重要。在本章中，我们将专注于创建基础系统，以便在后续章节中进一步扩展。在本章中，我们将研究如何将用户数据设置为公开或私有。我们要创建的系统应该足够灵活，能够保护单条数据或整个数据区域。一个示例是，我们可能想要单独保护用户的社会安全码数据（虽然我们不会存储社会安全码！），并通过一个开关保护所有用户的\
  \ IM 账户。\n\n这里的开关就是实际的用户设置。开关类型就是需要被保护的特定数据或数据区域。由于这些是在系统中静态定义的，因此这些数据不需要直接管理。可见性级别归结为公开、私密和仅好友可见。通过这种结构，最终用户将能够独立配置每种开关类型。\n\
  \n### 动态消息\n\n正如我们之前提到的，动态消息部分是我们在任何社区中最喜欢的功能之一。我们认为，如果这个区域设计得正确，它将拥有最多的活跃度，也可能对用户最有价值。它本质上允许用户跟踪其他用户。\n\
  \n实现这种功能的方式有好几种。我们可以为要跟踪的各种通知类型将数据分散存储。或者我们可以将其集中存储，并与关系模型解耦。我们选择保持简单（像往常一样）。因此，在我们的场景中，当生成通知时，它将存储在一个简单的结构中，以便我们能更高效地将数据快速推送给用户。\n\
  \n提醒由每个用户生成。所有这些提醒都会显示在用户的首页上，这样他/她就能按时间顺序看到他们自己正在进行的活动。\n\n\n\n\n\n## 解决方案\n\n\
  现在，让我们来看看如何着手实现这些新功能。\n\n### 回顾解决方案结构\n\n在深入细节之前，让我们快速回顾一下解决方案的结构。由于到本书结尾时，这个站点将变得相当庞大，并涵盖所有功能，因此有必要进行一定的模块化。同时，为了正确遵循我们之前讨论的应用分层概念，提前以正确的方式设置事物非常重要。我们的解决方案结构如下所示：\n\
  \n![](img/15a62e134135dde036b0ac3cbb01dab6_135_0.png)\n\n各个项目都有特定的用途。让我们来看看这些项目：\n\
  \n- **业务逻辑：**所有与业务相关的逻辑、规则等都将放在此项目中。\n- **通用：**这是任何层都可以使用的通用功能。\n- **组件：**这些也是通用组件，但可以根据需要被不同的实现所替换。本质上，这些组件实现了\
  \ MEF。\n- **数据访问：**该层是对实际数据访问的封装，包含各种使用实体框架生成的实体来操作数据库的仓储。\n- **接口：**这些是组件项目中各个类所实现的接口。\n\
  - **Web：**这是表示层，包含所有 ASPX 页面及相关逻辑。\n\n### 实现数据库\n\n我们将从实现数据库开始，然后自底向上逐步推进。下面的截图显示了本章中我们将使用的主要表。\n\
  \n![](img/15a62e134135dde036b0ac3cbb01dab6_136_0.png)\n\n### Profiles 表\n\n在真正组装一个界面之前，我们需要讨论一下个人资料（profile）的数据将如何存储。参见上一张截图中的\
  \ profiles 表。让我们讨论一些不太常见的字段。这里我们指的是使用 **varbinary(MAX)** 字段的 **头像**存储。有了 MAX 大小限制（其实也算不上什么限制！），一个人理论上可以把一张\
  \ DVD 的内容存放到这个字段中。这当然是很荒唐的，所以我们需要确保在前端设置一些限制，以便将文件存储大小保持在最小。稍后您会看到，这个字段本质上是一个字符数组！\n\
  \n### 经验水平\n\n一旦我们的基础个人资料容器就绪，我们就可以创建一些周围的表了。其中最简单的是经验水平系统。随着站点的其他功能逐步构建，该系统也会被用到。最初，用户可以进入并设置其个人资料，并声明一种经验水平。然后，当用户在论坛中添加帖子、创建新的博客文章，或以任何其他方式与我们的社区互动时，我们可以动态调整用户的经验水平。这可以基于用户获得的勋章，我们将在第\
  \ 11 章中讨论这一点。\n\n### Attributes 表\n\n个人资料系统中另一个最简单的部分就是动态属性系统。回忆一下，这将允许站点管理员轻松扩展为每个用户收集的数据。有两张表——ProfileAttribute\
  \ 和 ProfileAttributeType。第一张表用于用户输入的属性，第二张表用于站点中使用的各种属性。\n\n### Privacy 表\n\n现在我们可以讨论隐私系统了。这本质上是一个一对多关系系统，在关系的子端有一些配置/查找表。我们有\
  \ PrivacyFlag 用于存储用户创建的值。然后我们有 PrivacyFlagType 来定义该标志所保护的内容。最后，我们有 VisibilityLevel，它定义了谁可以看到受保护的数据。\n\
  \n### Alerts 表\n\n接下来，我们来看看支持个人资料页面上新闻源或“提醒”（Alerts）概念的表。这包括 Alert 表和 AlertType\
  \ 表。\n\n这里一个值得讨论的有趣字段是 IsHidden 字段。稍后我们将使用它，让用户可以从其新闻源中隐藏某条提醒。我们也可以使用它，让用户根据提醒类型隐藏整组提醒。\n\
  \n在业务层包含大量业务逻辑的应用程序中，可以创建独立的业务实体，并在实体之间进行转换（例如，从 DataAccess 实体转换为业务实体，反之亦然）。类似地，如果表示层要求实体具有特定于表示层的额外属性，则可以创建表示实体。\n\
  \n让我们通过在 DataAccess 项目中创建一个新的 Profile 分部类来扩展我们的 Profile 对象。在这个类中，让我们添加一个属性来存储个人资料属性的列表，以及一个属性来保存个人资料的经验水平。我们不需要相应的标量属性，因为这些属性是可用的，因此我们无需担心在这个分部类中添加它们。Profile\
  \ 分部类看起来如下所示：\n\n```csharp\n//Fisharoo/DataAccess/Profile.cs\nnamespace Fisharoo.DataAccess\n\
  {\n    public partial class Profile\n    {\n        public List<ProfileAttribute>\
  \ Attributes { get; set; }\n        public LevelOfExperienceType LevelOfExperienceType\
  \ { get; set; }\n\n        public Profile()\n        {\n            Attributes =\
  \ new List<ProfileAttribute>();\n        }\n    }\n}\n```\n\n类似地，我们将为 AlertType、PrivacyFlagType、ProfileAttribute\
  \ 和 VisibilityLevel 创建分部实体类。有关这些类的详细信息，请参阅第 4 章提供的代码。\n\n### 构建仓储\n\n随着新表的添加，将会有新的仓储来访问存储在表中的数据。我们将创建几个仓储来支持我们的个人资料需求，即\
  \ ProfileRepository、ProfileAttributeRepository、PrivacyRepository、LevelOfExperienceTypeRepository\
  \ 和 AlertRepository。\n\n我们的每个仓储都会有一个方法用于按 ID 选择、按父 ID 选择、保存和删除。一旦你见过一个仓储，基本上就相当于见过所有仓储了。让我们来看一下\
  \ ProfileRepository.cs：\n\n```csharp\n//Fisharoo/DataAccess/Repositories/ProfileRepository.cs\n\
  namespace Fisharoo.DataAccess.Repositories\n{\n    [Export(typeof(IProfileRepository))]\n\
  \    public class ProfileRepository : IProfileRepository\n    {\n        private\
  \ Connection conn;\n        public ProfileRepository()\n        {\n            conn\
  \ = new Connection();\n        }\n\n        public Profile GetProfileByAccountID(int\
  \ AccountID)\n        {\n            Profile profile;\n\n            using (FisharooDataContext\
  \ dc = conn.GetContext())\n            {\n                profile = (from p in dc.Profiles.Include(\n\
  \                    \"ProfileAttributes.ProfileAttributeType\")\n             \
  \       .Include(\"LevelOfExperienceType\")\n                    where p.AccountID\
  \ == AccountID\n                    select p).FirstOrDefault();\n            }\n\
  \            if (profile != null)\n            {\n                foreach (ProfileAttribute\
  \ item in profile.ProfileAttributes)\n                {\n                    profile.Attributes.Add(item);\n\
  \                    item.profileAttributeType = item.ProfileAttributeType;\n  \
  \              }\n                profile.LevelOfExperienceType = profile.LevelOfExperienceType;\n\
  \            }\n            return profile;\n        }\n\n        public Int32 SaveProfile(Profile\
  \ profile)\n        {\n            Int32 profileID = 0;\n            Boolean HasAttributeId\
  \ = false;\n            profile.LastUpdateDate = DateTime.Now;\n            using\
  \ (FisharooDataContext dc = conn.GetContext())\n            {\n                if\
  \ (profile.ProfileID > 0)\n                {\n                    dc.Profiles.Attach(new\
  \ Profile { ProfileID = profile.ProfileID });\n                    dc.Profiles.ApplyCurrentValues(profile);\n\
  \                    if (profile.Attributes != null)\n                    {\n  \
  \                      foreach (ProfileAttribute item in profile.Attributes)\n \
  \                       {\n                            dc.ProfileAttributes.Attach(\n\
  \                                new ProfileAttribute\n                        \
  \        {\n                                    ProfileAttributeID = item.ProfileAttributeID,\n\
  \                                });\n                            dc.ProfileAttributes.ApplyCurrentValues(item);\n\
  \                        }\n                    }\n                }\n         \
  \       else\n                {\n                    profile.CreateDate = DateTime.Now;\n\
  \                    //when working with new profile we don't expect attributes\
  \ to be null, but check anyway\n                    if (profile.Attributes != null)\n\
  \                    {\n                        foreach (ProfileAttribute item in\
  \ profile.Attributes)\n                        {\n                            dc.ProfileAttributes.AddObject(new\
  \ ProfileAttribute\n                            {\n                            \
  \    ProfileAttributeID = item.ProfileAttributeID,\n                           \
  \     ProfileAttributeTypeID = item.ProfileAttributeTypeID,\n                  \
  \              ProfileID = item.ProfileID,\n```\n\n\n\n\n\n```csharp\nResponse =\
  \ item.Response,\nCreateDate = item.CreateDate,\nTimeStamp = item.TimeStamp\n});\n\
  HasAttributeId = true;\n}\n}\ndc.Profiles.AddObject(profile);\n}\ndc.SaveChanges();\n\
  profileID = profile.ProfileID;\nif (HasAttributeId)\n{\n    var result = from pa\
  \ in dc.ProfileAttributes\n                 .Include(\"ProfileAttributeType\")\n\
  \                 where pa.ProfileID == profileID\n                 select pa;\n\
  \    profile.Attributes = result.ToList();\n    foreach (ProfileAttribute item in\
  \ profile.Attributes)\n    {\n        item.ProfileAttributeType = item.ProfileAttributeType;\n\
  \    }\n}\nreturn profileID;\n}\n\npublic void DeleteProfile(Profile profile)\n\
  {\n    using (FisharooDataContext dc = conn.GetContext())\n    {\n        dc.Profiles.DeleteObject(dc.Profiles\n\
  \            .Where(pf => pf.ProfileID\n            .Equals(profile.ProfileID))\n\
  \            .FirstOrDefault());\n        dc.SaveChanges();\n    }\n}\n```\n\n>\
  \ Lambda 表达式由 lambda 运算符 ‘=>’ 组成，读作 goes to，其左侧表示输入参数，右侧表示要计算的表达式或语句块。与标准查询相比，其主要优势在于类型推断、简洁性和代码可读性提高。\n\
  \n其他存储库也是类似构建的，这里不再展示代码。你可以查看本章关联的代码以获取更多细节。\n\n## 实现服务/应用层\n\n一旦为单一用途构建了所有存储库，我们就可以开始创建服务层。服务层将被表示层项目所使用。存储库类（除实体外）永远不会在表示层项目中直接访问，而只会通过业务逻辑项目访问。这有助于在应用程序的各个层之间保持耦合和内聚。不仅如此，它还有助于建立“关注点分离”的设计原则，即每一层只执行对其期望的专用活动。\n\
  \n我们将创建一些服务，即 ProfileService、PrivacyService、AlertService、ProfileAttributeService、LevelOfExperienceTypeService\
  \ 和 PermissionService。\n\n除上述服务外，我们还需要修改几个服务。\n\n### ProfileService\n\n现在我们可以开始构建\
  \ ProfileService。 在 BusinessLogic 项目中创建一个名为 ProfileService 的新类。\n\n```csharp\n//Fisharoo/BusinessLogic/ProfileService.cs\n\
  namespace Fisharoo.BusinessLogic\n{\n    //CHAPTER 4\n    [Export(typeof(IProfileService))]\n\
  \    public class ProfileService : IProfileService\n    {\n        [Import]\n  \
  \      private IProfileRepository _profileRepository;\n        [Import]\n      \
  \  private IAlertService _alertService;\n        [Import]\n        private IProfileAttributeRepository\
  \ _profileAttributeRepository;\n        [Import]\n        private IUserSession _userSession;\n\
  \        [Import]\n        private ILogger _log;\n\n        public ProfileService()\n\
  \        {\n            MEFManager.Compose(this);\n        }\n\n        public Profile\
  \ LoadProfileByAccountID(Int32 AccountID)\n        {\n            Profile profile\
  \ = null;\n            profile = _profileRepository.GetProfileByAccountID(AccountID);\n\
  \            return profile;\n        }\n\n        public void SaveProfile(Profile\
  \ profile)\n        {\n            _profileRepository.SaveProfile(profile);\n  \
  \          _userSession.CurrentUser.Profile = profile;\n        }\n    }\n}\n```\n\
  \n如你所见，这个类具有 LoadProfileByAccountID() 和 SaveProfile() 方法。它们很容易理解，因为它们只是调用相应的数据访问层方法并传递适当的参数。\n\
  \n我们并不是通过在 ProfileService 类中创建实例来直接访问存储库类，而是通过使用 MEF 使用对数据访问存储库的接口（IProfileRepository），如前一章所述。\n\
  \n### Account service\n\n现在我们已经创建了 ProfileService，让我们扩展 AccountService 以利用我们的新功能。请注意，我们在\
  \ AccountRepository.cs 中加载了 Profiles 和 AccountPermissions 以及 Account，因此这些将作为 account\
  \ 对象的导航属性可用。让我们从扩展 AccountService.cs 文件中的 Login 方法开始。当用户尝试登录时，我们使用刚刚扩展的方法 GetAccountByID\
  \ 获取他们的账户。这意味着我们现在也有了他们的个人资料！我们现在可以决定是否有一个具有完整创建个人资料的用户，并相应地重定向他们。让我们使用以下代码更新 AccountService.cs\
  \ Login() 方法：\n\n```csharp\n//Fisharoo/BusinessLogic/AccountService.cs\nif (account.EmailVerified)\n\
  {\n    _userSession.LoggedIn = true;\n    _userSession.Username = Username;\n  \
  \  _userSession.CurrentUser = GetAccountByID(account.AccountID);\n    if(_userSession.CurrentUser.Profile\
  \ != null &&\n        _userSession.CurrentUser.Profile.ProfileID > 0)\n        _redirector.GoToProfilesDefault();\n\
  \    else\n        _redirector.GoToProfilesManageProfile();\n}\n```\n\n当然，这意味着我们需要在\
  \ Redirector 类中添加这些新方法！以下是代码：\n\n```csharp\n//Fisharoo/Components/Redirector.cs\n\
  public void GoToProfilesProfile()\n{\n    Redirect(\"~/Profiles/Profile.aspx\");\n\
  }\n\npublic void GoToProfilesDefault()\n{\n    Redirect(\"~/Profiles/Default.aspx\"\
  );\n}\n```\n\n### Privacy service\n\n隐私服务目前仅负责确定某条数据或显示多种类型数据的部分是否可以显示。它有一个名为 ShouldShow()\
  \ 的方法，返回布尔值。\n\n```csharp\n//Fisharoo/BusinessLogic/PrivacyService.cs\npublic bool\
  \ ShouldShow(Int32 PrivacyFlagTypeID,\n    Account AccountBeingViewed,\n    Account\
  \ Account,\n    List<PrivacyFlag> Flags)\n{\n    bool result;\n\n    //CHAPTER 5\
  \ - come back to this when we start friends\n    bool isFriend = false;\n    //flag\
  \ marked as private test\n    if(Flags.Where(f => f.PrivacyFlagTypeID == PrivacyFlagTypeID\
  \ &&\n    f.VisibilityLevelID == (int)VisibilityLevel.VisibilityLevels.\n    Private).FirstOrDefault()\
  \ != null)\n        result = false;\n    //flag marked as friends only test\n  \
  \  else if (Flags.Where(f => f.PrivacyFlagTypeID ==\n            PrivacyFlagTypeID\
  \ && f.VisibilityLevelID ==\n            (int)VisibilityLevel.VisibilityLevels.\n\
  \            Friends).\n        FirstOrDefault() != null && isFriend)\n        result\
  \ = true;\n    else if (Flags.Where(f => f.PrivacyFlagTypeID ==\n            PrivacyFlagTypeID\
  \ && f.VisibilityLevelID ==\n            (int)VisibilityLevel.VisibilityLevels.Public)\n\
  \        .FirstOrDefault() != null)\n        result = true;\n    else\n        result\
  \ = false;\n    return result;\n}\n```\n\n请注意，我们使用的是枚举而不是记录号进行测试。为了使用 VisibilityLevel.VisibilityLevels\
  \ 表示的这些枚举值，我们将不得不创建一个新的 partial VisibilityLevel 类。导航到 DataAccess 并创建一个名为 VisibilityLevel.cs\
  \ 的新类文件。在其中，输入以下代码：\n\n```csharp\npublic enum VisibilityLevels\n{\n    Private =\
  \ 1,\n    Friends = 2,\n    Public = 3\n}\n```\n\n### Other services\n\n- **Profile\
  \ Attribute service：** 此服务负责根据存储在 `ProfileAttribute` 中的 `ProfileAttributeTypeID`\
  \ 将 `ProfileAttribute` 与其对应的 `ProfileAttributeType` 组合起来。这实现起来非常直接，因为它只是调用 `ProfileAttributeRepository`\
  \ 根据指定的 `ProfileID` 获取 `ProfileAttributes` 列表。我们只是从代码完成的角度实现了它。此服务可能不会被调用或使用，因为我们已经在\
  \ `ProfileRepository.cs` 中为每个 Profile 加载了所有 `ProfileAttribute`。\n- **Level of Experience\
  \ type service：** 这是一个简单的包装服务，调用 `LevelOfExperienceTypeRepository` 获取所有经验等级类型的列表。这是为了避免表示层直接调用存储库类而编写的。\n\
  - **Permission service：** 这与 `LevelOfExperienceTypeService` 类似，并调用 `PermissionRepository`\
  \ 上的方法以获取与 `Web.sitemap` 中使用的名称关联的权限。\n\n查看本章关联的代码以了解这些服务的细节。\n\n## 实现表示层\n\n现在整个后端已经创建完成并准备就绪，让我们继续讨论如何让表示层为我们工作。虽然隐私功能完全可以在其他所有功能之后实现，但我们认为如果先准备好它会更容易。然后在构建其他区域时，我们可以在需要的地方加入隐私检查。\n\
  \n### Privacy\n\n现在，让我们实现隐私功能。\n\n\n\n\n\n```aspx\n<asp:PlaceHolder ID=\"phPrivacyFlagTypes\"\
  \nrunat=\"server\"></asp:PlaceHolder> </div>\n<div class=\"divContainerFooter\"\
  >\n<asp:Label ID=\"lblMessage\" runat=\"server\"\nForeColor=\"Red\"></asp:Label>\n\
  <asp:Button CssClass=\"loginButton\" ID=\"btnSave\"\nrunat=\"server\" Text=\"Save\
  \ Privacy Settings\" OnClick=\"btnSave_Click\" />\n</div> </fieldset> </div>\n</asp:Content>\n\
  ```\n\n这就把我们带到了代码后置部分。当然，它继承自一个接口，这样我们就可以将此页面的引用传递给我们的 ManagePrivacyPresenter 类。与大多数\
  \ Model View Presenter (MVP) 页面一样，我们必须设置我们的 presenter 类。开始时，我们在 Page_Load 中将此页面的引用传递给\
  \ presenter。\n\n```csharp\n//Fisharoo/Web/Profiles/ManagePrivacy.aspx.cs\nnamespace\
  \ Fisharoo.Web.Profiles\n{\n    public partial class ManagePrivacy : System.Web.UI.Page,\n\
  \    IManagePrivacy\n    {\n        private ManagePrivacyPresenter _presenter;\n\
  \n        protected void Page_Load(object sender, EventArgs e)\n        {\n    \
  \        _presenter = new ManagePrivacyPresenter();\n            _presenter.Init(this);\n\
  \        }\n\n        public void ShowPrivacyTypes(List<PrivacyFlagType>\n     \
  \   PrivacyFlagTypes,\n        List<VisibilityLevel> VisibilityLevels,\n       \
  \ List<PrivacyFlag> PrivacyFlags)\n        {\n            foreach (PrivacyFlagType\
  \ type in PrivacyFlagTypes)\n            {\n                //Add the field name\
  \ to the display\n                phPrivacyFlagTypes.Controls.Add(new\n        \
  \        LiteralControl(\"<p>\"));\n                Label lbl = new Label();\n \
  \               lbl.Text = type.FieldName + \":\";\n                lbl.Width =\
  \ 100;\n                phPrivacyFlagTypes.Controls.Add(lbl);\n\n              \
  \  //Create the visibility drop down\n                DropDownList ddlVisibility\
  \ = new DropDownList();\n                ddlVisibility.ID = \"ddlVisibility\" +\n\
  \                                   type.PrivacyFlagTypeID.ToString();\n       \
  \         foreach (VisibilityLevel level1 in VisibilityLevels)\n               \
  \ {\n                    ListItem li = new ListItem(level1.Name,\n             \
  \                                  level1.VisibilityLevelID.ToString());\n     \
  \               if(!IsPostBack)\n                        li.Selected = _presenter.IsFlagSelected(\n\
  \                                          type.PrivacyFlagTypeID,\n           \
  \                               level1.VisibilityLevelID,\n                    \
  \                      PrivacyFlags);\n                    ddlVisibility.Items.Add(li);\n\
  \                }\n                phPrivacyFlagTypes.Controls.Add(ddlVisibility);\n\
  \                phPrivacyFlagTypes.Controls.Add(new LiteralControl(\"</p>\"));\n\
  \            }\n        }\n\n        protected void btnSave_Click(object sender,\
  \ EventArgs e)\n        {\n            lblMessage.Text = \"\";\n            foreach\
  \ (PrivacyFlagType type in\n                     _presenter.GetPrivacyFlagTypes())\n\
  \            {\n                DropDownList ddlVisibility =\n                 \
  \   phPrivacyFlagTypes.FindControl(\"ddlVisibility\" +\n                    type.PrivacyFlagTypeID.ToString())\
  \ as\n                    DropDownList;\n                if(ddlVisibility != null)\n\
  \                    _presenter.SavePrivacyFlag(\n                        type.PrivacyFlagTypeID,\
  \ Convert.\n                        ToInt32(\n                        ddlVisibility.SelectedValue));\n\
  \            }\n            lblMessage.Text = \"Your privacy settings were saved\
  \ successfully!\";\n        }\n\n        public void ShowMessage(string Message)\n\
  \        {\n            lblMessage.Text += Message;\n        }\n    }\n}\n```\n\n\
  这里需要注意的是，与所有 presenter 控制的页面一样，视图会调用一个 Init() 方法，该方法是在 presenter 中负责加载页面的方法。presenter\
  \ 会调用 LoadPrivacyTypes() 使用适当的服务加载隐私数据，然后调用视图中的 ShowPrivacyTypes() 方法，并传入构建动态 UI\
  \ 所需的内容。ShowPrivacyTypes() 方法随后会遍历传入列表中的所有值，将下拉菜单添加到 .aspx 页面中的占位符中。在加载 UI 的同时，它还会尝试为每个菜单定位当前值以进行加载。\n\
  \n我们随后有 btnSave_Click() 事件处理程序，负责提取当前选择并将这些值传递给 presenter，以便将数据持久化到数据库中。\n\n最后，我们有一个\
  \ ShowMessage() 方法，允许 presenter 将消息传回此页面的用户。\n\npresenter ManagePrivacyPresenter\
