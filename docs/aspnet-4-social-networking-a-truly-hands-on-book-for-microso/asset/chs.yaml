  \ = \"/Accounts/Login.aspx\";\n        }\n\n        repPosts.DataSource = Posts;\n\
  \        repPosts.DataBind();\n    }\n}\n```\n\n在 Page_Load() 方法中，我们提取路由数据值并将其传递给呈现器，以获取主题和相关帖子。\n\
  \n返回的 Thread 和 Post 详细信息在 LoadData() 方法中绑定到 UI 元素。请注意，linkForumName 超链接控件的 NavigateUrl\
  \ 属性设置为将我们带回论坛页面。注意，每个项目旁边还有一个回复链接。在我们的实现中，它们都做同样的事情——通过用户友好的 URL 将用户导航到 Post.aspx\
  \ 页面，以创建帖子或回复。但是，只有在用户登录时，回复选项才可用。否则，用户将被重定向到登录页面。\n\n最后，让我们快速看一下 ViewPost.aspx\
  \ 页面的一个重要部分，我们从路由数据集合中直接加载类别和论坛名称。\n\n```aspx\n<asp:Hyperlink ID=\"linkCategoryName\"\
  \ Text=\"<%$RouteValue:categoryname %>\" NavigateUrl=\"~/Forums/Default.aspx\" runat=\"\
  server\" />\n&nbsp; | &nbsp;\n<asp:Hyperlink ID=\"linkForumName\" Text=\"<%$RouteValue:forumname\
