  \ 文件中找到。通常 `httpHandlers` 需要在 web.config 文件中注册，但由于我们的处理程序是一个 `.ashx` 文件，它由 ASP.NET\
  \ 运行时自动管理，我们不需要显式注册它。\n\n该处理程序将处理过程交给 **FileProcessor** 类（`Web/HelperClasses/FileProcessor.cs`），该类负责\
  \ GUID 的创建、各种尺寸图像的生成以及后端相应部分的处理。这里的代码与前面章节中讨论的类似：**多文件上传。**\n\n现在我们已经在上传文件，接下来讨论这些照片的显示。\n\
  \n### 相册\n\n既然我们已经将各种尺寸的文件上传到服务器，现在我们可以做很多事情！我们将向您展示 MyPhotos 页面，该页面将列出登录帐户的所有相册，并链接到\
  \ ViewAlbum 页面。这应该演示如何处理相册和照片。您可以查看代码中的其他页面，了解如何创建相册、链接到文件上传器等——基本上涵盖了围绕相册概念的所有数据管理任务。\n\
