  \ presenter 中，我们对加载方法做了一些修改。MarkAnswer 控件仅在用户已登录且与最初提问的用户为同一用户时显示。此外，在查询帖子详情的同时，我们还需要额外调用\
  \ AccountService 来获取用户账户的相应分数，以便显示勋章。\n\n```csharp\n//Fisharoo/Web/Forums/Presenters/ViewPostPresenter.cs\n\
  private void LoadData(string categoryname, string forumname, int postID)\n{\n  \
  \  List<BoardPost> list = _postService.GetPostsByThreadID(postID);\n    BoardPost\
  \ bp = _postService.GetPostByID(postID);\n\n    bool displayMarkAnswer = IsUserLoggedIn()\
  \ && (bp.AccountID ==\n                             _webContext.CurrentUser.AccountID)\
  \ ? true : false;\n    int score = _accountService.GetAccountByID(bp.AccountID).Score;\n\
  \n    _view.LoadData(Translator.BoardPostToBEBoardPost(bp, score),\n           \
  \        Translator.BoardPostToBEBoardPost(list, _accountService,\n            \
  \       displayMarkAnswer), categoryname, forumname, score);\n}\n```\n\n### ProfileDisplay\
  \ 用户控件\n\n最后，我们还将把 Medals 控件添加到 ProfileDisplay 用户控件中。这些更改与我们刚才讨论的场景类似。我们将在 UserControl/ProfileDisplay.ascx\
  \ 中注册 Medals 控件，并将其添加到合适的位置。在后台代码中，我们将 Medals.Score 属性设置为 Account.Score。\n\n就是这样！您的新用户控件正式准备就绪。\n\
  \n### 标签页面\n\n现在，我们已构建好用户控件并将其安装到我们的站点中，还有最后一件事情要做。在我们的标签云中，每个标签直接链接到标签名称，将用户带到\
  \ Tags.aspx 页面，以便我们查看共享同一标签的所有对象。这些标签最终还可以用于在站点上执行搜索。这个页面相当简单，因为大部分繁重的工作都在后台完成。让我们来看一下。\n\
  \n#### Tags.aspx\n\n此页面的显示端仅包含少量 repeater — 我们允许附加标签的每种对象类型都有一个 repeater。加载 UI 时，presenter\
  \ 会向视图发送一个 SystemObjectTagWithObjects 对象的列表。我们遍历此集合，并将每个对象的特定对象集合绑定到相应的 Repeater。以\
  \ Files 为例（我们已将自己的控件插入其中），我们会获取 Files 集合并将其绑定到 repFiles Repeater。当我们向站点的其他部分添加新用户控件时，也可以在此页面中连接到新的部分。\n\
  \n```aspx\n//Fisharoo/Web/Tags/Tags.aspx\n<asp:Repeater ID=\"repFiles\" runat=\"\
  server\">\n  <ItemTemplate>\n    <tr><td>\n      <%#((PESystemObjectTagWithObjects)Container.DataItem).FileName%>\n\
  \    </td><td>\n      <asp:HyperLink runat=\"server\" Text='<%# \"Click to view\
  \ album: \" + ((PESystemObjectTagWithObjects)Container.DataItem).FolderName %>'\
  \ NavigateUrl='<%# \"~/photos/ViewAlbum.aspx?AlbumID=\" + ((PESystemObjectTagWithObjects)Container.DataItem).DefaultFolderID\
  \ %>' /> or\n      <asp:HyperLink runat=\"server\" Text='<%# \"Click to view photo:\
  \ \" + ((PESystemObjectTagWithObjects)Container.DataItem).FileName %>' NavigateUrl='<%#\
  \ \"~/files/photos/\" + ((PESystemObjectTagWithObjects)Container.DataItem).URL %>'\
  \ />\n    </td></tr>\n  </ItemTemplate>\n</asp:Repeater>\n```\n\n#### Tags.aspx.cs\n\
  \n该文件自身所做的就是通过传递捕获标签名称的路由数据来连接到其 presenter。当 presenter 的 Init() 方法被调用时，presenter\
  \ 会调用视图的 LoadUI() 方法。LoadUI() 方法接收一个 PESystemObjectTagWithObjects 集合。然后，它通过指定要使用的\
  \ SystemObjectID，为每个 repeater 设置数据源，使用 PESystemObjectTagWithObjects 集合的一个子集。一旦所有列表构建完成，就会检查\
  \ repeater 的 Items.Count 属性，以查看是否有空的部分；如果有，我们会添加一条“无标签项”消息。\n\n```csharp\n//Fisharoo/Web/Tags/Tags.aspx.cs\n\
  public partial class Tags : System.Web.UI.Page, ITags\n{\n    private TagsPresenter\
  \ _tagsPresenter;\n    protected void Page_Load(object sender, EventArgs e)\n  \
  \  {\n        _tagsPresenter = new TagsPresenter();\n        string tagName = Page.RouteData.Values[\"\
  tagname\"] as string;\n        _tagsPresenter.Init(this, IsPostBack, tagName);\n\
  \    }\n    public void LoadUI(List<SystemObjectTagWithObjects>\n              \
  \         tagWithObjects)\n    {\n        repAccounts.DataSource = tagWithObjects.Where(t\
  \ =>\n                                t.SystemObjectTag.SystemObjectID == 1);\n\
  \        repAccounts.DataBind();\n        repProfiles.DataSource = tagWithObjects.Where(t\
  \ =>\n                                t.SystemObjectTag.SystemObjectID == 2);\n\
  \        repProfiles.DataBind();\n        repBlogs.DataSource = tagWithObjects.Where(t\
  \ =>\n                                t.SystemObjectTag.SystemObjectID == 3);\n\
  \        repBlogs.DataBind();\n        repPosts.DataSource = tagWithObjects.Where(t\
  \ =>\n                                t.SystemObjectTag.SystemObjectID == 4);\n\
  \        repPosts.DataBind();\n        repFiles.DataSource = tagWithObjects.Where(t\
  \ =>\n                                t.SystemObjectTag.SystemObjectID == 5);\n\
  \        repFiles.DataBind();\n        repGroups.DataSource = tagWithObjects.Where(t\
  \ =>\n                                t.SystemObjectTag.SystemObjectID == 6);\n\
  \        repGroups.DataBind();\n        if (repGroups.Items.Count == 0)\n      \
  \      repGroups.Controls.Add(new LiteralControl(\"<tr><td colspan=\\\"2\\\">No\
  \ tagged items</td></tr>\"));\n        if (repFiles.Items.Count == 0)\n        \
  \    repFiles.Controls.Add(new LiteralControl(\"<tr><td colspan=\\\"2\\\">No tagged\
  \ items</td></tr>\"));\n        if (repPosts.Items.Count == 0)\n            repPosts.Controls.Add(new\
  \ LiteralControl(\"<tr><td colspan=\\\"2\\\">No tagged items</td></tr>\"));\n  \
  \      if (repBlogs.Items.Count == 0)\n            repBlogs.Controls.Add(new LiteralControl(\"\
  <tr><td colspan=\\\"2\\\">No tagged items</td></tr>\"));\n        if (repProfiles.Items.Count\
  \ == 0)\n            repProfiles.Controls.Add(new LiteralControl(\"<tr><td colspan=\\\
  \"2\\\">No tagged items</td></tr>\"));\n        if (repAccounts.Items.Count == 0)\n\
  \            repAccounts.Controls.Add(new LiteralControl(\"<tr><td colspan=\\\"\
  2\\\">No tagged items</td></tr>\"));\n    }\n    public void SetTitle(string TagName)\n\
  \    {\n        ((SiteMaster)Master).Title = TagName;\n    }\n}\n```\n\n#### TagsPresenter.cs\n\
  \n此文件的 presenter 只有一个方法：**Init()**。**Init()** 方法通过传递从 TagService 中按 TagName 加载的\
