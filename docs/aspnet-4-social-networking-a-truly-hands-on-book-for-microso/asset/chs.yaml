  categoryname\"] as string;\n        string forumname = Page.RouteData.Values[\"\
  forumname\"] as string;\n        _presenter.Init(this, categoryname, forumname);\n\
  \    }\n\n    public void LoadDisplay(List<PEBoardPost> Threads, string CategoryName,\
  \ string ForumName, Int32 ForumID)\n    {\n        //forum can be viewed by anyone\
  \ but for posting one needs to login\n        if (_presenter.IsUserLoggedIn())\n\
  \        {\n            //navigation URL will follow the URL routing pattern\n \
