  ```\n\n有了这些，我们就可以创建博客文章了！\n\n## 小结\n\n我们现在有了一种很好的方式，让社区成员相互分享信息。这些内容有多种用途：它不仅为社区成员提供了一个大型信息库，让他们看到彼此关系的价值，同时也为我们的搜索引擎爬虫提供了食粮。\n\
  \n在本章中，我们介绍了博客文章的创建，还讨论了让人们查看其他用户帖子以及自己帖子所需的页面。当然，我们也提供了一个实际阅读帖子的页面。此外，我们还介绍了美观或友好\
  \ URL 的概念，这些 URL 对用户和搜索引擎都更友好。最后，我们通过 Xinha 所见即所得编辑器为 UI 增加了更多的可用性。\n"
- "# 9 论坛\n\n在本章中，我们将讨论论坛。**论坛**是一个用户可以向社区发布消息的地方，无论每条帖子之间相隔多久，所有回复都是可见的——可以将其视为一场长期持续的对话。随着主题（threads）及其帖子逐渐变旧，新的内容会开始覆盖旧的内容。这使得网站的这一部分成为一个非常动态的区域，许多用户都会关注。这被认为是一个具有“粘性”的功能！考虑到我们社区的主题——海水鱼——论坛是网站的完美功能。它可以让用户发布他们鱼缸遇到的问题，整个社区都能阅读并与该用户的问题互动。随着时间的推移，你的社区会慢慢把某些用户推举为特定主题的专家。最终（你希望如此），你的网站论坛会成为获取特定类型信息的首选之地。即便没有其他好处，我们亲爱的朋友谷歌和必应也会把人引到你的网站。\n\
  \n### 问题\n\n在开始之前，我们应先讨论正确的术语。论坛实际上是一组用于存储数据的容器。我们首先需要能够创建类别。**类别**是最高级别的容器，因此会有一个非常通用的主题。每个类别可以容纳任意数量的论坛。论坛与顶级类别的主题相关，但更加具体。在每个论坛中，我们可以有多个主题。每个主题都是一个非常具体的讨论话题，用户可以在其中进行讨论。讨论通过帖子进行，这些帖子只是对所属主题的回复，或者是该主题下的一个帖子。\n\
  \n### 论坛\n\n这是我们的落地页，列出了每个类别及其论坛：\n\n![](img/15a62e134135dde036b0ac3cbb01dab6_284_0.png)\n\
  \n这是我们的论坛页面，列出了该论坛所有可用的主题：\n\n![](img/15a62e134135dde036b0ac3cbb01dab6_284_1.png)\n\
  \n这是一个主题页面，同时也会列出其帖子：\n\n![](img/15a62e134135dde036b0ac3cbb01dab6_285_0.png)\n\n\
  你可以猜到，论坛这个主题非常庞大，如果觉得合适，你可以评估并集成任何现成的第三方留言板。然而，我们将会解释论坛的一些关键组成部分，在创建过程中，我们会涉及创建类别、论坛、主题和帖子的基础知识。这些部分中的每一个都能统计其下有多少数据。所有内容都将能够以\
  \ SEO 友好的方式被链接（也就是说支持友好 URL）。友好 URL 也更容易让用户记住和使用。我们还会在过滤器和朋友过滤器上加入提醒功能，这样他们就知道我们何时有新内容可用。\n\
  \n> **SEO（搜索引擎优化）** 通常被定义为优化自然搜索流量的过程。这通常意味着以搜索引擎友好的方式构建网站，并以一种让搜索引擎更容易索引页面的方式来呈现网站及其内容。通常，像\
  \ `default.aspx?userid=324568` 这样又长又难看的查询字符串，不如 `domain.com/atulgupta` 友好。更多相关信息可参见：`http://en.wikipedia.org/wiki/Search_engine_optimization`。\n\
  \n### 提醒\n\n最后，我们将扩展现有系统，使用已有的提醒系统，这样每当有人发帖或创建新主题时，我们都会在创建者的过滤器以及朋友的过滤器上看到提醒。这将有助于我们在整个网站推广新内容。\n\
  \n### 解决方案\n\n让我们看看我们的解决方案。\n\n### 实现数据库\n\n让我们从讨论数据库的实现开始。\n\n![](img/15a62e134135dde036b0ac3cbb01dab6_287_0.png)\n\
  \n### 类别\n\n正如我们之前讨论过的，类别的概念是我们的顶级数据容器。让我们看一下类别的表结构：\n\n**SortOrder** 字段负责设置显示顺序，以防同一页面上有多个类别。我们之前已经讨论过计数字段。最后几个字段用于控制最后发帖的人和时间。**PageName**\
  \ 控制着系统稍后将要使用的友好 URL。\n\n### 论坛\n\n论坛是下一级容器，保存用户创建的各个主题。\n\n与类别类似，我们维护底层帖子和主题的计数，也维护最后发帖的人和时间。注意，我们有一个指向\
  \ BoardCategories 表的外键引用。\n\n### 帖子\n\n正如我们前面所说，BoardPosts 表实际上是一个双重用途的表，同时包含帖子和主题。我们这样做主要是因为大多数情况下，每个条目的数据都是相同的，除了父级\
  \ **ThreadID** 列以外。\n\n这里需要注意的字段是 **IsThread**。这是判断帖子是否同时是主题的最简单方法。此外，我们还有 **ThreadID**，它也表示帖子和主题之间的区别：主题不会有\
  \ **ThreadID**——一个主题永远不会是另一个主题的一部分（至少现在还没有！）。还要注意，我们有一个指向论坛的外键，即 **ForumID** 外键，表示该主题属于哪个论坛。对于主题，我们还会存储其被查看的次数以及回复数。\n\
  \n这种帖子/主题结构的一个好处是，任何普通帖子都可以轻松移出，作为独立的主题处理。版主经常会发现，主题中的某个帖子比初始主题本身带来了更多流量。在这种情况下，该帖子很容易被提升为独立主题！\n\
  \n### 创建关系\n\n创建完所有表后，我们就可以创建所有关系了。\n\n对于这组表，我们在以下表之间存在关系：\n\n- BoardForums 和 BoardCategories\n\
  - BoardPosts 和 Accounts\n- BoardPosts 和 BoardForums\n- BoardPosts 和 BoardPosts（用于帖子到主题的引用）\n\
  \n\n\n\n## 设置数据访问层\n\n要设置数据访问层，请按照以下步骤操作：\n\n- 打开 Fisharoo.edmx 文件，并按照前面章节中提到的指南，添加本章中讨论的数据库表。\n\
  - 点击**保存**，你应该就可以使用上面讨论过的领域对象了！\n\n你的设计图面上应该包含前面截图中的所有项（尽管排列方式可能不同！）。\n\n### 构建仓库\n\
  \n随着新表的添加，也将会添加新的仓库，以便我们能够访问存储在这些表中的数据。我们将创建以下仓库来满足我们的需求。\n\n- BoardCategoryRepository\n\
  - BoardForumRepository\n- BoardPostRepository\n\n我们的每个仓库通常都会有一个按 ID 选择的方法、一个按父 ID\
  \ 选择所有项的方法、一个保存方法和一个删除方法。一旦你看过一个仓库，基本上就等于看过了所有仓库。关于标准仓库的示例，请回顾之前的章节、附录或随附的代码。不过，我们会讨论那些与我们目前所遵循的标准方法不同的地方！\n\
  \n### BoardCategoryRepository\n\n我们的留言板最重要的特性之一（这一点可能与其他留言板略有不同）是支持友好 URL 对我们来说非常重要。这意味着我们每个仓库中都需要一个按页面名称获取对象的方法。以下是该仓库的方法：\n\
  \n```csharp\npublic BoardCategory GetCategoryByPageName(string PageName)\n{\n  \
  \  BoardCategory category;\n    using(FisharooDataContext dc = _conn.GetContext())\n\
  \    {\n        category = dc.BoardCategories.Where(bc => bc.PageName == PageName).FirstOrDefault();\n\
  \    }\n    return category;\n}\n```\n\n这是一个相当直接的方法，可按页面名称获取板块分类。\n\n### BoardForumRepository\n\
  \nBoardForumRepository 也有一个 GetForumByPageName 方法，但它与上述 BoardCategoryRepository\
  \ 的方法完全相同。\n\n### BoardPostRepository\n\n这个仓库充满了许多有趣的要点需要介绍！首先，由于我们的用户会创建帖子和主题，但不会被允许创建论坛或分类，我们需要确保他们不会创建不唯一的页面名称。试图按名称获取一个主题，结果却得到多个不同的主题，而不是我们预期的那一个，这可不行。\n\
  \n```csharp\n//Fisharoo/DataAccess/Repositories/BoardPostRepository.cs\npublic bool\
  \ CheckPostPageNameIsUnique(string PageName)\n{\n    bool result;\n    using(FisharooDataContext\
  \ dc = _conn.GetContext())\n    {\n        BoardPost bp = dc.BoardPosts.Where(p\
  \ => p.PageName == PageName).FirstOrDefault();\n        if(bp != null)\n       \
  \     result = false;\n        else\n            result = true;\n    }\n    return\
  \ result;\n}\n```\n\n在该方法中，我们尝试按指定的 PageName 加载帖子。如果返回 null 对象，则表明该 PageName 是唯一的，可以返回\
  \ true 响应。否则，我们必须返回 false 结果。虽然不够精巧，但能完成任务。\n\n下一个方法负责获取给定主题的所有帖子。这本身并不太有趣。但因为我们知道只在查看某个主题的页面上使用这个方法，所以我们可以插入一些逻辑，用于增加主题被查看的次数。\n\
  \n> 请记住，只有当我们仅使用此方法来获取给定主题的帖子并显示它们时，该方法才是合适的。如果我们开始将此方法用于其他任务，那么我们的查看计数将会完全失真！\n\
  \n```csharp\npublic List<BoardPost> GetPostsByThreadID(Int64 ThreadID)\n{\n    List<BoardPost>\
  \ result;\n    using (FisharooDataContext dc = _conn.GetContext())\n    {\n    \
  \    //increment the view count for this thread\n        BoardPost thread = dc.BoardPosts.Where(p\
  \ => p.PostID == ThreadID).FirstOrDefault();\n        if (thread != null)\n    \
  \        thread.ViewCount += 1;\n        dc.SaveChanges();\n\n        IEnumerable<BoardPost>\
  \ posts = dc.BoardPosts.Where(p => p.ThreadID == ThreadID && !p.IsThread)\n    \
  \        .OrderBy(p => p.CreateDate);\n        result = posts.ToList();\n    }\n\
  \    return result;\n}\n```\n\n我们通过按 ID 获取主题（实际上是一个 BoardPost），然后递增其 ViewCount 属性来执行此任务。然后，我们在\
  \ DataContext 上提交更改，确保将其推送回数据库。\n\n接着，我们继续按该主题的 ID 获取其所有帖子。\n\n下一个方法 SavePost 不仅负责保存新帖子和更新现有帖子，还负责在论坛和分类两个级别上增加计数。\n\
  \n```csharp\npublic Int64 SavePost(BoardPost boardPost)\n{\n    using (FisharooDataContext\
  \ dc = _conn.GetContext())\n    {\n        if (boardPost.PostID > 0)\n        {\n\
  \            dc.BoardPosts.Attach(new BoardPost { PostID = boardPost.PostID });\n\
  \            dc.BoardPosts.ApplyCurrentValues(boardPost);\n        }\n        else\n\
  \        {\n            //get the parent containers when a new post is\n       \
  \     //created\n            // to update their post counts\n\n            BoardCategory\
  \ bc = (from c in dc.BoardCategories\n                                join f in\
  \ dc.BoardForums\n                                on c.CategoryID equals f.CategoryID\n\
  \                                where f.ForumID == boardPost.ForumID\n        \
  \                        select c).FirstOrDefault();\n\n            BoardForum bf\
  \ = (from f in dc.BoardForums\n                              where f.ForumID ==\
  \ boardPost.ForumID\n                              select f).FirstOrDefault();\n\
  \n            //update the thread count\n            if (boardPost.IsThread)\n \
  \           {\n                bc.ThreadCount = bc.ThreadCount + 1;\n          \
  \      bf.ThreadCount = bf.ThreadCount + 1;\n            }\n            //update\
  \ the post count\n            else\n            {\n                bc.PostCount\
  \ = bc.PostCount + 1;\n                bf.PostCount = bf.PostCount + 1;\n\n    \
  \            //update post count on thread\n                BoardPost bThread =\
  \ null;\n                if (boardPost.ThreadID != 0)\n                {\n     \
  \               bThread = (from p in dc.BoardPosts\n                           \
  \    where p.PostID == boardPost.ThreadID\n                               select\
  \ p).FirstOrDefault();\n                }\n                if (bThread != null)\n\
  \                {\n                    bThread.ReplyCount = bThread.ReplyCount\
  \ + 1;\n                }\n            }\n            dc.BoardPosts.AddObject(boardPost);\n\
  \        }\n        dc.SaveChanges();\n    }\n    return boardPost.PostID;\n}\n\
  ```\n\n请注意，这个方法的第一部分与其他所有保存方法完全一样。如果要保存的对象 ID 大于零，我们就把该对象作为该对象的新版本重新附加到数据上下文。然后调用\
  \ SaveChanges() 方法，将其持久化回数据库。\n\n这就是其他所有部分发生改变的地方。如果该项是一个新帖子或新主题，那么我们有一大堆事情要做。我们要做的第一件事是获取父对象。我们通过帖子关联的\
  \ ForumID 获取 BoardCategory 和 BoardForum。然后检查这个新帖子是否也是一个主题。如果是，我们就更新父对象的 ThreadCount。\n\
  \n如果只是一个普通帖子，我们就更新父对象的 PostCount。同时，我们还会获取该帖子的父主题。拿到父主题后，我们更新回复计数。然后执行我们习惯的操作：插入对象。最后，我们在数据上下文上调用\
  \ SaveChanges 方法。\n\n最后，我们来看 DeletePost 方法。请记住，帖子也可以是主题，这意味着它可能有子项。我们不能删除带有子项的主题，因为这会给我们带来引用完整性问题（也称为脏数据）。\n\
  \n```csharp\npublic void DeletePost(BoardPost boardPost)\n{\n    using (FisharooDataContext\
  \ dc = _conn.GetContext())\n    {\n        dc.BoardPosts.Attach(boardPost);\n  \
  \      //If this is a thread then we need to delete all of\n        //its children\n\
  \        if (boardPost.IsThread)\n        {\n            IEnumerable<BoardPost>\
  \ posts = dc.BoardPosts\n                .Where(bp => bp.ThreadID == boardPost.PostID)\n\
  \                .ToList();\n            foreach(BoardPost bp in posts)\n      \
  \      {\n                dc.BoardPosts.DeleteObject(bp);\n            }\n     \
  \   }\n        dc.BoardPosts.DeleteObject(boardPost);\n        dc.SaveChanges();\n\
  \    }\n}\n```\n\n因此，为了解决这个问题，我们必须检查待删除的帖子，通过其 IsThread 属性判断它是否也是一个主题。如果是，我们就遍历这些\
  \ BoardPost，并通过在 BoardPosts 集合上调用 DeleteObject() 来删除。\n\n\n\n\n\n## 实现服务/应用程序层\n\
  \n一旦所有仓储（Repository）都为单一服务目的构建完成，我们就可以开始创建服务层。同样，这一层负责组装聚合体，并利用我们的实体执行复杂操作。我们将创建以下服务：\n\
  \n- BoardService（板块服务）\n- AlertService（提醒服务）\n\n### BoardService\n\n我们的 BoardService\
  \ 实际上并不特别复杂。它负责为我们提供一种方式，以便获取已经填充了 BoardForum 项目列表的 BoardCategory。在查看 BoardService\
  \ 之前，我们需要扩展 BoardCategory 对象，使其包含一个 BoardForum 对象列表。为此，我们在 Domain 目录中添加一个 BoardCategory\
  \ 类。然后，使这个类成为公共分部类，最后添加一个 BoardForum 对象的泛型列表。\n\n```csharp\npublic partial class\
  \ BoardCategory\n{\n    public List<BoardForum> Forums { get; set; }\n}\n```\n\n\
  扩展了此类之后，我们现在可以来查看 BoardService 了。\n\n```csharp\nnamespace Fisharoo.BusinessLogic\n\
  {\n    [Export(typeof(IBoardService))]\n    public class BoardService : IBoardService\n\
  \    {\n        [Import]\n        private IBoardCategoryRepository _categoryRepository;\n\
  \        [Import]\n        private IBoardForumRepository _forumRepository;\n\n \
  \       public BoardService()\n        {\n            MEFManager.Compose(this);\n\
  \        }\n\n        public List<BoardCategory> GetCategoriesWithForums()\n   \
  \     {\n            List<BoardCategory> categories = _categoryRepository.GetAllCategories();\n\
  \            List<BoardForum> forums = _forumRepository.GetAllForums();\n      \
  \      for(int i = 0; i < categories.Count(); i++)\n            {\n            \
  \    categories[i].Forums = forums.Where(f => f.CategoryID == categories[i].CategoryID).ToList();\n\
  \            }\n            return categories;\n        }\n    }\n}\n```\n\n首先要留意的是，这个类与解决方案中的其他类一样，都使用了\
  \ MEF 特性进行标记。接下来，我们声明 BoardCategoryRepository 和 BoardForumRepository。在构造函数中，我们组合了\
  \ MEF 容器。\n\n然后，我们来看 GetCategoriesWithForums() 方法。这是一个经过优化的方法，留言板首页会调用它来获取分类及其板块的列表。这样，我们就能遍历每个列表及其子列表，而无需进行大量单独的调用。\n\
  \n该方法首先获取所有分类的列表，然后获取系统中所有板块的列表。接着，它遍历所有分类，并从板块的主列表中选取对应板块，将其放入 BoardCategory.Forums\
  \ 集合中。最后，它返回完整的分类列表。\n\n> 这是一个非常适合加入缓存的方法，因为分类和板块在网站中都是相当静态的数据列表！\n\n### AlertService\n\
  \n从基础设施的角度来看，提醒服务已经相当完整了。当我们需要额外功能时，只需添加新的服务消息即可。在此场景中，我们希望在创建新帖子或新主题时发布提醒。我们要添加的两个方法非常相似：它们都初始化一个提醒，设置提醒类型，创建消息，将提醒保存到提醒仓储中，最后将提醒发送给用户的所有好友。\n\
  \n```csharp\npublic void AddNewBoardPostAlert(BoardCategory category,\n    BoardForum\
  \ forum, BoardPost post, BoardPost thread)\n{\n    Init();\n    alert.AlertTypeID\
  \ = (int)AlertType.AlertTypes.NewBoardPost;\n    alertMessage = \"<div class=\\\"\
  AlertHeader\\\">\" +\n        GetProfileImage(_userSession.CurrentUser.AccountID)\
  \ +\n        GetProfileUrl(_userSession.CurrentUser.Username) + \" has just added\
  \ a new post to:<b>\" +\n        post.Name + \"</b></div>\";\n\n    alertMessage\
  \ += \"<div class=\\\"AlertRow\\\"><a href=\\\"\" +\n        _webContext.RootUrl\
  \ + \"forums/\" + category.Name +\n        \"/\" + forum.Name + \".aspx/\" + thread.PostID\
  \ +\n        \"\\\">\" + _webContext.RootUrl +\n        \"forums/\" + category.Name\
  \ + \"/\" + forum.Name +\n        \".aspx/\" + thread.PostID + \"</a></div>\";\n\
  \    alert.Message = alertMessage;\n    SaveAlert(alert);\n    SendAlertToFriends(alert);\n\
  }\n\npublic void AddNewBoardThreadAlert(BoardCategory category,\n    BoardForum\
  \ forum, BoardPost post)\n{\n    Init();\n    alert.AlertTypeID = (int)AlertType.AlertTypes.NewBoardThread;\n\
  \    alertMessage = \"<div class=\\\"AlertHeader\\\">\" +\n        GetProfileImage(_userSession.CurrentUser.AccountID)\
  \ +\n        GetProfileUrl(_userSession.CurrentUser.Username) + \" has just added\
  \ a new thread on the board: <b>\" +\n        post.Name + \"</b></div>\";\n\n  \
  \  alertMessage += \"<div class=\\\"AlertRow\\\"><a href=\\\"\" +\n        _webContext.RootUrl\
  \ + \"forums/\" + category.Name +\n        \"/\" + forum.Name + \".aspx/\" + post.PostID\
  \ +\n        \"\\\">\" + _webContext.RootUrl +\n        \"forums/\" + category.Name\
  \ + \"/\" + forum.Name +\n        \".aspx/\" + post.PostID + \"</a></div>\";\n \
  \   alert.Message = alertMessage;\n    SaveAlert(alert);\n    SendAlertToFriends(alert);\n\
  }\n```\n\n## 实现表示层\n\n### Default.aspx\n\n在完成整个基础设施之后，我们现在可以继续进行更有趣的部分——显示数据。我们将从首页开始。该页面负责显示所有分类以及每个分类下的所有板块，如本章第一张截图所示。\n\
  \n除了 **模型-视图-演示器（MVP）** 模式所要求的常规管道代码之外，这个页面主要由两个中继器（Repeater）组成——第一个中继器显示分类列表中的所有分类，内部的中继器则显示每个分类下的所有板块。\n\
  \n分类列表是在该页面的演示器中加载的。相关方法如下：\n\n```csharp\n//Fisharoo/Web/Forums/Presenters/DefaultPresenter.cs\n\
  public void Init(Default View)\n{\n    _view = View;\n    List<BoardCategory> list\
  \ = _boardService.GetCategoriesWithForums();\n    _view.LoadCategories(Translator.BoardCategoryToPEBoardCategory(list));\n\
  }\n```\n\n一旦页面的代码后置文件通过调用演示器的 **init** 方法将控制权传递给演示器，演示器便会通过 LoadCategories 方法将（来自\
  \ BoardService 的）分类和板块列表传回代码后置文件。同时请注意 PEBoardCategory 表示实体的使用。我们已在第 5 章讨论过表示实体，因此这里不再赘述。\n\
  \n然后，代码后置文件会加载第一个中继器的数据源并绑定它。\n\n```csharp\n//Fisharoo/Web/Forums/Default.aspx.cs\n\
  public partial class Default : System.Web.UI.Page, IDefault\n{\n    private DefaultPresenter\
  \ _presenter;\n    protected void Page_Load(object sender, EventArgs e)\n    {\n\
  \        _presenter = new DefaultPresenter();\n        _presenter.Init(this);\n\
  \    }\n\n    public void LoadCategories(List<PEBoardCategory> Categories)\n   \
  \ {\n        repCategories.DataSource = Categories;\n        repCategories.DataBind();\n\
  \    }\n\n    public void repCategories_ItemDataBound(object sender, RepeaterItemEventArgs\
  \ e)\n    {\n        if (e.Item.ItemType == ListItemType.Item || e.Item.ItemType\
  \ == ListItemType.AlternatingItem)\n        {\n            if (((PEBoardCategory)\
  \ e.Item.DataItem).Forums != null)\n            {\n                Repeater repForums\
  \ = e.Item.FindControl(\"repForums\") as Repeater;\n                repForums.DataSource\
  \ = ((PEBoardCategory) e.Item.DataItem).Forums;\n                repForums.DataBind();\n\
  \            }\n        }\n    }\n\n    public void repForums_ItemDataBound(object\
  \ sender, RepeaterItemEventArgs e)\n    {\n        HyperLink linkForum = e.Item.FindControl(\"\
  linkForum\") as HyperLink;\n        linkForum.NavigateUrl = Page.GetRouteUrl(\"\
  ForumRoute\", new {\n            categoryname = ((PEBoardForum) e.Item.DataItem).CategoryName,\n\
  \            forumname = ((PEBoardForum)e.Item.DataItem).Name\n        });\n   \
  \ }\n}\n```\n\n在 repCategories_ItemDataBound 方法的每次迭代中，我们都会用给定分类（PEBoardForum）下的板块列表来加载\
  \ repForums 中继器并绑定它。这个过程会持续进行，直到分类和板块的列表都被呈现在页面上。\n\n另外请注意，当每个板块项被绑定时，我们都会将相应的 URL\
  \ 设置为超链接控件的 NavigateUrl 属性。这是一个友好的 URL，会将我们带到相应的板块页面。\n\n\n\n\n\n## URL 路由\n\n为了支持用户友好的\
  \ URL，我们将再次使用 URL 路由功能。我们的附加代码将插入到 Global.asax.cs 中的 RegisterRoute() 方法中。我们将为论坛支持四种不同的\
  \ URL 模式。让我们快速查看每种模式：\n\n- 像 **http://server/appname/forums/categoryname/forumname.aspx**\
  \ 这样的 URL 用于访问特定类别中的特定论坛。此请求将由 **ViewForum.aspx** 处理。\n- 像 **http://server/appname/forums/categoryname/forumname/postid**\
  \ 这样的 URL 用于访问论坛中的特定帖子/主题。此请求将由 **ViewPost.aspx** 处理。\n- 像 **http://server/appname/forums/categoryname/forumname.aspx/new**\
  \ 这样的 URL 用于在论坛中创建新主题。此请求将由 **Post.aspx** 处理。\n- 像 **http://server/appname/forums/categoryname/forumname.aspx/reply**\
  \ 这样的 URL 用于在论坛中创建新主题。此请求将由 **Post.aspx** 处理。\n\n您可以查看代码，了解这些模式是如何形成并添加到路由集合中的。\n\
  \n### ViewForum.aspx\n\n视图论坛页面负责显示单个论坛及其所有主题，如本章第二张截图所示。\n\n视图论坛页面首先从路由数据集合中提取类别名称和论坛名称，并将其传递给呈现器。呈现器返回特定论坛中所有主题的集合。视图拿到这个集合后，便填充页面的显示内容。在每次遍历主题时，repTopics_ItemDataBound\
  \ 方法会加载 linkViewTopic HyperLink 控件的 NavigateUrl 属性，该属性是指向特定帖子页面的花式路径。该路径的一部分是 IsThread=1\
  \ 变量。原因是这个页面是一个双用途页面，既用于创建帖子，也用于创建主题。\n\n```csharp\n//Fisharoo/Web/Forums/ViewForum.aspx.cs\n\
  public partial class Forum : System.Web.UI.Page, IViewForum\n{\n    private ViewForumPresenter\
  \ _presenter;\n\n    protected void Page_Load(object sender, EventArgs e)\n    {\n\
