  \ 页面\n\n现在让我们看一下评分页面。\n\n## Ratings.ascx\n\n评分控件负责显示一个模态弹出框，其中包含各种可评分的选项。然后它捕获这些评分并将它们保存到数据库中。除了处理用户交互外，它还显示该特定对象的总体平均评分。\n\
  \n为了使用评分控件或模态弹出框，我们需要注册 AjaxControlToolkit（版本 4.1.1.40412.2）。添加完成后，我们可以将模态弹出框挂接到我们的\
  \ `pnlModalPopup` 上。这个面板包含一个 repeater，用来显示该对象所有可用的评分。在模态弹出框之外，我们还有一个评分控件，用于显示对象的平均评分。\n\
  \n```aspx\n//Fisharoo/Web/UserControls/Ratings.ascx\n<asp:Panel ID=\"pnlRating\"\
  \ runat=\"server\">\n    <asp:UpdatePanel runat=\"server\">\n        <ContentTemplate>\n\
  \            <asp:LinkButton ID=\"lbRateThis\" runat=\"server\" Text=\"Rate this!\"\
  \ OnClick=\"lbRateThis_Click\"></asp:LinkButton>\n            <asp:Label ID=\"lblThankYou\"\
  \ runat=\"server\" Text=\"Your ratings have been saved! \" Visible=\"false\"></asp:Label><br\
  \ />\n            <ccl:Rating ID=\"Rating1\" Enabled=\"false\" ReadOnly=\"true\"\
  \ runat=\"server\" MaxRating=\"5\" EmptyStarCssClass=\"ratingStarEmpty\" FilledStarCssClass=\"\
  ratingStarFilled\" StarCssClass=\"ratingStar\"\n                PopupControlID=\"\
  pnlModalPopup\"\n                OkControlID=\"btnSave\" CancelControlID=\"btnCancel\"\
  \ />\n        </ContentTemplate>\n    </asp:UpdatePanel>\n</asp:Panel>\n```\n\n\
  在这个 UI 中有两点需要注意。第一行是将 `SystemObjectRatingOptionID` 赋给 Rating 控件的 `Tag` 属性的那行代码。\n\
  \n```aspx\nTag=\"<%# ((PESystemObjectRatingOption)Container.DataItem).SystemObjectRatingOptionID\
  \ %>\"\n```\n\n当选择一个 Rating 时，它会触发一个事件，该事件包含 Rating 控件和选定的值（选中的星星）。我们将 `SystemObjectRatingOptionID`\
  \ 通过 Rating 的 `Tag` 属性传递。\n\n第二点需要注意的是 `btnSave` 按钮中的一个属性。`UseSubmitBehavior` 属性会关闭\
  \ `btnSave` 按钮的提交行为。如果我们不禁用这个属性，那么当你点击按钮时，模态弹出框会消失，你将无法捕获 `btnSave_Click` 事件。当你确实关闭此行为时，我们就能捕获该事件。\n\
  \n## Ratings.ascx.cs\n\n在这个类中，我们有两个属性——`SystemObjectID` 和 `SystemObjectRecordID`。它们让我们能够为相应的对象加载和捕获数据。接下来，我们初始化\
  \ presenter。在此过程中，我们加载当前选项，设置显示，并设置当前评分。\n\n接下来，我们有事件处理器，用于捕获用户在模态弹出框中选择评分的事件。这个事件直接传递给\
  \ presenter。\n\n然后是 `btnSave_Click` 事件处理器。这个方法不仅将事件上传到 presenter，还将 `pnlModalPopup`\
  \ 的可见性设置为 false，从而有效地隐藏弹出框。（如果不这样做，ModalPopup 似乎会出现问题，并在页面中显示自身，而不是显示在页面上方。）我们还隐藏了充当显示\
  \ ModalPopup 链接的标签，以及显示控件平均评分的 Rating 控件。最后，我们感谢用户的输入！\n\n然后我们来到 `lbRateThis_Click`\
  \ 方法，它显示模态弹出面板 `pnlModalPopup`。\n\n最后，我们有一个方法，用于设置 **lbRateThis**（显示模态弹出框的链接）和 **pnlModalPopup**\
  \ 的可见性。这个方法直接与 presenter 交互：\n\n```csharp\n//Fisharoo/Web/UserControls/Ratings.ascx.cs\n\
  public partial class Ratings : System.Web.UI.UserControl, IRatings\n{\n    ...\n\
  \    public void LoadOptions(List<PESystemObjectRatingOption> Options)\n    {\n\
  \        repRatingOptions.DataSource = Options;\n        repRatingOptions.DataBind();\n\
  \    }\n    ...\n    protected void btnSave_Click(object sender, EventArgs e)\n\
  \    {\n        _presenter.btnSave_Click(sender, e, SystemObjectID,\n          \
  \                        SystemObjectRecordID);\n        pnlModalPopup.Visible =\
  \ false;\n        lbRateThis.Visible = false;\n        Rating1.Visible = false;\n\
  \        lblThankYou.Visible = true;\n    }\n    protected void lbRateThis_Click(object\
  \ sender, EventArgs e)\n    {\n        pnlModalPopup.Visible = true;\n    }\n  \
  \  public void CanSetRating(bool Visible)\n    {\n        lbRateThis.Visible = Visible;\n\
  \        pnlModalPopup.Visible = Visible;\n    }\n}\n```\n\n## RatingsPresenter.cs\n\
  \n在 RatingsPresenter 中，我们从 `Init()` 方法开始。该方法为我们的 Ratings 控件加载所有选项。然后继续判断用户是否已登录。如果未登录，我们就禁用设置评分的能力。如果用户已登录，我们检查该用户之前是否已经为此控件提供过评分。如果已经提供过，我们同样禁用设置评分的能力。否则，我们允许用户提供评分。最后，我们为这个控件设置当前评分。\n\
  \n\n\n\n\n## 用户交互\n\n接下来，我们有 `LoadOptions()` 方法，它通过填充显示所有可用选项来实现。它通过从视图中获取 `SystemObject`\
  \ 的属性和 `SystemObjectRecordID`，并将它们传递给 `SystemObjectRatingOptionService.GetSystemObjectRatingOptionsBySystemObjectID()`\
  \ 方法。\n\n然后是 `rating_Changed()` 方法，它捕获来自显示的事件。我们创建一个新的 `Dictionary<int, int>` 对象并添加\
  \ `SystemObjectRatingOptionID` 和所选评分。我们然后通过 `WebContext.SelectedRatings` 属性将此添加到该用户的\
  \ `Session` 中。（请记住，这会将评分添加到存储在会话中的集合中。）\n\n最后，我们来到 `btnSave_Click()` 方法，它捕获从代码后方传递上来的保存按钮点击。在此方法中，我们加载存储在会话中的\
  \ `Dictionary<int, int>` 评分集合。然后我们创建一个新的 `Generic List of Ratings`。如果我们手头有评分，我们就会遍历\
  \ `KeyValuePairs` 列表。每次迭代时，我们都会启动一个新的 `Rating` 并将其添加到 `Ratings` 集合中。然后我们将所有评分保存到\
  \ `RatingRepository.SaveRatings()` 方法。然后我们使用 `WebContext.ClearSelectedRatings()`\
  \ 清除会话。\n\n```csharp\n//Fisharoo/Web/UserControls/Presenters/RatingsPresenter.cs\n\
  public class RatingsPresenter\n{\n    ...\n\n    public void Init(IRatings view,\
  \ bool IsPostBack)\n    {\n        _view = view;\n        LoadOptions(_view.SystemObjectID,\
  \ _view.SystemObjectRecordID);\n        if(_webContext.CurrentUser == null)\n  \
  \          _view.CanSetRating(false);\n        else if (_ratingService.HasRatedBefore(_view.SystemObjectID,\
  \ _view.SystemObjectRecordID, _webContext.CurrentUser.AccountID))\n            _view.CanSetRating(false);\n\
  \        else\n            _view.CanSetRating(true);\n\n        _view.SetCurrentRating(_ratingService.GetCurrentRating(\n\
  \            _view.SystemObjectID, _view.SystemObjectRecordID));\n    }\n\n    public\
  \ void LoadOptions(int SystemObjectID, long SystemObjectRecordID)\n    {\n     \
  \   List<SystemObjectRatingOption> list = _systemObjectRatingOptionsService.GetSystemObjectRatingOptionsBySystemObjectID(SystemObjectID);\n\
  \        _view.LoadOptions(Translator.SystemObjectRatingOptionTOPESystemObjectRatingOption(list));\n\
  \    }\n\n    public void rating_Changed(object sender, RatingEventArgs args)\n\
  \    {\n        AjaxControlToolkit.Rating rating = sender as AjaxControlToolkit.Rating;\n\
  \n        Dictionary<int, int> newRating = new Dictionary<int, int>();\n       \
  \ newRating.Add(Convert.ToInt32(rating.Tag), Convert.ToInt32(args.Value));\n   \
  \     _webContext.SelectedRatings = newRating;\n    }\n\n    public void btnSave_Click(object\
  \ sender, EventArgs e, int SystemObjectID, long SystemObjectRecordID)\n    {\n \
  \       Dictionary<int, int> selectedRatings = _webContext.SelectedRatings;\n  \
  \      List<Rating> ratings = new List<Rating>();\n        if(selectedRatings !=\
  \ null)\n        {\n            foreach (KeyValuePair<int, int> pair\n         \
