  \ Post.aspx\n\n帖子页面是论坛实际上要求您登录后才能操作的页面。一旦登录，您就可以创建新主题或回复现有的主题或帖子。\n\n![](img/15a62e134135dde036b0ac3cbb01dab6_303_0.png)\n\
  \n关于此页面，您可能唯一会忽略的是它是双用途的。这意味着我们需要能够处理创建主题和帖子。区别在于，帖子的标题会按照主题的标题预先填充，并且无法编辑。\n\n\
  一旦所有 UI 正常工作，我们就需要连接 **保存** 按钮。这在一定程度上是通过代码后置中的 **btnSubmit_Click** 方法完成的，我们在其中捕获来自\
  \ UI 的所有数据。然后，我们尝试将数据以 BoardPost 的形式传递给呈现器，以将数据实际持久化到数据库中。\n\n```csharp\n//Fisharoo/Web/Forums/Post.aspx.cs\n\
  protected void btnSubmit_Click(object sender, EventArgs e)\n{\n    BoardPost post\
  \ = new BoardPost();\n    post.Name = txtName.Text;\n    post.Post = txtPost.Text;\n\
  \    _presenter.Save(post);\n}\n```\n\n现在，呈现器中的 Save 方法比前面这些代码要复杂一些。\n\n```csharp\n\
  //Fisharoo/Web/Forums/Presenters/PostPresenter.cs\npublic void Save(BoardPost post,\
  \ string forumName, long postID)\n{\n    BoardForum forum = _forumService.GetForumByName(forumName);\n\
  \    Boolean newPost = false;\n    //is new thread\n    if (postID == 0)\n    {\n\
  \        post.ForumID = forum.ForumID;\n        post.IsThread = true;\n        newPost\
  \ = true;\n    }\n    //is reply post\n    else\n    {\n        BoardPost postToReplyToo\
  \ = _postService.GetPostByID(postID);\n        if (postToReplyToo.IsThread)\n  \
  \          post.ThreadID = postToReplyToo.PostID;\n        else\n            post.ThreadID\
  \ = postToReplyToo.ThreadID;\n\n        post.ForumID = postToReplyToo.ForumID;\n\
  \    }\n    post.CreateDate = DateTime.Now;\n    post.UpdateDate = DateTime.Now;\n\
  \    post.AccountID = _webContext.CurrentUser.AccountID;\n    post.Username = _webContext.CurrentUser.Username;\n\
  \    post.ReplyCount = 0;\n}\n```\n\n\n\n```csharp\npost.ViewCount = 0;\n\npost.PostID\
  \ = _postService.SavePost(post);\n\nAccount act = _accountService.GetAccountByID(_webContext.CurrentUser.AccountID);\n\
  \nif (!newPost)\n{\n    _accountService.SaveAccount(act);\n}\n\nBoardCategory category\
  \ = _categoryService.GetCategoryByCategoryID(forum.CategoryID);\nBoardPost thread;\n\
  if (post.IsThread)\n    thread = _postService.GetPostByID(post.PostID);\nelse\n\
  \    thread = _postService.GetPostByID((long)post.ThreadID);\n\n//add an alert to\
  \ the filter\nif (post.IsThread)\n    _alertService.AddNewBoardThreadAlert(category,\
  \ forum, thread);\nelse\n    _alertService.AddNewBoardPostAlert(category, forum,\
  \ post, thread);\n\nRouteValueDictionary values = new RouteValueDictionary\n{\n\
  \    {\"categoryname\", category.Name},\n    {\"forumname\", forum.Name},\n    {\"\
  postid\", thread.PostID}\n};\nVirtualPathData vpd = RouteTable.Routes.GetVirtualPath(null,\
  \ \"ThreadRoute\", values);\n_redirector.GoToForumsViewPost(vpd.VirtualPath);\n\
  }\n```\n\n该方法最初看起来是要判断我们是在处理帖子还是主题。如果我们正在处理一个新主题，那么我们需要设置 ForumID 和 IsThread 属性。\n\
  \n如果我们处理的是帖子而不是主题，那么我们会获取正在回复的帖子。基于此，我们检查它是一个主题还是一个简单的帖子。如果它是一个主题，那么我们将新帖子的 ThreadID\
  \ 属性设置为该帖子的 PostID。否则我们将帖子的 ThreadID 设置为该帖子的 ThreadID。我们还从 postToReplyTo 的 ForumID\
  \ 属性设置 ForumID。\n\n在做出这些判断并设置初始值后，我们就可以继续设置其他属性，例如创建日期、更新日期、accountID 等等。最后我们保存帖子并获取新创建帖子的\
  \ PostID。\n\n帖子创建后，我们需要确定要向朋友发送什么类型的提醒。如果是主题，则发送新主题提醒。否则发送新帖子提醒。\n\n最后我们创建用户友好的\
  \ URL，将用户重定向到查看其新帖子。\n\n### Summary\n\n在本章中，我们创建了管理论坛的核心功能——分类、论坛、主题和帖子。除了这些功能之外，我们还大量实现了友好\
  \ URL，以帮助我们的内容更符合 SEO。这应该能有效地为各种搜索引擎蜘蛛提供信息。为了传播我们新内容的信息，我们还将论坛部分集成到我们的提醒服务中。这会将每个新帖子广播到每个发帖用户的朋友的主页上。\n\
  \n如前所述，论坛是一个很大的主题。虽然我们实现了一个很好的基础，但这一部分远非功能完整。如果你查看市场上论坛和留言板提供的众多选项，你会很快注意到可以在我们构建的基础上实现许多其他功能。投票和勋章是使论坛更加丰富的两个重要功能。我们将在后面的章节中查看扩展我们的实现以支持这些功能。这是一个很好的开始！\n"
- "# 10 Groups\n\n什么是 Groups？在社交网络的上下文中，**Groups** 允许你的社区用户围绕共同主题相互交流。Groups 开始将我们其他已创建的概念整合在一起。诸如论坛、博客、图片等项目，以及许多其他功能，都可以从群组的角度得到更好的利用。\n\
  \n以论坛为例。作为我们社区的用户，你可以与预先创建的论坛互动，并且能够在系统中的任何公共论坛上发布主题或回复。你希望其他与你有相似兴趣的用户，或那些能回答你发布问题的用户，会偶然看到你的帖子。很多人会看到你的帖子，有些人会回复。但不能保证合适的人会看到它，更不能保证合适的人会给出你寻求的回应。如果你能够将主题发布到与你的兴趣\
  \ somewhat 相关的论坛，那么你的机会会稍微提高一些。\n\n另一方面，有群组拥有的论坛时，你知道有一个特定的社区，在全球社区内部，对你的论坛帖子给予了额外的关注。此外，当你向群组拥有的论坛发帖时，你知道该群组的整个用户群会被告知你的帖子发布情况，通常是通过适当的通知。这增加了你获得所需信息的机会。而且你知道查看你帖子的大多数人很可能拥有你感兴趣的信息。\n\
  \n把群组想象成具有特殊兴趣的子社区。因为它们是子社区，它们在系统中与用户一样拥有生命，只是它们代表许多用户行事。通过成为群组的一部分，你获得了许多具有共同兴趣的新朋友。你可以访问特殊兴趣论坛，你还可以看到隐藏的图片库！\n\
  \n以下是我们将要构建的示例：\n\n![](img/15a62e134135dde036b0ac3cbb01dab6_308_0.png)\n\n### Problem\n\
  \n鉴于示例站点中有如此多的功能，我们不可能将它们全部与我们的群组功能集成。然而，当你阅读本章时，请记住，社区中适用于个人的几乎任何东西都可以被修改以适用于一群人。在本章中，我们将专注于创建群组的核心框架。\n\
  \n我们正在构建的框架将允许我们创建一个群组，该群组在我们的站点中既有公共也有私有的存在。群组还将能够拥有专用的群组页面。\n\n以下是将为群组创建构建的界面：\n\
  \n除了群组的成员资格之外，我们还将提供一种方式，让其中一些成员被视为群组的拥有者或管理员。\n\n一旦基础建立起来，我们将开始连接我们其他的一些功能。我们将允许每个群组拥有自己的论坛。该论坛有一些不同之处，即当用户向论坛发帖时，论坛不会向他们的朋友发送提醒，而是向该群组的所有成员发送提醒。\n\
  \n在未来，我们还可以扩展群组功能，使其拥有自己的过滤器，以类似的方式捕获对账户的用户提醒。我们也可以让相关博客帖子显示在群组的主页上。我们也可以在群组主页上显示最新的论坛帖子。我们可以显示最新上传的图片。并且还可以基于群组基础完成许多其他事情。\n\
  \n### Design\n\n让我们来看看此功能的設計。\n\n#### Groups\n\nAccounts 表是系统中许多项目的核心枢纽的方式相同，Groups\
  \ 表也可以构建为额外的枢纽。因此，我们将首先处理此功能的创建。群组的表结构并不过于复杂。\n\n你可能已经习惯看到计数在父级中汇总。我们将再次解释我们这样做是为了消除运行聚合查询的需求。相反，当我们加载对象时，我们将自动已经掌握计数。\n\
  \n你可能也习惯看到页面名称的概念。由于群组页面将成为信息的主要中心，我们希望确保就 Google 或其他搜索引擎蜘蛛而言，这是一个真正的页面，而不是某个服务器生成的页面。我们这样做是为了希望获得那些珍贵的\
  \ SEO 分数。此外，这对于用户来说更容易知道他们在哪里，并且允许我们的用户向朋友发送可读的 URL，这促进了分享！\n\n最后需要注意的重要一点是我们群组条目中的\
  \ IsPublic 标志。这将是告诉我们任何人是否可以访问该群组或只有群组成员可以访问的关键。我们稍后会更详细地讨论这一要求。\n\n\n\n\n\n## 群组成员（GroupMembers）\n\
  \n一般来说，一个群组中会有不止一个用户来协助运营。因此，我们会在群组中设置一个 AccountID，用来标识群组的所有者。但我们还需要一种方法来追踪群组的所有成员，以及那些同时也是管理员的成员。\n\
  \n从截图中的结构可以看出，我们将通过追踪 GroupID 和 AccountID 来创建群组（Groups）与账户（Accounts）之间的关系。除这些信息外，我们还会记录成员何时申请加入、是否已批准（IsApproved），以及该账户是否也是管理员（IsAdmin）。这为我们创建群组成员提供了所需的一切。\n\
  \n## 群组类型（GroupTypes）\n\n最终我们的系统中会有许多不同类型的群组。作为一项附加功能，我们希望用户能够轻松找到他们可能感兴趣的群组。为了提供这一功能，我们将建立一个系统来追踪群组的类型。将来，我们可以利用这个系统来搜索群组或将它们分组。这个系统还能让我们实现这样的提示：“如果你喜欢这个群组，你可能也会对这些相关群组感兴趣。”\n\
  \n正如你在截图中的关系所看到的，群组可以与多个群组类型关联（反之亦然）。这个结构本身非常简单明了。\n\n## 群组论坛（GroupForums）\n\n正如前面提到的，当用户创建群组时，他们还会获得一个属于该群组的论坛。为了实现这一点，我们需要在群组和新论坛之间建立关联。\n\
  \n这是一个简单的多对多关系，使我们在技术上可以让多个论坛和多个群组相互关联。不过，我们不喜欢在设计上引入限制。因此，万一我们需要一个群组对应多个论坛，或者一个群组拥有多个论坛，我们也能做到。\n\
  \n## 解决方案\n\n现在让我们来看看我们的解决方案。\n\n## 实现数据库\n\n让我们来看看实现数据库所需的内容。下面的截图显示了相关的表。\n\n\
  ![](img/15a62e134135dde036b0ac3cbb01dab6_312_0.png)\n\n### 群组（Groups）\n\n请参考前面截图中\
  \ Groups 表的结构。该表的大部分内容不言自明。不过，有一点需要特别注意，那就是 **Body** 字段，它在这里是 **varchar(MAX)**。这意味着，从技术上讲，用户可以在这里输入任意数量的文本。如果你不希望提供这种功能，那么可以将这个字段改小，或者对这个字段添加某种客户端验证来限制其大小。\n\
  \n你可能还会好奇，为什么我们有一个较大的 **Description** 字段和一个更大的 **Body** 字段。主要原因是我们需要公共和私有的文本字段。描述可以只是群组页面文本的第一段，也可以是一段简短的概要。这完全取决于你如何组织输出。我们这样设置，使得描述和正文同时显示，描述位于上方。\n\
  \n另一个值得注意的地方是，我们为每个群组都追踪一个 **FileID**。这个引用允许我们向系统上传一张照片，用作群组的头像或标志。\n\n### 群组成员（GroupMembers）\n\
  \nGroupMembers 表允许我们定义谁可以成为我们的群组成员。除了定义成员资格之外，这个表还允许我们接受或拒绝成员。一旦有了成员，我们还可以使用这个结构来定义群组中的其他管理员。\n\
  \n### 群组类型（GroupTypes）\n\n这个表允许我们定义系统要提供的不同群组类型。如果你希望允许用户自定义群组类型，可以添加一个额外的字段来定义该类型是系统定义的还是用户定义的。我们可能会将这个标志命名为\
  \ IsSystemType。这将帮助我们定义初始类型库。\n\n一旦创建了 GroupTypes 表，我们就可以将注意力转向捕获群组及其类型之间的关系。请记住，如果合适的话，用户将能够将他们的群组关联到多个类型。\n\
  \n这是一个简单的多对多关系定义表，用来追踪 **GroupID** 和 **GroupTypeID**。\n\n### 群组论坛（GroupForums）\n\
  \n这个表，正如前面描述的许多表一样，只是一个多对多关系表。这个表允许我们的每个群组也拥有一个论坛。我们通过追踪 **GroupID** 和 **ForumID**\
  \ 来实现这一点。\n\n## 群组（Groups）\n\n### IsOwner\n\nIsOwner 方法负责判断传入的 AccountID 是否是传入的\
  \ GroupID 所关联群组的所有者。这是在 DataContext 的 groups 集合上使用 where 子句来执行的，以确定是否拥有所有权。如果返回的项不为\
  \ null，那么我们就知道该用户确实是所有者；否则他/她不是。\n\n```csharp\n//Fisharoo/DataAccess/Repositories/GroupRepository.cs\n\
  public bool IsOwner(int AccountID, int GroupID)\n{\n    bool result = false;\n \
  \   using (FisharooDataContext dc = conn.GetContext())\n    {\n        if (dc.Groups.Where(g\
  \ => g.AccountID == AccountID &&\n                g.GroupID == GroupID).FirstOrDefault()\
  \ != null)\n            result = true;\n    }\n    return result;\n}\n```\n\n###\
  \ CheckIfGroupPageNameExists\n\n这个方法非常重要，因为它判断某个群组的页面名称是否已被使用。\n\n```csharp\n//Fisharoo/DataAccess/Repositories/GroupRepository.cs\n\
  public bool CheckIfGroupPageNameExists(string PageName)\n{\n    bool result = false;\n\
  \    using (FisharooDataContext dc = conn.GetContext())\n    {\n        Group group\
  \ = dc.Groups.Where(g => g.PageName ==\n                PageName).FirstOrDefault();\n\
  \        if(group == null)\n            result = false;\n    }\n    return result;\n\
  }\n```\n\n### GroupToGroupTypeRepository\n\n请记住，这个特定的存储库支持的是一种非常简单的表结构——可以说是一个查找表。因此，这个存储库也相当轻量。我们将只讨论这个存储库中的一个方法。\n\
  \n```csharp\nList<GroupToGroupType> GrouptoGroupType = dc.GroupToGroupTypes.Where(g\
  \ => itemsToDelete.Contains(g.GroupTypeID) && g.GroupID == GroupID).ToList();\n\
  foreach (GroupToGroupType gptogpt in GrouptoGroupType)\n{\n    dc.GroupToGroupTypes.DeleteObject(gptogpt);\n\
  }\n// create the actual objects to insert and insert\nforeach (long l in itemsToInsert)\n\
  {\n    GroupToGroupType g = new GroupToGroupType()\n    {\n        GroupID = GroupID,\
  \ GroupTypeID = l\n    };\n    dc.GroupToGroupTypes.AddObject(g);\n}\ndc.SaveChanges();\n\
  ```\n\n正如你所见，我们基本上只是使用标准的 LINQ 语句来为每个目的创建唯一的项目列表。我们首先获取当前关系的列表。然后，我们列出要删除的项目和要创建的项目。接下来，我们实际删除需要移除的关系。然后创建表示这些关系的对象。接着，我们插入这些对象。在需要编写的代码量方面确实有一些工作量。但请记住，这样做可以最大限度地减少数据库抖动，并且保证数据的干净整洁！\n\
  \n### GroupForumRepository\n\n与我们刚才讨论的存储库相比，GroupForumRepository 更没什么特别之处。这个存储库同样支持一个标准的多对多查找表。\n\
  \n这里的方法都很普通，因为它们都与我们之前在其它存储库示例中看到的方法类似。\n\n### GroupMemberRepository\n\n这个特定的存储库提供了许多辅助性的数据库查询，使我们能够执行批量操作、简单任务（例如在管理员状态之间提升和降级成员），以及判断用户是成员还是管理员等任务。\n\
  \n### GetMemberAccountIDsByGroupID\n\n这个特定的方法无论如何都不复杂。但你会注意到，它从两个数据源创建了一个成员列表。它首先查看\
  \ GroupMembers 表定义的所有成员。然后考虑到群组的所有者不在该列表中，因此它还会提取所有者并添加到该列表中。\n\n```csharp\n//Fisharoo/DataAccess/Repositories/GroupMemberRepository.cs\n\
  public List<int> GetMemberAccountIDsByGroupID(Int32 GroupID)\n{\n    List<int> result\
  \ = new List<int>();\n    using (FisharooDataContext dc = conn.GetContext())\n \
  \   {\n        result = dc.GroupMembers.Where(gm => gm.IsApproved &&\n         \
  \                gm.GroupID == GroupID).\n                         Select(gm =>\
  \ gm.AccountID).ToList();\n        result.Add(dc.Groups.Where(g => g.AccountID ==\n\
  \                    GroupID).Select(gm => gm.AccountID).FirstOrDefault());\n  \
  \  }\n    return result;\n}\n```\n\n### DeleteGroupMembers\n\n这是一个执行批量操作的方法。我们根据传入方法的\
  \ ID 选择一个成员列表。然后，我们将该 GroupMembers 列表传递给 DeleteAllOnSubmit 方法，从而执行批量删除。这将为之后成员管理页面上的多选页面提供支持。\n\
  \n```csharp\n//Fisharoo/DataAccess/Repositories/GroupMemberRepository.cs\npublic\
  \ void DeleteGroupMembers(List<int> MembersToDelete, int\n                     \
  \          GroupID)\n{\n    using (FisharooDataContext dc = conn.GetContext())\n\
  \    {\n        IEnumerable<GroupMember> members =\n            dc.GroupMembers.Where(gm\
  \ =>\n                MembersToDelete.Contains(gm.AccountID)\n                &&\
  \ gm.GroupID == GroupID);\n        foreach(GroupMember grpmember in members) {\n\
  \            dc.GroupMembers.DeleteObject(grpmember);\n        }\n        dc.SaveChanges();\n\
  \    }\n}\n```\n\n\n\n## 群组\n\n### GroupTypeRepository\n\nGroupTypeRepository 有一些用于执行基本任务的方法。这些方法都很普通，因此我们在这里不再讨论。\n\
  \n### AccountRepository\n\n这个特定的存储库在多个章节中不断扩展。为了支持群组，我们必须向这个类添加两个新方法——GetApprovedAccountsByGroupID\
  \ 和 GetAccountsToApproveByGroupID。它们允许我们使用 GroupMembers 表从成员关系的角度查找实际的 Account。我们将获取希望加入我们群组的用户，以及已经是群组成员的用户。\n\
  \n#### GetApprovedAccountsByGroupID\n\n这个方法之所以值得我们关注，主要是因为它支持服务端分页，也就是说，它能够在较大的数据集中显示一个子集。这是通过一些标准的\
  \ LINQ 表达式——Skip() 和 Take() 来实现的。\n\n```csharp\n//Fisharoo/DataAccess/Repositories/AccountRepository.cs\n\
  public List<Account> GetApprovedAccountsByGroupID(int GroupID,\n               \
  \                                    int PageNumber, int\n                     \
  \                              NumberOfRecordsInPage)\n{\n    List<Account> result\
  \ = null;\n    using (FisharooDataContext dc = conn.GetContext())\n    {\n     \
  \   IEnumerable<Account> accounts = (from a in dc.Accounts\n                   \
  \                      join m in dc.GroupMembers on a.AccountID equals\n       \
  \                                  m.AccountID\n                               \
  \          where m.GroupID == GroupID && m.IsApproved\n                        \
  \                 orderby a.AccountID\n                                        \
  \ select a).Skip((NumberOfRecordsInPage *\n                                    \
  \     (PageNumber - 1))).Take(NumberOfRecordsInPage);\n        result = accounts.ToList();\n\
  \    }\n    return result;\n}\n```\n\n在这个方法中，我们接收 GroupID 和 PageNumber。这告诉了我们所关注的数据集合及其子集。LINQ\
  \ to Entities 查询在调用 Skip() 方法之前是非常标准的。这个调用允许我们告诉查询要从数据集合中的哪一条记录开始。紧接着，我们调用 Take()\
  \ 方法，它告诉查询从开始记录起，我们希望在返回的数据集中包含多少条记录。\n\n执行跳过逻辑的最简单方式是，用我们希望每页包含的记录数（存储在配置文件的某处）乘以当前页码（减一，因为从技术上讲这是一种基于零的方式）。Take()\
  \ 方法只需要知道你想用多少条记录来组成页面数据集。\n\n#### GetAccountsToApproveByGroupID\n\n这个方法只是对 GroupMembers\
  \ 和 Groups 的一个简单查询。\n\n```csharp\n//Fisharoo/DataAccess/Repositories/AccountRepository.cs\n\
  public List<Account> GetAccountsToApproveByGroupID(int GroupID)\n{\n    List<Account>\
  \ result = null;\n    using (FisharooDataContext dc = conn.GetContext())\n    {\n\
  \        IEnumerable<Account> accounts = (from a in dc.Accounts\n              \
  \                           join m in dc.GroupMembers on a.AccountID equals m.AccountID\n\
  \                                         where m.GroupID == GroupID && !m.IsApproved\n\
  \                                         select a);\n        result = accounts.ToList();\n\
  \    }\n    return result;\n}\n```\n\n### 实现服务层/应用层\n\n一旦所有用于单一目的的存储库构建完成，我们就可以开始创建服务层。同样，这一层负责组装聚合对象，并用我们的实体执行复杂操作。我们将创建和修改以下服务：\n\
  \n- GroupService\n- AlertService\n- Redirector\n- WebContext\n\n```csharp\nform.LastPostByUsername\
  \ = webContext.CurrentUser.Username;\nform.LastPostDate = DateTime.Now;\nform.Name\
  \ = group.Name;\nform.PageName = group.PageName;\nform.PostCount = 0;\nform.Subject\
  \ = group.Name;\nform.ThreadCount = 0;\nform.UpdateDate = DateTime.Now;\nint ForumID\
  \ = _forumRepository.SaveForum(form);\n//Create relationship between the group and\
  \ forum\nGroupForum gf = new GroupForum();\ngf.ForumID = ForumID;\ngf.GroupID =\
  \ group.GroupID;\ngf.CreateDate = DateTime.Now;\n_groupForumRepository.SaveGroupForum(gf);\n\
  }\nreturn result;\n}\n```\n\n#### AlertService\n\n如果你还没有读过前面的章节，那么 **AlertService**\
  \ 贯穿这个网站的所有其他代码，因为它为我们提供了一种让用户知道网站上发生了什么的方式。对于群组来说也是如此——不同的是，用户实际上不会与我们的群组进行太多互动。不过，他们可以加入群组，然后在我们的群组论坛中发帖！这里的区别在于，我们不是向用户的所有朋友发送关于论坛帖子的提醒，而是向所有群组所有者发送提醒。\n\
  \n除了我们添加的各种提醒方法之外，这里唯一值得讨论的是 SendAlertToGroup() 方法。\n\n```csharp\n//Fisharoo/BusinessLogic/AlertService.cs\n\
  private void SendAlertToGroup(Alert alert, Group group)\n{\n    List<int> groupMembers\
  \ =\n        _groupMemberRepository.GetMemberAccountIDsByGroupID(group.GroupID);\n\
  \    foreach (int id in groupMembers)\n    {\n        alert.AlertID = 0;\n     \
  \   alert.AccountID = id;\n        SaveAlert(alert);\n    }\n}\n```\n\n该方法接收新创建的提醒，然后获取指定群组的群组成员列表。拿到这些列表项后，它遍历每个群组成员，将其\
  \ AccountID 添加到提醒中，然后发送提醒。\n\n> 这可能会成为性能瓶颈。一种更好的做法可能是先创建所有提醒，然后创建一个新的 SaveAlert()\
  \ 方法，接收一组 Alert 列表以进行批量插入。\n\n#### Redirector\n\n虽然 Redirector 类并不复杂，但它非常重要，因为它将我们的重定向逻辑从页面中抽象出来，并将其提升到业务层。这意味着，如果我们的页面结构发生变化，我们只需去一个地方修改即可。当然，有些情况下我们无法将重定向逻辑塞进\
  \ Redirector 类——但请确保不要仅仅为了方便而将重定向逻辑放在页面中！请查阅本章附带的源代码，了解添加到这个类中的新方法。\n\n#### WebContext\n\
  \n与 Redirector 类似，WebContext 类也并不复杂。它的用途很简单，实现这种用途的方式也同样简单。这个类负责充当所有对 HttpContext\
  \ 类的请求的门面。这意味着，任何时候我们想要访问查询字符串项、表单提交项，或任何由 HttpContext 类直接表示的内容（如应用程序变量），我们都应该使用这个类，而不是直接访问原始来源。\n\
  \n这个类有两个新增项——我们现在有了 NewGroup 属性和 GroupID 属性。你可以查阅本章附带的源代码来了解这些。\n\n### 实现表现层\n\n\
  后台工作全部完成后，让我们开始构建前端。在创建这种性质的应用程序时，总是很难决定从哪里开始。你是先用一些示例测试数据填充数据库，然后构建显示页面？还是先创建数据录入页面，然后再处理显示页面？这次我们将先处理数据录入页面，最后再处理显示页面。考虑到这一点，让我们开始吧。\n\
  \n#### ManageGroup\n\n虽然我们可以创建两个页面来管理群组数据——一个用于新建群组，另一个用于编辑群组——但我们发现创建一个页面、一个 UI\
  \ 会容易得多，这样我们既可以创建群组也可以编辑群组。这个页面中有几个有趣的功能：我们提供了一个所见即所得（WYSIWYG）编辑器，以及一个图片上传功能。这两个主题是本次讨论中我们涉及最多的功能。\n\
  \n在开始之前，需要了解的是，页面通过两个查询字符串变量的存在来区分不同的状态。第一个变量是 newgroup=1。这显然告诉页面，我们打算创建一个新群组。第二个变量是\
  \ GroupID={number}，它允许我们用指定群组的数据填充页面。\n\n##### WYSIWYG\n\n我们选择的 WYSIWYG 编辑器是 Xinha（在前面的章节中我们已经介绍过）。要使用这个编辑器，我们只需放置一个\
  \ TextMode 设置为 MultiLine 的文本框。然后在页面更下方，我们必须使用以下代码将完整的控件 ID 传递给 Xinha 引擎：\n\n```javascript\n\
  //Fisharoo/Web/Groups/ManageGroup.aspx\n<script type=\"text/javascript\">\n    xinha_editors[xinha_editors.length]\
  \ = 'Content_txtDescription';\n    xinha_editors[xinha_editors.length] = 'Content_txtBody';\n\
  </script>\n```\n\n这会创建功能完整的 WYSIWYG 编辑器，你可以根据需要全局配置更多或更少的选项。\n\n##### 图片上传\n\n虽然我们在关于文件、文件夹、图片库等内容的章节中已经讨论过文件上传的主题，但我们觉得可能需要再复习一下。在该章节中，我们将\
  \ FileUpload 逻辑存储在一个名为 ReceiveFiles.aspx 的辅助页面中。当网站只有一个需要上传的区域时，这种方法效果很好，但当网站有两个需要上传功能的区域时，它就不再适用了。\n\
  \n出于这个原因，我们将所有上传逻辑移入一个 UploadService。它几乎百分百是从那个文件中复制而来的（所以我们这里不再重复）。然后，在 ReceiveFiles\
  \ 页面中，我们删除了所有旧代码，并用一行对 UploadService.UploadPhotos 方法的调用来替代。一旦重构完成，我们就可以回过头来满足用户上传照片作为群组徽标的需求。\n\
  \n\n\n\n以下是来自 ManageGroupPresenter 的 SaveGroup 方法（其余代码是标准的管道代码）：\n\n```csharp\n\
  //Fisharoo/Web/Groups/Presenters/ManageGroupPresenter.cs\npublic void SaveGroup(Group\
  \ group, HttpPostedFile file, List<long> selectedGroupTypeIDs)\n{\n    if (group.Description.Length\
  \ > 2000)\n    {\n        _view.ShowMessage(\"Your description is \" + group.Description.Length.ToString()\
  \ + \" characters long and can only be 2000 characters!\");\n    }\n    else\n \
  \   {\n        group.AccountID = _webContext.CurrentUser.AccountID;\n        group.PageName\
  \ = group.PageName.Replace(\" \", \"-\");\n        if (group.GroupID == 0 && _groupRepository.CheckIfGroupPageNameExists(group.PageName))\n\
  \        {\n            _view.ShowMessage(\"The page name you specified is already\
  \ in use!\");\n        }\n        else\n        {\n            if (file.ContentLength\
  \ > 0)\n            {\n                List<Int64> fileIDs = _uploadService.UploadPhotos(1,\
  \ _webContext.CurrentUser.AccountID, _webContext.Files, 1);\n                //should\
  \ only be one item uploaded!\n                if (fileIDs.Count == 1)\n        \
  \            group.FileID = fileIDs[0];\n            }\n            group.GroupID\
  \ = _groupService.SaveGroup(group);\n            _groupToGroupTypeRepository.SaveGroupTypesForGroup(selectedGroupTypeIDs,\
  \ group.GroupID);\n            _redirector.GoToGroupsViewGroup(group.PageName);\n\
  \        }\n    }\n}\n```\n\n正如你在前面的代码中所看到的，我们主要在执行一些数据验证和清理工作。如果是一个新群组，我们会验证指定的页面名称在系统中是唯一的。如果页面名称唯一，那么我们就能处理保存请求。在处理保存之前，我们会检查是否有文件正在上传。如果有，则调用\
  \ UploadService.UploadPhotos 方法并传入上传文件。然后，我们执行标准的保存操作。本页其余代码是标准的 MVP 事件和数据管道。\n\n\
  ## 成员\n\n成功创建群组后，并且能够就地编辑群组，我们就可以将注意力转向管理成员资格。在成员管理页面中，我们将能够批准新的成员请求。我们可以将现有成员提升或降级为管理员状态（允许他们在未来执行各种任务）。我们还可以删除成员。该\
  \ UI 将采用多选复选框类型的界面，但不会使用标准的 CheckBoxList 控件。此外，我们还将以自定义方式支持分页功能。\n\n![](img/15a62e134135dde036b0ac3cbb01dab6_327_0.png)\n\
  \n## 群组\n\n正如我们在创建 AccountRepository 的 GetApprovedAccountsByGroupID() 方法时提到的——在该方法中我们传入\
  \ GroupID 和 PageNumber——PageNumber 输入指定了我们要在显示中查看的数据子集。你会在前面的截图中注意到有一个**返回**链接（它将我们带回到群组页面）。在它旁边，如果我们不在第一页，就会看到**上一页**。此外，如果\
  \ UI 中有已批准的成员，我们还会看到一个**下一页**链接。\n\n## 数据分页\n\n这些“下一页”和“上一页”的概念由 MembersPresenter\
  \ 中的以下两个方法处理：\n\n```csharp\n//Fisharoo/Web/Groups/Presenters/MembersPresenter.cs\n\
  public void Next()\n{\n    _redirector.GoToGroupsMembers(_webContext.GroupID,\n\
  \                                  (_webContext.PageNumber + 1));\n}\npublic void\
  \ Previous()\n{\n    _redirector.GoToGroupsMembers(_webContext.GroupID,\n      \
  \                            (_webContext.PageNumber - 1));\n}\n```\n\n正如你所看到的，结合\
  \ AccountRepository 中的逻辑，我们有了一个非常简单的分页解决方案，它可以用于任何数据集。此外，虽然我们在这里没有明确讨论，但你应当注意不要超过有效的页码。\n\
  \n## 不使用 CheckBoxList 控件的 CheckBoxLists\n\n另一个无需被迫使用标准控件即可轻松实现的功能是，使用 Repeater 和\
  \ CheckBox 控件来创建自定义的 CheckBoxList，这种方法更受欢迎。这种组合只是一个 Repeater 控件和一个 CheckBox。在 Repeater\
  \ 的 OnItemDataBound 事件中，我们可以将每个选中复选框需要捕获的任何数据作为属性添加到 CheckBox 控件上。\n\n```csharp\n\
  //Fisharoo/Web/Groups/Members.aspx.cs\npublic void repMembersToApprove_ItemDataBound(object\
  \ sender,\n                                             RepeaterItemEventArgs e)\n\
  {\n    if (e.Item.ItemType == ListItemType.AlternatingItem ||\n        e.Item.ItemType\
  \ == ListItemType.Item)\n    {\n        ProfileDisplay p = e.Item.FindControl(\"\
  Profile1\") as\n            ProfileDisplay;\n        CheckBox chkProfile = e.Item.FindControl(\"\
  chkProfile\") as\n            CheckBox;\n        p.LoadDisplay(((Account)e.Item.DataItem));\n\
  \        chkProfile.Attributes.Add(\"AccountID\",\n            ((Account)e.Item.DataItem).AccountID.ToString());\n\
  \    }\n}\n```\n\n然后我们在后台代码中有一个方法来提取选中的值，以便以后使用。\n\n```csharp\n//Fisharoo/Web/Groups/Members.aspx.cs\n\
  private List<int> ExtractMemberIDs(Repeater repeater)\n{\n    List<int> result =\
  \ new List<int>();\n    foreach (RepeaterItem item in repeater.Items)\n    {\n \
  \       if (item.ItemType == ListItemType.AlternatingItem ||\n            item.ItemType\
  \ == ListItemType.Item)\n        {\n            CheckBox chkProfile = item.FindControl(\"\
  chkProfile\") as\n                CheckBox;\n            if (chkProfile.Checked)\n\
  \                result.Add(Convert.ToInt32(chkProfile.Attributes[\n           \
  \         \"AccountID\"]));\n        }\n    }\n    return result;\n}\n```\n\n正如你在代码中所见，我们查找的是在\
  \ OnItemDataBound 事件中添加的 AccountID 属性。我们通过遍历 Repeater 中的所有项，找出并转换每一项中的复选框控件来实现这一点。然后，无论\
  \ Repeater 中有多少项，我们都可以处理选中的值。这里最后要注意的一点是，当成员资格被批准时，系统会向请求该成员资格的用户发送相应的通知。有关详细信息，请参阅\
  \ MembersPresenter.cs 中的 ApproveMembers 方法代码。虽然目前尚未实现这一点，但如果请求被拒绝，可以轻松添加类似的通知。\n\
  \n## 默认页\n\n我们群组部分的主页（参见本章第一张截图），即 default.aspx 页面，负责在用户首次进入本网站此部分时，列出系统中的所有群组。该页面调用\
  \ GroupService 获取所有最新的群组。然后，它将这一数据集合绑定到 ListView 并输出每个群组。请注意，每个群组名称都有指向自定义群组 PageName.aspx\
  \ 的实际链接（稍后我们将对此进行更多介绍）。不过，这个页面没有更多内容了。\n\n有关具体工作方式的示例，请参阅代码。\n\n## URL 路由\n\n在深入研究数据管理之前，我们发现自己又到了一个需要重新深入研究\
  \ URL 路由的岔路口。由于我们的群组中有 PageName 字段，因此需要讨论如何处理群组的 PageName。一旦完成，我们就可以继续调出并查看群组。这一步是通过在\
  \ Global.ascx.cs 的 RegisterRoutes 方法中向路由集合添加一个额外的路由条目来实现的。\n\n```csharp\n//Fisharoo/Web/Global.ascx.cs\n\
  public static void RegisterRoutes(RouteCollection routeCollection)\n{\n    routeCollection.MapPageRoute(\"\
  GroupRoute\",\n        \"groups/{groupname}.aspx\", \"~/Groups/ViewGroup.aspx\"\
  );\n}\n```\n\n一旦我们找到合适的关键字，就可以通过指定的页面名称加载群组实例。这部分由 ViewGroup.aspx 页面处理。\n\n## ViewGroup\n\
  \n该页面负责显示群组详细信息。首先需要关注的是 URL 路由的处理。在后台代码中，我们从路由数据集合中提取群组页面名称，并将其传递给 presenter 以加载特定页面。\n\
  \n```csharp\n//Fisharoo/Web/Groups/ViewGroup.aspx.cs\nstring groupname = Page.RouteData.Values[\"\
  groupname\"] as string;\npresenter.Init(this, IsPostBack, groupname);\n```\n\n\n\
  \n在 presenter 中，我们使用从路由数据集合中获取的 groupname 加载特定群组数据，然后针对公开/私有查看做进一步处理。\n\n```csharp\n\
  //Fisharoo/Web/Groups/ViewGroupPresenter.cs\npublic void LoadData(string groupname)\n\
  {\n    Group group = _groupService.GetGroupByPageName(groupname);\n    string url\
  \ = \"/files/photos/\" + _uploadService.GetFullFilePathByFileID(group.FileID, File.Sizes.S);\n\
  \    _view.LoadData(group, url);\n    if(_webContext.CurrentUser != null)\n    \
  \    _view.ShowRequestMembership(true);\n    else\n        _view.ShowRequestMembership(false);\n\
  \n    //is this public or private data?\n    if (group.IsPublic)\n    {\n      \
  \  _view.ShowPrivate(true);\n        _view.ShowPublic(true);\n    }\n    else if\
  \ (ViewerIsMember(group.GroupID))\n    {\n        _view.ShowPrivate(true);\n   \
  \     _view.ShowPublic(true);\n    }\n    else\n    {\n        _view.ShowPrivate(false);\n\
  \        _view.ShowPublic(true);\n    }\n}\n```\n\n除了显示数据之外，它还作为我们查看和管理与群组相关的其他部分（例如群组拥有的论坛）的起点。\n\
  \n## 私有/公开\n\n判断群组是公开还是私有，只需检查数据库中设置的一个位标志即可；而判断谁能实际看到私有群组则稍显复杂（请参阅上面的 presenter\
  \ 代码）。\n\n回想一下，我们创建了一些辅助函数，用来判断用户是群组的所有者、成员还是管理员。在 ViewGroupPresenter 中，我们调用 ViewMembers\
  \ 方法来确定用户所处的位置。\n\n```csharp\n//Fisharoo/Web/Groups/Presenters/ViewGroupPresenter.cs\n\
  public void ViewMembers()\n{\n    _redirector.GoToGroupsMembers(_webContext.GroupID);\n\
  }\n```\n\n这让我们能够快速轻松地判断是否可以显示私有群组。如果不能，则向用户显示相应消息，说明该群组为私有，并提示他们申请加入。当你请求成为成员时，会向群组所有者发送一条关于此请求的提醒。\n\
  \n```csharp\n//Fisharoo/Web/Groups/Presenters/ViewGroupPresenter.cs\npublic void\
  \ RequestMembership(string groupID)\n{\n    _alertService.AddGroupMembershipRequestAlert(gm.AccountID,\
  \ gm.GroupID, _webContext.CurrentUser.Username);\n}\n```\n\n![](img/15a62e134135dde036b0ac3cbb01dab6_332_0.png)\n\
  \n如果你是群组成员或群组所有者，则会看到群组描述下方的成员列表。\n\n## MyGroups\n\nMyGroups 页面是主页面的一个副本，因为它同样会流式展示一堆群组。最直接的区别是，此页面上的所有群组都属于当前查看者。除了安全检查和数据源变更之外，我们还提供了一些额外功能。在这个页面上，我们可以删除选中的群组，还可以链接到\
  \ ManageGroup.aspx 页面。\n\n## 群组\n\n```csharp\nLinkButton lbPageName = e.Item.FindControl(\"\
  lbPageName\") as LinkButton;\nImageButton ibDelete = e.Item.FindControl(\"ibDelete\"\
  ) as ImageButton;\nLiteral litGroupID = e.Item.FindControl(\"litGroupID\") as Literal;\n\
  ImageButton ibEdit = e.Item.FindControl(\"ibEdit\") as ImageButton;\nibDelete.Attributes.Add(\"\
  GroupID\", litGroupID.Text);\nibEdit.Attributes.Add(\"GroupID\", litGroupID.Text);\n\
  ibDelete.Attributes.Add(\"onclick\", \"return confirm(\\\"Are you sure you want\
  \ to delete this group?\\\");\");\nlbPageName.Attributes.Add(\"PageName\", litPageName.Text);\n\
  imgGroupImage.ImageUrl = \"/files/photos/\" + _presenter.GetImageByID(Convert.ToInt64(litImageID.Text),\
  \ File.Sizes.S);\n}\n}\n}\n```\n\n## 论坛增强\n\n前面我们讨论过，将会有群组拥有并运营的论坛。为了实现这一点，我们必须在论坛系统中添加一个新类别，专门称为**群组论坛（group-forums）**。然后，我们将该类别从论坛类别显示（论坛主页）中排除。这由\
  \ BoardCategoryRepository.GetAllCategories() 方法处理。论坛主页仍然看起来像这样：\n\n![](img/15a62e134135dde036b0ac3cbb01dab6_334_0.png)\n\
  \n这里不存在任何群组类别！还要注意，显示中没有**海马（sea-horses）**论坛，而我们可以从**海马（sea-horses）**群组清晰地链接到**海马（sea-horses）**论坛。回想一下，前面我们讨论过，当\
  \ GroupService 创建群组时，我们也会创建一个新论坛，并将其附加到**群组论坛（group-forums）**类别（类别 4）。有了这个机制，当加载\
  \ ViewGroup 页面时，我们也可以加载该群组的论坛链接。\n\n此外，回想一下我们向 AlertService 添加了几个方法。这些方法允许我们向群组的所有成员发送提醒，而不是仅向发帖人的好友发送提醒。到目前为止，我们还没涉及的集成细节是：发帖的论坛页面如何知道它是否是一个群组拥有（group-owned）的论坛。\n\
  \n为创建此功能而修改的论坛系统部分只有 PostPresenter.Save() 方法（上一章已介绍）。在该方法的末尾，我们添加了一些代码，用于判断是否可以根据\
  \ ForumID 加载群组。\n\n> 请记住，此逻辑只有在以下情况下才有效：我们规定一个群组只能拥有一个论坛（反之亦然）。目前，我们是在创建群组时创建关联来实现这一点的。但是，如果你提供其他工具来创建论坛或群组，则需要记住，必须加入某种形式的验证，否则我们目前讨论的这种群组/论坛验证就需要更改！\n\
  \n```csharp\n//Fisharoo/Web/Forums/Presenters/PostPresenter.cs\nif (post.IsThread)\n\
  \    thread = _postService.GetPostByID(post.PostID);\nelse\n    thread = _postService.GetPostByID((long)post.ThreadID);\n\
  \n//CHAPTER 10- is this forum part of a group?\nGroup group = _groupService.GetGroupByForumID(forum.ForumID);\n\
  \n//add an alert to the filter\nif (post.IsThread)\n{\n    //CHAPTER 10- is this\
  \ a group forum?\n    if (group != null)\n        _alertService.AddNewBoardThreadAlert(category,\
  \ forum,\n            thread, group);\n    else\n        _alertService.AddNewBoardThreadAlert(category,\
  \ forum, thread);\n}\nelse\n{\n    //CHAPTER 10- is this a group forum?\n    if\
  \ (group != null)\n        _alertService.AddNewBoardPostAlert(category, forum, post,\n\
  \            thread, group);\n    else\n        _alertService.AddNewBoardPostAlert(category,\
  \ forum, post, thread);\n}\n\nRouteValueDictionary values = new RouteValueDictionary\
  \ {\n    {\"categoryname\", category.Name}, {\"forumname\", forum.Name},\n    {\"\
  postid\", thread.PostID} };\nVirtualPathData vpd = RouteTable.Routes.GetVirtualPath(null,\n\
  \    \"ThreadRoute\", values);\n_redirector.GoToForumsViewPost(vpd.VirtualPath);\n\
  ```\n\n有了这段代码，我们的论坛不仅知道自己属于某个群组，而且还能向群组成员（而非仅限于好友）发送提醒。\n\n## 总结\n\n有了这个核心框架，你可以看到群组如何将许多不同的系统汇集在一起，从而开始创建子社区。显然，这个部分还可以加入许多其他功能。就我目前想到的，以下几个功能的集成可能会为群组部分增添一些有趣的亮点：\n\
  \n- 消息\n  - 你可以创建一个“发送到群组”的所见即所得（WYSIWYG）区域，向所有群组成员发送消息。\n  - 此外，你还可以将用户加入的所有群组整合到消息系统中，这样群组名称就可以作为联系人名称，直接从邮件部分群发消息。\n\
  - 好友\n  - 群组成员可以很方便地整合为好友。\n  - 你不仅可以在用户配置中指定公开、私有和好友区域，还可以添加类似“我所属群组的成员”这样的筛选器。\n"
- "# 11 用户交互\n\n让我们的用户能够对网站内容进行评论、添加标签和评分，可以为他们提供一定程度的交互性，使他们愿意一次又一次地回来。这些功能之所以能激起用户的好奇心，主要有两个原因。首先，对任何可接触到的事物发表看法是人类的天性。一旦第一群用户对所有内容都发表了自己的看法，你会发现第二群用户会开始关注并与那些评分最高、评论和标签最多的内容进行互动。\n\
  \n在本章中，我们将深入探讨如何创建一个灵活的系统，使我们可以为系统中的任何对象（在数据库级别）添加标签、评分、投票和评论。我们将把标签、评分和评论系统应用到照片库部分，并将投票、标记为答案和勋章应用到论坛部分。标签和评论会相对直接，因为它们只是获取用户的原始输入并将其与各个内容区域关联。另一方面，评分系统将使用\
  \ ASP.NET AJAX 库，在带有评分控件的模态窗口中提供多个属性，这些属性聚合后就会为该条目提供平均分。\n\n\n\n\n\n在模态窗口中，用户将拥有多个动态生成的属性，可以对每个属性进行单独评分。所有这些评分随后会被汇总，以提供该项目的最终评分。一旦我们收到了对某个项目的评分，我们将感谢用户提供输入，然后显示平均评分，如下一张截图所示：\n\
  \n![](img/15a62e134135dde036b0ac3cbb01dab6_342_0.png)\n\n## Tagging\n\nTagging 是一种功能，允许我们为任何对象附加关键词（在我们的案例中为图像）。每个关键词都附带一个分数，这使我们能够构建一个标签云，其中最大的标签会移至顶部，展示系统中使用的最多的关键词。此控件将以灵活的方式创建，允许我们捕获新标签，显示附加到某个对象的标签，显示附加到某个部分的标签，以及附加到整个站点的标签。\n\
  \n我们允许用户为图像添加标签，然后将标签显示为该图像的子云。\n\n![](img/15a62e134135dde036b0ac3cbb01dab6_342_1.png)\n\
  \n### User Interactivity\n\n我们将在本章后面介绍用于动态确定字体大小的算法，以及此控件中内置的一些灵活性。\n\n## Commenting\n\
  \nCommenting 允许我们的用户对资源提供更具体的输入。这可以稍后集成到我们的搜索功能中，以帮助我们将内容传递给用户。除此之外，它还允许用户就资源交换评论，从而激发其他用户的兴趣。\n\
  \n![](img/15a62e134135dde036b0ac3cbb01dab6_344_0.png)\n\n## Mark as answer\n\n对于任何论坛来说，要成功，重要的是拥有发布问题和回复现有帖子的基本基础设施。一旦我们创建了第\
  \ 9 章中的基本基础设施，下一个重要事项就是确保对发布查询的解决/响应，因为最终这将推动用户数量进入论坛。为了确保论坛成功，它们应提供将回复接受为答案的能力，同时也允许其他用户对问题及其回复进行投票。这些操作在内部链接到一个评分系统。当用户达到一定的总分数时，他们将被授予奖牌。虽然每个被接受为答案的帖子会获得一定的分数，但其他帖子也需要被重视，以确保用户继续对发布回复感兴趣。这是通过为所有回复授予分数来实现的，即使它们未被接受为答案。在这种情况下授予的分数显然低于发布答案所获得的分数。我们将采用接受答案得\
  \ 10 分，所有其他帖子得 5 分的方案。\n\n![](img/15a62e134135dde036b0ac3cbb01dab6_345_0.png)\n\n\
  ## Voting\n\nMark as answer，如前所述，是由提出初始查询的用户使用的。但我们如何让社区参与讨论呢？一种方法是投票。用户可能会发现问题和回复对他们自己的目的有用，因此会想要给予积极投票。类似地，其他用户可能认为内容不相关，可以给予消极投票。消极投票将导致相关用户在总分数上损失，并导致他们失去奖牌。这将起到遏制用户发布不相关回复的作用。\n\
  \n## Medals\n\n随着时间的推移，用户通过累积分数建立他们的资质。这些资质可以通过奖牌来体现为等级。在 Fisharoo 中，当用户达到一定的总分数时，我们会授予他/她一个奖牌。达到下一个分数等级后，我们会授予他/她额外的奖牌，依此类推。用户拥有的奖牌越多，他们在社交网络网站上拥有的资质就越强。与评分系统类似，奖牌的等级范围为\
  \ 1 到 5，其中 1 为初学者，5 为网站上声誉最高的<|message|>。\n\n![](img/15a62e134135dde036b0ac3cbb01dab6_345_1.png)\n\
  \n## Design\n\n让我们来看看此功能的[content]\n\n在模态窗口中，用户将拥有多个动态生成的属性，可以对每个属性进行单独评分。所有这些评分随后会被汇总，以提供该项目的最终评分。一旦我们收到了对某个项目的评分，我们将感谢用户提供输入，然后显示平均评分，如下一张截图所示：\n\
  \n![](img/15a62e134135dde036b0ac3cbb01dab6_342_0.png)\n\n## Tagging\n\nTagging 是一种功能，允许我们为任何对象附加关键词（在我们的案例中为图像）。每个关键词都附带一个分数，这使我们能够构建一个标签云，其中最大的标签会移至顶部，展示系统中使用的最多的关键词。此控件将以灵活的方式创建，允许我们捕获新标签，显示附加到某个对象的标签，显示附加到某个部分的标签，以及附加到整个站点的标签。\n\
  \n我们允许用户为图像添加标签，然后将标签显示为该图像的子云。\n\n![](img/15a62e134135dde036b0ac3cbb01dab6_342_1.png)\n\
  \n### User Interactivity\n\n我们将在本章后面介绍用于动态确定字体大小的算法，以及此控件中内置的一些灵活性。\n\n## Commenting\n\
  \nCommenting 允许我们的用户对资源提供更具体的输入。这可以稍后集成到我们的搜索功能中，以帮助我们将内容传递给用户。除此之外，它还允许用户就资源交换评论，从而激发其他用户的兴趣。\n\
  \n![](img/15a62e134135dde036b0ac3cbb01dab6_344_0.png)\n\n## Mark as answer\n\n对于任何论坛来说，要成功，重要的是拥有发布问题和回复现有帖子的基本基础设施。一旦我们创建了第\
  \ 9 章中的基本基础设施，下一个重要事项就是确保对发布查询的解决/响应，因为最终这将推动用户数量进入论坛。为了确保论坛成功，它们应提供将回复接受为答案的能力，同时也允许其他用户对问题及其回复进行投票。这些操作在内部链接到一个评分系统。当用户达到一定的总分数时，他们将被授予奖牌。虽然每个被接受为答案的帖子会获得一定的分数，但其他帖子也需要被重视，以确保用户继续对发布回复感兴趣。这是通过为所有回复授予分数来实现的，即使它们未被接受为答案。在这种情况下授予的分数显然低于发布答案所获得的分数。我们将采用接受答案得\
  \ 10 分，所有其他帖子得 5 分的方案。\n\n![](img/15a62e134135dde036b0ac3cbb01dab6_345_0.png)\n\n\
  ## Voting\n\nMark as answer，如前所述，是由提出初始查询的用户使用的。但我们如何让社区参与讨论呢？一种方法是投票。用户可能会发现问题和回复对他们自己的目的有用，因此会想要给予积极投票。类似地，其他用户可能认为内容不相关，可以给予消极投票。消极投票将导致相关用户在总分数上损失，并导致他们失去奖牌。这将起到遏制用户发布不相关回复的作用。\n\
  \n## Medals\n\n随着时间的推移，用户通过累积分数建立他们的资质。这些资质可以通过奖牌来体现为等级。在 Fisharoo 中，当用户达到一定的总分数时，我们会授予他/她一个奖牌。达到下一个分数等级后，我们会授予他/她额外的奖牌，依此类推。用户拥有的奖牌越多，他们在社交网络网站上拥有的资质就越强。与评分系统类似，奖牌的等级范围为\
  \ 1 到 5，其中 1 为初学者，5 为网站上声誉最高的 fiy。\n\n![](img/15a62e134135dde036b0ac3cbb01dab6_345_1.png)\n\
  \n## Design\n\n让我们来看看此功能的\n\n\n## 用户交互性\n\n最终的复杂性完成了标签云。我们将拥有表格来适当保存数据。我们将拥有捕获和显示数据的控件。但标签云的真正关键在于它如何显示。**标签云**以与云中整体流行度排名相对应的大小显示每个标签（一个关键词或多个词）。这意味着标签在云中使用的越多，标签在云中就越大。另一方面，使用频率较低的标签在云中显示得更小。我们将在适当的时候全面讨论此排序背后的算法。\n\
  \n### 评论\n\n与我们花哨的评分和标签控件相比，评论控件并不特别突出。虽然它不突出，但它仍然适合本章，因为这是用户为您的内容提供非常具体内容的另一种方法。评论将在您将收集到的内容整合到网站的搜索结果中时派上用场。此外，我们友好的搜索引擎也会喜欢吃掉您新的内容特定评论。\n\
  \n该系统与另外两个系统一样，将围绕 SystemObject 表构建。除了该表之外，我们还将有一个 Comments 表。Comments 表不仅会收集所有正常数据，还会收集评论正文。就这样！\n\
  \n### 投票\n\n为了跟踪投票，我们在 BoardPost 表中添加了一个名为 **VoteCount** 的非空整数列。为了跟踪被标记为答案的帖子，我们还在\
  \ BoardPost 表中添加了位列 **isAnswer**（非空）。\n\n### 奖章\n\n为了跟踪特定账户/用户的总得分，我们在 Accounts\
  \ 表中添加了一个整数列作为 **Score**。得分将根据设计部分中定义规则进行递增，并据此授予 Badges。\n\n### 解决方案\n\n让我们来看看我们的解决方案。\n\
  \n### 评分\n\n**Ratings** 表负责保存所有最终用户评分。如您所见，每个评分都关联回 **SystemObjects** 表，并直接关联到指定表中的记录。此外，我们还跟踪被评分的选项。该表中最重要的部分是\
  \ **Score** 字段。**Score** 跟踪最终用户选择的星级数量（就我们而言）。\n\n#### 系统对象评分选项\n\n除了 ratings 表之外，我们还拥有\
  \ **SystemObjectRatingOptions** 表。该表跟踪我们每个系统对象可用的所有选项。\n\n### 标签\n\nTags 表负责保存用户附加到系统中各种对象的所有文本标签。考虑到我们打算为系统中多个对象收集大量相同标签，维护一个唯一的标签列表及其计数非常重要，而不是为系统中输入的每个标签创建一个条目，然后再对标签求和以获取计数。从性能角度来看，在收集标签时维护聚合值，将比每次需要计数时确定汇总值更容易胜任。\n\
  \n#### 系统对象标签\n\n这就引出了我们的 **SystemObjectTags** 表。它负责维护哪个标签连接到哪种类型对象的哪个记录的详细信息。该表仅维护各种记录\
  \ ID 以跟踪关系。\n\n### 评论\n\n这最终引出了 Comments 表。在五项功能中，这无疑是最容易实现的，因为该表直接为我们跟踪所有内容。在这种情况下，每个评论都被假定为唯一，并因此直接链接到一个对象以及该对象中的一条记录。我们还跟踪留下评论的用户（**CommentByAccountID**）以及何时（**CreateDate**）留下评论。评论的当前大小可达\
  \ 2,000 个字符。然而，如果您的社区需要大评论，您当然可以增加这个数字。\n\n### 投票和标记为答案\n\n投票在单个线程/帖子级别管理。我们不需要为此新建一个表，而是扩展我们的\
  \ BoardPosts 表以添加两个新列——VoteCount 和 IsAnswer。投票数量的变化或答案的设置将导致相关用户的得分发生变化。\n\n###\
  \ 奖章\n\n奖章取决于用户获得的总得分。为此，我们将扩展现有的 Accounts 表并添加一个名为 Score 的新列。Medals 用户控件将显示适当的奖章数量。我们将在讨论表示层细节时稍后查看。\n\
  \n### 创建关系\n\n一旦所有表都创建完毕，我们就可以创建所有关系。\n\n对于这组表，我们在以下表之间存在关系：\n\n- Ratings 和 Accounts\n\
  - Ratings 和 SystemObjectRatingOptions\n- Ratings 和 SystemObjects\n- SystemObjectRatingOptions\
  \ 和 SystemObjects\n- SystemObjectTags 和 Accounts\n- SystemObjectTags 和 SystemObjects\n\
  - SystemObjectTags 和 Tags\n- Comments 和 Accounts\n- Comments 和 SystemObjects\n\n\
  ### 设置数据访问层\n\n要设置数据访问层，我们按照前面章节中已完成的方法执行步骤。打开 Fisharoo.edmx 文件并添加上述所有表。\n\n###\
  \ 构建存储库\n\n随着新表的添加，将会添加新的存储库，以便我们可以获取存储在这些表中的数据。我们将创建以下存储库来支持我们的需求：\n\n- RatingRepository\n\
  - SystemObjectRatingOptionRepository\n- TagRepository\n- SystemObjectTagRepository\n\
  - CommentRepository\n\n我们的每个存储库通常都有一个按 ID 选择、按父 ID 选择所有、保存和删除的方法。一旦您看过一个存储库，您基本上就看过它们全部了。查看前面的章节、附录或包含的代码，例如标准存储库。在这里，我们只讨论与标准不同的内容！\n\
  \n#### RatingRepository\n\n让我们来看看 RatingRepository。\n\n##### HasRatedBefore()\n\n\
  HasRatedBefore() 方法接收 SystemObjectID、SystemObjectRecordID 和 AccountID，以检查该账户是否已为指定对象提供过评分。如果已提供，则\
  \ HasRatedBefore() 方法返回 true，否则返回 false。\n\n```csharp\n//Fisharoo/DataAccess/Repositories/RatingRepository.cs\n\
  public bool HasRatedBefore(int SystemObjectID, long SystemObjectRecordID, int AccountID)\n\
  {\n    bool result = false;\n    using(FisharooDataContext dc = conn.GetContext())\n\
