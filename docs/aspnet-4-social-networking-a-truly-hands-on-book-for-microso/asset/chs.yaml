  \n## TagService\n\nTagService 中有一些负责添加标签和计算字体大小的功能。\n\n### AddTag()\n\n我们有一个 AddTag()\
  \ 方法，负责向数据库中添加标签。你可能会问，为什么我们不能直接在 TagRepository 中处理这个问题。在这种情况下，我们要做的不仅仅是向系统中塞入一条新记录。这里我们需要检查是否已经存在该标签。如果不存在，那么我们需要创建一个新标签。如果标签已经存在，那么我们需要增加该标签的计数，并可以将标签保存回系统中。\n\
  \n除了向系统中添加标签外，我们还需要为该标签及其关联对象创建关系。这是一项直接的工作。我们只需用相应的 TagID 创建一个新的 SystemObjectTag。然后就可以将其放入数据库。\n\
