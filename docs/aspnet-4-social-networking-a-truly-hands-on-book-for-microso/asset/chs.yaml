  \ TagName=\"Medals\"\nTagPrefix=\"Fisharoo\" %>\n<%@ Register Src=\"~/UserControls/MarkAnswer.ascx\"\
  \ TagName=\"MarkAnswer\"\nTagPrefix=\"Fisharoo\" %>\n```\n\n接下来，我们将它们插入到适当的位置。MarkAnswer\
  \ 和 Votes 控件被添加在帖子正文之前，Medals 控件添加在用户详细信息旁边。请注意下面这些控件的属性绑定：\n\n```aspx\n<ItemTemplate>\n\
