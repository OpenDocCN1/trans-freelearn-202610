  \ 导航。我们没有经过 Redirector 类。原因是为了性能。这样我们可以避免回发到同一页面，然后使用重定向类执行 Response.Redirect，再加载页面。相反，我们使用用户友好的\
  \ URL 直接跳转到帖子页面。\n\n### ViewPost.aspx\n\n查看帖子页面提取类别名称、论坛名称和主题 ID，并使用这些信息显示主题及其所有帖子，如本章第三张截图所示。\n\
  \n```csharp\n//Fisharoo/Web/Forums/ViewPost.aspx.cs\npublic partial class ViewPost\
  \ : System.Web.UI.Page, IViewPost\n{\n    private ViewPostPresenter _presenter;\n\
  \n    protected void Page_Load(object sender, EventArgs e)\n    {\n        _presenter\
