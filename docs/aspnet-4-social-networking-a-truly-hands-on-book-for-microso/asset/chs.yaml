  \ = DateTime.Now;\n    sysObjTag.CreatedByAccountID = _webContext.CurrentUser.AccountID;\n\
  \    sysObjTag.CreatedByUsername = _webContext.CurrentUser.Username;\n    sysObjTag.SystemObjectID\
  \ = SystemObjectID;\n    sysObjTag.SystemObjectRecordID = SystemObjectRecordID;\n\
  \    sysObjTag.TagID = tag.TagID;\n    _systemObjectTagRepository.SaveSystemObjectTag(sysObjTag);\n\
  }\n```\n\n### CalculateFontSize()\n\nCalculateFontSize() 方法负责接收一组标签并计算每个标签的字体大小。这个计算有点门道，因为有些标签的计数可能非常大，而其他标签可能只被应用到少数几个项目上。如果我们直接用这些数字来计算字体大小，最终可能会出现标签比页面还大，或者小到无法阅读的情况。因此，我们需要让数字适配到更合理的范围内。这就是我们将要讨论的计算过程。\n\
  \n在完整查看方法之前，我们先讨论一些将要使用的变量：\n\n- **MinimumRange**：该变量将保存我们标签集合中的最小计数。这将构成我们集合的下界。它对整个计算是全局的。\n\
  - **MaximumRange**：该变量将保存我们标签集合中的最大计数。这将构成我们集合的上界。它对整个计算是全局的。\n- **Delta**：该变量将保存\
  \ **MinimumRange** 和 **MaximumRange** 之间的差值。它对整个计算是全局的。\n- **Tag.InitialValue**：这将保存每个标签的计数的副本。\n\
  - **Tag.MinimumOffset**：这是 **InitialValue** 减去 **MinimumRange**。\n- **Tag.Ranged**：该值是\
  \ **MinimumOffset** 除以 **Delta**。\n- **Tag.PreCalculatedValue**：这是 **Ranged** 值乘以最大字体大小与最小字体大小之差再减一（largest-smallest-1）。\n\
  - **Tag.FinalCalculatedValue**：这是 **PreCalculatedValue** 加一。\n- **Tag.FontSize**：这是\
  \ **FinalCalculatedValue** 加上最小字体大小。\n\n所有这些计算的结果是一组标签，无论是最小标签计数和最大标签计数之间的差异，还是最小和最大字体大小之间的差异，它们都能平滑地增长。\n\
  \n\n\n\n\n## 用户交互性\n\n这种方法的下一层复杂度在于我们希望对云中的标签进行何种排序。我们是从小到大、从大到小，还是随机排序？我们将这交给一个配置值来决定。如果我们希望从小到大排序，可以在\
  \ Tags 集合上使用 `OrderBy()` 方法。如果我们希望从大到小排序，可以使用 `OrderByDescending()` 方法。如果我们想随机排序该怎么办？我们将向\
  \ Extensions 类添加一个新方法 `ShuffleList()`，它将扩展 `Tag` 类型的泛型列表，负责对集合中的项目进行随机打乱。稍后我们将讨论该方法。\n\
  \n```csharp\n//Fisharoo/BusinessLogic/TagService.cs\npublic List<Tag> CalculateFontSize(List<Tag>\
  \ Tags)\n{\n    decimal MinimumRange;\n    decimal MaximumRange;\n    decimal Delta;\n\
  \    //get the smallest count in this list\n    MinimumRange = (Tags.OrderBy(t =>\
  \ t.Count).Take(1).Select(t =>\n                                      t.Count).FirstOrDefault())\
  \ * 100;\n    //get the largest count in this list\n    MaximumRange = (Tags.OrderByDescending(t\
  \ =>\n                                      t.Count).Take(1).Select(t => t.Count).\n\
  \                                      FirstOrDefault()) * 100;\n    //determine\
  \ the difference between the minimum and the maximum\n    Delta = MaximumRange -\
  \ MinimumRange;\n    if (Tags.Count > 1)\n    {\n        for (int i = 0; i < Tags.Count();\
  \ i++)\n        {\n            //set a working value\n            Tags[i].InitialValue\
  \ = Tags[i].Count*100;\n            //calculate the minimum offset\n           \
  \ Tags[i].MinimumOffset = Tags[i].InitialValue -\n                             \
  \       MinimumRange;\n            //calculate the ranged value\n            Tags[i].Ranged\
  \ = Tags[i].MinimumOffset/Delta;\n            //calculate the pre calculation\n\
  \            Tags[i].PreCalculatedValue = Tags[i].Ranged*\n                    \
  \                     ((_configuration.TagCloudLargestFontSize -\n             \
  \                            _configuration.AddToTagCloudFontSize) - 1);\n     \
  \       //calculate the final value\n            Tags[i].FinalCalculatedValue =\
  \ Tags[i].PreCalculatedValue\n                                           + 1;\n\
  \            //calculate the font size\n            Tags[i].FontSize =\nConvert.ToInt32(Tags[i].FinalCalculatedValue\
  \ +\n    _configuration.AddToTagCloudFontSize);\n        }\n    }\n    //if a standard\
  \ sort is not what you require, you can call\n    //Tags.Sort();\n    //  The Tags.Sort()\
  \ method (in the Tag.cs partial class)\n    //  can be\n    //  modified to use\
  \ different properties to sort by\n    if (_sortOrder == CloudSortOrder.Ascending)\
  \ //small to tall\n    {\n        Tags = Tags.OrderBy(t => t.FinalCalculatedValue).ToList();\n\
  \    }\n    else if (_sortOrder == CloudSortOrder.Descending) //tall to small\n\
  \    {\n        Tags = Tags.OrderByDescending(t =>\n            t.FinalCalculatedValue).ToList();\n\
  \    }\n    else\n    {\n        Tags.ShuffleList(); //randomize!\n    }\n    return\
  \ Tags;\n}\n```\n\n## 扩展\n\n我们将向 Extensions 类添加一个名为 `ShuffleList()` 的扩展方法，它负责打乱\
  \ Tags 列表中的项目。我们在 Experts-Exchange.com 上找到了这段代码：http://www.experts-exchange.com/Programming/Languages/C_Sharp/Q_22571864.html\n\
  \n```csharp\n//Fisharoo/Common/Extensions.cs\npublic static List<Tag> ShuffleList(this\
  \ List<Tag> listToShuffle)\n{\n    Random randomClass = new Random();\n    for (int\
  \ k = listToShuffle.Count-1; k > 1; --k)\n    {\n        int randIndx = randomClass.Next(k);\
  \ //\n        Tag temp = listToShuffle[k];\n        listToShuffle[k] = listToShuffle[randIndx];\
  \ // move random\n                                                   // num to end\
  \ of list.\n        listToShuffle[randIndx] = temp;\n    }\n    return listToShuffle;\n\
  }\n```\n\n## AccountService\n\n我们之前已经讨论过这个服务，因此这里只讨论所做的更改。\n\n### SaveAccount()\n\
  \n该方法调用相应仓库的保存方法，将账户及其更新后的分数保存到数据库中。它还处理根据 ScoreInput 变量增加账户分数的逻辑。该分数将用于向用户显示勋章。\n\
  \n如果帖子是对已有问题的回复，则帖子所有者的账户分数增加 1。如果该回复被投票为有用，则帖子所有者的分数增加 5；如果被投票为无用，则分数减少 5。在减少时，我们确保分数不会低于零。如果该回复被标记为答案，则帖子所有者的账户分数增加\
  \ 10。\n\n```csharp\npublic void SaveAccount(Account account, BoardPost.ScoreInput\
  \ value)\n{\n    if (account.AccountID > 0)\n    {\n        switch (value)\n   \
  \     {\n            case BoardPost.ScoreInput.ReplyPost:\n                account.Score\
  \ += 1;\n                break;\n            case BoardPost.ScoreInput.VoteUseful:\n\
  \                account.Score += 5;\n                break;\n            case BoardPost.ScoreInput.VoteNotUseful:\n\
  \                if (account.Score > 5)\n                    account.Score -= 5;\n\
  \                else\n                    account.Score = 0;\n                break;\n\
  \            case BoardPost.ScoreInput.MarkedAsAnswer:\n                account.Score\
  \ += 10;\n                break;\n            default:\n                break;\n\
  \        }\n    }\n    _accountRepository.SaveAccount(account);\n}\n```\n\n## WebContext\n\
  \n这里我们将讨论对 WebContext 类所做的一些更改。\n\n### SelectedRatings\n\nSelectedRatings 属性处理存储在\
  \ Session 中的 `Dictionary<int, int>` 集合。该集合负责处理附加到对象上各个选项的评分。第一个 int 是 RatingOptionRecordID，第二个\
  \ int 是应用于该 SystemObjectRatingOptionID 的评分（分数）。该集合在用户保存其评分选项之前构建。我们的意思是，每次用户向 SelectedRatings\
  \ 属性添加字典项时，它都会将该项目添加到存储在 Session 中的集合中，而不是完全重置该值。当我们开始构建 Ratings 控件时，就会看到这一点是如何体现的。\n\
  \n如果你想知道这个集合是如何处理的——如果它持续增长——你应该知道还有另一个方法（接下来会介绍）负责清除这个集合。\n\n```csharp\n//Fisharoo/Components/WebContext.cs\n\
  public Dictionary<int, int> SelectedRatings\n{\n    get\n    {\n        Dictionary<int,\
  \ int> result = new Dictionary<int, int>();\n        if (GetFromSession(\"SelectedRatings\"\
  ) != null)\n        {\n            result = GetFromSession(\"SelectedRatings\")\
  \ as Dictionary<int, int>;\n        }\n        return result;\n    }\n    set\n\
  \    {\n        //make sure that we add to the existing rating store rather\n  \
  \      //than creating a new one\n        Dictionary<int, int> result = new Dictionary<int,\
  \ int>();\n        if (GetFromSession(\"SelectedRatings\") != null)\n        {\n\
  \            result = GetFromSession(\"SelectedRatings\") as Dictionary<int, int>;\n\
  \            foreach (KeyValuePair<int, int> pair in value)\n            {\n   \
  \             if (!result.ContainsKey(pair.Key))\n                    result.Add(pair.Key,\
  \ pair.Value);\n            }\n            SetInSession(\"SelectedRatings\", result);\n\
  \        }\n        else\n            SetInSession(\"SelectedRatings\", value);\n\
  \    }\n}\n```\n\n### ClearSelectedRatings\n\n该方法只是清除存储在 SelectedRatings 背后会话中的\
  \ `Dictionary<int, int>` 集合。\n\n```csharp\n//Fisharoo/Components/WebContext.cs\n\
  public void ClearSelectedRatings()\n{\n    SetInSession(\"SelectedRatings\", null);\n\
  }\n```\n\n## 配置\n\nConfiguration 类负责读取配置文件中的值。在最后一轮编码功能中，我们添加了以下属性：\n\n- TagCloudLargestFontSize：该值设置标签云中显示的最大字号。\n\
  - TagCloudSmallestFontSize：该值设置标签云中显示的最小字号。\n- CloudSortOrder：该值设置标签云中标签的排序顺序。\n\
  - NumberOfTagsInCloud：该值设置要在标签云中显示的标签数量。\n\n## 实现表示层\n\n本章主要介绍如何创建必要的用户控件——Comments、Ratings、Tags、Votes\
  \ 和 MarkAnswer。除了 Tags 控件之外，我们还有一个 Tags.aspx 页面，负责显示指定 Tag 的所有关联项。\n\n### 评论页面\n\
  \n让我们先来看看评论页面。\n\n\n\n\n\n## Comments.ascx\n\n评论控件负责接收用户对系统中某个对象的评论。与我们接下来要创建的其他控件相比，这个控件相对简单。它有一个文本框和一个按钮来接收评论，还有一个占位符（PlaceHolder）用来存放我们随时间收集到的所有评论。\n\
  \n```aspx\n//Fisharoo/Web/UserControls/Comments.ascx\n<asp:UpdatePanel runat=\"\
  server\">\n    <ContentTemplate>\n        <asp:Panel runat=\"server\" ID=\"pnlComment\"\
  >\n            <asp:TextBox ID=\"txtComment\" runat=\"server\"></asp:TextBox>\n\
  \            <asp:Button Text=\"Add Comment\" ID=\"btnAddComment\" runat=\"server\"\
  \ OnClick=\"btnAddComment_Click\" />\n            <asp:PlaceHolder ID=\"phComments\"\
  \ runat=\"server\"></asp:PlaceHolder>\n        </asp:Panel>\n    </ContentTemplate>\n\
  </asp:UpdatePanel>\n```\n\n## Comments.ascx.cs\n\n首先，请注意我们是在重写的 `OnInit()` 方法中初始化控件的。这样可以让我们将控件的输出放入\
  \ ViewState，以便后续能够访问所有内容。\n\n这个类有两个属性——`SystemObjectID` 和 `SystemObjectRecordID`。它们让我们知道要保存和加载哪些数据。\n\
  \n页面初始化时，我们会检查当前用户的状态，看他们是否已登录。我们不允许未授权用户发表评论。如果用户已登录，就显示评论文本框和按钮；如果未登录，则隐藏这些控件。\n\
  \n接下来，我们加载页面。为了加载页面，我们从 presenter 中加载评论。然后有用于捕获新增评论的事件处理器。我们还有一个方法用来切换显示评论的 panel\
  \ 的可见性。另有一个方法用于清空评论面板。\n\n整个类中最复杂的方法是 `LoadComments()`。该方法负责接收评论集合，遍历它们，并将它们添加到面板中进行显示。让我们特别来看一下这个方法：\n\
  \n```csharp\n//Fisharoo/Web/UserControls/Comments.ascx.cs\npublic partial class\
  \ Comments : System.Web.UI.UserControl, IComments\n{\n    ...\n    public void LoadComments(List<Comment>\
  \ comments)\n    {\n        if (comments.Count > 0)\n        {\n            phComments.Controls.Add(new\
  \ LiteralControl(\"<table width=\\\"100%\\\">\"));\n            foreach (Comment\
  \ comment in comments)\n            {\n                phComments.Controls.Add(new\
  \ LiteralControl(\"<tr><td>\"\n                    + comment.CommentByUsername +\
  \ \" (\"\n                    + comment.CreateDate.ToShortDateString() + \"): \"\
  \n                    + comment.Body + \"</td></tr>\"));\n            }\n      \
  \      phComments.Controls.Add(new LiteralControl(\"</table>\"));\n        }\n \
  \   }\n}\n```\n\n## CommentsPresenter.cs\n\nCommentsPresenter 负责处理该控件背后的所有逻辑。它根据查看控件的用户是否已登录来决定是否显示控件。它还负责为指定的\
  \ SystemObject 和 SystemObjectRecordID 加载评论。最后，还有一个用于添加评论的方法。\n\n```csharp\n//Fisharoo/Web/UserControls/Presenters/CommentsPresenter.cs\n\
  public class CommentsPresenter\n{\n    ...\n    public void LoadComments()\n   \
