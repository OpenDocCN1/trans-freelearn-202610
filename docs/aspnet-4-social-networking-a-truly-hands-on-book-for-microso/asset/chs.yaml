  \     }\n        ...\n    }\n}\n```\n\n## Registration\n\n如果被邀请的好友尚未是网站用户，那么我们允许他们像往常一样完成注册流程。一旦注册完成，我们不仅会注册他们，还会建立友谊。\n\
