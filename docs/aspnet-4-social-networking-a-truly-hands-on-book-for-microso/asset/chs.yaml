  We couldn't find the account you requested.\");\n    }\n}\n}\n}\n}\n```\n\n该页面要求用户提供其电子邮件地址，然后根据该电子邮件地址查找账户。如果找到账户，它将使用\
  \ Email.SendPasswordReminderEmail() 方法将用户解密后的密码发送到其邮箱账户。\n\nSendPasswordReminderEmail()\
  \ 方法如下所示。\n\n```csharp\n//Fisharoo/Components/Email.cs\npublic void SendPasswordReminderEmail(string\
  \ To,\n    string EncryptedPassword, string Username)\n{\n    string Message = \"\
  Here is the password you requested: \" +\n        Cryptography.Decrypt(EncryptedPassword,\
