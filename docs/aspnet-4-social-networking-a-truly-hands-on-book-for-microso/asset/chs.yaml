  \ value=\"white\" />\n    <embed src=\"../Files/FileUpload.swf?SiteRoot=<%Response.Write(ctx.RootUrl);%>&AlbumID=<%Response.Write(ctx.AlbumID);\
  \ %>&FileType=<%Response.Write(ctx.FolderType);%>&AccountID=<%Response.Write(ctx.AccountID);\
  \ %>\"\n        quality=\"high\" bgcolor=\"#ffffff\" width=\"550\" height=\"220\"\
  \n        name=\"FileUpload\" align=\"middle\"\n        allowscriptaccess=\"sameDomain\"\
