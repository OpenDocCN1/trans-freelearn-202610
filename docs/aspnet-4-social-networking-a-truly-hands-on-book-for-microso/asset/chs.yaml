  \ new friendship!\n}\n```\n\n这段附加代码执行了创建一条新消息以及该消息收件人的整个过程。不过在这种情况下，我们为这条消息指定了 MessageTypes.FriendConfirm（即好友确认）作为\
  \ MessageTypeID。除此之外，这段代码很简单。\n\n### 实现表示层\n\n现在我们的框架已经更新以支持消息传递这一新概念，让我们开始创建一些\
  \ UI 功能，以便使用我们的新工具。要真正利用我们的消息功能，我们至少需要三个页面。我们需要一种创建和发送新消息的方式，一种接收和查看消息的方式，以及一种阅读单条消息的方式。除了创建消息之外，我们还需要一种能够轻松从好友列表中为新消息选择收件人的方式。此外，在查看消息列表时，我们还需要一种进入不同消息文件夹的方式。让我们开始吧！\n\
  \n### 新消息\n\n新消息页面的 UI 很简单。它包含一个 **收件人** 字段、一个 **主题** 字段、一个消息字段，以及一个表示我们准备发送消息的按钮。而在使用\
  \ Xinha WYSIWYG 编辑器时，情况就大不相同了！这是一个 JavaScript 库，它允许你将一个多行文本框转换为功能完整的编辑器。\n\n![](img/15a62e134135dde036b0ac3cbb01dab6_222_0.png)\n\
  \n要开始集成 Xinha，我们首先需要获取最新的代码库。可以从本书的代码库中获取，也可以访问 **http://xinha.webfactional.com/wiki/DownloadsPage**。将该代码库安装到站点根目录下的一个新\
  \ Xinha 目录中。\n\n然后打开 **Site.Master** 页面。在 body 之后直接添加以下 JavaScript：\n\n```javascript\n\
  <script type=\"text/javascript\">\n    xinha_editors = null;\n    xinha_editors\
  \ = xinha_editors ? xinha_editors : [];\n</script>\n```\n\n这段代码并不属于标准安装过程。它的作用是允许我们在单个页面中启动多个编辑器实例。稍后你会看到这一点。\n\
  \n然后，在我们的母版页中继续往下，就在结束的 body 标签之前，我们将插入另一大块 JavaScript。由于这是一大块内容，这里就不展示了。请打开本章现有的母版页查看。\n\
  \n你会看到这一大块代码负责设置 Xinha 暴露的大量配置选项。这段代码有大量注释，因此应该可以理解。此外，网络上也有大量关于此包配置的资料！\n\n我们在这份配置中添加的唯一内容——但绝对是最特殊的一项——是设置站点基础\
  \ URL 的第一行。在这里，我们将其改为指向 XINHA 文件安装的路径。\n\n```text\n---\n_editor_url = \"/Scripts/Xinha\"\
  ;\n---\n```\n\n这让我们回到 NewMessage.aspx 页面。既然已经安装了 Xinha，我们就可以在页面 UI 下方添加一行代码，将多行文本框控件有效地绑定到\
  \ Xinha 库。这是通过一段 JavaScript 完成的。\n\n```javascript\n<script type=\"text/javascript\"\
  >\n    xinha_editors[xinha_editors.length] = 'Content_txtMessage';\n</script>\n\
  ```\n\n注意，这里使用的是我们在 Master 页面中最初定义的同一个 **xinha_editors** 变量！我们在这里所做的是将这个新控件插入到 Xinha\
  \ 编辑器数组中。注意我们希望关联为编辑器的文本框的 **ClientID**。这与我们在以前版本的 ASP.NET 中所习惯的有所不同（如第 4 章前面所讨论的）。\n\
  \n现在，我们继续来看这个页面的 presenter。这个页面有三个主要任务：\n\n- 发送消息\n- 预加载消息的收件人（如果从警报链接过来的话），以及\n\
  - 回复消息\n\n这实际上是一样的，只是如果要回复消息，我们必须首先加载该回复。我们稍后会讲到！\n\n要发送消息，我们必须通过代码后置将按钮点击事件冒泡到我们的\
  \ presenter 中。由于我们在前面的章节中已经详细介绍了 MVP 的概念，这里不再赘述。因此，在 presenter 中，我们添加了一个名为 SendMessage()\
  \ 的方法，它接收主题（Subject）、消息（Message）以及一个收件人数组。\n\n```csharp\n//Fisharoo/Web/Mail/Presenters/NewMessagePresenter.cs\n\
  public void SendMessage(string Subject, string Message, string[] To)\n{\n    _messageService.SendMessage(Message,\
  \ Subject, To);\n}\n```\n\n该方法随后调用 MessageService.SendMessage() 方法并发送消息。\n\n收件人的预加载在\
  \ presenter 的 Init() 方法中处理。它会检查 QueryString 中是否有 AccountID（通过我们的 WebContext 包装器）。如果有，它会获取\
  \ Accounts 的 Username 属性，并将其添加到 UI 中的收件人字段中。\n\n将回复消息加载到 UI 与加载用户名非常相似。Init() 方法检查\
  \ WebContext 的 QueryString 中是否有 MessageID，如果有，则将之前的消息详细信息加载到 UI 中。该操作只在页面请求不是回发请求时执行。\n\
  \n```csharp\n//Fisharoo/Web/Mail/Presenters/NewMessagePresenter.cs\npublic void\
  \ Init(INewMessage view, bool IsPostBack)\n{\n    _view = view;\n    if(!IsPostBack)\n\
  \    {\n        if(_webContext.MessageID != 0)\n            _view.LoadReply(_messageService.GetMessageByMessageID(\n\
  \            _webContext.MessageID,_userSession.CurrentUser.AccountID));\n    }\n\
  }\n```\n\n\n\n## 消息\n\nTranslator - AccountsToUserNames 接收账户集合并返回这些账户的用户名字符串，这正是最终绑定到\
  \ UI 中 repeater 的内容。\n\n在我们 friend 控件的代码后置中，我们插入一段 JavaScript 片段，以便我们可以点击一个好友并将其用户名带入我们\
  \ NewMessage UI 中的 To 字段。\n\n```csharp\n//Fisharoo/Web/Mail/UserControls/Friends.aspx.cs\n\
  public void repFriends_ItemDataBound(object sender,\n                          \
  \           RepeaterItemEventArgs e)\n{\n    if(e.Item.ItemType == ListItemType.Item\
  \ || e.Item.ItemType ==\n                                  ListItemType.AlternatingItem)\n\
  \    {\n        HyperLink linkFriend = e.Item.FindControl(\"linkFriend\") as\n \
  \                                     HyperLink;\n        linkFriend.Attributes.Add(\"\
  OnClick\",\n                          \"javascript:document.forms[0].Content_txtTo.value\
  \ += '' + e.Item.DataItem + ';';\");\n    }\n}\n```\n\n请注意，我们为链接的 OnClick 事件添加了一个属性，该属性将调用\
  \ JavaScript 以将用户名移动到我们的 To 字段，并以分号作为分隔符。\n\n这为我们提供了一个好友列表，但我们如何将其关联回我们的 UI？打开 NewMessage.aspx\
  \ 页面。我们需要在页面中注册新的控件，然后在页面中添加对其的引用。\n\n在 Page 指令正下方添加以下代码：\n\n```\n<%@ Register Src=\"\
  ~/Mail/UserControls/Friends.ascx\"\n             TagPrefix=\"Fisharoo\" TagName=\"\
  Friends\" %>\n```\n\n然后在我们的页面中添加一个新的 Content 部分，好友控件将位于此处：\n\n```\n<asp:Content\
  \ ContentPlaceHolderID=\"LeftNavTop\" runat=\"server\">\n    <Fisharoo:Friends ID=\"\
  friends1\" runat=\"server\" />\n</asp:Content>\n```\n\n这会将好友控件插入到主页面中定义的左侧导航栏中！\n\
  \n将消息加载到 UI 中只是一个将 DataSource 绑定到 repeater 的问题。\n\n```csharp\npublic void LoadMessages(List<PMessage>\
  \ Messages)\n{\n    repMessages.DataSource = Messages;\n    repMessages.DataBind();\n\
  }\n```\n\n由于这不需要进一步解释，让我们直接进入构建页面导航的方法。回想一下，在我们 presenter 的 Init() 中，我们调用了 _view.DisplayPageNavigation()，它接收我们正在处理的文件夹的\
  \ PageCount 以及我们正在查看的当前页面。以下是该方法：\n\n```csharp\npublic void DisplayPageNavigation(Int32\
  \ PageCount, MessageFolders folder, Int32 CurrentPage)\n{\n    if(PageCount == CurrentPage)\n\
  \        linkNext.Visible = false;\n    if (CurrentPage == 1)\n        linkPrevious.Visible\
  \ = false;\n    linkNext.NavigateUrl = \"~/mail/default.aspx?folder=\" + ((int)folder).ToString()\
  \ + \"&page=\" + (CurrentPage + 1).ToString();\n    linkPrevious.NavigateUrl = \"\
  ~/mail/default.aspx?folder=\" + ((int)folder).ToString() + \"&page=\" + (CurrentPage\
  \ - 1).ToString();\n    for(int i = 1; i<=PageCount;i++)\n    {\n        HyperLink\
  \ link = new HyperLink();\n        link.Text = i.ToString();\n        link.NavigateUrl\
  \ = \"~/mail/default.aspx?folder=\" + ((int)folder).ToString() + \"&page=\" + i.ToString();\n\
  \        phPages.Controls.Add(link);\n        phPages.Controls.Add(new LiteralControl(\"\
  &nbsp;\"));\n    }\n}\n```\n\n这段代码与我们 UI 中的三个控件交互——两个超链接，一个显示 **Previous**，一个显示\
  \ **Next**，以及一个 **PlaceHolder** 控件，该控件将保存此数据集所有页面的各个页码。\n\n该方法首先根据当前页面和总页数确定是否应显示\
  \ **Next** 或 **Previous** 链接。然后我们将每个链接的导航属性挂钩，以便带我们进入下一页或上一页数据。之后我们使用 for 循环遍历所有可能的页面，从\
  \ 1 到 PageCount，为每次迭代创建一个新的超链接，其中包含该页面的位置。\n\n此页面的另一个功能是能够删除消息——我们可以删除任意多或任意少的消息。这主要通过视图代码后置中的一个辅助函数实现，该函数提取所有选中的消息，可以从\
  \ presenter 中调用。这允许 presenter 保持控制！\n\n```csharp\npublic List<Int32> ExtractSelectedMessages()\n\
  {\n    List<Int32> result = new List<Int32>();\n    foreach (RepeaterItem item in\
  \ repMessages.Items)\n    {\n        if(item.ItemType == ListItemType.Item || item.ItemType\
  \ ==\n           ListItemType.AlternatingItem)\n        {\n            CheckBox\
  \ chkMessage = item.FindControl(\"chkMessage\") as\n                           \
  \          CheckBox;\n            Int32 messageID =\n                Convert.ToInt32(chkMessage.Attributes[\"\
  MessageID\"]);\n            if(chkMessage.Checked)\n                result.Add(messageID);\n\
  \        }\n    }\n    return result;\n}\n```\n\n此方法遍历所有复选框以查看它们是否被选中。如果被选中，则从我们在加载显示时创建的属性中提取\
  \ MessageID。然后将 MessageID 集合返回给调用者。\n\n这就把我们带到了 presenter 中的 **Delete** 方法。它从冒泡到\
  \ presenter 的按钮点击事件中调用，然后调用视图获取选中的 MessageID 列表。然后使用 MessageService 获取该消息的副本。有了副本后，我们调用\
  \ MessageRecipientService.DeleteMessageRecipient() 方法并删除每个选中的消息。\n\n```csharp\n\
  linkFolder.NavigateUrl = \"~/Mail/Default.aspx?folder=\" +\n    ((MessageFolder)e.Item.DataItem).MessageFolderID.ToString();\n\
  linkFolder.Attributes.Add(\"FolderID\",\n    ((MessageFolder)e.Item.DataItem).MessageFolderID.ToString());\n\
  }\n}\n```\n\n这为我们在一个控件中创建了一个文件夹列表。但我们如何将其放入我们的 UI 中？为此，我们必须返回到我们的 Default.aspx 页面。这将与我们在新消息页面中为好友控件所做的完全相同。打开默认页面，以便我们可以添加\
  \ Folders 控件。\n\n```\n<%@ Register Src=\"~/Mail/UserControls/Folders.ascx\"\n  \
  \  TagPrefix=\"Fisharoo\" TagName=\"Folders\" %>\n<asp:Content ContentPlaceHolderID=\"\
  LeftNavTop\" runat=\"server\">\n    <Fisharoo:Folders id=\"Folders1\"\n        runat=\"\
  server\"></Fisharoo:Folders>\n</asp:Content>\n```\n\n### 读取消息\n\n读取消息并不困难。我们只是根据传递到页面的\
  \ MessageID 将消息加载到静态 UI 中。让我们先讨论 UI！该 UI 将由一个 From 标签、一个 Subject 标签、一个 Message 标签和一个\
  \ Reply 按钮组成。\n\n以下是消息视图：\n\n![](img/15a62e134135dde036b0ac3cbb01dab6_231_0.png)\n\
  \n以下是回复消息后会看到的内容：\n\n![](img/15a62e134135dde036b0ac3cbb01dab6_232_0.png)\n\n与往常一样，所有繁重的工作都在\
  \ presenter 中完成，让我们直接进入它。\n\n```csharp\n//Fisharoo/Web/Mail/Presenters/ReadMessagePresenter.cs\n\
  public void Init(ReadMessage view)\n{\n    _view = view;\n    _view.LoadMessage(_messageService.GetMessageByMessageID(_webContext.MessageID,\
  \ _userSession.CurrentUser.AccountID));\n}\n```\n\n正如你在这里看到的，我们通过根据 ID 获取消息然后将其传递给视图以供显示来填充\
  \ UI。\n\n对于 **Reply** 按钮，我们将点击事件冒泡到 presenter。Presenter 然后调用 Redirector 类，将当前 MessageID\
  \ 传递到 NewMessage 页面。\n\n## 问题\n\n除了构建此类系统时我们需要考虑的标准基础设施问题之外，任何基于 Web 的文件管理系统中的核心问题之一都是文件上传。正如我们所知，大多数服务器端技术一次只允许上传一个文件，ASP.NET\
  \ 也不例外。虽然我们可以轻松购买第三方插件来同时处理多个文件，但我们决定提供通过 Silverlight 或通过 Flash 上传文件的选项。\n\n一旦我们的文件上传流程运行起来，我们才完成了三分之一的工作！由于我们将主要关注上传图像，因此我们需要考虑提供一些图像处理。每次文件上传到我们的系统时，我们都需要为每个图像创建多个不同尺寸，以便在我们网站的各个场景中使用。起初，我们将创建缩略图、小型、中型、大型和原始尺寸照片。\n\
  \n现在，虽然创建不同尺寸的文件在技术上是与文件存储系统一起工作，但我们希望对文件存储概念做进一步的思考。正如我们在前几章中所讨论的，我们可以选择将文件存储在文件系统或数据库中。对于头像，将其与个人资料数据一起存储是有意义的，而对于图像库，将文件存储在文件系统上更有意义。在将文件存储到文件系统时，我们需要非常谨慎地定义文件结构以及文件存储的位置和方式。在我们的例子中，我们将使用系统生成的\
  \ GUID 作为文件名，并使用扩展名来定义我们存储的不同尺寸。我们将在开始了解该系统的细节时更深入地探讨这一点。\n\n一旦我们将文件上传到服务器并准备好在整个系统中使用，我们将讨论用户文件与系统文件概念。如果我们在构建系统时对这个主题有所考虑，我们就可以拥有一个非常通用的文件管理系统，可以在未来进行扩展。我们将在本章中构建一个个人系统。但正如你将在适当位置看到的一些标志，我们同样可以轻松构建一个系统文件管理器或一个群组文件管理器。\n\
  \n## 设计\n\n让我们来看看此功能的設計。\n\n\n\n\n\n## Files\n\n对于我们的站点，由于我们不会将文件存储在数据库中，因此我们需要更仔细地查看数据库中实际需要管理的内容，以便跟踪文件系统中的情况。除了标准的文件元数据外，我们还需要密切关注文件实际存储的位置——具体来说，文件将驻留在哪个文件系统文件夹（硬盘上的目录）。我们还需要能够维护哪些账户拥有哪些文件，或者在系统文件的情况下，哪些文件可以被任何人查看。\n\
  \n## Folders\n\n你可能会想知道，为什么我们在刚刚提到将管理文件系统文件夹以存储文件之后，还要单独设立一个关于文件夹的部分。在本节中，我们将从站点角度而非文件系统角度来讨论文件夹管理——如果你愿意的话，就是用户文件夹或虚拟文件夹。\n\
  \n与文件存储非常相似，我们将存储每个文件夹的各种元数据。我们还必须跟踪谁拥有哪个文件夹，谁可以看到哪个文件夹，或者在系统文件夹的情况下是否每个人都可以看到该文件夹。当然，由于每个文件夹都是文件的虚拟容器，我们必须维护文件夹与文件之间的关系。\n\
  \n## File upload\n\n文件上传过程将由 Silverlight/Flash 客户端处理。虽然这并不是一本关于 Silverlight 或 Flash\
  \ 的书，但我们将向你展示创建此 Flash 客户端是多么简单，它实际上只是提供了一种存储需要上传的多个文件的方式，然后一次上传一个文件，以便服务器可以处理每个文件。对于\
  \ Silverlight 选项，我们使用的是来自 CodePlex 的代码——**http://silverlightfileupload.codeplex.com/**。\n\
  \n## File system management\n\n管理文件系统乍一看可能似乎不是问题。然而，请记住，要使一个社区站点成功，我们至少需要大约 10,000\
  \ 个或更多独特用户。鉴于在当今大多数社区站点中，分享照片和其他文件都是如此受欢迎的功能，这很容易转化为大量上传的文件。\n\n![](img/15a62e134135dde036b0ac3cbb01dab6_239_0.png)\n\
  \n## Files\n\n在数据库中存储的最重要内容，当然是我们主要关注的：文件。与大多数关于物理二进制文件的讨论一样，我们总是要考虑是否要将文件存储在数据库中还是文件系统上。在这种情况下，我们认为将文件（以及在照片的情况下，其各种生成的尺寸）存储在文件系统上是有意义的。这意味着我们只会在数据库中存储每个文件的元数据。\n\
  \n这里最重要需要讨论的字段是 **FileSystemName**。如你所见，这是一个 GUID 值。我们将把上传的文件重命名为 GUID 加上原始扩展名。这使我们能够确保任何给定文件夹中的所有文件都有唯一名称。这消除了我们需要担心覆盖其他文件的需求。\n\
  \n然后我们看到 **FileSystemFolderID**。这是对 **FileSystemFolders** 表的引用，让我们知道文件存储的根文件夹位置。\n\
  \n接下来我们要讨论的项目是 **IsPublicResource** 标志。仅从其名称就可以很清楚地看出，该标志将文件设置为公开或私有，因此可以被所有人或其所有者（**AccountID**）查看。\n\
  \n## Media Galleries\n\n我们接下来遇到一个可能有些令人困惑的字段：**DefaultFolderID**。这与文件系统文件夹无关。这是用户创建的文件夹。文件初始上传时会被放入一个虚拟文件夹。该初始虚拟文件夹成为文件的永久家园。这并不意味着它是文件的唯一家园。正如你稍后会看到的，我们有这样的概念：文件可以通过订阅其他文件夹而存在于多个虚拟文件夹中。\n\
  \n## File system folders\n\n如前所述，**FileSystemFolders** 表负责让我们知道文件根目录的位置。这使我们能够在以后扩展系统以拥有多个根目录，这些根目录可能位于同一服务器的不同磁盘上，也可能位于完全不同的服务器上。该表中的字段有\
  \ **Key**、**Path**（URL）和 **Timestamp**。\n\n## File types\n\nFileTypes 表将帮助我们跟踪我们存储和处理的是什么类型的文件。这是一个简单的查找表，告诉我们给定文件的扩展名。\n\
  \n## Folders\n\n在这种情况下，文件夹是虚拟的。它们为我们提供了一种指定文件容器的方法。在我们的例子中，我们将包含照片，在这种情况下，文件夹将充当相册。这里唯一值得解释的字段是标志\
  \ **IsPublicResource**，它允许我们指定文件夹及其资源是公开还是私有，即可被所有人查看或仅可被所有者查看。\n\n## Folder types\n\
  \nFolderTypes 表允许我们指定文件夹的类型。目前这将只是名称，照片、电影等等。然而，将来你可能想要为每种文件夹类型指定一个图标，在这种情况下，这就是你想要分配该规范的地方。\n\
  \n## Account folders\n\n在 AccountFolders 表中，我们能够指定文件夹的额外所有权。因此，在文件夹是公共资源并且外部资源可以拥有文件夹的情况下，我们只需在此处创建新的所有权关系。这不是永久所有权。它仍然由\
  \ Folders 表的 **AccountID** 指定。这是跨多个账户的临时所有权。\n\n如前一个屏幕截图所示，我们拥有所有者（**AccountID**）和将被拥有的文件夹（**FolderID**）。\n\
  \n## Account files\n\n与 AccountFolders 表类似，AccountFiles 表允许某人订阅特定文件。这可用于 **Favorites**\
  \ 或类似概念的目的。此表的构成与 AccountFolders 相同。你拥有所有者和被拥有的文件。\n\n## Folder files\n\nFolderFiles\
  \ 表允许一个 Account 不仅订阅一个文件，类似于 Favorites 概念，而且还允许用户将我的一个文件放入他们的一个文件夹中，就好像该文件本身属于他们一样。\n\
  \n如前一个屏幕截图所示，这主要是一个保存其他表键的表。我们对每个文件都有 **FolderID**、**FileID** 和 **AccountID**。这清楚地指定了谁在接管所有权以及他们希望将其放置在哪里。\n\
  \n## Creating the relationships\n\n一旦所有表都创建完毕，我们就可以创建所有关系。\n\n对于这组表，我们在以下表之间建立了关系：\n\
  \n- **Files and FileSystemFolders**\n- **Files and FileTypes**\n- **Files and Folders**\n\
  - **Files and Accounts**\n- **Folders and Accounts**\n- **Folders and FolderTypes**\n\
  - AccountFolders and Accounts\n- AccountFiles and Accounts\n- AccountFiles and Files\n\
  - FolderFiles and Accounts\n- FolderFiles and Folders\n- FolderFiles and Files\n\
  \n## Setting up the data access layer\n\n数据访问层可以像前几章中那样设置。我们需要打开 Fisharoo.edmx 文件，右键单击并选择\
  \ **Update Model from Database**，并选择新表。保存文件，现在你就有本章可用的领域对象了。\n\n## Building repositories\n\
  \n随着新表的添加，将会添加新的存储库，以便我们可以获取存储在这些表中的数据。我们将创建以下存储库来支持我们的需求。\n\n- `FileRepository`\n\
  - `FolderRepository`\n\n我们的每个存储库通常都有一个按 ID 选择、按父 ID 选择全部、保存和删除的方法。一旦你看过一个存储库，你基本上就都看过了。查看前几章、附录或包含的代码以获取标准存储库的示例。在这里我们将讨论与标准不同的任何内容！\n\
  \n## FileRepository\n\n除了所有 XRepository 类都具有的正常方法外，FileRepository 还有几个额外的更有趣的方法。\n\
  \n- `UpdateDescriptions`\n- `DeleteFilesInFolder`\n- `DeleteFileFromFileSystem`\n\
  \nUpdateDescriptions() 方法是一个有趣的概念。此方法是一次执行多个更新而不是一次一个执行的第一个示例。这显然比单独的更新执行更具性能导向。\n\
  \n```csharp\n///Fisharoo/DataAccess/Repositories/FileRepository.cs\npublic void\
  \ UpdateDescriptions(Dictionary<int,string> fileDescriptions)\n{\n    using(FisharooDataContext\
  \ dc = conn.GetContext())\n    {\n        List<Int64> fileIDs = fileDescriptions.Select(f\
  \ => Convert.ToInt64(f.Key)).Distinct().ToList();\n        IEnumerable<File> files\
  \ = dc.Files.Where(f => fileIDs.Contains(f.FileID));\n```\n\n\n\n\n\n```csharp\n\
  foreach (File file in files)\n{\n    file.Description = fileDescriptions.Where(f=>f.FileID==file.FileID)\n\
  \    .Select(f=>f.Value).FirstOrDefault();\n}\ndc.SaveChanges();\n}\n}\n```\n\n\
  如你所见，此方法接受一个 **Dictionary** 集合，其中包含 **FileID** 和文件描述的列表。然后我们打开 DataContext。接着，从\
  \ Dictionary 集合中获取唯一的 **FileID** 列表。然后，我们只往返数据库一次，使用 **FileID** 集合的 **Contains()**\
  \ 方法获取所需的全部 File 对象。拿到相应的文件集合后，我们就可以遍历每个文件，将通过 **Dictionary** 集合传入的值设置为文件描述。等所有这些准备工作完成后，就可以调用\
  \ SaveChanges 方法。请记住，整个操作过程中我们只使用一个 DataContext。这正是这种更新方法有效的原因！\n\n```csharp\n//Fisharoo/DataAccess/Repositories/FileRepository.cs\n\
  public void DeleteFilesInFolder(string filePath, Folder folder)\n{\n    using (FisharooDataContext\
  \ dc = conn.GetContext())\n    {\n        List<File> files = GetFilesByFolderID(folder.FolderID);\n\
  \        foreach (File file in files)\n        {\n            DeleteFileFromFileSystem(filePath,\
  \ folder, file);\n        }\n        //Entity Framework 4 does not support any method\
  \ to bulk delete, hence only way is to iterate through resultset\n        //and\
  \ delete one by one, another way is to use dc.ExecuteStoreQuery() and pass SQL String\n\
  \        //dc.ExecuteStoreQuery() is efficient but does not use LINQ syntax\n  \
  \      var listOfFiles = dc.Files.Where(f => f.DefaultFolderID == folder.FolderID).ToList();\n\
  \        foreach (File f in listOfFiles)\n        {\n            dc.Files.DeleteObject(f);\n\
  \        }\n        dc.SaveChanges();\n    }\n}\n```\n\n```csharp\nif (System.IO.File.Exists(fullPath\
  \ + file.FileSystemName + \"__t.\" + file.Extension))\n    System.IO.File.Delete(fullPath\
  \ + file.FileSystemName + \"__t.\" + file.Extension);\nif (System.IO.File.Exists(fullPath\
  \ + file.FileSystemName + \"__s.\" + file.Extension))\n    System.IO.File.Delete(fullPath\
  \ + file.FileSystemName + \"__s.\" + file.Extension);\nif (System.IO.File.Exists(fullPath\
  \ + file.FileSystemName + \"__m.\" + file.Extension))\n    System.IO.File.Delete(fullPath\
  \ + file.FileSystemName + \"__m.\" + file.Extension);\nif (System.IO.File.Exists(fullPath\
  \ + file.FileSystemName + \"__l.\" + file.Extension))\n    System.IO.File.Delete(fullPath\
  \ + file.FileSystemName + \"__l.\" + file.Extension);\n\nif (Directory.GetFiles(fullPath).Count()\
  \ == 0)\n    Directory.Delete(fullPath);\n}\n}\n```\n\n此方法首先尝试识别我们要处理的 **FileType**，由此获得该类型文件的根文件夹。\n\
  \n请记住，如果你想将文件存储到多个位置并使用 **FileSystemFolders**，则需要对此稍作修改。这里展示的概念适用于单一根文件文件夹！\n\n\
  > 另一点值得注意的是，如果文件被锁定，文件删除可能会遇到问题。如果遇到问题，你可以在单独的表中创建一个条目，并运行一个定期扫描该表并删除文件的作业。\n\n\
  确定了根路径后，我们接着创建 **fullPath**。这个变量是通过调用我们的 WebContext 类创建的，该类负责确定服务器上的根路径。然后我们添加 **Files**，即文件的根文件夹。接下来就是刚刚配置的路径。下一部分目前可能看起来有些奇怪。当我们上传文件（稍后会讲到）时，我们会上传到一个以文件夹创建日期、年份和月份命名的目录中。\n\
  \n正确配置 **fullPath** 后，我们接着检查目录确实存在。现在，我们可以逐个遍历我们创建的每个文件。我们检查文件在指定位置是否存在，然后调用 System.IO.File.Delete。我们对上传过程中创建的每种文件类型都这样做。请记住，上传和删除过程是紧密相连的。因此，如果我们在某一端做了更改，也需要在另一端做相应的更改！\n\
  \n## 媒体库\n\n删除文件后，我们进一步对文件系统进行美化。我们需要检查文件夹现在是否为空。如果为空，则也删除该文件夹！\n\n### FolderRepository\n\
  \n在 FolderRepository 中有几个值得介绍的方法。\n\n- GetFoldersByAccountID\n- GetFriendsFolders\n\
  \nGetFoldersByAccountID 名副其实！它接收一个 AccountID，并执行搜索以获取传入 AccountID 的所有文件夹。它还不止于此。然后，它遍历结果列表中的每个文件夹，并为该文件夹的封面图片生成文件系统路径。这个结果随后被赋给\
  \ FullPathToCoverImage。如果没有找到封面图片，则分配默认图片。处理完这一切后，我们返回文件夹列表。\n\n```csharp\n//Fisharoo/DataAccess/Repositories/FolderRepository.cs\n\
  public List<Folder> GetFoldersByAccountID(Int32 AccountID)\n{\n    List<Folder>\
  \ result = new List<Folder>();\n    using (FisharooDataContext dc = conn.GetContext())\n\
  \    {\n        var account = dc.Accounts.Where(a => a.AccountID == AccountID).FirstOrDefault();\n\
  \n        IEnumerable<Folder> folders = (from f in dc.Folders\n                \
  \                       where f.AccountID == AccountID\n                       \
  \                orderby f.CreateDate descending\n                             \
  \          select f);\n        foreach (Folder folder in folders)\n        {\n \
  \           var fullPath = (from f in dc.Files.Include(\"FileType\")\n         \
  \                   join ft in dc.FileTypes on f.FileTypeID equals ft.FileTypeID\n\
  \                            where f.DefaultFolderID == folder.FolderID\n      \
  \                      select f).FirstOrDefault();\n            if (fullPath !=\
  \ null)\n            {\n                String FullPathToCoverImage = fullPath.CreateDate.Year.ToString()\
  \ + \"/\" + fullPath.CreateDate.Month.ToString() + \"/\" + fullPath.FileSystemName.ToString()\
  \ + \"_S_\" + fullPath.FileType.Name;\n                folder.FullPathToCoverImage\
  \ = FullPathToCoverImage;\n            }\n            else\n                folder.FullPathToCoverImage\
  \ = \"default.jpg\";\n            if (account != null)\n                folder.Username\
  \ = account.Username;\n        }\n        result = folders.ToList();\n    }\n  \
  \  return result;\n}\n```\n\n这个仓库中另一个有趣的方法是 GetFriendsFolders。此方法引入了一个新的 LINQ 概念——Union。Union\
  \ 会获取一个集合中的所有项，并将其与另一个集合中的项合并。两个列表中相同的项会被合并，从而最终得到的列表中的项是唯一的。\n\n```csharp\n//Fisharoo/DataAccess/Repositories/FolderRepository.cs\n\
  public List<Folder> GetFriendsFolders(List<Friend> Friends)\n{\n    List<Folder>\
  \ result = new List<Folder>();\n    foreach (Friend friend in Friends)\n    {\n\
  \        if (result.Count < 50)\n        {\n            List<Folder> folders =\n\
  \                GetFoldersByAccountID(friend.MyFriendsAccountID);\n           \
  \ IEnumerable<Folder> result2 = result.\n                Union(folders);\n     \
  \       result = result2.ToList();\n        }\n        else\n            break;\n\
  \    }\n    return result;\n}\n```\n\n在我们的方法中，我们接收一个 Friends 列表。然后遍历此集合，每次循环时检查文件夹数量是否少于\
  \ 50 个（我们选择了一个随机数量来在相册首页上显示）。如果少于 50 个，则获取当前好友的所有文件夹，并使用 Union 方法将其合并到结果列表中。我们持续这样做，直到\
  \ Friends 用完或首页上已有 50 个文件夹。\n\n如前所述，我们将构建一个基于 Flash 的文件上传客户端。该客户端负责在本地文件系统中选择一组文件，然后将文件逐个传递到服务器端的接收页面。当我们讨论照片文件（JPG、GIF\
  \ 等）时，我们还会涉及一些基本的图像处理概念。我们还将提供一个 Silverlight 上传控件作为备选方案，并重用 codeplex 上已有的控件（http://silverlightfileupld.codeplex.com/）。还有其他选项，如基于\
  \ AJAX 的控件，但我们希望引入一些富互联网应用（RIA）的特色，因此使用了 Flash 和 Silverlight。\n\n### 多文件上传\n\n我们的文件接收器能够一次接收多个文件。就我们而言，主要关注的是接收图像文件，但我们也会将其设置为接收其他文件。在我们的场景中，接收器（ReceiveFiles.aspx.cs）将位于\
  \ Files 目录中的某个网页内。我们将在此处解释代码，但仅展示相关部分，而不是完整代码。\n\n接收器的开头部分负责初始化一些变量和对象。这里唯一值得关注的是\
  \ sizesToMake 集合。该集合将保存所有尺寸，我们在后面会生成这些尺寸。如果我们要添加额外的尺寸或修改现有尺寸，就可以在这里进行。\n\n```csharp\n\
  Dictionary<string,int> sizesToMake = new Dictionary<string,int>();\n```\n\n然后，在\
  \ Page_Load() 方法中，我们初始化对象和尺寸集合。接着，我们检查一个查询字符串值，以确定我们要处理的是哪种文件。在我们的场景中，我们会处理照片，但以后可能会处理其他内容。\n\
  \n```csharp\n//determine save-to folder\nswitch (_webContext.FileTypeID)\n{\n  \
  \  case 1:\n        saveToFolder = \"Photos/\";\n        break;\n    case 2:\n \
  \       saveToFolder = \"Videos/\";\n        break;\n    case 3:\n        saveToFolder\
  \ = \"Audios/\";\n        break;\n}\n```\n\n\n\n\n\n## 媒体画廊\n\n一旦我们确定了要操作的文件夹，就需要检查该文件夹是否确实存在于文件系统中。如果不存在，我们可能需要创建它。\n\
  \n```csharp\n//make sure the directory is ready for use\nsaveToFolder += DateTime.Now.Year.ToString()\
  \ +\n                DateTime.Now.Month.ToString() + \"/\";\nif (!Directory.Exists(Server.MapPath(saveToFolder)))\n\
  \    Directory.CreateDirectory(Server.MapPath(saveToFolder));\n```\n\n接着，我们需要设置一些其他变量。我们需要获取当前操作的\
  \ Account（账户）。我们还需要接收上传的文件。最后，我们需要获取要保存文件的文件夹的完整路径。\n\n```csharp\nAccount account\
  \ = _accountService.GetAccountByID(\n    _webContext.AccountID);\nHttpFileCollection\
  \ uploadedFiles = Request.Files;\nstring Path = Server.MapPath(saveToFolder);\n\
  ```\n\n现在我们已经有了上传文件的集合，需要逐个处理每个文件。为此，我们将启动一个 for 循环。在每次迭代的开始，我们需要获取一个要处理的文件。\n\n\
  ```csharp\nfor(int i = 0 ; i < uploadedFiles.Count ; i++)\n{\n    HttpPostedFile\
  \ F = uploadedFiles[i];\n}\n```\n\n接下来，我们需要初始化更多变量，以确定文件的存储位置及存储方式。我们将从查询字符串中获取文件夹\
  \ ID。请注意，我们目前假设处理的是静态 fileType 为 1 的图像文件。如果我们创建另一个页面来上传音频文件，则应该传入 fileType。然后，我们通过解析上传文件名的末尾来获取\
  \ uploadedFileName。得到文件名后，我们获取文件扩展名。由于我们要将文件保存到文件系统，如果不确保文件名唯一，就会有覆盖文件的风险。为此，我们创建一个新的\
  \ GUID 字符串作为文件系统中的文件名。有了这些数据，我们就足以构建最终的文件名。然后我们创建域对象文件。\n\n```csharp\nstring folderID\
  \ = _webContext.AlbumID.ToString();\nstring fileType = \"1\";\nstring uploadedFileName\
  \ =\n    F.FileName.Substring(F.FileName.LastIndexOf(\"\\\\\") + 1);\nstring extension\
  \ =\n    uploadedFileName.Substring(uploadedFileName.LastIndexOf(\".\") + 1);\n\
  ```\n\n```csharp\nbreak;\ncase \"swf\":\n    file.FileTypeID = (int)File.Types.SWF;\n\
  \    break;\ndefault:\n    goodFile = false;\n    break;\n}\nbreak;\ncase \"3\"\
  :\n    file.FileSystemFolderID = (int)FileSystemFolder.Paths.Audios;\n    switch\
  \ (extension.ToLower())\n    {\n        case \"wav\":\n            file.FileTypeID\
  \ = (int)File.Types.WAV;\n            break;\n        case \"mp3\":\n          \
  \  file.FileTypeID = (int)File.Types.MP3;\n            break;\n        case \"flv\"\
  :\n            file.FileTypeID = (int)File.Types.FLV;\n            break;\n    \
  \    default:\n            goodFile = false;\n            break;\n    }\n    break;\n\
  }\n```\n\n接下来，我们尝试为域 **File** 对象填充所有属性，例如上传文件的大小、所属账户、文件系统名称等。\n\n```csharp\nfile.Size\
  \ = F.ContentLength;\nfile.AccountID = account.AccountID;\nfile.DefaultFolderID\
  \ = Convert.ToInt32(folderID);\nfile.FileName = uploadedFileName;\nfile.FileSystemName\
  \ = guidName;\nfile.Description = \"\";\nfile.IsPublicResource = false;\n```\n\n\
  现在我们可以开始实际工作了。如果 goodFile 标志仍为 true，我们可以将文件对象提交到数据库。然后，我们将实际上传的文件以其新文件名保存到文件系统。最后，如果\
  \ fileType 是图片，我们会使用 Resize() 方法对文件进行处理，以生成我们需要的各种尺寸的文件。\n\n```csharp\nif (goodFile)\n\
  {\n    _fileService.SaveFile(file);\n    F.SaveAs(fullFileName);\n    if(Convert.ToInt32(fileType)\
  \ == ((int)Folder.Types.Photo))\n    {\n        Resize(F,saveToFolder,guidName,extension);\n\
  \    }\n}\n```\n\n要进入 Resize() 方法，我们必须传入正在处理的上传文件、要将文件保存到的文件夹、为文件系统名称生成的 GUID，以及上传文件的扩展名。进入\
  \ Resize() 方法后，我们可以为上传的照片创建所需的所有尺寸变体。我们首先设置一个 foreach 循环，该循环将遍历类级 sizesToMake 集合中的字典。\n\
  \n```csharp\npublic void Resize(HttpPostedFile F, string SaveToFolder, Guid\n  \
  \                   SystemFileNamePrefix, string Extension)\n{\n    //Makes all\
  \ the different sizes in the sizesToMake collection\n    foreach (KeyValuePair<string,\
  \ int> pair in sizesToMake)\n    {\n\nusing(System.Drawing.Image image =\n     \
  \   System.Drawing.Image.FromStream(F.InputStream))\n//determine the thumbnail sizes\n\
  using(Bitmap bitmap = new Bitmap(image))\n{\n    decimal Ratio;\n    if(bitmap.Width\
  \ > bitmap.Height)\n    {\n        Ratio = (decimal) pair.Value / bitmap.Width;\n\
  \        NewWidth = pair.Value;\n        decimal Temp = bitmap.Height * Ratio;\n\
  \        NewHeight = (int)Temp;\n    }\n    else\n    {\n        Ratio = (decimal)\
  \ pair.Value / bitmap.Height;\n        NewHeight = pair.Value;\n        decimal\
  \ Temp = bitmap.Width * Ratio;\n        NewWidth = (int)Temp;\n    }\n}\n```\n\n\
  确定尺寸后，我们可以调整其大小并保存到文件系统。为此，我们再次引用上传的文件并重建一个新的 Bitmap。然后，就可以将新尺寸的 bitmap 保存到文件系统。但请注意，在这种情况下，当我们保存文件到文件系统时，并没有使用字典中的键名来为文件名添加片段。这会导致文件名由\
  \ {GUID}__{key}-{extension} 组成。这意味着每个文件都是唯一的，并且会拥有各种尺寸且名称唯一的文件。\n\n```csharp\nusing(System.Drawing.Image\
  \ image =\n        System.Drawing.Image.FromStream(F.InputStream))\nusing(Bitmap\
  \ bitmap = new Bitmap(image, NewWidth, NewHeight))\n{\n    bitmap.Save(Server.MapPath(SaveToFolder\
  \ + \"/\" +\n        SystemFileNamePrefix.ToString() + \"__\"\n        + pair.Key\
  \ + \"-\" + Extension),\n        image.RawFormat);\n}\n```\n\n我们继续遍历字典中的所有不同文件尺寸，为每个尺寸创建新文件。完成后，我们将处理下一个上传的文件。现在，让我们编写一个测试页面来测试我们的接收页面。\n\
  \n### 使用 Flash 上传器接收文件\n\n既然我们已经有了接收上传文件的方法，接下来让我们创建用于上传少量文件的 UI。这是一个基于 Flash 的\
  \ UI。你可以下载 Flash 试用版，也可以寻找 Swish 或 Flex 等产品中的替代方案。\n\n由于本书并非专门讲解 Flash，我们只快速浏览一下这个主题。我们将创建一个简单的\
  \ Flash UI，其中包含一个浏览框、几个动态文本框和一些标签。我们将整个 UI 构建在一个帧上，UI 效果如下图所示：\n\n![](img/15a62e134135dde036b0ac3cbb01dab6_255_0.png)\n\
