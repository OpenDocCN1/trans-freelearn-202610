  \      <td>\n                <asp:Label ID=\"lblDescription\" runat=\"server\"\n\
  \                    Text='<%#((PEBoardPost)Container.DataItem).Post %>'></asp:Label>\n\
  \            </td></tr>\n        <tr>\n            <td align=\"right\">\n      \
  \          <table width=\"120px\">\n                    <tr> <td colspan=\"2\">\n\
  \                        replied on\n                        <asp:Label ID=\"lblUpdateDate\"\
  \n                            runat=\"server\" Text='<%#((PEBoardPost)Container.DataItem).UpdateDate\
