  \n#### Tags.ascx\n\n从客户端来看，我们正在创建的标签控件似乎非常简单。此控件有两个面板——一个用于显示标签，另一个用于收集标签。\n\n```aspx\n\
  //Fisharoo/Web/UserControls/Tags.ascx\n<asp:UpdatePanel ID=\"UpdatePanel1\" runat=\"\
  server\">\n    <ContentTemplate>\n        <asp:Panel runat=\"server\" ID=\"pnlTag\"\
  \ Visible=\"false\">\n            <asp:TextBox ID=\"txtTag\" runat=\"server\"></asp:TextBox>\n\
  \            <asp:Button CssClass=\"SiteButton\" ID=\"btnTag\" runat=\"server\"\n\
  \                        Text=\"Tag It!\" OnClick=\"btnTag_Click\" />\n        </asp:Panel>\n\
  \        <asp:Panel runat=\"server\" ID=\"pnlTagCloud\" Visible=\"false\">\n   \
  \         <asp:PlaceHolder ID=\"phTagCloud\" runat=\"server\" />\n        </asp:Panel>\n\
  \    </ContentTemplate>\n</asp:UpdatePanel>\n```\n\n#### Tags.ascx.cs\n\n在此文件中我们定义了一个类和一个枚举。`TagState`\
  \ 枚举用于修改标签控件的各种状态。我们定义了以下条目：\n\n- **ShowCloud:** 此选项仅显示控件配置的对象的云。\n- **ShowTagBox:**\
  \ 此选项显示用于收集标签的文本框。它不显示任何云。\n- **ShowCloudAndTagBox:** 此选项同时显示云和文本框。\n- **ShowParentCloud:**\
  \ 此选项显示父级云。此选项可用于显示类似照片相册之类的所有标签。\n- **ShowGlobalCloud:** 此选项显示站点视角下的所有标签。\n\n`Tags`\
  \ 类实现了一个 `Display` 属性，其类型为 `TagState`（我们之前提到的枚举）。在 `Page_Load()` 方法中，我们初始化我们的 `TagsPresenter`，并在这样做的同时设置控件的状态并加载已收集的标签。\n\
  \n最后，我们有 **btnTag_Click()** 方法，它处理传递的点击事件并捕获新标签条目的 `TagName`。此 `TagName` 连同 `SystemObjectID`\
  \ 和 `SystemObjectRecordID` 一起传递给 `TagService.AddTag()` 方法。然后我们确定我们的 `Display` 选项中是否包含云。如果有，我们清除云并重建它，以便可以显示新标签。\n\
  \n```csharp\n//Fisharoo/Web/UserControls/Presenters/TagsPresenter.cs\npublic void\
  \ DetermineClientState()\n{\n    if (_webContext.CurrentUser != null &&\n      \
  \                   _view.Display == TagState.ShowCloud) {\n        _view.ShowTagCloud(true);\n\
  \        BuildTagCloud();\n    }\n    else if (_webContext.CurrentUser != null &&\n\
  \                         _view.Display == TagState.ShowCloudAndTagBox)\n    {\n\
  \        _view.ShowTagBox(true);\n        _view.ShowTagCloud(true);\n        BuildTagCloud();\n\
  \    }\n    else if (_webContext.CurrentUser == null &&\n                      \
  \   _view.Display == TagState.ShowCloudAndTagBox)\n    {\n        _view.ShowTagBox(false);\n\
  \        _view.ShowTagCloud(true);\n        BuildTagCloud();\n    }\n    else if\
  \ (_view.Display == TagState.ShowCloud) {\n        _view.ShowTagBox(true);\n   \
  \ }\n    else if (_view.Display == TagState.ShowParentCloud) {\n        _view.ShowTagCloud(true);\n\
  \        _view.ShowTagBox(false);\n        BuildParentTagCloud();\n    }\n    else\
  \ if (_view.Display == TagState.ShowGlobalCloud) {\n        _view.ShowTagCloud(true);\n\
  \        _view.ShowTagBox(false);\n        BuildGlobalTagCloud();\n    }\n    else\
  \ {\n        _view.ShowTagBox(false);\n        _view.ShowTagCloud(false);\n    }\n\
  }\n\npublic void BuildGlobalTagCloud()\n{\n```\n\n#### Votes.ascx\n\n`Votes` 控件具有显示上下箭头的\
  \ `ImageButton` 控件，以及显示当前投票数的标签。\n\n```aspx\n//Fisharoo/Web/UserControls/Votes.ascx\n\
  <%@ Control Language=\"C#\" AutoEventWireup=\"true\" CodeBehind=\"Votes.ascx.cs\"\
  \ Inherits=\"Fisharoo.Web.UserControls.Votes\" %>\n<asp:UpdatePanel ID=\"UpdatePanel1\"\
  \ runat=\"server\">\n    <ContentTemplate>\n        <table>\n            <tr><td><asp:ImageButton\
  \ ID=\"imgUp\" runat=\"server\" ImageUrl=\"~/Images/up.png\" ToolTip=\"This post\
  \ is useful\" onclick=\"imgUp_Click\" /></td></tr>\n            <tr><td align=\"\
  center\">\n                <asp:Literal ID=\"litVote\" Text=\"0\" runat=\"server\"\
  />\n            </td></tr>\n            <tr><td>\n                <asp:ImageButton\
  \ ID=\"imgDown\" runat=\"server\" ToolTip=\"This post not useful\" ImageUrl=\"~/Images/down.png\"\
  \ onclick=\"imgDown_Click\" />\n            </td></tr>\n        </table>\n    </ContentTemplate>\n\
  </asp:UpdatePanel>\n```\n\n#### Votes.ascx.cs\n\n`Votes` 控件存储两个属性。一个是 `Count` 即当前投票数，另一个是\
  \ `PostID` 即相关帖子的 ID。同一控件用于显示线程和帖子的投票数。唯一的区别在于如果它是线程（即问题）时显示的工具提示。\n\n最后它有两个按钮点击处理程序，用于递增和递减投票数，并将相同的值传递给演示者以存储到数据库中。让我们只看代码的相关部分：\n\
  \n```csharp\n//Fisharoo/Web/UserControls/Votes.ascx.cs\nprotected void Page_Load(object\
  \ sender, EventArgs e)\n{\n    presenter = new VotesPresenter();\n    presenter.Init(this);\n\
  \    if (IsQuestion)\n    {\n        imgUp.ToolTip = \"This question is useful\"\
  ;\n        imgDown.ToolTip = \"This question is not useful\";\n```\n\n\n\n## MarkAnswer.ascx.cs\n\
  \n在此文件中，我们需要处理两个属性。`PostID` 属性指示我们正在处理哪篇帖子，`IsAnswer` 属性指示该帖子是否已被标记为答案。当按钮被点击时，我们将其传递给\
  \ presenter 进行进一步处理。相关代码如下：\n\n```csharp\n//Fisharoo/Web/UserControls/MarkAnswer.ascx.cs\n\
  public void ToggleDisplay(bool value)\n{\n    btnAnswer.Visible = value ? false\
  \ : true;\n    imgAnswer.Visible = value ? true : false;\n}\n\nprotected void btnAnswer_Click(object\
  \ sender, EventArgs e)\n{\n    _presenter.MarkAsAnswer(PostID);\n}\n```\n\n## MarkAnswerPresenter.cs\n\
  \n唯一相关的部分是保存帖子，将其标记为已被接受的答案，并相应地为该账户增加积分。\n\n```csharp\n//Fisharoo/Web/UserControls/Presenters/MarkAnswerPresenter.cs\n\
  public void MarkAsAnswer(long PostID)\n{\n    BoardPost post = _postService.GetPostByID(PostID);\n\
  \    post.IsAnswer = true;\n    _postService.SavePost(post);\n    _accountService.SaveAccount(post.Account,\n\
  \                                BoardPost.ScoreInput.MarkedAsAnswer);\n}\n```\n\
  \n## 勋章页面\n\n最后，我们来看一下勋章页面，它使用账户的积分在 UI 上显示相应的勋章。由于此控件仅用于展示勋章，没有任何与之关联的更新操作，因此也没有与此控件关联的\
  \ presenter。\n\n### Medals.ascx\n\nUI 上有五个图像，用于显示用户已获得的勋章。\n\n```aspx\n//Fisharoo/Web/UserControls/Medals.ascx\n\
  <%@ Control Language=\"C#\" AutoEventWireup=\"true\" CodeBehind=\"Medals.ascx.cs\"\
  \ Inherits=\"Fisharoo.Web.UserControls.Medals\" %>\n<!-- keeping one visible to\
  \ help with UI layout. Actual visibility is controlled from code behind -->\n<asp:Image\
  \ ID=\"medal1\" runat=\"server\" ImageUrl=\"~/Images/medal.png\" />\n<asp:Image\
  \ Visible=\"false\" ID=\"medal2\" runat=\"server\" ImageUrl=\"~/Images/medal.png\"\
  \ />\n<asp:Image Visible=\"false\" ID=\"medal3\" runat=\"server\" ImageUrl=\"~/Images/medal.png\"\
  \ />\n<asp:Image Visible=\"false\" ID=\"medal4\" runat=\"server\" ImageUrl=\"~/Images/medal.png\"\
  \ />\n<asp:Image Visible=\"false\" ID=\"medal5\" runat=\"server\" ImageUrl=\"~/Images/medal.png\"\
  \ />\n```\n\n### Medals.ascx.cs\n\n这里只有一个相关属性，即 `Score`，它用于决定在 UI 上显示多少枚勋章。\n\n\
  ```csharp\n//Fisharoo/Web/UserControls/Medals.ascx.cs\npublic int Score\n{\n   \
  \ get {\n        if (ViewState[\"MedalScore\"] != null)\n            return Convert.ToInt32(ViewState[\"\
  MedalScore\"]);\n        else\n            return 1; }\n    set {\n        ViewState[\"\
  MedalScore\"] = value;\n        /* We have picked some range to display medals.\
  \ These are\n           easily customizable based on specific needs\n         *\
  \ 0 - 5 = no medal\n         * 6 - 20 = 1 medal\n         * 21 - 100 = 2 medals\n\
  \         * 101 - 500 = 3 medals\n         * 501 - 2000 = 4 medals\n         * >\
  \ 2001 = 5 medals\n         */\n        medal1.Visible = (value > 5) ? true : false;\n\
  \        medal2.Visible = (value > 20) ? true : false;\n        medal3.Visible =\
  \ (value > 100) ? true : false;\n        medal4.Visible = (value > 500) ? true :\
  \ false;\n        medal5.Visible = (value > 2000) ? true : false;\n    }\n}\n```\n\
  \n## 安装新的用户控件\n\n现在我们已经构建好控件并准备使用，接下来将它们集成到现有页面中。\n\n### 照片 UI\n\n让我们从 ViewAlbum.aspx\
  \ 页面开始。该页面显示上传的照片，是收集用户评分、评论和标签的绝佳内容。\n\n首先，我们需要在页面中注册用户控件，以便能够使用它们。我们通过在页面顶部添加\
  \ Register 声明来实现。\n\n```aspx\n<%@ Register Src=\"~/UserControls/Ratings.ascx\" TagName=\"\
  Ratings\"\n    TagPrefix=\"Fisharoo\" %>\n<%@ Register Src=\"~/UserControls/Tags.ascx\"\
  \ TagName=\"Tags\"\n    TagPrefix=\"Fisharoo\" %>\n<%@ Register Src=\"~/UserControls/Comments.ascx\"\
  \ TagName=\"Comments\"\n    TagPrefix=\"Fisharoo\" %>\n```\n\n注册完成后，我们就可以随意将它们放置在任何位置。我们选择将它们添加在每张照片显示区域的下方。\n\
  \n```aspx\n//Fisharoo/Web/Photos/ViewAlbum.aspx\n<li>\n    <asp:Label Style=\"font-weight:\
  \ bold;\" ID=\"lblFileName\"\n        Text='<%#((PEFile)Container.DataItem).FileName\
  \ %>'\n        runat=\"server\" /><br />\n    <asp:HyperLink ID=\"linkImage\" NavigateUrl='<%#((PEFile)Container.DataItem).Year\
  \ + ((PEFile)Container.DataItem).Month %>'\n        runat=\"server\"></asp:HyperLink>\n\
  \    <br />\n    <asp:Label ID=\"lblDescription\" runat=\"server\" Text='<%#((PEFile)Container.DataItem).Description\
  \ %>' />\n    <br />\n    <Fisharoo:Ratings ID=\"Ratings1\" runat=\"server\" SystemObjectID=\"\
  5\"\n        SystemObjectRecordID='<%#Convert.ToInt64(((PEFile)Container.DataItem).FileID)\
  \ %>'></Fisharoo:Ratings>\n    <br />\n    <Fisharoo:Tags ID=\"Tags1\" runat=\"\
  server\" SystemObjectID=\"5\" SystemObjectRecordID='<%#Convert.ToInt64(((PEFile)Container.DataItem).FileID)\
  \ %>' Display=\"ShowCloudAndTagBox\"></Fisharoo:Tags>\n    <br />\n    <Fisharoo:Comments\
  \ ID=\"Comments1\" runat=\"server\" SystemObjectID=\"5\" SystemObjectRecordID='<%#Convert.ToInt64(((PEFile)Container.DataItem).FileID)\
  \ %>'></Fisharoo:Comments>\n</li>\n```\n\n### 用户交互\n\n```aspx\n<asp:Literal Visible=\"\
  false\" ID=\"litFileID\" Text=\"<%#((PEFile)Container.DataItem).FileID %>\" runat=\"\
  server\"></asp:Literal>\n<asp:Literal Visible=\"false\" ID=\"litImageName\" runat=\"\
  server\" Text=\"<%#((PEFile)Container.DataItem).FileSystemName %>\"></asp:Literal>\n\
  <asp:Literal Visible=\"false\" ID=\"litFileExtension\" runat=\"server\" Text=\"\
  <%# ((PEFile)Container.DataItem).Extension %>\"></asp:Literal><br />\n</li>\n```\n\
  \n当我们将控件实际嵌入页面后，需要将其 **SystemObjectID** 设置为 5，即（我们数据库中的）**File** 对象。\n\n我们还需要将 **SystemObjectRecordID**\
  \ 设置为当前迭代项的 **FileID**。然后，对于 Tags 控件，我们需要将 **Display** 属性设置为 **ShowCloudAndTagBox**，这将允许用户查看已分配的标签并添加自己的标签。\n\
  \n### 论坛 UI\n\n另一组控件（Votes、MarkAnswer 和 Medals）将在论坛页面（如 ViewForum.aspx 和 ViewPost.aspx）中用到。这里我们以\
  \ ViewPost.aspx 为例，因为三个控件都在其中使用。你可以查看相关代码，了解对 ViewForum.aspx、其代码隐藏文件以及 presenter\
  \ 所做的更改。\n\n与照片 UI 的做法相同，我们首先在页面中注册控件：\n\n```aspx\n<%@ Register Src=\"~/UserControls/Votes.ascx\"\
