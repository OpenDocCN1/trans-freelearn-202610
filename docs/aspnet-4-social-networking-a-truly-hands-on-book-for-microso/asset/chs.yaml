- "# 8. 博客\n\n人们加入社区是为了寻找或提供关于某个预设主题的信息。这通常通过博客来实现。博客让人们能够自由表达自己，通常以故事、文章或简短随笔的形式，与社区分享任何主题。\n\
  \n将这个关键功能集成到你的社区中，实际上是最容易做的事情之一。到目前为止，我们已经构建了如此多的功能，因此接入博客模块及其所需组件将十分顺利。我们将不仅涵盖如何创建博客，还包括如何为博客文章添加友好\
  \ URL。一旦完成这些，我们接下来会把博客系统连接到提醒系统中。\n\n### 问题\n\n在本章中，我们将为网站添加博客功能。该功能将处理文章的创建和管理，还会处理向好友的提醒页面发送提醒。最后，我们还将为博客文章创建友好\
  \ URL。\n\n下面是我们向博客发布第一篇文章的过程。\n\n![](img/15a62e134135dde036b0ac3cbb01dab6_266_0.png)\n\
  \n文章创建后，我们将能够在博客首页和 **我的博客** 部分看到它。在这里，我们可以编辑或删除文章。我们也可以点击文章，查看到目前为止的内容。\n\n以下截图展示了点击文章后用户将看到的内容：\n\
  \n![](img/15a62e134135dde036b0ac3cbb01dab6_267_0.png)\n\n我们已将博客文章设置为显示博主的头像。这是一个你可以轻松添加或移除的功能。大多数用户都希望能够看到他们当前所读博客的作者是谁！\n\
  \n此外，我们还将为博客文章页面添加友好 URL。在下面的截图中，你可以看到博客是通过将其名称作为 URL 的一部分来访问的（../aspnet-4.aspx）。\n\
  \n![](img/15a62e134135dde036b0ac3cbb01dab6_267_1.png)\n\n### 设计\n\n我们只需要一张表来存储博客文章。之后，我们需要将博客系统接入现有的基础设施中。\n\
  \n博客表具有与上述 Blog 实体相同的属性。我们在本节中已经讨论了其中的大部分内容。\n\n这里一个有意思的地方是 **Post** 列。注意，我们将其设置为\
  \ **varchar(MAX)** 字段。对于你的社区而言，这可能太大，所以可以随意更改。对于我们的社区来说，这个数据类型是可用的。我们总是可以通过验证控件添加\
  \ UI 限制，而不会影响数据库设计。接下来，我们将看到 **IsPublished** 标志。该标志告知系统是否在公共区域显示文章。此外，我们还会关注 **PageName**\
  \ 列。这一列将显示在浏览器的地址栏中。由于它会显示在地址栏中，我们需要确保输入是干净的，以免遭受 SQL 注入攻击或解析问题（这些问题会导致数据类型异常）。我们稍后会在表示层的输入侧处理这个问题。\n\
  \n#### 创建关系\n\n一旦所有表创建完成，我们就可以创建所有关系。我们已经在 Blogs 表和 Accounts 表之间创建了关系：\n\n#### 设置数据访问层\n\
  \n要设置数据访问层，请按照以下步骤操作：\n\n1. 打开 Fisharoo.edmx 文件，并按照第 3 章所述加入新的 Blog 表。\n2. 点击保存，你现在应该就可以使用\
  \ Blog 域对象了！\n\n#### 构建仓库\n\n随着新表的加入，我们也会添加新的仓库，以便能够访问相应表中存储的数据。我们将在 Fisharoo\\\
  DataAccess\\Repositories 下创建 BlogRepository 仓库来满足我们的需求。\n\n我们的仓库通常会提供按 ID 选择、按父\
  \ ID 选择所有、保存和删除等方法。只要你见过一个仓库，基本上就相当于见过所有仓库了。请回顾前面的章节、附录或包含的代码，以了解标准仓库的示例。我们将讨论所有与标准实现不同的地方。\n\
  \n我们先从一个方法开始，该方法允许我们通过页面名称获取博客，而页面名称可以从浏览器的地址栏中捕获。\n\n```csharp\n//Fisharoo/DataAccess/Repositories/BlogRepository.cs\n\
  public Blog GetBlogByPageName(string PageName, Int32 AccountID)\n{\n    Blog result\
  \ = new Blog();\n    using (FisharooDataContext dc = _conn.GetContext())\n    {\n\
  \        result = dc.Blogs.Include(\"Account\").Where(b =>\n            b.PageName\
  \ == PageName && b.AccountID == AccountID).\n            FirstOrDefault();\n   \
  \     //we can do this since there will be only one result\n        result.account\
  \ = result.Account;\n    }\n    return result;\n}\n```\n\n请注意，要让该系统正常工作，我们只能让每个博客对应一个唯一的页面名称。如果我们强制整个社区都使用唯一的页面名称，最终可能会让一些用户感到不满。我们只想为此目的确保页面名称在用户之间唯一。为此，我们要求在传入页面名称的同时传入\
  \ AccountID，这样我们的用户就可以更灵活地重复使用页面名称！稍后我们将展示如何获取 AccountID。除此之外，我们使用 lambda 表达式从数据上下文中的博客集合里选出合适的博客。\n\
  \n接下来，我们将讨论一个通过 GetLatestBlogs() 方法获取所有最新博客文章的方法。这个方法还会为每篇博客获取并关联相应的 Account。在深入讨论这个方法之前，我们需要扩展\
  \ Blog 类，使其具有 Account 属性。\n\n要扩展 Blog 类，我们需要在 DataAccess 项目下创建一个公共分部类。\n\n```csharp\n\
  namespace Fisharoo.DataAccess\n{\n    public partial class Blog\n    {\n       \
  \ public Account account { get; set; }\n    }\n}\n```\n\n现在我们可以看一下 GetLatestBlogs()\
  \ 方法。\n\n```csharp\npublic List<Blog> GetLatestBlogs()\n{\n    List<Blog> result\
  \ = new List<Blog>();\n```\n\n```csharp\nint count = dc.Blogs.Where(b => b.PageName\
  \ == blog.\nPageName && b.AccountID == blog.AccountID).Count();\nif (count > 0)\n\
  \    result = false;\n}\nreturn result;\n}\n```\n\n此方法会查看除自身之外的所有博客条目，以判断是否存在由同一\
  \ Account 创建且使用相同页面名称的其他博客文章。这让我们能够有效限制用户创建重复的页面名称。当我们开始讨论用户友好 URL 时，这一点非常重要。\n\n\
  接下来，我们将看一个私有方法，它可以帮助我们清理这些页面名称输入。请记住，这些页面名称会显示在浏览器的地址栏中，因此其中不能包含浏览器想要编码的任何字符。虽然我们可以轻松地解码\
  \ URL，但这里更关键的是让 URL 保持用户友好，使用户和搜索引擎爬虫都能轻松地知道他们所处的位置。当 URL 中包含编码字符时，我们会看到类似 %20 的内容（%20\
  \ 相当于空格）。但阅读 my%20blog%20post 并不容易，而阅读 my-blog-post 则容易得多。因此，我们将去除所有所谓的特殊字符，并用连字符替换所有空格。这个方法就是\
  \ CleanPageName() 方法。\n\n```csharp\nprivate Blog CleanPageName(Blog blog)\n{\n \
  \   blog.PageName = blog.PageName.Replace(\" \", \"-\").Replace(\"!\", \"\")\n \
  \       .Replace(\"&\", \"\").Replace(\"?\", \"\").Replace(\",\", \"\");\n    return\
  \ blog;\n}\n```\n\n你可以根据需要随意添加任意数量的过滤器。目前，我们只是替换代码中看到的少数几个特殊字符。\n\n接下来，我们将进入服务层，用它来处理我们与系统的交互。与其他章节不同，本章不会引入任何新的服务层——我们将在现有服务层上进行扩展。\n\
  \n### 实现服务/应用层\n\n一旦所有仓库都为单一目的构建完成，我们就可以开始创建服务层。我们不会为这个组件创建任何新服务，但需要扩展现有的 AlertService，它位于\
  \ //Fisharoo/BusinessLogic 下。\n\n\n\n\n## AlertService\n\n正如我们在前几章中所知，AlertService\
  \ 负责通过用户的筛选页面（filter page）向用户发送通知。该页面会显示你和好友资料中的最新动态。\n\n对于博客，我们向 AlertService 类添加了两个方法——一个用于在发布新博客文章时发送提醒，另一个用于在更新博客文章时发送提醒。\n\
  \n```csharp\npublic void AddNewBlogPostAlert(Blog blog)\n{\n    alert = new Alert();\n\
  \    alert.CreateDate = DateTime.Now;\n    alert.AccountID = _userSession.CurrentUser.AccountID;\n\
  \    alert.AlertTypeID = (int)AlertType.AlertTypes.NewBlogPost;\n    alertMessage\
  \ = \"<div class=\\\"AlertHeader\\\">\" +\n        GetProfileImage(_userSession.CurrentUser.AccountID)\
  \ +\n        GetProfileUrl(_userSession.CurrentUser.Username) + \" has just added\
  \ a new blog post: <b>\" +\n        blog.Title + \"</b></div>\";\n    alert.Message\
  \ = alertMessage;\n    SaveAlert(alert);\n    SendAlertToFriends(alert);\n}\n```\n\
  \n如果你已经读过包含 AlertService 的第 4 章，你就会知道添加提醒需要做哪些工作。如果你还不了解，我们快速看一下这个 AddNewBlogPostAlert()\
  \ 方法。\n\n该方法会接收已发布的新 Blog 对象，这样我们就可以在提醒中使用其中的一些信息。一进入方法主体，我们就需要初始化一个新的 Alert，然后填写一些初始属性。\n\
  \n我们需要扩展的其中一个类是 AlertType 类，它包含 AlertTypes 属性。你会发现，AlertTypes 属性实际上对应着我们在数据库的 AlertTypes\
  \ 表中存储的记录 ID。打开 AlertType 类，为 NewBlogPost 和 UpdatedBlogPost 添加几个新条目。\n\n参考 //Fisharoo/DataAccess/AlertType.cs\
  \ 中的代码。\n\n然后进入 AlertTypes 表，创建两条新记录 NewBlogPost 和 UpdatedBlogPost。如果生成的记录 ID 与你上面看到的数字不一致，请将枚举中看到的数字更新为表中创建的对应数字。\n\
  \n现在我们来看希望在提醒中显示的消息。它可以包含任何标准 HTML，因为该消息将显示在提醒页面（也就是我们所说的筛选页面）上。一旦 Alert 完全配置好，我们就可以将\
  \ Alert 保存到数据库中。在本例中（但并非所有情况），我们还希望该提醒显示在所有好友的筛选页面上，让他们知道刚刚创建了一篇新博客文章。\n\n下面是更新博客文章提醒的方法，它与新增博客文章提醒的方法几乎相同：\n\
  \n```csharp\npublic void AddUpdatedBlogPostAlert(Blog blog)\n{\n    alert = new\
  \ Alert();\n    alert.CreateDate = DateTime.Now;\n    alert.AccountID = _userSession.CurrentUser.AccountID;\n\
  \    alert.AlertTypeID = (int)AlertType.AlertTypes.NewBlogPost;\n    alertMessage\
  \ = \"<div class=\\\"AlertHeader\\\">\" +\n                   GetProfileImage(_userSession.CurrentUser.AccountID)\n\
  \                   + GetProfileUrl(_userSession.CurrentUser.Username)\n       \
  \            + \" has updated the <b>\" + blog.Title +\n                   \"</b>\
  \ blog post!</div>\";\n    alert.Message = alertMessage;\n    SaveAlert(alert);\n\
  \    SendAlertToFriends(alert);\n}\n```\n\n在完成仓储层和服务层之后，我们现在可以来看看 UI 了。\n\n## 实现表示层\n\
  \n本章的表示层和基础设施一样简单。我们将在顶部导航中添加一个**博客**链接。点击此链接后，你会进入一个页面，其中显示最新博客文章的列表。在博客板块中，你可以选择从最新博客页面查看博客，也可以选择查看自己的博客或创建新博客。除了这四个页面外，我们还将讨论用户友好的\
  \ URL 如何在查看文章页面中发挥作用。你还可以考虑为博客提供 RSS 订阅，这样其他用户就可以在 Outlook 等客户端应用程序中收到推送，而无需显式访问网站。\n\
  \n## 最新博客文章\n\n查看最新博客文章只需对 BlogService 进行一次调用。为了让 UI 能够访问任何服务，它首先必须交出对所有显示交互的控制。具体做法是初始化一个\
  \ DefaultPresenter 实例，然后将自身的引用传递给该呈现器的 Init() 方法。进入呈现器的 Init() 方法后，我们就可以调用服务来获取最新博客。Blog\
  \ 实体被转换为 PEBlog，这是一个表示层实体，只包含与 UI 相关的字段。\n\n```csharp\n//Fisharoo/Web/Blogs/Presenters/DefaultPresenter.cs\n\
  public class DefaultPresenter\n{\n    private IDefault _view;\n    [Import]\n  \
  \  private IBlogService _blogService;\n    public DefaultPresenter()\n    {\n  \
  \      MEFManager.Compose(this);\n    }\n\n    public void Init(IDefault View)\n\
  \    {\n        _view = View;\n        List<Blog> list = _blogService.GetLatestBlogs();\n\
  \        _view.LoadBlogs(Translator.BlogToPEBlog(list));\n    }\n}\n```\n\n拿到最新博客后，我们就可以将它们传递到\
  \ UI 的代码隐藏文件中，并在 Default.aspx 页面中绑定这些博客。这里唯一需要关注的方法是 ItemDataBound()，它处理绑定到列表视图控件的每一个项。\n\
  \n```csharp\n//Fisharoo/Web/Blogs/Default.aspx.cs\npublic void lvBlogs_ItemDataBound(object\
  \ sender, ListViewItemEventArgs e)\n{\n    Literal litBlogID = e.Item.FindControl(\"\
  litBlogID\") as Literal;\n    HyperLink linkTitle = e.Item.FindControl(\"linkTitle\"\
  ) as HyperLink;\n    Literal litPageName = e.Item.FindControl(\"litPageName\") as\
  \ Literal;\n    Literal litUsername = e.Item.FindControl(\"litUsername\") as Literal;\n\
  \    //navigation URL will follow the URL routing pattern\n    linkTitle.NavigateUrl\
  \ = Page.GetRouteUrl(\"BlogRoute\", new { username = litUsername.Text, blogpage\
  \ = litPageName.Text });\n}\n```\n\n在查看这些细节之前，我们先来看一下要加载的 UI：\n\n```aspx\n//Fisharoo/Web/ViewPost.aspx\n\
  <table style=\"vertical-align: top\" width=\"100%\">\n    <tr>\n        <td align=\"\
  left\">\n            <asp:Label ID=\"lblTitle\" runat=\"server\" Font-Bold=\"True\"\
  \ Font-Size=\"X-Large\"></asp:Label>\n        </td>\n        <td align=\"right\"\
  >\n            <asp:HyperLink ID=\"linkProfile\" runat=\"server\" CssClass=\"\"\
  >\n                <asp:Image Width=\"50\" Height=\"50\" ID=\"imgAvatar\" runat=\"\
  server\"\n                    ImageUrl=\"/images/profileavatar/profileimage.aspx\"\
  \n                />\n            </asp:HyperLink>\n        </td>\n    </tr>\n \
  \   <tr>\n        <td colspan=\"2\" align=\"left\">\n            <hr />\n      \
  \      <asp:Label ID=\"lblPost\" runat=\"server\"></asp:Label>\n            <hr\
  \ />\n        </td>\n    </tr>\n    <tr>\n        <td align=\"left\" colspan=\"\
