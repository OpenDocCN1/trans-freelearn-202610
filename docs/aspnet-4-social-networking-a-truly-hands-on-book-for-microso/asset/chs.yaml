  \n请查看网站项目的 photos 文件夹。还有许多其他页面用于编辑照片、编辑相册等，这些页面演示了有关与我们的文件和相册数据交互的额外功能。\n\n### 小结\n\
  \n在本章中，我们深入探讨了媒体管理应用程序所涉及的基础架构和决策。我们重点讨论了图像的处理和存储。我们所看到的大部分原则适用于各种不同类型的文件。唯一需要真正调整的地方是文件存储在服务器上后如何处理。对于音频和视频文件，您很可能希望将它们从\
  \ WAV 或 WMV 格式转换为 Flash 格式，以便更便于您的 Web 用户访问，或者您可以将 Silverlight 与 IIS 平滑流媒体选项结合使用来流式传输\
  \ WMV 文件。需要注意的一个方面是内容增长以及随之而来的空间管理。您可能需要了解一些内容分发网络。\n\n本章增加了创建相册的能力。然后我们讨论了上传和处理照片的能力。我们还讨论了如何处理多文件上传以及在文件系统上存储它们的最合适方式。最后，我们为用户提供了一种与其相册和上传文件进行交互的方式。\n\
