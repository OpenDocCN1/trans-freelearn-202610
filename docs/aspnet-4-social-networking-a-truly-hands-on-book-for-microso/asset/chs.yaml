  \ > 0)\n            result = true;\n    }\n    return result;\n}\n```\n\n##### GetCurrentRating()\n\
  \nGetCurrentRating() 方法负责确定系统中特定对象的平均评分。\n\n```csharp\n//Fisharoo/DataAccess/Repositories/RatingRepository.cs\n\
