  \ Studio One 并对其进行优化，使其在您的系统上流畅运行。\n\n## 填写艺术家档案并选择语言\n\n**Start** 页面正中间是 **Artist\
  \ Profile** 窗口。在上一节安装 Studio One 时，您登录了 PreSonus 账户，因此 Studio One 已经知道您是谁，它会从您的账户信息中提取照片、名、姓和网站链接来填充此部分。如果由于某些原因（例如防火墙）此部分仍为空，请手动填写信息。\n\
  \nStudio One 将使用此信息在每次启动时热情欢迎您，但这不仅仅是为了友好的问候；此信息还将被 Studio One 用于填充您即将导出的精彩音频文件中的\
