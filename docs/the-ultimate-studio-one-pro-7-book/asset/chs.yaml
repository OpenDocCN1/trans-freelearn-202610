  ## 为空间音频格式化音轨


  进入新的 `Song` 后，创建制作的工作流程与前几章讨论的没有区别。您唯一需要注意的就是在创建新音轨时选择正确的配置。让我们现在就来处理这个问题：


  1. 点击 `Add Tracks` 按钮或按 `Ctrl` + `T`/`Cmd` + `T`。这将打开 `Add Tracks` 对话框。

  2. 点击 `Audio` 选项卡。

  3. 使用 `Format` 下拉菜单，选择您想用于此音轨的格式。对于大多数用途，您会想选择 `Mono`（对话、人声、单一乐器等）或 `Stereo`（音效、环境音、背景音乐等）：


