- '## 创建新 Song


  Song 是 Studio One 的核心。你大部分的制作工作——包括录制、编辑和混音——都在这里完成。在本章中，我们将一起在 Studio One 中创建你的第一个
  Song。


  **音乐制作**是一个高度创造性的过程，每个项目都是独一无二的。你可能创建一个新 Song 只是为了尝试新想法看看会有什么结果，或者你可能已经有一个完整编排的作品想要最终定稿。我将在本章和后续章节中展示一个分步工作流程，但请记住这是一个灵活的过程，你可以随意跳过任何你还没准备好完成的步骤（稍后随时可以回来完成）。


  在本章中，我们将仔细查看创建新 Song 时可用的选项和设置。其中一些颇具争议，经常在工作室和网络上引发辩论。这意味着需要一些技术讨论，但我保证通俗易懂。


  因此，在本章中，我们将涵盖以下主要主题：


  *   设置你的 Song 并探索 Song 设置

  *   在 Song 中更改速度、调号和拍号


  ## 技术要求


  要学习本章内容，你需要在电脑上安装并激活 Studio One。


  ## 设置你的 Song 并探索 Song 设置





  Studio One 在创建新 Song 时会提供大量选项和设置，但请记住，你不必在此刻调整所有这些设置。你随时可以稍后回来设置（或修改）它们。实验是音乐制作的重要组成部分，在创建新
  Song 时，你甚至可能不知道这些设置最终会是什么样。请随意跳过任何你尚未决定的参数。


  现在让我们一起创建你的第一首 Song。在 Studio One 的 **Start（开始）** 页面上，点击标题为 **New…（新建…）** 的大号加号。这将打开
  **New Document（新建文档）** 窗口：


  ![Figure 4.1: New Document window](img/B31512_04_1.jpg)


  *Figure 4.1: New Document window*


  该窗口左栏列出了一系列模板，旨在让你快速上手，即使你以前从未使用过 Studio One。请随意探索这些不同选项；不过，我们这里将使用 **Record and
  Mix（录制与混音）** 模板。选中它后，该窗口的右栏将显示你即将创建的 Song 的设置列表，如 *Figure 4.1* 所示。


  现在让我们逐一了解这些设置。


  ## Name（名称）


  刚开始时很难为歌曲想出一个名字。Studio One 会自动在 **Name** 字段中填入今天的日期以及你在 **Start Page** 的 Artist
  Profile（艺术家档案）中选择的名称，从而解决这个问题。你可以使用这个暂定名称立即创建 Song，稍后再修改。如果你的歌已经有名字了，请直接输入。


  ## Save location（保存位置）


  **Name** 字段下方的无标题字段可让你查看并选择该新 Song 的保存位置。在 *Chapter 2* 中，我们讨论了 Song 和 Project 文件的理想位置，并相应地配置了
  Studio One。此框现在指向该文件夹。


  接下来的两个设置 **Sample Rate（采样率）** 和 **Resolution（分辨率/位深）** 基于的概念容易引起混淆和争论，因此值得在此进行一些分析。我们先从
  **Sample Rate** 开始。


  ## Sample Rate（采样率）


  当你将麦克风或乐器连接到音频接口（通常称为声卡）时，接口会将来自这些声源的**模拟**信号转换为计算机可处理的**数字**数据（0 和 1）。为此，音频接口中的**模数转换器**会以固定间隔对输入的模拟信号进行**采样**。


  这类似于摄像机的工作原理：它以给定间隔捕捉连续运动的静止图像（帧）。当这些静止图像回放时，就产生了连续运动的错觉。


  不过，音频接口的工作速度比摄像机快得多：摄像机通常每秒捕捉 24 到 30 帧，而音频接口通常在同一时段内对音频信号采样 44,100 次。这被称为**采样率**。每秒对输入信号采样
  44,100 次的音频接口，其采样率称为 44,100 赫兹 或 44.1 千赫兹。


  在 **New Document** 窗口中，**Sample Rate** 下拉菜单中的可用选项取决于你的音频设备的能力。如今制造的大多数设备支持多种采样率，最高可达
  192 kHz。


  争论由此开始：有人认为更高的采样率能提供更高的音质，因此建议将其设置为设备允许的最高值。详细讨论数字音频超出了本书范围，但如果你想了解技术背后的科学原理，一个好的切入点是查阅
  *Nyquist theorem（奈奎斯特定理）* —— 我们所有当前的数字音频技术都基于此。


  ### Further reading（延伸阅读）


  如果你想深入了解数字音频的真实工作原理，请查看下面的文章 —— 这是一个很好的起点：[`www.soundonsound.com/sound-advice/all-about-digital-audio-part-1`](https://www.soundonsound.com/sound-advice/all-about-digital-audio-part-1)


  事实是，44.1 kHz 的采样率为音乐制作提供了完全足够的音质（你可以看到我在 *Figure 4.1* 中使用了它）。使用更高的采样率只会导致音频文件变大，并增加电脑的负载。


  只有两种情况需要更高的采样率：


  - 如果你制作的音频素材用于视频（配乐、音效、对白等），请使用 48 kHz 的采样率。这是视频编辑软件期望的采样率。如果你提供不同采样率的文件，视频编辑软件会毫无怨言地转换它们，但每次转换都会导致一定程度的质量损失，因此最好从正确的设置开始。


  - 如果你在录制音频后更改歌曲的速度，Studio One 将不得不应用**时间拉伸**（即拉伸你的音频素材以使其与新速度保持对齐）。尽管时间拉伸算法在过去几年有了显著改进，但它仍然是一个会降低音质的过程，而以高采样率录制是将其伪影降至最低的最佳方式。因此，如果你认为可能会在录制音频后更改歌曲速度，请选择高采样率（88.2
  kHz 是个不错的选择）。


  ### Important note（重要提示）


  如果你更改 **New Document** 窗口中显示的采样率，Studio One 将在你的音频设备上发起采样率变更。如果你在此选择的值不被设备支持，或者你的设备不允许第三方应用程序更改其采样率，Studio
  One 将发出采样率不匹配警告。你仍可在该警告下创建新 Song，Studio One 将尝试根据你的选择对传入的音频数据进行重采样，但这可能导致稳定性和性能问题。为避免此情况，请坚持使用音频设备支持的采样率。


  既然我们已经讨论了采样率，现在来讨论分辨率。


  ## Resolution（分辨率/位深）


  **Resolution** 决定用多少细节来表达录音中最柔和和最响亮部分之间的差异。这种差异称为录音的**动态范围**。


  乍一看，分辨率和动态范围似乎毫不相关；前者是以**比特**为单位的数字术语，后者是以**分贝**为单位的声学术语。粗略换算的话，这里每个比特对应约 6 分贝。因此，如果你在
  **Resolution** 菜单中选择 **16 Bits**，将获得约 16x6=96 分贝的动态范围，这对大多数音乐素材已绰绰有余。下一个选项 **24
  Bits** 将提供约 144 分贝。在世界上几乎所有的录音棚中，以 24-bit 分辨率录制是通用做法，这也是你应该使用的设置。


  你会看到菜单中还有更高的选项，就像采样率一样，有人争辩说这些能提供更好的音质。事实是这些更高选项属于过度配置；它们提供的巨大动态范围甚至超出了地球上科学分类的声音范畴。190
  dB 被认为是空气所能承受的最响亮声音；超过该值将产生冲击波（即飞机超音速时我们体验到的类爆炸现象）。






  ## 采样率和分辨率设置


  那么，如果这些选项有些大材小用，为什么还要提供它们呢？第一个原因是，有些人确实认为这些设置听起来更好，并且愿意为它们买单。第二个原因更具实用性，虽然属于特殊情况。如果你是声音录制专业人士，且身处一个非常不可控、不可预测的环境中（例如你在录制一场戏剧表演，演员在低语，你施加了巨大的增益，然后他们突然开始大喊大叫），这些选项提供的扩展动态范围将提供一层额外的安全保障。除此之外，没有任何正当理由使用高于
  24 位的设置。


  所以，总结本节内容：对于音乐项目，将 `Sample Rate` 设置为 44.1 kHz，将 `Resolution` 设置为 24 位。如果你制作用于视频的音频素材，将
  `Sample Rate` 设置为 48 kHz，将 `Resolution` 设置为 24 位。


  ## 其他“新建文档”页面设置


  以下设置稍后均可轻松且安全地修改，因此如果你刚开始创作歌曲，尚未决定这些事项，请随意跳过它们。


  ### 时间基准


  `Timebase` 设置用于调整 `Arrange` 窗口顶部时间轴标尺上的时间显示方式。可用选项如下：


  *   `Bars`（小节）：以音乐单位显示时间（例如小节、拍，以及八分音符、十六分音符等），具体取决于你的缩放级别。这非常实用，因为它允许 Studio One
  协助你将 `Arrange` 窗口中的事件对齐到音乐上有意义的位置，例如歌曲的小节起始和拍子。这是默认设置，也是你进行音乐制作时想要使用的设置。


  *   `Seconds`（秒）：以小时:分钟:秒:毫秒显示时间。如果你正在处理播客录音等项目，并希望标尺以绝对时间格式显示时间，请使用此选项。


  *   `Frames`（帧）：以小时:分钟:秒:帧显示时间。在处理视频以便跳转到特定帧时，请使用此选项。


  *   `Samples`（采样点）：根据上一节讨论的采样率显示时间。进行深度编辑和微观手术式编辑时，请使用此选项。


  我们将在 *第 10 章* 详细讨论时间基准，届时我们将探讨如何使用 `Ruler Track` 处理不同的时间单位。现在让我们继续浏览 `New Document`
  菜单。


  ### 歌曲长度


  此设置允许你指定歌曲的长度，制作完成后将用于定义导出区域。我从未有理由在项目开始时设置此项，也未见过或听说过有人这样做。直接跳过此设置即可——一旦歌曲完成，你将能轻松设置歌曲长度。


  ### 速度


  首先，给刚开始在 DAW 环境中进行音乐制作的人一个坏消息：你必须配合节拍器录音。这对于大多数来自传统背景的音乐人来说是不习惯的，但这是一个必要的范式转变，如果你想获得让
  DAW 大受欢迎的那些优势，就必须习惯配合节拍器工作。此环境中的一切设计都是基于时间网格运行的，如果你不使用节拍器，稍后添加乐器和使用许多编辑功能将几乎变得不可能。


  现在是好消息：你不必马上决定歌曲的 `tempo`。你可以先创建歌曲，尝试不同的速度，满意后再设置。你甚至可以在整首歌中更改速度，并精确控制速度变化，正如我们在下一节将看到的那样。


  如果你知道歌曲的速度，可以在此处立即设置。如果不知道，直接跳过此设置。


  ### 拍号和调号


  与速度一样，你可以在创建时设置歌曲的拍号和调号，也可以稍后设置：


  *   Studio One 利用 `Time Signature` 信息，根据歌曲的节奏结构细分 `Arrange` 窗口中的时间轴标尺。正确设置此项是正确使用
  Studio One 优秀编辑功能（包括跨音乐网格完美对齐事件）的前提条件。此信息还被 Studio One 的节拍器用于放置重音拍，使其与歌曲的节奏脉冲同步。查看
  *图 4.1*，左侧的数字（称为**分子**）表示每小节的拍数，可设为任意值。右侧的数字（称为**分母**）表示每拍对应的音符时值，只能设为常见音符值（4、8、16
  和 32）。因此，如果你的歌曲是 9/8 拍，例如，请分别将这些值设为 9 和 8。


  *   `Key Signature` 设置提供的优势较为有限：它影响 `Score` 视图中可选择的音符。因此，仅当你打算使用 `Score` 视图显示和/或打印歌曲中的音符时，才需要填写此项。


  现在 Studio One 已知晓你即将创建的歌曲的主要参数，在你点击 `OK` 按钮之前，还有一个最后的步骤需要讨论。


  ### 添加外部文件


  如果有想在项目中使用的外部文件，你可以在创建时通过将它们拖放到标题为 `Drop files here` 的框中来导入。Studio One 将自动为它们创建单独的轨道，并将它们放置在歌曲的开头。


  如果选中 `Stretch audio files to tempo`，Studio One 将尝试调整这些文件以匹配你在此窗口中刚选择的速度。某些音频文件在其元数据标签中包含速度信息。如果没有，Studio
  One 将使用自己的速度检测算法进行猜测。如果你想导入应保持原样的音频素材——如对白、音效等——请取消选择此选项。


  > **提示**

  >

  > 如果创建歌曲后需要更改 `Stretch audio files to tempo` 设置，请转到顶部菜单，点击 `Song`，然后选择 `Song Setup`。


  现在我们已经介绍了创建新 Song 所用的所有设置。点击 `New Document` 窗口上的 `OK`，你将进入 Studio One 中的第一首 Song。


  如果你计划在歌曲过程中更改速度、调号或拍号，最好在开始录音前规划好这些变化，这正是我们在下一节要做的。同样请记住，你随时可以回来完成这些步骤。


  # 在歌曲中更改速度、调号和拍号


  你可以在整首 Song 中任意次数地更改速度、调号和拍号。Studio One 使用 `Global Track` 系列来处理这些变化。全局轨道默认跨越整个编排，每个轨道控制一项专用功能，允许你查看和修改其各自功能在整个编排中的状态。这些轨道始终处于激活状态，但默认情况下隐藏不可见。要显示它们，请点击
  `Global Track Visibility` 按钮：


  ![图 4.2：全局轨道显示按钮](img/B31512_04_2.jpg)


  图 4.2：全局轨道显示按钮


  在本节中，我们将使用其中两个全局轨道：`Signature` 和 `Tempo`。让我们首先看看如何在整首歌中更改速度。


  ## 使用速度轨道更改歌曲速度


  你可能想应用细微的速度变化，为听起来机械的录音注入生命力；也可能想在歌曲中间引入剧烈的速度变化以产生戏剧张力。这些在 Studio One 中都非常容易实现，且你音乐中任何与速度同步的元素将继续保持同步。


  开始操作：点击 `Global Track Visibility` 按钮并选择 `Tempo`。这将显示 `Tempo` 轨道：





  ![Figure 4.3: The Tempo track](img/B31512_04_3.jpg)


  **图 4.3：节奏轨道**


  从这里开始，你有两个选项：你可以随时间逐渐改变节奏，或者设置节奏在特定时间点跳变到另一个值（例如，在歌曲的副歌部分切换到更快的节奏）。让我们来探索这两种选项。


  以下是如何随时间逐渐改变节奏：


  1.  按键盘上的 `1` 选择 `Arrow`（箭头）工具。


  2.  点击 `Tempo`（节奏）轨道上的任意位置以插入节奏变化。Studio One 会在你点击的位置插入一个点。


  3.  上下拖动该点以将节奏更改为所需值。你也可以左右拖动它以调整其在时间轴上的位置。


  4.  重复 `steps 2` 和 `3` 以输入任意数量的节奏变化。


  5.  现在将鼠标悬停在任意两点之间的斜坡上。将出现一个空心点。上下或左右拖动它，可将直线变为曲线（或抛物线）。与线性节奏变化相比，应用带有抛物线的节奏变化往往能产生更平滑的结果。在
  `Figure 4.4` 中，第 1 到 4 小节之间节奏线性变化，第 4 到 7 小节之间平滑变化（带曲线）：


  ![Figure 4.4: Applying a smooth tempo change with a parabola](img/B31512_04_4.jpg)


  **图 4.4：使用抛物线应用平滑的节奏变化**


  以下是如何在歌曲的特定时间改变节奏：


  1.  举例说明，假设你的歌曲有一个 8 小节的前奏。你希望前奏以 100 bpm 播放，然后从前奏过渡到歌曲的下一部分时跳变到 135 bpm。


  2.  按键盘上的 `,`（逗号）确保光标位于歌曲开头。


  3.  在 `Tempo` 轨道的数值字段中输入 `100`。这是你希望歌曲开头的节奏。


  4.  点击时间轴标尺上的第 9 小节，将光标移至 8 小节前奏的末尾。


  5.  然后，在 `Tempo` 轨道的数值字段中输入 `135`。现在歌曲的节奏将从第 8 小节到第 9 小节从 100 bpm 跳变到 135 bpm：


  ![Figure 4.5: Applying instant changes in tempo](img/B31512_04_5.jpg)


  **图 4.5：应用瞬时节奏变化**


  你可以组合使用这些方法中的任意一种，为你的歌曲注入流畅的节奏变化。即使你使用 `Global Track Visibility`（全局轨道可见性）按钮隐藏了 `Tempo`
  轨道，它仍将保持激活状态。


  ## 使用签名轨道更改歌曲的调号或拍号


  `Signature track`（签名轨道）允许你更改调号和拍号。你可以通过点击 `Global Track Visibility`（全局轨道可见性）按钮并在列表中选择它来显示此轨道。


  ![Figure 4.6: Signature track](img/B31512_04_6.jpg)


  **图 4.6：签名轨道**


  Studio One 利用调号信息协助你在 `Score View`（乐谱视图）中选择正确的音符。默认情况下，歌曲没有预选的调号。要添加或更改调号，请按以下步骤操作：


  1.  在 `Signature` 轨道上，右键点击你想要更改调号的小节号。这将打开一个小对话框，要求你在新拍号或新调号之间进行选择。点击 `Insert Key
  Signature…`（插入调号……）。


  ![Figure 4.7: Inserting time and key signatures](img/B31512_04_7.jpg)


  **图 4.7：插入拍号和调号**


  1.  Studio One 将打开一个五度圈图表，这是不同调性及其调号之间关系的可视化表示。从图表中选择你的调。请记住，大调列在外圈，小调列在内圈。


  ![Figure 4.8: Key signature selection diagram](img/B31512_04_8.jpg)


  **图 4.8：调号选择图表**


  1.  根据需要重复此操作多次，以向歌曲添加调性变化。


  Studio One 利用拍号信息在时间轴标尺上正确细分小节。它还利用此信息在节拍器中正确放置重音。如果你使用除默认 4/4 以外的任何拍号，正确设置这一点至关重要。


  现在，以下是如何添加或更改拍号：


  1.  在 `Signature` 轨道上，右键点击你想要更改拍号的小节号。这将打开一个小菜单，要求你在新拍号或新调号之间进行选择（参见 `Figure 4.7`）。点击
  `Insert Time Signature…`（插入拍号……）。


  2.  这将打开一个小窗口，你可以在其中设置新的拍号。使用 `Numerator`（分子）和 `Denominator`（分母）字段来设置拍号。`Numerator`
  表示每小节的拍数，`Denominator` 等于每拍的音符时值，因此如果你的歌曲是 6/8 拍，请将 `Numerator` 设为 6，`Denominator`
  设为 8：


  ![Figure 4.9: Insert Time Signature dialog box](img/B31512_04_9.jpg)


  **图 4.9：插入拍号对话框**


  太棒了！你现在已经规划了歌曲中所有重要的基石。当你开始录制音乐时，这将让你的生活更轻松，在编辑素材时也能促进你的工作流程。


  ## 总结


  在本章中，我们在 Studio One 中创建了你的第一首歌曲。我们详细查看了必须按歌曲设置的所有参数，并讨论了如何在编曲过程中更改节奏、调号和拍号。


  在下一章中，我们将进行第一次音频录制。你将学习如何设置 Studio One 以捕捉最佳的录音，并将掌握多种不同的录音方法，涵盖广泛的场景。

  '
- "## 5 录制你的第一条音频轨道\n\n音乐制作最酷的事情之一就是开始创作没有硬性规定的规则。有时你已经有了一个歌曲的想法，想以此为基础进行构建。有时你只是想尝试实验，直到找到一个能激发你灵感的宝藏。Studio\
  \ One 允许你从这些路径中的任何一条开始你的创作之旅，并朝着完全制作完成的最终母带迈进。\n\n本章和下一章在工作流程上并非顺序关系。如果你已经有了歌曲的想法，你会想把它作为草稿轨道录制下来，然后开始着手编曲。在这种情况下，请跟随本章学习，然后继续下一章。然而，如果你想从空白画布开始，探索\
  \ Studio One 生态系统中可用的新声音，并进行实验直到找到你下一首热门歌曲的吸引人的钩子，请跳到下一章，等你准备好添加音频素材时再回到本章。\n\n\
  在本章中，你将学习如何在 Studio One 中录制音频，以及如何优化你的录音工作流程以获得最佳结果。\n\n我们将涵盖以下主题：\n\n*   设置硬件以录制音频\n\
  *   设置 Studio One 以录制音频\n*   理解不同的录音模式\n*   录音最佳实践\n\n## 技术要求\n\n要跟随本章学习，你需要在电脑上激活\
  \ Studio One。你还需要一个录音源（麦克风和/或乐器）以及连接你的音源到音频设备的线缆。\n\n## 设置硬件以录制音频\n\n让我们首先将音源连接到音频设备。我们将介绍两种常见场景：\n\
  \n*   使用麦克风录制人声或乐器\n*   使用线缆将乐器连接到音频设备进行录制\n\n如果你想两者都做（例如，对着麦克风唱歌的同时，通过线缆连接弹奏电吉他），只需同时实施这两种方法即可。\n\
  \n### 设置麦克风\n\n\n\n我们可以使用麦克风来采录人声表现，也可以用它以声学方式录制乐器。关于麦克风的技术文献汗牛充栋，这是有充分理由的：选择正确的麦克风并正确使用它（反之亦然），能决定一场录音的成败。麦克风绝对是你录音信号链中最重要的环节。\n\
  \n虽然我们无法涵盖关于麦克风的所有细节，但我们想确保你能选择正确的麦克风并正确使用它，所以一份速成指南是很有必要的。\n\n## 了解你的麦克风\n\n就结构和工作原理而言，主要有两种麦克风类型：\n\
  \n*   **电容麦克风**通常更灵敏，能捕捉更多细节，因此通常是录音环节的首选。它们需要外部电源为机壳内的电路供电。这被称为**幻象电源**。幻象电源通过连接麦克风和音频设备的同一根线缆供电；大多数型号不需要额外的线缆或电源。只需确保在你的音频设备上将其开启即可（在某些设备中，幻象电源被称为**48V**，即\
  \ 48 伏特的缩写，这是为此目的提供的标准电功率）。\n\n*   **动圈麦克风**不如电容麦克风灵敏和响应快，但它们也有大放异彩的时刻：其较低的灵敏度使它们对环境噪音更具包容性，并能更从容地应对大声压声源。如果你在嘈杂的环境中录音，或者录制大声压乐器（如鼓组或电吉他音箱），使用动圈麦克风会获得更好的效果。\n\
  \n所有麦克风都利用振膜来捕捉声波。根据尺寸，振膜分为两类：\n\n*   **小振膜麦克风**大小约等于白板笔，更擅长捕捉高频声源。因此，例如它们是录制长笛、曼陀林和鼓组镲片的首选麦克风。\n\
  \n*   **大振膜麦克风**体积更大，在中低频方面更具优势。如果你只能买一支麦克风，请选择大振膜。它能在更广泛的素材上提供最佳的全能表现。大振膜麦克风在人声录制上几乎总是表现更好。\n\
  \n如果你以前用过麦克风，你就知道它们对来自不同角度的声音灵敏度并不相同。麦克风的**指向性模式**描述了麦克风对来自不同方向的声波有多灵敏。大多数麦克风具有**心形**指向性，意味着它们对来自前方的声音敏感，而抑制来自后方的声音。你必须了解麦克风的指向性模式，并将其放置在声源落入其最佳拾音点的位置。请查阅麦克风的用户手册；相关信息会在里面。\n\
  \n> **提示**\n>\n> USB 麦克风因其易用性而越来越流行。USB 麦克风是一种内置音频接口的麦克风。因此，你不必将传统麦克风插入声卡再将声卡连接到电脑，只需使用一根标准\
  \ USB 线将 USB 麦克风直接连接到电脑即可。除此之外，USB 麦克风的工作方式和表现就像传统麦克风一样，我们刚才讨论的所有不同功能也都适用于 USB 麦克风。\n\
  \n## 麦克风的摆放\n\n大多数家庭工作室在声学方面都不是理想环境，所以在这里多花一点力气会事半功倍。你的录音环境必须安静，尤其是当你使用灵敏的电容麦克风时，但这只是故事的一半。如果房间里存在可听见的声波反射，这些反射会被麦克风拾取，除非你身处一个声学条件极佳的空间，否则声波反射在录音中是大忌。\n\
  \n好消息是，这通常很容易且免费解决。在房间里填充吸音材料；例如，用地毯处理地面反射的声波，挂厚窗帘阻尼窗户反射的声波，并在裸露的墙壁前放置沙发。这对大多数房间来说已经足够。如果你仍能听到反射，可以搜索\
  \ DIY 吸音板，进一步从声学角度处理房间。\n\n如果你的电脑风扇噪音大，且你在同一房间录音，请注意麦克风的指向性模式，将其摆放到让风扇处于最不灵敏区域、而歌手/乐器处于最灵敏区域的位置。\n\
  \n在声源（被录制的歌手/乐器）和电容麦克风之间保持约 20 厘米（8 英寸）的距离。如果声源太安静，减小此距离；如果声源太大，增大此距离。如果你使用的是动圈麦克风，你需要让声源靠近得多。这里没有固定的配方；实验是关键。\n\
  \n## 使用麦克风配件\n\n有几类麦克风配件可供选择，从必不可少到有害无益都有。让我们看看最常见的几种：\n\n*   录音时，切勿手持麦克风。这样做会导致麦克风拾取手部的振动，最终变成低频隆隆声。虽然这在舞台表演中可以接受，但我们在录音时希望获得尽可能干净的信号。请改用麦克风支架。\n\
  \n*   使用**防震架**隔离通过麦克风支架传递到麦克风的任何振动。\n\n*   **防喷罩**常用于消除**爆破音**，即 *p* 和 *b* 等字母发音时产生的突然气流。我不是防喷罩的忠实粉丝，因为它们毕竟是滤网。你可以轻松驯服人声录音中的爆破音：让歌手头部相对麦克风保持一个轻微角度，使气流不直接正面冲击振膜。\n\
  \n在本节中，我们讨论了选择合适的麦克风、正确摆放它以及有选择地使用配件。现在，让我们看看直接用线缆录制乐器所需的步骤。\n\n## 设置乐器\n\n与麦克风相比，乐器的设置非常直接。此时你只需了解一种分类：\n\
  \n*   电吉他、贝斯吉他，基本上任何带有内置拾音器的乐器被称为**乐器电平信号源**（有时称为**高阻抗 / Hi-Z**）。\n\n*   合成器、电钢琴、鼓机和任何电子硬件乐器被称为**线路电平信号源**。\n\
  \n典型的音频设备能容纳这两种信号源类型。有些设备自动检测类型，有些为每种类型提供单独的输入插孔，有些设备则需要你手动拨动选择开关。\n\n查阅你的音频设备用户手册，确保设备设置为接收正确类型的信号。\n\
  \n如果你要录制具有立体声输出的乐器，且你的音频设备有两个可用输入，请使用两根单独的乐器线缆，将乐器的左、右声道输出分别连接到音频设备的独立输入端。\n\n现在你已经连接好输入源，准备进入\
  \ Studio One 进行一些最后的调整，然后开始录音。\n\n# 为录制音频设置 Studio One\n\n我们将从一个空白的 Song（工程）开始录音会话。\n\
  \n1.  在 Studio One 的**开始**页面，点击标题为**新建…**的大加号。这将打开**新建文档**窗口。\n\n2.  选择**录制与混音**模板，并按照我们在*第\
  \ 4 章*中讨论的那样调整新 Song 的设置。\n\n3.  点击**确定**。\n\n\n\n\n现在，让我们创建您的第一条音频轨道，并在您按下 `Record`（录制）按钮之前进行最后的调整。\n\
  \n## 创建音频轨道\n\n您在新建 Song（歌曲）中需要做的第一件事，就是创建用于录制的音频轨道。您在上一节中连接到音频设备的每个物理声源，都必须分配到单独的轨道上——这样，您就能在音乐制作中分别处理每个元素。因此，例如，如果您要同时录制一位歌手、一把电吉他和一台电钢琴，您将需要创建三条独立的音频轨道。\n\
  \n重复以下步骤，以添加所需数量的音频轨道：\n\n1.  点击 `Add Tracks`（添加轨道）按钮。这将打开 `Add Tracks` 菜单：\n\n\
  ![Figure 5.1: The Add Tracks menu](img/B31512_05_01.jpg)\n\nFigure 5.1: The Add\
  \ Tracks menu（添加轨道菜单）\n\n2.  在该菜单顶部，如果 `Audio`（音频）选项卡未被选中，请选择它。\n\n3.  在 `Name`（名称）字段中，为即将创建的轨道输入一个简短、具有描述性的名称。如果您留空此字段，Studio\
  \ One 将自动分配一个通用名称，例如 `Audio 01`、`Audio 02` 等。但随着您添加的轨道越来越多，要跟踪管理您的录音素材将变得更加困难。清晰地命名轨道将在项目逐渐扩大时提供巨大帮助。像\
  \ `Elec. Gtr. Clean`（电吉他 清音）这样简单的名称就足够了。\n\n4.  如果您想一次性创建多条轨道，`Count`（数量）参数会很有用。但请记住，所有这些轨道将具有相同的属性（相同的名称、相同的输入等），这并非我们在此处想要的。保持其为\
  \ `1`（默认值）。\n\n5.  为您的轨道选择一个 `Color`（颜色）选项。乍看之下这可能只是视觉装饰，但为轨道进行颜色编码是浏览大型项目的有效方法。为您的轨道制定一套配色方案，并在所有项目中坚持使用（例如，鼓轨道用蓝色，打击乐轨道用橙色等）。这将帮助您一眼就掌握素材全貌。\n\
  \n6.  在 `Format`（格式）下，对于连接到音频设备单个输入端的声源（这包括麦克风和吉他），选择 `Mono`（单声道）。对于连接到音频设备两个独立输入端的立体声声源（具有立体声输出的吉他效果器、具有立体声输出的合成器等），选择\
  \ `Stereo`（立体声）。\n\n7.  暂时跳过 `FX Chain`（效果链）。我们将在名为 *Applying effects during recording*（录制时应用效果）的章节中手动添加效果。\n\
  \n8.  在 `Input`（输入）下，选择该轨道将连接到的音频设备上的物理输入端。请注意，音频设备面板上列出的输入名称可能与 Studio One 分配的通用名称不同。对于典型的入门级双输入音频设备，Studio\
  \ One 会将它们标记为 `L` 和 `R`，而设备本身会分别将它们列为 `1` 和 `2`。\n\n9.  将 `Output`（输出）保持为 `Main`（主输出）（其默认设置）。\n\
  \n10. 点击 `OK`。\n\n太棒了！您已创建了第一条音频轨道！现在，让我们仔细看看位于其上的控件：\n\n![Figure 5.2: A track header](img/B31512_05_02.jpg)\n\
  \nFigure 5.2: A track header（轨道标题栏）\n\n`Record Enable`（录音准备）按钮（*Figure 5.2* 中的 *a*）将轨道置于录音准备状态。请确保该按钮已启用（显示为红色）。一旦您对录音满意并准备继续下一条轨道，就需要取消激活它。\n\
  \n`Monitor`（监听）按钮（*Figure 5.2* 中的 *b*）充当一个切换开关，用于选择轨道的输入源。当它处于激活状态（蓝色）时，您将听到该轨道所连接的物理输入端传来的声音。当它处于非激活状态（灰色）时，您将听到轨道上已录制的内容。我们目前还没有录制任何内容，所以请保持其激活状态。\n\
  \n**重要提示**\n\n如果您的麦克风与扬声器处于同一房间，启用 `Monitor` 按钮可能会产生非常响亮的啸叫声（反馈），导致潜在的听力和设备损坏。当麦克风在同一房间内工作时，请使用耳机代替扬声器。\n\
  \n让我们进行一次快速的试音：\n\n1.  对着麦克风说话，或演奏连接到此轨道的乐器。\n\n2.  在 `Monitor` 按钮激活的情况下，您应该能在扬声器上听到自己的声音/乐器声，并在\
  \ `VU meter`（电平表）（*Figure 5.2* 中的 *d*）上看到活动指示。\n\n3.  如果没有看到任何活动，请打开 `Input` 选择器（*Figure\
  \ 5.2* 中的 *c*）并切换到其他输入端。\n\n**提示**\n\n如果您发现对着麦克风说话或演奏乐器与在扬声器上听到回放之间存在延迟，请减小 `Dropout\
  \ Protection`（掉帧保护），正如 Chapter 2 中所讨论的那样。\n\n## 设置录音电平\n\n设置正确的录音电平对于捕捉干净的音频至关重要。如果电平太低，您的素材可能会被淹没在噪声底中——即来自环境、硬件电路等固有的噪声。如果电平设置过高，可能会超过系统所能处理的最大电平，导致削波和失真。以下是您在按下\
  \ `Record` 按钮之前，如何确保电平得到优化的方法：\n\n1.  打开 `Mix`（混音）窗口。\n\n2.  点击 `Inputs`（输入）按钮（*Figure\
  \ 5.3* 中的 *a*）。这将打开 `Mix` 窗口的 `Inputs` 部分（*Figure 5.3* 中的 *b*），其中包含您音频设备上每个输入端专用的\
  \ VU 电平表：\n\n![Figure 5.3: The Inputs button and section](img/B31512_05_03.jpg)\n\
  \nFigure 5.3: The Inputs button and section（输入按钮和区域）\n\n3.  现在，对着麦克风唱歌，或演奏您即将录制的乐器。至关重要的一点是，您唱歌或演奏的音量必须与几分钟后正式开始录制时的音量一致。\n\
  \n4.  密切关注相应的 VU 电平表。使用音频设备上的增益控制旋钮，将电平设置为在您唱歌或演奏时，VU 电平表指针徘徊在 **-12** 分贝左右（不必过于精确，-12\
  \ 分贝附近是一个安全区域）。\n\n5.  请注意，某些音频设备（如 RME Babyface）没有物理增益控制旋钮。如果是这种情况，您将不得不打开设备的软件混音器，并在那里使用虚拟增益旋钮。\n\
  \n6.  此时请勿触动 Studio One `Mix` 窗口上的推子。它们对录音电平没有任何影响。如果您需要调整监听音量，请使用音频设备上的输出或音量旋钮。\n\
  \n7.  如果您发现必须将增益过度调大（超过 3 点钟方向），这会带来麦克风前置放大器电路引入过多噪声的风险。请尝试靠近麦克风一些。\n\n8.  如果您发现必须将增益过度调小（低于\
  \ 10 点钟方向），您可能离麦克风太近了。请尝试稍微远离麦克风一些。\n\n如果您的录音具有很大的动态范围（一些非常安静的部分紧接着一些非常响亮的部分），您可以计划分两次（或更多次，取决于歌曲结构）录制，为每个部分优化电平、录制它，然后继续下一部分。\n\
  \n## 录制时应用效果\n\n对大多数人来说，在耳机中听到自己干瘪的声音并不是一种鼓舞人心的体验。原始的电吉他声音也是如此。添加能够润色人声或乐器音色的效果，将帮助音乐家进入歌曲的氛围，并鼓励他们呈现更好的表现。捕捉一场精彩的表现是您录音的终极目标，因此请随意用能让表演者兴奋的效果来“宠坏”他们。\n\
  \n但无论这些效果多么令人兴奋，我们都不想将它们 *print them to tape*（直译为“印到磁带上”，意指“固化录制/烧录进素材”），正如录音室专业人士常说的那样。在录制的热情中感觉棒极了的效果，几天后当您开始混音时可能会显得过头了，如果表演是带着效果一起录制进去的，就无法挽回了。\n\
  \n\n\n\n因此，我们采用一种两全其美的方法：我们可以在表演者的耳机中加入各种疯狂的效果，同时仅录制干声、未处理的信号。具体操作如下：\n\n![Figure\
  \ 5.4: Signal flow to and from an audio track](img/B31512_05_04.jpg)\n\n图 5.4：音频轨道的信号流向\n\
  \n假设你想为正在制作的歌曲录制自己的演唱。你将麦克风连接到音频设备上的 `Input L`；麦克风的信号现在通过调音台上标记为 `Input L` 的通道条进入\
  \ Studio One（*图 5.4* 中的 *a*）。然后，你创建一个新的音频轨道并选择 `Input L` 作为输入源（*图 5.4* 中的 *b*）。Studio\
  \ One 会自动在调音台上创建一个新的通道条，以代表来自这个新轨道的输出（*图 5.4* 中的 *c*）。\n\n轨道就像一台磁带录音机。它是录制和播放音频信号的地方。如果我们用磁带录音机的图像来替换\
  \ *图 5.4* 中的轨道（*b*），信号流向将更容易直观理解：\n\n![Figure 5.5: Another way of looking at signal\
  \ flow](img/B31512_05_05.jpg)\n\n图 5.5：查看信号流向的另一种方式\n\n来自音频设备的信号将首先到达 `Input` 通道（*图\
  \ 5.5* 中的 *a*），然后被录制到轨道上（*图 5.5* 中的 *b*）。接着，它会被路由到该轨道的通道条（*图 5.5* 中的 *c*）。\n\n你会注意到，这两个调音台通道（*图\
  \ 5.5* 中的 *a* 和 *c*）都有一个名为 `Inserts` 的部分。`Inserts` 是 Studio One 调音台上的虚拟插槽，我们用它来应用音频效果。例如，如果你想添加混响以赋予人声深度和空间感，你可以在任意一个\
  \ `Inserts` 部分加载混响插件，最终听到的效果将完全相同。\n\n然而，区别在于：插入到输入通道上的任何效果都会被录制到轨道中。回到我们的例子，如果你在输入通道上插入混响插件，你的演唱将连同混响一起被“烘焙”进录音里。当你开始混音时，将无法移除或修改它。\n\
  \n解决方法是将效果应用于轨道通道条的 `Inserts` 部分。你可以在此随意尝试各种效果，而无需最终确定。Studio One 只会录制来自输入通道的干声、未处理信号。\n\
  \n以下是一些建议，你可以在下一次录音时尝试这些效果插件：\n\n- 添加一个设置温和的 `Compressor`（压缩器）插件（将 `Ratio` 参数设置在\
  \ 2 到 4 之间），能让歌手在耳机中更清晰地听到自己的声音，帮助他们呈现更好的表现。\n- 每个人都喜欢自己声音里有混响。插入 Studio One 自带的\
  \ `Room Reverb`（房间混响）插件，选择 `Large Hall`（大型音乐厅）预设，并根据喜好调整 `Mix`（混合）参数。\n- 使用 Studio\
  \ One 的 `Tuner`（调音器）插件，确保你要录制的乐器音准正确。请记住，信号在通道条的 `Inserts` 部分是从上到下流动的；如果你插入了多个插件，信号会先经过列表顶部的插件，然后依次向下。`Tuner`\
  \ 插件可能会被其他插件添加的效果干扰，所以请将其拖到列表顶部。\n- 使用 `Ampire` 为原本单薄干瘪的声源增添色彩和特性。虽然它主要为电吉他设计，但几乎在所有乐器上都表现良好。这种增加的音色“态度”将帮你进入正确的状态，呈现更好的表现。\n\
  - 尝试 `Redlight` 为沉闷的人声增加额外的锐度和亮度。\n\n太棒了！通过应用这些效果，你让表演者处于最佳状态，大家都迫不及待想开始录音了。在真正按下\
  \ `Record`（录音）按钮之前，还有一个最后的步骤。\n\n## 设置节拍器\n\n为了充分利用 Studio One 强大的编辑功能（我们将在后续章节介绍），我强烈建议你使用\
  \ Studio One 内置的节拍器进行录音。如果你完全不想使用节拍器（例如，你在录制一段自由速度的古典乐曲），请随意跳过本节。\n\n你可以通过按键盘上的\
  \ `C` 键，或点击下方面板上的图标来开启或关闭节拍器：\n\n![Figure 5.6: Precount, Metronome Setup, and Metronome\
  \ on/off](img/B31512_05_06.jpg)\n\n图 5.6：预计数、节拍器设置和节拍器开/关\n\n如果你激活 `Precount`（预计数），当你按下\
  \ `Record` 按钮时，节拍器会在录音真正开始前数拍一小节。这会给你时间调整乐器位置、深呼吸并做好录音准备（这是一个极其宝贵的功能，特别是当你独自录音时）。\n\
  \n对于大多数常见的录音场景，以上就是你需要了解的关于使用节拍器的全部内容，但如果你需要进一步调整，只需点击扳手形状的 `Metronome Setup`（节拍器设置）图标，即可进入此页面：\n\
  \n![Figure 5.7: The Metronome Setup window](img/B31512_05_07.jpg)\n\n图 5.7：节拍器设置窗口\n\
  \n在此菜单中，你可以使用三种不同的声音设置节拍器：`Accent`（重音）在每小节的第一拍播放，`Beat`（拍子）在其他所有拍子播放。因此，如果你的拍号设为\
  \ `4/4`，`Accent` 将在每小节的“1”拍播放，而 `Beat` 将在 2、3、4 拍播放。\n\n`Offbeat`（弱拍/反拍）默认关闭，它会在每两拍之间播放。你知道\
  \ 4/4 拍有时会数作“*ONE AND TWO AND THREE AND FOUR AND…*”吗？`Offbeat` 就是负责发出那些 *AND* 的声音。如果你在非常慢的速度下工作，需要听到更细分的节拍器声音，这会很有用。\n\
  \n此菜单允许你分别设置这三种节拍器声音的音量。如果默认声音与你编曲中的其他声音冲突，你甚至可以更改它们。\n\n继续向下看窗口，`Precount` 正如我们提到的，指示\
  \ Studio One 在真正开始录音前预计数一小节。`Preroll`（预滚动）也是为了帮你准备录音，但它在你想从歌曲中间某处开始录音时更有用。启用 `Preroll`\
  \ 后，当你按下 `Record`，Studio One 会将时间线倒回当前位置前一小节，开始播放，然后当播放经过光标位置时自动开始录音。\n\n如果你需要更多时间准备表演，可以在此更改\
  \ `Precount` 和 `Preroll` 的时长。\n\n`Repeat Accent`（重复重音）在你使用每小节包含多个重音的拍号时，能让节拍器更容易跟随。例如，如果你的拍号是\
  \ `12/8` 且 `Repeat Accent` 禁用，节拍器只会在小节的第一拍放置重音。如果启用它，节拍器将在每第四拍放置重音（ONE two three\
  \ FOUR five six…），这让跟随变得容易得多。\n\n如果你激活 `Click in Precount Only`（仅预计数点击），节拍器在预计数后会安静下来，并在实际录音期间保持静音。如果节拍器声音从耳机漏出并被麦克风拾取，这很有用。\n\
  \n默认情况下，节拍器仅在录音时点击。`Click in Play`（播放时点击）允许节拍器在播放时也被听到——这非常适合在按下 `Record` 按钮前练习片段。\n\
  \n说到这里，我们终于准备好按下 `Record` 按钮了！在下一节中，我们将讨论 Studio One 中可用的各种录音模式，以及如何利用它们在各种场景中捕捉最佳表现。\n\
  \n## 理解不同的录音模式\n\n\n\nStudio One 中有多种不同的音频录制方法，每种方法都有不同的用途。了解这些模式将让事情变得更轻松，并使录制过程压力小得多。\n\
  \n## 基础录制\n\n以下是录制音频的基础方法：\n\n1.  点击 **Record Enable**（录音启用）按钮为您的音轨启用录音准备。如果该按钮为红色，则表示音轨已准备好录音。\n\
  2.  将播放光标设置在您希望开始录制的位置。\n3.  按下数字小键盘上的 `` `*` `` 或点击 **Lower Panel**（下方面板）上的 **Record**（录制）按钮：\n\
  \n![图 5.8：下方面板上的传输控制，包括 (a) 停止、(b) 播放、(c) 录制和 (d) 循环](img/B31512_05_08.jpg`)\n\n\
  1.  如果启用了 **Precount**（预计数），节拍器将按您在 **Metronome Setup**（节拍器设置）窗口中指定的小节数点击，然后开始录制。\n\
  2.  如果启用了 **Preroll**（预滚动），播放光标将向后跳转您在 **Metronome Setup**（节拍器设置）窗口中指定的小节数，开始播放，当光标到达您点击\
  \ **Record**（录制）前的位置时，Studio One 将开始录制。\n3.  录制将持续进行，直到您按下 `spacebar`（空格键）或点击 **Stop**（停止）按钮手动停止。\n\
  \n现在，让我们来看看其他可用的录制方法。\n\n## 自动打孔\n\n想象一下，您刚刚录制了一段精彩的表演，中间只有一个小错误。仅仅因为这一个错误就不得不丢弃整个录音，那太可惜了，对吧？通过使用\
  \ **Auto Punch**（自动打孔）功能，您可以只重新录制那段有问题的部分，而不影响录音的其余部分。具体操作如下。\n\n假设您录音中的问题部分从第 9\
  \ 小节的开始延伸到第 11 小节的开始：\n\n1.  点击其图标激活 **Auto Punch**（自动打孔）。激活时它会变红，如图 5.9 所示。\n\n\
  ![图 5.9：自动打孔按钮](img/B31512_05_09.jpg`)\n\n1.  将 **Left Locator**（左定位器）设置为您希望开始录制的位置（在本例中，您需要将其设置为第\
  \ 9 小节的开始）。您可以通过在时间轴标尺上手动拖动它，或在图 5.9 所示的 **L** 字段中输入数值来实现。\n2.  将 **Right Locator**（右定位器）设置为您希望结束录制的位置（在本例中，您需要将其设置为第\
  \ 11 小节的开始）。您可以通过在时间轴标尺上手动拖动它，或在图 5.9 所示的 **R** 字段中输入数值来实现。\n\n    现在您的左、右定位器将如下所示：\n\
  \n![图 5.10：为自动打孔录制设置在第 9 至 11 小节之间的左、右定位器](img/B31512_05_10.jpg`)\n\n1.  现在，将播放光标设置在您希望开始录制的位置，然后点击\
  \ **Record**（录制）。Studio One 将以播放模式启动，当播放光标到达第 9 小节开头时开始录制。它将在第 11 小节开头自动停止录制。\n\n\
  \    尽管 Studio One 不会在第 9 小节之前开始录制，但最好还是从前几小节开始演奏/演唱，这样录制开始时您就不必“冷启动”了。\n\n就这么简单！您通过修复一个小错误，挽救了一段原本完美的录音。\n\
  \n## 循环录制\n\n这是一项出色的功能，它允许您循环歌曲的某个片段并录制多个版本，而无需不断停止和重新开始录制。您可以使用此功能尝试新想法，或通过从多个不同版本中选择最佳部分来创建一个完美的合成版本。操作步骤如下：\n\
  \n1.  转到顶部菜单的 **View**（视图）并选择 **Record Panel**（录音面板）。这将在 **Lower Panel**（下方面板）正上方打开\
  \ **Record**（录音）面板。图 5.11 显示了该面板中用于调整 **Record Mode**（录音模式）的部分。\n\n![图 5.11：录音面板](img/B31512_05_11.jpg`)\n\
  \n1.  点击 **Takes to Layers**（版本转图层）以启用它。激活时它会变为蓝色。\n2.  将 **Left**（左）和 **Right Locator**（右定位器）位置设置在您想要处理的歌曲片段周围。\n\
  3.  点击 **Loop**（循环）按钮以激活它（图 5.8 中的 *d*）。\n4.  开始录制。\n5.  当播放光标到达 **Right Locator**（右定位器）位置时，它将跳回\
  \ **Left Locator**（左定位器）位置，在两点之间形成一个循环。\n6.  循环点之间的每一次通过都将记录在音轨内的单独图层上。\n7.  录制将持续进行，直到您按下\
  \ `spacebar`（空格键）或点击 **Stop**（停止）按钮手动停止。\n8.  停止录制后，录制的图层将自动展开，标记为 **Take 1**、**Take\
  \ 2** 等，具体取决于您让录制在两个定位器之间循环了多少次：\n\n![图 5.12：循环录制后展开的音轨图层](img/B31512_05_12.jpg`)\n\
  \n在 第 8 章 中，您将能够处理这些图层，选择每个版本的最佳部分并创建一个完美的合成版本。\n\n本章迄今为止，我们一直关注音频录制的技术层面。但录制实际上是一个复杂得多的过程，涉及美学、细节关注、沟通技巧和解决问题。\n\
  \n在下一节中，您将找到一系列录制最佳实践，它们将帮助您每次都能捕捉到完美的版本。\n\n## 录制最佳实践\n\n录制是整个音乐制作过程中迄今为止最复杂、最困难、压力最大的部分。这是因为录音过程中有几种不同且相互冲突的动态在起作用：对创造力的艺术渴望、专注于细节的技术冲动、按时完成项目的压力、对表演质量的个人不安全感，等等。如果您在为自己录音，所有这些冲突动态都会在您的脑海中发生。如果您是作为团队一员工作，它们会在人际层面浮现。无论它们如何表现，这些冲突因素都会挑战每次录音的成功。\n\
  \n以下是一些录制最佳实践，将帮助您让下一次录音体验变得顺风顺水：\n\n*   录音的最终目标是捕捉最佳的表演。确保被录制者感到放松且无压力。\n*   如果您在为别人录音，反馈要委婉。说\
  \ “*There are some out-of-tune notes, let’s try that again*”（“有几个音不准，再来一次”）无法解决问题。要圆滑一点（例如，您可以把录音放给歌手听，让他们自己找出走音的音符）。\n\
  *   如果您在为自己录音，不要让大脑的技术一面恐吓创造性的一面。\n*   如果有走音的音符，让歌手单耳戴耳机，另一只耳朵敞开。\n*   不要因小错误而停止录制。继续进行。请记住，您可以使用\
  \ **Auto Punch**（自动打孔）功能在后续通过中修复它们。许多类型的错误也可以在后期制作中修正。\n*   让您的歌手/表演者即兴发挥并录制下来。稍后将这些片段点缀在歌曲的各个部分以增加色彩。\n\
  \n\n\n*   我曾提醒过不要在输入通道的 `Inserts`（插槽）部分使用效果器；然而，现在出现了一个例外——在你正在从中录音的输入通道上应用一个限制器。这是一个效果器插件，它允许低于指定电平（由\
  \ `Ceiling`（上限）参数设置）的信号不受影响地通过，并降低超过 `Ceiling` 电平的信号。将 `Ceiling` 值设置为 `\\-1` dB，如下所示：\n\
  \n![图 5.13：限制器插入在输入 L 上，上限控制设置为 -1 dB](img/B31512_05_13.jpg)\n\n图 5.13：限制器插入在输入\
  \ L 上，上限控制设置为 -1 dB\n\n这将起到安全保险丝的作用，保护你的录音免受意外削波的损害。有时歌手可能会情绪高涨，在表演的激情中，他们可能会离麦克风更近一些，或比排练时唱得更响亮。我们不想因为偶尔的几次削波而失去一个原本完美的表演。请记住，这只是一种安全预防措施。它不应被用作设置正确电平的替代品，正如我们在本章前面所讨论的那样。\n\
  \n*   将冗长、高难度的乐句拆分开来，以更小、更易于驾驭的片段进行录制。如果你这样做，请务必确保表演的音色和活力从一个版本到下一个版本保持一致。\n\n*\
  \   不要对录音的某一个方面过分纠结而让其他问题溜走。作为录音操作者，你有责任捕捉完美的版本，因此要时刻留意所有技术问题以及表现力问题。\n\n*   保持积极心态。将录音时段视为让你的歌曲栩栩如生的最大机遇。\n\
  \n遵循这些最佳实践将帮助你开展一场顺畅、愉快且高效的录音会话，并捕捉到最佳的表演。\n\n## 总结\n\n在本章中，你学习了如何为录音准备硬件。你创建了第一条音频轨道，并配置\
  \ Studio One 以从各种音源采集音频。随后，你了解了不同的录音模式，以及每种模式如何用于优化录音体验。最后，我们讨论了几条录音最佳实践，帮助你捕捉最完美的表演。\n\
  \n在下一章中，我们将深入探讨如何在 Studio One 中录制和编程 `MIDI`。\n"
- "## 添加虚拟乐器与录制 MIDI\n\n虚拟乐器几十年来一直是音乐制作不可或缺的一部分，而 `MIDI` 是让我们能够使用它们的通用语言。所有 DAW（数字音频工作站）最重要的职责之一，就是接收我们的创意想法并将其转换为虚拟乐器可处理的\
  \ `Musical Instrument Digital Interface`（`MIDI`，乐器数字接口）数据。\n\n以当今的标准来看，`MIDI` 是一种古老且繁琐的语言，因此这种转换绝非易事，但\
  \ Studio One 出色地完成了这项工作。无论你是完全的初学者还是资深专家，你都会发现有大量替代方法能在瞬间将你的想法引导为具体的音乐制作。\n\n本章将首先为完全的初学者简要介绍\
  \ `MIDI`，然后我们将进一步考察 Studio One 录制和输入 `MIDI` 的多种方法。在本章结束时，你将对如何将音乐创意转化为 `MIDI` 数据，以及如何使用\
  \ Studio One 的虚拟乐器让创意栩栩如生有扎实的理解。\n\n我们将涵盖以下主题：\n\n*   认识 `MIDI`\n*   添加和配置 `MIDI`\
  \ 乐器\n*   输入和录制 `MIDI`\n*   使用 Melodyne 将音频转换为 `MIDI`\n\n## 技术要求\n\n要学习本章内容，你需要在电脑上激活\
  \ Studio One。`MIDI` 键盘并非必需，但将有助于实施某些录制技巧。\n\n如果你有兴趣将音频素材转换为 `MIDI`，你需要在电脑上安装并激活\
  \ Melodyne。Melodyne 随 Studio One Pro 捆绑提供。\n\n## 认识 MIDI\n\n`MIDI` 是一种通讯协议，允许电子乐器相互“对话”。它在\
  \ 80 年代作为一项技术标准被引入，旨在让拥有大量设备的电子音乐人的生活更轻松。摇滚乐队的键盘手只需带一台键盘上台，就能用它演奏舞台后方机架上藏着的多台设备。\n\
  \n随着电脑变得越来越普及，人们很快意识到，既然从键盘传送到舞台后方设备的信号纯粹是数字的，它就能轻松地存储和处理在电脑上。这是开创性的：人们现在可以在键盘上演奏音乐创意，在电脑上录制这些演奏，然后像使用文字处理器编辑文本一样回头编辑它们。他们不仅能在表演后修正错误，还能润色创意，做一些人类无法做到的事，例如编写真实鼓手永远无法演奏的鼓声部。`MIDI`\
  \ 为音乐制作打开了一个全新层面的大门，其后的故事便是历史了。\n\n尽管 `MIDI` 对音乐制作产生了革命性的影响，但它实际上基于一个非常简单的原则。`MIDI`\
  \ 设置中有两个组件：\n\n*   `MIDI controller`（MIDI 控制器）是一个将你的音乐演奏转换为 `MIDI` 数据的物理接口。它最常见的形式是音乐键盘，但随着时间的推移，出现了几种不同类型的控制器，包括鼓垫、气息控制器和\
  \ `MIDI` 吉他。你演奏 `MIDI` 键盘的方式就像弹钢琴键盘一样。不过，`MIDI` 键盘不产生声音，而是根据你的演奏生成 `MIDI` 数据。这些数据包含诸如你演奏了哪个音符、敲击力度如何等信息。\n\
  \n*   `MIDI controller` 生成的数据被发送到 `MIDI device`（MIDI 设备）。该设备负责将 `MIDI` 数据转换为实际的声音。它解析来自\
  \ `MIDI controller` 的数据，并根据其编程方式合成或触发声音。`MIDI device` 可以是硬件形式（例如硬件合成器）或软件形式。软件乐器也被称为虚拟乐器。我们将交替使用这两个术语。\n\
  \n如今，这两个组件通常通过标准 USB 端口和 USB 线缆连接，但如果你有一些较老的设备，可能会发现它们拥有五针输入和输出接口，如下所示：\n\n![图 6.1：带有五针接口的\
  \ MIDI 设备](img/B31512_06_01.jpg)\n\n图 6.1：带有五针接口的 MIDI 设备\n\n不过，如果你需要将这些设备连接到只有\
  \ USB 端口的新设备上，也不必担心，因为 USB 转 MIDI 转换器随处可买，且价格非常低廉。\n\n### 将设备连接到 Studio One\n\n\
  Studio One 将 `MIDI` 控制器称为 `keyboards`（键盘），将 `MIDI` 设备称为 `instruments`（乐器）。我们在 `第\
  \ 2 章` 中讨论了如何连接和配置这些设备。Studio One 对你可以添加的 `keyboards` 和 `instruments` 数量不设限制。然而，如果你想连接多台设备而电脑没有足够的可用\
  \ USB 端口，你会遇到实际限制。如果发生这种情况，请随意添加一个 USB 集线器并将所有设备连接到它上面；`MIDI` 占用带宽极低，标准 USB 集线器能轻松处理多台设备。\n\
  \n![图 6.2：典型家庭工作室设置，包含 (a) 一台 MIDI 键盘、(b) 一台合成器、(c) 另一台合成器、(d) 一个 USB 集线器和 (e) 一台电脑](img/B31512_06_02.jpg)\n\
  \n图 6.2：典型家庭工作室设置，包含 (a) 一台 MIDI 键盘、(b) 一台合成器、(c) 另一台合成器、(d) 一个 USB 集线器和 (e) 一台电脑\n\
  \n\n\n值得在此重申的是，如果您拥有一体机设备（也称为 MIDI 工作站），其中同时包含 MIDI 键盘和合成器，您将需要在 `Add Device` 窗口中分别将其作为键盘和乐器添加。\n\
  \n现在，让我们转到 Studio One 中的新 Song，将所有这些理论付诸实践。\n\n# 添加和配置 MIDI 乐器\n\n无论您使用的是硬件 MIDI\
  \ 设备还是软件乐器，Studio One 都能通过简化的拖放工作流程，让您非常轻松地开始录制。让我们来看看每种场景。\n\n## 添加软件乐器\n\n为录制准备虚拟乐器再简单不过了。如果您只打算使用虚拟乐器，只需遵循本节中的步骤，然后跳到下一节“输入和录制\
  \ MIDI”。\n\n因此，要添加乐器，请遵循以下步骤：\n\n1. 创建一个新 Song。\n2. 打开 `Browse` 窗口。\n3. 选择 `Instruments`\
  \ 选项卡。在这里，您将看到计算机上安装的所有虚拟乐器列表。\n4. 在此列表中，找到您想要使用的虚拟乐器。然后，将其拖动并放置到编排窗口的任意位置。\n5.\
  \ Studio One 将启动所选乐器并为其创建一个新的 Instrument Track（乐器轨道）：\n\n![Figure 6.3: An Instrument\
  \ Track](img/B31512_06_03.jpg)\n\nFigure 6.3: An Instrument Track\n\n1. 将声音加载到您的乐器中。随\
  \ Studio One 附带的虚拟乐器都有多个声音预设，可供您作为起点使用。您可以在 `Preset` 下拉菜单下找到它们。\n\n    这是随 Studio\
  \ One 附带的虚拟乐器 `Presence`，自豪地展示其预设选项：\n\n![Figure 6.4: The preset drop-down menu\
  \ in Presence](img/B31512_06_04.jpg)\n\nFigure 6.4: The preset drop-down menu in\
  \ Presence\n\n就这些！您现在已准备好使用虚拟乐器进行工作。\n\n## 添加硬件乐器\n\n将硬件乐器添加到 Song 中稍微复杂一些，但好消息是，您每个乐器只需执行一次此操作。在您的下一个项目中，您就能像虚拟乐器一样直接拖放它们了。让我们开始吧：\n\
  \n1. 创建一个新 Song。\n2. 打开 `Mix` 窗口，然后点击左侧栏中的 `External`。这将打开 `External Devices` 面板：\n\
  \n![Figure 6.5: The External Devices panel](img/B31512_06_05.jpg)\n\nFigure 6.5:\
  \ The External Devices panel\n\n1. 此面板将列出所有连接到您计算机的 MIDI 设备。找到您想要使用的那个。您会注意到，在 Figure\
  \ 6.5 中，我那可靠的 Roland XP-30 在此列表中出现了两次——第一次作为键盘，第二次作为乐器。如果您添加的设备也是这种情况，请对乐器应用以下步骤，而不是键盘。\n\
  2. 现在，点击所选乐器名称右侧的向下箭头。选择 `Edit…`，这将为您的设备打开一个编辑器窗口：\n\n![Figure 6.6: The External\
  \ Devices editor window](img/B31512_06_06.jpg)\n\nFigure 6.6: The External Devices\
  \ editor window\n\n1. 点击此窗口上的 `Outputs` 按钮（Figure 6.6 中高亮显示）。\n2. 在新的子菜单中，选择 `Add\
  \ Aux Channel`（`Aux` 代表 `auxiliary`，辅助）。这将在混音台上创建一个新的通道条，我们将用它来监听来自该设备的音频。点击新创建的辅助通道的输入部分。\n\
  3. 在这里，选择该乐器连接到的音频设备上的输入。Figure 6.7 显示了具有两个输入（标记为 `Left` 和 `Right`）的典型音频设备的可用选项。选择\
  \ `Input L+R - Front Left + Right` 可让此通道接收来自这两个输入的音频。\n\n![Figure 6.7: Setting the\
  \ input for an aux channel](img/B31512_06_07.jpg)\n\nFigure 6.7: Setting the input\
  \ for an aux channel\n\n1. 返回 `External Devices` 编辑器窗口上的 `Output` 按钮，然后点击 `Save\
  \ Default`。\n\n就这些！从现在起，将此乐器添加到项目中将像添加虚拟乐器一样简单。在 `Browse` 窗口的 `Instruments` 选项卡上，该乐器现在将列在\
  \ `External Instruments` 下：\n\n![Figure 6.8: The External Instruments section in\
  \ the Browse window](img/B31512_06_08.jpg)\n\nFigure 6.8: The External Instruments\
  \ section in the Browse window\n\n只需将乐器拖动并放置到 `Arrangement` 窗口的任意位置。您的外部乐器已准备好进行录制！\n\
  \n# 输入和录制 MIDI\n\n在 Studio One 中，有多种输入和录制 MIDI 数据的方法，每种方法都针对不同的目的进行了优化。您可以实时演奏所有内容，用鼠标输入音符，使用音序器，甚至从音频录音创建\
  \ MIDI 数据。在本节中，我们将详细介绍所有这些方法。\n\n让我们从最基本的一种开始：捕捉现场演奏。\n\n## 使用 MIDI 录制现场演奏\n\n如果您会弹键盘，哪怕只是初学者水平，将您的想法倾注到项目中的最佳方式就是老派方式——按下录制按钮并现场演奏。录制完成后，您将能够编辑您的演奏以达到完美。这消除了压力因素，让整个过程变得轻而易举。一般来说，录制现场演奏比手动输入音符要实用得多。\n\
  \n这听起来都很好，但如果您没有 MIDI 键盘怎么办？\n\n### 使用电脑键盘录制 MIDI\n\nStudio One 允许您像使用乐器键盘一样使用电脑键盘。激活此功能只需按下\
  \ `Caps Lock`。这将打开 `Qwerty Keyboard` 窗口：\n\n![Figure 6.9: The Qwerty Keyboard window\
  \ ready to generate MIDI data](img/B31512_06_09.jpg)\n\nFigure 6.9: The Qwerty Keyboard\
  \ window ready to generate MIDI data\n\n在标准 QWERTY 键盘上，第一行字母（从 `Q` 到 `P`）对应乐器键盘上的\
  \ `white` 键（白键），数字键（从 `2` 到 `0`）对应 `black` 键（黑键）。因此，例如，键盘上的 `Q` 将发出第三八度的 `C` 音，`2`\
  \ 将发出同一八度的 `C#` 音，依此类推。\n\n如果您所在的国家使用不同的键盘布局，只需使用相同的物理按键，即使它们的标签不同。例如，如果您使用土耳其 F\
  \ 键盘，请用 `F` 代替 `Q`。\n\n您可以使用左、右箭头键切换八度，并像使用延音踏板一样使用 `Tab` 键。需要一点时间适应，但如果您没有 MIDI\
  \ 键盘，或者只是想在机场等待时尝试新想法，这是一个很棒的替代方案。\n\n请记住，只要此功能处于激活状态，与这些按键关联的键盘快捷键将无法工作。\n\n###\
  \ 现场录制演练\n\n现在，让我们从“添加和配置 MIDI 乐器”部分结束的地方继续。到目前为止，您已经创建了一个新 Song 并添加了一个乐器。Studio\
  \ One 为您创建了一个 Instrument Track 供您操作：\n\n![Figure 6.10: Controls on an Instrument\
  \ Track](img/B31512_06_10.jpg)\n\nFigure 6.10: Controls on an Instrument Track\n\
  \n请遵循以下步骤在此轨道上录制：\n\n1. `Record` 按钮（Figure 6.10 中的 `a`）为轨道武装以进行录制。确保已启用（红色）。一旦您对录制满意并准备好转到另一轨道，就需要取消激活它。\n\
  2. `Monitor` 按钮（Figure 6.10 中的 `b`）充当切换开关，选择与此轨道关联的乐器的输入源。当它处于激活状态（蓝色）时，乐器将响应您的\
  \ MIDI 键盘。当它处于非激活状态（灰色）时，您将听到轨道上录制的内容。我们目前还没有录制任何内容，所以保持激活状态。\n3. 现在，尝试在您的 MIDI\
  \ 键盘或 QWERTY 键盘上弹奏几个音符。您应该能听到乐器发出的声音。\n\n\n\n\n\n4. 如果没有听到任何声音，请确保输入选择器（*图 6.10*\
  \ 中的 `c`）指向您正在使用的键盘，且输出选择器（*图 6.10* 中的 `d`）指向与此轨道关联的乐器。\n\n5. 使用节拍器录音将使您在想要添加其他乐器或编辑录音时轻松许多。按键盘上的\
  \ `C` 键激活节拍器的点击声。如果您需要 Studio One 在开始录音前进行预备拍计数，请按照*第 5 章*所述设置 `Metronome`（节拍器）、`Preroll`（预滚）和\
  \ `Precount`（预备拍）选项。\n\n6. 点击 `Record`（录音）按钮或按数字小键盘上的 `*` 键激活录音。\n\n7. 完成后，点击 `stop`（停止）按钮或按\
  \ `spacebar`（空格键）。\n\n如果您对录音感到满意，但有个别片段想重新录制，您可以使用 *第 5 章* 中描述的 `Auto Punch`（自动打孔/自动重录）功能，仅重录该部分，同时保留其他所有内容不变。\n\
  \n这就是使用 MIDI 或 QWERTY 键盘录制现场演奏所需的全部步骤。如果演奏中有几个需要修正的错误，请不用担心；您将能够使用 Studio One 强大的编辑工具将演奏编辑至完美，我们将在*第\
  \ 7 章*中介绍这些工具。\n\n### 循环录音\n\n**循环录音** 是一项便捷功能，它允许您循环歌曲的某个片段，并让 Studio One 无限期地在该片段上录音，直到您点击停止。这省去了您不断手动开始录音、停止、倒带、再开始录音的麻烦。它还能让您专注于演唱或演奏乐器。\n\
  \n在使用 MIDI 乐器时，有两种不同的循环录音模式，它们针对两个截然不同的目的而设计：`Record Takes`（录制采样/分轨录制）和 `Record\
  \ Mix`（录制混合/叠加录制）。\n\n转到顶部菜单的 `View`（视图）并选择 `Record Panel`（录音面板）以访问这些模式：\n\n![Figure\
  \ 6.11: The instrument loop record panel](img/B31512_06_11.jpg)\n\n*图 6.11：乐器循环录音面板*\n\
  \n启用 `Record Takes` 后，每当时间线到达循环末尾，它就会跳回开头。Studio One 会在同一轨道内创建一个新图层，并将您的演奏作为新的采样录制在该图层上。等到您点击停止按钮时，您将获得与您允许时间线在该片段内循环的次数相同数量的采样。\n\
  \n这非常适合尝试新想法。录音完成后，您可以从所有不同的采样中挑选最喜欢的片段，创建一个完美编辑的合成采样。您也可以利用此功能专注于演奏一段困难的乐句，直到完全掌握为止。\n\
  \n启用 `Record Mix` 后，Studio One 不会创建新图层，而是会持续在同一图层上录音，直到您点击停止。当您想逐步构建轨道时，这非常有用。例如，在创建鼓点节奏时，您可能想在第一个循环周期中演奏踩镲和军鼓，然后在第二个周期加入踩镲，在后续周期中添加其他打击乐元素，依此类推。如果您演奏得不满意，点击停止，点击\
  \ `Undo Last Loop`（撤销上一循环，也显示在*图 6.11* 中），然后重新开始。\n\n一旦您选择了想要使用的循环录音模式，请按照以下步骤开始录音：\n\
  \n1. 将左、右定位器分别设置为您想要处理的歌曲片段的开始和结束位置。\n\n2. 点击 `Loop`（循环）按钮以启用循环。\n\n3. 设置 `Metronome`（节拍器）、`Preroll`（预滚）和\
  \ `Precount`（预备拍）（参见*第 5 章*）。\n\n4. 点击 `Record`（录音）按钮或按数字小键盘上的 `*` 键激活录音。\n\n5.\
  \ 完成后，点击 `stop`（停止）按钮或按 `spacebar`（空格键）。\n\n在本节中，我们迄今为止介绍了使用 MIDI 或 QWERTY 键盘录制现场演奏的方法。现在，让我们来看看输入\
  \ MIDI 数据以供虚拟乐器使用的其他方法。\n\n## 手动输入 MIDI 音符\n\nMIDI 最酷的地方之一在于它允许您**编程**演奏，而非实际**演奏**它。这为您打开了令人惊叹的可能性之门。您可以将\
  \ MIDI 编程用于雄心勃勃的项目，例如仅用鼠标构建整个管弦乐演奏；也可以用于简单的任务，例如演奏超出您键盘演奏技巧的音乐创意。\n\nStudio One\
  \ 提供了适合各种场景的 MIDI 编程方法。您可以使用鼠标绘制 MIDI 音符，想多慢就多慢地演奏它们而无需追赶节拍器，或者使用音序器制作可在歌曲中反复使用的详细模式。在本节中，我们将详细介绍这些方法。\n\
  \n### 使用画笔工具绘制音符\n\n输入 MIDI 音符最简单的方法是使用鼠标或触控板。创建新 Song 并添加乐器后，请按照以下步骤使用此基本方法输入音符：\n\
  \n1. 在 `Arrangement`（编排）窗口中，双击乐器轨道的轨道通道。这将创建一个空的乐器片段：\n\n![Figure 6.12: An empty\
  \ instrument part next to the Instrument Track](img/B31512_06_12.jpg)\n\n*图 6.12：乐器轨道旁的空乐器片段*\n\
  \n1. 现在，双击这个新的乐器片段。它将在 `Edit`（编辑）窗口中打开。\n\n2. `Edit` 窗口有三种不同的视图选项：\n\n    * `Piano`（钢琴）视图可让您在传统的钢琴卷帘式显示器上查看\
  \ MIDI 数据，非常类似于您在任何其他 DAW 软件中看到的界面。这是我们将重点关注的视图，因为它提供了更多编程和编辑选项。\n\n    * `Drum`（鼓）视图针对鼓部件编程进行了优化。它仅显示\
  \ MIDI 音符的起始点，并为每个 MIDI 音符显示鼓组中对应部件的名称，如踩镲、军鼓、踩镲等。这是一种过时的 MIDI 处理方式，我建议不要使用此视图。我们将在*创建模式*一节中讨论一种更高效、更有趣的鼓编程方式。\n\
  \n    * `Score`（乐谱）视图允许您使用记谱法输入音符，音符排布在五线谱上。\n\n    这三种视图本质上是查看同一 MIDI 数据的三种不同方式。请继续选择适合您工作流的视图。本节介绍的步骤在所有三种视图中均可通用：\n\
  \n![Figure 6.13: The view selector in the Edit window](img/B31512_06_13.jpg)\n\n\
  *图 6.13：编辑窗口中的视图选择器*\n\n1. 确保 `Edit` 窗口处于焦点状态（当其周围出现蓝色边框时即表示聚焦），按键盘上的 `3` 选择 `Paint\
  \ tool`（画笔工具）。如果您愿意，也可以用鼠标激活它，但使用键盘快捷键能让您工作得更快。\n\n![Figure 6.14: The tool selector\
  \ in the Edit window with the Paint tool selected](img/B31512_06_14.jpg)\n\n*图 6.14：编辑窗口中的工具选择器，已选中画笔工具*\n\
  \n1. 确保 `Snap`（吸附）功能处于激活状态（在*图 6.15* 中高亮显示）。这将确保您输入的 MIDI 音符符合项目的音乐时间基准。仅当您处理自由速度的歌曲，或有意将某些音符放置在音乐网格之外时，才禁用\
  \ `Snap`。\n\n2. 现在，打开*图 6.15* 中也显示的 `Quantize`（量化）下拉菜单。此菜单列出了音乐记谱法中最常用的音符长度（菜单中的\
  \ `T` 表示三连音，`sw` 表示摇摆音符）。选择您将要输入的音符长度。例如，如果您在此选择十六分音符，则使用 `Paint tool` 输入的每个音符都将吸附到\
  \ `Edit` 窗口网格上最近的十六分音符位置，且每个音符的长度将被限制为十六分音符。\n\n\n\n\n![图 6.15：高亮显示“吸附”按钮的“量化”下拉菜单](img/B31512_06_15.jpg)\n\
  \n图 6.15：高亮显示“吸附”按钮的“量化”下拉菜单\n\n1. 在钢琴视图中，你还可以为歌曲设置音阶或调式。设置后，画笔工具将不允许你输入该调式或音阶之外的任何音符：\n\
  \n![图 6.16：钢琴视图中的音阶量化菜单，设置为 E 多利亚调式](img/B31512_06_16.jpg)\n\n图 6.16：钢琴视图中的音阶量化菜单，设置为\
  \ E 多利亚调式\n\n1. 现在，你可以使用画笔工具在编辑窗口中开始输入音符。单击一次即可输入一个时值为你在量化面板中设置的时长的音符。单击并拖动可输入更长或更短的音符。\n\
  2. 要查看你输入的每个音符的名称，请使用编辑窗口右下侧的缩放滑块。\n\n用鼠标绘制音符是输入 MIDI 数据最基本的方式。视你的音乐风格而定，这可能就是你所需要的一切，但如果你打算编写复杂的编曲，你会发现这种方法非常耗时。接下来，我们将介绍一些更高级的技巧。\n\
  \n### 步进录制\n\n通常情况下，当你录制现场演奏时，时间轴会随着项目的速度持续推进，你必须精确地跟随它。如果你试图演奏一个困难的乐句却跟不上节奏，你就得反复尝试，直到弹对为止。\n\
  \n使用步进录制，局势反转了。现在，时间轴会等待你，直到你准备好弹奏下一个音符。这对于演奏复杂的乐段非常方便。具体操作如下：\n\n1. 在编排窗口中双击乐器轨道的轨道条。这将创建一个空的乐器片段（见图\
  \ 6.12）。\n2. 双击这个新创建的乐器片段。它将在编辑窗口中打开。\n3. 点击步进录制按钮（图 6.17 中高亮显示）：\n\n![图 6.17：步进录制面板](img/B31512_06_17.jpg)\n\
  \n图 6.17：步进录制面板\n\n1. 这将打开步进录制面板。在这里，选择你想要输入的音符长度。\n2. 通过点击时间轴标尺上相应的小节号，将时间轴放置在你想要开始输入音符的位置。\n\
  3. 使用你的 MIDI 键盘，一次弹奏一个音符。每当你弹奏一个音符，时间轴就会前进一步，对应你在步进输入面板上选择的音符时值。\n\n   如果你没有 MIDI\
  \ 键盘，也可以使用电脑键盘进行步进录制。按下 Caps Lock 键以激活它。\n4. 你不仅限于弹奏单个音符；也可以弹奏和弦（多个音符）。\n5. 根据需要，使用步进输入面板上的音长选择器更改音符时值。\n\
  6. 使用步进录制面板上的“后退”和“休止”按钮，将时间轴向后移动一步（以添加音符）或向前移动一步（以插入休止符）。\n7. 完成后，别忘了点击步进录制面板上的“启用”按钮以停用步进录制。否则，你在键盘上弹奏的所有内容将继续被添加到乐器片段中。\n\
  \n步进录制是一款出色的工具，能让你从录制复杂或困难的乐段的压力中解脱出来。接下来，我们将介绍另一种 MIDI 编程方法，它在重复段落（尤其是鼓点律动）方面表现出色。\n\
  \n### 创建模式\n\n模式音序器允许你创建可在整首歌中使用的简短重复模式。虽然这种编程演奏的方法甚至比 MIDI 本身还要古老，但它经受住了时间的考验，至今仍是编程鼓点律动和旋律琶音的首选方法。\n\
  \nStudio One 让模式编程变得轻而易举。开始吧：\n\n1. 添加你想要创建模式的乐器。这里我们将添加 Impact（Studio One 自带的鼓乐器），因为该方法最常见的用途是编程鼓点律动。要添加\
  \ Impact，请在浏览窗口的“乐器”选项卡中找到它，然后将其拖放到编排窗口的任意位置。\n2. 使用其预设菜单（图 6.4）将鼓组加载到 Impact 中（或将声音加载到你添加的任何其他乐器中）。\n\
  3. 在 Studio One 的顶部菜单中，转到“事件”并点击“插入模式”。这将在你的乐器轨道上插入一个空模式。\n4. 双击新创建的模式。这将在编辑窗口中打开模式编辑器：\n\
  \n![图 6.18：模式编辑器](img/B31512_06_18.jpg)\n\n图 6.18：模式编辑器\n\n模式编辑器有两种查看模式：\n\n* 旋律模式适合编程琶音类型的序列\n\
  * 鼓模式专为编程鼓点律动而设计\n\n编辑器会根据你使用的乐器显示正确的模式，但如果你想切换到不同的查看模式，可以使用模式视图按钮（图 6.18 中的 a）来实现。\n\
  \n**重要提示**\n\n由于 Impact 是 Studio One 自带的原生乐器，它与模式编辑器紧密集成，加载到 Impact 中的每个声音的名称都会显示在编辑器界面的单独一行上。如果你将模式编辑器与第三方厂商的乐器一起使用，它将无法像这样显示名称，但除此之外，系统将正常工作。\n\
  \n模式编辑器本质上是一个矩阵。你乐器上的每个音符都显示在一行中，而小节中的每个 16 分音符则用一列表示。因此，要在小节的特定位置触发一个音符，你只需找到代表该音符的行与你想要它播放的位置的交点，然后点击它。如果不满意，再次点击同一位置即可将其移除。\n\
  \n这是一种直观的方法，让你能即时获得反馈来构建律动。只需循环播放模式，然后添加或移除音符，直到你满意为止。具体步骤如下：\n\n1. 在编排窗口中选择该模式。\n\
  2. 按 P 键在模式周围设置左、右定位点。\n3. 按小键盘上的 / 键，或点击循环按钮。\n4. 按空格键或点击播放。\n5. 在模式编辑器中添加和移除音符，直到你对模式满意为止。\n\
  6. 要用 8 分音符或 16 分音符填满整行，请使用提供的快捷键（图 6.18 中的 d）。\n\n**提示**\n\n你也可以在模式编辑器中使用步进录制。点击步进录制按钮（图\
  \ 6.18 中的 c）激活它，然后按上一节讨论的方法操作即可。\n\n叮镲滚奏和军鼓滚奏是单个鼓声的快速重复，常见于各种音乐流派。它们在模式音序器上执行起来很麻烦，但\
  \ Studio One 的模式编辑器让滚奏的实现变得简单：\n\n1. 在你想要实现滚奏的轨道上右键点击。\n\n![图 6.19：在模式编辑器中增加轨道分辨率](img/B31512_06_19.jpg)\n\
  \n图 6.19：在模式编辑器中增加轨道分辨率\n\n1. 在菜单中，点击“双倍轨道分辨率”。\n\n   默认情况下，每个轨道的一个小节被分为 16 步。点击此命令后，该轨道的分辨率将加倍，给你提供\
  \ 32 步进行操作。如果你想执行更快的滚奏，可以重复此命令，从而得到 64 步。\n2. 拖动光标穿过你想要滚奏发生的区域。\n\n使用全局模式参数（图 6.18\
  \ 中的 b）来微调律动的感觉：\n\n* “步数”允许你设置模式的长度。你可以用它来编程复杂的节奏型，例如 13/8 这样的奇数拍号。\n* “分辨率”设置每步的长度，以标准音符时值为单位。提供了三连音和附点音符的选项。\n\
  \n\n\n*   `Swing` 定义了成对步骤之间的时间关系。当其处于 `0`（默认设置）时，一对中的每个步骤持续时间相等。随着摇摆值的增加，一对中的第一个音符会变长，第二个音符会变短，从而产生“摇摆”感觉。\n\
  \n*   `Gate` 设置每个步骤的长度。在其默认值 `100%` 时，每个步骤都以完整长度播放。降低此值会使音符变短，增加则会使其变长。\n\n*   `Accent`\
  \ 设置重音音符的强调程度。你可以通过按住 `Ctrl`（Windows）或 `Cmd`（Mac）并点击音符，将任意音符设置为重音音符。\n\n你已经创建了完美的模式，但如果在整首歌中反复使用同一个模式，会变得单调乏味。你需要一种方法来创建模式的变奏，并将它们点缀在整首歌中，使其充满动感和激情。让我们开始吧：\n\
  \n1.  点击 `编辑` 窗口左上角的模式检查器按钮。这将打开模式检查器面板：\n\n![图 6.20：突出显示面板检查器按钮的模式检查器面板](img/B31512_06_20.jpg)\n\
  \n图 6.20：突出显示面板检查器按钮的模式检查器面板\n\n1.  你正在处理的模式会在此处列出，默认名称为 `Intro`。\n\n2.  点击加号形状的新建变奏按钮以创建一个空模式，或点击复制变奏按钮以创建现有模式的副本。\n\
  \n3.  通过点击新创建的模式来选中它。模式编辑器现在将显示新模式中的内容。\n\n4.  编辑新模式，创建一个用于歌曲不同部分的变奏。\n\n5.  按需创建任意数量的变奏。\n\
  \n6.  双击这些变奏的名称，为它们指定描述性的名称。\n\n7.  一旦你创建好了你的模式库，就可以将它们从模式检查器面板拖拽到 `编排` 窗口中。\n\n\
  这总结了我们对 Studio One 丰富的 MIDI 输入方法的介绍。接下来，我们将探讨一种创建 MIDI 数据的更复杂方法：将音频录音转换为 MIDI。\n\
  \n# 使用 Melodyne 将音频转换为 MIDI\n\n直到最近，将音频录音转换为 MIDI 数据还是纯粹的科幻小说。但如今，任何名副其实的 DAW 软件都在其功能列表中拥有此功能。Studio\
  \ One 捆绑了 `Melodyne`——音频音高检测和校正的行业标准，因此相比竞争对手具有优势。不过要警告的是，这项技术仍处于起步阶段。转换的成功在很大程度上取决于源素材。\n\
  \n让我们看看为了获得最佳结果可以做些什么。\n\n## 选择合适的音频素材类型\n\n音频转 MIDI 的第一步也是最关键的一步，是识别音频录音中的音高或音符。这项任务由音高检测算法执行。该算法的成功在很大程度上取决于两个因素：\n\
  \n*   音高检测最适合单音素材。*单音* 一词在不同语境下有不同含义，所以让我们澄清一下：**单音** 音频素材仅包含一条单一的旋律线（这意味着没有和弦或任何和声素材，也没有任何伴奏）。因此，例如，弹奏单音的吉他是单音源，但弹奏和弦的吉他则不是。\n\
  \n*   当素材允许算法清晰地确定音符开始的位置时，音高检测算法能产生最佳结果。从实际角度来看，这意味着连奏素材（音符相连）比断奏素材（音符分离）更具挑战性。此外，如果音频录音中的演奏包含大量滑入和滑出音符（滑音），算法将难以确定音符的音高和起始点。\n\
  \n即使你的音频素材不符合上述标准，仍有一些技巧可以尝试以从中获益。我们将在下一节介绍这些技巧。\n\n## 音频转 MIDI 演示\n\n创建一个新 Song\
  \ 后，请按照以下步骤将音频录音转换为 MIDI 数据：\n\n1.  添加你想要使用的虚拟乐器。\n\n2.  接下来，使用其 `Preset` 菜单为该乐器加载一个音色。\n\
  \n3.  找到你想要转换为 MIDI 的音频文件。将其从 `Explorer`（Windows）或 `Finder`（Mac）拖拽到 Song 中。Studio\
  \ One 将创建一个音频轨道，并将音频录音作为音频事件放置在轨道中。\n\n4.  右键点击此音频事件。在该菜单中，转到 `Audio`，然后点击 `Edit\
  \ with Melodyne`。这会将音频素材发送给 Melodyne，后者将在 `编辑` 窗口中打开：\n\n![图 6.21：突出显示音高校正宏按钮的 Melodyne](img/B31512_06_21.jpg)\n\
  \n图 6.21：突出显示音高校正宏按钮的 Melodyne\n\n请注意，Melodyne 已检测出音频录音中的所有音高，并以一种类似于 Studio One\
  \ `钢琴视图` 的布局显示它们（我们在本章前面讨论过）。我们将在 *第 8 章* 中深入探讨 Melodyne。目前，我们将仅执行一个简单操作，以确保没有走音的音符干扰音高检测算法。\n\
  \n1.  按下 `Ctrl` + `A`（Windows）或 `Cmd` + `A`（Mac）以选择所有音符。\n\n2.  点击 `音高校正宏` 按钮。这将打开一个小对话框：\n\
  \n![图 6.22：Melodyne 的音高校正宏对话框](img/B31512_06_22.jpg)\n\n图 6.22：Melodyne 的音高校正宏对话框\n\
  \n1.  将此对话框中的 `音高中心` 和 `音高漂移` 滑块全部拉到 `100 %`。点击 `OK`。\n\n    这是一种修正走音音符的粗略方法，但对于我们这里的目的完全足够。\n\
  \n2.  关闭 `编辑` 窗口。回到 `编排` 窗口，你会看到音频事件上方现在覆盖了一些彩色圆点，叠加在音频波形上。这些就是刚刚创建的 MIDI 音符。\n\n\
  3.  现在你可以将音频事件拖拽到你为虚拟乐器创建的轨道上。Studio One 会将 MIDI 数据复制到 `乐器轨道`。\n\n4.  播放工程，看看转换效果如何。很可能还需要一些手动微调。请参考\
  \ *第 9 章* 将转换后的音符编辑至完美。\n\n将音频转换为 MIDI 是一项令人兴奋的功能，它开启了无限的可能性。例如，你可以使用此过程将打击乐录音转换为创建你自己的节奏律动。随着算法的改进，它只会变得更好。\n\
  \n# 总结\n\n在本章中，我们深入探讨了 Studio One 用于录制和输入 MIDI 数据以供虚拟乐器使用的多种方法。我们涵盖了各种音乐制作场景，并讨论了针对给定工作流程的最佳方法选择，包括实时录制音符、用鼠标绘制音符或使用步进音序器编程音符。\n\
  \n到目前为止，我们专注于创作并将音乐想法倾注到项目中。在本书的下一部分，我们将讨论如何使用 Studio One 出色的编辑工具来重新加工和改进这些想法。我们将从在下一章深入探讨全局编辑工具开始，为贯穿全书的编辑最佳实践奠定基础。\n"
- "# 第 3 部分：Studio One 中的编辑\n\n\n\n# \n\n在本部分中，您将了解关于编辑录音的所有知识，达到专业标准。我们将探索 Studio\
  \ One 适用于音频和 MIDI 轨道的编辑工具，并了解如何将这些工具用于创意和修正目的。最后，我们将介绍 Studio One 的全局轨道，它允许您在全局层面上对\
  \ Song 进行更改。\n\n本部分包含以下章节：\n\n*   **第 7 章**，*编辑和重新排列您的 Song*\n*   **第 8 章**，*编辑音频*\n\
  *   **第 9 章**，*编辑 MIDI*\n*   **第 10 章**，*使用全局轨道*\n"
- '## 第 7 章：编辑和重新排列您的 Song


  在音乐制作中，**编辑**是将粗略的音乐录音精雕细琢至完美的过程。这涵盖了广泛的应用，范围从琐碎的工作到高度创造性的工作。现在的音乐制作人花在编辑上的时间比制作流程的任何其他阶段都多，精通编辑至关重要。在本书的这一部分，我们将深入探讨
  Studio One 的编辑工具，以及如何利用它们将您的项目提升到一个全新的水平。


  在本章中，我们将讨论编辑工具和模式，以及如何使用它们在 `Arrangement` 窗口中处理素材。然后，我们将探索 Studio One 的 `Arranger
  Track`，并使用它在 Song 层面编辑您的项目，以轻松执行复杂任务，例如重新排列歌曲的片段。


  在本章中，我们将涵盖以下主题：


  *   探索编辑工具

  *   理解 Snap 及各种 Snap 模式

  *   使用 `Arranger Track` 编辑歌曲

  *   使用 `Launcher` 尝试新想法


  ## 技术要求


  要学习本章，您需要在计算机上激活 Studio One。


  ## 探索编辑工具


  Studio One 有八个编辑工具，它们位于 `Arrangement` 窗口的顶部：


  ![Figure 7.1: Editing tools from left to right – `Arrow`, `Range`, `Split`, `Eraser`,
  `Paint`, `Mute`, `Bend`, and `Listen`](img/B31512_07_01.jpg)


  图 7.1：从左到右的编辑工具 – `Arrow`、`Range`、`Split`、`Eraser`、`Paint`、`Mute`、`Bend` 和 `Listen`


  您可以通过单击来激活这些工具，但如果您学习以下键盘快捷键在它们之间切换，将能提高编辑工作流的速度：


  *   `1` 激活 `Arrow` 工具

  *   `2` 激活 `Range` 工具

  *   `3` 激活 `Split` 工具

  *   `4` 激活 `Eraser` 工具

  *   `5` 激活 `Paint` 工具

  *   `6` 激活 `Mute` 工具

  *   `7` 激活 `Bend` 工具

  *   `8` 激活 `Listen` 工具


  现在，让我们深入了解一下这些工具中的每一个。


  ### Arrow 工具


  `Arrow` 工具是 Studio One 中迄今为止最常用的编辑工具，这是有充分理由的：它可用于各种任务，而其他工具则服务于非常特定的目的。


  以下是您可以使用 `Arrow` 工具执行的基本操作列表，按键盘上的 `1` 即可激活它：


  *   在 `Arrangement` 窗口中单击事件可将其选中。您可以在单击时按住 `Ctrl`/`Cmd` 键来选择多个事件。当 `Arrangement`
  窗口中有多个事件且您从顶部菜单运行命令时，Studio One 将仅对选定的事件应用该命令。

  *   双击事件可在 `Edit` 窗口中将其打开。

  *   右键单击事件将打开一个上下文菜单，其中列出了与该特定事件相关的所有可用参数和设置。

  *   单击并拖动事件可移动它。

  *   在按住 `Alt` (Windows) 或 `Option` (Mac) 键的同时单击并拖动事件可创建其副本。


  然而，`Arrow` 工具的功能远不止这些基本功能；让我们看看它能执行的更高级任务。


  #### 调整事件大小


  `Arrangement` 窗口中的**事件**是音频或 MIDI 录音的可视化表示。通常，它从录音的开头延伸到结尾：


  ![Figure 7.2: An audio event](img/B31512_07_02.jpg)


  图 7.2：一个音频事件


  图 7.2 中的事件代表一段音频录音，它从第 15 小节的开头开始，到第 23 小节的中间结束，如顶部标尺所示。假设您想修剪此事件，使其仅在第 17 小节和第
  21 小节之间播放。以下是使用 `Arrow` 工具轻松实现的方法：


  1.  将鼠标悬停在事件的左边缘。光标将变成双向箭头。

  2.  单击并向右拖动事件边缘，直到到达第 17 小节的开头。

  3.  现在，将鼠标悬停在右边缘。

  4.  单击并向左拖动，直到到达第 21 小节的开头。


  使用此方法调整事件大小是非破坏性的；它不会删除您的录音。它只是告诉 Studio One 忽略被修剪掉的部分。如果您稍后改变主意，随时可以使用 `Arrow`
  工具将事件恢复到其原始大小，或介于两者之间的任何位置。


  > **提示**

  >

  > 调整 MIDI 事件大小的方式相同。


  #### 循环事件


  您可以将任何音频或 MIDI 事件设置为在整个 Song 中循环，然后使用 `Arrow` 工具微调循环行为（即设置事件的哪一部分将被循环以及循环多长时间）。操作方法如下：


  1.  右键单击您想要循环的事件。

  2.  在事件的上下文菜单中，点击 `Loop` 复选框。事件将循环至您的 Song 末尾。

  3.  现在，转到 Song 的末尾，将鼠标悬停在循环的末端。`Arrow` 工具会瞬间变形，如图 7.3 所示。`Arrow` 工具的这一隐藏功能称为 `Looping
  tool`。


  ![Figure 7.3: The Looping tool](img/B31512_07_03.jpg)


  图 7.3：`Looping` 工具


  4.  使用 `Looping` 工具将循环的末端拖动到您想要结束的位置。


  `Looping` 工具还有更令人兴奋的功能：您可以用它来调整循环片段的长度，以尝试不同的创意可能性。例如，如果您的歌曲是 4/4 拍，并且您有一个持续一小节的节奏型，您可以使用
  `Looping` 工具将该型修剪为较短的值（例如，仅三拍）或延长为较长的值（例如，六拍）。这将使循环以不同于歌曲中其他元素的周期重复，从而产生更有趣的复节奏结构。要执行此操作，请将鼠标悬停在循环第一个片段的下端。一旦箭头变成
  `Looping` 工具，即可随心所欲地调整片段大小。


  #### 时间拉伸


  想象一下，您正在为广告制作音乐。广告代理公司告知您广告开头会有旁白，因此您准备了一段开头安静的音乐床来容纳旁白。随后，您收到了旁白录音，发现它有点太长了：


  ![Figure 7.4: The voiceover recording (the track at the top) extends beyond the
  quiet part of the music bed (the track at the bottom)](img/B31512_07_04.jpg)


  图 7.4：旁白录音（顶部轨道）超出了音乐床的安静部分（底部轨道）


  如前一节所述调整旁白录音大小在这里行不通，因为它会切掉广告语的最后一小段。我们希望能够压缩整个录音以适应所需空间。这可以通过时间拉伸来实现，而且非常容易操作。以下是使用
  `Arrow` 工具的步骤：





  ## 时间拉伸


  1. 将鼠标悬停在您想要应用时间拉伸的事件的右边缘。在我们的示例中，这将是旁白录音。


  2. 按住 `Alt` (Windows) 或 `Option` (Mac) 键。光标将变成一个带有时钟图标的箭头，如图 7.4 所示。


  3. 在不松开按键的情况下，将事件的边缘向左拖动以缩短它，或向右拖动以延长它。


  就是这么简单！如果您缩短事件，它将播放得更快。如果您延长它，它将播放得更慢。这种时间拉伸方法不会改变录音的音高，因此您的旁白演员听起来不会变成花栗鼠或达斯·维达的声音。


  近年来，时间拉伸算法有了巨大的改进，但请记住，如果您大量应用它（例如，超过事件原始大小的 20%），明显的伪影将开始出现。


  ### 应用淡入淡出


  对音频事件应用淡入淡出是音乐制作中最常见的任务之一。**淡入** 是事件开始处音量的逐渐增加。您可以用它来平滑事件开头可能存在的任何突兀声音，从而自然地进入事件。**淡出**
  是事件结束处音量的逐渐减少。它通常用于平滑地结束事件。


  应用淡入淡出很简单。抓取 **箭头** 工具并遵循以下步骤：


  1. 将鼠标悬停在您想要应用淡入淡出的事件上。您将在其左上角和右上角看到两个微小的白色三角形（如图 7.2 所示）。


  2. 要应用淡入，请点击左侧的三角形并将其向右拖动。


  3. 要应用淡出，请点击右侧的三角形并将其向左拖动。


  4. 当您拖动三角形时，音量的变化将显示为一条斜线，横跨在事件的开头或结尾。您会注意到这条线上出现了一个小白方块，如图 7.5 所示。您可以上下移动此方块，将线条变为曲线，并尝试不同的淡入淡出时机。


  ![图 7.5：淡入淡出线上的小方块允许您尝试不同的淡入淡出方案](img/B31512_07_05.jpg)


  请注意，如果您在应用淡入淡出后调整事件的大小，Studio One 会将淡入淡出随事件的开头或结尾一起移动，因此可能需要手动修正。


  ### 调整增益


  您可以调整单个音频事件的增益电平。这对于平衡不一致的音频录音的电平很有用，我们将在第 8 章中看到这一点。它也是混音音乐的重要组成部分，我们将在第 11 章中讨论。以下是如何使用
  **箭头** 工具调整增益：


  1. 将鼠标悬停在您想要更改增益的事件上。一个小方块将出现在其上边缘（如图 7.2 所示）。


  2. 向上拖动此方块以增加增益，向下拖动以减小增益。


  3. 当您拖动方块时，Studio One 将以分贝为单位显示增益变化的量。零值表示未做任何更改，正值表示增益正在增加，负值表示正在减小。


  4. 如果您想进行更精细的调整，请在拖动时按住 `Shift` 键。


  如果事件上有淡入淡出，然后您决定更改其增益，Studio One 将自动缩放淡入淡出以匹配新的增益值。


  > **提示**

  >

  > 虽然 *增益* 和 *音量* 这两个术语经常互换使用，但它们之间有一个重要的区别。**增益** 是指音频设备输入端的信号电平——在本例中是指音频轨道。更改增益会改变馈送到音频轨道上所有效果插件的电平，并会影响它们处理声音的方式。另一方面，**音量**
  是音频轨道输出端的信号电平。更改音量只会改变信号的响度，而不会影响其音色特性。


  ### 滑动编辑


  **滑动编辑** 在保持音频事件长度不变的同时，允许您在时间轴上向前或向后移动其内容。它通常与其他编辑方法结合使用，例如调整大小和时间拉伸。要对音频录音进行滑动编辑，请遵循以下步骤：


  1. 在按住鼠标于音频事件下半部分的同时，按住 `Ctrl` + `Alt` (Windows) 或 `Cmd` + `Option` (Mac) 键。光标将变成一个双向箭头。


  2. 在不松开按键的情况下，将音频事件的内容向左或向右拖动。


  请注意，您只能在事件所包含的实际录音长度范围内滑动音频事件。


  ### 选择替代工具


  有时，您可能会发现自己在 **箭头** 工具和另一个工具之间不断切换。在这种情况下，点击 **箭头** 工具图标以打开 **替代工具** 菜单：


  ![图 7.6：替代工具菜单](img/B31512_07_06.jpg)


  在这里，选择您经常使用的另一个工具。现在，当您想要切换到替代工具时，只需在键盘上按下 `Ctrl` (Windows) 或 `Cmd` (Mac) 即可。


  到目前为止，我们已经讨论了可以使用箭头工具执行的任务。现在，让我们继续介绍其他编辑工具，它们将允许您在 **编排** 窗口中直接使用鼠标与事件进行交互。您使用这些工具执行的所有操作都是非破坏性的，并且可以撤销，所以请随意尝试和探索！


  ## 范围工具


  到目前为止，我们一直使用 **箭头** 工具，它允许您操作整个事件。但如果您只想处理事件的一小部分怎么办？这就是 **范围** 工具的用武之地。此工具可让您选择音频或
  MIDI 事件内的特定区域。然后，该选定区域本身将被视为一个单独的事件。这对于仅对事件的特定部分应用命令，或剖析事件以进行进一步编辑非常有用。


  要使用 **范围** 工具，只需按键盘上的 `2` 选择它，然后拖动选择您想要的区域。您可以通过按住 `Shift` 键进行多重选择。您也可以垂直拖动以选择位于多个轨道上的多个事件上的相同区域。


  当您使用 **范围** 工具选择一个区域并双击它时，Studio One 将创建一个覆盖该区域的新事件，从而无需使用 **分割** 工具。在您想要选择并删除录音的多个部分的情况下，这是一个巨大的时间节省。


  **范围** 工具可以与 **箭头** 工具链接，创建一个具有超级功能的工具。要做到这一点，请点击 **编辑工具** 菜单左侧的括号（图 7.1）。现在，当您将光标移至事件的下半部分时，您将获得
  **箭头** 工具，而在事件的上半部分，您将拥有 **范围** 工具。这样，您就可以选择一个区域，然后像移动、复制或调整单独事件一样对其进行操作。


  ## 分割工具


  **分割** 工具将事件分割为多个事件。按键盘上的 `3` 激活它。现在，当您在 **编排** 窗口中移动鼠标时，一条垂直线将跟随光标，允许您使用标尺作为参考，精确定位您想要分割事件的位置。


  如果您选择了跨多个轨道的多个事件，用 **分割** 工具点击其中任何一个将同时在同一位置分割所有选定事件。


  ## 橡皮擦工具





  `Eraser` 工具可删除 `Arrangement` 编排窗口中的事件。只需按键盘上的 `4` 即可激活它，然后单击要删除的任何事件。您也可以拖动选择多个事件，一次性将它们删除。如果选中了多个事件，单击其中任何一个都会导致所有选中事件被删除。


  ## Paint 工具


  `Paint` 工具在 `Arrangement` 编排窗口中具有多种不同功能：


  *   通过在该轨道的音轨空白处单击并拖动，可在乐器轨道上创建一个空事件。

  *   为编曲轨道创建歌曲片段，我们将在本章后面的 *使用编曲轨道编辑* *歌曲* 一节中讨论此功能。

  *   为和弦轨道创建和弦符号，我们将在 *第 9 章* 中讨论此功能。

  *   修改自动化数据，我们将在 *第 13 章* 中看到此功能。

  *   修改音频事件的 `gain envelopes`（增益包络）。增益包络允许您精确更改事件中的增益电平，以便在必要时强调或隐藏音频录音的某些部分。要查看事件的增益包络，请右键单击它并勾选
  `Gain` `Envelope` 复选框：


  ![Figure 7.7: The Gain Envelope checkbox](img/B31512_07_07.jpg)


  图 7.7：增益包络复选框


  事件内部将出现一条白线。现在您可以使用 `Paint` 工具在这条线上添加点，以便在需要更改增益电平的位置进行调整。然后您可以上下移动这些点，根据需要增加或降低增益。


  现在，让我们仔细看看 *图 7.7*。穿过音频事件中间的白线代表该事件的增益值。最初它是一条直线，意味着事件从开始到结束以相同的增益电平播放。请注意，事件中间有一个相对安静的部分，波形较小表示。通过使用
  `Paint` 工具，您可以重绘白线以增加该部分的增益，如下所示：


  ![Figure 7.8: Using the Paint tool to redraw a gain envelope](img/B31512_07_08.jpg)


  图 7.8：使用 Paint 工具重绘增益包络


  当您以这种方式使用 `Paint` 工具修改线条时，可能会发现线条相当生硬。幸运的是，`Paint` 工具附带了多种替代绘图形状，可提供更精确、平滑的控制，帮助您获得完美的结果。单击并按住
  `Paint` 工具图标以访问这些形状：


  ![Figure 7.9: Shape options for the Paint tool](img/B31512_07_09.jpg)


  图 7.9：Paint 工具的形状选项


  默认选中的 `Freehand`（自由绘制）选项允许您自由绘制，但可能会产生颠簸的结果，如 *图 7.8* 所示。若要获得更平滑的结果，请尝试 `Line`（直线）、`Parabola`（抛物线）和
  `Transform`（变换）选项。当您想要创建周期性变化的自动化曲线或增益包络时，`Square`（方波）、`Triangle`（三角波）、`Saw`（锯齿波）和
  `Sine`（正弦波）选项非常完美。


  ## Mute 工具


  `Mute` 工具可将您单击的音频或 MIDI 事件静音。您也可以拖动选择多个事件，一次性将它们静音。如果选中了多个事件，单击其中任何一个都会导致所有选中事件被静音。


  ## Bend 工具


  `Bend` 工具用于通过添加、操作和移除 `bend markers`（弯曲标记）来对音频事件的部分进行时间拉伸。为了理解什么是弯曲标记以及它们如何工作，让我们看看这段鼓录音：


  ![Figure 7.10: A drum recording](img/B31512_07_10.jpg)


  图 7.10：鼓录音


  *图 7.10* 中波形的尖峰是军鼓击打声。它本应正好落在第一小节的第二拍上（标尺上显示为 `1.2`），但鼓手稍微晚了一点。幸运的是，我们可以通过使用弯曲标记轻松修复此问题。操作方法如下：


  1.  右键单击事件并勾选 `Bend` `Marker` 复选框：


  ![Figure 7.11: The Bend Marker checkbox](img/B31512_07_11.jpg)


  图 7.11：弯曲标记复选框


  1.  按键盘上的 `7` 激活 `Bend` 工具。

  2.  现在，通过单击事件添加三个弯曲标记：一个在军鼓击打前的空白处，一个在击打后的空白处，一个正好在击打开始处，如下所示：


  ![Figure 7.12: Bend markers inserted at and around a drum hit](img/B31512_07_12.jpg)


  图 7.12：在鼓击打处及周围插入的弯曲标记


  1.  现在您可以拖动军鼓击打开始处的弯曲标记，将其移至正确位置。我们之所以在击打前后的空白处添加标记，是因为我们不想移动事件中的其他任何内容。此处应用的任何时间拉伸都将限制在这些额外弯曲标记之间的区域内。


  我们将在 *第 8 章* 中详细讨论音频弯曲。


  ## Listen 工具


  `Listen` 工具可让您试听单个音频或 MIDI 事件的特定部分。按键盘上的 `8` 激活它，然后单击并按住事件。Studio One 将把该事件关联的轨道独奏，并从您单击的位置开始播放。播放将持续到您松开鼠标按钮为止。此工具可用于即时试听事件内容，尤其是在大型项目中。


  至此，我们已完成对 Studio One 编辑工具的介绍。接下来，我们将讨论吸附功能，这是一项至关重要的功能，必须正确设置才能在编辑歌曲时获得最佳结果。


  # 理解吸附及各种吸附模式


  编辑音乐是一个需要精确度的繁琐过程。我们不能只是拖动事件并希望它落在正确的位置。Studio One 通过使用 `Snap`（吸附）功能帮助我们克服这一问题，这是一种自动对齐功能，可确保我们执行的任何编辑操作都能与音乐网格或其他事件完美对齐。


  吸附会影响上一节讨论的所有编辑工具的行为。因此，当您使用 `Arrow`（箭头）工具移动事件、使用 `Range`（范围）工具选择区域或使用 `Split`（分割）工具分割事件时，`Snap`（吸附）都会自动对齐这些操作。


  吸附默认处于激活状态，大多数情况下您都希望保持这种状态。如果您需要进行一些不需要与任何内容对齐的微小外科手术式编辑（例如移除呼吸声），可以通过按键盘上的 `N`
  或使用 `Snap`（吸附）切换按钮来关闭吸附：


  ![Figure 7.13: The Snap options – the Snap toggle button is on the far right](img/B31512_07_13.jpg)


  图 7.13：吸附选项——最右侧是吸附切换按钮


  吸附功能有多种模式，可适应各种使用场景。这些模式可通过 *图 7.13* 中的 `Snap`（吸附）下拉菜单访问和选择。现在，让我们仔细了解一下这些模式。


  ## 吸附到网格


  在典型的音乐制作工作流程中，您希望所有编辑操作都与音乐上有意义的时间点对齐：小节、拍子或各种音符长度。`Snap To Grid`（吸附到网格）选项正是执行此操作：它在
  `Arrangement`（编排）窗口上叠加一个网格，并确保您执行的任何编辑操作都精确吸附到该网格。


  要在此模式下工作，请打开 *图 7.13* 中的 `Snap`（吸附）下拉菜单并选择 `Snap To Grid`（吸附到网格）。在同一菜单上，使用以下选项设置网格的灵敏度：


  *   `Adaptive`（自适应）会根据您的缩放级别动态更改网格的分辨率。如果您完全缩小，只能吸附到小节的开头。随着您放大，您将能够吸附到小节内的拍子，然后是八分音符、十六分音符，依此类推。






  ## Snap 选项详解


  ### Bar 与 Quantize


  *   **`Bar`** 将网格限制在小节的起始位置。如果你想要放大查看但限制编辑操作，使其仅吸附到小节的开头，请选择此选项。


  *   **`Quantize`** 允许你为吸附网格设置特定的音符长度值，而不受缩放级别影响。例如，如果你希望所有内容都吸附到八分音符，请在此处选择 **`Quantize`**
  选项，然后在 *Figure 7.13* 的 **`Quantize`** 下拉菜单中选择 **`1/8`**。


  接下来，让我们看看 **`Snap to Grid`** 的一个变体 —— **`Relative Grid`**。


  ## Relative Grid


  **`Relative Grid`** 是 **`Snap To Grid`** 的一个变体，具有更具体的应用场景。假设你有一个事件开始于小节线之前：


  ![Figure 7.14: An event that starts before the beginning of a bar](img/B31512_07_14.jpg)


  Figure 7.14: An event that starts before the beginning of a bar


  *Figure 7.14* 中的事件开始于第 3 小节稍前。它在视觉上未对齐，但有时这在音乐上讲得通，你可能想保持这种状态。现在，假设你决定在歌曲开头添加一个新段落。为了给该段落腾出空间，你想将所有内容在时间上向前移动四小节。这意味着将该事件移动到第
  7 小节。如果选择了 **`Snap To Grid`**，当你移动此事件时，它将吸附到第 7 小节的开头，这不是我们想要的。我们希望它开始于第 7 小节稍前的位置，就像它在第
  3 小节时那样。换句话说，我们想要在保持事件相对于小节网格起始位置的相对位置不变的情况下移动它。要做到这一点，只需选择 **`Relative Grid`**
  并将其拖动到第 7 小节。它将吸附到相对于该新小节的确切相对位置。


  将事件吸附到音乐网格是大多数音乐制作工作所需的全部功能，但对于音频后期制作的其他领域（如编辑对白或处理音效），音乐网格变得无关紧要。幸运的是，**`Snap`**
  功能拥有许多其他模式，通过协助我们在这些领域工作，使生活更轻松。


  ## Snap To Cursor & Loop


  选择 **`Snap To Cursor & Loop`** 后，时间轴上的光标和标尺上的循环指示器将变得具有磁性。你在其附近执行的任何操作都将吸附到它们。这对于在项目的特定点工作非常有用：只需选择此模式，将光标放置在该点，然后尽情编辑，确信所有内容都将完美对齐到该点。


  此模式不如 **`Snap To Grid`** 刚性。它也允许你在其他点拖动或分割对象。只有当你在光标和循环定位器附近工作时，才会注意到它们的磁性吸引力。


  此模式可以与 **`Snap To Grid`** 或 **`Relative Grid`** 模式同时激活，因此如果你正在处理非音乐项目，请务必取消选择那些模式。


  ## Snap To Events


  **`Snap To Events`** 允许 **`Arrangement`** 窗口中的事件相互吸附。假设你在轨道 1 上有一个事件，它恰好开始于你想要的位置。现在，你在轨道
  2 上添加另一个事件，并希望这个新事件与轨道 1 上的事件在完全相同的时刻开始。选择 **`Snap To Events`** 后，当你拖动轨道 2 上的新事件时，它将精确吸附到轨道
  1 上事件的开头。


  ## Snap Event End


  通常，当你拖动事件时，**`Snap`** 功能会根据所选模式将其开头对齐到规定的点。启用此选项后，你也可以将事件的结尾吸附到可用的吸附位置。


  ## Snap To Zero Crossings


  如果你双击音频事件在 **`Edit`** 窗口中打开它，然后极度放大，你会看到它围绕一条水平线振荡：


  ![Figure 7.15: Close view of an audio waveform](img/B31512_07_15.jpg)


  Figure 7.15: Close view of an audio waveform


  这基本上是扬声器锥体播放该音频素材时运动方式的可视化表示。将水平线视为锥体的静止位置。线以上意味着锥体向前运动，线以下表示其向后拉回。


  如果你使用 **`Split`** 工具或 **`Arrow`** 工具修剪在随机点切割此波形，这将打断扬声器锥体的平滑运动，导致可听的伪影，称为“爆音”。启用
  **`Snap To Zero Crossings`** 可确保你执行的任何编辑都将吸附到波形穿过水平线的最近点。这些点称为 **`zero crossings`**。在这些点上，扬声器锥体将处于静止位置，不会产生爆音。


  始终保留此选项启用。它会导致编辑位置轻微偏移，但仅在毫秒级范围内，不会被察觉。


  到目前为止，在本章中我们已经介绍了 Studio One 的编辑工具和 **`Snap`** 选项。掌握这些信息后，你现在已准备好在 **`Arrangement`**
  窗口中处理任何编辑任务。然而，随着项目的增长，处理分布在多个轨道上的大量事件可能会变得难以应付，可能需要一些额外的帮助。幸运的是，Studio One 有一个专为此目的设计的工具，我们将在下一节学习如何使用它。


  # 使用 Arranger Track 编辑歌曲


  一首乐曲通常包含多个段落。根据流派不同，一个段落可能是交响乐中的乐章、爵士编曲中的主题、流行歌曲中的副歌，或 EDM 曲目中的 Drop。


  创作乐曲时，我们几乎从不知道它将包含多少段落以及它们的顺序。随着歌曲的发展和这些段落的演变，我们可能想尝试通过打乱段落顺序来实验歌曲的结构。有时，这成为一种必要；例如，客户可能要求我们交付歌曲的多个版本
  —— 一个适合电台播放的短版本、一个较长的专辑版本，甚至一个更长的俱乐部版本。


  所有这些场景都需要在项目中打乱大量音频和 MIDI 事件。这是一项潜在混乱且极易出错的任务。Studio One 的 **`Arranger Track`**
  是一项旨在轻松且非破坏性地移动、复制、删除或以其他方式操作歌曲整个段落的功能，在处理大型项目时尤为救命。


  要使用 Arranger Track，请执行以下步骤：


  1.  点击 **`Global Track Visibility`** 按钮并选择 **`Arranger`**。这将使 Arranger Track 可见。

  2.  按键盘上的 *`5`* 选择 **`Paint`** 工具。

  3.  如果 **`Snap`** 尚未激活，请按键盘上的 *`N`* 启用它。

  4.  在 Arranger Track 上点击并拖动 **`Paint`** 工具，以覆盖你想要定义为段落的每个区域。根据需要添加任意数量的段落。以下是一个在
  Arranger Track 上创建了多个段落的示例项目：


  ![Figure 7.16: Several sections of a song marked on an Arranger Track](img/B31512_07_16.jpg)


  Figure 7.16: Several sections of a song marked on an Arranger Track


  5.  添加新段落时，Studio One 会自动为其命名和着色。右键点击段落以根据需要更改其名称和颜色。

  6.  现在你可以使用 **`Arrow`** 工具在 Arranger Track 上移动或复制段落。这些段落中包含的所有事件都将随之移动。请记住，复制事件的快捷方式是在拖动时按住
  *`Alt`* / *`Option`* 键。

  7.  要从歌曲中删除一个段落及其包含的所有事件，请右键点击它并在弹出菜单中选择 **`Delete Range`**。





  注意，当您使用 `Arranger Track` 复制片段时，这些副本会成为独立的实体，因此您可以单独处理每一个副本，以基于原始素材创建变体。


  # 使用 Launcher 尝试新想法


  `Launcher` 是 `Arrange` 窗口的伴侣。它允许您尝试不同的想法并塑造您的音乐，而不会弄乱现有的编排。如果您来自另一款优秀的 DAW 软件 Ableton
  Live，您可以将 Launcher 视为 `Session` 视图。对于其他所有人来说，这将是一个彻底的范式转变，所以让我们直接开始吧。


  一旦您在歌曲上工作了一段时间并已就位基本元素，您通常会开始考虑如何组合这些元素——从前奏开始，您将拥有轨道 A、B 和 C，然后进入主歌部分，您将添加轨道 D、E
  和 F，依此类推。通常，我们在 `Arrange` 窗口中以线性方式排列这些轨道，歌曲的开头在左侧，结尾在右侧。而 Launcher 则允许您以任何您想要的方式组合这些轨道。具体方法如下：


  1. 通过点击其图标（*Figure 7.17* 中的 *a*）打开 `Launcher`：


  ![Figure 7.17: The Launcher](img/B31512_07_17.jpg)


  图 7.17：Launcher


  2. 现在，您可以将 `Arrange` 窗口中的任何元素拖放到 Launcher 中。如果您已经在 `Arranger Track` 上标记了歌曲的片段，正如我们在前一节讨论的那样，您也可以直接拖放这些片段。


  3. 有趣的部分来了：您可以在不更改 `Arrange` 窗口中任何内容的情况下，在 Launcher 中随意调整元素顺序。这使您能够在歌曲中尝试完全不同的组合，而原始编排保持完好。


  4. 分隔 Launcher 和 `Arrange` 窗口边框上的箭头（*Figure 7.17* 中的 *b*）决定了点击播放按钮时会发生什么。如果某轨道的箭头指向左侧，该轨道将播放
  `Arrange` 窗口上的内容。如果箭头指向右侧，它将从 Launcher 播放。这使您能够结合两个窗口的想法。


  5. 乐趣不止于此！Launcher 拥有自己的 `Playlist`，可通过点击其右上角的图标（*Figure 7.17* 中的 *c*）访问。


  6. 打开 `Playlist` 窗口后，您将看到迄今为止您一直在处理的歌曲片段被列为 `Scenes`（*Figure 7.18* 中的 *a*）。将这些 Scene
  拖放到该窗口上半部分标题为 `Playlist 1` 的区域。在这里，您只需更改播放列表上的顺序即可调整歌曲片段的顺序。这比在 `Arrange` 窗口中复制粘贴容易得多，对吧？


  ![Figure 7.18: The Playlist section of the Launcher](img/B31512_07_18.jpg)


  图 7.18：Launcher 的 Playlist 部分


  7. 对新编排满意后，点击 `Playlist` 窗口上的小向下箭头（*Figure 7.18* 中的 *b*）。


  8. 点击 `Insert Playlist into Song`。这将打开一个对话框（*Figure 7.19*）。


  ![Figure 7.19: The Insert Playlist into Song dialog box](img/B31512_07_19.jpg)


  图 7.19：Insert Playlist into Song 对话框


  9. 在这里，在 `Mode` 下拉菜单中选择 `Replace` 选项，将 Launcher 中的内容插入 `Arrangement` 窗口。如果您仍想保留原始编排，请转到顶部菜单的
  `File`，选择 `Save As`，并为此歌曲指定一个不同的名称。


  此方法允许您创建任意数量的不同版本的歌曲——创建专辑版、较短的电台友好版、延长的俱乐部版，无论您喜欢什么。


  在本节中，我们学习了如何利用 Studio One 中 Launcher 这一新功能的强大功能，轻松更改歌曲的编排。这结束了我们对 Studio One 编辑工具的介绍。


  # 总结


  在本章中，我们深入探讨了 Studio One 的编辑工具，并学习了如何在 `Arrangement` 窗口中使用它们。我们还讨论了 Snap 和 `Arranger
  Track`，这两个关键功能与这些工具协同工作，使编辑变得更加容易。


  在下一章中，我们将深入探讨音频编辑，学习如何修正时序问题、修复走调的人声，甚至从现有录音中创建和声音轨。


  # 第 8 章

  '
- "## 编辑音频\n\n这是音乐制作令人兴奋的时代。如今，在一个普通的家庭工作室里，我们可以做到过去几十年里最大牌的制作人只能梦想的事情。\n\n人声走调？鼓轨时序松散？邻居决定在吉他独奏时割草？没问题！这些都能在几秒钟内修复，且不会产生任何显著伪影。修复录音错误的能力本身就是一个游戏规则改变者，但这只是开始。操控音频录音的能力为无限创意打开了大门——改变现有鼓轨的律动、从单个人声录音创建背景和声、从单一乐器创建乐器合奏。唯一的限制是您的想象力。\n\
  \n在本章中，我们将深入探讨 Studio One 令人印象深刻的音频编辑功能，并学习如何使用它们来修复错误和进行创意制作。我们将涵盖以下主题：\n\n* 掌握音频编辑工具\n\
  * 修复和增强音频录音的时序\n* 使用 Melodyne 修复和增强人声录音\n* 使用干声分离隔离音频事件\n\n# 技术要求\n\n要学习本章内容，您需要在计算机上激活\
  \ Studio One。\n\n如果您对修复走调素材或创建和声感兴趣，还需要在计算机上安装并激活 `Melodyne`。Melodyne Essential\
  \ 随 Studio One 捆绑提供。您只需使用 [my.presonus.com](http://my.presonus.com) 上 `Products`\
  \ 选项卡上的许可证密钥安装并激活它，我们在 *Chapter 2* 中讨论过这一点。\n\n# 掌握音频编辑工具\n\nStudio One 拥有令人印象深刻的音频编辑工具列表，庞大的可用选项数量乍看之下可能令人望而生畏。然而，这些工具仅由两个算法驱动。`pitch\
  \ detection algorithm`（音高检测算法）告诉 Studio One 音频录音中演奏了哪些音符，而 `transient detection\
  \ algorithm`（瞬态检测算法）告诉它这些音符何时被演奏。编辑工具利用这些算法对音频素材做出明智决策，并精确执行自动化任务。\n\n在本节中，我们将介绍最常用的编辑工具。这些是您在几乎所有涉及音频的项目中都需要的工具。然后，我们将讨论如何利用其他不太常见但同样令人兴奋的工具的强大功能，以便您也能将它们集成到工作流程中。\n\
  \n## 转调和调音音频事件\n\n`Transposing`（转调）和 `tuning`（调音）允许您在不改变音频事件时序的情况下改变其音高。\n\n转调音频事件会以半音为单位改变其音高。例如，如果您有一个\
  \ C 大调的吉他循环，但您的歌曲是 D 大调，您可以将循环上移两个半音以匹配歌曲的调性。\n\n而调音音频事件则以分为单位改变其音高。一百分等于一个半音，因此调音是一种更微妙的改变音高的方法。例如，如果您有一段乐器录音略微走调且偏低，您可以使用此功能升高其音高，直到完全准确。\n\
  \n现在，让我们看看如何转调或调音音频事件。右键点击您想要转调或调音的音频事件：\n\n\n\n## 静音剪除\n\n![图 8.1：音频事件上下文菜单上的“转调”和“微调”字段](img/B31512_08_01.jpg)\n\
  \n在上下文菜单的各个字段中，你需要使用 `Transpose` 和 `Tune` 字段：\n\n*   `Transpose` 字段接受 `-24` 到 `+24`\
  \ 半音之间的值，允许你向上或向下转调多达两个八度。尽管移调算法在过去几年中有了巨大发展，但它们仍有局限性。将任何音频向上或向下转调超过五个半音，最好留作实验性和创意性用途。\n\
  *   `Tune` 字段接受 `-100` 到 `+100` 音分之间的值。\n\n`Transpose` 和 `Tune` 是非破坏性操作。你可以随时返回此菜单，将这些值切换回零。录音将以原始音高播放。\n\
  \n`Transpose` 和 `Tune` 命令也可以同时应用于多个音频事件。只需选择你想要微调或转调的事件，然后右键单击其中任意一个。你在 `Transpose`\
  \ 或 `Tune` 字段中输入的值将应用于所有选定事件。\n\n通常，音频录音会在乐句之间包含静音间隙。然而，由于我们大多数人在非理想环境下操作，这些间隙可能不包含真正的静音——它们可能被耳机漏音、电脑风扇噪音或其他进入麦克风的背景声音填充。\n\
  \n即使这些不需要的声音相对无害，它们随着一遍遍的录制堆积起来，会导致混音师所谓的混音中的 `mud`（浑浊感）。因此，移除这些间隙以清理音频轨道是常见做法。\n\
  \n我们当然可以拿起分割工具，剪掉这些间隙并手动删除，但在包含多条繁忙轨道的大型项目中，这将花费漫长的时间，而我们有更有意义的事情要做。谢天谢地，有一种快速高效的方法可以自动清理音频轨道或事件。\n\
  \n`Strip Silence`（静音剪除）命令会分析选定的音频事件并自动移除静音间隙。执行该命令很简单，只需右键单击事件并在弹出菜单中选择 `Strip Silence`。不过，通常需要一些微调才能获得最佳结果。操作步骤如下：\n\
  \n1.  点击 `Strip Silence` 按钮。这将打开 `Strip Silence` 菜单：\n\n![图 8.2：静音剪除按钮和菜单](img/B31512_08_02.jpg)\n\
  \n2.  使用 `Detection`（检测）下拉菜单，告诉算法你的录音素材情况，以便它自动设置最佳参数：\n    *   如果录音包含清晰、明确的声音元素（如鼓点），且周围是静音区域，请选择\
  \ `Lots of Silence`（大量静音）。\n    *   如果素材相对繁忙但仍包含一些静音区域，请选择 `Little Silence`（少量静音）。\n\
  \    *   如果录音中没有真正的静音，且你想消除背景噪音，请选择 `Noise Floor`（噪音底）。\n\n    此处列出的选项绝非截然分明，所以请随意选择一个选项看看效果如何。此操作是非破坏性的，如果你对结果不满意，可以通过输入\
  \ `Ctrl` + `Z` (Windows) 或 `Cmd` + `Z` (Mac) 使用撤销命令来撤销。\n\n3.  如果上述选项不起作用，请在 `Detection`\
  \ 下拉菜单中选择 `Manual`（手动）。这将激活 `Open Threshold`（开启阈值）设置，允许你以分贝为单位手动设置静音阈值。录音中低于此阈值的所有区域将被视为静音并被剪除。\n\
  \n4.  某些录音素材（如鼓点）衰减得非常快，会在几毫秒内降至阈值以下。这会导致声音的尾音被切掉，正如你在军鼓击打中看到的那样：\n\n![图 8.3：被静音剪除命令切掉尾音的军鼓击打](img/B31512_08_03.jpg)\n\
  \n发生这种情况时，使用 `Minimum Length`（最小长度）滑块为剪辑部分设置更长的持续时间。这会覆盖阈值设置，因此即使素材在你在此设置的时长内降至阈值以下，也不会被剪除。\n\
  \n5.  通常，`Strip Silence` 命令会尽可能紧凑地修剪，素材一超过阈值就立即剪入，一低于阈值就立即剪出。如果你想在剪辑前后保留一些额外空间，请分别使用\
  \ `Pre-Roll`（前滚）和 `Post-Roll`（后滚）设置。\n\n6.  如果你在执行 `Strip Silence` 命令后听到任何点击声或其他伪影，请点击\
  \ `Pre-Roll` 和 `Post-Roll` 字段右侧的链接图标，如图 8.2 所示。这将激活 `Fade In`（淡入）和 `Fade Out`（淡出）选项。在这里，你可以手动设置时间值（以毫秒为单位），为\
  \ `Strip Silence` 功能创建的每个事件添加淡入淡出。\n\n7.  完成后，点击 `Apply`（应用）按钮，使用你刚才设置的参数执行 `Strip\
  \ Silence` 命令。\n\n接下来，我们将学习如何使用一项音频编辑功能，它将真正让你的演绎更上一层楼。\n\n## 从多个层创建完美录音\n\n在第 5\
  \ 章中，我们讨论了循环录音，并提到它是一个很棒的工具，可以通过从几次不同的录音中选择最佳部分来创建完美的复合演绎。凭借我们对所掌握的音频编辑工具的深入了解，我们现在准备好处理这项任务了。注意，这个过程有时被称为\
  \ `comping`，是 compositing（合成/拼接）的缩写。\n\n一旦你按照第 5 章中的描述执行了循环录音，该录音的轨道标题将显示一个图标，上面堆叠着三条线，如图\
  \ 8.4 高亮显示。点击它，轨道将展开以显示你录制的录音。\n\n![图 8.4：包含四个不同录音的音频轨道](img/B31512_08_04.jpg)\n\
  \n图 8.4 显示了人声录音的四个不同录音。在 Studio One 的循环录音模式下，歌手被要求反复演唱同一句歌词。我在四次录音后停止了录制。这些录音现在显示在轨道标题下方，标记为\
  \ `Take 1`、`Take 2`，依此类推。\n\n从这些录音中拼接出完美演绎简单得不能再简单了。让我们开始吧：\n\n1.  按键盘上的 `8` 获取\
  \ `Listen`（试听）工具。用它来比较不同录音中同一乐句的表现。\n2.  一旦选定你最喜欢的乐句，按键盘上的 `1`。你会注意到光标不再是普通的 `Arrow`（箭头）工具，而变成了一个称为\
  \ `Comping`（拼接）工具的括号形状。\n3.  将 `Comping` 工具拖过你最喜欢的乐句。你选择的区域将被 `promoted`（提升）到顶部，紧邻轨道标题。下次播放歌曲时，你将听到这一部分。\n\
  4.  重复步骤 1 到 3，将所有你最喜欢的乐句提升到顶部。\n\n图 8.5 显示了与图 8.4 相同的录音，但在其中我已跨不同录音选择并提升了每个我最喜欢的乐句。\n\
  \n![图 8.5：包含多个拼接录音的音频轨道](img/B31512_08_05.jpg)\n\n就这么简单！你刚刚从几个不同的录音中创建了完美演绎。现在，让我们继续了解其他音频编辑工具，看看如何有效地发挥它们的威力。\n\
  \n## 高效使用编辑命令\n\n\n\nStudio One 在右键菜单中提供了大量的编辑命令，可以通过右键点击音频事件来访问。当你浏览此菜单时，可能会被海量的可用命令弄得眼花缭乱，并纳闷自己如何才能学会使用它们所有。\n\
  \n当你开始将其视为一个供你调用的选项和命令列表时，这个菜单就不再那么令人生畏了。它向你展示了可以对音频事件执行的所有操作。根据你的制作风格和工作流，在一个阶段中，你最终会多次使用其中一些命令，一些不太常用，还有一些则完全用不上。\n\
  \n让我们以 `Fade In to Cursor`（淡入至光标）命令为例：\n\n![Figure 8.6: The contextual menu for\
  \ audio events](img/B31512_08_06.jpg)\n\nFigure 8.6: 音频事件的右键菜单\n\n该命令的标题不言自明。它会从事件的开始处创建一个淡入，一直延伸到光标当前的位置。在图\
  \ 8.4 中，我的音频事件从小节 2 开始。我的光标位于小节 3。因此，当我执行此命令时，将获得一个从小节 2 开始、在小节 3 结束的淡入效果。\n\n但为什么要费劲在菜单深处寻找这个命令来执行一个简单的淡入呢？正如我们在\
  \ 第 7 章 中所见，创建淡入淡出只需点击事件左上角的小三角形并向右拖动即可。\n\n然而，如果你从事音频后期制作工作，且在每个阶段都需要制作大量淡入，则可以通过为此命令分配键盘快捷键、选择多个事件，然后仅按键盘上的一个键即可为所有事件应用淡入，从而节省大量时间。这就是\
  \ `Fade In to Cursor` 命令真正大放异彩的时候。\n\n右键菜单中所有可用命令皆是如此。如果你发现某个命令会经常用到，请按如下方式为其分配键盘快捷键：\n\
  \n1. 在顶部菜单中，依次转到 `Studio One` 和 `Keyboard Shortcuts`（键盘快捷键）。这将打开 `Preferences`（偏好设置）窗口的\
  \ `Keyboard Shortcuts` 选项卡：\n\n![Figure 8.7: The Keyboard Shortcuts tab of the Preferences\
  \ window](img/B31512_08_07.jpg)\n\nFigure 8.7: 偏好设置窗口的键盘快捷键选项卡\n\n1. 在 `Search`（搜索）框中，开始输入你想要分配快捷键的命令名称。\n\
  \n2. 在命令列表中选择该命令。\n\n3. 点击 `Enter Key`（按键输入）字段，输入你想用作该命令快捷键的字母。你可以使用数字和字母，也可以添加修饰键，例如\
  \ `Shift`、`Ctrl`/`Cmd` 和 `Alt`/`Option`。\n\n4. 如果你输入的按键已被用作另一个命令的快捷键，Studio One\
  \ 会发出警告。然后，尝试不同的按键组合。\n\n5. 点击 `Assign`（分配），然后点击 `OK`。\n\n选择你可能经常使用的命令，并以这种方式将它们绑定到键盘快捷键，将加快你的工作流，帮助你更高效地使用得心应手的工具。基本的音频编辑工具介绍完毕，我们现在准备好去探索更高级的音频操作方法和工具了。\n\
  \n# 修正和增强音频录音的时序\n\n你录制了一段精彩的演唱，但歌手在演唱几个词时拍子拖后了。你知道可以使用重录模式再次录制仅那些词，但歌手已经脱离了状态，根本无法再现那种神奇的表现力。又或者，你借了朋友的尤克里琴，在随意弹奏时灵光一现，想出了一个很棒的主意。你肯定想录下来并使用它，但你知道自己的时序会不稳，因为你对这件乐器还很生疏。\n\
  \n在音乐制作中，总会遇到这类需要修正音频录音时序的情况。Studio One 让这项任务变得极其容易实现。在本节中，我们将深入探讨这项功能背后的技术，以及如何利用它来修正时序错误，并发挥其创造性的威力。\n\
  \n## 理解瞬态\n\n假设我们有一段鼓录音，其中存在时序错误。为了修正这些错误，我们必须想办法知道鼓手何时击打了鼓组。这其实没有听起来那么难。请看看这两个音频事件：\n\
  \n![Figure 8.8: A project with a drum track (top) and a violin track (bottom)](img/B31512_08_08.jpg)\n\
  \nFigure 8.8: 包含鼓轨道（上）和小提琴轨道（下）的工程\n\n在图 8.8 中，上方的轨道是一段鼓录音。每一次击鼓在波形中都清晰地表现为突然的尖峰。这些尖峰被称为**瞬态**。Studio\
  \ One 拥有一个瞬态检测算法，它会分析音频事件，并在检测到瞬态的点位放置**弯曲标记**。然后，你可以拖动这些标记来手动移动击鼓点的时间位置，甚至可以让 Studio\
  \ One 自动修正它们。由于 Studio One 知道每一次击打应该落在何处（如图 8.8 顶部的时间轴标尺所示），修正这些击打的位置也不像听起来那么难。这只是一个将弯曲标记与标尺上布置的网格对齐的问题。稍后我们将在“自动量化音频以修正时序错误”部分看到如何操作。\n\
  \n这听起来像魔法，对于挽救有时序错误的轨道来说，这无疑是一个福音。然而，事物总有两面性——图 8.8 下半部分的轨道是一段连奏风格的小提琴录音——即用一次弓子运动连接演奏多个音符。对于这种素材，瞬态检测算法很难判断一个音符何时结束、下一个音符何时开始。对于包含长延音的演唱录音也是如此。在这种情况下，即使你手动放置标记，音频弯曲也无法按预期工作，并可能引入可听的伪影。\n\
  \n由此可知，瞬态检测和音频弯曲的成功在很大程度上取决于素材本身。具有清晰、独特瞬态的音频录音将产生好得多的结果。牢记这一点，我们现在可以更仔细地研究如何在项目中使用这项技术。\n\
  \n## 使用 Audio Bend 工具手动修正错误\n\n`Audio Bend` 是 Studio One 中用于检测和操控瞬态的算法。我们通过 `Bend`（弯曲）工具与\
  \ Audio Bend 进行交互。学习该工具工作原理的最佳方法是手动使用它来修正一个时序错误。找一段包含时序错误的音频录音，比如我们在图 7.9 中看到的那段。\n\
  \n最好从一段具有清晰、独特瞬态的录音开始，例如鼓或打击乐。然后，请遵循以下步骤：\n\n1. 在 `Arrangement`（编排）窗口中，双击你想要处理的音频事件。这将在\
  \ `Edit`（编辑）窗口中打开该事件。该窗口拥有与 `Arrangement` 窗口相同的工具和按钮，但允许你专注于单个事件。这就像将事件置于显微镜下观察。\n\
  \n2. 点击 `Edit` 窗口上的 `Audio Bend` 按钮。这将打开 Audio Bend 菜单：\n\n![Figure 8.9: The Audio\
  \ Bend button and Audio Bend menu](img/B31512_08_09.jpg)\n\nFigure 8.9: Audio Bend\
  \ 按钮和 Audio Bend 菜单\n\n1. 点击 `Analyze`（分析）按钮。Studio One 将分析录音，并在检测到瞬态的位置放置弯曲标记。\n\
  \n\n\n# 音频编辑：弯曲标记与量化\n\n## 调整弯曲标记阈值\n\n仔细观察 `Edit` 窗口中的波形。所有瞬态上都有弯曲标记吗？算法有没有漏掉一些？有没有在不该放置的地方放了标记？通常，算法能很好地自动放置标记，但如果你发现标记太少或太多，请使用\
  \ `Threshold` 滑块来调整检测灵敏度。增加阈值会使算法更敏感，从而产生更多标记。降低阈值会导致标记减少。调整阈值，直到所有瞬态都被标记且没有多余标记。请参考以下示例：\n\
  \n![Figure 8.10: A comparison of various threshold settings](img/B31512_08_10.jpg)\n\
  \n**图 8.10：各种阈值设置的对比**\n\n图 8.10 并排对比了应用于同一音频录音的不同 `Threshold` 设置：\n\n- 在 **a**\
  \ 中，阈值设置过高，使算法过于敏感。这导致出现了太多不必要的弯曲标记。\n- 在 **b** 中，阈值设置过低。这导致算法漏掉了本应被标记的较小瞬态。\n-\
  \ 然而，**c** 是该素材的理想设置；所有瞬态均被检测到，且没有多余标记。\n\n## 使用弯曲工具\n\n1. 按键盘上的 `7` 选择 `Bend` 工具。\n\
  2. 如果算法未检测到你想要处理的瞬态，你可以使用 `Bend` 工具点击瞬态的起始位置来手动添加弯曲标记。\n3. 然后，使用弯曲工具，将瞬态拖动到你想要的位置。\n\
  4. 请注意，`Bend` 工具的行为会受到 `Snap` 的影响。如果 `Snap` 处于激活状态，你拖动的瞬态会吸附到时间轴网格上最近的可用位置。这有助于正确对齐鼓点，例如。你可以按键盘上的\
  \ `N` 来开启或关闭 Snap。\n5. 如果你只想修正单个瞬态的位置而不影响录音中的其他内容，请点击瞬态前后的空白处以在其前后添加弯曲标记。这样，你使用\
  \ `Bend` 工具执行的任何操作都将被限制在这两个标记之间，其余表演部分将保持不变。\n6. 使用 `Bend` 工具执行的操作是非破坏性的。如果你随时想恢复到原始录音，请按键盘上的\
  \ `1` 选择 `Arrow` 工具，点击音频事件以选中它，然后在 `Audio Bend` 菜单中点击 `Remove`。这将移除所有弯曲标记并将音频恢复到原始状态。\n\
  \n当只需修正少量错误时，这种手动修正时序错误的方法非常有效。然而，如果错误太多或录音非常密集，我们就需要一种自动修正错误的方法，这将在下一节中介绍。\n\n\
  ## 量化音频以自动修正时序错误\n\n在音乐制作中，**量化**是自动调整事件或对象的时序以使其与预设网格或节拍对齐的过程。这使得修正时序错误或创建更一致的节奏变得非常容易。\n\
  \n如果你有存在时序问题的音频录音，在 Studio One 中修复它非常简单。只需选中包含录音的事件，然后按键盘上的 `Q` 进行量化。这将启动一系列操作。Audio\
  \ Bend 算法将分析该事件，并在检测到瞬态的位置放置弯曲标记。然后，它会将这些弯曲标记与当前的量化网格对齐。\n\n在大多数情况下，这个简单的命令就能有效修复时序问题。不过，如果第一次尝试没有获得完美结果，也不必灰心。通过一些手动微调，量化的效果可以显著改善。音频量化的成功取决于以下三个因素：\n\
  \n- **被量化素材的类型**：正如上一节所见，具有清晰、明显瞬态的录音可以被更准确地标记，从而产生更好的结果。如果你尝试量化一个瞬态不明显的录音（如图 8.8\
  \ 底部所示），你可以通过手动添加弯曲标记或修正现有标记的位置来帮助算法。\n- **弯曲标记菜单中的 Threshold 设置**：仔细检查 `Edit` 窗口中的弯曲标记，并调整\
  \ `Threshold` 滑块，确保所有需要量化的瞬态都已被标记。如果标记过多或过少，算法最终会将错误的标记与量化网格对齐，导致结果不完美。\n- **量化设置**：这些设置告诉\
  \ Studio One 你歌曲的节奏结构，使其能够使用正确的量化网格。虽然默认设置适用于大多数素材，但其他素材可能需要一些调整。\n\n量化设置基于音乐音符时值，因此如果你具备基本的乐理知识，会更快得到结果。如果没有也没关系——量化是非破坏性的，如果你对结果不满意可以撤销。请随意尝试以找到合适的设置。\n\
  \n### 调整量化设置\n\n请按以下步骤调整量化设置：\n\n1. 点击 Quantize 按钮以打开 `Quantize` 菜单：\n\n![Figure\
  \ 8.11: The Quantize button and Quantize menu](img/B31512_08_11.jpg)\n\n**图 8.11：Quantize\
  \ 按钮和 Quantize 菜单**\n\n2. 使用菜单左侧的音符时值选择所需的量化网格。为获得最佳效果，请选择录音中使用的最小音符时值。例如，如果你想量化一个包含\
  \ 16 分音符踩镲型式的鼓录音，请选择 16 分音符。\n3. `Start` 滑块决定音频遵循量化网格的紧密程度。如果将其保持在默认的 100% 设置，音频将精确地与网格对齐，这被称为\
  \ `hard quantizing`（硬量化）。虽然这在某些音乐流派中是理想的，但在其他流派中则被认为过于机械。如果你想要更松散、*人性化* 的感觉，请降低此值。\n\
  4. 点击 `Apply`。\n\n这种方法非常适合将音频量化到网格，但并非所有音乐流派都符合对称组织的节奏结构。在下一节中，你将学习如何为具有独特节奏感的音乐创建自定义网格。\n\
  \n## 提取并量化到自定义律动\n\n在音乐中，**律动** 指的是赋予乐曲节奏风味并帮助定义其风格的节奏感和特征脉冲。乐曲的律动是由不同乐器演奏时序之间的相互作用产生的。在电子音乐中，节奏通常由电脑和鼓机创建，倾向于精确且可预测。另一方面，许多其他流派包含人类演奏时的时序和乐句变化，这赋予了它们独特的个性。\n\
  \n这些类型的音乐不适合我们在上一节讨论的 `grid quantization`（网格量化）。如果你尝试将拉丁打击乐合奏的录音量化到网格，它将失去其*自然*的感觉。\n\
  \n那么，如果你正在制作一首具有独特律动的歌曲，但仍想修正时序问题，该怎么办？Studio One 有一个名为 **groove quantization**（律动量化）的功能，专为这种情况设计，用以替代网格量化。律动量化允许你将参考音频或\
  \ MIDI 事件的节奏感应用到其他音频或 MIDI 事件上。这样，你就可以在多轨道间保持一致的律动。\n\n假设你有一个带有你想要使用的律动的鼓轨。你还有一个贝斯吉他轨，具有完全不同的律动，你想让它符合鼓轨。请按以下步骤使用律动量化来实现这一点：\n\
  \n\n\n\n1. 在 `Arrangement` 窗口中，点击“量化”按钮以打开“量化”菜单（图 8.11）。\n2. 在此菜单中，点击左侧的 `Groove`\
  \ 按钮以切换到 Groove 量化模式。\n3. 现在，将鼓音频录制拖动并放入 `Groove` 面板中（图 8.12 中的 a）：\n\n![Figure\
  \ 8.12: (a) The Groove panel and (b) the Groove Preset window](img/B31512_08_12.jpg)\n\
  \n图 8.12：（a）Groove 面板和（b）Groove 预设窗口\n\n您已从鼓轨道中提取了 Groove。\n\n1. 在 `Arrangement`\
  \ 窗口中，点击选择包含贝斯吉他录制的事件。\n2. 在键盘上按 `Q`，将贝斯吉他量化到鼓的 Groove。\n3. 如果您也想在未来的项目中使用此 Groove，请点击\
  \ `Groove Preset` 窗口上的加号（图 8.12 中的 b）。\n4. 为此 Groove 输入一个名称，然后点击 `OK`。\n\nGroove\
  \ 量化通常在应用于项目中的所有轨道时效果最佳。如果某些乐器量化到 Groove，而其他乐器量化到网格，它们的节奏将不一致。为了保持编曲的连贯性，请务必坚持使用网格量化或\
  \ Groove 量化这两种方法中的一种。\n\n在本节中，我们深入探讨了修复音频录制中时序错误的几种方法。现在，我们准备好应对一项稍微复杂的任务了——使用 Melodyne\
  \ 来优化人声录制。\n\n# 使用 Melodyne 修复和优化人声录制\n\n**Melodyne** 是一款行业领先的软件工具，允许您操控音频录制中单个音符的音高和时序。Melodyne\
  \ 由 **Celemony** 开发。尽管 Celemony 与 PreSonus 没有隶属关系，但他们已紧密合作十余年，在 Melodyne 和 Studio\
  \ One 之间建立了无与伦比的集成度。**Melodyne Essential** 是该软件最轻量级的版本，随 Studio One 捆绑提供。Melodyne\
  \ Essential 提供的功能足以满足大多数日常音乐制作的需求。\n\n### 重要提示\n\n尽管 Melodyne 能够操控音频的时序，但本书将不涵盖该功能。多年来，我发现\
  \ Studio One 自身的时序操控功能（我们在本章前一节中讨论过）非常有效且足够使用。因此，此处对 Melodyne 的介绍将局限于操控音频录制中的音高。\n\
  \n现在，让我们谈谈如何使用 Melodyne。首先，您将学习如何修正跑调的人声表演。然后，我们将探索使用 Melodyne 为您的项目添加和声人声的创造性方法。\n\
  \n## 使用 Melodyne 修复跑调的人声表演\n\n音乐中的每个音符都有一个预定的频率，由国际标准确定。当歌手演唱一个音符时，我们期望它处于该特定音符指定的频率。如果歌手演唱的频率高于应有频率，该音符就是尖锐的。如果频率低于应有频率，该音符就是低沉的。\n\
  \n**音高修正** 软件和硬件已被广泛使用数十年，用于检测这些偏差并将音符的频率移回其应有位置，无论是自动还是手动。这是一个复杂的过程，可能会导致音频中出现严重的伪影（想想\
  \ Auto-Tune）。Melodyne 的优势在于其能够将这些伪影降至最低，并提供纯净、自然的效果。\n\n现在，让我们看看如何使用 Melodyne 来修复跑调的音符。找到一个您想要处理的人声录制。在\
  \ `Arrangement` 窗口中，右键点击事件。从弹出菜单中，转到 `Audio`，然后点击 `Edit with Melodyne`。这将在 `Edit`\
  \ 窗口中打开 Melodyne：\n\n![Figure 8.13: Melodyne Essential in the Edit window](img/B31512_08_13.jpg)\n\
  \n图 8.13：Edit 窗口中的 Melodyne Essential\n\n界面中间的色块是人声录制中每个音符的可视化表示。横跨此窗口的白色和灰色条纹对应乐谱上的音符，列在最左侧的列中。窗口上方的数字对应\
  \ Studio One 项目中的小节号。\n\n使用窗口底部和最右侧的导航栏进行移动。这些导航栏也兼具缩放控制的功能——将鼠标悬停在任一端，光标将变为放大镜图标。然后您可以拖动鼠标随意放大或缩小。\n\
  \n现在您已熟悉 Melodyne 的界面，可以开始使用它了。首先要做的是转到 Melodyne 自己顶部菜单上的 `Algorithm`，并确保选中了 `Melodic\
  \ (Standard)`。这可确保 Melodyne 使用正确的算法进行音高检测。\n\n让我们仔细看看色块，并学习如何操作它们。这是一个示例：\n\n![Figure\
  \ 8.14: A blob representing a slightly flat note](img/B31512_08_14.jpg)\n\n图 8.14：表示略微低沉音符的色块\n\
  \n色块内部的波浪线代表歌手演唱该音符时频率的微小波动。色块本身代表所有这些波动的平均值。在这里，歌手想唱 *A* 音，但有点低。我们可以看出，因为色块向下偏移朝向\
  \ *G#* 音，而不是准确落在 *A* 音上。您可以通过向上拖动色块轻松修正此问题。它将吸附到最近音符的中心，在本例中即为 *A*。这是修正后 *图 8.14*\
  \ 中同一个音符的样子：\n\n![Figure 8.15: A blob representing a pitch-corrected note](img/B31512_08_15.jpg)\n\
  \n图 8.15：表示音高已修正音符的色块\n\n如果您想暂时禁用此自动吸附选项，请在拖动时按住 `Alt`/`Option` 键。这将允许您以更精细的分辨率上下移动色块。\n\
  \n以这种方式手动修正音符时，需要注意一种称为 *glissando*（滑音） 的演唱技巧：\n\n![Figure 8.16: Several notes connected\
  \ with glissando](img/B31512_08_16.jpg)\n\n图 8.16：通过滑音连接的多个音符\n\n**滑音** 是指歌手或乐器演奏者滑入一个音符，而不是直接落在其上。在\
  \ *图 8.16* 中，所有音符都通过滑音连接，正如连接色块的线条所示。虽然这是一种很酷的声乐技巧，但它给音高修正带来了两个挑战——第一，它会在计算音符平均频率时欺骗算法；第二，试图修正滑音的音高违背了最初使用滑音演唱的初衷，导致著名的\
  \ Auto-Tune 效果，该效果被用作某些音乐流派中的创作手段。\n\n每当您看到类似 *图 8.16* 中的滑音时，请将其从色块主体上分离。为此，将鼠标悬停在色块的上半部分。它将变为\
  \ `Note Separation` 工具。使用此工具双击以分割色块。这是我在音符开头和结尾处分离滑音后的同一个音符：\n\n![Figure 8.17: The\
  \ same note with glissandos detached](img/B31512_08_17.jpg)\n\n图 8.17：分离滑音后的同一个音符\n\
  \n请注意，通过分离滑音，我强制算法重新计算色块的位置，现在它的音高变尖了，偏向 *F* 音。现在，当我将此色块拖动到其正确位置时，算法将做得更好，因为它不再将滑音考虑在内。\n\
  \n\n\n\n# 第 8 章：Melodyne 与干声分离\n\nMelodyne 的界面直观易懂，但学会解读音块需要一些适应时间。请随意尝试。如果你对某次操作不满意，请前往\
  \ Melodyne 自身的菜单，然后点击 `Edit` 和 `Undo`。请勿使用键盘快捷键撤销，因为这将撤销你在 Studio One 的 `Arrangement`\
  \ 窗口中执行的上一步操作！\n\n在 Melodyne 中执行的操作是非破坏性的。回到 `Arrangement` 窗口后，你随时可以右键点击事件并选择 `Remove\
  \ Melodyne`。这将把录音恢复到其原始状态。\n\n## 重要提示\n\n虽然我们讨论的是人声录音，但 Melodyne 同样可以轻松处理任何单音源素材——这意味着你可以用它来校正任何乐器的音高，只要该乐器在任一时刻只演奏单个音符，而非和弦。可以在任何可能跑调的乐器上尝试。它在弦乐器和管乐器上效果极佳。\n\
  \n到目前为止，我们讨论了将 Melodyne 用于修正目的。接下来，我们将探索一种更具创意的 Melodyne 使用方法，以丰富你的项目。\n\n## 使用\
  \ Melodyne 创作背景和声人声\n\n背景和声人声绝对能让歌曲更上一层楼。然而，创作和演唱和声人声需要丰富的经验，且至少要求具备基本的乐理知识，因此可能无法现场录制。借助\
  \ Melodyne，我们可以从歌手的原始演唱中创作出和声人声。具体步骤如下：\n\n1. 在录音环节中，多录制几遍歌手的演唱。保留最好的一遍作为主唱。我们将利用其他遍数来创作背景和声人声。\n\
  2. 右键点击其中一遍额外录音，选择 `Edit with Melodyne`。\n3. 在 Melodyne 窗口中，点击 `Chord Track Visibility`\
  \ 按钮：\n\n![图 8.18：Melodyne 窗口中的和弦轨道显示按钮](img/B31512_08_18.jpg`)\n\n4. 在和弦轨道上输入你歌曲的和弦。\n\
  5. 在 Melodyne 自身的顶部菜单中，依次选择 `Options` | `Pitch Grid` | `Pitch Background`，并选择 `Chord`。此时，Melodyne\
  \ 窗口的背景将以白色显示和弦内的音符，以灰色显示所有其他音符。\n6. 再次在 Melodyne 自身的顶部菜单中，依次选择 `Options` | `Pitch\
  \ Grid`，并选择 `Chord Snap`。现在，音块只能移动到你歌曲所用和弦的音符上。\n7. 将音块拖动到这些音符上，以创作和谐的人声。由于音块仅吸附到你的和弦音上，因此不可能出现错误的音符。请随意尝试。\n\
  8. 重复上述步骤，创建任意数量的和声人声音轨。\n\n请记住，Melodyne 同样适用于乐器，因此你可以用这种方法从单个小提琴演奏中创作出一个小提琴声部，例如。唯一的限制就是你的想象力！\n\
  \n这结束了我们关于在项目中使用 Melodyne 进行修正和创意操作的指导。\n\n## 使用干声分离隔离音频事件\n\n**干声分离** 是指将混音音频文件中的不同元素或**干声**（如人声、鼓、贝斯和其他乐器）分离到单独的音频轨道上的过程。这为混音、重新编曲或增强原始混音的组件提供了更多可能性，赋予了创作灵活性。\n\
  \n干声分离技术已存在一段时间，但通常只见于第三方供应商运营的网站上，典型的提取工作流程包括上传原始文件、付费并等待提取，然后下载提取出的文件。\n\n从版本\
  \ 7 开始，Studio One 内置了干声分离功能。具体操作如下：\n\n1. 将你想要提取干声的音频文件拖放到 Studio One 的 Song 中。\n\
  2. 使用 `Arrow` 工具点击选中该音频文件。\n3. 按下 `Cmd` + `U` (Mac) 或 `Ctrl` + `U` (Windows) 打开\
  \ `Separate Stems` 对话框（图 8.19）。\n\n![图 8.19：分离干声对话框](img/B31512_08_19.jpg`)\n\n\
  4. 在这里，选择你想从原始录音中提取的音频素材。你可以选择 `Vocals`、`Drums` 和 `Bass`，这些名称不言自明，以及 `Other`，它基本上包含不属于前三类的所有其他乐器。\n\
  5. 点击 `OK`。\n\nStudio One 将利用其 AI 技术分析录音，并将你选定的干声提取到单独的独立轨道中。从此，你可以随心所欲地使用这些干声进行采样、混音和重新编曲。不过，如果你打算在数字平台上发布成果，请务必确保不违反任何版权法规！\n\
  \n## 总结\n\n在本章中，我们探索了 Studio One 的音频编辑工具，并讨论了在项目中使用这些工具的几种不同方法。我们从常见的编辑任务开始，例如清理音频轨道，然后转向更复杂的任务，例如让一条轨道符合另一条轨道的律动。我们继续深入讨论了如何将\
  \ Melodyne 融入项目以提升人声表现。我们最后探讨了如何使用干声分离技术从已混音的音乐文件中提取素材。\n\n在下一章中，我们将探索 Studio One\
  \ 的 MIDI 编辑工具，并发现它们如何帮助你让虚拟乐器栩栩如生。\n"
- "## 第 9 章：编辑 MIDI\n\n使用 MIDI 就像演奏乐器。它是艺术与科学的结合，你不能只关注一方而忽视另一方。就像演奏乐器一样，使用 MIDI 需要练习。无论你是音乐制作新手，还是转投\
  \ Studio One 的资深专业人士，这个新工具都将提供强大的功能来创作和塑造你的音乐创意，同时保持友好的学习曲线。\n\n在本章中，我们将采用循序渐进的方式介绍\
  \ Studio One 丰富的 MIDI 编辑工具集，从基础工具开始，逐步深入到高级工具。读完本章后，你将能够自信地使用这些工具来调整 MIDI 演奏的音高、时值和力度。这将使你能够实现广泛的音乐效果，从修正简单错误到创作复杂且多层次的音乐编排。\n\
  \n我们将涵盖以下主题：\n\n* 使用基本编辑工具和量化\n* 调整 MIDI 数据以提升演奏表现\n* 在 Pattern Editor 中工作\n* 使用\
  \ Note FX 激发创意\n\n## 技术要求\n\n要跟随本章操作，你需要在电脑上安装并激活 Studio One。\n\n## 使用基本编辑工具和量化\n\
  \n在第 6 章中，我们介绍了录制和编程 MIDI 演奏的几种不同方法。虽然 MIDI 演奏是呈现音乐创意的绝佳起点，但它几乎从不以原始形式直接使用。它旨在被加工和精炼，就像珍贵的金属矿石一样。\n\
  \n在本节中，我们将探索 Studio One 的基本 MIDI 编辑工具，然后深入研究 MIDI 量化。本节讨论的所有工具和方法都基于 `Edit` 窗口，只需双击你想要处理的\
  \ MIDI 事件即可轻松打开。\n\n\n\n正如我们在`第 6 章`中所述，`Edit` 窗口本身有三种查看选项——`Piano view`、`Drum view`\
  \ 和 `Score view`（请参阅 `Figure 6.13`）。除非另有说明，本节将始终使用 `Piano view`，因为它提供了最多数量的编辑工具和选项。您在此查看模式下执行的任何操作都会即时反映在其他模式中。\n\
  \n现在，我们准备开始探索编辑工具。找一个您想要修复、改进或增强的 MIDI 演奏，让我们动手实践一下吧。\n\n## 使用 Arrow 工具执行基本编辑任务\n\
  \n使用 MIDI 时，我们武器库中最得力的工具是好老朋友 `Arrow` 工具。让我们快速了解一下它能完成哪些任务：\n\n1.  在 `Arrangement`\
  \ 窗口中，双击您想要处理的 MIDI 事件。这将在 `Edit` 窗口中打开该事件。\n\n2.  按键盘上的 `1` 来获取 `Arrow` 工具。\n\n\
  3.  要更改 MIDI 音符的时机或位置，将其向左或向右拖动。如果 `Snap` 处于激活状态，您只能将其放置在与时间轴网格对应的位置。这使您能够精确对齐音符。按键盘上的\
  \ `N` 可切换 `Snap` 功能。\n\n4.  要更改 MIDI 音符的音高，将其向上或向下拖动。Studio One 会提供听觉反馈，帮助您找到正确的音符数值。\n\
  \n5.  或者，点击音符将其选中，然后使用键盘上的上或下方向键来更改其音高。按住 `Shift` 键的同时按上或下键，可将音符上移或下移一个八度。\n\n6.\
  \  要调整音符的长度，将 `Arrow` 工具悬停在音符的开头或结尾。它会变成一个双向箭头。使用它来调整音符大小。请注意，此操作也受 `Snap` 功能控制。\n\
  \n7.  要复制音符，按住 `Alt`/`Option` 键的同时拖动它。\n\n8.  要更改音符的力度，拖动 `Edit` 窗口底部的力度指示器（我们稍后将在\
  \ `Adjusting velocity` 部分详细讨论力度）。\n\n> **提示**\n>\n> 请注意，`Arrangement` 窗口和 `Edit`\
  \ 窗口拥有各自独立的工具菜单。例如，如果您在 `Arrangement` 窗口中选择 `Listen` 工具，在 `Edit` 窗口中选择 `Arrow` 工具，当您在两个窗口之间移动鼠标时，可用的工具会随之相应变化。\n\
  \n迄今为止讨论的所有操作都可以一次性应用于多个音符。输入 `Ctrl` + `A` (Windows) 或 `Cmd` + `A` (Mac) 可选中 MIDI\
  \ 事件中的所有音符。使用 `Arrow` 工具绘制选框围绕一组音符可选中它们。如果您想更精细地控制选中哪些音符，请使用 `Select Notes` 窗口，我们将在下一节介绍。\n\
  \n## 使用 Select Notes 窗口进行精确选择\n\n用鼠标选择 MIDI 音符对于大多数用途来说已经足够，但有时您需要选择仅满足特定标准的音符。在跨越多个轨道的繁忙\
  \ MIDI 事件中用鼠标做这件事是一项繁琐的任务。\n\n`Select Notes` 窗口允许您快速选择满足特定标准的音符。然后您可以发出仅想应用于这些音符的命令。要打开此窗口，请点击\
  \ `Edit` 窗口上的 `Action` 按钮，然后点击 `Select Notes…`：\n\n![图 9.1：打开 Select Notes 窗口](img/B31512_09_1.jpg)\n\
  \n图 9.1：打开 Select Notes 窗口\n\n这将打开 `Select Notes` 窗口：\n\n![图 9.2：Select Notes 窗口](img/B31512_09_2.jpg)\n\
  \n图 9.2：Select Notes 窗口\n\n此窗口顶部显示有两种操作模式：\n\n*   `Select` 模式选择符合您标准的音符，例如选择 `C3`\
  \ 和 `C4` 之间的所有音符。\n\n*   `Deselect` 模式选择除符合您标准的音符之外的所有音符，例如选择除 `C3` 和 `C4` 之间的音符之外的所有音符。\n\
  \n在窗口中央，您可以根据想要如何进行选择来设置参数：\n\n*   `Highest notes` 选择事件中任意时间可用的最高音符。\n\n*   `Lowest\
  \ notes` 选择事件中任意时间可用的最低音符。\n\n*   `Range…` 允许您选择处于特定 `Pitch`（音高）、`Velocity`（力度）或\
  \ `Note Length`（音符长度）数值范围内的音符。点击此选项时，窗口将展开以显示滑块，您可在其中设置这些参数，如 `Figure 9.2` 底部所示。\n\
  \n*   `At interval…` 允许您根据音符在时间轴网格上的位置，或根据音符之间的数字关系来选择音符。此选项有两种操作模式：\n\n    *  \
  \ `Beat` 根据音符相对于网格的位置选择音符。您可以使用 `Beat grid` 参数设置网格的灵敏度。\n\n    *   `Event count`\
  \ 根据音符之间的距离选择音符。例如，如果您有一系列音符并想选择每第三个音符，请将此处的 `Select at every n-th position` 设置设为\
  \ `3`。\n\n*   `Muted notes` 选择事件内所有静音的音符。\n\n现在我们已经确切知道如何定位特定音符，准备好处理更高级的编辑操作了。\n\
  \n## 量化 MIDI 音符以更改演奏的时机\n\n在`第 8 章`中，我们将量化描述为自动调整事件或对象的时机以与预定网格或拍子对齐的过程。我们随后告诫不要过度使用量化，因为音频量化涉及时间拉伸，如果过度使用会降低音质。\n\
  \n现在有个好消息——量化 MIDI 完全不影响音质，所以您可以尽情大胆创作。MIDI 音符只是一条指令，告诉 MIDI 乐器开始发声。当您量化 MIDI 音符时，只是改变指令发送给乐器的时间，对音质绝对没有任何影响。这让您可以毫无限制地尝试创意想法。\n\
  \n量化 MIDI 音符很简单：只需选择要量化的音符，然后按键盘上的 `Q`。这将使用您当前的量化设置对选定音符进行量化。要查看和更改这些设置，请点击 `Quantize`\
  \ 按钮打开 `Quantize` 菜单（参见`第 8 章`中的 `Figure 8.9`）。\n\n我们在`第 8 章`中探讨了 `Quantize` 菜单。我们在那里介绍的网格量化和律动量化方法也可用于\
  \ MIDI 音符，步骤完全相同。不过，此菜单中有两个设置我们迄今尚未讨论：\n\n*   通常，当我们谈论量化 MIDI 音符时，指的是将其起始位置与时间轴上的网格对齐。然而，有时您可能也希望精确地将\
  \ MIDI 音符的结束位置与网格对齐。这对于分解和弦的合成器主旋律、延音垫音、弦乐音色，或任何您想精确控制音符结束点位置的场景尤其合理。`End` 滑块允许您设置要对\
  \ MIDI 音符尾部进行多少量化。如果您不需要量化音符尾部，请保持 `0%`（默认设置）；设为 `100%` 则对其进行硬量化。`0%` 到 `100%` 之间的任何值都会对\
  \ MIDI 音符尾部应用逐渐增加的量化程度。\n\n\n\n\n## 量化范围与人性化\n\n`Range` 滑块允许你设置网格线周围的时间范围。当你发出 `quantize`\
  \ 命令时，该范围内的任何音符都会被量化，而范围外的任何音符则保持不受影响。默认情况下，此滑块的值为 `100%`，这意味着无论音符距离网格多远，都会被量化。如果将其设置为\
  \ `0%`，另一个极端，则没有音符会被量化。你可以根据口味调整此设置，以收紧演奏中某些元素的时机，同时保持其他元素的宽松质感。\n\n现在，让我们谈谈仅针对\
  \ MIDI 事件的更高级量化功能。\n\n### 让僵硬的演奏更人性化\n\n虽然量化对许多音乐流派不可或缺，但还有许多其他流派并不同样欢迎它。在 EDM 曲目中感觉完全合适的大量量化演奏，在摇滚曲目中可能会被认为僵硬且机械。在这种情况下，可以添加一些人为的真实感（是的，我们在音乐制作中也有不少矛盾修饰法）来掩盖量化的痕迹。\n\
  \n`Humanize`（人性化）功能旨在通过向 MIDI 音符的力度和起始位置注入随机变化，使大量量化的演奏听起来更有机。要访问此功能，请点击 `Edit`（编辑）菜单上的\
  \ `Action`（操作）按钮，然后选择 `Humanize`。这将打开 `Humanize` 窗口：\n\n![Figure 9.3: The Humanize\
  \ window](img/B31512_09_3.jpg)\n\n**Figure 9.3: The Humanize window**\n\n在此处，设置你希望允许音符力度和起始点出现随机变化的范围。当你点击\
  \ `OK` 时，Studio One 将在这些范围内生成随机值并将其应用到 MIDI 音符。\n\n结合前面讨论的 `Select Notes`（选择音符）窗口使用，`Humanize`\
  \ 命令可以成为一个强大的工具。例如，你可以有选择地针对节奏循环的某些元素进行人性化处理，同时保持底鼓和军鼓的硬量化状态。\n\n### 恢复与冻结量化\n\n\
  当你在 MIDI 演奏中量化或人性化音符时，Studio One 仍会保留其原始位置的记录。这使你能将 MIDI 演奏恢复到其原始状态，即使你保存并关闭项目，稍后再回来也是如此。要将演奏恢复到原始状态，请点击\
  \ `Edit` 窗口上的 `Action`，然后选择 `Restore Timing`（恢复时机）。\n\n这当然是一个有用的功能，允许你日后改变主意，但有时它可能成为障碍。例如，假设你昨天在处理项目时量化了一个事件。今天，你再次打开项目。你对自己的量化想法很满意，只是想再量化一点以收紧一下。在这种情况下，当你启动量化命令时，Studio\
  \ One 会考虑音符的原始位置，而不是你昨天将它们量化到的位置。解决方法是冻结你昨天所做的量化，用新位置替换音符的原始位置。为此，请点击 `Edit` 窗口上的\
  \ `Action`，然后选择 `Freeze Quantize`（冻结量化）。\n\n这结束了我们对 Studio One MIDI 量化选项的介绍。接下来，我们将开始探索深度编辑功能。\n\
  \n## 调整音符长度并应用半速或倍速\n\n能够精确控制音符长度是 MIDI 编辑技能组合中的一个重要因素。你可以获取为钢琴编写的短音符，并将其转换为弦乐器的长延音。反之，你也可以获取长音符并将其切碎成合成器可以演奏的琶音。以这种方式转换音符为无限可能打开了大门。\n\
  \nStudio One 允许你使用 `Length`（长度）命令精确控制 MIDI 音符的长度。要使用此命令，请点击 `Edit` 窗口上的 `Action`\
  \ 按钮，然后选择 `Length`。这将打开 `Length` 窗口：\n\n![Figure 9.4: The Length window](img/B31512_09_4.jpg)\n\
  \n**Figure 9.4: The Length window**\n\n让我们回顾一下选项：\n\n*   选择 `Add`（增加）或 `Subtract`（减少），并使用下方的滑块设置要添加到或从所选音符现有长度中减去的量。\n\
  *   `Set all to`（全部设为）允许你将所有所选音符的时值设置为标准音符长度值（八分音符、四分音符等）。\n*   使用 `Multiply by`（乘以）通过通用乘数修改所选音符的长度。输入比此处显示的值更小的值将有效地缩短所选音符。\n\
  *   选择 `Legato`（连奏）以将每个音符的末尾连接到下一个音符的开头。这对于从短促、不连贯的音符创建延音段落非常有用。\n*   有时，MIDI 演奏可能包含重叠的音符——一个音符在第二个音符开始后继续发声。通常这不是问题，但某些单音合成器和采样库补丁在接收重叠音符时会表现异常。使用\
  \ `Overlap Correction`（重叠校正）选项可自动修复此问题：\n\n![Figure 9.5: Overlapping notes (left)\
  \ corrected with Overlap Correction (right)](img/B31512_09_5.jpg)\n\n**Figure 9.5:\
  \ Overlapping notes (left) corrected with Overlap Correction (right)**\n\n有时情况恰恰相反——某些弦乐库补丁在连续音符轻微重叠时能产生更逼真的连奏演奏。如果你追求音符间平滑的连奏过渡，请再次选择\
  \ `Overlap Correction`，但这次使用该窗口底部的滑块拨入少量重叠——`0:00:25` 左右即可（此窗口中的滑块使用一种古老的 MIDI 测量单位，称为\
  \ `pulses per quarter`（`PPQ`，每四分音符脉冲数））。\n\n你也可以使用重叠滑块拨入负值。这将导致每个音符在下一个音符开始前刚好截止。\n\
  \n*   使用 `Legato + Overlap Correction` 选项可自动连接断开的音符，并应用滑块中设置的任何连奏校正级别，如前所述。\n\n\
  > **Tip**\n>\n> 将 `Length` 工具与 `Select Notes` 窗口结合使用，可轻松执行复杂的编辑任务。例如，仅选择密集编排的 MIDI\
  \ 事件中的中音声部，并将它们变成弦乐编排的连奏部分。\n\n默认情况下，Studio One 会自动调整所有 MIDI 事件以匹配项目的速度。有时，你可能想要覆盖此功能，并精确控制时间拉伸如何应用于\
  \ MIDI 事件。一个典型场景是当你想为项目应用倍速或半速感觉时，歌曲中的某些元素演奏速度比其他乐器快一倍或慢一倍。这需要手动按一定量收缩或拉伸 MIDI 事件中的所有内容，这可以通过\
  \ `Stretch`（拉伸）命令实现，步骤如下：\n\n1.  点击 `Edit` 窗口中的 `Action` 按钮，然后选择 `Stretch`。这将打开\
  \ `Stretch` 窗口：\n\n![Figure 9.6: The Stretch window](img/B31512_09_6.jpg)\n\n**Figure\
  \ 9.6: The Stretch window**\n\n2.  在此窗口中，选择你想要收缩或拉伸 MIDI 事件的幅度：\n    *   `Double\
  \ Tempo`（倍速）将 MIDI 事件的内容收缩到其原始大小的一半；因此，它将以两倍速播放。\n    *   `Half Tempo`（半速）将 MIDI\
  \ 事件的内容拉伸到其原始大小的两倍；因此，它将以半速播放。\n    *   使用 `Free`（自由）选项可按任意值拉伸 MIDI 事件。输入小于 1 的数字会收缩事件。输入大于\
  \ 1 的数字会拉伸事件。\n\n3.  点击 `OK`。\n\n> **Note**\n>\n> 请注意，如果你使用此命令拉伸 MIDI 音符，Studio\
  \ One **不会**自动扩展包含这些音符的 MIDI 事件的边界。你需要前往 `Arrangement`（编排）窗口，使用 `Arrow`（箭头）工具调整事件大小。\n\
  \n\n\n\n到目前为止，我们已经介绍了编辑 MIDI 演奏的基本工具。在下一节中，我们将深入探讨更高级的编辑功能，这些功能将通过调整音符音高、使其符合不同的调性，以及优化其他\
  \ MIDI 参数以改变声音的音色，从而帮助您将音乐创意变为现实。\n\n# 调整 MIDI 数据以增强演奏效果\n\n尽管 MIDI 已陪伴我们近半个世纪，但一些音乐制作人仍将其视为人造且缺乏生气的。某些音乐流派，如流行、EDM\
  \ 和嘻哈，已欣然接受这一特质；而其他流派，如摇滚和爵士，则将其视为必要之恶，是必须小心处理的技术副作用。\n\n我们可以将真实感和情感注入 MIDI 演奏中，Studio\
  \ One 提供了多种工具来协助您实现这一点。在本节中，我们将介绍几种 MIDI 编辑技巧，让您的 MIDI 轨道焕发生机。\n\n## 移调音符\n\n能够轻松移调音符且不牺牲音质，一直是\
  \ MIDI 的优势之一。移调允许您在无需重新录制的情况下更改歌曲的调性。这对于寻找最适合您音域的调性、使歌曲与现有伴奏轨道匹配，或尝试不同调性以找到最适合歌曲的调性非常有用。然而，这只是冰山一角。移调为常被忽视的创意可能性打开了大门——您可以将歌曲移调到不同的音阶（例如从大调到小调），并为现有旋律创作和声。\n\
  \n有几种方法可以移调音符。让我们从最基本的开始：\n\n1.  双击包含您想要移调音符的 MIDI 事件。\n2.  `Edit`（编辑）窗口现已打开，请确保已启用\
  \ Snap（吸附）。\n3.  按键盘上的 `1` 选择 `Arrow`（箭头）工具。\n4.  输入 `Ctrl + A` (Windows) 或 `Cmd\
  \ + A` (Mac) 选择所有 MIDI 音符。\n5.  使用 `Arrow`（箭头）工具，将音符向上或向下拖动到所需的音高。\n6.  您也可以使用键盘上的上、下方向键垂直移动音符。按住\
  \ `Shift` 并按上或下键可按八度移调音符。\n\n以下是一种更快的移调音符方法：\n\n1.  点击 `Edit`（编辑）窗口上的 `Action`（操作）按钮并选择\
  \ `Transpose`（移调）。这将打开 `Transpose`（移调）窗口：\n\n![Figure 9.7: The Transpose window](img/B31512_09_7.jpg)\n\
  \nFigure 9.7: The Transpose window\n\n1.  使用此窗口 `Add/Subtract`（加/减）部分的滑块设置以半音为单位的移调量。在此输入负值可将音符向下移调，输入正值可将音符向上移调。\n\
  2.  如果您只想按八度移调，可以使用标有 `-2 Oct` 到 `+2 Oct` 的快捷键。\n3.  使用 `Set all to`（全部设为）选项可将所有音符简化为单个音符。这对于从旋律部分创建节奏部分非常有用。例如，如果您有一个贝斯型，并希望踩鼓与贝斯完全同步演奏，请使用此选项将所有贝斯音符设为\
  \ `C 1` 以触发踩鼓。\n4.  点击 `OK`。\n\n现在，我们进入有趣的部分——我们将让 Studio One 将旋律移调到完全不同的音阶或调式。通过使用此技巧，您可以完全改变旋律的感觉，并以完全不同的情绪呈现它。操作方法如下：\n\
  \n1.  在 `Edit`（编辑）窗口的左侧，找到标题为 `Scale`（音阶）的部分。\n2.  在这里，使用左侧的下拉菜单选择调性，使用右侧的下拉菜单选择您想要使用的音阶或调式：\n\
  \n![Figure 9.8: Selecting a key (left) and a scale or mode (right)](img/B31512_09_8.jpg)\n\
  \nFigure 9.8: Selecting a key (left) and a scale or mode (right)\n\n1.  点击 `Action`（操作）按钮并选择\
  \ `Apply Scale`（应用音阶）。Studio One 将把 MIDI 音符移调到您刚才选择的音阶或调式。\n\n大胆尝试下拉列表中的所有不同音阶。一旦找到您喜欢的音阶，对歌曲中的所有\
  \ MIDI 事件重复上述步骤，将它们移调到该音阶。虽然这通常需要扎实的乐理知识，但在 Studio One 中却轻而易举。\n\n## 调整力度\n\n在 MIDI\
  \ 中，`velocity`（力度/速度）是伴随每个音符的一个值，指示该音符被敲击的力度。合成器和其他 MIDI 控制设备利用此信息来确定生成声音的音量、音色和其他特性。\n\
  \n当您使用 MIDI 键盘录制一段音乐时，每个音符对应的力度值也会被记录下来。随后您可以编辑这些值以微调演奏的力度变化。操作方法如下：\n\n1.  双击您想要编辑的事件。这将在\
  \ `Edit`（编辑）窗口中打开该事件。每个音符的力度值将显示为窗口底部 `Automation Lane`（自动化通道）上的柱状图。`Automation\
  \ Lane`（自动化通道）允许您控制轨道随时间变化的特定参数，从而在歌曲过程中创建动态变化。\n\n![Figure 9.9: The Automation\
  \ Lane at the bottom of the Edit window](img/B31512_09_9.jpg)\n\nFigure 9.9: The\
  \ Automation Lane at the bottom of the Edit window\n\n如果您看不到 `Automation Lane`（自动化通道），请点击\
  \ `Show/Hide Automation Lanes`（显示/隐藏自动化通道）按钮（图 9.9 左下角的波浪形按钮）并选择 `Velocity`（力度）选项卡。\n\
  \n1.  此通道中的每一列代表相应音符被敲击的力度大小，范围从 `0` 到 `100`。选择 `Arrow`（箭头）工具，将某列向上或向下拖动以更改音符的力度。Studio\
  \ One 会反复播放该音符，让您听到更改力度如何改变最终声音。\n2.  要更改一组音符的力度，请选择这些音符，然后拖动其中任意一个音符对应的力度列。所有选中音符的力度值将按相同幅度修改。\n\
  \n这种方法适用于调整少量音符的力度，但有时您想在更大范围内调整力度。想象一下，您有一系列音符，想对它们应用渐强，使其逐渐听起来更响亮、更明亮。操作方法如下：\n\
  \n1.  双击您想要编辑的事件。\n2.  在 `Edit`（编辑）窗口的工具栏上，点击 `Paint`（画笔）工具：\n\n![Figure 9.10: Options\
  \ for the Paint tool](img/B31512_09_10.jpg)\n\nFigure 9.10: Options for the Paint\
  \ tool\n\n1.  从选项列表中选择 `Parabola`（抛物线）。\n2.  现在，转到 `Edit`（编辑）窗口底部的 `Automation Lane`（自动化通道）并绘制一条抛物线（即一条曲线)。您将得到类似这样的结果：\n\
  \n![Figure 9.11: A series of MIDI notes (top) and the same notes with a parabola\
  \ applied to their velocities (bottom)](img/B31512_09_11.jpg)\n\nFigure 9.11: A\
  \ series of MIDI notes (top) and the same notes with a parabola applied to their\
  \ velocities (bottom)\n\n1.  请注意，某些 MIDI 设备对力度变化非常敏感，而另一些则不然，因此图 9.11 中的曲线可能会产生从戏剧性的渐强到音色几乎无变化的各种效果，具体取决于您使用的设备。实验是关键。如果您认为结果可以更好，请输入\
  \ `Ctrl + Z` (Windows) 或 `Cmd + Z` (Mac) 撤销上一步操作并重试。\n\n某些 MIDI 设备要求力度必须处于特定值或有限的数值范围内。例如，某些采样小提琴音色库仅在力度介于\
  \ `0` 和 `10` 之间时才会播放特定的发音。如果您正在使用此类乐器，则需要能够为力度设置精确值。操作步骤如下：\n\n1.  点击 `Edit`（编辑）窗口中的\
  \ `Action`（操作）按钮，并选择 `Velocity`（力度）。这将打开 `Velocity`（力度）窗口：\n\n\n\n\n![Figure 9.12:\
  \ The Velocity window](img/B31512_09_12.jpg)\n\n图 9.12：Velocity 窗口\n\n1.  要按相同数量增加或减少所有音符的力度，请点击\
  \ `Add` 选项，然后选择要添加到或从其当前力度中减去的值。\n\n2.  要按相同数量乘以所有力度，请点击 `Multiply` 并选择要相乘的值。\n\n\
  3.  要将所有力度设置为相同的值，请点击 `Set all to` 并选择您希望所有音符具有的值。请记住，在 Studio One 中，力度的值可以在 `0%`\
  \ 和 `100%` 之间。\n\n最后，有时您可能会遇到 MIDI 表演听起来很机械的情况，因为所有音符具有完全相同的力度值。当您使用 `Paint` 工具或\
  \ QWERTY 键盘通过鼠标输入音符时，就会发生这种情况，正如我们在 *第 6 章* 中讨论的那样。在这种情况下，通过给音符力度添加一些变化来为表演注入真实感和动态感是个好主意。以下是一种简单的方法：\n\
  \n1.  在 `Edit` 窗口中点击 `Action` 按钮，然后选择 `Humanize`。\n\n2.  在 `Humanize` 窗口中，使用 `Add\
  \ velocity range` 滑块设定一个范围，力度值应在该范围内变化。\n\n3.  将 `Add note start range` 滑块设置为 `0`，以免移动音符的位置。\n\
  \n4.  点击 `OK`。\n\n这结束了我们对 MIDI 力度及其几种不同处理方法的介绍。现在，让我们继续了解调制和其他 MIDI 参数，看看如何利用它们在歌曲进行过程中调整声音。\n\
  \n## 调整调制和其他参数\n\n力度能有效衡量您敲击琴键的力度，但它不传达初次敲击后发生的任何信息。如果您长按一个音符，就需要另一种方法为其添加表现力和变化。\n\
  \n20 世纪 80 年代创建 MIDI 协议的那些聪明人意识到了这个问题，因此他们添加了几个称为**连续控制器消息**（**CCM**）的参数。这些参数允许您使用\
  \ MIDI 设备上的旋钮和推子连续控制音符的某些方面，而不管其长度如何。例如，您可以使用 CCM 逐渐增加单个音符的音量，或在音符即将结束时添加颤音。\n\n\
  就像力度一样，CCM 可以在表演过程中录制，事后也可以编辑，这将是本节的主题。Studio One 以相同的方式处理所有 CCM，因此一旦您学会了如何使用一种\
  \ CCM，就可以使用相同的方法录制和修改您需要处理的任何其他 CCM。\n\n为了了解 Studio One 如何处理 CCM，我们将使用**调制**，这是最流行的\
  \ CCM。事实上，调制非常流行，以至于大多数 MIDI 键盘都配备了一个称为**调制轮**的专用硬件控制器，允许您实时操控调制数据。调制通常用于为声音添加颤音或打开滤波器，使声音逐渐变亮，但同样，每个制造商的方法都不同。\n\
  \n现在，让我们探索如何创建和编辑调制数据。\n\n### 录制调制数据\n\n在表演过程中录制调制数据可让您准确听到添加了多少表现力，并允许您即时调整调制电平。有几种方法可以做到这一点，让我们逐一探讨：\n\
  \n*   如果您的 MIDI 键盘有调制轮，只需在 MIDI 轨道上开始录制，正如我们在 *第 6 章* 中讨论的那样。当您演奏音符时，使用调制轮为它们添加表现力。调制数据将被录制在同一轨道内的单独通道上。\n\
  \n*   如果您表演时双手都在用，或者发现边弹边操控轮子不切实际，别担心。先录制音符。然后再次点击录制，这次操控调制轮。由于调制数据位于单独的通道上，这不会擦除音符。\n\
  \n*   如果您的键盘没有调制轮，或者您没有键盘，仍然可以录制调制数据。还记得屏幕上的 QWERTY 键盘吗？它左侧有一个虚拟调制轮，标记为 `Mod`（*图\
  \ 6.9*）。点击录制并使用它为您的表演添加表现力。\n\n一旦您录制了调制数据，就该对其进行编辑以臻完美，这正是我们接下来要做的。\n\n### 编辑调制数据\n\
  \n调制数据存储并显示在 `Track Automation Lane` 中。请按照以下步骤显示此通道并开始微调：\n\n1.  双击您要编辑的事件。这将在 `Edit`\
  \ 窗口中打开该事件。\n\n2.  如果您看不到 Automation Lane，请点击 `Show/Hide Automation Lanes` 按钮并选择\
  \ `Modulation` 选项卡。您录制的调制数据将以连续图表的形式显示在音符下方：\n\n![Figure 9.13: The Automation Lane\
  \ displaying modulation data](img/B31512_09_13.jpg)\n\n图 9.13：显示调制数据的 Automation\
  \ Lane\n\n1.  在 `Edit` 窗口中点击 `Paint` 工具，从 *图 9.10* 中选择一个选项，然后随心所欲地调整此图表。使用线条或抛物线获得平滑的变化，或尝试周期性选项（如\
  \ `Sine` 或 `Triangle`）以获得创意效果。此参数（或任何其他 CCM 参数）没有标准衡量标准，因此实验是关键。\n\n有一点重要的事情要注意：虽然\
  \ CCM 数据与音符一起录制，但它并不直接链接到音符。这意味着如果您移动音符，调制数据将保持在其原始位置，并与音符失去同步。请看这两张截图：\n\n![Figure\
  \ 9.14: Modulation data does not follow notes](img/B31512_09_14.jpg)\n\n图 9.14：调制数据不跟随音符\n\
  \n在 *图 9.14* 的左侧，我们可以看到一条平滑的曲线，经过编辑与上方的长音符完美对齐。现在，如果我们决定将音符移动到不同位置，调制曲线将保持原位，调制添加的任何表现力将与该音符失去同步，如右侧所示。要修复此问题，请启用\
  \ `Select Part Automation with Notes` 选项：\n\n![Figure 9.15: The Select Part Automation\
  \ with Notes toggle button](img/B31512_09_15.jpg)\n\n图 9.15：Select Part Automation\
  \ with Notes 切换按钮\n\n现在，当您在 `Edit` 窗口中选择一个音符或一组音符时，这些音符下方的所有调制数据也将被选中，因此您可以将它们一起移动。\n\
  \n这结束了我们对 Studio One 通用 MIDI 编辑选项的介绍。接下来，我们将了解 Pattern Editor，并讨论该窗口独有的编辑功能。\n\n\
  ## 在 Pattern Editor 中工作\n\n正如我们在 *第 6 章* 中看到的，`Pattern Editor` 是创建旨在重复的音乐创意的完美工具。虽然其严格基于网格的设计缺乏\
  \ `Edit` 窗口的“所见即所得”方法，但 Pattern Editor 提供了一些在 Studio One 其他地方不可用的独特功能。所以，让我们逐一了解这些功能。\n\
  \n要开始使用 Pattern Editor，请双击要编辑的模式。这将打开 `Pattern Editor` 窗口。就像常规的 `Edit` 窗口一样，此窗口在其下部也有一个\
  \ Automation Lane，但具有不同的选项集：\n\n![Figure 9.16: The Automation Lane of the Pattern\
  \ Editor](img/B31512_09_16.jpg)\n\n图 9.16：Pattern Editor 的 Automation Lane\n\n现在，让我们逐一了解这些选项：\n\
  \n\n\n\n\n## 音符编辑功能\n\n- **Velocity（力度）** 允许您为音符设置力度值，范围从 **0** 到 **100**。请注意，在此窗口中，您无法通过点击音符来选中它；这样做会删除该音符。相反，请点击包含该音符的通道（lane），其力度值将显示在自动化通道上。\n\
  \n- **Repeat（重复）** 可让您快速为音符添加连打音或滚奏（如鼓的滚奏）。这相当于使用我们在 *第 6 章* 中讨论的“双倍通道分辨率”方法添加滚奏。通常，**Repeat**\
  \ 值为 **0**，意味着零次重复，但您可以增加此值以添加任意数量的重复。\n\n- 使用 **Delay（延迟）** 值，您可以设置音符比其在网格上的位置更早或更晚播放。默认情况下，此设置为\
  \ **0**。输入正值可延迟音符，产生一种拖后的感觉。例如，如果您编写一个鼓点律动，军鼓和手拍声同时击中第 2 拍和第 4 拍，稍微延迟手拍声同时保持军鼓原位，将产生一种美妙、人性化的感觉，仿佛鼓手精准地卡在拍子上演奏，而鼓掌的人稍晚一点加入，这在现实生活中通常就是这种情况。如果在延迟滑块上输入负值，相应音符将在其网格位置之前播放，产生一种抢拍的感觉。这对于向鼓点律动注入兴奋感和期待感非常有用，尤其是在较快的速度下。\n\
  \n- **Probability（概率）** 是一项独特功能，用于设置特定音符被播放的可能性。这允许您为模式添加随机元素，使其更有趣、重复感更低。默认情况下，此值设为\
  \ **100%**，意味着相应音符将始终被播放。降低此值会减少其被播放的几率。这对于创作逼真的 MIDI 演奏、为模式添加人性化的变化和瑕疵非常有用。\n\n\
  掌握这些编辑功能将帮助您使用模式编辑器创建更具动态的元素，并克服过去困扰模式音序器的大多数局限。我们现在准备继续 MIDI 编辑工具之旅的最后一步 —— Note\
  \ FX。\n\n# 使用 Note FX 激发创造力\n\n**Note FX** 插件是实时处理发送给 MIDI 乐器的音符的效果处理器。这允许您在处理器的界面上尝试创意想法，而无需实际更改或编辑原始演奏。\n\
  \nStudio One 中有四个 Note FX 插件：\n\n- Arpeggiator（琶音器）\n- Chorder（和弦器）\n- Repeater（重复器）\n\
  - Input Filter（输入过滤器）\n\n我们将逐一探索这些处理器，但首先，让我们看看如何将它们加载到 MIDI 轨道上。\n\n## 加载 Note\
  \ FX 插件\n\n可以通过两种方式启动 FX 插件。这是第一种方法：\n\n1. 打开 **Browse（浏览）** 面板并转到 **Instruments（乐器）**\
  \ 选项卡。\n2. 在乐器列表中找到 **Note FX**，并点击其旁边的小三角形。这将显示系统上安装的 Note FX 插件：\n   ![Figure\
  \ 9.17: The Note FX plug-ins listed on the Browse panel](img/B31512_09_17.jpg)\n\
  \   图 9.17：浏览面板上列出的 Note FX 插件\n3. 将您想要使用的处理器拖放到 MIDI 轨道上。\n\n这是第二种方法：\n\n1. 打开您想要添加\
  \ Note FX 处理器的轨道的 **Inspector（检查器）** 面板。\n2. 找到 **Note FX** 区域。如果您使用的是小屏幕，此面板可能会显得拥挤，因此您可能需要通过调整其他区域的大小来找到它：\n\
  \   ![Figure 9.18: The Note FX box on the Inspector panel](img/B31512_09_18.jpg)\n\
  \   图 9.18：检查器面板上的 Note FX 区域\n3. 点击 **Note FX** 旁边的加号。这将显示系统上安装的 Note FX 插件列表。\n\
  4. 选择您想要使用的插件。\n\n将 Note FX 插件加载到 MIDI 轨道后，您可以通过点击轨道上的 Note FX 编辑器图标来打开其界面：\n\n\
  ![Figure 9.19: The Note FX editor button](img/B31512_09_19.jpg)\n图 9.19：Note FX\
  \ 编辑器按钮\n\n现在，让我们逐一探索每个 Note FX 插件。\n\n## Arpeggiator（琶音器）\n\n**Arpeggiator（琶音器）**\
  \ 根据来自 MIDI 轨道的和弦或单个音符，或通过键盘实时演奏的音符，生成复杂的节奏模式。此模式与工程速度同步，因此它将与音乐的其余部分保持同步。这使得 Arpeggiator\
  \ 成为为 MIDI 轨道添加动感和趣味以及创建复杂、不断演变模式的完美工具。\n\n![Figure 9.20: Arpeggiator](img/B31512_09_20.jpg)\n\
  图 9.20：Arpeggiator\n\n让我们剖析 Arpeggiator 的界面，了解其工作原理：\n\n- *图 9.20* 中高亮显示的按钮称为方向选择器。当您演奏一个和弦时，这些选择器决定该和弦音符将按哪个方向琶音化。假设您演奏一个\
  \ C 大调和弦，由 C、E 和 G 三个音符组成。每个方向选择器将按如下方式琶音化这些音符：\n  - 如果选择 **Up（向上）**（第一个选项），音符将按\
  \ C、E、G 的顺序琶音化。到达 G 后，模式将重新开始。\n  - 如果选择 **Down（向下）**，音符将按 G、E、C 的顺序琶音化。\n  - **Up\
  \ and Down（上下）** 将产生 C、E、G、E、C。\n  - **Down and Up（下上）** 将产生 G、E、C、E、G。\n  - **Random（随机）**\
  \ 将按随机顺序琶音化音符。\n  - **From Input（来自输入）** 将按您演奏音符的顺序琶音化。\n  - **Chord Mode（和弦模式）**\
  \ 将重复整个和弦，而不是琶音化它。\n\n- **Octave Range（八度范围）** 选择器指的是 Arpeggiator 播放生成音符的八度范围。如果设置为\
  \ **1**（其默认值），琶音化的音符将保持在您演奏的原始音符的同一八度内。如果设置为 **2**，琶音将跨越两个八度的跨度。最大可设置为 **4**，总共产生四个八度的范围。\n\
  \n- 左侧那个未标题的大旋钮实际上称为 **Rate（速率）** 设置。它允您为每个琶音步骤选择一个节奏值。它接受从全音符到 64 分音符的所有音长值，包括所有附点和三连音变体。\n\
  \n- **Swing（摇摆）** 允许您为琶音添加摇摆感（我们在 *第 6 章* 中讨论过摇摆）。\n\n- **Gate（门限）** 决定琶音化音符的长度。当您调低此设置时，音符会变短。调高时，音符会变长，并相互重叠。\n\
  \n- **Hold（保持）** 按钮告诉 Arpeggiator 即使您释放键盘上的琴键也继续运行。当您演奏新音符时，这些新音符将替换之前的音符。\n\n-\
  \ **Velocity（力度）**、**Input（输入）** 和 **Fix（固定）** 设置决定琶音化音符的力度值如何设定。如果您希望 Arpeggiator\
  \ 跟随您演奏时的音符力度，请选择 **Input**。如果您希望固定琶音化音符的力度，并使用 **Velocity** 旋钮拨入所需值，请选择 **Fix**。\n\
  \n琶音器创建的重复模式已成为某些音乐流派的标志，但对于其他类型的音乐，您可能希望自定义这些模式以获得更复杂、精细的编排。Studio One 的 Arpeggiator\
  \ 具有一项功能正好允许您这样做，这就是我们接下来要探索的内容。\n\n### 使用 Arpeggiator 的模式音序器\n\nArpeggiator 具有一个\
  \ **Pattern Sequencer（模式音序器）**，可用于编程详细的节奏模式。它与刚才描述的所有设置协同工作，并增加了一层额外的控制。您可以使用模式音序器为每个琶音化音符指定力度和门限值。\n\
  \n要开始使用模式音序器，请点击 Arpeggiator 右上角的 **Pattern（模式）** 按钮。**Pattern Editor（模式编辑器）** 窗口中将出现八列：\n\
  \n\n\n\n\n## 模式音序器\n\n![Figure 9.21: The Pattern Sequencer inside Arpeggiator](img/B31512_09_21.jpg)\n\
  \nFigure 9.21: The Pattern Sequencer inside Arpeggiator\n\n这些列代表由 `Arpeggiator`\
  \ 触发的步骤。向上或向下拖动某一列可调整其力度。向左或向右拖动某一列可调整其宽度（充当单个音符的门限设置）。\n\n如果您想编程一个超过八步的模式，请拖动底部的\
  \ `Pattern Length` 滑块。可用的最大步数为 32 步。\n\n以这种方式使用 `Arpeggiator` 将为您打开许多创意可能性的大门，但这只是冰山一角。您可以将\
  \ `Arpeggiator` 上的每个参数都自动化，以在整个项目中动态地改变您的模式。您甚至可以在一条轨道上分配多个琶音器，并使用自动化在它们之间来回切换。我们将在\
  \ 第 13 章 中讨论自动化。\n\n## 和弦器\n\n`Chorder` 是一款智能和弦生成器，只需弹奏单个音符即可触发和弦。这使您即使键盘技巧有限，也能轻松演奏复杂的和弦。\n\
  \n`Chorder` 的界面由两排钢琴键组成：\n\n![Figure 9.22: Chorder](img/B31512_09_22.jpg)\n\nFigure\
  \ 9.22: Chorder\n\n底部的键盘显示您在键盘上弹奏的音符。顶部的键盘显示当您弹奏该音符时将被触发的音符。键盘上方的滑块设定 `Chorder`\
  \ 生效的范围。如果您弹奏该范围之外的任何音符，`Chorder` 将忽略它。\n\n如果您是乐理新手，不知道如何构建和弦，仍然可以充分利用 `Chorder`。在\
  \ `Preset`（预设）菜单中，您会发现一组针对各种音乐流派优化的和弦组合。打开界面顶部的 `Preset` 下拉菜单（查找标记为 `default` 的字段），选择一个符合您风格的和弦组合，即可开始使用。但是，如果您想编程自己的和弦以在\
  \ `Chorder` 中使用，请继续阅读。\n\n### 编程 Chorder 以使用自定义和弦\n\n您可以教会 `Chorder` 触发任意数量的自定义和弦。作为示例，我们将对其进行编程，以便当我们在\
  \ MIDI 键盘上弹奏 `C2` 音符时，触发一个 C 大七和弦。请按以下步骤操作：\n\n1. 点击 `Learn Mode`（学习模式）按钮。\n2. 在下方的键盘上，点击您想用作触发器的音符。在本例中，将是\
  \ `C2`。\n3. 在上方的键盘上，点击您希望在弹奏 `C2` 时由 `Chorder` 触发的音符。在本例中，这些将是 `C`、`E`、`G` 和 `B`。请随意以您喜欢的方式排列这些音符以创建不同的和弦排布，添加张力音如\
  \ `D`、`F#` 和 `A`，并使用不同的八度。您可以使用上方键盘上任何八度的任何音符。\n4. 您也可以通过在 MIDI 键盘上弹奏音符来添加音符，而不必用鼠标点击上方的键盘。`Chorder`\
  \ 将以相同的方式记录它们。\n5. 如果添加了错误的音符，再次点击它或在键盘上再次弹奏它即可将其移除。\n6. 要输入另一个和弦，根据需要重复步骤 2 到 4\
  \ 多次。\n7. 再次点击 `Learn Mode` 按钮以退出学习模式。\n\n现在，您只需在轨道上录制触发音符。当您播放录音时，`Chorder` 将自动生成您编程的和弦。\n\
  \n## 重复器\n\n`Repeater` 是 `Arpeggiator` 的简化版。它不会对接收到的音符进行琶音化，而是简单地以预定间隔重复它们。这对于从长的、静止的音符创建节奏序列非常有用。\n\
  \n`Repeater` 界面上的大多数设置与 `Arpeggiator` 上的设置相同：\n\n![Figure 9.23: Repeater](img/B31512_09_23.jpg)\n\
  \nFigure 9.23: Repeater\n\n为避免重复（此处无双关语之意），我们将仅介绍 `Repeater` 独有的设置。\n\n`Steps`（步数）决定原始音符将被重复多少次。默认值为\
  \ `8`，但最高可达 `32`。完成此重复次数后，`Repeater` 将停止。\n\n`Velocity`（力度）、`Gate`（门限）和 `Pitch`（音高）的\
  \ `Scale`（缩放）设置允许您逐步更改这些值。例如，通过调整 `Velocity` 的 `Scale` 设置，您可以指示 `Repeater` 使每个后续步骤的力度比前一个步骤增加或减少。\n\
  \n所有步骤的力度和长度分别由 `Velocity` 和 `Gate` 设置全局控制。您可以通过激活右上角的单个 `Velocity` 和 `Pitch` 按钮来覆盖这些设置，并为单个步骤设置特定的力度和长度值。激活后，您将能够拖动音序器窗口中的列来调整其长度和力度，就像在\
  \ `Arpeggiator` 中一样。\n\n## 输入过滤器\n\n`Input Filter` 是一款实用插件，可让您在不需要的音符到达 MIDI 设备之前将其过滤掉。当您希望乐器仅响应特定音符时，这非常有用，从而产生一些创造性的应用。\n\
  \n让我们来看看 `Input Filter` 是如何工作的。界面很简单：\n\n![Figure 9.24: Input Filter](img/B31512_09_24.jpg)\n\
  \nFigure 9.24: Input Filter\n\n键范围内的音符将被允许通过，范围外的音符将被阻止。如图 9.24 所示，`Input Filter`\
  \ 设置为允许 `C2` 和 `C4` 之间的所有音符通过，阻止所有其他音符。您可以通过直接在 `Key Range`（键范围）字段两侧的框中输入音符名称，或使用键盘上方的滑块来编辑此范围。\n\
  \n`Input Filter` 还允许您为被允许通过的音符设置力度范围。请记住，在 Studio One 中，MIDI 音符的力度值可以在 `0%` 和 `100%`\
  \ 之间。您可以分别使用 `Min. Velocity`（最小力度）和 `Max. Velocity`（最大力度）字段设置力度的下限和上限阈值。高于或低于这些阈值的任何音符都将被阻止。\n\
  \n现在，让我们想几个这些功能有用的场景。例如，假设您想将键盘分割给两件乐器，以便当您弹奏低音区时，乐器 A 发出贝斯吉他声音，而当您弹奏高音区时，乐器 B 发出钢琴声音。您可以按如下方式操作：\n\
  \n1. 创建两条乐器轨道，一条用于乐器 A，一条用于乐器 B。\n2. 为两条轨道选择相同的 MIDI 键盘作为输入源。\n3. 在两条轨道上都加载一个 `Input\
  \ Filter`。\n4. 在乐器 A 轨道（贝斯吉他）的 `Input Filter` 上，将允许的音符范围设置在 `C0` 和 `C2` 之间。\n5.\
  \ 在乐器 B 轨道（钢琴）的 `Input Filter` 上，将允许的音符范围设置在 `C2` 和 `C8` 之间。\n\n这是另一个场景。假设您正在制作一个管弦乐编排。乐器\
  \ A 为您提供弦乐组的声音，您希望乐器 B 仅在您用力弹奏以重音某些音符时加入并演奏定音鼓声音。具体设置如下：\n\n1. 创建两条乐器轨道，一条用于乐器 A，一条用于乐器\
  \ B。\n2. 为两条轨道选择相同的 MIDI 键盘作为输入源。\n3. 在两条轨道上都加载一个 `Input Filter`。\n4. 在乐器 A 轨道（弦乐）的\
  \ `Input Filter` 上，将允许的力度范围设置在 `0%` 和 `100%` 之间。\n5. 在乐器 B 轨道（定音鼓）的 `Input Filter`\
  \ 上，将最小力度阈值设置为 `75%`。\n\n现在，只有当您以高于 `75%` 的力度演奏时，才能听到定音鼓。\n\n\n\n\n\n每个 Note FX\
  \ 插件都提供了令人兴奋的创意实验机会，但当你开始将它们级联，使一个触发另一个时，可能性将变得令人难以置信。尝试在同一轨道上插入一个和弦器，然后是一个重复器，以及两个琶音器。将琶音器设置为截然不同的时间值，你将进入未知领域——这是激发灵感和点燃创造力的即时途径！\n\
  \n在本节中，我们探讨了 Note FX 插件，它们提供了广泛的工具和效果，可用于以多种方式操控和转换 MIDI 数据，让你能够创作出新颖独特的音乐创意。\n\n\
  ## 总结\n\n在本章中，我们深入探讨了 Studio One 丰富的 MIDI 编辑功能列表，并讨论了多种操控 MIDI 数据的方法，用于修正和创意目的。你学习了如何调整演奏的音高、时序和其他参数，以实现广泛的音乐效果。你还更深入地了解了什么是\
  \ Note FX 插件，以及如何利用它们从简单的创意中创建复杂的编曲。\n\n掌握这些 MIDI 编辑功能将使你能够探索新的可能性，并让你的音乐朝新的方向发展。\n\
  \n在下一章中，我们将讨论 Studio One 的全局轨道。你将学习如何为项目添加和弦以供所有乐器跟随，如何处理视频，以及如何添加歌词和标记以便于导航。掌握全局轨道将是将你的项目提升到新高度的下一步。\n"
- "## 第 10 章：使用全局轨道\n\nStudio One 中的全局轨道允许用户控制影响整个项目的参数，而不仅仅是特定轨道或区域。这些轨道可用于动态更改歌曲的整体属性，例如调性、速度或和声结构。作为一种创意工具，它们允许你快速尝试新想法、探索各种可能性，并在满意后轻松确定下来。全局轨道还允许你在项目中包含额外内容，例如视频或歌词。\n\
  \n在本章中，我们将深入研究 Studio One 的全局轨道，并学习如何利用其强大功能更好地控制你的项目。我们将涵盖以下主题：\n\n*   使用和弦轨道控制歌曲的和声内容\n\
  *   使用标尺、标记和歌词轨道更高效地处理项目\n*   使用视频轨道为视频添加声音和音乐\n\n## 技术要求\n\n要学习本章内容，你需要在电脑上激活 Studio\
  \ One。\n\n## 使用和弦轨道控制歌曲的和声内容\n\n**和弦轨道**提供了一种强大且直观的方式来创建和操控和弦进行，并控制 MIDI 乐器演奏的音符。这让你有机会实时尝试新的和声创意并构建复杂的和弦进行。\n\
  \n即使你完全不懂乐理，对和弦如何运作知之甚少，你仍会发现和弦轨道非常有用。这是因为和弦轨道与 Studio One 内置的和弦检测算法协同工作，该算法可以自动识别音频录音中的和弦并将其转录。这为广泛的可能性打开了大门。例如，如果你喜欢现有歌曲的和弦进行，你可以使用此功能提取其和弦，并将这些和弦作为模板来创作你自己的歌曲。\n\
  \n和弦进行不被视为知识产权，也不受任何形式的版权保护，因此请随意使用此技术来丰富你作品的和声内容。\n\n现在，让我们看看如何在项目中使用和弦轨道。\n\n\
  ### 和弦轨道入门\n\n默认情况下，和弦轨道处于隐藏状态。要使其可见，请点击**全局轨道可见性**按钮，并从全局轨道列表中选择**和弦**：\n\n![图\
  \ 10.1：全局轨道可见性按钮和全局轨道列表](img/B31512_10_1.jpg`)\n\n图 10.1：全局轨道可见性按钮和全局轨道列表\n\n> **提示**\n\
  >\n> 我们在前几章中已经介绍了其中三个全局轨道。我们在第 4 章中探讨了**速度轨道**和**拍号轨道**，在第 7 章中探讨了**编曲轨道**。\n\n\
  一个空的和弦轨道现在将显示在**编曲**窗口的顶部，准备填入你歌曲的和弦。如果你的项目中已经有音频或 MIDI 录音，Studio One 可以分析该录音，检测其中的和弦，并自动将这些和弦提取到和弦轨道。如果你还没有录音，可以手动输入和弦。接下来我们将介绍这两种方法。\n\
  \n### 自动检测和提取和弦\n\nStudio One 拥有强大的和弦检测算法，可以准确检测音频或 MIDI 录音中的和弦。如果你有一段录音想用作歌曲的和声模板，可以使用此功能自动填充项目和弦轨道上的和弦。\n\
  \n要从音频录音中提取和弦，请按以下步骤操作：\n\n1.  右键点击包含音频录音的事件。这将打开一个弹出菜单：\n\n    ![图 10.2：检测音频录音中的和弦](img/B31512_10_2.jpg`)\n\
  \n    图 10.2：检测音频录音中的和弦\n\n2.  在此菜单中，转到**音频**并选择**检测和弦**。Studio One 将分析录音，识别其中的和弦，并在音频事件的下半部分显示这些和弦。\n\
  \n3.  然后，再次右键点击音频事件，转到**音频**，这次选择**提取到和弦轨道**。Studio One 将用刚刚检测到的和弦填充和弦轨道。\n\n  \
  \  ![图 10.3：和弦轨道（顶部）显示从音频事件（底部）提取的和弦](img/B31512_10_3.jpg`)\n\n    图 10.3：和弦轨道（顶部）显示从音频事件（底部）提取的和弦\n\
  \n从 MIDI 事件提取和弦甚至更简单——只需将事件拖动到和弦轨道即可。就是这么简单！\n\n或者，右键点击事件，在弹出菜单中转到**乐器片段**，然后选择**提取到和弦轨道**。现在让我们看看第二种方法。\n\
  \n### 手动输入和弦信息\n\n如果你知道歌曲中将使用的和弦，可以手动将它们添加到和弦轨道。操作方法如下：\n\n1.  按键盘上的 `5` 选择**画笔**工具。\n\
  \n2.  点击你想输入新和弦的小节。这将添加一个暂定的 C 大调和弦（在*图 10.4*中标记为 **C**），持续整个小节的时长：\n\n    ![图 10.4：手动向和弦轨道添加和弦](img/B31512_10_4.jpg`)\n\
  \n    图 10.4：手动向和弦轨道添加和弦\n\n3.  按键盘上的 `1` 选择**箭头**工具。\n\n4.  如果你希望该和弦持续时间比一个小节长或短，将**箭头**工具移至和弦事件的右边缘，向左或向右拖动以根据需要调整其大小。\n\
  \n5.  双击和弦轨道上的和弦名称。这将打开**和弦选择器**窗口：\n\n    ![图 10.5：和弦选择器窗口](img/B31512_10_5.jpg`)\n\
  \n    图 10.5：和弦选择器窗口\n\n6.  使用该窗口中心的五度圈轮盘来选择你的和弦。\n\n7.  要选择基本**大调**和**小调**和弦之外的和弦类型，请使用左侧的**类型**选择器。\n\
  \n8.  如果你想添加上层和弦音（也称为张力音），请使用右侧的**音程**部分。\n\n\n\n\n\n# 向和弦轨道添加和弦（续）\n\n4. 默认情况下，`Chord\
  \ Track`（和弦轨道）使用根位来排列和弦内的音符。根位是指和弦的根音——即赋予和弦名称的那个音——是最低音。有时，您可能希望在低音部使用和弦根音以外的音符，以创建具有不同色彩的和弦，这被称为转位或分数和弦。在这种情况下，请使用右侧的\
  \ `Bass`（低音）部分来选择应作为低音的音符。命名完和弦后，使用 `Chord Selector`（和弦选择器）窗口左上角的箭头键移至下一个和弦。\n\n\
  5. 重复步骤 1 至 9，添加所需数量的和弦。\n\n6. 您可以在 `Chord Track`（和弦轨道）上移动、复制和粘贴和弦，就像在 `Arrange`（编排）窗口中操作其他事件一样，使用\
  \ `Arrow`（箭头）工具的标准编辑选项即可。\n\n作为步骤 6 至 9 的替代方案，您可以直接从 MIDI 键盘演奏和弦，让 Studio One 自动识别并命名这些和弦。为此，请启用\
  \ `Instrument Input`（乐器输入）按钮（图 10.5 中高亮显示）。现在，当您在键盘上弹奏和弦时，Studio One 会识别它并自动将其放置在\
  \ `Chord Track`（和弦轨道）上。\n\n既然您已经填充了 `Chord Track`（和弦轨道），下一步就是让项目中的 MIDI 乐器轨道跟随这些和弦，这正是我们接下来要介绍的内容。\n\
  \n# 设置乐器轨道跟随和弦轨道\n\n默认情况下，项目中的 `Instrument Tracks`（乐器轨道）不受 `Chord Track`（和弦轨道）影响。这意味着您在\
  \ `Chord Track`（和弦轨道）上输入的和弦不会改变 `MIDI events`（MIDI 事件）的播放方式——至少目前还不会。您可以使用两种方法确保\
  \ `Instrument Tracks`（乐器轨道）中的 `MIDI events`（MIDI 事件）跟随 `Chord Track`（和弦轨道）上的和弦。让我们从简单的方法开始。\n\
  \n## 通过拖放添加和弦\n\n一旦您在 `Chord Track`（和弦轨道）上布置好歌曲的和弦，只需将这些和弦拖放到任意 `Instrument Track`（乐器轨道）上。Studio\
  \ One 会自动创建与每个和弦对应的 `MIDI notes`（MIDI 音符），其时长与 `Chord Track`（和弦轨道）上的和弦事件相同：\n\n\
  ![Figure 10.6: Drag a chord to an Instrument Track to automatically create notes\
  \ corresponding to that chord](img/B31512_10_6.jpg)\n\n图 10.6：将和弦拖放到乐器轨道上，自动创建对应该和弦的音符\n\
  \n如果您是乐理新手，尚不清楚如何构建和弦，这简直是救星。只需向该 `Instrument Track`（乐器轨道）添加 `Arpeggiator`（琶音器），即可将这些冗长、静态的音符变成更有趣的模式！\n\
  \n如果您如图 10.2 所示对音频事件应用了和弦检测，也可以直接将该音频事件拖放到 `Instrument Track`（乐器轨道）上。Studio One\
  \ 会自动创建对应每个检测到的和弦的 `MIDI notes`（MIDI 音符）。\n\n这种拖放方法快速简便，但其缺点是 `Instrument Track`（乐器轨道）和\
  \ `Chord Track`（和弦轨道）仍未关联。因此，如果您决定在 `Chord Track`（和弦轨道）上尝试新和弦，`Instrument Track`（乐器轨道）仍会播放原始和弦。下一种方法将通过链接这两条轨道来解决此问题。\n\
  \n## 设置“跟随和弦”参数\n\n`Chord Track`（和弦轨道）最大的优势在于能让您轻松尝试新的和声构思。只需更改 `Chord Track`（和弦轨道）中的一个和弦，项目中的所有轨道都会自动修改以符合新和弦。要实现此功能，我们需要设置项目中的轨道跟随\
  \ `Chord Track`（和弦轨道）。具体操作如下：\n\n1. 选择一条应跟随 `Chord Track`（和弦轨道）的轨道，然后点击 `Inspector`（检查器）按钮以打开\
  \ `Inspector`（检查器）窗口。\n\n2. 在 `Inspector`（检查器）窗口中，点击打开 `Follow chords`（跟随和弦）下拉菜单：\n\
  \n![Figure 10.7: The Follow chords drop-down menu](img/B31512_10_7.jpg)\n\n图 10.7：跟随和弦下拉菜单\n\
  \n3. 在此下拉菜单中，选择当您更改 `Chord Track`（和弦轨道）上的和弦时，希望该轨道上的音符如何被修改。可用选项如下：\n\n- `Off`（关闭）：这是默认模式。`Instrument\
  \ Track`（乐器轨道）不跟随 `Chord Track`（和弦轨道）。\n\n- `Parallel`（平行）：选择此选项后，当您更改 `Chord Track`（和弦轨道）上的和弦时，`Instrument\
  \ Track`（乐器轨道）上的音符将平行移调至原始和弦结构，保持音符间相同的音程。为了说明这一点，请看图 10.8 的示例。我从三个相同的 C 大七和弦开始。我保持第一个（左侧）不变。然后，使用\
  \ `Chord Track`（和弦轨道），我将第二个（中间）改为 F 大七，第三个（右侧）改为 A 小七。这是它们使用 `Parallel`（平行）设置移调后的结果：\n\
  \n![Figure 10.8: MIDI notes modified by the Follow chords | Parallel setting](img/B31512_10_8.jpg)\n\
  \n图 10.8：由跟随和弦 | 平行设置修改的 MIDI 音符\n\n这会导致和弦之间出现大跳进，从配器角度来看并不理想，但如果您希望所有和弦保持相同的排布和织体，这可能会很有用。\n\
  \n- `Narrow`（窄范围/就近）：在此模式下，音符会移至新和弦可用的最近音符。这使得从一个和弦到下一个和弦的过渡更加平滑，模仿了一种称为声部进行的配器技巧。这是图\
  \ 10.8 中相同的和弦，这次使用 `Narrow`（窄范围）设置修改后的结果：\n\n![Figure 10.9: MIDI notes modified\
  \ by the Follow chords | Narrow setting](img/B31512_10_9.jpg)\n\n图 10.9：由跟随和弦 |\
  \ 窄范围设置修改的 MIDI 音符\n\n- `Bass`（低音）：此选项用于低音乐器。它将和弦的根音或低音分配给和弦中的最低音。使用此模式的最佳方式是删除和弦中除最低音以外的所有音符，然后将该音符移调至第一八度（C1\
  \ 到 C2 之间的八度）。\n\n4. 双击 `Chord Track`（和弦轨道）上的一个和弦。这将打开 `Chord Selector`（和弦选择器）窗口（图\
  \ 10.5）。根据需要更改和弦。\n\n现在，当您更改 `Chord Track`（和弦轨道）上的和弦时，所有 `Instrument Tracks`（乐器轨道）都会相应修改。`Audio\
  \ Tracks`（音频轨道）也可以设置为跟随 `Chord Track`（和弦轨道），但它们有一些限制，且涉及一些额外步骤。我们接下来将讨论这些内容。\n\n\
  # 设置音频轨道跟随和弦轨道\n\n对于 `MIDI` 素材，检测和弦和移调音符相当简单，但处理音频时，过程会复杂得多。尽管近年来音频素材的检测和移调算法有了巨大发展，但它们仍不完全准确，且可能在音质上产生明显的伪影。了解这些限制将有助于您获得更好的结果。在本节中，我们将介绍音频素材特有的问题，并讨论几种变通方法。\n\
  \n## 和弦检测失败时该怎么办\n\n在音频录音上检测和弦并非易事。当您将一首流行歌曲的 `MP3` 文件拖入 Studio One 并让它检测其中的和弦时，大多数情况下您会对结果的准确性印象深刻。然而，有时检测并不那么准确，这是可以理解的——典型的流行歌曲中有太多元素可能会干扰算法。此处算法面临的最大挑战是仅关注歌曲和声语境中合理的声音，并过滤掉其他所有声音。如果失败，和弦检测将产生错误结果。\n\
  \n如果您已经知道歌曲的和弦，可能会觉得这无关紧要——您只需在 `Chord Track`（和弦轨道）上手动输入和弦即可。然而，Studio One 必须知道\
  \ `Audio Track`（音频轨道）上正在播放哪些和弦，才能在跟随 `Chord Track`（和弦轨道）时正确地将它们移调。\n\n如果您的音频轨道未能正确跟随\
  \ `Chord Track`（和弦轨道），请按以下步骤修复此问题：\n\n\n\n\n\n1. 右键单击音频事件。这将打开图 10.2 所示的弹出菜单。\n\n\
  2. 转到 `Audio` 并选择 `Apply Chords from Chord Track`。这将覆盖对音频事件执行的任何和弦检测，并改用 `Chord\
  \ Track` 上的和弦填充它。\n\n现在，当你对 `Chord Track` 进行更改时，音频事件将被准确地转调。\n\n### 音频素材特有的选项\n\n\
  当你转调 MIDI 音符时，基本上是在告诉 MIDI 乐器在不同的音高触发相同的声音。虽然这可能会改变声音的音色，但不会降低音质。另一方面，转调音频事件是一个复杂得多的操作，需要改变音频录音中交织在一起的波形频率。此操作称为\
  \ `pitch-shifting`（移调）。\n\n近年来，移调算法有了显著发展，以至于将音频录音转调几个半音不会产生任何明显的副作用。然而，当你使用 `Chord\
  \ Track` 时，最终会以大得多的音程转调音频录音，这不可避免会导致音质损失。因此，让我们探讨一下 Studio One 内置的几种缓解此问题的方法。\n\n\
  在上一节中，我们介绍了 `Follow Chord`（跟随和弦）菜单下的标准选项（图 10.7）。当你在音频轨道上工作时，此菜单提供两个额外选项。如果你对上一节介绍的选项不满意，可以试试这些额外选项：\n\
  \n*   `Scale`（音阶）：此模式使用一种非常智能的算法。首先，它根据原始音频录音构建一个音乐音阶。然后，它转调该音阶的音符以跟随 `Chord Track`。这项技术相当先进，但有一个注意事项——为了使其正常工作，算法首先必须能够正确检测原始录音中的和弦。如果检测不准确，转调也无法正确工作。如果是这样，请尝试我们在\
  \ *What to do when chord detection fails*（和弦检测失败时该怎么办）一节中讨论的方法，或继续尝试下一个选项。\n\n*\
  \   `Universal`（通用）：在此模式下，算法将只检测音频录音中的音符，然后将它们转调为你在 `Chord Track` 上选择的和弦的音符。这消除了必须正确检测和弦的前提条件，通常能产生稳妥的结果。\n\
  \n除了讨论的 `Follow Chord` 选项外，每个音频轨道还有一个 `Tune Mode`（调音模式）选择器，可帮助你针对该轨道中包含的音频素材类型优化移调算法：\n\
  \n![Figure 10.10: The Tune Mode selector](img/B31512_10_10.jpg)\n\nFigure 10.10:\
  \ The Tune Mode selector\n\n使用此选择器告诉算法它正在处理什么类型的素材，但不要过于字面地理解这些选项名称。例如，根据乐器的音色，`Guitar`（吉他）选项在钢琴录音上可能会产生更好的效果。所以，大胆尝试不同的选项，直到获得最佳结果。一如既往，实验是关键。\n\
  \n尽管性能惊人，但移调技术尚不完美。这可能会在几年内改变，但今天，将音频素材移调超过几个半音仍然不是好主意，尤其是当该素材在歌曲中很突出时。就音频轨道而言，你最好的策略是仅使用\
  \ `Chord Track` 来尝试新的和弦和和声构思。一旦你找到满意的和弦进行，重新录制音频轨道以匹配这些新和弦。这样，你的项目将不受移调导致的音质下降影响。\n\
  \n在本节中，我们探讨了 `Chord Track` 并讨论了使用它来丰富项目和声内容的最佳实践。接下来，我们将介绍三种全局轨道，它们旨在帮助你在项目中更有效地导航。\n\
  \n# 使用 Ruler、Marker 和 Lyric Tracks 更高效地处理项目\n\n随着项目的增长，在其中找到方向会变得更难。试图通过不断缩放和滚动时间轴来定位项目中的某个点既耗时又分散注意力。本节将介绍的全局轨道旨在帮助你平滑导航并精确定位任何项目中的重要点。虽然它们不是\
  \ Studio One 中最令人兴奋的功能，但它们肯定会让生活更轻松，并让你保持专注。\n\n能够标记和定位项目中的重要点在团队协作并开始在合作者间共享文件时变得更加重要，因为它允许每位贡献者在打开项目时立即进入状态。\n\
  \n让我们从探索 `Ruler Track`（标尺轨道）开始，它是全局轨道家族中最简单的成员。\n\n## 使用 Ruler Track 跟踪不同的时间单位\n\
  \n`Arrange`（编排）窗口顶部的 `Ruler`（标尺）以音乐格式显示时间——小节、拍、四分音符等。当你在做音乐项目时这很合理，但对于任何其他应用则完全无关。例如，如果你编辑播客，可能会被要求“删除\
  \ 8 分 23 秒处的咳嗽声”。如果你为电影做声音设计，任务可能是“在第 00:02:26:18 帧添加爆炸音效”。\n\n作为解决方案，你可以更改标尺上显示的时间单位。为此，打开上方面板上的\
  \ `Timebase`（时间基准）下拉菜单。在这里，你可以将标尺设置为以秒或帧显示时间：\n\n![Figure 10.11: The Timebase drop-down\
  \ menu](img/B31512_10_11.jpg)\n\nFigure 10.11: The Timebase drop-down menu\n\n然而，如果你需要同时看到帧和音乐单位的时间怎么办？这在配乐中非常常见，例如你可能被要求“创作一个\
  \ 16 小节的动作提示，精确结束在第 00:02:26:18 帧的爆炸处”。这就是 `Ruler Track` 的用武之地。\n\n`Ruler Track`\
  \ 在 `Arrange` 窗口默认标尺下方添加一个额外的标尺，允许你以辅助格式显示时间。这样，你就可以在 `Arrange` 窗口顶部拥有两个独立的标尺，为不同目的显示不同的时间单位。\n\
  \n点击 `Global Track Visibility`（全局轨道显示）按钮（图 10.1）使 `Ruler Track` 可见。然后，使用其下拉菜单选择你想查看的时间单位：\n\
  \n![Figure 10.12: The Ruler Track](img/B31512_10_12.jpg)\n\nFigure 10.12: The Ruler\
  \ Track\n\n请注意，在图 10.12 中，`Arrange` 窗口的原生标尺（顶部）以音乐格式显示时间，而 `Ruler Track`（底部）设置为以秒显示时间。\n\
  \n`Ruler Track` 仅供视觉参考。它不会影响 `Snap to Grid`（吸附到网格）功能的行为。`Arrange` 窗口中的事件将吸附到顶部标尺上选择的任何时间单位。\n\
  \n现在我们知道了如何显示正确的时间单位，下一步是跳转到时间轴上的任意位置。这将由我们的下一个全局轨道来实现。\n\n## 使用 Marker Track 进行轻松导航\n\
  \n`Marker Track`（标记轨道）允许你通过在时间轴上的关键点放置标记（如段落的开始和结束，或特定事件的位置）来轻松导航项目。你可以为标记添加描述性标签，轻松跟踪项目中发生的情况并掌握工作进度。\n\
  \n`Marker Track` 可用于帮助管理和组织项目，尤其是大型复杂的制作。如果你与其他人合作，`Marker Track` 可以成为沟通和协作的宝贵工具。\n\
  \n要向项目添加标记，请按如下步骤操作：\n\n1. 点击 `Global Track Visibility` 按钮并选择 `Marker`。这将显示 `Marker\
  \ Track`。\n\n\n\n\n## 使用标记进行导航\n\n点击**标尺**以将时间线放置在您想要添加标记的位置。如果您知道标记应放置的确切位置（例如，制作团队给了您特定的时间码），您可以直接将其输入到下方面板上的时间指示器中：\n\
  \n![Figure 10.13: Time indicators on the lower panel](img/B31512_10_13.jpg)\n\n\
  *图 10.13：下方面板上的时间指示器*\n\n1.  现在，转到 `Marker Track` 并点击 `+` 号。这将添加一个新标记。\n2.  双击标记并给它一个描述性的名称，例如\
  \ `Verse`、`Chorus` 等。\n3.  重复*步骤 2*到*步骤 4*以添加您需要的任意数量的标记：\n\n![Figure 10.14: Adding\
  \ markers on the Marker Track](img/B31512_10_14.jpg)\n\n*图 10.14：在标记轨道上添加标记*\n\n\
  1.  通过选择标记并点击 `Marker Track` 上的 `-` 号来删除标记。\n\n添加标记后，您可以使用它们在项目中轻松导航。例如，如果您在项目的某个片段中间工作，想要跳转到该片段的开头或结尾，请输入\
  \ `Shift` + `N` 跳转到下一个标记，或输入 `Shift` + `B` 跳转到上一个标记。\n\n您也可以通过使用小键盘上的数字键直接跳转到标记。标记的编号方式如下——当您首次创建歌曲时，Studio\
  \ One 会创建两个标记，分别标记为 `Start` 和 `End`，并将它们放置在时间线的开头和结尾。这些标记分别被分配编号 `1` 和 `2`。这些标记的名称和编号无法更改。然后，您使用\
  \ `Marker Track` 添加的每个标记都会按顺序编号，从 `3` 开始。您可以通过按下小键盘上对应的数字来跳转到任意标记。如果您有两位数编号的标记，请输入\
  \ `Ctrl` + `Alt` + `M` (Windows) 或 `Cmd` + `Option` + `M` (Mac)，然后在弹出的对话框中输入编号。\n\
  \n要查看所有标记及其对应编号的列表，请选择 `Marker Track` 并打开 `Inspector` 窗口：\n\n![Figure 10.15: Markers\
  \ listed in the Inspector window](img/B31512_10_15.jpg)\n\n*图 10.15：检查器窗口中列出的标记*\n\
  \n标记对于组织和导航很有效，但 Studio One 有一项功能将这一功能提升到了一个全新的水平——`Lyric Track`（歌词轨道）。接下来我们将探讨这一点。\n\
  \n## 使用歌词轨道\n\n`Lyric Track` 提供了一种便捷的方式，在您录制或播放项目时实时在屏幕上显示歌曲歌词。这使得在制作过程中更容易保持节奏/进度。如果您自己录制演唱，这能免去您将歌词写在纸上并跟踪它们的麻烦。如果您录制别人的歌，它将帮助您更轻松地在歌曲中找到方向。如果您与其他音乐家或制作人合作，`Lyric\
  \ Track` 可以成为沟通和协作的宝贵工具。当您与团队的其他成员共享项目时，他们也能看到歌词，让所有人保持一致并理解歌曲的结构。\n\n`Lyric Track`\
  \ 提供了用户友好的界面来输入和编辑歌词，使调整歌词的时机和位置以匹配音乐变得容易。要开始使用 `Lyric Track`，请按以下步骤操作：\n\n1.  点击\
  \ `Global Track Visibility`（全局轨道可见性）按钮并选择 `Lyrics`（歌词）。这将显示 `Lyric Track`。\n2. \
  \ 要开始添加歌词，只需双击 `Lyric Track` 上的所需位置并开始输入：\n\n![Figure 10.16: Typing lyrics on the\
  \ Lyric Track](img/B31512_10_16.jpg)\n\n*图 10.16：在歌词轨道上输入歌词*\n\n3.  要开始新行并前进到下一小节，请按\
  \ `Enter`。\n4.  要在不开始新行的情况下前进到下一小节，请按 `Tab`。\n\n输入歌词后，您可以使用 `Arrow`（箭头）工具来编辑它们，就像在\
  \ `Arrange`（编排）窗口中编辑其他事件一样。拖动以移动它们以微调位置，复制一组歌词事件以在下一段副歌中重复，并对它们进行排列以适应歌曲结构。\n\n\
  要在同一页面查看歌词，请点击 `Lyric Track` 上的 `L` 按钮。这将打开 `Lyrics Display`（歌词显示）：\n\n![Figure\
  \ 10.17: The Lyrics Display](img/B31512_10_17.jpg)\n\n*图 10.17：歌词显示*\n\n`Lyrics\
  \ Display` 将以卡拉 OK 风格，与时间线同步显示歌曲歌词。随着项目播放，歌词将自动滚动。当前演唱的行将以蓝色显示。之前的行将显示为灰色，之后的行将显示为白色。您还可以点击\
  \ `Lyrics Display` 上的某一行以跳转到歌曲中的该特定位置。\n\n以下是使用 `Lyrics Display` 时的两个实用技巧：\n\n*\
  \   录制人声时，您可能希望歌词稍微提前显示，以便歌手知道接下来的内容。为此，请点击 `Lyrics Display` 上的扳手图标，进入 `Settings`（设置），然后选择\
  \ `Ahead`（提前）。这将允许您为显示的歌词设置时间偏移。\n*   如果您在录制时从屏幕阅读歌词，而麦克风离屏幕较远，您可能希望增加 `Lyric Display`\
  \ 的字体大小。点击扳手图标，进入 `Settings`，然后选择 `Font Size`（字体大小）。\n\n在本节中，我们探讨了 Studio One 中旨在帮助您更好地控制项目的三种全局轨道类型。接下来，我们将深入了解\
  \ `Video Track`，并了解如何将视频文件集成到您的项目中，为电影或多媒体制作配乐或创作声音设计。\n\n# 使用视频轨道为视频添加声音和音乐\n\n\
  `Video Track` 允许您向项目添加一个或多个视频文件。然后您可以使用 `Audio Tracks`（音频轨道）和 `Instrument Tracks`（乐器轨道）为视频创建对话、音效和音乐。\n\
  \n`Video Track` 提供了一种强大且直观的方法，为电影、视频和其他多媒体项目添加完美同步的音频，即使您在视频后期制作方面经验有限。要开始使用 `Video\
  \ Track`，我们将首先探讨如何向项目添加视频文件。\n\n## 导入视频文件\n\n要导入视频文件，只需将其从 `File Explorer`（文件资源管理器，Windows）或\
  \ `Finder`（访达，Mac）拖放到您的项目中。`MPEG` 和 `M4V` 文件在两个操作系统上均受支持；在 Mac 电脑上，也可以导入 `QuickTime`\
  \ 文件。\n\n您可以根据需要将任意数量的视频文件导入同一个项目，但请确保它们具有相同的文件格式和帧率。如果您导入文件类型和帧率混杂的文件，Studio One\
  \ 会尽力兼容，但您可能会遇到系统不稳定甚至崩溃的情况。\n\n如果您是第一次处理视频文件，不了解文件类型和帧率，请别担心。只需安装 `Handbrake`，这是一个免费的开源工具，用于转换视频文件，它会为您将所有视频文件转码为相同的文件类型和帧率。请在此获取：[`https://handbrake.fr`](https://handbrake.fr)。\n\
  \n> **提示**\n>\n> 高分辨率播放视频文件对大多数计算机来说是一项繁重的任务。如果您处理的视频分辨率很高（通常标记为 `4K` 或 `Ultra HD`），请使用\
  \ `Handbrake` 创建一个低分辨率版本并将其导入您的项目。这样，您就能释放计算机资源，将更多算力分配给音频制作。\n\n## 导航视频轨道和视频播放器\n\
  \n当您导入视频文件时，Studio One 会自动创建一个 `Video Track` 并将文件放置其中。然后它会花一点时间扫描视频、创建缩略图，并将它们横跨在\
  \ `Arrange` 窗口中：\n\n![Figure 10.18: The Video Track (top) and the Audio Sub-Track\
  \ (bottom)](img/B31512_10_18.jpg)\n\n*图 10.18：视频轨道（顶部）和音频子轨道（底部）*\n\n\n\n# 在 Studio\
  \ One 中处理视频\n\n如果视频文件已包含音频，该音频将被提取到缩略图正下方的一个特殊轨道中，称为 `Audio Sub-Track`（音频子轨道）。\n\
  \n`Video Track`（视频轨道）上显示的缩略图非常适合在时间线上直观地定位特定场景或帧，但它们无法用于实际观看视频。这时就需要用到 `Video Player`（视频播放器）。`Video\
  \ Player` 是一个浮动窗口，它会根据 `Arrange`（编排）窗口中时间线的位置同步播放视频：\n\n![图 10.19：视频播放器](img/B31512_10_19.jpg)\n\
  \n**图 10.19：视频播放器**\n\n你可以调整此窗口的大小并将其放置在任意位置。要切换其可见性，请转到顶部菜单的 `View`（视图）并选择 `Video\
  \ Player`（视频播放器）。\n\n现在我们已经导入了视频文件并探索了基本界面，准备开始处理视频了。\n\n## 编辑视频\n\n在开始讨论视频项目的音频制作之前，值得一提的是\
  \ Studio One 也能对视频文件执行基本的编辑功能。你可以在 `Video Track`（视频轨道）上排列多个视频文件，并像在 `Arrange`（编排）窗口中处理其他事件一样对它们进行分割、移动、复制和调整大小。然后你可以将生成的蒙太奇导出为一个新的视频文件，其中包含你为其创建的所有音频制作元素。\n\
  \n虽然 Studio One 短期内不太可能取代成熟的视频编辑程序，但拥有这一额外功能以尝试不同想法或向客户交付粗略草稿是很不错的。\n\n默认情况下，当你编辑视频时，`Audio\
  \ Sub-Track`（音频子轨道）上对应的音频素材也会被一并编辑。如果你想独立编辑此轨道上的音频，请点击位于 `Video Track`（视频轨道）上的 `Link\
  \ Audio Track Editing`（链接音频轨道编辑）按钮。\n\n## 将音频和 MIDI 事件与视频同步\n\n对于所有音频制作程序（包括 Studio\
  \ One）而言，将视频导入项目的全部目的都是为了能够将音频与视频中的特定点进行同步和匹配。在本节中，我们将讨论两种实现该目标的方法。\n\n举例而言，假设你正担任一段短\
  \ 3D 视频的声音设计师，视频中一个球撞击了堆叠在一起的几个方块。导演要求你在球撞击方块的精确时刻放置一个音效：\n\n![图 10.20：视频显示器显示了需添加音效的精确帧](img/B31512_10_20.jpg)\n\
  \n**图 10.20：视频显示器显示了需添加音效的精确帧**\n\n一旦你找到或创建了一个适合该情境的音效，请按以下步骤将其完美同步到视频动作上：\n\n1.\
  \ 将音频事件的开头处放大到极致，确保声音开始前没有静默间隙。然后，使用 `Arrow`（箭头）工具，修剪事件的开头，使音效立即从事件的开头开始播放。要精准操作。\n\
  \n2. 接着，将 `Video Track`（视频轨道）放大到极致，找到你想让音效开始的那一帧。点击标尺将光标放在那里。如果制作团队发送了该精确位置的时间码，请将其输入\
  \ `Time Indicator`（时间指示器）窗口（图 10.13）。\n\n3. 打开 `Marker Track`（标记轨道），点击 `+` 加号。这将在该时间点添加一个新标记。\n\
  \n4. 如果 `Snap`（吸附）尚未激活，请启用它。\n\n5. 打开 `Snap`（吸附）下拉菜单，选择 `Snap to Events`（吸附到事件），并取消选择\
  \ `Snap to Grid`（吸附到网格）：\n\n![图 10.21：将事件与标记对齐的吸附设置](img/B31512_10_21.jpg)\n\n**图\
  \ 10.21：将事件与标记对齐的吸附设置**\n\n6. 使用 `Arrow`（箭头）工具，拖动包含音效的音频事件。它将完美吸附到你在*步骤 3* 中创建的标记上：\n\
  \n![图 10.22：音频事件吸附到标记](img/B31512_10_22.jpg)\n\n**图 10.22：音频事件吸附到标记**\n\n我们刚才讨论的方法允许你相对于视频中的特定帧以绝对精度对齐事件。然而，并非每个项目或每个声音元素都需要这种精度。例如，如果你要为视频添加环境音效（如雨声），可以使用以下快速粗略的方法来节省时间：\n\
  \n1. 与前一种方法一样，将音频事件的开头处放大到极致，确保声音开始前没有静默间隙。\n\n2. 点击 `Cursor Follows Edit Position`（光标跟随编辑位置）按钮以激活它：\n\
  \n![图 10.23：光标跟随编辑位置按钮](img/B31512_10_23.jpg)\n\n**图 10.23：光标跟随编辑位置按钮**\n\n3. 现在，使用\
  \ `Arrow`（箭头）工具点击包含音效的音频事件并开始沿时间线拖动。你会注意到时间线光标将吸附到事件的开头。当你沿时间线拖动事件时，`Video Player`（视频播放器）将快速逐帧播放视频以匹配光标的位置。\n\
  \n4. 一旦找到你想让音效响起的位置，释放事件即可。\n\n你会发现，即使仅将音效向前或向后推动几帧，也会显著影响其冲击力和真实感。在前面的例子中，将音效精确放在球撞击方块的那一帧上听起来可能不真实。这是因为光速比声速快；我们先看到球撞击方块，稍后才听到声音。尝试将音效向右移动几帧。反复实验直到完美为止。\n\
  \n## 理解时间基准\n\n你正在为视频做声音设计。你已经有了对白和音效，所有内容都完美同步，铺排在项目的多个轨道上。现在，是时候开始处理音乐了。\n\n你想尝试一个音乐创意：开始时节奏缓慢，然后逐渐加快以突出视频中的高潮点。节奏变化是配乐的基本功。还有什么比这更能传达逐渐积累的兴奋感呢？\n\
  \n于是，你打开 `Tempo Track`（节奏轨道）并绘制一条优美的曲线来逐渐加快节奏。你的音乐创意效果完美，但现在所有的对白和音效都跑到错误的位置了。改变节奏把它们全都移位了。这是怎么回事，该如何修复？\n\
  \n这里有一个概念，一旦你开始处理视频，理解它就变得至关重要。在音频制作中，我们使用两种不同的时间版本——绝对时间和相对时间。乍一看这可能像是爱因斯坦物理学的话题，但实际上非常简单。让我们看看这两种时间版本以理清概念：\n\
  \n- **绝对时间** 将时间线上事件的位置分配给绝对值。播客中第 4 分 38 秒处的狗叫声是一个绝对值。从 00:19:08:03 帧开始的音效是一个绝对值。\n\
  \n- **相对时间** 将时间线上事件的位置分配给小节和拍子。如果你在第 5 小节有一个钢琴和弦，这在音乐上完全讲得通，但它无法告诉我们该和弦将在何时（绝对时间）播放。这是因为一个小节的时间长度取决于节奏。如果曲子节奏设为\
  \ 60 BPM，第 5 小节的钢琴和弦将在 16 秒处播放。如果节奏设为 120 BPM，同一个和弦将在 8 秒处播放。这就是音乐时间具有相对性的原因。\n\n\
  *图 10.24* 通过并排对比展示了这一点。在两张图中，顶部标尺显示以小节和拍子为单位的相对时间，底部标尺显示以秒为单位的绝对时间。注意音频事件在两张图中都与第\
  \ 5 小节对齐。对于顶部图像，节奏设为 60 bpm，因此第 5 小节对应第二个标尺上的 16 秒。对于底部图像，节奏设为 120 bpm，因此第 5 小节对应第二个标尺上的\
  \ 8 秒。\n\n\n\n![图 10.24：音乐时间相对于绝对时间的偏移](img/B31512_10_24.jpg)\n\n图 10.24：音乐时间相对于绝对时间的偏移\n\
  \n默认情况下，Studio One 中的所有轨道均使用音乐时间。更改速度会将所有内容（甚至标记）在绝对时间轴上的位置进行偏移。\n\n您可以按轨道覆盖此行为。如果您希望轨道上的事件在速度更改时保持锁定在其绝对时间位置，请执行以下步骤：\n\
  \n1. 单击轨道标题以选择该轨道。\n2. 打开 `Inspector` 面板。\n3. 单击 `Tempo` 下拉菜单并选择 `Don't follow`：\n\
  \n![图 10.25：Tempo 下拉菜单](img/B31512_10_25.jpg)\n\n图 10.25：Tempo 下拉菜单\n\n现在，无论速度如何变化，该轨道上的事件都将保持在其绝对位置。\n\
  \n默认情况下，`Marker Track` 也会跟随速度变化。要将标记锁定在其绝对时间位置，请单击 `Marker Track` 上的音符图标：\n\n![图\
  \ 10.26：Marker Track 的 Timebase 选择器](img/B31512_10_26.jpg)\n\n图 10.26：Marker Track\
  \ 的 Timebase 选择器\n\n通常，将包含对话、拟音、音效和环境音效的所有轨道设置为使用绝对时间。将所有音乐轨道设置为使用音乐时间。\n\n## 导出视频\n\
  \nStudio One 能够直接从 `Song` 页面导出视频文件，其中包含您添加的所有音频。如果您在专业层面工作，不会用到此功能。制作公司会要求您交付高质量音频文件，并使用专用软件将这些文件与视频合成。不过，如果您只需创建简单视频或与合作者分享创意草稿，此选项可能会派上用场。\n\
  \n要从项目导出视频，请按以下步骤操作：\n\n1. 转到顶部菜单的 `Song` 并选择 `Export Video`。这将打开 `Export Video`\
  \ 窗口：\n\n![图 10.27：Export Video 窗口](img/B31512_10_27.jpg)\n\n图 10.27：Export Video\
  \ 窗口\n\n1. 在 `Location` 下，选择要创建的视频文件的文件夹和文件名。\n2. 在 `Video Format` 下，选择视频文件的视频格式。此处显示的选项会因您的操作系统和计算机上安装的编解码器而异。MPEG-4\
  \ 是一个不错的选择；它提供良好的质量，且可在任何计算机或设备上观看。\n3. 在 `Export Range` 下，选择要导出为视频文件的项目部分。此处选择\
  \ `Video` 将导出整个视频。您也可以使用其他选项仅导出项目的一部分。\n4. 单击 `OK`。\n\n在本节中，我们深入探讨了如何在 Studio One\
  \ 中处理视频。我们从向项目添加视频文件开始，探索了视频编辑界面，然后深入研究了将音频和 MIDI 事件与视频中的关键时刻同步。最后，我们将最终项目导出为完整的视频文件。掌握这些知识后，您现在已准备好承担视频和多媒体项目的声音设计工作。\n\
  \n## 总结\n\n在本章中，我们介绍了 Studio One 的全局轨道。我们从 `Chord Track` 开始，它只需几次点击即可控制歌曲的和声结构。然后，我们探索了\
  \ `Ruler`、`Marker` 和 `Lyric` 轨道，它们可帮助您和您的合作者即使在最复杂的项目中也能顺畅导航。最后，我们介绍了 `Video Track`，并学习了如何为视频添加完美同步的声音元素。\n\
  \n这结束了我们对 Studio One 广泛编辑功能的介绍。在本书的下一部分，我们将专注于混音，这是音乐制作的下一个重要步骤。我们将首先讨论如何为混音准备项目，确保所有混音会话顺利进行并交付最佳结果。\n"
- '# 第 4 部分：混音与母带处理


  在本部分中，我们将制定一个高效的工作流程，使您能以专业水准完成项目。首先，我们将深入探讨混音的各个阶段。我们将探索 Studio One 的沉浸式音频功能，并了解如何为电影、游戏和互动媒体创建三维体验。然后，我们将了解
  Studio One 独特的 `Project` 页面，并学习如何为您的 Song 创建最终母带。我们将以一个额外章节结束，该章节探讨 Studio One 的三项附加功能：`Show`
  页面、`Score Editor` 和 `Sample One XT`。


  本部分包含以下章节：


  - *第 11 章*, *准备混音*

  - *第 12 章*, *使用效果插件打造混音*

  - *第 13 章*, *优化信号流程并提升混音*

  - *第 14 章*, *使用空间音频*

  - *第 15 章*, *浏览 Project 页面并制作最终母带*

  - *第 16 章*, *使用 Studio One 附加功能*

  - *附录*, *自定义 Studio One 并遵循最佳实践*

  '
- "## 第 11 章：准备混音\n\n`Mixing` 是音乐制作中的关键步骤。如果做得正确，它能将您的音乐提升到一个全新的水平。如果执行不当，即使是最好的歌曲也可能变成痛苦的聆听体验。\n\
  \n许多人对混音过程感到畏惧。在混音会话中需要考虑的事情太多，无论是在艺术层面还是技术层面，以至于在整个会话中保持敏锐的专注力可能会让人不堪重负。\n\n我教授音乐技术已有\
  \ 20 多年，我无数次观察到，人们在混音中挣扎主要是因为缺乏准备——他们在杂乱无章的音乐素材的无尽迷宫中迷失，失去了专注能力。一旦我们通过组织项目将一切理顺，混音会话就会变得更易于管理，让您能专注于真正重要的事情，并以最佳方式呈现您的音乐。这为音乐制作带来了一种“道”的元素：您不仅是在组织项目中的轨道和事件，更是在梳理您混音的方法。\n\
  \n在本章中，我们将探讨几个步骤，以确保您的混音会话顺利进行。这将帮助您从项目中制作出最佳混音。我们将涵盖以下主题：\n\n- 为混音会话准备 `Song`\n\
  - 组织轨道以获得更好的控制\n- 设置电平、声像和自动化\n\n## 技术要求\n\n要学习本章，您需要在计算机上激活 Studio One。\n\n## 为混音会话准备\
  \ Song\n\n让我们首先讨论在 `Song` 层面需要采取的准备步骤。遵循这些步骤将有助于您的混音会话顺利进行。\n\n### 为混音优化硬件和软件\n\n\
  混音对大多数计算机来说是一项资源密集型任务，因此在开始会话之前，最好让 Studio One 获得计算机所能提供的最大算力。使用以下技术为混音会话优化您的系统：\n\
  \n\n\n# 准备混音会话\n\n## 掉帧保护\n\n你可以做的第一件事是增加 `Dropout Protection`。我们在 `Chapter 2` 中讨论过\
  \ `Dropout Protection`，到目前为止，我们将其设置为 `Minimum`，因为我们希望在录制音频或演奏虚拟乐器时将延迟降至最低。然而，最小化延迟是有代价的：它强制你的电脑在极短的时间内完成任务。这对于录制和编辑任务来说没问题，因为这些任务不需要太多处理能力，但当你开始混音时，你会添加越来越多的效果插件，这会给系统带来沉重负载。\n\
  \n将 `Dropout Protection` 设置为 `Minimum` 时，你很快就会在音频中听到咔哒声和掉帧，甚至可能遇到系统崩溃。所以，请将其设置为\
  \ `Maximum`，这样你的电脑就有足够时间执行混音所需的计算。增加的延迟在混音会话中不会成为问题；当我们按下 `spacebar` 播放工程时，我们不介意多等\
  \ 50 毫秒。\n\n## 性能指示器\n\n随着歌曲播放，请留意下方面板上的 `Performance` 指示器：\n\n![图 11.1：性能指示器](img/B31512_11_1.jpg)\n\
  \n图 11.1：性能指示器\n\n该指示器中的顶部条显示 CPU 性能，底部条显示磁盘性能。如果你有一个包含大量轨道的大型工程，你电脑上的磁盘可能难以同时从所有轨道读取音频数据。在这种情况下，随着歌曲播放，你会在磁盘性能部分看到突然的峰值，音频可能会卡顿。如果发生这种情况，请将整个工程文件夹移动到快速磁盘（理想情况下是内置\
  \ SSD）以解决此问题。\n\n## 系统资源管理\n\n混音会话需要大量音频数据流的不间断传输，以及不间断的处理能力来处理这些数据。退出所有其他应用程序，并禁用杀毒软件和防火墙等后台进程，以便让你的电脑将所有资源分配给\
  \ Studio One。\n\n遵循这些要点将显著提高电脑性能，但提升电脑性能还有另一个维度，这是一个由来已久的争论话题。\n\n## 我应该将乐器轨道转换为音频吗？\n\
  \n如果我们要编制一份音乐制作常见问题清单，这个问题无疑会名列前茅。你的工程包含含有 MIDI 数据的乐器轨道。在开始混音会话前将它们转换为音频是否值得额外付出努力，还是说你可以直接像对待音频轨道一样对待它们？\n\
  \n这个问题没有确定的答案。许多人认为没有必要将乐器轨道转换为音频，原因如下：\n\n*   它给工作流增加了一个额外步骤。\n*   音频数据占用磁盘空间，而\
  \ MIDI 的占用空间微乎其微。\n*   你可以一直调整虚拟乐器直到混音会话结束。\n\n这些观点都很有道理。然而，我会将所有乐器轨道转换为音频轨道，并建议你也这样做，原因如下：\n\
  \n*   一旦你将乐器轨道渲染为音频，就可以禁用乐器轨道上的虚拟乐器，从而为混音会话释放电脑资源。\n*   实施增益调节将容易得多。我们将在下一节讨论增益调节，标题为（惊喜！）\
  \ `Gain staging`。\n*   你的工程将变得可移植。你可以将音频文件发送给合作者，即使他们没有你在工程中使用的任何虚拟乐器，也能处理这首歌。\n\
  *   你的工程将变得面向未来。如果你将来需要修改工程，当你电脑上不再安装该虚拟乐器时，你可能无法处理乐器轨道。通过将轨道转换为音频，你将永远拥有该轨道中原始声音的访问权。\n\
  \n将乐器轨道转换为音频轨道有几种方法。这是最实用的一种：\n\n1.  通过按键盘上的 `1` 选择 `Arrow` 工具。\n2.  选择乐器轨道上的所有\
  \ MIDI 事件。\n3.  点击其中一个 MIDI 事件的右边缘并向右拖动，在末尾创建一个额外的空白小节：\n\n![图 11.2：MIDI 事件末尾的一个空白小节](img/B31512_11_2.jpg)\n\
  \n图 11.2：MIDI 事件末尾的一个空白小节\n\n这将防止在将事件转换为音频时声音的尾部被切断。\n\n1.  现在，右键点击事件，然后在弹出菜单中进入\
  \ `Event` 并选择 `Bounce Selection`。这是一个智能命令，当你喝口咖啡的功夫，它就会执行多项任务——将 MIDI 事件跳转为音频，创建一个与乐器轨道同名的新音频轨道，将音频放置在新音频轨道中，并将\
  \ MIDI 事件静音：\n\n![图 11.3：从乐器轨道跳转出的音频](img/B31512_11_3.jpg)\n\n图 11.3：从乐器轨道跳转出的音频\n\
  \n1.  现在你可以安全地禁用虚拟乐器以释放电脑资源。为此，请使用虚拟乐器窗口上的电源按钮：\n\n![图 11.4：禁用虚拟乐器](img/B31512_11_4.jpg)\n\
  \n图 11.4：禁用虚拟乐器\n\n1.  现在你也可以隐藏乐器轨道以减少屏幕杂乱；右键点击乐器轨道的轨道标题并选择 `Hide Track`。如果你以后需要修改此工程，可以使用\
  \ `Track List` 按钮（`Figure 3.4`）将轨道恢复。\n\n使用此方法将所有乐器轨道转换为音频轨道只需几分钟，考虑到我们讨论的所有优势，这绝对值得为音频占用的额外存储空间付出代价。\n\
  \n## 为完美而编辑\n\n在开始混音会话之前，请确保所有轨道都已完美编辑，且没有节奏和音准问题。这是实现混音清晰度和一致性的最重要前提。仔细聆听每个轨道，如果发现任何问题，请使用我们在\
  \ `Chapters 7` 和 `8` 中讨论的编辑方法进行修复。\n\n人声轨道需要特别照料，因为我们天生就更关注人声。花点时间，使用编辑工具直到你的人声轨道完美无缺。此时投入的时间将物超所值。\n\
  \n如果某个轨道音量有严重的不一致，请使用 `Split` 工具将其切分成较小的事件，并调整每个事件的增益，正如我们在 `Chapter 7` 中讨论的那样。为了说明这一点，请看\
  \ `Figure 11.5`。上方的轨道是一位歌手在表演时过度移动的录音。随着他们远离和靠近麦克风，录音音量发生了剧烈变化。下方的轨道是同一录音，经过我将其切分成片段并单独调整每个片段增益后的结果。你可以看到它现在一致得多。\n\
  \n![图 11.5：手动调整音频事件的增益](img/B31512_11_5.jpg)\n\n图 11.5：手动调整音频事件的增益\n\n我们可以使用压缩器插件自动平衡增益，但这种方法更加透明、可预测，并给你更大的控制权。这绝对值得付出额外的努力和时间。\n\
  \n## 增益调节\n\n在音频中，`gain` 指信号电平或音频信号振幅的增加，以 `decibels` (`dB`) 为单位测量。增益可以在音频信号链的不同阶段应用，例如麦克风、前置放大器或混音器，可用于提升低电平信号的电平、补偿微弱的信号源，或创造所需的音色或动态效果。\n\
  \n\n\n# 增益分级\n\n`Gain staging` 是指在音频信号链的每个阶段设置电平或增益的过程，以确保信号在从输入到输出的整个过程中保持在最佳电平。\n\
  \n增益分级的目标是实现最佳的信噪比，这意味着信号应尽可能强于任何可能存在的背景噪声。如果信号太弱，它将被噪声淹没。如果太强，可能会导致失真和削波，从而降低音频质量。\n\
  \n从实际操作角度来看，增益分级是通过结合不同设备上的音量控制来实现的，例如效果器插件和混音台。\n\n在混音会话中，我们本质上是将多条不同的轨道相加汇总为一条立体声轨道。即使各个单独轨道上没有失真或削波，在此汇总过程中，混音台的主输出仍可能发生削波。\n\
  \n要查看主输出是否存在削波，请打开 `Mix` 窗口，播放工程，并留意 `Main` 输出的峰值电平表。它位于窗口的右边缘：\n\n![Figure 11.6:\
  \ Main output channel (right) clipping terribly](img/B31512_11_6.jpg)\n\n*图 11.6：主输出通道（右）严重削波*\n\
  \n峰值电平表显示音频信号达到的最高瞬时电平。该电平以 **分贝相对于满量程** (`dBFS`) 表示。这是一个参考刻度，将信号的最大可能电平定义为 `0`\
  \ dBFS。所有其他电平均相对于此最大值测量，通常为负值。任何超过 0 dBFS 的信号都会发生削波，导致失真，因为数字系统无法表示高于此点的值。在图 11.6\
  \ 中，通道条顶部指示的左右声道 dBFS 值为 `6.00`。这是一个正值，表明已超过最大电平。\n\n如果发生削波，峰值电平表会变红以提醒你。峰值电平表顶部还会显示一个数字，指示信号削波的次数。图\
  \ 11.6 中的信号削波了 26 次。\n\n削波会导致一种难听的失真；幸运的是，它很容易修复，但首先，关于不应采取何种措施来防止削波，我要说一句警告，因为我经常看到人们这样做：不要试图通过调低\
  \ `Main` 通道的推子来修复削波！这具有误导性，因为它会清除视觉警告，让你以为已经处理了失真，但失真仍然存在。这是因为失真发生在汇总阶段，即信号链中混音器将项目中的所有轨道合并为单个立体声通道的点。`Main`\
  \ 通道上的推子位于汇总阶段之后，因此调低此推子无法防止削波；它只是降低了一个已经被削波的信号的电平。\n\n## 重要提示\n\n尽管最大可能电平为 `0`\
  \ dBFS，但常见的做法是在 0 dBFS 和混音的实际电平之间保留一些 **余量** 。留出此余量的主要原因是为母带处理过程中将应用于混音的任何进一步处理留出空间。目标是让最终混音在\
  \ `Main` 通道上峰值达到 `-6` dBFS 到 `-3` dBFS。这为母带处理留出了足够的余量。\n\n要正确修复 `Main` 通道上的削波，请按如下步骤操作：\n\
  \n1. 转到 `Arrange` 窗口，按 `Ctrl + A` 或 `Cmd + A` 选择所有事件。\n2. 降低任意一个音频事件的增益。所有事件的增益值将按相同幅度降低。\n\
  3. 在 `Mix` 窗口上，点击 `Main` 通道的 `VU meter` 以清除任何削波警告。\n4. 播放工程，确保不再有削波。如有必要，重复 `步骤\
  \ 1` 至 `3`。\n\n当你制作混音并开始添加效果器插件时，最好留意 `Main` 通道的 `VU meter`，查看是否有任何插件引入了削波。如果有，只需重复上述步骤。\n\
  \n到目前为止，我们已调整缓冲区大小以提升电脑性能，编辑轨道以确保所有素材处于最佳状态，并处理了可能由削波引起的任何失真。在下一节中，我们将开始整理轨道，以便你在混音会话中能更好地掌控项目。\n\
  \n# 整理轨道以获得更好的控制\n\n当灵感来袭，你开始发展一个音乐创意时，你最不想考虑的就是命名和整理轨道。这没关系，实际上在创作过程中保持混乱是可取的。但如果你带着同样混乱的项目开始混音会话，很快就会在杂乱无章的轨道和片段迷宫中迷失方向。\n\
  \n整理一个项目以进行混音会话只需几分钟，你会感谢自己这么做了。不信？启动秒表并遵循以下步骤：\n\n1. 首先对轨道进行排序——你可以通过点击轨道标题并将其上下拖动来实现。大多数人从鼓轨道开始混音会话，所以将它们放在顶部是合理的。然后，也许将打击乐轨道放在鼓轨道下方，接着是所有演奏和弦的乐器。没有绝对正确或错误的方法；只需选择一个对你有意义的顺序并相应地放置轨道。你将免于在项目中上下滚动寻找轨道。\n\
  2. 在创作过程中，你可能让 Studio One 自动命名轨道，但像 `Audio_09` 这样的通用名称在混音会话中毫无意义。双击这些名称，为你的轨道指定简短、描述性的名称。这样，你一眼就能知道轨道里是什么。当你在\
  \ `Mix` 窗口工作时，这将更有帮助，因为在该窗口中，你无法看到轨道上的事件。\n3. 为轨道着色！大多数人认为这只是花哨的装饰，但它是在项目中寻找方向的好方法，尤其是当轨道很多时。要执行此操作，请点击轨道标题左侧的彩色矩形，并从调色板中选择一种颜色：\n\
  \n![Figure 11.7: Track color palette](img/B31512_11_7.jpg)\n\n*图 11.7：轨道调色板*\n\n\
  对相似乐器使用相同的颜色；例如，鼓轨道用一种颜色，打击乐轨道用另一种颜色，依此类推。这样，你甚至不必看轨道名称，就能轻松识别特定音频事件上的内容。\n\n4.\
  \ 如果你的项目中有很多轨道，可以将它们放入文件夹中。Studio One 中的 `Folders` 非常像操作系统中的文件夹。它们整齐地存储轨道，以最大程度减少\
  \ `Arrange` 窗口上的杂乱。要向项目添加文件夹，请执行以下步骤：\n   1. 点击 `Add Tracks` 按钮，这将打开 `Add Tracks`\
  \ 弹出菜单：\n\n![Figure 11.8: The Add Tracks pop-up menu](img/B31512_11_8.jpg)\n\n*图\
  \ 11.8：添加轨道弹出菜单*\n\n   2. 在 `Name` 字段中，为即将创建的文件夹输入一个描述性名称，如 Drums、Vocals、Percussion\
  \ 等。\n   3. 在 `Type` 字段中，选择 `Folder`。\n   4. 在 `Color` 字段中，为该文件夹选择一种颜色。\n   5. 点击\
  \ `OK`。\n   6. 现在，通过 `Shift`-点击选择所有要放入此文件夹的轨道，然后将它们拖放到文件夹中。放入文件夹的轨道将显示为略微缩进：\n\n\
  ![Figure 11.9: Tracks inside a folder appear slightly indented](img/B31512_11_9.jpg)\n\
  \n*图 11.9：文件夹内的轨道显示为略微缩进*\n\n\n\n1. 点击 `folder` 图标（`Figure 11.9` 中高亮显示）可折叠文件夹，让你专注于其他轨道。\n\
  \n2. 请随意添加所需数量的文件夹。\n\n这没花太长时间，对吧？看看你的项目有多井井有条。当你清楚地知道在哪里能找到所需素材时，进行混音会变得轻而易举。在下一节中，我们将开始使用混音会话中最基本的参数，来构建通常所谓的粗略混音。\n\
  \n# 设置电平、声像与自动化\n\n想想《蒙娜丽莎》——是的，我说的就是那幅著名的画作。它其实是一幅相当繁复的构图：画框里有一位年轻女子，还有小山、树木、河流、小径、云朵，甚至一座桥。然而达芬奇以一种方式安排它们，使得当你注视这幅画时，目光会立即锁定在构图的主体上。\n\
  \n这正是我们在混音中追求的目标。你的项目中有多个乐器和人声分布在多个轨道上，你必须清晰且明确地引导听众的注意力到歌曲中最重要的元素上，同时提供丰满的背景。\n\
  \n有多种工具和方法可在混音会话中创造构图感和透视感。在本节中，我们将介绍其中两个工具——音量和声像。然后，我们将讨论如何使用自动化在整首歌的过程中动态操控这些工具。\n\
  \n## 设置电平\n\n就创造透视感而言，调整轨道音量完全符合直觉。增大音量可将乐器推至混音前景，减小音量可将其置于背景。就这么简单。\n\n然而，设置给定轨道电平的方法有几种，每种对最终声音的影响都不同。让我们逐一了解：\n\
  \n*   正如我们已知，Studio One 中的每个音频事件都有专用的增益控制。你可以将事件切分成更小的片段，并为每个片段独立设置增益电平，从而实现对音量的精细控制。\n\
  \n    音频事件上的增益设置实际上是轨道信号链上的第一个控制。它改变发送到该轨道效果插件的信号电平，因此会影响这些插件对该轨道声音的响应和着色方式。所以，取决于你使用的效果类型，改变增益电平可能会影响声音的音色和色彩，而不仅仅是音量。\n\
  \n*   调整轨道音量更常用的方法是使用该轨道的推子。`fader` 是一种滑动控件，以线性方式上下移动，增加或减少轨道或通道的音量。推子在 `Mix` 窗口中水平排成一行。默认情况下，它们可能显得很小，但大小可调。在\
  \ `Mix` 窗口推子区域的顶部点击并拖动以放大推子。这样，你将获得更高的分辨率来进行微调：\n\n![Figure 11.10: Tiny faders (left)\
  \ enlarged to provide better resolution (right)](img/B31512_11_10.jpg)\n\n图 11.10：微小的推子（左）放大以提供更好的分辨率（右）\n\
  \n推子是轨道信号链上的最后一个元素，因此它们不影响发送到该轨道效果插件的信号量。它们只会透明地增加或减少音量，绝不改变音色。\n\n使用推子的一个优势是你可以通过自动化改变其位置，从而动态地持续控制整首歌中轨道的音量，正如我们将在本章后面的\
  \ `Adding automation to create a dynamic mix` 节中看到的那样。\n\n*   控制轨道电平的另一种方法是使用该轨道上单个效果插件的输入和输出电平设置。这允许对音量进行更具体、更精细的控制，并让你指定每个插件如何响应和着色该轨道的声音。我们将在\
  \ `Chapter 12` 中详细介绍效果插件。\n\n通过结合使用这些工具和方法，你可以精确控制轨道音量，将其推至混音前景或置于背景。\n\n## 声像定位以创建立体声图像\n\
  \n`Panning` 指在立体声声场中放置音频素材。在音乐混音中，声像用于确定每个声音的感知位置。例如，如果声音定位在左侧，音频信号的音量会被调整为左耳响、右耳弱。这会产生声音来自左侧的感觉。\n\
  \n声像的目标是创建清晰、独特的立体声图像，使每个声音易于识别并定位在混音中的特定位置。声像也可用于创意效果，通过将声源逐渐从一个扬声器移动到另一个扬声器。\n\
  \n在 Studio One 中，声像通过混音台上的声像控制来执行：\n\n![Figure 11.11: Pan control on a track on\
  \ the mix console](img/B31512_11_11.jpg)\n\n图 11.11：混音台上轨道的声像控制\n\n这些声像控制有三种不同的操作模式，可通过右键点击声像控制来选择：\n\
  \n![Figure 11.12: Panning modes](img/B31512_11_12.jpg)\n\n图 11.12：声像模式\n\n现在，让我们逐一了解这些模式：\n\
  \n*   `Balance`：这是默认模式。它允许你将轨道上的信号定位在左侧、右侧或两者之间的任意位置。这是你大多数时候会用到的模式；它完全足以满足你在立体声场中对声音进行基本定位的需求。\n\
  \n*   `Dual`：此选项仅适用于立体声轨道。它提供两个独立的声像控制，一个用于轨道的左声道，一个用于右声道：\n\n![Figure 11.13: Dual\
  \ panner](img/B31512_11_13.jpg)\n\n图 11.13：双声像器\n\n使用这些控制，你可以独立地对轨道上的左、右声道进行声像定位。与\
  \ `Balance` 模式相比，这用途较窄，但在合适的场景下却能起死回生。\n\n举个例子。通常，采样库中的钢琴声音是从演奏者的视角进行声像定位的——左侧的琴键（代表低音区）定位在左侧，右侧的琴键定位在右侧。这是因为制作采样库的人希望钢琴作为独奏乐器时听起来饱满宽广。但这并不是我们在古典音乐会上听钢琴的方式。钢琴通常放在舞台左侧某处，我们听到的是一个来自立体声场稍左位置的单一声源。\n\
  \n要用宽声像的钢琴采样达到这种效果，请选择 `Dual` 模式并将两个声像控制靠拢，从而有效地缩窄钢琴的立体声宽度。然后，点击这两个声像控制中间的区域，将它们稍微向左拖动，把钢琴放置在你虚拟音舞台上的期望位置，如\
  \ `Figure 11.13` 所示。\n\n*   `Binaural`：此模式也仅适用于立体声轨道。`Binaural panning` 是一种模拟三维声像的技术，可用于为听众创造沉浸式音频体验，常用于虚拟现实、游戏以及音乐制作中。Studio\
  \ One 中的 `Binaural` 声像器包含一个常规声像控制和一个立体声宽度控制：\n\n![Figure 11.14: Binaural panner](img/B31512_11_14.jpg)\n\
  \n图 11.14：双耳声像器\n\n\n\n立体声宽度控制使用一种称为中侧处理的复杂技术来调整立体声信号的感知宽度。**中侧处理**通过将音频信号分为两个分量来操控其立体声图像：中分量，代表左右声道中相同的音频信号；侧分量，包含左右声道之间不同的音频信号。通过分别处理这些分量，可以通过多种方式调整音频信号的立体声图像。\n\
  \n在 Studio One 的**双耳**声像器中，可以通过使用立体声宽度控制来实现这一点。当此值设置为 **100%**（其默认值）时，该轨道上信号的立体声宽度不受影响。降低该值会强调信号的中分量，在最低设置\
  \ **1%** 时有效地将其变为单声道。将该值增加到 **100%** 以上会强调信号的侧分量，逐步扩宽该轨道上声音的立体声图像。虽然这可能会瞬间让你的混音听起来更宽广，但要抵制将宽度调至最大\
  \ **200%** 的诱惑，因为这可能会导致相位问题，并在某些场景下使混音无法使用。我们将在*第 15 章*中介绍相位问题及如何识别它们，那时我们将讨论母带处理。\n\
  \n到目前为止，我们讨论了音量和声像，这是混音中用于将声音置于虚拟三维声场中的两个最重要的工具。正确设置这些对于制作连贯的混音至关重要，但对于当今大多数音乐流派，你会希望这些设置从歌曲的一个片段变化到另一个片段，以创造动态感和对比度。这通过使用自动化来实现，这将是我们接下来的主题。\n\
  \n## 添加自动化以创建动态混音\n\n**自动化**是音乐制作中强大的工具，允许你随时间控制混音的各种参数，如音量、声像和效果。自动化可以通过多种方式用于在歌曲片段之间创造对比，并产生有趣且动态的效果。\n\
  \n以下是一些你可以使用自动化的典型示例：\n\n*   在歌曲的副歌部分提升背景人声。\n*   在安静片段中降低主音吉他的音量。\n*   在过门（桥段）部分增加主唱人声的混响量。\n\
  *   强调被鼓镲击声掩盖的主唱演唱的某个词。\n\n在 Studio One 中，混音台和效果插件上的每一个参数都可以自动化，所以唯一的限制就是你的想象力。现在，让我们看看如何使用自动化。\n\
  \n### 自动化模式\n\n`Mix`（混音）窗口上的每个轨道和通道底部都有一个 `Automation Mode`（自动化模式）选择器，每个插件窗口的左上角也有相同的选择器：\n\
  \n![图 11.15：轨道（左）和插件窗口（右）上的自动化模式选择器](img/B31512_11_15.jpg)\n\n图 11.15：轨道（左）和插件窗口（右）上的自动化模式选择器\n\
  \n点击此选择器将显示五个选项。让我们逐一查看这些选项：\n\n*   `Auto: Off`：此选项禁用该轨道或插件的自动化。所有参数将保持锁定在其当前位置。\n\
  *   `Read`：在此模式下，Studio One 将读取并执行该轨道上所有现有的自动化数据。\n*   `Touch`：选择此模式并按下 `Play` 时，一旦你用鼠标或外部硬件控制器触碰该轨道上的参数，就会创建新的自动化数据。当你释放鼠标或控制器时，Studio\
  \ One 将恢复读取并执行现有数据。这是对现有自动化进行微调的绝佳方法。\n*   `Latch`：此模式类似于 `Touch` 模式，不同之处在于当你在此模式下触碰参数时，Studio\
  \ One 将持续添加自动化数据，直到你停止播放。\n*   `Write`：选择此选项并按下 `Play` 时，将根据所有参数的当前值持续写入自动化。如果该轨道上已有自动化数据，将被覆盖。请谨慎使用此方法，以免意外覆盖之前的调整。\n\
  \n现在你了解了自动化模式，我们可以继续开始添加自动化数据。\n\n### 添加自动化\n\n添加自动化相当简单。为了举例说明，假设你正在混音图 11.16 中的歌曲，并且想要在第\
  \ **8** 小节和第 **9** 小节之间逐渐增加第一条轨道（标记为 `Synth`）的音量，以在进入歌曲主歌前营造一些期待感：\n\n![图 11.16：添加自动化前的轨道](img/B31512_11_16.jpg)\n\
  \n图 11.16：添加自动化前的轨道\n\n具体操作如下：\n\n1.  打开 `Mix`（混音）窗口并找到该轨道的推子。\n2.  点击推子下方的 `Automation\
  \ Mode`（自动化模式）选择器并选择 `Touch`。\n3.  将时间线定位到第 **8** 小节之前的某一点，然后按 `spacebar`（空格键）播放工程。\n\
  4.  当时间线到达第 **8** 小节时，点击该轨道的推子并向上拖动。如果不完美不用担心——我们将在下一节“编辑自动化”中进行编辑。\n5.  再次按 `spacebar`（空格键）停止播放。\n\
  6.  再次点击 `Automation Mode`（自动化模式）选择器，这次将其设置为 `Read`。这将防止你意外添加或覆盖任何自动化数据。\n\n你对推子所做的更改现在已作为自动化数据写入该轨道。你可以再进行一遍操作，这次为另一个参数添加自动化。每个参数的自动化数据存储在单独的通道上，可以独立编辑，我们马上就会看到。\n\
  \n### 编辑自动化\n\n你添加到轨道的所有自动化数据都存储在单独的自动化通道上。要显示这些通道，请右键点击轨道标题，在弹出菜单中选择**显示/隐藏自动化**。这将叠加显示给定参数所有自动化数据的可视化表示，称为**自动化包络**。这是我尝试提高图\
  \ 11.16 中轨道音量的自动化包络：\n\n![图 11.17：自动化通道上显示的自动化包络](img/B31512_11_17.jpg)\n\n图 11.17：自动化通道上显示的自动化包络\n\
  \n它看起来不太平滑，但很容易编辑。方法如下：\n\n1.  点击该轨道标题底部并向下拖动以放大轨道。这将给你更多的操作空间。\n2.  点击并按住 `Paint`（画笔）工具查看其选项列表。选择适合你目的的选项（`Line`（直线）或\
  \ `Parabola`（抛物线）非常适合此示例）。\n3.  在第 **8** 小节开头点击并拖动，在第 **9** 小节开头释放，以创建一条平滑的直线或抛物线：\n\
  \n![图 11.18：编辑后的自动化包络](img/B31512_11_18.jpg)\n\n图 11.18：编辑后的自动化包络\n\n`Paint`（画笔）工具的其他选项，如\
  \ `Sine`（正弦波）或 `Square`（方波），可用于通过自动化实现更具创意或实验性的效果，例如在两个扬声器之间持续移动声音的声像——如果你的音乐风格允许这种实验，绝对值得一试。\n\
  \n这结束了我们对混音中两个最基础、最重要工具的介绍：音量和声像。掌握这些知识后，你可以精准地将声音置于混音中，甚至使用自动化在整首歌曲过程中改变它们的位置。\n\
  \n## 总结\n\n\n"
- "## 使用效果插件打造混音\n\n在本章中，我们介绍了您为混音会话准备歌曲和自身所需的所有基本工具和方法。然后，我们讨论了如何为每条轨道设置音量和声像控制，以及如何使用自动化在整首歌中动态地更改这些设置。\n\
  \n执行本章讨论的步骤将奠定坚实的基础，帮助您更顺利地进行混音会话，让您能够专注于发掘歌曲的最佳效果。\n\n在下一章中，我们将讨论 Studio One 中的\
  \ `Effects plug-ins`，并探讨使用它们的最佳方法，以打造最完美的混音。\n\n`Effects plug-ins` 是音频处理工具，允许您修改单个轨道或整体混音的声音。它们可用于创建各种不同的声音和效果，使其成为音乐制作中用途广泛的工具。无论您需要为人声音轨增添温暖感，为吉他创建宽敞的混响，还是为贝斯线添加粗砺的失真，总有一款插件能实现您想要的效果。\n\
  \n在本章中，我们将带您浏览 Studio One 的 `bundled plug-ins`（也称为 `stock plug-ins`），帮助您开始使用它们。截至写作时，Studio\
  \ One Pro 捆绑了 40 多款插件，因此我们无法逐一详细介绍。相反，我们将重点关注您最可能使用的插件，以及一些因极具创新功能而值得特别提及的插件。\n\n\
  读完本章后，您将对手头可用的插件有扎实的了解，并能自信地为任何音频处理任务选择合适的插件。\n\n本章将涵盖以下主题：\n\n*   使用动态插件和均衡器控制电平和频率\n\
  *   使用混响和延迟插件增加深度和空间感\n*   使用插件增添色彩和特性\n*   使用特殊工具和分析插件\n\n## 技术要求\n\n要跟随本章操作，您需要在计算机上激活\
  \ Studio One Pro。\n\n## 使用动态插件和均衡器控制电平和频率\n\n`Dynamics processors`（动态处理器）是指一类用于随时间修改音频信号电平的音频处理工具。它们控制声源的动态范围，从而获得更一致、更润色的声音。现在，让我们看看\
  \ Studio One Pro 自带的动态处理器。\n\n### 压缩器\n\n`Compressor`（压缩器）是一种动态处理器，通过衰减响亮声音的电平来减小音频信号的动态范围。它通常用于为人声或乐器轨道创建更一致的电平，也可用于增加吉他和贝斯声音的延音。\n\
  \nStudio One 的 `Compressor` 插件在外观和操作上就像专业音乐工作室中的硬件压缩器一样。图 12.1 并排展示了 Studio One\
  \ 的 `Compressor` 插件和全球录音室梦寐以求的一款硬件压缩器。尽管界面看起来不同，但请注意，两者拥有相同的控制组件。\n\n![图 12.1：知名硬件压缩器（左）和\
  \ Studio One 的 Compressor 插件（右）](img/B31512_12_1.jpg)\n\nStudio One 的 `Compressor`\
  \ 插件还有一些额外功能，包括内部和外部侧链功能，以及一个 `Mix`（混合）旋钮，允许您在无需 FX 轨道的情况下应用并行压缩。如果您是混音新手，这些术语听起来很陌生，别担心——我们将在第\
  \ 13 章中介绍所有这些技术。\n\n### Limiter2\n\n`Limiter2` 是一种压缩器，旨在防止音频电平超过特定阈值。它通常用于防止音频信号失真或削波，常用于母带处理阶段，以确保最终混音电平一致，避免任何削波或失真。\n\
  \n从定义上讲，限制器是非常简单的设备，但 Studio One 的 `Limiter2` 插件具有某种独特的工作原理，可能会让从其他平台转过来的用户感到困惑，因此值得仔细研究一下。\n\
  \n让我们想象一下，您正在限速 100 公里/小时的高速公路上行驶。如果您的汽车允许设置最高车速，您可以将其设为 99 公里/小时（留出一小部分误差余量），然后踩下油门，而无需担心超速。这正是\
  \ `Limiter2` 的工作原理：您使用 `Ceiling`（上限）旋钮设置允许的最大电平，然后随意增加 `Gain`（增益）值，而无需担心音频信号削波。\n\
  \n![图 12.2：Limiter2](img/B31512_12_2.jpg)\n\n正是 `Threshold`（阈值）设置让大多数人感到困惑。为了理解其工作原理，让我们回到汽车比喻。想象一下，在我们刚才讨论的自动限速基础上，您希望汽车自动调整车速，使其在不超过限速的前提下尽可能跑得快。这意味着如果您当前以\
  \ 60 公里/小时的速度行驶，汽车将自动加速，直到达到允许的最大速度。但如果随时都启用这个自动加速功能会很危险；例如，您不希望在从车库驶出时它处于激活状态。因此，您设定一个最低速度，换句话说，设定一个阈值，只有达到这个阈值时，自动加速才会启动。这正是\
  \ `Limiter2` 上 `Threshold` 控制的作用。\n\n`Threshold` 设置相对于 `Ceiling` 工作，允许您设置上限以下的一个范围，在该范围内自动补偿增益开始起作用。随着您将\
  \ `Threshold` 设为更低的值，自动补偿增益将延伸到音频素材中越来越安静的部分，使这些部分也变得更响亮。\n\n当我们在第 15 章讨论母带处理时，将详细介绍\
  \ `Limiter2` 上的其他参数。\n\n### 扩展器\n\n`Expansion`（扩展）与压缩相反，通过衰减信号中较低电平部分的电平来增加信号的动态范围。这对于恢复已压缩信号的动态范围或消除背景噪音很有用。\n\
  \nStudio One 的 `Expander` 插件提供内部和外部侧链功能，以及一个 `Range`（范围）控制，用于调整施加于信号的最大衰减量。\n\n\
  ### 噪声门\n\n`Gate`（噪声门）是一种简单的处理器，当声音低于特定阈值时，它会完全切断声音。它常用于消除背景噪音或其他声源的串音。\n\nStudio\
  \ One 的 `Gate` 插件简单、高效，完美胜任其工作。\n\n### 去嘶器\n\n`De-Esser`（去嘶器）用于减少或去除人声或其他音频信号中的刺耳齿音和其他高频噪音。`Sibilance`（齿音）是发某些字母（如\
  \ *s* 和 *sh*）时有时产生的尖锐嘶嘶声，在录制或混音人声时可能会成为问题。\n\n去嘶器基本上是一个仅专注于齿音发生频率范围的压缩器。当该范围内的信号超过给定阈值时，去嘶器会衰减信号以驯服齿音。\n\
  \n对于大多数人声齿音，Studio One 的 `De-Esser` 插件使用默认设置即可完美工作：\n\n![图 12.3：De-Esser](img/B31512_12_3.jpg)\n\
  \n如果您觉得它无法捕捉素材中的齿音，可以按如下方式调整其设置：\n\n1.  点击 `Listen`（试听）按钮。这将让您仅听到被选为衰减目标的频率。\n2.\
  \  调整 `Frequency`（频率）旋钮以锁定齿音。\n\n\n\n3. 再次点击 `Listen` 按钮以恢复正常操作。`De-Esser` 现在将开始针对您选择的频率范围进行处理。\n\
  \n4. 调整 `S-Reduction` 以设置一个阈值点，当超过该点时 `De-Esser` 将开始衰减所选频率。\n\n虽然去嘶音器主要用于人声录音，但它们也可用于驯服其他乐器上的刺耳频率，所以请随意尝试。\n\
  \n## 多频段动态处理\n\n`Multiband Dynamics` 是一款插件，它结合了五个独立可调的压缩器和扩展器单元，它们作用于专用的频段。该插件常用于母带处理阶段，我们将在\
  \ *第 15 章* 中详细讨论它。\n\n## Tricomp\n\n`Tricomp` 是 `Multiband Dynamics` 的一个简化替代品。它是一款三频段压缩器，大部分工作自动完成，几乎是“设置好即不管”的方式，并且在最终定型混音和增加冲击力方面表现卓越。当我们在\
  \ *第 15 章* 谈论母带处理时，将更仔细地研究它。\n\n## Pro EQ3\n\n`音频均衡器`，也称为 `EQ`，是一种允许您调整音频信号中频率平衡的设备。均衡器的目的是通过提升或削减特定频率范围，使音频听起来更平衡、更悦耳。\n\
  \nStudio One 自带 `Pro EQ3`，这是一款功能强大的均衡器插件，可让您使用八个独立可调的频段来调整音频信号的频率。其界面顶部有一个频谱显示，可帮助您直观地定位想要处理的频率：\n\
  \n![Figure 12.4: Pro EQ3](img/B31512_12_4.jpg)\n\n图 12.4：Pro EQ3\n\n`Pro EQ3` 也可以设置为动态均衡器工作。`动态均衡器`\
  \ 会在输入信号超过特定阈值时，动态地调整某个频率范围的电平。要使用此功能，请按以下步骤操作：\n\n1. 点击频谱显示上方的 `Dynamics` 按钮，以显示所有频段的动态控制。\n\
  \n2. 然后，您可以通过点击任意单个频段上的 `D` 按钮来启用其动态均衡功能。\n\n3. 使用频段上的 `Thrs.`（阈值）设置来确定该频段激活的信号电平。\n\
  \n4. 使用 `Range` 设置信号电平超过阈值后将应用多少调整量。\n\n`Pro EQ3` 是一款非常强大的工具，能满足您所有的音色塑造需求。除非您在寻找一款模拟复古硬件设备模拟声音的插件，否则\
  \ `Pro EQ3` 是完美的全能解决方案。\n\n动态处理器和均衡器是必不可少的工具，它们帮助您为混音打下坚实基础。接下来，我们将开始探索可用于添加艺术创意色彩、让混音生动起来的工具。\n\
  \n# 使用混响和延迟插件增加深度和空间感\n\n混响和延迟插件赋予混音空间感、深度和立体感。Studio One 在这一类别中提供了大量可靠的选项，涵盖了所有基础需求。让我们先来探索混响插件。\n\
  \n## 混响插件\n\n`混响插件` 是用于给音频录音添加人工混响的工具。`混响` 是声波在封闭空间中从表面反射时产生的声学效应，它产生一系列复杂的回声和反射，能赋予音频录音空间感和深度。\n\
  \n混响插件通常通过模拟不同类型空间（如音乐厅、录音室或小房间）的声学特性来工作。它们可用于为干声录音添加空间感，或调整录音中现有混响的数量和特性。\n\nStudio\
  \ One Pro 自带三款混响插件，我们现在来看看它们。\n\n### Mixverb\n\n`Mixverb` 简单易用，且与大多数混响插件不同，它对计算机资源的占用非常低。您可能不想在主唱轨道上使用它，但它非常适合为背景乐器增色，而不会给计算机处理器带来负担。\n\
  \n### Room Reverb\n\n`Room Reverb` 是一款多功能插件，可让您以令人难以置信的细节创建虚拟声学环境。它从常见的参数（如房间大小和混响时间）入手，然后增加了一些我在其他平台的任何其他混响插件中都未见过的设置。您可以决定虚拟房间中有多少人，设置声源相对于听众的高度，甚至调整室内空气的湿度水平。这只是冰山一角！\n\
  \n![Figure 12.5: Room Reverb](img/B31512_12_5.jpg)\n\n图 12.5：Room Reverb\n\n虽然如此多的细节对于大多数音频制作工作来说有些大材小用，但您会发现自己在所有项目中都在使用\
  \ `Room Reverb`，因为它听起来实在太棒了。如果选项过多让您感到不知所措，只需关注这三个参数，您就能顺利为混音创建完美的声学环境：\n\n* 使用\
  \ `Type` 按钮选择虚拟空间的大小和特性。选项包括小房间、房间、中型大厅和大型大厅。\n\n* 使用 `Size` 旋钮进一步细化房间的尺寸。\n\n*\
  \ 使用 `Length` 设置调整混响持续的时间。\n\n通常的做法是滚降混响插件产生的极高和极低频率，因为这能创造更平滑的混响尾音，并有助于实现混音的清晰度。有些混响插件为此内置了滤波器部分。`Room\
  \ Reverb` 没有这样的滤波器部分，因此建议在 `Room Reverb` 后添加一个均衡器（如 `Pro EQ3`），并使用均衡器的高切和低切滤波器来滚降极高和极低频率。\n\
  \n### Open AIR\n\n`Open AIR` 是一款使用卷积混响技术的高端混响插件。`卷积混响` 是一种音频处理类型，它使用脉冲响应来模拟真实空间（如音乐厅、录音室或大教堂）的声学特性。`脉冲响应`\
  \ 是声波在特定空间中反射和衰减方式的数学表示，可以通过在空间中播放一段短促的声音（“脉冲”）并记录产生的反射（“响应”）来捕获。\n\n`Open AIR`\
  \ 利用这项技术，基于真实空间和复古硬件混响设备的建模，提供非常逼真的混响效果。要开始使用它，您必须首先将一个 `脉冲响应` (`IR`) 文件加载进去。Studio\
  \ One Pro 自带多个 IR 文件。以下是下载和使用它们的方法：\n\n1. 登录您的 [my.presonus.com](http://my.presonus.com)\
  \ 账户并前往 **产品** 页面。\n\n2. 在捆绑下载列表中找到 **Studio One Impulse Responses**：\n\n![Figure\
  \ 12.6: Downloading Impulse Responses](img/B31512_12_6.jpg)\n\n图 12.6：下载脉冲响应\n\n\
  1. 点击 `Download` 按钮。\n\n2. 下载完成后，将此文件从计算机的下载文件夹移动到一个更永久的位置。我们在 *第 2 章* 中讨论过文件位置。\n\
  \n3. 双击该文件。这将把文件中包含的所有脉冲响应注册到 `Open AIR` 中。\n\n4. 在 `Open AIR` 的界面上，点击预设下拉菜单并从列表中选择一个脉冲响应：\n\
  \n![Figure 12.7: Open AIR list of available impulse responses](img/B31512_12_7.jpg)\n\
  \n图 12.7：Open AIR 可用脉冲响应列表\n\n\n\n\n**Open AIR** 是最先进的技术，但它也能出色地模拟复古混响设备及其古怪的音色特征，因此它也是为你的音轨增添低保真氛围的绝佳工具。\n\
  \n## 延迟效果器\n\n**延迟** 是一种创建类似回声的声音重复的音频效果。延迟效果器是一种音频处理工具，可用于将此效果添加到音频信号中。这些效果器可用于广泛的应用场景，从创建微妙的空间效果到为混音添加复杂的节奏型。它们常用于电子音乐、氛围音乐和其他流派，在这些流派中，创造有趣且独特的声音景观是制作过程的关键部分。\n\
  \nStudio One 自带三款延迟效果器，每款都专注于不同风味的延迟，适用于各种场景。让我们逐一了解。\n\n### 模拟延迟\n\n**模拟延迟** 模拟了\
  \ 20 世纪 60 年代和 70 年代广泛使用的基于磁带的模拟延迟设备。其有趣、简洁的界面让你能轻松调出那些让这类设备大受欢迎的古怪特性，使其成为为音轨增添复古氛围的绝佳工具。\n\
  \n使用 **Color（色彩）** 部分的控制器，赋予延迟声音更温暖、更饱和的特质。然后，使用 **Motor（马达）** 部分的控制器，添加老化磁带马达产生的独特抖动。你将能瞬间创造出迷幻、回响风格的延迟效果！\n\
  \n### 节拍延迟\n\n**节拍延迟** 是一款通用延迟单元，能与项目的速度同步，并允许你从现有音乐素材中创建复杂且有趣的节奏型。此效果器中的 **Ping-Pong（乒乓）**\
  \ 选项会在左、右声道之间来回反弹延迟信号，创建立体声效果，为原本静态的声音增添动感和宽度。\n\n### 律动延迟\n\n**律动延迟** 属于多点延迟家族。**多点延迟**\
  \ 在一个单元中组合了多个可独立调节的延迟处理器，能创建错综复杂的节奏型和复杂的延迟。这种延迟常用于舞曲和电子音乐。\n\n乍看界面可能令人生畏，让我们拆解一下：\n\
  \n![Figure 12.8: Groove Delay](img/B31512_12_8.jpg)\n\nFigure 12.8: Groove Delay\n\
  \n**律动延迟** 由四个独立的延迟单元组成，称为 **点**，在界面上以列形式排列，标记为 **Tap 1** 到 **Tap 4**。以下是每个点可用控制器的概览：\n\
  \n*   **Pos.（位置）** 旋钮调整每个点的延迟时间。默认情况下，它以八分音符为增量。\n\n*   位置旋钮下方的水平推子允许你偏移延迟时间。如果你希望该点的声音略早于或晚于节拍，这会很有用。如果将此控制器完全向右滑动，这相当于附点八分音符的长度。\n\
  \n*   **FB（反馈）** 设置决定该点重复的时长。当设为 **0 %** 时，你只会听到一次点击。这有时被称为 **拍回延迟**。当设为 **100 %**\
  \ 时，延迟将无限持续。这有时被称为 **循环模式**，因为舞台上的音乐家用它来建立节奏背景，以便在其上叠加其他音乐素材。\n\n*   **Level（电平）**\
  \ 和 **Pan（声像）** 旋钮分别设置该点的音量和立体声定位。\n\n*   每个点底部的 **Filter（滤波器）** 部分允许你添加高切、低切和带通滤波器来着色该点的声音。通过自动化这些滤波器设置，你可以从非常简单的节奏素材中获得真正动态、不断演变的型态。我们将在本章后面讨论效果自动化。\n\
  \n与大多数效果器一样，了解 **律动延迟** 功能的最佳方式是探索预设。打开预设菜单（标记为 **Default**），浏览预设，准备好享受乐趣吧！\n\n\
  混响和延迟效果器将你的混音置于三维环境中，赋予其生命力。下一组效果器将为你的声音调色板增添无限可能，并帮助你赋予音轨独特的个性。我们即将踏入混音最具创造力的领域！\n\
  \n# 使用效果器增添色彩与个性\n\n如今，我们在杂志或广告牌上看到的几乎每一张照片，都在 Photoshop 或类似软件中经过大量修饰，以增强图像并强化其冲击力。音乐音轨也是如此。我们在音乐平台上听到的大多数素材，都通过特殊效果进行了增强，使其听起来更宏大、更有力。如果你打算在\
  \ Apple Music 或 Spotify 等音乐平台发布歌曲，你会希望确保你的音轨像其他作品一样经过打磨且引人入胜。庆幸的是，Studio One 提供了大量工具帮助你实现音轨所需的冲击力。在本节中，我们将仔细研究这些工具。\n\
  \n## 失真效果器\n\n**失真效果** 是音乐制作中常用的工具，用于为声音增添粗糙感、温暖感和个性。失真效果器种类繁多，名称各异，如过载、模糊、饱和和降位。它们影响声音的范围非常广，从几乎难以察觉到彻底毁坏原音。\n\
  \nStudio One 在失真类别中有三款效果器。让我们了解一下每一款。\n\n### Ampire\n\n**Ampire** 是一款多功能效果器，模拟了你在吉他手设备中能找到的所有模拟硬件设备：效果踏板、放大器、音箱模拟器，以及用于录制这些音箱的麦克风。它提供广泛的音色可能性来塑造吉他声音——从干净的爵士音色到高度饱和的金属撕裂音机，以及介于两者之间的任何音色。虽然其主要目标是电吉他，但它对于给其他声音增添冲击力和咬合感也大有裨益。例如，试着用在主奏合成器音色上，让它更上一层楼。\n\
  \n界面庞大，甚至可能无法适应较小的屏幕。让我们看一看：\n\n![Figure 12.9: Ampire consists of three sections\
  \ – stage (a), amp (b), and pedalboard (c)](img/B31512_12_9.jpg)\n\nFigure 12.9:\
  \ Ampire consists of three sections – stage (a), amp (b), and pedalboard (c)\n\n\
  界面由三个部分组成：舞台、放大器和踏板板。使用 *Figure 12.9* 中高亮显示的按钮来切换这些部分的可见性。让我们开始探索这项惊人技术置于你指尖的所有设备：\n\
  \n1.  使用窗口顶部的 **Amp（放大器）** 和 **Cabinet（音箱）** 选择器来选择你想使用的放大器和音箱。**Ampire** 自带基本的放大器和音箱选择，你可以从\
  \ Presonus 网站的 **Products（产品）** 页面（`https://www.presonus.com/products`）下载更多。\n\n\
  2.  一旦选择了放大器，其控制器将显示在窗口中间。像调节实体放大器一样调节这些控制器（所有控制器也都是仿照真实设备建模的！）。\n\n3.  接下来，尝试添加一些效果踏板为声音增添更多色彩。窗口底部的虚拟踏板板有八个插槽可供插入不同的踏板。你只需点击窗口最底部的踏板选择器即可添加或移除踏板。\n\
  \n    请注意，踏板初次插入时处于旁路状态。你必须点击它们的虚拟脚踏开关来激活它们。一旦激活，其 LED 灯将变红。\n\n4.  就像放大器一样，脚踏板上的控制器也经过了建模，因此这些虚拟脚踏板上的旋钮和开关将表现得就像其物理对应物上的控制器一样。随心所欲地调整它们，直到为你的乐器获得完美的音色。\n\
  \n\n\n\n5. 你可以在踏板板上拖动踏块以更改它们在信号链中的顺序。\n\n`Ampire` 非常好玩，但它是 Studio One 武器库中较为消耗 CPU\
  \ 资源的插件之一。考虑到引擎盖下的所有建模技术，这很容易理解。但如果你有多条吉他轨道且都在运行 `Ampire`，你可能需要留意性能指示器。如果你开始听到爆音和掉样，请增加\
  \ `Audio Dropout Protection` 设置，正如我们在 *第 11 章* 中讨论的那样。\n\n### Bitcrusher\n\n`Bitcrusher`\
  \ 代表了失真频谱的极端一端。当你想要彻底摧毁声音时，这就是你会伸手去拿的插件。通过诸如 `Wreck` 之类的控制，它让你通过降低位深来指定想要降低音质的程度；以及\
  \ `Dirt`，它向高频引入不稳定性以产生侵略性的效果，你可以确信这东西绝不会温和。\n\n### Red Light Distortion\n\n`Red\
  \ Light Distortion` 是一个非常灵活的插件，能够模拟具有极广泛风味的模拟失真。使用 `Type` 下拉菜单选择失真类型，并使用其他设置微调失真程度。`Red\
  \ Light Distortion` 可以非常温和；用它来增加光彩，让沉闷的人声录音变得生动。它也可以非常强烈；用它让声音听起来仿佛来自一台坏掉的收音机。尽管大胆尝试，但尝试时请调低音量。失真可能会突然让声音变得非常大！\n\
  \n## 调制插件\n\n`Modulation effects` 是音乐制作中用于创造声音动感、深度和趣味的一组音频效果。这些效果可应用于混音中的各种元素，包括乐器、人声和鼓。调制效果能帮助你创造独特且富有表现力的声音，让你的音乐脱颖而出。\n\
  \nStudio One Pro 自带七款调制效果插件。让我们逐一了解它们。\n\n### Autofilter\n\n`Autofilter` 拥有两个独立的频率滤波器，可以通过多种方式进行控制和编程。你可以手动调整滤波器，用内置的低频振荡器控制它们，用\
  \ 16 步音序器编程，或者将它们锁定到工程节奏，以创建从 DJ 风格的滤波器扫频到复杂节奏型的任何效果。\n\n它的学习曲线有点陡峭，但如果你制作 EDM 或类似流派，绝对值得投入精力。\n\
  \n### Chorus\n\n`Chorus` 是一种通过复制信号并为其音高和时间添加细微变化来创造浑厚、丰富声音的效果。它可用于为声音增加温暖感和深度，以及创造空间感和动感。\n\
  \nStudio One 的 `Chorus` 插件拥有复古风格的界面，这反映了它实际上模拟了复古模拟合唱设备。它为声音增添了温暖的模拟色彩，并让你能快速拨出许多音乐流派中备受推崇的浑厚合唱音色。\n\
  \n### Flanger\n\n`Flanger` 是一种类似于合唱的效果，但具有更明显的扫频声音。镶边器通过组合两个相同的、略微延迟的信号，并用滤波器对其进行调制，来创造旋转的、喷气般的声音。镶边效果最常用于电吉他，但在合成器轨道上同样如鱼得水。\n\
  \n镶边器是只有少数几个控制参数的简单设备，Studio One 的 `Flanger` 插件也不例外。值得一提的一个功能是它可以与工程节奏同步，这样你就可以设置其戏剧性的扫频声音，使其更具节奏感。\n\
  \n### Phaser\n\n`phaser` 通过将信号分成两条路径，延迟其中一条路径，并用滤波器对其进行调制，在声音中创建一系列波谷和波峰。结果是一种独特的声音，能创造动感和深度，效果可以从微妙到迷幻。\n\
  \nStudio One 的 `Phaser` 插件是一个非常简单的设备，提供将其扫频锁定到工程节奏的功能。\n\n### Rotor\n\n`Rotor` 模拟了旋转音箱的声音特性。这些音箱传统上与\
  \ Hammond 电子管风琴搭配，造就了该乐器独特的声音，但拥有这个插件将让你能在任何东西上尝试它——例如，它在电吉他和合成器上听起来就很棒。\n\n该插件是真实设备的精准模型，甚至能看到机柜内的虚拟扬声器在旋转，且它们的旋转速度会根据你的设置而变化。大胆玩玩这个插件吧。它非常好玩且听起来很棒。\n\
  \n### Vocoder\n\n`vocoder` 分析并合成人声的频谱和时间特性，并将其应用到另一个音频信号上。其工作原理如下：声码器接收一个调制信号（通常是人声）和一个载波信号（通常是乐器），并将它们结合以创造独特的合成声音（通常听起来像唱歌的机器人）。声码器被广泛用于从电子音乐到嘻哈、电影音乐和声音设计等各种流派。\n\
  \nStudio One 的 `Vocoder` 插件是一个强大的工具，允许你创造一些非常有创意的声音和纹理。设置 `Vocoder` 与其他效果插件略有不同，所以让我们带你逐步了解：\n\
  \n1. 打开 `Browse` 面板并转到 `Effects` 选项卡。\n2. 找到 `Vocoder`，然后将其拖放到你想要处理的轨道上。该轨道上的音频将成为\
  \ `Vocoder` 的调制信号。`Vocoder` 的样子如下：\n\n![图 12.10：Vocoder](img/B31512_12_10.jpg)\n\
  \n图 12.10：Vocoder\n\n3. 现在，让我们处理载波信号。`Vocoder` 可以使用另一条轨道的音频作为载波，或使用其自身的振荡器创建载波信号。如果你想使用另一条轨道的音频，请点击\
  \ `Vocoder` 窗口顶部的 `Sidechain` 按钮，然后点击你想用作载波信号的轨道对应的 `Send` 栏：\n\n![图 12.11：为 Vocoder\
  \ 选择载波信号](img/B31512_12_11.jpg)\n\n图 12.11：为 Vocoder 选择载波信号\n\n4. 如果你想让 `Vocoder`\
  \ 使用其自身的振荡器作为载波信号，请使用内部载波设置将振荡器设置为所需的波形和频率。\n5. 现在该玩了！`Vocoder` 窗口中间的 `Patch Matrix`\
  \ 部分设定了 `Vocoder` 分析器部分如何路由到其合成器部分。该路由由矩阵上的小红“针脚”显示。默认情况下，这些部分按顺序匹配，从而产生最清晰可辨的声码人声，但你可以改变针脚的位置以修改路由，创造出一些超现实的效果。你可以深究其背后的科学原理，但通过玩弄它来学习如何运作要快得多，也绝对更有趣。\n\
  6. 声码处理对元音效果最好。辅音表现不佳。窗口右侧的 `Unvoiced Replacement` 部分控制一个算法，该算法检测调制信号中的辅音并用其他信号替换它们，以提高语音清晰度。该算法的成败取决于素材，所以没有通用的配方。一如既往，实验是关键。\n\
  \n在所有效果插件中，`Vocoder` 可能是最具创意和趣味的。它允许你将两个声音融合为一个，创造出一种似乎会说话的乐器，或一种似乎被 MIDI 键盘控制的歌手。这里有大量等待发掘的创意潜力，绝对值得认真研究。\n\
  \n### X-Trem\n\n`X-Trem` 是一种颤音效果。`Tremolo` 通过调制信号的音量来创造脉动的或有节奏的声音。它可用于增加动感或节奏感。\n\
  \n\n\n`X-Trem` 界面简洁明了。一个可能被忽视的酷炫功能隐藏在 `Mode` 按钮下：当你选择 `Trem` 模式时，插件会调制信号的音量；当它处于\
  \ `Pan` 模式时，会调制信号在左右声道之间的声像。\n\n# 组合混音插件\n\n此类别中的插件是我们之前讨论的效果类型的组合。那么，为什么它们被打包成不同的插件，我们为什么要使用它们？让我们逐一探索，找出答案。\n\
  \n## 通道条\n\n音乐工作室中的大型硬件调音台乍看之下令人望而生畏。但仔细观察会发现，这些调音台的很大一部分实际上由几组相同的旋钮和按钮组成，分布在几条相同的条带上。这些被称为\
  \ `channel strips`（通道条）。每个通道条都包含处理单个音频通道所需的所有控制和处理工具。在典型的调音台上，这些工具包括一个简单的均衡器、一个噪声门和一个简单的压缩器。\n\
  \nStudio One 的 `Channel Strip` 插件基于同一理念。当你将此插件添加到音轨时，你会获得一个简单的压缩器、一个简单的均衡器和一个增益控制。虽然不花哨，但它能完成任务，而不会像专用的压缩器和均衡器插件那样占用大量计算机\
  \ CPU 资源。它非常适合只需要简单调整几下的音轨。\n\n## Fat Channel XT\n\n`Fat Channel XT` 与 `Channel\
  \ Strip` 截然不同。当简单的压缩器和均衡器插件无法满足需求时，它就是首选插件。`Fat Channel XT` 提供了珍贵复古硬件压缩器和均衡器的精准建模，让你能将这些设备的声色添加到信号流中。\n\
  \n`Fat Channel XT` 包含五个部分：\n\n*   `HPF`（高通滤波器）\n*   `Gate`（噪声门）\n*   `Compressor`（压缩器）\n\
  *   `Equalizer`（均衡器）\n*   `Limiter`（限制器）\n\n如果你看不到所有这些部分，请点击 `Stacked Mode`（堆叠模式）按钮切换它们的可见性：\n\
  \n![Figure 12.12: Fat Channel XT](img/B31512_12_12.jpg)\n\n图 12.12：Fat Channel XT\n\
  \n默认情况下，所有这些部分均处于关闭状态。你需要使用各自的电源按钮将它们开启。\n\n对于 `Compressor` 和 `Equalizer` 部分，你可以在不同复古设备的模拟之间进行选择。为此，请点击\
  \ `Stacked Mode` 按钮旁边的 `Compressor` 和 `Equalizer` 下拉菜单，然后选择你想使用的设备。\n\n请注意，与 Studio\
  \ One 自带的 `Compressor` 和 `Pro EQ3` 插件相比，这些建模插件消耗更多 CPU 资源，因此只有当你确实需要在音轨上获得那种模拟质感时，才建议使用\
  \ `Fat Channel XT`。\n\n## Mix Engine FX\n\n`Mix Engine FX` 是 Studio One 独有的功能，其运作方式与所有其他效果插件截然不同。它不是添加到单个音轨上，而是添加到整个混音控制台。`Mix\
  \ Engine FX` 随后应用建模技术来复刻珍贵模拟调音台的声色和特性，包括通道串扰、噪声和饱和度等独特特征。根据 Studio One 用户手册，“它是数字技术所能达到的最接近模拟的效果。”\n\
  \n要向项目添加 `Mix Engine FX`，请打开 `Mix`（混音）窗口，然后点击 `Main`（主）通道顶部的 `Mix FX` 按钮：\n\n![Figure\
  \ 12.13: Adding Mix Engine FX](img/B31512_12_13.jpg)\n\n图 12.13：添加 Mix Engine FX\n\
  \n添加效果后，再次双击 `Mix FX` 按钮以打开效果界面并访问其参数。Presonus 网站上提供了多种 `Mix Engine FX` 选项（只需登录并访问\
  \ `Products` 页面），代表不同调音台的建模。如果你想在混音中获得低保真、复古的氛围，一定要试试这些效果。\n\n到此为止，我们已经介绍了 Studio\
  \ One 中所有可用的工具，它们将帮助你控制、润色和增强音轨。为了完成对 Studio One 插件的巡礼，我们只需要看看几个旨在辅助混音过程的实用工具。\n\
  \n# 使用特殊工具和分析插件\n\nStudio One 武器库中的最后一组插件旨在执行特定的技术任务，并提供关于混音质量的可视化反馈。在音乐制作很大程度上已从商业工作室转移到家庭工作室的时代，我们越来越关注室内声学和监听音箱的准确性，因此这种可视化反馈对于确保混音处于最佳状态变得极其宝贵。\n\
  \n## 特殊工具\n\n此类别中的插件是旨在帮助你执行特定任务的实用工具。除 `Tuner`（调音器）外，它们在典型的家庭工作室工作流中可能用处不大，但知道它们在需要时可用是件好事。让我们快速看看工具箱里有什么。\n\
  \n### 调音器\n\nStudio One 内置了一个调音器（`Tuner`），可用于调校吉他、贝斯或任何需要调音的乐器。它速度快、可靠性高，可视化反馈比袖珍调音器上的微小显示屏好得多。它有一个\
  \ `Strobe`（频闪）模式，通常为乐器技师所青睐，以获得更高的准确性；你也可以将调音器设置为国际标准 440 Hz 以外的参考频率。\n\n### Mixtool\n\
  \n`Mixtool` 是一个瑞士军刀：它可以交换立体声音轨的左右声道，反转左或右声道的相位，对 MS 信号与立体声音轨进行编码或解码，并阻挡直流偏移。如果这些术语对你来说很陌生，你仍然可以找到\
  \ `Mixtool` 的用处，因为它有一个 `Gain`（增益）旋钮。当你想精确控制两个没有增益控制的效果插件之间的信号电平时（许多插件都没有），这非常方便。只需在它们之间插入一个\
  \ `Mixtool` 实例，并根据需要调整增益即可。\n\n### 音发生器\n\n`Tone Generator`（音发生器）产生噪声和基本波形类型。这些通常用于测试和校准目的，但\
  \ `Modulation`（调制）和 `Wobble`（摆动）功能实际上可以将此插件变成电子音乐制作人的秘密武器，为丰富的滤波器扫频和音效敞开大门。\n\n\
  ### IR Maker\n\n`IR Maker` 允许你创建自己的脉冲响应文件。然后你可以在 `Open AIR` 或 `Ampire` 的箱体部分中使用这些脉冲响应。设置起来有点麻烦，但如果你想为声音设计创建自定义的三维环境，绝对值得。请参阅\
  \ Studio One 用户手册以获取详细说明。要查看手册，请转到顶部菜单的 `Help`（帮助）并选择 `Studio One Reference Manual`（Studio\
  \ One 参考手册）。\n\n## 分析工具\n\nStudio One 提供了四个作为插件可用的分析工具。这些工具提供音频各方面的可视化反馈，让你即使因监听环境限制听不到问题，也能精准定位问题区域：\n\
  \n*   `Phase Meter`（相位计）用于可视化音频信号的立体声宽度。它是一个关键工具，帮助我们识别左右声道之间的任何相位相关性问题。这对于确保混音的立体声像在不同播放系统上保持一致非常重要。我们将在\
  \ *第 15 章* 中讨论相位相关性，届时我们将再次探讨 `Phase Meter`。\n*   `Spectrum Meter`（频谱仪）显示音频信号的频率内容。它帮助你直观地定位问题区域，例如不需要的啸叫声。`Spectrum\
  \ Meter` 还允许你将混音的频率内容与参考音轨的进行比较和匹配，正如我们在下一章将看到的那样。\n\n\n\n\n## 效果器插件：电平表和示波器\n\n\
  **电平表** 显示音频信号的振幅，并提供信号感知响度的数值测量。这对于确保我们的最终混音符合数字音乐平台实施的响度标准非常有用。\n\n**示波器** 的工作原理类似于硬件示波器，用于识别仅通过聆听信号可能无法察觉的音频问题。这些问题可能包括通道间的串扰、背景噪音或削波。\n\
  \n这结束了我们对 Studio One 自带效果器插件的介绍。请记住，通过 Pro+ 会员资格还可以下载更多插件。虽然界面和音色特质可能有所不同，但我们已经涵盖了所有主要插件类型，现在您可以自信地运用这些知识来确定哪种插件最适合实现您追求的声音。\n\
  \n## 摘要\n\n在本章中，我们深入探讨了 Studio One 令人印象深刻的效果器插件阵容，并讨论了每个插件发挥作用的场景。\n\n在下一章中，我们将通过探索多种将这些插件添加到混音会话的不同方法，将这些知识付诸实践。\n"
- "## 第 13 章：优化信号流程并提升您的混音\n\n**混音** 对大多数人来说是一项令人生畏的任务，因此本章的标题可能看起来有点吓人。事实上，它只是另一种技能组合，将把您的音乐制作推向一个新的高度。虽然混音不应掉以轻心，但如今的技术使整个过程变得更加易于上手。凭借\
  \ Studio One 直观的设计，曾经难以理解甚至更难以实现的技术现在触手可及。\n\n在本章中，我们将深入研究信号处理在 Studio One 中的工作原理，以及如何利用混音控制台的强大功能以最佳方式呈现您的歌曲。然后，我们将讨论一些专家级实践，使您的混音听起来更加润色和精致。最后，我们将讨论如何从歌曲中导出分轨和最终混音，以便您可以在音乐平台上分享它们。\n\
  \n我们将涵盖以下主题：\n\n*   理解 Studio One 的信号流程\n*   应用高级技巧\n*   导出最终混音和分轨\n\n## 技术要求\n\n\
  要学习本章内容，您需要在计算机上激活 Studio One。\n\n## 理解 Studio One 的信号流程\n\n**信号流程** 是指音频信号通过混音器及其组件（包括我们在\
  \ 第 12 章 中讨论的插件效果）所走的路径。当今音乐制作软件中的典型信号流程路径高度灵活，允许制作人实施创造性和创新性的混音技术，但这也带来了更多复杂性。了解信号流程的拓扑结构对于充分利用这项多功能技术呈现的潜力非常重要，这也是我们将在本节中介绍的内容。\n\
  \n### 混音器通道的剖析\n\n让我们从探索 **混音控制台** 上的一个通道开始。**编排** 窗口中的每个轨道在 **混音** 窗口中都有一个对应的通道，如下所示：\n\
  \n![Figure 13.1: A channel on the Mix Console](img/B31512_13_1.jpg)\n\nFigure 13.1:\
  \ A channel on the Mix Console\n\n让我们分解一下：\n\n*   该通道的顶部包含两个标题为 **插入** 和 **发送**\
  \ 的部分。在 Studio One 中，这两个部分统称为 **设备机架**。我们使用这些部分来添加效果器插件。\n*   通道正中间是 **输入** 和 **输出**\
  \ 选择器。我们在 第 5 章 中讨论过 **输入** 选择器，当时我们用它来选择音频接口上想要录制的物理输入。但现在我们处于混音阶段，所以我们希望该通道监听对应轨道上已录制的内容。为此，请确保\
  \ **监听** 按钮（图 13.1 中高亮显示）处于禁用状态。启用时（蓝色），该通道监听来自音频接口物理输入的信号。禁用时（灰色），该通道监听轨道上的录音，这正是我们想要的。\n\
  *   默认情况下，每个通道的输出都路由到混音控制台的 **主** 输出通道。**主** 输出通道是混音控制台上所有通道汇合的地方。它始终位于混音控制台的最右侧。\n\
  *   在通道底部，我们有推子，它控制通道的音量。\n\n图 13.2 显示了我们迄今为止讨论的组件的信号流程：\n\n![Figure 13.2: Signal\
  \ flow on a mixer channel](img/B31512_13_2.jpg)\n\nFigure 13.2: Signal flow on a\
  \ mixer channel\n\n现在，让我们分解图 13.2 中的组件：\n\n1.  **音频事件**：这是您计算机硬盘上的录音。它在 **编排** 窗口中对应轨道上显示为一个音频事件。这段录音将成为我们混音会话的原始素材。\n\
  2.  **实时输入**：这是来自您音频接口的信号。我们用它来录制上述音频事件，但在混音会话期间不再需要它。\n3.  **监听按钮**：这充当上述两个输入源（即音频事件和实时输入）之间的选择器。在其当前状态（灰色）下，它设置为允许来自音频事件的输入。\n\
  4.  **插入机架**：这是我们将用来向该通道插入效果器插件的部分。\n5.  **推子**：我们将用它来设置该通道的音量。\n6.  **发送机架**：我们将用此部分将信号从该通道发送到其他通道。\n\
  7.  **主通道**：这是整个信号流程中的最后一个元素，混音器上的所有通道在此合并为单个立体声输出。\n\n图 13.2 中矩形内的所有内容都是通道的组成部分。现在，让我们仔细观察这些组件，以探索处理通过该通道音频的各种方法。\n\
  \n### 使用插入机架添加效果\n\n**插入** 机架是信号流程中的关键组件。它是我们向通道添加效果器插件以处理音频的点。术语 **插入** 是指将插件直接插入链路的信号流程中以应用音频处理。为了说明，假设您有一条电吉他轨道，想要使用\
  \ **Ampire** 为其添加一些模拟失真效果。操作方法如下：\n\n1.  打开 **浏览** 窗口并转到 **效果** 选项卡。您将看到系统上安装的所有插件列表：\n\
  \n![Figure 13.3: A list of effects plug-ins](img/B31512_13_3.jpg)\n\nFigure 13.3:\
  \ A list of effects plug-ins\n\n1.  如果您知道要查找的插件名称，请单击 **浏览** 窗口右上角的放大镜图标以打开搜索框，然后输入名称。\n\
  \n    如果您不记得插件名称，或者想查看所有可用效果，请使用排序选项（图 13.3 中高亮显示）来组织列表。**文件夹** 根据效果类型对所有插件进行排序，类似于我们在\
  \ 第 12 章 探索效果时使用的类别，而 **厂商** 则按制造商对它们进行排序。\n\n2.  如果 **混音** 窗口尚未打开，请将其打开。找到您想要插入\
  \ Ampire 的通道。\n\n3.  从 **浏览** 窗口拖动 **Ampire** 并将其放置在通道的 **插入** 机架上。\n\n您可以使用此方法添加任意数量的插件。在这里，我在一个通道上插入了\
  \ **Ampire**、**Chorus** 和 **Pro EQ**：\n\n![Figure 13.4: The Inserts rack holding\
  \ multiple plug-ins](img/B31512_13_4.jpg)\n\nFigure 13.4: The Inserts rack holding\
  \ multiple plug-ins\n\n\n\n\n插件的顺序非常重要。信号在 `Inserts` 槽中从上至下流动 —— 本例中依次为 `Ampire`、`Chorus`，再到\
  \ `Pro EQ3`。如此排列插件，即先加失真再加合唱效果。这与先合唱后失真的听感截然不同。这在音频工程师间常引发“鸡生蛋蛋生鸡”式的争论，最好的办法是亲自尝试不同组合，听听哪种最合心意。你可以在\
  \ `Inserts` 槽中点击拖拽插件，轻松调整顺序。\n\n现在，让我们在信号流程图中加入插入效果：\n\n![图 13.5：带插入效果的信号流程](img/B31512_13_5.jpg`)\n\
  \n图 13.5：带插入效果的信号流程\n\n插入插件后，双击 `Inserts` 槽中的插件名称即可打开其界面开始调整。要移除插件，右键点击其名称，从下拉菜单中选择\
  \ `Remove`。\n\n## 使用 FX 通道\n\n另一种给通道添加效果的方法是使用 `FX channel`。我们通过一个例子来说明。假设你在一轨上有鼓声录音。演奏细腻、细节丰富，但在混音中容易被其他乐器掩盖。你想压缩信号，因为压缩能增加冲击力、凸显细节。但同时你又不想压缩，因为压缩会缩小动态范围，抹去录音中的激情与表现力。该怎么办？\n\
  \n解决办法是将鼓声通道的信号分成两路 —— 一路直接送往 `Main` 输出，无任何处理，从而保留原演奏的表现力；另一路送往单独的通道，即 `FX channel`，该通道插入了压缩器，增加冲击力与细节。这样便两全其美。Figure\
  \ 13.6 说明了其工作原理：\n\n![图 13.6：FX 通道的信号流程](img/B31512_13_6.jpg`)\n\n图 13.6：FX 通道的信号流程\n\
  \n在 Figure 13.6 中，上方通道是鼓声通道。该通道的 `Sends` 槽将信号分为两路。第一路继续流向 Mix Console 的 `Main` 通道，携带干声、未处理信号。第二路（虚线表示）送往\
  \ `FX channel`，经压缩器处理。处理后的信号再送往 `Main` 通道，与项目中所有其他通道混合。\n\n了解 `FX channel` 的工作原理后，我们也给出定义\
  \ —— `FX channel` 是一个独立通道，不连接任何轨道作为输入源。我们通过其他通道的 `Sends` 槽向其发送信号。`FX channel` 通过自身\
  \ `Inserts` 槽上的效果器处理这些信号。\n\n由于这种布局允许同一信号在两个并行通道中流动，有时被称为**并行处理**。我们刚才描述的配置 —— `FX\
  \ channel` 上插入压缩器 —— 是一种极常用的技巧，甚至有专门名称：**并行压缩** 或 **纽约压缩**。混音师常用此法让鼓声在混音中更响亮、更饱满，得益于\
  \ Studio One 的拖放界面，实现起来非常容易。\n\n下面介绍如何用 `FX channel` 法给通道添加效果。我们继续以鼓轨为例：\n\n1. \
  \ 打开 `Browse` 窗口，切换到 `Effects` 标签。你会看到系统安装的所有插件列表。找到 `Compressor` 插件。\n\n2.  打开\
  \ `Mix` 窗口（若未打开），找到鼓声通道。\n\n3.  从 `Browse` 窗口拖拽 `Compressor` 到鼓声通道的 `Sends` 槽。Studio\
  \ One 会自动执行以下操作：\n\n    *   创建一个新的 `FX channel`\n    *   将 `Compressor` 放置在 `FX\
  \ channel` 的 `Insert` 槽上\n    *   在鼓轨的 `Sends` 槽上创建指向该 `FX channel` 的链接\n\n    最终效果如下：\n\
  \n![图 13.7：鼓声通道（左）向 FX 通道（中）发送信号。两者均路由至主输出（右）](img/B31512_13_7.jpg`)\n\n图 13.7：鼓声通道（左）向\
  \ FX 通道（中）发送信号。两者均路由至主输出（右）\n\n4.  使用鼓声通道 `Sends` 槽中的小蓝色水平滑块，设置发送到 `FX channel`\
  \ 的信号量。这实际上调节原始鼓声与处理后信号的平衡。\n\n注意 Figure 13.7 正是 Figure 13.6 在现实中的样子 —— 鼓声通道的 `Sends`\
  \ 槽指向 `FX channel`，后者的 `Inserts` 槽上插着 `Compressor` 插件。对比两图可更直观地理解信号流向。\n\n`FX channel`\
  \ 的一大便利是：你可以从任意数量的通道向其发送信号。例如项目有 60 轨，你想给其中 30 轨加混响，只需创建一个插有混响插件的 `FX channel`，让那\
  \ 30 轨都发送信号给它。这比在每轨单独插混响插件好得多，因为：\n\n*   降低 CPU 负载。混响插件尤为消耗资源。\n*   简化操作。混音推进中若觉得混响过多或过少，只需调整\
  \ 1 个插件，而非 30 个。\n*   更符合物理与声学规律。现实中，同一演出里的所有乐器都处于同一混响环境，将所有通道送往同一混响器能获得更真实的效果。视流派与制作风格，这种真实感未必是目标，若不适用请忽略此点。\n\
  \n创建 `FX channel` 后，从其他通道发送信号很容易。点击任意通道 `Sends` 槽上的 `+` 按钮即可。回到 Figure 13.7 的例子，我们从\
  \ `E Gtr` 通道发送信号到 `FX channel`：\n\n![图 13.8：向现有 FX 通道发送信号](img/B31512_13_8.jpg`)\n\
  \n图 13.8：向现有 FX 通道发送信号\n\n一首 Song 中可创建任意数量的 `FX channel`。既然 `FX channel` 自带 `Sends`\
  \ 槽，你甚至可以在 `FX channel` 之间互发信号，从而实现极具创意潜力的多功能信号路由。\n\n## 使用总线控制多个通道\n\n`Bus` 是 Mix\
  \ Console 上的一种通道，可合并多个其他通道。例如歌曲中有多条鼓轨，可将它们全部路由到一个 `Bus` 通道。然后用 `Bus` 通道的控制器统一处理所有鼓轨。这是简化混音流程的好方法。\n\
  \n按以下步骤将多个通道路由到 `Bus` 通道：\n\n1.  打开 `Mix` 窗口。\n\n2.  选中想合并到 `Bus` 通道的通道。按住 `Ctrl`\
  \ (Windows) 或 `Cmd` (Mac) 点击可多选。\n\n3.  右键点击任一选中通道。弹出菜单中选择 `Add Bus for Selected\
  \ Channels`。这会在 `Main` 输出旁创建一个名为 `Bus 1` 的新 `Bus` 通道。所有选中通道会自动路由到这个新 `Bus` 通道：\n\
  \n![图 13.9：鼓声通道已路由至总线通道](img/B31512_13_9.jpg`)\n\n\n\n\n## 使用总线通道\n\n图 13.9：鼓通道已路由至总线通道\n\
  \n1. 双击新总线通道的名称，并为其指定一个描述性名称。\n\n此通道配置的信号流向如下所示：\n\n![图 13.10：图 13.9 中通道配置的信号流向](img/B31512_13_10.jpg)\n\
  \n图 13.10：图 13.9 中通道配置的信号流向\n\n现在，您可以使用此总线通道的推子来控制整个鼓组的电平，并使用其 `Inserts`（插入效果）和\
  \ `Sends`（发送）机架对所有鼓通道统一应用效果。请注意，您在单个鼓通道上应用的任何设置或效果仍然有效；总线通道在此基础上增加了一个额外的控制层。\n\n\
  ### 提示\n\n在某些硬件调音台（如 SSL）和某些其他音乐制作软件（如 Cubase）中，总线被称为组或组通道。如果您是从这些软件转到 Studio One\
  \ 的，请注意术语的这一变化，因为在 Studio One 中 `group` 含义不同，我们将在*使用组以实现更快的工作流*一节中看到这一点。\n\n将多个通道合并到单个总线中，可让您将它们视为单个通道处理。例如，您现在可以使用我们创建的总线，同时对所有四条鼓轨道应用纽约式压缩。只需从\
  \ `Browse`（浏览器）窗口拖动一个压缩器并将其放置在总线的 `Sends`（发送）机架上。最终结果将如下所示：\n\n![图 13.11：将效果通道应用于总线](img/B31512_13_11.jpg)\n\
  \n图 13.11：将效果通道应用于总线\n\n上述配置的信号路由如下所示：\n\n![图 13.12：图 13.11 中通道配置的信号流向](img/B31512_13_12.jpg)\n\
  \n图 13.12：图 13.11 中通道配置的信号流向\n\n您可以创建任意数量的总线，并将总线路由到其他总线。一旦您习惯了在混音中融入总线和效果通道，可能性就是无限的，这为一些非常有创意且节省时间的选项打开了大门。\n\
  \n## 使用 VCA 通道控制音量\n\n`Voltage-Controlled Amplifier`（电压控制放大器，`VCA`）通道允许您控制一个或多个通道的电平。您可以将\
  \ `VCA` 通道视为总线通道的简化版。总线通道拥有 `Inserts`（插入效果）和 `Sends`（发送）机架以及推子，而 `VCA` 通道仅有一个推子。\n\
  \n要理解为什么 `VCA` 通道是一个绝妙的主意，让我们回到我们一直在处理的四个鼓通道和鼓总线通道。想象一下，在混音过程中，您在鼓总线的推子上添加了一些复杂的自动化，调整整个鼓组的电平以适应歌曲的流动。第二天，您用全新的耳朵聆听混音，发现鼓声实际上在整首歌中都盖过了混音。因此，您决定将鼓声整体降低几分贝。\n\
  \n通常，这意味着要编辑鼓总线推子上的自动化。虽然这当然可行，但这并不是一种实用或方便的方法，特别是如果您想在聆听混音时主动调整电平的话。\n\n这就是 `VCA`\
  \ 通道概念发挥作用的地方——它在信号路径上增加了第二个推子，可用于进一步调整鼓总线的电平。这样，您可以让鼓总线上的推子负责自动化，而使用 `VCA` 通道上的推子来微调鼓组的整体音量。\n\
  \n### 添加 VCA 推子\n\n以下是向通道添加 `VCA` 推子的方法：\n\n1. 选择您想要用 `VCA` 推子控制的通道。这可以是任意组合的通道——例如，如果您希望某些打击乐通道的音量随鼓通道以相同幅度变化，请同时选择单个打击乐通道和鼓总线。\n\
  \n2. 右键单击任一选定通道。从弹出菜单中选择 `Add VCA for Selected Channels`（为选定通道添加 VCA）。这将创建一个 `VCA`\
  \ 通道，并将选定通道的推子路由到 `VCA` 通道上的推子。此路由将显示在受影响的推子下方：\n\n![图 13.13：总线上的推子路由至 VCA 1](img/B31512_13_13.jpg)\n\
  \n图 13.13：总线上的推子路由至 VCA 1\n\n现在，您可以使用 `VCA` 通道的推子来控制所有路由至它的通道的电平。请注意，您甚至可以对 `VCA`\
  \ 通道上的推子进行自动化，以增加额外的控制层。\n\n恭喜！您现在拥有了大师级的信号路由技能。就信号流向而言，这是典型音乐混音会话中最复杂的情况了。掌握了这些知识，您现在已准备好有效应对项目中可能遇到的几乎任何信号处理挑战。在下一节中，我们将以此为基础，探索一些更复杂的混音技巧。\n\
  \n# 应用高级技巧\n\n在本节中，我们将介绍一些在混音中操控声音的更具创新性的方法。虽然这些通常被视为高级技巧，但这并不意味着它们难以理解或执行。相反，这意味着只有在您掌握了前几节介绍的基本技巧后，才会发现它们有用。一旦达到那个程度，我们即将讨论的技巧实现起来相当容易。\n\
  \n让我们从所有这些高级技巧中最流行的一个开始。\n\n## 侧链处理\n\n`Sidechain processing`（侧链处理）（或称 `sidechaining`\
  \ 侧链）是一种技术，其中一个音频源的信号被用来控制另一个音频源的处理。换句话说，侧链信号被用来触发目标音频信号上的特定处理效果。\n\n侧链可用于无数种目的，范围从创意性到高度技术性。以下是一些可能的使用场景：\n\
  \n* 在现场表演中，应用半播放，以便当歌手对着麦克风唱歌时，我们听到实际表演，但当他们停止演唱时，伴奏自动启动。\n* 在电子舞曲制作中，在踢鼓和贝斯轨道之间创造标志性的“泵感”效果。\n\
  * 在电视纪录片中，当旁白开始时，自动压低背景音乐。\n* 在流行歌曲中，当踢鼓击打时自动降低贝斯轨道的音量，使踢鼓在混音中脱颖而出。\n\n虽然这些是最常见的场景，但这只是侧链用途的冰山一角。\n\
  \n现在，让我们看看如何在混音中实现这一技巧。以此踢鼓和贝斯吉他轨道为例：\n\n![图 13.14：踢鼓轨道（上）和电贝斯轨道（下）](img/B31512_13_14.jpg)\n\
  \n图 13.14：踢鼓轨道（上）和电贝斯轨道（下）\n\n在大多数流行音乐流派中，踢鼓和贝斯吉他同时演奏。在*图 13.14*中，每个踢鼓击打都对应一个贝斯音符。混音时这会成为一个问题，因为在典型的流行混音中，我们希望这两种乐器都响亮且突出，而在它们一起演奏的时刻，它们的合成能量变得如此之大，以至于占用了主通道中大部分可用的动态余量，留给其他乐器的空间非常少。这可能导致主通道削波，迫使您降低整个混音的音量。\n\
  \n如果您仔细观察*图 13.14*，会注意到这两个声音的时间特征截然不同——踢鼓具有尖锐的起音，称为瞬态，并迅速衰减。而贝斯则具有较慢的起音并持续相当长的时间。这两种乐器之间的问题重叠仅发生在踢鼓声音的起音阶段，持续时间非常短，在毫秒级范围内。\n\
  \n\n\n\n# Studio One 中的音频处理技术\n\n## 侧链压缩\n\n如果我们能找到一种方法，仅在几毫秒内降低贝斯音量，问题就能解决。这可以通过侧链的一个特定版本轻松实现，称为\
  \ `sidechain compression`。基本上，我们会在贝斯轨道上插入一个压缩器，但该压缩器不会监听贝斯轨道，而是监听底鼓轨道，并在检测到底鼓轨道有信号时降低贝斯音量。\n\
  \n以下是基于底鼓和贝斯轨道示例实现侧链压缩的方法：\n\n1. 如果 `Mix` 窗口尚未打开，请将其打开。\n2. 在贝斯通道上插入一个压缩器。\n3. 点击压缩器界面顶部的\
  \ `Sidechain` 按钮。这将打开一个弹出菜单，其中列出了项目中所有活动的通道：\n\n![图 13.15：插件的侧链选项](img/B31512_13_15.jpg)\n\
  \n图 13.15：插件的侧链选项\n\n4. 在此列表中，点击底鼓通道对应的 `Send` 复选框。\n5. 我们希望压缩器在检测到底鼓通道有击打声时立即起作用，因此接下来，我们将压缩器的\
  \ `Attack` 参数设置为一个相当低的值：4 或 5 毫秒是一个不错的平均设置。Studio One 的压缩器可以比这快得多，但如此极端的 Attack\
  \ 值可能会导致咔哒声。\n6. 我们还希望压缩器在底鼓尖锐的攻击阶段结束后立即停止压缩。将 `Release` 时间设置在 50 毫秒左右，但如果你想创造电子舞曲中标志性的泵感贝斯声音，可以尝试更高的值。这里没有固定的数值；这取决于歌曲的速度和声音的时间特性，所以请不断尝试直到效果完美。\n\
  7. 你可以在压缩器的 `Ratio` 和 `Threshold` 设置上稍微激进一些，因为这种压缩发生在毫秒级的时间范围内。这里的目标是瞬间尽可能多地降低贝斯音量，同时不造成其音量的明显下降。\n\
  \n就这些！现在，虽然这个压缩器插在贝斯通道上，但它监听的是底鼓通道，并对底鼓的击打做出反应。信号流程如下所示：\n\n![图 13.16：侧链压缩的信号流程](img/B31512_13_16.jpg)\n\
  \n图 13.16：侧链压缩的信号流程\n\n这个例子只是在项目中使用侧链处理的一种方式。并非所有效果插件都具备侧链功能，但每个新版本都会为更多插件添加此功能。下次打开插件时，检查它是否支持侧链，并思考如何利用该功能为你的混音添加富有创意的动态效果。\n\
  \n## 使用 Splitter 进行精准定位\n\n`Splitter` 是一个实用工具插件，可让你将信号拆分为多条路径。然后你可以分别处理这些路径中的每一条，这为多功能且强大的声音处理选项打开了大门。以下是一些可能性：\n\
  \n* 将鼓循环拆分为两条相同的路径并压缩其中一条。这将在单个通道内有效地实现纽约压缩。\n* 将声音的低频内容拆分到单独的路径并将其转换为单声道。此技术用于最大化混音的单声道兼容性，通常只能通过称为\
  \ `multiband imagers` 的高端插件来实现；然而，使用 Splitter，你仅凭 Studio One 的内置插件就能做到这一点。\n* 将立体声轨道的左、右声道拆分并分别处理。这允许你想出一些非常有创意的声音设计点子，而如果用单个插件同时处理左右声道则无法实现。\n\
  \n迄今为止讨论的插件修改的是通过通道的声音，而 Splitter 修改的是信号路径本身，因此与其他插件相比，使用 Splitter 需要不同的方法。让我们逐步演示该过程：\n\
  \n1. 从 `Browse` 窗口拖动 `Splitter` 并将其放置在你要处理的通道的 `Inserts` 机架上。这将打开 `Routing` 窗口：\n\
  \n![图 13.17：带有 Splitter 的 Routing 窗口](img/B31512_13_17.jpg)\n\n图 13.17：带有 Splitter\
  \ 的 Routing 窗口\n\n1. `Routing` 窗口的左侧显示我们刚插入的 Splitter 的设置。使用 `Splits` 选择要将信号拆分为多少条路径。在本例中，我们将使用两条路径。\n\
  2. 使用 `Levels` 设置每条路径的音量，使用 `Mute` 暂时静音路径。\n3. `Split Mode` 设置拆分信号的依据。有三个选项：\n \
  \   * `Normal` 将信号拆分为两个或多个相同的副本。这对于在单个轨道内应用并行处理很有用。\n    * `Channel Split` 将立体声通道拆分为成对的单声道信号，允许你分别处理左、右声道。\n\
  \    * `Frequency Split` 将信号拆分为频段，并将每个频段放置在单独的路径上。在图 13.18 中，我在 240 Hz 处拆分信号。你可以将其视为一个分频点；低于\
  \ 240 Hz 的任何频率将路由到路径一，高于该频率的任何频率将路由到路径二。如果你需要将频率划分为更小的频段，请增加 `Splits` 设置以创建额外的路径，并根据需要调整它们各自的分频频率。\n\
  \n![图 13.18：Splitter 上的 Frequency Split 模式](img/B31512_13_18.jpg)\n\n图 13.18：Splitter\
  \ 上的 Frequency Split 模式\n\n1. 拆分通道后，你可以从 `Browse` 窗口拖动效果插件并将其放置在要处理的路径上。在图 13.19\
  \ 中，我让 `Autofilter` 插件处理左声道，让 `Beat Delay` 处理右声道。\n\n![图 13.19：向 Splitter 的路径添加插件](img/B31512_13_19.jpg)\n\
  \n图 13.19：向 Splitter 的路径添加插件\n\n你可以添加任意数量的 Splitter，在每个 Splitter 中创建任意数量的 Splits，并在每条路径上插入任意数量的插件。你还可以拖动\
  \ `Routing` 窗口中的每个项目来更改其在信号流中的位置，创建专属于你的精彩效果链。Splitter 真的是音频工程师的游乐场！\n\n## 使用 Groups\
  \ 加快工作流程\n\n如果你有多个通道想要一起处理，可以使用 `Group` 功能链接它们的参数。在组内对任何通道执行的操作也将应用于其他通道。这是一个很棒的省时功能，有助于简化你的工作流程。\n\
  \n要将通道放入组中，请按以下步骤操作：\n\n1. 在 `Mix` 窗口上，选择要分组的通道，然后右键点击其中任意一个。\n2. 在弹出菜单中选择 `Group\
  \ Selected Tracks`。这将打开一个对话框，你可以在其中为该组命名。\n3. 给该组一个简短、描述性的名称，然后点击 `OK`。这将帮助你在处理大型项目时轻松识别各个组。\n\
  \n组中的通道将在其推子顶部标记一个组图标：\n\n![图 13.20：指示分组通道的组图标](img/B31512_13_20.jpg)\n\n图 13.20：指示分组通道的组图标\n\
  \n默认情况下，将通道放入组会链接它们的推子、声像控制、Solo、Mute、Record Enable 和 Monitor 按钮，以及发送路由。要从组中排除这些参数中的任何一个，请执行以下操作：\n\
  \n1. 点击 `Mix` 窗口上的 `Show Groups` 按钮。这将打开 `Group Panel`：\n\n![图 13.21：Mix 窗口的 Show\
  \ Groups 按钮和 Groups 面板](img/B31512_13_21.jpg)\n\n图 13.21：Mix 窗口的 Show Groups 按钮和\
  \ Groups 面板\n\n1. 右键点击你想要修改的组的名称。\n\n\n\n# 自定义插件\n\n正如我们在*第 12 章*中所见，效果器插件种类繁多，使用方法也无穷无尽，但随着你混音能力的提升，你会发现自己建立了一份简短的、经过验证且值得信赖的插件清单，并且比其他插件更频繁地使用它们。你还会发现，在各个项目中，你对这些插件的设置几乎如出一辙。这并非坏事；相反，这是你独特制作风格的一部分。\n\
  \nStudio One 让你轻松整理常用插件，并按你想要的方式在项目中调用它们，从而节省时间并优化工作流。让我们来探索使这成为可能的功能。\n\n## 添加到收藏夹\n\
  \n如果你发现自己经常使用某个插件，不妨将其添加到插件列表中的 `Favorites`（收藏夹）类别：\n\n![Figure 13.22: A list of\
  \ plug-ins on the Browse panel](img/B31512_13_22.jpg)\n\n图 13.22：“浏览”面板上的插件列表\n\n\
  这会让插件更易查找，尤其是当你拥有大量插件时。具体操作如下：\n\n1.  打开 `Browse`（浏览）面板，切换到 `Effects`（效果器）选项卡。\n\
  2.  在插件列表中，右键点击你想标记为收藏的插件。\n3.  在弹出菜单中，选择 `Favorite`（收藏）。\n\n`Favorites`（收藏夹）将出现在所有插件列表的顶部——包括\
  \ `Mix`（混音）窗口的 `Inserts`（插入）机架、`Inspector`（检查器）面板以及 `Browse`（浏览）窗口。你的常用插件始终触手可及。\n\
  \n## 创建效果器链\n\n如果你发现自己使用相同的插件、相同的设置且排列顺序相同，可以将它们保存为 FX 链，以便在项目中即时调用。\n\n例如，我喜欢使用\
  \ `Room Reverb`（房间混响），但由于它没有内置均衡器部分或滤波器，我在混响后添加 `ProEQ3` 以去除极端频率。然后，我添加 `Binaural\
  \ Pan`（双耳声像）以给混响增加额外宽度，使混音更具立体感。这已经是我一段时间以来的首选混响设置。\n\n我不必在每个项目中逐个添加这些插件并从头调整，而是可以为它们创建一个\
  \ FX 链，以便在未来的项目中调用。具体操作如下：\n\n1.  在通道的 `Inserts`（插入）机架上排列好插件。\n2.  打开每个插件并按你希望在下一个项目中看到的方式进行调整。Studio\
  \ One 也会记住每个插件的设置。\n3.  点击 `Inserts` 机架顶部的小三角形。这将打开 `FX Chain`（效果器链）菜单：\n\n![Figure\
  \ 13.23: The FX Chain menu](img/B31512_13_23.jpg)\n\n图 13.23：FX Chain 菜单\n\n4. \
  \ 在此菜单中，点击 `Store FX Chain`（存储效果器链）。这将打开一个对话框，提示你为新的 FX 链命名。\n5.  为你的 FX 链起一个简短、描述性的名称（如\
  \ `main vocal reverb` 主唱混响），然后点击 `OK`。\n\n下次你在任何项目的任何通道上打开 `FX Chain` 菜单时，这个 FX\
  \ 链都会静候在那里，随时以完全相同的设置供你调用。多么省时啊！\n\n## 为插件添加预设\n\n如果你经常在插件上使用相同的设置，可以将其保存为预设，从而免去在每个项目中从头调整的麻烦。按以下步骤操作：\n\
  \n1.  将插件的所有参数设置为你想要存储在预设中的状态。\n2.  点击插件界面上的微小页面图标以打开其预设菜单：\n\n![Figure 13.24: The\
  \ plug-in preset menu](img/B31512_13_24.jpg)\n\n图 13.24：插件预设菜单\n\n3.  点击 `Store\
  \ Preset`（存储预设），为预设起一个描述性名称（如 `lead guitar delay` 主音吉他延迟），然后点击 `OK`。\n\n现在，每当你在任何通道、任何项目中启动此插件时，该预设都将可用。\n\
  \n这结束了我们对 Studio One 混音台中高级混音技巧和工作流窍门的探索。接下来，我们将讨论如何从 Song 中导出最终混音或分轨，以便你发布或与合作者分享。\n\
  \n# 导出最终混音和分轨\n\n一旦你对混音感到满意，就会想与全世界分享。然而，既然其他人无法打开我们的 Studio One 项目文件，你首先需要将混音转换为一种标准文件格式，以便大家能在媒体播放器中打开。这个过程称为**导出**。当你在\
  \ Studio One 中导出 `Song` 时，项目中的众多通道将被混缩为单个立体声通道，然后以全球通用的音频文件格式保存。\n\n从 Studio One\
  \ 导出 `Song` 有两种方法，用途各异。让我们从更常用的方法开始。\n\n## 导出最终混音\n\n从 `Song` 导出最终混音意味着将所有通道混缩为一个立体声通道，并将该立体声通道嵌入音频文件中。这听起来很复杂，但一旦你设置好几个参数，Studio\
  \ One 就能优雅地完成这项任务。\n\n按以下步骤导出 `Song` 的最终混音：\n\n1.  在 `Arrange`（编排）窗口中设置左、右定位器，分别标记\
  \ `Song` 的开始和结束。默认情况下，Studio One 仅导出这两个定位器之间的时间线部分，所以请花时间正确放置它们。\n\n> **重要提示**\n\
  >\n> 建议在歌曲开头留出极短的静音（约半秒即可）。这可以防止消费级媒体播放器切掉歌曲的开头。\n>\n> 在歌曲结尾，确保所有混响尾音在右定位器之前完全衰减，以免播放时突然截断。\n\
  \n2.  转到顶部菜单，点击 `Song`（歌曲），然后点击 `Export Mixdown`（导出混音）。这将打开 `Export Mixdown` 窗口：\n\
  \n![Figure 13.25: The Export Mixdown window](img/B31512_13_25.jpg)\n\n图 13.25：导出混音窗口\n\
  \n3.  在该窗口的 `Location`（位置）部分，选择即将创建的音频文件的文件夹和名称。\n4.  在 `Format`（格式）部分，选择要创建的文件格式。你可以使用复选框选择多种文件类型。点击每种文件类型以访问其适用参数。虽然有多种文件类型可选，但以下是你最可能用到的两种：\n\
  \n    *   **Wave File**（波形文件）是行业标准，也被消费级媒体播放器普遍识别。Wave 文件以较大的文件体积换取高音质。使用此格式向发行网络、客户或母带工作室交付最终混音。以下是\
  \ Wave 文件的两个最常用参数：\n\n        *   如果你导出的歌曲将发布到 Apple Music 或 Spotify 等音乐平台，请将 `Resolution`（分辨率）设为\
  \ `16 Bit`，`Sample Rate`（采样率）设为 `44.1 kHz`。这被称为 `CD standard`（CD 标准）。自 1980 年代以来，它一直是音乐发行的标准格式，至今仍被纯音乐平台使用。\n\
  \n\n\n## 第 13 章：导出混音和分轨（续）\n\n## 导出最终混音\n\n### 视频制作的音频格式设置\n- 如果导出的波形文件将用于视频制作（作为背景音乐、音效等），请将\
  \ `Resolution` 设置为 `24 Bit`，将 `Sample Rate` 设置为 `48 kHz`。这是自 1990 年代以来一直沿用的 `DVD\
  \ 标准`，视频平台仍要求使用该标准。它定义了视频文件音频部分的参数。虽然视频制作程序可以导入几乎任何分辨率和采样率的音频文件，但使用上述参数交付文件将提供最佳音质。\n\
  \n- `MP3 File` 是一种压缩文件格式，以牺牲音质为代价提供更小的文件体积。使用此格式通过电子邮件附件快速与朋友分享混音以获取第二意见。MP3 文件的重要设置是\
  \ `Bitrate`，以 `kilobits per second` (`kbps`) 表示。较高的比特率提供更好的音质，但会导致文件体积更大；`192 kbps`\
  \ 是一个不错的折中方案。\n\n### 导出范围\n3. 窗口的 `Export Range` 部分允许您设置将导出时间轴的哪一部分。我们已在*步骤 1*中处理了此项，因此您可以保留其默认设置\
  \ – `Between Loop`。\n\n### 响度标准化\n4. 窗口的 `Loudness` 部分激活了一个极其有用的功能，该功能分析混音的电平并自动调整其以符合数字平台要求的响度标准。点击\
  \ `Adjust Loudness` 以激活一个下拉菜单，允许您调整歌曲的响度，符合从欧洲广播联盟到 YouTube 等任何平台实施的标准：\n\n![Figure\
  \ 13.26: The Loudness setting on the Export Mixdown menu](img/B31512_13_26.jpg)\n\
  \n1. 您也可以使用 `Max. loudness` 和 `Max. true peak` 设置手动设置歌曲的响度。我们将在 `第 15 章` 中讨论这些设置，但下拉菜单中的预设选项足以应对几乎所有情况。\n\
  \n2. 如果您在 `Mix Console` 的 `Main channel` 上插入了效果插件，并将混音发送给母带处理室，请勾选 `Options` 部分中的\
  \ `Bypass master effects` 复选框。这将绕过这些效果，以免它们干扰母带处理阶段将要应用的效果。\n\n3. 点击 `OK`。\n\nStudio\
  \ One 将导出混音、调整其响度电平，并创建您指定的文件，此时您可以喝一口当之无愧的咖啡。\n\n## 导出分轨\n\n`Stems` 是指构成歌曲的单个轨道或一组轨道。当歌曲被分成分轨时，每个轨道或一组轨道将作为单独的音频文件导出。根据预期用途，这些文件可能以原始、未处理的形式交付，也可能应用了后期制作中的所有效果和处理（如音高校正和音频量化）后交付。\n\
  \n通常将歌曲导出为分轨，以便他人对其进行工作或贡献。使用分轨的一些可能场景如下：\n\n- 您希望让他人能够重混您的歌曲。拥有分轨使他们能够使用想要在重混中保留的歌曲部分，并用自己的素材替换其他所有内容。\n\
  - 您为电影创作音乐，并希望在混制电影最终原声带时给重录混音师更多自由。例如，如果您的配乐包含鼓、铜管乐器和合成器，将这些乐器组以单独的分轨交付将允许重录工程师降低掩盖对白的合成器电平，同时保持鼓的满音量。\n\
  - 您希望与他人合作，因此提供分轨作为他们可以改进的原始素材。\n\n导出分轨的过程与导出视频的过程相似。您需要执行以下操作：\n\n1. 在 `Arrange`\
  \ 窗口上设置左、右定位器，如*导出最终混音*部分所述。\n2. 转到顶部菜单，点击 `Song`，然后点击 `Export Stems`。这将打开 `Export\
  \ Stems` 窗口：\n\n![Figure 13.27: The Export Stems window](img/B31512_13_27.jpg)\n\
  \n3. 在此窗口的 `Sources` 部分，选择要作为单独分轨导出的通道。\n4. 在 `Location` 部分，选择一个文件夹用于存放即将创建的音频文件。\n\
  5. 默认情况下，分轨文件将以其对应的通道命名。如果您的歌曲中有一个名为 `Kick` 的通道，其对应的分轨文件将命名为 `Kick.wav`。由于您将把这些分轨发送给其他人，最好在文件名中添加前缀，以便接收文件的人知道这些文件来自哪首歌曲。您可以在\
  \ `Filename Prefix` 字段中设置此前缀。根据我在*图 13.27*中的设置，分轨将被命名为 `Hello_Kick.wav`、`Hello_Bass.wav`\
  \ 等。\n6. 其余参数与 `Export Mixdown` 窗口中的相同，请参考*导出最终混音*部分列出的步骤进行设置。\n7. 点击 `OK`。\n\n\
  在本节中，您学习了如何导出最终混音或分轨，以便与粉丝、客户或合作者分享。这结束了我们关于 Studio One 混音过程的讨论。\n\n## 摘要\n\n在本章中，我们深入探讨了\
  \ Studio One 的信号流程，讨论了使用效果插件的各种方法，并学习了如何实现多种高级混音技术。掌握这些概念和技术将使您能够完全控制混音，开发更高效的工作流程，并促进混音中的创造力，帮助您实现艺术愿景。\n\
  \n在下一章中，我们将探索 Studio One 的环绕声功能，并学习如何利用它们打造沉浸式音频体验。\n"
- '## 第 14 章：使用空间音频


  `Spatial audio`（空间音频）彻底改变了我们感知和创造声音的方式，Studio One 的最新版本将这一令人兴奋的前沿领域直接引入您的工作流程。在本章中，我们将探索如何利用
  Studio One 的沉浸式音频功能打造三维声学体验。无论您旨在制作空间感丰富的音乐、为游戏设计引人入胜的声景，还是为支持环绕声或空间音频格式的平台创作内容，本章都将指导您了解使之成为可能的工具和技术。


  在整章中，我们将配置 Studio One 以进行空间音频制作，并介绍沉浸式格式混音的基本工作流程。您还将发现导出项目的实用技巧，以确保与各种播放系统和平台的兼容性。读完本章后，您将能够自信地驾驭沉浸式音频领域，并以传统立体声混音无法实现的方式将您的想法变为现实。


  ## 技术要求


  要学习本章内容，您只需在计算机上安装并激活 Studio One。请注意，空间音频功能是在版本 7 中引入的。


  ## 开始使用空间音频


  `Spatial audio`（空间音频），也称为 `immersive audio`（沉浸式音频），是一种多维的声音处理方法，能创造深度、空间感和临场感，超越传统立体声的局限。空间音频将声音置于听众周围的三维空间中。这可以包括来自
  360 度球体内精确点的声音，增强真实感和情感投入。


  ### 本章涵盖的主题

  - 开始使用空间音频

  - 为空间音频创建新歌曲

  - 混音和导出空间音频素材




  这项技术被用于各种应用，从音乐和电影到**虚拟现实**（**VR**）、**增强现实**（**AR**）和游戏。沉浸式音频格式（如 Dolby Atmos、DTS:X
  和 Ambisonics）旨在多种播放系统上提供空间动态音频体验，从专业设置到消费级耳机。通过模仿我们在现实世界中自然感知声音的方式，沉浸式音频让创作者能够打造更引人入胜、更逼真的声景，吸引听众并让他们身临其境。


  从实际角度来看，空间音频是指输出声道超出传统双声道立体声的任何音频格式。这确实是一个宽泛的定义，所以让我们来细分一下。


  # 了解不同类型的空间音频


  Studio One 支持的空间音频格式包括以下内容：


  *   `Surround` 是一个通用术语，指多声道音频配置，其中每个声音被分配到特定声道，并可使用该声道上的平衡控制将其定位在听众周围的任何位置。环绕音频格式（如
  5.1 和 7.1 声道设置）常用于家庭影院、影院和游戏，旨在复现真实的声学效果。


  *   `Dolby Atmos` 是由杜比实验室开发的一种专有空间音频格式。它采用更先进、更灵活的方法，允许将声音放置并移动到三维空间中的任何位置，包括头顶。Dolby
  Atmos 具有可扩展性，意味着它可以适应从拥有数百个扬声器的影院设置到音响条和耳机的各种系统。


  *   `Binaural` 是一种携带空间信息的双声道音频信号，可用于在耳机上传达空间音频成像，而无需安装多扬声器系统。


  除双耳格式外，这些格式在制作和播放期间都需要使用多个扬声器。一旦超越立体声（我们只需将扬声器命名为左和右），给扬声器命名就会变得棘手一些，所以在深入空间音频的深水区之前，让我们先解决这个问题。


  ## 扬声器配置的命名约定


  空间音频扬声器配置描述了旨在创造沉浸式音频体验的设置中扬声器的位置和数量。这些配置以数字表示，如 5.1、7.1.2 等，指示扬声器、低音炮的分布，以及在某些情况下高度或顶置声道的存在。


  以下是如何解读 7.1.2 这样的数字：


  *   第一个数字是水平面上围绕听众放置的扬声器数量。这些通常位于前方、侧面和后方。


  *   第二个数字显示专用于**低频效果**（**LFE**）的低音炮数量，如低音和轰鸣声。


  *   第三个数字（如果存在）表示**高度**或顶置扬声器的数量，它们为音频提供垂直维度，这对 Dolby Atmos 等格式至关重要。


  以下是一些常见配置及其典型用例：


  *   **2.1**：两个主扬声器（左和右）和一个低音炮。这是一个带有额外低音支持的基本立体声设置，不提供环绕或高度声道。


  *   **5.1**：五个主扬声器（前左、前右、中置、后左和后右）和一个低音炮。这是家庭影院中使用的标准环绕声设置。


  *   **7.1**：在 5.1 设置的基础上增加两个额外扬声器（环绕左和环绕右），以实现听众周围更精确的声音定位。


  *   **5.1.2**：带有两个高度扬声器的 5.1 设置，增加了顶置维度。适合入门级 Dolby Atmos 或 DTS:X 系统。


  *   **7.1.2**：带有两个高度扬声器的 7.1 设置。此配置提供水平和垂直的沉浸感，适合高级空间音频体验。


  *   **7.1.4**：在 7.1 配置基础上增加四个高度扬声器，提供更精确的垂直声音定位，带来高度沉浸式体验。


  这些配置中提到的大量扬声器乍看之下可能令人望而生畏：你真的需要在家庭工作室放置那么多扬声器来进行空间音频工作吗？这取决于你的计划和目标受众。这将是我们在下一节讨论的内容。


  ## 空间音频的硬件要求


  让我们从好消息开始——如果你要从事 Dolby Atmos 工作，除了现有的音频接口和耳机，不需要任何其他设备。Dolby Atmos 使用一种名为 `Dolby
  Atmos Renderer` 的专有算法，我们将在*混音和导出空间音频素材*一节中讨论它。目前只需知道，该渲染器会将你的 Dolby Atmos 素材向下混音并转换为双耳信号，以便你使用耳机工作，同时仍能体验空间音频。


  现在是坏消息——如果你在使用任何其他空间音频格式（包括传统的环绕声格式，如 5.1），Dolby Atmos Renderer 将无法施展魔力。因此，你需要拥有与你的环绕声配置指示的同样数量的扬声器（例如，5.1
  配置需要五个扬声器和一个低音炮）。此外，你还需要一个支持相同数量独立输出的音频接口（例如，5.1 配置总共需要六个输出）。


  现在我们已经了解了空间音频格式及其各自的要求，我们准备好在 Studio One 中开始制作第一个沉浸式音频杰作，这正是我们在下一节要做的事情。


  # 为空间音频创建新 Song


  在 Studio One 中，空间音频仅在 `Song` 页面受支持。你将仅使用此页面来创建、编辑、混音和导出所有空间素材。让我们开始吧：


  1.  在 Studio One 的启动页面上，点击 `New`。这将打开 `New` 文档窗口。


  2.  在该窗口左侧的 `Templates` 列表中，点击标题为 `Mix in Surround` 的模板。窗口右侧现在将显示使用空间音频创建第一个 Song
  的可用选项（*图 14.1*）。


  ![图 14.1：为空间音频创建新 Song](img/B31512_14_1.jpg)


  图 14.1：为空间音频创建新 Song


  1.  选择你想要使用的空间音频格式类型：`Dolby Atmos` 或 `Surround`。你也可以选择 `Tutorial` 进入交互式指南，旨在帮助你了解
  Dolby Atmos 工作流。


  你在 `New` 文档窗口右侧看到的选项将根据你选择 `Dolby Atmos` 和 `Surround` 而变化。让我们逐一过一遍。


  创建 `Dolby Atmos` Song 的选项（如*图 14.1*所示）如下：


