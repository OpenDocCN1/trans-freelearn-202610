  *   `Bed Format`：在此选择目标扬声器配置。这是你的项目最终将在其上播放的扬声器配置。


  *   `Monitoring Format`：这是你在制作工作中将使用的扬声器配置。还记得我们在*空间音频的硬件要求*一节中讨论的 Dolby Atmos Renderer
  吗？该渲染器将获取你为 `Bed Format` 选择的配置，并将其向下混音为你在此处选择的任何扬声器配置。如果你只打算使用耳机工作，请在此字段中选择 `Stereo`。


  *   `Sample Rate`：Dolby Atmos 仅支持 48 kHz 或 96 kHz 的采样率，这些是你将看到的选项。如果你的音频接口不支持 96
