  在本部分中，你将在 Studio One 中创建你的第一个 Song。然后，你将学习如何使用麦克风或乐器录制音频。最后，你将学习如何使用虚拟乐器和录制 MIDI
  数据，让你的音乐创意栩栩如生。


  本部分包含以下章节：


  *   *第 4 章*，*创建新 Song*

  *   *第 5 章*，*录制你的第一条音频轨道*

  *   *第 6 章*，*添加虚拟乐器和录制 MIDI*

