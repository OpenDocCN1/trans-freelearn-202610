- '# 第 1 部分：Studio One 入门


  在本书的第一部分，您将了解 Studio One 的不同版本，以及如何选择最适合您需求的版本。然后，您将学习如何安装和配置 Studio One，使其在您的系统上流畅运行。最后，您将对
  Studio One 界面进行一次导览，并熟悉本书将用到的各个窗口。


  本部分包含以下章节：


  - *第 1 章*, *选择适合您的 Studio One 版本*

  - *第 2 章*, *安装和配置您的 Studio One 环境*

  - *第 3 章*, *探索 Studio One 环境*

