  图 14.4：为空间音频创建新音轨


  1. 点击 `OK`。


  从现在开始，继续像往常一样使用 Studio One 进行工作。只有当您进入混音阶段时，工作流程才会发生变化，我们将在下一节中讨论。


  # 混音和导出空间音频素材


  传统的立体声混音涉及在两个音频通道（左和右）上创建声场。声音通过每个音轨或通道上的平移控制在左、右扬声器之间定位。这创造了深度的错觉，但仅限于单一维度。另一方面，空间音频混音涉及创建一个三维声场，声音可以在听众周围移动。声音被定位在一个
  360 度的球体中，提供高度、深度和宽度。这需要更复杂的平移方法，我们将通过探索 Studio One 的空间平移功能来开始本节。


  ## 使用环绕声平移器


  创建 `Song` 并按本章前面所述配置 Studio One 进行空间音频制作后，您会注意到 `Mix` 窗口上音轨和通道的平移控制看起来截然不同。这种新型平移控制称为
  `Surround Panner`。双击任意通道的平移控制（在 `Figure 14.5` 中高亮显示）可在单独的窗口中打开 `Surround Panner`：


  ![图 14.5：Surround Panner 窗口](img/B31512_14_5.jpg`)


  图 14.5：Surround Panner 窗口


  `Surround Panner` 窗口的上半部分显示您制作的目标扬声器配置。在 `Figure 14.5` 中，我的目标扬声器配置是 `7.1.4`，如 `Surround
  Panner` 窗口左上角所示。因此，圆圈外放置了七个扬声器图标，代表收听环境中将使用的扬声器阵列。圆圈正中央站着一个人形，代表有幸欣赏我们作品的幸运儿。Studio
  One 的说明书亲切地称其为 `The Listener`，我们将延续这一传统，也这么称呼它。


  要将某通道的音频平移到我们刚才提到的七个扬声器之间的任意点，您只需抓住箭头（目前从 `The Listener` 的鼻子延伸向圆圈顶部），并将其指向您希望该通道声音发出的位置。将箭头靠近或远离
  `The Listener` 会影响信号的大小。如果您只想改变声音的位置而不改变其大小，可以使用右上角的 `Size` 锁定按钮（带挂锁图标）将大小锁定在当前设置。


  您可以点击圆圈上的任意气泡（标记为 `L`、`R`、`Ls`、`Rs` 等）并拖动它们以更改通道上音频的扩散范围。将气泡靠近会使声音紧凑且聚焦，仿佛来自单一位置。将它们拉远会将声音分散到更宽的频谱上，使声音宏大且宽敞。


  `Surround Panner` 窗口的下半部分仅在您的输出配置包含高度扬声器时可用。此部分用于控制通道上信号的 `elevation`（仰角）。您可以将声音放置在
  `The Listener` 的耳朵高度、高度扬声器上，或两者之间的任何位置。只需点击气泡并拖动它们即可控制仰角。


  `Surround Panner` 窗口上的所有内容都可以自动化。只需在窗口左上角选择您喜欢的自动化模式（当前标记为 `Auto: Off`），按下播放，然后发挥创意。我们在
  `Chapter 11` 中讨论过自动化模式，您可能想回顾该章节以复习自动化技能。


  `Surround Panner` 是处理空间音频时定位声音的基本工具，但如果您使用 Dolby Atmos，还有更多选项可用。我们将在接下来探索这些选项。


  ## 理解床和对象


  Dolby Atmos 扩展了声音设计和混音的创作可能性，带来更引人入胜、更逼真的听觉体验。正如我们在本章开头提到的，部分原因是通过添加高度扬声器，创造完全沉浸式的体验，包括垂直维度。


  Dolby Atmos 范式中的另一个关键点是引入了两个概念：床和对象。这些是革命性的概念，将改变您看待混音的方式，所以让我们来分解它们：





  * `Beds`（床层/基础音轨）是静态音频通道（类似于传统的环绕声通道），用作混音的基础。这些通常用于处理不需要精确移动或定位的音频元素，例如背景音乐、环境音或其他非动态声音。


  * `Objects`（对象）是可以在三维空间内精确定位和移动的单个音频元素。与传统的基于通道的音频不同，对象不绑定到特定的扬声器；相反，它们包含元数据，告诉播放系统它们在三维环境中的位置和移动。这使得
  Dolby Atmos Renderer（杜比全景声渲染器）能够动态地将混音适配到任何扬声器配置，确保一致且身临其境的体验。对象非常适合需要动态空间化的声音，例如头顶飞过的直升机或听众周围移动的脚步声。


  此时，你可能会想，既然我们可以在 `Surround Panner`（环绕声全景控制器）上自动化每一个移动，我们已经能让声音四处移动了，那么是什么让对象的概念如此革命性呢？让我来解释一下。理解传统环绕声全景控制与基于对象的运动之间的区别对于在
  Dolby Atmos 中工作至关重要，所以让我们深入探讨一下。以下是对比：


  * 在传统的环绕声混音中，声音被分配到特定的扬声器通道（例如左前方和右后方）。当自动化全景控制时，你本质上是在*控制声音在这些通道之间的电平分配*。如果播放系统发生变化（例如，你为
  7.1 配置混音，但最终听众只有 5.1 设置），全景控制信息就会丢失，空间保真度也会下降。


  * 在 Dolby Atmos 中，对象摆脱了固定通道的束缚。对象不绑定到特定扬声器，而是被赋予三维位置元数据，告诉播放系统*声音应该来自空间中的何处*。系统随后计算如何将声音分配到可用的扬声器（或耳机）上，以重现该位置。即使播放系统发生变化，对象也会被渲染以适应现有的播放系统，声音可以在听众周围的球体内无缝且令人信服地移动。


  在 Studio One 中，当你创建一个新轨道时，默认情况下它被视为一个 Bed（床层/基础音轨）。Bed 的位置由 `Surround Panner` 控制，我们在上一节中探讨过。对象拥有自己的全景控制工具，这将是我们接下来的主题。


  ## 使用 Object Panner（对象全景控制器）


  `Object Panner`（对象全景控制器），顾名思义，控制声音对象在三维空间中的位置。要使用 `Object Panner` 工具，我们必须首先让 Studio
  One 知道我们想将一个通道视为对象而不是 Bed。为此，只需右键单击该通道的全景控制旋钮，然后选择 `Spatial Object Panner`（空间对象全景控制器）：


  ![Figure 14.6: Selecting the Object Panner tool](img/B31512_14_6.jpg)


  Figure 14.6: Selecting the Object Panner tool


  这将在 Dolby Atmos 术语中将该通道指定为对象，并打开 `Object Panner` 窗口：


  ![Figure 14.7: The Object Panner window](img/B31512_14_7.jpg)


  Figure 14.7: The Object Panner window


  `Object Panner` 看起来像是 `Surround Panner` 的简化版，看谁回来了——我们值得信赖的参考点，The Listener（听众），再次位于界面中心。


  使用 `Object Panner` 工具非常简单：只需点击对象气泡并将其移动到你希望声音在三维空间中发出的位置。使用窗口的上半部分水平放置声音，使用下半部分垂直放置声音。


  不言而喻，这个气泡的移动可以自动化，因此有很大的创作空间。


  ## The Dolby Atmos Renderer（杜比全景声渲染器）


  The Dolby Atmos Renderer 是一个插件，让你能与 Dolby Atmos 算法进行交互。当你在 `New`（新建）文档窗口中选择 `Dolby
  Atmos` 时（正如我们在 *Figure 14.1* 中看到的），`Dolby Atmos Renderer` 会自动添加到 `Main`（主输出）通道的一个特殊插槽中。点击此插槽（在
  *Figure 14.8* 中高亮显示）以打开 `Dolby Atmos Renderer` 界面，准备再次见到 The Listener：


  ![Figure 14.8: The Dolby Atmos Renderer](img/B31512_14_8.jpg)


  Figure 14.8: The Dolby Atmos Renderer


  我们在 *Creating a new Song for spatial audio*（为空间音频创建新 Song）一节中讨论的两个设置（`Bed Format`
  和 `Output`）再次出现在窗口顶部。如果你打算使用耳机监听制作，请确保在 `Output` 下拉菜单中选择了 `Dolby Atmos Binaural`（杜比全景声双耳）。


  窗口左侧的三维房间显示展示了你创建的对象的位置，正如我们在 *Using the Object Panner* 一节中讨论的那样。界面中心有一个 `Dolby
  Atmos Channels`（杜比全景声通道）列表，你可以使用各自的 `M`（静音）或 `S`（独奏）按钮来静音或独奏每个通道。最后，窗口右侧的计量部分提供通过渲染器的信号响度电平信息，以便你判断项目是否符合目标收听环境设定的响度标准。我们将在
  *Chapter 15* 中讨论响度电平。


  我们现在准备好进入空间音频工作流的最后一步。


  ## 导出空间音频素材


  如果你的制作涉及传统的环绕声格式（如 5.1），请按以下方式导出最终音频文件：


  1. 在顶部菜单中，转到 `Song` 并点击 `Export Mixdown…`（导出混音缩混……）。


  2. 这将打开 `Export Mixdown` 窗口，我们在 *Chapter 13* 中探讨过。按其中所述设置此窗口中的选项。


  3. 点击 `OK`。Studio One 将创建一个多通道 `.wav` 文件，遵循你所选格式中的离散通道数量（例如，5.1 配置为六个通道）。


  如果你使用了 Dolby Atmos，请按以下步骤导出最终音频文件：


  1. 在顶部菜单中，转到 `Song` 并点击 `Export Spatial Audio…`（导出空间音频……）。这将打开 `Export Spatial Audio`
  窗口：


  ![Figure 14.9: The Export Spatial Audio window](img/B31512_14_9.jpg)


  Figure 14.9: The Export Spatial Audio window


  1. 调整 `Location`（位置）和 `Export Range`（导出范围）设置。这些与 `Export Mixdown` 窗口中的设置相同。


  2. 一个 `ADM BWF` 文件（这是 Dolby Atmos 所需的文件格式）将自动创建。如果你想以不同格式创建额外文件，请在窗口的 `Format`（格式）部分选择它们。


  3. 点击 `OK`。


  这就是使用 Dolby Atmos 导出 Song 所需的全部操作。


  ## 总结


  在本章中，我们讨论并比较了各种空间音频格式，并探索了 Studio One 的空间音频功能。你为制作环境和目标播放配置配置了 Studio One，然后创建了第一个用于空间音频工作的
  Song。最后，我们讨论了如何使用 Studio One 内置的空间音频工具进行混音和导出制作。


  在下一章中，我们将回到立体声素材的工作。我们将探索 `Project`（工程）页面；一个独特的环境，让你能对 Song 进行母带处理操作。

  '
- "## 15\n\n### 导航 Project Page（工程页面）并制作最终母带\n\n在音乐行业中，母带处理通常被视为艺术、科学和魔法的神秘混合体，只有少数拥有超自然听力和昂贵设备的杰出人士才能驾驭。虽然经验、一双训练有素的好耳朵和合适的设备确实会占据优势，但技术已经发展到这样一个地步：只要具备一些基础知识，任何人在简陋的家庭工作室中都能为数字音乐平台发布创作出完全合格的母带。\n\
  \n\n\n\nStudio One 凭借其 `Project` 页面，在让这项技术变得更加易用方面提高了标准，该页面是一个专门用于母带处理的环境。此页面上可用的工具让每位音乐人都能掌握母带处理流程，无论其经验水平如何。\n\
  \n在本章中，我们将探索 `Project` 页面，并学习如何制作符合数字音乐平台标准的最终母带。我们将涵盖以下主题：\n\n*   创建新 Project 并浏览\
  \ `Project` 页面\n*   掌握 `Project` 页面\n*   渲染最终母带以供发布和交付\n\n# 技术要求\n\n为了学习本章内容，您需要在计算机上激活\
  \ Studio One。\n\n**重要提示**\n\n`Project` 页面上可用的大多数工具在 `Song` 页面上也可作为插件使用，因此本章介绍的大多数方法也可以在\
  \ `Song` 页面上执行。\n\n# 创建新 Project 并浏览 Project 页面\n\n`Mastering`（母带处理）是音乐制作过程的最后一步。它涉及为混音做准备和优化，以便在流媒体服务、CD、黑胶唱片或数字下载等各种平台上分发。\n\
  \n母带处理的目标是优化混音的声音，确保最终产品在各种播放系统上听起来都很棒，从高端录音室监听音箱到微小的入耳式耳机。这当然不是一项容易的任务，但 Studio\
  \ One 凭借 `Project` 页面使整个流程尽可能流畅，这是一种创新方法，在撰写本文时，其他竞争音乐制作软件均不具备。\n\n`Project` 页面是一个母带处理环境，它与\
  \ `Song` 页面紧密集成，创建了一个统一、高效的工作流，涵盖音乐制作的所有阶段，从录音到母带处理。它在许多方面与 `Song` 页面相似，因此一旦您开始使用它，大多数工具和功能都会很熟悉。\n\
  \n让我们首先创建一个新 Project 并探索 `Project` 页面界面。\n\n## 创建新 Project\n\n您可能想要创建新 Project 的场景有两种：\n\
  \n*   您有一首或多首之前已混音并渲染为立体声 `.wav` 文件的歌曲，并且想要处理这些文件以创建用于分发的最终母带\n*   您有一首 Song（正在进行中的作品），您已在\
  \ Studio One 的 `Song` 页面上对其进行了混音，现在准备让它经历母带处理过程\n\n针对这些场景创建新 Project 的程序各不相同。让我们逐一查看。\n\
  \n### 为现有 .wav 文件创建新 Project\n\n如果您有一首或多首已经混音并渲染为 `.wav` 文件的歌曲，请按照以下步骤为它们创建一个新 Project：\n\
  \n1.  在 `Start`（开始）页面上，点击 `New…`（新建……）按钮，这将打开 `New`（新建）窗口：\n\n![Figure 15.1: The\
  \ New window](img/B31512_15_01.jpg`)\n\n图 15.1：新建窗口\n\n1.  在该窗口的左侧，选择 `Master and\
  \ Release`（母带与发行）。\n\n2.  在窗口的右侧，输入名称并为即将创建的 Project 选择一个文件夹。\n\n3.  如果您的最终母带将上传到流媒体服务和数字音乐平台，请将\
  \ `Sample Rate`（采样率）设置为 `44.1 kHz`。如果将用于视频后期制作，请将其设置为 `48 kHz`。\n\n4.  打开 `Explorer`（Windows）或\
  \ `Finder`（Mac）并找到您想要处理的 `.wav` 文件。将这些文件拖放到标有 `Drop files here`（将文件拖至此处）的框中。\n\n\
  5.  点击 `OK`（确定）。\n\n这将创建一个新 Project，您的 `.wav` 文件将铺排在 `Project` 窗口时间轴上。\n\n### 从\
  \ Song 页面创建新 Project\n\n如果您已在 `Song` 页面上完成了一首 Song 的混音，并准备开始母带处理，您可以直接从 `Song` 页面将其发送到\
  \ `Project` 页面。操作方法如下：\n\n1.  在 `Song` 页面的顶部菜单中，转到 `Song` 并选择 `Add to Project`（添加到\
  \ Project）。系统将提示您使用 Song 的当前标题创建一个新 Project。在这里，我即将为我的名为 `Pole Star` 的 Song 创建一个新\
  \ Project：\n\n![Figure 15.2: Creating a new Project on the Song page](img/B31512_15_02.jpg`)\n\
  \n图 15.2：在 Song 页面上创建新 Project\n\n1.  点击提示以创建新 Project 后，您将进入 `New Project`（新建 Project）窗口：\n\
  \n![Figure 15.3: The New Project window](img/B31512_15_03.jpg`)\n\n图 15.3：新建 Project\
  \ 窗口\n\n1.  为您的 Project 文件命名并选择一个要保存它的文件夹。\n\n2.  如果您的最终母带将上传到流媒体服务和数字音乐平台，请将 `Sample\
  \ Rate` 设置为 `44.1 kHz`。如果将用于视频后期制作，请将其设置为 `48 kHz`。\n\n3.  点击 `OK`。\n\nStudio One\
  \ 会自动将您的 Song 跳转为立体声文件，创建一个新 Project，并将跳转的文件放置在新 Project 的时间轴上。\n\n现在，让我们探索 `Project`\
  \ 页面并熟悉其母带工具集。\n\n## 浏览 Project 页面\n\n`Project` 页面看起来像是 `Song` 页面的精简版，所以它不应该太陌生：\n\
  \n![Figure 15.4: The Project page](img/B31512_15_04.jpg`)\n\n图 15.4：Project 页面\n\
  \n让我们来分解一下：\n\n*   `Track column`（轨道列）（*图 15.4* 中的 `a`）：此列列出了您添加到 Project 中的所有 Song。只需在该列表中上下拖动即可更改\
  \ Song 的顺序。\n*   `Effects racks`（效果器机架）（`b`）：这些的工作方式就像 `Song` 窗口中的 `Inserts`（插入）机架一样，允许您向单个轨道或整个\
  \ Project 添加效果。我们将在下一节 *Adding effects plug-ins*（添加效果插件）下讨论效果的使用。\n*   `Metering\
  \ tools`（计量工具）（`c`）：此部分包含母带处理过程中必不可少的三个测量工具：`Spectrum meter`（频谱计）、`level/loudness\
  \ meter`（电平/响度计）和 `phase meter`（相位计）。我们将在 *Using the metering tools*（使用计量工具）部分讨论这些工具。\n\
  *   `Track lane`（轨道通道）（`d`）：此部分显示 Project 中 Song 的波形，并允许您对它们执行基本编辑操作。\n\n`Project`\
  \ 页面和 `Song` 页面之间的相似性并非巧合。这两个页面之间存在紧密集成，这可能会永远改变您制作母带的方式。接下来，我们将探索这种集成，并了解它如何增强您的制作工作流。\n\
  \n## Song 页面与 Project 页面之间的集成\n\n在传统的音乐制作工作流中，混音和母带处理是两个截然不同的过程：\n\n*   您完成混音，将最终混音跳转为单个文件，然后开始对该文件进行母带处理\n\
  *   如果歌曲需要修改，您要返回混音，修改它，再次渲染文件，并将其带回您的母带处理环境\n\n当您制作包含多首歌曲的专辑时，跟踪这些修改很快会变得难以应付。您可能会发现自己最终对歌曲的旧版本进行了母带处理，因为您忘记将更新后的版本带入母带处理会话中。\n\
  \nStudio One 通过在混音和母带处理工作流之间引入紧密集成来解决这个问题。`Song` 页面和 `Project` 页面能智能地相互感知，因此您在一个页面上所做的更改另一个页面也会知晓。这使得\
  \ Studio One 能够跟踪所有修订，并始终让您的母带处理 Project 保持为 Song 的最新版本，而无需您手动更新母带文件。\n\n\n\n\n\
  为了演示这种集成是如何工作的，让我们回到我的歌曲**《Pole Star》**。这是我在 `Song` 页面创建并混音的一首歌，正如你从*图 15.2*中记得的那样，我使用了\
  \ `Add to Project`（添加到项目）命令将这首歌添加到一个新的母带处理 Project 中。使用该命令使 Studio One 在 `Song`\
  \ 页面和 `Project` 页面的两个版本的**《Pole Star》**之间建立了链接。\n\n假设我在 `Project` 页面母带处理**《Pole\
  \ Star》**进行到一半时，发现歌曲编排有点不对劲，决定回到 `Song` 页面进行修复。以下是轻松实现此操作的方法：\n\n1. 在 `Track`（轨道）栏中，点击歌曲名称旁边的\
  \ `Edit`（编辑）按钮（由扳手图标标记）：\n\n![Figure 15.5: The Edit button on the Track column](img/B31512_15_05.jpg)\n\
  \n图 15.5：轨道栏上的编辑按钮\n\n2. 这将自动打开**《Pole Star》**的 `Song` 页面，我可以在其中随心所欲地修改它。修改完成后，我保存并关闭\
  \ `Song` 页面。\n\n3. 下次我打开 `Project` 页面继续母带处理**《Pole Star》**时，Studio One 会询问我是否要更新母带文件以反映我所做的修改：\n\
  \n![Figure 15.6: The Update Mastering Files dialog box](img/B31512_15_06.jpg)\n\n\
  图 15.6：更新母带文件对话框\n\n4. 当我在此框中点击 `OK` 时，Studio One 将打开**《Pole Star》**的 `Song` 页面，导出修订后的歌曲版本，并更新母带文件以反映我的修改。现在，我可以继续在\
  \ `Project` 窗口中工作，放心地知道我正在处理最新版本。\n\n这种程度的集成简化了工作流程，免去了你跟踪歌曲不同版本的麻烦，让你能专注于真正重要的事情——以最佳方式呈现你的音乐。\n\
  \n现在我们了解了 `Project` 页面的基础知识，让我们深入其中，开始将我们的歌曲母带处理至完美。\n\n# 掌握 Project 页面\n\n一旦你将歌曲添加到\
  \ Project 中，它们将列在 `Track` 栏中，并作为事件显示在 `Track` 轨道上，正如我们在*图 15.4*中所见。现在，让我们从头到尾演练一下母带处理这些歌曲的过程。\n\
  \n## 输入元数据\n\n`Metadata`（元数据）是关于音乐曲目的基本信息，包括（除其他外）其标题、艺人、专辑、流派和发行年份。此信息嵌入在最终音频文件中，帮助音乐分发平台正确分类和分发音乐。它还有助于版税收取，并确保艺人因其作品获得应有的署名。如果你打算发行你的歌曲，你肯定希望其中嵌入元数据，所以让我们在深入探讨更深层的话题之前先处理这个。\n\
  \n要为曲目输入元数据，请在 `Track` 栏中找到该曲目，然后点击其标题旁边的 `Show/hide more`（显示/隐藏更多）按钮（一个微小的白色三角形，在*图\
  \ 15.7*中高亮显示）。这将打开该曲目的元数据窗口：\n\n![Figure 15.7: The metadata window](img/B31512_15_07.jpg)\n\
  \n图 15.7：元数据窗口\n\n填写此窗口中的字段，以便分发平台更好地了解你的歌曲。\n\n如果你已经有了歌曲的**国际标准录音代码**（**ISRC**），请在此输入。ISRC\
  \ 是由音乐出版商发布的唯一标识符。分发网络将使用它来追踪你的歌曲被流媒体播放或下载的次数。\n\n你还可以为歌曲添加封面图，它将显示在音乐流媒体平台上的歌曲页面中（最大图像尺寸为\
  \ 1,400 x 1,400 像素）。\n\n完成所有适用字段后，再次点击 `Show/hide more` 按钮即可最小化此窗口。下次保存 Project\
  \ 时，元数据将被保存。\n\n## 排序曲目\n\n当你向 Project 添加曲目时，它们会按照你添加的顺序出现在 `Track` 轨道和 `Track`\
  \ 栏中。如果你打算单独导出它们以供流媒体平台使用，曲目的顺序并不重要，但如果你想将曲目作为专辑发行在 CD 上，顺序就很重要了。（还记得 CD 吗？是的，我们还在用！）\n\
  \n要更改曲目的顺序，只需在 `Track` 栏中将它们上下拖动以置于正确的顺序。你在此处所做的更改也将反映在 `Track` 轨道上。\n\n当你在 CD 上收听专辑时，你会注意到从一首歌切换到另一首歌时通常会有一个短暂的停顿。如果你要在\
  \ CD 上发行专辑，并且也希望在曲目之间有那种类型的停顿，请按以下步骤操作：\n\n1. 在 `Track` 栏中，点击 `Normal`（正常）按钮（**图\
  \ 15.8** 中的 **a**）以展开曲目：\n\n![Figure 15.8: Inserting pauses between tracks](img/B31512_15_08.jpg)\n\
  \n图 15.8：在曲目之间插入停顿\n\n2. 使用停顿字段（**图 15.8** 中的 **b**）输入一个值（以秒为单位），作为你希望一首曲目与其前一首曲目之间停顿的长度。你可以将此值设置为\
  \ 0 到 10 秒之间的任何值。两秒是常用值。如果你正在制作一张专辑，其中一首歌无缝过渡到下一首，请将此值设置为零秒。这样，播放将继续进行而没有任何停顿，但听众仍然可以使用媒体播放器上的控件跳转到曲目的开头。\n\
  \n现在，我们准备好深入母带处理的核心领域了。\n\n## 在 Project 页面上编辑曲目\n\n`Project` 页面允许你在最终交付打包之前编辑曲目。虽然可用的编辑工具集不如\
  \ `Song` 页面丰富，但操作模式相似，所以如果你略过了我们在第 7 章中对编辑工具的讨论，现在是仔细阅读该章以复习编辑技巧的好时机。\n\n`Arrow`（箭头）工具是\
  \ `Project` 页面上唯一可用的编辑工具。按键盘上的 `1` 或点击 `Track` 轨道左侧的图标即可拾取它：\n\n![Figure 15.9: Tools\
  \ on the Project page](img/B31512_15_09.jpg)\n\n图 15.9：Project 页面上的工具\n\n以下是你可以在\
  \ `Project` 页面上使用 `Arrow` 工具执行的编辑操作：\n\n* 拖动曲目以在时间轴上移动它们。这对于安排曲目的顺序和定位很有用。\n* 调整曲目大小以修剪其开头或结尾的静默间隙。为此，将鼠标悬停在曲目的左侧或右侧边缘；鼠标光标将变为双向箭头：\n\
  \n![Figure 15.10: Resizing a track](img/B31512_15_10.jpg)\n\n图 15.10：调整曲目大小\n\n\
  点击并拖动此双向箭头以调整曲目大小并修剪开头的静默间隙。\n* 在曲目的开头和结尾执行淡入/淡出。这是发生在曲目结尾的一个淡出效果：\n\n![Figure 15.11:\
  \ Adding a fade-out](img/B31512_15_11.jpg)\n\n图 15.11：添加淡出\n\n要在两首曲目之间执行自动 `crossfade`（交叉淡化），使一首淡出的同时另一首淡入，请执行以下操作：\n\
  \n1. 在时间轴上排列曲目，使第一首歌的结尾与第二首歌的开头重叠。（原文此处为 \"the beginning of the first song\"，根据上下文应为第二首歌，译文已修正）\n\
  2. 选择两首曲目。\n3. 按键盘上的 `X`。这将添加交叉淡化：\n\n![Figure 15.12: Adding a crossfade](img/B31512_15_12.jpg)\n\
  \n图 15.12：添加交叉淡化\n\n虽然 `Split`（分割）工具在 `Project` 页面上不可用，但你仍然可以将一首曲目分割成两首独立的曲目。这对于对歌曲的不同部分应用不同的效果插件很有用。要分割曲目，只需将播放光标放置在你想要分割的位置，然后在键盘上按\
  \ `Alt` + `X` (Windows) 或 `Option` + `X` (Mac)。\n\n\n\n\n\n现在我们已经编辑好音轨并按意愿排列好顺序，接下来准备对其进行润色，以确保它们在任何播放环境下听起来都很棒。我们将通过使用效果器插件来实现这一点。\n\
  \n## 添加效果器插件\n\n在母带处理中使用效果器的目的是创作出一个听感极佳、准确还原原始混音的最终成品，同时提升其整体音质，使其对听众而言尽可能引人入胜且赏心悦目。效果器可用于修正混音中存在的问题，赋予其温暖感和特色，并确保其符合流媒体平台所需的规范。\n\
  \n以下是母带处理中效果器最常见的用途列表：\n\n*   **均衡器**：用于调整歌曲的音调平衡。如果混音中的某些频率范围过于突出而另一些过弱，这将破坏歌曲的音调平衡，导致整个制作听起来不专业。动态均衡器（如\
  \ `Pro EQ3`）是母带处理中修复此类问题的绝佳工具，因为它们仅在达到特定阈值时才会介入，在歌曲的其余部分保持旁路状态。\n\n*   **压缩器**：用于均衡歌曲的动态范围，使其更加一致。在母带处理中，通常首选模拟复古模拟压缩器的插件，因为它们较慢的响应时间使其动作更温和；过量的压缩会因夺走过多动态范围而吸干歌曲的生命力。`Fat\
  \ Channel` 中的 `Tube`、`Everest C100A` 和 `Brit Comp` 等模拟压缩器仿真也会为歌曲添加一些高次谐波和其他伪影，这可能会使乐器融合得更好。用于实现这种融合效果的压缩器有时被称为\
  \ `胶水压缩器`。\n\n*   **立体声成像**：立体声成像是指声音在立体声场中位置和宽度的感知。良好受控的立体声成像能创造出深度感、宽度感和分离感。使用成像插件来增强立体声图像，创造更具沉浸感的聆听体验。在\
  \ `项目` 页面上，这可以通过使用 `Binaural Pan`（双耳声像）插件来实现。\n\n*   **限制器**：用于在不超过特定电平的前提下优化声音音量。`Limiter2`\
  \ 非常适合此任务。\n\n有关这些效果器的更多信息，请参阅 *第 12 章*。\n\n在母带处理中使用效果器时，有一点重要的事项需要注意：你必须保持微妙。混音时，你可以在吉他轨道上插入一个均衡器，并将某个频率提升\
  \ 10 dB（如果这服务于你的目的）。然而，如果你在母带处理中尝试提升这么多，最终会提升歌曲中所有乐器的该频率范围，听起来会很糟糕。因此，在混音时要大刀阔斧（使用宽泛的笔触），但在母带处理中只需施以微小的润色修饰。同样的逻辑也适用于所有其他插件。\n\
  \n现在，让我们看看在 Studio One 中为歌曲进行母带处理时如何添加效果器。`项目` 页面上的 `效果器` 机架分为两部分：\n\n![Figure 15.13:\
  \ The Effects rack on the Project page](img/B31512_15_13.jpg)\n\nFigure 15.13: 项目页面上的效果器机架\n\
  \n第一个机架（*Figure 15.13* 中的 **a**）称为 `轨道设备` 机架，允许你为左侧 `轨道` 栏中当前选中的歌曲添加效果器。你可以使用 `轨道设备`\
  \ 机架按歌曲添加效果器；这在你为专辑母带处理多首歌曲时特别有用，因为你还有保持歌曲之间一致性的额外目标。\n\n例如，如果某首歌曲听起来比其他歌曲更明亮，且你觉得这会偏离你试图在专辑中实现的整体\
  \ *声音* ，请在 `轨道` 栏中选择该歌曲，在 `轨道设备` 机架中插入一个均衡器，并驯服那些有问题的频率。该均衡器将仅应用于该歌曲，使其与其他歌曲更加一致。\n\
  \n第二个机架（*Figure 15.13* 中的 **b**）称为 `主设备` 机架。你在此处插入的效果器将全局应用于项目中的所有轨道。请将此机架用于旨在为所有歌曲添加整体声音特色的效果器（如添加模拟色彩和饱和度的插件），以及用于优化和控制整张专辑整体响度的效果器（如\
  \ `Limiter2`）。\n\n`轨道设备` 机架和 `主设备` 机架都是插入式机架，就像我们在 `歌曲` 页面的混音台上看到的一样。向这些机架添加插件的方式相同——只需从\
  \ `浏览` 窗口拖动一个插件并将其放置到你想要使用的机架上。\n\n再次值得一提的是，这些插件的顺序很重要。将信号视为从每个机架的顶部流向底部。插件之前的内容将显著改变其响应方式，因此在创建信号链时请记住这一点。你可以点击并拖动机架内的插件来更改其顺序。\n\
  \n## 使用计量工具\n\n`计量工具` 是用于测量和显示音频信号各个方面的音频分析工具。母带处理中包含这些工具，是因为它们帮助我们做出准确且明智的决策，最终产出更高质量的成品。\n\
  \n在典型的家庭工作室中，声学条件往往不理想，仅凭耳朵进行混音和母带处理可能会产生误导。在这种情况下，拥有准确的计量工具是一大优势，因为这些工具提供视觉反馈，并提供关于音频信号的精确详细信息。\n\
  \n计量工具占据了 `项目` 页面上大部分空间（标记为 *Figure 15.4* 中的 **c**），这并不奇怪。此页面上有三个计量工具，并提供多种自定义选项以适应不同的使用场景。让我们逐一探讨。\n\
  \n### 频谱仪\n\n`频谱仪` 显示歌曲的频率内容。它帮助你识别任何需要解决的频率不平衡或问题，例如共振频率或过量的低频。如果你正在为专辑母带处理多首曲目，也可以使用频谱仪比较它们之间的频率分布。例如，如果你的家庭工作室只有微型音箱，听不清太多低频，频谱仪会让你知道某首歌曲的低频含量是否比其他歌曲多得多。\n\
  \n频谱仪界面底部有多个选项，允许你微调其显示格式以满足需求：\n\n![Figure 15.14: Spectrum meter](img/B31512_15_14.jpg)\n\
  \nFigure 15.14: 频谱仪\n\n让我们看看其中一些选项：\n\n*   左下角的 `显示模式` 选择器（在 *Figure 15.14* 中高亮显示）提供多种不同的显示模式。讨论这些模式远超出了本书的范围；不过，我们可以列出一个你最可能用到的选项简表：\n\
  \n    *   如果你有音乐家背景，且音乐音符比以赫兹表示的频率更容易让你理解，则使用 `12th Octave`（十二分之一八度）选项。选择此选项时，钢琴键盘将叠加在频谱显示下方，让你能看到所有频段对应的音乐音符。\n\
  \n    *   如果你想获得歌曲频率分布更详细、响应更灵敏的反馈，请使用 `FFT`（`快速傅里叶变换`）选项。这是一种非常精确的频率分析模式，能帮助你一眼锁定问题频率。\n\
  \n*   使用 `保持` 选项可保持每个频段的峰值，这样当你眨眼的瞬间也不会错过瞬态峰值。\n\n\n\n\n\n使用 `Avg.`（`average`，平均值）设置可添加一条连续线，显示每个频段的信号平均电平。这条连续线显示的是频段的感知响度，而频谱显示中快速移动的条形图则显示瞬时值。\n\
  \n如果你刚开始使用频谱仪，只需向 `Project page`（项目页面）添加几首参考曲目，播放它们，并观察 `Spectrum Meter`（频谱仪）的显示情况。（参考曲目是指经过专业混音和制作的音乐作品。）选择你熟悉的曲目。这样，你很快就能学会如何读懂\
  \ `Spectrum Meter`。\n\n### 电平/响度表\n\n`level/loudness meter`（电平/响度表）显示歌曲的振幅和感知响度，帮助你确保歌曲处于适当的电平，且没有失真或削波。它还有几种显示选项，位于左下角：\n\
  \n![Figure 15.15: The level/loudness meter](img/B31512_15_15.jpg)\n\nFigure 15.15:\
  \ The level/loudness meter\n\n对于绝大多数音乐制作，你可以保持默认值 `Peak/RMS`（峰值/均方根）不变。\n\n在电平/响度表的右侧，你会看到\
  \ `loudness display`（响度显示），它提供关键信息，将影响你的歌曲如何呈现给听众。让我们弄清此显示中所示的两个关键读数：\n\n*   `INT`\
  \ 是 `Integrated LUFS` 的缩写，后者是 `Loudness Units Full Scale`（满量程响度单位）的缩写。这是在一段时间内音频信号平均响度的度量。简单来说，它是歌曲感知整体响度的度量。\n\
  *   `TP` 代表 `True Peak`（真峰值）。这仅仅是音频信号在整首歌曲中达到的最高电平，以分贝为单位。\n\n我们将在 `Creating final\
  \ masters for digital release`（创建用于数字发行的最终母带）一节中讨论如何处理这些读数。\n\n### 相位表\n\n`phase\
  \ meter`（相位表）显示混音中左右声道之间的相位关系。这对于检测相位相关问题（如相位抵消）非常重要。\n\n让我们用一个例子来说明。在 `Figure 15.16`（图\
  \ 15.16）中，左声道的信号与右声道的信号完全相同。波形的峰值和谷值完美对齐；用专业术语来说，这两个声道是 `in phase`（同相位）。\n\n![Figure\
  \ 15.16: The two channels are in phase](img/B31512_15_16.jpg)\n\nFigure 15.16: The\
  \ two channels are in phase\n\n现在，如果我们将其中一个声道稍微推移一点点，这就会改变两个声道之间的相位关系。在 `Figure\
  \ 15.17`（图 15.17）中，右声道被推移了一小段距离。现在，一个声道的谷值与另一个声道的峰值对齐，反之亦然；这两个声道现在是 `out of phase`（反相位）：\n\
  \n![Figure 15.17: The two channels are out of phase](img/B31512_15_17.jpg)\n\nFigure\
  \ 15.17: The two channels are out of phase\n\n这是一个大问题，因为这两个声道现在在完全相同的频率下朝相反方向运动。它们的振动会相互抵消。这称为\
  \ `phase cancellation`（相位抵消）。当它发生在你的混音中时，你的歌曲听起来会变单薄。在极端情况下，某些声音可能会完全消失。\n\n相位表允许我们发现这些问题。最简单的使用方法是留意其界面底部的\
  \ `Corr`（相关性）指示器：\n\n![Figure 15.18: The phase meter](img/B31512_15_18.jpg)\n\n\
  Figure 15.18: The phase meter\n\n当左右声道同相位且完全相同时，如 `Figure 15.16`（图 15.16）所示，`Corr`\
  \ 指示器将显示 `+1`。在立体声混音中，左右声道并不相同，因此 `Corr` 指示器会在 `+1` 和 `0` 之间波动。这完全正常。\n\n当左右声道反相位时，`Corr`\
  \ 指示器将开始显示负值：\n\n![Figure 15.19: The phase meter indicating phase problems](img/B31512_15_19.jpg)\n\
  \nFigure 15.19: The phase meter indicating phase problems\n\n这是一个危险信号，警告你混音中正在发生相位抵消。相位抵消可能由多种原因引起。最常见的原因如下：\n\
  \n*   录音时麦克风摆放位置错误。假设你用两个麦克风录制木吉他。如果吉他的声音到达一个麦克风的时间比到达另一个麦克风稍晚，你最终会得到如 `Figure 15.17`（图\
  \ 15.17）所示的情况。\n*   过度使用立体声拓宽效果；这些效果往往会引入相位问题作为伪影。\n\n每个项目都是独特的，因此你需要自行追踪问题的根源。如果是立体声拓宽效果导致的，通常可以通过降低其设置来解决问题。如果是麦克风摆放位置导致的，返回混音界面，尝试在有问题的声道之一上插入\
  \ `Mixtool` 插件。使用 `Mixtool` 上的 `Phase Invert`（相位反转）按钮；这应该能解决问题。\n\n## 在项目页面上使用自动化\n\
  \n`Project`（项目）页面上的几乎所有参数都可以自动化。我们在 `Chapter 11`（第 11 章）中讨论过自动化，应用自动化的过程类似，因此你可能想回顾该章节，以复习\
  \ Studio One 中自动化的工作原理。\n\n要开始在 `Project`（项目）页面上使用自动化，请单击 `Figure 15.20`（图 15.20）中高亮显示的\
  \ `Automation`（自动化）按钮。\n\n![Figure 15.20: Using automation on the Project page](img/B31512_15_20.jpg)\n\
  \nFigure 15.20: Using automation on the Project page\n\n`Project`（项目）页面有两个独立的自动化通道：\n\
  \n*   顶部的自动化通道称为 `Track Automation`（轨道自动化）通道（`Figure 15.20` 中的 `a`）。此通道允许你为 `Track\
  \ Device`（轨道设备）机架中的插件设置自动化。\n*   底部的自动化通道称为 `Master Automation`（母带自动化）通道（`Figure\
  \ 15.20` 中的 `b`）。此通道允许你为 `Master Device`（母带设备）机架中的插件设置自动化。\n\n同时运行这两个独立的自动化层使你拥有更大的控制权，并允许你在母带处理过程中发挥创意。\n\
  \n在本节中，你学习了如何使用 `Project`（项目）页面通过将曲目编辑至完美并应用最终母带效果来为曲目添加最后的润色。你的歌曲现在已准备好被世界发现，在下一节中，你将学习如何导出歌曲的最终母带，以便将其交付给听众。\n\
  \n# 渲染用于发布和交付的最终母带\n\n让许多人感到畏惧的母带处理过程的一部分原因，是交付格式繁多以及与之相关的标准。数字发行网络、流媒体服务和 CD 生产工厂都有独特的标准，它们要求你在交付最终母带时遵守这些标准。如果你未能遵守这些标准，在最好的情况下，你会被要求使用正确的设置重新提交母带。在最坏的情况下，你的歌曲将原样发布，导致音质不佳。\n\
  \n幸运的是，`Project`（项目）页面使创建符合所有适用标准的最终母带变得容易，即使你没有任何母带处理经验或技术知识。使用 `Project`（项目）页面，你可以为以下格式创建歌曲的最终母带：\n\
  \n*   **数字发行**：这是发布音乐最流行的渠道。此方法允许听众流式传输和下载你的歌曲。\n*   **CD**：尽管受欢迎程度有所下降，CD 仍在音乐市场占有一席之地，特别是当多首歌曲以专辑形式一起呈现时。\n\
  \n现在，让我们看看如何为这些格式中的每一种渲染最终母带。\n\n## 创建用于数字发行的最终母带\n\n\n\n\n## 导出以进行数字发行\n\n您可以直接从\
  \ `Project` 页面导出歌曲的最终母带，随后将其上传至 `DistroKid`、`TuneCore` 或 `CD Baby` 等平台进行分发。具体操作步骤如下：\n\
  \n1. 在 `Project` 页面顶部，点击 `Digital Release` 按钮。这将打开 `Digital Release` 窗口：\n\n![图\
  \ 15.21：数字发行窗口](img/B31512_15_21.jpg)\n\n图 15.21：数字发行窗口\n\n1. 在该窗口左侧，选择您想要导出为最终母带的歌曲。请注意，即使您在\
  \ `Project` 页面有多首歌曲并希望将它们合并为一张专辑，这些歌曲仍会被导出为单独的独立文件。随后您需将这些文件上传至分发平台，并使用该平台自带的工具将它们合并为专辑。\n\
  \n2. 在窗口的 `Location` 部分，选择文件导出的目标文件夹。\n\n3. 在窗口的 `Format` 部分，选择您想要导出的文件格式。对于音乐分发平台，建议选择\
  \ `Wave File`，并将 `Resolution` 设置为 `16 Bit`，`Sample Rate` 设置为 `44.1 kHz`。有关这些设置的更多信息，请参阅第\
  \ 13 章。\n\n4. 在窗口的 `Loudness` 部分，勾选 `Adjust Loudness`。这将激活该复选框旁边的下拉菜单。使用该菜单选择您想要发布音乐的平台。Studio\
  \ One 将分析歌曲的响度，并对其进行优化，以符合您在此处选择的平台所要求的响度标准。在图 15.22 中，我选择了 `Apple Music` 作为目标平台，该窗口部分的所有字段均已自动填充，以反映\
  \ Apple Music 的响度标准。\n\n![图 15.22：调整响度设置](img/B31512_15_22.jpg)\n\n图 15.22：调整响度设置\n\
  \n即使您没有处理平台标准的经验或技术背景，这也是为数字平台优化歌曲的绝佳方式。\n\n1. 点击 `OK`。\n\n`Project` 页面上的每首歌曲都将作为单独的文件渲染到您刚才选择的文件夹中，等待上传以进行最终发行。\n\
  \n## 创建用于 CD 发行的最终母带\n\n虽然数字分发更为普及，但 CD 在音乐行业中仍占据稳固的市场份额，因此您可能需要考虑以这种格式发行歌曲。该过程稍显复杂——您需要创建一个包含所有\
  \ CD 曲目单的 `Disc Description Protocol` (`DDP`) 文件，且该文件必须符合 20 世纪 80 年代制定的 `Red Book`\
  \ 标准，该标准对音频 CD 的制作有着非常具体的规定。\n\n感到困惑？这完全可以理解。您会很高兴地知道，在 `Project` 页面上，只需两次点击即可创建符合\
  \ Red Book 标准的 DDP 镜像。操作方法如下：\n\n1. 在 `Project` 页面顶部，点击 `DDP`。这将打开一个简单的对话框，询问您是否真的要创建\
  \ DDP 镜像：\n\n![图 15.23：创建 DDP 镜像](img/B31512_15_23.jpg)\n\n图 15.23：创建 DDP 镜像\n\n\
  1. 点击 `Yes`。Studio One 将创建一个 DDP 镜像，并将其放置在一个名称后附加了 `DDP` 的文件夹中。下面是图 15.23 中 Project\
  \ 所创建的文件夹：\n\n![图 15.24：包含 DDP 镜像的文件夹](img/B31512_15_24.jpg)\n\n图 15.24：包含 DDP 镜像的文件夹\n\
  \n1. 现在，您只需将该文件夹及其所有内容发送给 CD 压片厂，其余工作将由他们完成。\n\n在本节中，您学习了如何导出歌曲的最终母带，以便上传至数字平台或发送给\
  \ CD 压片厂。这标志着我们对音乐制作流程的探讨告一段落；您的歌曲现已准备好与听众见面。\n\n# 总结\n\n在本章中，我们探索了 `Project` 页面——Studio\
  \ One 专为音频母带处理打造的独特环境。我们讨论了 `Song` 页面与 `Project` 页面之间的集成，并探讨了如何利用这种集成来最大化您的制作工作流。随后，我们了解了如何在\
  \ `Project` 页面上编辑和润色歌曲，以添加最后的修饰。最后，我们探讨了如何导出母带以最终交付给听众。\n\n这是我们对音乐制作流程覆盖的最后一步，从最初的录音一直到最终的交付。在下一章中，我们将介绍\
  \ Studio One 中不属于标准音乐制作流程步骤，但能提供额外价值和功能的特性，它们可能成为您工作流中不可或缺的补充。\n"
- "## 第 16 章：使用 Studio One 的附加功能\n\n到目前为止，本书对 Studio One 可用功能的介绍一直遵循典型的音乐制作工作流步骤。我们从创建新项目开始，一路讲解到导出最终母带。然而，Studio\
  \ One 中还有一些功能不属于这一经典工作流，但值得专门介绍。这就是本章的内容。\n\n在本章中，我们将探索三项通过扩展 Studio One 已有强大功能列表而增加额外价值的功能。通过学习如何使用这些功能，您将能够将\
  \ Studio One 的声音处理能力带入现场表演，使用乐谱记谱表达创意，并利用强大的声音设计技术创作属于您自己的独特声音。\n\n我们将涵盖以下主题：\n\n\
  * 使用 `Show` 页面进行现场表演\n* 使用乐谱编辑器\n* 使用 SampleOne XT 创建和处理采样\n\n## 技术要求\n\n为了跟随本章的操作，您需要在计算机上激活\
  \ Studio One。\n\n## 使用 Show 页面进行现场表演\n\n`Show 页面` 是一个专用的现场表演环境，允许您直接从计算机利用 Studio\
  \ One 的强大功能运行现场演出。如果您有一个乐队或独奏表演，可以使用 `Show` 页面提前准备和组织整场音乐会所需的所有音频素材。演出时，Studio One\
  \ 将在后台处理所有技术细节，而您可以专注于表演。这就像在您的电脑里内置了一位现场音响工程师。\n\n在开始设置您的下一场演出之前，让我们先澄清几个将在 `Show`\
  \ 页面上使用的重要术语：\n\n* `Show` 是指包含并组织整场音乐会、活动或表演所有音频资源的文档。就像我们创建新 Song 以在 `Song` 页面工作一样，我们创建新\
  \ Show 以在 `Show` 页面工作。\n* `Setlist` 是您在 Show 中将要演奏的所有歌曲的列表。\n* `backing track` 是您将用于支持现场表演的预录制音乐伴奏。\n\
  \n现在，我们准备好为您的下一场音乐会做准备了。\n\n### 创建您的第一个 Show\n\n要开始使用 `Show` 页面，我们必须首先创建一个新的 Show。操作步骤如下：\n\
  \n1. 前往 Studio One 的 `Start` 页面，点击 `New…` 按钮。这将打开 `New` 窗口：\n\n![图 16.1：创建新 Show](img/B31512_16_01.jpg)\n\
  \n图 16.1：创建新 Show\n\n1. 在该窗口左侧，选择 `Rehearse and Perform`。\n\n2. 在窗口右侧，为您即将创建的 Show\
  \ 输入一个名称。\n\n\n\n## 3. 导入伴奏轨道\n\n如果您已准备好想要演奏的歌曲的伴奏轨道，请从资源管理器（Windows）或访达（macOS）中将它们拖拽至音频放置区（标题为\
  \ `Drop files here`）。如果伴奏轨道尚未准备好，也不必担心；您稍后随时可以添加。\n\n## 4. 确认创建\n\n点击 `OK`。\n\n\
  这将在 Studio One 中创建您的第一个 `Show` 并带您进入 `Show` 页面，这正是我们接下来要探索的内容。\n\n# 探索 Show 页面\n\
  \n`Show` 页面外观类似于 `Song` 页面的简化版，因此不会太陌生。\n\n![Figure 16.2: The Show page](img/B31512_16_02.jpg)\n\
  \nFigure 16.2: The Show page\n\n`Show` 页面有三个独有的区域。让我们逐一了解：\n\n*   **Setlist**（图\
  \ 16.2 中的 **a**）：该区域包含您在现场 `Show` 中将要演奏的所有歌曲列表。如果您使用图 16.1 中的音频放置区导入了伴奏轨道，它们将显示在此窗口中。现场演出时，歌曲将按此处显示的顺序依次播放。您可以通过在列表中上下拖拽歌曲来轻松重新排序。\n\
  \n*   **Players** 栏（图 16.2 中的 **b**）：该栏包含您的 `Show` 中将处于激活状态的所有 `Player` 列表。我们将在\
  \ *使用 Player* 部分稍作介绍。\n\n*   **Overview** 窗口（图 16.2 中的 **c**）：`Setlist` 中的歌曲在 `Overview`\
  \ 窗口中以事件的形式水平排列。我们将使用此窗口来设置和组织您的 `Show`。\n\n现在，我们准备深入 `Show` 页面，学习如何将其设置为运行您的下一场现场演出。\n\
  \n# 使用 Player\n\n一场音乐会中演奏的歌曲可能包含多个音乐元素：\n\n*   歌手\n*   演奏实体乐器（如吉他和鼓）的乐手\n*   演奏虚拟乐器（如\
  \ Studio One 的 `Presence`）的乐手\n*   补充表演的伴奏轨道\n\n在 `Show` 页面中，每个元素由一个称为 `Player`\
  \ 的相应设备表示。正如我们在 `Song` 页面上为每个乐器设置不同的轨道一样，在 `Show` 页面上我们为每个乐器设置不同的 `Player`。共有三种类型的\
  \ `Player`：\n\n*   `Backing Track Player`（伴奏轨道播放器）\n*   `Real Instrument Player`（实体乐器播放器）\n\
  *   `Virtual Instrument Player`（虚拟乐器播放器）\n\n现在，让我们探索每种播放器类型，并了解如何添加播放器以丰富您的 `Show`。\n\
  \n## 添加伴奏轨道播放器\n\n`Backing Track Player` 仅播放音频文件，就像 `Song` 页面上的音频轨道一样。现场演出时，`Backing\
  \ Track Player` 将播放您想用于伴奏的任何预录音频文件。\n\n在图 16.1 创建新 `Show` 时，我将四个音频文件拖放到了音频放置区。Studio\
  \ One 创建了一个 `Backing Track Player` 并将这些文件首尾相连地放置在该播放器上，如下所示：\n\n![Figure 16.3: Backing\
  \ Track Player](img/B31512_16_03.jpg)\n\nFigure 16.3: Backing Track Player\n\n如果我想在音乐会上演奏更多歌曲，需要执行以下操作：\n\
  \n1.  在资源管理器（Windows）或访达（macOS）中找到新歌曲的伴奏轨道。\n2.  将新的伴奏轨道拖拽并放置在 `Backing Track Player`\
  \ 右侧的空白处：\n\n![Figure 16.4: Adding new files to a Backing Track Player](img/B31512_16_04.jpg)\n\
  \nFigure 16.4: Adding new files to a Backing Track Player\n\n3.  添加新轨道后，我可以通过在 `Overview`\
  \ 窗口或 `Setlist` 中拖拽它们来轻松重新排序。\n\n您可能还希望在演出中的某首歌曲里让多个音频文件同时播放。例如，您可能想以分轨形式导入歌曲的各个元素——一轨鼓、一轨吉他等——并在现场演出时分别控制这些分轨。为此，只需将音频文件从资源管理器（Windows）或访达（macOS）拖拽并放置在\
  \ `Backing Track Player` 下方的空白处。Studio One 将为每个音频文件创建一个新播放器，并将它们置于同一歌曲下方：\n\n![Figure\
  \ 16.5: Adding new files to a song](img/B31512_16_05.jpg)\n\nFigure 16.5: Adding\
  \ new files to a song\n\n这种灵活的设置允许您在更精细的层面上控制伴奏轨道，例如为歌曲的不同元素应用不同的效果插件。\n\n## 添加实体乐器播放器\n\
  \n如果您或乐队成员将在音乐会上演奏实体乐器或进行人声表演，您可以使用 `Real Instrument Player` 将它们添加到您的 `Show` 中。这允许您使用\
  \ Studio One 的效果插件实时处理这些乐器或人声的声音。\n\n要添加 `Real Instrument Player`，请按以下步骤操作：\n\n\
  1.  点击 `Players` 栏中的 `Add Player` 按钮。这将打开 `Add Player` 窗口：\n\n![Figure 16.6: The\
  \ Add Player window](img/B31512_16_06.jpg)\n\nFigure 16.6: The Add Player window\n\
  \n2.  点击 `AUX` 选项卡。\n3.  为即将创建的播放器起一个简短、描述性的名称，以便在 `Players` 栏中轻松识别。\n4.  在 `Input`\
  \ 字段中，选择该播放器将连接到的音频设备上的物理输入。例如，如果您为电吉他创建 `Real Instrument Player`，且该吉他连接到音频设备的输入\
  \ 2，请在此处选择 `Input 2`。\n5.  点击 `OK`。\n\n您需要为乐队中的每位表演者创建一个 `Real Instrument Player`，以便通过为每个播放器应用不同的效果来分别处理它们。\n\
  \n## 添加虚拟乐器播放器\n\n`Virtual Instrument Player` 允许您将虚拟乐器（如 `Presence`）添加到 `Show` 中并在现场演出时演奏。如果您希望虚拟乐器的声音在歌曲之间发生变化，您可以预先编排这些变化，让\
  \ Studio One 在音乐会期间自动实现切换，而您只需专注于演奏。\n\n要向 `Show` 添加 `Virtual Instrument Player`，请执行以下操作：\n\
  \n1.  打开 `Browse` 窗口并选择 `Instruments` 选项卡。\n2.  找到您想添加到 `Show` 的虚拟乐器。\n3.  点击虚拟乐器名称左侧的小三角形。这将打开该乐器可用预设的列表：\n\
  \n![Figure 16.7: List of presets for Presence](img/B31512_16_07.jpg)\n\nFigure 16.7:\
  \ List of presets for Presence\n\n4.  将您想使用的预设拖拽并放置到 `Overview` 窗口中。这将创建一个新的 `Virtual\
  \ Instrument Player` 并加载您选择的预设：\n\n![Figure 16.8: A Virtual Instrument Player](img/B31512_16_08.jpg)\n\
  \nFigure 16.8: A Virtual Instrument Player\n\n5.  您现在可以使用 MIDI 键盘演奏该虚拟乐器。\n\n图 16.8\
  \ 中的 `Show` 有五首歌曲，如 `Overview` 窗口顶部所示。目前，我们创建的 `Virtual Instrument Player` 将在所有五首歌曲中播放相同的预设。但大多数情况下，您会希望每首歌曲使用不同的声音——第一首用原声钢琴，第二首用电钢琴，第三首用管风琴，以此类推。为此，只需将您想为每首歌曲使用的预设拖拽并放置到\
  \ `Virtual Instrument Player` 上对应的槽位中。在图 16.9 中，我为每首歌曲加载了不同的预设。您可以看到它们的名称显示在各自的槽位上：\n\
  \n![Figure 16.9: Adding a different preset for each song](img/B31512_16_09.jpg)\n\
  \nFigure 16.9: Adding a different preset for each song\n\n现在，在现场演出时，当您从一首歌切换到下一首时，Studio\
  \ One 将自动从一种声音切换到另一种。登台演出时，您少了一件烦心事！\n\n\n\n\n## 为现场表演添加效果器\n\n既然我们已经添加了伴奏轨道和乐器，接下来我们想要使用效果器插件来润色它们。这将使我们能够在现场表演中使用\
  \ Studio One 的声音处理功能。\n\n忠于 Studio One 的拖放式界面设计，添加效果器插件简单至极。让我们来看看：\n\n1. 打开 **“浏览”**\
  \ 窗口并转到 **“效果器”** 选项卡：\n\n![Figure 16.10: Adding effects plug-ins to a Show](img/B31512_16_10.jpg)\n\
  \n图 16.10：向 Show 添加效果器插件\n\n1. 将想要使用的效果器拖动并放置到 **“概览”** 窗口中的一个插槽上。\n\n此方法允许您在颗粒度层面上添加效果器组合。例如，*图\
  \ 16.11* 展示了我为电吉他创建的一个真实乐器演奏者。我将 **Ampire** 插件添加到了对应第一首歌的插槽中，因为我想要该歌曲的失真吉他音色。对于下一首歌，我添加了\
  \ **Analog Delay**，对于第三首，我添加了 **Room Reverb**。在现场表演过程中，当时间线从一首歌移动到下一首歌时，Studio One\
  \ 会自动从一个效果器插件切换到另一个，我的吉他音色将随时准备就绪，等待我演奏。\n\n![Figure 16.11: Adding different effects\
  \ to a player](img/B31512_16_11.jpg)\n\n图 16.11：向演奏者添加不同的效果器\n\n您可以在每个插槽中添加任意数量的效果器插件，从而为每首歌构建复杂的效果器链。\n\
  \n## 使用编曲轨道定义歌曲片段\n\n到目前为止，我们已经为音乐会创建了路线图，并明确告诉 Studio One 在每首歌期间该做什么。演出时，我们将 Studio\
  \ One 设为自动驾驶模式，它将为我们处理所有技术细节。这种严格的规划在您登台时可能会带来安全感，但也会剥夺我们将现场表演与即兴发挥联系在一起的乐趣与刺激。如果您发现观众非常享受您的吉他独奏，只想比原计划多演奏一会儿，该怎么办？难道您必须结束独奏并继续下一部分，仅仅因为\
  \ **“Show”** 页面上的时间线不知道观众的反应，只是一味地向前推进吗？\n\n幸运的是，答案是否定的。您可以将歌单中的歌曲分割成片段，然后自由地在片段之间跳转、重复某个片段，或者完全跳过它。我们通过使用\
  \ **编曲轨道** 来实现这一点，我们已经在 **“Song”** 页面上见过它了。\n\n以下是如何使用编曲轨道将歌曲分割成更小的片段：\n\n1. 点击\
  \ **“演奏者”** 栏顶部的 **“打开编曲轨道”** 按钮。这将显示编曲轨道：\n\n![Figure 16.12: Arranger Track on\
  \ the Show page](img/B31512_16_12.jpg)\n\n图 16.12：Show 页面上的编曲轨道\n\n1. 双击编曲轨道以创建一个新片段。Studio\
  \ One 会自动为每个片段命名。\n\n2. 右键单击某个片段以更改其名称和颜色。\n\n3. 拖动片段的左右边缘，使其精确对齐到轨道上对应片段的开始和结束位置。\n\
  \n您可以看到，我在 *图 16.12* 中为我的歌曲添加了四个片段。现在，Studio One 知道每个片段的开始和结束位置。这在我们登台表演时将派上用场，这将是我们接下来的主题。\n\
  \n## 使用 Show 页面进行现场表演\n\n现在，我们准备好表演了！信不信由你，此时您只需按下键盘上的空格键即可开始 Show，Studio One 将处理运行\
  \ Show 的所有细节，让您和您的乐队成员能够专注于表演。\n\n虽然您可以在表演期间使用 **“Show”** 页面，但 Studio One 提供了一个单独的环境，称为\
  \ **“表演视图”**，该视图针对舞台使用进行了优化。表演视图是一个简单的界面，仅包含您在表演期间所需的基本控件。所有内容都很大且易于查看，因此您只需一眼就能找到所需内容，即使您在灯光昏暗的舞台上使用一台小型笔记本电脑。\n\
  \n要切换到表演视图，请点击 **“Show”** 页面顶部的 **“表演”** 按钮：\n\n![Figure 16.13: The Perform button](img/B31512_16_13.jpg)\n\
  \n图 16.13：“表演”按钮\n\n这将打开表演视图：\n\n![Figure 16.14: Performance View](img/B31512_16_14.jpg)\n\
  \n图 16.14：表演视图\n\n表演视图简单至极。让我们快速浏览一下：\n\n* 窗口顶部显示您在时间线上的位置。\n\n* 窗口中心显示我们之前在编曲轨道上创建的片段。如果观众喜欢某个片段且您想重复它，只需点击该片段。如果您想跳转到另一个片段，只需点击那个片段。\n\
  \n* 右下角有两个按钮，用于紧急情况：\n\n    * 有时虚拟乐器在演奏音符时会卡住，即使您松开 MIDI 键盘上的琴键，它们仍会继续播放。在这种情况下，点击\
  \ **“所有音符关闭”** 按钮将向所有虚拟乐器发送 `NOTE OFF` 命令，强制它们停止当前正在播放的任何内容。点击此按钮不会影响伴奏轨道的播放，因此不会出现尴尬的沉默，您可以立即恢复演奏虚拟乐器。通常，卡音问题只是一个简单的故障，不会重复发生。\n\
  \n    * 说到尴尬的沉默，**“静音”** 按钮保留用于事态失控、唯一解决方案是关闭所有音频的极端情况。这对于保护人们的耳朵免受舞台上有时会发生的那种讨厌的啸叫反馈声的伤害特别方便。\n\
  \n恭喜！您的第一个 Show 现已准备就绪。演出时间到来时，您只需点击 **“播放”**，Studio One 将处理其余一切。\n\n现在，让我们来看看 **乐谱编辑器**，Studio\
  \ One 的另一个强大功能。\n\n# 使用乐谱编辑器\n\n**乐谱编辑器** 允许您以乐谱符号的形式查看和编辑 MIDI 数据。这对于不习惯使用我们在 *第\
  \ 9 章* 中讨论的标准钢琴卷帘式 MIDI 编辑器的人来说非常棒。当您需要打印项目的乐谱与其他音乐家分享时，乐谱编辑器也非常方便。\n\n## 打开乐谱编辑器\n\
  \n要开始使用乐谱编辑器，请执行以下步骤：\n\n1. 创建一个乐器轨道，正如我们在 *第 6 章* 中讨论的那样。\n\n2. 双击乐器轨道以创建一个空的 MIDI\
  \ 事件。\n\n3. 双击 MIDI 事件以在 **“编辑”** 窗口中将其打开。\n\n4. 在 **“编辑”** 窗口的左侧，点击 **“乐谱视图”**\
  \ 按钮（标记为高音谱号图标）：\n\n![Figure 16.15: Score View button on the Edit window](img/B31512_16_15.jpg)\n\
  \n图 16.15：编辑窗口上的乐谱视图按钮\n\n这将把 **“编辑”** 窗口切换为显示乐谱编辑器。\n\n## 探索乐谱编辑器\n\n默认情况下，乐谱编辑器显示一个使用高音谱号的空五线谱：\n\
  \n![Figure 16.16: Score Editor](img/B31512_16_16.jpg)\n\n图 16.16：乐谱编辑器\n\n乐谱编辑器顶部是\
  \ **乐谱编辑器** 工具栏，允许您在五线谱上输入和编辑音符。\n\n窗口左侧是 **乐谱编辑器检查器**，允许您为音符添加表情标记并更改显示五线谱的格式。\n\
  \n## 在乐谱编辑器中输入音符\n\n您可以使用以下任意方法在乐谱编辑器中输入音符：\n\n* 使用 MIDI 键盘实时演奏音符\n\n* 使用 **“步进输入”**\
  \ 通过 MIDI 键盘逐个输入音符\n\n* 使用 **“画笔”** 工具输入音符\n\n\n\n\n我们在*第 6 章*中讨论了这些方法，前两种方法在乐谱编辑器中的工作方式完全相同。因此，在本节中，我们将只关注第三种方法。\n\
  \n## 使用画笔工具输入音符\n\n请按照以下步骤，在乐谱编辑器中使用**画笔**工具输入音符：\n\n1. 在乐谱编辑器中，按键盘上的 *2* 以拾取**画笔**工具。\n\
  2. 转到**乐谱编辑器**工具栏，选择要输入的音符时值。您可以选择全音符到 64 分音符之间的任何时值。\n3. 现在，当您将鼠标悬停在五线谱上时，光标将变为铅笔形状，并跟随一个灰色的音符轮廓：\n\
  \n![图 16.17：使用画笔工具输入音符](img/B31512_16_17.jpg)\n\n图 16.17：使用画笔工具输入音符\n\n4. 将灰色音符移动到五线谱上的所需位置，然后左键单击以放置音符。\n\
  5. 要添加休止符，请单击**乐谱编辑器**工具栏上的**休止符**按钮。\n\n请注意，如果您学会音符时值的键盘快捷键，工作速度会快得多。以下是您需要的键盘快捷键：\n\
  \n* *1* 选择**箭头**工具\n* *2* 选择**画笔**工具\n* *3* 选择全音符\n* *4* 选择二分音符\n* *5* 选择四分音符\n\
  * *6* 选择八分音符\n* *7* 选择十六分音符\n* *8* 选择三十二分音符\n* *9* 选择六十四分音符\n\n有了这些快捷键，您只需使用鼠标和电脑键盘，即可在极短时间内填满乐谱。\n\
  \n## 在乐谱编辑器中编辑音符\n\n输入音符后，您可以使用**箭头**工具轻松编辑它们。操作方法如下：\n\n1. 按键盘上的 *1* 以拾取**箭头**工具。\n\
  2. 要更改音符的音高，请左键单击该音符并向上或向下拖动，直到找到正确的音高。当您向上或向下拖动时，Studio One 会播放该音符，帮助您找到想要的音高。\n\
  3. 要更改音符的时长，请在**乐谱编辑器**工具栏中选择所需的音符时值，然后左键单击该音符。\n\n请注意，乐谱编辑器和钢琴编辑器是动态链接的；在一个窗口中所做的任何更改都会反映在另一个窗口中。\n\
  \n## 添加表情标记和排版乐谱\n\n乐谱编辑器检查器可帮助您微调乐谱的外观，以便更清晰地传达您的音乐构思。乐谱编辑器检查器上有三个选项卡，每个选项卡专门处理乐谱的不同部分。让我们逐一探索。\n\
  \n### 符号选项卡\n\n**符号**选项卡可让您为音符添加变化记号和表情标记。要应用此选项卡上的任何表情标记，请选择该表情标记，然后单击要应用它的音符或音符组。\n\
  \n![图 16.18：乐谱编辑器检查器的符号选项卡](img/B31512_16_18.jpg)\n\n图 16.18：乐谱编辑器检查器的符号选项卡\n\n\
  当您将鼠标悬停在该选项卡上的大多数按钮上时，它们的右下角会显示一个小三角形。单击这些三角形将打开弹出窗口，显示更多选项。例如，这是**力度**按钮的弹出菜单：\n\
  \n![图 16.19：力度按钮的选项](img/B31512_16_19.jpg)\n\n图 16.19：力度按钮的选项\n\n这些选项允许您向乐谱添加各种表情标记，帮助您清晰地传达音乐构思。\n\
  \n### 轨道选项卡\n\n**轨道**选项卡可帮助您为乐器选择合适的五线谱类型。打开**五线谱类型**下拉菜单，然后选择要使用的五线谱类型：\n\n![图\
  \ 16.20：选择五线谱类型](img/B31512_16_20.jpg)\n\n图 16.20：选择五线谱类型\n\n使用此选项卡上的**名称**和**缩写**字段为您的乐器指定一个描述性名称。**名称**字段用于乐谱开头；您在**缩写**字段中输入的内容用于标记所有后续行。\n\
  \n### 布局选项卡\n\n**布局**选项卡可让您调整乐谱打印时的外观。您可以钻研细节并调整每一个微小细节，但 Studio One 在将乐谱排版以适应页面方面做得相当不错，因此默认值在大多数情况下应该都没问题。\n\
  \n![图 16.21：乐谱编辑器检查器的布局选项卡](img/B31512_16_21.jpg)\n\n图 16.21：乐谱编辑器检查器的布局选项卡\n\n\
  在此，只需确保**布局样式**选择了**页面**；这将指示 Studio One 将您的乐谱整齐地分成所需的任意页数。\n\n## 完成并打印乐谱\n\n在我们打印乐谱与世界分享之前，让我们确保乐谱正确标注了版权信息。当您首次打开乐谱编辑器时，Studio\
  \ One 会用歌曲文件名填充乐谱的**标题**字段，用您的姓名填充**艺术家**字段。如果您想更改这些信息或提供更多信息，只需单击歌曲标题。这将打开**歌曲设置**菜单：\n\
  \n![图 16.22：输入歌曲信息](img/B31512_16_22.jpg)\n\n图 16.22：输入歌曲信息\n\n在此，您可以根据需要更改歌曲信息。\n\
  \n当您对乐谱满意后，单击**乐谱编辑器**工具栏上的**打印**按钮。这将打开操作系统的标准打印对话框，您可以在其中选择打印机并进行打印。\n\n这结束了我们对乐谱编辑器的介绍。现在，让我们继续了解\
  \ Studio One 工具箱中一个非常有趣的功能：SampleOne XT。\n\n# 使用 SampleOne XT 创建和处理采样\n\n**SampleOne\
  \ XT** 是随 Studio One 附带的全功能采样器。**采样器**是一种可以录制和处理音频采样的设备或软件。**采样**是一段简短的声音录音，例如鼓击、吉他和弦或人声短语。\n\
  \n简单来说，SampleOne XT 是一款非常有趣的软件，它允许您利用任何您能弄到的声音创建专属的虚拟乐器——您狗的叫声、阁楼上那台坏掉的玩具钢琴……随您所愿。只要您能录制下来，SampleOne\
  \ XT 就能将其变成可演奏的乐器。\n\n要开始使用 SampleOne XT，您需要将其实例添加到歌曲中。请按以下步骤操作：\n\n1. 打开**浏览**窗口，转到**乐器**选项卡。\n\
  2. 将 **SampleOne XT** 拖放到**编排**窗口中。\n3. 与 SampleOne XT 打个招呼：\n\n![图 16.23：SampleOne\
  \ XT](img/B31512_16_23.jpg)\n\n图 16.23：SampleOne XT\n\n如果界面看起来令人望而生畏，那是有理由的。SampleOne\
  \ XT 是一款强大的工具，允许您深入创意声音设计的核心领域。但别担心，我们会让您迅速上手基础知识！\n\n## 添加采样\n\n现在，我们需要给 SampleOne\
  \ XT 提供一个采样供其处理。向 SampleOne XT 添加采样有两种方法：\n\n* 如果您已有录制好的采样，格式为 **.wav** 或 **.mp3**\
  \ 文件，您可以将其从**编排**窗口、**浏览**窗口、资源管理器 (Windows) 或访达 (macOS) 中拖放到 SampleOne XT 上。\n\
  * 如果您还没有录制采样，可以直接录制到 SampleOne XT 中。操作方法如下：\n\n    1. 单击 SampleOne XT 界面顶部的**录制**选项卡。这将打开**录制**视图：\n\
  \n![图 16.24：录制到 SampleOne XT](img/B31512_16_24.jpg)\n\n图 16.24：录制到 SampleOne XT\n\
  \n    2. 单击此视图中的**录制**按钮。\n    3. 再次单击同一按钮以停止录制。\n\n现在我们已将采样加载到 SampleOne XT 中，有趣的部分来了！\n\
  \n## 编辑采样\n\n\n\n在 MIDI 键盘上弹奏任意音符，或点击 SampleOne XT 界面上的虚拟键盘上的任意音符。你将听到刚才添加的采样。SampleOne\
  \ XT 会自动将采样转调到你正在演奏的音符，这样你就可以像演奏乐器一样演奏你的采样了。但让我们更进一步。\n\n如果你直接将采样录制到 SampleOne XT\
  \ 中，采样开头可能会有一段静默间隙，所以弹奏音符后可能需要等待片刻。让我们来修复这个问题：\n\n1. 点击 SampleOne XT 界面顶部的 **Wave**\
  \ 选项卡。这将打开 **Wave** 视图：\n\n![Figure 16.25: A gap at the beginning of a sample](img/B31512_16_25.jpg)\n\
  \n图 16.25：采样开头的间隙\n\n1. 在 *图 16.25* 中，你可以看到采样开头有一个间隙。抓住窗口左下角的小三角形并向右拖动，直到采样的开头。这将裁剪掉间隙：\n\
  \n![Figure 16.26: No gap at the beginning of the sample](img/B31512_16_26.jpg)\n\
  \n图 16.26：采样开头无间隙\n\n现在你的采样将更加灵敏；当你在 MIDI 键盘上弹奏音符的那一刻，它就会被触发。\n\n## 选择触发模式\n\n**Trigger**\
  \ 设置决定了当你在 MIDI 键盘上弹奏音符时 SampleOne XT 如何播放采样。有三个可用选项，可通过点击下拉菜单访问：\n\n![Figure 16.27:\
  \ Trigger modes](img/B31512_16_27.jpg)\n\n图 16.27：触发模式\n\n让我们来探索这些选项：\n\n* **Normal**：当你在\
  \ MIDI 键盘上弹奏音符时，采样将播放。当你松开音符时，采样将停止。\n* **One Shot**：当你在 MIDI 键盘上弹奏音符时，采样将播放并持续播放直到采样结束，无论你何时松开音符。这是鼓和打击乐采样的首选\
  \ **Trigger** 方法；如果你过早松开音符，不希望它们听起来被切断。\n* **Toggle**：当你在 MIDI 键盘上弹奏音符时，采样将播放，当你再次弹奏同一个音符时，它将停止。这是长采样（如音效、垫音或持续音）的首选\
  \ **Trigger** 方法。\n\n为你的采样选择正确的 **Trigger** 模式将让你更好地控制采样，使你的新虚拟乐器更加好演奏且更令人愉悦。\n\n\
  将 SampleOne XT 集成到你的制作工作流中将开启全新层面的创造力，让你设计专属的声音和乐器。这是在音乐中开发你标志性声音的门户。\n\n# 总结\n\n\
  在本章中，我们介绍了 Studio One 中三个超出标准音乐制作工作流的重要功能。首先，我们深入探讨了 **Show** 页面，并讨论了如何利用 Studio\
  \ One 的力量增强现场表演。然后，我们探索了乐谱编辑器，它为习惯使用乐谱记谱的人提供了更直观的界面。最后，我们了解了 SampleOne XT，这是一款具有深度声音设计能力的强大采样器，为无限的创作可能性敞开了大门。\n\
  \n随着本章的结束，本书也接近尾声。通过这些页面，我希望为你提供了一份使用 Studio One 的综合指南。音乐制作是一个不断发展的领域，需要技术、创造力和激情的结合。无论你是刚入门还是已经制作音乐多年，总有新东西值得学习和探索。\n\
  \n迈出去吧，学习、创作，并与世界分享你的音乐！\n"
- "# 附录\n\n## 自定义 Studio One 并遵循最佳实践\n\n正如你现在所知，Studio One 通过简化工作流使音乐制作尽可能简单。在本附录中，我们将进一步讨论几种自定义\
  \ Studio One 的方法，以便你避免重复性任务。我们还将探索 Studio One 的文件管理系统，并讨论如何优化工作流以避免一些常见问题。最后，我们将谈论与他人共享项目以进行协作的最佳实践。\n\
  \n遵循我们将在此讨论的方法将使你的整体音乐制作体验更加顺畅。\n\n我们将涵盖以下主题：\n\n* 自定义 Studio One\n* 理解文件和文件夹系统\n\
  * 与他人共享文件\n\n## 技术要求\n\n为了跟随本节内容，你需要在电脑上激活 Studio One。\n\n## 自定义 Studio One\n\n\
  当你从一个项目转到另一个项目时，某些流程会变成肌肉记忆，你会发现自己反复做这些事情。也许你有一组特殊的效果插件组合，能让你的人声产生神奇的效果。又或者你通过叠加三个虚拟乐器创造了一个绝妙的声音，这个声音已经成为你声音标志的一部分，以至于你想在所有项目中使用它。\n\
  \n如果你发现自己频繁加载相同的插件或虚拟乐器，将它们保存为模板和预设是个好主意。这将让你直接进入创作过程，而无需每次都花时间设置相同的元素。\n\nStudio\
  \ One 提供了多种方法让你自定义工作流以提高效率和一致性。在本节中，我们将详细探讨这些方法。\n\n### 创建你自己的智能模板\n\n在 Studio One\
  \ 中，**智能模板** 是一个预配置的 Song 文件，包含设置、预加载的虚拟乐器、效果和其他元素，可用于快速启动新项目。模板为新项目创建一致的起点，并通过消除每次创建\
  \ Song 文件时配置相同元素的需要来节省时间。模板还可以在协作者之间共享，从而实现标准化的音乐制作方法。\n\n如果你发现自己为每个项目都添加相同的乐器和效果、创建相同的路由和混音器配置，你可以轻松创建自己的智能模板，在下一个项目中跳过这些步骤，直接开始创作。具体步骤如下：\n\
  \n1. 打开一个包含你常规添加到项目中的元素的典型 Song 文件。\n2. 调整所有效果和乐器，并按你希望在创建下一个 Song 文件时看到的方式设置它们。\n\
  3. 配置所有路由设置和混音器配置以最适合你的工作流；这包括设置 FX 通道、创建总线以及在通道间应用侧链。\n4. 自定义用户界面，仅包含与你相关的内容，如\
  \ *第 3 章* 所述。\n5. 删除 **Arrange** 窗口内的所有内容——你不想在模板中保存内容。\n6. 现在，转到顶部菜单，点击 `File`，然后选择\
  \ `Save As Template…`，这将打开 **Save As Template** 对话框：\n\n![](img/B31512_Appendix_1.jpg)\n\
  \n图 A.1：另存为模板对话框\n\n1. 在 **Title** 字段中为你的模板起一个简短的名称。\n2. 在 **Description** 字段中提供模板的简短描述。随着你创建越来越多的模板，这将帮助你记住该模板的用途。\n\
  3. 点击 `OK`。\n\n现在，下次启动 Studio One 时，你的新模板将已准备就绪，等待你开始新 Song 的创作。你可以按以下方式打开它：\n\n\
  1. 在 **Start** 页面，点击 `New…` 按钮。这将打开 **New** 文档窗口。\n2. 点击 **User** 选项卡。\n\n![](img/B31512_Appendix_2.jpg)\n\
  \n图 A.2：打开用户模板\n\n1. 选择你的模板。\n2. 点击 `OK`。\n\n\n\n根据各种工作流场景的需要，创建任意数量的智能模板。这将释放原本用于音乐制作机械操作的精力带宽。\n\
  \n## 使用轨道预设\n\n**轨道预设**允许您保存和调用常用的轨道配置，这样您就不必每次创建新轨道时都重新设置这些参数。\n\n轨道预设会保存和调用与轨道相关的每一个参数。例如，假设我为每个新\
  \ Song 都这样设置我的主音电吉他轨道：\n\n*   将轨道命名为 **E Gtr Lead**。\n*   将轨道颜色设为红色。\n*   在轨道上插入\
  \ **Ampire**，并使用我自己的自定义设置。\n*   使用轨道的 **发送** 槽架以 -9 dB 将信号发送到一个 FX 通道，并加载 **Room\
  \ Reverb** 和 **Pro EQ**。\n*   将轨道路由到名为 **E Guitars** 的总线。\n\n我不必在每个新项目中都创建一个具有上述设置的轨道，而是可以将该配置保存为轨道预设，然后在下一个项目中调用它。Studio\
  \ One 将自动重建相同的组合，为我节省时间并简化工作流程。操作非常简单：\n\n1.  在现有的 Song 中，按您想要的方式设置轨道：\n    1. \
  \ 给它命名。\n    2.  分配轨道颜色。\n    3.  插入任何效果插件并按您想要的方式调整它们。\n    4.  创建一个 FX 通道，并使用\
  \ **发送** 槽架添加任何额外效果（可选）。\n    5.  创建一个新的总线通道，并将轨道的输出路由到该总线（可选）。\n\n这是我刚才描述的主音电吉他轨道配置：\n\
  \n![](img/B31512_Appendix_3.jpg)\n\n图 A.3：为轨道预设准备轨道\n\n1.  右键单击轨道并选择 **存储轨道预设…**，这将打开\
  \ **存储预设** 对话框：\n\n![](img/B31512_Appendix_4.jpg)\n\n图 A.4：存储预设对话框\n\n1.  为您的预设输入名称和描述。在此提供详细的描述将帮助您记住该预设的用途。\n\
  2.  单击 **确定**。\n\n现在，让我们看看如何在下一个项目中调用此轨道预设：\n\n1.  单击 **添加轨道** 按钮。这将打开 **添加轨道**\
  \ 对话框：\n\n![](img/B31512_Appendix_5.jpg)\n\n图 A.5：添加轨道对话框\n\n1.  单击 **加载轨道预设…**。这将打开\
  \ **加载轨道预设** 窗口：\n\n![](img/B31512_Appendix_6.jpg)\n\n图 A.6：加载轨道预设窗口\n\n1.  找到您的预设并单击\
  \ **确定**。\n\n在 *图 A.7* 中，我在一个空项目中加载了我的 **E Gtr Lead** 轨道预设。请注意，FX 通道和总线通道已自动创建，所有路由也已自动建立，就像\
  \ *图 A.3* 中原始轨道的配置一样。\n\n![](img/B31512_Appendix_7.jpg)\n\n图 A.7：通过调用轨道预设创建的一个轨道、一个\
  \ FX 通道和一个总线通道\n\nStudio One 自带多个预配置的轨道预设，更多预设可在 PreSonus Exchange 免费下载（我们在 *第 2\
  \ 章* 中讨论过）。请随意探索这些预设，了解其他人是如何设置他们的轨道的。这就像在同行制作人的肩后观看他们工作一样，将是一次极佳的学习体验。\n\n## 使用效果链\n\
  \n**效果链** 在 Studio One 中也称为 **FX Chain**，是一系列按顺序应用于音频信号的音频效果。通过按特定顺序组合多个效果插件，您可以创建独特且鲜明的声音，可用于提升音质或实现特定的艺术效果。\n\
  \n如果您在项目中经常使用相同的效果序列，可以将它们保存为 FX Chain，然后在未来的项目中单击一下即可调用，所有效果参数都将按您想要的方式设置。操作方法如下：\n\
  \n1.  在轨道的 **插入** 槽架上设置您的 FX Chain。将所有效果参数调整为您想要的状态。\n2.  单击 **插入** 标签旁边的小三角形。这将打开\
  \ **FX Chain** 菜单：\n\n![](img/B31512_Appendix_8.jpg)\n\n图 A.8：FX Chain 菜单\n\n1.\
  \  选择 **存储 FX Chain…**。这将打开 **存储预设** 对话框：\n\n![](img/B31512_Appendix_9.jpg)\n\n\
  图 A.9：存储预设对话框\n\n1.  为您的 FX Chain 输入名称并添加简短描述。\n2.  Studio One 尝试通过将 FX Chain 分组到文件夹中来保持其有序。选择该\
  \ FX Chain 应列在其下的子文件夹。\n3.  单击 **确定**。\n\n在未来的项目中，当您想要调用您的 FX Chain 时，请按如下步骤操作：\n\
  \n1.  转到您想要加载 FX Chain 的轨道的 **插入** 槽架。\n2.  单击 **插入** 标签旁边的小三角形。\n3.  在您保存 FX Chain\
  \ 的文件夹中找到它，然后单击以加载。\n\n![](img/B31512_Appendix_10..jpg)\n\n图 A.10：加载 FX Chain\n\n\
  就像轨道预设一样，Studio One 自带大量 FX Chain，更多可从 PreSonus Exchange 下载。请随意探索它们，看看同行制作人在不同塑声场景中使用什么。\n\
  \n在本节中，您学习了如何通过创建模板和预设来自动化重复性任务，从而节省时间并简化工作流程。在下一节中，我们将讨论最佳实践，帮助您充分利用 Studio One\
  \ 的文件管理系统。\n\n# 理解文件和文件夹系统\n\n当灵感来袭，您想创作下一首热门单曲时，您可以随心所欲地从各种不同来源引入素材——从早期项目中获取音频文件、使用外部驱动器上的循环、从\
  \ YouTube 视频中提取音频作为采样……应有尽有。\n\n在后台，Studio One 出色地跟踪这些音频资产，让您能够专心创作而不受干扰。对于中小型项目，Studio\
  \ One 的文件管理能力绰绰有余；但是，随着项目规模扩大，总会有那么时候，Studio One 需要您稍加协助，以保持井井有条、运行顺畅。这正是本节的目标。\n\
  \n让我们首先讨论 Studio One 如何处理文件和文件夹。\n\n## 探索 Studio One 的文件管理系统\n\n当您在计算机上安装 Studio\
  \ One 时，它会创建三个文件夹，分别作为您未来的 Song、Project 和 Show 的存放位置。以下是我电脑上 Studio One 安装的这些文件夹：\n\
  \n![](img/B31512_Appendix_11.jpg)\n\n图 A.11：Studio One 用户数据文件夹\n\n这三个文件夹统称为 **用户数据**，我们在\
  \ *第 2 章* 中讨论了如何自定义这些文件夹的位置。\n\n当您开始创建新的 Project、Show 和 Song 时，Studio One 会在各自的文件夹下为每个项目创建单独的子文件夹。这是我的一个\
  \ Song 的子文件夹：\n\n![](img/B31512_Appendix_12.jpg)\n\n图 A.12：Song 子文件夹的内容\n\n当我创建\
  \ Song 时，Studio One 创建了带有 `.song` 扩展名的文件。随着我继续处理 Song，所有其他文件夹都由 Studio One 自动创建并填充内容。使用\
  \ Studio One 的妙处就在于此：它在后台完成所有杂务，让您专注于创作。您不必知道这些文件夹里有什么；甚至不必知道这些文件夹的存在……直到您需要知道的时候。\n\
  \n## 定位和复制丢失的文件\n\n让我们回到那个您心情愉悦、正在创作新 Song 的美好时刻。您工作了几个小时，听起来已经像首热门单曲了。于是您收工关机。然而，第二天您回到\
  \ Song 时，却收到如下消息：\n\n![](img/B31512_Appendix_13.jpg)\n\n图 A.13：定位丢失文件对话框\n\n\n\n\
  \n## 处理外部驱动器丢失的文件\n\n请记住你拖入 Song 的那个来自可移动驱动器的音频文件？现在该驱动器未连接到你的电脑，因此 Studio One 找不到该音频文件。\n\
  \n快速解决方法是连接该驱动器，点击此窗口上的 `Locate File…`，并指引 Studio One 到文件所在位置。然而，这只是临时修复；下次打开此 Song\
  \ 时，除非外部驱动器始终保持连接，否则你会遇到同样的问题。\n\n永久解决方案是通过将所有此类外部文件复制到该 Song 自身的文件夹下，将它们“带回家”，这非常容易操作：\n\
  \n1.  确保 Song 中使用的所有外部驱动器均已连接。\n2.  打开该 Song。\n3.  在顶部菜单中，转到 `Song` 并选择 `Copy External\
  \ Files`。\n\nStudio One 会将所有外部文件复制到 Song 文件夹内各自对应的位置。你将不再收到缺失文件警告，也不再需要去其他驱动器上搜寻文件。\n\
  \n## 移除未使用的文件\n\n在制作 Song 的过程中，你会创建大量最终未被使用的文件。例如，如果你录制了多遍人声表演，最终只采用了一遍，其他遍的文件仍会留在你的驱动器上，占用宝贵的存储空间。\n\
  \nStudio One 可以自动检测这些未使用的文件并为你删除它们。仅需三次点击：\n\n1.  打开该 Song。\n2.  转到顶部菜单上的 `Song`。\n\
  3.  选择 `Remove Unused Files`。\n\n养成在 Song 完成后执行此命令的习惯是个好主意。如果你进行大量录音，你会惊讶地发现未使用的素材浪费了多少存储空间。\n\
  \n不过请注意，如果你在其他 Song 中也使用了这些素材，删除它们将导致那些其他 Song 也无法使用这些素材。因此，这里有一个最佳实践——先在所有 Song\
  \ 上运行 `Copy External Files`，然后再选择 `Remove Unused Files`。这样可以消除误删已用文件的风险。\n\n## 使用自动保存和恢复\n\
  \n默认情况下，Studio One 每五分钟会自动保存一次你的 Song。这些自动保存的文件存储在 Song 主文件夹的 `History` 子文件夹中。这是一大福音，因为如果由于某些原因（系统崩溃、断电等）你无法保存\
  \ Song，你最多只会丢失五分钟的工作成果。\n\n当你尝试打开一个之前崩溃过的 Song 文件时，Studio One 会询问你是否要继续使用最近的自动保存版本。点击\
  \ `OK`，你就可以像从未发生崩溃一样继续工作。\n\n不过，如果你频繁遇到崩溃，可能该进行一些故障排除了。Studio One 有一个 `Studio One\
  \ Safety` 窗口，可能通过一些尝试和错误来帮助诊断崩溃原因。\n\n当 Studio One 崩溃时，下次启动程序时 `Studio One Safety`\
  \ 窗口会自动打开。你也可以在启动 Studio One 时按住键盘上的 `Shift` 键强制打开它。\n\n![](img/B31512_Appendix_14.jpg)\n\
  \nFigure A.14: The Safety window\n\n通常，崩溃是由于与第三方插件冲突引起的，尤其是较旧的插件。使用 `Studio One\
  \ Safety` 窗口，你可以暂时禁用特定类型的插件，启动 Studio One，并查看是否解决了问题。这将帮助你通过尝试和错误缩小嫌疑范围。一旦找到罪魁祸首，你可以尝试更新它，或用一个与\
  \ Studio One 兼容良好的替代品来替换它。\n\n## 保存增量版本\n\n这里有一个能让你省去很多麻烦的最佳实践——每隔半小时左右用不同的版本名称保存文件。最简单的方法是在文件名末尾添加一个数字，并随每个版本递增，如下所示：\n\
  \n![](img/B31512_Appendix_15.jpg)\n\nFigure A.15: Saving a Song file with incremental\
  \ versions\n\n当你在制作 Song 时，特别是如果你已经辛苦工作了一段时间且感到疲惫，你可能会发现最新的操作反而削弱了 Song 的质量而非提升它。你可能会想：“这行不通。我真希望能回到过去。”\
  \ Studio One 确实有 `Undo`（撤销）功能，但就像现实生活中一样，有些举动就是无法撤销的。\n\n在这种情况下，拥有一个半小时前保存的 Song\
  \ 版本（那时一切尚属完好）简直是救命稻草。只需关闭当前版本，打开之前的版本，即可获得第二次机会把事情做对。\n\nStudio One 让这很容易实现。以下是设置方法：\n\
  \n1.  在 Song 界面中，转到顶部菜单的 `File` 并选择 `Save New Version…`。这将打开一个对话框：\n\n![](img/B31512_Appendix_16.jpg)\n\
  \nFigure A.16: The Save New Version dialog box\n\n2.  勾选 `Incremental version`。\n\
  3.  点击 `OK`。\n\n现在 `Incremental version` 复选框已选中，你无需再打开此对话框即可保存新版本。下次想要创建新版本时，只需使用\
  \ `Save New Version…` 命令的键盘快捷键——`Ctrl` + `Alt` + `S` (Windows) 或 `Option` + `Cmd`\
  \ + `S` (Mac)——Studio One 就会自动创建一个新版本。\n\n在本节中，我们探讨了 Studio One 如何处理构成 Song 的所有文件，并讨论了多项最佳实践，以保持文件系统有序、避免缺失文件警告、排查崩溃故障以及回退到\
  \ Song 的先前版本。接下来，我们将讨论与他人共享 Studio One 文件以进行协作的最佳实践。\n\n# 与他人共享你的文件\n\n无论你是与其他制作人合作、与乐队成员交换想法，还是将音轨发送给混音室，共享你在\
  \ Studio One 中创建的文件都是一项重要的技能，且伴随着自己的最佳实践。\n\n在本节中，我们将探讨不同的共享文件场景，考虑每种场景下最有效的共享方法。\n\
  \n## 与拥有 Studio One 的合作者共享\n\n如果你与一位也拥有 Studio One 的制作人合作，共享你的 Song 文件夹将获得最佳体验。这样，你的合作者可以直接在文档上工作并发回给你，无需任何转换或渲染。\n\
  \n要与合作者共享 Song 文件夹，请执行以下操作：\n\n1.  打开你的 Song。\n2.  在顶部菜单中，转到 `File` 并选择 `Copy External\
  \ Files`。这将确保你的 Song 中使用的所有文件在共享时都包含在其文件夹内，防止出现任何关于缺失文件的提示。\n3.  再次在顶部菜单中，转到 `File`\
  \ 并选择 `Remove Unused Files`。这将消除不再需要的文件造成的杂乱，减小文件夹大小，使其更易于通过互联网共享。\n4.  找到你的 Song\
  \ 文件夹并将其共享给合作者。\n\n如果你仅共享带有 `.song` 扩展名的文件，你的合作者将无法加载媒体文件，因此共享整个文件夹至关重要。\n\nStudio\
  \ One 版本向后兼容，因此 Studio One 7 可以打开 Studio One 6 创建的 Song 文件。但反之不行；如果你使用 Studio One\
  \ 7 而合作者使用 Studio One 6，他们将无法打开你的 Song。\n\n此外，如果你在 Song 中使用了第三方插件而合作者没有这些插件，Song\
  \ 文件虽然能在他们的电脑上正常打开，但他们将无法听到这些插件创建的效果。如果这些效果在协作阶段不可或缺，请在共享文件夹前渲染音频文件（如 `Chapter 13`\
  \ 所述）。\n\n## 与没有 Studio One 的合作者共享\n\n\n\n\n## 将歌曲作为 MIDI 文件共享\n\n如果你要与没有 Studio\
  \ One 的合作者共享歌曲，最好的办法是共享 MIDI 文件。MIDI 文件可以在任何 `digital audio workstation` (`DAW`)\
  \ 软件中打开，因此你的合作者只需将文件拖入他们正在使用的任何程序中即可继续工作。\n\n要从项目创建 MIDI 文件，请执行以下操作：\n\n1. 打开你的歌曲。\n\
  2. 转到顶部菜单上的 `File`，悬停在 `Convert To` 上，然后选择 `MIDI File…`。\n3. 在对话框中，为你的 MIDI 文件命名。\n\
  4. 点击 `OK`。\n\nMIDI 文件还有一个额外优势，即体积极小，因此即使在移动设备之间也能轻松共享。\n\n## 共享音轨以进行混音\n\n如果你聘请混音工程师为你的歌曲混音，你需要将歌曲的各个单独音轨发送给他们。以下是一些最佳实践，可为你和混音工程师节省时间：\n\
  \n1. 打开你的歌曲并禁用所有效果插件，除了那些构成乐器特征声音的必要组件。例如，如果你通过使用 `Ampire` 或类似插件获得了独特的吉他音色，请保留它开启。禁用你添加到歌曲中的所有其他插件；这些现在是混音工程师的责任。\n\
  \n2. 使用 `Export Stems` 命令导出歌曲中的所有音轨，正如我们在 *第 13 章* 中讨论的那样。\n\n3. 进入包含音轨文件的文件夹，并给它们起简短、描述性的名称。不要添加冗长的前缀，例如\
  \ `MySongTrack07_Bass`。所有 DAW 软件的混音台仅显示音轨名称的前几个字母，如果所有音轨文件名都有相同的前缀，混音工程师在混音器的每个通道上看到的将是相同的内容。\n\
  \n4. 创建一个文本文件，其中包含你的姓名、联系方式、歌曲名称、导出音轨的采样率和位深，以及歌曲的速度。\n\n5. 将所有音轨文件和文本文件合并到一个 ZIP\
  \ 文件夹中。\n\n6. 将 ZIP 文件夹重命名为包含你的姓名和歌曲名称。\n\n遵循这些最佳实践将使混音工程师能够立即开始处理你的歌曲，而无需进行任何额外工作或致电询问你问题。\n\
  \n# 概要\n\n在本节中，我们讨论了几种自定义 Studio One 以匹配并加速你工作流程的方法。然后，我们探索了 Studio One 的文件管理系统，以帮助你跟踪歌曲中的各种素材。随着时间的推移，这将变得越来越重要，因为你需要对电脑进行整理、减少杂乱并归档完成的歌曲。最后，我们探讨了与同事和合作者共享已完成和未完成歌曲的各种方法。遵循这些最佳实践将使你和团队中的其他人的生活更轻松。\n"
