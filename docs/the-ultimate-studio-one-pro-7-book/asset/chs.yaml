  - `Output Format`：选择您的目标扬声器配置。请注意，您在工作室中也需要有匹配的扬声器配置。

  - `Sample Rate`：在 `44.1 kHz` 和 `192 kHz` 之间选择一个采样率。


  您的新 `Song` 现已配置为空间音频。如果您稍后需要更改 `Song` 的配置，请转到顶部菜单上的 `Song` 并点击 `Spatial Audio…`。这将打开一个对话框，您可以在其中修改我们之前讨论的设置。


