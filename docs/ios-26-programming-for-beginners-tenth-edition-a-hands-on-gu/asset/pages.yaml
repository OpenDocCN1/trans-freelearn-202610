- pgno: 67
  md: '# Use type safety to check values


    Swift is a type-safe language. It checks to see whether you’re assigning values
    of the correct type to variables and flags mismatched types as errors. Let’s see
    how this works by following these steps:


    +   1. Add the following statement to your playground to assign a string to restaurantRating
    and run it:


    ```

    restaurantRating = "Good"

    ```


    +   2. You’ll see an error notification (a red circle with an x inside it). The
    x means Xcode can’t suggest a fix for this. Click on the red circle.


    +   3. Since you are trying to assign a string to a variable of type Double, the
    following error message is displayed:


    ![](img/0972ba626734a3986e095c788777818e_67_0.png)


    Figure 2.13: Expanded error notification with no fix


    +   4. Comment out the line by typing // before it, as shown here:


    ```

    // restaurantRating = "Good"

    ```


    The red circle disappears as there are no more errors in your program.


    ![](img/0972ba626734a3986e095c788777818e_67_1.png)


    Now that you know how to store data in constants and variables, let’s look at
    how to perform operations on them in the next section.


    # Operators


    You can perform arithmetic, comparison, and logical operations in Swift. Arithmetic
    operators are used to perform common mathematical operations. Comparison and logical
    operators check an expression’s value and return true or false.'
  merge: -1
