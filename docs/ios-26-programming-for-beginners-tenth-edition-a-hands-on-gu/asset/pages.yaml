- pgno: 145
  md: "2. To get the total calorie count, add the following code after the line where\
    \ you created the foodArray constant:\n\n```\nlet totalCalories = foodArray.reduce(0,\
    \ {$0 + $1.calories})\nprint(totalCalories)\n```\n\nThe reduce method is used\
    \ to produce a single value from the elements of the foodArray array. The first\
    \ parameter of this method is the initial value, and it is set to 0. The second\
    \ parameter is a closure that combines the initial value with the value stored\
    \ in an element’s calories property. This is repeated for each element in the\
    \ foodArray array, and the result is assigned to totalCalories. The total amount,\
    \ 1315, will be displayed in the Debug area.\n\nYou have learned how to create\
    \ a protocol and make a class, structure, or enumeration conform to it, either\
    \ within the class definition or via extensions. Let’s look at error handling\
    \ next and see how to respond to or recover from errors in your program.\n\n#\
    \ Error handling\n\nWhen you write apps, bear in mind that error conditions may\
    \ happen, and error handling is how your app responds to and recovers from such\
    \ conditions.\n\nFirst, you create a type that conforms to Swift’s Error protocol,\
    \ which lets this type be used for error handling. Enumerations are normally used,\
    \ as you can specify associated values for different kinds of errors. When something\
    \ unexpected happens, you can stop program execution by throwing an error. You\
    \ use the throw statement for this and provide an instance of the type conforming\
    \ to the Error protocol, with the appropriate value. This allows you to see what\
    \ went wrong.\n\nOf course, it would be better if you could respond to an error\
    \ without stopping your program. For this, you can use a do-catch block, which\
    \ looks like this:\n\n```\ndo {\n    try expression1\n    statement1\n} catch\
    \ {\n    statement2\n}\n```\n\nHere, you attempt to execute code in the do block\
    \ using the try keyword. If an error is thrown, the statements in the catch block\
    \ are executed. You can have multiple catch blocks to handle different error types."
