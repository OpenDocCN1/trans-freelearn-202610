- pgno: 588
  md: 'To test your app on your test devices, you’ll use the development certificate,
    App ID, registered test devices, and development profile. To submit your app to
    the App Store, you’ll use the distribution certificate, App ID, and distribution
    profile. You’ll configure Xcode to manage this automatically for you.


    Before you submit your app, you must create your app’s icons and get screenshots
    of your app. Then, you can create an App Store listing, generate an archive build
    to be uploaded, and complete the App Store Connect information. Apple will then
    review your app and, if all goes well, it will appear on the App Store.


    > To see more information on how to submit your apps, visit https://developer.apple.com/app-store/submitting/.


    In the next section, let’s see how to create icons for your app, which will appear
    on a device’s screen when the app is installed.


    # Create icons for your app


    Before you upload your app to the App Store, you must create an icon set for it.
    Here’s how to create an icon set for your app:


    +   1. Create an icon for your app that is 1,024 x 1,024 pixels.

    +   2. Click the Assets file in the Project navigator and drag the icon you created
    to the space shown in the following screenshot:


    ![](img/0972ba626734a3986e095c788777818e_588_0.png)


    Figure 27.32: Assets file showing space for the app icon'
  merge: -1
  img_proc: true
- pgno: 589
  md: 'When you run your app in Simulator or on a device and quit your app, you should
    be able to see the app’s icon on the home screen. Neat!


    As shown in Chapter 24, Icon Composer, you can also use Icon Composer to create
    an icon for your app.


    Let’s look at how to create screenshots next. You’ll need them for your App Store
    submission, so customers can see what your app looks like. You’ll do this in the
    next section.


    # Take screenshots for your app


    You’ll need screenshots of your app, which will be used in your App Store listing.
    To create them, run your app in Simulator and click the screenshot button. It
    will be saved to the desktop:


    ![](img/0972ba626734a3986e095c788777818e_589_0.png)


    Figure 27.33: Simulator showing the screenshot button


    Apple requires screenshots of your app running on an iPhone with a 6.5” display
    (such as the iPhone 14 Plus) and an iPad with a 13” display (such as the iPad
    Pro 13-inch). You can use Simulator to simulate these devices if you don’t have
    the actual devices, and your screenshots should show your app’s features and how
    your app looks on different screen sizes.


    How to submit screenshots of your app will be discussed in more detail in the
    next section, where you will learn how to create an App Store listing. The App
    Store listing contains all the information about your app that will be displayed
    in the App Store, so customers can make an informed decision about downloading
    or purchasing your app.'
  merge: -1
  img_proc: true
- pgno: 590
  md: '# Create an App Store listing


