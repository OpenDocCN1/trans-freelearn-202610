  md: "6. Verify that the getAIImage(_:) method has been created in the AddJournalEntryViewController\
    \ class. Click the x to close the assistant editor window:\n\n![](img/0972ba626734a3986e095c788777818e_550_0.png)\n\
    \nFigure 25.18: Assistant showing the getAIImage(_:) method\n\nYou have successfully\
    \ added a long press gesture recognizer to the image view in the New Entry Scene\
    \ and linked it to a getAIImage(_:) method in the AddJournalEntryViewController\
    \ class. Now you'll add code to generate an AI image when the user long-presses\
    \ the image view. Follow these steps:\n\n+   1. In the Project navigator, click\
    \ the AddJournalEntryViewController file. Add an import statement to import the\
    \ ImagePlayground framework after all other import statements in the file:\n\n\
    ```\nimport UIKit\nimport CoreLocation\nimport ImagePlayground\n```\n\n+   2.\
    \ Add the following private method after the getAIImage(_:) method:\n\n```\nprivate\
    \ func generateAIImage(prompt: String) async throws -> UIImage? {\n    var generatedImage:\
    \ UIImage?\n    do {\n        let creator = try await ImageCreator()\n       \
    \ let images = creator.images(\n            for: [.text(prompt)],\n          \
    \  style: .sketch,\n            limit: 1)\n        for try await image in images\
    \ {\n            let anImage = image.cgImage\n            generatedImage = UIImage(cgImage:\
    \ anImage)\n\n```"
  merge: -1
  img_proc: true
- pgno: 551
  md: "```\n}\n} catch {\n    generatedImage = UIImage(systemName: \"exclamationmark.triangle\"\
    )\n    print(\"Image creation error.\")\n}\nreturn generatedImage\n}\n```\n\n\
    This method instantiates an ImageCreator instance and generates a single AI image\
    \ based on a text prompt. The .sketch style is used, and you can also try the\
    \ other two styles, .animation and .illustration if you wish. If AI image creation\
    \ is successful, the generated image is converted into a UIImage instance and\
    \ returned. If AI image creation fails, an image of an exclamation mark inside\
    \ a triangle is returned.\n\nYou can learn more about the ImageCreator class at\
    \ this link: https://developer.apple.com/documentation/imageplayground/imagecreator\n\
    \n+   3. Modify the getAIImage(_:) method as shown:\n\n```\n@IBAction func getAIImage(_\
    \ sender: UILongPressGestureRecognizer) {\n    if sender.state == .ended {\n \
    \       photoImageView.image = UIImage(systemName: \"progress.indicator\")\n \
    \       guard let prompt = bodyTextView.text else { return }\n        Task {\n\
    \            let generatedImage = try await generateAIImage(prompt: prompt)\n\
    \            photoImageView.image = generatedImage\n        }\n    }\n}\n```\n\
    \nThis method makes photoImageView display a progress indicator, gets the content\
    \ of bodyTextView to use as the text prompt for image generation, and calls the\
    \ generateAIImage(prompt:) method. The returned image is assigned to the image\
    \ property of photoImageView."
