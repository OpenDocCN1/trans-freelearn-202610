    \   2. Let’s try the same program, but this time with myRange2. Modify the code\
    \ as follows and run it:\n\n```\nfor number in myRange2 {\n    print(number)\n\
    }\n```\n\nIn this case, the statements inside the loop are executed 10 times,\
    \ and the last value printed in the Debug area is 19."
