    \ You'll do this in the next section.\n\n# Modify the JournalEntry class to be\
    \ JSON-compatible\n\nAt present, all app data is lost when you quit the app. You\
    \ will need to implement a way to save your app data. iOS provides many ways to\
    \ store your app data. One of them is converting the data to JavaScript Object\
    \ Notation (JSON) format and then writing it as a file to your device storage.\
    \ JSON is a way to structure data in a file that can be easily read by both people\
    \ and computers.\n\nTo help you understand the JSON format, look at the sample\
    \ shown here:\n\n```\n[\n  {\n    \"dateString\": \"May 17, 2023\"\n    \"rating\"\
    : 5\n    \"entryTitle\": \"Good\"\n    \"entryBody\": \"Today is a good day\"\n\
