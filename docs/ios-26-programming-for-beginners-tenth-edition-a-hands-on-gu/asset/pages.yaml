- pgno: 68
  md: 'For more information on operators, visit https://docs.swift.org/swift-book/documentation/the-swift-programming-language/basicoperators.


    Let’s look at each operator type in more detail. You’ll start with arithmetic
    operators (addition, subtraction, multiplication, and division) in the next section.


    # Arithmetic operators


    You can perform mathematical operations on integer and floating-point numbers
    by using the standard arithmetic operators shown here:


    | + | Addition |

    | - | Subtraction |

    | * | Multiplication |

    | / | Division |


    Figure 2.14: Arithmetic operators


    Let’s see how these operators are used. Follow these steps:


    +   1. Add the following code to add arithmetic operations to your playground:


    ```

    let sum = 23 + 20

    let result = 32 - sum

    let total = result * 5

    let divide = total / 10

    ```


    +   2. Run the code. The results displayed in the Results area will be 43, -11,
    -55, and -5, respectively. Note that 55 divided by 10 returns 5 instead of 5.5,
    as both numbers are integers.


    +   3. Operators can only work with operands of the same type. Enter the following
    code and run it to see what happens if the operands are of different types:


    ```

    let a = 12

    let b = 12.0

    let c = a + b

    ```'
