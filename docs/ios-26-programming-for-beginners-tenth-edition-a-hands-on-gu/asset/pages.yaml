- pgno: 449
  md: "2. Modify the getPhoto() method as shown:\n\n```\n@IBAction func getPhoto(_\
    \ sender: UITapGestureRecognizer) {\n    let imagePickerController = UIImagePickerController()\n\
    \    imagePickerController.delegate = self\n    #if targetEnvironment(simulator)\n\
    \    imagePickerController.sourceType = .photoLibrary\n    #else\n    imagePickerController.sourceType\
    \ = .camera\n    imagePickerController.showsCameraControls = true\n    #endif\n\
    \    present(imagePickerController, animated: true)\n}\n```\n\nLet’s break this\
    \ down:\n\n```\nlet imagePickerController = UIImagePickerController()\n```\n\n\
    This statement creates an instance of the UIImagePickerController class and assigns\
    \ it to imagePickerController.\n\n```\nimagePickerController.delegate = self\n\
    ```\n\nThis statement sets the image picker controller’s delegate property to\
    \ the AddJournalEntryViewController instance.\n\n```\n#if targetEnvironment(simulator)\n\
    imagePickerController.sourceType = .photoLibrary\n#else\nimagePickerController.sourceType\
    \ = .camera\nimagePickerController.showsCameraControls = true\n#endif\n```\n\n\
    This block of code is known as a conditional compilation block. It starts with\
    \ an #if compilation directive and ends with an #endif compilation directive.\
    \ If you’re running in Simulator, only the statement setting the image picker\
    \ controller’s sourceType property to the photo library is compiled."
  merge: -1
  img_proc: true
- pgno: 450
  md: 'If you’re running on an actual device, the statements setting the image picker
    controller’s sourceType property to the camera and displaying the camera controls
    are compiled. This means that the image picker controller will use the photo library
    when running in Simulator and will use the camera when running on an actual device.


    You can learn more about conditional compilation blocks at this link: https://docs.swift.org/swift-book/documentation/the-swift-programming-language/statements/#Conditional-Compilation-Block.


    ```

    present(imagePickerController, animated: true)

    ```


    This statement presents the image picker controller on the screen.


    You’ve implemented all the code required to present the image picker controller
    when the image view is tapped. In the next section, you’ll implement the UIImagePickerControllerDelegate
    methods that will be called when the user chooses an image or cancels.


    # Implement UIImagePickerControllerDelegate methods


    The UIImagePickerControllerDelegate protocol has a set of methods that you must
    implement in your delegate object to interact with the image picker controller
    interface.


    To learn more about the UIImagePickerControllerDelegate protocol, see https://developer.apple.com/documentation/uikit/uiimagepickercontrollerdelegate.


    When the image picker controller appears on screen, the user has the option of
    selecting a photo or canceling. If the user cancels, the imagePickerControllerDidCancel(_:)
    method is triggered, and if the user selects a photo, the imagePickerController(_:didFinishPickingMediaWithInfo:)
    method is triggered.'
  merge: -1
  img_proc: true
- pgno: 451
  md: "You’ll implement these methods in your AddJournalEntryViewController class\
    \ now. In the Project navigator, click on the AddJournalEntryViewController file.\
    \ Type the following code in the UIImagePickerControllerDelegate extension:\n\n\
    ```\n// MARK: - UIImagePickerControllerDelegate\nfunc imagePickerControllerDidCancel(_\
    \ picker: UIImagePickerController) {\n    dismiss(animated: true)\n}\nfunc imagePickerController(_\
    \ picker: UIImagePickerController, didFinishPickingMediaWithInfo info: [UIImagePickerController.InfoKey\
    \ : Any]) {\n    guard let selectedImage = info[.originalImage] as? UIImage else\
    \ {\n        fatalError(\"Expected a dictionary containing an image, but was provided\
    \ the following: \\(info)\")\n    }\n    let smallerImage = selectedImage.preparingThumbnail(of:\
    \ CGSize(width: 300, height: 300))\n    photoImageView.image = smallerImage\n\
    \    dismiss(animated: true)\n}\n```\n\nThe imagePickerControllerDidCancel(_:)\
    \ method is triggered when the user cancels. The image picker controller is dismissed\
    \ and the user is returned to the Add New Journal Entry screen.\n\nThe imagePickerController(_:didFinishPickingMediaWithInfo:)\
    \ method is triggered when the user selects a photo. This photo is then assigned\
    \ to selectedImage. Next, the selectedImage instance’s preparingThumbnail(of:)\
    \ method will be used to create a smaller image with a width and height of 300\
    \ points, the same as the size of the image view on the Journal Entry Detail screen.\
    \ This image will then be assigned to the photoImageView property and the image\
    \ picker controller will be dismissed.\n\nYou can learn more about the preparingThumbnail(of:)\
    \ method at this link: https://developer.apple.com/documentation/uikit/uiimage/3750835-preparingthumbnail."
  merge: -1
  img_proc: true
