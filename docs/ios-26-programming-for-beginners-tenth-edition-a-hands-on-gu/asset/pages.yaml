    "Shah" : "+60126789345", "Sohini" : "+0223456789", and "Nithya" : "+0229876543".
    You can see this in the Results area.


    Imagine that you must remove a contact from your app. Let’s see how you can remove
    elements from a dictionary in the next section.


    # Remove an element from a dictionary


    To remove an element from a dictionary, assign nil to an existing key. Type in
    and run the following code:


