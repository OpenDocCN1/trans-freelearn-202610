- pgno: 243
  md: '# 13


    # Modify App Screens


    In *Chapter 11, Build the User Interface*, you added some of the screens required
    for your app to match what was shown during the app tour. In *Chapter 12, Complete
    the User Interface*, you added the remaining screens required for your app. You’re
    now able to navigate through all the screens of your app when you run it in Simulator,
    but the screens still lack the user interface elements required for data input
    and data display.


    In this chapter, you’ll add and configure the missing user interface elements
    to the Journal List, Add New Journal Entry, and Journal Entry Detail screens,
    to match the design shown in the app tour.


    For the Journal List screen, you’ll modify the journalCell table view cell by
    adding an image view and two labels to it, so that it can display the photo, date,
    and title of a journal entry. For the Add New Journal Entry screen, you’ll modify
    it by adding a custom view, a switch, a text field, a text view, and an image
    view, so that you can enter the details of a new journal entry. You’ll also configure
    the image view to show a default image. For the Journal Entry Detail screen, you’ll
    add a text view, labels, and image views to it and configure the image views to
    show default images, so that the screen can display the details of an existing
    journal entry. With all the user interface elements in place, your app will be
    ready for code, which you will implement in *Part 3* of this book.


    By the end of this chapter, you will be more proficient in adding and positioning
    user interface elements and will have gained more experience in how to use constraints
    to determine their position relative to one another. This will be useful to ensure
    compatibility with different screen sizes and orientations, enabling you to easily
    prototype the appearance and flow of your apps.'
  merge: -1
  img_proc: true
