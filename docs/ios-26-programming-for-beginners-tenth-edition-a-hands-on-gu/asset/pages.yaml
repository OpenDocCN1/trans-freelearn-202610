- pgno: 165
  md: '# 10


    # Set Up the User Interface


    In *Part 1* of this book, you studied the Swift language and how it works. Now
    that you have a good working knowledge of the language, you can learn how to develop
    an iOS application. In this part, you will build the **user interface (UI)** of
    a journal app, *JRNL*. You will use Xcode’s **Interface Builder** for this, and
    coding will be kept to a minimum.


    You’ll start this chapter by learning useful terms used in iOS app development
    that are used extensively throughout this book. Next, you will take a tour of
    the screens used in the *JRNL* app and learn how a user would use the app. After
    that, you will begin recreating the app’s UI with Interface Builder, starting
    with the tab bar, which allows the user to select between the Journal List and
    Map screens. Finally, you’ll add navigation bars to the top of both screens and
    configure the tab bar buttons.


    By the end of this chapter, you’ll have learned common terms used in iOS app development,
    what the flow of your app will look like, and how to use Interface Builder to
    add and configure UI elements.


    The following topics will be covered in this chapter:


    +   - Useful terms in iOS development

    +   - A tour of the *JRNL* app

    +   - Modifying your Xcode project

    +   - Setting up a tab bar controller scene'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# Technical requirements


    You will modify the JRNL Xcode project that you created in *Chapter 1, Hello,
    Xcode.*


    The resource files and completed Xcode project for this chapter are in the Chapter
    10 folder of the code bundle for this book, which can be downloaded here:


    https://github.com/PacktPublishing/iOS-26-Programming-for-Beginners-10E


    Check out the following video to see the code in action:


    https://youtu.be/pof2hChUGBg


    Before you get started with the project, you’ll learn some common terms used in
    iOS development.


    # Useful terms in iOS development


    As you begin your journey into iOS app development using UIKit, you will encounter
    special terms and definitions. Here are some of the most used terms and definitions.
    Just read through them for now. Even though you may not understand everything
    yet, things will become clearer as you go along:


    +   - **View:** A view is an instance of the `UIView` class or one of its subclasses.
    Anything you see on your screen (buttons, text fields, labels, and so on) is a
    view. You will use views to build your UI.


    > Classes are covered in *Chapter 7, Classes, Structures, and Enumerations.*


    +   - **Stack view:** A stack view is an instance of the `UIStackView` class,
    which is a subclass of `UIView`. It is used to group views together in a horizontal
    or vertical stack. This makes them easier to position on the screen using **Auto
    Layout**, which is discussed later in this section.


    +   - **View controller:** A view controller is an instance of the `UIViewController`
    class. Every view controller has a `view` property, which contains a reference
    to a view. It determines what a view displays to a user and what happens when
    the user interacts with a view.


    > View controllers will be discussed in detail in *Chapter 14, MVC and Table Views.*'
  merge: -1
