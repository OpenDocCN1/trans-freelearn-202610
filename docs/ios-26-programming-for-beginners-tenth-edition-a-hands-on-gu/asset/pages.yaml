    As you can see, cuisine is of type String.


    What if you want to set a specific type for a variable or constant? You’ll see
    how to do that in the next section.


    # Use type annotation to specify a type


    You’ve seen that Xcode tries to automatically determine the data type of a variable
    or constant based on the value provided. However, at times, you may wish to specify
    a type instead of letting Xcode do it for you. To do this, type a colon (:) after
    a constant or variable name, followed by the desired type. This is known as type
    annotation.


    Add the following code to your playground to declare a variable, restaurantRating,
    of type Double, and click the Run button to run it:


    ```

    var restaurantRating: Double = 3

    ```


    Here, you specified that restaurantRating has a specific type, Double. Even though
    you assigned an integer, 3, to restaurantRating, it will be stored as 3.0, a floating-point
    number.


    In the next section, you’ll learn how Xcode helps you reduce the number of errors
    in your program by enforcing type safety.'
