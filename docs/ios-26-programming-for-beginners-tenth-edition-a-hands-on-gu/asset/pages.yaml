- pgno: 564
  md: "The app will display the screen for this view controller when you tap the **Assist**\
    \ tab. The user will then be able to enter a prompt in the text field, tap the\
    \ **Generate** button, and view the generated text in the text view.\n\nYou may\
    \ wish to review *Part 2* of this book, which covers how to create user interfaces\
    \ for your apps using Interface Builder, and try creating this screen on your\
    \ own, using the JRNL project from *Chapter 25, Apple Intelligence*, as a starting\
    \ point.\n\n4. Click the **AssistViewController** file (located in the **Assist\
    \ Screen** folder) in the Project navigator. You should see the following code\
    \ in the Editor area:\n\n```\nimport UIKit\n\nclass AssistViewController: UIViewController\
    \ {\n\n    // MARK: - Properties\n    @IBOutlet var promptTextField: UITextField!\n\
    \    @IBOutlet var resultTextView: UITextView!\n\n    // MARK: - View controller\
    \ lifecycle\n    override func viewDidLoad() {\n        super.viewDidLoad()\n\
    \        promptTextField.delegate = self\n        resultTextView.delegate = self\n\
    \    }\n\n    // MARK: - Actions\n    @IBAction func generateButtonTapped(_ sender:\
    \ UIButton) {\n        resultTextView.text = \"Generating...\"\n        let prompt\
    \ = promptTextField.text ?? \"\"\n        resultTextView.text = \"The generated\
    \ text from this prompt: \\\n        (prompt)\"\n    }\n}\n\nextension AssistViewController:\
    \ UITextFieldDelegate,\nUITextViewDelegate {\n```"
