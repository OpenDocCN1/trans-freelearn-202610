  md: 'Check out the following video to see the code in action:


    https://youtu.be/U52X9c9EAVA


    If you wish to start from scratch, create a new playground and name it RangeOperatorsAndLoops.


    You can type in and run all the code in this chapter as you go along.


    Let’s start by specifying a range of numbers using range operators.


    # Range operators


    Imagine you need to write a program for a department store that automatically
    sends a discount voucher to customers between the ages of 18 and 30. It would
    be very cumbersome if you needed to set up an if or switch statement for each
    age. It’s much more convenient to use a range operator in this case.


    Range operators allow you to represent a range of values. Let’s say you want to
    represent a sequence of numbers starting with firstNumber and ending with lastNumber.
    You don’t need to specify every value; you can just specify the range in this
    way:


    ```

    firstNumber...lastNumber

    ```


    In the department store example, you would specify the customer ages as follows:


    ```

    18...30

    ```


    For more information on range operators, visit https://docs.swift.org/swift-book/documentation/the-swift-programming-language/basicoperators.


    Let’s try this out in the playground. Follow these steps:


    +   1. Add the following code to your playground and run it:


    ```

    let myRange = 10...20

    ```


    This will assign a number sequence that starts with 10 and ends with 20, including
    both numbers, to the myRange constant. This is known as a closed-range operator.
    The start and end values for myRange will be displayed in the Results area:'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'Figure 4.1: Results area displaying the start and end values for the range


    Remember, you can drag the border between the Results and Editor areas to change
    the size of the Results area.


    +   2. Replace the ... with ..< if you don’t want to include the last number of
    the sequence in the range. Type in and run the following statement on the next
    line:


    ```

    let myRange2 = 10..<20

    ```


    This will store the sequence starting with 10 and ending with 19 in the myRange2
    constant, and it is known as a half-open range operator.


    There is one more type of range operator, the one-sided range operator, which
    you will learn about in the next chapter.


    Now that you know how to create and use ranges, you will learn about loops, the
    different loop types, and how to use them in the next section.


    # Loops


    In programming, you frequently need to do the same thing repeatedly. For example,
    each month, a company will need to generate payroll slips for each employee. If
    the company has 10,000 employees, it would be inefficient to write 10,000 instructions
    to create payroll slips. Repeating a single instruction 10,000 times would be
    better, and loops are used for this.


    There are three loop types: the for-in loop, the while loop, and the repeat-while
    loop. The for-in loop will repeat a known number of times, and the while and repeat-while
    loops will repeat if the loop condition is true.'
  merge: -1
  img_proc: true
- pgno: 90
  md: "> For more information on loops, visit https://docs.swift.org/swift-book/documentation/the-swift-programming-language/controlflow.\n\
    \nLet’s look at each type in turn.\n\n# for-In loops\n\nThe for-in loop steps\
    \ through every value in a sequence, and a set of statements in curly braces,\
    \ known as the loop body, is executed each time. Each value is assigned to a temporary\
    \ variable in turn, and the temporary variable can be used within the loop body.\
    \ This is what it looks like:\n\n```\nfor item in sequence {\n    code\n}\n```\n\
    \nThe number of times the loop repeats is dictated by the number of items in the\
    \ sequence. Let’s begin by creating a for-in loop to display all the numbers in\
    \ myRange. Follow these steps:\n\n+   1. Add the following code to your playground\
    \ and run it:\n\n```\nfor number in myRange {\n    print(number)\n}\n```\n\nHere,\
    \ the statement inside the loop is executed 11 times since myRange includes the\
    \ last number in the range. You should see each number in the sequence displayed\
