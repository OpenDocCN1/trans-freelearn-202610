- pgno: 518
  md: '# Technical requirements


    You will continue working on the JRNL project that you modified in *Chapter 23,
    Adopt Liquid Glass.*


    The resource files and completed Xcode project for this chapter are in the Chapter
    24 folder of the code bundle for this book, which can be downloaded here:


    https://github.com/PacktPublishing/iOS-26-Programming-for-Beginners-10E


    Check out the following video to see the code in action:


    https://youtu.be/sShKNjo2jRs


    Let’s start by learning about Icon Composer in the next section.


    # About Icon Composer


    Introduced during WWDC 2025, Icon Composer is used to create a single file representation
    of your app icon. This file includes all icon and widget style appearances and
    sizes for all Apple platforms. To create initial icon artwork, you can use your
    favorite design tool, such as Photoshop or Canva. You will then export one or
    more layers of your artwork and import them into Icon Composer. In Icon Composer,
    you can organize and stylize the artwork, taking full advantage of the dynamic
    properties of Liquid Glass. Finally, you will add the icon to your project.


    To learn more about how to use Icon Composer, watch this video:

    https://developer.apple.com/videos/play/wwdc2025/361/


    Icon Composer documentation is available at this link:

    https://developer.apple.com/documentation/Xcode/creating-your-app-icon-using-icon-composer


    ![](img/0972ba626734a3986e095c788777818e_518_0.png)


    Let’s see how to generate individual layers of an icon in the next section.


    # Creating images for each icon layer


    A typical way to create icons would be to use an app such as Adobe Photoshop or
    Canva. With that said, any app that can generate individual layers of an icon
    as separate files may be used. You will use Keynote, free for Apple Macs, to open
    a presentation containing a sample icon design and export it into individual layers
    for use in Icon Composer.'
  merge: -1
  img_proc: true
