- pgno: 20
  md: 'To complete all the exercises in this book, you will need the following:


    +   - A Mac computer running macOS 15.0 Sequoia, macOS 26 Tahoe, or later

    +   - Xcode 26.0 or later


    To check whether your Mac supports macOS Tahoe 26, use this link: https://www.apple.com/my/os/macos/.
    If your Mac is supported, you can update macOS using **Software Update** in **System
    Settings**.


    To get the latest version of Xcode, you can download it from the Apple App Store.
    Most of the exercises can be completed without an Apple Developer account and
    use the iOS Simulator. If you wish to test the app you are developing on an actual
    iOS device, you will need a free or paid Apple Developer account.


    The following chapter requires a paid Apple Developer account: *Chapter 27, Test
    and Submit Your App to the App Store*. Instructions on how to get a paid Apple
    Developer account are included.


    # Download the example code files


    You can download the example code files for this book from GitHub at https://github.com/PacktPublishing/iOS-26-Programming-for-Beginners-10E.
    If there’s an update to the code, it will be updated in the GitHub repository.


    We also have other code bundles from our rich catalog of books and videos available
    at https://github.com/PacktPublishing/. Check them out!


    # Code in Action


    Visit the following link to check out videos of the code being run:


    https://www.youtube.com/playlist?list=PLeLCvrwLe1849hPVsrGC2DkOaPZUlVZAT


    # Download the color images


    We also provide a PDF file that has color images of the screenshots/diagrams used
    in this book. You can download it here: https://packt.link/gbp/9781806023936.


    # Conventions used


    There are several text conventions used throughout this book.'
  merge: -1
