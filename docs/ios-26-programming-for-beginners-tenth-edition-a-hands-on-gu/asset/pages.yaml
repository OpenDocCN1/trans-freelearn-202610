- pgno: 45
  md: '6. Turn the Developer Mode switch on:


    ![](img/0972ba626734a3986e095c788777818e_45_0.png)


    Figure 1.19: Developer Mode switch


    7. An alert will appear to warn you that Developer Mode reduces the security of
    your iOS device. Tap Restart.


    8. After your iOS device restarts and you unlock it, confirm that you want to
    enable Developer Mode by tapping Enable and entering your iOS device’s passcode.


    9. The Devices and Simulators window will display a Preparing iPhone message.
    Wait a few minutes, then verify that the Devices and Simulators window no longer
    displays the Developer Mode disabled text:


    ![](img/0972ba626734a3986e095c788777818e_45_1.png)


    Figure 1.20: Xcode Devices and Simulators window showing Preparing iPhone message


    Your iOS device is now ready to install and run apps from Xcode.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '+   10. In Xcode, choose your iOS device from the Destination menu.


    +   11. Run the project by clicking the Run button (or use Command + R). You will
    get the following error in Xcode’s Signing & Capabilities panel: Signing for “JRNL”
    requires a development team:


    Figure 1.21: Xcode Signing & Capabilities panel


    This is because a digital certificate is required to run the app on an iOS device,
    and you need to add a free or paid Apple developer account to Xcode so the digital
    certificate can be generated.'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'Using an Apple account to create a free developer account will allow you to
    test your app on an iOS device, but it will only be valid for 7 days. Also, you
    will need a paid Apple developer account to distribute apps on the App Store.
    You''ll learn more about this in Chapter 27, Test and Submit Your App to the App
    Store.


    Certificates ensure that the only apps that run on your device are the ones you
    authorize. This helps to protect against malware. You can also learn more about
    them at this link: https://help.apple.com/xcode/mac/current/#/dev60b6fbbc7.


    +   12. Click Add Account...:


