  md: '# Adding the icon to your project


    You have already created the icon for your project at this point. Next, you will
    use Xcode to import your icon and Simulator to preview how it looks in various
    modes. Follow these steps:


    +   1. Open the JRNL project you modified in the previous chapter, Chapter 23,
    Adopt Liquid Glass.


    +   2. Drag the Icon Composer file to the Project navigator of your project.


    ![](img/0972ba626734a3986e095c788777818e_528_0.png)


    Figure 24.14: Xcode project showing drag destination for Icon Composer file


    3. In the Choose options for adding these files window, configure it as shown
    in the screen-shot and click Finish:


    ![](img/0972ba626734a3986e095c788777818e_528_1.png)


    Figure 24.15: Choose options for adding these files window'
