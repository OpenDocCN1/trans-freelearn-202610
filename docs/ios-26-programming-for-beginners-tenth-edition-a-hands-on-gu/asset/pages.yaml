- pgno: 574
  md: '# Technical requirements


    You will need an Apple Account and a paid Apple Developer account to complete
    this chapter.


    There are no project files for this chapter, as it should be used as a reference
    on how to submit apps and is not specific to any particular app.


    To see the latest updates to the App Store, visit https://developer.apple.com/app-store/whats-new/.


    To see what’s new in App Store Connect, watch this video:

    https://developer.apple.com/videos/play/wwdc2025/328/.


    Let’s start by learning how to get a paid Apple Developer account, which is required
    for App Store submission, in the next section.


    # Get an Apple Developer account


    As you saw in earlier chapters, all you need to test your app on a device is a
    free Apple Account. However, the apps will only work for a few days, and you will
    not be able to add advanced features, such as signing in with Apple or uploading
    your app to the App Store. For that, you need a paid Apple Developer account.
    Follow these steps to purchase an individual/sole proprietorship Apple Developer
    account:


    +   1. Go to https://developer.apple.com/programs/ and click on the Enroll button.

    +   2. Click Start your enrollment.

    +   3. Enter your Apple Account and password when prompted.

    +   4. On the Trust this browser? screen, click Trust only if you are the only
    person using this browser; otherwise, click Not Now. This is to safeguard your
    account information.

    +   5. Click Continue enrollment on the web >.

    +   6. On the Confirm your personal information screen, enter your personal information
    and click Continue.

    +   7. On the Select your entity type screen, choose Individual/Sole Proprietor.
    Click Continue.

    +   8. On the Review and Accept screen, check the checkbox at the bottom of the
    page and click Continue.

    +   9. On the Complete your purchase screen, click Purchase.'
  merge: -1
  img_proc: true
- pgno: 575
  md: '10. Follow the onscreen directions to complete your purchase. Once you have
    purchased your account, go to https://developer.apple.com/account/ and sign in
    with the same Apple Account that you used to purchase your Developer account.
    You should see something like the following:


    ![](img/0972ba626734a3986e095c788777818e_575_0.png)


    Figure 27.1: Apple Developer website with a paid Apple Developer account logged
    in


    Now that you have a paid Apple Developer account, let’s learn how to configure
    the various settings required for your app in the next section.


    # About your Apple Developer account


    Your Apple Developer account has everything you need to develop and submit apps.
    You can view your membership status, add and organize members of your development
    team, access developer documentation, download beta software, and more. All these
    features are beyond the scope of this book, though, and this section will only
    cover what you need to do to get your app on the App Store.'
