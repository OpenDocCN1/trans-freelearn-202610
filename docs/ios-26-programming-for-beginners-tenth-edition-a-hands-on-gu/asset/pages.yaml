  md: '6. Choose **Toggle Appearance** from the **Features** menu in Simulator’s menu
    bar. Simulator will switch to Dark mode, and the **JRNL** icon will also change
    to the dark variant automatically:


    ![](img/0972ba626734a3986e095c788777818e_530_0.png)


    Figure 24.18: Simulator in Dark mode showing the changed JRNL app icon


    You have created an icon using Icon Composer and successfully added it to your
    JRNL project! Awesome!


    # Summary


    In this chapter, you learned how to build an icon for the JRNL app using Icon
    Composer.


    You started by using Keynote to generate PNG files with a transparent background
    for each layer of the icon. Next, you added the PNG files to Icon Composer and
    adjusted the properties for each layer. Finally, you added it to your project
    and tested it in Simulator to see how it looks.


    You now know how to use Icon Composer to create icons for your own apps.


    In this brief introduction to SwiftUI, you’ve seen how to build a simplified version
    of the JRNL app using SwiftUI.


    In the next chapter, you will learn about **Apple Intelligence** and how it can
    be used to generate code and add some cool features to your app.'
