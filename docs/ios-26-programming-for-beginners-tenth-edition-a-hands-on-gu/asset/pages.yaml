  md: '# 5


    # Collection Types


    You’ve learned quite a lot at this point! You can now create a program that stores
    data in constants or variables and performs operations on them, and you can control
    the flow using conditionals and loops. But so far, you’ve mostly been storing
    single values.


    In this chapter, you will learn ways to store collections of values. Swift has
    three collection types: **arrays**, which store an ordered list of values; **dictionaries**,
    which store an unordered list of key-value pairs; and **sets**, which store an
    unordered list of values.


    By the end of this chapter, you’ll have learned how to create arrays, dictionaries,
    and sets, and how to perform operations on them.


    The following topics will be covered in this chapter:


    +   - Arrays

    +   - Dictionaries

    +   - Sets


    # Technical requirements


    The Xcode playground for this chapter can be found in the Chapter05 folder of
    the code bundle for this book, which can be downloaded from here:


    https://github.com/PacktPublishing/iOS-26-Programming-for-Beginners-10E


    Check out the following video to see the code in action:


    https://youtu.be/hLACW615fzs'
