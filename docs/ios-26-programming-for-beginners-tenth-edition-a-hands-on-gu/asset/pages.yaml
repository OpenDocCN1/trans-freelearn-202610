- pgno: 108
  md: '# Setting operations


    It’s easy to perform set operations such as **union**, **intersection**, **subtraction**,
    and **symmetric difference**. Type in and run the following code:


    ```

    let movieGenres2: Set = ["Science Fiction", "War", "Fantasy"]

    movieGenres.union(movieGenres2)

    movieGenres.intersection(movieGenres2)

    movieGenres.subtracting(movieGenres2)

    movieGenres.symmetricDifference(movieGenres2)

    ```


    Here, you are performing set operations on two sets, movieGenres and movieGenres2.
    Let’s see the results of each set operation:


    +   - union(_:) returns a new set containing all the values in both sets, so **"Horror"**,
    **"Romantic Comedy"**, **"War"**, **"Science Fiction"**, and **"Fantasy"** will
    be displayed in the Results area

    +   - intersection(_:) returns a new set containing only the values common to
    both sets, so **"War"** will be displayed in the Results area

    +   - subtracting(_:) returns a new set without the values in the specified set,
    so **"Horror"** and **"Romantic Comedy"** will be displayed in the Results area

    +   - symmetricDifference(_:) returns a new set without the values common to both
    sets, so **"Horror"**, **"Romantic Comedy"**, **"Science Fiction"**, and **"Fantasy"**
    will be displayed in the Results area


    Imagine that you want your app to compare the genres you like to the genres that
    another person likes. In the next section, you’ll learn how to check whether a
    set is equal to another set, is part of another set, or has nothing in common
    with another set.


    # Set membership and equality


    It’s easy to check whether a set is equal to a **subset**, a **superset**, or
    a **disjoint** of another set. Type in and run the following code:


    ```

    let movieGenresSubset: Set = ["Horror", "Romantic Comedy"]

    let movieGenresSuperset: Set = ["Horror", "Romantic Comedy", "War", "Science Fiction",
    "Fantasy"]

    let movieGenresDisjoint: Set = ["Bollywood"]

    movieGenres == movieGenres2

    movieGenresSubset.isSubset(of: movieGenres)

    ```'
