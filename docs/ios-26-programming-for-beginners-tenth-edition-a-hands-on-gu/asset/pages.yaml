- pgno: 116
  md: "```\nfunc pi() -> (() -> Double) {\n    approximateValueOfPi1\n    // approximateValueOfPi2\n\
    }\npi()()\n```\n\nBoth approximateValueOfPi1() and approximateValueOfPi2() are\
    \ functions that have no parameters and return the approximate value of pi. The\
    \ pi() function’s return type is a function that has no parameters and returns\
    \ Double. This means that it can either return approximateValueOfPi1 (as shown\
    \ here) or approximateValueOfPi2, since both functions match the expected return\
    \ type.\n\npi()() calls the approximateValueOfPi1 function, which returns 3.14159.\
    \ 3.14159 is displayed in the Results area.\n\nLet’s see how a function can be\
    \ used as a parameter for another function in the next section.\n\n# Use functions\
    \ as parameters\n\nA function can take another function as a parameter. Type in\
    \ and run the following code to create a function that determines whether a number\
    \ meeting a certain condition exists within a list of numbers:\n\n```\nfunc isThereAMatch(listOfNumbers:\
    \ [Int], condition: (Int) -> Bool) -> Bool\n{\n    for number in listOfNumbers\
    \ {\n        if condition(number) {\n            return true\n        }\n    }\n\
    \    return false\n}\nfunc numberIsOdd(number: Int) -> Bool {\n    (number % 2)\
    \ > 0\n}\nfunc numberIsEven(number: Int) -> Bool {\n    (number % 2) == 0\n}\n\
    let numbersList = [1, 3, 5, 7]\nisThereAMatch(listOfNumbers: numbersList, condition:\
    \ numberIsOdd)\n```"
