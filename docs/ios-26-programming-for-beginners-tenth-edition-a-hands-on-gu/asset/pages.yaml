  md: '# Contributors


    # About the author


    Ahmad Sahar is a trainer, presenter, and consultant at Tomafuw Productions. He
    is an Apple Certified Trainer for app development in Swift, and he has conducted
    training courses for over 10 years on iOS mobile application development, Flutter
    mobile application development, and how to use Apple software and hardware. He
    also currently holds App Development with Swift Associate and Certified User certifications.


    He is a member of the DevCon iOS online community in Malaysia and has conducted
    presentations and talks for this group. In his spare time, he likes building and
    programming LEGO MINDSTORMS® robots.


    To my mother, Sharifah; my father, Sahar; my two sisters, Ainol Shareha and Ainol
    Shaharina; and my beloved wife, Oni – thank you for your love and support.'
