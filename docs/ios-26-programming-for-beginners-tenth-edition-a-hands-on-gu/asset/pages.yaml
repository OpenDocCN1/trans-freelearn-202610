- pgno: 75
  md: '# 3


    # Conditionals and Optionals


    In the previous chapter, you looked at data types, constants, variables, and operations.
    At this point, you can write simple programs that process letters and numbers.
    However, programs don’t always proceed in sequence. You will frequently need to
    execute different instructions based on a condition. Swift allows you to do this
    by using **conditionals**, and you will learn how to use them in this chapter.


    Another thing you may have noticed is that, in the last chapter, each variable
    or constant was immediately assigned a value. What if you require a variable where
    the value may not be present initially? You will need a way to create a variable
    that may or may not have a value. Swift allows you to do this by using **optionals**,
    and you will also learn about them in this chapter.


    By the end of this chapter, you should be able to write programs that do different
    things based on a condition and handle variables that may or may not have a value.


    The following topics will be covered:


    +   - Conditionals

    +   - Optionals and optional binding


    > Please spend some time understanding optionals. They can be daunting for the
    novice programmer, but as you will see, they are an important part of iOS development.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# Technical requirements


    The Xcode playground for this chapter is in the Chapter03 folder of the code bundle
    for this book, which can be downloaded here:


    https://github.com/PacktPublishing/iOS-26-Programming-for-Beginners-10E


    Check out the following video to see the code in action:


    https://youtu.be/0NqHr2gakJQ


    Create a new playground and name it ConditionalsAndOptionals. You can type in
    and run all the code in this chapter as you go along. You''ll start by learning
    about conditionals.


    # Conditionals


    At times, you''ll want to execute different code blocks based on a specific condition,
    such as in the following scenarios:


    +   - Choosing between different room types at a hotel. The price for bigger rooms
    would be higher.

    +   - Switching between different payment methods at an online store. Different
    payment methods would have different procedures.

    +   - Deciding what to order at a fast-food restaurant. Preparation procedures
    for each food item would be different.


    To do this, you would use conditionals. In Swift, this is implemented using the
    if statement (for a single condition) and the switch statement (for multiple conditions).


    > For more information on conditionals, visit https://docs.swift.org/swift-book/documentation/the-swift-programming-language/controlflow.


    Let''s see how if statements are used to execute different tasks depending on
    a condition in the next section.'
