    values correspond to the values assigned to those properties.


    To learn more about using JSON with Swift types, see https://developer.apple.com/documentation/foundation/archives_and_serialization/using_json_with_custom_types.


    To learn more about parsing JSON files, watch the video available here: https://devstreaming-cdn.apple.com/videos/wwdc/2017/212vz78e2gz12/212/212_hd_whats_new_in_foundation.mp4.


    A custom Swift type needs to conform to the Codable protocol before it can be
    converted to and from JSON.


    To learn more about Codable, see https://developer.apple.com/documentation/swift/codable.


    JSON supports dates, strings, numbers, Boolean values, and null values, but it
    does not support images. To conform to the Codable protocol, you will modify the
