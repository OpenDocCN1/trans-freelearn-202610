  md: "Let’s walk through the code. Initially, x is set to 0. The x < 50 condition\
    \ is checked and returns true, so the loop body is executed. The value of x is\
    \ incremented by 5, and x is 5 is printed in the Debug area. The loop repeats,\
    \ and x < 50 is checked again. Since x is now 5 and 5 < 50 still returns true,\
    \ the loop body is executed again. This is repeated until the value of x is 50,\
    \ at which point x < 50 returns false and the loop stops.\n\nIf the while loop’s\
    \ condition is false to begin with, the loop body will never be executed. Try\
    \ changing the value of x to 100 to see this.\n\nIn the next section, you’ll study\
    \ repeat-while loops. These will execute the statements in the loop body first\
    \ before checking the loop condition.\n\n# repeat-while loops\n\nLike a while\
    \ loop, a repeat-while loop also contains a condition and a loop body, but the\
    \ loop body is executed first before the condition is checked. If the condition\
    \ is true, the loop repeats until the condition returns false. Here is an example\
    \ of what a repeat-while loop looks like:\n\n```\nrepeat {\n    code\n} while\
    \ condition == true\n```\n\nTo see a repeat-while loop in action, add the following\
    \ code after all other code in the playground and run it:\n\n```\nvar y = 0\n\
    repeat {\n    y += 5\n    print(\"y is \\(y)\")\n} while y < 50\n```\n\nLet’s\
    \ walk through the code. Initially, y is set to 0. The loop body is executed.\
    \ The value of y is incremented by 5, so now y contains 5, and y is 5 is printed\
    \ to the Debug area. The y < 50 condition is checked, and since it returns true,\
    \ the loop is repeated. The value of y is incremented by 5, so now y contains\
    \ 10, and y is 10 is printed to the Debug area. The loop is repeated until y contains\
    \ 50, at which point x < 50 returns false and the loop stops.\n\nThe loop body\
    \ will be executed at least once, even if the condition is false to begin with.\
    \ Try changing the value of y to 100 to see this.\n\nYou now know how to create\
    \ and use different loop types. Awesome!"
