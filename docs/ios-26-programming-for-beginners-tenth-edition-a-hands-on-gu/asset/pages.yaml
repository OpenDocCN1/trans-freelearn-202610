    \ and the text in the text field is assigned to prompt. The text in the text view\
    \ then displays \"The generated text from this prompt:\" followed by the contents\
    \ of prompt.\n\nBuild and run the app on your Mac. Tap the Assist tab to display\
    \ the Assist screen. Enter some text in the text field and tap the Generate button.\
    \ The text view will then display The generated text from this prompt: followed\
    \ by the text you entered previously in the text field, as shown:\n\n![](img/0972ba626734a3986e095c788777818e_565_0.png)\n\
    \nFigure 26.2: App running on your Mac with the Assist tab displayed"
