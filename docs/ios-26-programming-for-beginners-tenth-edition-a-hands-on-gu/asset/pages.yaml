    # Model objects


    As you learned in *Chapter 14, MVC and Table Views*, a common design pattern for
    iOS apps is MVC. To recap, MVC divides an app into three different parts:


    +   - **Model:** This handles data storage, representation, and data processing
    tasks

    +   - **View:** This is anything that is on the screen that the user can interact
    with

    +   - **Controller:** This manages the flow of information between the model and
    the view


