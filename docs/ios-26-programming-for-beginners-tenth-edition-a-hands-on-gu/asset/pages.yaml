- pgno: 497
  md: "9. As you are now using a collection view, tableView(_:commit:forRowAt:) can\
    \ no longer be used to remove cells. Replace the tableView(_:commit:forRowAt:)\
    \ method with the following method:\n\n```\n// MARK: - UICollectionView delete\
    \ method\nfunc collectionView(_ collectionView: UICollectionView,\ncontextMenuConfigurationForItemsAt\
    \ indexPaths: [IndexPath], point: CGPoint) -> UIContextMenuConfiguration? {\n\
    \    guard let indexPath = indexPaths.first else {\n        return nil\n    }\n\
    \    let config = UIContextMenuConfiguration(previewProvider: nil) { elements\
    \ -> UIMenu? in\n        let delete = UIAction(title: \"Delete\") {\n        \
    \    action in\n            if self.search.isActive {\n                let selectedJournalEntry\
    \ =\n                self.filteredTableData[indexPath.item]\n                self.filteredTableData.remove(at:\
    \ indexPath.item)\n                SharedData.shared\n                .removeSelectedJournalEntry(selectedJournalEntry)\n\
    \            } else {\n                SharedData.shared.removeJournalEntry(at:\n\
    \                indexPath.item)\n            }\n            collectionView.reloadData()\n\
    \        }\n        return UIMenu(children: [delete])\n    }\n    return config\n\
    }\n```\n\nInstead of swiping left to delete, this method implements a contextual\
    \ menu with a single option, Delete, that appears when you tap and hold on a collection\
    \ view cell."
  merge: -1
