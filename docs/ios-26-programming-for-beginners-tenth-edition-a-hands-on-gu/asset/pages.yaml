- pgno: 77
  md: "# if statements\n\nAn if statement executes a block of code if a condition\
    \ returns true, and optionally, another block of code if the condition returns\
    \ false. It looks like this:\n\n```\nif condition {\n    code1\n} else {\n   \
    \ code2\n}\n```\n\nLet’s implement an if statement now to see this in action.\
    \ Imagine that you’re programming an app for a restaurant. The app would allow\
    \ you to check if a restaurant is open, search for a restaurant, and check to\
    \ see if a customer is over the minimum drinking age. Follow these steps:\n\n\
    +   1. To check if a restaurant is open, add the following code to your playground.\
    \ Run it to create a constant and execute a statement if the constant’s value\
    \ is true:\n\n```\nlet isRestaurantOpen = true\nif isRestaurantOpen {\n    print(\"\
    Restaurant is open.\")\n}\n```\n\nFirst, you created a constant, isRestaurantOpen,\
    \ and assigned true to it. Next, you have an if statement that checks if the value\
    \ stored in isRestaurantOpen is equal to true. Since the value is equal to true,\
    \ the print() statement is executed and Restaurant is open is printed in the Debug\
    \ area.\n\n+   2. Try changing the value of isRestaurantOpen to false and running\
    \ your code again. As the condition now returns false, nothing will be printed\
    \ in the Debug area.\n\n+   3. You can also execute statements if a value is false.\
    \ Let’s say the customer has searched for a particular restaurant that is not\
    \ in the app’s database, so the app should display a message saying that the restaurant\
    \ was not found. Type in the following code to create a constant and execute a\
    \ statement if the constant’s value is false:\n\n```\nlet isRestaurantFound =\
    \ false\nif isRestaurantFound == false {\n    print(\"Restaurant was not found\"\
    )\n}\n```"
