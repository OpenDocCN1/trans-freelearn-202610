- pgno: 128
  md: "```\nlet cat = Animal(name: \"Cat\", sound: \"Mew\", numberOfLegs: 4, breathesOxygen:\
    \ true)\nprint(cat.name)\n```\n\nThe results are the same as those in Step 2,\
    \ but you created the instance and set its properties in a single instruction.\
    \ Excellent!\n\nNow there are different types of animals, such as mammals, birds,\
    \ reptiles, and fish. You could create a class for each type, but you could also\
    \ create a subclass based on an existing class. Let’s see how to do that in the\
    \ next section.\n\n# Make a subclass\n\nA subclass of a class inherits all the\
    \ methods and properties of an existing class. You can also add additional properties\
    \ and methods to it if you wish. For instance, for an IT company, you could have\
    \ CustomerSupportAgent as a subclass of Employee. This class would have all the\
    \ properties of the Employee class, as well as additional properties required\
    \ for the customer support role.\n\nYou’ll now create Mammal, a subclass of the\
    \ Animal class. Follow these steps:\n\n+   1. To declare the Mammal class, type\
    \ in the following code after the Animal class declaration:\n\n```\nclass Mammal:\
    \ Animal {\n    let hasFurOrHair: Bool = true\n}\n```\n\nTyping : Animal after\
    \ the class name makes the Mammal class a subclass of the Animal class. It has\
    \ all the properties and methods declared in the Animal class, and one additional\
    \ property: hasFurOrHair. Since the Animal class is the parent of the Mammal class,\
    \ you can refer to it as the superclass of the Mammal class.\n\n+   2. Modify\
    \ your code that creates an instance of your class, as shown, and run it:\n\n\
    ```\nlet cat = Mammal(name: \"Cat\", sound: \"Mew\", numberOfLegs: 4, breathesOxygen:\
    \ true)\n```\n\ncat is now an instance of the Mammal class instead of the Animal\
    \ class. As you can see, the results displayed in the Debug area are the same\
    \ as before, and there are no errors. The value for hasFurOrHair has not been\
