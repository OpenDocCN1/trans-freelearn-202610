- pgno: 510
  md: 'Check out the following video to see the code in action:


    https://youtu.be/jkd0y2NbBbM


    Let’s start by learning more about the new design system and Liquid Glass in the
    next section.


    # Meet Liquid Glass


    Apple’s new Liquid Glass material combines the optical properties of glass with
    a sense of fluidity. Controls and navigation elements are placed on a distinct
    functional layer, and the user experience is modified to bring focus to content.


    To gain an overview of the new design system, watch this video: https://developer.apple.com/videos/play/wwdc2025/219/


    To learn about best practices of the new design system, watch this video: https://developer.apple.com/videos/play/wwdc2025/356/


    The user interface for apps that are recompiled using the latest SDK is automatically
    updated. However, you may need to make changes to your apps to fully embrace the
    new design.


    To learn how to update your app to the new design, watch this video: https://developer.apple.com/videos/play/wwdc2025/284/


    Throughout this book, you have been using the standard user interface elements
    to build your app, except for the RatingView element that you built in Chapter
    19, Custom Views. As a result, the JRNL app automatically adopts the new design
    incorporating Liquid Glass when you build and run it using Xcode 26. With that
    said, there are a few adjustments that you can still make to your app, and you
    will learn how to do this in the next section.


    # Modify your app


    When you build and run the JRNL app using Xcode 26, you can see that it has automatically
    adopted Apple’s new design, incorporating Liquid Glass. There are still a few
    modifications you can make to fully embrace the new look and feel, which are as
    follows:


    +   - Automatically minimize the tab bar on scroll down

    +   - Add a subtitle showing the number of journal entries on the Journal List
    screen

    +   - Add a Liquid Glass effect to the star buttons in RatingView'
