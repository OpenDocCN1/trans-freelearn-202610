  img_proc: true
- pgno: 114
  md: "# Use custom argument labels\n\nNote that the serviceCharge(mealCost:) function\
    \ is not very English-like. You can add a custom label to the parameter to make\
    \ the function easier to understand.\n\nModify your code as shown:\n\n```\nfunc\
    \ serviceCharge(forMealPrice mealCost: Int) -> Int {\n    mealCost / 10\n}\nlet\
    \ serviceChargeAmount = serviceCharge(forMealPrice: 50)\nprint(serviceChargeAmount)\n\
    ```\n\nThe function works the same as before, but to call it, you use serviceCharge(forMealPrice:).\
    \ This sounds more like English and makes it easier to figure out what the function\
    \ does. Also, note that if your function body only consists of a single statement,\
    \ the return keyword is optional.\n\nIn the next section, you'll learn how to\
    \ use several smaller functions within the bodies of other functions, and these\
    \ are known as nested functions.\n\n# Use nested functions\n\nIt's possible to\
    \ have a function within the body of another function, and these are called nested\
    \ functions. This allows you to keep several related functions together in one\
    \ place and makes the enclosing function easier to understand.\n\nA nested function\
    \ can use the variables of the enclosing function. Let's see how nested functions\
    \ work by writing a function to calculate monthly payments for a loan.\n\nType\
    \ in and run the following code:\n\n```\nfunc calculateMonthlyPayments(carPrice:\
    \ Double, downPayment: Double, interestRate: Double, paymentTerm: Double) -> Double\
    \ {\n    func loanAmount() -> Double {\n        carPrice - downPayment\n    }\n\
    \    func totalInterest() -> Double {\n        interestRate * paymentTerm\n  \
    \  }\n    func numberOfMonths() -> Double {\n        paymentTerm * 12\n    }\n\
    }\n```"
  merge: -1
  img_proc: true
- pgno: 115
  md: "```\nreturn ((loanAmount() + (loanAmount() *\n    totalInterest() / 100 ))\
    \ / numberOfMonths())\n}\ncalculateMonthlyPayments(carPrice: 50000, downPayment:\
    \ 5000, interestRate: 3.5, paymentTerm: 7.0)\n```\n\nHere, there are three functions\
    \ within calculateMonthlyPayments(carPrice:downPayment:interestRate:paymentTerm:).\
    \ Let’s look at them:\n\n+   - The first nested function, loanAmount(), calculates\
    \ the total loan amount by subtracting downPayment from carPrice. It returns 50000\
    \ - 5000 = 45000.\n+   - The second nested function, totalInterest(), calculates\
    \ the total interest amount incurred for the payment term by multiplying interestRate\
    \ by paymentTerm. It returns 3.5 * 7 = 24.5.\n+   - The third nested function,\
    \ numberOfMonths(), calculates the total number of months in the payment term\
    \ by multiplying paymentTerm by 12. It returns 7 * 12 = 84.\n\nNote that the three\
    \ nested functions all use the variables of the enclosing function. The value\
    \ returned is ( 45000 + ( 45000 * 24.5 / 100 ) ) / 84 = 666.96, which is the amount\
    \ you must pay monthly for seven years to buy this car.\n\nAs you have seen, functions\
    \ in Swift are like functions in other languages, but they have a cool feature.\
    \ Functions are first-class types in Swift, so they can be used as parameters\
    \ and return types. Let’s see how that is done in the next section.\n\n# Use functions\
    \ as return types\n\nA function can return another function as its return type.\
    \ Type in and run the following code to create a function that generates the value\
    \ of pi using one of two possible ways:\n\n```\nfunc approximateValueOfPi1() ->\
    \ Double {\n    3.14159\n}\nfunc approximateValueOfPi2() -> Double {\n    22.0\
    \ / 7.0\n}\n```"
