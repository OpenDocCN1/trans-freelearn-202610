  md: 'Tapping on a row displays the Journal Entry Detail screen, but this screen
    does not display any data from the selected journal entry yet. You will address
    this in the next chapter.


    Congratulations! At this point, the Journal List screen displays text and images
    from the journalEntries array. However, you can’t add or remove journal entries
    from the journalEntries array yet. You will learn how to do this in the next chapter.


    # Summary


    In this chapter, you implemented the model objects for the Journal List screen
    to make it display a list of journal entries. You learned about the model objects
    that you will use, created a Swift class that can be used to store journal entry
    instances, and created a static method returning sample journal entries. You then
    created a custom instance of UITableViewCell for your table view and used the
    method returning sample journal entries to populate an array. This array is then
    used as the data source for the table view in the Journal List screen.


    You now know how to create model objects, how to create sample data, and how to
    configure view controllers to populate table views using that sample data. This
    will be useful should you wish to create your own apps that use table views.


    In the next chapter, you’ll learn how to add and remove journal entries from the
    Journal List screen. You’ll also learn how to pass data between view controllers.


