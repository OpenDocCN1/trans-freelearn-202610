  md: '# 6


    # Functions and Closures


    At this point, you can write reasonably complex programs that can make decisions
    and repeat instruction sequences. You can also store data for your programs using
    collection types. As the programs you write grow in size and complexity, it will
    become harder to comprehend what they are doing.


    To make large programs easier to understand, Swift allows you to create **functions**,
    which let you combine several instructions and execute them by calling a single
    name. You can also create **closures**, which let you combine several instructions
    without a name and assign them to a constant or variable.


    By the end of this chapter, you''ll have learned about functions, nested functions,
    functions as return types, functions as arguments, and the guard statement. You''ll
    also have learned how to create and use closures.


    The following topics will be covered in this chapter:


    +   - Functions

    +   - Closures


    # Technical requirements


    The Xcode playground for this chapter is in the Chapter06 folder of the code bundle
    for this book, which can be downloaded here:


    https://github.com/PacktPublishing/iOS-26-Programming-for-Beginners-10E'
