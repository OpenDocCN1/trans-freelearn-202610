- pgno: 533
  md: '# 25


    # Apple Intelligence


    During Apple’s Worldwide Developers Conference in 2024, Apple introduced **Apple
    Intelligence**, a personal intelligence system that puts powerful generative models
    in Apple devices, enabling new AI-driven features in your apps. These features
    include **Writing Tools**, **Image Playground**, **Genmoji**, and **Siri with
    App Intents.**


    In this chapter, you will implement Apple Intelligence features in your app. First,
    you’ll learn about Apple Intelligence and what it can do. Next, you’ll see how
    predictive code completion can help you write your apps. After that, you’ll learn
    about Writing Tools and see how it works in your app. Then, you will implement
    Image Playground in your app, and finally, you’ll learn about Genmoji and see
    how it works in your app.


    By the end of this chapter, you’ll have learned how to use Apple Intelligence
    features in Xcode and your apps.


    The following topics will be covered in this chapter:


    +   - About Apple Intelligence

    +   - Using predictive code completion in Xcode

    +   - Implementing Writing Tools in your app

    +   - Implementing Image Playground in your app

    +   - Implementing Genmoji in your app'
  merge: -1
  img_proc: true
- pgno: 534
  md: '# Technical requirements


    You will continue working on the JRNL project that you modified in *Chapter 24,
    Icon Composer.*


    The resource files and completed Xcode project for this chapter are in the Chapter
    25 folder of the code bundle for this book, which can be downloaded here:


    https://github.com/PacktPublishing/iOS-26-Programming-for-Beginners-10E


    Check out the following video to see the code in action:


    https://youtu.be/wgfrKZaj4VI


    Let’s start by learning about Apple Intelligence in the next section.


    # About Apple Intelligence


    Apple Intelligence is an artificial intelligence platform that consists of on-device
    and server processing that will enable incredible new features to help users communicate,
    work, and express themselves. These features include the following:


    +   - Predictive code completion, which helps you write code using Xcode

    +   - Writing Tools, which helps users proofread, rewrite, and summarize text

    +   - Image Playground, which allows users to create fun and playful images

    +   - Genmoji, which lets users create emojis to suit any occasion

    +   - Siri with App Intents, which allows developers to give Siri the ability
    to take actions within their app


    Apple Intelligence is free to all Apple users, and Apple has continued to add
    new capabilities to it in 2025.


    To learn about the latest updates to Apple Intelligence, watch this video:

    https://developer.apple.com/videos/play/wwdc2025/360/


    You can view Apple Developer documentation on Apple Intelligence at this link:

    https://developer.apple.com/apple-intelligence/


    In the next section, you will learn how Apple Intelligence will help you write
    code for your app.'
