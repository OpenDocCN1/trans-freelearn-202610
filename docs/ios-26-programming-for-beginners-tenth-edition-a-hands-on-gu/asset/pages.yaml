- pgno: 150
  md: '# Technical requirements


    We will use an example app, *BreakfastMaker*, to understand the concepts of Swift
    concurrency.


    The completed Xcode project for this chapter is in the Chapter09 folder of the
    code bundle for this book, which can be downloaded here:


    https://github.com/PacktPublishing/iOS-26-Programming-for-Beginners-10E


    Check out the following video to see the code in action:


    https://youtu.be/QzsaoTmCp5s


    Let’s start by learning about Swift concurrency in the next section.


    # Swift concurrency


    In Swift 5.5, Apple added support for writing **asynchronous** and **parallel**
    code in a structured way.


    Asynchronous code allows your app to suspend and resume code. Parallel code allows
    your app to run multiple pieces of code simultaneously. This allows your app to
    do things such as update the user interface while still performing operations
    such as downloading data from the internet.


    You can read Apple’s Swift concurrency documentation at this link: https://docs.swift.org/swift-book/documentation/the-swift-programming-language/concurrency/.


    During WWDC24, Apple released Swift 6. With the Swift 6 language mode, the compiler
    can now guarantee that concurrent programs are free of data races. This means
    that code from one part of your app can no longer access the same area of memory
    that is being modified by code from another part of your app. However, when you
    create a new Xcode project, it defaults to the Swift 5 language mode, and you
    must turn on the Swift 6 language mode to enable this feature. After WWDC25, Apple
    updated the documentation and migration guide for Swift concurrency.


    To view Apple’s documentation on migrating your app to Swift 6, click this link:
    https://www.swift.org/migration/documentation/migrationguide/.


    To view Apple’s WWDC25 video on the latest updates to Swift concurrency, click
    this link: https://developer.apple.com/videos/play/wwdc2025/268/.'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'To give you an idea of how Swift concurrency works, imagine that you are making
    soft-boiled eggs and toast for breakfast. Here is one way of doing it:


    +   1. Put two slices of bread into the toaster.

    +   2. Wait two minutes until the bread is toasted.

    +   3. Put two eggs in a pan containing boiling water and cover them.

    +   4. Wait seven minutes until the eggs are cooked.

    +   5. Plate and serve your breakfast.


    This takes nine minutes in total. Now, think about this sequence of events. Do
    you spend that time just staring at the toaster and the pan? You’ll probably be
    using your phone while the bread is in the toaster and the eggs are in the pan.
    In other words, you can do other things while the toast and eggs are being prepared.
    So, the sequence of events would be more accurately described as follows:


    +   1. Put two slices of bread into the toaster.

    +   2. Use your phone for two minutes until the bread is toasted.

    +   3. Put two eggs in a pan containing boiling water and cover them.

    +   4. Use your phone for seven minutes until the eggs are cooked.

    +   5. Plate and serve your breakfast.


    Here, you can see that your interaction with the toaster and pan can be suspended
    and then resumed, which means these operations are asynchronous. The operation
    still takes nine minutes, but you were able to do other things during that time.


    There is another factor to consider. You don’t need to wait for the bread to finish
    toasting before you put the eggs in the pan. This means you could modify the sequence
    of steps as follows:


    +   1. Put two slices of bread into the toaster.

    +   2. While the bread is toasting, put two eggs in a pan containing boiling water
    and cover them.

    +   3. Use your phone for seven minutes. During that time, the bread will be toasted,
    and the eggs will be cooked.

    +   4. Plate and serve your breakfast.


    Toasting the bread and boiling the eggs are now carried out in parallel, which
    saves you two minutes. Great! However, do note that you now have more things to
    keep track of.


    Now that you understand the concepts of asynchronous and parallel operations,
    let’s study the issues that an app without concurrency has in the next section.'
