    # Create a new UIImagePickerController instance


    To make it easy for a user to use the camera or photo library, Apple implemented
    the UIImagePickerController class. This class manages the system interfaces for
    taking photos and choosing items from the user’s photo library. An instance of
    this class is called an image picker controller, and it can display an image picker
    on the screen.


    If you have ever added a photo to a social media post, you will have seen what
    the image picker looks like. It typically displays either the view from your camera
    or a grid of photos from your photo library, and you can then choose a photo to
    be added to your post:


    ![](img/0972ba626734a3986e095c788777818e_444_0.png)


