- pgno: 83
  md: '7. Let’s assign a value to spouseName. Modify the code as shown:


    ```

    var spouseName: String?

    spouseName = "Nia"

    print(spouseName ?? "No value in spouseName")

    ```


    When your program runs, Nia appears in the Debug area.


    8. Add one more line of code to join spouseName to another string as shown:


    ```

    print(spouseName ?? "No value in spouseName")

    let greeting = "Hello, " + spouseName

    ```


    You’ll get an error, and the Debug area displays the error information and where
    the error occurred. This happens because you can’t join a regular string variable
    to an optional using the + operator. You will need to unwrap the optional first.


    9. Click on the red circle to display possible solutions, and you’ll see the following:


    ![](img/0972ba626734a3986e095c788777818e_83_0.png)


    Figure 3.4: Expanded error notification with the second fix highlighted


    The second solution recommends force-unwrapping to resolve this issue. Force-unwrapping
    unwraps an optional whether it contains a value or not. It works fine if spouseName
    has a value, but if spouseName is nil, your code will crash.


    10. Click Apply for the second solution, and you’ll see an exclamation mark appear
    after spouseName in the last line of code, which indicates the optional is force-unwrapped:


    ```

    let greeting = "Hello, " + spouseName!

    ```


    11. Run your program, and you’ll see Hello, Nia assigned to greeting, as shown
