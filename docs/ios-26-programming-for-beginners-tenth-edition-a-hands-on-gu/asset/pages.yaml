- pgno: 117
  md: "isThereAMatch(listOfNumbers:condition:) has two parameters: an array of integers\
    \ and a function. The function provided as an argument must take an integer value\
    \ and return a Boolean value.\n\nBoth numberIsOdd(number:) and numberIsEven(_:)\
    \ take an integer and return a Boolean value, which means either function can\
    \ be an argument for the second parameter. numbersList, an array containing odd\
    \ numbers, is used as the argument for the first parameter. When numberIsOdd is\
    \ used as an argument for the second parameter, isThereAMatch(listOfNumbers:condition:)\
    \ will return true when called. Try using numberIsEven as an argument for the\
    \ second parameter as well.\n\nFunctions as parameters and return types can be\
    \ difficult to understand but are relatively rare at this point in your learning\
    \ journey, so don’t worry if you don’t get it at first. As you gain experience,\
    \ it will become clearer to you.\n\nIn the next section, you’ll see how you could\
    \ perform an early exit on a function if the arguments used are not suitable.\n\
    \n# Use a guard statement to exit a function early\n\nLet’s say you need a function\
    \ to be used in an online purchasing terminal. This function will calculate the\
    \ remaining balance of a debit or credit card when you buy something. The price\
    \ of the item that you want to buy is entered in a text field.\n\nThe value in\
    \ the text field is converted into an integer so that you can calculate the remaining\
    \ card balance. If there is something wrong with the input data, it is useful\
    \ to be able to exit a function early.\n\nType in and run the following code:\n\
    \n```\nfunc buySomething(itemValueEntered itemValueField: String, cardBalance:\
    \ Int) -> Int {\n    guard let itemValue = Int(itemValueField) else {\n      \
    \  print(\"Error in item value\")\n        return cardBalance\n    }\n    let\
    \ remainingBalance = cardBalance - itemValue\n    return remainingBalance\n}\n\
    print(buySomething(itemValueEntered: \"10\", cardBalance: 50))\nprint(buySomething(itemValueEntered:\
    \ \"blue\", cardBalance: 50))\n```"
  merge: -1
  img_proc: true
- pgno: 118
  md: 'You should see this result in the Debug area:


    ```

    40

    Error in item value

    50

    ```


    Let’s see how this function works. The first line in the function body is a guard
    statement. This checks to see whether a condition is true; if not, it exits the
    function. Here, it is used to check and see whether the user entered a valid price
    in the online purchasing terminal.


    If so, the value can be converted successfully into an integer, and you can calculate
    the remaining card balance. Otherwise, the else clause in the guard statement
    is executed. An error message is printed to the Debug area and the unchanged card
    balance is returned.


    For print(buySomething(itemValueEntered: "10", cardBalance: 50)), the item price
    is deducted successfully from the card balance, and 40 is returned.


    For print(buySomething(itemValueEntered: "blue", cardBalance: 50)), the guard
    statement’s condition fails, and its else clause is executed, resulting in an
    error message being printed to the Debug area and 50 being returned.


    You now know how to create and use functions. You have also seen how to use custom
    argument labels, nested functions, functions as parameters or return types, and
    the guard statement.


    Now, let’s look at closures. Like functions, closures allow you to combine several
    instructions, but closures do not have names and can be assigned to a constant
    or a variable. You’ll see how they work in the next section.


    # Closures


    A closure, like a function, contains a sequence of instructions and can take arguments
    and return values. However, closures don’t have names. The sequence of instructions
    in a closure is surrounded by curly braces ({ }), and the in keyword separates
    the arguments and return type from the closure body.


    Closures can be assigned to a constant or variable, so they’re handy if you need
    to pass them around inside your program. For instance, let’s say you have an app
    that downloads a file from the internet, and you need to do something to the file
    once it has finished downloading. You can put a list of instructions to process
    the file inside a closure and have your program execute it once the file finishes
    downloading.'
  merge: -1
  img_proc: true
- pgno: 119
  md: "To learn more about closures, visit https://docs.swift.org/swift-book/documentation/the-swift-programming-language/closures/.\n\
    \nYou’ll now write a closure that applies a calculation to each element of an\
    \ array of numbers. Add the following code to your playground and click the Run\
    \ button to run it:\n\n```\nvar numbersArray = [2, 4, 6, 7]\nlet myClosure = {\
    \ (number: Int) -> Int in\n    let result = number * number\n    return result\n\
    }\nlet mappedNumbers = numbersArray.map(myClosure)\n```\n\nThis assigns a closure\
    \ that calculates a number’s power of two to myClosure. The map() function then\
    \ applies this closure to every element in numbersArray. Each element is multiplied\
    \ by itself, and [4, 16, 36, 49] appears in the Results area.\n\nIt’s possible\
    \ to write closures in a more concise fashion, and you’ll see how to do that in\
    \ the next section.\n\n# Simplify closures\n\nOne of the things that new developers\
    \ have trouble with is the very concise method used by experienced Swift programmers\
    \ to write closures. Consider the code shown in the following example:\n\n```\n\
    var testNumbers = [2, 4, 6, 7]\nlet mappedTestNumbers = testNumbers.map({\n  \
    \  (number: Int) -> Int in\n    let result = number * number\n    return result\n\
    })\nprint(mappedTestNumbers)\n```\n\nHere, you have testNumbers, an array of numbers,\
    \ and you use the map(_:) function to map a closure to each element of the array\
    \ in turn. The code in the closure multiplies the number by itself, generating\
    \ the square of that number. The result, [4, 16, 36, 49], is then printed to the\
    \ Debug area. As you will see, the closure code can be written more concisely."
  merge: -1
  img_proc: true
- pgno: 120
  md: "When a closure’s type is already known, you can remove the parameter type,\
    \ return type, or both. Single-statement closures implicitly return the value\
    \ of their only statement, which means you can remove the return statement as\
    \ well. So, you can write the closure as follows:\n\n```\nlet mappedTestNumbers\
    \ = testNumbers.map({ number in\n    number * number\n})\n```\n\nWhen a closure\
    \ is the only argument to a function, you can omit the parentheses enclosing the\
    \ closure, as follows:\n\n```\nlet mappedTestNumbers = testNumbers.map { number\
    \ in\n    number * number\n}\n```\n\nYou can refer to parameters by a number expressing\
    \ their relative position in the list of arguments instead of by name, as follows:\n\
    \n```\nlet mappedTestNumbers = testNumbers.map { $0 * $0 }\n```\n\nSo, the closure\
    \ is now very concise indeed but will be challenging for new developers to understand.\
    \ Feel free to write closures in a way that you are comfortable with.\n\nYou now\
    \ know how to create and use closures, and how to write them more concisely. Great!\n\
    \n# Summary\n\nIn this chapter, you studied how to group statements into functions.\
    \ You learned how to use custom argument labels, functions inside other functions,\
    \ functions as return types, functions as parameters, and the guard statement.\
    \ This will be useful later when you need to accomplish the same task at different\
    \ points in your program.\n\nYou also learned how to create closures. This will\
    \ be useful when you need to pass around blocks of code within your program.\n\
    \nIn the next chapter, we will study classes, structures, and enumerations. Classes\
    \ and structures allow for the creation of complex objects that can store state\
    \ and behavior, and enumerations can be used to limit the values that can be assigned\
    \ to a variable or constant, reducing the chances of error."
