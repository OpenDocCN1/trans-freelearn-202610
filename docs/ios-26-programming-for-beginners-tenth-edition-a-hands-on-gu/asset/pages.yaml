- pgno: 291
  md: '# 14


    # MVC and Table Views


    In the previous chapter, you modified the Journal List screen, the Add New Journal
    Entry screen, and the Journal Entry Detail screen to match the app tour shown
    in *Chapter 10, Set Up the User Interface*. You have completed the initial UI
    for the JRNL app, and that concluded Part 2 of this book.


    This chapter begins Part 3 of this book, where you will focus on the code that
    makes your app work. In this chapter, you will learn about the Model-View-Controller
    (MVC) design pattern and how the different parts of an app interact with one another.
    Then, you’ll implement a table view programmatically (which means implementing
    it using code instead of storyboards) using a playground, to understand how table
    views work. Finally, you’ll revisit the table view you implemented on the Journal
    List screen, so you can see the differences between implementing it in a storyboard
    and implementing it programmatically.


    By the end of this chapter, you’ll understand the MVC design pattern, you’ll have
    learned how to create a table view controller programmatically, and you’ll know
    how to use table view delegate and data source protocols.


    The following topics will be covered in this chapter:


    +   - The MVC design pattern

    +   - Table views

    +   - Revisit the Journal List screen'
  merge: -1
  img_proc: true
- pgno: 292
  md: '# Technical requirements


    The completed Xcode playground and project for this chapter are in the Chapter14
    folder of the code bundle for this book, which can be downloaded here:


    https://github.com/PacktPublishing/iOS-26-Programming-for-Beginners-10E


    Check out the following video to see the code in action:


    https://youtu.be/SHqmm6Ch57E


    Create a new playground and call it TableViewBasics. You can use this playground
    to type in and run all the code in this chapter as you go along. Before you do,
    let’s look at the MVC design pattern, an approach commonly used when writing iOS
    apps.


    # The MVC design pattern


    The Model-View-Controller (MVC design pattern is a common approach used when building
    iOS apps. MVC divides an app into three different parts:


    +   - **Model:** This handles data storage and representation and data processing
    tasks

    +   - **View:** This includes all the things that are on the screen that the user
    can interact with

    +   - **Controller:** This manages the flow of information between the model and
    the view


    One notable feature of MVC is that the view and model do not interact with one
    another; instead, all communication is managed by the controller.


    For example, imagine you’re at a restaurant. You look at a menu and choose something
    you want. Then, a waiter comes, takes your order, and sends it to the cook. The
    cook prepares your order, and when it is done, the waiter takes the order and
    brings it out to you. In this scenario, the menu is the view, the waiter is the
    controller, and the cook is the model. Also, note that all interactions between
    you and the kitchen are only through the waiter; there is no interaction between
    you and the cook.


    To find out more about MVC, visit https://developer.apple.com/library/archive/documentation/General/Conceptual/DevPedia-CocoaCore/MVC.html.'
  merge: -1
  img_proc: true
- pgno: 293
  md: 'To see how MVC works in the context of an iOS app, let’s learn more about view
    controllers. You will see what it takes to implement a view controller that is
    required to manage a table view, which is used on the Journal List screen.


    # View controllers


    So far, you have implemented JournalListViewController, a view controller that
    manages the table view on the Journal List screen. However, you still haven’t
    learned how the code you added to it works, so let’s look at that now.


    You may wish to re-read Chapter 11, Build the User Interface, where you implemented
    the JournalListViewController class.


    When an iOS app is launched, the view controller for the first screen to be displayed
    is loaded. The view controller has a view property and automatically loads the
    view instance assigned to its view property. That view may have subviews, which
    are also loaded.


    If one of the subviews is a table view, it will have dataSource and delegate properties.
    The dataSource property is assigned to an object that provides data to the table
    view. The delegate property is assigned to an object that handles user interaction
    with the table view. Typically, the view controller for the table view will be
    assigned to the table view’s dataSource and delegate properties.


    The method calls that a table view will send to its view controller are declared
    in the UITableViewDataSource and UITableViewDelegate protocols. Remember that
    protocols only provide method declarations; the implementation of those method
    calls is in the view controller. The view controller will then get the data from
    the model objects and provide it for the table view. The view controller also
    handles user input and modifies the model objects as required.


    Let’s take a closer look at table views and table view protocols in the next section.'
  merge: -1
  img_proc: true
