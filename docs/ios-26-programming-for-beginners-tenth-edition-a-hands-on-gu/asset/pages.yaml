- pgno: 193
  md: '# 11


    # Build the User Interface


    In the previous chapter, you modified an existing Xcode project, added a tab bar
    to your app that allowed the user to select between the Journal List and Map screens,
    and configured the tab bar button titles and icons. When your app is launched,
    the Journal List screen is displayed, but it is currently blank.


    As you saw in the app tour in *Chapter 10, Set Up the User Interface*, the Journal
    List screen should display a table view showing a list of journal entries in table
    view cells.


    In this chapter, you will make the Journal List screen display a table view containing
    10 empty table view cells, as well as a button that will display a view representing
    the Add New Journal Entry screen when tapped. You’ll also configure a Cancel button
    to dismiss this view and return you to the Journal List screen.


    You’ll be adding a small amount of code to your app, but don’t worry too much
    about this—you’ll learn more about it in the next part of this book.


    By the end of this chapter, you’ll have learned how to add view controllers to
    a storyboard scene, link outlets in view controllers to scenes, set up table view
    cells, and present a view controller modally. This will be very useful when you’re
    designing the user interface for your own apps.


    The following topics will be covered in this chapter:


    +   - Add a table view to the Journal List screen

    +   - Connect storyboard elements to the view controller

    +   - Configure data source methods for the table view

    +   - Present a view modally'
