  md: 'Verify that **iPhone 16e** is selected from the **Destination** menu. Build
    and run your app. You will see a blank white screen. If you click the **Main**
    storyboard file in the Project navigator, you will see that it contains a single
    scene containing a blank view. This is why you only see a blank white screen when
    you run the app.


    To configure the UI, you will modify the **Main** storyboard file using Interface
    Builder. Interface Builder allows you to add and configure scenes. Each scene
    represents a screen that a user will see. You can add UI objects such as views
    and buttons to a scene and configure them as required, using the Attributes inspector.


    > For more information on how to use Interface Builder, visit this link: https://help.apple.com/xcode/mac/current/#/dev31645f17f.


    Now, you will embed the existing scene in a tab bar and add another scene to it.
    The tab bar scene will display a tab bar with two buttons at the bottom of the
    screen. Tapping a button will display the screen associated with it. These screens
    correspond to the Journal List and Map screens shown in the app tour. Let’s see
    how to do this in the next section.


