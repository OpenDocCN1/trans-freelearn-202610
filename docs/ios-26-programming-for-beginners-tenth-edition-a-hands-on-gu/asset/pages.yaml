- pgno: 561
  md: '# 26


    # Foundation Models


    Apple introduced the **Foundation Models** framework during WWDC25. It is a new
    framework that allows you to access Apple’s on-device large language model. This
    text-based model lets you generate new text based on a prompt.


    In this chapter, you’ll configure a new screen for the *JRNL* app that will use
    the Foundation Models framework to help you write journal entries.


    You’ll start by learning about the Foundation Models framework. Next, you’ll review
    a version of the *JRNL* app with an additional tab added. This tab displays a
    new screen that allows you to enter prompts for the large language model and displays
    the resulting text, but it does not work yet. After that, you’ll add code to implement
    the required functionality, and finally, you’ll test the app to see how it works.


    By the end of this chapter, you’ll have learned the basics of the Foundation Models
    framework and how to implement it for your own apps.


    The following topics will be covered:


    +   - About Foundation Models

    +   - Review the Assist screen

    +   - Implement the Foundation Models framework'
  merge: -1
  img_proc: true
- pgno: 562
  md: '# Technical requirements


    You will work on a modified version of the JRNL project that has a new screen
    added.


    The completed Xcode project for this chapter is in the Chapter26 folder of the
    code bundle for this book, which can be downloaded here:


    https://github.com/PacktPublishing/iOS-26-Programming-for-Beginners-10E


    Check out the following video to see the code in action:


    https://youtu.be/ImS27Gb0KRk


    Let’s start by learning about the Foundation Models framework and how it works.


    # About Foundation Models


    The Foundation Models framework is the core for the Apple Intelligence features
    that you learned about in the previous chapter. It is located on-device, so it
    does not need internet connectivity to work. You can use it to implement intelligent
    features in your app, such as text generation, text extraction, and summarization.


    To watch Apple’s WWDC2025 video on the Foundation Models framework, see this link:
    https://developer.apple.com/videos/play/wwdc2025/286/. To view the Apple Developer
    documentation on the Foundation Models framework, see this link: https://developer.apple.com/documentation/foundationmodels.


    When writing journal entries, you may find that it is difficult to express yourself.
    It would be helpful if there were some way to create a sample journal entry, which
    you can then customize for your own use. Using the Foundation Models framework,
    you can implement a screen for the JRNL app where a user can type in a prompt
    and generate a sample journal entry. In the next section, you will review a version
    of the JRNL app that has such a screen.


    # Review the Assist screen


    To allow the user to type in a prompt and generate a sample journal entry, a user
    interface is needed. You will review a version of the JRNL app where a new screen
    has been added, named the Assist screen. This screen has a text field where a
    user can type in a prompt, and the results are then displayed in a text view.
    The user can then modify the text in the text view as they see fit.'
  merge: -1
  img_proc: true
