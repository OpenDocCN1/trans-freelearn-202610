- pgno: 140
  md: "# Technical requirements\n\nThe Xcode playground for this chapter can be found\
    \ in the Chapter08 folder of the code bundle for this book, which can be downloaded\
    \ here:\n\nhttps://github.com/PacktPublishing/iOS-26-Programming-for-Beginners-10E\n\
    \nCheck out the following video to see the code in action:\n\nhttps://youtu.be/0PGZdXA76eY\n\
    \nIf you wish to start from scratch, create a new playground and name it ProtocolsExtensionsAndErrorHandling.\
    \ You can type in and run all the code in this chapter as you go along. Let’s\
    \ start with protocols, which are a way of specifying the properties and methods\
    \ that a class, structure, or enumeration should have.\n\n# Protocols\n\nProtocols\
    \ are like blueprints that determine what properties or methods an object must\
    \ have. After you’ve declared a protocol, classes, structures, and enumerations\
    \ can adopt it and provide their own implementation for the required properties\
    \ and methods.\n\nHere’s what a protocol declaration looks like:\n\n```\nprotocol\
    \ ProtocolName {\n    var readWriteProperty1 {get set}\n    var readOnlyProperty2\
    \ {get}\n    func methodName1()\n    func methodName2()\n}\n```\n\nJust like classes\
    \ and structures, protocol names start with an uppercase letter. Properties are\
    \ declared using the var keyword. You use {get set} if you want a property that\
    \ can be read from or written to, and you use {get} if you want a read-only property.\
    \ Note that you just specify property and method names; the implementation is\
    \ done within the adopting class, structure, or enumeration.\n\nFor more information\
    \ on protocols, visit https://docs.swift.org/swift-book/documentation/the-swift-programming-language/protocols."
  merge: -1
  img_proc: true
