- pgno: 610
  md: '+   13. Enter the names and email addresses of your testers. Note that Apple
    will notify them automatically when a build is ready to be tested:


    # Add New Testers to the Group “My External Test Group”


    We’ll invite these testers to test the builds you add to this group.


    ![](img/0972ba626734a3986e095c788777818e_610_0.png)


    Figure 27.72: The Add New Testers to the Group screen


    Great! You now know how to test your apps internally and externally, and you have
    reached the end of this book!


    # Summary


    You have now completed the entire process of building an app and submitting it
    to the App Store. Congratulations!


    You started by learning how to obtain an Apple Developer account. Next, you learned
    how to generate a CSR to create certificates that allow you to test apps on your
    own devices and publish them on the App Store. You learned how to create a bundle
    identifier to uniquely identify your app on the App Store and register your test
    devices. After that, you learned how to create development and production provisioning
    profiles to allow apps to run on your test devices and be uploaded to the App
    Store. Next, you learned how to create an App Store listing and submit your release
    build to the App Store. Finally, you learned how to conduct testing for your app
    using internal and external testers.


    You now know how to build your own apps, conduct internal and external testing
    for them, and submit them to the App Store.'
