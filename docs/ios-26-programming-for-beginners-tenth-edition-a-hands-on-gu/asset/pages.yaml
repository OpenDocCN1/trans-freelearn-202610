- pgno: 42
  md: 'If you have an Apple Silicon Mac, the physical device section will display
    text stating **My Mac (Designed for iPad)**, because Apple Silicon Macs can run
    iOS apps. Otherwise, **No Devices** will be displayed. If you were to plug in
    an iOS device, it would appear in this section, and you would be able to run the
    apps you develop on it for testing. Running your apps on an actual device is recommended,
    as Simulator will not accurately reflect the performance characteristics of an
    actual iOS device and does not have hardware features that actual devices have.


    The **Build** section has two menu items, **Any iOS Device (arm64)** and **Any
    iOS Simulator Device (arm64, x86_64)**. These are used when you need to archive
    your app prior to submitting it to the App Store. You’ll learn how to do this
    in *Chapter 27, Test and Submit Your App to the App Store.*


    Now let’s see how to build and run your app on an actual iOS device. Most of the
    instructions in this book do not require you to have an iOS device, though, so
    if you don’t have one, you can skip the next section and go straight to *Chapter
    2, Simple Values and Types.*


    # Run your app on an iOS device


    Although you’ll be able to go through most of the exercises in this book using
    Simulator, it is recommended to build and test your apps on an actual iOS device,
    as Simulator will not be able to simulate some hardware components and software
    APIs.


    > For a comprehensive look at all the differences between Simulator and an actual
    device, see this link: https://help.apple.com/simulator/mac/current/#!/devb0244142d.


    In addition to your device, you’ll need an Apple account (used to automatically
    create a free Apple developer account) or a paid Apple developer account to build
    and run your app on your device. You can use the same Apple account that you used
    to download Xcode from the App Store.'
  merge: -1
  img_proc: true
