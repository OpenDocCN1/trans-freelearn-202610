  img_proc: true
- pgno: 126
  md: '# Make an instance of the class


    Once you have declared and defined a class, you can create instances of that class.
    You will now create an instance of the Animal class that represents a cat. Follow
    these steps:


    +   1. To create an instance of the Animal class, list all its properties and
    call its makeSound() method, type the following code after your class declaration
    and run it:


    ```

    let cat = Animal()

    print(cat.name)

    print(cat.sound)

    print(cat.numberOfLegs)

    print(cat.breathesOxygen)

    cat.makeSound()

    ```


    You can access instance properties and methods by typing a dot after the instance
    name, followed by the property or method you want. You''ll see the values for
    the instance properties and method calls listed in the Debug area. Since the values
    are the default values assigned when the class was created, name and sound contain
    empty strings, numberOfLegs contains 0, breathesOxygen contains true, and the
    makeSound() method prints an empty string.


    +   2. Let’s assign some values to this instance’s properties. Modify your code
    as shown:


    ```

    let cat = Animal()

    cat.name = "Cat"

    cat.sound = "Mew"

    cat.numberOfLegs = 4

    cat.breathesOxygen = true

    print(cat.name)

    ```


    Now, when you run the program, the following is displayed in the Debug area:


    ```

    Cat

    Mew

    4

    true

    Mew

    ```


    The values for all the instance properties and the result of the makeSound() method
    are printed to the Debug area.'
