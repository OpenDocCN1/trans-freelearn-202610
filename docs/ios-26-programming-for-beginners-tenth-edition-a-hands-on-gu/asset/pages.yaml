  md: "Writing async in front of a let statement when you define a constant, and then\
    \ writing await when you access the constant, allows the parallel execution of\
    \ asynchronous methods, as shown here:\n\n```\nasync let temporaryConstant1 =\
    \ methodName1()\nasync let temporaryConstant2 = methodName2()\nawait variable1\
    \ = temporaryConstant1\nawait variable2 = temporaryConstant1\n```\n\nIn this example,\
    \ methodName1() and methodName2() will run in parallel.\n\nYou will modify your\
    \ app to use async-let to enable the makeToast() and poachEgg() methods to run\
    \ in parallel. In the ViewController file, modify the code in the Task block as\
    \ follows:\n\n```\nTask {\n    let startTime = Date().timeIntervalSince1970\n\
    \    toastLabel.text = \"Making toast...\"\n    async let tempToast = makeToast()\n\
    \    eggLabel.text = \"Boiling eggs...\"\n    async let tempEggs = boilEggs()\n\
    \    await toastLabel.text = tempToast\n    await eggLabel.text = tempEggs\n \
    \   plateAndServeLabel.text = plateAndServe()\n    let endTime = Date().timeIntervalSince1970\n\
    \    elapsedTimeLabel.text = \"Elapsed time is \\(((endTime - startTime) * 100).rounded()\
    \ / 100) seconds\"\n}\n```\n\nBuild and run the app. You'll see that the elapsed\
    \ time is now less than it was before:\n\n![](img/0972ba626734a3986e095c788777818e_161_0.png)\n\
    \nFigure 9.8: Simulator running the BreakfastMaker app, showing the elapsed time"
  merge: -1
  img_proc: true
- pgno: 162
  md: 'This is because using async-let allows both the makeToast() and poachEgg()
    methods to run in parallel, and the poachEgg() method no longer waits for the
    makeToast() method to complete before starting execution. Cool!


    You have successfully implemented asynchronous code in your app. Fantastic! There
    are still a lot of things to learn about Swift concurrency, such as structured
    concurrency and actors, but that is beyond the scope of this chapter.


    Give yourself a pat on the back; you have completed the first part of this book!


    # Summary


    In this chapter, you learned about Swift concurrency and how to implement it in
    the Breakfast-Maker app.


    You started by learning the basic concepts of Swift concurrency. Then, you examined
    an app without concurrency and explored its issues. After that, you turned on
    strict concurrency checking and implemented concurrency in the app, using async/await.
    Finally, you made your app more efficient by using async let.


    You now understand the basics of Swift concurrency and will be able to use async/await
    and async-let in your own apps.


    In the next chapter, you will start writing your first iOS application by creating
    the screens for it, using storyboards, which allow you to rapidly prototype an
    application without having to type a lot of code.


