    Great! You now have development and distribution certificates. The next step is
    to register the App ID for your app to identify it on the App Store. You will
    learn how to do this in the next section.


    # Registering an App ID


    When you created your project in Chapter 1, Hello, Xcode, you created a bundle
    identifier for it (also known as an App ID). An App ID is used to identify your
    app on the App Store. You’ll need to register this App ID in your developer account
    prior to uploading your app to the App Store. Here’s how to register your App
    ID:


    +   1. Log in to your Apple Developer account and click Identifiers.

    +   2. Click the + button:


