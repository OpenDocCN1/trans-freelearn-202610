- pgno: 113
  md: "# Create a function\n\nIn its simplest form, a function just executes some\
    \ instructions and does not have any parameters or return types. You’ll see how\
    \ this works by writing a function to calculate the service charge for a meal.\
    \ The service charge should be 10% of the meal cost.\n\nAdd the following code\
    \ to your playground to create and call this function and run it:\n\n```\nfunc\
    \ serviceCharge() {\n    let mealCost = 50\n    let serviceCharge = mealCost /\
    \ 10\n    print(\"Service charge is \\(serviceCharge)\")\n}\nserviceCharge()\n\
    ```\n\nYou’ve just created a very simple function named serviceCharge(). All it\
    \ does is calculate the 10% service charge for a meal costing $50, which is 50\
    \ / 10, returning 5. You then call this function using its name. You’ll see Service\
    \ charge is 5 displayed in the Debug area.\n\nThis function is not very useful\
    \ because mealCost is always 50 every time you call this function. Also, the result\
    \ is only printed in the Debug area and can’t be used elsewhere in your program.\
    \ Let’s add some parameters and a return type to this function to make it more\
    \ useful.\n\nModify your code as shown:\n\n```\nfunc serviceCharge(mealCost: Int)\
    \ -> Int {\n    return mealCost / 10\n}\nlet serviceChargeAmount = serviceCharge(mealCost:\
    \ 50)\nprint(serviceChargeAmount)\n```\n\nThis is much better. Now, you can set\
    \ the meal cost when you call the serviceCharge(mealCost:) function, and the result\
    \ can be assigned to a variable or constant. It looks a bit awkward, though. You\
    \ should try to make function signatures in Swift read like an English sentence,\
    \ as this is considered best practice. Let’s see how to do that in the next section,\
    \ where you’ll use custom labels to make your function more English-like and easier\
    \ to understand."
