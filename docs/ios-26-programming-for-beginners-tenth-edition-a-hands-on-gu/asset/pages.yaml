  md: '# 23


    # Adopt Liquid Glass


    During Apple’s **World Wide Developer Conference (WWDC)** in 2025, they introduced
    a new design across all their platforms. A key element of this design is a new
    material named **Liquid Glass**. UIKit’s look and feel has been updated with this
    design, so all you need to do is recompile your app with the latest SDK. However,
    there are still some things you can do to refine your app’s user experience.


    In this chapter, you’re going to update the *JRNL* app to take advantage of the
    new design. First, you’ll learn about the new design system utilizing Liquid Glass.
    Next, you will modify your app to adopt the new design.


    By the end of this chapter, you’ll have learned how to implement the new design
    system for your own apps.


    The following topics will be covered in this chapter:


    +   - Meet Liquid Glass

    +   - Modify your app


    # Technical requirements


    You will continue working on the JRNL project that you modified in *Chapter 22,
    Collection Views.*


    The resource files and completed Xcode project for this chapter are in the Chapter
    23 folder of the code bundle for this book, which can be downloaded here:


    ```

    https://github.com/PacktPublishing/iOS-26-Programming-for-Beginners-10E

    ```'
