- pgno: 127
  md: "Note that here, you create the instance first and then assign values to that\
    \ instance. It is also possible to assign the values when the instance is being\
    \ created, and you can do this by implementing an initializer in your class declaration.\n\
    \n3. An initializer is responsible for ensuring all the instance properties have\
    \ valid values when a class is created. Let’s add an initializer for the Animal\
    \ class. Modify your class definition as shown:\n\n```\nclass Animal {\n    var\
    \ name: String\n    var sound: String\n    var numberOfLegs: Int\n    var breathesOxygen:\
    \ Bool\n    init(name: String, sound: String, numberOfLegs: Int, breathesOxygen:\
    \ Bool) {\n        self.name = name\n        self.sound = sound\n        self.numberOfLegs\
    \ = numberOfLegs\n        self.breathesOxygen = breathesOxygen\n    }\n    func\
    \ makeSound() {\n        print(sound)\n    }\n}\n```\n\nAs you can see, the initializer\
    \ uses the init keyword and has a list of parameters that will be used to set\
    \ the property values. Note that the self keyword distinguishes the property names\
    \ from the parameters. For example, self.name refers to the property and name\
    \ refers to the parameter.\n\nAt the end of the initialization process, every\
    \ property in the class should have a valid value.\n\n4. You’ll see some errors\
    \ in your code at this point as the function call does not have any parameters.\
    \ You will need to update your function call to address this. Modify your code\
    \ as shown and run it:\n\n```\nfunc makeSound() {\n    print(sound)\n}\n}\n```"
  merge: -1
