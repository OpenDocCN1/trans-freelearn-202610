  md: "This statement creates an empty array named journalEntries that will be used\
    \ to store JournalEntry instances. The private keyword means that the journalEntries\
    \ array may only be modified by methods in the SharedData class. This is to ensure\
    \ that no other part of your app can make changes to the journalEntries array.\n\
    \n```\nvar numberOfJournalEntries: Int {\n    journalEntries.count\n}\n```\n\n\
    This computed property returns the number of items in the journalEntries array.\n\
    \n```\nvar allJournalEntries: [JournalEntry] {\n    journalEntries\n}\n```\n\n\
    This computed property returns a copy of the JournalEntries array.\n\n```\nprivate\
    \ init() {\n}\n```\n\nThe init() method has an empty body. This prevents the accidental\
    \ creation of a SharedData() instance.\n\n```\nfunc journalEntry(at index: Int)\
    \ -> JournalEntry {\n    journalEntries[index]\n}\n```\n\nThis method returns\
    \ the JournalEntry instance located at the specified index in the journalEntries\
    \ array.\n\n```\nfunc addJournalEntry(_ newJournalEntry: JournalEntry) {\n   \
    \ journalEntries.insert(newJournalEntry, at: 0)\n}\n```\n\nThis method inserts\
    \ the JournalEntry instance provided by the argument into the JournalEntries array\
    \ at index 0.\n\n```\nfunc removeJournalEntry(at index: Int) {\n    journalEntries.remove(at:\
    \ index)\n}\n```\n\nThis method removes the JournalEntry instance at the specified\
    \ index from the journalEntries array."
