    \ siteStatus)\n```\n\nSince siteStatus is true, Site is up will appear in the\
    \ Results area.\n\n+   4. Change the value of siteStatus to false and run your\
    \ program. Your program crashes and the following error message is displayed in\
    \ the Debug area:\n\n```\nPlayground execution terminated: An error was thrown\
    \ and was not caught.\n```\n\n+   5. Of course, it is always better if you can\
    \ handle errors without making your program crash. You can do this by using a\
    \ do-catch block. Modify your code as shown and run it:\n\n```\nlet siteStatus\
    \ = false\ndo {\n    print(try checkWebsite(siteUp: siteStatus))\n} catch {\n\
    \    print(error)\n}\n```\n\nThe do block tries to execute the checkWebsite(siteUp:)\
    \ function and prints the status if successful. If there is an error, instead\
    \ of crashing, the statements in the catch block are executed, and the siteDown\
    \ error message appears in the Debug area.\n\nYou have learned how to handle errors\
    \ in your app without making it crash. Great!\n\n# Summary\n\nIn this chapter,\
    \ you learned how to write protocols and how to make classes, structures, and\
    \ enumerations conform to them. You also learned how to extend the capabilities\
    \ of a class by using an extension. Finally, you learned how to handle errors\
    \ using the do-catch block.\n\nThese may seem rather abstract and hard to understand\
    \ now, but in Part 3 of this book, you will see how to use protocols to implement\
    \ common functionalities in different parts of your program instead of writing\
    \ the same program over and over. You will see how useful extensions are in organizing\
    \ your code, which makes it easy to maintain. Finally, you’ll see how good error\
    \ handling makes it easy to pinpoint the mistakes you made while coding your app."
