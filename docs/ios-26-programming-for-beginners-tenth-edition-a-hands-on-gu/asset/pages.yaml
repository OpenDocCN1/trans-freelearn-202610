  md: '# Technical requirements


    You will continue working on the JRNL project that you modified in the previous
    chapter.


    The resource files and completed Xcode project for this chapter are in the Chapter
    22 folder of the code bundle for this book, which can be downloaded here:


    https://github.com/PacktPublishing/iOS-26-Programming-for-Beginners-10E


    Check out the following video to see the code in action:


    https://youtu.be/AcqGtM4hQL4


    Let’s start by learning about collection views in the next section.


    # Collection views


    A collection view is an instance of the UICollectionView class. It manages an
    ordered collection of elements and presents them using customizable layouts.


    To learn more about collection views, visit https://developer.apple.com/documentation/uikit/uicollectionview.


    The data displayed by a collection view is usually provided by a view controller.
    A view controller providing data for a collection view must adopt the UICollectionViewDataSource
    protocol. This protocol declares a list of methods that tells the collection view
    how many cells to display and what to display in each cell.


    To learn more about the UICollectionViewDataSource protocol, visit https://developer.apple.com/documentation/uikit/uicollectionviewdatasource.'
