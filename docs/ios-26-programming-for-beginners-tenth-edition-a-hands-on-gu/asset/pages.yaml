    \ of JournalEntryDetailViewController, gets the table view cell the user tapped,\
    \ and gets the index path of that cell.\n\n```\nlet selectedJournalEntry = journalEntries[indexPath.row]\n\
    ```\n\nThis statement gets the corresponding JournalEntry instance from the journalEntries\
    \ array.\n\n```\njournalEntryDetailViewController.selectedJournalEntry =\nselectedJournalEntry\n\
    ```\n\nThis statement assigns the JournalEntry instance to the destination view\
    \ controller’s selectedJournalEntry property.\n\nYou’ve now added code that will\
    \ pass the journal entry corresponding to the table view cell tapped by the user\
