- pgno: 259
  md: 'The custom view showing star ratings will consist of five buttons. Each button
    has a height of 44 points and a width of 44 points, and the space between each
    button is 8 points. The total width of the custom view will be 5 x 44 + 4 x 8,
    giving a total width of 252 points.


    5. Click the Add New Constraints button, and enter the following values to set
    the constraints for the stack view:


    +   - Width: 252

    +   - Height: 44


    When done, click the Add 2 Constraints button.


    Setting the size of a UI element in the Size inspector makes it easier for you
    to add constraints later because the intended values will already be set in the
    Add New Constraints dialog box.


    6. You’ll see that the stack view is outlined in red. Click the little reddish-pink
    arrow in the document outline.


    ![](img/0972ba626734a3986e095c788777818e_259_0.png)


    Figure 13.21: Arrow in the document outline


