- pgno: 212
  md: "5. Click the **JournalListViewController** file in the Project navigator. Modify\
    \ the class declaration to make the JournalListViewController class adopt the\
    \ UITableViewDataSource and UITableViewDelegate protocols:\n\n```\nclass JournalListViewController:\
    \ UIViewController,\nUITableViewDataSource, UITableViewDelegate {\n```\n\nAfter\
    \ a few seconds, an error will appear:\n\n```\n8 import UIKit\n9\n10 class JournalListViewController:\
    \ UIViewController,\n    UITableViewDataSource, UITableViewDelegate {\n11\n  \
    \  @IBOutlet var tableView: UITableView!\n```\n\n*Figure 11.26: Editor area showing\
    \ error*\n\n6. Click on it to display an error message. The error message says\
    \ Type ‘JournalListViewController’ does not conform to protocol ‘UITableViewDataSource’.\
    \ Add stubs for conformance:\n\nType 'JournalListViewController' does not conform\
    \ to protocol 'UITableViewDataSource'\nProtocol requires function 'tableView(_:numberOfRowsInSection:)'\
    \ with type '(UITableView, Int) -> Int' (UIKit.UITableViewDataSource.tableView)\n\
    Protocol requires function 'tableView(_:cellForRowAt:)' with type '(UITableView,\
    \ IndexPath) -> UITableViewCell' (UIKit.UITableViewDataSource.tableView)\nAdd\
    \ stubs for conformance   Apply\n\n*Figure 11.27: Editor area showing an error\
    \ message*\n\nThis means you need to implement the required methods for the UITableViewDataSource\
    \ protocol to make JournalListViewController conform to it.\n\n7. Click Apply\
    \ to automatically add stubs for the required methods into the JournalListViewController\
    \ class."
