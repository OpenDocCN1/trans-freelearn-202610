- pgno: 142
  md: "This protocol is named CalorieCountable. It specifies that any object that\
    \ adopts it must have a property, calories, that holds the calorie count, and\
    \ a method, description(), that returns a string. { get } means that you only\
    \ need to be able to read the value stored in calories, and you don’t have to\
    \ write to it. Note that the definition of the description() method is not specified,\
    \ as that will be done in the class, structure, or enumeration. All you need to\
    \ do to adopt a protocol is type a colon after the class name, followed by the\
    \ protocol name, and implement the required properties and methods.\n\nTo make\
    \ the Burger class conform to this protocol, modify your code as follows:\n\n\
    ```\nclass Burger: CalorieCountable {\n    let calories = 800\n    func description()\
    \ -> String {\n        \"This burger has \\(calories) calories\"\n    }\n}\n```\n\
    \nAs you can see, the calories property and the description() method have been\
    \ added to the Burger class. Even though the protocol specifies a variable, you\
    \ can use a constant here because the protocol only requires that you get the\
    \ value for calories, not set it.\n\nLet’s make the Fries structure adopt this\
    \ protocol as well. Modify your code for the Fries structure as follows:\n\n```\n\
    struct Fries: CalorieCountable {\n    let calories = 500\n    func description()\
    \ -> String {\n        \"These fries have \\(calories) calories\"\n    }\n}\n\
    ```\n\nThe code added to the Fries structure is like that added to the Burger\
    \ class, and it now conforms to the CalorieCountable protocol as well.\n\nYou\
    \ could modify the Sauce enumeration in the same way, but let’s do it using extensions\
    \ instead. Extensions extend the capabilities of an existing class, structure,\
    \ or enumeration. You’ll add the CalorieCountable protocol to the Sauce enumeration\
    \ using an extension in the next section."
