- pgno: 499
  md: "Size classes are traits that are automatically assigned to a view by the operating\
    \ system. Two classes are defined, which describe the height and width of a view:\
    \ regular (expansive space) and compact (constrained space). Let’s look at size\
    \ classes for a full-screen view on different devices:\n\n| Device | Portrait\
    \ | Landscape |\n|---|---|---|\n| iPad | Regular width\nRegular height | Regular\
    \ width\nRegular height |\n| iPhone 17 Pro Max | Compact width\nRegular height\
    \ | Regular width\nCompact height |\n| iPhone 16e | Compact width\nRegular height\
    \ | Compact width\nCompact height |\n\nFigure 22.33: Size classes for different\
    \ iOS devices\n\nFor the JRNL app, you will configure the collection view in the\
    \ Journal List screen to use a single column of collection view cells if the size\
    \ class is compact, and two columns if the size class is regular.\n\nYou’ll add\
    \ code to your app to determine the current size class. Once you know the size\
    \ class, you’ll be able to set the number of columns to use and the size of the\
    \ collection view cells in the collection view. You’ll learn how to do this in\
    \ the next section.\n\n# Modify the JournalListViewController class\n\nYou have\
    \ already made the JournalListViewController class adopt the UICollectionViewDelegateFlowLayout\
    \ protocol. Now you will create and set the collection view’s layout using a UICollectionViewFlowLayout\
    \ instance and implement methods to dynamically set the collection view cell size.\n\
    \nFollow these steps:\n\n+   1. Click the JournalListViewController file in the\
    \ Project navigator. In the JournalListViewController class, add the following\
    \ method to the class definition before the closing curly brace:\n\n```\nfunc\
    \ setupCollectionView() {\n    let flowLayout = UICollectionViewFlowLayout()\n\
    \    flowLayout.sectionInset = UIEdgeInsets(top: 10, left: 10,\n```"
