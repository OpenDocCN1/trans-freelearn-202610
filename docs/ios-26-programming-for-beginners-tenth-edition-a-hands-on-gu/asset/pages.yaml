- pgno: 69
  md: 'You’ll get an error message (Binary operator ‘+’ cannot be applied to operands
    of type ‘Int’ and ‘Double’). This is because a and b are different types. Note
    that Xcode can’t fix this automatically, so it does not display any fix-it suggestions.


    4. To fix the error, modify the program as follows:


    ```

    let c = Double(a) + b

    ```


    Double(a) gets the value in a and creates a floating-point number from it. Both
    operands are now of the same type, and now you can add it to the value in b. The
    value assigned to c is 24.0, and 24 will be displayed in the Results area.


    Now that you know how to use arithmetic operators, you’ll look at compound assignment
    operators (+=, -=, *=, and /=) in the next section.


    # Compound assignment operators


    You can perform an operation on a value and assign the result to a variable using
    the compound assignment operators shown here:


    | += | Adds a value and assigns the result to the variable |

    | -= | Subtracts a value and assigns the result to the variable |

    | *= | Multiplies by the value and assigns the result to the variable |

    | /= | Divides by the value and assigns the result to the variable |


    Figure 2.15: Compound assignment operators


    Let’s see how these operators are used. Add the following code to your playground
    and run it:


    ```

    var d = 1

    d += 2

    d -= 1

    ```


    The d += 2 expression is shorthand for d = d + 2, so the value in d is now 1 +
    2, and 3 will be assigned to d. In the same way, d -= 1 is shorthand for d = d
    - 1, so the value in d is now 3 - 1, and 2 will be assigned to d.


    Now that you are familiar with compound assignment operators, let’s look at comparison
    operators (==, !=, >, <, >=, and <=) in the next section.'
  merge: -1
  img_proc: true
- pgno: 70
  md: "# Comparison operators\n\nYou can compare one value to another using comparison\
    \ operators, and the result will be true or false. You can use the following comparison\
    \ operators:\n\n|  |  |\n|---|---| \n| == | Equal to | \n| != | Not equal to |\
    \ \n| > | Greater than | \n| < | Less than | \n| >= | Greater than or equal to\
    \ | \n| <= | Less than or equal to |\n\nFigure 2.16: Comparison operators\n\n\
    Let’s see how these operators are used. Add the following code to your playground\
    \ and run it:\n\n```\n1 == 1\n2 != 1\n2 > 1\n1 < 2\n1 >= 1\n2 <= 1\n```\n\nLet’s\
    \ see how this works:\n\n+   - 1 == 1 returns true because 1 is equal to 1.\n\
    +   - 2 != 1 returns true because 2 is not equal to 1.\n+   - 2 > 1 returns true\
    \ because 2 is greater than 1.\n+   - 1 < 2 returns true because 1 is less than\
    \ 2.\n+   - 1 >= 1 returns true because 1 is greater than or equal to 1.\n+  \
    \ - 2 <= 1 returns false because 2 is not less than or equal to 1.\n\nThe returned\
    \ Boolean values will be displayed in the Results area.\n\nWhat happens if you\
    \ want to check more than one condition? That’s where logical operators (AND,\
    \ OR, and NOT) come in. You’ll learn about those in the next section."
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Logical operators


    Logical operators are handy when you deal with two or more conditions. For example,
    if you are at a convenience store, you can pay for items if you have cash or a
    credit card. OR is the logical operator in this case.


    You can use the following logical operators:


    | && | Logical AND - returns true only if all conditions are true |

    | || | Logical OR - returns true if any condition is true |

    | ! | Logical NOT - returns the opposite Boolean value |


    Figure 2.17: Logical operators


    To see how these operators are used, add the following code to your playground
    and run it:


    ```

    (1 == 1) && (2 == 2)

    (1 == 1) && (2 != 2)

    (1 == 1) || (2 == 2)

    (1 == 1) || (2 != 2)

    (1 != 1) || (2 != 2)

    !(1 == 1)

    ```


    Let’s see how this works:


    +   - (1 == 1) && (2 == 2) returns true as both operands are true, so true AND
    true returns true.

    +   - (1 == 1) && (2 != 2) returns false as one operand is false, so true AND
    false returns false.

    +   - (1 == 1) || (2 == 2) returns true as both operands are true, so true OR
    true returns true.

    +   - (1 == 1) || (2 != 2) returns true as one operand is true, so true OR false
    returns true.

    +   - (1 != 1) || (2 != 2) returns false as both operands are false, so false
    OR false returns false.

    +   - !(1 == 1) returns false as 1==1 is true, so NOT true returns false.


    The returned Boolean values will be displayed in the Results area.'
  merge: -1
  img_proc: true
