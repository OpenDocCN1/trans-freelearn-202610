    ```\n```swift\n// MARK: - Navigation\noverride func prepare(for segue: UIStoryboardSegue,\
    \ sender: Any?) {\n    super.prepare(for: segue, sender: sender)\n    guard segue.identifier\
    \ == \"showMapDetail\" else {\n        fatalError(\"Unexpected segue identifier\"\
    )\n    }\n    guard let entryDetailViewController = segue.destination as?\n  \
    \      JournalEntryDetailViewController else {\n        fatalError(\"Unexpected\
    \ view controller\")\n    }\n    entryDetailViewController.selectedJournalEntry\
    \ =\n        selectedAnnotation\n}\n```\n```\n\nAs you have learned before, the\
    \ `prepare(for:sender:)` method is executed by a view controller before transitioning\
