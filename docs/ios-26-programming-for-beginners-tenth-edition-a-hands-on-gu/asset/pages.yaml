- pgno: 170
  md: '+   - **Model-View-Controller (MVC)**: This is a very common design pattern
    used in iOS app development. The user interacts with views onscreen. App data
    is stored in data model objects. Controllers manage the flow of information between
    views and data model objects.


    > MVC will be discussed in detail in *Chapter 14, MVC and Table Views.*


    +   - **Storyboard file**: A storyboard file contains a visual representation
    of what a user sees. Each screen of an app is represented by a storyboard scene.


    Open the JRNL project that you created in *Chapter 1, Hello, Xcode*, and click
    the Main storyboard file.


    ![](img/0972ba626734a3986e095c788777818e_170_0.png)


    You’ll see one scene in it, and when you run your app in **Simulator**, the contents
    of this scene will be displayed on the screen. You can have more than one scene
    in a storyboard file.


    +   - **Segue**: If you have more than one scene in an app, you use segues to
    move from one scene to another. The JRNL project does not have any segues, since
    there is just one scene in its storyboard file, but you will see them in a later
    part of this chapter.'
  merge: -1
  img_proc: true
- pgno: 171
  md: '+   - **Auto Layout:** As a developer, you must make sure that your app looks
    good on devices with different screen sizes. Auto Layout helps you lay out your
    UI based on the **constraints** you specify. For instance, you can set a constraint
    to make sure that a button is centered on the screen, regardless of screen size,
    or make a text field expand to the width of the screen when a device is rotated
    from portrait to landscape.


    Now that you are familiar with the terms used in iOS app development, let’s take
    a tour of the app you will build.


    # A tour of the JRNL app


    Let’s take a quick tour of the app that you will build. *JRNL* is a journal app
    that lets users write their own personal journal, with the option of storing a
    photo or a map location for each journal entry. Users can also view a map that
    shows the locations of entries that are close to a user’s current location. You’ll
    see all the screens used in the app and its overall flow in the next sections.


    # The Journal List screen


    When the app is launched, you will see the Journal List screen:


    ![](img/0972ba626734a3986e095c788777818e_171_0.png)


    Figure 10.6: Journal List screen'
