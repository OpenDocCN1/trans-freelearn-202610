  md: "# Technical requirements\n\nThe Xcode playground for this chapter can be found\
    \ in the Chapter07 folder of the code bundle for this book, which can be downloaded\
    \ here:\n\nhttps://github.com/PacktPublishing/iOS-26-Programming-for-Beginners-10E\n\
    \nCheck out the following video to see the code in action:\n\nhttps://youtu.be/Fbh1FIdXxro\n\
    \nIf you wish to start from scratch, create a new playground and name it ClassesStructuresAndEnumerations.\
    \ You can type in and run all the code in this chapter as you go along. Let’s\
    \ start with learning what a class is and how to declare and define it.\n\n# Classes\n\
    \nClasses are useful for representing complex objects; take the following examples:\n\
    \n+   - Individual employee information for a company\n+   - Items for sale at\
    \ an e-commerce site\n+   - Items you have in your house for insurance purposes\n\
    \nHere’s what a class declaration and definition look like:\n\n```\nclass ClassName\
    \ {\n    property1\n    property2\n    property3\n    method1() {\n        code\n\
    \    }\n    method2() {\n        code\n    }\n}\n```\n\nEvery class has a descriptive\
    \ name, and it contains variables or constants used to represent an object. Variables\
    \ or constants associated with a class are called **properties**.\n\nA class can\
    \ also contain functions that perform specific tasks. The functions associated\
    \ with a class are called **methods**."
