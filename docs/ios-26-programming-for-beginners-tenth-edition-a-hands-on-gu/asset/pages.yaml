  md: "For more information on the MKMapSnapshotter class, see https://developer.apple.com/documentation/mapkit/mkmapsnapshotter.\n\
    \nTo configure the region and appearance of the map that is captured in the snapshot,\
    \ an MKMapSnapshotter.Options object is used.\n\nFor more information on the MKMapSnapshotter.Options\
    \ object, see https://developer.apple.com/documentation/mapkit/mkmapsnapshotter/options.\n\
    \nYou will connect the second image view in Entry Detail Scene to an outlet in\
    \ the JournalEntry DetailViewController class and replace the placeholder image\
    \ with a map snapshot showing the location of the journal entry. Follow these\
    \ steps:\n\n+   1. In the Project navigator, click on the JournalEntryDetailViewController\
    \ file. Type the following after the import UIKit statement to import the MapKit\
    \ framework:\n\n```\nimport UIKit\nimport MapKit\n```\n\n+   2. Add the following\
    \ outlet after all other outlets in the JournalEntryDetailViewController class:\n\
    \n```\n@IBOutlet var bodyTextView: UITextView!\n@IBOutlet var photoImageView:\
    \ UIImageView!\n@IBOutlet var mapImageView: UIImageView!\nvar selectedJournalEntry:\
    \ JournalEntry?\n```\n\n+   3. Add a method to generate the map snapshot before\
    \ the closing curly brace:\n\n```\n// MARK: - Private methods\nprivate func getMapSnapshot()\
    \ {\n    guard let lat = selectedJournalEntry?.latitude, let\n    long = selectedJournalEntry?.longitude\
    \ else {\n        mapImageView.image = nil\n        return\n    }\n}\n```"
