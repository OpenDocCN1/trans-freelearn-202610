- pgno: 97
  md: '# Create an array


    In previous chapters, you created a constant or variable by declaring it and assigning
    an initial value to it. You can create an array in the same way.


    Imagine that your spouse has asked you to get some items from a convenience store.
    Let’s implement a shopping list using an array. Add the following code to your
    playground and run it:


    ```

    var shoppingList = ["Eggs", "Milk"]

    ```


    This instruction creates an array variable named shoppingList. The assigned value,
    ["Eggs", "Milk"], is an array literal. It represents an array with two elements
    of type String, with "Eggs" at index 0 and "Milk" at index 1.


    Using the var keyword here means that the array’s contents can be modified. Since
    Swift uses type inference, this array’s elements will be of type String.


    Imagine that you need to check how many items you need to get at the store. In
    the next section, you’ll learn how to determine the number of elements in an array.


    # Check the number of elements in an array


    To find out how many elements there are in an array, use count. Type in and run
    the following code:


    ```

    shoppingList.count

    ```


    As the shoppingList array contains two elements, 2 is displayed in the Results
    area.


    You can check to see whether an array is empty by using isEmpty. Type in and run
    the following code:


    ```

    shoppingList.isEmpty

    ```


    As the shoppingList array contains two elements, false is displayed in the Results
    area.


    It is also possible to see whether an array is empty by using shoppingList.count
    == 0, but using shoppingList.isEmpty offers better performance.


    Imagine that your spouse calls and asks you to also get cooking oil, fish, and
    chicken while you are at the store. In the next section, you’ll see how to add
    elements to the end of an array, and at a specified array index.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# Add a new element to an array


    You can add a new element to the end of an array by using append(_:). Type in
    and run the following code:


    ```

    shoppingList.append("Cooking Oil")

    ```


    "Cooking Oil" has been added to the end of the shoppingList array, which now contains
    three elements – "Eggs", "Milk", and "Cooking Oil" – and "Eggs", "Milk", and "Cooking
    Oil" are displayed in the Results area.


    You can also add an array to another array with the + operator, using the following
    code:


    ```

    shoppingList = shoppingList + ["Fish"]

    ```


    You can add a new item at a specified index using insert(_:at:). Type and run
    the following code:


    ```

    shoppingList.insert("Chicken", at: 1)

    ```


    This inserts "Chicken" at index 1, so now the shoppingList array contains "Eggs",
    "Chicken", "Milk", "Cooking Oil", and "Fish". Note that "Chicken" is the second
    element in the array as the first element is at index 0. This can be seen in the
    Results area:


    ![](img/0972ba626734a3986e095c788777818e_98_0.png)


    Figure 5.2: Array contents displayed in the Results area


    Imagine that you’ve got the first item on your shopping list, and now you need
    to know the next item on the list. In the next section, you’ll see how to access
    a specific array element using the array index.'
