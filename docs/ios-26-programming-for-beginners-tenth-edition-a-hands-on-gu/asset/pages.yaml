- pgno: 394
  md: "# ## Climate of Mars\n\nThe climate of Mars has been a topic of scientific\
    \ curiosity for centuries, in part because Mars is the only planet whose surface\
    \ can be directly observed in detail from the Earth.\n\nAlthough Mars is smaller\
    \ than Earth, its climate has important similarities, such as the presence of\
    \ polar ice caps, seasonal changes, and observable weather patterns. It has attracted\
