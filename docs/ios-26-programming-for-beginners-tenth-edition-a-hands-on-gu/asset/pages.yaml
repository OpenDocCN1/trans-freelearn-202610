  md: 'The following topics will be covered in this chapter:


    +   - Implement a singleton

    +   - Modify the JournalEntry class to be JSON-compatible

    +   - Load and saving JSON data


    # Technical requirements


    You will continue working on the JRNL project that you modified in the previous
    chapter.


    The resource files and completed Xcode project for this chapter are in the Chapter18
    folder of the code bundle for this book, which can be downloaded here:


    https://github.com/PacktPublishing/iOS-26-Programming-for-Beginners-10E


    Check out the following video to see the code in action:


    https://youtu.be/OPMjo1Ro9OI


    Let’s start by creating a new singleton to store the data used by your app.


    # Implement a singleton


    At present, when you add new journal entries to your app, they will appear on
    the Journal List screen, but when you switch to the Map screen, the newly added
    journal entries are not present. This is because the MapViewController instance
    does not have access to the journalEntries array in the JournalListViewController
    instance. To solve this issue, you’ll create a new singleton to store your app
    data. A singleton is created once and then referenced throughout your app. This
    means that the JournalListViewController class and the MapViewController class
    will be getting their data from a single source.


    > For more information on singletons, see https://developer.apple.com/documentation/swift/managing-a-shared-resource-using-a-singleton.


    In the next section, you will create a singleton named SharedData, which will
    be used by the JournalListViewController and MapViewController classes.'
