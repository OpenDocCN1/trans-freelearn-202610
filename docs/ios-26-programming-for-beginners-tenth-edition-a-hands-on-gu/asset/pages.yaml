- pgno: 27
  md: '# 1


    # Hello, Xcode


    Welcome to *iOS 26 Programming for Beginners*. I hope this book serves as a useful
    introduction to creating and publishing iOS 26 apps on the App Store.


    In this chapter, you''ll download and install **Xcode** on your Mac. Then, you''ll
    explore the Xcode user interface. After that, you''ll create your first **iOS
    app** and run it in **Simulator**. Finally, you''ll run your app on an **iOS device**.


    By the end of this chapter, you will know how to create an iOS app, how to run
    it in Simulator, and how to run it on an iOS device.


    The following topics will be covered in this chapter:


    +   - Downloading and installing Xcode from the App Store

    +   - Exploring the Xcode user interface

    +   - Running your app in Simulator

    +   - Running your app on an iOS device'
