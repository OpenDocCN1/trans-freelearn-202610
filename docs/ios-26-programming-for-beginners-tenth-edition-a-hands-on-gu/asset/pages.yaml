- pgno: 125
  md: "Once you have declared and defined a class, you can create **instances** of\
    \ that class. Imagine you are creating an app for a zoo. If you have an Animal\
    \ class, you can use instances of that class to represent different animals at\
    \ the zoo. Each of these instances will have different values for their properties.\n\
    \nTo learn more about classes, visit https://docs.swift.org/swift-book/documentation/the-swift-programming-language/classesandstructures.\n\
    \nLet’s look at how to work with classes. You’ll learn how to declare and define\
    \ classes, create instances based on the class declaration, and manipulate those\
    \ instances. You’ll start by creating a class to represent animals in the next\
    \ section.\n\n# Create a class declaration\n\nLet’s declare and define a class\
    \ that can store details about animals. Add the following code to your playground:\n\
    \n```\nclass Animal {\n    var name: String = \"\"\n    var sound: String = \"\
    \"\n    var numberOfLegs: Int = 0\n    var breathesOxygen: Bool = true\n    func\
    \ makeSound() {\n        print(sound)\n    }\n}\n```\n\nYou’ve just declared a\
    \ very simple class named Animal. Convention dictates that class names start with\
    \ a capital letter. This class has properties to store the name of the animal,\
    \ the sound it makes, the number of legs it has, and whether it breathes oxygen\
    \ or not. This class also has a method, makeSound(), that prints the noise it\
    \ makes to the Debug area.\n\nNow that you have an Animal class, let’s use it\
    \ to create an instance that represents an animal in the next section."
