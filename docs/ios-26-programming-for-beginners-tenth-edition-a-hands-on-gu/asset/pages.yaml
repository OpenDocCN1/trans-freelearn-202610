    You can see a group of five stars just above the Get Location switch. Currently,
    the New Entry scene and the Entry Detail scene in the Main storyboard file have
    placeholder view objects where the stars should be. You will create the RatingView
    class, a custom subclass of the UIStackView class, which you will use in both
    scenes. An instance of this class will display ratings as stars.


    For the rest of this chapter, an instance of the RatingView class will be referred
    to as a rating view (the same way an instance of the UIButton class is referred
    to as a button).


    Let’s begin by creating a subclass of the UIStackView class. Follow these steps:


    +   1. In the Project navigator, right-click on the JRNL folder and choose New
