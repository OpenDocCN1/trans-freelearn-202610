  md: "![](img/0972ba626734a3986e095c788777818e_157_0.png)\n\n# Figure 9.3: BreakfastMaker\
    \ project with Swift Language Version set to Swift 6\n\nThis enables strict concurrency\
    \ checking for your app.\n\n+   2. Click the ViewController file in the Project\
    \ navigator. Modify the makeToast() and boilEggs() methods, as shown here, to\
    \ make the code in their bodies asynchronous:\n\n```\nfunc makeToast() -> String\
    \ {\n    try? await Task.sleep(for: .seconds(2))\n    return \"Toast done\"\n\
    }\n\nfunc boilEggs() -> String {\n    try? await Task.sleep(for: .seconds(7))\n\
    \    return \"Eggs done\"\n}\n```\n\nTask represents a unit of asynchronous work.\
    \ It has a static method, sleep(for:), which pauses execution for a specified\
    \ duration, measured in seconds. Since this method is a throwing method, you’ll\
    \ use the try? keyword to call it without having to implement a do-catch block.\
    \ The await keyword indicates that this code can be suspended to allow other code\
    \ to run.\n\n> Using try? will result in any errors being suppressed or ignored.\
    \ This is acceptable in this case because sleeping for 2 or 7 seconds is unlikely\
    \ to generate an error. This may not be acceptable in other situations, where\
    \ a do-catch block is a better solution. You may wish to reread Chapter 8, Protocols,\
    \ Extensions, and Error Handling, for information on how to implement a do-catch\
    \ block."
