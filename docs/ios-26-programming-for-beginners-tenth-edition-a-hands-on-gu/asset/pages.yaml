- pgno: 511
  md: "Let’s see how you can implement these changes, starting with minimizing the\
    \ tab bar when you scroll down, in the next section.\n\n# Minimize the tab bar\
    \ on scroll down\n\nIn iOS 26, the tab bar has been updated with the Liquid Glass\
    \ appearance. It floats above your content and can be configured to minimize when\
    \ you scroll up or down, keeping the focus on your content. To minimize the tab\
    \ bar when you scroll down, follow these steps:\n\n+   1. In the Project navigator,\
    \ click the **JournalListViewController** file (located in the **Journal List\
    \ Scene** group). Add the following line to the viewDidLoad() method:\n\n```\n\
    // MARK: - View controller lifecycle\noverride func viewDidLoad() {\n    super.viewDidLoad()\n\
    \    tabBarController?.tabBarMinimizeBehaviour = .onScrollDown\n    setupCollectionView()\n\
    }\n```\n\n+   2. Build and run your project. You will see the tab bar minimize\
    \ when you scroll down:\n\n![](img/0972ba626734a3986e095c788777818e_511_0.png)\n\
    \nFigure 23.1: Minimized tab bar on the Journal List screen\n\n> This feature\
    \ was working in the beta version of iOS 26, but it does not seem to be working\
    \ in the release version. Apple may restore this feature later.\n\nGreat! In the\
    \ next section, you will learn how to add a subtitle showing the number of journal\
    \ entries in the Journal List screen."
  merge: -1
  img_proc: true
- pgno: 512
  md: '# Add a subtitle to the Journal List screen


    In iOS 26, the UINavigationItem object for each view controller gets a new subtitle
    property that appears below the title. You''ll add code to display the number
    of journal entries below the title on the Journal List screen. Follow these steps:


    +   1. Click the **JournalListViewController** file in the Project navigator.
    Add a new method after the setupCollectionView() method to display the number
    of journal entries in the subtitle of the Journal List screen:

    +   ```swift

    +   func updateSubtitleCount() {

    +       let noOfJournalEntries = SharedData.shared.numberOfJournalEntries

    +       switch noOfJournalEntries {

    +       case 0:

    +           navigationItem.subtitle = "No journal entries"

    +       case 1:

    +           navigationItem.subtitle = "1 journal entry"

    +       default:

    +           navigationItem.subtitle = "\(noOfJournalEntries) journal entries"

    +       }

    +   }

    +   ```

    +   2. Call updateSubtitleCount() in viewDidLoad() before the closing curly brace.
    This will display the number of journal entries in the Journal List screen when
    the app is launched:

    +   ```swift

    +   navigationItem.searchController = search

    +   updateSubtitleCount()

    +   }

    +   ```

    +   3. The number of journal entries displayed needs to be updated when a journal
    entry is deleted. Modify collectionView(_:contextMenuConfigurationForItemsAt:point:)
    to call updateSubtitleCount() when a journal entry is deleted:

    +   ```swift

    +   collectionView.reloadData()

    +   self.updateSubtitleCount()

    +   }

    +   return UIMenu(children: [delete])

    +   ```'
  merge: -1
