- pgno: 80
  md: "2. Here’s how to write the if statement shown earlier as a switch statement.\
    \ Type in the following code and run it:\n\n```\ntrafficLightColor = \"Yellow\"\
    \nswitch trafficLightColor {\ncase \"Red\":\n    print(\"Stop\")\ncase \"Yellow\"\
    :\n    print(\"Caution\")\ncase \"Green\":\n    print(\"Go\")\ndefault:\n    print(\"\
    Invalid color\")\n}\n```\n\nThe code here is much easier to read and understand\
    \ when compared to the previous version. The value in trafficLightColor is \"\
    Yellow\", so case \"Yellow\": is matched and Caution is printed in the Debug area.\
    \ Try changing the value of trafficLightColor to see different results.\n\nThere\
    \ are two things to remember about switch statements:\n\n+   - switch statements\
    \ in Swift do not fall through the bottom of each case and into the next one by\
    \ default. In the example shown previously, once case \"Yellow\": is matched,\
    \ case \"Red\":, case \"Green\":, and default: will not execute.\n+   - switch\
    \ statements must cover all possible cases. In the example shown previously, any\
    \ trafficLightColor value other than \"Red\", \"Yellow\", or \"Green\" will be\
    \ matched to default: and Invalid color will be printed in the Debug area.\n\n\
    This concludes the section on if and switch statements. In the next section, you’ll\
    \ learn about optionals, which allow you to create variables without initial values,\
    \ and optional binding, which allows instructions to be executed if an optional\
    \ has a value.\n\n# Optionals and optional binding\n\nUp until now, every time\
    \ you have declared a variable or constant, you have assigned a value to it immediately.\
    \ But what if you want to declare a variable first and assign a value later? In\
    \ this case, you would use optionals."
