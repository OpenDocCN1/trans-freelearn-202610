    A better way of handling this is to use optional binding. In optional binding,\
    \ you attempt to assign the value in an optional to a temporary variable (you\
    \ can name it whatever you like). If the assignment is successful, a block of\
    \ code is executed.\n\n13. To see the effect of optional binding, modify your\
    \ code as follows:\n\n```\nspouseName = \"Nia\"\nprint(spouseName ?? \"No value\
    \ in spouseName\")\nif let spouseTempVar = spouseName {\n    let greeting = \"\
    Hello, \" + spouseTempVar\n    print(greeting)\n}\n```\n\nHello, Nia will appear\
    \ in the Debug area. Here’s how it works. If spouseName has a value, it will be\
    \ unwrapped and assigned to a temporary constant, spouseTempVar, and the if statement\
    \ will return true. The statements between the curly braces will be executed and\
    \ the greeting constant will then be assigned the value Hello, Nia. Then, Hello,\
    \ Nia will be printed in the Debug area. Note that the temporary variable spouseTempVar\
    \ is not an optional. If spouseName does not have a value, no value can be assigned\
    \ to spouseTempVar and the if statement will return false. In this case, the statements\
    \ in the curly braces will not be executed at all.\n\n14. You can also write the\
    \ code in the previous step in a simpler way as follows:\n\n```\nspouseName =\
