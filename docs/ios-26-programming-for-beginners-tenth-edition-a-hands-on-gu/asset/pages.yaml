  md: '# Create the MapViewController class


    In Chapter 12, Complete the User Interface, you added a map view to the Map screen.
    A map view is an instance of the MKMapView class. You can see what it looks like
    in the Apple Maps app.


    To learn more about MKMapView, see https://developer.apple.com/documentation/mapkit/mkmapview.


    When you build and run your app, you will see a map on the screen. The part of
    the map that is visible onscreen can be specified by setting the map view’s region
    property.


    To learn more about regions and how to make them, see https://developer.apple.com/documentation/mapkit/mkmapview/1452709-region.


    You’ll create a new class, MapViewController, to be the view controller for the
    Map screen, and you’ll use Core Location to determine the center point of the
    map region that will be displayed. Follow these steps:


    +   1. Create a new group inside your project by right-clicking the JRNL group
    and choosing New Group. Name this group Map Screen and move it so it is below
    the Journal Entry Detail Screen group.

    +   2. Right-click on the Map Screen group and select New File From Template....

    +   3. iOS should already be selected. Choose Cocoa Touch Class and click Next.

    +   4. Configure the class with the following details:

    +      - Class: MapViewController

    +      - Subclass: UIViewController

    +      - Also create XIB: Unchecked

    +      - Language: Swift

    +      Click Next when you’re done.

    +   5. Click Create. The MapViewController file appears in the Project navigator,
    and its contents appear in the Editor area.'
