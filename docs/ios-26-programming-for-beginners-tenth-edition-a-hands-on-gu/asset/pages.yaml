  md: "9. Call the setupButtons() method in the initializer:\n\n```\nrequired init(coder:\
    \ NSCoder) {\n    super.init(coder: coder)\n    setupButtons()\n}\n```\n\nThis\
    \ draws the rating view onscreen when the rating view is initialized.\n\nYou have\
    \ created a custom UIStackView subclass named RatingView, and you have added code\
    \ to make it draw five stars on the screen. Now let’s add code to enable the user\
    \ to change the rating when the stars in the rating view are tapped. Follow these\
    \ steps:\n\n1. Implement a method to change the rating view’s rating property\
    \ when a button in the ratingButtons array is tapped after the setupButtons()\
    \ method:\n\n```\n@objc private func ratingButtonTapped(_ button: UIButton) {\n\
    \    guard let index = ratingButtons.firstIndex(of: button) else {\n        fatalError(\"\
    The button, \\(button), is not in the ratingButtons array: \\(ratingButtons)\"\
    )\n    }\n    let selectedRating = index + 1\n    if selectedRating == rating\
    \ {\n        rating = 0\n    } else {\n        rating = selectedRating\n    }\n\
    }\n```\n\nWhen a button in the ratingButtons array is tapped, the guard statement\
    \ assigns the index of the button to index. selectedRating is then set to the\
    \ value stored in index + 1. If the rating property has the same value as selectedRating,\
    \ it is set to 0; otherwise, it is set to the same value as selectedRating.\n\n\
    For example, let’s say you tap the third star in the rating view. Since the third\
    \ star is the third element in the ratingButtons array, index would be set to\
    \ 2 and selectedRating would be set to 2 + 1 = 3. Assuming that the initial value\
    \ of the rating property is 0, selectedRating == rating would return false, and\
    \ the rating property’s value would be set to 3."
  merge: -1
  img_proc: true
- pgno: 434
  md: "2. Assign this method as the button action in the for loop of the setupButtons\
    \ method after the statements setting the constraints:\n\n```\nbutton.widthAnchor.constraint(equalToConstant:\
    \ starSize.width).\nisActive = true\nbutton.addTarget(self, action: #selector(RatingView.\n\
    ratingButtonTapped(_:)), for: .touchUpInside)\naddArrangedSubview(button)\n```\n\
    \n3. Add a method to change the button state according to the rating that was\
    \ set before the closing curly brace:\n\n```\nprivate func updateButtonSelectionStates()\
    \ {\n    for (index, button) in ratingButtons.enumerated() {\n        button.isSelected\
    \ = index < rating\n    }\n}\n```\n\nTo see how this works, let’s say that the\
    \ rating property is set to 3. The default state for each button is .normal.\n\
    \nThe first button is at index 0, so button.isSelected is 0 < 3, which returns\
    \ true. Since the image for the .selected state is a filled star, this button’s\
    \ image is set to a filled star. The same is true for the next two buttons.\n\n\
    The fourth button is at index 3, so button.isSelected is 3 < 3, which returns\
    \ false. This means that the button’s state remains .normal. The image for the\
    \ .normal state is a star outline, so this button’s image is set to a star outline.\
    \ The same is true for the fifth button.\n\nIn short, when the rating property\
    \ is set to 3, the rating view displays the first three buttons with filled stars,\
    \ and the remaining two buttons with star outlines.\n\n4. You’ll need to call\
    \ the updateButtonSelectionStates() method every time the rating property’s value\
    \ changes. To do so, modify the rating property as shown:\n\n```\nvar rating =\
    \ 0 {\n    didSet {\n        updateButtonSelectionStates()\n    }\n}\n```"
