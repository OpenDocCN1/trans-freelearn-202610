    \    \"photoData\": \"<photo data for the cloud image>\"\n    \"latitude\": 37.331354\n\
    \    \"longitude\": -122.031791\n  },\n  {\n    \"dateString\": \"May 17, 2023\"\
    \n    \"rating\": 3\n    \"entryTitle\": \"Good\"\n    \"entryBody\": \"Today\
