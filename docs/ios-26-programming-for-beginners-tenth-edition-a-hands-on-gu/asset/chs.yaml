  \ UIStackView 子类，用于在屏幕上显示星级评分。\n\n## 创建自定义的 UIStackView 子类\n\n到目前为止，你只使用了 Apple\
  \ 预定义的 UI 元素，例如标签和按钮。你只需点击 Library 按钮，搜索所需对象，然后将其拖入故事板。然而，在某些情况下，Apple 提供的对象可能不合适或不存在。在这种情况下，你需要自己构建。让我们回顾一下在应用导览中看到的“添加新日志条目”屏幕：\n\
  \n![](img/0972ba626734a3986e095c788777818e_428_0.png)\n\n图 19.1：显示星级评分的“添加新日志条目”屏幕\n\
  \n你可以看到“获取位置”开关上方有一组五个星形图标。目前，Main 故事板文件中的“新建条目”场景和“条目详情”场景在星形图标应处的位置上有占位视图对象。你将创建\
  \ RatingView 类，它是 UIStackView 类的自定义子类，并将在两个场景中使用它。该类的实例将以星形图标显示评分。\n\n在本章其余部分，RatingView\
  \ 类的实例将被称为评分视图（正如 UIButton 类的实例被称为按钮一样）。\n\n让我们首先创建 UIStackView 类的子类。请按照以下步骤操作：\n\
  \n- 1. 在 Project 导航器中，右键点击 JRNL 文件夹，从弹出菜单中选择 New Group。将此组命名为 View。将此组移动到 Model\
  \ 组下方的新位置：\n\n9. 在初始化器中调用 setupButtons() 方法：\n\n```\nrequired init(coder: NSCoder)\
  \ {\n    super.init(coder: coder)\n    setupButtons()\n}\n```\n\n这将在评分视图初始化时将其绘制在屏幕上。\n\
  \n你已经创建了一个名为 RatingView 的自定义 UIStackView 子类，并添加了代码使其在屏幕上绘制五个星形图标。现在，让我们添加代码，使用户在点击评分视图中的星形图标时能够更改评分。请按照以下步骤操作：\n\
  \n1. 实现一个方法，当 ratingButtons 数组中的按钮在 setupButtons() 方法之后被点击时，更改评分视图的 rating 属性：\n\
  \n```\n@objc private func ratingButtonTapped(_ button: UIButton) {\n    guard let\
  \ index = ratingButtons.firstIndex(of: button) else {\n        fatalError(\"The\
  \ button, \\(button), is not in the ratingButtons array: \\(ratingButtons)\")\n\
  \    }\n    let selectedRating = index + 1\n    if selectedRating == rating {\n\
  \        rating = 0\n    } else {\n        rating = selectedRating\n    }\n}\n```\n\
  \n当 ratingButtons 数组中的按钮被点击时，guard 语句将该按钮的索引赋值给 index。然后 selectedRating 被设置为 index\
  \ + 1 的值。如果 rating 属性与 selectedRating 的值相同，则将其设置为 0；否则，将其设置为与 selectedRating 相同的值。\n\
  \n例如，假设你点击评分视图中的第三个星形图标。由于第三个星形图标是 ratingButtons 数组中的第三个元素，index 将被设置为 2，selectedRating\
  \ 将被设置为 2 + 1 = 3。假设 rating 属性的初始值为 0，则 selectedRating == rating 将返回 false，rating\
  \ 属性的值将被设置为 3。\n\n2. 在 setupButtons 方法的 for 循环中，在设置约束的语句之后，将此方法指定为按钮动作：\n\n```\n\
  button.widthAnchor.constraint(equalToConstant: starSize.width).\nisActive = true\n\
  button.addTarget(self, action: #selector(RatingView.\nratingButtonTapped(_:)), for:\
  \ .touchUpInside)\naddArrangedSubview(button)\n```\n\n3. 添加一个方法，根据在闭合花括号之前设置的 rating\
  \ 来更改按钮状态：\n\n```\nprivate func updateButtonSelectionStates() {\n    for (index,\
  \ button) in ratingButtons.enumerated() {\n        button.isSelected = index < rating\n\
  \    }\n}\n```\n\n为了了解其工作原理，假设 rating 属性设置为 3。每个按钮的默认状态是 .normal。\n\n第一个按钮位于索引 0，因此\
  \ button.isSelected 为 0 < 3，返回 true。由于 .selected 状态的图像是一个实心星形，该按钮的图像被设置为实心星形。接下来的两个按钮也是如此。\n\
  \n第四个按钮位于索引 3，因此 button.isSelected 为 3 < 3，返回 false。这意味着按钮的状态保持为 .normal。.normal\
  \ 状态的图像是星形轮廓，因此该按钮的图像被设置为星形轮廓。第五个按钮也是如此。\n\n简而言之，当 rating 属性设置为 3 时，评分视图显示前三个按钮为实心星形，其余两个按钮为星形轮廓。\n\
  \n4. 每次 rating 属性的值改变时，你都需要调用 updateButtonSelectionStates() 方法。为此，请按如下方式修改 rating\
  \ 属性：\n\n```\nvar rating = 0 {\n    didSet {\n        updateButtonSelectionStates()\n\
  \    }\n}\n```\n\n这称为属性观察器，每次 rating 属性的值改变时，都会调用 updateButtonSelectionStates()\
  \ 方法。\n\n你已完成评分视图的实现。在下一节中，你将把它添加到“添加新日志条目”屏幕。\n\n## 将自定义视图添加到“添加新日志条目”屏幕\n\n到目前为止，你已经在项目中创建了一个新的\
