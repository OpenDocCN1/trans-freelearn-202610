  }\n```\n\n此方法使 photoImageView 显示进度指示器，获取 bodyTextView 的内容作为图像生成的文本提示，并调用 generateAIImage(prompt:)\
  \ 方法。返回的图像被赋给 photoImageView 的 image 属性。\n\n\n\n\n\n4. 在你的 Mac 上构建并运行该应用，点击 + 按钮以显示“添加新日记条目”屏幕。在文本视图中输入描述你想要生成的图像的句子，然后长按图像视图。几秒钟后，基于你提供的描述生成的\
