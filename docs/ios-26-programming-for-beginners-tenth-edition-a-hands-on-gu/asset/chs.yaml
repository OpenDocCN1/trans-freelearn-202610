  ## Swift playground


  Playground 是交互式编码环境。您在左侧窗格中键入代码，结果会立即显示在右侧窗格中。这是试验代码和探索 iOS SDK 的好方法。


  - **边框 (9)**：此边框分隔**编辑器**和**结果**区域。您可以向左或向右拖动边框，以更改分配给每个区域的空间。

  - **调试区域 (10)**：这里显示 print() 命令的结果。

  - **运行和停止按钮 (11)**：执行或停止执行 playground 中的所有代码。

  - **调试按钮 (12)**：显示和隐藏调试区域。


  您可能会觉得 playground 中的文本太小且难以阅读。下一节让我们看看如何将其放大。


  ## 更改字体和颜色


  Xcode 提供了大量的自定义选项。您可以在**“设置...”**菜单中访问这些选项。如果您发现文本太小且难以看清，请按照以下步骤操作：


  1. 从 Xcode 菜单中选择**“设置...”**，以显示**“设置”**窗口。


  2. 在**“设置”**窗口中，点按**“主题”**，然后从弹出菜单中选择**“演示（浅色）”**，以使文本更大、更易于阅读：


