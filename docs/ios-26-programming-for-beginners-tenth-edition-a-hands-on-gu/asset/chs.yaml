  在开始项目之前，你将学习 iOS 开发中使用的一些常用术语。


  ## Useful terms in iOS development


  当你开始使用 UIKit 进行 iOS 应用开发时，你会遇到特殊的术语和定义。以下是一些最常用的术语和定义。现在先通读它们。即使你现在还不完全理解一切，随着你的进展，一切都会变得更清晰：


  - **View:** View 是 `UIView` 类或其子类的一个实例。你在屏幕上看到的任何东西（按钮、文本字段、标签等）都是一个 view。你将使用 views
  来构建你的 UI。


  > Classes are covered in *Chapter 7, Classes, Structures, and Enumerations.*


  - **Stack view:** Stack view 是 `UIStackView` 类的一个实例，它是 `UIView` 的子类。它用于将 views 以水平或垂直堆栈的方式分组。这使得它们更容易使用
  **Auto Layout** 在屏幕上定位，后者在本节后面讨论。


  - **View controller:** View controller 是 `UIViewController` 类的一个实例。每个 view controller
  都有一个 `view` 属性，其中包含对 view 的引用。它决定 view 向用户显示什么以及用户与 view 交互时发生什么。


  > View controllers will be discussed in detail in *Chapter 14, MVC and Table Views.*


  ## Total retail sales of consumer goods


  National Bureau of Statistics


  ![](img/0972ba626734a3986e095c788777818e_167_0.png)


  - **Model-View-Controller (MVC)**: 这是 iOS 应用开发中非常常见的设计模式。用户与屏幕上的 views 交互。应用数据存储在数据模型对象中。控制器管理
  views 与数据模型对象之间信息流。


  > MVC will be discussed in detail in *Chapter 14, MVC and Table Views.*


  - **Storyboard file**: Storyboard 文件包含用户所见内容的视觉表示。应用的每个屏幕都由一个 storyboard scene 表示。


  打开你在 *Chapter 1, Hello, Xcode* 中创建的 JRNL 项目，然后点击 Main storyboard 文件。


  ![](img/0972ba626734a3986e095c788777818e_170_0.png)


  你会在其中看到一个场景，并且当你在 **Simulator** 中运行你的应用时，该场景的内容将显示在屏幕上。Storyboard 文件中可以有多个场景。


  - **Segue**: 如果应用中有多个场景，你使用 segues 从一个场景移动到另一个场景。JRNL 项目没有 segues，因为其 storyboard
  文件中只有一个场景，但在本章后面的部分你会看到它们。


  - **Auto Layout:** 作为开发者，你必须确保你的应用在不同屏幕尺寸的设备上看起来都很好。Auto Layout 帮助你根据指定的 **constraints**
  布局你的 UI。例如，你可以设置一个约束以确保按钮无论屏幕尺寸如何都居中于屏幕，或使文本字段在设备从纵向旋转到横向时扩展到屏幕宽度。


