- "## Swift 并发\n\nApple 在 WWDC21 上推出了 **Swift 并发**，它为 Swift 5.5 添加了对结构化异步和并行编程的支持。它允许你编写更易读、更易理解的并发代码。在\
  \ WWDC24 期间，Apple 推出了 **Swift 6**，通过在编译时诊断**数据竞争**使并发编程更加容易。Swift 并发文档在 WWDC25 之后进一步更新。\n\
  \n> 目前，不建议为大型现有项目开启严格并发模式，因为这很可能会产生多个错误和警告。但是，由于这是 Apple 未来的发展方向，你将在本章以及本书*第三部分*的项目中开启它，以便你学习和积累相关经验。\n\
  \n在本章中，你将学习 Swift 并发的基本概念。接下来，你将检查一个没有使用并发的应用并探讨其问题。之后，你将使用 `async/await` 在应用中实现并发。最后，你将通过使用\
  \ `async-let` 使应用更高效。\n\n到本章结束时，你将学习到 Swift 并发工作的基础知识，以及如何更新你自己的应用来使用它。\n\n将涵盖以下主题：\n\
  \n- Swift 并发\n- 检查没有使用并发的应用\n- 使用 `async/await` 更新应用\n- 使用 `async-let` 提高效率\n\n\
  ## 技术要求\n\n我们将使用一个示例应用 *BreakfastMaker* 来理解 Swift 并发的概念。\n\n本章完整的 Xcode 项目位于本书代码包的\
