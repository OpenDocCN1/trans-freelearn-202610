  \        journalCell.photoImageView.image = UIImage(data:\n        photoData)\n\
  \    } else {\n        journalCell.photoImageView.image = nil\n    }\n    journalCell.dateLabel.text\
  \ =\n    journalEntry.date.formatted(\n        .dateTime.month().day().year()\n\
  \    )\n    journalCell.titleLabel.text = journalEntry.entryTitle\n    return journalCell\n\
  }\n```\n\n正如你所见，它们与你之前使用的表格视图数据源方法非常相似。\n\n9. 由于你现在使用的是集合视图，tableView(_:commit:forRowAt:)\
  \ 已无法再用于删除单元格。用以下方法替换 tableView(_:commit:forRowAt:) 方法：\n\n```\n// MARK: - UICollectionView\
  \ delete method\nfunc collectionView(_ collectionView: UICollectionView,\ncontextMenuConfigurationForItemsAt\
  \ indexPaths: [IndexPath], point: CGPoint) -> UIContextMenuConfiguration? {\n  \
  \  guard let indexPath = indexPaths.first else {\n        return nil\n    }\n  \
  \  let config = UIContextMenuConfiguration(previewProvider: nil) { elements -> UIMenu?\
  \ in\n        let delete = UIAction(title: \"Delete\") {\n            action in\n\
  \            if self.search.isActive {\n                let selectedJournalEntry\
  \ =\n                self.filteredTableData[indexPath.item]\n                self.filteredTableData.remove(at:\
  \ indexPath.item)\n                SharedData.shared\n                .removeSelectedJournalEntry(selectedJournalEntry)\n\
  \            } else {\n                SharedData.shared.removeJournalEntry(at:\n\
  \                indexPath.item)\n            }\n            collectionView.reloadData()\n\
  \        }\n        return UIMenu(children: [delete])\n    }\n    return config\n\
  }\n```\n\n而不是向左滑动删除，此方法实现了一个上下文菜单，其中包含一个选项 Delete，当你长按集合视图单元格时会出现该选项。\n\n10. 你还会在\
  \ prepare(for:sender:) 方法中看到一个错误。按所示修改 prepare(for:sender:) 方法中的 guard 语句：\n\n```\n\
  guard let journalEntryDetailViewController =\nsegue.destination as?\nJournalEntryDetailViewController,\
  \ let indexPath =\ncollectionView.indexPathsForSelectedItems?.first\nelse {\n  \
  \  fatalError(\"Could not get indexpath\")\n}\n```\n\nJournalListViewController\
  \ 中的所有错误都已解决。太棒了！在下一节中，你将添加代码以根据设备屏幕尺寸和方向更改集合视图单元格的大小。\n\n## 使用 size classes 动态修改集合视图单元格大小\n\
  \n如你之前所见，Journal List 屏幕上的表格视图使用单列排列的行来呈现表格视图单元格。这在 iPhone 上效果很好，但在 iPad 上运行应用程序时，如你所见，这会导致大量空间浪费。即使你可以使用相同的\
  \ UI 用于 iPhone 和 iPad，但最好能对其进行自定义以适应每个设备。\n\n为此，你将添加一些代码，以便你的应用程序能够识别其运行的屏幕大小，并动态修改集合视图中集合视图单元格的大小以适应。你可以使用\
  \ size classes 来识别当前屏幕大小；你将在下一节中了解它们。\n\n## Size classes\n\n要确定应用程序运行的屏幕大小，你必须考虑设备方向对\
  \ UI 的影响。由于在纵向和横向方向上存在各种屏幕尺寸，因此这可能具有挑战性。为了让它更简单，而不是使用设备的物理分辨率，你将使用 size classes。\n\
  \n> 有关 size classes 的更多信息，请参阅此链接：https://developer.apple.com/design/human-interface-guidelines/layout。\n\
  \nSize classes 是操作系统自动分配给视图的特征。定义了两个类别，描述视图的高度和宽度：regular（宽敞空间）和 compact（受限空间）。让我们看一下不同设备上全屏视图的\
  \ size classes：\n\n| 设备 | 纵向 | 横向 |\n|---|---|---|\n| iPad | Regular width<br>Regular\
  \ height | Regular width<br>Regular height |\n| iPhone 17 Pro Max | Compact width<br>Regular\
  \ height | Regular width<br>Compact height |\n| iPhone 16e | Compact width<br>Regular\
  \ height | Compact width<br>Compact height |\n\n图 22.33：不同 iOS 设备的 size classes\n\
  \n对于 JRNL 应用程序，你将配置 Journal List 屏幕中的集合视图，如果 size class 为 compact，则使用单列集合视图单元格，如果\
  \ size class 为 regular，则使用两列。\n\n你将向应用程序添加代码以确定当前 size class。一旦你知道 size class，你将能够设置要使用的列数以及集合视图中集合视图单元格的大小。你将在下一节中学习如何做到这一点。\n\
  \n## 修改 JournalListViewController 类\n\n你已经让 JournalListViewController 类采用了 UICollectionViewDelegateFlowLayout\
  \ 协议。现在你将使用 UICollectionViewFlowLayout 实例创建并设置集合视图的布局，并实现方法以动态设置集合视图单元格大小。\n\n按照以下步骤操作：\n\
  \n- 1. 在项目导航器中点击 JournalListViewController 文件。在 JournalListViewController 类中，在闭合大括号之前向类定义添加以下方法：\n\
  \n```\nfunc setupCollectionView() {\n    let flowLayout = UICollectionViewFlowLayout()\n\
  \    flowLayout.sectionInset = UIEdgeInsets(top: 10, left: 10,\n```\n\n2. 从 Device\
  \ 菜单中选择 Rotate Left，你仍然会看到两列，但单元格已扩展大小以填充屏幕：\n\n![](img/0972ba626734a3986e095c788777818e_503_0.png)\n\
  \n图 22.35：模拟器显示 iPad 屏幕向左旋转，显示两列\n\n3. 停止你的应用程序并从 Destination 菜单中选择 iPhone 16e。再次在模拟器上运行你的应用程序，它将显示单列，如图所示：\n\
  \n![](img/0972ba626734a3986e095c788777818e_503_1.png)\n\n图 22.36：模拟器显示 iPhone 屏幕，显示单列\n\
  \n模拟器在启动 iPhone 实例时不会自动关闭 iPad 实例。为获得更好的性能，请手动关闭 iPad 实例。\n\n\n\n\n\n6. 从 **Device**\
  \ 菜单中选择 **Rotate Left**，你会看到两列：\n\n![](img/0972ba626734a3986e095c788777818e_505_0.png)\n\
  \n*Figure 22.39: Simulator showing iPhone screen rotated with two columns*\n\n7.\
  \ 停止你的应用并在 **Destination** 菜单中选择 **My Mac (Designed for iPad)**。运行你的应用，它应该显示两列：\n\
  \n![](img/0972ba626734a3986e095c788777818e_505_1.png)\n\n*Figure 22.40: Mac app\
  \ with two columns*\n\n> 你需要一个免费或付费的 Apple 开发者账号才能在你的 Mac 上运行你的应用。\n\n你已修改你的应用以使用集合视图替代表格视图，并且已使其能够在不同设备上运行时动态修改集合视图单元格大小。干得好！\n"
- "## 23 Adopt Liquid Glass\n\n在 Apple 2025 年的 **Worldwide Developers Conference (WWDC)**\
  \ 上，他们在所有平台上引入了新的设计。其关键元素是一种名为 **Liquid Glass** 的新材质。UIKit 的外观和感觉已随此设计更新，因此你只需使用最新\
  \ SDK 重新编译应用即可。然而，仍有一些事情你可以做来完善应用的用户体验。\n\n在本章中，你将更新 *JRNL* 应用以利用新设计。首先，你将了解利用 Liquid\
  \ Glass 的新设计系统。接下来，你将修改你的应用以采用新设计。\n\n在本章结束时，你将学会如何为自己的应用实现新的设计系统。\n\n本章将涵盖以下主题：\n\
  \n- Meet Liquid Glass\n- Modify your app\n\n### Technical requirements\n\n你将继续在\
  \ *Chapter 22, Collection Views* 中修改的 JRNL 项目上工作。\n\n本章的资源文件和完成的 Xcode 项目位于本书代码包的\
  \ Chapter 23 文件夹中，可在此下载：\n\n```\nhttps://github.com/PacktPublishing/iOS-26-Programming-for-Beginners-10E\n\
  ```\n\n观看以下视频以查看代码运行情况：\n\nhttps://youtu.be/jkd0y2NbBbM\n\n让我们从下一节开始了解更多关于新设计系统和\
  \ Liquid Glass 的信息。\n\n### Meet Liquid Glass\n\nApple 的新 Liquid Glass 材质结合了玻璃的光学特性与流动感。控件和导航元素放置在不同的功能层上，并且用户体验被修改以使内容成为焦点。\n\
  \n要了解新设计系统的概览，请观看此视频：https://developer.apple.com/videos/play/wwdc2025/219/\n\n要了解新设计系统的最佳实践，请观看此视频：https://developer.apple.com/videos/play/wwdc2025/356/\n\
  \n使用最新 SDK 重新编译的应用用户界面会自动更新。然而，你可能需要对应用进行更改以充分拥抱新设计。\n\n要了解如何将应用更新为新设计，请观看此视频：https://developer.apple.com/videos/play/wwdc2025/284/\n\
  \n在本书中，你一直在使用标准用户界面元素来构建你的应用，除了你在第 19 章 Custom Views 中构建的 RatingView 元素。因此，当你使用\
  \ Xcode 26 构建和运行 JRNL 应用时，它会自动采用融入 Liquid Glass 的新设计。话虽如此，你仍可以对应用进行一些调整，你将在下一节学习如何做到这一点。\n\
  \n### Modify your app\n\n当你使用 Xcode 26 构建和运行 JRNL 应用时，你可以看到它已自动采用 Apple 的新设计，融入了\
  \ Liquid Glass。仍有一些修改可以进行以充分拥抱新的外观和感觉，具体如下：\n\n- Automatically minimize the tab\
  \ bar on scroll down\n- Add a subtitle showing the number of journal entries on\
  \ the Journal List screen\n- Add a Liquid Glass effect to the star buttons in RatingView\n\
  \n让我们看看如何实现这些更改，从下一节开始介绍向下滚动时最小化标签栏。\n\n### Minimize the tab bar on scroll down\n\
  \n在 iOS 26 中，标签栏已使用 Liquid Glass 外观更新。它浮动在你的内容之上，并且可以配置为在向上或向下滚动时最小化，保持对内容的关注。要在向下滚动时最小化标签栏，请按照以下步骤操作：\n\
  \n1. 在 Project navigator 中，单击 **JournalListViewController** 文件（位于 **Journal List\
  \ Scene** 组中）。在 viewDidLoad() 方法中添加以下行：\n\n```swift\n// MARK: - View controller\
  \ lifecycle\noverride func viewDidLoad() {\n    super.viewDidLoad()\n    tabBarController?.tabBarMinimizeBehavior\
  \ = .onScrollDown\n    setupCollectionView()\n}\n```\n\n2. 构建并运行你的项目。你会看到向下滚动时标签栏会最小化：\n\
  \n![](img/0972ba626734a3986e095c788777818e_511_0.png)\n\n*Figure 23.1: Minimized\
  \ tab bar on the Journal List screen*\n\n> 此功能在 iOS 26 的 beta 版本中可用，但在正式版中似乎无法工作。Apple\
  \ 可能会在以后恢复此功能。\n\n太好了！在下一节中，你将学习如何在 Journal List 屏幕中添加显示日记条目数量的副标题。\n\n### Add a\
  \ subtitle to the Journal List screen\n\n在 iOS 26 中，每个视图控制器的 UINavigationItem 对象获得了一个新的\
  \ subtitle 属性，它显示在标题下方。你将添加代码以在 Journal List 屏幕的标题下方显示日记条目数量。请按照以下步骤操作：\n\n1. 在\
  \ Project navigator 中单击 **JournalListViewController** 文件。在 setupCollectionView()\
  \ 方法之后添加一个新方法，以在 Journal List 屏幕的副标题中显示日记条目数量：\n\n```swift\nfunc updateSubtitleCount()\
  \ {\n    let noOfJournalEntries = SharedData.shared.numberOfJournalEntries\n   \
  \ switch noOfJournalEntries {\n    case 0:\n        navigationItem.subtitle = \"\
  No journal entries\"\n    case 1:\n        navigationItem.subtitle = \"1 journal\
  \ entry\"\n    default:\n        navigationItem.subtitle = \"\\(noOfJournalEntries)\
  \ journal entries\"\n    }\n}\n```\n\n2. 在 viewDidLoad() 中在闭合大括号之前调用 updateSubtitleCount()。这将在应用启动时在\
  \ Journal List 屏幕中显示日记条目数量：\n\n```swift\nnavigationItem.searchController = search\n\
  updateSubtitleCount()\n}\n```\n\n3. 当日记条目被删除时，需要更新显示的日记条目数量。修改 collectionView(_:contextMenuConfigurationForItemAt:point:)\
  \ 以在日记条目被删除时调用 updateSubtitleCount()：\n\n```swift\ncollectionView.reloadData()\n\
  self.updateSubtitleCount()\n}\nreturn UIMenu(children: [delete])\n```\n\n## Technical\
  \ requirements\n\n你将继续在 *Chapter 23, Adopt Liquid Glass* 中修改的 JRNL 项目上工作。\n\n本章的资源文件和完成的\
  \ Xcode 项目位于本书代码包的 Chapter 24 文件夹中，可在此下载：\n\nhttps://github.com/PacktPublishing/iOS-26-Programming-for-Beginners-10E\n\
  \n观看以下视频以查看代码运行情况：\n\nhttps://youtu.be/sShKNjo2jRs\n\n让我们从下一节开始了解 Icon Composer。\n\
  \n## About Icon Composer\n\n在 WWDC 2025 期间引入，Icon Composer 用于创建应用图标的单一文件表示。此文件包含所有\
  \ Apple 平台的所有图标和 widget 样式外观和尺寸。要创建初始图标 artwork，你可以使用你喜欢的设计工具，如 Photoshop 或 Canva。然后你将导出\
  \ artwork 的一个或多个图层并将其导入 Icon Composer。在 Icon Composer 中，你可以组织和美化 artwork，充分利用 Liquid\
  \ Glass 的动态属性。最后，你将把图标添加到你的项目中。\n\n要了解有关如何使用 Icon Composer 的更多信息，请观看此视频：\nhttps://developer.apple.com/videos/play/wwdc2025/361/\n\
  \nIcon Composer 文档可在以下链接获取：\nhttps://developer.apple.com/documentation/Xcode/creating-your-app-icon-using-icon-composer\n\
  \n![](img/0972ba626734a3986e095c788777818e_518_0.png)\n\n让我们在下一节中了解如何为图标的每个图层生成单独的图像。\n\
  \n## Creating images for each icon layer\n\n创建图标的典型方法将使用 Adobe Photoshop 或 Canva\
  \ 等应用。话虽如此，任何可以生成图标的单独图层作为单独文件的应用都可以使用。你将使用 Keynote，为 Apple Mac 免费，打开包含示例图标设计的演示文稿并将其导出为可在\
  \ Icon Composer 中使用的单独图层。\n\n\n\n\n请按照以下步骤操作：\n\n- 1. 如果你尚未安装 Keynote 应用，请通过此链接下载并安装：https://apps.apple.com/us/app/keynote/id409183694?mt=12\n\
  \n- 2. 在此链接下载本章的项目文件，这些文件位于本书代码包的 Chapter24 文件夹中：https://github.com/PacktPublishing/iOS-26-Programming-for-Beginners-10E\n\
  \n- 3. 打开 Chapter24 文件夹，打开 resources 文件夹，然后打开 JRNLImages 文件。你将看到一个包含四张幻灯片的 Keynote\
  \ 演示文稿，如下图所示：\n\n   ![](img/0972ba626734a3986e095c788777818e_519_0.png)\n\n   图\
  \ 24.1：JRNLImages 文件的内容\n\n- 4. 如果第一张幻灯片未被选中，请将其选中。点击工具栏上的“格式”按钮。注意“背景”设置为“无填充”，本演示文稿中的所有幻灯片都是如此。这是确保导出时背景透明所必需的：\n\
  \n   ![](img/0972ba626734a3986e095c788777818e_520_0.png)\n\n   图 24.2：背景设置为“无填充”的幻灯片\n\
  \n- 5. 点击工具栏上的“文稿”按钮。注意幻灯片大小设置为 1024 x 1024，这是 iOS 26 中图标所需的尺寸：\n\n   ![](img/0972ba626734a3986e095c788777818e_520_1.png)\n\
  \n   图 24.3：Keynote 文稿幻灯片大小设置为 1024 x 1024\n\n- 6. 从“文件”菜单中选择“导出为” | “图像...”：\n\n\
