  \n图 16.20：Connections inspector 显示 photoImageView outlet\n\n> 请记住，如果出错，你可以点击 x 按钮断开连接，然后再次从\
  \ outlet 拖到 UI 元素上。\n\n现在，你已成功将 **Entry Detail 场景**中的 UI 元素连接到 `JournalEntryDetailViewController`\
  \ 类中的 outlet。在下一节中，你将实现代码，以便当用户点击 Journal List 屏幕上的表格视图单元格时显示 `JournalEntry` 实例的详细信息。\n\
  \n## 显示日志条目的详细信息\n\n到目前为止，你已经实现了 `JournalEntryDetailViewController` 类，并将此类中的 outlet\
  \ 连接到 **Entry Detail 场景**中的标签、文本视图和图像视图。当用户点击 Journal List 屏幕上的表格视图单元格时，你将根据数据源获取对应的\
  \ `JournalEntry` 实例，并将其传递给 `JournalEntryDetailViewController` 实例，以便在 Journal Entry\
  \ Detail 屏幕上显示。为此，你将在 `JournalListViewController` 类中实现 `prepare(for:sender:)` 方法。请按以下步骤操作：\n\
  \n- 1. 在 Project navigator 中，点击 **Main** storyboard 文件，并点击连接 **Journal** 场景和 **Entry\
  \ Detail** 场景的 segue。点击 Attributes inspector 按钮，然后在 **Storyboard Segue** 下将 **Identifier**\
  \ 设置为 `entryDetail`：\n\n![](img/0972ba626734a3986e095c788777818e_361_0.png)\n\n\
  图 16.21：Attributes inspector 显示 Identifier 设置为 entryDetail\n\n稍后你将使用此标识符来识别从 Journal\
  \ List 屏幕转到 Journal Entry Detail 屏幕所用的 segue。\n\n我们来分解一下：\n\n```\nguard segue.identifier\
  \ == \"entryDetail\" else { return }\n```\n\n这段代码用于检查是否正在使用正确的 segue；如果不是，方法将退出。\n\
  \n```\nguard let journalEntryDetailViewController = segue.destination as?\nJournalEntryDetailViewController,\n\
  let indexPath = tableView.indexPathForSelectedRow else {\n    fatalError(\"Could\
  \ not get indexPath\")\n}\n```\n\n这段代码检查目标视图控制器是否是 `JournalEntryDetailViewController`\
  \ 的实例，获取用户点击的表格视图单元格，并获取该单元格的索引路径。\n\n```\nlet selectedJournalEntry = journalEntries[indexPath.row]\n\
  ```\n\n此语句从 `journalEntries` 数组中获取对应的 `JournalEntry` 实例。\n\n```\njournalEntryDetailViewController.selectedJournalEntry\
  \ =\nselectedJournalEntry\n```\n\n此语句将 `JournalEntry` 实例赋值给目标视图控制器的 `selectedJournalEntry`\
  \ 属性。\n\n现在，你已添加了代码，当从 Journal List 屏幕转到 Journal Entry Detail 屏幕时，会将用户点击的表格视图单元格对应的日志条目传递给\
  \ `JournalEntryDetailViewController` 实例。在下一节中，你将修改 `JournalEntryDetailViewController`\
  \ 类以显示日志条目的详细信息。\n\n## 修改 JournalEntryDetailViewController 以显示所选日志条目的详细信息\n\n当转到\
  \ Journal Entry Detail 屏幕时，与用户点击的表格视图单元格对应的 `JournalEntry` 实例将被赋值给 `JournalEntryDetailViewController`\
  \ 实例的 `selectedJournalEntry` 属性。你将在 `JournalEntryDetailViewController` 类中添加代码来访问此属性并显示日志条目的详细信息。请按以下步骤操作：\n\
  \n- 1. 在 Project navigator 中，点击 `JournalEntryDetailViewController` 文件，并按如下所示修改 `JournalEntryDetailViewController`\
  \ 类的 `viewDidLoad()` 方法，以显示日志条目的详细信息：\n\n```\noverride func viewDidLoad() {\n  \
  \  super.viewDidLoad()\n    dateLabel.text = selectedJournalEntry?.date.formatted(\n\
  \        .dateTime.day().month(.wide).year()\n    )\n    titleLabel.text = selectedJournalEntry?.title\n\
  \    bodyTextView.text = selectedJournalEntry?.body\n    photoImageView.image =\
  \ selectedJournalEntry?.photo\n}\n```\n\n如你所见，之前传递给此视图控制器的 `JournalEntry` 实例的属性被用来填充用户界面元素。请注意，`date`\
  \ 属性需要先格式化为字符串，然后才能赋值给 `dateLabel.text` 属性。\n\n- 2. 构建并运行你的项目，然后点击一个表格视图单元格。与该表格视图单元格对应的日志条目的详细信息将显示在\
  \ Journal Entry Detail 屏幕上：\n\n\n\n![](img/0972ba626734a3986e095c788777818e_365_0.png)\n\
  \n图 16.22：模拟器显示“日志条目详情”屏幕\n\n恭喜！您已成功为“日志条目详情”屏幕实现了一个视图控制器。现在，当用户在“日志列表”屏幕上点击表格视图单元格时，您将能够在其中显示日志条目详细信息。\n\
  \n## 17\n\n## Core Location 和 MapKit\n\n在上一章中，您学习了如何将数据从“添加新日志条目”屏幕传递到“日志列表”屏幕，以及从“日志列表”屏幕传递到“日志条目详情”屏幕。您还了解了\
  \ UITextFieldDelegate 和 UITextViewDelegate 方法。\n\n在本章中，您将学习如何使用 Apple 的 Core Location\
  \ 框架获取设备位置，以及如何使用 Apple 的 MapKit 框架设置地图区域、显示地图标注和创建地图快照。如果您打算构建使用地图的应用（如 Apple Maps\
  \ 或 Waze），这将非常有用。\n\n首先，您将修改“添加新日志条目”屏幕，以便用户可以将当前位置添加到新的日志条目中。接下来，您将创建一个 MapViewController\
  \ 类（“地图”屏幕的视图控制器），并将其配置为显示以您的位置为中心的地图区域。然后，您将更新 JournalEntry 类以遵守 MKAnnotation 协议，该协议允许您将日志条目作为地图标注添加到地图上。之后，您将修改\
  \ MapViewController 类，以便在您之前设置的地图区域内为每个日志条目显示一个图钉。您将配置图钉以显示标注气泡，并配置标注气泡中的按钮，以便在点击时显示“日志条目详情”屏幕。最后，您将修改\
  \ JournalEntryViewController 类，以在“日志条目详情”屏幕上显示一张地图快照，显示创建日志条目时的位置。\n\n学完本章，您将学会如何使用\
  \ Core Location 获取设备位置，以及如何使用 MapKit 指定地图区域、向地图添加地图标注视图以及创建地图快照。\n\n要了解有关 CLLocationManager\
  \ 类的更多信息，请访问 https://developer.apple.com/documentation/corelocation/configuring_your_app_to_use_location_services。\n\
  \n您可以在此处观看 Apple 关于简化位置更新的 WWDC 2023 视频：https://developer.apple.com/videos/play/wwdc2023/10180/。\n\
  \n由于位置信息被视为敏感的用户数据，您还需要获得使用定位服务的授权。您还可以检查由 CLLocationUpdate 类型的 liveUpdates 方法提供的位置更新的授权状态。\n\
  \n要了解有关请求使用定位服务授权的更多信息，请访问 https://developer.apple.com/documentation/corelocation/requesting_authorization_to_use_location_services。\n\
  \n您可以在此处观看 Apple 标题为*位置授权的新内容*的 WWDC 2024 视频：https://developer.apple.com/videos/play/wwdc2024/10212/。\n\
  \n在下一节中，您将修改 AddJournalEntryViewController 类，以便用户创建新日志条目时可以指定位置。\n\n### 修改 AddJournalEntryViewController\
  \ 类\n\n目前，“添加新日志条目”屏幕有一个“获取位置”开关，但它还不执行任何操作。您将为这个开关向 AddJournalEntryViewController\
  \ 类添加一个 outlet，并修改它，以便在开关打开时将您的位置添加到 JournalEntry 实例中。请按照以下步骤操作：\n\n- 1. 在项目导航器中，单击\
  \ AddJournalEntryViewController 文件。在该文件中，在 import UIKit 语句之后添加一条 import 语句，以导入 Core\
  \ Location 框架：\n\n```\nimport UIKit\nimport CoreLocation\n```\n\n- 2. 在文件中所有其他代码之后，为\
  \ AddJournalEntryViewController 类添加一个扩展：\n\n```\nextension AddJournalEntryViewController\
  \ {\n    // MARK: - CoreLocation\n}\n```\n\n- 3. 在 AddJournalEntryViewController\
  \ 类中所有其他 outlet 之后，为“获取位置”开关及其旁边的标签添加 outlet：\n\n```\n@IBOutlet var photoImageView:\
  \ UIImageView!\n@IBOutlet var saveButton: UIBarButtonItem!\n@IBOutlet var getLocationSwitch:\
  \ UISwitch!\n@IBOutlet var getLocationSwitchLabel: UILabel!\nvar newJournalEntry:\
  \ JournalEntry?\n```\n\n- 4. 在所有其他属性声明之后，添加属性以存储 CLLocationManager 类的实例、一个将管理位置更新的异步任务以及当前设备位置：\n\
  \n```\nvar newJournalEntry: JournalEntry?\nprivate let locationManager = CLLocationManager()\n\
  private var locationTask: Task<Void, Error>?\nprivate var currentLocation: CLLocation?\n\
  ```\n\n所有这些属性都是私有的，因为它们只会在此类中使用。\n\n- 5. 在 AddJournalEntryViewController 扩展的右花括号之前，实现一个用于确定用户位置的方法：\n\
  \n```\nprivate func fetchUserLocation() {\n    locationManager.requestWhenInUseAuthorization()\n\
  \    locationTask = Task {\n        for try await update in\n        CLLocationUpdate.liveUpdates()\
  \ {\n            if let location = update.location {\n                updateCurrentLocation(location)\n\
  \            } else if update.authorizationDenied {\n```\n\n```\nfailedToGetLocation(message:\
  \ \"Check Location\nServices settings for JRNL in Settings > Privacy\n& Security.\"\
  )\n} else if update.locationUnavailable {\n    failedToGetLocation(message: \"Location\n\
  Unavailable\")\n}\n}\n}\n}\n```\n\n下面来分析一下这段代码：\n\n```\nlocationManager.requestWhenInUseAuthorization()\n\
  ```\n\n此语句请求用户允许使用其位置信息。\n\n```\nlocationTask = Task {\n```\n\n此语句将一个持续获取位置更新的异步任务分配给\
  \ locationTask 属性。\n\n```\nfor try await update in\nCLLocationUpdate.liveUpdates()\
  \ {\n```\n\n此语句获取 CLLocation.liveUpdates() 提供的更新，并将每个更新分配给一个 update 实例。\n\n```\n\
  if let location = update.location {\n    updateCurrentLocation(location)\n}\n```\n\
  \n此语句从 update 实例中获取用户位置，并调用 updateCurrentLocation 方法。\n\n```\nelse if update.authorizationDenied\
  \ {\n    failedToGetLocation(message: \"Check Location\nServices settings for JRNL\
  \ in Settings > Privacy & Security.\")\n}\n```\n\n如果用户未授权使用其私人数据，此语句将调用 failedToGetLocation(message:)\
  \ 方法。\n\n```\nelse if update.locationUnavailable {\n    failedToGetLocation(message:\
  \ \"Location Unavailable\")\n}\n```\n\n如果用户的位置不可用，此语句将调用 failedToGetLocation(message:)\
