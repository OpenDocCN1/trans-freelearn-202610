  | 描述 | 记录生活中重要时刻的简单日记应用。 |\n| 关键词 | #Journal |\n| 支持 URL | https://tomafuwi.tumblr.com\
  \ |\n| 营销 URL | https://tomafuwi.tumblr.com |\n\n图 27.49：版本信息部分\n\n7. 滚动到常规应用信息部分，并填写所有必填详细信息：\n\
