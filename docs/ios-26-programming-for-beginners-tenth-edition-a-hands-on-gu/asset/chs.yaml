  \n![](img/0972ba626734a3986e095c788777818e_338_0.png)\n\n## 16\n\n## 在视图控制器之间传递数据\n\
  \n在上一章中，你配置了 `JournalListViewController` 类——日志列表屏幕的视图控制器——使其在表视图中显示来自包含示例数据的结构中的日志条目。\n\
  \n在本章中，你将学习如何在视图控制器之间传递数据。首先，你将为“添加新日志条目”屏幕实现一个视图控制器，然后添加代码，将数据从“添加新日志条目”屏幕传递到日志列表屏幕。接下来，你将学习如何在日志列表屏幕中移除日志条目。之后，你将学习文本字段和文本视图的委托方法，最后，你将把数据从日志列表屏幕传递到日志条目详情屏幕。\n\
  \n到本章结束时，你将学会如何在视图控制器之间传递数据，以及如何使用文本字段和文本视图的委托方法。这将使你能够在自己的应用中轻松地在视图控制器之间传递数据。\n\
  \n本章将涵盖以下主题：\n\n-   将数据从“添加新日志条目”屏幕传递到日志列表屏幕\n-   从表视图中移除行\n-   文本字段和文本视图的委托方法\n\
  -   将数据从日志列表屏幕传递到日志条目详情屏幕\n\n## 垂直切片架构\n\n在软件开发中，**垂直切片**是一个跨功能的端到端功能切片，贯穿应用程序的所有层。它是一个完整的、面向用户的功能，可以独立交付和演示。\n\
  \n垂直切片是在敏捷软件开发中广泛使用的一种技术，尤其在领域驱动设计（DDD）和微服务架构中。它强调交付小而有价值的功能增量，而不是横向分层。\n\n![](img/0972ba626734a3986e095c788777818e_341_0.png)\n\
  \n### 主要特性\n\n-   **跨功能：**垂直切片涉及所有层——UI、业务逻辑和数据访问。\n-   **以用户为中心：**每个切片对应一个特定的用户故事或用例。\n\
  -   **独立：**切片可以独立开发、测试和部署。\n-   **增量：**每个切片交付一个小而有价值的功能增量。\n\n### 优势\n\n-   更快的反馈循环\n\
  -   降低集成复杂性\n-   更好地与业务目标对齐\n-   更早发现架构问题\n\n`AddJournalEntryViewController` 文件现在已经创建，其中包含\
  \ `AddJournalEntryViewController` 类声明。你将把这个类设置为当你在日志列表屏幕中点击 + 按钮时呈现的视图控制器场景的自定义类。请按照以下步骤操作：\n\
  \n1.  在项目导航器中点击 Main storyboard 文件，然后在文档大纲中点击 New Entry Scene：\n\n![](img/0972ba626734a3986e095c788777818e_342_0.png)\n\
  \n图 16.1：编辑器区域显示 New Entry Scene\n\n2.  点击 Identity inspector 按钮，然后在 Custom Class\
  \ 下，将 Class 设置为 AddJournalEntryViewController：\n\n![](img/0972ba626734a3986e095c788777818e_342_1.png)\n\
  \n图 16.2：New Entry Scene 的 Identity inspector 设置\n\n很好！在下一节中，我们将把 New Entry Scene\
  \ 中的用户界面元素连接到 `AddJournalEntryViewController` 类中的输出口（outlets）。这样，`AddJournalEntryViewController`\
  \ 实例将能够访问用户在“添加新日志条目”屏幕上输入的数据。\n\n## 根据用户输入创建 JournalEntry 实例\n\n你已经实现了 `AddJournalEntryViewController`\
  \ 类，并将此类中的输出口连接到 New Entry Scene 中的文本字段、文本视图和图像视图。当用户在文本字段和文本视图中输入数据时，你可以使用这些信息来创建新的日志条目。\n\
  \n当视图控制器即将转换到另一个视图控制器时，会调用视图控制器的 `prepare(for:sender:)` 方法。你将实现此方法来创建新的 `JournalEntry`\
  \ 实例，然后可以将其传递给日志列表屏幕的视图控制器。请按照以下步骤操作：\n\n1.  在项目导航器中，点击 AddJournalEntryViewController\
  \ 文件，并在输出口声明之后向 AddJournalEntryViewController 类添加一个 newJournalEntry 属性：\n\n```\n\
  //MARK: - Properties\n@IBOutlet var titleTextField: UITextField!\n@IBOutlet var\
  \ bodyTextView: UITextView!\n@IBOutlet var photoImageView: UIImageView!\nvar newJournalEntry:\
  \ JournalEntry?\n```\n\n使用用户输入的数据创建的 JournalEntry 实例将被赋值给这个属性。\n\n2.  取消这个类中 `prepare(for:sender:)`\
  \ 方法的注释。它应该看起来像下面这样：\n\n![](img/0972ba626734a3986e095c788777818e_345_0.png)\n\n\
  图 16.6：编辑器区域显示 `prepare(for:sender:)` 方法\n\n此方法检查源视图控制器是否为 AddJournalEntryViewController\
  \ 类的实例，如果是，则从 newJournalEntry 属性获取 JournalEntry 实例。然后，该实例会被插入到 journalEntries 数组的第一项。之后，tableView.reloadData()\
  \ 语句将重新绘制表视图。\n\n2.  点击 Main storyboard 文件，并在文档大纲中展开 New Entry Scene。展开“< New Entry”导航项。按住\
  \ Ctrl 并将“Right Bar Button Items”下的 Save 按钮拖到场景出口，然后从弹出菜单中选择 unwindNewEntrySaveWithSegue:。\n\
  \n![](img/0972ba626734a3986e095c788777818e_347_0.png)\n\n当你运行项目时，点击 Save 按钮将从“添加新日志条目”屏幕过渡到日志列表屏幕，并执行\
  \ unwindNewEntrySave(segue:) 方法。\n\n2.  构建并运行你的项目。在任意一行上向左轻扫，以显示 Delete 按钮：\n\n\
