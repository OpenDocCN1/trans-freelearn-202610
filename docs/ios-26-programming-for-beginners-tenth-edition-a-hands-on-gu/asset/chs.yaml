  \ getAIImage(_:) 方法。现在，你将添加代码，以便在用户长按图像视图时生成 AI 图像。请按以下步骤操作：\n\n- 1. 在项目导航器中，点击\
  \ AddJournalEntryViewController 文件。在文件中的所有其他导入语句之后，添加一条导入语句以导入 ImagePlayground 框架：\n\
  \n```\nimport UIKit\nimport CoreLocation\nimport ImagePlayground\n```\n\n- 2. 在\
  \ getAIImage(_:) 方法之后添加以下私有方法：\n\n```\nprivate func generateAIImage(prompt: String)\
  \ async throws -> UIImage? {\n    var generatedImage: UIImage?\n    do {\n     \
  \   let creator = try await ImageCreator()\n        let images = creator.images(\n\
  \            for: [.text(prompt)],\n            style: .sketch,\n            limit:\
  \ 1)\n        for try await image in images {\n            let anImage = image.cgImage\n\
  \            generatedImage = UIImage(cgImage: anImage)\n}\n} catch {\n    generatedImage\
  \ = UIImage(systemName: \"exclamationmark.triangle\")\n    print(\"Image creation\
  \ error.\")\n}\nreturn generatedImage\n}\n```\n\n此方法实例化一个 ImageCreator 实例，并根据文本提示生成一张\
  \ AI 图像。此处使用了 `.sketch` 风格，如果你愿意，也可以尝试另外两种风格：`.animation` 和 `.illustration`。如果 AI\
