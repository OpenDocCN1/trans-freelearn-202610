  \ Text View 并点击 Add New Constraints 按钮。将左右约束设置为 8，然后点击 Add 2 Constraints 按钮。文本视图将扩展到几乎堆栈视图的整个宽度。验证文本字段和文本视图是否如下图所示：\n\
  \n![](img/0972ba626734a3986e095c788777818e_273_0.png)\n\nFigure 13.38: Text field\
  \ and text view in the stack view with a constraint applied\n\n所有定位问题现已解决。\n\n正如你所见，Journal\
