  \n## 小结\n\n在本章中，你为日志列表屏幕实现了模型对象，使其能够显示日志条目列表。你了解了将要使用的模型对象，创建了一个可用于存储日志条目实例的 Swift\
  \ 类，并创建了一个返回示例日志条目的静态方法。接着，你为你的表视图创建了一个自定义的 `UITableViewCell` 实例，并使用返回示例日志条目的方法来填充数组。该数组随后被用作日志列表屏幕中表视图的数据源。\n\
  \n你现在知道了如何创建模型对象、如何创建示例数据，以及如何配置视图控制器来使用示例数据填充表视图。如果你想创建自己的使用表视图的应用，这将非常有用。\n\n\
