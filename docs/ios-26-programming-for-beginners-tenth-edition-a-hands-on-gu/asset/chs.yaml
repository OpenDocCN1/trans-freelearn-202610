  *JRNL* 的 **用户界面 (UI)**。你将使用 Xcode 的 **Interface Builder** 来实现这一点，编码量将保持在最低限度。


  你将从学习本書中广泛使用的 iOS 应用开发常用术语开始。接下来，你将参观 *JRNL* 应用中使用的屏幕并了解用户如何使用该应用。之后，你将使用 Interface
  Builder 开始重建应用的 UI，从允许用户在 Journal List 和 Map 屏幕之间选择的标签栏开始。最后，你将为两个屏幕顶部添加导航栏并配置标签栏按钮。


  到本章结束时，你将学习 iOS 应用开发中常用的术语、你的应用流程会是什么样子，以及如何使用 Interface Builder 添加和配置 UI 元素。


