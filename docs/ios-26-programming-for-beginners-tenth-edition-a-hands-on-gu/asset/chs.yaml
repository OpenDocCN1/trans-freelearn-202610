- "## 6 Functions and Closures\n\n到目前为止，你可以编写相当复杂的程序，这些程序可以做出决策并重复指令序列。你也可以使用集合类型为程序存储数据。随着你编写的程序规模和复杂性增大，理解它们在做什么会变得更困难。\n\
  \n为了使大型程序更容易理解，Swift 允许你创建 **functions**，它让你可以将多个指令组合起来并通过调用单个名称来执行。你也可以创建 **closures**，它让你可以将多个指令组合起来而无需名称并将其分配给常量或变量。\n\
  \n到本章结束时，你将学习关于函数、嵌套函数、函数作为返回类型、函数作为参数以及 guard 语句的知识。你还将学习如何创建和使用闭包。\n\n本章将涵盖以下主题：\n\
  \n- Functions\n- Closures\n\n### Technical requirements\n\n本章的 Xcode playground\
  \ 位于本书代码包的 Chapter06 文件夹中，可在此下载：\n\nhttps://github.com/PacktPublishing/iOS-26-Programming-for-Beginners-10E\n\
  \n观看以下视频以查看代码的运行情况：\n\nhttps://youtu.be/Sv269qS-TGQ\n\n如果你想从头开始，创建一个新的 playground\
  \ 并将其命名为 FunctionsAndClosures。\n\n你可以在阅读过程中输入并运行本章中的所有代码。让我们先学习关于函数的内容。\n\n### Functions\n\
  \n函数对于封装执行特定任务的多个指令非常有用，例如以下内容：\n\n- 计算餐厅一顿饭的 10% 服务费\n- 计算你想要购买的汽车的月付款\n\n函数看起来像这样：\n\
  \n```\nfunc functionName(parameter1: ParameterType, ...) -> ReturnType {\n    code\n\
  }\n```\n\n每个函数都有一个描述性的名称。你可以定义函数作为输入接收的一个或多个值，称为 **parameters**。你也可以定义函数完成时将输出的内容，称为其\
  \ **return type**。参数和返回类型都是可选的。\n\n你“调用”函数的名称来执行它。这是一个函数调用的样子：\n\n```\nfunctionName(parameter1:\
  \ argument1, ...)\n```\n\n你提供输入值（称为 **arguments**），其类型与函数的参数匹配。\n\n要了解有关函数的更多信息，请访问\
  \ https://docs.swift.org/swift-book/documentation/the-swift-programming-language/functions/。\n\
  \n让我们在下一节中看看如何创建一个函数来计算服务费。\n\n#### Create a function\n\n在其最简单的形式中，函数只是执行一些指令并且没有任何参数或返回类型。你将通过编写一个函数来计算一顿饭的服务费来了解其工作原理。服务费应为餐费的\
  \ 10%。\n\n将以下代码添加到你的 playground 以创建并调用此函数并运行它：\n\n```\nfunc serviceCharge() {\n\
  \    let mealCost = 50\n    let serviceCharge = mealCost / 10\n    print(\"Service\
  \ charge is \\(serviceCharge)\")\n}\nserviceCharge()\n```\n\n你刚刚创建了一个非常简单的名为 serviceCharge()\
  \ 的函数。它所做的只是计算一顿价值 $50 的餐的 10% 服务费，即 50 / 10，结果为 5。然后你使用其名称调用此函数。你将在 Debug 区域看到\
  \ Service charge is 5 显示。\n\n这个函数并不是很有用，因为每次调用此函数时 mealCost 始终为 50。此外，结果仅在 Debug\
  \ 区域打印，无法在程序的其他地方使用。让我们为此函数添加一些参数和返回类型以使其更有用。\n\n按如下所示修改你的代码：\n\n```\nfunc serviceCharge(mealCost:\
  \ Int) -> Int {\n    return mealCost / 10\n}\nlet serviceChargeAmount = serviceCharge(mealCost:\
  \ 50)\nprint(serviceChargeAmount)\n```\n\n这样好多了。现在，你可以在调用 serviceCharge(mealCost:)\
  \ 函数时设置餐费，并且结果可以分配给变量或常量。它看起来有点别扭，不过。你应该尝试使 Swift 中的函数签名读起来像英语句子，因为这是最佳实践。让我们在下一节中看看如何做到这一点，在那里你将使用自定义标签使你的函数更像英语且更容易理解。\n\
  \n\n\n\n\n## 使用自定义参数标签\n\n请注意，serviceCharge(mealCost:) 函数读起来并不很像英语。你可以为参数添加自定义标签，使函数更易于理解。\n\
  \n按如下方式修改你的代码：\n\n```\nfunc serviceCharge(forMealPrice mealCost: Int) -> Int {\n\
  \    mealCost / 10\n}\nlet serviceChargeAmount = serviceCharge(forMealPrice: 50)\n\
  print(serviceChargeAmount)\n```\n\n该函数的工作方式与之前相同，但调用它时，你使用 serviceCharge(forMealPrice:)。这听起来更像英语，并且更容易弄清楚函数的作用。另外，请注意，如果你的函数体仅由单个语句组成，return\
  \ 关键字是可选的。\n\n在下一节中，你将学习如何在其他函数体内使用多个较小的函数，这些函数被称为嵌套函数。\n\n## 使用嵌套函数\n\n在另一个函数体内可以有一个函数，这些被称为嵌套函数。这允许你将几个相关的函数放在一起，使包含函数更易于理解。\n\
  \n嵌套函数可以使用包含函数的变量。让我们通过编写一个计算贷款月供的函数来看看嵌套函数是如何工作的。\n\n输入并运行以下代码：\n\n```\nfunc calculateMonthlyPayments(carPrice:\
  \ Double, downPayment: Double, interestRate: Double, paymentTerm: Double) -> Double\
  \ {\n    func loanAmount() -> Double {\n        carPrice - downPayment\n    }\n\
  \    func totalInterest() -> Double {\n        interestRate * paymentTerm\n    }\n\
  \    func numberOfMonths() -> Double {\n        paymentTerm * 12\n    }\n```\n\n\
  ```\nreturn ((loanAmount() + (loanAmount() *\n    totalInterest() / 100 )) / numberOfMonths())\n\
  }\ncalculateMonthlyPayments(carPrice: 50000, downPayment: 5000, interestRate: 3.5,\
  \ paymentTerm: 7.0)\n```\n\n这里，calculateMonthlyPayments(carPrice:downPayment:interestRate:paymentTerm:)\
  \ 内有三个函数。让我们来看看它们：\n\n- 第一个嵌套函数 loanAmount() 通过用 downPayment 从 carPrice 中减去来计算总贷款金额。它返回\
  \ 50000 - 5000 = 45000。\n- 第二个嵌套函数 totalInterest() 通过将 interestRate 乘以 paymentTerm\
  \ 来计算在还款期内产生的总利息。它返回 3.5 * 7 = 24.5。\n- 第三个嵌套函数 numberOfMonths() 通过将 paymentTerm\
  \ 乘以 12 来计算还款期的总月数。它返回 7 * 12 = 84。\n\n请注意，这三个嵌套函数都使用了包含函数的变量。返回的值是 ( 45000 + (\
  \ 45000 * 24.5 / 100 ) ) / 84 = 666.96，这是购买这辆车七年内每月必须支付的金额。\n\n正如你所见，Swift 中的函数就像其他语言中的函数，但它们有一个很酷的功能。函数在\
  \ Swift 中是第一类类型，因此可以用作参数和返回类型。让我们在下一节中看看这是如何完成的。\n\n## 使用函数作为返回类型\n\n一个函数可以返回另一个函数作为其返回类型。输入并运行以下代码以创建一个使用两种可能方法之一生成\
  \ pi 值的函数：\n\n```\nfunc approximateValueOfPi1() -> Double {\n    3.14159\n}\nfunc\
  \ approximateValueOfPi2() -> Double {\n    22.0 / 7.0\n}\n```\n\n```\nfunc pi()\
  \ -> (() -> Double) {\n    approximateValueOfPi1\n    // approximateValueOfPi2\n\
  }\npi()()\n```\n\napproximateValueOfPi1() 和 approximateValueOfPi2() 都是没有参数并返回 pi\
  \ 近似值的函数。pi() 函数的返回类型是一个没有参数并返回 Double 的函数。这意味着它可以返回 approximateValueOfPi1（正如这里所示）或\
  \ approximateValueOfPi2，因为这两个函数都匹配预期的返回类型。\n\npi()() 调用 approximateValueOfPi1 函数，它返回\
  \ 3.14159。3.14159 显示在结果区域。\n\n让我们在下一节中看看函数如何用作另一个函数的参数。\n\n## 使用函数作为参数\n\n一个函数可以接受另一个函数作为参数。输入并运行以下代码以创建一个函数，该函数确定在数字列表中是否存在满足特定条件的数字：\n\
  \n```\nfunc isThereAMatch(listOfNumbers: [Int], condition: (Int) -> Bool) -> Bool\n\
  {\n    for number in listOfNumbers {\n        if condition(number) {\n         \
  \   return true\n        }\n    }\n    return false\n}\nfunc numberIsOdd(number:\
  \ Int) -> Bool {\n    (number % 2) > 0\n}\nfunc numberIsEven(number: Int) -> Bool\
  \ {\n    (number % 2) == 0\n}\nlet numbersList = [1, 3, 5, 7]\nisThereAMatch(listOfNumbers:\
  \ numbersList, condition: numberIsOdd)\n```\n\nisThereAMatch(listOfNumbers:condition:)\
  \ 有两个参数：一个整数数组和一个函数。作为参数提供的函数必须接受一个整数值并返回一个布尔值。\n\nnumberIsOdd(number:) 和 numberIsEven(_:)\
  \ 都接受一个整数并返回一个布尔值，这意味着任一函数都可以作为第二个参数的参数。numbersList，一个包含奇数的数组，被用作第一个参数的参数。当 numberIsOdd\
  \ 用作第二个参数的参数时，isThereAMatch(listOfNumbers:condition:) 在调用时将返回 true。试着也使用 numberIsEven\
  \ 作为第二个参数的参数。\n\n作为参数和返回类型的函数可能难以理解，但在你学习的这个阶段相对较少见，所以如果你一开始不明白也不用担心。随着你获得经验，它会变得更清晰。\n\
  \n在下一节中，你将看到如果使用的参数不合适，如何对函数进行早期退出。\n\n## 使用 guard 语句提前退出函数\n\n假设你需要一个函数用于在线购买终端。此函数将在你购买某物时计算借记卡或信用卡的剩余余额。你想购买的商品价格输入到文本字段中。\n\
  \n文本字段中的值被转换为整数，以便你可以计算剩余的卡余额。如果输入数据有问题，能够提前退出函数是很有用的。\n\n输入并运行以下代码：\n\n```\nfunc\
  \ buySomething(itemValueEntered itemValueField: String, cardBalance: Int) -> Int\
  \ {\n    guard let itemValue = Int(itemValueField) else {\n        print(\"Error\
  \ in item value\")\n        return cardBalance\n    }\n    let remainingBalance\
  \ = cardBalance - itemValue\n    return remainingBalance\n}\nprint(buySomething(itemValueEntered:\
  \ \"10\", cardBalance: 50))\nprint(buySomething(itemValueEntered: \"blue\", cardBalance:\
  \ 50))\n```\n\n你应该在调试区域看到以下结果：\n\n```\n40\nError in item value\n50\n```\n\n让我们看看这个函数是如何工作的。函数体中的第一行是一个\
  \ guard 语句。它检查条件是否为真；如果不是，则退出函数。在这里，它用于检查用户是否在在线购买终端中输入了有效的价格。\n\n如果是，则该值可以成功转换为整数，并且你可以计算剩余的卡余额。否则，guard\
  \ 语句中的 else 子句将被执行。错误消息打印到调试区域，并返回未更改的卡余额。\n\n对于 print(buySomething(itemValueEntered:\
  \ \"10\", cardBalance: 50))，商品价格成功从卡余额中扣除，并返回 40。\n\n对于 print(buySomething(itemValueEntered:\
  \ \"blue\", cardBalance: 50))，guard 语句的条件失败，其 else 子句被执行，导致错误消息打印到调试区域并返回 50。\n\n\
  你现在知道如何创建和使用函数。你还看到了如何使用自定义参数标签、嵌套函数、作为参数或返回类型的函数以及 guard 语句。\n\n现在，让我们来看闭包。与函数一样，闭包允许你组合多个指令，但闭包没有名称，可以分配给常量或变量。你将在下一节中了解它们的工作原理。\n\
  \n## 闭包\n\n闭包像函数一样，包含一系列指令，可以接受参数并返回值。然而，闭包没有名称。闭包中的指令序列用大括号 ({ }) 包围，并且 in 关键字将参数和返回类型与闭包体分隔开。\n\
  \n闭包可以分配给常量或变量，因此如果需要在程序内部传递它们会很方便。例如，假设你有一个从互联网下载文件的应用程序，并且文件下载完成后需要对文件执行某些操作。你可以将处理文件的指令列表放在一个闭包中，并在文件下载完成后让程序执行它。\n\
  \n\n\n\n\n要了解有关闭包的更多信息，请访问 https://docs.swift.org/swift-book/documentation/the-swift-programming-language/closures/。\n\
  \n你现在将编写一个闭包，对数字数组的每个元素应用计算。将以下代码添加到你的 playground 中并点击 Run 按钮运行它：\n\n```\nvar numbersArray\
  \ = [2, 4, 6, 7]\nlet myClosure = { (number: Int) -> Int in\n    let result = number\
  \ * number\n    return result\n}\nlet mappedNumbers = numbersArray.map(myClosure)\n\
  ```\n\n这会将一个计算数字的平方的闭包赋给 myClosure。map() 函数随后将此闭包应用于 numbersArray 中的每个元素。每个元素都乘以自身，[4,\
  \ 16, 36, 49] 会出现在 Results 区域。\n\n闭包可以用更简洁的方式编写，你将在下一节中看到如何做到这一点。\n\n## 简化闭包\n\n\
  新开发者难以掌握的事情之一是经验丰富的 Swift 程序员用来编写闭包的非常简洁的方法。考虑以下示例中显示的代码：\n\n```\nvar testNumbers\
  \ = [2, 4, 6, 7]\nlet mappedTestNumbers = testNumbers.map({\n    (number: Int) ->\
  \ Int in\n    let result = number * number\n    return result\n})\nprint(mappedTestNumbers)\n\
  ```\n\n这里，你有 testNumbers，一个数字数组，并使用 map(_:) 函数将闭包映射到数组的每个元素。闭包中的代码将数字乘以自身，生成该数字的平方。结果\
  \ [4, 16, 36, 49] 然后打印到 Debug 区域。正如你将看到的，闭包代码可以写得更简洁。\n\n当闭包的类型已经已知时，你可以删除参数类型、返回类型或两者。单语句闭包隐式返回其唯一语句的值，这意味着你也可以删除\
  \ return 语句。因此，你可以按如下方式编写闭包：\n\n```\nlet mappedTestNumbers = testNumbers.map({ number\
  \ in\n    number * number\n})\n```\n\n当闭包是函数的唯一参数时，你可以省略包围闭包的括号，如下所示：\n\n```\nlet\
  \ mappedTestNumbers = testNumbers.map { number in\n    number * number\n}\n```\n\
  \n你可以通过表达它们在参数列表中的相对位置的数字来引用参数，而不是按名称引用，如下所示：\n\n```\nlet mappedTestNumbers = testNumbers.map\
  \ { $0 * $0 }\n```\n\n因此，闭包现在非常简洁，但对新开发者来说理解起来会很困难。随意以你感到舒适的方式编写闭包。\n\n你现在知道如何创建和使用闭包，以及如何更简洁地编写它们。太棒了！\n\
  \n## 总结\n\n在本章中，你学习了如何将语句分组为函数。你学习了如何使用自定义参数标签、函数内部的函数、函数作为返回类型、函数作为参数以及 guard 语句。当你需要在程序的不同点完成相同的任务时，这将很有用。\n\
  \n你还学习了如何创建闭包。这在你需要在程序中传递代码块时很有用。\n\n在下一章中，我们将研究类、结构体和枚举。类和结构体允许创建可以存储状态和行为的复杂对象，而枚举可用于限制可以分配给变量或常量的值，从而减少出错的可能性。\n"
- "## 7 类、结构体和枚举\n\n在上一章中，你学习了如何使用函数和闭包对指令序列进行分组。\n\n是时候思考如何在代码中表示复杂对象了。例如，考虑一辆汽车。你可以使用\
  \ String 常量存储汽车名称和 Double 变量存储汽车价格，但它们彼此没有关联。你已经看到你可以将指令分组以制作函数和闭包。\n\n在本章中，你将学习如何使用\
  \ **类** 和 **结构体** 将常量和变量分组为单个实体，以及如何操作它们。你还将学习如何使用 **枚举** 将一组相关值组合在一起。\n\n到本章结束时，你将学习如何创建和初始化一个类，从现有类创建子类，创建和初始化一个结构体，在类和结构体之间进行区分，以及创建枚举。\n\
  \n本章将涵盖以下主题：\n\n- 类\n- 结构体\n- 枚举\n\n## 技术要求\n\n本章的 Xcode playground 可以在本书代码包的 Chapter07\
  \ 文件夹中找到，可以在此处下载：\n\nhttps://github.com/PacktPublishing/iOS-26-Programming-for-Beginners-10E\n\
  \n观看以下视频以查看代码的运行情况：\n\nhttps://youtu.be/Fbh1FIdXxro\n\n如果你想从头开始，创建一个新的 playground\
  \ 并将其命名为 ClassesStructuresAndEnumerations。你可以在阅读过程中输入并运行本章中的所有代码。让我们从学习什么是类以及如何声明和定义它开始。\n\
  \n## 类\n\n类对于表示复杂对象很有用；以下是一些示例：\n\n- 公司员工的个人资料信息\n- 电子商务网站上的待售商品\n- 你为保险目的在家中拥有的物品\n\
  \n下面是类声明和定义的外观：\n\n```\nclass ClassName {\n    property1\n    property2\n    property3\n\
  \    method1() {\n        code\n    }\n    method2() {\n        code\n    }\n}\n\
  ```\n\n每个类都有一个描述性名称，并且包含用于表示对象的变量或常量。与类关联的变量或常量称为 **属性**。\n\n类还可以包含执行特定任务的函数。与类关联的函数称为\
  \ **方法**。\n\n一旦你声明并定义了类，你就可以创建该类的 **实例**。想象你正在为动物园创建应用程序。如果你有一个 Animal 类，你可以使用该类的实例来表示动物园中的不同动物。这些实例中的每一个都将具有不同的属性值。\n\
  \n要了解有关类的更多信息，请访问 https://docs.swift.org/swift-book/documentation/the-swift-programming-language/classes-and-structures。\n\
  \n让我们看看如何使用类。你将学习如何声明和定义类，基于类声明创建实例，并操作这些实例。你将通过在下一节中创建表示动物的类开始。\n\n### 创建类声明\n\n\
  让我们声明并定义一个可以存储动物详细信息的类。将以下代码添加到你的 playground：\n\n```\nclass Animal {\n    var name:\
  \ String = \"\"\n    var sound: String = \"\"\n    var numberOfLegs: Int = 0\n \
  \   var breathesOxygen: Bool = true\n    func makeSound() {\n        print(sound)\n\
  \    }\n}\n```\n\n你刚刚声明了一个名为 Animal 的非常简单的类。惯例规定类名以大写字母开头。此类具有属性来存储动物的名称、它发出的声音、它拥有的腿数以及它是否呼吸氧气。此类还具有一个方法\
  \ makeSound()，它将发出的噪音打印到 Debug 区域。\n\n现在你有了 Animal 类，让我们在下一节中使用它来创建一个代表动物的实例。\n\n\
  ### 创建类的实例\n\n一旦你声明并定义了类，你就可以创建该类的实例。你现在将创建 Animal 类的一个实例来表示一只猫。按照以下步骤操作：\n\n- 1.\
  \ 要创建 Animal 类的实例，列出其所有属性并调用其 makeSound() 方法。在类声明后输入以下代码并运行它：\n\n  ```\n  let cat\
  \ = Animal()\n  print(cat.name)\n  print(cat.sound)\n  print(cat.numberOfLegs)\n\
  \  print(cat.breathesOxygen)\n  cat.makeSound()\n  ```\n\n  你可以通过在实例名称后键入一个点，然后跟上你想要的属性或方法来访问实例属性和方法。你将在\
  \ Debug 区域看到实例属性和方法的调用值。由于这些值是创建类时分配的默认值，name 和 sound 包含空字符串，numberOfLegs 包含 0，breathesOxygen\
  \ 包含 true，并且 makeSound() 方法打印一个空字符串。\n\n- 2. 让我们为此实例的属性分配一些值。按如下方式修改你的代码：\n\n  ```\n\
  \  let cat = Animal()\n  cat.name = \"Cat\"\n  cat.sound = \"Mew\"\n  cat.numberOfLegs\
  \ = 4\n  cat.breathesOxygen = true\n  print(cat.name)\n  print(cat.sound)\n  print(cat.numberOfLegs)\n\
  \  print(cat.breathesOxygen)\n  cat.makeSound()\n  ```\n\n  现在，当你运行程序时，以下内容会显示在\
  \ Debug 区域：\n\n  ```\n  Cat\n  Mew\n  4\n  true\n  Mew\n  ```\n\n  所有实例属性的值和 makeSound()\
  \ 方法的结果都打印到 Debug 区域。\n\n\n\n\n\n请注意，这里你先创建实例，然后再为该实例赋值。也可以在创建实例时就赋值，你可以在类声明中实现一个初始化器来做到这一点。\n\
  \n- 3. 初始化器负责确保在创建类时所有实例属性都有有效值。让我们为 Animal 类添加一个初始化器。按如下所示修改你的类定义：\n\n```\nclass\
  \ Animal {\n    var name: String\n    var sound: String\n    var numberOfLegs: Int\n\
  \    var breathesOxygen: Bool\n    init(name: String, sound: String, numberOfLegs:\
  \ Int, breathesOxygen: Bool) {\n        self.name = name\n        self.sound = sound\n\
  \        self.numberOfLegs = numberOfLegs\n        self.breathesOxygen = breathesOxygen\n\
  \    }\n    func makeSound() {\n        print(sound)\n    }\n}\n```\n\n如你所见，初始化器使用\
  \ init 关键字，并有一组参数用于设置属性值。请注意，self 关键字区分了属性名和参数名。例如，self.name 指的是属性，而 name 指的是参数。\n\
  \n在初始化过程结束时，类中的每个属性都应具有有效值。\n\n- 4. 此时你的代码会出现一些错误，因为函数调用没有任何参数。你需要更新函数调用来解决这个问题。按如下所示修改你的代码并运行它：\n\
  \n```\nfunc makeSound() {\n    print(sound)\n}\n\nlet cat = Animal(name: \"Cat\"\
  , sound: \"Mew\", numberOfLegs: 4, breathesOxygen: true)\nprint(cat.name)\n```\n\
  \n结果与第 2 步中的结果相同，但你在一个指令中创建了实例并设置了其属性。太棒了！\n\n现在有不同类型的动物，例如哺乳动物、鸟类、爬行动物和鱼类。你可以为每种类型创建类，但也可以基于现有类创建子类。让我们在下一节中看看如何做到这一点。\n\
  \n### 创建子类\n\n类的子类继承了现有类的所有方法和属性。你也可以根据需要添加额外的属性和方法。例如，对于一家 IT 公司，你可以将 CustomerSupportAgent\
  \ 作为 Employee 的子类。该类将具有 Employee 类的所有属性，以及客户支持角色所需的额外属性。\n\n你现在将创建 Mammal，它是 Animal\
  \ 类的子类。按照以下步骤操作：\n\n- 1. 要声明 Mammal 类，在 Animal 类声明之后输入以下代码：\n\n```\nclass Mammal:\
  \ Animal {\n    let hasFurOrHair: Bool = true\n}\n```\n\n在类名后输入 : Animal 使 Mammal\
  \ 类成为 Animal 类的子类。它具有 Animal 类中声明的所有属性和方法，以及一个额外属性：hasFurOrHair。由于 Animal 类是 Mammal\
  \ 类的父类，你可以将其称为 Mammal 类的超类。\n\n- 2. 按如下所示修改创建类实例的代码并运行它：\n\n```\nlet cat = Mammal(name:\
  \ \"Cat\", sound: \"Mew\", numberOfLegs: 4, breathesOxygen: true)\n```\n\ncat 现在是\
  \ Mammal 类的实例，而不是 Animal 类的实例。如你所见，Debug 区域中显示的结果与之前相同，并且没有错误。hasFurOrHair 的值尚未显示。让我们修复这个问题。\n\
  \n- 3. 在游乐场中所有其他代码之后输入以下代码以显示 hasFurOrHair 属性的内容并运行它：\n\n```\nprint(cat.hasFurOrHair)\n\
  ```\n\n由于 Animal 类的初始化器没有为 hasFurOrHair 分配值的参数，因此使用默认值，true 将在 Debug 区域中显示。\n\n\
  你已经看到子类可以具有额外的属性。子类也可以具有额外的方法，并且子类中的方法实现可以与超类实现不同。让我们在下一节中看看如何做到这一点。\n\n### 重写超类方法\n\
  \n到目前为止，你一直在使用多个 print() 语句来显示类实例的值。你将实现一个 description() 方法来在 Debug 区域中显示所有实例属性，因此不再需要多个\
  \ print() 语句。按照以下步骤操作：\n\n- 1. 按如下所示修改你的 Animal 类声明以实现 description() 方法：\n\n```\n\
  class Animal {\n    var name: String\n    var sound: String\n    var numberOfLegs:\
  \ Int\n    var breathesOxygen: Bool = true\n    init(name: String, sound: String,\
  \ numberOfLegs:\n    Int, breathesOxygen: Bool) {\n        self.name = name\n  \
  \      self.sound = sound\n        self.numberOfLegs = numberOfLegs\n        self.breathesOxygen\
  \ = breathesOxygen\n    }\n    func makeSound() {\n        print(sound)\n    }\n\
  \    func description() -> String {\n    \"name: \\(name) sound: \\(sound)\n   \
  \ numberOfLegs: \\(numberOfLegs)\n    breathesOxygen: \\(breathesOxygen)\"\n   \
  \ }\n}\n```\n\ndescription() 方法根据 trafficLightColor 的值返回一个字符串。由于 trafficLightColor\
  \ 的值是 TrafficLightColor.red，因此 red 将出现在 Debug 区域中。\n\n你已经学习了如何创建和使用枚举来存储分组值，以及如何向它们添加方法。干得好！\n\
  \n### 总结\n\n在本章中，你学习了如何使用类声明复杂对象、创建类的实例、创建子类以及重写类方法。你还学习了如何声明结构体、创建结构体的实例，并理解引用类型和值类型之间的区别。最后，你学习了如何使用枚举来表示一组特定值。\n\
  \n你现在知道如何使用类和结构体在自己的程序中表示复杂对象，以及如何使用枚举将相关值分组在一起。\n\n在下一章中，你将学习如何使用协议在类和结构体中指定通用特征、使用扩展扩展内置类的功能，以及在程序中处理错误。\n\
