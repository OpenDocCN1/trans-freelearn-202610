  ## Preface


  Welcome to *iOS 26 Programming for Beginners*. This book is the tenth edition of
  the *iOS Programming for Beginners* series, and has been fully updated for iOS 26,
  macOS Tahoe 26, and Xcode 26.


  In this book, you will build a journal app called JRNL. You will start off by exploring
  Xcode, Apple’s programming environment, also known as its **Integrated Development
  Environment (IDE)**. Next, you will start learning the foundations of Swift, the
  programming language used in iOS apps, and see how it is used to accomplish common
  programming tasks.


  Once you have a solid foundation of using Swift, you will start creating the user
  interface of the JRNL app. During this process, you will work with storyboards and
  connect your app’s scenes together using segues.


  With your user interface complete, you will then add code to implement your app’s
  functionality. To start, you’ll learn how to display data using a table view. Next,
  you’ll learn how to add data to your app, and how to pass data between view controllers.
  After that, you’ll learn how to determine your device location and display annotations
  on a map. You’ll then learn how to persist app data using JSON files, create custom
  views, and add photos from the camera or photo library. Finally, you’ll make your
  app work on devices with larger screens, such as an iPad or Mac, by implementing
  a collection view in place of a table view.


  You now have a complete app, but how about adding the latest iOS 26 features? You’ll
  start by learning how to update your app’s user interface to Apple’s new design
  language across all its platforms. Next, you will learn how to create cool icons
  using Icon Composer. After that, you’ll learn how to implement Apple Intelligence
  features and the Foundation Models framework into your apps.


  Finally, you’ll learn how to test your app with internal and external testers and
  get it into the App Store.


  ## Who this book is for


  This book is tailored for individuals with minimal coding experience who are new
  to the world of Swift and iOS app development. A basic understanding of programming
  concepts is recommended.


  ## What this book covers


  *Chapter 1, Hello, Xcode,* takes you through a tour of Xcode and talks about all
  the different parts that you will use throughout the book.


  *Chapter 2, Simple Values and Types,* deals with how values and types are implemented
  by the Swift language.


  *Chapter 3, Conditionals and Optionals,* shows how if and switch statements are
  implemented, and how to implement variables that may or may not have a value.


  *Chapter 4, Range Operators and Loops,* shows how to work with ranges and the different
  ways loops are implemented in Swift.


  *Chapter 5, Collection Types,* covers the common collection types, which are arrays,
  dictionaries, and sets.


  *Chapter 6, Functions and Closures,* covers how you can group instructions together
  using functions and closures.


  *Chapter 7, Classes, Structures, and Enumerations,* talks about how complex objects
  containing state and behavior are represented in Swift.


  *Chapter 8, Protocols, Extensions, and Error Handling,* talks about creating protocols
  that complex data types can adopt, extending the capabilities of existing types,
  and how to handle errors in your code.


  *Chapter 9, Swift Concurrency,* introduces you to the concepts of parallel and asynchronous
  programming, and shows you how you can implement them in your app.


  *Chapter 10, Set Up the User Interface,* deals with creating the JRNL app and setting
  up the initial screen that the users will see.


  *Chapter 11, Build the User Interface,* covers setting up the main screen for the
  JRNL app.


  *Chapter 12, Complete the User Interface,* covers setting up the remaining screens
  for the JRNL app.


  *Chapter 13, Modify App Screens,* is about configuring each screen of the app in
  a storyboard.


  To complete all the exercises in this book, you will need the following:


  - A Mac computer running macOS 15.0 Sequoia, macOS 26 Tahoe, or later

  - Xcode 26.0 or later


  To check whether your Mac supports macOS Tahoe 26, use this link: https://www.apple.com/my/os/macos/.
  If your Mac is supported, you can update macOS using **Software Update** in **System
  Settings**.


  To get the latest version of Xcode, you can download it from the Apple App Store.
  Most of the exercises can be completed without an Apple Developer account and use
  the iOS Simulator. If you wish to test the app you are developing on an actual iOS
  device, you will need a free or paid Apple Developer account.


  The following chapter requires a paid Apple Developer account: *Chapter 27, Test
  and Submit Your App to the App Store*. Instructions on how to get a paid Apple Developer
  account are included.


