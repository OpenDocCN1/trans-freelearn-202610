  \n\n\n\n\n## 15\n\n## 将数据导入表格视图\n\n在上一章中，你学习了模型-视图-控制器（MVC）设计模式和表格视图。你还回顾了《日志列表》屏幕中的表格视图。此时，《日志列表》屏幕显示的单元格中不包含任何数据。如第\
  \ 10 章《设置用户界面》中的应用导览所示，它应该显示一份日志条目列表。\n\n在本章中，你将实现《日志列表》屏幕的模型对象，使其显示日志条目列表。你将首先学习将要使用的模型对象的需求。然后，你将创建一个可以存储日志条目实例的\
  \ Swift 类。之后，你将创建一个静态方法，该方法返回包含示例日志条目实例的数组。此数组将用作《日志列表》屏幕上表格视图的数据源。\n\n到本章结束时，你将学会如何创建模型对象，如何创建示例数据，以及如何配置视图控制器以填充表格视图。\n\
  \n本章将涵盖以下主题：\n\n- 模型对象\n- 创建一个类来表示日志条目\n- 创建示例数据\n- 在集合视图中显示数据\n\n## 技术要求\n\n你将继续在\
  \ *第 13 章《修改应用屏幕》* 中修改的 JRNL 项目上工作。本章的资源文件和完成的 Xcode 项目位于本书代码包的第 15 章文件夹中，可在此下载：\n\
  \nhttps://github.com/PacktPublishing/iOS-26-Programming-for-Beginners-10E\n\n观看以下视频以查看代码运行情况：\n\
  \nhttps://youtu.be/E-xh-3_x1YY\n\n让我们先在下一节中检查存储日志条目数据所需的模型对象。\n\n## 模型对象\n\n如你在\
  \ *第 14 章《MVC 与表格视图》* 中所学，iOS 应用的常见设计模式是 MVC。回顾一下，MVC 将应用分为三个不同的部分：\n\n- **模型：**\
  \ 处理数据存储、表示和数据处理任务\n- **视图：** 用户可以在屏幕上与之交互的任何内容\n- **控制器：** 管理模型和视图之间信息流\n\n让我们重新回顾一下你在应用导览中看到的《日志列表》屏幕的设计，其外观如下：\n\
  \n![](img/0972ba626734a3986e095c788777818e_312_0.png)\n\n*图 15.1：模拟器显示来自应用导览的《日志列表》屏幕*\n\
  \n在第 14 章《MVC 与表格视图》中，你使用字符串数组来表示日志条目。然而，字符串数组只能存储字符串，而你必须能够存储除字符串之外的数据类型。为了解决这个问题，你将创建一个名为\
  \ JournalEntry 的类来存储日志条目所需的所有数据。接下来，你将创建一个静态方法，该方法返回存储在 JournalEntry 实例数组中的示例数据。之后，你将创建一个自定义\
  \ UITableView 类来管理表格视图单元格显示的数据。最后，你将修改 JournalListViewController 类，使其能够为表格视图提供要显示的数据。\n\
  \n## 创建一个类来表示日志条目\n\n为了创建一个可以代表应用中日志条目的模型对象，你将向项目中添加一个名为 JournalEntry 的新 Swift 文件，并声明一个\
  \ JournalEntry 类，该类具有日志条目所需的属性。在此之前，你将配置项目以使用 Swift 6 并将主项目文件夹更改为组。请按照以下步骤操作：\n\n\
  1. 在项目导航器中，单击左上角的 JRNL 图标。单击 JRNL 目标并选择 Build Settings。向下滚动到 Swift Compiler - Language\
  \ 并将 Swift Language Version 设置为 Swift 6：\n\n![](img/0972ba626734a3986e095c788777818e_314_0.png)\n\
  \n图 15.3：编辑器区域显示 Build Settings，其中 Swift 6 已设置\n\n2. 右键单击 JRNL 图标下方的蓝色 JRNL 项目文件夹，并选择\
  \ Convert to Group：\n\n图 15.4：弹出菜单中选择了 Convert to Group\n\n6. 你现在将为《日志列表》屏幕中使用的模型和视图对象创建组。右键单击《日志列表屏幕》组并选择\
  \ New Group：\n\n![](img/0972ba626734a3986e095c788777818e_318_0.png)\n\n图 15.8：弹出菜单中选择了\
  \ New Group\n\n9. 你现在将创建一个文件，其中包含 JournalEntry 类的实现。右键单击 Model 文件夹并选择 New File from\
  \ Template…：\n\n![](img/0972ba626734a3986e095c788777818e_320_0.png)\n\n图 15.11：弹出菜单中选择了\
  \ New File from Template…\n\n10. iOS 应该已经选择。选择 Swift File 并单击 Next：\n\n![](img/0972ba626734a3986e095c788777818e_321_0.png)\n\
  \n图 15.12：选择新文件模板，其中 Swift File 已被选中\n\n11. 将文件命名为 JournalEntry 然后单击 Create。文件将出现在项目导航器中，其内容将出现在编辑器区域中：\n\
  \n![](img/0972ba626734a3986e095c788777818e_321_1.png)\n\n图 15.13：编辑器区域显示 JournalEntry\
  \ 文件的内容\n\n让我们分解一下：\n\n- date 属性为 Date 类型，将存储日志条目创建的日期。\n- rating 属性为 Int 类型，将存储日志条目的星级数量。\n\
  - title 属性为 String 类型，将存储日志条目的标题文本。\n- body 属性为 String 类型，将存储日志条目的正文文本。\n- photo\
  \ 属性为 UIImage? 类型，将存储照片。这是一个可选属性，因为并非所有日志条目都需要照片。\n- latitude 和 longitude 属性为 Double?\
  \ 类型，将存储日志条目创建的位置。这些是可选属性，因为并非所有日志条目都需要位置。\n\n将出现一个错误，因为你的类没有初始化器。\n\n15. 在 longitude\
  \ 属性之后添加以下代码以实现初始化器：\n\n```\n// MARK: - Initialization\ninit?(rating: Int, title:\
  \ String, body: String, photo: UIImage? = nil, latitude: Double? = nil, longitude:\
  \ Double? = nil) {\n    if title.isEmpty || body.isEmpty || rating < 0 || rating\
  \ > 5 {\n        return nil\n    }\n    self.date = Date()\n    self.rating = rating\n\
  \    self.title = title\n    self.body = body\n    self.photo = photo\n    self.latitude\
  \ = latitude\n    self.longitude = longitude\n}\n```\n\n类在第 7 章《类、结构体和枚举》中介绍。\n\n\
  让我们分解一下：\n\n```\ninit?(rating: Int, title: String, body: String, photo: UIImage?\
  \ =\n nil, latitude: Double? = nil, longitude: Double? = nil) {\n```\n\nJournalEntry\
  \ 类的初始化器具有 Int 值、两个 String 值、一个可选 UIImage 值和两个可选 Double 值的参数。所有可选值的默认值均为 nil。init\
  \ 关键字后的问号表示这是一个可失败的初始化器；如果某些条件未满足，它将不会创建 JournalEntry 实例。\n\n```\nif title.isEmpty\
  \ || body.isEmpty || rating < 0 || rating > 5 {\n    return nil\n}\n```\n\n如果以下任一条件返回\
  \ true，则初始化器将失败创建 JournalEntry 实例；title 为空，body 为空，rating 小于 0，且 rating 大于 5。\n\n\
  ```\nself.date = Date()\n```\n\n此语句创建一个 Date 对象，其默认为当前日期，并在创建 JournalEntry 实例时将其分配给\
  \ date 属性。\n\n```\nself.rating = rating\nself.title = title\nself.body = body\n\
  self.photo = photo\nself.latitude = latitude\nself.longitude = longitude\n```\n\n\
  这些语句将参数值分配给 JournalEntry 实例的相应属性。注意使用 self 来区分具有相同名称的属性和参数。\n\n\n\n\n\n```swift\n\
  let photo2 = UIImage(systemName: \"cloud\")\nlet photo3 = UIImage(systemName: \"\
  cloud.sun\")\nguard let journalEntry1 = JournalEntry(rating: 5, title: \"Good\"\
  , body: \"Today is a good day\", photo: photo1) else {\n    fatalError(\"Unable\
  \ to instantiate journalEntry1\")\n}\nguard let journalEntry2 = JournalEntry(rating:\
  \ 0, title: \"Bad\", body: \"Today is a bad day\", photo: photo2) else {\n    fatalError(\"\
  Unable to instantiate journalEntry2\")\n}\nguard let journalEntry3 = JournalEntry(rating:\
  \ 3, title: \"OK\", body: \"Today is an OK day\", photo: photo3) else {\n    fatalError(\"\
  Unable to instantiate journalEntry3\")\n}\nreturn [journalEntry1, journalEntry2,\
  \ journalEntry3]\n}\n```\n\n该扩展包含一个 `createSampleJournalEntryData()` 方法，该方法使用来自\
  \ Apple SFSymbols 库的符号创建三个 `UIImage` 实例，创建三个 `JournalEntry` 实例，将它们添加到一个数组中并返回该数组。`static`\
  \ 关键字表示它是在 `JournalEntry` 类型上的方法，而不是 `JournalEntry` 实例方法。\n\n要了解有关类型方法和实例方法的更多信息，请参阅此链接：https://docs.swift.org/swift-book/documentation/the-swift-programming-language/methods/。\n\
  \n您现在已完成 `JournalEntry` 类的实现。您还添加了一个静态方法来生成三个示例日记条目。在下一节中，您将修改 `JournalListViewController`\
  \ 类以使用此方法返回的数组来填充表格视图。\n\n按照以下步骤操作：\n\n- 1. 在项目导航器中，右键单击 View 文件夹并选择 New File from\
  \ Template....\n- 2. iOS 应该已经选中。选择 Cocoa Touch Class，然后单击 Next：\n\n    ![](img/0972ba626734a3986e095c788777818e_328_0.png)\n\
  \n    图 15.15：选择新文件模板的屏幕\n\n    使用 Cocoa Touch Class 模板将允许您设置超类并自动为将要创建的类插入样板代码。\n\
  \n- 3. 将出现“为新文件选择选项”屏幕：\n\n    ![](img/0972ba626734a3986e095c788777818e_329_0.png)\n\
