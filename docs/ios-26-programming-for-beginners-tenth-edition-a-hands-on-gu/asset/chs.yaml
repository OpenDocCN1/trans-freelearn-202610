  \n观看以下视频以了解代码的运行情况：\n\nhttps://youtu.be/UY9AB8TLjOU\n\n让我们开始修改 Add New Journal Entry\
  \ 屏幕以显示一个 image picker controller，该控制器允许你使用设备相机或从用户照片库中选择照片。\n\n## Create a new\
  \ UIImagePickerController instance\n\n为了让用户轻松使用相机或照片库，Apple 实现了 UIImagePickerController\
  \ 类。该类管理用于拍摄照片和从用户照片库中选择项目的系统界面。该类的一个实例称为 image picker controller，它可以在屏幕上显示 image\
  \ picker。\n\n如果你曾经向社交媒体帖子添加过照片，你就会知道 image picker 的样子。它通常显示来自你相机的视图或来自你照片库的照片网格，然后你可以选择一张照片添加到你的帖子中：\n\
  \n![](img/0972ba626734a3986e095c788777818e_444_0.png)\n\n图 20.1：Simulator 显示 image\
  \ picker\n\n5. 你应该在 assistant editor 中看到 AddJournalEntryViewController 文件的内容。从文档大纲中的\
  \ Tap Gesture Recognizer Ctrl + Drag 到 locationSwitchValueChanged(_:) 方法与闭合大括号之间的空间：\n\
  \n![](img/0972ba626734a3986e095c788777818e_447_0.png)\n\n图 20.5：Editor 区域显示拖放目标\n\
  \n6. 在弹出对话框中，将 Name 设置为 getPhoto，Type 设置为 UITapGestureRecognizer。点击 Connect：\n\n\
  ![](img/0972ba626734a3986e095c788777818e_447_1.png)\n\n图 20.6：用于 action 创建的弹出对话框\n\
  \n2. 按如下所示修改 getPhoto() 方法：\n\n```\n@IBAction func getPhoto(_ sender: UITapGestureRecognizer)\
  \ {\n    let imagePickerController = UIImagePickerController()\n    imagePickerController.delegate\
  \ = self\n    #if targetEnvironment(simulator)\n    imagePickerController.sourceType\
  \ = .photoLibrary\n    #else\n    imagePickerController.sourceType = .camera\n \
  \   imagePickerController.showsCameraControls = true\n    #endif\n    present(imagePickerController,\
  \ animated: true)\n}\n```\n\n让我们分解一下：\n\n```\nlet imagePickerController = UIImagePickerController()\n\
  ```\n\n此语句创建 UIImagePickerController 类的一个实例并将其分配给 imagePickerController。\n\n```\n\
  imagePickerController.delegate = self\n```\n\n此语句将 image picker controller 的 delegate\
  \ 属性设置为 AddJournalEntryViewController 实例。\n\n```\n#if targetEnvironment(simulator)\n\
  imagePickerController.sourceType = .photoLibrary\n#else\nimagePickerController.sourceType\
  \ = .camera\nimagePickerController.showsCameraControls = true\n#endif\n```\n\n这段代码称为条件编译块。它以\
  \ #if 编译指令开始，以 #endif 编译指令结束。如果你在 Simulator 中运行，则只会编译设置 image picker controller\
  \ 的 sourceType 属性为照片库的语句。如果你在实际设备上运行，则会编译设置 image picker controller 的 sourceType\
  \ 属性为相机并显示相机控件的语句。这意味着 image picker controller 在 Simulator 中运行时将使用照片库，在实际设备上运行时将使用相机。\n\
  \n你可以在此链接了解有关条件编译块的更多信息：https://docs.swift.org/swift-book/documentation/the-swift-programming-language/statements/#Conditional-Compilation-Block。\n\
  \n```\npresent(imagePickerController, animated: true)\n```\n\n此语句将 image picker\
  \ controller 呈现在屏幕上。\n\n你已实现呈现 image picker controller 所需的所有代码，当点击 image view 时会触发它。在下一节中，你将实现在用户选择图像或取消时会被调用的\
  \ UIImagePickerControllerDelegate 方法。\n\n## Implement UIImagePickerControllerDelegate\
  \ methods\n\nUIImagePickerControllerDelegate 协议有一组你必须在 delegate 对象中实现的方法，以便与 image\
  \ picker controller 界面交互。\n\n要了解有关 UIImagePickerControllerDelegate 协议的更多信息，请参阅 https://developer.apple.com/documentation/uikit/uiimagepickercontrollerdelegate。\n\
  \n当 image picker controller 出现在屏幕上时，用户可以选择照片或取消。如果用户取消，则会触发 imagePickerControllerDidCancel(_:)\
  \ 方法，如果用户选择照片，则会触发 imagePickerController(_:didFinishPickingMediaWithInfo:) 方法。\n\
  \n你现在将在 AddJournalEntryViewController 类中实现这些方法。在 Project navigator 中，点击 AddJournalEntryViewController\
  \ 文件。在 UIImagePickerControllerDelegate extension 中输入以下代码：\n\n```\n// MARK: - UIImagePickerControllerDelegate\n\
  func imagePickerControllerDidCancel(_ picker: UIImagePickerController) {\n    dismiss(animated:\
  \ true)\n}\nfunc imagePickerController(_ picker: UIImagePickerController, didFinishPickingMediaWithInfo\
  \ info: [UIImagePickerController.InfoKey: Any]) {\n    guard let selectedImage =\
  \ info[.originalImage] as? UIImage else {\n        fatalError(\"Expected a dictionary\
  \ containing an image, but was provided the following: \\(info)\")\n    }\n    let\
  \ smallerImage = selectedImage.preparingThumbnail(of: CGSize(width: 300, height:\
  \ 300))\n    photoImageView.image = smallerImage\n    dismiss(animated: true)\n\
  }\n```\n\nimagePickerControllerDidCancel(_:) 方法在用户取消时触发。image picker controller\
  \ 将被 dismiss，用户将被返回到 Add New Journal Entry 屏幕。\n\nimagePickerController(_:didFinishPickingMediaWithInfo:)\
  \ 方法在用户选择照片时触发。此照片随后被分配给 selectedImage。接下来，selectedImage 实例的 preparingThumbnail(of:)\
  \ 方法将被用来创建一个宽度和高度均为 300 points 的较小图像，与 Journal Entry Detail 屏幕上 image view 的大小相同。此图像随后将被分配给\
  \ photoImageView 属性，image picker controller 将被 dismiss。\n\n你可以在此链接了解有关 preparingThumbnail(of:)\
  \ 方法的更多信息：https://developer.apple.com/documentation/uikit/uiimage/3750835-preparingthumbnail。\n\
  \n所有必需的 `UIImagePickerController` delegate 方法都已实现。在下一节中，你将修改 `Info.plist` 文件，以便你的应用在请求使用相机或照片库时请求权限。\n\
