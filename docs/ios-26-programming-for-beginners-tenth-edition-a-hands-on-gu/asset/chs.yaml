  - 用于拍摄手机相机照片的 image view\n- 显示地图位置的 image view\n\n此外，你需要滚动以查看整个屏幕。你现在将对其进行修改以匹配应用导览中显示的设计，首先从设置下一节中表视图单元格的数量和大小开始。\n\
