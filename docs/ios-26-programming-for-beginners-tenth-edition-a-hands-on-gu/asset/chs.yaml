  \n## 配置大头针以显示标注气泡\n\n目前，地图界面显示标准的 `MKAnnotationView` 实例，它们看起来像大头针。点击大头针只会使其变大。`MKAnnotationView`\
  \ 实例可以配置为在点击时显示标注气泡。要实现这一点，你将实现 `mapView(_:viewFor:)` 方法，这是 `MKMapViewDelegate`\
  \ 协议的一个可选方法。请按照以下步骤操作：\n\n- 1. 在项目导航器中点击 `MapViewController` 文件。在 `MKMapViewDelegate`\
  \ 扩展中，在左花括号之后添加以下方法：\n\n```\n// MARK: - MKMapViewDelegate\nfunc mapView(_ mapView:\
  \ MKMapView, viewFor annotation: any MKAnnotation) -> MKAnnotationView? {\n    let\
  \ identifier = \"mapAnnotation\"\n    guard annotation is JournalEntry else {\n\
  \        return nil\n    }\n    if let annotationView =\n    mapView.dequeueReusableAnnotationView(withIdentifier:\n\
  \    identifier) {\n        annotationView.annotation = annotation\n        return\
  \ annotationView\n    } else {\n        let annotationView =\n        MKMarkerAnnotationView(annotation:annotation,\n\
  \        reuseIdentifier:identifier)\n        annotationView.canShowCallout = true\n\
  \        let calloutButton = UIButton(type: .detailDisclosure)\n        annotationView.rightCalloutAccessoryView\
  \ = calloutButton\n        return annotationView\n    }\n}\n```\n\n## 火星的气候\n\n\
  火星的气候几个世纪以来一直是科学好奇的话题，部分原因是火星是唯一一颗可以从地球直接详细观测其表面的行星。\n\n尽管火星比地球小，但其气候具有重要的相似之处，例如极地冰盖的存在、季节变化以及可观测的天气模式。它吸引了火星车和轨道飞行器的持续研究。\n\
  \n- 火星的大气层约有 95% 是二氧化碳。\n- 平均表面温度约为 −63°C。\n- 由于火星的轴向倾斜，它拥有与地球相似的季节。\n\n![](img/0972ba626734a3986e095c788777818e_394_0.png)\n\
  \n与地球相比，火星大气层很稀薄，表面压力平均约为 610 帕斯卡（0.088 psi），远低于地球的 101.3 千帕。\n\n| 属性 | 火星 | 地球\
  \ |\n| --- | --- | --- |\n| 直径（千米） | 6,779 | 12,742 |\n| 表面重力（米/秒²） | 3.71 | 9.81\
  \ |\n| 平均温度（°C） | −63 | 15 |\n| 大气 CO₂（%） | 95.3 | 0.04 |\n\n> “火星是我们在太阳系中最接近另一个地球的存在，但它的气候仍然陌生而严酷。”\n\
  \n未来的任务旨在更深入地了解火星的气候历史，包括液态水的作用以及过去存在生命的可能性。\n\n```\nMartianSol = 1.0275 * EarthDay\n\
  if temperature < 273.15:\n    print(\"Water ice stable\")\n```\n\n\n\n前面已完成。\n\n\
  ```swift\nannotationView.canShowCallout = true\nlet calloutButton = UIButton(type:\
  \ .detailDisclosure)\nannotationView.rightCalloutAccessoryView = calloutButton\n\
  ```\n\n为这个 `MKAnnotationView` 实例配置了标注气泡。当你点击地图上的大头针时，会出现一个标注气泡，显示标题（日志条目日期）、副标题（日志条目标题）和一个按钮。稍后你将编写该按钮的代码，让它呈现日志条目详情屏幕。\n\
  \n```swift\nreturn annotationView\n```\n\n返回自定义的 `MKAnnotationView` 实例。\n\n> 如需了解更多关于\
  \ `mapView(_:viewFor:)` 方法的信息，请参阅 https://developer.apple.com/documentation/mapkit/mkmapviewdelegate/1452045-mapview。\n\
  \n- 2. 构建并运行你的应用，然后使用模拟器的 **Features | Location** 菜单将位置设置为 Apple。你应在地图屏幕上看到一个大头针。点击该大头针即可显示标注气泡：\n\
