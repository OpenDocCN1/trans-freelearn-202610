  \ 设置\n\n您刚刚声明并定义了 `JournalListTableViewCell` 类，并将其分配为 journalCell 表视图单元格的自定义表视图单元格子类。在下一节中，您将把此类连接到\
  \ journalCell 表视图单元格中的图像视图和标签，以便您可以控制它们的显示内容。\n\n## 连接 journalCell 中的 outlets\n\n\
