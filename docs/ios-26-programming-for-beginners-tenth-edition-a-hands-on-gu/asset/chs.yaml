  图 10.13：文档大纲中已选择 View Controller


  +   4. 你将把现有视图控制器场景嵌入到标签栏控制器场景中。从 Editor 菜单中选择 Embed In | Tab Bar Controller：


  ![](img/0972ba626734a3986e095c788777818e_177_2.png)


