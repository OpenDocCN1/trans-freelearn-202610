- "## 26\n\n## Foundation Models\n\nApple 在 WWDC25 期间推出了 **Foundation Models** 框架。这是一个新的框架，可让你访问\
  \ Apple 的设备端大型语言模型。此基于文本的模型可根据提示生成新的文本。\n\n在本章中，你将为 *JRNL* 应用配置一个新屏幕，该屏幕将使用 Foundation\
  \ Models 框架帮助你撰写日记条目。\n\n你将首先了解 Foundation Models 框架。接下来，你将查看 *JRNL* 应用的一个版本，其中添加了一个额外的标签页。该标签页显示一个新屏幕，允许你为大型语言模型输入提示并显示结果文本，但目前还无法使用。之后，你将添加代码来实现所需功能，最后，你将测试应用以查看其工作原理。\n\
  \n在本章结束时，你将学习 Foundation Models 框架的基础知识以及如何将其实现到自己的应用中。\n\n将涵盖以下主题：\n\n- - 关于 Foundation\
  \ Models\n- - 查看 Assist 屏幕\n- - 实现 Foundation Models 框架\n\n### 技术要求\n\n你将使用 JRNL\
  \ 项目的修改版本，该版本已添加了新屏幕。\n\n本章完成的 Xcode 项目位于本书代码包的 Chapter26 文件夹中，可在此处下载：\n\nhttps://github.com/PacktPublishing/iOS-26-Programming-for-Beginners-10E\n\
  \n观看以下视频以查看代码运行情况：\n\nhttps://youtu.be/ImS27Gb0KRk\n\n让我们先了解 Foundation Models 框架及其工作原理。\n\
  \n### 关于 Foundation Models\n\nFoundation Models 框架是你在上一章学到的 Apple Intelligence 功能的核心。它位于设备上，因此无需互联网连接即可工作。你可以使用它在应用中实现智能功能，例如文本生成、文本提取和摘要。\n\
  \n要观看 Apple 关于 Foundation Models 框架的 WWDC2025 视频，请参阅此链接：https://developer.apple.com/videos/play/wwdc2025/286/。要查看\
  \ Apple 开发者文档中关于 Foundation Models 框架的内容，请参阅此链接：https://developer.apple.com/documentation/foundationmodels。\n\
  \n在撰写日记条目时，你可能会发现表达自己很困难。如果能以某种方式创建示例日记条目，然后再根据自己的需要进行自定义，那就太好了。使用 Foundation Models\
  \ 框架，你可以为 JRNL 应用实现一个屏幕，用户可以在其中输入提示并生成示例日记条目。在下一节中，你将查看具有此类屏幕的 JRNL 应用版本。\n\n###\
  \ 查看 Assist 屏幕\n\n为了允许用户输入提示并生成示例日记条目，需要用户界面。你将查看 JRNL 应用的一个版本，其中添加了一个名为 Assist\
  \ 屏幕的新屏幕。该屏幕有一个文本字段，用户可以在其中输入提示，结果随后显示在文本视图中。用户可以根据需要修改文本视图中的文本。\n\n当你点击 **Assist**\
  \ 标签时，应用将显示此视图控制器的屏幕。用户随后可以在文本字段中输入提示，点击 **Generate** 按钮，并在文本视图中查看生成的文本。\n\n你可能希望回顾本书的\
  \ *第 2 部分*，其中介绍了如何使用 Interface Builder 为应用创建用户界面，并尝试使用 *第 25 章 Apple Intelligence*\
  \ 中的 JRNL 项目作为起点，自己创建此屏幕。\n\n4. 在项目导航器中点击 **Assist Screen** 文件夹中的 **AssistViewController**\
  \ 文件。你应该在编辑器区域中看到以下代码：\n\n```\nimport UIKit\n\nclass AssistViewController: UIViewController\
  \ {\n\n    // MARK: - Properties\n    @IBOutlet var promptTextField: UITextField!\n\
  \    @IBOutlet var resultTextView: UITextView!\n\n    // MARK: - View controller\
  \ lifecycle\n    override func viewDidLoad() {\n        super.viewDidLoad()\n  \
  \      promptTextField.delegate = self\n        resultTextView.delegate = self\n\
  \    }\n\n    // MARK: - Actions\n    @IBAction func generateButtonTapped(_ sender:\
  \ UIButton) {\n        resultTextView.text = \"Generating...\"\n        let prompt\
  \ = promptTextField.text ?? \"\"\n        resultTextView.text = \"The generated\
  \ text from this prompt: \\\n        (prompt)\"\n    }\n}\n\nextension AssistViewController:\
  \ UITextFieldDelegate,\nUITextViewDelegate {\n```\n\n```\n// MARK: - UITextFieldDelegate\n\
  func textFieldShouldReturn(_ textField: UITextField) -> Bool {\n    textField.resignFirstResponder()\n\
  \    return true\n}\n\n// MARK: - UITextViewDelegate\nfunc textView(_ textView:\
  \ UITextView, shouldChangeTextInRanges ranges: [NSValue], replacementText text:\
  \ String) -> Bool {\n    if (text == \"\\n\") {\n        textView.resignFirstResponder()\n\
  \    }\n    return true\n}\n```\n\n如你所见，AssistViewController 类有两个 outlet 分别链接到 Assist\
  \ Scene 中的文本字段和文本视图，以及一个链接到按钮的 action。当按钮被点击时，文本视图中的文本被设置为 \"Generating...\"，文本字段中的文本被赋给\
  \ prompt。文本视图中的文本随后显示 \"The generated text from this prompt:\" 后跟 prompt 的内容。\n\n\
  在你的 Mac 上构建并运行该应用。点击 Assist 标签以显示 Assist 屏幕。在文本字段中输入一些文本并点击 Generate 按钮。文本视图随后将显示\
  \ The generated text from this prompt: 后跟你之前在文本字段中输入的文本，如下所示：\n\n![](img/0972ba626734a3986e095c788777818e_565_0.png)\n\
  \n图 26.2：在你的 Mac 上运行的应用显示 Assist 标签\n\n现在你熟悉了 Assist 屏幕，在下一节中，你将添加 Foundation Models\
  \ 框架并实现此屏幕的功能。\n\n### 实现 Foundation Models 框架\n\n如你所见，当点击 Generate 按钮时，应用会显示你在文本字段中输入的提示。为了实现所需功能，首先，你需要检查系统语言模型是否可用。然后，你将实现一个方法，使用\
  \ LanguageModelSession() 的实例基于你的提示生成文本。最后，你将向按钮 action 添加代码以调用此方法并在文本视图中显示生成的文本。\n\
  \n> 要查看 Apple 关于使用 Foundation Models 生成内容和执行任务的文档，请参阅此链接：https://developer.apple.com/documentation/foundationmodels/generating-content-and-performing-tasks-with-foundation-models。\n\
  \n使用 Foundation Models 框架，你将添加代码以便应用可以根据你输入的提示生成文本。按照以下步骤操作：\n\n- 1. 在项目导航器中点击 Assist\
  \ Screen 文件夹中的 AssistViewController 文件。\n- 2. 在 import 语句之后添加导入 Foundation Models\
  \ 框架的代码：\n\n```\nimport UIKit\nimport FoundationModels\n```\n\n- 3. 在 outlet 声明之后添加一个将被分配\
  \ LanguageModelSession() 实例的属性：\n\n```\n// MARK: - Properties\n@IBOutlet var promptTextField:\
  \ UITextField!\n@IBOutlet var resultTextView: UITextView!\n\nprivate let session\
  \ = LanguageModelSession(instructions: \"Your job is to write a journal entry for\
  \ the user based on the short description provided.\")\n\n// MARK: - View controller\
  \ lifecycle\noverride func viewDidLoad() {\n```\n\n\n\n\n\n4. 并非所有设备都支持 Apple Intelligence。在\
  \ `AssistViewController` 类中，在 `session` 属性之后添加一个属性，用于检查系统语言模型的可用性：\n\n```\nprivate\
  \ let session = LanguageModelSession(instructions: \"Your job is to write a journal\
  \ entry for the user based on the short description provided.\")\nprivate var isSystemLanguageModelAvailable:\
  \ Bool {\n    let model = SystemLanguageModel.default\n    switch model.availability\
  \ {\n    case .available:\n        return true\n    case .unavailable(.deviceNotEligible):\n\
  \        print(\"Device not eligible\")\n        return false\n    case .unavailable(.appleIntelligenceNotEnabled):\n\
  \        print(\"Apple Intelligence not enabled\")\n        return false\n    case\
  \ .unavailable(.modelNotReady):\n        print(\"Model not ready\")\n        return\
  \ false\n    case .unavailable(_):\n        print(\"Model not available for unknown\
  \ reason\")\n        return false\n    }\n}\n```\n\n5. 在 `AssistViewController`\
  \ 类中，在右花括号前实现一个方法，该方法将使用 `LanguageModelSession()` 实例根据提示生成文本：\n\n```\n// MARK: -\
  \ Private methods\nprivate func generateResult(prompt: String) async -> String {\n\
  \    do {\n        let result = try await session.respond(to: prompt)\n        return\
  \ result.content\n    } catch {\n        return \"Could not generate content, please\
  \ try again.\"\n    }\n}\n```\n\n7. 在你的 Mac 上构建并运行你的应用。点击 Assist 标签页。在文本字段中输入提示，然后点击\
  \ Generate 按钮。你的应用应在文本视图中显示生成的文本，如下所示：\n\n![](img/0972ba626734a3986e095c788777818e_569_0.png)\n\
  \n图 26.3：Assist 屏幕显示根据提示生成的文本\n\n8. 你可以通过输入额外的提示来修改已生成的文本，如下所示：\n\n![](img/0972ba626734a3986e095c788777818e_570_0.png)\n\
  \n图 26.4：Assist 屏幕显示由第二个提示修改后的生成文本\n\n至此，你已成功将 Foundation Models 框架添加到你的应用中！干得漂亮！\n\
  \n## 本章小结\n\n在本章中，你将 Foundation Models 框架添加到了你的应用中，并使用它根据提示生成文本。\n\n你首先了解了 Foundation\
  \ Models 框架。接着，你查看了一个新增了标签页的 JRNL 应用版本。之后，你添加了代码来实现所需功能，最后测试了应用，看它能否根据你输入的提示生成文本。\n\
  \n现在你已经掌握了 Foundation Models 框架的基础知识，以及如何为自己的应用实现它。\n\n在下一章中，你将学习如何测试并将你的应用提交到 App\
  \ Store。\n\n## 加入我们的 Discord\n\n与其他用户、专家以及作者本人一起阅读这本书。\n\n提出问题、为其他读者提供解决方案，通过 Ask\
  \ Me Anything 环节与作者聊天等等。扫描二维码或访问链接加入社区。\n\nhttps://packt.link/LdIDT/\n\n![](img/0972ba626734a3986e095c788777818e_571_0.png)\n\
  \n## 技术要求\n\n你需要一个 Apple 账户和一个付费的 Apple Developer 账户才能完成本章内容。\n\n本章没有项目文件，因为它应作为如何提交应用的参考，并不针对任何特定应用。\n\
  \n要查看 App Store 的最新更新，请访问 https://developer.apple.com/app-store/whats-new/。\n\n\
  要了解 App Store Connect 的新功能，请观看此视频：\nhttps://developer.apple.com/videos/play/wwdc2025/328/。\n\
  \n让我们从下一节开始，学习如何获取付费的 Apple Developer 账户，这是提交到 App Store 所必需的。\n\n## 获取 Apple Developer\
  \ 账户\n\n如你在前面章节中所见，要在设备上测试应用，你只需要一个免费的 Apple 账户。但是，这些应用只能运行几天，而且你将无法添加高级功能，例如“通过\
  \ Apple 登录”或将应用上传到 App Store。为此，你需要一个付费的 Apple Developer 账户。请按照以下步骤购买个人/个体工商户 Apple\
  \ Developer 账户：\n\n1. 前往 https://developer.apple.com/programs/ 并点击 Enroll 按钮。\n\
  2. 点击 Start your enrollment。\n3. 在提示时输入你的 Apple 账户和密码。\n4. 在“信任此浏览器？”屏幕上，只有当你本人是此浏览器的唯一使用者时才点击\
  \ Trust，否则点击 Not Now。这是为了保护你的账户信息安全。\n5. 点击 Continue enrollment on the web >。\n\
  6. 在“确认你的个人信息”屏幕上，输入你的个人信息并点击 Continue。\n7. 在“选择你的实体类型”屏幕上，选择 Individual/Sole Proprietor。点击\
  \ Continue。\n8. 在“查看并接受”屏幕上，勾选页面底部的复选框，然后点击 Continue。\n9. 在“完成购买”屏幕上，点击 Purchase。\n\
  10. 按照屏幕上的指示完成购买。购买账户后，前往 https://developer.apple.com/account/ 并使用你购买 Developer\
  \ 账户时所用的同一 Apple 账户登录。你应该会看到类似以下内容：\n\n![](img/0972ba626734a3986e095c788777818e_575_0.png)\n\
  \n图 27.1：已登录付费 Apple Developer 账户的 Apple Developer 网站\n\n既然你已经拥有了付费的 Apple Developer\
  \ 账户，让我们在下一节中学习如何配置应用所需的各种设置。\n\n## 关于你的 Apple Developer 账户\n\n你的 Apple Developer\
  \ 账户包含开发和提交应用所需的一切。你可以查看会员资格状态、添加和组织开发团队成员、访问开发者文档、下载测试版软件等等。不过，所有这些功能都超出了本书的范围，本节将只涵盖让你的应用上架\
  \ App Store 所需的内容。\n\n以下是创建开发和分发证书的方法：\n\n1. 登录你的 Apple Developer 账户并点击 Certificates：\n\
