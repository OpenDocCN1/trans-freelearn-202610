  \ 图 24.18：处于深色模式的 Simulator，显示更改后的 JRNL 应用图标\n\n你已使用 Icon Composer 创建了一个图标，并成功将其添加到\
  \ JRNL 项目中！太棒了！\n\n## 小结\n\n在本章中，你学习了如何使用 Icon Composer 为 JRNL 应用构建图标。\n\n你首先使用\
  \ Keynote 为图标的每个图层生成带有透明背景的 PNG 文件。接着，你将 PNG 文件添加到 Icon Composer，并调整了每个图层的属性。最后，你将它添加到项目中，并在\
  \ Simulator 中测试了其外观。\n\n现在你知道了如何使用 Icon Composer 为自己的应用创建图标。\n\n在本节对 SwiftUI 的简要介绍中，你已经了解了如何使用\
  \ SwiftUI 构建 JRNL 应用的简化版本。\n\n在下一章中，你将了解 **Apple Intelligence**，以及如何使用它来生成代码并为你的应用添加一些很酷的功能。\n\
