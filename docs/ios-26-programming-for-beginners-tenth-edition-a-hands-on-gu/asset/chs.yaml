- "## 14 MVC and Table Views\n\nIn the previous chapter, you modified the Journal\
  \ List screen, the Add New Journal Entry screen, and the Journal Entry Detail screen\
  \ to match the app tour shown in *Chapter 10, Set Up the User Interface*. You have\
  \ completed the initial UI for the JRNL app, and that concluded Part 2 of this book.\n\
  \nThis chapter begins Part 3 of this book, where you will focus on the code that\
  \ makes your app work. In this chapter, you will learn about the Model-View-Controller\
  \ (MVC) design pattern and how the different parts of an app interact with one another.\
  \ Then, you’ll implement a table view programmatically (which means implementing\
  \ it using code instead of storyboards) using a playground, to understand how table\
  \ views work. Finally, you’ll revisit the table view you implemented on the Journal\
  \ List screen, so you can see the differences between implementing it in a storyboard\
  \ and implementing it programmatically.\n\nBy the end of this chapter, you’ll understand\
  \ the MVC design pattern, you’ll have learned how to create a table view controller\
  \ programmatically, and you’ll know how to use table view delegate and data source\
  \ protocols.\n\nThe following topics will be covered in this chapter:\n\n- The MVC\
  \ design pattern\n- Table views\n- Revisit the Journal List screen\n\n### Technical\
  \ requirements\n\nThe completed Xcode playground and project for this chapter are\
  \ in the Chapter14 folder of the code bundle for this book, which can be downloaded\
  \ here:\n\nhttps://github.com/PacktPublishing/iOS-26-Programming-for-Beginners-10E\n\
  \nCheck out the following video to see the code in action:\n\nhttps://youtu.be/SHqmm6Ch57E\n\
  \nCreate a new playground and call it TableViewBasics. You can use this playground\
  \ to type in and run all the code in this chapter as you go along. Before you do,\
  \ let’s look at the MVC design pattern, an approach commonly used when writing iOS\
  \ apps.\n\n### The MVC design pattern\n\nThe Model-View-Controller (MVC) design\
  \ pattern is a common approach used when building iOS apps. MVC divides an app into\
  \ three different parts:\n\n- **Model:** This handles data storage and representation\
  \ and data processing tasks\n- **View:** This includes all the things that are on\
  \ the screen that the user can interact with\n- **Controller:** This manages the\
  \ flow of information between the model and the view\n\nOne notable feature of MVC\
  \ is that the view and model do not interact with one another; instead, all communication\
  \ is managed by the controller.\n\nFor example, imagine you’re at a restaurant.\
  \ You look at a menu and choose something you want. Then, a waiter comes, takes\
  \ your order, and sends it to the cook. The cook prepares your order, and when it\
  \ is done, the waiter takes the order and brings it out to you. In this scenario,\
  \ the menu is the view, the waiter is the controller, and the cook is the model.\
  \ Also, note that all interactions between you and the kitchen are only through\
  \ the waiter; there is no interaction between you and the cook.\n\nTo find out more\
  \ about MVC, visit https://developer.apple.com/library/archive/documentation/General/Conceptual/DevPedia-CocoaCore/MVC.html.\n\
  \n\n\n\n\n要了解 MVC 在 iOS 应用中的工作原理，让我们进一步学习视图控制器。你将看到实现一个用于管理表格视图的视图控制器需要做什么，该表格视图用于日志列表屏幕。\n\
  \n## 视图控制器\n\n到目前为止，你已经实现了 JournalListViewController，这是一个管理日志列表屏幕上表格视图的视图控制器。然而，你还没有学习到添加到其中的代码是如何工作的，所以现在让我们来看一下。\n\
  \n你可能希望重读第 11 章《构建用户界面》，其中你实现了 JournalListViewController 类。\n\n当 iOS 应用启动时，会加载要显示的第一个屏幕的视图控制器。视图控制器具有\
  \ view 属性，并自动加载分配给其 view 属性的视图实例。该视图可能有子视图，它们也会被加载。\n\n如果其中一个子视图是表格视图，它将具有 dataSource\
  \ 和 delegate 属性。dataSource 属性被分配给向表格视图提供数据的对象。delegate 属性被分配给处理与表格视图用户交互的对象。通常，表格视图的视图控制器将被分配给表格视图的\
  \ dataSource 和 delegate 属性。\n\n表格视图将发送给其视图控制器的 方法调用在 UITableViewDataSource 和 UITableViewDelegate\
  \ 协议中声明。记住，协议只提供方法声明；这些方法调用的实现在视图控制器中。视图控制器然后从模型对象获取数据并为表格视图提供数据。视图控制器还处理用户输入并根据需要修改模型对象。\n\
  \n让我们在下一节更仔细地查看表格视图和表格视图协议。\n\n5. 在类定义中，按惯例属性是在任何方法声明之前在顶部声明的。重新排列代码，使属性声明位于顶部，如下所示：\n\
  \n```\nclass TableViewExampleController: UIViewController,\nUITableViewDataSource\
  \ {\n    var tableView: UITableView!\n    var journalEntries: [[String]] = [\n \
  \       [\"sun.max\",\"12 Sept 2025\",\"Nice weather today\"],\n        [\"cloud.rain\"\
  ,\"13 Sept 2025\",\"Heavy rain today\"],\n        [\"cloud.sun\",\"14 Sept 2025\"\
  ,\"It's cloudy out\"]\n    ]\n    func tableView(_ tableView: UITableView,\n   \
  \ numberOfRowsInSection section: Int) -> Int {\n```\n\n6. 要使表格视图为 journalEntries\
  \ 数组中的每个元素显示一行，请单击 tableView(_:numberOfRowsInSection:) 方法定义中的代码占位符并输入 journalEntries.count。完成的方法应如下所示：\n\
  \n```\nfunc tableView(_ tableView: UITableView, numberOfRowsInSection section: Int)\
  \ -> Int {\n    journalEntries.count\n}\n```\n\njournalEntries.count 返回 journalEntries\
  \ 数组中的元素数量。由于其中有三个元素，这将使表格视图显示三行。\n\n7. 要使表格视图在每个单元格中显示日志条目详情，请单击 tableView(_:cellForRowAt:)\
  \ 方法定义中的代码占位符并输入以下内容：\n\n```\nfunc tableView(_ tableView: UITableView, cellForRowAt\
  \ indexPath: IndexPath)\n-> UITableViewCell {\n    let cell = tableView.dequeueReusableCell(withIdentifier:\n\
  \    \"cell\", for: indexPath)\n    let journalEntry = journalEntries[indexPath.row]\n\
  \    var content = cell.defaultContentConfiguration()\n    content.image = UIImage(systemName:\
  \ journalEntry[0])\n    content.text = journalEntry[1]\n```\n\n```\ncontent.secondaryText\
  \ = journalEntry[2]\ncell.contentConfiguration = content\nreturn cell\n}\n```\n\n\
  让我们分解一下：\n\n```\nlet cell = tableView.dequeueReusableCell(withIdentifier: \"cell\"\
  ,\nfor: indexPath)\n```\n\n此语句创建一个新的表格视图单元格或重用现有的表格视图单元格并将其分配给 cell。想象一下你需要在表格视图中显示\
  \ 1,000 个项目。你不需要 1,000 行包含 1,000 个表格视图单元格——你只需要足够填满屏幕的数量即可。滚动到屏幕顶部的表格视图单元格可以重用于显示出现在屏幕底部的项目，反之亦然。由于表格视图可以显示多种类型的单元格，因此你将单元格重用标识符设置为\
  \ \"cell\" 以标识此特定表格视图单元格类型。此标识符将在稍后与表格视图注册。\n\n```\nlet journalEntry = journalEntries[indexPath.row]\n\
  ```\n\nindexPath 值定位表格视图中的行。第一行具有包含 section 0 和 row 0 的 indexPath。indexPath.row\
  \ 对第一行返回 0，因此此语句将 journalEntries 数组中的第一个元素分配给 journalEntry。\n\n```\nvar content\
  \ = cell.defaultContentConfiguration()\n```\n\n默认情况下，UITableViewCell 实例可以存储一个图像、一个文本字符串和一个次要文本字符串。你通过使用表格视图单元格的\
  \ content configuration 属性来设置这些。此语句检索表格视图单元格样式的默认内容配置并将其分配给变量 content。\n\n```\n\
  content.image = UIImage(systemName: journalEntry[0])\ncontent.text = journalEntry[1]\n\
  content.secondaryText = journalEntry[2]\ncell.contentConfiguration = content\n```\n\
  \n这些语句使用 journalEntry 的详细信息更新 content，journalEntry 是一个具有三个元素的数组。第一个元素用于指定分配给 image\
  \ 属性的图像。第二个元素分配给 text 属性。第三个元素分配给 secondaryText 属性。最后一行将 content 分配给表格视图单元格的 contentConfiguration\
  \ 属性。\n\n```\nreturn cell\n```\n\n此语句返回表格视图单元格，然后在屏幕上显示。\n\ntableView(_:cellForRowAt:)\
  \ 方法会为表格视图中的每一行执行一次。\n\n8. 要处理表格视图单元格删除，请在 tableView(_:cellForRowAt:) 的实现之后输入以下代码：\n\
  \n```\nfunc tableView(_ tableView: UITableView, commit editingStyle: UITableViewCell.EditingStyle,\
  \ forRowAt indexPath: IndexPath) {\n    if editingStyle == .delete {\n        journalEntries.remove(at:\
  \ indexPath.row)\n        tableView.reloadData()\n    }\n}\n```\n\n这会删除用户向左滑动的表格视图单元格对应的\
  \ journalEntries 元素并重新加载表格视图。\n\nTableViewExampleController 类现在符合 UITableViewDataSource\
  \ 协议。在下一节中，你将使其符合 UITableViewDelegate 协议。\n\n## 采用 UITableViewDelegate 协议\n\n用户可以点击表格视图单元格来选择它。为了处理用户交互，你将使\
  \ TableViewExampleController 类采用 UITableViewDelegate 协议。你将实现该协议中的一个可选方法 tableView(_:didSelectRowAt:)，当用户点击一行时，表格视图会调用它。请按照以下步骤操作：\n\
  \n+   1. 要使 TableViewExampleController 类采用 UITableViewDelegate 协议，请在类声明中 UITableViewDataSource\
  \ 之后输入一个逗号，然后输入 UITableViewDelegate。你的代码应如下所示：\n\n```\nclass TableViewExampleController:\
  \ UIViewController,\nUITableViewDataSource, UITableViewDelegate {\n```\n\n2. 在 tableView(_:commit:forRowAt:)\
  \ 的实现之后输入以下内容：\n\n```\nfunc tableView(_ tableView: UITableView, didSelectRowAt indexPath:\
  \ IndexPath) {\n    let selectedJournalEntry = journalEntries[indexPath.row]\n \
  \   print(selectedJournalEntry)\n}\n```\n\n此方法将获取与被点击行对应的 journalEntries 数组元素并将其打印到调试区域。\n\
  \n3. 验证你的 TableViewExampleController 类是否如下所示：\n\n```\nclass TableViewExampleController:\
  \ UIViewController, UITableViewDataSource, UITableViewDelegate {\n    var tableView:\
  \ UITableView!\n    var journalEntries: [[String]] = [\n        [\"sun.max\",\"\
  12 Sept 2025\",\"Nice weather today\"],\n        [\"cloud.rain\",\"13 Sept 2025\"\
  ,\"Heavy rain today\"],\n        [\"cloud.sun\",\"14 Sept 2025\",\"It's cloudy out\"\
  ]\n    ]\n    func tableView(_ tableView: UITableView, numberOfRowsInSection section:\
  \ Int) -> Int {\n        journalEntries.count\n    }\n    func tableView(_ tableView:\
  \ UITableView, cellForRowAt indexPath: IndexPath) -> UITableViewCell {\n       \
  \ let cell = tableView.dequeueReusableCell(withIdentifier: \"cell\", for: indexPath)\n\
  \        let journalEntry = journalEntries[indexPath.row]\n        var content =\
  \ cell.defaultContentConfiguration()\n        content.image = UIImage(systemName:\
  \ journalEntry[0])\n        content.text = journalEntry[1]\n        content.secondaryText\
  \ = journalEntry[2]\n        cell.contentConfiguration = content\n        return\
  \ cell\n    }\n    func tableView(_ tableView: UITableView, commit editingStyle:\
  \ UITableViewCell.EditingStyle,\n\n\n```swift\nforRowAt indexPath: IndexPath) {\n\
  \    if editingStyle == .delete {\n        journalEntries.remove(at: indexPath.row)\n\
  \        tableView.reloadData()\n    }\n}\nfunc tableView(_ tableView: UITableView,\
  \ didSelectRowAt\nindexPath: IndexPath) {\n    let selectedJournalEntry =\n    journalEntries[indexPath.row]\n\
  \    print(selectedJournalEntry)\n}\n```\n\n现在，TableViewExampleController 类遵循了 UITableViewDelegate\
  \ 协议。\n\n你已经完成了对 TableViewExampleController 类的实现。在下一节中，你将学习如何创建这个类的实例。\n\n## 创建\
  \ TableViewExampleController 实例\n\n现在你已经声明并定义了 TableViewExampleController 类，接下来将编写一个方法来创建它的实例。请按照以下步骤操作：\n\
  \n- 1. 在 `journalEntries` 变量声明之后，键入以下代码来声明一个新方法：\n\n```\nfunc createTableView()\
  \ {\n}\n```\n\n这声明了一个新方法 `createTableView()`，你将使用它来创建表视图的实例，并将其赋值给 `tableView` 属性。\n\
  \n- 2. 在左花括号之后，键入以下代码：\n\n```\ntableView = UITableView(frame: CGRect(x: 0, y: 0,\
  \ width: view.frame.width, height: view.frame.height))\n```\n\n这将创建一个新的表视图实例，并将其赋值给\
  \ `tableView`。\n\n- 3. 在下一行，键入以下代码，将表视图的 `dataSource` 和 `delegate` 属性设置为 `TableViewExampleController`\
  \ 的实例：\n\n```\ntableView.dataSource = self\ntableView.delegate = self\n```\n\n表视图的\
  \ `dataSource` 和 `delegate` 属性指定了包含 `UITableViewDataSource` 和 `UITableViewDelegate`\
  \ 方法实现的对象。\n\n- 4. 在下一行，键入以下代码以设置表视图的背景颜色：\n\n```\ntableView.backgroundColor = .white\n\
  ```\n\n- 5. 在下一行，键入以下代码，将表视图单元格的标识符设置为 `\"cell\"`：\n\n```\ntableView.register(UITableViewCell.self,\
  \ forCellReuseIdentifier: \"cell\")\n```\n\n这个标识符将在 `tableView(_:cellForRowAt:)`\
  \ 方法中使用，以标识要使用的表视图单元格类型。\n\n- 6. 在下一行，键入以下代码，将表视图作为 `TableViewExampleController`\
  \ 实例视图的子视图添加：\n\n```\nview.addSubview(tableView)\n```\n\n- 7. 验证完成后的方法如下所示：\n\n\
  ```\nfunc createTableView() {\n    tableView = UITableView(frame: CGRect(x: 0, y:\
  \ 0,\n    width: view.frame.width, height: view.frame.height))\n    tableView.dataSource\
  \ = self\n    tableView.delegate = self\n    tableView.backgroundColor = .white\n\
  \    tableView.register(UITableViewCell.self,\n    forCellReuseIdentifier: \"cell\"\
  )\n    view.addSubview(tableView)\n}\n```\n\n现在你必须确定何时调用此方法。视图控制器有一个 `view` 属性。当视图控制器被加载时，分配给\
  \ `view` 属性的视图将被自动加载。视图成功加载后，将调用视图控制器的 `viewDidLoad()` 方法。你将在 `TableViewExampleController`\
  \ 类中重写 `viewDidLoad()` 方法来调用 `createTableView()`。在 `createTableView()` 方法之前键入以下代码：\n\
  \n```\noverride func viewDidLoad() {\n    super.viewDidLoad()\n    view.bounds =\
  \ CGRect(x: 0, y: -150, width: 375, height: 667)\n    createTableView()\n}\n```\n\
  \n这将设置实时视图的大小，创建表视图实例，将其赋值给 `tableView`，并将其作为子视图添加到 `TableViewExampleController`\
  \ 实例的视图中。然后，表视图调用数据源方法来确定要显示多少个表视图单元格以及每个单元格中显示什么内容。`tableView(_:numberOfRowsInSection:)`\
  \ 返回 `journalEntries` 中元素的数量，因此将显示三个表视图单元格。`tableView(_:cellForRowAt:)` 创建单元格、创建新的单元格配置、设置单元格配置的属性，并将更新后的配置赋值给单元格。\n\
  \n验证你完成的 playground 是否如下所示：\n\n```swift\nimport UIKit\nimport PlaygroundSupport\n\
  \nclass TableViewExampleController: UIViewController, UITableViewDataSource, UITableViewDelegate\
  \ {\n    var tableView: UITableView!\n    var journalEntries: [[String]] = [\n \
  \       [\"sun.max\", \"12 Sept 2025\", \"Nice weather today\"],\n        [\"cloud.rain\"\
  , \"13 Sept 2025\", \"Heavy rain today\"],\n        [\"cloud.sun\", \"14 Sept 2025\"\
  , \"It's cloudy out\"]\n    ]\n\n    override func viewDidLoad() {\n        super.viewDidLoad()\n\
  \        view.bounds = CGRect(x: 0, y: -150, width: 375, height: 667)\n        createTableView()\n\
  \    }\n\n    func createTableView() {\n        tableView = UITableView(frame: CGRect(x:\
  \ 0, y: 0,\n                                              width: view.frame.width,\n\
  \                                              height: view.frame.height))\n   \
  \     tableView.dataSource = self\n        tableView.delegate = self\n        tableView.backgroundColor\
  \ = .white\n        tableView.register(UITableViewCell.self,\n                 \
  \          forCellReuseIdentifier: \"cell\")\n        view.addSubview(tableView)\n\
  \    }\n\n    func tableView(_ tableView: UITableView,\n                   numberOfRowsInSection\
  \ section: Int) -> Int {\n        journalEntries.count\n    }\n\n    func tableView(_\
  \ tableView: UITableView, cellForRowAt\n                   indexPath: IndexPath)\
  \ -> UITableViewCell {\n        let cell = tableView.dequeueReusableCell(withIdentifier:\
  \ \"cell\", for: indexPath)\n        let journalEntry = journalEntries[indexPath.row]\n\
  \        var content = cell.defaultContentConfiguration()\n        content.image\
  \ = UIImage(systemName: journalEntry[0])\n        content.text = journalEntry[1]\n\
  \        content.secondaryText = journalEntry[2]\n        cell.contentConfiguration\
  \ = content\n        return cell\n    }\n\n    func tableView(_ tableView: UITableView,\
  \ commit editingStyle:\n                   UITableViewCell.EditingStyle, forRowAt\
  \ indexPath: IndexPath) {\n        if editingStyle == .delete {\n            journalEntries.remove(at:\
  \ indexPath.row)\n            tableView.reloadData()\n        }\n    }\n\n    func\
  \ tableView(_ tableView: UITableView, didSelectRowAt\n                   indexPath:\
  \ IndexPath) {\n        let selectedJournalEntry = journalEntries[indexPath.row]\n\
  \        print(selectedJournalEntry)\n    }\n}\n```\n\n现在是时候看看它的实际效果了。请按照以下步骤操作：\n\
  \n- 1. 在 playground 中所有其他代码之后，键入以下内容：\n\n```swift\nPlaygroundPage.current.liveView\
  \ = TableViewExampleController()\n```\n\n此命令创建 `TableViewExampleController` 的实例，并在\
  \ playground 的实时视图中显示其视图。`createTableView()` 方法将创建一个表视图，并将其作为子视图添加到 `TableViewExampleController`\
  \ 实例的视图中，然后它就会出现在屏幕上。\n\n- 2. 要在屏幕上看到表视图的表示，必须启用 playground 的实时视图。单击“调整编辑器选项”按钮，并验证**结果**已选中：\n\
  \n![](img/0972ba626734a3986e095c788777818e_306_0.png)\n\n*图 14.3：调整编辑器选项菜单，选中“结果”*\n\
  \n- 3. 单击“实时视图”按钮，验证实时视图中是否显示三个表视图单元格：\n\n![](img/0972ba626734a3986e095c788777818e_307_0.png)\n\
  \n图 14.4：Playground 实时视图显示包含三个表视图单元格的表视图\n\n- 4. 点按一行。该行的日志条目详细信息将打印在调试区域中：\n\n\
  ![](img/0972ba626734a3986e095c788777818e_307_1.png)\n\n图 14.5：调试区域显示日志条目详细信息\n\n\
  - 5. 在行上向左轻扫。将出现“删除”按钮：\n\n图 14.6：表视图行显示“删除”按钮\n\n- 6. 点按“删除”按钮以从表视图中移除该行：\n\n图\
  \ 14.7：删除一行后的表视图\n\n你刚刚为表视图创建了一个视图控制器，创建了它的实例，并在 playground 的实时视图中显示了表视图。干得漂亮！\n\
  \n在下一节中，你将重新回顾视图控制器是如何在第 11 章“构建用户界面”中实现的“日志列表”屏幕上使用的。参考你在本节中学到的内容，你应该能更好地理解其工作原理。\n\
