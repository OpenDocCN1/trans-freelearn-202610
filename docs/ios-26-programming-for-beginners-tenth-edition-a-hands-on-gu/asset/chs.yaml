  \n图 27.8：已上传证书的 CSR 上传屏幕\n\n7. 你的证书将自动生成。点击 Download 将生成的证书下载到你的 Mac 上：\n\n![](img/0972ba626734a3986e095c788777818e_579_2.png)\n\
  \n图 27.9：下载你的证书屏幕\n\n8. 双击下载的证书以将其安装到你的 Mac 上。\n\n9. 再次重复步骤 3-8，但这次在步骤 3 中选择 Apple\
