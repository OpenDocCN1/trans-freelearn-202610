  \ 27.46：应用信息屏幕\n\n4. 对**定价与可用性**和**App 隐私**部分执行相同操作：\n\n![](img/0972ba626734a3986e095c788777818e_597_1.png)\n\
  \n图 27.47：App 隐私屏幕\n\n5. 选择屏幕左侧的“准备提交”。在“App 预览和截图”部分，将您之前拍摄的截图拖入：\n\n![](img/0972ba626734a3986e095c788777818e_598_0.png)\n\
