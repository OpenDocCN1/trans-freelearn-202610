  \ |\n| 路由应用覆盖文件 | 选择文件（可选） |\n\n图 27.50：常规应用信息部分\n\n\n\n\n\n8. 滚动到 Build 部分，你会看到之前上传的存档构建。如果看不到，请点击\
  \ + 或 Add Build 按钮，选择一个构建，然后点击 Done：\n\n![](img/0972ba626734a3986e095c788777818e_600_0.png)\n\
  \nFigure 27.51: 构建选择屏幕\n\nApple 处理你的提交可能需要长达 30 分钟。\n\n9. 验证你的构建是否在 Build 部分中：\n\
