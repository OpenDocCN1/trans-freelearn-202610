  \nExcellent! You have modified all the screens for your app, and you’re ready to\
  \ add functionality to them in the next part of this book.\n\n## Summary\n\nIn this\
  \ chapter, you modified the Journal List, Add New Journal Entry, and Journal Entry\
  \ Detail screens to match the design shown in the app tour. For the Journal List\
  \ screen, you modified the journalCell table view cell by adding an image view and\
  \ two labels to it. You modified the Add New Journal Entry screen by adding a custom\
  \ view, a switch, a text field, a text view, and an image view to it. You also configured\
  \ the image view to show a default image. For the Journal Entry Detail screen, you\
  \ added a text view, labels, and image views to it, configuring the image views\
  \ to show default images.\n\nYou now have more experience in how to use Interface\
  \ Builder to add and configure multiple user interface elements, set their sizes\
  \ and positions using the Size inspector, and apply the necessary constraints using\
  \ the Add New Constraints and Align buttons. This will be useful to ensure compatibility\
  \ with different screen sizes and orientations. You should also be able to easily\
  \ prototype the appearance and flow of your apps.\n\nYou’re now finished with the\
  \ storyboard and design setup. You can go through every screen that your app has\
  \ and see what they look like, even though none of the screens have actual data\
  \ in them. If this app were a house being built, it’s as though you’ve built all\
  \ the walls and floors, and the house is now ready to have the interior done. Great\
  \ job!\n\nThis concludes Part 2 of this book. In the next part, you’ll begin to\
  \ type in all the code required for your app to work. In the next chapter, you’ll\
  \ start by learning more about the Model-View-Controller design pattern. You’ll\
  \ also learn how table views work, which is crucial for understanding how the Journal\
  \ List screen works.\n\n## Get This Book’s PDF Version and Exclusive Extras\n\n\
  Scan the QR code (or go to packtpub.com/unlock). Search for this book by name, confirm\
  \ the edition, and then follow the steps on the page.\n\nNote: Keep your invoice\
  \ handy. Purchases made directly from Packt don’t require an invoice.\n\n![](img/0972ba626734a3986e095c788777818e_287_0.png)\n"
- '## Part 3

  ### Code


  Welcome to Part 3 of this book. With your user interface complete, you will now
  add code to implement your app’s functionality. To display your data in a list,
  you will use a table view, and you will learn how to use an array as a data source.
  Next, you’ll learn how to pass data from a view controller to the array used as
  a data source, and pass data from one view controller to another. You will also
  look at how to determine the device location and how to display a map containing
  annotations. After that, you will learn how to persist app data using JSON files.
  Then, you’ll learn how to create custom views, use the device camera and photo library,
  and add search capability to your table view. Finally, you’ll replace the table
  view with a collection view to make your app suitable for larger screens, such as
  a Mac or iPad.


  This part comprises the following chapters:


  - Chapter 14, MVC and Table Views

  - Chapter 15, Get Data into Table Views

  - Chapter 16, Pass Data Between View Controllers

  - Chapter 17, Core Location and MapKit

  - Chapter 18, JSON Files

  - Chapter 19, Custom Views

  - Chapter 20, Camera and Photo Library

  - Chapter 21, Search

  - Chapter 22, Collection Views


  By the end of this part, you’ll have completed the JRNL app. You’ll have the experience
  of building a complete app from scratch, which will be useful as you build your
  own apps. Let’s get started!

