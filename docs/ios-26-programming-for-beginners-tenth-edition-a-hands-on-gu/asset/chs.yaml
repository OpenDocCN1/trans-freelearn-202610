  图 27.10：显示 Apple Distribution 单选按钮的 Create a New Certificate 屏幕\n\n太棒了！你现在已经拥有了开发和分发证书。下一步是为你的应用注册\
  \ App ID，以便在 App Store 中标识它。你将在下一节中学习如何执行此操作。\n\n## 注册 App ID\n\n当你在第 1 章“Hello,\
