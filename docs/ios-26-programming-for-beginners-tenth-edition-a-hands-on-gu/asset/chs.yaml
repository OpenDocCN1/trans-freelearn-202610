  \n## 在日志条目详情屏幕上显示地图快照\n\n地图屏幕当前显示一个大头针，代表一条日志条目。当你在地图屏幕上点击大头针并点击标注按钮时，日志条目的详细信息会显示在日志条目详情屏幕上，但日志条目详情屏幕上的第二个图像视图目前显示的是占位地图图像。你可以使用\
  \ `MKMapSnapshotter` 类捕获一个地图区域并将其转换为图像。\n\n有关 `MKMapSnapshotter` 类的更多信息，请参阅 https://developer.apple.com/documentation/mapkit/mkmapsnapshotter。\n\
  \n要配置快照中捕获的地图的区域和外观，需要使用 `MKMapSnapshotter.Options` 对象。\n\n有关 `MKMapSnapshotter.Options`\
  \ 对象的更多信息，请参阅 https://developer.apple.com/documentation/mapkit/mkmapsnapshotter/options。\n\
  \n你将把 Entry Detail 场景中的第二个图像视图连接到 `JournalEntryDetailViewController` 类中的一个输出口，并用显示日志条目位置的地图快照替换占位图像。请按照以下步骤操作：\n\
  \n- 1. 在项目导航器中，点击 JournalEntryDetailViewController 文件。在 `import UIKit` 语句之后输入以下内容，以导入\
  \ MapKit 框架：\n\n```swift\nimport UIKit\nimport MapKit\n```\n\n- 2. 在 JournalEntryDetailViewController\
  \ 类中，在所有其他输出口之后添加以下输出口：\n\n```swift\n@IBOutlet var bodyTextView: UITextView!\n@IBOutlet\
  \ var photoImageView: UIImageView!\n@IBOutlet var mapImageView: UIImageView!\nvar\
  \ selectedJournalEntry: JournalEntry?\n```\n\n- 3. 在右花括号之前添加一个用于生成地图快照的方法：\n\n```swift\n\
  // MARK: - Private methods\nprivate func getMapSnapshot() {\n    guard let lat =\
  \ selectedJournalEntry?.latitude, let\n    long = selectedJournalEntry?.longitude\
  \ else {\n        mapImageView.image = nil\n        return\n    }\n\n    let options\
  \ = MKMapSnapshotter.Options()\n    options.region = MKCoordinateRegion(center:\n\
  \    CLLocationCoordinate2D(latitude: lat, longitude: long),\n    span: MKCoordinateSpan(latitudeDelta:\
  \ 0.01,\n    longitudeDelta: 0.01))\n    options.size = CGSize(width: 300, height:\
  \ 300)\n    options.preferredConfiguration = MKStandardMapConfiguration()\n    let\
  \ snapshooter = MKMapSnapshotter(options: options)\n    snapshooter.start { snapshot,\
  \ error in\n        if let snapshot {\n            self.mapImageView.image = snapshot.image\n\
  \        } else if let error {\n            print(\"snapshot error: \\(error.localizedDescription)\"\
  )\n        }\n    }\n}\n```\n\n此方法检查 `selectedJournalEntry` 的 latitude 和 longitude\
  \ 属性是否有值。如果有值，则会创建、配置一个 `MKMapSnapshotter.Options` 对象，并将其分配给一个 `MKMapSnapshotter`\
  \ 对象。然后使用 `MKMapSnapshotter` 对象生成地图快照，该快照将被赋值给 `mapImageView` 的 image 属性。\n\n- 4.\
  \ 在 `viewDidLoad()` 方法中的右花括号之前调用 `getMapSnapshot()` 方法：\n\n```swift\nphotoImageView.image\
  \ = selectedJournalEntry?.photo\ngetMapSnapshot()\n}\n```\n\n5. 在项目导航器中，点击 Main\
  \ 故事板文件，并在文档大纲中点击 Entry Detail 场景。点击连接检查器按钮，然后将 `mapImageView` 输出口连接到故事板中 Entry\
  \ Detail 场景的第二个图像视图：\n\n![](img/0972ba626734a3986e095c788777818e_404_0.png)\n\n\
  图 17.22：连接检查器显示 `mapImageView` 输出口\n\n直接拖到文档大纲中的图像视图上可能会更容易。\n\n\n\n\n6. 构建并运行你的\
  \ App，然后使用模拟器的“Features | Location”菜单验证位置已设置为 Apple。你应该会在“Map”屏幕上看到一个图钉。轻点该图钉以显示弹出气泡，然后轻点气泡内的按钮。此时会显示“Journal\
  \ Entry Detail”屏幕，并展示你在“Map”屏幕上轻点的日记条目的详细信息。向下滚动，你会看到第二个图像视图中的地图快照：\n\n![](img/0972ba626734a3986e095c788777818e_405_0.png)\n\
  \n图 17.23：模拟器显示带有地图快照的“Journal Entry Detail”屏幕\n\n现在，“Journal Entry Detail”屏幕可以显示展示日记条目位置的地图快照了。真酷！\n\
  \n本章将涵盖以下主题：\n\n- 实现单例（singleton）\n- 修改 JournalEntry 类以支持 JSON\n- 加载和保存 JSON 数据\n\
  \n## 技术要求\n\n你将继续处理上一章中修改过的 JRNL 项目。\n\n本章的资源文件和完整的 Xcode 项目位于本书代码包中的 Chapter18\
  \ 文件夹中，可从此处下载：\n\nhttps://github.com/PacktPublishing/iOS-26-Programming-for-Beginners-10E\n\
  \n查看以下视频以查看实际运行中的代码：\n\nhttps://youtu.be/OPMjo1Ro9OI\n\n让我们先创建一个新的单例来存储你的 App 所使用的数据。\n\
  \n## 实现单例\n\n目前，当你向 App 添加新的日记条目时，它们会出现在“Journal List”屏幕上，但当你切换到“Map”屏幕时，新添加的日记条目不会出现。这是因为\
  \ `MapViewController` 实例无法访问 `JournalListViewController` 实例中的 `journalEntries` 数组。要解决这个问题，你需要创建一个新的单例来存储你的\
  \ App 数据。单例只创建一次，然后在整个 App 中引用。这意味着 `JournalListViewController` 类和 `MapViewController`\
  \ 类都将从单一数据源获取数据。\n\n> 有关单例的更多信息，请参阅 https://developer.apple.com/documentation/swift/managing-a-shared-resource-using-a-singleton。\n\
  \n在下一节中，你将创建一个名为 `SharedData` 的单例，它将由 `JournalListViewController` 和 `MapViewController`\
  \ 类使用。\n\n```\nvar numberOfJournalEntries: Int {\n    journalEntries.count\n}\n\
  var allJournalEntries: [JournalEntry] {\n    journalEntries\n}\n// MARK: - Initialization\n\
  private init() {\n}\n// MARK: - Access methods\nfunc journalEntry(at index: Int)\
  \ -> JournalEntry {\n    journalEntries[index]\n}\nfunc addJournalEntry(_ newJournalEntry:\
  \ JournalEntry) {\n    journalEntries.insert(newJournalEntry, at: 0)\n}\nfunc removeJournalEntry(at\
  \ index: Int) {\n    journalEntries.remove(at: index)\n}\n```\n\n让我们来分解一下：\n\n```\n\
  @MainActor static let shared = SharedData()\n```\n\n这条语句创建了该类的一个实例，这意味着你的 App 中\
  \ `SharedData` 的唯一实例存储在 `shared` 属性中。该属性标记有 `@MainActor`，以确保它只能从主队列访问。\n\n> 如需更多信息，请观看\
  \ Apple 在 WWDC 2022 上题为 *Eliminate data races using Swift Concurrency* 的视频：\n> https://developer.apple.com/videos/play/wwdc2022/110351/。\n\
  \n```\nprivate var journalEntries: [JournalEntry] = []\n```\n\n这条语句创建了一个名为 `journalEntries`\
  \ 的空数组，用于存储 `JournalEntry` 实例。`private` 关键字意味着 `journalEntries` 数组只能由 `SharedData`\
  \ 类中的方法修改。这是为了确保 App 的其他部分无法对 `journalEntries` 数组进行更改。\n\n```\nvar numberOfJournalEntries:\
  \ Int {\n    journalEntries.count\n}\n```\n\n这个计算属性返回 `journalEntries` 数组中的条目数量。\n\
  \n```\nvar allJournalEntries: [JournalEntry] {\n    journalEntries\n}\n```\n\n这个计算属性返回\
  \ `JournalEntries` 数组的副本。\n\n```\nprivate init() {\n}\n```\n\n`init()` 方法有一个空的主体。这防止了意外创建\
  \ `SharedData()` 实例。\n\n```\nfunc journalEntry(at index: Int) -> JournalEntry {\n\
  \    journalEntries[index]\n}\n```\n\n此方法返回 `journalEntries` 数组中指定索引处的 `JournalEntry`\
  \ 实例。\n\n```\nfunc addJournalEntry(_ newJournalEntry: JournalEntry) {\n    journalEntries.insert(newJournalEntry,\
  \ at: 0)\n}\n```\n\n此方法将参数提供的 `JournalEntry` 实例插入到 `JournalEntries` 数组的索引 0 处。\n\
  \n```\nfunc removeJournalEntry(at index: Int) {\n    journalEntries.remove(at: index)\n\
  }\n```\n\n此方法从 `journalEntries` 数组中删除指定索引处的 `JournalEntry` 实例。\n\n你已完成 `SharedData`\
  \ 类的初始实现。在下一节中，你将修改你的 App 以使用它，首先更新 `JournalListViewController` 类。\n\n## 修改 JournalListViewController\
  \ 类\n\n既然你已经创建了 `SharedData` 类，接下来需要修改你的 App 以使用它。你首先会修改 `JournalListViewController`\
  \ 类，使其使用 `SharedData` 类。按以下步骤操作：\n\n- 1. 在 Project 导航器中，点击 `JournalListViewController`\
  \ 文件。从 `JournalListViewController` 类中移除 `journalEntries` 属性：\n```\n@IBOutlet var\
  \ tableView: UITableView!\nprivate var journalEntries: [JournalEntry] = [] // 移除\n\
  ```\n- 2. 在 `viewDidLoad()` 中，移除创建示例数据并将其追加到 `journalEntries` 数组的语句：\n```\noverride\
  \ func viewDidLoad() {\n    super.viewDidLoad()\n    journalEntries = JournalEntry.createSampleJournalEntryData()\
  \ // 移除\n}\n```\n- 3. 修改 `tableView(_:numberOfRowsInSection:)` 方法，使其从 `SharedData`\
  \ 获取表视图的行数：\n```\nfunc tableView(_ tableView: UITableView, numberOfRowsInSection\
  \ section: Int) -> Int {\n    SharedData.shared.numberOfJournalEntries\n}\n```\n\
  \n## 修改 MapViewController 类\n\n在本节中，你将修改 `MapViewController` 类以使用 `SharedData`。如上一章所述，当你在真机上运行\
