  \n    ```swift\n    func makeToast() async -> String {\n        try? await Task.sleep(for:\
  \ .seconds(2))\n        return \"Toast done\"\n    }\n    func boilEggs() async\
  \ -> String {\n        try? await Task.sleep(for: .seconds(7))\n        return \"\
  Eggs done\"\n    }\n    ```\n\n6. makeToast() 和 boilEggs() 方法中的错误应该消失了，但在 viewDidAppear()\
  \ 方法中会出现新的错误。点击其中一个错误图标查看错误消息，该消息与步骤 2 中看到的消息相同。这是因为你在不支持并发的方法内部调用了异步方法。\n\n7. 点击\
  \ Apply 按钮，更多错误将会出现。\n\n8. 暂时忽略方法声明中的错误，并点击 makeToast() 方法调用旁边的错误以查看错误消息：\n\n  \
  \  图 9.5：点击错误图标时显示的错误消息\n\n    此错误消息显示是因为你在调用异步函数时未使用 await。\n\n9. 点击 Apply 按钮在方法调用前插入\
  \ await 关键字。\n\n10. 对 boilEggs() 方法调用旁边的错误重复步骤 7 和步骤 8。await 关键字也将被插入到 boilEggs()\
  \ 方法调用之前。\n\n11. 点击 viewDidAppear() 方法声明中的错误图标查看错误消息：\n\n    图 9.6：突出显示错误图标的 viewDidAppear()\
  \ 方法声明\n\n    此错误显示是因为你不能使用 async 关键字使 viewDidAppear() 方法异步，因为超类中不存在此功能。\n\n12.\
  \ 为了解决此问题，你将删除 async 关键字并将 super.viewDidAppear() 之后的所有代码包含在 Task 块中，这将允许它在同步方法中异步执行。按如下方式修改你的代码：\n\
  \n    ```swift\n    override func viewDidAppear(_ animated: Bool) {\n        super.viewDidAppear(animated)\n\
  \        Task {\n            let startTime = Date().timeIntervalSince1970\n    \
  \        toastLabel.text = \"Making toast...\"\n            toastLabel.text = await\
  \ makeToast()\n    ```\n\n在定义常量时在 let 语句前写入 async，然后在访问常量时写入 await，允许异步方法的并行执行，如下所示：\n\
  \n```swift\nasync let temporaryConstant1 = methodName1()\nasync let temporaryConstant2\
  \ = methodName2()\nlet variable1 = await temporaryConstant1\nlet variable2 = await\
  \ temporaryConstant2\n```\n\n在此示例中，methodName1() 和 methodName2() 将并行运行。\n\n你将修改你的应用程序以使用\
  \ async-let 来使 makeToast() 和 boilEggs() 方法并行运行。在 ViewController 文件中，按如下方式修改 Task\
