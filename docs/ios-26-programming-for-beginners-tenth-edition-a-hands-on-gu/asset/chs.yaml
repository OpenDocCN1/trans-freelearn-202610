  \n图 16.11：模拟器显示重新绘制的表视图\n\n至此，你已经成功实现了一种从表视图中移除行的方法！太棒了！在下一节中，你将进一步学习文本字段和文本视图的委托方法，这些方法在你于“添加新日志条目”屏幕中输入数据时会很有用。\n\
  \n\n\n- 5. 构建并运行你的应用，然后轻点文本字段。如果软件键盘没有出现，请从模拟器的 I/O 菜单中选择 Keyboard | Toggle Software\
  \ Keyboard：\n\n![](img/0972ba626734a3986e095c788777818e_353_0.png)\n\n图 16.12：模拟器\
  \ I/O 菜单，选中 Keyboard | Toggle Software Keyboard\n\n- 6. 使用软件键盘在文本字段或文本视图中输入一些文本：\n\
  \n![](img/0972ba626734a3986e095c788777818e_353_1.png)\n\n图 16.13：显示软件键盘的模拟器\n\n\
  ```\nlet textViewText = bodyTextView.text ?? \"\"\nsaveButton.isEnabled = !textFieldText.isEmpty\
  \ &&\n!textViewText.isEmpty\n}\n```\n\nprivate 关键字表示此方法仅可在该类内部访问。\n\n- 5. 在 `textFieldShouldReturn(_:)`\
  \ 方法之后添加如下 `UITextFieldDelegate` 方法：\n\n```\nfunc textFieldShouldReturn(_ textField:\
  \ UITextField) -> Bool {\n    textField.resignFirstResponder()\n    return true\n\
  }\nfunc textFieldDidEndEditing(_ textField: UITextField) {\n    updateSaveButtonState()\n\
  }\n```\n\n此方法在文本字段放弃第一响应者状态后调用 `updateSaveButtonState()`。\n\n- 6. 在 `textView(_:shouldChangeTextIn:replacementText:)`\
  \ 方法之后添加如下 `UITextViewDelegate` 方法：\n\n```\nfunc textView(_ textView: UITextView,\
  \ shouldChangeTextIn range: NSRange, replacementText text: String) -> Bool {\n \
  \   if (text == \"\\n\") {\n        textView.resignFirstResponder()\n    }\n   \
  \ return true\n}\nfunc textViewDidEndEditing(_ textView: UITextView) {\n    updateSaveButtonState()\n\
  }\nfunc textViewDidChange(_ textView: UITextView) {\n    updateSaveButtonState()\n\
  }\n```\n\n至此，`JournalEntryDetailViewController` 文件已创建，其中包含 `JournalEntryDetailViewController`\
  \ 类声明。现在，你需要为点击 Journal List 屏幕上的表格视图单元格时呈现的视图控制器场景设置标识。请按以下步骤操作：\n\n- 1. 在 Project\
  \ navigator 中点击 Main storyboard 文件，并在文档大纲中选择 Entry Detail Scene。\n- 2. 点击 Identity\
  \ inspector 按钮，然后在 Custom Class 下将 Class 设置为 `JournalEntryDetailViewController`：\n\
  \n![](img/0972ba626734a3986e095c788777818e_358_0.png)\n\n图 16.16：Entry Detail Scene\
  \ 的 Identity inspector 设置\n\n太棒了！在下一节中，你将把 Entry Detail Scene 中的用户界面元素连接到 `JournalEntryDetailViewController`\
  \ 类中的 outlet。这样，`JournalEntryDetailViewController` 实例将能够显示日志条目的详细信息。\n\n## 将 UI\
  \ 元素连接到 JournalEntryDetailViewController 类\n\n目前，Journal Entry Detail 屏幕的 `JournalEntryDetailViewController`\
  \ 实例无法与其内部的 UI 元素通信。现在，你将在 `JournalEntryDetailViewController` 类中创建 outlet，并将 Entry\
