  \n2. 你需要为此转场设置标识符，以便 `mapView(_:annotationView:calloutAccessoryControlTapped:)`\
  \ 方法知道要执行哪个转场。选择连接地图场景和条目详情场景的转场：\n\n![](img/0972ba626734a3986e095c788777818e_397_0.png)\n\
  \n图 17.18：地图场景与条目详情场景之间的转场\n\n3. 在属性检查器中，在 Storyboard Segue 下，将 Identifier 设置为 `showMapDetail`：\n\
  \n![](img/0972ba626734a3986e095c788777818e_398_0.png)\n\n图 17.19：showMapDetail 转场的属性检查器设置\n\
  \n4. 在项目导航器中点击 MapViewController 文件。在 MapViewController 类中，在所有其他属性声明之后添加一个用于存储日志条目的属性：\n\
  \n```swift\nprivate var annotations: [JournalEntry] = []\nprivate var selectedAnnotation:\
  \ JournalEntry?\n```\n\n该属性将存储被点击的 MKAnnotationView 实例所对应的 JournalEntry 实例。\n\n\
  5. 在 `mapView(_:viewFor:)` 方法之后添加 `mapView(_:annotationView:calloutAccessoryControlTapped:)`\
  \ 方法：\n\n```swift\nfunc mapView(_ mapView: MKMapView, annotationView view: MKAnnotationView,\
  \ calloutAccessoryControlTapped control: UIControl) {\n    guard let annotation\
  \ = mapView.selectedAnnotations.first as? JournalEntry else {\n        return\n\
  \    }\n    selectedAnnotation = annotation\n    performSegue(withIdentifier: \"\
  showMapDetail\", sender: self)\n}\n```\n\n- 8. 要让日志条目详情屏幕显示日志条目的详细信息，你将使用 `prepare(for:sender:)`\
  \ 方法将选中的日志条目传递到日志条目详情屏幕的视图控制器。在 MapViewController 类中，取消注释并修改 `prepare(for:sender:)`\
  \ 方法，如下所示：\n\n```swift\n// MARK: - Navigation\noverride func prepare(for segue:\
  \ UIStoryboardSegue, sender: Any?) {\n    super.prepare(for: segue, sender: sender)\n\
  \    guard segue.identifier == \"showMapDetail\" else {\n        fatalError(\"Unexpected\
  \ segue identifier\")\n    }\n    guard let entryDetailViewController = segue.destination\
  \ as?\n        JournalEntryDetailViewController else {\n        fatalError(\"Unexpected\
  \ view controller\")\n    }\n    entryDetailViewController.selectedJournalEntry\
  \ =\n        selectedAnnotation\n}\n```\n\n正如你之前所学，视图控制器会在转换到另一个视图控制器之前执行 `prepare(for:sender:)`\
  \ 方法。在这种情况下，此方法会在地图屏幕转换到日志条目详情屏幕之前被调用。如果转场的标识符是 `showMapDetail`，并且转场目的地是 `JournalEntryDetailViewController`\
  \ 实例，那么 `selectedAnnotation` 将被赋值给该 `JournalEntryDetailViewController` 实例的 `selectedJournalEntry`\
  \ 属性。\n\n- 9. 构建并运行你的应用，使用模拟器的 **Features | Location** 菜单确认位置已设置为 **Apple**。你应在地图屏幕上看到一个大头针。点击该大头针显示标注气泡，再点击标注气泡中的按钮。随后会显示日志条目详情屏幕，并展示你在地图屏幕上点击的日志条目的详细信息。\n\
