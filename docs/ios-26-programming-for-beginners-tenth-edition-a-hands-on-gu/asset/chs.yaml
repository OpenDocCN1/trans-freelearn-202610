  \n图 27.17：注册新设备屏幕\n\n您需要提供设备名称和设备 ID 来注册您的设备。\n\n4. 将设备连接到 Mac。启动 Xcode，从“窗口”菜单中选择“设备和模拟器”。在左侧窗格中选择设备，并复制“标识符”值：\n\
  \n图 27.18：设备和模拟器窗口\n\n5. 在“设备名称”字段中输入设备名称，并将标识符值粘贴到“设备 ID (UDID)”字段中。点击“继续”：\n\n\
  图 27.19：注册设备屏幕\n\n您已成功注册测试设备。太棒了！下一步是创建描述文件。需要 iOS 应用开发描述文件，以便您的应用能够在测试设备上运行；对于要上传到\
  \ App Store 的应用，则需要 iOS App Store 分发描述文件。在下一节中，您将创建开发和分发描述文件。\n\n## 创建描述文件\n\n您需要创建两个描述文件。应用要在测试设备上运行，需要\
  \ iOS 应用开发描述文件。iOS App Store 分发描述文件用于将应用提交到 App Store。以下是创建开发描述文件的方法：\n\n1. 登录您的\
  \ Apple Developer 账户，然后点击“描述文件”。\n2. 点击“+”按钮：\n\n图 27.20：描述文件屏幕\n\n3. 点击“iOS App\
  \ Development”单选按钮，然后点击“继续”：\n\n图 27.21：注册新描述文件屏幕\n\n4. 选择要测试的应用的 App ID，然后点击“继续”：\n\
  \n图 27.22：选择 App ID 屏幕\n\n5. 勾选一个开发证书复选框，然后点击“继续”：\n\n图 27.23：选择开发证书\n\n要在测试设备上测试应用，您需要使用开发证书、App\
  \ ID、已注册的测试设备和开发描述文件。要将应用提交到 App Store，您需要使用分发证书、App ID 和分发描述文件。您可以将 Xcode 配置为自动管理这些内容。\n\
  \n在提交应用之前，您必须创建应用的图标并获取应用截图。然后，您可以创建 App Store 上架信息，生成要上传的归档构建，并填写 App Store Connect\
  \ 信息。随后 Apple 将审核您的应用，如果一切顺利，它就会出现在 App Store 上。\n\n> 要了解更多有关如何提交应用的信息，请访问 https://developer.apple.com/app-store/submitting/。\n\
  \n在下一节中，让我们看看如何为应用创建图标，这些图标会在应用安装后显示在设备屏幕上。\n\n## 为您的应用创建图标\n\n在将应用上传到 App Store\
  \ 之前，您必须为其创建图标集。以下是为应用创建图标集的方法：\n\n1. 创建一个 1,024 x 1,024 像素的应用图标。\n2. 在 Project\
  \ 导航器中点击 Assets 文件，然后将您创建的图标拖到下图所示的位置：\n\n![](img/0972ba626734a3986e095c788777818e_588_0.png)\n\
  \n图 27.32：Assets 文件显示应用图标的位置\n\n当您在模拟器或设备上运行应用并退出后，您应该能在主屏幕上看到应用图标。很酷吧！\n\n如第 24\
  \ 章“Icon Composer”所示，您也可以使用 Icon Composer 为应用创建图标。\n\n接下来，让我们看看如何创建截图。提交 App Store\
  \ 时需要这些截图，以便客户了解您的应用外观。您将在下一节中完成此操作。\n\n## 为您的应用拍摄截图\n\n您需要应用的截图，这些截图将用于您的 App Store\
  \ 上架信息。要创建截图，请在模拟器中运行应用，然后点击截图按钮。截图将保存到桌面：\n\n![](img/0972ba626734a3986e095c788777818e_589_0.png)\n\
  \n图 27.33：模拟器显示截图按钮\n\nApple 要求提供应用在配备 6.7 英寸显示屏的 iPhone（如 iPhone 14 Plus）和配备 13\
  \ 英寸显示屏的 iPad（如 iPad Pro 13 英寸）上运行的截图。如果您没有实际设备，可以使用模拟器来模拟这些设备，并且您的截图应展示应用的功能以及应用在不同屏幕尺寸下的外观。\n\
  \n下一节将更详细地讨论如何提交应用截图，您将学习如何创建 App Store 上架信息。App Store 上架信息包含应用将在 App Store 中显示的所有信息，以便客户在下载或购买您的应用时做出明智的决定。\n\
  \n## 创建 App Store 上架信息\n\n既然您已经有了应用的图标和截图，接下来就要创建 App Store 上架信息。这样客户在下载之前就能看到有关您的应用的信息。请按照以下步骤操作：\n\
  \n1. 前往 http://appstoreconnect.apple.com 并选择“Apps”（应用）：\n\n![](img/0972ba626734a3986e095c788777818e_590_0.png)\n\
  \n图 27.34：App Store Connect 网站\n\n2. 点击屏幕左上角的“+”按钮，然后选择“新建应用”：\n\n![](img/0972ba626734a3986e095c788777818e_590_1.png)\n\
  \n图 27.35：“新建应用”按钮和菜单\n\n3. 屏幕上会出现一个显示字段列表的“新建应用”屏幕：\n\n![](img/0972ba626734a3986e095c788777818e_591_0.png)\n\
