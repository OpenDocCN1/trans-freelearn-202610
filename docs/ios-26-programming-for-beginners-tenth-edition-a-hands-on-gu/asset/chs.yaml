  ## 在 iOS 设备上信任 Developer App 证书


  Developer App 证书是一种特殊文件，会与您的应用一起安装到 iOS 设备上。在应用运行之前，您需要信任它。请按照以下步骤操作：


  1. 在 iOS 设备上，轻点“设置”|“通用”|“VPN 与设备管理”：


