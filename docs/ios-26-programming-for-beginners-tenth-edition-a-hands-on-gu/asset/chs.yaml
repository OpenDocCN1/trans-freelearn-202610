  \n## 13\n\n## 修改应用屏幕\n\n在第11章“构建用户界面”中，你添加了应用所需的部分屏幕，以匹配应用演示中的内容。在第12章“完善用户界面”中，你添加了应用所需的其余屏幕。现在，在模拟器中运行应用时，你可以浏览应用的所有屏幕，但这些屏幕仍然缺少数据输入和数据显示所需的用户界面元素。\n\
  \n在本章中，你将向“日志列表”、“添加新日志条目”和“日志条目详情”屏幕添加并配置缺失的用户界面元素，以匹配应用演示中显示的设计。\n\n对于“日志列表”屏幕，你将通过向\
  \ `journalCell` 表视图单元格添加一个图像视图和两个标签来修改它，使其能够显示日志条目的照片、日期和标题。对于“添加新日志条目”屏幕，你将通过添加自定义视图、开关、文本字段、文本视图和图像视图来修改它，以便输入新日志条目的详细信息。你还需要将图像视图配置为显示默认图像。对于“日志条目详情”屏幕，你将向其中添加文本视图、标签和图像视图，并将图像视图配置为显示默认图像，以便该屏幕能够显示现有日志条目的详细信息。当所有用户界面元素就位后，你的应用就可以编写代码了，你将在本书的第3部分中实现这些代码。\n\
  \n到本章结束时，你将更加熟练地添加和定位用户界面元素，并将在如何使用约束来确定它们相对位置方面获得更多经验。这将有助于确保与不同屏幕尺寸和方向的兼容性，使你能够轻松地原型化应用的外观和流程。\n\
  \n\n\n\n\n![](img/0972ba626734a3986e095c788777818e_245_0.png)\n\n图 13.1：完成后的 JRNL\
  \ 应用的“日志列表”屏幕\n\n如你所见，“日志列表”屏幕上的表格视图单元格包含一张照片、一个日期和一个日志条目标题。在第 11 章“构建用户界面”中，你已将\
  \ `journalCell` 表格视图单元格的背景色设置为青色，并将表格视图配置为显示一列 10 个单元格。现在你将移除背景色，并向 `journalCell`\
  \ 表格视图单元格添加用户界面元素，以匹配应用导览中显示的设计。你将在下一节中首先向其中添加一个图像视图。\n\n6. 点击“添加新约束”按钮，并输入以下值来为新添加的图像视图设置约束：\n\
  \n- 顶部：0\n- 左侧：0\n- 底部：0\n- 宽度：90\n- 高度：90\n\n完成后，点击“添加 5 个约束”按钮。\n\n![](img/0972ba626734a3986e095c788777818e_249_0.png)\n\
  \n图 13.7：“添加新约束”对话框\n\n这会将图像视图的顶部、左侧和底部边缘绑定到 `journalCell` 表格视图单元格的对应边缘，并将其宽度和高度设置为\
  \ 90 点。同时，它还将表格视图单元格的高度隐式设置为 90 点。\n\n4. 验证标签的位置是否如以下截图所示，并且新添加的约束是否出现在文档大纲中：\n\n\
