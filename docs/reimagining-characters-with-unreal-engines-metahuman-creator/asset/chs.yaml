- '## 开始使用 Unreal


  在本书的第一章中，您将了解什么是 Unreal Engine，它的用途，以及如何开始使用它。然后您将学习如何设置 Epic Games 账户并下载 Unreal
  Engine，随后使用同一账户详情下载 Bridge，这是开始创建 MetaHuman 角色所需的应用程序。


  总体而言，您将熟练掌握在 Windows 机器上安装和设置这些应用程序。


  因此，我们将涵盖以下主题：


  *   什么是 Unreal Engine？

  *   什么是 MetaHuman？

  *   设置 Unreal Engine 和 MetaHuman Creator


  ### 技术要求


  在开始之前，我必须提醒您，本书涉及极高质量的 3D 角色，因此在设置 Unreal 之前了解这一点非常重要，以免因技术问题而感到失望。这是因为 Unreal Engine
  像任何 3D 图形工具一样，需要一台强大的机器；其中很大一部分性能来自显卡。


  因此，如果您想享受在 Unreal 中工作的实时体验，您需要一台能够处理最佳设置并实时显示 MetaHuman 角色的计算机。否则，您将遇到运行非常迟缓且容易频繁崩溃的机器，这是没人想要的。要完成本章，您需要互联网连接以及
  Epic Games 推荐的最低硬件规格：


  *   Windows 10 64 位

  *   64 GB 内存

  *   256 GB SSD（系统盘）

  *   2 TB SSD（数据盘）

  *   NVIDIA GeForce GTX 970

  *   10 核 Xeon E5-2643 @ 3.4 GHz


  您将在本书页面中看到的屏幕截图来自我的自己的机器，其配置如下：


  *   Windows 10 64 位

  *   256 GB 内存

  *   1 TB SSD（系统盘）

  *   4 TB SSD（数据盘）

  *   NVIDIA GeForce RTX 3090

  *   20 核 i9 10-900k @ 3.7 GHz


  如果您是忠实的 Mac 用户，您的体验将不如 Windows 用户好得多。这很大程度上是因为 Epic Games 投入了更多时间将引擎开发用于 Windows。这并不是说它在
  Mac 上不可用，但许多功能，特别是实现照片级真实感的渲染功能，在 Mac 机器上不可用，最著名的是 NVIDIA RTX 系列 GPU 显卡上的 `DirectX
  12` 和 `Ray Tracing Cores`（光线追踪核心）。


  我还想指出，有一些解决方案可以让您在强大的机器上进行测试。在大多数情况下，它们将帮助您完成本书的所有章节，除了实时面部动作捕捉和可能出现的实时身体动作捕捉。因此，如果您预算有限，我建议您查看一些云计算解决方案，例如：[paperspace.com](https://paperspace.com)。


  > **注意**

  >

  > 在云机器上，您仍然无法进行任何实时动作捕捉，因为这需要与您的机器直接接口或共享网络。但是，您可以利用云机器的更高规格来尝试渲染和灯光设置。


  此时，您可能正在不必要地担心。然而，我个人曾尝试在低配置机器上使用本书中提到的工具，在大多数情况下，我能够使用极低的渲染设置完成工作。然而，我完全无法进行任何实时动作捕捉。相反，我只能依赖动作捕捉素材库——所以如果您打算现在学习，以后再投资购买更新、更快的机器，这本书肯定仍然适合您。


  ## 什么是 Unreal？


  简单来说，**Unreal Engine** 是一款游戏引擎。市面上还有许多其他游戏引擎，但 Unreal Engine 是游戏开发领域两大领先引擎之一，另一个是
  Unity。如果 MetaHuman 是 Unity 公司的人开发的，这本书的标题就会略有不同！


  Unreal Engine 是一款用于实时显示图形的极其强大的工具。它最初是为一款名为 Unreal 的基于 PC 的第一人称射击游戏而构建，由 Epic Games
  在 1990 年代中期到后期开发。在早期，Unreal Engine 能够在 CPU 上以高达 60 fps 的速度渲染帧，给用户带来实时体验。


  然而，存在许多限制，例如帧大小、任何给定时间可显示的三角形数量限制，以及光照背后数学的复杂性。最终结果是图形并非照片级真实，但比其他游戏引擎有了显著改进。


  随着 GPU 随时间推移而改进，Unreal 也随之改进，因为它能够将大量数学计算迁移到 GPU 上。结果，引擎能够依赖专门设计用于更快计算 3D 渲染的硬件，并开发了许多功能来引入照片级真实感光照解决方案，这些解决方案以前仅存在于电影和电视中基于传统
  CPU 路径追踪的方案中。


  路径追踪或光线追踪渲染解决方案涉及非常复杂的数学，它会从最终渲染的像素追踪光子，穿过 CGI 摄像机并绕场景一周。这种追踪极其耗时，仅交付一张图像就需要大量的处理能力。因此，对于照片级真实感来说，传达运动感或实时感是不可能的。


  由于最近的创新，Unreal Engine 现在被用于实时生成照片级真实感渲染，我们可以在 Disney 的《曼达洛人》中看到这一成果。负责实时环境的公司 StageCraft、Industrial
  Light & Magic 合作创建了 LED 背景，显示 Unreal Engine 中场景的输出。除了提供照片级真实感的背景外，LED 背景还会为真人演员补光，增加了更多真实感。


  我预计如果您是完全的新手，您可能会挠头思考：*像 Unreal 这样的游戏引擎是做什么的？* 更广泛地说，它是一款旨在构建实时渲染图形游戏的软件应用程序。对于游戏，Unreal
  用于创建以下内容：


  *   用户功能

  *   游戏逻辑

  *   环境设计

  *   动画

  *   用户所见内容的实时渲染


  无论是鼠标点击输入、Xbox 手柄按钮，还是 Oculus 头显，这些用户输入都会影响角色如何以及何时移动，以及在任何给定时间显示什么内容。


  最终，本书旨在让您能够上手使用自己的角色，并按照您想要的方式为它们制作动画，即使您没有美术背景或角色动画背景。这很令人兴奋，不是吗？我认为是的。


  接下来，让我们更多地思考一下我们将如何创建这些角色。


  ## 什么是 MetaHuman？


  **MetaHuman** 是非常复杂的角色，它们具有看起来照片级真实和动作逼真的能力。它们是供用户和艺术家编辑的模板。角色模板的编辑在网页浏览器中进行，允许用户以极度真实感查看他们的角色设计。


  MetaHuman Creator 的大量开发工作集中在实时渲染上。通常，CGI 角色的皮肤着色涉及大量的 CPU 处理，特别是对于高细节区域，例如细微的反射、毛孔和细小的汗毛或绒毛。MetaHuman
  皮肤着色器旨在利用最近的技术硬件进步（例如 NVIDIA RTX 显卡上的实时光线追踪）在 Unreal Engine 中实时工作。


  除了照片级真实感的皮肤着色器，MetaHuman 还拥有骨骼网络和混合形变，允许进行极其复杂和强大的面部木偶控制，以及结合面部和身体动作捕捉的能力，所有这些都在
  Unreal 中实时进行。






  既然您已经对虚幻引擎和 MetaHuman 有了很好的了解，我们将让软件在您的系统上运行起来，以便您能在下一章开始使用虚幻。


