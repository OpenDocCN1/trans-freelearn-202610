  \n在图 10.6 中，我已经添加了动画。注意我用红框标出的两个轨道之间的过渡。实际上，我已将一个动画轨道合并到另一个轨道中，这由一条先下降后上升的曲线指示。\n\
  \n要以这种方式合并轨道，你必须将播放头移至 Level Sequencer 中第一个轨道的末尾。如果你的动画是 100 帧，请务必移至更高的帧数，例如 120\
  \ 帧；否则，你将无法将动画合并到该轨道。然后，你必须将第二个片段向左拖动，使其与第一个片段相交。\n\n请注意，它会在同一动画轨道上自动从第一个动画过渡到第二个动画。实际上，此方法已将两个动画合并为一个轨道。注意已合并的两个动画片段之间的数字（红框内）。它显示为\
  \ `0093`。这表示从一个动画过渡到下一个动画的过渡长度为 93 帧，约为 3 秒。\n\n在下一节中，我们将介绍一个实用技巧，帮助对齐动画。\n\n####\
  \ 使用“显示骨骼”功能实现更整洁的对齐\n\n有时，当我们尝试合并动画时，效果并不理想。例如，如果第一个动画是角色行走，第二个动画是角色奔跑，角色往往会从一帧到下一帧剧烈地跳跃到新位置。\n\
  \n为了进行此类调整，我们需要在 Level Sequencer 中为身体添加一个 `Transform`（变换）轨道。你可以按照图 10.7 所示操作：\n\n\
  ![图 10.7：添加变换轨道](img/B17878_10_07.jpg)\n*图 10.7：添加变换轨道*\n\n这将在 Level Sequencer 中创建一个新的变换轨道，允许我们在\
  \ `Location`（位置）参数中创建关键帧。现在，我们可以移动角色来修复任何角色位置问题，而不会影响任何整体动画属性。我们应用的任何角色移动将仅在新的变换轨道上设置关键帧，因此我们不会无意中丢失任何原始动作捕捉数据。\n\
  \n例如，想象一个角色站立挥手的动画。如果动捕数据有问题，导致身体随机向上升起，但我们对角色挥手的动作很满意，我们可以通过在 `Location` 参数添加关键帧来修复随机的向上移动。我们可以做到这一点，而不会对手臂挥动的动作产生负面影响。\n\
  \n然而，在将角色从 A 点移动到 B 点时，要看到细微的调整可能有点麻烦。为了解决这个可见性问题，Unreal 有一个功能可以让我们看到 MetaHuman\
  \ 骨骼。这使我们能够专注于角色的确切位置，而不会被网格体干扰。\n\n通过右键点击时间轴，你将看到 `Show Skeleton`（显示骨骼）选项。点击它将显示一个亮粉色的骨骼，有助于进行细微调整，如图\
  \ 10.8 所示：\n\n![图 10.8：显示骨骼](img/B17878_10_08.jpg)\n*图 10.8：显示骨骼*\n\n**注意**：使用 `Show\
  \ Skeleton` 功能时，两个动画将显示为不同颜色的骨骼，这使得对齐它们变得更容易一些。\n\n使用 `Transform` 轨道和 `Show Skeleton`\
  \ 功能的常见示例是当你想要循环动画时，例如行走循环。\n\n然而，如果你有一个角色从位置 A 走到位置 B，并且你希望循环动画以使角色继续行走，我们会遇到一个问题。问题是，一旦角色到达位置\
  \ B，如果我们希望它循环，它就会返回位置 A。\n\n使用 `Transform` 轨道，并在定位器上放置关键帧，你可以创建一个使用循环的持续动画：\n\n\
  1.  在 Level Sequencer 中为你的 `Animation` 轨道添加一个 `Transform` 轨道。\n2.  转到轨道的最末端，在最后一帧为定位器位置（即\
  \ `X`、`Y` 和 `Z`）添加关键帧。如果你在 Level Sequencer 中选中了变换轨道，也可以通过按 `Enter` 键来执行此操作。我们这样做是为了锁定动画的位置，使其不受下一步的影响。\n\
  3.  现在，延长轨道使其重复。在重复部分的第一帧，添加一个新位置，使角色占据与原始轨道末尾相同的空间。你很可能只需要略微编辑 `X` 和 `Y` 轴的位置，如果角色不是直线行走，可能还需要在\
  \ `Z` 轴上旋转角色。每个片段都有显示其骨骼的选项，因此通过显示骨骼可以帮助略微编辑 `X` 和 `Y` 位置，因为你本质上只是对齐每个轨道的骨骼，使它们占据相同的空间。\n\
  \n**注意**\n\n\n\n要进一步编辑角色的动作，你可以随时将动画烘焙到控制绑定，并添加 `Additive Section` 以进行进一步编辑。\n\n\
  除了可视化骨架这一便捷工具外，还有其他编辑动画片段的选项。通过在轨道任意处右键单击并转到属性，你会发现编辑片段时有更多选项：\n\n![Figure 10.9:\
  \ Further options ](img/B17878_10_09.jpg)\n\n图 10.9：更多选项\n\n说到合并动画，最重要的是帧率。你可能会发现你正尝试混合两个速度不同的动画。属性功能是解决此问题的好方法，通过更改帧率使它们匹配。你也可以尝试不同的帧率。\n\
  \n既然我们已经了解了如何添加与身体相关的动作捕捉数据，在下一节中，我们将介绍添加和合并动画轨道的相同原则，但这次我们将专注于面部。\n\n### 向 Level\
  \ Sequencer 添加面部动作捕捉数据\n\n要添加和合并面部动画，你需要遵循与处理身体完全相同的步骤，即要么添加一个全新的 Faceware 轨道，要么将动画添加到现有动画轨道的末尾并移动轨道。让我们更详细地看一下。\n\
  \n#### 添加录制的 Faceware 片段\n\n在本节中，我们将把 Faceware 面部动作捕捉文件添加到 Level Sequencer 中。如果你在定位\
  \ Faceware 面部捕捉文件时遇到困难，该文件是由 `Take Recorder` 在 *第 8 章* 中录制的，只需记住 Take Recorder 给角色蓝图的名称添加了\
  \ `_Scene` 后缀。因此，在我的例子中，我只搜索了 `BP+Glenda_Scene`，所有的片段都列了出来供我选择。\n\n在图 10.10 中，你可以看到我将第\
  \ 6 条片段 `BP_Glenda_scene_106_0` 与第 1 条片段 `BP_Glenda_Scene_1_01_0` 进行了合并：\n\n![Figure\
  \ 10.10: Adding Face animation to one animation track ](img/B17878_10_10.jpg)\n\n\
  图 10.10：将面部动画添加到一个动画轨道\n\n我选择了 `BP_Glenda_Scene_1_01_0`。你可以看到关键帧以蓝色出现，包括 `0341`\
  \ 和 `+19`。注意 `+` 图标——这意味着我将片段向右移动了 19 帧，所以它将在 19 帧后开始。\n\n### 编辑面部动作捕捉\n\n编辑面部捕捉动画片段的过程与身体数据几乎完全相同，因此我们可以使用相同的工具并遵循上一节的相同步骤。\n\
  \n此外，我们可以将轨道烘焙为控制绑定中的关键帧，并添加一个 `Additive Section` 来微调动画，正如我们在 *第 8 章* 中所介绍的。从图 10.11\
  \ 中可以看到，我采取了相同的步骤烘焙控制绑定，这由三角形关键帧指示：\n\n![Figure 10.11: Baking the track to the control\
  \ rig ](img/B17878_10_11.jpg)\n\n图 10.11：将轨道烘焙到控制绑定\n\n让面部捕捉与身体捕捉配合工作的很大一部分在于时机。这可能只需要简单地将面部动作捕捉动画轨道向左或向右滑动；另一方面，你可能需要花费更多时间使用面部控制绑定，甚至身体控制绑定，以使两个动画匹配。熟练使用面部控制绑定的唯一途径就是多加实验。一个好的做法是尽可能充分利用原始面部动作捕捉数据，然后使用带有控制绑定的\
  \ `Additive` 片段来完善动画。\n\n介绍了一些高级动画功能后，现在是深入探讨一些高级渲染功能的时候了。\n\n### 探索高级渲染功能\n\n我以前说过，现在再说一遍：Unreal\
  \ Engine 是一个非常强大的工具，在渲染方面，它从不令人失望。Unreal 能够提供卓越的效果，可与 Mental Ray、Arnold、V-Ray 和\
  \ RenderMan 等传统路径追踪渲染器相媲美。Unreal 现在支持路径追踪，这是这些其他渲染器工作原理的基础。\n\n在电影制作领域，Unreal 拥有实时渲染能力，应加以探索以释放其全部潜力。摄像机和灯光拥有我们在\
  \ Maya、Houdini 和 Blender 等使用路径追踪渲染器的 3D 程序中发现的功能。可以从这些应用程序中的任意一个导出完整场景，并保持摄像机和灯光设置完好无损且与\
  \ Unreal 兼容。\n\n那么，废话不多说，让我们来看看这些很棒的渲染功能。\n\n### 添加和制作摄像机动画\n\n在 *第 7 章* 中，我们使用了一种直接从\
  \ Level Sequencer 创建新摄像机的方法；然而，在本章中，我们将在不使用 Level Sequencer 的情况下创建摄像机。\n\n在图 10.12\
  \ 中，我点击了 `Create Actor`（创建 Actor）按钮，以快速向场景中添加一个 Actor。从那里，我选择了 `Cinematic`（电影），然后选择\
  \ `Cine Camera Actor`（电影摄像机 Actor）。这会在我的场景视口中创建一个摄像机：\n\n![Figure 10.12: Quickly\
  \ adding a camera to the scene ](img/B17878_10_12.jpg)\n\n图 10.12：快速向场景添加摄像机\n\n\
  接下来，转到 Level Sequencer，通过点击 `+ Track`（+ 轨道）按钮并选择刚创建的摄像机来添加摄像机。\n\n在图 10.13 中，摄像机切割具有网格背景，上方的视口也是如此。这使我们能够直接在视口中预览来自\
  \ Level Sequencer 的任何摄像机动画：\n\n![Figure 10.13: The camera cut being automatically\
  \ created ](img/B17878_10_13.jpg)\n\n图 10.13：摄像机切割被自动创建\n\n与 MetaHuman 蓝图的身体和面部不同，Cine\
  \ Camera 会自动生成 Transform（变换）功能。这将允许你更改摄像机在 `X`、`Y` 和 `Z` 轴上的位置。你还可以更改摄像机在 `X`、`Y`\
  \ 和 `Z` 轴上的旋转，它们分别改变 Roll（滚转）、Pitch（俯仰）和 Yaw（偏航）。\n\n如图 10.14 所示，右侧有关键帧属性。通常，在制作摄像机动画时，你需要调整\
  \ `Location`（位置）设置并编辑 `Focus Distance`（焦距）设置，以确保主体对焦清晰：\n\n![Figure 10.14: The camera\
  \ transform ](img/B17878_10_14.jpg)\n\n图 10.14：摄像机变换\n\n与其每次想在 Level Sequencer 中设置关键帧时都在\
  \ Level Sequencer 的 Transform 功能中更改数值，不如直接在视口中驾驶摄像机，这很像使用键盘和鼠标玩第一人称游戏。\n\n请务必启用自动关键帧，如图\
  \ 10.15 所示，每次移动摄像机时它都会创建一个关键帧：\n\n![Figure 10.15: The Autokey function ](img/B17878_10_15.jpg)\n\
  \n图 10.15：自动关键帧功能\n\n除了制作摄像机位置动画外，你还可以制作摄像机焦点对象的动画。一个非常方便的对焦工具是 `Debug Focus`（调试对焦）工具，如图\
  \ 10.16 所示。该工具为我们提供了清晰的视觉指示，显示什么在焦点上。选中摄像机后，勾选 `Draw Debug Focus Plane`（绘制调试对焦平面）选项；你会看到一个粉色平面出现。位于该粉色平面上的任何东西都将完美对焦：\n\
  \n![Figure 10.16: Camera debug focus ](img/B17878_10_16.jpg)\n\n图 10.16：摄像机调试对焦\n\
  \n你可以在 Level Sequencer 中控制焦点并制作焦距动画，但请使用调试平面进行精确对焦。\n\n现在，介绍了一些更高级的摄像机功能后，是时候转到灯光了。\n\
  \n### 添加和制作灯光动画\n\n在大多数情况下，Actor 被添加到 Level Sequencer 时会带有一些可制作动画的属性。可以通过 Level\
  \ Sequencer 制作更多属性的动画，但我们需要手动将它们添加到 Level Sequencer 中。\n\n\n\n灯光也是可动画化的 Actor。我们可以将灯光添加到\
  \ `Level Sequencer` 中，方式与之前添加摄像机大同小异。这样做后，默认情况下唯一可动画化的属性是灯光强度。但 `Light Actor` 还有许多属性可供添加以用于动画制作。\n\
  \n在图 10.17 中，你可以看到通过点击 `Level Sequencer` 中摄像机组件旁的 **+ Track**，我可以访问 `Detail` 面板中几乎所有的属性以进行动画制作。点击列表中的任意属性，即可使其成为\
  \ `Level Sequencer` 中可动画化的组件：\n\n![图 10.17：编辑灯光](img/B17878_10_17.jpg)\n\n图 10.17：编辑灯光\n\
  \n一般来说，灯光动画化的情况很少见，就像在实拍中移动灯光很少见但并不罕见一样——也许你想要一辆警车的闪烁灯光或灯塔旋转的灯光，又或者想在角色走过灯光下时调整灯光强度。我可以写一整章关于\
  \ Unreal 中灯光的内容，甚至可以写一整本书，但我们必须继续介绍一个非常重要的功能：`Post Process Volume`。\n\n### 使用后期处理体积\n\
  \n`Post Process Volume` 是一个有趣的工具，因为它赋予了我们对最终画面的巨大控制权。通常，`Post Process Volume` 会包围整个场景，它之所以被称为\
  \ Volume（体积），是因为它是场景中受美术输入影响的一个区域。\n\n本质上，`Post Process Volume` 是一个特效和调色工具，其大部分工具集都针对摄像机。例如，我们可以控制眩光、辉光和色差，这些都是非常具体的镜头特性，此外还有胶片颗粒、曝光调整、白平衡等。如果你看看任何现代摄像机或数字电影摄像机的设置，`Post\
  \ Process Volume` 几乎都有对应的功能。Epic Games 在为美术提供实时渲染场景的真实世界工具方面做了令人难以置信的工作。\n\n在图 10.18\
  \ 中，我使用了其中一些功能：\n\n![图 10.18：使用后期处理体积的镜头效果](img/B17878_10_18.jpg)\n\n图 10.18：使用后期处理体积的镜头效果\n\
  \n让我们看看我使用的一些功能：\n\n*   **镜头眩光** 显而易见。如果你不熟悉镜头眩光，它们是画面中穿过 Glenda 脸部的光斑——它们与光源（Glenda\
  \ 身后的定向光）发生反应。我给镜头眩光添加了粉色色调并增加了 `Bokeh` 大小，这实际上增加了镜头眩光的尺寸。\n*   我还添加了 **辉光** 效果，这让我们从她的头发上得到了真实的光晕。`Bloom`\
  \ 效果模拟了真实镜头上使用的滤镜，如 Pro Mist 滤镜，可以柔化画面中的高光。\n*   此外，我还添加了 **胶片颗粒**、**色差** 和 **暗角**，这些在这里太微妙而难以察觉，但常用于增强真实感：\n\
  \    *   **胶片颗粒** 用于模拟胶片颗粒或数字噪点，这些存在于胶片或数码相机中\n    *   **色差** 是摄影镜头中发现的一种自然现象，会出现非常微妙的彩虹效果，特别是在画面的高光部分\n\
  \    *   **暗角** 是摄影镜头的常见伪影，画面边缘比中间更暗\n\n顾名思义，`Post Process Volume` 是一个*后期制作*工具。就\
  \ Unreal Engine 而言，大多数困难的事情如灯光方向、阴影、皮肤着色、反射等已经设置完毕，但 `Post Process Volume` 在此基础上增加了一层额外的效果。在某种程度上，`Level\
  \ Sequencer` 就像摄像机，而 `Post Process Volume` 就像 Photoshop。\n\n经验法则：最好让所有灯光和摄像机工作尽可能接近最终外观，并依靠\
  \ `Post Process Volume` 实现其他方式无法达到的效果。\n\n`Post Process Volume` 中有相当多的设置，遗憾的是在一本关于\
  \ MetaHuman 的书中无法全部涵盖。然而，它们会让你的 MetaHuman 在渲染时看起来惊艳无比。\n\n> **注意**\n>\n> 如果你想了解更多高级灯光和渲染技术，我建议你查看以下视频教程，可从\
  \ Gnomon Workshop 购买：[Unreal Engine 5 电影级灯光教程](https://www.thegnomonworkshop.com/tutorials/cinematic-lighting-in-unreal-engine-5)。\n\
  \n这带我们进入下一节，我们将仔细研究如何从 `Movie Render Queue` 导出文件以进行合成和调色。\n\n### 使用电影渲染队列\n\n当我们从\
  \ `Level Sequencer` 设置渲染时，可以选择使用哪个渲染队列。要查看可用的渲染队列，请点击拍板图标旁边的三个点，如图 10.19 所示：\n\n\
  ![图 10.19：电影渲染队列选项](img/B17878_10_19.jpg)\n\n图 10.19：电影渲染队列选项\n\n你很可能只会看到 **Movie\
  \ Scene Capture (Legacy)**，但这已经有些过时且功能有限。另一个选项是 **Movie Render Queue**；不过在撰写本文时，它仍处于\
  \ Beta 阶段，因此默认未启用。\n\n要启用它，你需要前往插件部分并搜索 **Renderer**。在图 10.20 中，你可以看到我已经启用了两者，你也应该这样做：\n\
  \n![图 10.20：启用两个渲染队列插件](img/B17878_10_20.jpg)\n\n图 10.20：启用两个渲染队列插件\n\n现在，当你点击 **Movie\
  \ Render Queue** 时，如图 10.21 所示，你将看到以下界面：\n\n![图 10.21：电影渲染队列对话框](img/B17878_10_21.jpg)\n\
  \n图 10.21：电影渲染队列对话框\n\n绿色的 **+ Render** 按钮用于确定要渲染的序列。初始化 `Movie Render Queue` 会将当前的\
  \ `Level Sequencer` 分配用于渲染。但是，如果你的项目中有多个 `Level Sequencer`，可以使用 **+ Render** 按钮将它们添加到渲染队列中。在此对话框中，你将看到三列：\n\
  \n*   **Job**\n*   **Settings**\n*   **Output**\n\n让我们逐一了解这些列。\n\n#### Job\n\n**Job**\
  \ 是被选中用于渲染的 Sequencer 名称。默认情况下，它将被命名为 **New Level Sequence**。请记住，诸如 **Range**（动画时长）和\
  \ **Frame Rate** 等参数是在 `Level Sequencer` 中确定的。\n\n如果你的项目中有多个 `Level Sequencer`，它们将出现在\
  \ **Job** 下，你可以选择要渲染的 `Level Sequencer`。\n\n#### Settings\n\n**Settings** 指的是你想要应用到序列上的渲染设置。\n\
  \n#### Output\n\n**Output** 区域显示图像或视频将被渲染到的文件夹目录，这在输出设置中设定。\n\n渲染设置有相当多的选项可供选择。归根结底，如果你已经决定使用\
  \ `Level Sequencer` 从 Unreal 导出电影，那么你不太可能关心 Unreal 的实时渲染能力，而是计划在后期制作中对渲染序列进行更多工作。\n\
  \n文件类型，无论是电影文件还是图像序列，都是一个重要的考虑设置。例如，如果你计划进行额外的后期制作，如高级调色，则应选择 **Open EXR** 等图像序列设置，它提供更高的色彩保真度。如果你只是计划进行测试渲染或直接从\
  \ Unreal 进行最终渲染，那么 **QuickTime ProRes** 等电影文件就足够了。\n\n让我们看看默认设置，如图 10.22 所示：\n\n\
  ![图 10.22：电影渲染队列中的默认设置](img/B17878_10_22.jpg)\n\n\n\n**图 10.22：Movie Render Queue（电影渲染队列）中的默认设置**\n\
  \n共有三种类型的默认设置：\n\n*   `Exports (jpg Sequence 8bit)`（导出 [JPG 序列 8 位]）：导出允许我们选择想要的文件格式选项，从低保真和压缩格式（如\
  \ JPG，仅为 8 位）到高保真 Open EXR（浮点 16 位）。\n*   `Rendering (Deferred Rendering)`（渲染 [延迟渲染]）：延迟渲染是在\
  \ Unreal 中渲染场景的一种优化且默认的方式。它分两遍渲染。主遍包含诸如 Z 深度和环境光遮蔽等计算。从主（基础）遍中，可以在第二遍中推导出在着色器方面需要按对象计算的内容。这是为了减少处理时间。\n\
  *   `Settings (Output)`（设置 [输出]）：当你点击 `+ Setting`（+ 设置）时，你会看到有更多设置可供选择：\n\n![图 10.23：Movie\
  \ Render Queue 中的可用设置](img/B17878_10_23.jpg)\n\n**图 10.23：Movie Render Queue 中的可用设置**\n\
  \n在将 Level Sequencer（关卡序列器）渲染到硬盘时，我们有各种选项可供选择以提升其质量：\n\n*   `Settings`（设置）：从该列表中，你可以一次性选择多个选项。对于本书，我将添加\
  \ `Anti-Aliasing`（抗锯齿），以便提升动态模糊的质量。\n*   `Exports`（导出）：我将把 `.jpg sequence [8bit]`\
  \ 替换为 `.exr Sequence [16bit]`；这将显著提升渲染质量，特别是在稍后使用视频编辑软件精修画面时。`.exr Sequence [16bit]`\
  \ 以 `Open EXR` 格式导出——它赋予我们在应用程序（如 After Effects、Nuke 或 DaVinci Resolve）中控制过曝和欠曝内容的更强能力。Open\
  \ EXR 是电影和电视领域的全球视觉特效标准，因为它存储的颜色信息比其他格式多得多，且还存储元数据。\n*   `Rendering`（渲染）：让我们看看一些可用的渲染选项：\n\
  \    *   `Deferred Rendering`（延迟渲染）：默认渲染选项，使用多遍渲染。\n    *   `Deferred Rendering\
  \ (Reflections Only)`（延迟渲染 [仅反射]）：此渲染选项仅渲染反射。如果我们想在合成应用程序（如 Nuke）中控制反射强度，这非常方便。通常，你会将此选项作为\
  \ `Deferred Rendering` 的补充来选择。\n    *   `Object IDs (Limited)`（对象 ID [有限]）：每个对象被分配一个对象\
  \ ID，由一种独特的颜色表示。启用此选项后，我们将获得一个对象 ID 视频通道作为 EXR 文件的一部分。在 Nuke 等应用程序中合成时，我们可以通过选择与之关联的颜色，利用对象\
  \ ID 单独操控对象。如果我们想在 Nuke 中更改对象颜色而无需在 Unreal 中修改，这非常方便。\n\n你可以在*图 10.24*中看到我所选择的设置：\n\
  \n![图 10.24：设置选择](img/B17878_10_24.jpg)\n\n**图 10.24：设置选择**\n\n> **注意**\n>\n> EXR\
  \ 文件格式能够存储多个通道。大多数图像文件仅存储三个通道：红、绿、蓝，例如 JPEG 文件。PNG 文件可存储四个通道：红、绿、蓝和用于透明度的 Alpha\
  \ 通道。\n\n### Output（输出）\n\n你的默认 `Output`（输出）设置将与 Level Sequencer 的默认设置相匹配。然而，`Output`\
  \ 列是一种覆盖它们的手段，允许你控制最终的分辨率和帧率。\n\n在*图 10.24*中，我使用了三个渲染设置，它们将渲染为单个 EXR 图像序列，作为独立的通道分别对应以下内容：\n\
  \n*   `Deferred Rendering`（延迟渲染）\n*   `Deferred Rendering (Reflections Only)`（延迟渲染\
  \ [仅反射]）\n*   `Object ID (Limited)`（对象 ID [有限]）\n\n你可以在*图 10.25*中看到该渲染的结果。该图展示了已渲染并存储在\
  \ EXR 文件中的三个额外通道——左上角是 `Deferred Rendering`，看起来正常；右上角是 `Reflections Only`（仅反射）；左下角是\
  \ `Object ID`（在合成软件中，我可以通过操控这些额外通道进行进一步调整）：\n\n![图 10.25：渲染示例](img/B17878_10_25.jpg)\n\
  \n**图 10.25：渲染示例**\n\n新版 Movie Render Queue 中的渲染设置非常强大，赋予艺术家对最终图像的控制力比实时渲染多一些。这符合传统\
  \ 3D 动画制作的预期结果，即合成师获得对 3D 渲染结果同等或更多的控制权。随着 Unreal 的发展，我们预计越来越多的 3D 动画工作室将把 Unreal\
  \ 融入其流水线。\n\n在下一节中，我们将了解一些现在随 Unreal 附带的专业色彩标准，它们允许 MetaHuman 在专业工作室环境中工作。\n\n###\
  \ ACES 和色彩分级\n\n正如上一节所述，`Open EXR` 是视觉特效和 3D 动画工作室用于 3D 渲染和合成的专业行业标准文件格式。原因之一是它能存储海量的像素数据，特别是颜色数据。\n\
  \n你可能记得看到过 `.jpeg sequence [8 bit]` 作为渲染选项。好吧，在专业领域这根本不够用，仅仅因为它甚至无法呈现人眼所能看到内容的一半。8\
  \ 位图像分别只能存储 256 级红、绿、蓝阴影。总共仅约 1600 万种颜色，而 16 位图像则拥有 280 万亿种以上的颜色。\n\n如果你看看*图 10.26*，其中最宽的色域区域由\
  \ `ACES colorspace`（ACES 色彩空间）表示，你会看到与 `sRGB` 相比有显著差异。8 位的 JPEG 格式只能在像 `sRGB` 这样较小的色彩空间内工作。因此，利用\
  \ EXR 文件格式巨大的数据空间和 ACES 巨大的色彩空间，Unreal Engine 能够实现令人难以置信的照片级真实感渲染，这也是为什么选择 `Exr\
  \ Sequence [16bit]` 更可取的原因：\n\n![图 10.26：ACES 色彩空间对比 sRGB](img/B17878_10_26.jpg)\n\
  \n**图 10.26：ACES 色彩空间对比 sRGB**\n\n> **注意**\n>\n> 关于 ACES 色彩空间的进一步阅读，请访问 [`acescolorspace.com/`](https://acescolorspace.com/)。\n\
  \n在本节中，我们揭示了一些与 `ACES colorspace` 与 `sRGB` 相关的高级色彩理论，以及它们如何帮助你改进 MetaHuman 渲染。\n\
  \n### 总结\n\n在本章中，我们有机会复习一些让 MetaHuman “活”起来的关键要素，即将身体和面部动作捕捉应用到 Level Sequencer\
  \ 中。我们探讨了编辑动作和修复常见动作问题的替代方法，例如循环动画时修复角色位置。我们还学习了如何使用 `Transform`（变换）、`Location`（位置）和\
  \ `Show Skeleton`（显示骨架）来帮助使用循环轨道创建更长的动画。\n\n之后，我们介绍了摄像机、灯光和后期处理体积，回顾了 Unreal Engine\
  \ 一些非常强大且专业的渲染能力。\n\n在本书的下一章也是最后一章中，我们将介绍一项新功能（写作时），它允许我们使用自己的肖像或他人的肖像，围绕真实人类打造一个\
  \ MetaHuman！\n"
- "## 第 11 章 使用 Mesh to MetaHuman 插件\n\n在上一章中，我们完成了创建 MetaHuman 并制作包含 MetaHuman 视频的流程。在撰写本书期间，Epic\
  \ Games 发布了 Unreal Engine 5 版本——首先是抢先体验版，随后是完全支持的正式版。此外，Epic Games 还发布了一款开创性的插件，允许用户使用自定义面部网格作为其\
  \ MetaHuman 的面部。这款免费插件称为 `Mesh to MetaHuman`，其核心是 `MetaHuman Identity Asset`（MetaHuman\
  \ 身份资产）。\n\n\n\n\n这为艺术家们打开了机会之门，让他们能够在自定义面部雕塑或真实人物的数字扫描上使用所有很棒的 MetaHuman 相关工具和功能。因为我们可以使用真实人物的数字扫描，所以艺术家们能够创建出与演员甚至艺术家本人有着惊人相似度的\
  \ MetaHuman。\n\n在本章中，我们将重点介绍如何创建和利用你自己的面部数字扫描，并将其应用到 MetaHuman 上。为此，我们将使用一款名为 KIRI\
  \ Engine 的应用程序，它同时适用于 iPhone 和 Android。然后我们将导入数字扫描，以便与 Mesh to MetaHuman 插件配合使用。\n\
  \n因此，在本章中，我们将涵盖以下主题：\n\n* 为 Unreal Engine 安装 Mesh to MetaHuman 插件\n* 介绍并在智能手机上安装\
  \ KIRI Engine 应用\n* 将扫描的网格导入 Unreal Engine\n* 在 MetaHuman Creator 中修改面部网格\n\n###\
  \ 技术要求\n\n就计算机性能而言，你需要满足 *第 1 章* 中详述的技术要求。\n\n你还将需要：\n\n* 一部至少有 200 MB 可用空间的 iPhone\
  \ 或 Android 手机\n* 稳定的网络连接，因为你将下载插件并向服务器上传数据\n* 可访问用于安装 Unreal Engine 的 Epic Games\
  \ Launcher\n* KIRI 应用\n* Mesh to MetaHuman 插件\n* Unreal Engine 中的一个新项目\n\n注意：你需要熟悉\
  \ *第 2 章* 中的 MetaHuman Creator 在线应用程序，但不需要打开前几章的任何项目。\n\n### 为 Unreal Engine 安装\
  \ Mesh to MetaHuman 插件\n\n要开始，请在 Unreal Engine 中创建一个新项目并保持打开状态。然后，要启用 Mesh to MetaHuman\
  \ 插件，我们首先需要通过 Epic Games Launcher 从 Unreal Engine Marketplace 下载它。\n\n当你找到 Mesh\
  \ to MetaHuman 插件页面时，点击 **Install to Engine**（安装到引擎）按钮，如 *图 11.1* 所示：\n\n![Figure\
  \ 11.1: The MetaHuman plugin](img/B17878_11_01.jpg)\n\n图 11.1：MetaHuman 插件\n\n安装好\
  \ Mesh to MetaHuman 插件后，我们现在将进入下一节，开始使用 KIRI Engine 应用创建数字扫描的旅程。\n\n### 在智能手机上介绍并安装\
  \ KIRI Engine\n\n什么是 **KIRI** Engine？KIRI Engine 是一款属于 **摄影测量** 类别的应用程序。摄影测量是利用照片在\
  \ 3D 应用程序中创建 3D 几何体的过程（在大多数情况下是自动完成的）。\n\n在为 MetaHuman 创建面部扫描的背景下，摄影测量要求艺术家在 180\
  \ 度的弧线范围内以及不同高度拍摄多张照片。从 *图 11.2* 中，你可以看到头部和肩膀的四个不同角度。\n\n![Figure 11.2: Typical\
  \ camera positions](img/B17878_11_02.jpg)\n\n图 11.2：典型相机位置\n\n我们只对面部正面感兴趣，这就是为什么我们只在\
  \ 180 度的弧线范围内进行捕捉。获取高角度和低角度也很重要，以便我们获得下巴底部、鼻孔和额头的信息。\n\n摄影测量拍摄技巧：\n\n* 使用漫射（柔和）光照，使面部无阴影\n\
  * 让被摄对象保持静坐，下巴微微上抬\n* 如果可能，使用偏振镜滤镜以最大程度减少皮肤上的反光\n\n现在，让我们开始使用 KIRI。最近，KIRI Engine\
  \ 在 macOS 或 Windows 上通过网页浏览器使用时已推出桌面版本，你可以在此下载：`https://www.kiriengine.app/web-version/`。然而，为了本书的目的，我将假设你拥有一部\
  \ Android 智能手机或 iPhone，并且你正在将 KIRI Engine 应用下载到智能手机上。\n\n如果你有 Android 设备，可以免费从 Google\
  \ Play 安装该应用，如下所示：\n\n![Figure 11.3: KIRI Engine on Google Play](img/B17878_11_03.jpg)\n\
  \n图 11.3：Google Play 上的 KIRI Engine\n\n既然你们中的许多人在 *第 8 章* *使用 iPhone 进行面部动作捕捉* 中已经用过\
  \ iPhone，你们会很高兴地知道不必跑去弄个 Android。通过前往 App Store，你可以在设备上下载 KIRI Engine 应用：\n\n![Figure\
  \ 11.4: KIRI Engine on the App Store](img/B17878_11_04.jpg)\n\n图 11.4：App Store\
  \ 上的 KIRI Engine\n\n使用 KIRI Engine 非常简单，因为运行应用时可供选择的选项很少。当你首次打开 KIRI Engine 时，无论你使用的是\
  \ Android 还是 iPhone 设备，都会看到如 *图 11.5* 所示的简单界面：\n\n![Figure 11.5: The KIRI Engine\
  \ welcome screen](img/B17878_11_05.jpg)\n\n图 11.5：KIRI Engine 欢迎屏幕\n\n在这里，你将可以选择上传之前拍摄的照片，或使用\
  \ KIRI 应用拍照。选择后者，**Take photos**（拍照），屏幕将发生变化：\n\n![Figure 11.6: The manual option](img/B17878_11_06.jpg)\n\
  \n图 11.6：手动选项\n\n手动捕捉设置是默认设置。它由 *图 11.6* 左上角的静态相机图标表示。这是一个手动捕捉选项，意味着每次想拍照时，你都必须点击屏幕底部的大白色按钮。问题在于，每次点击智能手机屏幕都会引入轻微的相机抖动，在特定光照条件下会导致照片模糊。\n\
  \n点击右侧的电影摄像机图标即可访问自动捕捉设置，如 *图 11.7* 所示。使用此设置，你只需点击一次红色按钮即可开始捕捉。此设置每隔几秒拍摄一张照片（多达\
  \ 70 张），如果你移动相机过快，还会发出警告。\n\n![Figure 11.7: The auto-capturing option](img/B17878_11_07.jpg)\n\
  \n图 11.7：自动捕捉选项\n\n注意录制按钮上方的进度线；这指示覆盖质量，即 **Acceptable**（可接受）、**Good**（良好）和 **Perfect**（完美）。**Acceptable**\
  \ 结果将得到一个细节较少且容易出现块状感的 3D 模型，而 **Perfect** 照片结果将得到一个细节更丰富、更平滑的 3D 模型。\n\n理想情况下，你应该让一张照片到下一张照片的重叠度尽可能高。前后相邻图像之间约\
  \ 80% 的重叠度是一个好的经验法则。重叠是指每两三张连续图像应至少共享一个特征，例如眼睛或鼻子。\n\n一旦你达到最大图像数量，并在面部周围达到了合理的覆盖程度，你将看到\
  \ *图 11.8* 所示的界面：\n\n![Figure 11.8: The upload screen](img/B17878_11_08.jpg)\n\n\
  图 11.8：上传屏幕\n\n在这个界面中，你将看到以下选项：\n\n* **Face Counts**（面数）：用于创建 3D 模型的多边形数量。选择 **High**（高），以确保\
  \ MetaHuman 插件有足够的几何体可用（你不必担心生成过于稠密的几何体，因为 MetaHuman 设计用于处理多边形数量极高的高密度网格）。\n* **Texture\
  \ Quality**（纹理质量）：KIRI 不会生成超大的纹理贴图，如果你已在 Unreal Engine 中使用过 MetaHuman，则不会对 KIRI\
  \ 创建的最高质量纹理贴图有任何问题。所以，再次选择 **High**（高）。\n* **File Format**（文件格式）：虽然 Unreal Engine\
  \ 可以导入 OBJ 和 FBX 两种文件格式，但据报告 FBX 格式的处理时间较长；Epic Games 建议使用 OBJ 以便插件快速工作，所以选择 **OBJ**。\n\
  \n\n\n完成选择后，点击那个大大的**上传**按钮。上传过程取决于你的网络连接速度；如果你的连接不稳定，可能会遇到问题，因为你可能需要重复上传过程。照片成功上传后，你将看到以下消息：\n\
  \n![图 11.9：上传成功通知](img/B17878_11_09.jpg)\n\n*图 11.9：上传成功通知*\n\n有几个因素需要考虑进你照片的处理时间中。因为处理工作由云端服务器负责，你的上传任务极有可能被放入了队列中。所以，如果流量很大，你就得耐心等待几分钟。如果你的任务被放入队列或已开始处理，你会收到提示，并且可以在应用内查看其状态。\n\
  \n一旦流程启动，模型的创建速度会快得惊人。完成后，你可以打开它来检查模型。在*图 11.10*中，你可以看到我的一个模型。我知道你可能会被我天使般的外表分散注意力，所以我就简短地说一下：从拍照到获得可用的\
  \ 3D 模型，整个过程从头到尾只花了大约 10 分钟。\n\n![图 11.10：3D 扫描结果](img/B17878_11_10.jpg)\n\n*图 11.10：3D\
  \ 扫描结果*\n\n下一步再简单不过了。只需点击**导出**按钮，即可进入此界面：\n\n![图 11.11：发送你导出的模型](img/B17878_11_11.jpg)\n\
  \n*图 11.11：发送你导出的模型*\n\n在*图 11.11*中，你可以选择提供一个电子邮件地址。提供后，点击**发送**以接收模型的下载链接。它将以**.zip**文件夹的形式发送，其中包含网格的\
  \ OBJ 文件和用于纹理贴图的 JPG 文件。继续之前，请务必解压该文件夹。\n\n在下一节中，你将把面部网格导入 Unreal Engine。\n\n###\
  \ 将扫描的网格导入 Unreal Engine\n\n打开 Unreal Engine 后，前往**内容**文件夹，并在其中创建一个名为**FaceMesh**的新文件夹。在**FaceMesh**文件夹内，右键点击并选择**导入到\
  \ Game/FaceMesh**。这将弹出导入对话框，如*图 11.12*所示，你将看到 JPG 文件（图中左侧）和 OBJ 文件（右侧）：\n\n![图 11.12：JPG\
  \ 和 OBJ 文件](img/B17878_11_12.jpg)\n\n*图 11.12：JPG 和 OBJ 文件*\n\n你只需点击**3DModel**\
  \ OBJ 文件，然后点击**确定**。\n\n这将打开**FBX 导入选项**，如*图 11.13*所示（这看起来可能有点奇怪，因为文件是 OBJ 格式，但这是正确的）：\n\
  \n![图 11.13：导入网格选项](img/B17878_11_13.jpg)\n\n*图 11.13：导入网格选项*\n\n确保勾选了**合并网格**，以确保模型作为单个网格导入。这是唯一需要更改的选项。然后，点击**全部导入**。\n\
  \n导入需要片刻时间。你很可能会收到一个错误日志对话框，提示平滑组存在问题，但这完全正常，不用担心。如果发生这种情况，它会在导入过程结束时出现，因此无需采取任何措施。\n\
  \n导入完成后，如*图 11.14*所示，**FaceMesh**文件夹中将有三个资产：模型、着色器和纹理贴图，后者会自动创建着色器。\n\n![图 11.14：导入的资产](img/B17878_11_14.jpg)\n\
  \n*图 11.14：导入的资产*\n\n现在，在**FaceMesh**文件夹内右键点击，向下导航到**MetaHuman**，然后点击**MetaHuman\
  \ Identity**。这将启用你在本章开头安装到引擎中的新 Mesh to MetaHuman 插件。\n\n![图 11.15：创建 MetaHuman\
  \ Identity 资产](img/B17878_11_15.jpg)\n\n*图 11.15：创建 MetaHuman Identity 资产*\n\n点击**MetaHuman\
  \ Identity**后，将创建一个 MetaHuman Identity 资产，这是使用刚才导入的 3D 扫描所必需的。\n\n现在，**MetaHuman\
  \ Identity**图标在**FaceMesh**中创建好后，双击它。如*图 11.16*所示，MetaHuman Identity 拥有一个相对简单的界面，包含四个主要功能。\n\
  \n![图 11.16：MetaHuman Identity 界面](img/B17878_11_16.jpg)\n\n*图 11.16：MetaHuman Identity\
  \ 界面*\n\n从左到右高亮显示的 MetaHuman Identity 界面功能如下：\n\n*   **来自网格的组件**：我们将之前导入引擎的网格引入此处\n\
  *   **提升帧**：我们在此设置网格的观察角度，供 MetaHuman Identity 用作参考，以确定眼睛、鼻子和嘴巴等关键特征的位置\n*   **追踪活动帧**：MetaHuman\
  \ Identity 使用面部识别算法从新的面部网格中确定关键面部特征\n*   **MetaHuman Identity 求解**：奇迹发生的地方，创建一个与新面部网格比例对齐的\
  \ MetaHuman\n\n请注意，我在*图 11.16*中高亮显示了这四个功能中的每一个。最左侧的功能**来自网格的组件**是唯一处于激活状态的功能。其余功能均处于非激活状态，因为每个功能都依赖于前一个功能才能工作，它们作为一系列必须按顺序遵循的步骤运作。\n\
  \n我们现在将逐步介绍这四个功能：\n\n1.  点击**来自网格的组件**并选择你的模型：\n\n    ![图 11.17：添加你扫描的网格](img/B17878_11_17.jpg)\n\
  \n    *图 11.17：添加你扫描的网格*\n\n    然后按 *F* 键将模型居中，并使用 *E* 键配合旋转小工具使模型面朝前方。\n\n    ![图\
  \ 11.18：旋转模型](img/B17878_11_18.jpg)\n\n    *图 11.18：旋转模型*\n\n2.  当你对面部网格的定位满意时，点击**提升帧**以保存角度。\n\
  \n    ![图 11.19：提升帧](img/B17878_11_19.jpg)\n\n    *图 11.19：提升帧*\n\n    如果你看一下*图\
  \ 11.19*，可以看到视口下方现在有一个名为**帧 0**的提升帧。这表明已创建一个帧，将用作参考。你可以通过点击相机图标（右下角）来创建额外的帧，这将允许你获得一个新角度。然后，你需要再次点击**提升帧**按钮。不过，为了本章的目的，我们保持简单，只使用一次**提升帧**。\n\
  \n3.  接下来，我们需要确保面部网格能被正确追踪。点击**追踪活动帧**按钮，如*图 11.20*中高亮显示的那样。\n\n    ![图 11.20：追踪活动帧](img/B17878_11_20.jpg)\n\
  \n    *图 11.20：追踪活动帧*\n\n    MetaHuman Identity 工具会追踪它所看到的面部特征。为了确保它工作良好，我建议你在*图\
  \ 11.20*中标记的视口里切换**光照**和**无光照**模式。一般来说，它在识别眼睛和嘴巴方面做得很好，这足以让你获得一个与面部扫描高度相似的模型。\n\n\
  4.  接下来，我们需要为新的 MetaHuman 创建一个体型。请看*图 11.21*。选择**身体**，然后选择一个接近你自己的体型。\n\n    ![图\
  \ 11.21：选择身体](img/B17878_11_21.jpg)\n\n    *图 11.21：选择身体*\n\n5.  现在，我们需要处理来自面部网格扫描的新网格形状。点击**MetaHuman\
  \ Identity 求解**，如*图 11.22*所示。\n\n    ![图 11.22：等待 MetaHuman 后端……](img/B17878_11_22.jpg)\n\
  \n    *图 11.22：等待 MetaHuman 后端……*\n\n    你会在屏幕右下角看到一条提示，显示**正在等待 MetaHuman 后端……**。这是因为处理将在\
  \ MetaHuman 云端进行，因为它要创建一个 MetaHuman 解决方案。\n\n6.  等待后端的过程可能需要几分钟，但一旦完成，**网格转 MetaHuman**按钮将可供选择，如*图\
  \ 11.23*所示。\n\n    ![图 11.23：网格转 MetaHuman 按钮](img/B17878_11_23.jpg)\n\n    *图 11.23：网格转\
  \ MetaHuman 按钮*\n\n\n\n图 11.23：Mesh to MetaHuman 按钮\n\n1. 选中后，你将获得一个 `Mesh to MetaHuman`\
  \ 弹出对话框，如图 11.24 所示。只需点击 `OK`。\n\n![图 11.24：你的 MetaHuman 现已可用](img/B17878_11_24.jpg)\n\
  \n图 11.24：你的 MetaHuman 现已可用\n\n此时，我们无法看到 Mesh to MetaHuman 插件的进度，因为处理过程在云端进行。更具体地说，我们需要前往\
  \ MetaHuman Creator 在线工具查看结果。\n\n在下一节中，我们将转到 Quixel Bridge，可以从你的 `Content` 文件夹或独立的\
  \ Quixel Bridge 应用程序访问。我们使用 Quixel Bridge 来访问我们的新 MetaHuman，以便使用在线 MetaHuman Creator\
  \ 进行调整。\n\n### 在 MetaHuman Creator 在线工具中修改面部网格\n\n打开 Quixel Bridge 后，导航到 `My MetaHumans`。在那里你会看到一个新的黑白图标。如图\
  \ 11.25 所示，该图标表明此 MetaHuman 是使用 `Mesh to MetaHuman` 插件创建的。点击黑白图标并导航到 `Start MHC`\
  \ 按钮。\n\n![图 11.25：MetaHuman Identity 图标](img/B17878_11_25.jpg)\n\n图 11.25：MetaHuman\
  \ Identity 图标\n\n你将被带到熟悉的 MetaHuman Creator 在线应用程序，该应用在 第 2 章 中介绍过。正如图 11.26 所示，MetaHuman\
  \ 没有皮肤且有些变形。最显著的是，上半部分头部不自然地突出。原因是使用 KIRI Engine 应用创建的面部网格扫描也扫描了我的头发；MetaHuman Identity\
  \ 求解器无法确定头发实际是什么，导致生成了皮肤组织而不是头发。\n\n![图 11.26：带有面部扫描的 MetaHuman Creator](img/B17878_11_26.jpg)\n\
  \n图 11.26：带有面部扫描的 MetaHuman Creator\n\n头发问题有一个简单的修复方法。点击 `Face` 下的 `Custom Mesh`\
  \ 选项，如图 11.27 所示。\n\n![图 11.27：Custom Mesh 工具](img/B17878_11_27.jpg)\n\n图 11.27：Custom\
  \ Mesh 工具\n\n如果你看左侧的面部缩略图，它被分割成各个组件，对应右侧我面部上色码的组件。\n\n也要注意 `Region Influence` 滑块，我已将其降至\
  \ 0。这意味着该部分网格的形状由 MetaHuman 模板决定，而不是由 KIRI Engine 扫描创建的面部网格决定。对比图 11.26 和图 11.27，你可以看到区别——前者的头部比后者块状得多。\n\
  \n如果你想进一步编辑，可以点击 `ENABLE EDITING` 按钮微调网格。不过，我建议你先改进扫描技术以获得更好的结果，将 `ENABLE EDITING`\
  \ 选项作为最后的手段。\n\n> **注意**\n>\n> 高质量照片能获得更好的结果。在本例中，光照条件不理想的智能手机导致了失真问题。在空白背景和非常柔和灯光的小型摄影棚中使用单反相机会获得更优的结果。此外，使用偏振滤镜进一步消除任何反光将是一个额外的加分项。\n\
  \n现在，让我们继续处理皮肤。我们从 KIRI Engine 扫描和随后导入 Unreal Engine 获得的纹理贴图和着色器已经丢失。这是一件好事。MetaHuman\
  \ 拥有极其强大的皮肤着色器，能在 Unreal Engine 中非常真实地响应光照，我们将利用这一点。\n\n因此，如图 11.28 所示点击 `Skin`，然后点击\
  \ `ASSIGN` 按钮分配肤色。\n\n![图 11.28：分配肤色](img/B17878_11_28.jpg)\n\n图 11.28：分配肤色\n\n\
  这将立即赋予我们带有 MetaHuman 所有着色器属性的肤色。我们现在对自定义面部扫描拥有的皮肤控制级别，与我们在 第 2 章 中首次创建 MetaHuman\
  \ 时拥有的相同：\n\n![图 11.29：编辑皮肤](img/B17878_11_29.jpg)\n\n图 11.29：编辑皮肤\n\n从图 11.29 也可以看出，默认光照给我们带来了相当柔和的光照结果。由于使用\
  \ KIRI Engine 在柔和光照下拍照是首选，在 MetaHuman Creator 中使用默认光照有助于匹配我们原始照片的肤色。\n\n为了更好地判断模型是否工作正常，添加一些类似你自己的头发，就像我在图\
  \ 11.30 中所做的那样：\n\n![图 11.30：添加头发](img/B17878_11_30.jpg)\n\n图 11.30：添加头发\n\n因为 MetaHuman\
  \ Creator 会持续自动保存你的 MetaHuman，你可以随时返回进行编辑。你也可以随时使用 Quixel Bridge 将带有自定义面部网格的新 MetaHuman\
  \ 添加到项目中。\n\n你可以花费大量时间修改自定义 MetaHuman，你应该花费的时间实际上取决于你的最终目标。如果你追求完美的相似度，你拥有 MetaHuman\
  \ Creator 中所有的移动和雕刻工具，以及配合 KIRI 使用的所有照片作为参考，以实现更高的真实感。\n\n### 总结\n\n在本章中，我们了解了一个极好的额外功能，可用于创建与真人相似的角色。我们介绍了下载和安装\
  \ Mesh to MetaHuman 插件的过程，然后继续使用测量摄影学应用 KIRI Engine。之后，我们导入了 KIRI Engine 面部网格并利用\
  \ MetaHuman Identity 插件，学习了如何让自定义面部网格在 MetaHuman Creator 中工作，以及如何完善它并修复问题。\n\n实际上，本章是一个额外章节，深入探讨了在撰写本书过程中推出的新工具。这是一个非常强大的新工具，不仅有潜力为数字角色替身创建合理的相似度，而且经过额外努力，还能为数字替身提供非常逼真的结果。\n\
  \n除了使用人物的 3D 扫描，你可能还会扫描雕塑，或重新利用其他 3D 模型，如奇幻角色甚至卡通风格角色。可能性是无限的。\n\n这就是本书的结尾！我们涵盖了大量内容，考虑到我们在整本书中拥抱的技术和创新，这简直是轻描淡写。\n\
  \n作为一名艺术家和电影制作人，我的初衷是为其他艺术家和电影制作人汇编一份可供遵循和享受的指南。你们中的许多人精通 CGI 和动画，而许多人则处于旅程开始时的新手阶段。无论哪种方式，你现在都拥有一份分步指南，教你如何利用直到最近仍为大型动画工作室独有的技术，创造你自己的愿景、动画和娱乐作品！\n"
