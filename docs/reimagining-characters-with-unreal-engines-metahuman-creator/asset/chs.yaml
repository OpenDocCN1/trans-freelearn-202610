  5.  这将引出另一个对话框，我们可以在其中选择 `SIGN IN WITH EPIC GAMES`。


  右上角的 `SIGN IN` 将变为一个人物图标，表明你已成功登录：


  ![Figure 1.14: Successfully signed in](img/B17878_01.14.jpg)


  *图 1.14：成功登录*


