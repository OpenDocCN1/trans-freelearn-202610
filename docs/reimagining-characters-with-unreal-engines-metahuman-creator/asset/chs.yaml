  \ Engine Mannequin`（虚幻引擎模型人）。\n\n如果你一直跟随所有章节操作，你还将拥有来自 *第 5 章* 和 *第 6 章* 的 `Mixamo`\
  \ 和 `DeepMotion` 数据。我们将在此处使用这些数据。\n\n### 将 MetaHuman 蓝图和身体动捕数据添加到关卡序列器\n\n在本节中，你将再次将\
