  *   `Lighting`

  *   `Camera`

  *   `Render Quality`

  *   `LOD`


  您可以在此处看到这些选项：


  ![图 2.15：查看选项](img/B17878_02_15.jpg)


  图 2.15：查看选项


  现在让我们逐一查看每个选项。


  ### 光照


  在 MHC 的大多数光照设置中，使用了 `image-based lighting`（基于图像的光照）。简单来说，基于图像的光源是一个球体，其内部有一张图像，用作整个场景的光源。这能给我们带来非常真实的光照效果，也是虚幻引擎中使用的一种工艺。要理解现实世界中的基于图像光照，拿一大张纸贴近电脑显示器，全屏播放视频。确保所有灯光关闭，电脑屏幕亮度调至最大。您会看到屏幕现在正在照亮这张纸，视频同时影响着光照的强度和颜色。纸张反射率越高，光照影响在肉眼中就越明显。


  如果您点击 `图 2.15` 中可见的 `Studio`，您将看到多种光照设置，帮助您设计心中构想的特定场景。共有 13 个光照预设，如 `图 2.16` 所示：


  ![图 2.16：各种光照设备](img/B17878_02_16.jpg)


  图 2.16：各种光照设备


  现在让我们逐一了解每个选项：


  *   **`Studio`**（默认设置）：由少量柔光灯组成的光照设置，以模拟柔和的摄影光照。这是默认光照设备。

  *   **`Indoor`**：此预设包含使用图像而非一组灯光的光照（如前所述，这称为基于图像的光照）。在本例中，它是一张以 360 度角度捕获的室内图像，为我们提供了来自各个角度的真实光照。此预设允许用户看到角色在典型窗口采光和环境反射光下的对比度水平。

  *   **`Outdoor`**：这是另一个基于图像光照的示例，允许用户查看室外环境光的效果，以及直射阳光的强烈程度和在角色皮肤上投射的阴影。






  ## 灯光预设


  *   **`Silhouette`**：在角色设计中，一个重要却常被忽视的功能是以剪影形式查看角色。它让我们能在没有颜色、反射和阴影特征干扰的情况下，快速观察角色的形状轮廓。


  *   **`Split`**：虽然类似于 `Studio` 灯光预设，但 `Split` 提供了高对比度，且由于主光的强度，是衡量角色皮肤半透明度的绝佳方式。在此预设中，我们有从高强度主光到完全黑暗的分割。它是同时展示写实感和极端光照、并确定从强光到黑暗的光衰减在写实感和风格上表现的绝佳方式。高强度光照与阴影之间的区域，尤其是在皮肤上，被称为
  `roll-offs`（衰减过渡区），这是摄影师常用的术语。


  *   **`Fireside`**：与 `Split` 类似，我们获得了高对比度，但也得到了火焰典型的渐变衰减和衰减效果。此外，我们还获得了从橙色到深蓝色的火焰典型色调。最重要的是，`Fireside`
  允许用户确定强光的衰减过渡及其如何在面部周围过渡到阴影，以及与 `Split` 预设（会呈现皮肤表面明显的细节）相比，在这种微妙度下皮肤细节是否仍然存在。


  *   **`Moonlight`**：与 `Fireside` 类似，我们看到了生动的色调——在本例中是蓝色的月光。然而，这是一种更强的环境光，且没有来自任何单一角度的强烈光照强度。


  *   **`Tungsten`**：虽然不能完全代表普通钨丝灯的色调，但它确实让我们能看到肤色对钨丝灯的反应。这样的灯光预设可以决定在类似场景下，雀斑的细节会损失或保留多少。


  *   **`Portrait`**：这是一个非常实用的预设，因为它既可作为室内光也可作为室外光，以确定角色皮肤的表现。例如，通过使用 `Left Mouse
  + L` 旋转场景灯光，或使用图 2.16 所示的 `Light Rig Rotation`（灯光装置旋转）滑块，我们可以模拟带有日光的窗户，而不会受到 `Indoor`（室内）灯光预设自带背景图像中的干扰元素影响。


  *   **`Red Lantern`**：与 `Fireside` 类似，我们有强烈的红色色调可供使用，但我们拥有在没有深蓝色背景的情况下看到更高强度的优势。这使我们能够着眼于更具戏剧性的灯光设置进行工作。


  *   **`GR22 Rooftop`**：这是基于图像的光照（IBL）非常有效的用例，但它提供略微阴天的光照。这是一个方便的灯光预设，适用于许多日光场景，因为虽然存在高强度区域，但大部分情况下我们获得的是略微漫射的光线。这种漫射光来自直接光被建筑物和地面表面反射回来，就像在现实世界中一样。


  *   **`Downtown Night`**：这与 `GR22 Rooftop` 非常相似，只是处于夜晚，且纯粹由路灯和汽车等电光源照亮。


  *   **`Underpass Night`**：这与 `Downtown Night` 相似，但空间更狭小。它仅包含固定灯光，结合了色调和强度各异的多个钨丝灯。


  要进一步深入，MHC 有一个背景颜色选项。对于某些灯光预设，你可以看到更改背景颜色产生的强烈影响。例如，你可能想在通用的摄影棚柔光下查看角色外观，但又想看角色置于你为场景构想的特定颜色背景前的效果。在图
  2.17 中，我用 Glenda 角色展示了一些灯光装置效果：


  ![图 2.17：各种灯光示例](img/B17878_02_17.jpg)


  *图 2.17：各种灯光示例*


  ## 相机


  根据图 2.15，默认相机设置为 `Face`（面部）。不过，有几个预设相机角度可供使用键盘快捷键调用：


  *   `1`：`Face`（面部）

  *   `2`：`Body`（身体）

  *   `3`：`Torso`（躯干）

  *   `4`：`Legs`（腿部）

  *   `5`：`Feet`（脚部）

  *   `6`：`Face`（面部）


  或者，你也可以像使用相机预设一样轻松地用鼠标导航。如果你在场景中迷失了方向，一个实用的快捷键是按 `1` 键，使用 `Face` 相机预设回到正视角色头部的视角。


  此外，我们还可以预览多种不同的渲染质量预设，以模拟虚幻引擎中存在的渲染质量设置。


  ## 渲染质量


  在渲染质量方面，MHC 提供了三个选项供选择：


  *   `Medium`（中等，这是默认设置）

  *   `High (ray traced)`（高，光线追踪）

  *   `Epic (ray traced)`（极高，光线追踪）


  如果你选择带有光线追踪设置的最高质量，这不会对你的机器产生任何影响，因为高质量渲染的处理完全在云端完成。然而，此功能是一个有用的指示器，显示你在类似灯光设置下使用最高设置时将获得的结果。


  渲染设置之间的差异很微妙。你可能会注意到发丝下的质量会因你使用的质量而增强。它们的存在仅是为了给你一个指示：如果你提供类似的设置，使用虚幻引擎自带的相应渲染质量设置，你的角色会是什么样子。


  ## 细节层次


  **细节层次** (`LOD`) 是基于一个源对象生成多个网格体和纹理贴图。每个网格体和贴图将包含不同数量的细节。


  `LOD` 的目的是引擎优化。由于游戏引擎的设计原则之一是实时渲染，`LOD` 通过在不需要时减少网格体中的三角面数量或纹理贴图中的像素数量来提供帮助。`LOD`
  基于根据相机距离改变网格体复杂度的原则工作。相机离物体越远，在不破坏真实感错觉的前提下，所需的细节就越少。


  例如，MetaHuman 面部的特写镜头需要尽可能最好的质量。在这种情况下，我们需要查看原始网格体和纹理贴图。一般来说，MHC 的原始网格体约为 35,000
  个三角面，由宽度高达 8,000 像素的纹理贴图组成。如果不是必要，渲染这种数据将是巨大的资源浪费。


  一个查看 `LOD` 对角色效果如何的好练习是：前往视口并通过 `Face` 相机观察。你可以通过简单地按键盘上的 `1` 来实现。这将给你一个角色的特写。从那里，你可以从
  `LOD 0` 一直到 `LOD 7` 选择各种 `LOD`。


  起初，你不会注意到 `LOD 0` 和 `LOD 1` 之间有太大区别，但一旦降到 `LOD 5`、`LOD 6` 和 `LOD 7`，你会注意到几何体和纹理贴图质量都有显著下降。你可以在图
  2.18 中看到这一变化：


  ![图 2.18：LOD 0 到 7](img/B17878_02_18.jpg)


  *图 2.18：LOD 0 到 7*


  我们可以通过使用 `Far`（远景）相机进一步推演这一点；你可以通过按键盘上的 `6` 来实现。不幸的是，这是我们在 MHC 中能将相机拉远的最远距离。然而，通过在
  `LOD 6` 和 `LOD 7` 之间切换，我们可以看到差异。这是因为 `LOD 6` 和 `LOD 7` 设计用于相机距离更远时使用。


  在此视图下，如果你在 `LOD 3` 和 `LOD 4` 之间切换，不会看到太大区别。因此，显示 `LOD 0`（约 35,000 个三角面和 8K 纹理贴图）显然是资源浪费。没有
  `LOD`，计算机永远无法处理多个角色，更不用说人群了。


  当涉及 MetaHuman 和虚幻引擎时，这一过程在很大程度上是自动化的，但当我们把角色带入虚幻引擎时，我们将讨论 `LOD`，特别是针对头发的 `LOD`。





  我们已经详细介绍了皮肤编辑器，在此我想提醒您，皮肤的额外编辑始终可以在 Unreal Engine 中完成。但目前，在下一节中，我们将讨论眼睛。


  ### 眼睛


  MHC 拥有一个功能极其强大的眼睛编辑工具。其特别之处在于，部分眼部工具可在 Unreal 中进行编辑。例如，如果您想为虹膜大小制作动画，可以直接在 Unreal
  中实现。


  在这里，我们将查看 `Eyes` 编辑器的以下属性：


  *   `PRESETS`（预设）

  *   `IRIS`（虹膜）

  *   `SCLERA`（巩膜）


  现在让我们来看看这些内容。


  #### 预设


  如图 2.19 所示，MHC 提供了一些很棒的预设供选择，提供了一系列不同的棕色、蓝色和绿色眼睛供您挑选：


  ![Figure 2.19: Eye presets ](img/B17878_02_19.jpg)


  图 2.19：眼睛预设


  在大多数情况下，您可以直接使用默认预设，但您可能希望深入具体细节（我们将在下一节中介绍），在那里您可以实现非常具体且自然的外观，从健康的眼睛到非常不健康的眼睛。


  > **注意**

  >

  > 在开始编辑角色的眼睛之前，请善用灯光工具，确保拥有最佳可用灯光。眼睛细节丰富，因此您需要近距离观察，并将 LOD 设为 0，从而以最高质量进行渲染。


  #### 虹膜


  接下来让我们看看 `IRIS` 面板，如图 2.20 所示。不深究每个功能的具体作用，您面临的第一个选择是编辑右眼、左眼或双眼。`Base Color`（基础颜色）允许您编辑最接近虹膜的颜色，而
  `Detail Color`（细节颜色）允许您编辑最接近角膜缘的眼部外侧区域。您还可以编辑 `Color Balance`（色彩平衡）和 `Color Balance
  Smoothness`（色彩平衡平滑度）选项，并从九种虹膜纹理中进行选择：


  ![Figure 2.20: IRIS ](img/B17878_02_20.jpg)


  图 2.20：IRIS


  就像肤色一样，`IRIS` 编辑功能仅限于自然外观。然而，通过加深角膜缘的黑暗度，并在颜色编辑器中追求高饱和度，您可以获得一些相当狂野的效果。


  #### 巩膜


  虽然 `IRIS` 编辑器是一个很棒的工具，但大部分真实感源自 `SCLERA` 选项卡，如图 2.21 所示。实际上，这涉及编辑眼白。虽然您可以通过 `Tint`（色调）选项做很多文章，它是在蓝色和黄色之间取得平衡，但
  `Brightness`（亮度）选项结合 `Tint` 在眼部老化方面非常强大：


  ![Figure 2.21: SCLERA ](img/B17878_02_21.jpg)


  图 2.21：SCLERA


  MHC 还通过 `Vascularity`（血管丰度）滑块带来了大量细节。当您开始旋转血管时，这一点清晰可见。这些是极端特写镜头的强大工具，值得在导出 MetaHuman
  之前花些时间打磨。CGI 角色通常因为眼睛过于明亮完美而失去真实感。


  让我们看一个结合 `Eyes` 编辑选项的示例。图 2.22 中的大部分编辑是使用 `SCLERA` 编辑选项卡完成的，除了在 `IRIS` 编辑选项卡中提亮角膜缘，以及降低基础和细节颜色选择器中的颜色饱和度：


  ![Figure 2.22: Separate eye editing example ](img/B17878_02_22.jpg)


  图 2.22：分离式眼睛编辑示例


  我的目标只是让眼睛显老。总的来说，我可能有点过头了，格伦达此时该去看医生了。然而，她右眼的结果看起来更真实一些，仅仅是因为增加了细节并去除了完美的洁白。


  ### 牙齿


  另一个能为 MetaHuman 增添真实感却常被忽视的工具是 `Teeth` 编辑器。就像眼睛一样，MHC 增加了一层细节和瑕疵，使角色更逼真。我们可以让牙齿因真实的着色而发黄，和/或真实地长得歪斜。我们甚至可以让牙龈萎缩。MHC
  拥有相当多的牙齿编辑器，拥有您实现海量外观变化所需的一切。


  首先，最好确保您处于光线充足的环境中，并打开角色的下颚，以便在编辑牙齿时更好地了解修改效果。为此，有一个方便的 `Jaw Open`（张嘴）滑块。


  看图 2.23，显而易见，格伦达有一口好牙。它们完全整齐，完美洁白，没有牙菌斑或任何其他问题的迹象：


  ![Figure 2.23: Teeth before ](img/B17878_02_23.jpg)


  图 2.23：编辑前牙齿


  有两种编辑方式：


  *   在图 2.23 中，红框指示了可视化编辑方式。将鼠标悬停在每个灰色圆圈上，您将看到每个滑块编辑的内容——例如 `Tooth Length`（牙齿长度）、`Tooth
  Spacing`（牙齿间距）等。

  *   然而，另一种方法是使用下拉列表，从显示 `Tooth Length` 的位置开始，如图 2.24 所示：


  ![Figure 2.24: Editing teeth ](img/B17878_02_24.jpg)


  图 2.24：编辑牙齿


  我建议使用下拉列表进行编辑，因为它提供了一个编辑强度的滑块，以及一个变化程度的滑块，同时还能提醒您正在编辑的内容，例如 `Tooth Length`、`Tooth
  Spacing`、`Overbite`（深覆合/地包天）等。牙齿的可视化图表也有滑块，如图 2.25 左上角所示，但它们只允许您编辑任何给定参数（如 `Overbite`）的强度。


  大部分真实感在于对牙齿进行微妙的改动，例如牙菌斑颜色，并在下拉菜单中的所有项目上添加强度很低的细微变化，该菜单再次出现在图 2.25 中。操作 `TEETH`
  图表下的下拉菜单、滑块和色板将赋予您最大程度的控制权：


  ![Figure 2.25: The Teeth editor ](img/B17878_02_25.jpg)


  图 2.25：牙齿编辑器


  话虽如此，如果您进行大幅度修改，预览 `Face ROM` 组件是值得的，因为牙齿对角色的整体表情有显著影响。一个主要考量因素是牙龈或深覆合的程度。深覆合会给人留下下颚发育不全和天真表情的印象，而反颌则会给人留下下颚过度发育和严肃表情的印象。当然，这很大程度上是主观的，但绝对值得考虑。


  为了结束本节关于牙齿的内容，我想强调牙齿编辑对整体角色设计的重要性，以及它经常被忽视。


  我们现在将继续，看一项并非适用于所有角色设计，但在 MHC 中是强大编辑工具的功能：化妆，以及将其应用于角色。


  ### 化妆


  MHC 拥有一些非常出色的化妆功能，它们与角色的肤色协同工作。`Makeup` 编辑器分为四个选项卡：


  *   `FOUNDATION`（粉底）

  *   `EYES`（眼妆）

  *   `BLUSH`（腮红）

  *   `LIPS`（唇妆）


  现在让我们逐一查看。


  #### 粉底


  如前所述，`Makeup` 编辑器与角色的肤色协同工作。早前在 `Skin` 编辑器下，我们可以选择编辑整体肤色。该信息会被纳入化妆 `FOUNDATION`
  编辑器，根据您最初为角色选择的肤色，为用户提供合适的调色板。这是为了模拟现实世界的化妆决策。例如，白种人的妆容选择会与非裔美国人的不同。


  正如您在图 2.26 中所见，我们可用的粉底调色板非常局限于角色的肤色；这是为了提供最佳效果：


  ![Figure 2.26: With no foundation makeup ](img/B17878_02_26.jpg)


  图 2.26：未涂粉底





  ## 妆容


  务必勾选**涂抹粉底**，并从给定的调色板中选择一种颜色。之后，您可以编辑**强度**、**粗糙度**和**遮瑕**选项。**强度**不言自明，但在化妆术语中，可以理解为粉底涂抹的厚度。**粗糙度**可以理解为油性粉底和粉状粉底的区别。然而，**遮瑕**是指眼下部位涂抹的强度。


  此外，如果您返回并增加角色雀斑的强度和密度，您将更好地了解您制作的粉底妆容涂抹得有多浓或多厚。在图 2.27 中，我正是这么做的：


  ![Figure 2.27: Foundation with a new palette](img/B17878_02_27.jpg)


  图 2.27：使用新调色板的粉底


  我还让妆容变得非常粗糙，并将强度调低到足以让我们勉强看到雀斑透出来。请注意，图 2.26 和图 2.27 之间的调色板差别很大。


  ### 眼睛


  请勿将其与之前的眼睛编辑器混淆，此编辑器专门用于眼部化妆。图 2.28 显示了一系列眼部化妆预设：


  ![Figure 2.28: Eye makeup](img/B17878_02_28.jpg)


  图 2.28：眼部化妆


  与之前的眼睛编辑器类似，我们也有一系列妆容形状可供选择。例如，我们可以选择顶部的细眼线预设之一，或底部的夸张晕染形状。


  同样，我们可用的调色板与肤色相衬，您可以在图 2.29 中看到这一点，但除了在预设下获得一个自然互补的调色板供选择外，您还可以选择其他选项，如**中性**、**深沉**和**鲜艳**；您对调色板的选择通常取决于您的角色。您还可以创建自定义调色板：


  ![Figure 2.29: Eye makeup palette options](img/B17878_02_29.jpg)


  图 2.29：眼部化妆调色板选项


  与**粉底**选项卡一样，我们有滑块允许我们编辑以下内容：


  *   **粗糙度**：允许我们编辑眼部妆容对光线的反射程度。粗糙度为 0 时反射性极强，而粗糙度为 1 时则无反射。

  *   **透明度**：这与强度的工作方式相同；透明度越低，涂抹的眼部妆容就越厚。

  *   **金属度**：这是一种反射类型，表示金属度越高，我们在反射中看到的细节越多；设置较低会带来较暗淡的光泽。例如，一个高金属度且无粗糙度的表面看起来会像镜子。如果金属度低且粗糙度低，它会发亮但反射微弱。最后，如果金属度低且非常粗糙，它会非常暗淡，类似于粘土或灰泥。


  与之前的许多功能（如粉底）一样，眼部妆容能给我们带来相当逼真的效果。我们将在下一节中看到更多相关内容，届时我们将介绍脸颊和腮红妆容。


  ### 腮红


  同样，**腮红**调色板反映了与肤色互补的调色板。与眼影编辑器不同，我们只获得一个调色板，因为腮红通常只有互补色调，而不像眼影编辑器那样提供鲜艳的替代色调：


  ![Figure 2.30: Blush palette options](img/B17878_02_30.jpg)


  图 2.30：腮红调色板选项


  从左上角开始，我们可以选择希望受影响的区域，主要集中在脸颊和太阳穴周围，如图 2.30 中的蓝色所示。


  我们还获得**强度**和**粗糙度**滑块，这使我们能获得更强的真实感。低粗糙度的腮红会有不同于粉底的光泽，也不同于底层肤色的光泽。皮肤上所有这些细微的妆容变化都增加了真实感，绝对值得反复调整尝试。


  ### 嘴唇


  最后，让我们讨论一下**嘴唇**编辑器，如图 2.31 所示。与**腮红**选择类似，变化不算大，但至少我们可以调整**粗糙度**、**透明度**和**颜色**，这与**腮红**中可用的种类已经很接近了：


  ![Figure 2.31: Lipstick palette options](img/B17878_02_31.jpg)


  图 2.31：口红调色板选项


  顶部的灰色缩略图指示口红的涂抹方式：第一个表示无口红，其余三个选项在涂抹方式上给我们非常细微的差别，有些稍微超出嘴唇区域，有些则涂抹得较少。


  不过，如果我们想要更鲜艳或更前卫的效果，确实还有更多选项可供选择。我们还可以使用**自定义**按钮微调颜色选择。和之前一样，**粗糙度**滑块允许我们让口红更亮、反射更强。此时我们已经大量尝试了粗糙度；粗糙度低的结果会对场景中的光线产生真实的响应。在图
  2.32 中，嘴唇的白色区域是光源的反射：


  ![Figure 2.32: Lipstick Roughness set to zero](img/B17878_02_32.jpg)


  图 2.32：口红粗糙度设为零


  ### 注意


  要查看粗糙度的效果，请尝试将嘴唇的粗糙度降至零，放大嘴唇，然后按住 `L` 键，在主视口周围左键单击鼠标以移动场景灯光。


  本章迄今为止，我们详细介绍了面部。在下一节中，我们将转向完全不同的内容，当我们深入探讨头发和头发物理时，您将接触到一些新概念。


  ## 头发


  就像面部一样，MHC 提供了许多可供选择的预设，也提供了一些自定义修改。如果您加载一个长发角色，您会立即注意到头发移动得非常逼真；您在虚幻引擎中也能获得完全相同的效果。


  关于头发渲染，有两个主要因素需要考虑：


  1.  **发丝** 或 **基于发丝的毛发**：这些使用样条线代表单根头发，虽然有一点“作弊”成分以营造更多头发的错觉。使用基于发丝的毛发，我们能获得更逼真的外观，但头发移动和与身体碰撞的物理表现更准确。

  2.  **发卡**：这些是带有多根头发图像的简单多边形形状。发卡也更容易渲染，是在显示较低 LOD 时的默认选择。


  默认情况下，MHC 对 LOD 0 和 LOD 1 使用**基于发丝的毛发**。换句话说，它们用于特写和中景镜头（头部和肩部镜头）。当角色离相机较远时，**基于发丝的毛发**的复杂度就大材小用且多余，因此改用发卡。如果您发现性能或帧率较低，MHC
  也提供仅使用发卡的选项。


  ### 注意


  关于 LOD 的一些预设仍在开发中，仅提供**基于发丝的毛发**，正如我之前提到的，这些仅在 LOD 0 和 LOD 1 中可用。由于没有发卡替代方案，除非您在虚幻引擎中强制设置
  LOD 为 0 或 1，否则您的角色在远距离下将显得秃顶。在我们将角色导入引擎后，您将学习如何执行此操作。


  关于**头发 LOD** 还有一个考虑因素是渲染质量。您可能记得，在本章前面的*渲染质量*部分，**史诗级（光线追踪）**为我们提供了头发内部更逼真的阴影，因此值得考虑该设置以获得最佳头发效果。当使用
  LOD 1 或 LOD 2 时，如果您想在特写镜头中实现照片级真实感，很可能需要**史诗级（光线追踪）**设置。






  # 头发与造型


  话虽如此，根据角色与摄像机的距离，您也可能可以使用较低的渲染质量设置，这将缩短渲染时间。


  除了头皮头发，`MHC` 还提供眉毛、睫毛、胡须和络腮胡的解决方案。我们现在将讨论这些元素。在浏览这些选项时，我们会发现可用的编辑选项在很大程度上是相似的。主要就是颜色、粗糙度和盐胡椒（黑白相间）。


  ## 头部


  `Head`（头部）编辑器为我们提供了编辑头部头发的所有可用工具，如图 2.33 所示。与许多其他角色创建工具不同，`MHC` 在 Unreal 内部提供了物理动力学解决方案。简而言之，这意味着头发将真实地移动并与物体（如角色的肩膀）发生交互，并对重力和风等因素做出反应。头发越短，头发动力学效果越不明显：


  ![Figure 2.33: Head hair presets](img/B17878_02_33.jpg)


  图 2.33：头部头发预设


  在图 2.34 中，您可以看到，除了从预设菜单中选择想要的发型外，几乎没有其他编辑选项，尽管有几十个预设可供选择。


  对于 Glenda 这个例子，我保留了灰色预设，但发现必须修改 `Color`（颜色）选项，才能编辑 `Roughness`（粗糙度）和 `Salt & Pepper`（盐胡椒/黑白相间）。`Roughness`
  非常适合呈现哑光或亮面发质外观，而 `Salt & Pepper` 用于增加或减少白发。


  在图 2.34 中，您可以看到特写时头发可以有多细致。在这个例子中，我们可以看到单根发丝：


  ![Figure 2.34: Individual hair strands are visible](img/B17878_02_34.jpg)


  图 2.34：单根发丝清晰可见


  就像化妆编辑器一样，我们也可以在 `PRESET`（预设）和 `CUSTOM`（自定义）之间选择。您将看到 `PRESET` 下的一个下拉菜单，如图 2.35
  所示，允许我们保持在 `Neutral`（中性）调色板，或 `Deep`（深沉）和 `Vibrant`（鲜艳）调色板。如果您选择 `CUSTOM`，将获得更广泛的色域供选择：


  ![Figure 2.35: Head hair presets](img/B17878_02_35.jpg)


  图 2.35：头部头发预设


  带有警告图标的缩略图是具有有限 `LODs` 的预设。您可以在图 2.35 的预设缩略图右下角看到这些图标；警告内容为：**This MetaHuman uses
  grooms currently in development**，**only displayed at LODs 0 & 1**（此 MetaHuman 使用的造型正在开发中，仅在
  LOD 0 和 1 显示）。这意味着它只能提供无 `LOD`（即基于发丝的最大质量头发渲染）和 `LOD` 值为 1（同样是基于发丝）的显示。这意味着无论摄像机距离如何，Unreal
  Engine 都将尝试以最大质量渲染头发。在引擎内部，当通常会启用 `LOD` 值 2 时，它将隐藏头发。对于没有 `LOD` 等级 2 或更高等级的角色实例，Unreal
  Engine 将不渲染头发。虽然此处的警告用处不大，但请注意这些警告，因为当使用具有有限 `LOD` 的角色时，您需要强制引擎完全不使用 `LOD`。否则，如果摄像机距离过远，您的角色将显得秃顶。


  ## 眉毛


  使用 `Eyebrows`（眉毛）面板，如图 2.36 所示，我们只有少量预设可供选择（撰写时仅 11 个），以及我们之前见过的常用调色板和参数集进行编辑，包括
  `Salt & Pepper`：


  ![Figure 2.36: Eyebrows](img/B17878_02_36.jpg)


  图 2.36：眉毛


  ## 睫毛


  您会注意到，除了可用的预设外，图 2.37 中的 `Eyelash`（睫毛）参数与 `Eyebrows` 面板中的参数完全相同。然而，一旦进入 Unreal Engine，我们将获得对该参数稍多的编辑控制：


  ![Figure 2.37: Eyelashes](img/B17878_02_37.jpg)


  图 2.37：睫毛


  ## 胡须


  `Mustache`（胡须）面板涉及相当多的细节。正如您在图 2.38 中所见，从我们之前所学，我们可以看到它是一种基于样条线的头发解决方案，这为我们提供了最佳细节。就像前两个编辑器一样，我们拥有相同的可编辑参数：


  ![Figure 2.38: Mustache](img/B17878_02_38.jpg)


  图 2.38：胡须


  然而，不幸的是，在头发生长模式方面，我们仅限于选择少量预设。与睫毛类似，一旦将角色带入 Unreal Engine，我们确实有进一步的编辑选项。


  ## 络腮胡


  最后，我们有最后一个与头发相关的编辑器：络腮胡。同样，如图 2.39 所示，我们有几个很棒的预设可供使用，并拥有常用的编辑参数。就像 `Scalp Hair`（头皮头发）部分一样，络腮胡对动画响应良好，特别是在碰撞动力学方面，例如真实地碰撞上胸部：


  ![Figure 2.39: Beard](img/B17878_02_39.jpg)


  图 2.39：络腮胡


  在本节中，我们介绍了 `MHC` 中提供的大量用于编辑的预设。其中一些概念我们在编辑面部时已经熟悉，例如调色板的 `LOD`，但我们也涉及了一些新概念，例如简要介绍了头发动力学。值得注意的是，可以在
  Unreal Engine 中进行额外编辑；例如，如果我们愿意，可以添加一个单独的物理求解器，从睫毛获得独特的动画结果。一般来说，我们不需要这样做。


  在下一节中，我们将探索新领域，查看身体部分。


  # 身体


  在 `BODY`（身体）部分，我们可以编辑角色的比例，但也有编辑服装和鞋子的选项。让我们现在来看看那些。


  ## 比例


  首先，我们需要查看随 `MHC` 附带的身体比例和预设。我们可以在图 2.40 中看到这些：


  ![Figure 2.40: Body proportions](img/B17878_02_40.jpg)


  图 2.40：身体比例


  有三个比例类别：`SHORT`（矮）、`AVERAGE`（中等）、`TALL`（高）。每个类别中都有 `Male`（男性）和 `Female`（女性）选项。两者都有三种主要体型：`Mesomorph`（中胚层/肌肉型）、`Endomorph`（内胚层/超重型）和
  `Ectomorph`（外胚层/消瘦型）（肌肉发达、超重和消瘦）。与面部不同，我们没有获得那么多微调能力（例如，我们无法在体型之间混合）。


  与几乎专门致力于角色创建的其他程序（如 Character Creator）相比，`MHC` 存在局限性。试图进行并列比较是不公平的，因为 `MHC` 的重点是写实人类，而
  Realusion 的 Character Creator 等程序允许您对生理结构和肤质进行巨大更改，以至于您可以非常轻松地创建一个远超人类范畴的角色。因此，虽然这些限制将我们约束在创建更像人类的角色上，但这终究还是一种限制。还值得注意的是，`MHC`
  仍在大力开发中，因此我们未来可能会看到更多功能。一个例子是只能创建成年人，且比例非常有限，例如膝盖到臀部、颈部长度、脚部大小等。


  话虽如此，目前 `MHC` 中按性别划分体型的情况还算不错。如果您看图 2.40，我在 `Proportions`（比例）编辑器中选择了 `SHORT` 标签，您会注意到每个性别有三种体型：瘦、中、大。因为有三个与身高相关的标签——`SHORT`、`AVERAGE`、`TALL`——我们每个性别获得九种体型，总共
  18 种体型。蒙皮权重和布料动力学也涉及其中，但超出了本书范围。


  此外，您可能想知道缩放问题。在 Unreal Engine 内部重设角色缩放是完全可行的，不会对角色功能产生任何负面影响。


  ## 上装





  # 服装


  ## 上装


  在界面的 **BODY** 部分，您将从图 2.41 中看到，我们也有选项（尽管有限）来更改角色的服装：


  ![Figure 2.41: Tops](img/B17878_02_41.jpg)


  图 2.41：上装


  然而，小改动也能产生大效果，您可以在此更改每件上装各个元素的颜色。例如，我给 Glenda 换了一件双色连帽衫。


  > **注意**

  >

  > 我目前只能推测 Epic 和 Quixel 计划添加更多功能，但您可以想象，要适应任何一个人衣橱的变化，需要多少旋钮和按钮。目前，您可以自定义角色的服装，甚至包含精确的布料动力学，但这需要使用
  Marvelous Designer、Maya 或 Blender 等第三方软件。


  ## 下装


  与 **上装** 类似，正如您在图 2.42 中所见，**下装** 功能存在重大限制。正如我们对比两者时所见，我们仅获得两个额外的 **下装** 预设，但就像
  **上装** 预设一样，小改动也能产生大效果：


  ![Figure 2.42: Bottoms](img/B17878_02_42.jpg)


  图 2.42：下装


  ## 鞋子


  与 **上装** 和 **下装** 类似，MHC 中的 **鞋子** 存在一些重大限制；然而，就网格/几何体而言，自定义要流畅得多，因为它不涉及重新分配与布料模拟相关的权重绘制。虽然这听起来很复杂，但它只是意味着，就身体如何影响服装运动而言，鞋子不像衬衫那样复杂。鞋子不会改变形状，即使不穿的时候；它仍然保持脚的形状。然而，衬衫不穿时可以卷成一团。


  由于复杂程度较低，建模或购买您选择的鞋子 3D 模型并在 Unreal 中替换它要简单得多。目前，我们仅限于少量可编辑主色和辅助色的鞋子。


  除了编辑主色和辅助色之外，目前 MHC 中没有其他鞋子编辑选项，如图 2.43 所示：


  ![Figure 2.43: Shoes](img/B17878_02_43.jpg)


  图 2.43：鞋子


  我相信您会同意，身体和服装编辑器不如本章涵盖的面部、皮肤和其他区域的编辑器那样详细，但您可能会惊讶地发现，在下一节中，我们将直接回到一些面部编辑器进行进一步细化。


  ## 使用移动和雕刻工具


  虽然我本可以在本章开头介绍 **雕刻** 和 **移动**，因为它们仅与头部相关，但我有充分的理由将它们留到最后。直到现在，您已经看到 MHC 提供了大量选项，能产生非常真实的效果。还有大量机会使用
  **混合** 工具自定义面部。但有时，我们想更进一步，夸大某些特征。有时我们寻找不对称且更接近现实的东西，或者只是想专注于某个特定细节。


  使用 **雕刻** 和 **移动** 工具，您可以获得比预设混合更多的效果，但如果弄错了，要恢复原状会更难。因此，应在用尽其他领域后再使用 **雕刻** 和 **移动**。


  在界面中，**移动** 和 **雕刻** 之间主要的可见区别在于控制器：


  *   在 **移动** 中，您使用指示线来指示您正在编辑的面部区域。移动指示线时，您会移动影响其周围区域的点簇。

  *   在 **雕刻** 中，您使用面部上的点，且一次只能雕刻一个点。


  这两个功能工作方式相似，且在很大程度上给出相似的结果，以至于我认为两者的选择取决于个人偏好。在图 2.44 中，您勉强能辨认出左侧的点，而右侧图像中的指示线则清晰得多：


  ![Figure 2.44: Sculpt points and Move guidelines](img/B17878_02_44.jpg)


  图 2.44：雕刻点和移动指示线


  要查看 **移动** 与 **雕刻** 的行为有何不同，请看向面部正面并编辑一条眉毛。在 **移动** 模式下，当您编辑眉毛时，移动眉毛时会出现三个点，从而表明您在
  **移动** 模式下同时移动三个点。在 **雕刻** 模式下，您只移动一个点，最大的变化影响发生在该点。


  另一个要考虑的因素是不对称性。**移动** 指示线是非常有用的指示器，能显示您可以做些什么来为角色创建不对称性。例如，鼻子和嘴唇由同一组指示线操控，因此很难在这些区域创建不对称性。另一方面，左耳和右耳有各自的指示线供您操控。


  要禁用对称性，请切换 **预览** 选项右侧的对称按钮，如图 2.45 所示：


  ![Figure 2.45: Disabling symmetry](img/B17878_02_45.jpg)


  图 2.45：禁用对称性


  我在图 2.46 中可能做得太过火了，可怜的 Glenda 看起来惨不忍睹。不过，这是一个在关闭对称选项的情况下，同时使用 **雕刻** 和 **移动** 工具将不对称性推向极致的好例子：


  ![Figure 2.46: Editing beyond realism](img/B17878_02_46.jpg)


  图 2.46：超越现实主义的编辑


  > **注意**

  >

  > 在数字角色设计中，不对称性在创造真实感方面常被严重忽视。因为人类的面部左右两侧并不完全相同，所以引入一定程度的不对称性非常重要，无论多么细微。历史上，CGI
  角色一直深受所谓 **恐怖谷** 效应之苦，而这种恐怖感很大程度上源于完美对称的存在，而完美对称在自然界中是不存在的。


  本章我们详细介绍了如何使用 MHC 创建独特角色；我敦促您在进入下一节之前先尝试创建多个角色。在下一节中，如果您对角色设计满意，将下载并导出您的角色。


  ## 下载并导出您的角色


  是时候下载您的角色并将其从 MHC 导出到 Unreal Engine 了。为此，您需要打开 Bridge 并导航到您的角色。您可能还记得首次启动 MHC 之前的这一步。但是，如果您进行了一些编辑，您会注意到
  Bridge 中角色的图片也已自上次自动保存以来进行了更新。如果您看图 2.47，会注意到我的 Glenda 角色在 Bridge 中已更新：


  ![Figure 2.47: Download and Export settings](img/B17878_02_47.jpg)


  图 2.47：下载和导出设置


  在这里您可以更改 **分辨率**、**下载设置** 和 **导出设置** 选项，我们将在此查看它们。


  ## 分辨率


  在图 2.47 的左下角，您将看到一个下拉菜单，它与我们角色的纹理贴图分辨率有关。


  最高可用的是 8K 分辨率。这意味着最高纹理贴图宽度超过 8000 像素。那是大量的像素；我强烈建议从 2K 甚至 1K 开始，因为具有 8K 纹理贴图的角色生成和下载需要很长时间，并且在首次导入引擎时编译也需要很长时间。




  ### MetaHuman 下载与导出工作流


  如果您的显示器分辨率宽度达到 4,000 像素，8K 贴图将能得到充分展示。特别是面部 8K 贴图，在 4K 显示器上呈现特写绰绰有余。此外，请注意面部由多张贴图混合而成，可提供更丰富的细节。Glenda
  角色的组合贴图总大小达 1.6 GB。


  > **Note**

  >

  > 您可在后期制作中随时替换角色。因此，您可以用角色的低分辨率代理模型完成整个制作流程，待进入灯光渲染阶段时再替换为 8K 版本。这是一个非常简单的过程，仅下载和导出环节耗时较长。


  ## 下载注意事项


  每当您关闭 `MHC` 或停止使用时，角色即可从 `Bridge` 内部下载。若 `Bridge` 处于打开状态且选中了该角色，您会看到其不时更新，尤其是在关闭
  `MHC` 会话后。


  要更改下载设置，请点击 `Download Settings`，如 *Figure 2.48* 所示。您将看到两个标签页：`TEXTURES` 和 `MODELS`。


  首先，我们来看看 `TEXTURES` 标签页：


  ![图 2.48：贴图设置](img/B17878_02_48.jpg`)


  图 2.48：贴图设置


  `TEXTURES` 标签页默认勾选了约一半的可用贴图，这对大多数情况已足够。我们还可额外选择 `Image format`（图像格式）——即 `JPEG`、`EXR`
  或 `JPEG+EXR`。我强烈建议坚持使用 `JPEG`，因为 `EXR` 文件体积大得多，会增加下载和处理时间，甚至可能导致 `Unreal` 中的性能问题。在大多数情况下，像素数据不足以支撑
  `EXR` 文件格式的优势。


  现在，我们切换到 `MODELS` 标签页，这里有不同的选项：


  ![图 2.49：模型设置](img/B17878_02_49.jpg`)


  图 2.49：模型设置


  因为这是 `Bridge`，所以在选择 3D 模型格式时，我们有 `Megascans` 和 `MetaHumans` 两个选项。我们只需关注 `MetaHumans`
  下拉列表，它提供两种格式供选择：`UAsset` 和 `UAsset + Source Asset`。


  选择 `UAsset + Source Asset` 将同时下载仅可在 `Unreal` 中读取的角色网格格式，以及更通用的 `FBX` 格式。这是最保险的选择，因为单独下载
  `UAsset` 很可能导致导出失败。（我们也可前往 `Export Settings` 为第三方 3D 软件提供更多选项，若您仅想在 `Maya`、`Houdini`
  或 `Blender` 中使用 `MetaHuman`。）


  确认设置后，点击 `Back` 按钮，再点击 *Figure 2.47* 所示面板底部的绿色 `Download` 按钮。下载过程耗时较长，因为 `MHC` 正根据您的修改烘焙贴图、生成新网格、写入新的
  `Unreal` 文件，同时还要为下载进行压缩和解压。


  现在，让我们看看 `Export Settings` 选项。


  ## 导出注意事项


  接下来，我们将查看 `Export Settings`（可在 *Figure 2.47* 的 `Download Settings` 下方找到）。您将看到如下窗口：


  ![图 2.50：导出设置](img/B17878_02_50_new.jpg`)


  图 2.50：导出设置


  要导出角色，请执行以下操作：


  1.  将 `Export Target` 设置为 `Unreal Engine`。

  2.  将 `Engine Version` 设置为您安装的版本，应为 **5.0** 版本。

  3.  将 `Plugin Location` 设置为 `Unreal` 的安装目录（选择此文件夹将允许 `Bridge` 自动安装插件）。

  4.  在 `Default Project` 下选择您的项目文件夹作为默认位置。


  > **Note**

  >

  > 若您仅将角色导出为 `Unreal` 资产，后续想将其引入 `Maya`、`Blender` 或其他第三方应用程序，可从 `Bridge` 重新下载并更改导出设置，将
  `Export Target` 设为 `Maya` 或 `Blender`，*或者* 直接在 `Unreal` 中使用 `Level Sequencer` 将角色导出为
  `FBX`。


  完成后，可在 *Figure 2.47* 所示的同一面板中找到 `Export` 按钮。


  一种替代且推荐的将角色安全导入正确项目的方法，是利用 `Unreal` 项目中的 `Bridge` 插件。此插件在 `UE5` 中默认启用。它是 `Bridge`
  的迷你版，仅能从 `Unreal` 内部启动。要在 `Unreal` 中使用 `Bridge`，请导航至屏幕底部的 `Content` 文件夹并点击 `+ADD`
  按钮。在此处，您将看到 `Add Quixel Content`；点击它。这两项均在 *Figure 2.51* 中高亮显示：


  ![图 2.51：在 Unreal 5 的内容文件夹中加载 Quixel Bridge](img/B17878_02_51.jpg`)


  图 2.51：在 Unreal 5 的内容文件夹中加载 Quixel Bridge


  此时系统可能会要求您再次登录。使用 `Epic Games` 凭据登录后，您将看到您的 `MetaHuman` 内容及类似界面，可在打开的 `Unreal` 项目中直接下载并添加角色。


  这样做的优势在于：降低将角色误导出到错误项目文件夹的几率。此外，若插件尚未安装，点击 `+ADD` 触发的 `Quixel` 导入器会检查插件安装状态，并在屏幕右下角提示后自动为您安装；我们将在本节稍后详细探讨这一点。


  ## 后台处理


  `UE5` 会将已下载到本地的文件导入 `Unreal Engine`。简单来说，`Bridge` 将相关文件保存到 `Unreal` 项目 `Content`
  文件夹下的 `MetaHumans` 文件夹中。若您未安装 `MetaHumans` 插件（如 `Hair Grooms` 插件），请勿担心 —— 迷你 `Bridge`
  插件会在导出步骤中自动安装它们。


  屏幕底部将出现关于所有 `MetaHumans` 相关插件的各类通知。它可能会要求您点击 `Enable Missing` 以启用缺失的插件。请务必点击 `Enable
  Missing`，如 *Figure 2.52* 所示：


  ![图 2.52：缺失插件与项目设置](img/B17878_02_52.jpg`)


  图 2.52：缺失插件与项目设置


  此外，`UE5` 还将计算蒙皮权重、编译着色器等。这将耗费几分钟时间，在此期间您将无法使用 `Unreal Editor`。


  完成后，请在 `UE5` 项目的 `Content Browser`（内容浏览器）区域中寻找已创建的 `MetaHumans` 文件夹，如 *Figure 2.53*
  所示。所有 `MetaHuman` 角色都将导入此文件夹；该文件夹将在您首次执行导出流程时创建：


  ![图 2.53：MetaHumans 文件夹](img/B17878_02_53.jpg`)


  图 2.53：MetaHumans 文件夹


  在该文件夹内，您将看到一个以角色命名的文件夹。打开它，您将看到角色的缩略图。在本例中，它名为 `BP_Glenda`（`BP` 代表 `Blueprint` 蓝图）。


  *Figure 2.54* 显示我已将角色引入视口。我是通过将 `Blueprint` 直接拖放至视口中实现的：


  ![图 2.54：拖放蓝图](img/B17878_02_54.jpg`)


  图 2.54：拖放蓝图


  > **Note**

  >

  > 您可以随时编辑场景。在 *Figure 2.54* 中，我使用了空白模板，并将 `HDRI` 背景拖放至场景中，以获得简单但逼真的灯光设置。




  请随意将角色的 `Blueprint` 拖放到视口中的任意位置，以便开始检查它。此外，请注意角色文件夹内创建的其他文件夹。你应该会看到以下内容：


  *   Body（身体）

  *   Face（面部）

  *   Female（女性）（如果你创建的是男性角色，则会显示 Male）

  *   FemaleHair（女性头发）（如果你创建的是男性角色，则会显示 MaleHair）

  *   Materials（材质）

  *   Blueprint（蓝图）


  你可以浏览这些文件夹以查找各种纹理贴图。


  在本节中，我们重点介绍了如何将自定义 MetaHuman 导入 Unreal Engine。通过所需的下载和导出时间，你可能会注意到每个角色涉及的数据量有多大。我们刚开始了解
  Unreal Engine 以及角色背后的文件夹结构，但请放心，到下一章结束时，你将对它们更加熟悉。


  ## 总结


  在本章中，我们学习了如何上手使用 MHC，所有可用于自定义角色的各种参数，以及一些有助于设计流程的最佳实践。


  我们还了解了一些关于纹理和着色器如何工作的知识，以及它们如何被用来提供特定的结果。除了了解所有可用的设计工具外，我们还通过使用 LOD 学习了一些优化知识。


  虽然我们已经浏览了许多可编辑属性，如身体、面部、眼睛、头发、服装以及所有可供选择的预设，但我们也了解了 **Move**（移动）和 **Sculpt**（雕刻）工具，我们可以使用它们来微调角色并引入不对称性。


  最后，我们了解了下载和导出阶段，以及一些已知问题的变通方法，例如只有 Bridge 插件能识别 UE5 安装。


  我们在本章结束时已将自定义角色带入引擎，但现在，我们需要学习如何为 MetaHuman 制作动画。为此，在下一章中，我们将探讨 `Blueprints` 的概念，它们是什么，以及我们需要对它们做什么才能让角色“活”起来。

  '
- '# 第 2 部分：探索蓝图、身体动作捕捉与重定向


  在本书的*第 2 部分*中，我们将首先了解 `Blueprints` 在 Unreal Engine 中是什么以及如何将它们与 MetaHumans 结合使用。然后，我们将了解不同的身体动作捕捉方法，以及如何将动作捕捉数据重定向到我们的角色上。


  此部分包含以下章节：


  *   *第 3 章*，《深入 MetaHuman 蓝图》

  *   *第 4 章*，《重定向动画》

  *   *第 5 章*，《使用 Mixamo 重定向动画》

  *   *第 6 章*，《使用 DeepMotion 添加动作捕捉》

  '
- "## 第 3 章：深入 MetaHuman 蓝图\n\n在上一章中，我们使用 Quixel Bridge 和 UE5 内的 Quixel Bridge 插件导出了一个\
  \ MetaHuman 角色。我们将大量资产导入了引擎——虽然大多数资产是图像和网格体，但将它们全部粘合在一起的“胶水”就是 `Blueprint`。\n\n\
  在本章中，你将接触 `Blueprints`，包括它们是什么以及它们有什么用途。通过使用 `Blueprints`，你将学习准备 MetaHuman 进行动画制作所需的第一步，即重新利用我们将导入项目的另一个角色的动作捕捉数据。然后，我们将编辑我们的\
  \ MetaHuman 和 Unreal Engine 模型骨架内的特性。\n\n因此，在本章中，我们将涵盖以下主题：\n\n*   什么是 `Blueprints`？\n\
  *   打开 `Blueprint`\n*   导入和编辑骨架\n\n### 技术要求\n\n要完成本章，你需要 *第 1 章* 中详述的技术要求，以及我们在\
  \ *第 2 章* 中导入到 UE5 的 MetaHuman。\n\n### 什么是蓝图？\n\n那么，`Blueprint` 到底是什么？如果你正在思考这个问题，我不会怪你。\n\
  \n`Blueprints` 实际上是用 C++ 编程语言编写的模板的可视化表示。Epic Games 本可以轻松地在 Unreal 中创建一个控制台让用户编写\
  \ C++ 代码，但因为并非每个人都熟悉 C++ 编程语言，所以他们为艺术家创建了一种编辑相关代码的简便方法。此外，对于熟悉 C++ 的人来说，`Blueprints`\
  \ 是创建相对易于艺术家使用的工具的一种非常方便的方式。\n\n好消息是，在处理 MetaHuman 角色并为其制作动画时，你并不真的需要花费大量时间来使用它们，但它们是该过程不可或缺的一部分，并在后台被引擎使用。对于艺术家来说，掌握\
  \ `Blueprints` 的基础知识是一个很好的实践，因为它们是减少重复工作的绝佳方式；但也必须指出，有些任务如果不使用 `Blueprints` 根本无法完成。\n\
  \n就 MetaHuman 角色的功能而言，`Blueprints` 本质上将与角色相关的大部分信息保存在一个地方，我们使用 `Blueprint` 来更改角色。我们将进行的更改与角色如何制作动画有关，到本章结束时，你将熟悉需要编辑\
  \ `Blueprint` 的哪些区域才能正确地为角色制作动画。\n\n你可以把 `Blueprint` 看作是一个驱动程序。它的功能是使用骨架驱动角色的网格体。它通过驱动骨骼来实现这一点，骨骼反过来驱动皮肤。因为存在布料模拟，皮肤驱动布料。因为也存在头发模拟，皮肤驱动头发。所有这些都是由\
  \ `Blueprint` 驱动的。\n\n但 `Blueprint` 从哪里获得初始指令呢？答案是*你*。你告诉 `Blueprint` 它将使用哪种指令来为角色制作动画，然后指向各种动画模式供\
  \ `Blueprint` 使用。可以应用的动画类型只有几种，如下所示：\n\n*   **预录制数据**：这只是一个包含动作数据的文件，通常面部和身体各有一个文件。我们可以从大量资源获取这些文件。我们也可以使用\
  \ UE5 第三人称游戏模板附带的动画文件，或者通过录制自己的动作捕捉数据来创建自己的文件（我们称之为 **Takes** / **采集片段**）。\n*  \
  \ **实时动作捕捉数据**：`Blueprint` 允许我们使用来自硬件设备的实时数据，例如：\n    *   用于面部动作捕捉的 iPhone。\n  \
  \  *   利用摄像头的 Faceware Studio 等软件。\n    *   动作捕捉服也通过第三方软件为我们提供实时数据。实时数据是指实时流式传输到引擎中的骨骼变换和/或旋转信息。\n\
  *   **动画蓝图**：这些主要用于游戏逻辑，但它们可以使用预录制数据中使用的相同动画文件类型，或在使用实时动作捕捉数据时保存的文件类型，这些是我们在传统 3D\
  \ 动画电影制作中会使用的。\n\n`Blueprints` 还允许接收来自用户的新数据，例如游戏中的玩家，并将根据玩家的行为调用相关的动画文件。例如，如果玩家奔跑，`Blueprint`\
  \ 将执行 `run` 动画文件，从而驱动角色奔跑。该文件通常采用 `FBX` 或 `BVH` 格式。这些文件被称为 **资产**。\n\n那么，让我们看看引擎内部的\
  \ `Blueprint`。\n\n### 打开蓝图\n\n一旦你成功将 MetaHuman 角色导入 UE5，你将看到一些文件夹和一个以 `BP_` 前缀开头的文件，如图\
  \ 3.1 所示。该文件夹包含显示角色所需的所有资产。\n\n\n\n\n### 导入和编辑骨架\n\n### 角色蓝图界面\n\n![Figure 3.1:\
  \ The Blueprint inside the Content Browser](img/B17878_03.01.jpg)\n\nFigure 3.1:\
  \ 内容浏览器中的蓝图\n\n当你双击蓝图时，这将打开你角色的蓝图。你将看到屏幕由六个选项卡组成，如图 3.2 所示：\n\n![Figure 3.2: The\
  \ six panels of the character Blueprint](img/B17878_03.02.jpg)\n\nFigure 3.2: 角色蓝图的六个面板\n\
  \n### 六个面板\n\n让我们分解一下这些选项卡：\n\n1.  **`Components`（组件）**：这是我们可以选择想要编辑的 MetaHuman\
  \ 哪个部分的地方。我们还可以向 MetaHuman 添加额外的组件，例如网格体、摄像机和灯光。\n\n2.  **`My Blueprint`（我的蓝图）**：在这里，我们可以看到与\
  \ MetaHuman 关联的功能性元素，例如 ARKit 设置，它允许将面部动作捕捉导向我们的角色。\n\n3.  **`Viewport`（视口）**：这为我们提供了角色的视图，而不显示关卡的其余部分。如果我们将角色带入了一个繁忙的场景，并希望在没有繁忙环境干扰的情况下检查或编辑角色，这将非常方便。\n\
  \n4.  **`Construction Script`（构造脚本）**：构造脚本允许引擎无论我们使用哪个关卡，都能对蓝图进行数据读写。在游戏世界中，这很有用，因为构造脚本可以保存诸如角色健康值之类的数据。就我们使用\
  \ MetaHuman 的目的而言，我们不需要对此进行任何更改。\n\n5.  **`Event Graph`（事件图表）**：事件图表包含与事件相关的重要信息。事件可以是游戏开始，也可以是按下键盘上特定键的结果。就\
  \ MetaHuman 而言，事件图表决定了角色应该使用什么 LOD 值。例如，如果摄像机远离角色，这就是一个触发角色显示大于 0 的 LOD 值的事件。\n\n\
  6.  **`Details`（细节）**：这是我们进行大部分编辑的地方。它是上下文敏感的，因此根据我们在 `Components` 选项卡中点击的内容，我们将看到不同的信息。例如，身体将提供与面部不同的可编辑参数。\n\
  \n### 在细节面板中编辑材质\n\n正如我们刚才提到的，当涉及到编辑角色时，我们通过编辑各种资产在 `Details` 面板中进行。其中许多资产是图像文件，但许多编辑器也允许你进一步完善角色。事实上，在某些情况下，你甚至可以比单独使用\
  \ MHC 更好地控制角色的许多方面。这种额外的控制可以为你的角色带来比仅靠 MHC 所能实现的更逼真的效果。\n\n要查看一个你拥有多少额外编辑能力的示例，请在\
  \ `Components` 选项卡中点击 `Face`（面部），然后在 `Details` 选项卡中双击其中一个 `Eye materials`（眼部材质）选项。根据你选择的眼睛，它将被标记为\
  \ `M_EyeRefractive_Inst_L`。\n\n一旦你打开了该眼睛的材质编辑器，就可以编辑 MHC 中无法编辑的某些属性。例如，你可以编辑眼睛的混浊度和虹膜内的环境光遮蔽，这会给眼睛增加很多深度，如图\
  \ 3.3 所示：\n\n![Figure 3.3: Editing the eye material](img/B17878_03.03.jpg)\n\nFigure\
  \ 3.3: 编辑眼部材质\n\n> **Note**\n>\n> 使用蓝图中独有的参数对角色进行进一步编辑不会影响你在 MHC 中的原始设计。你将始终通过 Bridge\
  \ 拥有一个安全的备份副本。\n\n顺便提醒一下，蓝图的作用就像驱动程序，而角色子文件夹就像乘客。虽然你可以直接通过角色蓝图访问所有这些组件，但也可以通过深入各个子文件夹来获得访问权限；有时你可能希望同时打开多个文件夹，所以在许多情况下，这仅仅取决于个人偏好。\n\
  \n### 导航蓝图\n\n### 使用文件夹结构\n\n为了向你展示如何使用文件夹进行导航，如图 3.4 所示，我直接进入了 `Hoodie`（连帽衫）文件夹，并双击了\
  \ `Hoodie Material`（连帽衫材质）资产以更改其颜色：\n\n![Figure 3.4: Further editing done directly\
  \ within the folder structure](img/B17878_03.04.jpg)\n\nFigure 3.4: 直接在文件夹结构中进行进一步编辑\n\
  \n正如你所见，对这个特定资产的控制甚至比单独从 MHC 获得的还要多；例如，使用颜色选择器工具来更改 MetaHuman 的连帽衫颜色。你可能还记得在 *Chapter\
  \ 2* *Creating Characters in the MetaHuman Interface*（在 MetaHuman 界面中创建角色）中，我们使用\
  \ MHC 颜色工具进行更改。\n\n### 不使用文件夹进行导航\n\n在图 3.5 中，你可以看到正在进行相同的编辑，但我们使用的是角色蓝图来编辑同一个资产。这两种方法同样有效。\n\
  \n![Figure 3.5: Editing a color inside the character Blueprint](img/B17878_03.05.jpg)\n\
  \nFigure 3.5: 在角色蓝图内编辑颜色\n\n你可以在图 3.5 中看到，我遵循了以下步骤：\n\n1.  我在 `Components` 选项卡中选择了\
  \ `Torso`（躯干）。\n2.  我点击了 `Material`（材质）元素槽，这会打开 `Material Editor`（材质编辑器）。\n3.  我点击当前颜色，这会打开\
  \ `Color Picker`（颜色选择器），允许我更改颜色。\n\n虽然蓝图中有许多与角色外观相关的额外编辑器，但它们大多用于完善材质。在大多数情况下，结果很微妙，但你可以完全更改配色方案。\n\
  \n尽管这一切看起来令人生畏，但请放心，你实际上只会编辑蓝图的一小部分。至少，你只需要选择想要驱动角色的动画类型，而对于从另一个角色重定向动画，我们只需要编辑骨骼细节。\n\
  \n先让身体动画跑起来是合理的。UE5 自带几个入门包来帮助我们。其中一个入门包是第三人称游戏，它带有一个绑定了骨架的 `Mannequin`（模型/假人）角色。它还带有一些动画，我们可以用来测试我们自己的角色。\n\
  \n在本章的其余部分，我们将着眼于蓝图，旨在从入门游戏包中重定向动画，并在下一章将其应用到我们自己的角色上。\n\n### 添加模型角色\n\n在本节中，我们将\
  \ `Mannequin` 角色添加到项目中。然后，为了能够将动画从一个角色重定向到另一个角色，源角色和目标角色都必须拥有骨架。我们将在以下部分查看这两个骨架。\n\
  \n首先，我们要使用随 Unreal 附带的 `Mannequin` 角色的骨架。要将其添加到项目中，你只需转到 `Content Browser`（内容浏览器），点击\
  \ `+ADD`（+添加）按钮，然后选择 `Add Feature or Content Pack…`（添加功能或内容包……）：\n\n![Figure 3.6:\
  \ Adding a content pack](img/B17878_03.06.jpg)\n\nFigure 3.6: 添加内容包\n\n点击 `Add Feature\
  \ or Content Pack…` 后，你会看到一个弹出窗口，你可以在 `Blueprint`（蓝图）功能选项卡中选择 `Third Person`（第三人称）：\n\
  \n![Figure 3.7: Add Content to the Project](img/B17878_03.07.jpg)\n\nFigure 3.7:\
  \ 向项目添加内容\n\n我们选择 `Third Person` 的原因是它在项目中包含一个完整的角色，包括一个模型，我们可以对其进行重定向。然后，点击 `Add\
  \ to Project`（添加到项目）。这会将项目加载到你的内容浏览器中。\n\n你会注意到内容浏览器中现在有两个新文件夹：`Mannequin` 和 `Third\
  \ PersonBP`。\n\n在这个阶段我们要做的是编辑 `Mannequin` 骨架，使其结构、命名约定和动画方法与我们的 MetaHuman 相同。这样，我们就可以从\
  \ `Mannequin` 重定向动画并将其应用到我们的 MetaHuman 上。\n\n\n\n\n如前所述，我们有两种编辑方式。我们可以遍历 `Mannequin`\
  \ 的文件夹结构并搜索骨架蓝图，但我们将采取稳妥的策略：寻找主角蓝图，并从那里导航到骨架蓝图。\n\n接下来，我们需要执行以下步骤：\n\n1. 编辑 `Mannequin`\
  \ 骨架的重定向选项。\n2. 编辑 `MetaHuman` 骨架的重定向选项。\n\n那么，让我们开始吧。\n\n### 编辑 `Mannequin` 骨架的重定向选项\n\
  \n在本节中，我们将告诉虚幻引擎 `Mannequin` 角色的骨架以及我们的 `MetaHuman` 角色的骨架，我们只对它们的旋转数据感兴趣。\n\n一旦我们将\
  \ `Third Person` 内容包添加到项目中，我们将看到一个名为 `ThirdPersonBP` 的新文件夹，这是个好的开始。您可以在图 3.8 中看到这一点：\n\
  \n![Figure 3.8: The ThirdPerson Character Blueprint](img/B17878_03.08.jpg)\n\n图\
  \ 3.8：ThirdPerson 角色蓝图\n\n在 `ThirdPersonBP` 文件夹中有一个标记为 `Blueprints` 的文件夹，其中包含我们需要编辑的\
  \ `ThirdPersonCharacter`。双击蓝图以将其打开。\n\n在 `Components` 选项卡中，当按照图 3.9 点击 `Mesh (CharacterMesh0)`\
  \ 时，您会注意到右侧的 `Details` 面板发生了变化。在 `Mesh` 下，您将看到 `Skeletal Mesh`。双击 `SK_Mannequinn`\
  \ 的小缩略图：\n\n![Figure 3.9: Accessing the Skeletal Mesh editor tab](img/B17878_03.09.jpg)\n\
  \n图 3.9：访问骨骼网格体编辑器选项卡\n\n这将在蓝图中打开一个额外的选项卡，该选项卡将包含两个更多选项卡，以及一个显示 `Mannequin` 及其骨架的视口，如图\
  \ 3.10 所示：\n\n![Figure 3.10: Inside SK_Mannequinn](img/B17878_03.10.jpg)\n\n图 3.10：SK_Mannequinn\
  \ 内部\n\n这两个选项卡如下：\n\n* `Asset Details`：如果我们想要编辑用于重定向动画的角色，它提供了大量选项。然而，我们只对该角色的绑定及其关联的动画感兴趣。\n\
  * `Skeleton Tree`：这是我们想要进行大部分编辑的地方。它向我们展示了每根骨头与其他骨头的关系。每根骨头都连接到 `root`。如果 `root`\
  \ 部分移动或旋转，层级结构中的其余骨头也会移动。层级结构最底部的骨头影响力最小。\n\n在图 3.10 的 `Skeleton Tree` 选项卡中，您可以看到从\
  \ `root` 到 `thumb` 的每根骨头都有名称。我们要做的是确保重定向选项设置为骨架，但别担心，我们不需要仔细逐个检查每根骨头。我们只需四次鼠标点击即可完成：\n\
  \n1. 点击齿轮图标。\n2. 选择 `Show Retargeting Options`（显示重定向选项）。\n3. 右键点击 `pelvis`（骨盆）。\n\
  4. 然后，左键点击 `Recursively Set Translation Retargeting Skeleton`（递归设置平移重定向为骨架）。\n\n\
  让我更详细地为您演示这些步骤。所以，点击图 3.11 中高亮显示的齿轮图标：\n\n![Figure 3.11: Show Retargeting Options](img/B17878_03.11.jpg)\n\
  \n图 3.11：显示重定向选项\n\n在 `OPTIONS` 下，点击 `Show Retargeting Options`。我们所做的一切只是确保骨架的层级结构被有效地用于驱动每根骨头的动画。因为所有骨头都在层级结构中相互连接，移动一根骨头会自然地对整个身体产生连锁反应。这被称为\
  \ `Inverse Kinematics (IK)`（反向运动学）。在某些动画数据中，每根骨头都有动画，因此骨架的自然层级结构不是很重要。对于 IK 动画，并非每根骨头的所有动画（如旋转和平移）都会传递下去；因此，依赖\
  \ IK 解决方案很重要。\n\n我们将在下一步中利用骨骼层级结构，因为 `MetaHuman` 角色就是基于此设计的。因为该骨骼系统内存在骨骼层级，我们可以通过利用一个方便的重定向选项，快速改变骨头平移的性质。在这种情况下，我们要将\
  \ `Translation`（平移）设置为 `Skeleton`（骨架），从 `pelvis`（骨盆）骨头开始。\n\n幸运的是，有一种快速的方法可以做到这一点。右键点击\
  \ `pelvis` 并选择 `Recursively Set Translation Retargeting Skeleton` 选项，如图 3.12 所示：\n\
  \n![Figure 3.12: Recursively Set Translation Retargeting to Skeleton](img/B17878_03.12.jpg)\n\
  \n图 3.12：递归设置平移重定向为骨架\n\n您现在已通过一次点击将从 `pelvis` 到 `skeleton` 的所有骨头都设置完毕。\n\n> **Note**：编辑完重定向选项后，请务必在\
  \ `Blueprint` 选项卡中点击 `Save`（保存）。\n\n除了确保我们的角色都使用骨骼动画外，通过这种方式操作，我们仅重定向 `rotational\
  \ data`（旋转数据）。简单来说，这将允许我们从该角色重定向每根骨头的旋转动画，而不是 `transformation data`（变换数据）。如果我们将原始骨架的变换数据复制到新骨架（例如\
  \ `MetaHuman` 骨架），骨头将会不成比例地移动。\n\n当新角色与原始角色存在显著比例差异时，这些问题最为明显。例如，如果原始骨架很高，那么它的骨头变换数据将与小个子角色截然不同。它的骨头会比其较小的对应骨头长。虽然旋转数据没问题，但高个子角色的变换数据会拉伸小个子角色，因为它会试图让骨头占据\
  \ 3D 空间中相同的位置，尽管旋转值相对正确。\n\n在图 3.13 中，您可以看到正确的数据变换。也就是说，这三个角色共享相同的姿势，网格体没有任何剧烈的拉伸或变形。如果变换数据从角色\
  \ A 传递到角色 B，角色 B 会被拉伸到相同的高度，角色 C 会被压扁到与角色 A 相同的高度。\n\n![Figure 3.13: Correct translation\
  \ of motion data](img/B17878_03.13.jpg)\n\n图 3.13：运动数据的正确转换\n\n如果您发现已成功完成所有这些步骤并为\
  \ `MetaHuman` 制作了动画，那么很有可能您没有正确遵循这些步骤。一个常见的错误是忘记在蓝图中保存更改。\n\n下一步是编辑新骨架的重定向选项，即我们的\
  \ `MetaHuman` 角色。\n\n### 编辑 `MetaHuman` 骨架的重定向选项\n\n要开始编辑 `MetaHuman` 骨架的重定向选项，请在角色的蓝图中，在\
  \ `Components` 选项卡中点击 `Body`。然后，在 `Details` 选项卡中，双击 `Mesh` 部分下 `Skeletal Mesh` 旁边的缩略图。如果您没有像\
  \ `Mannequin` 那样拥有准确的 `MetaHuman` 缩略图，请不要担心。\n\n![Figure 3.14: Editing the MetaHuman’s\
  \ retargeting options](img/B17878_03.14.jpg)\n\n图 3.14：编辑 MetaHuman 的重定向选项\n\n双击缩略图后，您将看到图\
  \ 3.15 所示的界面（它与您之前在图 3.12 中编辑 `Mannequin` 骨架时看到的选项卡完全相同）。您只需遵循上一节中完全相同的步骤即可。因此，点击齿轮图标并选择\
  \ `Show Retargeting Options`。然后右键点击 `pelvis`，并选择 `Recursively Set Translation Retargeting\
  \ to Skeleton`：\n\n![Figure 3.15: Recursively Set Translation Retargeting Skeleton\
  \ in the MetaHuman Blueprint](img/B17878_03.15.jpg)\n\n图 3.15：在 MetaHuman 蓝图中递归设置平移重定向为骨架\n\
  \n完成此操作后，保存蓝图。现在，我们已经编辑了 `Mannequin` 和 `MetaHuman` 两个骨架，调整了它们的重定向选项，以便两者可以协同工作。\n\
  \n### 总结\n\n\n"
- "## 重定向动画\n\n在本章中，我们涵盖了大量内容。我们介绍了关于虚幻引擎中 `Blueprints`（蓝图）的一些关键概念，它们是什么，以及可以用来做什么。我们对虚幻引擎的\
  \ `Mannequin`（模型）角色和我们自己的 `MetaHuman`（数字人）角色进行了一些基本编辑，通过将两者的平移目标设置为 `Skeleton`（骨架），使它们能够有效地“对话”。我们还简要讨论了\
  \ IK（反向运动学）以及该解决方案如何与我们的角色配合工作。\n\n在下一章中，我们将重新深入 `Blueprints`，将动画从一个角色重定向到另一个角色，并探索修复任何细微但常见问题的方法。我们将为\
  \ `Mannequin` 角色和我们的 `MetaHuman` 创建 `IK Rig`（IK 骨架/绑定），并使用 `IK Retargeter`（IK 重定向器）将动画数据导出到我们的角色上。\n\
  \n### 技术要求\n\n要完成本章，您将需要第 1 章中详述的技术要求，以及我们在第 2 章中导入到 UE5 中的 `MetaHuman` 和虚幻引擎 `Mannequin`。\n\
  \n## 什么是 IK Rig？\n\n要回答这个问题，我们实际上需要问两个问题：\n\n*   什么是绑定？\n*   什么是 IK？\n\n现在让我们来回答它们。\n\
  \n### 什么是绑定？\n\n在 3D 动画制作中，`rig`（绑定）是一种控制角色运动的简化手段，专为动画师量身定制。动画师不直接操纵角色的骨骼，而是通过绑定提供的控制器，动画师可以快速识别并选择它们。许多\
  \ 3D 软件应用程序都自带专为人物和动物设计的绑定。在动画工作室中，绑定的复杂程度各异，取决于动画的复杂程度。归根结底，绑定的目的是简化动画制作过程。在本章中，我们将利用这些简化的绑定，以便将动画数据应用到它们身上。\n\
  \n`MetaHuman` 自带一个用于角色动画的内置绑定，称为 `IK Rig`。事实上，它附带一个 `IK Control Rig`（IK 控制绑定），允许动画师完全控制\
  \ `MetaHuman` 角色的所有动画。如图 4.1 所示，绑定是操纵骨骼的一种简化方式：\n\n![Figure 4.1: MetaHuman IK Control\
  \ Rig](img/B17878_04.01.jpg)\n\n图 4.1：MetaHuman IK 控制绑定\n\n既然我们了解了什么是绑定，现在让我们看看\
  \ IK 的含义。\n\n### 什么是 IK？\n\n要回答这个问题，我们需要了解在角色动画中，我们使用骨骼。这些骨骼在运动方式上彼此具有独特的关系；如果我们想用稍微专业一点的说法，这些骨骼在其运动学关系的定义方式上具有独特的关系。这些骨骼存在于骨骼层级结构中，它们如何运动取决于层级结构是采用\
  \ `Forward Kinematics` (`FK`，正向运动学) 还是 `Inverse Kinematics` (`IK`，反向运动学)。\n\n说到人类骨骼，很少有骨骼能在所有轴上运动，且没有人类骨骼有自由在任何轴上移动\
  \ 360 度。然而，与真实的人类骨骼不同，计算机生成的骨骼形状非常简单，可以显示为简单的线条、圆柱体、球体、金字塔或胶囊体。无论形状如何，它们都包含一到两个枢轴点，用于确定骨骼的旋转点。除了旋转点，我们还可以定义骨骼绕哪个轴旋转、绕哪个轴不旋转。让我们看看图\
  \ 4.2，它演示了骨骼在 `UE5` 中的可视化方式。通过选择任意骨骼，我们会看到一个小工具，允许我们编辑每个骨骼的旋转；然而，用这个来制作动画很麻烦，因为难以选择或看清我们在做什么。\n\
  \n![Figure 4.2: A Mannequin bone system in Unreal](img/B17878_04.02.jpg)\n\n图 4.2：虚幻引擎中的模型骨骼系统\n\
  \n让我们以肩关节为例。我们知道我们可以向特定方向摆动手臂，但当我们尝试向其他方向移动时，很快就会遇到阻力。就关节而言，这种阻力被称为 `constraint`（约束）。\n\
  \n现在，请看图 4.3，它展示了 `MetaHuman` 上呈现的肩关节；你可以看到我们不必担心旋转约束：\n\n![Figure 4.3: Shoulder\
  \ joint](img/B17878_04.03.jpg)\n\n图 4.3：肩关节\n\n你还会注意到，不太清楚选中了哪根骨骼，这表明直接操作骨骼在动画制作中并不实用。\n\
  \n无论如何，让我们回到 FK 和 IK 到底是什么这一点上。为了理解 FK，首先我们需要了解父级和子级之间的简单关系（我们在 3D 图形和机器人技术中经常使用这个比喻）。*子级会跟随父级去往任何地方，但父级不必跟随子级。*\n\
  \n#### FK\n\n让我们将父子关系概念应用于关节，以肩膀为例探讨 FK。移动或旋转手关节对肩关节没有影响。事实上，我们必须先旋转肩关节，然后是肘关节，才能影响手的位置以获得期望的结果。换句话说，要定义手（末端执行器）的位置和旋转，我们必须先计算肩部和肘部的位置和旋转。\n\
  \n在图 4.4 中，我演示了通过旋转 `Joint 01`（左侧可见），然后可以旋转 `Joint 02`（右侧可见）：\n\n![Figure 4.4: FK](img/B17878_04.04.jpg)\n\
  \n图 4.4：FK\n\n在这里，我们通过对 `Joint 01`（父级）和 `Joint 02`（子级）应用旋转来计算手的位置。这被称为 FK，因为我们通过先计算父级的旋转来解决运动问题，所以我们沿着\
  \ *parent to child*（父级到子级）的方向解决这个问题。\n\n#### IK\n\nIK 之所以得名，是因为它通过首先计算子级的旋转来解决运动问题。再次以肩膀为例，当用户或艺术家影响手部末端执行器（层级中的子级）的位置时，IK\
  \ 解决方案可以确定肩关节的旋转。因此，它与 FK 相反，沿着 *child-to-parent*（子级到父级）的方向解决运动问题。\n\n在图 4.5 中，我演示了我只需要移动手，这反过来会自动计算出\
  \ `Joint 01` 的旋转，以及 `Joint 02` 的旋转和后续位置：\n\n![Figure 4.5: IK](img/B17878_04.05.jpg)\n\
  \n图 4.5：IK\n\n从本质上讲，IK 比 FK 更动态，并为我们解决了许多问题。使用 IK，我们可以像移动真人的手一样有效地移动角色的手，所有其余的骨骼都会真实地跟随。\n\
  \n> **Note**\n>\n> 值得注意的是，在动画制作中，在 IK 和 FK 解决方案之间切换是常见做法。IK 常用于大部分工作，因为它为工作流程增加了一定程度的自动化，而\
  \ FK 则用于细微的调整和微调。\n\n\n\n\n您会很高兴地知道，使用 MetaHuman 并不需要完全理解 FK（正向运动学）或 IK（反向运动学），尤其是在处理动作捕捉数据时，但了解这些概念确实能消除您在流程中经常遇到的那些术语的神秘感。\n\
  \n在下一节中，让我们开始创建我们自己的 IK Rig。\n\n### 创建 IK Rig\n\n您可能会问，既然 MetaHuman 已经自带 IK Rig，为什么我们还要创建一个？考虑到我们的目标是将为一个角色（作为源）设计的动画重定向并应用到我们的\
  \ MetaHuman 角色（作为目标）上，我们需要确保两个 Rig 具有正确的命名约定。例如，我们需要确保源角色的左臂与目标角色的左臂匹配；有些 Rig 将\
  \ `shoulder` 称为 `clavicle`，因此我们需要确保两个 Rig 的命名约定一致。\n\n因此，我们实际上将创建一个新的 IK Rig，用于将信息从源转换到目标。随着章节的推进和对\
  \ IK 链的处理，这一点将变得更加直观。我们这样做的原因是源 Rig 的命名约定可能与目标 Rig 不同，因此我们为每个角色创建的 IK Rig 实际上只是一组简单的指令，旨在使转换更容易。这还有一个额外的好处，即防止我们编辑角色原始的\
  \ IK Rig。\n\n那么，让我们为源角色创建一个 IK Rig：\n\n1. 如果您还记得上一章，我们从 `Third Person Template`（第三人称模板）获取了一个角色。因此，在\
  \ `Blueprint` 文件夹内，再进入 `Third Person Template` 文件夹，在该文件夹内的任意位置右键单击并选择 `Animation`（动画）。\n\
  \n2. 选择 `IK Rig` 后，系统会提示您选择 `Skeletal Mesh`（骨架网格体）选项。此时，我们要选择与源角色相关的骨架。为此，我们要选择\
  \ `SK_Mannequin`，如图 4.7 所示：\n\n![图 4.7：选择源骨架网格体](img/B17878_04.07.jpg)\n\n完成后，它会在您一直在使用的同一个\
  \ Blueprint 文件夹中创建 IK Rig，如图 4.8 所示。请注意，我已将此 IK Rig 明确标记为 `SOURCE_Mannequin`；这将帮助我们稍后查找，也是一种良好的习惯。\n\
  \n![图 4.8：源文件夹内的 IK Rig](img/B17878_04.08.jpg)\n\n创建好源 IK Rig 后，下一步是创建目标 IK Rig。\n\
  \n1. 为此，我们需要进入 MetaHuman 的文件夹并重复刚才完成的步骤。因此，在文件夹内的任意位置右键单击，选择 `Animation`，再次选择 `IK\
  \ Rig`：\n\n![图 4.9：创建目标 IK Rig](img/B17878_04.09.jpg)\n\n2. 现在，我们需要为目标选择一个骨架网格体。在本例中，我选择\
  \ `f_med_ovw_body` 网格体，它对应于 Glenda 作为一个中等身高、超重的女性角色（其中 `f` 代表 `female` 女性，`med`\
  \ 代表 `medium` 中等，`ovw` 代表 `overweight` 超重）。选择正确的网格体非常重要，否则稍后会出现问题。\n\n> **注意**\n\
  >\n> 举另一个例子，您可能有一个男性、矮小且消瘦的角色；在这种情况下，正确的角色网格体将是 `m_srt_unw_body`。\n\n![图 4.10：为目标\
  \ IK Rig 选择正确的骨架网格体](img/B17878_04.10.jpg)\n\n和之前一样，一旦我们选择了骨架网格体，现在就可以在角色文件夹中看到一个新的\
  \ IK Rig（我的文件夹叫 Glenda）。请再次注意，我花时间将其标记为 `TARGET`，如图 4.11 所示：\n\n![图 4.11：角色文件夹内创建的目标\
  \ Rig](img/B17878_04.11.jpg)\n\n现在，我们将打开两个 IK Rig，从这里开始，我们将尝试将两个 Rig 并排放置。在图 4.12\
  \ 中，我将两个 IK Rig 窗口（分别是源和目标）排列好，使界面尽可能靠近。我强烈建议您也这样做，因为这将有助于减少出错的几率，同时也能直观地呈现正在发生的一切。\n\
  \n![图 4.12：源和目标 IK Rig 的并排对比](img/B17878_04.12.jpg)\n\n分屏是一种良好的习惯，因为它允许我们轻松地可视化源和目标在我们的更改方面是如何相互对应的。我已标记出您需要注意的界面关键部分：\n\
  \n1. 我们将源 IK Rig 界面放在屏幕左侧，目标 IK Rig 界面放在屏幕右侧。这种排列作为视觉辅助，帮助我们快速进行比较。\n2. `IK Retargeting`（IK\
  \ 重定向）选项卡处于激活状态。我们需要确保源和目标都选中此选项卡，因为我们将在那里进行大部分编辑工作。\n3. 我们可以点击 `+Add New Chain`（+\
  \ 添加新链）按钮，因为我们将只是在两个界面中添加 IK 链并适当地为它们命名。\n\n在每个 IK Rig 窗口左侧的 IK Rig 名称下，您将看到骨骼层级以列表形式列出。您还会注意到这些列表并不完全相同。例如，源\
  \ IK Rig 的骨骼有三节脊椎，而目标 IK Rig 更复杂，有五节脊椎。\n\n您还会注意到，两个骨骼在其层级的最顶端都有一个 `root`。对于 3D\
  \ 角色来说，骨骼层级顶端有一个 `root` 非常常见，但在许多情况下，3D 角色使用骨盆作为层级的顶端。对于 Unreal 和 MetaHuman，我们将骨盆作为层级的顶端，因此我们需要做一些微调。\n\
  \n操作方法如下：\n\n1. 选择 `pelvis`，右键单击它，找到 `Set Retargeted Root`（设置重定向根骨骼）选项，如图 4.13 所示。将光标悬停在该选项上，您会注意到一个提示，显示**设置用于重定向的根骨骼。通常为“Pelvis”。**\n\
  \n![图 4.13：在源骨骼上设置根骨骼](img/B17878_04.13.jpg)\n\n由此您可以得知，在大多数情况下，骨盆被设置为根骨骼，因此在本例中，我通过点击\
  \ `Set Retarget Root` 将 `pelvis` 选为根骨骼。\n\n1. 接下来，您需要对目标执行相同操作。在本例中，它是 `TARGET_Glenda`。同样，根据引擎的提示，我们得知\
  \ `root` 骨骼通常是骨盆，因此我们将在源和目标 IK Rig 中都将目标的根骨骼设置为 `pelvis`，如图 4.14 所示：\n\n![图 4.14：在目标\
  \ IK Rig 中选择骨盆作为根骨骼](img/B17878_04.14.jpg)\n\n> **注意**\n>\n> 有些角色 Rig 使用单独的骨骼作为\
  \ `root` 而不是骨盆，因此动画出现的任何问题通常与 `root` 被更改为 `pelvis` 或 `root` 有关。\n\n此时，您已经创建了两个 IK\
  \ Rig（一个用于源，一个用于目标），并对两者进行了一些非常微小的编辑。现在，我们需要确保源和目标中的每个肢体都能有效地相互对应。为此，我们需要了解一下 IK\
  \ 链。\n\n### 创建 IK 链\n\n\n\n\n\n#### 什么是 IK 链？\n\n简单来说，IK 链就像任何其他链条一样，例如自行车链条，链条中的每个链节都与下一个链节有关系。这适用于身体的肢体，其中每根骨骼构成链条中的一个链节。因此，每个肢体，例如从肩膀到手，构成一条\
  \ IK 链。\n\n`IK Rig` 所做的就是将每个 Rig 简化为以下五条 IK 链：\n\n*   `Spine` 到 `Head`\n*   `Left\
  \ shoulder/clavicle` 到 `Left hand`\n*   `Right shoulder/clavicle` 到 `Right hand`\n\
  *   `Left thigh` 到 `Left foot`\n*   `Right thigh` 到 `Right foot`\n\n> **注意**\n>\n\
  > 请确保按照我在此处书写的顺序创建每条链，并且该顺序同时适用于源骨架和目标骨架。\n\n#### IK 重定向选项卡\n\n为此，让我们仔细看看 `IK Retargeting`\
  \ 选项卡。在*图 4.15* 中，既然我知道只需要五条 IK 链，我就点击了五次 `+Add New Chain` 按钮：\n\n![图 4.15：源的 IK\
  \ Retargeting 选项卡](img/B17878_04.15.jpg)\n\n默认情况下，每条链的起始骨骼和结束骨骼都设置为 `None`。要更改此设置，请点击\
  \ `None`，然后输入 `Spine`。这将激活对所有可用骨骼的搜索；从结果中我们可以看到，此骨架有三个名为 `spine` 的可用骨骼。选择 `spine_01`。\n\
  \n![图 4.16：选择脊椎](img/B17878_04.16.jpg)\n\n选择 `spine_01` 将使其成为给定的 `Start Bone`。对\
  \ `End Bone` 执行相同操作，但这次输入 `Head` 以完成链条。\n\n并排显示两个 `IK Rigs` 后，我们就得到了第一条 IK 链的可视化指南，因为当我们选择一条\
  \ IK 链时，它会变成亮绿色。要选择一条链，请点击任意字段旁边的空白处（可以是 `Start Bone` 和 `End Bone` 字段之间，甚至只是垃圾桶图标旁边）。从*图\
  \ 4.17* 中可以看到，我通过点击每个 Rig 的 `End Bone` 字段旁边，高亮显示了第一条 IK 链。这反过来会在两个视口中高亮显示该链条，这作为一个极好的视觉辅助工具。\n\
  \n![图 4.17：可视化第一条 IK 链](img/B17878_04.17.jpg)\n\n现在，即使骨架不同，我们也为两个骨架都有了 IK 解决方案。\n\
  \n参考本节开头的列表，让我们继续第二条 IK 链。对于源 `IK Rig`，选择 `Clavicle Left` 作为 `Start Bone`，选择 `Hand\
  \ Left` 作为 `End Bone`。然后，对目标 `IK Rig` 执行完全相同的操作。\n\n按照表格和之前的说明，您将能够自行创建第三、第四和第五条\
  \ IK 链，以便您的源和目标 `IK Rigs` 看起来类似于*图 4.18*。正如您所见，我选择了最后一条 IK 链，即 `Left Leg`。您可以在两个\
  \ Rig 中看到 `Start Bone` 是 `thigh_l`，`End Bone` 是 `foot_l`，它们被选中，并且这在两个视口中都有体现，每个角色中相关的链条都高亮显示为绿色：\n\
  \n![图 4.18：源和目标 Rig 的 IK 链并排可视化](img/B17878_04.18.jpg)\n\n源和目标 Rig 之间的这种精确匹配对于动画能够正确转换至关重要。完成此步骤后，在下一节中，我们将创建一个\
  \ `IK Retargeter`。\n\n### 创建 IK Retargeter\n\n完成了艰苦的工作，现在是时候创建一个工具，让这两个 `IK Rigs`\
  \ 能够相互“对话”了。这实际上就是 `IK Retargeter` 的作用，它将动画从一个角色的 IK 链转换到另一个角色上。在本例中，我回到了我的 `Glenda`\
  \ 文件夹来创建 Retargeter。那么，让我们执行以下步骤：\n\n1.  就像创建 `IK Rig` 时一样，在角色的 `Blueprint` 文件夹中的任意位置右键单击，选择\
  \ `Animation`，然后选择 `IK Retargeter`，就像*图 4.19* 所示：\n\n    ![图 4.19：创建 IK Retargeter](img/B17878_04.19.jpg)\n\
  \n2.  创建 `IK Retargeter` 时，系统会提示您选择要从中复制动画的 `IK Rig`。为了方便我们自己，我们之前已经将 `IK Rig` 标记为\
  \ `SOURCE_Mannequin`，以便轻松识别它作为源。您可以在*图 4.20* 的列表中看到它：\n\n    ![图 4.20：选择源 IK Rig](img/B17878_04.20.jpg)\n\
  \n3.  选定后，我们将看到另一个显示源骨架的对话框。找到 `Target IKRig Asset` 选项，我在*图 4.21* 中用红色高亮显示了它（稍后我们会讨论用绿色高亮显示的选项）：\n\
  \n    ![图 4.21：IK Retargeter 对话框](img/B17878_04.21.jpg)\n\n    其旁边的下拉列表将显示任何可用的\
  \ `IK Rigs`。我想要的目标 `IK Rig` 适当地标记为 `TARGET_Glenda`：\n\n    ![图 4.22：在 IK Retargeter\
  \ 中选择目标 IK Rig](img/B17878_04.22.jpg)\n\n    选择 `Target IKRig Asset` 时，您应该会看到一个\
  \ `MetaHuman` 网格体出现在 `Mannequin` 旁边。如果没看到，请返回*图 4.21*，我在那里用绿色高亮显示了 `Target Preview\
  \ Mesh` 选择框。\n\n4.  现在，在*图 4.23* 中，您可以看到 `IK Retargeter` 为您提供了一个视口，其中 `Mannequin`\
  \ 角色和 `MetaHuman` 角色并排在一起。此外，请注意屏幕底部有两个选项卡：`Chain Mapping` 和 `AssetBrowser`。确保您正在查看\
  \ `Chain Mapping` 选项卡，然后点击 `Auto-Map Chains` 按钮。\n\n    ![图 4.23：IK Retargeter 中的链映射和自动映射选项](img/B17878_04.23.jpg)\n\
  \n5.  接下来，切换到 `AssetBrowser` 选项卡，您将看到可用的动画。在我的例子中，我只有一个名为 `Jog_Fwd` 的可用动画（您可能有更多）。点击其中一个，视口将更新并将动画应用到您的\
  \ `MetaHuman` 上。\n\n    ![图 4.24：导出选定的动画](img/B17878_04.24.jpg)\n\n6.  现在您可以导出该动画，以便将其重定向到您的\
  \ `MetaHuman`。如果您有多个可用动画，也可以一并选择。要导出，请选择动画并点击 `Export Selected Animations`。此时将出现一个对话框，要求您选择导出路径。我建议您选择您的\
  \ `MetaHumans` 文件夹来导出重定向后的动画，就像我在*图 4.25* 中所做的那样：\n\n    ![图 4.25：选择保存重定向动画的目录](img/B17878_04.25.jpg)\n\
  \n> **注意**\n>\n> 选择文件夹并按下 `OK` 后，`IK Retargeter` 将使用动画名称创建一个新文件。在我的例子中，是 `Jog_Fwd`。创建的文件将带有\
  \ `Retargeted` 后缀，这是区分原始动画文件和重定向动画文件的便捷方式。\n\n在此阶段，您已经在 `IK Retargeter` 视口中看到了 `MetaHuman`\
  \ 上的动画。要将动画放入场景中，一种方法是打开您的角色 Blueprint（在我的例子中是 `BP_Glenda`）。\n\n7.  打开 Blueprint\
  \ 后，您现在可以在 `Animation` 部分下的 `Anim to Play` 下拉菜单中选择重定向后的动画，或者像*图 4.26* 所示那样，直接将重定向后的动画拖放到其旁边的框中：\n\
  \n    ![图 4.26：将重定向动画应用到角色 Blueprint](img/B17878_04.26.jpg)\n\n\n\n\n图 4.26：将重定向动画应用到角色蓝图\n\
  \n1. 与图 4.24 类似，我们可以运行搜索来查找动画，并且通过 `Retargeted` 后缀，我们可以确认已按照图 4.27 选择了正确的动画：\n\n\
  ![图 4.27：使用搜索功能查找重定向动画](img/B17878_04.27.jpg)\n\n图 4.27：使用搜索功能查找重定向动画\n\n1. 如果您尚未这样做，请将\
  \ `MetaHumans` 文件夹中的 `BP_Glenda` 文件拖放到 Unreal Engine 的主视口中。然后，点击**播放**以模拟游戏，并在视口中查看动画播放。\n\
  \n![图 4.28：点击播放](img/B17878_04.28.jpg)\n\n图 4.28：点击播放\n\n我们已经完成了创建 IK 重定向器的步骤，使源\
  \ IK 骨架能够与目标 IK 骨架通信，但我们仅专注于一个动画。让我们看看当有额外动画时该怎么做。\n\n### 导入更多动画数据\n\n要查看更多动画的实际效果，您可以前往\
  \ Unreal Engine 市场并搜索“Animation Starter Pack”（动画入门包）。这是一个免费的动画包，适用于 Unreal Engine\
  \ 5.0 版本，如果您的项目仍然打开，您可以将其添加到项目中。\n\n那么，让我们看看使用动画入门包在不打开 IK 重定向器的情况下重定向动画有多容易吧。\n\
  \n1. 在项目打开的情况下，进入 Epic Games 并前往**市场**。\n\n2. 在 **UE5** 下选择**动画**。然后在**筛选器**下，将**最高价格**选择为**免费**。\n\
  \n这应该会显示动画入门包，点击它后，您将看到如图 4.29 所示的页面：\n\n![图 4.29：动画入门包](img/B17878_04.29.jpg)\n\
  \n图 4.29：动画入门包\n\n1. 点击**添加到项目**以将该包直接添加到您打开的项目中。\n\n执行此操作后，`AnimationStarterPack`\
  \ 文件夹将出现在您的项目内容文件夹中。\n\n1. 导航到该处并右键点击其中一个动画文件，如图 4.30 所示。选择**重定向动画资产**，您将看到唯一的选项是选择**复制并重定向动画资产**：\n\
  \n![图 4.30：右键点击以重定向动画资产](img/B17878_04.30.jpg)\n\n图 4.30：右键点击以重定向动画资产\n\n选中后，您将进入如图\
  \ 4.31 所示的对话框：\n\n![图 4.31：复制并重定向动画资产对话框](img/B17878_04.31.jpg)\n\n图 4.31：复制并重定向动画资产对话框\n\
  \n关于此图有三点需要注意：\n\n* 在 `IK Retargeter` 下，我选择了 `NewIK Retargeter`。一旦您选择了正确的 IK 重定向器，两个视口将立即更新；在我的情况下，它将显示\
  \ `SK_Mannequin` 为源，`f_med_ovw_body_preview` 为目标。\n\n* 我将 `Suffix` 选项更改为 `RETARGET`。这只是良好的管理习惯，以便您稍后能轻松找到它。\n\
  \n* 选择要将新资产保存到的目录，然后点击**重定向**。\n\n**注意**\n\n虽然仅用于预览，但请注意图 4.31 中每个视口下的下拉列表。在这里，您可以预览源骨架和目标骨架关联的网格体。\n\
  \n现在，我们成功导入了一个新动画并将其添加到我们的角色中，而无需再次使用 IK 重定向器。\n\n### 总结\n\n在本章中，我们了解了一些关于 IK 和\
  \ FK 的知识，并探索了 IK 骨架和 IK 重定向器工具。\n\n更重要的是，我们揭示了 IK 链的原理、视觉辅助工具（如用于比较源和目标 IK 链的高亮功能），以及允许我们创建\
  \ IK 重定向器可使用的有效且准确的 IK 链的程序。\n\n我们还使用 IK 重定向器有效地重定向了一个动画并将其应用到场景中，并应用了一种重定向动画资产的替代方法。\n\
  \n在下一章中，我们将介绍 Mixamo，以便我们可以使用庞大的身体动画库并将其应用到我们的 MetaHuman 角色上。我们还将探讨使用 IK 重定向器一次性重定向多个动画。\n"
- "## 第 5 章：使用 Mixamo 重定向动画\n\n在上一章中，我们介绍了重定向动画的概念，并讨论了 IK 骨架、IK 链和 IK 重定向器。\n\n在本章中，我们将走得更远，从第三方供应商\
  \ **Mixamo** 获取动画，Mixamo 是一个庞大的在线库，包含大量动作捕捉文件，您可以在网页浏览器中预览。您将学习如何使用 Mixamo 等外部资源，为您的动画提供更多样化的选择；这很重要，因为重复使用相同的动画会导致制作质量低下。本章我们将继续专注于仅处理身体动作。\n\
  \n因此，在本章中，我们将涵盖以下主题：\n\n* 介绍 Mixamo\n* 准备并将 MetaHuman 上传到 Mixamo\n* 在 Mixamo 中定向您的角色\n\
  * 在 Mixamo 中探索动画\n* 下载 Mixamo 动画\n* 将 Mixamo 动画导入 Unreal\n\n### 技术要求\n\n要完成本章，您需要\
  \ 第 1 章 中详述的技术要求，以及我们在 第 2 章 中导入到 UE5 的 MetaHuman 和 Unreal Engine 模特。这两者都需要保存在 UE\
  \ 的同一个项目中，并且您需要为本章运行 UE。\n\n您还需要稳定的互联网连接，因为我们将上传 MetaHuman 网格体并下载大量动画资产。我们实际上将重复\
  \ 第 4 章 中的步骤，但这次我们将重定向来自第三方来源的动作捕捉数据。\n\n## 介绍 Mixamo\n\n对于许多计划在 Unreal 中使用 MetaHuman\
  \ 的艺术家来说，Mixamo 很容易就能满足他们在身体动画方面的所有需求。Mixamo 是一个包含数千个 **动作捕捉 (mocap)** 文件的在线库，这些文件由动作捕捉演员历经数年创建。除了收容这个庞大的动作捕捉文件库外，Mixamo\
  \ 还拥有许多预制角色。Mixamo 允许您上传自己的角色，它将自动运行应用带有蒙皮权重的 Mixamo 骨架的过程。这个自动化过程消除了通常在 Maya 或\
  \ 3ds Max 等程序中完成的大量繁琐工作，这超出了本书的范围。\n\nMixamo 中的许多动画允许您进一步完善动作捕捉动画，并在在线会话期间解决问题，以避免在\
  \ Unreal 中进行进一步编辑。由于您已经有使用在线角色创建器（如 `MHC`）的经验，您会发现 Mixamo 使用起来简单得多，是快速为角色添加动画的一种非常快速高效的方式。\n\
  \n您需要做的第一件事是访问 [`www.mixamo.com`](https://www.mixamo.com)。您将在那里看到 Mixamo 的登录页面，如图\
  \ 5.1 所示：\n\n![图 5.1：Mixamo 主页](img/B17878_05_01.jpg)\n\n图 5.1：Mixamo 主页\n\n在左上角，您将看到一个\
  \ Adobe 徽标。Adobe 是 Photoshop 和 After Effects（仅举几例）的制造商，它收购了 Mixamo 但保持其运行，因为它是角色设计师和动画师的绝佳工具。\n\
  \n您还会注意到右上角我已经登录。在登录之前，您需要创建一个 Mixamo 账户。如果您有 Adobe 账户，可以直接使用。如果没有，使用电子邮件并创建密码即可。\n\
  \n登录后，您将进入 Mixamo 主界面：\n\n![图 5.2：Mixamo 界面](img/B17878_05_02.jpg)\n\n图 5.2：Mixamo\
  \ 界面\n\n\n\n在*图 5.2*中，你将看到界面由两个标签页组成：`Characters`和`Animations`。这两个标签页将显示相关资产的缩略图以及一个用于预览的视口。在本书中，我们只关注动画，因此你应该选择`Animations`（不过值得注意的是，无论我们在哪个标签页中，都可以随时上传自己的角色）。\n\
  \n选择`Animations`标签页后，我们看到的界面几乎相同，唯一的区别是左侧的缩略图现在显示的是动画资产而非角色资产。在大多数情况下，缩略图角色采用 Mixamo\
  \ Mannequin 风格。\n\n![图 5.3：Animations 标签页](img/B17878_05_03.jpg)\n\n图 5.3：Animations\
  \ 标签页\n\n视口上方显示名称：`SHOVED REACTION WITH SPIN ON CH06_NONPBR`。`SHOVED REACTION WITH\
  \ SPIN`是对应所选缩略图的动画名称，而`CH06_NONPBR`专门关联视口中的角色。\n\n如果单击*图 5.3*中高亮显示的齿轮图标，将出现查看动画缩略图预览或静态图像缩略图预览的选项（第一个选项对网络连接要求较高；不过，动画预览很有帮助）。\n\
  \n在下载任何动画之前，我们首先需要将 MetaHuman 角色网格上传到 Mixamo 以提高兼容性。为此，我们必须先准备好 MetaHuman。\n\n##\
  \ 准备并将 MetaHuman 上传到 Mixamo\n\n为了让 MetaHuman 适配 Mixamo，首先必须确保我们导出 MetaHuman 角色时使用了正确的身体类型。你可能还记得在*第\
  \ 4 章* *重定向动画*中，当我们直接从动画资产重定向角色时，有一个预览 MetaHuman 网格的选项。这是一个重要步骤，因为我们需要使用预览网格来告诉\
  \ Mixamo 骨骼将产生多大影响。此外，这一步还能让我们直观地了解所选动作捕捉动画如何与我们选择的网格配合工作。\n\n我的角色有特定描述：女性、中等身高、超重；这在命名中标记为`F_Med_Ovw_Preview`。我们需要确保导出的正是该网格。因此，开始准备\
  \ MetaHuman 的步骤如下：\n\n1.  首先，我们需要找到正确的网格。为此，进入角色文件夹，然后导航到`Body`文件夹。在我的例子中，我需要进入`Glenda`文件夹，然后是`Female`文件夹，接着是`medium`文件夹，然后是`Overweight`，最后是`Body`文件夹。\n\
  \n2.  接下来，将角色拖入场景。你会注意到角色显示不正确。实际上，它很可能只显示整个角色的一部分。这是因为 MetaHuman 由以下网格组成：\n\n \
  \   *   头部网格\n    *   服装网格\n    *   完整的裸体网格\n\n3.  现在，非常重要的是，在`Details`面板的`Mesh`下，你会看到一个下拉菜单，允许你选择要为角色显示的网格。\n\
  \n![图 5.4：使用搜索查找预览网格](img/B17878_05_04.jpg)\n\n图 5.4：使用搜索查找预览网格\n\n如果在搜索栏中输入`preview`，你将看到所有可用的`preview`网格列表。选择正确的网格很重要，因为我们即将导出该网格用于\
  \ Mixamo。对于 Mixamo，我们只关心身体，因为 Mixamo 不提供面部动画数据；因此，在我的例子中，我将选择`f_med_ovw_body_preview`。\n\
  \n选择网格后，视口中的网格将变为无头的裸体。尽管没有头部，这正是 Mixamo 所需的一切，因为我们只关心身体运动，而这也是 Mixamo 唯一能提供的。\n\
  \n1.  导出此网格之前，我们需要确保网格位于场景原点，换句话说，位于场景的正中心。从内容面板将网格拖入场景时，仅根据鼠标光标位置放置，通常会得到随机结果——但我们可以快速修复。\n\
  \n回到`Details`面板，在我们选择预览网格的位置上方，有一个`Transform`部分。在`Location`旁，你需要将`x`、`y`和`z`坐标均设置为`0.0`，这样角色就会位于场景中心，准备好导出。\n\
  \n![图 5.5：在 Transform 中将 Location 值设置为原点](img/B17878_05_05.jpg)\n\n图 5.5：在 Transform\
  \ 中将 Location 值设置为原点\n\n1.  导出网格前，请务必在场景中选中预览网格，然后转到`File`，点击`Export Selected…`：\n\
  \n![图 5.6：导出选中项…](img/B17878_05_06.jpg)\n\n图 5.6：导出选中项…\n\n> **注意**\n>\n> 我们需要场景中有预览网格才能将其导出为\
  \ FBX 文件。无法从内容面板内部导出资产。\n\n1.  接下来，选择`FBX`作为文件类型，并给它一个容易记住的名称（如`GlendaToMixamo`）。\n\
  \n2.  确保未勾选`Map Skeleton Motion to Root`。保持所有设置为默认值，然后点击`Export`，如*图 5.7*所示：\n\n\
  ![图 5.7：未勾选 Map Skeletal Motion to Root](img/B17878_05_07.jpg)\n\n图 5.7：未勾选 Map\
  \ Skeletal Motion to Root\n\n接下来，我们将角色上传到 Mixamo 以应用动画。\n\n1.  无论你在 Mixamo 中处于`Character`还是`Animation`模式，始终可以点击`Upload\
  \ Character`按钮；这将打开以下界面：\n\n![图 5.8：将 MetaHuman 预览网格上传到 Mixamo](img/B17878_05_08.jpg)\n\
  \n图 5.8：将 MetaHuman 预览网格上传到 Mixamo\n\n1.  你可以选择将网格拖放到矩形区域，或点击`Select character file`。无论哪种方式，上传文件时请耐心等待，因为处理可能需要几分钟——此时屏幕将显示以下消息：\n\
  \n![图 5.9：Mixamo 正在处理网格](img/B17878_05_09.jpg)\n\n图 5.9：Mixamo 正在处理网格\n\nMixamo\
  \ 处理完网格后，你应该会看到*图 5.10*所示的界面：\n\n![图 5.10：Mixamo 已完成处理阶段](img/B17878_05_10.jpg)\n\
  \n图 5.10：Mixamo 已完成处理阶段\n\n现在我们的角色网格已在 Mixamo 中，接下来将为其应用动画，但在此之前，我们需要进行一些调整并定向角色。\n\
  \n## 在 Mixamo 中定向角色\n\n下一步是定向角色，使其与所有 Mixamo 角色及其动画的朝向一致。幸运的是，Mixamo 提供了相关工具，避免了我们在导出阶段进行繁琐的试错过程。\n\
  \n查看*图 5.10*视口底部的三个箭头。每个箭头用于旋转角色，分别代表`x`、`y`和`z`轴。右侧还提供了定向角色的说明；我已按此操作，让角色面朝前并直立站立。\n\
  \n\n\n现在，你可能已经从屏幕上的说明中注意到，Mixamo 要求将角色置于 **T-pose**（T 字姿势）位置以获得最佳效果：T-pose 是指角色呈\
  \ T 字形——也就是说，他们的双臂向两侧伸直，旋转 90 度。在我的例子中，以及所有 MetaHuman 的情况下，默认姿势是 **A-pose**，即角色的双臂并未完全伸展，仅旋转约\
  \ 45 度。然而，Mixamo 在两者之间插值的效果非常好，并成功将 Mixamo 角色骨架与我们的预览网格体对齐。\n\n> **注意**\n>\n> 我们将在\
  \ *第 6 章* *使用 **DeepMotion** 添加动作捕捉* 中探讨如何将 MetaHuman 从 **A-pose** 修改为 **T-pose**。\n\
  \n尽管 Mixamo 完成了大部分工作，我们仍需给 Mixamo 的自动绑定工具一点“推力”。当你点击图 5.10 右下角的 **NEXT** 按钮时，你将进入以下页面：\n\
  \n![图 5.11：自动绑定标记放置](img/B17878_05_11.jpg)\n\n图 5.11：自动绑定标记放置\n\n实际上，这是一个校准工具，我们可以借此确保\
  \ Mixamo 角色骨架的比例与我们的 MetaHuman 预览网格体相匹配。我们只需将屏幕左侧的标记拖动到其对应的身体部位，即可进行这些微调。保持开启 **Use\
  \ Symmetry**（使用对称），你将能更快、更准确地完成此操作。同时将 **Skeleton LOD** 保留为默认设置 **Standard Skeleton\
  \ (65)**（标准骨架 (65)），它拥有最多的骨骼数量；这在手指关节活动方面会产生明显的差异。\n\n一旦你对标记的放置感到满意，选择 **NEXT**，你将看到角色正在处理中；这可能需要几分钟，在此期间你会看到角色在旋转。\n\
  \n![图 5.12：自动绑定处理中](img/B17878_05_12.jpg)\n\n图 5.12：自动绑定处理中\n\n这里在后台发生了两件事：\n\n\
  - *生成与角色预览网格体成比例的 Mixamo 角色骨架*：我们将在本章后面使用 Mixamo 角色骨架，因为它实际上类似于 Unreal 自带的 Mannequin\
  \ Rig（人体模型骨架），但存在细微差别。不过，借助上一章介绍的 IK 重定向工作，我们将解决 Mixamo Rig 与 MetaHuman Rig 之间的差异。\n\
  - *调整蒙皮权重以使骨架与网格体比例对齐*：幸运的是，我们无需了解任何关于蒙皮权重的知识即可继续阅读本书，因为 Mixamo 会自动完成此过程。不过，对于那些有手动绑定角色经验的人来说，你们肯定深知绘制权重影响那略显痛苦的过程。\n\
  \n这意味着我们要告诉网格体的每一部分受每根骨骼影响的程度；例如，脚骨对手臂网格体没有蒙皮权重影响，但脚骨可能对覆盖小腿的网格体有一定程度的影响。\n\n> **注意**\n\
  >\n> 对于更有经验的 3D 艺术家，可以在 Maya、Blender 或 Houdini 等第三方应用程序中调整蒙皮权重。\n\n当自动绑定过程完成时，你应该会看到你的骨架使用\
  \ Mixamo 提供的默认临时动画进行移动，如图 5.13 所示：\n\n![图 5.13：自动绑定完成](img/B17878_05_13.jpg)\n\n\
  图 5.13：自动绑定完成\n\n你还会注意到，虽然身体大部分是绿色的，但网格体顶部是灰色和黑色的。这意味着网格体的灰色和黑色区域受 Mixamo Rig 的影响不如网格体的其他部分大。这很好，因为我们希望\
  \ MetaHuman Rig 影响头部，而我们只对 Mixamo 的身体动画感兴趣。\n\n当你对绑定结果满意时，点击 **NEXT**，现在我们可以准备从庞大的\
  \ Mixamo 动作捕捉库中应用动画了。\n\n### 在 Mixamo 中探索动画\n\n在 Mixamo 动作捕捉库中，你会看到所有动画都被分成了不同的类型，如图\
  \ 5.14 所示：\n\n![图 5.14：动画类型](img/B17878_05_14.jpg)\n\n图 5.14：动画类型\n\n这个类型列表非常有用，但也有一个方便的搜索功能。使用任一选项，找到\
  \ **Macarena Dance**（马卡雷纳舞）动画（我用这个是因为它时长较长，非常适合测试骨架与我的角色配合得如何）。一旦看到你所选动画的缩略图，只需左键单击缩略图即可将其应用到你的\
  \ MetaHuman 网格体上。\n\n![图 5.15：具有关节手指的完成绑定](img/B17878_05_15.jpg)\n\n图 5.15：具有关节手指的完成绑定\n\
  \n注意右侧的滑块，你可以随心所欲地调整它们。参数因动画而异。例如，对于马卡雷纳舞，**Focus**（专注度）是第一个参数；然而，大多数 Mixamo 动画没有此参数。\n\
  \n当你将 **Focus** 设为最小值与最大值播放动画时，你会看到细微的差别。很可能你只是在两个独立的动作捕捉表演之间进行混合。在这种情况下，最小值对应舞者不太专注于跳舞，换句话说，他们跳得很烂，节奏和时机都很差。最大值则是另一组拍摄，他们跳得非常好，节奏感强且准确。通常，每个动作捕捉文件会根据表演性质拥有一个或多个专属参数。\n\
  \n你会发现自己经常编辑的所有动画中最有用的三个参数如下：\n\n- **Character Arm-Space**（角色臂部空间）：这决定了角色双臂与躯干之间的距离。在\
  \ Mixamo 视口中查看网格体表现时，你可能会发现网格体与自身相交的时刻，例如手臂穿过腰部。当然，你需要加宽臂部空间来适应这种情况。对于马卡雷纳舞，动作捕捉演员可能是瘦削的舞者，而不是超重的\
  \ Glenda，所以这种相交很可能发生。话虽如此，也可能存在演员和模型相似的情况，但你仍需创建更宽的臂部空间以容纳厚重的衣物或盔甲，因此在调整时记住这一点很有必要。\n\
  - **Trim**（修剪）：这指的是我们想要修剪动画片段的程度。如果你使用默认设置，实际上就是在剪掉原始动画的一部分。根据经验法则，拥有更多动画帧总比帧数不足要好。\n\
  - **Overdrive**（超驱/加速）：这会影响速度。Overdrive 简单来说就是更快，所以如果你想加速，请在 **Overdrive** 设置中将动画滑块设为更高的值。\n\
  \n继续调整这些设置，直到你对效果满意。完成后，点击 **DOWNLOAD**。在下一节中，我们将探讨你将看到的一些设置。\n\n### 下载 Mixamo 动画\n\
  \n承接上一节，当你点击 **DOWNLOAD** 时，Mixamo 将带你进入图 5.16 所示的对话框：\n\n![图 5.16：下载设置](img/B17878_05_16.jpg)\n\
  \n图 5.16：下载设置\n\n让我们看看这些选项中的每一个：\n\n- **Format**（格式）：**FBX** 是你从 Unreal Engine 导出时使用的相同格式；对于\
  \ Unreal-Mixamo 流程，我强烈建议你使用此预设。在 **Format** 下拉列表中，你会看到其他格式。它们大多是 FBX 的替代版本和旧版本。另一种可用格式是\
  \ **DAE**，但它与 Unreal 不兼容。\n\n\n\n\n### Mixamo 导出设置\n\n### 皮肤\n默认设置为 `With Skin`；这意味着当你下载文件时，它将包含你的原始网格体，以及\
  \ Mixamo 骨架和动画，所有内容都在 FBX 文件格式内。如果你的角色有多个动画，你只需要在下载的第一个动画中包含皮肤。选择 `Without Skin`\
  \ 将仅包含动画数据。\n\n> **注意**\n>\n> 首次下载动画时，请保留所有默认设置。但是，一旦你下载了带有 `Skin` 的第一个动画，对于同一角色的后续动画下载，你就不再需要皮肤了。\n\
  \n### 每秒帧数\n选项有 `24`、`30` 和 `60` fps。如果你希望在 Unreal Engine 中编辑动画的时序，特别是想要将其放慢，较高的帧率会更好。大多数动作捕捉都是以较高的帧率捕获的，从而允许对动作进行重新计时。拥有较高的帧率总比尝试在高级工作流中通过合成方式在\
  \ Unreal 中插值慢动作要好。如果你要导入非常长的动画并在配置较低的机器上运行，较低的帧率会比较合适。\n\n### 关键帧缩减\n最好保持默认。这些文件的数据大小和\
  \ Unreal 读取它们的能力不需要关键帧缩减或优化。如果不进行关键帧缩减，Mixamo 会在每一帧为每个关节旋转烘焙一个关键帧。进行关键帧缩减时，Mixamo\
  \ 会增加一些数学计算以减小数据大小，但这可能会降低动画质量。最好让 Unreal Engine 获取这些数据进行处理。如果在 Unreal 中确实需要关键帧缩减，Unreal\
  \ 内部有大量工具能提供更好且可控的结果。\n\n## 下载动画\n点击 `DOWNLOAD` 后，Mixamo 会询问你想将新的 FBX 文件下载到何处；选择一个你容易记住的位置，最好是在你的项目文件夹内，这样可以省去下一步操作。\n\
  \n如果你直接将其保存到项目 `Content` 文件夹内的某个位置，且 Unreal 正在运行，你将会收到如图 5.18 所示的提示（稍后你将看到），允许导入进行。\n\
  \n不过，让我们假设它保存在别处，以便我们现在可以在下一步中查看如何手动导入动画。\n\n### 将 Mixamo 动画导入 Unreal\n\n### 准备导入文件夹\n\
  如果你将 FBX 下载到了任意位置，你需要从该位置将其导入 Unreal。为此，首先在你的 Unreal 项目中创建一个新文件夹，并将其命名为 `MIXAMO_ANIMATIONS`。双击该文件夹进入内部，然后右键点击查看以下菜单：\n\
  \n![图 5.17：导入 FBX 动画](img/B17878_05_17.jpg)\n\n图 5.17：导入 FBX 动画\n\n要导入动画和 Mixamo\
  \ 骨架，请选择 `Import to`（导入到），以及你即将导入资产的文件夹。从图 5.17 中高亮的文本可以看出，我正将资产导入到 `Game/MIXAMO_ANIMATIONS`。\n\
  \n### FBX 导入选项\n选中后，将弹出 `FBX Import Options`（FBX 导入选项），如图 5.18 所示：\n\n![图 5.18：FBX\
  \ 导入选项](img/B17878_05_18.jpg)\n\n图 5.18：FBX 导入选项\n\n在图 5.18 中，你可以看到有大量可编辑的选项。归根结底，`FBX\
  \ Import Options` 对话框允许我们导入 Mixamo 骨架、Mixamo 动画、我们的 MetaHuman 角色几何体以及与之关联的蒙皮权重。将所有这些组件导入引擎对于我们正确地将动画重定向到\
  \ MetaHuman 角色至关重要。\n\n然而，如果你遵循了本章前面提到的所有步骤，你会发现这里几乎不需要做任何操作。默认设置就足够了，除了以下两项例外：\n\
  \n*   **Mesh Skeleton（网格体骨架）**：你需要选择要在 Mixamo 骨架上使用的骨架。不幸的是，我们不能直接将 MetaHuman 骨架与\
  \ Mixamo 骨架一起使用，因为它太复杂了；相反，我们将使用次优选择 `SK_Mannequin`，点击下拉列表后即可看到，如图 5.18 所示。\n* \
  \  **Import Animations（导入动画）**：这似乎显而易见，但是的，我们需要确保勾选 `Import Animations` 复选框，以便导入嵌入在\
  \ FBX 文件中的动画。\n\n> **注意**\n>\n> 如果你已经完成了下载 Mixamo 骨架、蒙皮权重和动画的过程，你会发现你的 Mixamo 骨架现在已成为\
  \ `FBX Import Options` 中的一个可选项，而不是 `SK_Mannequin`。\n\n### 配置导入设置\n确保选择了正确的 `Mesh\
  \ Skeleton` 并勾选了 `Import Animations` 后，点击 `Import All`。这将需要几分钟时间加载到你的项目中。导入完成后，你会发现新导入的资产，外观类似于图\
  \ 5.19：\n\n![图 5.19：导入的资产](img/B17878_05_19.jpg)\n\n图 5.19：导入的资产\n\n### 导入的资产\n\
  此时，我们已成功导入 Mixamo 动画，以及一个启用了所有蒙皮权重以正确操控 MetaHuman 身体网格体的骨架。从图 5.19 可以看到这些资产；从左到右依次为：\n\
  \n*   `Fbx_Default_Material_0`：这是从 Mixamo 导出的默认材质。既然我们只对 Mixamo 的动画感兴趣，可以忽略它。\n\
  *   `Macarena_Dance`：这是包含我们所需蒙皮权重的 Mixamo 骨架。\n*   `Macarena_Dance_Anim`：这是每个关节的实际关键帧数据。\n\
  *   `Macarena_Dance_PhysicsAsset`：这是在导入过程中由 Unreal 自动创建的，包含超出本书范围的物理模拟。\n\n> **注意**\n\
  >\n> 要了解有关 UE 中 `PhysicsAsset` 的更多信息，可以查看以下链接：PhysicsAsset 文档。\n\n### 为重定向设置 IK\
  \ 骨架\n目前，我们有了 Mixamo 骨架但没有骨骼，因此无法将 Mixamo 动画应用到我们的 MetaHuman 蓝图中。就像在 第 4 章 中一样，我们需要使用两个\
  \ IK 骨架，以便重新利用 Unreal `SK_Mannequin` 并将动画从其重定向到 MetaHuman。虽然这对你可能很熟悉，但我还是为我们的新 Mixamo\
  \ 资产再次概述了该流程：\n\n#### 创建 IK 骨架\n1.  在新的 `Mixamo_Animations` 文件夹中，创建一个新的 IK 骨架并将其命名为\
  \ `Source_RigMixamo`。然后，创建另一个 IK 骨架并将其命名为 `Target_RigMeta`。\n\n作为提醒，请看图 5.20；你可以看到，当你在\
  \ `Content`（内容）标签页的任意位置右键点击时，可以选择 `Animation`（动画），然后从列表中选择 `IK Rig`：\n\n![图 5.20：创建\
  \ IK 骨架](img/B17878_05_20.jpg)\n\n图 5.20：创建 IK 骨架\n\n#### 定义 IK 链\n2.  创建好两个 IK\
  \ 骨架后，下一步是为每个骨架创建五个 IK 链，并确保完成以下链顺序：\n    *   脊柱到头部\n    *   左锁骨到左手\n    *   右锁骨到右手\n\
  \    *   左大腿到左脚\n    *   右大腿到右脚\n\n#### 分配骨骼\n3.  使用 IK 骨架，我们需要将 `SK_Mannequin`\
  \ 作为源骨骼，将 `Glenda_Med_Ovw` 骨骼作为目标骨骼。\n\n就像上一章一样，我建议同时打开源和目标 IK 骨架并将它们并排放置，如图 5.21\
  \ 所示。这样，你可以确保在 IK 链和 IK 链的创建顺序方面，让它们尽可能匹配。\n\n![图 5.21：并排的 IK 骨架](img/B17878_05_21.jpg)\n\
  \n图 5.21：并排的 IK 骨架\n\n\n\n\n\n### 处理后续动画\n\n对于从 Mixamo 下载的任何后续动画，你应该选择**不带皮肤**下载（此选项在\
  \ Mixamo 下载动画时可用，如*图 5.16*所示）。然后，在将新动画导入 Unreal 时，你现在可以选择创建源 IK Rig 时生成的骨架（在我的例子中，它被称为\
  \ `MaceranaDance_Skeleton`）。Glenda 预览网格体跳 Macarena 舞的无头缩略图也可见，如下所示：\n\n![图 5.26：后续仅动画文件的\
  \ FBX 导入选项](img/B17878_05_26.jpg)\n\n图 5.26：后续仅动画文件的 FBX 导入选项\n\n最佳实践是从 Mixamo 批量下载不带皮肤的动画。然后，你可以直接将它们从外部文件夹拖放到你的\
  \ `Content` 文件夹中，或者使用 `文件导入` 选项并选择多个文件而非单个文件来导入。\n\n导入多个动画 FBX 文件时，将出现*图 5.26*所示的对话框。点击\
  \ `全部导入`，相同的设置将应用于你正在导入的所有动画。因此，如果你有 100 个动画，只需单击一次即可将此骨架应用到所有 100 个资产中。\n\n在我的例子中，我下载了五个足球动画并将它们导入到我之前在\
  \ Unreal 项目中创建的 `Mixamo_Animations` 文件夹中。为了批量重定向所有这些动画，我只需要打开 IK 重定向器。\n\n打开我之前创建的\
  \ IK 重定向器，我现在可以看到这些动画及其骨架已准备好重定向到我的 MetaHuman 角色：\n\n![图 5.27：IK 重定向器中有多个可用于重定向的动画](img/B17878_05_27.jpg)\n\
  \n图 5.27：IK 重定向器中有多个可用于重定向的动画\n\n因为我的新动画在导入时已设置为使用 Mixamo 骨架，所以它们会自动出现在 IK 重定向列表中。你可以在*图\
  \ 5.27*底部看到该列表。我导入了五个足球动画并全选了它们。\n\n使用 `导出选中动画` 按钮，我现在可以单击一次就批量转换多个动画。\n\n导出这些动画时，IK\
  \ 重定向器会保留动画名称，并自动在每个动画资产名称后添加 `Retargeted` 后缀。和以前一样，你可以进入角色蓝图，在 `Anim to Play` 下搜索你的新动画。在*图\
  \ 5.28*中，你可以看到我搜索了 `soccer`，发现我的新重定向动画已经准备好应用到场景中的角色蓝图了：\n\n![图 5.28：重定向动画可在 Anim\
  \ to Play 下找到](img/B17878_05_28.jpg)\n\n图 5.28：重定向动画可在 Anim to Play 下找到\n\n得益于上一节完成的工作，在本节中，你能够批量导入多个动画并使用\
  \ IK 重定向器工具批量重定向它们。这是为你的 MetaHuman 角色创建完整动作库的一种非常高效的方法。\n\n### 总结\n\n在本章中，我们了解了这个极好的免费资源\
  \ Mixamo，以及如何将数百个动画引入你的项目。我们学习了如何最佳配置角色网格体以充分利用 Mixamo，并复习了 IK Rig 和 IK 重定向器。\n\n\
  此外，我们了解了角色比例的重要性、一些蒙皮权重知识，以及它们与角色比例和动画骨架的关系。\n\n最重要的是，我们了解了功能强大的自动化工具，它们允许我们批量导入和批量重定向从\
  \ Mixamo 获取的动画文件。\n\n在下一章中，我们将了解 DeepMotion，另一个在线资源，它允许我们仅使用摄像机创建自己的自定义动画。\n"
- "## 第 6 章：使用 DeepMotion 添加动作捕捉\n\n在上一章中，我们介绍了 Mixamo 的动作捕捉库，以及如何让 Mixamo 动画在 Unreal\
  \ 中工作。\n\n在本章中，我们将建立在该知识之上，使用另一个名为 **DeepMotion** 的第三方在线工具创建我们自己的动画，该工具包含一个名为 **Animate\
  \ 3D** 的功能，它分析人类表演的视频，并返回创建一个动作捕捉文件。我们将学习如何有效地使用摄像机录制表演，然后使用 DeepMotion 的 Animate\
  \ 3D 功能创建你专属的动作捕捉文件，并用它在 Unreal 中为你的 MetaHuman 角色制作动画。\n\n\n\n\n\n尽管 Mixamo 等素材动作库非常出色，但你仍需要拥有自己的定制动画，以获得创作自由。即使像\
  \ DeepMotion 的 Animate 3D 这样的解决方案效果可能不如昂贵的动作捕捉服所能获得的结果，但它也将远好于使用素材库现成动作时所做的妥协。\n\
  \n因此，在本章中，我们将涵盖以下主题：\n\n*   认识 DeepMotion\n*   准备视频素材\n*   将视频片段上传至 DeepMotion\n\
  *   探索 DeepMotion 的动画设置\n*   下载 DeepMotion 动作捕捉文件\n*   将 DeepMotion 动作动画导入 Unreal\n\
  *   重定向 DeepMotion 动作捕捉\n*   修复位置错位问题\n\n### 技术要求\n\n就计算机性能而言，你需要 *Chapter 1* 中详述的技术要求，以及我们在\
  \ *Chapter 2* 中导入 UE5 的 MetaHuman 角色和 Unreal Engine 模型。这两者都需要保存在 UE 的同一个项目中，并且本章需要运行\
  \ UE。\n\n你还需要稳定的网络连接，因为我们将上传 MetaHuman 预览网格体和视频文件，并下载大量动画资产。你需要一台摄像机——网络摄像头、智能手机或专业摄像机/数字电影摄像机均可，但请注意，分辨率高于\
  \ HD 的视频并无额外优势。\n\n## 认识 DeepMotion\n\n直到最近，定制动作捕捉解决方案仍需要昂贵的设备和昂贵的软件；想想《阿凡达》、《指环王》或《加勒比海盗》等电影，演员必须穿着带有反光球或红外传感器棋盘标记的动作捕捉服。这项技术仅适用于能够承担此类投资的大型工作室，因此，独立工作室和自由艺术家只能将就使用动作捕捉库，如前所述的\
  \ Mixamo。\n\n最近，随着越来越多价格亲民的解决方案可供艺术家使用，这一现状已有所改变。在为本书进行调研时，我特别关注成本因素，测试了多款动作捕捉工具。因为\
  \ **动作捕捉** (**mocap**) 服、红外传感器以及所有那些花哨的装备对我们大多数人来说实在太贵了，所以我考察了 DeepMotion 的 Animate\
  \ 3D。\n\nDeepMotion 的 Animate 3D 是 **无标记动捕解决方案** 的一个典型例子。该流程仅需用摄像机拍摄人体表演视频，无需特殊服装或标记。软件通过分析视频文件来识别和追踪每个身体部位。在机器学习的辅助下，该方案能够利用动作数据库或动作数据来规避错误。此外，还利用了\
  \ **反向运动学** 来进一步优化流程。这项技术在不断进步，且机器学习是其关键特性，进步速度确实非常快。\n\n就 DeepMotion 而言，该在线工具允许我们上传表演视频，并为我们处理动作捕捉，以便在\
  \ Unreal（或任何其他兼容平台）中使用。虽然该过程包含机器学习，但幸运的是，DeepMotion 为我们处理了所有这些复杂工作。\n\n在下一节中，我们将深入探讨如何有效录制视频的细节。\n\
  \n## 准备视频素材\n\n在转向 DeepMotion 之前，关于录制表演视频，有一些关键因素我们需要了解。让我们现在来看看它们：\n\n### 摄像机质量与位置\n\
  \nDeepMotion 能够处理从网络摄像头、旧智能手机等低端摄像机，一直到高端电影摄像机拍摄的素材，只要画面清晰、稳定，且具有合理的高帧率即可。许多低端摄像机的最低帧率为\
  \ 30 fps，但如果你使用更高的帧率，对于快速移动的演员会获得更好的效果。\n\n此外，摄像机最好保持静止，因为软件是基于固定的地面位置来计算演员的运动。摄像机的理想位置距离演员约\
  \ 2 米。\n\n### 高对比度拍摄\n\n由于这种无标记动捕方案是追踪像素而非传感器，我们需要尽可能方便软件区分背景与演员。这就是为什么我们需要两者之间具有高对比度。如果你打算在深色背景（如窗帘）前拍摄，请确保演员穿着亮色衣服，反之亦然。此外，宽松的衣物可能会导致问题，因为衣物往往会被追踪；例如，如果演员穿着非常宽大的袖子，追踪器就很难分辨手臂和袖子的区别。\n\
  \n### 始终保持全身入镜\n\n虽然 DeepMotion 仅凭上半身视频就能很好地推算角色动作，但根据经验法则，获取比所需更多的数据更好，因此请尽可能拍摄演员的全身镜头。捕捉演员的全身也很重要，因为即使演员的脚或头仅离开画面一秒，也可能导致整个动作捕捉过程的其余部分出现不良结果。\n\
  \n话虽如此，如果你的目的是捕捉全身表演，那么全身视频捕捉就是必须的。\n\n### 校准时间\n\n确保在表演前后让演员在镜头前停留几秒钟，最好摆 T 字姿势并面对摄像机。这给\
  \ DeepMotion 时间在表演*前*而非表演*中*将其骨架与演员身体对齐。\n\n### 遮挡\n\n在视频素材中，演员身体的某一部分遮挡另一部分的情况很少见。通常他们的手臂在身体前方，但因为\
  \ DeepMotion 能确定骨架脊柱的位置，所以这种遮挡不是问题。\n\n然而，当身体遮挡肢体时，可能会出现问题。以手为例，当手移至身体后方或头部后方时，DeepMotion\
  \ 因没有像素指示手的位置，只能猜测手应在何处。它要么尝试猜测，要么根本不给那些问题区域应用任何动画。\n\n此外，演员与摄像机之间的物体也可能造成遮挡，从而引发问题。例如，树枝或路灯柱可能瞬间挡住视线，但可能会无意中导致比预期多得多的错误。\n\
  \n因此，不建议在前景有遮挡演员的物体的情况下拍摄。\n\n### 表演速度\n\nDeepMotion 不擅长检测片段中的极快动作。例如，对于踢踏舞或拳击，软件很难跟上快速的脚部动作，反而会给出非常差的结果。一个好的经验法则是：如果你在视频片段中看到任何动态模糊，则不太可能获得好结果。请务必以慢动作播放片段以进行妥善分析。\n\
  \n### 文件大小\n\n如果你使用专业视频文件格式，除了能以更高帧率拍摄外别无裨益。MP4 等压缩或有损视频文件格式足以胜任，最好将文件大小控制在 200\
  \ MB 左右。文件过大上传和分析所需时间更长。虽然接受 MOV 文件，但我建议你改用 MP4 文件。\n\n\n\n\n在本节中，我们介绍了录制演员视频时需要考虑的所有主要因素。鉴于视频的性质以及每个场景都会有所不同，这其中必然包含一定的试错过程，所以如果一开始没有获得理想的结果，请不要灰心。您随时可以回顾本节，以排查可能遇到的任何问题。\n\
  \n或者，如果您不想自己拍摄，可以去素材库下载一个符合前面提到的标准的片段。为了本书的目的，我从 [motionarray.com](https://motionarray.com)\
  \ 获取了片段。\n\n在下一节中，假设您已经拍摄了一些素材，您将把片段上传到 DeepMotion。\n\n### 上传视频到 DeepMotion\n\n\
  在本节中，我们将访问 DeepMotion 网站，注册并上传我们的素材。\n\n首先，您需要访问 [`www.deepmotion.com/`](https://www.deepmotion.com/)。从登录页面点击\
  \ `SIGN UP` 按钮，您将看到如 *图 6.1* 所示的表单。填写此表单以创建一个 `Freemium` 账户（并注意右侧的功能）：\n\n![图 6.1：使用\
  \ DeepMotion 注册](img/B17878_06.01.jpg)\n\n图 6.1：使用 DeepMotion 注册\n\n> **注意**\n>\n\
  > DeepMotion 的 `Freemium` 账户允许您上传时长不超过 10 秒、分辨率不超过 1,080 像素、帧率不超过 30 fps 的片段。使用免费用户价格方案，您每月最多可获得\
  \ 30 秒的动画时长。实际上这是一个试用服务，您需要付费才能获得更多使用量，但有各种付费计划提供更多功能，例如允许您上传帧率更高的片段。\n\n填写完详细信息后，点击\
  \ `Get Started` 按钮。这将向您的电子邮件地址发送一个链接，或直接带您进入 DeepMotion Portal 页面，如 *图 6.2* 所示：\n\
  \n![图 6.2：DeepMotion Portal 页面](img/B17878_06.02.jpg)\n\n图 6.2：DeepMotion Portal\
  \ 页面\n\n使用 `Freemium` 账户，我们唯一可用的功能是 `Animate 3D` 功能（其他功能被锁定）。点击 `Animate 3D` 框，您将进入\
  \ Animate 3D 欢迎页面，如 *图 6.3* 所示：\n\n![图 6.3：Animate 3D 欢迎页面](img/B17878_06.03.jpg)\n\
  \n图 6.3：Animate 3D 欢迎页面\n\n在这里，您将看到拥有多少积分：1 积分等于 1 秒动画。下一个框标题为 `Reruns`，显示您优化捕捉过程的尝试次数。`Reruns`\
  \ 允许您更改设置而不消耗任何动画积分。\n\n现在，点击大大的黄色 `Create` 按钮，您将看到可以放置素材的仪表板，如 *图 6.4* 所示：\n\n\
  ![图 6.4：Animate 3D 仪表板](img/B17878_06.04.jpg)\n\n图 6.4：Animate 3D 仪表板\n\n在 *图 6.4*\
  \ 顶部，您可以看到两个缩略图：`3D Animation` 和 `3D Pose`。请务必切换到 `3D Animation`。\n\n在下方，您可以选择将文件夹拖放到\
  \ DeepMotion 中，或浏览文件夹上传文件。它们还提供了接受的文件类型列表：`MP4`、`MOV` 和 `AVI`。如果您有其他格式，则需要使用编码器（如\
  \ `Adobe Media Encoder`、`VLC Player` 或 `QuickTime Pro`）转换文件。\n\n> **注意**\n>\n> 除非原始\
  \ `MOV` 文件与 `MP4` 转换后的文件在质量上有显著差异，否则请使用 `MP4`，因为它可以减少上传和处理时间。\n\n最后，您将看到一个关于如何获得最佳视频效果的提醒（我在本章前面对此进行了扩展），我建议您查看一下，以确保充分利用您有限的积分。\n\
  \n准备好后，通过您喜欢的任何方式上传视频；现在，您将能够查看视频设置。\n\n### 探索 DeepMotion 的动画设置\n\n上传视频片段后，您将进入\
  \ `Animate 3D` 仪表板，如 *图 6.5* 所示。如果您想使用与我相同的片段，我使用的是一个跳舞男人的片段，地址如下：[`motionarray.com/stock-video/happy-man-dancing-vertical-814129/`](https://motionarray.com/stock-video/happy-man-dancing-vertical-814129/)。\n\
  \n![图 6.5：Animate 3D 仪表板](img/B17878_06.05.jpg)\n\n图 6.5：Animate 3D 仪表板\n\n在 *图\
  \ 6.5* 中，您可以看到视频片段的缩略图，以及片段的文件名 `Happy-man-dancing-vertical-814129_1.mp4`。片段的属性显示在缩略图的右侧，如下所示：\n\
  \n*   **时长**：用于监控片段的时长。如果片段长度超出您定价计划允许的范围，将报错；在这种情况下，您需要上传更短的片段。\n*   **文件大小**：如果文件大小超出您的账户设置，将报错。您需要通过压缩器（如\
  \ `Adobe Encoder`）减小文件大小，然后重新上传。如果在上传过程中报错，很可能是因为您基于账户设置超过了这些属性中的一个或多个限制。\n*   **分辨率**：每个账户设置都有最大分辨率。如果分辨率过大将报错，您需要使用转换器降低分辨率。例如，对于\
  \ `Freemium` 账户，4,096 x 3,112 的片段太大，您需要将其缩小到 1,920 x 1,080（使用 `Adobe Encoder` 或类似工具）。\n\
  *   **帧率**：如果您有 `Freemium` 账户，使用较高的帧率（如 200 fps）将报错。通常，网络摄像头生成的视频帧率约为 25 fps，因此使用网络摄像头可以降低此错误的发生几率。\n\
  \n在 *图 6.5* 所示界面的下半部分，您将看到两个选项：`Animation Output` 和 `Video Output`。为了本书的目的，我们忽略\
  \ `Video Output`，因此请确保选择了 `Animation Output`。\n\n有 10 个功能可用，但并非所有功能都可用或与您的账户类型和您想要实现的动作捕捉复杂度相关。`Animation\
  \ Output` 参数如下：\n\n*   **FBX 输出**：您希望用于动画的文件类型。因为我们稍后只想在 Unreal 中使用 FBX 动画，所以请确保输出设置为\
  \ `FBX`。（只有当我们想创建静态姿势时才会提供其他选项，这与本书无关。）\n*   **物理过滤器**：这会强制执行关节限制并尝试消除碰撞，例如手穿过躯干。如果素材没有明显问题，我建议您首先尝试在禁用\
  \ `Physics Filter` 的情况下处理动画，因为启用它可能会产生某种人为的结果。此外，请记住利用 `Rerun` 选项来尝试 `Physics Filter`，如果第一次没有获得好结果的话。\n\
  *   **脚部锁定**：这解决了动作捕捉中常见的一个问题，即脚离开地面然后又落回地面时的处理。对于穿着动捕服的捕捉，这不太成问题，但对于视频动作捕捉，很难确定脚何时接触地面。`Foot\
  \ Locking` 提供四个选项：\n    *   **自动**：这是最常用的模式，因为它会自动在将脚位置锁定到地面和让其移动之间切换。对于行走或跳舞的角色，这是最可能使用的模式，因为角色不可避免地会间歇性地抬起和放下脚。\n\
  \n> **注意**\n>\n> `Freemium` 账户中仅提供 `Auto` 设置。\n\n\n\n### 动画输出设置\n\n## 脚部锁定模式\n\n\
  *   `Never`：在涉及游泳或持续下落的动画中，我们知道角色的脚永远不会与地面接触，因此使用此模式以避免错误。\n\n*   `Always`：最适用于角色脚部永不离地的情况。这似乎显而易见，但在\
  \ `Auto` 和 `Always` 之间选择时，如果我们知道角色脚不离地，最好使用 `Always`，因为 `Auto` 模式在这种情况下可能导致错误。\n\
  \n*   `Grounding`：实际上，这使脚保持在地面高度，但不一定将其锁定在固定位置。`Auto` 工作方式类似，但在快速移动时效果不佳；如果角色脚部做滑动运动，`Grounding`\
  \ 模式是最佳选择。\n\n## 默认姿势\n\n`Default Pose`：指保存动画文件时的骨骼校准姿势。理想情况下，源动画的校准姿势应与目标角色的校准姿势匹配。此下拉菜单有四个选项：\n\
  \n*   `A-Pose`：最常用的校准姿势之一，也是 MetaHuman 在 UE5 引擎中出现的姿势。此姿势将手臂设置为 45 度角。\n\n*   `I-Pose`：不太可能使用的姿势，手臂垂直向下。\n\
  \n*   `T-Pose`：另一个标准姿势，也是 Unreal Engine 模特的默认姿势。手臂向外伸直，与身体呈 90 度角，形成 T 形。\n\n* \
  \  `Sitting`：另一个不太可能的姿势，手臂类似 `A-Pose` 但角色坐着。\n\n## 运动平滑\n\n`Motion Smoothing`：此选项使用\
  \ AI 通过查看每个关节的轨迹来确定角色应如何移动，并从动画中移除任何抖动或噪声，这些噪声来自持续的重新校准。虽然有助于消除不需要的抖动，但可能会引入一些看起来人为的运动；您可以调整平滑强度以获得想要的结果。\n\
  \n> **注意**\n>\n> 此功能在 Freemium 账户中不可用。\n\n## 根关节位于原点\n\n`Root Joint at Origin`：这对\
  \ Unreal Engine 艺术家特别有用，因为它在原点创建一个骨骼，位于双脚之间的地面上。该骨骼与髋部相连，对应角色的根位置。建议为打算在 UE 中使用的动作捕捉开启此功能，我们这里将确保开启。\n\
  \n## 面部追踪\n\n`Face Tracking`：撰写本文时，此工具对于我们在本书章节中将达到的面部捕捉复杂度而言，并非实用解决方案。尽管使用了 ARKit\
  \ 技术（这是 MetaHuman 底层面部动画控制技术），但 DeepMotion 的准确度远不如其他解决方案先进。我们将在 `第 8 章` 和 `第 9 章`\
  \ 中探讨使用 iPhone 和网络摄像头的更精准面部追踪。\n\n## 手部追踪\n\n`Hand Tracking`：此功能仅追踪手部运动，但程度更高级，甚至尝试追踪手指。撰写本文时，此功能仍处于测试阶段。对于\
  \ Freemium 用户，值得考虑使用此功能的额外成本；除非您在手部运动中看到明显错误（如手以奇怪方式移动或穿透其他身体部位），建议保持默认设置（关闭）。\n\
  \n## 速度倍率\n\n`Speed Multiplier`：这是 Premium 用户的高级功能，通过使用高帧率视频（即慢动作）来增加动作捕捉精度的好方法。`Speed\
  \ Multiplier` 允许 0-8 倍范围。如果角色以半速移动（慢动作），将倍率调整为 `2.0` 将得到常规运动结果但精度更高。对于 Professional\
  \ 和 Studio 计划，可使用高达 120 fps 的素材。该素材会非常慢，从而捕捉大量细节和微妙动作。120 fps 大约比实时慢 5 倍，因此您会使用约\
  \ 5 的 `Speed Multiplier` 来获得实时动作捕捉结果，并从中受益于更高的精度。\n\n---\n\n现在，完成所有 `Animation Output`\
  \ 设置后，您可以点击 `Create` 按钮（位于 `Figure 6.5` 底部）。点击后，您将看到确认对话框，如 `Figure 6.6` 所示：\n\n\
  ![图 6.6：确认新建动画对话框](img/B17878_06.06.jpg`)\n\n图 6.6：确认新建动画对话框\n\n从设置中可以看到，我启用了 `Root\
  \ Joint at Origin`，将 `Foot Locking` 设为 `Auto`，并将 `Default Pose` 设为 `A-Pose`。其他均保留默认设置。我不打算下载额外视频，因此\
  \ `MPF Enabled` 选项已禁用，其他均标记为 `n/a`。\n\n此时还值得注意的是，如果我们对结果不满意，可以重新运行此过程。话虽如此，是时候首次运行了，点击\
  \ `Start Job` 按钮。您将进入 `Starting job` 界面，如 `Figure 6.7` 所示：\n\n![图 6.7：开始作业](img/B17878_06.07.jpg`)\n\
  \n图 6.7：开始作业\n\n处理时间取决于视频剪辑的文件大小和长度。此外，如果视频包含大量运动，预期处理时间会更慢。\n\n处理完成后，便可查看结果。在 `Figure\
  \ 6.8` 中，您可以看到我所选片段的结果；当然，无法从这单张图像中看到结果，但我对结果印象深刻（毕竟，这是从单个摄像机而非昂贵的动作捕捉套装和传感器阵列获取的动作捕捉）：\n\
  \n![图 6.8：动作捕捉结果](img/B17878_06.08.jpg`)\n\n图 6.8：动作捕捉结果\n\n从此屏幕，您将看到一个交互式 3D 视口，可从任何角度查看结果，并以各种速度播放动画。\n\
  \n屏幕右侧，您将看到四种角色类型的简短列表；类似于 MetaHuman 预览网格，我们可以预览各种体型（如瘦、大、男、女），并选择它们随动画一起下载。为获得最佳结果，请选择最接近您\
  \ MetaHuman 角色的体型。在我的案例中，Glenda 略微超重，选择超重角色会更好。这会增加手臂与身体的距离，有助于解决手臂与躯干之间的碰撞（您可能记得\
  \ Mixamo 中名为 `Arm Spacing` 的功能；这与其工作方式类似）。\n\n另请注意 `Figure 6.8` 界面底部有两个选项：\n\n*\
  \   `Download`：允许我们下载带有所选骨骼网格的 FBX 文件。此时，我们可以选择除预览网格以外的其他网格。\n\n*   `Rerun`：这是我们优化动画质量的另一次机会。例如，我们可能对整体动画满意，但略有抖动；这将是应用少量\
  \ `Motion Smoothing` 的好机会。另一个例子，我们可能对脚部未按预期锁定地面感到不满；或许 `Auto` 设置对快速移动反应不够灵敏，我们可以返回将\
  \ `Auto` 切换为 `Grounding`。\n\n毋庸置疑，`Rerun` 是一个非常有效的工具，首次尝试不调整就获得理想结果的可能性很小。与其试图在\
  \ Unreal Engine 中修复，不如通过多次重运行尽可能接近期望结果。通过积累足够的重运行经验，您将通过实践和时间更高效地预测应使用哪些功能。\n\n\n\
  \n在 `Figure 6.9` 中，你可以看到 `Rerun Animation` 对话框：\n\n![图 6.9：重新运行动画对话框](img/B17878_06.09.jpg`)\n\
  \n图 6.9：重新运行动画对话框\n\n此 `Rerun Animation` 框与 `Figure 6.6` 中的 `Confirm New Animation`\
  \ 框的唯一区别在于，它会显示产生上一次结果的 `Current` 设置，以及你即将投入下一项作业的 `New` 设置。这使你能进行对比研究，从而为重新运行做出更明智的决定。\n\
  \n现在，当你浏览完所有设置并重新运行作业直到最终对结果满意时，就该下载动画了。\n\n### 下载 DeepMotion 动作捕捉文件\n\n要下载 DeepMotion\
  \ 动作捕捉文件，请不要点击 `Rerun` 选项，只需点击 `Download` 按钮。这将弹出 `Download Animations` 对话框，如 `Figure\
  \ 6.10` 所示：\n\n![图 6.10：下载动画](img/B17878_06.10.jpg`)\n\n图 6.10：下载动画\n\n在下载动画前，对话框提供了切换或确认所需体型的选项：两个成年女性、两个成年男性和一个通用儿童供选择。当你对预览网格体满意后，请确保从下拉菜单中选择了正确的下载文件类型\
  \ `FBX`（`BVH` 和 `DMPE` 方案不适用于我们在 Unreal 中的操作）。然后，点击黄色的 `Download` 按钮，将文件保存到项目文件夹中的某个位置。\n\
  \n下载动画后，你将看到两个 FBX 文件和一个文件夹，如 `Figure 6.11` 所示：\n\n![图 6.11：DeepMotion 保存的文件和命名约定](img/B17878_06.11.jpg`)\n\
  \n图 6.11：DeepMotion 保存的文件和命名约定\n\n文件名以 `TPose` 结尾的 FBX 文件（`Adult_Male_Alt(includeTPose)`）是指在动画开始处使用实际\
  \ T-pose 的文件。另一个文件 `Adult_Male_Alt` 在开头没有此类 T-pose，因此从第一帧直接开始动画。选择哪一个并不关键，因为你随时可以从动画中移除\
  \ T-pose 片段，但在需要为重定向目的对齐时，T-pose 可能会变得有用。我们将在本章末尾探讨这一点。\n\n现在我们已下载相关文件，在下一节中，我们将把\
  \ DeepMotion 动作捕捉文件导入 Unreal，以便将其重定向到 MetaHuman IK Rig。\n\n### 将 DeepMotion 动画导入\
  \ Unreal\n\n正如本章开头所述，我们是在前几章所学基础上构建，但别担心，我们将把本节作为导入角色到 Unreal 过程的简要回顾。\n\n首先，你需要在\
  \ Unreal 项目中创建一个名为 `Deepmotion` 的文件夹。确保你在上一章使用的项目中工作，该项目同时拥有 Mixamo 角色和 MetaHuman\
  \ 角色的源 IK Rig 和目标 IK Rig。\n\n创建 `Deepmotion` 文件夹后，在 `Deepmotion` 文件夹的 `Content`\
  \ 浏览器中任意位置右键单击，查找你的新 DeepMotion FBX 文件。选择文件名包含 `TPose` 的那个。选中后，你将看到 `FBX Import\
  \ Options` 对话框，如 `Figure 6.12` 所示：\n\n![图 6.12：FBX 导入选项](img/B17878_06.12.jpg`)\n\
  \n图 6.12：FBX 导入选项\n\n这里有两点需要注意：\n\n*   首先，我们不想为此导入分配骨架；我们想使用即将导入的文件中嵌入的骨架。因此，在 `Mesh`\
  \ 下，将 `Skeleton` 保留在默认位置 `None`，并确保选中 `Skeletal Mesh` 选项，以便它知道从文件中选择骨架网格体。\n*  \
  \ 其次，虽然这听起来显而易见，但请确保在 `Animations` 下勾选 `Import Animations` 选项。\n\n考虑完这些后，点击蓝色的 `Import\
  \ All` 按钮。不要被提到平滑处理的错误弹窗吓到；你可以关闭它。\n\n现在，当你查看 `Content` 浏览器中的 `Deepmotion` 文件夹时，应该会看到类似\
  \ `Figure 6.13` 的内容：\n\n![图 6.13：Deepmotion 内容文件夹](img/B17878_06.13.jpg`)\n\n图 6.13：Deepmotion\
  \ 内容文件夹\n\n你在这里看到的大部分内容应该都很熟悉；从左到右，你将看到以下内容：\n\n*   身体的材质着色器\n*   无动画的 T-pose 骨架\n\
  *   带动画的 DeepMotion 骨架\n*   DeepMotion 骨架物理资产\n*   用于编辑的无动画 T-pose 骨架\n*   上述用于身体的材质着色器所用的纹理文件\n\
  \n在本节中，我们已成功将 `Deepmotion` 文件导入 Unreal Engine。在下一节中，我们将结合角色使用 DeepMotion 动画。\n\n\
  ### 重定向 DeepMotion 动作捕捉\n\n与前几章一样，你需要创建一个 IK Rig 作为源。因此，在 `Deepmotion` 文件夹中，任意位置右键单击，选择\
  \ `Animation`，然后选择 `IK Rig`，如 `Figure 6.14` 所示：\n\n![图 6.14：创建 IK Rig](img/B17878_06.14.jpg`)\n\
  \n图 6.14：创建 IK Rig\n\n为避免混淆，将此 IK Rig 命名为 `Source_DM_Happy`（这将帮助我们稍后查找它）。\n\n然后，像以前一样，遵循相同流程创建\
  \ IK 链。同样，我们需要创建六个独立的 IK 链，分别对应：\n\n*   根骨骼到髋部\n*   脊柱和头部\n*   左臂\n*   右臂\n*   左腿\n\
  *   右腿\n\n唯一不同的是命名约定，这在从不同来源导入动作捕捉时是意料之中的。DeepMotion 的命名约定可见于 `Figure 6.15`，它们对关节使用\
  \ `JNS` 缩写，并以前缀 `l_` 或 `r_` 开头表示左或右：\n\n![图 6.15：IK 链](img/B17878_06.15.jpg`)\n\n\
  图 6.15：IK 链\n\n请注意，这些链的顺序（从 `Root` 到 `hips_JNT`，以 `r_upleg_JNT` 到 `r_foot_JNT` 结束）与我的\
  \ IK 链列表一致；在 IK 源和 IK 目标中保持相同顺序可减少错误。\n\n现在该创建一个新的 IK Retargeter，使用我们的新 IK Rig 作为源。仍在\
  \ `Deepmotion` 文件夹中，在 `Content` 浏览器任意位置右键单击，转到 `Animation`，然后选择 `IK Retargeter`，如\
  \ `Figure 6.16` 所示：\n\n![图 6.16：创建新的 IK 重定向器](img/B17878_06.16..jpg`)\n\n图 6.16：创建新的\
  \ IK 重定向器\n\n创建新 IK Retargeter 后，双击打开它，你将看到一个潜在源列表供选择。在 `Figure 6.17` 中，你可以看到我项目文件夹中保存的所有\
  \ IK Rig 列表：\n\n![图 6.17：选择要复制动画的 IK Rig](img/B17878_06.17.jpg`)\n\n图 6.17：选择要复制动画的\
  \ IK Rig\n\n你会看到我有一个名为 `SourceRigMixamo` 的源 IK Rig。随着你在 Unreal 中的练习，你很快会拥有多个源 IK\
  \ Rig。你应该仍保留上一章使用的源 IK Rig。这就是为什么适当标记这些 IK Rig 很重要，以免无意中选择错误的一个。\n\n你**不**想使用上一章的\
  \ Mixamo rig，所以请选择 `Source_DM_Happy`，因为那是我们要复制动画的 rig。然后点击 `OK`。\n\n> **注意**\n>\n\
  > 如果你选择了错误的 IK Rig，你将需要删除此 Retargeter 并创建一个新的，这就是为什么标记 IK 源 rig 很重要的原因。\n\n\n\n\
  创建好使用 `Source_DM_Happy` 骨架的 IK 重定向器后，双击打开它。这将弹出以下界面：\n\n![图 6.18：在 IK 重定向器中选择目标](img/B17878_06.18..jpg)\n\
  \n图 6.18：在 IK 重定向器中选择目标\n\n现在，你需要选择 IK 目标以应用 DeepMotion 动作捕捉数据。从图 6.19 可以看出，`Source\
  \ IKRig Asset`（源 IK 绑定资产）被锁定了，但 `Target IKRig Asset`（目标 IK 绑定资产）仍有一个下拉列表。选择你的 MetaHuman\
  \ 目标绑定；在我的例子中，是 `TARGET_meta`。\n\n此时，我们也可以选择合适的 `Target Preview Mesh`（目标预览网格体）。在我的例子中，目标预览网格体是\
  \ `Female Medium Overweight`（中等体型超重女性）网格体，标题为 `f_med_ovw_body_preview_mesh`，如图 6.19\
  \ 所示：\n\nI\n\n![图 6.19：目标预览网格体](img/B17878_06.19.jpg)\n\n图 6.19：目标预览网格体\n\n在图 6.19\
  \ 底部的 `Asset Browser`（资产浏览器）选项卡下，你可以看到 DeepMotion 动画现已可供导出。因此，如果你对动画满意，只需点击绿色的 `Export\
  \ Selected Animations`（导出选中的动画）按钮。\n\n提醒一下，点击 `Export Selected Animations` 按钮将创建一个动画文件，该文件现在可用于你的\
  \ MetaHuman 角色。系统会提示你选择动画的保存位置，请选择你的 `Deepmotion` 文件夹。\n\n接下来，将你的 MetaHuman 角色从\
  \ `Content`（内容）文件夹拖放到视口中，将其添加到场景里。然后，确保在 `Outliner`（大纲视图）中选中了你的 MetaHuman 蓝图。\n\n\
  之后，前往 `Details`（详细信息）面板，选择 `Body`（身体），在 `Animation Mode`（动画模式）下选择 `Use Animation\
  \ Asset`（使用动画资产）。搜索你新的重定向动画文件并点击它。在图 6.20 中，你可以看到我从下拉列表中选中了 `Happy Animation`（快乐动画）文件：\n\
  \n![图 6.20：应用动画](img/B17878_06.20.jpg)\n\n图 6.20：应用动画\n\n选中文件后，在视口中点击 `Play`（播放），你就会看到你的角色“活”了过来。\n\
  \n既然你已成功完成从视频创建动作捕捉数据并将其重定向到 MetaHuman 角色的整个流程，我们将在下一节中探讨排查一个常见问题。\n\n### 修复位置错位问题\n\
  \n你的动画不太可能与视频完美匹配，重定向过程也不太可能一帆风顺。源绑定和目标绑定之间总会存在细微的差异。最常见的问题之一是手臂位置，这主要归结于 `T-Pose`（T\
  \ 姿势）和 `A-Pose`（A 姿势）的区别。\n\n由于 MetaHuman 采用 `A-Pose`，而我们的 DeepMotion 绑定设置为 `T-Pose`，这就是问题所在。如果你在\
  \ DeepMotion 中选择了 `T-Pose`，有一个方便的小修复方法，可以省去你再次经历下载和重定向过程的麻烦。\n\n正如图 6.21 所示的 `IK\
  \ Retargeter`（IK 重定向器）界面，我们可以看到问题所在：源 DeepMotion 角色处于 `T-Pose`，而目标 MetaHuman 角色处于\
  \ `A-Pose`。在这种情况下，由于错位，手臂将无法正确动画化，极有可能与身体相交：\n\n![图 6.21：IK 重定向器 T 姿势对比 A 姿势](img/B17878_06.21.jpg)\n\
  \n图 6.21：IK 重定向器 T 姿势对比 A 姿势\n\n这里唯一的选择是更改目标的姿势，即 MetaHuman。为此，点击屏幕顶部的 `Edit Pose`（编辑姿势）按钮，如图\
  \ 6.22 所示。这将允许你在 `IK Retargeter` 内部旋转 MetaHuman 角色的关节：\n\n![图 6.22：IK 重定向器中的编辑姿势](img/B17878_06.22.jpg)\n\
  \n图 6.22：IK 重定向器中的编辑姿势\n\n我强烈建议你使用旋转吸附功能，它在图 6.22 的右上角高亮显示。我发现 `T-Pose` 和 `A-Pose`\
  \ 在手臂旋转方面的差异约为 45 度。目前，吸附增量设置为 5 度；不过，你可以根据喜好进行更改。\n\nMetaHuman 的肘关节也有轻微的旋转，你需要将其拉直以匹配源角色；使用吸附工具可以让你获得更均匀的结果。在修正肘关节时，请务必从正面视角调整角度，以便看清操作效果。\n\
  \n调整满意后，再次点击 `Edit Pose` 按钮。这将允许你再次按下 `Play`，查看动画重定向的效果。你可以反复返回进行微调。\n\n你可能还会发现，虽然导出了正确的姿势，但动画仍会导致细微问题，特别是碰撞方面。就\
  \ DeepMotion 而言，这很容易归因于你使用了预设预览网格体，而非特定的 MetaHuman 网格体。我们将在下一章探讨如何修复这些问题。\n\n###\
  \ 总结\n\n在本节中，我们介绍了如何仅凭一个摄像头创建自己的动画。首先，我们探讨了拍摄时的主要注意事项、应避免的事项，以及可采取哪些步骤来进一步提高准确性。\n\
  \n随后，我们开始使用 DeepMotion，探索其提供的各种动画设置，包括一些人工智能功能。我们研究了使用这些功能和重新生成（reruns）的最佳实践，然后再提交最终动画。\n\
  \n基于前几章所学，我们再次将定制的动作捕捉数据重定向并应用到 MetaHuman 角色上，同时更深入地对比了 `A-Pose` 与 `T-Pose`。最后，我们介绍了针对这些姿势引发问题的有效变通方法。\n\
  \n在下一章中，我们将探讨 `Level Sequencer`（序列器）和 `Control Rig`（控制绑定），以及如何进一步优化我们的定制动作捕捉。\n"
