  ## 安装 Quixel Bridge


  MetaHuman Creator 是 Quixel 推出的一款在线应用程序。要让它运行起来，首先我们需要访问他们的网站，下载名为 Bridge 的应用程序，它允许我们启动
  MetaHuman Creator 在线应用程序。


  这听起来有点复杂，但 Bridge 应用程序的工作原理类似于一个带有你账户详细信息的资产管理工具。例如，它将启动你的个人 MetaHumans 项目，并允许你下载许多其他资产，例如
  Megascans 树木、草地、建筑等，同时记录你过去创建或下载的所有内容。


  这非常方便，因为 MetaHumans 占用大量硬盘空间，所以你可以将创作存储在云端，从而随时随地下载它们。此外，安装后，Bridge 还可以作为虚幻引擎中的插件工作，使资产管理变得更加容易。


  因此，要开始使用，请完成以下步骤：


  1.  首先，访问 Quixel 网站：`www.quixel.com`。

