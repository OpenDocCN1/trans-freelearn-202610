    # Baking Motion Capture to Control Rig


    In order to modify the animation, we must convert the motion capture data into
    keyframe data on a `Control Rig`. This process is called **baking**, and we can
    do this by simply right-clicking on the body track, choosing **Bake to Control
    Rig**, and selecting `Metahuman_ControlRig` as seen in *Figure 7.8*:


    ![Figure 7.8: Baking to the Control Rig](image/B17878_07_08.jpg)


    Figure 7.8: Baking to the Control Rig


    Once you have started the baking process, you will see the **Options for Baking**
    dialog box. Because we don''t need to reduce keys, you can keep the default settings
    and just click **Create**.


    ![Figure 7.9: Options for baking](image/B17878_07_09.jpg)


    Figure 7.9: Options for baking


    In *Figure 7.10*, you can see that the mocap animation I imported is now baked
    into the MetaHuman Control Rig and the character in the viewport is now animated.


    ![Figure 7.10: Mocap baked into MetaHuman Control Rig](image/B17878_07_10.jpg)


    Figure 7.10: Mocap baked into MetaHuman Control Rig


    Now, you can activate the play function by either hitting the `spacebar` or using
    the **Play** button at the bottom of the `Sequencer` tab.


    With the mocap animation working in the viewport, the next step is to set up a
    way to make edits to the animation. Because there is now a keyframe on every single
    frame for every bone in the MetaHuman body, attempting to make any changes to
    the current MetaHuman Rig would be practically impossible. For example, if we
    choose to go to frame **100** and change the pose on that particular frame, only
    frame **100** would be affected as all the other frames have poses based on the
    mocap data we converted earlier. Let''s see how to get around this.


    ## Adding and editing the Control Rig


    To get around our keyframes problem, we need to create another MetaHuman Control
    Rig with no keyframes, so that any keyframes that we do add will have an **additive**
    effect.


    What do we mean by additive? For example, if a rotation of a shoulder joint on
    the x-axis was 100 degrees as a result of motion capture, then using an additive
    workflow, rotating a shoulder by a further 20 degrees on the x-axis would result
    in the final rotation being 120 degrees. We get to 120 degrees because we are
    simply adding 100 + 20 degrees.


    > **Note**

    >

    > Keyframes on the additive section will not affect the original keyframes of
    the baked Control Rig. However, they do affect the end result.


    In order to gain an additive effect, we must create an **Additive** section in
    our Sequencer, as seen in *Figure 7.11*:


    ![Figure 7.11: Adding an Additive section](image/B17878_07_11.jpg)


    Figure 7.11: Adding an Additive section


    As per *Figure 7.12*, the **Additive** track is added, which is a sub-track of
    the Control Rig we just created. This is where we can address animation issues
    or add changes to the animation without affecting the original motion capture:


    ![Figure 7.12: The Additive section track](image/B17878_07_12.jpg)


    Figure 7.12: The Additive section track


    At this point, we effectively have two rigs, each with its own track: one track
    has keyframes for every bone on every frame and the other has zero keyframes.
    In the next section, we will be adding keyframes to the additive section/track
    only. Even though we are making changes to the animation as it appears in the
    viewport, we won''t be editing the original keyframes of the motion capture. In
    essence, this is a non-destructive workflow.


    > **Note**

    >

    > The use of the words section and track are synonymous in the case of adding
    an **Additive** or absolute section/track.


    To edit the **Additive** section, make sure that you have the **Additive** section
    selected in the Sequencer, which I have done in *Figure 7.13*:


    ![Figure 7.13: Adjusting the Additive control track](image/B17878_07_13.jpg)


    Figure 7.13: Adjusting the Additive control track


    You can also see that this is a problematic clip because the mocap has collision
    issues with Glenda''s left arm – it''s colliding with her body, which is most
    likely due to the source character being much leaner than the target. However,
    with the additive workflow, we can just concern ourselves with fixing the time
    frame where that becomes an issue.


    *Figure 7.13* shows us that, in frame **0099**, Glenda''s arm intersects with
    her body, so we need to fix that frame. We can do that by rotating one of the
    arm joints.


    To do this, hit the `E` key to use the **Rotate** function. Then, click on the
    drop-down arrow on the left of `Metahuman_Control Rig` in the Sequencer. In *Figure
    7.14*, you can see the drop-down list that allows me to gain access to all the
    different bones. For this issue, in particular, I want to just alter the left
    upper arm and left lower arm.


    ![Figure 7.14: Setting keyframes on the Additive track](image/B17878_07_14.jpg)


    Figure 7.14: Setting keyframes on the Additive track


    By default, as soon as you make a change, a keyframe is set. You can see the keyframe
    highlighted in *Figure 7.14* and, in the viewport next to it, you can see the
    effect of that change in the viewport. Because I have no other keyframes set in
    the additive track, the effects of that change will be apparent for the whole
    duration of the clip.


    If I wanted to just adjust to a specific time period such as 2 seconds, I would
    need to create 3 keyframes. The 1st and 3rd keyframe would be to preserve the
    original pose and the 2nd (middle) keyframe would be where the change would take
    place.


    Take a look at *Figure 7.15* and you will see how I have added extra keyframes:


    ![Figure 7.15: Adding extra keyframes to the Additive track](image/B17878_07_15.jpg)


    Figure 7.15: Adding extra keyframes to the Additive track


    The middle keyframe is where the most extreme change has been made because this
    was the problem area. As you can see in *Figure 7.15*, I have numerical control
    over the `Location`, `Rotation`, and `Scale` settings, which is what I used to
    rotate the shoulder so that the arm isn''t penetrating through the torso anymore,
    thus fixing the problem. You could use the spline for editing, as shown in the
    graph on the right of *Figure 7.15*, but I personally find it cumbersome, albeit
    useful for visualizing changes.


    There are endless possibilities when it comes to adding keyframes to fix animation
    or to add a level of creativity. You may decide to add a head turn, a blink, a
    wave, or something else you didn''t get at the motion capture stage. All this
    is now possible with the Additive selection within the Level Sequencer.


    > **Note**

    >

    > When you want to edit a particular joint, use the search option to find the
    joint. This will show just the joint you searched for, which allows you to focus
    just on that should you find the list of joints distracting.


    Now that we''ve got our character into the Level Sequencer and made some tweaks,
    the next thing we need to do is to create a camera in order for us to render out
    a movie.


    ## Adding a camera to the Level Sequencer


    The UE5 camera is a powerful tool, as it operates just like a real camera. I could
    write a whole book on the camera alone, but in the interest of completing this
    chapter, you''ll just learn about some very basic camera tips that relate specifically
    to the Level Sequencer.


    For simplicity, we are going to create a camera using the Level Sequencer. We
    also need a **Camera Cut**; this is like a master track, mainly designed for the
    use of multiple cameras, but we still need it for just one camera. The Camera
    Cut is only automatically generated when we create a camera from within the Level
    Sequencer.


    Before we can do that, first we need to create a playback range. You can do this
    by right-clicking anywhere on the timeline within the Level Sequencer, choosing
    **Set Start Time**, and then clicking where you want to start the animation. Then,
    do the same with our **Set End Time**. The difference between these two times
    is the playback; however, this range is also used for defining the range of frames
    to render at a later stage.

