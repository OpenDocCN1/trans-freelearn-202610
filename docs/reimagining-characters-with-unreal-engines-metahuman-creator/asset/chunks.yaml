    You''ll be very pleased to know that you don''t require a full understanding of
    FK or IK to work with MetaHumans, particularly when it comes to working with motion
    capture data, but an understanding does demystify some of the jargon that you
    are presented with regularly in the process.


    In the next section, let''s get started with creating our own IK Rigs.


    # Creating an IK Rig


    You may be asking, why do we need to create an IK Rig if MetaHumans already have
    one? Considering that our goal is to retarget an animation designed for one character
    (as the source) and apply it to our MetaHuman character (as the target), we need
    to make sure that the rigs have the correct naming conventions. For example, we
    need to ensure the left arm of the source matches the left arm of the target;
    some rigs will refer to `shoulder` as `clavicle`, so we need to ensure the naming
    convention is the same for both rigs.


    So, we are effectively going to create a new IK Rig that translates information
    from the source and to the target. This will become much more visually apparent
    as we progress with the chapter and deal with IK chains. The reason we are doing
    this is that the naming conventions for the source rig could be different from
    the target rig, so the IK Rig we are going to create for each is effectively just
    a simple set of instructions to make the translation easier. It also adds the
    extra benefit of keeping us from editing the original IK Rig of the character.


    So, let''s create an IK rig for our source:


    1. If you remember from the last chapter, we acquired a character from `Third
    Person Template`. So, inside the `Blueprint` folder, then inside the `Third Person
    Template` folder, right-click anywhere within that folder and choose `Animation`.


    2. Once you have selected `IK Rig`, it will ask you to pick a `Skeletal Mesh`
    option. At this point, we want to pick the skeleton related to our source character.
    For this, we want to choose `SK_Mannequin`, which you can see in Figure 4.7:


    ![Figure 4.7: Choosing the source skeletal mesh](image/B17878_04.07.jpg)


    Once you''ve done that, it will create the IK Rig inside the same Blueprint folder
    you''ve been working from, as demonstrated in Figure 4.8. Make a note that I have
    clearly labeled this IK Rig `SOURCE_Mannequin`; this will help us when looking
    for it later and is also just good practice.


    ![Figure 4.8: IK Rig inside the source folder](image/B17878_04.08.jpg)


    With the source IK Rig created, our next step is to create the target IK Rig.


    1. For this, we need to go to our MetaHuman''s folder and repeat the same steps
    that we just completed. So, right-click anywhere within the folder, choose `Animation`,
    and select `IK Rig` again:


    ![Figure 4.9: Creating a target IK Rig](image/B17878_04.09.jpg)


    2. Now, we need to choose a skeletal mesh for our target. In this case, I''m choosing
    the `f_med_ovw_body` mesh, which corresponds to Glenda being a female character
    of medium height and overweight (where `f` stands for `female`, `med` stands for
    `medium`, and `ovw` stands for `overweight`). It''s important to choose the correct
    one, as not doing so will cause issues later.


    > **Note**

    >

    > As another example, you may have a character that is male, short, and underweight;
    in this case, the correct character mesh would be `m_srt_unw_body`.


    ![Figure 4.10: Picking the correct skeletal mesh for the target IK Rig](image/B17878_04.10.jpg)


    As before, once we''ve selected the skeletal mesh, we now have a new IK Rig in
    our character folder (mine is called Glenda). Take note again that I took the
    time to label this `TARGET`, as seen in Figure 4.11:


    ![Figure 4.11: Target Rig created inside the character folder](image/B17878_04.11.jpg)


    Now, we will open both IK Rigs, and from here on, we will try to keep both rigs
    side by side. In Figure 4.12, I have arranged the two IK Rig windows, the source
    and target, respectively, so that the interfaces are as close as possible. I highly
    recommend that you do the same, as it will help you reduce the chances of making
    mistakes, but it also gives you a visual representation of exactly what is happening.


    ![Figure 4.12: A side-by-side comparison of both the source and target IK Rigs](image/B17878_04.12.jpg)


    Splitting the screen is good practice, as it allows us to easily visualize how
    the source and target correspond to each other in relation to our changes. I have
    labeled key parts of the interface that you need to pay attention to:


    1. We have positioned the source IK Rig interface on the left-hand side of the
    screen and the target IK Rig interface on the right-hand side of the screen. This
    arrangement works as a visual aid to help us make comparisons quickly.

    2. The `IK Retargeting` tab is active. We need to ensure this tab is selected
    for both the source and target, as that is where we will be doing most of our
    editing.

    3. We have the option to click the `+Add New Chain` button because we will be
    simply adding IK chains and labeling them appropriately in both interfaces.


    Under the IK Rig name in each IK Rig, on the left in each window, you''ll see
    that the skeletal hierarchy is written out as a list. You''ll also notice that
    the lists aren''t identical. For example, the source IK Rig has a skeleton with
    three spines, whereas the target IK Rig, which is more complex, has five spines.


    You''ll also notice that both skeletons have a `root` at the very top of each
    of their hierarchies. For 3D characters, it is quite common for skeletons to have
    a `root` at the top of the hierarchy but in many cases, 3D characters use the
    pelvis as the top of the hierarchy. For Unreal and MetaHumans, we take the pelvis
    as the top of the hierarchy, so we''ll need to do a little editing.


    To do this, see the following:


    1. Select `pelvis`, right-click on it, and locate the `Set Retargeted Root` option,
    as seen in Figure 4.13. Resting your cursor over this option, you''ll notice a
    prompt saying **Set the Root Bone used for Retargeting. Usually ''Pelvis''.**


    ![Figure 4.13: Setting the root on the source skeleton](image/B17878_04.13.jpg)


    From this, you''ll gather that, in most cases, the pelvis is set as the root,
    so in this case, I have selected `pelvis` as the root by clicking `Set Retarget
    Root`.


    1. Next, you''ll need to do the same for the target. In my case, it''s `TARGET_Glenda`.
    Again, as prompted by Engine, we are told that the `root` bone is usually the
    pelvis, so we''ll set the target to root to `pelvis` in both the source and target
    IK Rigs, as seen in Figure 4.14:


    ![Figure 4.14: Choosing the pelvis as the root in the target IK Rig](image/B17878_04.14.jpg)


    > **Note**

    >

    > Some character rigs use a separate bone as `root` rather than the pelvis, so
    any issues with animation usually have to do with `root` being changed to either
    `pelvis` or `root`.


    At this point, you''ve created two IK Rigs, one for the source and one for the
    target, and applied some very minor editing to both. Now, we''ll need to make
    sure that each limb in both the source and target corresponds to each other effectively.
    To do that, we need to take a look at IK chains.


    # Creating the IK chains

