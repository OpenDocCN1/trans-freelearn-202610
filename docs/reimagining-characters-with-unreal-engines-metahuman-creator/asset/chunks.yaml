    In Figure 8.9, you can see that Live Link has automatically picked up a signal.
    It recognizes that the type of signal is `Apple AR Face Tracking` and shows the
    name of the subject that the signal is coming from, in my case, `iPhone`. As it
    happens, `iPhone` is just the name that I gave to the phone after I purchased
    it. Whatever you have called your phone, that name will appear under the subject
    name.


    Also in Figure 8.9, next to where it says `iPhone`, you’ll see that under `Role`
    it says `Basic` and to the right of that is a yellow dot. This dot indicates the
    status of the signal, which can be interpreted as follows:


    * If the dot is red, it means there is no data coming in, which could be caused
    by improper configurations such as the Live Link Face app being closed or the
    phone being off

    * The yellow dot indicates that both applications are pinging each other but no
    active ARKit data exists

    * A green dot indicates that there is ARKit data coming into Unreal Engine from
    the Live Link Face app


    Knowing that both apps are effectively speaking to each other means that we can
    go on to the next step and configure our MetaHuman to receive data.


    # Configuring and testing the MetaHuman Blueprint


    We must now tell the MetaHuman Blueprint to receive data from Live Link. As it
    happens, this is very simple:


    1. Open up the MetaHumans Blueprint from within your `Content` folder.


    2. In the `Components` tab on the left-hand side, click on the top of the hierarchy
    where it says `BP_ (your MetaHuman Name)`. In my case it is `BP_Glenda`. This
    will let you see the settings you need to edit in the `Details` panel, as per
    Figure 8.10:


    ![Figure 8.10: Creating a Level Sequencer](image/B17878_01_10.jpg)


    Figure 8.10: Creating a Level Sequencer


    1. Go to the `Llink Face Subject` drop-down list and select the name of your phone.
    Again, in my case, it’s just called `iPhone` but your phone may have a more specific
    name.


    2. Also, tick the `Llink Face Head` option, which enables head movement data to
    be accepted by the Blueprint.


    ![Figure 8.11: Enabling the Llink Face Head option](image/B17878_01_11.jpg)


    Figure 8.11: Enabling the Llink Face Head option


    Next, click on `Face` within the `Components` tab. Then, in the `Details` panel,
    go to `Animation`, as seen in Figure 8.12:


    ![Figure 8.12: Changing Animation Mode and Anim Class](image/B17878_01_12.jpg)


    Figure 8.12: Changing Animation Mode and Anim Class


    1. Here, ensure that `Disable Post Process Blueprint` remains in its default ticked
    position. If the box isn’t ticked, please tick it.


    2. Then, change `Animation Mode` to `Use Animation Blueprint` and change `Anim
    Class` to `Face_AnimpBP_C`.


    3. Now, be sure to hit `Compile` and then save the Blueprint otherwise these changes
    won’t take effect.


    With these changes made to the blueprint, it’s time to test the mocap data as
    it streams from the Live Link Face app and into your MetaHuman Blueprint. Before
    testing, make sure you go through the following checklist:


    * The IP address is correct in the app

    * Live Link is enabled and open

    * The MetaHuman Blueprint is receiving the iPhone signal, next to `LLink Face
    Subj` in the `Default` parameter within the `Details` panel

    * The MetaHuman Face Blueprint is set to `Use Animation Blueprint` for `Mode`
    and `Face_AnimpBP_C` for `Anim Class` as per Figure 8.12


    If you have followed the checklist, the next thing you need to do is to run a
    simulation by hitting `Alt` + `P`. At this point, you should see a live facial
    capture of your character in the viewport.


    If you have continued on from the previous chapter and have the Level Sequencer
    open, you will see the new facial animation on top of your character’s body as
    acquired through DeepMotion Animation 3D. Note that you can even play the body
    animation from the Level Sequencer while previewing the Live Facial capture simultaneously.


    It won’t take long to realize that the iPhone motion capture result is not perfect.
    However, it is a very powerful and complex tool with plenty of scope to refine
    the data as it comes in and refine it again after the data has been recorded.


    > **Note**

    >

    > If you are experiencing problems with the facial animation, such as the head
    rotation working and nothing else, there was a known bug that was fixed with an
    update of Quixel Bridge. If you are running Unreal Engine 5.0.3 or above, ensure
    that you have updated the Quixel Bridge plugin to version 5.0.0 or above. You
    will then need to re-download and re-import your character.


    In the next section, we will look at calibrating the Live Link Face app to get
    us a better result.


    # Calibrating and capturing live data


    To get a better result, the ARKit capturing process needs to acquire data that
    takes the performer’s characteristics into account. As you can see from Figure
    8.13, the app has done a good job of capturing the performer’s facial proportions,
    clearly outlining the eyes, nose, mouth, and jaw. However, giving the app a baseline
    of information (such as a neutral pose) would really help to refine the overall
    outcome.


    ![Figure 8.13: Calibrating the Live Link Face app](image/B17878_01_13.jpg)


    Figure 8.13: Calibrating the Live Link Face app


    To understand how and why baselines and neutral poses work, let’s take a look
    at the eyebrows as an example using an arbitrary unit of measurement. If in the
    resting or neutral position the eyebrows are at 0 and a frown is at –10, and a
    surprised expression raises the eyebrows to +15, then knowing what the neutral
    pose is would give the app a better idea of where to determine the frown or surprised
    expressions to coincide with its tracking capability.


    The calibration process in the Live Link Face app is incredibly simple as it relies
    only on a neutral expression. In Figure 8.13, I’ve highlighted the face icon on
    the right of the record button – click on the face icon, hit `Recalibrate`, and
    a short countdown will commence before taking a picture of your neutral pose for
    calibration.


    Once calibrated, it’s time to prepare for capturing a facial performance. For
    this, there are three main considerations:

