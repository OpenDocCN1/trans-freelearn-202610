    ## 将面部捕捉烘焙到控制绑定


    承接上一章（我们在其中使用 iPhone 添加了面部动作捕捉），我们将把烘焙动画关键帧的过程应用到 Faceware Studio 捕捉中。


    类似于我们将动作捕捉数据烘焙到身体控制绑定的方式，我们将对面部绑定执行相同操作，然后创建一个加性片段以进行动画调整：


    1.  选中 `Face`，右键单击并选择 `Bake to Control Rig`（烘焙到控制绑定），随后选择 `Face_ControlBoard_CtrlRig`，如
    `图 9.29` 所示：


    ![Figure 9.29: Baking the facial capture Animation Asset to the control rig](img/B17878_09_29.jpg)


    图 9.29：将面部捕捉动画资产烘焙到控制绑定


    烘焙到控制绑定后，我们应该看到轨道外观类似于 `图 9.30`：


    ![Figure 9.30: The mocap data baked into the control rig](img/B17878_09_30.jpg)


    图 9.30：烘焙进控制绑定的动捕数据


    1.  为安全起见，我们要锁定烘焙后的轨道，以免无意中对其进行编辑。方法是右键单击轨道并选择 `Locked`（锁定），如 `图 9.31` 所示：


    ![Figure 9.31: Locking the baked track](img/B17878_09_31.jpg)


    图 9.31：锁定烘焙后的轨道


    1.  控制绑定轨道锁定后，我们可以创建一个加性轨道用于添加额外动画。它实际上是一个不带任何关键帧的副本轨道。为此，点击 `Face_CcontrolBoard_CtrlRig`
    旁边的 `+ Section`（+ 片段）并选择 `Additive`（加性），如 `图 9.32` 所示。


    ![Figure 9.32: Creating an additive section](img/B17878_09_32.jpg)


    图 9.32：创建加性片段


    1.  创建加性轨道后，下一步是向其中添加关键帧。但在此之前，你可能想再次确认原始动作捕捉轨道是否已锁定。如果已锁定，如 `图 9.33` 所示，它周围会有红色边框。


    ![Figure 9.33: Locked track and new track](img/B17878_09_33.jpg)


    图 9.33：锁定的轨道和新轨道


    另请注意，新加性轨道中所有控制器旁边都没有关键帧。这正是我们想要的。


    现在让我们看看如何编辑面部。在 `Take Recorder`（录制采集）会话期间，以及在 `Level Sequencer`（关卡序列器）中播放动捕回放后，我注意到右眼偶尔会不同步眨眼或自行随机眨眼。这不是我写这本书的生理反应，而极有可能是因为录制时我戴着眼镜。


    要微调此问题，你可以在 Sequencer 中搜索简单的内容，例如 `eye blink`（眨眼）。这将列出与该运动相关的参数列表：


    ![Figure 9.34: Picking a controller to edit](img/B17878_09_34.jpg)


    图 9.34：选择要编辑的控制器


    使用 `Unreal MetaHuman 控制器`，我只需设置几个关键帧即可修复眼部问题。从 `图 9.35` 可以看出，我在动捕正确的位置设置了第一个关键帧，在动捕再次正确的位置设置了第三个关键帧，并在它们之间设置了第二个关键帧以修正有问题的帧。


    ![Figure 9.35: Making slight adjustments to Animation Controllers](img/B17878_09_35.jpg)


    图 9.35：对动画控制器进行细微调整


    如果我们只创建第二个关键帧，它会影响相关轨道上的所有动画。我们创建第一和第三个关键帧，是为了保护第一和第三个关键帧动画范围之外的动画。


    我们只是触及了使用 `Level Sequencer` 编辑动作捕捉数据的表面。从我给出的示例来看，我只是使用加性片段修复了一个问题。这是一个非常值得掌握的功能，特别是在动作捕捉会话方面。原因在于，你将知道何时动捕会话质量足够好，以及后期调整动画是否划算，抑或继续拍摄以获得更好的采集。除了微调，你还可以使用本节描述的技术对动画进行彻底更改。


    ## 总结


    在本章中，我们探讨了用于 `Unreal` 中 `MetaHumans` 的 `Faceware` 面部动作捕捉解决方案。本章涵盖的大部分内容与 iPhone
    解决方案相似，但额外具备使用简单网络摄像头的优势，我们还研究了如何在 `Unreal` 接收数据之前对其进行微调。


    此外，我们有时间复习了关于 `Take Recorder` 所学的内容，并学习了如何将面部动作捕捉数据烘焙到控制绑定中，这与我们烘焙来自 `DeepMotion`
    的身体动作捕捉数据的方式类似。最后，我们发掘了将加性功能与 `MetaHumans` 众多的面部动画控制器结合使用以修复问题的威力。


    在下一章中，我们将在此知识基础上，探讨如何在 `Level Sequencer` 中合并多个采集，并探索更多渲染视频的方法。


    # 第 10 章：使用关卡序列器混合动画与高级渲染


    在前几章中，你已掌握多种面部动作捕捉方法，无论是使用 iPhone 还是配合 `Faceware` 的网络摄像头。你还学会了如何使用 `DeepMotion`
    获取自定义身体动作捕捉。贯穿这一切的共同主线是 `Level Sequencer`。


    在本章中，我们将回到 `Level Sequencer` 来管理我们的动捕动画数据。你将学习如何管理身体动作捕捉和面部动作捕捉，修复时序问题，并合并采集。


    此外，我们将介绍一些更高级的行业标准渲染技术，并探索可与 `Level Sequencer` 配合使用的其他项目。


    因此，在本章中，我们将涵盖以下主题：


    *   将 `MetaHuman 蓝图` 和身体动捕数据添加到 `Level Sequencer`

    *   将面部动捕数据添加到 `Level Sequencer`

    *   探索高级渲染功能


    ## 技术要求


    就计算机性能而言，你需要 *第 1 章* 中详述的技术要求，以及我们在 *第 2 章* 中导入到 `UE5` 的 `MetaHuman` 和 `Unreal
    Engine Mannequin`（虚幻引擎模型人）。


    如果你一直跟随所有章节操作，你还将拥有来自 *第 5 章* 和 *第 6 章* 的 `Mixamo` 和 `DeepMotion` 数据。我们将在此处使用这些数据。


    ## 将 MetaHuman 蓝图和身体动捕数据添加到关卡序列器


    在本节中，你将再次将 `MetaHuman` 添加到 `Level Sequencer`，以便将身体捕捉数据和面部捕捉数据应用到它身上。


    ### 添加 MetaHuman 蓝图


    首先，在内容浏览器的任意位置右键单击，在菜单中找到 `Animation`（动画），然后单击 `Level Sequencer`，创建一个新的 `Level
    Sequencer`。


    创建新的 `Level Sequencer` 后，点击 `+Track`（+ 轨道）并添加你的 `MetaHuman 蓝图`，如 `图 10.1` 所示（如果看不到，请使用搜索功能并输入
    `BP` 以查找 Blueprint）：


    ![Figure 10.1: Adding the Blueprint to the Level Sequencer](img/B17878_10_01.jpg)


    图 10.1：将蓝图添加到关卡序列器


    一旦你的 `MetaHuman 蓝图` 进入序列，你会注意到 `Body`（身体）和 `Face`（面部）控制绑定都已存在，这是将 `MetaHuman 蓝图`
    添加到 `Level Sequencer` 时的标准配置：


    ![Figure 10.2: The Body and Face control rigs](img/B17878_10_02.jpg)


    图 10.2：身体和面部控制绑定


    暂时我们不需要控制绑定，因为我们只是在学习如何管理动画数据，这将在下一节中添加。因此，删除 `图 10.2` 中 `Level Sequencer` 里高亮显示的两个绑定。


    `Level Sequencer` 保持打开状态，我们现在准备添加身体动捕数据。


