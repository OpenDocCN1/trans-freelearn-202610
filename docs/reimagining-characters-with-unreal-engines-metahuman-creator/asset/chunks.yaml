- raw: "*   **Skin**: The default setting is **With Skin**; this means that when you\
    \ download the file, it will contain your original mesh along with the Mixamo\
    \ Rig and the animation all within the FBX file format. If you have multiple animations\
    \ for your character, you only need to include the skin on the first animation\
    \ you download. Choosing **Without Skin** will contain the animation data only.\n\
    \nNote\n\nThe first time that you download your animation, keep all of the default\
    \ settings. However, once you’ve downloaded the first animation with **Skin**\
    \ intact, you don’t need the skin for any subsequent animation downloads for the\
    \ same character.\n\n*   **Frames per Second**: The options are **24**, **30**,\
    \ and **60** fps. Higher frame rates are good if you wish to edit the timing of\
    \ your animation within Unreal Engine, particularly if you want to slow it down.\
    \ Most motion capture is captured at a higher frame rate, allowing for retiming\
    \ of the motion. It is better to have that higher frame rate than to attempt to\
    \ interpolate slow motion in Unreal synthetically in an advanced workflow. A lower\
    \ frame rate would be good if you are taking in really long animations and running\
    \ them on a substandard machine.\n\n*   **Keyframe Reduction**: This is best left\
    \ alone. The data size of these files and Unreal’s ability to read them don’t\
    \ require keyframe reduction or optimization. Without keyframe reduction, Mixamo\
    \ bakes a keyframe for each joint rotation on every frame. With keyframe reduction,\
    \ Mixamo adds a little math in order to reduce the data size and this can reduce\
    \ the quality of the animation. It’s best for Unreal Engine to get that data to\
    \ work. If there is any keyframe reduction required in Unreal, there are plenty\
    \ of tools within Unreal to give you better and controllable results.\n\nAfter\
    \ clicking **DOWNLOAD**, Mixamo will ask you where you want to download your new\
    \ FBX file; choose somewhere you will remember, ideally somewhere inside your\
    \ project folder, as this will allow you to skip the following step.\n\nIf you\
    \ save it directly to somewhere within your project **Content** folder and you\
    \ have Unreal running, you will get a prompt as per *Figure 5**.18* (which you\
    \ will see in a moment) to allow the import to take place.\n\nHowever, let’s assume\
    \ it’s saved somewhere else so we can now take a look at manually importing your\
    \ animation in the next step.\n\n# Importing the Mixamo animation into Unreal\n\
    \nIf you’ve downloaded your FBX to some arbitrary location, you will need to import\
    \ it into Unreal from the same location. To do that, first, create a new folder\
    \ inside your Unreal Project and call it **MIXAMO\\_ANIMATIONS**. Double-click\
    \ the folder so that you are inside it and then right-click to see the following\
    \ menu:\n\n![Figure 5.17: Importing FBX animation ](image/B17878_05_17.jpg) \n\
    \nFigure 5.17: Importing FBX animation\n\nTo import the animation and the Mixamo\
    \ Rig, choose **Import to**, along with the folder you are about to import the\
    \ asset into. You can see from the highlighted text in *Figure 5**.17* that I\
    \ am importing the asset into **Game/MIXAMO\\_ANIMATIONS**.\n\nOnce selected,\
    \ it will bring up **FBX Import Options**, as shown in *Figure 5**.18*:\n\n![Figure\
    \ 5.18: FBX Import Options ](image/B17878_05_18.jpg) \n\nFigure 5.18: FBX Import\
    \ Options\n\nIn *Figure 5**.18*, you can see that there is a wealth of options\
    \ to edit. Ultimately, the **FBX Import Options** dialog box allows us to import\
    \ the Mixamo Rig, the Mixamo animation, the geometry of our MetaHuman character,\
    \ and the skin weights associated with it. Importing all these components into\
    \ Engine is essential for us to retarget the animation onto our MetaHuman character\
    \ correctly.\n\nHowever, if you’ve followed all the previous steps mentioned in\
    \ this chapter, you’ll find there’s very little to do here. The default settings\
    \ will be enough, with the exception of the following two:\n\n*   **Mesh Skeleton**:\
    \ You need to choose what skeleton you want to use the Mixamo Rig on. Unfortunately,\
    \ we can’t use the MetaHuman skeleton with the Mixamo Rig directly, as it’s far\
    \ too complex; instead, we will use the next best thing, **SK\\_Mannequin**, which\
    \ will be available once you click on the drop-down list, as shown in *Figure\
    \ 5**.18*.\n\n*   **Import Animations**: It may seem a little obvious, but yes,\
    \ we need to make sure that this **Import Animations** box is checked so that\
    \ we can import the animation that has been embedded within the FBX file.\n\n\
    Note\n\nIf you have already gone through this process of downloading the Mixamo\
    \ Rig, skin weights, and animation, you will see that your Mixamo Rig is now an\
    \ option to choose from **FBX Import Options** instead of **SK\\_Mannequin**.\n\
    \nOnce you have ensured you’ve selected the correct **Mesh Skeleton** and checked\
    \ **Import Animations**, click on **Import All**. This will take a few minutes\
    \ to load into your project. Once imported, you will find that you now have newly\
    \ imported assets, looking similar to *Figure 5**.19*:\n\n![Figure 5.19: Imported\
    \ assets ](image/B17878_05_19.jpg) \n\nFigure 5.19: Imported assets\n\nAt this\
    \ point, we’ve just successfully brought in the Mixamo animation, along with a\
    \ rig that has all the skin weights enabled to properly manipulate the MetaHuman\
    \ body mesh. From *Figure 5**.19*, you can see those assets; from left to right,\
    \ we have the following:\n\n*   **Fbx\\_Default\\_Material\\_0**: This is the\
    \ default material as exported from Mixamo. As we’re only interested in animation\
    \ from Mixamo, we can ignore this.\n\n*   **Macarena\\_Dance**: This is the Mixamo\
    \ Rig that has the skin weights that we need.\n\n*   **Macarena\\_Dance\\_Anim**:\
    \ This is the actual keyframe data of each of the joints.\n\n*   **Macarena\\\
    _Dance\\_PhysicsAsset**: This was created automatically by Unreal during the import\
    \ process, containing physics simulations that are beyond the scope of this book.\n\
    \nNote\n\nTo learn more about **PhysicsAsset** in UE, you can review the following\
    \ link: [https://docs.unrealengine.com/5.0/en-US/physics-asset-editor-in-unreal-engine/](https://docs.unrealengine.com/5.0/en-US/physics-asset-editor-in-unreal-engine/)[](https://docs.unrealengine.com/5.0/en-US/physics-asset-editor-in-unreal-engine/%20)\n\
    \nCurrently, we have a Mixamo Rig but no skeleton, and because of this, we can’t\
    \ apply the Mixamo animation to our MetaHuman Blueprint. So, just like in [*Chapter\
    \ 4*](#B17878_04.xhtml#_idTextAnchor059), we need to use two IK Rigs so that we\
    \ can repurpose the Unreal **SK\\_Mannequinn** and retarget animation from it\
    \ to the MetaHuman. While it may be familiar to you, I’ve outlined the process\
    \ again for our new Mixamo assets:\n\n1.  In the new **Mixamo\\_Animations** folder,\
    \ create a new IK Rig and call it **Source\\_RigMixamo**. Then, create another\
    \ IK Rig and call it **Target\\_RigMeta**.\n\nAs a reminder on how to do this,\
    \ look at *Figure 5**.20*; you can see that when you right-click anywhere within\
    \ the **Content** tab, you can choose **Animation** and then select **IK Rig**\
    \ from the list:\n\n![Figure 5.20: Creating an IK Rig ](image/B17878_05_20.jpg)\
    \ \n\nFigure 5.20: Creating an IK Rig\n\n1.  With both IK Rigs created, the next\
    \ step is to create five IK chains for each and ensure that the following chain\
    \ order is completed: \n\n    *   The spine to the head\n\n    *   The left clavicle\
    \ to the left hand\n\n    *   The right clavicle to the right hand\n\n    *  \
    \ The left thigh to the left foot\n\n    *   The right thigh to the right foot\n\
    \n2.  Using the IK Rigs, we need to use **SK\\_Mannequin** as the skeleton for\
    \ the source and leave the **Glenda\\_Med\\_Ovw** skeleton as the target.\n\n\
    Just like in the previous chapter, I recommend opening up both the source and\
    \ target IK Rigs and putting them side by side, as shown in *Figure 5**.21*. This\
    \ way, you can ensure that you are getting them to match as much as possible in\
    \ terms of the IK chains and the order in which the IK chains are created.\n\n\
    ![Figure 5.21: IK Rigs side by side ](image/B17878_05_21.jpg) \n\nFigure 5.21:\
    \ IK Rigs side by side"
  fmt: "\n## Mixamo Export Settings\n\n### Skin\nThe default setting is `With Skin`;\
    \ this means that when you download the file, it will contain your original mesh\
    \ along with the Mixamo Rig and the animation all within the FBX file format.\
    \ If you have multiple animations for your character, you only need to include\
    \ the skin on the first animation you download. Choosing `Without Skin` will contain\
    \ the animation data only.\n\n> **Note**\n>\n> The first time that you download\
    \ your animation, keep all of the default settings. However, once you’ve downloaded\
    \ the first animation with `Skin` intact, you don’t need the skin for any subsequent\
    \ animation downloads for the same character.\n\n### Frames per Second\nThe options\
    \ are `24`, `30`, and `60` fps. Higher frame rates are good if you wish to edit\
    \ the timing of your animation within Unreal Engine, particularly if you want\
    \ to slow it down. Most motion capture is captured at a higher frame rate, allowing\
    \ for retiming of the motion. It is better to have that higher frame rate than\
    \ to attempt to interpolate slow motion in Unreal synthetically in an advanced\
    \ workflow. A lower frame rate would be good if you are taking in really long\
    \ animations and running them on a substandard machine.\n\n### Keyframe Reduction\n\
    This is best left alone. The data size of these files and Unreal’s ability to\
    \ read them don’t require keyframe reduction or optimization. Without keyframe\
    \ reduction, Mixamo bakes a keyframe for each joint rotation on every frame. With\
    \ keyframe reduction, Mixamo adds a little math in order to reduce the data size\
    \ and this can reduce the quality of the animation. It’s best for Unreal Engine\
    \ to get that data to work. If there is any keyframe reduction required in Unreal,\
    \ there are plenty of tools within Unreal to give you better and controllable\
    \ results.\n\n## Downloading the Animation\nAfter clicking `DOWNLOAD`, Mixamo\
    \ will ask you where you want to download your new FBX file; choose somewhere\
    \ you will remember, ideally somewhere inside your project folder, as this will\
    \ allow you to skip the following step.\n\nIf you save it directly to somewhere\
    \ within your project `Content` folder and you have Unreal running, you will get\
    \ a prompt as per Figure 5.18 (which you will see in a moment) to allow the import\
    \ to take place.\n\nHowever, let’s assume it’s saved somewhere else so we can\
    \ now take a look at manually importing your animation in the next step.\n\n#\
    \ Importing the Mixamo Animation into Unreal\n\n### Preparing the Import Folder\n\
    If you’ve downloaded your FBX to some arbitrary location, you will need to import\
    \ it into Unreal from the same location. To do that, first, create a new folder\
    \ inside your Unreal Project and call it `MIXAMO_ANIMATIONS`. Double-click the\
    \ folder so that you are inside it and then right-click to see the following menu:\n\
    \n![Figure 5.17: Importing FBX animation](image/B17878_05_17.jpg)\n\nFigure 5.17:\
    \ Importing FBX animation\n\nTo import the animation and the Mixamo Rig, choose\
    \ `Import to`, along with the folder you are about to import the asset into. You\
    \ can see from the highlighted text in Figure 5.17 that I am importing the asset\
    \ into `Game/MIXAMO_ANIMATIONS`.\n\n### FBX Import Options\nOnce selected, it\
    \ will bring up `FBX Import Options`, as shown in Figure 5.18:\n\n![Figure 5.18:\
    \ FBX Import Options](image/B17878_05_18.jpg)\n\nFigure 5.18: FBX Import Options\n\
    \nIn Figure 5.18, you can see that there is a wealth of options to edit. Ultimately,\
    \ the `FBX Import Options` dialog box allows us to import the Mixamo Rig, the\
    \ Mixamo animation, the geometry of our MetaHuman character, and the skin weights\
    \ associated with it. Importing all these components into Engine is essential\
    \ for us to retarget the animation onto our MetaHuman character correctly.\n\n\
    However, if you’ve followed all the previous steps mentioned in this chapter,\
    \ you’ll find there’s very little to do here. The default settings will be enough,\
    \ with the exception of the following two:\n\n*   **Mesh Skeleton**: You need\
    \ to choose what skeleton you want to use the Mixamo Rig on. Unfortunately, we\
    \ can’t use the MetaHuman skeleton with the Mixamo Rig directly, as it’s far too\
    \ complex; instead, we will use the next best thing, `SK_Mannequin`, which will\
    \ be available once you click on the drop-down list, as shown in Figure 5.18.\n\
    *   **Import Animations**: It may seem a little obvious, but yes, we need to make\
    \ sure that this `Import Animations` box is checked so that we can import the\
    \ animation that has been embedded within the FBX file.\n\n> **Note**\n>\n> If\
    \ you have already gone through this process of downloading the Mixamo Rig, skin\
    \ weights, and animation, you will see that your Mixamo Rig is now an option to\
    \ choose from `FBX Import Options` instead of `SK_Mannequin`.\n\n### Configuring\
    \ Import Settings\nOnce you have ensured you’ve selected the correct `Mesh Skeleton`\
    \ and checked `Import Animations`, click on `Import All`. This will take a few\
    \ minutes to load into your project. Once imported, you will find that you now\
    \ have newly imported assets, looking similar to Figure 5.19:\n\n![Figure 5.19:\
    \ Imported assets](image/B17878_05_19.jpg)\n\nFigure 5.19: Imported assets\n\n\
    ### Imported Assets\nAt this point, we’ve just successfully brought in the Mixamo\
    \ animation, along with a rig that has all the skin weights enabled to properly\
    \ manipulate the MetaHuman body mesh. From Figure 5.19, you can see those assets;\
    \ from left to right, we have the following:\n\n*   `Fbx_Default_Material_0`:\
    \ This is the default material as exported from Mixamo. As we’re only interested\
    \ in animation from Mixamo, we can ignore this.\n*   `Macarena_Dance`: This is\
    \ the Mixamo Rig that has the skin weights that we need.\n*   `Macarena_Dance_Anim`:\
    \ This is the actual keyframe data of each of the joints.\n*   `Macarena_Dance_PhysicsAsset`:\
    \ This was created automatically by Unreal during the import process, containing\
    \ physics simulations that are beyond the scope of this book.\n\n> **Note**\n\
    >\n> To learn more about `PhysicsAsset` in UE, you can review the following link:\
    \ [PhysicsAsset documentation](`https://docs.unrealengine.com/5.0/en-US/physics-asset-editor-in-unreal-engine/`).\n\
    \n### Setting Up IK Rigs for Retargeting\nCurrently, we have a Mixamo Rig but\
    \ no skeleton, and because of this, we can’t apply the Mixamo animation to our\
    \ MetaHuman Blueprint. So, just like in [Chapter 4](#B17878_04.xhtml#_idTextAnchor059),\
    \ we need to use two IK Rigs so that we can repurpose the Unreal `SK_Mannequinn`\
    \ and retarget animation from it to the MetaHuman. While it may be familiar to\
    \ you, I’ve outlined the process again for our new Mixamo assets:\n\n#### Creating\
    \ IK Rigs\n1.  In the new `Mixamo_Animations` folder, create a new IK Rig and\
    \ call it `Source_RigMixamo`. Then, create another IK Rig and call it `Target_RigMeta`.\n\
    \nAs a reminder on how to do this, look at Figure 5.20; you can see that when\
    \ you right-click anywhere within the `Content` tab, you can choose `Animation`\
    \ and then select `IK Rig` from the list:\n\n![Figure 5.20: Creating an IK Rig](image/B17878_05_20.jpg)\n\
    \nFigure 5.20: Creating an IK Rig\n\n#### Defining IK Chains\n2.  With both IK\
    \ Rigs created, the next step is to create five IK chains for each and ensure\
    \ that the following chain order is completed:\n    *   The spine to the head\n\
    \    *   The left clavicle to the left hand\n    *   The right clavicle to the\
    \ right hand\n    *   The left thigh to the left foot\n    *   The right thigh\
    \ to the right foot\n\n#### Assigning Skeletons\n3.  Using the IK Rigs, we need\
    \ to use `SK_Mannequin` as the skeleton for the source and leave the `Glenda_Med_Ovw`\
    \ skeleton as the target.\n\nJust like in the previous chapter, I recommend opening\
    \ up both the source and target IK Rigs and putting them side by side, as shown\
    \ in Figure 5.21. This way, you can ensure that you are getting them to match\
    \ as much as possible in terms of the IK chains and the order in which the IK\
    \ chains are created.\n\n![Figure 5.21: IK Rigs side by side](image/B17878_05_21.jpg)\n\
    \nFigure 5.21: IK Rigs side by side\n"
  trans: "\n\n## Mixamo 导出设置\n\n### 皮肤\n默认设置为 `With Skin`；这意味着当你下载文件时，它将包含你的原始网格体，以及\
    \ Mixamo 骨架和动画，所有内容都在 FBX 文件格式内。如果你的角色有多个动画，你只需要在下载的第一个动画中包含皮肤。选择 `Without Skin`\
    \ 将仅包含动画数据。\n\n> **注意**\n>\n> 首次下载动画时，请保留所有默认设置。但是，一旦你下载了带有 `Skin` 的第一个动画，对于同一角色的后续动画下载，你就不再需要皮肤了。\n\
    \n### 每秒帧数\n选项有 `24`、`30` 和 `60` fps。如果你希望在 Unreal Engine 中编辑动画的时序，特别是想要将其放慢，较高的帧率会更好。大多数动作捕捉都是以较高的帧率捕获的，从而允许对动作进行重新计时。拥有较高的帧率总比尝试在高级工作流中通过合成方式在\
    \ Unreal 中插值慢动作要好。如果你要导入非常长的动画并在配置较低的机器上运行，较低的帧率会比较合适。\n\n### 关键帧缩减\n最好保持默认。这些文件的数据大小和\
    \ Unreal 读取它们的能力不需要关键帧缩减或优化。如果不进行关键帧缩减，Mixamo 会在每一帧为每个关节旋转烘焙一个关键帧。进行关键帧缩减时，Mixamo\
    \ 会增加一些数学计算以减小数据大小，但这可能会降低动画质量。最好让 Unreal Engine 获取这些数据进行处理。如果在 Unreal 中确实需要关键帧缩减，Unreal\
    \ 内部有大量工具能提供更好且可控的结果。\n\n## 下载动画\n点击 `DOWNLOAD` 后，Mixamo 会询问你想将新的 FBX 文件下载到何处；选择一个你容易记住的位置，最好是在你的项目文件夹内，这样可以省去下一步操作。\n\
    \n如果你直接将其保存到项目 `Content` 文件夹内的某个位置，且 Unreal 正在运行，你将会收到如图 5.18 所示的提示（稍后你将看到），允许导入进行。\n\
    \n不过，让我们假设它保存在别处，以便我们现在可以在下一步中查看如何手动导入动画。\n\n# 将 Mixamo 动画导入 Unreal\n\n### 准备导入文件夹\n\
    如果你将 FBX 下载到了任意位置，你需要从该位置将其导入 Unreal。为此，首先在你的 Unreal 项目中创建一个新文件夹，并将其命名为 `MIXAMO_ANIMATIONS`。双击该文件夹进入内部，然后右键点击查看以下菜单：\n\
    \n![图 5.17：导入 FBX 动画](img/B17878_05_17.jpg)\n\n图 5.17：导入 FBX 动画\n\n要导入动画和 Mixamo\
    \ 骨架，请选择 `Import to`（导入到），以及你即将导入资产的文件夹。从图 5.17 中高亮的文本可以看出，我正将资产导入到 `Game/MIXAMO_ANIMATIONS`。\n\
    \n### FBX 导入选项\n选中后，将弹出 `FBX Import Options`（FBX 导入选项），如图 5.18 所示：\n\n![图 5.18：FBX\
    \ 导入选项](img/B17878_05_18.jpg)\n\n图 5.18：FBX 导入选项\n\n在图 5.18 中，你可以看到有大量可编辑的选项。归根结底，`FBX\
    \ Import Options` 对话框允许我们导入 Mixamo 骨架、Mixamo 动画、我们的 MetaHuman 角色几何体以及与之关联的蒙皮权重。将所有这些组件导入引擎对于我们正确地将动画重定向到\
    \ MetaHuman 角色至关重要。\n\n然而，如果你遵循了本章前面提到的所有步骤，你会发现这里几乎不需要做任何操作。默认设置就足够了，除了以下两项例外：\n\
    \n*   **Mesh Skeleton（网格体骨架）**：你需要选择要在 Mixamo 骨架上使用的骨架。不幸的是，我们不能直接将 MetaHuman\
    \ 骨架与 Mixamo 骨架一起使用，因为它太复杂了；相反，我们将使用次优选择 `SK_Mannequin`，点击下拉列表后即可看到，如图 5.18 所示。\n\
    *   **Import Animations（导入动画）**：这似乎显而易见，但是的，我们需要确保勾选 `Import Animations` 复选框，以便导入嵌入在\
    \ FBX 文件中的动画。\n\n> **注意**\n>\n> 如果你已经完成了下载 Mixamo 骨架、蒙皮权重和动画的过程，你会发现你的 Mixamo\
    \ 骨架现在已成为 `FBX Import Options` 中的一个可选项，而不是 `SK_Mannequin`。\n\n### 配置导入设置\n确保选择了正确的\
    \ `Mesh Skeleton` 并勾选了 `Import Animations` 后，点击 `Import All`。这将需要几分钟时间加载到你的项目中。导入完成后，你会发现新导入的资产，外观类似于图\
    \ 5.19：\n\n![图 5.19：导入的资产](img/B17878_05_19.jpg)\n\n图 5.19：导入的资产\n\n### 导入的资产\n\
    此时，我们已成功导入 Mixamo 动画，以及一个启用了所有蒙皮权重以正确操控 MetaHuman 身体网格体的骨架。从图 5.19 可以看到这些资产；从左到右依次为：\n\
    \n*   `Fbx_Default_Material_0`：这是从 Mixamo 导出的默认材质。既然我们只对 Mixamo 的动画感兴趣，可以忽略它。\n\
    *   `Macarena_Dance`：这是包含我们所需蒙皮权重的 Mixamo 骨架。\n*   `Macarena_Dance_Anim`：这是每个关节的实际关键帧数据。\n\
    *   `Macarena_Dance_PhysicsAsset`：这是在导入过程中由 Unreal 自动创建的，包含超出本书范围的物理模拟。\n\n> **注意**\n\
    >\n> 要了解有关 UE 中 `PhysicsAsset` 的更多信息，可以查看以下链接：PhysicsAsset 文档。\n\n### 为重定向设置 IK\
    \ 骨架\n目前，我们有了 Mixamo 骨架但没有骨骼，因此无法将 Mixamo 动画应用到我们的 MetaHuman 蓝图中。就像在 第 4 章 中一样，我们需要使用两个\
    \ IK 骨架，以便重新利用 Unreal `SK_Mannequin` 并将动画从其重定向到 MetaHuman。虽然这对你可能很熟悉，但我还是为我们的新\
    \ Mixamo 资产再次概述了该流程：\n\n#### 创建 IK 骨架\n1.  在新的 `Mixamo_Animations` 文件夹中，创建一个新的\
    \ IK 骨架并将其命名为 `Source_RigMixamo`。然后，创建另一个 IK 骨架并将其命名为 `Target_RigMeta`。\n\n作为提醒，请看图\
    \ 5.20；你可以看到，当你在 `Content`（内容）标签页的任意位置右键点击时，可以选择 `Animation`（动画），然后从列表中选择 `IK\
    \ Rig`：\n\n![图 5.20：创建 IK 骨架](img/B17878_05_20.jpg)\n\n图 5.20：创建 IK 骨架\n\n####\
    \ 定义 IK 链\n2.  创建好两个 IK 骨架后，下一步是为每个骨架创建五个 IK 链，并确保完成以下链顺序：\n    *   脊柱到头部\n  \
    \  *   左锁骨到左手\n    *   右锁骨到右手\n    *   左大腿到左脚\n    *   右大腿到右脚\n\n#### 分配骨骼\n3.\
    \  使用 IK 骨架，我们需要将 `SK_Mannequin` 作为源骨骼，将 `Glenda_Med_Ovw` 骨骼作为目标骨骼。\n\n就像上一章一样，我建议同时打开源和目标\
    \ IK 骨架并将它们并排放置，如图 5.21 所示。这样，你可以确保在 IK 链和 IK 链的创建顺序方面，让它们尽可能匹配。\n\n![图 5.21：并排的\
    \ IK 骨架](img/B17878_05_21.jpg)\n\n图 5.21：并排的 IK 骨架\n\n"
