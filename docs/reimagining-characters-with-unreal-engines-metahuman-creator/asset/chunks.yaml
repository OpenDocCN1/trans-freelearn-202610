    Figure 11.23: The Mesh to MetaHuman button


    1. Once selected, you will get a `Mesh to MetaHuman` pop-up dialog box, as per
    Figure 11.24. Just click `OK`.


    ![Figure 11.24: Your MetaHuman is now available](image/B17878_11_24.jpg)


    Figure 11.24: Your MetaHuman is now available


    At this point, we can’t see the progress of the Mesh to MetaHuman plugin because
    the processing takes place in the cloud. More specifically, we need to go to the
    MetaHuman Creator online tool to see the result.


    In the next section, we will go over to Quixel Bridge, which can be accessed from
    your `Content` folder or the standalone Quixel Bridge application. We are using
    Quixel Bridge to gain access to our new MetaHuman so we can make adjustments with
    the online MetaHuman Creator.


    # Modifying the face mesh inside the MetaHuman Creator online tool


    Once you have opened up Quixel Bridge, navigate to `My MetaHumans`. There you
    will see a new black-and-white icon. As per Figure 11.25, the icon indicates that
    this MetaHuman was created with the `Mesh to MetaHuman` plugin. Click on the black-and-white
    icon and navigate to the `Start MHC` button.


    ![Figure 11.25: MetaHuman Identity icons](image/B17878_11_25.jpg)


    Figure 11.25: MetaHuman Identity icons


    You will be taken to the familiar MetaHuman Creator online application featured
    in [Chapter 2](#B17878_02.xhtml#_idTextAnchor027). As you can see in Figure 11.26,
    the MetaHuman has no skin and it is somewhat distorted. Most notably, the upper
    head protrudes unnaturally. The reason for this is that the face mesh scan that
    was created using the KIRI Engine app also scanned my hair; the MetaHuman Identity
    solver couldn’t determine what the hair actually was, resulting in skin tissue
    instead of hair.


    ![Figure 11.26: MetaHuman Creator with the face scan](image/B17878_11_26.jpg)


    Figure 11.26: MetaHuman Creator with the face scan


    There is an easy fix to the hair issue. Click on the `Custom Mesh` option under
    `Face`, as per Figure 11.27.


    ![Figure 11.27: The Custom Mesh tool](image/B17878_11_27.jpg)


    Figure 11.27: The Custom Mesh tool


    If you look at the face thumbnail on the left, it is split into various components
    that correspond to the color-coded components on my face on the right.


    Take note of the `Region Influence` slider too, which I have reduced down to 0.
    This means that the MetaHuman template determines the shape of that part of the
    mesh rather than the face mesh created by the KIRI Engine scan. When you compare
    Figure 11.26 and Figure 11.27, you can see the difference – the former has a much
    lumpier head than the latter.


    If you wish to make further edits, you can click on the `ENABLE EDITING` button
    to fine-tune the mesh. However, I urge you to first refine your scanning technique
    to get a better result and use the `ENABLE EDITING` option as a last resort.


    > **Note**

    >

    > Higher-quality photographs will get you a better result. In this example, a
    smartphone under less-than-ideal lighting conditions contributed to distortion
    issues. Using a DSLR in a small studio setup with a blank background and very
    soft light would give superior results. In addition, making use of a polarizer
    filter to further remove any reflection would be an added bonus.


    Now, let’s move on to the skin. The texture map and shader we gained from both
    the KIRI Engine scan and the subsequent import to Unreal Engine have been lost.
    This is a good thing. MetaHumans have an incredibly powerful skin shader that
    responds to lighting in Unreal Engine very realistically that we will take advantage
    of instead.


    So, click on `Skin` as shown in Figure 11.28, and then click on the `ASSIGN` button
    to assign a skin color.


    ![Figure 11.28: Assigning a skin color](image/B17878_11_28.jpg)


    Figure 11.28: Assigning a skin color


    Instantly, this will give us skin colors with all the shader attributes that come
    with MetaHumans. We now have the same level of skin control with our custom face
    scan that we had when we were first creating our MetaHuman back in [Chapter 2](#B17878_02.xhtml#_idTextAnchor027):


    ![Figure 11.29: Editing the skin](image/B17878_11_29.jpg)


    Figure 11.29: Editing the skin


    You can also see from Figure 11.29 that the default lighting gives us a somewhat
    soft lighting result. As taking photographs with KIRI Engine in soft lighting
    is preferred, using the default lighting in MetaHuman Creator would be helpful
    for matching the skin tone of our original photographs.


    To get a better sense of whether your model is working, add some hair that is
    similar to your own, as I did in Figure 11.30:


    ![Figure 11.30: Adding hair](image/B17878_11_30.jpg)


    Figure 11.30: Adding hair


    Because MetaHuman Creator constantly saves your MetaHuman automatically, you can
    come back to this at any time. You can also add your new MetaHuman with the custom
    face mesh into your project at any time using Quixel Bridge.


    You can spend a lot of time modifying your custom MetaHuman and the time that
    you should spend on this really depends on what your end goal is. If you’re looking
    for a perfect likeness, you have all the move and sculpt tools in MetaHuman Creator
    along with all the photographs used with KIRI for reference to achieve greater
    realism.


    # Summary


    In this chapter, we learned about a fantastic extra feature that can be used for
    creating characters that share a likeness with real people. We covered the process
    of downloading and installing the Mesh to MetaHuman plugin, before moving on to
    using the photogrammetry KIRI Engine. After that, we imported the KIRI Engine
    face mesh and made use of the MetaHuman Identity plugin, learning how to get a
    custom face mesh working inside MetaHuman Creator and how to refine it and fix
    issues.


    Effectively, this chapter was a bonus chapter that delved into a new tool that
    was made available during the process of writing this book. It is a very powerful
    new tool that has the potential to not only create reasonable likenesses for digital
    character doubles but also, with some extra effort, provide very realistic results
    for digital doubles.


    In addition to using 3D scans of people, you may find yourself scanning sculptures,
    or repurposing other 3D models such as fantasy characters or even toon-like characters.
    The possibilities are endless.


    And that’s the end of this book! We have covered a lot of ground here, which is
    rather an understatement when you think about the technology and innovation we
    have embraced throughout these pages.


    It was my intention, as an artist and filmmaker, to bring together a guide for
    other artists and filmmakers to follow and enjoy. Many of you will be well versed
    in CGI and animation and many will be novices at the beginning of your journey.
    Either way, you now have a step-by-step guide on how you can create your own visions,
    animations, and entertainment with technology that until recently was exclusive
    to major animation studios!


