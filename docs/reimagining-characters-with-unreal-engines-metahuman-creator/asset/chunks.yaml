  trans: '


    您可能还会注意到，`Tracking FPS` 通常与 `Video FPS` 相同。如果 `Tracking FPS` 较低，则意味着软件出现了问题；可能是其他应用程序正在运行，导致
    Faceware 资源不足。尝试关闭其他正在运行的应用程序以缓解此问题。


    **注意**


    `Tracking FPS` 和 `Video FPS` 之间的区别非常简单。`Tracking FPS` 是软件正确识别面部区域及其在画面中位置的速度，而
    `Video FPS` 仅仅是软件每秒从网络摄像头接收的帧数。


    ## 面部追踪模型


    回到 *图 9.11*，在 `Frame Rate` 下方，下一个字段是 `Face Tracking Model`。下拉菜单提供两个选项：


    *   `Stationary Camera`（固定摄像机）：适用于摄像机固定但用户头部移动的网络摄像头。

    *   `Professional Headcams`（专业头戴式摄像机）：适用于摄像机固定在头盔装置上、仅捕捉面部表情而非头部运动的专业解决方案。头戴式摄像机无法追踪颈部运动，因此如果用户点头或摇头，数据不会被记录。在这种情况下，依靠动作捕捉套装来捕捉身体运动，包括头部和颈部运动。通常，在使用专业头戴式摄像机时，身体和面部捕捉会同时进行，因为这样能产生更自然的结果。


    在我们的案例中，我们选择 `Stationary Camera`。


    ## 图像旋转


    如果您的摄像头倒置或侧放，您可以按 90 度的增量旋转视频信号来修正它。我不需要此功能，因此 `Image Rotation` 选项设置为 `0` 度。


    ## 水平翻转和垂直翻转


    同样，如果您面对的是倒置的摄像头，或者您个人偏好镜像图像，可以选择水平或垂直翻转图像。我也不会使用这些功能。


    ## 网格叠加


    这是一个有点用的工具，可确保您的面部位于画面中央。我没有启用它。


    现在，在我们转到 `STREAMING` 面板之前，请确保已有视频信号输入 Faceware，您的输入设置为 `Live`，并且您的面部正在被追踪，追踪标记随面部移动同步运动。您可以从
    *图 9.13* 的示例中看到，我的眉毛、眼睛、鼻子和嘴巴周围有橙色的追踪标记：


    ![图 9.13：追踪标记正常工作](img/B17878_09_13.jpg)


    *图 9.13：追踪标记正常工作*


    一旦您的面部被追踪，接下来您需要确保 Faceware 能够在 `STREAMING` 面板中发送数据。


    ## 流式传输面板


    切换到 `STREAMING` 面板，您将看到 *图 9.14* 中显示的以下选项：


    ![图 9.14：流式传输面板](img/B17878_09_14.jpg)


    *图 9.14：流式传输面板*


    让我们看看面板的每个部分。


    ### 流式传输到客户端


    `STREAM TO CLIENT` 中的第一个选项是 `STREAM TO CLIENT` 切换按钮本身，我已将其向右切换以开启它。实际上，该按钮只是一个开关。开启后，Faceware
    将实时流式传输动作捕捉数据到客户端。此处的客户端是 Unreal Engine，它通过 Live Link 启用以接收流式传输数据。


    请注意，如果没有实时视频信号，您将无法启用 `STREAM TO CLIENT`。


    第二个选项是 `PORT`——安装 Live Link 插件时会自动设置这些端口。在安装 Faceware 期间，Faceware 会检测可用于流式传输的端口；但请记下端口号以防万一。您应保留
    `PORT` 的默认值；在我的例子中，该值为 `802`。


    现在您已准备好开始面部追踪。将面部摆成中性姿势，不要微笑或噘嘴，然后按照 *图 9.15* 左下角所示点击 `CALIBRATE NEUTRAL POSE`
    按钮：


    ![图 9.15：校准中性姿势](img/B17878_09_15.jpg)


    *图 9.15：校准中性姿势*


    执行此操作时，请务必直视网络摄像头，并预计保持该姿势约 5-10 秒，以便 Faceware 重新校准您的面部。完成后，它将自动追踪您的面部。请看 *图 9.16*，您可以看到
    CGI 角色正在跟随我自己的头部运动和面部表情。


    ![图 9.16：动画调整面板](img/B17878_09_16.jpg)


    *图 9.16：动画调整面板*


    您还会注意到屏幕右侧的 `ANIMATION TUNING` 面板；您会看到许多水平条随您的头部移动而运动。这些都是面部追踪产生的所有 ARKit 控制器正在被驱动。我们稍后将详细介绍这一点。现在，让我们进一步了解实时设置功能。


    ### 控制架构


    `CONTROL SCHEMA` 指的是 Faceware Studio 流式传输数据所使用的命名约定。因为我们使用的是 ARKit，请确保启用 `ARKIT`。`LEGACY`
    和 `STANDARD` 虽然不错，但它们没有 ARKit 的保真度，而 ARKit 用于 MetaHuman 的设计，对于本书来说它们是多余的。


    ### 流式传输面部组


    `STREAM FACE GROUPS` 功能允许我们从流式传输中移除面部的特定部分。如果我们使用的专业头戴式摄像机不记录头部旋转，我建议在 `STREAM
    FACE GROUPS` 中禁用头部。在这种情况下，我们将使用身体动作捕捉解决方案来捕捉头部旋转。


    在我们的示例中，假设我们要记录头部旋转和所有面部运动。为此，在 `STREAM FACE GROUPS` 下，确保启用 `ALL`。但是，如果您只想捕捉一个面部组，例如只想移动眉毛，则可以仅启用
    `EYEBROWS` 选项。


    此时，我们应该已经在流式传输了，但让我们再看看 Faceware 界面的最后一部分：状态栏。


    ## 状态栏


    在 *图 9.17* 中，您可以看到顶部工具栏是一个颜色编码的标签列表，提供了一种在问题出现时快速排查和纠正问题的方法：


    ![图 9.17：顶部工具栏](img/B17878_09_17.jpg)


    *图 9.17：顶部工具栏*


    它们从左到右的顺序是：


    *   `VIDEO`：这是 `REALTIME SETUP` 面板的快捷方式，我们刚刚介绍过。

    *   `TRACKING`：这是视口的快捷方式，如 *图 9.17* 所示，以便我们可视化追踪效果如何。您可以在 *图 9.18* 中看到，不仅我的头部运动被追踪了，追踪器甚至能检测到我隔着眼镜眨眼。


    ![图 9.18：视口](img/B17878_09_18.jpg)


    *图 9.18：视口*


    *   `TUNING`：这是 `TUNING` 面板的快捷方式，我们将在其中进行大部分调整和修复。您可以看到我们对细化眉毛、眼睛、头部和嘴巴有很多控制权。尽管这看起来可能令人生畏，但这些控制器使用起来相对简单。


    例如，如果您看 CGI 头部，其下颚张开程度不如您在网络摄像头中的下颚，您可以通过将蓝色滑块向右拖动，将 `Jaw Open` 参数增加高达 200%。我在
    *图 9.19* 中通过将一些嘴部滑块向右拖动高达 200% 进行了类似的调整。


    ![图 9.19：调整](img/B17878_09_19.jpg)


    *图 9.19：调整*


    如果 CGI 角色的下颚张开过度，超过了您的网络摄像头视频，则向左拖动滑块以减少幅度。`TUNING` 面板中的所有参数均适用相同原理。


    '
