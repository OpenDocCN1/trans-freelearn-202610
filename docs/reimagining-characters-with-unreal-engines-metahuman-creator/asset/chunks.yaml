- raw: "Now, you may have noticed from the on-screen instructions that Mixamo has\
    \ asked for the character to be placed in a **T-pose** position for best results:\
    \ a T-pose is where the character is in the shape of a T – that is to say, that\
    \ their arms are straight out to either side, rotated at 90 degrees. In my case,\
    \ and in the case of all MetaHumans, the default pose is **A-pose**, which is\
    \ where the character’s arms are not fully extended and only rotated at approximately\
    \ 45 degrees. However, Mixamo does a really good job at interpolating between\
    \ the two and successfully aligns the Mixamo character rig to our preview mesh.\n\
    \nNote\n\nWe will be looking at modifying the MetaHuman from **A-pose** to **T-pose**\
    \ in [*Chapter 6*](#B17878_06.xhtml#_idTextAnchor084)*, Adding Motion Capture\
    \ **with DeepMotion*.\n\nDespite Mixamo taking care of most of the work, we still\
    \ need to give Mixamo’s auto-rigger a bit of a nudge. When you click the **NEXT**\
    \ button, seen at the bottom-right corner of *Figure 5**.10*, you will be brought\
    \ to the following page:\n\n![Figure 5.11: Auto-rigger marker placement ](image/B17878_05_11.jpg)\
    \ \n\nFigure 5.11: Auto-rigger marker placement\n\nEffectively, this is a calibration\
    \ tool where we get to ensure the proportions of the Mixamo character rig match\
    \ that of our MetaHuman’s preview mesh. We get to make those fine-tuned adjustments\
    \ by simply dragging the markers from the left of the screen to their associated\
    \ body parts. With **Use Symmetry** left on, you’ll do this much faster and more\
    \ accurately. Also keep **Skeleton LOD** as the default setting, **Standard Skeleton\
    \ (65)**, which has the highest number of bones; this makes a noticeable difference\
    \ when it comes to finger articulation.\n\nOnce you’re happy with the placement\
    \ of the markers, select **NEXT,** where you will see the character being processed;\
    \ this can take a couple of minutes and you will see your character spinning while\
    \ this happens.\n\n![Figure 5.12: Auto-rigging processing ](image/B17878_05_12.jpg)\
    \ \n\nFigure 5.12: Auto-rigging processing\n\nTwo things are happening here in\
    \ the background:\n\n*   *The generation of the Mixamo character rig to be proportional\
    \ to your character preview mesh*: We’ll be making use of the Mixamo character\
    \ rig later in this chapter because it is effectively like Unreal’s own Mannequin\
    \ Rig, but there are small differences. However, with the IK Retargeting work\
    \ covered in the previous chapter, we’ll tackle the differences between the Mixamo\
    \ Rig and the MetaHuman Rig.\n\n*   *The adjustment of skin weighting regarding\
    \ the rig aligning with the proportions of the mesh*: Fortunately, we don’t have\
    \ to know anything about skin weighting to progress further through this book,\
    \ as Mixamo does this automatically. However, for those of you who have any experience\
    \ manually rigging characters, you’ll be all too aware of the somewhat painful\
    \ process of painting weight influences.\n\nAll this means is that we are telling\
    \ each part of the mesh how much it is influenced by each bone; for example, a\
    \ foot bone would have no skin weight influence over the mesh of the arm, but\
    \ a foot bone could have a small degree of influence over the mesh covering the\
    \ lower leg.\n\nNote\n\nFor more seasoned 3D artists, there are methods to adjust\
    \ the skin weights in third-party applications such as Maya, Blender, or Houdini.\n\
    \nWhen the auto-rigging process is complete, you should see your rig moving using\
    \ a default temporary animation supplied by Mixamo, as shown in *Figure 5**.13*:\n\
    \n![Figure 5.13: Auto rigging completed ](image/B17878_05_13.jpg) \n\nFigure 5.13:\
    \ Auto rigging completed\n\nYou’ll also notice that while most of the body is\
    \ green, the top of the mesh is gray and black. This means that the gray and black\
    \ area of the mesh isn’t being influenced by the Mixamo Rig as much as the rest\
    \ of the mesh. This is good because we want our MetaHuman Rig to influence the\
    \ head and we are only interested in Mixamo for body animation.\n\nWhen you are\
    \ happy with the rigging, click **NEXT**, and we can now get ready to apply animation\
    \ from the huge Mixamo motion capture library.\n\n# Exploring animation in Mixamo\n\
    \nIn the Mixamo motion capture library, you’ll see that all the animations are\
    \ separated into different genres, just like in *Figure 5**.14*:\n\n![Figure 5.14:\
    \ Animation genres ](image/B17878_05_14.jpg) \n\nFigure 5.14: Animation genres\n\
    \nThis list of genres is quite helpful but there’s also a handy search function.\
    \ Using either option, find the **Macarena Dance** animation (I am using this\
    \ because it’s a long animation and is great for testing how well the rig works\
    \ with my character). Once you can see the thumbnail of your chosen animation,\
    \ it just takes one left click on the thumbnail to apply it to your MetaHuman\
    \ mesh.\n\n![Figure 5.15: Completed rig with articulated fingers ](image/B17878_05_15.jpg)\
    \ \n\nFigure 5.15: Completed rig with articulated fingers\n\nTake note of the\
    \ sliders on the right-hand side, which you can manipulate to your liking. The\
    \ parameters are not the same from one animation to the next. For example, in\
    \ relation to the Macarena dance, **Focus** is the first parameter; however, this\
    \ parameter isn’t available for most Mixamo animations.\n\nWhen you play the animation\
    \ with **Focus** at the minimum value versus the maximum value, you’ll see a slight\
    \ difference. Most likely, you are just blending between two separate motion capture\
    \ performances. The minimal value, in this case, is where the dancer is not focused\
    \ very well on their dancing, or in other words, they are dancing badly with poor\
    \ rhythm and timing. The maximum value is another take where they are dancing\
    \ very well and on time with a good rhythm. Often, each motion capture file will\
    \ have one or more bespoke parameters depending on the nature of the performance.\n\
    \nThe three most useful parameters in all animations that you will find yourself\
    \ editing are as follows:\n\n*   **Character Arm-Space**: This determines the\
    \ distance between the character’s arms and its torso. When reviewing how your\
    \ mesh performs within the Mixamo viewport, you may see moments where the mesh\
    \ intersects with itself, such as an arm going through a waist. Of course, you’ll\
    \ need to widen the arm space to accommodate that. For the Macarena dance, the\
    \ mocap session may have been performed by a lean dancer rather than an overweight\
    \ Glenda, so this intersection is likely to occur. With that said, there could\
    \ be instances where the mocap performer and model are similar, but you still\
    \ need to create a wider arm space to accommodate heavy clothing or armor, so\
    \ it is worth being mindful of this when making these adjustments.\n\n*   **Trim**:\
    \ This refers to how much of the animation clip we want to trim. You are simply\
    \ editing out a portion of the original animation if you use the default setting.\
    \ As a rule of thumb, it’s better to have more frames of animation than to not\
    \ have enough.\n\n*   **Overdrive**: This will affect the speed. Overdrive simply\
    \ means faster, so if you want to speed up, set the animation slider to a higher\
    \ value in the **Overdrive** settings.\n\nGo ahead and play with these settings\
    \ until you’re happy with how it looks. When you are done, click **DOWNLOAD**.\
    \ In the next section, we will explore some of the settings that you will see.\n\
    \n# Downloading the Mixamo animation\n\nContinuing from the last section, when\
    \ you click **DOWNLOAD**, Mixamo will take you to the following dialog box illustrated\
    \ in *Figure 5**.16*:\n\n![Figure 5.16: DOWNLOAD SETTINGS ](image/B17878_05_16.jpg)\
    \ \n\nFigure 5.16: DOWNLOAD SETTINGS\n\nLet’s look at each of these options:\n\
    \n*   **Format**: **FBX** is the same format you used when you exported from Unreal\
    \ Engine; for the Unreal Mixamo pipeline, I strongly suggest you work with this\
    \ preset. In the **Format** drop-down list, you will see other formats. Mostly,\
    \ they consist of alternative and older versions of FBX. Another available format\
    \ is **DAE**, however it is not compatible with Unreal."
  fmt: '

    Now, you may have noticed from the on-screen instructions that Mixamo has asked
    for the character to be placed in a **T-pose** position for best results: a T-pose
    is where the character is in the shape of a T – that is to say, that their arms
    are straight out to either side, rotated at 90 degrees. In my case, and in the
    case of all MetaHumans, the default pose is **A-pose**, which is where the character’s
    arms are not fully extended and only rotated at approximately 45 degrees. However,
    Mixamo does a really good job at interpolating between the two and successfully
    aligns the Mixamo character rig to our preview mesh.


    > **Note**

    >

    > We will be looking at modifying the MetaHuman from **A-pose** to **T-pose**
    in [*Chapter 6*](#B17878_06.xhtml#_idTextAnchor084), *Adding Motion Capture **with
    DeepMotion***.


    Despite Mixamo taking care of most of the work, we still need to give Mixamo’s
    auto-rigger a bit of a nudge. When you click the **NEXT** button, seen at the
    bottom-right corner of Figure 5.10, you will be brought to the following page:


    ![Figure 5.11: Auto-rigger marker placement](image/B17878_05_11.jpg)


    Figure 5.11: Auto-rigger marker placement


    Effectively, this is a calibration tool where we get to ensure the proportions
    of the Mixamo character rig match that of our MetaHuman’s preview mesh. We get
    to make those fine-tuned adjustments by simply dragging the markers from the left
    of the screen to their associated body parts. With **Use Symmetry** left on, you’ll
    do this much faster and more accurately. Also keep **Skeleton LOD** as the default
    setting, **Standard Skeleton (65)**, which has the highest number of bones; this
    makes a noticeable difference when it comes to finger articulation.


    Once you’re happy with the placement of the markers, select **NEXT**, where you
    will see the character being processed; this can take a couple of minutes and
    you will see your character spinning while this happens.


    ![Figure 5.12: Auto-rigging processing](image/B17878_05_12.jpg)


    Figure 5.12: Auto-rigging processing


    Two things are happening here in the background:


    - *The generation of the Mixamo character rig to be proportional to your character
    preview mesh*: We’ll be making use of the Mixamo character rig later in this chapter
    because it is effectively like Unreal’s own Mannequin Rig, but there are small
    differences. However, with the IK Retargeting work covered in the previous chapter,
    we’ll tackle the differences between the Mixamo Rig and the MetaHuman Rig.

    - *The adjustment of skin weighting regarding the rig aligning with the proportions
    of the mesh*: Fortunately, we don’t have to know anything about skin weighting
    to progress further through this book, as Mixamo does this automatically. However,
    for those of you who have any experience manually rigging characters, you’ll be
    all too aware of the somewhat painful process of painting weight influences.


    All this means is that we are telling each part of the mesh how much it is influenced
    by each bone; for example, a foot bone would have no skin weight influence over
    the mesh of the arm, but a foot bone could have a small degree of influence over
    the mesh covering the lower leg.


    > **Note**

    >

    > For more seasoned 3D artists, there are methods to adjust the skin weights in
    third-party applications such as Maya, Blender, or Houdini.


    When the auto-rigging process is complete, you should see your rig moving using
    a default temporary animation supplied by Mixamo, as shown in Figure 5.13:


    ![Figure 5.13: Auto rigging completed](image/B17878_05_13.jpg)


    Figure 5.13: Auto rigging completed


    You’ll also notice that while most of the body is green, the top of the mesh is
    gray and black. This means that the gray and black area of the mesh isn’t being
    influenced by the Mixamo Rig as much as the rest of the mesh. This is good because
    we want our MetaHuman Rig to influence the head and we are only interested in
    Mixamo for body animation.


    When you are happy with the rigging, click **NEXT**, and we can now get ready
    to apply animation from the huge Mixamo motion capture library.


    # Exploring animation in Mixamo


    In the Mixamo motion capture library, you’ll see that all the animations are separated
    into different genres, just like in Figure 5.14:


    ![Figure 5.14: Animation genres](image/B17878_05_14.jpg)


    Figure 5.14: Animation genres


    This list of genres is quite helpful but there’s also a handy search function.
    Using either option, find the **Macarena Dance** animation (I am using this because
    it’s a long animation and is great for testing how well the rig works with my
    character). Once you can see the thumbnail of your chosen animation, it just takes
    one left click on the thumbnail to apply it to your MetaHuman mesh.


    ![Figure 5.15: Completed rig with articulated fingers](image/B17878_05_15.jpg)


    Figure 5.15: Completed rig with articulated fingers


    Take note of the sliders on the right-hand side, which you can manipulate to your
    liking. The parameters are not the same from one animation to the next. For example,
    in relation to the Macarena dance, **Focus** is the first parameter; however,
    this parameter isn’t available for most Mixamo animations.


    When you play the animation with **Focus** at the minimum value versus the maximum
    value, you’ll see a slight difference. Most likely, you are just blending between
    two separate motion capture performances. The minimal value, in this case, is
    where the dancer is not focused very well on their dancing, or in other words,
    they are dancing badly with poor rhythm and timing. The maximum value is another
    take where they are dancing very well and on time with a good rhythm. Often, each
    motion capture file will have one or more bespoke parameters depending on the
    nature of the performance.


    The three most useful parameters in all animations that you will find yourself
    editing are as follows:


    - **Character Arm-Space**: This determines the distance between the character’s
    arms and its torso. When reviewing how your mesh performs within the Mixamo viewport,
    you may see moments where the mesh intersects with itself, such as an arm going
    through a waist. Of course, you’ll need to widen the arm space to accommodate
    that. For the Macarena dance, the mocap session may have been performed by a lean
    dancer rather than an overweight Glenda, so this intersection is likely to occur.
    With that said, there could be instances where the mocap performer and model are
    similar, but you still need to create a wider arm space to accommodate heavy clothing
    or armor, so it is worth being mindful of this when making these adjustments.

    - **Trim**: This refers to how much of the animation clip we want to trim. You
    are simply editing out a portion of the original animation if you use the default
    setting. As a rule of thumb, it’s better to have more frames of animation than
    to not have enough.

    - **Overdrive**: This will affect the speed. Overdrive simply means faster, so
    if you want to speed up, set the animation slider to a higher value in the **Overdrive**
    settings.


    Go ahead and play with these settings until you’re happy with how it looks. When
    you are done, click **DOWNLOAD**. In the next section, we will explore some of
    the settings that you will see.


    # Downloading the Mixamo animation


    Continuing from the last section, when you click **DOWNLOAD**, Mixamo will take
    you to the following dialog box illustrated in Figure 5.16:


    ![Figure 5.16: DOWNLOAD SETTINGS](image/B17878_05_16.jpg)


    Figure 5.16: DOWNLOAD SETTINGS


    Let’s look at each of these options:


    - **Format**: **FBX** is the same format you used when you exported from Unreal
    Engine; for the Unreal Mixamo pipeline, I strongly suggest you work with this
    preset. In the **Format** drop-down list, you will see other formats. Mostly,
    they consist of alternative and older versions of FBX. Another available format
    is **DAE**, however it is not compatible with Unreal.

    '
  trans: '

    现在，你可能已经从屏幕上的说明中注意到，Mixamo 要求将角色置于 **T-pose**（T 字姿势）位置以获得最佳效果：T-pose 是指角色呈 T 字形——也就是说，他们的双臂向两侧伸直，旋转
    90 度。在我的例子中，以及所有 MetaHuman 的情况下，默认姿势是 **A-pose**，即角色的双臂并未完全伸展，仅旋转约 45 度。然而，Mixamo
    在两者之间插值的效果非常好，并成功将 Mixamo 角色骨架与我们的预览网格体对齐。


    > **注意**

    >

    > 我们将在 *第 6 章* *使用 **DeepMotion** 添加动作捕捉* 中探讨如何将 MetaHuman 从 **A-pose** 修改为 **T-pose**。


    尽管 Mixamo 完成了大部分工作，我们仍需给 Mixamo 的自动绑定工具一点“推力”。当你点击图 5.10 右下角的 **NEXT** 按钮时，你将进入以下页面：


    ![图 5.11：自动绑定标记放置](img/B17878_05_11.jpg)


    图 5.11：自动绑定标记放置


    实际上，这是一个校准工具，我们可以借此确保 Mixamo 角色骨架的比例与我们的 MetaHuman 预览网格体相匹配。我们只需将屏幕左侧的标记拖动到其对应的身体部位，即可进行这些微调。保持开启
    **Use Symmetry**（使用对称），你将能更快、更准确地完成此操作。同时将 **Skeleton LOD** 保留为默认设置 **Standard
    Skeleton (65)**（标准骨架 (65)），它拥有最多的骨骼数量；这在手指关节活动方面会产生明显的差异。


    一旦你对标记的放置感到满意，选择 **NEXT**，你将看到角色正在处理中；这可能需要几分钟，在此期间你会看到角色在旋转。


    ![图 5.12：自动绑定处理中](img/B17878_05_12.jpg)


    图 5.12：自动绑定处理中


    这里在后台发生了两件事：


    - *生成与角色预览网格体成比例的 Mixamo 角色骨架*：我们将在本章后面使用 Mixamo 角色骨架，因为它实际上类似于 Unreal 自带的 Mannequin
    Rig（人体模型骨架），但存在细微差别。不过，借助上一章介绍的 IK 重定向工作，我们将解决 Mixamo Rig 与 MetaHuman Rig 之间的差异。

    - *调整蒙皮权重以使骨架与网格体比例对齐*：幸运的是，我们无需了解任何关于蒙皮权重的知识即可继续阅读本书，因为 Mixamo 会自动完成此过程。不过，对于那些有手动绑定角色经验的人来说，你们肯定深知绘制权重影响那略显痛苦的过程。


    这意味着我们要告诉网格体的每一部分受每根骨骼影响的程度；例如，脚骨对手臂网格体没有蒙皮权重影响，但脚骨可能对覆盖小腿的网格体有一定程度的影响。


    > **注意**

    >

    > 对于更有经验的 3D 艺术家，可以在 Maya、Blender 或 Houdini 等第三方应用程序中调整蒙皮权重。


    当自动绑定过程完成时，你应该会看到你的骨架使用 Mixamo 提供的默认临时动画进行移动，如图 5.13 所示：


    ![图 5.13：自动绑定完成](img/B17878_05_13.jpg)


    图 5.13：自动绑定完成


    你还会注意到，虽然身体大部分是绿色的，但网格体顶部是灰色和黑色的。这意味着网格体的灰色和黑色区域受 Mixamo Rig 的影响不如网格体的其他部分大。这很好，因为我们希望
    MetaHuman Rig 影响头部，而我们只对 Mixamo 的身体动画感兴趣。


    当你对绑定结果满意时，点击 **NEXT**，现在我们可以准备从庞大的 Mixamo 动作捕捉库中应用动画了。


    # 在 Mixamo 中探索动画


    在 Mixamo 动作捕捉库中，你会看到所有动画都被分成了不同的类型，如图 5.14 所示：


    ![图 5.14：动画类型](img/B17878_05_14.jpg)


    图 5.14：动画类型


    这个类型列表非常有用，但也有一个方便的搜索功能。使用任一选项，找到 **Macarena Dance**（马卡雷纳舞）动画（我用这个是因为它时长较长，非常适合测试骨架与我的角色配合得如何）。一旦看到你所选动画的缩略图，只需左键单击缩略图即可将其应用到你的
    MetaHuman 网格体上。


    ![图 5.15：具有关节手指的完成绑定](img/B17878_05_15.jpg)


    图 5.15：具有关节手指的完成绑定


    注意右侧的滑块，你可以随心所欲地调整它们。参数因动画而异。例如，对于马卡雷纳舞，**Focus**（专注度）是第一个参数；然而，大多数 Mixamo 动画没有此参数。


    当你将 **Focus** 设为最小值与最大值播放动画时，你会看到细微的差别。很可能你只是在两个独立的动作捕捉表演之间进行混合。在这种情况下，最小值对应舞者不太专注于跳舞，换句话说，他们跳得很烂，节奏和时机都很差。最大值则是另一组拍摄，他们跳得非常好，节奏感强且准确。通常，每个动作捕捉文件会根据表演性质拥有一个或多个专属参数。


    你会发现自己经常编辑的所有动画中最有用的三个参数如下：


    - **Character Arm-Space**（角色臂部空间）：这决定了角色双臂与躯干之间的距离。在 Mixamo 视口中查看网格体表现时，你可能会发现网格体与自身相交的时刻，例如手臂穿过腰部。当然，你需要加宽臂部空间来适应这种情况。对于马卡雷纳舞，动作捕捉演员可能是瘦削的舞者，而不是超重的
    Glenda，所以这种相交很可能发生。话虽如此，也可能存在演员和模型相似的情况，但你仍需创建更宽的臂部空间以容纳厚重的衣物或盔甲，因此在调整时记住这一点很有必要。

    - **Trim**（修剪）：这指的是我们想要修剪动画片段的程度。如果你使用默认设置，实际上就是在剪掉原始动画的一部分。根据经验法则，拥有更多动画帧总比帧数不足要好。

    - **Overdrive**（超驱/加速）：这会影响速度。Overdrive 简单来说就是更快，所以如果你想加速，请在 **Overdrive** 设置中将动画滑块设为更高的值。


    继续调整这些设置，直到你对效果满意。完成后，点击 **DOWNLOAD**。在下一节中，我们将探讨你将看到的一些设置。


    # 下载 Mixamo 动画


    承接上一节，当你点击 **DOWNLOAD** 时，Mixamo 将带你进入图 5.16 所示的对话框：


    ![图 5.16：下载设置](img/B17878_05_16.jpg)


    图 5.16：下载设置


    让我们看看这些选项中的每一个：


    - **Format**（格式）：**FBX** 是你从 Unreal Engine 导出时使用的相同格式；对于 Unreal-Mixamo 流程，我强烈建议你使用此预设。在
    **Format** 下拉列表中，你会看到其他格式。它们大多是 FBX 的替代版本和旧版本。另一种可用格式是 **DAE**，但它与 Unreal 不兼容。

    '
