- raw: "This opens up opportunities for artists to use all the great MetaHuman-related\
    \ tools and functionality on custom face sculptors or digital scans of real people.\
    \ Because we can use digital scans of real people, it gives artists the ability\
    \ to create MetaHumans that have an incredible likeness to actors or even artists.\n\
    \nIn this chapter, we will focus on how to create and utilize a digital scan of\
    \ your own face and apply it to a MetaHuman. To do this, we will use an app called\
    \ KIRI Engine that is available on both iPhone and Android. We will then import\
    \ the digital scan to use with the Mesh to MetaHuman plugin.\n\nSo, in this chapter,\
    \ we will cover the following topics:\n\n*   Installing the Mesh to MetaHuman\
    \ plugin for Unreal Engine\n\n*   Introducing and installing the KIRI Engine app\
    \ on your smartphone\n\n*   Importing your scanned mesh into Unreal Engine\n\n\
    *   Modifying the face mesh inside MetaHuman Creator\n\n# Technical requirements\n\
    \nIn terms of computer power, you will need to meet the technical requirements\
    \ detailed in [*Chapter 1*](#B17878_01.xhtml#_idTextAnchor015).\n\nYou will also\
    \ need:\n\n*   An iPhone or Android phone with at least 200 MB of free space\n\
    \n*   A stable internet connection as you will be downloading a plugin and uploading\
    \ data to a server\n\n*   Access to the Epic Games Launcher used to install Unreal\
    \ Engine\n\n*   The KIRI app\n\n*   The Mesh to MetaHuman plugin\n\n*   A new\
    \ project in Unreal Engine\n\nNote\n\nYou will need to be familiar with the MetaHuman\
    \ Creator online application from [*Chapter 2*](#B17878_02.xhtml#_idTextAnchor027),\
    \ but you don’t need to have any projects open from previous chapters.\n\n# Installing\
    \ the Mesh to MetaHuman plugin for Unreal Engine\n\nTo get started, create a new\
    \ project in Unreal Engine and leave it open. Then, to enable the Mesh to MetaHuman\
    \ plugin, we first need to download it from the Unreal Engine Marketplace via\
    \ the Epic Games Launcher.\n\nWhen you have located the Mesh to MetaHuman plugin\
    \ page, click on the** Install to Engine** button as seen in *Figure 11**.1*:\n\
    \n![Figure 11.1: The MetaHuman plugin ](image/B17878_11_01.jpg) \n\nFigure 11.1:\
    \ The MetaHuman plugin\n\nWith the Mesh to MetaHuman plugin installed, we’ll now\
    \ go to the next section to begin our journey into creating a digital scan with\
    \ the KIRI Engine app.\n\n# Introducing and installing KIRI Engine on your smartphone\n\
    \nWhat is **KIRI** Engine? Well, KIRI Engine is an application that falls under\
    \ the category of** photogrammetry**. Photogrammetry is the process of creating\
    \ 3D geometry inside a 3D application (automatically, for the most part) using\
    \ photographs.\n\nIn the context of creating a face scan for a MetaHuman, photogrammetry\
    \ requires the artist to take multiple photographs in a 180-degree arc and at\
    \ varying heights. From *Figure 11**.2*, you can see four different angles of\
    \ a head and shoulders.\n\n![Figure 11.2: Typical camera positions ](image/B17878_11_02.jpg)\
    \ \n\nFigure 11.2: Typical camera positions\n\nWe are only interested in the front\
    \ of the face, which is why we only capture within a 180-degree arc. It’s also\
    \ important to get high and low angles so that we get information for under the\
    \ chin, nostrils, and the forehead.\n\nTips for shooting photogrammetry\n\n\\\
    - Use diffused (soft) lighting so there are no shadows on the face\n\n\\- Have\
    \ your subject sit very still with their chin tilted slightly up\n\n\\- If possible,\
    \ use a polarizing lens filter to minimize reflections on the skin\n\nNow, let’s\
    \ get started with working with KIRI. Recently, KIRI Engine has become available\
    \ for desktop when using a web browser on either macOS or Windows, which you can\
    \ download here: https://www.kiriengine.app/web-version/. However, for the purpose\
    \ of this book, I will assume that you have access to an Android smartphone or\
    \ iPhone and that you are downloading the KIRI Engine app onto your smartphone.\n\
    \nIf you have an Android device, you can install the app from Google Play for\
    \ free, as seen here:\n\n![Figure 11.3: KIRI Engine on Google Play ](image/B17878_11_03.jpg)\
    \ \n\nFigure 11.3: KIRI Engine on Google Play\n\nAs many of you will have used\
    \ an iPhone during [*Chapter 8*](#B17878_08.xhtml#_idTextAnchor120), *Using an\
    \ iPhone for Facial Motion Capture*, you’ll be pleased to know that you don’t\
    \ have to run off and get an Android. By going over to the App Store, you can\
    \ download the KIRI Engine app on your device:\n\n![Figure 11.4: KIRI Engine on\
    \ the App Store ](image/B17878_11_04.jpg) \n\nFigure 11.4: KIRI Engine on the\
    \ App Store\n\nUsing KIRI Engine is very straightforward as there are very few\
    \ options to choose from when running the app. When you first open KIRI Engine,\
    \ whether you’re on an Android or iPhone device, you’ll be greeted with a simple\
    \ interface as seen in *Figure 11**.5*:\n\n![Figure 11.5: The KIRI Engine welcome\
    \ screen ](image/B17878_11_05.jpg) \n\nFigure 11.5: The KIRI Engine welcome screen\n\
    \nHere, you will be given a choice of uploading photographs that you’ve taken\
    \ before or taking photos with the KIRI app. Choose the latter, **Take photos**,\
    \ and you will see the screen change:\n\n![Figure 11.6: The manual option ](image/B17878_11_06.jpg)\
    \ \n\nFigure 11.6: The manual option\n\nThe manual capture setting is the default\
    \ setting. It is denoted by the stills camera icon at the top left of *Figure\
    \ 11**.6*. This is a manual capture option, which means you’ll have to click on\
    \ the big white button at the bottom of the screen every time you want to take\
    \ a picture. The problem with this is, every time you tap the screen of your smartphone\
    \ it introduces a slight camera shake, which in certain lighting conditions will\
    \ give you a blurry picture.\n\nThe auto-capturing setting is accessible by clicking\
    \ the movie camera icon on the right, as shown in *Figure 11**.7*. With this setting,\
    \ you need to click on the red button just once to start capturing. This setting\
    \ takes a picture every couple of seconds (as many as 70 pictures) and will also\
    \ give you warnings if you are moving the camera too fast.\n\n![Figure 11.7: The\
    \ auto-capturing option ](image/B17878_11_07.jpg) \n\nFigure 11.7: The auto-capturing\
    \ option\n\nNote the progress line above the record button; this indicates the\
    \ quality of the coverage, namely, **Acceptable**, **Good**, and **Perfect**.\
    \ An **Acceptable** result will get you a less detailed 3D model and will be prone\
    \ to lumpiness, whereas a **Perfect** photo result will get you a more detailed\
    \ and smoother 3D model.\n\nIdeally, you should get as much overlap from one picture\
    \ to the next as possible. Around 80% overlap is a good rule of thumb from one\
    \ image to the next sequentially. By overlap, I mean that every two or three consecutive\
    \ images should share at least one feature such as an eye or a nose.\n\nAs soon\
    \ as you have reached the maximum number of images and have reached a reasonable\
    \ level of coverage around your face, you’ll be greeted with the interface shown\
    \ in *Figure 11**.8*:\n\n![Figure 11.8: The upload screen ](image/B17878_11_08.jpg)\
    \ \n\nFigure 11.8: The upload screen\n\nIn this interface, you’ll see the following\
    \ options:\n\n*   **Face Counts**: The number of polygons used to create the 3D\
    \ model. Choose **High** to ensure the MetaHuman plugin has enough geometry to\
    \ work with (you don’t need to worry about producing very dense geometry as MetaHumans\
    \ are designed to work with very high-density meshes in terms of polycounts).\n\
    \n*   **Texture Quality**: KIRI doesn’t produce massive texture maps and if you’ve\
    \ managed to work with a MetaHuman in Unreal Engine, then you’ll have no problem\
    \ with the highest quality texture map created by KIRI. So, choose **High** again.\n\
    \n*   **File Format**: While Unreal Engine can import both OBJ and FBX file formats,\
    \ the FBX format has been reported to have longer processing times; Epic Games\
    \ recommends OBJ for the plugin to work quickly, so choose **OBJ**."
  fmt: '

    This opens up opportunities for artists to use all the great MetaHuman-related
    tools and functionality on custom face sculptors or digital scans of real people.
    Because we can use digital scans of real people, it gives artists the ability
    to create MetaHumans that have an incredible likeness to actors or even artists.


    In this chapter, we will focus on how to create and utilize a digital scan of
    your own face and apply it to a MetaHuman. To do this, we will use an app called
    KIRI Engine that is available on both iPhone and Android. We will then import
    the digital scan to use with the Mesh to MetaHuman plugin.


    So, in this chapter, we will cover the following topics:


    * Installing the Mesh to MetaHuman plugin for Unreal Engine

    * Introducing and installing the KIRI Engine app on your smartphone

    * Importing your scanned mesh into Unreal Engine

    * Modifying the face mesh inside MetaHuman Creator


    # Technical requirements


    In terms of computer power, you will need to meet the technical requirements detailed
    in [*Chapter 1*](#B17878_01.xhtml#_idTextAnchor015).


    You will also need:


    * An iPhone or Android phone with at least 200 MB of free space

    * A stable internet connection as you will be downloading a plugin and uploading
    data to a server

    * Access to the Epic Games Launcher used to install Unreal Engine

    * The KIRI app

    * The Mesh to MetaHuman plugin

    * A new project in Unreal Engine


    Note: You will need to be familiar with the MetaHuman Creator online application
    from [*Chapter 2*](#B17878_02.xhtml#_idTextAnchor027), but you don''t need to
    have any projects open from previous chapters.


    # Installing the Mesh to MetaHuman plugin for Unreal Engine


    To get started, create a new project in Unreal Engine and leave it open. Then,
    to enable the Mesh to MetaHuman plugin, we first need to download it from the
    Unreal Engine Marketplace via the Epic Games Launcher.


    When you have located the Mesh to MetaHuman plugin page, click on the **Install
    to Engine** button as seen in *Figure 11.1*:


    ![Figure 11.1: The MetaHuman plugin](image/B17878_11_01.jpg)


    Figure 11.1: The MetaHuman plugin


    With the Mesh to MetaHuman plugin installed, we''ll now go to the next section
    to begin our journey into creating a digital scan with the KIRI Engine app.


    # Introducing and installing KIRI Engine on your smartphone


    What is **KIRI** Engine? Well, KIRI Engine is an application that falls under
    the category of **photogrammetry**. Photogrammetry is the process of creating
    3D geometry inside a 3D application (automatically, for the most part) using photographs.


    In the context of creating a face scan for a MetaHuman, photogrammetry requires
    the artist to take multiple photographs in a 180-degree arc and at varying heights.
    From *Figure 11.2*, you can see four different angles of a head and shoulders.


    ![Figure 11.2: Typical camera positions](image/B17878_11_02.jpg)


    Figure 11.2: Typical camera positions


    We are only interested in the front of the face, which is why we only capture
    within a 180-degree arc. It''s also important to get high and low angles so that
    we get information for under the chin, nostrils, and the forehead.


    Tips for shooting photogrammetry:


    * Use diffused (soft) lighting so there are no shadows on the face

    * Have your subject sit very still with their chin tilted slightly up

    * If possible, use a polarizing lens filter to minimize reflections on the skin


    Now, let''s get started with working with KIRI. Recently, KIRI Engine has become
    available for desktop when using a web browser on either macOS or Windows, which
    you can download here: `https://www.kiriengine.app/web-version/`. However, for
    the purpose of this book, I will assume that you have access to an Android smartphone
    or iPhone and that you are downloading the KIRI Engine app onto your smartphone.


    If you have an Android device, you can install the app from Google Play for free,
    as seen here:


    ![Figure 11.3: KIRI Engine on Google Play](image/B17878_11_03.jpg)


    Figure 11.3: KIRI Engine on Google Play


    As many of you will have used an iPhone during [*Chapter 8*](#B17878_08.xhtml#_idTextAnchor120),
    *Using an iPhone for Facial Motion Capture*, you''ll be pleased to know that you
    don''t have to run off and get an Android. By going over to the App Store, you
    can download the KIRI Engine app on your device:


    ![Figure 11.4: KIRI Engine on the App Store](image/B17878_11_04.jpg)


    Figure 11.4: KIRI Engine on the App Store


    Using KIRI Engine is very straightforward as there are very few options to choose
    from when running the app. When you first open KIRI Engine, whether you''re on
    an Android or iPhone device, you''ll be greeted with a simple interface as seen
    in *Figure 11.5*:


    ![Figure 11.5: The KIRI Engine welcome screen](image/B17878_11_05.jpg)


    Figure 11.5: The KIRI Engine welcome screen


    Here, you will be given a choice of uploading photographs that you''ve taken before
    or taking photos with the KIRI app. Choose the latter, **Take photos**, and you
    will see the screen change:


    ![Figure 11.6: The manual option](image/B17878_11_06.jpg)


    Figure 11.6: The manual option


    The manual capture setting is the default setting. It is denoted by the stills
    camera icon at the top left of *Figure 11.6*. This is a manual capture option,
    which means you''ll have to click on the big white button at the bottom of the
    screen every time you want to take a picture. The problem with this is, every
    time you tap the screen of your smartphone it introduces a slight camera shake,
    which in certain lighting conditions will give you a blurry picture.


    The auto-capturing setting is accessible by clicking the movie camera icon on
    the right, as shown in *Figure 11.7*. With this setting, you need to click on
    the red button just once to start capturing. This setting takes a picture every
    couple of seconds (as many as 70 pictures) and will also give you warnings if
    you are moving the camera too fast.


    ![Figure 11.7: The auto-capturing option](image/B17878_11_07.jpg)


    Figure 11.7: The auto-capturing option


    Note the progress line above the record button; this indicates the quality of
    the coverage, namely, **Acceptable**, **Good**, and **Perfect**. An **Acceptable**
    result will get you a less detailed 3D model and will be prone to lumpiness, whereas
    a **Perfect** photo result will get you a more detailed and smoother 3D model.


    Ideally, you should get as much overlap from one picture to the next as possible.
    Around 80% overlap is a good rule of thumb from one image to the next sequentially.
    By overlap, I mean that every two or three consecutive images should share at
    least one feature such as an eye or a nose.


    As soon as you have reached the maximum number of images and have reached a reasonable
    level of coverage around your face, you''ll be greeted with the interface shown
    in *Figure 11.8*:


    ![Figure 11.8: The upload screen](image/B17878_11_08.jpg)


    Figure 11.8: The upload screen


    In this interface, you''ll see the following options:


    * **Face Counts**: The number of polygons used to create the 3D model. Choose
    **High** to ensure the MetaHuman plugin has enough geometry to work with (you
    don''t need to worry about producing very dense geometry as MetaHumans are designed
    to work with very high-density meshes in terms of polycounts).

    * **Texture Quality**: KIRI doesn''t produce massive texture maps and if you''ve
    managed to work with a MetaHuman in Unreal Engine, then you''ll have no problem
    with the highest quality texture map created by KIRI. So, choose **High** again.

    * **File Format**: While Unreal Engine can import both OBJ and FBX file formats,
    the FBX format has been reported to have longer processing times; Epic Games recommends
    OBJ for the plugin to work quickly, so choose **OBJ**.

