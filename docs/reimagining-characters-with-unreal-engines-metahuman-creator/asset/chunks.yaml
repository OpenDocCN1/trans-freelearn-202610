  trans: '

    # 在 Windows PC 上安装 Faceware Studio


    要安装 Faceware Studio，请前往 [`facewaretech.com/`](https://facewaretech.com/) 并导航至**定价**页面。Faceware
    Studio 软件有两个可供下载的选项，具体取决于您的预算。第一个是 **Faceware Studio (Indie)** 版本，目前定价为每年 179
    美元；第二个是 Faceware Studio 的免费试用版。


    我们假设您选择后者——点击 **Faceware Studio** 下的**立即试用**，如*图 9.1*所示。


    ![Figure 9.1: Faceware 定价选项](img/B17878_09_01.jpg)


    图 9.1：Faceware 定价选项


    您将受邀注册 Faceware 账户，如*图 9.2*所示：


    ![Figure 9.2: 注册账户](img/B17878_09_02.jpg)


    图 9.2：注册账户


    设置好账户后，导航到页面顶部并点击**下载**。这将带您进入可用下载列表。从*图 9.3*中，您可以看到 Faceware Studio 可用（如果没看到，只需向下滚动页面）。在这里，您可以点击**下载**按钮。


    ![Figure 9.3: 下载您的 30 天试用版](img/B17878_09_03.jpg)


    图 9.3：下载您的 30 天试用版


    下载完成后，打开 `installer.exe` 文件并遵循简单的屏幕说明，随后 Faceware Studio 将完成安装！


    在下一节中，我们将下载并安装 Faceware Live Link 插件，它允许 Unreal 从 Faceware 应用程序接收数据。我们还将从 Epic
    Games 下载一个设计用于配合 Faceware 工作的 MetaHuman 示例。


    # 安装 Unreal 的 Faceware 插件和 MetaHuman 示例


    要安装 Unreal 的 Faceware 插件，请打开来自*第 8 章*的项目，然后打开 Epic Games Launcher。搜索 **Faceware
    Live Link**，然后点击**安装到引擎**，如*图 9.4*所示：


    ![Figure 9.4: Epic Games Launcher Faceware Live Link 页面](img/B17878_09_04.jpg)


    图 9.4：Epic Games Launcher Faceware Live Link 页面


    插件安装完成后，在 Faceware 插件页面向下滚动，直到看到 Sample MetaHuman Blueprint 的链接，如*图 9.5*所示：


    ![Figure 9.5: 示例 MetaHuman 蓝图](img/B17878_09_05.jpg)


    图 9.5：示例 MetaHuman 蓝图


    点击**下载蓝图**链接。这将打开一个新的浏览器窗口，带您离开 Epic Launcher，您将看到以下消息：


    ![Figure 9.6: 继续前往外部网站按钮](img/B17878_09_06.jpg)


    图 9.6：继续前往外部网站按钮


    点击**继续前往外部网站**。此时，系统会询问您要将示例 MetaHuman 蓝图下载到何处。


    ![Figure 9.7: 保存示例 MetaHuman 蓝图](img/B17878_09_07.jpg)


    图 9.7：保存示例 MetaHuman 蓝图


    您可以暂时将其下载到临时位置，或者直接下载到项目内的 `MetaHumans` 文件夹中。如果您不知道项目文件夹在电脑的何处，可以返回 Unreal 项目，前往内容浏览器查找。在那里，右键点击
    `MetaHumans` 文件夹并选择 `在资源管理器中显示`，如*图 9.8*所示。


    ![Figure 9.8: 定位您的项目文件夹](img/B17878_09_08.jpg)


    图 9.8：定位您的项目文件夹


    点击 `在资源管理器中显示` 将打开 Windows 资源管理器，以便我们在 Unreal 之外独立查看项目文件的位置。类似于我在*图 9.9*中所做的，复制您机器上
    `MetaHumans` 文件夹位置的文件路径。现在我们将把示例蓝图保存到上一章创建的项目 `MetaHumans` 文件夹中。


    ![Figure 9.9: 复制项目位置](img/B17878_09_09.jpg)


    图 9.9：复制项目位置


    这样做会将蓝图保存到您的项目文件夹中；但是，它将是一个压缩文件；您需要将其解压到同一文件夹中。完成后，重启 Unreal。重启期间，MetaHuman 示例将更新您的项目，以确保
    MetaHuman 能与 Faceware 插件配合工作。


    在下一节中，我们将转到 Faceware Studio 软件，使用网络摄像头追踪我们的面部。


    # 设置网络摄像头和流式传输功能


    下一步是确保您拥有一个正常工作的网络摄像头或其他与电脑连接正常的摄像头。如果您有在 Zoom 或 Teams 等应用程序中使用过的摄像头，它也能在 Faceware
    中工作。


    *   因此，启动 Faceware Studio 软件。您应该会看到一个类似于*图 9.10*所示的界面：


    ![Figure 9.10: Faceware 界面](img/B17878_09_10.jpg)


    图 9.10：Faceware 界面


    要设置我们的网络摄像头和流式传输功能，我们需要探索**实时设置**面板和**流式传输**面板。


    ## 实时设置面板


    屏幕左侧是**实时设置**面板。在**输入类型**下，点击下拉菜单并选择您的网络摄像头。只要您选择一个正常工作的网络摄像头，就会获得更多选项，如*图 9.11*所示：


    ![Figure 9.11: 实时设置面板](img/B17878_09_11.jpg)


    图 9.11：实时设置面板


    让我们看看可用的选项：


    ### 输入类型


    **输入类型**面板允许您选择要使用的视频类型。因为我们的目标是将实时面部捕捉数据流式传输到 Unreal，所以我们将选择**实时**。如果您想使用位于机器上的预录制素材，可以选择**媒体**，但我们不会探讨该选项。


    ### 分辨率


    分辨率可以大到与输入的视频信号一致。因此，如果您的网络摄像头和电脑能够处理超高清网络摄像头，Faceware 不会有任何问题。在我的案例中，我的网络摄像头分辨率为
    3840 X 2160。然而，这种高分辨率没有任何优势，实际上对我们不利，因为处理所有那些高分辨率数据需要大量资源。我将分辨率降低到了更实用的 **1280
    X 720**，因为此分辨率包含良好追踪所需的所有信息，但不像我原来的选项那样数据量大。


    您还可以选择 **(MPG)**，它使用 **Motion JPEG** (**MJPEG**) 压缩/解压缩编解码算法，或者 **(H264)**，它使用
    H264 编解码算法。最终，就帧率而言，选择最适合您机器的那个，我将在下一节解释。


    ### 帧率


    帧率是精准动作捕捉的重要因素。您可能还记得在*第 5 章* *使用 Mixamo 重定向动画* 中，动作捕捉可在每秒 30 帧及以上的帧率下使用。我们的目标始终是达到每秒
    30 帧或以上的帧率，您可以在*图 9.11*中看到我已做到这一点。


    为进一步减少处理时间，您可以开启**针对实时优化**，这将降低分辨率，从而提高帧率。如果您再看一遍*图 9.11*，可以在显示网络摄像头信号的视口左上角看到分辨率的差异。我在*图
    9.12*中也提供了该信号信息的两个示例：


    ![Figure 9.12: 分辨率与帧率](img/B17878_09_12.jpg)


    图 9.12：分辨率与帧率


    您可以看到，左侧的 3840x2160 分辨率仅给我们 14.38 的视频帧率，这很差，而 1280x720 信号给我们 30.06 的视频帧率，这更好（考虑到我们
    30 fps 的目标）。

    '
