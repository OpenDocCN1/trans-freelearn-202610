    \ from taking the photos to getting a usable 3D model only took around 10 minutes.\n\
    \n![Figure 11.10: 3D scan result](image/B17878_11_10.jpg)\n\n*Figure 11.10: 3D\
    \ scan result*\n\nThe next step couldn’t be simpler. Just hit the **Export** button,\
    \ which will take you to this screen:\n\n![Figure 11.11: Sending your exported\
    \ model](image/B17878_11_11.jpg)\n\n*Figure 11.11: Sending your exported model*\n\
    \nIn *Figure 11.11*, you are given the option to supply an email address. Once\
    \ provided, hit **Send** to receive a download link to your model. It will come\
    \ in the form of a **.zip** folder containing both the OBJ of the mesh and a JPG\
    \ for the texture map. Make sure to unzip the folder before continuing.\n\nIn\
    \ the next section, you will bring your face mesh into Unreal Engine.\n\n# Importing\
    \ your scanned mesh into Unreal Engine\n\nWith Unreal Engine open, go to the **Content**\
    \ folder and create a new folder inside it called **FaceMesh**. Inside the **FaceMesh**\
    \ folder, right-click and select **Import to Game/FaceMesh**. This will bring\
    \ up the import dialog box, as per *Figure 11.12*, where you’ll see the JPG (on\
    \ the left of the figure) and OBJ files (on the right):\n\n![Figure 11.12: The\
    \ JPG and OBJ files](image/B17878_11_12.jpg)\n\n*Figure 11.12: The JPG and OBJ\
    \ files*\n\nYou just need to click on the **3DModel** OBJ file, then hit **OK**.\n\
    \nThis will open up **FBX Import Options**, as per *Figure 11.13* (this may seem\
    \ odd as the file is an OBJ file, but this is correct):\n\n![Figure 11.13: Import\
    \ mesh options](image/B17878_11_13.jpg)\n\n*Figure 11.13: Import mesh options*\n\
    \nMake sure you have ticked **Combine Meshes** to ensure the model is imported\
    \ as just one singular mesh. This is the only option that needs to be changed.\
    \ Then, click on **Import All**.\n\nIt will take a moment to import. You will\
    \ most likely get an error log dialog box saying there are issues in the smoothing\
    \ group, but this is completely normal so don’t be alarmed. If it happens, it\
    \ will occur at the end of the import process so there is no action to be taken.\n\
    \nOnce imported, as seen in *Figure 11.14*, there are three assets in the **FaceMesh**\
    \ folder: the model, the shader, and the texture map, which automatically created\
    \ the shader.\n\n![Figure 11.14: The imported assets](image/B17878_11_14.jpg)\n\
    \n*Figure 11.14: The imported assets*\n\nNow, right-click inside the **FaceMesh**\
    \ folder, navigate down to **MetaHuman**, and click on **MetaHuman Identity**.\
    \ This will engage the new Mesh to MetaHuman plugin you installed into the engine\
    \ at the beginning of this chapter.\n\n![Figure 11.15: Creating a MetaHuman Identity\
    \ Asset](image/B17878_11_15.jpg)\n\n*Figure 11.15: Creating a MetaHuman Identity\
    \ Asset*\n\nBy clicking on **MetaHuman Identity**, you will create a MetaHuman\
    \ Identity Asset, which is required to use the 3D scan you just imported.\n\n\
    Now, double-click on the **MetaHuman Identity** icon once it is created within\
    \ **FaceMesh**. MetaHuman Identity, as seen in *Figure 11.16*, has a relatively\
    \ simple interface that consists of four main functions.\n\n![Figure 11.16: The\
    \ MetaHuman Identity interface](image/B17878_11_16.jpg)\n\n*Figure 11.16: The\
    \ MetaHuman Identity interface*\n\nHighlighted from left to right, the functions\
    \ of the MetaHuman Identity interface are:\n\n*   **Components from Mesh**: Where\
    \ we bring in the mesh that we imported into the engine earlier\n*   **Promote\
    \ Frame**: Where we set up a viewing angle of our mesh for MetaHuman Identity\
    \ to use as a reference for where key features such as the eyes, nose, and mouth\
    \ are\n*   **Track Active Frame**: Where MetaHuman Identity uses a facial recognition\
    \ algorithm to determine key facial features from the new face mesh\n*   **MetaHuman\
    \ Identity Solve**: Where the magic happens, creating a MetaHuman that is aligned\
    \ to the proportions of the new face mesh\n\nNote that I have highlighted each\
    \ of the four functions in *Figure 11.16*. The far-left function, **Components\
    \ from Mesh**, is the only one that is active. The rest are inactive as each is\
    \ dependent on the previous one to work, working as a series of steps that we\
    \ must follow in order.\n\nWe will now go through these four functions:\n\n1.\
    \  Click on **Components from Mesh** and choose your model:\n\n    ![Figure 11.17:\
    \ Adding your scanned mesh](image/B17878_11_17.jpg)\n\n    *Figure 11.17: Adding\
    \ your scanned mesh*\n\n    Then use the *F* key to center your model, and use\
    \ the rotate gizmo with the *E* key to make your model face forward.\n\n    ![Figure\
    \ 11.18: Rotating the model](image/B17878_11_18.jpg)\n\n    *Figure 11.18: Rotating\
    \ the model*\n\n2.  When you are happy with the positioning of the face mesh,\
    \ click on **Promote Frame** to save the angle.\n\n    ![Figure 11.19: Promote\
    \ Frame](image/B17878_11_19.jpg)\n\n    *Figure 11.19: Promote Frame*\n\n    If\
    \ you take a look at *Figure 11.19*, you can see that under the viewport we now\
    \ have a promoted frame titled **Frame 0**. This tells us that a frame has been\
    \ created that will be used as a reference. You can create additional frames by\
    \ clicking on the camera icon (in the bottom right), which will allow you to get\
    \ a new angle. Then, you need to click on the **Promote Frame** button again.\
    \ However, for the purpose of this chapter, let’s keep things simple and just\
    \ use **Promote Frame** once.\n\n3.  Moving on, we need to make sure that the\
    \ face mesh can be properly tracked. Click on the **Track Active Frame** button,\
    \ as highlighted in *Figure 11.20*.\n\n    ![Figure 11.20: Track Active Frame](image/B17878_11_20.jpg)\n\
    \n    *Figure 11.20: Track Active Frame*\n\n    The MetaHuman Identity tool tracks\
    \ the facial features that it sees. To make sure it’s doing a good job, I suggest\
    \ you toggle between **Lit** and **Unlit** in the viewport marked in *Figure 11.20*.\
    \ In general, it does a great job at identifying the eyes and the mouth, which\
    \ is enough to get you a really good likeness to your face scan.\n\n4.  Next,\
    \ we need to create a body type for the new MetaHuman. Take a look at *Figure\
    \ 11.21*. Select **Body** and then choose a body type close to your own.\n\n \
    \   ![Figure 11.21: Choosing a body](image/B17878_11_21.jpg)\n\n    *Figure 11.21:\
    \ Choosing a body*\n\n5.  Now, we need to process the new mesh shape from the\
    \ face mesh scan. Click on **MetaHuman Identity Solve**, as per *Figure 11.22*.\n\
    \n    ![Figure 11.22: Waiting for MetaHuman backend…](image/B17878_11_22.jpg)\n\
    \n    *Figure 11.22: Waiting for MetaHuman backend…*\n\n    You’ll see a prompt\
    \ in the bottom right of the screen saying **Waiting For MetaHuman backend…**.\
    \ This is because the processing will take place on the MetaHuman Cloud as it\
    \ creates a MetaHuman Solution.\n\n6.  The process of waiting for the backend\
    \ can take a few minutes, but as soon as it has completed, the **Mesh to MetaHuman**\
    \ button will be available to select, as shown in *Figure 11.23*.\n\n    ![Figure\
    \ 11.23: The Mesh to MetaHuman button](image/B17878_11_23.jpg)\n\n    *Figure\
    \ 11.23: The Mesh to MetaHuman button*\n"
  trans: "\n完成选择后，点击那个大大的**上传**按钮。上传过程取决于你的网络连接速度；如果你的连接不稳定，可能会遇到问题，因为你可能需要重复上传过程。照片成功上传后，你将看到以下消息：\n\
    \n![图 11.9：上传成功通知](img/B17878_11_09.jpg)\n\n*图 11.9：上传成功通知*\n\n有几个因素需要考虑进你照片的处理时间中。因为处理工作由云端服务器负责，你的上传任务极有可能被放入了队列中。所以，如果流量很大，你就得耐心等待几分钟。如果你的任务被放入队列或已开始处理，你会收到提示，并且可以在应用内查看其状态。\n\
    \n一旦流程启动，模型的创建速度会快得惊人。完成后，你可以打开它来检查模型。在*图 11.10*中，你可以看到我的一个模型。我知道你可能会被我天使般的外表分散注意力，所以我就简短地说一下：从拍照到获得可用的\
    \ 3D 模型，整个过程从头到尾只花了大约 10 分钟。\n\n![图 11.10：3D 扫描结果](img/B17878_11_10.jpg)\n\n*图\
    \ 11.10：3D 扫描结果*\n\n下一步再简单不过了。只需点击**导出**按钮，即可进入此界面：\n\n![图 11.11：发送你导出的模型](img/B17878_11_11.jpg)\n\
    \n*图 11.11：发送你导出的模型*\n\n在*图 11.11*中，你可以选择提供一个电子邮件地址。提供后，点击**发送**以接收模型的下载链接。它将以**.zip**文件夹的形式发送，其中包含网格的\
    \ OBJ 文件和用于纹理贴图的 JPG 文件。继续之前，请务必解压该文件夹。\n\n在下一节中，你将把面部网格导入 Unreal Engine。\n\n\
    # 将扫描的网格导入 Unreal Engine\n\n打开 Unreal Engine 后，前往**内容**文件夹，并在其中创建一个名为**FaceMesh**的新文件夹。在**FaceMesh**文件夹内，右键点击并选择**导入到\
    \ Game/FaceMesh**。这将弹出导入对话框，如*图 11.12*所示，你将看到 JPG 文件（图中左侧）和 OBJ 文件（右侧）：\n\n![图\
    \ 11.12：JPG 和 OBJ 文件](img/B17878_11_12.jpg)\n\n*图 11.12：JPG 和 OBJ 文件*\n\n你只需点击**3DModel**\
    \ OBJ 文件，然后点击**确定**。\n\n这将打开**FBX 导入选项**，如*图 11.13*所示（这看起来可能有点奇怪，因为文件是 OBJ 格式，但这是正确的）：\n\
    \n![图 11.13：导入网格选项](img/B17878_11_13.jpg)\n\n*图 11.13：导入网格选项*\n\n确保勾选了**合并网格**，以确保模型作为单个网格导入。这是唯一需要更改的选项。然后，点击**全部导入**。\n\
    \n导入需要片刻时间。你很可能会收到一个错误日志对话框，提示平滑组存在问题，但这完全正常，不用担心。如果发生这种情况，它会在导入过程结束时出现，因此无需采取任何措施。\n\
    \n导入完成后，如*图 11.14*所示，**FaceMesh**文件夹中将有三个资产：模型、着色器和纹理贴图，后者会自动创建着色器。\n\n![图 11.14：导入的资产](img/B17878_11_14.jpg)\n\
    \n*图 11.14：导入的资产*\n\n现在，在**FaceMesh**文件夹内右键点击，向下导航到**MetaHuman**，然后点击**MetaHuman\
    \ Identity**。这将启用你在本章开头安装到引擎中的新 Mesh to MetaHuman 插件。\n\n![图 11.15：创建 MetaHuman\
    \ Identity 资产](img/B17878_11_15.jpg)\n\n*图 11.15：创建 MetaHuman Identity 资产*\n\n\
    点击**MetaHuman Identity**后，将创建一个 MetaHuman Identity 资产，这是使用刚才导入的 3D 扫描所必需的。\n\n\
    现在，**MetaHuman Identity**图标在**FaceMesh**中创建好后，双击它。如*图 11.16*所示，MetaHuman Identity\
    \ 拥有一个相对简单的界面，包含四个主要功能。\n\n![图 11.16：MetaHuman Identity 界面](img/B17878_11_16.jpg)\n\
    \n*图 11.16：MetaHuman Identity 界面*\n\n从左到右高亮显示的 MetaHuman Identity 界面功能如下：\n\n\
    *   **来自网格的组件**：我们将之前导入引擎的网格引入此处\n*   **提升帧**：我们在此设置网格的观察角度，供 MetaHuman Identity\
    \ 用作参考，以确定眼睛、鼻子和嘴巴等关键特征的位置\n*   **追踪活动帧**：MetaHuman Identity 使用面部识别算法从新的面部网格中确定关键面部特征\n\
    *   **MetaHuman Identity 求解**：奇迹发生的地方，创建一个与新面部网格比例对齐的 MetaHuman\n\n请注意，我在*图 11.16*中高亮显示了这四个功能中的每一个。最左侧的功能**来自网格的组件**是唯一处于激活状态的功能。其余功能均处于非激活状态，因为每个功能都依赖于前一个功能才能工作，它们作为一系列必须按顺序遵循的步骤运作。\n\
    \n我们现在将逐步介绍这四个功能：\n\n1.  点击**来自网格的组件**并选择你的模型：\n\n    ![图 11.17：添加你扫描的网格](img/B17878_11_17.jpg)\n\
    \n    *图 11.17：添加你扫描的网格*\n\n    然后按 *F* 键将模型居中，并使用 *E* 键配合旋转小工具使模型面朝前方。\n\n  \
    \  ![图 11.18：旋转模型](img/B17878_11_18.jpg)\n\n    *图 11.18：旋转模型*\n\n2.  当你对面部网格的定位满意时，点击**提升帧**以保存角度。\n\
    \n    ![图 11.19：提升帧](img/B17878_11_19.jpg)\n\n    *图 11.19：提升帧*\n\n    如果你看一下*图\
    \ 11.19*，可以看到视口下方现在有一个名为**帧 0**的提升帧。这表明已创建一个帧，将用作参考。你可以通过点击相机图标（右下角）来创建额外的帧，这将允许你获得一个新角度。然后，你需要再次点击**提升帧**按钮。不过，为了本章的目的，我们保持简单，只使用一次**提升帧**。\n\
    \n3.  接下来，我们需要确保面部网格能被正确追踪。点击**追踪活动帧**按钮，如*图 11.20*中高亮显示的那样。\n\n    ![图 11.20：追踪活动帧](img/B17878_11_20.jpg)\n\
    \n    *图 11.20：追踪活动帧*\n\n    MetaHuman Identity 工具会追踪它所看到的面部特征。为了确保它工作良好，我建议你在*图\
    \ 11.20*中标记的视口里切换**光照**和**无光照**模式。一般来说，它在识别眼睛和嘴巴方面做得很好，这足以让你获得一个与面部扫描高度相似的模型。\n\
    \n4.  接下来，我们需要为新的 MetaHuman 创建一个体型。请看*图 11.21*。选择**身体**，然后选择一个接近你自己的体型。\n\n  \
    \  ![图 11.21：选择身体](img/B17878_11_21.jpg)\n\n    *图 11.21：选择身体*\n\n5.  现在，我们需要处理来自面部网格扫描的新网格形状。点击**MetaHuman\
    \ Identity 求解**，如*图 11.22*所示。\n\n    ![图 11.22：等待 MetaHuman 后端……](img/B17878_11_22.jpg)\n\
    \n    *图 11.22：等待 MetaHuman 后端……*\n\n    你会在屏幕右下角看到一条提示，显示**正在等待 MetaHuman 后端……**。这是因为处理将在\
    \ MetaHuman 云端进行，因为它要创建一个 MetaHuman 解决方案。\n\n6.  等待后端的过程可能需要几分钟，但一旦完成，**网格转 MetaHuman**按钮将可供选择，如*图\
    \ 11.23*所示。\n\n    ![图 11.23：网格转 MetaHuman 按钮](img/B17878_11_23.jpg)\n\n    *图\
    \ 11.23：网格转 MetaHuman 按钮*\n"
