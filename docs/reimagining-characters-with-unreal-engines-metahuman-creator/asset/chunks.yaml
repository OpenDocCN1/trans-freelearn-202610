    Now that you have a good understanding of Unreal Engine and MetaHumans, we will
    get the software up and running on your system so you can start using Unreal in
    the next chapter.


    # Setting up Unreal and the MetaHuman Creator


    Before we can start using Unreal Engine and MetaHumans, we need to do some setup.
    In upcoming sections, we will do the following:


    *   Create an Unreal account

    *   Download and install Unreal Engine 5

    *   Launch Unreal Engine 5

    *   Install Quixel Bridge

    *   Boot up MetaHuman Creator


    So, let’s get started.


    ## Creating an Epic account


    To get started with Unreal, the first thing you need to do is create an Epic account.
    To do this, follow these instructions:


    1.  First navigate to the Epic Games website: `https://www.epicgames.com/`.


    > **Note**

    >

    > Depending on your region, don’t be surprised if the URL changes to something
    like the following: `https://www.epicgames.com/store/en-US/` (you’re still in
    the right place).


    2.  Once on the Epic Games website, you can navigate to the Unreal Engine link.
    Alternatively, just use the following URL: `https://www.unrealengine.com/`.


    3.  In the right-hand corner, click `Sign In` (even though you don’t have sign-in
    credentials, you must still click on this).


    4.  You’ll see a list of ways you can sign in, including using your email account
    with a bespoke password or just simply linking other social media or gaming credentials
    to Epic Games. Assuming this is your first account and you’re not signed in, select
    `Don’t have an Epic Games account? Sign Up`:


    ![Figure 1.1: Different sign-in methods](image/B17878_01.01.jpg)


    Figure 1.1: Different sign-in methods


    5.  On the next page, you will be asked for your name, surname, username, and
    email, and to designate a password for your email. You can opt to receive additional
    emails, but you will need to read the terms and conditions and tick that you have
    done so.


    ![Figure 1.2: Signing up for Epic](image/B17878_01.02.jpg)


    Figure 1.2: Signing up for Epic


    6.  Once you have done this, a link will be sent to your designated email for
    verification. When you click on this link, you’ll have successfully created an
    account. You’ll need to be logged in whenever you plan to use the engine.


    Next, we need to download and install Unreal Engine 5.


    ## Downloading and installing Unreal Engine 5


    Using your Unreal account, we need to download and install Unreal Engine 5. The
    application you are about to install is the Epic Games Launcher. This is where
    you install the engine and gain access to other features related to the engine,
    such as updates, plug-ins, scripts, models, and a host of many other assets. To
    do this, follow these steps:


    1.  Once you have successfully signed in to Epic, you’ll see a page like this
    (the page may vary, as the screenshot is the latest marketing material from Epic
    at the time of print):


    ![Figure 1.3: Epic splash screen](image/B17878_01.03.jpg)


    Figure 1.3: Epic splash screen


    In the top right corner, you will see your name, as well as the `Download` button.
    Click this to take you to the following page:


    ![Figure 1.4: Licensing options](image/B17878_01.04.jpg)


    Figure 1.4: Licensing options


    For the purpose of this book, we’ll assume you’re in the film and animation business
    and not the game development business. The column on the left is a `Publishing
    License` agreement for game developers where a percentage of sales profits go
    to Epic Games. You just need to concern yourself with the column on the right:
    `Creators License`. In most cases, the readers of this book will fall under `Students,
    educators, and personal learning`. However, professionals delivering `linear content`,
    such as film and animation, fall under the `Creators License` option.


    2.  When you’ve read through the details and have had a look at the EULA license
    agreement, hit the `DOWNLOAD NOW` button under `Creators License`.


    3.  Now, choose where you want to download the installer, which will be called
    something similar to `EpicInstaller013.0.0.enterprise.msi`. It’s a Windows installer
    package and can be saved anywhere on your machine. You only need this file for
    the installation process.


    ![Figure 1.5: Downloading the installer](image/B17878_01.05.jpg)


    Figure 1.5: Downloading the installer


    When you have found a suitable place, hit `Save`.


    4.  Once downloaded, double-click the file and it will run:


    ![Figure 1.6: The Epic Games Launcher](image/B17878_01.06.jpg)


    Figure 1.6: The Epic Games Launcher


    5.  Now, you can click `Install`.


    When the installer has finished, you’ll see an icon titled `Epic Games Launcher`
    on your desktop. Clicking on this will open the Launcher (note that it could take
    a few minutes to open the first time). Typically, it doesn’t open fullscreen but
    when it does, it looks something like this:


    ![Figure 1.7: The Epic Games Launcher application](image/B17878_01.07.jpg)


    Figure 1.7: The Epic Games Launcher application


    From here, you’ll see a few tabs running along the top to the right of the Epic
    Games icon. Most notably, we have the following:


    *   `UE4`: For blogs, UE4 version updates, and general news

    *   `Learn`: Opens the learning center, where you can watch tutorials and download
    sample projects

    *   `Marketplace`: Where you can buy models, environments, and characters designed
    to work in Unreal Engine

    *   `Library`: Used to find content that you have saved, purchased, or installed

    *   `Twinmotion`: An architectural pre-visualization application, with assets
    and presets designed specifically for architectural real-time pre-visualization

    *   `UE5`: Where you will install UE5 from


    From `UE5`, click `Download UE5`, and the installer starts installing immediately.
    You will see this happening either in the `UE5` tab or it may flip over to the
    `Library` tab and show you the progress of this download.


    ![Figure 1.8: Engine versions](image/B17878_01.08.jpg)


    Figure 1.8: Engine versions


    The installation does take a while, so you may want to come back to this.


    > **Note**

    >

    > At the time of writing, UE5 is only under Early Access. This means that it’s
    not technically supported for any production and the new features exclusive to
    this release are deemed experimental.


    In the next section, we will launch UE5!


    ## Launching UE5


    After you have followed all of the previous instructions and the installer has
    finished installing, you will see `Launch` appear; this indicates that Unreal
    Engine is ready to go.


    When you have clicked `Launch` (making sure you have selected UE 5.0), you may
    receive pop-up dialog boxes such as the following: `The Megascans Plugin was designed
    for build 4.27.0. Attempt to load it anyway?` Messages such as this are precautionary
    because not everything has been tested to work with UE5 at the time of writing.
    However, as I have tested them with the Early Access edition, I know they are
    safe and stable, so it is okay to select `Yes`.


    Next, you’ll see a small splash screen as Unreal Engine initializes. This could
    take a few minutes the first time it runs. Eventually, it will lead to the following
    interface:


    ![Figure 1.9: Unreal Project Browser](image/B17878_01.09.jpg)


    Figure 1.9: Unreal Project Browser


    On the left-hand side, you’ll see a column listing the following:


    *   `RECENT PROJECTS`

    *   `GAMES`

    *   `FILM / VIDEO & LIVE EVENTS`

    *   `ARCHITECTURE ENGINEERING & CONSTRUCTION`

    *   `AUTOMOTIVE PRODUCT DESIGN & MANUFACTURING`


    Each one of the listings gives you templates to choose from. Each template will
    automatically load certain settings and enable various preinstalled plugins required
    for that nature of work.


    Because we are just interested in `FILM / VIDEO & LIVE EVENTS`, when we click
    on that, we get to choose from a small number of templates related to that type
    of work:


    *   `Blank`

    *   `Virtual Production`

    *   `DMX`

    *   `InCameraVFX`

