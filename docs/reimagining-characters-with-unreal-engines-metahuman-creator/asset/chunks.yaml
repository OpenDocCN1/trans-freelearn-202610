    # Character Customization in MetaHuman Creator


    ## Blend Function


    First, we will take a look at the `Blend` function. Put simply, `Blend` allows
    us to blend the facial features of our chosen template with other existing templates.
    This is a great starting point as it is a very intuitive process. For example,
    we may have selected a male character from our template, but we would like to
    make him look a little more feminine or perhaps older. Taking that second example,
    we can target the eyes and blend just the eyes with that of an older character
    template.


    In `Figure 2.10`, I have dragged three template characters into the circle at
    the top left. The Glenda character in the main viewport on the right is now set
    for editing:


    ![Figure 2.10: Edit points](image/B17878_02_10.jpg)


    Figure 2.10: Edit points


    Take a close look at the many small and very subtle circles around her face. Each
    circle represents a feature of the face that is editable. By left-clicking a small
    circle and dragging in the direction of one of the three characters I have added
    to the left, it will blend that feature into the corresponding feature in the
    main viewport. I have placed a young lady at the top, so if I click and drag upward,
    just the eyes will blend into the eyes of the young lady’s eyes:


    ![Figure 2.11: Blending the eyes by clicking and dragging](image/B17878_02_11.jpg)


    Figure 2.11: Blending the eyes by clicking and dragging


    > **Note:** The edit points are very subtle. You must click on a point in the
    main viewport on the right and drag toward your preferred character in the corresponding
    circle on the highlighted viewport.


    In the example given here, I have loaded up three characters into the `Blend`
    viewport on the left. You can load up as many as six templates but note that the
    first three will have a greater influence. The second set of three, denoted by
    the smaller circles (which I have left empty), is helpful for subtle blending.


    Editing a character with blending requires a little planning. It’s best practice
    to choose a character that resembles your desired design as much as possible and
    then use the `Blend` option to get the template as close to your imagined design.


    ## Skin Editor


    While we can do quite a lot with the `Blend` tool, such as changing the shape
    of facial attributes, it isn’t helpful if you want to change a character’s skin
    tone. This is where the `Skin` editor comes in useful, as shown in `Figure 2.12`:


    ![Figure 2.12: Skin](image/B17878_02_12.jpg)


    Figure 2.12: Skin


    Here are some features that we can edit when it comes to skin:


    *   **`Texture`**: A very important feature when it comes to aging or de-aging
    your character. It introduces fine lines and wrinkles but also broader deformation
    such as sagging skin.

    *   **`Contrast`**: This is another useful feature for aging your character, further
    deepening those wrinkles and folds.

    *   **`Roughness`**: In CGI, the word “roughness” is a common term used to describe
    how shiny or reflective a surface is. We know that if a surface is rough, light
    isn’t bounced back in as much of a direct way as that of a smooth surface such
    as a mirror. On skin, a smooth surface could be due to the oiliness of the surface,
    and this gives us a more realistic effect. Rarely do we get a completely rough
    surface on the skin without the help of foundation makeup. Another factor that
    introduces roughness to skin is the micro hair follicles on the surface of the
    skin, which are barely visible to the human eye but are factored into the final
    model. (At the time of writing, there is no direct way to edit roughness in terms
    of both skin and micro follicles within the MHC, but they are editable once we
    get into advanced editing within Unreal Engine.)


    `Figure 2.13` is the Glenda character with `Texture`, `Contrast`, and `Roughness`
    set to zero. The reduction of texture and contrast makes her look much younger;
    we can see that contrast had a significant impact on the geometry (shape) of her
    face:


    ![Figure 2.13: Texture, Contrast, and Roughness](image/B17878_02_13.jpg)


    Figure 2.13: Texture, Contrast, and Roughness


    However, the reduction of roughness down to zero does give us a slightly unrealistic
    look, which is probably not what you want. You can play with these settings to
    make the skin look more realistic.


    ## Freckles


    In `Figure 2.14`, you can see that I have re-applied all the texture and contrast
    that the Glenda template had before and that I have now added freckles:


    ![Figure 2.14: Freckles](image/B17878_02_14.jpg)


    Figure 2.14: Freckles


    Note the four gray images – each of these are presets of freckle patterns. The
    fourth is the most prominent freckle pattern with the highest density. In this
    example, I have the density up high just for illustration, but subtle use of this
    tool will give you very realistic results.


    Be sure to edit the saturation and strength to your liking. As you add freckles,
    no matter how extreme or subtle you want them, it is helpful to go back to the
    `Skin` tab and play around with texture, contrast, and roughness again. One reason
    is that the addition of freckles will change the overall skin tone of your character
    and you may want to adjust the tone under the skin adjustment to compensate. By
    adding saturation to your freckles, the overall saturation of the face will also
    naturally increase.


    While we are on the subject of skin tone, the MHC has four preview features that
    need to be considered for making more informed decisions on skin tone. Due to
    the subtle variations prevalent in skin tones, additional features that allow
    us to see those variations are very welcome. Those features are as follows:


    *   `Lighting`

    *   `Camera`

    *   `Render Quality`

    *   `LOD`


    You can see these options here:


    ![Figure 2.15: Viewing options](image/B17878_02_15.jpg)


    Figure 2.15: Viewing options


    Let’s take a look at each option now.


    ### Lighting


    In most of MHC’s lighting setups, `image-based lighting` is used. Put simply,
    an image-based light is a sphere that has an image on the inside that is used
    as a light source for the entire scene. This gives us a very realistic lighting
    result and is also a process used within Unreal. To understand image-based lighting
    in the real world, take a large piece of paper and hold it close to your computer
    monitor, and play a video full frame. Make sure all your lights are off and your
    computer screen is at full brightness. You’ll see that the screen is now lighting
    the piece of paper, with the video influencing both intensity and color. The more
    reflective the paper, the more obvious the lighting influence is to the eye.


    If you click `Studio`, which you can see in `Figure 2.15`, you’ll see several
    lighting setups that will help you design a particular scene you have in mind.
    There are 13 lighting presets, which you can see in `Figure 2.16`:


    ![Figure 2.16: Various lighting rigs](image/B17878_02_16.jpg)


    Figure 2.16: Various lighting rigs


    Let’s go through each option now:


    *   **`Studio`** (the default setting): A lighting setup made of a small number
    of soft lights to mimic soft photography lighting. This is the default lighting
    rig.

    *   **`Indoor`**: This preset consists of lighting that utilizes an image rather
    than a set of lights (as explained, this is known as image-based lighting). In
    this case, it is an image of an interior, captured at an angle of 360 degrees,
    giving us realistic lighting from every angle. This preset allows users to see
    their characters with the level of contrast typical of when a subject is lit from
    a window and reflective ambient light.

    *   **`Outdoor`**: This is another example of image-based light that allows the
    user to see the effects of outdoor ambient light but also the harshness of direct
    sunlight and the resulting shadows cast on the character’s skin.

