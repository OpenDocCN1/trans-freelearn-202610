    \ as much as you want without finding any unusable oddities within any given range\
    \ of motion during the MHC session.\n\nWhile we are in the preview mode, it is\
    \ worth getting to know some of the hotkeys, which will allow you to preview the\
    \ range of motion or character in static form at any angle you wish. If you take\
    \ a look at the **HOTKEY REFERENCE** area shown in *Figure 2**.7*, you’ll notice\
    \ a list of keyboard and mouse click combinations that will allow you to navigate\
    \ freely:\n\n![Figure 2.7: HOTKEY REFERENCE ](image/B17878_02_07.jpg) \n\nFigure\
    \ 2.7: HOTKEY REFERENCE\n\nIf you are new to 3D applications such as Maya and\
    \ Unreal, it is certainly worth paying close attention to these as some of the\
    \ navigation hotkeys are the same. You can have a lot of fun simply navigating\
    \ around the viewport of the MHC while previewing the animations.\n\nIn this section,\
    \ we launched our MetaHumans session and started to become familiar with the interface\
    \ where we will be spending most of our time designing the character. In the next\
    \ section, we will look at the face. This section will be split into several subsections\
    \ to coincide with how it is broken down in the MHC interface.\n\n# Editing your\
    \ MetaHuman\n\nNow, it’s time to edit your MetaHuman. You can find the editable\
    \ parameters at the top right of the interface, as per *Figure 2**.8*:\n\n![Figure.\
    \ 2.8: FACE, HAIR, and BODY ](image/B17878_02_08.jpg) \n\nFigure. 2.8: FACE, HAIR,\
    \ and BODY\n\nWe’re going to go through all of these options in the upcoming sections.\
    \ All of these are very powerful editors and, as I write this, I’m confident that\
    \ Quixel and Epic Games will have added more functionality by the time this book\
    \ goes to print.\n\n## Face\n\nFirst, we’ll take at the editable options for our\
    \ MetaHuman’s face. Under **FACE**, we have the following subcategories:\n\n*\
    \   **Blend**\n\n*   **Skin**\n\n*   **Eyes**\n\n*   **Teeth**\n\n*   **Makeup**\n\
    \nLet’s explore these five subcategories now. To get started, ensure you have\
    \ stopped the animation preview of any range of motion. In *Figure 2**.9*, we\
    \ can see a couple of options to choose from:\n\n![Figure 2.9: Choosing BLEND\
    \ ](image/B17878_02_09.jpg) \n\nFigure 2.9: Choosing BLEND\n\nWe will want to\
    \ click **BLEND** to continue to the next section.\n\n### Blend"
  fmt: '

    # Starting MetaHuman Creator


    ## Launching Quixel Bridge


    When you are ready, go to Quixel `Bridge` and open up `MetaHuman`. You can do
    this easily by simply typing in `Bridge` next to the Windows start icon at the
    bottom left of the screen and then hitting `Enter`. This will start up Quixel
    `Bridge`, as shown in Figure 2.1:


    ![Figure 2.1: Starting up Bridge](image/B17878_02_01.jpg)


    Figure 2.1: Starting up Bridge


    Take note of the column on the left-hand side. Clicking on the person icon will
    bring up the `MHC` templates, which you need to choose from before you can start
    your `MHC` session. This will bring up a few images of male and female MetaHumans
    with a wide range of ethnicities and age groups.


    Clicking on a profile will open a panel on the right, showing you an enlarged
    image of your selection and the character''s name, as shown in Figure 2.2:


    ![Figure 2.2: Starting the MHC](image/B17878_02_02.jpg)


    Figure 2.2: Starting the MHC


    You''ll notice further options at the bottom of the screen, such as `Resolution`,
    but we will come back to those at the end of this chapter. All you need to do
    to start your first character creation session is to click `START MHC`.


    Once you do this, a web browser will appear, similar to what''s shown in Figure
    2.3:


    ![Figure 2.3: Waiting for the MetaHuman Creator connection](image/B17878_02_03.jpg)


    Figure 2.3: Waiting for the MetaHuman Creator connection


    At this point, you may need to be patient as the session can take seconds, if
    not minutes, to boot up. However, now is not the time to run off to the kitchen
    to make a cup of tea. The reason is that the `MHC` will also time out if left
    idle for a few minutes. If you do happen to walk away mid-session and find that
    the session has closed due to the session being idle, simply refresh your web
    browser and it will start up again.


    Once the session has loaded, you can choose another template if you want. If,
    however, you have had a previous `MHC` session, `Bridge` will automatically save
    your session under `MY METAHUMANS`.


    However, if you''re happy with your original selection, click `NEXT`, as shown
    in Figure 2.4:


    ![Figure 2.4: Choosing from CREATE METAHUMAN or MY METAHUMANS](image/B17878_02_04.jpg)


    Figure 2.4: Choosing from CREATE METAHUMAN or MY METAHUMANS


    > **Note**

    >

    > It is worth noting that by this time, you will have been given two opportunities
    to pick a template. If you have a specific character design in mind – for example,
    an elderly African-American male – it wouldn''t make sense to choose a young Caucasian
    female as a template to start from. That''s not to say you couldn''t edit one
    preset to resemble the desired design you are going for. However, while you could
    potentially edit the ethnicity of your character from one to the next, you will
    have problems when it comes to gender. This comes down to some templates having
    limited editing abilities. So, in short, ensure that you choose the age and gender
    that best matches the design you have in mind (if you have one) when you start
    your session.


    ## Starting the MHC Session


    After choosing `NEXT`, your session will begin. By default, you will be greeted
    by the template character of your choice coming to life:


    ![Figure 2.5: Editable parameters](image/B17878_02_05.jpg)


    Figure 2.5: Editable parameters


    At the bottom of the screen, you will see player controls. By default, it is on
    `PREVIEW`. Note that while in `PREVIEW` mode, you can''t make any edits to your
    character.


    However, this is a great opportunity to see just how realistic `MHC` is. You will
    be given three options to choose from when it comes to animation previews. You
    need to click on the filmstrip icon to see these options, as illustrated in Figure
    2.6:


    ![Figure 2.6: Animation previews](image/B17878_02_06.jpg)


    Figure 2.6: Animation previews


    The options are as follows:


    *   `Idle`: Provides a small range of motion, which is suitable for a background
    character.

    *   `Face ROM`: Provides a full range of motion for the face, where the animation
    is extreme enough to effectively show any potential issues that may come up should
    your project require close-up facial animation.

    *   `Body Technical ROM`: Provides animation that''s extreme enough to show any
    potential issues where there is a lot of body motion.


    > **Note**

    >

    > The `MHC` gives a range of motion designed to give you an idea of what your
    character will look like animated. It is not a definitive debugging tool for all
    possibilities of what could go right or wrong when you add your own animation.

    >

    > If you are familiar with 3D character design in the traditional sense, character
    design must take the full range of motion into account to work effectively. The
    model or mesh must allow for the desired type of movement. At a very basic level,
    the animation must not alter the mesh of the character where parts of the character
    intersect with other parts. For example, a very thin person can walk in a way
    where their hands can be closer to their sides – effectively, their wrist bones
    can come very close to their hip bones during a stride – however, this wouldn''t
    be the same for somebody larger, even with the same type of stride and range of
    motion.

    >

    > With all that said, the fidelity of `MHC` characters does a lot of this calibration.
    So, what would have been very laborious for someone working in Maya, 3ds Max,
    or Houdini to account for a varying range of motions is done automatically in
    an `MHC` session.

    >

    > We will come back to some of this later in Chapter 3, *Diving into the MetaHuman
    Blueprint*, when we introduce animation to the MetaHuman character within Unreal,
    but in short, you can push the attributes of characters as much as you want without
    finding any unusable oddities within any given range of motion during the `MHC`
    session.


    ## Hotkey Reference


    While we are in the preview mode, it is worth getting to know some of the hotkeys,
    which will allow you to preview the range of motion or character in static form
    at any angle you wish. If you take a look at the `HOTKEY REFERENCE` area shown
    in Figure 2.7, you''ll notice a list of keyboard and mouse click combinations
    that will allow you to navigate freely:


    ![Figure 2.7: HOTKEY REFERENCE](image/B17878_02_07.jpg)


    Figure 2.7: HOTKEY REFERENCE


    If you are new to 3D applications such as Maya and Unreal, it is certainly worth
    paying close attention to these as some of the navigation hotkeys are the same.
    You can have a lot of fun simply navigating around the viewport of the `MHC` while
    previewing the animations.


    In this section, we launched our MetaHumans session and started to become familiar
    with the interface where we will be spending most of our time designing the character.
    In the next section, we will look at the face. This section will be split into
    several subsections to coincide with how it is broken down in the `MHC` interface.


    # Editing Your MetaHuman


    Now, it''s time to edit your MetaHuman. You can find the editable parameters at
    the top right of the interface, as per Figure 2.8:


    ![Figure 2.8: FACE, HAIR, and BODY](image/B17878_02_08.jpg)


    Figure 2.8: FACE, HAIR, and BODY


    We''re going to go through all of these options in the upcoming sections. All
    of these are very powerful editors and, as I write this, I''m confident that Quixel
    and Epic Games will have added more functionality by the time this book goes to
    print.


    ## Face


    First, we''ll take a look at the editable options for our MetaHuman''s face. Under
    `FACE`, we have the following subcategories:


    *   `Blend`

    *   `Skin`

    *   `Eyes`

    *   `Teeth`

    *   `Makeup`


    Let''s explore these five subcategories now. To get started, ensure you have stopped
    the animation preview of any range of motion. In Figure 2.9, we can see a couple
    of options to choose from:


    ![Figure 2.9: Choosing BLEND](image/B17878_02_09.jpg)


    Figure 2.9: Choosing BLEND


    We will want to click `BLEND` to continue to the next section.


    ### Blend

    '
  trans: '


    # 启动 MetaHuman Creator


    ## 启动 Quixel Bridge


    准备就绪后，前往 Quixel `Bridge` 并打开 `MetaHuman`。你可以轻松实现这一点：只需在屏幕左下角 Windows 开始图标旁的搜索栏中输入
    `Bridge`，然后按下 `Enter` 键。这将启动 Quixel `Bridge`，如图 2.1 所示：


    ![图 2.1：启动 Bridge](img/B17878_02_01.jpg)


    图 2.1：启动 Bridge


    请注意左侧的栏目。点击人物图标将弹出 `MHC` 模板，你需要在开始 `MHC` 会话前从中进行选择。这将显示几张不同年龄段和种族的男性和女性 MetaHuman
    图像。


    点击一个配置文件将在右侧打开一个面板，显示你所选内容的放大图像及角色名称，如图 2.2 所示：


    ![图 2.2：启动 MHC](img/B17878_02_02.jpg)


    图 2.2：启动 MHC


    你会注意到屏幕底部还有进一步的选项，例如 `Resolution`（分辨率），但我们将在本章末尾再讨论这些。开始第一次角色创建会话，你只需点击 `START
    MHC`。


    执行此操作后，将出现一个网页浏览器窗口，类似于图 2.3 所示：


    ![图 2.3：等待 MetaHuman Creator 连接](img/B17878_02_03.jpg)


    图 2.3：等待 MetaHuman Creator 连接


    此时，你可能需要耐心等待，因为会话启动可能需要几秒钟，甚至几分钟。不过，现在不是去厨房泡杯茶的时候。原因在于，如果 `MHC` 闲置几分钟，也会超时。如果你确实在会话中途离开，发现会话因空闲而关闭，只需刷新网页浏览器，它就会重新启动。


    会话加载完成后，如果你愿意，可以选择另一个模板。但是，如果你之前有过 `MHC` 会话，`Bridge` 会自动将你的会话保存在 `MY METAHUMANS`
    下。


    不过，如果你对最初的选择感到满意，请点击 `NEXT`，如图 2.4 所示：


    ![图 2.4：从 CREATE METAHUMAN 或 MY METAHUMANS 中选择](img/B17878_02_04.jpg)


    图 2.4：从 CREATE METAHUMAN 或 MY METAHUMANS 中选择


    > **注意**

    >

    > 值得注意的是，到这个时候，你将有两次选择模板的机会。如果你心中已有特定的角色设计——例如，一位年迈的非裔美国男性——那么选择一位年轻的高加索女性作为起始模板就讲不通了。这并不是说你无法编辑一个预设使其类似于你想要的目标设计。然而，虽然你有可能将角色的种族从一种编辑为另一种，但在性别方面你会遇到问题。这归结为某些模板的编辑能力有限。简而言之，在开始会话时，请确保选择最符合你心中设计的年龄和性别（如果你有设计构想的话）。


    ## 开始 MHC 会话


    选择 `NEXT` 后，你的会话将开始。默认情况下，你将看到所选模板角色“活”过来：


    ![图 2.5：可编辑参数](img/B17878_02_05.jpg)


    图 2.5：可编辑参数


    在屏幕底部，你将看到播放控件。默认情况下，它处于 `PREVIEW`（预览）模式。请注意，在 `PREVIEW` 模式下，你**无法**对角色进行任何编辑。


    然而，这是一个绝佳的机会，可以亲眼见证 `MHC` 有多么逼真。对于动画预览，你将有三个选项可供选择。你需要点击胶片条图标来查看这些选项，如图 2.6 所示：


    ![图 2.6：动画预览](img/B17878_02_06.jpg)


    图 2.6：动画预览


    选项如下：


    *   `Idle`（待机）：提供一小范围的动作，适合背景角色。

    *   `Face ROM`（面部活动范围）：提供面部完整的活动范围，动作幅度足够大，能有效显示项目若需要面部特写动画时可能出现的任何潜在问题。

    *   `Body Technical ROM`（身体技术活动范围）：提供幅度足够大的动画，能显示大量身体运动时可能出现的任何潜在问题。


    > **注意**

    >

    > `MHC` 提供的活动范围旨在让你大致了解角色动画后的样子。它**并非**一个详尽的调试工具，无法涵盖你添加自有动画时所有可能出现的正确或错误情况。

    >

    > 如果你熟悉传统意义上的 3D 角色设计，角色设计必须考虑完整的活动范围才能有效工作。模型或网格体必须允许所需类型的运动。在最基本的层面上，动画不得改变角色的网格体，导致角色的各部分相互穿模。例如，一个非常瘦的人走路时手可以更贴近身体两侧——实际上，他们的腕骨在迈步时可以非常接近髋骨——但对于体型较大的人来说，即使步态和活动范围相同，情况也并非如此。

    >

    > 话虽如此，`MHC` 角色的保真度会自动完成大量此类校准工作。因此，在 Maya、3ds Max 或 Houdini 中工作时，为适应不同活动范围而需要非常繁琐的工作，在
    `MHC` 会话中会自动完成。

    >

    > 我们将在第 3 章 *深入 MetaHuman 蓝图* 中再次涉及其中一些内容，那时我们会在 Unreal 中为 MetaHuman 角色引入动画，但简而言之，在
    `MHC` 会话期间，你可以随意推高角色的属性，而不会在任何给定的活动范围内发现不可用的异常现象。


    ## 热键参考


    在预览模式下，了解一些热键很有价值，它们将允许你以任何你想要的角度预览活动范围或静态角色。如果你看一下图 2.7 所示的 `HOTKEY REFERENCE`（热键参考）区域，你会注意到一系列键盘和鼠标点击组合，它们将允许你自由导航：


    ![图 2.7：热键参考](img/B17878_02_07.jpg)


    图 2.7：热键参考


    如果你是 Maya 和 Unreal 等 3D 应用程序的新手，一定要密切关注这些热键，因为其中一些导航热键是通用的。你可以在预览动画时，仅通过在 `MHC`
    视口中自由导航就获得很多乐趣。


    在本节中，我们启动了 MetaHumans 会话，并开始熟悉将在其中花费大部分时间设计角色的界面。在下一节中，我们将着眼于面部。本节将分为几个小节，以对应
    `MHC` 界面中的细分方式。


    # 编辑你的 MetaHuman


    现在，是时候编辑你的 MetaHuman 了。你可以在界面右上角找到可编辑参数，如图 2.8 所示：


    ![图 2.8：FACE、HAIR 和 BODY](img/B17878_02_08.jpg)


    图 2.8：FACE、HAIR 和 BODY


    我们将在接下来的章节中逐一介绍所有这些选项。这些都是功能强大的编辑器，在笔者撰写本书时，我有信心 Quixel 和 Epic Games 会在本书付印前增加更多功能。


    ## 面部


    首先，我们来看看 MetaHuman 面部的可编辑选项。在 `FACE` 下，我们有以下子类别：


    *   `Blend`（融合）

    *   `Skin`（皮肤）

    *   `Eyes`（眼睛）

    *   `Teeth`（牙齿）

    *   `Makeup`（化妆）


    现在让我们来探索这五个子类别。首先，请确保你已停止任何活动范围的动画预览。在图 2.9 中，我们可以看到有几个选项可供选择：


    ![图 2.9：选择 BLEND](img/B17878_02_09.jpg)


    图 2.9：选择 BLEND


    我们需要点击 `BLEND` 以继续下一节。


    ### Blend（融合）


