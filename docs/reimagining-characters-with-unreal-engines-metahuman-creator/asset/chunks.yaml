  trans: '

    如前所述，我们有两种编辑方式。我们可以遍历 `Mannequin` 的文件夹结构并搜索骨架蓝图，但我们将采取稳妥的策略：寻找主角蓝图，并从那里导航到骨架蓝图。


    接下来，我们需要执行以下步骤：


    1. 编辑 `Mannequin` 骨架的重定向选项。

    2. 编辑 `MetaHuman` 骨架的重定向选项。


    那么，让我们开始吧。


    ## 编辑 `Mannequin` 骨架的重定向选项


    在本节中，我们将告诉虚幻引擎 `Mannequin` 角色的骨架以及我们的 `MetaHuman` 角色的骨架，我们只对它们的旋转数据感兴趣。


    一旦我们将 `Third Person` 内容包添加到项目中，我们将看到一个名为 `ThirdPersonBP` 的新文件夹，这是个好的开始。您可以在图 3.8
    中看到这一点：


    ![Figure 3.8: The ThirdPerson Character Blueprint](img/B17878_03.08.jpg)


    图 3.8：ThirdPerson 角色蓝图


    在 `ThirdPersonBP` 文件夹中有一个标记为 `Blueprints` 的文件夹，其中包含我们需要编辑的 `ThirdPersonCharacter`。双击蓝图以将其打开。


    在 `Components` 选项卡中，当按照图 3.9 点击 `Mesh (CharacterMesh0)` 时，您会注意到右侧的 `Details` 面板发生了变化。在
    `Mesh` 下，您将看到 `Skeletal Mesh`。双击 `SK_Mannequinn` 的小缩略图：


    ![Figure 3.9: Accessing the Skeletal Mesh editor tab](img/B17878_03.09.jpg)


    图 3.9：访问骨骼网格体编辑器选项卡


    这将在蓝图中打开一个额外的选项卡，该选项卡将包含两个更多选项卡，以及一个显示 `Mannequin` 及其骨架的视口，如图 3.10 所示：


    ![Figure 3.10: Inside SK_Mannequinn](img/B17878_03.10.jpg)


    图 3.10：SK_Mannequinn 内部


    这两个选项卡如下：


    * `Asset Details`：如果我们想要编辑用于重定向动画的角色，它提供了大量选项。然而，我们只对该角色的绑定及其关联的动画感兴趣。

    * `Skeleton Tree`：这是我们想要进行大部分编辑的地方。它向我们展示了每根骨头与其他骨头的关系。每根骨头都连接到 `root`。如果 `root`
    部分移动或旋转，层级结构中的其余骨头也会移动。层级结构最底部的骨头影响力最小。


    在图 3.10 的 `Skeleton Tree` 选项卡中，您可以看到从 `root` 到 `thumb` 的每根骨头都有名称。我们要做的是确保重定向选项设置为骨架，但别担心，我们不需要仔细逐个检查每根骨头。我们只需四次鼠标点击即可完成：


    1. 点击齿轮图标。

    2. 选择 `Show Retargeting Options`（显示重定向选项）。

    3. 右键点击 `pelvis`（骨盆）。

    4. 然后，左键点击 `Recursively Set Translation Retargeting Skeleton`（递归设置平移重定向为骨架）。


    让我更详细地为您演示这些步骤。所以，点击图 3.11 中高亮显示的齿轮图标：


    ![Figure 3.11: Show Retargeting Options](img/B17878_03.11.jpg)


    图 3.11：显示重定向选项


    在 `OPTIONS` 下，点击 `Show Retargeting Options`。我们所做的一切只是确保骨架的层级结构被有效地用于驱动每根骨头的动画。因为所有骨头都在层级结构中相互连接，移动一根骨头会自然地对整个身体产生连锁反应。这被称为
    `Inverse Kinematics (IK)`（反向运动学）。在某些动画数据中，每根骨头都有动画，因此骨架的自然层级结构不是很重要。对于 IK 动画，并非每根骨头的所有动画（如旋转和平移）都会传递下去；因此，依赖
    IK 解决方案很重要。


    我们将在下一步中利用骨骼层级结构，因为 `MetaHuman` 角色就是基于此设计的。因为该骨骼系统内存在骨骼层级，我们可以通过利用一个方便的重定向选项，快速改变骨头平移的性质。在这种情况下，我们要将
    `Translation`（平移）设置为 `Skeleton`（骨架），从 `pelvis`（骨盆）骨头开始。


    幸运的是，有一种快速的方法可以做到这一点。右键点击 `pelvis` 并选择 `Recursively Set Translation Retargeting
    Skeleton` 选项，如图 3.12 所示：


    ![Figure 3.12: Recursively Set Translation Retargeting to Skeleton](img/B17878_03.12.jpg)


    图 3.12：递归设置平移重定向为骨架


    您现在已通过一次点击将从 `pelvis` 到 `skeleton` 的所有骨头都设置完毕。


    > **Note**：编辑完重定向选项后，请务必在 `Blueprint` 选项卡中点击 `Save`（保存）。


    除了确保我们的角色都使用骨骼动画外，通过这种方式操作，我们仅重定向 `rotational data`（旋转数据）。简单来说，这将允许我们从该角色重定向每根骨头的旋转动画，而不是
    `transformation data`（变换数据）。如果我们将原始骨架的变换数据复制到新骨架（例如 `MetaHuman` 骨架），骨头将会不成比例地移动。


    当新角色与原始角色存在显著比例差异时，这些问题最为明显。例如，如果原始骨架很高，那么它的骨头变换数据将与小个子角色截然不同。它的骨头会比其较小的对应骨头长。虽然旋转数据没问题，但高个子角色的变换数据会拉伸小个子角色，因为它会试图让骨头占据
    3D 空间中相同的位置，尽管旋转值相对正确。


    在图 3.13 中，您可以看到正确的数据变换。也就是说，这三个角色共享相同的姿势，网格体没有任何剧烈的拉伸或变形。如果变换数据从角色 A 传递到角色 B，角色
    B 会被拉伸到相同的高度，角色 C 会被压扁到与角色 A 相同的高度。


    ![Figure 3.13: Correct translation of motion data](img/B17878_03.13.jpg)


    图 3.13：运动数据的正确转换


    如果您发现已成功完成所有这些步骤并为 `MetaHuman` 制作了动画，那么很有可能您没有正确遵循这些步骤。一个常见的错误是忘记在蓝图中保存更改。


    下一步是编辑新骨架的重定向选项，即我们的 `MetaHuman` 角色。


    ## 编辑 `MetaHuman` 骨架的重定向选项


    要开始编辑 `MetaHuman` 骨架的重定向选项，请在角色的蓝图中，在 `Components` 选项卡中点击 `Body`。然后，在 `Details`
    选项卡中，双击 `Mesh` 部分下 `Skeletal Mesh` 旁边的缩略图。如果您没有像 `Mannequin` 那样拥有准确的 `MetaHuman`
    缩略图，请不要担心。


    ![Figure 3.14: Editing the MetaHuman’s retargeting options](img/B17878_03.14.jpg)


    图 3.14：编辑 MetaHuman 的重定向选项


    双击缩略图后，您将看到图 3.15 所示的界面（它与您之前在图 3.12 中编辑 `Mannequin` 骨架时看到的选项卡完全相同）。您只需遵循上一节中完全相同的步骤即可。因此，点击齿轮图标并选择
    `Show Retargeting Options`。然后右键点击 `pelvis`，并选择 `Recursively Set Translation Retargeting
    to Skeleton`：


    ![Figure 3.15: Recursively Set Translation Retargeting Skeleton in the MetaHuman
    Blueprint](img/B17878_03.15.jpg)


    图 3.15：在 MetaHuman 蓝图中递归设置平移重定向为骨架


    完成此操作后，保存蓝图。现在，我们已经编辑了 `Mannequin` 和 `MetaHuman` 两个骨架，调整了它们的重定向选项，以便两者可以协同工作。


    ## 总结

