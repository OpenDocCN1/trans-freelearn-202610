- raw: "In this chapter, we are going to look at another way to make changes to our\
    \ character’s pose to fix minor issues, such as an arm colliding with the torso\
    \ of the MetaHuman, but will also look at how we can refine the motion of the\
    \ character. For this, we will use the **Level Sequencer**, which is the tool\
    \ we use for animating anything in Unreal Engine, and in many ways, works like\
    \ a timeline in a video editing application.\n\nSo, in this chapter, we will cover\
    \ the following topics:\n\n*   Introducing the Level Sequencer\n\n*   Creating\
    \ a Level Sequencer and importing our character Blueprint\n\n*   Adding the retargeted\
    \ animation to the character Blueprint\n\n*   Adding and editing the Control Rig\n\
    \n*   Adding a camera to the Level Sequencer\n\n*   Rendering a test animation\
    \ from the Level Sequencer\n\n# Technical requirements\n\nIn terms of computer\
    \ power, you will need the technical requirements detailed in [*Chapter 1*](#B17878_01.xhtml#_idTextAnchor015)\
    \ and the MetaHuman plus the Unreal Engine Mannequin that we imported into UE5\
    \ in [*Chapter 2*](#B17878_02.xhtml#_idTextAnchor027). Both of these will need\
    \ to be saved in the same project in UE and you will need to have UE running for\
    \ this chapter.\n\nFor this chapter, you will also need to have access to the\
    \ motion capture data that you just retargeted in [*Chapter 6*](#B17878_06.xhtml#_idTextAnchor084).\n\
    \n# Introducing the Level Sequencer\n\nUntil now, you’ve only been able to preview\
    \ your animation either within the character Blueprint or within the viewport\
    \ using the **Play** button. The **Play** button is effectively simulating gameplay,\
    \ which is purely for an interactive experience.\n\nThe Level Sequencer can be\
    \ used in gameplay, but for the purpose of this book, we want to focus on using\
