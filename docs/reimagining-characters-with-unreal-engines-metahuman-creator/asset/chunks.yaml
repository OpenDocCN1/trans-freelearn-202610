  trans: '


    您会很高兴地知道，使用 MetaHuman 并不需要完全理解 FK（正向运动学）或 IK（反向运动学），尤其是在处理动作捕捉数据时，但了解这些概念确实能消除您在流程中经常遇到的那些术语的神秘感。


    在下一节中，让我们开始创建我们自己的 IK Rig。


    # 创建 IK Rig


    您可能会问，既然 MetaHuman 已经自带 IK Rig，为什么我们还要创建一个？考虑到我们的目标是将为一个角色（作为源）设计的动画重定向并应用到我们的
    MetaHuman 角色（作为目标）上，我们需要确保两个 Rig 具有正确的命名约定。例如，我们需要确保源角色的左臂与目标角色的左臂匹配；有些 Rig 将
    `shoulder` 称为 `clavicle`，因此我们需要确保两个 Rig 的命名约定一致。


    因此，我们实际上将创建一个新的 IK Rig，用于将信息从源转换到目标。随着章节的推进和对 IK 链的处理，这一点将变得更加直观。我们这样做的原因是源 Rig
    的命名约定可能与目标 Rig 不同，因此我们为每个角色创建的 IK Rig 实际上只是一组简单的指令，旨在使转换更容易。这还有一个额外的好处，即防止我们编辑角色原始的
    IK Rig。


    那么，让我们为源角色创建一个 IK Rig：


    1. 如果您还记得上一章，我们从 `Third Person Template`（第三人称模板）获取了一个角色。因此，在 `Blueprint` 文件夹内，再进入
    `Third Person Template` 文件夹，在该文件夹内的任意位置右键单击并选择 `Animation`（动画）。


    2. 选择 `IK Rig` 后，系统会提示您选择 `Skeletal Mesh`（骨架网格体）选项。此时，我们要选择与源角色相关的骨架。为此，我们要选择
    `SK_Mannequin`，如图 4.7 所示：


    ![图 4.7：选择源骨架网格体](img/B17878_04.07.jpg)


    完成后，它会在您一直在使用的同一个 Blueprint 文件夹中创建 IK Rig，如图 4.8 所示。请注意，我已将此 IK Rig 明确标记为 `SOURCE_Mannequin`；这将帮助我们稍后查找，也是一种良好的习惯。


    ![图 4.8：源文件夹内的 IK Rig](img/B17878_04.08.jpg)


    创建好源 IK Rig 后，下一步是创建目标 IK Rig。


    1. 为此，我们需要进入 MetaHuman 的文件夹并重复刚才完成的步骤。因此，在文件夹内的任意位置右键单击，选择 `Animation`，再次选择 `IK
    Rig`：


    ![图 4.9：创建目标 IK Rig](img/B17878_04.09.jpg)


    2. 现在，我们需要为目标选择一个骨架网格体。在本例中，我选择 `f_med_ovw_body` 网格体，它对应于 Glenda 作为一个中等身高、超重的女性角色（其中
    `f` 代表 `female` 女性，`med` 代表 `medium` 中等，`ovw` 代表 `overweight` 超重）。选择正确的网格体非常重要，否则稍后会出现问题。


    > **注意**

    >

    > 举另一个例子，您可能有一个男性、矮小且消瘦的角色；在这种情况下，正确的角色网格体将是 `m_srt_unw_body`。


    ![图 4.10：为目标 IK Rig 选择正确的骨架网格体](img/B17878_04.10.jpg)


    和之前一样，一旦我们选择了骨架网格体，现在就可以在角色文件夹中看到一个新的 IK Rig（我的文件夹叫 Glenda）。请再次注意，我花时间将其标记为 `TARGET`，如图
    4.11 所示：


    ![图 4.11：角色文件夹内创建的目标 Rig](img/B17878_04.11.jpg)


    现在，我们将打开两个 IK Rig，从这里开始，我们将尝试将两个 Rig 并排放置。在图 4.12 中，我将两个 IK Rig 窗口（分别是源和目标）排列好，使界面尽可能靠近。我强烈建议您也这样做，因为这将有助于减少出错的几率，同时也能直观地呈现正在发生的一切。


    ![图 4.12：源和目标 IK Rig 的并排对比](img/B17878_04.12.jpg)


    分屏是一种良好的习惯，因为它允许我们轻松地可视化源和目标在我们的更改方面是如何相互对应的。我已标记出您需要注意的界面关键部分：


    1. 我们将源 IK Rig 界面放在屏幕左侧，目标 IK Rig 界面放在屏幕右侧。这种排列作为视觉辅助，帮助我们快速进行比较。

    2. `IK Retargeting`（IK 重定向）选项卡处于激活状态。我们需要确保源和目标都选中此选项卡，因为我们将在那里进行大部分编辑工作。

    3. 我们可以点击 `+Add New Chain`（+ 添加新链）按钮，因为我们将只是在两个界面中添加 IK 链并适当地为它们命名。


    在每个 IK Rig 窗口左侧的 IK Rig 名称下，您将看到骨骼层级以列表形式列出。您还会注意到这些列表并不完全相同。例如，源 IK Rig 的骨骼有三节脊椎，而目标
    IK Rig 更复杂，有五节脊椎。


    您还会注意到，两个骨骼在其层级的最顶端都有一个 `root`。对于 3D 角色来说，骨骼层级顶端有一个 `root` 非常常见，但在许多情况下，3D 角色使用骨盆作为层级的顶端。对于
    Unreal 和 MetaHuman，我们将骨盆作为层级的顶端，因此我们需要做一些微调。


    操作方法如下：


    1. 选择 `pelvis`，右键单击它，找到 `Set Retargeted Root`（设置重定向根骨骼）选项，如图 4.13 所示。将光标悬停在该选项上，您会注意到一个提示，显示**设置用于重定向的根骨骼。通常为“Pelvis”。**


    ![图 4.13：在源骨骼上设置根骨骼](img/B17878_04.13.jpg)


    由此您可以得知，在大多数情况下，骨盆被设置为根骨骼，因此在本例中，我通过点击 `Set Retarget Root` 将 `pelvis` 选为根骨骼。


    1. 接下来，您需要对目标执行相同操作。在本例中，它是 `TARGET_Glenda`。同样，根据引擎的提示，我们得知 `root` 骨骼通常是骨盆，因此我们将在源和目标
    IK Rig 中都将目标的根骨骼设置为 `pelvis`，如图 4.14 所示：


    ![图 4.14：在目标 IK Rig 中选择骨盆作为根骨骼](img/B17878_04.14.jpg)


    > **注意**

    >

    > 有些角色 Rig 使用单独的骨骼作为 `root` 而不是骨盆，因此动画出现的任何问题通常与 `root` 被更改为 `pelvis` 或 `root`
    有关。


    此时，您已经创建了两个 IK Rig（一个用于源，一个用于目标），并对两者进行了一些非常微小的编辑。现在，我们需要确保源和目标中的每个肢体都能有效地相互对应。为此，我们需要了解一下
    IK 链。


    # 创建 IK 链


    '
