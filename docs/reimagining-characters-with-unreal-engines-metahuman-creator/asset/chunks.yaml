- raw: "![Figure 7.16: Setting a start frame for the playback range ](image/B17878_07_16.jpg)\
    \ \n\nFigure 7.16: Setting a start frame for the playback range\n\nYou will know\
    \ when you have created a playback range because you will see both a green and\
    \ red line, as per *Figure 7**.16* – I have selected the start time at the beginning\
    \ of the keyframes that I baked earlier, and the end time is just where the keyframes\
    \ end. This ensures that my playback range is the same length as the entirety\
    \ of the animation. You can always extend your playback range by simply dragging\
    \ the red line to the right-hand end of the timeline.\n\nWith the playback range\
    \ created, now we can create a camera that will automatically create a Camera\
    \ Cut to fill the playback range that we created. Very simply, click on the camera\
    \ icon at the top of the Sequencer:\n\n![Figure 7.17: The camera icon ](image/B17878_07_17.jpg)\
    \ \n\nFigure 7.17: The camera icon\n\nA camera will be created, and more tracks\
    \ will have been created within the Sequencer:\n\n![Figure 7.18: The camera created\
    \ ](image/B17878_07_18.jpg) \n\nFigure 7.18: The camera created\n\nYou can see\
    \ from *Figure 7**.18* that we have now obtained a **Cine Camera Actor** (which\
    \ is a virtual version of a real camera). With the camera, we also have a number\
    \ of parameters, such as the following:\n\n*   **Aperture**: This is how wide\
    \ the iris of the lens is. A lower number means that more of the picture will\
    \ be out of focus, while a higher number provides a sharper image. This realistically\
    \ mimics how cameras work in terms of depth of field, but not exposure.\n\n* \
    \  **Focal Length**: Just like with a real camera, the focal length is measured\
    \ in millimeters. A lower number creates a wider-angle lens and a higher number\
    \ creates a telephoto or long lens.\n\n*   **Manual Focus Distance**: Again, just\
    \ like a real camera, the focus area is set to a given distance from the camera.\
    \ For example, you may only want to be focused on objects that are 5,000 mm away\
    \ from the camera.\n\n*   **Spawned**: A feature aimed at game simulation. If\
    \ checked, the game engine will spawn the camera when the game starts.\n\n*  \
    \ **Transform**: An editable parameter for moving, rotating, and scaling the camera.\n\
    \nFor the most part, you will only want to animate the following parameters: **Moving**\
    \ and **Rotating** in **Transform**, along with **Focus Distance**.\n\nBefore\
    \ you go about setting keyframes, a useful function is to pilot the camera to\
    \ animate. In other words, you can see through the viewport to make sure you’ve\
    \ got the best composition. In *Figure 7**.19*, I have highlighted the camera\
    \ icon on both the **CameraComponents** track and the **Cine Camera Actor** track.\
    \ These need to be toggled until you get the **Eject** icon (the triangle), which\
    \ I have also highlighted.\n\n![Figure 7.19: The camera created ](image/B17878_07_19.jpg)\
    \ \n\nFigure 7.19: The camera created\n\n*Figure 7**.19* demonstrates that the\
    \ camera is now being piloted, which is a far more efficient way of controlling\
    \ your camera. If you’re familiar with 3D programs or first-person games, you\
    \ will find that the navigation with the camera is very intuitive:\n\n*   *Alt*\
    \ + *left-click* to orbit (move around)\n\n*   *Alt* + *middle click* to track\
    \ (move left to right and up and down)\n\n*   *Alt* + *right-click* to dolly (move\
    \ forward and backward)\n\nWhen you are familiar with navigating your scene with\
    \ the camera, let’s create your first animation of a camera:\n\n1.  Click on **Transform**\
    \ under **CameraComponent** inside the Sequencer.\n\n2.  Then, ensuring your play\
    \ head is parked close to the beginning of **Play Range**, hit *Enter*. This will\
    \ create a keyframe for all of the transform parameters, such as **Location**,\
    \ **Rotation**, and **Scale**.\n\n3.  Do the same with the **Focus Distance**\
    \ attribute after first ensuring your MetaHuman is in focus just like in *Figure\
    \ 7**.19*. You will need to click on **Manual Focus Distance**, change the value,\
    \ and hit *Enter* to create a keyframe.\n\n4.  When you’re happy with both your\
    \ composition and your focus, park your play head at a different frame.\n\n5.\
    \  Once you reposition your camera, a keyframe will automatically be placed. If\
    \ it doesn’t get placed automatically, just click on the **Transform** attribute\
    \ as before and hit *Enter*.\n\nYou’ve now created your first animation of a camera\
    \ while filming a MetaHuman. You may have to edit the **Focus Distance** attribute\
    \ to make sure your MetaHuman remains in focus throughout the shot.\n\nIt takes\
    \ a little while to plot camera moves and you may find that you are creating keyframes\
    \ only to have to delete them again and again. This is perfectly normal. Once\
    \ you feel you’ve got a reasonable camera movement, it’s time to render some animations.\n\
    \n# Rendering a test animation from the Level Sequencer\n\nTo render out an animation,\
    \ first, click on the **Movie Scene Capture** button (it’s the clapper board icon)\
    \ at the top of your Sequencer:\n\n![Figure 7.20: Clapper board icon ](image/B17878_07_20.jpg)\
    \ \n\nFigure 7.20: Clapper board icon\n\nNote\n\nIf you have installed the Movie\
    \ Render Queue plug-in, you will be given a choice of which renderer to use. If\
    \ so, choose **Movie Scene ****Capture (Legacy)**.\n\nYou will then get the following\
    \ **Render Movie Settings** dialog box:\n\n![Figure 7.21: Render Movie Settings\
    \ ](image/B17878_07_21.jpg) \n\nFigure 7.21: Render Movie Settings\n\nIn *Figure\
    \ 7**.21*, I have left all the settings with their default values. Three important\
    \ settings to note are:\n\n*   **Image Output Format**: You need to render a movie\
    \ in a format that your system can play. The default is **AVI** but you can change\
    \ it to a **QuickTime Pro ****Res** file.\n\nNote\n\nTo ensure that you can render\
    \ Apple Pro Res, go to **Edit**, then **Plugins**, search for **prores**, and\
    \ check the **Apple ProRes Media** checkbox. Then, you will need to restart Unreal.\n\
    \n*   **Resolution**: The default resolution is **1280 x 720 (16.9)** pixels,\
    \ but you can change it to a higher resolution if you like.\n\n*   **Output Directory**:\
    \ By default, the **Render Movie** renderer will try to render the file to your\
    \ project folder to use as the output directory. You can choose another directory\
    \ if you prefer.\n\nOnce you are happy with your render settings, click on **Capture\
    \ Movie**. It will take a few minutes to render your file – while you wait, you\
    \ can see a preview of your render, as seen in *Figure 7**.22.* You can see that\
    \ my file is being written to a bespoke directory that I created for this book.\n\
    \n![Figure 7.22: The movie render – preview window ](image/B17878_07_22.jpg) \n\
    \nFigure 7.22: The movie render – preview window\n\nTo view your finished video,\
    \ go to the output directory on your PC and click on the **MOV** file created\
    \ to play your animation.\n\nNote\n\nOn slower systems, when your render looks\
    \ like it has finished rendering, the render preview window will remain open.\
    \ The renderer goes through a process of writing all the frames and then through\
    \ another process of containing the frames within the QuickTime file. At higher\
    \ resolutions, with bigger files, and slower machines, this process can take almost\
    \ as long as the initial render.\n\n# Summary\n\nIn this chapter, we learned how\
    \ to create a Level Sequencer and add our character to it. We also learned how\
    \ to create a keyframed MetaHuman Rig based on our mocap data from the previous\
    \ chapter and an Additive section to apply additional keyframes for the purpose\
    \ of fixing issues.\n\nThen, we briefly covered keyframing within the Level Sequencer\
    \ before moving on to creating a camera and animating it in the Level Sequencer.\
    \ Finally, we learned how to export video files from UE5.\n\nIn the next chapter,\
    \ we are going to work with Facial Motion Capture using an iPhone.\n\n# 8\n\n\
    # Using an iPhone for Facial Motion Capture"
