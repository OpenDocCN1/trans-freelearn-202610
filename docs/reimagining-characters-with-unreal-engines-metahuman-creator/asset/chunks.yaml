- raw: "You may also notice that the **Tracking FPS** is generally the same as the\
    \ **Video FPS**. If the **Tracking FPS** is lower, it means there’s something\
    \ wrong with the software; possibly other applications are running, causing Faceware\
    \ to be under-resourced. Try closing down any other applications that are running\
    \ to help out with this.\n\nNote\n\nThe difference between Tracking FPS and Video\
    \ FPS is quite simple. Tracking FPS is how fast the software can correctly identify\
    \ areas of the face and where they are in the picture, whereas Video FPS is simply\
    \ how many frames the software is receiving from the webcam per second.\n\n###\
    \ Face Tracking Model\n\nReferring back to *Figure 9**.11*, below **Frame Rate**,\
    \ the next field is **Face Tracking Model**. The drop-down menu provides two options:\n\
    \n*   **Stationary Camera**: Suitable for webcams where the camera is stationary,\
    \ but the user’s head is moving.\n\n*   **Professional Headcams**: Suitable for\
    \ professional solutions where the camera is fixed to a head rig and only captures\
    \ facial expressions rather than head movements. Headcams aren’t capable of tracking\
    \ neck movement, so if the user nods or shakes their head, the data isn’t recorded.\
    \ In this scenario, a motion capture suit is relied upon to capture body motion,\
    \ including head and neck movement. Typically, both body and facial captures are\
    \ done simultaneously when professional headcams are being used as it produces\
    \ a more natural result.\n\nIn our case, we are picking **Stationary Camera**.\n\
    \n### Image Rotation\n\nIn cases where your camera is upside down or turned to\
    \ the side, you can rotate the video signal in increments of 90 degrees to fix\
    \ it. I don’t need this, so the **Image Rotation** option is set to **0** degrees.\n\
    \n### Flip Horizontal and Flip Vertical\n\nAgain, if you are dealing with an upside-down\
    \ camera or if you have a personal preference for a mirror image, you can choose\
    \ to flip the image horizontally or vertically. I won’t be using these either.\n\
    \n### Grid Overlay\n\nThis is a somewhat helpful tool to ensure your face is in\
    \ the middle of the frame. I haven’t enabled this.\n\nNow, before we go over to\
    \ the **Streaming** panel, make sure that you have a video signal coming into\
    \ Faceware, that your input is set to **Live**, and that your face is being tracked,\
    \ with tracking markers moving in tandem with your face. You can see from my example\
    \ in *Figure 9**.13* that I have orange tracking markers around my eyebrows, eyes,\
    \ nose, and mouth:\n\n![Figure 9.13: Tracking markers working ](image/B17878_09_13.jpg)\
    \ \n\nFigure 9.13: Tracking markers working\n\nOnce your face is being tracked,\
    \ then you need to ensure that Faceware is able to send data out in the **STREAMING**\
    \ panel.\n\n## Streaming panel\n\nSwitch over to the **STREAMING** panel, and\
    \ you will see the following options shown in *Figure 9**.14*:\n\n![Figure 9.14:\
    \ The Streaming panel ](image/B17878_09_14.jpg) \n\nFigure 9.14: The Streaming\
    \ panel\n\nLet’s take a look at each section of the panel.\n\n### Stream to Client\n\
    \nThe first option in **STREAM TO CLIENT** is the **STREAM TO CLIENT** toggle\
    \ button itself, which I have toggled to the right to turn it on. Effectively,\
    \ the button is just an on-and-off switch. When it’s on, Faceware will stream\
    \ live motion capture data to the client. The client in this instance is the Unreal\
    \ Engine, which is enabled to receive the streaming data via Live Link.\n\nNote\
    \ that if you don’t have a live video signal, you won’t be able to enable **STREAM\
    \ ****TO CLIENT**.\n\nThe second option is **PORT** – these ports are set up automatically\
    \ when the Live Link plugin is installed. During the installation of Faceware,\
    \ Faceware detects which ports are available for streaming to; however, do make\
    \ note of the port number just in case. You should leave **PORT** as the default\
    \ value; in my case, that is **802**.\n\nNow you are ready to start the face tracking.\
    \ Get your face into a neutral pose, so no smiling or pouting, and click on the\
    \ **CALIBRATE NEUTRAL POSE** button as per the bottom left of *Figure 9**.15*:\n\
    \n![Figure 9.15: Calibrating neutral pose ](image/B17878_09_15.jpg) \n\n.\n\n\
    Figure 9.15: Calibrating neutral pose\n\nBe sure to look directly into the webcam\
    \ when you do this and expect to hold that pose for about 5-10 seconds while Faceware\
    \ recalibrates to your face. When it is done, it will automatically track your\
    \ face. Take a look at *Figure 9**.16*, where you can see that the CGI character\
    \ is following the movement of my own head and facial expressions.\n\n![Figure\
    \ 9.16: ANIMATION TUNING panel ](image/B17878_09_16.jpg) \n\nFigure 9.16: ANIMATION\
    \ TUNING panel\n\nYou’ll also notice the **ANIMATION TUNING** panel on the right\
    \ of the screen; you’ll see a lot of horizontal bars moving in response to your\
    \ head moving. These are all the ARKit controls being animated as a result of\
    \ the face tracking. We will go into this in further detail later. For now, let’s\
    \ take a further look at the Realtime Setup features.\n\n### Control Schema\n\n\
    **CONTROL SCHEMA** refers to the naming conventions used for the streaming data\
    \ from Faceware studio. Because we are utilizing ARKit, make sure you enable **ARKIT**.\
    \ **LEGACY** and **STANDARD** are good, but they don’t have the fidelity of ARKit,\
    \ which is used in the design of MetaHumans, and for this book, they are redundant.\n\
    \n### Stream Face Groups\n\nThe **STREAM FACE GROUPS** feature allows us to remove\
    \ certain parts of the face from streaming. If we were using a professional head\
    \ cam that doesn’t record head rotation, I would suggest disabling the head from\
    \ **STREAM FACE GROUPS**. In that scenario, we would be capturing the head rotation\
    \ using a body motion capture solution.\n\nIn our example, let’s assume that we\
    \ want to record the head rotation and all the facial movement. To do this, under\
    \ **STREAM FACE GROUPS**, ensure to enable **ALL**. However, if you just wanted\
    \ to capture one face group, for example, you just want to move eyebrows, you\
    \ could just enable the **EYEBROWS** option.\n\nAt this point, we should be streaming,\
    \ but let’s just look at one final part of the Faceware interface: the status\
    \ bar.\n\n## Status bar\n\nIn *Figure 9**.17*, you can see that the top toolbar\
    \ is a color-coded tab list providing a way to troubleshoot and rectify issues\
    \ quickly as they arise:\n\n![Figure 9.17: Top toolbar ](image/B17878_09_17.jpg)\
    \ \n\nFigure 9.17: Top toolbar\n\nThey are in the order of left to right:\n\n\
    *   **VIDEO**: This is a shortcut to the **REALTIME SETUP** panel, which we have\
    \ just covered.\n\n*   **TRACKING**: This is a shortcut to the viewports, as seen\
    \ in *Figure 9**.17*, so that we can visualize how well the tracking is going.\
    \ You can see in *Figure 9**.18* that not only is my head movement being tracked,\
    \ but the tracker is even able to detect a wink through my glasses.\n\n![Figure\
    \ 9.18: Viewports ](image/B17878_09_18.jpg) \n\nFigure 9.18: Viewports\n\n*  \
    \ **TUNING**: This is a shortcut to the **TUNING** panel, where we will do most\
    \ of the tweaking and fixing of issues. You can see that we have a lot of control\
    \ over refining the brows, eyes, head, and mouth. As daunting as this may look,\
    \ these controllers are relatively simple to use.\n\nFor example, if you look\
    \ at the CGI head and its jaw doesn’t open as wide as your jaw in the webcam,\
    \ you can increase the **Jaw Open** parameter to as much as 200% by dragging the\
    \ blue slider to the right. I made similar adjustments in *Figure 9**.19* by dragging\
    \ some of the mouth sliders to the right as much as 200%.\n\n![Figure 9.19: Tuning\
    \ ](image/B17878_09_19.jpg) \n\nFigure 9.19: Tuning\n\nIf the jaw opens too much\
    \ in the CGI character compared to your webcam video, then drag the slider to\
    \ the left to decrease the amount. The same can be said for all of the parameters\
    \ in the **TUNING** panel."
