- raw: "Lights are also actors that we can animate. We can add a light to the Level\
    \ Sequencer much the same as we added a camera earlier. By doing this, the only\
    \ animatable attribute by default is the light intensity. But there are a lot\
    \ of attributes for the light actor that we can add for animation purposes.\n\n\
    In *Figure 10**.17*, you can see that by clicking on **\\+ Track** next to the\
    \ camera component in the Level Sequencer, I have access to nearly all of the\
    \ attributes featured in the **Detail** panel for animating. Click on any of these\
    \ attributes in the list for them to become an animatable component within the\
    \ Level Sequencer:\n\n![Figure 10.17: Editing lights ](image/B17878_10_17.jpg)\
    \ \n\nFigure 10.17: Editing lights\n\nGenerally speaking, animating lights is\
    \ rare, much the same as moving lights in a live-action shoot is rare, but not\
    \ unusual – perhaps you want a flashing light from a police car or a lighthouse\
    \ lamp spinning around, or you want to tweak a light’s intensity for when a character\
    \ walks under it. I could spend a whole chapter on lighting in Unreal, if not\
    \ a whole book on the subject, but we must move on to a very important feature,\
    \ Post Process Volumes.\n\n## Using Post Process Volumes\n\nPost Process Volume\
    \ is an interesting tool as it gives us massive control of the final picture.\
    \ Typically, Post Process Volume would surround your entire scene and is a volume\
    \ in the sense that it is an area within your scene that is affected by input\
    \ from an artist.\n\nIn essence, Post Process Volume is an effect and grading\
    \ tool with much of the toolset aimed at the camera. For instance, we can control\
    \ flares, blooms, and chromatic aberrations, which are all very specific lens\
    \ characteristics, along with film grain, change exposure, white balancing, and\
    \ so on. If you look at any settings inside a modern video camera or digital cinema\
    \ camera, Post Process Volume pretty much has a matching feature. Epic Games have\
    \ done incredible work giving artists real-world tools when it comes to their\
    \ scene for real-time rendering.\n\nIn *Figure 10**.18*, I have utilized some\
    \ of these features:\n\n![Figure 10.18: Lens effects with Post Process Volumes\
    \ ](image/B17878_10_18.jpg) \n\nFigure 10.18: Lens effects with Post Process Volumes\n\
    \nLet’s look at some of the features that I used:\n\n*   **Lens Flare** is obvious\
    \ to see. If you’re not familiar with lens flares, they’re the light spots in\
    \ the picture that cross over Glenda’s face – they react with the light source,\
    \ which is a directional light behind Glenda. I’ve added a pink tint to the lens\
    \ flare and increased the Bokeh size, which effectively increases the size of\
    \ the lens flare.\n\n*   I have also added a **Bloom** effect, which gives us\
    \ a realistic light glow from her hair. A bloom effect simulates filters used\
    \ on real-world lenses such as pro mist filters, which soften highlights in the\
    \ image.\n\n*   In addition, I’ve added **Film Grain**, **Chromatic Aberration**,\
    \ and a **Vignette**, which are far too subtle to see here but are commonly used\
    \ to enhance realism: \n\n    *   **Film Grain** is used to simulate film stock\
    \ or digital noise that is present in film or digital cameras\n\n    *   **Chromatic\
    \ Aberration** is a natural phenomenon found in photographic lenses where a very\
    \ subtle rainbow effect appears, particularly from highlights in the image\n\n\
    \    *   **Vignettes** are a common artifact of photographic lenses where the\
    \ edges of the image are darker than the middle of the image\n\nAs the name suggests,\
    \ Post Process Volume is a *post-production* tool. In terms of Unreal Engine,\
    \ most of the difficult things such as lighting direction, shadow, skin shading,\
    \ reflections, and so on are already set, but Post Process Volume adds an extra\
    \ layer of effects over that. In a way, the Level Sequencer is like the camera\
    \ and Post Process Volume is like Photoshop.\n\nAs a rule of thumb: it is best\
    \ to get all of your lighting and camera work as close to the final look as possible,\
    \ and rely on Post Process Volume for things you couldn’t achieve otherwise.\n\
    \nThere are quite a lot of settings in Post Process Volume and unfortunately too\
    \ many to cover in a book about MetaHumans. However, they will make your MetaHumans\
    \ look amazing when it comes to rendering.\n\nNote\n\nIf you would like to learn\
    \ more about advanced lighting and rendering techniques, I recommend you take\
    \ a look at the following video tutorial, which you can purchase from the Gnomon\
    \ Workshop: [https://www.thegnomonworkshop.com/tutorials/cinematic-lighting-in-unreal-engine-5](https://www.thegnomonworkshop.com/tutorials/cinematic-lighting-in-unreal-engine-5).\n\
    \nThis brings us to the next section, where we will take a close look at rendering\
    \ out files from the Movie Render Queue for compositing and color grading.\n\n\
    ## Using the Movie Render Queue\n\nWhen we are setting our renders from the Level\
    \ Sequencer, we are given a choice of which render queue to use. To see what render\
    \ queues are available to you, click on the three dots next to the clapper icon,\
    \ as per *Figure 10**.19*:\n\n![Figure 10.19: Movie Render Queue options ](image/B17878_10_19.jpg)\
    \ \n\nFigure 10.19: Movie Render Queue options\n\nIt is quite likely that you\
    \ will only see **Movie Scene Capture (Legacy)**, but this is somewhat dated and\
    \ limited. The other option that you can see is **Movie Render Queue**; however,\
    \ at the time of writing, it is still only in Beta, so isn’t enabled by default.\n\
    \nTo enable it, you need to head over to the plugin section and search for **Renderer**.\
    \ In *Figure 10**.20*, you can see that I have already enabled both, which you\
    \ should do too:\n\n![Figure 10.20: Enabling both Render Queue plugins ](image/B17878_10_20.jpg)\
    \ \n\nFigure 10.20: Enabling both Render Queue plugins\n\nNow, when you click\
    \ **Movie Render Queue**, as per *Figure 10**.21*, you’ll see the following screen:\n\
    \n![Figure 10.21: Movie Render Queue dialog box ](image/B17878_10_21.jpg) \n\n\
    Figure 10.21: Movie Render Queue dialog box\n\nThe **\\+ Render** button in green\
    \ is for determining which sequence to render. Initializing the Movie Render Queue\
    \ will assign the current Level Sequencer for rendering. However, should you have\
    \ multiple Level Sequencers in your project, you can add them to the Render Queue\
    \ using the **\\+ Render** button. In this dialog box, you’ll see three columns:\n\
    \n*   **Job**\n\n*   **Settings**\n\n*   **Output**\n\nLet’s go through each of\
    \ these columns.\n\n### Job\n\n**Job** is the sequencer name that has been chosen\
    \ for rendering. By default, it will be titled **New Level Sequence**. Keep in\
    \ mind that parameters such as **Range** (how long the animation is) and **Frame\
    \ Rate** are determined in the Level Sequencer.\n\nShould you have more than one\
    \ Level Sequencer in your project, they would be available under **Job** and you\
    \ can select which Level Sequencer you want to render.\n\n### Settings\n\n**Settings**\
    \ refer to what render settings you want to apply to your sequence.\n\n### Ouput\n\
    \nThe **Output** area displays the folder directory where your images or videos\
    \ will be rendered, as set in the output setting.\n\nThere are quite a lot of\
    \ options to choose from when it comes to rendering settings. Ultimately, if you\
    \ are already committed to rendering a movie out of Unreal using a Level Sequencer,\
    \ then you are not likely to be concerned with the real-time rendering capabilities\
    \ of Unreal and are planning to do more work on the rendered sequence in post-production.\n\
    \nThe file type, be it a movie file or an image sequence, is an important setting\
    \ to consider. For example, should you plan to do additional post-production such\
    \ as advanced color grading, then you should opt for an image sequence setting\
    \ such as **Open EXR** that provides higher color fidelity. If you plan to just\
    \ do a test render or commit a final render directly from Unreal, then a movie\
    \ file such as a **Quicktime Prores** would suffice.\n\nLet’s look at the default\
    \ settings, as shown in *Figure 10**.22*:\n\n![Figure 10.22: Default settings\
    \ in Movie Render Queue ](image/B17878_10_22.jpg) "
  fmt: "\n灯光也是可以动画化的 Actor。我们可以将灯光添加到 `Level Sequencer` 中，方式与之前添加摄像机大同小异。这样做后，默认情况下唯一可动画化的属性是灯光强度。但\
    \ `Light Actor` 还有许多属性可供添加以用于动画制作。\n\n在 Figure 10.17 中，你可以看到通过点击 `Level Sequencer`\
    \ 中摄像机组件旁的 **+ Track**，我可以访问 `Detail` 面板中几乎所有的属性以进行动画制作。点击列表中的任意属性，即可使其成为 `Level\
    \ Sequencer` 中可动画化的组件：\n\n![Figure 10.17: Editing lights](image/B17878_10_17.jpg)\n\
    \nFigure 10.17: Editing lights\n\n一般来说，灯光动画化的情况很少见，就像在实拍中移动灯光很少见但并不罕见一样——也许你想要一辆警车的闪烁灯光或灯塔旋转的灯光，又或者想在角色走过灯光下时调整灯光强度。我可以写一整章关于\
    \ Unreal 中灯光的内容，甚至可以写一整本书，但我们必须继续介绍一个非常重要的功能：`Post Process Volume`。\n\n## Using\
    \ Post Process Volumes\n\n`Post Process Volume` 是一个有趣的工具，因为它赋予了我们对最终画面的巨大控制权。通常，`Post\
    \ Process Volume` 会包围整个场景，它之所以被称为 Volume，是因为它是场景中受美术输入影响的一个区域。\n\n本质上，`Post Process\
    \ Volume` 是一个特效和调色工具，其大部分工具集都针对摄像机。例如，我们可以控制眩光、辉光和色差，这些都是非常具体的镜头特性，此外还有胶片颗粒、曝光调整、白平衡等。如果你看看任何现代摄像机或数字电影摄像机的设置，`Post\
    \ Process Volume` 几乎都有对应的功能。Epic Games 在为美术提供实时渲染场景的真实世界工具方面做了令人难以置信的工作。\n\n在\
    \ Figure 10.18 中，我使用了其中一些功能：\n\n![Figure 10.18: Lens effects with Post Process\
    \ Volumes](image/B17878_10_18.jpg)\n\nFigure 10.18: Lens effects with Post Process\
    \ Volumes\n\n让我们看看我使用的一些功能：\n\n*   **Lens Flare** 显而易见。如果你不熟悉镜头眩光，它们是画面中穿过 Glenda\
    \ 脸部的光斑——它们与光源（Glenda 身后的定向光）发生反应。我给镜头眩光添加了粉色色调并增加了 `Bokeh` 大小，这实际上增加了镜头眩光的尺寸。\n\
    *   我还添加了 **Bloom** 效果，这让我们从她的头发上得到了真实的光晕。`Bloom` 效果模拟了真实镜头上使用的滤镜，如 Pro Mist 滤镜，可以柔化画面中的高光。\n\
    *   此外，我还添加了 **Film Grain**、**Chromatic Aberration** 和 **Vignette**，这些在这里太微妙而难以察觉，但常用于增强真实感：\n\
    \    *   **Film Grain** 用于模拟胶片颗粒或数字噪点，这些存在于胶片或数码相机中\n    *   **Chromatic Aberration**\
    \ 是摄影镜头中发现的一种自然现象，会出现非常微妙的彩虹效果，特别是在画面的高光部分\n    *   **Vignette** 是摄影镜头的常见伪影，画面边缘比中间更暗\n\
    \n顾名思义，`Post Process Volume` 是一个*后期制作*工具。就 Unreal Engine 而言，大多数困难的事情如灯光方向、阴影、皮肤着色、反射等已经设置完毕，但\
    \ `Post Process Volume` 在此基础上增加了一层额外的效果。在某种程度上，`Level Sequencer` 就像摄像机，而 `Post\
    \ Process Volume` 就像 Photoshop。\n\n经验法则：最好让所有灯光和摄像机工作尽可能接近最终外观，并依靠 `Post Process\
    \ Volume` 实现其他方式无法达到的效果。\n\n`Post Process Volume` 中有相当多的设置，遗憾的是在一本关于 MetaHuman\
    \ 的书中无法全部涵盖。然而，它们会让你的 MetaHuman 在渲染时看起来惊艳无比。\n\n> **Note**\n>\n> 如果你想了解更多高级灯光和渲染技术，我建议你查看以下视频教程，可从\
    \ Gnomon Workshop 购买：[https://www.thegnomonworkshop.com/tutorials/cinematic-lighting-in-unreal-engine-5](https://www.thegnomonworkshop.com/tutorials/cinematic-lighting-in-unreal-engine-5)。\n\
    \n这带我们进入下一节，我们将仔细研究如何从 `Movie Render Queue` 导出文件以进行合成和调色。\n\n## Using the Movie\
    \ Render Queue\n\n当我们从 `Level Sequencer` 设置渲染时，可以选择使用哪个渲染队列。要查看可用的渲染队列，请点击拍板图标旁边的三个点，如\
    \ Figure 10.19 所示：\n\n![Figure 10.19: Movie Render Queue options](image/B17878_10_19.jpg)\n\
    \nFigure 10.19: Movie Render Queue options\n\n你很可能只会看到 **Movie Scene Capture (Legacy)**，但这已经有些过时且功能有限。另一个选项是\
    \ **Movie Render Queue**；不过在撰写本文时，它仍处于 Beta 阶段，因此默认未启用。\n\n要启用它，你需要前往插件部分并搜索 **Renderer**。在\
    \ Figure 10.20 中，你可以看到我已经启用了两者，你也应该这样做：\n\n![Figure 10.20: Enabling both Render\
    \ Queue plugins](image/B17878_10_20.jpg)\n\nFigure 10.20: Enabling both Render\
    \ Queue plugins\n\n现在，当你点击 **Movie Render Queue** 时，如 Figure 10.21 所示，你将看到以下界面：\n\
    \n![Figure 10.21: Movie Render Queue dialog box](image/B17878_10_21.jpg)\n\nFigure\
    \ 10.21: Movie Render Queue dialog box\n\n绿色的 **+ Render** 按钮用于确定要渲染的序列。初始化 `Movie\
    \ Render Queue` 会将当前的 `Level Sequencer` 分配用于渲染。但是，如果你的项目中有多个 `Level Sequencer`，可以使用\
    \ **+ Render** 按钮将它们添加到渲染队列中。在此对话框中，你将看到三列：\n\n*   **Job**\n*   **Settings**\n\
    *   **Output**\n\n让我们逐一了解这些列。\n\n### Job\n\n**Job** 是被选中用于渲染的 Sequencer 名称。默认情况下，它将被命名为\
    \ **New Level Sequence**。请记住，诸如 **Range**（动画时长）和 **Frame Rate** 等参数是在 `Level Sequencer`\
    \ 中确定的。\n\n如果你的项目中有多个 `Level Sequencer`，它们将出现在 **Job** 下，你可以选择要渲染的 `Level Sequencer`。\n\
    \n### Settings\n\n**Settings** 指的是你想要应用到序列上的渲染设置。\n\n### Output\n\n**Output**\
    \ 区域显示图像或视频将被渲染到的文件夹目录，这在输出设置中设定。\n\n渲染设置有相当多的选项可供选择。归根结底，如果你已经决定使用 `Level Sequencer`\
    \ 从 Unreal 导出电影，那么你不太可能关心 Unreal 的实时渲染能力，而是计划在后期制作中对渲染序列进行更多工作。\n\n文件类型，无论是电影文件还是图像序列，都是一个重要的考虑设置。例如，如果你计划进行额外的后期制作，如高级调色，则应选择\
    \ **Open EXR** 等图像序列设置，它提供更高的色彩保真度。如果你只是计划进行测试渲染或直接从 Unreal 进行最终渲染，那么 **Quicktime\
    \ Prores** 等电影文件就足够了。\n\n让我们看看默认设置，如 Figure 10.22 所示：\n\n![Figure 10.22: Default\
    \ settings in Movie Render Queue](image/B17878_10_22.jpg)\n"
