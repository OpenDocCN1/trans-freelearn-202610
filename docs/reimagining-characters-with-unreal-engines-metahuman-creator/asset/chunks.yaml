    To further edit the character’s motion, you can always bake the animation to the
    control rig and add `Additive Section` for further editing.


    Moving on from the convenient tool of visualizing your skeleton, there are other
    options for editing the animation clip. By right-clicking anywhere in the track
    and going to properties, you will see that you have more options when it comes
    to editing your clip:


    ![Figure 10.9: Further options ](image/B17878_10_09.jpg)


    Figure 10.9: Further options


    When it comes to merging animation, the most important thing is the frame rate.
    You may find that you are trying to blend two animations that have different speeds.
    The property function is a good way to tackle this problem by changing the frame
    rates so that they match. You can also experiment with different frame rates.


    Now that we have looked at how to add mocap data related to the body, in the next
    section, we’ll cover the same principles of adding and merging animation tracks,
    but this time, we will focus on the face.


    # Adding facial mocap data to the Level Sequencer


    To add and merge the face animation requires you to follow the the exact same
    steps as you did for the body, by either adding a whole new Faceware track or
    by adding the animation to the end of the existing animation track and moving
    the tracks. Let’s take a look in more detail.


    ## Adding a recorded Faceware take


    In this section, we are going to add the Faceware facial motion capture file to
    the Level Sequencer. If you are having trouble locating your Faceware facial capture
    file, which was recorded by `Take Recorder` in [*Chapter 8*](#B17878_08.xhtml#_idTextAnchor120),
    just remember that Take Recorder added the `_Scene` suffix to the character Blueprint’s
    name. So, in my case, I just searched for `BP+Glenda_Scene` and all my takes were
    listed for me to choose from.


    In Figure 10.10, you can see that I merged Take 6, `BP_Glenda_scene_106_0`, with
    Take 1, `BP_Glenda_Scene_1_01_0`:


    ![Figure 10.10: Adding Face animation to one animation track ](image/B17878_10_10.jpg)


    Figure 10.10: Adding Face animation to one animation track


    I have selected `BP_Glenda_Scene_1_01_0`. You can see that the keyframes have
    appeared in blue, including `0341` and `+19`. Take note of the `+` icon – it means
    that I have moved the clip 19 frames to the right, so it will start 19 frames
    later.


    ## Editing the facial mocap


    The process for editing facial capture animation clips is practically identical
    to that of the body data, so we can use the same tools and follow the same steps
    from the previous section.


    In addition, we can bake the track into keyframes in a control rig and add an
    `Additive Section` to tweak the animation, as we covered in [*Chapter 8*](#B17878_08.xhtml#_idTextAnchor120).
    You can see from Figure 10.11 that I’ve taken the same steps of baking the control
    rig, which is indicated by the triangular keyframes:


    ![Figure 10.11: Baking the track to the control rig ](image/B17878_10_11.jpg)


    Figure 10.11: Baking the track to the control rig


    A huge part of making the facial capture work with the body capture is timing.
    It may require just the easy step of sliding the facial mocap animation track
    to either the left or right; on the other hand, you may have to spend more time
    using the facial control rig, or even the body control rig, to make both animations
    match. The only way to get good at working with control rigs for the face is to
    experiment with them. A good practice would be to get as far as you can with the
    raw facial motion capture and then refine the animation using an `Additive` section
    with a control rig.


    With some of the advanced animation features covered, it’s now time to delve into
    some advanced rendering.


    # Exploring advanced rendering features


    I’ve said this before and I’ll say it again: Unreal Engine is a very powerful
    tool, and when it comes to rendering, it doesn’t disappoint. Unreal is capable
    of delivering outstanding results that are comparable to traditional path-tracing
    renderers such as Mental Ray, Arnold, V-Ray, and RenderMan. Unreal now supports
    path tracing, which is the foundation of how these other renderers work.


    In the context of filmmaking, Unreal has real-time rendering capabilities that
    should be explored to unlock its full potential. The camera and lights have features
    that we find in 3D programs such as Maya, Houdini, and Blender that use path tracing
    renderers. It’s possible to export whole scenes from either of these applications
    with the camera and lighting settings intact and compatible with Unreal.


    So, without further ado, let’s take a look at some of these great rendering features.


    ## Adding and animating a camera


    In [*Chapter 7*](#B17878_07.xhtml#_idTextAnchor101), we used a method of creating
    a new camera directly from the Level Sequencer; however, in this chapter, we will
    create the camera without using the Level Sequencer.


    In Figure 10.12, I went up to the `Create Actor` button to quickly add an actor
    to the scene. From there, I chose `Cinematic`, followed by `Cine Camera Actor`.
    This creates a camera in the viewport of my scene:


    ![Figure 10.12: Quickly adding a camera to the scene ](image/B17878_10_12.jpg)


    Figure 10.12: Quickly adding a camera to the scene


    Next, go to the Level Sequencer and add the camera by clicking on the `+ Track`
    button and choosing the camera you just created.


    In Figure 10.13, the camera cut features the grid background, as does the viewport
    above. This allows us to preview any camera animation from the Level Sequencer
    directly in the viewport:


    ![Figure 10.13: The camera cut being automatically created ](image/B17878_10_13.jpg)


    Figure 10.13: The camera cut being automatically created


    Unlike the body and face of the MetaHuman Blueprints, the Cine Camera automatically
    generates a Transform function. This will allow you to change the location of
    the camera in the `X`, `Y`, and `Z` axes. You can also change the rotation of
    the camera in the `X`, `Y`, and `Z` axes, which change the Roll, Pitch, and Yaw,
    respectively.


    As shown in Figure 10.14, you have keyframe attributes on the right-hand side.
    Typically, when animating the camera, you’ll need to adjust the `Location` setting
    and edit the `Focus Distance` setting to ensure your subject is in focus:


    ![Figure 10.14: The camera transform ](image/B17878_10_14.jpg)


    Figure 10.14: The camera transform


    Rather than changing values in the Transform function within the Level Sequencer
    every time you want to set a keyframe in the Level Sequencer, you can always just
    pilot the camera inside the viewport, much like playing a first-person game using
    your keyboard and mouse.


    Be sure to engage the autokey, as illustrated in Figure 10.15, which will create
    a keyframe every time you move the camera:


    ![Figure 10.15: The Autokey function ](image/B17878_10_15.jpg)


    Figure 10.15: The Autokey function


    In addition to just animating the camera position, you can also animate what the
    camera is focusing on. A very convenient tool for focus is the `Debug Focus` tool,
    illustrated in Figure 10.16. This tool gives us a clear visual indication of what
    is in focus. With the camera selected, tick the `Draw Debug Focus Plane` option;
    you’ll see a pink plane appear. Anything on that pink plane is going to be perfectly
    in focus:


    ![Figure 10.16: Camera debug focus ](image/B17878_10_16.jpg)


    Figure 10.16: Camera debug focus


    You can control the focus and animate focus distance within the Level Sequencer
    but use the debug plane for precision focusing.


    Now, with some of the more advanced camera features out of the way, it’s time
    to move on to lights.


    ## Adding and animating light


    For the most part, actors are added to the Level Sequencer with some attributes
    being animatable. It is possible to animate more attributes via the Level Sequencer,
    but we need to manually add them to the Level Sequencer.

