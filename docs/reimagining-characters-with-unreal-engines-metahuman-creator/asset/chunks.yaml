    \n![Figure 11.9: Upload Successful notification](image/B17878_11_09.jpg)\n\n*Figure\
    \ 11.9: Upload Successful notification*\n\nA couple of factors need to be taken\
    \ into consideration for the processing time of your photos. Because the processing\
