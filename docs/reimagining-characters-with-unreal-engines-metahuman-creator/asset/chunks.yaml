- raw: "If you have followed along with all of the chapters, you will have created\
    \ body motion capture files with Mixamo and DeepMotion\n\nTo add body animation,\
    \ just click on **+Track**, then go to **Animation**, as shown in *Figure 10**.3*:\n\
    \n![Figure 10.3: Adding an animation ](image/B17878_10_03.jpg) \n\nFigure 10.3:\
    \ Adding an animation\n\nIf you don’t see your animation in the list, use the\
    \ search function. Remember, any track you are adding will have to have been retargeted,\
    \ so you can always use the **Retargeted** suffix when running a search. That\
    \ way, you’ll be able to see all the available mocap in your project.\n\nIn *Figure\
    \ 10**.4*, you can see that I’ve added a track. You can even see that it has the\
    \ track title, which can confirm at a glance that you are using the correct mocap\
    \ track:\n\n![Figure 10.4: An added track ](image/B17878_10_04.jpg) \n\nFigure\
    \ 10.4: An added track\n\nYou completed this step at the end of [*Chapter 8*](#B17878_08.xhtml#_idTextAnchor120),\
    \ but in the next section, we will look at ways to bring in additional mocap tracks\
    \ for the body.\n\n## Adding additional body mocap data and merging mocap clips\n\
    \nThere are two ways to bring in additional mocap tracks:\n\n*   Adding an animation\
    \ track\n\n*   Adding animation to an existing track\n\nLet’s take a look at them\
    \ now.\n\n### Adding an animation track\n\nTo add an animation clip as a track\
    \ in the Level Sequencer, click the **+** icon next to **Body**. This will create\
    \ an additional animation track that you can reposition along the timeline and\
    \ blend with the first track using the weight tool using keyframes.\n\nIn *Figure\
    \ 10**.5*, you can see that I now have two animation tracks:\n\n*   The first\
    \ track is the Happy Dance file I created in DeepMotion and I have created two\
    \ keyframes. The first keyframe has a **Weight** value (which is the value of\
    \ influence over the character). By default, the **Weight** value is **1**, which\
    \ is equal to an influence of 100%; this means that the first animation track\
    \ is the most prominent. For the second keyframe, I set the **Weight** value to\
    \ **0**, which is equal to 0%; this means that there is no happy dance. I know,\
    \ it sounds depressing; however, all is not lost for Glenda, because I did the\
    \ inverse for the new animation track.\n\n*   In the second animation track, which\
    \ is the Macerena file taken from Mixamo, I keyframed the **Weight** value to\
    \ start at 0% and transition to 100%, effectively blending the two dances using\
    \ keyframes:\n\n![Figure 10.5: Adding another track ](image/B17878_10_05.jpg)\
    \ \n\nFigure 10.5: Adding another track\n\n### Adding animation to an existing\
    \ track\n\nAdding animation to an existing track doesn’t create an additional\
    \ track but adds new animation to the same track. Rather than clicking on the\
    \ **+Track** icon beside **Body**, click on **+Animation** under **Body** instead,\
    \ as you can see in *Figure 10**.6*:\n\n![Figure 10.6: Merging two animations\
    \ into one track ](image/B17878_10_06.jpg) \n\nFigure 10.6: Merging two animations\
    \ into one track\n\nIn *Figure 10**.6*, I’ve already added my animation. Notice\
    \ how there is a transition between the two tracks where I’ve drawn the red square.\
    \ Effectively, I have merged one animation track into another, indicated by a\
    \ descending and ascending curve.\n\nTo merge a track in this way, you must go\
    \ to the end of the first track in the Level Sequencer with your playhead. If\
    \ your animation is 100 frames, be sure to go to a higher frame, such as 120;\
    \ otherwise, you won’t be able to merge your animation to the track. Then, you\
    \ must drag the second clip to the left so that it intersects with the first clip.\n\
    \nNote that it automatically blends from the first animation into the second animation\
    \ on the same animation track. Effectively, this method has merged the two animations\
    \ into one track. Take note of the number between the two animation (in the red\
    \ box) clips that have merged. It reads as **0093**. This indicates that the transition\
    \ length from one animation to the next is 93 frames, which is approximately 3\
    \ seconds.\n\nIn the next section, we’ll take a look at a handy tip to help align\
    \ animations.\n\n#### Using the Show Skeleton feature for cleaner alignment\n\n\
    Sometimes, when we try to merge animations, we don’t get great results. For example,\
    \ if the first animation is of the character walking and the second animation\
    \ is of the character running, often, the character will appear to have jumped\
    \ into a new position dramatically from one frame to the next.\n\nTo make such\
    \ an adjustment, we need to add a **Transform** track to the body in the Level\
    \ Sequencer. You can do this as per *Figure 10**.7*:\n\n![Figure 10.7: Adding\
    \ a transform track ](image/B17878_10_07.jpg) \n\nFigure 10.7: Adding a transform\
    \ track\n\nThis will create a new transform track in the Level Sequencer, allowing\
    \ us to create keyframes in the **Location** parameter. Now, we can move the character\
    \ around to fix any character position issues without impacting any of the overall\
    \ animation properties. Any movement of the character that we apply will only\
    \ set keyframes on the new transform track, so we won’t inadvertently lose any\
    \ of the original motion capture data.\n\nFor example, imagine an animation of\
    \ a character standing and waving an arm. If there is an issue with the mocap\
    \ data where the body rises upwards randomly but we are happy that the character\
    \ is waving, we can fix the random upward movement by adding keyframes to the\
    \ **Location** parameter. We can do this without negatively impacting the waving\
    \ motion of the arms.\n\nHowever, it can be a little cumbersome to see the subtle\
    \ adjustments when it comes to moving the character from A to B. To get around\
    \ this visibility issue, Unreal has a function where we can see the MetaHuman\
    \ skeleton. This allows us to focus on the exact position of our character without\
    \ being confused by the mesh.\n\nBy right-clicking on the timeline, you will see\
    \ the **Show Skeleton** option. Clicking on this will reveal a bright pink skeleton,\
    \ which helps to make subtle adjustments, as shown in *Figure 10**.8*:\n\n![Figure\
    \ 10.8: Show Skeleton ](image/B17878_10_08.jpg) \n\nFigure 10.8: Show Skeleton\n\
    \nNote\n\nWhen using the **Show Skeleton** function, both animations will be displayed\
    \ with skeletons of different colors, which makes lining them up a little easier.\n\
    \nA common example of when to use the **Transform** track and the **Show Skeleton**\
    \ functions is when you want to loop animation, such as a walk cycle.\n\nHowever,\
    \ if you have a character walking from position A to B, and you wish to loop the\
    \ animation so that the character continues walking, we’ll come across an issue.\
    \ The issue is that as soon as the character reaches position B, it will return\
    \ to position A if we wish it to loop.\n\nUsing the **Transform** tracks, and\
    \ placing keyframes on the locator, you can create a continual animation using\
    \ a loop:\n\n1.  Add a **Transform** track to your **Animation** track in the\
    \ Level Sequencer.\n\n2.  Go to the very end of the track and at the last frame,\
    \ add keyframes for the locator positions – that is, *X*, *Y*, and *Z*. You can\
    \ also do this by hitting the *Enter* key, providing you have the transform track\
    \ selected in the Level Sequencer. We are doing this to secure the position of\
    \ the animation so that it isn’t affected by the next step.\n\n3.  Now, extend\
    \ the track so that it repeats. On the first frame of the repeated section, add\
    \ a new position so that the character occupies the same space that it did at\
    \ the end of the original track. Most likely, you’ll just need to edit the *X*\
    \ and *Y* axis positions slightly and possibly need to rotate the character on\
    \ the *Z* axis if the character isn’t walking in a straight line. Each clip has\
    \ the option of displaying its skeleton, so the slight editing of the *X* and\
    \ *Y* positions is helped by showing the skeletons because you are essentially\
    \ just lining up the skeletons of each track so that they occupy the same space.\n\
    \nNote"
