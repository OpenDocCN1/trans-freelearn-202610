    \ to animate. Once an actor is added to a Sequencer, an animation track is created.\n\
    \nBecause we want to animate our MetaHuman character, we will need to add the\
    \ MetaHuman Blueprint as our animation track. To do this, simply click on **\\\
    + Track** and then **Actor ****To Sequencer**:\n\n![Figure 7.3: Adding an Actor\
    \ to the Sequencer ](image/B17878_07_03.jpg) \n\nFigure 7.3: Adding an Actor to\
    \ the Sequencer\n\nIn *Figure 7**.3*, you can see a list of actors that are available\
