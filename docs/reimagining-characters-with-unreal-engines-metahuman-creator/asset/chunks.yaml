    # 这本书适合谁


    这本书是由一位电影制作人为电影制作人编写的。要理解书中介绍的一些较难概念，你应该对电影制作流程有合理的了解，特别是 3D 动画。如果你涉猎过 3D 角色动画，并且至少读过一本相关书籍，你应该能毫无困难地理解书中的所有内容。如果你没有任何先验知识，别担心——你依然可以顺利读完这本书，不会卡住。


    归根结底，这是一本关于如何使用 Unreal 创建动画 MetaHuman 的分步指南。它涵盖了各种你可以应用到自己创意和设计中的技术。


    # 本书内容


    在 *第 1 章* *《Unreal 入门》* 中，你将了解什么是 Unreal，什么是 MetaHuman，以及如何在电脑上设置 Unreal Engine。


    在 *第 2 章* *《在 MetaHuman 界面中创建角色》* 中，我们将探讨 MetaHuman Creator 界面的所有主要功能，如何编辑 MetaHuman，以及如何下载和导出你自己的
    MetaHuman。


    在 *第 3 章* *《深入 MetaHuman 蓝图》* 中，我们将学习什么是蓝图，以及如何将其用于 MetaHuman。


    在 *第 4 章* *《重定向动画》* 中，我们将了解关于 IK 骨架、IK 链和 IK 重定向器的所有内容。


    在 *第 5 章* *《使用 Mixamo 重定向动画》* 中，我们将学习如何使用 Mixamo 动画资产重定向动画。


    在 *第 6 章* *《使用 DeepMotion 添加动作捕捉》* 中，类似上一章，我们将学习使用 DeepMotion 进行无标记动作捕捉，以及如何将
    DeepMotion 采集的动作捕捉数据重定向到 MetaHuman 上。


    在 *第 7 章* *《使用关卡序列器》* 中，我们将了解关卡序列器，以及如何用它来控制我们的 MetaHuman 角色。


    在 *第 8 章* *《使用 iPhone 进行面部动作捕捉》* 中，我们将学习如何安装 Live Link 应用，并使用 iPhone 实时捕捉面部动作并直接导入
    Unreal Engine。


    在 *第 9 章* *《使用 Faceware 进行面部动作捕捉》* 中，作为上一章的替代方案，我们将探讨如何使用简单的网络摄像头，利用 Faceware
    软件获得同样高标准的面部动作捕捉。


    在 *第 10 章* *《使用关卡序列器混合动画与高级渲染》* 中，我们将探讨如何在关卡序列器中使用多个动作捕捉片段。本章还将介绍一些使用关卡序列器的高级渲染概念，例如后处理体积。


    在 *第 11 章* *《使用 Mesh to MetaHuman 插件》* 中，作为额外内容，你将了解一个新插件，它允许用户调整自己的 3D 扫描数据，以此为基础创建
    MetaHuman。


    # 充分利用本书


    为了充分利用本书，需要对 3D 动画行业的基本概念有所了解，例如网格体、视频时间轴、动作捕捉和关键帧。拥有 Maya、3ds Max、Houdini、Blender、Cinema
    4D 或 Modo 等 3D 应用程序的使用经验将是一个优势。


    建议你通过观看《阿凡达》、《加勒比海盗》和《复仇者联盟》等视效大片的幕后花絮，熟悉动作捕捉和 3D 动画的成果。


    | **本书涵盖的软件/硬件** | **操作系统要求** |

    | --- | --- |

    | Unreal Engine 5.01 或更高版本 | Windows 或 macOS |

    | iPhone X 或更新机型 | iOS |

    | Faceware 软件 |  |

    | Live Link |  |

    | Kiri Engine |  |


    *你需要快速的互联网连接和大量的硬盘空间。下载一个 MetaHuman 角色轻松就会占用约 4 GB 的硬盘空间，而一个包含简单 MetaHuman 场景的
    Unreal Engine 项目可能占用高达约 50 GB 的硬盘空间。此外，**推荐使用** NVIDIA RTX 3000 系列等高规格显卡。*


    *此外，请关注作者的 YouTube 频道，获取关于 Unreal Engine 和 MetaHuman 与本书相关的各方面技巧和窍门，一旦**可用:**
    [`bit.ly/3Fv9u18`](https://bit.ly/3Fv9u18)。


    # 下载彩色图片


    我们还提供一个 PDF 文件，包含本书使用的屏幕截图和图表的彩色图片。你可以在这里下载：[`packt.link/5RXwo`](https://packt.link/5RXwo)。


    # 约定用法


    **粗体**：表示新术语、重要单词或屏幕上显示的单词。例如，菜单或对话框中的单词以 **粗体** 显示。示例：“从 **管理** 面板中选择 **系统信息**。”


    提示或重要说明


