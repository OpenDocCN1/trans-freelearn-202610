- raw: "When you are ready, go to Quixel Bridge and open up MetaHuman. You can do\
    \ this easily by simply typing in **Bridge** next to the Windows start icon at\
    \ the bottom left of the screen and then hitting *Enter*. This will start up Quixel\
    \ Bridge, as shown in *Figure 2**.1*:\n\n![Figure 2.1: Starting up Bridge ](image/B17878_02_01.jpg)\
    \ \n\nFigure 2.1: Starting up Bridge\n\nTake note of the column on the left-hand\
    \ side. Clicking on the person icon will bring up the MHC templates, which you\
    \ need to choose from before you can start your MHC session. This will bring up\
    \ a few images of male and female MetaHumans with a wide range of ethnicities\
    \ and age groups.\n\nClicking on a profile will open a panel on the right, showing\
    \ you an enlarged image of your selection and the character’s name, as shown in\
    \ *Figure 2**.2*:\n\n![Figure 2.2: Starting the MHC ](image/B17878_02_02.jpg)\
    \ \n\nFigure 2.2: Starting the MHC\n\nYou’ll notice further options at the bottom\
    \ of the screen, such as **Resolution**, but we will come back to those at the\
    \ end of this chapter. All you need to do to start your first character creation\
    \ session is to click **START MHC**.\n\nOnce you do this, a web browser will appear,\
    \ similar to what’s shown in *Figure 2**.3*:\n\n![Figure 2.3: Waiting for the\
    \ MetaHuman Creator connection ](image/B17878_02_03.jpg) \n\nFigure 2.3: Waiting\
    \ for the MetaHuman Creator connection\n\nAt this point, you may need to be patient\
    \ as the session can take seconds, if not minutes, to boot up. However, now is\
    \ not the time to run off to the kitchen to make a cup of tea. The reason is that\
    \ the MHC will also time out if left idle for a few minutes. If you do happen\
    \ to walk away mid-session and find that the session has closed due to the session\
    \ being idle, simply refresh your web browser and it will start up again.\n\n\
    Once the session has loaded, you can choose another template if you want. If,\
    \ however, you have had a previous MHC session, Bridge will automatically save\
    \ your session under **MY METAHUMANS**.\n\nHowever, if you’re happy with your\
    \ original selection, click **NEXT**, as shown in *Figure 2**.4*:\n\n![Figure\
    \ 2.4: Choosing from CREATE METAHUMAN or MY METAHUMANS ](image/B17878_02_04.jpg)\
    \ \n\nFigure 2.4: Choosing from CREATE METAHUMAN or MY METAHUMANS\n\nNote\n\n\
    It is worth noting that by this time, you will have been given two opportunities\
    \ to pick a template. If you have a specific character design in mind – for example,\
    \ an elderly African-American male – it wouldn’t make sense to choose a young\
    \ Caucasian female as a template to start from. That’s not to say you couldn’t\
    \ edit one preset to resemble the desired design you are going for. However, while\
    \ you could potentially edit the ethnicity of your character from one to the next,\
    \ you will have problems when it comes to gender. This comes down to some templates\
    \ having limited editing abilities. So, in short, ensure that you choose the age\
    \ and gender that best matches the design you have in mind (if you have one) when\
    \ you start your session.\n\nAfter choosing **NEXT**, your session will begin.\
    \ By default, you will be greeted by the template character of your choice coming\
    \ to life:\n\n![Figure 2.5: Editable parameters ](image/B17878_02_05.jpg) \n\n\
    Figure 2.5: Editable parameters\n\nAt the bottom of the screen, you will see player\
    \ controls. By default, it is on **PREVIEW**. Note that while in **PREVIEW** mode,\
    \ you can’t make any edits to your character.\n\nHowever, this is a great opportunity\
    \ to see just how realistic MHC is. You will be given three options to choose\
    \ from when it comes to animation previews. You need to click on the filmstrip\
    \ icon to see these options, as illustrated in *Figure 2**.6*:\n\n![Figure 2.6:\
    \ Animation previews ](image/B17878_02_06.jpg) \n\nFigure 2.6: Animation previews\n\
    \nThe options are as follows:\n\n*   **Idle**: Provides a small range of motion,\
    \ which is suitable for a background character.\n\n*   **Face ROM**: Provides\
    \ a full range of motion for the face, where the animation is extreme enough to\
    \ effectively show any potential issues that may come up should your project require\
    \ close-up facial animation.\n\n*   **Body Technical ROM**: Provides animation\
    \ that’s extreme enough to show any potential issues where there is a lot of body\
    \ motion.\n\nNote\n\nThe MHC gives a range of motion designed to give you an idea\
    \ of what your character will look like animated. It is not a definitive debugging\
    \ tool for all possibilities of what could go right or wrong when you add your\
    \ own animation.\n\nIf you are familiar with 3D character design in the traditional\
    \ sense, character design must take the full range of motion into account to work\
    \ effectively. The model or mesh must allow for the desired type of movement.\
    \ At a very basic level, the animation must not alter the mesh of the character\
    \ where parts of the character intersect with other parts. For example, a very\
    \ thin person can walk in a way where their hands can be closer to their sides\
    \ – effectively, their wrist bones can come very close to their hip bones during\
    \ a stride – however, this wouldn’t be the same for somebody larger, even with\
    \ the same type of stride and range of motion.\n\nWith all that said, the fidelity\
    \ of MHC characters does a lot of this calibration. So, what would have been very\
    \ laborious for someone working in Maya, 3ds Max, or Houdini to account for a\
    \ varying range of motions is done automatically in an MHC session.\n\nWe will\
    \ come back to some of this later in [*Chapter 3*](#B17878_03.xhtml#_idTextAnchor046),\
