- raw: "1.  Next, you now need to create an IK Retargeter. To do this, right-click\
    \ in the **Mixamo\\_Animations** folder, then under **Animations**, choose **IK\
    \ Retargeter**. This creates a new IK Retargeter, which you can rename to something\
    \ such as **Mixamo\\_MetaRetargeter**.\n\n![Figure 5.22: The IK Retargeter ](image/B17878_05_22.jpg)\
    \ \n\nFigure 5.22: The IK Retargeter\n\n1.  Once you’ve done that, open the IK\
    \ Retargeter and you will see that at the top right, the source is ghosted out.\
    \ This is because you already chose the source while you were creating the IK\
    \ Retargeter. However, it is still waiting for you to input what the target is.\
    \ Be sure to choose the new IK Rig you made for your target.\n\n2.  Next, click\
    \ on **Asset Browser**, as shown in *Figure 5**.23*. You’ll notice that **Export\
    \ Selected Animations** is green (if you hadn’t chosen a target, it would have\
    \ remained ghosted). Click **Export Selected ****Animations** now.\n\n![Figure\
    \ 5.23: Export Selected Animations ](image/B17878_05_23.jpg) \n\nFigure 5.23:\
    \ Export Selected Animations\n\nOnce clicked, Unreal will write a new animation\
    \ file; here, you will need to pick the destination, as shown in *Figure 5**.24*.\
    \ I recommend placing this new animation in the **Mixamo\\_Animations** folder.\
    \ Don’t worry, you’ll be able to distinguish it from the original un-retargeted\
    \ animation, as it also amends the animation name with the **Retargeted** suffix\
    \ to make it easier for you to find it.\n\n1.  Next, click **OK**, and you’ve\
    \ just retargeted a Mixamo animation, ready to use on your MetaHuman character.\n\
    \n![Figure 5.24: Select Export Path ](image/B17878_05_24.jpg) \n\nFigure 5.24:\
    \ Select Export Path\n\n1.  To test it out, ensure you have your character Blueprint\
    \ in your scene. You can do this by simply dragging the character Blueprint from\
    \ the **Content** folder and into the viewport. Then, with your character selected,\
    \ click on **Body** in the **Details** panel.\n\nEnsure you have selected **Use\
    \ Animation Asset** as the **Animation Mode** setting, as shown in *Figure 5**.25.*\
    \ The animation asset it is referring to is any animation compatible with your\
    \ MetaHuman Blueprint in the scene.\n\n![Figure 5.25: Setting Animation Mode as\
    \ an animation asset ](image/B17878_05_25.jpg) \n\nFigure 5.25: Setting Animation\
    \ Mode as an animation asset\n\n1.   Look for **Anim to Play**. Next to it, you’ll\
    \ see a drop-down list. Use this to search for **Retargeted**. This will call\
    \ up the only retargeted animation asset, which is the one you just created; in\
    \ my case, it is called **MacerenaDance\\_anim\\_Retargeted** (remember, the name\
    \ **MacarenaDance** was assigned to the file name by Maximo, and the **Retargeted**\
    \ suffix was assigned by the IK Retargeter).\n\n2.  Once the asset is selected,\
    \ click **Play** above your main 3D viewport and you’ll see your animation come\
    \ to life.\n\nNow, you have successfully imported your animation into Unreal Engine,\
    \ retargeted the animation using source and target IK Rigs, and used the IK Retargeter\
    \ tool. You were also able to preview your animation inside the scene.\n\nIf you\
    \ plan to bring in a lot of animations over a period of time, the IK Retargeter\
    \ will become a frequently used asset.\n\n## Working with subsequent animations\n\
    \nFor any subsequent animation downloads from Mixamo, you should download **Without\
    \ Skin** (this option is available when downloading your animation in Mixamo,\
    \ as per *Figure 5**.16*). Then, when importing the new animations into Unreal,\
    \ you can now choose the skeleton that was created when you created the source\
    \ IK Rig (in my case, it’s called **MaceranaDance\\_Skeleton**). The headless\
    \ thumbnail of the Glenda preview mesh dancing the Macarena is also visible, like\
