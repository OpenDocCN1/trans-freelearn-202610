- raw: "*   **Never**: In animations that involve swimming or continual falling, we\
    \ know the character’s feet will never connect with the ground, so we use this\
    \ mode to avoid an error.\n\n*   **Always**: Best used for situations when the\
    \ character’s feet never leave the ground. It might seem a little obvious but\
    \ when given the choice between **Auto** and **Always**, it is best to use Always\
    \ when we know the character’s feet don’t leave the ground as the **Auto** mode\
    \ could cause errors in this instance.\n\n*   **Grounding**: Effectively, this\
    \ keeps the feet at ground level but doesn’t necessarily lock them to a fixed\
    \ position. **Auto** works in a similar way but isn’t as effective in fast movement;\
    \ if your character is moving their feet in a sliding motion, **Grounding** mode\
    \ is the best choice.\n\n*   **Default Pose**: This refers to a skeleton calibration\
    \ pose when saving the animation file. Ideally, the calibration pose of the source\
    \ animation should match the calibration pose of the target character. In this\
    \ dropdown, we have four options: \n\n    *   **A-Pose**: One of the most common\
    \ calibrations poses used and the same pose in which MetaHumans appear in the\
    \ UE5 engine. This pose sets the arms at a 45-degree angle.\n\n    *   **I-Pose**:\
    \ This is an unlikely pose to use but one where the arms are straight down.\n\n\
    \    *   **T-Pose**: Another standard pose and the default pose of an Unreal Engine\
    \ Mannequin. The arms are straight out in this pose at a 90-degree angle from\
    \ the body, thus providing a T shape.\n\n    *   **Sitting**: Another unlikely\
    \ pose, where the arms are similar to an **A-Pose** but the character is sitting\
    \ down.\n\n*   **Motion Smoothing**: This option uses AI to determine how the\
    \ character should move by looking at the trajectory of each joint, and then removes\
    \ any jitter or noise from the animation, which comes from constant recalibration.\
    \ While useful to get rid of unwanted jitter, it can introduce some artificial-looking\
    \ movement; you can dial up and down the intensity of the smoothing to get the\
    \ results you want.\n\nNote\n\nThis feature is not available in the Freemium accounts.\n\
    \n*   **Root Joint at Origin**: This is a particularly useful feature for Unreal\
    \ Engine artists as it creates a bone at the origin, which is on the ground between\
    \ both feet. This bone is linked to the hip to correspond to the root position\
    \ of a character. It is recommended that you turn this feature on for motion capture\
    \ intended for use with UE, so we’ll make sure to do that here.\n\n*   **Face\
    \ Tracking**: At the time of writing, this tool is not a practical solution for\
    \ the level of facial capture complexity that we will attain within the chapters\
    \ of this book. Despite using ARKit technology, which is the underlying facial\
    \ animation control technology for MetaHumans, the accuracy with DeepMotion is\
    \ nowhere near as advanced as other solutions. We will look at much more accurate\
    \ face tracking using both iPhone and webcam solutions in *Chapters 8* and *9*.\n\
    \n*   **Hand Tracking**: This feature simply tracks hand movement but at a more\
    \ advanced level, attempting to even track fingers. At the time of writing, this\
    \ feature is only in beta. For Freemium users, it’s worth considering the extra\
    \ cost to use this feature; unless you are seeing significant errors in the hand\
    \ movement, such as hands moving in strange ways or penetrating other body parts,\
    \ I suggest you leave this to the default setting (which is off).\n\n*   **Speed\
    \ Multiplier**: This is an advanced feature for Premium users and is a great way\
    \ of adding more accuracy to the motion capture by using videos with higher frame\
    \ rates (in other words, slow motion). **Speed Multiplier** allows for a range\
    \ of multiplication of 0-8. If your character moves at half speed (slow motion),\
    \ adjusting the multiplier to **2.0** will give you the result of regular motion\
    \ but with more accuracy. For the Professional and Studio plans, footage shot\
    \ at up to 120 fps can be used. That footage would be very slow motion, which\
    \ in turn captures a lot of very detailed and subtle motion. 120 fps is roughly\
    \ 5 times slower than real-time, so you would use a Speed Multiplier of roughly\
    \ 5 to get a real-time motion capture result and benefit from the increased accuracy.\n\
    \nNow, once you have gone through all of those **Animation Output** settings,\
    \ you can click the **Create** button (this is at the bottom of *Figure 6**.5*).\
    \ Once clicked, you’ll see a confirmation dialog box, as per *Figure 6**.6*:\n\
    \n![Figure 6.6: Confirm New Animation dialog box ](image/B17878_06.06.jpg) \n\n\
    Figure 6.6: Confirm New Animation dialog box\n\nYou’ll see from the settings that\
    \ I have enabled **Root Joint at Origin**, set **Foot Locking **to **Auto**, and\
    \ then set **Default Pose** as **A-Pose**. Everything else was left to the default\
    \ settings. I’m not interested in downloading any additional video, which is why\
    \ the **MPF Enabled** option is disabled and everything else is marked **n/a**.\n\
    \nIt is also worth noting at this point that we have the ability to rerun this\
    \ process if we’re not happy with the outcome. With that said, it’s time to run\
    \ it for the first time, so click on the **Start Job** button. You will be taken\
    \ to the **Starting job** interface, as shown in *Figure 6**.7*:\n\n![Figure 6.7:\
    \ Starting job ](image/B17878_06.07.jpg) \n\nFigure 6.7: Starting job\n\nThe processing\
    \ time varies depending on the file size and file length of your video clip. Also,\
    \ if your video contains a lot of motion, expect a slower processing time.\n\n\
    Once processed, it’s time to see the results. In *Figure 6**.8*, you can see the\
    \ results of the clip I chose; of course, it’s impossible to see the results from\
    \ this one single image, however, I was impressed with the results (after all,\
    \ this motion capture is acquired from a single camera instead of an expensive\
    \ motion capture suit and sensor array):\n\n![Figure 6.8: Motion capture result\
    \ ](image/B17878_06.08.jpg) \n\nFigure 6.8: Motion capture result\n\nFrom this\
    \ screen, you will see an interactive 3D viewport where you can see the result\
    \ from any angle and play the animation at various speeds.\n\nOn the right-hand\
    \ side of the screen, you’ll see a short list of four-character types; similar\
    \ to the MetaHuman preview mesh, we can preview various body types such as thin,\
    \ large, male, and female, and choose them for downloading along with our animation.\
    \ For the best results, select a body type that is the closest to your MetaHuman\
    \ character. In my case, as Glenda is a little overweight, it would be better\
    \ for me to choose the overweight character. Doing this would increase the arm\
    \ distance from the body, which would help with any collisions between an arm\
    \ and the torso (you might remember that feature called **Arm Spacing** in Mixamo;\
    \ this works similarly to that).\n\nAlso note that you have two options at the\
    \ bottom of the interface of *Figure 6**.8*:\n\n*   **Download**: This allows\
    \ us to download an FBX file with a skeleton mesh of our choosing. At this point,\
    \ we can choose another mesh other than the preview mesh.\n\n*   **Rerun**: This\
    \ is where we get another chance to refine the quality of the animation. For example,\
    \ we may be happy with the overall animation, but it is a little jittery; this\
    \ would be a good opportunity to apply a little **Motion Smoothing**. As another\
    \ example, we may be unhappy with the feet not locking to the ground as much as\
    \ they should; perhaps the **Auto** setting just wasn’t responsive to the fast\
    \ movement, so we could go back and switch **Auto** to **Grounding** instead.\n\
    \nNeedless to say, but I’ll say it anyway, **Rerun** is a very valid tool and\
    \ it is unlikely that you will get the desired result the first time without having\
    \ to tweak it. It is better to try and get as close as you can to the desired\
    \ result using many reruns, rather than try to fix it in the Unreal Engine. By\
    \ gaining enough experience with reruns, you’ll become more efficient at predicting\
    \ which features should be used over practice and time."
  fmt: '

    # 动画输出设置


    ## 脚部锁定模式


    *   `Never`：在涉及游泳或持续下落的动画中，我们知道角色的脚永远不会与地面接触，因此使用此模式以避免错误。


    *   `Always`：最适用于角色脚部永不离地的情况。这似乎显而易见，但在 `Auto` 和 `Always` 之间选择时，如果我们知道角色脚不离地，最好使用
    `Always`，因为 `Auto` 模式在这种情况下可能导致错误。


    *   `Grounding`：实际上，这使脚保持在地面高度，但不一定将其锁定在固定位置。`Auto` 工作方式类似，但在快速移动时效果不佳；如果角色脚部做滑动运动，`Grounding`
    模式是最佳选择。


    ## 默认姿势


    `Default Pose`：指保存动画文件时的骨骼校准姿势。理想情况下，源动画的校准姿势应与目标角色的校准姿势匹配。此下拉菜单有四个选项：


    *   `A-Pose`：最常用的校准姿势之一，也是 MetaHuman 在 UE5 引擎中出现的姿势。此姿势将手臂设置为 45 度角。


    *   `I-Pose`：不太可能使用的姿势，手臂垂直向下。


    *   `T-Pose`：另一个标准姿势，也是 Unreal Engine 模特的默认姿势。手臂向外伸直，与身体呈 90 度角，形成 T 形。


    *   `Sitting`：另一个不太可能的姿势，手臂类似 `A-Pose` 但角色坐着。


    ## 运动平滑


    `Motion Smoothing`：此选项使用 AI 通过查看每个关节的轨迹来确定角色应如何移动，并从动画中移除任何抖动或噪声，这些噪声来自持续的重新校准。虽然有助于消除不需要的抖动，但可能会引入一些看起来人为的运动；您可以调整平滑强度以获得想要的结果。


    > **Note**

    >

    > 此功能在 Freemium 账户中不可用。


    ## 根关节位于原点


    `Root Joint at Origin`：这对 Unreal Engine 艺术家特别有用，因为它在原点创建一个骨骼，位于双脚之间的地面上。该骨骼与髋部相连，对应角色的根位置。建议为打算在
    UE 中使用的动作捕捉开启此功能，我们这里将确保开启。


    ## 面部追踪


    `Face Tracking`：撰写本文时，此工具对于我们在本书章节中将达到的面部捕捉复杂度而言，并非实用解决方案。尽管使用了 ARKit 技术（这是 MetaHuman
    底层面部动画控制技术），但 DeepMotion 的准确度远不如其他解决方案先进。我们将在 `Chapters 8` 和 `9` 中探讨使用 iPhone
    和网络摄像头的更精准面部追踪。


    ## 手部追踪


    `Hand Tracking`：此功能仅追踪手部运动，但程度更高级，甚至尝试追踪手指。撰写本文时，此功能仍处于测试阶段。对于 Freemium 用户，值得考虑使用此功能的额外成本；除非您在手部运动中看到明显错误（如手以奇怪方式移动或穿透其他身体部位），建议保持默认设置（关闭）。


    ## 速度倍率


    `Speed Multiplier`：这是 Premium 用户的高级功能，通过使用高帧率视频（即慢动作）来增加动作捕捉精度的好方法。`Speed Multiplier`
    允许 0-8 倍范围。如果角色以半速移动（慢动作），将倍率调整为 `2.0` 将得到常规运动结果但精度更高。对于 Professional 和 Studio
    计划，可使用高达 120 fps 的素材。该素材会非常慢，从而捕捉大量细节和微妙动作。120 fps 大约比实时慢 5 倍，因此您会使用约 5 的 `Speed
    Multiplier` 来获得实时动作捕捉结果，并从中受益于更高的精度。


    ---


    现在，完成所有 `Animation Output` 设置后，您可以点击 `Create` 按钮（位于 `Figure 6.5` 底部）。点击后，您将看到确认对话框，如
    `Figure 6.6` 所示：


    ![Figure 6.6: Confirm New Animation dialog box](`image/B17878_06.06.jpg`)


    Figure 6.6: Confirm New Animation dialog box


    从设置中可以看到，我启用了 `Root Joint at Origin`，将 `Foot Locking` 设为 `Auto`，并将 `Default Pose`
    设为 `A-Pose`。其他均保留默认设置。我不打算下载额外视频，因此 `MPF Enabled` 选项已禁用，其他均标记为 `n/a`。


    此时还值得注意的是，如果我们对结果不满意，可以重新运行此过程。话虽如此，是时候首次运行了，点击 `Start Job` 按钮。您将进入 `Starting
    job` 界面，如 `Figure 6.7` 所示：


    ![Figure 6.7: Starting job](`image/B17878_06.07.jpg`)


    Figure 6.7: Starting job


    处理时间取决于视频剪辑的文件大小和长度。此外，如果视频包含大量运动，预期处理时间会更慢。


    处理完成后，便可查看结果。在 `Figure 6.8` 中，您可以看到我所选片段的结果；当然，无法从这单张图像中看到结果，但我对结果印象深刻（毕竟，这是从单个摄像机而非昂贵的动作捕捉套装和传感器阵列获取的动作捕捉）：


    ![Figure 6.8: Motion capture result](`image/B17878_06.08.jpg`)


    Figure 6.8: Motion capture result


    从此屏幕，您将看到一个交互式 3D 视口，可从任何角度查看结果，并以各种速度播放动画。


    屏幕右侧，您将看到四种角色类型的简短列表；类似于 MetaHuman 预览网格，我们可以预览各种体型（如瘦、大、男、女），并选择它们随动画一起下载。为获得最佳结果，请选择最接近您
    MetaHuman 角色的体型。在我的案例中，Glenda 略微超重，选择超重角色会更好。这会增加手臂与身体的距离，有助于解决手臂与躯干之间的碰撞（您可能记得
    Mixamo 中名为 `Arm Spacing` 的功能；这与其工作方式类似）。


    另请注意 `Figure 6.8` 界面底部有两个选项：


    *   `Download`：允许我们下载带有所选骨骼网格的 FBX 文件。此时，我们可以选择除预览网格以外的其他网格。


    *   `Rerun`：这是我们优化动画质量的另一次机会。例如，我们可能对整体动画满意，但略有抖动；这将是应用少量 `Motion Smoothing` 的好机会。另一个例子，我们可能对脚部未按预期锁定地面感到不满；或许
    `Auto` 设置对快速移动反应不够灵敏，我们可以返回将 `Auto` 切换为 `Grounding`。


    毋庸置疑，`Rerun` 是一个非常有效的工具，首次尝试不调整就获得理想结果的可能性很小。与其试图在 Unreal Engine 中修复，不如通过多次重运行尽可能接近期望结果。通过积累足够的重运行经验，您将通过实践和时间更高效地预测应使用哪些功能。

    '
