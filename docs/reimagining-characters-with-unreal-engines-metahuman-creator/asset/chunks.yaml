    我们已经详细介绍了皮肤编辑器，在此我想提醒您，皮肤的额外编辑始终可以在 Unreal Engine 中完成。但目前，在下一节中，我们将讨论眼睛。


    ### 眼睛


    MHC 拥有一个功能极其强大的眼睛编辑工具。其特别之处在于，部分眼部工具可在 Unreal 中进行编辑。例如，如果您想为虹膜大小制作动画，可以直接在 Unreal
    中实现。


    在这里，我们将查看 `Eyes` 编辑器的以下属性：


    *   `PRESETS`（预设）

    *   `IRIS`（虹膜）

    *   `SCLERA`（巩膜）


    现在让我们来看看这些内容。


    #### 预设


    如图 2.19 所示，MHC 提供了一些很棒的预设供选择，提供了一系列不同的棕色、蓝色和绿色眼睛供您挑选：


    ![Figure 2.19: Eye presets ](img/B17878_02_19.jpg)


    图 2.19：眼睛预设


    在大多数情况下，您可以直接使用默认预设，但您可能希望深入具体细节（我们将在下一节中介绍），在那里您可以实现非常具体且自然的外观，从健康的眼睛到非常不健康的眼睛。


    > **注意**

    >

    > 在开始编辑角色的眼睛之前，请善用灯光工具，确保拥有最佳可用灯光。眼睛细节丰富，因此您需要近距离观察，并将 LOD 设为 0，从而以最高质量进行渲染。


    #### 虹膜


    接下来让我们看看 `IRIS` 面板，如图 2.20 所示。不深究每个功能的具体作用，您面临的第一个选择是编辑右眼、左眼或双眼。`Base Color`（基础颜色）允许您编辑最接近虹膜的颜色，而
    `Detail Color`（细节颜色）允许您编辑最接近角膜缘的眼部外侧区域。您还可以编辑 `Color Balance`（色彩平衡）和 `Color Balance
    Smoothness`（色彩平衡平滑度）选项，并从九种虹膜纹理中进行选择：


    ![Figure 2.20: IRIS ](img/B17878_02_20.jpg)


    图 2.20：IRIS


    就像肤色一样，`IRIS` 编辑功能仅限于自然外观。然而，通过加深角膜缘的黑暗度，并在颜色编辑器中追求高饱和度，您可以获得一些相当狂野的效果。


    #### 巩膜


    虽然 `IRIS` 编辑器是一个很棒的工具，但大部分真实感源自 `SCLERA` 选项卡，如图 2.21 所示。实际上，这涉及编辑眼白。虽然您可以通过 `Tint`（色调）选项做很多文章，它是在蓝色和黄色之间取得平衡，但
    `Brightness`（亮度）选项结合 `Tint` 在眼部老化方面非常强大：


    ![Figure 2.21: SCLERA ](img/B17878_02_21.jpg)


    图 2.21：SCLERA


    MHC 还通过 `Vascularity`（血管丰度）滑块带来了大量细节。当您开始旋转血管时，这一点清晰可见。这些是极端特写镜头的强大工具，值得在导出 MetaHuman
    之前花些时间打磨。CGI 角色通常因为眼睛过于明亮完美而失去真实感。


    让我们看一个结合 `Eyes` 编辑选项的示例。图 2.22 中的大部分编辑是使用 `SCLERA` 编辑选项卡完成的，除了在 `IRIS` 编辑选项卡中提亮角膜缘，以及降低基础和细节颜色选择器中的颜色饱和度：


    ![Figure 2.22: Separate eye editing example ](img/B17878_02_22.jpg)


    图 2.22：分离式眼睛编辑示例


    我的目标只是让眼睛显老。总的来说，我可能有点过头了，格伦达此时该去看医生了。然而，她右眼的结果看起来更真实一些，仅仅是因为增加了细节并去除了完美的洁白。


    ### 牙齿


    另一个能为 MetaHuman 增添真实感却常被忽视的工具是 `Teeth` 编辑器。就像眼睛一样，MHC 增加了一层细节和瑕疵，使角色更逼真。我们可以让牙齿因真实的着色而发黄，和/或真实地长得歪斜。我们甚至可以让牙龈萎缩。MHC
    拥有相当多的牙齿编辑器，拥有您实现海量外观变化所需的一切。


    首先，最好确保您处于光线充足的环境中，并打开角色的下颚，以便在编辑牙齿时更好地了解修改效果。为此，有一个方便的 `Jaw Open`（张嘴）滑块。


    看图 2.23，显而易见，格伦达有一口好牙。它们完全整齐，完美洁白，没有牙菌斑或任何其他问题的迹象：


    ![Figure 2.23: Teeth before ](img/B17878_02_23.jpg)


    图 2.23：编辑前牙齿


    有两种编辑方式：


    *   在图 2.23 中，红框指示了可视化编辑方式。将鼠标悬停在每个灰色圆圈上，您将看到每个滑块编辑的内容——例如 `Tooth Length`（牙齿长度）、`Tooth
    Spacing`（牙齿间距）等。

    *   然而，另一种方法是使用下拉列表，从显示 `Tooth Length` 的位置开始，如图 2.24 所示：


    ![Figure 2.24: Editing teeth ](img/B17878_02_24.jpg)


    图 2.24：编辑牙齿


    我建议使用下拉列表进行编辑，因为它提供了一个编辑强度的滑块，以及一个变化程度的滑块，同时还能提醒您正在编辑的内容，例如 `Tooth Length`、`Tooth
    Spacing`、`Overbite`（深覆合/地包天）等。牙齿的可视化图表也有滑块，如图 2.25 左上角所示，但它们只允许您编辑任何给定参数（如 `Overbite`）的强度。


    大部分真实感在于对牙齿进行微妙的改动，例如牙菌斑颜色，并在下拉菜单中的所有项目上添加强度很低的细微变化，该菜单再次出现在图 2.25 中。操作 `TEETH`
    图表下的下拉菜单、滑块和色板将赋予您最大程度的控制权：


    ![Figure 2.25: The Teeth editor ](img/B17878_02_25.jpg)


    图 2.25：牙齿编辑器


    话虽如此，如果您进行大幅度修改，预览 `Face ROM` 组件是值得的，因为牙齿对角色的整体表情有显著影响。一个主要考量因素是牙龈或深覆合的程度。深覆合会给人留下下颚发育不全和天真表情的印象，而反颌则会给人留下下颚过度发育和严肃表情的印象。当然，这很大程度上是主观的，但绝对值得考虑。


    为了结束本节关于牙齿的内容，我想强调牙齿编辑对整体角色设计的重要性，以及它经常被忽视。


    我们现在将继续，看一项并非适用于所有角色设计，但在 MHC 中是强大编辑工具的功能：化妆，以及将其应用于角色。


    ### 化妆


    MHC 拥有一些非常出色的化妆功能，它们与角色的肤色协同工作。`Makeup` 编辑器分为四个选项卡：


    *   `FOUNDATION`（粉底）

    *   `EYES`（眼妆）

    *   `BLUSH`（腮红）

    *   `LIPS`（唇妆）


    现在让我们逐一查看。


    #### 粉底


    如前所述，`Makeup` 编辑器与角色的肤色协同工作。早前在 `Skin` 编辑器下，我们可以选择编辑整体肤色。该信息会被纳入化妆 `FOUNDATION`
    编辑器，根据您最初为角色选择的肤色，为用户提供合适的调色板。这是为了模拟现实世界的化妆决策。例如，白种人的妆容选择会与非裔美国人的不同。


    正如您在图 2.26 中所见，我们可用的粉底调色板非常局限于角色的肤色；这是为了提供最佳效果：


    ![Figure 2.26: With no foundation makeup ](img/B17878_02_26.jpg)


    图 2.26：未涂粉底

