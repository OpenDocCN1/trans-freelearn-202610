- raw: "In *Figure 5**.2*, you’ll see that the interface is made of two tabs: **Characters**\
    \ and **Animations**. These two tabs will display thumbnails of the relative assets\
    \ and a viewport for you to preview them. In this book, we are only concerned\
    \ with animations and so you should select **Animations** (however, it is worth\
    \ noting that regardless of which tab we are in, we can always upload our own\
    \ characters).\n\nOnce the **Animations** tab is selected, we are greeted with\
    \ an almost identical interface with the exception that our thumbnails on the\
    \ left now feature animation assets rather than character assets. In most cases,\
    \ the thumbnail characters are in the Mixamo Mannequin style.\n\n![Figure 5.3:\
    \ The Animations tab ](image/B17878_05_03.jpg) \n\nFigure 5.3: The Animations\
    \ tab\n\nAbove the viewport, you can see the name: **SHOVED REACTION WITH SPIN\
    \ ON CH06\\_NONPBR**. **SHOVED REACTION WITH SPIN** is the name of the animation\
    \ that corresponds to the selected thumbnail, while **CH06\\_NONPBR** relates\
    \ specifically to the character in the viewport.\n\nIf you click on the cog icon\
    \ as highlighted in *Figure 5**.3*, options to see previews of the animation thumbnails\
    \ or static image thumbnails will appear (the first option is more taxing on your\
    \ internet connection; however, it’s helpful to have them animated).\n\nBefore\
    \ we download any animations, we first need to upload our MetaHuman character\
    \ mesh into Mixamo to increase the chances of compatibility. To do that, we must\
    \ prepare our MetaHuman first.\n\n# Preparing and uploading the MetaHuman to Mixamo\n\
    \nTo prepare our MetaHuman for Mixamo, first, we must make sure that we are exporting\
    \ our MetaHuman character with the correct body type. You may remember from [*Chapter\
    \ 4*](#B17878_04.xhtml#_idTextAnchor059), *Retargeting Animations*, that when\
    \ we were retargeting our character directly from the animation asset, we had\
    \ an option to preview the mesh of the MetaHuman. This is an important step because\
    \ we need to use the preview mesh to tell Mixamo how much of an influence the\
    \ bones will have. In addition, the step also gives us a visual idea of exactly\
    \ how the motion capture animation we choose works with our mesh of choice.\n\n\
    My character had a particular description, being female, of medium height, and\
    \ overweight; this was notated by **F\\_Med\\_Ovw\\_Preview**. We need to ensure\
    \ that the exact mesh is what we are using to export from Unreal. So, to start\
    \ preparing our MetaHuman, see the following:\n\n1.  First, we need to find the\
    \ right mesh. To do this, go to your character’s folder and then navigate to the\
    \ **Body** folder. In my case, I need to go to the **Glenda** folder, then the\
    \ **Female** folder, then the **medium** folder, then **Overweight**, and then\
    \ finally, the **Body** folder.\n\n2.  Next, drag the character into your scene.\
    \ You’ll notice that your character isn’t being displayed correctly. In fact,\
    \ it will most likely only display a portion of your whole character. That is\
    \ because a MetaHuman is made of the following meshes: \n\n    *   A head mesh\n\
    \n    *   Clothing meshes\n\n    *    A full nude body mesh\n\n3.  Now, very importantly,\
    \ in the **Details** panel, under **Mesh**, you’ll see a drop-down menu allowing\
    \ you to choose which mesh you want to be displayed for your character.\n\n![Figure\
    \ 5.4: Using search to find the preview mesh ](image/B17878_05_04.jpg) \n\nFigure\
    \ 5.4: Using search to find the preview mesh\n\nIf you type in **preview** in\
    \ the search bar, you will see a list of all the **preview** meshes available.\
    \ It is important to select the correct one, as we are about to export that mesh\
    \ for use in Mixamo. We’re only interested in the body when it comes to Mixamo\
    \ because Mixamo doesn’t give us any facial animation data; for that reason, in\
    \ my case, I will select **f\\_med\\_ovw\\_body\\_preview**.\n\nWhen you select\
    \ the mesh, you’ll see the mesh in the viewport change to that of a headless nude\
    \ body. Despite not having a head, this is all we need for Mixamo, as we are only\
    \ interested in body motion and that is all that Mixamo can offer us anyway.\n\
    \n1.  Before exporting this mesh, we need to ensure that the mesh is at the origin\
    \ of the scene, or in other words, at the very center of the scene. By dragging\
    \ the mesh from the content panel to the scene, we are merely placing it into\
    \ the scene based on the mouse cursor position, which generally gives us a random\
    \ result – but we can quickly fix that.\n\nBack in the **Details** panel, just\
    \ above where we chose the preview mesh, there’s a **Transform** section. Next\
    \ to **Location**, you will want to set each of the *x*, *y*, and *z* coordinates\
    \ to **0.0**, and voila, your character will now be centered in the scene and\
    \ ready to export.\n\n![Figure 5.5: Setting the Location value in Transform to\
    \ the origin ](image/B17878_05_05.jpg) \n\nFigure 5.5: Setting the Location value\
    \ in Transform to the origin\n\n1.  Before exporting the mesh, be sure to have\
    \ the preview mesh from your scene selected, then simply go to **File**, and click\
    \ **Export Selected…**:\n\n![Figure 5.6: Export Selected… ](image/B17878_05_06.jpg)\
    \ \n\nFigure 5.6: Export Selected…\n\nNote\n\nWe need to have the preview mesh\
    \ in the scene in order to export it as an FBX file. We can’t export the asset\
    \ from within the content panel.\n\n1.  Next, choose **FBX** as your file type\
    \ and give it a name that you'll remember (such as **GlendaToMixamo**).\n\n2.\
    \  Ensure you don’t have **Map Skeleton Motion to Root** ticked. Keep all the\
    \ settings as their default settings and click **Export**, as seen in *Figure\
    \ 5**.7*:\n\n![Figure 5.7: Map Skeletal Motion to Root unticked ](image/B17878_05_07.jpg)\
    \ \n\nFigure 5.7: Map Skeletal Motion to Root unticked\n\nNext, we will upload\
    \ our character into Mixamo to apply animation to it.\n\n1.  Regardless of whether\
    \ you are in the **Character** or **Animation** mode in Mixamo, you will always\
    \ have the opportunity to click on the **Upload Character** button; this will\
    \ open the following interface:\n\n![Figure 5.8: Uploading your MetaHuman preview\
    \ mesh to Mixamo ](image/B17878_05_08.jpg) \n\nFigure 5.8: Uploading your MetaHuman\
    \ preview mesh to Mixamo\n\n1.  You have the choice of either dragging and dropping\
    \ your mesh into the rectangle or clicking on **Select character file**. Either\
    \ way, when uploading your file, be prepared to wait a while, as it can take a\
    \ few minutes to process – in which case, you’ll see the following message on\
    \ the screen:\n\n![Figure 5.9: Mixamo processing the mesh ](image/B17878_05_09.jpg)\
    \ \n\nFigure 5.9: Mixamo processing the mesh\n\nWhen Mixamo has finished processing\
    \ your mesh, you should be greeted with the interface shown in *Figure 5**.10*:\n\
    \n![Figure 5.10: Mixamo has finished the processing phase ](image/B17878_05_10.jpg)\
    \ \n\nFigure 5.10: Mixamo has finished the processing phase\n\nNow that we have\
    \ our character mesh inside Mixamo, we are on our way to applying animation to\
    \ it, but before that, we need to make a few adjustments and orient our character\
    \ first.\n\n# Orienting your character in Mixamo\n\nThe next step is to orient\
    \ your character so that it matches the orientation of all the Mixamo characters\
    \ and their animations. Fortunately, Mixamo gives us the tools to do this rather\
    \ than leaving us with a laborious trial-and-error process during the export stage.\n\
    \nTake a look at the three arrows at the bottom of the viewport in *Figure 5**.10*.\
    \ Each of the arrows is for rotating your character and each represents the *x*,\
    \ *y*, and *z* axis respectively. On the right, you are also given instructions\
    \ to orient your character; this is what I have done, setting the character to\
    \ face forward and stand upright."
  fmt: "\n在*Figure 5.2*中，你将看到界面由两个标签页组成：`Characters`和`Animations`。这两个标签页将显示相关资产的缩略图以及一个用于预览的视口。在本书中，我们只关注动画，因此你应该选择`Animations`（不过值得注意的是，无论我们在哪个标签页中，都可以随时上传自己的角色）。\n\
    \n选择`Animations`标签页后，我们看到的界面几乎相同，唯一的区别是左侧的缩略图现在显示的是动画资产而非角色资产。在大多数情况下，缩略图角色采用Mixamo\
    \ Mannequin风格。\n\n![Figure 5.3: The Animations tab](image/B17878_05_03.jpg)\n\n\
    Figure 5.3: The Animations tab\n\n视口上方显示名称：`SHOVED REACTION WITH SPIN ON CH06_NONPBR`。`SHOVED\
    \ REACTION WITH SPIN`是对应所选缩略图的动画名称，而`CH06_NONPBR`专门关联视口中的角色。\n\n如果单击*Figure 5.3*中高亮显示的齿轮图标，将出现查看动画缩略图预览或静态图像缩略图预览的选项（第一个选项对网络连接要求较高；不过，动画预览很有帮助）。\n\
    \n在下载任何动画之前，我们首先需要将MetaHuman角色网格上传到Mixamo以提高兼容性。为此，我们必须先准备好MetaHuman。\n\n## Preparing\
    \ and uploading the MetaHuman to Mixamo\n\n为了让MetaHuman适配Mixamo，首先必须确保我们导出MetaHuman角色时使用了正确的身体类型。你可能还记得在[*Chapter\
    \ 4*](#B17878_04.xhtml#_idTextAnchor059) *Retargeting Animations*中，当我们直接从动画资产重定向角色时，有一个预览MetaHuman网格的选项。这是一个重要步骤，因为我们需要使用预览网格来告诉Mixamo骨骼将产生多大影响。此外，这一步还能让我们直观地了解所选动作捕捉动画如何与我们选择的网格配合工作。\n\
    \n我的角色有特定描述：女性、中等身高、超重；这在命名中标记为`F_Med_Ovw_Preview`。我们需要确保导出的正是该网格。因此，开始准备MetaHuman的步骤如下：\n\
    \n1.  首先，我们需要找到正确的网格。为此，进入角色文件夹，然后导航到`Body`文件夹。在我的例子中，我需要进入`Glenda`文件夹，然后是`Female`文件夹，接着是`medium`文件夹，然后是`Overweight`，最后是`Body`文件夹。\n\
    \n2.  接下来，将角色拖入场景。你会注意到角色显示不正确。实际上，它很可能只显示整个角色的一部分。这是因为MetaHuman由以下网格组成：\n\n \
    \   *   头部网格\n    *   服装网格\n    *   完整的裸体网格\n\n3.  现在，非常重要的是，在`Details`面板的`Mesh`下，你会看到一个下拉菜单，允许你选择要为角色显示的网格。\n\
    \n![Figure 5.4: Using search to find the preview mesh](image/B17878_05_04.jpg)\n\
    \nFigure 5.4: Using search to find the preview mesh\n\n如果在搜索栏中输入`preview`，你将看到所有可用的`preview`网格列表。选择正确的网格很重要，因为我们即将导出该网格用于Mixamo。对于Mixamo，我们只关心身体，因为Mixamo不提供面部动画数据；因此，在我的例子中，我将选择`f_med_ovw_body_preview`。\n\
    \n选择网格后，视口中的网格将变为无头的裸体。尽管没有头部，这正是Mixamo所需的一切，因为我们只关心身体运动，而这也是Mixamo唯一能提供的。\n\n\
    1.  导出此网格之前，我们需要确保网格位于场景原点，换句话说，位于场景的正中心。从内容面板将网格拖入场景时，仅根据鼠标光标位置放置，通常会得到随机结果——但我们可以快速修复。\n\
    \n回到`Details`面板，在我们选择预览网格的位置上方，有一个`Transform`部分。在`Location`旁，你需要将`x`、`y`和`z`坐标均设置为`0.0`，这样角色就会位于场景中心，准备好导出。\n\
    \n![Figure 5.5: Setting the Location value in Transform to the origin](image/B17878_05_05.jpg)\n\
    \nFigure 5.5: Setting the Location value in Transform to the origin\n\n1.  导出网格前，请务必在场景中选中预览网格，然后转到`File`，点击`Export\
    \ Selected…`：\n\n![Figure 5.6: Export Selected…](image/B17878_05_06.jpg)\n\nFigure\
    \ 5.6: Export Selected…\n\n> **Note**\n>\n> 我们需要场景中有预览网格才能将其导出为FBX文件。无法从内容面板内部导出资产。\n\
    \n1.  接下来，选择`FBX`作为文件类型，并给它一个容易记住的名称（如`GlendaToMixamo`）。\n\n2.  确保未勾选`Map Skeleton\
    \ Motion to Root`。保持所有设置为默认值，然后点击`Export`，如*Figure 5.7*所示：\n\n![Figure 5.7: Map\
    \ Skeletal Motion to Root unticked](image/B17878_05_07.jpg)\n\nFigure 5.7: Map\
    \ Skeletal Motion to Root unticked\n\n接下来，我们将角色上传到Mixamo以应用动画。\n\n1.  无论你在Mixamo中处于`Character`还是`Animation`模式，始终可以点击`Upload\
    \ Character`按钮；这将打开以下界面：\n\n![Figure 5.8: Uploading your MetaHuman preview mesh\
    \ to Mixamo](image/B17878_05_08.jpg)\n\nFigure 5.8: Uploading your MetaHuman preview\
    \ mesh to Mixamo\n\n1.  你可以选择将网格拖放到矩形区域，或点击`Select character file`。无论哪种方式，上传文件时请耐心等待，因为处理可能需要几分钟——此时屏幕将显示以下消息：\n\
    \n![Figure 5.9: Mixamo processing the mesh](image/B17878_05_09.jpg)\n\nFigure\
    \ 5.9: Mixamo processing the mesh\n\nMixamo处理完网格后，你应该会看到*Figure 5.10*所示的界面：\n\n\
    ![Figure 5.10: Mixamo has finished the processing phase](image/B17878_05_10.jpg)\n\
    \nFigure 5.10: Mixamo has finished the processing phase\n\n现在我们的角色网格已在Mixamo中，接下来将为其应用动画，但在此之前，我们需要进行一些调整并定向角色。\n\
    \n## Orienting your character in Mixamo\n\n下一步是定向角色，使其与所有Mixamo角色及其动画的朝向一致。幸运的是，Mixamo提供了相关工具，避免了我们在导出阶段进行繁琐的试错过程。\n\
    \n查看*Figure 5.10*视口底部的三个箭头。每个箭头用于旋转角色，分别代表`x`、`y`和`z`轴。右侧还提供了定向角色的说明；我已按此操作，让角色面朝前并直立站立。\n"
  trans: "\n在*图 5.2*中，你将看到界面由两个标签页组成：`Characters`和`Animations`。这两个标签页将显示相关资产的缩略图以及一个用于预览的视口。在本书中，我们只关注动画，因此你应该选择`Animations`（不过值得注意的是，无论我们在哪个标签页中，都可以随时上传自己的角色）。\n\
    \n选择`Animations`标签页后，我们看到的界面几乎相同，唯一的区别是左侧的缩略图现在显示的是动画资产而非角色资产。在大多数情况下，缩略图角色采用\
    \ Mixamo Mannequin 风格。\n\n![图 5.3：Animations 标签页](img/B17878_05_03.jpg)\n\n图 5.3：Animations\
    \ 标签页\n\n视口上方显示名称：`SHOVED REACTION WITH SPIN ON CH06_NONPBR`。`SHOVED REACTION\
    \ WITH SPIN`是对应所选缩略图的动画名称，而`CH06_NONPBR`专门关联视口中的角色。\n\n如果单击*图 5.3*中高亮显示的齿轮图标，将出现查看动画缩略图预览或静态图像缩略图预览的选项（第一个选项对网络连接要求较高；不过，动画预览很有帮助）。\n\
    \n在下载任何动画之前，我们首先需要将 MetaHuman 角色网格上传到 Mixamo 以提高兼容性。为此，我们必须先准备好 MetaHuman。\n\n\
    ## 准备并将 MetaHuman 上传到 Mixamo\n\n为了让 MetaHuman 适配 Mixamo，首先必须确保我们导出 MetaHuman 角色时使用了正确的身体类型。你可能还记得在*第\
    \ 4 章* *重定向动画*中，当我们直接从动画资产重定向角色时，有一个预览 MetaHuman 网格的选项。这是一个重要步骤，因为我们需要使用预览网格来告诉\
    \ Mixamo 骨骼将产生多大影响。此外，这一步还能让我们直观地了解所选动作捕捉动画如何与我们选择的网格配合工作。\n\n我的角色有特定描述：女性、中等身高、超重；这在命名中标记为`F_Med_Ovw_Preview`。我们需要确保导出的正是该网格。因此，开始准备\
    \ MetaHuman 的步骤如下：\n\n1.  首先，我们需要找到正确的网格。为此，进入角色文件夹，然后导航到`Body`文件夹。在我的例子中，我需要进入`Glenda`文件夹，然后是`Female`文件夹，接着是`medium`文件夹，然后是`Overweight`，最后是`Body`文件夹。\n\
    \n2.  接下来，将角色拖入场景。你会注意到角色显示不正确。实际上，它很可能只显示整个角色的一部分。这是因为 MetaHuman 由以下网格组成：\n\n\
    \    *   头部网格\n    *   服装网格\n    *   完整的裸体网格\n\n3.  现在，非常重要的是，在`Details`面板的`Mesh`下，你会看到一个下拉菜单，允许你选择要为角色显示的网格。\n\
    \n![图 5.4：使用搜索查找预览网格](img/B17878_05_04.jpg)\n\n图 5.4：使用搜索查找预览网格\n\n如果在搜索栏中输入`preview`，你将看到所有可用的`preview`网格列表。选择正确的网格很重要，因为我们即将导出该网格用于\
    \ Mixamo。对于 Mixamo，我们只关心身体，因为 Mixamo 不提供面部动画数据；因此，在我的例子中，我将选择`f_med_ovw_body_preview`。\n\
    \n选择网格后，视口中的网格将变为无头的裸体。尽管没有头部，这正是 Mixamo 所需的一切，因为我们只关心身体运动，而这也是 Mixamo 唯一能提供的。\n\
    \n1.  导出此网格之前，我们需要确保网格位于场景原点，换句话说，位于场景的正中心。从内容面板将网格拖入场景时，仅根据鼠标光标位置放置，通常会得到随机结果——但我们可以快速修复。\n\
    \n回到`Details`面板，在我们选择预览网格的位置上方，有一个`Transform`部分。在`Location`旁，你需要将`x`、`y`和`z`坐标均设置为`0.0`，这样角色就会位于场景中心，准备好导出。\n\
    \n![图 5.5：在 Transform 中将 Location 值设置为原点](img/B17878_05_05.jpg)\n\n图 5.5：在 Transform\
    \ 中将 Location 值设置为原点\n\n1.  导出网格前，请务必在场景中选中预览网格，然后转到`File`，点击`Export Selected…`：\n\
    \n![图 5.6：导出选中项…](img/B17878_05_06.jpg)\n\n图 5.6：导出选中项…\n\n> **注意**\n>\n> 我们需要场景中有预览网格才能将其导出为\
    \ FBX 文件。无法从内容面板内部导出资产。\n\n1.  接下来，选择`FBX`作为文件类型，并给它一个容易记住的名称（如`GlendaToMixamo`）。\n\
    \n2.  确保未勾选`Map Skeleton Motion to Root`。保持所有设置为默认值，然后点击`Export`，如*图 5.7*所示：\n\
    \n![图 5.7：未勾选 Map Skeletal Motion to Root](img/B17878_05_07.jpg)\n\n图 5.7：未勾选\
    \ Map Skeletal Motion to Root\n\n接下来，我们将角色上传到 Mixamo 以应用动画。\n\n1.  无论你在 Mixamo\
    \ 中处于`Character`还是`Animation`模式，始终可以点击`Upload Character`按钮；这将打开以下界面：\n\n![图 5.8：将\
    \ MetaHuman 预览网格上传到 Mixamo](img/B17878_05_08.jpg)\n\n图 5.8：将 MetaHuman 预览网格上传到\
    \ Mixamo\n\n1.  你可以选择将网格拖放到矩形区域，或点击`Select character file`。无论哪种方式，上传文件时请耐心等待，因为处理可能需要几分钟——此时屏幕将显示以下消息：\n\
    \n![图 5.9：Mixamo 正在处理网格](img/B17878_05_09.jpg)\n\n图 5.9：Mixamo 正在处理网格\n\nMixamo\
    \ 处理完网格后，你应该会看到*图 5.10*所示的界面：\n\n![图 5.10：Mixamo 已完成处理阶段](img/B17878_05_10.jpg)\n\
    \n图 5.10：Mixamo 已完成处理阶段\n\n现在我们的角色网格已在 Mixamo 中，接下来将为其应用动画，但在此之前，我们需要进行一些调整并定向角色。\n\
    \n## 在 Mixamo 中定向角色\n\n下一步是定向角色，使其与所有 Mixamo 角色及其动画的朝向一致。幸运的是，Mixamo 提供了相关工具，避免了我们在导出阶段进行繁琐的试错过程。\n\
    \n查看*图 5.10*视口底部的三个箭头。每个箭头用于旋转角色，分别代表`x`、`y`和`z`轴。右侧还提供了定向角色的说明；我已按此操作，让角色面朝前并直立站立。\n"
