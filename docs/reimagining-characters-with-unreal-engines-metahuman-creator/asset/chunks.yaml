    \  \nBirmingham  \nB3 2PB, UK.\n\nISBN 978-1-80181-772-1\n\n[Packt 官网](http://www.packt.com)\n\
    \n## 献词\n\n献给我的母亲 Gaby，感谢她不懈的启发。献给我的妻子 Kenia 和两个孩子 Eoin 与 Isabella，感谢他们的鼓励、支持与理解。献给\
    \ Media House 的所有伙伴，感谢他们永无止境的激励。最后但同样重要的是，献给我所有伟大的朋友，感谢他们关心本书进度并用鼓励的话语宠爱我。\n\n\
    – 布莱恩·罗斯尼\n\n## 前言\n\n我认识并与布莱恩·罗斯尼共事已近十年。\n\n我们的道路因电视广告制作而交汇，当时布莱恩担任导演，而我担任摄影指导。布莱恩不同寻常之处在于，他天生具备导演才能，并辅以对后期制作和视觉效果各方面的全面掌握。\n\
    \n布莱恩在这一领域凭借苦累积的经验和热情已超过 20 年。主要从事广告和剧集制作，他制作了无数优秀的视觉效果、3D 环境和数字替身。这些技能加上传授相关知识的能力，很快得到了认可，因此他受聘在都柏林城市大学教授高级视频制作，这并不令人意外。\n\
    \n作为故事片和剧集电视的摄影指导，我已习惯看到预演可视化。但在布莱恩的指导和 Unreal Engine 的帮助下，特别是在灯光和动画方面，让我看到了更多可能性，这真是大开眼界。在一部影片中，布莱恩为每个镜头创建了\
    \ 3D 预演可视化。随后，他进而将 Unreal Engine 用于自己的作品，创作了一部令人印象深刻的短片 *Apetito*，充分发挥了该技术的优势。\n\
    \n与此同时，ILM 和迪士尼开始利用 Unreal Engine 制作他们的 *The Mandalorian* 系列！\n\nUnreal Engine\
    \ 绝对是电影人的工具，但所需技能似乎对大多数人来说遥不可及。然而，*Reimagining Characters with Unreal Engine's\
    \ MetaHuman Creator* 让艺术家能以易于遵循的方式为逼真角色制作动画，而不必被枯燥的技术术语所困扰。\n\n本书专为没有时间学习所有幕后技术、但希望快速投入项目的专业人士和爱好者设计。这就是为什么布莱恩的书是一本有效的参考书——它逐步引入数字角色的关键概念，以及如何使用和操作\
    \ Unreal Engine 的 MetaHuman Creator。\n\n此外，他还整理了最高效的工作流程，特别是在让 MetaHuman 与 Mixamo\
    \ 动画库或通过 DeepMotion 进行定制身体动作捕捉协同工作方面。\n\n拥有 iPhone 的用户还可以为角色创建高度逼真的面部捕捉，或者使用网络摄像头和\
    \ Faceware 技术。这两种方法都提供了分步操作指南。\n\n布莱恩从未打算编写涵盖 MetaHuman 方方面面或所有动作捕捉相关内容的权威指南。但他确实想写一本让读者能快速获得成果、而无需依赖多方信息来源的书。在为您完成所有研究后，成果就在这些页面中。\n\
    \n所以，开始创建您自己的高度逼真数字角色和动画，用于您的电影项目吧——这在以前只属于大型动画和电影工作室的想象——且无需所有的压力和心酸。\n\n祝拍摄愉快！\n\
    \n*Ciaran Kavanagh*  \n*ISC IATSE 669*\n\n## 贡献者\n\n## 作者简介\n\n**布莱恩·罗斯尼** 是 Rossney\
    \ Pictures 的创意总监和 VFX 监制。在电影和电视行业拥有 22 年经验，布莱恩专注于后期制作和数字视觉效果。他使用 3D 动画工具和 3D 节点式合成应用程序制作过广告和电视片头序列。凭借对\
    \ VFX 和 3D 动画流程以及实拍电影制作和导演的深入理解，布莱恩曾在都柏林城市大学和戈尔韦电影中心授课，并担任 Hallmark 和 Maravista\
    \ 的 VFX 监制。他还是两部短片的创作者——分别为使用 Unreal Engine 的 *Apetito*，以及使用 Unreal Engine 和 MetaHuman\
    \ Creator 的 *1976*。\n\n我想感谢我非常有耐心的编辑 Hayden Edwards。\n\n## 审阅者简介\n\n**Emilio Ferrari**\
    \ 是动作捕捉监制兼 Raised by Monsters（一家基于 Unreal Engine 的前期制作工作室）的 CEO。他与 Unreal Engine\
    \ 部门紧密合作，开发工具以促进动捕舞台与引擎之间的顺畅衔接。除了管理动捕舞台，他还领导研发工作，专注于寻找通过可玩工具融合 VFX、电影和 Unreal\
    \ Engine 的方法。\n\nEmilio 目前正在开发书籍 *Digital Filmmaking with Unreal Engine 5*，该书专注于使用\
    \ Unreal Engine 进行摄影和叙事。\n\n## 序言\n\n科技与艺术从未分家。近年来，我们见证了科技的飞速演变，对我们许多人来说，这些进步难以跟踪。电影背后的技术也不例外。\n\
    \n我在 1980 年代长大，那时所有电影技术还是模拟的。对我而言，一部极具启发性的影片是 *Clash of the Titans*（1981 年）。得知视觉效果动画仅由一人——Ray\
    \ Harryhausen 创作，让我惊叹不已。快进到 2000 年代，现在有数百名视觉效果艺术家和动画师组成的团队，多家公司共同制作单个影片标题。\n\n\
    随着 Unreal Engine 和 MetaHuman Creator 的出现，事情似乎回到了原点。影院级动画和 VFX 工具仅为大型富裕工作室独享的日子一去不复返。凭借性能合理的电脑，甚至是一台笔记本电脑，人们现在就能制作自己的电影。没有界限，没有借口。我们正处于一个激动人心的新时代的黎明，将看到新的\
    \ Ray Harryhausen 涌现。\n\n"
