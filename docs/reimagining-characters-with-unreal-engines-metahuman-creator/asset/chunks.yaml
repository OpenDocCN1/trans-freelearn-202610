- raw: "In the previous chapter, we took our body motion capture to the next level\
    \ by learning how to make adjustments to the animation and render video using\
    \ the Level Sequencer. The Level Sequencer plays an integral part when it comes\
    \ to managing animation and we will use it again here as we explore facial motion\
    \ capture.\n\nIn this chapter, we are specifically looking at facial motion capture\
    \ for our MetaHuman, taking advantage of the iPhone depth camera and facial tracking\
    \ features. MetaHumans come with dozens of intricate facial controls that respond\
    \ to facial capture tools, giving you the power to create incredibly realistic\
    \ facial performances including speech. This can capture your own performance\
    \ or an actor’s performance to such a degree that even very subtle nuances are\
    \ reflected, thus making the overall result incredibly realistic.\n\nSo, in this\
    \ chapter, we will cover the following topics:\n\n*   Installing the Live Link\
    \ Face app\n\n*   Installing Unreal Engine plugins (including Take Recorder)\n\
    \n*   Connecting and configuring the Live Link app to Unreal Engine\n\n*   Configuring\
    \ and testing the MetaHuman Blueprint\n\n*   Calibrating and capturing live data\n\
    \n# Technical requirements\n\nIn terms of computer power, you will need the technical\
    \ requirements detailed in [*Chapter 1*](#B17878_01.xhtml#_idTextAnchor015) and\
    \ the MetaHuman plus the Unreal Engine mannequin that we imported into UE5 in\
    \ [*Chapter 2*](#B17878_02.xhtml#_idTextAnchor027).\n\nYou will also need an iPhone\
    \ and a stable Wi-Fi connection to install plugins.\n\nLet’s look at that iPhone\
    \ requirement a little more. You will need to have an iPhone X or newer, or an\
    \ iPad Pro (3rd generation) or newer. This is because (unlike other phones, such\
    \ as Android ones) they have a built-in depth camera, which is necessary for motion\
    \ capture.\n\nYou will also need a long cable – approximately 2 meters – because\
    \ it is best to have your iPhone on charge during motion capture sessions as the\
    \ process is quite battery consuming.\n\n# Installing the Live Link Face app\n\
    \nThe Live Link Face app is a free app that you can download onto your iPhone\
    \ or iPad directly from the App Store. Its sole purpose is to utilize the iPhone’s\
    \ built-in depth camera, along with facial recognition and pixel tracking technology,\
    \ to produce data that works within ARKit. In addition to collecting facial motion\
    \ capture data in real time, it also transmits the data via **Internet Protocol\
    \ **(**IP**) to your desktop computer using a Wi-Fi connection; this data is then\
    \ picked up by the Live Link utility in Unreal Engine, which we shall delve into\
    \ later.\n\n*Figure 8**.1* shows the Live Link Face app in the Apple App Store:\n\
    \n![Figure 8.1: The Live Link Face app in the App Store ](image/B17878_01_01.jpg)\
    \ \n\nFigure 8.1: The Live Link Face app in the App Store\n\nOnce downloaded and\
    \ installed, open the app to test that it is working. While looking at the display,\
    \ you should immediately see your face. By default, the mesh overlay is enabled\
    \ as seen in *Figure 8**.2*, and you’ll see that the mesh very accurately tracks\
    \ your face.\n\n![Figure 8.2: Opening up the Live Link Face app ](image/B17878_01_02.jpg)\
    \ \n\nFigure 8.2: Opening up the Live Link Face app\n\nAs soon as our face is\
    \ being tracked, we know the app is working. There is no need to do any more with\
