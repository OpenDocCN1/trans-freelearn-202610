- raw: "Be sure to check **Apply foundation** and select one color from the palette\
    \ given. After that, you can edit the **Intensity**, **Roughness**, and **Concealer**\
    \ options. **Intensity** is self-explanatory, but in makeup terms, it can be understood\
    \ as how thick the application of the foundation is. **Roughness** can be understood\
    \ as the difference between an oil-based foundation and a powder-based foundation.\
    \ **Concealer**, however, is the intensity of the application just under the eyes.\n\
    \nAlso, if you were to go back and increase the intensity and density of your\
    \ character’s freckles, you would get a better idea of just how intense or thick\
    \ the application of the foundation makeup you have made was. In *Figure 2**.27*,\
    \ I did exactly that:\n\n![Figure 2.27: Foundation with a new palette ](image/B17878_02_27.jpg)\
    \ \n\nFigure 2.27: Foundation with a new palette\n\nI also made the makeup very\
    \ rough and dialed the intensity down enough so that we can just about see the\
    \ freckles come through. Note that the palettes between *Figure 2**.26* and *2.27*\
    \ are very different.\n\n#### Eyes\n\nNot to be confused with the earlier eye\
    \ editor, this editor is exclusively for eye makeup. *Figure 2**.28* shows an\
    \ array of presets for eye makeup:\n\n![Figure 2.28: Eye makeup ](image/B17878_02_28.jpg)\
    \ \n\nFigure 2.28: Eye makeup\n\nSimilar to the eye editor from earlier, we also\
    \ have a selection of makeup shapes. For example, we could choose from one of\
    \ the thin liner presets at the top or the dramatic smudge shape at the bottom.\n\
    \nAgain, the palette available to us complements the skin tone, which you can\
    \ see in *Figure 2**.29*, but rather than just getting a naturally complementary\
    \ palette to choose from under presets, you can also choose other options such\
    \ as **Neutral**, **Deep**, and **Vibrant**; your choice of palette will often\
    \ depend on your character. You can also create a custom palette:\n\n![Figure\
    \ 2.29: Eye makeup palette options ](image/B17878_02_29.jpg) \n\nFigure 2.29:\
    \ Eye makeup palette options\n\nLike the **FOUNDATION** tab, we have sliders that\
    \ allow us to edit the following:\n\n*   **Roughness**: Allows us to edit how\
    \ reflective the eye makeup is to light. A roughness of 0 is very reflective while\
    \ a roughness of 1 is non-reflective.\n\n*   **Transparency**: This works the\
    \ same way as intensity did; the less transparent it is, the thicker the eye makeup\
    \ that’s been applied.\n\n*   **Metalness**: This is a type of reflectivity and\
    \ indicates that the more metalness, the more detail we will see in the reflection;\
    \ a low setting would give us a duller shine. For example, a surface that is highly\
    \ metallic and has no roughness will appear like a mirror. If it has a low metalness\
    \ and low roughness, it will be shiny but the reflections will be faint. Finally,\
    \ if it has low metalness and is very rough, it would be very dull indeed, similar\
    \ to clay or plaster.\n\nLike many of the previous features, such as foundation,\
    \ eye makeup gets us some pretty realistic results. We’ll see more of this in\
    \ the next section, where we will look at the cheeks and blush makeup.\n\n####\
    \ Blush\n\nAgain, the **BLUSH** palette reflects a palette complementary to the\
    \ skin tone. Unlike the eye shadow editor, we are only given one palette as blushers\
    \ tend only to come in complementary tones rather than the vibrant alternatives\
    \ given under the eye shadow editor:\n\n![Figure 2.30: Blush palette options ](image/B17878_02_30.jpg)\
    \ \n\nFigure 2.30: Blush palette options\n\nFrom the top left, we can choose the\
    \ areas we wish to be affected, which are primarily around the cheeks and temples,\
    \ as indicated in blue in *Figure 2**.30*.\n\nWe also get **Intensity** and **Roughness**\
    \ sliders, which allow us to achieve a further sense of realism. A blusher that\
    \ has a low roughness will have a shininess different from that of the foundation\
    \ and different again from the underlying skin tone. All these subtle variations\
    \ of makeup on the skin add to the realism and are certainly worth playing around\
    \ with.\n\n#### Lips\n\nFinally, let’s discuss the **LIPS** editor, which you\
    \ can see in *Figure 2**.31*. Like the **BLUSH** selection, there isn’t a huge\
    \ amount of variation, but at least we can play around with **Roughness**, **Transparency**,\
    \ and **Color**, which is close enough to the variety available in **BLUSH**:\n\
    \n![Figure 2.31: Lipstick palette options ](image/B17878_02_31.jpg) \n\nFigure\
    \ 2.31: Lipstick palette options\n\nThe grey thumbnails at the top indicate how\
    \ the lipstick is painted on: the first indicates no lipstick, while the remaining\
    \ three options give us very subtle differences in how the lipstick is painted,\
    \ with some being slightly out of the lip area and some being less liberal.\n\n\
    We do, however, get further options to choose from if we want to go for something\
    \ a little more vibrant or funky. We can also fine-tune our color selection using\
    \ the **CUSTOM** button. As before, the **Roughness** slider allows us to make\
    \ the lipstick shinier and more reflective. At this point, we have played around\
    \ with roughness a lot; the result of roughness being low will produce an actual\
    \ response to the light in your scene. In *Figure 2**.32*, the white areas of\
    \ the lips are reflections of a light source:\n\n![Figure 2.32: Lipstick Roughness\
    \ set to zero ](image/B17878_02_32.jpg) \n\nFigure 2.32: Lipstick Roughness set\
    \ to zero\n\nNote\n\nTo see the effect of roughness, try reducing the roughness\
    \ on the lips to zero, zoom into the lips, and, with the *L* key pressed, left-click\
    \ your mouse around the main viewport to move the scene lights.\n\nSo far in this\
    \ chapter, we have covered the face in great detail. In the next section, we’ll\
    \ move on to something very different, and you will be introduced to some new\
    \ concepts as we delve into hair and hair physics.\n\n## Hair\n\nJust like the\
    \ face, the MHC comes with many presets to choose from but also offers some custom\
    \ modifications. If you load up a long-haired character, you’ll notice straight\
    \ away that the hair moves very realistically; you can expect the very same results\
    \ within Unreal Engine.\n\nThere are two main factors to consider when it comes\
    \ to hair rendering:\n\n1.  **Hair strands** or **Strand Based Grooms**: These\
    \ use splines for individual hairs, although there is a little bit of cheating\
    \ to give the illusion of more hair. With strand-based grooms, we get a far more\
    \ realistic look but the physics of how the hair moves and collides with the body\
    \ is more accurate.\n\n2.  **Hair cards**: These are simple poly shapes with images\
    \ of multiple hairs. Hair cards are also easier to render and are the default\
    \ when it comes to displaying lower LODs.\n\nBy default, the MHC uses **Strand\
    \ Based Grooms** for LOD 0 and LOD 1. In other words, they are used for close-ups\
    \ and mid-shots (head and shoulder shots). When the character is further away\
    \ from the camera, the complexity of **Strand Based Grooms** is overkill and redundant\
    \ and so hair cards are used instead. The MHC also offers the option of just using\
    \ cards should you find that your performance or frame rate is low.\n\nNote\n\n\
    Some of the presets when it comes to LODs are still in development and only offer\
    \ **Strand Based Grooms**, which, as I mentioned earlier, are available in LOD\
    \ 0 and LOD 1 only. Because there is no hair card alternative, your character\
    \ will appear bald at farther distances unless you force a LOD of 0 or 1 within\
    \ Unreal Engine. You will learn how to do that after we bring our character into\
    \ the engine.\n\nOne more consideration to take on board concerning **Hair LOD**\
    \ is the rendering quality. You may recall that, in the *Render Quality* section\
    \ earlier in this chapter, **Epic (Ray Traced)** provides us with much more realistic\
    \ shadowing within the hair, so it is worth considering that to get the best result\
    \ from hair. When working with a LOD of LOD 1 or LOD 2, it is very likely you’ll\
    \ need the **Epic (Ray Traced)** setting if you want to achieve photorealism in\
    \ a close-up shot."
