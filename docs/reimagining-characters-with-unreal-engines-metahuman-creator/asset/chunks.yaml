    # Facial Motion Capture with MetaHuman and iPhone


    In the previous chapter, we took our body motion capture to the next level by
    learning how to make adjustments to the animation and render video using the `Level
    Sequencer`. The `Level Sequencer` plays an integral part when it comes to managing
    animation and we will use it again here as we explore facial motion capture.


    In this chapter, we are specifically looking at facial motion capture for our
    `MetaHuman`, taking advantage of the iPhone depth camera and facial tracking features.
    `MetaHumans` come with dozens of intricate facial controls that respond to facial
    capture tools, giving you the power to create incredibly realistic facial performances
    including speech. This can capture your own performance or an actor''s performance
    to such a degree that even very subtle nuances are reflected, thus making the
    overall result incredibly realistic.


    So, in this chapter, we will cover the following topics:


    *   Installing the `Live Link Face` app

    *   Installing Unreal Engine plugins (including `Take Recorder`)

    *   Connecting and configuring the `Live Link` app to Unreal Engine

    *   Configuring and testing the `MetaHuman Blueprint`

    *   Calibrating and capturing live data


    # Technical Requirements


    In terms of computer power, you will need the technical requirements detailed
    in [*Chapter 1*](#B17878_01.xhtml#_idTextAnchor015) and the `MetaHuman` plus the
    Unreal Engine mannequin that we imported into UE5 in [*Chapter 2*](#B17878_02.xhtml#_idTextAnchor027).


    You will also need an iPhone and a stable Wi-Fi connection to install plugins.


    Let''s look at that iPhone requirement a little more. You will need to have an
    iPhone X or newer, or an iPad Pro (3rd generation) or newer. This is because (unlike
    other phones, such as Android ones) they have a built-in depth camera, which is
    necessary for motion capture.


    You will also need a long cable – approximately 2 meters – because it is best
    to have your iPhone on charge during motion capture sessions as the process is
    quite battery consuming.


    # Installing the Live Link Face App


    The `Live Link Face` app is a free app that you can download onto your iPhone
    or iPad directly from the App Store. Its sole purpose is to utilize the iPhone''s
    built-in depth camera, along with facial recognition and pixel tracking technology,
    to produce data that works within `ARKit`. In addition to collecting facial motion
    capture data in real time, it also transmits the data via **Internet Protocol
    (IP)** to your desktop computer using a Wi-Fi connection; this data is then picked
    up by the `Live Link` utility in Unreal Engine, which we shall delve into later.


    **Figure 8.1** shows the `Live Link Face` app in the Apple App Store:


    ![Figure 8.1: The Live Link Face app in the App Store](image/B17878_01_01.jpg)


    Figure 8.1: The Live Link Face app in the App Store


    Once downloaded and installed, open the app to test that it is working. While
    looking at the display, you should immediately see your face. By default, the
    mesh overlay is enabled as seen in **Figure 8.2**, and you''ll see that the mesh
    very accurately tracks your face.


    ![Figure 8.2: Opening up the Live Link Face app](image/B17878_01_02.jpg)


    Figure 8.2: Opening up the Live Link Face app


    As soon as our face is being tracked, we know the app is working. There is no
    need to do any more with the application for the time being. In the next section,
    we will install a number of Unreal Engine plugins, such as `Live Link`, which
    will allow us to receive the motion capture streaming data from the iPhone.


    # Installing Unreal Engine Plugins (Including Take Recorder)


    As just mentioned, there are a number of plugins that you will need to have installed.
    The good news is that upon downloading and importing your first `MetaHuman` character,
    you will have inadvertently and automatically installed them without realizing
    it. However, you will need to make sure that the following plugins are enabled:


    *   `Live Link`

    *   `Live Link Control Rig`

    *   `Live Link Curve Debug UI`

    *   `Apple ARKit`

    *   `Apple ARKit Face Support`

    *   `Take Recorder`


    To easily find the plugins, go to **Edit**, then **Plugins**, and we''ll start
    installing the required plugins.


    ## Live Link, Live Link Control Rig, and Live Link Curve Debug UI


    To find the `Live Link` plugins, search for **Live Link** as demonstrated in **Figure
    8.3**. You can see that I have enabled the following plugins, which are indicated
    by the checkboxes and the blue ticks:


    ![Figure 8.3: Enabling the Live Link plugins](image/B17878_01_03.jpg)


    Figure 8.3: Enabling the Live Link plugins


    Some of these plugins are essential for using the app and I will now briefly outline
    their importance.


    ### Live Link


    `Live Link` is the core plugin that allows third-party applications to stream
    animation data directly into Unreal Engine. Applications such as `MotionBuilder`
    and `Maya` permit users to make changes to these applications and see the results
    updated in the Unreal Engine viewport in real time. This functionality in the
    context of this book permits users to use other applications such as the `Live
    Link` iPhone app to stream data directly into Unreal Engine.


    ### Live Link Control Rig


    `Live Link Control Rig` allows the incoming data from a third-party application
    to communicate with the animation controllers of a character. For instance, a
    `MetaHuman` has a control rig that allows users to manually animate it. `Live
    Link Control Rig` harnesses the same control rig protocol.


    ### Live Link Curve Debug UI


    For the purpose of debugging and viewing the connection from a third-party animation
    data source into Unreal Engine, we will use the `Live Link Curve Debug UI` plugin.


    > **Note**

    >

    > `Live Link Curve Debug UI`, while not essential, is a convenient interface for
    troubleshooting issues when it comes to advanced refinement; however, discussing
    it in detail is beyond the scope of this book as it looks at every single control
    point of the face.


    ## ARKit and ARKit Face Support


    Next, we need `ARKit` and `ARKit Face Support`. `ARKit` is an AR solution designed
    to work exclusively on an Apple iOS camera device. It ensures that Unreal is able
    to understand the incoming data. `ARKit Face Support` connects specifically to
    the face tracking solution via depth and RGB cameras on the iPhone.


    So, in the **Plugins** tab, run a search, but this time for **ARKit**. You will
    see a list of the available `ARKit` plugins that you need to enable:


    ![Figure 8.4: Enabling the Unreal Engine ARKit plugins](image/B17878_01_04.jpg)


    Figure 8.4: Enabling the Unreal Engine ARKit plugins


    ## Take Recorder


    We have one more plugin to enable, which is `Take Recorder`. Try to think of `Take
    Recorder` as a video camera. Effectively, it records the motion capture data received
    by `Live Link` and stores it for playback, which in turn is imported into the
    `Level Sequencer`. Just like a video camera, we can record multiple takes until
    we are happy that we have got the best one (or at the very least, as close as
    possible to the best!).


    To enable **Take Recorder**, search for the plugin as per **Figure 8.5**:


    ![Figure 8.5: Enabling the Unreal Engine Take Recorder plugin](image/B17878_01_05.jpg)


    Figure 8.5: Enabling the Unreal Engine Take Recorder plugin


    > **Note**

    >

    > You may need to restart Unreal Engine if you have enabled any of these plugins
    for them to take effect.


    With all of the necessary plugins enabled, we can now move on to the next section
    where we will configure the `Live Link Face` app so that it can send data into
    Unreal Engine.


    # Connecting and Configuring the Live Link Face App to Unreal Engine


    With the `Live Link Face` app installed on the iPhone and the `Live Link` plugin
    enabled in Unreal Engine, we now need to get them to talk to each other (figuratively
    speaking, of course). Our goal is to send motion capture data from the iPhone
    to the PC and/or the `Live Link` app to send this data into Unreal Engine.


    To do this, we first need to configure the app by finding our computer''s IP address:


    1.  Hit the Windows key and search for **Command Prompt**.

    '
  trans: '

    # 使用 MetaHuman 和 iPhone 进行面部动作捕捉


    在上一章中，我们通过学习如何使用 `Level Sequencer` 调整动画和渲染视频，将身体动作捕捉提升到了一个新的水平。`Level Sequencer`
    在管理动画方面发挥着不可或缺的作用，我们将在本章中再次使用它，探索面部动作捕捉。


    在本章中，我们将专门针对我们的 `MetaHuman` 进行面部动作捕捉，利用 iPhone 的深度摄像头和面部追踪功能。`MetaHuman` 自带数十个复杂的面部控制器，可响应面部捕捉工具，赋予您创建极其逼真的面部表演（包括语音）的能力。它可以捕捉您自己的表演或演员的表演，甚至非常细微的细微差别也能反映出来，从而使整体结果极其逼真。


    因此，在本章中，我们将涵盖以下主题：


    *   安装 `Live Link Face` 应用

    *   安装 Unreal Engine 插件（包括 `Take Recorder`）

    *   连接并配置 `Live Link` 应用到 Unreal Engine

    *   配置和测试 `MetaHuman Blueprint`

    *   校准和捕捉实时数据


    # 技术要求


    就计算机性能而言，您将需要 *第 1 章* 中详述的技术要求，以及我们在 *第 2 章* 中导入到 UE5 的 `MetaHuman` 和 Unreal Engine
    模特。


    您还需要一部 iPhone 和稳定的 Wi-Fi 连接来安装插件。


    让我们更详细地看看 iPhone 的要求。您需要拥有 iPhone X 或更新机型，或 iPad Pro（第 3 代）或更新机型。这是因为（与其他手机如 Android
    手机不同）它们内置了深度摄像头，这是动作捕捉所必需的。


    您还需要一根长约 2 米的长线，因为在动作捕捉过程中最好让 iPhone 保持充电状态，因为该过程非常耗电。


    # 安装 Live Link Face 应用


    `Live Link Face` 应用是一款免费应用，您可以直接从 App Store 下载到 iPhone 或 iPad 上。其唯一目的是利用 iPhone
    内置的深度摄像头，结合面部识别和像素追踪技术，生成可在 `ARKit` 中工作的数据。除了实时收集面部动作捕捉数据外，它还通过 **互联网协议 (IP)**
    经 Wi-Fi 连接将数据传输到您的台式电脑；这些数据随后由 Unreal Engine 中的 `Live Link` 实用程序拾取，我们稍后将深入探讨。


    **图 8.1** 显示了 Apple App Store 中的 `Live Link Face` 应用：


    ![图 8.1：App Store 中的 Live Link Face 应用](img/B17878_01_01.jpg)


    图 8.1：App Store 中的 Live Link Face 应用


    下载安装后，打开应用测试其是否正常工作。注视屏幕时，您应该立即看到自己的脸。默认情况下，网格叠加层处于启用状态，如 **图 8.2** 所示，您会看到网格非常准确地追踪您的脸部。


    ![图 8.2：打开 Live Link Face 应用](img/B17878_01_02.jpg)


    图 8.2：打开 Live Link Face 应用


    一旦我们的面部被追踪，就知道应用正常工作了。暂时不需要对应用程序做更多操作。在下一节中，我们将安装许多 Unreal Engine 插件，例如 `Live
    Link`，它将允许我们从 iPhone 接收动作捕捉流数据。


    # 安装 Unreal Engine 插件（包括 Take Recorder）


    正如刚才提到的，您需要安装许多插件。好消息是，在下载并导入您的第一个 `MetaHuman` 角色时，您会在不知不觉中自动安装了它们。但是，您需要确保启用以下插件：


    *   `Live Link`

    *   `Live Link Control Rig`

    *   `Live Link Curve Debug UI`

    *   `Apple ARKit`

    *   `Apple ARKit Face Support`

    *   `Take Recorder`


    要轻松找到插件，请转到 **编辑**，然后 **插件**，我们将开始安装所需的插件。


    ## Live Link、Live Link Control Rig 和 Live Link Curve Debug UI


    要查找 `Live Link` 插件，请搜索 **Live Link**，如 **图 8.3** 所示。您可以看到我已启用以下插件，由复选框和蓝色勾号指示：


    ![图 8.3：启用 Live Link 插件](img/B17878_01_03.jpg)


    图 8.3：启用 Live Link 插件


    其中一些插件对于使用该应用至关重要，我将简要概述它们的重要性。


    ### Live Link


    `Live Link` 是核心插件，允许第三方应用程序将动画数据直接流式传输到 Unreal Engine。`MotionBuilder` 和 `Maya`
    等应用程序允许用户对这些应用程序进行更改，并实时在 Unreal Engine 视口中查看结果。在本书的语境下，此功能允许用户使用其他应用程序（如 `Live
    Link` iPhone 应用）将数据直接流式传输到 Unreal Engine。


    ### Live Link Control Rig


    `Live Link Control Rig` 允许来自第三方应用程序的传入数据与角色的动画控制器进行通信。例如，`MetaHuman` 拥有一个控制绑定，允许用户手动为其制作动画。`Live
    Link Control Rig` 利用相同的控制绑定协议。


    ### Live Link Curve Debug UI


    为了调试和查看从第三方动画数据源到 Unreal Engine 的连接，我们将使用 `Live Link Curve Debug UI` 插件。


    > **注意**

    >

    > `Live Link Curve Debug UI` 虽然非必需，但它是一个方便的界面，用于排查高级细化时的问题；然而，详细讨论它超出了本书的范围，因为它会查看面部的每一个控制点。


    ## ARKit 和 ARKit Face Support


    接下来，我们需要 `ARKit` 和 `ARKit Face Support`。`ARKit` 是一个专为 Apple iOS 摄像头设备设计的 AR 解决方案。它确保
    Unreal 能够理解传入的数据。`ARKit Face Support` 专门通过 iPhone 上的深度和 RGB 摄像头连接到面部追踪解决方案。


    因此，在 **插件** 选项卡中，运行搜索，但这次搜索 **ARKit**。您将看到需要启用的可用 `ARKit` 插件列表：


    ![图 8.4：启用 Unreal Engine ARKit 插件](img/B17878_01_04.jpg)


    图 8.4：启用 Unreal Engine ARKit 插件


    ## Take Recorder


    我们还有一个插件需要启用，即 `Take Recorder`。试着把 `Take Recorder` 想象成一台摄像机。实际上，它记录 `Live Link`
    接收到的动作捕捉数据并存储以供播放，进而导入到 `Level Sequencer` 中。就像摄像机一样，我们可以录制多个镜头，直到我们满意得到了最好的一个（或者至少尽可能接近最好的！）。


    要启用 **Take Recorder**，请按照 **图 8.5** 搜索该插件：


    ![图 8.5：启用 Unreal Engine Take Recorder 插件](img/B17878_01_05.jpg)


    图 8.5：启用 Unreal Engine Take Recorder 插件


    > **注意**

    >

    > 如果您启用了其中任何插件，可能需要重新启动 Unreal Engine 才能生效。


    启用所有必要的插件后，我们现在可以进入下一节，配置 `Live Link Face` 应用，以便它能将数据发送到 Unreal Engine。


    # 连接和配置 Live Link Face 应用到 Unreal Engine


    安装好 iPhone 上的 `Live Link Face` 应用并在 Unreal Engine 中启用 `Live Link` 插件后，我们现在需要让它们相互“通信”（当然是比喻）。我们的目标是将动作捕捉数据从
    iPhone 发送到 PC，和/或让 `Live Link` 应用将这些数据发送到 Unreal Engine。


    为此，我们首先需要通过查找计算机的 IP 地址来配置应用：


    1.  按下 Windows 键并搜索 **命令提示符**。


    '
