- raw: "When you have made your selections, hit the big **Upload** button. The upload\
    \ process depends on the speed of your internet connection; if your connection\
    \ is intermittent, expect problems as you may have to repeat the upload process.\
    \ Once your photos have been successfully uploaded, you’ll see the following message:\n\
    \n![Figure 11.9: Upload Successful notification ](image/B17878_11_09.jpg) \n\n\
    Figure 11.9: Upload Successful notification\n\nA couple of factors need to be\
    \ taken into consideration for the processing time of your photos. Because the\
    \ processing is being taken care of by servers in the cloud, your upload will\
    \ most likely have been put into a queue. So, if there’s a lot of traffic, you’ll\
    \ need to hang tight for a few minutes. You’ll be prompted if your job has been\
    \ put into a queue or has started processing and you can check on the status of\
    \ it within the app.\n\nOnce the process kicks in, the model is created alarmingly\
    \ fast. When it’s finished, you can open it up to inspect the model. In *Figure\
    \ 11**.10*, you can see a model of me. I know that you’re probably distracted\
    \ by how angelic I look, so I’ll just say briefly that from start to finish that\
    \ whole process from taking the photos to getting a usable 3D model only took\
    \ around 10 minutes.\n\n![Figure 11.10: 3D scan result ](image/B17878_11_10.jpg)\
    \ \n\nFigure 11.10: 3D scan result\n\nThe next step couldn’t be simpler. Just\
    \ hit the **Export** button, which will take you to this screen:\n\n![Figure 11.11:\
    \ Sending your exported model ](image/B17878_11_11.jpg) \n\nFigure 11.11: Sending\
    \ your exported model\n\nIn *Figure 11**.11*, you are given the option to supply\
    \ an email address. Once provided, hit **Send** to receive a download link to\
    \ your model. It will come in the form of a **.zip** folder containing both the\
    \ OBJ of the mesh and a JPG for the texture map. Make sure to unzip the folder\
    \ before continuing.\n\nIn the next section, you will bring your face mesh into\
    \ Unreal Engine.\n\n# Importing your scanned mesh into Unreal Engine\n\nWith Unreal\
    \ Engine open, go to the **Content** folder and create a new folder inside it\
    \ called **FaceMesh**. Inside the **FaceMesh** folder, right-click and select\
    \ **Import to Game/FaceMesh**. This will bring up the import dialog box, as per\
    \ *Figure 11**.12*, where you’ll see the JPG (on the left of the figure) and OBJ\
    \ files (on the right):\n\n![Figure 11.12: The JPG and OBJ files ](image/B17878_11_12.jpg)\
    \ \n\nFigure 11.12: The JPG and OBJ files\n\nYou just need to click on the **3DModel**\
    \ OBJ file, then hit **OK**.\n\nThis will open up **FBX Import Options**, as per\
    \ *Figure 11**.13* (this may seem odd as the file is an OBJ file, but this is\
    \ correct):\n\n![Figure: 11.13: Import mesh options ](image/B17878_11_13.jpg)\
    \ \n\nFigure: 11.13: Import mesh options\n\nMake sure you have ticked **Combine\
    \ Meshes **to ensure the model is imported as just one singular mesh. This is\
    \ the only option that needs to be changed. Then, click on **Import All**.\n\n\
    It will take a moment to import. You will most likely get an error log dialog\
    \ box saying there are issues in the smoothing group, but this is completely normal\
    \ so don’t be alarmed. If it happens, it will occur at the end of the import process\
    \ so there is no action to be taken.\n\nOnce imported, as seen in *Figure 11**.14*,\
    \ there are three assets in the **FaceMesh** folder: the model, the shader, and\
    \ the texture map, which automatically created the shader.\n\n![Figure 11.14:\
    \ The imported assets ](image/B17878_11_14.jpg) \n\nFigure 11.14: The imported\
    \ assets\n\nNow, right-click inside the **FaceMesh** folder, navigate down to\
    \ **MetaHuman**, and click on **MetaHuman Identity**. This will engage the new\
    \ Mesh to MetaHuman plugin you installed into the engine at the beginning of this\
    \ chapter.\n\n![Figure: 11.15: Creating a MetaHuman Identity Asset ](image/B17878_11_15.jpg)\
    \ \n\nFigure: 11.15: Creating a MetaHuman Identity Asset\n\nBy clicking on **MetaHuman\
    \ Identity**, you will create a MetaHuman Identity Asset, which is required to\
    \ use the 3D scan you just imported.\n\nNow, double-click on the **MetaHuman Identity**\
    \ icon once it is created within **FaceMesh**. MetaHuman Identity, as seen in\
    \ *Figure 11**.16*, has a relatively simple interface that consists of four main\
    \ functions.\n\n![Figure 11.16: The MetaHuman Identity interface ](image/B17878_11_16.jpg)\
    \ \n\nFigure 11.16: The MetaHuman Identity interface\n\nHighlighted from left\
    \ to right, the functions of the MetaHuman Identity interface are:\n\n*   **Components\
    \ from Mesh**: Where we bring in the mesh that we imported into the engine earlier\n\
    \n*   **Promote Frame**: Where we set up a viewing angle of our mesh for MetaHuman\
    \ Identity to use as a reference for where key features such as the eyes, nose,\
    \ and mouth are\n\n*   **Track Active Frame**: Where MetaHuman Identity uses a\
    \ facial recognition algorithm to determine key facial features from the new face\
    \ mesh\n\n*   **MetaHuman Identity Solve**: Where the magic happens, creating\
    \ a MetaHuman that is aligned to the proportions of the new face mesh\n\nNote\
    \ that I have highlighted each of the four functions in *Figure 11**.16*. The\
    \ far-left function, **Components from Mesh**, is the only one that is active.\
    \ The rest are inactive as each is dependent on the previous one to work, working\
    \ as a series of steps that we must follow in order.\n\nWe will now go through\
    \ these four functions:\n\n1.  Click on **Components from Mesh** and choose your\
    \ model:\n\n![Figure 11.17: Adding your scanned mesh ](image/B17878_11_17.jpg)\
    \ \n\nFigure 11.17: Adding your scanned mesh\n\nThen use the *F* key to center\
    \ your model, and use the rotate gismo with the *E* key to make your model face\
    \ forward.\n\n![Figure 11.18: Rotating the model ](image/B17878_11_18.jpg) \n\n\
    Figure 11.18: Rotating the model\n\n1.  When you are happy with the positioning\
    \ of the face mesh, click on **Promote Frame** to save the angle.\n\n![Figure\
    \ 11.19: Promote Frame ](image/B17878_11_19.jpg) \n\nFigure 11.19: Promote Frame\n\
    \nIf you take a look at *Figure 11**.19*, you can see that under the viewport\
    \ we now have a promoted frame titled **Frame 0**. This tells us that a frame\
    \ has been created that will be used as a reference. You can create additional\
    \ frames by clicking on the camera icon (in the bottom right), which will allow\
    \ you to get a new angle. Then, you need to click on the **Promote Frame** button\
    \ again. However, for the purpose of this chapter, let’s keep things simple and\
    \ just use **Promote ****Frame** once.\n\n1.  Moving on, we need to make sure\
    \ that the face mesh can be properly tracked. Click on the **Track Active Frame**\
    \ button, as highlighted in *Figure 11**.20*. ![Figure 11.20: Track Active Frame\
    \ ](image/B17878_11_20.jpg) \n\nFigure 11.20: Track Active Frame\n\nThe MetaHuman\
    \ Identity tool tracks the facial features that it sees. To make sure it’s doing\
    \ a good job, I suggest you toggle between **Lit** and **Unlit** in the viewport\
    \ marked in *Figure 11**.20*. In general, it does a great job at identifying the\
    \ eyes and the mouth, which is enough to get you a really good likeness to your\
    \ face scan.\n\n1.  Next, we need to create a body type for the new MetaHuman.\
    \ Take a look at *Figure 11**.21*. Select **Body** and then choose a body type\
    \ close to your own.\n\n![Figure 11.21: Choosing a body ](image/B17878_11_21.jpg)\
    \ \n\nFigure 11.21: Choosing a body\n\n1.  Now, we need to process the new mesh\
    \ shape from the face mesh scan. Click on **MetaHuman Identity Solve**, as per\
    \ *Figure 11**.22*.\n\n![Figure 11.22: Waiting for MetaHuman backend… ](image/B17878_11_22.jpg)\
    \ \n\nFigure 11.22: Waiting for MetaHuman backend…\n\nYou’ll see a prompt in the\
    \ bottom right of the screen saying **Waiting For MetaHuman backend…**. This is\
    \ because the processing will take place on the MetaHuman Cloud as it creates\
    \ a MetaHuman Solution.\n\n1.  The process of waiting for the backend can take\
    \ a few minutes, but as soon as it has completed, the **Mesh to MetaHuman** button\
    \ will be available to select, as shown in *Figure 11**.23*.\n\n![Figure 11.23:\
    \ The Mesh to MetaHuman button ](image/B17878_11_23.jpg) "
