    ## 妆容


    务必勾选**涂抹粉底**，并从给定的调色板中选择一种颜色。之后，您可以编辑**强度**、**粗糙度**和**遮瑕**选项。**强度**不言自明，但在化妆术语中，可以理解为粉底涂抹的厚度。**粗糙度**可以理解为油性粉底和粉状粉底的区别。然而，**遮瑕**是指眼下部位涂抹的强度。


    此外，如果您返回并增加角色雀斑的强度和密度，您将更好地了解您制作的粉底妆容涂抹得有多浓或多厚。在图 2.27 中，我正是这么做的：


    ![Figure 2.27: Foundation with a new palette](img/B17878_02_27.jpg)


    图 2.27：使用新调色板的粉底


    我还让妆容变得非常粗糙，并将强度调低到足以让我们勉强看到雀斑透出来。请注意，图 2.26 和图 2.27 之间的调色板差别很大。


    ### 眼睛


    请勿将其与之前的眼睛编辑器混淆，此编辑器专门用于眼部化妆。图 2.28 显示了一系列眼部化妆预设：


    ![Figure 2.28: Eye makeup](img/B17878_02_28.jpg)


    图 2.28：眼部化妆


    与之前的眼睛编辑器类似，我们也有一系列妆容形状可供选择。例如，我们可以选择顶部的细眼线预设之一，或底部的夸张晕染形状。


    同样，我们可用的调色板与肤色相衬，您可以在图 2.29 中看到这一点，但除了在预设下获得一个自然互补的调色板供选择外，您还可以选择其他选项，如**中性**、**深沉**和**鲜艳**；您对调色板的选择通常取决于您的角色。您还可以创建自定义调色板：


    ![Figure 2.29: Eye makeup palette options](img/B17878_02_29.jpg)


    图 2.29：眼部化妆调色板选项


    与**粉底**选项卡一样，我们有滑块允许我们编辑以下内容：


    *   **粗糙度**：允许我们编辑眼部妆容对光线的反射程度。粗糙度为 0 时反射性极强，而粗糙度为 1 时则无反射。

    *   **透明度**：这与强度的工作方式相同；透明度越低，涂抹的眼部妆容就越厚。

    *   **金属度**：这是一种反射类型，表示金属度越高，我们在反射中看到的细节越多；设置较低会带来较暗淡的光泽。例如，一个高金属度且无粗糙度的表面看起来会像镜子。如果金属度低且粗糙度低，它会发亮但反射微弱。最后，如果金属度低且非常粗糙，它会非常暗淡，类似于粘土或灰泥。


    与之前的许多功能（如粉底）一样，眼部妆容能给我们带来相当逼真的效果。我们将在下一节中看到更多相关内容，届时我们将介绍脸颊和腮红妆容。


    ### 腮红


    同样，**腮红**调色板反映了与肤色互补的调色板。与眼影编辑器不同，我们只获得一个调色板，因为腮红通常只有互补色调，而不像眼影编辑器那样提供鲜艳的替代色调：


    ![Figure 2.30: Blush palette options](img/B17878_02_30.jpg)


    图 2.30：腮红调色板选项


    从左上角开始，我们可以选择希望受影响的区域，主要集中在脸颊和太阳穴周围，如图 2.30 中的蓝色所示。


    我们还获得**强度**和**粗糙度**滑块，这使我们能获得更强的真实感。低粗糙度的腮红会有不同于粉底的光泽，也不同于底层肤色的光泽。皮肤上所有这些细微的妆容变化都增加了真实感，绝对值得反复调整尝试。


    ### 嘴唇


    最后，让我们讨论一下**嘴唇**编辑器，如图 2.31 所示。与**腮红**选择类似，变化不算大，但至少我们可以调整**粗糙度**、**透明度**和**颜色**，这与**腮红**中可用的种类已经很接近了：


    ![Figure 2.31: Lipstick palette options](img/B17878_02_31.jpg)


    图 2.31：口红调色板选项


    顶部的灰色缩略图指示口红的涂抹方式：第一个表示无口红，其余三个选项在涂抹方式上给我们非常细微的差别，有些稍微超出嘴唇区域，有些则涂抹得较少。


    不过，如果我们想要更鲜艳或更前卫的效果，确实还有更多选项可供选择。我们还可以使用**自定义**按钮微调颜色选择。和之前一样，**粗糙度**滑块允许我们让口红更亮、反射更强。此时我们已经大量尝试了粗糙度；粗糙度低的结果会对场景中的光线产生真实的响应。在图
    2.32 中，嘴唇的白色区域是光源的反射：


    ![Figure 2.32: Lipstick Roughness set to zero](img/B17878_02_32.jpg)


    图 2.32：口红粗糙度设为零


    ### 注意


    要查看粗糙度的效果，请尝试将嘴唇的粗糙度降至零，放大嘴唇，然后按住 `L` 键，在主视口周围左键单击鼠标以移动场景灯光。


    本章迄今为止，我们详细介绍了面部。在下一节中，我们将转向完全不同的内容，当我们深入探讨头发和头发物理时，您将接触到一些新概念。


    ## 头发


    就像面部一样，MHC 提供了许多可供选择的预设，也提供了一些自定义修改。如果您加载一个长发角色，您会立即注意到头发移动得非常逼真；您在虚幻引擎中也能获得完全相同的效果。


    关于头发渲染，有两个主要因素需要考虑：


    1.  **发丝** 或 **基于发丝的毛发**：这些使用样条线代表单根头发，虽然有一点“作弊”成分以营造更多头发的错觉。使用基于发丝的毛发，我们能获得更逼真的外观，但头发移动和与身体碰撞的物理表现更准确。

    2.  **发卡**：这些是带有多根头发图像的简单多边形形状。发卡也更容易渲染，是在显示较低 LOD 时的默认选择。


    默认情况下，MHC 对 LOD 0 和 LOD 1 使用**基于发丝的毛发**。换句话说，它们用于特写和中景镜头（头部和肩部镜头）。当角色离相机较远时，**基于发丝的毛发**的复杂度就大材小用且多余，因此改用发卡。如果您发现性能或帧率较低，MHC
    也提供仅使用发卡的选项。


    ### 注意


    关于 LOD 的一些预设仍在开发中，仅提供**基于发丝的毛发**，正如我之前提到的，这些仅在 LOD 0 和 LOD 1 中可用。由于没有发卡替代方案，除非您在虚幻引擎中强制设置
    LOD 为 0 或 1，否则您的角色在远距离下将显得秃顶。在我们将角色导入引擎后，您将学习如何执行此操作。


    关于**头发 LOD** 还有一个考虑因素是渲染质量。您可能记得，在本章前面的*渲染质量*部分，**史诗级（光线追踪）**为我们提供了头发内部更逼真的阴影，因此值得考虑该设置以获得最佳头发效果。当使用
    LOD 1 或 LOD 2 时，如果您想在特写镜头中实现照片级真实感，很可能需要**史诗级（光线追踪）**设置。


