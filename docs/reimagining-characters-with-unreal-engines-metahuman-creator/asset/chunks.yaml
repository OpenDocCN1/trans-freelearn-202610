    ## Lighting Presets


    *   **`Silhouette`**: An important yet overlooked feature when it comes to character
    design is to see the character in a silhouette. It gives us the ability to see
    the shape of the character quickly without the distraction of color, reflective,
    and shadow features.


    *   **`Split`**: While similar to the `Studio` light preset, `Split` gives us
    high contrast and is a great way of measuring the translucency of the character’s
    skin due to the intensity of the key light or main light. In this preset, we have
    a split of high-intensity key light to complete darkness. It is a great way to
    showcase both realism and extreme lighting and to determine both the realism and
    style of light falling off from intense light to darkness. The areas between the
    high-intensity lighting and shadow, particularly on the skin, are known as `roll-offs`,
    a commonly used term by cinematographers.


    *   **`Fireside`**: Similar to `Split`, we get high contrast, but we also get
    the gradual fall-off and attenuation typical of fire. In addition, we get the
    tonality typical of fire from orange to deep blue. Most importantly, `Fireside`
    allows the user to determine the roll-off of intense light and how it falls off
    into shadow around the face and whether or not detail in the skin is still present
    with this subtlety compared to the `Split` preset, which would present obvious
    detail in the skin’s surface.


    *   **`Moonlight`**: Similar to `Fireside`, we are presented with vibrant tones
    – in this case, blue moonlight. However, it is a much more ambient light with
    less intensity from any one angle.


    *   **`Tungsten`**: While not completely representing the tonality of a common
    tungsten lamp, it does allow us to see how the skin tone would respond to a tungsten
    lamp. A lighting preset like this could determine how much detail in freckles
    would be lost or gained in a similar scenario.


    *   **`Portrait`**: This is a very handy preset as it can double as an indoor
    and outdoor light to determine how our character’s skin behaves. For example,
    by rotating the scene light using `Left Mouse + L`, or using the `Light Rig Rotation`
    slider shown in `Figure 2.16`, we can mimic a window with daylight lighting without
    the distraction found in the background image that comes with the `Indoor` lighting
    preset.


    *   **`Red Lantern`**: Similar to `Fireside`, we have strong red hues to work
    with, but we have the advantage of seeing much more intensity without the deep
    blue background. This allows us to work with a more dramatic lighting setup in
    mind.


    *   **`GR22 Rooftop`**: This is a very effective use of image-based lighting,
    but one that gives slightly overcast lighting. This is a convenient lighting preset
    that will work for a lot of daylight scenes because there are areas of high intensity
    but, for the most part, we get a slightly diffused light. This diffused light
    comes from direct light being bounced back from buildings and ground surfaces,
    much like in the real world.


    *   **`Downtown Night`**: This is very similar to `GR22 Rooftop`, except it’s
    at night and lit purely by electrical lights from sources such as street lighting
    and cars.


    *   **`Underpass Night`**: This is similar to `Downtown Night` but in closer quarters.
    It only features fixed lighting, combining multiple tungsten lights of varying
    hues and intensities.


    To take this a step further, the MHC has a background color option. For some of
    the lighting presets, you can see a strong impact on changing the background color.
    For example, you may want to see what your character looks like in a generic studio
    soft light but want to see your character up against a particular color that you
    had in mind for your scene. In `Figure 2.17`, I have illustrated some lighting
    rigs with the Glenda character:


    ![Figure 2.17: Various lighting examples](image/B17878_02_17.jpg)


    *Figure 2.17: Various lighting examples*


    ## Camera


    As per `Figure 2.15`, the default camera is set to `Face`. However, there are
    several preset camera angles for which you can use keyboard shortcuts:


    *   `1`: `Face`

    *   `2`: `Body`

    *   `3`: `Torso`

    *   `4`: `Legs`

    *   `5`: `Feet`

    *   `6`: `Face`


    Alternatively, you can just as easily navigate with your mouse instead of using
    any camera presets. If you ever find yourself lost in the scene, a handy shortcut
    to use is the `1` key to get back to looking at the front of your character’s
    head using the `Face` camera preset.


    In addition, we can preview several different render quality presets to emulate
    the render quality settings that exist in Unreal Engine.


    ## Render Quality


    The MHC has three options to choose from when it comes to rendering quality:


    *   `Medium` (this is the default setting)

    *   `High (ray traced)`

    *   `Epic (ray traced)`


    If you choose the highest quality with ray traced settings, this won’t have any
    impact on your machine because the processing of the high-quality render is all
    done in the cloud. However, this feature is a useful indicator of the result you
    will get when you use the highest settings under a similar lighting setting.


    The differences between the render settings are subtle. You may notice the quality
    under the hair intensify, depending on the quality you use. They are there only
    to give you an indication of what your character would look like should you provide
    a similar setting, using the corresponding render quality settings that come with
    Unreal Engine.


    ## Level of Detail


    **Level of Detail** (`LOD`) is the generation of multiple meshes and texture maps
    based on one source object. Each mesh and map will have varying amounts of detail.


    The purpose of `LOD` is engine optimization. As one of the design principles of
    a game engine is real-time rendering, `LOD` helps this by reducing the number
    of triangles in a mesh or pixels in a texture map when they’re not needed. `LOD`
    works on the principle of changing the complexity of a mesh based on camera distance.
    The further away the camera is from an object, the less detail is required without
    breaking the illusion of realism.


    For example, a close-up shot of a MetaHuman’s face would require the best quality
    possible. In this case, we would need to be looking at the original mesh and texture
    maps. In general, the original mesh for an MHC is about 35,000 triangles and is
    made up of texture maps as big as 8,000 pixels in width. It would be a vast waste
    of resources to be rendering this kind of data if it wasn’t necessary.


    A good exercise to see how effective `LOD` is on your character is to go to the
    viewport and look through the `Face` camera. You can do this by simply pressing
    `1` on your keyboard. This will give you a close-up of the character. From there,
    you can choose from all the various `LOD`s, from `LOD 0` right down to `LOD 7`.


    At first, you won’t notice much of a difference between `LOD 0` and `LOD 1`, but
    as soon as you get down to `LOD 5`, `LOD 6`, and `LOD 7`, you will notice significant
    degradation of both the geometry and the texture map quality. You can see this
    change in `Figure 2.18`:


    ![Figure 2.18: LODs from 0 to 7](image/B17878_02_18.jpg)


    *Figure 2.18: LODs from 0 to 7*


    We can push this illustration further by using the `Far` camera; you can do this
    by pressing `6` on your keyboard. Unfortunately, this is as far as we can go back
    with the camera in the MHC. However, by toggling between `LOD 6` and `LOD 7`,
    we can see a difference. This is because `LOD 6` and `LOD 7` are designed to be
    used when the camera is even further back.


    In this view, if you toggle between `LOD 3` and `LOD 4`, you won’t see much of
    a difference. Therefore, it would be a clear waste of resources to be displaying
    `LOD 0`, which is around 35,000 triangles and 8K texture maps. Without `LOD`,
    computers would never be able to handle multiple characters, let alone crowds.


    Much of this process is automated for you when it comes to MetaHumans and Unreal
    Engine, but we will discuss `LOD` when we bring our character into Unreal, particularly
    for hair.

