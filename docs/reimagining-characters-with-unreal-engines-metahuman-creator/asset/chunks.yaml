    motion capture files with Mixamo and DeepMotion.


    To add body animation, just click on `+Track`, then go to `Animation`, as shown
    in Figure 10.3:


    ![Figure 10.3: Adding an animation](image/B17878_10_03.jpg)

    *Figure 10.3: Adding an animation*


    If you don’t see your animation in the list, use the search function. Remember,
