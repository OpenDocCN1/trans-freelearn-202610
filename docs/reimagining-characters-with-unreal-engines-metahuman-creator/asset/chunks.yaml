    \ ](image/B17878_01_03.jpg) \n\nFigure 8.3: Enabling the Live Link plugins\n\n\
    Some of these plugins are essential for using the app and I will now briefly outline\
    \ their importance.\n\n### Live Link\n\nLive Link is the core plugin that allows\
    \ third-party applications to stream animation data directly into Unreal Engine.\
    \ Applications such as MotionBuilder and Maya permit users to make changes to\
