  trans: '

    如果你一直跟随所有章节的内容，你将已经使用 Mixamo 和 DeepMotion 创建了身体动作捕捉文件。


    要添加身体动画，只需点击 `+Track`，然后选择 `Animation`，如图 10.3 所示：


    ![图 10.3：添加动画](img/B17878_10_03.jpg)

    *图 10.3：添加动画*


    如果在列表中看不到你的动画，请使用搜索功能。请记住，你添加的任何轨道都必须经过重定向，因此你在搜索时始终可以使用 `Retargeted` 后缀。这样，你就能看到项目中所有可用的动捕数据。


    在图 10.4 中，你可以看到我已经添加了一个轨道。你甚至可以看到它有轨道标题，这可以让你一眼确认你使用的是正确的动捕轨道：


    ![图 10.4：已添加的轨道](img/B17878_10_04.jpg)

    *图 10.4：已添加的轨道*


    你在第 8 章末尾完成了这一步，但在下一节中，我们将探讨为身体引入额外动捕轨道的方法。


    ## 添加额外的身体动捕数据并合并动捕片段


    引入额外动捕轨道有两种方法：


    *   添加动画轨道

    *   向现有轨道添加动画


    现在让我们来看看它们。


    ### 添加动画轨道


    要在 Level Sequencer（关卡序列器）中将动画片段作为轨道添加，请点击 `Body` 旁边的 `+` 图标。这将创建一个额外的动画轨道，你可以沿时间轴重新定位它，并使用关键帧通过权重工具将其与第一个轨道混合。


    在图 10.5 中，你可以看到我现在有两个动画轨道：


    *   第一个轨道是我在 DeepMotion 中创建的 Happy Dance（快乐舞蹈）文件，我为它创建了两个关键帧。第一个关键帧有一个 `Weight`
    值（即对角色的影响值）。默认情况下，`Weight` 值为 `1`，相当于 100% 的影响力；这意味着第一个动画轨道最为突出。对于第二个关键帧，我将 `Weight`
    值设为 `0`，相当于 0%；这意味着没有快乐舞蹈了。我知道，这听起来很扫兴；不过 Glenda 还不至于绝望，因为我对新动画轨道做了相反的操作。

    *   在第二个动画轨道中，即从 Mixamo 获取的 Macerena 文件，我为 `Weight` 值设置了关键帧，使其从 0% 开始过渡到 100%，从而利用关键帧有效地混合了这两支舞蹈：


    ![图 10.5：添加另一个轨道](img/B17878_10_05.jpg)

    *图 10.5：添加另一个轨道*


    ### 向现有轨道添加动画


    向现有轨道添加动画不会创建额外的轨道，而是将新动画添加到同一轨道上。不要点击 `Body` 旁边的 `+Track` 图标，而是点击 `Body` 下方的
    `+Animation`，如图 10.6 所示：


    ![图 10.6：将两个动画合并到一个轨道](img/B17878_10_06.jpg)

    *图 10.6：将两个动画合并到一个轨道*


    在图 10.6 中，我已经添加了动画。注意我用红框标出的两个轨道之间的过渡。实际上，我已将一个动画轨道合并到另一个轨道中，这由一条先下降后上升的曲线指示。


    要以这种方式合并轨道，你必须将播放头移至 Level Sequencer 中第一个轨道的末尾。如果你的动画是 100 帧，请务必移至更高的帧数，例如 120
    帧；否则，你将无法将动画合并到该轨道。然后，你必须将第二个片段向左拖动，使其与第一个片段相交。


    请注意，它会在同一动画轨道上自动从第一个动画过渡到第二个动画。实际上，此方法已将两个动画合并为一个轨道。注意已合并的两个动画片段之间的数字（红框内）。它显示为
    `0093`。这表示从一个动画过渡到下一个动画的过渡长度为 93 帧，约为 3 秒。


    在下一节中，我们将介绍一个实用技巧，帮助对齐动画。


    #### 使用“显示骨骼”功能实现更整洁的对齐


    有时，当我们尝试合并动画时，效果并不理想。例如，如果第一个动画是角色行走，第二个动画是角色奔跑，角色往往会从一帧到下一帧剧烈地跳跃到新位置。


    为了进行此类调整，我们需要在 Level Sequencer 中为身体添加一个 `Transform`（变换）轨道。你可以按照图 10.7 所示操作：


    ![图 10.7：添加变换轨道](img/B17878_10_07.jpg)

    *图 10.7：添加变换轨道*


    这将在 Level Sequencer 中创建一个新的变换轨道，允许我们在 `Location`（位置）参数中创建关键帧。现在，我们可以移动角色来修复任何角色位置问题，而不会影响任何整体动画属性。我们应用的任何角色移动将仅在新的变换轨道上设置关键帧，因此我们不会无意中丢失任何原始动作捕捉数据。


    例如，想象一个角色站立挥手的动画。如果动捕数据有问题，导致身体随机向上升起，但我们对角色挥手的动作很满意，我们可以通过在 `Location` 参数添加关键帧来修复随机的向上移动。我们可以做到这一点，而不会对手臂挥动的动作产生负面影响。


    然而，在将角色从 A 点移动到 B 点时，要看到细微的调整可能有点麻烦。为了解决这个可见性问题，Unreal 有一个功能可以让我们看到 MetaHuman
    骨骼。这使我们能够专注于角色的确切位置，而不会被网格体干扰。


    通过右键点击时间轴，你将看到 `Show Skeleton`（显示骨骼）选项。点击它将显示一个亮粉色的骨骼，有助于进行细微调整，如图 10.8 所示：


    ![图 10.8：显示骨骼](img/B17878_10_08.jpg)

    *图 10.8：显示骨骼*


    **注意**：使用 `Show Skeleton` 功能时，两个动画将显示为不同颜色的骨骼，这使得对齐它们变得更容易一些。


    使用 `Transform` 轨道和 `Show Skeleton` 功能的常见示例是当你想要循环动画时，例如行走循环。


    然而，如果你有一个角色从位置 A 走到位置 B，并且你希望循环动画以使角色继续行走，我们会遇到一个问题。问题是，一旦角色到达位置 B，如果我们希望它循环，它就会返回位置
    A。


    使用 `Transform` 轨道，并在定位器上放置关键帧，你可以创建一个使用循环的持续动画：


    1.  在 Level Sequencer 中为你的 `Animation` 轨道添加一个 `Transform` 轨道。

    2.  转到轨道的最末端，在最后一帧为定位器位置（即 `X`、`Y` 和 `Z`）添加关键帧。如果你在 Level Sequencer 中选中了变换轨道，也可以通过按
    `Enter` 键来执行此操作。我们这样做是为了锁定动画的位置，使其不受下一步的影响。

    3.  现在，延长轨道使其重复。在重复部分的第一帧，添加一个新位置，使角色占据与原始轨道末尾相同的空间。你很可能只需要略微编辑 `X` 和 `Y` 轴的位置，如果角色不是直线行走，可能还需要在
    `Z` 轴上旋转角色。每个片段都有显示其骨骼的选项，因此通过显示骨骼可以帮助略微编辑 `X` 和 `Y` 位置，因为你本质上只是对齐每个轨道的骨骼，使它们占据相同的空间。


    **注意**

