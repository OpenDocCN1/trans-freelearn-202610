    Figure 4.26: Applying the retargeted animation to the character Blueprint


    1. Similar to Figure 4.24, we can run a search to find the animation, and with
    the `Retargeted` suffix, we can confirm that we have selected the correct animation
    as per Figure 4.27:


    ![Figure 4.27: Using the search function to find the retargeted animation](image/B17878_04.27.jpg)


    Figure 4.27: Using the search function to find the retargeted animation


    1. If you haven’t done so already, drag and drop your `BP_Glenda` file from your
    `MetaHumans` folder into Unreal Engine’s main viewport. Then, hit **Play** to
    simulate a game and see your animation play in the viewport.


    ![Figure 4.28: Hitting play](image/B17878_04.28.jpg)


    Figure 4.28: Hitting play


    We’ve gone through the steps to creating an IK Retargeter to make a source IK
    Rig talk to a target IK Rig, but we focused on just one animation. Let’s take
    a look at what to do when we have additional animation.


    ## Importing more animation data


    To see more animations at work, you can go to the Unreal Engine Marketplace and
    search for the Animation Starter Pack. This is a free animation pack that works
    with Unreal Engine version 5.0 and you can add it to your project if your project
    is still open.


    So, why don’t we see how easy it is to retarget animation without the need to
    open the IK Retargeter using the Animation Starter Pack?


    1. With your project open, enter Epic Games and go to **Marketplace**.


    2. Under **UE5**, choose **Animations**. Then, under **Filters**, choose **Max
    Price** as **Free**.


    This should bring up the Animation Starter Pack, and by clicking on it, you will
    see a page as per Figure 4.29:


    ![Figure 4.29: Animation Starter Pack](image/B17878_04.29.jpg)


    Figure 4.29: Animation Starter Pack


    1. Click **Add To Project** to add the pack directly to your open project.


    By doing this, an `AnimationStarterPack` folder will appear in your Project Content
    folder.


    1. Navigate there and right-click on one of the animation files, as per Figure
    4.30. Select **Retarget Animation Assets** and you’ll see that your only option
    is to choose **Duplicate and Retarget Animation Assets**:


    ![Figure 4.30: Right-click to retarget animation asset](image/B17878_04.30.jpg)


    Figure 4.30: Right-click to retarget animation asset


    Once selected, you will be brought to the dialog box illustrated in Figure 4.31:


    ![Figure 4.31: Duplicate and Retarget Animation Assets dialog box](image/B17878_04.31.jpg)


    Figure 4.31: Duplicate and Retarget Animation Assets dialog box


    There are three points to note regarding this figure:


    * Under `IK Retargeter`, I chose `NewIK Retargeter`. Once you’ve selected the
    correct IK Retargeter, both viewports will instantly update; in my case, it will
    show `SK_Mannequin` as the source and `f_med_ovw_body_preview` as the target.


    * I changed the `Suffix` option to `RETARGET`. This is just good housekeeping
    so that you can find it easily at a later stage.


    * Choose what directory you want to save your new asset into and click on **Retarget**.


    **Note**


    While only for previewing, take note of the drop-down lists under each viewport
    in Figure 4.31. Here, you can preview the associated mesh of both the source and
    target skeletons.


    Now, we’ve managed to import a new animation and added it to our character without
    having to use the IK Retargeter again.


    ## Summary


    In this chapter, we learned a little about IK and FK, and explored both the IK
    Rig and the IK Retargeter tools.


    More importantly, we uncovered the principles of IK chains, visual aids, such
    as the highlight function for comparing the source and target IK chains, and the
    procedures that allow us to create effective and accurate IK chains that the IK
    Retargeter can use.


    We also retargeted an animation effectively and applied it to our scene using
    the IK Retargeter and applied an alternative method of retargeting the animation
    assets.


    In the next chapter, we will look at Mixamo so that we can use an extensive library
    of body animations and apply them to our MetaHuman characters. We will also look
    at using the IK Retargeter to retarget multiple animations in one go.


    # Chapter 5: Retargeting Animations with Mixamo


    In the previous chapter, we were introduced to the idea of retargeting animations,
    as well as discussing IK Rigs, IK chains, and IK Retargeters.


    In this chapter, we are going to go further afield and take animation from a third-party
    supplier, **Mixamo**, a very large online library full of motion capture files
    that you can preview on a web browser. You will learn how to use external resources
    such as Mixamo in order to give much more variety to your animations; this is
    important, as repurposing the same animations repeatedly makes for poor productions.
    We will also remain focused on working with body motion only in this chapter.


    So, in this chapter, we will cover the following topics:


    * Introducing Mixamo

    * Preparing and uploading the MetaHuman to Mixamo

    * Orienting your character in Mixamo

    * Exploring animation in Mixamo

    * Downloading the Mixamo animation

    * Importing the Mixamo animation into Unreal


    ## Technical requirements


    To complete this chapter, you will need the technical requirements detailed in
    [Chapter 1](#B17878_01.xhtml#_idTextAnchor015), and the MetaHuman and the Unreal
    Engine Mannequin that we imported into UE5 in [Chapter 2](#B17878_02.xhtml#_idTextAnchor027).
    Both of these will need to be saved in the same project in UE, and you will need
    to have UE running for this chapter.


    You will also need a stable internet connection, as we will be uploading a MetaHuman
    mesh and downloading numerous animation assets. We will effectively be repeating
    steps taken in [Chapter 4](#B17878_04.xhtml#_idTextAnchor059), but instead, we
    will be retargeting motion capture from a third-party source.


    ## Introducing Mixamo


    For a lot of artists planning on using MetaHumans in Unreal, Mixamo could easily
    be all they need in terms of body animation. Mixamo is an online library of thousands
    of **motion capture (mocap)** files created over a number of years by motion capture
    performers. In addition to housing this extensive library of mocap files, Mixamo
    also has many premade characters. Mixamo allows you to upload your own characters,
    where it will run an automated process of applying a Mixamo Rig with skin weights.
    This automated process removes the need for a lot of tedious work that would normally
    be done in programs such as Maya or 3ds Max, which is beyond the scope of this
    book.


    Many of the animations within Mixamo allow you to further refine the mocap animation
    and solve problems during the online session to avoid further editing in Unreal.
    As you already have experience using an online character creator such as the `MHC`,
    you will find Mixamo much less complicated to use and a very fast and efficient
    way of adding animation to your characters quickly.


    The first thing you need to do is go over to [`www.mixamo.com`](https://www.mixamo.com).
    This is where you’ll see the landing page for Mixamo as per Figure 5.1:


    ![Figure 5.1: Mixamo home screen](image/B17878_05_01.jpg)


    Figure 5.1: Mixamo home screen


    In the top-left corner, you will see an Adobe logo. Adobe, the maker of Photoshop
    and After Effects (to name but a few), acquired Mixamo but has kept it running,
    as it is a tremendous tool for character designers and animators.


    You will also notice in the top-right corner that I have already signed in. Before
    you sign in, you need to create a Mixamo account. If you have an Adobe account,
    you can use that. If not, using an email and creating a password will suffice.


    Once you’ve logged in, you’ll be taken to the main Mixamo interface:


    ![Figure 5.2: The Mixamo interface](image/B17878_05_02.jpg)


    Figure 5.2: The Mixamo interface

    '
  trans: '

    图 4.26：将重定向动画应用到角色蓝图


    1. 与图 4.24 类似，我们可以运行搜索来查找动画，并且通过 `Retargeted` 后缀，我们可以确认已按照图 4.27 选择了正确的动画：


    ![图 4.27：使用搜索功能查找重定向动画](img/B17878_04.27.jpg)


    图 4.27：使用搜索功能查找重定向动画


    1. 如果您尚未这样做，请将 `MetaHumans` 文件夹中的 `BP_Glenda` 文件拖放到 Unreal Engine 的主视口中。然后，点击**播放**以模拟游戏，并在视口中查看动画播放。


    ![图 4.28：点击播放](img/B17878_04.28.jpg)


    图 4.28：点击播放


    我们已经完成了创建 IK 重定向器的步骤，使源 IK 骨架能够与目标 IK 骨架通信，但我们仅专注于一个动画。让我们看看当有额外动画时该怎么做。


    ## 导入更多动画数据


    要查看更多动画的实际效果，您可以前往 Unreal Engine 市场并搜索“Animation Starter Pack”（动画入门包）。这是一个免费的动画包，适用于
    Unreal Engine 5.0 版本，如果您的项目仍然打开，您可以将其添加到项目中。


    那么，让我们看看使用动画入门包在不打开 IK 重定向器的情况下重定向动画有多容易吧。


    1. 在项目打开的情况下，进入 Epic Games 并前往**市场**。


    2. 在 **UE5** 下选择**动画**。然后在**筛选器**下，将**最高价格**选择为**免费**。


    这应该会显示动画入门包，点击它后，您将看到如图 4.29 所示的页面：


    ![图 4.29：动画入门包](img/B17878_04.29.jpg)


    图 4.29：动画入门包


    1. 点击**添加到项目**以将该包直接添加到您打开的项目中。


    执行此操作后，`AnimationStarterPack` 文件夹将出现在您的项目内容文件夹中。


    1. 导航到该处并右键点击其中一个动画文件，如图 4.30 所示。选择**重定向动画资产**，您将看到唯一的选项是选择**复制并重定向动画资产**：


    ![图 4.30：右键点击以重定向动画资产](img/B17878_04.30.jpg)


    图 4.30：右键点击以重定向动画资产


    选中后，您将进入如图 4.31 所示的对话框：


    ![图 4.31：复制并重定向动画资产对话框](img/B17878_04.31.jpg)


    图 4.31：复制并重定向动画资产对话框


    关于此图有三点需要注意：


    * 在 `IK Retargeter` 下，我选择了 `NewIK Retargeter`。一旦您选择了正确的 IK 重定向器，两个视口将立即更新；在我的情况下，它将显示
    `SK_Mannequin` 为源，`f_med_ovw_body_preview` 为目标。


    * 我将 `Suffix` 选项更改为 `RETARGET`。这只是良好的管理习惯，以便您稍后能轻松找到它。


    * 选择要将新资产保存到的目录，然后点击**重定向**。


    **注意**


    虽然仅用于预览，但请注意图 4.31 中每个视口下的下拉列表。在这里，您可以预览源骨架和目标骨架关联的网格体。


    现在，我们成功导入了一个新动画并将其添加到我们的角色中，而无需再次使用 IK 重定向器。


    ## 总结


    在本章中，我们了解了一些关于 IK 和 FK 的知识，并探索了 IK 骨架和 IK 重定向器工具。


    更重要的是，我们揭示了 IK 链的原理、视觉辅助工具（如用于比较源和目标 IK 链的高亮功能），以及允许我们创建 IK 重定向器可使用的有效且准确的 IK
    链的程序。


    我们还使用 IK 重定向器有效地重定向了一个动画并将其应用到场景中，并应用了一种重定向动画资产的替代方法。


    在下一章中，我们将介绍 Mixamo，以便我们可以使用庞大的身体动画库并将其应用到我们的 MetaHuman 角色上。我们还将探讨使用 IK 重定向器一次性重定向多个动画。


    # 第 5 章：使用 Mixamo 重定向动画


    在上一章中，我们介绍了重定向动画的概念，并讨论了 IK 骨架、IK 链和 IK 重定向器。


    在本章中，我们将走得更远，从第三方供应商 **Mixamo** 获取动画，Mixamo 是一个庞大的在线库，包含大量动作捕捉文件，您可以在网页浏览器中预览。您将学习如何使用
    Mixamo 等外部资源，为您的动画提供更多样化的选择；这很重要，因为重复使用相同的动画会导致制作质量低下。本章我们将继续专注于仅处理身体动作。


    因此，在本章中，我们将涵盖以下主题：


    * 介绍 Mixamo

    * 准备并将 MetaHuman 上传到 Mixamo

    * 在 Mixamo 中定向您的角色

    * 在 Mixamo 中探索动画

    * 下载 Mixamo 动画

    * 将 Mixamo 动画导入 Unreal


    ## 技术要求


    要完成本章，您需要 第 1 章 中详述的技术要求，以及我们在 第 2 章 中导入到 UE5 的 MetaHuman 和 Unreal Engine 模特。这两者都需要保存在
    UE 的同一个项目中，并且您需要为本章运行 UE。


    您还需要稳定的互联网连接，因为我们将上传 MetaHuman 网格体并下载大量动画资产。我们实际上将重复 第 4 章 中的步骤，但这次我们将重定向来自第三方来源的动作捕捉数据。


    ## 介绍 Mixamo


    对于许多计划在 Unreal 中使用 MetaHuman 的艺术家来说，Mixamo 很容易就能满足他们在身体动画方面的所有需求。Mixamo 是一个包含数千个
    **动作捕捉 (mocap)** 文件的在线库，这些文件由动作捕捉演员历经数年创建。除了收容这个庞大的动作捕捉文件库外，Mixamo 还拥有许多预制角色。Mixamo
    允许您上传自己的角色，它将自动运行应用带有蒙皮权重的 Mixamo 骨架的过程。这个自动化过程消除了通常在 Maya 或 3ds Max 等程序中完成的大量繁琐工作，这超出了本书的范围。


    Mixamo 中的许多动画允许您进一步完善动作捕捉动画，并在在线会话期间解决问题，以避免在 Unreal 中进行进一步编辑。由于您已经有使用在线角色创建器（如
    `MHC`）的经验，您会发现 Mixamo 使用起来简单得多，是快速为角色添加动画的一种非常快速高效的方式。


    您需要做的第一件事是访问 [`www.mixamo.com`](https://www.mixamo.com)。您将在那里看到 Mixamo 的登录页面，如图
    5.1 所示：


    ![图 5.1：Mixamo 主页](img/B17878_05_01.jpg)


    图 5.1：Mixamo 主页


    在左上角，您将看到一个 Adobe 徽标。Adobe 是 Photoshop 和 After Effects（仅举几例）的制造商，它收购了 Mixamo 但保持其运行，因为它是角色设计师和动画师的绝佳工具。


    您还会注意到右上角我已经登录。在登录之前，您需要创建一个 Mixamo 账户。如果您有 Adobe 账户，可以直接使用。如果没有，使用电子邮件并创建密码即可。


    登录后，您将进入 Mixamo 主界面：


    ![图 5.2：Mixamo 界面](img/B17878_05_02.jpg)


    图 5.2：Mixamo 界面

    '
