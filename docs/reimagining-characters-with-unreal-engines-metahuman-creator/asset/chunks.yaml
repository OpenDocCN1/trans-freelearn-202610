- raw: "In this section, we have covered all the major factors that need to be considered\
    \ when it comes to recording a video of your performer. Given the nature of video\
    \ and how every scenario will be different, there will be a certain amount of\
    \ trial and error, so don’t be disheartened if you don’t get great results at\
    \ first. You can always refer back to this section to troubleshoot any issues\
    \ you may be having.\n\nAlternatively, if you don’t want to shoot anything yourself,\
    \ you could go to a stock library and download a clip that matches the criteria\
    \ mentioned earlier. For the purpose of this book, I have taken clips from [motionarray.com](https://motionarray.com).\n\
    \nIn the next section, you will upload your clip to DeepMotion, assuming that\
    \ you have shot something.\n\n# Uploading our video to DeepMotion\n\nIn this section,\
    \ we will head over to the DeepMotion site, register, and upload our footage.\n\
    \nThe first thing you need to do is go over to [https://www.deepmotion.com/](https://www.deepmotion.com/).\
    \ From the landing page, click on the **SIGN UP** button and you’ll see the form\
    \ shown in *Figure 6**.1*. Fill this out to create a Freemium account (and note\
    \ the features on the right):\n\n![Figure 6.1: Signing up with DeepMotion ](image/B17878_06.01.jpg)\
    \ \n\nFigure 6.1: Signing up with DeepMotion\n\nNote\n\nDeepMotion’s Freemium\
    \ account will allow you to upload clips no more than 10 seconds long, no bigger\
    \ in resolution than 1,080 pixels, and with a frame rate of no more than 30 fps.\
    \ With the free user price plan, you get a maximum of 30 seconds of animation\
    \ per month. Effectively, this is a trial service and you will have to pay for\
    \ more usage, but there are various paid plans that have more features, such as\
    \ allowing you to upload clips with higher frame rates.\n\nOnce you have filled\
    \ in your details, click the **Get Started** button. This will either send a link\
    \ to your email address or take you directly to the DeepMotion Portal page, as\
    \ shown in *Figure 6**.2*:\n\n![Figure 6.2: The DeepMotion Portal page ](image/B17878_06.02.jpg)\
    \ \n\nFigure 6.2: The DeepMotion Portal page\n\nWith the Freemium account, the\
    \ only feature available to us is the **Animate 3D** feature (the other features\
    \ are locked). When you click on the **Animate 3D** box, you’ll be taken to the\
    \ Animate 3D welcome page, as per *Figure 6**.3*:\n\n![Figure 6.3: The Animate\
    \ 3D welcome page ](image/B17878_06.03.jpg) \n\nFigure 6.3: The Animate 3D welcome\
    \ page\n\nHere, you’ll see how many credits you have: 1 credit is equal to 1 second\
    \ of animation. The next box is titled **Reruns**, and this shows how many attempts\
    \ you have to refine the capture process. Reruns allow you to make changes to\
    \ your settings without using up any of your animation credits.\n\nNow, click\
    \ on the big yellow **Create** button and you’ll be greeted with the dashboard\
    \ where you can place your footage, as shown in *Figure 6**.4*:\n\n![Figure 6.4:\
    \ The Animate 3D dashboard ](image/B17878_06.04.jpg) \n\nFigure 6.4: The Animate\
    \ 3D dashboard\n\nAt the top of *Figure 6**.4*, you can see two thumbnails: **3D\
    \ Animation** and **3D Pose**. Make sure to switch to **3D Animation**.\n\nUnderneath,\
    \ you have the option to either drag and drop your folder into DeepMotion or navigate\
    \ through your folders to upload the file. They also provide a list of accepted\
    \ file types: MP4, MOV, and AVI. If you have any other format, you will need to\
    \ convert your files using an encoder such as Adobe Media Encoder, VLC Player,\
    \ or QuickTime Pro.\n\nNote\n\nUnless there is any notable difference in quality\
    \ from an original MOV file compared to an MP4 conversion, use MP4 as it will\
    \ reduce the uploading and processing time.\n\nFinally, you’ll see a reminder\
    \ of how to get the best results for your videos (which I expanded upon earlier\
    \ in the chapter), and I advise you to take a look at that to make sure you get\
    \ the most out of your limited credit.\n\nOnce you are ready, upload your video\
    \ via whichever method you prefer; now, you will be able to view the video setting.\n\
    \n# Exploring DeepMotion’s animation settings\n\nAs soon as you have uploaded\
    \ your video clip, you will be taken to the **Animate 3D** dashboard, as shown\
    \ in *Figure 6**.5*. If you want to use the same clip as me, I am using the clip\
    \ of a dancing man, found here: [https://motionarray.com/stock-video/happy-man-dancing-vertical-814129/](https://motionarray.com/stock-video/happy-man-dancing-vertical-814129/).\n\
    \n![Figure 6.5: Animate 3D dashboard ](image/B17878_06.05.jpg) \n\nFigure 6.5:\
    \ Animate 3D dashboard\n\nIn *Figure 6**.5 *you can see a thumbnail of the video\
    \ clip, along with the clip’s filename, **Happy-man-dancing-vertical-814129\\\
    _1.mp4**.The attributes of the clip are present on the right-hand side of the\
    \ thumbnail, as follows:\n\n*   **Duration**: This allows you to keep an eye on\
    \ how long the clip is. A clip that is longer than is permitted based on your\
    \ pricing plan will give you an error; in this case, you will need to upload a\
    \ shorter clip.\n\n*   **File Size**: If the file size is too big for your account\
    \ setting, you will get an error. You will need to run the file through a compressor\
    \ (such as Adobe Encoder) to reduce the file size, and then reupload it. If you\
    \ get an error during the upload process, it is likely that you have breached\
    \ the limit of one or more of these attributes based on your account setting.\n\
    \n*   **Resolution**: Each account setting has a maximum resolution. You will\
    \ get an error if the resolution is too big, and you will need to reduce the resolution\
    \ using a converter. For example, a clip that is 4,096 x 3,112 will be too large\
    \ for the Freemium account, so you will need to scale it down to 1,920 x 1,080\
    \ (using Adobe Encoder or similar).\n\n*   **Frame Rate**: If you have a Freemium\
    \ account, using a higher frame rate, such as 200 fps, will produce an error.\
    \ Typically, a webcam will produce a video with a frame rate of around 25 fps,\
    \ so using a webcam can reduce the chance of this error.\n\nIn the bottom half\
    \ of the interface shown in *Figure 6**.5*, you’ll see two options: **Animation\
    \ Output** and **Video Output**. For the purposes of this book, we are ignoring\
    \ **Video Output**, so make sure that **Animation Output** is selected instead.\n\
    \nThere are 10 features to use, but not all of them are either available or relevant\
    \ based on your type of account and the complexity of the motion capture you want\
    \ to achieve. The **Animation Output** parameters are as follows:\n\n*   **FBX\
    \ Output**: This is the file type that you wish to use for your animation. Because\
    \ we only want to use FBX animations in Unreal later, make sure the output is\
    \ set to FBX. (We are only given other options if we want to create static poses,\
    \ which are not relevant to this book.)\n\n*   **Physics Filter**: This enforces\
    \ joint limits and attempts to remove collisions, such as hands drifting through\
    \ the torso. If there are not any notable issues with the footage, I recommend\
    \ you first attempt to process the animation with **Physics Filter** disabled,\
    \ as it may produce a somewhat artificial result. Also, remember to take advantage\
    \ of the **Rerun** option to experiment with **Physics Filter** if you don’t get\
    \ a good result the first time.\n\n*   **Foot Locking**: This addresses a common\
    \ problem in motion capture, which is to do with when a foot leaves the ground\
    \ and then is returned. For motion capture with suits, this is less of an issue,\
    \ but with video motion capture, it can be difficult to ascertain when a foot\
    \ is in contact with the ground or not. **Foot Locking** comes with four options:\
    \ \n\n    *   **Auto**: This is the most common mode to use as it will automatically\
    \ switch between locking the foot position to the ground or letting it move. For\
    \ a character that is walking or dancing, this is the most likely mode to use\
    \ because the character will inevitably be lifting and resting their feet on the\
    \ ground intermittently.\n\nNote\n\nOnly the **Auto** setting is available in\
    \ the Freemium account."
  fmt: "\n在本节中，我们介绍了录制演员视频时需要考虑的所有主要因素。鉴于视频的性质以及每个场景都会有所不同，这其中必然包含一定的试错过程，所以如果一开始没有获得理想的结果，请不要灰心。您随时可以回顾本节，以排查可能遇到的任何问题。\n\
    \n或者，如果您不想自己拍摄，可以去素材库下载一个符合前面提到的标准的片段。为了本书的目的，我从 [motionarray.com](https://motionarray.com)\
    \ 获取了片段。\n\n在下一节中，假设您已经拍摄了一些素材，您将把片段上传到 DeepMotion。\n\n# 上传视频到 DeepMotion\n\n\
    在本节中，我们将访问 DeepMotion 网站，注册并上传我们的素材。\n\n首先，您需要访问 [https://www.deepmotion.com/](https://www.deepmotion.com/)。从登录页面点击\
    \ `SIGN UP` 按钮，您将看到如 *Figure 6.1* 所示的表单。填写此表单以创建一个 `Freemium` 账户（并注意右侧的功能）：\n\n\
    ![Figure 6.1: Signing up with DeepMotion](image/B17878_06.01.jpg)\n\nFigure 6.1:\
    \ Signing up with DeepMotion\n\n> **Note**\n>\n> DeepMotion 的 `Freemium` 账户允许您上传时长不超过\
    \ 10 秒、分辨率不超过 1,080 像素、帧率不超过 30 fps 的片段。使用免费用户价格方案，您每月最多可获得 30 秒的动画时长。实际上这是一个试用服务，您需要付费才能获得更多使用量，但有各种付费计划提供更多功能，例如允许您上传帧率更高的片段。\n\
    \n填写完详细信息后，点击 `Get Started` 按钮。这将向您的电子邮件地址发送一个链接，或直接带您进入 DeepMotion Portal 页面，如\
    \ *Figure 6.2* 所示：\n\n![Figure 6.2: The DeepMotion Portal page](image/B17878_06.02.jpg)\n\
    \nFigure 6.2: The DeepMotion Portal page\n\n使用 `Freemium` 账户，我们唯一可用的功能是 `Animate\
    \ 3D` 功能（其他功能被锁定）。点击 `Animate 3D` 框，您将进入 Animate 3D 欢迎页面，如 *Figure 6.3* 所示：\n\n\
    ![Figure 6.3: The Animate 3D welcome page](image/B17878_06.03.jpg)\n\nFigure 6.3:\
    \ The Animate 3D welcome page\n\n在这里，您将看到拥有多少积分：1 积分等于 1 秒动画。下一个框标题为 `Reruns`，显示您优化捕捉过程的尝试次数。`Reruns`\
    \ 允许您更改设置而不消耗任何动画积分。\n\n现在，点击大大的黄色 `Create` 按钮，您将看到可以放置素材的仪表板，如 *Figure 6.4* 所示：\n\
    \n![Figure 6.4: The Animate 3D dashboard](image/B17878_06.04.jpg)\n\nFigure 6.4:\
    \ The Animate 3D dashboard\n\n在 *Figure 6.4* 顶部，您可以看到两个缩略图：`3D Animation` 和 `3D\
    \ Pose`。请务必切换到 `3D Animation`。\n\n在下方，您可以选择将文件夹拖放到 DeepMotion 中，或浏览文件夹上传文件。它们还提供了接受的文件类型列表：`MP4`、`MOV`\
    \ 和 `AVI`。如果您有其他格式，则需要使用编码器（如 `Adobe Media Encoder`、`VLC Player` 或 `QuickTime\
    \ Pro`）转换文件。\n\n> **Note**\n>\n> 除非原始 `MOV` 文件与 `MP4` 转换后的文件在质量上有显著差异，否则请使用 `MP4`，因为它可以减少上传和处理时间。\n\
    \n最后，您将看到一个关于如何获得最佳视频效果的提醒（我在本章前面对此进行了扩展），我建议您查看一下，以确保充分利用您有限的积分。\n\n准备好后，通过您喜欢的任何方式上传视频；现在，您将能够查看视频设置。\n\
    \n# 探索 DeepMotion 的动画设置\n\n上传视频片段后，您将进入 `Animate 3D` 仪表板，如 *Figure 6.5* 所示。如果您想使用与我相同的片段，我使用的是一个跳舞男人的片段，地址如下：[https://motionarray.com/stock-video/happy-man-dancing-vertical-814129/](https://motionarray.com/stock-video/happy-man-dancing-vertical-814129/)。\n\
    \n![Figure 6.5: Animate 3D dashboard](image/B17878_06.05.jpg)\n\nFigure 6.5: Animate\
    \ 3D dashboard\n\n在 *Figure 6.5* 中，您可以看到视频片段的缩略图，以及片段的文件名 `Happy-man-dancing-vertical-814129_1.mp4`。片段的属性显示在缩略图的右侧，如下所示：\n\
    \n*   **Duration**：用于监控片段的时长。如果片段长度超出您定价计划允许的范围，将报错；在这种情况下，您需要上传更短的片段。\n*   **File\
    \ Size**：如果文件大小超出您的账户设置，将报错。您需要通过压缩器（如 `Adobe Encoder`）减小文件大小，然后重新上传。如果在上传过程中报错，很可能是因为您基于账户设置超过了这些属性中的一个或多个限制。\n\
    *   **Resolution**：每个账户设置都有最大分辨率。如果分辨率过大将报错，您需要使用转换器降低分辨率。例如，对于 `Freemium` 账户，4,096\
    \ x 3,112 的片段太大，您需要将其缩小到 1,920 x 1,080（使用 `Adobe Encoder` 或类似工具）。\n*   **Frame\
    \ Rate**：如果您有 `Freemium` 账户，使用较高的帧率（如 200 fps）将报错。通常，网络摄像头生成的视频帧率约为 25 fps，因此使用网络摄像头可以降低此错误的发生几率。\n\
    \n在 *Figure 6.5* 所示界面的下半部分，您将看到两个选项：`Animation Output` 和 `Video Output`。为了本书的目的，我们忽略\
    \ `Video Output`，因此请确保选择了 `Animation Output`。\n\n有 10 个功能可用，但并非所有功能都可用或与您的账户类型和您想要实现的动作捕捉复杂度相关。`Animation\
    \ Output` 参数如下：\n\n*   **FBX Output**：您希望用于动画的文件类型。因为我们稍后只想在 Unreal 中使用 FBX 动画，所以请确保输出设置为\
    \ `FBX`。（只有当我们想创建静态姿势时才会提供其他选项，这与本书无关。）\n*   **Physics Filter**：这会强制执行关节限制并尝试消除碰撞，例如手穿过躯干。如果素材没有明显问题，我建议您首先尝试在禁用\
    \ `Physics Filter` 的情况下处理动画，因为启用它可能会产生某种人为的结果。此外，请记住利用 `Rerun` 选项来尝试 `Physics\
    \ Filter`，如果第一次没有获得好结果的话。\n*   **Foot Locking**：这解决了动作捕捉中常见的一个问题，即脚离开地面然后又落回地面时的处理。对于穿着动捕服的捕捉，这不太成问题，但对于视频动作捕捉，很难确定脚何时接触地面。`Foot\
    \ Locking` 提供四个选项：\n    *   **Auto**：这是最常用的模式，因为它会自动在将脚位置锁定到地面和让其移动之间切换。对于行走或跳舞的角色，这是最可能使用的模式，因为角色不可避免地会间歇性地抬起和放下脚。\n\
    \n> **Note**\n>\n> `Freemium` 账户中仅提供 `Auto` 设置。\n"
