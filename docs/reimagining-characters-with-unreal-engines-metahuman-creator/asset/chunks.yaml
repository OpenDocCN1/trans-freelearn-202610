  trans: '


    尽管 Mixamo 等素材动作库非常出色，但你仍需要拥有自己的定制动画，以获得创作自由。即使像 DeepMotion 的 Animate 3D 这样的解决方案效果可能不如昂贵的动作捕捉服所能获得的结果，但它也将远好于使用素材库现成动作时所做的妥协。


    因此，在本章中，我们将涵盖以下主题：


    *   认识 DeepMotion

    *   准备视频素材

    *   将视频片段上传至 DeepMotion

    *   探索 DeepMotion 的动画设置

    *   下载 DeepMotion 动作捕捉文件

    *   将 DeepMotion 动作动画导入 Unreal

    *   重定向 DeepMotion 动作捕捉

    *   修复位置错位问题


    ## 技术要求


    就计算机性能而言，你需要 *Chapter 1* 中详述的技术要求，以及我们在 *Chapter 2* 中导入 UE5 的 MetaHuman 角色和 Unreal
    Engine 模型。这两者都需要保存在 UE 的同一个项目中，并且本章需要运行 UE。


    你还需要稳定的网络连接，因为我们将上传 MetaHuman 预览网格体和视频文件，并下载大量动画资产。你需要一台摄像机——网络摄像头、智能手机或专业摄像机/数字电影摄像机均可，但请注意，分辨率高于
    HD 的视频并无额外优势。


    ## 认识 DeepMotion


    直到最近，定制动作捕捉解决方案仍需要昂贵的设备和昂贵的软件；想想《阿凡达》、《指环王》或《加勒比海盗》等电影，演员必须穿着带有反光球或红外传感器棋盘标记的动作捕捉服。这项技术仅适用于能够承担此类投资的大型工作室，因此，独立工作室和自由艺术家只能将就使用动作捕捉库，如前所述的
    Mixamo。


    最近，随着越来越多价格亲民的解决方案可供艺术家使用，这一现状已有所改变。在为本书进行调研时，我特别关注成本因素，测试了多款动作捕捉工具。因为 **动作捕捉**
    (**mocap**) 服、红外传感器以及所有那些花哨的装备对我们大多数人来说实在太贵了，所以我考察了 DeepMotion 的 Animate 3D。


    DeepMotion 的 Animate 3D 是 **无标记动捕解决方案** 的一个典型例子。该流程仅需用摄像机拍摄人体表演视频，无需特殊服装或标记。软件通过分析视频文件来识别和追踪每个身体部位。在机器学习的辅助下，该方案能够利用动作数据库或动作数据来规避错误。此外，还利用了
    **反向运动学** 来进一步优化流程。这项技术在不断进步，且机器学习是其关键特性，进步速度确实非常快。


    就 DeepMotion 而言，该在线工具允许我们上传表演视频，并为我们处理动作捕捉，以便在 Unreal（或任何其他兼容平台）中使用。虽然该过程包含机器学习，但幸运的是，DeepMotion
    为我们处理了所有这些复杂工作。


    在下一节中，我们将深入探讨如何有效录制视频的细节。


    ## 准备视频素材


    在转向 DeepMotion 之前，关于录制表演视频，有一些关键因素我们需要了解。让我们现在来看看它们：


    ### 摄像机质量与位置


    DeepMotion 能够处理从网络摄像头、旧智能手机等低端摄像机，一直到高端电影摄像机拍摄的素材，只要画面清晰、稳定，且具有合理的高帧率即可。许多低端摄像机的最低帧率为
    30 fps，但如果你使用更高的帧率，对于快速移动的演员会获得更好的效果。


    此外，摄像机最好保持静止，因为软件是基于固定的地面位置来计算演员的运动。摄像机的理想位置距离演员约 2 米。


    ### 高对比度拍摄


    由于这种无标记动捕方案是追踪像素而非传感器，我们需要尽可能方便软件区分背景与演员。这就是为什么我们需要两者之间具有高对比度。如果你打算在深色背景（如窗帘）前拍摄，请确保演员穿着亮色衣服，反之亦然。此外，宽松的衣物可能会导致问题，因为衣物往往会被追踪；例如，如果演员穿着非常宽大的袖子，追踪器就很难分辨手臂和袖子的区别。


    ### 始终保持全身入镜


    虽然 DeepMotion 仅凭上半身视频就能很好地推算角色动作，但根据经验法则，获取比所需更多的数据更好，因此请尽可能拍摄演员的全身镜头。捕捉演员的全身也很重要，因为即使演员的脚或头仅离开画面一秒，也可能导致整个动作捕捉过程的其余部分出现不良结果。


    话虽如此，如果你的目的是捕捉全身表演，那么全身视频捕捉就是必须的。


    ### 校准时间


    确保在表演前后让演员在镜头前停留几秒钟，最好摆 T 字姿势并面对摄像机。这给 DeepMotion 时间在表演*前*而非表演*中*将其骨架与演员身体对齐。


    ### 遮挡


    在视频素材中，演员身体的某一部分遮挡另一部分的情况很少见。通常他们的手臂在身体前方，但因为 DeepMotion 能确定骨架脊柱的位置，所以这种遮挡不是问题。


    然而，当身体遮挡肢体时，可能会出现问题。以手为例，当手移至身体后方或头部后方时，DeepMotion 因没有像素指示手的位置，只能猜测手应在何处。它要么尝试猜测，要么根本不给那些问题区域应用任何动画。


    此外，演员与摄像机之间的物体也可能造成遮挡，从而引发问题。例如，树枝或路灯柱可能瞬间挡住视线，但可能会无意中导致比预期多得多的错误。


    因此，不建议在前景有遮挡演员的物体的情况下拍摄。


    ### 表演速度


    DeepMotion 不擅长检测片段中的极快动作。例如，对于踢踏舞或拳击，软件很难跟上快速的脚部动作，反而会给出非常差的结果。一个好的经验法则是：如果你在视频片段中看到任何动态模糊，则不太可能获得好结果。请务必以慢动作播放片段以进行妥善分析。


    ### 文件大小


    如果你使用专业视频文件格式，除了能以更高帧率拍摄外别无裨益。MP4 等压缩或有损视频文件格式足以胜任，最好将文件大小控制在 200 MB 左右。文件过大上传和分析所需时间更长。虽然接受
    MOV 文件，但我建议你改用 MP4 文件。


    '
