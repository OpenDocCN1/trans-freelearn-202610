- raw: "Within the **BODY** section of the interface, you’ll see from *Figure 2**.41*\
    \ that we also have the option (albeit a limited one) to change the character’s\
    \ clothing:\n\n![Figure 2.41: Tops ](image/B17878_02_41.jpg) \n\nFigure 2.41:\
    \ Tops\n\nHowever, a little goes a long way and you can change the color of the\
    \ various elements of each of the tops here. For example, I’ve given Glenda a\
    \ two-toned hoodie.\n\nNote\n\nI can only speculate at this point that Epic and\
    \ Quixel plan to add more features, but you can imagine how many dials and buttons\
    \ are required to accommodate the variation of any one person’s wardrobe. For\
    \ now, you can customize your character’s clothing, even with accurate cloth dynamics,\
    \ but it requires the use of third-party software such as Marvelous Designer,\
    \ Maya, or Blender.\n\n### Bottoms\n\nSimilar to **Tops**, as you can see in *Figure\
    \ 2**.42*, there are major limitations regarding the **Bottoms** features. As\
    \ you can see when we compared the two, we only get two extra presets for **Bottoms**,\
    \ but also like the **Tops** presets, a little goes a long way:\n\n![Figure 2.42:\
    \ Bottoms ](image/B17878_02_42.jpg) \n\nFigure 2.42: Bottoms\n\n### Shoes\n\n\
    Similar to **Tops** and **Bottoms**, there are some major limitations when it\
    \ comes to **Shoes** in MHC; however, the customization in terms of mesh/geometry\
    \ is much more fluid as it doesn’t involve redistributing weight painting concerning\
    \ cloth simulations. While that sounds complicated, it just means that shoes aren’t\
    \ as complex as a shirt in terms of how the body influences the movement of the\
    \ clothing. A shoe doesn’t change its shape, even when it’s not being worn; it\
    \ is still in the shape of a foot. However, a shirt can be rolled into a ball\
    \ when not worn.\n\nAs a result of this lower level of complexity, it is much\
    \ more straightforward to model or buy a 3D model of a shoe of your choice and\
    \ replace it in Unreal. For the time being, we are limited to a small number of\
    \ shoes where we can edit the primary and secondary colors.\n\nOther than editing\
    \ the primary and secondary colors, currently, there are no other editing options\
    \ for shoes in the MHC, as shown in *Figure 2**.43*:\n\n![Figure 2.43: Shoes ](image/B17878_02_43.jpg)\
    \ \n\nFigure 2.43: Shoes\n\nI’m sure you will agree that the body and clothing\
    \ editors aren’t as detailed as that of the face and skin and other areas covered\
    \ in this chapter, but you may be surprised to learn that, in this next section,\
    \ we’re going to jump right back into some of the face editors for additional\
    \ refining.\n\n# Using the Move and Sculpt tools\n\nWhile I could have introduced\
    \ **Sculpt** and **Move** at the beginning of this chapter, as they relate to\
    \ the head only, I left them for last for a good reason. Up until now, you have\
    \ seen that the MHC provides a wealth of options that give very real-world and\
    \ realistic results. There are also ample opportunities to customize the face\
    \ using the **Blend** tool. But sometimes, there are occasions when we want to\
    \ push things a little further and exaggerate certain characteristics. There are\
    \ also times when we are looking for something less symmetrical that is closer\
    \ to reality, or when we simply want to hone in on a specific detail.\n\nWith\
    \ the **Sculpt** and **Move** tools, you can add a little more than the preset\
    \ blending has to offer, but it’s harder to get back to where you were should\
    \ you not get it right. So, **Sculpt** and **Move** should be left until you’ve\
    \ exhausted the other areas.\n\nWithin the interface, the main visible difference\
    \ between **Move** and **Sculpt** is the controllers:\n\n*   In **Move**, you\
    \ work with guidelines that indicate the area of the face that you are editing.\
    \ When moving guidelines, you move clusters of points that influence their surrounding\
    \ area.\n\n*   In **Sculpt**, you work with points on the face and can only sculpt\
    \ one point at a time.\n\nBoth functions work similarly and, to a very large extent,\
    \ give similar results, so much so that I would say that choosing between the\
    \ two is a matter of personal preference. In *Figure 2**.44*, you can just about\
    \ make out the points on the left-hand side, whereas the guidelines in the image\
    \ on the right are much clearer:\n\n![Figure 2.44: Sculpt points and Move guidelines\
    \ ](image/B17878_02_44.jpg) \n\nFigure 2.44: Sculpt points and Move guidelines\n\
    \nTo see just how **Move** behaves differently to **Sculpt**, look at the front\
    \ of the face and edit one of the eyebrows. In **Move** mode, when you edit an\
    \ eyebrow, you will see three points appear as you move the eyebrow, thus indicating\
    \ that you are moving three points simultaneously in **Move** mode. In **Sculpt**\
    \ mode, you are just moving one point, with the greatest influence of change occurring\
    \ at that one point.\n\nSomething else to consider is asymmetry. The **Move**\
    \ guidelines are very helpful indicators to show you just what you can do to create\
    \ asymmetry in your character. For example, the nose and lips are manipulated\
    \ by the same guidelines, so it’s very difficult to create asymmetry in those\
    \ areas. On the other hand, the left ear and right ear have their own set of guidelines\
    \ that you can manipulate.\n\nTo disable symmetry, toggle the symmetry buttons,\
    \ as shown in *Figure 2**.45*, to the right of the **PREVIEW** option:\n\n![Figure\
    \ 2.45: Disabling symmetry ](image/B17878_02_45.jpg) \n\nFigure 2.45: Disabling\
    \ symmetry\n\nI may have gone too far in *Figure 2**.46* and poor Glenda has seen\
    \ better days. However, this is a good example of pushing the asymmetry to the\
    \ maximum using both the **Sculpt** and **Move** tools with the symmetry option\
    \ turned off:\n\n![Figure 2.46: Editing beyond realism ](image/B17878_02_46.jpg)\
    \ \n\nFigure 2.46: Editing beyond realism\n\nNote\n\nAsymmetry is heavily overlooked\
    \ in the creation of realism when it comes to digital character design. Because\
    \ humans don’t have identical sides of the face, it is very important to introduce\
    \ some level of asymmetry, no matter how subtle. Historically, CGI characters\
    \ have suffered from what is known as the **uncanny valley**, and much of this\
    \ uncanniness is due to the presence of perfect symmetry, which doesn’t exist\
    \ in nature.\n\nWe have covered quite a lot of detail in this chapter regarding\
    \ how we can use the MHC to create a unique character; I urge you to play around\
    \ with multiple characters before you move on to the next section. In the next\
    \ section, if you’re happy with your character design, you will download and export\
    \ your character.\n\n# Downloading and exporting your character\n\nIt’s time to\
    \ download your character and export it from MHC and into Unreal Engine. To do\
    \ this, you need to open up Bridge and navigate to your character. You may remember\
    \ this from the moment before you first launched the MHC. However, if you have\
    \ done some editing, you will notice that the picture of your character in Bridge\
    \ has also been updated since the last autosave. If you look at *Figure 2**.47*,\
    \ you’ll notice that my Glenda character has been updated in Bridge:\n\n![Figure\
    \ 2.47: Download and Export settings ](image/B17878_02_47.jpg) \n\nFigure 2.47:\
    \ Download and Export settings\n\nThis is where you can change the **Resolution**,\
    \ **Download Settings**, and **Export Settings** options, which we will take a\
    \ look at here.\n\n## Resolution\n\nAt the bottom left of *Figure 2**.47*, you\
    \ will see a dropdown menu that relates to the resolution of the texture maps\
    \ for our characters.\n\nThe highest available is 8K resolution. This means that\
    \ the highest texture map is over 8,000 pixels wide. That’s a lot of pixels; I\
    \ strongly recommend starting with 2K or even 1K since characters with 8K texture\
    \ maps take a long time to generate and download and take a long time to compile\
    \ when first introduced to the engine."
