- raw: "Figure 10.22: Default settings in Movie Render Queue\n\nThere are three types\
    \ of default settings:\n\n*   **Exports (jpg Sequence 8bit)**: Exports allows\
    \ us to choose what file format options we want, from low-fidelity and compressed\
    \ formats (such as JPGs, which are only 8-bit) to high-fidelity Open EXR, which\
    \ are floating-point 16-bit.\n\n*   **Rendering (Deferred Rendering)**: Deferred\
    \ rendering is an optimized and default way of rendering a scene in Unreal. It\
    \ renders in two passes. The primary pass includes calculations such as z depth\
    \ and ambient occlusion. From the primary (base) pass, deductions can be made\
    \ from the second pass regarding what needs to be calculated on a per-object basis\
    \ in terms of shaders. This is to reduce processing time.\n\n*   **Settings (Output)**:\
    \ When you click on **\\+ Setting**, you will see that there are more settings\
    \ to choose from:\n\n![Figure 10.23: Available settings in Movie Render Queue\
    \ ](image/B17878_10_23.jpg) \n\nFigure 10.23: Available settings in Movie Render\
    \ Queue\n\nWhen rendering the Level Sequencer to a hard drive, we have various\
    \ options to choose from to improve its quality:\n\n*   **Settings**: From this\
    \ list, you can pick multiple options at once. For this book, I’m going to add\
    \ **Anti-Aliasing** so that I can improve the quality of the motion blur.\n\n\
    *   **Exports**: I’m going to replace **.jpg sequence \\[8bit\\]** with **.exr\
    \ Sequence \\[16bit\\]**; this will significantly improve the quality of the render,\
    \ particularly to refine the picture later in a video editing package. **.exr\
    \ Sequence \\[16bit\\]** is exported in an **Open EXR** format – it gives us far\
    \ greater ability to control what is over and under-exposed in the application,\
    \ such as After Effects, Nuke, or DaVinci Resolve. Open EXR is the global visual\
    \ effects standard for movies and television because it stores much more color\
    \ information than other formats and also stores metadata.\n\n*   **Rendering**:\
    \ Let’s look at some of the rendering options available: \n\n    *   **Deferred\
    \ Rendering**: The default rendering option, which uses multiple passes.\n\n \
    \   *   **Deferred Rendering (Reflections Only)**: This rendering option only\
    \ renders out the reflections. This is handy if we want to control the intensity\
    \ of reflections in a compositing application such as Nuke. Typically, you would\
    \ choose this option as an addition to **Deferred Rendering**.\n\n    *   **Object\
    \ IDs (Limited)**: Each object is given an object ID, which is represented by\
    \ a unique color. When we have this option enabled, we will get an object ID video\
    \ channel as part of the EXR file. When compositing in an application such as\
    \ Nuke, we can then manipulate objects separately using the object ID by selecting\
    \ the color associated with it. This is convenient if we want to change an object’s\
    \ color in Nuke without having to make changes in Unreal.\n\nYou can see the settings\
    \ I have selected in *Figure 10**.24*:\n\n![Figure 10.24: Settings selection ](image/B17878_10_24.jpg)\
    \ \n\nFigure 10.24: Settings selection\n\nNote\n\nThe EXR file format is capable\
    \ of storing multiple channels. Most image files store just three channels: Red,\
    \ Green, and Blue, such as JPEG files. PNG files can store four channels: Red,\
    \ Green, Blue, and an Alpha channel for transparency.\n\n### Output\n\nYour default\
    \ **Output** settings will match your Level Sequencer's default settings. However,\
    \ the **Output** column is a means to override them, allowing you to control the\
    \ final resolution and frame rate.\n\nIn *Figure 10**.24*, I have used three render\
    \ settings that will render out into one single EXR image sequence as separate\
    \ channels, one channel for each of the following:\n\n*   **Deferred Rendering**\n\
    \n*   **Deferred Rendering (****Reflections Only)**\n\n*   **Object ****ID (Limited)**\n\
    \nYou can see the result of that render in *Figure 10**.25*. This figure represents\
    \ the three extra channels that have been rendered and stored in the EXR file\
    \ – the top left is **Deferred Rendering**, which appears normal, the top right\
    \ is **Reflections Only**, and the bottom left is **Object ID** (in a compositing\
    \ program, I can make further adjustments by manipulating these extra channels):\n\
    \n![Figure 10.25: Example of rendering ](image/B17878_10_25.jpg) \n\nFigure 10.25:\
    \ Example of rendering\n\nThe render settings in the new Movie Render Queue are\
    \ very powerful and give the artist a little more control over the final images\
    \ than that of a real-time render. This aligns with the results expected from\
    \ traditional 3D animation productions, where compositors are given the same or\
    \ more control over the 3D renders. As developments progress in Unreal, we expect\
    \ that more and more 3D animation studios will adapt Unreal into their pipelines.\n\
    \nIn the next section, we will look at some of the professional color standards\
    \ that now ship with Unreal that allow MetaHumans to work within a professional\
    \ studio environment.\n\n## ACES and color grading\n\nAs mentioned in the previous\
    \ section, Open EXR is the professional industry standard file format used by\
    \ visual effects and 3D animation studios for 3D rendering and compositing. One\
    \ reason for this is that it can store a huge amount of pixel data, particularly\
    \ color.\n\nYou might remember seeing **.jpeg sequence \\[8 bit\\]** as an option\
    \ to render in. Well, that just doesn’t cut it in the professional world simply\
    \ because it doesn’t represent even half of what the human eyes can see. An 8-bit\
    \ image can only store 256 shades of red, green, and blue, respectively. In total,\
    \ that amounts to just over 16 million colors versus the 280 trillion-plus colors\
    \ in a 16-bit image.\n\nIf you take a look at *Figure 10**.26*, where the widest\
    \ area of color is represented by the ACES colorspace, you’ll see the significant\
    \ difference when compared to sRGB. The JPEG format of 8-bit is only capable of\
    \ working within a small colorspace such as sRGB. Therefore, utilizing the enormous\
    \ data space of the EXR file format and the enormous colorspace of ACES, Unreal\
    \ Engine is capable of incredibly photorealistic renders, which is why choosing\
    \ **Exr Sequence \\[16bit\\]** is preferable:\n\n![Figure 10.26: ACES colorspace\
    \ versus sRGB ](image/B17878_10_26.jpg) \n\nFigure 10.26: ACES colorspace versus\
    \ sRGB\n\nNote\n\nFor further reading on the ACES colorspace, go to [https://acescolorspace.com/](https://acescolorspace.com/).\n\
    \nIn this section, we uncovered some pretty advanced color theory relating to\
    \ the ACES colorspace versus sRGB and how this can help you improve your MetaHuman\
    \ renders.\n\n# Summary\n\nIn this chapter, we got the opportunity to revise some\
    \ key elements of bringing a MetaHuman to life by applying both body and face\
    \ motion capture to the Level Sequencer. We looked at alternative ways to edit\
    \ movement and fix common movement issues, such as fixing the position of a character\
    \ when looping an animation. We also learned how to use **Transform**, **Location**,\
    \ and **Show Skeleton** to help with creating longer animations using looped tracks.\n\
    \nAfter that, we covered cameras, lights, and Post-Process Volumes, reviewing\
    \ some of the very powerful and professional rendering capabilities of Unreal\
    \ Engine.\n\nIn the next and final chapter of this book, we will take a look at\
    \ a new feature (at the time of writing) that allows us to use our likeness or\
    \ someone else’s to fashion a MetaHuman around a real human!\n\n# 11\n\n# Using\
    \ the Mesh to MetaHuman Plugin\n\nIn the previous chapter, we reached the end\
    \ of the process of creating a MetaHuman and making a video featuring our MetaHuman.\
    \ While writing this book, Epic Games released version 5 of Unreal Engine – first,\
    \ as an early access version, and later as a fully supported release. In addition,\
    \ Epic Games also released a groundbreaking plugin that allows users to use custom\
    \ meshes of faces to be used as the face of their MetaHuman. The free plugin is\
    \ called Mesh to MetaHuman and at its core is the MetaHuman Identity Asset."
