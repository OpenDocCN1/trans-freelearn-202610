  trans: '


    # 将动作捕捉烘焙到控制绑定


    为了修改动画，我们必须将动作捕捉数据转换为 `Control Rig`（控制绑定）上的关键帧数据。这个过程称为**烘焙**，我们只需右键点击身体轨道，选择**烘焙到控制绑定**，并选择
    `Metahuman_ControlRig` 即可完成，如*图 7.8*所示：


    ![Figure 7.8: Baking to the Control Rig](img/B17878_07_08.jpg)


    图 7.8：烘焙到控制绑定


    开始烘焙过程后，你将看到**烘焙选项**对话框。因为我们不需要减少关键帧，可以保留默认设置，直接点击**创建**。


    ![Figure 7.9: Options for baking](img/B17878_07_09.jpg)


    图 7.9：烘焙选项


    在*图 7.10*中，你可以看到我导入的动捕动画现已烘焙到 MetaHuman 控制绑定中，视口里的角色现在已处于动画状态。


    ![Figure 7.10: Mocap baked into MetaHuman Control Rig](img/B17878_07_10.jpg)


    图 7.10：动捕烘焙进 MetaHuman 控制绑定


    现在，你可以通过按下 `spacebar`（空格键）或使用 `Sequencer`（序列器）选项卡底部的**播放**按钮来激活播放功能。


    随着动捕动画在视口中运行，下一步是设置一种方法来编辑动画。因为现在 MetaHuman 身体的每一根骨骼在每一帧上都有一个关键帧，试图对当前的 MetaHuman
    绑定进行任何更改几乎是不可能的。例如，如果我们选择去到第** 100 **帧并更改该特定帧的姿势，只有第** 100 **帧会受到影响，因为所有其他帧的姿势都基于我们之前转换的动捕数据。让我们看看如何解决这个问题。


    ## 添加和编辑控制绑定


    为了解决关键帧问题，我们需要创建另一个没有关键帧的 MetaHuman 控制绑定，以便我们添加的任何关键帧都能产生**叠加**效果。


    什么是叠加？例如，如果肩关节在 x 轴上的旋转因动作捕捉而为 100 度，那么使用叠加工作流，在 x 轴上再旋转肩关节 20 度，最终旋转将变为 120 度。之所以得到
    120 度，是因为我们只是简单地将 100 + 20 度相加。


    > **注意**

    >

    > 叠加部分的关键帧不会影响烘焙后的控制绑定的原始关键帧。但是，它们会影响最终结果。


    为了获得叠加效果，我们必须在 Sequencer 中创建一个**叠加**片段，如*图 7.11*所示：


    ![Figure 7.11: Adding an Additive section](img/B17878_07_11.jpg)


    图 7.11：添加叠加片段


    根据*图 7.12*，**叠加**轨道已添加，它是我们刚创建的控制绑定的子轨道。在这里我们可以解决动画问题或添加动画更改，而不会影响原始动作捕捉：


    ![Figure 7.12: The Additive section track](img/B17878_07_12.jpg)


    图 7.12：叠加片段轨道


    此时，我们实际上拥有两个绑定，每个都有自己的轨道：一个轨道在每一帧上为每根骨骼都有关键帧，另一个则有零关键帧。在下一节中，我们将仅向叠加片段/轨道添加关键帧。即使我们在视口中对动画外观进行更改，也不会编辑动作捕捉的原始关键帧。从本质上讲，这是一种非破坏性工作流。


    > **注意**

    >

    > 在添加**叠加**或绝对片段/轨道的情况下，"section"（片段）和"track"（轨道）这两个词是同义词。


    要编辑**叠加**片段，请确保在 Sequencer 中选中了**叠加**片段，正如我在*图 7.13*中所做的：


    ![Figure 7.13: Adjusting the Additive control track](img/B17878_07_13.jpg)


    图 7.13：调整叠加控制轨道


    你也可以看到这是一个有问题的片段，因为动捕数据导致 Glenda 的左臂与身体发生碰撞——它穿模进了身体内部，这很可能是因为源角色比目标角色瘦得多。然而，有了叠加工作流，我们只需关注修复出现该问题的时间范围。


    *图 7.13*显示，在第** 0099 **帧，Glenda 的手臂与身体相交，所以我们需要修复该帧。我们可以通过旋转其中一个手臂关节来实现。


    为此，按 `E` 键使用**旋转**功能。然后，点击 Sequencer 中 `Metahuman_Control Rig` 左侧的下拉箭头。在*图 7.14*中，你可以看到下拉列表，它允许我访问所有不同的骨骼。对于这个特定问题，我只想修改左上臂和左下臂。


    ![Figure 7.14: Setting keyframes on the Additive track](img/B17878_07_14.jpg)


    图 7.14：在叠加轨道上设置关键帧


    默认情况下，一旦你做出更改，就会设置一个关键帧。你可以看到*图 7.14*中高亮显示的关键帧，在旁边的视口中，你可以看到该更改在视口中的效果。因为我在叠加轨道上没有设置其他关键帧，所以该更改的效果将在整个片段持续时间内显现。


    如果我只想调整特定时间段（如 2 秒），我需要创建 3 个关键帧。第 1 个和第 3 个关键帧用于保留原始姿势，第 2 个（中间）关键帧则是发生更改的地方。


    请看*图 7.15*，你将看到我是如何添加额外关键帧的：


    ![Figure 7.15: Adding extra keyframes to the Additive track](img/B17878_07_15.jpg)


    图 7.15：向叠加轨道添加额外关键帧


    中间的关键帧是幅度最大的更改处，因为这是问题区域。正如你在*图 7.15*中所见，我对 `Location`（位置）、`Rotation`（旋转）和 `Scale`（缩放）设置拥有数值控制权，我就是用它来旋转肩膀，使手臂不再穿透躯干，从而修复了问题。你可以使用样条曲线进行编辑，如*图
    7.15*右侧图表所示，但我个人觉得这很麻烦，尽管它有利于可视化变化。


    在添加关键帧以修复动画或增加创意层面时，可能性是无穷的。你可能决定添加一个转头、眨眼、挥手，或是在动作捕捉阶段未获得的其他动作。所有这些现在都可以通过 Level
    Sequencer（关卡序列器）中的叠加选择来实现。


    > **注意**

    >

    > 当你想编辑特定关节时，使用搜索选项查找该关节。这将只显示你搜索的关节，如果你觉得关节列表分散注意力，这能让你专注于该关节。


    现在我们已将角色放入 Level Sequencer 并进行了一些调整，接下来需要做的是创建一个摄像机，以便渲染出电影。


    ## 向 Level Sequencer 添加摄像机


    UE5 摄像机是一个强大的工具，因为它的运作方式就像真实的摄像机。我可以单独写一整本书来讲摄像机，但为了完成本章，你只将学习一些与 Level Sequencer
    专门相关的非常基础的摄像机技巧。


    为简单起见，我们将使用 Level Sequencer 创建一个摄像机。我们还需要一个**摄像机剪辑**；这就像一个主轨道，主要设计用于多摄像机的使用，但即使只有一个摄像机我们也需要它。只有当我们在
    Level Sequencer 内部创建摄像机时，**摄像机剪辑**才会自动生成。


    在我们这样做之前，首先需要创建一个播放范围。你可以通过在 Level Sequencer 的时间轴上任意位置右键点击，选择**设置开始时间**，然后点击你想开始动画的位置。接着，对**设置结束时间**做同样的操作。这两个时间之间的差值即为播放范围；然而，稍后渲染时，此范围也用于定义要渲染的帧范围。


    '
