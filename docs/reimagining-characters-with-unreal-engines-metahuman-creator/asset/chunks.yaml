    # 服装


    ## 上装


    在界面的 **BODY** 部分，您将从图 2.41 中看到，我们也有选项（尽管有限）来更改角色的服装：


    ![Figure 2.41: Tops](img/B17878_02_41.jpg)


    图 2.41：上装


    然而，小改动也能产生大效果，您可以在此更改每件上装各个元素的颜色。例如，我给 Glenda 换了一件双色连帽衫。


    > **注意**

    >

    > 我目前只能推测 Epic 和 Quixel 计划添加更多功能，但您可以想象，要适应任何一个人衣橱的变化，需要多少旋钮和按钮。目前，您可以自定义角色的服装，甚至包含精确的布料动力学，但这需要使用
    Marvelous Designer、Maya 或 Blender 等第三方软件。


    ## 下装


    与 **上装** 类似，正如您在图 2.42 中所见，**下装** 功能存在重大限制。正如我们对比两者时所见，我们仅获得两个额外的 **下装** 预设，但就像
    **上装** 预设一样，小改动也能产生大效果：


    ![Figure 2.42: Bottoms](img/B17878_02_42.jpg)


    图 2.42：下装


    ## 鞋子


    与 **上装** 和 **下装** 类似，MHC 中的 **鞋子** 存在一些重大限制；然而，就网格/几何体而言，自定义要流畅得多，因为它不涉及重新分配与布料模拟相关的权重绘制。虽然这听起来很复杂，但它只是意味着，就身体如何影响服装运动而言，鞋子不像衬衫那样复杂。鞋子不会改变形状，即使不穿的时候；它仍然保持脚的形状。然而，衬衫不穿时可以卷成一团。


    由于复杂程度较低，建模或购买您选择的鞋子 3D 模型并在 Unreal 中替换它要简单得多。目前，我们仅限于少量可编辑主色和辅助色的鞋子。


    除了编辑主色和辅助色之外，目前 MHC 中没有其他鞋子编辑选项，如图 2.43 所示：


    ![Figure 2.43: Shoes](img/B17878_02_43.jpg)


    图 2.43：鞋子


    我相信您会同意，身体和服装编辑器不如本章涵盖的面部、皮肤和其他区域的编辑器那样详细，但您可能会惊讶地发现，在下一节中，我们将直接回到一些面部编辑器进行进一步细化。


    # 使用移动和雕刻工具


    虽然我本可以在本章开头介绍 **雕刻** 和 **移动**，因为它们仅与头部相关，但我有充分的理由将它们留到最后。直到现在，您已经看到 MHC 提供了大量选项，能产生非常真实的效果。还有大量机会使用
    **混合** 工具自定义面部。但有时，我们想更进一步，夸大某些特征。有时我们寻找不对称且更接近现实的东西，或者只是想专注于某个特定细节。


    使用 **雕刻** 和 **移动** 工具，您可以获得比预设混合更多的效果，但如果弄错了，要恢复原状会更难。因此，应在用尽其他领域后再使用 **雕刻** 和
    **移动**。


    在界面中，**移动** 和 **雕刻** 之间主要的可见区别在于控制器：


    *   在 **移动** 中，您使用指示线来指示您正在编辑的面部区域。移动指示线时，您会移动影响其周围区域的点簇。

    *   在 **雕刻** 中，您使用面部上的点，且一次只能雕刻一个点。


    这两个功能工作方式相似，且在很大程度上给出相似的结果，以至于我认为两者的选择取决于个人偏好。在图 2.44 中，您勉强能辨认出左侧的点，而右侧图像中的指示线则清晰得多：


    ![Figure 2.44: Sculpt points and Move guidelines](img/B17878_02_44.jpg)


    图 2.44：雕刻点和移动指示线


    要查看 **移动** 与 **雕刻** 的行为有何不同，请看向面部正面并编辑一条眉毛。在 **移动** 模式下，当您编辑眉毛时，移动眉毛时会出现三个点，从而表明您在
    **移动** 模式下同时移动三个点。在 **雕刻** 模式下，您只移动一个点，最大的变化影响发生在该点。


    另一个要考虑的因素是不对称性。**移动** 指示线是非常有用的指示器，能显示您可以做些什么来为角色创建不对称性。例如，鼻子和嘴唇由同一组指示线操控，因此很难在这些区域创建不对称性。另一方面，左耳和右耳有各自的指示线供您操控。


    要禁用对称性，请切换 **预览** 选项右侧的对称按钮，如图 2.45 所示：


    ![Figure 2.45: Disabling symmetry](img/B17878_02_45.jpg)


    图 2.45：禁用对称性


    我在图 2.46 中可能做得太过火了，可怜的 Glenda 看起来惨不忍睹。不过，这是一个在关闭对称选项的情况下，同时使用 **雕刻** 和 **移动**
    工具将不对称性推向极致的好例子：


    ![Figure 2.46: Editing beyond realism](img/B17878_02_46.jpg)


    图 2.46：超越现实主义的编辑


    > **注意**

    >

    > 在数字角色设计中，不对称性在创造真实感方面常被严重忽视。因为人类的面部左右两侧并不完全相同，所以引入一定程度的不对称性非常重要，无论多么细微。历史上，CGI
    角色一直深受所谓 **恐怖谷** 效应之苦，而这种恐怖感很大程度上源于完美对称的存在，而完美对称在自然界中是不存在的。


    本章我们详细介绍了如何使用 MHC 创建独特角色；我敦促您在进入下一节之前先尝试创建多个角色。在下一节中，如果您对角色设计满意，将下载并导出您的角色。


    # 下载并导出您的角色


    是时候下载您的角色并将其从 MHC 导出到 Unreal Engine 了。为此，您需要打开 Bridge 并导航到您的角色。您可能还记得首次启动 MHC
    之前的这一步。但是，如果您进行了一些编辑，您会注意到 Bridge 中角色的图片也已自上次自动保存以来进行了更新。如果您看图 2.47，会注意到我的 Glenda
    角色在 Bridge 中已更新：


    ![Figure 2.47: Download and Export settings](img/B17878_02_47.jpg)


    图 2.47：下载和导出设置


    在这里您可以更改 **分辨率**、**下载设置** 和 **导出设置** 选项，我们将在此查看它们。


    ## 分辨率


    在图 2.47 的左下角，您将看到一个下拉菜单，它与我们角色的纹理贴图分辨率有关。


    最高可用的是 8K 分辨率。这意味着最高纹理贴图宽度超过 8000 像素。那是大量的像素；我强烈建议从 2K 甚至 1K 开始，因为具有 8K 纹理贴图的角色生成和下载需要很长时间，并且在首次导入引擎时编译也需要很长时间。

    '
