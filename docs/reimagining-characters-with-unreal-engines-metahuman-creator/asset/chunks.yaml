    \ click on `+ Setting`, you will see that there are more settings to choose from:\n\
    \n![Figure 10.23: Available settings in Movie Render Queue](image/B17878_10_23.jpg)\n\
    \n**Figure 10.23: Available settings in Movie Render Queue**\n\nWhen rendering\
    \ the Level Sequencer to a hard drive, we have various options to choose from\
    \ to improve its quality:\n\n*   `Settings`: From this list, you can pick multiple\
    \ options at once. For this book, I’m going to add `Anti-Aliasing` so that I can\
    \ improve the quality of the motion blur.\n*   `Exports`: I’m going to replace\
    \ `.jpg sequence [8bit]` with `.exr Sequence [16bit]`; this will significantly\
    \ improve the quality of the render, particularly to refine the picture later\
    \ in a video editing package. `.exr Sequence [16bit]` is exported in an `Open\
    \ EXR` format – it gives us far greater ability to control what is over and under-exposed\
    \ in the application, such as After Effects, Nuke, or DaVinci Resolve. Open EXR\
    \ is the global visual effects standard for movies and television because it stores\
    \ much more color information than other formats and also stores metadata.\n*\
    \   `Rendering`: Let’s look at some of the rendering options available:\n    *\
    \   `Deferred Rendering`: The default rendering option, which uses multiple passes.\n\
    \    *   `Deferred Rendering (Reflections Only)`: This rendering option only renders\
    \ out the reflections. This is handy if we want to control the intensity of reflections\
    \ in a compositing application such as Nuke. Typically, you would choose this\
    \ option as an addition to `Deferred Rendering`.\n    *   `Object IDs (Limited)`:\
    \ Each object is given an object ID, which is represented by a unique color. When\
    \ we have this option enabled, we will get an object ID video channel as part\
    \ of the EXR file. When compositing in an application such as Nuke, we can then\
    \ manipulate objects separately using the object ID by selecting the color associated\
    \ with it. This is convenient if we want to change an object’s color in Nuke without\
    \ having to make changes in Unreal.\n\nYou can see the settings I have selected\
    \ in *Figure 10.24*:\n\n![Figure 10.24: Settings selection](image/B17878_10_24.jpg)\n\
    \n**Figure 10.24: Settings selection**\n\n> **Note**\n>\n> The EXR file format\
    \ is capable of storing multiple channels. Most image files store just three channels:\
    \ Red, Green, and Blue, such as JPEG files. PNG files can store four channels:\
    \ Red, Green, Blue, and an Alpha channel for transparency.\n\n## Output\n\nYour\
    \ default `Output` settings will match your Level Sequencer's default settings.\
    \ However, the `Output` column is a means to override them, allowing you to control\
    \ the final resolution and frame rate.\n\nIn *Figure 10.24*, I have used three\
    \ render settings that will render out into one single EXR image sequence as separate\
    \ channels, one channel for each of the following:\n\n*   `Deferred Rendering`\n\
    *   `Deferred Rendering (Reflections Only)`\n*   `Object ID (Limited)`\n\nYou\
    \ can see the result of that render in *Figure 10.25*. This figure represents\
    \ the three extra channels that have been rendered and stored in the EXR file\
    \ – the top left is `Deferred Rendering`, which appears normal, the top right\
    \ is `Reflections Only`, and the bottom left is `Object ID` (in a compositing\
    \ program, I can make further adjustments by manipulating these extra channels):\n\
    \n![Figure 10.25: Example of rendering](image/B17878_10_25.jpg)\n\n**Figure 10.25:\
    \ Example of rendering**\n\nThe render settings in the new Movie Render Queue\
    \ are very powerful and give the artist a little more control over the final images\
    \ than that of a real-time render. This aligns with the results expected from\
    \ traditional 3D animation productions, where compositors are given the same or\
    \ more control over the 3D renders. As developments progress in Unreal, we expect\
    \ that more and more 3D animation studios will adapt Unreal into their pipelines.\n\
    \nIn the next section, we will look at some of the professional color standards\
    \ that now ship with Unreal that allow MetaHumans to work within a professional\
    \ studio environment.\n\n## ACES and color grading\n\nAs mentioned in the previous\
    \ section, `Open EXR` is the professional industry standard file format used by\
    \ visual effects and 3D animation studios for 3D rendering and compositing. One\
    \ reason for this is that it can store a huge amount of pixel data, particularly\
    \ color.\n\nYou might remember seeing `.jpeg sequence [8 bit]` as an option to\
    \ render in. Well, that just doesn’t cut it in the professional world simply because\
    \ it doesn’t represent even half of what the human eyes can see. An 8-bit image\
    \ can only store 256 shades of red, green, and blue, respectively. In total, that\
    \ amounts to just over 16 million colors versus the 280 trillion-plus colors in\
    \ a 16-bit image.\n\nIf you take a look at *Figure 10.26*, where the widest area\
    \ of color is represented by the `ACES colorspace`, you’ll see the significant\
    \ difference when compared to `sRGB`. The JPEG format of 8-bit is only capable\
    \ of working within a small colorspace such as `sRGB`. Therefore, utilizing the\
    \ enormous data space of the EXR file format and the enormous colorspace of ACES,\
    \ Unreal Engine is capable of incredibly photorealistic renders, which is why\
    \ choosing `Exr Sequence [16bit]` is preferable:\n\n![Figure 10.26: ACES colorspace\
    \ versus sRGB](image/B17878_10_26.jpg)\n\n**Figure 10.26: ACES colorspace versus\
    \ sRGB**\n\n> **Note**\n>\n> For further reading on the ACES colorspace, go to\
    \ [https://acescolorspace.com/](https://acescolorspace.com/).\n\nIn this section,\
    \ we uncovered some pretty advanced color theory relating to the `ACES colorspace`\
    \ versus `sRGB` and how this can help you improve your MetaHuman renders.\n\n\
    # Summary\n\nIn this chapter, we got the opportunity to revise some key elements\
    \ of bringing a MetaHuman to life by applying both body and face motion capture\
    \ to the Level Sequencer. We looked at alternative ways to edit movement and fix\
    \ common movement issues, such as fixing the position of a character when looping\
    \ an animation. We also learned how to use `Transform`, `Location`, and `Show\
    \ Skeleton` to help with creating longer animations using looped tracks.\n\nAfter\
    \ that, we covered cameras, lights, and Post-Process Volumes, reviewing some of\
    \ the very powerful and professional rendering capabilities of Unreal Engine.\n\
    \nIn the next and final chapter of this book, we will take a look at a new feature\
    \ (at the time of writing) that allows us to use our likeness or someone else’s\
    \ to fashion a MetaHuman around a real human!\n\n# 11 Using the Mesh to MetaHuman\
    \ Plugin\n\nIn the previous chapter, we reached the end of the process of creating\
    \ a MetaHuman and making a video featuring our MetaHuman. While writing this book,\
    \ Epic Games released version 5 of Unreal Engine – first, as an early access version,\
    \ and later as a fully supported release. In addition, Epic Games also released\
    \ a groundbreaking plugin that allows users to use custom meshes of faces to be\
    \ used as the face of their MetaHuman. The free plugin is called `Mesh to MetaHuman`\
    \ and at its core is the `MetaHuman Identity Asset`.\n"
  trans: "\n**图 10.22：Movie Render Queue（电影渲染队列）中的默认设置**\n\n共有三种类型的默认设置：\n\n*   `Exports\
    \ (jpg Sequence 8bit)`（导出 [JPG 序列 8 位]）：导出允许我们选择想要的文件格式选项，从低保真和压缩格式（如 JPG，仅为 8\
    \ 位）到高保真 Open EXR（浮点 16 位）。\n*   `Rendering (Deferred Rendering)`（渲染 [延迟渲染]）：延迟渲染是在\
    \ Unreal 中渲染场景的一种优化且默认的方式。它分两遍渲染。主遍包含诸如 Z 深度和环境光遮蔽等计算。从主（基础）遍中，可以在第二遍中推导出在着色器方面需要按对象计算的内容。这是为了减少处理时间。\n\
    *   `Settings (Output)`（设置 [输出]）：当你点击 `+ Setting`（+ 设置）时，你会看到有更多设置可供选择：\n\n![图\
    \ 10.23：Movie Render Queue 中的可用设置](img/B17878_10_23.jpg)\n\n**图 10.23：Movie Render\
    \ Queue 中的可用设置**\n\n在将 Level Sequencer（关卡序列器）渲染到硬盘时，我们有各种选项可供选择以提升其质量：\n\n*  \
    \ `Settings`（设置）：从该列表中，你可以一次性选择多个选项。对于本书，我将添加 `Anti-Aliasing`（抗锯齿），以便提升动态模糊的质量。\n\
    *   `Exports`（导出）：我将把 `.jpg sequence [8bit]` 替换为 `.exr Sequence [16bit]`；这将显著提升渲染质量，特别是在稍后使用视频编辑软件精修画面时。`.exr\
    \ Sequence [16bit]` 以 `Open EXR` 格式导出——它赋予我们在应用程序（如 After Effects、Nuke 或 DaVinci\
    \ Resolve）中控制过曝和欠曝内容的更强能力。Open EXR 是电影和电视领域的全球视觉特效标准，因为它存储的颜色信息比其他格式多得多，且还存储元数据。\n\
    *   `Rendering`（渲染）：让我们看看一些可用的渲染选项：\n    *   `Deferred Rendering`（延迟渲染）：默认渲染选项，使用多遍渲染。\n\
    \    *   `Deferred Rendering (Reflections Only)`（延迟渲染 [仅反射]）：此渲染选项仅渲染反射。如果我们想在合成应用程序（如\
    \ Nuke）中控制反射强度，这非常方便。通常，你会将此选项作为 `Deferred Rendering` 的补充来选择。\n    *   `Object\
    \ IDs (Limited)`（对象 ID [有限]）：每个对象被分配一个对象 ID，由一种独特的颜色表示。启用此选项后，我们将获得一个对象 ID 视频通道作为\
    \ EXR 文件的一部分。在 Nuke 等应用程序中合成时，我们可以通过选择与之关联的颜色，利用对象 ID 单独操控对象。如果我们想在 Nuke 中更改对象颜色而无需在\
    \ Unreal 中修改，这非常方便。\n\n你可以在*图 10.24*中看到我所选择的设置：\n\n![图 10.24：设置选择](img/B17878_10_24.jpg)\n\
    \n**图 10.24：设置选择**\n\n> **注意**\n>\n> EXR 文件格式能够存储多个通道。大多数图像文件仅存储三个通道：红、绿、蓝，例如\
    \ JPEG 文件。PNG 文件可存储四个通道：红、绿、蓝和用于透明度的 Alpha 通道。\n\n## Output（输出）\n\n你的默认 `Output`（输出）设置将与\
    \ Level Sequencer 的默认设置相匹配。然而，`Output` 列是一种覆盖它们的手段，允许你控制最终的分辨率和帧率。\n\n在*图 10.24*中，我使用了三个渲染设置，它们将渲染为单个\
    \ EXR 图像序列，作为独立的通道分别对应以下内容：\n\n*   `Deferred Rendering`（延迟渲染）\n*   `Deferred Rendering\
    \ (Reflections Only)`（延迟渲染 [仅反射]）\n*   `Object ID (Limited)`（对象 ID [有限]）\n\n你可以在*图\
    \ 10.25*中看到该渲染的结果。该图展示了已渲染并存储在 EXR 文件中的三个额外通道——左上角是 `Deferred Rendering`，看起来正常；右上角是\
    \ `Reflections Only`（仅反射）；左下角是 `Object ID`（在合成软件中，我可以通过操控这些额外通道进行进一步调整）：\n\n![图\
    \ 10.25：渲染示例](img/B17878_10_25.jpg)\n\n**图 10.25：渲染示例**\n\n新版 Movie Render Queue\
    \ 中的渲染设置非常强大，赋予艺术家对最终图像的控制力比实时渲染多一些。这符合传统 3D 动画制作的预期结果，即合成师获得对 3D 渲染结果同等或更多的控制权。随着\
    \ Unreal 的发展，我们预计越来越多的 3D 动画工作室将把 Unreal 融入其流水线。\n\n在下一节中，我们将了解一些现在随 Unreal 附带的专业色彩标准，它们允许\
    \ MetaHuman 在专业工作室环境中工作。\n\n## ACES 和色彩分级\n\n正如上一节所述，`Open EXR` 是视觉特效和 3D 动画工作室用于\
    \ 3D 渲染和合成的专业行业标准文件格式。原因之一是它能存储海量的像素数据，特别是颜色数据。\n\n你可能记得看到过 `.jpeg sequence [8\
    \ bit]` 作为渲染选项。好吧，在专业领域这根本不够用，仅仅因为它甚至无法呈现人眼所能看到内容的一半。8 位图像分别只能存储 256 级红、绿、蓝阴影。总共仅约\
    \ 1600 万种颜色，而 16 位图像则拥有 280 万亿种以上的颜色。\n\n如果你看看*图 10.26*，其中最宽的色域区域由 `ACES colorspace`（ACES\
    \ 色彩空间）表示，你会看到与 `sRGB` 相比有显著差异。8 位的 JPEG 格式只能在像 `sRGB` 这样较小的色彩空间内工作。因此，利用 EXR\
    \ 文件格式巨大的数据空间和 ACES 巨大的色彩空间，Unreal Engine 能够实现令人难以置信的照片级真实感渲染，这也是为什么选择 `Exr Sequence\
    \ [16bit]` 更可取的原因：\n\n![图 10.26：ACES 色彩空间对比 sRGB](img/B17878_10_26.jpg)\n\n**图\
    \ 10.26：ACES 色彩空间对比 sRGB**\n\n> **注意**\n>\n> 关于 ACES 色彩空间的进一步阅读，请访问 [`acescolorspace.com/`](https://acescolorspace.com/)。\n\
    \n在本节中，我们揭示了一些与 `ACES colorspace` 与 `sRGB` 相关的高级色彩理论，以及它们如何帮助你改进 MetaHuman 渲染。\n\
    \n# 总结\n\n在本章中，我们有机会复习一些让 MetaHuman “活”起来的关键要素，即将身体和面部动作捕捉应用到 Level Sequencer\
    \ 中。我们探讨了编辑动作和修复常见动作问题的替代方法，例如循环动画时修复角色位置。我们还学习了如何使用 `Transform`（变换）、`Location`（位置）和\
    \ `Show Skeleton`（显示骨架）来帮助使用循环轨道创建更长的动画。\n\n之后，我们介绍了摄像机、灯光和后期处理体积，回顾了 Unreal Engine\
    \ 一些非常强大且专业的渲染能力。\n\n在本书的下一章也是最后一章中，我们将介绍一项新功能（写作时），它允许我们使用自己的肖像或他人的肖像，围绕真实人类打造一个\
    \ MetaHuman！\n\n# 第 11 章 使用 Mesh to MetaHuman 插件\n\n在上一章中，我们完成了创建 MetaHuman 并制作包含\
    \ MetaHuman 视频的流程。在撰写本书期间，Epic Games 发布了 Unreal Engine 5 版本——首先是抢先体验版，随后是完全支持的正式版。此外，Epic\
    \ Games 还发布了一款开创性的插件，允许用户使用自定义面部网格作为其 MetaHuman 的面部。这款免费插件称为 `Mesh to MetaHuman`，其核心是\
    \ `MetaHuman Identity Asset`（MetaHuman 身份资产）。\n\n"
