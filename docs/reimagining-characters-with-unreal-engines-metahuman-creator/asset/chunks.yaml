    \ available under Anim to Play\n\nBecause of the work done in the previous section,\
    \ in this section, you were able to batch-import multiple animations and batch-retarget\
    \ them using the IK Retargeter tool. This is a very efficient approach to creating\
    \ an entire motion library dedicated to your MetaHuman character.\n\n# Summary\n\
    \nIn this chapter, we learned about the fantastic and free resource, Mixamo, to\
    \ bring hundreds of animations into your project. We learned how to best configure\
    \ our character meshes to get the most out of Mixamo and we also got a little\
    \ revision time on IK Rigs and the IK Retargeter.\n\nAs well as that, we learned\
    \ about the importance of character proportions, a little about skin weighting,\
    \ and their connection to character proportions and animation rigs.\n\nMost importantly,\
    \ we learned about the very powerful automation tools that allow us to batch-import\
    \ and batch-retarget animation files acquired from Mixamo.\n\nIn the next chapter,\
    \ we will learn about DeepMotion, another online resource that allows us to create\
    \ our own custom animations using just a video camera.\n\n# 6\n\n# Adding Motion\
    \ Capture with DeepMotion\n\nIn the previous chapter, we were introduced to the\
    \ motion capture library of Mixamo and how to make the Mixamo animations work\
    \ inside Unreal.\n\nIn this chapter, we are going to build on that knowledge and\
    \ create our very own animation using another third-party online tool called **DeepMotion**,\
    \ which includes a tool called **Animate 3D** that analyzes video of human performances\
    \ and, in return, creates a motion capture file. We will learn how to use a video\
