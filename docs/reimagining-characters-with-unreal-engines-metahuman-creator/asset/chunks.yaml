- raw: "Feel free to drag and drop your character Blueprint anywhere in your viewport\
    \ so that you can start inspecting it. Also, note the additional folders that\
    \ are created within your character folder. You should see the following:\n\n\
    *   **Body**\n\n*   **Face**\n\n*   **Female** (if you created a male character,\
    \ it would say **Male**)\n\n*   **FemaleHair** (if you created a male character,\
    \ it would say **MaleHair**)\n\n*   **Materials**\n\n*   **Blueprint**\n\nYou\
    \ can browse through these folders to find the various texture maps.\n\nIn this\
    \ section, we focused on how to get your custom MetaHuman into Unreal Engine.\
    \ This is where you’re likely to notice just how much data is involved in each\
    \ character by the download and export time required. We have just begun to look\
    \ at Unreal Engine and the folder structure behind the characters, but rest assured,\
    \ you will become much more familiar with them by the end of the next chapter.\n\
    \n# Summary\n\nIn this chapter, we learned how to get up and running with the\
    \ MHC, all the various parameters that we can use to customize our characters,\
    \ and some best practices to aid our design process.\n\nWe also learned a little\
    \ about how textures and shaders work and how they are used to provide specific\
    \ results. In addition to learning about all the available design tools, we learned\
    \ a little about optimization with the use of LODs.\n\nWhile we’ve gone through\
    \ many of the editable attributes such as the body, face, eyes, hair, clothing,\
    \ and all of the presets to choose from, we also looked at the **Move** and **Sculpt**\
    \ tools, which we can use to fine-tune our characters and introduce asymmetry.\n\
    \nFinally, we learned about the download and export stage and some workarounds\
    \ to some known problems, such as only the Bridge plugin recognizing the UE5 installation.\n\
    \nWe leave this chapter having brought our custom character into the engine, but\
    \ now, we need to learn how to animate our MetaHuman. To do this, in the next\
    \ chapter, we will explore the concepts of Blueprints, what they are, and what\
    \ we need to do with them to bring our characters to life.\n\n# Part 2: Exploring\
    \ Blueprints, Body Motion Capture, and Retargeting\n\nIn *Part 2* of this book,\
    \ we will first look at what Blueprints are in Unreal Engine and how to use them\
    \ with our MetaHumans. Then, we will look at different methods of body motion\
    \ capturing and how to retarget motion capture data to our character.\n\nThis\
    \ part includes the following chapters:\n\n*   [*Chapter 3*](#B17878_03.xhtml#_idTextAnchor046),\
    \ *Diving into the MetaHuman Blueprint*\n\n*   [*Chapter 4*](#B17878_04.xhtml#_idTextAnchor059),\
    \ *Retargeting Animations*\n\n*   [*Chapter 5*](#B17878_05.xhtml#_idTextAnchor071),\
    \ *Retargeting Animations with Mixamo*\n\n*   [*Chapter 6*](#B17878_06.xhtml#_idTextAnchor084),\
    \ *Adding Motion Capture with DeepMotion*\n\n# 3\n\n# Diving into the MetaHuman\
    \ Blueprint\n\nIn the previous chapter, we exported a MetaHuman character using\
    \ Quixel Bridge and the Quixel Bridge plugin inside UE5. We brought a number of\
    \ assets into the engine – while most of the assets were images and meshes, the\
    \ glue to hold them all together was the Blueprint.\n\nIn this chapter, you will\
    \ be introduced to Blueprints, including what they are and what they are used\
    \ for. Using Blueprints, you will learn the first steps required to prepare your\
    \ MetaHuman for animation, repurposing motion capture data from another character\
    \ that we will import into a project. We will then edit features within the skeletons\
    \ of both our MetaHuman and the Unreal Engine Mannequin.\n\nSo, in this chapter,\
    \ we will cover the following topics:\n\n*   What are Blueprints?\n\n*   Opening\
    \ a Blueprint\n\n*   Importing and editing skeletons\n\n# Technical requirements\n\
    \nTo complete this chapter, you will need the technical requirements detailed\
    \ in [*Chapter 1*](#B17878_01.xhtml#_idTextAnchor015) and the MetaHuman that we\
    \ imported into UE5 in [*Chapter 2*](#B17878_02.xhtml#_idTextAnchor027).\n\n#\
    \ What are Blueprints?\n\nSo, what on earth is a Blueprint? If that’s what you’re\
    \ thinking, I wouldn’t blame you.\n\n**Blueprints** are effectively a visual representation\
    \ of templates written in the C++ programming language. Epic Games could have\
    \ easily just created a console within Unreal to let users write C++ code but\
    \ because not everyone is familiar with the C++ programming language, they created\
    \ an easy way for artists to edit the relevant code. In addition, for those familiar\
    \ with C++, Blueprints are a very handy way of creating tools that are relatively\
    \ easy for artists to use.\n\nThe good news is that you don’t really need to spend\
    \ a huge amount of time using them when working on a MetaHuman character and animating\
    \ it, but they are an integral part of the process and are being used by the engine\
    \ in the background. It would be good practice for artists to get to grips with\
    \ the fundamentals of Blueprints, as they are a fantastic way of reducing repetitive\
    \ work; however, it must also be said that there are tasks that simply can’t be\
    \ carried out without working with Blueprints.\n\nIn terms of functionality with\
    \ the MetaHumans character, Blueprints essentially hold most of the information\
    \ relating to the character in one place and we use the Blueprint to make changes\
    \ to our character. The changes we will make relate to how the character is animated,\
    \ and by the end of this chapter, you will be familiar with what areas of the\
    \ Blueprint you will need to edit to animate your characters correctly.\n\nYou\
    \ can look at a Blueprint as if it were a driver. Its function is to drive the\
    \ mesh of your character using a skeleton. It does this by driving the bones,\
    \ which in turn drive the skin. Because there is a cloth simulation at work, the\
    \ skin drives the cloth. Because there is also a hair simulation at work, the\
    \ skin drives the hair. All of this is driven by the Blueprint.\n\nBut where does\
    \ the Blueprint get the initial instructions? Well, the answer is *you*. You tell\
    \ the Blueprint what kind of instruction it will use to animate the character,\
    \ and then you point to various animation modes for the Blueprint to use. There\
    \ are just a couple of different types of animations that can be applied, listed\
    \ here:\n\n*   **Prerecorded data**: This is simply a file that has motion data,\
    \ usually one file for the face and another file for the body. We can get these\
    \ files from plenty of resources. We can also use animation files that come with\
    \ the third-person game template in UE5 or create our own files by recording our\
    \ own motion capture data (we call these **Takes**).\n\n*   **Live motion capture\
    \ data**: The Blueprint gives us the option of using live data that is coming\
    \ from a piece of hardware, such as the following: \n\n    *    An iPhone for\
    \ facial motion capture.\n\n    *   Software such as Faceware Studio, utilizing\
    \ a video camera.\n\n    *   Motion capture suits also provide us with live data\
    \ via third-party software. Live data is information relating to the transformation\
    \ and/or rotation of bones that is streamed in real-time into the engine.\n\n\
    *   **Animation Blueprints**: These are primarily used for game logic, but they\
    \ can use the same animation file types used in prerecorded data or saved when\
    \ using live motion capture data that we would use in traditional 3D animation\
    \ filmmaking.\n\nBlueprints also allow for new data taken in from the user, such\
    \ as a player in a game, and will engage a relevant animation file depending on\
    \ what the player does. For example, if the player runs, the Blueprint will execute\
    \ the **run** animation file, which drives the character to run. That file would\
    \ usually be in the format of FBX or BVH. The files are referred to as **assets**.\n\
    \nSo, let’s look at the Blueprint inside the engine.\n\n# Opening a Blueprint\n\
    \nOnce you’ve successfully imported a MetaHuman character into UE5, you’ll see\
    \ a few folders and a file starting with the **BP\\_** prefix, as shown in Figure\
    \ 3.1. The folder contains all the assets required to display your character."
  fmt: "\nFeel free to drag and drop your character `Blueprint` anywhere in your viewport\
    \ so that you can start inspecting it. Also, note the additional folders that\
    \ are created within your character folder. You should see the following:\n\n\
    *   Body\n*   Face\n*   Female (if you created a male character, it would say\
    \ Male)\n*   FemaleHair (if you created a male character, it would say MaleHair)\n\
    *   Materials\n*   Blueprint\n\nYou can browse through these folders to find the\
    \ various texture maps.\n\nIn this section, we focused on how to get your custom\
    \ MetaHuman into Unreal Engine. This is where you’re likely to notice just how\
    \ much data is involved in each character by the download and export time required.\
    \ We have just begun to look at Unreal Engine and the folder structure behind\
    \ the characters, but rest assured, you will become much more familiar with them\
    \ by the end of the next chapter.\n\n# Summary\n\nIn this chapter, we learned\
    \ how to get up and running with the MHC, all the various parameters that we can\
    \ use to customize our characters, and some best practices to aid our design process.\n\
    \nWe also learned a little about how textures and shaders work and how they are\
    \ used to provide specific results. In addition to learning about all the available\
    \ design tools, we learned a little about optimization with the use of LODs.\n\
    \nWhile we’ve gone through many of the editable attributes such as the body, face,\
    \ eyes, hair, clothing, and all of the presets to choose from, we also looked\
    \ at the **Move** and **Sculpt** tools, which we can use to fine-tune our characters\
    \ and introduce asymmetry.\n\nFinally, we learned about the download and export\
    \ stage and some workarounds to some known problems, such as only the Bridge plugin\
    \ recognizing the UE5 installation.\n\nWe leave this chapter having brought our\
    \ custom character into the engine, but now, we need to learn how to animate our\
    \ MetaHuman. To do this, in the next chapter, we will explore the concepts of\
    \ `Blueprints`, what they are, and what we need to do with them to bring our characters\
    \ to life.\n\n# Part 2: Exploring Blueprints, Body Motion Capture, and Retargeting\n\
    \nIn *Part 2* of this book, we will first look at what `Blueprints` are in Unreal\
    \ Engine and how to use them with our MetaHumans. Then, we will look at different\
    \ methods of body motion capturing and how to retarget motion capture data to\
    \ our character.\n\nThis part includes the following chapters:\n\n*   [*Chapter\
    \ 3*](#B17878_03.xhtml#_idTextAnchor046), *Diving into the MetaHuman Blueprint*\n\
    *   [*Chapter 4*](#B17878_04.xhtml#_idTextAnchor059), *Retargeting Animations*\n\
    *   [*Chapter 5*](#B17878_05.xhtml#_idTextAnchor071), *Retargeting Animations\
    \ with Mixamo*\n*   [*Chapter 6*](#B17878_06.xhtml#_idTextAnchor084), *Adding\
    \ Motion Capture with DeepMotion*\n\n## Chapter 3: Diving into the MetaHuman Blueprint\n\
    \nIn the previous chapter, we exported a MetaHuman character using Quixel Bridge\
    \ and the Quixel Bridge plugin inside UE5. We brought a number of assets into\
    \ the engine – while most of the assets were images and meshes, the glue to hold\
    \ them all together was the `Blueprint`.\n\nIn this chapter, you will be introduced\
    \ to `Blueprints`, including what they are and what they are used for. Using `Blueprints`,\
    \ you will learn the first steps required to prepare your MetaHuman for animation,\
    \ repurposing motion capture data from another character that we will import into\
    \ a project. We will then edit features within the skeletons of both our MetaHuman\
    \ and the Unreal Engine Mannequin.\n\nSo, in this chapter, we will cover the following\
    \ topics:\n\n*   What are `Blueprints`?\n*   Opening a `Blueprint`\n*   Importing\
    \ and editing skeletons\n\n### Technical requirements\n\nTo complete this chapter,\
    \ you will need the technical requirements detailed in [*Chapter 1*](#B17878_01.xhtml#_idTextAnchor015)\
    \ and the MetaHuman that we imported into UE5 in [*Chapter 2*](#B17878_02.xhtml#_idTextAnchor027).\n\
    \n### What are Blueprints?\n\nSo, what on earth is a `Blueprint`? If that’s what\
    \ you’re thinking, I wouldn’t blame you.\n\n`Blueprints` are effectively a visual\
    \ representation of templates written in the C++ programming language. Epic Games\
    \ could have easily just created a console within Unreal to let users write C++\
    \ code but because not everyone is familiar with the C++ programming language,\
    \ they created an easy way for artists to edit the relevant code. In addition,\
    \ for those familiar with C++, `Blueprints` are a very handy way of creating tools\
    \ that are relatively easy for artists to use.\n\nThe good news is that you don’t\
    \ really need to spend a huge amount of time using them when working on a MetaHuman\
    \ character and animating it, but they are an integral part of the process and\
    \ are being used by the engine in the background. It would be good practice for\
    \ artists to get to grips with the fundamentals of `Blueprints`, as they are a\
    \ fantastic way of reducing repetitive work; however, it must also be said that\
    \ there are tasks that simply can’t be carried out without working with `Blueprints`.\n\
    \nIn terms of functionality with the MetaHumans character, `Blueprints` essentially\
    \ hold most of the information relating to the character in one place and we use\
    \ the `Blueprint` to make changes to our character. The changes we will make relate\
    \ to how the character is animated, and by the end of this chapter, you will be\
    \ familiar with what areas of the `Blueprint` you will need to edit to animate\
    \ your characters correctly.\n\nYou can look at a `Blueprint` as if it were a\
    \ driver. Its function is to drive the mesh of your character using a skeleton.\
    \ It does this by driving the bones, which in turn drive the skin. Because there\
    \ is a cloth simulation at work, the skin drives the cloth. Because there is also\
    \ a hair simulation at work, the skin drives the hair. All of this is driven by\
    \ the `Blueprint`.\n\nBut where does the `Blueprint` get the initial instructions?\
    \ Well, the answer is *you*. You tell the `Blueprint` what kind of instruction\
    \ it will use to animate the character, and then you point to various animation\
    \ modes for the `Blueprint` to use. There are just a couple of different types\
    \ of animations that can be applied, listed here:\n\n*   **Prerecorded data**:\
    \ This is simply a file that has motion data, usually one file for the face and\
    \ another file for the body. We can get these files from plenty of resources.\
    \ We can also use animation files that come with the third-person game template\
    \ in UE5 or create our own files by recording our own motion capture data (we\
    \ call these **Takes**).\n*   **Live motion capture data**: The `Blueprint` gives\
    \ us the option of using live data that is coming from a piece of hardware, such\
    \ as the following:\n    *   An iPhone for facial motion capture.\n    *   Software\
    \ such as Faceware Studio, utilizing a video camera.\n    *   Motion capture suits\
    \ also provide us with live data via third-party software. Live data is information\
    \ relating to the transformation and/or rotation of bones that is streamed in\
    \ real-time into the engine.\n*   **Animation Blueprints**: These are primarily\
    \ used for game logic, but they can use the same animation file types used in\
    \ prerecorded data or saved when using live motion capture data that we would\
    \ use in traditional 3D animation filmmaking.\n\n`Blueprints` also allow for new\
    \ data taken in from the user, such as a player in a game, and will engage a relevant\
    \ animation file depending on what the player does. For example, if the player\
    \ runs, the `Blueprint` will execute the `run` animation file, which drives the\
    \ character to run. That file would usually be in the format of `FBX` or `BVH`.\
    \ The files are referred to as **assets**.\n\nSo, let’s look at the `Blueprint`\
    \ inside the engine.\n\n### Opening a Blueprint\n\nOnce you’ve successfully imported\
    \ a MetaHuman character into UE5, you’ll see a few folders and a file starting\
    \ with the `BP_` prefix, as shown in Figure 3.1. The folder contains all the assets\
    \ required to display your character.\n"
  trans: "\n请随意将角色的 `Blueprint` 拖放到视口中的任意位置，以便开始检查它。此外，请注意角色文件夹内创建的其他文件夹。你应该会看到以下内容：\n\
    \n*   Body（身体）\n*   Face（面部）\n*   Female（女性）（如果你创建的是男性角色，则会显示 Male）\n*   FemaleHair（女性头发）（如果你创建的是男性角色，则会显示\
    \ MaleHair）\n*   Materials（材质）\n*   Blueprint（蓝图）\n\n你可以浏览这些文件夹以查找各种纹理贴图。\n\n\
    在本节中，我们重点介绍了如何将自定义 MetaHuman 导入 Unreal Engine。通过所需的下载和导出时间，你可能会注意到每个角色涉及的数据量有多大。我们刚开始了解\
    \ Unreal Engine 以及角色背后的文件夹结构，但请放心，到下一章结束时，你将对它们更加熟悉。\n\n# 总结\n\n在本章中，我们学习了如何上手使用\
    \ MHC，所有可用于自定义角色的各种参数，以及一些有助于设计流程的最佳实践。\n\n我们还了解了一些关于纹理和着色器如何工作的知识，以及它们如何被用来提供特定的结果。除了了解所有可用的设计工具外，我们还通过使用\
    \ LOD 学习了一些优化知识。\n\n虽然我们已经浏览了许多可编辑属性，如身体、面部、眼睛、头发、服装以及所有可供选择的预设，但我们也了解了 **Move**（移动）和\
    \ **Sculpt**（雕刻）工具，我们可以使用它们来微调角色并引入不对称性。\n\n最后，我们了解了下载和导出阶段，以及一些已知问题的变通方法，例如只有\
    \ Bridge 插件能识别 UE5 安装。\n\n我们在本章结束时已将自定义角色带入引擎，但现在，我们需要学习如何为 MetaHuman 制作动画。为此，在下一章中，我们将探讨\
    \ `Blueprints` 的概念，它们是什么，以及我们需要对它们做什么才能让角色“活”起来。\n\n# 第 2 部分：探索蓝图、身体动作捕捉与重定向\n\
    \n在本书的*第 2 部分*中，我们将首先了解 `Blueprints` 在 Unreal Engine 中是什么以及如何将它们与 MetaHumans 结合使用。然后，我们将了解不同的身体动作捕捉方法，以及如何将动作捕捉数据重定向到我们的角色上。\n\
    \n此部分包含以下章节：\n\n*   *第 3 章*，《深入 MetaHuman 蓝图》\n*   *第 4 章*，《重定向动画》\n*   *第 5 章*，《使用\
    \ Mixamo 重定向动画》\n*   *第 6 章*，《使用 DeepMotion 添加动作捕捉》\n\n## 第 3 章：深入 MetaHuman 蓝图\n\
    \n在上一章中，我们使用 Quixel Bridge 和 UE5 内的 Quixel Bridge 插件导出了一个 MetaHuman 角色。我们将大量资产导入了引擎——虽然大多数资产是图像和网格体，但将它们全部粘合在一起的“胶水”就是\
    \ `Blueprint`。\n\n在本章中，你将接触 `Blueprints`，包括它们是什么以及它们有什么用途。通过使用 `Blueprints`，你将学习准备\
    \ MetaHuman 进行动画制作所需的第一步，即重新利用我们将导入项目的另一个角色的动作捕捉数据。然后，我们将编辑我们的 MetaHuman 和 Unreal\
    \ Engine 模型骨架内的特性。\n\n因此，在本章中，我们将涵盖以下主题：\n\n*   什么是 `Blueprints`？\n*   打开 `Blueprint`\n\
    *   导入和编辑骨架\n\n### 技术要求\n\n要完成本章，你需要 *第 1 章* 中详述的技术要求，以及我们在 *第 2 章* 中导入到 UE5 的\
    \ MetaHuman。\n\n### 什么是蓝图？\n\n那么，`Blueprint` 到底是什么？如果你正在思考这个问题，我不会怪你。\n\n`Blueprints`\
    \ 实际上是用 C++ 编程语言编写的模板的可视化表示。Epic Games 本可以轻松地在 Unreal 中创建一个控制台让用户编写 C++ 代码，但因为并非每个人都熟悉\
    \ C++ 编程语言，所以他们为艺术家创建了一种编辑相关代码的简便方法。此外，对于熟悉 C++ 的人来说，`Blueprints` 是创建相对易于艺术家使用的工具的一种非常方便的方式。\n\
    \n好消息是，在处理 MetaHuman 角色并为其制作动画时，你并不真的需要花费大量时间来使用它们，但它们是该过程不可或缺的一部分，并在后台被引擎使用。对于艺术家来说，掌握\
    \ `Blueprints` 的基础知识是一个很好的实践，因为它们是减少重复工作的绝佳方式；但也必须指出，有些任务如果不使用 `Blueprints` 根本无法完成。\n\
    \n就 MetaHuman 角色的功能而言，`Blueprints` 本质上将与角色相关的大部分信息保存在一个地方，我们使用 `Blueprint` 来更改角色。我们将进行的更改与角色如何制作动画有关，到本章结束时，你将熟悉需要编辑\
    \ `Blueprint` 的哪些区域才能正确地为角色制作动画。\n\n你可以把 `Blueprint` 看作是一个驱动程序。它的功能是使用骨架驱动角色的网格体。它通过驱动骨骼来实现这一点，骨骼反过来驱动皮肤。因为存在布料模拟，皮肤驱动布料。因为也存在头发模拟，皮肤驱动头发。所有这些都是由\
    \ `Blueprint` 驱动的。\n\n但 `Blueprint` 从哪里获得初始指令呢？答案是*你*。你告诉 `Blueprint` 它将使用哪种指令来为角色制作动画，然后指向各种动画模式供\
    \ `Blueprint` 使用。可以应用的动画类型只有几种，如下所示：\n\n*   **预录制数据**：这只是一个包含动作数据的文件，通常面部和身体各有一个文件。我们可以从大量资源获取这些文件。我们也可以使用\
    \ UE5 第三人称游戏模板附带的动画文件，或者通过录制自己的动作捕捉数据来创建自己的文件（我们称之为 **Takes** / **采集片段**）。\n*\
    \   **实时动作捕捉数据**：`Blueprint` 允许我们使用来自硬件设备的实时数据，例如：\n    *   用于面部动作捕捉的 iPhone。\n\
    \    *   利用摄像头的 Faceware Studio 等软件。\n    *   动作捕捉服也通过第三方软件为我们提供实时数据。实时数据是指实时流式传输到引擎中的骨骼变换和/或旋转信息。\n\
    *   **动画蓝图**：这些主要用于游戏逻辑，但它们可以使用预录制数据中使用的相同动画文件类型，或在使用实时动作捕捉数据时保存的文件类型，这些是我们在传统\
    \ 3D 动画电影制作中会使用的。\n\n`Blueprints` 还允许接收来自用户的新数据，例如游戏中的玩家，并将根据玩家的行为调用相关的动画文件。例如，如果玩家奔跑，`Blueprint`\
    \ 将执行 `run` 动画文件，从而驱动角色奔跑。该文件通常采用 `FBX` 或 `BVH` 格式。这些文件被称为 **资产**。\n\n那么，让我们看看引擎内部的\
    \ `Blueprint`。\n\n### 打开蓝图\n\n一旦你成功将 MetaHuman 角色导入 UE5，你将看到一些文件夹和一个以 `BP_` 前缀开头的文件，如图\
    \ 3.1 所示。该文件夹包含显示角色所需的所有资产。\n"
