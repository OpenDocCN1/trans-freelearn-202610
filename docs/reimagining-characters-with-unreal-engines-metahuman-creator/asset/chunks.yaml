  trans: '


    # Faceware 面板：EFFECTS 和 STREAM


    *   **EFFECTS**：虽然不是常用面板，但如果你发现仅使用 `TUNING` 无法获得理想效果，`EFFECTS` 就会派上用场。例如 `Mouth
    Smile Left`（左嘴角上扬）在 CGI 面部上显示的位置稍微有点高。要修复此问题，我们可以手动添加一个负值的 `Offset`（偏移量）来抵消它，如*图
    9.20*所示：


    ![Figure 9.20: Effects](img/B17878_09_20.jpg)


    图 9.20：Effects


    *   **STREAM**：这是通往 `STREAMING` 面板的快捷方式，我们之前也介绍过。


    理想情况下，顶部菜单中的所有这些按钮都应显示为绿色。如果它们在黄色和绿色之间切换，说明设置已生效但并非最佳。如果变为红色，则肯定需要进行更改。


    导致按钮变红的最常见情况是我们将脸部移出了网络摄像头的捕捉范围。人脸追踪通常表现很好，但一旦超出画面范围，它就无法追踪，并会立即给我们一个红色的追踪按钮。第二常见的红色按钮情况是帧率过低，这反过来会导致追踪效果不佳。


    在深入了解这些附加面板（尤其是 `TUNING`）的更多细节之前，我们必须先返回 Unreal，确保我们正在接收实时面部捕捉数据，并且还需要进入我们的 MetaHuman
    蓝图。原因在于，最好查看 MetaHuman 对面部追踪的响应情况，并根据该信息进行调整，而不是盯着 Faceware 里的默认头模看。


    # 启用 Live Link 以接收 Faceware 数据


    在进入 MetaHuman 蓝图之前，让我们再次确认 Live Link 是否正在接收信号。


    要在 Unreal 中打开 Live Link 插件，请转到 `Window` > `Virtual Production` > `Live Link`，如*图
    9.21*所示：


    ![Figure 9.21: Opening Live Link](img/B17878_09_21.jpg)


    图 9.21：打开 Live Link


    在*图 9.22*中，你可以看到我点击了 `Faceware Live Link` 以选择来自 Faceware 的传入信号。请记下 `Port Number`（端口号）：它与我在
    Faceware `STREAMING` 面板中检测到的端口号相同，如*图 9.14*所示。如果 Live Link 的端口号与 Faceware 的端口号不同，你可以在任一应用程序中更改它以使其匹配。


    ![Figure 9.22: Live Link Port Number](img/B17878_09_22.jpg)


    图 9.22：Live Link 端口号


    现在，在 Faceware 中启用 `STREAM TO CLIENT` 后，我们应该获得良好的人脸追踪。良好的人脸追踪意味着没有红色警告。这也意味着我们在
    Live Link 中接收到了实时信号，从而显示绿色按钮，如*图 9.22*所示。一旦获得该绿色按钮，我们就可以开始使用 MetaHuman 蓝图进行工作了。


    # 编辑 MetaHuman 蓝图


    首先，我们需要创建一个新的 Level Sequence（关卡序列），因为我们要将 MetaHuman 蓝图添加到 Level Sequencer（关卡序列器）中：


    1.  就像上一章一样，从 `Outliner`（大纲视图）中拖放 MetaHuman 蓝图到 `Level Sequencer` 上。同样，你会注意到创建了一个
    `Metahuman_ControlRig` 和一个 `Face_ControlBoard_CtrlRig`。删除这两个，因为我们不需要它们。


    2.  接下来，在 `Level Sequencer` 中的蓝图里点击 `Face`。在*图 9.23*中，你将看到 `Details`（细节）面板为我提供了可编辑的参数，即
    `Animation Mode`（动画模式）和 `Anim Class`（动画类）。


    ![Figure 9.23: Selecting Face from the MetaHuman Blueprint](img/B17878_09_23.jpg)


    图 9.23：从 MetaHuman 蓝图中选择 Face


    确保 `Animation Mode` 设置为 `Use Animation Blueprint`，且 `Anim Class` 设置为 `ABP_Metahuman_Faceware_LiveLink
    Face`。


    3.  现在通过点击 Unreal Engine 界面顶部的 `Play`（播放）按钮来测试你的面部动作捕捉数据。这将运行一个游戏模拟，你可以在其中看到面部动画栩栩如生。


    务必点击 `Stop`（停止）以停止模拟。你必须在启动 `Take Recorder`（我们将在下一节使用）之前执行此操作。


    # 使用 Take Recorder 录制会话


    在上一节中，我提到运行模拟以测试面部动作捕捉数据。这对于快速测试来说没问题，但对于动画制作，我们需要录制动作捕捉数据，为此 Epic Games 创建了 `Take
    Recorder`。它允许我们录制动捕会话并从 `Level Sequencer` 回放。


    要使用 `Take Recorder`，请按以下步骤操作：


    1.  转到 `Take Recorder` 选项卡并添加 MetaHuman 蓝图。你可以在*图 9.24*中看到，我是通过点击 `+ Source` 选项，然后选择
    `From Actor` 来完成此操作的。


    ![Figure 9.24: Adding the MetaHuman Blueprint to the Take Recorder](img/B17878_09_24.jpg)


    图 9.24：将 MetaHuman 蓝图添加到 Take Recorder


    2.  仍在 `Take Recorder` 选项卡中，使用 `From LiveLink` 选项添加另一个资产，如*图 9.25*所示。在这里，我们将添加
    `animationValues`。此处提到的值是指所有正从 Faceware 流式传输的 ARKit 数据值，例如头部旋转、眨眼和张嘴。


    ![Figure 9.25: Adding animationValues to the Take Recorder](img/B17878_09_25.jpg)


    图 9.25：将 animationValues 添加到 Take Recorder


    3.  注意 `Take` 编号。在我的例子中，是 `Scene_1 Take 18`。每当我们想要回放某个 take 时，提前知道哪个 take 是好 take
    会非常方便。


    4.  点击 `Take Recorder` 上的 `Record` 按钮（是的，就是那个大红按钮！）。


    5.  再次按 `Play` 运行模拟。当你从 Faceware 向 Unreal 流式传输数据时，你的动画再次栩栩如生。


    6.  点击 `Take Recorder` 上的 `Stop` 并记下新的 `Take` 编号。


    7.  为了回放我们刚刚捕捉的 take，我们首先需要更改 `Animation Mode`。选择 `Face` 以编辑 `Animation Mode`。然后将模式从
    `Animation Blueprint` 改为 `Use Animation Asset`，如*图 9.26*所示：


    ![Figure 9.26: Changing the Animation Mode to Use Animation Asset](img/B17878_09_26.jpg)


    图 9.26：将动画模式更改为 Use Animation Asset


    当我们想要回放 take 时，将动画模式更改为 `Use an Asset`；当我们想要录制 take 时，恢复为 `Blueprint`。


    在下一节中，我们将返回 `Level Sequencer` 以回放我们的面部动作捕捉录制。


    # 将 Take 导入 Level Sequencer


    要回放我们的面部捕捉 take，我们需要将其添加到 `Level Sequencer`。为此，请按以下步骤操作：


    1.  点击 `Face` 旁边的 `+` 图标以添加动画。在上下文菜单中，转到 `Animation` 并搜索你最近的 take。在我的例子中，我正在寻找
    take 19，如*图 9.27*所示：


    ![Figure 9.27: Adding the Animation Asset to the Face as a track](img/B17878_09_27.jpg)


    图 9.27：将动画资产作为轨道添加到 Face


    2.  点击所需的轨道，它将自动填充 `Level Sequencer` 中的 `Face` 轨道，如*图 9.28*所示：


    ![Figure 9.28: Adding the Take Recorder track to the Level Sequencer](img/B17878_09_28.jpg)


    图 9.28：将 Take Recorder 轨道添加到 Level Sequencer


    3.  要回放动画，请点击播放头所在的时间轴任意位置，然后按 `spacebar`（空格键）。


    现在我们已将动作捕捉数据直接添加到 `Level Sequencer` 中。然而，这是原始数据，极有可能需要一些编辑。在下一节中，我们将探讨一些可以利用的
    MetaHuman 控件，以进一步增强我们对角色的创作控制。


    # 在 Unreal 中烘焙和编辑面部动画


