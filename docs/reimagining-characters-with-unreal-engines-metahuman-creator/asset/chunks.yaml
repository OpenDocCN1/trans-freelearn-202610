    \ will get the software up and running on your system so you can start using Unreal\
    \ in the next chapter.\n\n# Setting up Unreal and the MetaHuman Creator\n\nBefore\
    \ we can start using Unreal Engine and MetaHumans, we need to do some setup. In\
    \ upcoming sections, we will do the following:\n\n*   Create an Unreal account\n\
    \n*   Download and install Unreal Engine 5\n\n*   Launch Unreal Engine 5\n\n*\
    \   Install Quixel Bridge\n\n*   Boot up MetaHuman Creator\n\nSo, let’s get started.\n\
    \n## Creating an Epic account\n\nTo get started with Unreal, the first thing you\
    \ need to do is create an Epic account. To do this, follow these instructions:\n\
    \n1.  First navigate to the Epic Games website: [https://www.epicgames.com/](https://www.epicgames.com/).\n\
    \nNote\n\nDepending on your region, don’t be surprised if the URL changes to something\
    \ like the following: https://www.epicgames.com/store/en-US/ (you’re still in\
    \ the right place).\n\n1.  Once on the Epic Games website, you can navigate to\
    \ the Unreal Engine link. Alternatively, just use the following URL: [https://www.unrealengine.com/](https://www.unrealengine.com/).\n\
    \n2.  In the right-hand corner, click **Sign In** (even though you don’t have\
    \ sign-in credentials, you must still click on this).\n\n3.  You’ll see a list\
    \ of ways you can sign in, including using your email account with a bespoke password\
    \ or just simply linking other social media or gaming credentials to Epic Games.\
    \ Assuming this is your first account and you’re not signed in, select **Don’t\
    \ have an Epic Games account? ****Sign Up**:\n\n![Figure 1.1: Different sign-in\
    \ methods ](image/B17878_01.01.jpg) \n\nFigure 1.1: Different sign-in methods\n\
    \n1.  On the next page, you will be asked for your name, surname, username, and\
    \ email, and to designate a password for your email. You can opt to receive additional\
    \ emails, but you will need to read the terms and conditions and tick that you\
    \ have done so.\n\n![Figure 1.2: Signing up for Epic ](image/B17878_01.02.jpg)\
    \ \n\nFigure 1.2: Signing up for Epic\n\n1.  Once you have done this, a link will\
    \ be sent to your designated email for verification. When you click on this link,\
    \ you’ll have successfully created an account. You’ll need to be logged in whenever\
    \ you plan to use the engine.\n\nNext, we need to download and install Unreal\
    \ Engine 5.\n\n## Downloading and installing Unreal Engine 5\n\nUsing your Unreal\
    \ account, we need to download and install Unreal Engine 5. The application you\
    \ are about to install is the Epic Games Launcher. This is where you install the\
    \ engine and gain access to other features related to the engine, such as updates,\
    \ plug-ins, scripts, models, and a host of many other assets. To do this, follow\
    \ these steps:\n\n1.  Once you have successfully signed in to Epic, you’ll see\
    \ a page like this (the page may vary, as the screenshot is the latest marketing\
    \ material from Epic at the time of print):\n\n![Figure 1.3: Epic splash screen\
    \ ](image/B17878_01.03.jpg) \n\nFigure 1.3: Epic splash screen\n\nIn the top right\
    \ corner, you will see your name, as well as the **Download** button. Click this\
    \ to take you to the following page:\n\n![Figure 1.4: Licensing options ](image/B17878_01.04.jpg)\
    \ \n\nFigure 1.4: Licensing options\n\nFor the purpose of this book, we’ll assume\
    \ you’re in the film and animation business and not the game development business.\
    \ The column on the left is a **Publishing License** agreement for game developers\
