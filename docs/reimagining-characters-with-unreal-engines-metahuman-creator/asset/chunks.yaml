  trans: '


    # 导入和编辑骨架


    ## 角色蓝图界面


    ![Figure 3.1: The Blueprint inside the Content Browser](img/B17878_03.01.jpg)


    Figure 3.1: 内容浏览器中的蓝图


    当你双击蓝图时，这将打开你角色的蓝图。你将看到屏幕由六个选项卡组成，如图 3.2 所示：


    ![Figure 3.2: The six panels of the character Blueprint](img/B17878_03.02.jpg)


    Figure 3.2: 角色蓝图的六个面板


    ### 六个面板


    让我们分解一下这些选项卡：


    1.  **`Components`（组件）**：这是我们可以选择想要编辑的 MetaHuman 哪个部分的地方。我们还可以向 MetaHuman 添加额外的组件，例如网格体、摄像机和灯光。


    2.  **`My Blueprint`（我的蓝图）**：在这里，我们可以看到与 MetaHuman 关联的功能性元素，例如 ARKit 设置，它允许将面部动作捕捉导向我们的角色。


    3.  **`Viewport`（视口）**：这为我们提供了角色的视图，而不显示关卡的其余部分。如果我们将角色带入了一个繁忙的场景，并希望在没有繁忙环境干扰的情况下检查或编辑角色，这将非常方便。


    4.  **`Construction Script`（构造脚本）**：构造脚本允许引擎无论我们使用哪个关卡，都能对蓝图进行数据读写。在游戏世界中，这很有用，因为构造脚本可以保存诸如角色健康值之类的数据。就我们使用
    MetaHuman 的目的而言，我们不需要对此进行任何更改。


    5.  **`Event Graph`（事件图表）**：事件图表包含与事件相关的重要信息。事件可以是游戏开始，也可以是按下键盘上特定键的结果。就 MetaHuman
    而言，事件图表决定了角色应该使用什么 LOD 值。例如，如果摄像机远离角色，这就是一个触发角色显示大于 0 的 LOD 值的事件。


    6.  **`Details`（细节）**：这是我们进行大部分编辑的地方。它是上下文敏感的，因此根据我们在 `Components` 选项卡中点击的内容，我们将看到不同的信息。例如，身体将提供与面部不同的可编辑参数。


    ### 在细节面板中编辑材质


    正如我们刚才提到的，当涉及到编辑角色时，我们通过编辑各种资产在 `Details` 面板中进行。其中许多资产是图像文件，但许多编辑器也允许你进一步完善角色。事实上，在某些情况下，你甚至可以比单独使用
    MHC 更好地控制角色的许多方面。这种额外的控制可以为你的角色带来比仅靠 MHC 所能实现的更逼真的效果。


    要查看一个你拥有多少额外编辑能力的示例，请在 `Components` 选项卡中点击 `Face`（面部），然后在 `Details` 选项卡中双击其中一个
    `Eye materials`（眼部材质）选项。根据你选择的眼睛，它将被标记为 `M_EyeRefractive_Inst_L`。


    一旦你打开了该眼睛的材质编辑器，就可以编辑 MHC 中无法编辑的某些属性。例如，你可以编辑眼睛的混浊度和虹膜内的环境光遮蔽，这会给眼睛增加很多深度，如图 3.3
    所示：


    ![Figure 3.3: Editing the eye material](img/B17878_03.03.jpg)


    Figure 3.3: 编辑眼部材质


    > **Note**

    >

    > 使用蓝图中独有的参数对角色进行进一步编辑不会影响你在 MHC 中的原始设计。你将始终通过 Bridge 拥有一个安全的备份副本。


    顺便提醒一下，蓝图的作用就像驱动程序，而角色子文件夹就像乘客。虽然你可以直接通过角色蓝图访问所有这些组件，但也可以通过深入各个子文件夹来获得访问权限；有时你可能希望同时打开多个文件夹，所以在许多情况下，这仅仅取决于个人偏好。


    ## 导航蓝图


    ### 使用文件夹结构


    为了向你展示如何使用文件夹进行导航，如图 3.4 所示，我直接进入了 `Hoodie`（连帽衫）文件夹，并双击了 `Hoodie Material`（连帽衫材质）资产以更改其颜色：


    ![Figure 3.4: Further editing done directly within the folder structure](img/B17878_03.04.jpg)


    Figure 3.4: 直接在文件夹结构中进行进一步编辑


    正如你所见，对这个特定资产的控制甚至比单独从 MHC 获得的还要多；例如，使用颜色选择器工具来更改 MetaHuman 的连帽衫颜色。你可能还记得在 *Chapter
    2* *Creating Characters in the MetaHuman Interface*（在 MetaHuman 界面中创建角色）中，我们使用
    MHC 颜色工具进行更改。


    ### 不使用文件夹进行导航


    在图 3.5 中，你可以看到正在进行相同的编辑，但我们使用的是角色蓝图来编辑同一个资产。这两种方法同样有效。


    ![Figure 3.5: Editing a color inside the character Blueprint](img/B17878_03.05.jpg)


    Figure 3.5: 在角色蓝图内编辑颜色


    你可以在图 3.5 中看到，我遵循了以下步骤：


    1.  我在 `Components` 选项卡中选择了 `Torso`（躯干）。

    2.  我点击了 `Material`（材质）元素槽，这会打开 `Material Editor`（材质编辑器）。

    3.  我点击当前颜色，这会打开 `Color Picker`（颜色选择器），允许我更改颜色。


    虽然蓝图中有许多与角色外观相关的额外编辑器，但它们大多用于完善材质。在大多数情况下，结果很微妙，但你可以完全更改配色方案。


    尽管这一切看起来令人生畏，但请放心，你实际上只会编辑蓝图的一小部分。至少，你只需要选择想要驱动角色的动画类型，而对于从另一个角色重定向动画，我们只需要编辑骨骼细节。


    先让身体动画跑起来是合理的。UE5 自带几个入门包来帮助我们。其中一个入门包是第三人称游戏，它带有一个绑定了骨架的 `Mannequin`（模型/假人）角色。它还带有一些动画，我们可以用来测试我们自己的角色。


    在本章的其余部分，我们将着眼于蓝图，旨在从入门游戏包中重定向动画，并在下一章将其应用到我们自己的角色上。


    ## 添加模型角色


    在本节中，我们将 `Mannequin` 角色添加到项目中。然后，为了能够将动画从一个角色重定向到另一个角色，源角色和目标角色都必须拥有骨架。我们将在以下部分查看这两个骨架。


    首先，我们要使用随 Unreal 附带的 `Mannequin` 角色的骨架。要将其添加到项目中，你只需转到 `Content Browser`（内容浏览器），点击
    `+ADD`（+添加）按钮，然后选择 `Add Feature or Content Pack…`（添加功能或内容包……）：


    ![Figure 3.6: Adding a content pack](img/B17878_03.06.jpg)


    Figure 3.6: 添加内容包


    点击 `Add Feature or Content Pack…` 后，你会看到一个弹出窗口，你可以在 `Blueprint`（蓝图）功能选项卡中选择 `Third
    Person`（第三人称）：


    ![Figure 3.7: Add Content to the Project](img/B17878_03.07.jpg)


    Figure 3.7: 向项目添加内容


    我们选择 `Third Person` 的原因是它在项目中包含一个完整的角色，包括一个模型，我们可以对其进行重定向。然后，点击 `Add to Project`（添加到项目）。这会将项目加载到你的内容浏览器中。


    你会注意到内容浏览器中现在有两个新文件夹：`Mannequin` 和 `Third PersonBP`。


    在这个阶段我们要做的是编辑 `Mannequin` 骨架，使其结构、命名约定和动画方法与我们的 MetaHuman 相同。这样，我们就可以从 `Mannequin`
    重定向动画并将其应用到我们的 MetaHuman 上。


    '
