  trans: '

    要进一步编辑角色的动作，你可以随时将动画烘焙到控制绑定，并添加 `Additive Section` 以进行进一步编辑。


    除了可视化骨架这一便捷工具外，还有其他编辑动画片段的选项。通过在轨道任意处右键单击并转到属性，你会发现编辑片段时有更多选项：


    ![Figure 10.9: Further options ](img/B17878_10_09.jpg)


    图 10.9：更多选项


    说到合并动画，最重要的是帧率。你可能会发现你正尝试混合两个速度不同的动画。属性功能是解决此问题的好方法，通过更改帧率使它们匹配。你也可以尝试不同的帧率。


    既然我们已经了解了如何添加与身体相关的动作捕捉数据，在下一节中，我们将介绍添加和合并动画轨道的相同原则，但这次我们将专注于面部。


    # 向 Level Sequencer 添加面部动作捕捉数据


    要添加和合并面部动画，你需要遵循与处理身体完全相同的步骤，即要么添加一个全新的 Faceware 轨道，要么将动画添加到现有动画轨道的末尾并移动轨道。让我们更详细地看一下。


    ## 添加录制的 Faceware 片段


    在本节中，我们将把 Faceware 面部动作捕捉文件添加到 Level Sequencer 中。如果你在定位 Faceware 面部捕捉文件时遇到困难，该文件是由
    `Take Recorder` 在 *第 8 章* 中录制的，只需记住 Take Recorder 给角色蓝图的名称添加了 `_Scene` 后缀。因此，在我的例子中，我只搜索了
    `BP+Glenda_Scene`，所有的片段都列了出来供我选择。


    在图 10.10 中，你可以看到我将第 6 条片段 `BP_Glenda_scene_106_0` 与第 1 条片段 `BP_Glenda_Scene_1_01_0`
    进行了合并：


    ![Figure 10.10: Adding Face animation to one animation track ](img/B17878_10_10.jpg)


    图 10.10：将面部动画添加到一个动画轨道


    我选择了 `BP_Glenda_Scene_1_01_0`。你可以看到关键帧以蓝色出现，包括 `0341` 和 `+19`。注意 `+` 图标——这意味着我将片段向右移动了
    19 帧，所以它将在 19 帧后开始。


    ## 编辑面部动作捕捉


    编辑面部捕捉动画片段的过程与身体数据几乎完全相同，因此我们可以使用相同的工具并遵循上一节的相同步骤。


    此外，我们可以将轨道烘焙为控制绑定中的关键帧，并添加一个 `Additive Section` 来微调动画，正如我们在 *第 8 章* 中所介绍的。从图 10.11
    中可以看到，我采取了相同的步骤烘焙控制绑定，这由三角形关键帧指示：


    ![Figure 10.11: Baking the track to the control rig ](img/B17878_10_11.jpg)


    图 10.11：将轨道烘焙到控制绑定


    让面部捕捉与身体捕捉配合工作的很大一部分在于时机。这可能只需要简单地将面部动作捕捉动画轨道向左或向右滑动；另一方面，你可能需要花费更多时间使用面部控制绑定，甚至身体控制绑定，以使两个动画匹配。熟练使用面部控制绑定的唯一途径就是多加实验。一个好的做法是尽可能充分利用原始面部动作捕捉数据，然后使用带有控制绑定的
    `Additive` 片段来完善动画。


    介绍了一些高级动画功能后，现在是深入探讨一些高级渲染功能的时候了。


    # 探索高级渲染功能


    我以前说过，现在再说一遍：Unreal Engine 是一个非常强大的工具，在渲染方面，它从不令人失望。Unreal 能够提供卓越的效果，可与 Mental
    Ray、Arnold、V-Ray 和 RenderMan 等传统路径追踪渲染器相媲美。Unreal 现在支持路径追踪，这是这些其他渲染器工作原理的基础。


    在电影制作领域，Unreal 拥有实时渲染能力，应加以探索以释放其全部潜力。摄像机和灯光拥有我们在 Maya、Houdini 和 Blender 等使用路径追踪渲染器的
    3D 程序中发现的功能。可以从这些应用程序中的任意一个导出完整场景，并保持摄像机和灯光设置完好无损且与 Unreal 兼容。


    那么，废话不多说，让我们来看看这些很棒的渲染功能。


    ## 添加和制作摄像机动画


    在 *第 7 章* 中，我们使用了一种直接从 Level Sequencer 创建新摄像机的方法；然而，在本章中，我们将在不使用 Level Sequencer
    的情况下创建摄像机。


    在图 10.12 中，我点击了 `Create Actor`（创建 Actor）按钮，以快速向场景中添加一个 Actor。从那里，我选择了 `Cinematic`（电影），然后选择
    `Cine Camera Actor`（电影摄像机 Actor）。这会在我的场景视口中创建一个摄像机：


    ![Figure 10.12: Quickly adding a camera to the scene ](img/B17878_10_12.jpg)


    图 10.12：快速向场景添加摄像机


    接下来，转到 Level Sequencer，通过点击 `+ Track`（+ 轨道）按钮并选择刚创建的摄像机来添加摄像机。


    在图 10.13 中，摄像机切割具有网格背景，上方的视口也是如此。这使我们能够直接在视口中预览来自 Level Sequencer 的任何摄像机动画：


    ![Figure 10.13: The camera cut being automatically created ](img/B17878_10_13.jpg)


    图 10.13：摄像机切割被自动创建


    与 MetaHuman 蓝图的身体和面部不同，Cine Camera 会自动生成 Transform（变换）功能。这将允许你更改摄像机在 `X`、`Y` 和
    `Z` 轴上的位置。你还可以更改摄像机在 `X`、`Y` 和 `Z` 轴上的旋转，它们分别改变 Roll（滚转）、Pitch（俯仰）和 Yaw（偏航）。


    如图 10.14 所示，右侧有关键帧属性。通常，在制作摄像机动画时，你需要调整 `Location`（位置）设置并编辑 `Focus Distance`（焦距）设置，以确保主体对焦清晰：


    ![Figure 10.14: The camera transform ](img/B17878_10_14.jpg)


    图 10.14：摄像机变换


    与其每次想在 Level Sequencer 中设置关键帧时都在 Level Sequencer 的 Transform 功能中更改数值，不如直接在视口中驾驶摄像机，这很像使用键盘和鼠标玩第一人称游戏。


    请务必启用自动关键帧，如图 10.15 所示，每次移动摄像机时它都会创建一个关键帧：


    ![Figure 10.15: The Autokey function ](img/B17878_10_15.jpg)


    图 10.15：自动关键帧功能


    除了制作摄像机位置动画外，你还可以制作摄像机焦点对象的动画。一个非常方便的对焦工具是 `Debug Focus`（调试对焦）工具，如图 10.16 所示。该工具为我们提供了清晰的视觉指示，显示什么在焦点上。选中摄像机后，勾选
    `Draw Debug Focus Plane`（绘制调试对焦平面）选项；你会看到一个粉色平面出现。位于该粉色平面上的任何东西都将完美对焦：


    ![Figure 10.16: Camera debug focus ](img/B17878_10_16.jpg)


    图 10.16：摄像机调试对焦


    你可以在 Level Sequencer 中控制焦点并制作焦距动画，但请使用调试平面进行精确对焦。


    现在，介绍了一些更高级的摄像机功能后，是时候转到灯光了。


    ## 添加和制作灯光动画


    在大多数情况下，Actor 被添加到 Level Sequencer 时会带有一些可制作动画的属性。可以通过 Level Sequencer 制作更多属性的动画，但我们需要手动将它们添加到
    Level Sequencer 中。

