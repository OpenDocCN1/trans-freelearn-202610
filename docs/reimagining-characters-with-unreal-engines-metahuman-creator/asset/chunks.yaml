- raw: "If your computer screen can display 4,000 pixels across, then the texture\
    \ map of 8K will be displayed very adequately. In particular, a texture of a face\
    \ being at 8K is more than enough to display a close-up on a 4K monitor. Also,\
    \ keep in mind that there are several texture maps for the face that are all blended\
    \ to give you even extra detail. The combined texture maps for the Glenda character\
    \ come to 1.6 GB.\n\nNote\n\nYou can always swap out your characters at a later\
    \ stage. So, you can work out your entire production using a lower-resolution\
    \ proxy of your character and then swap it out for an 8K version when you are\
    \ at the lighting and rendering phase of your production. This is a very easy\
    \ process, with the download and export part taking by far the most time.\n\n\
    ## Download considerations\n\nWhenever you close the MHC or just stop using it,\
    \ your character is ready to be downloaded at any time from within Bridge. If\
    \ you have Bridge open, with your character selected, you will see it update from\
    \ time to time, particularly once you’ve closed down your MHC session.\n\nTo change\
    \ the download settings, click **Download Settings**, as shown in *Figure 2**.48*.\
    \ You'll see two tabs - **TEXTURES** and **MODELS**.\n\nFirst, let’s look at the\
    \ **TEXTURES** tab:\n\n![Figure 2.48: Textures settings ](image/B17878_02_48.jpg)\
    \ \n\nFigure 2.48: Textures settings\n\n**TEXTURES** has already got just about\
    \ half of the potential textures ticked by default, which is good enough for most\
    \ cases. We are given the extra choice of choosing what **Image format** to choose\
    \ from – that is, **JPEG**, **EXR**, or **JPEG+EXR** I highly recommend that you\
    \ stick with **JPEG** as EXR files are considerably larger, will add to your download\
    \ and processing time, and may even cause performance issues in Unreal. In most\
    \ cases, there isn’t enough pixel data to justify the use of the EXR file format.\n\
    \nNow, let’s switch to the **MODELS** tab; here, we have different options:\n\n\
    ![Figure 2.49: Models settings ](image/B17878_02_49.jpg) \n\nFigure 2.49: Models\
    \ settings\n\nBecause this is Bridge, we have options for **Megascans** and **MetaHumans**\
    \ when it comes to choosing what format we want our 3D models to be in. We just\
    \ need to concern ourselves with the **MetaHumans** drop-down list, which gives\
    \ us two formats to choose from – that is, **UAsset** and **UAsset + ****Source\
    \ Asset**.\n\nChoosing **UAsset + Source Asset** will download the character mesh\
    \ in a format only readable in Unreal and also the more universal format, FBX.\
    \ This is the safest bet as we can’t just download **UAsset** on its own as it\
    \ will most likely cause the export process to fail. (We can also go to **Export\
    \ Settings** to give us more options for third-party 3D programs should you only\
    \ want to work with your MetaHuman in Maya, Houdini, or Blender.)\n\nOnce you\
    \ have reviewed the settings, you can click the **Back** button, and then the\
    \ green **Download** button that will appear at the bottom of the panel shown\
    \ in *Figure 2**.47*. The download process takes a considerable amount of time\
    \ because the MHC is baking out the texture maps based on your modifications,\
    \ generating new meshes, and writing out new Unreal files. It’s also compressing\
    \ and decompressing the files for the download process.\n\nNow, let’s look at\
    \ the **Export ****Settings** options.\n\n## Export considerations\n\nNext, we\
    \ will look at **Export Settings** (which you can find below **Downloads Settings**\
    \ in *Figure 2**.47*). Here is the window you will see:\n\n![Figure 2.50: Export\
    \ Settings ](image/B17878_02_50_new.jpg) \n\nFigure 2.50: Export Settings\n\n\
    To export your character, do the following:\n\n1.  Set **Unreal Engine** as your\
    \ **Export Target**.\n\n2.  Set **Engine Version** to the version you have installed,\
    \ which should be version **5.0**.\n\n3.  Set **Plugin Location** to the directory\
    \ where you installed Unreal (choosing this folder will allow Bridge to install\
    \ the plugins automatically.)\n\n4.  Choose the location of your project folder\
    \ as the default location under **Default Project**.\n\nNote\n\nShould you export\
    \ your character as an Unreal asset only and then later wish to bring your character\
    \ into Maya, Blender, or another third-party application, you can either download\
    \ it again from Bridge but change the export settings so that **Export Target**\
    \ is set to Maya or Blender, *or* export your character as an FBX directly from\
    \ Unreal using the Level Sequencer.\n\nOnce done, you can find the **Export**\
    \ button in the same panel as shown in *Figure 2**.47*.\n\nAn alternative and\
    \ advisable way of bringing your character into the correct project safely is\
    \ by utilizing the Bridge plugin within your Unreal project. This plugin comes\
    \ enabled in UE5 by default. It’s a mini version of Bridge that is launched exclusively\
    \ from within Unreal. To use Bridge from Unreal, navigate to the **Content** folder\
    \ at the bottom of your screen and click on the **+ADD** button. Here, you will\
    \ see **Add Quixel Content**; click on it. You can see both of these highlighted\
    \ in *Figure 2**.51*:\n\n![](image/B17878_02_51.jpg) \n\nFigure 2.51: Loading\
    \ Quixel Bridge from within the Content folder in Unreal 5\n\nYou may be asked\
    \ to sign in again at this point. Once signed in using your Epic Games credentials,\
    \ you’ll see your MetaHuman’s content and a similar interface where you can download\
    \ and add the character directly within the open Unreal project.\n\nThe advantage\
    \ of doing it this way is that there is less chance of user error of accidentally\
    \ exporting your character to the wrong project folder. Also, if your plugins\
    \ haven’t been installed, the Quixel importer that you engaged when clicking **+ADD**\
    \ will check to see whether the plugins have been installed and will automatically\
    \ install them for you after prompting you at the bottom right of the screen;\
    \ we will look at this in more detail in this section.\n\n## Processing in the\
    \ background\n\nUE5 will bring the files that have been downloaded to your machine\
    \ into Unreal Engine. Simply put, Bridge saves the relative files into a folder\
    \ called **MetaHumans**, which can be found in the **Content** folder of your\
    \ Unreal project. If you don’t have the MetaHumans plugins installed (such as\
    \ the Hair Grooms plugin), don’t worry – this is where the mini Bridge plugin\
    \ saves the day by installing them automatically during the export step.\n\nAt\
    \ the bottom of the screen, various notifications regarding all the MetaHumans-related\
    \ plugins will appear. It may ask you to click **Enable Missing** regarding plugins.\
    \ Be sure to hit **Enable Missing**, as demonstrated in *Figure 2**.52*:\n\n![](image/B17878_02_52.jpg)\
    \ \n\nFigure 2.52: Missing plugins and project settings\n\nIn addition, UE5 will\
    \ also compute things such as skin weights and compiling shaders. This will take\
    \ a couple of minutes and you won’t be able to use Unreal Editor while this is\
    \ happening.\n\nWhen finished, look for the **MetaHumans** folder that’s been\
    \ created in the **Content Browser** area within your UE5 project, as shown in\
    \ *Figure 2**.53*. All your MetaHuman characters will be imported into this folder;\
    \ they will be created the first time you go through the export process:\n\n![](image/B17878_02_53.jpg)\
    \ \n\nFigure 2.53: The MetaHumans folder\n\nInside that, you’ll see a folder with\
    \ your character’s name on it. Open that and you’ll see a little thumbnail of\
    \ your character. In my case, it’s called **BP\\_Glenda** (BP stands for **Blueprint**).\n\
    \n*Figure 2**.54* shows that I’ve brought my character into the viewport. I did\
    \ this by simply dragging and dropping the Blueprint into the viewport:\n\n![](image/B17878_02_54.jpg)\
    \ \n\nFigure 2.54: Dragging and dropping the Blueprint\n\nNote\n\nYou can edit\
    \ your scene at any time. In *Figure 2**.54*, I used a blank template and dragged\
    \ and dropped the HDRI backdrop into my scene to give me an easy but realistic\
    \ lighting setup."
