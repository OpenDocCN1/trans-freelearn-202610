  trans: '

    # MetaHuman 下载与导出工作流


    如果您的显示器分辨率宽度达到 4,000 像素，8K 贴图将能得到充分展示。特别是面部 8K 贴图，在 4K 显示器上呈现特写绰绰有余。此外，请注意面部由多张贴图混合而成，可提供更丰富的细节。Glenda
    角色的组合贴图总大小达 1.6 GB。


    > **Note**

    >

    > 您可在后期制作中随时替换角色。因此，您可以用角色的低分辨率代理模型完成整个制作流程，待进入灯光渲染阶段时再替换为 8K 版本。这是一个非常简单的过程，仅下载和导出环节耗时较长。


    ## 下载注意事项


    每当您关闭 `MHC` 或停止使用时，角色即可从 `Bridge` 内部下载。若 `Bridge` 处于打开状态且选中了该角色，您会看到其不时更新，尤其是在关闭
    `MHC` 会话后。


    要更改下载设置，请点击 `Download Settings`，如 *Figure 2.48* 所示。您将看到两个标签页：`TEXTURES` 和 `MODELS`。


    首先，我们来看看 `TEXTURES` 标签页：


    ![图 2.48：贴图设置](img/B17878_02_48.jpg`)


    图 2.48：贴图设置


    `TEXTURES` 标签页默认勾选了约一半的可用贴图，这对大多数情况已足够。我们还可额外选择 `Image format`（图像格式）——即 `JPEG`、`EXR`
    或 `JPEG+EXR`。我强烈建议坚持使用 `JPEG`，因为 `EXR` 文件体积大得多，会增加下载和处理时间，甚至可能导致 `Unreal` 中的性能问题。在大多数情况下，像素数据不足以支撑
    `EXR` 文件格式的优势。


    现在，我们切换到 `MODELS` 标签页，这里有不同的选项：


    ![图 2.49：模型设置](img/B17878_02_49.jpg`)


    图 2.49：模型设置


    因为这是 `Bridge`，所以在选择 3D 模型格式时，我们有 `Megascans` 和 `MetaHumans` 两个选项。我们只需关注 `MetaHumans`
    下拉列表，它提供两种格式供选择：`UAsset` 和 `UAsset + Source Asset`。


    选择 `UAsset + Source Asset` 将同时下载仅可在 `Unreal` 中读取的角色网格格式，以及更通用的 `FBX` 格式。这是最保险的选择，因为单独下载
    `UAsset` 很可能导致导出失败。（我们也可前往 `Export Settings` 为第三方 3D 软件提供更多选项，若您仅想在 `Maya`、`Houdini`
    或 `Blender` 中使用 `MetaHuman`。）


    确认设置后，点击 `Back` 按钮，再点击 *Figure 2.47* 所示面板底部的绿色 `Download` 按钮。下载过程耗时较长，因为 `MHC`
    正根据您的修改烘焙贴图、生成新网格、写入新的 `Unreal` 文件，同时还要为下载进行压缩和解压。


    现在，让我们看看 `Export Settings` 选项。


    ## 导出注意事项


    接下来，我们将查看 `Export Settings`（可在 *Figure 2.47* 的 `Download Settings` 下方找到）。您将看到如下窗口：


    ![图 2.50：导出设置](img/B17878_02_50_new.jpg`)


    图 2.50：导出设置


    要导出角色，请执行以下操作：


    1.  将 `Export Target` 设置为 `Unreal Engine`。

    2.  将 `Engine Version` 设置为您安装的版本，应为 **5.0** 版本。

    3.  将 `Plugin Location` 设置为 `Unreal` 的安装目录（选择此文件夹将允许 `Bridge` 自动安装插件）。

    4.  在 `Default Project` 下选择您的项目文件夹作为默认位置。


    > **Note**

    >

    > 若您仅将角色导出为 `Unreal` 资产，后续想将其引入 `Maya`、`Blender` 或其他第三方应用程序，可从 `Bridge` 重新下载并更改导出设置，将
    `Export Target` 设为 `Maya` 或 `Blender`，*或者* 直接在 `Unreal` 中使用 `Level Sequencer`
    将角色导出为 `FBX`。


    完成后，可在 *Figure 2.47* 所示的同一面板中找到 `Export` 按钮。


    一种替代且推荐的将角色安全导入正确项目的方法，是利用 `Unreal` 项目中的 `Bridge` 插件。此插件在 `UE5` 中默认启用。它是 `Bridge`
    的迷你版，仅能从 `Unreal` 内部启动。要在 `Unreal` 中使用 `Bridge`，请导航至屏幕底部的 `Content` 文件夹并点击 `+ADD`
    按钮。在此处，您将看到 `Add Quixel Content`；点击它。这两项均在 *Figure 2.51* 中高亮显示：


    ![图 2.51：在 Unreal 5 的内容文件夹中加载 Quixel Bridge](img/B17878_02_51.jpg`)


    图 2.51：在 Unreal 5 的内容文件夹中加载 Quixel Bridge


    此时系统可能会要求您再次登录。使用 `Epic Games` 凭据登录后，您将看到您的 `MetaHuman` 内容及类似界面，可在打开的 `Unreal`
    项目中直接下载并添加角色。


    这样做的优势在于：降低将角色误导出到错误项目文件夹的几率。此外，若插件尚未安装，点击 `+ADD` 触发的 `Quixel` 导入器会检查插件安装状态，并在屏幕右下角提示后自动为您安装；我们将在本节稍后详细探讨这一点。


    ## 后台处理


    `UE5` 会将已下载到本地的文件导入 `Unreal Engine`。简单来说，`Bridge` 将相关文件保存到 `Unreal` 项目 `Content`
    文件夹下的 `MetaHumans` 文件夹中。若您未安装 `MetaHumans` 插件（如 `Hair Grooms` 插件），请勿担心 —— 迷你 `Bridge`
    插件会在导出步骤中自动安装它们。


    屏幕底部将出现关于所有 `MetaHumans` 相关插件的各类通知。它可能会要求您点击 `Enable Missing` 以启用缺失的插件。请务必点击 `Enable
    Missing`，如 *Figure 2.52* 所示：


    ![图 2.52：缺失插件与项目设置](img/B17878_02_52.jpg`)


    图 2.52：缺失插件与项目设置


    此外，`UE5` 还将计算蒙皮权重、编译着色器等。这将耗费几分钟时间，在此期间您将无法使用 `Unreal Editor`。


    完成后，请在 `UE5` 项目的 `Content Browser`（内容浏览器）区域中寻找已创建的 `MetaHumans` 文件夹，如 *Figure
    2.53* 所示。所有 `MetaHuman` 角色都将导入此文件夹；该文件夹将在您首次执行导出流程时创建：


    ![图 2.53：MetaHumans 文件夹](img/B17878_02_53.jpg`)


    图 2.53：MetaHumans 文件夹


    在该文件夹内，您将看到一个以角色命名的文件夹。打开它，您将看到角色的缩略图。在本例中，它名为 `BP_Glenda`（`BP` 代表 `Blueprint`
    蓝图）。


    *Figure 2.54* 显示我已将角色引入视口。我是通过将 `Blueprint` 直接拖放至视口中实现的：


    ![图 2.54：拖放蓝图](img/B17878_02_54.jpg`)


    图 2.54：拖放蓝图


    > **Note**

    >

    > 您可以随时编辑场景。在 *Figure 2.54* 中，我使用了空白模板，并将 `HDRI` 背景拖放至场景中，以获得简单但逼真的灯光设置。

