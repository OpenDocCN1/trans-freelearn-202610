- raw: "We have covered a lot of ground with the skin editor and at this point, I\
    \ would like to remind you that additional editing of the skin can always be done\
    \ within Unreal Engine. But for now, in the next section, we will discuss the\
    \ eyes.\n\n### Eyes\n\nThe MHC has an incredibly powerful eye-editing tool. What’s\
    \ also very special about it is that some of the eye tools are editable within\
    \ Unreal. For example, if you wanted to animate the size of the iris, you can\
    \ do that within Unreal.\n\nHere, we will take a look at the following attributes\
    \ of the **Eyes** editor:\n\n*   **PRESETS**\n\n*   **IRIS**\n\n*   **SCLERA**\n\
    \nLet’s take a look at these now.\n\n#### Presets\n\nAs shown in *Figure 2**.19*,\
    \ the MHC has some great presets to choose from, providing an array of different\
    \ brown, blue, and green eyes to choose from:\n\n![Figure 2.19: Eye presets ](image/B17878_02_19.jpg)\
    \ \n\nFigure 2.19: Eye presets\n\nFor the most part, you can work with the default\
    \ presets, but you may want to go into specific details (which we will go through\
    \ in the next section) where you can achieve very specific yet natural looks,\
    \ from healthy eyes to very unhealthy eyes.\n\nNote\n\nBefore you start editing\
    \ your character’s eyes, take advantage of the lighting tools to ensure you have\
    \ the best lighting available. The eyes have quite a lot of detail, so you’ll\
    \ need to be up and close and at a LOD of 0, thus rendering in the highest quality.\n\
    \n#### Iris\n\nLet’s take a look at the **IRIS** panel next, which you can see\
    \ in *Figure 2**.20*. Without going too far into detail regarding what everything\
    \ does, the first choice you have is to edit the right, left, or both eyes. **Base\
    \ Color** allows you to edit the color closest to the iris, while **Detail Color**\
    \ allows you to edit the outside area of the eye closest to the limbus. You also\
    \ get to edit the **Color Balance** and **Color Balance Smoothness** options and\
    \ choose from nine iris patterns:\n\n![Figure 2.20: IRIS ](image/B17878_02_20.jpg)\
    \ \n\nFigure 2.20: IRIS\n\nJust like with skin tones, the **IRIS** editing function\
    \ is limited to natural looks. However, you can get some pretty wild-looking effects\
    \ by pushing the limbus darkness and aiming for high saturation in your color\
    \ editors.\n\n#### Sclera\n\nWhile the **IRIS** editor is a great tool, much of\
    \ the realism comes out of the **SCLERA** tab, as you can see in *Figure 2**.21*.\
    \ Effectively, this involves editing the white of the eye. While you can do a\
    \ lot with the **Tint** option, which is a balance between blue and yellow, the\
    \ **Brightness** option in conjunction with **Tint** is very powerful in terms\
    \ of aging the eye:\n\n![Figure 2.21: SCLERA ](image/B17878_02_21.jpg) \n\nFigure\
    \ 2.21: SCLERA\n\nThe MHC also brings a lot of detail with the **Vascularity**\
    \ slider. You can see this clearly when you start rotating the veins. These are\
    \ very powerful tools for extreme close-ups, and it is worth spending some time\
    \ on them before exporting your MetaHuman. CGI characters commonly lose realism\
    \ when their eyes are too bright and perfect.\n\nLet’s look at an example of combining\
    \ the **Eyes** editing options. Most of the editing in *Figure 2**.22* was done\
    \ using the **SCLERA** editing tab except for lightening up the limbus in the\
    \ **IRIS** editing tab and reducing the color in both the base and detail color\
    \ pickers:\n\n![Figure 2.22: Separate eye editing example ](image/B17878_02_22.jpg)\
    \ \n\nFigure 2.22: Separate eye editing example\n\nMy goal here was to simply\
    \ age the eye. By and large, I went a little too far and poor Glenda should see\
    \ a doctor at this stage. However, the result of her right eye does look a little\
    \ more realistic simply because of the added detail and removing the perfect whiteness.\n\
    \n### Teeth\n\nAnother great yet overlooked tool to add realism to a MetaHuman\
    \ is the **Teeth** editor. Just like the eyes, the MHC adds a layer of detail\
    \ and imperfections that make characters more realistic. We can make teeth yellowish\
    \ from realistic staining and/or realistically crooked. We can even recede the\
    \ gums. The MHC has quite a lot of editors for teeth and has all you need to achieve\
    \ a massive variation of looks.\n\nTo begin with, it’s a good idea to ensure you\
    \ are in a reasonably well-lit environment, and that you open the jaw of your\
    \ character to get a better idea of how your changes look when editing the teeth.\
    \ For the latter, there is a handy **Jaw ****Open** slider.\n\nLooking at *Figure\
    \ 2**.23*, straight off the bat, we can see that Glenda has great teeth. They\
    \ are completely uniform, perfectly white, with no signs of plaque or any other\
    \ issues:\n\n![Figure 2.23: Teeth before ](image/B17878_02_23.jpg) \n\nFigure\
    \ 2.23: Teeth before\n\nThere are two ways to go about editing:\n\n*   In *Figure\
    \ 2**.23*, the red box indicates the visual way to edit. By holding your mouse\
    \ on each of the gray circles, you’ll see what each slider edits – for example,\
    \ **Tooth Length**, **Tooth Spacing**, and so on.\n\n*   However, another way\
    \ to do this is using the drop-down list from where it says **Tooth Length**,\
    \ as shown in *Figure 2**.24*:\n\n![Figure 2.24: Editing teeth ](image/B17878_02_24.jpg)\
    \ \n\nFigure 2.24: Editing teeth\n\nI recommend using the drop-down list for editing\
    \ as it gives you a slider for the intensity of the edit, plus another slider\
    \ for variation, all while reminding you of what you are editing, such as **Tooth\
    \ Length**, **Tooth Spacing**, **Overbite**, and so on. The visual diagram of\
    \ the teeth has sliders, as shown in the upper left of *Figure 2**.25*, but they\
    \ only allow you to edit the intensity of any given parameter, such as **Overbite**.\n\
    \nMuch of the realism can be found by making subtle changes to teeth such as plaque\
    \ color and adding subtle variations with little intensity to everything in the\
    \ drop-down menu, again featured in *Figure 2**.25*. Working the drop-down menu,\
    \ sliders, and swatches under the **TEETH** diagram will give you the greatest\
    \ amount of control:\n\n![Figure 2.25: The Teeth editor ](image/B17878_02_25.jpg)\
    \ \n\nFigure 2.25: The Teeth editor\n\nWith that said, if you are making dramatic\
    \ changes, it is worth previewing the **Face ROM** component as the teeth do have\
    \ a significant impact on the overall expression of your character. A major consideration\
    \ would be how much gum or overbite exists. An overbite can give the impression\
    \ of an undeveloped jaw and a naive expression, while an underbite can give the\
    \ impression of an over-developed jaw and a stern expression. Of course, a lot\
    \ of this is subjective but certainly worth consideration.\n\nTo wrap up this\
    \ section on teeth, I would like to emphasize how important teeth editing is to\
    \ overall character design and that it is frequently overlooked.\n\nWe’ll now\
    \ move on and look at a feature that doesn’t apply to all character design but\
    \ is a powerful editing tool within the MHC: makeup, and applying it to characters.\n\
    \n### Makeup\n\nThe MHC has some very remarkable makeup features that work in\
    \ tandem with the skin tone of the character. The **Makeup** editor has been divided\
    \ into four tabs:\n\n*   **FOUNDATION**\n\n*   **EYES**\n\n*   **BLUSH**\n\n*\
    \   **LIPS**\n\nLet’s take a look at each of these now.\n\n#### Foundation\n\n\
    As mentioned earlier, the **Makeup** editor works in tandem with the skin tone\
    \ of your character. Earlier, under the **Skin** editor, we were given the option\
    \ to edit the overall skin tone. This information is factored into the makeup\
    \ **FOUNDATION** editor to provide the user with a color palette suitable to the\
    \ skin tone you originally chose for your character. This is to simulate real-world\
    \ makeup decisions. For example, the makeup selection of a Caucasian would be\
    \ different from the makeup selection of an African American.\n\nAs you can see\
    \ in *Figure 2**.26*, the palette available to us for the foundation is very much\
    \ limited to the character’s skin tone; this is to provide the best result:\n\n\
    ![Figure 2.26: With no foundation makeup ](image/B17878_02_26.jpg) \n\nFigure\
    \ 2.26: With no foundation makeup"
  fmt: '

    We have covered a lot of ground with the skin editor and at this point, I would
    like to remind you that additional editing of the skin can always be done within
    Unreal Engine. But for now, in the next section, we will discuss the eyes.


    ### Eyes


    The MHC has an incredibly powerful eye-editing tool. What’s also very special
    about it is that some of the eye tools are editable within Unreal. For example,
    if you wanted to animate the size of the iris, you can do that within Unreal.


    Here, we will take a look at the following attributes of the `Eyes` editor:


    *   `PRESETS`

    *   `IRIS`

    *   `SCLERA`


    Let’s take a look at these now.


    #### Presets


    As shown in Figure 2.19, the MHC has some great presets to choose from, providing
    an array of different brown, blue, and green eyes to choose from:


    ![Figure 2.19: Eye presets ](image/B17878_02_19.jpg)


    Figure 2.19: Eye presets


    For the most part, you can work with the default presets, but you may want to
    go into specific details (which we will go through in the next section) where
    you can achieve very specific yet natural looks, from healthy eyes to very unhealthy
    eyes.


    > **Note**

    >

    > Before you start editing your character’s eyes, take advantage of the lighting
    tools to ensure you have the best lighting available. The eyes have quite a lot
    of detail, so you’ll need to be up and close and at a LOD of 0, thus rendering
    in the highest quality.


    #### Iris


    Let’s take a look at the `IRIS` panel next, which you can see in Figure 2.20.
    Without going too far into detail regarding what everything does, the first choice
    you have is to edit the right, left, or both eyes. `Base Color` allows you to
    edit the color closest to the iris, while `Detail Color` allows you to edit the
    outside area of the eye closest to the limbus. You also get to edit the `Color
    Balance` and `Color Balance Smoothness` options and choose from nine iris patterns:


    ![Figure 2.20: IRIS ](image/B17878_02_20.jpg)


    Figure 2.20: IRIS


    Just like with skin tones, the `IRIS` editing function is limited to natural looks.
    However, you can get some pretty wild-looking effects by pushing the limbus darkness
    and aiming for high saturation in your color editors.


    #### Sclera


    While the `IRIS` editor is a great tool, much of the realism comes out of the
    `SCLERA` tab, as you can see in Figure 2.21. Effectively, this involves editing
    the white of the eye. While you can do a lot with the `Tint` option, which is
    a balance between blue and yellow, the `Brightness` option in conjunction with
    `Tint` is very powerful in terms of aging the eye:


    ![Figure 2.21: SCLERA ](image/B17878_02_21.jpg)


    Figure 2.21: SCLERA


    The MHC also brings a lot of detail with the `Vascularity` slider. You can see
    this clearly when you start rotating the veins. These are very powerful tools
    for extreme close-ups, and it is worth spending some time on them before exporting
    your MetaHuman. CGI characters commonly lose realism when their eyes are too bright
    and perfect.


    Let’s look at an example of combining the `Eyes` editing options. Most of the
    editing in Figure 2.22 was done using the `SCLERA` editing tab except for lightening
    up the limbus in the `IRIS` editing tab and reducing the color in both the base
    and detail color pickers:


    ![Figure 2.22: Separate eye editing example ](image/B17878_02_22.jpg)


    Figure 2.22: Separate eye editing example


    My goal here was to simply age the eye. By and large, I went a little too far
    and poor Glenda should see a doctor at this stage. However, the result of her
    right eye does look a little more realistic simply because of the added detail
    and removing the perfect whiteness.


    ### Teeth


    Another great yet overlooked tool to add realism to a MetaHuman is the `Teeth`
    editor. Just like the eyes, the MHC adds a layer of detail and imperfections that
    make characters more realistic. We can make teeth yellowish from realistic staining
    and/or realistically crooked. We can even recede the gums. The MHC has quite a
    lot of editors for teeth and has all you need to achieve a massive variation of
    looks.


    To begin with, it’s a good idea to ensure you are in a reasonably well-lit environment,
    and that you open the jaw of your character to get a better idea of how your changes
    look when editing the teeth. For the latter, there is a handy `Jaw Open` slider.


    Looking at Figure 2.23, straight off the bat, we can see that Glenda has great
    teeth. They are completely uniform, perfectly white, with no signs of plaque or
    any other issues:


    ![Figure 2.23: Teeth before ](image/B17878_02_23.jpg)


    Figure 2.23: Teeth before


    There are two ways to go about editing:


    *   In Figure 2.23, the red box indicates the visual way to edit. By holding your
    mouse on each of the gray circles, you’ll see what each slider edits – for example,
    `Tooth Length`, `Tooth Spacing`, and so on.

    *   However, another way to do this is using the drop-down list from where it
    says `Tooth Length`, as shown in Figure 2.24:


    ![Figure 2.24: Editing teeth ](image/B17878_02_24.jpg)


    Figure 2.24: Editing teeth


    I recommend using the drop-down list for editing as it gives you a slider for
    the intensity of the edit, plus another slider for variation, all while reminding
    you of what you are editing, such as `Tooth Length`, `Tooth Spacing`, `Overbite`,
    and so on. The visual diagram of the teeth has sliders, as shown in the upper
    left of Figure 2.25, but they only allow you to edit the intensity of any given
    parameter, such as `Overbite`.


    Much of the realism can be found by making subtle changes to teeth such as plaque
    color and adding subtle variations with little intensity to everything in the
    drop-down menu, again featured in Figure 2.25. Working the drop-down menu, sliders,
    and swatches under the `TEETH` diagram will give you the greatest amount of control:


    ![Figure 2.25: The Teeth editor ](image/B17878_02_25.jpg)


    Figure 2.25: The Teeth editor


    With that said, if you are making dramatic changes, it is worth previewing the
    `Face ROM` component as the teeth do have a significant impact on the overall
    expression of your character. A major consideration would be how much gum or overbite
    exists. An overbite can give the impression of an undeveloped jaw and a naive
    expression, while an underbite can give the impression of an over-developed jaw
    and a stern expression. Of course, a lot of this is subjective but certainly worth
    consideration.


    To wrap up this section on teeth, I would like to emphasize how important teeth
    editing is to overall character design and that it is frequently overlooked.


    We’ll now move on and look at a feature that doesn’t apply to all character design
    but is a powerful editing tool within the MHC: makeup, and applying it to characters.


    ### Makeup


    The MHC has some very remarkable makeup features that work in tandem with the
    skin tone of the character. The `Makeup` editor has been divided into four tabs:


    *   `FOUNDATION`

    *   `EYES`

    *   `BLUSH`

    *   `LIPS`


    Let’s take a look at each of these now.


    #### Foundation


    As mentioned earlier, the `Makeup` editor works in tandem with the skin tone of
    your character. Earlier, under the `Skin` editor, we were given the option to
    edit the overall skin tone. This information is factored into the makeup `FOUNDATION`
    editor to provide the user with a color palette suitable to the skin tone you
    originally chose for your character. This is to simulate real-world makeup decisions.
    For example, the makeup selection of a Caucasian would be different from the makeup
    selection of an African American.


    As you can see in Figure 2.26, the palette available to us for the foundation
    is very much limited to the character’s skin tone; this is to provide the best
    result:


    ![Figure 2.26: With no foundation makeup ](image/B17878_02_26.jpg)


    Figure 2.26: With no foundation makeup

