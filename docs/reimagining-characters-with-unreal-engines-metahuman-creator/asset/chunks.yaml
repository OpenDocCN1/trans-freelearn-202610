    **盗版**：如果你在互联网上发现任何形式的非法拷贝，请提供地址或网站名称，我们将不胜感激。请通过 **copyright@packt.com** 联系我们，并附上相关链接。


    **如果你有兴趣成为作者**：如果你在某个主题上有专长，并有兴趣撰写或参与编写书籍，请访问 [authors.packtpub.com](http://authors.packtpub.com)


    # 分享你的想法


    读完 *《使用 Unreal Engine 的 MetaHuman Creator 重塑角色》* 后，我们非常期待听到你的想法！请 [点击此处直接前往亚马逊评论页面](https://packt.link/r/1-801-81772-3)
    为本书分享反馈。


    你的评论对我们和技术社区都很重要，将帮助我们确保提供高质量的内容。


