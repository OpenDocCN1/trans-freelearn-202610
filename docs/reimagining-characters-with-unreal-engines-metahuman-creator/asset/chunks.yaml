- raw: "*   **EFFECTS**: While not a common panel to use, **EFFECTS** does come in\
    \ useful if you’ve found that you’re just not getting the desired result using\
    \ **TUNING** alone. An example would be where the **Mouth Smile Left** is appearing\
    \ just a little too high on the CGI face. To fix this, we can manually add an\
    \ **Offset** with a negative value to counteract that, illustrated in *Figure\
    \ 9**.20*:\n\n![Figure 9.20: Effects ](image/B17878_09_20.jpg) \n\nFigure 9.20:\
    \ Effects\n\n*   **STREAM**: This is a shortcut to the **STREAMING** panel, which\
    \ we also covered earlier.\n\nIdeally, all of these buttons are green in the top\
    \ menu. If they go between yellow and green, the settings are effective but not\
    \ optimal. If they go into the red, then you’ll certainly need to make changes.\n\
    \nThe most common circumstance that results in a red button is when we move our\
    \ face out of the webcam’s range. The face tracking is generally very good but\
    \ once we go out of frame, it can’t track and will immediately give us a red tracking\
    \ button. The second most common red button instance is low frame rates, which\
    \ in turn will result in a poor track.\n\nBefore we go into any more detail on\
    \ any of these additional panels, especially **TUNING**, we must first go back\
    \ to Unreal to make sure we are getting live facial capture data, and we will\
    \ also need to jump into our MetaHumans Blueprint. The reason for this is that\
    \ it is better to view how our MetaHuman is responding to the facial tracking\
    \ and make our adjustments with that information rather than looking at the default\
    \ head inside Faceware.\n\n# Enabling Live Link to receive Faceware data\n\nBefore\
    \ we jump into the MetaHuman Blueprint, let’s just double-check to see that Live\
    \ Link is receiving a signal.\n\nTo open up the Live Link plugin inside Unreal,\
    \ go to **Window**, then **Virtual Production**, and choose **Live Link**, as\
    \ per *Figure 9**.21*:\n\n![Figure 9.21: Opening Live Link ](image/B17878_09_21.jpg)\
    \ \n\nFigure 9.21: Opening Live Link\n\nIn *Figure 9**.22*, you can see that I’ve\
    \ clicked on **Faceware Live Link** to select the incoming signal from Faceware.\
    \ Make a note of the **Port Number**: it is the same port number I was able to\
    \ detect in the Faceware **STREAMING** panel, as per *Figure 9**.14*. If the Live\
    \ Link port number is different to the Faceware port number, you can change it\
    \ in either application to match.\n\n![Figure 9.22: Live Link Port Number ](image/B17878_09_22.jpg)\
    \ \n\nFigure 9.22: Live Link Port Number\n\nNow, with the **STREAM TO CLIENT**\
    \ enabled in Faceware, we should have a good face track working. A good face track\
    \ means we get no red warnings. It also means that we are receiving a live signal\
    \ in Live Link, giving us a green button, as shown in *Figure 9**.22*. Once we\
    \ get that green button, we are good to start working with the MetaHuman Blueprint.\n\
    \n# Editing the MetaHuman Blueprint\n\nTo start, we need to create a new Level\
    \ Sequence because we’re going to add our MetaHuman Blueprint to the Level Sequencer:\n\
    \n1.  Just like in the last chapter, drag and drop the MetaHuman Blueprint from\
    \ the Outliner and onto the Level Sequencer. Again, you’ll notice that a **Metahuman\\\
    _ControlRig** and a **Face\\_ControlBoard\\_CtrlRig **have been created. Delete\
    \ both of these as we don’t need them.\n\n2.  Next, click on **Face** from the\
    \ Blueprint in the Level Sequencer. In *Figure 9**.23*, you’ll see how the **Details**\
    \ panel has given me parameters for me to edit, namely the **Animation Mode**\
    \ and **Anim Class**.\n\n![Figure 9.23: Selecting Face from the MetaHuman Blueprint\
    \ ](image/B17878_09_23.jpg) \n\nFigure 9.23: Selecting Face from the MetaHuman\
    \ Blueprint\n\nEnsure **Animation Mode** is set to **Use Animation Blueprint**\
    \ and that **Anim Class** is set to **ABP\\_Metahuman\\_Faceware\\_LiveLink Face**.\n\
    \n1.  Now test your facial motion capture data by hitting the **Play** button\
    \ at the top of the Unreal Engine interface. This will run a game simulation where\
    \ you can see the facial animation come to life.\n\nMake sure to hit **Stop**\
    \ to stop the simulation. You need to do this before you can start the **Take\
    \ Recorder**, which we use in the next section.\n\n# Recording a session with\
    \ a Take Recorder\n\nIn the previous section, I mentioned running a simulation\
    \ to test the facial motion capture data. That’s fine for just doing quick tests,\
    \ but for animation production, we need to record the motion capture data, and\
    \ to do that, Epic Games have created the Take Recorder. This will allows us to\
    \ record mocap sessions and play them back from the Level Sequencer.\n\nTo use\
    \ a Take Recorder instead, follow these steps:\n\n1.  Go to **Take Recorder**\
    \ tab and add the MetaHuman Blueprint. You can see in *Figure 9**.24* that I’ve\
    \ done this by clicking the **\\+ Source** option, and then **From Actor**.\n\n\
    ![Figure 9.24: Adding the MetaHuman Blueprint to the Take Recorder ](image/B17878_09_24.jpg)\
    \ \n\nFigure 9.24: Adding the MetaHuman Blueprint to the Take Recorder\n\n1. \
    \ Still in the **Take Recorder** tab, add another asset by using the **From LiveLink**\
    \ option, as per *Figure 9**.25*. Here, we are going to add **animationValues**.\
    \ The values referred to here are all the ARKit data values as they are being\
    \ streamed from Faceware, such as rotation of the head, blinking of eyes, and\
    \ opening of mouth.\n\n![Figure 9.25: Adding animationValues to the Take Recorder\
    \ ](image/B17878_09_25.jpg) \n\nFigure 9.25: Adding animationValues to the Take\
    \ Recorder\n\n1.  Note the **Take** number. In my case, it’s **Scene\\_1** **Take\
    \ 18**. Whenever we want to play back a take, it is convenient to know in advance\
    \ which take was the good take.\n\n2.  Hit the **Record** button on the **Take\
    \ Recorder** (yes, it’s the big red button!).\n\n3.  Run the simulation again\
    \ by pressing **Play**. Your animation is coming to life again as you stream from\
    \ Faceware into Unreal.\n\n4.  Hit **Stop** on the **Take Recorder** and note\
    \ the new **Take** number.\n\n5.  In order to play back the take we just captured,\
    \ we first need to change the Animation Mode. Select **Face** to edit the **Animation\
    \ Mode**. Then change the mode from **Animation Blueprint** to **Use animation\
    \ Asset**, as per *Figure 9**.26*:\n\n![Figure 9.26: Changing the Animation Mode\
    \ to Use Animation Asset ](image/B17878_09_26.jpg) \n\nFigure 9.26: Changing the\
    \ Animation Mode to Use Animation Asset\n\nWe change the animation mode to **Use\
    \ an Asset** when we want to play back a take and revert to **Blueprint** when\
    \ we want to record a take.\n\nIn the next section, we will go back to the Level\
    \ Sequencer in order to play back our facial motion capture recording.\n\n# Importing\
    \ a take into the Level Sequencer\n\nTo play back our facial capture take, we\
    \ need to add it to the Level Sequencer. To do this, follow these steps:\n\n1.\
    \  Click on the **+** icon next to **Face** to add the animation. In the context\
    \ menu, go to **Animation** and run a search for your most recent take. In my\
    \ case, I am looking for take 19, as shown in *Figure 9**.27*:\n\n![Figure 9.27:\
    \ Adding the Animation Asset to the Face as a track ](image/B17878_09_27.jpg)\
    \ \n\nFigure 9.27: Adding the Animation Asset to the Face as a track\n\n1.  Click\
    \ on the desired track and it will automatically populate the **Face** track inside\
    \ the Level Sequencer, as per *Figure 9**.28*:\n\n![Figure 9.28: Adding the Take\
    \ Recorder track to the Level Sequencer ](image/B17878_09_28.jpg) \n\nFigure 9.28:\
    \ Adding the Take Recorder track to the Level Sequencer\n\n1.  To play back the\
    \ animation, click anywhere in the timeline where the playhead is and hit the\
    \ *spacebar*.\n\nNow we have added the Motion Capture data directly into the Level\
    \ Sequencer. However, that is raw data and, in all likelihood, it will need a\
    \ little editing. In the next section, we will look at some of the MetaHuman controls\
    \ that we can take advantage of to further push the creative control of our characters.\n\
    \n# Baking and editing facial animation in Unreal"
  fmt: '

    # Faceware Panels: EFFECTS and STREAM


    *   **EFFECTS**: While not a common panel to use, `EFFECTS` does come in useful
    if you''ve found that you''re just not getting the desired result using `TUNING`
    alone. An example would be where the `Mouth Smile Left` is appearing just a little
    too high on the CGI face. To fix this, we can manually add an `Offset` with a
    negative value to counteract that, illustrated in *Figure 9.20*:


    ![Figure 9.20: Effects](image/B17878_09_20.jpg)


    Figure 9.20: Effects


    *   **STREAM**: This is a shortcut to the `STREAMING` panel, which we also covered
    earlier.


    Ideally, all of these buttons are green in the top menu. If they go between yellow
    and green, the settings are effective but not optimal. If they go into the red,
    then you''ll certainly need to make changes.


    The most common circumstance that results in a red button is when we move our
    face out of the webcam''s range. The face tracking is generally very good but
    once we go out of frame, it can''t track and will immediately give us a red tracking
    button. The second most common red button instance is low frame rates, which in
    turn will result in a poor track.


    Before we go into any more detail on any of these additional panels, especially
    `TUNING`, we must first go back to Unreal to make sure we are getting live facial
    capture data, and we will also need to jump into our MetaHumans Blueprint. The
    reason for this is that it is better to view how our MetaHuman is responding to
    the facial tracking and make our adjustments with that information rather than
    looking at the default head inside Faceware.


    # Enabling Live Link to Receive Faceware Data


    Before we jump into the MetaHuman Blueprint, let''s just double-check to see that
    Live Link is receiving a signal.


    To open up the Live Link plugin inside Unreal, go to `Window` > `Virtual Production`
    > `Live Link`, as per *Figure 9.21*:


    ![Figure 9.21: Opening Live Link](image/B17878_09_21.jpg)


    Figure 9.21: Opening Live Link


    In *Figure 9.22*, you can see that I''ve clicked on `Faceware Live Link` to select
    the incoming signal from Faceware. Make a note of the `Port Number`: it is the
    same port number I was able to detect in the Faceware `STREAMING` panel, as per
    *Figure 9.14*. If the Live Link port number is different to the Faceware port
    number, you can change it in either application to match.


    ![Figure 9.22: Live Link Port Number](image/B17878_09_22.jpg)


    Figure 9.22: Live Link Port Number


    Now, with `STREAM TO CLIENT` enabled in Faceware, we should have a good face track
    working. A good face track means we get no red warnings. It also means that we
    are receiving a live signal in Live Link, giving us a green button, as shown in
    *Figure 9.22*. Once we get that green button, we are good to start working with
    the MetaHuman Blueprint.


    # Editing the MetaHuman Blueprint


    To start, we need to create a new Level Sequence because we''re going to add our
    MetaHuman Blueprint to the Level Sequencer:


    1.  Just like in the last chapter, drag and drop the MetaHuman Blueprint from
    the `Outliner` and onto the `Level Sequencer`. Again, you''ll notice that a `Metahuman_ControlRig`
    and a `Face_ControlBoard_CtrlRig` have been created. Delete both of these as we
    don''t need them.


    2.  Next, click on `Face` from the Blueprint in the `Level Sequencer`. In *Figure
    9.23*, you''ll see how the `Details` panel has given me parameters for me to edit,
    namely the `Animation Mode` and `Anim Class`.


    ![Figure 9.23: Selecting Face from the MetaHuman Blueprint](image/B17878_09_23.jpg)


    Figure 9.23: Selecting Face from the MetaHuman Blueprint


    Ensure `Animation Mode` is set to `Use Animation Blueprint` and that `Anim Class`
    is set to `ABP_Metahuman_Faceware_LiveLink Face`.


    3.  Now test your facial motion capture data by hitting the `Play` button at the
    top of the Unreal Engine interface. This will run a game simulation where you
    can see the facial animation come to life.


    Make sure to hit `Stop` to stop the simulation. You need to do this before you
    can start the `Take Recorder`, which we use in the next section.


    # Recording a Session with a Take Recorder


    In the previous section, I mentioned running a simulation to test the facial motion
    capture data. That''s fine for just doing quick tests, but for animation production,
    we need to record the motion capture data, and to do that, Epic Games have created
    the `Take Recorder`. This will allow us to record mocap sessions and play them
    back from the `Level Sequencer`.


    To use a `Take Recorder` instead, follow these steps:


    1.  Go to the `Take Recorder` tab and add the MetaHuman Blueprint. You can see
    in *Figure 9.24* that I''ve done this by clicking the `+ Source` option, and then
    `From Actor`.


    ![Figure 9.24: Adding the MetaHuman Blueprint to the Take Recorder](image/B17878_09_24.jpg)


    Figure 9.24: Adding the MetaHuman Blueprint to the Take Recorder


    2.  Still in the `Take Recorder` tab, add another asset by using the `From LiveLink`
    option, as per *Figure 9.25*. Here, we are going to add `animationValues`. The
    values referred to here are all the ARKit data values as they are being streamed
    from Faceware, such as rotation of the head, blinking of eyes, and opening of
    mouth.


    ![Figure 9.25: Adding animationValues to the Take Recorder](image/B17878_09_25.jpg)


    Figure 9.25: Adding animationValues to the Take Recorder


    3.  Note the `Take` number. In my case, it''s `Scene_1 Take 18`. Whenever we want
    to play back a take, it is convenient to know in advance which take was the good
    take.


    4.  Hit the `Record` button on the `Take Recorder` (yes, it''s the big red button!).


    5.  Run the simulation again by pressing `Play`. Your animation is coming to life
    again as you stream from Faceware into Unreal.


    6.  Hit `Stop` on the `Take Recorder` and note the new `Take` number.


    7.  In order to play back the take we just captured, we first need to change the
    `Animation Mode`. Select `Face` to edit the `Animation Mode`. Then change the
    mode from `Animation Blueprint` to `Use Animation Asset`, as per *Figure 9.26*:


    ![Figure 9.26: Changing the Animation Mode to Use Animation Asset](image/B17878_09_26.jpg)


    Figure 9.26: Changing the Animation Mode to Use Animation Asset


    We change the animation mode to `Use an Asset` when we want to play back a take
    and revert to `Blueprint` when we want to record a take.


    In the next section, we will go back to the `Level Sequencer` in order to play
    back our facial motion capture recording.


    # Importing a Take into the Level Sequencer


    To play back our facial capture take, we need to add it to the `Level Sequencer`.
    To do this, follow these steps:


    1.  Click on the `+` icon next to `Face` to add the animation. In the context
    menu, go to `Animation` and run a search for your most recent take. In my case,
    I am looking for take 19, as shown in *Figure 9.27*:


    ![Figure 9.27: Adding the Animation Asset to the Face as a track](image/B17878_09_27.jpg)


    Figure 9.27: Adding the Animation Asset to the Face as a track


    2.  Click on the desired track and it will automatically populate the `Face` track
    inside the `Level Sequencer`, as per *Figure 9.28*:


    ![Figure 9.28: Adding the Take Recorder track to the Level Sequencer](image/B17878_09_28.jpg)


    Figure 9.28: Adding the Take Recorder track to the Level Sequencer


    3.  To play back the animation, click anywhere in the timeline where the playhead
    is and hit the `spacebar`.


    Now we have added the Motion Capture data directly into the `Level Sequencer`.
    However, that is raw data and, in all likelihood, it will need a little editing.
    In the next section, we will look at some of the MetaHuman controls that we can
    take advantage of to further push the creative control of our characters.


    # Baking and Editing Facial Animation in Unreal

