    \ with multiple animations available for retargeting ](image/B17878_05_27.jpg)\
    \ \n\nFigure 5.27: IK Retargeter with multiple animations available for retargeting\n\
    \nBecause my new animations have been set to use the Mixamo skeleton upon import,\
