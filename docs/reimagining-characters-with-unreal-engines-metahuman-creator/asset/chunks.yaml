  fmt: '

    In this chapter, we are going to look at another way to make changes to our character''s
    pose to fix minor issues, such as an arm colliding with the torso of the MetaHuman,
    but will also look at how we can refine the motion of the character. For this,
    we will use the `Level Sequencer`, which is the tool we use for animating anything
    in Unreal Engine, and in many ways, works like a timeline in a video editing application.


    So, in this chapter, we will cover the following topics:


    *   Introducing the Level Sequencer

    *   Creating a Level Sequencer and importing our character Blueprint

    *   Adding the retargeted animation to the character Blueprint

    *   Adding and editing the Control Rig

    *   Adding a camera to the Level Sequencer

    *   Rendering a test animation from the Level Sequencer


    # Technical requirements


    In terms of computer power, you will need the technical requirements detailed
    in [*Chapter 1*](#B17878_01.xhtml#_idTextAnchor015) and the MetaHuman plus the
    Unreal Engine Mannequin that we imported into UE5 in [*Chapter 2*](#B17878_02.xhtml#_idTextAnchor027).
    Both of these will need to be saved in the same project in UE and you will need
    to have UE running for this chapter.


    For this chapter, you will also need to have access to the motion capture data
    that you just retargeted in [*Chapter 6*](#B17878_06.xhtml#_idTextAnchor084).


    # Introducing the Level Sequencer


    Until now, you''ve only been able to preview your animation either within the
    character Blueprint or within the viewport using the `Play` button. The `Play`
    button is effectively simulating gameplay, which is purely for an interactive
    experience.


    The `Level Sequencer` can be used in gameplay, but for the purpose of this book,
    we want to focus on using the `Level Sequencer` to make the most of our motion
    capture animation. A `Level Sequencer` is a timeline within our level where we
    can control our animations. It is similar to any other timeline in an editing
    program, except that instead of adding video clips, we add elements to our scene,
    and then apply animatable attributes.


    When using Unreal Engine for animation, anything you want animated needs to be
    added to a `Level Sequencer`, including lights, cameras, actors, vehicles, and
    even audio, and you can have more than one `Level Sequencer` in any given project.


    The beauty of the `Level Sequencer` is that it allows you to only focus on the
    animated objects, and also allows us to effectively tweak animation by adding
    independent keyframes without being overwhelmed by all the keyframes that come
    with the motion capture data. Using it, we can make changes to the motion capture
    animation without having to depend on getting absolutely perfect takes when working
    with a motion capture solution such as DeepMotion or motion capture library files
    such as Mixamo.


    In the next section, we''ll go through the process of getting a character into
    a `Level Sequencer`.


    # Creating a Level Sequencer and importing our character Blueprint


    So, let''s get started with creating a `Level Sequencer` (there isn''t a lot to
    it).


    First, you need to right-click anywhere within your `Content` folder; in my case,
    I did just that within my `MetaHumans` folder, which you can see in *Figure 7.1*.
    Then, go to `Animation`, and then click on `Level Sequencer`.


    ![Figure 7.1: Creating a Level Sequencer ](image/B17878_07_01.jpg)


    Figure 7.1: Creating a Level Sequencer


    With the `Level Sequencer` created, you''ll see a `Level Sequencer` clapper icon
    in the `Content` folder. Double-click on the `Level Sequencer` icon to open it.
    You will see an empty `Sequencer` as per *Figure 7.2*:


    ![Figure 7.2: An empty Level Sequencer ](image/B17878_07_02.jpg)


    Figure 7.2: An empty Level Sequencer


    In order to animate using the `Level Sequencer`, you need to add an actor. An
    actor can be pretty much anything that you want to animate. Once an actor is added
    to a `Sequencer`, an animation track is created.


    Because we want to animate our MetaHuman character, we will need to add the MetaHuman
    Blueprint as our animation track. To do this, simply click on `+ Track` and then
    `Actor To Sequencer`:


    ![Figure 7.3: Adding an Actor to the Sequencer ](image/B17878_07_03.jpg)


    Figure 7.3: Adding an Actor to the Sequencer


    In *Figure 7.3*, you can see a list of actors that are available to add as tracks.
    At the very top of the actor list is `BP_Glenda`, which is my MetaHuman character.
    Click on your MetaHuman Blueprint to import it into the `Level Sequencer` as an
    animation track.


    Once you add the Blueprint to the `Sequencer`, you will get two tracks: one for
    the body and one for the face. As you can see from *Figure 7.4*, each of these
    tracks has a `Control Rig`. Initially, the `Face` Rig should be selected, which
    will reveal a yellow interface on the viewport with controls to animate the face
    (although we won''t be looking at these).


    ![Figure 7.4: Adding the MetaHuman Blueprint ](image/B17878_07_04.jpg)


    Figure 7.4: Adding the MetaHuman Blueprint


    The other rig available to us is the `Body` Rig. If you select the `Body` track
    in the `Sequencer`, the rig will become visible in the viewport, now demonstrated
    in *Figure 7.5*:


    ![Figure 7.5: The MetaHuman Control Rig ](image/B17878_07_05.jpg)


    Figure 7.5: The MetaHuman Control Rig


    At this point, you have just gained a vast amount of control over your MetaHuman
    Character in terms of animation. Whether you are a seasoned animator or a novice,
    I recommend you experiment with these animation controls. In particular, experiment
    with rotating any of the colored components of the `MetaHuman Control Rig` as
    per *Figure 7.5*, before you move on to the next section.


    With the character Blueprint added to the `Level Sequencer` as an actor, we are
    now ready to bring in some motion capture data, which we will do in the next section.


    # Adding the retargeted animation to the character Blueprint


    Before we continue to our DeepMotion animation into the `Sequencer`, I need to
    warn you that we are going to take a step that will seem somewhat counter-intuitive:
    we will delete the `Control Rigs` for both the body and the face only to end up
    adding a body `Control Rig` back in again. In this chapter, our aim is to add
    the motion capture data and then add an additional track of keyframe animation.
    However, to do that, we need to have the motion capture data baked into the `control
    rig` and then we need to have another `control rig` for additional animation.


    So, let''s delete the two current `Control Rigs`. You can do this by simply clicking
    on `Metahuman Control Rig` and `Face_ControlBoard_CtrlRig` in the `Sequencer`
    and hitting `Delete` on your keyboard.


    Now, with `Body` selected in the `Sequencer`, click on the `+` icon, and then
    from `Animation`, search for `Retargeted`. This should call up the retargeted
    data created by the `IK Retargeter` from the previous chapter, which you can see
    in *Figure 7.6*:


    ![Figure 7.6: Adding the retargeted mocap data ](image/B17878_07_06.jpg)


    Figure 7.6: Adding the retargeted mocap data


    Once you have selected the retargeted mocap, it will appear on the timeline within
    the `Sequencer`.


    Note


    The animation will start at wherever your `play head` is on the timeline. The
    `play head` is the position on the `sequencer` timeline that it''s currently paused
    at, and the frame the animation will start from. In *Figure 7.6*, my `play head`
    is at the frame numbered `0115` (indicated by the red arrow).


    When you have imported the mocap animation as a track, you can reposition this
    track to start at any time by simply dragging the track left or right. The track
    itself includes the title of the animation displayed within it. In *Figure 7.7*,
    you can see the animation track under the horizontal blue line.


    ![Figure 7.7: The animation track ](image/B17878_07_07.jpg)


    Figure 7.7: The animation track

    '
  trans: '

    在本章中，我们将探讨另一种更改角色姿势以修复小问题的方法，例如手臂与 MetaHuman 躯干发生碰撞，但也将探讨如何优化角色的动作。为此，我们将使用 `Level
    Sequencer`（关卡序列器），这是我们在 Unreal Engine 中为任何事物制作动画所用的工具，在许多方面，它的工作原理类似于视频编辑应用程序中的时间轴。


    因此，在本章中，我们将涵盖以下主题：


    *   介绍 Level Sequencer（关卡序列器）

    *   创建 Level Sequencer 并导入我们的角色 Blueprint

    *   将重定向动画添加到角色 Blueprint

    *   添加和编辑 Control Rig（控制绑定）

    *   向 Level Sequencer 添加摄像机

    *   从 Level Sequencer 渲染测试动画


    # 技术要求


    就计算机性能而言，您将需要 *第 1 章* 中详述的技术要求，以及我们在 *第 2 章* 中导入到 UE5 的 MetaHuman 和 Unreal Engine
    模型。这两者都需要保存在 UE 的同一个项目中，并且您需要为本章运行 UE。


    对于本章，您还需要能够访问您在 *第 6 章* 中刚刚重定向的动作捕捉数据。


    # 介绍 Level Sequencer


    直到现在，您只能在角色 Blueprint 内部或视口中使用 `Play`（播放）按钮来预览动画。`Play` 按钮实际上是在模拟游戏过程，这纯粹是为了交互式体验。


    `Level Sequencer` 可用于游戏过程中，但为了本书的目的，我们想专注于使用 `Level Sequencer` 来充分利用我们的动作捕捉动画。`Level
    Sequencer` 是我们关卡中的一个时间轴，我们可以在其中控制动画。它类似于编辑程序中的任何其他时间轴，不同之处在于我们不是添加视频片段，而是向场景中添加元素，然后应用可动画化的属性。


    在使用 Unreal Engine 进行动画制作时，您想要制作动画的任何内容都需要添加到 `Level Sequencer` 中，包括灯光、摄像机、Actor、车辆，甚至音频，并且您可以在任何给定的项目中拥有多个
    `Level Sequencer`。


    `Level Sequencer` 的优势在于它允许您仅关注动画对象，还允许我们通过添加独立关键帧来有效地微调动画，而不会被动作捕捉数据自带的所有关键帧淹没。使用它，我们可以更改动作捕捉动画，而不必依赖于在使用
    DeepMotion 等动作捕捉解决方案或 Mixamo 等动作捕捉库文件时获得绝对完美的镜头。


    在下一节中，我们将介绍将角色放入 `Level Sequencer` 的过程。


    # 创建 Level Sequencer 并导入我们的角色 Blueprint


    那么，让我们开始创建 `Level Sequencer`（这没什么复杂的）。


    首先，您需要在 `Content`（内容）文件夹中的任意位置右键单击；在我的示例中，我就在我的 `MetaHumans` 文件夹中执行了此操作，您可以在*图
    7.1* 中看到。然后，转到 `Animation`（动画），并单击 `Level Sequencer`。


    ![图 7.1：创建 Level Sequencer ](img/B17878_07_01.jpg)


    图 7.1：创建 Level Sequencer


    创建 `Level Sequencer` 后，您将在 `Content` 文件夹中看到一个 `Level Sequencer` 场记板图标。双击 `Level
    Sequencer` 图标将其打开。您将看到一个空的 `Sequencer`，如*图 7.2* 所示：


    ![图 7.2：空的 Level Sequencer ](img/B17878_07_02.jpg)


    图 7.2：空的 Level Sequencer


    为了使用 `Level Sequencer` 制作动画，您需要添加一个 Actor。Actor 可以是您想要制作动画的几乎任何东西。一旦将 Actor 添加到
    `Sequencer`，就会创建一个动画轨道。


    因为我们想为 MetaHuman 角色制作动画，所以我们需要将 MetaHuman Blueprint 作为我们的动画轨道添加进去。为此，只需单击 `+ Track`（+
    轨道），然后选择 `Actor To Sequencer`（Actor 到 Sequencer）：


    ![图 7.3：向 Sequencer 添加 Actor ](img/B17878_07_03.jpg)


    图 7.3：向 Sequencer 添加 Actor


    在*图 7.3* 中，您可以看到可作为轨道添加的 Actor 列表。Actor 列表的最顶端是 `BP_Glenda`，这是我的 MetaHuman 角色。单击您的
    MetaHuman Blueprint 将其作为动画轨道导入 `Level Sequencer`。


    将 Blueprint 添加到 `Sequencer` 后，您将获得两条轨道：一条用于身体，一条用于面部。正如您从*图 7.4* 中看到的，这些轨道中的每一条都有一个
    `Control Rig`。最初，应该选中 `Face`（面部）Rig，这将在视口中显示一个带有面部动画控件的黄色界面（尽管我们不会研究这些）。


    ![图 7.4：添加 MetaHuman Blueprint ](img/B17878_07_04.jpg)


    图 7.4：添加 MetaHuman Blueprint


    另一个可用的绑定是 `Body`（身体）Rig。如果您在 `Sequencer` 中选择 `Body` 轨道，该绑定将在视口中变得可见，如*图 7.5* 所示：


    ![图 7.5：MetaHuman Control Rig ](img/B17878_07_05.jpg)


    图 7.5：MetaHuman Control Rig


    此时，您在动画方面刚刚获得了对 MetaHuman 角色的大量控制权。无论您是经验丰富的动画师还是新手，我都建议您尝试这些动画控件。特别是，在进入下一节之前，尝试旋转
    `MetaHuman Control Rig` 的任意彩色组件，如*图 7.5* 所示。


    将角色 Blueprint 作为 Actor 添加到 `Level Sequencer` 后，我们现在准备导入一些动作捕捉数据，这将在下一节中完成。


    # 将重定向动画添加到角色 Blueprint


    在我们继续将 DeepMotion 动画导入 `Sequencer` 之前，我需要警告您，我们将采取一个看似有些违反直觉的步骤：我们将删除身体和面部的 `Control
    Rig`，最后却又要添加一个身体 `Control Rig`。在本章中，我们的目标是添加动作捕捉数据，然后添加一个额外的关键帧动画轨道。然而，要做到这一点，我们需要将动作捕捉数据烘焙到
    `control rig` 中，然后我们需要另一个 `control rig` 用于额外的动画。


    那么，让我们删除这两个当前的 `Control Rig`。您可以通过在 `Sequencer` 中单击 `Metahuman Control Rig` 和
    `Face_ControlBoard_CtrlRig`，然后按键盘上的 `Delete` 键来执行此操作。


    现在，在 `Sequencer` 中选中 `Body`，单击 `+` 图标，然后从 `Animation` 中搜索 `Retargeted`。这应该会调用上一章中由
    `IK Retargeter` 创建的重定向数据，您可以在*图 7.6* 中看到：


    ![图 7.6：添加重定向的动捕数据 ](img/B17878_07_06.jpg)


    图 7.6：添加重定向的动捕数据


    一旦您选择了重定向的动捕数据，它将出现在 `Sequencer` 的时间轴上。


    > **注意**

    >

    > 动画将从您的 `play head`（播放头）所在的时间轴位置开始播放。`play head` 是 `sequencer` 时间轴上当前暂停的位置，也是动画开始的帧。在*图
    7.6* 中，我的 `play head` 位于编号为 `0115` 的帧（由红色箭头指示）。


    当您将动捕动画作为轨道导入后，只需向左或向右拖动轨道，即可重新定位该轨道以在任意时间开始。轨道本身包含其中显示的动画标题。在*图 7.7* 中，您可以看到水平蓝线下方的动画轨道。


    ![图 7.7：动画轨道 ](img/B17878_07_07.jpg)


    图 7.7：动画轨道

    '
