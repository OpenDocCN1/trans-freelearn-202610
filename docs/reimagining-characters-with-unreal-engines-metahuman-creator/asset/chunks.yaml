    # Hair and Grooming


    Saying that, depending on your character''s distance from the camera, you also
    may get away with a lower render quality setting, which will allow for a faster
    rendering time.


    In addition to scalp hair, the `MHC` also provides solutions for eyebrows, eyelashes,
    mustaches, and beards. We will discuss these elements now. As we go through each
    of these options, we''ll see that there are a lot of similarities in terms of
    what''s available to us for editing. For the most part, it''s just color, roughness,
    and salt and pepper.


    ## Head


    The `Head` editor provides us with all the available tools to edit head hair,
    as shown in Figure 2.33. Unlike many other character creation tools, the `MHC`
    provides a physics dynamics solution within Unreal. In short, this means that
    hair will move realistically and interact with objects such as characters'' shoulders
    and respond to factors such as gravity and wind. The shorter the hair, the less
    obvious the hair dynamics:


    ![Figure 2.33: Head hair presets](image/B17878_02_33.jpg)


    Figure 2.33: Head hair presets


    In Figure 2.34, you can see that, apart from choosing dozens of presets, there
    isn''t much in terms of editing other than choosing what hairstyle you want from
    the preset menu.


    For the Glenda example, I have retained the gray preset but found that I had to
    alter the `Color` option before I was able to edit both `Roughness` and `Salt
    & Pepper`. `Roughness` is perfect for introducing a matte or shiny hair look,
    while `Salt & Pepper` is for adding or reducing gray hair.


    In Figure 2.34, you can see just how detailed the hair can be for close-ups. In
    this example, we can see individual strands of hair:


    ![Figure 2.34: Individual hair strands are visible](image/B17878_02_34.jpg)


    Figure 2.34: Individual hair strands are visible


    Like we had for the makeup editor, we can also choose between `PRESET` and `CUSTOM`.
    You''ll see a drop-down menu under `PRESET`, as shown in Figure 2.35, allowing
    us to keep within a `Neutral` palette or `Deep` and `Vibrant` palettes. If you
    choose `CUSTOM`, you get a much wider color gamut to choose from:


    ![Figure 2.35: Head hair presets](image/B17878_02_35.jpg)


    Figure 2.35: Head hair presets


    The thumbnails containing the warning icons are presets with limited `LODs`. You
    can see these icons on the bottom right of the preset thumbnails in Figure 2.35;
    the warning says that **This MetaHuman uses grooms currently in development**,
    **only displayed at LODs 0 & 1**. This means that it can only offer a display
    of no `LOD`, which is the maximum strand-based hair rendering, and a `LOD` value
    of 1, which is also strand-based. This means that Unreal Engine will try to render
    the hair at maximum quality, regardless of the camera distance. Inside the engine,
    it will hide the hair when a `LOD` value of 2 would normally be engaged. In the
    instances of characters that don''t have a `LOD` level of 2 or more, Unreal Engine
    will render no hair. While not being particularly useful with the warnings here,
    it is good to make a note of these warnings as you will need to force the engine
    to use no `LOD` at all when using a character that has limited `LODs`. Otherwise,
    your character will appear to go bald if the camera is too distant.


    ## Eyebrows


    With the `Eyebrows` panel, as seen in Figure 2.36, we have just a small number
    of presets to choose from (only 11 at the time of writing), with the usual color
    palette and set of parameters to edit that we saw previously, including `Salt
    & Pepper`:


    ![Figure 2.36: Eyebrows](image/B17878_02_36.jpg)


    Figure 2.36: Eyebrows


    ## Eyelashes


    You''ll notice that apart from the presets available to us, the `Eyelash` parameters
    in Figure 2.37 are identical to those in the `Eyebrows` panel. However, once within
    Unreal Engine, we''ll get a little more editing control over this parameter:


    ![Figure 2.37: Eyelashes](image/B17878_02_37.jpg)


    Figure 2.37: Eyelashes


    ## Mustache


    There''s quite a lot of detail involved in the `Mustache` panel. As you can see
    in Figure 2.38, from what we learned earlier, we can see that it is a spline-based
    hair solution, which gives us the best detail. Just like the previous two editors,
    we have the same parameters to edit with:


    ![Figure 2.38: Mustache](image/B17878_02_38.jpg)


    Figure 2.38: Mustache


    However, unfortunately, in terms of the pattern of hair growth, we are limited
    to just choosing a small selection of presets. Similar to the eyelashes, we do
    have further options to edit once we get the character inside Unreal Engine.


    ## Beard


    Finally, we have the last hair-related editor: the beard. Again, we have several
    great presets to play with, as shown in Figure 2.39, and have the usual parameters
    to edit. Just like the `Scalp Hair` section, the beard will respond well to animation,
    particularly in terms of collision dynamics such as colliding against the upper
    chest realistically:


    ![Figure 2.39: Beard](image/B17878_02_39.jpg)


    Figure 2.39: Beard


    In this section, we covered a lot of the presets that are provided to us concerning
    editing in the `MHC`. Some of these concepts are already familiar to us from when
    we edited the face, such as the color palette''s `LOD`, but we''ve looked at some
    new concepts too, such as briefly touching on hair dynamics. It is worth noting
    that additional editing can be done in Unreal Engine; for example, we can add
    a separate physics solver to get unique animation results from the eyelashes if
    we wished. Generally speaking, we don''t need to do this.


    In the next section, we''ll be covering some new ground as we look at the body.


    # Body


    In the `BODY` section, we can edit the proportions of our character, but we also
    have options to edit clothing and shoes. Let''s look at those now.


    ## Proportions


    First, we need to take a look at the body proportions and the presets that come
    shipped with the `MHC`. We can see these in Figure 2.40:


    ![Figure 2.40: Body proportions](image/B17878_02_40.jpg)


    Figure 2.40: Body proportions


    There are three proportion categories: `SHORT`, `AVERAGE`, `TALL`. In each category,
    there are `Male` and `Female` options. Both of these have three main body types:
    `Mesomorph`, `Endomorph`, and `Ectomorph` (muscular, overweight, and underweight).
    Unlike the face, we aren''t given as much fine-tuning ability (for example, we
    can''t blend between body types).


    Compared to other programs dedicated almost exclusively to character creation,
    such as Character Creator, `MHC` has limitations. It would be unfair to try to
    make a side-by-side comparison because the `MHC`''s focus is on realistic humans,
    whereas programs such as Realusion''s Character Creator allow you to make dramatic
    changes to both physiology and skin type to the extent that you can very easily
    create a character that is way beyond the realm of a human. So, while the limitations
    constrain us to create more human characters, it is still a limitation nonetheless.
    It''s also worth noting that `MHC` is still very much in development, so we''ll
    likely see more features in the future. One example of this is the limitation
    to only create adults with a very finite set of ratios, such as knee to hip, neck
    length, foot size, and so on.


    With all of that said, currently, in `MHC`, there are body types per gender, which
    isn''t too bad. If you take a look at Figure 2.40, where I have selected the `SHORT`
    tab within the `Proportions` editor, you''ll notice three body types per gender:
    thin, medium, and large. Because there are three tabs relating to height – `SHORT`,
    `AVERAGE`, `TALL` – we get nine body types per gender, giving us 18 body types
    in total. Skin weights and cloth dynamics do come into this but they are outside
    the scope of this book.


    Also, you may be wondering about scale. Rescaling characters is perfectly doable
    when inside Unreal Engine, without any negative impact on the functionality of
    the characters.


    ## Tops

