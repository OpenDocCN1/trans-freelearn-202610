  trans: '


    ## 灯光预设


    *   **`Silhouette`**：在角色设计中，一个重要却常被忽视的功能是以剪影形式查看角色。它让我们能在没有颜色、反射和阴影特征干扰的情况下，快速观察角色的形状轮廓。


    *   **`Split`**：虽然类似于 `Studio` 灯光预设，但 `Split` 提供了高对比度，且由于主光的强度，是衡量角色皮肤半透明度的绝佳方式。在此预设中，我们有从高强度主光到完全黑暗的分割。它是同时展示写实感和极端光照、并确定从强光到黑暗的光衰减在写实感和风格上表现的绝佳方式。高强度光照与阴影之间的区域，尤其是在皮肤上，被称为
    `roll-offs`（衰减过渡区），这是摄影师常用的术语。


    *   **`Fireside`**：与 `Split` 类似，我们获得了高对比度，但也得到了火焰典型的渐变衰减和衰减效果。此外，我们还获得了从橙色到深蓝色的火焰典型色调。最重要的是，`Fireside`
    允许用户确定强光的衰减过渡及其如何在面部周围过渡到阴影，以及与 `Split` 预设（会呈现皮肤表面明显的细节）相比，在这种微妙度下皮肤细节是否仍然存在。


    *   **`Moonlight`**：与 `Fireside` 类似，我们看到了生动的色调——在本例中是蓝色的月光。然而，这是一种更强的环境光，且没有来自任何单一角度的强烈光照强度。


    *   **`Tungsten`**：虽然不能完全代表普通钨丝灯的色调，但它确实让我们能看到肤色对钨丝灯的反应。这样的灯光预设可以决定在类似场景下，雀斑的细节会损失或保留多少。


    *   **`Portrait`**：这是一个非常实用的预设，因为它既可作为室内光也可作为室外光，以确定角色皮肤的表现。例如，通过使用 `Left Mouse
    + L` 旋转场景灯光，或使用图 2.16 所示的 `Light Rig Rotation`（灯光装置旋转）滑块，我们可以模拟带有日光的窗户，而不会受到 `Indoor`（室内）灯光预设自带背景图像中的干扰元素影响。


    *   **`Red Lantern`**：与 `Fireside` 类似，我们有强烈的红色色调可供使用，但我们拥有在没有深蓝色背景的情况下看到更高强度的优势。这使我们能够着眼于更具戏剧性的灯光设置进行工作。


    *   **`GR22 Rooftop`**：这是基于图像的光照（IBL）非常有效的用例，但它提供略微阴天的光照。这是一个方便的灯光预设，适用于许多日光场景，因为虽然存在高强度区域，但大部分情况下我们获得的是略微漫射的光线。这种漫射光来自直接光被建筑物和地面表面反射回来，就像在现实世界中一样。


    *   **`Downtown Night`**：这与 `GR22 Rooftop` 非常相似，只是处于夜晚，且纯粹由路灯和汽车等电光源照亮。


    *   **`Underpass Night`**：这与 `Downtown Night` 相似，但空间更狭小。它仅包含固定灯光，结合了色调和强度各异的多个钨丝灯。


    要进一步深入，MHC 有一个背景颜色选项。对于某些灯光预设，你可以看到更改背景颜色产生的强烈影响。例如，你可能想在通用的摄影棚柔光下查看角色外观，但又想看角色置于你为场景构想的特定颜色背景前的效果。在图
    2.17 中，我用 Glenda 角色展示了一些灯光装置效果：


    ![图 2.17：各种灯光示例](img/B17878_02_17.jpg)


    *图 2.17：各种灯光示例*


    ## 相机


    根据图 2.15，默认相机设置为 `Face`（面部）。不过，有几个预设相机角度可供使用键盘快捷键调用：


    *   `1`：`Face`（面部）

    *   `2`：`Body`（身体）

    *   `3`：`Torso`（躯干）

    *   `4`：`Legs`（腿部）

    *   `5`：`Feet`（脚部）

    *   `6`：`Face`（面部）


    或者，你也可以像使用相机预设一样轻松地用鼠标导航。如果你在场景中迷失了方向，一个实用的快捷键是按 `1` 键，使用 `Face` 相机预设回到正视角色头部的视角。


    此外，我们还可以预览多种不同的渲染质量预设，以模拟虚幻引擎中存在的渲染质量设置。


    ## 渲染质量


    在渲染质量方面，MHC 提供了三个选项供选择：


    *   `Medium`（中等，这是默认设置）

    *   `High (ray traced)`（高，光线追踪）

    *   `Epic (ray traced)`（极高，光线追踪）


    如果你选择带有光线追踪设置的最高质量，这不会对你的机器产生任何影响，因为高质量渲染的处理完全在云端完成。然而，此功能是一个有用的指示器，显示你在类似灯光设置下使用最高设置时将获得的结果。


    渲染设置之间的差异很微妙。你可能会注意到发丝下的质量会因你使用的质量而增强。它们的存在仅是为了给你一个指示：如果你提供类似的设置，使用虚幻引擎自带的相应渲染质量设置，你的角色会是什么样子。


    ## 细节层次


    **细节层次** (`LOD`) 是基于一个源对象生成多个网格体和纹理贴图。每个网格体和贴图将包含不同数量的细节。


    `LOD` 的目的是引擎优化。由于游戏引擎的设计原则之一是实时渲染，`LOD` 通过在不需要时减少网格体中的三角面数量或纹理贴图中的像素数量来提供帮助。`LOD`
    基于根据相机距离改变网格体复杂度的原则工作。相机离物体越远，在不破坏真实感错觉的前提下，所需的细节就越少。


    例如，MetaHuman 面部的特写镜头需要尽可能最好的质量。在这种情况下，我们需要查看原始网格体和纹理贴图。一般来说，MHC 的原始网格体约为 35,000
    个三角面，由宽度高达 8,000 像素的纹理贴图组成。如果不是必要，渲染这种数据将是巨大的资源浪费。


    一个查看 `LOD` 对角色效果如何的好练习是：前往视口并通过 `Face` 相机观察。你可以通过简单地按键盘上的 `1` 来实现。这将给你一个角色的特写。从那里，你可以从
    `LOD 0` 一直到 `LOD 7` 选择各种 `LOD`。


    起初，你不会注意到 `LOD 0` 和 `LOD 1` 之间有太大区别，但一旦降到 `LOD 5`、`LOD 6` 和 `LOD 7`，你会注意到几何体和纹理贴图质量都有显著下降。你可以在图
    2.18 中看到这一变化：


    ![图 2.18：LOD 0 到 7](img/B17878_02_18.jpg)


    *图 2.18：LOD 0 到 7*


    我们可以通过使用 `Far`（远景）相机进一步推演这一点；你可以通过按键盘上的 `6` 来实现。不幸的是，这是我们在 MHC 中能将相机拉远的最远距离。然而，通过在
    `LOD 6` 和 `LOD 7` 之间切换，我们可以看到差异。这是因为 `LOD 6` 和 `LOD 7` 设计用于相机距离更远时使用。


    在此视图下，如果你在 `LOD 3` 和 `LOD 4` 之间切换，不会看到太大区别。因此，显示 `LOD 0`（约 35,000 个三角面和 8K 纹理贴图）显然是资源浪费。没有
    `LOD`，计算机永远无法处理多个角色，更不用说人群了。


    当涉及 MetaHuman 和虚幻引擎时，这一过程在很大程度上是自动化的，但当我们把角色带入虚幻引擎时，我们将讨论 `LOD`，特别是针对头发的 `LOD`。


    '
