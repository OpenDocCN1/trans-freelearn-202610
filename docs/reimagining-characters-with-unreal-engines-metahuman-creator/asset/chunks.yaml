- raw: "We’ve covered a lot of ground in this chapter. We’ve covered some key concepts\
    \ regarding Blueprints in Unreal, what they are, and what they can be used for.\
    \ We’ve done some basic editing of both Unreal’s Mannequin character and our own\
    \ MetaHuman character so that they can effectively speak to each other by setting\
    \ the translation targeting to **Skeleton** for both. We’ve also briefly discussed\
    \ IK and how that solution works with our characters.\n\nIn the next chapter,\
    \ we will jump back into Blueprints to retarget the animation from one character\
    \ to the next and explore ways to fix any minor yet common problems. We will create\
    \ IK Rigs for both the Mannequin character and our MetaHuman and use an IK Retargeter\
    \ to export the animation data onto our character.\n\n# 4\n\n# Retargeting Animations\n\
    \nIn the previous chapter, we were introduced to Blueprints and conducted some\
    \ basic editing to the MetaHuman Blueprint and the Mannequin character Blueprint\
    \ so that they shared some common settings.\n\nIn this chapter, you will be introduced\
    \ to a new set of tools that we can use to retarget the animation files that come\
    \ with the Mannequin onto our MetaHuman character: the IK Rig tool and the IK\
    \ Retargeter tool.\n\nSo, in this chapter, we will cover the following topics:\n\
    \n*   What is an IK Rig?\n\n*   Creating an IK Rig\n\n*   Creating the IK chains\n\
    \n*   Creating an IK Retargeter\n\n*   Importing more animation data\n\n# Technical\
    \ requirements\n\nTo complete this chapter, you will need the technical requirements\
    \ detailed in [*Chapter 1*](#B17878_01.xhtml#_idTextAnchor015), and the MetaHuman\
    \ plus the Unreal Engine Mannequin that we imported into UE5 in [*Chapter 2*](#B17878_02.xhtml#_idTextAnchor027).\n\
    \n# What is an IK Rig?\n\nWell, to answer that question, we actually have to ask\
    \ two questions:\n\n*   What is a rig?\n\n*   What is IK?\n\nLet’s answer them\
    \ now.\n\n## What is a rig?\n\nIn 3D animation production, a **rig** is a simplified\
    \ means of controlling a character’s movement, tailored for use by animators.\
    \ Instead of the animator manipulating the character’s bones, a rig provides handles\
    \ that the animator can quickly identify and select. Many 3D software applications\
    \ come with rigs that are designed for people and animals. In animation studios,\
    \ rigs are designed at varying levels of complexity depending on how complex the\
    \ animation is. Ultimately, the purpose of a rig is to simplify the process of\
    \ animation. In this chapter, we will take advantage of these simplified rigs\
    \ for the purpose of applying animation data to them.\n\nThe MetaHuman comes with\
    \ a built-in rig for character animation called an IK Rig. In fact, it comes with\
    \ an IK Control Rig that allows animators to take full control of all the animation\
    \ of a MetaHuman character. As you can see in *Figure 4**.1*, a rig is a simplified\
    \ way of manipulating bones:\n\n![Figure 4.1: MetaHuman IK Control Rig ](image/B17878_04.01.jpg)\
    \ \n\nFigure 4.1: MetaHuman IK Control Rig\n\nSo, now that we understand what\
    \ a rig is, let’s look at what IK means.\n\n## What is IK?\n\nTo answer this question,\
    \ we need to understand that in character animation, we use bones. These bones\
    \ have a distinctive relationship with one another in terms of how they move;\
    \ if we want to phrase this in a slightly more technical way, these bones have\
    \ a distinctive relationship in terms of how their kinetic relationship is defined.\
    \ These bones exist within a hierarchy of bones, and how they move depends on\
    \ whether the hierarchy has **Forward Kinematics** (**FK**) or **Inverse ****Kinematics**\
    \ (**IK**).\n\nWhen it comes to human bones, very few can move on all axes and\
    \ no human bones have the freedom to move 360 degrees on any axis. However, unlike\
    \ real human bones, computer-generated bones are very simple in their shape and\
    \ can be displayed as simple lines, cylinders, spheres, pyramids, or capsules.\
    \ Regardless of their shape, they all contain one or two pivot points that determine\
    \ the point of rotation for the bone. In addition to the point of rotation, it\
    \ is also possible for us to define what axis the bones rotate on and what axis\
    \ they don’t. Let’s look at *Figure 4**.2*, which demonstrates how bones are visualized\
    \ in UE5. By selecting any bone, we are presented with a gizmo that allows us\
    \ to edit the rotation of each bone; however, using this for animating is cumbersome,\
    \ as it is difficult to make a selection or see what we are doing.\n\n![Figure\
    \ 4.2: A Mannequin bone system in Unreal ](image/B17878_04.02.jpg) \n\nFigure\
    \ 4.2: A Mannequin bone system in Unreal\n\nLet’s think about our shoulder joints\
    \ as an example. We know that we can swing our arms around in a particular direction,\
    \ but we soon meet resistance when we try to move in other directions. That resistance\
    \ in terms of joints is known as a **constraint**.\n\nNow, see *Figure 4**.3*\
    \ for an illustration of a shoulder joint as it appears on a MetaHuman; you can\
    \ see that we don’t have to worry about rotational constraint:\n\n![Figure 4.3:\
    \ Shoulder joint ](image/B17878_04.03.jpg) \n\nFigure 4.3: Shoulder joint\n\n\
    You’ll also note that it isn’t very clear which bone is selected, which demonstrates\
    \ that working with bones directly isn’t very practical when it comes to animation.\n\
    \nRegardless, let’s get back to the point about what FK and IK actually are. In\
    \ order to understand FK, first, we need to understand the simple relationship\
    \ between parent and child (we use this analogy a lot in 3D graphics and robotics).\
    \ *A child will go wherever the parent goes, but the parent doesn’t have to go\
    \ where the **child goes.*\n\n### FK\n\nLet’s apply the parent-child relationship\
    \ concept to joints, exploring FK by taking the example of the shoulder. Moving\
    \ or rotating the hand joint has no effect on the shoulder joint. In fact, we\
    \ would have to rotate the shoulder joint first, followed by the elbow joint,\
    \ to affect the position of the hand to get the desired result. In other words,\
    \ to define the position and rotation of the hand (the end effector), we must\
    \ calculate the position and rotation of the shoulder and elbow first.\n\nIn *Figure\
    \ 4**.4*, I have demonstrated that by rotating **Joint 01** (as seen on the left),\
    \ I can then rotate **Joint 02** (as seen on the right):\n\n![Figure 4.4: FK ](image/B17878_04.04.jpg)\
    \ \n\nFigure 4.4: FK\n\nHere, we are working out the position of the hand by applying\
    \ rotations to **Joint 01** (the parent) and **Joint 02** (the child). This is\
    \ called FK because we are solving the problem of motion by calculating the rotation\
    \ of the parent first, so we solve this problem in the direction of *parent **to\
    \ child*.\n\n### IK\n\nIK gets its name because it solves the problem of motion\
    \ by calculating the rotation of the child first instead. Taking the example of\
    \ the shoulder again, the IK solution can determine the rotation of the shoulder\
    \ joint when the user or artist is affecting the position of the hand end effector\
    \ (the child in the hierarchy). Therefore, it’s the opposite of FK, solving the\
    \ problem of motion in the *child-to-parent* direction.\n\nIn *Figure 4**.5*,\
    \ I have demonstrated that I only need to move the hand, which, in turn, automatically\
    \ works out the rotation of **Joint 01** plus the rotation and subsequent position\
    \ of **Joint 02**:\n\n![Figure 4.5: IK ](image/B17878_04.05.jpg) \n\nFigure 4.5:\
    \ IK\n\nIn essence, IK is much more dynamic than FK and works out a lot of the\
    \ problems for us. With IK, we can effectively move a hand of a character as if\
    \ it were a real person’s hand, and all the rest of the bones will follow realistically.\n\
    \nNote\n\nIt is worth noting that switching between IK and FK solutions is common\
    \ practice in animation. The use of IK is often used for the majority of work,\
    \ as it adds a certain amount of automation to the workflow, whereas FK is put\
    \ to use for subtle changes and fine-tuning."
