- raw: "# Who this book is for\n\nThis book is written by a filmmaker for filmmakers.\
    \ To understand some of the more difficult concepts introduced in the book, you\
    \ should have a reasonable understanding of the filmmaking process, particularly\
    \ 3D animation. If you’ve dabbled with 3D character animation and have read at\
    \ least one book on the subject, you should have no problem understanding anything\
    \ written in the book. If you don’t have any prior learning, don’t worry – you\
    \ can still progress to the end without getting stuck.\n\nUltimately, this is\
    \ a step-by-step guide on how to create an animated MetaHuman with Unreal. It\
    \ covers various techniques that you can apply to your own ideas and designs.\n\
    \n# What this book covers\n\nIn [*Chapter 1*](#B17878_01.xhtml#_idTextAnchor015),\
    \ *Getting Started with Unreal*, you will learn what Unreal is, what a MetaHuman\
    \ is, and how to set up Unreal Engine on your computer.\n\nIn [*Chapter 2*](#B17878_02.xhtml#_idTextAnchor027),\
    \ *Creating Characters in the MetaHuman Interface*, we will examine all the major\
    \ features of the Metahuman Creator Interface, how to edit a MetaHuman, and also\
    \ how to download and export your own MetaHuman.\n\nIn [*Chapter 3*](#B17878_03.xhtml#_idTextAnchor046),\
    \ *Diving into the MetaHuman Blueprint*, we will learn what a Blueprint is and\
    \ how to use them in relation to MetaHumans.\n\nIn [*Chapter 4*](#B17878_04.xhtml#_idTextAnchor059),\
