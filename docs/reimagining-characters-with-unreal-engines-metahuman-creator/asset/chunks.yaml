- raw: "2.  In the Command Prompt, type **ipconfig**.\n\n3.  You’ll see a list of\
    \ all the IP configurations. On the top line you’ll see the **IPv4 **address,\
    \ which should be similar to the following:\n\n    ```\n    192.168.100.155\n\
    \    ```\n\nMake a note of that number, which will be unique to your machine.\n\
    \n1.  Next, open up the Live Link Face app.\n\n2.  On the top left of the screen,\
    \ you will see a cog icon, as illustrated in *Figure 8**.6*:\n\n![Figure 8.6:\
    \ Clicking on the settings icon ](image/B17878_01_06.jpg) \n\nFigure 8.6: Clicking\
    \ on the settings icon\n\n1.  Pressing the cog will bring you to the **Settings**\
    \ page. When there, click on the **Live ****Link** option:\n\n![Figure 8.7: Clicking\
    \ on Live Link iPhone ](image/B17878_01_07.jpg) \n\nFigure 8.7: Clicking on Live\
    \ Link iPhone\n\n1.  Now click on **Target **and type in the IP address of your\
    \ computer.\n\n![Figure 8.8: Clicking on the IP target ](image/B17878_01_08.jpg)\
    \ \n\nFigure 8.8: Clicking on the IP target\n\nOnce you have set your IP address\
    \ in the app, you need to switch over to Unreal Engine again to see whether you\
    \ are receiving a signal.\n\n1.  In Unreal Engine, go to **Window**, then **Virtual\
    \ Production**, and click on **Live Link **where you will be brought to the following\
    \ Live Link interface:\n\n![Figure 8.9: The Live Link interface ](image/B17878_01_09.jpg)\
    \ \n\nFigure 8.9: The Live Link interface\n\nIn *Figure 8**.9*, you can see that\
    \ Live Link has automatically picked up a signal. It recognizes that the type\
    \ of signal is **Apple AR Face Tracking** and shows the name of the subject that\
    \ the signal is coming from, in my case, **iPhone**. As it happens, **iPhone**\
    \ is just the name that I gave to the phone after I purchased it. Whatever you\
    \ have called your phone, that name will appear under the subject name.\n\nAlso\
    \ in *Figure 8**.9*, next to where it says **iPhone**, you’ll see that under **Role**\
    \ it says** Basic** and to the right of that is a yellow dot. This dot indicates\
    \ the status of the signal, which can be interpreted as follows:\n\n*   If the\
    \ dot is red, it means there is no data coming in, which could be caused by improper\
    \ configurations such as the Live Link Face app being closed or the phone being\
    \ off\n\n*   The yellow dot indicates that both applications are pinging each\
    \ other but no active ARKit data exists\n\n*   A green dot indicates that there\
    \ is ARKit data coming into Unreal Engine from the Live Link Face app\n\nKnowing\
    \ that both apps are effectively speaking to each other means that we can go on\
    \ to the next step and configure our MetaHuman to receive data.\n\n# Configuring\
    \ and testing the MetaHuman Blueprint\n\nWe must now tell the MetaHuman Blueprint\
    \ to receive data from Live Link. As it happens, this is very simple:\n\n1.  Open\
    \ up the MetaHumans Blueprint from within your **Content** folder.\n\n2.  In the\
    \ **Components** tab on the left-hand side, click on the top of the hierarchy\
    \ where it says **BP\\_ (your MetaHuman Name)**. In my case it is **BP\\_Glenda**.\
    \ This will let you see the settings you need to edit in the **Details** panel,\
    \ as per *Figure 8**.10*:\n\n![Figure 8.10: Creating a Level Sequencer ](image/B17878_01_10.jpg)\
    \ \n\nFigure 8.10: Creating a Level Sequencer\n\n1.  Go to the **Llink Face Subject**\
    \ drop-down list and select the name of your phone. Again, in my case, it’s just\
    \ called **iPhone** but your phone may have a more specific name.\n\n2.  Also,\
    \ tick the **Llink Face Head** option, which enables head movement data to be\
    \ accepted by the Blueprint.\n\n![Figure 8.11: Enabling the Llink Face Head option\
    \ ](image/B17878_01_11.jpg) \n\nFigure 8.11: Enabling the Llink Face Head option\n\
    \nNext, click on **Face** within the **Components** tab. Then, in the **Details**\
    \ panel, go to **Animation**, as seen in *Figure 8**.12*:\n\n![Figure 8.12: Changing\
    \ Animation Mode and Anim Class ](image/B17878_01_12.jpg) \n\nFigure 8.12: Changing\
    \ Animation Mode and Anim Class\n\n1.  Here, ensure that **Disable Post Process\
