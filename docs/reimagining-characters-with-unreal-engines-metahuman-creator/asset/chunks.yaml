- raw: 'As much as stock motion libraries such as Mixamo are great, you will need
    to have your own bespoke animation to give you creative freedom. Even if a solution
    such as DeepMotion’s Animate 3D may not be as good as the results that you would
    get from expensive motion capture suits, it will be much better than the compromises
    you will make using library stock motion.


    So, in this chapter, we will cover the following topics:


    *   Introducing DeepMotion


    *   Preparing our video footage


    *   Uploading our video clip to DeepMotion


    *   Exploring DeepMotion’s Animation Settings


    *   Downloading the DeepMotion Motion Capture File


    *   Importing the DeepMotion Motion Animation into Unreal


    *   Retargeting the DeepMotion Motion Capture


    *   Fixing position misalignment issues


    # Technical requirements


    In terms of computer power, you will need the technical requirements detailed
    in [*Chapter 1*](#B17878_01.xhtml#_idTextAnchor015), and the MetaHuman character
    plus the Unreal Engine Mannequin that we imported into UE5 in [*Chapter 2*](#B17878_02.xhtml#_idTextAnchor027).
    Both of these will need to be saved in the same project in UE, and you will need
    to have UE running for this chapter.


    You will also need a stable internet connection, as we will be uploading a MetaHuman
    preview mesh and a video file, and downloading numerous animation assets. You
    will need a video camera – a webcam, smartphone, or a professional video or digital
    cinecamera will all do, but note that there aren’t benefits for video with greater
    resolution than HD.


    # Introducing DeepMotion


    Until recently, bespoke motion capture solutions required expensive equipment
    and expensive software; think about movies like *Avatar*, *The Lord of the Rings*,
    or *Pirates of the Caribbean*, where performers have to wear motion capture suits
    with either reflective balls or checker markers with infrared sensors. This technology
    was only viable for large studios that could make such an investment, and as a
    result, independent studios and freelance artists had to make do with just motion
    capture libraries, such as Mixamo, as we have already discussed.


    Recently, this has changed as more and more affordable solutions have become available
    to artists. In my research for this book, I worked with a number of motion capture
    tools specifically with cost in mind. Because **motion capture** (**mocap**) suits
    and infrared sensors and all that fancy gear are just too expensive for most of
    us, I looked at DeepMotion’s Animate 3D.


    DeepMotion’s Animation 3D is an example of a **markerless mocap solution**. This
    involves a process where a video of human performance is captured with a video
    camera with no special suit or markers required. The video file is analyzed by
    software that recognizes and tracks each body part. With machine learning aiding
    this process, the solution is able to utilize libraries or motion data to avoid
    errors. In addition, **inverse kinematics** is also utilized to further refine
    the process. This technology is constantly improving, and with machine learning
    being a key feature, the rate of progress is very fast indeed.


    In the case of DeepMotion, the online tool allows us to upload a video of our
    performance and processes the motion capture for us to use in Unreal (or any other
    compatible platform). Though this process includes machine learning, fortunately
    for us, DeepMotion takes care of all that.


    In the next section, we will dive into the nuts and bolts of how to record videos
    effectively.


    # Preparing our video footage


    Before we go over to DeepMotion, there are some key factors we need to know with
    regard to recording our performances on video. Let’s look at them now:


    *   *Camera quality and position*: DeepMotion is capable of working with low-end
    cameras such as webcams or old smartphones, all the way up to high-end cinema
    cameras, so long as the picture is sharp and steady and has a reasonably high
    frame rate. Many lower-end cameras have a minimum frame rate of 30 fps, but you
    will get a better result on fast-moving actors if you use a higher frame rate.


    Also, ideally, the camera should be stationary because the software works out
    the performer’s motion based on a fixed floor position. The ideal position of
    the camera is about 2 meters from the performer.


    *   *High-contrast filming*: As this markerless mocap solution is tracking pixels
    rather than sensors, we need to make it as easy as possible for the software to
    differentiate the background from the performer. This is why we need to have a
    high contrast between the two. If you plan to shoot against a dark background,
    such as a curtain, be sure to have your performer wear bright colors, and vice
    versa. Also, loose clothing can cause problems as, often, the clothing will be
    tracked; for example, if the performer is wearing very baggy sleeves, it’s difficult
    for the tracker to tell the difference between an arm and a sleeve.


    *   *Keep head to toes in shot at all times*: Although DeepMotion can do a good
    job at working out the motion of a character just from video of the waist up,
    as a rule of thumb, it is better to get more data than you need, so ensure that
    you capture head to toe shots of your performer as much as you can. Capturing
    the performer’s whole body is also important as, even if your performer’s feet
    or head go out of shot for a second, it can cause poor results throughout the
    rest of the motion-capturing process.


    With that said, if your intention is to capture the full body performance, then
    video capturing the full body is a must.


    *   *Calibration time*: Make sure that you have your performer in shot for a few
    seconds before and after the performance, preferably in a T-shaped pose and facing
    the camera. This gives DeepMotion time to align its skeleton to the performer’s
    body before, rather than during, the performance.


    *   *Occlusion*: It is rare in video footage that we find performers not covering
    one part of their body with another. Typically, they have their arms in front
    of their body, but because DeepMotion can determine the skeleton’s spine position,
    in such a scenario, that type of occlusion isn’t a problem.


    However, when the body goes in front of a limb, there can be issues. Taking hands
    as an example, if and when they go behind the body or the head, DeepMotion has
    to guess where the hands should be because it has no pixels to tell it where the
    hands are. It will either try to guess or apply no animation at all to those problem
    areas.


    Also, occlusion can occur by objects that are between the performer and the camera,
    which can cause issues. For example, a tree branch or lamppost might momentarily
    get in the way but could inadvertently cause a lot more errors than expected.


    Therefore, shooting with anything in the foreground obscuring your performers
    is not recommended.


    *   *Performance speed*: DeepMotion isn’t very good at detecting very fast motion
    in a clip. For example, for someone tap dancing or boxing, the software has a
    hard time keeping up with the rapid foot movement and, instead, gives a very poor
    result. A good rule of thumb is that if you see any motion blur in the video clip,
    it’s not likely to give you a good result. Be sure to play the clip in slow motion
    to properly analyze it.


    *   *File size*: If you work with professional video file formats, there is no
    benefit other than the ability to shoot at higher frame rates. Compressed or lossy
    video file formats such as MP4 will do the job, and keeping the file size down
    to around 200 MB is best. Larger file sizes take longer to upload and longer to
    get analyzed. While MOV files are accepted, I recommend you use MP4 files instead.'
