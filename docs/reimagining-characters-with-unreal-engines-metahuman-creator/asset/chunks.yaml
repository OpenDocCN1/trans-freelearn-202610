    As mentioned earlier, there are two ways we can go about editing. We could go
    through `Mannequin`’s folder structure and search for the skeleton Blueprints,
    but we will play it safe and look for the main character Blueprint and navigate
    our way to the skeleton Blueprint from there.


    Moving forward, here are the steps we need to take:


    1. Edit the `Mannequin` skeleton’s retargeting options.

    2. Edit the `MetaHuman` skeleton’s retargeting options.


    So, let’s get started.


    ## Editing the `Mannequin` Skeleton''s Retargeting Options


    In this section, we are going to tell the skeleton of Unreal Engine’s `Mannequin`
    character and our `MetaHuman` character that we are only interested in their rotational
    data.


    Once we’ve added the `Third Person` content pack into the project, we’ll see a
    new folder called `ThirdPersonBP`, so that’s a good start. You can see that in
    Figure 3.8:


    ![Figure 3.8: The ThirdPerson Character Blueprint](image/B17878_03.08.jpg)


    Figure 3.8: The ThirdPerson Character Blueprint


    In the `ThirdPersonBP` folder is another folder labeled `Blueprints`, and within
    that is `ThirdPersonCharacter`, which we need to edit. Double-click the Blueprint
    to open it.


    In the `Components` tab, when clicking on `Mesh (CharacterMesh0)` as per Figure
    3.9, you’ll notice the `Details` panel on the right change. Under `Mesh`, you’ll
    see `Skeletal Mesh`. Double-click on the little thumbnail for `SK_Mannequinn`:


    ![Figure 3.9: Accessing the Skeletal Mesh editor tab](image/B17878_03.09.jpg)


    Figure 3.9: Accessing the Skeletal Mesh editor tab


    This will open an additional tab in the Blueprint that will contain two more tabs,
    as well as a viewport showing `Mannequin` and its skeleton, as shown in Figure
    3.10:


    ![Figure 3.10: Inside SK_Mannequinn](image/B17878_03.10.jpg)


    Figure 3.10: Inside SK_Mannequinn


    The two tabs are as follows:


    * `Asset Details`: Provides us with a lot of options should we want to edit the
    character for which we are repurposing animation. However, we are only interested
    in this character’s rig and the animations that are associated with it.

    * `Skeleton Tree`: Where we want to do most of our editing. This shows us the
    relationship that each bone has with the others. Every bone is connected to `root`.
    If the `root` part moves or rotates, the rest of the bones in the hierarchy will
    move. Bones lowest in the hierarchy will have the least influence.


    In Figure 3.10, in the `Skeleton Tree` tab, you can see that every bone is named,
    from `root` down to `thumb`. What we want to do is make sure that the retargeting
    option is set to the skeleton, but don’t worry, we don’t need to meticulously
    check through each bone. We can do this in four mouse clicks:


    1. Click on the cog.

    2. Select `Show Retargeting Options`.

    3. Right-click on `pelvis`.

    4. Then, left-click on `Recursively Set Translation Retargeting Skeleton`.


    Let me walk you through those steps in more detail. So, click on the cog highlighted
    in Figure 3.11:


    ![Figure 3.11: Show Retargeting Options](image/B17878_03.11.jpg)


    Figure 3.11: Show Retargeting Options


    Under `OPTIONS`, click `Show Retargeting Options`. All we are doing is making
    sure that the hierarchy of the skeleton is being used effectively to drive the
    animation of each bone. Because all the bones are connected in a hierarchy, moving
    one bone can have a chain reaction effect on the whole body naturally. This is
    known as `Inverse Kinematics (IK)`. In some animation data, every bone has animation,
    so the natural hierarchy of the skeleton isn’t very important. For IK animation,
    not all animation, such as rotation and transformation, for every bone is carried
    through; therefore, relying on an IK solution is important.


    We are going to take advantage of the skeletal hierarchy in the next step because
    that is how the `MetaHuman` characters are designed. Because there is a bone hierarchy
    within this skeletal system, we can quickly change the nature of the bones’ translation
    by utilizing a handy retargeting option. In this case, we want to set `Translation`
    to `Skeleton`, starting with the `pelvis` bone.


    Fortunately, there is a fast way to do this. Right-click `pelvis` and choose the
    `Recursively Set Translation Retargeting Skeleton` option, as shown in Figure
    3.12:


    ![Figure 3.12: Recursively Set Translation Retargeting to Skeleton](image/B17878_03.12.jpg)


    Figure 3.12: Recursively Set Translation Retargeting to Skeleton


    You’ve now set all of the bones from `pelvis` to `skeleton` in one click.


    > **Note**: Be sure to hit `Save` in the `Blueprint` tab when you have edited
    the retargeting options.


    In addition to making sure our characters are both using skeletal animation, by
    doing things this way, we are only retargeting the `rotational data`. Put simply,
    this will allow us to retarget the rotation animation of each bone from this character
    and not the `transformation data`. If we copied over the transformation data from
    the original skeleton to the new skeleton, such as a `MetaHumans` skeleton, the
    bones would move disproportionately.


    These issues are most notable when the new character has significant proportional
    differences from the original. For example, if the original skeleton was tall,
    then its bones would have very different transform data from that of a small character.
    Its bones would be longer than its smaller counterpart. While the rotation data
    would be fine, the transform data of the tall character would stretch the small
    character, as it would try to make the bones occupy the same locations in 3D space
    despite the rotational values being relatively correct.


    In Figure 3.13, you can see the correct data transformation. That is to say that
    the three characters all share the same pose without any drastic stretching or
    deforming of the meshes. Had the transformational data been carried from character
    `A` to character `B`, character `B` would be stretched to the same height and
    character `C` would be squashed to the same height as character `A`.


    ![Figure 3.13: Correct translation of motion data](image/B17878_03.13.jpg)


    Figure 3.13: Correct translation of motion data


    If you find that you have successfully managed to get through all these steps
    and have animated your `MetaHuman`, chances are you haven’t followed these steps
    correctly. A common mistake is forgetting to save changes within the Blueprint.


    The next step is to edit the retargeting options for the new skeleton, which is
    our `MetaHumans` character.


    ## Editing the `MetaHuman` Skeleton''s Retargeting Options


    To start editing the `MetaHuman` skeleton''s retargeting options, in your character’s
    Blueprint, click on `Body` in the `Components` tab. Then, in the `Details` tab,
    double-click the thumbnail next to `Skeletal Mesh` under the `Mesh` section. Don’t
    worry if you don’t have an accurate thumbnail of your `MetaHuman` in the same
    way you did with `Mannequin`.


    ![Figure 3.14: Editing the MetaHuman’s retargeting options](image/B17878_03.14.jpg)


    Figure 3.14: Editing the MetaHuman’s retargeting options


    Once you double-click on the thumbnail, you’ll be greeted with the screen shown
    in Figure 3.15 (it’s an identical tab to the one you saw earlier in Figure 3.12
    when you edited the `Mannequin` skeleton). You just need to follow the exact same
    steps as we did in the previous section. So, click on the cog and select `Show
    Retargeting Options`. Then right-click on `pelvis`, and select `Recursively Set
    Translation Retargeting to Skeleton`:


    ![Figure 3.15: Recursively Set Translation Retargeting Skeleton in the MetaHuman
    Blueprint](image/B17878_03.15.jpg)


    Figure 3.15: Recursively Set Translation Retargeting Skeleton in the MetaHuman
    Blueprint


    After this, save the Blueprint. Now, we have edited both the `Mannequin` and `MetaHuman`
    skeletons, retargeting their options so the two can work together.


    ## Summary

