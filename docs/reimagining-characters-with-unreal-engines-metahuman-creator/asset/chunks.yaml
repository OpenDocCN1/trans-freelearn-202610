- raw: "This is what the screen will look like:\n\n![Figure 1.10: Virtual Production\
    \ template ](image/B17878_01.10.jpg) \n\nFigure 1.10: Virtual Production template\n\
    \nNote\n\nIf you happen to have a lower specification machine that doesn’t support\
    \ raytracing, it’s wise to keep **Raytracing** to the default off mode. You can\
    \ always enable it again in **Project Settings** at a later stage.\n\nFrom this\
    \ list, we’re just going to focus on the **Virtual Production** subtemplate. Then,\
    \ we need to choose our new project location and create a project title. For my\
    \ project, I’m going to create a folder titled **Lost Girl** and it will be in\
    \ the D drive. The project folder will be **Lost\\_Girl\\_SC\\_01**. You can name\
    \ your project file whatever you like.\n\nFeel free to save your files to whatever\
    \ directory you wish but be advised that it is best practice to avoid the C drive\
    \ where your operating system is stored.\n\nYou’ll see a splash screen again and\
    \ you will be prompted that the project is loading. This will take a minute or\
    \ two depending on your machine’s specifications. After this, you may get a number\
    \ of popups:\n\n*   You may also get a dialog box just as earlier warning you\
    \ that a plugin isn’t designed to work in UE5 and asking whether you still want\
    \ to proceed. Choose **Yes** if that happens again.\n\n*   You also may get asked\
    \ whether you want to update the project. Choose **Yes**. This will just take\
    \ a second or two to update.\n\n*   Finally, it will ask whether you want to manage\
    \ plugins. You can choose **Yes** and then close down the plugin window if that\
    \ happens. You can also choose **No** and enable the plugins later as you import\
    \ your character into the engine, but I do recommend selecting **Yes** at this\
    \ point.\n\nThat’s it! We now have the engine up and running.\n\n![Figure 1.11:\
    \ The Unreal Engine interface ](image/B17878_01.11.jpg) \n\nFigure 1.11: The Unreal\
    \ Engine interface\n\nNext, it’s time to install Quixel Bridge.\n\n## Installing\
    \ Quixel Bridge\n\nMetaHuman Creator is an online application from Quixel. To\
    \ get that up and running, first, we need to go to their website and download\
    \ the application called Bridge that allows us to launch the MetaHuman Creator\
    \ online application.\n\nThis sounds a little complicated, but the Bridge application\
    \ works like an asset management tool with your account details. For example,\
    \ it will fire up your personal MetaHumans projects and allow you to download\
    \ many other assets, such as Megascans Trees, grass, buildings, and so on while\
    \ keeping tabs on everything you’ve created or downloaded in the past.\n\nThis\
    \ can come in incredibly handy because MetaHumans take up a lot of hard drive\
    \ space, so you get to store your creations in the cloud, which allows you to\
    \ download them wherever you are. In addition, once installed, Bridge also works\
    \ as a plugin within Unreal Engine, making asset management even easier.\n\nSo,\
    \ to get started, complete the following steps:\n\n1.  First, go to the Quixel\
    \ website: www.quixel.com.\n\n2.  Next, click on the **DOWNLOAD BRIDGE** button\
    \ (we don’t even need to log in at this stage):\n\n![Figure 1.12: Downloading\
    \ Quixel Bridge ](image/B17878_01.12.jpg) \n\nFigure 1.12: Downloading Quixel\
    \ Bridge\n\n1.  Once we have downloaded the installer, **Bridge.exe**, run it\
    \ by double-clicking the file.\n\nThis will install and open Bridge automatically\
