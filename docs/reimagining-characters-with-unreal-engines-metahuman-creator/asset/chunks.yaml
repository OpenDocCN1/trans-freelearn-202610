    # Importing and Editing Skeletons


    ## The Character Blueprint Interface


    ![Figure 3.1: The Blueprint inside the Content Browser](image/B17878_03.01.jpg)


    Figure 3.1: The Blueprint inside the Content Browser


    When you double-click on the Blueprint, this will open your character’s Blueprint.
    You will see that the screen is made up of six tabs, as shown in Figure 3.2:


    ![Figure 3.2: The six panels of the character Blueprint](image/B17878_03.02.jpg)


    Figure 3.2: The six panels of the character Blueprint


    ### The Six Panels


    Let’s break down the tabs:


    1.  **`Components`**: This is where we can select what part of the MetaHuman we
    wish to edit. We can also add additional components, such as meshes, cameras,
    and lights to our MetaHuman.


    2.  **`My Blueprint`**: Here, we can see what functional elements are associated
    with our MetaHuman, such as the ARKit setup, which allows for facial motion capture
    to be directed to our character.


    3.  **`Viewport`**: This gives us a view of our character without showing us the
    rest of the level. This comes in handy if we have brought a character into a busy
    scene and wish to inspect or edit our character without the distraction of a busy
    environment.


    4.  **`Construction Script`**: A construction script allows the engine to read
    and write data to the Blueprint regardless of which level we are using. In the
    game world, this is useful, as the construction script can hold data such as character
    health. For the purposes of what we are using our MetaHumans for, we won’t need
    to make any changes to this.


    5.  **`Event Graph`**: The event graph contains important information relating
    to events. An event can be a game starting or the result of pressing a particular
    key on the keyboard. In terms of MetaHumans, the event graph determines what LOD
    values the character should use. For example, if the camera moves far away from
    the character, that is an event that triggers the character to display an LOD
    value greater than 0.


    6.  **`Details`**: This is where we do most of our editing. It is context-sensitive,
    so we will see different information depending on what we have clicked on in the
    `Components` tab. For instance, the body will give us different parameters to
    edit other than the face.


    ### Editing Materials in the Details Panel


    As we just mentioned, when it comes to editing our characters, we do so in the
    `Details` panel by editing various assets. Many of these assets are image files
    but many editors also allow you to further refine your character. In fact, in
    some instances, you are given even greater control over many aspects of your character.
    This additional control can bring even further realism to your character than
    you could have achieved with the MHC alone.


    To see an example of how much extra editing power you have, click on `Face` within
    the `Components` tab and then double-click on one of the `Eye materials` options
    contained in the `Details` tab. Depending on which eye you chose, it would be
    labeled `M_EyeRefractive_Inst_L`.


    Once you’ve opened the material editor for that eye, you can edit certain attributes
    that weren’t available to edit in MHC. For example, you can edit the cloudiness
    of the eye and ambient occlusion within the iris, which adds a lot of depth to
    the eye, as demonstrated in Figure 3.3:


    ![Figure 3.3: Editing the eye material](image/B17878_03.03.jpg)


    Figure 3.3: Editing the eye material


    > **Note**

    >

    > Adding further edits to your character using parameters exclusively available
    in Blueprints won’t affect your original design in MHC. You will always have a
    safe backup copy via Bridge.


    Just as a reminder, the Blueprint acts like a driver and the character subfolders
    act like passengers. While you can access all these components directly through
    the character Blueprint, you can also gain access by diving into the individual
    subfolders; there may be occasions where you’d prefer to have multiple folders
    open at a time, so in many cases, it just comes down to personal preference.


    ## Navigating the Blueprint


    ### Using the Folder Structure


    To show you how to navigate using folders, as seen in Figure 3.4, I have gone
    directly into the `Hoodie` folder and double-clicked on the `Hoodie Material`
    asset to change its color:


    ![Figure 3.4: Further editing done directly within the folder structure](image/B17878_03.04.jpg)


    Figure 3.4: Further editing done directly within the folder structure


    As you can see, there is even greater control of this particular asset than we
    would have gotten from just MHC alone; for example, using the color picker tool
    to change our MetaHuman’s hoodie. You may remember from [*Chapter 2*](#B17878_02.xhtml#_idTextAnchor027),
    *Creating Characters in the MetaHuman Interface*, that we used the MHC color tools
    to make changes.


    ### Navigating Without Folders


    In Figure 3.5, you can see that the same edit is taking place, but we are using
    the character Blueprint to edit the same asset. Both methods are equally effective.


    ![Figure 3.5: Editing a color inside the character Blueprint](image/B17878_03.05.jpg)


    Figure 3.5: Editing a color inside the character Blueprint


    You can see in Figure 3.5 that I followed the following steps:


    1.  I chose `Torso` from the `Components` tab.

    2.  I clicked on the `Material` element slot, which in turn opened `Material Editor`.

    3.  I clicked on the current color, which opened `Color Picker`, allowing me to
    change the color.


    While there are many additional editors within the Blueprints relating to the
    appearance of the characters, they are mostly for refining materials. For the
    most part, the results are subtle, but you can completely change color schemes.


    As daunting as this all looks, rest assured that you will only really be editing
    a tiny section of the Blueprint. At the very least, you will just need to choose
    what kind of animation you want to drive for your character, and for repurposing
    animation from another character, we only need to edit skeletal details.


    It makes sense to get up and running with some body animation first. UE5 comes
    with several starter packs to help us. One of the starter packs is a third-person
    game that comes with a `Mannequin` character that is rigged with a skeleton. It
    also comes with a few animations that we can use to test out our own character.


    For the remainder of this chapter, we will look at Blueprints with the view to
    repurposing the animation from the starter game pack and applying it to our own
    character in the next chapter.


    ## Adding the Mannequin Character


    In this section, we will add our `Mannequin` character to our project. Then, to
    be able to retarget animation from one character to another, the source and target
    characters both have to have skeletons. We will be looking at both of these skeletons
    in the following sections.


    To start, we want to use the skeleton of the `Mannequin` character that comes
    shipped with Unreal. To add it to your project, all you need to do is go to `Content
    Browser`, click on the `+ADD` button, and choose `Add Feature or Content Pack…`:


    ![Figure 3.6: Adding a content pack](image/B17878_03.06.jpg)


    Figure 3.6: Adding a content pack


    Once you’ve clicked on `Add Feature or Content Pack…`, you’ll see a pop-up window
    where you can choose `Third Person` from the `Blueprint` feature tab:


    ![Figure 3.7: Add Content to the Project](image/B17878_03.07.jpg)


    Figure 3.7: Add Content to the Project


    The reason we choose `Third Person` is that it has a full character, including
    a mannequin, in the project, which we can repurpose. Then, click on `Add to Project`.
    This will load the project into your Content Browser.


    You’ll notice that there are now two new folders in your Content Browser: `Mannequin`
    and `Third PersonBP`.


    What we want to do at this stage is edit the `Mannequin` skeleton so that the
    structure, naming convention, and animation method are the same as for our MetaHuman.
    That way, we can repurpose the animation from `Mannequin` and apply it to our
    MetaHuman.

