- raw: "Once you’ve created an IK Retargeter using the **Source\\_DM\\_Happy** rig,\
    \ open it up by double-clicking on it. This will bring up the following interface:\n\
    \n![Figure 6.18: Choosing the target in the IK Retargeter ](image/B17878_06.18..jpg)\
    \ \n\nFigure 6.18: Choosing the target in the IK Retargeter\n\nNow, you want to\
    \ choose the IK target to apply the DeepMotion motion capture to. You can see\
    \ from *Figure 6**.19* that **Source IKRig Asset** is locked but **Target IKRig\
    \ Asset** still has a drop-down list. Choose your MetaHuman target rig; in my\
    \ case, it’s **TARGET\\_meta**.\n\nIt’s at this point that we also have the option\
    \ to choose the appropriate **Target Preview Mesh** too. In my case, the target\
    \ preview mesh is the **Female Medium Overweight** mesh, which is titled **f\\\
    _med\\_ovw\\_body\\_preview\\_mesh**, as per *Figure 6**.19*:\n\nI \n\n![Figure\
    \ 6.19: Target Preview Mesh ](image/B17878_06.19.jpg) \n\nFigure 6.19: Target\
    \ Preview Mesh\n\nAt the bottom of *Figure 6**.19*, under the **Asset Browser**\
    \ tab, you can see that the DeepMotion animation is now available for us to export.\
    \ So, if you are happy with the animation, just click on the green **Export Selected\
    \ ****Animations** button.\n\nAs a reminder, clicking on the **Export Selected\
    \ Animations** button will create an animation file that will now work with your\
    \ MetaHuman character. You will be given the option of where to save the animation\
    \ to choose your **Deepmotion** folder.\n\nNext, add your MetaHuman character\
    \ to your scene by dragging and dropping it from your **Content **folder to your\
    \ viewport. Then, ensure your MetaHuman blueprint is selected in **Outliner**.\n\
    \nAfter that, go to the **Details** panel, select **Body**, and under **Animation\
    \ Mode**, choose **Use Animation Asset**. Run a search for your new retargeted\
    \ animation file and click on it. In *Figure 6**.20*, you can see that I picked\
    \ the **Happy Animation** file from the drop-down list:\n\n![Figure 6.20: Applying\
    \ the animation ](image/B17878_06.20.jpg) \n\nFigure 6.20: Applying the animation\n\
    \nWith your file selected, run **Play** in your viewport and you’ll see your character\
    \ come to life.\n\nNow that you have successfully gone through the whole process\
    \ of creating motion capture data from video and retargeted it to your MetaHuman\
    \ character, we’ll take a look at troubleshooting a common problem in the next\
    \ section.\n\n# Fixing position misalignment issues\n\nIt’s unlikely that your\
    \ animation is going to perfectly match your video, and it’s just as unlikely\
    \ that the retargeting process is going to be smooth sailing either. There’s always\
    \ a slight mismatch between the source and target rigs. One of the most common\
    \ problems is the arm positions, which mostly boils down to the T-pose and the\
    \ A-pose.\n\nAs MetaHumans are set in an A-pose, and our DeepMotion rig was set\
    \ to a **T-Pose**, this is where there’s a problem. In the event that you chose\
    \ **T-Pose** in DeepMotion, there’s a handy little fix that saves you from having\
    \ to go through the download and retargeting process again.\n\nAs you can see\
    \ from *Figure 6**.21*, showing the **IK Retargeter** interface, we can see the\
    \ problem: the source DeepMotion character is in a **T-Pose** and the target MetaHuman\
    \ character is in an **A-Pose**. In this scenario, because of the misalignment,\
    \ the arms will not animate properly and will most likely intersect with the body:\n\
    \n![Figure 6.21: IK Retargeter T-pose versus A-pose ](image/B17878_06.21.jpg)\
    \ \n\nFigure 6.21: IK Retargeter T-pose versus A-pose\n\nThe only option we have\
    \ here is to change the pose of the target, which is the MetaHuman. To do this,\
    \ click on the **Edit Pose** button at the top of the screen, as shown in *Figure\
    \ 6**.22*. This will allow you to rotate the joints of your MetaHuman character\
    \ from within the IK Retargeter:\n\n![Figure 6.22: Edit Pose in the IK Retargeter\
    \ ](image/B17878_06.22.jpg) \n\nFigure 6.22: Edit Pose in the IK Retargeter\n\n\
    I strongly advise that you use rotational snapping, which is highlighted at the\
    \ top-right of *Figure 6**.22*. I found that the difference between the T-pose\
    \ and the A-pose in terms of arm rotation was about 45 degrees. Currently, the\
    \ snapping is set to increments of five degrees; however, you can change that\
    \ to your liking.\n\nThe MetaHuman also has a slight rotation on the elbow joints\
    \ that you will need to straighten to match that of the source; using the snapping\
    \ tool allows you to get a much more uniform result. Be sure to change the angle\
    \ from the front when you make corrections to the elbow joints so that you can\
    \ see what you are doing.\n\nWhen you are happy, click on the **Edit Pose** button\
    \ again. This will allow you to press **Play** again, to view how well the animation\
    \ is retargeted. You can keep going back to fine-tune these adjustments.\n\nYou\
    \ may also find that you have exported the correct pose, but the animation is\
    \ still causing slight issues, particularly with collision. In terms of DeepMotion,\
    \ this could easily be attributed to the fact that you were using preset preview\
    \ meshes as opposed to specific MetaHuman meshes. We will look at how to fix these\
    \ issues in the next chapter.\n\n# Summary\n\nIn this section, we covered how\
    \ we can create our own animation with as little as a single video camera. First,\
    \ we looked at some of the major considerations when it comes to filming, what\
    \ to avoid, and what steps we can take to bring even more accuracy.\n\nThen we\
    \ started using DeepMotion, exploring the various animation settings that it can\
    \ offer us, including some artificial intelligence functionality. We looked at\
    \ some best practices when it comes to these functions and the use of reruns before\
    \ committing to the final animation.\n\nBuilding on what we learned in the previous\
    \ chapters, we once again retargeted our bespoke motion capture and applied it\
    \ to our MetaHuman character, while looking a little more closely at A-poses versus\
    \ T-poses. Finally, we covered an effective workaround for issues arising around\
    \ those poses.\n\nIn the next chapter, we are going to look at the Level Sequencer\
    \ and the Control Rig, and how to further refine our custom motion capture.\n\n\
    # Part 3: Exploring the Level Sequencer, Facial Motion Capture, and Rendering\n\
    \nIn *Part 3* of this book, we will look at the Level Sequencer, where we can\
    \ play and render out our animations. Here, we will focus on facial motion capture\
    \ solutions such as using an iPhone, but we will also explore professional facial\
    \ capture solutions. In addition, the rest of *Part 3* will explore rendering,\
    \ but we will finish with a bonus chapter featuring the Mesh to MetaHuman plugin.\n\
    \nThis part includes the following chapters:\n\n*   [*Chapter 7*](#B17878_07.xhtml#_idTextAnchor101),\
    \ *Using the Level Sequencer*\n\n*   [*Chapter 8*](#B17878_08.xhtml#_idTextAnchor120),\
    \ *Using an iPhone for Facial Motion Capture*\n\n*   [*Chapter 9*](#B17878_09.xhtml#_idTextAnchor139),\
    \ *Using Faceware for Facial Motion Capture*\n\n*   [*Chapter 10*](#B17878_10.xhtml#_idTextAnchor164),\
    \ *Blending Animations and Advanced Rendering with the Level Sequencer*\n\n* \
    \  [*Chapter 11*](#B17878_11.xhtml#_idTextAnchor196), *Using the Mesh to MetaHuman\
    \ Plugin*\n\n# 7\n\n# Using the Level Sequencer\n\nIn the previous chapter, we\
    \ learned how to bring our own motion capture data into Unreal and retarget it\
    \ to a MetaHuman. However, there are times when we need to make adjustments that\
    \ are required to fix issues or add an extra level of creativity to its performance.\n\
    \nOne issue we came across in the last chapter was caused by the discrepancies\
    \ between using A-Pose and T-Pose, and we were able to fix that by editing the\
    \ A-Pose of our MetaHuman inside the MetaHuman Blueprint."
