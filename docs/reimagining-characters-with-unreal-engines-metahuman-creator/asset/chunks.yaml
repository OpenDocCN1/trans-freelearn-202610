    Once you''ve created an IK Retargeter using the `Source_DM_Happy` rig, open it
    up by double-clicking on it. This will bring up the following interface:


    ![Figure 6.18: Choosing the target in the IK Retargeter](image/B17878_06.18..jpg)


    Figure 6.18: Choosing the target in the IK Retargeter


    Now, you want to choose the IK target to apply the DeepMotion motion capture to.
    You can see from Figure 6.19 that `Source IKRig Asset` is locked but `Target IKRig
    Asset` still has a drop-down list. Choose your MetaHuman target rig; in my case,
    it''s `TARGET_meta`.


    It''s at this point that we also have the option to choose the appropriate `Target
    Preview Mesh` too. In my case, the target preview mesh is the `Female Medium Overweight`
    mesh, which is titled `f_med_ovw_body_preview_mesh`, as per Figure 6.19:


    I


    ![Figure 6.19: Target Preview Mesh](image/B17878_06.19.jpg)


    Figure 6.19: Target Preview Mesh


    At the bottom of Figure 6.19, under the `Asset Browser` tab, you can see that
    the DeepMotion animation is now available for us to export. So, if you are happy
    with the animation, just click on the green `Export Selected Animations` button.


    As a reminder, clicking on the `Export Selected Animations` button will create
    an animation file that will now work with your MetaHuman character. You will be
    given the option of where to save the animation to choose your `Deepmotion` folder.


    Next, add your MetaHuman character to your scene by dragging and dropping it from
    your `Content` folder to your viewport. Then, ensure your MetaHuman blueprint
    is selected in `Outliner`.


    After that, go to the `Details` panel, select `Body`, and under `Animation Mode`,
    choose `Use Animation Asset`. Run a search for your new retargeted animation file
    and click on it. In Figure 6.20, you can see that I picked the `Happy Animation`
    file from the drop-down list:


    ![Figure 6.20: Applying the animation](image/B17878_06.20.jpg)


    Figure 6.20: Applying the animation


    With your file selected, run `Play` in your viewport and you''ll see your character
    come to life.


    Now that you have successfully gone through the whole process of creating motion
    capture data from video and retargeted it to your MetaHuman character, we''ll
    take a look at troubleshooting a common problem in the next section.


    ## Fixing Position Misalignment Issues


    It''s unlikely that your animation is going to perfectly match your video, and
    it''s just as unlikely that the retargeting process is going to be smooth sailing
    either. There''s always a slight mismatch between the source and target rigs.
    One of the most common problems is the arm positions, which mostly boils down
    to the `T-Pose` and the `A-Pose`.


    As MetaHumans are set in an `A-Pose`, and our DeepMotion rig was set to a `T-Pose`,
    this is where there''s a problem. In the event that you chose `T-Pose` in DeepMotion,
    there''s a handy little fix that saves you from having to go through the download
    and retargeting process again.


    As you can see from Figure 6.21, showing the `IK Retargeter` interface, we can
    see the problem: the source DeepMotion character is in a `T-Pose` and the target
    MetaHuman character is in an `A-Pose`. In this scenario, because of the misalignment,
    the arms will not animate properly and will most likely intersect with the body:


    ![Figure 6.21: IK Retargeter T-pose versus A-pose](image/B17878_06.21.jpg)


    Figure 6.21: IK Retargeter T-pose versus A-pose


    The only option we have here is to change the pose of the target, which is the
    MetaHuman. To do this, click on the `Edit Pose` button at the top of the screen,
    as shown in Figure 6.22. This will allow you to rotate the joints of your MetaHuman
    character from within the `IK Retargeter`:


    ![Figure 6.22: Edit Pose in the IK Retargeter](image/B17878_06.22.jpg)


    Figure 6.22: Edit Pose in the IK Retargeter


    I strongly advise that you use rotational snapping, which is highlighted at the
    top-right of Figure 6.22. I found that the difference between the `T-Pose` and
    the `A-Pose` in terms of arm rotation was about 45 degrees. Currently, the snapping
    is set to increments of five degrees; however, you can change that to your liking.


    The MetaHuman also has a slight rotation on the elbow joints that you will need
    to straighten to match that of the source; using the snapping tool allows you
    to get a much more uniform result. Be sure to change the angle from the front
    when you make corrections to the elbow joints so that you can see what you are
    doing.


    When you are happy, click on the `Edit Pose` button again. This will allow you
    to press `Play` again, to view how well the animation is retargeted. You can keep
    going back to fine-tune these adjustments.


    You may also find that you have exported the correct pose, but the animation is
    still causing slight issues, particularly with collision. In terms of DeepMotion,
    this could easily be attributed to the fact that you were using preset preview
    meshes as opposed to specific MetaHuman meshes. We will look at how to fix these
    issues in the next chapter.


    ## Summary


    In this section, we covered how we can create our own animation with as little
    as a single video camera. First, we looked at some of the major considerations
    when it comes to filming, what to avoid, and what steps we can take to bring even
    more accuracy.


    Then we started using DeepMotion, exploring the various animation settings that
    it can offer us, including some artificial intelligence functionality. We looked
    at some best practices when it comes to these functions and the use of reruns
    before committing to the final animation.


    Building on what we learned in the previous chapters, we once again retargeted
    our bespoke motion capture and applied it to our MetaHuman character, while looking
    a little more closely at `A-Poses` versus `T-Poses`. Finally, we covered an effective
    workaround for issues arising around those poses.


    In the next chapter, we are going to look at the `Level Sequencer` and the `Control
    Rig`, and how to further refine our custom motion capture.


    # Part 3: Exploring the Level Sequencer, Facial Motion Capture, and Rendering


    In *Part 3* of this book, we will look at the `Level Sequencer`, where we can
    play and render out our animations. Here, we will focus on facial motion capture
    solutions such as using an iPhone, but we will also explore professional facial
    capture solutions. In addition, the rest of *Part 3* will explore rendering, but
    we will finish with a bonus chapter featuring the `Mesh to MetaHuman plugin`.


    This part includes the following chapters:


    *   [Chapter 7](#B17878_07.xhtml#_idTextAnchor101), *Using the Level Sequencer*

    *   [Chapter 8](#B17878_08.xhtml#_idTextAnchor120), *Using an iPhone for Facial
    Motion Capture*

    *   [Chapter 9](#B17878_09.xhtml#_idTextAnchor139), *Using Faceware for Facial
    Motion Capture*

    *   [Chapter 10](#B17878_10.xhtml#_idTextAnchor164), *Blending Animations and
    Advanced Rendering with the Level Sequencer*

    *   [Chapter 11](#B17878_11.xhtml#_idTextAnchor196), *Using the Mesh to MetaHuman
    Plugin*


    ## Chapter 7: Using the Level Sequencer


    In the previous chapter, we learned how to bring our own motion capture data into
    Unreal and retarget it to a MetaHuman. However, there are times when we need to
    make adjustments that are required to fix issues or add an extra level of creativity
    to its performance.


    One issue we came across in the last chapter was caused by the discrepancies between
    using `A-Pose` and `T-Pose`, and we were able to fix that by editing the `A-Pose`
    of our MetaHuman inside the `MetaHuman Blueprint`.

    '
  trans: '

    创建好使用 `Source_DM_Happy` 骨架的 IK 重定向器后，双击打开它。这将弹出以下界面：


    ![图 6.18：在 IK 重定向器中选择目标](img/B17878_06.18..jpg)


    图 6.18：在 IK 重定向器中选择目标


    现在，你需要选择 IK 目标以应用 DeepMotion 动作捕捉数据。从图 6.19 可以看出，`Source IKRig Asset`（源 IK 绑定资产）被锁定了，但
    `Target IKRig Asset`（目标 IK 绑定资产）仍有一个下拉列表。选择你的 MetaHuman 目标绑定；在我的例子中，是 `TARGET_meta`。


    此时，我们也可以选择合适的 `Target Preview Mesh`（目标预览网格体）。在我的例子中，目标预览网格体是 `Female Medium Overweight`（中等体型超重女性）网格体，标题为
    `f_med_ovw_body_preview_mesh`，如图 6.19 所示：


    I


    ![图 6.19：目标预览网格体](img/B17878_06.19.jpg)


    图 6.19：目标预览网格体


    在图 6.19 底部的 `Asset Browser`（资产浏览器）选项卡下，你可以看到 DeepMotion 动画现已可供导出。因此，如果你对动画满意，只需点击绿色的
    `Export Selected Animations`（导出选中的动画）按钮。


    提醒一下，点击 `Export Selected Animations` 按钮将创建一个动画文件，该文件现在可用于你的 MetaHuman 角色。系统会提示你选择动画的保存位置，请选择你的
    `Deepmotion` 文件夹。


    接下来，将你的 MetaHuman 角色从 `Content`（内容）文件夹拖放到视口中，将其添加到场景里。然后，确保在 `Outliner`（大纲视图）中选中了你的
    MetaHuman 蓝图。


    之后，前往 `Details`（详细信息）面板，选择 `Body`（身体），在 `Animation Mode`（动画模式）下选择 `Use Animation
    Asset`（使用动画资产）。搜索你新的重定向动画文件并点击它。在图 6.20 中，你可以看到我从下拉列表中选中了 `Happy Animation`（快乐动画）文件：


    ![图 6.20：应用动画](img/B17878_06.20.jpg)


    图 6.20：应用动画


    选中文件后，在视口中点击 `Play`（播放），你就会看到你的角色“活”了过来。


    既然你已成功完成从视频创建动作捕捉数据并将其重定向到 MetaHuman 角色的整个流程，我们将在下一节中探讨排查一个常见问题。


    ## 修复位置错位问题


    你的动画不太可能与视频完美匹配，重定向过程也不太可能一帆风顺。源绑定和目标绑定之间总会存在细微的差异。最常见的问题之一是手臂位置，这主要归结于 `T-Pose`（T
    姿势）和 `A-Pose`（A 姿势）的区别。


    由于 MetaHuman 采用 `A-Pose`，而我们的 DeepMotion 绑定设置为 `T-Pose`，这就是问题所在。如果你在 DeepMotion
    中选择了 `T-Pose`，有一个方便的小修复方法，可以省去你再次经历下载和重定向过程的麻烦。


    正如图 6.21 所示的 `IK Retargeter`（IK 重定向器）界面，我们可以看到问题所在：源 DeepMotion 角色处于 `T-Pose`，而目标
    MetaHuman 角色处于 `A-Pose`。在这种情况下，由于错位，手臂将无法正确动画化，极有可能与身体相交：


    ![图 6.21：IK 重定向器 T 姿势对比 A 姿势](img/B17878_06.21.jpg)


    图 6.21：IK 重定向器 T 姿势对比 A 姿势


    这里唯一的选择是更改目标的姿势，即 MetaHuman。为此，点击屏幕顶部的 `Edit Pose`（编辑姿势）按钮，如图 6.22 所示。这将允许你在 `IK
    Retargeter` 内部旋转 MetaHuman 角色的关节：


    ![图 6.22：IK 重定向器中的编辑姿势](img/B17878_06.22.jpg)


    图 6.22：IK 重定向器中的编辑姿势


    我强烈建议你使用旋转吸附功能，它在图 6.22 的右上角高亮显示。我发现 `T-Pose` 和 `A-Pose` 在手臂旋转方面的差异约为 45 度。目前，吸附增量设置为
    5 度；不过，你可以根据喜好进行更改。


    MetaHuman 的肘关节也有轻微的旋转，你需要将其拉直以匹配源角色；使用吸附工具可以让你获得更均匀的结果。在修正肘关节时，请务必从正面视角调整角度，以便看清操作效果。


    调整满意后，再次点击 `Edit Pose` 按钮。这将允许你再次按下 `Play`，查看动画重定向的效果。你可以反复返回进行微调。


    你可能还会发现，虽然导出了正确的姿势，但动画仍会导致细微问题，特别是碰撞方面。就 DeepMotion 而言，这很容易归因于你使用了预设预览网格体，而非特定的
    MetaHuman 网格体。我们将在下一章探讨如何修复这些问题。


    ## 总结


    在本节中，我们介绍了如何仅凭一个摄像头创建自己的动画。首先，我们探讨了拍摄时的主要注意事项、应避免的事项，以及可采取哪些步骤来进一步提高准确性。


    随后，我们开始使用 DeepMotion，探索其提供的各种动画设置，包括一些人工智能功能。我们研究了使用这些功能和重新生成（reruns）的最佳实践，然后再提交最终动画。


    基于前几章所学，我们再次将定制的动作捕捉数据重定向并应用到 MetaHuman 角色上，同时更深入地对比了 `A-Pose` 与 `T-Pose`。最后，我们介绍了针对这些姿势引发问题的有效变通方法。


    在下一章中，我们将探讨 `Level Sequencer`（序列器）和 `Control Rig`（控制绑定），以及如何进一步优化我们的定制动作捕捉。


    # 第 3 部分：探索序列器、面部动作捕捉与渲染


    在本书的*第 3 部分*中，我们将介绍 `Level Sequencer`（序列器），我们可以在其中播放并渲染输出动画。在这里，我们将重点关注面部动作捕捉解决方案，例如使用
    iPhone，但也会探索专业的面部捕捉解决方案。此外，第 3 部分的其余内容将探讨渲染，并以介绍 `Mesh to MetaHuman plugin`（Mesh
    to MetaHuman 插件）的额外章节作为结尾。


    第 3 部分包含以下章节：


    *   第 7 章，《使用序列器》

    *   第 8 章，《使用 iPhone 进行面部动作捕捉》

    *   第 9 章，《使用 Faceware 进行面部动作捕捉》

    *   第 10 章，《使用序列器混合动画与高级渲染》

    *   第 11 章，《使用 Mesh to MetaHuman 插件》


    ## 第 7 章：使用序列器


    在上一章中，我们学习了如何将自己的动作捕捉数据导入 Unreal 并重定向到 MetaHuman。然而，有时我们需要进行调整以修复问题，或为其表现增加额外的创意层次。


    上一章遇到的一个问题是由使用 `A-Pose` 和 `T-Pose` 的差异引起的，我们通过在 `MetaHuman Blueprint`（MetaHuman
    蓝图）中编辑 MetaHuman 的 `A-Pose` 解决了该问题。


    '
