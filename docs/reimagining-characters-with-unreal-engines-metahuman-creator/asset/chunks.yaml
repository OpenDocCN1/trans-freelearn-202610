- raw: "# Installing Faceware Studio on a Windows PC\n\nTo install Faceware Studio,\
    \ head over to [https://facewaretech.com/](https://facewaretech.com/) and navigate\
    \ to the **Pricing** page. There are two options for the Faceware Studio software\
    \ that you could download, depending on your budget. The first is the **Faceware\
    \ Studio (Indie)** version, which is currently priced at $179 annually; the second\
    \ is the free trial version of Faceware Studio.\n\nLet’s assume you do the latter\
    \ – click **Try Now** under **Faceware Studio**, as per *Figure 9**.1*.\n\n![Figure\
    \ 9.1: Faceware pricing options ](image/B17878_09_01.jpg) \n\nFigure 9.1: Faceware\
    \ pricing options\n\nYou’ll be invited to register for a Faceware account as per\
    \ *Figure 9**.2*:\n\n![Figure 9.2: Sign up for an account ](image/B17878_09_02.jpg)\
    \ \n\nFigure 9.2: Sign up for an account\n\nOnce you have an account set up, navigate\
    \ to and click on **Downloads** at the top of the page. This will take you to\
    \ a list of available downloads. From *Figure 9**.3*, you can see that Faceware\
    \ Studio is available (if you don’t see it, just scroll down the page). Here,\
    \ you can click the **Download** button.\n\n![Figure 9.3: Downloading your 30-day\
    \ trial ](image/B17878_09_03.jpg) \n\nFigure 9.3: Downloading your 30-day trial\n\
    \nOnce downloaded, open the **installer.exe** file and follow the simple onscreen\
    \ instructions, then Faceware Studios will be installed!\n\nIn the next section,\
    \ we are going to download and install the Faceware Live Link plugin, which allows\
    \ Unreal to receive data from the Faceware application. We will also download\
    \ a MetaHuman sample from Epic Games that is designed to work with Faceware.\n\
    \n# Installing Unreal’s Faceware plugin and the MetaHuman sample\n\nTo install\
    \ Unreal’s Faceware plugin, open up your project from [*Chapter 8*](#B17878_08.xhtml#_idTextAnchor120)\
    \ and then open up the Epic Games Launcher. Search for the **Faceware Live Link**\
    \ and then click on **Install to Engine**, as shown in *Figure 9**.4*:\n\n![Figure\
    \ 9.4: Epic Games Launcher Faceware Live Link page ](image/B17878_09_04.jpg) \n\
    \nFigure 9.4: Epic Games Launcher Faceware Live Link page\n\nAfter the installation\
    \ of the plugin has finished, scroll down on the Faceware plugin page until you\
    \ see the link for the Sample MetaHuman Blueprint, as shown in *Figure 9**.5:*\n\
    \n![Figure 9.5: Sample MetaHuman Blueprint ](image/B17878_09_05.jpg) \n\nFigure\
    \ 9.5: Sample MetaHuman Blueprint\n\nClick on the **Download Blueprint** link.\
    \ This will open a new browser, taking you away from Epic Launcher and you will\
    \ see the following message:\n\n![Figure 9.6: CONTINUE TO EXTERNAL WEBSITE button\
    \ ](image/B17878_09_06.jpg) \n\nFigure 9.6: CONTINUE TO EXTERNAL WEBSITE button\n\
    \nClick on **CONTINUE TO EXTERNAL WEBSITE**. At this stage, you will be asked\
    \ where you want to download the Sample MetaHuman Blueprint to.\n\n![Figure: 9.7:\
    \ Saving the Sample MetaHuman Blueprint ](image/B17878_09_07.jpg) \n\nFigure:\
    \ 9.7: Saving the Sample MetaHuman Blueprint\n\nYou can download it to a temporary\
    \ location for the moment, or alternatively download it directly to your **MetaHumans**\
    \ folder inside your project. If you don’t know where on your computer your project\
    \ folder is, you can find it by jumping back into your Unreal project and going\
    \ to the Content Browser. From there, right-click on the **MetaHumans** folder\
    \ and choose **Show in Explorer**, as shown in *Figure 9**.8*.\n\n![Figure 9.8:\
    \ Locating your project folder ](image/B17878_09_08.jpg) \n\nFigure 9.8: Locating\
    \ your project folder\n\nClicking on **Show in Explorer** will open Windows Explorer\
    \ so that we can see where our project files are independently of Unreal. Similar\
    \ to what I have done in *Figure 9**.9*, copy the file path of the **MetaHumans**\
    \ folder location on your machine. Now we’re going to save the Sample Blueprint\
    \ into the project’s **MetaHumans** folder we created in the previous chapter.\n\
    \n![Figure 9.9: Copying the project location ](image/B17878_09_09.jpg) \n\nFigure\
    \ 9.9: Copying the project location\n\nDoing this will save the Blueprint into\
    \ your project folder; however, it will be in a zipped file; you will need to\
    \ extract it to the same folder. Once you do that, restart Unreal. During the\
    \ restart, the MetaHuman Sample will update your project to ensure that MetaHumans\
    \ will work with the Faceware plugin.\n\nIn the next section, we will move on\
    \ over to the Faceware Studio software and use a webcam to track our face.\n\n\
    # Setting up a webcam and the streaming function\n\nThe next step is to ensure\
    \ that you have a working webcam or another camera with a working connection to\
    \ your computer. If you have a camera that you’ve used in applications such as\
    \ Zoom or Teams, it will also work with Faceware.\n\n*   So, boot up the Faceware\
    \ Studio software. You should be greeted by an interface similar to what is shown\
    \ in *Figure 9**.10*:\n\n![Figure 9.10: The Faceware interface ](image/B17878_09_10.jpg)\
    \ \n\nFigure 9.10: The Faceware interface\n\nTo set up our webcam and the streaming\
    \ function, we will need to explore the **Realtime Setup** panel and the **Streaming**\
    \ panel.\n\n## Realtime Setup panel\n\nOn the left side of the screen is the **REALTIME\
    \ SETUP** panel. Under **Input Type**, click the drop-down menu and select your\
    \ webcam. As soon as you select a working webcam, you will get more options, as\
    \ shown in *Figure 9**.11*:\n\n![Figure 9.11: Realtime Setup panel ](image/B17878_09_11.jpg)\
    \ \n\nFigure 9.11: Realtime Setup panel\n\nLet’s look at the options available:\n\
    \n### Input Type\n\nThe **Input Type** panel allows you to choose what kind of\
    \ video you want to use. As our goal is to stream live facial capture data into\
    \ Unreal, we will pick **Live**. Should you wish to use pre-recorded footage located\
    \ on your machine, you can select **Media**, but we won’t be exploring that option.\n\
    \n### Resolution\n\nResolution can be as large as the video signal coming in.\
    \ So, if your webcam and computer are capable of handling an ultra-high-definition\
    \ webcam, Faceware won’t have any issues with it. In my case, my webcam had a\
    \ resolution of 3840 X 2160. However, that high resolution gives no advantage\
    \ and actually works against us due to the processing required for all that high-resolution\
    \ data. I’ve reduced the resolution to a more practical **1280 X 720**, as this\
    \ resolution holds all the information required for a good track but isn’t as\
    \ data heavy as my original option.\n\nYou are also given the option to choose\
    \ either **(MPG)**, which uses the **Motion JPEG** (**MJPEG**) compression/decompression\
    \ codec algorithm, or **(H264)**, which uses the H264 codec algorithm. Ultimately,\
    \ choose whichever one works best for your machine in terms of frame rate, which\
    \ I will explain in the next section.\n\n### Frame Rate\n\nFrame rate is an important\
    \ factor for accurate motion capture. You may remember from [*Chapter 5*](#B17878_05.xhtml#_idTextAnchor071)*,\
    \ Retargeting Animations with Mixamo*, that motion capture was available to us\
    \ at frame rates of 30 frames per second and above. Our goal is always to achieve\
    \ a frame rate of 30 frames per second or above, which you can see I have done\
    \ in *Figure 9**.11*.\n\nTo further reduce processing time, you can switch on\
    \ **Optimize for Realtime**, which will reduce the resolution and in turn increase\
    \ the frame rate. If you look again at *Figure 9**.11*, you can see a difference\
    \ in resolution occurs in the top left of the viewport that features the webcam\
    \ signal. I have also provided two examples of this signal information in *Figure\
    \ 9**.12*:\n\n![Figure 9.12: Resolution versus frame rate ](image/B17878_09_12.jpg)\
    \ \n\nFigure 9.12: Resolution versus frame rate\n\nYou can see that the 3840x2160\
    \ resolution on the left gives us a video frame rate of just 14.38, which is bad,\
    \ whereas the 1280x720 signal is giving us a video frame rate of 30.06, which\
    \ is better (considering our target of 30 fps)."
