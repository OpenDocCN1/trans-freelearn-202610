- raw: "In *Figure 6**.9*, you can see the **Rerun Animation** dialog box:\n\n![Figure\
    \ 6.9: Rerun Animation dialog box ](image/B17878_06.09.jpg) \n\nFigure 6.9: Rerun\
    \ Animation dialog box\n\nThe only difference between this **Rerun Animation**\
    \ box and the **Confirm New Animation** box from *Figure 6**.6* is that it shows\
    \ you the **Current** settings that gave you your last result and the **New**\
    \ settings that you are about to contribute to your next job. This allows you\
    \ to make a comparative study and, therefore, a more informed decision for the\
    \ rerun.\n\nNow, when you have gone through all of the settings and rerun your\
    \ job until you are finally happy with the results, it is time to download your\
    \ animation.\n\n# Downloading the DeepMotion motion capture file\n\nTo download\
    \ the DeepMotion motion capture file, instead of clicking the **Rerun** option,\
    \ simply click the **Download** button instead. This will bring up the **Download\
    \ Animations** dialog box, as shown in *Figure 6**.10*:\n\n![Figure 6.10: Download\
    \ Animations ](image/B17878_06.10.jpg) \n\nFigure 6.10: Download Animations\n\n\
    Before downloading the animation, the dialog box gives us the option to switch\
    \ or confirm which body type we want to use: it gives you two adult females, two\
    \ adult males, and a generic child to choose from. When you’re happy with the\
    \ correct preview mesh, make sure you have selected the correct download file\
    \ time, **FBX**, from the dropdown menu (the **BVH** and **DMPE** solutions won’t\
    \ work for what we need to do in Unreal). Then, click on the yellow **Download**\
    \ button and save your file somewhere in your project folder.\n\nWhen you download\
    \ your animation, you’ll see two FBX files and a folder, as per *Figure 6**.11*:\n\
    \n:\n\n![Figure 6.11: Saved files from DeepMotion and naming conventions ](image/B17878_06.11.jpg)\
    \ \n\nFigure 6.11: Saved files from DeepMotion and naming conventions\n\nThe FBX\
    \ file that has **TPose** at the end of the filename (**Adult\\_Male\\_Alt(includeTPose**)\
    \ is given to the file that uses an actual T-pose at the beginning of the animation.\
    \ The other file, **Adult\\_Male\\_Alt**, has no such T-pose at the beginning\
    \ and, therefore, kicks in with the animation at the very first frame. Choosing\
    \ one over the other isn’t critical as you can always remove the T-pose section\
    \ from the animation, but the T-pose could become useful in instances where you\
    \ need to align it for the purposes of retargeting. We will look at that at the\
    \ end of this chapter.\n\nNow that we have downloaded the relevant files, in this\
    \ next section, we are going to import the DeepMotion motion capture file into\
    \ Unreal so that we can retarget it to the MetaHuman IK Rig.\n\n# Importing the\
    \ DeepMotion animation into Unreal\n\nAs mentioned at the very beginning of this\
    \ chapter, we are building on what we have learned from the previous chapters,\
    \ but don’t worry, we’ll use this section as a bit of a recap on how to import\
    \ a character into Unreal.\n\nThe first thing you will need to do is to create\
    \ a folder in your Unreal project called **Deepmotion**. Make sure that you are\
    \ working in the project that you used in the previous chapter where you have\
    \ both a source and target IK Rig for your Mixamo character and your MetaHuman\
    \ character.\n\nOnce you’ve created the **Deepmotion** folder, right-click anywhere\
    \ within the **Content** browser of your **Deepmotion** folder and look for your\
    \ new DeepMotion FBX files. Choose the one that has the name **TPose** included.\
    \ When you select it, you will then be greeted by the **FBX Import Options** dialog\
    \ box, as shown in  *Figure 6**.12*:\n\n![Figure 6.12: FBX Import Options ](image/B17878_06.12.jpg)\
    \ \n\nFigure 6.12: FBX Import Options\n\nThere are two things to consider here:\n\
    \n*   First, we don’t want to assign a skeleton to this import; we want to use\
    \ one that is embedded in the file that we are about to import. So, under **Mesh**,\
    \ leave **Skeleton **to its default position of **None**, and make sure the **Skeletal\
    \ Mesh** option is selected so that it knows to choose the skeletal mesh from\
    \ the file.\n\n*   Second, while it sounds obvious, make sure you tick the **Import\
    \ Animations** option under **Animations**.\n\nAfter those considerations, click\
    \ on the blue **Import All** button. Don’t be alarmed by the error that mentions\
    \ smoothing that pops up; you can dismiss that.\n\nNow, when you look at your\
    \ **Deepmotion** folder in your **Content** browser, you should see something\
    \ similar to *Figure 6**.13*:\n\n![Figure 6.13: Deepmotion Content folder ](image/B17878_06.13.jpg)\
    \ \n\nFigure 6.13: Deepmotion Content folder\n\nMuch of what you see here should\
    \ be familiar; from left to right, you will see the following:\n\n*   A material\
    \ shader for the body\n\n*   A T-pose skeleton without animation\n\n*   The DeepMotion\
    \ skeleton with animation\n\n*   The DeepMotion skeleton physics asset\n\n*  \
    \ A T-pose skeleton without animation for editing\n\n*   A texture file used in\
    \ the aforementioned material shader used for the body\n\nIn this section, we\
    \ have successfully imported the **Deepmotion** file into the Unreal Engine. In\
    \ the next section, we will use the DeepMotion animation with our character.\n\
    \n# Retargeting the DeepMotion motion capture\n\nAs in previous chapters, you’ll\
    \ need to create an IK Rig as the source. So, while in the **Deepmotion** folder,\
    \ right-click anywhere and choose **Animation**, followed by **IK Rig**, as per\
    \ *Figure 6**.14*:\n\n![Figure 6.14: Creating an IK Rig ](image/B17878_06.14.jpg)\
    \ \n\nFigure 6.14: Creating an IK Rig\n\nTo avoid confusion, call this IK Rig\
    \ **Source\\_DM\\_Happy** (this will help us later when we are looking for it).\n\
    \nThen, as we have also done before, follow the same process to create IK chains.\
    \ Again, we will need to create six separate IK chains corresponding to the following:\n\
    \n*   The root to the hip\n\n*   The spine and head\n\n*   The left arm\n\n* \
    \  The right arm\n\n*   The left leg\n\n*   The right leg\n\nThe only thing that\
    \ is different, and you should expect this when importing motion capture from\
    \ different sources, is the naming convention. The DeepMotion naming convention\
    \ can be seen in *Figure 6**.15*, where they use the **JNS** abbreviation for\
    \ joints and start each appendage with the **l\\_ **or** r\\_** prefix referring\
    \ to either the left or the right:\n\n![Figure 6.15: IK chains ](image/B17878_06.15.jpg)\
    \ \n\nFigure 6.15: IK chains\n\nNotice that the order of these chains (starting\
    \ from **Root** to **hips\\_JNT** and ending at **r\\_upleg\\_JNT** to **r\\_foot\\\
    _JNT**) corresponds to my list of IK chains; having the same order in both the\
    \ IK source and IK target reduces errors.\n\nNow it’s time to create a new IK\
    \ Retargeter, where we use our new IK Rig as the source. While still inside the\
    \ **Deepmotion** folder, right-click anywhere in the **Content** browser, go to\
    \ **Animation**, and select **IK Retargeter**, as shown in *Figure 6**.16*:\n\n\
    ![Figure 6.16: Creating a new IK Retargeter ](image/B17878_06.16..jpg) \n\nFigure\
    \ 6.16: Creating a new IK Retargeter\n\nOnce you have created a new IK Retargeter,\
    \ double-click on it to open it and you’ll see a list of potential sources to\
    \ choose from. You can see, in *Figure 6**.17*, that I have a list of all the\
    \ IK Rigs that are saved in my project folder:\n\n![Figure 6.17: Pick IK Rig To\
    \ Copy Animation From ](image/B17878_06.17.jpg) \n\nFigure 6.17: Pick IK Rig To\
    \ Copy Animation From\n\nYou’ll see that I have a source IK Rig titled **SourceRigMixamo**.\
    \ As you practice with Unreal, you will soon end up with multiple source IK Rigs.\
    \ You should still have a source IK Rig that you used from the previous chapter.\
    \ This is why it’s important to label these IK Rigs appropriately so that you\
    \ don’t inadvertently choose the wrong one.\n\nYou *don’t* want to use the Mixamo\
    \ rig from the previous chapter, so select **Source\\_DM\\_Happy** as that is\
    \ the rig from which we want to copy the animation. Then hit **OK**.\n\nNote\n\
    \nIf you choose the wrong IK Rig, you will need to delete this Retargeter and\
    \ create a new one, hence why labeling the IK source rig is important."
  fmt: '

    在 `Figure 6.9` 中，你可以看到 `Rerun Animation` 对话框：


    ![Figure 6.9: Rerun Animation dialog box](`image/B17878_06.09.jpg`)


    `Figure 6.9: Rerun Animation dialog box`


    此 `Rerun Animation` 框与 `Figure 6.6` 中的 `Confirm New Animation` 框的唯一区别在于，它会显示产生上一次结果的
    `Current` 设置，以及你即将投入下一项作业的 `New` 设置。这使你能进行对比研究，从而为重新运行做出更明智的决定。


    现在，当你浏览完所有设置并重新运行作业直到最终对结果满意时，就该下载动画了。


    ## 下载 DeepMotion 动作捕捉文件


    要下载 DeepMotion 动作捕捉文件，请不要点击 `Rerun` 选项，只需点击 `Download` 按钮。这将弹出 `Download Animations`
    对话框，如 `Figure 6.10` 所示：


    ![Figure 6.10: Download Animations](`image/B17878_06.10.jpg`)


    `Figure 6.10: Download Animations`


    在下载动画前，对话框提供了切换或确认所需体型的选项：两个成年女性、两个成年男性和一个通用儿童供选择。当你对预览网格体满意后，请确保从下拉菜单中选择了正确的下载文件类型
    `FBX`（`BVH` 和 `DMPE` 方案不适用于我们在 Unreal 中的操作）。然后，点击黄色的 `Download` 按钮，将文件保存到项目文件夹中的某个位置。


    下载动画后，你将看到两个 FBX 文件和一个文件夹，如 `Figure 6.11` 所示：


    ![Figure 6.11: Saved files from DeepMotion and naming conventions](`image/B17878_06.11.jpg`)


    `Figure 6.11: Saved files from DeepMotion and naming conventions`


    文件名以 `TPose` 结尾的 FBX 文件（`Adult_Male_Alt(includeTPose)`）是指在动画开始处使用实际 T-pose 的文件。另一个文件
    `Adult_Male_Alt` 在开头没有此类 T-pose，因此从第一帧直接开始动画。选择哪一个并不关键，因为你随时可以从动画中移除 T-pose 片段，但在需要为重定向目的对齐时，T-pose
    可能会变得有用。我们将在本章末尾探讨这一点。


    现在我们已下载相关文件，在下一节中，我们将把 DeepMotion 动作捕捉文件导入 Unreal，以便将其重定向到 MetaHuman IK Rig。


    ## 将 DeepMotion 动画导入 Unreal


    正如本章开头所述，我们是在前几章所学基础上构建，但别担心，我们将把本节作为导入角色到 Unreal 过程的简要回顾。


    首先，你需要在 Unreal 项目中创建一个名为 `Deepmotion` 的文件夹。确保你在上一章使用的项目中工作，该项目同时拥有 Mixamo 角色和
    MetaHuman 角色的源 IK Rig 和目标 IK Rig。


    创建 `Deepmotion` 文件夹后，在 `Deepmotion` 文件夹的 `Content` 浏览器中任意位置右键单击，查找你的新 DeepMotion
    FBX 文件。选择文件名包含 `TPose` 的那个。选中后，你将看到 `FBX Import Options` 对话框，如 `Figure 6.12` 所示：


    ![Figure 6.12: FBX Import Options](`image/B17878_06.12.jpg`)


    `Figure 6.12: FBX Import Options`


    这里有两点需要注意：


    *   首先，我们不想为此导入分配骨架；我们想使用即将导入的文件中嵌入的骨架。因此，在 `Mesh` 下，将 `Skeleton` 保留在默认位置 `None`，并确保选中
    `Skeletal Mesh` 选项，以便它知道从文件中选择骨架网格体。

    *   其次，虽然这听起来显而易见，但请确保在 `Animations` 下勾选 `Import Animations` 选项。


    考虑完这些后，点击蓝色的 `Import All` 按钮。不要被提到平滑处理的错误弹窗吓到；你可以关闭它。


    现在，当你查看 `Content` 浏览器中的 `Deepmotion` 文件夹时，应该会看到类似 `Figure 6.13` 的内容：


    ![Figure 6.13: Deepmotion Content folder](`image/B17878_06.13.jpg`)


    `Figure 6.13: Deepmotion Content folder`


    你在这里看到的大部分内容应该都很熟悉；从左到右，你将看到以下内容：


    *   身体的材质着色器

    *   无动画的 T-pose 骨架

    *   带动画的 DeepMotion 骨架

    *   DeepMotion 骨架物理资产

    *   用于编辑的无动画 T-pose 骨架

    *   上述用于身体的材质着色器所用的纹理文件


    在本节中，我们已成功将 `Deepmotion` 文件导入 Unreal Engine。在下一节中，我们将结合角色使用 DeepMotion 动画。


    ## 重定向 DeepMotion 动作捕捉


    与前几章一样，你需要创建一个 IK Rig 作为源。因此，在 `Deepmotion` 文件夹中，任意位置右键单击，选择 `Animation`，然后选择
    `IK Rig`，如 `Figure 6.14` 所示：


    ![Figure 6.14: Creating an IK Rig](`image/B17878_06.14.jpg`)


    `Figure 6.14: Creating an IK Rig`


    为避免混淆，将此 IK Rig 命名为 `Source_DM_Happy`（这将帮助我们稍后查找它）。


    然后，像以前一样，遵循相同流程创建 IK 链。同样，我们需要创建六个独立的 IK 链，分别对应：


    *   根骨骼到髋部

    *   脊柱和头部

    *   左臂

    *   右臂

    *   左腿

    *   右腿


    唯一不同的是命名约定，这在从不同来源导入动作捕捉时是意料之中的。DeepMotion 的命名约定可见于 `Figure 6.15`，它们对关节使用 `JNS`
    缩写，并以前缀 `l_` 或 `r_` 开头表示左或右：


    ![Figure 6.15: IK chains](`image/B17878_06.15.jpg`)


    `Figure 6.15: IK chains`


    请注意，这些链的顺序（从 `Root` 到 `hips_JNT`，以 `r_upleg_JNT` 到 `r_foot_JNT` 结束）与我的 IK 链列表一致；在
    IK 源和 IK 目标中保持相同顺序可减少错误。


    现在该创建一个新的 IK Retargeter，使用我们的新 IK Rig 作为源。仍在 `Deepmotion` 文件夹中，在 `Content` 浏览器任意位置右键单击，转到
    `Animation`，然后选择 `IK Retargeter`，如 `Figure 6.16` 所示：


    ![Figure 6.16: Creating a new IK Retargeter](`image/B17878_06.16..jpg`)


    `Figure 6.16: Creating a new IK Retargeter`


    创建新 IK Retargeter 后，双击打开它，你将看到一个潜在源列表供选择。在 `Figure 6.17` 中，你可以看到我项目文件夹中保存的所有 IK
    Rig 列表：


    ![Figure 6.17: Pick IK Rig To Copy Animation From](`image/B17878_06.17.jpg`)


    `Figure 6.17: Pick IK Rig To Copy Animation From`


    你会看到我有一个名为 `SourceRigMixamo` 的源 IK Rig。随着你在 Unreal 中的练习，你很快会拥有多个源 IK Rig。你应该仍保留上一章使用的源
    IK Rig。这就是为什么适当标记这些 IK Rig 很重要，以免无意中选择错误的一个。


    你**不**想使用上一章的 Mixamo rig，所以请选择 `Source_DM_Happy`，因为那是我们要复制动画的 rig。然后点击 `OK`。


    > **Note**

    >

    > 如果你选择了错误的 IK Rig，你将需要删除此 Retargeter 并创建一个新的，这就是为什么标记 IK 源 rig 很重要的原因。

