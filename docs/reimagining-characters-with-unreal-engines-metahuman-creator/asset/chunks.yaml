  trans: '

    # 重定向动画


    在本章中，我们涵盖了大量内容。我们介绍了关于虚幻引擎中 `Blueprints`（蓝图）的一些关键概念，它们是什么，以及可以用来做什么。我们对虚幻引擎的 `Mannequin`（模型）角色和我们自己的
    `MetaHuman`（数字人）角色进行了一些基本编辑，通过将两者的平移目标设置为 `Skeleton`（骨架），使它们能够有效地“对话”。我们还简要讨论了
    IK（反向运动学）以及该解决方案如何与我们的角色配合工作。


    在下一章中，我们将重新深入 `Blueprints`，将动画从一个角色重定向到另一个角色，并探索修复任何细微但常见问题的方法。我们将为 `Mannequin`
    角色和我们的 `MetaHuman` 创建 `IK Rig`（IK 骨架/绑定），并使用 `IK Retargeter`（IK 重定向器）将动画数据导出到我们的角色上。


    ## 技术要求


    要完成本章，您将需要第 1 章中详述的技术要求，以及我们在第 2 章中导入到 UE5 中的 `MetaHuman` 和虚幻引擎 `Mannequin`。


    ## 什么是 IK Rig？


    要回答这个问题，我们实际上需要问两个问题：


    *   什么是绑定？

    *   什么是 IK？


    现在让我们来回答它们。


    ### 什么是绑定？


    在 3D 动画制作中，`rig`（绑定）是一种控制角色运动的简化手段，专为动画师量身定制。动画师不直接操纵角色的骨骼，而是通过绑定提供的控制器，动画师可以快速识别并选择它们。许多
    3D 软件应用程序都自带专为人物和动物设计的绑定。在动画工作室中，绑定的复杂程度各异，取决于动画的复杂程度。归根结底，绑定的目的是简化动画制作过程。在本章中，我们将利用这些简化的绑定，以便将动画数据应用到它们身上。


    `MetaHuman` 自带一个用于角色动画的内置绑定，称为 `IK Rig`。事实上，它附带一个 `IK Control Rig`（IK 控制绑定），允许动画师完全控制
    `MetaHuman` 角色的所有动画。如图 4.1 所示，绑定是操纵骨骼的一种简化方式：


    ![Figure 4.1: MetaHuman IK Control Rig](img/B17878_04.01.jpg)


    图 4.1：MetaHuman IK 控制绑定


    既然我们了解了什么是绑定，现在让我们看看 IK 的含义。


    ### 什么是 IK？


    要回答这个问题，我们需要了解在角色动画中，我们使用骨骼。这些骨骼在运动方式上彼此具有独特的关系；如果我们想用稍微专业一点的说法，这些骨骼在其运动学关系的定义方式上具有独特的关系。这些骨骼存在于骨骼层级结构中，它们如何运动取决于层级结构是采用
    `Forward Kinematics` (`FK`，正向运动学) 还是 `Inverse Kinematics` (`IK`，反向运动学)。


    说到人类骨骼，很少有骨骼能在所有轴上运动，且没有人类骨骼有自由在任何轴上移动 360 度。然而，与真实的人类骨骼不同，计算机生成的骨骼形状非常简单，可以显示为简单的线条、圆柱体、球体、金字塔或胶囊体。无论形状如何，它们都包含一到两个枢轴点，用于确定骨骼的旋转点。除了旋转点，我们还可以定义骨骼绕哪个轴旋转、绕哪个轴不旋转。让我们看看图
    4.2，它演示了骨骼在 `UE5` 中的可视化方式。通过选择任意骨骼，我们会看到一个小工具，允许我们编辑每个骨骼的旋转；然而，用这个来制作动画很麻烦，因为难以选择或看清我们在做什么。


    ![Figure 4.2: A Mannequin bone system in Unreal](img/B17878_04.02.jpg)


    图 4.2：虚幻引擎中的模型骨骼系统


    让我们以肩关节为例。我们知道我们可以向特定方向摆动手臂，但当我们尝试向其他方向移动时，很快就会遇到阻力。就关节而言，这种阻力被称为 `constraint`（约束）。


    现在，请看图 4.3，它展示了 `MetaHuman` 上呈现的肩关节；你可以看到我们不必担心旋转约束：


    ![Figure 4.3: Shoulder joint](img/B17878_04.03.jpg)


    图 4.3：肩关节


    你还会注意到，不太清楚选中了哪根骨骼，这表明直接操作骨骼在动画制作中并不实用。


    无论如何，让我们回到 FK 和 IK 到底是什么这一点上。为了理解 FK，首先我们需要了解父级和子级之间的简单关系（我们在 3D 图形和机器人技术中经常使用这个比喻）。*子级会跟随父级去往任何地方，但父级不必跟随子级。*


    #### FK


    让我们将父子关系概念应用于关节，以肩膀为例探讨 FK。移动或旋转手关节对肩关节没有影响。事实上，我们必须先旋转肩关节，然后是肘关节，才能影响手的位置以获得期望的结果。换句话说，要定义手（末端执行器）的位置和旋转，我们必须先计算肩部和肘部的位置和旋转。


    在图 4.4 中，我演示了通过旋转 `Joint 01`（左侧可见），然后可以旋转 `Joint 02`（右侧可见）：


    ![Figure 4.4: FK](img/B17878_04.04.jpg)


    图 4.4：FK


    在这里，我们通过对 `Joint 01`（父级）和 `Joint 02`（子级）应用旋转来计算手的位置。这被称为 FK，因为我们通过先计算父级的旋转来解决运动问题，所以我们沿着
    *parent to child*（父级到子级）的方向解决这个问题。


    #### IK


    IK 之所以得名，是因为它通过首先计算子级的旋转来解决运动问题。再次以肩膀为例，当用户或艺术家影响手部末端执行器（层级中的子级）的位置时，IK 解决方案可以确定肩关节的旋转。因此，它与
    FK 相反，沿着 *child-to-parent*（子级到父级）的方向解决运动问题。


    在图 4.5 中，我演示了我只需要移动手，这反过来会自动计算出 `Joint 01` 的旋转，以及 `Joint 02` 的旋转和后续位置：


    ![Figure 4.5: IK](img/B17878_04.05.jpg)


    图 4.5：IK


    从本质上讲，IK 比 FK 更动态，并为我们解决了许多问题。使用 IK，我们可以像移动真人的手一样有效地移动角色的手，所有其余的骨骼都会真实地跟随。


    > **Note**

    >

    > 值得注意的是，在动画制作中，在 IK 和 FK 解决方案之间切换是常见做法。IK 常用于大部分工作，因为它为工作流程增加了一定程度的自动化，而 FK 则用于细微的调整和微调。

    '
