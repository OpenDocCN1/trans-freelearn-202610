  fmt: '

    # Working with Subsequent Animations


    For any subsequent animation downloads from Mixamo, you should download **Without
    Skin** (this option is available when downloading your animation in Mixamo, as
    per *Figure 5.16*). Then, when importing the new animations into Unreal, you can
    now choose the skeleton that was created when you created the source IK Rig (in
    my case, it''s called `MaceranaDance_Skeleton`). The headless thumbnail of the
    Glenda preview mesh dancing the Macarena is also visible, like so:


    ![Figure 5.26: FBX Import Options for subsequent animation-only files](image/B17878_05_26.jpg)


    Figure 5.26: FBX Import Options for subsequent animation-only files


    It would be good practice to download a batch of animations from Mixamo without
    skin. Then, you can drag and drop all of them directly from an external folder
    into your `Content` folder or import them using the `File Import` option and selecting
    multiple files rather than just one.


    When importing multiple animation FBX files, you will get the dialog box shown
    in *Figure 5.26*. By clicking on `Import All`, the same setting will be applied
    to all of the animations you are importing. So, if you have 100 animations, you
    will apply this skeleton to all 100 assets in one single click.


    In my case, I have downloaded five soccer animations and imported them into my
    `Mixamo_Animations` folder that I previously created in my Unreal project. To
    batch-retarget all these animations, I only need to open up the IK Retargeter.


    Opening up the IK Retargeter that I created earlier, I can now see these animations
    and their skeletons ready to be retargeted to my MetaHuman character:


    ![Figure 5.27: IK Retargeter with multiple animations available for retargeting](image/B17878_05_27.jpg)


    Figure 5.27: IK Retargeter with multiple animations available for retargeting


    Because my new animations have been set to use the Mixamo skeleton upon import,
    they automatically become available in the IK Retarget list. You can see that
    list at the bottom of *Figure 5.27*. I have brought in five soccer animations
    and selected them all.


    Using the `Export Selected Animations` button, I can now batch-convert multiple
    animations with just one click.


    When exporting these animations, the IK Retargeter retains the animation name
    and automatically adds the `Retargeted` suffix to each animation asset. As before,
    you can go to your character Blueprint, and under `Anim to Play`, you can search
    for your new animations. In *Figure 5.28*, you can see that I searched for `soccer`
    and found that my new and retargeted animations were ready to apply to my character
    Blueprint already in the scene:


    ![Figure 5.28: Retargeted animation available under Anim to Play](image/B17878_05_28.jpg)


    Figure 5.28: Retargeted animation available under Anim to Play


    Because of the work done in the previous section, in this section, you were able
    to batch-import multiple animations and batch-retarget them using the IK Retargeter
    tool. This is a very efficient approach to creating an entire motion library dedicated
    to your MetaHuman character.


    # Summary


    In this chapter, we learned about the fantastic and free resource, Mixamo, to
    bring hundreds of animations into your project. We learned how to best configure
    our character meshes to get the most out of Mixamo and we also got a little revision
    time on IK Rigs and the IK Retargeter.


    As well as that, we learned about the importance of character proportions, a little
    about skin weighting, and their connection to character proportions and animation
    rigs.


    Most importantly, we learned about the very powerful automation tools that allow
    us to batch-import and batch-retarget animation files acquired from Mixamo.


    In the next chapter, we will learn about DeepMotion, another online resource that
    allows us to create our own custom animations using just a video camera.


    # Chapter 6: Adding Motion Capture with DeepMotion


    In the previous chapter, we were introduced to the motion capture library of Mixamo
    and how to make the Mixamo animations work inside Unreal.


    In this chapter, we are going to build on that knowledge and create our very own
    animation using another third-party online tool called **DeepMotion**, which includes
    a tool called **Animate 3D** that analyzes video of human performances and, in
    return, creates a motion capture file. We will learn how to use a video camera
    effectively to record a performance, then use DeepMotion''s Animate 3D feature
    to create your very own bespoke motion capture file, and then use it to animate
    your MetaHuman character in Unreal.

    '
  trans: '


    # 处理后续动画


    对于从 Mixamo 下载的任何后续动画，你应该选择**不带皮肤**下载（此选项在 Mixamo 下载动画时可用，如*图 5.16*所示）。然后，在将新动画导入
    Unreal 时，你现在可以选择创建源 IK Rig 时生成的骨架（在我的例子中，它被称为 `MaceranaDance_Skeleton`）。Glenda
    预览网格体跳 Macarena 舞的无头缩略图也可见，如下所示：


    ![图 5.26：后续仅动画文件的 FBX 导入选项](img/B17878_05_26.jpg)


    图 5.26：后续仅动画文件的 FBX 导入选项


    最佳实践是从 Mixamo 批量下载不带皮肤的动画。然后，你可以直接将它们从外部文件夹拖放到你的 `Content` 文件夹中，或者使用 `文件导入` 选项并选择多个文件而非单个文件来导入。


    导入多个动画 FBX 文件时，将出现*图 5.26*所示的对话框。点击 `全部导入`，相同的设置将应用于你正在导入的所有动画。因此，如果你有 100 个动画，只需单击一次即可将此骨架应用到所有
    100 个资产中。


    在我的例子中，我下载了五个足球动画并将它们导入到我之前在 Unreal 项目中创建的 `Mixamo_Animations` 文件夹中。为了批量重定向所有这些动画，我只需要打开
    IK 重定向器。


    打开我之前创建的 IK 重定向器，我现在可以看到这些动画及其骨架已准备好重定向到我的 MetaHuman 角色：


    ![图 5.27：IK 重定向器中有多个可用于重定向的动画](img/B17878_05_27.jpg)


    图 5.27：IK 重定向器中有多个可用于重定向的动画


    因为我的新动画在导入时已设置为使用 Mixamo 骨架，所以它们会自动出现在 IK 重定向列表中。你可以在*图 5.27*底部看到该列表。我导入了五个足球动画并全选了它们。


    使用 `导出选中动画` 按钮，我现在可以单击一次就批量转换多个动画。


    导出这些动画时，IK 重定向器会保留动画名称，并自动在每个动画资产名称后添加 `Retargeted` 后缀。和以前一样，你可以进入角色蓝图，在 `Anim
    to Play` 下搜索你的新动画。在*图 5.28*中，你可以看到我搜索了 `soccer`，发现我的新重定向动画已经准备好应用到场景中的角色蓝图了：


    ![图 5.28：重定向动画可在 Anim to Play 下找到](img/B17878_05_28.jpg)


    图 5.28：重定向动画可在 Anim to Play 下找到


    得益于上一节完成的工作，在本节中，你能够批量导入多个动画并使用 IK 重定向器工具批量重定向它们。这是为你的 MetaHuman 角色创建完整动作库的一种非常高效的方法。


    # 总结


    在本章中，我们了解了这个极好的免费资源 Mixamo，以及如何将数百个动画引入你的项目。我们学习了如何最佳配置角色网格体以充分利用 Mixamo，并复习了
    IK Rig 和 IK 重定向器。


    此外，我们了解了角色比例的重要性、一些蒙皮权重知识，以及它们与角色比例和动画骨架的关系。


    最重要的是，我们了解了功能强大的自动化工具，它们允许我们批量导入和批量重定向从 Mixamo 获取的动画文件。


    在下一章中，我们将了解 DeepMotion，另一个在线资源，它允许我们仅使用摄像机创建自己的自定义动画。


    # 第 6 章：使用 DeepMotion 添加动作捕捉


    在上一章中，我们介绍了 Mixamo 的动作捕捉库，以及如何让 Mixamo 动画在 Unreal 中工作。


    在本章中，我们将建立在该知识之上，使用另一个名为 **DeepMotion** 的第三方在线工具创建我们自己的动画，该工具包含一个名为 **Animate
    3D** 的功能，它分析人类表演的视频，并返回创建一个动作捕捉文件。我们将学习如何有效地使用摄像机录制表演，然后使用 DeepMotion 的 Animate
    3D 功能创建你专属的动作捕捉文件，并用它在 Unreal 中为你的 MetaHuman 角色制作动画。


    '
