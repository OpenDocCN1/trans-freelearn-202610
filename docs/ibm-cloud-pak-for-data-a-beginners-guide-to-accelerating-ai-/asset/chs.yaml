  \n- **数据科学家** 角色：此角色指定通常参与高级分析和机器学习的<|message|>。他们从目录中引用数据，并在项目中与其他用户协作。对于此类用户，通常只需要一小部分权限，如下表所示。这也授予他们使用部署（例如机器学习模型）的权限。\n\
  \n  | 权限 | 类别 | 贡献该权限的服务 |\n  |---|---|---|\n  | 访问目录 | 目录 | - Watson Knowledge\
  \ Catalog<br>- Watson Studio |\n  | 创建部署空间 | 部署 | - Watson Knowledge Catalog<br>-\
  \ Watson Studio |\n  | 创建项目 | 项目 | - Watson Knowledge Catalog<br>- Watson Studio\
  \ |\n\n  图 10.7 – 授予数据科学家角色的权限\n\n- **用户** 角色：**用户** 角色很特殊，因为它通常表示分配给某类访客用户的最少权限集。将\
  \ **用户** 角色分配给某人仅意味着他们将能够登录并查看不需要任何额外授权的任何内容。将 **用户** 角色分配也用于向平台引入新用户，从而使他们随后可以作为个人添加到用户组或分配对项目、目录甚至数据库的访问权限。\n\
  \n  然而，当安装某些服务（例如 Watson Knowledge Catalog 或 Watson Studio）时，默认情况下，它们会向此 **用户**\
  \ 角色授予额外权限。这使这些用户至少能够在自己的项目或部署空间范围内私下工作。当然，就像任何预定义角色一样，管理员可以选择更改此角色并删除这些权限或引入其他权限，以符合他们对“最小”特权角色的定义。\n\
  \n  | 权限 | 类别 | 贡献该权限的服务 |\n  |---|---|---|\n  | 创建部署空间 | 部署 | - Watson Knowledge\
  \ Catalog<br>- Watson Studio |\n  | 创建项目 | 项目 | - Watson Knowledge Catalog<br>-\
  \ Watson Studio |\n\n  图 10.8 – 授予用户角色的权限\n\n\n\n\n开箱即用时，默认用户（admin）会自动分配以下所有角色，但可根据需要更改：\n\
  \n- Administrator\n- Business Analyst\n- Data Engineer\n- Data Quality Analyst\n\
  - Data Scientist\n- Data Steward\n- Developer\n\n企业还可以通过定义自己的角色来自定义此设置[25]。如果默认权限集不符合业务需求，管理员可以编辑开箱即用的角色或创建新角色。\n\
  \n作为角色定义的一部分[26]，可以选择特定权限并将其与该角色关联。\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_259_0.png)\n\
  \n图 10.9 – 将权限关联到新角色的示例\n\n在本节中，我们讨论了权限的语义，以及如何定义或更新角色，以满足企业在访问控制方面的需求并识别合适的角色类型。\n\
  \n角色与单个用户以及用户组都相关，也就是说，角色可以分配给 Cloud Pak for Data 用户组，这意味着该组的所有成员将自动继承此角色。在下一节中，我们将更详细地了解如何识别用户以及如何定义组。\n\
  \n### 用户管理和用户组\n\nCloud Pak for Data 提供了 API 和用户界面，供管理员管理每个用户的身份验证和基于角色的授权。下图给出了一个用户界面示例，帮助管理员授予和撤销用户的访问权限。\n\
  \n![](img/50e1dac0750b69f2b8e8efff000eb13b_260_0.png)\n\n管理员（或具有“管理用户”权限的用户）可以授权其他用户访问\
  \ Cloud Pak for Data。\n\n例如，通过该用户界面，可以添加新用户并分配适当的角色：\n\n#### 添加用户\n\n授权用户访问平台。\n\
  \n- 个人资料信息\n- 平台访问\n- 角色\n- 摘要\n\n#### 角色\n\n为此用户分配角色，或创建新角色。\n\nadministrator\n\
  \nAdministrator\n\n#### Administrator\n\n描述\nAdministrator 角色\n\n修改于\n2021年7月20日\
  \ 上午4:34\n\n24 个权限，110 个操作  全部展开\n\n- 访问高级治理\n- 访问高级映射\n- 访问目录\n- 访问数据质量\n- 访问治理工件\n\
  - 管理平台\n\n图 10.11 – 向新用户授予 Administrator 角色的示例\n\n如上图所示，授予此类访问权限的管理员还可以查看完成此角色分配后将授予哪些权限。他们也可以选择将多个角色分配给同一个人，从而获得这些角色权限的并集。\n\
  \n除了逐个向单个用户授予权限之外，管理员还可以创建用户组，以简化管理具有相似访问需求的大量用户的过程。例如，如果一组用户需要相同的角色组合，则可以将这些用户添加到一个组中，并为该组分配相应的角色组合。如果该组的某位成员离开公司，该用户将从组中移除。\n\
  \n请注意，整个 LDAP 或 Active Directory 组也可以分配（映射）到此类 Cloud Pak for Data 用户组。这使企业能够继续利用其现有的组织分组，而无需逐个授权每个用户。\n\
  \n默认情况下，Cloud Pak for Data 包含 **All-users** 组。顾名思义，所有 Cloud Pak for Data 用户都会自动包含在该组中。该组用于向所有平台用户授予对资产（如\
  \ **Connections**）的访问权限。\n\n下图所示的用户界面[27]支持创建此类用户组并向此类组分配角色：\n\n#### 新建用户组\n\n将用户分组以广泛管理权限。\n\
  \n![](img/50e1dac0750b69f2b8e8efff000eb13b_262_0.png)\n\n图 10.12 – 定义新用户组\n\n要向此类用户组引入成员，管理员还可以选择浏览任何已配置的身份提供者（如\
  \ LDAP），以确定要添加的个人，并将现有的 LDAP 组映射进来。这提供了相当大的灵活性，因为管理员不受企业 LDAP 中固定组织结构（例如由 HR 决定的结构）的限制，并且还可以临时性地让来自不同\
  \ LDAP 组的用户集进行协作。\n\n下图说明了该界面如何支持浏览现有 LDAP 组，以将其作为 Cloud Pak for Data 用户组的成员引入。\n\
  \n![](img/50e1dac0750b69f2b8e8efff000eb13b_263_0.png)\n\n图 10.13 – 选择要分配给新用户组的现有\
  \ LDAP 组\n\n如上图所示，该界面支持选择现有的完全限定 LDAP 组作为新 Cloud Pak for Data 用户组的成员。\n\n在至少选择了一个单独用户或\
  \ LDAP 组后，管理员可以选择一个或多个角色分配给这个新用户组，如下图所示：\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_264_0.png)\n\
  \n图 10.14 – 定义新用户组\n\n在上图中，您会注意到 **Data Steward** 角色已被分配给 **Reviewers User Group**。这意味着该组的所有成员将自动被识别为数据管理员，并继承该角色附带的权限。管理员还可以随时更改此角色分配，或为此用户组引入其他角色。\n\
  \n请注意，当使用 LDAP 组时，用户组的成员身份以及由此扩展而来的分配给个人的角色都是*动态*的。这意味着，当用户从某个 LDAP 组中移除或分配到另一个组时，其后续登录将自动确保其权限反映其当前的成员身份。单个用户还可以被分配到多个用户组，这意味着他们的权限是他们从所有这些组的成员身份中继承的权限的并集。\n\
  \n在本节中，我们介绍了如何管理用户和用户组，以及 Cloud Pak for Data 如何与企业身份验证机制（如 LDAP）集成。只有在这样的用户通过身份验证后，他们才能访问\
  \ Cloud Pak for Data 中的服务或特权资源。此外，还有授权检查。例如，用户或用户组至少需要被授予项目或目录等资源的查看者角色，然后才能访问这些资源。类似地，这些用户或组可以被授予对\
  \ Data Virtualization Service（DVS）实例的访问权限（作为 DV Engineer），或者也许仅被授予对 DB2 数据库实例的访问权限（作为\
  \ Database user）。总之，用户管理服务支持广泛的安全要求，因为它在平台中同时启用了身份验证和灵活的 RBAC，也提供了针对单个资源或服务实例的授权机制。\n\
  \n### 保护凭据\n\nCloud Pak for Data 是一个提供多种功能与服务的平台。用户和应用程序可能需要从集群外部连接到 Cloud Pak for\
  \ Data 实例中的特定 API 端点。开发人员作为日常工作的一部分，也可能需要连接到外部系统（如数据库和数据湖），例如从笔记本中以编程方式连接，或作为 Apache\
  \ Spark 作业的一部分。此类代码通常与其他用户共享，甚至可能提交到源代码仓库，因此将密码和其他敏感内容放在其中是不明智的。\n\n在本节中，我们将了解 Cloud\
  \ Pak for Data 中可让此类开发人员避免以明文形式暴露凭据的功能。\n\n#### API 密钥\n\n从客户端程序调用 Cloud Pak for\
  \ Data API 的开发人员可以使用 API 密钥，从而无需在客户端内持久保存其凭据。\n\nCloud Pak for Data v3.5 及更高版本支持使用\
  \ API 密钥进行身份验证和授权。这允许客户端程序向 Cloud Pak for Data 平台或特定服务实例进行身份验证。\n\n每个用户都可以生成一个平台\
  \ API 密钥，其作用域更广，允许访问平台上的所有服务。\n\n实例 API 密钥针对特定服务，因此仅可用于该特定范围。平台 API 密钥使客户端脚本和应用程序能够访问它们直接登录\
  \ Cloud Pak for Data Web 客户端时通常可以访问的所有内容。实例 API 密钥仅允许访问生成它的特定实例。\n\n\n\n\n> **注意**\n\
  > \n> 在 Cloud Pak for Data v3.5 版本中，部分服务的实例 API 密钥不可用。\n\nCloud Pak for Data 提供了用户界面和\
  \ API [28] 来生成、重新生成或删除平台 API 密钥或实例 API 密钥。\n\n### Secrets API 与 Vault 的使用\n\nCloud\
  \ Pak for Data 中的 Secrets API [29] 提供了从配置的 Vault 中访问敏感凭据的能力。这有助于避免在开发者编写的内容（如笔记本或脚本）中使用明文凭据。通过使用\
  \ Vault，企业还可以控制策略以独立轮换密钥和凭据。\n\n由于 Cloud Pak for Data 的 Secrets API 仅在需要时检索 Vault\
  \ 的内容，因此它会获取最新的密码或密钥。这也避免了用户需要在多处更新密码的需求。\n\nCloud Pak for Data 将继续在其路线图中引入与不同 Vault\
  \ 厂商和技术的集成。\n\n### 满足合规要求\n\n监管合规和企业政策要求对系统进行严格监控，以确保其未被破坏。通常需要遵守多个标准以及不同的审计技术。Red\
  \ Hat 和 IBM Cloud Pak for Data 提供了工具和机制，供安全架构师根据其组织的政策设计和配置系统，以及审计使用情况。\n\n在本节中，我们将简要了解有助于企业规划合规性的功能。\n\
  \n### 为合规配置运行环境\n\n对于 Cloud Pak for Data，Red Hat 的用于主机的 Enterprise Linux 和 OpenShift\
  \ Container Platform 代表了技术基础。因此，为了确保合规，基础需要正确配置。技术栈中帮助实现合规就绪的几个关键方面如下所述：\n\n- RHEL\
  \ 支持强大的安全和合规态势，例如设置 **联邦信息处理标准 (FIPS)** 出版物 140-2。存在多种先进技术来保护 RHEL 主机 [30]，包括工具、扫描器和最佳实践指导。\n\
  - OpenShift Container Platform v4 引入了合规性操作员 [31]，以帮助确保合规并检测与基于 RHEL CoreOS 的主机相关的差距。**国家标准与技术研究所\
  \ (NIST)** 组织在其他方面也提供了实用程序和指导，用于企业严格遵守的稳健合规实践。OpenShift 合规性操作员提供了适当级别的自动化，帮助企业利用\
  \ NIST OpenSCAP 实用程序，例如在这种复杂、动态环境中进行策略扫描和执行。\n\n集群管理员通常负责确保集群设置适当以满足合规标准。也很重要的是要对集群中的特权操作进行充分监控，无论是在基础设施还是更高级别，例如\
  \ Cloud Pak for Data。下一节确定了为确保所有特权活动得到报告而需要进行的额外配置。\n\n### 审计\n\n审计为企业提供了证明合规性和监控异常的方法。\n\
  \n审计可以在栈的各个级别启用：\n\n- 在操作系统级别 [32]，RHEL 提供了机制让企业监控任何安全策略的违规情况。审计系统记录对该主机上任何敏感或关键文件访问的访问监视。\n\
  - 在 OpenShift Container Platform 级别 [33]，管理员可以配置审计级别以记录所有用户或其他服务对 Kubernetes API\
  \ 服务器的所有请求。\n- 在 Cloud Pak for Data 级别，审计日志支持生成、收集和转发符合 **Cloud Auditing Data Federation\
  \ (CADF)** [34] 的审计记录，用于核心平台可审计事件。\n\n您可以配置 IBM Cloud Pak for Data 审计日志将审计记录转发到您的\
  \ **安全信息和事件管理 (SIEM)** 解决方案，例如 **Splunk**、**LogDNA** 或 **QRadar**。\n\n审计日志实现使用 Fluentd\
  \ 输出插件 [35] 来转发和导出审计记录。在您安装 IBM Cloud Pak for Data 后，审计日志服务默认未配置。外部 SIEM 配置 [36]\
  \ 可以添加到 `zen-audit-config` Kubernetes configmap 中，以定义审计日志服务转发所有收集的审计记录的位置。\n\n虽然审计日志通常仅涵盖特定的特权操作，但通常还有关于跟踪用户和应用程序访问数据的额外监管要求。在下一节中，我们将看到如何实现这一点。\n\
  \n### 与 IBM Security Guardium 的集成\n\nGuardium 提供了监控数据访问并确保数据安全的能力。IBM Security Guardium\
  \ 的 **数据库活动监控 (DAM)** 功能提供了一个先进的集中式审计存储库、报告机制以及支持取证和合规审计的工具。这些功能与前面章节中描述的系统级审计和特权操作审计记录互补，因为它们也可以扩展到数据保护。\n\
  \nCloud Pak for Data 以两种方式支持与 Guardium 的集成：\n\n- **审计敏感数据访问**：拥有管理目录权限的 Cloud Pak\
  \ for Data 用户有权识别敏感数据，例如 **个人身份信息 (PII)**，并将其配置为由 Guardium 监控 [39]。由于 Cloud Pak\
  \ for Data 的 Watson Knowledge Catalog 服务也可以扫描和标记敏感数据，因此它使授权用户更容易启用这些数据资产由 Guardium\
  \ 监控。\n- Cloud Pak for Data 还促进数据库的配置。对于监管合规而言，监控此类数据的访问至关重要。这通过名为 Guardium *E-STAP*\
  \ [40] 的服务来实现，该服务在 Cloud Pak for Data 之上配置并拦截对 DB2 数据库的流量。之后对 DB2 数据库的所有访问都只能通过\
  \ E-STAP 接口进行。该服务配置为与 Guardium 设备配合使用，从而实现访问日志记录和报告，以及访问策略执行。\n\nGuardium 是数据保护和合规领域中成熟且完善的解决方案。许多企业已经利用\
  \ Guardium 以集中方式自动化合规控制，而与 Guardium 的集成使 Cloud Pak for Data 客户能够加速其自身数据的合规就绪工作，补充了\
  \ Cloud Pak for Data 平台和运行环境提供的功能。\n\n在本节中，我们探讨了企业为满足监管合规要求可用的技术。总的来说，Cloud Pak\
  \ for Data 提供了优雅的 RBAC 机制，并使企业能够配置或更改开箱即用的角色以支持任何监管合规，例如职责分离。\n\n合规要求因客户所在的行业以及地理要求而有很大差异。在前一节中，我们还确定了需要适当配置栈中所有元素的必要性，包括\
  \ OpenShift Container Platform 及其主机节点，以及 Cloud Pak for Data 本身用于特权操作审计，以及其他集成选项，例如\
  \ Guardium 以支持数据访问监控。\n\n### 总结\n\n在本章中，我们讨论了 Cloud Pak for Data 的开发方式以及所采用的 IBM\
  \ 安全工程实践。我们还查看了容器镜像如何从受信任的位置交付，供客户拉取或下载。\n\n一旦 Cloud Pak for Data 安装完成，必须注意确保其以安全的方式运行。我们查看了\
  \ RHEL 和 OpenShift 提供的构建，这些构建为工作负载提供了安全基础以及 Cloud Pak for Data 在 OpenShift Container\
  \ Platform 上的安全态势。\n\n我们还查看了管理员如何负责管理用户和组访问以确保授权得到执行，同时配置适当的身份管理器用于身份验证，以及定义适当的角色或修改开箱即用的用户角色。\n\
  \n安全对于任何软件安装都至关重要，Cloud Pak for Data 也不例外。本章除了描述技术外，还提供了指向实用机制的指针，以保护和监控栈的每个部分，确保\
  \ Cloud Pak for Data 在您企业中的安全可靠运行。\n\n在下一章中，我们将查看存储，这是 Cloud Pak for Data 可靠运行的另一个基础且关键的构建。\n\
