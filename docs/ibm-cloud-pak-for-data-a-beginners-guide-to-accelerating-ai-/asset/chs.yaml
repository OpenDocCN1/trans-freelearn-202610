  \ SCC 关联，且未与任何 Kubernetes 角色关联，因此没有 API 访问权限。此账户类似于开箱即用的默认服务账户。它用于不应被授予任何 RBAC 特权的服务或组件。\
  \ |\n| default | 在每个 OpenShift 项目中自动创建，绑定到 restricted SCC，且未被授予任何 RBAC 特权；也就是说，没有绑定任何角色。此默认服务账户将用于最终用户工作负载（如\
  \ notebook 和 Python Pod），并且不允许在命名空间内执行任何类型的操作。 |\n\n图 10.3 – Cloud Pak for Data\
  \ 中使用的命名空间范围服务账户 – v3.5 和 v4\n\n因此，系统 Pod 和 Job 通常使用 **cpd-admin-sa** 来执行更高特权的操作，而常规用户\
  \ Pod 和 Job（如数据科学环境和 refinery 作业）会与 **default** 或 **cpd-norbac-sa** 关联，以表明它们不被授予任何特权。\n\
  \n如下面的代码片段所示，典型的 Cloud Pak for Data Pod 规范包含 `securityContext` 指令，这些指令指示要添加或删除哪些\
  \ Linux capabilities、以哪个用户 ID 运行，甚至明确指定 Pod 必须仅以非 root UID 运行。此外还指定了服务账户，该账户进而授予\
  \ Pod 在处理 Kubernetes 资源和 API 时特定的 RBAC 权限：\n\n```\nsecurityContext:\n  capabilities:\n\
  \    drop:\n      - ALL\n```\n\n\n\n\n```yaml\nrequests:\n  cpu: 100m\n  memory:\
  \ 256Mi\n```\n\n### 其他注意事项\n\n在前面的章节中，我们研究了如何唯一标识 Cloud Pak for Data 工作负载，如何使用最小权限原则为每个微服务授予\
  \ RBAC，以及如何限制每个微服务消耗的资源。在本节中，我们将介绍适用于 *多个* 微服务甚至整个 Cloud Pak for Data 安装的安全方面。\n\
  \n我们将探讨以下内容的含义：\n\n- 确保两个微服务之间传输数据的<|message|>\n- 静态数据保护\n- 了解传统防病毒软件的相关性\n\n####\
  \ 传输中加密和保护入口点\n\nCloud Pak for Data 仅公开一个 HTTPS 端口作为浏览器用户体验和 API 访问的主要访问点。该端口以 OpenShift\
  \ 路由的形式公开。命名空间内部和入站的所有通信均使用 SSL 进行加密，仅启用 **TLS 1.2** 高安全加密算法。\n\n在 OpenShift 命名空间中安装\
  \ Cloud Pak for Data 会导致生成自签名 TLS 证书。默认情况下，所有 HTTPS 客户端都不信任此证书，应将其替换为企业自己的签名 TLS\
  \ 证书 [13]。\n\nCloud Pak for Data 中的所有服务都必须支持基于 TLS 的加密，用于服务到服务通信以及与外部系统通信。例如，DB2\
  \ 通过 ODBC 和 JDBC 为客户端应用程序公开 TLS，即使从集群外部连接也能确保安全连接并确保传输中的数据也得到加密。连接外部客户标识的数据库和数据湖，例如\
  \ Data Virtualization、Watson Studio 服务，也可以配置为通过 TLS 进行。\n\n请注意，Cloud Pak for Data\
  \ 服务中此类传输中的基于 TLS 的加密是在基础设施中可能配置的任何内容之上的。例如，Kubernetes 节点间通信网络也可能作为云基础设施或 VPN 技术的一部分进行加密。\n\
  \n最好 *不要* 将这些 Kubernetes 节点视为通用 Linux 系统，而应将其视为由 OpenShift 作为集群进行保护和管理的专用机器。OpenShift\
  \ 为 *整个堆栈* 从操作系统到容器再到单个工作负载提供安全性和运维。传统防病毒软件无法覆盖整个堆栈，并且可能会干扰集群的运行或可靠性。\n\nRed Hat\
  \ 和 OpenShift 提供额外的安全加固，以减少对防病毒软件的需求 [19]。请注意，传统扫描程序通常用于在共享文件系统（例如由 Samba 提供服务并挂载在\
  \ Windows 客户端上的文件系统）中查找病毒。但是，通过在 OpenShift Container Platform 和 RHEL CoreOS 上以规定方式运行\
  \ Kubernetes，不应在这些 Kubernetes 节点上首先设置此类任意文件服务。\n\n在本节中，我们探讨了在操作系统和 OpenShift 中可用的安全结构。我们还研究了\
  \ Cloud Pak for Data 如何通过审慎使用 Kubernetes RBAC 来确保每个服务帐户的最小权限，并使用标签和注释的约定来标记所有工作负载。它还限制计算资源的分配，以确保安全可靠的运行。在下一节中，我们将研究\
  \ Cloud Pak for Data 管理员可用于配置身份验证并确保每个用户获得适当授权级别的控制。\n\n### 用户访问和授权\n\nCloud Pak\
  \ for Data 本身就是一个平台，是一个多用户系统，因此也为用户提供访问控制。它还与企业 LDAP 或 Active Directory 以及其他身份提供者集成，以确保对其服务的安全访问。还支持审计以跟踪对\
  \ Cloud Pak for Data 平台的访问。\n\n与任何多用户系统一样，Cloud Pak for Data 会识别授予特定用户或用户组的角色和权限。特权用户负责确保只有授权用户才能访问\
  \ Cloud Pak for Data 主机服务和内容。\n\n#### 身份验证\n\n虽然 Cloud Pak for Data 包含一个开箱即用的简单机制来识别用户并授予他们访问权限，但这仅用于初始运行，并不意味着用于安全生产用途，并且无法满足任何合规性法规要求。例如，密码策略或多因素身份验证无法使用此默认机制支持。相反，企业应设置与身份提供者的连接。\n\
  \n#### 授权\n\n通过权限和角色，企业可以定义自己的角色并授予他们对不同 Cloud Pak for Data 服务的特定访问权限。\n\n角色是用于定义授予特定用户角色的一组权限（特权）的实体。\n\
  \nCloud Pak for Data 服务引入一个或多个开箱即用的角色以便开始使用，并提供一种帮助管理角色的体验。企业可以使用此类角色来遵守因合规原因而需要的\
  \ *职责分离* 政策。例如，管理员可能被拒绝访问数据（这是他们最初未配置的数据库实例的默认设置），并且还拒绝访问数据目录，通过撤销特定权限。\n\n还可以授予细粒度的权限，例如，仅授予特定用户组管理用户访问权限和管理组访问权限的能力，但他们无需获得其他管理功能的访问权限。\n\
  \n管理员通常使用用户管理体验配置角色，如下图所示：\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_256_0.png)\n\
