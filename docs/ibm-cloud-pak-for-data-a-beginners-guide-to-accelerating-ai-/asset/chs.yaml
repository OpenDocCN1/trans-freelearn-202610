  \n图 7.17 – 带有 Watson 的 IBM Financial Crimes Insight\n\n接下来，我们有 IBM Surveillance\
  \ Insight：\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_179_0.png)\n\n图 7.18 – IBM\
  \ Surveillance Insight\n\n现在我们已经介绍了融入层及其七个组件，这些组件有助于解决各种业务用例，接下来我们将介绍 Cloud Pak\
  \ for Data 组件的现代化升级。\n\n### Cloud Pak for Data 组件的现代化升级\n\nIBM 拥有成千上万的客户，他们正在运行其业界领先的数据和\
  \ AI 产品，例如 Db2、DataStage、主数据管理、SPSS Modeler、决策优化、Cognos Analytics 和 Planning Analytics。从历史上看，这些产品在裸机服务器或虚拟机上运行，拥有各自独立的架构和生态系统。随着\
  \ Cloud Pak for Data 的出现，所有这些产品都已容器化，并作为服务在 Cloud Pak for Data 上提供。将独立产品现代化为 Cloud\
  \ Pak for Data 上的组件，为客户带来了许多好处，例如：\n\n- 云原生优势：Cloud Pak for Data 的现代云原生架构意味着更容易配置和扩展服务、实现无缝升级和管理。这为企业带来了巨大的成本节约。\n\
  \n\n\n\n- **部署灵活性**：除了上述云原生优势外，客户还可以灵活地在任意公有云或私有云上部署，这意味着企业不会被锁定在特定供应商上。随着越来越多的企业采用多云和混合方式来应对数据和\
  \ AI 工作负载，这种部署灵活性将进一步增强。\n- **无缝集成**：服务的端到端集成以及紧密编排的数据编织确保了自助服务、易用性和自动化，这些都能为企业带来显著的回报。\n\
  \nIBM 最近推出了一项计划，通过支付象征性升级费用，将现有产品现代化为 Cloud Pak for Data 扩展包。客户还将获得一些额外的 Cloud Pak\
  \ for Database 许可证权益。这为客户提供了一条直接的升级路径，同时将成本保持在最低水平。通过将现有的独立产品现代化为 Cloud Pak for\
  \ Data 服务，客户获得的新增价值还包括可以选择以预先商定的转换价格将独立许可证转换为 Cloud Pak for Data 扩展包许可证。\n\n###\
  \ 扩展服务\n\n除了 Cloud Pak for Data 的基础能力和扩展包之外，我们还拥有一个蓬勃发展的合作伙伴生态系统，IBM 与这些合作伙伴存在联合销售和转售关系。联合销售合作伙伴属于战术性合作，针对具体交易逐项参与；而转售合作伙伴更具战略性，拥有可由\
  \ IBM 销售人员销售的 IBM 部件编号。鉴于庞大的生态系统，我们将在接下来的小节中仅详细介绍转售合作伙伴。\n\n#### Cambridge Semantics\n\
  \n**AnzoGraph DB** 是一种原生的大规模并行处理**图 OLAP (GOLAP)** 数据库，旨在加速图数据上的数据集成和可扩展分析，其性能水平可与业界领先的传统数据仓库分析产品相媲美。\n\
  \n#### CockroachDB\n\n**CockroachDB** 为云应用提供云原生的分布式 SQL。\n\n#### Hazelcast\n\n**Hazelcast**\
  \ 是一个内存计算平台，由 Hazelcast 内存数据网格和 Hazelcast 内存流处理引擎组成。这提供了一个可扩展、高吞吐量、超低延迟的解决方案，专门用于处理最关键的任务、下一代数据和\
  \ AI/ML 工作负载。\n\n#### SingleStore\n\n**SingleStore** 是一个高性能的分布式、关系型、融合数据库，支持事务型和分析型工作负载。该数据库每天可摄取数百万个事件，支持\
  \ ACID 事务，同时以关系型 SQL、JSON、地理空间和全文搜索格式分析数十亿行数据。\n\n#### Datameer\n\n**Datameer**\
  \ 是一个数据准备、丰富和探索平台，可简化和加速将复杂的多源数据转换为有价值的、可业务化信息的过程。它提供简单的点击式工具，可满足任何需要准备和探索数据或为分析、AI\
  \ 和 ML 创建数据集的人员的技能需求。\n\n#### Senzing\n\n**Senzing** 是首款即插即用的实时 AI 实体解析软件，也是目前最先进的实体解析软件。您可以使用\
  \ Senzing 来增强和转变您的大数据分析、欺诈运营、内部威胁、营销情报、风险缓解及其他运营。许多组织都在应对海量大数据的挑战，迫切需要解析实体以获得新的洞察并更快地做出更好的决策。Senzing\
  \ 通过其下一代实体解析技术使这一切成为可能。\n\n#### WAND 分类法\n\n**WAND** 在 Cloud Pak for Data 之上提供业务词汇表，使用户在启动数据目录和分析计划时，能够获得经过验证的行业和业务职能特定术语来源。\n\
  \n#### Appen\n\n**Appen**（原 Figure Eight）提供了一个数据标注平台，利用机器学习和人工标注，帮助文本、音频、图像和视频等非结构化数据成为数据科学、机器学习和产品团队可用的数据。\n\
  \n#### Findability Sciences\n\n**FP-Predict+** 是 CPD 的附加组件，为最终用户提供预测和预报功能，几乎无需人工干预，无需编程，也无需手动建模。结合\
  \ Cloud Pak for Data 组件，该解决方案可跨行业和用例工作。\n\n#### Lightbend\n\n**Lightbend** 提供基于开源的大规模流处理系统的云原生开发。\n\
  \n#### Personetics\n\n**Personetics** 为金融服务提供数据驱动的个性化和客户赋能。\n\n#### Portworx\n\n\
  **Portworx** 是市场领先的 Kubernetes 存储平台，为在 Cloud Pak for Data 上运行的任何数据服务提供可扩展、高性能的容器存储、备份和灾难恢复、多云操作、数据安全、容量管理以及合规和治理。这确保了客户在运行从\
  \ IBM 购买的软件时拥有完美的操作体验。\n\n#### Trilio\n\n**TrilioVault** 为整个云套件提供原生备份/恢复功能。随着 OpenShift\
  \ 在生产环境中部署，IT 管理员需要 Trilio 的备份/恢复功能，而开发人员需要 Trilio 的测试/开发功能以加速应用程序敏捷性。\n\n#### 拥有联合销售协议的生态系统合作伙伴\n\
  \n以下列表提供了拥有联合销售协议的生态系统合作伙伴的名称：\n\n- **BCC Group**：实时流式市场数据统一平台\n- **Crunchy PostgreSQL**：面向企业的开源\
  \ PostgreSQL 发行版\n- **Equifax**：包含消费者财务能力、人口统计和信用信息的数据集\n- **People Data Labs**：包含\
  \ B2B 和 B2C 个人资料数据的数据集\n- **Precisely**：美国和加拿大所有已知地址的综合列表\n- **ZoomInfo**：增强决策的\
  \ ML 增强型 B2B 企业数据\n- **ContractPodAI**：基于 SaaS 的**合同生命周期管理 (CLM)**\n- **Duality\
  \ Secureplus Query**：安全查询第三方控制的数据集\n- **DXC Open Health Connect**：面向医疗服务提供者、支付方和生命科学行业的数字健康平台\n\
  - **Equinix**：支持在数据摄取点运行 AI 模型，以降低数据传输的成本和风险\n- **Listec**：分析和可视化 SAP 运营数据的解决方案\n\
  - **Prolifics**：预测性客户发现解决方案\n- **Tavant**：媒体收视率分析加速器\n- **Dulles Research**：自动将\
  \ SAS 代码转换为开源代码的插件\n- **NetApp**：混合多云数据服务，简化跨云和本地环境的应用程序和数据管理\n\n### 总结\n\nCloud\
  \ Pak for Data 拥有一个充满活力的 IBM、开源和第三方服务生态系统。在本章中，我们深入介绍了 IBM 高级服务（也称为扩展包）的功能，这些功能按照\
  \ AI 阶梯的四个层级组织，即收集（Collect）、组织（Organize）、分析（Analyze）和注入（Infuse）。\n\n在下一章中，您将了解合作伙伴生态系统的重要性、业务合作伙伴的不同层级，以及客户如何从\
  \ Cloud Pak for Data 上的开放生态系统中受益。\n\n在本章中，我们将介绍以下主题：\n\n- 提高健康倡导计划的效率\n- 语音聊天机器人\n\
  - 风险与控制自动化\n- 增强边境安全\n- 统一数据编织\n- 财务规划与分析\n\n### 提高健康倡导计划的效率\n\n让我们通过解决客户在提高健康倡导计划效率方面面临的挑战来浏览这个用例。\n\
  \n**客户挑战**：一家非营利性医疗服务提供者网络和健康计划公司希望提高其健康倡导计划的效率。目标是识别有风险的会员，并降低会员发生不良事件的可能性。他们希望预测未来\
  \ 9 个月内**急诊室 (ER)** 就诊的可能性。他们的挑战是要满足不同的数据科学团队对不同工具/技术的需求，以及维护这些工具/技术的支持人员。此外，他们还希望将\
  \ ML 模型投入生产，并在接下来的几年中将其扩展到所有群体。\n\n借助 Cloud Pak for Data，他们能够使用集中式治理目录对信息资产（包括外部数据集）进行编目。他们能够建立一个治理框架，将各个资产分配给数据管家，并使用治理策略/规则定义访问策略。在获得可信数据的访问权限后，他们能够利用\
  \ Watson Studio Jupyter 笔记本训练 ML 模型，并将其部署为 Watson Machine Learning 部署。已部署的模型会持续进行偏见和模型漂移监控。\n\
