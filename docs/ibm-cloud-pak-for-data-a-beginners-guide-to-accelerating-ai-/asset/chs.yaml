- "## 4 介绍 Data Operations (DataOps)\n\n数据是创新的燃料，也是保持竞争优势的关键。它是推动分析和理解业务趋势与机遇的关键要素。以新的方式释放其价值，可以加速组织迈向\
  \ AI 的进程。\n\n**DataOps** 专注于在整个组织中实现协作，以推动敏捷性、速度以及大规模的新数据计划。通过利用自动化的力量，DataOps 旨在解决访问、准备、集成以及使数据可用方面的效率低下所带来的挑战。\n\
  \nDataOps 的核心是组织的信息架构，它解决了以下问题：\n\n- 你了解你的数据吗？你信任你的数据吗？\n- 你能否快速检测错误？\n- 你能否在不“破坏”整个数据管道的情况下进行增量更改？\n\
  \n上一个屏幕截图展示了以业务术语形式收集的业务元数据的示例，并指定了数据管控员。他们将负责验证业务术语并通过类别和次要类别（如适用）将该业务概念组织到企业分类体系中。\n\
  \n**数据管控员** 在更广泛的数据治理计划中发挥着关键作用。让我们使用一个简单的图表来说明不同实体所扮演的角色，包括其各自的职责：\n\n- **数据治理领导层**\
  \ 职责包括以下内容：\n  - 制定和审查治理计划和政策\n  - 了解数据治理领域的主要趋势\n  - 为各种数据治理计划提供指导原则\n  - 为数据管控委员会提供战略方向\n\
  - **数据治理办公室** 职责包括以下内容：\n  - 识别和优先考虑数据治理计划\n  - 建立和监控数据的绩效指标\n  - 提供企业视角和方法的保证\n\
  \  - 识别并聘用数据管控员和协调员\n- **业务流程负责人** 职责包括以下内容：\n  - 在战术层面解决升级的问题\n  - 识别并聘用运营数据管控员\n\
  \  - 优先考虑并批准数据质量问题修复请求\n  - 向数据管控员和保管员传达期望和要求\n- **数据管控员** 职责包括以下内容：\n  - 使用数据执行其工作和流程。\n\
  \  - 检查数据使用的完整性。\n  - 作为数据访问、来源、变更控制以及在其数据域和职能领域内识别的任何数据质量问题的第一联系人。\n\n识别数据治理活动的触发因素：\n\
  \n![](img/50e1dac0750b69f2b8e8efff000eb13b_79_0.png)\n\n图 4.3 – 数据治理组织\n\n现在我们了解了治理团队的组织方式，我们将列出最常用的业务和技术元数据组件。\n\
  \n### 业务元数据组件\n\n以下是最常用的业务和技术元数据组件：\n\n- 类别层次结构\n- 类别\n- 业务术语\n- 业务术语类型层次结构\n- 业务术语类型\n\
  - 信息治理政策层次结构\n- 信息治理政策\n- 信息治理规则\n\n现在，我们将继续介绍技术元数据组件。\n\n### 技术元数据组件\n\n技术元数据可以是开箱即用的资产类型，也可以是自定义资产类型。包括以下内容：\n\
  \n- 数据库\n- 数据文件\n- 非结构化数据源\n- 数据科学资产（模型、笔记本等）\n- 逻辑数据模型\n- 物理数据模型\n- XML 模式定义\n\
  - 主数据管理\n- 应用程序\n- 文件\n- 存储过程定义\n- 商业智能制品\n- 数据质量资产（数据规则定义、数据规则集、指标等）\n- 提取、转换、加载资产（作业、阶段、参数等）\n\
  - 自定义技术资产\n\n现在我们知道了需要捕获哪些元数据，在下一节中，我们将讨论通过分析企业数据资产来更好地了解我们所拥有的数据的过程。\n\n### 通过分析了解数据\n\
  \n随着企业经历数字化转型，数据和多个系统的激增往往导致存在冗余数据集，且数据质量参差不齐。面对庞大的数据量，了解数据集的特征至关重要，包括有哪些属性/列、各个列的数据类型、其唯一值以及数据值的分布情况。此分析信息有助于我们从大量可能重叠的数据集中分离出感兴趣的数据集。\n\
  \n借助 Cloud Pak for Data，我们拥有一个集中式治理目录，可作为所有数据资产的索引，并帮助我们为许多数据科学项目组织资源：数据资产、分析资产以及需要使用这些资产的用户。该目录还具有内置的分析功能，允许使用者选择给定数据集并启动快速数据分析活动。重点关注分析的以下两个方面：\n\
  \n- 数据结构发现；即数据集中有哪些属性可用？\n- 数据内容发现；即数据值是什么、其分布、质量等？\n\n第一步是定义与数据源的连接并将数据资产引入目录。Cloud\
  \ Pak for Data 支持各种数据源连接器，并且随着平台每个新版本的发布，支持的连接器列表也在不断增长。\n\n一旦数据资产被引入，我们就可以使用目录执行以下操作：\n\
  \n- 为资产添加一个或多个标签。\n- 快速预览数据。\n- 对资产添加评审和评论。\n- 为资产定义访问策略。\n- 跟踪资产的事件血缘。\n- 创建数据分析：\n\
  \n![](img/50e1dac0750b69f2b8e8efff000eb13b_81_0.png)\n\n图 4.4 – 目录资产的初始分析\n\n可选地，你可以选择所有可用的数据类或作为分析活动的一部分选择数据类的子集。运行分析所需的时间将取决于我们选择的数据类数量以及数据资产的大小和宽度：\n\
  \n![](img/50e1dac0750b69f2b8e8efff000eb13b_82_0.png)\n\n*图 4.5 – 识别作为初始数据分析一部分可利用的数据类*\n\
  \n数据分析过程需要一些时间，你可以看到以下内容：\n\n- 已分配给各个列/属性的数据类（视情况而定）\n- 各列/属性的汇总统计信息，无论数据类型如何\n\
  - 各列/属性中值的频率分布\n\n这有助于快速识别数据中潜在的数据质量问题。\n\n在以下屏幕截图中，我们有所选数据集的数据分析。这有助于我们快速了解数据：\n\
  \n\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_83_0.png)\n\n图 4.6 – 初始分析结果，显示数据分布和汇总统计\n\
  \n作为自动发现和数据质量分析功能的一部分，我们还拥有更全面的数据剖析能力，这将在本章后面讨论。这将进一步帮助我们发现跨数据域的关系，并进行更全面的数据质量分析。\n\
  \n### 对数据进行完整性分类\n\n分类是用于根据企业保密级别对资产进行分类的特殊标签。通过对某些资产打上比其他资产更敏感的标签来实现。你可以将它们视为帮助消费者识别哪些资产可以共享的标签，同时保护那些不得在业务部门或组织之外分发的其他资产。Cloud\
  \ Pak for Data 中的集中式目录服务提供了以下开箱即用的分类，并可根据组织的需要灵活添加更多分类：\n\n- 个人身份信息（PII），即能够识别个人身份的数据（例如，社会安全号码）。\n\
  - 敏感个人信息（SPI），即一旦暴露，可能对个人造成重大伤害、尴尬和/或不公平的数据（例如，种族、性取向、宗教信仰等）。\n- **机密**，即一旦泄露，可能对个人和/或组织造成长期伤害的数据：\n\
  \n![](img/50e1dac0750b69f2b8e8efff000eb13b_84_0.png)\n\n*图 4.7 – 用于定义数据保护规则的分类*\n\
  \n我们不仅可以将这些分类用作资产标签，还可以利用平台的自动化功能触发数据保护规则，根据不同的分类限制不同用户对某些资产的访问。\n\n接下来，我们将讨论如何利用\
  \ Cloud Pak for Data 的自动数据发现功能及其融入**机器学习（ML）**的业务术语分配流程。\n\n### 自动化数据发现和业务术语分配\n\
  \n到目前为止，我们已经讨论了不同类型的元数据（业务和技术）以及元数据在组织中的价值。一项关键任务是将业务元数据映射到技术元数据。这是必需的，因为 Cloud\
  \ Pak for Data 是一个面向不同角色（包括业务和技术受众）的平台，其目标是促进业务和技术受众之间的沟通，同时将技术资产与相应的业务功能对齐。\n\n\
  Cloud Pak for Data 拥有一项基于 ML 的专利自动分类功能，可在自动发现过程中推荐将业务术语映射到技术资产。该 ML 分类模型使用特定行业的元数据进行训练，并基于领域专家手动进行的业务术语分配提供认知学习。\n\
  \n自动术语分配作为发现过程中列分析的一部分被调用。我们有两种类型的发现流程：\n\n- 快速扫描（QuickScan）\n- 自动发现（Auto-discovery）\n\
  \n**术语**根据 ML 模型评分的置信度自动分配。这些业务术语与技术资产的关联最初表示为候选关系，领域专家和管理员可以对其进行审查并手动分配。当置信度达到或超过\
  \ 50% 时，系统会建议分配术语。当置信度超过 80% 时，候选关系将自动分配。\n\nML 模型使用以下信息生成术语分配：\n\n- 语言名称匹配，基于业务术语名称和数据资产名称的相似性。\n\
  - 基于数据类的分配。在这种情况下，如果业务术语与数据类相关联，并且数据资产分析将数据类分配给某个资产，则该术语会被推荐为该资产的匹配项。\n- 监督学习模型，该模型最初使用默认目录中存储的术语进行训练，随后通过用户术语分配作为模型反馈进行学习。\n\
  \n我们将展示快速扫描发现流程，以展示这种自动术语分配。我们将在平台已定义的数据源连接上调用快速扫描发现作业。作为此作业的一部分，我们可以指定以下子任务：\n\n\
  - 1. 执行列分析（分析列）。\n- 2. 执行数据质量分析（分析数据质量）。\n- 3. 执行自动术语分配（分配术语）。\n- 4. 使用数据采样：\n\n\
  ![](img/50e1dac0750b69f2b8e8efff000eb13b_86_0.png)\n\n图 4.8 – 调用快速扫描发现作业\n\n**快速扫描作业**的执行时长可能有所不同，具体取决于数据源表的数量和我们使用的数据样本数量。在我们的案例中，发现\
  \ 30 张表大约花费了 50 秒，这非常快。在下面的截图中，你可以看到自动业务术语分配所完成工作的摘要，以及各个列/属性的数据类分配：\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_87_0.png)\n\
  \n图 4.9 – 快速扫描摘要，显示多列的自动术语分配\n\n在详细信息屏幕上，我们可以查看各个数据资产列、派生的数据质量、数据类分配和建议的业务术语，以及基于\
  \ ML 模型评分结果置信度的已分配业务术语。领域专家还可以通过某种方式手动修改术语分配建议。管理员在此处所做的任何更改都将导致术语分配模型重新训练。因此，下次我们运行发现作业时，它将推荐不同的术语分配：\n\
  \n![](img/50e1dac0750b69f2b8e8efff000eb13b_87_1.png)\n\n图 4.10 – 自动术语分配的快速扫描详细报告\n\
  \n我们现在已经了解了如何利用数据发现自动化，以及如何将业务术语分配给技术资产。接下来，我们将讨论平台的数据质量能力。\n\n### 用数据质量建立信任\n\n\
  数据质量是企业运营的基石，它受到数据输入、存储和管理方式的影响。对信息缺乏信心的原因是信息在整个组织中无处不在。我们面对的是多年来积累的碎片化数据孤岛，这些数据没有经过数据质量衡量，也没有以对业务有意义的方式组织。\n\
  \n高质量的数据对于使用数据执行的任何分析获得高质量结果至关重要。数据质量涉及以下方面：\n\n- **完整性：** 充分了解所有相关数据资产。\n- **准确性：**\
  \ 必须消除常见的数据问题，如缺失值、不正确的参考数据等，以确保我们拥有一致的数据。\n- **可用性：** 数据必须按需可用。\n- **及时性：** 数据的最新程度对于做出正确决策至关重要。\n\
  \nCloud Pak for Data 的数据质量分析区域执行以下任务：\n\n- 运行列分析\n- 评估质量维度以识别数据质量问题\n- 为数据资产和列计算数据质量得分\n\
  - 运行质量规则和自动化规则\n- 可选地捕获存在数据质量问题的样本数据\n\n完成数据质量分析后，你可以将结果发布到治理目录，以便平台的其他使用者受益于该分析。\n\
  \n### 评估数据质量的步骤\n\n让我们使用平台的自动发现功能来了解数据质量评估能力。我们将针对其中一种可能场景执行的高级步骤如下：\n\n- 1. 定义到数据源的连接。\n\
  - 2. 通过选择以下一个或多个选项启动自动发现过程：\n  - 分析列。\n  - 分析数据质量。\n  - 分配术语。\n  - 将结果发布到目录。\n-\
  \ 3. 一旦发现数据资产，我们必须审查以下内容：\n  - 分析结果\n  - 数据质量分析\n  - 数据分类\n  - 术语分配\n- 4. 然后，我们将查看数据质量项目，并查看数据质量分析过程的详细信息：\n\
  \n\n\n自动发现作业完成所需的时间取决于表的数量、数据的量以及是否使用了数据采样：\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_92_0.png)\n\
  \n图 4.14 – 数据质量仪表板\n\n实现期望的数据质量是一个不断演进的过程。在这里，我们随着时间的推移不断学习，并建立一套数据质量规则来处理数据状况、监控数据质量指标，并修复我们的应用程序和/或源系统，直到我们实现期望的数据质量结果：\n\
  \n![](img/50e1dac0750b69f2b8e8efff000eb13b_93_0.png)\n\n图 4.15 – 质量规则，用于识别任何订单数量\
  \ <100 或 >1,000\n\n4. 最后，我们必须达到业务就绪状态，使数据能够被终端用户用于分析进行消费：\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_95_0.png)\n\
  \n图 4.17 – 按角色划分的示例 DataOps 工作流\n\n我们现在了解了数据整体流经的过程以及不同角色之间发生的交互。现在，让我们探讨如何将一些自动化引入数据质量评估。\n\
  \n### 数据质量周围的自动化规则\n\n数据质量评估将数据与一组标准进行评估。这组标准取决于数据的业务背景，包括数据代表什么信息、信息的关键性以及信息的用途。数据质量维度和自定义数据质量规则应一起使用以执行数据质量评估。数据分析提供了数据特征和分布的初始视图。自动化规则利用此信息，从数据分析到质量评估，例如检查空值或有效日期格式等。\n\
  \nCloud Pak for Data 允许我们构建和部署自动化规则。这些自动化规则有助于自动化任务以确保我们拥有最高质量的数据，包括以下内容：\n\n- 基于数据质量维度应用规则定义\n\
  - 为资产分配术语或管理员\n\n### 大规模数据集成\n\n根据 *IDC 报告* 的估计，数据科学家花费 80% 的时间来准备和管理数据以构建 AI 模型。结合\
  \ IBM 调查中 91% 的组织未有效使用其数据，这意味着企业在从数据孤岛中获取价值方面遇到困难。数据集成是技术和业务流程的结合，用于将来自不同来源的数据组合成有意义且有价值的信息。这是组织整体信息架构战略的关键方面：\n\
  \n![](img/50e1dac0750b69f2b8e8efff000eb13b_99_0.png)\n\n图 4.21 – 数据集成，企业挑战\n\nIBM\
  \ 的 DataStage 服务在 IBM Cloud Pak for Data 上提供了一种现代化的数据集成解决方案，用于在任何规模和复杂性下清理和交付可信数据，无论是在多云和混合云环境中还是跨多云和混合云环境。随着\
  \ AI 的兴起，数据集成工具的部署和使用方式发生了重大转变，原因有很多。数据量和种类增加是一个原因，但组织正在看到采用以流程为导向的方法来管理数据生命周期、提高业务绩效和增强竞争力的需求。\n\
  \n### 选择数据集成工具的考虑因素\n\n选择数据集成工具/服务时，我们应考虑以下一些关键因素：\n\n- 能够适应多云环境\n- 大规模性能\n- 与治理目录集成\n\
  - 拥有广泛的连接器，支持传统 RDBMS 源和其他非传统数据源\n- 能够跟踪血缘关系\n- 集成数据质量\n\n### 利用云原生平台进行 ETL 的优势\n\
  \n从架构角度来看，IBM Cloud Pak for Data 通过将单体堆栈分解为微服务，将数据集成引入云原生平台。采用这种现代化方法带来的一些优势包括以下内容：\n\
  \n- 能够在几分钟内部署，实现标准部署和管理，同时保留根据需要修改环境/作业参数的灵活性。\n- 由于 Kubernetes/OpenShift 中固有的高可用性，可靠性提高。\n\
  - 由于自动更新，管理负担减轻。\n- 您可以按“应用程序组”自动化管理，因此管理员可以使用命名空间来管理访问控制和配置选项。\n- 您可以使用平台级和服务级功能在应用程序级别进行监控和管理。\n\
  - 您可以独立扩展微服务以响应不断变化的需求：\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_101_0.png)\n\
  \n图 4.23 – 自动工作负载平衡\n\n将您的数据集成技术容器化使您能够在本地和云平台之间在混合云环境中运行。\n\n### 主数据管理\n\n组织拥有大量关于产品、服务、客户和交易的数据，从所有这些数据中获取洞察对于保持竞争优势非常重要。主数据管理是一个全面的流程，定义并管理组织的关键客户和产品数据。它在整个企业范围内提供数据的单一可信视图，具有敏捷的自助访问、基于分析图的探索、治理以及用户友好的仪表板，以加速产品信息管理和主数据计划。\n\
  \n### 将 MDM 扩展到数字孪生\n\n数字孪生是一个通用概念，最初源于物联网 IoT 领域，其中我们拥有物理事物的数字表示。在 MDM 的上下文中，这转化为能够捕获用户交互和派生属性的能力，这些属性可以帮助更有效地服务客户，利用我们对其的了解。这使我们超越了标准属性，例如姓名、地址、联系方式、产品详细信息等，我们会从\
  \ MDM 中获取这些信息：\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_102_0.png)\n\n图 4.24\
  \ – 将 MDM 扩展到数字孪生\n\n一旦模型被定义，将源属性映射到模型中的属性可以通过手动映射或使用 ML 驱动的自动分类属性的过程来完成。作为此步骤的一部分，还可以消除冗余属性和/或不会映射回\
  \ MDM 属性的属性：\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_104_0.png)\n\n图 4.26 –\
  \ 属性、手动和自动匹配\n\n一旦匹配过程完成，最终用户可以搜索 Person 和/或其他自定义记录类型，并按实体或单个记录类型找到结果。让我们用一个简单的例子来理解实体信息价值。每个组织都有客户资料数据，并且他们还跟踪未来业务机会的潜在客户。业务用户可以通过获得以下问题的答案从实体数据中受益：\n\
  \n- 潜在客户列表是否有重复？\n- 潜在客户列表中有多少现有客户？\n- 客户和潜在客户之间是否存在任何不明显的关联？\n- 我能否从新的信息来源获得更好的数据点？\n\
  \n## 5 BI 与报表"
- "分析：以信任和透明度构建、部署和扩展模型\n\n企业中收集了大量数据，这提供了一个独特的机会来挖掘可用于提高效率和更好地服务客户的洞察。**IBM Cloud\
  \ Pak for Data** 拥有来自 **International Business Machines Corporation (IBM)** 的大量服务，以及有助于分析数据的各个方面的第三方服务。\n\
  \n该平台面向不同的角色，包括业务分析师、数据工程师、数据科学家、数据管理员等，使跨角色协作成为可能。所有这些角色都对数据的不同方面感兴趣，并且在分析数据方面的技能各不相同，从执行定期罐装报告这样简单的需求到临时报告和仪表板，以及更高级的分析，例如统计分析、**机器学习\
  \ (ML)** 或 **人工智能 (AI)**。\n\n\n\n**Cloud Pak for Data** 凭借其集中式治理目录和仪表板服务，支持自助式分析，并能够从受治理的数据资产中放心地获取数据。\n\
  \n## \n\nBI 是一种能力，它接收业务数据并以用户友好的视图呈现，例如报表、仪表板、图表和图形。BI 工具使业务用户能够访问不同类型的数据，包括历史数据和当前数据、第三方数据和内部数据，以及半结构化数据和非结构化数据（如社交媒体）。用户可以分析这些信息，以深入了解业务的表现。虽然\
  \ BI 不会告诉业务用户该做什么，或者如果他们采取某种行动会发生什么，但 BI 也不仅仅是生成报表。相反，BI 为人们提供了一种检查数据以理解趋势并获得见解的方式。\n\
  \n### 预测性分析与规范性分析\n\n预测性分析是一种使用高级算法和 ML 处理历史数据的实践，在了解已发生情况的同时，发现未见过的数据模式、交互和关系。预测模型提供可操作的见解，但不说明基于这些见解需要采取什么行动才能获得最佳结果。\n\
  \n另一方面，规范性分析通过使用优化模型（即业务问题的数学表示）为复杂问题实现准确决策。这些优化模型使用带有复杂算法的求解器。\n\n通常，我们可能质疑应该使用预测性分析还是规范性分析。答案是两者都需要，为了说明这一点，让我们用一个简单的例子。在整个\
  \ COVID-19 大流行期间，ML 模型已被用于预测防护口罩的需求，但用规范性分析补充这一信息将有助于制定补货计划，以决定哪个配送中心应向不同地点供货，从而充分满足需求。\n\
  \n让我们首先揭开这三个概念的神秘面纱，如下所示：\n\n- **AI** — AI 系统可以被视为不受情感影响的专家系统，能够连接不同数据点，并基于模拟人类行为的复杂规则做出决策。AI\
  \ 用于预测、自动化和优化历来由人类完成的任务，例如语音识别、人脸识别、翻译等。\n- **ML** — AI 应用的一个子集，它自行学习，使用新的数据点来预测结果，并不断提高准确性。\n\
  - **DL** — ML 的一个子集，其中神经网络从大量数据中学习。DL 算法重复执行任务，并通过支持渐进式学习的深层逐步改进结果。\n\n下图展示了 AI、ML\
  \ 和 DL 之间的关系：\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_111_0.png)\n\n图 5.2 –\
  \ AI 的类型\n\n在对 AI、ML 和 DL 有了更好的理解之后，我们现在来看看 ML 项目现有方法论以及新时代 AI 应用将见解转化为行动的其他注意事项。\n\
  \n## AI 生命周期——将见解转化为行动\n\n正在进行数字化转型的企业将 AI 融入其应用程序；需要一套明确且稳健的方法论来管理 AI 流水线。传统上，**跨行业数据挖掘标准流程（CRISP-DM）**方法论被用于\
  \ ML 项目，在我们探讨实施 AI 驱动应用程序所面临的挑战以及更全面的 AI 生命周期如何有助于这一过程之前，理解这一方法论非常重要。\n\nCRISP-DM\
  \ 是一个开放标准流程模型，描述了执行数据挖掘项目所涉及的方法和步骤。它可分为六个主要阶段，如下所示：\n\n- **业务理解**\n- **数据理解**\n\
  - **数据准备**\n- **模型构建**\n- **模型评估**\n- **模型部署**\n\n这些阶段的顺序并不严格，通常是一个迭代过程。下图中箭头表示不同阶段之间最重要、最常见的依赖关系，而外圈则象征着数据挖掘的循环性质：\n\
  \n![](img/50e1dac0750b69f2b8e8efff000eb13b_112_0.png)\n\n图 5.3 – 分析生命周期\n\n这在过去效果很好，但随着收集的数据量不断增加，我们现在必须考虑数据的体量、多样性和速度，以及它们如何影响\
  \ AI 生命周期。这意味着我们需要更加重视数据收集、数据治理和持续模型评估阶段。模型评估不再仅仅是评估模型的质量，还有其他考虑因素，包括所部署模型的公平性和可解释性。\n\
  \n以下是启用此 AI 生命周期时的一些关键注意事项：\n\n- 降低构建和运营 AI 的技能要求\n- 通过减少日常琐碎任务来加快交付时间\n- 通过优化模型准确性提高\
  \ AI 融合应用程序的就绪度\n- 提供 AI 模型的实时治理，提高信任和透明度\n\n在对 AI 应用程序的其他注意事项有了充分了解之后，我们接下来将深入探讨\
  \ AI 治理的必要性，将其作为新时代 AI 应用中信任和透明度的基础。\n\n### AI 治理：信任与透明度\n\nAI 在各个行业中无处不在——从推荐引擎到跟踪\
  \ COVID-19 病毒的传播。AI 的这种应用使组织能够创新并提高效率，但也带来了围绕如何使用 AI 制定业务决策的风险。\n\n一般来说，治理通常涉及谁对数据负责、数据如何处理、企业中谁有权查看特定数据集，以及他们如何使用数据。这种建立治理框架以保护数据和消费者的相同概念也适用于\
  \ AI 模型，AI 模型可能会对某些个人或群体表现出不公平或有偏见（或两者兼有）的行为。\n\n数据治理已经发展了一段时间，并且有成熟的方法论和最佳实践，但我们现在需要为\
  \ AI 模型做类似的事情。传统数据治理面临的挑战是数据量的不断增长，以及需要识别数据/技术资产并将其与组织成主题和逻辑区域的业务资产保持一致，并制定规定数据资产使用的政策和规则。然而，对于\
  \ AI 模型，有几个考虑因素，包括以下这些：\n\n- 模型的多个版本\n- 用于训练模型的不同输入数据集\n- 关于模型输入属性的任何/所有转换的流水线信息\n\
  - 用于训练模型的算法/技术\n- 超参数优化\n- 用于构建和测试模型的训练/测试数据集\n\n可解释 AI 不仅在于能够解读模型输出，还在于能够解释模型是如何构建的、使用了哪些输入数据选择流程和过滤器、所选数据集是否符合组织政策和规则，以及所选数据集中是否存在故意或无意的偏见。\n\
  \n### 使用 Cloud Pak for Data 自动化 AI 生命周期\n\n当组织能够收集其数据并使用可信的治理目录进行组织后，现在可以利用这些数据来构建和扩展整个业务范围内的\
  \ AI 模型。要从头构建 AI 模型并将其扩展到整个业务，组织需要涵盖完整 AI 生命周期的能力，包括以下内容：\n\n- **构建** — 这是公司构建其\
  \ AI 模型的地方。\n- **运行** — 模型构建完成后，需要将其部署到应用程序或业务流程中投入生产。\n- **管理** — 模型构建并运行后，问题就变成了：*如何以信任和透明的方式扩展它？*\
  \ 为了解决复杂的构建和运行环境，企业需要一种工具，既能管理环境，又能解释其模型是如何得出预测的。\n\n让我们使用 Cloud Pak for Data 实践\
  \ **模型运维**（**ModelOps**），以了解该平台如何用于自动化 AI 生命周期。ModelOps 是一种构建数据科学资产的方法论和流程，能够快速从开发阶段进入生产阶段。\n\
  \n\n下表展示了可用于构建文本数据分类模型的工具：\n\n| 工具 | 代码编辑器 | 图形画布 | 自动化工具 |\n|---|---|---|---|\n\
  | Jupyter Notebook | ✓ |  |  |\n| JupyterLab | ✓ |  |  |\n| RStudio | ✓ |  |  |\n\
  | SPSS Modeler |  | ✓ |  |\n| 实验构建器 |  | ✓ |  |\n\n图 5.9 – 可用于文本数据分类的工具\n\n下表展示了用于图像数据的工具：\n\
  \n| 工具 | 代码编辑器 | 图形画布 | 自动化工具 |\n|---|---|---|---|\n| Jupyter Notebook | ✓ |  |\
  \  |\n| JupyterLab | ✓ |  |  |\n| RStudio | ✓ |  |  |\n| 实验构建器 |  | ✓ |  |\n\n图\
  \ 5.10 – 可用于图像数据分析和处理的工具\n\n我们已经了解了处理不同类型数据的工具/技术。现在，让我们探讨建立协作开发环境的过程。\n\n### 建立协作环境\n\
  \n在AI生命周期的构建AI模型阶段，数据科学家需要与数据工程师和其他数据科学家协作来构建AI模型，这可能涉及共享数据资产和/或现有数据管道。对于给定的用例，数据科学家在选出最佳模型之前会训练数十或数百个AI模型。为了支持并最大化数据科学团队的生产力，Cloud\
  \ Pak for Data 支持多种协作模式，包括以下方式：\n\n- 不使用 Git 的本地项目协作\n- 通过 Git 协作\n\n本地协作模式使所有协作者可以在项目中的同一份资产副本上工作。任何由某个用户（例如笔记本）正在更新的资产都会被锁定，直到该用户或管理员解锁为止。这样可以使更改立即对所有协作者可用。\n\
  \n对于有编程/脚本语言经验的数据科学家，他们可以选择使用 Jupyter 笔记本界面，结合不同的运行时，以编程方式进行数据转换。\n\n以下截图展示了 Cloud\
  \ Pak for Data 中类似 Excel 的数据整理界面：\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_123_0.png)\n\
  \n图 5.13 – 面向非抽取、转换、加载（ETL）开发人员的数据整理\n\n一旦数据按照所需格式完成结构化，下一步就是使用这些数据训练模型，以帮助预测目标变量。\n\
  \n### 模型构建\n\n一旦数据完成转换并具有所需的形式，下一步就是决定使用哪种算法并以此构建模型。您可以选择使用编程接口或拖放式用户界面（UI）。Cloud\
  \ Pak for Data 支持 Jupyter Notebook、JupyterLab 笔记本和 RStudio 界面，以利用现有的库/模块/综合 R 档案网络（CRAN）包来构建机器学习模型。\n\
  \nCloud Pak for Data 还包含 SPSS Modeler 流程服务，这是一个拖放式界面，可用于获取数据、应用转换、训练和评分机器学习模型。其中提供丰富的调色板节点，范围从导入操作到字段/记录操作、建模和可视化。\n\
  \n以下截图展示了用于数据准备、统计分析、模型构建、推理和可视化的拖放式界面：\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_124_0.png)\n\
  \n图 5.14 – 用于可视化模型构建的 SPSS Modeler 流程\n\n现在我们已经介绍了使用数据并训练模型以帮助预测目标变量的步骤，接下来将带您了解\
  \ Jupyter Notebook 界面的加速器。\n\n### Jupyter Notebook 界面的加速器\n\n虽然 Jupyter Notebook\
  \ 是开源软件，但 Cloud Pak for Data 通过添加企业级功能（如 Git 集成）以及加速器（如目录中资产的代码生成）增强了使用 Jupyter\
  \ Notebook 界面的体验。\n\n在配置部署时，我们不仅可以将部署定义为在线或批量模型部署，还可以灵活地指定实际部署的硬件规格。模型部署后，开发人员可以使用多种语言的软件开发工具包（SDK）对模型进行评分并使其投入运营。UI\
  \ 还允许通过传递输入负载来测试部署模型。\n\n以下截图说明了使用 Cloud Pak for Data 中的 Watson Machine Learning\
  \ 服务测试部署模型：\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_127_0.png)\n\n图 5.17 – 使用\
  \ Watson Machine Learning 进行模型测试\n\n现在我们已经介绍了模型部署，接下来让我们探讨 ModelOps 监控阶段。\n\n###\
  \ ModelOps – 监控阶段\n\n构建和部署模型只是 AI 生命周期中的一小部分。管理已部署的模型并确保其准确且符合监管要求（如**系统需求（SR）11-7**）则完全是另一回事。IBM\
  \ Cloud Pak for Data 提供了一系列内置功能，以确保信任和透明度。这包括对训练数据和 AI 模型进行治理以确保合规性，例如模型可解释性、用于捕获模型元数据和审计谱系的事实表、模型监控以及跨\
  \ IBM 和非 IBM 部署自动训练模型。随着越来越多的企业将 AI 投入运营，将治理融入其中并以信任和透明度大规模管理模型已成为重中之重，而 IBM 是交付这一能力的最佳之选。\n\
  \n随着企业经历数字化转型并通过融入 AI 来现代化应用，需要更深入地了解 AI 模型提出的建议。在金融和医疗保健等某些行业，存在诸如**通用数据保护条例（GDPR）**等法规，这些法规对\
  \ AI 的广泛采用构成了重大障碍。应用程序必须能够解释其结果，才能用于生产系统。因纳入 AI 而做出的每个决策都需要可追溯，使企业能够审计模型及其相关训练数据的谱系，以及每个基于\
  \ AI 的建议的**输入和输出（I/O）**。\n\nIBM Cloud Pak for Data 中的 OpenScale 服务使企业能够大规模运营和自动化\
  \ AI，无论 AI 系统是如何构建的以及在哪里运行，都弥合了运营 AI 系统的团队与管理业务应用程序的团队之间的差距。由于 AI 决策现在是可以解释的，企业现在对其充满信心。\n\
  \nCloud Pak for Data OpenScale 服务支持以下功能：\n\n- 部署在任何运行时环境中的 AI（例如**Amazon Machine\
  \ Learning（Amazon ML）**、**Azure Machine Learning（Azure ML）**以及企业防火墙后面的自定义运行时环境）\n\
  - 使用任何开源模型构建和训练**集成开发环境（IDE）**开发的应用程序以及 ML 和 DL 模型，包括 TensorFlow、scikit-learn、Keras、SparkML\
  \ 和 PMML\n\n在运行时监控偏差并主动通知以便我们采取行动非常重要。OpenScale 监控发送到模型的数据以及模型预测。然后，它会识别偏差问题并通知用户。在理解如何处理偏差之前，让我们先回顾一些核心概念，如下所示：\n\
  \n- **公平性属性：** 偏差通常是在某个属性的背景下衡量的，例如性别、年龄等。也可以是非人口统计属性，例如账户信息、一个人成为客户的时间长度等。\n- **受监控/参考组：**\
  \ 这是我们要测量偏差的数据集子集。公平性属性的其余值可以称为参考组。如果我们想衡量对男性的性别偏见，则女性将被视为参考组。\n- **差异性影响：** 这是一种偏差度量，可以计算为受监控组有利结果百分比与参考组有利结果百分比的比率。如果差异性影响值低于某个预定义阈值，则认为存在偏差。\n\
  - **偏差阈值：** 如果偏差阈值为 1，则意味着我们期望受监控组和参考组获得相同的预测结果。\n\n以下截图说明了使用 Watson OpenScale 检测偏差：\n\
  \n![](img/50e1dac0750b69f2b8e8efff000eb13b_130_0.png)\n\n图 5.19 – 使用 Watson OpenScale\
  \ 进行偏差检测\n\n\n\n\n在我们已经探讨了检测 AI 偏见对业务运营带来的价值之后，让我们接下来看看数据扰动是如何工作的，以及 OpenScale 服务如何利用这一技术作为与其他偏见检测方案相比的差异化优势。\n\
  \n### 数据扰动\n\nOpenScale 服务使用数据扰动技术作为与其他偏见检测方案相比的差异化优势。让我们用一个 100 起保险索赔的示例场景来说明。在这些索赔中，60\
  \ 起由 18-24 岁年龄段的人提出，40 起由 24 岁以上的人提出。18-24 岁年龄段的所有人都具有非常高的索赔频率，并且已知过去曾进行过欺诈性索赔，因此模型拒绝了该年龄段的所有\
  \ 60 起索赔。另一方面，24 岁以上的 40 起索赔全部被模型批准。对于这种情况，不一致影响为 0/1=0，导致模型被标记为有偏见。然而，模型本身并无偏见，它是基于提供给它的数据。OpenScale\
  \ 利用数据扰动来避免这种情况。\n\n数据扰动的工作原理是通过用来自参考组的随机值翻转受监控组中的记录，然后将扰动后的值发送给模型。记录的其他所有特征保持不变。现在，经过扰动后，如果模型预测前述示例中的索赔被批准，那么就意味着模型仅基于客户年龄做出决策，从而表现出有偏见的行为。因此，在计算偏见时，我们会进行数据扰动，并使用负载和扰动后的数据计算不一致影响。这将确保我们仅在模型在原始数据和扰动数据中表现出有偏见行为的足够数据点上才报告偏见。因此，我们能够检测模型中是否存在真正的偏见，而不会受到模型接收到的数据类型的影响。\n\
  \n### 比较模型质量、公平性和漂移\n\nCloud Pak for Data 中的 OpenScale 服务使您能够跨不同提供商和算法监控多个模型，使客户能够在一段时间内以及跨不同版本（生产/预生产）比较性能。\n\
  \nLIME 将所有模型视为黑盒，并生成易于理解的解释。然而，这也要求 LIME 理解数据点附近的模型行为。这可能导致成本增加，因为需要更多的评分请求。OpenScale\
  \ 服务采用了一种创新的基于缓存的技术，从而显著减少了生成局部解释所需的评分请求数量。除了降低成本外，生成解释的速度也有显著提升。OpenScale 服务还增加了容错功能，以应对评分请求中的间歇性失败。\n\
  \n第二个可解释性算法提供对比解释。该算法专为处理接受结构化数据的模型而设计，并且能够以远少于开源替代方案的评分请求生成对比解释。\n\n### 模型漂移\n\n\
  模型漂移是指由于底层数据及其与 I/O 变量之间关系的变化而导致的模型性能下降。模型漂移会随着时间推移产生负面影响，有时也可能突然发生漂移，导致模型行为不理想。为了有效检测和缓解漂移，组织需要作为其数据和\
  \ AI 平台的一部分定期监控和管理模型性能。这种集成方法具有以下优势：\n\n- 能够持续跟踪指标，并在准确性和数据一致性漂移时发出警报。\n- 能够定义目标并在开发、验证和部署过程中跟踪这些目标。\n\
  - 简化识别受模型漂移影响的业务指标的步骤。\n- 自动化漂移监控可最大程度地减少模型性能下降的影响。\n\nOpenScale 服务检测准确性和数据的漂移。准确性漂移的估计是在模型运行时进行的。如果未被模型训练数据集覆盖的交易增加，模型准确性通常会下降。这种类型的漂移仅针对结构化二元和多类分类模型计算。\n\
  \n以下屏幕截图说明了持续监控模型并随时间评估模型质量的能力：\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_134_0.png)\n\
  \n图 5.21 – 随时间推移的模型评估\n\n现在我们已经探讨了预测分析方面的功能，让我们接下来看看如何处理流数据并使用 Cloud Pak for Data\
  \ 中的服务进行分析。\n\n### 流数据/分析\n\n数据以快速的速度增长，数据的种类和复杂性也在不断增加。每天，我们会产生 2.5 千万亿字节的数据，传统分析解决方案无法充分释放这些数据的潜在价值。Cloud\
  \ Pak for Data 拥有 IBM Streams 服务来满足流数据需求。这包括 API、应用程序的 IDE 以及可在单个或分布式资源集上运行应用程序的运行时系统。Streams\
  \ 服务旨在满足以下数据处理平台目标：\n\n- 并行和高性能流处理\n- 连接到各种关系数据库、非关系数据源以及多个流数据源，包括 IBM Event Streams、超文本传输协议（HTTP）和物联网（IoT）\n\
  - 对实时数据流应用从简单到高级的分析方法，包括 ML\n- 流处理应用程序的自动部署\n- 增量部署，无需重启即可扩展流处理应用程序\n- 安全且可审计的运行时环境\n\
  \n开发分析流数据的应用程序有多种方式，如下所述：\n\n- 来自 Cloud Pak for Data 项目内的 Streams 流\n- 来自 Cloud\
  \ Pak for Data 项目中 Jupyter notebook 的 Streams Python API\n- Streams Python API 和任何文本编辑器或\
  \ Python IDE\n\n现在，让我们继续讨论分布式处理。\n\n### 分布式处理\n\nCloud Pak for Data 服务利用 Red Hat\
  \ OpenShift 平台在集群中的计算节点上调度来自不同服务的负载。在某些情况下，我们可能没有集群容量，或者希望在远程位置运行负载，无论是由于数据位置还是监管要求规定了工作负载在地理上的执行位置。Cloud\
  \ Pak for Data 提供了以下两种分布式处理选项：\n\n- Apache Hadoop 服务的执行引擎\n- Edge Analytics 服务\n\
  \nApache Hadoop 服务的执行引擎使您能够从 Watson Studio 分析项目中创建 Hadoop 环境定义和 **Jupyter Enterprise\
  \ Gateway (JEG)** 会话，以便在 Hadoop 集群上远程运行作业。可以使用此服务完成以下任务：\n\n- 在 Hadoop 集群上训练模型\n\
  - 在 Hadoop 集群上管理模型\n- 预览和优化 Hadoop 数据（**Hadoop 分布式文件系统（HDFS）**、Hive 和 Impala）\n\
  - 在 Hadoop 集群上运行 Data Refinery 流\n- 安排 Python 或 R 脚本作为作业在 Hadoop 集群上远程运行\n\n下图说明了使用\
  \ Hadoop Integration 服务将处理推近数据所在位置的 Cloud Pak for Data 分布式处理：\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_136_0.png)\n\
  \n图 5.22 – 使用 Hadoop Integration 的分布式处理\n\nCloud Pak for Data 中的 Edge Analytics\
  \ 服务支持以下用例：\n\n- **更快洞察和行动**：当需要实时检测情况并采取行动时，集中式分析方法可能不是最有效的，因为它会增加太多网络延迟，无法立即采取时间关键的行动。\n\
  - **持续运行**：将分析移至边缘，靠近设备，也可支持即使与 **广域网（WAN）**/数据中心/云断开连接也必须继续提供关键功能的设备。\n- **更好的数据和成本控制**：随着在传统数据中心之外边缘产生的数据量大规模增长，需要以成本有效的方式收集和分析这些数据。Edge\
  \ Analytics 允许在源头过滤数据，在不需要更精细细节的地方在源头聚合数据，并在边缘处理敏感数据。\n\n\n\n"
- "## 多云战略与 Cloud Satellite\n\n混合多云支持是 Cloud Pak for Data 的基础支柱，而能够在任意位置（私有云或任何公有云）部署和运行的功能一直是\
  \ Cloud Pak for Data 的关键差异化优势之一。在本章中，我们将进一步了解所支持的公有云和私有云、Cloud Pak for Data 即服务的演进，以及\
  \ IBM 在第三方云上支持托管服务的战略。我们将探讨 IBM 多云支持背后的业务和技术概念，并简要介绍 IBM Cloud Satellite。这将帮助客户利用\
  \ IBM 技术制定有效的多云战略。\n\n我们将讨论以下主要主题：\n\n- IBM 的多云战略\n- 支持的部署选项\n- Cloud Pak for Data\
  \ 即服务\n- IBM Cloud Satellite\n- 面向多云未来的数据编织\n\n### IBM 的多云战略\n\nIBM 是少数从第一天起就拥抱混合多云战略的技术供应商之一，这一点从\
  \ IBM 支持的部署选项中可见一斑。能够部署到任何位置是 Cloud Pak for Data 的一个关键差异化优势。虽然软件和系统部署选项最受客户欢迎，但从长远来看，Cloud\
  \ Pak for Data 即服务才是 IBM 的战略方向。Cloud Pak for Data 的即服务托管版本于 2020 年在 IBM Cloud 上推出，现在通过\
  \ Cloud Satellite 支持在第三方云上运行，我们将在本章后面详细讨论。\n\n即服务的价值主张在于，它让客户无需安装、管理或更新，即可实现数据收集、组织、分析及\
  \ AI 注入方式的现代化。本质上，你可以获得一体化数据与 AI 平台（即 Cloud Pak for Data）的所有优势，而无需承担管理基础设施或软件的额外负担。\n\
  \n![](img/50e1dac0750b69f2b8e8efff000eb13b_140_0.png)\n\n图 6.1 – IBM 的混合多云战略\n\n\
  随着对软件即服务（SaaS）的需求不断增长，Cloud Pak for Data 即服务已成为 IBM 的战略重点。此外，IBM 推出了 Cloud Satellite，以便在本地和第三方云上交付\
  \ SaaS。其目标是让客户拥有灵活的自主选择权，使他们能够在所选的基础设施上使用软件和 SaaS，例如本地私有云（x86、Power、Z）或 IBM Cloud、AWS、Azure\
  \ 等公有云。接下来，我们将介绍支持的部署选项。\n\n### 支持的部署选项\n\nCloud Pak for Data 提供三种部署选项：软件、系统和即服务，让客户在选择部署和运行软件的位置以及\
  \ Cloud Pak for Data 的管理方式方面拥有很大的自主权：\n\n- Cloud Pak for Data **软件**可运行于任何私有云或公有云，包括\
  \ AWS、Azure 和 GCP。同时支持托管式 **IBM Cloud 上的 OpenShift（ROKS）**、托管式 **AWS 上的 OpenShift（ROSA）**\
  \ 和托管式 **Azure 上的 OpenShift（ARO）**。\n- Cloud Pak for Data **系统**是一个真正的即插即用、一体化企业数据与\
  \ AI 平台，包含所有必需的硬件和软件组件。\n- Cloud Pak for Data *即服务*通过 **IBM Cloud Satellite** 在\
  \ IBM Cloud 和 AWS 等第三方云上运行。\n\n对于尚不能接受公有云或更倾向于非 IBM 云的企业客户，可用选项如下：\n\n- **私有云**：Cloud\
  \ Pak for Data 软件随附嵌入式 Red Hat OpenShift，使客户能够在自己的数据中心部署和运行云原生数据与 AI 平台。另外，客户也可以选择\
  \ Cloud Pak for Data 系统，这是一款预装硬件和软件的一体化设备，针对端到端数据与 AI 工作负载进行了优化。\n- **第三方云**：Cloud\
  \ Pak for Data 软件支持在所有主流公有云上运行，包括 AWS、Azure 和 GCP，既可以直接运行在它们的云基础设施上，也可以运行在它们的托管式\
  \ OpenShift 服务上，例如 **AWS 上的 Red Hat OpenShift（ROSA）** 或 **Azure Red Hat OpenShift（ARO）**。\n\
  \n### 托管式 OpenShift\n\nRed Hat 已在所有主流云供应商（包括 IBM Cloud、AWS、Azure 和 GCP）上推出托管式 OpenShift\
  \ 服务。客户可以运行自己的工作负载（包括 Cloud Pak for Data 工作负载），而无需担心 OpenShift 的维护、管理和升级，这对非技术人员来说并非易事。\n\
  \nIBM Cloud Pak for Data 目前可在三种主要的托管式 OpenShift 服务上使用并获得支持，分别是 IBM Red Hat ROKS、Amazon\
  \ ROSA 和 Microsoft ARO。托管式 OpenShift 的主要价值主张包括四个关键点：\n\n- **节省时间**：Red Hat 负责管理\
  \ OpenShift，让客户可以专注于数据和 AI 工作负载。此外，交付管道已预先集成用户友好的管理工具，简化了管理和运维 Cloud Pak for Data\
  \ 所需的工作。\n- **一致性**：基于 Red Hat OpenShift 的多云可随处运行，包括公有云和本地环境，混合支持使部署方式更灵活。此外，它让客户能够专注于一种跨越所有部署选项的\
  \ Kubernetes 发行版（即 OpenShift），并在该领域积累技能。\n- **可移植性**：Red Hat OpenShift 工作负载可在任何主流云供应商上以一致的方式运行，为客户提供所期望的选择和灵活性。更重要的是，这使客户能够在需要时将工作负载从一个云供应商迁移到另一个云供应商。\n\
  - **可扩展的 Red Hat OpenShift**：无论部署在哪里，都可以通过同一个 Red Hat 账户控制版本和许可。\n\n以下是提供商作为托管式\
  \ OpenShift 服务一部分所管理的所有项目：\n\n- 自动预置和配置基础设施（计算、网络和存储）。\n- 自动*安装和配置 OpenShift*，包括高可用性跨可用区配置。\n\
  - 自动升级所有组件（操作系统、OpenShift 组件和集群内服务）。\n- 对操作系统和 OpenShift 进行安全补丁管理。\n- 自动执行 OpenShift\
  \ 组件和工作节点的故障恢复。\n- OpenShift 配置的自动扩展。\n- 自动备份 OpenShift 核心 ETCD 数据。\n- 与云平台的内置集成——监控、日志记录、Key\
  \ Protect、IAM、Activity Tracker、Storage、COS、Security Advisor、Service Catalog、Container\
  \ Registry 和 Vulnerability Advisor。\n- 内置负载均衡器、VPN、代理、网络边缘节点、私有集群和 VPC 功能。\n- 内置安全性，包括镜像签名、镜像部署强制和硬件信任。\n\
  - 24/7 全天候全球**站点可靠性工程（SRE）**，用于维护环境健康并提供 OpenShift 支持。\n- 全球 SRE 团队在 IBM Cloud 基础设施、Kubernetes\
  \ 和 OpenShift 方面拥有丰富的经验和技能，因此可以*更快地解决问题*。\n- 为你的 OpenShift 环境提供自动合规性（HIPAA、PCI、SOC2\
  \ 和 ISO）。\n- 一键扩容。\n- 在**多可用区区域（MZR）**中自动进行多可用区部署，并与**云互联网服务（CIS）**集成以实现跨可用区流量路由。\n\
  - 自动执行操作系统性能调优和安全加固。\n\n### AWS 快速入门\n\n在 AWS 上，Quick Start 指的是可自动部署工作负载的模板（脚本）——此处即\
  \ Cloud Pak for Data。Quick Start 会在 3 小时或更短时间内启动、配置并运行在 AWS 上部署 Cloud Pak for Data\
  \ 所需的计算、网络、存储以及所有其他相关 AWS 基础设施。对于有兴趣在 AWS 上运行 Cloud Pak for Data 的客户来说，这是一个重要的价值主张。它通过自动化节省了时间（消除了手动安装配置所需的许多步骤），并帮助客户在设计上遵循\
  \ AWS 最佳实践。\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_143_0.png)\n\n图 6.2 – AWS\
  \ 上的 Cloud Pak for Data – 价值主张\n\n\n\n\n\nAWS Quick Start 的其他优势包括 Cloud Pak for\
  \ Data 最长 60 天的免费试用以及详细的部署指南。但是，它需要一个 AWS 账户——客户需承担基础设施成本。在存储方面，客户有两种选择：OpenShift\
  \ Container Storage（OCS），最近更名为 OpenShift Data Foundations（ODF），或者 Portworx。\n\n\
  ![](img/50e1dac0750b69f2b8e8efff000eb13b_144_0.png)\n\n图 6.3 – Terraform 自动化\n\n\
  Terraform 自动化也可在 AWS、Azure 和 IBM Cloud 上使用，其优势包括：\n\n-   轻松实现全栈部署，确保一致性和可重复性\n-\
  \   通过基础设施即代码提高生产力，编写并执行代码，在几分钟内定义、部署和更新你的基础设施\n-   幂等性，无论运行多少次，代码都能正确工作\n-   通过自动化实现整个部署过程的自助服务，可按需调度和启动部署\n\
  \n### Azure Marketplace 和 QuickStart 模板\n\nAzure Marketplace 是一个在线应用和服务市场，非常适合对\
  \ Cloud Pak for Data 软件及其服务感兴趣的 IT 专业人员和云开发人员。它让客户只需点击几下即可发现、试用、购买和部署解决方案。与 AWS\
  \ 一样，Microsoft 要求拥有 Azure 账户，并从两种受支持的存储选项中选择一种，即 OCS 或 Portworx。此外，客户可以免费试用最长 60\
  \ 天：\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_145_0.png)\n\n图 6.4 – Azure Marketplace\
  \ 上的 Cloud Pak for Data\n\n接下来，让我们介绍 Cloud Pak for Data as a Service。\n\n### Cloud\
  \ Pak for Data as a Service\n\nIBM 的大多数数据和 AI 产品目前都以服务的形式提供，并打包在单一的 Cloud Pak for\
  \ Data 订阅中，该订阅基于消费量，允许客户只为实际使用的部分付费。此外，为了加速现有工作负载的现代化并帮助客户迁移到云/托管服务，IBM 推出了一项名为\
  \ Hybrid Subscription Advantage（HSA）的计划，为现有软件客户提供使用 SaaS 而非软件的折扣。在本节中，我们将详细介绍 Cloud\
  \ Pak for Data as a Service，包括可用的功能、定价和打包方式，以及 IBM 如何通过 HSA 帮助客户实现现代化。\n\n如前所述，Cloud\
  \ Pak for Data as a Service 允许客户现代化其收集、组织、分析和注入 AI 的方式，无需安装、管理或更新。换句话说，它帮助提供集成数据和\
  \ AI 平台的所有优势，而无需管理基础设施或软件的开销。构成 Cloud Pak for Data as a Service 的各项服务与 Cloud Pak\
  \ for Data 软件相同，现有差距已在路线图中解决。以下是可用服务的简短列表及其描述和价值主张：\n\n- 1. **IBM Watson Studio**：Watson\
  \ Studio 使机器学习和深度学习大众化，加速 AI 注入你的业务以推动创新。Watson Studio 提供一套工具和一个协作环境，供数据科学家、开发人员和领域专家使用。它包括使用\
  \ IBM Watson Machine Learning 部署模型并大规模管理它们的能力，通过 Watson OpenScale 确保准确性和治理。最后但同样重要的是，它带有\
  \ Auto AI，使普通用户只需点击几下即可构建复杂模型。\n  - a) **IBM Watson Machine Learning**：IBM Watson\
  \ Machine Learning 是一项全服务的 IBM Cloud 产品，使开发人员和数据科学家能够轻松协作，将预测能力集成到他们的应用程序中。Machine\
  \ Learning 服务是一组 REST API，你可以从任何编程语言调用这些 API 来开发应用程序，从而做出更明智的决策、解决棘手的问题并改善用户成果。\n\
  \  - b) **IBM Watson OpenScale:** IBM Watson OpenScale 在其整个生命周期中跟踪和衡量 AI 的结果，并在不断变化的业务环境中调整和治理\
  \ AI。它还有助于处理漂移可解释性和偏差检测。\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_147_0.png)\n\
  \n图 6.5 – Watson OpenScale\n\n- 2. **IBM Watson Knowledge Catalog:** 使用 IBM Watson\
  \ Knowledge Catalog 简化和组织你的企业数据，轻松实现大规模数据的查找、共享和治理。客户可以创建其数据的 360 度视图，无论数据存储在哪里（或采用何种格式），自动从众多受支持的数据源中发现数据，与其他用户协作，并通过定义策略和监控执行来控制数据访问。\n\
  \n- 3. **Data Virtualization** 使您能够跨多个系统查询数据，而无需复制和复制数据，从而节省时间并降低成本。Data Virtualization\
  \ 从其源查询数据，通过提供最新和最准确的数据简化您的分析。Data Virtualization 服务会自动将您的数据节点组织到协作网络中，以提高计算效率。您可以使用大型或小型数据源定义星座。数据永远不会缓存在云或其他设备上。此外，您私有数据库的凭据会加密并存储在您的本地设备上。\n\
  \n- 4. **IBM Db2**：一个完全托管、高性能的关系型数据存储，运行企业级 Db2 数据库引擎，IBM Db2 旨在应对地球上最艰巨的关键任务工作负载，具有自适应工作负载管理、时间旅行查询、查询联合、数据库内\
  \ AI、行/列访问控制、审计以及支持 JSON、XML 和地理空间数据集等高级功能。客户可以独立扩展和管理其部署的计算和存储需求。通过自助式托管备份到对象存储并支持时间点恢复，可以将数据恢复到任何指定时间，同时所有客户数据在传输和静态时均加密。\n\
  \  - a) **IBM Db2 Warehouse**：一个完全托管的弹性云数据仓库，可独立扩展存储和计算。它提供高度优化的列式数据存储、可操作的压缩和内存处理，以增强您的分析和机器学习工作负载。\n\
  \n- 5. **IBM DataStage** 提供业界领先的批量和实时数据集成，可在本地和混合云环境中构建可信的数据管道，允许任何集成风格（ETL 或 ELT）为\
  \ AI 准备数据。请注意，ETL 代表 **Extract, Transform, Load**（提取、转换、加载），而 ELT 是先提取和加载，然后进行处理。与您的同事一起使用\
  \ DataStage Flows，并控制对项目的管理员、编辑者或查看者访问权限。在友好的用户界面中，轻松在无代码/低代码环境中进行数据集成工作。在安全的云环境中根据需要水平或垂直扩展。利用共享平台连接以及与\
  \ Cloud Pak for Data 中其他产品的集成。\n\n- 7. **IBM Analytics Engine** 帮助使用开源 Apache Spark\
  \ 和 Apache Hadoop 开发和部署分析应用程序。使用您自己的分析库和开源包自定义集群。与 IBM Watson Studio 或第三方应用程序集成，向集群提交作业。达拉斯区域为标准小时计费和标准月度计划提供\
  \ HIPAA 就绪选项。通过选择合适的软件包、版本和集群大小，根据应用程序的要求定义集群。在需要时使用集群，并在所有作业运行完毕后再次删除它。使用第三方分析库和包自定义集群，并从\
  \ IBM Watson（如 IBM Watson Studio 和 Machine Learning）部署工作负载。基于符合 ODPi 的 Apache Spark\
  \ 和 Apache Hadoop 技术栈构建，以扩展开源投资。使用标准的开源 API 和库集成分析工具。\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_150_0.png)\n\
  \n图 6.8 – IBM Analytics Engine\n\n- 8. **IBM Match 360 with Watson** 帮助使用主数据快速构建用于分析和其他数据科学用例的数据管道。从您的\
  \ IBM MDM Advanced 或 Standard Edition 实体开始，或从知识目录中包含参与方信息的任何数据资产开始，快速将新属性映射并建模到您的数据模型中，以获得更完整的客户视图。AI\
  \ 驱动的匹配引擎利用客户信赖的统计方法加速配置，以产生准确的结果。结果可通过 RESTful API 访问，导出为平面文件，或通过实体资源管理器在线查看。使用受治理的数据资产扩展\
  \ MDM Advanced 或 Standard Edition 中的现有主数据实体。\n\n\n\n\n\n启用对主数据实体的文本搜索和查询。使用 RESTful\
  \ API 或 IBM App Connect 构建服务集成，以便在业务应用程序或数据仓库中使用。自动对字段进行分类并映射到您的数据模型，并使用以数据为先、AI\
  \ 建议的匹配属性来优化算法。内置机器学习和多年的经验可加快配置和调整实体匹配算法的速度。\n\n- 9. **Watson Assistant：** 将对话界面构建到任何应用程序、设备或渠道中。为您的应用程序添加自然语言界面，以自动化与终端用户的交互。常见应用包括虚拟代理和聊天机器人，可在任何渠道或设备上集成和通信。通过易于使用的\
  \ Web 应用程序训练 Watson Conversation 服务，该应用程序旨在让您能够快速构建应用程序与用户之间的自然对话流程，并部署可扩展、经济高效的解决方案。\n\
  \n  ![](img/50e1dac0750b69f2b8e8efff000eb13b_151_0.png)\n\n  Figure 6.9 – IBM Watson\
  \ Assistant\n\n  - a) **Speech to Text** 服务将人类语音输入转换为文本。该服务使用深度学习 AI 应用语法、语言结构以及音频和语音信号的组成知识，以准确转录人类语音。它可用于语音自动聊天机器人、客户服务呼叫中心的分析工具以及多媒体转录等多种应用。\n\
  \  - b) **Text to Speech** 服务将书面文本转换为自然听感的语音。该服务以最小延迟流式传输合成的音频。音频使用其语言和方言的适当节奏和语调，提供流畅自然的声音。该服务可用于语音自动聊天机器人，以及各种语音驱动和无屏幕应用，例如残疾人或视障人士工具、视频旁白和配音，以及教育和家庭自动化解决方案。\n\
  \  - c) **Natural Language Understanding** 有助于分析文本并从内容中提取元数据，例如概念、实体、关键词、类别、情感、情绪、关系和语义角色。使用\
  \ Watson Knowledge Studio 开发的自定义注释模型，可在非结构化文本中识别行业/领域特定的实体和关系。\n\n- 10. **Watson\
  \ Discovery** 为应用程序添加认知搜索和内容分析引擎，以识别模式、趋势和可操作的洞察，从而推动更好的决策制定。它安全地统一结构化和非结构化数据，并使用预丰富内容和简化的查询语言，消除手动筛选结果的需求。完全托管的云服务中的自动化摄取和集成自然语言处理消除了处理自然语言内容的复杂性。通过使用高级开箱即用的\
  \ AI 功能，例如自然语言查询、段落检索、相关性训练、关系图和异常检测，来发现数据中的深层联系。\n\n- 11. **开源数据库：**\n\n  - a)\
  \ **Cloudant** 是一种完全托管的 JSON 文档数据库，提供预配吞吐量容量和存储的独立无服务器扩展。Cloudant 与 Apache CouchDB\
  \ 兼容，并可通过简单易用的 HTTPS API 访问，适用于 Web、移动和物联网应用。\n  - b) **Elasticsearch** 将全文搜索引擎的强大功能与\
  \ JSON 文档数据库的索引优势相结合，创建了用于大量数据丰富分析的强大工具。IBM Cloud Databases for Elasticsearch 通过为您管理一切，使\
  \ Elasticsearch 变得更好。\n  - c) **EDB** 是基于 PostgreSQL 的数据库引擎，针对性能、开发人员生产力和与 Oracle\
  \ 的兼容性进行了优化。IBM Cloud Databases for EDB 是一种完全托管的服务，提供 24/7 运营和支持。\n  - d) **MongoDB**\
  \ 是一种 JSON 文档存储，具有丰富的查询和聚合框架。IBM Cloud Databases for MongoDB 通过为您管理一切，使 MongoDB\
  \ 变得更好。\n  - e) **PostgreSQL** 是一种功能强大、开源的对象关系数据库，具有高度可定制性。它是一款功能丰富的企业数据库，支持 JSON，让您兼得\
  \ SQL 和 NoSQL 世界的优势。IBM Cloud Databases for PostgreSQL 通过为您管理一切，使 PostgreSQL 变得更好。\n\
  \n### Packaging and pricing\n\nCloud Pak for Data as a Service 以订阅方式提供，客户按需付费，不多付费。此外，订阅积分可用于构成\
  \ Cloud Pak for Data 的任何数据和 AI 服务。这为客户提供了很大的灵活性，因为他们可以配置和使用所有范围内的服务。这些单独的服务均以具有竞争力的价格定价，以反映其提供的价值，并包含计算、内存、存储和网络等基础设施成本。\n\
  \n此外，IBM 还有一个名为 HSA 的有吸引力的计划，以激励现有本地客户将业务现代化到 Cloud Pak for Data as a Service。该计划的价值在于，现有软件客户将获得\
  \ Cloud Pak for Data as a Service 的大幅折扣，以抵消他们已支付的软件价值。当然，这假设客户将停止使用其他软件，转而使用 Cloud\
  \ Pak for Data as a Service。\n\n### IBM Cloud Satellite\n\nIBM Cloud Satellite 是\
  \ IBM Cloud 的扩展，可在客户数据中心、边缘服务器或任何云基础设施上运行。IBM 已将所有云服务移植到 Kubernetes，使不同服务能够一致运行。IBM\
  \ Cloud Satellite 扩展并利用了相同的底层概念，以 Red Hat OpenShift 作为其 Kubernetes 管理环境运行。\n\n更准确地说，每个\
  \ Cloud Satellite 位置都是在本地硬件或任何第三方公有云（如 AWS 或 Azure）上运行的 IBM Cloud 实例。此外，每个 Cloud\
  \ Satellite 位置都连接到 IBM Cloud 控制平面。该连接回 IBM Cloud 控制平面提供审计、数据包捕获和对安全团队的可见性，以及跨所有卫星位置的应用程序和服务的全局视图。IBM\
  \ Cloud Satellite Link 将 IBM Cloud 连接到其卫星位置，并提供进出所有流量的可见性。\n\nIBM 的战略是利用 Cloud Satellite\
  \ 将 Cloud Pak for Data 托管服务带到第三方云和专用本地基础设施。截至 2021 年，一部分 Cloud Pak for Data 托管服务，包括\
  \ Jupyter Notebook 和 DataStage，已在 Cloud Satellite 上提供，可部署在第三方云上。这些服务的打包和定价与 IBM\
  \ Cloud 上的方式没有区别，并且将包含运行服务的第三方云基础设施。最终目标是在您选择的<|message|> 基础设施上交付托管服务。\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_154_0.png)\n\
  \nFigure 6.10 – IBM Cloud Satellite\n\n那么，这一切是如何运作的？一旦建立了 Satellite 位置，这些 Satellite\
  \ 位置中的所有工作负载都在 Red Hat OpenShift 上运行——具体来说是 IBM Cloud 的托管 OpenShift 服务。集成到 Cloud\
  \ Pak for Data as a Service 中的服务——例如 DataStage——可以将运行时部署到这些 Satellite 位置，以便这些运行时更接近服务需要集成的[content]\n\
