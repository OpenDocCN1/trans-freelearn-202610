  \n该用例的结果是，通过此由 Cloud Pak for Data 驱动的解决方案，该客户现在拥有了改善的服务可访问时间。他们还帮助员工实时获取所需的信息。他们的未来计划包括在扩展整体治理策略的同时交付多个\
  \ AI 驱动的聊天机器人。\n\n让我们继续下一个用例，该用例与风险和控制自动化相关。\n\n### Risk and control automation\n\
  \n客户挑战是，一家大型金融机构要求其审计部门跟踪和评估有助于确定其风险暴露程度的控制措施。考虑到任何大型银行都有 250,000+ 个映射到风险的控制措施，这并不是一项轻松的任务。\n\
  \n一个良好的业务控制措施应明确说明控制措施的使用对象、内容、何时、如何以及在何处使用。银行通常因控制措施定义不明确而遭受损失。借助 Cloud Pak for\
  \ Data，该客户能够训练一个 ML 模型来预测每个书面控制措施的 *Control* 质量等级。他们使用 Watson Studio 服务来训练模型，并使用\
  \ Watson Machine Learning 来部署和运营该模型。\n\n### Enhanced border security\n\n客户挑战是，一个复杂的海关部门负责管理货物进出该国的方式，希望利用\
  \ AI 模型来识别进入该国的风险货物，同时减少识别这些风险货物的误报数量。客户使用基于规则的引擎来识别风险货物。然而，绝大多数都是误报，这导致不必要的检查并减慢了整个海关流程。\n\
  \n借助 Cloud Pak for Data，该客户能够构建一个统一平台来处理其所有数据科学需求——从发现到部署。他们使用平台连接性来访问现有数据源，使用 Watson\
  \ Studio 服务来训练 ML/AI 模型，使用 Watson Machine Learning 服务来部署和运营模型，并使用 Watson OpenScale\
  \ 来监控这些模型并理解其背后的逻辑。\n\n以下图表表示增强边境安全组件：\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_191_0.png)\n\
  \nFigure 8.4 – Enhanced border security component diagram\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_193_0.png)\n\
  \n*Figure 8.5 – Data Fabric component diagram*\n\n所展示的 **Cloud Pak for Data** 服务包括\
  \ Db2 Warehouse、MongoDB、数据虚拟化、Watson Knowledge Catalog、DataStage 和 Cognos Analytics：\n\
  \n- **Data engineer**(s)  provision 数据管理能力并填充数据——他们使用 MongoDB 实例用于运营数据，使用 Db2 Warehouse\
  \ 实例用于存储分析数据，并使用数据虚拟化实例来虚拟化驻留在 CP4D 平台和企业其他数据源中的数据。\n- **Data engineer**(s)  provision\
  \ **Extract, Transform, and Load (ETL)** 能力，使用 DataStage。这允许从各种来源获取数据，使用多种运算符对其进行转换，然后加载到目标存储库。\n\
  - **Data steward(s)** 在目录中组织数据并创建治理策略和规则。此外，他们创建数据规则以模糊数据集的部分内容，确保只有授权人员才能访问数据。\n\
  - **Data analyst(s)** 和 **Business analyst(s)** 使用易于使用的拖放 Cognos Dashboard 界面创建报告和仪表板。对于更复杂的报告/记分卡/仪表板，他们必须与\
  \ **Business Intelligence (BI)** 团队合作并利用 Cognos Analytics BI 服务。\n\n该用例的结果是，客户能够实现统一数据织物在\
  \ Cloud Pak for Data 上通过受管控的语义层改善数据访问便捷性的价值。他们轻松识别和选择队列并获得更深入见解的能力得到了极大改善，并且该平台允许更多自助式分析。\n\
  \n接下来，我们有一个关于财务规划和分析的客户用例。\n\n### Financial planning and analytics\n\n客户挑战是，一家在线分销公司希望扩展其规划运营并将跨组织协作引入规划流程。他们在扩展现有规划解决方案方面遇到挑战，该解决方案也缺乏有效的协作能力。\n\
  \n传统上，所有企业都进行 **Financial planning and analytics (FP&A)**。这涉及多个财务团队使用数百个相互连接的电子表格进行规划和报告。这是一个非常耗时、容易出错的过程，并限制了可用场景的数量和种类。在这个时代，组织希望超越财务，转向更具协作性和集成性的规划方法，即\
  \ FP&A。这涉及整个组织中的多个团队进行协作，目标是提高预测准确性并能够快速响应市场条件的变化。\n\nCP4D 中的规划分析服务帮助我们摆脱这种手动的规划、预算和预测流程，转向自动化的\
  \ AI 驱动流程。您可以识别有意义的模式并构建假设情景来创建模型。这与集成的 Cognos Analytics 服务相结合，使自助式分析成为可能，并提供令人惊艳的可视化和报告。CP4D\
  \ 凭借其数据管理能力和集中式治理目录，为分析提供受信任的数据访问。\n\n\n\n\n"
- '# 第3部分：技术细节


  本书的这一部分重点介绍 Cloud Pak for Data 的技术架构，重点关注安全性、治理、高可用性/灾难恢复（HA/DR）、多租户支持、管理和故障排除技巧，以及一些部署最佳实践。


  注意：接下来的3章在本质上技术性很强。因此，为了便于刚接触后续主题的读者理解，我们在这些章节末尾附上了额外的参考资料和引文，既作为入门材料，也作为对这些主题的深入见解，由读者自行决定（按需）参考。


  本部分包含以下章节：


  - 第9章，技术概述、管理与运维

  - 第10章，安全与合规

  - 第11章，存储

  - 第12章，多租户

  '
- "## 10 技术概述、管理与运维\n\nCloud Pak for Data 是一个数据和AI平台，使企业能够利用其数据并加速AI的采用，从而推动更好的业务成果。该平台帮助它们现代化数据访问机制、组织数据以进行可信分析、开发机器学习模型，并将AI融入日常业务流程。本章深入介绍了\
  \ Cloud Pak for Data 的基础层面、为其提供动力的技术栈，以及各服务如何集成以提供在企业中成功应用AI所需的关键能力。\n\n该平台服务于多种用户角色，使他们能够轻松地相互协作，并帮助企业打破内部孤岛。它通过抽象化基础设施元素并促进服务集成来实现这一点，从而为所有最终用户提供无缝体验。企业并非一开始就使用平台上的所有服务，而是专注于特定的用例，然后根据需要逐步扩展到其他场景。您可以有不同用户组在\
  \ Cloud Pak for Data 上处理解决方案的不同部分，同时根据需要协作和共享资产。企业甚至可以让整个部门处理不同的用例，内置隔离机制，同时为每个此类*租户*提供适当的服务质量。因此，该平台还支持即插即用机制和多租户部署模型，通过额外的IBM和/或第三方服务来扩展相同的基础平台。\n\
  \n在本章中，我们将探讨以下不同方面：\n\n- 架构概述\n- 基础设施要求、存储和网络\n- 基础服务与控制平面\n- 多租户、资源管理和安全性\n- Day\
  \ 2 运维\n\n#### 技术要求\n\n为了更深入地理解本章描述的主题，读者应熟悉以下技术和概念：\n\n- Linux 操作系统及其安全原语\n- 开发软件服务的云原生方法\n\
  - 虚拟化、容器化和 Docker 技术\n- Kubernetes（强烈推荐 Red Hat OpenShift Container Platform）\n\
  - 存储配置和文件系统\n- Web 应用程序、Linux 主机和容器的安全加固\n- Kubernetes 运算符模式（强烈推荐）\n- **kubectl\
  \ 和 oc** 命令行工具，以及处理 Kubernetes 对象所需的 YAML 和 JSON 格式\n- 在 OpenShift Kubernetes 集群上现有安装的\
  \ Cloud Pak for Data，并具有管理权限\n\n各节还将在上下文中提供关键外部参考资料的链接，以帮助您更详细地理解特定概念或获得有关该主题的一些基础背景。\n\
  \n#### 架构概述\n\n在*第1章，AI阶梯：IBM的规范性方法*和*第2章，Cloud Pak for Data——简要介绍*中，您已经了解了我们为什么首先需要这样一个平台。在本节中，我们将首先探讨究竟什么是数据和AI平台。我们将概述此类平台的要求，然后进一步深入探讨为\
  \ Cloud Pak for Data 提供动力的技术栈。\n\n#### 平台特性\n\n企业需要一个基于强大云原生原则的可靠、现代化平台，以实现业务现代化。让我们从一般角度看看这样一个现代平台需要具备哪些特性：\n\
  \n- **弹性恢复能力：** 持续可用性是企业中关键的操作要求。用户需要能够依赖一个可以自我修复并无缝故障转移的系统，而无需系统管理员手动干预。\n- **弹性伸缩：**\
  \ 企业期望平台能够随着用例和客户的发展而增长。因此，可扩展的平台是另一个关键要求。我们还需要一个能够支持按需工作负载*突发*的平台，换句话说，当新工作负载进入时自动增长，并在完成时收缩。工作负载可能只是用户并发量的增加，也可能是后台任务，甚至是计划任务。\n\
  - **成本效益：** 支持在不同类型的工作负载和租户之间平衡可用计算能力也很重要。通常，这也意味着计算能力可以轻松地转移到当时需要的工作负载上；例如，能够在夜间为数据转换或ML模型重新训练任务分配更多计算资源，而在白天为交互式用户分配更多计算资源。*生产*工作负载可能比*开发*工作负载获得优先权。因此，这要求平台控制工作负载不要跨过资源阈值，确保没有嘈杂的邻居影响性能和可靠性。\n\
  - **可扩展性：** 平台应帮助客户从一个用例开始，并在需要时进行扩展。这也意味着平台不能是单体的，而应在架构上支持即插即用模型，即可以根据需要开启能力和服务。实现企业系统和第三方系统的集成，以及利用现有投资，也是快速从平台中获取价值的关键。\n\
  - **可移植性：** 企业需要一个在不同基础设施即服务提供商（包括本地环境）之间都能以相同方式工作的平台。它们需要能够轻松突发到公有云或跨多个云。\n- **集成性：**\
  \ 数据和AI平台需要能够服务于具有不同技能水平和职责的不同用户角色。这样的平台需要促进最终用户之间的协作，使他们具备自助服务能力，而无需持续的IT支持。这意味着无缝的用户体验和API，将实现的复杂性从其使用者那里抽象出来。\n\
  - **安全性：** 平台必须使企业能够安全地运营，使来自多个供应商的最终用户工作负载或服务能够在明确界定的边界内运行。数据和AI平台还需要确保企业满足合规要求。由于基础设施成本的经济性通常意味着使用共享计算和存储资源来支持多个租户，因此确保数据安全和租户工作负载隔离的技术成为企业的根本。\n\
  \n#### 技术基础\n\n在前面的章节中，我们介绍了**Kubernetes** [1] 和**Red Hat OpenShift Container Platform**\
  \ [2] 作为为所有 Cloud Paks 提供动力的核心基础设施。在本节中，我们将探讨使这项技术成为交付数据和AI平台的理想载体的能力。\n\n\n\n\n\
  \nKubernetes 本质上是一个高度弹性且可扩展的平台，用于编排和运行容器化工作负载。它体现了微服务架构模式，使更小、独立的服务的持续开发和部署成为可能：\n\
  \n- **Resilient:** Kubernetes 使容器化工作负载能够在多个计算节点上集群化。Kubernetes 监控工作负载（“Pods”），并通过健康探测，在检测到故障时可自动重启它们。即使出现计算节点故障，它也可以自动将工作负载迁移到其他节点。这对于建立\
  \ *multi-zone* 可用性非常有效，在这种情况下，工作负载可以承受整个区域的停机。\n\n- **Elasticity:** 计算的扩展通过向集群引入额外的计算节点优雅地处理。Kubernetes\
  \ 将整个 CPU 核心和内存集合视为资源池，并可根据需要将其分配给 Pods。它还支持副本和 **load balancing** 的概念，其中工作负载可以通过多个副本（Pod\
  \ 副本）进行扩展。Kubernetes 然后可以以轮询方式自动将请求路由到不同的副本，同时考虑那些在任何时刻可能不健康的副本。\n\n- **Infrastructure\
  \ abstraction:** 使用 Kubernetes，工作负载使用更高级别的构造进行部署，而无需了解托管它的 **compute infrastructure**\
  \ ——无论是在本地还是在云中，或使用哪种 hypervisor。Pods 会根据所需的计算量（CPU 核心和内存）无缝调度到不同的 worker 节点上。Kubernetes\
  \ 还包括使用供应商无关框架使用 **storage** 进行持久化的能力，这使企业能够使用更广泛的存储技术，包括利用企业中可能已有的现有存储解决方案。软件定义的\
  \ **networking**，以及 OpenShift 路由和入口的概念，以及服务发现模式，也确保工作负载免受网络复杂性的影响。\n\n- **Portable\
  \ and hybrid cloud-ready:** OpenShift Container Platform 在许多云 Infrastructure-as-a-Service\
  \ 超大规模环境中提供标准化的 Kubernetes 运行环境，甚至作为服务提供，也可在虚拟机和裸机节点之上本地部署。Kubernetes 作为开源社区蓬勃发展，而这带来了不同版本和\
  \ API 兼容性的挑战。OpenShift 确保 Kubernetes 具有一致的发布周期，并在任何地方都提供完全验证和 *security-hardened*\
  \ 的容器平台。这确保企业可以在任何需要的地方部署其应用程序或迁移到另一朵云，而不会被锁定在最初的 Infrastructure-as-a-Service 选择中。\n\
  \n- **A rich developer ecosystem:** Kubernetes 已迅速成为云原生应用程序的首选开发平台。OpenShift Container\
  \ Platform 通过以开发人员为中心的<|message|>能力进一步扩展了这一点，包括丰富 **continuous delivery/continuous\
  \ integration (CI/CD)** 的概念。专注于安全开发和运营，OpenShift Container Platform 使企业能够快速创新，以开发现代云原生应用程序和解决方案。\n\
  \n- **Enterprise and multi-tenancy ready:** Kubernetes，尤其是其命名空间、资源配额和网络策略的概念，可以优雅地支持租户之间的隔离。**OpenShift\
  \ Container Platform** [2] 引入了额外的安全构造，包括 SELINUX 主机原语，大大提高了以经济高效的方式在多个租户之间安全共享 OpenShift\
  \ 集群的能力。\n\n因此以及更多原因，IBM Cloud Pak for Data 由 Red Hat OpenShift Container Platform\
  \ 提供支持。这使 Cloud Pak for Data 能够在任何云中提供开放、可扩展、可靠和安全的 数据和 AI 平台。\n\n### The operator\
  \ pattern\n\nOperator 模式 [3] 是一种架构概念和最佳实践，用于在 Kubernetes 中构建、交付和运营应用程序。Operators\
  \ [4] 是部署在 Kubernetes 中的特殊 Controllers，旨在以自动化方式管理单个应用程序。从本质上讲，operators 将管理 Kubernetes\
  \ 工作负载的人类经验编纂成代码。\n\nCloud Pak for Data v4 功能作为 operators [5] 交付。这些 operators 使用户能够安装和配置\
  \ *Day1* 活动。从 *Day2* 角度来看，operators 还会持续监控并自动纠正偏离常态的情况，以及在需要时支持扩展已部署的 Cloud Pak\
  \ for Data 服务的需求。Operators 也被用于以自动化方式将服务升级到更新版本。\n\nOpenShift Container Platform\
  \ 包括 **Operator Lifecycle Manager (OLM)** [6] 功能，帮助 OpenShift 管理员以标准化方式为各种服务（IBM、Red\
  \ Hat、开源或其他第三方供应商）策划 operators。\n\nCloud Pak for Data 包含一个 *Control Plane* 层，使所有服务能够无缝集成并从单个平台层进行管理。此控制平面使用名为\
  \ Cloud Pak for Data platform operator [5] 的 operator 部署。具有适当 Kubernetes 权限的用户在特定\
  \ Cloud Pak for Data 实例命名空间中创建 **Custom Resource (CR)** 对象，以指示应部署什么服务。在 Cloud Pak\
  \ for Data 的情况下，*IbmcP* 类型的自定义资源会触发 Cloud Pak for Data platform operator 在该命名空间中安装控制平面。\n\
  \n下图提供了一个简化的 Kubernetes 集群 [10] 的高层次概述，以说明其功能，仅为说明 Cloud Pak for Data 如何利用它提供背景：\n\
  \n![](img/50e1dac0750b69f2b8e8efff000eb13b_207_0.png)\n\nFigure 9.2 – Kubernetes\
  \ architecture overview\n\n本质上有两种主机节点类型——**Master** 和 **Compute**（worker）节点。在某些实现中，一个节点可能同时具有\
  \ master 和 compute 角色，但强烈建议保持 master 分离以确保更好的可靠性等级。每个节点都包括一些基本组件 [11]，例如 Kubelet\
  \ 守护进程和与每个节点上的容器运行时交互的功能。master 节点包括某些特殊组件，例如 API server 和 scheduler。\n\nKubernetes\
  \ 使用 etcd 数据库存储配置信息，该数据库对整体操作至关重要。etcd 是一个键值分布式存储，为高可用性，可以在不同主机上使用多个副本，建立法定人数。建议从三个\
  \ master 节点开始，并在有必要支持更大规模的应用程序集时扩展。\n\n计算节点是 Kubernetes 调度应用程序工作负载运行的位置。所有 Cloud\
  \ Pak for Data Pods 仅在计算（worker）节点上运行。Kubernetes 还包括将 Pods 调度到特定（专用）节点的能力，但通常，Pods\
  \ 可以随机调度到任何计算节点上。如果计算节点宕机，Pods 可以重新调度到另一个节点上运行。Cloud Pak for Data 服务主要利用 Kubernetes\
  \ 构造，例如 Deployments [12] 和 StatefulSets [13]，在 Kubernetes 中调度其微服务。这些“controllers”为该微服务设置正确的副本数量，识别要为\
  \ Pods 挂载的持久卷存储，并声明对计算资源的需求。\n\n### Understanding how storage is used\n\nCloud Pak\
  \ for Data 需要在 Kubernetes 中使用动态存储 provisioner [20] 来按需创建持久卷。provisioner 还在后台抽象了不同存储技术和解决方案的使用，并使\
  \ Cloud Pak for Data 具有可移植性。例如，`nfs-client` storage class 可能指向 IBM Spectrum Scale\
  \ 或 Dell/EMC 驱动的 NFS 服务器，而 `ibmc-file-gold-gid` storage class 可能指向 IBM Cloud 中的存储。\n\
  \n因此，作为 Cloud Pak for Data 安装的一部分，用户将提供 storage classes 作为配置参数。\n\nCloud Pak for\
  \ Data 控制平面引入了一个特殊的持久卷声明，称为 `user-home-pvc`。这是一个共享的 **Read-Write-Many**（accessMode:\
  \ RWX）卷，由多个 Pod 副本挂载以访问相同内容。此卷存储一些配置信息、静态用户体验内容以及一些用户引入的自定义。\n\n在典型的 Cloud Pak for\
  \ Data 安装中，您可以按如下方式检查您的 PVC：\n\n```\nkubectl get pvc user-home-pvc\n\nNAME     \
  \         STATUS   VOLUME                     CAPACITY   ACCESS MODES   STORAGECLASS\
  \   AGE\nuser-home-pvc     Bound    pvc-44e5a492-9921-41e1-bc42-b96a9a4dd3dc   10Gi\
  \       RWX            nfs-client     33d\n```\n\n\n\n查看其中一个部署（例如 `zen-core`），你会注意到\
  \ Deployment 指示卷应挂载的位置：\n\n```\nkubectl get deployment zen-core -o yaml\n...\nvolumes:\n\
  \  - name: user-home-mount\n    persistentVolumeClaim:\n      claimName: user-home-pvc\n\
  ...\nvolumeMounts:\n  - mountPath: /user-home\n    name: user-home-mount\n```\n\n\
  在此示例中，你会注意到 `user-home-pvc` 在 `zen-core` Pod 中被挂载为 `/user-home`。\n\nCloud Pak for\
  \ Data 还使用 StatefulSets，其中每个成员副本通常与其自己的专用（非共享）持久卷相关联。以下是一个示例：\n\n```\nkubectl get\
  \ statefulsets\n```\n\n这会识别 Cloud Pak for Data 控制平面中存在的几个 StatefulSets：\n\n| NAME\
  \ | READY | AGE |\n|---|---|---|\n| dsx-influxdb | 1/1 | 33d |\n| zen-metastoredb\
  \ | 3/3 | 33d |\n\n每个 StatefulSet 都会生成一个或多个成员 Pod：\n\n```\nkubectl get pods -l component=zen-metastoredb\n\
  ```\n\n前面的片段显示了与该 metastoredb StatefulSet 关联的 *成员*。在这种情况下，有三个，并且按序编号：\n\n| NAME\
  \ | READY | STATUS | RESTARTS | AGE |\n|---|---|---|---|---|\n| zen-metastoredb-0\
  \ | 1/1 | Running | 11 | 12d |\n| zen-metastoredb-1 | 1/1 | Running | 11 | 12d |\n\
  | zen-metastoredb-2 | 1/1 | Running | 10 | 12d |\n\n```\nSelector: managed-by=0020-zen-base,app.kubernetes.io/name=0020-zen-base,app=0020-zen-base,component=zen-core-api,release=0020-core\n\
  ```\n\n服务还标识了暴露的端口和使用的协议，例如以下内容：\n\n```\nPort:                 zencoreapi-tls  4444/TCP\n\
  TargetPort:           4444/TCP\nEndpoints:            10.254.16.52:4444,10.254.20.23:4444\n\
  ```\n\nEndpoints 指示请求被路由到的 Pod IP 和 4444 端口。\n\n如果你查看 zen-core-api Pod 的列表，你会注意到\
  \ IP 已分配给这些特定 Pod：\n\n```\nkubectl get pods -l component=zen-core-api -o wide\n\
  NAME                         READY   STATUS    RESTARTS   AGE     IP           \
  \  NODE                         NOMINATED NODE   READINESS GATES\nzen-core-api-8cb44b776-zlv6q\
  \  1/1     Running   7          12d     10.254.20.23   worker1.zen-dev-01.cp.fyre.ibm.com\
  \   <none>           <none>\nzen-core-api-8cb44b776-vxx1h  1/1     Running   10\
  \         12d     10.254.16.52   worker0.zen-dev-01.cp.fyre.ibm.com   <none>   \
  \        <none>\n```\n\n因此，在向 kube-svc 主机名 `zen-core-api-svc` 端口 4444 发出请求的情况下，Kubernetes\
  \ 会自动将请求路由到其中一个 Pod。同一集群内的所有其他组件都只会使用此 kube-svc 主机名来调用其端点，从而抽象出 zen-core-api Pod\
  \ 的性质、它们运行的确切位置，甚至同时可能存在多少个这些 Pod 的副本。\n\nCloud Pak for Data 控制平面还运行一个名为 ibm-nginx-svc\
  \ 的特殊服务，该服务路由到 ibm-nginx Pod。这些 Pod 通过名为 ibm-nginx 的 Deployment 提供。此组件由 nginx 提供支持，也被称为“前门”，因为它充当访问\
  \ Cloud Pak for Data 服务的总体主要访问点。除了任何初始身份验证检查之外，ibm-nginx Pod 还启用对其他微服务（由其 kube-svc\
  \ 主机名标识）的反向代理，并提供用户体验。\n\nOpenShift 支持多种 [16] 从集群外部访问服务的方式。Cloud Pak for Data 仅公开一个\
  \ OpenShift 路由 [17]，称为 cpd，用于从 Web 浏览器调用用户体验以及从其他客户端调用 API：\n\n```\nkubectl get\
  \ route cpd\n```\n\n| NAME | HOST/PORT | PATH | SERVICES | PORT | TERMINATION |\
  \ WILDCARD |\n|---|---|---|---|---|---|---|\n| cpd | cpd-cpd-122.apps.zen-dev-01.cp.fyre.ibm.com\
  \ | | ibm-nginx-svc | ibm-nginx-https-port | passthrough/Redirect | None |\n\n此路由代表对\
  \ Cloud Pak for Data 的外部访问，“host”是一个可通过 DNS 解析的主机名。在前面的示例中，zen-dev-01.cp.fyre.ibm.com\
  \ 是 OpenShift 集群本身的主机名。当来自集群外部的客户端，例如 Web 浏览器，访问此主机名时，OpenShift 会将其路由到 ibm-nginx-svc\
  \ Kubernetes 服务，该服务在当前可能正在运行的任意多个 ibm-nginx Pod 之间进行负载均衡。\n\nOpenShift 路由也可以使用 TLS\
  \ [18] 进行通用保护。Cloud Pak for Data 还提供了一种将自定义证书与其 Kubernetes 服务关联的方法 [19]。\n\n###\
  \ 基础服务和控制平面\n\nIBM 拥有一个广泛的产品组合，这些产品现在作为 OpenShift Container Platform 上的 Cloud Paks\
  \ 提供。对于每种此类产品，都存在在不同数据中心运行的需求，既在本地也可在云中，并且需要与现有企业系统集成。为此，开发了一套共享服务，称为 Cloud Pak\
  \ 基础服务（CPFS）。\n\n#### Cloud Pak 基础服务\n\nCPFS 也被称为“Bedrock”。它提供在 OpenShift Container\
  \ Platform 之上运行的关键服务，用于为所有 Cloud Paks 提供支持，包括 Cloud Pak for Data，并作为在所有 Paks 之间支持集成的层。\n\
  \nCPFS 服务所启用的功能包括以下内容：\n\n- **证书管理服务**：此服务使 Cloud Paks 能够生成 TLS 证书，将其作为 Kubernetes\
  \ secret 清单化，并在需要它们的 Pod 中挂载。这有助于保护微服务之间的通信，并促进证书的自动轮换变得更容易。\n- **Zen – 平台体验：**\
  \ Zen 是一个专门开发的框架，旨在实现对最终用户体验和后端服务 API 的即插即用范式的可扩展性和采用。它是一套基础功能和 UI 组件，被 Cloud Paks\
  \ 中的更高层服务所利用。它确保关注单一窗格的 *角色驱动* 且可定制（甚至可重新品牌化）的用户体验。它通过即插即用模型促进角色之间以及产品边界之间的协作，随着服务的部署，功能会动态启用。\n\
  - **cloudctl 实用程序：** 此命令行界面（CLI）提供在 OpenShift Container Platform 上部署和管理 Cloud Paks\
  \ 的功能。cloudctl 有助于将 Cloud Pak 镜像镜像到企业私有容器注册表中，甚至镜像到断网环境中。Cloud Paks 中的服务以 **企业容器应用软件（CASE）**\
  \ 格式打包并提供，该规范在开源 [23] 中定义。实用程序为在 Pak 中安装和升级服务提供重要的自动化，包括创建 OLM 工件，例如 catalog sources\
  \ 和 operator subscriptions。\n\n在本节中，我们介绍了 Cloud Pak 基础服务提供的功能，形成了“Bedrock”，所有 IBM\
  \ Cloud Paks 都利用它。在下一节中，我们将探索 Bedrock 的一个消费者——为 Cloud Pak for Data 服务提供动力的 *控制平面*\
  \ 层。\n\n#### Cloud Pak for Data 控制平面\n\n控制平面是 Cloud Pak for Data 实例命名空间中 Zen 框架的实例化。它是一组由\
  \ Zen operator 管理的部署。此 Zen 控制平面由 Cloud Pak for Data 平台 operator [5] 引入并自定义。\n\n\
  以下屏幕截图提供了不同 Kubernetes 资源的结构概览。它描绘了构成控制平面的各种微服务、存储库、存储卷和其他组件。它还显示了服务到服务的交互，包括与 Cloud\
  \ Pak for Data 基础服务和 operator 的交互，以及 Web 浏览器和命令行实用程序如何与该 Cloud Pak for Data 安装交互：\n\
  \n如前图所示粗略概述的那样，所有 Cloud Pak for Data 服务都部署在控制平面之上，并利用控制平面 API，同时通过相同的“前门”进行访问。这些更高阶的服务本身由各自的\
  \ operator 管理，包括各自的微服务、存储库，以及控制平面本身所托管之上的用户体验。这些服务体验以即插即用的方式动态扩展 Cloud Pak for Data\
  \ 体验，以为最终用户呈现单一窗格。\n\n控制平面为 Cloud Pak for Data 平台的消费者提供以下功能：\n\n- **授权：** Cloud\
  \ Pak for Data 提供访问控制功能（*usermgmt* 微服务），使授权用户（管理员）能够向其他用户授予访问权限。可以定义用户组，也可以映射到 LDAP\
  \ 组，以支持协作。用户和组可以被授予基于角色的授权，以使用特定的服务或项目。安全章节更详细地描述了用户访问管理。\n- **基于角色的体验：** Cloud\
  \ Pak for Data 提供基于浏览器的集成最终用户体验，该体验根据用户的角色进行适当个性化。导航及其主页内容会自动限定为已授予的访问权限。用户也可以选择自定义其体验，例如主页内容。这主要由“zen-core”微服务提供。\n\
  - **服务目录：** 服务目录鼓励授权用户进行自助服务，以便在无需了解底层 Kubernetes 基础设施的复杂知识的情况下 *预配* Cloud Pak for\
  \ Data 平台中的服务实例。例如，用户可以选择预配 Db2 数据库并授予他人访问该数据库实例的权限。Cloud Pak for Data 还包括机制供用户为服务实例生成\
  \ API 密钥，以便从客户端应用程序以编程方式进行交互。目录由 `zen-core-api` 微服务提供支持，体验由 `zen-core` 微服务托管。`zen-core-api`\
  \ 还提供管理每个预配服务实例的访问的机制，同时支持按需升级这些实例的能力。\n\n\n\n\n从这种用户体验中，如前面的截图所示，管理员随后可以查看每个 Pod，获取更多详细信息，或访问日志以进行故障排除。如果他们发现某个\
  \ Pod 运行异常，甚至可以选择重启该 Pod。\n\n请注意，该界面旨在补充 OpenShift 控制台中提供的监控和管理功能，并且仅呈现非常符合 Cloud\
  \ Pak for Data 使用场景的视图，且仅限于该 Cloud Pak for Data 安装实例。\n\n### 告警\n\nKubernetes 提供了存活探针和其他原语，用于识别故障\
  \ Pod 并触发自动重启。然而，对于复杂的服务，识别跨多个 Deployment 或 StatefulSet 的故障可能并不那么简单，也无法识别任何应用层面的语义。为了补充\
  \ OpenShift 的能力，Cloud Pak for Data 引入了额外的监控和事件持久化机制，并在用户体验中呈现问题。\n\n控制平面包含一个由 zen-watchdog\
  \ 驱动的框架 [27]，用于监控事件、识别严重情况，并将这些问题作为警报提出。这些警报消息通常会作为 SNMP 陷阱发送到已配置的企业 SNMP 接收器。\n\
  \n下图从高层次展示了 zen-watchdog 服务如何实现监控、事件聚合和警报发出：\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_220_0.png)\n\
  \n图 9.7 – 监控事件与警报转发\n\n还可以配置不同的目标来发送警报，包括通过 SNMP 协议，或者简单地通过 SMTP 电子邮件以及 HTTP 发送。\n\
  \nCloud Pak for Data 的控制平面本身包含一些通用的开箱即用监控器，例如：\n\n- **check-pvc-status**：如果 PVC\
  \ 未绑定，则记录一个关键事件\n- **check-replica-status**：如果 StatefulSet 或 Deployment 有不可用的副本，则记录一个关键事件\n\
  - **check-resource-status**：如果服务达到阈值，则记录一个警告事件；如果超过配额，则记录一个关键事件\n\n开发人员也可以引入扩展来支持自定义监控需求。文档\
  \ [28] 使用示例代码描述了引入自定义容器镜像以提供专门监控功能并识别值得发出警报的关键问题的过程。\n\n### 配置和管理服务实例\n\nCloud Pak\
  \ for Data 中的许多服务都支持“服务实例”的概念，这些实例从服务目录中配置。它们是服务的独立副本，可以独立进行横向扩展和配置，通常还用于为选定的一组用户提供访问权限。\n\
  \n服务实例具有以下特征：\n\n- 它代表了按个体计量的 Kubernetes 工作负载 – 通常在与控制平面相同的命名空间中配置 – 但某些服务也可以在与控制平面命名空间\
  \ *绑定*（从管理角度来看）的“数据平面”sidecar 命名空间中配置。\n- 它由具有 *创建服务实例* 权限的授权最终用户通过配置体验和 API 进行配置：\n\
  \n  最终用户在无需 Kubernetes 访问权限或深入了解 Kubernetes 原语的情况下配置实例。\n- 它支持 RBAC，也就是说，用户可以获授细粒度的角色来访问该资源。\n\
  - 它支持安全的编程式客户端访问，具有实例级 API 密钥和服务令牌。\n\n例如，授权用户可能希望启动一个数据库实例供其团队私下使用。其他用户甚至不会知道这些实例的存在。\n\
  \n以下截图展示了部署 Db2 仓库数据库实例的示例配置体验。\n\n用户会得到关于设置实例的指导，包括适当地分配计算和存储资源：\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_222_0.png)\n\
  \n图 9.8 – 配置体验示例\n\n在为该实例选择适当的配置属性后（例如，如前面截图所示），用户随即触发实例的创建。该实例的创建者随后被指定为该实例的第一位管理员。\n\
  \n随着此类实例的创建（或者通常只要对该实例执行任何特定操作），控制平面会自动生成审计记录。\n\nCloud Pak for Data 平台管理员除了可以管理实例的创建者之外，还可以管理和监控这些实例。但是，即使是平台管理员也可能一开始就被拒绝访问以使用该实例。例如，虽然\
  \ Cloud Pak for Data 平台管理员可以执行维护任务，甚至取消配置该数据库实例，但他们可能无法访问其中的数据。从法规遵从性的角度来看，实现这种职责分离至关重要。\n\
  \n以下截图展示了授权用户（该实例的管理员或 Cloud Pak for Data 平台管理员）如何管理访问权限的示例。他们可以给其他用户和组分配角色（包括管理员角色）：\n\
  \n![](img/50e1dac0750b69f2b8e8efff000eb13b_223_0.png)\n\n图 9.9 – 实例访问管理\n\n以下截图说明了如何以类似方式向用户提供远程卷：\n\
  \n![](img/50e1dac0750b69f2b8e8efff000eb13b_227_0.png)\n\n图 9.14 – 访问远程卷\n\n这使企业能够使用\
  \ Cloud Pak for Data 中已有的数据卷，而无需将其物理传输到集群中。类似地，还支持通过 SMB 协议挂载远程 SMB（CIFS）卷，就像 Microsoft\
  \ Windows 机器挂载此类共享卷一样。\n\n### 多租户、资源管理与安全\n\n在许多成熟企业中，OpenShift 集群被视为共享环境。他们期望在需要时扩展此类集群以容纳更多工作负载并重新平衡可用资源。共享同一个\
  \ OpenShift 集群并整合管理和运维，远比为每个租户分配一个单独集群更具成本效益。由于此类集群包含来自不同供应商的不同类型工作负载，以及需要复杂访问管理和安全实践的应用，因此从一开始就关注租户隔离非常重要。\n\
  \n租户这个概念本身非常主观。在某些情况下，同集群中的开发测试环境与生产安装可能被视为不同的租户。在其他情况下，不同的部门或不同的项目用例可能被视为独立的租户。当这个概念扩展到代表客户运营集群的\
  \ ISV 时，每个客户很可能是不同的公司，与所有用户来自同一公司的情况相比，对租户隔离的要求可能更严格。\n\n多租户章节更详细地介绍了 Cloud Pak\
  \ for Data 的租户方法和最佳实践建议。在本节中，我们将从高层概览租户要求，以及 Cloud Pak for Data 在此类共享 Kubernetes\
  \ 集群中的部署和管理方式。\n\n首先，让我们从影响租户方案的一些关键标准开始：\n\n- **租户隔离：** 需要确保不同租户在此类共享系统上完全互不知晓。这可能包括需要使用完全不同的身份验证机制。不同的租户可能需要不同的\
  \ LDAP 组，甚至不同的 LDAP 服务器。\n\n  通过访问授权和策略保护资源总体上是绝对必要的，但在存在多个租户用户的情况下，这些措施的作用更加突出。\n\
  \n  隔离还延伸到网络隔离，甚至达到为每个租户提供完全不同的用户体验、API 主机名 URL 和 DNS 域名的程度，即使他们在物理上共享同一个 Kubernetes\
  \ 集群。\n\n  以 Kubernetes 持久卷形式使用的存储系统也需要确保租户无法访问彼此的卷。\n\n\n\n\n\n- **安全性：** 但请注意，出于成本考虑，一些企业最终可能会允许租户之间有更多的共享。因此，尽管隔离要求提供了租户之间一定程度的分离，但在部署拓扑中，特定的安全和合规性要求也发挥着根本作用。身份验证和授权访问管理在很大程度上有所帮助，但可能仍不够充分。\n\
  \n  例如，由于 OpenShift Kubernetes 本身是共享的，将访问权限授予任何租户以进入该操作环境是不明智的。这也意味着需要有一个专门负责管理\
  \ OpenShift 集群的运维团队或 IT 部门，包括主机节点本身的安全性，以及租户的接入管理。\n\n  与传统非容器化应用一样，可能也存在网络安全需求。例如，两个租户之间可能需要设置防火墙隔离，或者制定严格策略以确保不会发生安全漏洞。\n\
  \n  安全要求甚至可能延伸到需要为不同租户的存储卷使用不同的加密密钥。\n\n  从合规性角度来看，不同租户可能有不同要求。对于开发测试或临时租户，可能无需审计，但对于生产租户则可能需要更全面的审计。由于某些租户的工作涉及敏感数据，他们可能比其他租户需要更多的安全加固和审计实践。因此，租户方案需要支持这种多样化的配置需求。\n\
  \n- **资源管理：** 由于集群是共享的计算资源池，因此公平地共享集群也至关重要。IT 运维团队可能需要为各个租户提供特定的**服务水平协议（SLA）**。\n\
  \n  因此，租户机制必须支持能够监控资源利用率、防止或至少限制“吵闹邻居”的控制措施，并且重要的是，能够强制执行计算使用限制。在某些组织中，向租户收费也可能依赖于测量计算利用率和/或设置配额的能力。\n\
  \n- **支持自助服务管理：** 如果企业为每个租户用户配备专门的支持人员，运营成本会很高。理想的做法是让每个租户能够自行服务，包括自行配置服务、扩展服务，或自行执行备份和升级。\n\
  \n  租户管理员通常也需要能够自行决定访问管理（以及计算资源配额）相关事宜，而不需要 IT 支持。\n\n  监控、诊断或其他维护任务最好也委托给租户管理员。\n\
  \n  因此，租户方案应能够在其范围内向指定的“租户管理员”授予一定程度的管理权限。\n\n在本节中，我们介绍了多租户方案面临的一些常见要求。下一节将介绍 Cloud\
  \ Pak for Data 技术栈如何帮助解决这些租户相关问题。\n\n### 使用命名空间实现隔离\n\n虽然为每个租户使用不同的 Kubernetes 集群甚至专用主机节点可能更简单，但成本效益不高。幸运的是，Kubernetes\
  \ 包含命名空间 [34] 的概念，它代表一个虚拟集群，有助于隔离不同租户的工作负载。OpenShift Container Platform 通过项目 [35]\
  \ 的概念扩展了命名空间。\n\n最常见的方法是在不同的租户实例命名空间中安装不同的 Cloud Pak for Data 实例。然后，每个租户被分配这样一个安装实例，并在相对私密和相互隔离的环境中进行工作。每个租户命名空间中的\
  \ Cloud Pak for Data 安装都有自己的 OpenShift 路由器，这允许针对该租户自定义此访问点，包括外部主机名和 URL，以及为每个租户引入不同\
  \ TLS 证书的能力。\n\n由于持久卷声明和网络策略也可以限定在命名空间范围内，因此存储和网络访问的隔离也能得到保证。如果租户用户需要访问 Kubernetes（例如，安装或升级其服务），也可以使用\
  \ Kubernetes RBAC 将其权限限定在其命名空间内。OpenShift 项目也可以映射到专用节点，这可以提供更强的物理隔离，但成本更高，用于将不同租户的\
  \ Pod 相互隔离。\n\n关于多租户的章节描述了使用命名空间实现隔离的各种选项，以及两个租户甚至可能希望共享同一命名空间的选项。\n\n### 资源管理和配额\n\
  \nCloud Pak for Data 支持在单次安装中并发使用各种用例和不同类型的用户。一旦部署了服务，就会有一组固定的 Pod 提供 API、存储库和用户体验，以及该服务特有的一些支持性管理功能。这些被视为始终运行的*静态*工作负载。当最终用户与这些服务交互时，通常会出现*动态*工作负载。其中一些可能是长期运行的，例如用户配置的数据库实例，而另一些可能只是短期工作负载，例如数据科学交互环境、Spark\
  \ 作业和机器学习训练作业。如果更多用户同时启动分析环境，或者同时发起昂贵的模型训练，他们最终可能会争夺资源，或使其他重要作业缺少资源。\n\nCloud Pak\
  \ for Data 中的所有 Pod 都带有标签和注解，以标识它们所属的*产品* [25]。Pod 还指定了在 Kubernetes 环境中运行所需的资源请求和限制\
  \ [29]。请求的 CPU 和内存设置有助于 Kubernetes 选择合适的 Worker 节点来调度 Pod，为该 Pod 预留请求的计算资源，并使用限制设置来设定上限。因此，Pod\
  \ 可以在短时间内“突发”到上限，以支持突增的工作负载。这样就无需为最坏情况做规划，也无需预留比通常需要更多的计算资源，同时允许紧急情况下的临时增长，但前提是那一刻该\
  \ Worker 节点上有额外资源可用。\n\n在处理此类动态工作负载和并发用户活动时，资源管理是一个关键考虑因素。虽然架构优雅地支持弹性，并且可以在需要时添加更多计算资源，但在扩展之前最大程度地充分利用现有资源更为实用且更具成本效益。因此，管理员需要确保资源得到公平和均衡的使用，并能将资源转移给急需的工作负载。\n\
  \nKubernetes 支持 **ResourceQuota** 规范的概念，集群管理员可以使用它来控制所有命名空间的计算分配。除此之外，控制平面还允许 Cloud\
  \ Pak for Data 的*租户*管理员在不具备 Kubernetes 权限的情况下，为其安装中的每个服务（产品）定义计算资源阈值。虽然这仍受到 Kubernetes\
  \ 集群管理员设置的命名空间总体 ResourceQuota 的约束，但它为 Cloud Pak for Data 管理员提供了一定灵活性，可以自行管理已获分配的资源。\n\
  \n以下截图展示了此类租户管理员如何在该 Cloud Pak for Data 实例命名空间中为 Watson Knowledge Catalog 服务设置 CPU\
  \ 和内存边界：\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_232_0.png)\n\n图 9.15 – 资源配额定义\n\
  \n任何违反阈值的行为都会在监控用户体验中突出显示，如果配置了警报，也会发出警报。\n\n除了报告阈值违规之外，Cloud Pak for Data 还包含一个可选的调度服务\
  \ [26]，可用于*强制*执行分配的资源配额。调度服务根据管理员为每个服务所做的选择进行配置。\n\n该调度服务扩展了默认的 Kubernetes 调度器，并监控所有\
  \ Pod 和作业的启动请求。它使用与 zen-watchdog 相同的标签来识别 Pod 以及 Pod 所属的服务/产品。然后，它汇总当前正在运行的该服务的所有\
  \ Pod 的资源请求和限制，并决定是否允许启动。违反定义资源配额阈值的 Pod 将无法启动。\n\n\n\n\n\n在操作员订阅[36]中采用 *installPlanApproval:\
  \ Automatic* 规范后，操作员部署通常会在其目录源刷新时自动升级。选择手动批准则意味着集群管理员需要手动决定何时可以升级。请注意，Cloud Pak\
  \ for Data 操作员的新版本应仍然兼容当前已安装的操作对象（operand）部署版本，并同时支持新版本。因此，在同一个集群中，可以部署全新安装的新版本服务，而另一个命名空间继续保留旧版本，且两者均由同一个操作员管理。\n\
  \n操作对象也可以设置为自动升级。这意味着当操作员升级时，作为其协调循环的一部分，它也会自动将现有操作对象升级到该操作员支持的最新版本。\n\n最简单的方法是配置全自动机制并采用持续交付模式。采用这种方法，集群管理员只需确保目录源得到更新（离线环境下手动更新）。由更新后的目录服务引入的操作员随后会自动升级到最新版本，而这些操作员又会自动升级它们所管理的操作对象。\n\
  \n对于需要特定版本的操作对象且升级需要手动处理的情况，可以采用一种称为“固定（pinning）”的流程。即使相关操作员已升级，将操作对象固定到某个版本仍然有效。实现方法是在实例命名空间中为该服务的自定义资源规范中显式提供版本。只有当版本被手动更改时，操作员才会触发操作对象部署升级到所请求的新版本。如果未指定版本，则操作员假定操作对象部署始终需要处于最新发布级别，并自动确保如此。\n\
  \n### 横向扩展\n\n开箱即用，服务的操作对象部署配置了特定的计算资源和副本设置。大多数服务支持 T 恤尺码（T-shirt sizing）配置，以便对各种\
  \ Pod 微服务进行横向扩展和纵向扩展。在许多情况下，横向扩展还可通过为部署提供多个副本来提高高可用性，并通过增加负载均衡来提高性能。\n\n27. **告警：**\
  \ https://www.ibm.com/docs/en/cloud-paks/cp-data/4.0?topic=platform-monitoring-alerting\n\
