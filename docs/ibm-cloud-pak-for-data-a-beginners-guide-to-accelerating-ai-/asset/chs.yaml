  \ infrastrukture 上交付托管服务。\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_154_0.png)\n\
  \nFigure 6.10 – IBM Cloud Satellite\n\n那么，这一切是如何运作的？一旦建立了 Satellite 位置，这些 Satellite\
  \ 位置中的所有工作负载都在 Red Hat OpenShift 上运行——具体来说是 IBM Cloud 的托管 OpenShift 服务。集成到 Cloud\
  \ Pak for Data as a Service 中的服务——例如 DataStage——可以将运行时部署到这些 Satellite 位置，以便这些运行时更接近服务需要集成的\
  \ data 或应用。名为 Satellite Link 的安全连接在 Cloud Pak for Data as a Service 与其远程运行时之间提供通信。\n\
  \nIBM Cloud Satellite 对数据和 AI 工作负载的价值主张有三点：\n\n- 1. **Data gravity**：最小化数据移动和冗余，这也有助于避免出口成本。在数据所在位置附近训练\
  \ AI 模型，可消除延迟并提高性能。\n- 2. 现代化传统工作负载，并在本地或您选择的第三方云上实现云原生优势：\n  - 易于配置并按需扩展。\n  -\
  \ 无缝升级，停机时间可忽略不计。\n  - 实现托管服务的优势。\n- 3. 解决监管和合规挑战：\n  - 在不移动数据的情况下共享洞察：处理数据主权挑战。\n\
  \  - 符合 GDPR、CCPA 等。\n\n现在我们已经了解了 IBM Cloud Satellite 的基础知识和 IBM 的多云方法，让我们来看一下 **data\
  \ fabric**。\n\n### A data fabric for a multi-cloud future\n\n云正在改变每个企业，多云是未来。为了取得成功，企业将必须在私有云和公有云之间访问、治理、保护、转换和管理数据。这就是\
  \ IBM 使用数据 fabric 所解决的问题，这是一项重大努力，可能需要数年时间。数据 fabric 的坚实基础始于集中式元数据管理、数据治理和数据隐私，当通过自动化增强时，确实有助于放大其优势。\n\
  \n\n\n\n下图展示了面向多云未来的数据编织：\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_156_0.png)\n\
  \n图 6.11 – 多云未来的数据编织\n\n此行与上一段最后一行重复——请删除其中一处。\n\n### 摘要\n\n如今，托管服务/SaaS 绝对必不可少，Cloud\
  \ Pak for Data 提供了一套全面且不断发展的功能，可满足端到端的客户需求。通过简化打包、定价以及现代化升级激励，IBM 让现有客户和新客户都能轻松采用\
  \ Cloud Pak for Data 即服务。在本章中，您了解了 Cloud Pak for Data 的不同部署选项、受支持的第三方云，以及其托管服务（Cloud\
  \ Pak for Data SaaS 产品）的概览。您还了解了 IBM 的愿景，即在您选择的任何基础设施（包括第三方云提供商）上提供 Cloud Pak for\
  \ Data 托管服务。这可以通过 Cloud Satellite 实现，它是 IBM 对 AWS Outposts 和 Azure Stack/Arc 的回应。\n\
  \n最后，IBM 正在大力投资其数据编织，以跨云访问、治理、管理和保护数据和 AI 工作负载，从而满足多云未来不断变化的需求。\n\n在下一章中，我们将了解 Cloud\
  \ Pak for Data 生态系统，它补充并扩展了基础 Cloud Pak for Data 所包含的功能。\n"
- "## 7 IBM 与合作伙伴扩展服务\n\n## \n\n生态系统是任何成功平台的关键组成部分，**Cloud Pak for Data** 也不例外。如*第\
  \ 2 章“Cloud Pak for Data：简介”*所述，它采用两级打包结构，包括“一个附带一组模块化服务的基础平台，但作为一个整体进行定价和打包，让客户可以按需使用”和“可选且单独定价/打包的高级扩展服务”。\n\
  \n本章重点介绍来自 **IBM** 的扩展服务，也称为来自我们生态系统合作伙伴的插件和功能。IBM 扩展服务与 Cloud Pak for Data 紧密集成，并包含使其能够独立运行或作为集成平台一部分运行的平台服务。另一方面，第三方扩展需要\
  \ Cloud Pak for Data 和 **Red Hat OpenShift**。\n\n在本章中，我们将涵盖以下主要主题：\n\n- IBM 与第三方扩展服务\n\
  - 收集类插件：**Db2 Advanced** 和 **Informix**\n- 组织类插件：Data Stage、Information Server、主数据管理和\
  \ IBM Virtual Data Pipeline\n- 注入类插件：Cognos Analytics、Planning Analytics、Watson\
  \ Assistant、Discovery、Watson AI for Operations、Watson Financial Crimes Insight 等\n\
  - Cloud Pak for Data 插件的现代化升级\n\n### IBM 与第三方扩展服务\n\n扩展服务概念最好用 iPhone 的简单类比来解释。当某人购买\
  \ iPhone 时，除了硬件和 Apple iOS 操作系统外，您还会收到 Apple 预装且预集成的多款应用，例如相机、地图、电话、iMessage、音乐等。这些预装且紧密集成的应用让客户从第一天起就能上手使用，满足其大部分日常需求。这些开箱即用的应用已包含在初始购买中。此外，您还可以从\
  \ App Store 下载第三方高级应用，这些应用单独定价和打包。这些是可选的应用程序，用于满足特定需求并提升 iPhone 的整体价值。\n\nCloud\
  \ Pak for Data 的两级打包结构（如下所示）与 iPhone 有些类似。购买 Cloud Pak for Data 时，您有权使用一系列数据和 AI\
  \ 功能，这些功能用于收集、组织、分析数据，以及将 AI 注入业务流程。当然，这些是模块化服务集，使客户只需使用所需功能，同时保留未来扩展或伸缩的能力。与 App\
  \ Store 类似，Cloud Pak for Data 也包含一个由 IBM 和第三方供应商提供的高级服务生态系统，使客户可以选择性地使用更广泛的功能。这些被称为扩展服务。IBM\
  \ 扩展服务紧密集成。它们包含 Red Hat OpenShift 的使用权，以及使其能够独立运行或作为更广泛平台一部分运行的通用平台服务。因此，它们也被称为插件。另一方面，第三方服务以\
  \ Cloud Pak for Data 和 Red Hat OpenShift 为先决条件，并支持与平台进行有限的集成。尽管如此，它们非常有价值，有助于补充基础平台的功能：\n\
  \n### 类比：iPhone 应用\n\nApple 应用、通过市场销售的第三方应用以及自定义应用\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_159_0.png)\n\
  \n### 多云\n\n图 7.1 – Cloud Pak for Data：两级打包结构\n\n上图说明了 iPhone 类比，以及如何通过 IBM、第三方合作伙伴和自定义应用提供的高级扩展服务来扩展和定制\
  \ Cloud Pak for Data。\n\n### 收集类扩展服务\n\n数据是企业做出更明智决策的基础，也是推动数字化转型的关键。AI 阶梯中的“收集”层旨在让数据变得简单易用，Cloud\
  \ Pak for Data 包含多项基础功能，可满足大多数客户需求，例如数据虚拟化、Db2 Warehouse、Big SQL 等。此外，客户还可以使用以下小节中详细描述的扩展服务。\n\
  \n#### Db2 Advanced\n\nIBM Db2 为事务性工作负载提供高级数据管理和分析功能。Db2 是世界上第一个关系数据库，没有处理器、内存或数据库大小限制，因此非常适合任何规模的工作负载。Db2\
  \ 服务使您能够在 Cloud Pak for Data 集群中创建这些数据库，以便您可以治理数据并将其用于更深入的分析：\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_160_0.png)\n\
  \n图 7.2 – Db2 插件\n\nCloud Pak for Data 平台上的 Db2 数据库可以满足多种用例要求，包括以下方面：\n\n- 为金融机构、零售店、网站等持久化和管理事务性数据\n\
  - 复制事务性数据以运行分析，而不影响常规业务运营\n- 通过**符合 ACID 的数据库**确保数据完整性\n- 确保对业务运营的低延迟和实时洞察\n\n####\
  \ Informix\n\n**Informix** 服务在 IBM Cloud Pak for Data 上提供 Informix 数据库。高性能 Informix\
  \ 引擎提供丰富的功能，包括**时间序列、空间、NoSQL、**和 SQL 数据，可通过 **MQTT、REST** 和 **MongoDB** API 访问。\n\
  \n将 Informix 数据库集成到 Cloud Pak for Data 可带来以下好处：\n\n- 为快速变化的数据模型提供运营数据库\n- 提供集成到运营数据库中的轻量级低延迟分析\n\
  - 存储来自**物联网（IoT）**设备或传感器的大量数据\n- 存储和提供多种不同类型的内容：\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_161_0.png)\n\
  \n图 7.3 – Informix 插件\n\n#### 虚拟数据管道\n\n**虚拟数据管道（VDP）**支持为数据科学、分析和测试目的访问类生产数据。传统上，企业会采用耗时的复制生产数据的方法来实现此目的，这会导致敏感数据的暴露风险更高。借助\
  \ Cloud Pak for Data 中的 VDP 服务，我们现在可以创建单个存储高效、可选掩码的物理数据源黄金副本。这可以进一步与其他数据源结合，并使用\
  \ **CP4D** 数据虚拟化功能进行虚拟化：\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_162_0.png)\n\
  \n图 7.4 – 虚拟数据管道\n\nVDP 可用于以下用例：\n\n- 缩短应用程序测试和开发时间\n- 降低存储成本\n- 为测试、开发和分析提供安全的自助式数据供应解决方案\n\
  \n\n\n\n\n#### EDB Postgres Advanced Server\n\n**EnterpriseDB Postgres Advanced\
  \ Server** 是一个集成的、企业级版本的开源 **PostgreSQL** 数据库，具备先进的企业安全、性能诊断、Oracle 兼容性以及其他生产力特性：\n\
  \n![](img/50e1dac0750b69f2b8e8efff000eb13b_163_0.png)\n\n图 7.5 – EDB Postgres Advanced\
  \ Server\n\nEDB Postgres Advanced Server 的用例包括以下方面：\n\n- 适用于新应用的 DevOps、无模式、多编程语言支持的快速开发\n\
  - 需要多模式灵活性和与主流数据源集成的应用现代化\n- 遗留迁移需要 Oracle 兼容性\n- 支持向云迁移的灵活部署选项\n\n#### MongoDB\
  \ Enterprise Advanced\n\n**MongoDB Enterprise Advanced** 是一个高度可扩展、面向文档的 NoSQL 数据库，支持动态模式，使其更容易在特定类型的应用程序中集成数据。Cloud\
  \ Pak for Data 中的 MongoDB 服务是一个具有自动扩展功能的高可用数据库。\n\nMongoDB Enterprise Advanced 还为您提供全面的运维工具、高级分析和数据可视化、平台集成以及认证：\n\
  \n![](img/50e1dac0750b69f2b8e8efff000eb13b_164_0.png)\n\n图 7.6 – MongoDB Enterprise\
  \ Advanced\n\nMongoDB 的用例包括以下方面：\n\n- 遗留应用现代化，需要不断演进的模式\n- 将企业数据作为服务提供，需要组合来自不同来源的数据\n\
  - 实施云数据战略，需要可扩展性和可移植性\n\n在下一节中，我们将讨论如何组织扩展服务。\n\n### 组织扩展服务\n\nAI 阶梯的“收集（Collect）”层级是将数据放入适当的持久化存储并实现轻松访问，而“组织（Organize）”扩展服务则致力于构建可信的分析基础。这涵盖数据准备、数据转换、数据治理、数据隐私、主数据管理以及企业范围内数据的生命周期管理。虽然\
  \ Cloud Pak for Data 的基础产品包含一组丰富的数据准备、数据治理和数据隐私功能，但 Organize 层级的其余部分可通过以下四个扩展服务（也称为扩展包）获得：\n\
  \n#### DataStage\n\n数据集成是任何企业的关键方面，随着企业数据资产的规模不断增加和分布式特性（通常分布在多个云和数据中心），它变得更加重要。IBM\
  \ DataStage 是企业领先的提取、转换、加载（ETL）产品，拥有数千家客户，以其可扩展性和运营效率而闻名。您可以使用 Cloud Pak for Data\
  \ 上的 DataStage 服务来设计和运行移动及转换数据的数据流，这使您能够快速、准确地组合和运营数据流。通过直观的图形设计界面，您可以连接到各种数据源，集成和转换数据，并以批处理或实时方式将其交付到目标系统。\n\
  \n这两种服务都为您的数据流提供了数百个开箱即用的内置业务操作。支撑 DataStage 的高性能并行运行时引擎使企业能够扩展以满足其集成需求，即使数据量和数据复杂性不断增加。\n\
  \nCloud Pak for Data 上的 DataStage 有以下两种版本：\n\n- DataStage Enterprise\n- DataStage\
  \ Enterprise Plus\n\nDataStage Enterprise 帮助设计数据集成作业，并允许数据工程师为多个源和目标转换及移动数据。您可以创建可重用的作业模板，或在直观的图形界面中设计数据集成流。数据工程师还可以使用各种转换器和阶段来设计从简单到复杂的作业，而高性能运行时引擎则支持可扩展性并高效集成大量数据。\n\
  \nDataStage Enterprise Plus 包含 DataStage Enterprise 的所有功能，并额外提供了用于数据质量的有用功能。这些功能包括：\n\
  \n- 通过识别潜在异常和元数据差异来清洗数据\n- 通过数据匹配和两个数据集之间数据实体的概率匹配来识别重复项\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_166_0.png)\n\
  \n图 7.7 – DataStage 扩展包\n\n#### Information Server\n\nCloud Pak for Data 上的 IBM\
  \ **Information Server** 扩展包为 IT 和**业务线（LOB）**用户提供了一套全面的功能，用于组织所有企业数据。它是一套服务，包括处理数据集成、数据质量和数据治理的功能。此扩展包是\
  \ DataStage 的超集，并为以下方面提供无缝集成和一致的用户体验：\n\n- 自动化数据发现\n- 策略驱动的治理\n- 自助式数据准备\n- 对传输中和静态数据进行数据质量评估和清洗\n\
  - 高级动态或批处理导向的数据转换和移动\n\n#### 主数据管理\n\n主数据是每笔业务交易、应用程序和决策的核心。用于 IBM Cloud Pak for\
  \ Data 的 IBM **Master Data Connect** 服务提供 RESTful API，使地理分布的用户能够从 IBM **InfoSphere\
  \ Master Data Management**（**InfoSphere MDM**）快速、可扩展且并发地访问您组织中最受信任的主数据。\n\nInfoSphere\
  \ MDM 充当中央存储库，用于跨组织管理、存储和维护主数据。InfoSphere MDM 提供以下功能：\n\n- 组织关键业务事实的整合、集中视图\n- 在主数据的整个生命周期内管理主数据的能力：\n\
  \n  ![](img/50e1dac0750b69f2b8e8efff000eb13b_167_0.png)\n\n  图 7.8 – 主数据管理扩展包\n\n\
  InfoSphere MDM 11.6.0.11 或更高版本支持使用 IBM **MDM Publisher** 功能发布到 Master Data Connect。使用\
  \ MDM Publisher，您可以一次性批量加载主数据到 Master Data Connect，或设置持续的数据同步。当您在用户界面中配置 Master\
  \ Data Connect 数据订阅时，MDM Publisher 会创建、运行并管理由此产生的数据加载作业。\n\n加载组织的主数据后，Cloud Pak\
  \ for Data 用户或应用程序可以使用强大的 API 直接访问可信数据。这使它们能够：\n\n- 查看主数据记录。\n- 对主数据执行全文或属性查询搜索。\n\
  - 对主数据运行图数据库查询。\n- 查看主数据记录之间的关系。\n- 查看数据的逻辑模型。\n\n### 分析类扩展包 – IBM Palantir\n\n\
  Cloud Pak for Data 的核心用例之一是数据科学，基础平台包含一组丰富的功能，用于构建、部署、管理和治理由 IBM **Watson Studio**\
  \ 支持的 AI 模型。此外，Cloud Pak for Data 还包含两个高级服务（也称为扩展包）来补充核心功能。\n\n#### IBM Palantir\n\
  \n用于 Cloud Pak for Data 的新的 IBM **Palantir** 扩展包将简化和加速组织如何将预测性、数据驱动的洞察注入各个行业领域的现实决策和业务运营中。IBM\
  \ Palantir 服务有助于以下方面：\n\n- 在易于部署和管理的“无代码、低代码”环境中提供面向业务的 AI 功能\n- 简化数据和 AI 模型与业务决策的连接方式，同时具有可信性和可解释性\n\
  - 通过自动将数据映射到业务含义和行业上下文，为更明智的决策提供信息\n- 自动化在混合云和数据环境中收集、组织和分析数据的方式\n\n\n\n\n- 使用来自广泛数据和\
  \ AI 能力生态系统的服务，包括 IBM Watson：\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_169_0.png)\n\
  \n图 7.9 – 用于 Cloud Pak for Data 的 IBM Palantir\n\n在下一节中，我们将回顾构成 AI 阶梯融入层的组件。\n\n\
  ### 融入层组件\n\nAI 阶梯的融入层关注业务成果，并能够将 AI 和数据驱动的洞察大规模应用于决策。它需要利用 AI 实时自动化和优化广泛的业务用例，以帮助推进业务目标。融入层由七个组件组成，这些组件有助于解决各种业务用例。这些组件将在以下小节中讨论。\n\
  \n#### Cognos Analytics\n\n融入 AI 和机器学习的自助式分析使您能够创建令人惊叹的可视化，并通过仪表板和报告分享您的发现。\n\n\
  Cognos Analytics 服务使您能够更轻松地从数据中提取含义，具备以下功能：\n\n- 自动数据准备\n- 自动建模\n- 自动创建可视化和仪表板\n\
  - 数据探索\n\n该服务还使您能够通过令人惊叹的可视化、仪表板、报告和交互式故事轻松地与他人分享您的发现：\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_170_0.png)\n\
  \n图 7.10 – Cognos Analytics 组件\n\n#### Planning Analytics\n\n使用整个业务中的数据，轻松创建更准确的计划、预算和预测。好的计划始于好的数据。借助由\
  \ TM1® 驱动的 IBM Planning Analytics，确保您的计划基于整个业务的数据。Planning Analytics 是一个融入 AI 的解决方案，它从多个来源提取数据，并自动创建计划、预算和预测。Planning\
  \ Analytics 与 Microsoft Excel 集成，因此您可以继续使用熟悉的界面，同时突破电子表格的传统限制。\n\n为您的电子表格注入更多分析能力，以构建复杂的多维模型，帮助您创建更可靠的计划和预测。Planning\
  \ Analytics 服务包括以下内容：\n\n- 易于使用的可视化工具\n- 内置数据分析和报告功能\n- 假设情景建模，帮助您了解决策的影响：\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_171_0.png)\n\
  \n图 7.11 – IBM Planning Analytics 组件\n\n#### Watson Assistant\n\nAI 助手访问并“学习”数百个客户接触点，同时以集成方式与其他系统共享这些数据，从而让客户获得一致的体验，并让他们感觉公司了解他们。执行良好的\
  \ AI 驱动聊天机器人通过快速解决问题、全天候可访问性，以及通过用户最舒适的渠道（无论是网页聊天、短信、社交媒体网站，还是拨打客户服务电话）来提高净推荐值（NPS）。Watson\
  \ Assistant 服务使您能够超越聊天机器人，将对话界面构建到您的应用、设备和渠道中。大多数聊天机器人模仿人类互动，但一旦出现误解，用户就会感到沮丧。Watson\
  \ Assistant 为您的用户做得更多。它知道何时在知识库中搜索答案、何时请求澄清，以及何时将用户引导到真人。Watson Assistant 可以运行在任何云上，因此无论您的数据和应用位于何处，您都可以将\
  \ AI 带到它们所在之处：\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_172_0.png)\n\n图 7.12\
  \ – IBM Watson Assistant 组件\n\nWatson Assistant 利用并包含 Watson Discovery 来实现其部分功能。\n\
  \n#### Watson API Kit\n\nCloud Pak for Data 上的 **Watson API Kit** 组件包含以下小节中显示的服务。\n\
  \n#### Watson Knowledge Studio\n\n**Watson Knowledge Studio** 服务使用 AI 来识别您所在行业独有的实体、关系和其他语言元素。本质上，它帮助教会\
  \ Watson 您所在领域的语言：\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_174_0.png)\n\n图 7.14\
  \ – IBM Watson Knowledge Studio\n\n#### Watson Language Translator\n\n**Watson Language\
  \ Translator** 服务使您能够将文本翻译成超过 45 种语言。此外，借助 Watson Language Translator API，您可以执行以下操作：\n\
  \n- 识别文档中使用的语言。\n- 将文档（如 Word 文档和 PDF 文件）翻译成其他语言，并保持与原文档相同的格式和布局（此功能目前处于测试阶段）。\n\
  \n**Watson Text to Speech** 服务提供一个 API，可将书面文本转换为多种语言和声音的自然语音。例如，您可以使用该服务执行以下操作：\n\
  \n- 通过以多种语言和语调与用户互动，改善客户体验和参与度。\n- 为不同能力的用户提高内容可访问性。\n- 提供音频选项以避免分心驾驶。\n- 自动化客户服务交互以提高效率。\n\
  \n#### IBM OpenPages\n\nCloud Pak for Data 上的 IBM **OpenPages** 组件是一个集成的**治理、风险与合规（GRC）**套件，使管理人员能够识别、管理、监控和报告贯穿整个企业的风险和合规计划。\n\
  \nOpenPages 服务提供了一个强大、可扩展且动态的工具集，使您能够处理以下用例：\n\n- 业务连续性管理\n- 财务控制管理\n- 内部审计管理\n\
  - IT 治理\n- 模型风险治理\n- 运营风险管理\n- 政策管理\n- 监管合规管理\n- 第三方风险管理\n\n然后，根据您的用例安装以下一个或多个可选软件包：\n\
  \n- **Financial Crimes Insight for Alert Triage**：使分析师能够利用 Watson 的分析和认知能力快速评估警报，以确定哪些警报需要进一步调查。\n\
  - **Financial Crimes Insight for Claims Fraud**：在欺诈性理赔支付之前，在保险理赔流程早期发现可疑行为。\n- **Financial\
  \ Crimes Insight for Conduct Surveillance**：使用全面监控、行为分析和认知洞察来识别、描述并优先处理员工不当行为：\n\
