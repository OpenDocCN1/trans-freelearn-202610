  现在我们已经介绍了企业数据架构，接下来让我们讨论 NoSQL 数据存储。


  ### NoSQL 数据存储——主要类别


  NoSQL 数据存储根据其架构和用途大致可分为四类。它们如下：


  -   **文档数据库**将每个键映射到一个复杂的数据结构，称为文档。文档可以是键-数组对、键-值对，甚至是嵌套文档。文档数据库中最受欢迎的一些选择包括 MongoDB、CouchDB、Raven
  DB、IBM Domino 和 MarkLogic。

  -   **键值存储**是 NoSQL 数据库*最简单*的形式。每一行都存储为一个键值对。常见的例子包括 Redis、Memcached 和 Riak。

  -   **宽列存储**，也称为列式数据存储，针对大型数据集上的查询进行了优化，并且将数据按列而非按行存储。例子包括 Cassandra 和 HBase。

  -   **图存储**存储关于图的信息；网络，例如社交连接；道路地图；以及交通链接。Neo4j 是最流行的图存储。


  接下来，我们将回顾 Cloud Pak for Data 的一些功能，这些功能使其能够应对一些挑战，其中之一是数据虚拟化。


  ### 数据虚拟化——随时随地访问数据


  从历史上看，企业将来自多个来源的数据整合到中央数据存储中，例如*数据集市*、*数据仓库*和*数据湖*，以便进行分析。虽然这对于某些用例仍然非常相关，但每次业务用户或数据科学家需要新数据时，所需的时间、金钱和资源使其难以扩展。提取、转换和整合数据是资源密集、昂贵且耗时的，而数据虚拟化可以避免这些。


  **数据虚拟化**使用户能够直接访问源数据，消除了数据治理和安全的复杂性及手动流程，以及增量存储需求。这也有助于简化应用程序开发并注入敏捷性。另一方面，**提取、转换、加载（ETL）**对于复杂的转换过程很有帮助，并且很好地补充了数据虚拟化，后者允许用户绕过许多早期的数据移动和转换环节，从而以近乎实时的方式提供集成的、对业务友好的视图。


  下图展示了数据虚拟化如何连接数据源和数据消费者，从而通过单一视图访问整个企业的分布式数据集：


  ![](img/50e1dac0750b69f2b8e8efff000eb13b_66_0.png)


  图 3.8 – 数据虚拟化——管理你的所有数据，无论其位于何处


  提供数据虚拟化的供应商很少。根据 Tech Target 的说法，市场上数据虚拟化的前五名供应商如下：


  -   Actifio Sky

  -   Denodo

  -   IBM Cloud Pak for Data

  -   Informatica PowerCenter

  -   Tibco Data Virtualization


  其中，IBM 以其集成方法和规模脱颖而出。它专注于将数据管理、数据治理和数据分析整合到一个统一平台中的统一体验，这与当今企业的需求产生共鸣，而其独特的 IP 使
  IBM 的数据虚拟化能够在水平和垂直两个方向上扩展。此外，IBM 还利用下推优化来利用数据源的资源，使其能够无约束地扩展。


  分布式数据系统中的一个常见场景是许多数据库以通用模式存储数据。例如，你可能拥有多个存储销售数据或事务数据的数据库，每个数据库对应一组租户或一个区域。Cloud
  Pak for Data 中的数据虚拟化可以自动检测系统中的通用模式，并使其在数据虚拟化中显示为单一模式——这一过程称为**模式折叠**。例如，存在于 20 个数据库中的
  SALES 表现在可以显示为单个 SALES 表，并可以通过**结构化查询语言（SQL）**作为一个虚拟表进行查询。


  ### 数据虚拟化与 ETL——何时使用什么？


  从历史上看，数据仓库和数据湖是通过使用 ETL 批量移动数据来构建的。市场上领先的 ETL 产品之一恰好来自 IBM，名为 IBM DataStage。因此，这就引出了一个问题：何时应该使用数据虚拟化，何时应该使用
  ETL 产品。答案取决于具体用例。如果意图是实时探索和分析小数据集，并且数据可能每隔几分钟或几小时发生变化，则建议使用数据虚拟化。请注意，此处提到的小数据集是指实际传输的数据，而不是执行查询所针对的数据集。另一方面，如果用例需要跨多个来源处理大型数据集，并且数据随时间大致保持静态（历史数据集），则强烈建议使用基于
  ETL 的解决方案。


  ### 平台连接——简化数据连接


  Cloud Pak for Data 还包含**平台连接**的概念，它使企业能够通用地定义数据源连接。这些连接可以被平台中的所有不同服务共享。这不仅简化了管理，还使不同服务的用户能够轻松找到并连接到数据源。Cloud
  Pak for Data 还提供了在服务级别定义连接以覆盖平台连接的灵活性。最后，管理员可以选择为给定连接设置用户凭据，或者强制单独用户输入各自的凭据。以下是
  **Cloud Pak for Data v4.0** 的平台连接功能截图，该版本于 2021 年 6 月 23 日发布：


  虽然在不移动数据的情况下访问数据是一个很好的起点，但 Cloud Pak for Data 还使客户能够在其平台上持久化数据。你可以在 Cloud Pak for
  Data 上轻松部署、配置和扩展各种数据存储。Cloud Pak for Data 支持的数据库如下：


  -   Db2（包括 OLTP 和分析工作负载）

  -   Db2 Event Store

  -   MongoDB

  -   Enterprise DB PostgreSQL

  -   Cockroach DB

  -   Crunchy DB PostgreSQL

  -   支持对象存储——计算与存储分离


  Cloud Pak for Data 拥有一个充满活力且开放生态系统，未来 1-2 年内计划引入更多数据源。这为客户提供了自由选择其数据存储的灵活性，同时继续利用其现有数据环境。最后，值得一提的是，平台上所有可用的数据存储都是容器化的，并且设计为云原生，使客户能够轻松配置、升级、扩展和管理其数据存储。此外，客户可以在任何私有云或公有云上部署这些数据存储，从而实现可移植性。这在数据引力以及数据与分析共置至关重要的场景中非常关键。


  ### 总结


  数据是世界上最有价值的资源，为了成功，企业需要以数据为中心，并将其数据作为关键差异化因素。然而，不断增长的数据量、不断演化的数据存储和分布式数据集使得企业和业务用户难以轻松找到和访问所需的数据。当今的企业数据架构相当复杂，有大量针对特定工作负载优化的数据存储。数据虚拟化提供了解决这一独特挑战的灵丹妙药，而
  IBM 的 Cloud Pak for Data 是当今市场上的关键供应商之一。它凭借其扩展能力和集成方法脱颖而出，该方法满足了数据管理、数据组织和数据分析的需求。


  最后，IBM 的 Cloud Pak for Data 通过多个容器化数据存储补充其数据虚拟化服务，使客户能够在平台上持久化数据，同时也能在不移动数据的情况下访问其现有数据。


  在下一章中，你将学习如何创建可信的分析基础，并组织你在数据存储中收集的数据。






  在本章中，我们将涵盖以下主要主题：


  - 介绍 **Data Operations (DataOps)**

  - 组织企业信息资产

  - 建立元数据和管控

  - 通过分析了解数据

  - 对数据进行分类以确保完整性

  - 通过数据质量建立信任

  - 数据隐私和活动监控

  - 大规模数据集成

  - IBM 主数据管理

  - 将主数据管理扩展为数字孪生

