- "## 11 存储\n\n**Cloud Pak for Data** 利用 Kubernetes 的 **持久卷** 概念，该概念在 OpenShift 中得到支持，以使其各种服务能够存储数据和元数据。Cloud\
  \ Pak for Data 服务还可以连接到远程数据库、数据湖和对象存储，以及作为数据源的远程导出文件系统。我们将研究为集群内 PV 和集群外外部存储提供支持的概念和技术。到本章结束时，您将了解在各种公有云和私有云基础设施中有哪些可用选项，以及如何最好地为您的用例优化数据存储。您还将了解存储应如何进行运营化，特别是为了支持整个解决方案的持续可用性。\n\
  \n在本章中，我们将涵盖以下主要主题：\n\n- 持久卷\n- 连接到外部卷\n- 运营考虑\n\n### 理解持久卷的概念\n\n我们将首先对 Kubernetes\
  \ 中的基础存储概念进行快速介绍，以及 Cloud Pak for Data 如何利用存储。典型的容器是无状态的，这意味着它们创建的任何文件或所做的任何更改都是临时的；在重新启动容器后，这些更改不会被恢复。此外，容器内的文件将在主机上的临时位置创建，这可能导致与该位置的其他类似使用者发生冲突。在\
  \ **Kubernetes** 中，卷的概念 [1] 使有状态容器所需目录文件的持久化成为可能。此类卷安装在 Kubernetes Pod 中，并且根据与该卷关联的访问模式，相同的目录内容可以与在该\
  \ Kubernetes 命名空间内并发运行的其他 Pod 共享。\n\n在本节中，您将了解什么是预配称为 **持久卷** 的实体，它们为 Cloud Pak\
  \ for Data 工作负载提供存储，并且可以针对性能、可靠性和扩展性进行配置。\n\n多种技术和供应商使 Kubernetes 中的存储成为可能；我们将探讨目前由\
  \ Cloud Pak for Data 认证的那些技术。\n\n### Kubernetes 存储介绍\n\nKubernetes 提供了一种称为 **持久卷声明\
  \ (PVCs)**[2] 的构造，作为 Pod 挂载块和文件 **持久卷 (PVs)** [2] 的抽象，而无需使用特定于供应商的处理。存储供应商，通常作为操作符引入，提供必要的服务来定义\
  \ **存储类** [3] 和 **动态预配器** [4]，以创建、初始化并将这些卷文件系统挂载到不同的 Pod 中。虽然存储软件和配置是特定于供应商的，但 PVC\
  \ 的概念使使用存储成为一种标准程序，不受提供该存储所用技术的限制。\n\n请注意，Cloud Pak for Data 需要使用 **动态预配器**；即按需预配存储的能力。静态预配器预先定义存储卷，对于通过动态、*即插即用*\
  \ 机制部署 Cloud Pak for Data 服务来说是不够的。扩展此类服务在许多情况下也可能自动要求我们创建新卷。\n\n存储类由 `StorageClass`\
  \ Kubernetes Kind 资源表示，用于引用每种类型的卷。当 Cloud Pak for Data 服务被预配时，它们包含 PVC 声明，然后由 Kubernetes\
  \ 处理以预配并绑定 PV。\n\n例如，用户主目录卷是通过定义类似于以下内容的 `PersistentVolumeClaim` 来请求的：\n\n```yaml\n\
  apiVersion: v1\nkind: PersistentVolumeClaim\nmetadata:\n  name: \"user-home-pvc\"\
  \nspec:\n  storageClassName: {{ <user-selected-storage-class> }}\n  accessModes:\n\
  \    - ReadWriteMany\n  resources:\n    requests:\n      storage: {{ default \"\
  100Gi\" or <user-selected-size> }}\n```\n\n您还会注意到 PVC 定义标识了参数，例如要使用的存储类和已请求的存储大小。这些是通过\
  \ Cloud Pak for Data 服务的安装选项引入的。\n\n*声明* 中的声明，连同存储类和其他属性（例如 `size` 和 `accessModes`），代表向\
  \ Kubernetes 请求为 Cloud Pak for Data 服务预配卷的 *请求*。一旦存储卷被预配，Kubernetes 然后通过将预配的 PV\
  \ *绑定* 到 PVC 来满足该声明。此绑定元数据然后使 Kubernetes 能够始终将相同的存储卷挂载到 Pod 中，以及使服务能够使用 PVC 的抽象始终引用该卷，而无需了解卷在物理上存在的位置或其背后的驱动程序/存储技术。\n\
  \n> **注意**\n>\n> 您无需显式定义 PVC。PVC 将在 Cloud Pak for Data 服务安装过程中声明。\n\n\n\n\nStorageClass\
  \ 定义还可以指定要使用的供应商特定 provisioner。当存储软件安装到 OpenShift 集群中时，会预定义一些存储类；其他供应商则提供定义新存储类的功能，并带有自定义参数，以便针对特定用例对卷进行微调。\n\
  \n例如，ocs-storagecluster-ceph-rbd（RWO）和 ocs-storagecluster-cephfs（RWX）存储类作为 OpenShift\
  \ 容器存储安装的一部分提供，而 Portworx 则通过不同的可配置属性集显式定义存储类，以优化性能或质量。\n\n用于 IBM 的 Portworx Essentials\
  \ 安装包中包含 Cloud Pak for Data 服务使用的一系列存储类。以下是其中一个 RWX 类的片段，即 portworx-shared-gp3：\n\
  \n```\napiVersion: storage.k8s.io/v1\nkind: StorageClass\nmetadata:\n  name: portworx-shared-gp3\n\
  parameters:\n  priority_io: high\n  repl: \"3\"\n  sharedv4: \"true\"\n  io_profile:\
  \ db_remote\n  disable_io_profile_protection: \"1\"\nallowVolumeExpansion: true\n\
  provisioner: kubernetes.io/portworx-volume\nreclaimPolicy: Retain\nvolumeBindingMode:\
  \ Immediate\n```\n\n以下是 portworx-metastoredb-sc RWO 类的片段：\n\n```\napiVersion: storage.k8s.io/v1\n\
  kind: StorageClass\nmetadata:\n  name: portworx-metastoredb-sc\nparameters:\n  priority_io:\
  \ high\n  io_profile: db_remote\n  repl: \"3\"\n  disable_io_profile_protection:\
  \ \"1\"\nallowVolumeExpansion: true\nprovisioner: kubernetes.io/portworx-volume\n\
  reclaimPolicy: Retain\nvolumeBindingMode: Immediate\n```\n\n在这里，您可以看到一些供应商特定的参数。有些用于性能优化，有些则用于冗余（复制）和控制，例如检查所制备的卷是否可以扩展。\n\
  \n同样，其他存储 provisioner（如 IBM Spectrum Scale）也有类似的配置参数作为其存储类的一部分。\n\n一旦 Kubernetes\
  \ 根据请求的 PVC 中指定的要求制备了这些 PV，Kubernetes 就会利用存储物理位置与 PV 构造之间的绑定，抽象出各个 Pod 如何访问存储。随后，在单个\
  \ Cloud Pak for Data Pod 启动时，Kubernetes 会使用存储供应商或底层技术提供的驱动程序来挂载这些已制备的 PV。\n\n在安装\
  \ Cloud Pak for Data 服务时，用户会选择特定的存储类作为安装参数。Cloud Pak for Data 文档 [6] 中提供了有关哪些类型的存储类适合每个服务的指导\
  \ [7]。\n\n现在，让我们更深入地了解存储拓扑本身，例如存储可能位于何处，以及不同的 Kubernetes 节点访问存储意味着什么。\n\n大体上，我们可以将存储位置分类如下：\n\
  \n- **集群内存储：** 这是物理存储设备/磁盘和存储软件控制系统所在的位置。它们用于在这些设备中制备和管理卷，并且与 Cloud Pak for Data\
  \ 本身位于同一个 Kubernetes 集群中。\n- **集群外存储：** 这是物理存储设备和存储软件独立于 Cloud Pak for Data 预期运行的\
  \ Kubernetes 集群进行操作的位置。Kubernetes 集群上可能只存在存储驱动程序，以及从该远程存储系统制备和挂载卷。\n\n从存储卷访问的角度来看，Kubernetes\
  \ 生态系统中存在各种类型的软件驱动程序（软件定义存储）和插件代码来支持卷挂载 [12]。有些被称为“in-tree”卷 provisioner，指的是 Kubernetes\
  \ 本身原生存在、用于处理这类存储的代码；另一些则被称为“out-of-tree” provisioner，指的是存在于 Kubernetes 之外、但可以插入以配合不同存储解决方案的代码。较新版本的\
  \ Kubernetes 还包含一个名为容器存储接口（CSI）[13] 的驱动程序标准。这些 provisioner 呈现一个或多个存储类，为 Kubernetes\
  \ 中的应用程序提供所需的存储抽象。因此，Kubernetes 应用程序可以设计为基于 PVC 和存储类标准工作，并完全独立于实际的物理位置、组织或处理存储所需的驱动程序。\n\
  \n### 集群内存储\n\n这种部署选项通常是指在 Cloud Pak for Data 服务所在的同一个 Kubernetes 集群中，将存储和计算部署在一起。存储设备连接到多个计算工作节点或基础架构节点，而软件定义的存储解决方案通过将卷挂载到需要的位置，协调存储的制备和使用方式。这些节点通常通过集群内部的低延迟、高吞吐量网络连接。此类存储仅供该\
  \ Kubernetes 集群内运行的应用程序和工作负载使用。\n\nKubernetes 原生支持通过使用计算主机的 hostPath [8] 直接挂载卷，也支持使用本地卷的节点亲和机制\
  \ [9]，以解决将 Pod 调度到与存储相同的工作节点上的调度难题。然而，这些选项不提供动态制备支持，而且当底层工作节点离线时，可靠性会受到影响。此外，OpenShift\
  \ 的受限安全上下文 [11] 默认不允许从主机挂载大量此类卷。使用 hostPath 或本地卷还会导致 Kubernetes 应用程序在存储方面产生紧密耦合。应用程序的可移植性以及存储类和制备技术的清晰抽象都会丧失。因此，Cloud\
  \ Pak for Data 不依赖 hostPath 或本地卷类型。\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_281_0.png)\n\
  \n这种组织方式仍可被视为超融合，因为 Kubernetes 集群同时支持存储和计算。Kubernetes 集群中节点之间的私有低延迟网络仍能以高性能方式支持\
  \ Pod 访问存储。\n\n这种变体无法利用存储块和计算的物理共置来实现“本地”挂载优化，但其优势在于简化了节点操作和维护。这种分离有助于确保存储服务不会受到其他\
  \ Kubernetes 工作负载突发流量（即“吵闹邻居”效应）的影响，反之亦然。\n\n下图展示了集中式存储管理解决方案如何（通过标准 NFS 协议或其他自定义机制）暴露卷的示例：\n\
  \n![](img/50e1dac0750b69f2b8e8efff000eb13b_284_0.png)\n\n图 11.4 – 使用 NFS 进行集中式存储管理\n\
  \n存储应由 provisioner 根据需要动态制备，以满足 Kubernetes 中定义的 PVC。驱动程序（或原生的 NFS）支持如何将这些卷物理挂载到调度在不同\
  \ Kubernetes 计算工作节点上的不同 Pod 中。\n\n有关如何使用此 provisioner 以及定义存储类的详细指导，请参阅“延伸阅读”部分的\
  \ [14]。\n\n请注意，从生产角度来看，所分配的 NFS 服务器不应成为单点故障，它必须具有高可用性并支持自动故障转移（也就是说，它不能像单个 Linux\
  \ 系统上的 NFS 守护进程那样简单）。如果 NFS 服务器发生故障，所有 PVC 挂载都将变得不可用。因此，企业级弹性存储管理解决方案对于确保整体可靠性至关重要。\n\
  \n### 运维注意事项\n\n在前面的章节中，我们讨论了为 Cloud Pak for Data 中的容器化服务提供或使用集群内或集群外存储意味着什么。然而，同样关键的是确保存储基础架构本身具有弹性，并存在可确保不丢失数据的运维实践。从灾难恢复（DR）的角度来看，还必须考虑存储故障转移。\n\
  \n在本节中，我们将快速了解一些典型的实践和工具，可用于确保 Cloud Pak for Data 服务具有弹性运行能力，并确保数据保护。\n\n#### 集群内存储的持续可用性\n\
  \nKubernetes 的一个核心原则是确保应用程序的持续可用性。这包括跨多个可用区的计算负载均衡和副本。这些可用区可以是公有云中的故障（或可用性）区，也可以是本地部署中独立供电的硬件机架\
  \ [17]。\n\n对于集群内存储而言，这要求存储也必须持续复制——这在很大程度上取决于所使用的存储供应商或技术。以下是持续可用性的示例拓扑，有时也称为双活容灾：\n\
  \n![](img/50e1dac0750b69f2b8e8efff000eb13b_285_0.png)\n\n图 11.5 – 双活容灾\n\n\n\n\n\
  该模型有时被称为 *stretched* 集群，因为假设只有一个集群，即使某些 Nodes 可能位于不同的物理“区域”。\n\n关键在于确保存储块以接近实时的方式在区域之间进行复制。通过这种部署，stateful\
  \ Pods 无论物理位于哪个区域，都始终可以访问其 PVs。一个存储节点/副本的故障不应导致整个应用程序失败。这是因为其他存储副本应该能够提供必要的数据块。Kubernetes\
  \ 中支持这种持续可用性概念的存储驱动程序完全抽象（通过 PVCs）数据是从哪里物理获取的，并且可以在自动故障转移到使用不同副本的存储时自动进行。\n\n从负载均衡的角度来看，我们通常认为所有计算\
  \ Pods 始终处于活动状态并可供使用，而与其位于哪个区域无关。即使整个区域变得不可用，只有计算和存储副本变得无法访问，这意味着其他副本可以填补空缺。\n\n\
  此类存储驱动程序通常也配置为感知集群拓扑 [18]，例如，通过使用 Kubernetes 节点标签来指定故障区域。这使它们能够将 PV 副本放置在不同的区域中，从而在某个区域丢失时提供弹性。这种复制模型的一个常见问题是“脑裂”效应，即由于不同\
  \ Nodes 无法通信和同步数据的故障情况，存储副本具有不一致的数据块。因此，此类存储驱动程序具有在这些条件下隔离存储的复杂性，以及识别副本已离线过久需要更新以“追赶”或在添加新存储副本时复制数据块的能力。这对于确保应用程序数据在所有副本中始终保持一致至关重要。\n\
  \n虽然在这些区域之间具有低延迟网络至关重要，但这种多区域复制技术也要求所使用的存储技术具有这种复杂性。例如，Red Hat OpenShift Container\
  \ Storage（Ceph）和 Portworx Enterprise 支持此类要求，大多数公共云 IaaS 存储提供商也是如此。\n\n使用离集群存储也可以在技术上实现持续存储可用性，尽管将存储区域与\
  \ Kubernetes 集群区域对齐需要多一点努力。外部存储管理器，例如 IBM Spectrum Scale、Dell EMC Isilon、NetApp\
  \ onTap 和基于 NAS 的解决方案，传统上提供了跨区域同步复制的机制。\n\n快照通常存储在同一设备中，这意味着它们的可靠性仅与设备本身一样可靠。因此，存储供应商\
  \ [20] 还提供了为云存储创建此类快照的机制，例如 S3 对象存储。\n\n- **通过可用卷数据的副本：** 这种方法依赖于 rsync 或将来自 PVCs\
  \ 的某些数据复制到另一个 PVC（通常是远程存储卷）或对象存储。`cpd-cli backup-and-restore` 实用程序有一个 Kubernetes\
  \ 服务，允许我们将数据从 PVs 复制到备份卷。\n\n然而，这种技术要求该 Kubernetes 命名空间中的所有服务都进入“维护模式”（或完全静默），以防止在复制卷数据时发生任何\
  \ I/O。优点是这适用于任何类型的存储，包括 NFS，用于 PVs，并且不需要存储系统提供任何特定功能。\n\n#### Quiescing Cloud Pak\
  \ for Data services\n\n为了实现应用级一致性，在备份进行期间必须暂停写入。为了支持此类要求，`cpd-cli` 实用程序包含一个 `backup-restore\
  \ quiesce` 命令，指示服务暂时进入维护模式。该实用程序还缩减了一些 Deployments 以防止任何 I/O 活动。一旦备份完成，则使用 `backup-restore\
  \ unquiesce` 命令将服务从维护中扩展。注意，虽然这种 **quiesce** 意味着 Cloud Pak for Data 在该持续时间内不可用——即处于维护模式——但能够实现应用一致的备份也很重要。\n\
  \n**quiesce** 机制也可以用于外部存储备份或快照，例如当 NFS 用于 PVs 时。例如，当 IBM Spectrum Scale 提供 NFS 卷时，您可以使\
  \ Cloud Pak for Data 命名空间中的服务进入静默状态，然后触发 GPFS 快照并使服务恢复静默。\n\n#### Db2 database backups\
  \ and HADR\n\n确保数据库以可靠和连续的方式运行对于企业来说通常至关重要。虽然支持写入暂停/quiesce，但 Db2 提供了额外的技术，允许 Db2\
  \ 数据库在备份操作进行期间仍可在线 [22] 使用。这也独立于所选择的存储技术，并且可以支持增量备份。\n\nDb2 高可用性灾难恢复（HADR）配置 [23]\
  \ 将两个 Db2 数据库实例配对，这些实例可能存在于同一集群中（例如，不同的 Kubernetes 命名空间）甚至远程集群。在此配置中，数据从活动源数据库复制到备用目标。当发生全站故障或活动\
  \ Db2 数据库被认为无法访问时，会自动故障转移到备用数据库。Db2 HADR 自动客户端重定向（ACR）功能是一种机制，客户端连接到失败的 Db2 数据库时，可无缝切换到新的活动\
  \ Db2 数据库。\n\n#### Kubernetes cluster backup and restore\n\n前面描述的快照机制和 `cpd-cli\
  \ backup-and-restore` 实用程序只能将数据从 PVCs 复制并恢复到新的 PVCs。在新集群中恢复此类备份时，期望目标集群以与原始集群相同的方式设置。这意味着必须在目标集群中安装必要的\
  \ Cloud Pak for Data 服务，并且在数据恢复过程进行之前，所有 Kubernetes 资源都必须存在。\n\nVelero 项目 [24] 引入了一种备份所有\
  \ Kubernetes 资源工件的机制。这允许在数据恢复发生之前轻松重建目标集群。Red Hat 为 OpenShift 集群引入的 OpenShift API\
  \ for Data Protection Operators [25]，结合 Ceph-CSI 驱动程序，提供了一种更好地运营化集群级备份和恢复的方法。它还支持其他用例，例如复制或迁移集群。\n\
  \n#### Summary\n\n在本章中，我们介绍了 Kubernetes 中 PVs 的概念以及 Cloud Pak for Data 如何与不同的存储技术和供应商协同工作。我们还讨论了存储拓扑以及可能存在于不同企业中的供应商或技术。\n\
  \n本章还强调了数据保护以及备份和恢复的运营化，以及 DR 实践的重要性。确保您对存储有深入的理解，可确保 Cloud Pak for Data 服务以及在其之上构建的企业解决方案以弹性和所需的性能水平运行。\n"
- "## 12 Multi-Tenancy\n\n多租户是一种软件架构设计，其中多个用户或组织共享同一软件实例及其底层资源。这是 **Software-as-a-Service\
  \ (SaaS)** 提供的标准做法，例如 IBM Cloud 中的 Cloud Pak for Data as a service，但对租户的解释以及租户如何在本地或私有云中实现可能存在很大差异。企业中的\
  \ **Security** 和 **compliance** 要求，以及 *quality of service assurances*，在决定可以共享多少方面发挥着重要作用。\n\
  \n如今，任何真正的云原生平台堆栈能够开箱即用地至少实现一定程度的多租户共享已成为基本期望。仅通过重用现有共享基础设施即可加速支持新项目或计划。简单地假设为每个租户分配独立的\
  \ **virtual machines (VMs)** 就足以实现多租户——毕竟，底层裸机资源确实是共享的。但为企业中的每个部门提供专用的 VM 集群在成本上是不可行的；仅管理多个集群或软件安装所需的操作成熟度本身就会变得\
  \ prohibitively expensive。\n\n大多数企业，无论是在托管的公共云基础设施还是本地运行，都更喜欢租户之间在性能、安全性、**privacy**\
  \ 方面有一致保证的共享程度。仅仅将 VM 分配给租户已不再被认为足够，并且随着容器化技术的出现，现在可以实现更细粒度的多租户，甚至多个租户共享同一台 VM。这也使安全问题变得更加复杂，因为即使操作系统也被共享，不同租户的进程并排运行。\n\
  \n\n\n\n\nIBM 在其云平台的 Cloud Pak for Data SaaS 方案中采用了复杂的 multi-tenancy 技术，并且 Cloud\
  \ Pak for Data 软件栈的架构基础也能够使企业在同一个 OpenShift Kubernetes 集群上支持多个租户。第 9 章《Technical\
  \ Overview, Management, and Administration》介绍了如何通过审慎使用 Kubernetes 命名空间来实现多租户，即单个\
  \ OpenShift 集群在多个租户之间共享。在安全可靠地实施多租户时，需要仔细权衡，同时要兼顾企业的需求、策略以及租户所期望的服务保证。\n\n在本章中，我们将涵盖以下主题：\n\
  \n- Tenancy considerations\n- Architecting for multi-tenancy\n- A review of the\
  \ tenancy requirements\n- In-namespace sub-tenancy with looser isolation\n\n###\
  \ Tenancy considerations\n\n我们将首先仔细审视多租户意味着什么、租户为何重要，以及总体而言，在规划此类共享部署时需要做出哪些架构选择、权衡和关于费用的妥协。\n\
  \n#### Designating tenants\n\n每个企业在识别其租户时通常有非常不同的理解，但总体而言，租户被定义为被授予特定权限以访问共享软件安装的选定用户组。当租户代表完全不同的公司时，一个租户的用户通常不知道其他租户用户的存在。然而，即使这种隔离也可以在同一企业内部的用户之间放宽，公司内的员工可能是多个租户“账户”的成员。\n\
  \n在每个租户范围内，可以授予特定用户管理权限并将其范围限定在其实例中，以使租户具备一定的自助服务能力。这允许租户管理员执行部分 Cloud Pak for Data\
  \ 管理功能，包括自行管理用户访问和故障排除，如第 9 章《Technical Overview, Management, and Administration》所述。\n\
  \n> **A note on the role of tenant users**\n>\n> 包括这个 Tenant Admin 角色在内，所有来自租户组的用户都应被视为终端用户；即专注于使用\
  \ Cloud Pak for Data 服务提供的功能的人群，而不是负责自行管理安装或集群基础设施的人员。\n>\n> Tenant Admins 也是终端用户，但在自助管理方面扮演着稍重要的角色——他们架起了运维团队与\
  \ Cloud Pak for Data 实例使用者之间的桥梁。\n\n#### Onboarding tenants\n\n在这种多租户部署中，需要有一个正式流程来识别租户、授予他们对分配资源适当的（有限）访问权限，并计量其使用情况。在\
  \ Cloud Pak for Data 中，规定做法是运维团队为部署 Cloud Pak for Data 服务创建唯一的 OpenShift 项目命名空间，并配备适当的\
  \ ResourceQuotas。\n\n根据对 Kubernetes 访问的策略，OpenShift 集群管理员可以向租户管理员用户授予对该 OpenShift\
  \ 项目命名空间的有限 RBAC 权限。这将允许此类租户根据需要部署 Cloud Pak for Data 服务（或升级它们）。\n\n> **Note**\n\
  >\n> 如第 9 章《Technical Overview, Management, and Administration》所述，操作员的使用旨在帮助运维团队（操作员毕竟是将运维知识编码到软件中）和租户本身。集群管理员根据其租户用例（以及相关的容器镜像）引入所需的任何操作员并保持其最新。当租户需要在其命名空间中部署服务时，他们只需使用适当的自定义资源规范“声明”其需求，而无需成为理解如何自动化安装（或升级）任何服务的专家。\n\
  \n### Architecting for multi-tenancy\n\n在本节中，我们将探讨使用 Cloud Pak for Data 实现多租户意味着什么，从如何在\
  \ OpenShift 集群上规划拓扑以及如何在同一集群内分离租户开始。\n\n#### Achieving tenancy with namespace scoping\n\
  \n正如我们之前所建立的，为每个唯一租户分配唯一的 OpenShift 项目（Kubernetes 命名空间）是 Cloud Pak for Data 多租户部署的推荐方法。\n\
  \n下图显示了多个租户如何被沙箱化到独立的 OpenShift 项目中，以及 Operations 区域（由集群管理员管理）与 Tenants 区域（租户用户可能被授予访问权限）之间的逻辑分离：\n\
  \n![](img/50e1dac0750b69f2b8e8efff000eb13b_300_0.png)\n\nFigure 12.1 – Individual\
  \ tenant namespaces in a shared Kubernetes cluster\n\n**Cluster Operations zone**\
  \ 包括 OpenShift 和 Kubernetes 提供的所有管理功能（为简洁起见，前述图中未显示全部）。**Operator Lifecycle Manager\
  \ (OLM)** 提供操作员和服务，用于安装和管理 Cloud Pak for Data 本身。它对于实现多租户也非常重要，因为它提供了扩展集群的正确抽象，并使不同的功能（通过服务操作员）能够在集群中可用。为了满足职责分离要求，OLM\
  \ 可以完全由集群管理员控制并集成到其 CI/CD 流程中，而租户，包括其管理员，被拒绝访问。\n\n**Cloud Pak Foundational Services\
  \ (CPFS)** 通常位于 *ibm-common-services* 命名空间中。这包括 *namespace-scope operator*，它对于确保\
  \ Cloud Pak for Data 操作员仅受限于管理特定租户命名空间而不是 *所有* 命名空间至关重要。这些操作员根本不需要监视 *非* Cloud Pak\
  \ for Data 命名空间，而且出于安全原因（最小权限原则），最好甚至不授予这些操作员该权限。虽然 Cloud Pak for Data 服务操作员可以与\
  \ CPFS 一同位于 *ibm-common-services* 中，但它们也可以安装在不同的 *cpd-operators* 命名空间中，如前述图所示。例如，当同一集群中存在其他\
  \ Cloud Pak 时，您可能会选择使用 *cpd-operators*。虽然 CPFS 操作员需要管理所有 Cloud Pak 命名空间，但 Cloud\
  \ Pak for Data 操作员并非如此，并且通过将它们隔离到 *cpd-operators*，您可以确保它们仅限于 Cloud Pak for Data\
  \ 命名空间。\n\n> **Note**\n>\n> 如前述图所示，每个租户命名空间都有自己独立的 Cloud Pak for Data 控制平面副本，并根据需要进行扩展，包括带有自己私有\
  \ ingress/route 的前端入口。OpenShift 能够通过唯一的租户 URL 暴露此前端入口供访问。这使得客户端应用能够从集群外部连接到适当的租户实例。\n\
  \n每个租户的身份验证和审计可以独立配置。用于生成 bearer token 的签名密钥对每个租户都是唯一的。因此，使用一个租户实例的身份验证令牌将无法访问另一个租户。授权形式为\
  \ *roles and permissions*，可以帮助租户管理员以精细的方式向该租户的用户授予授权。此租户的 Cloud Pak for Data 安装中的对象和功能仅对授权用户可用。\n\
  \nOpenShift 还会自动为每个项目生成唯一的 *UID* 范围。因此，一个 Cloud Pak for Data 租户命名空间内的 Linux 进程运行的\
  \ UID 与另一个命名空间的进程不同。这与 **RHEL's SELinux** 能力相结合，确保即使来自两个租户的 Pod 被调度到同一 Linux 主机上，这些进程也无法相互交互。因此，可能感染了某个租户\
  \ Pod 的恶意进程，或可能意外引入的用户错误，都不会影响另一个租户的 Pod 进程。请注意，某些 Cloud Pak for Data v4 服务依赖于通过使用自定义\
  \ SCC 的固定 UID（如 *Chapter 10, Security and Compliance* 中所述）。\n\n通过网络策略，可以在命名空间内允许访问，微服务可以相互通信。然而，来自另一个租户的微服务的访问可以被有效阻止，除非是通过前端入口进入的请求，并且只有经过正确授权的请求。\n\
  \n#### Choosing dedicated versus shared compute nodes\n\n在 OpenShift 中，SELinux 和\
  \ Linux 进程的唯一租户 UID 在不同租户的进程并排执行、共享同一操作系统内核运行时时提供了相当大的安全性。借助命名空间 ResourceQuotas\
  \ 以及 Cloud Pak for Data 监控和执行使用配额的能力，还有额外的控制措施可确保嘈杂的租户工作负载不会对另一个租户产生不利影响，并且集群中的\
  \ SLA 可以得到保证。\n\n然而，企业中的安全策略可能不允许将一个租户的进程与另一个租户共置，或 SLA 要求租户之间某种程度的物理隔离。显然，由于为单个租户分配独立的\
  \ Kubernetes 集群在运营上成本过高，OpenShift 容器平台提供了支持此类要求的选项。\n\n\n\n\n集群管理员可以向 OpenShift\
  \ 项目引入 NodeSelector 注解，以指定哪些计算工作节点（通过标签标识）用于调度该租户的 Pod。这确保了在原本共享的 OpenShift 集群中，该租户拥有专用节点。作为租户入职流程的一部分，集群管理员只需使用此注解，即可决定是使用共享计算主机还是分配专用主机。虽然对于某些服务（如数据库）可以使用\
  \ Kubernetes 的 Pod 级节点亲和性概念，但在必要时，通常更容易将租户的所有节点分配到专用节点。\n\n### 审查租户要求\n\n在第9章“技术概述、管理和行政管理”中，我们简要介绍了支持\
  \ Cloud Pak for Data 多租户所需解决的关键属性。\n\n从某种意义上说，我们可以将这些要求与传统操作系统环境中应用程序的租户概念联系起来，尽管规模更大。Unix\
  \ 或 Linux 系统会安装所有必需的软件，超级用户（“root”）负责管理该系统。root 用户将授权用户访问该系统，并将他们分配到不同的用户组（“租户”）。通过使用简单的文件系统权限（组\
  \ ID 和用户 ID），这些用户可以在其租户组内协同工作，并在一定程度上与其他租户隔离。用户可以执行和访问他们（或其组）已被授予访问权限的应用程序，而操作系统安全原语（如\
  \ SELinux 和 AppArmor）则确保严格控制跨进程访问。\n\n> **注意**\n> Kubernetes 集群仅仅是新的“操作环境”，并在更高层次上支持与操作系统相同的许多范式。集群管理员是“root”用户，他们可以向其他用户授予各种基于角色的访问权限。从多租户的角度来看，此类管理员现在可以利用额外的操作环境原语，例如\
  \ OpenShift 安全上下文约束、虚拟项目/Kubernetes 命名空间中的租户隔离，以及细粒度的 RBAC，如第10章“安全与合规性”所述。\n\n\
  在本节中，我们将评估以下关键租户要求：\n\n- 隔离\n- 安全与合规性\n- 自助服务管理\n\n我们将从在不同 Kubernetes 命名空间中部署 Cloud\
  \ Pak for Data 实例的角度来审视这些要求。\n\n### 隔离租户\n\n一个基本要求是，一个租户账户的用户完全不知道另一个租户的存在。即使一个用户属于两个租户账户——例如，一个员工被授予访问两个部门实例的权限——也需要有一种显式机制来从一个租户上下文“切换”到另一个租户上下文——甚至可能需要不同的登录流程。当与不同租户实例关联的\
  \ Kubernetes 微服务在同一集群中运行、网络距离很近且数据可能可访问时，建立边界并强制严格分离就变得非常重要。\n\n让我们看看 Cloud Pak\
  \ for Data 和 OpenShift 在实现隔离方面提供了哪些功能。\n\n#### 配置身份验证\n\nCloud Pak for Data 允许命名空间中的每个租户安装决定如何对该租户组中的用户进行身份验证。例如，一个租户实例可以配置为针对一个\
  \ LDAP 服务器进行身份验证，而另一个实例可以配置为使用另一个。或者，不同的 LDAP（子）组可用于不同的实例。\n\n可能希望为所有（部门）租户实例配置针对同一企业\
  \ SSO 提供商的单点登录（SSO）。然而，即使在这种情况下，也可以控制对各个 Cloud Pak for Data 实例的访问，以便只有在该实例中具有特定角色的用户才能访问。\n\
  \n#### 授权用户访问\n\n在第10章“安全与合规性”中，我们详细讨论了角色和权限，包括如何根据企业需求进行定制。在管理用户访问（甚至非常细粒度的级别）时，角色是基石。根据策略或实践，集群管理员甚至可以选择修改开箱即用的\
  \ Cloud Pak for Data“管理员”角色，也许是为了移除（重新）配置身份验证或管理运行状况的能力，只保留查看监控信息的能力。\n\n除了平台（控制平面）之外，每项服务或功能都需要授权。例如，不同的用户组可以被指定为项目或目录中的编辑者，而其他用户，即使已成功通过身份验证，也可能被拒绝访问该资源。同样，但更细粒度地，个人用户或用户组可以被授予对特定虚拟表或视图的*选择性*访问权限，作为数据虚拟化服务的一部分，而其他用户可能被拒绝访问，这与传统关系数据库完全相同。\n\
  \n#### 确保计算资源的隔离\n\n每个租户在自己的命名空间中拥有所需微服务的*唯一副本*，并且可以独立地*扩展*它们以适应预期的负载或并发需求。命名空间级别的\
  \ ResourceQuotas 确保可以为每个租户*预留*计算资源。企业还可以选择为租户分配专用主机，以进一步保证隔离和计算资源的可用性。\n\n正如我们之前讨论的，OpenShift\
  \ 项目 UID 和 SELinux 可以确保进程（即使是位于*同一*主机上的进程）得到隔离。\n\n#### 外部化路由和入口点\n\n每个租户都有独特的前门和路由。借助\
  \ OpenShift 和外部负载均衡器，甚至可以发布全新的 URL，其中包含适合该租户的主机和域名。每个前门路由还可以与特定于租户的 TLS 证书相关联，表明哪个特定租户“拥有”该\
  \ Cloud Pak for Data 实例。\n\n这提供了一种简单而优雅的方式来隔离客户端到各个租户 Cloud Pak for Data 实例的流量。\n\
  \n#### 通过存储确保隐私\n\n使用 Kubernetes 命名空间还保证了持久卷仅在该命名空间范围内可用。如*第11章“存储”*所述，**持久卷声明（PVC）**仅在一个命名空间内有效，用于将存储卷挂载到\
  \ Cloud Pak for Data 微服务 Pod 上。即使使用了集群范围的共享存储解决方案，使用 PVC 也能保证一个租户的卷不会被另一个租户的微服务访问。\n\
  \n### 保护网络访问安全\n\n在前面的章节中，我们确定了前门和独特路由如何帮助保证从集群*外部*访问各个租户 Cloud Pak for Data 实例时的隔离。Kubernetes\
  \ 包含网络策略的概念，这一概念与防火墙规则非常相似，可进一步加强租户实例免受集群*内部*入侵访问的安全性。\n\n可以编写网络策略，允许同一命名空间内的微服务之间的访问，并默认拒绝来自其他命名空间的访问。作为*全部拒绝*规则的例外，定义了额外的*允许*策略，以允许\
  \ HTTPS 访问每个租户的前门，以及允许操作员命名空间与每个租户命名空间之间的访问。*拒绝*策略阻止租户之间的流量，但各自的前门除外。租户之间的交互（*如果确实*需要）需要通过各自前门中的授权检查来完成，就像外部客户端从集群外部访问一样。\n\
  \n因此，虽然仍然需要允许 Operator 和租户命名空间之间的某些访问，但通过精心设计网络策略，租户可以确保其免受来自 Kubernetes 集群外部或内部的入侵。\n\
  \n### 审计\n\n在这种多租户架构中，软件服务的运营方式始终需要制衡。从监管合规的角度来看，审计是企业用来提供安全和受监控运营保证的有力工具。在*第10章“安全与合规性”*中，我们讨论了集群运营团队可以采用的许多机制，以确保安全性和合规性。\n\
  \n租户通常需要遵守合规性要求，或从安全角度监控其 Cloud Pak for Data 实例的使用情况。此类租户不应访问整个集群的审计或监控记录，而只能访问其实例范围内的记录。\n\
  \nCloud Pak for Data 包含一个实例范围的审计服务，如*第10章“安全与合规性”*所述。如果获得适当授权，每个租户管理员或安全负责人可以仅配置其\
  \ Cloud Pak for Data 实例，将所有相关审计事件转发到**安全信息和事件管理（SIEM）**系统。即使所有租户和集群运营团队使用相同的 SIEM，也可以保持唯一标识每个租户的能力，并且可以发布特定于租户的审计报告。\n\
  \n\n\n\n\n### 自助服务与管理\n\n对于集群运维团队来说，为每个租户用户在日常运营中提供全程指导并不具有成本效益。从合规角度来看，通常也不允许此类集群管理员深度嵌入租户业务中。此外，对于基于云的系统，人们普遍期望租户能够自行满足大多数需求，而无需\
  \ IT 支持。然而，整体集群安全仍是集群运维团队的责任，他们需要能够确保租户无法超出其实例范围。\n\n因此，这需要在保持严格的安全约束和租户每天自行管理其实例所需的灵活性之间取得微妙平衡。在本节中，我们将探讨\
  \ OpenShift 和 Cloud Pak for Data 提供的功能，帮助企业平衡这一需求。\n\n### 部署与升级 – 实现服务和版本的自主选择\n\
  \n不同的租户需要部署不同的 Cloud Pak for Data 服务集合。他们甚至可能出于稳定性考虑，将服务“固定”到特定版本——通常，生产环境会保持在经过充分测试的水平，而开发环境则具有更大的灵活性。\n\
  \n通过审慎使用 Operator 自定义资源，单个租户可以自行决定安装和升级每个服务。对于支持 *服务实例* 概念的服务，例如 Db2，经授权的租户用户甚至可以在无需\
  \ Kubernetes 访问的情况下自行启动数据库实例。\n\n因此，集群管理员可以授予租户管理员在其命名空间中的权限，使其能够自行部署 Cloud Pak\
  \ for Data 服务。反过来，租户管理员可以授权租户用户的一个子集在该 Cloud Pak for Data 实例的范围内自行部署服务实例。\n\n###\
  \ 监控\n\n通过租户实例范围的监控和管理，集群管理员可以将日常监控委托给各个租户管理员。集群管理员仍然保留控制整个命名空间的权利，特别是通过建立资源配额，而租户管理员则在这些边界内运营，以决定如何在其租户范围内监控和限制使用。\n\
  \nCloud Pak for Data 的监控和告警框架可以帮助租户管理员了解其实例内的利用情况，并决定需要为各个用例或服务分配多少计算资源。\n\n###\
  \ 运营与维护租户资源\n\n集群管理员还可以授权租户管理员自行执行所需的二日维护工作。单个服务的补丁或版本升级（与前面描述的安装和部署一样）可以通过自定义资源由租户管理员自行触发，前提是已授予该权限。自定义资源也可以轻松用于扩展该特定\
  \ Cloud Pak for Data 实例中的服务（v4 中的 scaleConfig 字段的工作方式与 v3.5 中 cpd-cli scale 命令类似，只是它由\
  \ Operator 驱动），只需命名空间范围的权限即可。\n\n监控和管理体验为租户管理员提供了一种简单的方式来管理自己的 Cloud Pak for Data\
  \ 实例，包括识别和纠正失败的服务。他们可以访问各个日志并获取 IBM 支持所需的详细诊断，而无需集群管理员介入。\n\n备份（以及在需要时恢复）也是租户的关键关注点。虽然集群管理员确保所有租户的存储和其他基础设施的可靠性，但租户特定数据和元数据的备份也可以委托给租户管理员。\n\
  \n如第 11 章《存储》中所述，cpd-cli backup-restore 实用程序需要范围化的 Kubernetes RBAC，并且该实用程序可以被租户管理员使用。需要注意的是，对于存储快照和其他将存储迁移到远程站点的高级技术，仍可能需要集群运维团队管理的初始设置。重要的是，每个租户的备份映像仍然可以唯一标识，与其他租户的备份隔离并得到保护。\n\
  \n### 评估总结\n\n在前面的章节中，我们讨论了 Cloud Pak for Data 和 OpenShift 如何支持多租户的关键需求。\n\n下表提供了每个需求如何得到满足以及可用于实现该需求的机制的快速总结：\n\
  \n| 租户方面 | 机制 |\n|---|---|\n| **隔离** | *每个 Cloud Pak for Data 实例的独立 Kube 命名空间配额/OpenShift\
  \ 项目* |\n| 1. 用户 – 身份验证、角色和授权 | ✓ 如有需要，可支持 *每个实例不同的 LDAP/AD 或 SAML 配置*（每个实例拥有其独特的身份管理服务）\
  \ |\n| 2. 计算资源 | ✓ 命名空间配额 – 由集群管理员设置。 |\n| 3. 实例访问 | ✓ 每个实例的唯一基于 DNS 的路由。 |\n| 4.\
  \ 存储使用 | ✓ 完全分离的 PVC（在不同命名空间中）使用不同的 PV – 实例之间不共享。 |\n| **安全** | *仅限该命名空间的 RBAC 权限和服务帐户*\
  \ |\n| 1. 限制 Kube 集群级权限 | ✓ 服务帐户和角色绑定 – 范围限定于项目命名空间。 |\n| 2. 网络访问 | ✓ Kube 网络策略用于加固\
  \ *如同在 RHOS 项目命名空间周围的防火墙*。 |\n| 3. 审计 | ✓ *支持按租户的 SIEM 转发。* |\n| **管理** | *范围限定到命名空间的管理权限*\
  \ |\n| 1. 监控/计量 | ✓ 不同实例的不同租户管理员用户。租户独立管理。 |\n| 2. 运维 – 备份/DR、扩展、补丁、升级 | ✓ 运维权限范围限定于该\
  \ OpenShift 项目的命名空间。 |\n| 3. 可服务性 | ✓ 可服务性实用程序仅捕获该实例适当的诊断信息。 |\n| 4. 服务安装 | ✓ 不同实例可以拥有不同集合的服务，在不同版本下独立扩展，不受其他租户影响。\
  \ |\n\n图 12.4 – 支持多租户的机制和技术总结\n\n通过这种多租户实现方法，企业和集群管理员可以决定如何在同一共享的 OpenShift 基础架构上最好地混合和匹配不同的租户。\n\
  \n下图显示了不同租户使用不同版本 Cloud Pak for Data 服务的拓扑结构：\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_313_0.png)\n\
  \n如前图所示，集群运维团队可以选择对生产和开发租户使用同一个 OpenShift 集群。如果合适，可以为特殊租户分配专用的计算节点（成本增加）。每个租户可以部署并固定控制平面本身的特定版本以及不同的\
  \ Cloud Pak for Data 服务，并且可以以不同的规模大小进行配置。\n\n> **关于租户操作数版本选择的说明**\n> \n> 虽然操作数本身可以固定到不同版本，但强烈建议将\
  \ Cloud Pak for Data Operator 集合持续升级到最新发布级别，即使在 *离线* 数据中心也是如此，以确保应用最新的关键缺陷修复并解决任何安全漏洞。Cloud\
  \ Pak for Data Operator 支持在 Operator 本身升级时将操作数固定到特定版本。\n> \n> 在这里，这些 Operator 支持部署和维护操作数的\
  \ *多个版本*，并且可以支持租户选择 *自动* 将操作数升级到最新发布版本，或 *保留*（固定）操作数到指定版本，由管理员决定何时手动升级。\n\n需要注意的是，并非所有企业都可能具有相同的需求或策略。有些可能需要更严格的隔离，例如为每个租户需要专用计算节点。生产租户可能需要位于完全不同的\
  \ OpenShift 集群中，甚至在不同的网络或数据中心。其他租户可能要求宽松——例如，被指定为 *开发* 环境的租户通常不启用审计。\n\n\n\n\n\n\
  在下一节中，我们将查看一个这样的示例，其中租户的粒度不同，允许共享更多，但以安全和隔离要求为代价。\n\n### 具有更宽松隔离的命名空间内子租户\n\n即使同一个\
  \ OpenShift 集群被共享，仍有为每个租户运行多个 Cloud Pak for Data 服务安装所带来的开销和费用。虽然基于命名空间的分离在满足安全、合规和性能\
  \ SLA 保证方面提供了更多保障，但它会带来额外的费用。例如，我们需要在每个租户命名空间中安装 Kubernetes 部署的单独副本，这意味着需要更多监督和维护人员（即使\
  \ Operator 模式使升级、扩展等变得更容易）。单独的副本还会占用额外的计算和存储资源，从而增加最初的采购成本，以及持续的运营费用。\n\n在某些情况下，出于减少支出的考虑，一些企业可能会选择在租户之间共享更多资源，即使这意味着失去灵活性或隔离性降低。在本节中，我们将探讨在多个子租户之间共享同一个\
  \ Cloud Pak for Data 实例意味着什么。\n\n### 方法\n\n这借鉴了分租的想法，其中主要租户决定与子租户共享资源。在此示例中，主要租户按通常方式由集群运营团队分配一个\
  \ Cloud Pak for Data 实例。然后租户管理员决定定义自己的子租户以授予访问权限。\n\n主要租户管理员通常执行以下操作：\n\n- 为每个子租户创建一个\
  \ Cloud Pak for Data 用户组。用户和 LDAP 组可以映射以唯一标识每个子租户用户。\n- 分配适当的平台角色——也许只授予创建项目和目录的权限。\n\
  - 部署数据库等服务实例并授予对各个子租户组的访问权限——甚至将所有权/管理权委托给各个租户用户。\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_319_0.png)\n\
