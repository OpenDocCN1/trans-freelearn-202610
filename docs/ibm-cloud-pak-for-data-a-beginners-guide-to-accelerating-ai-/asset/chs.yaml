  \n40. **使用快照进行备份：** https://www.ibm.com/docs/en/cloud-paks/cp-data/4.0?topic=up-backing-file-system-portworx\n\
  \n### 开发实践\n\nIBM 要求所有产品都采用严格的安全工程实践进行开发和评估，Cloud Pak for Data 提供的服务也不例外。由于此类产品也以服务化方式运营，面向公众开放，因此从软件设计之初，安全性就至关重要。\n\
  \n安全实践和报告在软件发布之前，由 IBM 混合云**业务信息安全办公室（BISO）**独立审查。\n\n本节介绍 Cloud Pak for Data 中用于开发安全加固服务的一些重要实践。\n\
  \n### 漏洞检测\n\n一项关键举措是检测可能的安全弱点或恶意操作者可能利用的潜在区域，以实施中间人攻击、访问敏感数据或注入恶意软件。鉴于与 Cloud Pak\
  \ for Data 的交互相当多是通过 Web 浏览器或一般基于 HTTP 的客户端进行的，因此需要确保同时防范来自外部和集群内部的影响：\n\n- **威胁建模：**\
  \ 这是一个通过构建服务间和服务内的详细数据流图、理解潜在攻击向量，并评估现有保护措施是否足够来分析系统最易受攻击点的过程。威胁建模工作的输出用于推动附加安全结构的开发，或重构服务交互以减轻潜在威胁。\n\
  \n- **安全质量保证和代码审查：** 由一个专注于安全且独立于常规功能开发和 QA 小组的团队开发附加测试。这项工作还涉及跨服务/跨产品集成的验证，以及使用\
  \ **Chaos Monkey（混沌猴）** 风格测试方法（即，在系统中生成随机故障以验证弹性）对整体系统可靠性进行彻底评估。\n\n这样可以更好地客观评估所提议的软件交付是否符合所需的安全准则。作为该举措的一部分，该团队还独立审查代码，并批准服务开发团队提出的任何缓解措施。\n\
  \n因此，预期所有 OpenShift 集群都能从其自有专用网络中的指定*企业级*容器注册表拉取镜像。预期拉取密钥（pull secrets）可用于 Cloud\
  \ Pak for Data 使用的服务账户。\n\n### 堡垒节点的作用\n\n堡垒节点通常是部署在企业专用网络之外、对存储库和注册表具有受控访问权限的机器。此类主机有助于从\
  \ IBM 获取容器镜像、工具、脚本和其他内容，并将其提供给 OpenShift 集群进行配置。\n\n一种方法是将所有镜像下载为 `tar.gz` 文件，并将这些文件传输到专用网络中，在那里可以将它们加载到适当的容器注册表中。然而，更方便的方法是从此类堡垒节点使用容器注册表直接将容器镜像从\
  \ ICR 复制到企业自己的注册表中。之所以可行，是因为堡垒节点在持续时间内可以访问互联网并访问企业自己的数据中心，或者至少可以访问目标注册表。堡垒节点的作用可能不仅限于初始安装，因为这种方法对于拉取或复制较新的容器镜像（包括修补严重漏洞的镜像）非常有用。\n\
  \n在本节中，我们介绍了 IBM Cloud Pak for Data 容器化软件如何从可信位置提供给客户以确保其来源，以及如何将这些镜像引入客户自己的注册表。在下一节中，我们将探讨安全地运营\
  \ Cloud Pak for Data 意味着什么。\n\n### 共享环境中的安全运营\n\n在传统系统中，许多应用程序共享同一个操作系统，无论是虚拟机还是裸机。然而，出于安全原因，这些应用程序通常永远不被授予操作系统的访问权限，也不以\
  \ *root（根用户）* 身份运行。由于来自不同产品或供应商的许多程序会在同一台机器上运行，因此还需要注意将这些操作系统进程彼此隔离。\n\n虽然简单地为每个应用程序启动一个单独的虚拟机来完全隔离它们是很常见的，但这种做法运营成本高昂，并且可能导致计算资源浪费。从长远来看，容器已被证明成本低得多，但在工作负载隔离程度方面需要有所权衡。在本节中，我们将了解该技术栈如何从底层开始实现安全性，从集群中的主机操作系统开始，到\
  \ OpenShift 安全结构，以及 Cloud Pak for Data 如何利用 Kubernetes 访问控制原语对在该集群中运行的所有服务实施控制。\n\
  \n\n\n\n### 安全上下文约束（SCCs）\n\n**安全上下文约束（SCCs）** [10] 的概念允许集群管理员决定与任何特定工作负载关联的特权级别。SCC\
  \ 定义了 Kubernetes Pod 要在平台上被调度必须遵守的一组条件。所授予的权限，尤其是访问主机资源（如文件系统或网络）的权限，甚至 Pod 的进程可以以哪些用户\
  \ ID 或组 ID 运行，都受相关 SCC 的管辖。例如，*privileged* SCC 允许所有特权并访问主机目录，甚至以 root 身份运行，而 *restricted*\
  \ SCC 则拒绝所有这些。\n\n默认情况下，所有 Pod 均使用 *restricted* SCC，而任何高于 *restricted* 的 SCC 均被视为例外，集群管理员需要通过创建该\
  \ SCC 与服务账户的绑定来授权。\n\n使用 *restricted* 时，以 root 身份运行进程被禁用，并且 Linux capabilities 被移除，例如\
  \ *KILL*、*MKNOD*、*SETUID*、*SETGID* 等。此 SCC 还阻止运行特权容器。主机路径、主机网络访问和**进程间通信（IPC）**均被拒绝。当\
  \ Pod 启动时，OpenShift 会强制实施此策略，Pod 内进程任何违反此策略的尝试都会导致 Pod 被关闭并出现相应错误。\n\nCloud Pak\
  \ for Data v3 引入了额外的 SCC，为部分 Pod 授予比 *restricted* 更多的增量能力，而无需使用诸如 *privileged* 或\
  \ *anyuid* 等开放程度高得多的 SCC：\n\n- **cpd-user-scc**：此自定义 SCC 添加了固定的 UID 范围（1000320900\
  \ 至 1000361000），允许所有与此 SCC 关联的 Pod 使用这些用户 ID 运行。这使不同的 Pod 能够确定性地使用已知的用户 ID 运行，并有助于文件所有权的管理。注意：仍然禁止以\
  \ root 身份运行。此策略还消除了为每个 Pod 分配 FSGroup 策略的需要，因为该策略可能对共享卷的文件系统权限设置产生不利影响。\n\nFSGroup\
  \ 策略用于解决 Kubernetes 递归重置已挂载卷上的文件系统权限的问题。虽然这对大型卷会产生严重的性能影响，甚至在 Pod 启动时导致超时和失败，但更严重的问题在于文件权限会被重置，并且可能使比原本预期更多的\
  \ Pod 和用户获得访问权限。\n\nKubernetes 中的一个未来能力（*fsGroupChangePolicy*）有望帮助工作负载避免此问题。[12]\n\
  \n- **cpd-zensys-scc**：此自定义 SCC 与 `cpd-user-scc` 相同，只是它还允许 SETUID/SETGID 特权。它还将一个\
  \ UID（1000321000）指定为 *System* 用户。此 SCC 的主要目的是使系统 Job 和容器能够以正确的文件系统所有权和权限初始化持久卷，从而允许共享卷中的单个内容被其他\
  \ Pod 安全读取或修改。\n\n> **注意**\n> 在 Cloud Pak for Data v4 中，由于 **OpenShift Container\
  \ Platform v3.11** 即将停止支持，且 OpenShift Container Platform v4.6 提供了 Cloud Pak for\
  \ Data 所需的其他安全结构，因此不再创建这些自定义 SCC。但是，DB2 和 Watson Knowledge Catalog 等一些服务在 v4 中仍然需要额外的自定义\
  \ SCC。这些内容在服务文档中有详细描述 [37]。\n\n### 命名空间范围和服务账户特权\n\nCloud Pak for Data 服务部署到特定的\
  \ OpenShift 项目命名空间中，其服务账户的范围仅限于在这些命名空间内运行。这些服务账户与在这些命名空间中运行的各种 Kubernetes Deployment\
  \ 相关联。\n\nOpenShift 为每个 OpenShift 项目分配一个唯一的 SELinux **多类别安全（MCS）** 标签。这可确保来自一个命名空间的\
  \ Pod 无法访问由另一个命名空间中的 Pod 或具有相同 UID 的主机进程创建的文件。[11]\n\n### RBAC 与最小特权原则\n\nKubernetes\
  \ 中角色的概念帮助 Cloud Pak for Data 采用最小特权原则，为每个 Pod 仅授予执行操作所需的授权，不多不少。为此，在部署 Cloud Pak\
  \ for Data 的命名空间中引入了以下角色：\n\n| 角色 | 描述 |\n|---|---|\n| cpd-admin-role | 允许创建/更新/删除\
  \ Kubernetes deployment、secret、configmap，以及运行 Job 等，但仅限于该特定命名空间内。 |\n| cpd-viewer-role\
  \ | 允许 Kubernetes API 调用（GET），但不能执行任何创建或删除操作。 |\n\n图 10.1 – Cloud Pak for Data 服务账户使用的\
  \ Kubernetes 角色\n\n特定服务账户被引入到命名空间中，然后*绑定*到这些角色。这定义了每个账户被授予的特权范围。\n\n> **注意**\n>\
  \ 在 Cloud Pak for Data v4 中，由于不再需要自定义 SCC，因此引入了另一组以 zen- 为前缀的服务账户，以确保任何现有的 SCC 不再被选用，即使是意外情况下也不会。\n\
  \nKubernetes Pod 以服务账户的权限运行。除了只允许在命名空间范围内工作之外，Cloud Pak for Data 服务账户被设计为仅分配执行特定操作所需的最小特权。下表列出了\
  \ Cloud Pak for Data v3.5 和 v4 中使用的关键命名空间范围服务账户，以及它们的用途和允许执行的操作。\n\n| 账户 [v3 和 v3.5]\
  \ | 描述 |\n|---|---|\n| cpd-admin-sa | 绑定到 cpd-admin-role，并与系统用户和 cpd-zensys-scc\
  \ 关联。此账户用于准备持久卷挂载、设置文件权限等。 |\n| cpd-editor-sa | 也绑定到 cpd-admin-role，但与 cpd-user-scc\
  \ 关联，因此特权较少。 |\n| cpd-viewer-sa | 绑定到 cpd-viewer-role 和 cpd-user-scc。此账户只能查看该命名空间内的\
  \ Kubernetes 工件。 |\n| cpd-norbac-sa | 绑定到 cpd-noperm-scc，但未与任何 Kubernetes 角色关联，因此没有\
  \ API 访问权限。此账户类似于开箱即用的默认服务账户。它用于不应被授予任何 RBAC 特权的服务或组件。 |\n| default | 在每个 OpenShift\
  \ 项目中自动创建，绑定到 restricted SCC，且未被授予任何 RBAC 特权；也就是说，没有绑定任何角色。此默认服务账户将用于最终用户工作负载（如\
  \ notebook 和 Python Job），并且不允许在命名空间内执行任何类型的操作。 |\n\n图 10.2 – Cloud Pak for Data\
  \ 中使用的命名空间范围服务账户 – v3 和 v3.5\n\n以下是 Cloud Pak for Data v4 中使用的命名空间范围服务账户：\n\n| 账户\
  \ [v4] | 描述 |\n|---|---|\n| zen-admin-sa | 绑定到 cpd-admin-role，默认情况下与 OpenShift 的\
  \ “restricted” SCC 关联。 |\n| zen-editor-sa | 绑定到 cpd-admin-role，并与 OpenShift 的 “restricted”\
  \ SCC 关联。 |\n| zen-viewer-sa | 绑定到 cpd-viewer-role，并且默认情况下与 OpenShift 的 “restricted”\
