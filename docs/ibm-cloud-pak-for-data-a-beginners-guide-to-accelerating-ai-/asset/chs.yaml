- "# 前言\n\nCloud Pak for Data是IBM的现代数据与AI平台，包含其数据和AI产品组合中的战略性产品，以云原生方式交付，并可灵活部署在任何云上。该平台通过集成的专有、开源和第三方服务组合，提供了一种独特的方法来应对现代挑战。\n\
  \n您将从现代数据管理和AI的关键概念开始，回顾现实世界中的用例，并逐步理解AI阶梯原则。在此基础上，您将探索Cloud Pak for Data如何优雅地实现AI阶梯实践，以收集、组织、分析并注入数据和可信AI到您的整个业务中。随着深入，您还将发现平台和扩展服务的能力，包括它们的打包和定价方式。通过本书中的示例，您将深入了解平台，从丰富的功能和技术架构到其生态系统和关键的上市策略。\n\
  \n在阅读完这本IBM书籍后，您将精通IBM Cloud Pak for Data的概念，并能够应用其规范性实践，利用其功能构建可信的数据基础，并加速企业中的AI采用。\n\
  \n> **注意**\n>\n> 本书内容全面，涵盖了截至2021年10月支持的多版本，包括3.5版和4.0版。书中重点介绍的一些服务、功能和特性可能并不适用于所有版本，随着产品的发展，我们预计还会有一些变化。\n\
  >\n> 然而，主要的讯息、价值主张和底层架构将基本保持一致。鉴于产品的快速进步和演进，我们决定在重点突出核心概念的同时，力求详尽。\n>\n> 我们衷心希望您发现本书对您有帮助，并谅解因产品演进而产生的任何不一致之处。\n\
  \n\n\n\n### 本书读者对象\n\n本书面向有兴趣了解 IBM Cloud Pak for Data 的企业高管、CIO、CDO、数据科学家、数据管理员、数据工程师和开发人员。需要具备技术概念知识，并熟悉不同成熟度级别的数据、分析和\
  \ AI 项目，才能充分利用本书。\n\n### 本书涵盖内容\n\n- *第 1 章，AI 阶梯：IBM 的规范性方法*，探讨市场动态、IBM 的数据和 AI\
  \ 产品组合，并详细介绍 AI 阶梯及其内涵，以及 IBM 产品如何映射到阶梯的不同层级。\n- *第 2 章，Cloud Pak for Data：简要介绍*，详细介绍\
  \ IBM 的现代数据和 AI 平台，以及它的一些关键差异化优势。我们将讨论 Red Hat OpenShift、它所带来的隐含云优势，以及构成 Cloud Pak\
  \ for Data 基础的平台基础服务。\n- *第 3 章，收集：让数据简单且可访问*，提供了一种灵活的方法来应对以数据为中心交付的现代挑战，这些挑战来自数据在数量和种类上的激增，以及专有、开源和第三方服务的混合。\n\
  - *第 4 章，组织：创建可信的分析基础*，让您了解 Cloud Pak for Data 如何启用 Data Ops（数据操作），协调人员、流程和技术，以快速向数据公民、操作、应用程序和**人工智能（AI）**交付可信赖的、业务就绪的数据。\n\
  - *第 5 章，分析：以信任和透明度构建、部署和扩展模型*，解释如何以更智能的方式分析数据，并利用可视化和 AI 模型，使您的组织能够获得新的洞察并做出更好、更明智的决策。\n\
  - *第 6 章，多云策略和 Cloud Satellite*，提供在整个业务中实现 AI 运营化的方法，让您的员工能够专注于更高价值的工作。\n- *第 7\
  \ 章，IBM 与合作伙伴扩展服务*，涵盖支撑 Cloud Pak for Data 的技术概念，包括但不限于架构概述、公共服务、Day-2 操作、基础设施和存储支持，以及其他高级概念。\n\
  - *第 8 章，客户用例*，深入探讨扩展服务的概念、它们的打包和定价方式，以及 Cloud Pak for Data 上可用的各种 IBM 扩展服务，这些服务跨越\
  \ AI 阶梯的**收集、组织、分析和注入**层级。\n- *第 9 章，技术概述、管理和行政管理*，阐述合作伙伴生态系统的重要性、业务合作伙伴的不同层级，以及客户如何从\
  \ Cloud Pak for Data 上的开放生态系统中受益。\n- *第 10 章，安全与合规*，重点关注业务成果的重要性以及 Cloud Pak for\
  \ Data 的关键客户用例模式，同时重点介绍三大用例模式：数据现代化、DataOps 和自动化 AI 生命周期。\n- *第 11 章，存储*，探讨企业采用的两个关键先决条件——安全性和治理——如何在\
  \ Cloud Pak for Data 中得到解决。\n- *第 12 章，多租户*，涵盖 Cloud Pak for Data 支持的不同存储选项，以及如何为高可用性和灾难恢复进行配置。\n\
  \n### 充分利用本书\n\n需要具备技术概念知识，并熟悉不同成熟度级别的数据、分析和 AI 项目，才能充分利用本书。\n\n| 本书涵盖的软件/硬件 | 操作系统要求\
  \ |\n| --- | --- |\n| 访问 Cloud Pak for Data 安装 | Windows、macOS 或 Linux |\n| OpenShift\
  \ 或 Kubernetes 工具（kubectl 和 oc） |  |\n| Linux 操作系统及其安全原语 |  |\n\n**如果您使用的是本书的数字版本，我们建议您自己输入代码。这样做将帮助您避免与复制和粘贴代码相关的任何潜在错误。**\n\
  \n### 下载彩色图片\n\n我们还提供了一个 PDF 文件，其中包含本书中使用的屏幕截图和图表的彩色图片。您可以在此处下载：\n\n```\nhttps://static.packt-cdn.com/downloads/9781800562127_ColorImages.pdf\n\
  ```\n\n### 使用的约定\n\n本书通篇使用了许多文本约定。\n\n**正文中的代码：** 表示正文中的代码词、数据库表名、文件夹名称、文件名、文件扩展名、路径名、虚拟\
  \ URL、用户输入和 Twitter 句柄。例如：“Cloud Pak for Data 控制平面引入了一个名为 `user-home-pvc` 的特殊持久卷声明。”\n\
  \n代码块设置如下：\n\n```text\nkubectl get pvc user-home-pvc\nNAME                 STATUS\
  \    VOLUME                         \nCAPACITY   ACCESS MODES   STORAGECLASS   \
  \  AGE\nuser-home-pvc        Bound     pvc-44e5a492-9921-41e1-bc42-\nb969a9a4dd3dc\
  \         10Gi      RWX            nfs-client        33d\n```\n\n当我们希望您注意代码块的特定部分时，相关的行或项目会以粗体显示：\n\
  \n```text\nPort:          zencoreapi-tls  4444/TCP\nTargetPort:    4444/TCP\nEndpoints:\
  \     **10.254.16.52:4444,10.254.20.23:4444**\n```\n\n**粗体：** 表示新术语、重要的词，或您在屏幕上看到的单词。例如，菜单或对话框中的单词以**粗体**显示。例如：“本质上存在两种类型的主机节点（如截图所示）——**主节点**和**计算**（工作）节点。”\n\
  \n> **提示或重要说明**\n> \n> 显示如下。\n\n### 联系我们\n\n我们始终欢迎读者的反馈。\n\n**一般反馈：** 如果您对本书的任何方面有疑问，请发送电子邮件至\
  \ `customercare@packtpub.com`，并在邮件主题中提及书名。\n"
- "# 第 1 部分：基础知识\n\n在本部分中，我们将了解市场趋势、数据和 AI、IBM 的产品组合、其采用 AI 的规范性方法，以及 Cloud Pak for\
  \ Data 的概述。\n\n本部分包含以下章节：\n\n- *第 1 章，AI 阶梯：IBM 的规范性方法*\n- *第 2 章，Cloud Pak for\
  \ Data——简要介绍*\n\nIBM 拥有强大的数据和 AI 产品组合，在过去 40 年中开发并收购了 100 多种产品，其中包括一些标志性产品，如 Db2、Informix、DataStage、Cognos\
  \ Analytics、SPSS Modeler、Planning Analytics 等。IBM 产品组合的深度和广度使其在市场中脱颖而出。借助 Cloud\
  \ Pak for Data，IBM 正在进一步强化这一差异化优势，在客户展望混合多云未来的同时，进一步简化并现代化其产品组合。\n\n## AI 阶梯简介\n\
  \n我们都知道数据是企业推动更明智决策的基础。数据是推动数字化转型的动力。但正是 AI 释放了数据的价值，这就是为什么 AI 有望改变企业，到 2030 年为全球经济增加近\
  \ 16 万亿美元的潜力。您可以在此处找到相关来源：https://www.pwc.com/gx/en/issues/data-and-analytics/publications/artificial-intelligence-study.html。\n\
  \n然而，AI 的采用速度比预期的要慢。这是因为许多企业没有有意识地努力奠定必要的数据基础，也没有投资于培养对成功至关重要的专业人才和业务流程。例如，绝大多数\
  \ AI 失败是由于数据准备和组织造成的，而不是 AI 模型本身。AI 模型能否成功，取决于您在收集和组织数据方面是否成功。业务领导者不仅需要了解 AI 的力量，还需要了解如何充分释放其潜力，并在混合多云世界中运营。\n\
  \n本部分旨在揭开 AI 的神秘面纱，介绍常见的 AI 挑战和失败，并提供一种统一的、规范性的方法（我们称之为“AI 阶梯”），以帮助组织释放其数据的价值并加速其\
  \ AI 之旅。\n\n随着企业寻求利用 AI 的潜力并确定利用数据获得业务洞察的最佳方式，他们需要确保从明确定义的业务问题开始。此外，您需要使用来自不同来源的数据，支持一流的工具和框架，并在各种环境中运行模型。\n\
  \n根据麻省理工学院斯隆管理评论的一项研究，81% 的业务领导者（http://marketing.mitsmr.com/offers/AI2017/59181-MITSMR-BCG-Report-2017.pdf）不了解\
  \ AI 所需的数据和基础设施，“再多的 AI 算法复杂性也无法克服数据[架构]的缺乏——糟糕的数据只会让人寸步难行。”\n\n简而言之：没有 IA（信息架构），就没有\
  \ AI。\n\n\n\n\nIBM 理解客户正面临这一挑战。为此，IBM 构建了一种规范性方法（即**AI 阶梯**），帮助客户应对上述挑战并加速其 AI 之旅，无论他们目前处于哪个阶段。通过统一数据的收集、组织与分析（无论数据位于何处），该方法能够简化和自动化企业将数据转化为洞察的过程。借助\
  \ AI 阶梯，企业可以构建一种受治理、高效、敏捷且面向未来的 AI 方法。此外，它也是支撑 IBM 数据与 AI 产品组合的组织架构。\n\n重要的是要记住，AI\
  \ 并非魔法，需要深思熟虑且架构良好的方法。阶梯上的每一步对于成功应用 AI 都至关重要。\n\n### AI 阶梯的各级阶梯\n\n下图展示了 IBM 的规范性方法，即\
  \ **AI 阶梯**：\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_22_0.png)\n\n图 1.2 – AI\
  \ 阶梯——AI 之旅的规范性方法\n\nAI 阶梯包含四个步骤（通常称为阶梯的*梯级*），具体如下：\n\n- **1. 收集：让数据简单且可访问。** 收集所有类型的数据，无论其位于何处，以便在不断变化的数据源面前保持灵活性。\n\
  - **2. 组织：创建业务就绪的分析基础。** 将所有客户数据组织成一个可信、业务就绪的基础，并具备内置的治理、质量、保护与合规能力。\n- **3. 分析：以信任和可解释性构建并扩展\
  \ AI。** 以更智能的方式分析客户数据，并借助 AI 模型使客户团队获得新洞察，做出更好、更明智的决策。\n- **4. 注入：将 AI 在整个业务中落地运营。**\
  \ 这应在多个部门和各种流程中开展，利用预测、自动化和优化实现。制定有效的 AI 战略以实现您的 AI 业务目标。应用 AI 来自动化和优化业务中的现有工作流，让员工专注于更高价值的任务。\n\
  \n贯穿 AI 阶梯四个步骤的是 IBM **现代化**（Modernize）理念，它允许客户简化和自动化将数据转化为洞察的方式。该理念在名为 Cloud Pak\
  \ for Data 的多云数据平台中统一了数据的收集、组织和分析。\n\nIBM 的方法始于一个简单的理念：随处运行。这是因为该平台可以部署在客户选择的基础设施上。IBM\
  \ 支持在各大主流云平台上部署 Cloud Pak for Data，包括 Google、Azure、AWS 和 IBM Cloud。您也可以将 Cloud Pak\
  \ for Data 平台部署在本地数据中心，这对于关注混合云战略的客户尤其重要。\n\nIBM 之所以能在所有这些基础设施上支持 Cloud Pak for\
  \ Data，是因为其核心采用了 **Red Hat OpenShift**。这是 IBM 于 2019 年收购 Red Hat 的关键原因之一。其意图是借助全球领先的开源守护者\
  \ Red Hat，为客户提供跨任何基础设施进行扩展的灵活性。OpenShift 是一个基于 Kubernetes 的平台，使 IBM 能够通过现代化的容器模型部署所有产品。本质上，所有能力都被重新架构为微服务，从而可以根据企业需求按需配置。\n\
  \n既然我们已经介绍了 AI 阶梯和 IBM Cloud Pak for Data 平台的概念，现在让我们花些时间关注 AI 阶梯的各个梯级，以及 IBM 使其脱颖而出的能力。\n\
  \n### 收集——让数据简单且可访问\n\n收集层是将数据放入适当的持久化存储中，以便高效地收集和访问所有数据资产。一个架构良好的“收集”梯级能让组织根据用例和用户角色选择合适的数据存储；无论是用于数据科学家探索数据的\
  \ Hadoop、用于通过商业智能或其他企业可视化工具交付运营报告的 OLAP、用于快速应用开发的 MongoDB 等 NoSQL 数据库，还是它们的某种组合，您都可以借助通用\
  \ SQL 引擎以统一、集成的方式灵活实现。\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_25_0.png)\n\n\
  图 1.3 – 收集——让数据简单且可访问\n\n我们全部支持“收集”梯级的能力组合，可分为市场上的四大工作负载领域：\n\n- 1. 首先是**运营数据库**。这是您的记录系统、销售点系统和事务数据库。\n\
  - 2. 随着数据量的爆炸式增长，**分析数据库**需求旺盛。每个人都在寻找新的方法，以快速、大规模地分析数据——从传统报告到为 AI 模型的训练和评分准备数据。\n\
  - 3. **大数据**。使用 Hadoop 构建 PB 级数据湖的历史正逐步转向存储与计算分离，Cloud Object Storage 和 Spark 在其中扮演关键角色。市场对数据湖的需求显然在上升。\n\
  - 4. 最后，**IoT** 正在迅速改变多个行业，快速数据领域正成为一个备受关注的领域。这是未来的市场，IBM 正通过实时数据分析来满足这一领域的需求。\n\
  \n接下来，我们将探讨组织数据的重要性及其内涵。\n\n### 组织——创建可信的分析基础\n\n鉴于数据处于 AI 的核心位置，组织需要关注数据的质量和治理，确保数据准确、一致且可信。然而，许多组织在开发数据管道和数据流时，难以简化其运营模式。\n\
  \n#### 赋能数据公民的人员\n\n现代企业由许多不同的“数据公民”组成——从首席数据官；到数据科学家、分析师、架构师和工程师；再到需要从数据中获取洞察的各个业务线用户。“组织”梯级旨在创建并维持一种数据驱动文化，促进跨组织协作，以推动敏捷性和规模化。\n\
  \n每个组织都有独特的需求，IT、数据科学和业务线的利益相关者需要创造价值以推动业务成功。此外，由于治理是支持 DataOps 的驱动力之一，组织可以利用现有的数据治理委员会和资深数据治理项目的经验，帮助建立这种文化和承诺。\n\
  \nDataOps 的好处意味着，一旦企业实施正确的技术并开发自助式数据能力，将高质量、可信的数据尽快提供给合适的人员和流程，业务就能更高效地运转。下图展示了一个\
  \ DataOps 工作流的可能形态：架构师、工程师和分析师协作处理基础设施和原始数据剖析；分析师、工程师和科学家协作构建分析模型（无论这些模型是否使用 AI）；架构师与业务用户协作，将这些模型投入运营、治理数据，并将洞察传送到需要的地方。\n\
  \n每个角色中的个人都被指定为特定数据子集的**数据管家**。DataOps 方法论中数据公民的意义在于，每个不同角色都可以依赖准确、全面、安全且受治理的数据：\n\
  \n![](img/50e1dac0750b69f2b8e8efff000eb13b_27_0.png)\n\n图 1.4 – 按角色划分的 DataOps 工作流\n\
  \n另外，值得指出的是，构建 AI 模型是容易的部分。真正的挑战在于将这些 AI 模型部署到生产环境，监控其准确性和漂移检测，并确保这成为常态。\n\nIBM\
  \ 在 Cloud Pak for Data 上的 AI 工具和运行时提供了一套差异化且极其强大的能力。在 Red Hat OpenShift 和 Cloud\
  \ Pak for Data 战略的支持下，IBM 有能力设定并引领 AI 工具市场。市场上来自利基供应商的单一 AI 解决方案很多，这一点在众多分析师报告中可见；然而，没有一家能够以令人满意的方式解决将\
  \ AI 投入生产的问题。IBM 带给市场的差异化优势是完整的端到端 AI 生命周期：\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_29_0.png)\n\
  \n图 1.5 – AI 生命周期\n\n客户寻求集成平台有几个原因。在提及这些原因之前，以下团队关注集成平台：\n\n- 1. 数据科学团队正在寻找集成系统，以管理整个\
  \ AI 生命周期和跨项目团队成员的各种资产。\n- 2. 首席数据官希望治理 AI 模型及其相关数据。首席风险官（CRO）希望通过与业务流程集成来控制这些模型带来的风险。\n\
  - 3. 扩展的 AI 应用团队需要集成，以便无缝构建、部署和运行。在某些情况下，首席信息官（CIO）/业务技术团队负责交付平台，他们希望降低 AI 应用投入生产的风险并削减成本。\n\
  \n\n\n\n\n### 客户用例\n\n一家美国财富500强银行正在寻找一种解决方案，以便快速将机器学习项目部署到生产环境。这项工作的第一步是建立一种机制，使项目团队能够在不必经历完整的风险管理流程（来自企业风险/MRM团队）的情况下交付试点项目。他们称之为“软启动”，该机制将使用部分生产数据。项目从概念化到试点完成的时间线为6至9个月。这一需求由业务技术团队（负责AI运营门户）牵头推动（并需要在全银行范围内交付）。其理念是，这将减轻MRM人员的工作负担，因为他们已经应接不暇，但仍能清晰了解风险是如何被评估的以及评估了哪些风险。业务部门将每周使用该解决方案重新训练模型。然而在此之前，他们会上传CSV文件，检查任何实时响应，并推送数据以验证模型是否达到战略目标。所有这些过程都必须自动记录。\n\
  \nIBM AI生命周期的关键差异化优势之一是AutoAI，它允许数据科学家创建多个AI模型并对其准确性进行评分。其中一些测试不应该是非黑即白的。\n\n一些客户已经开始自动化AI开发。因此，出现了以下问题：为什么要自动化模型开发？因为如果你能自动化AI生命周期，就能提高成功率。\n\
  \n自动化AI生命周期可以让你实现以下目标：\n\n- **扩大人才库**：这降低了对构建和运营AI模型所需技能的要求。\n- **加快交付时间**：通过减少繁琐任务来实现。\n\
  - **提高AI驱动应用的就绪度**：通过优化模型准确性和KPI来实现。\n- **提供实时治理**：通过确保模型管理、治理、可解释性和版本控制来提升信任度和透明度。\n\
  \n接下来，我们将探讨AI如何在企业中实现运营化，以解决特定用例并推动业务价值。\n\n### 融入——在整个业务中实现AI运营化\n\n构建洞察和AI模型是很好的第一步，但除非你将它们融入业务流程并优化结果，否则AI只是另一种花哨的技术。那些基于数据驱动洞察实现业务流程自动化的公司，已经颠覆了那些尚未这样做的公司——零售领域的亚马逊就是典型例子，它通过利用数据、分析和AI来简化运营并获得竞争优势，颠覆了许多传统零售商。关键之处在于将技术与文化相结合，并确保员工拥抱AI并将其融入日常决策：\n\
  \n![](img/50e1dac0750b69f2b8e8efff000eb13b_31_0.png)\n\n图1.6——融入——AI正在改变企业的运营方式\n\
  \n以下是一些公司将AI融入其业务流程的多样化示例。这些示例按五大关键主题进行组织：\n\n- 客户服务（业务负责人：CCO）：客户关怀自动化、客户360、客户数据平台。\n\
  - 风险与合规（业务负责人：CRO）：治理风险与合规。\n- IT运营（业务负责人：CIO）：自动化并优化IT运营。\n- 财务运营（业务负责人：CFO）：多维度的预算编制与优化。\n\
  - 业务运营（业务负责人：COO）：供应链、人力资源管理。\n\n#### 客户服务\n\n随着聊天机器人驱动的自动化和客户360度视图变得越来越重要，客户服务每天都在发生变化。虽然IBM在多个方面都有持续的投资，但最为突出的是IBM的*Watson\
  \ Anywhere*计划，该计划允许客户以折扣价购买Cloud Pak for Data的Watson服务（Assistant、Discovery和API Kit），并完成部署。\n\
  \n> **客户用例**\n> \n> 一家提供移动、电信和CRM解决方案的科技公司正面临着对智能呼叫中心的巨大需求，并投资于IBM Cloud Pak for\
  \ Data上的AI语音助手。其目标是自动处理客户的查询，减少对人工客服的需求。只有在需要详细咨询时才会发生人工交互。这将呼叫中心员工解放出来，使他们能够专注于更复杂的查询，而不是处理重复性任务，从而提高了整体运营效率和客户服务质量，更不用说降低了间接成本。这使得构建智能呼叫中心变得更简单、更快速，且运营成本更低。在其他技术中，该解决方案使用了Watson\
  \ Speech to Text，它将语音转换为文本，帮助理解问题的上下文。这使得AI语音助手能够在客户咨询的上下文中快速提供最佳答案。\n\n#### 风险与合规\n\
  \n风险与合规是一个宽泛的话题，各公司都在努力确保其流程的合规性。除了治理风险与合规之外，你还需要关注大型银行面临的财务风险。IBM提供了一系列开箱即用的解决方案，如OpenPages、Watson\
  \ Financial Crimes Insight等，这些解决方案与AI治理相结合，不仅能应对监管挑战，还能加速AI采用，从而带来显著价值。\n\n####\
  \ IT运营\n\n随着IT基础设施持续呈指数级增长，没有理由相信它会在短期内减少。相反，IT基础设施运营的复杂性并非一项简单任务，需要使用AI来自动化运营并主动识别潜在风险。挖掘数据以预测和优化运营是AI的关键用例之一。IBM在Cloud\
  \ Pak for Data平台上有一个名为**Watson AIOps**的解决方案，该方案专门针对这一特定用例而构建。\n\n#### 财务运营\n\n预算编制和预测通常涉及多个利益相关者跨企业协作，以得出一个稳定的答案。然而，这不仅仅是空谈。IBM在Cloud\
  \ Pak for Data上的Planning Analytics解决方案是一个规划、预算、预测和分析解决方案，可帮助企业自动化基于手动电子表格的流程，并将财务计划与运营策略联系起来。\n\
  \nIBM Planning使用户能够直接从数据中自动发现洞察，并借助IBM Watson的预测能力推动决策。它还集成了计分卡和仪表板来监控KPI，并通过各种可视化方式传达业务结果。\n\
  \n#### 业务运营\n\n业务运营涉及多个领域，包括供应链管理、库存优化、人力资源管理、资产管理等。使用Cloud Pak for Data平台开发的洞察和AI模型可以轻松应用于各自的领域。有几个客户使用IBM解决方案的示例。\n\
  \n> **客户用例**\n> \n> *一家知名的北美医疗保健公司试图解决一个独特的挑战。他们使用AI来主动识别并优先处理高风险脓毒症患者。这需要一个集成平台，能够跨不同数据孤岛管理数据，以大规模构建、部署和管理AI模型，同时确保信任和治理。借助Cloud\
  \ Pak for Data，该公司在6周内构建了一个解决方案，而这通常需要花费12个月的时间。这带来了预计每位患者约4.8万美元的成本节省，这是一个显著的价值。*\n\
  \n数字转型正在颠覆我们的全球经济，并将给我们的生活、学习、工作和娱乐方式带来巨大变化；在许多情况下，这将加速我们在各行业看到的趋势。这也适用于未来的数据、分析和AI工作负载管理方式。那些主动抓住机遇，精简、整合并改造其架构的企业，将在应对短期干扰和面向不断演变且敏捷的未来进行现代化改造方面走在前列。IBM对AI阶梯的规范化方法植根于一个简单而有力的信念：强大的信息架构是成功采用AI的关键。它为企业提供了规模化采用AI的组织结构。\n\
  \n\n\n\n\n### 数据与 AI 平台的案例\n\n在上一节中，我们介绍了 IBM 将 AI 运营化到企业的规范化方法，从简化数据访问开始，并将数据组织成用于高级分析和\
  \ AI 的可信基础。现在，让我们看看如何将其变为现实。\n\n从实施角度来看，行业中存在许多现成且成熟的产品，有些来自 IBM 或其合作伙伴，有些来自竞争对手。然而，让所有这些现有产品无缝协同工作存在显著的额外开销。当涉及到混合云情况时，情况也会变得困难。并非每个企业都拥有将不同的系统集成以使终端用户能够协作并快速交付价值所需的\
  \ IT 专业知识。可靠地、安全地运营此类不同的系统也会拉伸 IT 预算，并引入如此多的复杂性，以至于分散了企业及时且以成本效益的方式实现其业务目标的注意力。\n\
  \n因此，需要一个数据与 AI 平台，提供标准化的技术栈并确保运营的简易性。下面的图表显示了企业通常需要什么来使能 AI 并从其数据中获得全部价值。它还显示了典型企业中的不同角色，具有不同的角色、职责和技能水平，所有这些都需要紧密协作以实现可信\
  \ AI 的承诺：\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_34_0.png)\n\n图 1.7 – 孤岛阻碍了企业中\
  \ AI 的运营化\n\n大多数企业的数据会分散在多个数据源中，部分在本地，部分在公有云中，通常格式各不相同。企业将如何以安全的方式使其所有有价值的数据可供其数据科学家和分析师使用？如果数据科学工具和框架无法就地、规模化地使用数据，它们甚至可能需要构建额外的昂贵数据集成和转换管道，以及将数据存储在新的数据仓库或数据湖中。如果管理员无法轻松地在所有使用中的数据上定义数据访问策略，确保敏感数据被屏蔽或混淆，从安全和合规的角度来看，将数据用于高级分析和\
  \ AI 将变得不安全（甚至非法）。\n\n下面的图表进一步扩展了不同系统需要集成的需求，以及用户需要密切协作。它从领导者设定使用 AI 技术解决的业务问题的期望开始。请注意，这些系统和任务涵盖了企业的开发和运营生产方面：\n\
  \n![](img/50e1dac0750b69f2b8e8efff000eb13b_35_0.png)\n\n图 1.8 – 典型的跨系统任务和跨角色交互\n\
  \n该流程也是循环的，因为系统需要考虑反馈并有明确的方式衡量实施是否达到了所述目标。如果数据消费者无法了解数据的质量或无法确保数据不是过时的，任何基于此类数据构建的\
  \ AI 始终会受到怀疑，因此会带来更大的风险。从根本上说，缺乏将所有这些系统联系在一起的基础设施会使实施 AI 阶梯实践变得复杂，或者在某些情况下变得不可能。所需的是一个可靠、可扩展且现代的\
  \ **数据与 AI 平台**，它可以打破这些孤岛、轻松集成系统，并使不同用户角色之间能够协作，甚至通过单一的集成体验。\n\n### 总结\n\n在本章中，你了解了市场动态和\
  \ IBM 的数据与 AI 产品组合，了解了 IBM 的 AI 规范化方法，即 *AI 阶梯* 的概述，并了解了 IBM 方案如何映射到阶梯的不同层级。在下一章中，我们将全面介绍\
  \ Cloud Pak for Data，IBM 的数据与 AI 平台，使企业能够以模块化方式在任何地方实施 *AI 阶梯*，同时利用现代云原生框架。\n\n\
  ### 数据与 AI 平台的案例 – 回顾\n\n在上一章中，我们介绍了 IBM 将数据与 AI 运营化到企业的规范化方法，随后向你介绍了 Cloud Pak\
  \ for Data 的广泛功能。在本节中，我们将概述 Cloud Pak for Data 如何推动 AI 阶梯实践在你企业中的实施。\n\nCloud Pak\
  \ for Data 作为一个开放平台，打破了不同产品之间的孤岛，使其能够作为云原生服务在同一 OpenShift Kubernetes 平台之上实现。Cloud\
  \ Pak for Data 使此类服务能够通过通用控制平面轻松集成，并且重要的是，为终端用户提供个性化、集成的用户体验，以便他们自然协作，而甚至意识不到产品或服务边界。\n\
  \n在这一平台上，诸如数据虚拟化等功能有助于为混合云现代化数据访问，并且数据可以轻松地在云之间就地访问。数据目录和治理服务可以依托数据虚拟化和其他数据源，提供更广泛的受管数据访问平面解决方案，这反过来又促进了向数据科学、分析报告和机器学习服务提供的数据的信任。在同一平台上，运营团队可以大规模部署\
  \ ML 模型，实现带偏见检测的模型监控，以支持持续的模型演进。\n\n开发、实验和生产部署可以在同一平台上得到支持，促进具有不同角色和职责的用户团队之间的协作。身份验证和授权在控制平面中定制以符合企业法规，使跨所有服务的无缝访问成为可能。一致的\
  \ API 和用户组、API 密钥和令牌等概念使以标准方式开发自定义应用程序和解决方案成为可能。\n\n管理和运营通过由 Red Hat OpenShift Kubernetes\
  \ 驱动的操作符得到简化。部署在本地和公有云基础设施之间的可移植性得到保证，使其在需要时能够爆发到云中。云原生实践使企业应用程序和解决方案的持续交付和集成成为可能。安全控制和运营审计内置于平台中，以确保企业遵守合规要求。在同一组共享计算资源上部署和管理多个租户，也使\
  \ Cloud Pak for Data 对企业来说更具成本效益。\n"
- "## Cloud Pak for Data 概述\n\n在第 1 章《AI 阶梯：IBM 的规范化方法》中，你被介绍到 IBM 的 AI 采用规范化方法论，即\
  \ AI 阶梯，以及企业如何通过 IBM 的现代多云数据与 AI 平台 Cloud Pak for Data 采用这一框架。管理数据、分析和 AI 服务的集成平台的概念并不新鲜——一直以来都存在对跨\
  \ AI 阶梯不同层级的端到端方案的需求。企业通过定制集成来满足这一需求，通常会利用全球咨询组织提供资源和专业知识。\n\n随着公有云和面向服务的架构的出现，采购预集成软件平台现在已变得司空见惯。这些平台在仍提供满足特定业务需求的灵活性的同时，最大限度地减少了集成工作。\n\
  \nCloud Pak for Data 于 2018 年 5 月 29 日推出，利用 Kubernetes 技术，这使得平台能够部署在任何公有云和/或企业数据中心的私有云上。这使客户能够利用云原生优势，例如轻松配置、扩展、简化管理和无缝升级，同时坚持其选择的<|message|>\
  \ 基础设施：私有云或任何公有云，如 AWS、Azure 或 IBM Cloud。还值得强调的是，支撑该平台的数据与 AI 服务已在过去几十年中被数千家企业客户检验和测试。因此，虽然集成平台是新颖且现代的，但其背后的能力和功能已在规模上得到验证。这对于企业客户至关重要，因为他们在寻求现代化其数据与\
  \ AI 工作负载时，无法承担冒险投资的风险。下面的图表说明了自推出以来 Cloud Pak for Data 的各个版本：\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_39_0.png)\n\
  \n图 2.1 – IBM Cloud Pak for Data 之旅：自推出以来 8 个版本\n\n\n\n\n现在，让我们探讨 Cloud Pak for\
  \ Data 的关键差异化优势，以及企业使用它的典型用例模式。\n\n### 探索独特的差异化优势、关键用例与客户采纳情况\n\nCloud Pak for Data\
  \ 为客户提供了一个单一平台，拥有丰富的模块化数据与 AI 服务生态，带来简洁性、对变化的快速适应能力，并减少对专业化和稀缺技能的依赖。与我们看到的大多数客户/企业所使用的数据库、数据运维、数据科学、数据分析和可视化等众多孤立工具的组合不同，Cloud\
  \ Pak for Data 是所有数据与 AI 服务的一个统一运营架构。其结果是令人愉悦的统一体验、通过自动化手动繁琐任务而实现的成本降低，以及强化的数据治理和安全性。\n\
  \nCloud Pak for Data 是一种以混合云数据与 AI 平台解决复杂业务问题的新方式，可在任何地方运行。\n\n以下是该平台的独特差异化优势：\n\
  \n- **统一体验：** 端到端集成平台提升了生产力，同时支持不同角色和职能部门之间的协作。\n\n- **自动化：** 利用 AI 自动化许多任务，例如构建模型（AutoAI）、发现和编目数据集（数据发现）等。\n\
  \n- **治理与安全性：** 这一点贯穿整个平台，是一个重要的差异化优势。数据治理确保客户满足合规要求并实现自助式分析，而 AI 治理则注入信任，推动企业内部\
  \ AI 项目的采用，同时满足监管合规的需求。\n\n- **随处部署：** Cloud Pak for Data 可运行在任何公有云或私有云上，并连接各处数据。这为企业提供了灵活性和基础设施选择，避免供应商锁定（*如果将来需要，可独立地将工作负载迁移到其他云提供商*）。\n\
  \n现在，让我们探讨 Cloud Pak for Data 的几个关键用例。\n\n#### 关键用例\n\n以下是 Cloud Pak for Data 的一些关键用例：\n\
