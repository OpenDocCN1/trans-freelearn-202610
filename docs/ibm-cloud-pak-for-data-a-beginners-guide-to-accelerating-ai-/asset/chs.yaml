  \n接下来，我们将介绍另一个与语音启用聊天机器人相关的客户用例。\n\n### Voice-enabled chatbots\n\n客户挑战包括一家公共石油和天然气公司，该公司在查找信息技术（IT）和工程部门提供的服务的一致且完整的信息方面遇到困难。现有的系统是一个缺乏治理和采用的基于文本的交易式聊天机器人，其响应质量不佳。\n\
  \n借助 Cloud Pak for Data，他们能够将基于文本的交易式聊天机器人重构为语音启用、头像风格的界面，以改善用户体验，更重要的是改善对用户查询的响应。这与结构化分析相结合，有助于大幅提高客户满意度。他们使用\
  \ Watson Studio 服务中的 SPSS modeler 和 Jupyter notebooks 进行结构化分析，使用 Watson Discovery\
  \ 进行文本搜索，使用 Watson API 服务进行语音转录，以及使用 Watson Assistant 实现头像风格的聊天机器人体验。\n\n以下图表表示\
