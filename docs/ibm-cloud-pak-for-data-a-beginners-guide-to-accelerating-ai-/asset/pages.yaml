- pgno: 107
  md: '# 5

    Analyzing: Building, Deploying, and Scaling Models with Trust and Transparency


    There is a lot of data collected across an enterprise, and this presents a unique
    opportunity to harvest insights that can be used to improve efficiency and serve
    our customers better. **IBM Cloud Pak for Data** has an extensive collection of
    services from **International Business Machines Corporation (IBM)**, as well as
    third-party services that help with the various aspects of analyzing data.


    The platform caters to different personas including business analysts, data engineers,
    data scientists, data stewards, and so on, enabling cross-persona collaboration.
    All of these personas are interested in different aspects of data and they have
    varied skillsets when it comes to analyzing the data, starting from something
    as simple as the need to execute canned reports on a regular basis to ad hoc reporting
    and dashboarding and more advanced analytics such as statistical analysis, **machine
    learning (ML)**, or **artificial intelligence (AI)**.'
  merge: -1
