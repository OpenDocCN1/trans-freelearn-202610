- pgno: 30
  md: '# Customer Use Case


    A Fortune 500 US bank is looking for a solution in order to rapidly deploy machine
    learning projects to production. The first step in this effort is to put in place
    a mechanism that allows project teams to deliver pilots without having to go through
    full risk management processes (from corporate risk/MRM teams). They call this
    a soft launch, which will work with some production data. The timeline to roll
    out projects is 6-9 months from conceptualization to pilot completion. This requirement
    is being championed (and will need to be delivered across the bank) by the business
    technology team (who are responsible for the AI operations portal). The idea is
    that this will take the load away from MRM folks who have too much on their plate
    but still have a clear view of how and what risk was evaluated. LOB will be using
    the solution every week to retrain models. However, before that, they will upload
    a CSV file, check any real-time responses, and pump data to verify that the model
    is meeting strategy goals. All this must be auto-documented.


    One of the key differentiators for IBM''s AI life cycle is AutoAI, which allows
    data scientists to create multiple AI models and score them for accuracy. Some
    of these tests are not supposed to be black and white.


    Several customers are beginning to automate AI development. Due to this, the following
    question arises: why automate model development? Because if you can automate the
    AI life cycle, you can enhance your success rate.


    An automated AI life cycle allows you to do the following:


    +   - **Expand your talent pool**: This lowers the skills required to build and
    operationalize AI models

    +   - **Speed up time to delivery**: This is done by minimizing mundane tasks.

    +   - **Increase the readiness of AI-powered apps**: This is done by optimizing
    model accuracy and KPIs.

    +   - **Deliver real-time governance**: This improves trust and transparency by
    ensuring model management, governance, explainability, and versioning.


    Next, we will explore how AI is operationalized in enterprises to address specific
    use cases and drive business value.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# Infuse – operationalizing AI throughout the business


    Building insights and AI models is a great first step, but unless you infuse them
    into your business processes and optimize outcomes, AI is just another fancy technology.
    Companies who have automated their business processes based on data-driven insights
    have disrupted the ones who haven’t – case in point being Amazon in retail, who
    has upended many traditional retailers by leveraging data, analytics, and AI to
    streamline operations and gain a leg up on the competition. The key here is to
    marry technology with culture and ensure that employees are embracing AI and infusing
    it into their daily decision making:


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_31_0.png)


    Figure 1.6 – Infuse – AI is transforming how businesses operate


    The following are some diverse examples of companies infusing AI into their business
    processes. These are organized along five key themes:


    +   - Customer service (business owner: CCO): Customer care automation, Customer
    360, customer data platform.

    +   - Risk and compliance (business owner: CRO): Governance risk and compliance.

    +   - IT operations (business owner: CIO): Automate and optimize IT operations.

    +   - Financial operations (business owner: CFO): Budget and optimize across multiple
    dimensions.

    +   - Business operations (business owner: COO): Supply chain, human resources
    management.'
  merge: -1
