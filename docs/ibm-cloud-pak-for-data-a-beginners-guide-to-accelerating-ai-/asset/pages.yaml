- pgno: 25
  md: "![](img/50e1dac0750b69f2b8e8efff000eb13b_25_0.png)\n\nFigure 1.3 – Collect\
    \ – making data simple and accessible\n\nOur portfolio of capabilities, all of\
    \ which support the Collect rung, can be categorized into four workload domains\
    \ in the market:\n\n+   1. First, there's the **operational database**. This is\
    \ your system of records, your point of sales, and your transactional database.\n\
    +   \n+   2. **Analytics databases** are in high demand as the amount of data\
    \ is exploding. Everyone is looking for new ways to analyze data at scale quickly,\
    \ all the way from traditional reporting to preparing data for training and scoring\
    \ AI models.\n+   \n+   3. **Big data.** The history of having a data lake using\
    \ Hadoop at petabyte scale is now slowly transforming into the separation of storage\
    \ and compute, with Cloud Object Storage and Spark playing key roles. The market\
    \ demand for data lakes is clearly on an upward trajectory.\n+   \n+   4. Finally,\
    \ **IoT** is quickly transforming several industries, and the fast data area is\
    \ becoming an area of interest. This is the market of the future, and IBM is addressing\
    \ requirements in this space through real-time data analysis.\n\nNext, we will\
    \ explore the importance of organizing data and what it entails.\n\n# Organize\
    \ – creating a trusted analytics foundation\n\nGiven that data sits at the heart\
    \ of AI, organizations will need to focus on the quality and governance of their\
    \ data, ensuring it's accurate, consistent, and trusted. However, many organizations\
    \ struggle to streamline their operating model when it comes to developing data\
    \ pipelines and flows."
  merge: -1
  img_proc: true
