  md: 'In this chapter, we''re going to cover the following main topics:


    +   - Introducing **Data Operations (DataOps)**

    +   - Organizing enterprise information assets

    +   - Establishing metadata and stewardship

    +   - Profiling to get a better understanding of your data

    +   - Classifying data for completeness

    +   - Enabling trust with data quality

    +   - Data privacy and activity monitoring

    +   - Data integration at scale

    +   - IBM Master Data Management

    +   - Extending Master Data Management toward a digital twin


    # Introducing Data Operations (DataOps)


    Data is the fuel for innovation and sustaining a competitive advantage. It is
    the key ingredient for driving analytics and understanding business trends and
    opportunities. Unlocking this value in new ways can accelerate an organization''s
    journey to AI.


    **DataOps** is focused on enabling collaboration across an organization to drive
    agility, speed, and new data initiatives at scale. By using the power of automation,
    DataOps is designed to solve challenges associated with inefficiencies in accessing,
    preparing, integrating, and making data available.


    At the core of DataOps is an organization''s information architecture, which addresses
    the following questions:


    +   - Do you know your data? Do you trust your data?

    +   - Are you able to quickly detect errors?

    +   - Can you make changes incrementally without "breaking" your entire data pipeline?'
