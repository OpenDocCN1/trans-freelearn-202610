- pgno: 293
  md: '# 12


    # Multi-Tenancy


    Multi-tenancy is a software architecture design where multiple users or organizations
    share the same instance of the software and its underlying resources. This is
    a standard practice with **Software-as-a-Service (SaaS)** offerings, such as Cloud
    Pak for Data as a service in the IBM Cloud, but the interpretation of tenancy
    and how this tenancy is implemented can vary widely on-premises or in private
    clouds. **Security** and **compliance** requirements in the enterprise, as well
    as the *quality of service assurances*, play a significant role in deciding how
    much can be shared.


    Nowadays, it is a fundamental expectation that any true cloud-native platform
    stack enables at least some level of multi-tenant sharing out of the box. Supporting
    a new project or initiative can be accelerated just by reusing the existing shared
    infrastructure. Trivially, you could assume assigning independent **virtual machines
    (VMs)** to each tenant would be sufficient to achieve multi-tenancy – after all,
    the underlying bare metal resources are indeed being shared. But it is not cost-effective
    to provide dedicated clusters of VMs to every department in an enterprise; the
    operational maturity needed to manage multiple clusters or installations of software
    alone would become prohibitively expensive.


    Most enterprises, whether they operate in a hosted public cloud infrastructure
    or on-premises, prefer some level of sharing between tenants with assurances of
    consistent performance, security, and **privacy**. It is no longer considered
    adequate just to assign VMs to tenants and, with the advent of containerization
    techniques, more granularity is now possible with multiple tenants even sharing
    the same VM. This also makes security problems more complex since even the operating
    system gets shared, with processes from different tenants running side by side.'
  merge: -1
  img_proc: true
- pgno: 294
  md: 'IBM uses sophisticated multi-tenancy techniques in its cloud for the Cloud
    Pak for Data SaaS offering, and the architectural underpinnings of the Cloud Pak
    for Data software stack can also enable enterprises to support multiple tenants
    on the same OpenShift Kubernetes cluster. Chapter 9, Technical Overview, Management,
    and Administration, introduced how multi-tenancy can be achieved with the judicious
    use of Kubernetes namespaces, where a single OpenShift cluster is shared between
    multiple tenants. There needs to be careful deliberation with regards to how to
    implement multi-tenancy in a secure and reliable fashion while being mindful of
    your enterprise''s requirements, policies, and the service guarantees expected
    by tenants.


    In this chapter, we''re going to be covering the following topics:


    +   - Tenancy considerations

    +   - Architecting for multi-tenancy

    +   - A review of the tenancy requirements

    +   - In-namespace sub-tenancy with looser isolation


    # Tenancy considerations


    We will start by looking closely at what multi-tenancy implies, why tenancy is
    important, and, in general, what architectural choices, trade-offs, and compromises
    regarding expenses need to be made when planning for such shared deployments.


    # Designating tenants


    Each enterprise usually has a very different interpretation when it comes to identifying
    their tenants, but by and large, a tenant is defined as a select group of users
    granted specific privileges to access a shared software installation. When tenants
    represent different companies altogether, users belonging to one tenant are generally
    unaware of the existence of other tenant users. However, even such isolation can
    be relaxed when it comes to users within the same enterprise, and employees in
    the same company may be members of multiple tenant "accounts."'
  merge: -1
  img_proc: true
