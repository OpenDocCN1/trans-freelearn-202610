- pgno: 281
  md: '![](img/50e1dac0750b69f2b8e8efff000eb13b_281_0.png)


    This organization can still be considered hyperconverged in the sense that the
    Kubernetes cluster supports both storage and compute. The private low latency
    network between the Nodes in the Kubernetes cluster would still be able to support
    access to storage from Pods in a performant manner.


    This variation would not be able to support the possibility of a “local” mount
    optimization taking advantage of the physical co-location of storage blocks and
    compute, but it has the advantage of simplifying node operations and maintenance.
    This separation can help ensure the storage services are not impacted by a sudden
    surge (of noisy neighbor syndrome) from other Kubernetes workloads and vice versa.'
