- pgno: 216
  md: 'As coarsely outlined in the preceding figure, all the Cloud Pak for Data services
    are deployed on top of the control plane, and they leverage the control plane
    APIs as well as get accessed via the same front door. These higher-order services
    themselves are managed by their own operators, include their own microservices,
    repositories, and user experiences over and above what the control plane itself
    hosts. These service experiences dynamically extend the Cloud Pak for Data experience
    in a plug-n-play fashion to present a single pane of glass for end users.


    The control plane provides the following capabilities for consumers of the Cloud
    Pak for Data platform:


    +   - **Authorization:** Cloud Pak for Data provides an access control capability
    (the *usermgmt* microservice) that enables an authorized user (an administrator)
    to grant access to other users. User groups, which can also be mapped to LDAP
    groups, can be defined to support collaboration. Users and groups can be granted
    role-based authorization to work with specific services or projects. The chapter
    on security describes user access management in greater detail.

    +   - **A persona-based experience:** Cloud Pak for Data provides a browser-based
    integrated end user experience that is personalized appropriately for the user''s
    role. Navigation and their home page content are automatically scoped to the access
    rights that have been granted. Users can choose to customize their experience
    as well, say with the home page content. This is delivered primarily by the "zen-core"
    micro-service.

    +   - **A service catalog:** The service catalog encourages a self-service option
    for authorized users to *provision* instances of services in the Cloud Pak for
    Data platform without needing to have any sophisticated knowledge about the underlying
    Kubernetes infrastructure. For example, a user could choose to provision a Db2
    database and grant access to others to work with that database instance. Cloud
    Pak for Data also includes mechanisms for users to generate API keys for service
    instances to programmatically interact from client applications. The catalog is
    powered by the `zen-core-api` microservice and the experience is hosted by the
    `zen-core` microservice. `zen-core-api` also provides the mechanism to manage
    access to each provisioned service instance, while supporting the ability to upgrade
    these instances as needed.'
  merge: -1
  img_proc: true
