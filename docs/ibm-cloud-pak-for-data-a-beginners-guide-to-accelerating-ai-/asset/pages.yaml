- pgno: 57
  md: '# 3

    Collect – Making Data Simple and Accessible


    Enterprises are struggling with the proliferation of data in terms of both volume
    and variety. Data modernization addresses this key challenge and involves establishing
    a strong foundation of data by making it simple and accessible, regardless of
    where that data resides. Since data that''s used in AI is often very dynamic and
    fluid with ever-expanding sources, virtualizing how data is collected is critical
    for clients. Cloud Pak for Data offers a flexible approach to address these modern
    challenges with a mix of proprietary, open source, and third-party services.


    In this chapter, we will look at the importance of data and the challenges that
    occur with data-centric delivery. We will also look at what data virtualization
    is and how it can be used to simplify data access. Toward the end of this chapter,
    we will be looking at how Cloud Pak for Data enables data estate modernization.'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'In this chapter, we''re going to cover the following main topics:


    +   - Data – the world''s most valuable asset

    +   - Challenges with data-centric delivery

    +   - Enterprise data architecture

    +   - Data virtualization – accessing data anywhere

    +   - Data estate modernization using Cloud Pak for Data


    # Data – the world''s most valuable asset


    The fact is, *every company in the world is a data company.* As the Economist
    magazine rightly pointed out in 2017, data (not oil) is the world''s most valuable
    resource and unless you are leveraging your data as a strategic differentiator,
    you are likely missing out.


    If you look at successful companies over time, all of them had sustainable competitive
    advantages – either economies of scale (Apple, Intel, AWS) or network effects
    (Facebook, Twitter, Uber, and so on). **Data** is the new basis for having a sustainable
    competitive advantage. Over 90% of the world''s data cannot be googled, which
    means most of the world''s valuable data is private to the organizations that
    own it. So, what can you do to unleash the potential that''s inherent to your
    proprietary data?


    As we discussed in *Chapter 1, Data Is the Fuel that Powers AI-Led Digital Transformation,*
    CEOs and business leaders know they need to harness digital transformation to
    jumpstart growth, speed up time to market, and foster innovation. In order to
    accelerate that transformation, they need to integrate processes across organizational
    boundaries by leveraging enterprise data as a strategic differentiator. It''s
    critical to remember that your data is only accessible to you.


    # Data-centric enterprises


    Let''s look at a few examples of enterprises leveraging data as a strategic differentiator:


    +   1. Best Buy successfully transformed its business by embracing digital marketing,
    along with personalized assistance and recommendations based on customer data.
    This digital transformation took multiple years, but ultimately, it helped the
    company survive and thrive as opposed to its competitor, Circuit City, which filed
    for bankruptcy and liquidated all its stores.'
  merge: -1
  img_proc: true
