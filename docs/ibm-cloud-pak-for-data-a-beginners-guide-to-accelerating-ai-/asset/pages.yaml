- pgno: 304
  md: 'Authentication and auditing for each tenant can be configured independently.
    The signing key that''s used for generating bearer tokens is unique to each tenant.
    Hence, using an authentication token from one tenant''s instance would not work
    if you wish to gain access to another. Authorization, in the form of *roles and
    permissions*, can help tenant admins grant authorization to that tenant''s users
    in a granular fashion. Objects and capabilities inside this tenant''s installation
    of Cloud Pak for Data would only be available to authorized users.


    OpenShift also automatically generates a unique *UID* range for each project.
    Hence, the Linux processes within one Cloud Pak for Data tenant namespace run
    with a UID that is different from processes from another namespace. This, coupled
    with **RHEL''s SELinux** capability, ensures that even when pods from two tenants
    are scheduled in the same Linux host, these processes are prevented from interacting
    with one another. Thus, a malicious process that may have infected one tenant''s
    Pod, or user errors that may have accidentally been introduced, would not be able
    to impact the Pod processes from another tenant. Note that some Cloud Pak for
    Data v4 services rely on a fixed UID via the use of a custom SCC (as described
    in *Chapter 10, Security and Compliance*).


    With network policies, which permit access within the namespace, microservices
    can communicate with one another. However, access from another tenant''s microservices
    can be effectively blocked, except for those requests that come in through the
    front door, and only those with the right authorization.


    # Choosing dedicated versus shared compute nodes


    In OpenShift, SELinux and the unique tenant UID for Linux processes provide a
    significant amount of security when we have processes from different tenants executing
    side by side, sharing the same operating system kernel runtime. With namespace
    ResourceQuotas and the ability for Cloud Pak for Data to monitor and enforce usage
    quotas, there are additional controls to ensure that a noisy tenant workload does
    not adversely affect another tenant and that SLAs can be assured in the cluster.


    However, there may be security policies in the enterprise that do not permit co-locating
    one tenant''s processes with another or SLAs that demand some sort of physical
    separation between tenants. Obviously, since assigning independent Kubernetes
    clusters to individual tenants is operationally cost-prohibitive, the OpenShift
    container platform provides an option to support such requirements.'
  merge: -1
  img_proc: true
- pgno: 305
  md: 'A cluster administrator could introduce a NodeSelector annotation to OpenShift
    projects to designate which compute worker hosts (identified by labels) are to
    be used for scheduling the pods for that tenant. This ensures there are dedicated
    nodes for that tenant in an otherwise shared OpenShift cluster. As part of a tenant''s
    onboarding process, a cluster admin could decide whether to use shared compute
    hosts or assign dedicated hosts, just by using this annotation. While with some
    services, such as databases, it is possible to use the Kubernetes concept of Pod-level
    Node affinity, it is typically much easier to assign all nodes for a tenant to
    dedicated nodes if necessary.


    # Reviewing the tenancy requirements


    In Chapter 9, Technical Overview, Management, and Administration, we briefly introduced
    what key attributes need to be addressed to support multi-tenancy with Cloud Pak
    for Data.


    In a way, we can relate these requirements to tenancy for applications in traditional
    operating system environments, albeit at a larger scale. A Unix or Linux system
    would be set up with all the software needed, and the superuser ("root") has the
    responsibility of managing this. The root user would authorize users to access
    that system and assign them to different user groups ("tenants"). The use of trivial
    filesystem permissions (group IDs and user IDs) enables these users to work together
    in their tenant group and be somewhat isolated from other tenants. Users could
    execute and access applications that they (or their group) have been granted access
    to, and operating system security primitives (such as SELinux and AppArmor) ensure
    that cross-process access is strictly controlled.


    > **Note**

    > The Kubernetes cluster is merely the new "operating environment" and supports
    many of the same paradigms as the operating systems, just at a higher level. Cluster
    admins are the "root" users, and they can grant various role-based access rights
    to other users. From a multi-tenancy perspective, such admins now have additional
    operating environment primitives to leverage, such as OpenShift security context
    constraints, isolation of tenants in virtual projects/Kubernetes namespaces, and
    granular RBAC, as described in Chapter 10, Security and Compliance.


    In this section, we will assess the following key tenancy requirements:


    +   - Isolation

    +   - Security and compliance

    +   - Self-service management'
  merge: -1
  img_proc: true
- pgno: 306
  md: 'We will look at them in terms of deploying Cloud Pak for Data instances in
    different Kubernetes namespaces.


    # Isolating tenants


    It''s a basic requirement that users from one tenant account are completely unaware
    of another tenant''s existence. Even when a user is part of two tenant accounts
    – say, an employee who is assigned access to two departmental instances – there
    would be an explicit mechanism to "switch" from one tenant context to another
    – perhaps even different login procedures. In a situation where Kubernetes microservices
    associated with different tenant instances run in the same cluster, in close network
    proximity, and with data potentially being accessible, it becomes important to
    establish some boundaries and enforce strict separation.


    Let''s look at what Cloud Pak for Data and OpenShift offer in terms of achieving
    isolation.


    # Configuring authentication


    Cloud Pak for Data provides the ability for each tenant installation in a namespace
    to decide how to authenticate the users in that tenant group. For example, one
    tenant instance could be configured to authenticate against one LDAP server, while
    another instance could be configured to use another. Alternatively, different
    LDAP (sub)groups could be used for different instances.


    It might be desirable to configure single sign-on (SSO) against the same enterprise
    SSO provider for all (departmental) tenant instances. However, even in this case,
    access to individual Cloud Pak for Data instances can be controlled so that only
    specific users with roles in that instance have access.


    # Authorizing user access


    In Chapter 10, Security and Compliance, we looked at roles and permissions in
    detail, including how they may be customized to suit the enterprise. Roles are
    a cornerstone when it comes to managing user access, even at very granular levels.
    Based on policies or practices, the cluster admin may even choose to modify the
    out-of-the-box Cloud Pak for Data "administrator" role, perhaps to remove the
    ability to (re)configure authentication or manage health, leaving only the ability
    to view monitoring information.'
  merge: -1
  img_proc: true
- pgno: 307
  md: 'Apart from the platform (control plane), every service or capability requires
    authorization. For example, different groups of users could be designated as editors
    in a project or a catalog, while others, even if they have been successfully authenticated,
    could be denied access to that resource. In the same way, but with more granularity,
    individual users or user groups could be granted *select* access to a particular
    virtual table or view as part of the data virtualization service, while others
    may be denied that, just the same as with traditional relational databases.


    # Assuring isolation of compute resources


    Each tenant in their own namespace gets *unique copies* of the microservices they
    need and can independently *scale* them out to suit their expected workloads or
    concurrency requirements. ResourceQuotas at the namespace level ensure that compute
    resources can be *reserved* for each tenant. Enterprises can also choose to assign
    dedicated hosts for a tenant to further guarantee isolation and the availability
    of compute resources.


    As we discussed previously, OpenShift project UIDs and SELinux can assure that
    processes – even those colocated on the *same* host – are isolated.


    # Externalizing routes and entry points


    Each tenant has a unique front door and route. With OpenShift and the use of external
    load balancers, it is even possible to issue completely new URLs with host and
    domain names that are appropriate for that tenant. Each front door route can also
    be associated with a tenant-specific TLS certificate, advertising which specific
    tenant "owns" that instance of Cloud Pak for Data.


    This results in an easy and elegant way to isolate client traffic to the individual
    tenant Cloud Pak for Data instances.


    # Ensuring privacy with storage


    The use of Kubernetes namespaces also guarantees that persistent volumes are only
    available within that namespace scope. As described in *Chapter 11, Storage*,
    **persistent volume claims (PVCs)** are only valid within one namespace and are
    used to mount storage volumes onto the Cloud Pak for Data microservice pods. Even
    if a cluster-wide shared storage solution is in use, using PVCs guarantees that
    one tenant''s volumes cannot be accessed by another tenant''s microservices.'
  merge: -1
  img_proc: true
- pgno: 308
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 309
  md: '# Securing network access


    In the previous sections, we established how the front door and unique routes
    help guarantee isolation for accessing individual tenant Cloud Pak for Data instances
    from *outside* the cluster. Kubernetes includes the concept of network policies,
    a concept very similar to firewall rules, that further strengthen the security
    of a tenant''s instance from intrusive access from *within* the cluster.


    Network policies can be authored to permit access between microservices within
    the same namespace and to deny, by default, access from other namespaces. Additional
    *allow* policies are defined, as an exception to the *deny all* rule, to permit
    HTTPS access to each tenant''s front door and between the operators'' namespace
    and each tenant''s namespace. The *deny* policy blocks traffic between tenants,
    except for their front doors. Interactions between tenants, *if at all* desired,
    would need to be done via the authorization checks in their respective front doors,
    much like an external client accessing from outside the cluster.


    Hence, while some access still needs to be permitted between the Operator and
    tenant namespaces, by carefully crafting network policies, tenants can ensure
    they are secure from intrusions either from outside or within the Kubernetes cluster.


    # Auditing


    There always needs to be checks and balances with regards to how software services
    are operated in such multi-tenant architectures. From a regulatory compliance
    perspective, auditing is one powerful tool that enterprises use to provide assurances
    of safe and monitored operations. In *Chapter 10, Security and Compliance*, we
    discussed the many mechanisms that the cluster operations team can employ to ensure
    security and compliance.


    Tenants typically need to adhere to compliance or monitor the usage of their instance
    of Cloud Pak for Data from a security perspective. Such tenants should not have
    access to auditing or monitoring records across the whole cluster, just those
    scoped to their instance.


    Cloud Pak for Data includes an instance scoped auditing service, as described
    in *Chapter 10, Security and Compliance*. Each tenant admin or security focal,
    if properly authorized, can configure just their instance of Cloud Pak for Data
    to forward all relevant audit events to **security information and event management
    (SIEM)** systems. Even if the same SIEM is used by all tenants and by the cluster
    operations team, the ability to identify each tenant uniquely can be maintained,
    and tenant-specific auditing reports can be published.'
  merge: -1
  img_proc: true
- pgno: 310
  md: '# Self-service and management


    It is not cost-effective for the Cluster Operations team to hold every tenant
    user''s hand for day-to-day operations. From a compliance perspective, it is not
    usually permitted for such cluster admins to be tightly embedded into a tenant''s
    business. Besides, with cloud-based systems, there is every expectation that tenants
    can self-serve themselves for most requirements, without needing IT support. However,
    overall cluster security is the responsibility of the Cluster Operations team,
    and they need to be able to have assurances themselves that the tenants cannot
    breach beyond their instance scope.


    Hence, it becomes a fine balance between maintaining rigid security constraints
    and the flexibility needed for tenants to manage their instances themselves every
    day. In this section, we will look at the capabilities that OpenShift and Cloud
    Pak for Data offer to help enterprises balance this need.


    # Provisioning and upgrades – enabling a choice of services and versions


    Different tenants need different sets of Cloud Pak for Data services to be deployed.
    They may even need to "pin" them to specific versions from a stability perspective
    – typically, production environments are maintained at well-tested levels, while
    there is more flexibility for development environments.


    With the judicious use of operator custom resources, individual tenants can decide
    to install and upgrade each service by themselves. With services that support
    the concept of *service instances*, such as Db2, appropriately authorized tenant
    users can even spin up a database instance on their own, without the need for
    Kubernetes access.


    Hence, cluster admins could grant tenant admins privileges in their namespace
    to empower them to provision Cloud Pak for Data services on their own. In turn,
    tenant admins can authorize a subset of tenant users to be able to provision service
    instances on their own within the confines of that Cloud Pak for Data instance.


    # Monitoring


    With tenant instance scoped monitoring and management, cluster admins can delegate
    day-to-day monitoring to individual tenant admins. Cluster admins still retain
    the rights to control the namespace as a whole, especially by establishing resource
    quotas, and tenant admins operate within those boundaries to decide how to monitor
    and throttle usage inside their tenancy.'
  merge: -1
  img_proc: true
- pgno: 311
  md: 'The Cloud Pak for Data Monitoring and Alerting frameworks can help tenant admins
    understand utilization within their instance, as well as decide how much compute
    they must allocate to individual use cases or services.


    # Operating and maintaining tenant resources


    Cluster admins can also empower tenant admins to perform any needed day 2 maintenance
    on their own. Patches or version upgrades of individual services (just like installation
    and provisioning, as described previously) can be triggered via custom resources
    by the tenant admins themselves, if that authority has been granted. custom resources
    can also be easily leveraged to scale out services in that specific instance of
    Cloud Pak for Data (scaleConfig fields in v4 work similar to how the cpd-cli scale
    command works with v3.5, except that it''s driven by an Operator) with just namespace
    scope privileges being needed.


    The monitoring and management experience provides an easy way for tenant admins
    to manage their own Cloud Pak for Data instances, including identifying and correcting
    failing services. They have access to individual logs and the ability to grab
    advanced diagnostics for IBM support, all without needing their cluster admins
    to engage.


    Backup (and restore, when needed) is also a key concern for tenants. While cluster
    admins ensure the reliability of storage and other infrastructure across all tenants,
    backing up tenant-specific data and metadata can also be entrusted to tenant admins.


    The cpd-cli backup-restore utility, as described in Chapter 11, Storage, requires
    scoped Kubernetes RBAC, and this utility can be leveraged by the tenant admins.
    Note, however, that with storage snapshots and other advanced techniques to move
    storage to remote sites, some initial setup may still be needed that the Cluster
    Operations team must manage. Importantly, each tenant''s backup images can still
    be uniquely identifiable, isolated from other tenants'' backups, and kept protected.'
  merge: -1
  img_proc: true
- pgno: 312
  md: '# A summary of the assessment


    In the previous sections, we discussed how Cloud Pak for Data and OpenShift can
    support the key requirements of multi-tenancy.


    The following table provides a quick summary of how each requirement can be met
    and the mechanisms available that can be leveraged to implement that requirement:


    | Tenancy Aspects | Mechanism |

    |---|---|

    | **Isolation** | *Individual Kube Namespace quotas/OpenShift Projects for each
    Cloud Pak for Data instance* |

    | 1. Users – Authentication, Roles and Authorization

    2. Compute Resources

    3. Access to Instance

    4. Storage Usage | ✓ If needed, can support *different LDAP/AD or SAML configurations
    per instance* (each instance has its own unique user management service)

    ✓ Namespace quotas – set by the cluster admin.

    ✓ Unique DNS-based routes for each instance.

    ✓ Completely separated PVCs (in different namespaces) with different PVs – no
    sharing across instances. |

    | **Security** | *RBAC privileges & Service Accounts scoped only to that namespace*
    |

    | 1. Restricting Kube Cluster-Level Privileges

    2. Network Access

    3. Auditing | ✓ Service accounts and role binding – scoped to Project namespaces.

    ✓ Kube network policies for hardening *like a firewall around an RHOS Project
    namespace*.

    ✓ *Per-tenant SIEM forwarding supported.* |

    | **Management** | *Administration privileges scoped to a namespace* |

    | 1. Monitoring/Metering

    2. Ops – Backup/DR, Scale, Patch, Upgrade

    3. Serviceability

    4. Service Installations | ✓ Different tenant “Admin users for different instances.
    Tenants are managed independently.”

    ✓ Ops privileges scoped to that OpenShift project’s namespace.

    ✓ Serviceability utilities only capture diagnostics that are appropriate for that
    instance.

    ✓ Different instances can have different sets of services at different versions
    scaled independently from other tenants. |


    Figure 12.4 – Summary of the mechanisms and techniques that support multi-tenancy


    As a result of this approach to implementing multi-tenancy, enterprises and cluster
    administrators can decide how best to mix and match different tenants on the same
    shared OpenShift-based infrastructure.


    The following diagram shows the topology of different tenants using different
    versions of Cloud Pak for Data services:'
