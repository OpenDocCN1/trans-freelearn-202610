- pgno: 52
  md: 'While there are no functional differences between the three editions, the Standard
    edition has scalability restrictions while the non-production edition can only
    be used for development and QA deployments.


    # Red Hat OpenShift


    **OpenShift** is a platform that allows enterprises to run containerized applications
    and workloads and is powered by Kubernetes under the covers. At its core, OpenShift
    is underpinned by open source software contributed by a wide community of developers
    and committers. As a result, there are different flavors of OpenShift available
    on the market. The open source project that actually powers OpenShift is called
    **Origin Kubernetes Distribution (OKD)** and you can start with that for free.
    OpenShift Container Platform, on the other hand, is Red Hat''s commercial version
    and it comes with Red Hat support and enables your applications and workloads
    to be deployed on any public or private cloud.


    **What is Kubernetes?**

    Applications these days are increasingly built as discrete functional parts, each
    of which can be delivered as a container. This enables abstraction, agile development,
    and scalable deployments. However, it also means that for every application, there
    are more parts to manage. To handle this complexity at scale, we need a policy-driven
    orchestration platform that dictates how and where containers will run. Kubernetes
    (also known as K8s or Kube) is designed to handle exactly these challenges. It
    is the leading container orchestration framework that automates many of the manual
    processes involved in deploying, managing, and scaling containerized applications.


    Kubernetes delivers significant benefits to developers, IT operations, and business
    owners and enables scalability, workload portability, and agile development. It
    was originally developed and designed by engineers at Google and is the secret
    sauce behind its Google Cloud services. Red Hat was one of the first companies
    to collaborate with Google on Kubernetes and continues to be a leading contributor.
    The Kubernetes project now belongs to the **Cloud-Native Computing Foundation
    (CNCF)**, owing to its donation by Google in 2015.'
  merge: -1
  img_proc: true
