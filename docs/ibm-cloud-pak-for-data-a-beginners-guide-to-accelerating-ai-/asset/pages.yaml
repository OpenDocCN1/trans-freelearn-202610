- pgno: 133
  md: 'LIME treats all models as black boxes and generates an explanation that is
    easy to understand. However, this also requires that LIME understands the model
    behavior in the vicinity of the data points. This can lead to increased costs
    because of more scoring requests. The OpenScale service has an innovative caching-based
    technique that leads to a significant drop in the number of scoring requests required
    for generating a local explanation. In addition to reducing cost, there is also
    a significant improvement in the speed of generating an explanation. The OpenScale
    service has also added a fault tolerance feature to cater to intermittent failure
    in scoring requests.


    The second explainability algorithm provides contrastive explanations. This algorithm
    is tailored to handle models that accept structured data and is able to generate
    contrastive explanations with far fewer scoring requests compared to open source
    alternatives.


    # Model drift


    Model drift refers to a degradation in model performance due to changes in the
    underlying data and the relationship between I/O variables. Model drift can negatively
    impact over time, or sometimes there could be a sudden drift, causing undesirable
    model behavior. To effectively detect and mitigate drift, organizations need to
    monitor and manage model performance regularly as part of their data and AI platform.
    This integrated approach has the following benefits:


    +   - Ability to track metrics on a continuous basis, with alerts on drifts in
    accuracy and data consistency.

    +   - Ability to define targets and track them through development, validation,
    and deployment.

    +   - Simplified steps to identify business metrics affected by model drift.

    +   - Automating drift monitoring minimizes the impact of model degradation.


    The OpenScale service detects drifts in accuracy and in the data. Estimating drifts
    in accuracy is done at model runtime. Model accuracy generally drops if there
    is an increase in transactions not covered by the model training dataset. This
    type of drift is calculated for structured binary and multi-class classification
    models only.'
  merge: -1
  img_proc: true
