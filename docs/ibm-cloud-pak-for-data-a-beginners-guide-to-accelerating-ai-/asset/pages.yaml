- pgno: 89
  md: 'We have now seen how we can leverage automation around data discovery and how
    to assign business terms to technical assets. Next, we will discuss the data quality
    capabilities of the platform.


    # # Enabling trust with data quality


    Data quality is a cornerstone of business operations in the organization, and
    it is affected by the way data is entered, stored, and managed. The reason for
    a lack of confidence in information is because information is pervasive across
    the organization. We are dealing with fragmented silos of data that were accumulated
    through many years, without data quality measures and without being organized
    in a way that makes sense to the business.


    High-quality data is essential for high-quality outcomes for any analytics we
    perform using the data. Data quality entails the following:


    +   - **Completeness:** Having a good understanding of all the related data assets.

    +   - **Accuracy:** Common data problems such as missing values, incorrect reference
    data, and so on that must be eliminated so that we have consistent data.

    +   - **Availability:** Data must be available on demand.

    +   - **Timeliness:** The up-to-dateness of the data is crucial to making the
    right decisions.


    The data quality analysis area of Cloud Pak for Data performs the following tasks:


    +   - Runs column analysis

    +   - Evaluates quality dimensions to identify data quality problems

    +   - Computes a data quality score for data assets and columns

    +   - Runs quality rules and automation rules

    +   - Optionally captures sample data with data quality problems


    Upon competing the data quality analysis, you can publish the results to the governance
    catalog so that the other consumers of the platform can benefit from this analysis.'
  merge: -1
  img_proc: true
