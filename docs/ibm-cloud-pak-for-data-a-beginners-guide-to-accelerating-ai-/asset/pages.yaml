- pgno: 60
  md: 'The complexity, cost, time, and risk of error in collecting, governing, storing,
    processing, and analyzing that data centrally is also increasing exponentially.
    On the same note, the databases and repositories that are the sources of all of
    this data are more powerful, with abundant processing and data storage capabilities
    of their own available.


    Historically, enterprises managed data through systems of record (mainframe and
    client/server applications). The number of applications was limited, and data
    that''s generated was structured for the most part – relational databases were
    leveraged to persist the data. However, that paradigm is not valid anymore. With
    the explosion of mobile phones and social networks over the past decade, the number
    of applications and amount of data that''s generated has increased exponentially.
    More importantly, the data is not structured anymore – relational databases, while
    still relevant for legacy applications, are not built to handle unstructured data
    produced in real time. This led to a new crop of data stores such as MongoDB,
    Postgres, CouchDB, GraphDB, and more, jointly referred to as NoSQL databases.
    These applications are categorized as systems of engagement:


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_60_0.png)


    Figure 3.1 – Mobile, social, the cloud, and big data are transforming the data
    landscape'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'While the evolution of systems of engagement has led to an exponential increase
    in the volume, velocity, and variety of data, it has also made it equally challenging
    for enterprises to tap into their data, given it is now distributed across a wide
    number and variety of data stores within the organization:


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_61_0.png)


    Figure 3.2 – Different workloads require different data stores


    At the same time, business users are more sophisticated these days when it comes
    to creating and processing their own datasets, tapping into Excel and other desktop
    utilities to cater for their business requirements. Data warehouses and data lakes
    are unable to address the breadth and depth of the data landscape, and enterprises
    are beginning to look for more sophisticated solutions. To add to this challenge,
    we are beginning to see an explosion of smart devices in the market, which is
    bound to further disrupt the data architecture in industries such as manufacturing,
    distribution, healthcare, utilities, oil, gas, and many more. Enterprises must
    modernize and continue to reinvent to address these changing business conditions.


    Before we explore potential solutions and how Cloud Pak for Data is addressing
    these challenges, let''s review the typical enterprise data architecture and the
    inherent gaps that are yet to be addressed.'
