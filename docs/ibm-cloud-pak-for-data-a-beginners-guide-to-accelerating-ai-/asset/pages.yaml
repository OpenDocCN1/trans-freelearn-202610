- pgno: 101
  md: '# Advantages of leveraging a cloud-native platform for ETL


    From an architectural standpoint, IBM Cloud Pak for Data brings data integration
    to cloud-native platforms by breaking down the monolithic stack into microservices.
    Some of the advantages of taking this modernized approach include the following:


    +   - Being able to deploy in minutes, enabling standard deployment and management
    while retaining the flexibility to modify environment/job parameters as required.

    +   - Increased reliability due to inherent high availability in Kubernetes/OpenShift.

    +   - Reduced management burdens due to automated updates.

    +   - You can automate management by "application group," so administrators can
    use namespaces to manage access control and provisioning options.

    +   - You can monitor and manage at the application level with platform- and service-level
    features.

    +   - You can scale microservices independently to respond to changing needs:


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_101_0.png)


    Figure 4.23 – Automatic workload balancing


    Containerizing your data integration technology enables you to operate in a hybrid
    cloud environment across on-premises and cloud platforms.'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# Master data management


    Organizations have a lot of data surrounding products, services, customers, and
    transactions, and it is important to derive insights from all of this data to
    maintain a competitive advantage. Master data management is a comprehensive process
    that defines and manages an organization''s critical customer and product data.
    It provides a single, trusted view into data across the enterprise, with agile
    self-service access, analytical graph-based exploration, governance, and a user-friendly
    dashboard to accelerate product information management and master data programs.


    # Extending MDM toward a Digital Twin


    A Digital Twin is a generic concept that was originally derived from the Internet
    of Things (IoT) space, wherein we have a digital representation of a physical
    thing. In the context of MDM, this translates to the ability to capture user interactions
    and derived attributes that can help service the customers more effectively, using
    the information that we know about them. This takes us beyond the standard attributes
    such as name, address, contact details, product details, and others we would source
    from MDM:


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_102_0.png)


    Figure 4.24 – Extending MDM toward Digital Twin'
  merge: -1
  img_proc: true
