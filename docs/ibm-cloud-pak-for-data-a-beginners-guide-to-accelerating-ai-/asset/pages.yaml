- pgno: 165
  md: '# Organize extension services


    While the Collect rung of the AI ladder is about putting your data in the appropriate
    persistence store and enabling easy access, the Organize extension services are
    all about building a trusted analytics foundation. This entails data prep, data
    transformation, data governance, data privacy, master data management, and life
    cycle management of data across the enterprise. While Cloud Pak for Data includes
    a set of rich capabilities for data prep, data governance, and data privacy as
    part of the base offering, the rest of the Organize rung is available through
    the following four extension services (AKA cartridges):


    # DataStage


    Data integration is a critical facet of any enterprise, and it is becoming even
    more important given the increasing scale and distributed nature of enterprise
    data assets (often spread across multiple clouds and data centers). IBM DataStage
    is an enterprise-leading Extract Transform and Load (ETL) offering that has thousands
    of customers, and is well known for its scalability and operational efficiency.
    You can use the DataStage service on Cloud Pak for Data to design and run data
    flows that move and transform data, and this allows you to compose and operationalize
    your data flow with speed and accuracy. Using an intuitive graphical design interface
    that lets you connect to a wide range of data sources, you can integrate and transform
    data, and deliver it to your target system in batches or real time.


    Both services provide hundreds of ready-to-use, built-in business operations for
    your data flows. The high-performance parallel runtime engine underpinning DataStage
    lets enterprises scale to meet their integration needs despite increasing data
    volumes and data complexity.


    DataStage on Cloud Pak for Data comes in the following two flavors:


    +   - DataStage Enterprise

    +   - DataStage Enterprise Plus


    DataStage Enterprise helps design data integration jobs and allows data engineers
    to transform and move data for multiple sources and targets. You can create reusable
    job templates, or design data integration flows in the intuitive GUI. Data engineers
    can also design simple to complex jobs by using a wide range of transformers and
    stages, while the high-performance runtime engine enables scalability and efficiently
    integrates large volumes of data.'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'DataStage Enterprise Plus includes all of the capabilities that DataStage Enterprise
    has, plus additional useful features for data quality. These features include
