    # Automation rules around data quality


    Data quality assessment evaluates data against a set of criteria. This set of
    criteria depends on the business context of the data, including what information
    the data represents, what the criticality of the information is, and the purpose
    of the information. Data quality dimensions and custom data quality rules should
    be used together to perform data quality assessments. Data profiling provides
    an initial view of the characteristics and distribution of data. Automation rules
    leverage this information, from data profiling to assessing quality, such as checking
    for Null or valid date formats, and so on.


    Cloud Pak for Data allows us to construct and deploy automation rules. These automation
    rules help automate tasks to ensure we have the highest quality data and include
    the following:


    +   - Applying rule definitions based on data quality dimensions

    +   - Assigning terms or stewards to assets'
