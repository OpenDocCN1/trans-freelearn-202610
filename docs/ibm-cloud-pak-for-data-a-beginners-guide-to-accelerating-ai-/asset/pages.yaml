- pgno: 199
  md: '# 9

    Technical Overview, Management, and Administration


    Cloud Pak for Data is a data and AI platform that enables enterprises to tap into
    their data and accelerate the adoption of AI to drive better business outcomes.
    This platform helps them modernize their data access mechanisms, organize data
    for trusted analytics, develop machine learning models, and operationalize AI
    into their day-to-day business processes. This chapter provides an insight into
    the foundational aspects of Cloud Pak for Data, the technology stack that powers
    it, and how services integrate to deliver the key capabilities needed to be successful
    with AI in the enterprise.'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'The platform serves several user personas, enabling them to collaborate easily
    with each other, and helps break down silos within the enterprise. It does this
    by abstracting the infrastructural elements and by promoting the integration of
    services to provide a seamless experience for all end users. Enterprises do not
    start off by using all services in the platform, but rather focus on specific
    use cases and then gradually expand to other scenarios as needed. You can have
    different groups of users working on different parts of a solution on Cloud Pak
    for Data while collaborating and sharing assets as needed. Enterprises may even
    have entire departments working on different use cases, with built-in isolation,
    and yet provide for appropriate quality of service to each such *tenant*. Hence,
    the platform also enables a plug-n-play mechanism and multi-tenant Deployment
    models that support the extension of the same foundational platform with additional
    IBM and/or third-party services.


    In this chapter, we will be exploring these different aspects:


    +   - Architecture overview

    +   - Infrastructure requirements, storage, and networking

    +   - Foundational services and the control plane

    +   - Multi-tenancy, resource management, and security

    +   - Day 2 operations


    # Technical requirements


    For a deeper understanding of the topics described in this chapter, the reader
    is expected to have some familiarity with the following technologies and concepts:


    +   - The Linux operating system and its security primitives

    +   - Cloud-native approaches to developing software services

    +   - Virtualization, containerization, and Docker technologies

    +   - Kubernetes (Red Hat OpenShift Container Platform is highly recommended)

    +   - Storage provisioning and filesystems

    +   - Security hardening of web applications, Linux hosts, and containers

    +   - The Kubernetes operator pattern (highly recommended)'
  merge: -1
  img_proc: true
- pgno: 201
  md: '+   - The **kubectl and oc** command-line utilities, as well as the YAML and
    JSON formats needed to work with Kubernetes objects

    +   - An existing Cloud Pak for Data installation on an OpenShift Kubernetes cluster,
    with administration authority


    The sections will also provide links to key external reference material, in context,
    to help you understand a specific concept in greater detail or to gain some fundamental
    background on the topic.


    # # Architecture overview


    In *Chapter 1, The AI Ladder: IBM’s Prescriptive Approach*, and *Chapter 2, Cloud
    Pak for Data – Brief Introduction*, you would have seen why we needed such a platform
    in the first place. In this section, we will start by exploring what exactly we
    mean by a data and AI platform in the first place. We will outline the requirements
    of such a platform and then drill down further into the technical stack that powers
    Cloud Pak for Data.


    # ## Characteristics of the platform


    Enterprises need a reliable and modern platform founded on strong cloud-native
    principles to enable the modernization of their businesses. Let''s look at what
    is expected from such a modern platform in general terms:


    +   - **Resiliency:** Continuous availability is a key operational requirement
    in enterprises. Users need to be able to depend on a system that can self-heal
    and failover seamlessly without needing a system administrator to manually intervene.

    +   - **Elasticity:** Enterprises expect the platform to grow along with their
    use cases and customers. Hence, a scalable platform is yet another key requirement.
    We also need a platform that can support workload *bursting* on demand, in other
    words, grow automatically when new workloads come in and shrink back when they
    are completed. Workloads could just be an increased concurrency with more users
    or background, even scheduled, jobs.'
  merge: -1
  img_proc: true
- pgno: 202
  md: "+   - **Cost-effective:** The ability to support the balancing of available\
    \ compute across different types of workloads and tenants is also important. In\
    \ general, this also implies that compute can be easily transferred to those workloads\
    \ that need it at that time; for example, the ability to assign more compute to\
    \ a nightly data transformation or ML model retraining job while granting more\
    \ compute to interactive users at daytime. A *production* workload may get a preference\
    \ compared to a *development* workload. Thus, this requires the platform to control\
    \ workloads from crossing resource thresholds, ensuring that no noisy neighbors\
    \ are impacting both performance and reliability.\n+   \n+   - **Extensibility:**\
    \ The platform is expected to help customers start with one use case and expand\
    \ when needed. This also implies that the platform cannot be monolithic and architecturally\
    \ support a plug-n-play model where capabilities and services can be turned on\
    \ as needed. Enabling the integration of various enterprise and third-party systems,\
    \ as well as leveraging existing investments, is also key for quickly realizing\
    \ value from the platform.\n+   \n+   - **Portability:** Enterprises require a\
    \ platform that works the same across different Infrastructure-as-a-Service providers,\
    \ including on-premises. They need to be able to easily burst into the public\
    \ cloud or across multiple clouds.\n+   \n+   - **Integrated:** A data and AI\
    \ platform needs to be able to serve different user personas with different skill\
    \ levels and responsibilities. Such a platform needs to facilitate collaborations\
    \ among end users, empowering them with self-service capabilities that do not\
    \ require constant IT handholding. This implies a seamless user experience and\
    \ APIs that abstract the complexity of the implementation from its consumers.\n\
    +   \n+   - **Secure:** The platform must enable enterprises to operate securely,\
    \ enabling end user workloads or services from multiple vendors to function within\
    \ well-established boundaries. A data and AI platform also needs to ensure that\
    \ the enterprise is regulatory compliance-ready. Since the economics of infrastructure\
    \ cost typically implies the use of shared computing and storage resources to\
    \ support multiple tenants, techniques to ensure data security and isolation of\
    \ tenant workloads become fundamental to the enterprise.\n\n# Technical underpinnings\n\
    \nIn earlier chapters, we introduced **Kubernetes** [1] and **Red Hat OpenShift\
    \ Container Platform** [2] as the core infrastructure powering all Cloud Paks.\
    \ In this section, we will look at the capabilities of this technology that makes\
    \ it the ideal vehicle for delivering a data and AI platform."
  merge: -1
  img_proc: true
- pgno: 203
  md: "Kubernetes is essentially a highly resilient and extensible platform for orchestrating\
    \ and operating containerized workloads. It embodies the microservices architecture\
    \ pattern, enabling the continuous development and Deployment of smaller, independent\
    \ services:\n\n+   - **Resilient:** Kubernetes enables containerized workloads\
    \ to be clustered on multiple compute nodes. Kubernetes monitors workloads (\"\
    Pods\") and, via health probes, can auto-restart them when failure is detected.\
    \ Even when there are compute node failures, it can automatically move workloads\
    \ to other nodes. This works out well for establishing *multi-zone* availability,\
    \ where workloads can survive the outage of entire zones.\n+   \n+   - **Elasticity:**\
    \ The scale-out of computing is elegantly handled by introducing additional compute\
    \ nodes to the cluster. Kubernetes treats the entire set of CPU cores and memory\
    \ as a pool of resources and can allocate them to Pods as needed. It also supports\
    \ the concepts of replicas and **load balancing**, where workloads can be scaled\
    \ out with multiple copies (Pod replicas). Kubernetes can then route requests\
    \ to different replicas automatically in a round-robin manner, considering those\
    \ replicas that may not be healthy at any instant.\n+   \n+   - **Infrastructure\
    \ abstraction:** With Kubernetes, workloads are deployed using higher-level constructs\
    \ and without the need to be aware of the **compute infrastructure** that hosts\
    \ it – whether on-premises or in the cloud, or whichever hypervisor is in use.\
    \ Pods are seamlessly scheduled on different worker nodes based on how much compute\
    \ (CPU cores and memory) is needed. Kubernetes also includes the ability to consume\
    \ **storage** for persistence using a vendor-independent framework, and this enables\
    \ enterprises to work with a wider choice of storage technologies, including leveraging\
    \ existing storage solutions that they may already have in their enterprises.\
    \ Software-defined **networking**, and the concept of OpenShift routes and ingress,\
    \ as well as service discovery patterns, also ensure that workloads are well insulated\
    \ from the complexity of networking, too.\n+   \n+   - **Portable and hybrid cloud-ready:**\
    \ OpenShift Container Platform delivers a standardized Kubernetes operating environment\
    \ in many cloud Infrastructure-as-a-Service hyper-scaler environments, even offered\
    \ as a service as well as on-premises on top of both virtual machine and bare\
    \ metal nodes. Kubernetes thrives as an open source community, and with that comes\
    \ challenges with different versions and API compatibility. OpenShift ensures\
    \ a consistent release cycle for Kubernetes with fully validated and *security-hardened*\
    \ container platforms everywhere. This ensures that enterprises can deploy their\
    \ applications anywhere they need or move to another cloud, without the danger\
    \ of being locked down to an initial choice of the Infrastructure-as-a-Service."
  merge: -1
  img_proc: true
- pgno: 204
  md: '+   - **A rich developer ecosystem:** Kubernetes has quickly become the development
    platform of choice for cloud-native applications. OpenShift Container Platform
    further extends that with developer-focused capabilities, including enriching
    the concept of **continuous delivery/continuous integration (CI/CD)**. With the
    focus on secure development and operations, OpenShift Container Platform enables
    rapid innovation at enterprises for developing modern cloud-native apps and solutions.

    +   - **Enterprise and multi-tenancy ready:** Kubernetes, especially with its
    concept of namespaces, resource quotas, and network policies, can elegantly support
    isolations between tenants. **OpenShift Container Platform** [2] introduces additional
    security constructs, including SELINUX host primitives that greatly improve the
    safe sharing of OpenShift clusters among multiple tenants in a cost-effective
    manner.


    For these reasons and more, IBM Cloud Pak for Data is powered by the Red Hat OpenShift
    Container Platform. This enable Cloud Pak for Data to provide an open, extensible,
    reliable, and secure data and AI platform in any cloud.


    # The operator pattern


    The operator pattern [3] is an architectural concept and best practices to build,
    deliver, and operate applications in Kubernetes. Operators [4] are special Controllers
    deployed in Kubernetes that are meant to manage individual applications in an
    automated manner. Essentially, operators codify human experiences to manage and
    correct Kubernetes workloads.


    Cloud Pak for Data v4 functionality is delivered as operators [5]. These operators
    enable users to install and configure *Day1* activities. From a *Day2* perspective,
    operators also continuously monitor and auto-correct deviations from the norm
    as well as support the need to scale up/out deployed Cloud Pak for Data services
    when needed. Operators are also leveraged to upgrade services to newer releases
    in an automated fashion.


    OpenShift Container Platform includes the **Operator Lifecycle Manager (OLM)**
    [6] functionality that helps the OpenShift Administrator curate operators for
    various services (IBM, Red Hat, open source, or other third-party vendors) in
    a standardized manner.


    Cloud Pak for Data includes a *Control Plane* layer that enables all services
    to integrate seamlessly and be managed from a single platform layer. This control
    plane is deployed using an operator called the Cloud Pak for Data platform operator
    [5]. A user with appropriate Kubernetes privileges creates a **Custom Resource
    (CR)** object in a particular Cloud Pak for Data instance namespace to indicate
    what service should be deployed. In the case of Cloud Pak for Data, a custom resource
    of the kind *IbmcP* causes the Cloud Pak for Data platform operator to trigger
    the installation of the control plane in that namespace.'
  merge: -1
