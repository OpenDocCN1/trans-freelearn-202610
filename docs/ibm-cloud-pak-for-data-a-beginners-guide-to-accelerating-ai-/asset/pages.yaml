- pgno: 223
  md: 'After choosing the appropriate attributes for provisioning that instance, for
    example, as shown in the preceding screenshot, the user then triggers the creation
    of the instance. The creator of such an instance is then designated as the first
    administrator of that instance.


    With the creation of such an instance (or generally whenever any specific operations
    are performed on that instance), audit records are automatically generated by
    the control plane.


    Cloud Pak for Data platform administrators, apart from the creator of the instance,
    can also manage and monitor these instances. However, even platform administrators
    may be denied access to consume the instance in the first place. For example,
    while the Cloud Pak for Data platform administrator can perform maintenance tasks,
    or even de-provision that database instance, they may not have access to the data
    inside. This is critical from a regulatory compliance perspective to enable such
    separation of duties.


    The following screenshot shows an example of how an authorized user (the admin
    of that instance or the Cloud Pak for Data platform administrator) can manage
    access rights. They can assign roles (including that of an admin) to other users
    and groups:


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_223_0.png)


