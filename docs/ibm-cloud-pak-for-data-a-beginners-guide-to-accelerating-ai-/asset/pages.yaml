- pgno: 34
  md: '# The case for a data and AI platform


    In the previous section, we introduced IBM’s prescriptive approach to operationalizing
    AI in your enterprise, starting with making data access simple and organizing
    data into a trusted foundation for advanced analytics and AI. Now, let’s look
    at how to make that a reality.


    From an implementation perspective, there are many existing and established products
    in the industry, some from IBM or its partners and some from competitors. However,
    there is a significant overhead to making all these existing products work together
    seamlessly. It also gets difficult when you look at hybrid cloud situations. Not
    every enterprise has the IT expertise to integrate disparate systems to enable
    their end users to collaborate and deliver value quickly. Reliably operating such
    disparate systems securely also stretches IT budgets and introduces so much complexity
    that it distracts the enterprise from achieving their business goals in a timely
    and cost-efficient fashion.


    Due to this, there is a need for a data and AI platform that provides a standardized
    technology stack and ensures simplicity in operations. The following diagram shows
    what is typically needed in an enterprise to enable AI and get full value from
    their data. It also shows the different personas in a typical enterprise, with
    different roles and responsibilities and at different skill levels, all of which
    need to tightly collaborate to deliver on the promise of trusted AI:


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_34_0.png)


    Figure 1.7 – Silos hinder operationalizing AI in the enterprise'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'Most enterprises would have their data spread across multiple data sources,
