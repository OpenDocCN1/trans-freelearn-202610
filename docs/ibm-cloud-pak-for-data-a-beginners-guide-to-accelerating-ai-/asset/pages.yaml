- pgno: 65
  md: 'Now that we have covered enterprise data architecture, let''s move on to NoSQL
    data stores.


    # NoSQL data stores – key categories


    NoSQL data stores can be broadly classified into four categories based on their
    architecture and usage. They are as follows:


    +   - **Document databases** map each key with a complex data structure, called
    a document. Documents can be key-array pairs, key-value pairs, or even nested
    documents. Some of the most popular choices for document databases include MongoDB,
    CouchDB, Raven DB, IBM Domino, and MarkLogic.

    +   - **Key-value stores** are the *simplest* form of NoSQL database. Every row
    is stored as a key-value pair. Popular examples include Redis, Memcached, and
    Riak.

    +   - **Wide-column stores**, also known as columnar data stores, are optimized
    for making queries over large datasets, as well as to store columns of data together
    instead of as rows. Examples include Cassandra and HBase.

    +   - **Graph stores** store information about graphs; networks, such as social
    connections; road maps; and transport links. Neo4j is the most popular graph store.


    Next, we''ll review some of the capabilities of Cloud Pak for Data that enable
    it to address some of the challenges and one of them is Data virtualization.


    # Data virtualization – accessing data anywhere


    Historically, enterprises have consolidated data from multiple sources into central
    data stores, such as *data marts*, *data warehouses*, and *data lakes*, for analysis.
    While this is still very relevant for certain use cases, the time, money, and
    resources required make it prohibitive to scale every time a business user or
    data scientist needs new data. Extracting, transforming, and consolidating data
    is resource-intensive, expensive, and time-consuming and can be avoided through
    data virtualization.


    **Data virtualization** enables users to tap into data at the source, removing
    complexity and the manual processes of data governance and security, as well as
    incremental storage requirements. This also helps simplify application development
    and infuses agility. **Extract, Transform, and Load (ETL)**, on the other hand,
    is helpful for complex transformational processes and nicely complements data
    virtualization, which allows users to bypass many of the early rounds of data
    movement and transformation, thus providing an integrated, business-friendly view
    in near real time.'
  merge: -1
  img_proc: true
