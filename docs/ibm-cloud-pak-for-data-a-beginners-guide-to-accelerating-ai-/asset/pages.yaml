- pgno: 157
  md: '# 7


    # IBM and Partner Extension Services


    The ecosystem is a critical component of any successful platform, and **Cloud
    Pak for Data** is no exception. As explained in *Chapter 2, Cloud Pak for Data:
    A Brief Introduction,* it has a two-tiered packaging structure comprising "a base
    platform that comes with a set of modular services, but priced and packaged collectively
    as a single unit, allowing clients to tap into what they need" and "Premium extension
    services that are optional and priced/ packaged separately."


    This chapter focuses on the extension services from **IBM**, also known as cartridges
    and capabilities from our ecosystem partners. The IBM extension services are tightly
    integrated into Cloud Pak for Data and include the platform services that enable
    them to operate independently or as part of an integrated platform. On the other
    hand, third-party extensions require Cloud Pak for Data and **Red Hat OpenShift**.


    In this chapter, we''re going to cover the following main topics:


    +   - IBM and third-party extension services

    +   - Collect cartridges: **Db2 Advanced** and **Informix**'
  merge: -1
  img_proc: true
- pgno: 158
  md: '+   - Organize cartridges: Data Stage, Information Server, Master Data Management,
    and IBM virtual Data Pipeline

    +   - Infuse cartridges: Cognos Analytics, Planning Analytics, Watson Assistant,
    Discovery, Watson AI for Operations, Watson Financial Crimes Insight, and more

    +   - Modernization upgrades to Cloud Pak for Data cartridges


    # IBM and third-party extension services


    The concept of extension services is best explained using the simple analogy of
    an iPhone. When someone buys an iPhone, in addition to the hardware and Apple
    iOS operating system, you also receive several pre-installed and pre-integrated
    apps from Apple, such as Camera, Maps, Phone, iMessage, Music, and more. These
    pre-installed and tightly integrated apps enable clients to get started on day
    one and address the majority of their day-to-day needs. These day-one apps are
    included as part of the initial purchase. In addition, you can also download third-party
    premium apps from the App Store that are priced and packaged separately. These
    are optional apps that address specific requirements and enhance the overall value
    of an iPhone.


    The two-tiered packaging structure of Cloud Pak for Data (shown next) is somewhat
    analogous to the iPhone. When you buy Cloud Pak for Data, you are entitled to
    a number of data and AI capabilities required to collect, organize, and analyze
    data, as well as infuse AI into business processes. Of course, these are modular
    sets of services, enabling customers to utilize just what they need while retaining
    the ability to expand or scale them in the future. Also similar to an App Store,
    Cloud Pak for Data includes an ecosystem of premium services from IBM and third-party
    vendors enabling customers to optionally tap into a wider set of capabilities.
    These are called extension services. The IBM extension services are tightly integrated.
    They include an entitlement to Red Hat OpenShift, and common platform services
    that enable them to operate independently or as part of a broader platform. As
    a result, they are also known as cartridges. On the other hand, the third-party
    services have Cloud Pak for Data and Red Hat OpenShift as prerequisites, and support
    limited integration with the platform. Nonetheless, they are highly valuable and
    help complement the capabilities of the base platform:'
  merge: -1
  img_proc: true
