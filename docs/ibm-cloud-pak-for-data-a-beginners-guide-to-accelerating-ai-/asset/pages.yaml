- pgno: 253
  md: 'It is best *not* to think of these Kubernetes nodes as general-purpose Linux
    systems, but rather as specialized machines secured and managed by OpenShift as
    a cluster. OpenShift provides security and operations for the *entire stack* from
    the operating system to containers to individual workloads. Traditional anti-virus
    software cannot cover the entire stack and may interfere with the operations or
    reliability of the cluster.


    Red Hat and OpenShift provide additional security hardening to reduce the need
    for anti-virus software in the first place [19]. Note that traditional scanners
    are typically used to locate viruses in shared file systems (such as those served
    by Samba) and mounted on Windows clients. But, with the prescriptive approach
    for operating Kubernetes within OpenShift Container Platform and on RHEL CoreOS,
    such arbitrary file serving should *not* be set up on these Kubernetes nodes in
    the first place.


    In this section, we explored the security constructs that are available in the
    Operating System and OpenShift. We also looked at how Cloud Pak for Data, with
    the judicious use of Kubernetes RBAC can ensure the least privileges for each
    service account and uses a convention of labels and annotations to tag all workloads.
    It also constrains the assignment of compute resources to ensure secure and reliable
    operations. In the following section, we will look at what controls are available
    for Cloud Pak for Data administrators to configure authentication and ensure the
    right level of authorization for each user.


    # User access and authorizations


    Cloud Pak for Data is a platform into itself, is a multi-user system, and thus
    also provides access control for users. It also integrates with Enterprise LDAP
    or Active Directory and other identity providers to ensure secure access to its
    services. Auditing is also supported for tracking access to the Cloud Pak for
    Data platform as well.


    As with any multi-user system, Cloud Pak for Data identifies roles and permissions
    that are granted to specific users or groups of users. A suitably privileged user
    is tasked with the responsibility of ensuring that only authorized users can access
    the services and content hosted by Cloud Pak for Data.


    # Authentication


    While Cloud Pak for Data includes a simple out-of-the-box mechanism to identify
    users and grant them access, this is only for initial runs and is not meant for
    secure production use, and will fail to meet any compliance regulation requirements.
    For example, password policies or multi-factor authentication cannot be supported
    with this default mechanism. Instead, the expectation is that the enterprise sets
    up connectivity to an identity provider.'
  merge: -1
  img_proc: true
