- pgno: 140
  md: '# IBM''s multi-cloud strategy


    IBM is one of the few technology vendors to have embraced a hybrid multi-cloud
    strategy from day one, and this is evident from the deployment options that are
    supported by IBM. Being able to deploy anywhere is a key differentiator for Cloud
    Pak for Data. While software and system deployment options enjoy customer adoption
    the most, Cloud Pak for Data as a Service is IBM''s strategic direction in the
    long run. The as-a-Service managed edition of Cloud Pak for Data was launched
    in 2020 on IBM Cloud and is now supported on third-party clouds through Cloud
    Satellite, which we will cover in detail later in the chapter.


    The value proposition of as-a-Service is that it allows customers to modernize
    how they collect, organize, analyze, and infuse AI with no installation, management,
    or updating required. In essence, you can derive all the benefits of an integrated
    data and AI platform, namely Cloud Pak for Data, without the overhead of managing
    the infrastructure or software.


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_140_0.png)


    Figure 6.1 – IBM''s hybrid multi-cloud strategy


    Cloud Pak for Data as a Service is a strategic priority for IBM as there is a
    growing demand for Software as a Service (SaaS). Furthermore, IBM launched Cloud
    Satellite to deliver SaaS on-premises and third-party clouds. The objective is
    to give customers the flexibility of choice so that they can consume software
    and SaaS on the infrastructure of their choice such as an on-premise private cloud
    (x86, Power, Z) or a public cloud such as IBM Cloud, AWS, Azure, and so on. Next,
    we will cover supported deployment options.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# Supported deployment options


    Cloud Pak for Data comes in three deployment options: software, system, and as-a-Service,
    offering significant choice to customers as to where they deploy and run their
    software and how they manage Cloud Pak for Data:


    +   - Cloud Pak for Data **software** runs on any private or public cloud, including
    AWS, Azure, and GCP. Also supported are managed **OpenShift on IBM Cloud (ROKS)**,
    managed **OpenShift on AWS (ROSA)**, and managed **OpenShift on Azure (ARO)**.

    +   - Cloud Pak for Data **system** is a true plug-and-play, all-in-one, enterprise
    data and AI platform that comes with all the necessary hardware and software components.

    +   - Cloud Pak for Data *as a Service* runs on IBM Cloud and third-party clouds
    such as AWS through **IBM Cloud Satellite**.


    For enterprise customers who cannot yet embrace the public cloud or would prefer
    a non-IBM cloud, the options are as follows:


    +   - **Private cloud**: Cloud Pak for Data software, with its embedded Red Hat
    OpenShift, enables customers to deploy and operate a cloud-native data and AI
    platform in their own data center. Alternatively, clients can opt for Cloud Pak
    for Data system, an integrated appliance with hardware and software pre-installed,
    optimized for end-to-end data and AI workloads.

    +   - **Third-party clouds**: Cloud Pak for Data software is supported on all
    major public clouds, including AWS, Azure, and GCP, either directly on their cloud
    infrastructure or on their managed OpenShift offering, such as **Red Hat OpenShift
    on AWS (ROSA)** or **Azure Red Hat OpenShift (ARO)**.


    # Managed OpenShift


    Red Hat has launched managed OpenShift offerings on all major cloud providers,
    including IBM Cloud, AWS, Azure, and GCP. Customers can run their workloads, including
    Cloud Pak for Data ones, without worrying about the maintenance, administration,
    and upgrading of OpenShift, which is not so easy for non-technology users.


    IBM Cloud Pak for Data is currently available and supported on three major managed
    OpenShift services. They are IBM Red Hat ROKS, Amazon ROSA, and Microsoft ARO.
    Managed OpenShift''s main value proposition includes four key points:'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'The main value proposition of this service spans 4 key points:


    +   - **Time saved**: Red Hat takes care of OpenShift so that customers can focus
    on their data and AI workloads. Furthermore, delivery pipelines are pre-integrated
    with user-friendly management tools, simplifying the effort required to manage
    and administer Cloud Pak for Data.

    +   - **Consistency**: Multi-cloud with Red Hat OpenShift works everywhere, including
    on public clouds and on-premises, and hybrid support enables flexibility of deployment.
    Also, it allows customers to focus and build skills in one Kubernetes distribution
    (namely OpenShift) that spans all deployment options.

    +   - **Portability**: Run Red Hat OpenShift workloads consistently with any major
