- pgno: 29
  md: 'Also, it''s worth pointing out that building AI models is the easy part. The
    real challenge lies in deploying those AI models into production, monitoring them
    for accuracy and drift detection, and ensuring that this becomes the norm.


    IBM''s AI tools and runtimes on Cloud Pak for Data present a differentiated and
    extremely strong set of capabilities. Supported by the Red Hat OpenShift and Cloud
    Pak for Data strategy, IBM is in a position to set and lead the market for AI
    tools. There are plenty of point AI solutions from niche vendors in the market,
    as evidenced from the numerous analyst reports; however, none of them are solving
    the problem of putting AI into production in a satisfactory manner. The differentiation
    that IBM brings to the market is the full end-to-end AI life cycle:


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_29_0.png)


    Figure 1.5 – AI life cycle


    Customers are looking for an integrated platform for a few reasons. Before we
    get to these reasons, the following teams care about the integrated platform:


    +   1. Data science teams are looking for integrated systems to manage assets
    across the AI life cycle and across project team members.

    +   2. Chief Data Officer are looking to govern AI models and the data associated
    with them. Chief Risk Officer (CRO) are looking to control the risks that these
    models expose by being integrated with business processes.

