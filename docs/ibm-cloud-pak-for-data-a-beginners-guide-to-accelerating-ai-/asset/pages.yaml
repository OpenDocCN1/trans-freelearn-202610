- pgno: 300
  md: '# Architecting for multi-tenancy


    In this section, we will explore what it means to implement multi-tenancy with
    Cloud Pak for Data, starting with how to plan out the topology on an OpenShift
    cluster and how to separate the tenants within the same cluster.


    # Achieving tenancy with namespace scoping


    As we established earlier, assigning a unique OpenShift project (a Kubernetes
    namespace) to each unique tenant is the recommended approach for Cloud Pak for
    Data multi-tenant deployments.


    The following diagram shows how multiple tenants can be sandboxed into individual
    OpenShift projects and the logical separation between the Operations zone (which
    would be managed by the cluster administrators) and the Tenants zone (somewhere
    the tenant users are potentially given access to):


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_300_0.png)


    Figure 12.1 – Individual tenant namespaces in a shared Kubernetes cluster'
  merge: -1
  img_proc: true
- pgno: 301
  md: "The **Cluster Operations zone** includes all the management functions provided\
    \ by OpenShift and Kubernetes (not everything is shown in the preceding diagram\
    \ for brevity). The **Operator Lifecycle Manager (OLM)** provides operators and\
    \ services for installing and managing Cloud Pak for Data itself. It is also very\
    \ much relevant for achieving multi-tenancy as it provides the right abstraction\
    \ to extend the cluster and enable different capabilities (via service operators)\
    \ to be made available in the cluster. To meet separation of duties requirements,\
    \ OLM can be fully controlled by the cluster admins and integrated into their\
    \ CI/CD processes, with tenants, including their admins, denied access.\n\nThe\
    \ **Cloud Pak Foundational Services (CPFS)** are commonly located in the *ibm-common-services*\
    \ namespace. This includes the *namespace-scope operator*, which is instrumental\
    \ in ensuring that the Cloud Pak for Data Operators are constrained to only managing\
    \ specific tenant namespaces and not *all* namespaces. There isn't a need for\
    \ these operators to watch over *non*-Cloud Pak for Data namespaces anyway and\
    \ for security reasons (principle of least privilege), it is best not to even\
    \ grant these operators that privilege. While the Cloud Pak for Data service operators\
    \ can be co-located with CPFS in *ibm-common-services*, they can also be installed\
    \ in a different *cpd-operators* namespace, as shown in the preceding diagram.\
    \ For example, you may choose to use *cpd-operators* when there are other Cloud\
    \ Paks present in the same cluster. While it is necessary for the CPFS operators\
    \ to manage all Cloud Pak namespaces, it is not necessary for Cloud Pak Data operators\
    \ and by isolating them to *cpd-operators*, you can ensure they are scoped to\
    \ only the Cloud Pak for Data namespaces.\n\n> **Note**\n> \n> As depicted in\
    \ the preceding diagram, each tenant namespace has its own private copy of the\
    \ Cloud Pak for Data control plane scaled out as needed, including a front door\
    \ with its own private ingress/route. OpenShift enables the exposure of this front\
    \ door for access via unique tenant URLs. This enables client apps to target the\
    \ appropriate tenant instance to connect to from outside the cluster."
