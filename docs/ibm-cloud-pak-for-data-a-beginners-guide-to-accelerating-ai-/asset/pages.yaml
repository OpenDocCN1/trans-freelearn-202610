- pgno: 276
  md: "Storage classes, represented by the `StorageClass` Kubernetes Kind resource,\
    \ are used to reference each type of volume. When Cloud Pak for Data services\
    \ are provisioned, they include PVC declarations, which are then processed by\
    \ Kubernetes to provision and bind PVs.\n\nFor example, the user-home volume is\
    \ requested by defining a `PersistentVolumeClaim` that resembles the following:\n\
    \n```\napiVersion: v1\nkind: PersistentVolumeClaim\nmetadata:\n  name: \"user-home-pvc\"\
    \nspec:\n  storageClassName: {{ <user-selected-storage-class> }}\n  accessModes:\n\
    \    - ReadWriteMany\n  resources:\n    requests:\n      storage: {{ default \"\
    100Gi\" or <user-selected-size> }}\n```\n\nYou will also notice that the PVC definition\
    \ identifies parameters, such as the storage class to use and the storage size\
    \ that's been requested. These are introduced via the installation options for\
    \ the Cloud Pak for Data services.\n\nThe declarations in the *claim*, along with\
    \ the class of storage and other attributes (such as `size` and `accessModes`),\
    \ represent a *request* to Kubernetes to provision a volume for use by the Cloud\
    \ Pak for Data service. Once the storage volume has been provisioned, Kubernetes\
    \ then satisfies that claim by *binding* the provisioned PV to the PVC. This binding\
    \ metadata then enables Kubernetes to always mount the same storage volume in\
    \ the Pods, as well as for services to use the abstraction of the PVC to always\
    \ refer to the volume, without needing to know the specifics of where the volume\
    \ exists physically or the driver/storage technology behind it.\n\n> **Note**\n\
    > \n> You will not need to explicitly define the PVC yourself. The PVC will be\
    \ declared during the Cloud Pak for Data service installation process."
  merge: -1
  img_proc: true
- pgno: 277
  md: "StorageClass definitions can also identify the vendor-specific provisioner\
    \ to be used. Some storage classes are predefined when the storage software is\
    \ installed in the OpenShift cluster, while other vendors provide this for defining\
    \ new storage classes, with custom parameters for fine-tuning volumes for specific\
    \ use cases.\n\nAs an example, the ocs-storagecluster-ceph-rbd (RWO) and ocs-storagecluster-cephfs\
    \ (RWX) storage classes are present as part of the OpenShift container storage\
    \ installation, while Portworx defines storage classes explicitly with different\
    \ sets of configurable attributes for performance or quality.\n\nThe Portworx\
    \ Essentials for IBM installation package includes a list of storage classes that\
    \ are used by Cloud Pak for Data services. Here is a snippet of one of the RWX\
    \ classes; that is, portworx-shared-gp3:\n\n```\napiVersion: storage.k8s.io/v1\n\
    kind: StorageClass\nmetadata:\n  name: portworx-shared-gp3\nparameters:\n  priority_io:\
    \ high\n  repl: \"3\"\n  sharedv4: \"true\"\n  io_profile: db_remote\n  disable_io_profile_protection:\
    \ \"1\"\nallowVolumeExpansion: true\nprovisioner: kubernetes.io/portworx-volume\n\
    reclaimPolicy: Retain\nvolumeBindingMode: Immediate\n```\n\nHere is a snippet\
    \ of the portworx-metastoredb-sc RWO class:\n\n```\napiVersion: storage.k8s.io/v1\n\
    kind: StorageClass\nmetadata:\n  name: portworx-metastoredb-sc\nparameters:\n\
    \  priority_io: high\n  io_profile: db_remote\n  repl: \"3\"\n```"
  merge: -1
  img_proc: true
- pgno: 278
  md: '```

    disable_io_profile_protection: "1"

    allowVolumeExpansion: true

    provisioner: kubernetes.io/portworx-volume

    reclaimPolicy: Retain

    volumeBindingMode: Immediate

    ```


    Here, you can see that there are some vendor-specific parameters. Some are meant
    for performance optimization, while others are meant for redundancy (replication)
    and control, such as checking whether such provisioned volumes can be expanded.


    Similarly, other storage provisioners, such as IBM Spectrum Scale, have similar
    configuration parameters as part of their storage classes.


    Once Kubernetes provisions these PVs, as specified in the requested PVCs, Kubernetes
    uses the binding between the physical location of the storage and the PV construct
    to abstract how storage is accessed by individual Pods. These provisioned PVs
    are then mounted by Kubernetes upon startup of the individual Cloud Pak for Data
    Pods, using drivers provided by the storage vendors or the underlying technology.


    As part of installing Cloud Pak for Data services, specific storage classes are
    selected by the user as installation parameters. The Cloud Pak for Data documentation
    [6] includes guidance on which types of storage classes are appropriate for each
    service [7].


    Now, let''s look a bit deeper into the storage topology itself, such as where
    the storage could be located and what it means for different Kubernetes Nodes
    to access this.


    Broadly, we can classify the storage locations like so:


    +   - **In-cluster storage:** This is where the physical storage devices/disks
    and the storage software control system are. They are used to provision and manage
    volumes in those devices, and they are also part of the same Kubernetes cluster
    as Cloud Pak for Data itself.

    +   - **Off-cluster storage:** This is where the physical storage devices and
    the storage software is operated independently from the Kubernetes cluster where
    Cloud Pak for Data is expected to run. Only the storage drivers may exist on the
    Kubernetes cluster, as well as their provision and mount volumes from that remote
    storage system.'
  merge: -1
  img_proc: true
- pgno: 279
  md: 'From a storage volume access perspective, various types of software drivers
    (software-defined storage) and plugin code exist in the Kubernetes ecosystem to
    support mounting volumes [12]. Some are called "in-tree" volume provisioners,
    which refer to code that natively exists in Kubernetes itself to work with such
    types of storage, while others are referred to as "out-of-tree" provisioners,
    which refer to code that exists outside of Kubernetes but can be plugged to work
    with different storage solutions. Recent versions of Kubernetes also include a
    driver standard called the Container Storage Interface (CSI) [13]. These provisioners
    present one or more storage classes that provide the storage abstraction needed
    for applications in Kubernetes. Hence, Kubernetes applications can be designed
    to work against the PVC and storage class standards and be completely independent
    of the actual physical location, the organization, or the drivers needed to work
    with storage.


    # In-cluster storage


    This deployment option typically refers to co-locating storage and compute within
    the same Kubernetes cluster as Cloud Pak for Data services. Storage devices are
    attached to multiple compute worker or infrastructure Nodes, while a software-defined
    storage solution coordinates how the storage will be provisioned and consumed
    by mounting the volumes wherever they’re needed. These Nodes are typically connected
    over a low latency and high throughput network inside the cluster. Such storage
    is only meant to be used by applications and workloads running inside that Kubernetes
    cluster.


    Kubernetes natively includes the ability to mount volumes directly by using hostPath
    from the compute host [8], as well as node affinity mechanisms by using local
    volumes [9] to work around the logistical issues of scheduling Pods on the same
    workers as storage. However, these options do not provide dynamic provisioning
    support, and reliability is compromised when the underlying worker Nodes go offline.
    Also, OpenShift’s restricted security context [11], by default, will not permit
    large numbers of such volumes from the host. The use of hostPath or local volumes
    also causes a tight coupling with Kubernetes applications in terms of storage.
    The portability of applications and the clean abstraction of storage classes and
    provisioning technologies is lost. For these reasons, Cloud Pak for Data does
    not rely on hostPath or local volume types.'
  merge: -1
  img_proc: true
