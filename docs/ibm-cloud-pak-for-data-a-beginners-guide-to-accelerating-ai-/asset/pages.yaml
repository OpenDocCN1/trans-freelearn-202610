- pgno: 130
  md: 'It is important to monitor for bias at runtime and notify proactively so that
    we can act on it. OpenScale monitors the data that has been sent to the model
    and the model predictions. It then identifies bias issues and notifies the user
    of these. Let''s review some core concepts before we understand how bias can be
    dealt with, as follows:


    +   - **Fairness attribute:** Bias is generally measured in the context of one
    attribute—for example, gender, age, and so on. This can also be non-demographic
    attributes such as account information, how long a person has been a customer,
    and so on.

    +   - **Monitored/reference group:** This is a subset of the dataset for which
    we want to measure bias. The remaining values for the fairness attribute can be
    called a reference group. If we want to measure gender bias toward males, females
    would be considered a reference group.

    +   - **Disparate impact:** This is a measure of bias that can be computed as
    a ratio of the percentage of a favorable outcome for the monitored group to the
    percentage of a favorable outcome for the reference group. Bias is said to exist
    if the disparate impact value is below some predefined threshold.

    +   - **Bias threshold:** If the bias threshold is 1, then it would mean that
    we expect both monitored and reference groups to get the same outcome of predictions.


    The following screenshot illustrates the detection of bias with Watson OpenScale:


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_130_0.png)


    Figure 5.19 – Bias detection with Watson OpenScale'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'As we have now explored what detecting AI bias brings to business operations,
    let’s next look into how data perturbation works and how the OpenScale service
    uses this technique as a differentiator to other options for bias detection.


    # Data perturbation


    The OpenScale service uses a data perturbation technique as a differentiator to
    other options for bias detection. Let’s use an example scenario of 100 insurance
    claims. In these claims, 60 claims were made by people in the 18-24 age group
    and 40 in the above 24 age group. All the people in the 18-24 age group had very
    high claim frequency and were known to have made fraudulent claims in the past,
    hence the model rejected all 60 claims in that age group. On the other hand, the
    40 claims in the above 24 age group were all approved by the model. The disparate
    impact for this would be 0/1=0, leading to the model being flagged as biased.
    However, the model is not biased and is based on the data provided to it. To avoid
    this situation, OpenScale leverages data perturbation.


    Data perturbation works by flipping the record in the monitored group with a random
    value from the reference group and then sends the perturbed value to the model.
    All the other features of the record are kept the same. Now, after perturbation,
    if the model predicts that the claim in the preceding example is approved, then
    it means the model is acting in a biased manner by making decisions just based
    on the age of the customer. Thus, while computing bias, we do this data perturbation
    and compute the disparate impact using the payload and the perturbed data. This
    will ensure that we report bias only if there are enough data points where the
    model has exhibited biased behavior across the original and the perturbed data.
    Thus, we are able to detect if there is genuine bias in the model and not get
    impacted by the kind of data being received by the model.


    # Comparing model quality, fairness, and drift


    The OpenScale service in Cloud Pak for Data enables you to monitor multiple models
    across different providers and algorithms, enabling customers to compare performance
    over a period of time and across different versions (production/pre-production).'
  merge: -1
  img_proc: true
