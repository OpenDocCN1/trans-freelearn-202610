- pgno: 80
  md: '# Technical metadata components


    Technical metadata can be both out-of-the-box asset types and also custom asset
    types. This includes the following:


    +   - Databases

    +   - Data files

    +   - Unstructured data sources

    +   - Data science assets (models, notebooks, and so on)

    +   - Logical data models

    +   - Physical data models

    +   - XML schema definitions

    +   - Master data management

    +   - Applications

    +   - Files

    +   - Stored procedure definitions

    +   - Business intelligence artifacts

    +   - Data quality assets (data rule definitions, data rule sets, metrics, and
    so on)

    +   - Extraction, Transformation, Loading assets (jobs, stages, parameters, and
    so on)

    +   - Custom technical assets


    Now that we know what metadata needs to be captured, in the next section, we will
    discuss the process of getting a better understanding of the data we have by profiling
    the enterprise data assets.


    # Profiling to get a better understanding of

    your data


    With enterprises going through digital transformation, there has been a proliferation
    of data and multiple systems that often result in redundant datasets with varying
    levels of data quality. With large volumes of data, it is imperative that we get
    a good understanding of the characteristics of the datasets, what attributes/columns
    of data are available, the data types of the individual columns, their unique
    values, and how the data values are distributed. This profile information helps
    us isolate datasets of interest from the large collection of possibly overlapping
    datasets.'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'With Cloud Pak for Data, we have a centralized governance catalog that acts
    as the index of all our data assets and helps us organize resources for many data
    science projects: data assets, analytical assets, and the users who need to use
    these assets. This catalog also has built-in profiling capabilities that allow
    the consumers to select a given dataset and initiate a quick data profiling activity.
    The focus is on the following two aspects of profiling:


    +   - Data structure discovery; that is, what attributes are available in the
    dataset?

    +   - Data content discovery; that is, what are the data values, their distribution,
    quality, and so on?


    The first step is to define a connection to the data source and onboard the data
    asset to the catalog. Cloud Pak for Data supports a wide array of data source
    connectors, and this list of supported connectors is growing with every new version
    of the platform.


    Once a data asset has been onboarded, we can use the catalog to do the following:


    +   - Tag the asset with one or more tags.

    +   - Get a quick preview of the data.

    +   - Add reviews and comment on the asset.

    +   - Define access policies for the asset.

    +   - Track the event lineage of the asset.

    +   - Create a data profile:


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_81_0.png)


    Figure 4.4 – Initial profiling of catalog assets'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'Optionally, you can select either all the available data classes or a subset
    of the data classes as part of the profiling activity. The amount of time it takes
    to run the profile will depend on the number of data classes we pick and the size
    and width of the data asset:


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_82_0.png)


    *Figure 4.5 – Identifying data classes to leverage as part of initial data profiling*


    The data profiling process takes some time and you get to see a few things:


    +   - The data classes that have been assigned to individual columns/attributes
    as appropriate

    +   - The summary statistics of the individual columns/attributes, regardless
    of the data type

    +   - The frequency distribution of the values in the individual columns/attributes


    This helps with quickly identifying potential data quality issues in the data.


    In the following screenshot, we have the data profile of the selected dataset.
    This helps us gain a quick understanding of the data:'
