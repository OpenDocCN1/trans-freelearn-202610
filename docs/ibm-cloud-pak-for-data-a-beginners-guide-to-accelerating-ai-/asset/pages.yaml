- pgno: 267
  md: '+   - OpenShift Container Platform v4 introduces a compliance operator [31]
    to help ensure compliance and detect gaps with RHEL CoreOS based hosts in general.
    The **National Institute of Standards and Technology (NIST)** organization, among
    other things, also provides utilities and guidance for robust compliance practices
    that enterprises strictly adhere to as a general principle. The OpenShift Compliance
    Operator provides the right level of automation to help enterprises leverage the
    NIST OpenSCAP utility, for example, for scanning and enforcement of policies in
    such complex, dynamic environments.


    Cluster admins are generally tasked with the responsibility of ensuring that the
    cluster is set up appropriately to meet compliance standards. It is also important
    that there is sufficient monitoring of privileged actions in the cluster, whether
    in the infrastructure or at higher levels, such as with Cloud Pak for Data. The
    next section identifies additional configuration that would be needed to ensure
    the reporting of all privileged activities.


    # Auditing


    Auditing provides a way for enterprises to prove compliance and to monitor for
    irregularities.


    Auditing can be enabled at various levels in the stack:


    +   - At the operating system level [32], RHEL provides mechanisms for the enterprise
    to monitor violations of any security policies. The audit system logs access watches
    for any sensitive or critical file access on that host.

    +   - At the OpenShift Container Platform level [33], Administrators can configure
    auditing levels to log all requests to the Kubernetes API server by all users
    or other services.

    +   - At the Cloud Pak for Data level, audit logging supports generating, collecting,
    and forwarding **Cloud Auditing Data Federation (CADF)** [34] compliant audit
    records for core platform auditable events.


    You can configure IBM Cloud Pak for Data audit logging to forward audit records
    to your **security information and event management (SIEM)** solutions, such as
    **Splunk**, **LogDNA**, or **QRadar**.


    The audit logging implementation uses Fluentd output plugins [35] to forward and
    export audit records. After you install IBM Cloud Pak for Data, the Audit Logging
    Service is not configured out of the box. External SIEM Configuration [36] can
    be added to the `zen-audit-config` Kubernetes configmap to define where the Audit
    Logging Service forwards all collected audit records.'
