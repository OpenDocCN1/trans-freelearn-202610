- pgno: 284
  md: 'The following diagram shows an example of how a central storage management
    solution can expose volumes (either via the standard NFS protocol or other custom
    mechanisms):


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_284_0.png)


    Figure 11.4 – Centralized storage management with NFS


    Storage is expected to be provisioned dynamically as needed, by provisioners,
    to satisfy the PVCs defined in Kubernetes. Drivers (or, natively, NFS) support
    how these volumes are physically mounted in different Pods that have been scheduled
    on different Kubernetes compute workers.


    For detailed guidance on how to use this provisioner and the storage class to
    define, see [14] in the Further reading section.


    Note that the expectation, from a production perspective, is that this assigned
    NFS server does not become a single point of failure, that it is highly available,
    and that it supports automatic failover (that is, it can''t be something as trivial
    as the NFS daemon on a single Linux system). If the NFS server fails, all the
    PVC mounts would become unusable. Hence, an enterprise-class resilient storage
    management solution is critical for ensuring overall reliability.'
  merge: -1
  img_proc: true
- pgno: 285
  md: '# Operational considerations


    In the previous sections, we discussed what it means to provide or consume storage
    either in-cluster or off-cluster for the containerized services in Cloud Pak for
    Data. However, it is also critical to make sure that the storage infrastructure
    itself is resilient and that operational practices exist to ensure that there
    is no data loss. Storage failover must also be taken into account from a disaster
    recovery (DR) standpoint.


    In this section, we will take a quick look at some typical practices and tools
    we can use to ensure that the Cloud Pak for Data services operate with resilience,
    and that data protection is assured.


    # Continuous availability with in-cluster storage


    A core tenet in Kubernetes is to ensure the continuous availability of applications.
    This includes load balancing and replicas for compute that can span multiple zones.
    Such zones could be failure (or availability) zones in public clouds or perhaps
    independently powered racks of hardware for an on-premises deployment [17].


    In terms of in-cluster storage, this requires that the storage is also continuously
    replicated – this heavily depends on the storage vendor or technology in use.
    Here is an example topology for continuous availability, sometimes also referred
    to as active-active DR:


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_285_0.png)


    Figure 11.5 – Active-active DR'
  merge: -1
  img_proc: true
- pgno: 286
  md: 'This model is sometimes referred to as a *stretched* cluster due to the assumption
    is that there is just one cluster, even though some Nodes may be located in different
    physical "zones."


    The key here is to ensure that the storage blocks are replicated across zones
    in a near-real-time fashion. With this kind of deployment, stateful Pods would
    always have access to their PVs, regardless of which zone they are physically
    located in. The failure of one storage node/replica should not cause the entire
    application to fail. This is because other storage replicas should be able to
    serve the necessary blocks of data. The storage drivers in Kubernetes that support
    this notion of continuous availability completely abstract (via PVCs) where the
    data is physically picked up from, and they can fail over automatically to use
    storage from a different replica.


    From a load balancing perspective, we typically consider that all compute Pods
    are always active and available for use, irrespective of the zone they are located
    in. Even if an entire zone becomes unavailable, only the compute and storage replicas
    become inaccessible, which means other replicas can take up the slack.


    Such storage drivers are typically also configured to be aware of the cluster
    topology [18], for example, by the use of Kubernetes node labels to designate
    failure zones. This enables them to place PV replicas in different zones and thus
    offer resiliency in the case of the loss of one zone. A common problem with such
    a replication model is the "split brain" effect, where storage replicas have inconsistent
    data blocks because of failure situations where different Nodes don''t communicate
    and synchronize data. Hence, such storage drivers have the sophistication to cordon
    off storage under these conditions, as well as identify when a replica has been
    offline for too long and needs to be updated to "catch up" or copy over data blocks
    when new storage replicas are added. This is critical to ensure that application
    data is always kept consistent in all its replicas.


    While having a low latency network between such zones is critical, this multi-zone
    replication technique also requires such sophistication from the storage technology
    being used. For example, Red Hat OpenShift Container Storage (Ceph) and Portworx
    Enterprise support such requirements, as do most public cloud IaaS storage providers.


    Continuous storage availability is technically possible with off-cluster storage
    as well, though it takes a bit more effort to align the storage zones with the
    Kubernetes cluster zones. External storage managers such as IBM Spectrum Scale,
    Dell EMC Isilon, NetApp onTap, and NAS-based solutions have traditionally provided
    mechanisms for synchronous replication across zones.'
  merge: -1
  img_proc: true
