- pgno: 78
  md: 'The previous screenshot shows an example of business metadata that''s been
    collected in the form of business terms, with a data steward assigned. They will
    be responsible for validating the business term and organizing this business concept
    in the enterprise taxonomy through categories and secondary categories where applicable.


    **Data stewards** play a key role in the broader data governance initiative. Let''s
    use a simple diagram to illustrate the roles that are played by the different
    entities, including their individual responsibilities:


    +   - **Data Governance Leadership** responsibilities include the following:

    +     - Formulating and reviewing governance plans and policies

    +     - Being aware of leading trends in data governance areas

    +     - Providing guiding principles for various data governance initiatives

    +     - Providing strategic direction for the data stewardship committee

    +   - **Data Governance Office** responsibilities include the following:

    +     - Identifying and prioritizing data governance initiatives

    +     - Establishing and monitoring performance measures for data

    +     - Providing assurance of the enterprise perspective and approach

    +     - Identifying and engaging data stewards and coordinators

    +   - **Business Process Owner** responsibilities include the following:

    +     - Resolving escalated problems at a tactical level

    +     - Identifying and engaging operational data stewards

    +     - Prioritizing and approving data quality issue remediation requests

    +     - Communicating expectations and requirements to data stewards and custodians

    +   - **Data Steward** responsibilities include the following:

    +     - Using data to perform their job and processes.

    +     - Checking the integrity of data usage.

    +     - Serving as the first point of contact for data access, source, change
    control, and any data quality issues that are identified within their data domain
    and functional area.'
  merge: -1
  img_proc: true
