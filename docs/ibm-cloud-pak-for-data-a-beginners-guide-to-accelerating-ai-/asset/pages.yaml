  md: '```

    managed-by=0020-zen-base,app.kubernetes.io/name=0020-zen-base,app=0020-zen-base,component=zen-core-api,release=0020-core

    ```


    svc also identifies which port is exposed and the protocol used, such as the following:


    ```

    Port:                 zencoreapi-tls  4444/TCP

    TargetPort:           4444/TCP

    Endpoints:            10.254.16.52:4444,10.254.20.23:4444

    ```


    Endpoints indicate the Pod IPs and 4444 ports that the requests are routed to.


    If you look at the list of zen-core-api Pods, you will notice that the IPs are
    assigned to those specific Pods:


    ```

    kubectl get pods -lcomponent=zen-core-api -o wide

    NAME                         READY   STATUS    RESTARTS   AGE

    IP                           NODE                         NOMINATED

    NODE   READINESS GATES

    zen-core-api-8cb44b776-zlv6q  1/1     Running   7          12d

    10.254.20.23  worker1.zen-dev-01.cp.fyre.ibm.com  <none>

    <none>

    zen-core-api-8cb44b776-vxx1h  1/1     Running   10         12d

    10.254.16.52  worker0.zen-dev-01.cp.fyre.ibm.com  <none>

    <none>

    ```


    Hence, in the case of a request to the kube-svc *hostname* zen-core-api-svc, port
    4444 will be routed to one of these Pods automatically by Kubernetes. All other
    components within the same cluster would only use this kube-svc hostname to invoke
    its endpoints and are thus abstracted from the nature of the zen-core-api Pods,
    where exactly they run, or even how many replicas of these Pods may exist at the
    same time.


    The Cloud Pak for Data control plane also runs a special service called ibm-nginx-svc
    that routes to ibm-nginx Pods. These Pods are delivered via a Deployment called
    ibm-nginx. This component, powered by nginx, is also known as the "front door"
    since it serves as the primary access point to Cloud Pak for Data services in
    general. Apart from any initial authentication checks, the ibm-nginx Pods also
    enable a reverse proxy to other microservices (identified by their kube-svc hostname)
    and serve the user experience.'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'OpenShift supports multiple ways [16] of accessing services from outside the
    cluster. Cloud Pak for Data exposes just one OpenShift route [17], called cpd,
    to invoke the user experience from a web browser and for invoking APIs from other
    clients:


    ```

    kubectl get route cpd

    ```


    | NAME | HOST/PORT | PATH |

    | SERVICES | PORT | TERMINATION |

    | WILDCARD |  |  |

    | cpd | cpd-cpd-122.apps.zen-dev-01.cp.fyre.ibm.com |  |

    | ibm-nginx-svc | ibm-nginx-https-port | passthrough/Redirect |

    | None |  |  |


    This route represents the external access to Cloud Pak for Data and the "host"
    is a DNS resolvable hostname. In the preceding example, zen-dev-01.cp.fyre.ibm.com
    is the hostname of the OpenShift cluster itself. When a client from outside the
    cluster, such as a web browser, accesses this hostname, OpenShift routes it to
    the ibm-nginx-svc Kubernetes service, which is load-balanced across how many ibm-nginx
    Pods may currently be running.


    OpenShift routes can also be secured using TLS [18] in general. Cloud Pak for
    Data also provides a way to associate custom certificates with its Kubernetes
    service [19].


    # Foundational services and the control plane


    IBM has a broad portfolio of products that are now available as Cloud Paks on
    OpenShift Container Platform. With every such product, there is a common need
    to operate in different data centers, both on-premises and in the cloud, and the
    requirement to integrate with existing enterprise systems. To that end, a set
    of shared services has been developed called the Cloud Pak foundational services
    (CPFS).


    # Cloud Pak foundational services


    CPFS is also known as "Bedrock." It provides key services that run on top of OpenShift
    Container Platform to power all Cloud Paks, including Cloud Pak for Data, and
    serves as a layer to support integration between all Paks.


    These capabilities enabled by the CPFS services include the following:


    +   - **Certificate Management Service**: This service enables Cloud Paks to generate
    TLS certificates, manifest them as Kubernetes secrets, and be mounted in Pods
    that need them. This helps in securing inter-microservice communications and promotes
    easier automatic rotation of certificates.'
  merge: -1
  img_proc: true
