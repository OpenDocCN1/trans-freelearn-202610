- pgno: 256
  md: '# # Authorization


    With permissions and roles, an enterprise can define their own personas and grant
    them specific access to different Cloud Pak for Data services.


    A role is an entity that is used to define what collection of permissions (privileges)
    are granted to a particular user persona.


    Cloud Pak for Data services introduce one or more out-of-the-box roles to get
    started with and an experience to help manage roles. Enterprises can use such
    roles to adhere to *separation of duties* policies needed for compliance reasons.
    For example, administrators may be denied access to data (which is the default
    for database instances they did not provision in the first place), and also to
    data catalogs, by revoking specific permissions.


    Granular privileges can also be granted, for example, only granting a specific
    set of users the ability to manage user access and to manage group access, but
    they need not be granted access to other administrative functions.


    The administrator typically configures roles using the user management experience,
    as shown in the following figure:


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_256_0.png)


    Figure 10.5 – Managing roles experience'
  merge: -1
  img_proc: true
