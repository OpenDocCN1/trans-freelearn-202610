- pgno: 38
  md: '# # The case of a data and AI platform – recap


    In the previous chapter, we introduced IBM''s prescriptive approach to operationalizing
    data and AI in your enterprise, and subsequently, we introduced you to the broad
    capabilities of Cloud Pak for Data. In this section, we will outline how Cloud
    Pak for Data powers the implementation of the AI Ladder practice in your enterprise.


    Cloud Pak for Data, as an open platform, breaks down silos between different products,
    enabling them to be manifested as cloud-native services on top of the same OpenShift
    Kubernetes platform. Cloud Pak for Data enables such services to easily integrate
    through a common control plane and, importantly, provides a personalized, integrated
    user experience for end users to collaborate naturally, without even being aware
    of product or service boundaries.


    On this one platform, capabilities such as data virtualization help modernize
    data access for the hybrid cloud and data can be easily accessed in place across
    clouds. Data cataloging and governance services can piggyback on data virtualization
    and other data sources to deliver on broader governed data access plane solutions,
    which in turn facilitates trust in data that is made available to data science,
    analytics reporting, and machine learning services. On the same platform, operations
    teams can deploy ML models at scale, enabling model monitoring with bias detection
    to support continuous model evolutions.


    Development, experimentation, and production deployments can be supported on the
    same platform, promoting collaborations between teams of users with varying roles
    and responsibilities to work closely. Authentication and authorization, customized
    in the control plane to comply with enterprise regulations, enable seamless access
    across all services. Consistent APIs and concepts such as user groups, API keys,
    and tokens enable the development of custom applications and solutions in a standard
    manner.


    Administration and operations are simplified through operators powered by Red
    Hat OpenShift Kubernetes. Portability of deployment across on-premises and public
    cloud infrastructure is assured, enabling bursts into the cloud when needed. Cloud-native
    practices enable continuous delivery and integration for enterprise applications
    and solutions. Security controls and operational auditing are built into the platform
    to ensure adherence to compliance requirements in the enterprise. The deployment
    and management of multiple tenants on the same set of shared compute resources
    also make Cloud Pak for Data much more cost-effective for an enterprise.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# Overview of Cloud Pak for Data


    In Chapter 1, The AI Ladder: IBM’s Prescriptive Approach, you were introduced
    to IBM’s prescriptive methodology to AI adoption, the AI ladder, and how enterprises
    can embrace this framework through IBM’s modern multi-cloud data and AI platform,
    Cloud Pak for Data. The concept of an integrated platform to manage data, analytics,
    and AI services is not new – there has always been a demand for an end-to-end
    offering spanning the different rungs of the AI ladder. Enterprises addressed
    this need through custom integrations by often tapping into global consulting
    organizations for resources and expertise.


    With the advent of public cloud and service-oriented architectures, it is now
    becoming commonplace to procure pre-integrated software platforms. These platforms
    minimize the integration effort while still providing the flexibility to meet
    specific business requirements.


    Cloud Pak for Data was launched on May 29, 2018, leveraging Kubernetes technology,
    which allowed the platform to be deployed on any public cloud and/or private cloud
    in enterprise data centers. This enabled clients to leverage cloud-native benefits
    such as easy provisioning, scaling, simplified management, and seamless upgrades,
    while sticking to their infrastructure of choice: the private cloud or any public
    cloud such as AWS, Azure, or IBM Cloud. It’s also worth highlighting that the
    data and AI services underpinning the platform have been tried and tested by thousands
    of enterprise customers over the past few decades. So, while the integrated platform
    is new and modern, the capabilities and functionality behind it have been proven
    at scale. This is critical for enterprise customers who cannot afford to make
    risky investments as they are looking to modernize their data and AI workloads.
    The following diagram illustrates the various releases of Cloud Pak for Data since
    its launch:


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_39_0.png)


    Figure 2.1 – IBM Cloud Pak for Data journey: 8 releases since launch'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'Now, let''s explore the key differentiators of Cloud Pak for Data and the typical
    use case patterns that enterprises use it for.


    # Exploring unique differentiators, key use cases, and customer adoption


    Cloud Pak for Data offers clients a single platform with a rich ecosystem of modular
    data and AI services that provides simplicity, fast adaptability to change, and
    reduced reliance on specialization and hard-to-find skills. Unlike the typical
    mix of many isolated tools for databases, data operations, data science, data
    analytics, and visualization we see most of our customers/enterprises using, Cloud
    Pak for Data is one common operational fabric for all data and AI services. The
    result is a delightful, unified experience, cost reduction from the automation
    of manual mundane tasks, and enforced data governance and security.


    Cloud Pak for Data is the new way to solve complex business problems with a hybrid-cloud
    data and AI platform that runs anywhere.


    Here are the unique differentiators of the platform:


    +   - **A unified experience:** The end-to-end integrated platform amplifies productivity
    while enabling collaboration across different personas and functional divisions.

    +   - **Automation:** AI is leveraged to automate a number of tasks such as building
    models (Auto AI), discovering and cataloging datasets (data discovery), and many
    more.

    +   - **Governance and Security:** This is infused throughout the platform and
    is a major differentiator. While data governance enables customers to ensure compliance
    and self-service analytics, AI governance infuses trust and drives the adoption
    of AI projects within enterprises while also addressing the needs of regulatory
    compliance.

    +   - **Deploy anywhere:** Cloud Pak for Data runs on any public or private cloud
    and connects data everywhere. This provides enterprises with flexibility and a
    choice of infrastructure and avoids vendor lock-in (*the independence to migrate
    workloads to a different cloud provider if needed down the road*).


    Let''s now explore a few key use cases of Cloud Pak for Data.'
  merge: -1
  img_proc: true
