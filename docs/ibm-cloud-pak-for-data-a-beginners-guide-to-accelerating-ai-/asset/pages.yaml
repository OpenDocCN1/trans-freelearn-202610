- pgno: 71
  md: 'While tapping into data without moving it is a great starting point, Cloud
    Pak for Data also enables customers to persist data on its platform. You can easily
    deploy, provision, and scale a variety of data stores on Cloud Pak for Data. The
    supported databases on Cloud Pak for Data are as follows:


    +   - Db2 (both OLTP and analytical workloads)

    +   - Db2 Event Store

    +   - MongoDB

    +   - Enterprise DB PostgreSQL

    +   - Cockroach DB

    +   - Crunchy DB PostgreSQL

    +   - Support for object storage – separation of compute and storage


    Cloud Pak for Data enjoys a vibrant and open ecosystem, and more data sources
    are scheduled to be onboarded over the next 1-2 years. This offers customers the
    freedom to embrace the data stores of their choice while continuing to tap into
    their existing data landscape. Finally, it''s worth mentioning that all the data
    stores that are available on the platform are containerized and cloud-native by
    design, allowing customers to easily provision, upgrade, scale, and manage their
    data stores. Also, customers can deploy these data stores on any private or public
    cloud, which enables portability. This is critical in situations where data gravity
    and the co-location of data and analytics is critical.


    # Summary


    Data is the world''s most valuable resource and to be successful, enterprises
    need to become data-centric and leverage their data as a key differentiator. However,
    increasing data volumes, evolving data stores, and distributed datasets are making
    it difficult for enterprises and business users to easily find and access the
    data they need. Today''s enterprise data architecture is fairly complex, with
    a plethora of data stores optimized for specific workloads. Data virtualization
    offers the silver bullet to address this unique challenge, and IBM''s Cloud Pak
    Data is one of the key vendors in the market today. It is differentiated for its
    ability to scale and its integrated approach, which addresses data management,
    data organization, and data analysis requirements.


