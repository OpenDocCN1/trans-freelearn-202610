- pgno: 228
  md: "# # Multi-tenancy, resource management, and security\n\nOpenShift clusters\
    \ are considered shared environments in many mature enterprises. They expect to\
    \ expand such clusters when needed to accommodate more workloads and re-balance\
    \ available resources. It is far more cost-effective to share the same OpenShift\
    \ cluster and consolidate management and operations rather than assign a separate\
    \ cluster to each tenant. Since such clusters include different types of workloads\
    \ from different vendors, and applications that require sophisticated access management\
    \ and security practices, a focus on tenancy is important from the start.\n\n\
    The concept of tenancy itself is very subjective. In some situations, dev-test\
    \ and production installations may be considered different tenants in the same\
    \ cluster. In other cases, different departments, or different project use cases,\
    \ may be treated as individual tenants. When this concept is extended to ISVs\
    \ operating a cluster on behalf of their clients, each of those clients is likely\
    \ to be different companies and there could be stricter requirements on tenancy\
    \ compared with a case where all users are from the same company.\n\nThe chapter\
    \ on multi-tenancy covers the tenancy approach and best practice recommendations\
    \ with Cloud Pak for Data in greater detail. In this section, we will look at\
    \ a high-level overview of tenancy requirements and how Cloud Pak for Data is\
    \ deployed and managed in such shared Kubernetes clusters.\n\nLet's first start\
    \ with some key criteria that influence tenancy approaches:\n\n+   - **Isolation\
    \ of tenants:** There is a need to ensure that different tenants are fully unaware\
    \ of each other on such shared systems. This could include the need to use completely\
    \ different authentication mechanisms. Different LDAP groups or even different\
    \ LDAP servers may be desired for different tenants.\n+   \n+     Protecting resources\
    \ via access authorizations and policies is absolutely necessary in general, but\
    \ with multiple tenant users present, these assume an even more prominent role.\n\
    +   \n+     Isolation also extends to network isolations, even to the point of\
    \ having completely different user experience and API hostname URLs and DNS domain\
    \ names for each tenant, even if they physically share the same Kubernetes cluster.\n\
    +   \n+     Storage systems, consumed in the form of Kubernetes persistent volumes,\
    \ also need to ensure that tenants do not have access to each other's volumes."
  merge: -1
  img_proc: true
- pgno: 229
  md: "+   - **Security:** Note, however, that for cost reasons, some enterprises\
    \ may end up permitting a lot more sharing between tenants. So, while isolation\
    \ requirements provide some amount of separation between tenants, there are also\
    \ specific security and regulatory compliance requirements that play a fundamental\
    \ role in the Deployment topology. Authentication and authorization access management\
    \ help to a great extent, but may not be sufficient.\n+   \n+     For example,\
    \ since OpenShift Kubernetes itself is shared, it would be unwise to grant access\
    \ to any tenant to that operating environment. This also means that there needs\
    \ to be an operations team or IT department solely tasked with managing the OpenShift\
    \ cluster, including the security of the host nodes themselves, as well as the\
    \ onboarding of tenants.\n+   \n+     As with traditional, non-containerized applications,\
    \ there could also be a need for network security. For example, two tenants could\
    \ need to be firewalled off from each other or strict policies set to ensure that\
    \ no breach occurs.\n+   \n+     Security requirements could extend to even needing\
    \ different encryption keys for storage volumes for different tenants.\n+   \n\
    +     From a regulatory compliance perspective, different tenants may have different\
    \ requirements. There may not be any need to have auditing for dev-test or ephemeral\
    \ tenants, but more thoroughness may be required for production tenants. Some\
    \ tenants, because of the nature of their work with sensitive data, may require\
    \ a lot more security hardening and audit practices than others. Hence, there\
    \ is a need for the tenancy approach to support such diverse configuration requirements\
    \ as well.\n+   \n+   - **Resource management:** With a shared cluster offering\
    \ a pool of compute, it is also imperative that the cluster is shared equitably.\
    \ IT operation teams may need to support specific **Service Level Agreements (SLAs)**\
    \ for individual tenants.\n+   \n+     Hence, the tenancy mechanism must support\
    \ controls where resource utilization is monitored, noisy neighbors are prevented\
    \ or at least throttled, and importantly, compute usage limits can be enforced.\
    \ In some organizations, chargebacks to tenants could also rely on the ability\
    \ to measure compute utilization and/or set quotas.\n+   \n+   - **Supporting\
    \ self-service management:** It becomes operationally expensive for enterprises\
    \ to have dedicated support for each tenant user. It is desirable to have each\
    \ tenant self-serve themselves, even for provisioning services or scaling them\
    \ out, or performing backups or upgrades on their own."
  merge: -1
  img_proc: true
- pgno: 230
  md: 'It is also usually the case for a tenant admin to decide on matters of access
    management (and compute resource quotas) on their own, without needing IT support.


    It is preferable for monitoring and diagnostics or other maintenance tasks to
    be delegated to the tenant admins as well.


    Approaches to tenancy should thus be able to support granting some level of management
    privileges to designated "tenant administrators" within their scope.


    In this section, we looked at some common requirements that are placed on multi-tenancy
    approaches. The next section will introduce how the Cloud Pak for Data technology
    stack helps address these aspects of tenancy.


    # Isolation using namespaces


    While it may be simpler to use different Kubernetes clusters or even dedicated
    host nodes for each tenant, it will not be cost-effective. Luckily, Kubernetes
    includes the concept of a namespace [34] that represents a virtual cluster to
    help sandbox different tenant workloads. OpenShift Container Platform extends
    namespaces with the concept of a project [35].


    The most common approach is to have different installations of Cloud Pak for Data
    in different tenant instance namespaces. Each tenant is then assigned one such
    installation and works in relative privacy and isolation from one another. Cloud
    Pak for Data installations in each tenant namespace use their own OpenShift router,
    which allows for the customization per tenant of this access point, including
    external hostnames and URLs, as well as the ability to introduce different TLS
    certificates for each tenant.


    Since persistent volume claims and network policies can be scoped to namespaces
    as well, isolation from storage and network access can also be guaranteed. Should
    a tenant user need access to Kubernetes (for example, to install or upgrade their
    services), that could be scoped to their namespace, too, with Kubernetes RBAC.
    OpenShift projects could also be mapped to dedicated nodes and this can provide
    for more physical separation, at an increased cost, to isolate Pods from various
    tenants from one another.


    The chapter on multi-tenancy describes the various options of using namespaces
    to achieve isolation as well as options where two tenants may want to even share
    the same namespace.'
  merge: -1
  img_proc: true
- pgno: 231
  md: '# # Resource management and quotas


    Cloud Pak for Data supports a wide variety of use cases and different types of
    users concurrently using an installation. Once a service is deployed, there would
    be some fixed set of Pods that provide APIs, repositories, and user experiences,
    as well as some supporting management aspects specific to that service. These
    are considered *static* workloads that are always running. When end users interact
    with these services, there typically would be *dynamic* workloads. Some of these
    may be long-running, such as a user-provisioned database instance, and others
    may simply be short-term workloads such as data science interactive environments,
    Spark jobs, and machine learning training jobs. If there are more users concurrently
    launching analytics environments or, say, initiating expensive model training
    simultaneously, they may end up competing for resources or starving other essential
    jobs.


    All Pods in Cloud Pak for Data are labeled and annotated to identify the *product*
    it belongs to [25]. Pods also specify resource requests and limits needed [29]
    for operating in the Kubernetes environment. The request CPU and memory settings
    help Kubernetes pick a suitable worker node to schedule the Pod in, reserve the
    requested compute for that Pod, and use the limit settings to set an upper limit.
    Pods would thus be able to "burst" to the upper limit for a short duration and
    be able to support a sudden spike in workloads. This avoids the need to plan for
    the worst case and reserve more compute than typically needed, while allowing
    emergency, temporary growth, but only if additional resources are available in
    that worker node at that instant.


    Resource management is a critical aspect to consider when working with such dynamic
    workloads and concurrent user activity. While the architecture elegantly supports
    elasticity and more compute resources can be added when needed, it is more practical
    and cost-effective to fully consume existing resources to the maximum extent before
    scaling out. An administrator would thus need to ensure that there is a fair and
    balanced use of resources and can transfer resources to workloads that urgently
    need it.


    Kubernetes supports the concept of a **ResourceQuota** specification that can
    be used by cluster administrators to control compute allocations across all namespaces.
    In addition to this, the control plane includes the ability for a Cloud Pak for
    Data *tenant* administrator, without needing Kubernetes privileges, to define
    compute resource thresholds per service (product) in their installation. While
    this is still subject to the overall namespace ResourceQuota set by the Kubernetes
    cluster admin, it allows some flexibility to the Cloud Pak for Data administrator
    to self-manage the resources that have been granted.'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'The following screenshot illustrates how such a tenant administrator can set
    boundaries on both CPU and memory for the Watson Knowledge Catalog Service within
    that Cloud Pak for Data instance namespace:


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_232_0.png)


    Figure 9.15 – Resource quota definition


    Any violations on the thresholds are highlighted in the monitoring user experience
    as well as raised as alerts, if configured.


    Beyond just reporting on threshold breaches, Cloud Pak for Data includes an optional
    scheduling service [26] that can be used to *enforce* assigned resource quotas.
    The scheduling service is configured based on the choices made by the administrator
    per service.


    The scheduling service extends the default Kubernetes scheduler, and monitors
    all start up requests for Pods and Jobs. It uses the same labels that zen-watchdog
    also uses to identify the Pods and the service/products that the Pod belongs to.
    It then aggregates resource requests and limits across all Pods that are currently
    running for that service and decides whether to permit the startup. A Pod that
    would violate the defined resource quota threshold is prevented from even being
    started.'
  merge: -1
  img_proc: true
