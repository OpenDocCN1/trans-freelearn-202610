  md: '# Master Data Management


    Master data is at the heart of every business transaction, application, and decision.
    The IBM **Master Data Connect** service for IBM Cloud Pak for Data provides a
    RESTful API so that geographically distributed users can get fast, scalable, and
    concurrent access to your organization''s most trusted master data from IBM **InfoSphere
    Master Data Management** (**InfoSphere MDM**).


    InfoSphere MDM acts as a central repository to manage, store, and maintain master
    data across your organization. InfoSphere MDM provides the following:


    +   - A consolidated, central view of an organization''s key business facts

    +   - The ability to manage master data throughout its life cycle:


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_167_0.png)


    Figure 7.8 – Master Data Management cartridge


    InfoSphere MDM version 11.6.0.11 or above supports publishing to Master Data Connect
    using the IBM **MDM Publisher** capability. With MDM Publisher, you can complete
    one-time bulk loads of master data into Master Data Connect or set up ongoing
    data synchronization. When you configure Master Data Connect data subscriptions
    in the user interface, MDM Publisher creates, runs, and manages the resulting
    data load jobs.'
  merge: -1
  img_proc: true
