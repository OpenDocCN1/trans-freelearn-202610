- pgno: 207
  md: 'The following diagram provides a simplistic high-level outline of a Kubernetes
    cluster [10] to illustrate how it functions, just to set the context for how Cloud
    Pak for Data leverages it:


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_207_0.png)


    Figure 9.2 – Kubernetes architecture overview


    There are essentially two types of host nodes – the **Master** and **Compute**
    (worker) nodes. In some implementations, a node may have both the master and compute
    roles, but it is highly recommended to maintain separate masters to ensure a better
    class of reliability. Each node includes some fundamental components [11] such
    as the Kubelet daemon and functionality to interact with the container runtimes
    on each node. The master nodes include certain special components, such as the
    API server and the scheduler.


    Kubernetes uses the etcd database for storing configuration information and this
    database is critical for overall operations. etcd is a key-value distributed store
    and, for high availability, can work with multiple replicas on different hosts,
    establishing a quorum. It is recommended that you start with three master nodes
    and expand when it becomes necessary to support a larger set of applications at
    scale.'
  merge: -1
  img_proc: true
- pgno: 208
  md: 'The compute nodes are where application workloads are scheduled by Kubernetes
    to run. All Cloud Pak for Data Pods only run on the compute (worker) nodes. Kubernetes
    also includes the ability to schedule Pods in specific (dedicated) nodes as well,
    but in general, Pods can be randomly scheduled on any of the compute nodes. If
    a compute node, goes down, Pods could be rescheduled to run on a different node.
    Cloud Pak for Data services primarily leverage Kubernetes constructs such as Deployments
    [12] and StatefulSets [13] to schedule its microservices in Kubernetes. These
    "controllers" set up the right count of replicas for that microservice, identify
    what persistent volume storage to mount for the Pods, and declare requests for
    compute resources.


    # Understanding how storage is used


    Cloud Pak for Data requires the use of a dynamic storage provisioner [20] in Kubernetes
    to create persistent volumes on demand. The provisioner also abstracts the use
    of different storage technologies and solutions in the background and makes Cloud
    Pak for Data portable. For example, an `nfs-client` storage class could point
    to an IBM Spectrum Scale or Dell/EMC-powered NFS server, while the `ibmc-file-gold-gid`
    storage class may point to storage in the IBM Cloud.


    Hence, as part of the installation of Cloud Pak for Data, the user would provide
    storage classes as configuration parameters.


    The Cloud Pak for Data control plane introduces a special persistent volume claim
    called `user-home-pvc`. This is a shared, **Read-Write-Many** (accessMode: RWX)
    volume that is mounted by several Pod replicas to access the same content. This
    volume stores some configuration information, static user experience content,
    and some user-introduced customizations.


    In a typical Cloud Pak for Data installation, you can inspect your PVC as follows:


    ```

    kubectl get pvc user-home-pvc


    NAME              STATUS   VOLUME                     CAPACITY   ACCESS MODES   STORAGECLASS   AGE

    user-home-pvc     Bound    pvc-44e5a492-9921-41e1-bc42-b96a9a4dd3dc   10Gi       RWX            nfs-client     33d

    ```'
  merge: -1
  img_proc: true
- pgno: 209
  md: "Looking at one of the deployments (such as `zen-core`), you will notice how\
    \ the Deployment indicates where the volume should be mounted:\n\n```\n```yaml\n\
    kubectl get deployment zen-core -o yaml\n:\n  - name: user-home-mount\n    persistentVolumeClaim:\n\
    \      claimName: user-home-pvc\n:\nvolumeMounts:\n  - mountPath: /user-home\n\
    \    name: user-home-mount\n```\n```\n\nIn this example, you will notice that\
    \ `user-home-pvc` gets mounted as `/user-home` in the `zen-core` Pods.\n\nCloud\
    \ Pak for Data also uses StatefulSets, where each member replica is typically\
    \ associated with its own dedicated (non-shared) persistent volume. Here's an\
    \ example:\n\n```\n```shell\nkubectl get statefulsets\n```\n```\n\nThis identifies\
    \ a couple of StatefulSets present in the Cloud Pak for Data control plane:\n\n\
    | NAME | READY | AGE |\n|---|---|---|\n| dsx-influxdb | 1/1 | 33d |\n| zen-metastoredb\
    \ | 3/3 | 33d |\n\nEach StatefulSet spawns one or more member Pods:\n\n```\n```shell\n\
    kubectl get pods -lcomponent=zen-metastoredb\n```\n```\n\nThe preceding snippet\
    \ shows the *members* associated with that metastoredb StatefulSet. In this case,\
    \ there are three of them and they are numbered ordinally:\n\n| NAME | READY |\
    \ STATUS | RESTARTS | AGE |\n|---|---|---|---|---|\n| zen-metastoredb-0 | 1/1\
    \ | Running | 11 | 12d |\n| zen-metastoredb-1 | 1/1 | Running | 11 | 12d |\n|\
    \ zen-metastoredb-2 | 1/1 | Running | 10 | 12d |"
