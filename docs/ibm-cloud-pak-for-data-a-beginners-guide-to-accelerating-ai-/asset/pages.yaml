  md: '# Virtual Data Pipeline


    **Virtual Data Pipeline (VDP)** enables access to production-like data for data
    science, analytics, and testing purposes. Traditionally, businesses would take
    the time-consuming approach of making copies of production data for this purpose,
    with a higher exposure risk for sensitive data. With the VDP service in Cloud
    Pak for Data, we are now able to create a single storage-efficient, optionally
    masked gold copy of a physical data source. This can be further combined with
    other sources of data and virtualized using **CP4D** data virtualization capabilities:


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_162_0.png)


    Figure 7.4 – Virtual Data Pipeline


    VDP can be used for the following use cases:


    +   - Accelerating application testing and development time

    +   - Reducing storage costs

    +   - Providing a secure, self-service data provisioning solution for testing,
    development, and analytics'
  merge: -1
