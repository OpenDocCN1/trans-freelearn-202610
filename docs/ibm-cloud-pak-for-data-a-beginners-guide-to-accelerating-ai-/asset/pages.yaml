- pgno: 99
  md: '# Data integration at scale


    Based on *IDC reports*, it is estimated that data scientists spend 80% of their
    time preparing and managing data for building AI models. This, coupled with an
    IBM survey where 91% of organizations are not using their data effectively, means
    that businesses are struggling to deliver value from data silos. Data integration
    is a combination of technical and business processes that are used to combine
    data from disparate sources into meaningful and valuable information. This is
    a critical aspect of an organization''s overall information architecture strategy:


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_99_0.png)


    Figure 4.21 – Data integration, an enterprise challenge


    IBM''s DataStage service on IBM Cloud Pak for Data delivers a modernized data
    integration solution for cleansing and delivering trusted data anywhere, at any
    scale and complexity, on and across multi-cloud and hybrid cloud environments.
    There are many reasons for this major shift in how data integration tools are
    deployed and used with the rise of AI. The increase in volume and variety of data
    is one, but organizations are seeing a need to adopt a process-oriented approach
    to manage the data life cycle with DataOps, improve business performance, and
    increase competitiveness.


    # Considerations for selecting a data integration tool


    The following are some key considerations we should look at when selecting a data
    integration tool/service:


    +   - The ability to cater to a multi-cloud environment

    +   - Performance at scale

    +   - Integration with governance catalogs

    +   - A wide array of connectors that support traditional RDBMS sources and other
    non-traditional sources of data

    +   - The ability to track lineage

    +   - Integrated data quality'
  merge: -1
  img_proc: true
