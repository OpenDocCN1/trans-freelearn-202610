    health plan company that wanted to improve the efficiency of their health advocacy
    program. The goal was to identify members who are at risk and reduce the likelihood
    of members experiencing adverse events. They wanted to predict the likelihood
    of an **Emergency Room (ER)** visit in the next 9 months. Their challenge was
    to cater to the diverse data science teams with demands for different tools/technologies,
    as well as the support staff that maintain these tools/technologies. They also
    wanted to operationalize their ML models and scale them across all cohorts over
    the next year(s).


    With Cloud Pak for Data, they were able to catalog information assets, including
    external datasets, with the centralized governance catalog. They were able to
    establish a governance framework with individual assets assigned to stewards and
    access policies that had been defined using governance policies/rules. With access
    to trusted data, they were able to leverage the Watson Studio Jupyter notebooks
    to train their ML models and deploy them as Watson Machine Learning deployments.
    The deployed models were monitored on an ongoing basis for bias and model drift.'
