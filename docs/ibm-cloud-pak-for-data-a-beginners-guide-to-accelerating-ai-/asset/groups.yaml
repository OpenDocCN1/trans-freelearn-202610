    for enterprises to tap into their data, given it is now distributed across a wide
    number and variety of data stores within the organization:


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_61_0.png)


    Figure 3.2 – Different workloads require different data stores


    At the same time, business users are more sophisticated these days when it comes
    to creating and processing their own datasets, tapping into Excel and other desktop
    utilities to cater for their business requirements. Data warehouses and data lakes
    are unable to address the breadth and depth of the data landscape, and enterprises
    are beginning to look for more sophisticated solutions. To add to this challenge,
    we are beginning to see an explosion of smart devices in the market, which is
    bound to further disrupt the data architecture in industries such as manufacturing,
    distribution, healthcare, utilities, oil, gas, and many more. Enterprises must
    modernize and continue to reinvent to address these changing business conditions.


    Before we explore potential solutions and how Cloud Pak for Data is addressing
    these challenges, let''s review the typical enterprise data architecture and the
    inherent gaps that are yet to be addressed.


