    installation.


    # Alerting


    Kubernetes provides the concept of liveness probes and other primitives for it
    to recognize failing Pods and trigger automatic restarts. However, with complicated
    services, it may not be that simple to recognize failures that span multiple deployments
    or StatefulSets, nor would it be able to recognize any application-level semantics.
    To complement OpenShift''s capabilities, Cloud Pak for Data introduces additional
    monitors, mechanisms to persistent events, and surface issues in the user experience.


    The control plane includes a framework [27], powered by zen-watchdog, to monitor
    for events, recognize serious situations, and raise those problems as alerts.
    These alert messages are frequently sent as SNMP traps to configured Enterprise
    SNMP receivers.


    The following diagram provides a high-level view of how the zen-watchdog service
    enables monitoring, the aggregation of events, and the raising of alerts:


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_220_0.png)


    Figure 9.7 – Monitoring events and alert forwarding'
  - "[PAGE 221]\n\nDifferent targets can be configured to send alerts to, including\
    \ via the SNMP protocol, or simply as SMTP emails as well as via HTTP.\n\nCloud\
    \ Pak for Data's control plane itself includes a few generic out-of-the-box monitors,\
    \ such as the following:\n\n+   - **check-pvc-status**: Records a critical event\
    \ if a PVC is unbound\n+   - **check-replica-status**: Records a critical event\
    \ if a StatefulSet or Deployment has unavailable replicas\n+   - **check-resource-status**:\
    \ Records a warning event if a service has reached the threshold and a critical\
    \ event if it has exceeded the quota\n\nDevelopers can introduce extensions to\
    \ support custom monitoring needs as well. The documentation [28], using sample\
    \ code, describes the procedure of introducing a custom container image to provide\
    \ specialized monitoring functions and identify critical problems that merit an\
    \ alert.\n\n# Provisioning and managing service instances\n\nMany services in\
    \ Cloud Pak for Data support the concept of \"service instances,\" provisioned\
    \ from the service catalog. These are individual copies of services that can be\
    \ scaled out and configured independently, or often used to provide access to\
    \ a selected group of users.\n\nA service instance has the following characteristics:\n\
    \n+   - It represents Kubernetes workloads that are metered individually – usually\
    \ provisioned in the same namespace as the control plane – but some services can\
    \ also be provisioned in a \"data plane\" sidecar namespace that is *tethered*\
    \ (from a management perspective) to the control plane namespace.\n+   - It is\
    \ provisioned by authorized end users with *Create service instances* permission\
    \ via a provisioning experience and API:\n+   \n+     End users provision instances\
    \ without needing to have Kubernetes access or an in-depth understanding of Kubernetes\
    \ primitives.\n+   - It supports RBAC, in other words, users can be granted granular\
    \ roles to access that resource.\n+   - It enables secure programmatic client\
    \ access, with instance-scoped API keys and service tokens."
