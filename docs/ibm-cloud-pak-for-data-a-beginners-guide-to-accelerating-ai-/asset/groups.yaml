    This model is sometimes referred to as a *stretched* cluster due to the assumption
    that there is just one cluster, even though some Nodes may be located in different
    physical "zones."


    The key here is to ensure that the storage blocks are replicated across zones
    in a near-real-time fashion. With this kind of deployment, stateful Pods would
    always have access to their PVs, regardless of which zone they are physically
    located in. The failure of one storage node/replica should not cause the entire
    application to fail. This is because other storage replicas should be able to
    serve the necessary blocks of data. The storage drivers in Kubernetes that support
    this notion of continuous availability completely abstract (via PVCs) where the
    data is physically picked up from, and they can fail over automatically to use
    storage from a different replica.


    From a load balancing perspective, we typically consider that all compute Pods
    are always active and available for use, irrespective of the zone they are located
    in. Even if an entire zone becomes unavailable, only the compute and storage replicas
    become inaccessible, which means other replicas can take up the slack.


    Such storage drivers are typically also configured to be aware of the cluster
    topology [18], for example, by the use of Kubernetes node labels to designate
    failure zones. This enables them to place PV replicas in different zones and thus
    offer resiliency in the case of the loss of one zone. A common problem with such
    a replication model is the "split brain" effect, where storage replicas have inconsistent
    data blocks because of failure situations where different Nodes don''t communicate
    and synchronize data. Hence, such storage drivers have the sophistication to cordon
    off storage under these conditions, as well as identify when a replica has been
    offline for too long and needs to be updated to "catch up" or copy over data blocks
    when new storage replicas are added. This is critical to ensure that application
    data is always kept consistent in all its replicas.


    While having a low latency network between such zones is critical, this multi-zone
    replication technique also requires such sophistication from the storage technology
    being used. For example, Red Hat OpenShift Container Storage (Ceph) and Portworx
    Enterprise support such requirements, as do most public cloud IaaS storage providers.


    Continuous storage availability is technically possible with off-cluster storage
    as well, though it takes a bit more effort to align the storage zones with the
    Kubernetes cluster zones. External storage managers such as IBM Spectrum Scale,
    Dell EMC Isilon, NetApp onTap, and NAS-based solutions have traditionally provided
    mechanisms for synchronous replication across zones.


    Snapshots are commonly stored in the same devices, which means they are only as
    reliable as the devices themselves. Hence, storage vendors [20] also provide mechanisms
    for creating such snapshots for cloud storage, such as S3 object stores.


    - **Via a copy of the available volume data:** This approach relies on rsync or
    a copy of some data from PVCs being sent to another PVC (typically, a remote storage
    volume) or an object store. The `cpd-cli backup-and-restore` utility has a Kubernetes
    service that allows us to copy data from PVs to the backup volume.


    However, this technique requires all the services in that Kubernetes namespace
    to be put into "maintenance mode" (or fully quiesced) to prevent any I/O from
    occurring while the volume data is being copied. The advantage though is that
    this works for any kind of storage that''s used, including NFS, for the PVs and
    does not require anything specific from the storage system.


    ### Quiescing Cloud Pak for Data services


    For application-level consistency, writes must be paused while backups are in
    progress. To support such a requirement, the `cpd-cli` utility includes a `backup-restore
    quiesce` command that tells services to temporarily put themselves into maintenance
    mode. This utility also scales down some of the Deployments to prevent any I/O
    activity. Once the backup is complete, the `backup-restore unquiesce` command
    is used to scale up services from maintenance. Note that while such a **quiesce**
    implies that Cloud Pak for Data is unavailable for that duration - that is, under
    maintenance mode – being able to achieve application-consistent backups is also
    important.


    The **quiesce** mechanism can also be leveraged for external storage backups or
    snapshots, such as when NFS is used for PVs. For example, when IBM Spectrum Scale
    provides NFS volumes, you could quiesce the services in the Cloud Pak for Data
    namespace, then trigger a GPFS snapshot and unquiesce the services.


    ### Db2 database backups and HADR


    Ensuring that databases operate in a reliable and continuous manner is often critical
    to an enterprise. While write suspends/quiesce is supported, Db2 provides additional
    techniques that allow Db2 databases to be available online [22] for use, even
    when backup operations are in progress. This is also independent of the storage
    technology chosen and it can support incremental backups.


    The Db2 High Availability Disaster Recovery (HADR) configuration [23] pairs two
    Db2 database instances that could exist in either the same cluster (say, a different
    Kubernetes namespace) or even a remote cluster. In this configuration, data is
    replicated from the active source database to a standby target. There is an automatic
    failover to the standby when a site-wide failure occurs or when the active Db2
    database is deemed unreachable. The Db2 HADR Automatic Client Reroute (ACR) feature
    is a mechanism where clients connecting to the failed Db2 database seamlessly
    get switched over to the new active Db2 database.


    ### Kubernetes cluster backup and restore


    The snapshot mechanisms and the `cpd-cli backup-and-restore` utility described
    previously can only copy data from PVCs and restore it in new PVCs. When restoring
    such a backup in a new cluster, the expectation is that the target cluster is
    set up in the same way the original cluster was. This means that the necessary
    Cloud Pak for Data services must be installed in the target cluster, and that
    all the Kubernetes resources are present before the data restoration process takes
    place.


    The Velero project [24] introduced a mechanism for backing up all Kubernetes resource
    artifacts as well. This allows the target cluster to be reconstructed with ease
    before data restoration occurs. The OpenShift API for Data Protection Operators
    [25], which was introduced by Red Hat for OpenShift clusters, combined with Ceph-CSI
    drivers, provides a way to better operationalize cluster-level backup and restore.
    It also supports additional use cases, such as to duplicate or migrate clusters.


    ### Summary


    In this chapter, we introduced the concept of PVs in Kubernetes and how Cloud
    Pak for Data works with different storage technologies and vendors. We also discussed
    storage topologies and vendors or technologies that may exist in different enterprises.


    This chapter also stressed the importance of data protection and the operationalization
    of backup and restore, as well as DR practices. Ensuring that you have a deep
    understanding of storage ensures that Cloud Pak for Data services and the enterprise
    solutions that are built on top of them operate with both resiliency and the desired
    level of performance.


    ## 12 Multi-Tenancy


    Multi-tenancy is a software architecture design where multiple users or organizations
    share the same instance of the software and its underlying resources. This is
    a standard practice with **Software-as-a-Service (SaaS)** offerings, such as Cloud
    Pak for Data as a service in the IBM Cloud, but the interpretation of tenancy
    and how this tenancy is implemented can vary widely on-premises or in private
    clouds. **Security** and **compliance** requirements in the enterprise, as well
    as the *quality of service assurances*, play a significant role in deciding how
    much can be shared.


    Nowadays, it is a fundamental expectation that any true cloud-native platform
    stack enables at least some level of multi-tenant sharing out of the box. Supporting
    a new project or initiative can be accelerated just by reusing the existing shared
    infrastructure. Trivially, you could assume assigning independent **virtual machines
    (VMs)** to each tenant would be sufficient to achieve multi-tenancy – after all,
    the underlying bare metal resources are indeed being shared. But it is not cost-effective
    to provide dedicated clusters of VMs to every department in an enterprise; the
    operational maturity needed to manage multiple clusters or installations of software
    alone would become prohibitively expensive.


    Most enterprises, whether they operate in a hosted public cloud infrastructure
    or on-premises, prefer some level of sharing between tenants with assurances of
    consistent performance, security, and **privacy**. It is no longer considered
    adequate just to assign VMs to tenants and, with the advent of containerization
    techniques, more granularity is now possible with multiple tenants even sharing
    the same VM. This also makes security problems more complex since even the operating
    system gets shared, with processes from different tenants running side by side.

