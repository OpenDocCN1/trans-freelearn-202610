    现在我们已经介绍了使用数据并训练模型以帮助预测目标变量的步骤，接下来将带您了解 Jupyter Notebook 界面的加速器。


    ## Jupyter Notebook 界面的加速器


    虽然 Jupyter Notebook 是开源软件，但 Cloud Pak for Data 通过添加企业级功能（如 Git 集成）以及加速器（如目录中资产的代码生成）增强了使用
    Jupyter Notebook 界面的体验。


    在配置部署时，我们不仅可以将部署定义为在线或批量模型部署，还可以灵活地指定实际部署的硬件规格。模型部署后，开发人员可以使用多种语言的软件开发工具包（SDK）对模型进行评分并使其投入运营。UI
