    - 3. 一旦发现数据资产，我们必须审查以下内容：\n  - 分析结果\n  - 数据质量分析\n  - 数据分类\n  - 术语分配\n- 4. 然后，我们将查看数据质量项目，并查看数据质量分析过程的详细信息：\n\
    \n"
