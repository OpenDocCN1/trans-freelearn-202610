  - '[PAGE 286]


    This model is sometimes referred to as a *stretched* cluster due to the assumption
    is that there is just one cluster, even though some Nodes may be located in different
    physical "zones."


    The key here is to ensure that the storage blocks are replicated across zones
    in a near-real-time fashion. With this kind of deployment, stateful Pods would
    always have access to their PVs, regardless of which zone they are physically
    located in. The failure of one storage node/replica should not cause the entire
    application to fail. This is because other storage replicas should be able to
    serve the necessary blocks of data. The storage drivers in Kubernetes that support
    this notion of continuous availability completely abstract (via PVCs) where the
    data is physically picked up from, and they can fail over automatically to use
    storage from a different replica.


    From a load balancing perspective, we typically consider that all compute Pods
    are always active and available for use, irrespective of the zone they are located
    in. Even if an entire zone becomes unavailable, only the compute and storage replicas
    become inaccessible, which means other replicas can take up the slack.


    Such storage drivers are typically also configured to be aware of the cluster
    topology [18], for example, by the use of Kubernetes node labels to designate
    failure zones. This enables them to place PV replicas in different zones and thus
    offer resiliency in the case of the loss of one zone. A common problem with such
    a replication model is the "split brain" effect, where storage replicas have inconsistent
    data blocks because of failure situations where different Nodes don''t communicate
    and synchronize data. Hence, such storage drivers have the sophistication to cordon
    off storage under these conditions, as well as identify when a replica has been
    offline for too long and needs to be updated to "catch up" or copy over data blocks
    when new storage replicas are added. This is critical to ensure that application
    data is always kept consistent in all its replicas.


    While having a low latency network between such zones is critical, this multi-zone
    replication technique also requires such sophistication from the storage technology
    being used. For example, Red Hat OpenShift Container Storage (Ceph) and Portworx
    Enterprise support such requirements, as do most public cloud IaaS storage providers.


    Continuous storage availability is technically possible with off-cluster storage
    as well, though it takes a bit more effort to align the storage zones with the
    Kubernetes cluster zones. External storage managers such as IBM Spectrum Scale,
    Dell EMC Isilon, NetApp onTap, and NAS-based solutions have traditionally provided
    mechanisms for synchronous replication across zones.'
