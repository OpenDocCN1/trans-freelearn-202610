    \ decides to define their own sub-tenants to grant access to.\n\nThe primary tenant\
    \ admin typically does the following:\n\n- Creates a Cloud Pak for Data user group\
    \ for each sub-tenant. Users and LDAP groups can be mapped in to uniquely identify\
    \ each sub-tenant user.\n- Assigns the appropriate platform roles – perhaps only\
    \ giving the authority to create projects and catalogs.\n- Provisions instances\
    \ of services such as databases and grants access rights to individual sub-tenant\
    \ groups – and even delegates ownership/administration to individual tenant users.\n\
