    \ privileged actions, there are typically additional regulatory requirements with\
    \ regards to tracking access of data by users and applications. In the following\
    \ section, we will see how that too can be implemented.\n\n## Integration with\
    \ IBM Security Guardium\n\nGuardium provides the ability to monitor data access\
    \ and to ensure data security. IBM Security Guardium's **Database Activity Monitoring\
    \ (DAM)** capability offers an advanced centralized audit repository, reporting\
    \ mechanisms, as well as tools to support forensics and compliance audits. These\
    \ capabilities are complementary to the system-level auditing and privileged action\
    \ audit recording described in previous sections as they can expand to data protection\
    \ as well.\n\nCloud Pak for Data enables integration with Guardium in two ways:\n\
    \n- **Auditing sensitive data access**: Cloud Pak for Data users with the Manage\
    \ Catalog permissions have the authority to identify sensitive data, such as **Personally\
    \ identifiable information (PII)**, and configure it to be monitored by Guardium\
    \ [39]. Since Cloud Pak for Data's Watson Knowledge Catalog service can also scan\
    \ and tag sensitive data, it makes it easier for authorized users to enable those\
    \ data assets to be monitored by Guardium.\n- Cloud Pak for Data facilitates the\
    \ provisioning of databases as well. It is critical for regulatory compliance\
    \ that access to such data also be monitored. This is facilitated by a service\
    \ called the Guardium *E-STAP* [40] service that is provisioned on top of Cloud\
    \ Pak for Data and configured to intercept traffic to DB2 databases. All access\
    \ to the DB2 database is then only conducted through the E-STAP interface. This\
    \ service is configured to work with the Guardium appliance, which enables access\
    \ logging and reporting, and access policy enforcement.\n\nGuardium is an established\
    \ and mature offering in the data protection and compliance segment. Many enterprises\
    \ already leverage Guardium to automate compliance controls in a centralized fashion\
    \ and the ability to integrate with Guardium enables Cloud Pak for Data customers\
    \ to accelerate compliance readiness efforts with regard to their own data, complementing\
    \ what is offered by the Cloud Pak for Data platform and operating environment.\n\
    \nIn this section, we explored what techniques are available for the enterprise\
    \ to get ready for regulatory compliance. In general, Cloud Pak for Data provides\
    \ elegant mechanisms for RBAC and for the enterprise to be able to configure or\
    \ change out-of-the-box roles to support any regulatory compliance, such as separation\
    \ of duties.\n\nCompliance requirements vary quite a bit depending on the industry\
    \ the customer is in, as well as geographical requirements. In the preceding section,\
    \ we also identified the need to appropriately configure all elements of the stack,\
    \ including OpenShift Container Platform and its host nodes, as well as Cloud\
    \ Pak for Data itself for privileged action auditing, and other integration options,\
    \ such as Guardium to support data access monitoring.\n\n## Summary\n\nIn this\
    \ chapter, we discussed how Cloud Pak for Data is developed and the IBM secure\
    \ engineering practices that are employed. We also looked at how container images\
    \ are delivered from trusted locations for customers to pull from or download.\n\
    \nOnce Cloud Pak for Data is installed, care must be taken to ensure that it is\
    \ operated in a secure manner. We looked at constructs with which RHEL and OpenShift\
    \ provide a secure foundation for workloads and the security posture of Cloud\
    \ Pak for Data on OpenShift Container Platform.\n\nWe also looked at how administrators\
    \ are tasked with the responsibility of managing user and group access to ensure\
    \ authorization is enforced in addition to configuring appropriate identity managers\
    \ for authentication, as well as defining appropriate roles or modifying out-of-the-box\
    \ user roles.\n\nSecurity is critical to any software installation and Cloud Pak\
    \ for Data is no exception. This chapter, in addition to describing the technology,\
    \ also provided pointers to practical mechanisms to secure and monitor each part\
    \ of the stack to ensure the safe and reliable operation of Cloud Pak for Data\
    \ in your enterprise.\n\nIn the next chapter, we will look at storage, yet another\
    \ foundational and critical construct for the reliable operation of Cloud Pak\
    \ for Data.\n\n## References\n\n- 1. Cloud Pak for Data Security Whitepaper: https://community.ibm.com/community/user/cloudpakfordata/viewdocument/security-white-paper-for-cloud-pak?CommunityKey=c0c16ff2-10ef-4b50-ae4c-57d769937235&tab=librarydocuments\n\
    - 2. Redbook: [Security in Development: The IBM Secure Engineering Framework](https://www.redbooks.ibm.com/redpapers/pdfs/redp4641.pdf)\n\
    - 3. IBM PSIRT: [IBM Security and Vulnerability management](https://www.ibm.com/trust/security-psirt)\n"
  mdcn: "\n\n> **注意**\n> \n> 在 Cloud Pak for Data v3.5 版本中，部分服务的实例 API 密钥不可用。\n\n\
    Cloud Pak for Data 提供了用户界面和 API [28] 来生成、重新生成或删除平台 API 密钥或实例 API 密钥。\n\n## Secrets\
    \ API 与 Vault 的使用\n\nCloud Pak for Data 中的 Secrets API [29] 提供了从配置的 Vault 中访问敏感凭据的能力。这有助于避免在开发者编写的内容（如笔记本或脚本）中使用明文凭据。通过使用\
    \ Vault，企业还可以控制策略以独立轮换密钥和凭据。\n\n由于 Cloud Pak for Data 的 Secrets API 仅在需要时检索 Vault\
    \ 的内容，因此它会获取最新的密码或密钥。这也避免了用户需要在多处更新密码的需求。\n\nCloud Pak for Data 将继续在其路线图中引入与不同\
    \ Vault 厂商和技术的集成。\n\n## 满足合规要求\n\n监管合规和企业政策要求对系统进行严格监控，以确保其未被破坏。通常需要遵守多个标准以及不同的审计技术。Red\
    \ Hat 和 IBM Cloud Pak for Data 提供了工具和机制，供安全架构师根据其组织的政策设计和配置系统，以及审计使用情况。\n\n在本节中，我们将简要了解有助于企业规划合规性的功能。\n\
    \n## 为合规配置运行环境\n\n对于 Cloud Pak for Data，Red Hat 的用于主机的 Enterprise Linux 和 OpenShift\
    \ Container Platform 代表了技术基础。因此，为了确保合规，基础需要正确配置。技术栈中帮助实现合规就绪的几个关键方面如下所述：\n\n-\
    \ RHEL 支持强大的安全和合规态势，例如设置 **联邦信息处理标准 (FIPS)** 出版物 140-2。存在多种先进技术来保护 RHEL 主机 [30]，包括工具、扫描器和最佳实践指导。\n\
    - OpenShift Container Platform v4 引入了合规性操作员 [31]，以帮助确保合规并检测与基于 RHEL CoreOS 的主机相关的差距。**国家标准与技术研究所\
    \ (NIST)** 组织在其他方面也提供了实用程序和指导，用于企业严格遵守的稳健合规实践。OpenShift 合规性操作员提供了适当级别的自动化，帮助企业利用\
    \ NIST OpenSCAP 实用程序，例如在这种复杂、动态环境中进行策略扫描和执行。\n\n集群管理员通常负责确保集群设置适当以满足合规标准。也很重要的是要对集群中的特权操作进行充分监控，无论是在基础设施还是更高级别，例如\
    \ Cloud Pak for Data。下一节确定了为确保所有特权活动得到报告而需要进行的额外配置。\n\n## 审计\n\n审计为企业提供了证明合规性和监控异常的方法。\n\
    \n审计可以在栈的各个级别启用：\n\n- 在操作系统级别 [32]，RHEL 提供了机制让企业监控任何安全策略的违规情况。审计系统记录对该主机上任何敏感或关键文件访问的访问监视。\n\
    - 在 OpenShift Container Platform 级别 [33]，管理员可以配置审计级别以记录所有用户或其他服务对 Kubernetes API\
    \ 服务器的所有请求。\n- 在 Cloud Pak for Data 级别，审计日志支持生成、收集和转发符合 **Cloud Auditing Data\
    \ Federation (CADF)** [34] 的审计记录，用于核心平台可审计事件。\n\n您可以配置 IBM Cloud Pak for Data\
    \ 审计日志将审计记录转发到您的 **安全信息和事件管理 (SIEM)** 解决方案，例如 **Splunk**、**LogDNA** 或 **QRadar**。\n\
    \n审计日志实现使用 Fluentd 输出插件 [35] 来转发和导出审计记录。在您安装 IBM Cloud Pak for Data 后，审计日志服务默认未配置。外部\
    \ SIEM 配置 [36] 可以添加到 `zen-audit-config` Kubernetes configmap 中，以定义审计日志服务转发所有收集的审计记录的位置。\n\
    \n虽然审计日志通常仅涵盖特定的特权操作，但通常还有关于跟踪用户和应用程序访问数据的额外监管要求。在下一节中，我们将看到如何实现这一点。\n\n## 与 IBM\
    \ Security Guardium 的集成\n\nGuardium 提供了监控数据访问并确保数据安全的能力。IBM Security Guardium\
    \ 的 **数据库活动监控 (DAM)** 功能提供了一个先进的集中式审计存储库、报告机制以及支持取证和合规审计的工具。这些功能与前面章节中描述的系统级审计和特权操作审计记录互补，因为它们也可以扩展到数据保护。\n\
    \nCloud Pak for Data 以两种方式支持与 Guardium 的集成：\n\n- **审计敏感数据访问**：拥有管理目录权限的 Cloud\
    \ Pak for Data 用户有权识别敏感数据，例如 **个人身份信息 (PII)**，并将其配置为由 Guardium 监控 [39]。由于 Cloud\
    \ Pak for Data 的 Watson Knowledge Catalog 服务也可以扫描和标记敏感数据，因此它使授权用户更容易启用这些数据资产由\
    \ Guardium 监控。\n- Cloud Pak for Data 还促进数据库的配置。对于监管合规而言，监控此类数据的访问至关重要。这通过名为 Guardium\
    \ *E-STAP* [40] 的服务来实现，该服务在 Cloud Pak for Data 之上配置并拦截对 DB2 数据库的流量。之后对 DB2 数据库的所有访问都只能通过\
    \ E-STAP 接口进行。该服务配置为与 Guardium 设备配合使用，从而实现访问日志记录和报告，以及访问策略执行。\n\nGuardium 是数据保护和合规领域中成熟且完善的解决方案。许多企业已经利用\
    \ Guardium 以集中方式自动化合规控制，而与 Guardium 的集成使 Cloud Pak for Data 客户能够加速其自身数据的合规就绪工作，补充了\
    \ Cloud Pak for Data 平台和运行环境提供的功能。\n\n在本节中，我们探讨了企业为满足监管合规要求可用的技术。总的来说，Cloud Pak\
    \ for Data 提供了优雅的 RBAC 机制，并使企业能够配置或更改开箱即用的角色以支持任何监管合规，例如职责分离。\n\n合规要求因客户所在的行业以及地理要求而有很大差异。在前一节中，我们还确定了需要适当配置栈中所有元素的必要性，包括\
    \ OpenShift Container Platform 及其主机节点，以及 Cloud Pak for Data 本身用于特权操作审计，以及其他集成选项，例如\
    \ Guardium 以支持数据访问监控。\n\n## 总结\n\n在本章中，我们讨论了 Cloud Pak for Data 的开发方式以及所采用的 IBM\
    \ 安全工程实践。我们还查看了容器镜像如何从受信任的位置交付，供客户拉取或下载。\n\n一旦 Cloud Pak for Data 安装完成，必须注意确保其以安全的方式运行。我们查看了\
    \ RHEL 和 OpenShift 提供的构建，这些构建为工作负载提供了安全基础以及 Cloud Pak for Data 在 OpenShift Container\
    \ Platform 上的安全态势。\n\n我们还查看了管理员如何负责管理用户和组访问以确保授权得到执行，同时配置适当的身份管理器用于身份验证，以及定义适当的角色或修改开箱即用的用户角色。\n\
    \n安全对于任何软件安装都至关重要，Cloud Pak for Data 也不例外。本章除了描述技术外，还提供了指向实用机制的指针，以保护和监控栈的每个部分，确保\
    \ Cloud Pak for Data 在您企业中的安全可靠运行。\n\n在下一章中，我们将查看存储，这是 Cloud Pak for Data 可靠运行的另一个基础且关键的构建。\n\
    \n## 参考文献\n\n- 1. Cloud Pak for Data 安全白皮书：https://community.ibm.com/community/user/cloudpakfordata/viewdocument/security-white-paper-for-cloud-pak?CommunityKey=c0c16ff2-10ef-4b50-ae4c-57d769937235&tab=librarydocuments\n\
    - 2. Redbook: [Security in Development: The IBM Secure Engineering Framework](https://www.redbooks.ibm.com/redpapers/pdfs/redp4641.pdf)\n\
    - 3. IBM PSIRT: [IBM Security and Vulnerability management](https://www.ibm.com/trust/security-psirt)\n\
    \n"
