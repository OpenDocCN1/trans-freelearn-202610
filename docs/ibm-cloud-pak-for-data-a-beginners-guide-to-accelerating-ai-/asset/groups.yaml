    | 5 | MySQL（MariaDB） | 最初由 Sun Microsystems 开发，现为 Oracle 的一部分，包括免费的社区版和受支持商业版。MariaDB
    是基于开源 MySQL 构建的商业数据库。 |

    | 6 | Microsoft Access | 一种将关系型 Microsoft Jet 数据库引擎与图形用户界面相结合的 DBMS。 |

    | 7 | SQLite | SQLite 是一个包含在 C 库中的关系型数据库管理系统。 |

    | 8 | Amazon RDS | 一种经济高效的云关系数据库，兼容包括 PostgreSQL 和 Amazon Aurora 在内的六种数据库引擎。 |

    | 9 | PostgreSQL（Enterprise DB） | EnterpriseDB 帮助客户在基于开源 PostgreSQL 构建的安全丰富、企业级数据库上开发和运行应用程序。
    |


