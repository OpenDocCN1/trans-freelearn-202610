    # Key use cases


    The following are some of the key use cases of Cloud Pak for Data:


    +   - **AI life cycle:** Data science teams are looking for integrated systems
    to manage assets across the AI lifecycle, while enterprise **Chief Data Officers
    (CDOs)** want to ensure the governance of AI models and datasets associated with
    them. Cloud Pak for Data enables the end-to-end AI lifecycle all the way from
    data preparation to building and deploying models, to managing them at scale,
    all the while ensuring the governance of data and AI models. Enterprises can realize
    an integrated experience, automation, and the benefits of AI governance including
    bias detection, explainability, model fairness, and drift detection:


    | “AI Ladder” Themes | *Organize*<br><br>*Analyze* |

    |---|---|

    | “Cloud Pak for Data” services | *Watson Knowledge Catalog*<br><br>*Watson Studio*<br><br>*Watson
    Machine Learning*<br><br>*Watson OpenScale* |


    Figure 2.2 – AI lifecycle


    +   - **Data modernization:** Enterprises are grappling with the proliferation
    of data, with data distributed across multiple silos, databases, and clouds. Cloud
    Pak for Data addresses this through governed data virtualization enabling self-service
    access to data in real time. It also includes a comprehensive set of capabilities
    to discover, prep, transform, govern, catalog, and access data at scale across
    all enterprise data sources.


    | “AI Ladder” Themes | *Collect*<br><br>*Organize* |

    |---|---|

    | “Cloud Pak for Data” services | *Watson Knowledge Catalog*<br><br>*Data Virtualization*<br><br>*Big
    SQL (optional)*<br><br>*Data Stores – Db2, MongoDB, PostgreSQL (Optional)* |


    Figure 2.3 – Data modernization'
