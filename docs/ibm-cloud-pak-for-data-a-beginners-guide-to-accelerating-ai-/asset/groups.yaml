    +   2. Redbook: [ Security in Development: The IBM Secure Engineering Framework:
    [https://www.redbooks.ibm.com/redpapers/pdfs/redp4641.pdf]

    +   3. IBM PSIRT: [ IBM Security and Vulnerability management]: https://www.ibm.com/trust/security-psirt'
