    combination of roles, then these users will be added to a group that is assigned
    the role combination. If a member of the group leaves the company, that user will
    be removed from the group.


    Note that entire LDAP or Active Directory groups can also be assigned (mapped)
    to such Cloud Pak for Data user groups. This enables an enterprise to continue
    to leverage its existing organizational grouping, without needing to authorize
    every individual user one at a time.


    By default, Cloud Pak for Data includes the **All-users** group. As the name suggests,
    all Cloud Pak for Data users are automatically included in this group. The group
    is used to give all platform users access to assets such as with **Connections**.


    The user experience [27], shown in the following figure, enables the creation
    of such user groups and the assigning of roles to such groups:


    ### New user group


    Form groups of users to widely administer permissions.


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_262_0.png)


    Figure 10.12 – Defining a new user group


    To introduce members to such a user group, the Administrator also has the option
    to browse through any configured identity providers (such as LDAP) to identify
    individuals to add as well as map in existing LDAP groups. This provides quite
    a bit of flexibility as the Administrator is not limited by a fixed organizational
    structure in their Enterprise LDAP (say, as decided by HR) and can also, in ad
    hoc terms, enable sets of users even from different LDAP groups to collaborate.


    The following figure illustrates how the experience enables browsing for existing
    LDAP groups to introduce as members of the Cloud Pak for Data user group.


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_263_0.png)


    Figure 10.13 – Selecting existing LDAP groups to be assigned to a new User Group


    As shown in the preceding figure, the experience enables the selection of existing
    fully qualified LDAP groups as members of the new Cloud Pak for Data User Group.


    Once at least one individual user or LDAP group has been selected, the Administrator
    has the option to pick one or more roles to assign to this new User Group, as
    shown in the following figure:


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_264_0.png)


    Figure 10.14 – Defining a new user group


    In the preceding figure, you will notice that the **Data Steward** role has been
    assigned to the **Reviewers User Group**. This indicates that all members of this
    group will automatically be identified as data stewards and inherit the permissions
    that come with that role. The Administrator can also choose to change this role
    assignment at any time or introduce additional roles to this user group.


    Note that the membership of a User Group and, by extension, the roles assigned
    to an individual, are *dynamic* when LDAP groups are used. This means that when
    a user is removed from an LDAP group or assigned to a different group, their subsequent
    sign-in will automatically ensure that their permissions reflect their current
    membership. An individual user may also be assigned to multiple User Groups, which
    means that their permissions represent a union of those inherited from their membership
    in all these groups.


    In this section, we walked through how users and user groups are managed, and
    how Cloud Pak for Data integrates with enterprise authentication mechanisms, such
    as LDAP. Only after such a user is authenticated will they be able to access services
    or privileged resources in Cloud Pak for Data. In addition, there are also authorization
    checks. For example, users or user groups need to be granted at least a viewer
    role in resources such as projects or catalogs before being able to access them.
    Such users or groups could similarly be granted access to the Data Virtualization
    Service (DVS) instance as a DV Engineer or perhaps just as a Database user to
    an instance of a DB2 database. In summary, the User Management service supports
    a broad range of security requirements as it enables both authentication and flexible
    RBAC in the platform as well as authorization mechanisms scoped to individual
    resources or service instances.


    ## Securing credentials


    Cloud Pak for Data is a platform that provides several capabilities and services.
    It is expected that users and applications may need to connect from outside the
    cluster to specific API endpoints in a Cloud Pak for Data instance. Developers
    may also need to connect to external systems, such as databases and data lakes,
    as part of their day-to-day activities, for example, programmatically from notebooks
    or as part of Apache Spark Jobs. Such code is typically shared with other users,
    possibly even committed to source code repositories and, as such, it would not
    be prudent to have passwords and other sensitive content.


    In this section, we will look at features in Cloud Pak for Data that provide the
    ability for such developers to avoid exposing their credentials in plain text.


    ### API keys


    Developers who invoke Cloud Pak for Data APIs from client programs can use API
    keys to avoid the need to persist their credentials within those clients.


    Cloud Pak for Data v3.5 and later supports API keys for authentication and authorization.
    This allows client programs to authenticate to the Cloud Pak for Data platform
    or to a specific instance of a service.


    Each user can generate a platform API key, which is of a broader scope and allows
    access to all services on the platform.


    An instance API key is a particular service, and thus is only usable for that
    specific scope. The platform API key enables client scripts and applications to
    access everything that they would typically be able to access when they directly
    log in to the Cloud Pak for Data web client. An instance API key enables access
    only to the specific instance from which is it generated.

