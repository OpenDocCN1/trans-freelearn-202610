    \ IBM Cloud Databases for Elasticsearch makes Elasticsearch even better by managing\
    \ everything for you."
  - '[PAGE 153]


    c) **EDB** is a PostgreSQL-based database engine optimized for performance, developer
    productivity, and compatibility with Oracle. IBM Cloud Databases for EDB is a
    fully managed offering with 24/7 operations and support.


    d) **MongoDB** is a JSON document store with a rich query and aggregation framework.
    IBM Cloud Databases for MongoDB makes MongoDB even better by managing everything
    for you.


    e) **PostgreSQL** is a powerful, open source object-relational database that is
    highly customizable. It''s a feature-rich enterprise database with JSON support,
    giving you the best of both the SQL and NoSQL worlds. IBM Cloud Databases for
    PostgreSQL makes PostgreSQL even better by managing everything for you.


    # Packaging and pricing


    Cloud Pak for Data as a Service is offered as a subscription wherein customers
    pay for what they use and no more. Also, subscription credits can be used for
    any of the data and AI services that make up Cloud Pak for Data. This affords
    a lot of flexibility to customers as they can provision and use all the in-scope
    services. Each of these individual services is priced competitively to reflect
    the value they offer and include infrastructure costs such as compute, memory,
    storage, and networking.


    Also, IBM has an attractive initiative called HSA to incentivize existing on-premises
    customers to modernize to Cloud Pak for Data as a Service. The value in this initiative
    is that existing software customers will receive a significant discount on Cloud
    Pak for Data as a Service to account for the value of the software that they have
    already paid for. This, of course, assumes that customers will stop using other
    software and instead move to Cloud Pak for Data as a Service.


    # IBM Cloud Satellite


    IBM Cloud Satellite is an extension of IBM Cloud that can run within a client''s
    data center, on an edge server, or on any cloud infrastructure. IBM has been porting
    all its cloud services to Kubernetes, enabling the different services to function
    consistently. IBM Cloud Satellite extends and leverages the same underlying concept,
    running on Red Hat OpenShift as its Kubernetes management environment.'
  - '[PAGE 154]


    To be more precise, every Cloud Satellite location is an instance of IBM Cloud
    running on local hardware or any third-party public cloud (such as AWS or Azure).
    Furthermore, each Cloud Satellite location is connected to the IBM Cloud control
    plane. This connection back to the IBM Cloud control plane provides audit, packet
    capture, and visibility to the security team, and a global view of applications
    and services across all satellite locations. IBM Cloud Satellite Link connects
    IBM Cloud to its satellite location and offers visibility into all the traffic
    going back and forth.


    IBM’s strategy is to bring Cloud Pak for Data managed services to third-party
    clouds and dedicated on-premises infrastructure using Cloud Satellite. As of 2021,
    a subset of Cloud Pak for Data managed services, including Jupyter Notebook and
    DataStage, is available on Cloud Satellite to be deployed on third-party clouds.
    The packaging and pricing for these services is no different from how it is on
    IBM Cloud, and included will be the third-party cloud infrastructure to run the
    services. The ultimate objective here is to deliver a managed service on the infrastructure
    of your choice.


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_154_0.png)


    Figure 6.10 – IBM Cloud Satellite'
  - '[PAGE 155]


    So, how does this all work? Once a Satellite location is established, all workloads
    in these Satellite locations run on Red Hat OpenShift – specifically IBM Cloud''s
    managed OpenShift service. Services integrated into Cloud Pak for Data as a Service
    – such as DataStage – can deploy runtimes to these Satellite locations so that
    these runtimes can be closer to the data or apps these services need to integrate
    with. A secure connection, called Satellite Link, provides communication between
    Cloud Pak for Data as a Service and its remote runtimes.


    The value proposition of IBM Cloud Satellite specifically for data and AI workloads
    is threefold:


    +   1. **Data gravity**: Minimize data movement and redundancy, which also helps
    avoid egress costs. Train AI models closer to where data is located, which removes
    latency and improves performance.

    +   2. Modernize legacy workloads and realize cloud-native benefits on-premises
    or on a third-party cloud of your choice:

    +      Easy to provision and scale up and down.

    +      Seamless upgrades with negligible downtime.

    +      Realize the benefits of a managed service.

    +   3. Address regulatory and compliance challenges:

    +      Share insights without moving data: handle challenges with data sovereignty.

    +      Comply with GDPR, CCPA, and so on.


    Now that we have learned the basics of IBM Cloud Satellite and IBM''s approach
    to multi-cloud, let''s look at the **data fabric**.


    # A data fabric for a multi-cloud future


    The cloud is transforming every business, and multi-cloud is the future. To be
    successful, enterprises will have to access, govern, secure, transform, and manage
    data across private and public clouds. This is what IBM is addressing using the
    data fabric, a significant effort that will likely span multiple years. A solid
    foundation to a data fabric starts with centralized metadata management, data
    governance, and data privacy, which, when augmented by automation, really helps
    in amplifying the benefits.'
