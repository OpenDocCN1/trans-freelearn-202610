    # Customer use case: AI claim processing


    A European government agency has a workforce consisting of thousands of employees
    directly involved in benefits claim processing. The workforce is aging and retiring,
    leaving the client short on skilled employees who can process benefit claims.


    Because of this, the agency decided to create a benefits platform and try out
    claims processing using an AI solution based on IBM Cloud Pak for Data and other
    products. Given that this is a government agency, the solution needs to be on-premises,
    constraining the available options.


    The AI lifecycle services within Cloud Pak for Data (Watson Studio and Watson
    Machine Learning) are leveraged to create machine learning models for the benefits
    claims process. The benefits of the engagement include cost savings, speed, and
    quality in the benefits claims process.


    # Customer use case: data and AI platform


    A fortune 500 financial services company had three major issues slowing their
    journey to become a data-driven company. Their data was all over their enterprise—some
    in Hadoop, some in SQL, some in Excel spreadsheets—and impossible to access easily.
    They didn''t have an enterprise data governance strategy so there was **no unified
    set of definitions**, and no one knew the health of the data or its provenance.'
