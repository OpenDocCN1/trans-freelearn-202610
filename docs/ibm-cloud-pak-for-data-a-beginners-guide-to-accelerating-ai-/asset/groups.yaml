    # 11


    # Storage


    **Cloud Pak for Data** leverages the Kubernetes concept of **persistent volumes**,
    which is supported in OpenShift, to enable its various services so that it can
    store data and metadata. Cloud Pak for Data services can also connect to remote
    databases, lakes, and object stores, as well as remotely exported filesystems
    as sources of data. We will look at the concepts and technologies that power both
    in-cluster PVs and off-cluster external storage. By the end of this chapter, you
    will have learned about what options are available in various public and private
    cloud infrastructures, as well as how to best optimize data storage for your use
    cases. You will also learn how storage should be operationalized, especially to
    support the continuous availability of your entire solution.


    In this chapter, we''re going to cover the following main topics:


    +   - Persistent volumes

    +   - Connectivity to external volumes

    +   - Operational considerations'
  - '[PAGE 274]


    # Understanding the concept of persistent volumes


    We will start by providing a quick introduction to the foundational storage concepts
    in Kubernetes and how Cloud Pak for Data leverages storage. Typical containers
    are stateless, which means that any files they create or any changes they make
    will be ephemeral; upon restarting the container, these changes would not be restored.
    Also, in-container files would be created in a temporary location on the host,
    which can cause contention with other, similar consumers of that location. In
    **Kubernetes**, the concept of volumes [1] enables the persistence of directory
    files that are needed for stateful containers. Such volumes are mounted in a Kubernetes
    Pod and, depending on the access mode associated with that volume, the same directory
    contents can be shared with other Pods running concurrently within that Kubernetes
    namespace.


    In this section, you will learn what it means to provision entities known as **persistent
    volumes**, which provide storage for Cloud Pak for Data workloads and can be configured
    for performance, reliability, and scale.


    Multiple technologies and vendors enable storage in Kubernetes; we will explore
    those currently certified by Cloud Pak for Data.


    # Kubernetes storage introduction


    Kubernetes provides a construct called **persistent volume claims (PVCs)**[2]
    as an abstraction for Pods to mount block and file **persistent volumes (PVs)**
    [2] without needing vendor-specific handling. Storage vendors, typically introduced
    as operators, provide the necessary services to define **storage classes** [3]
    and **dynamic provisioners** [4] to create, initialize, and mount these volume
    filesystems in different Pods. While the storage software and configuration are
    vendor-specific, the concept of PVCs makes consuming storage a standard procedure
    that''s immune from the technology that''s used to provide that storage.


    Note that Cloud Pak for Data requires the use of **dynamic provisioners**; that
    is, the ability to provision storage on-demand. Static provisioners, which predefine
    storage volumes, are insufficient as Cloud Pak for Data services are deployed
    via a dynamic, *plug-n-play* mechanism. Scaling out such services could also,
    in many classes, automatically require us to create new volumes.'
