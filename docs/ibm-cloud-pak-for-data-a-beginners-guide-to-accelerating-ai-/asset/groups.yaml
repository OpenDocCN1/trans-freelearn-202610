    \n管理员通常使用用户管理体验配置角色，如下图所示：\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_256_0.png)\n\
    \n图 10.5 – 管理角色体验\n\n下表显示了 Cloud Pak for Data 中分配给不同开箱即用角色 [38] 的权限示例，以及相关的服务提供：\n\
    \n- **管理员角色：** **管理员** 是 Cloud Pak for Data 中的预定义角色，包括以下表中列出的特定权限集。存在的权限集取决于已安装的服务。例如，如果未安装\
    \ Watson Knowledge Catalog，则 **访问治理工件** 权限将不可用。\n\n  | 权限 | 类别 | 贡献该权限的服务 |\n\
    \  |---|---|---|\n  | 访问治理工件 | 治理工件 | Watson™ Knowledge Catalog |\n  | 管理平台 |\
    \ 平台管理 | Cloud Pak for Data 控制平面 |\n  | 创建部署空间 | 部署 | - Watson Knowledge Catalog<br>-\
    \ Watson Studio |\n  | 创建项目 | 项目 | - Watson Knowledge Catalog<br>- Watson Studio\
    \ |\n  | 创建服务实例 | 服务实例 | Cloud Pak for Data 控制平面 |\n  | 管理资产发现 | 数据管理 | Watson\
    \ Knowledge Catalog |\n  | 管理目录 | 目录 | - Watson Knowledge Catalog<br>- Watson\
    \ Studio |\n  | 管理数据保护规则 | 治理工件 | Watson Knowledge Catalog |\n  | 管理数据质量 | 数据管理\
    \ | Watson Knowledge Catalog |\n  | 管理数据转换 | 数据集成 | DataStage® |\n  | 管理治理分类 |\
    \ 治理工件 | Watson Knowledge Catalog |\n  | 管理信息资产 | 目录 | Watson Knowledge Catalog\
    \ |\n  | 管理元数据 | 数据管理 | Watson Knowledge Catalog |\n  | 管理工作流 | 工作流 | Watson Knowledge\
    \ Catalog |\n\n  图 10.6 – 授予管理员角色的权限\n\n- **数据科学家** 角色：此角色指定通常参与高级分析和机器学习的<|message|>。他们从目录中引用数据，并在项目中与其他用户协作。对于此类用户，通常只需要一小部分权限，如下表所示。这也授予他们使用部署（例如机器学习模型）的权限。\n\
    \n  | 权限 | 类别 | 贡献该权限的服务 |\n  |---|---|---|\n  | 访问目录 | 目录 | - Watson Knowledge\
    \ Catalog<br>- Watson Studio |\n  | 创建部署空间 | 部署 | - Watson Knowledge Catalog<br>-\
    \ Watson Studio |\n  | 创建项目 | 项目 | - Watson Knowledge Catalog<br>- Watson Studio\
    \ |\n\n  图 10.7 – 授予数据科学家角色的权限\n\n- **用户** 角色：**用户** 角色很特殊，因为它通常表示分配给某类访客用户的最少权限集。将\
    \ **用户** 角色分配给某人仅意味着他们将能够登录并查看不需要任何额外授权的任何内容。将 **用户** 角色分配也用于向平台引入新用户，从而使他们随后可以作为个人添加到用户组或分配对项目、目录甚至数据库的访问权限。\n\
    \n  然而，当安装某些服务（例如 Watson Knowledge Catalog 或 Watson Studio）时，默认情况下，它们会向此 **用户**\
    \ 角色授予额外权限。这使这些用户至少能够在自己的项目或部署空间范围内私下工作。当然，就像任何预定义角色一样，管理员可以选择更改此角色并删除这些权限或引入其他权限，以符合他们对“最小”特权角色的定义。\n\
    \n  | 权限 | 类别 | 贡献该权限的服务 |\n  |---|---|---|\n  | 创建部署空间 | 部署 | - Watson Knowledge\
