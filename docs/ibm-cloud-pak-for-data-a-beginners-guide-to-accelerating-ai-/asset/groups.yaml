    - Replicating transactional data to run analytics without impacting regular business
    operations

    - Ensuring data integrity with an **ACID-compliant database**

    - Ensuring low-latency and real-time insight into your business operations


    ## Informix


    The **Informix** service provides an Informix database on IBM Cloud Pak for Data.
