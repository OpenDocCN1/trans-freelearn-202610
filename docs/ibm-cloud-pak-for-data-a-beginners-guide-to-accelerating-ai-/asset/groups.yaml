    Kubernetes is essentially a highly resilient and extensible platform for orchestrating
    and operating containerized workloads. It embodies the microservices architecture
    pattern, enabling the continuous development and Deployment of smaller, independent
    services:


    - **Resilient:** Kubernetes enables containerized workloads to be clustered on
    multiple compute nodes. Kubernetes monitors workloads ("Pods") and, via health
    probes, can auto-restart them when failure is detected. Even when there are compute
    node failures, it can automatically move workloads to other nodes. This works
    out well for establishing *multi-zone* availability, where workloads can survive
    the outage of entire zones.


    - **Elasticity:** The scale-out of computing is elegantly handled by introducing
    additional compute nodes to the cluster. Kubernetes treats the entire set of CPU
    cores and memory as a pool of resources and can allocate them to Pods as needed.
    It also supports the concepts of replicas and **load balancing**, where workloads
    can be scaled out with multiple copies (Pod replicas). Kubernetes can then route
    requests to different replicas automatically in a round-robin manner, considering
    those replicas that may not be healthy at any instant.


    - **Infrastructure abstraction:** With Kubernetes, workloads are deployed using
    higher-level constructs and without the need to be aware of the **compute infrastructure**
    that hosts it – whether on-premises or in the cloud, or whichever hypervisor is
    in use. Pods are seamlessly scheduled on different worker nodes based on how much
    compute (CPU cores and memory) is needed. Kubernetes also includes the ability
    to consume **storage** for persistence using a vendor-independent framework, and
    this enables enterprises to work with a wider choice of storage technologies,
    including leveraging existing storage solutions that they may already have in
    their enterprises. Software-defined **networking**, and the concept of OpenShift
    routes and ingress, as well as service discovery patterns, also ensure that workloads
    are well insulated from the complexity of networking, too.


    - **Portable and hybrid cloud-ready:** OpenShift Container Platform delivers a
    standardized Kubernetes operating environment in many cloud Infrastructure-as-a-Service
    hyper-scaler environments, even offered as a service as well as on-premises on
    top of both virtual machine and bare metal nodes. Kubernetes thrives as an open
    source community, and with that comes challenges with different versions and API
    compatibility. OpenShift ensures a consistent release cycle for Kubernetes with
    fully validated and *security-hardened* container platforms everywhere. This ensures
    that enterprises can deploy their applications anywhere they need or move to another
    cloud, without the danger of being locked down to an initial choice of the Infrastructure-as-a-Service.


    - **A rich developer ecosystem:** Kubernetes has quickly become the development
    platform of choice for cloud-native applications. OpenShift Container Platform
    further extends that with developer-focused capabilities, including enriching
    the concept of **continuous delivery/continuous integration (CI/CD)**. With the
    focus on secure development and operations, OpenShift Container Platform enables
    rapid innovation at enterprises for developing modern cloud-native apps and solutions.


    - **Enterprise and multi-tenancy ready:** Kubernetes, especially with its concept
    of namespaces, resource quotas, and network policies, can elegantly support isolations
    between tenants. **OpenShift Container Platform** [2] introduces additional security
    constructs, including SELINUX host primitives that greatly improve the safe sharing
    of OpenShift clusters among multiple tenants in a cost-effective manner.


    For these reasons and more, IBM Cloud Pak for Data is powered by the Red Hat OpenShift
    Container Platform. This enable Cloud Pak for Data to provide an open, extensible,
    reliable, and secure data and AI platform in any cloud.


    ## The operator pattern


    The operator pattern [3] is an architectural concept and best practices to build,
    deliver, and operate applications in Kubernetes. Operators [4] are special Controllers
    deployed in Kubernetes that are meant to manage individual applications in an
    automated manner. Essentially, operators codify human experiences to manage and
    correct Kubernetes workloads.


    Cloud Pak for Data v4 functionality is delivered as operators [5]. These operators
    enable users to install and configure *Day1* activities. From a *Day2* perspective,
    operators also continuously monitor and auto-correct deviations from the norm
    as well as support the need to scale up/out deployed Cloud Pak for Data services
    when needed. Operators are also leveraged to upgrade services to newer releases
    in an automated fashion.


    OpenShift Container Platform includes the **Operator Lifecycle Manager (OLM)**
    [6] functionality that helps the OpenShift Administrator curate operators for
    various services (IBM, Red Hat, open source, or other third-party vendors) in
    a standardized manner.


    Cloud Pak for Data includes a *Control Plane* layer that enables all services
    to integrate seamlessly and be managed from a single platform layer. This control
    plane is deployed using an operator called the Cloud Pak for Data platform operator
    [5]. A user with appropriate Kubernetes privileges creates a **Custom Resource
    (CR)** object in a particular Cloud Pak for Data instance namespace to indicate
    what service should be deployed. In the case of Cloud Pak for Data, a custom resource
    of the kind *IbmcP* causes the Cloud Pak for Data platform operator to trigger
    the installation of the control plane in that namespace.


    The following diagram provides a simplistic high-level outline of a Kubernetes
    cluster [10] to illustrate how it functions, just to set the context for how Cloud
    Pak for Data leverages it:


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_207_0.png)


    Figure 9.2 – Kubernetes architecture overview


    There are essentially two types of host nodes – the **Master** and **Compute**
    (worker) nodes. In some implementations, a node may have both the master and compute
    roles, but it is highly recommended to maintain separate masters to ensure a better
    class of reliability. Each node includes some fundamental components [11] such
    as the Kubelet daemon and functionality to interact with the container runtimes
    on each node. The master nodes include certain special components, such as the
    API server and the scheduler.


    Kubernetes uses the etcd database for storing configuration information and this
    database is critical for overall operations. etcd is a key-value distributed store
    and, for high availability, can work with multiple replicas on different hosts,
    establishing a quorum. It is recommended that you start with three master nodes
    and expand when it becomes necessary to support a larger set of applications at
