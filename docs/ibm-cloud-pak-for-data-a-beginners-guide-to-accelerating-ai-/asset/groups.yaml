    # People empowering your data citizens


    A modern enterprise consists of many different "data citizens" – from the chief
    data officer; to data scientists, analysts, architects, and engineers; to the
    individual line of business users who need insights from their data. The Organize
    rung is about creating and sustaining a data-driven culture that enables collaboration
    across an organization to drive agility and scale.


    Each organization has unique requirements where stakeholders in IT, data science,
    and the business lines need to add value to drive a successful business. Also,
    because governance is one of the driving forces needed to support DataOps, organizations
    can leverage existing data governance committees and lessons from tenured data
    governance programs to help establish this culture and commitment.


    The benefits of DataOps mean that businesses function more efficiently once they
    implement the right technology and develop self-service data capabilities that
    make high-quality, trusted data available to the right people and processes as
    quickly as possible. The following diagram shows what a DataOps workflow might
    look like: architects, engineers, and analysts collaborate on infrastructure and
    raw data profiling; analysts, engineers, and scientists collaborate on building
    analytics models (whether those models use AI); and architects work with business
    users to operationalize those models, govern the data, and deliver insights to
    the points where they’re needed.


    Individuals within each role are designated as **data stewards** for a particular
    subset of data. The point data citizens of the DataOps methodology is that each
    of these different roles can rely on seeing data that is accurate, comprehensive,
    secure, and governed:


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_27_0.png)


    Figure 1.4 – DataOps workflow by roles'
