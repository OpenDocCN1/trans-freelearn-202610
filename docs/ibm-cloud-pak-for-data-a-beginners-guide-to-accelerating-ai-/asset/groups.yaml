    # Summary


    Managed services/SaaS is an absolute must these days, and Cloud Pak for Data has
    a comprehensive and evolving set of capabilities that addresses end-to-end customer
    requirements. With simplified packaging and pricing and incentives to modernize,
    IBM makes it easy for existing and new clients to embrace Cloud Pak for Data as
    a Service. In this chapter you learned the different deployment options for Cloud
    Pak for Data, supported third-party clouds and an overview of its managed service
    (Cloud Pak for Data SaaS offering). You have also learned that IBM’s vision is
    to deliver the Cloud Pak for Data managed service on any infrastructure of your
    choosing, including third-party cloud providers. This is made possible using Cloud
    Satellite, IBM’s answer to AWS Outposts and Azure Stack/Arc.


    Finally, IBM is making significant investments in its data fabric to access, govern,
    manage, and secure data and AI workloads across clouds to address the evolving
    requirements of a multi-cloud future.


    In the next chapter, we will learn about the Cloud Pak for Data ecosystem, which
    complements and extends the capabilities included in the base Cloud Pak for Data.'
