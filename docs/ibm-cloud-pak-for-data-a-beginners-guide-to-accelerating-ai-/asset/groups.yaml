  - "[PAGE 251]\n\n```\n```yaml\nrequests:\n  cpu: 100m\n  memory: 256Mi\n```\n```\n\
    \n# Additional considerations\n\nIn the previous sections, we looked at how Cloud\
    \ Pak for Data workloads can be uniquely identified, how the least privilege principle\
    \ is used to grant RBAC to each microservice, and even how resources consumed\
    \ by each micro-service can be capped. In this section, we will cover aspects\
    \ of security that apply across *multiple* microservices or even the entire Cloud\
    \ Pak for Data installation.\n\nWe will explore what it means to do the following:\n\
    \n+   - Ensure security for data in motion between two microservices\n+   - Secure\
    \ data at rest\n+   - Understand the relevance of traditional anti-virus software\n\
    \n# Encryption in motion and securing entry points\n\nCloud Pak for Data exposes\
    \ one HTTPS port as the primary access point for the browser-based user experience\
    \ and for API-based access. This port is exposed as an OpenShift route. All communication\
    \ inside the namespace and inbound is encrypted using SSL, with only **TLS 1.2**\
    \ highly secure cryptographic ciphers being enabled.\n\nThe installation of Cloud\
    \ Pak for Data in an OpenShift namespace causes the generation of a self-signed\
    \ TLS certificate. By default, this certificate is untrusted by all HTTPS clients\
    \ and should be replaced with the enterprise's own signed TLS certificate [13].\n\
    \nAll services in Cloud Pak for Data are required to support TLS-based encryption\
    \ for service-to-service communication and for communicating with external systems.\
    \ For example, DB2 exposes TLS over ODBC and JDBC for client applications, even\
    \ from outside the cluster to connect securely and ensure data in transit is also\
    \ encrypted. Connecting to external customer-identified databases and data lakes\
    \ in services such as Data Virtualization, Watson Studio can also be configured\
    \ to be over TLS.\n\nNote that such in-transit TLS-based encryption in Cloud Pak\
    \ for Data services is over and above anything that may be configured in the infrastructure.\
    \ For example, it is possible that Kubernetes inter-node communication networks\
    \ are also encrypted as part of a cloud infrastructure or VPN techniques."
