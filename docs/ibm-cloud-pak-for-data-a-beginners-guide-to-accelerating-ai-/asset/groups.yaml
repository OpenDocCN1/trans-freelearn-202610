  md: "\n## EDB Postgres Advanced Server\n\n**EnterpriseDB Postgres Advanced Server**\
    \ is an integrated, enterprise-ready version of the open source **PostgreSQL**\
    \ database, with advanced enterprise security, performance diagnostics, Oracle\
    \ compatibility, and other productivity features:\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_163_0.png)\n\
    \nFigure 7.5 – EDB Postgres Advanced Server\n\nEDB Postgres Advanced Server use\
    \ cases include the following:\n\n- DevOps, schema-less, rapid development with\
    \ multiple programming language support needed for new applications\n- Application\
    \ modernization that requires multi-modal flexibility and integration with popular\
    \ data sources\n- The need for Oracle compatibility for legacy migrations\n- Flexible\
    \ deployment options enabling a move to the cloud\n\n## MongoDB Enterprise Advanced\n\
    \n**MongoDB Enterprise Advanced** is a highly scalable, document-oriented, NoSQL\
    \ database that enables dynamic schemas, making it easier to integrate data in\
    \ certain types of applications. The MongoDB service in Cloud Pak for Data is\
    \ a highly available database with automatic scaling.\n\nMongoDB Enterprise Advanced\
    \ also gives you comprehensive operational tooling, advanced analytics and data\
    \ visualization, platform integrations, and certification:\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_164_0.png)\n\
    \nFigure 7.6 – MongoDB Enterprise Advanced\n\nUse cases for MongoDB include the\
    \ following:\n\n- Legacy application modernization, with a need for evolving schemas\n\
    - Making enterprise data available as a service, with a need to combine data from\
    \ different sources\n- Implementing a cloud data strategy, requiring scalability\
    \ and portability\n\nIn the next section, we will look at organizing extension\
    \ services.\n\n## Organize extension services\n\nWhile the Collect rung of the\
    \ AI ladder is about putting your data in the appropriate persistence store and\
    \ enabling easy access, the Organize extension services are all about building\
    \ a trusted analytics foundation. This entails data prep, data transformation,\
    \ data governance, data privacy, master data management, and life cycle management\
    \ of data across the enterprise. While Cloud Pak for Data includes a set of rich\
    \ capabilities for data prep, data governance, and data privacy as part of the\
    \ base offering, the rest of the Organize rung is available through the following\
    \ four extension services (AKA cartridges):\n\n### DataStage\n\nData integration\
    \ is a critical facet of any enterprise, and it is becoming even more important\
    \ given the increasing scale and distributed nature of enterprise data assets\
    \ (often spread across multiple clouds and data centers). IBM DataStage is an\
    \ enterprise-leading Extract, Transform, and Load (ETL) offering that has thousands\
    \ of customers, and is well known for its scalability and operational efficiency.\
    \ You can use the DataStage service on Cloud Pak for Data to design and run data\
    \ flows that move and transform data, and this allows you to compose and operationalize\
    \ your data flow with speed and accuracy. Using an intuitive graphical design\
    \ interface that lets you connect to a wide range of data sources, you can integrate\
    \ and transform data, and deliver it to your target system in batches or real\
    \ time.\n\nBoth services provide hundreds of ready-to-use, built-in business operations\
    \ for your data flows. The high-performance parallel runtime engine underpinning\
    \ DataStage lets enterprises scale to meet their integration needs despite increasing\
    \ data volumes and data complexity.\n\nDataStage on Cloud Pak for Data comes in\
    \ the following two flavors:\n\n- DataStage Enterprise\n- DataStage Enterprise\
    \ Plus\n\nDataStage Enterprise helps design data integration jobs and allows data\
    \ engineers to transform and move data for multiple sources and targets. You can\
    \ create reusable job templates, or design data integration flows in the intuitive\
    \ GUI. Data engineers can also design simple to complex jobs by using a wide range\
    \ of transformers and stages, while the high-performance runtime engine enables\
    \ scalability and efficiently integrates large volumes of data.\n\nDataStage Enterprise\
    \ Plus includes all of the capabilities that DataStage Enterprise has, plus additional\
    \ useful features for data quality. These features include the following:\n\n\
    - Cleansing data by identifying potential anomalies and metadata discrepancies\n\
    - Identifying duplicates by using data matching and the probabilistic matching\
    \ of data entities between two datasets\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_166_0.png)\n\
    \nFigure 7.7 – DataStage cartridge\n\n### Information Server\n\nThe IBM **Information\
    \ Server** cartridge on Cloud Pak for Data provides IT and **Line-of-Business\
    \ (LOB)** users with a comprehensive suite of capabilities to organize all of\
    \ your enterprise data. It is a suite of services and includes capabilities to\
    \ handle data integration, data quality, and data governance. This cartridge is\
    \ a superset of DataStage and provides seamless integration and a common user\
    \ experience for the following:\n\n- Automated data discovery\n- Policy-driven\
    \ governance\n- Self-service data preparation\n- Data quality assessment and cleansing\
    \ for data in flight and at rest\n- Advanced dynamic or batch-oriented data transformation\
    \ and movement\n\n### Master Data Management\n\nMaster data is at the heart of\
    \ every business transaction, application, and decision. The IBM **Master Data\
    \ Connect** service for IBM Cloud Pak for Data provides a RESTful API so that\
    \ geographically distributed users can get fast, scalable, and concurrent access\
    \ to your organization's most trusted master data from IBM **InfoSphere Master\
    \ Data Management** (**InfoSphere MDM**).\n\nInfoSphere MDM acts as a central\
    \ repository to manage, store, and maintain master data across your organization.\
    \ InfoSphere MDM provides the following:\n\n- A consolidated, central view of\
    \ an organization's key business facts\n- The ability to manage master data throughout\
    \ its life cycle:\n\n  ![](img/50e1dac0750b69f2b8e8efff000eb13b_167_0.png)\n\n\
    \  Figure 7.8 – Master Data Management cartridge\n\nInfoSphere MDM version 11.6.0.11\
    \ or above supports publishing to Master Data Connect using the IBM **MDM Publisher**\
    \ capability. With MDM Publisher, you can complete one-time bulk loads of master\
    \ data into Master Data Connect or set up ongoing data synchronization. When you\
    \ configure Master Data Connect data subscriptions in the user interface, MDM\
    \ Publisher creates, runs, and manages the resulting data load jobs.\n\nAfter\
    \ your organization's master data is loaded, Cloud Pak for Data users or applications\
    \ can access the trusted data directly by using the powerful API. This allows\
    \ them to do the following:\n\n- View master data records.\n- Run full text or\
    \ property query searches on your master data.\n- Run graph database queries on\
    \ your master data.\n- View relationships between master data records.\n- View\
    \ the logical model of your data.\n\n## Analyze cartridges – IBM Palantir\n\n\
    One of the core use cases of Cloud Pak for Data is data science, and the base\
    \ platform includes a rich set of capabilities to build, deploy, manage, and govern\
    \ AI models underpinned by IBM **Watson Studio**. In addition, Cloud Pak for Data\
    \ includes two premium services (AKA cartridges) to complement the core capabilities.\n\
    \n### IBM Palantir\n\nThe new IBM **Palantir** cartridge for Cloud Pak for Data\
    \ will streamline and accelerate how organizations infuse predictive, data-driven\
    \ insights into real-world decision making and business operations, across a variety\
    \ of industry verticals. The IBM Palantir service helps with the following:\n\n\
    - Delivering AI-for-business capabilities in an easy-to-deploy-and-manage \"no-code,\
    \ low-code\" environment\n- Simplifying how data and AI models are connected to\
    \ business decisions, with trust and explainability\n- Informing better decisions\
    \ by automatically mapping data to business meaning and industry context\n- Automating\
    \ how data is collected, organized, and analyzed across hybrid cloud and data\
    \ landscapes\n"
  mdcn: "\n\n## EDB Postgres Advanced Server\n\n**EnterpriseDB Postgres Advanced Server**\
    \ 是一个集成的、企业级版本的开源 **PostgreSQL** 数据库，具备先进的企业安全、性能诊断、Oracle 兼容性以及其他生产力特性：\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_163_0.png)\n\
    \n图 7.5 – EDB Postgres Advanced Server\n\nEDB Postgres Advanced Server 的用例包括以下方面：\n\
    \n- 适用于新应用的 DevOps、无模式、多编程语言支持的快速开发\n- 需要多模式灵活性和与主流数据源集成的应用现代化\n- 遗留迁移需要 Oracle\
    \ 兼容性\n- 支持向云迁移的灵活部署选项\n\n## MongoDB Enterprise Advanced\n\n**MongoDB Enterprise\
    \ Advanced** 是一个高度可扩展、面向文档的 NoSQL 数据库，支持动态模式，使其更容易在特定类型的应用程序中集成数据。Cloud Pak for\
    \ Data 中的 MongoDB 服务是一个具有自动扩展功能的高可用数据库。\n\nMongoDB Enterprise Advanced 还为您提供全面的运维工具、高级分析和数据可视化、平台集成以及认证：\n\
    \n![](img/50e1dac0750b69f2b8e8efff000eb13b_164_0.png)\n\n图 7.6 – MongoDB Enterprise\
    \ Advanced\n\nMongoDB 的用例包括以下方面：\n\n- 遗留应用现代化，需要不断演进的模式\n- 将企业数据作为服务提供，需要组合来自不同来源的数据\n\
    - 实施云数据战略，需要可扩展性和可移植性\n\n在下一节中，我们将讨论如何组织扩展服务。\n\n## 组织扩展服务\n\nAI 阶梯的“收集（Collect）”层级是将数据放入适当的持久化存储并实现轻松访问，而“组织（Organize）”扩展服务则致力于构建可信的分析基础。这涵盖数据准备、数据转换、数据治理、数据隐私、主数据管理以及企业范围内数据的生命周期管理。虽然\
    \ Cloud Pak for Data 的基础产品包含一组丰富的数据准备、数据治理和数据隐私功能，但 Organize 层级的其余部分可通过以下四个扩展服务（也称为扩展包）获得：\n\
    \n### DataStage\n\n数据集成是任何企业的关键方面，随着企业数据资产的规模不断增加和分布式特性（通常分布在多个云和数据中心），它变得更加重要。IBM\
    \ DataStage 是企业领先的提取、转换、加载（ETL）产品，拥有数千家客户，以其可扩展性和运营效率而闻名。您可以使用 Cloud Pak for Data\
    \ 上的 DataStage 服务来设计和运行移动及转换数据的数据流，这使您能够快速、准确地组合和运营数据流。通过直观的图形设计界面，您可以连接到各种数据源，集成和转换数据，并以批处理或实时方式将其交付到目标系统。\n\
    \n这两种服务都为您的数据流提供了数百个开箱即用的内置业务操作。支撑 DataStage 的高性能并行运行时引擎使企业能够扩展以满足其集成需求，即使数据量和数据复杂性不断增加。\n\
    \nCloud Pak for Data 上的 DataStage 有以下两种版本：\n\n- DataStage Enterprise\n- DataStage\
    \ Enterprise Plus\n\nDataStage Enterprise 帮助设计数据集成作业，并允许数据工程师为多个源和目标转换及移动数据。您可以创建可重用的作业模板，或在直观的图形界面中设计数据集成流。数据工程师还可以使用各种转换器和阶段来设计从简单到复杂的作业，而高性能运行时引擎则支持可扩展性并高效集成大量数据。\n\
    \nDataStage Enterprise Plus 包含 DataStage Enterprise 的所有功能，并额外提供了用于数据质量的有用功能。这些功能包括：\n\
    \n- 通过识别潜在异常和元数据差异来清洗数据\n- 通过数据匹配和两个数据集之间数据实体的概率匹配来识别重复项\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_166_0.png)\n\
    \n图 7.7 – DataStage 扩展包\n\n### Information Server\n\nCloud Pak for Data 上的 IBM\
    \ **Information Server** 扩展包为 IT 和**业务线（LOB）**用户提供了一套全面的功能，用于组织所有企业数据。它是一套服务，包括处理数据集成、数据质量和数据治理的功能。此扩展包是\
    \ DataStage 的超集，并为以下方面提供无缝集成和一致的用户体验：\n\n- 自动化数据发现\n- 策略驱动的治理\n- 自助式数据准备\n- 对传输中和静态数据进行数据质量评估和清洗\n\
    - 高级动态或批处理导向的数据转换和移动\n\n### 主数据管理\n\n主数据是每笔业务交易、应用程序和决策的核心。用于 IBM Cloud Pak for\
    \ Data 的 IBM **Master Data Connect** 服务提供 RESTful API，使地理分布的用户能够从 IBM **InfoSphere\
    \ Master Data Management**（**InfoSphere MDM**）快速、可扩展且并发地访问您组织中最受信任的主数据。\n\nInfoSphere\
    \ MDM 充当中央存储库，用于跨组织管理、存储和维护主数据。InfoSphere MDM 提供以下功能：\n\n- 组织关键业务事实的整合、集中视图\n\
    - 在主数据的整个生命周期内管理主数据的能力：\n\n  ![](img/50e1dac0750b69f2b8e8efff000eb13b_167_0.png)\n\
    \n  图 7.8 – 主数据管理扩展包\n\nInfoSphere MDM 11.6.0.11 或更高版本支持使用 IBM **MDM Publisher**\
    \ 功能发布到 Master Data Connect。使用 MDM Publisher，您可以一次性批量加载主数据到 Master Data Connect，或设置持续的数据同步。当您在用户界面中配置\
    \ Master Data Connect 数据订阅时，MDM Publisher 会创建、运行并管理由此产生的数据加载作业。\n\n加载组织的主数据后，Cloud\
    \ Pak for Data 用户或应用程序可以使用强大的 API 直接访问可信数据。这使它们能够：\n\n- 查看主数据记录。\n- 对主数据执行全文或属性查询搜索。\n\
    - 对主数据运行图数据库查询。\n- 查看主数据记录之间的关系。\n- 查看数据的逻辑模型。\n\n## 分析类扩展包 – IBM Palantir\n\n\
    Cloud Pak for Data 的核心用例之一是数据科学，基础平台包含一组丰富的功能，用于构建、部署、管理和治理由 IBM **Watson Studio**\
    \ 支持的 AI 模型。此外，Cloud Pak for Data 还包含两个高级服务（也称为扩展包）来补充核心功能。\n\n### IBM Palantir\n\
    \n用于 Cloud Pak for Data 的新的 IBM **Palantir** 扩展包将简化和加速组织如何将预测性、数据驱动的洞察注入各个行业领域的现实决策和业务运营中。IBM\
    \ Palantir 服务有助于以下方面：\n\n- 在易于部署和管理的“无代码、低代码”环境中提供面向业务的 AI 功能\n- 简化数据和 AI 模型与业务决策的连接方式，同时具有可信性和可解释性\n\
    - 通过自动将数据映射到业务含义和行业上下文，为更明智的决策提供信息\n- 自动化在混合云和数据环境中收集、组织和分析数据的方式\n\n"
