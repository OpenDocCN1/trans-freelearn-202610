    With the *installPlanApproval: Automatic* specification in the operator subscriptions
    [36], operator deployments are typically set to be automatically upgraded when
    its catalog source is refreshed, A choice of a manual approval implies that a
    cluster admin manually decides when the upgrade is acceptable. Note that new versions
    of Cloud Pak for Data operators are expected to still tolerate currently existing
    installed versions of the operand deployments and support new versions at the
    same time. Hence, in the same cluster, a fresh installation of the new version
    of the service could be deployed, while another namespace continues to retain
    the old version, and both get managed by the same operator.


    Operands can be set to be auto-upgraded as well. This would mean that when the
    operator is upgraded, as part of its reconcile loop, it automatically upgrades
    existing operands as well to the latest version supported by that operator.


    The easiest approach is to configure the fully automated mechanisms and adopt
    the continuous delivery paradigm. With this approach, all cluster administrator
    needs to do is to simply ensure that the catalog source is updated (manually if
    air-gapped). Operators introduced by that updated catalog service would then get
    automatically upgraded to the latest version and those operators would, in turn,
    automatically upgrade the operands they manage.


    For situations where a specific version of an operand is required and upgrades
    need to be handled manually, a process called "pinning" can be adopted. Pinning
    operands to a version works even when the operator concerned has been upgraded.
    This is done by explicitly providing a version in the custom resource spec for
    that service in an instance namespace. Only when the version is manually altered
    would the operator trigger the upgrade of the operand deployments to the new version
    requested. If no version is specified, then the operator assumes that the operand
    deployments always need to be at the latest release level and automatically ensures
    that to be the case.


    # Scale-out


    Out of the box, operand deployments of services are configured to use specific
    compute resources and replica settings. Most services support a T-shift sizing
    configuration that provides for the scaling out and scaling up of the various
    Pod microservices. In many cases, scale-out is also done to improve high availability
    with multiple replicas for deployments and improved performance with increased
    load balancing.'
