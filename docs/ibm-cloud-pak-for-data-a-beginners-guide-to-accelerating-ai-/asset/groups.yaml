  - '[PAGE 83]


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_83_0.png)


    Figure 4.6 – Initial profiling results showing data distribution and summary statistics


    We also have a more comprehensive profiling capability as part of the auto-discovery
    and data quality analysis functions, which we will discuss later in this chapter.
    This will take us further in terms of discovery relationships across data domains
    and doing a more comprehensive data quality analysis.


    # Classifying data for completeness


    Classifications are special labels that are used to classify assets based on the
    enterprise confidentiality level. This is done by tagging certain assets as being
    more sensitive than others. You can think of them as tags that help consumers
    identify what assets they can share, as well as protect other assets that are
    not available for distribution outside the business unit or organization. The
    centralized catalog service in Cloud Pak for Data comes with the following out-of-the-box
    classifications, with the flexibility to add more classifications as required
    by the organization:


    +   - Personally Identifiable Information (PII), which is data that can identify
    individuals (for example, social security numbers).

    +   - Sensitive Personal Information (SPI), which is data that, if exposed, can
    cause substantial harm, embarrassment, and/or unfairness to an individual (for
    example, race, sexual orientation, religious beliefs, and so on).'
  - '[PAGE 84]


    +   - **Confidential**, which is data that, if compromised, can lead to long-term
    harm to the individual and/or organization:


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_84_0.png)


    *Figure 4.7 – Classification used to define data protection rules*


    Not only can we use these classifications as asset tags, but we can also leverage
    the platform''s automation to trigger data protection rules that would restrict
    access to certain assets for different users based on their classification.


    Next, we will discuss how we can leverage the power of Cloud Pak for Data''s automated
    data discovery feature and its **machine learning (ML)** infused business term
    assignment process.


    # Automating data discovery and business term assignment


    So far, we have discussed different types of metadata (business and technical)
    and the value of metadata in organizations. One crucial task is to map business
    metadata to technical metadata. This is required because Cloud Pak for Data is
    a platform that caters to different personas, including business and technical
    audiences, and the goal is to facilitate communication between the business and
    technical audiences, in addition to aligning technical assets to the corresponding
    business functions.'
  - '[PAGE 85]


    Cloud Pak for Data has a patented ML-based auto-classification function that recommends
    mapping business terms to the technical assets as part of the auto-discovery process.
    The ML classification model is trained with industry-specific metadata and provides
    cognitive learning based on manual business term assignments that are done by
    subject matter experts.


    Automatic term assignment is invoked as part of column analysis in the discovery
    process. We have two types of discovery processes:


    +   - QuickScan

    +   - Auto-discovery


    **Terms** are automatically assigned based on the confidence level of the ML model''s
    scoring. These associations of the business terms to technical assets are initially
    represented as candidates that domain experts and stewards can review and assign
    manually. When the confidence level matches or exceeds 50%, terms are suggested
    to be assigned. When the confidence level exceeds 80%, candidates are automatically
    assigned.


    The ML model uses the following to generate term assignments:


    +   - Linguistic name matching, based on the similarity of the name of the business
    term and the data asset.

    +   - Data class-based assignment. In this case, if a business term is associated
    with a data class and if data asset profiling assigns the data class to an asset,
    then the term is recommended as a match to the asset.

    +   - A supervised learning model, which is initially trained with terms stored
    in the default catalog and subsequently learns from user term assignments as model
    feedback.


    We will showcase the quickscan discovery process to showcase this automatic term
