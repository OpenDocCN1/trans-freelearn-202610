    # Contributors


    # About the authors


    **Hemanth Manda** heads product management at IBM and is responsible for the Cloud
    Pak for Data platform. He has broad experience in the technology and software
    industry spanning a number of strategy and execution roles over the past 20 years.
    In his current role, Hemanth leads a team of over 20 product managers responsible
    for simplifying and modernizing IBM''s data and AI portfolio to support cloud-native
    architectures through the new platform offering that is Cloud Pak for Data. Among
    other things, he is responsible for rationalizing and streamlining the data and
    AI portfolio at IBM, a $6 billion-dollar business, and delivering new platform-wide
    capabilities through Cloud Pak for Data.


    **Sriram Srinivasan** is an IBM Distinguished Engineer leading the architecture
    and development of Cloud Pak for Data. His interests lie in cloud-native technologies
    such as Kubernetes and their practical application for both client-managed environments
    and Software as a Service. Prior to this role, Sriram led the development of IBM
    Data Science Experience Local and the dashDB Warehouse as a Service for IBM Cloud.
    Early on in his career at IBM, Sriram led the development of various web and Eclipse
    tooling platforms, such as IBM Data Server Manager and the SQL Warehousing tool.
    He started his career at Informix, where he worked on application servers, database
    tools, e-commerce products, and Red Brick data warehouse.


    **Deepak Rangarao** leads WW Technical Sales at IBM and is responsible for the
    Cloud Pak for Data platform. He has broad cross-industry experience in the data
    warehousing and analytics space, building analytic applications at large organizations
    and technical presales, both with start-ups and large enterprise software vendors.
    Deepak has co-authored several books on topics such as OLAP analytics, change
    data capture, data warehousing, and object storage and is a regular speaker at
    technical conferences. He is a certified technical specialist in Red Hat OpenShift,
    Apache Spark, Microsoft SQL Server, and web development technologies.'
  - '[PAGE 4]


    # About the reviewers


    **Sumeet S Kapoor** is a technology leader, seasoned data and AI professional,
    inventor, and public speaker with over 18 years of experience in the IT Industry.
    He currently works for the IBM India software group as a solutions architect Leader
    and enables global partners and enterprise customers on the journey of adopting
    data and AI platforms. He has solved complex real-world problems across industry
    domains and has also filed a patent in the area of AI data virtualization and
    governance automation. Prior to IBM, he has worked as a senior technology specialist
    and development lead in Fortune 500 global product and consulting organizations.
    Sumeet enjoys running as his hobby and has successfully completed eight marathons
    and counting.


    **Campbell Robertson** is the worldwide data and AI practice leader for IBM''s
    Customer Success Group. In his role, Campbell is responsible for providing strategy
    and subject matter expertise to IBM Customer Success Managers, organizations,
    and IBM business partners. His primary focus is to help clients make informed
    decisions on how they can successfully align people, processes, and policies with
    AI- and data-centric technology for improved outcomes and innovation. He has over
    25 years of experience of working with public sector organizations worldwide to
    deploy best-of-breed technology solutions. Campbell has an extensive background
    in architecture, data and AI technologies, expert labs services, IT sales, marketing,
    and business development.'
