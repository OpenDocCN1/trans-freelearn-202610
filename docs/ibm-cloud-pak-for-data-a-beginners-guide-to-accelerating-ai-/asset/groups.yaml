    to accelerate application agility.


    ### Ecosystem partners with co-sell agreements


    The following list provides the names of ecosystem partners with co-sell agreements:


    - **BCC Group**: ONE platform for real-time streaming market data

    - **Crunchy PostgreSQL**: Open source PostgreSQL distribution for the enterprise

    - **Equifax**: Dataset for financial capacity, demographic, and credit information
    of consumers

    - **People Data Labs**: Dataset consisting of B2B and B2C data on person profiles

    - **Precisely**: Comprehensive list of all known addresses in the United States
    and Canada

    - **ZoomInfo**: ML-enhanced B2B company data to improve decision making

    - **ContractPodAI**: SaaS-based **Contract Lifecycle Management (CLM)**

    - **Duality Secureplus Query**: Securely query datasets controlled by third parties

    - **DXC Open Health Connect**: Digital health platform for healthcare providers,
    payers, and the life science industry

    - **Equinix**: Enables the running of AI models at the point of data ingest to
    reduce the cost and risk of data transfer

    - **Listec**: Solution to analyze and visualize operational SAP data

    - **Prolifics**: Predictive prospecting solution

    - **Tavant**: Media viewership analytics accelerator

    - **Dulles Research**: Plugin for the automatic conversion of SAS code to open
    source code

    - **NetApp**: Hybrid multi-cloud data services that simplify the management of
    applications and data across cloud and on-premises environments


    ## Summary


    Cloud Pak for Data has a vibrant IBM, open source, and third-party ecosystem of
    services. In this chapter, we covered in depth the capabilities of IBM premium
    services (also called cartridges), organized across the four rungs of the AI Ladder,
    namely, Collect, Organize, Analyze, and Infuse.


    In the next chapter, you will learn about the importance of the partner ecosystem,
    the different tiers of the business partners, and how clients can benefit from
    an open ecosystem on Cloud Pak for Data.


    In this chapter, we will be covering the following topics:


    - Improving health advocacy program efficiency

    - Voice-enabled chatbots

    - Risk and control automation

    - Enhanced border security

    - Unified Data Fabric

    - Financial planning and analytics


    ## Improving health advocacy program efficiency


    Let''s go through the use case by addressing the challenges that customers face
    in terms of improving the efficiency of their health advocacy program.


    The **customer challenge** was for a non-profit health care provider network and
    health plan company that wanted to improve the efficiency of their health advocacy
    program. The goal was to identify members who are at risk and reduce the likelihood
    of members experiencing adverse events. They wanted to predict the likelihood
    of an **Emergency Room (ER)** visit in the next 9 months. Their challenge was
    to cater to the diverse data science teams with demands for different tools/technologies,
    as well as the support staff that maintain these tools/technologies. They also
    wanted to operationalize their ML models and scale them across all cohorts over
    the next year(s).


    With Cloud Pak for Data, they were able to catalog information assets, including
    external datasets, with the centralized governance catalog. They were able to
    establish a governance framework with individual assets assigned to stewards and
    access policies that had been defined using governance policies/rules. With access
    to trusted data, they were able to leverage the Watson Studio Jupyter notebooks
    to train their ML models and deploy them as Watson Machine Learning deployments.
    The deployed models were monitored on an ongoing basis for bias and model drift.

