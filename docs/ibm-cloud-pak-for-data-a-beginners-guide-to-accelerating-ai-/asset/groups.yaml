  - '[PAGE 244]


    Hence, it is expected that all OpenShift clusters are able to pull images from
    a designated *Enterprise* container registry in their own private network. It
    is expected that pull secrets are made available to the service accounts used
    by Cloud Pak for Data.


    # The role of a bastion node


    Bastion nodes are typically machines that are deployed outside of the enterprise''s
    private network, with controlled access to repositories and registries. Such hosts
    facilitate access to container images, utilities, scripts, and other content from
    IBM and make them available to OpenShift clusters for provisioning.


    One approach is to download all images as `tar.gz` files and transfer these files
    into the private network where they can be loaded into an appropriate container
    registry. However, a more convenient approach is to use the container registry
    to directly replicate container images from ICR into the enterprise''s own registry,
    from such a bastion node. This is made possible because the bastion node has access
    to the internet and to the enterprise''s own data center or at least the target
    registry for the duration. A bastion node''s role may extend beyond just the initial
    installation since this approach is quite useful for pulling or replicating newer
    container images, including those that patch any serious vulnerabilities.


    In this section, we covered how IBM Cloud Pak for Data containerized software
    is made available for customers from a trusted location for customers to ensure
    its provenance, and how these images can be introduced into the customer''s own
    registry. In the next section, we will look at what it means to operate Cloud
    Pak for Data securely.


    # Secure operations in a shared environment


    In traditional systems, many applications share the same operating system, be
    it a virtual machine or bare metal. However, for security reasons, these applications
    are typically never granted access to the operating system or run as *root*. Since
    many programs, from different products or vendors, would be operating on the same
    machine, care is also taken to isolate each of these operating system processes
    from each other.


    While it has been common to simply spin up a separate virtual machine for each
    application to completely isolate them, it was also expensive to operate and could
    possibly lead to a waste of compute resources. Containers have proven to be much
    less expensive in the long run, but there is a trade-off with regard to less isolation
    of workloads. In this section, we will look at how the stack enables security
    from the ground up, starting with the host operating system in the cluster, to
    OpenShift security constructs as well as how Cloud Pak for Data leverages Kubernetes
    access control primitives to enforce controls on all Services operating in that
    cluster.'
