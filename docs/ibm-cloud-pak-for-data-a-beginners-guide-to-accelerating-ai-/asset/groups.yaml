    \ classes; that is, portworx-shared-gp3:\n\n```\napiVersion: storage.k8s.io/v1\n\
    kind: StorageClass\nmetadata:\n  name: portworx-shared-gp3\nparameters:\n  priority_io:\
    \ high\n  repl: \"3\"\n  sharedv4: \"true\"\n  io_profile: db_remote\n  disable_io_profile_protection:\
    \ \"1\"\nallowVolumeExpansion: true\nprovisioner: kubernetes.io/portworx-volume\n\
    reclaimPolicy: Retain\nvolumeBindingMode: Immediate\n```\n\nHere is a snippet\
    \ of the portworx-metastoredb-sc RWO class:\n\n```\napiVersion: storage.k8s.io/v1\n\
    kind: StorageClass\nmetadata:\n  name: portworx-metastoredb-sc\nparameters:\n\
    \  priority_io: high\n  io_profile: db_remote\n  repl: \"3\"\n  disable_io_profile_protection:\
    \ \"1\"\nallowVolumeExpansion: true\nprovisioner: kubernetes.io/portworx-volume\n\
    reclaimPolicy: Retain\nvolumeBindingMode: Immediate\n```\n\nHere, you can see\
    \ that there are some vendor-specific parameters. Some are meant for performance\
    \ optimization, while others are meant for redundancy (replication) and control,\
    \ such as checking whether such provisioned volumes can be expanded.\n\nSimilarly,\
    \ other storage provisioners, such as IBM Spectrum Scale, have similar configuration\
    \ parameters as part of their storage classes.\n\nOnce Kubernetes provisions these\
    \ PVs, as specified in the requested PVCs, Kubernetes uses the binding between\
    \ the physical location of the storage and the PV construct to abstract how storage\
    \ is accessed by individual Pods. These provisioned PVs are then mounted by Kubernetes\
    \ upon startup of the individual Cloud Pak for Data Pods, using drivers provided\
    \ by the storage vendors or the underlying technology.\n\nAs part of installing\
    \ Cloud Pak for Data services, specific storage classes are selected by the user\
    \ as installation parameters. The Cloud Pak for Data documentation [6] includes\
    \ guidance on which types of storage classes are appropriate for each service\
    \ [7].\n\nNow, let's look a bit deeper into the storage topology itself, such\
    \ as where the storage could be located and what it means for different Kubernetes\
    \ Nodes to access this.\n\nBroadly, we can classify the storage locations like\
    \ so:\n\n- **In-cluster storage:** This is where the physical storage devices/disks\
    \ and the storage software control system are. They are used to provision and\
    \ manage volumes in those devices, and they are also part of the same Kubernetes\
    \ cluster as Cloud Pak for Data itself.\n- **Off-cluster storage:** This is where\
    \ the physical storage devices and the storage software is operated independently\
    \ from the Kubernetes cluster where Cloud Pak for Data is expected to run. Only\
    \ the storage drivers may exist on the Kubernetes cluster, as well as their provision\
    \ and mount volumes from that remote storage system.\n\nFrom a storage volume\
    \ access perspective, various types of software drivers (software-defined storage)\
    \ and plugin code exist in the Kubernetes ecosystem to support mounting volumes\
    \ [12]. Some are called \"in-tree\" volume provisioners, which refer to code that\
    \ natively exists in Kubernetes itself to work with such types of storage, while\
    \ others are referred to as \"out-of-tree\" provisioners, which refer to code\
    \ that exists outside of Kubernetes but can be plugged to work with different\
    \ storage solutions. Recent versions of Kubernetes also include a driver standard\
    \ called the Container Storage Interface (CSI) [13]. These provisioners present\
    \ one or more storage classes that provide the storage abstraction needed for\
    \ applications in Kubernetes. Hence, Kubernetes applications can be designed to\
    \ work against the PVC and storage class standards and be completely independent\
    \ of the actual physical location, the organization, or the drivers needed to\
    \ work with storage.\n\n## In-cluster storage\n\nThis deployment option typically\
    \ refers to co-locating storage and compute within the same Kubernetes cluster\
    \ as Cloud Pak for Data services. Storage devices are attached to multiple compute\
    \ worker or infrastructure Nodes, while a software-defined storage solution coordinates\
    \ how the storage will be provisioned and consumed by mounting the volumes wherever\
    \ they’re needed. These Nodes are typically connected over a low latency and high\
    \ throughput network inside the cluster. Such storage is only meant to be used\
    \ by applications and workloads running inside that Kubernetes cluster.\n\nKubernetes\
    \ natively includes the ability to mount volumes directly by using hostPath from\
    \ the compute host [8], as well as node affinity mechanisms by using local volumes\
    \ [9] to work around the logistical issues of scheduling Pods on the same workers\
    \ as storage. However, these options do not provide dynamic provisioning support,\
    \ and reliability is compromised when the underlying worker Nodes go offline.\
    \ Also, OpenShift’s restricted security context [11], by default, will not permit\
    \ large numbers of such volumes from the host. The use of hostPath or local volumes\
    \ also causes a tight coupling with Kubernetes applications in terms of storage.\
    \ The portability of applications and the clean abstraction of storage classes\
    \ and provisioning technologies is lost. For these reasons, Cloud Pak for Data\
    \ does not rely on hostPath or local volume types.\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_281_0.png)\n\
    \nThis organization can still be considered hyperconverged in the sense that the\
    \ Kubernetes cluster supports both storage and compute. The private low latency\
    \ network between the Nodes in the Kubernetes cluster would still be able to support\
    \ access to storage from Pods in a performant manner.\n\nThis variation would\
    \ not be able to support the possibility of a “local” mount optimization taking\
    \ advantage of the physical co-location of storage blocks and compute, but it\
    \ has the advantage of simplifying node operations and maintenance. This separation\
    \ can help ensure the storage services are not impacted by a sudden surge (of\
    \ noisy neighbor syndrome) from other Kubernetes workloads and vice versa.\n\n\
    The following diagram shows an example of how a central storage management solution\
    \ can expose volumes (either via the standard NFS protocol or other custom mechanisms):\n\
    \n![](img/50e1dac0750b69f2b8e8efff000eb13b_284_0.png)\n\nFigure 11.4 – Centralized\
    \ storage management with NFS\n\nStorage is expected to be provisioned dynamically\
    \ as needed, by provisioners, to satisfy the PVCs defined in Kubernetes. Drivers\
    \ (or, natively, NFS) support how these volumes are physically mounted in different\
    \ Pods that have been scheduled on different Kubernetes compute workers.\n\nFor\
    \ detailed guidance on how to use this provisioner and the storage class to define,\
    \ see [14] in the Further reading section.\n\nNote that the expectation, from\
    \ a production perspective, is that this assigned NFS server does not become a\
    \ single point of failure, that it is highly available, and that it supports automatic\
    \ failover (that is, it can't be something as trivial as the NFS daemon on a single\
    \ Linux system). If the NFS server fails, all the PVC mounts would become unusable.\
    \ Hence, an enterprise-class resilient storage management solution is critical\
    \ for ensuring overall reliability.\n\n## Operational considerations\n\nIn the\
    \ previous sections, we discussed what it means to provide or consume storage\
    \ either in-cluster or off-cluster for the containerized services in Cloud Pak\
    \ for Data. However, it is also critical to make sure that the storage infrastructure\
    \ itself is resilient and that operational practices exist to ensure that there\
    \ is no data loss. Storage failover must also be taken into account from a disaster\
    \ recovery (DR) standpoint.\n\nIn this section, we will take a quick look at some\
    \ typical practices and tools we can use to ensure that the Cloud Pak for Data\
    \ services operate with resilience, and that data protection is assured.\n\n###\
    \ Continuous availability with in-cluster storage\n\nA core tenet in Kubernetes\
    \ is to ensure the continuous availability of applications. This includes load\
    \ balancing and replicas for compute that can span multiple zones. Such zones\
    \ could be failure (or availability) zones in public clouds or perhaps independently\
    \ powered racks of hardware for an on-premises deployment [17].\n\nIn terms of\
    \ in-cluster storage, this requires that the storage is also continuously replicated\
    \ – this heavily depends on the storage vendor or technology in use. Here is an\
    \ example topology for continuous availability, sometimes also referred to as\
    \ active-active DR:\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_285_0.png)\n\n\
    Figure 11.5 – Active-active DR\n"
  mdcn: "\nStorageClass 定义还可以指定要使用的供应商特定 provisioner。当存储软件安装到 OpenShift 集群中时，会预定义一些存储类；其他供应商则提供定义新存储类的功能，并带有自定义参数，以便针对特定用例对卷进行微调。\n\
    \n例如，ocs-storagecluster-ceph-rbd（RWO）和 ocs-storagecluster-cephfs（RWX）存储类作为 OpenShift\
    \ 容器存储安装的一部分提供，而 Portworx 则通过不同的可配置属性集显式定义存储类，以优化性能或质量。\n\n用于 IBM 的 Portworx Essentials\
    \ 安装包中包含 Cloud Pak for Data 服务使用的一系列存储类。以下是其中一个 RWX 类的片段，即 portworx-shared-gp3：\n\
    \n```\napiVersion: storage.k8s.io/v1\nkind: StorageClass\nmetadata:\n  name: portworx-shared-gp3\n\
    parameters:\n  priority_io: high\n  repl: \"3\"\n  sharedv4: \"true\"\n  io_profile:\
    \ db_remote\n  disable_io_profile_protection: \"1\"\nallowVolumeExpansion: true\n\
    provisioner: kubernetes.io/portworx-volume\nreclaimPolicy: Retain\nvolumeBindingMode:\
    \ Immediate\n```\n\n以下是 portworx-metastoredb-sc RWO 类的片段：\n\n```\napiVersion:\
    \ storage.k8s.io/v1\nkind: StorageClass\nmetadata:\n  name: portworx-metastoredb-sc\n\
    parameters:\n  priority_io: high\n  io_profile: db_remote\n  repl: \"3\"\n  disable_io_profile_protection:\
    \ \"1\"\nallowVolumeExpansion: true\nprovisioner: kubernetes.io/portworx-volume\n\
    reclaimPolicy: Retain\nvolumeBindingMode: Immediate\n```\n\n在这里，您可以看到一些供应商特定的参数。有些用于性能优化，有些则用于冗余（复制）和控制，例如检查所制备的卷是否可以扩展。\n\
    \n同样，其他存储 provisioner（如 IBM Spectrum Scale）也有类似的配置参数作为其存储类的一部分。\n\n一旦 Kubernetes\
    \ 根据请求的 PVC 中指定的要求制备了这些 PV，Kubernetes 就会利用存储物理位置与 PV 构造之间的绑定，抽象出各个 Pod 如何访问存储。随后，在单个\
    \ Cloud Pak for Data Pod 启动时，Kubernetes 会使用存储供应商或底层技术提供的驱动程序来挂载这些已制备的 PV。\n\n\
    在安装 Cloud Pak for Data 服务时，用户会选择特定的存储类作为安装参数。Cloud Pak for Data 文档 [6] 中提供了有关哪些类型的存储类适合每个服务的指导\
    \ [7]。\n\n现在，让我们更深入地了解存储拓扑本身，例如存储可能位于何处，以及不同的 Kubernetes 节点访问存储意味着什么。\n\n大体上，我们可以将存储位置分类如下：\n\
    \n- **集群内存储：** 这是物理存储设备/磁盘和存储软件控制系统所在的位置。它们用于在这些设备中制备和管理卷，并且与 Cloud Pak for Data\
    \ 本身位于同一个 Kubernetes 集群中。\n- **集群外存储：** 这是物理存储设备和存储软件独立于 Cloud Pak for Data 预期运行的\
    \ Kubernetes 集群进行操作的位置。Kubernetes 集群上可能只存在存储驱动程序，以及从该远程存储系统制备和挂载卷。\n\n从存储卷访问的角度来看，Kubernetes\
    \ 生态系统中存在各种类型的软件驱动程序（软件定义存储）和插件代码来支持卷挂载 [12]。有些被称为“in-tree”卷 provisioner，指的是 Kubernetes\
    \ 本身原生存在、用于处理这类存储的代码；另一些则被称为“out-of-tree” provisioner，指的是存在于 Kubernetes 之外、但可以插入以配合不同存储解决方案的代码。较新版本的\
    \ Kubernetes 还包含一个名为容器存储接口（CSI）[13] 的驱动程序标准。这些 provisioner 呈现一个或多个存储类，为 Kubernetes\
    \ 中的应用程序提供所需的存储抽象。因此，Kubernetes 应用程序可以设计为基于 PVC 和存储类标准工作，并完全独立于实际的物理位置、组织或处理存储所需的驱动程序。\n\
    \n## 集群内存储\n\n这种部署选项通常是指在 Cloud Pak for Data 服务所在的同一个 Kubernetes 集群中，将存储和计算部署在一起。存储设备连接到多个计算工作节点或基础架构节点，而软件定义的存储解决方案通过将卷挂载到需要的位置，协调存储的制备和使用方式。这些节点通常通过集群内部的低延迟、高吞吐量网络连接。此类存储仅供该\
    \ Kubernetes 集群内运行的应用程序和工作负载使用。\n\nKubernetes 原生支持通过使用计算主机的 hostPath [8] 直接挂载卷，也支持使用本地卷的节点亲和机制\
    \ [9]，以解决将 Pod 调度到与存储相同的工作节点上的调度难题。然而，这些选项不提供动态制备支持，而且当底层工作节点离线时，可靠性会受到影响。此外，OpenShift\
    \ 的受限安全上下文 [11] 默认不允许从主机挂载大量此类卷。使用 hostPath 或本地卷还会导致 Kubernetes 应用程序在存储方面产生紧密耦合。应用程序的可移植性以及存储类和制备技术的清晰抽象都会丧失。因此，Cloud\
    \ Pak for Data 不依赖 hostPath 或本地卷类型。\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_281_0.png)\n\
    \n这种组织方式仍可被视为超融合，因为 Kubernetes 集群同时支持存储和计算。Kubernetes 集群中节点之间的私有低延迟网络仍能以高性能方式支持\
    \ Pod 访问存储。\n\n这种变体无法利用存储块和计算的物理共置来实现“本地”挂载优化，但其优势在于简化了节点操作和维护。这种分离有助于确保存储服务不会受到其他\
    \ Kubernetes 工作负载突发流量（即“吵闹邻居”效应）的影响，反之亦然。\n\n下图展示了集中式存储管理解决方案如何（通过标准 NFS 协议或其他自定义机制）暴露卷的示例：\n\
    \n![](img/50e1dac0750b69f2b8e8efff000eb13b_284_0.png)\n\n图 11.4 – 使用 NFS 进行集中式存储管理\n\
    \n存储应由 provisioner 根据需要动态制备，以满足 Kubernetes 中定义的 PVC。驱动程序（或原生的 NFS）支持如何将这些卷物理挂载到调度在不同\
    \ Kubernetes 计算工作节点上的不同 Pod 中。\n\n有关如何使用此 provisioner 以及定义存储类的详细指导，请参阅“延伸阅读”部分的\
    \ [14]。\n\n请注意，从生产角度来看，所分配的 NFS 服务器不应成为单点故障，它必须具有高可用性并支持自动故障转移（也就是说，它不能像单个 Linux\
    \ 系统上的 NFS 守护进程那样简单）。如果 NFS 服务器发生故障，所有 PVC 挂载都将变得不可用。因此，企业级弹性存储管理解决方案对于确保整体可靠性至关重要。\n\
    \n## 运维注意事项\n\n在前面的章节中，我们讨论了为 Cloud Pak for Data 中的容器化服务提供或使用集群内或集群外存储意味着什么。然而，同样关键的是确保存储基础架构本身具有弹性，并存在可确保不丢失数据的运维实践。从灾难恢复（DR）的角度来看，还必须考虑存储故障转移。\n\
    \n在本节中，我们将快速了解一些典型的实践和工具，可用于确保 Cloud Pak for Data 服务具有弹性运行能力，并确保数据保护。\n\n### 集群内存储的持续可用性\n\
    \nKubernetes 的一个核心原则是确保应用程序的持续可用性。这包括跨多个可用区的计算负载均衡和副本。这些可用区可以是公有云中的故障（或可用性）区，也可以是本地部署中独立供电的硬件机架\
    \ [17]。\n\n对于集群内存储而言，这要求存储也必须持续复制——这在很大程度上取决于所使用的存储供应商或技术。以下是持续可用性的示例拓扑，有时也称为双活容灾：\n\
    \n![](img/50e1dac0750b69f2b8e8efff000eb13b_285_0.png)\n\n图 11.5 – 双活容灾\n"
