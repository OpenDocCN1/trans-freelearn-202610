    is the hostname of the OpenShift cluster itself. When a client from outside the
    cluster, such as a web browser, accesses this hostname, OpenShift routes it to
    the ibm-nginx-svc Kubernetes service, which is load-balanced across how many ibm-nginx
    Pods may currently be running.


    OpenShift routes can also be secured using TLS [18] in general. Cloud Pak for
    Data also provides a way to associate custom certificates with its Kubernetes
    service [19].


    # Foundational services and the control plane


    IBM has a broad portfolio of products that are now available as Cloud Paks on
    OpenShift Container Platform. With every such product, there is a common need
    to operate in different data centers, both on-premises and in the cloud, and the
    requirement to integrate with existing enterprise systems. To that end, a set
    of shared services has been developed called the Cloud Pak foundational services
    (CPFS).


    # Cloud Pak foundational services


    CPFS is also known as "Bedrock." It provides key services that run on top of OpenShift
    Container Platform to power all Cloud Paks, including Cloud Pak for Data, and
    serves as a layer to support integration between all Paks.


    These capabilities enabled by the CPFS services include the following:


    +   - **Certificate Management Service**: This service enables Cloud Paks to generate
    TLS certificates, manifest them as Kubernetes secrets, and be mounted in Pods
    that need them. This helps in securing inter-microservice communications and promotes
    easier automatic rotation of certificates.'
