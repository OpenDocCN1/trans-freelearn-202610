    关键在于确保存储块以接近实时的方式在区域之间进行复制。通过这种部署，stateful Pods 无论物理位于哪个区域，都始终可以访问其 PVs。一个存储节点/副本的故障不应导致整个应用程序失败。这是因为其他存储副本应该能够提供必要的数据块。Kubernetes
    中支持这种持续可用性概念的存储驱动程序完全抽象（通过 PVCs）数据是从哪里物理获取的，并且可以在自动故障转移到使用不同副本的存储时自动进行。


    从负载均衡的角度来看，我们通常认为所有计算 Pods 始终处于活动状态并可供使用，而与其位于哪个区域无关。即使整个区域变得不可用，只有计算和存储副本变得无法访问，这意味着其他副本可以填补空缺。


    此类存储驱动程序通常也配置为感知集群拓扑 [18]，例如，通过使用 Kubernetes 节点标签来指定故障区域。这使它们能够将 PV 副本放置在不同的区域中，从而在某个区域丢失时提供弹性。这种复制模型的一个常见问题是“脑裂”效应，即由于不同
    Nodes 无法通信和同步数据的故障情况，存储副本具有不一致的数据块。因此，此类存储驱动程序具有在这些条件下隔离存储的复杂性，以及识别副本已离线过久需要更新以“追赶”或在添加新存储副本时复制数据块的能力。这对于确保应用程序数据在所有副本中始终保持一致至关重要。


    虽然在这些区域之间具有低延迟网络至关重要，但这种多区域复制技术也要求所使用的存储技术具有这种复杂性。例如，Red Hat OpenShift Container
    Storage（Ceph）和 Portworx Enterprise 支持此类要求，大多数公共云 IaaS 存储提供商也是如此。


    使用离集群存储也可以在技术上实现持续存储可用性，尽管将存储区域与 Kubernetes 集群区域对齐需要多一点努力。外部存储管理器，例如 IBM Spectrum
    Scale、Dell EMC Isilon、NetApp onTap 和基于 NAS 的解决方案，传统上提供了跨区域同步复制的机制。


    快照通常存储在同一设备中，这意味着它们的可靠性仅与设备本身一样可靠。因此，存储供应商 [20] 还提供了为云存储创建此类快照的机制，例如 S3 对象存储。


    - **通过可用卷数据的副本：** 这种方法依赖于 rsync 或将来自 PVCs 的某些数据复制到另一个 PVC（通常是远程存储卷）或对象存储。`cpd-cli
    backup-and-restore` 实用程序有一个 Kubernetes 服务，允许我们将数据从 PVs 复制到备份卷。


    然而，这种技术要求该 Kubernetes 命名空间中的所有服务都进入“维护模式”（或完全静默），以防止在复制卷数据时发生任何 I/O。优点是这适用于任何类型的存储，包括
    NFS，用于 PVs，并且不需要存储系统提供任何特定功能。


    ### Quiescing Cloud Pak for Data services


    为了实现应用级一致性，在备份进行期间必须暂停写入。为了支持此类要求，`cpd-cli` 实用程序包含一个 `backup-restore quiesce`
    命令，指示服务暂时进入维护模式。该实用程序还缩减了一些 Deployments 以防止任何 I/O 活动。一旦备份完成，则使用 `backup-restore
    unquiesce` 命令将服务从维护中扩展。注意，虽然这种 **quiesce** 意味着 Cloud Pak for Data 在该持续时间内不可用——即处于维护模式——但能够实现应用一致的备份也很重要。


    **quiesce** 机制也可以用于外部存储备份或快照，例如当 NFS 用于 PVs 时。例如，当 IBM Spectrum Scale 提供 NFS 卷时，您可以使
    Cloud Pak for Data 命名空间中的服务进入静默状态，然后触发 GPFS 快照并使服务恢复静默。


    ### Db2 database backups and HADR


    确保数据库以可靠和连续的方式运行对于企业来说通常至关重要。虽然支持写入暂停/quiesce，但 Db2 提供了额外的技术，允许 Db2 数据库在备份操作进行期间仍可在线
    [22] 使用。这也独立于所选择的存储技术，并且可以支持增量备份。


    Db2 高可用性灾难恢复（HADR）配置 [23] 将两个 Db2 数据库实例配对，这些实例可能存在于同一集群中（例如，不同的 Kubernetes 命名空间）甚至远程集群。在此配置中，数据从活动源数据库复制到备用目标。当发生全站故障或活动
    Db2 数据库被认为无法访问时，会自动故障转移到备用数据库。Db2 HADR 自动客户端重定向（ACR）功能是一种机制，客户端连接到失败的 Db2 数据库时，可无缝切换到新的活动
    Db2 数据库。


    ### Kubernetes cluster backup and restore


    前面描述的快照机制和 `cpd-cli backup-and-restore` 实用程序只能将数据从 PVCs 复制并恢复到新的 PVCs。在新集群中恢复此类备份时，期望目标集群以与原始集群相同的方式设置。这意味着必须在目标集群中安装必要的
    Cloud Pak for Data 服务，并且在数据恢复过程进行之前，所有 Kubernetes 资源都必须存在。


    Velero 项目 [24] 引入了一种备份所有 Kubernetes 资源工件的机制。这允许在数据恢复发生之前轻松重建目标集群。Red Hat 为 OpenShift
    集群引入的 OpenShift API for Data Protection Operators [25]，结合 Ceph-CSI 驱动程序，提供了一种更好地运营化集群级备份和恢复的方法。它还支持其他用例，例如复制或迁移集群。


    ### Summary


    在本章中，我们介绍了 Kubernetes 中 PVs 的概念以及 Cloud Pak for Data 如何与不同的存储技术和供应商协同工作。我们还讨论了存储拓扑以及可能存在于不同企业中的供应商或技术。


    本章还强调了数据保护以及备份和恢复的运营化，以及 DR 实践的重要性。确保您对存储有深入的理解，可确保 Cloud Pak for Data 服务以及在其之上构建的企业解决方案以弹性和所需的性能水平运行。


    ## 12 Multi-Tenancy


    多租户是一种软件架构设计，其中多个用户或组织共享同一软件实例及其底层资源。这是 **Software-as-a-Service (SaaS)** 提供的标准做法，例如
    IBM Cloud 中的 Cloud Pak for Data as a service，但对租户的解释以及租户如何在本地或私有云中实现可能存在很大差异。企业中的
    **Security** 和 **compliance** 要求，以及 *quality of service assurances*，在决定可以共享多少方面发挥着重要作用。


    如今，任何真正的云原生平台堆栈能够开箱即用地至少实现一定程度的多租户共享已成为基本期望。仅通过重用现有共享基础设施即可加速支持新项目或计划。简单地假设为每个租户分配独立的
    **virtual machines (VMs)** 就足以实现多租户——毕竟，底层裸机资源确实是共享的。但为企业中的每个部门提供专用的 VM 集群在成本上是不可行的；仅管理多个集群或软件安装所需的操作成熟度本身就会变得
    prohibitively expensive。


    大多数企业，无论是在托管的公共云基础设施还是本地运行，都更喜欢租户之间在性能、安全性、**privacy** 方面有一致保证的共享程度。仅仅将 VM 分配给租户已不再被认为足够，并且随着容器化技术的出现，现在可以实现更细粒度的多租户，甚至多个租户共享同一台
    VM。这也使安全问题变得更加复杂，因为即使操作系统也被共享，不同租户的进程并排运行。


