    在本章中，我们将涵盖以下主要内容：


    - 数据——世界上最有价值的资产

    - 以数据为中心交付所面临的挑战

    - 企业数据架构

    - 数据虚拟化——随时随地访问数据

    - 使用 Cloud Pak for Data 实现数据资产现代化


    ## 数据——世界上最有价值的资产


    事实是，*世界上每家公司都是数据公司。*正如《经济学人》杂志在2017年正确指出的那样，数据（而非石油）是世界上最宝贵的资源，除非你将数据作为战略差异化优势加以利用，否则你很可能会错失机会。


    纵观历史上成功的公司，它们都拥有可持续的竞争优势——要么是规模经济（苹果、英特尔、AWS），要么是网络效应（Facebook、Twitter、Uber 等）。**数据**是获得可持续竞争优势的新基础。世界上超过90%的数据无法通过谷歌搜索到，这意味着世界上大部分有价值的数据都归其所属组织私有。那么，你能做些什么来释放专有数据所固有的潜力呢？


    正如我们在*第1章《数据是推动 AI 主导数字化转型的燃料》*中所讨论的，CEO 和商业领袖深知，他们需要利用数字化转型来推动增长、加快上市速度并促进创新。为了加速这一转型，他们需要通过将企业数据作为战略差异化优势，整合跨组织边界的流程。务必记住，你的数据只有你自己才能访问。


    ## 以数据为中心的企业


    让我们看几个将数据作为战略差异化优势的企业示例：


    1. 百思买通过拥抱数字营销，以及基于客户数据的个性化协助与推荐，成功实现了业务转型。这次数字化转型历时多年，但最终帮助公司在竞争中生存并繁荣发展，而其竞争对手
    Circuit City 则申请破产并清算关闭了所有门店。


    集中收集、治理、存储、处理和分析这些数据的复杂性、成本、时间及出错风险也在呈指数级增长。同样，作为所有这些数据来源的数据库和数据存储库也变得更加强大，自身拥有充足的处理能力和数据存储能力。


    从历史上看，企业通过记录系统（大型机和客户端/服务器应用程序）来管理数据。应用程序的数量有限，生成的数据大部分是结构化的——利用关系数据库来持久化数据。然而，这种模式已不再适用。随着过去十年移动电话和社交网络的爆炸式增长，应用程序的数量和生成的数据量呈指数级增加。更重要的是，数据不再是结构化的——关系数据库虽然仍与遗留应用程序相关，但并非为处理实时生成的非结构化数据而构建。这催生了一批新的数据存储，如
    MongoDB、Postgres、CouchDB、GraphDB 等，统称为 NoSQL 数据库。这些应用程序被归类为交互系统：


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_60_0.png)


    图 3.1 – 移动、社交、云和大数据正在改变数据格局


    虽然交互系统的发展导致数据的体量、速度和多样性呈指数级增长，但也同样使企业难以利用其数据，因为数据现在分散在组织内部种类繁多、数量众多的数据存储中：


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_61_0.png)


    图 3.2 – 不同的工作负载需要不同的数据存储


    与此同时，如今业务用户在创建和处理自己的数据集方面更加娴熟，他们会利用 Excel 和其他桌面工具来满足业务需求。数据仓库和数据湖无法应对数据格局的广度和深度，企业开始寻求更复杂的解决方案。更增加挑战的是，市场上智能设备开始大量涌现，这必将进一步颠覆制造业、分销、医疗保健、公用事业、石油、天然气等行业的数据架构。企业必须进行现代化改造并持续创新，以应对这些不断变化的业务状况。


    在探索潜在解决方案以及 Cloud Pak for Data 如何应对这些挑战之前，让我们先审视典型的企业数据架构以及尚未解决的固有差距。


    ## 企业数据架构


    如今，典型的企业拥有多个数据存储、记录系统、数据仓库、数据湖和最终用户应用程序，如下图所示：


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_62_0.png)


    图 3.3 – 不断演化的企业数据格局


    此外，这些数据存储通常分布在不同的基础设施上——包括本地部署和多个公有云的组合。虽然大部分数据是结构化的，但我们越来越多地看到非结构化和半结构化数据集被持久化到
    NoSQL 数据库、Hadoop 或对象存储中。不断演化的复杂性和各种集成接触点开始让企业不堪重负，通常使业务用户难以找到满足其业务需求的合适数据集。这在以下典型企业
    IT 架构图中得以体现，其中数据及其相关基础设施是分布式的、不断增长的且相互连接的：


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_63_0.png)


    图 3.4 – 以数据为中心意味着复杂性不断增加


    以下是企业采用的所有流行数据存储的详细列表，以及它们所满足的具体需求：


    **关系数据库**


