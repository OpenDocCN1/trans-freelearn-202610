    in a way that makes sense to the business.


    High-quality data is essential for high-quality outcomes for any analytics we
    perform using the data. Data quality entails the following:


    +   - **Completeness:** Having a good understanding of all the related data assets.

    +   - **Accuracy:** Common data problems such as missing values, incorrect reference
    data, and so on that must be eliminated so that we have consistent data.

    +   - **Availability:** Data must be available on demand.

    +   - **Timeliness:** The up-to-dateness of the data is crucial to making the
    right decisions.


    The data quality analysis area of Cloud Pak for Data performs the following tasks:


