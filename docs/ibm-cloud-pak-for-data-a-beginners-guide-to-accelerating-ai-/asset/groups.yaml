  - '[PAGE 21]


    IBM enjoys a strong Data and AI portfolio, with 100+ products being developed
    and acquired over the past 40 years, including some marquee offerings such as
    Db2, Informix, DataStage, Cognos Analytics, SPSS Modeler, Planning Analytics,
    and more. The depth and breadth of IBM’s portfolio is what makes it stand out
    in the market. With Cloud Pak for Data, IBM is doubling down on this differentiation,
    further simplifying and modernizing its portfolio as customers look to a hybrid,
    multi-cloud future.


    # Introduction to the AI ladder


    We all know data is the foundation for businesses to drive smarter decisions.
    Data is what fuels digital transformation. But it is AI that unlocks the value
    of that data, which is why AI is poised to transform businesses with the potential
    to add almost 16 trillion dollars to the global economy by 2030. You can find
    the relevant source here: https://www.pwc.com/gx/en/issues/data-and-analytics/publications/artificial-intelligence-study.html.


    However, the adoption of AI has been slower than anticipated. This is because
    many enterprises do not make a conscious effort to lay the necessary data foundation
    and invest in nurturing talent and business processes that are critical for success.
    For example, the vast majority of AI failures are due to data preparation and
    organization, not the AI models themselves. Success with AI models is dependent
    on achieving success in terms of how you collect and organize data. Business leaders
    not only need to understand the power of AI but also how they can fully unleash
    its potential and operate in a hybrid, multi-cloud world.


    This section aims to demystify AI, common AI challenges and failures, and provide
    a unified, prescriptive approach (which we call "the AI ladder") to help organizations
    unlock the value of their data and accelerate their journey to AI.


    As companies look to harness the potential of AI and identify the best ways to
    leverage data for business insights, they need to ensure that they start with
    a clearly defined business problem. In addition, you need to use data from diverse
    sources, support best-in-class tools and frameworks, and run models across a variety
    of environments.


    According to a study by MIT Sloan Management Review, 81% of business leaders (http://marketing.mitsmr.com/offers/AI2017/59181-MITSMR-BCG-Report-2017.pdf)
    do not understand the data and infrastructure required for AI and "No amount of
    AI algorithmic sophistication will overcome a lack of data [architecture] – bad
    data is simply paralyzing."


    Put simply: There is no AI without IA (information architecture).'
