    # # The case of a data and AI platform – recap


    In the previous chapter, we introduced IBM''s prescriptive approach to operationalizing
    data and AI in your enterprise, and subsequently, we introduced you to the broad
    capabilities of Cloud Pak for Data. In this section, we will outline how Cloud
    Pak for Data powers the implementation of the AI Ladder practice in your enterprise.


    Cloud Pak for Data, as an open platform, breaks down silos between different products,
    enabling them to be manifested as cloud-native services on top of the same OpenShift
    Kubernetes platform. Cloud Pak for Data enables such services to easily integrate
    through a common control plane and, importantly, provides a personalized, integrated
    user experience for end users to collaborate naturally, without even being aware
    of product or service boundaries.


    On this one platform, capabilities such as data virtualization help modernize
    data access for the hybrid cloud and data can be easily accessed in place across
    clouds. Data cataloging and governance services can piggyback on data virtualization
    and other data sources to deliver on broader governed data access plane solutions,
    which in turn facilitates trust in data that is made available to data science,
    analytics reporting, and machine learning services. On the same platform, operations
    teams can deploy ML models at scale, enabling model monitoring with bias detection
    to support continuous model evolutions.


    Development, experimentation, and production deployments can be supported on the
    same platform, promoting collaborations between teams of users with varying roles
    and responsibilities to work closely. Authentication and authorization, customized
    in the control plane to comply with enterprise regulations, enable seamless access
    across all services. Consistent APIs and concepts such as user groups, API keys,
    and tokens enable the development of custom applications and solutions in a standard
    manner.


    Administration and operations are simplified through operators powered by Red
    Hat OpenShift Kubernetes. Portability of deployment across on-premises and public
    cloud infrastructure is assured, enabling bursts into the cloud when needed. Cloud-native
    practices enable continuous delivery and integration for enterprise applications
    and solutions. Security controls and operational auditing are built into the platform
    to ensure adherence to compliance requirements in the enterprise. The deployment
    and management of multiple tenants on the same set of shared compute resources
    also make Cloud Pak for Data much more cost-effective for an enterprise.'
