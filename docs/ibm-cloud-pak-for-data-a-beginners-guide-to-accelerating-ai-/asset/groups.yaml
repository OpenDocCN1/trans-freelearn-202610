    ## Watson Assistant


    An AI assistant accesses and "learns from" hundreds of customer touchpoints while
    sharing this data with other systems in an integrated way, so that the customer
    enjoys a consistent experience and is made to feel that the company knows them.
    Well-executed AI-powered chatbots improve the Net Promoter Score (NPS) through
    speed-to-resolution and round-the-clock accessibility, and through the channels
    in which users are most comfortable, be it web chat, text messages, social media
    sites, or a phone call to customer services. The Watson Assistant service enables
    you to go beyond chatbots to build conversational interfaces into your apps, devices,
    and channels. Most chatbots mimic human interactions, but when there is a misunderstanding,
    users become frustrated. Watson Assistant does more for your users. It knows when
    to search for an answer in a knowledge base, when to ask for clarification, and
    when to direct users to an actual person. Watson Assistant can run on any cloud,
    so you can bring AI to your data and apps, wherever they live:


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_172_0.png)


    Figure 7.12 – IBM Watson Assistant cartridge


    Watson Assistant leverages and includes Watson Discovery for some of its capabilities.


    ## Watson API Kit


    The **Watson API Kit** cartridge on Cloud Pak for Data includes the services shown
    in the following subsections.


    ### Watson Knowledge Studio


    The **Watson Knowledge Studio** service uses AI to identify entities, relationships,
    and other linguistic elements that are unique to your industry. In essence, it
    helps to teach Watson the language of your domain:


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_174_0.png)


    Figure 7.14 – IBM Watson Knowledge Studio


    ### Watson Language Translator


    The **Watson Language Translator** service enables you to translate text into
    more than 45 languages. In addition, with the Watson Language Translator API,
    you can perform the following:


    - Identify the language used in a document.

    - Translate documents, such as Word documents and PDF files, into other languages
    with the same format and layout as the original document (this feature is currently
    in beta):


    The **Watson Text to Speech** service provides an API that converts written text
    to natural-sounding speech in a variety of languages and voices. For example,
    you can use the service to do the following:


    - Improve customer experience and engagement by interacting with users in multiple
    languages and tones.

    - Increase content accessibility for users with different abilities.

    - Provide audio options to avoid distracted driving.

    - Automate customer service interactions to increase efficiency.


    ## IBM OpenPages


    The IBM **OpenPages** cartridge on Cloud Pak for Data is an integrated **Governance,
    Risk, and Compliance (GRC)** suite that empowers managers to identify, manage,
    monitor, and report on risk and compliance initiatives that span your enterprise.


    The OpenPages service provides a powerful, scalable, and dynamic toolset that
    enables you to tackle the following use cases:


    - Business continuity management

    - Financial controls management

    - Internal audit management

    - IT governance

    - Model risk governance

    - Operation risk management

    - Policy management

    - Regulatory compliance management

    - Third-party risk management


    Then, install one or more of the following optional packages depending on your
    use case:


    - **Financial Crimes Insight for Alert Triage**: Enable analysts to quickly assess
    alerts using Watson''s analytic and cognitive capabilities to determine which
    alerts warrant further investigation.

    - **Financial Crimes Insight for Claims Fraud**: Uncover suspicious behavior early
    in the insurance claims process before fraudulent claims are paid.

    - **Financial Crimes Insight for Conduct Surveillance**: Identify, profile, and
    prioritize employee misconduct using holistic surveillance, behavioral analysis,
    and cognitive insights:


    Let''s look at IBM Financial Crimes Insight with Watson:


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_178_0.png)


    Figure 7.17 – IBM Financial Crimes Insight with Watson


    Next, we have IBM Surveillance Insight:


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_179_0.png)


    Figure 7.18 – IBM Surveillance Insight


    Now that we have covered the Infuse rung and its seven cartridges that help address
    a variety of business use cases, we''ll cover the modernization upgrades to Cloud
    Pak for Data cartridges.


    ## Modernization upgrades to Cloud Pak for Data cartridges


    IBM has thousands of customers running its industry-leading data and AI offerings
    such as Db2, DataStage, Master Data Management, SPSS Modeler, Decision Optimization,
    Cognos Analytics, and Planning Analytics. Historically, these offerings have had
    their own independent architecture and ecosystems running on bare metal servers
    or virtual machines. With the advent of Cloud Pak for Data, all of these offerings
    are containerized and available as a service on Cloud Pak for Data. Modernizing
    a standalone offering to a cartridge on Cloud Pak for Data unlocks a number of
    benefits to clients, such as the following:


    - Cloud-native benefits: The modern cloud-native architecture of Cloud Pak for
    Data means it''s easier to provision and scale a service, seamless upgrades, and
    administration. This unlocks major cost savings for enterprises.

