    From this user experience, as shown in the preceding screenshot, the administrator
    can then look at each Pod, get more details, or access logs for troubleshooting.
    They could even choose to restart a Pod if they see it malfunctioning.


    Note that this interface is meant to complement what is available in the OpenShift
