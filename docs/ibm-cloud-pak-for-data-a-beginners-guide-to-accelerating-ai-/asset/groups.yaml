    \ grant them specific access to different Cloud Pak for Data services.\n\nA role\
    \ is an entity that is used to define what collection of permissions (privileges)\
    \ are granted to a particular user persona.\n\nCloud Pak for Data services introduce\
    \ one or more out-of-the-box roles to get started with and an experience to help\
    \ manage roles. Enterprises can use such roles to adhere to *separation of duties*\
    \ policies needed for compliance reasons. For example, administrators may be denied\
    \ access to data (which is the default for database instances they did not provision\
    \ in the first place), and also to data catalogs, by revoking specific permissions.\n\
    \nGranular privileges can also be granted, for example, only granting a specific\
    \ set of users the ability to manage user access and to manage group access, but\
    \ they need not be granted access to other administrative functions.\n\nThe administrator\
    \ typically configures roles using the user management experience, as shown in\
    \ the following figure:\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_256_0.png)\n\
    \nFigure 10.5 – Managing roles experience\n\nThe following tables show examples\
    \ of permissions assigned to the different out-of-the-box roles [38] in Cloud\
    \ Pak for Data, as well as the associated service offerings:\n\n- **Administrator\
    \ role:** **Administrator** is a pre-defined role in Cloud Pak for Data and includes\
    \ a specific set of permissions as listed in the following table. The set of permissions\
    \ present depends on which services have been installed. For example, if Watson\
    \ Knowledge Catalog is not present, then the **Access governance artifacts** permissions\
    \ will not be available.\n\n  | Permission | Category | Services that contribute\
    \ the permission |\n  |---|---|---|\n  | Access governance artifacts | Governance\
    \ artifacts | Watson™ Knowledge Catalog |\n  | Administer platform | Platform\
    \ administration | Cloud Pak for Data control plane |\n  | Create deployment spaces\
    \ | Deployments | - Watson Knowledge Catalog<br>- Watson Studio |\n  | Create\
    \ projects | Projects | - Watson Knowledge Catalog<br>- Watson Studio |\n  | Create\
    \ service instances | Service instances | Cloud Pak for Data control plane |\n\
    \  | Manage asset discovery | Data curation | Watson Knowledge Catalog |\n  |\
    \ Manage catalogs | Catalogs | - Watson Knowledge Catalog<br>- Watson Studio |\n\
    \  | Manage data protection rules | Governance artifacts | Watson Knowledge Catalog\
    \ |\n  | Manage data quality | Data curation | Watson Knowledge Catalog |\n  |\
    \ Manage data transformation | Data integration | DataStage® |\n  | Manage governance\
    \ categories | Governance artifacts | Watson Knowledge Catalog |\n  | Manage information\
    \ assets | Catalogs | Watson Knowledge Catalog |\n  | Manage metadata | Data curation\
    \ | Watson Knowledge Catalog |\n  | Manage workflows | Workflows | Watson Knowledge\
    \ Catalog |\n\n  Figure 10.6 – Permissions granted to the Administrator role\n\
    \n- **Data Scientist** role: This role designates the user persona typically involved\
    \ with advanced analytics and machine learning. They reference data from catalogs\
    \ and collaborate with other users within projects. A small set of permissions\
    \ is typically sufficient for such users, as listed in the following table. This\
    \ also grants them the permission to work with deployments such as machine learning\
    \ models.\n\n  | Permission | Category | Services that contribute the permission\
    \ |\n  |---|---|---|\n  | Access catalogs | Catalogs | - Watson Knowledge Catalog<br>-\
    \ Watson Studio |\n  | Create deployment spaces | Deployments | - Watson Knowledge\
    \ Catalog<br>- Watson Studio |\n  | Create projects | Projects | - Watson Knowledge\
    \ Catalog<br>- Watson Studio |\n\n  Figure 10.7 – Permissions granted to the Data\
    \ Scientist role\n\n- **User** role: The **User** role is special as it typically\
    \ indicates the least set of privileges assigned to a certain type of guest user.\
    \ Assigning the **User** role to somebody just implies that they will be able\
    \ to sign in and view any content that does not require any additional authorizations.\
    \ Assigning the **User** role also serves to introduce new users to the platform,\
    \ which enables them to be subsequently added (as individuals) into user groups\
    \ or assigned access to projects, catalogs, or even databases.\n\n  However, when\
    \ certain services, such as Watson Knowledge Catalog or Watson Studio are installed,\
    \ by default, they grant additional permissions to this **User** role. This enables\
    \ these users to at least work privately within the confines of their own projects\
    \ or deployment spaces. Of course, just as with any pre-defined role, administrators\
    \ can choose to alter this role and remove these permissions or introduce additional\
    \ ones to suit their definition of a \"least\" privileged role.\n\n  | Permission\
    \ | Category | Services that contribute the permission |\n  |---|---|---|\n  |\
    \ Create deployment spaces | Deployments | - Watson Knowledge Catalog<br>- Watson\
    \ Studio |\n  | Create projects | Projects | - Watson Knowledge Catalog<br>- Watson\
    \ Studio |\n\n  Figure 10.8 – Permissions granted to the User role\n"
