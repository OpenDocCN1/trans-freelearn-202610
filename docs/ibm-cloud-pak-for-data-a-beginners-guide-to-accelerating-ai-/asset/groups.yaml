    \ and by isolating them to *cpd-operators*, you can ensure they are scoped to\
    \ only the Cloud Pak for Data namespaces.\n\n> **Note**\n> \n> As depicted in\
    \ the preceding diagram, each tenant namespace has its own private copy of the\
    \ Cloud Pak for Data control plane scaled out as needed, including a front door\
    \ with its own private ingress/route. OpenShift enables the exposure of this front\
