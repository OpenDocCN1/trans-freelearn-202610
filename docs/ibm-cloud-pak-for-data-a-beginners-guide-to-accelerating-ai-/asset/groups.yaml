  - '[PAGE 68]


    A common scenario in distributed data systems is that many databases store data
    in a common schema. For example, you may have multiple databases storing sales
    data or transactional data, each for a set of tenants or a region. Data virtualization
    in Cloud Pak for Data can automatically detect common schemas across systems and
    allow them to appear as a single schema in data virtualization – a process known
    as **schema folding**. For example, a SALES table that exists in each of the 20
    databases can now appear as a single SALES table and can be queried through **Structured
    Query Language (SQL)** as one virtual table.


    # Data virtualization versus ETL – when to use what?


    Historically, Data warehouses and data lakes are built by moving data in bulk
    using ETL. One of the leading ETL products in the market happens to be from IBM
    and is called IBM DataStage. So, it begs the question as to when someone should
    use data virtualization versus an ETL offering. The answer depends on the use
    case. If the intent is to explore and analyze small sets of data in real time
    and where data can change every few minutes or hours, data virtualization is recommended.
    Please note that the reference to small sets of data alludes to the actual data
    that''s transferred, not the dataset that a query is performed on. On the flip
    side, if the use case requires processing huge datasets across multiple sources
    and where data is more or less static over time (historical datasets), an ETL-based
    solution is highly recommended.


    # Platform connections – streamlining data connectivity


    Cloud Pak for Data also includes the concept of **platform connections**, which
    enable enterprises to define data source connections universally. These can then
    be shared by all the different services in the platform. This not only simplifies
    administration but enables users across different services to easily find and
    connect to the data sources. Cloud Pak for Data also offers flexibility to define
    connections at the service level to override platform connections. Finally, administrators
    can opt to either set user credentials for a given connection or force individual
    users to enter their respective credentials. The following is a screenshot of
    the platform connections capability of **Cloud Pak for Data v4.0**, which was
    released on June 23, 2021:'
