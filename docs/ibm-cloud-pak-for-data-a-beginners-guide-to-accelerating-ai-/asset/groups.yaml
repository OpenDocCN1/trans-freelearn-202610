    \nThe Secrets API [29] in Cloud Pak for Data provides the ability to access sensitive\
    \ credentials from configured vaults. This helps avoid the need to use plain-text\
    \ credentials as part of developer-authored content such as notebooks or scripts.\
    \ Using a vault, Enterprises can also control policies to rotate keys and credentials\
    \ independently.\n\nSince Cloud Pak for Data's Secrets API retrieves the contents\
    \ of the vault only when required, it will get the latest password or key. This\
    \ also prevents the need for users to update passwords in many places.\n\nCloud\
