    \ guidance."
  - '[PAGE 267]


    +   - OpenShift Container Platform v4 introduces a compliance operator [31] to
    help ensure compliance and detect gaps with RHEL CoreOS based hosts in general.
    The **National Institute of Standards and Technology (NIST)** organization, among
    other things, also provides utilities and guidance for robust compliance practices
    that enterprises strictly adhere to as a general principle. The OpenShift Compliance
    Operator provides the right level of automation to help enterprises leverage the
    NIST OpenSCAP utility, for example, for scanning and enforcement of policies in
    such complex, dynamic environments.


    Cluster admins are generally tasked with the responsibility of ensuring that the
    cluster is set up appropriately to meet compliance standards. It is also important
    that there is sufficient monitoring of privileged actions in the cluster, whether
    in the infrastructure or at higher levels, such as with Cloud Pak for Data. The
    next section identifies additional configuration that would be needed to ensure
    the reporting of all privileged activities.


    # Auditing


    Auditing provides a way for enterprises to prove compliance and to monitor for
    irregularities.


    Auditing can be enabled at various levels in the stack:


    +   - At the operating system level [32], RHEL provides mechanisms for the enterprise
    to monitor violations of any security policies. The audit system logs access watches
    for any sensitive or critical file access on that host.

    +   - At the OpenShift Container Platform level [33], Administrators can configure
    auditing levels to log all requests to the Kubernetes API server by all users
    or other services.

    +   - At the Cloud Pak for Data level, audit logging supports generating, collecting,
    and forwarding **Cloud Auditing Data Federation (CADF)** [34] compliant audit
    records for core platform auditable events.


    You can configure IBM Cloud Pak for Data audit logging to forward audit records
    to your **security information and event management (SIEM)** solutions, such as
    **Splunk**, **LogDNA**, or **QRadar**.


    The audit logging implementation uses Fluentd output plugins [35] to forward and
    export audit records. After you install IBM Cloud Pak for Data, the Audit Logging
    Service is not configured out of the box. External SIEM Configuration [36] can
    be added to the `zen-audit-config` Kubernetes configmap to define where the Audit
    Logging Service forwards all collected audit records.'
  - '[PAGE 268]


    While audit logging generally only covers specific privileged actions, there are
    typically additional regulatory requirements with regards to tracking access of
    data by users and applications. In the following section, we will see how that
    too can be implemented.


    # Integration with IBM Security Guardium


    Guardium provides the ability to monitor data access and to ensure data security.
    IBM Security Guardium''s **Database Activity Monitoring (DAM)** capability offers
    an advanced centralized audit repository, reporting mechanisms, as well as tools
    to support forensics and compliance audits. These capabilities are complementary
    to the system-level auditing and privileged action audit recording described in
    previous sections as they can expand to data protection as well.


    Cloud Pak for Data enables integration with Guardium in two ways:


    +   - **Auditing sensitive data access**: Cloud Pak for Data users with the Manage
    Catalog permissions have the authority to identify sensitive data, such as **Personally
    identifiable information (PII)**, and configure it to be monitored by Guardium
    [39]. Since Cloud Pak for Data''s Watson Knowledge Catalog service can also scan
    and tag sensitive data, it makes it easier for authorized users to enable those
    data assets to be monitored by Guardium.

    +   - Cloud Pak for Data facilitates the provisioning of databases as well. It
    is critical for regulatory compliance that access to such data also be monitored.
    This is facilitated by a service called the Guardium *E-STAP* [40] service that
    is provisioned on top of Cloud Pak for Data and configured to intercept traffic
    to DB2 databases. All access to the DB2 database is then only conducted through
    the E-STAP interface. This service is configured to work with the Guardium appliance,
    which enables access logging and reporting, and access policy enforcement.


    Guardium is an established and mature offering in the data protection and compliance
    segment. Many enterprises already leverage Guardium to automate compliance controls
    in a centralized fashion and the ability to integrate with Guardium enables Cloud
    Pak for Data customers to accelerate compliance readiness efforts with regard
    to their own data, complementing what is offered by the Cloud Pak for Data platform
    and operating environment.


    In this section, we explored what techniques are available for the enterprise
    to get ready for regulatory compliance. In general, Cloud Pak for Data provides
    elegant mechanisms for RBAC and for the enterprise to be able to configure or
    change out-of-the-box roles to support any regulatory compliance, such as separation
    of duties.'
  - '[PAGE 269]


    Compliance requirements vary quite a bit depending on the industry the customer
    is in, as well as geographical requirements. In the preceding section, we also
    identified the need to appropriately configure all elements of the stack, including
    OpenShift Container Platform and its host nodes, as well as Cloud Pak for Data
    itself for privileged action auditing, and other integration options, such as
    Guardium to support data access monitoring.


    # Summary


    In this chapter, we discussed how Cloud Pak for Data is developed and the IBM
    secure engineering practices that are employed. We also looked at how container
    images are delivered from trusted locations for customers to pull from or download.


    Once Cloud Pak for Data is installed, care must be taken to ensure that it is
    operated in a secure manner. We looked at constructs with which RHEL and OpenShift
    provide a secure foundation for workloads and the security posture of Cloud Pak
    for Data on OpenShift Container Platform.


    We also looked at how administrators are tasked with the responsibility of managing
    user and group access to ensure authorization is enforced in addition to configuring
    appropriate identity managers for authentication, as well as defining appropriate
    roles or modifying out-of-the-box user roles.


    Security is critical to any software installation and Cloud Pak for Data is no
    exception. This chapter, in addition to describing the technology, also provided
    pointers to practical mechanisms to secure and monitor each part of the stack
    to ensure the safe and reliable operation of Cloud Pak for Data in your enterprise.


    In the next chapter, we will look at storage, yet another foundational and critical
    construct for the reliable operation of Cloud Pak for Data.


