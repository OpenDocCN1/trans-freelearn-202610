    \ Enterprise Linux for the host and OpenShift Container Platform represent the\
    \ technological foundation. Hence, to ensure compliance, the foundation needs\
    \ to be properly configured. A few key aspects of the technical stack that help\
    \ in compliance readiness are listed as follows:\n\n+   - RHEL supports a strong\
    \ security and compliance posture such as setting up for the **Federal Information\
    \ Processing Standard (FIPS)** publication 140-2. Several advanced techniques\
