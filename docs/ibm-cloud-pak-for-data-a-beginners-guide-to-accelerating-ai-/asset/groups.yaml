    \ Cloud Pak for Data – with v3 and v3.5\n\nFollowing are the namespace scoped\
    \ service accounts used in Cloud Pak for Data – with v4:\n\n| Account [v4] | Description\
    \ |\n|---|---|\n| zen-admin-sa | Bound to the cpd-admin-role and, by default,\
    \ associated with the OpenShift \"restricted\" SCC. |\n| zen-editor-sa | Bound\
    \ to the cpd-admin-role and associated with the OpenShift \"restricted\" SCC.\
    \ |\n| zen-viewer-sa | Bound to the cpd-viewer-role and, by default, with the\
    \ OpenShift \"restricted\" SCC. This account can only view Kubernetes artifacts\
    \ within that namespace. |\n| zen-norbac-sa | Associated, by default, with the\
    \ OpenShift \"restricted\" SCC and is not associated with any Kubernetes role,\
    \ thus has no API access. This account is similar to the out-of-the-box default\
    \ service account. It is used by services or components that should not be granted\
    \ any RBAC privileges. |\n| default | Automatically created in every OpenShift\
    \ project, bound to the restricted SCC, and is not granted any RBAC privileges;\
    \ that is, no roles are bound. This default service account will be used for end\
    \ user workloads such as notebooks and Python pods and will not be allowed to\
    \ perform any kind of actions inside the namespace. |\n\nFigure 10.3 – Namespace\
    \ scoped service accounts used in Cloud Pak for Data – with v3.5 and v4\n\nHence,\
    \ system Pods and Jobs typically use **cpd-admin-sa** to perform higher-privileged\
