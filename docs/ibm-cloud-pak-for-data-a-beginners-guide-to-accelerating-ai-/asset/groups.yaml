  - '[PAGE 45]


    Cloud Pak for Data is an open platform with a healthy mix of proprietary, third-party,
    and open source content, which we will explore next.


    # An open ecosystem


    Cloud Pak for Data is an open and modular platform that allows clients to deploy
    services they need. One of the highlights of the platform is its vibrant ecosystem,
    which consists of IBM services (further segmented into base and premium), third-party
    services, industry accelerators, and open source content.


    The following services constitute the base Cloud Pak for Data platform:


    +   - **Db2 Warehouse:** A data warehouse designed for high performance and in-database
    analytics. Runs on a single node for cost-efficiency or on multiple nodes for
    improved performance.

    +   - **Data Virtualization:** Built leveraging IBM''s patented technology, Data
    Virtualization enables access to distributed data from disparate data sources
    in real time without physically moving the data. Furthermore, queries are optimized
    to run where data resides, cutting down the response time.

    +   - **Db2 EventStore:** A datastore designed to rapidly ingest and analyze streamed
    data for event-driven applications.

    +   - **Streams:** Build solutions that drive real-time business decisions by
    combining streaming and stored data with analytics.

    +   - **Watson Knowledge Catalog:** Find the right data fast. Discover relevant,
    curated data assets using intelligent recommendations and user reviews.

    +   - **IBM Regulatory Accelerator:** Streamline the process of complying with
    regulations.

    +   - **Watson Studio:** Has three key components as seen here:

    +     - **Build:** Build custom models and infuse your business with AI and machine
    learning. This component covers the model development capabilities in Watson Studio
    (with AutoAI as a key differentiator).

    +     - **Deploy:** *The model deployment capabilities in Watson Studio* (previously
    Watson Machine Learning). Deploy machine-learning models in production at scale.

    +     - **Trust:** The trusted AI capabilities in Watson Studio, including explainability,
    bias, and drift detection (previously Watson OpenScale). Infuse your AI with trust
    and transparency and understand how your AI models make decisions to detect and
    mitigate bias.'
