    现在，让我们来了解一下 Cloud Pak for Data 的打包和部署选项。


    ## 打包和部署选项


    Cloud Pak for Data 可通过以下三种部署选项获得：


    - 可在任何公有云上部署和管理，或作为本地私有云部署和管理的 Cloud Pak for Data 软件

    - Cloud Pak for Data System，一种超融合系统（在单个集群中包含计算、虚拟化、存储和网络），具有优化的硬件和软件

    - 由 IBM 在 IBM Cloud 上管理的 Cloud Pak for Data“即服务”，提供真正的 SaaS 体验


    Cloud Pak for Data 软件有三个版本：


    - 企业版

    - 标准版

    - 非生产版


    虽然这三个版本之间没有功能差异，但标准版具有可扩展性限制，而非生产版只能用于开发和 QA 部署。


    ## Red Hat OpenShift


    **OpenShift** 是一个允许企业运行容器化应用程序和工作负载的平台，底层由 Kubernetes 驱动。OpenShift 的核心是由大量开发者和提交者社区贡献的开源软件支撑的。因此，市场上有不同版本的
    OpenShift。真正驱动 OpenShift 的开源项目称为 **Origin Kubernetes Distribution（OKD）**，您可以免费使用它。另一方面，OpenShift
    Container Platform 是 Red Hat 的商业版本，附带 Red Hat 支持，使您的应用程序和工作负载能够部署到任何公有云或私有云上。


    ### 什么是 Kubernetes？


    如今的应用程序越来越多地构建为离散的功能组件，每个组件都可以作为容器交付。这实现了抽象、敏捷开发和可扩展部署。然而，这也意味着每个应用程序都有更多需要管理的部分。为了大规模处理这种复杂性，我们需要一个策略驱动的编排平台，来规定容器运行的方式和位置。Kubernetes（也称为
    K8s 或 Kube）正是为应对这些挑战而设计的。它是领先的容器编排框架，可自动执行部署、管理和扩展容器化应用程序所涉及的许多手动流程。


    Kubernetes 为开发人员、IT 运维人员和业务所有者带来了显著的好处，并实现了可扩展性、工作负载可移植性和敏捷开发。它最初由 Google 的工程师开发和设计，是
    Google Cloud 服务背后的秘密武器。Red Hat 是最早与 Google 合作开展 Kubernetes 项目的公司之一，并且一直是领先的贡献者。Kubernetes
    项目目前归属于 **云原生计算基金会（CNCF）**，这得益于 Google 于 2015 年的捐赠。


    ## 第 2 部分：产品能力


    在本部分中，我们将了解 IBM AI 阶梯各层级的产品能力，以及 Cloud Pak for Data 如何帮助将这些能力作为一体化平台交付。我们将回顾 Cloud
    Pak for Data 上可用的 IBM 和第三方高级服务，以及该平台最常见的用例模式，并了解 Cloud Pak for Data 如何满足混合多云需求。


    本部分包含以下章节：


    - 第 3 章，收集 – 让数据简单且可访问

    - 第 4 章，整理 – 创建可信的分析基础

    - 第 5 章，分析 – 以信任和透明度构建、部署和扩展模型

    - 第 6 章，多云策略与 Cloud Satellite

    - 第 7 章，IBM 与合作伙伴扩展服务

    - 第 8 章，客户用例


    ## 3 收集 – 让数据简单且可访问


    企业正艰难应对数据在数量和种类上的激增。数据现代化正是应对这一关键挑战的方法，它通过让数据变得简单且可访问来建立强大的数据基础，无论数据位于何处。由于 AI
    中使用的数据通常非常动态和流动，且来源不断扩展，因此对客户而言，对数据收集方式进行虚拟化至关重要。Cloud Pak for Data 通过专有、开源和第三方服务的组合，提供了一种灵活的方法来应对这些现代挑战。


