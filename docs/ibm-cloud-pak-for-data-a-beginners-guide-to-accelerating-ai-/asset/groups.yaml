  - '[PAGE 314]


    In the next section, we will look at one such example, where a different granularity
    in tenancy permits a lot more sharing, but at the expense of security and isolation
    requirements.


    # In-namespace sub-tenancy with looser isolation


    Even if the same OpenShift cluster is shared, there is still the overhead and
    expense of running multiple installations of Cloud Pak for Data services for each
    tenant. While namespace-based separation provides much more assurance in terms
    of meeting security, compliance, and performance SLA guarantees, it comes with
    additional expense. For example, we would need to install separate copies of the
    Kubernetes deployments in each tenant namespace, and that implies more oversight
    and maintenance personnel (even if the Operator pattern makes it easier to upgrade,
    scale, and so on). Separate copies also take up additional compute and storage
    resources, thus increasing the cost of procurement in the first place, as well
    as ongoing operational expenses.


    In some cases, in the interests of reducing expenditure, some enterprises may
    choose to share more resources between tenants, even if it means losing flexibility
    or reduced isolation. In this section, we will explore what it means to share
    the same Cloud Pak for Data instance among multiple sub-tenants.


    # Approach


    This borrows from the idea of sublets, where a primary tenant decides to share
    resources with sub-tenants. In this example, the primary tenant is assigned a
    Cloud Pak for Data instance by the Cluster Operations team, as usual. The tenant
    admin then decides to define their own sub-tenants to grant access to.


    The primary tenant admin typically does the following:


    +   - Creates a Cloud Pak for Data user group for each sub-tenant. Users and LDAP
    groups can be mapped in to uniquely identify each sub-tenant user.

    +   - Assigns the appropriate platform roles – perhaps only giving the authority
    to create projects and catalogs.

    +   - Provisions instances of services such as databases and grants access rights
    to individual sub-tenant groups – and even delegates ownership/administration
    to individual tenant users.'
