    \ to provision service instances on their own within the confines of that Cloud\
    \ Pak for Data instance.\n\n## Monitoring\n\nWith tenant instance scoped monitoring\
    \ and management, cluster admins can delegate day-to-day monitoring to individual\
    \ tenant admins. Cluster admins still retain the rights to control the namespace\
    \ as a whole, especially by establishing resource quotas, and tenant admins operate\
    \ within those boundaries to decide how to monitor and throttle usage inside their\
    \ tenancy.\n\nThe Cloud Pak for Data Monitoring and Alerting frameworks can help\
    \ tenant admins understand utilization within their instance, as well as decide\
    \ how much compute they must allocate to individual use cases or services.\n\n\
    ## Operating and maintaining tenant resources\n\nCluster admins can also empower\
    \ tenant admins to perform any needed day 2 maintenance on their own. Patches\
    \ or version upgrades of individual services (just like installation and provisioning,\
    \ as described previously) can be triggered via custom resources by the tenant\
    \ admins themselves, if that authority has been granted. Custom resources can\
    \ also be easily leveraged to scale out services in that specific instance of\
    \ Cloud Pak for Data (scaleConfig fields in v4 work similar to how the cpd-cli\
    \ scale command works with v3.5, except that it's driven by an Operator) with\
    \ just namespace scope privileges being needed.\n\nThe monitoring and management\
    \ experience provides an easy way for tenant admins to manage their own Cloud\
    \ Pak for Data instances, including identifying and correcting failing services.\
    \ They have access to individual logs and the ability to grab advanced diagnostics\
    \ for IBM support, all without needing their cluster admins to engage.\n\nBackup\
    \ (and restore, when needed) is also a key concern for tenants. While cluster\
    \ admins ensure the reliability of storage and other infrastructure across all\
    \ tenants, backing up tenant-specific data and metadata can also be entrusted\
    \ to tenant admins.\n\nThe cpd-cli backup-restore utility, as described in Chapter\
    \ 11, Storage, requires scoped Kubernetes RBAC, and this utility can be leveraged\
    \ by the tenant admins. Note, however, that with storage snapshots and other advanced\
    \ techniques to move storage to remote sites, some initial setup may still be\
    \ needed that the Cluster Operations team must manage. Importantly, each tenant's\
    \ backup images can still be uniquely identifiable, isolated from other tenants'\
    \ backups, and kept protected.\n\n## A summary of the assessment\n\nIn the previous\
    \ sections, we discussed how Cloud Pak for Data and OpenShift can support the\
    \ key requirements of multi-tenancy.\n\nThe following table provides a quick summary\
    \ of how each requirement can be met and the mechanisms available that can be\
    \ leveraged to implement that requirement:\n\n| Tenancy Aspects | Mechanism |\n\
    |---|---|\n| **Isolation** | *Individual Kube Namespace quotas/OpenShift Projects\
    \ for each Cloud Pak for Data instance* |\n| 1. Users – Authentication, Roles\
    \ and Authorization | ✓ If needed, can support *different LDAP/AD or SAML configurations\
    \ per instance* (each instance has its own unique user management service) |\n\
    | 2. Compute Resources | ✓ Namespace quotas – set by the cluster admin. |\n| 3.\
    \ Access to Instance | ✓ Unique DNS-based routes for each instance. |\n| 4. Storage\
    \ Usage | ✓ Completely separated PVCs (in different namespaces) with different\
    \ PVs – no sharing across instances. |\n| **Security** | *RBAC privileges & Service\
    \ Accounts scoped only to that namespace* |\n| 1. Restricting Kube Cluster-Level\
    \ Privileges | ✓ Service accounts and role binding – scoped to Project namespaces.\
    \ |\n| 2. Network Access | ✓ Kube network policies for hardening *like a firewall\
    \ around an RHOS Project namespace*. |\n| 3. Auditing | ✓ *Per-tenant SIEM forwarding\
    \ supported.* |\n| **Management** | *Administration privileges scoped to a namespace*\
    \ |\n| 1. Monitoring/Metering | ✓ Different tenant admin users for different instances.\
    \ Tenants are managed independently. |\n| 2. Ops – Backup/DR, Scale, Patch, Upgrade\
    \ | ✓ Ops privileges scoped to that OpenShift project’s namespace. |\n| 3. Serviceability\
    \ | ✓ Serviceability utilities only capture diagnostics that are appropriate for\
    \ that instance. |\n| 4. Service Installations | ✓ Different instances can have\
    \ different sets of services at different versions scaled independently from other\
    \ tenants. |\n\nFigure 12.4 – Summary of the mechanisms and techniques that support\
    \ multi-tenancy\n\nAs a result of this approach to implementing multi-tenancy,\
    \ enterprises and cluster administrators can decide how best to mix and match\
    \ different tenants on the same shared OpenShift-based infrastructure.\n\nThe\
    \ following diagram shows the topology of different tenants using different versions\
    \ of Cloud Pak for Data services:\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_313_0.png)\n\
    \nThe Cluster Operations team could choose to use the same OpenShift cluster for\
    \ both production and development tenants, as shown in the preceding diagram.\
    \ Special tenants could be assigned dedicated compute nodes (with increased cost)\
    \ if appropriate. Each tenant could have deployed and pinned specific versions\
    \ of the control plane itself and different Cloud Pak for Data services, as well\
    \ as having configured them at different scale sizes.\n\n> **A note on operand\
    \ version choices for tenants**\n> \n> While operands themselves could be pinned\
    \ to different versions, it is highly recommended that the set of Cloud Pak for\
    \ Data operators be continuously upgraded to the latest release level, even in\
    \ *air-gapped* data centers, to ensure the latest critical defect fixes are applied\
    \ and any security vulnerabilities are addressed. Cloud Pak for Data operators\
    \ support pinning operands to specific versions, even if the operators themselves\
    \ get upgraded.\n> \n> Here, these operators support provisioning and maintaining\
    \ *multiple versions* of the operands, and they can support both the tenant's\
    \ choice to *automatically* upgrade operands to the latest released version or\
    \ to *retain* (pin) operands to a specified version, with admins deciding when\
    \ to manually upgrade.\n\nIt is important to note that not all enterprises may\
    \ have the same requirements or policies. Some may require even more stringent\
    \ isolations, say to the point of needing dedicated compute nodes for each tenant.\
    \ Production tenants may need to be located on completely different OpenShift\
    \ clusters, even in different networks or data centers. Other tenants may have\
    \ relaxed requirements – for example, tenants that are designated as *development*\
    \ environments typically do not have audits enabled.\n"
  mdcn: "\n\n## 自助服务与管理\n\n对于集群运维团队来说，为每个租户用户在日常运营中提供全程指导并不具有成本效益。从合规角度来看，通常也不允许此类集群管理员深度嵌入租户业务中。此外，对于基于云的系统，人们普遍期望租户能够自行满足大多数需求，而无需\
    \ IT 支持。然而，整体集群安全仍是集群运维团队的责任，他们需要能够确保租户无法超出其实例范围。\n\n因此，这需要在保持严格的安全约束和租户每天自行管理其实例所需的灵活性之间取得微妙平衡。在本节中，我们将探讨\
    \ OpenShift 和 Cloud Pak for Data 提供的功能，帮助企业平衡这一需求。\n\n## 部署与升级 – 实现服务和版本的自主选择\n\
    \n不同的租户需要部署不同的 Cloud Pak for Data 服务集合。他们甚至可能出于稳定性考虑，将服务“固定”到特定版本——通常，生产环境会保持在经过充分测试的水平，而开发环境则具有更大的灵活性。\n\
    \n通过审慎使用 Operator 自定义资源，单个租户可以自行决定安装和升级每个服务。对于支持 *服务实例* 概念的服务，例如 Db2，经授权的租户用户甚至可以在无需\
    \ Kubernetes 访问的情况下自行启动数据库实例。\n\n因此，集群管理员可以授予租户管理员在其命名空间中的权限，使其能够自行部署 Cloud Pak\
    \ for Data 服务。反过来，租户管理员可以授权租户用户的一个子集在该 Cloud Pak for Data 实例的范围内自行部署服务实例。\n\n\
    ## 监控\n\n通过租户实例范围的监控和管理，集群管理员可以将日常监控委托给各个租户管理员。集群管理员仍然保留控制整个命名空间的权利，特别是通过建立资源配额，而租户管理员则在这些边界内运营，以决定如何在其租户范围内监控和限制使用。\n\
    \nCloud Pak for Data 的监控和告警框架可以帮助租户管理员了解其实例内的利用情况，并决定需要为各个用例或服务分配多少计算资源。\n\n##\
    \ 运营与维护租户资源\n\n集群管理员还可以授权租户管理员自行执行所需的二日维护工作。单个服务的补丁或版本升级（与前面描述的安装和部署一样）可以通过自定义资源由租户管理员自行触发，前提是已授予该权限。自定义资源也可以轻松用于扩展该特定\
    \ Cloud Pak for Data 实例中的服务（v4 中的 scaleConfig 字段的工作方式与 v3.5 中 cpd-cli scale 命令类似，只是它由\
    \ Operator 驱动），只需命名空间范围的权限即可。\n\n监控和管理体验为租户管理员提供了一种简单的方式来管理自己的 Cloud Pak for Data\
    \ 实例，包括识别和纠正失败的服务。他们可以访问各个日志并获取 IBM 支持所需的详细诊断，而无需集群管理员介入。\n\n备份（以及在需要时恢复）也是租户的关键关注点。虽然集群管理员确保所有租户的存储和其他基础设施的可靠性，但租户特定数据和元数据的备份也可以委托给租户管理员。\n\
    \n如第 11 章《存储》中所述，cpd-cli backup-restore 实用程序需要范围化的 Kubernetes RBAC，并且该实用程序可以被租户管理员使用。需要注意的是，对于存储快照和其他将存储迁移到远程站点的高级技术，仍可能需要集群运维团队管理的初始设置。重要的是，每个租户的备份映像仍然可以唯一标识，与其他租户的备份隔离并得到保护。\n\
    \n## 评估总结\n\n在前面的章节中，我们讨论了 Cloud Pak for Data 和 OpenShift 如何支持多租户的关键需求。\n\n下表提供了每个需求如何得到满足以及可用于实现该需求的机制的快速总结：\n\
    \n| 租户方面 | 机制 |\n|---|---|\n| **隔离** | *每个 Cloud Pak for Data 实例的独立 Kube 命名空间配额/OpenShift\
    \ 项目* |\n| 1. 用户 – 身份验证、角色和授权 | ✓ 如有需要，可支持 *每个实例不同的 LDAP/AD 或 SAML 配置*（每个实例拥有其独特的身份管理服务）\
    \ |\n| 2. 计算资源 | ✓ 命名空间配额 – 由集群管理员设置。 |\n| 3. 实例访问 | ✓ 每个实例的唯一基于 DNS 的路由。 |\n\
    | 4. 存储使用 | ✓ 完全分离的 PVC（在不同命名空间中）使用不同的 PV – 实例之间不共享。 |\n| **安全** | *仅限该命名空间的 RBAC\
    \ 权限和服务帐户* |\n| 1. 限制 Kube 集群级权限 | ✓ 服务帐户和角色绑定 – 范围限定于项目命名空间。 |\n| 2. 网络访问 | ✓\
    \ Kube 网络策略用于加固 *如同在 RHOS 项目命名空间周围的防火墙*。 |\n| 3. 审计 | ✓ *支持按租户的 SIEM 转发。* |\n\
    | **管理** | *范围限定到命名空间的管理权限* |\n| 1. 监控/计量 | ✓ 不同实例的不同租户管理员用户。租户独立管理。 |\n| 2. 运维\
    \ – 备份/DR、扩展、补丁、升级 | ✓ 运维权限范围限定于该 OpenShift 项目的命名空间。 |\n| 3. 可服务性 | ✓ 可服务性实用程序仅捕获该实例适当的诊断信息。\
    \ |\n| 4. 服务安装 | ✓ 不同实例可以拥有不同集合的服务，在不同版本下独立扩展，不受其他租户影响。 |\n\n图 12.4 – 支持多租户的机制和技术总结\n\
    \n通过这种多租户实现方法，企业和集群管理员可以决定如何在同一共享的 OpenShift 基础架构上最好地混合和匹配不同的租户。\n\n下图显示了不同租户使用不同版本\
    \ Cloud Pak for Data 服务的拓扑结构：\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_313_0.png)\n\
    \n如前图所示，集群运维团队可以选择对生产和开发租户使用同一个 OpenShift 集群。如果合适，可以为特殊租户分配专用的计算节点（成本增加）。每个租户可以部署并固定控制平面本身的特定版本以及不同的\
    \ Cloud Pak for Data 服务，并且可以以不同的规模大小进行配置。\n\n> **关于租户操作数版本选择的说明**\n> \n> 虽然操作数本身可以固定到不同版本，但强烈建议将\
    \ Cloud Pak for Data Operator 集合持续升级到最新发布级别，即使在 *离线* 数据中心也是如此，以确保应用最新的关键缺陷修复并解决任何安全漏洞。Cloud\
    \ Pak for Data Operator 支持在 Operator 本身升级时将操作数固定到特定版本。\n> \n> 在这里，这些 Operator\
    \ 支持部署和维护操作数的 *多个版本*，并且可以支持租户选择 *自动* 将操作数升级到最新发布版本，或 *保留*（固定）操作数到指定版本，由管理员决定何时手动升级。\n\
    \n需要注意的是，并非所有企业都可能具有相同的需求或策略。有些可能需要更严格的隔离，例如为每个租户需要专用计算节点。生产租户可能需要位于完全不同的 OpenShift\
    \ 集群中，甚至在不同的网络或数据中心。其他租户可能要求宽松——例如，被指定为 *开发* 环境的租户通常不启用审计。\n\n"
