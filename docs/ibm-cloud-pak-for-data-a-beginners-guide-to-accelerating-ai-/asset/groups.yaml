    集群管理员可以向 OpenShift 项目引入 NodeSelector 注解，以指定哪些计算工作节点（通过标签标识）用于调度该租户的 Pod。这确保了在原本共享的
    OpenShift 集群中，该租户拥有专用节点。作为租户入职流程的一部分，集群管理员只需使用此注解，即可决定是使用共享计算主机还是分配专用主机。虽然对于某些服务（如数据库）可以使用
    Kubernetes 的 Pod 级节点亲和性概念，但在必要时，通常更容易将租户的所有节点分配到专用节点。


    ## 审查租户要求


    在第9章“技术概述、管理和行政管理”中，我们简要介绍了支持 Cloud Pak for Data 多租户所需解决的关键属性。


    从某种意义上说，我们可以将这些要求与传统操作系统环境中应用程序的租户概念联系起来，尽管规模更大。Unix 或 Linux 系统会安装所有必需的软件，超级用户（“root”）负责管理该系统。root
    用户将授权用户访问该系统，并将他们分配到不同的用户组（“租户”）。通过使用简单的文件系统权限（组 ID 和用户 ID），这些用户可以在其租户组内协同工作，并在一定程度上与其他租户隔离。用户可以执行和访问他们（或其组）已被授予访问权限的应用程序，而操作系统安全原语（如
    SELinux 和 AppArmor）则确保严格控制跨进程访问。


    > **注意**

    > Kubernetes 集群仅仅是新的“操作环境”，并在更高层次上支持与操作系统相同的许多范式。集群管理员是“root”用户，他们可以向其他用户授予各种基于角色的访问权限。从多租户的角度来看，此类管理员现在可以利用额外的操作环境原语，例如
    OpenShift 安全上下文约束、虚拟项目/Kubernetes 命名空间中的租户隔离，以及细粒度的 RBAC，如第10章“安全与合规性”所述。


    在本节中，我们将评估以下关键租户要求：


    - 隔离

    - 安全与合规性

    - 自助服务管理


    我们将从在不同 Kubernetes 命名空间中部署 Cloud Pak for Data 实例的角度来审视这些要求。


    ## 隔离租户


    一个基本要求是，一个租户账户的用户完全不知道另一个租户的存在。即使一个用户属于两个租户账户——例如，一个员工被授予访问两个部门实例的权限——也需要有一种显式机制来从一个租户上下文“切换”到另一个租户上下文——甚至可能需要不同的登录流程。当与不同租户实例关联的
    Kubernetes 微服务在同一集群中运行、网络距离很近且数据可能可访问时，建立边界并强制严格分离就变得非常重要。


    让我们看看 Cloud Pak for Data 和 OpenShift 在实现隔离方面提供了哪些功能。


    ### 配置身份验证


    Cloud Pak for Data 允许命名空间中的每个租户安装决定如何对该租户组中的用户进行身份验证。例如，一个租户实例可以配置为针对一个 LDAP 服务器进行身份验证，而另一个实例可以配置为使用另一个。或者，不同的
    LDAP（子）组可用于不同的实例。


    可能希望为所有（部门）租户实例配置针对同一企业 SSO 提供商的单点登录（SSO）。然而，即使在这种情况下，也可以控制对各个 Cloud Pak for Data
    实例的访问，以便只有在该实例中具有特定角色的用户才能访问。


    ### 授权用户访问


    在第10章“安全与合规性”中，我们详细讨论了角色和权限，包括如何根据企业需求进行定制。在管理用户访问（甚至非常细粒度的级别）时，角色是基石。根据策略或实践，集群管理员甚至可以选择修改开箱即用的
    Cloud Pak for Data“管理员”角色，也许是为了移除（重新）配置身份验证或管理运行状况的能力，只保留查看监控信息的能力。


    除了平台（控制平面）之外，每项服务或功能都需要授权。例如，不同的用户组可以被指定为项目或目录中的编辑者，而其他用户，即使已成功通过身份验证，也可能被拒绝访问该资源。同样，但更细粒度地，个人用户或用户组可以被授予对特定虚拟表或视图的*选择性*访问权限，作为数据虚拟化服务的一部分，而其他用户可能被拒绝访问，这与传统关系数据库完全相同。


    ### 确保计算资源的隔离


    每个租户在自己的命名空间中拥有所需微服务的*唯一副本*，并且可以独立地*扩展*它们以适应预期的负载或并发需求。命名空间级别的 ResourceQuotas
    确保可以为每个租户*预留*计算资源。企业还可以选择为租户分配专用主机，以进一步保证隔离和计算资源的可用性。


    正如我们之前讨论的，OpenShift 项目 UID 和 SELinux 可以确保进程（即使是位于*同一*主机上的进程）得到隔离。


    ### 外部化路由和入口点


    每个租户都有独特的前门和路由。借助 OpenShift 和外部负载均衡器，甚至可以发布全新的 URL，其中包含适合该租户的主机和域名。每个前门路由还可以与特定于租户的
    TLS 证书相关联，表明哪个特定租户“拥有”该 Cloud Pak for Data 实例。


    这提供了一种简单而优雅的方式来隔离客户端到各个租户 Cloud Pak for Data 实例的流量。


    ### 通过存储确保隐私


    使用 Kubernetes 命名空间还保证了持久卷仅在该命名空间范围内可用。如*第11章“存储”*所述，**持久卷声明（PVC）**仅在一个命名空间内有效，用于将存储卷挂载到
    Cloud Pak for Data 微服务 Pod 上。即使使用了集群范围的共享存储解决方案，使用 PVC 也能保证一个租户的卷不会被另一个租户的微服务访问。


    ## 保护网络访问安全


    在前面的章节中，我们确定了前门和独特路由如何帮助保证从集群*外部*访问各个租户 Cloud Pak for Data 实例时的隔离。Kubernetes 包含网络策略的概念，这一概念与防火墙规则非常相似，可进一步加强租户实例免受集群*内部*入侵访问的安全性。


    可以编写网络策略，允许同一命名空间内的微服务之间的访问，并默认拒绝来自其他命名空间的访问。作为*全部拒绝*规则的例外，定义了额外的*允许*策略，以允许 HTTPS
    访问每个租户的前门，以及允许操作员命名空间与每个租户命名空间之间的访问。*拒绝*策略阻止租户之间的流量，但各自的前门除外。租户之间的交互（*如果确实*需要）需要通过各自前门中的授权检查来完成，就像外部客户端从集群外部访问一样。


    因此，虽然仍然需要允许 Operator 和租户命名空间之间的某些访问，但通过精心设计网络策略，租户可以确保其免受来自 Kubernetes 集群外部或内部的入侵。


    ## 审计


    在这种多租户架构中，软件服务的运营方式始终需要制衡。从监管合规的角度来看，审计是企业用来提供安全和受监控运营保证的有力工具。在*第10章“安全与合规性”*中，我们讨论了集群运营团队可以采用的许多机制，以确保安全性和合规性。


    租户通常需要遵守合规性要求，或从安全角度监控其 Cloud Pak for Data 实例的使用情况。此类租户不应访问整个集群的审计或监控记录，而只能访问其实例范围内的记录。


    Cloud Pak for Data 包含一个实例范围的审计服务，如*第10章“安全与合规性”*所述。如果获得适当授权，每个租户管理员或安全负责人可以仅配置其
    Cloud Pak for Data 实例，将所有相关审计事件转发到**安全信息和事件管理（SIEM）**系统。即使所有租户和集群运营团队使用相同的 SIEM，也可以保持唯一标识每个租户的能力，并且可以发布特定于租户的审计报告。


