    \ IBM 的现代数据和 AI 平台，以及它的一些关键差异化优势。我们将讨论 Red Hat OpenShift、它所带来的隐含云优势，以及构成 Cloud\
    \ Pak for Data 基础的平台基础服务。\n- *第 3 章，收集：让数据简单且可访问*，提供了一种灵活的方法来应对以数据为中心交付的现代挑战，这些挑战来自数据在数量和种类上的激增，以及专有、开源和第三方服务的混合。\n\
    - *第 4 章，组织：创建可信的分析基础*，让您了解 Cloud Pak for Data 如何启用 Data Ops（数据操作），协调人员、流程和技术，以快速向数据公民、操作、应用程序和**人工智能（AI）**交付可信赖的、业务就绪的数据。\n\
    - *第 5 章，分析：以信任和透明度构建、部署和扩展模型*，解释如何以更智能的方式分析数据，并利用可视化和 AI 模型，使您的组织能够获得新的洞察并做出更好、更明智的决策。\n\
    - *第 6 章，多云策略和 Cloud Satellite*，提供在整个业务中实现 AI 运营化的方法，让您的员工能够专注于更高价值的工作。\n- *第\
