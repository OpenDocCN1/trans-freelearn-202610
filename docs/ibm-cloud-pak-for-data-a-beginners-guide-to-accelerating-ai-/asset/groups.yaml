  - '[PAGE 22]


    IBM recognizes this challenge our clients are facing. As a result, IBM built a
    prescriptive approach (known as **the AI ladder**) to help clients with the aforementioned
    challenges and accelerate their journey to AI, no matter where they are on their
    journey. It allows them to simplify and automate how organizations turn data into
    insights by unifying the collection, organization, and analysis of data, regardless
    of where it lives. By climbing the AI ladder, enterprises can build a governed,
    efficient, agile, and future-proof approach to AI. Furthermore, it is also an
    organizing construct that underpins the Data and AI product portfolio of IBM.


    It is critical to remember that AI is not magic and requires a thoughtful and
    well-architected approach. Every step of the ladder is critical to being successful
    with AI.


    # The rungs of the AI ladder


    The following diagram illustrates IBM''s prescriptive approach, also known as
    **the AI ladder:**


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_22_0.png)


    Figure 1.2 – The AI ladder – a prescriptive approach to the journey of AI


    The AI ladder has four steps (often referred to as the *rungs* of the ladder).
    They are as follows:


    +   1. **Collect: Make data simple and accessible.** Collect data of every type
    regardless of where it lives, enabling flexibility in the face of ever-changing
    data sources.

    +   2. **Organize: Create a business-ready analytics foundation.** Organize all
    the client’s data into a trusted, business-ready foundation with built-in governance,
    quality, protection, and compliance.'
  - '[PAGE 23]


    +   3. **Analyze: Build and scale AI with trust and explainability.** Analyze
    the client''s data in smarter ways and benefit from AI models that empower the
    client''s team to gain new insights and make better, smarter decisions.


    +   4. **Infuse: Operationalize AI throughout the business.** You should do this
    across multiple departments and within various processes by drawing on predictions,
    automation, and optimization. Craft an effective AI strategy to realize your AI
    business objectives. Apply AI to automate and optimize existing workflows in your
    business, allowing your employees to focus on higher-value work.


    Spanning the four steps of the AI ladder is the concept of **Modernize** from
    IBM, which allows clients to simplify and automate how they turn data into insights.
    It unifies collecting, organizing, and analyzing data within a multi-cloud data
    platform known as Cloud Pak for Data.


    IBM''s approach starts with a simple idea: run anywhere. This is because the platform
    can be deployed on the customer''s infrastructure of choice. IBM supports Cloud
    Pak for Data deployments on every major cloud platform, including Google, Azure,
    AWS, and IBM Cloud. You can also deploy Cloud Pak for Data platforms on-premises
    in your data center, which is extremely relevant for customers who are focused
    on a hybrid cloud strategy.


    The way IBM supports Cloud Pak for Data on all these infrastructures is by layering
    **Red Hat OpenShift** at its core. This is one of the key reasons behind IBM''s
    acquisition of Red Hat in 2019. The intention is to offer customers the flexibility
    to scale across any infrastructure using the world''s leading open source steward:
    Red Hat. OpenShift is a Kubernetes-based platform that also allows IBM to deploy
    all our products through a modern container-based model. In essence, all the capabilities
    are rearchitected as microservices so that they can be provisioned as needed based
    on your enterprise needs.


    Now that we have introduced the concept of the AI ladder and IBM''s Cloud Pak
    for Data platform, let''s spend some time focusing on the individual rungs of
    the AI ladder and IBM''s capabilities that make it stand out.


    # Collect – making data simple and accessible


    The Collect layer is about putting your data in the appropriate persistence store
    to efficiently collect and access all your data assets. A well-architected "Collect"
    rung allows an organization to leverage the appropriate data store based on the
    use case and user persona; whether it''s Hadoop for data exploration with data
    scientists, OLAP for delivering operational reports leveraging business intelligence
    or other enterprise visualization tools, NoSQL databases such as MongoDB for rapid
    application development, or some mixture of them all, you have the flexibility
    to deliver this in a single, integrated manner with the Common SQL Engine.'
