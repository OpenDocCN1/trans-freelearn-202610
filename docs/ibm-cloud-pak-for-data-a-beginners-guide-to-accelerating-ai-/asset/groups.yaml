    在下一章中，我们将了解 Cloud Pak for Data 生态系统，它补充并扩展了基础 Cloud Pak for Data 所包含的功能。


    ## 7


    ## IBM 与合作伙伴扩展服务


    生态系统是任何成功平台的关键组成部分，**Cloud Pak for Data** 也不例外。如*第 2 章“Cloud Pak for Data：简介”*所述，它采用两级打包结构，包括“一个附带一组模块化服务的基础平台，但作为一个整体进行定价和打包，让客户可以按需使用”和“可选且单独定价/打包的高级扩展服务”。


    本章重点介绍来自 **IBM** 的扩展服务，也称为来自我们生态系统合作伙伴的插件和功能。IBM 扩展服务与 Cloud Pak for Data 紧密集成，并包含使其能够独立运行或作为集成平台一部分运行的平台服务。另一方面，第三方扩展需要
    Cloud Pak for Data 和 **Red Hat OpenShift**。


    在本章中，我们将涵盖以下主要主题：


    - IBM 与第三方扩展服务

    - 收集类插件：**Db2 Advanced** 和 **Informix**

    - 组织类插件：Data Stage、Information Server、主数据管理和 IBM Virtual Data Pipeline

    - 注入类插件：Cognos Analytics、Planning Analytics、Watson Assistant、Discovery、Watson
    AI for Operations、Watson Financial Crimes Insight 等

    - Cloud Pak for Data 插件的现代化升级


    ## IBM 与第三方扩展服务


    扩展服务概念最好用 iPhone 的简单类比来解释。当某人购买 iPhone 时，除了硬件和 Apple iOS 操作系统外，您还会收到 Apple 预装且预集成的多款应用，例如相机、地图、电话、iMessage、音乐等。这些预装且紧密集成的应用让客户从第一天起就能上手使用，满足其大部分日常需求。这些开箱即用的应用已包含在初始购买中。此外，您还可以从
    App Store 下载第三方高级应用，这些应用单独定价和打包。这些是可选的应用程序，用于满足特定需求并提升 iPhone 的整体价值。


    Cloud Pak for Data 的两级打包结构（如下所示）与 iPhone 有些类似。购买 Cloud Pak for Data 时，您有权使用一系列数据和
    AI 功能，这些功能用于收集、组织、分析数据，以及将 AI 注入业务流程。当然，这些是模块化服务集，使客户只需使用所需功能，同时保留未来扩展或伸缩的能力。与
    App Store 类似，Cloud Pak for Data 也包含一个由 IBM 和第三方供应商提供的高级服务生态系统，使客户可以选择性地使用更广泛的功能。这些被称为扩展服务。IBM
    扩展服务紧密集成。它们包含 Red Hat OpenShift 的使用权，以及使其能够独立运行或作为更广泛平台一部分运行的通用平台服务。因此，它们也被称为插件。另一方面，第三方服务以
    Cloud Pak for Data 和 Red Hat OpenShift 为先决条件，并支持与平台进行有限的集成。尽管如此，它们非常有价值，有助于补充基础平台的功能：


    ## 类比：iPhone 应用


    Apple 应用、通过市场销售的第三方应用以及自定义应用


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_159_0.png)


    ## 多云


    图 7.1 – Cloud Pak for Data：两级打包结构


    上图说明了 iPhone 类比，以及如何通过 IBM、第三方合作伙伴和自定义应用提供的高级扩展服务来扩展和定制 Cloud Pak for Data。


    ## 收集类扩展服务


    数据是企业做出更明智决策的基础，也是推动数字化转型的关键。AI 阶梯中的“收集”层旨在让数据变得简单易用，Cloud Pak for Data 包含多项基础功能，可满足大多数客户需求，例如数据虚拟化、Db2
    Warehouse、Big SQL 等。此外，客户还可以使用以下小节中详细描述的扩展服务。


    ## Db2 Advanced


    IBM Db2 为事务性工作负载提供高级数据管理和分析功能。Db2 是世界上第一个关系数据库，没有处理器、内存或数据库大小限制，因此非常适合任何规模的工作负载。Db2
    服务使您能够在 Cloud Pak for Data 集群中创建这些数据库，以便您可以治理数据并将其用于更深入的分析：


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_160_0.png)


    图 7.2 – Db2 插件


    Cloud Pak for Data 平台上的 Db2 数据库可以满足多种用例要求，包括以下方面：


    - 为金融机构、零售店、网站等持久化和管理事务性数据

    - 复制事务性数据以运行分析，而不影响常规业务运营

    - 通过**符合 ACID 的数据库**确保数据完整性

    - 确保对业务运营的低延迟和实时洞察


    ## Informix


    **Informix** 服务在 IBM Cloud Pak for Data 上提供 Informix 数据库。高性能 Informix 引擎提供丰富的功能，包括**时间序列、空间、NoSQL、**和
    SQL 数据，可通过 **MQTT、REST** 和 **MongoDB** API 访问。


    将 Informix 数据库集成到 Cloud Pak for Data 可带来以下好处：


    - 为快速变化的数据模型提供运营数据库

    - 提供集成到运营数据库中的轻量级低延迟分析

    - 存储来自**物联网（IoT）**设备或传感器的大量数据

    - 存储和提供多种不同类型的内容：


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_161_0.png)


    图 7.3 – Informix 插件


    ## 虚拟数据管道


    **虚拟数据管道（VDP）**支持为数据科学、分析和测试目的访问类生产数据。传统上，企业会采用耗时的复制生产数据的方法来实现此目的，这会导致敏感数据的暴露风险更高。借助
    Cloud Pak for Data 中的 VDP 服务，我们现在可以创建单个存储高效、可选掩码的物理数据源黄金副本。这可以进一步与其他数据源结合，并使用
    **CP4D** 数据虚拟化功能进行虚拟化：


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_162_0.png)


    图 7.4 – 虚拟数据管道


    VDP 可用于以下用例：


    - 缩短应用程序测试和开发时间

    - 降低存储成本

    - 为测试、开发和分析提供安全的自助式数据供应解决方案


