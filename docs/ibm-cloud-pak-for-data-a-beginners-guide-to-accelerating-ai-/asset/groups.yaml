    ## 摘要


    如今，托管服务/SaaS 绝对必不可少，Cloud Pak for Data 提供了一套全面且不断发展的功能，可满足端到端的客户需求。通过简化打包、定价以及现代化升级激励，IBM
    让现有客户和新客户都能轻松采用 Cloud Pak for Data 即服务。在本章中，您了解了 Cloud Pak for Data 的不同部署选项、受支持的第三方云，以及其托管服务（Cloud
    Pak for Data SaaS 产品）的概览。您还了解了 IBM 的愿景，即在您选择的任何基础设施（包括第三方云提供商）上提供 Cloud Pak for
