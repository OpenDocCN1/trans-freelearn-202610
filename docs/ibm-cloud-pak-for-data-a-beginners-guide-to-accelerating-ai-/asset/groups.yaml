    \n即使同一个 OpenShift 集群被共享，仍有为每个租户运行多个 Cloud Pak for Data 服务安装所带来的开销和费用。虽然基于命名空间的分离在满足安全、合规和性能\
    \ SLA 保证方面提供了更多保障，但它会带来额外的费用。例如，我们需要在每个租户命名空间中安装 Kubernetes 部署的单独副本，这意味着需要更多监督和维护人员（即使\
    \ Operator 模式使升级、扩展等变得更容易）。单独的副本还会占用额外的计算和存储资源，从而增加最初的采购成本，以及持续的运营费用。\n\n在某些情况下，出于减少支出的考虑，一些企业可能会选择在租户之间共享更多资源，即使这意味着失去灵活性或隔离性降低。在本节中，我们将探讨在多个子租户之间共享同一个\
    \ Cloud Pak for Data 实例意味着什么。\n\n## 方法\n\n这借鉴了分租的想法，其中主要租户决定与子租户共享资源。在此示例中，主要租户按通常方式由集群运营团队分配一个\
    \ Cloud Pak for Data 实例。然后租户管理员决定定义自己的子租户以授予访问权限。\n\n主要租户管理员通常执行以下操作：\n\n- 为每个子租户创建一个\
