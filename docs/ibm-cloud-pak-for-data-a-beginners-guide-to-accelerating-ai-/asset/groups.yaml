    # Overview of Cloud Pak for Data


    In Chapter 1, The AI Ladder: IBM’s Prescriptive Approach, you were introduced
    to IBM’s prescriptive methodology to AI adoption, the AI ladder, and how enterprises
    can embrace this framework through IBM’s modern multi-cloud data and AI platform,
    Cloud Pak for Data. The concept of an integrated platform to manage data, analytics,
    and AI services is not new – there has always been a demand for an end-to-end
    offering spanning the different rungs of the AI ladder. Enterprises addressed
    this need through custom integrations by often tapping into global consulting
    organizations for resources and expertise.


    With the advent of public cloud and service-oriented architectures, it is now
    becoming commonplace to procure pre-integrated software platforms. These platforms
    minimize the integration effort while still providing the flexibility to meet
    specific business requirements.


    Cloud Pak for Data was launched on May 29, 2018, leveraging Kubernetes technology,
    which allowed the platform to be deployed on any public cloud and/or private cloud
    in enterprise data centers. This enabled clients to leverage cloud-native benefits
    such as easy provisioning, scaling, simplified management, and seamless upgrades,
    while sticking to their infrastructure of choice: the private cloud or any public
    cloud such as AWS, Azure, or IBM Cloud. It’s also worth highlighting that the
    data and AI services underpinning the platform have been tried and tested by thousands
    of enterprise customers over the past few decades. So, while the integrated platform
    is new and modern, the capabilities and functionality behind it have been proven
    at scale. This is critical for enterprise customers who cannot afford to make
    risky investments as they are looking to modernize their data and AI workloads.
    The following diagram illustrates the various releases of Cloud Pak for Data since
    its launch:


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_39_0.png)


    Figure 2.1 – IBM Cloud Pak for Data journey: 8 releases since launch'
