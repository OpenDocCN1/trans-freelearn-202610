    \n## 11 Storage\n\n**Cloud Pak for Data** leverages the Kubernetes concept of\
    \ **persistent volumes**, which is supported in OpenShift, to enable its various\
    \ services so that it can store data and metadata. Cloud Pak for Data services\
    \ can also connect to remote databases, lakes, and object stores, as well as remotely\
    \ exported filesystems as sources of data. We will look at the concepts and technologies\
    \ that power both in-cluster PVs and off-cluster external storage. By the end\
    \ of this chapter, you will have learned about what options are available in various\
    \ public and private cloud infrastructures, as well as how to best optimize data\
    \ storage for your use cases. You will also learn how storage should be operationalized,\
    \ especially to support the continuous availability of your entire solution.\n\
    \nIn this chapter, we're going to cover the following main topics:\n\n- Persistent\
    \ volumes\n- Connectivity to external volumes\n- Operational considerations\n\n\
    ### Understanding the concept of persistent volumes\n\nWe will start by providing\
    \ a quick introduction to the foundational storage concepts in Kubernetes and\
    \ how Cloud Pak for Data leverages storage. Typical containers are stateless,\
    \ which means that any files they create or any changes they make will be ephemeral;\
    \ upon restarting the container, these changes would not be restored. Also, in-container\
    \ files would be created in a temporary location on the host, which can cause\
    \ contention with other, similar consumers of that location. In **Kubernetes**,\
    \ the concept of volumes [1] enables the persistence of directory files that are\
    \ needed for stateful containers. Such volumes are mounted in a Kubernetes Pod\
    \ and, depending on the access mode associated with that volume, the same directory\
    \ contents can be shared with other Pods running concurrently within that Kubernetes\
    \ namespace.\n\nIn this section, you will learn what it means to provision entities\
    \ known as **persistent volumes**, which provide storage for Cloud Pak for Data\
    \ workloads and can be configured for performance, reliability, and scale.\n\n\
    Multiple technologies and vendors enable storage in Kubernetes; we will explore\
    \ those currently certified by Cloud Pak for Data.\n\n### Kubernetes storage introduction\n\
    \nKubernetes provides a construct called **persistent volume claims (PVCs)**[2]\
    \ as an abstraction for Pods to mount block and file **persistent volumes (PVs)**\
    \ [2] without needing vendor-specific handling. Storage vendors, typically introduced\
    \ as operators, provide the necessary services to define **storage classes** [3]\
    \ and **dynamic provisioners** [4] to create, initialize, and mount these volume\
    \ filesystems in different Pods. While the storage software and configuration\
    \ are vendor-specific, the concept of PVCs makes consuming storage a standard\
    \ procedure that's immune from the technology that's used to provide that storage.\n\
    \nNote that Cloud Pak for Data requires the use of **dynamic provisioners**; that\
    \ is, the ability to provision storage on-demand. Static provisioners, which predefine\
    \ storage volumes, are insufficient as Cloud Pak for Data services are deployed\
    \ via a dynamic, *plug-n-play* mechanism. Scaling out such services could also,\
    \ in many cases, automatically require us to create new volumes.\n\nStorage classes,\
    \ represented by the `StorageClass` Kubernetes Kind resource, are used to reference\
    \ each type of volume. When Cloud Pak for Data services are provisioned, they\
    \ include PVC declarations, which are then processed by Kubernetes to provision\
    \ and bind PVs.\n\nFor example, the user-home volume is requested by defining\
    \ a `PersistentVolumeClaim` that resembles the following:\n\n```yaml\napiVersion:\
    \ v1\nkind: PersistentVolumeClaim\nmetadata:\n  name: \"user-home-pvc\"\nspec:\n\
    \  storageClassName: {{ <user-selected-storage-class> }}\n  accessModes:\n   \
    \ - ReadWriteMany\n  resources:\n    requests:\n      storage: {{ default \"100Gi\"\
    \ or <user-selected-size> }}\n```\n\nYou will also notice that the PVC definition\
    \ identifies parameters, such as the storage class to use and the storage size\
    \ that's been requested. These are introduced via the installation options for\
    \ the Cloud Pak for Data services.\n\nThe declarations in the *claim*, along with\
    \ the class of storage and other attributes (such as `size` and `accessModes`),\
    \ represent a *request* to Kubernetes to provision a volume for use by the Cloud\
    \ Pak for Data service. Once the storage volume has been provisioned, Kubernetes\
    \ then satisfies that claim by *binding* the provisioned PV to the PVC. This binding\
    \ metadata then enables Kubernetes to always mount the same storage volume in\
    \ the Pods, as well as for services to use the abstraction of the PVC to always\
    \ refer to the volume, without needing to know the specifics of where the volume\
    \ exists physically or the driver/storage technology behind it.\n\n> **Note**\n\
    >\n> You will not need to explicitly define the PVC yourself. The PVC will be\
    \ declared during the Cloud Pak for Data service installation process.\n"
