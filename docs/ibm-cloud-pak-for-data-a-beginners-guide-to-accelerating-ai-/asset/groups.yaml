    \ knowledge about the underlying Kubernetes infrastructure. For example, a user\
    \ could choose to provision a Db2 database and grant access to others to work\
    \ with that database instance. Cloud Pak for Data also includes mechanisms for\
    \ users to generate API keys for service instances to programmatically interact\
    \ from client applications. The catalog is powered by the `zen-core-api` microservice\
    \ and the experience is hosted by the `zen-core` microservice. `zen-core-api`\
    \ also provides the mechanism to manage access to each provisioned service instance,\
    \ while supporting the ability to upgrade these instances as needed.\n"
  mdcn: "\n\n查看其中一个部署（例如 `zen-core`），你会注意到 Deployment 指示卷应挂载的位置：\n\n```\nkubectl get\
    \ deployment zen-core -o yaml\n...\nvolumes:\n  - name: user-home-mount\n    persistentVolumeClaim:\n\
    \      claimName: user-home-pvc\n...\nvolumeMounts:\n  - mountPath: /user-home\n\
    \    name: user-home-mount\n```\n\n在此示例中，你会注意到 `user-home-pvc` 在 `zen-core` Pod\
    \ 中被挂载为 `/user-home`。\n\nCloud Pak for Data 还使用 StatefulSets，其中每个成员副本通常与其自己的专用（非共享）持久卷相关联。以下是一个示例：\n\
    \n```\nkubectl get statefulsets\n```\n\n这会识别 Cloud Pak for Data 控制平面中存在的几个 StatefulSets：\n\
    \n| NAME | READY | AGE |\n|---|---|---|\n| dsx-influxdb | 1/1 | 33d |\n| zen-metastoredb\
    \ | 3/3 | 33d |\n\n每个 StatefulSet 都会生成一个或多个成员 Pod：\n\n```\nkubectl get pods -l\
    \ component=zen-metastoredb\n```\n\n前面的片段显示了与该 metastoredb StatefulSet 关联的 *成员*。在这种情况下，有三个，并且按序编号：\n\
    \n| NAME | READY | STATUS | RESTARTS | AGE |\n|---|---|---|---|---|\n| zen-metastoredb-0\
    \ | 1/1 | Running | 11 | 12d |\n| zen-metastoredb-1 | 1/1 | Running | 11 | 12d\
    \ |\n| zen-metastoredb-2 | 1/1 | Running | 10 | 12d |\n\n```\nSelector: managed-by=0020-zen-base,app.kubernetes.io/name=0020-zen-base,app=0020-zen-base,component=zen-core-api,release=0020-core\n\
    ```\n\n服务还标识了暴露的端口和使用的协议，例如以下内容：\n\n```\nPort:                 zencoreapi-tls\
    \  4444/TCP\nTargetPort:           4444/TCP\nEndpoints:            10.254.16.52:4444,10.254.20.23:4444\n\
    ```\n\nEndpoints 指示请求被路由到的 Pod IP 和 4444 端口。\n\n如果你查看 zen-core-api Pod 的列表，你会注意到\
    \ IP 已分配给这些特定 Pod：\n\n```\nkubectl get pods -l component=zen-core-api -o wide\n\
    NAME                         READY   STATUS    RESTARTS   AGE     IP         \
    \    NODE                         NOMINATED NODE   READINESS GATES\nzen-core-api-8cb44b776-zlv6q\
    \  1/1     Running   7          12d     10.254.20.23   worker1.zen-dev-01.cp.fyre.ibm.com\
    \   <none>           <none>\nzen-core-api-8cb44b776-vxx1h  1/1     Running   10\
    \         12d     10.254.16.52   worker0.zen-dev-01.cp.fyre.ibm.com   <none> \
    \          <none>\n```\n\n因此，在向 kube-svc 主机名 `zen-core-api-svc` 端口 4444 发出请求的情况下，Kubernetes\
    \ 会自动将请求路由到其中一个 Pod。同一集群内的所有其他组件都只会使用此 kube-svc 主机名来调用其端点，从而抽象出 zen-core-api Pod\
    \ 的性质、它们运行的确切位置，甚至同时可能存在多少个这些 Pod 的副本。\n\nCloud Pak for Data 控制平面还运行一个名为 ibm-nginx-svc\
    \ 的特殊服务，该服务路由到 ibm-nginx Pod。这些 Pod 通过名为 ibm-nginx 的 Deployment 提供。此组件由 nginx\
    \ 提供支持，也被称为“前门”，因为它充当访问 Cloud Pak for Data 服务的总体主要访问点。除了任何初始身份验证检查之外，ibm-nginx\
    \ Pod 还启用对其他微服务（由其 kube-svc 主机名标识）的反向代理，并提供用户体验。\n\nOpenShift 支持多种 [16] 从集群外部访问服务的方式。Cloud\
    \ Pak for Data 仅公开一个 OpenShift 路由 [17]，称为 cpd，用于从 Web 浏览器调用用户体验以及从其他客户端调用 API：\n\
    \n```\nkubectl get route cpd\n```\n\n| NAME | HOST/PORT | PATH | SERVICES | PORT\
    \ | TERMINATION | WILDCARD |\n|---|---|---|---|---|---|---|\n| cpd | cpd-cpd-122.apps.zen-dev-01.cp.fyre.ibm.com\
    \ | | ibm-nginx-svc | ibm-nginx-https-port | passthrough/Redirect | None |\n\n\
    此路由代表对 Cloud Pak for Data 的外部访问，“host”是一个可通过 DNS 解析的主机名。在前面的示例中，zen-dev-01.cp.fyre.ibm.com\
    \ 是 OpenShift 集群本身的主机名。当来自集群外部的客户端，例如 Web 浏览器，访问此主机名时，OpenShift 会将其路由到 ibm-nginx-svc\
    \ Kubernetes 服务，该服务在当前可能正在运行的任意多个 ibm-nginx Pod 之间进行负载均衡。\n\nOpenShift 路由也可以使用\
    \ TLS [18] 进行通用保护。Cloud Pak for Data 还提供了一种将自定义证书与其 Kubernetes 服务关联的方法 [19]。\n\
    \n## 基础服务和控制平面\n\nIBM 拥有一个广泛的产品组合，这些产品现在作为 OpenShift Container Platform 上的 Cloud\
    \ Paks 提供。对于每种此类产品，都存在在不同数据中心运行的需求，既在本地也可在云中，并且需要与现有企业系统集成。为此，开发了一套共享服务，称为 Cloud\
    \ Pak 基础服务（CPFS）。\n\n### Cloud Pak 基础服务\n\nCPFS 也被称为“Bedrock”。它提供在 OpenShift Container\
    \ Platform 之上运行的关键服务，用于为所有 Cloud Paks 提供支持，包括 Cloud Pak for Data，并作为在所有 Paks 之间支持集成的层。\n\
    \nCPFS 服务所启用的功能包括以下内容：\n\n- **证书管理服务**：此服务使 Cloud Paks 能够生成 TLS 证书，将其作为 Kubernetes\
    \ secret 清单化，并在需要它们的 Pod 中挂载。这有助于保护微服务之间的通信，并促进证书的自动轮换变得更容易。\n- **Zen – 平台体验：**\
    \ Zen 是一个专门开发的框架，旨在实现对最终用户体验和后端服务 API 的即插即用范式的可扩展性和采用。它是一套基础功能和 UI 组件，被 Cloud\
    \ Paks 中的更高层服务所利用。它确保关注单一窗格的 *角色驱动* 且可定制（甚至可重新品牌化）的用户体验。它通过即插即用模型促进角色之间以及产品边界之间的协作，随着服务的部署，功能会动态启用。\n\
    - **cloudctl 实用程序：** 此命令行界面（CLI）提供在 OpenShift Container Platform 上部署和管理 Cloud\
    \ Paks 的功能。cloudctl 有助于将 Cloud Pak 镜像镜像到企业私有容器注册表中，甚至镜像到断网环境中。Cloud Paks 中的服务以\
    \ **企业容器应用软件（CASE）** 格式打包并提供，该规范在开源 [23] 中定义。实用程序为在 Pak 中安装和升级服务提供重要的自动化，包括创建\
    \ OLM 工件，例如 catalog sources 和 operator subscriptions。\n\n在本节中，我们介绍了 Cloud Pak\
    \ 基础服务提供的功能，形成了“Bedrock”，所有 IBM Cloud Paks 都利用它。在下一节中，我们将探索 Bedrock 的一个消费者——为\
    \ Cloud Pak for Data 服务提供动力的 *控制平面* 层。\n\n### Cloud Pak for Data 控制平面\n\n控制平面是\
    \ Cloud Pak for Data 实例命名空间中 Zen 框架的实例化。它是一组由 Zen operator 管理的部署。此 Zen 控制平面由 Cloud\
    \ Pak for Data 平台 operator [5] 引入并自定义。\n\n以下屏幕截图提供了不同 Kubernetes 资源的结构概览。它描绘了构成控制平面的各种微服务、存储库、存储卷和其他组件。它还显示了服务到服务的交互，包括与\
    \ Cloud Pak for Data 基础服务和 operator 的交互，以及 Web 浏览器和命令行实用程序如何与该 Cloud Pak for Data\
    \ 安装交互：\n\n如前图所示粗略概述的那样，所有 Cloud Pak for Data 服务都部署在控制平面之上，并利用控制平面 API，同时通过相同的“前门”进行访问。这些更高阶的服务本身由各自的\
    \ operator 管理，包括各自的微服务、存储库，以及控制平面本身所托管之上的用户体验。这些服务体验以即插即用的方式动态扩展 Cloud Pak for\
    \ Data 体验，以为最终用户呈现单一窗格。\n\n控制平面为 Cloud Pak for Data 平台的消费者提供以下功能：\n\n- **授权：**\
    \ Cloud Pak for Data 提供访问控制功能（*usermgmt* 微服务），使授权用户（管理员）能够向其他用户授予访问权限。可以定义用户组，也可以映射到\
    \ LDAP 组，以支持协作。用户和组可以被授予基于角色的授权，以使用特定的服务或项目。安全章节更详细地描述了用户访问管理。\n- **基于角色的体验：**\
    \ Cloud Pak for Data 提供基于浏览器的集成最终用户体验，该体验根据用户的角色进行适当个性化。导航及其主页内容会自动限定为已授予的访问权限。用户也可以选择自定义其体验，例如主页内容。这主要由“zen-core”微服务提供。\n\
    - **服务目录：** 服务目录鼓励授权用户进行自助服务，以便在无需了解底层 Kubernetes 基础设施的复杂知识的情况下 *预配* Cloud Pak\
    \ for Data 平台中的服务实例。例如，用户可以选择预配 Db2 数据库并授予他人访问该数据库实例的权限。Cloud Pak for Data 还包括机制供用户为服务实例生成\
    \ API 密钥，以便从客户端应用程序以编程方式进行交互。目录由 `zen-core-api` 微服务提供支持，体验由 `zen-core` 微服务托管。`zen-core-api`\
    \ 还提供管理每个预配服务实例的访问的机制，同时支持按需升级这些实例的能力。\n\n"
