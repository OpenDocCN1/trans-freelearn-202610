    - Automatic scaling of OpenShift configuration.

    - Automatic backups of core OpenShift ETCD data.

    - Built-in integration with the cloud platform – monitoring, logging, Key Protect,
    IAM, Activity Tracker, Storage, COS, Security Advisor, Service Catalog, Container
    Registry, and Vulnerability Advisor.

    - Built-in load balancer, VPN, proxy, network edge nodes, private cluster, and
    VPC capabilities.

    - Built-in security, including image signing, image deployment enforcement, and
    hardware trust.

    - 24/7 global **Site Reliability Engineering (SRE)** to maintain the health of
    the environment and help with OpenShift.

    - The global SRE team has lots of experience and skill in IBM Cloud infrastructure,
    Kubernetes, and OpenShift, resulting in much *faster problem resolution*.

    - Automatic compliance for your OpenShift environment (HIPAA, PCI, SOC2, and ISO).

    - Capacity expansion with a single click.

    - Automatic multi-zone deployment in **Multi-Zone Regions (MZRs)**, including
    integration with **Cloud Internet Service (CIS)** to do cross-zone traffic routing.

    - Automatic operating system performance tuning and security hardening.


    ### AWS Quick Start


    "Quick Start" on AWS refers to templates (scripts) that automate the deployment
    of workloads – in this case, Cloud Pak for Data. A Quick Start launches, configures,
    and runs compute, network, storage, and all other related AWS infrastructure required
    to deploy Cloud Pak for Data on AWS in 3 hours or less. This is a significant
    value proposition for customers interested in running Cloud Pak for Data on AWS.
    It saves time through automation (eliminates many of the steps required for manual
    installation configuration) and helps implement AWS best practices by design.


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_143_0.png)


    Figure 6.2 – Cloud Pak for Data on AWS – value proposition

