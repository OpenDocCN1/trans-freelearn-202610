    it with a choice of operators and then loading it to the target repositories.

    - **Data steward(s)** organize data in the catalog and create governance policies
    and rules. Additionally, they create data rules that obfuscate parts of the datasets
    to ensure only authorized personnel have access to data.

    - **Data analyst(s)** and **Business analyst(s)** create reports and dashboards
    using the easy-to-use drag and drop Cognos Dashboard interface. For more sophisticated
    reports/scorecards/dashboards, they must work with the **Business Intelligence
    (BI)** team and leverage the Cognos Analytics BI service.


    The outcome of this use case is that the client was able to realize the value
    of Unified Data Fabric for improving the ease of data access through a governed
    semantic layer on Cloud Pak for Data. Their ability to easily identify and select
    cohorts and gain deeper insights were greatly improved, and the platform allowed
    for more self-service analytics.


    Next, we have a customer use case on financial planning and analytics.


    ## Financial planning and analytics


    The customer challenge was that an online distribution company wanted to scale
    its planning operations and bring cross-organizational collaboration into the
    planning process. They had challenges in scaling their existing planning solution,
    which also lacked effective collaboration capabilities.


    Traditionally, all businesses do **Financial planning and analytics (FP&A)**.
    This involves multiple finance teams using hundreds of interconnected spreadsheets
    for planning and reporting. This is a very time-consuming, error-prone process
    and limits the amount and number of scenarios that can be used. In this era, organizations
    are looking to go beyond finance to a more collaborative and integrated planning
    approach known as FP&A. This involves multiple teams throughout the organization
    all collaborating with the goal of gaining forecast accuracy and the ability to
    quickly respond to changes in market conditions.


    The planning analytic service in CP4D helps us move past this manual planning,
    budgeting, and forecasting process to an automated AI-based process. You can identify
    meaningful patterns and build what-if scenarios to create models. This, combined
    with the integrated Cognos Analytics service, enables self-service analytics with
    stunning visualizations and reports. CP4D, with its data management capabilities
    and centralized governance catalog, provides access to trusted data for analytics.

