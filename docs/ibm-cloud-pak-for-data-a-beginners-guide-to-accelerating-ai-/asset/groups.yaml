    IBM uses sophisticated multi-tenancy techniques in its cloud for the Cloud Pak
    for Data SaaS offering, and the architectural underpinnings of the Cloud Pak for
    Data software stack can also enable enterprises to support multiple tenants on
    the same OpenShift Kubernetes cluster. Chapter 9, Technical Overview, Management,
    and Administration, introduced how multi-tenancy can be achieved with the judicious
    use of Kubernetes namespaces, where a single OpenShift cluster is shared between
    multiple tenants. There needs to be careful deliberation with regards to how to
    implement multi-tenancy in a secure and reliable fashion while being mindful of
    your enterprise''s requirements, policies, and the service guarantees expected
    by tenants.


    In this chapter, we''re going to be covering the following topics:


    - Tenancy considerations

    - Architecting for multi-tenancy

    - A review of the tenancy requirements

    - In-namespace sub-tenancy with looser isolation


    ## Tenancy considerations


    We will start by looking closely at what multi-tenancy implies, why tenancy is
    important, and, in general, what architectural choices, trade-offs, and compromises
    regarding expenses need to be made when planning for such shared deployments.


    ### Designating tenants


    Each enterprise usually has a very different interpretation when it comes to identifying
    their tenants, but by and large, a tenant is defined as a select group of users
    granted specific privileges to access a shared software installation. When tenants
    represent different companies altogether, users belonging to one tenant are generally
    unaware of the existence of other tenant users. However, even such isolation can
    be relaxed when it comes to users within the same enterprise, and employees in
    the same company may be members of multiple tenant "accounts."


    Within each tenancy, specific users can be granted administrative privileges that
    have been scoped to their instance to give the tenant some measure of self-service.
    This allows tenant admins to perform some of the Cloud Pak for Data management
    functions, including managing user access themselves and troubleshooting, as described
    in Chapter 9, Technical Overview, Management, and Administration.


    > **A note on the role of tenant users**

    >

    > Including this one Tenant Admin role, all users from a tenant group should be
    considered end users; that is, personas who are focused on consuming the capabilities
    offered by the Cloud Pak for Data services and not responsible for managing the
    installation or the cluster infrastructure by themselves.

    >

    > Tenant Admins are also end users but have a slightly more important role to
    play in the interest of self-service management – they bridge the gap between
    the operations team and the consumers of the Cloud Pak for Data instance.


    ### Onboarding tenants


    In such multi-tenanted deployments, there needs to be a formal process of identifying
    tenants, granting them the appropriate (limited) access to the assigned resources,
    and metering their usage. In Cloud Pak for Data, the prescribed approach is for
    the operations team to create unique OpenShift project namespaces, with the appropriate
    ResourceQuotas, for provisioning Cloud Pak for Data services.


    Depending on the policies with regards to Kubernetes access, the OpenShift cluster
    admin could grant a tenant admin user limited RBAC to that OpenShift project namespace.
    This would allow such tenants to provision Cloud Pak for Data services (or upgrade
    them) as needed.


    > **Note**

    >

    > The use of operators, as described in Chapter 9, Technical Overview, Management,
    and Administration, is designed to help both the operations team (operators are,
    after all, operational knowledge coded into the software) and the tenants themselves.
    Cluster admins introduce any operators as needed for their tenant use cases (and
    associated container images) and keep them up to date. When tenants need to provision
    a service in their namespace, they would only need to "declare" their need for
    it using an appropriate custom resource specification, without needing to be experts
    in understanding how to automate the process of installing (or upgrading) any
    service.


    ## Architecting for multi-tenancy


    In this section, we will explore what it means to implement multi-tenancy with
    Cloud Pak for Data, starting with how to plan out the topology on an OpenShift
    cluster and how to separate the tenants within the same cluster.


    ### Achieving tenancy with namespace scoping


    As we established earlier, assigning a unique OpenShift project (a Kubernetes
    namespace) to each unique tenant is the recommended approach for Cloud Pak for
    Data multi-tenant deployments.


    The following diagram shows how multiple tenants can be sandboxed into individual
    OpenShift projects and the logical separation between the Operations zone (which
    would be managed by the cluster administrators) and the Tenants zone (where the
    tenant users are potentially given access to):


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_300_0.png)


    Figure 12.1 – Individual tenant namespaces in a shared Kubernetes cluster


    The **Cluster Operations zone** includes all the management functions provided
    by OpenShift and Kubernetes (not everything is shown in the preceding diagram
    for brevity). The **Operator Lifecycle Manager (OLM)** provides operators and
    services for installing and managing Cloud Pak for Data itself. It is also very
    much relevant for achieving multi-tenancy as it provides the right abstraction
    to extend the cluster and enable different capabilities (via service operators)
    to be made available in the cluster. To meet separation of duties requirements,
    OLM can be fully controlled by the cluster admins and integrated into their CI/CD
    processes, with tenants, including their admins, denied access.


    The **Cloud Pak Foundational Services (CPFS)** are commonly located in the *ibm-common-services*
    namespace. This includes the *namespace-scope operator*, which is instrumental
    in ensuring that the Cloud Pak for Data Operators are constrained to only managing
    specific tenant namespaces and not *all* namespaces. There isn''t a need for these
    operators to watch over *non*-Cloud Pak for Data namespaces anyway and for security
    reasons (principle of least privilege), it is best not to even grant these operators
    that privilege. While the Cloud Pak for Data service operators can be co-located
    with CPFS in *ibm-common-services*, they can also be installed in a different
    *cpd-operators* namespace, as shown in the preceding diagram. For example, you
    may choose to use *cpd-operators* when there are other Cloud Paks present in the
    same cluster. While it is necessary for the CPFS operators to manage all Cloud
    Pak namespaces, it is not necessary for Cloud Pak for Data operators and by isolating
    them to *cpd-operators*, you can ensure they are scoped to only the Cloud Pak
    for Data namespaces.


    > **Note**

    >

    > As depicted in the preceding diagram, each tenant namespace has its own private
    copy of the Cloud Pak for Data control plane scaled out as needed, including a
    front door with its own private ingress/route. OpenShift enables the exposure
    of this front door for access via unique tenant URLs. This enables client apps
    to target the appropriate tenant instance to connect to from outside the cluster.


    Authentication and auditing for each tenant can be configured independently. The
    signing key that''s used for generating bearer tokens is unique to each tenant.
    Hence, using an authentication token from one tenant''s instance would not work
    if you wish to gain access to another. Authorization, in the form of *roles and
    permissions*, can help tenant admins grant authorization to that tenant''s users
    in a granular fashion. Objects and capabilities inside this tenant''s installation
    of Cloud Pak for Data would only be available to authorized users.


    OpenShift also automatically generates a unique *UID* range for each project.
    Hence, the Linux processes within one Cloud Pak for Data tenant namespace run
    with a UID that is different from processes from another namespace. This, coupled
    with **RHEL''s SELinux** capability, ensures that even when pods from two tenants
    are scheduled in the same Linux host, these processes are prevented from interacting
    with one another. Thus, a malicious process that may have infected one tenant''s
    Pod, or user errors that may have accidentally been introduced, would not be able
    to impact the Pod processes from another tenant. Note that some Cloud Pak for
    Data v4 services rely on a fixed UID via the use of a custom SCC (as described
    in *Chapter 10, Security and Compliance*).


    With network policies, which permit access within the namespace, microservices
    can communicate with one another. However, access from another tenant''s microservices
    can be effectively blocked, except for those requests that come in through the
    front door, and only those with the right authorization.


    ### Choosing dedicated versus shared compute nodes


    In OpenShift, SELinux and the unique tenant UID for Linux processes provide a
    significant amount of security when we have processes from different tenants executing
    side by side, sharing the same operating system kernel runtime. With namespace
    ResourceQuotas and the ability for Cloud Pak for Data to monitor and enforce usage
    quotas, there are additional controls to ensure that a noisy tenant workload does
    not adversely affect another tenant and that SLAs can be assured in the cluster.


    However, there may be security policies in the enterprise that do not permit co-locating
    one tenant''s processes with another or SLAs that demand some sort of physical
    separation between tenants. Obviously, since assigning independent Kubernetes
    clusters to individual tenants is operationally cost-prohibitive, the OpenShift
    container platform provides an option to support such requirements.

