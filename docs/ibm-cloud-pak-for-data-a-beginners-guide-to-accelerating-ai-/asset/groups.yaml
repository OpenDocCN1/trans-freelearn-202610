  - '[PAGE 241]


    # Development practices


    IBM requires all products to be developed and evaluated using strict secure engineering
    practices, and the services delivered for Cloud Pak for Data are no exception.
    With such offerings also being operated in an as-a-service fashion, accessible
    to the general public, security is of paramount importance right from the design
    of the software.


    The security practices and reports are independently reviewed by the IBM hybrid
    cloud **Business Information Security Office (BISO)** prior to any release of
    the software.


    This section describes some of the important practices used to develop security-hardened
    services in Cloud Pak for Data.


    # Vulnerability detection


    A key initiative is to detect possible security weak points or potential areas
    that a malicious operator could leverage to introduce man-in-the-middle attacks,
    access sensitive data, or inject malware. Given that quite a bit of interaction
    with Cloud Pak for Data is through a web browser or HTTP-based clients in general,
    care is taken to ensure protection from both outside and in-cluster influences:


    +   - **Threat modeling**: This is a process to analyze where the system is most
    vulnerable to attack, by building out inter-service and intra-service detailed
    data flow diagrams, understanding potential attack vectors, as well as evaluating
    whether existing protection is deemed sufficient. The output of the threat modeling
    exercise is used to drive the development of additional security constructs or
    to refactor service interactions to mitigate potential threats.


    +   - **Security quality assurance and code reviews**: Additional tests are developed
    by a team focused on security and operating independently from typical functional
    development and quality assurance squads. This effort also involves validation
    of cross-service/cross-product integrations and a thorough evaluation of general
    system reliability using **Chaos Monkey** style testing approaches (that is, mechanisms
    to generate random failures in the system to validate resiliency).


    This allows for a better objective evaluation of a proposed software delivery
    against required security guidelines. As part of this initiative, this team also
    conducts independent code reviews and approval of any mitigations proposed by
    the service development teams.'
