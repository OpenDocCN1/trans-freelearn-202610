    在我们已经探讨了检测 AI 偏见对业务运营带来的价值之后，让我们接下来看看数据扰动是如何工作的，以及 OpenScale 服务如何利用这一技术作为与其他偏见检测方案相比的差异化优势。


    ## 数据扰动


    OpenScale 服务使用数据扰动技术作为与其他偏见检测方案相比的差异化优势。让我们用一个 100 起保险索赔的示例场景来说明。在这些索赔中，60 起由
    18-24 岁年龄段的人提出，40 起由 24 岁以上的人提出。18-24 岁年龄段的所有人都具有非常高的索赔频率，并且已知过去曾进行过欺诈性索赔，因此模型拒绝了该年龄段的所有
    60 起索赔。另一方面，24 岁以上的 40 起索赔全部被模型批准。对于这种情况，不一致影响为 0/1=0，导致模型被标记为有偏见。然而，模型本身并无偏见，它是基于提供给它的数据。OpenScale
    利用数据扰动来避免这种情况。


    数据扰动的工作原理是通过用来自参考组的随机值翻转受监控组中的记录，然后将扰动后的值发送给模型。记录的其他所有特征保持不变。现在，经过扰动后，如果模型预测前述示例中的索赔被批准，那么就意味着模型仅基于客户年龄做出决策，从而表现出有偏见的行为。因此，在计算偏见时，我们会进行数据扰动，并使用负载和扰动后的数据计算不一致影响。这将确保我们仅在模型在原始数据和扰动数据中表现出有偏见行为的足够数据点上才报告偏见。因此，我们能够检测模型中是否存在真正的偏见，而不会受到模型接收到的数据类型的影响。


    ## 比较模型质量、公平性和漂移


    Cloud Pak for Data 中的 OpenScale 服务使您能够跨不同提供商和算法监控多个模型，使客户能够在一段时间内以及跨不同版本（生产/预生产）比较性能。


    LIME 将所有模型视为黑盒，并生成易于理解的解释。然而，这也要求 LIME 理解数据点附近的模型行为。这可能导致成本增加，因为需要更多的评分请求。OpenScale
    服务采用了一种创新的基于缓存的技术，从而显著减少了生成局部解释所需的评分请求数量。除了降低成本外，生成解释的速度也有显著提升。OpenScale 服务还增加了容错功能，以应对评分请求中的间歇性失败。


    第二个可解释性算法提供对比解释。该算法专为处理接受结构化数据的模型而设计，并且能够以远少于开源替代方案的评分请求生成对比解释。


    ## 模型漂移


    模型漂移是指由于底层数据及其与 I/O 变量之间关系的变化而导致的模型性能下降。模型漂移会随着时间推移产生负面影响，有时也可能突然发生漂移，导致模型行为不理想。为了有效检测和缓解漂移，组织需要作为其数据和
    AI 平台的一部分定期监控和管理模型性能。这种集成方法具有以下优势：


    - 能够持续跟踪指标，并在准确性和数据一致性漂移时发出警报。

    - 能够定义目标并在开发、验证和部署过程中跟踪这些目标。

    - 简化识别受模型漂移影响的业务指标的步骤。

    - 自动化漂移监控可最大程度地减少模型性能下降的影响。


    OpenScale 服务检测准确性和数据的漂移。准确性漂移的估计是在模型运行时进行的。如果未被模型训练数据集覆盖的交易增加，模型准确性通常会下降。这种类型的漂移仅针对结构化二元和多类分类模型计算。


    以下屏幕截图说明了持续监控模型并随时间评估模型质量的能力：


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_134_0.png)


    图 5.21 – 随时间推移的模型评估


    现在我们已经探讨了预测分析方面的功能，让我们接下来看看如何处理流数据并使用 Cloud Pak for Data 中的服务进行分析。


    ## 流数据/分析


    数据以快速的速度增长，数据的种类和复杂性也在不断增加。每天，我们会产生 2.5 千万亿字节的数据，传统分析解决方案无法充分释放这些数据的潜在价值。Cloud
    Pak for Data 拥有 IBM Streams 服务来满足流数据需求。这包括 API、应用程序的 IDE 以及可在单个或分布式资源集上运行应用程序的运行时系统。Streams
    服务旨在满足以下数据处理平台目标：


    - 并行和高性能流处理

    - 连接到各种关系数据库、非关系数据源以及多个流数据源，包括 IBM Event Streams、超文本传输协议（HTTP）和物联网（IoT）

    - 对实时数据流应用从简单到高级的分析方法，包括 ML

    - 流处理应用程序的自动部署

    - 增量部署，无需重启即可扩展流处理应用程序

    - 安全且可审计的运行时环境


    开发分析流数据的应用程序有多种方式，如下所述：


    - 来自 Cloud Pak for Data 项目内的 Streams 流

    - 来自 Cloud Pak for Data 项目中 Jupyter notebook 的 Streams Python API

    - Streams Python API 和任何文本编辑器或 Python IDE


    现在，让我们继续讨论分布式处理。


    ## 分布式处理


    Cloud Pak for Data 服务利用 Red Hat OpenShift 平台在集群中的计算节点上调度来自不同服务的负载。在某些情况下，我们可能没有集群容量，或者希望在远程位置运行负载，无论是由于数据位置还是监管要求规定了工作负载在地理上的执行位置。Cloud
    Pak for Data 提供了以下两种分布式处理选项：


    - Apache Hadoop 服务的执行引擎

    - Edge Analytics 服务


    Apache Hadoop 服务的执行引擎使您能够从 Watson Studio 分析项目中创建 Hadoop 环境定义和 **Jupyter Enterprise
    Gateway (JEG)** 会话，以便在 Hadoop 集群上远程运行作业。可以使用此服务完成以下任务：


    - 在 Hadoop 集群上训练模型

    - 在 Hadoop 集群上管理模型

    - 预览和优化 Hadoop 数据（**Hadoop 分布式文件系统（HDFS）**、Hive 和 Impala）

    - 在 Hadoop 集群上运行 Data Refinery 流

    - 安排 Python 或 R 脚本作为作业在 Hadoop 集群上远程运行


    下图说明了使用 Hadoop Integration 服务将处理推近数据所在位置的 Cloud Pak for Data 分布式处理：


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_136_0.png)


    图 5.22 – 使用 Hadoop Integration 的分布式处理


    Cloud Pak for Data 中的 Edge Analytics 服务支持以下用例：


    - **更快洞察和行动**：当需要实时检测情况并采取行动时，集中式分析方法可能不是最有效的，因为它会增加太多网络延迟，无法立即采取时间关键的行动。

    - **持续运行**：将分析移至边缘，靠近设备，也可支持即使与 **广域网（WAN）**/数据中心/云断开连接也必须继续提供关键功能的设备。

    - **更好的数据和成本控制**：随着在传统数据中心之外边缘产生的数据量大规模增长，需要以成本有效的方式收集和分析这些数据。Edge Analytics 允许在源头过滤数据，在不需要更精细细节的地方在源头聚合数据，并在边缘处理敏感数据。


