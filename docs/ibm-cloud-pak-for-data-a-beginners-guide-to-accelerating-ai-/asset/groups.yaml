    - **A rich developer ecosystem:** Kubernetes 已迅速成为云原生应用程序的首选开发平台。OpenShift Container
    Platform 通过以开发人员为中心的<|message|>能力进一步扩展了这一点，包括丰富 **continuous delivery/continuous
    integration (CI/CD)** 的概念。专注于安全开发和运营，OpenShift Container Platform 使企业能够快速创新，以开发现代云原生应用程序和解决方案。


    - **Enterprise and multi-tenancy ready:** Kubernetes，尤其是其命名空间、资源配额和网络策略的概念，可以优雅地支持租户之间的隔离。**OpenShift
    Container Platform** [2] 引入了额外的安全构造，包括 SELINUX 主机原语，大大提高了以经济高效的方式在多个租户之间安全共享 OpenShift
    集群的能力。


    因此以及更多原因，IBM Cloud Pak for Data 由 Red Hat OpenShift Container Platform 提供支持。这使
    Cloud Pak for Data 能够在任何云中提供开放、可扩展、可靠和安全的 数据和 AI 平台。


    ## The operator pattern


    Operator 模式 [3] 是一种架构概念和最佳实践，用于在 Kubernetes 中构建、交付和运营应用程序。Operators [4] 是部署在 Kubernetes
    中的特殊 Controllers，旨在以自动化方式管理单个应用程序。从本质上讲，operators 将管理 Kubernetes 工作负载的人类经验编纂成代码。


    Cloud Pak for Data v4 功能作为 operators [5] 交付。这些 operators 使用户能够安装和配置 *Day1* 活动。从
    *Day2* 角度来看，operators 还会持续监控并自动纠正偏离常态的情况，以及在需要时支持扩展已部署的 Cloud Pak for Data 服务的需求。Operators
    也被用于以自动化方式将服务升级到更新版本。


    OpenShift Container Platform 包括 **Operator Lifecycle Manager (OLM)** [6] 功能，帮助
    OpenShift 管理员以标准化方式为各种服务（IBM、Red Hat、开源或其他第三方供应商）策划 operators。


    Cloud Pak for Data 包含一个 *Control Plane* 层，使所有服务能够无缝集成并从单个平台层进行管理。此控制平面使用名为 Cloud
    Pak for Data platform operator [5] 的 operator 部署。具有适当 Kubernetes 权限的用户在特定 Cloud
    Pak for Data 实例命名空间中创建 **Custom Resource (CR)** 对象，以指示应部署什么服务。在 Cloud Pak for
    Data 的情况下，*IbmcP* 类型的自定义资源会触发 Cloud Pak for Data platform operator 在该命名空间中安装控制平面。


    下图提供了一个简化的 Kubernetes 集群 [10] 的高层次概述，以说明其功能，仅为说明 Cloud Pak for Data 如何利用它提供背景：


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_207_0.png)


    Figure 9.2 – Kubernetes architecture overview


    本质上有两种主机节点类型——**Master** 和 **Compute**（worker）节点。在某些实现中，一个节点可能同时具有 master 和 compute
    角色，但强烈建议保持 master 分离以确保更好的可靠性等级。每个节点都包括一些基本组件 [11]，例如 Kubelet 守护进程和与每个节点上的容器运行时交互的功能。master
    节点包括某些特殊组件，例如 API server 和 scheduler。


    Kubernetes 使用 etcd 数据库存储配置信息，该数据库对整体操作至关重要。etcd 是一个键值分布式存储，为高可用性，可以在不同主机上使用多个副本，建立法定人数。建议从三个
    master 节点开始，并在有必要支持更大规模的应用程序集时扩展。


    计算节点是 Kubernetes 调度应用程序工作负载运行的位置。所有 Cloud Pak for Data Pods 仅在计算（worker）节点上运行。Kubernetes
    还包括将 Pods 调度到特定（专用）节点的能力，但通常，Pods 可以随机调度到任何计算节点上。如果计算节点宕机，Pods 可以重新调度到另一个节点上运行。Cloud
    Pak for Data 服务主要利用 Kubernetes 构造，例如 Deployments [12] 和 StatefulSets [13]，在 Kubernetes
    中调度其微服务。这些“controllers”为该微服务设置正确的副本数量，识别要为 Pods 挂载的持久卷存储，并声明对计算资源的需求。


    ## Understanding how storage is used


    Cloud Pak for Data 需要在 Kubernetes 中使用动态存储 provisioner [20] 来按需创建持久卷。provisioner
    还在后台抽象了不同存储技术和解决方案的使用，并使 Cloud Pak for Data 具有可移植性。例如，`nfs-client` storage class
    可能指向 IBM Spectrum Scale 或 Dell/EMC 驱动的 NFS 服务器，而 `ibmc-file-gold-gid` storage
    class 可能指向 IBM Cloud 中的存储。


    因此，作为 Cloud Pak for Data 安装的一部分，用户将提供 storage classes 作为配置参数。


    Cloud Pak for Data 控制平面引入了一个特殊的持久卷声明，称为 `user-home-pvc`。这是一个共享的 **Read-Write-Many**（accessMode:
    RWX）卷，由多个 Pod 副本挂载以访问相同内容。此卷存储一些配置信息、静态用户体验内容以及一些用户引入的自定义。


    在典型的 Cloud Pak for Data 安装中，您可以按如下方式检查您的 PVC：


    ```

    kubectl get pvc user-home-pvc


    NAME              STATUS   VOLUME                     CAPACITY   ACCESS MODES   STORAGECLASS   AGE

    user-home-pvc     Bound    pvc-44e5a492-9921-41e1-bc42-b96a9a4dd3dc   10Gi       RWX            nfs-client     33d

    ```


    '
