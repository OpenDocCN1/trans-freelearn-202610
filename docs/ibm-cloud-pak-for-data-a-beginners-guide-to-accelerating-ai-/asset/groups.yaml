  - '[PAGE 214]


    +   - **Zen – the platform experience:** Zen is a framework developed specifically
    to enable the extensibility and adoption of a plug-n-play paradigm for both the
    end user experience and for backend service APIs. It is a set of foundational
    capabilities and UI components that are leveraged by higher-level services in
    Cloud Paks. It ensures a focus on a single pane of glass for *persona-driven*
    and customizable (even re-brandable) user experiences. It fosters collaborations
    between personas and across product boundaries with the plug-n-play model, capabilities
    are dynamically enabled as and when services are provisioned.

    +   - **The cloudctl utility:** This command-line interface (CLI) provides functions
    to deploy and manage Cloud Paks on OpenShift Container Platform. cloudctl helps
    with mirroring Cloud Pak images into an Enterprise Private Container Registry,
    even into air-gapped environments. Services in Cloud Paks are packaged and made
    available in the **Container Application Software for Enterprises (CASE)** format,
    a specification defined in open source [23]. The utility enables important automation
    for installing and upgrading services in a Pak, including creating OLM artifacts
    such as catalog sources and operator subscriptions.


    In this section, we introduced the functionality that the Cloud Pak foundational
    services deliver, forming the "Bedrock" that is leveraged by all IBM Cloud Paks.
    In the next section, we will explore one such consumer of Bedrock – the *Control
    Plane* layer that powers Cloud Pak for Data services.


    # Cloud Pak for Data control plane


    The control plane is an instantiation of the Zen framework in Cloud Pak for Data
    instance namespaces. It is a set of deployments that form the operand managed
    by the Zen operator. This Zen control plane is introduced and customized by the
    Cloud Pak for Data platform operator [5].


    The following screenshot provides an architectural overview of the different Kubernetes
    resources. It depicts the various microservices, repositories, storage volumes,
    and other components that make up the control plane. It also shows service-to-service
    interactions, including with Cloud Pak foundational services and operators, as
    well as how web browsers and command-line utilities interact with that installation
    of Cloud Pak for Data:'
