    catalogs and collaborate with other users within projects. A small set of permissions
    is typically sufficient for such users, as listed in the following table. This
    also grants them the permission to work with deployments such as machine learning
    models.


    | Permission | Category | Services that contribute the permission |

    |---|---|---|

    | Access catalogs | Catalogs | - Watson Knowledge Catalog

    - Watson Studio |

    | Create deployment spaces | Deployments | - Watson Knowledge Catalog

    - Watson Studio |

    | Create projects | Projects | - Watson Knowledge Catalog

    - Watson Studio |


    Figure 10.7 – Permissions granted to the Data Scientist role


    +   - **User** role: The **User** role is special as it typically indicates the
    least set of privileges assigned to a certain type of guest user. Assigning the
    **User** role to somebody just implies that they will be able to sign in and view
    any content that does not require any additional authorizations. Assigning the
    **User** role also serves to introduce new users to the platform, which enables
    them to be subsequently added (as individuals) into user groups or assigned access
    to projects, catalogs, or even databases.


    However, when certain services, such as Watson Knowledge Catalog or Watson Studio
    are installed, by default, they grant additional permissions to this **User**
    role. This enables these users to at least work privately within the confines
    of their own projects or deployment spaces. Of course, just as with any pre-defined
    role, administrators can choose to alter this role and remove these permissions
    or introduce additional ones to suit their definition of a "least" privileged
    role.


    | Permission | Category | Services that contribute the permission |

    |---|---|---|

    | Create deployment spaces | Deployments | - Watson Knowledge Catalog

    - Watson Studio |

    | Create projects | Projects | - Watson Knowledge Catalog

    - Watson Studio |


    Figure 10.8 – Permissions granted to the User role'
