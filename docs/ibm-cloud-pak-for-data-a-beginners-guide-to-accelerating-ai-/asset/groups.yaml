    **Cloud Pak for Data** 凭借其集中式治理目录和仪表板服务，支持自助式分析，并能够从受治理的数据资产中放心地获取数据。


    ## BI 与报表


    BI 是一种能力，它接收业务数据并以用户友好的视图呈现，例如报表、仪表板、图表和图形。BI 工具使业务用户能够访问不同类型的数据，包括历史数据和当前数据、第三方数据和内部数据，以及半结构化数据和非结构化数据（如社交媒体）。用户可以分析这些信息，以深入了解业务的表现。虽然
    BI 不会告诉业务用户该做什么，或者如果他们采取某种行动会发生什么，但 BI 也不仅仅是生成报表。相反，BI 为人们提供了一种检查数据以理解趋势并获得见解的方式。


    ## 预测性分析与规范性分析


    预测性分析是一种使用高级算法和 ML 处理历史数据的实践，在了解已发生情况的同时，发现未见过的数据模式、交互和关系。预测模型提供可操作的见解，但不说明基于这些见解需要采取什么行动才能获得最佳结果。


    另一方面，规范性分析通过使用优化模型（即业务问题的数学表示）为复杂问题实现准确决策。这些优化模型使用带有复杂算法的求解器。


    通常，我们可能质疑应该使用预测性分析还是规范性分析。答案是两者都需要，为了说明这一点，让我们用一个简单的例子。在整个 COVID-19 大流行期间，ML 模型已被用于预测防护口罩的需求，但用规范性分析补充这一信息将有助于制定补货计划，以决定哪个配送中心应向不同地点供货，从而充分满足需求。


    让我们首先揭开这三个概念的神秘面纱，如下所示：


    - **AI** — AI 系统可以被视为不受情感影响的专家系统，能够连接不同数据点，并基于模拟人类行为的复杂规则做出决策。AI 用于预测、自动化和优化历来由人类完成的任务，例如语音识别、人脸识别、翻译等。

    - **ML** — AI 应用的一个子集，它自行学习，使用新的数据点来预测结果，并不断提高准确性。

    - **DL** — ML 的一个子集，其中神经网络从大量数据中学习。DL 算法重复执行任务，并通过支持渐进式学习的深层逐步改进结果。


    下图展示了 AI、ML 和 DL 之间的关系：


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_111_0.png)


    图 5.2 – AI 的类型


    在对 AI、ML 和 DL 有了更好的理解之后，我们现在来看看 ML 项目现有方法论以及新时代 AI 应用将见解转化为行动的其他注意事项。


    ## AI 生命周期——将见解转化为行动


    正在进行数字化转型的企业将 AI 融入其应用程序；需要一套明确且稳健的方法论来管理 AI 流水线。传统上，**跨行业数据挖掘标准流程（CRISP-DM）**方法论被用于
    ML 项目，在我们探讨实施 AI 驱动应用程序所面临的挑战以及更全面的 AI 生命周期如何有助于这一过程之前，理解这一方法论非常重要。


    CRISP-DM 是一个开放标准流程模型，描述了执行数据挖掘项目所涉及的方法和步骤。它可分为六个主要阶段，如下所示：


    - **业务理解**

    - **数据理解**

    - **数据准备**

    - **模型构建**

    - **模型评估**

    - **模型部署**


    这些阶段的顺序并不严格，通常是一个迭代过程。下图中箭头表示不同阶段之间最重要、最常见的依赖关系，而外圈则象征着数据挖掘的循环性质：


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_112_0.png)


    图 5.3 – 分析生命周期


    这在过去效果很好，但随着收集的数据量不断增加，我们现在必须考虑数据的体量、多样性和速度，以及它们如何影响 AI 生命周期。这意味着我们需要更加重视数据收集、数据治理和持续模型评估阶段。模型评估不再仅仅是评估模型的质量，还有其他考虑因素，包括所部署模型的公平性和可解释性。


    以下是启用此 AI 生命周期时的一些关键注意事项：


    - 降低构建和运营 AI 的技能要求

    - 通过减少日常琐碎任务来加快交付时间

    - 通过优化模型准确性提高 AI 融合应用程序的就绪度

    - 提供 AI 模型的实时治理，提高信任和透明度


    在对 AI 应用程序的其他注意事项有了充分了解之后，我们接下来将深入探讨 AI 治理的必要性，将其作为新时代 AI 应用中信任和透明度的基础。


    ## AI 治理：信任与透明度


    AI 在各个行业中无处不在——从推荐引擎到跟踪 COVID-19 病毒的传播。AI 的这种应用使组织能够创新并提高效率，但也带来了围绕如何使用 AI 制定业务决策的风险。


    一般来说，治理通常涉及谁对数据负责、数据如何处理、企业中谁有权查看特定数据集，以及他们如何使用数据。这种建立治理框架以保护数据和消费者的相同概念也适用于 AI
    模型，AI 模型可能会对某些个人或群体表现出不公平或有偏见（或两者兼有）的行为。


    数据治理已经发展了一段时间，并且有成熟的方法论和最佳实践，但我们现在需要为 AI 模型做类似的事情。传统数据治理面临的挑战是数据量的不断增长，以及需要识别数据/技术资产并将其与组织成主题和逻辑区域的业务资产保持一致，并制定规定数据资产使用的政策和规则。然而，对于
    AI 模型，有几个考虑因素，包括以下这些：


    - 模型的多个版本

    - 用于训练模型的不同输入数据集

    - 关于模型输入属性的任何/所有转换的流水线信息

    - 用于训练模型的算法/技术

    - 超参数优化

    - 用于构建和测试模型的训练/测试数据集


    可解释 AI 不仅在于能够解读模型输出，还在于能够解释模型是如何构建的、使用了哪些输入数据选择流程和过滤器、所选数据集是否符合组织政策和规则，以及所选数据集中是否存在故意或无意的偏见。


    ## 使用 Cloud Pak for Data 自动化 AI 生命周期


    当组织能够收集其数据并使用可信的治理目录进行组织后，现在可以利用这些数据来构建和扩展整个业务范围内的 AI 模型。要从头构建 AI 模型并将其扩展到整个业务，组织需要涵盖完整
    AI 生命周期的能力，包括以下内容：


    - **构建** — 这是公司构建其 AI 模型的地方。

    - **运行** — 模型构建完成后，需要将其部署到应用程序或业务流程中投入生产。

    - **管理** — 模型构建并运行后，问题就变成了：*如何以信任和透明的方式扩展它？* 为了解决复杂的构建和运行环境，企业需要一种工具，既能管理环境，又能解释其模型是如何得出预测的。


    让我们使用 Cloud Pak for Data 实践 **模型运维**（**ModelOps**），以了解该平台如何用于自动化 AI 生命周期。ModelOps
    是一种构建数据科学资产的方法论和流程，能够快速从开发阶段进入生产阶段。

