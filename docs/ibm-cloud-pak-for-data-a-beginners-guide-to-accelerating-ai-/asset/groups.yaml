  mdcn: "\n现在，让我们探讨 Cloud Pak for Data 的关键差异化优势，以及企业使用它的典型用例模式。\n\n## 探索独特的差异化优势、关键用例与客户采纳情况\n\
    \nCloud Pak for Data 为客户提供了一个单一平台，拥有丰富的模块化数据与 AI 服务生态，带来简洁性、对变化的快速适应能力，并减少对专业化和稀缺技能的依赖。与我们看到的大多数客户/企业所使用的数据库、数据运维、数据科学、数据分析和可视化等众多孤立工具的组合不同，Cloud\
    \ Pak for Data 是所有数据与 AI 服务的一个统一运营架构。其结果是令人愉悦的统一体验、通过自动化手动繁琐任务而实现的成本降低，以及强化的数据治理和安全性。\n\
    \nCloud Pak for Data 是一种以混合云数据与 AI 平台解决复杂业务问题的新方式，可在任何地方运行。\n\n以下是该平台的独特差异化优势：\n\
    \n- **统一体验：** 端到端集成平台提升了生产力，同时支持不同角色和职能部门之间的协作。\n\n- **自动化：** 利用 AI 自动化许多任务，例如构建模型（AutoAI）、发现和编目数据集（数据发现）等。\n\
    \n- **治理与安全性：** 这一点贯穿整个平台，是一个重要的差异化优势。数据治理确保客户满足合规要求并实现自助式分析，而 AI 治理则注入信任，推动企业内部\
    \ AI 项目的采用，同时满足监管合规的需求。\n\n- **随处部署：** Cloud Pak for Data 可运行在任何公有云或私有云上，并连接各处数据。这为企业提供了灵活性和基础设施选择，避免供应商锁定（*如果将来需要，可独立地将工作负载迁移到其他云提供商*）。\n\
    \n现在，让我们探讨 Cloud Pak for Data 的几个关键用例。\n\n### 关键用例\n\n以下是 Cloud Pak for Data 的一些关键用例：\n\
    \n- **AI 生命周期：** 数据科学团队正在寻找集成系统来管理 AI 生命周期中的资产，而企业**首席数据官（CDOs）**希望确保 AI 模型及其相关数据集的治理。Cloud\
    \ Pak for Data 支持端到端的 AI 生命周期，从数据准备到构建和部署模型，再到大规模管理模型，同时始终确保数据和 AI 模型的治理。企业可以获得集成体验、自动化，以及\
    \ AI 治理的好处，包括偏差检测、可解释性、模型公平性和漂移检测：\n\n| | |\n|---|---|\n| “AI Ladder”主题 | *组织*<br>*分析*\
    \ |\n| “Cloud Pak for Data” 服务 | *Watson Knowledge Catalog*<br>*Watson Studio*<br>*Watson\
    \ Machine Learning*<br>*Watson OpenScale* |\n\n图 2.2 – AI 生命周期\n\n- **数据现代化：**\
    \ 企业正面临数据激增的问题，数据分布在多个孤岛、数据库和云中。Cloud Pak for Data 通过受治理的数据虚拟化解决了这一问题，支持实时自助访问数据。它还包括一套全面的能力，用于跨所有企业数据源大规模发现、准备、转换、治理、编目和访问数据。\n\
    \n| | |\n|---|---|\n| “AI Ladder”主题 | *收集*<br>*组织* |\n| “Cloud Pak for Data” 服务\
    \ | *Watson Knowledge Catalog*<br>*Data Virtualization*<br>*Big SQL（可选）*<br>*数据存储\
    \ – Db2、MongoDB、PostgreSQL（可选）* |\n\n图 2.3 – 数据现代化\n\n- **客户服务 AI：** 自动化客户服务是\
    \ AI 在企业中的关键用例之一。Watson 除了其他功能外，还帮助缩短解决时间和呼叫量，并提高客户满意度。**Watson Assistant（WA）**\
    \ 可通过 Web/移动或语音渠道为客户或员工提供 AI 驱动的自动化协助，并使人工客服能够更好地处理客户咨询。**Watson Discovery（WD）**\
    \ 补充了 Watson Assistant，可帮助从复杂业务内容（手册、合同和扫描的 PDF）中解锁洞察：\n\n| | |\n|---|---|\n|\
    \ “AI Ladder”主题 | *注入* |\n| “Cloud Pak for Data” 服务 | *Watson Assistant*<br>*Watson\
    \ Discovery（可选）* |\n\n图 2.7 – 客户服务 AI\n\n### 客户用例：AI 申领处理\n\n一个欧洲政府机构拥有数千名直接参与福利申领处理的员工。该员工队伍正在老龄化和退休，导致客户缺乏能够处理福利申领的熟练员工。\n\
    \n因此，该机构决定创建一个福利平台，并尝试使用基于 IBM Cloud Pak for Data 和其他产品的 AI 解决方案进行申领处理。鉴于这是一个政府机构，解决方案需要在本地部署，这限制了可用选项。\n\
    \nCloud Pak for Data 中的 AI 生命周期服务（Watson Studio 和 Watson Machine Learning）被用于为福利申领流程创建机器学习模型。该项目的收益包括福利申领流程中的成本节约、速度和质量的提升。\n\
    \n### 客户用例：数据与 AI 平台\n\n一家《财富》500 强金融服务公司在成为数据驱动型企业的道路上遇到了三个主要问题。他们的数据遍布整个企业——有些在\
    \ Hadoop 中，有些在 SQL 中，有些在 Excel 电子表格中——而且很难轻松访问。他们没有企业数据治理策略，因此**没有统一的定义集**，也没有人知道数据的健康状况或其来源。\n\
    \nCloud Pak for Data 是一个开放平台，融合了专有、第三方和开源内容的良好组合，我们将在下面探讨。\n\n### 开放的生态系统\n\n\
    Cloud Pak for Data 是一个开放且模块化的平台，允许客户部署他们所需的服务。该平台的亮点之一是其充满活力的生态系统，包括 IBM 服务（进一步分为基础版和高级版）、第三方服务、行业加速器和开源内容。\n\
    \n以下服务构成了 Cloud Pak for Data 基础平台：\n\n- **Db2 Warehouse：** 一个为高性能和数据库内分析而设计的数据仓库。可在单节点上运行以提高成本效率，或在多节点上运行以提高性能。\n\
    \n- **Data Virtualization：** 利用 IBM 的专利技术构建，Data Virtualization 能够实时访问来自不同数据源的分布式数据，而无需物理移动数据。此外，查询被优化为在数据所在位置运行，从而缩短响应时间。\n\
    \n- **Db2 EventStore：** 一种为事件驱动应用快速摄取和分析流式数据而设计的数据存储。\n\n- **Streams：** 通过将流式数据和存储数据与分析相结合，构建推动实时业务决策的解决方案。\n\
    \n- **Watson Knowledge Catalog：** 快速找到正确的数据。使用智能推荐和用户评价发现相关、经过整理的数据资产。\n\n- **IBM\
    \ Regulatory Accelerator：** 简化遵守法规的流程。\n\n- **Watson Studio：** 包含三个关键组件，如下所示：\n\
    \  - **构建：** 构建自定义模型，将 AI 和机器学习注入你的业务。该组件涵盖 Watson Studio 中的模型开发能力（AutoAI 是关键差异化优势之一）。\n\
    \  - **部署：** *Watson Studio 中的模型部署能力*（前身为 Watson Machine Learning）。大规模地将机器学习模型部署到生产环境中。\n\
    \  - **信任：** Watson Studio 中的可信 AI 能力，包括可解释性、偏差和漂移检测（前身为 Watson OpenScale）。为你的\
    \ AI 注入信任和透明度，了解你的 AI 模型如何做出决策，以检测并缓解偏差。\n"
