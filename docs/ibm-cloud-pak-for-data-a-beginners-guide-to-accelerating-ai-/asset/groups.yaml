    # Security Context Constraints (SCCs)


    The concept of **Security Context Constraints (SCCs)** [10] allows cluster administrators
    to decide how much privilege to associate with any specific workload. SCCs define
    the set of conditions a Kubernetes pod must adhere to for it to be scheduled on
    the platform. The permissions granted, especially to access host resources such
    as filesystems or networks, or even which user IDs or group IDs a Pod''s processes
    can run as, are governed by the associated SCCs. For example, the *privileged*
    SCC allows all privileges and access to host directories, even run as root, while
    the *restricted* SCC denies all of that.


    By default, the *restricted* SCC is used for all Pods, while anything over *restricted*
    is considered an exception that a cluster administrator needs to authorize by
    creating a binding of that SCC to a service account.


    With *restricted*, running processes as root is disabled and Linux capabilities
    are dropped, such as *KILL*, *MKNOD*, *SETUID*, *SETGID*, and so on. This SCC
    prevents running privileged containers as well. Host paths, host network access,
    and **Inter-Process Communication (IPC)** are denied. This is enforced by OpenShift
    when Pods are started up and any attempt by processes within the Pod to violate
    this policy results in the Pod being shut down with appropriate errors.


    Cloud Pak for Data v3 introduced additional SCCs that granted incremental additional
    capabilities over *restricted* for some of its Pods without needing to use far
    more open SCCs such as *privileged* or *anyuid*:


    +   - **cpd-user-scc**: This custom SCC added a fixed UID range (1000320900 to
    1000361000), which allows all Pods that were associated with this SCC to be run
    with these user IDs. This allowed different Pods to be deterministically run with
    well-known user IDs and helped with the management of file ownership. Note: running
    as root is still prohibited. This policy also removed the need to assign an FSGroup
    policy to every Pod, which could have adverse effects in setting filesystem permissions
    for shared volumes.


    The FSGroup policy is needed to work around a problem where Kubernetes recursively
    resets file system permissions on mounted volumes. While this has a serious performance
    impact for large volumes, even causing timeouts and failures when pods start up,
    a more serious problem is associated with file permissions getting reset and perhaps
    made accessible to more Pods and users than originally intended.


    A future capability in Kubernetes (*fsGroupChangePolicy*) is expected to help
    workloads avoid this problem. [12]'
  - '[PAGE 247]


    +   - **cpd-zensys-scc**: This custom SCC is identical to `cpd-user-scc`, except
    that it also allows SETUID/SETGID privileges. It also designates one UID, 1000321000,
    as a *System* user. The primary reason for this SCC is to enable system Jobs and
    containers to initialize persistent volumes with the right file system ownership
    and permissions to allow individual content in shared volumes to be safely read
    or modified by other Pods.


    > **Note**

    > With Cloud Pak for Data v4, and since **OpenShift Container Platform v3.11**
    is reaching end-of-support, and with OpenShift Container Platform v4.6 providing
    additional security constructs needed for Cloud Pak for Data, these custom SCCs
    are no longer created. However, some services such as DB2 and Watson Knowledge
    Catalog continue to require additional custom SCCs in v4 as well. These are described
    in the service documentation [37].


    # Namespace scoping and service account privileges


    Cloud Pak for Data services are deployed into specific OpenShift project namespaces
    and their service accounts are scoped to only operate within those namespaces.
    These service accounts are associated with various Kubernetes Deployments running
    in those namespaces.


    OpenShift assigns a unique **Multi-Category Security (MCS)** label in SELinux
    to each OpenShift project. This ensures that Pods from one namespace cannot access
    files created by Pods in another namespace or by host processes with the same
    UID. [11].


    # RBAC and the least privilege principle


    The concept of roles in Kubernetes helps Cloud Pak for Data employ the principle
    of least privilege to grant each Pod only as much authorization for actions as
    needed and nothing more. This is done by introducing the following roles into
    the namespace where Cloud Pak for Data is deployed:


    | Role | Description |

    |---|---|

    | cpd-admin-role | Allows creation/updates/deletes of Kubernetes deployments,
    secrets, configmaps, run Jobs, and more, but only within that specific namespace.
    |

    | cpd-viewer-role | Allows Kubernetes API calls (GETs) but cannot perform any
    creates or deletes. |


    Figure 10.1 – Kubernetes roles used by Cloud Pak for Data service accounts'
  - '[PAGE 248]


    Specific service accounts are introduced into the namespace, which are then *bound*
    to these roles. That defines the scope of privileges each account is granted.


    > **Note**

    > With Cloud Pak for Data v4, since custom SCCs are no longer required, a different
    set of service accounts, with the prefix zen- were introduced to ensure that any
    existing SCCs are no longer picked, even accidentally.


    Kubernetes pods run with the authority of a service account. Apart from being
    only permitted to work within the confines of a namespace, the Cloud Pak for Data
    Service accounts are designed to assign only the least privileges needed for the
    specific actions being performed. The following table represents the key namespace
    scoped service accounts used in Cloud Pak for Data with v3.5 and v4 with details
    about what they are used for and what they are permitted to do.


    | Account [v3 and v3.5] | Description |

    |---|---|

    | cpd-admin-sa | Bound to the cpd-admin-role and is associated with a system user
    and cpd-zensys-scc. This account is used for preparing persistent volume mounts,
    setting file permissions, and more. |

    | cpd-editor-sa | Bound to the cpd-admin-role also but is associated with the
    cpd-user-scc, and thus has reduced privileges. |

    | cpd-viewer-sa | Bound to cpd-viewer-role and cpd-user-scc. This account can
    only view Kubernetes artifacts within that namespace. |

    | cpd-norbac-sa | Bound to cpd-noperm-scc but is not associated with any Kubernetes
    role thus has no API access. This account is similar to the out-of-the-box default
    service account. It is used by services or components that should not be granted
    any RBAC privileges. |

    | default | Automatically created in every OpenShift project, bound to the restricted
    SCC, and is not granted any RBAC privileges; that is, no roles are bound. This
    default service account will be used for end user workloads such as notebooks
    and Python Jobs and will not be allowed to perform any kind of actions inside
    the namespace. |


    Figure 10.2 – Namespace scoped service accounts used in Cloud Pak for Data – with
    v3 and v3.5'
