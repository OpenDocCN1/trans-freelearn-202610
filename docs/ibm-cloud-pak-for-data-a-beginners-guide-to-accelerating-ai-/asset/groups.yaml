    \n## 11 存储\n\n**Cloud Pak for Data** 利用 Kubernetes 的 **持久卷** 概念，该概念在 OpenShift\
    \ 中得到支持，以使其各种服务能够存储数据和元数据。Cloud Pak for Data 服务还可以连接到远程数据库、数据湖和对象存储，以及作为数据源的远程导出文件系统。我们将研究为集群内\
    \ PV 和集群外外部存储提供支持的概念和技术。到本章结束时，您将了解在各种公有云和私有云基础设施中有哪些可用选项，以及如何最好地为您的用例优化数据存储。您还将了解存储应如何进行运营化，特别是为了支持整个解决方案的持续可用性。\n\
    \n在本章中，我们将涵盖以下主要主题：\n\n- 持久卷\n- 连接到外部卷\n- 运营考虑\n\n### 理解持久卷的概念\n\n我们将首先对 Kubernetes\
    \ 中的基础存储概念进行快速介绍，以及 Cloud Pak for Data 如何利用存储。典型的容器是无状态的，这意味着它们创建的任何文件或所做的任何更改都是临时的；在重新启动容器后，这些更改不会被恢复。此外，容器内的文件将在主机上的临时位置创建，这可能导致与该位置的其他类似使用者发生冲突。在\
    \ **Kubernetes** 中，卷的概念 [1] 使有状态容器所需目录文件的持久化成为可能。此类卷安装在 Kubernetes Pod 中，并且根据与该卷关联的访问模式，相同的目录内容可以与在该\
    \ Kubernetes 命名空间内并发运行的其他 Pod 共享。\n\n在本节中，您将了解什么是预配称为 **持久卷** 的实体，它们为 Cloud Pak\
    \ for Data 工作负载提供存储，并且可以针对性能、可靠性和扩展性进行配置。\n\n多种技术和供应商使 Kubernetes 中的存储成为可能；我们将探讨目前由\
    \ Cloud Pak for Data 认证的那些技术。\n\n### Kubernetes 存储介绍\n\nKubernetes 提供了一种称为 **持久卷声明\
    \ (PVCs)**[2] 的构造，作为 Pod 挂载块和文件 **持久卷 (PVs)** [2] 的抽象，而无需使用特定于供应商的处理。存储供应商，通常作为操作符引入，提供必要的服务来定义\
    \ **存储类** [3] 和 **动态预配器** [4]，以创建、初始化并将这些卷文件系统挂载到不同的 Pod 中。虽然存储软件和配置是特定于供应商的，但\
    \ PVC 的概念使使用存储成为一种标准程序，不受提供该存储所用技术的限制。\n\n请注意，Cloud Pak for Data 需要使用 **动态预配器**；即按需预配存储的能力。静态预配器预先定义存储卷，对于通过动态、*即插即用*\
    \ 机制部署 Cloud Pak for Data 服务来说是不够的。扩展此类服务在许多情况下也可能自动要求我们创建新卷。\n\n存储类由 `StorageClass`\
    \ Kubernetes Kind 资源表示，用于引用每种类型的卷。当 Cloud Pak for Data 服务被预配时，它们包含 PVC 声明，然后由\
    \ Kubernetes 处理以预配并绑定 PV。\n\n例如，用户主目录卷是通过定义类似于以下内容的 `PersistentVolumeClaim` 来请求的：\n\
    \n```yaml\napiVersion: v1\nkind: PersistentVolumeClaim\nmetadata:\n  name: \"\
    user-home-pvc\"\nspec:\n  storageClassName: {{ <user-selected-storage-class> }}\n\
    \  accessModes:\n    - ReadWriteMany\n  resources:\n    requests:\n      storage:\
    \ {{ default \"100Gi\" or <user-selected-size> }}\n```\n\n您还会注意到 PVC 定义标识了参数，例如要使用的存储类和已请求的存储大小。这些是通过\
    \ Cloud Pak for Data 服务的安装选项引入的。\n\n*声明* 中的声明，连同存储类和其他属性（例如 `size` 和 `accessModes`），代表向\
    \ Kubernetes 请求为 Cloud Pak for Data 服务预配卷的 *请求*。一旦存储卷被预配，Kubernetes 然后通过将预配的 PV\
    \ *绑定* 到 PVC 来满足该声明。此绑定元数据然后使 Kubernetes 能够始终将相同的存储卷挂载到 Pod 中，以及使服务能够使用 PVC 的抽象始终引用该卷，而无需了解卷在物理上存在的位置或其背后的驱动程序/存储技术。\n\
    \n> **注意**\n>\n> 您无需显式定义 PVC。PVC 将在 Cloud Pak for Data 服务安装过程中声明。\n\n"
