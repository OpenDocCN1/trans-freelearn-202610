    IBM uses sophisticated multi-tenancy techniques in its cloud for the Cloud Pak
    for Data SaaS offering, and the architectural underpinnings of the Cloud Pak for
    Data software stack can also enable enterprises to support multiple tenants on
    the same OpenShift Kubernetes cluster. Chapter 9, Technical Overview, Management,
    and Administration, introduced how multi-tenancy can be achieved with the judicious
    use of Kubernetes namespaces, where a single OpenShift cluster is shared between
    multiple tenants. There needs to be careful deliberation with regards to how to
    implement multi-tenancy in a secure and reliable fashion while being mindful of
    your enterprise''s requirements, policies, and the service guarantees expected
    by tenants.


    In this chapter, we''re going to be covering the following topics:


    +   - Tenancy considerations

    +   - Architecting for multi-tenancy

    +   - A review of the tenancy requirements

    +   - In-namespace sub-tenancy with looser isolation


    # Tenancy considerations


    We will start by looking closely at what multi-tenancy implies, why tenancy is
    important, and, in general, what architectural choices, trade-offs, and compromises
    regarding expenses need to be made when planning for such shared deployments.


    # Designating tenants


    Each enterprise usually has a very different interpretation when it comes to identifying
    their tenants, but by and large, a tenant is defined as a select group of users
    granted specific privileges to access a shared software installation. When tenants
    represent different companies altogether, users belonging to one tenant are generally
    unaware of the existence of other tenant users. However, even such isolation can
    be relaxed when it comes to users within the same enterprise, and employees in
    the same company may be members of multiple tenant "accounts."'
