    IBM 理解客户正面临这一挑战。为此，IBM 构建了一种规范性方法（即**AI 阶梯**），帮助客户应对上述挑战并加速其 AI 之旅，无论他们目前处于哪个阶段。通过统一数据的收集、组织与分析（无论数据位于何处），该方法能够简化和自动化企业将数据转化为洞察的过程。借助
    AI 阶梯，企业可以构建一种受治理、高效、敏捷且面向未来的 AI 方法。此外，它也是支撑 IBM 数据与 AI 产品组合的组织架构。


    重要的是要记住，AI 并非魔法，需要深思熟虑且架构良好的方法。阶梯上的每一步对于成功应用 AI 都至关重要。


    ## AI 阶梯的各级阶梯


    下图展示了 IBM 的规范性方法，即 **AI 阶梯**：


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_22_0.png)


    图 1.2 – AI 阶梯——AI 之旅的规范性方法


    AI 阶梯包含四个步骤（通常称为阶梯的*梯级*），具体如下：


    - **1. 收集：让数据简单且可访问。** 收集所有类型的数据，无论其位于何处，以便在不断变化的数据源面前保持灵活性。

    - **2. 组织：创建业务就绪的分析基础。** 将所有客户数据组织成一个可信、业务就绪的基础，并具备内置的治理、质量、保护与合规能力。

    - **3. 分析：以信任和可解释性构建并扩展 AI。** 以更智能的方式分析客户数据，并借助 AI 模型使客户团队获得新洞察，做出更好、更明智的决策。

    - **4. 注入：将 AI 在整个业务中落地运营。** 这应在多个部门和各种流程中开展，利用预测、自动化和优化实现。制定有效的 AI 战略以实现您的 AI
    业务目标。应用 AI 来自动化和优化业务中的现有工作流，让员工专注于更高价值的任务。


    贯穿 AI 阶梯四个步骤的是 IBM **现代化**（Modernize）理念，它允许客户简化和自动化将数据转化为洞察的方式。该理念在名为 Cloud Pak
    for Data 的多云数据平台中统一了数据的收集、组织和分析。


    IBM 的方法始于一个简单的理念：随处运行。这是因为该平台可以部署在客户选择的基础设施上。IBM 支持在各大主流云平台上部署 Cloud Pak for Data，包括
    Google、Azure、AWS 和 IBM Cloud。您也可以将 Cloud Pak for Data 平台部署在本地数据中心，这对于关注混合云战略的客户尤其重要。


    IBM 之所以能在所有这些基础设施上支持 Cloud Pak for Data，是因为其核心采用了 **Red Hat OpenShift**。这是 IBM
    于 2019 年收购 Red Hat 的关键原因之一。其意图是借助全球领先的开源守护者 Red Hat，为客户提供跨任何基础设施进行扩展的灵活性。OpenShift
    是一个基于 Kubernetes 的平台，使 IBM 能够通过现代化的容器模型部署所有产品。本质上，所有能力都被重新架构为微服务，从而可以根据企业需求按需配置。


    既然我们已经介绍了 AI 阶梯和 IBM Cloud Pak for Data 平台的概念，现在让我们花些时间关注 AI 阶梯的各个梯级，以及 IBM 使其脱颖而出的能力。


    ## 收集——让数据简单且可访问


    收集层是将数据放入适当的持久化存储中，以便高效地收集和访问所有数据资产。一个架构良好的“收集”梯级能让组织根据用例和用户角色选择合适的数据存储；无论是用于数据科学家探索数据的
    Hadoop、用于通过商业智能或其他企业可视化工具交付运营报告的 OLAP、用于快速应用开发的 MongoDB 等 NoSQL 数据库，还是它们的某种组合，您都可以借助通用
    SQL 引擎以统一、集成的方式灵活实现。


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_25_0.png)


    图 1.3 – 收集——让数据简单且可访问


    我们全部支持“收集”梯级的能力组合，可分为市场上的四大工作负载领域：


    - 1. 首先是**运营数据库**。这是您的记录系统、销售点系统和事务数据库。

    - 2. 随着数据量的爆炸式增长，**分析数据库**需求旺盛。每个人都在寻找新的方法，以快速、大规模地分析数据——从传统报告到为 AI 模型的训练和评分准备数据。

    - 3. **大数据**。使用 Hadoop 构建 PB 级数据湖的历史正逐步转向存储与计算分离，Cloud Object Storage 和 Spark
    在其中扮演关键角色。市场对数据湖的需求显然在上升。

    - 4. 最后，**IoT** 正在迅速改变多个行业，快速数据领域正成为一个备受关注的领域。这是未来的市场，IBM 正通过实时数据分析来满足这一领域的需求。


    接下来，我们将探讨组织数据的重要性及其内涵。


    ## 组织——创建可信的分析基础


    鉴于数据处于 AI 的核心位置，组织需要关注数据的质量和治理，确保数据准确、一致且可信。然而，许多组织在开发数据管道和数据流时，难以简化其运营模式。


    ### 赋能数据公民的人员


    现代企业由许多不同的“数据公民”组成——从首席数据官；到数据科学家、分析师、架构师和工程师；再到需要从数据中获取洞察的各个业务线用户。“组织”梯级旨在创建并维持一种数据驱动文化，促进跨组织协作，以推动敏捷性和规模化。


    每个组织都有独特的需求，IT、数据科学和业务线的利益相关者需要创造价值以推动业务成功。此外，由于治理是支持 DataOps 的驱动力之一，组织可以利用现有的数据治理委员会和资深数据治理项目的经验，帮助建立这种文化和承诺。


    DataOps 的好处意味着，一旦企业实施正确的技术并开发自助式数据能力，将高质量、可信的数据尽快提供给合适的人员和流程，业务就能更高效地运转。下图展示了一个
    DataOps 工作流的可能形态：架构师、工程师和分析师协作处理基础设施和原始数据剖析；分析师、工程师和科学家协作构建分析模型（无论这些模型是否使用 AI）；架构师与业务用户协作，将这些模型投入运营、治理数据，并将洞察传送到需要的地方。


    每个角色中的个人都被指定为特定数据子集的**数据管家**。DataOps 方法论中数据公民的意义在于，每个不同角色都可以依赖准确、全面、安全且受治理的数据：


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_27_0.png)


    图 1.4 – 按角色划分的 DataOps 工作流


    另外，值得指出的是，构建 AI 模型是容易的部分。真正的挑战在于将这些 AI 模型部署到生产环境，监控其准确性和漂移检测，并确保这成为常态。


    IBM 在 Cloud Pak for Data 上的 AI 工具和运行时提供了一套差异化且极其强大的能力。在 Red Hat OpenShift 和 Cloud
    Pak for Data 战略的支持下，IBM 有能力设定并引领 AI 工具市场。市场上来自利基供应商的单一 AI 解决方案很多，这一点在众多分析师报告中可见；然而，没有一家能够以令人满意的方式解决将
    AI 投入生产的问题。IBM 带给市场的差异化优势是完整的端到端 AI 生命周期：


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_29_0.png)


    图 1.5 – AI 生命周期


    客户寻求集成平台有几个原因。在提及这些原因之前，以下团队关注集成平台：


    - 1. 数据科学团队正在寻找集成系统，以管理整个 AI 生命周期和跨项目团队成员的各种资产。

    - 2. 首席数据官希望治理 AI 模型及其相关数据。首席风险官（CRO）希望通过与业务流程集成来控制这些模型带来的风险。

    - 3. 扩展的 AI 应用团队需要集成，以便无缝构建、部署和运行。在某些情况下，首席信息官（CIO）/业务技术团队负责交付平台，他们希望降低 AI 应用投入生产的风险并削减成本。


    '
