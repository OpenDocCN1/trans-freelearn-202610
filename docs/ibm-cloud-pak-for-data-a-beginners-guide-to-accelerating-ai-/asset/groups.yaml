    +   - Evaluates quality dimensions to identify data quality problems

    +   - Computes a data quality score for data assets and columns

    +   - Runs quality rules and automation rules

    +   - Optionally captures sample data with data quality problems


    Upon competing the data quality analysis, you can publish the results to the governance
    catalog so that the other consumers of the platform can benefit from this analysis.'
