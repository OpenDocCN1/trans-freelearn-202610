    \ shared volumes.\n\n## Multi-tenancy, resource management, and security\n\nOpenShift\
    \ clusters are considered shared environments in many mature enterprises. They\
    \ expect to expand such clusters when needed to accommodate more workloads and\
    \ re-balance available resources. It is far more cost-effective to share the same\
    \ OpenShift cluster and consolidate management and operations rather than assign\
    \ a separate cluster to each tenant. Since such clusters include different types\
    \ of workloads from different vendors, and applications that require sophisticated\
    \ access management and security practices, a focus on tenancy is important from\
    \ the start.\n\nThe concept of tenancy itself is very subjective. In some situations,\
    \ dev-test and production installations may be considered different tenants in\
    \ the same cluster. In other cases, different departments, or different project\
    \ use cases, may be treated as individual tenants. When this concept is extended\
    \ to ISVs operating a cluster on behalf of their clients, each of those clients\
    \ is likely to be different companies and there could be stricter requirements\
    \ on tenancy compared with a case where all users are from the same company.\n\
    \nThe chapter on multi-tenancy covers the tenancy approach and best practice recommendations\
    \ with Cloud Pak for Data in greater detail. In this section, we will look at\
    \ a high-level overview of tenancy requirements and how Cloud Pak for Data is\
    \ deployed and managed in such shared Kubernetes clusters.\n\nLet's first start\
    \ with some key criteria that influence tenancy approaches:\n\n- **Isolation of\
    \ tenants:** There is a need to ensure that different tenants are fully unaware\
    \ of each other on such shared systems. This could include the need to use completely\
    \ different authentication mechanisms. Different LDAP groups or even different\
    \ LDAP servers may be desired for different tenants.\n\n  Protecting resources\
    \ via access authorizations and policies is absolutely necessary in general, but\
    \ with multiple tenant users present, these assume an even more prominent role.\n\
    \n  Isolation also extends to network isolations, even to the point of having\
    \ completely different user experience and API hostname URLs and DNS domain names\
    \ for each tenant, even if they physically share the same Kubernetes cluster.\n\
    \n  Storage systems, consumed in the form of Kubernetes persistent volumes, also\
    \ need to ensure that tenants do not have access to each other's volumes.\n"
  mdcn: "\n从这种用户体验中，如前面的截图所示，管理员随后可以查看每个 Pod，获取更多详细信息，或访问日志以进行故障排除。如果他们发现某个 Pod 运行异常，甚至可以选择重启该\
    \ Pod。\n\n请注意，该界面旨在补充 OpenShift 控制台中提供的监控和管理功能，并且仅呈现非常符合 Cloud Pak for Data 使用场景的视图，且仅限于该\
    \ Cloud Pak for Data 安装实例。\n\n## 告警\n\nKubernetes 提供了存活探针和其他原语，用于识别故障 Pod 并触发自动重启。然而，对于复杂的服务，识别跨多个\
    \ Deployment 或 StatefulSet 的故障可能并不那么简单，也无法识别任何应用层面的语义。为了补充 OpenShift 的能力，Cloud\
    \ Pak for Data 引入了额外的监控和事件持久化机制，并在用户体验中呈现问题。\n\n控制平面包含一个由 zen-watchdog 驱动的框架 [27]，用于监控事件、识别严重情况，并将这些问题作为警报提出。这些警报消息通常会作为\
    \ SNMP 陷阱发送到已配置的企业 SNMP 接收器。\n\n下图从高层次展示了 zen-watchdog 服务如何实现监控、事件聚合和警报发出：\n\n\
    ![](img/50e1dac0750b69f2b8e8efff000eb13b_220_0.png)\n\n图 9.7 – 监控事件与警报转发\n\n还可以配置不同的目标来发送警报，包括通过\
    \ SNMP 协议，或者简单地通过 SMTP 电子邮件以及 HTTP 发送。\n\nCloud Pak for Data 的控制平面本身包含一些通用的开箱即用监控器，例如：\n\
    \n- **check-pvc-status**：如果 PVC 未绑定，则记录一个关键事件\n- **check-replica-status**：如果 StatefulSet\
    \ 或 Deployment 有不可用的副本，则记录一个关键事件\n- **check-resource-status**：如果服务达到阈值，则记录一个警告事件；如果超过配额，则记录一个关键事件\n\
    \n开发人员也可以引入扩展来支持自定义监控需求。文档 [28] 使用示例代码描述了引入自定义容器镜像以提供专门监控功能并识别值得发出警报的关键问题的过程。\n\
    \n## 配置和管理服务实例\n\nCloud Pak for Data 中的许多服务都支持“服务实例”的概念，这些实例从服务目录中配置。它们是服务的独立副本，可以独立进行横向扩展和配置，通常还用于为选定的一组用户提供访问权限。\n\
    \n服务实例具有以下特征：\n\n- 它代表了按个体计量的 Kubernetes 工作负载 – 通常在与控制平面相同的命名空间中配置 – 但某些服务也可以在与控制平面命名空间\
    \ *绑定*（从管理角度来看）的“数据平面”sidecar 命名空间中配置。\n- 它由具有 *创建服务实例* 权限的授权最终用户通过配置体验和 API 进行配置：\n\
    \n  最终用户在无需 Kubernetes 访问权限或深入了解 Kubernetes 原语的情况下配置实例。\n- 它支持 RBAC，也就是说，用户可以获授细粒度的角色来访问该资源。\n\
    - 它支持安全的编程式客户端访问，具有实例级 API 密钥和服务令牌。\n\n例如，授权用户可能希望启动一个数据库实例供其团队私下使用。其他用户甚至不会知道这些实例的存在。\n\
    \n以下截图展示了部署 Db2 仓库数据库实例的示例配置体验。\n\n用户会得到关于设置实例的指导，包括适当地分配计算和存储资源：\n\n![](img/50e1dac0750b69f2b8e8efff000eb13b_222_0.png)\n\
    \n图 9.8 – 配置体验示例\n\n在为该实例选择适当的配置属性后（例如，如前面截图所示），用户随即触发实例的创建。该实例的创建者随后被指定为该实例的第一位管理员。\n\
    \n随着此类实例的创建（或者通常只要对该实例执行任何特定操作），控制平面会自动生成审计记录。\n\nCloud Pak for Data 平台管理员除了可以管理实例的创建者之外，还可以管理和监控这些实例。但是，即使是平台管理员也可能一开始就被拒绝访问以使用该实例。例如，虽然\
    \ Cloud Pak for Data 平台管理员可以执行维护任务，甚至取消配置该数据库实例，但他们可能无法访问其中的数据。从法规遵从性的角度来看，实现这种职责分离至关重要。\n\
    \n以下截图展示了授权用户（该实例的管理员或 Cloud Pak for Data 平台管理员）如何管理访问权限的示例。他们可以给其他用户和组分配角色（包括管理员角色）：\n\
    \n![](img/50e1dac0750b69f2b8e8efff000eb13b_223_0.png)\n\n图 9.9 – 实例访问管理\n\n以下截图说明了如何以类似方式向用户提供远程卷：\n\
    \n![](img/50e1dac0750b69f2b8e8efff000eb13b_227_0.png)\n\n图 9.14 – 访问远程卷\n\n这使企业能够使用\
    \ Cloud Pak for Data 中已有的数据卷，而无需将其物理传输到集群中。类似地，还支持通过 SMB 协议挂载远程 SMB（CIFS）卷，就像\
    \ Microsoft Windows 机器挂载此类共享卷一样。\n\n## 多租户、资源管理与安全\n\n在许多成熟企业中，OpenShift 集群被视为共享环境。他们期望在需要时扩展此类集群以容纳更多工作负载并重新平衡可用资源。共享同一个\
    \ OpenShift 集群并整合管理和运维，远比为每个租户分配一个单独集群更具成本效益。由于此类集群包含来自不同供应商的不同类型工作负载，以及需要复杂访问管理和安全实践的应用，因此从一开始就关注租户隔离非常重要。\n\
    \n租户这个概念本身非常主观。在某些情况下，同集群中的开发测试环境与生产安装可能被视为不同的租户。在其他情况下，不同的部门或不同的项目用例可能被视为独立的租户。当这个概念扩展到代表客户运营集群的\
    \ ISV 时，每个客户很可能是不同的公司，与所有用户来自同一公司的情况相比，对租户隔离的要求可能更严格。\n\n多租户章节更详细地介绍了 Cloud Pak\
    \ for Data 的租户方法和最佳实践建议。在本节中，我们将从高层概览租户要求，以及 Cloud Pak for Data 在此类共享 Kubernetes\
    \ 集群中的部署和管理方式。\n\n首先，让我们从影响租户方案的一些关键标准开始：\n\n- **租户隔离：** 需要确保不同租户在此类共享系统上完全互不知晓。这可能包括需要使用完全不同的身份验证机制。不同的租户可能需要不同的\
    \ LDAP 组，甚至不同的 LDAP 服务器。\n\n  通过访问授权和策略保护资源总体上是绝对必要的，但在存在多个租户用户的情况下，这些措施的作用更加突出。\n\
    \n  隔离还延伸到网络隔离，甚至达到为每个租户提供完全不同的用户体验、API 主机名 URL 和 DNS 域名的程度，即使他们在物理上共享同一个 Kubernetes\
    \ 集群。\n\n  以 Kubernetes 持久卷形式使用的存储系统也需要确保租户无法访问彼此的卷。\n\n"
