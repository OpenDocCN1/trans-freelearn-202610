    # # Enabling trust with data quality


    Data quality is a cornerstone of business operations in the organization, and
    it is affected by the way data is entered, stored, and managed. The reason for
    a lack of confidence in information is because information is pervasive across
    the organization. We are dealing with fragmented silos of data that were accumulated
