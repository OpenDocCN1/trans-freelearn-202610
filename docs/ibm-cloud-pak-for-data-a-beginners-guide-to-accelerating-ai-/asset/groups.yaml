    ## Section 3: Technical Details


    This section of the book focuses on the technical architecture of Cloud Pak for
    Data, with emphasis on security, governance, HA/DR, multi-tenancy support, administration,
    and troubleshooting tips, along with some deployment best practices.


    Note: The next 3 chapters are highly technical in nature. Hence, for the benefit
    of the readers who are new to the forthcoming topics, we have included additional
    references and citations to the end of these chapters, both as introductory material
    and for advanced insight into these topics, left to the discretion of the reader
    to pursue (as needed).


    This section comprises the following chapters:


    - Chapter 9, Technical Overview, Management, and Administration

    - Chapter 10, Security and Compliance

    - Chapter 11, Storage

    - Chapter 12, Multi-Tenancy


    ## Technical Overview, Management, and Administration


    Cloud Pak for Data is a data and AI platform that enables enterprises to tap into
    their data and accelerate the adoption of AI to drive better business outcomes.
    This platform helps them modernize their data access mechanisms, organize data
    for trusted analytics, develop machine learning models, and operationalize AI
    into their day-to-day business processes. This chapter provides an insight into
    the foundational aspects of Cloud Pak for Data, the technology stack that powers
    it, and how services integrate to deliver the key capabilities needed to be successful
    with AI in the enterprise.


    The platform serves several user personas, enabling them to collaborate easily
    with each other, and helps break down silos within the enterprise. It does this
    by abstracting the infrastructural elements and by promoting the integration of
    services to provide a seamless experience for all end users. Enterprises do not
    start off by using all services in the platform, but rather focus on specific
    use cases and then gradually expand to other scenarios as needed. You can have
    different groups of users working on different parts of a solution on Cloud Pak
    for Data while collaborating and sharing assets as needed. Enterprises may even
    have entire departments working on different use cases, with built-in isolation,
    and yet provide for appropriate quality of service to each such *tenant*. Hence,
    the platform also enables a plug-n-play mechanism and multi-tenant deployment
    models that support the extension of the same foundational platform with additional
    IBM and/or third-party services.


    In this chapter, we will be exploring these different aspects:


    - Architecture overview

    - Infrastructure requirements, storage, and networking

    - Foundational services and the control plane

    - Multi-tenancy, resource management, and security

    - Day 2 operations


    ### Technical requirements


    For a deeper understanding of the topics described in this chapter, the reader
    is expected to have some familiarity with the following technologies and concepts:


    - The Linux operating system and its security primitives

    - Cloud-native approaches to developing software services

    - Virtualization, containerization, and Docker technologies

    - Kubernetes (Red Hat OpenShift Container Platform is highly recommended)

    - Storage provisioning and filesystems

    - Security hardening of web applications, Linux hosts, and containers

    - The Kubernetes operator pattern (highly recommended)

    - The **kubectl and oc** command-line utilities, as well as the YAML and JSON
    formats needed to work with Kubernetes objects

    - An existing Cloud Pak for Data installation on an OpenShift Kubernetes cluster,
    with administration authority


    The sections will also provide links to key external reference material, in context,
    to help you understand a specific concept in greater detail or to gain some fundamental
    background on the topic.


    ### Architecture overview


    In *Chapter 1, The AI Ladder: IBM’s Prescriptive Approach*, and *Chapter 2, Cloud
    Pak for Data – Brief Introduction*, you would have seen why we needed such a platform
    in the first place. In this section, we will start by exploring what exactly we
    mean by a data and AI platform in the first place. We will outline the requirements
    of such a platform and then drill down further into the technical stack that powers
    Cloud Pak for Data.


    ### Characteristics of the platform


    Enterprises need a reliable and modern platform founded on strong cloud-native
    principles to enable the modernization of their businesses. Let''s look at what
    is expected from such a modern platform in general terms:


    - **Resiliency:** Continuous availability is a key operational requirement in
    enterprises. Users need to be able to depend on a system that can self-heal and
    failover seamlessly without needing a system administrator to manually intervene.

    - **Elasticity:** Enterprises expect the platform to grow along with their use
    cases and customers. Hence, a scalable platform is yet another key requirement.
    We also need a platform that can support workload *bursting* on demand, in other
    words, grow automatically when new workloads come in and shrink back when they
    are completed. Workloads could just be an increased concurrency with more users
    or background, even scheduled, jobs.

    - **Cost-effective:** The ability to support the balancing of available compute
    across different types of workloads and tenants is also important. In general,
    this also implies that compute can be easily transferred to those workloads that
    need it at that time; for example, the ability to assign more compute to a nightly
    data transformation or ML model retraining job while granting more compute to
    interactive users at daytime. A *production* workload may get a preference compared
    to a *development* workload. Thus, this requires the platform to control workloads
    from crossing resource thresholds, ensuring that no noisy neighbors are impacting
    both performance and reliability.

    - **Extensibility:** The platform is expected to help customers start with one
    use case and expand when needed. This also implies that the platform cannot be
    monolithic and architecturally support a plug-n-play model where capabilities
    and services can be turned on as needed. Enabling the integration of various enterprise
    and third-party systems, as well as leveraging existing investments, is also key
    for quickly realizing value from the platform.

    - **Portability:** Enterprises require a platform that works the same across different
    Infrastructure-as-a-Service providers, including on-premises. They need to be
    able to easily burst into the public cloud or across multiple clouds.

    - **Integrated:** A data and AI platform needs to be able to serve different user
    personas with different skill levels and responsibilities. Such a platform needs
    to facilitate collaborations among end users, empowering them with self-service
    capabilities that do not require constant IT handholding. This implies a seamless
    user experience and APIs that abstract the complexity of the implementation from
    its consumers.

    - **Secure:** The platform must enable enterprises to operate securely, enabling
    end user workloads or services from multiple vendors to function within well-established
    boundaries. A data and AI platform also needs to ensure that the enterprise is
    regulatory compliance-ready. Since the economics of infrastructure cost typically
    implies the use of shared computing and storage resources to support multiple
    tenants, techniques to ensure data security and isolation of tenant workloads
    become fundamental to the enterprise.


    ### Technical underpinnings


    In earlier chapters, we introduced **Kubernetes** [1] and **Red Hat OpenShift
    Container Platform** [2] as the core infrastructure powering all Cloud Paks. In
    this section, we will look at the capabilities of this technology that makes it
    the ideal vehicle for delivering a data and AI platform.

