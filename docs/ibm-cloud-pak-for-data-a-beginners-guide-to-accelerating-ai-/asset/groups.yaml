    which could involve sharing data assets and/or existing data pipelines. For a
    given use case, data scientists train tens or hundreds of AI models before picking
    the best model. To support and maximize the productivity of the data science team,
    Cloud Pak for Data supports multiple modes of collaboration, including the following:


    - Local project collaboration without Git

    - Collaboration via Git


    A local collaboration model enables all collaborators to work on one copy of assets
    in a project. Any asset being updated by one user (for example, a notebook) is
    locked until that user or an administrator unlocks it. This enables changes to
    be immediately available to all collaborators.


    For data scientists that have experience with programming/scripting languages,
    they can choose to use the Jupyter notebook interface in conjunction with different
    runtimes to programmatically do the data transformation.


    The following screenshot shows an Excel-like interface for data wrangling in Cloud
    Pak for Data:


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_123_0.png)


    Figure 5.13 – Data wrangling for non-Extract, Transform, Load (ETL) developers


    Once the data is structured in the desired format, the next step is to use this
    data and train models to help predict target variables.


    ## Model building


    Once the data is transformed and you have it in the desired shape, the next step
    is to decide which algorithm to use and build a model with it. You have the choice
    to either use a programming interface or a drag-drop user interface (UI). Cloud
    Pak for Data supports Jupyter Notebooks, JupyterLab notebooks, and the RStudio
    interface to leverage existing libraries/modules/Comprehensive R Archive Network
    (CRAN) packages and build ML models.


    Cloud Pak for Data also includes the SPSS Modeler flow service, a drag-and-drop
    interface to source data, apply transformations, train, and score ML models. There
    is a wide range of palette nodes, ranging from import operations to field/record
    operations, modeling, and visualization.


    The following screenshot shows the drag-and-drop interface for data preparation,
    statistical analysis, model building, inference, and visualization:


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_124_0.png)


    Figure 5.14 – SPSS Modeler flows for visual model building


    Now we have covered the steps to use data and train models to help predict target
    variables, we’ll be walking you through the accelerators for the Jupyter Notebook
    interface.


    ## Accelerators for the Jupyter Notebook interface


    While Jupyter Notebook is open source software, Cloud Pak for Data has enhanced
    the experience of using the Jupyter Notebook interface by adding enterprise capabilities
    such as Git integration and also accelerators such as code generation for assets
    in the catalog.


    While configuring deployments, we have the flexibility to not just define them
    as online or batch model deployments but also to specify the hardware specification
    for the actual deployment. Once the model is deployed, developers have access
    to the software development kit (SDK) in multiple languages to score against the
    model and operationalize it. The UI also allows for the testing of deployment
    models by passing through the input payload.


    The following screenshot illustrates the testing of deployment models with the
    Watson Machine Learning service in Cloud Pak for Data:


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_127_0.png)


    Figure 5.17 – Model testing with Watson Machine Learning


    Now we have covered model deployment, let''s explore the ModelOps monitoring phase.


    ## ModelOps – Monitoring phase


    Building and deploying models is only a small sliver of the AI life cycle. Managing
    the deployed models and ensuring that they are accurate and compliant with regulatory
    requirements such as **System Requirement (SR) 11-7** is a whole different ball
    game. IBM Cloud Pak for Data comes with a wide array of built-in capabilities
    to ensure trust and transparency. This includes governance of training data and
    AI models to ensure compliance, such as model explainability, fact sheets to capture
    model metadata and lineage for auditing, model monitoring, and automatic training
    of models across IBM and non-IBM deployments. As more and more enterprises operationalize
    AI, infusing governance and managing models at scale with trust and transparency
    is at the forefront, and there is no one better than IBM to deliver this.


    As businesses go through digital transformations and modernize applications by
    infusing AI, there is a need for more visibility into the recommendations made
    by AI models. In some industries such as finance and healthcare, there are regulations
    such as the **General Data Protection Regulation (GDPR)** and others that present
    significant barriers to widespread AI adoption. Applications must have the ability
    to explain their outcomes in order to be used in production systems. Every decision
    made as a result of incorporating AI needs to be traceable, enabling enterprises
    to audit the lineage of models and the associated training data, along with the
    **inputs and outputs (I/Os)** for each AI-based recommendation.


    The OpenScale service in IBM Cloud Pak for Data enables businesses to operate
    and automate AI at scale, irrespective of how the AI system was built and where
    it runs, bridging the gap between the teams that operate AI systems and those
    that manage business applications. Businesses now have confidence in AI decisions
    as they are now explainable.


    The Cloud Pak for Data OpenScale service supports the following:


    - AI deployed in any runtime environment (for example, **Amazon Machine Learning
    (Amazon ML)**, **Azure Machine Learning (Azure ML)**, and custom runtime environments,
    behind the enterprise firewall)

    - Applications and ML and DL models developed using any open source model building
    and training **integrated development environment (IDE)**, including TensorFlow,
    scikit-learn, Keras, SparkML, and PMML


    It is important to monitor for bias at runtime and notify proactively so that
    we can act on it. OpenScale monitors the data that has been sent to the model
    and the model predictions. It then identifies bias issues and notifies the user
    of these. Let''s review some core concepts before we understand how bias can be
    dealt with, as follows:


    - **Fairness attribute:** Bias is generally measured in the context of one attribute—for
    example, gender, age, and so on. This can also be non-demographic attributes such
    as account information, how long a person has been a customer, and so on.

    - **Monitored/reference group:** This is a subset of the dataset for which we
    want to measure bias. The remaining values for the fairness attribute can be called
    a reference group. If we want to measure gender bias toward males, females would
    be considered a reference group.

    - **Disparate impact:** This is a measure of bias that can be computed as a ratio
    of the percentage of a favorable outcome for the monitored group to the percentage
    of a favorable outcome for the reference group. Bias is said to exist if the disparate
    impact value is below some predefined threshold.

    - **Bias threshold:** If the bias threshold is 1, then it would mean that we expect
    both monitored and reference groups to get the same outcome of predictions.


    The following screenshot illustrates the detection of bias with Watson OpenScale:


    ![](img/50e1dac0750b69f2b8e8efff000eb13b_130_0.png)


    Figure 5.19 – Bias detection with Watson OpenScale

