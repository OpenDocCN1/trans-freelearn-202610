    # # Multi-Cloud Strategy

    ## and Cloud Satellite


    Hybrid multi-cloud support is the foundational pillar of Cloud Pak for Data, and
    the feature of deploying and running anywhere (private cloud or any public cloud)
    has been one of Cloud Pak for Data''s key differentiators. In this chapter, we
    will learn more about the supported public and private clouds, the evolution of
    Cloud Pak for Data as a Service, and IBM''s strategy to support managed services
    on third-party clouds. We will explore both the business and technical concepts
    behind IBM''s multi-cloud support, including a brief overview of IBM Cloud Satellite.
    This will allow the customer to define an effective multi-cloud strategy by leveraging
    IBM technology.


    We''re going to cover the following main topics:


    +   - IBM''s multi-cloud strategy

    +   - Supported deployment options

    +   - Cloud Pak for Data as a Service

    +   - IBM Cloud Satellite

    +   - A data fabric for a multi-cloud future'
