  - '[PAGE 33]


    # Financial operations


    Budgeting and forecasting typically involves several stakeholders collaborating
    across the enterprise to arrive at a steady answer. However, this requires more
    than hand waving. IBM’s Planning Analytics solution on Cloud Pak for Data is a
    planning, budgeting, forecasting, and analysis solution that helps organizations
    automate manual, spreadsheet-based processes and link financial plans to operational
    tactics.


    IBM Planning enables users to discover insights automatically, directly from their
    data, and drive decision making with the predictive capabilities of IBM Watson.
    It also incorporates scorecards and dashboards to monitor KPIs and communicate
    business results through a variety of visualizations.


    # Business operations


    Business operations entails several domains, including supply chain management,
    inventory optimization, human resources management, asset management, and more.
    Insights and AI models developed using the Cloud Pak for Data platform can be
    leveraged easily across their respective domains. There are several examples of
    customers using IBM solutions.


    > **Customer Use Case**

    > *A well-known North American healthcare company was trying to address a unique
    challenge. They used AI to proactively identify and prioritize at-risk sepsis
    patients. This required an integrated platform that could manage data across different
    silos to build, deploy, and manage AI models at scale while ensuring trust and
    governance. With Cloud Pak for Data, the company was able to build a solution
    in 6 weeks, which would typically take them 12 months. This delivered projected
    cost savings of ~$48 K per patient, which is a significant value.*


    Digital transformation is disrupting our global economy and will bring in big
    changes in how we live, learn, work, and entertain; and in many cases, this will
    accelerate the trends we’ve been seeing across industries. This also applies to
    how data, analytics, and AI workloads will be managed going forward. Enterprises
    taking the initiative and leveraging the opportunity to streamline, consolidate,
    and transform their architecture will come out ahead both in sustaining short-term
    disruptions and in modernizing for an evolving and agile future. IBM’s prescriptive
    approach to the AI ladder is rooted in a simple but powerful belief that having
    a strong information architecture is critical for successful AI adoption. It offers
    enterprises an organizational structure to adopt AI at scale.'
