  \ 的误差最低。这里，为了评估预测模型的结果，我们使用 k 折交叉验证方法；k 假定取为 4：\n\n```\n> #Evaluation of a top-N\
  \ recommender algorithm\n```\n\n\n\n## 可用于降维的技术\n\n降维技术可以分为两大类：参数或基于模型的特征约简，以及非参数特征约简。在非参数特征约简技术中，首先降低数据的维度，然后得到的数据可用于创建任何分类或预测模型，监督或非监督。然而，基于参数的方法强调通过改变特征来监控模型的整体性能和准确性，从而决定需要多少个特征来表示模型。以下是在数据挖掘文献中通常用于降低数据维度的技术：\n\
  \n- 非参数：\n  - PCA 方法\n  - 参数方法\n  - 前向特征选择\n  - 后向特征选择\n\n我们将借助 R 编程语言使用一个数据集详细讨论这些方法。除了前面提到的这些技术外，还有一些不太流行的方法，例如删除方差低的变量，因为它们对目标变量没有太多信息贡献，以及删除缺失值较多的变量。后者属于缺失值处理方法，但仍可用于减少高维数据集中的特征。在\
  \ R 中有两种方法，`prcomp()` 和 `princomp()`，但它们使用两种略有不同的方法；`princomp()` 使用特征向量，而 `prcomp()`\
  \ 使用 SVD 方法。一些研究人员更倾向于使用 `prcomp()` 而非 `princomp()` 方法。我们在这里将使用两种不同的方法。\n\n## 应用何种技术？\n\
  \n技术的实际使用取决于研究人员；他从数据中关注什么。如果你关注隐藏特征并希望将数据表示在低维空间中，PCA 是应选择的方法。如果你关注构建良好的分类或预测模型，那么先执行\
  \ PCA 并不是一个好主意；你理想情况下应包含所有特征并通过任何参数方法，如前向或后向，选择去除冗余特征。技术选择取决于数据可用性、问题陈述以及某人计划执行的任务。\n\
  \n```\ncov(x, y) = (∑_{i=1}^{n} (x_i - x̄)(y_i - ȳ)) / (n - 1)\n```\n\n协方差的符号比其值更重要；正的协方差值表示两个维度一起增加，反之亦然。同样，协方差的负值表示一个维度增加时，另一个维度减少。如果协方差值为零，则表明两个维度彼此独立且没有关系。\n\
  \n- 4. 从协方差矩阵计算特征向量和特征值。所有特征向量始终来自方阵，但并非所有方阵都能生成特征向量。矩阵的所有特征向量彼此正交。\n- 5. 通过按从大到小的顺序取特征值创建特征向量。具有最高特征值的特征向量是数据集的主成分。从协方差矩阵中识别出特征向量，并将特征值按从大到小排序：\n\
  - 6. 使用特征向量的转置版本和归一化数据的转置版本创建低维数据。为了得到转置数据集，我们将把特征向量的转置与归一化数据的转置相乘。\n\n```\nFeature\
  \ Vector = (Eigen1, Eigen2.....Eigen 14)\n```\n\n让我们在以下部分应用这些步骤。\n\n## 围绕降维的实践项目\n\
  \n我们将对数据集应用降维程序，既有基于模型的方法，也有基于主成分的方法，以得出较少的特征数量，以便我们可以使用这些特征将客户分类为违约者和非违约者。\n\n\
  ## 降维\n\n对于实践项目，我们考虑了一个信用卡客户数据集 `clients.csv`，其中包含 30,000 个样本和 24 个属性或维度。我们将应用两种不同的特征约简方法：传统方法以及现代机器学习方法。\n\
  \n## 属性描述\n\n以下是数据集中属性的描述：\n\n- **X1:** 已授予的信用额度金额（新台币）。包括个人消费者信用及其家庭（附属）信用。\n-\
  \ **X2:** 性别（`1 = male; 2 = female`）。\n- **X3:** 教育程度（`1 = graduate school; 2 =\
  \ university; 3 = high school; 4 = others`）。\n- **X4:** 婚姻状况（`1 = married; 2 = single;\
  \ 3 = others`）。\n- **X5:** 年龄（岁）。\n- **X6–X11:** 过去付款历史。我们追踪了 2005 年 4 月至 9 月的过去月度付款记录，如下：\n\
  \  - X6 = 2005 年 9 月的还款状态\n  - X7 = 2005 年 8 月的还款状态； . . .\n  - X11 = 2005 年 4 月的还款状态。还款状态的测量尺度为：-1\
  \ = 按时支付；1 = 延迟一个月付款；2 = 延迟两个月付款； . . .；8 = 延迟八个月付款；9 = 延迟九个月付款，等等。\n- **X12–X17:**\
  \ 账单金额（新台币）。\n  - X12 = 2005 年 9 月的账单金额；\n  - X13 = 2005 年 8 月的账单金额； . . .\n  -\
  \ X17 = 2005 年 4 月的账单金额。\n- **X18–X23:** 上期付款金额（新台币）。\n  - X18 = 2005 年 9 月支付的金额；\n\
  \  - X19 = 2005 年 8 月支付的金额； . . .\n  - X23 = 2005 年 4 月支付的金额。\n\n## 降维\n\n让我们获取数据集并进行必要的归一化和转换：\n\
  \n```\n```r\n> setwd(\"select the working directory\")\n> default<-read.csv(\"default.csv\"\
  )\ncorrplot::corrplot(cor(df),method=\"ellipse\")\n```\n```\n\n从前面的相关矩阵可以看出，X12\
  \ 到 X17 之间存在一些较强的相关性，可能可以利用 PCA 作为线性组合合并在一起。以下图表显示了不同变量之间的相关性：\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_218_0.png)\n\
  \n在之前的相关图表中，相关性的强度由椭圆的大小反映，颜色从红色到蓝色变化。蓝色椭圆表示正相关，而白色则表示无相关。变量 X12 与变量 X13 至 X17 具有高度正相关，相关值超过\
  \ 80%。\n\n第 1 行包含变量描述，并且有一些列是分类的；我们需要从数据集中删除这些列。其他一些变量显示为分类的，因此需要转换回数值模式：\n\n```\n\
  ```r\n> df<-default[-1,-c(1,3:5,7:12,25)]\n> func1<-function(x){\n+ as.numeric(x)\n\
  + }\n> df<-as.data.frame(apply(df,2,func1))\n> normalize=function(x){\n```\n\n主成分（PC）1\
  \ 解释了数据集中 42% 的变化，主成分 2 解释了数据集中 12% 的变化。这意味着第一个 PC 与 n 维空间中约 42% 的总数据点接近。从前面的结果可以看出，前\
  \ 8 个主成分捕获了数据集中 91.9% 的变化。剩余 8% 的变化由另外 6 个主成分解释。现在问题是如何选择主成分。一般经验法则是 80-20，如果 20%\
  \ 的主成分可以解释数据中 80% 的变化。有 14 个变量；我们需要查看累积起来解释数据中 80% 变化的成分数量。因此，根据 80:20 的帕累托原则，建议取\
  \ 6 个主成分，它们累积解释 81% 的变化。\n\n在多元数据集中，成分与原始变量之间的相关性称为成分载荷。主成分的载荷如下：\n\n```\n> #Loadings\
  \ of Principal Components\n> pca1$loadings\nLoadings:\nComp.1 Comp.2 Comp.3 Comp.4\
