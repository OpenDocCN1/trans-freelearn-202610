  分数的解释有点棘手，因为除非你将它们用于沿特征向量定义的直线上作图，否则它们没有任何意义。PC 分数是每个点相对于主轴的坐标。利用特征值你可以提取特征向量，这些特征向量描述了一条直线来解释\
  \ PCs。PCA 是一种多维缩放形式，因为它在不丢失变量太多信息的情况下将数据表示在较低维度。成分分数基本上是载荷与均值中心化缩放数据集的线性组合。\n\n\
  当我们处理多元数据时，可视化和围绕其构建模型非常困难。为了减少特征，使用 PCA；它减少维度，以便我们可以在较低维度中绘图、可视化并预测未来。主成分彼此正交，这意味着它们是不相关的。在数据预处理阶段，缩放函数决定了需要哪种类型的输入数据矩阵。如果使用均值中心化方法作为变换，则协方差矩阵应作为\
  \ PCA 的输入数据使用。如果缩放函数执行标准 z 分数变换，假设标准差等于 1，则应使用相关矩阵作为 PCA 的输入数据。\n\n现在问题是应用哪种变换。如果变量高度偏斜，则应使用\
  \ z 分数变换和基于相关性的 PCA。如果输入数据近似对称，则应应用均值中心化方法和基于协方差的 PCA。\n\n现在，让我们来看一下主成分分数：\n\n```\n\
