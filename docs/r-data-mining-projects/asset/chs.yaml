  \n## 数据类型转换\n\n有各种类型的数据，如数值、因子、字符、逻辑等。使用 R，如果格式化不当，将一种数据类型转换为另一种数据类型并不困难。在更改变量类型之前，必须查看它当前的数据类型。为此，可以使用以下命令：\n\
  \n```\n```r\n> is.numeric(x1)\n[1] TRUE\n> is.character(x3)\n[1] TRUE\n> is.vector(x1)\n\
  [1] TRUE\n> is.matrix(x)\n[1] FALSE\n> is.data.frame(x)\n[1] TRUE\n```\n```\n\n\n\
  \n\n\n## 使用 R 内置数据进行数据处理\n\n```r\n> # Sorting and Merging Data\n> ArtPiece<-read.csv(\"\
  ArtPiece.csv\")\n> names(ArtPiece)\n       [1] \"Cid\"                        \"\
  Critic.Ratings\"             \"Acq.Cost\"                   \n       [4] \"Art.Category\"\
  \               \"Art.Piece.Size\"             \"Border.of.art.piece\"        \n\
  \       [7] \"Art.Type\"                   \"Prominent.Color\"            \"CurrentAuctionAveragePrice\"\
  \  \n      [10] \"Brush\"                      \"Brush.Size\"                 \"\
  Brush.Finesse\"              \n      [13] \"Art.Nationality\"            \"Top.3.artists\"\
  \              \"CollectorsAverageprice\"     \n      [16] \"Min.Guarantee.Cost\"\
  \n> attach(ArtPiece)\n```\n\n在 `ArtPiece` 数据集中，共有 16 个变量：10 个数值型变量，6 个类别型变量。使用 `names`\
  \ 命令可以打印出数据集中所有变量的名称。`attach` 函数有助于将全部变量名称保留在当前 R 会话中，这样用户就不必每次在代码中的变量名前都输入数据集名称：\n\
  \n```r\n> sort(Critic.Ratings)\n     [1] 4.9921 5.0227 5.2106 5.2774 5.4586 5.5711\
  \ 5.6300 5.7723 5.9789\n5.9858 6.5078 6.5328\n    [13] 6.5393 6.5403 6.5617 6.5663\
  \ 6.5805 6.5925 6.6536 6.8990 6.9367\n7.1254 7.2132 7.2191\n    [25] 7.3291 7.3807\
  \ 7.4722 7.5156 7.5419 7.6173 7.6304 7.6586 7.7694\n7.8241 7.8434 7.9315\n    [37]\
  \ 7.9576 8.0064 8.0080 8.0736 8.0949 8.1054 8.2944 8.4498 8.4872\n8.6889 8.8958\
  \ 8.9046\n    [49] 9.3593 9.8130\n```\n\n默认情况下，排序按升序进行。若要按降序对向量排序，需要在变量名前加上负号。`Critic.Ratings`\
  \ 变量也可以按降序排序，如下所示。要按降序排序，将 `decreasing` 设为 `TRUE`，该参数可在命令中设置：\n\n```r\n> sort(Critic.Ratings,\
  \ decreasing = T)\n     [1] 9.8130 9.3593 8.9046 8.8958 8.6889 8.4872 8.4498 8.2944\
  \ 8.1054\n8.0949 8.0736 8.0080\n    [13] 8.0064 7.9576 7.9315 7.8434 7.8241 7.7694\
  \ 7.6586 7.6304 7.6173\n7.5419 7.5156 7.4722\n    [25] 7.3807 7.3291 7.2191 7.2132\
  \ 7.1254 6.9367 6.8990 6.6536 6.5925\n6.5805 6.5663 6.5617\n    [37] 6.5403 6.5393\
  \ 6.5328 6.5078 5.9858 5.9789 5.7723 5.6300 5.5711\n5.4586 5.2774 5.2106\n    [49]\
  \ 5.0227 4.9921\n```\n\n大多数情况下，我们需要根据数据框中的某些输入变量或属性对数据集进行排序，而不是对单个数值向量排序。对单个变量排序与对数据框排序截然不同。以下脚本展示了如何使用\
  \ `order` 函数对数据框进行排序：\n\n```r\n> i2<-ArtPiece[order(Critic.Ratings,Acq.Cost),1:5]\n\
  > head(i2)\n```\n\n|    | Cid | Critic.Ratings | Acq.Cost | Art.Category | Art.Piece.Size\
  \ |\n|----|-----|---------------|----------|--------------|----------------|\n|\
  \ 9  | 9   | 4.9921        | 39200    | Vintage I    | 26in. X 18in.  |\n| 50 |\
  \ 50  | 5.0227        | 52500    | Portrait Art II | 26in. X 24in. |\n| 26 | 26\
  \  | 5.2106        | 31500    | Dark Art II   | 1in. X 7in.    |\n| 45 | 45  | 5.2774\
  \        | 79345    | Gothic II     | 9in. X 29in.   |\n| 21 | 21  | 5.4586    \
  \    | 33600    | Abstract Art Type II | 29in. X 29in. |\n| 38 | 38  | 5.5711  \
  \      | 35700    | Abstract Art Type III | 9in. X 12in. |\n\n上述代码展示了评论家评分和购置成本按升序排列的结果。这里使用的是\
  \ `order` 命令而不是 `sort` 命令。`head` 命令默认从排序后的数据集中打印前六条观测值。`order` 命令后的第二个参数 `1:5` 表示我们希望从\
  \ `ArtPiece` 数据集中打印前六条观测值和五个变量。如果需要从开头打印 10 条观测值，可以执行 `head(i2, 10)`。该数据集没有任何缺失值；然而，任何实际数据集都不能排除存在\
  \ NA 或缺失值的可能。因此，当存在 NA 或缺失值时，对数据框排序可能会变得棘手。下面的例子通过在数据集中加入一些任意的 NA 值，展示 `order` 命令产生的结果：\n\
  \n```r\n> i2<-ArtPiece[order(Border.of.art.piece, na.last = F),2:6]\n> head(i2)\n\
  \              Critic.Ratings Acq.Cost          Art.Category Art.Piece.Size\nBorder.of.art.piece\n\
  18                    7.5156    34300          Vintage III   29in. X 6in.\n43  \
  \                  6.8990    59500     Abstract Art Type II 23in. X 21in.\n1   \
  \                  8.9046    49700      Abstract Art Type I 17in. X 27in.\nBorder\
  \ 1\n12                    7.5419    37100          Silhouette III  28in. X 9in.\n\
  Border 10\n14                    7.1254    54600          Vintage II       9in.\
  \ X 12in.\nBorder 11\n16                    7.2132    23100          Dark Art I\
  \       10in. X 22in.\nBorder 11\n```\n\n`na.last` 命令用于将缺失值和 NA 从数据集中单独分离出来。它们可以通过\
  \ `na.last = TRUE` 放在数据集底部，或者通过 `na.last = FALSE` 放在数据集开头。通过将 NA 在 `order` 函数中单独处理，可以保持数据的完整性。\n\
  \n`merge` 函数有助于合并两个数据框。要合并两个数据框，至少有一个列名是相同的。这两个数据框也可以通过一个称为按列合并（column bind）的函数来连接。为了展示按列合并与\
  \ `merge` 函数之间的区别，我们使用了 audit.csv 数据集。从 audit 数据集中准备了两个小型数据集 A 和 B：\n\n```r\n> A<-audit[,c(1,2,3,7,9)]\n\
  > names(A)\n[1] \"ID\"      \"Age\"     \"Employment\" \"Income\"   \"Deductions\"\
  \n> B<-audit[,c(1,3,4,5,6)]\n> names(B)\n[1] \"ID\"        \"Employment\" \"Education\"\
  \  \"Marital\"    \"Occupation\"\n```\n\n在数据集 A 和 B 中，有两个公共列：`ID` 和 `Employment`，它们可以用作合并两个数据框的主键。使用\
  \ `merge` 命令时，公共列在结果数据集中只保留一次。合并后的数据框包含两个数据框中都具有完整记录的所有行：\n\n```r\n> head(merge(A,B),3)\n\
  ```\n\n|   | ID      | Employment | Age | Income   | Deductions | Education | Marital\
  \  | Occupation |\n|---|---------|------------|-----|----------|------------|-----------|----------|------------|\n\
  | 1 | 1004641 | Private    | 38  | 81838.0  | 0          | College   | Unmarried|\
  \ Service    |\n| 2 | 1010229 | Private    | 35  | 72099.0  | 0          | Associate\
  \ | Absent   | Transport  |\n| 3 | 1024587 | Private    | 32  | 154676.7 | 0   \
  \       | HSgrad    | Divorced | Clerical   |\n\n`merge` 函数提供了四种不同的数据组合方式：自然连接、全外连接、左外连接和右外连接。除了这些连接方式外，两个数据框还可以通过特定的单个列或多个列进行合并。自然连接只保留两个数据框中匹配的行，可以通过\
  \ `all=F` 参数指定：\n\n```r\n> head(merge(A,B, all=F),3)\n```\n\n|   | ID      | Employment\
  \ | Age | Income   | Deductions | Education | Marital | Occupation |\n|---|---------|------------|-----|----------|------------|-----------|---------|------------|\n\
  | 1 | 1044221 | Private    | 60  | 7568.23  | 0          | College   | Married |\
  \ Executive  |\n| 2 | 1047095 | Private    | 74  | 33144.40 | 0          | HSgrad\
  \    | Married | Service    |\n| 3 | 1047698 | Private    | 43  | 43391.17 | 0 \
  \         | Bachelor  | Married | Executive  |\n\n全外连接允许我们保留两个数据框中的所有行，这可以通过 `all=T`\
  \ 命令指定。它执行完整合并，并在两个数据框中没有匹配数据的位置用 NA 值填充列。`merge` 函数的默认设置是丢弃两个数据框中所有不匹配的案例；要保留新数据框中的所有案例，我们需要指定\
  \ `all=T`：\n\n```r\n> head(merge(A,B, all=T),3)\n```\n\n|   | ID      | Employment\
  \ | Age | Income   | Deductions | Education | Marital | Occupation |\n|---|---------|------------|-----|----------|------------|-----------|---------|------------|\n\
  | 1 | 1004641 | Private    | 38  | 81838.0  | 0          | NA        | NA      |\
  \ NA         |\n| 2 | 1010229 | Private    | 35  | 72099.0  | 0          | NA  \
  \      | NA      | NA         |\n| 3 | 1024587 | Private    | 32  | 154676.7 | 0\
  \          | NA        | NA      | NA         |\n\n左外连接允许我们包含数据框一（A）中的所有行，以及数据框二（B）中匹配的行；要执行此操作，我们需要指定\
  \ `all.x=T`：\n\n```r\n> head(merge(A,B, all.x = T),3)\n```\n\n|   | ID      | Employment\
  \ | Age | Income   | Deductions | Education | Marital | Occupation |\n|---|---------|------------|-----|----------|------------|-----------|---------|------------|\n\
  | 1 | 1004641 | Private    | 38  | 81838.0  | 0          | NA        | NA      |\
  \ NA         |\n| 2 | 1010229 | Private    | 35  | 72099.0  | 0          | NA  \
  \      | NA      | NA         |\n| 3 | 1024587 | Private    | 32  | 154676.7 | 0\
  \          | NA        | NA      | NA         |\n\n右外连接允许我们包含数据框 B 中的所有行，以及 A 中匹配的行；指定\
  \ `all.y=T`：\n\n```r\n> head(merge(A,B, all.y = T),3)\n```\n\n|   | ID      | Employment\
  \ | Age | Income   | Deductions | Education | Marital | Occupation |\n|---|---------|------------|-----|----------|------------|-----------|---------|------------|\n\
  | 1 | 1044221 | Private    | 60  | 7568.23  | 0          | College   | Married |\
  \ Executive  |\n| 2 | 1047095 | Private    | 74  | 33144.40 | 0          | HSgrad\
  \    | Married | Service    |\n| 3 | 1047698 | Private    | 43  | 43391.17 | 0 \
  \         | Bachelor  | Married | Executive  |\n\n在数据框 A 和 B 中，有两个公共列：`ID` 和 `Employment`。使用\
  \ `merge` 命令时，如果我们只按一个公共变量作为合并依据，另一个公共变量会出现在结果数据框中。如果我们选择多个公共变量作为合并条件，那么结果数据框中所有重复的列都会消失。\n\
  \n\n\n\n\n> head(merge(A,B,by=\"ID\"),3)\n        ID Age Employment.x  Income Deductions\
  \ Employment.y Education Marital Occupation\n    1 1044221 60 Private 7568.23 0\
  \ Private College Married Executive\n    2 1047095 74 Private 33144.40 0 Private\
  \ HSgrad Married Service\n    3 1047698 43 Private 43391.17 0 Private Bachelor Married\
  \ Executive\n\n> head(merge(A,B,by=c(\"ID\",\"Employment\")),3)\n        ID Employment\
  \ Age  Income Deductions Education Marital Occupation\n    1 1044221 Private 60\
  \ 7568.23 0 College Married Executive\n    2 1047095 Private 74 33144.40 0 HSgrad\
  \ Married Service\n    3 1047698 Private 43 43391.17 0 Bachelor Married Executive\n\
  \n当两个数据框至少包含一个共同列时，merge 函数即可发挥作用。如果两个数据框包含的列完全不同，或者两者之间没有共同列，那么要合并这两个数据框，可以使用列绑定函数。列绑定函数会打印数据框\
  \ A 和数据框 B 中的所有列，并将它们并排放置：\n\n> A<-audit[,c(2,7,9)]\n> names(A)\n[1] \"Age\"   \
  \   \"Income\"   \"Deductions\"\n> B<-audit[,c(4,5,6)]\n> names(B)\n[1] \"Education\"\
  \ \"Marital\"   \"Occupation\"\n> head(cbind(A,B),3)\n  Age Income Deductions Education\
  \  Marital Occupation\n1  38 81838.0         0 College Unmarried Service\n2  35\
  \ 72099.0         0 Associate Absent Transport\n3  32 154676.7         0 HSgrad\
  \ Divorced Clerical\n\n## 数据框的索引或子集\n\n在处理包含大量观测值的客户数据集时，需要根据某些选择标准对数据进行子集划分，并进行有放回或无放回的抽样。索引是根据某些逻辑条件从数据框中提取数据子集的过程。subset\
  \ 函数可以像索引一样从数据框中提取元素：\n\n> newdata <- audit[ which(audit$Gender==\"Female\" & audit$Age\
  \ > 65), ]\n> rownames(newdata)\n[1] \"49\"  \"537\" \"552\" \"561\" \"586\" \"\
  590\" \"899\" \"1200\" \"1598\" \"1719\"\n\n上述代码说明：从 audit 数据集中选择性别为女性且年龄大于 65 岁的观测值。which\
  \ 命令用于根据上述两个标准选择 audit 数据的子集。满足上述条件的观测值有 10 个，数据框的行号已打印出来。使用 subset 函数也可以获得类似的结果。应该使用\
  \ subset 函数而不是 which 函数，因为前者在传递多个条件时效率更高。让我们看看 subset 函数的使用方式：\n\n> newdata <- subset(audit,\
  \ Gender==\"Female\" & Age > 65,\nselect=Employment:Income)\n> rownames(newdata)\n\
  [1] \"49\"  \"537\" \"552\" \"561\" \"586\" \"590\" \"899\" \"1200\" \"1598\" \"\
  1719\"\n\nsubset 函数中的额外参数使该函数更加高效，因为它提供了额外的好处：可以从满足逻辑条件的数据框中选择特定的列。\n\n## 日期和时间格式化\n\
  \n日期函数返回一个 Date 类，表示自 1970 年 1 月 1 日以来的天数。as.numeric() 函数可用于创建一个数值变量，其值为自 1970 年\
  \ 1 月 1 日以来的天数。as.Date() 的返回值是一个 Date 类对象：\n\n> Sys.time()\n[1] \"2015-11-10 00:43:22\
  \ IST\"\n> dt<-as.Date(Sys.time())\n> class(dt)\n[1] \"Date\"\n\n系统时间函数会捕获包含时区的日期和时间。当我们使用\
  \ as.Date 函数转换系统时间并将其存储为 R 中的新对象时，我们会发现该对象的类是 Date。weekdays 函数返回星期几的名称，如\"Monday\"\
  或\"Wednesday\"。months 函数从日期变量中返回月份的名称。quarters 函数返回日期对象的季度名称，也可以使用 substr() 命令提取年份值：\n\
  \n> weekdays(as.Date(Sys.time()))\n[1] \"Monday\"\n> months(as.Date(Sys.time()))\n\
  [1] \"November\"\n> quarters(as.Date(Sys.time()))\n[1] \"Q4\"\n> substr(as.POSIXct(as.Date(Sys.time())),1,4)\n\
  [1] \"2015\"\n\n如果数据集中给定的日期变量格式不适合进一步计算，可以使用 format 函数对其进行格式化：\n\n> format(Sys.time(),format\
  \ = \"%m %d %y\")\n[1] \"11 10 15\"\n\n根据用户需求，可以传递给 format 参数的各种选项如下：\n\n| 选项 |\
  \ 作用 |\n|---|---|\n| #%d | 表示日期为数字（0-31）01-31 |\n| #%a | 表示缩写的星期几，如 Mon |\n| #%A\
  \ | A 表示未缩写的星期几，如 Monday |\n| #%m | 月份（00-12） |\n| #%b | 缩写的月份 |\n| #%B | 未缩写的月份，如\
  \ January |\n| #%y | 两位数的年份（13） |\n| #%Y | 四位数的年份（2013） |\n\n表 1：日期格式化选项\n\n实际数据集包含日期字段，如零售中的交易日期、医疗保健中的就诊日期、BFSI\
  \ 中的处理日期；任何时间序列数据都至少包含一个时间元素。要将日期变量纳入任何统计模型，需要进行数据转换，例如在零售场景中计算客户的新近度（vintage）。可以使用上述选项进行数据转换。\n\
  \n## 创建新函数\n\nR 中有两种不同类型的函数：用户自定义函数和内置函数。\n\n| cos(x), sin(x), tan(x) | 还有 acos(x),\
  \ cosh(x), acosh(x) 等 |\n|---|---|\n| log(x) | 自然对数 |\n| log10(x) | 常用对数 |\n| exp(x)\
  \ | e^x |\n\n表 2：一些内置函数\n\n## 循环概念——for 循环\n\nfor 循环是 R 中最常用的循环结构。使用 for 循环，可以迭代地多次执行类似的任务，让我们看一个应用\
  \ for 循环概念的示例。在以下代码中，创建了一个从 10 到 25 的数字序列。空向量 v 充当存储单元。如果以下代码中提到的条件不满足，则循环永远不会执行：\n\
  \nx<-100:200\ny <- NULL # NULL vector as placeholder\nfor(i in seq(along=x)) {\n\
  \  if(x[i] < 150) {\n    y <- c(y, x[i] - 50)\n  } else {\n    y <- c(y, x[i] +\
  \ 50)\n  }\n}\nprint(y)\n\n## 循环概念——repeat 循环\n\nrepeat 循环用于在向量或数据框上迭代执行某个计算。它没有检查退出循环条件的机制；通常使用\
  \ break 语句来退出循环。如果未能在 repeat 循环中提供任何 break 条件，则 repeat 循环将无限运行。让我们看看如何编写 repeat\
  \ 循环的代码。以下代码中使用的 break 条件是 if x > 2.6：\n\nx <- 100\nrepeat {\n  print(x)\n  x =\
  \ sqrt(x)+10\n  if (x > 2.6) {\n    break\n  }\n}\n\napply 函数族中还有其他函数，例如：\n- eapply：在环境中对值应用函数\n\
  - mapply：对多个列表或向量参数应用函数\n- rapply：递归地对列表应用函数\n\n## 字符串处理\n\n字符串处理或字符处理是任何数据管理系统的重要方面。在典型的现实世界数据集中，例如客户姓名，会有不同的写法，如\
  \ J H Smith、John h Smith、John h smith 等。经过验证，可以发现这三个名字都属于同一个人。在典型的数据管理中，标准化数据集中的文本列或变量非常重要，因为\
  \ R 区分大小写，它会将任何差异视为新的数据点。还可能有其他变量，如车辆的名称/型号、产品描述等。让我们看看如何使用一些函数来标准化文本：\n\n> x<-\"\
  data Mining is not a difficult subject, anyone can master the subject\"\n> class(x)\n\
  [1] \"character\"\n> substr(x, 1, 12)\n[1] \"data Mining \"\n\n上述脚本中的对象 x 是一个字符串或字符对象。substr\
  \ 命令用于从字符串中提取子字符串，位置由函数中定义。如果需要更改或替换某些模式或文本，可以使用 sub 命令。用户需要传递四个重要的参数：需要搜索模式的字符串、模式、需要替换的修改后模式，以及是否接受区分大小写。让我们看一个示例脚本：\n\
  \n> sub(\"data mining\", \"The Data Mining\", x, ignore.case =T, fixed=FALSE)\n\
  [1] \"The Data Mining is not a difficult subject, anyone can master the subject\"\
  \n> strsplit(x, \"\")\n[[1]]\n[1] \"d\" \"a\" \"t\" \"a\" \" \" \"M\" \"i\" \"n\"\
  \ \"i\" \"n\" \"g\" \" \" \"i\" \"s\" \" \" \"n\"\n\"o\" \"t\" \" \" \"a\" \" \"\
  \n[22] \"d\" \"i\" \"f\" \"f\" \"i\" \"c\" \"u\" \"l\" \"t\" \" \" \"s\" \"u\" \"\
  b\" \"j\" \"e\" \"c\"\n\"t\" \",\" \" \" \"a\" \"n\"\n[43] \"y\" \"o\" \"n\" \"\
  e\" \" \" \"c\" \"a\" \"n\" \" \" \"m\" \"a\" \"s\" \"t\" \"e\" \"r\" \" \"\n\"\
  t\" \"h\" \"e\" \" \" \"s\"\n[64] \"u\" \"b\" \"j\" \"e\" \"c\" \"t\"\n\n\n\n\n\n\
  `strsplit` 函数有助于从字符串中展开字母。`sub` 命令用于更改字符串中不正确的模式。`ignore.case` 选项使用户在搜索定义字符串中的模式时能够打开或关闭大小写敏感性。\n\
  \n## NA 和缺失值管理\n\n缺失值处理是标准数据挖掘文献中的重要任务。在 R 编程语言中，缺失值表示为 NA。NA 不是字符串或数值值；它们被视为缺失值的指示符。将数据集导入\
  \ R 编程平台后，检查任何变量是否存在缺失值非常重要。为此，使用了 `is.na()` 命令。请参阅此处给出的示例：\n\n```r\n> x <- c(12,\
  \ 13, 14, 21, 23, 24, NA, 25, NA, 0, NA)\n> is.na(x)\n[1] FALSE FALSE FALSE FALSE\
  \ FALSE FALSE TRUE FALSE TRUE FALSE TRUE\n> mean(x, na.rm = TRUE)\n[1] 16.5\n> mean(x)\n\
  [1] NA\n```\n\n对象 `x` 是一个包含一些 NA 值的数值向量。为此，可以使用 `is.na()`；在条件满足的地方，结果将为 TRUE。如果在存在\
  \ NA 的情况下计算任何内容，我们最终会得到错误或无结果。或者，我们可以通过更改 NA 值来替换数据集，也可以在执行任何计算时删除这些 NA 值。如前面的脚本所示，用于从对象\
  \ `x` 的均值计算中删除 NA 的是 `na.rm = T`。\n\n## 缺失值插补技术\n\n要从数据集中删除缺失值，可以使用 `na.omit()`。即使只有一个变量的数据缺失，它也会删除整行。存在各种缺失值插补方法：\n\
  \n- **均值插补**：数据向量中的缺失值被该向量（不包括 NA）的均值或中位数值替换。\n- **局部平均法**：通过考虑 3 或 5 期的移动平均来计算缺失值的局部平均值；也就是说，对于\
  \ 3 期平均值，缺失数据的先前和后继值可以帮助确定缺失值应为多少。\n- **保持其单独**：有时插补根本不可能，客户可能有兴趣将缺失值分开，以单独了解缺失行为。\n\
  - **基于模型**：有一些基于模型的缺失值插补技术，例如基于回归的缺失值预测方法。\n- **聚类**：与基于回归的缺失值插补预测类似，k-means 聚类可用于对数据集中的缺失值进行插补。\n\
  \n## 总结\n\n根据前面的讨论，可以总结如下：数据操作和数据管理是在各种实时项目上执行数据挖掘的重要步骤。由于 R 提供了更好的统计编程平台和可视化，使用\
  \ R 向读者解释各种数据挖掘概念是有意义的。在本章中，我们介绍了数据挖掘和 R 的介绍以及概念、一些编程基础、R 数据类型等。我们还介绍了使用 R 导入和导出各种外部文件格式、排序和合并概念以及缺失数据管理技术。\n\
  \n在下一章中，我们将学习更多关于使用 R 执行探索性数据分析的内容，以及如何理解单变量、双变量和多变量数据集。首先，我们将了解概念和实际解释，然后是 R 实现，以获得有关探索性数据分析的知识。\n"
