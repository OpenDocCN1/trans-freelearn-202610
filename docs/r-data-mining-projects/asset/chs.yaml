  \ | 1.875752 |\n\n- 在电信行业，基站的定位以优化用户体验为驱动，由细分练习决定。电信套餐的设计，如定制优惠（尤其是针对学生、老年人、专业人士等），基于服务使用情况，也采用聚类方法制定。\n\
  - 在医疗行业，为不同部门如急诊护理、急性护理等决定医院床位规模，聚类练习有所帮助。此外，不同州各种疾病的报告可用于创建相似区域或地点的聚类，在这些区域可采用一套程序。\n\
  - 在治理方面，执法机构加强在犯罪证据/事件较多的地区存在。因此聚类技术被用来创建城市群，如高、中、低犯罪地区。根据数据，他们可以相应地调配力量。\n- 在保险行业，聚类用于通过基于人口统计信息、地理位置和风险区域等参数对不同城市进行分组来决定差异化保费。\n\
  \n## Understanding customer segmentation\n\n在标准的数据挖掘实践中，客户细分是将所有客户划分为与业务和业务问题相关的各个子群的一种方式。该子群的创建可以通过主观方法完成，也可以通过考虑业务目标来完成。在不同行业，客户细分具有不同的应用；例如，在零售业，了解客户的购买行为很重要，而显示独特购买行为的不同子群与业务相关。\n\
  \n## Why understanding customer segmentation is important\n\n在零售和电子商务行业，优惠、活动、忠诚度计划和折扣策略都基于客户子群的购买行为。在其他行业，销售、营销策略和业务计划都是以客户行为为依据进行的，而行为驱动销售。通过对数据进行细分，可以理解这种独特的客户行为。\n\
  \n## How to perform customer segmentation?\n\n在讨论了执行客户细分的好处后，了解如何执行客户细分很重要。执行客户细分使用的两种主要方法如下：\n\
  \n- 基于聚类方法的客户细分\n- 使用最近购买、购买频率和货币价值（RFM）模型的客户细分\n\n在本章中，我们将讨论基于聚类的方法来执行客户细分；第二种方法不在本章范围内。\n\
  \n## Various clustering methods available\n\n所有聚类算法都可以分为四组，如下所示：\n\n- **Hierarchical\
  \ clustering**：使用此方法，从数据集中准备多个聚类，形成层次结构，并使用树结构对聚类进行分组，以便整个数据集可以表示为单个树结构。这种方法的优点是与基于划分的聚类不同，我们不需要指定要从数据集中创建的聚类数量。\n\
  - **Partitioning clustering**：在此方法中，数据集基于距离函数划分为有限的聚类组，使得簇内相似性最大且簇间相似性最小。K-means\
  \ 是数据挖掘实践中流行的一个方法，属于此类。\n- **Model-based clustering**：使用数据模型，从数据集中创建一组聚类；模型化聚类方法中使用的方法可分为两组：\n\
  \  - 最大似然估计\n  - 贝叶斯估计\n- **Other clustering algorithms**：还有其他聚类技术，如模糊聚类、装袋聚类等。模糊聚类在数据上使用模糊逻辑，使得同一数据点可以成为多个聚类的一部分。换句话说，聚类成员资格没有排他性。这种方法基本上不同于其他三种聚类形式，其中数据点属于单个聚类。属于这一组的另一个算法被称为自组织映射（SOM）。\n\
  \n\n\n\n\n现在，让我们以医疗保健数据集（`PimaIndiansDiabetes.csv [ref: 1]`）和零售/电子商务数据集（`Wholesalecustomers.csv\
  \ [ref: 1]`）为例，开始使用各种聚类方法对数据集进行分割。在运行聚类分析之前，需要检查数据充分性条件。\n\n## K-means 聚类\n\nK-means聚类是一种无监督学习算法，它试图将相似的对象组合成一个组，使得组内相似性最大，组间对象相似性最小。这里的“对象”指输入到算法中的数据点。组内相似性基于称为质心（算术平均值）的中心性度量和一个距离函数来计算，该距离函数度量组内对象与中心的接近程度。K-means中的“K”表示用户可能感兴趣的簇数。K-means聚类需要遵循以下步骤。由于使用均值作为估计质心的度量，它无法避免极端观测值或异常值的影响。因此，在运行K-means聚类之前，需要检查数据集中是否存在异常值。\n\
  \n### 1. 检查是否存在异常值\n\n让我们使用箱线图方法识别`Wholesalecustomers.csv`数据集中是否存在任何异常值：\n\n```r\n\
  > r_df<-read.csv(\"Wholesalecustomers.csv\")\n> ####Data Pre-processing\n> par(mfrow=c(2,3))\n\
  > apply(r_df[,c(-1,-2)],2,boxplot)\n```\n\n前面每个变量的箱线图中，须线之后的散点表明数据集中存在大量异常值。实践者通常使用封顶方法从数据集中去除异常值。如果任何数据点超过每个变量的分位数（90%分位数、95%分位数或99%分位数），则需要在相应的分位数处对这些数据点进行封顶：\n\
  \n```r\n> #computing quantiles\n> quant<-function(x){quantile(x,probs=c(0.95,0.90,0.99))}\n\
  > out1<-sapply(r_df[,c(-1,-2)],quant)\n```\n\n### 2. 缩放数据集\n\n在K-means聚类分析中仅包含连续变量并不能保证所有变量都处于同一尺度。例如，客户的年龄范围是0-100，而客户的收入范围是0-100,000。由于两者的度量单位不同，它们可能落入不同的簇，当需要表示更多数据点时，这会变得更加复杂。为了在聚类过程中比较各分组，所有变量都需要在同一尺度上进行标准化；这里我们对所有变量应用了标准正态变换（Z变换）：\n\
  \n```r\n> r_df_scaled<-as.matrix(scale(r_df[ ,c(-1,-2)]))\n> head(r_df_scaled)\n\
  Fresh Milk Grocery Frozen Detergents_Paper Delicassen\n[1,]  0.2351056 1.2829174\
  \ 0.11321460 -0.96232799 0.1722993 0.1570550\n[2,] -0.4151579 1.3233470 0.45658819\
  \ -0.30652122 0.4120701 0.6313698\n[3,] -0.4967305 1.0597962 0.13425842 -0.03373355\
  \ 0.4984496 1.8982669\n[4,]  0.3041643 -0.9430315 -0.45821928 1.66113143 -0.6670924\
  \ 0.6443648\n[5,]  1.3875506 0.1657331 0.05110966 0.60623797 -0.1751554 1.8928669\n\
  [6,] -0.1421677 0.9153464 -0.30338465 -0.77070636 -0.1681831 0.2974239\n```\n\n\
  ### 3. 选择初始簇种子\n\n初始随机种子的选择决定了模型收敛所需的迭代次数。通常，随机选择的初始簇种子是簇的临时均值。根据距离函数度量，距离质心更近的对象被分配为该簇的成员。随着新成员加入簇，再次计算质心，并将每个种子值替换为相应的簇质心。在K-means聚类中，这种向组中添加更多对象并因此更新质心的过程会持续进行，直到质心不再移动且对象不再改变所属簇。\n\
  \n### 4. 确定簇数 K\n\n在R语言中，有Rcmdr（R Commander）和stats两个库支持K-means聚类，它们使用两种不同的方法。运行该算法需要加载Rcmdr库，而stats已内置在基础R中。使用K-means算法表示数据所需的簇数由碎石图根据以下公式确定：\n\
  \n```r\n> library(Rcmdr)\n> sumsq<-NULL\n> #Method 1\n> par(mfrow=c(1,2))\n> for\
  \ (i in 1:15) sumsq[i] <-\n+ sum(KMeans(r_df_scaled, centers=i, iter.max=500,\n\
  + num.seeds=50)$withinss)\n>\n> plot(1:15, sumsq, type=\"b\", xlab=\"Number of Clusters\"\
  ,\n+ ylab=\"Within groups sum of squares\", main=\"Screeplot using Rcmdr\")\n>\n\
  > #Method 2\n> for (i in 1:15) sumsq[i] <-\n+ sum(kmeans(r_df_scaled, centers=i,\
  \ iter.max=5000,\n+     algorithm = \"Forgy\")$withinss)\n>\n> plot(1:15, sumsq,\
  \ type=\"b\", xlab=\"Number of Clusters\",\n+ ylab=\"Within groups sum of squares\"\
  , main=\"Screeplot using Stats\")\n```\n\n下图解释了碎石图。使用两种方法，通过观察碎石图上的“肘部”点，确定理想簇数为4。纵轴显示组内平方和随着横轴上簇数的增加而下降：\n\
  \n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_179_0.png)\n\n一旦确定了簇数，就可以计算簇中心和距离，下面的代码解释了K-means聚类中要使用的函数。此处的目标是对对象进行分类，使一个组与另一个组之间的对象尽可能不同，而每组内部的对象尽可能相似。可以使用以下函数计算从簇中心到各个对象的组内平方和：\n\
  \n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_180_0.png)\n\n计算每个簇的平方和，然后相加得到数据集的组内平方和总计。此处的目标是最小化组内平方和总计。\n\
  \n### 5. 基于最小距离分组\n\nK-means语法及参数说明如下：\n\n```r\nkmeans(x, centers, iter.max = 10,\
  \ nstart = 1,\n       algorithm = c(\"Hartigan-Wong\", \"Lloyd\", \"Forgy\",\n \
  \      \"MacQueen\"), trace=FALSE)\n```\n\n| 参数 | 描述 |\n|---|---|\n| `x` | **数据的数值矩阵，或可被强制转换为此类矩阵的对象（例如数值向量或所有列均为数值型的数据框）**\
  \ |\n| `centers` | 簇的数量，比如 *k*，或一组初始（不同的）簇中心。如果是一个数字，则从 *x* 中随机选择一组（不同的）行作为初始中心。\
  \ |\n| `iter.max` | 允许的最大迭代次数。 |\n| `nstart` | 如果中心是一个数字，应选择多少个随机集合？ |\n| `algorithm`\
  \ | 字符型。可缩写。注意，“Lloyd”和“Forgy”是同一算法的替代名称。 |\n\n*表1：K-means语法说明*\n\n```r\n> #Kmeans\
  \ Clustering\n> library(cluster);library(cclust)\n> set.seed(121)\n> km<-kmeans(r_df_scaled,\
  \ centers=4, nstart=17, iter.max=50000, algorithm = \"Forgy\", trace = T)\n```\n\
  \n使用缩放后的数据集创建簇，共4个簇和17个初始起点。在Forgy算法下进行50,000次迭代后，从模型中获得以下结果：\n\n```r\n> #checking\
  \ results\n> summary(km)\n```\n\n对于同一数据集，我们可以预测簇成员关系，实际簇成员关系与预测簇成员关系可以用下表表示：\n\n\
  ```r\n> #predicting cluster membership\n> Cluster$Predicted<-predict.kmeans(km,r_df_scaled)\n\
  > table(Cluster$Membership,Cluster$Predicted)\n1 2 3 4\n1 84 0 0 0\n2 0 188 0 0\n\
  3 0 0 65 0\n4 0 0 0 103\n```\n\n### 6. 在实际应用中实现K-means\n\n为了在其他统计软件和Web应用中实现K-means聚类，可以使用PMML脚本。**PMML**代表**预测模型标记语言（Predictive\
  \ Model Markup Language）**，它被公认为部署预测模型的行业标准：\n\n```r\n> #pmml code\n> library(pmml);\n\
  > library(XML);\n> pmml(km)\n```\n\n当我们以PMML格式保存模型时，它会为模型准备一个XML脚本，模型参数嵌入在脚本中。其编写方式使得任何其他外部统计软件都可以读取该模型。\n\
  \n## 层次聚类\n\n实现层次聚类算法有两种不同的方式，但有一点是共同的：两者都使用距离度量来估计聚类成员之间的相似性：\n\n- **凝聚法：** 自底向上的方法\n\
  - **分裂法：** 自顶向下的方法\n\n\n\n\n\n要进行层次聚类，输入数据必须是距离矩阵形式。所选方法必须是 `\"single\"`、`\"complete\"\
  `、`\"average\"`、`\"mcquitty\"`、`\"ward.D\"`、`\"ward.D2\"`、`\"centroid\"` 或 `\"median\"\
  ` 之一。\n\n层次聚类算法遵循以下步骤：\n\n1. 从 N 个单例簇（节点）开始，标记为 -1, ..., -N，代表初始的输入点集合。\n2. 使用距离函数，在所有成对距离中找到距离最小的一对节点/簇。\n\
  3. 将两个节点合并为一个新节点，并移除两个旧节点。新节点依次标记为 1, 2, ...\n4. 新节点到所有其他节点的距离由 `method` 参数决定。\n\
  5. 从步骤 2 开始重复 N - 1 次，直到剩下一个包含所有原始输入点的大节点。\n\n如果选择用于执行层次聚类的方法是 `ward`，则用于聚类的距离度量应为欧氏距离。以下代码展示了如何执行凝聚层次聚类：\n\
  \n```r\n> hfit<-hclust(dist(r_df_scaled,method = \"euclidean\"),method=\"ward.D2\"\
  )\n> par(mfrow=c(1,2))\n> plot(hfit,hang=-0.005,cex=0.7)\n> hfit<-hclust(dist(r_df_scaled,method\
  \ = \"manhattan\"),method=\"mcquitty\")\n> plot(hfit,hang=-0.005,cex=0.7)\n> hfit<-hclust(dist(r_df_scaled,method\
  \ = \"minkowski\"))\n> plot(hfit,hang=-0.005,cex=0.7)\n> hfit<-hclust(dist(r_df_scaled,method\
  \ = \"canberra\"))\n> plot(hfit,hang=-0.005,cex=0.7)\n```\n\n这是第一个树状图：\n\nComplete、average、mcquitty、centroid、median、ward.D、ward.D2。每种方法都不同。Single\
  \ linkage 使用最小的最小成对距离来合并两个簇。Complete linkage 使用两个不同簇中差异最大的对象之间的相似度。同样，每种方法都有其独特的计算不同簇之间相似度的方法：\n\
  \n```r\n> summary(hfit)\nLength Class Mode\nmerge 878 -none- numeric\nheight 439\
  \ -none- numeric\norder 440 -none- numeric\nlabels 0 -none- NULL\nmethod 1 -none-\
  \ character\ncall 3 -none- call\ndist.method 1 -none- character\n```\n\n可以使用 `cluster`\
  \ 库中的 `diana` 函数执行分裂层次聚类。语法如下所示：\n\n```r\ndiana(x, diss = inherits(x, \"dist\"),\
  \ metric = \"euclidean\", stand = FALSE, keep.diss = n < 100, keep.data = !diss,\
  \ trace.lev = 0)\n```\n\n要应用 `diana` 函数，输入数据应为矩阵或数据框类型。`diana` 函数既接受距离矩阵也接受数据框作为输入。有一个逻辑标志参数用于控制函数的输入结构。`metric`\
  \ 参数是一个字符串，指定用于计算距离的度量方式；它有两个选项：`\"euclidean\"` 和 `\"manhattan\"`。欧氏距离是差值平方和的平方根，曼哈顿距离是绝对差值之和，其数学公式已在本章前面解释过。如果输入数据集\
  \ `x` 已经是一个不相似度矩阵，那么 `diss` 参数将在执行时被忽略。参数 `stand` 如果取值为 `TRUE`，则表示使用原始数据集，并且需要进一步创建距离矩阵。\n\
  \n`diana` 函数顾名思义，构建簇的层次结构，从一个包含所有观测值的大簇开始。不断划分簇，直到每个簇只包含一个观测值。在每一层，选择具有最大直径的簇，该直径基于距离函数测得的从簇中心到最外层数据点的距离：\n\
  \n```r\ndfit<-diana(r_df,diss=F,metric = \"euclidean\",stand=T,keep.data = F)\n\
  summary(dfit)\nplot(dfit)\n```\n\n## 使用*电子商务*数据进行聚类\n\n对分裂聚类执行 `plot` 命令会提供两种图形选项：一个指示分裂系数的横幅图，以及一个显示树状结构的树状图：\n\
  \n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_187_0.png)\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_187_1.png)\n\
  \n对于层次聚类算法，一个额外的步骤是将树状图结构切割成有限的簇组，以便比较不同聚类方法的结果。以下函数用于切割树状结构：\n\n```r\n> #cutting\
  \ the tree into groups\n> g_hfit<-cutree(hfit,k=4)\n> plot(hfit)\n> table(g_hfit)\n\
  g_hfit\n1 2 3 4\n77 163 119 81\n> rect.hclust(hfit,k=4,border = \"blue\")\n```\n\
  \n该图展示了树状结构：\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_188_0.png)\n\n## 基于模型的聚类\n\
  \nR 中有一个名为 `mclust` 的库，它提供通过 EM 算法拟合的高斯有限混合模型，用于基于模型的聚类，包括贝叶斯正则化。在本节中，我们讨论 `Mclust`\
  \ 的语法和输出结果，其余结果可以使用剖析信息进行分析。基于模型的方法应用一组数据模型、最大似然估计方法和贝叶斯准则来识别簇，`Mclust` 函数通过期望最大化算法估计参数。\n\
  \n`Mclust` 包基于三个参数提供各种数据模型：*E*、*V* 和 *I*。模型标识符使用这三个字母 *E*、*V* 和 *I* 来编码簇的几何特征，如体积、形状和方向。*E*\
  \ 表示相等，*I* 在指定形状时表示单位矩阵，*V* 表示变化的方差。记住这三个字母，有一组模型默认使用 `mclust` 库运行，这些模型可以分为三类：球形、对角和椭球形。详细信息如下表所示：\n\
  \n| 模型代码 | 描述 |\n| --- | --- |\n| EII | 球形，等体积 |\n| VII | 球形，不等体积 |\n| EEI | 对角，等体积和等形状\
  \ |\n| VEI | 对角，变体积，等形状 |\n| EVI | 对角，等体积，变形状 |\n| VVI | 对角，变体积和形状 |\n| EEE | 椭球形，等体积、形状和方向\
  \ |\n| EEV | 椭球形，等体积和等形状 |\n| VEV | 椭球形，等形状 |\n| VVV | 椭球形，变体积、形状和方向 |\n\n表 2：使用有限混合方法的模型描述\n\
  \n现在让我们使用 `Mclust` 方法，基于 *E*、*V* 和 *I* 参数对观测值进行聚类和分组：\n\n```r\n> clus <- Mclust(x_df[,\
  \ -c(1,2)])\n> summary(clus)\n------------------------------------------------------------\n\
  Gaussian finite mixture model fitted by EM algorithm\n------------------------------------------------------------\n\
  Mclust VEI (diagonal, equal shape) model with 9 components:\nlog.likelihood n df\
  \ BIC ICL\n-23843.48 440 76 -48149.56 -48223.43\nClustering table:\n1 2 3 4 5 6\
  \ 7 8 9\n165 21 40 44 15 49 27 41 38\n```\n\n从上述汇总结果可以看出，使用 VEI 模型规范创建了九个簇，并且该模型的\
  \ BIC 最低。我们也可以绘制所有其他模型规范：\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_190_0.png)\n\
  \n从上述图形可以清楚地看出，VEI 模型规范是最佳的。使用以下代码，我们可以打印簇成员关系以及每个簇中的行数：\n\n```r\n# The clustering\
  \ vector:\nclus_vec <- clus$classification\nclus_vec\nclust <- lapply(1:3, function(nc)\
  \ row.names(r_df)[clus_vec==nc])\nclust # printing the clusters\n```\n\n使用带有 `parameters\
  \ = TRUE` 的 `summary` 命令，我们可以计算每个变量的均值、方差和概率：\n\n```r\nsummary(clus, parameters\
  \ = T)\n```\n\n## 其他聚类算法\n\n**自组织映射（SOM）** 是另一种聚类方法；它使用可视化方法来表示数据。SOM 基本上用于衍生出唯一的节点。SOM\
  \ 创建一种网络结构，其中数据对象通过节点和边连接。利用这些节点，可以得出不同对象之间的相似性，从而创建聚类解决方案。`kohonen` 库包含 `som` 函数：\n\
  \n```r\n> library(kohonen)\n> som_grid <- somgrid(xdim = 20, ydim=20, topo=\"hexagonal\"\
  )\n> som_model <- som(r_df_scaled,\n+ grid=som_grid,\n+ rlen=100,\n+ alpha=c(0.05,0.01),\n\
  + keep.data = TRUE,\n+ n.hood=\"circular\")\n> plot(som_model, type=\"changes\"\
  ,col=\"blue\")\n```\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_191_0.png)\n\n上述图形说明了平均到最近单元的距离如何随着迭代级别的增加而变化：\n\
  \n```r\n> plot(som_model, type=\"count\")\n```\n\n\n\n\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_192_0.png)\n\
  \n上图展示了使用SOM方法的计数图。下图展示了邻居距离图。地图由不同变量着色，带颜色的圆圈表示这些输入变量在n维空间中的位置。当绘图类型为计数时，显示映射到各个单元的对象数量。灰色单元表示空单元。当类型为距离邻居时，显示到所有直接邻居的距离之和。如下图所示：\n\
  \n```r\n> plot(som_model, type=\"dist.neighbours\")\n```\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_192_1.png)\n\
  \n```r\n> plot(som_model, type=\"codes\")\n```\n\n最后，下一张图展示了使用所有变量的码本图：\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_193_0.png)\n\
  \n在R中，kohonen库用于通过层次聚类创建自组织映射。当图形类型为codes（如前面的图所示）时，它显示码本向量；每种颜色表示输入数据集的一个特征。前面的结果和图形展示了如何创建聚类解决方案，以及如何使用SOM绘图函数可视化聚类。SOM是一种数据可视化过程，用于基于输入数据向量显示数据集中的相似对象。因此，从结果中得出的结论是如何通过目视检查创建聚类或细分。\n\
  \n## 比较聚类方法\n\n以下是各种聚类方法的一些优点和缺点：\n\n### 对于K-means聚类：\n\nK-means聚类的优点和缺点：\n\n| 优点\
  \ | 缺点 |\n|---|---|\n| 简单易理解，易于解释 | 不是基于稳健的方法论。主要问题在于初始随机点 |\n| 与其他聚类算法相比更灵活 | 不同的随机点会显示不同的结果。因此，需要更多迭代。\
  \ |\n| 在大量输入特征上表现良好 | 由于需要更多迭代，从计算效率角度来看，对于大型数据集可能效率不高。处理时需要更多内存。 |\n\n### 对于SOM：\n\
  \nSOM的优点和缺点：\n\n| 优点 | 缺点 |\n|---|---|\n| 视觉上易于理解 | 仅适用于连续数据 |\n| 新数据点可以通过视觉预测 |\
  \ 当维度增加时难以表示 |\n\n### 参考文献\n\nLichman, M. (2013). UCI机器学习库 (http://archive.ics.uci.edu/ml).\
  \ 加州尔湾：加利福尼亚大学信息与计算机科学学院。\n\n### 总结\n\n在本章中，我们讨论了无监督数据挖掘问题的各种细分方法及其实现。聚类是一种主观的细分方法，需要进一步研究，例如按聚类进行特征分析，并计算不同变量的均值和中位数等不同度量。如果某个聚类与另一个聚类表现出接近性，并且从业务角度来看有意义，那么可以将它们合并。我们讨论了在何种情况下使用哪种模型，以及每种模型的数据要求。在本章中，我们特别强调了数据可视化在表示聚类解决方案时的重要性。\n"
- "# 7 构建零售推荐引擎\n\n在这个互联网时代，互联网上的一切并非对每个人都有用。不同的公司和实体使用不同的方法来为受众找到相关内容。人们开始构建算法来构造相关性分数，基于该分数可以生成推荐并推荐给用户。在我的日常生活中，每次我在Google上看到一张图片，Google会向我推荐另外3-4张图片；每次我在YouTube上寻找视频，会给我推荐另外10个视频；每次我访问Amazon购买产品，会给我推荐5-6个产品；每次我阅读一篇博客或文章，会给我推荐更多文章和博客。这证明了算法力量在起作用，基于用户的偏好或选择来推荐某些内容，因为用户的时间宝贵，而互联网上的内容是无限的。因此，推荐引擎帮助组织根据用户偏好定制产品，这样用户就不必花时间去探索需要什么。\n\
  \n在本章中，读者将学习以下内容及其使用R编程语言的实现：\n\n- 什么是推荐，它是如何工作的\n- 执行推荐的类型和方法\n- 使用R实现产品推荐\n\n\
  ### 什么是推荐？\n\n推荐是一种方法或技术，通过它算法检测用户正在看什么。推荐可以是产品、服务、食品、视频、音频、图片、新闻文章等。如果我们环顾四周，注意我们日复一日在互联网上观察到的东西，推荐的含义就会变得更加清晰。例如，考虑新闻聚合网站如何向用户推荐文章。它们查看文章的标签、文章发布到互联网的时间、该文章的评论数、点赞数和分享数，当然还有地理位置等细节，然后对元数据信息建模，得出一个分数。基于该分数，它们开始向新用户推荐文章。当我们在YouTube上观看视频时也会发生同样的事情。同样，啤酒推荐系统也是这样工作的；用户必须随机选择一种啤酒，基于选择的第一种产品，算法根据相似用户的历史购买信息推荐其他啤酒。当我们从在线电子商务门户购买产品时，也会发生同样的事情。\n\
  \n### 产品推荐的类型\n\n从广义上讲，存在四种不同类型的推荐系统：\n\n- 基于内容的推荐方法\n- 基于协同过滤的推荐方法\n- 基于人口统计细分的推荐方法\n\
  - 基于关联规则的推荐方法\n\n在基于内容的方法中，术语、概念（也称为关键词）定义了相关性。如果用户当前阅读的任何页面中的匹配关键词在互联网上可用的任何其他内容中被找到，那么就开始计算词频并分配一个分数，基于该分数，将最接近的内容呈现给用户。基本上，在基于内容的方法中，文本被用于找到两个文档之间的匹配，从而生成推荐。\n\
  \n在协同过滤中，有两种变体：基于用户的协同过滤和基于物品的协同过滤。\n\n在基于用户的协同过滤方法中，算法计算用户与用户之间的相似度，然后根据他们的偏好生成推荐。在基于物品的协同过滤中，考虑物品与物品之间的相似度来生成推荐。\n\
  \n在基于人口统计细分的类别中，会考虑用户的年龄、性别、婚姻状况和位置，以及他们的收入、工作或任何其他可用特征，以创建客户细分。一旦创建了细分，就会在细分层面识别最受欢迎的产品，并推荐给属于相应细分的新用户。\n\
  \n### 执行推荐的技术\n\n过滤掉网上可用的丰富信息，并第一时间向用户推荐有用信息，是创建推荐引擎的主要动机。那么协同过滤是如何工作的？协同过滤算法基于与当前用户最相似的一组用户来生成推荐。每次请求推荐时，算法需要根据用户共同评分的物品，计算当前用户与所有其他用户之间的相似度，从而选择行为相似的用户。随后，算法将那些被与其最相似的用户给予高评分的物品推荐给当前用户。\n\
  \n为了计算用户之间的相似度，已经提出了各种相似度度量，如皮尔逊相关系数、余弦向量相似度、斯皮尔曼相关系数、基于熵的不确定性度量和均方差。让我们看看计算和R实现背后的数学公式。\n\
  \n协同过滤算法的目标是根据用户以前的喜好和其他志同道合用户的意见，向特定用户推荐新物品或预测某个物品的效用。\n\n基于内存的算法利用整个用户-物品数据库来生成预测。这些系统采用统计技术来找到一组与目标用户有相似历史偏好的用户，称为邻居（即他们对相同物品的评分相似，或者他们倾向于购买相似的物品集）。一旦形成了用户邻域，这些系统使用不同的算法来组合邻居的偏好，为当前用户产生预测或Top-N推荐。这些技术也称为最近邻或基于用户的协同过滤，在实践中非常流行且被广泛使用。\n\
  \n基于模型的协同过滤算法首先开发用户评分模型，然后提供物品推荐。这类算法采用概率方法，将协同过滤过程视为在给定用户对其他物品的评分的情况下，计算用户预测的期望值。模型构建过程由不同的机器学习算法执行，如贝叶斯网络、聚类和基于规则的方法。\n\
  \n\n\n\n\n基于物品的协同过滤算法中的一个关键步骤是计算物品之间的相似度，然后选择最相似的物品。两个物品 $i$ 和 $j$ 之间相似度计算的基本思想是，首先分离出对这两个物品都进行了评分的用户，然后应用相似度计算技术来确定相似度\
  \ $S(i,j)$。\n\n计算物品之间相似度的方法有很多种。这里我们介绍三种这样的方法。这些是基于余弦的相似度、基于相关的相似度和调整余弦相似度：\n\n\
  - **基于余弦的相似度：** 两个物品被视为 $m$ 维用户空间中的两个向量。它们之间的相似度是通过计算这两个向量之间角度的余弦来衡量的：\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_198_0.png)\n\
  \n以下是计算两个向量之间余弦相似度的公式。让我们通过一个数值示例来计算余弦相似度：\n\nCos (d1, d2) = 0.44\n\n| d1 | d2 |\
  \ d1*d2 | ||d1|| | ||d2|| | ||d1||*||d2|| |\n|---|---:|---:|---:|---:|---:|\n| 6\
  \ | 1 | 6 | 36 | 1 | 36 |\n| 4 | 0 | 0 | 16 | 0 | 0 |\n| 5 | 3 | 15 | 25 | 9 | 225\
  \ |\n| 1 | 2 | 2 | 1 | 4 | 4 |\n| 0 | 5 | 0 | 0 | 25 | 0 |\n| 2 | 0 | 0 | 4 | 0\
  \ | 0 |\n| 4 | 6 | 24 | 16 | 36 | 576 |\n| 0 | 5 | 0 | 0 | 25 | 0 |\n| 3 | 0 | 0\
  \ | 9 | 0 | 0 |\n| 6 | 1 | 6 | 36 | 1 | 36 |\n\n如果为一组物品或产品明确给出了评分或评论，则有意义应用基于用户的协同过滤。如果某些物品的某些评分缺失，数据仍可以被插补，一旦缺失评分被预测，用户相似度就可以被计算，从而生成推荐。对于基于用户的协同过滤，数据将如下所示：\n\
  \n| User | Item1 | Item2 | Item3 | Item4 | Item5 | Item6 |\n|------|------:|------:|------:|------:|------:|------:|\n\
  | user1 | -7.82 | 8.79 | -9.66 | -8.16 | -7.52 | -8.5 |\n| user2 | 4.08 | -0.29\
  \ | 6.36 | 4.37 | -2.38 | -9.66 |\n| user3 |  |  |  |  | 9.03 | 9.27 |\n| user4\
  \ |  | 8.35 |  |  | 1.8 | 8.16 |\n| user5 | 8.5 | 4.61 | -4.17 | -5.39 | 1.36 |\
  \ 1.6 |\n| user6 | -6.17 | -3.54 | 0.44 | -8.5 | -7.09 | -4.32 |\n| user7 |  | \
  \ |  |  | 8.59 | -9.85 |\n| user8 | 6.84 | 3.16 | 9.17 | -6.21 | -8.16 | -1.7 |\n\
  | user9 | -3.79 | -3.54 | -9.42 | -6.89 | -8.74 | -0.29 |\n| user10 | 3.01 | 5.15\
  \ | 5.15 | 3.01 | 6.41 | 5.15 |\n\n表 1：基于用户的物品样本数据集\n\n如果二进制矩阵作为输入给出，其中级别表示产品是否被购买，则建议应用基于物品的协同过滤。样本数据集如下所示：\n\
