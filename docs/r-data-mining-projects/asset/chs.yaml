- "# 1 使用内置 R 数据进行数据操作\n\n本书 *R Data Mining Blueprints* 主要侧重于使用 R 编程语言作为平台执行数据挖掘的学习方法和步骤。由于\
  \ R 是一个开源工具，使用 R 学习数据挖掘对各个层次的学习者来说都非常有趣。本书的设计使得用户可以涵盖从数据管理技术、探索性数据分析、数据可视化和建模，一直到构建高级预测模型（如推荐引擎、神经网络模型等）的过程。本章概述了数据挖掘的概念，及其与数据科学、分析、统计建模和可视化之间的各种联系。本章通过一个真实案例研究，简要介绍了使用\
  \ R 的编程基础知识、如何读写数据、编程符号和语法理解。本章包含用于练习的 R 脚本，以便读者获得对概念、术语以及执行某些任务背后原因的实践经验。本章的设计使得即使只有少量编程知识的读者也能够执行\
  \ R 命令来完成各种数据挖掘任务。\n\n在本章中，我们将简要讨论数据挖掘的含义及其与数据科学、分析学和统计建模等其他领域的关系；除此之外，我们将使用 R 开始学习数据管理主题，以便您实现以下目标：\n\
  \n- 了解 R 中使用的各种数据类型，包括向量及其运算\n- 数据框和因子序列的索引\n- 对数据框进行排序和合并以及数据类型转换\n- 字符串处理和日期对象格式化\n\
  - 处理缺失值和 NA，以及缺失值插补技术\n- 流程控制、循环结构以及 apply 函数的使用\n\n### 什么是数据挖掘？\n\n数据挖掘可以定义为从现有数据库中解读有意义的见解，并分析结果以供业务用户使用的过程。分析来自不同来源的数据，并将其总结为有意义的信息和见解，是统计知识发现的一部分，这不仅有助于业务用户，也有助于统计分析师、顾问和数据科学家等多个群体。大多数时候，从数据库中发现知识的过程是不可预见的，结果可以以多种方式解释。\n\
  \n越来越多的设备、平板电脑、智能手机、计算机、传感器以及其他各种数字设备，使得数据的生成和收集速度比以往任何时候都快。借助现代计算机的能力，增加的数据可以被预处理和建模，以回答与任何业务决策过程相关的各种问题。数据挖掘也可以定义为一种知识密集型搜索，它使用统计方法、机器学习技术、可视化和模式识别技术，在离散的数据库和信息库中进行搜索。\n\
  \n结构化数据和非结构化数据的增长，例如零售店中所有产品上的条形码、制造工厂所有资产上附着基于 RFID 的标签、Twitter 推送、Facebook 帖子、遍布整个城市的用于监测不断变化的天气状况的集成传感器、视频分析、基于观看统计的视频推荐等，为各种工具、技术和方法论的发展创造了有利的生态系统。将数据挖掘技术应用于前面讨论的各种数据，不仅提供了关于数据结构的有效信息，还推荐了企业在未来可能采取的行动。\n\
  \n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_19_0.png)\n\n图 1：数据挖掘——一门多学科交叉学科\n\n\
  数据挖掘的过程涉及以下几个步骤：\n\n1. 从数据库和数据仓库中提取所需数据。\n2. 对数据执行合理性检查，以删除冗余字符和不相关信息。\n3. 有时，结合来自其他各种互不相交的数据库的信息非常重要。因此，寻找共同属性来合并数据库。\n\
  4. 应用数据转换技术。有时，需要在模型中包含一些属性和特征。\n5. 输入特征之间的模式识别，可以应用任何模式识别方法。\n6. 知识表示。这包括将从数据库中挖掘的知识以可视化形式呈现给各业务利益相关者。\n\
  \n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_20_0.png)\n\n图 2：典型的数据挖掘流程\n\n在讨论了数据挖掘的流程和核心组件之后，还需要关注人们在数据挖掘中可能遇到的一些挑战，例如计算效率、非结构化数据库及其与结构化数据库的融合、高维数据可视化等。这些问题可以通过创新方法来解决。在本书中，我们将在项目实践中探讨一些解决方案。\n\
  \n\n\n\n\n## 它与数据科学、分析和统计建模有何关系？\n\n数据科学是一个更广泛的主题，数据挖掘概念就包含在其中。按照上述数据挖掘的定义，它是一个识别数据中隐藏模式以及一些有趣相关性的过程，这些相关性可以提供有用的见解。数据挖掘是数据科学项目中的一个子集，涉及模式识别、特征选择、聚类、监督分类等技术。分析和统计建模涉及广泛的预测模型——基于分类的模型，用于应用于数据集以解决现实世界的业务问题。这三个术语——数据科学、分析、统计建模和数据挖掘——之间存在明显的重叠。这三个术语不应孤立地看待。根据项目需求和业务问题的类型，重叠的位置可能会发生变化，但从广义上讲，所有概念都是紧密关联的。数据挖掘过程还包括基于统计和机器学习的方法来提取数据、自动化规则，并使用良好的可视化来呈现数据。\n\
  \n## R 编程语言简介\n\n在本章中，我们将从使用 R 进行数据管理和数据操作的基础编程开始；我们还将介绍一些编程技巧。R 可以从 https://cran.r-project.org/\
  \ 下载。根据操作系统的不同，任何人都可以在其系统上下载并安装 R 二进制文件。R 编程语言是 S 语言的扩展，是一个统计计算平台。它提供了高级预测建模能力、机器学习算法实现能力以及更好的图形可视化。R\
  \ 还有各种其他插件，如 R.Net、rJava、SparkR 和 RHadoop，这些插件增强了 R 在大数据场景中的可用性。用户可以将 R 脚本与其他编程平台集成。有关\
  \ R 的详细信息可以通过以下链接访问：\n\n```\nhttps://cran.r-project.org/.\n```\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_22_0.png)\n\
  \n## R 入门\n\n启动 R 时的打开消息将如前面的截图所示。在 R 控制台中输入的所有内容都是一个对象，在活动的 R 会话中创建的许多对象具有不同的关联属性，与对象关联的一个常见属性称为其类。R\
  \ 中有两种流行的面向对象编程方法，即 S3 类和 S4 类。S3 和 S4 方法之间的基本区别在于，前者是一种更灵活的方法；然而，后者是一种更结构化的面向对象编程方法。S3\
  \ 和 S4 方法都将任何符号、字符和数字识别为 R 会话中的对象，并提供对象可用于进一步计算的功能。\n\n## 数据类型、向量、数组和矩阵\n\n有两大数据类型集合：原子向量和复合向量。R\
  \ 编程中的原子向量类别下基本上有五种数据类型：数值或数字、字符或字符串、因子、逻辑和复数。还有四种复合数据类型：数据框、列表、数组和矩阵。R 中的主要数据对象是向量；即使我们将一个单位数字分配给任何字母，它在\
  \ R 中也是一个单元素向量。所有数据对象都包含一个模式（mode）和一个长度（length）。模式决定了存储在对象中的数据种类，长度决定了该对象包含的元素数量。R\
  \ 中的 `c()` 函数表示将向量中的各个元素连接起来。\n\n```\n2 13 FALSE      DataMining\n3 24 TRUE  MachineLearning\n\
  4 54 FALSE        Projects\n5 29 TRUE        Statistics\n```\n\n数据框是 R 编程语言中另一种流行的数据类型形式，它包含所有不同的数据类型。数据框是一个列表，包含多个长度相同但数据类型不同的向量。如果你只是从电子表格中导入数据集，默认的数据类型就是数据框。之后，可以更改各个变量的数据类型。因此，数据框可以定义为包含不同数据类型列的矩阵。在前面的脚本中，数据框\
  \ x 包含三种不同的数据类型：数值、逻辑和字符。大多数现实世界的数据集包含不同的数据类型；例如，在零售店中，客户信息存储在数据库中。这包括客户 ID、购买日期、购买金额、是否属于任何忠诚度计划等等。\n\
  \n关于向量有一点很重要：向量的所有元素应该是相同类型的。如果不是，R 将通过强制转换来强制转换。例如，在一个数值向量中，如果一个元素包含一个字符值，向量类型将从数值变为字符。脚本如下：\n\
  \n```\n> x1<-c(2.5,1.4,6.3,4.6,9.0)\n> class(x1)\n[1] \"numeric\"\n> x1<-c(2.5,1.4,6.3,4.6,9.0,\"\
  cat\")\n> class(x1)\n[1] \"character\"\n```\n\nR 区分大小写，因此“cat”与“Cat”不同。因此，在给向量分配对象名称时请务必小心。有时，记住对象名称会很困难：\n\
  \n```\n> ls()\n  [1] \"a\"         \"centers\"   \"df\"        \"distances\"\n \
  \ [5] \"dt2\"       \"i\"         \"indexes\"   \"km\"\n  [9] \"kmd\"       \"kmeans.results\"\
  \ \"log_model\" \"mtcars\"\n [13] \"outliers\"  \"pred\"      \"predict.kmeans\"\
  \ \"probs\"\n [17] \"Smarket\"   \"start\"     \"sumsq\"     \"t\"\n [21] \"test\"\
  \      \"Titanic\"   \"train\"     \"x\"\n [25] \"x1\"        \"x2\"        \"x3\"\
  \        \"x4\"\n [29] \"x5\"        \"y\"         \"z\"\n```\n\n```\n```text\n\
  > mylist\n      mylist1             mylist2\ncustid  112233              443322\n\
  custname \"John R\"           \"Frank S\"\nmobile  \"989-101-1011\"     \"781-101-6211\"\
  \nemail   \"JohnR@gmail.com\"   \"SFranks@hotmail.com\"\n```\n```\n\n因子可以定义为分类或名义变量中以一定频率出现的各个水平。换句话说，分类变量中重复出现的水平称为因子。在以下示例脚本中，字符向量“domains”包含许多水平；使用\
  \ `factor` 命令，可以估计每个水平的频率。\n\n序列是重复的迭代次数，可以是数值，也可以是分类或名义值，它们可以是数据集的一部分。可以使用冒号运算符创建数值序列。要使用因子变量生成序列，可以使用\
  \ `gl()` 函数。在计算分位数和图形函数时，这是一个非常有用的函数。此外，还有其他各种可能的情况可以使用该函数：\n\n```\n```r\n> seq(from=1,to=5,length=4)\n\
  [1] 1.000000 2.333333 3.666667 5.000000\n> seq(length=10,from=-2,by=.2)\n[1] -2.0\
  \ -1.8 -1.6 -1.4 -1.2 -1.0 -0.8 -0.6 -0.4 -0.2\n> rep(15,10)\n[1] 15 15 15 15 15\
  \ 15 15 15 15 15\n> gl(2,5,labels=c('Buy','DontBuy'))\n[1] Buy Buy Buy Buy Buy DontBuy\
  \ DontBuy DontBuy\nDontBuy\n[10] DontBuy\nLevels: Buy DontBuy\n```\n```\n\n第一行代码按升序生成序列，第二行创建反向序列，最后一行创建因子数据类型的序列。\n\
