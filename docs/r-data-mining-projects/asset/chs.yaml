  图 2：价格与高速公路里程之间的关系\n\n数值-分类关系和两个分类变量之间的关系将在第 3 章 *可视化钻石数据集* 中详细说明。\n\n## 多变量分析\n\
  \n多变量关系是考察多个因变量和自变量及其关系的一种统计方法。在本章中，我们将简要讨论超过两个变量之间的多变量关系，但将在后续章节中详细讨论多变量分析。可以通过相关性方法以及交叉列表来了解各变量之间的多变量关系：\n\
  \n```\n> pairs(n_cars93,main=\"Correlation Plot\", col=\"blue\")\n```\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_53_0.png)\n\
  \n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_55_0.png)\n\n从前面的图像中，我们可以得出结论：价格变量呈正偏态，因为分布右侧存在一些异常值。价格变量的均值因极端波动而被夸大，且大于众数。\n\
  \n现在让我们尝试理解一个可以使用正态分布来回答某个假设的例子。\n\n假设高速公路上的每加仑英里数变量服从均值为 29.08、标准差为 5.33 的正态分布。那么一辆新车提供\
  \ 35 英里/加仑里程的概率是多少？\n\n```\n> pnorm(35,mean(Cars93$MPG.highway),sd(Cars93$MPG.highway),lower.tail\
  \ = F)\n[1] 0.1336708\n```\n\n因此，一辆新车提供 35 英里/加仑里程所需的概率为 13.36%，由于期望均值高于实际均值，lower.tail\
  \ 相当于 FALSE。\n\n## 二项概率分布\n\n二项分布被称为离散概率分布。它描述一次实验的结果。每次试验被认为只有两种结果：成功或失败，是或否。例如，在\
  \ Cars93 数据集的变量中，手动变速箱是否可用用“是”或“否”表示。\n\n让我们举一个例子来说明二项分布的用途。在特定部件无法正常工作的情况下，汽车有缺陷的概率是\
  \ 0.1%。你制造了 93 辆汽车。在当前这批 93 辆汽车中至少检测出 1 辆缺陷车的概率是多少：\n\n```\n> pbinom(1,93,prob =\
  \ 0.1)\n[1] 0.0006293772\n```\n\n因此，在 93 辆汽车的一批中识别出一辆缺陷汽车的概率为 0.0006，考虑到缺陷部件的概率为\
  \ 0.10，这个概率非常小。\n\n## 泊松概率分布\n\n泊松分布适用于计数数据，在给定数据以及事件相关信息的情况下，你可以使用泊松概率分布预测该范围内任意数字出现的概率。\n\
  \n让我们举个例子。假设平均每分钟有 200 位顾客访问某个电子商务网站门户。那么求一分钟后有 250 位顾客访问同一网站的概率：\n\n```\n> ppois(250,200,lower.tail\
  \ = F)\n[1] 0.0002846214\n```\n\n因此，所需概率为 0.0002，这非常罕见。除了前面提到的经常使用的常见概率分布之外，还有许多其他分布可以在罕见情况下使用。\n\
  \n```\nmean sd\n0.5498938 0.3888336\n> x$vcov\nmean sd\nmean 0.3023831 0.0000000\n\
  sd 0.0000000 0.1511916\n> x$loglik\n[1] -287.1104\n> x$n\n[1] 93\n```\n\n现在我们将了解如何以图形方式表示变量的正态性：\n\
  \n```\n> qqnorm(Cars93$MPG.highway)\n> qqline(Cars93$MPG.highway)\n```\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_58_0.png)\n\
  \n以圆圈表示的数据点偏离了直线 t。\n\n解释离散数据：其中所有类别如下：\n\n```\n> table(Cars93$Type)\nCompact Large\
  \ Midsize Small Sporty Van\n16 11 22 21 14 9\n```\n\n```\nMidsize 5 6 1\nSmall 0\
  \ 3 11\nSporty 1 3 2\nVan 0 1 3\n```\n\n用于检验所有因子独立性的 summary 命令可用于检验原假设：\n\n```\n\
  > summary(contTable)\nNumber of cases in table: 93\nNumber of factors: 3\nTest for\
  \ independence of all factors:\nChisq = 65, df = 27, p-value = 5e-05\nChi-squared\
  \ approximation may be incorrect\n```\n\n除了前面讨论的图形方法之外，还有一些数值统计检验可用于判断变量是否服从正态分布。有一个名为\
  \ norm.test 的库用于执行数据正态性检验，下面列出了该库中一些有助于评估数据正态性的函数：\n\n| ajb.norm.test | 调整后的 Jarque-Bera\
  \ 正态性检验 |\n| frosini.norm.test | Frosini 正态性检验 |\n| geary.norm.test | Geary 正态性检验\
  \ |\n| hegazy1.norm.test | Hegazy-Green 正态性检验 |\n| hegazy2.norm.test | Hegazy-Green\
  \ 正态性检验 |\n| jb.norm.test | Jarque-Bera 正态性检验 |\n| kurtosis.norm.test | 峰度正态性检验\
  \ |\n| skewness.norm.test | 偏度正态性检验 |\n| spiegelhalter.norm.test | Spiegelhalter\
  \ 正态性检验 |\n| wb.norm.test | Weisberg-Bingham 正态性检验 |\n\n| ad.test | Anderson-Darling\
  \ 正态性检验 |\n| cvm.test | Cramér-von Mises 正态性检验 |\n| lillie.test | Lilliefors（Kolmogorov-Smirnov）正态性检验\
  \ |\n| pearson.test | Pearson 卡方正态性检验 |\n| sf.test | Shapiro-Francia 正态性检验 |\n\n\
  \n\n\n\n让我们对`Cars93`数据集中的`Price`变量进行正态性检验：\n\n```\n> library(nortest)\n> ad.test(Cars93$Price)\
  \ # 安德森-达林检验\nAnderson-Darling normality test\ndata: Cars93$Price\nA = 3, p-value\
  \ = 9e-07\n> cvm.test(Cars93$Price) # 克拉默-冯·米塞斯检验\nCramer-von Mises normality test\n\
  data: Cars93$Price\nW = 0.5, p-value = 6e-06\n> lillie.test(Cars93$Price) # 利利福斯（KS）检验\n\
  Lilliefors (Kolmogorov-Smirnov) normality test\ndata: Cars93$Price\nD = 0.2, p-value\
  \ = 1e-05\n> pearson.test(Cars93$Price) # 皮尔逊卡方检验\nPearson chi-square normality\
  \ test\ndata: Cars93$Price\nP = 30, p-value = 3e-04\n> sf.test(Cars93$Price) # 夏皮罗-弗朗西亚检验\n\
  Shapiro-Francia normality test\ndata: Cars93$Price\n```\n\n从上述检验可以看出，`Price`变量不服从正态分布，因为所有统计检验的p值均小于0.05。如果我们在双变量关系中增加更多维度，就变成了多元分析。让我们尝试理解`Cars93`数据集中汽车马力与长度之间的关系：\n\
  \n```\n> library(corrplot)\n> o<-cor(Cars93[,c(\"Horsepower\",\"Length\")])\n> corrplot(o,method\
  \ = \"circle\",main=\"相关性图\")\n```\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_65_0.png)\n\
  \n当我们纳入更多变量时，就变成了多元关系。让我们尝试绘制`Cars93`数据集中多个变量之间的多元关系图。\n\n```\n```r\n> library(corrplot)\n\
  > t<-\n  cor(Cars93[,c(\"Price\",\"MPG.city\",\"RPM\",\"Rev.per.mile\",\"Width\"\
  ,\"Weight\",\"Horsepower\",\"Length\")])\n> corrplot(t,method = \"ellipse\")\n```\n\
  ```\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_65_1.png)\n\n有多种方法可以作为参数传递给相关性图，分别是\"\
  circle\"（圆形）、\"square\"（方形）、\"ellipse\"（椭圆）、\"number\"（数字）、\"shade\"（阴影）、\"color\"\
  （颜色）和\"pie\"（饼图）。\n\n## 假设检验\n\n零假设表明什么都没发生，均值保持不变等等。而备择假设则表明发生了某些不同的事情，总体的均值存在差异。执行假设检验需要以下几个步骤：\n\
  \n- 1. **提出零假设**：对总体做出一个假设陈述；例如，城市内汽车的平均油耗为40。\n- 2. **提出备择假设**：如果零假设被证明是错误的，那么还存在什么其他可能性？例如，如果城市内油耗不是40，那么是大于40还是小于40？如果它不等于40，则属于非方向性备择假设。\n\
  - 3. **计算样本检验统计量**：检验统计量可以是t检验、f检验、z检验等等。根据数据可得性和先前声明的假设选择合适的检验统计量。\n- 4. **确定置信区间**：根据特定业务问题所需的精确程度，有三个不同的置信水平：90%、95%和99%。由研究人员/分析师自行决定选择哪个置信区间水平。\n\
  - 5. **定义阿尔法值**：如果选择的置信水平是95%，则阿尔法值为5%。因此，确定阿尔法值有助于计算检验的p值。\n- 6. **决策**：如果所选的p值小于阿尔法水平，则有证据表明可以拒绝零假设；如果不是，则我们接受零假设。\n\
  \n## 总体均值检验\n\n运用假设检验流程，让我们以`Cars93`数据集为例来检验总体均值。\n\n## 已知方差下均值的单尾检验\n\n假设研究人员声称样本中收集的所有汽车的平均油耗超过35。在93辆汽车的样本中，观察到所有汽车的平均油耗为29。你应该接受还是拒绝研究人员的说法？\n\
  \n这就是我们在已知方差的情况下，对样本数据进行的总体均值单尾和双尾检验分析方式。\n\n## 比例的单尾和双尾检验\n\n使用`Cars93`数据集，假设美国制造的汽车中有40%的RPM超过5000。从样本数据中，我们发现57辆汽车中有17辆的RPM高于5000。你从这个情境中能得出什么解读？\n\
  \n```\n> mileage<-subset(Cars93,Cars93$RPM > 5000)\n> table(mileage$Origin)\n美国\
  \ 非美国\n17 40\n> p1<-17/57\n> p0<- 0.4\n> n <- length(mileage)\n> z <- (p1-p0)/sqrt(p0*(1-p0)/n)\n\
  > z\n[1] -1.079\n> #计算5%阿尔法水平下的临界值\n> alpha = .05\n> z1 = qnorm(1-alpha)\n> z1\n\
  [1] 1.645\n> ifelse(z > z1,\"拒绝零假设\",\"接受零假设\")\n[1] \"接受零假设\"\n```\n\n如果备择假设不是方向性的，则属于比例的双尾检验情形；除了临界值的计算方式不同之外，前面的计算没有任何变化。详细的脚本如下：\n\
  \n```\n> mileage<-subset(Cars93,Cars93$RPM > 5000)\n> table(mileage$Origin)\n美国\
  \ 非美国\n17 40\n> p1<-17/57\n> p0<- 0.4\n> n <- length(mileage)\n> z <- (p1-p0)/sqrt(p0*(1-p0)/n)\n\
  > z\n[1] -1.079\n> #计算5%阿尔法水平下的临界值\n> alpha = .05\n> z1 = qnorm(1-alpha/2)\n> c(-z1,z1)\n\
  [1] -1.96 1.96\n```\n\n```\n> ifelse(z > z1 | z < -z1,\"拒绝零假设\",\"接受零假设\")\n[1]\
  \ \"接受零假设\"\n```\n\n- - **连续数据的双样本配对检验：**双样本配对检验中所检验的零假设是，某个处理对受试者没有影响、该治疗方法对受试者没有效果等等。备择假设则是，某个处理、治疗方法或药物对受试者具有统计学上显著的影响。\n\
  \n虽然`Cars93`数据集中没有这样的变量，但我们仍然可以假设不同品牌汽车的最低价格与最高价格之间存在配对关系。\n\n- - **双样本t检验的零假设：**平均价格没有差异。\n\
  - - **备择假设：**平均价格存在差异：\n\n```\n> t.test(Cars93$Min.Price, Cars93$Max.Price, paired\
  \ = T)\n配对t检验\ndata: Cars93$Min.Price and Cars93$Max.Price\nt = -9.6, df = 92, p-value\
  \ = 2e-15\nalternative hypothesis: true difference in means is not equal to 0\n\
  95 percent confidence interval:\n-5.765 -3.781\nsample estimates:\nmean of the differences\n\
  -4.773\n```\n\np值小于0.05。因此，可以得出结论，平均最低价格与平均最高价格之间的差异在95%置信水平下具有统计学显著性。\n\n- - **连续数据的双样本非配对检验：**从`Cars93`数据集来看，高速公路上的油耗与城市内的油耗被假定为不同的。这种差异是否具有统计学显著性，可以通过使用独立样本t检验来比较均值进行检验。\n\
  - - **零假设：**高速公路上的MPG与城市内的MPG没有差异。\n- - **备择假设：**高速公路上的MPG与城市内的MPG存在差异：\n\n```\n\
  韦尔奇双样本t检验\ndata: Cars93$MPG.city and Cars93$MPG.highway\n```\n\n```\nt = -8.4, df\
  \ = 180, p-value = 1e-14\nalternative hypothesis: true difference in means is not\
  \ equal to 0\n95 percent confidence interval:\n-8.305 -5.136\nsample estimates:\n\
  mean of x mean of y\n22.37 29.09\n```\n\n从双样本t检验可以看出，当两个样本独立时，p值小于0.05；因此，我们可以拒绝“高速公路与城市内的平均油耗没有差异”的零假设。城市内与高速公路上的平均油耗之间存在统计学上显著的差异。这可以用稍微不同的方式来表述，比如设定一个零假设：手动挡与自动挡汽车在城市内的平均油耗差异是不同的：\n\
  \n```\n, data=Cars93)\n韦尔奇双样本t检验\ndata: Cars93$MPG.city by Cars93$Man.trans.avail\n\
  t = -6, df = 84, p-value = 4e-08\nalternative hypothesis: true difference in means\
  \ is not equal to 0\n95 percent confidence interval:\n-6.949 -3.504\nsample estimates:\n\
  mean in group No mean in group Yes\n18.94 24.16\n```\n\n因此，上述检验的结论是：自动挡与手动挡车型之间的平均油耗存在统计学上显著的差异；这是因为p值小于0.05。\n\
  \n在应用t检验之前，检查数据的正态性是很重要的；可以使用Shapiro检验函数来评估变量的正态性：\n\n```\n> shapiro.test(Cars93$MPG.city)\n\
  Shapiro-Wilk正态性检验\ndata: Cars93$MPG.city\nW = 0.86, p-value = 6e-08\n)\n> qqline(Cars93$MPG.city)\n\
  ```\n\n\n\n\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_71_0.png)\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_71_1.png)\n\
  \n观察城市内每加仑英里数的QQ图和直方图，可以得出结论：该变量不服从正态分布。由于英里数变量不服从正态分布，需要应用非参数方法，如Wilcoxon符号秩检验或Kolmogorov-Smirnov检验。\n\
  \n```\n> summary(aov(Cars93$RPM~Cars93$Cylinders))\nDf Sum Sq Mean Sq F value Pr(>F)\n\
  Cars93$Cylinders 5 6763791 1352758 4.53 0.001 **\nResiduals 87 25996370 298809\n\
  ---\nSignif. codes: 0 '***' 0.001 '**' 0.01 '*' 0.05 '.' 0.1 ' ' 1\n```\n\n从上述方差分析可以看出，p值小于0.05，因此可以拒绝原假设。这意味着至少有一种气缸类型的平均转速在统计上存在显著差异。为了确定哪一种气缸类型存在差异，可以对方差分析模型的结果进行事后检验：\n\
  \n```\n> TukeyHSD(aov(Cars93$RPM~Cars93$Cylinders))\nTukey multiple comparisons\
  \ of means\n95% family-wise confidence level\nFit: aov(formula = Cars93$RPM ~ Cars93$Cylinders)\n\
  $`Cars93$Cylinders`\ndiff lwr upr p adj\n4-3 -321.8 -1269.23 625.69 0.9201\n5-3\
  \ -416.7 -1870.88 1037.54 0.9601\n6-3 -744.1 -1707.28 219.11 0.2256\n8-3 -895.2\
  \ -1994.52 204.04 0.1772\nrotary-3 733.3 -1106.11 2572.78 0.8535\n5-4 -94.9 -1244.08\
  \ 1054.29 0.9999\n6-4 -422.3 -787.90 -56.74 0.0140\n8-4 -573.5 -1217.14 70.20 0.1091\n\
  rotary-4 1055.1 -554.08 2664.28 0.4027\n6-5 -327.4 -1489.61 834.77 0.9629\n8-5 -478.6\
  \ -1755.82 798.67 0.8834\nrotary-5 1150.0 -801.03 3101.03 0.5240\n8-6 -151.2 -817.77\
  \ 515.47 0.9857\nrotary-6 1477.4 -141.08 3095.92 0.0941\nrotary-8 1628.6 -74.42\
  \ 3331.57 0.0692\n```\n\n当p调整值小于0.05时，该转速均值与其他组的差异在统计上显著。\n\n带事后检验的双因素方差分析：所考虑的因素是产地和安全气囊。需要检验的假设是：这两个分类变量对转速变量是否有影响？\n\
  \n```\n> aov(Cars93$RPM~Cars93$Origin + Cars93$AirBags)\nCall:\naov(formula = Cars93$RPM\
  \ ~ Cars93$Origin + Cars93$AirBags)\nTerms:\nCars93$Origin Cars93$AirBags Residuals\n\
  Sum of Squares 8343880 330799 24085482\n```\n\n```\nDeg. of Freedom 1 2 89\nResidual\
  \ standard error: 520.2\nEstimated effects may be unbalanced\n> summary(aov(Cars93$RPM~Cars93$Origin\
  \ + Cars93$AirBags))\nDf Sum Sq Mean Sq F value Pr(>F)\nCars93$Origin 1 8343880\
  \ 8343880 30.83 2.9e-07 ***\nCars93$AirBags 2 330799 165400 0.61 0.54\nResiduals\
  \ 89 24085482 270623\n---\nSignif. codes: 0 '***' 0.001 '**' 0.01 '*' 0.05 '.' 0.1\
  \ ' ' 1\n> TukeyHSD(aov(Cars93$RPM~Cars93$Origin + Cars93$AirBags))\nTukey multiple\
  \ comparisons of means\n95% family-wise confidence level\nFit: aov(formula = Cars93$RPM\
  \ ~ Cars93$Origin + Cars93$AirBags)\n$`Cars93$Origin`\ndiff lwr upr p adj\nnon-USA-USA\
  \ 599.4 384.9 813.9 0\n$`Cars93$AirBags`\ndiff lwr upr p adj\nDriver only-Driver\
  \ & Passenger -135.74 -498.8 227.4 0.6474\nNone-Driver & Passenger -25.68 -401.6\
  \ 350.2 0.9855\nNone-Driver only 110.06 -174.5 394.6 0.6280\n```\n\n## 非参数方法\n\n\
  当训练数据集因不符合特定概率分布的假设而不服从任何特定概率分布时，分析数据的唯一选择就是使用非参数方法。非参数方法不遵循有关概率分布的任何假设。使用非参数方法，可以在不遵循任何假设的情况下进行推断和假设检验。现在，我们来看一组非参数检验，当数据集不符合任何特定概率分布的假设时，可以使用这些检验。\n\
  \n### Wilcoxon符号秩检验\n\n如果不满足正态性假设，则需要应用非参数方法来回答诸如此类的问题：自动挡和手动挡汽车在城市内的平均油耗里程是否存在差异？\n\
  \n```\n> wilcox.test(Cars93$MPG.city~Cars93$Man.trans.avail, correct = F)\nWilcoxon\
  \ rank sum test\n\ndata: Cars93$MPG.city by Cars93$Man.trans.avail\nW = 380, p-value\
  \ = 1e-06\n```\n\n```\n\nalternative hypothesis: true location shift is not equal\
  \ to 0\n```\n\n如果两个样本恰好是配对样本，且样本不满足正态性假设，可以使用`paired`参数：\n\n```\n> wilcox.test(Cars93$MPG.city,\
  \ Cars93$MPG.highway, paired = T)\nWilcoxon signed rank test with continuity correction\n\
  \ndata: Cars93$MPG.city and Cars93$MPG.highway\nV = 0, p-value <2e-16\nalternative\
  \ hypothesis: true location shift is not equal to 0\n```\n\n### Mann-Whitney-Wilcoxon检验\n\
  \n如果两个样本不匹配、相互独立，且不服从正态分布，则需要使用Mann-Whitney-Wilcoxon检验来检验两个样本的均值差异在统计上是否显著不同：\n\n\
  ```\n> wilcox.test(Cars93$MPG.city~Cars93$Man.trans.avail, data=Cars93)\nWilcoxon\
  \ rank sum test with continuity correction\n\ndata: Cars93$MPG.city by Cars93$Man.trans.avail\n\
  W = 380, p-value = 1e-06\nalternative hypothesis: true location shift is not equal\
  \ to 0\n```\n\n### Kruskal-Wallis检验\n\n要比较两个以上组的均值，也就是方差分析的非参数版本，可以使用Kruskal-Wallis检验。它也被称为无分布假设的统计检验：\n\
  \n```\n> kruskal.test(Cars93$MPG.city~Cars93$Cylinders, data= Cars93)\nKruskal-Wallis\
  \ rank sum test\n\ndata: Cars93$MPG.city by Cars93$Cylinders\nKruskal-Wallis chi-squared\
  \ = 68, df = 5, p-value = 3e-13\n```\n"
- "# 3 可视化钻石数据集\n\n# 可视化钻石数据集\n\n如果没有适当的数据可视化，任何数据挖掘项目都是不完整的。仅看数字和统计数据时，或许也能看出不同切工下这些变量的相似规律，但当我们以可视化方式观察变量与因素之间的关系时，呈现的却完全是另一番景象。因此，数据可视化传达出数字和统计无法传达的信息。从数据挖掘的角度来看，数据可视化有许多优点，可以概括为以下三个要点：\n\
  \n- 数据可视化在数据与数据使用者之间建立了强有力的沟通\n- 它能留下持久的印象，因为人们可能记不住数字，但会记住图表和形状\n- 当数据扩展到更高维度时，用数字表示没有意义，但可视化表示却有意义\n\
  \n在本章中，读者将了解数据可视化的基础知识，以及如何使用R编程语言中的现有库创建高级数据可视化。通常，数据可视化方法可以从两个不同的角度来考虑：\n\n- 你想向受众展示什么？是比较、关系还是其他功能？\n\
  - 你想如何展示这些洞察？哪种图表或图形方式最适合直观地展示这些洞察？\n\n基于上述两点，我们先来看看数据可视化的规则以及每种可视化背后的理论，然后再来看使用R脚本实现图形和图表的具体实践。\n\
  \n## 可视化钻石数据集\n\n考虑到前面提到的十个要点，可以根据你想要表示的内容制定数据可视化规则，来选择最佳表示方式：\n\n- 两个变量之间的关系可以用散点图表示\n\
  - 两个以上变量之间的关系可以用气泡图表示\n- 为了理解样本量较小的单个变量的分布，可以使用直方图\n- 为了理解样本量较大的单个变量的分布，可以使用密度图\n\
  - 两个变量的分布可以用散点图表示\n- 3个变量之间的分布关系可以使用3D散点图表示\n- 任何带有时间戳的变量，如日、周、月、年等，都可以用折线图表示\n\
  - 时间应始终位于水平轴上，要度量的指标应始终位于垂直轴上\n- 每个图形都应有名称和标签，这样用户不必再回到数据中才能理解它表示什么\n\n在本章中，我们将主要关注`ggplot2`库和`plotly`库。当然，我们还会介绍一些更有趣的库来创建数据可视化。R中的图形包可以按以下顺序进行组织：\n\
  \n- 绘图\n- 图形应用（例如效应排序、大型数据集和树、以及图形）\n- 图形系统\n- 设备\n- 颜色\n- 交互式图形\n- 开发\n\n有关支持上述功能的各种库的详细说明，可以参阅链接`https://cran.r-project.org/web/views/Graphics.html`。为了获得良好的可视化效果，我们需要更多的数据点，以便提高图形的密度。在本节中，我们将使用两个数据集`diamonds.csv`和`cars93.csv`来展示数据可视化。\n\
  \n\n\n\n\n## 钻石数据集可视化\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_83_0.png)\n\n\
  目前，图形看起来有些拥挤。为了使图形更直观，我们需要为 x 轴和 y 轴添加标签，并移除任意轴上的刻度线和文本，以使图形更加清晰。当行名或列名中包含文本或难以完整读取的大数字时，需要旋转相应轴上的文本：\n\
  \n```r\n> #adding labels to the graph\n> gg<-gg+labs(x=\"Price in Dollar\", y=\"\
  Carat\", )\n> gg\n> #removing text and ticks from an axis\n> gg<-gg+theme(axis.ticks.y=element_blank(),axis.text.y=element_blank())\n\
  > gg\n> gg<-gg + theme(axis.text.x=element_text(angle=50, size=10, vjust=0.5))\n\
  > gg\n> gg<-gg + theme(axis.text.x=element_text(color = \"chocolate\", vjust=0.45),\n\
  + axis.text.y=element_text(color = \"brown1\", vjust=0.45))\n> gg\n```\n\n```r\n\
  > gg<-ggplot(diamonds,aes(price,carat,color=factor(clarity)))+geom_point()\n> gg\n\
  > gg<-gg+theme(legend.title=element_blank())\n> gg\n```\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_85_0.png)\n\
  \n```r\n> gg<-gg+theme(legend.title = element_text(colour=\"darkblue\", size=16,\n\
  + face=\"bold\"))+scale_color_discrete(name=\"By Different Grids of Clarity\")\n\
  > #changing the background boxes in legend\n> gg<-gg+theme(legend.key=element_rect(fill='dodgerblue1'))\n\
  > gg\n> #changing the size of the symbols used in legend\n> gg<-gg+guides(colour\
  \ = guide_legend(override.aes = list(size=4)))\n> gg\n> #changing the size of the\
  \ symbols used in legend\n> gg<-gg+guides(colour = guide_legend(override.aes = list(size=4)))\n\
  > gg\n```\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_87_0.png)\n\n数据可视化的另一个重要方面是如何在绘图中展示多维切分。例如，在\
  \ diamonds 数据集中，我们目前关注的是钻石价格与其克拉数之间的关系。还有三个变量：切工（cut）、颜色（color）和净度（clarity）。了解这一关系在这三个变量中是否保持一致是很有意义的。也就是说，要了解我们是否可以按不同的切工、不同的颜色和不同的净度类别来绘制钻石克拉数与价格之间的关系。让我们看一下这三个分类变量的分布：\n\
  \n```r\n> table(diamonds$cut);table(diamonds$clarity);table(diamonds$color)\nFair\
  \ Good Very Good Premium Ideal\n1610 4906 12082 13791 21551\nI1 SI2 SI1 VS2 VS1\
  \ VVS2 VVS1 IF\n741 9194 13065 12258 8171 5066 3655 1790\nD E F G H I J\n6775 9797\
  \ 9542 11292 8304 5422 2808\n> #adding a multi-variable cut to the graph\n> gg<-gg+facet_wrap(~cut,\
  \ nrow=4)\n> gg\n```\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_88_0.png)\n\n在上图中，`cut`\
  \ 变量用于展示克拉数与价格之间的关系。选择的行数为四行，以便清晰呈现图形。如果我们向 `cut` 变量中再添加一个变量，即 `clarity`，图形将更加直观且更具洞察力：\n\
  \n```r\n> #adding two variables as cut to display the relationship\n> gg<-gg+facet_wrap(~cut+clarity,\
  \ nrow=4)\n> gg\n```\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_90_0.png)\n\n使用\
  \ `facet_grid()` 选项，我们可以借助 ggplot2 库展示两个分类变量之间的双变量关系：\n\n```r\n> #bi-variate plotting\
  \ using ggplot2\n> gg<-gg+facet_grid(color~cut)\n> gg\n```\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_91_0.png)\n\
  \n有一些外部图形主题可以导入到 ggplot2 函数中用于可视化，例如 `library(ggthemes)`。Tableau 是一个以数据可视化、配色和主题而闻名的工具，也可以与\
  \ ggplot 一起使用：\n\n```r\n> #Changing discrete category colors\n> ggplot(diamonds,\
  \ aes(price, carat, color=factor(cut)))+\n+ geom_point() +\n+ scale_color_brewer(palette=\"\
  Set1\")\n> #Using tableau colors\n> library(ggthemes)\n> ggplot(diamonds, aes(price,\
  \ carat, color=factor(cut)))+\n+ geom_point() +\n+ scale_color_tableau()\n```\n\n\
  ![](img/04e03d5ea18ca2e57a47a14c9ae47ace_92_0.png)\n\n可以利用颜色渐变，并在图形本身上绘制分布，对创建的图形进行细微调整：\n\
  \n```r\n> #using color gradient\n> ggplot(diamonds, aes(price, carat))+\n+ geom_point()\
  \ +\n+ scale_color_gradient(low = \"blue\", high = \"red\")\n> #plotting a distribution\
  \ on a graph\n> mid<-mean(diamonds$price)\n> ggplot(diamonds, aes(price, carat,\
  \ color=depth))+geom_point()+\n+ scale_color_gradient2(midpoint=mid,\n+ low=\"blue\"\
  , mid=\"white\", high=\"red\" )\n```\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_94_0.png)\n\
  \n## 箱线图\n\n使用 ggplot 包不仅易于解读箱线图，也易于自定义图形。人们可以轻松识别叠加在每个对应箱线图上的离群值：\n\n```r\n> #creating\
  \ boxplot\n> boxplot <- ggplot(Cars93,aes(Type,Price))+\n+ geom_boxplot(width =\
  \ 0.5,fill=\"firebrick\",color=\"cadetblue2\",\n+ outlier.colour = \"purple\",outlier.shape\
  \ = 2)+\n+ ggtitle(\"Boxplot of Price by Car Type\")\n> boxplot\n```\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_97_0.png)\n\
  \n## 地理映射\n\n任何包含城市名、州名或国家名的数据集，都可以使用 R 中的 Google Visualization 库绘制在地理地图上。利用另一个开源数据集——R\
  \ 内置的 state.x77，我们可以展示地理地图的样子。Google Visualization 库使用 Google Maps API，尝试将地理位置与业务数据一起绘制在图上。它会在浏览器中发布输出，可以将其保存为图像以便进一步使用：\n\
  \n```r\n> library(googleVis)\n> head(state.x77)\n```\n\n| 州 | 人口 | 收入 | 文盲率 | 预期寿命\
  \ | 谋杀率 | 高中毕业率 | 霜冻天数 | 面积 |\n|---|---:|---:|---:|---:|---:|---:|---:|---:|\n|\
  \ 阿拉巴马 | 3615 | 3624 | 2.1 | 69.05 | 15.1 | 41.3 | 20 | 50708 |\n| 阿拉斯加 | 365 |\
  \ 6315 | 1.5 | 69.31 | 11.3 | 66.7 | 152 | 566432 |\n| 亚利桑那 | 2212 | 4530 | 1.8\
  \ | 70.55 | 7.8 | 58.1 | 15 | 113417 |\n| 阿肯色 | 2110 | 3378 | 1.9 | 70.66 | 10.1\
  \ | 39.9 | 65 | 51945 |\n| 加利福尼亚 | 21198 | 5114 | 1.1 | 71.71 | 10.3 | 62.6 | 20\
  \ | 156361 |\n| 科罗拉多 | 2541 | 4884 | 0.7 | 72.06 | 6.8 | 63.9 | 166 | 103766 |\n\
  \n```r\n> states <- data.frame(state.name, state.x77)\n> gmap <- gvisGeoMap(states,\
  \ \"state.name\", \"Area\",\n+ options=list(region=\"US\", dataMode=\"regions\"\
  ,\n+ width=900, height=600))\n> plot(gmap)\n```\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_98_0.png)\n\
  \n## 直方图\n\n这可能是每个数据挖掘从业者都必须掌握的最简单的图形。以下代码说明了如何使用 ggplot 库创建直方图：\n\n```r\n#creating\
  \ histograms\nhistog <- ggplot(Cars93, aes(RPM)) +\n  geom_histogram(width = 0.5,\
  \ fill=\"firebrick\", color=\"cadetblue2\",\n  bins = 20) +\n  ggtitle(\"Histogram\"\
  )\nhistog\n```\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_99_0.png)\n\n## 折线图\n\
  \n折线图在展示原始数据时不是首选图表。然而，在展示与某个指标相关的不同类别之间的一些变化时，它非常重要。虽然不是首选图表，但如何展示并向读者讲述一个故事，取决于从业者本人：\n\
  \n```r\n> #creating line charts\n> linechart <- ggplot(Cars93, aes(RPM, Price))\
  \ +\n+ geom_line(color=\"cadetblue4\") +\n+ ggtitle(\"Line Charts\")\n> \n> linechart\n\
  ```\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_100_0.png)\n\n## 饼图\n\n当每个分类变量的标签少于\
  \ 10 个时，饼图是分类变量的一种表示方式。如果超过 10 个，则建议使用直方图或条形图进行比较。使用 ggplot 库可以创建饼图。脚本如下：\n\n```r\n\
  > #creating pie charts\n> pp <- ggplot(Cars93, aes(x = factor(1), fill = factor(Type)))\
  \ +\n+ geom_bar(width = 1)\n> pp + coord_polar(theta = \"y\")\n```\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_101_0.png)\n\
  \n```r\n> # 3D Pie Chart from data frame\n> library(plotrix)\n> t <- table(Cars93$Type);par(mfrow=c(1,2))\n\
  > pct <- paste(names(t), \"\\n\", t, sep=\"\")\n> pie(t, labels = pct, main=\"Pie\
  \ Chart of Type of cars\")\n> pie3D(t,labels=pct,main=\"Pie Chart of Type of cars\"\
  )\n```\n\n\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_103_0.png)\n\n在前面图表的第二个图中，连续的长度变量决定了马力与每加仑高速公路行驶里程之间的关系。浅蓝色的点表示车身较长的汽车，而颜色较深的点表示车身较小的汽车。如果不使用连续变量，而是使用因子变量来缩放两个变量之间的关系，我们将能够看到如下图所示的第一个图：\n\
  \n```\n> #adding a factor variable Origin to scale the scatterplot points\n> sp3<-sp+geom_point(aes(color=factor(Origin)),size=5)+\n\
  + ggtitle(\"Scatterplot: Adding Origin Variable\")+\n+ theme(plot.title= element_text(size\
  \ = 12, face = \"bold\"))\n> sp3\n> #adding custom color to the scatterplot\n> sp4<-sp+geom_point(aes(color=factor(Origin)),size=5)+\n\
  + scale_color_manual(values = c(\"red\",\"blue\"))+\n+ ggtitle(\"Scatterplot: Adding\
  \ Custom Color\")+\n+ theme(plot.title= element_text(size = 12, face = \"bold\"\
  ))\n> sp4\n> grid.arrange(sp3,sp4,nrow=1)\n```\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_107_0.png)\n\
  \n## 堆叠条形图\n\n堆叠条形图只是条形图的另一种变体，可以通过不同的颜色组合绘制两个以上的变量。以下示例代码展示了堆叠条形图的一些变体：\n\n```\n\
  > qplot(factor(Type), data=Cars93, geom=\"bar\", fill=factor(Origin))\n> \n> #or\n\
  > \n> ggplot(Cars93, aes(Type, fill=Origin)) + geom_bar()\n```\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_108_0.png)\n\
  \n## 茎叶图\n\n茎叶图是定量变量的一种文本表示形式，它会根据数值中最重要的数字位对数据进行分段。例如，Cars93.csv 数据集中的城市道路行驶里程变量的茎叶图表示如下：\n\
  \n```\n> stem(Cars93$MPG.city)\nThe decimal point is 1 digit(s) to the right of\
  \ the |\n1 | 55666777777778888888888889999999999\n2 | 0000000011111122222223333333344444\n\
  2 | 5555556688999999\n3 | 01123\n3 | 9\n4 | 2\n4 | 6\n```\n\n要解释茎叶图的结果：如果我们需要知道有多少个观测值大于\
  \ 30，答案是 8。竖线左侧的数字表示十位，右侧的数字表示个位，因此相应的数值为 30、31、31、32、33、39、42 和 46。\n\n## 词云\n\n\
  词云是一种数据可视化方法，适用于表示文本数据。例如，一组文本文件中某些词语频繁出现在多个文档中，词云可以概括这组文档所讨论的主题。因此，词云是对文本非结构化数据的一种可视化总结。词云主要用于表示社交媒体帖子，例如\
  \ Twitter 推文、Facebook 帖子等。在创建词云之前，需要执行各种预处理任务；文本挖掘处理的最终输出将是一个包含词语及其对应频率的数据框：\n\n\
  ```\n```r\n#Word cloud representation\nlibrary(wordcloud)\nwords<-c(\"data\",\"\
  data mining\",\"analytics\",\"statistics\",\"graphs\",\n\"visualization\",\"predictive\
  \ analytics\",\"modeling\",\"data science\",\n\"R\",\"Python\",\"Shiny\",\"ggplot2\"\
  ,\"data analytics\")\nfreq<-c(123,234,213,423,142,145,156,176,214,218,213,234,256,324)\n\
  d<-data.frame(words,freq)\nset.seed(1234)\nwordcloud(words = d$words, freq = d$freq,\
  \ min.freq = 1,c(8,.3),\nmax.words=200, random.order=F, rot.per=0.35,\ncolors=brewer.pal(7,\
  \ \"Dark2\"))\n```\n```\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_109_0.png)\n\
  \n## 气泡图\n\n气泡图是一种很好的可视化方法，其中气泡的大小表示数据集中每个变量的权重。下面来看一下示例图：\n\n```\n> #Bubble plot\
  \ using plotly\n> plot_ly(Cars93, x = Length, y = Width, text = paste(\"Type: \"\
  , Type),\n+ mode = \"markers\", color = Length, size = Length)\n```\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_112_0.png)\n\
  \n将 ggplot2 与 plotly 库结合起来可以实现良好的可视化效果，因为两个库的功能都嵌入在 ggplotly 库中：\n\n```\n> #GGPLOTLY:\
  \ ggplot plus plotly\n> p <- ggplot(data = Cars93, aes(x = Horsepower, y = Price))\
  \ +\n+ geom_point(aes(text = paste(\"Type:\", Type)), size = 2,\ncolor=\"darkorchid4\"\
  ) +\n+ geom_smooth(aes(colour = Origin, fill = Origin)) + facet_wrap(~ Origin)\n\
  > \n> (gg <- ggplotly(p))\n```\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_113_0.png)\n\
  \n## 使用 plotly 绘制条形图\n\n使用 plotly 绘制的条形图看起来比 R 中作为基础功能提供的普通条形图更加智能。下面来看一下示例图：\n\n\
  ```\n> p <- plot_ly(\n+ x = Type,\n+ y = Price,\n+ name = \"Price by Type\",\n+\
  \ type = \"bar\")\n> p\n```\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_113_1.png)\n\
  \n## 使用 plotly 绘制散点图\n\n两个连续变量之间的关系可以使用散点图表示。下面来看一下数据表示：\n\n```\n> # Simple scatterplot\n\
  > library(plotly)\n> plot_ly(data = Cars93, x = Horsepower, y = MPG.highway, mode\
  \ = \"markers\")\n> #Scatter Plot with Qualitative Colorscale\n> plot_ly(data =\
  \ Cars93, x = Horsepower, y = MPG.city, mode = \"markers\",\n+ color = Type)\n```\n\
  \n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_114_0.png)\n\n## 使用 plotly 绘制箱线图\n\n\
  以下是使用 plotly 库创建一些有趣箱线图的示例：\n\n```\n> #Box Plots\n> library(plotly)\n> ### basic\
  \ boxplot\n> plot_ly(y = MPG.highway, type = \"box\") %>%\n+ add_trace(y = MPG.highway)\n\
  ```\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_116_0.png)\n\n```\n> ### grouped\
  \ box plots\n> plot_ly(Cars93, x = Type, y = MPG.city, color = AirBags, type = \"\
  box\")\n%>%\n+ layout(boxmode = \"group\")\n```\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_116_1.png)\n\
  \n## 使用 plotly 绘制极坐标图\n\n使用 plotly 进行极坐标图可视化更加有趣。这是因为将光标悬停在图表上时，数据值会显示出来，从而可以识别模式之间的差异。下面来看一下示例代码：\n\
  \n```\n> #Polar Charts in R\n> library(plotly)\npc <- plot_ly(Cars93, r = Price,\
  \ t = RPM, color = AirBags,\nmode = \"lines\",colors='Set1')\nlayout(pc, title =\
  \ \"Cars Price by RPM\", orientation = -90,\nfont='bold')\n```\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_117_0.png)\n\
  \n## 使用 plotly 绘制极坐标散点图\n\n使用 plotly 库，用户还可以创建一种额外的图表类型，称为极坐标散点图。与二维散点图不同，其中的点以圆形方式绘制：\n\
  \n## 总结\n\n本章介绍了各种类型的图表。我们简要讨论了创建这些图表的语法，也简要讨论了每种图表适用的场景。创建可视化展示来向受众解释洞察和信息是一项技能，需要投入时间，并通过实践逐渐完善。本章只介绍了数据挖掘领域中最重要的数据可视化方法。然而，可供选择的图形和图表非常丰富，可以用于创建富有创新性的演示文稿。因此，本章的核心收获是：读者现在了解了数据可视化规则，以及数据挖掘中用于展示各种变量之间关系的图表和图形类型，并且理解了各种变量的分布。同时，读者还通过对两个重要的数据可视化库\
  \ `ggplot2` 和 `plotly` 进行同步实践，获得了实际操作经验。在下一章中，我们将学习各种回归技术的应用、回归结果的解释，以及回归结果的可视化，从而理解各种变量之间的关系。\n\
  \n\n\n\n"
- "# 4 使用汽车数据进行回归\n\n# 使用汽车数据进行回归\n\n数据挖掘项目的主要目标之一是理解各变量之间的关系，并在感兴趣的变量与其他解释变量之间建立因果关系。在数据挖掘项目中，执行预测分析不仅能洞察数据集中隐藏的信息，还有助于做出可能影响业务成果的未来决策。在本章中，读者将了解使用回归方法进行预测分析的基础知识，包括使用\
  \ R 编程的各种线性和非线性回归方法。读者将能够理解理论背景，并通过 R 编程语言获得所有回归方法的实际操作经验。\n\n在本章中，我们将涵盖以下主题：\n\n\
  - 回归问题的构建\n- 线性回归\n- 逻辑回归\n- 三次回归\n- 逐步回归\n- 惩罚回归\n\n## 回归简介\n\n回归方法有助于预测目标变量的未来结果。以下是一些业务案例：\n\
  \n- 在销售和市场营销领域，企业如何实现销售额的显著提升？如果我们对销售驱动因素进行必要的调整，能否成功预测？\n- 在零售领域，我们能否预测网站访问者数量，以便调配必要的技术支持来更好地运营网站？\n\
  - 零售/电子商务所有者如何预测其门店在月/周/年内的客流量？\n- 在银行领域，银行如何预测申请住房贷款、汽车贷款和个人贷款的人数，以维持足够的流动资金来满足需求？\n\
  - 在银行领域，可以使用回归方法估计违约概率，以便银行决定是否批准客户的贷款/信用卡申请。\n- 在汽车制造领域，汽车的销量与汽车价格成反比，而汽车价格由许多因素决定，例如不同金属/零部件的使用情况，以及转速、里程、长度、宽度等各种车辆特征。制造商如何预测销量？\n\
  \n执行回归的方法有多种，包括线性和非线性。基于回归的预测分析正以不同方式应用于不同行业。回归方法支持预测连续变量、预测变量成功或失败的概率、基于特征预测事件等。\n\
  \n## 回归问题的构建\n\n回归问题的构建对于创建良好的基于回归的预测模型非常重要。构建良好预测模型的典型方法遵循以下过程：将业务问题转化为统计问题，再将统计问题转化为统计解决方案，最后将统计解决方案转化为业务解决方案。使用基于回归的方法构建良好的预测模型需要以下步骤：\n\
  \n```\nY = f(X) + ε.....( 1 )\nY = f(X₁, X₂....... Xₙ) + ε.....( 2 )\n```\n\n公式1展示了简单线性回归方程的构建，公式2展示了可包含多个自变量的多元线性方程。因变量必须是连续变量，自变量可以是连续变量或分类变量。我们将以\
  \ `Cars93_1.csv` 数据集为例解释多元线性回归分析，其中因变量是汽车价格，所有其他变量是解释变量。回归分析包括：\n\n- 给定自变量的值，预测因变量的未来值\n\
  - 评估模型拟合统计量并比较不同模型\n- 解释系数以理解因变量变化的杠杆\n- 自变量的相对重要性\n\n回归模型的主要目标是估计 beta 参数并最小化误差项\
  \ epsilon：\n\n```\nY = β₀ + β₁X₁ + β₂X₂ + β₃X₃.....βₙXₙ ) + ε.....(3)\n```\n\n让我们使用相关性图来查看各变量之间的关系：\n\
  \n```\n#Scatterplot showing all the variables in the dataset\nlibrary(car);attach(Cars93_1)\n\
  > #12-\"Rear.seat.room\",13-\"Luggage.room\" has NA values need to remove them\n\
  > m<-cor(Cars93_1[,-c(12,13)])\n> corrplot(m, method = \"ellipse\")\n```\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_125_0.png)\n\
  \n上图显示了各变量之间的关系。从每个椭圆中我们可以了解该关系：是正相关还是负相关，是强相关、中等相关还是弱相关？相关性图有助于决定保留哪些变量以进一步研究，以及从后续分析中移除哪些变量。深棕色椭圆表示完全负相关，深蓝色椭圆表示完全正相关。椭圆越窄，相关程度越高。\n\
  \n考虑到数据集中的变量数量，阅读散点图相当困难。因此，所有变量之间的相关性可以使用相关性图来表示，如下所示：\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_126_0.png)\n\
  \n以粗体蓝色表示的相关性系数显示较高程度的正相关，而以红色显示的则显示较高程度的负相关。\n\n线性回归的假设如下：\n\n- **正态性**：估计模型中的误差项应服从正态分布\n\
  - **线性**：待估计的参数应是线性的\n- **独立性**：误差项应是独立的，因此不存在自相关\n- **等方差**：误差项应是同方差的\n- **多重共线性**：自变量之间的相关性应为零或最小\n\
  \n在拟合多元线性回归模型时，注意上述假设非常重要。让我们查看多元线性回归分析的汇总统计量并解释这些假设：\n\n```\n> #multiple linear\
  \ regression model\n> fit<-lm(MPG.Overall~.,data=Cars93_1)\n> #model summary\n>\
  \ summary(fit)\nCall:\nlm(formula = MPG.Overall ~ ., data = Cars93_1)\n```\n\n模型的估计\
  \ beta 系数：\n\n```\n> #estimated coefficients\n> fit$coefficients\n(Intercept) Price\
  \ EngineSize Horsepower\n2.808772930 -0.053419142 1.334180881 0.005005690\nRPM Rev.per.mile\
