  \ | 2.561947 |\n| Luggage.room | 2.935690 |\n\n```r\n## Regression after deleting\
  \ the EngineSize variable\nfit.4<-lm(MPG.Overall~ Price+Horsepower+RPM+Rev.per.mile+\n\
  Fuel.tank.capacity+Length+Wheelbase+Width+Turn.circle+\nRear.seat.room+Luggage.room,\
  \ data=Cars93_1[-c(28,42,39,59,60,77),])\nsummary(fit.4)\nvif(fit.4)\n\n## Regression\
  \ after deleting the Length variable\nfit.5<-lm(MPG.Overall~ Price+Horsepower+RPM+Rev.per.mile+\n\
  Fuel.tank.capacity+Wheelbase+Width+Turn.circle+\nRear.seat.room+Luggage.room, data=Cars93_1[-c(28,42,39,59,60,77),])\n\
  summary(fit.5)\n> vif(fit.5)\n```\n\n| Variable | VIF |\n|---|---:|\n| Price | 4.419799\
  \ |\n| Horsepower | 8.099750 |\n| RPM | 2.595250 |\n| Rev.per.mile | 3.232048 |\n\
  | Fuel.tank.capacity | 4.679088 |\n| Wheelbase | 8.231261 |\n| Width | 7.953452\
  \ |\n| Turn.circle | 3.357780 |\n| Rear.seat.room | 2.393630 |\n| Luggage.room |\
  \ 2.894959 |\n\n最终回归模型的系数：\n\n```r\n> coefficients(fit.5)\n```\n\n| Coefficient\
  \ | Estimate |\n|---|---:|\n| (Intercept) | 29.029107454 |\n| Price | -0.089498236\
  \ |\n| Horsepower | -0.014248077 |\n| RPM | 0.001071072 |\n| Rev.per.mile | 0.001591582\
  \ |\n| Fuel.tank.capacity | -0.769447316 |\n| Wheelbase | 0.130876817 |\n| Width\
  \ | -0.047053999 |\n| Turn.circle | -0.072030390 |\n| Rear.seat.room | -0.240332275\
  \ |\n| Luggage.room | 0.216155256 |\n\n现在我们可以得出结论，前述回归模型中不存在多重共线性。我们可以写出最终的多元线性回归方程如下：\n\
  \n$$\n\\mathrm{MPG.Overall}=29.03-0.09\\times\\mathrm{Price}-0.014\\times\\mathrm{Horsepower}+0.001\\\
  times\\mathrm{RPM}+0.001\\times\\mathrm{Rev.per.mile}-0.769\\times\\mathrm{Fuel.tank.capacity}+0.131\\\
  times\\mathrm{Wheelbase}-0.047\\times\\mathrm{Width}\n$$\n\n估计的模型参数可以解释为，价格变量每变化一个单位，MPG\
  \ 综合预测变化 0.09 个单位。同样，其他所有自变量的估计模型系数也可以进行解释。如果我们知道这些自变量的值，我们就可以使用前面的方程预测因变量 MPG 综合的可能值。\n\
  \n## Stepwise regression method for variable selection\n\n在逐步回归方法中，使用 OLS 估计方法形成一个基础回归模型。此后，根据\
  \ **Akaike Information Criteria (AIC)** 值将变量添加到或从基础模型中减去。标准规则是最小的 AIC 可保证与其他方法相比的最佳拟合。取\
  \ `Cars93_1.csv` 文件，让我们使用逐步方法创建一个多元线性回归模型。有三种不同的方法来测试最佳模型使用 step 公式：\n\n- Forward\
  \ method\n- Backward method\n- Both\n\n在向前选择方法中，最初创建一个空模型并添加一个变量以查看 AIC 值是否有任何改善。独立变量被添加到空模型中，直到\
  \ AIC 值有所改善。在向后选择方法中，完整模型被认为是基础模型。从模型中扣除一个独立变量并检查 AIC 值。如果 AIC 有所改善，该变量将被删除；该过程将继续进行，直到\
  \ AIC 值最小。在两者方法中，交替使用向前和向后选择来识别最相关的模型。让我们先看一下第一次迭代的模型结果：\n\n```r\n> #base model\n\
  > fit<-lm(MPG.Overall~.,data=Cars93_1)\n> #stepwise regression\n> model<-step(fit,method=\"\
  both\")\n```\n\n\n\n\n\n开始：AIC=183.52  \nMPG.Overall ~ Price + EngineSize + Horsepower\
  \ + RPM + Rev.per.mile + Fuel.tank.capacity + Length + Wheelbase + Width + Turn.circle\
  \ + Rear.seat.room + Luggage.room + Weight\n\n| 变量 | 自由度 | 平方和 | RSS | AIC |\n|\
  \ --- | --- | --- | --- | --- |\n| - Turn.circle | 1 | 0.147 | 546.54 | 181.54 |\n\
  | - Rear.seat.room | 1 | 0.239 | 546.64 | 181.56 |\n| - Horsepower | 1 | 0.323 |\
  \ 546.72 | 181.57 |\n| - Price | 1 | 6.055 | 552.45 | 182.43 |\n| - Width | 1 |\
  \ 6.185 | 552.58 | 182.45 |\n| - RPM | 1 | 6.686 | 553.08 | 182.52 |\n| - Length\
  \ | 1 | 6.695 | 553.09 | 182.52 |\n| - EngineSize | 1 | 8.186 | 554.58 | 182.74\
  \ |\n| - Luggage.room | 1 | 9.673 | 556.07 | 182.96 |\n| <none> |  |  | 546.40 |\
  \ 183.52 |\n| - Wheelbase | 1 | 35.799 | 582.20 | 186.73 |\n| - Rev.per.mile | 1\
  \ | 40.565 | 586.96 | 187.40 |\n| - Fuel.tank.capacity | 1 | 47.646 | 594.04 | 188.38\
  \ |\n| - Weight | 1 | 63.400 | 609.80 | 190.53 |\n\n开始时，AIC 为 183.52。在最终模型中，AIC\
  \ 为 175.51，并且包含六个自变量，如下所示：\n\n步骤：AIC=175.51  \nMPG.Overall ~ EngineSize + RPM +\
  \ Rev.per.mile + Fuel.tank.capacity + Wheelbase + Width + Luggage.room + Weight\n\
  \n| 变量 | 自由度 | 平方和 | RSS | AIC |\n| --- | --- | --- | --- | --- |\n| - Luggage.room\
  \ | 1 | 8.976 | 568.78 | 174.82 |\n| - Width | 1 | 12.654 | 572.46 | 175.34 |\n\
  | <none> |  |  | 559.81 | 175.51 |\n| - EngineSize | 1 | 14.022 | 573.83 | 175.54\
  \ |\n| - RPM | 1 | 19.422 | 579.23 | 176.31 |\n| - Wheelbase | 1 | 28.477 | 588.28\
  \ | 177.58 |\n| - Rev.per.mile | 1 | 37.873 | 597.68 | 178.88 |\n| - Fuel.tank.capacity\
  \ | 1 | 52.516 | 612.32 | 180.86 |\n| - Weight | 1 | 135.462 | 695.27 | 191.28 |\n\
  \n在上表中，“none”项表示最终模型所在的阶段，此时无法进一步调整模型或减少变量。因此，在该节点之后继续删除变量是没有意义的。\n\n## 逻辑回归\n\n\
  基于普通最小二乘法的线性回归模型假设因变量与自变量之间存在线性关系；而逻辑回归模型则假设二者之间存在对数关系。在现实生活中，有许多感兴趣的变量本质上是分类变量，例如是否购买某种产品、是否批准信用卡、肿瘤是否为癌性肿瘤等。逻辑回归不仅可以预测因变量所属的类别，还可以预测某个案例属于因变量某一水平的概率。自变量不必服从正态分布，也不必具有相等的方差。逻辑回归属于广义线性回归模型的一类。如果因变量有两个水平，则可以应用逻辑回归；但如果因变量有两个以上的水平，例如高、中、低，则可以应用多项逻辑回归模型。所有自变量都可以是连续变量、分类变量或名义变量。\n\
  \n逻辑回归模型可以使用以下公式进行解释：\n\nln [ P(Y) / (1 - P(Y)) ] = β₀ + β₁X₁ + β₂X₂ + β₃X₃ + ...\
  \ + βₙXₙ + ε ......(6)\n\nLn(P(Y)/(1-P(Y))) 表示结果的对数优势比。上式中的 beta 系数说明：解释变量每增加或减少一个单位，结果变量的对数优势比会增加还是减少，以及变化幅度。\n\
  \n我们以 `Artpiece.csv` 数据集为例，根据自变量预测因变量“是否为一次好的购买”。\n\n对于逻辑回归模型，因变量必须是具有两个水平的二元变量。如果不是二元变量，首先需要将因变量转换为二元变量。对于自变量，检查变量类型及其水平同样十分重要。如果某些自变量是分类变量，则需要进行二元转换（为每个类别创建哑变量）。因此，下面对数据进行转换，使其符合逻辑回归模型的要求：\n\
  \n```\n> #data conversion\n> Artpiece$IsGood.Purchase<-as.factor(Artpiece$IsGood.Purchase)\n\
  > Artpiece$Is.It.Online.Sale<-as.factor(Artpiece$Is.It.Online.Sale)\n> #removing\
  \ NA, Missing values from the data\n> Artpiece<-na.omit(Artpiece)\n> ## 75% of the\
  \ sample size\n> smp_size <- floor(0.75 * nrow(Artpiece))\n```\n\n右侧表达式，即模型系数：\n\
  \n```\n> # 95% CI for exponentiated coefficients\n> exp(confint(model1))\n```\n\n\
  正在等待剖面分析完成……\n\n|  | 2.5 % | 97.5 % |\n| --- | --- | --- |\n| (Intercept) | 0.02301865\
