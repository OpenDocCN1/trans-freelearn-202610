  \n## Merits and demerits of neural networks\n\nThe neural network method for performing\
  \ classification, prediction, and forecasting is still recognized as a black box\
  \ methodology in different industries. People still provide more importance to logistic\
  \ regression than neural network because of its complexity in explaining the relationship\
  \ between the dependent and independent variable.\n\nThe limitations of the neural\
  \ network model can be stated as follows:\n\n- In contrast to decision trees and\
  \ rule extraction techniques, the knowledge (patterns) “discovered” by neural networks\
  \ is not represented in a form understandable by humans.\n- Knowledge in a trained\
  \ neural network (NN) is encoded in its connection weights; hence, NN cannot be\
  \ used for descriptive data mining (exploration).\n- If NN are used for decision\
  \ making, it is impossible to explain their decisions. Often other techniques have\
  \ to be combined with NN for explanation.\n\nHere are the merits of neural networks:\n\
  \n- Though it is a bit complex to understand and interpret the results, still it\
  \ is considered a powerful technique for classification and regression\n- It is\
  \ considered a powerful machine learning technique for automatic predictive modeling\n\
  - It captures complex relationships in datasets, which a traditional algorithm such\
  \ as linear regression or logistic regression fails to understand and interpret\n\
  \n## References\n\nLichman, M. (2013). *UCI Machine Learning Repository* (http://archive.ics.uci.edu/m\
  \ 1). Irvine, CA: University of California, School of Information and Computer Science\n\
  \n## Summary\n\nIn this chapter, we discussed various methods of performing classification,\
  \ regression, and forecasting using the neural network model. Be it supervised or\
  \ unsupervised data mining problems, neural-network-based implementations are popular\
  \ not only among users but also among business stakeholders. We discussed which\
  \ model to use where and the data requirement for each of the models. In this chapter,\
  \ we specifically highlighted the importance of a powerful technique with better\
  \ accuracy always for classification- and regression-based scenarios.\n"
