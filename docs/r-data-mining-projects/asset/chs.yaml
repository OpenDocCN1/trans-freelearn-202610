  \ | 3.268054e-06 | 1.631710e-05 |\n\n可以使用卡方检验统计量对逻辑回归模型的结果执行 ANOVA。根据这里展示逻辑回归偏差分析的\
  \ ANOVA，我们可以得出结论：当向模型中加入更多自变量时，模型偏差的变化具有统计显著性。自变量按顺序逐个加入模型，并在每次迭代中将误差项的偏差与上一次迭代进行比较，以判断增加或删除某个变量是否有助于降低模型误差：\n\
  \n```\n> #ANOVA\n> anova(model1,test=\"Chisq\")\n```\n\n偏差分析表  \n模型：二项分布，链接函数：logit\
  \  \n响应变量：IsGood.Purchase  \n按顺序添加项（从第一个到最后一个）\n\n| 自由度 | 偏差 | 残差自由度 | 残差偏差 | Pr(>Chi)\
  \ |\n| --- | --- | --- | --- | --- |\n| NULL |  | 54500 | 40601 |  |\n\n- **后向选择法**：所有自变量都属于初始模型的一部分。使用\
  \ Wald 卡方显著性检验，删除卡方值最低或 p 值最高且超过 0.05 的变量（假设模型使用 95% 置信区间）。当无法再找到符合 Wald 检验标准的变量时，后向选择过程停止。\n\
  - **前向选择法**：模型从空模型开始。根据最低 p 值或最高卡方检验统计量值，将变量加入模型。当找不到符合条件的变量时，选择过程停止。\n- **两者结合**：第三种方法是同时应用后向选择和前向选择：\n\
  \n```\n> #auto detection of model\n> fit_step<-stepAIC(model1,method=\"both\")\n\
  ```\n\n开始：AIC=34893.93  \nIsGood.Purchase ~ Critic.Ratings + Acq.Cost + CurrentAuctionAveragePrice\
  \ +\nBrush.Size + CollectorsAverageprice + Is.It.Online.Sale +\nMin.Guarantee.Cost\n\
  \n| 变量 | 自由度 | 偏差 | AIC |\n| --- | --- | --- | --- |\n| <none> |  | 34872 | 34894\
  \ |\n| - Is.It.Online.Sale | 1 | 34875 | 34895 |\n| - Min.Guarantee.Cost | 1 | 34880\
  \ | 34900 |\n| - Acq.Cost | 1 | 34890 | 34910 |\n| - CollectorsAverageprice | 1\
  \ | 34898 | 34918 |\n| - CurrentAuctionAveragePrice | 1 | 34988 | 35008 |\n| - Critic.Ratings\
  \ | 1 | 35025 | 35045 |\n| - Brush.Size | 4 | 39554 | 39568 |\n\n用于变量选择的方法是前向选择与后向选择相结合。例如，在第一步中使用前向选择，同时也应用后向选择，以检查所述变量是否可以从模型中删除。\n\
  \n应用逐步模型选择过程时，务必牢记逐步法的局限性。有时会发生模型过拟合；有时当预测变量数量较多且大多数预测变量高度相关时，逐步回归会产生更高的变异性和较低的准确性。为解决这一问题，可以应用惩罚回归方法，下一节将对此进行讨论：\n\
  \n```\n> summary(fit_step)\nCall:\nglm(formula = IsGood.Purchase ~ Critic.Ratings\
  \ + Acq.Cost +\nCurrentAuctionAveragePrice +\nBrush.Size + CollectorsAverageprice\
  \ + Is.It.Online.Sale +\n```\n\n\n\nMin.Guarantee.Cost, family = binomial(logit),\
  \ data = train)\n偏离残差：\nMin 1Q Median 3Q Max\n-2.1596 -0.4849 -0.4096 -0.3401 3.8760\n\
