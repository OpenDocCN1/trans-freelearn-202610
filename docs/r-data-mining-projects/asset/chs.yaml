  ))\n> library(pROC)\n> g <- roc(IsGood.Purchase ~ prob, data = train)\n> g\n```\n\
  \n分类表的阈值为 0.50（50%）概率。如果有人想改变正确分类对象的百分比，则可以通过对概率分数设置过滤器来实现。以下代码用于使用不同的概率值创建混淆矩阵。从之前的分类表可以得出结论，90%\
  \ 的人被正确分类。\n\n## Cubic regression\n\n三次回归是回归的另一种形式，其中线性回归模型中的参数增加到一到两个级别的多项式计算。使用\
  \ Cars93_1.csv 数据集，让我们了解三次回归：\n\n```\n> fit.6<-lm(MPG.Overall~ I(Price)^3+I(Horsepower)^3+I(RPM)^3+\n\
  + Wheelbase+Width+Turn.circle, data=Cars93_1[-c(28,42,39,59,60,77),])\n> summary(fit.6)\n\
