  \n多重共线性问题，即预测变量之间的相关性，需要对最终回归模型进行验证。方差膨胀因子 VIF 是通常用来估计多重共线性的度量。计算 VIF 的公式为 1/ (1-R²)。任何自变量的\
  \ VIF 值大于 10 表明存在多重共线性；因此此类变量需要从模型中删除。一次删除一个变量然后再次检查模型的 VIF 是做到这一点的最好方法：\n\n```r\n\
  > ### Variance Inflation Factors\n> vif(fit.2)\n```\n\n| Variable | VIF |\n|---|---:|\n\
  | Price | 4.799678 |\n| EngineSize | 20.450596 |\n| Horsepower | 18.872498 |\n|\
  \ RPM | 5.788160 |\n| Rev.per.mile | 3.736889 |\n| Fuel.tank.capacity | 5.805824\
  \ |\n| Length | 15.200301 |\n| Wheelbase | 11.850645 |\n| Width | 10.2432223 |\n\
  | Turn.circle | 4.006895 |\n| Rear.seat.room | 2.566413 |\n| Luggage.room | 2.935853\
  \ |\n| Weight | 24.977015 |\n\n变量 weight 的 VIF 最大，因此删除该变量是有意义的。删除变量后，让我们重新运行模型并计算\
  \ VIF：\n\n```r\n## Regression after deleting the weight variable\nfit.3<-lm(MPG.Overall~\
  \ Price+EngineSize+Horsepower+RPM+Rev.per.mile+\nFuel.tank.capacity+Length+Wheelbase+Width+Turn.circle+\n\
  Rear.seat.room+Luggage.room, data=Cars93_1[-c(28,42,39,59,60,77),])\nsummary(fit.3)\n\
