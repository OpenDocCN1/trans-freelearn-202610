  \ | 0 |  | 1 | 0 | 0 |\n| user4 | 0 | 1 | 1 |  | 1 | 1 |\n| user5 | 1 | 0 |  | 1\
  \ | 0 |  |\n| user6 | 0 | 0 | 1 |  |  | 0 |\n| user7 |  | 1 | 0 | 0 | 1 | 1 |\n\
  | user8 | 1 | 0 | 1 | 1 | 0 |  |\n\n- **可扩展性**：最近邻算法需要随着用户数量和物品数量的增加而增长的计算量。拥有数百万用户和物品时，运行现有算法的典型基于\
  \ Web 的推荐系统将遭受严重的扩展性问题。\n\n## 实践项目\n\n数据集包含来自 1999 年 4 月至 2003 年 5 月收集的 Jester 在线笑话推荐系统匿名评分数据的\
