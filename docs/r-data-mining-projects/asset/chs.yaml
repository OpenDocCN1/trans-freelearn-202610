  \ seat room 和 luggage room 在 5% 的显著性水平下不具有统计显著性。ANOVA 显示了因变量来自任何自变量的变异来源。在回归模型之后应用\
  \ ANOVA 非常重要，以了解哪个自变量对因变量有显著贡献：\n\n\n\n```r\n> #visualizing the model statistics\n\
  > par(mfrow=c(1,2))\n> plot(fit, col=\"dodgerblue4\")\n```\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_129_0.png)\n\
  \n残差与拟合值图显示了残差值在沿着拟合线移动时的随机性。如果残差值相对于拟合值显示出任何模式，则误差项可能不是正态的。残差与拟合图表明残差项之间不存在模式；残差近似正态分布。残差基本上是模型中无法被模型解释的那部分。有几个有影响的数据点，例如第\
  \ 42 个、第 39 个和第 83 个，如前面的图中所示。正态分位数-分位数图表明，除了几个有影响的数据点外，所有其他标准化残差点都遵循正态分布。直线是零残差线，红色线是残差与拟合关系的模式。尺度与位置图和残差与杠杆图也验证了相同的观察结果，即残差项没有趋势。尺度与位置图取标准化残差的平方根并将其与拟合值作图。\n\
  \n通常，这些是数据中远离其他点的数据点，无论是因变量还是一个或多个自变量：\n\n```r\n> # A user friendly representation\
  \ of the above\n> influencePlot(fit, id.n=3, col=\"red\")\n```\n\n|   | StudRes\
