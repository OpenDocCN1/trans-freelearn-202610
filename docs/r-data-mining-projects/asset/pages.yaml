  md: '![](img/04e03d5ea18ca2e57a47a14c9ae47ace_125_0.png)


    The preceding figure shows the relationship between various variables. From each
    ellipse we can get to know how the relationship: is it positive or negative, and
    is it strongly associated, moderately associated, or weakly associated? The correlation
    plot helps in taking a decision on which variables to keep for further investigation
    and which ones to remove from further analysis. The dark brown colored ellipse
    indicates perfect negative correlation and the dark blue colored ellipse indicates
    the perfect positive correlation. The narrower the ellipse, the higher the degree
    of correlation.


    Given the number of variables in the dataset, it is quite difficult to read the
    scatterplot. Hence the correlation between all the variables can be represented
    using a correlation graph, as follows:'
