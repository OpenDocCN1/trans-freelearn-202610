- pgno: 139
  md: '# Logistic regression


    The linear regression model based on the ordinary least square method assumes
    that the relationship between the dependent variable and the independent variables
    is linear; however, the logistic regression model assumes the relationship to
    be logarithmic. There are many real-life scenarios where the variable of interest
    is categorical in nature, such as buying a product or not, approving a credit
    card or not, tumor is cancerous or not, and so on. Logistic regression not only
    predicts a dependent variable class but it predicts the probability of a case
    belonging to a level in the dependent variable. The independent variables need
    not be normally distributed and need not have equal variance. Logistic regression
    belongs to the family of generalized linear regression. If the dependent variable
    has two levels then logistic regression can be applied, but if it has more than
    two levels, such as high, medium, and low, then multinomial logistic regression
    model can be applied. All the independent variables can be continuous, categorical,
    or nominal.


    The logistic regression model can be explained using the following equation:


    ```

    ln [ P(Y) / (1 - P(Y)) ] = β₀ + β₁X₁ + β₂X₂ + β₃X₃ ..... βₙXₙ ) + ε ......(6)

    ```


    Ln (P(Y)/1-P(Y)) is the log odds of the outcome. The beta coefficients mentioned
    in the previous equation explain how the log odds of the outcome variable increase
    or decrease for every one unit increase or decrease in the explanatory variable.


    Let''s take the Artpiece.csv dataset where the dependent variable is a good purchase
    or not need to be predicted based on the independent variables.


    For a logistic regression model, the dependent variable needs to be a binary variable
    with two levels. If it is not then the first task is to convert the dependent
    variable to binary. For the independent variables it is important to check the
    type of the variable as well as the levels. If some independent variables are
    categorical then binary conversion (creating dummy variables for each category)
    is required. So here you go with data conversion in necessary format for the logistic
    regression model:


    ```

    > #data conversion

    > Artpiece$IsGood.Purchase<-as.factor(Artpiece$IsGood.Purchase)

    > Artpiece$Is.It.Online.Sale<-as.factor(Artpiece$Is.It.Online.Sale)

    > #removing NA, Missing values from the data

    > Artpiece<-na.omit(Artpiece)

    > ## 75% of the sample size

    > smp_size <- floor(0.75 * nrow(Artpiece))

    ```'
