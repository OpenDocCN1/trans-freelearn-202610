- pgno: 80
  md: '# Visualize Diamond Dataset


    In the light of the previously mentioned ten points, the data visualization rules
    can be created to select the best representation depending on what you want to
    represent:


    +   - Relationship between two variables can be represented using a scatterplot

    +   - Relationship between more than two variables can be represented using a
    bubble chart

    +   - For understanding the distribution of a single variable with few sample
    size, histogram is used

    +   - For understanding the distribution of a single variable with large sample
    size, density plot is used

    +   - Distribution of two variables can be represented using scatterplot

    +   - For representation of distribution between 3 variables, 3D scatterplot is
    used

    +   - Any variable with a time stamp, such as day, week, month, year, and so on,
    can be represented using line chart

    +   - Time should always be on the horizontal axis and the metric to be measured
    should always be on the vertical axis

    +   - Each graph should have a name and label so that the user does not have to
    go back to the data to understand what it is


    In this chapter, we will primarily focus on the `ggplot2` library and `plotly`
    library. Of course we will cover a few more interesting libraries to create data
    visualization. The graphics packages in R can be organized as per the following
    sequences:


    +   - Plotting

    +   - Graphic applications (such as effect ordering, large datasets and trees,
    and graphs)

    +   - Graphics systems

    +   - Devices

    +   - Colors

    +   - Interactive graphics

    +   - Development


    A detailed explanation of the various libraries supporting the previous functionalities
    can be found in the link `https://cran.r-project.org/web/views/Graphics.html`.
    For good visual object, we need more data points so that the density of the graphs
    can be more. In this context, we will be using two datasets, `diamonds.csv` and
    `cars93.csv`, to show data visualization.'
