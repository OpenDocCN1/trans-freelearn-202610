    need to be reduced to zero, which corresponds to higher penalized parameter lambda
    value 1.0. When lambda the penalized parameter is very small, the LASSO would
    approach the OLS regression and as lambda increases you will see fewer variables
    in your model. Hence, after lambda value of 1.0, there are no variables left in
    the model.


    *L1* and *L2* are known as regularized regression methods. *L1* cannot zero out
    regression coefficients; either you will get all the coefficients or none of them.
    However, *L2* does parameter shrinkage and variable selection automatically.


    # Summary


    In this chapter, we discussed how to create linear regression, logistic regression,
    and other nonlinear regression based methods for predicting the outcome of a variable
    in a business scenario. Regression methods are basically very important in data
    mining projects, in order to create predictive models to know the future values
    of the unknown independent variables. We looked at various scenarios where we
    understood which type of model can be applied where. In the next chapter, we are
    going to talk about association rules or market basket analysis to understand
    important patterns hidden in a transactional database.'
