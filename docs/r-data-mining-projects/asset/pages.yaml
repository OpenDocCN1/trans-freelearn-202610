    ![](img/04e03d5ea18ca2e57a47a14c9ae47ace_247_0.png)


    # Merits and demerits of neural networks


    The neural network method for performing classification, prediction, and forecasting
    is still recognized as a black box methodology in different industries. People
    still provide more importance to logistic regression than neural network because
    of its complexity in explaining the relationship between the dependent and independent
    variable.


    The limitations of the neural network model can be stated as follows:


    +   - In contrast to decision trees and rule extraction techniques, the knowledge
    (patterns) “discovered” by neural networks is not represented in a form understandable
    by humans.

    +   - Knowledge in a trained neural network (NN) is encoded in its connection
    weights; hence, NN cannot be used for descriptive data mining (exploration).

    +   - If NN are used for decision making, it is impossible to explain their decisions.
    Often other techniques have to be combined with NN for explanation.'
  merge: -1
  img_proc: true
- pgno: 248
  md: 'Here are the merits of neural networks:


    +   - Though it is a bit complex to understand and interpret the results, still
    it is considered a powerful technique for classification and regression

    +   - It is considered a powerful machine learning technique for automatic predictive
    modeling

    +   - It captures complex relationships in datasets, which a traditional algorithm
    such as linear regression or logistic regression fails to understand and interpret


    # References


    Lichman, M. (2013). *UCI Machine Learning Repository* (http://archive.ics.uci.edu/m
    1). Irvine, CA: University of California, School of Information and Computer Science


    # Summary


    In this chapter, we discussed various methods of performing classification, regression,
    and forecasting using the neural network model. Be it supervised or unsupervised
    data mining problems, neural-network-based implementations are popular not only
    among users but also among business stakeholders. We discussed which model to
    use where and the data requirement for each of the models. In this chapter, we
    specifically highlighted the importance of a powerful technique with better accuracy
    always for classification- and regression-based scenarios.'
