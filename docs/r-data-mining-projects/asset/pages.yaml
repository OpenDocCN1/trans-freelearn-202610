  md: 'Principal component (PC) 1 explains 42% variation in the dataset and principal
    component 2 explains 12% variation in the dataset. This means that first PC has
    closeness to 42% of the total data points in the n-dimensional space. From the
    preceding results, it is clear that the first 8 principal components capture 91.9%
    variation in the dataset. Rest 8% variation in the dataset is explained by 6 other
    principal components. Now the question is how many principal components should
    be chosen. The general rule of thumb is 80-20, if 80% variation in the data can
    be explained by 20% of the principal components. There are 14 variables; we have
    to look at how many components explain 80% variation in the dataset cumulatively.
    Hence, it is recommended, based on the 80:20 Pareto principle, taking 6 principal
    components which explain 81% variation cumulatively.


