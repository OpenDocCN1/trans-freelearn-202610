  md: '![](img/04e03d5ea18ca2e57a47a14c9ae47ace_87_0.png)


    Another important aspect of data visualization is how to display multi-dimensional
    cuts in a plot. For example, in the diamonds datasets, we are currently looking
    at the relationship between the price of the diamond and the carat it contains.
    There are three more variables: cut, color, and clarity. It makes sense to understand
    if the relationship is consistent across those three variables. That means, understanding
    if we can plot the relationship between the carat and the price of the diamond
    by different cut, different color, and different clarity categories. Let''s look
    at the distribution of the three categorical variables:


    ```

    > table(diamonds$cut);table(diamonds$clarity);table(diamonds$color)

