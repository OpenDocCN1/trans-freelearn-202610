    There are various options that can be passed to the format argument based on the
    user requirement:


    | Option | What it does |

    |---|---|

    | #%d | Means day as a number from (0-31) 01-31 |

    | #%a | Means abbreviated weekday as Mon |

    | #%A | A means unabbreviated weekday, Monday |

    | #%m | Month (00-12) |

    | #%b | Abbreviated month |

    | #%B | Unabbreviated month January |

    | #%y | Two-digit year (13) |

    | #%Y | Four-digit year (2013) |


    Table 1: Formatting date options


    Practical datasets contain date fields such as the transaction date in retail,
    visit date in healthcare, and processing date in BFSI; and any time series data
    contains at least one time element. To include the date variable in any statistical
    model, data transformation is required, such as calculating the vintage of a customer
    in a retail scenario. The data transformation can be done using the aforementioned
    options.


