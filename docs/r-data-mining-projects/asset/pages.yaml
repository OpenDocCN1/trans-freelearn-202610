- pgno: 184
  md: 'To perform hierarchical clustering, the input data has to be in a distance
    matrix form. The method selected has to be from one of "single", "complete", "average",
    "mcquitty", "ward.D", "ward.D2", "centroid", or "median".


    The hierarchical algorithm follows these steps:


    +   1. Start with N singleton clusters (nodes) labeled −1, . . . , −N, which represent
    the initial set of input points.

    +   2. Find a pair of nodes / cluster with minimal distance among all pairwise
    distances using a distance function.

    +   3. Combine the two nodes into a new node and remove the two old nodes. The
    new nodes are labeled consecutively 1, 2, . . .

    +   4. The distances from the new node to all other nodes are determined by the
    method parameter.

    +   5. Repeat N − 1 times from step 2 until there is one big node that contains
    all original input points.


    If the method chosen to perform hierarchical clustering is ward, then the distance
    measure to be used for clustering is Euclidean. The following code shows how to
    perform agglomerative hierarchical clustering:


    ```

    > hfit<-hclust(dist(r_df_scaled,method = "euclidean"),method="ward.D2")

    > par(mfrow=c(1,2))

    > plot(hfit,hang=-0.005,cex=0.7)

    > hfit<-hclust(dist(r_df_scaled,method = "manhattan"),method="mcquitty")

    > plot(hfit,hang=-0.005,cex=0.7)

    > hfit<-hclust(dist(r_df_scaled,method = "minkowski"))

    > plot(hfit,hang=-0.005,cex=0.7)

    > hfit<-hclust(dist(r_df_scaled,method = "canberra"))

    > plot(hfit,hang=-0.005,cex=0.7)

    ```


    Here is the first dendrogram graph:'
