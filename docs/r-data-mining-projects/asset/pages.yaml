- pgno: 223
  md: 'When we deal with multivariate data, it is really difficult to visualize and
    build models around it. In order to reduce the features, PCA is used; it reduces
    the dimensions so that we can plot, visualize, and predict the future, in a lower
    dimension. The principal components are orthogonal to each other, which means
    that they are uncorrelated. At the data preprocessing stage, the scaling function
    decides what type of input data matrix is required. If the mean centring approach
    is used as transformation then covariance matrix should be used as input data
    for PCA. If a scaling function does a standard z-score transformation, assuming
    standard deviation is equal to 1, then correlation matrix should be used as input
    data.


    Now the question is where to apply which transformation. If the variables are
    highly skewed then z-score transformation and PCA based on correlation should
    be used. If the input data is approximately symmetric then mean centring approach
    and PCA based on covariance should be applied.


    Now, let''s look at the principal component scores:


