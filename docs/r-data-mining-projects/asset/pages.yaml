    # Eclat algorithm


    Eclat algorithm uses simple intersection operations for homogenous class clustering
    with a bottom-up approach. The same code can be re-run using the eclat function
    in R and the result can be retrieved. The eclat function accepts two arguments,
    support and maximum length:


    ```

    > rules_ec <- eclat(Groceries, parameter = list(supp = 0.05))

