    t\"\n [21] \"test\"      \"Titanic\"   \"train\"     \"x\"\n [25] \"x1\"     \
    \   \"x2\"        \"x3\"        \"x4\"\n [29] \"x5\"        \"y\"         \"z\"\
    \n```"
