- pgno: 17
  md: '# # 1


    Data Manipulation Using In-built R Data


    The book *R Data Mining Blueprints* focuses mainly on learning methods and steps
    in performing data mining using the R programming language as a platform. Since
    R is an open source tool, learning data mining using R is very interesting for
    learners at all levels. The book is designed in such a way that the user can start
    from data management techniques, exploratory data analysis, data visualization,
    and modeling up to creating advanced predictive modeling such as recommendation
    engines, neural network models, and so on. This chapter gives an overview of the
    concept of data mining, its various facets with data science, analytics, statistical
    modeling, and visualization. This chapter gives a glimpse of programming basics
    using R, how to read and write data, programming notations, and syntax understanding
    with the help of a real-world case study. This chapter includes R scripts for
    practice to get hands-on experience of the concepts, terminologies, and underlying
    reasons for performing certain tasks. The chapter is designed in such a way that
    any reader with little programming knowledge should be able to execute R commands
    to perform various data mining tasks.


    In this chapter, we will discuss in brief the meaning of data mining and its relations
    with other domains such as data science, analytics, and statistical modeling;
    apart from this, we will start the data management topics using R so that you
    can achieve the following objectives:


    +   - Understanding various data types used in R, including vector and its operations

    +   - Indexing of data frames and factors sequences

    +   - Sorting and merging dataframes and data type conversion

    +   - String manipulation and date object formatting

    +   - Handling missing values and NAs and missing value imputation techniques

    +   - Flow control, looping constructs, and the use of apply functions'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# What is data mining?


    Data mining can be defined as the process of deciphering meaningful insights from
    existing databases and analyzing results for consumption by business users. Analyzing
    data from various sources and summarizing it into meaningful information and insights
    is that part of statistical knowledge discovery that helps not only business users
    but also multiple communities such as statistical analysts, consultants, and data
    scientists. Most of the time, the knowledge discovery process from databases is
    unexpected and the results can be interpreted in many ways.


    The growing number of devices, tablets, smartphones, computers, sensors, and various
    other digital devices helps in generating and collecting data at a much faster
    rate than ever before. With the ability of modern-day computers, the increased
    data can be preprocessed and modeled to answer various questions related to any
    business decision-making process. Data mining can also be defined as a knowledge-intensive
    search across discrete databases and information repositories using statistical
    methodologies, machine learning techniques, visualization, and pattern recognition
    technologies.


    The growth of structured and unstructured data, such as the existence of bar codes
    in all products in a retail store, attachment of RFID-based tags on all assets
    in a manufacturing plant, Twitter feeds, Facebook posts, integrated sensors across
    a city to monitor the changing weather conditions, video analysis, video recommendation
    based on viewership statistics, and so on creates a conducive ecosystem for various
    tools, technologies, and methodologies to splurge. Data mining techniques applied
    to the variety of data discussed previously not only provide meaningful information
    about the data structure but also recommend possible future actions to be taken
    by businesses.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '![](img/04e03d5ea18ca2e57a47a14c9ae47ace_19_0.png)


    Figure 1: Data Mining – a multi-disciplinary subject


    The process of data mining involves various steps:


    +   1. Extract the required data from databases and data warehouses.

    +   2. Perform a sanity check on the data to remove redundant characters and irrelevant
    information.

    +   3. At times, it is important to combine information from various other disjoint
    databases. Hence, look for common attributes to combine databases.

    +   4. Apply data transformation techniques. Sometimes, it is required to include
    a few attributes and features in a model.

    +   5. Pattern recognition among the input features, where any of the pattern
    recognition methods can be applied.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '6. Knowledge representation. This includes representation of knowledge mined
    from the databases in a visual form to various business stakeholders.


    ![](img/04e03d5ea18ca2e57a47a14c9ae47ace_20_0.png)


    Figure 2: A typical data mining process flow


    Having discussed the process flow of data mining and the core components, it is
    also important to look at a few challenges that one may encounter in data mining,
    such as computational efficiency, unstructured databases and their confluence
    with structured databases, high-dimensional data visualization, and so on. These
    issues can be resolved using innovative approaches. In this book, we are going
    to touch upon a few solutions while performing practical activities on our projects.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# How is it related to data science, analytics, and statistical modeling?


    Data science is a broader topic under which the data mining concept resides. Going
    by the aforementioned definition of data mining, it is a process of identifying
    patterns hidden in data and some interesting correlations that can provide useful
    insights. Data mining is a subset in data science projects that involves techniques
    such as pattern recognition, feature selection, clustering, supervised classification,
    and so on. Analytics and statistical modeling involve a wide range of predictive
    models-classification-based models to be applied on datasets to solve real-world
    business problems. There is a clear overlap between the three terminologies –
    data science, analytics, statistical modeling, and data mining. The three terminologies
    should not be looked at in isolation. Depending upon the project requirements
    and the kind of business problem, the overlap position might change, but at a
    broad level, all the concepts are well associated. The process of data mining
    also includes statistical and machine learning-based methods to extract data and
    automate rules and also represent data using good visualizations.


    # Introduction to the R programming language


    In this chapter, we are going to start with basic programming using R for data
    management and data manipulation; we are also going to cover a few programming
    tips. R can be downloaded from https://cran.r-project.org/. Based on the operating
    system, anyone can download and install R binary files on their systems. The R
    programming language which is an extension of the S language, is a statistical
    computing platform. It provides advanced predictive modeling capability, machine
    learning algorithms implementation capability, and better graphical visualization.
    R has various other plugins such as R.Net, rJava, SparkR, and RHadoop, which increases
    the usability of R in big data scenarios. The user can integrate R scripts with
    other programming platforms. Detailed information about R can be accessed using
    the following link:


    ```

    https://cran.r-project.org/.

    ```'
  merge: -1
  img_proc: true
- pgno: 22
  md: '![](img/04e03d5ea18ca2e57a47a14c9ae47ace_22_0.png)


    # Getting started with R


    The opening message when starting R would be as shown in the preceding screenshot.
    Everything entered in the R console is an object, many objects created in an active
    R session have different attributes associated with them, and one common attribute
    associated with an object is called its class. There are two popular approaches
    to object-oriented programming in R, which are S3 classes and S4 classes. The
    basic difference between the S3 and S4 approaches is that the former is a more
    flexible approach; however, the latter is a more structured approach to object-oriented
    programming. Both S3 and S4 approaches recognize any symbol, character, and number
    as an object in R sessions and provide functionality where the object can be used
    for further computations.


    # Data types, vectors, arrays, and matrices


    There are two broad sets of data types: atomic vectors and compound vectors. There
    are basically five data types in R programming under the atomic vector category:
    numeric or numbers, characters or strings, factors, logical, and complex. And
    there are four compound data types: data frame, lists, array, and matrix. The
    primary data object in R is a vector; even when we assign a single-digit number
    to any alphabet, it is a single element vector in R. All data objects contain
    a mode and a length. The mode determines the kind of data stored in the object,
    and the length determines the number of elements contained in that object. The
    c() function in R implies concatenating of various elements in a vector.'
  merge: -1
  img_proc: true
