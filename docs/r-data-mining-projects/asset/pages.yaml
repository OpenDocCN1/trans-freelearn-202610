    # Implementation of arules


    Once a good market basket analysis or arules model is built, the next task is
    to integrate the model. arules provides a PMML interface, which is a predictive
    modeling markup language interface, to integrate with other applications. Other
    applications can be other statistical software such as, SAS, SPSS, and so on;
    or it can be Java, PHP, and Android-based applications. The PMML interface makes
    it easier to integrate the model. When it comes to rule implementation, two important
    questions a retailer would like to get answer are:


    +   - What are customers likely to buy before buying a product?

    +   - What are the customers likely to buy if they have already purchased some
    product?'
