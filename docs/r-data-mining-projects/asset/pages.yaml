    # NA and missing value management


    Missing value treatment is an important task in standard data mining literature.
    In the R programming language, missing values are represented as NA. NAs are not
    string or numeric values; they are considered as an indicator for missing values.
    After importing a dataset into the R programming platform, it is important to
    check whether, for any variable, missing values exist or not; to check that, the
    `is.na()` command is used. Please see the example given here:


    ```

    > x<-c(12,13,14,21,23,24,NA,25,NA,0,NA)

    > is.na(x)

    [1] FALSE FALSE FALSE FALSE FALSE FALSE TRUE FALSE TRUE FALSE TRUE

    > mean(x,na.rm=TRUE)

    [1] 16.5

    > mean(x)

    [1] NA

    ```


    Object x is a numeric vector that contains some NA values, to verify that `is.na()`
    can be used, wherever it is satisfied the result would be TRUE. If we compute
    anything with the presence of NA, we end up getting an error or no result. Either
    we can replace the data set by altering the NA values, or we can remove those
    NA values while performing any computation. As in the preceding script, it is
    `na.rm=T` that is used to remove the NAs from the mean computation for object
    x.


    # Missing value imputation techniques


    To delete missing values from the dataset, `na.omit()` can be used. It removes
    the entire row even if the data is missing for a single variable. There are various
    missing value imputation methods:


    +   - **Mean imputation**: The missing values in a data vector is replaced by
    the mean or median value of that vector, excluding the NA'
  merge: -1
  img_proc: true
- pgno: 43
  md: '+   - **Local average method**: Taking the local average for the missing value,
    by taking into account 3 or 5 periods moving average, that is for a 3 period the
    average of missing data prior value and posterior value can decide what the missing
    value should be

    +   - **Keeping that separate**: Sometimes the imputation is simply not possible,
    and may be the client would be interested in keeping the missing values separate
    to understand the missing behavior separately

    +   - **Model-based**: There are some model-based missing value imputation techniques
    such as the regression-based missing value prediction method

    +   - **Clustering**: Similar to regression-based prediction to the missing value
    imputation, k-means clustering can be used to impute the missing values from the
    dataset


    # Summary


    In the light of the preceding discussion, it can be summarized that data manipulation
    and data management is an important step in performing data mining on various
    live projects. Since R provides a better statistical programming platform and
    visualization, the use of R to explain various data mining concepts to the readers
    makes sense. In this chapter, we looked at an introduction to data mining and
    R with concepts, a few programming basics, R data types, and so on. We also covered
    importing and exporting of various external file formats using R, sorting and
    merging concepts, and missing data management techniques.


    In the next chapter, we are going to learn more about performing exploratory data
    analysis using R and how to understand univariate, bivariate and multivariate
    datasets. First of all, we are going to understand the concepts, practical interpretation,
    and then R implementation to gain knowledge on exploratory data analysis.'
