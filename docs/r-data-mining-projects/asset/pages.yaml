  md: '# Neural networks for prediction


    The use of neural networks for prediction requires the dependent/target/output
    variable to be numeric, and all the input/independent/feature variables can be
    of any type. From the ArtPiece dataset, we are going to predict what is going
    to be the current auction average price based on all the parameters available.
    Before applying a neural-network-based model, it is important to preprocess the
    data, by excluding the missing values and any transformation if required; hence,
    let''s preprocess the data:


    ```

    library(neuralnet)

    art<- read.csv("ArtPiece_1.csv")

    str(art)

    #data conversion for categorical features

    art$Art.Auction.House<-as.factor(art$Art.Auction.House)

    art$IsGood.Purchase<-as.factor(art$IsGood.Purchase)

    art$Art.Category<-as.factor(art$Art.Category)

    art$Prominent.Color<-as.factor(art$Prominent.Color)

    art$Brush<-as.factor(art$Brush)

    art$Brush.Size<-as.factor(art$Brush.Size)

