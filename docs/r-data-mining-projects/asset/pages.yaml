- pgno: 234
  md: "Having displayed the general architecture for different types of neural networks,\
    \ let's visit the underlying math behind them.\n\n# Understanding the math behind\
    \ the neural network\n\nThe neurons present in different layers–input, hidden,\
    \ and output–are interconnected through a mathematical function called activation\
    \ function, as displayed in Figure 1. There are different variants of the activation\
    \ function, which are explained as follows. Understanding the activation function\
    \ will help in implementation of the neural network model for better accuracy:\n\
    \n+   - **Sigmoid function**: This is frequently used by professionals in data\
    \ mining and analytics, as it is easier to explain and implement too. The equation\
    \ is mentioned here:\n+   \n+     $$f(x) = \\frac{1}{1 + e^{-\\beta x}}$$\n+ \
    \  \n+     The sigmoid function, also known as the logistic function, is mostly\
    \ used to transform the input data from the input layer to the mapping layer,\
    \ or the hidden layer.\n+   - **Linear function**: This is one of the simple functions\
    \ typically used to transfer information from the de-mapping layer to the output\
    \ layer. The formula is as follows:\n+   \n+     $$f(x)=x$$\n+   - **Gaussian\
    \ function**: Gaussian functions are bell-shaped curves that are applicable for\
    \ continuous variables, where the objective is to classify the output into multiple\
    \ classes:\n+   \n+     $$f(x) = \\frac{1}{\\sqrt{2\\pi}\\sigma} e^{\\frac{-(x-\\\
    mu)^2}{2\\sigma^2}}$$"
  merge: -1
  img_proc: true
- pgno: 235
  md: "+   - **Hyperbolic tangent function**: This is another variant of transformation\
    \ function; it is used to transform information from the mapping layer to the\
    \ hidden layer:\n+   \n+     $$\\tanh(x) = \\frac{e^{x} - e^{-x}}{e^{x} + e^{-x}}$$\n\
    +   \n+   - **Log sigmoid transfer function**: The following formula explains\
    \ the log sigmoid transfer function used in mapping the input layer to the hidden\
    \ layer:\n+   \n+     $$f(x) = \\log\\left(\\frac{1}{1 + e^{-\\beta x}}\\right)$$\n\
    +   \n+   - **Radial basis function**: This is another activation function; it\
    \ is used to transfer information from the de-mapping layer to the output layer:\n\
    +   \n+     $$f(x) = \\sum_{j=1}^{m} w_{j} h_{j}(x)$$\n\nDifferent types of transfer\
    \ functions, as previously discussed, can be interchangeable in neural network\
    \ architectures. They can be used in different stages such as input to hidden,\
    \ hidden to output, and so on, to improve the model accuracy.\n\n# Neural network\
    \ implementation in R\n\nR programming for statistical computing provides three\
    \ different libraries to perform the neural network model for various tasks. These\
    \ three are `nnet`, `neuralnet`, and `rsnns`. In this chapter, we will use `ArtPiece_1.csv`\
    \ and two libraries, `nnet` and `neuralnet`, to perform various tasks. The syntax\
    \ for neural networks in those two libraries can be explained as follows."
  merge: -1
  img_proc: true
- pgno: 236
  md: 'The neuralnet library depends on two other libraries, grid and MASS; while
    installing the neuralnet library, you have to make sure that these two dependency
    libraries are installed properly. In fitting a neural network model, the desired
    level of accuracy in a model defines the required number of hidden layers with
    the number of neurons in it; the number of hidden layers increases as the level
    of complexity increases. This library provides an option for training of neural
    networks using backpropagation, resilient backpropagation with (Riedmiller, 1994)
    or without weight backtracking (Riedmiller and Braun, 1993), or the modified globally
    convergent version by Anastasiadis et al. (2005). The package allows flexible
    settings through custom choice of error and activation functions. Now let''s look
    at the syntax and the components in it that dictate the accuracy of the model:


    | Formula | To define the input and output relationship |

    |---|---|

    | `Data` | Dataset with the input and output variables. |

    | `Hidden` | A vector specifying the number of hidden layers in it. For example,
    (10, 5, 2) means 10 hidden neurons in the first layer, 5 in the second, and 2
    in the third layer. |

    | `Stepmax` | Maximum number of steps to be used. |

    | `Rep` | Number of iterations. |

    | `Startweights` | Random weights for the connections. |

    | `Algorithm` | The algorithm to be used to fit a neural network object. `''backprop''`
    refers to backpropagation. The `''rprop+''` and `''rprop-''` refer to resilient
    backpropagation with and without weight backtracking respectively, while `''sag''`
    and `''slr''` refer to the smallest absolute gradient and smallest learning rate.
    |

    | `Err.fct` | Two methods: **sum squared error (SSE)** for regression-based prediction
    and **cross entropy (CE)** for classification-based problems. |

    | `Act.fct` | `"logistic"` and `"tanh"` are possible for the logistic function
    and tangent hyperbolicus. |

    | `Linear.output` | If no activation function is applied to the output layer,
    it has to be TRUE. |

    | `Likelihood` | If the error function is equal to the negative log-likelihood
    function, the information criteria AIC and BIC will be calculated. |


    Table 1: neuralnet syntax description'
