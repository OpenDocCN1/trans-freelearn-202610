- pgno: 217
  md: '# Dimensionality Reduction


    For practical project, we have considered a dataset default of credit card `clients.csv`,
    which contains 30,000 samples and 24 attributes or dimensions. We are going to
    apply two different methods of feature reduction: the traditional way and the
    modern machine learning way.


    # Attribute description


    The following are descriptions for the attributes from the dataset:


    +   - **X1:** Amount of the given credit (NT dollar). It includes both the individual
    consumer credit and his/her family (supplementary) credit.

    +   - **X2:** Gender (`1 = male; 2 = female`).

    +   - **X3:** Education (`1 = graduate school; 2 = university; 3 = high school;
    4 = others`).

    +   - **X4:** Marital status (`1 = married; 2 = single; 3 = others`).

    +   - **X5:** Age (year).

    +   - **X6–X11:** History of past payment. We tracked the past monthly payment
    records (from April to September, 2005) as follows:

    +     - X6 = the repayment status in September, 2005

