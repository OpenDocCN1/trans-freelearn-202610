    # Word cloud


    Word cloud is a data visualization method which is preferred when it is required
    to represent a textual data. For example, the representation of a bunch of text
    files with few words having frequent appearances across those set of documents
    would summarize the topic of discussion. Hence, word cloud representation is a
    visual summary of the textual unstructured data. This is mostly used to represent
    social media posts, such as Twitter tweets, Facebook posts, and so on. There are
    various pre-processing tasks before arriving to create a word cloud, the final
    output from a text mining exercise would be a data frame with words and their
    respective frequencies:


    ```

    ```r

    #Word cloud representation

    library(wordcloud)

    words<-c("data","data mining","analytics","statistics","graphs",

    "visualization","predictive analytics","modeling","data science",

    "R","Python","Shiny","ggplot2","data analytics")

    freq<-c(123,234,213,423,142,145,156,176,214,218,213,234,256,324)

    d<-data.frame(words,freq)

    set.seed(1234)

    wordcloud(words = d$words, freq = d$freq, min.freq = 1,c(8,.3),

    max.words=200, random.order=F, rot.per=0.35,

    colors=brewer.pal(7, "Dark2"))

    ```

