  md: "Support of X = number of transactions involving X / total number of transactions\n\
    \n+   - **Confidence**: Confidence always refers to the confidence of a rule.\
    \ It can be defined as confidence of x => y. Hence, support (x U y) implies the\
    \ number of transactions in the database containing both item set x and item y:\n\
    +   \n+     Confidence of X => Y = support of (X U Y) / support of (X)\n+   -\
    \ **Lift**: Lift can be defined as the proportion of observed support to expected\
    \ support:\n+   \n+     Lift of a rule X => Y = support of (X U Y) / support of\
    \ (X) * support of (Y)\n\nAn association rule stands supported in a transactional\
    \ database if it satisfies the minimum support and minimum confidence criteria.\n\
    \nLet's take an example to understand the concepts.\n\nThe following is an example\
    \ from the Groceries.csv dataset from the arules library in R:\n\n| Transaction\
    \ ID | Items |\n|---|---|\n| 001 | Bread, banana, milk, butter |\n| 002 | Milk,\
    \ butter, banana |\n| 003 | Curd, milk, banana |\n| 004 | Curd, bread, butter\
    \ |\n| 005 | Milk, curd, butter, banana |\n| 006 | Milk, curd, bread |\n\nThe\
    \ support of item set X where X = {milk, banana} = proportion of transactions\
    \ where milk and banana bought together; 4/6 = 0.67, hence, the support of the\
    \ X item set is 0.67.\n\nLet's assume Y is curd; the confidence of X => Y, which\
    \ is {milk, banana} => {curd}, is the proportion of support (X U Y) / support(X);\
    \ three products—milk, banana, and curd—are purchased together 2 times. Hence\
    \ the confidence of the rule = (2/6)/0.67 = 0.5. This implies that 50% of the\
    \ transactions containing milk and banana the rule are correct.\n\nConfidence\
    \ of a rule can be interpreted as a conditional probability of purchasing Y such\
    \ that the item set X has already been purchased."
  merge: -1
  img_proc: true
- pgno: 155
  md: 'When we create too many rules in a transactional database, we need a measure
    to rank the rules; lift is a measure to rank the rules. From the preceding example,
    we can calculate the lift for the rule $X$ to $Y$. Lift of $X \Rightarrow Y =
    support\ of\ (X \cup Y) / support\ of\ (X) * support\ of\ (Y) = 0.33/0.66*0.66
    = 0.33/0.4356 = 0.7575$.


    # Where to apply MBA?


    To understand the relationship between various variables in large databases, it
    is required to apply market basket analysis or association rules. It is the simplest
    possible way to understand the association. Though we have explained various industries
    where the concept of association rule can be applied, the practical implementation
    depends on the kind of dataset available and the length of data available. For
    example, if you want to study the relationship between various sensors integrated
    at a power generation plant to understand which all sensors are activated at a
    specific temperature level (very high), you may not find enough data points. This
    is because very high temperature is a rare event and to understand the relationship
    between various sensors, it is important to capture large data at that temperature
    level.


    # Data requirement


    Product recommendation rules are generated from the results of the association
    rule model. For example, what is the customer going to buy next if he/she has
    already added a Coke, a chips packet, and a candle? To generate rules for product
    recommendation, we need frequent item sets and hence the retailer can cross-sell
    products. Therefore the input data format should be transactional, which in real-life
    projects sometimes happens and sometimes does not. If the data is not in transaction
    form, then a transformation needs to be done. In R, dataframe is a representation
    of mixed data. Can we transform the dataframe to transactional data so that we
    can apply association rules on that transformed dataset? This is because the algorithm
    requires that the input data format be transactional. Let''s have a look at the
    methods to read transactions from a dataframe.


    The `arules` library in R provides a function to read transactions from a dataframe.
    This function provides two options, single and basket. In single format, each
    line represents a single item; however, in basket format, each line represents
    a transaction comprising item levels and separated by a comma, space, or tab.
    For example:


    ```

    ```r

    > ## create a basket format

    > data <- paste(

    + "Bread, Butter, Jam",

    + "Bread, Butter",

    + "Bread",

    ```

    ```'
