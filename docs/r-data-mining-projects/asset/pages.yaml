    741 9194 13065 12258 8171 5066 3655 1790

    D E F G H I J

    6775 9797 9542 11292 8304 5422 2808

    > #adding a multi-variable cut to the graph

    > gg<-gg+facet_wrap(~cut, nrow=4)

    > gg

    ```'
