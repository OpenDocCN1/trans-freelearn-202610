    \ or nominal variable with a certain frequency. In other words, levels that are\
    \ repetitive in a categorical variable are known as factors. In the following\
    \ sample script, a character vector “domains” contains many levels; using the\
    \ `factor` command, the frequency for each level can be estimated.\n\nSequences\
    \ are repeated number of iterations, either numerical values or categorical or\
    \ nominal values that can be part of a dataset. Numeric sequences can be created\
    \ using a colon operator. To generate sequences using factor variables, the `gl()`\
    \ function can be used. This is a very useful function while computing quantiles\
    \ and graphical functions. Also, there are various other possible scenarios where\
    \ you can use the function:\n\n```\n```r\n> seq(from=1,to=5,length=4)\n[1] 1.000000\
    \ 2.333333 3.666667 5.000000\n> seq(length=10,from=-2,by=.2)\n[1] -2.0 -1.8 -1.6\
    \ -1.4 -1.2 -1.0 -0.8 -0.6 -0.4 -0.2\n> rep(15,10)\n[1] 15 15 15 15 15 15 15 15\
    \ 15 15\n> gl(2,5,labels=c('Buy','DontBuy'))\n[1] Buy Buy Buy Buy Buy DontBuy\
    \ DontBuy DontBuy\nDontBuy\n[10] DontBuy\nLevels: Buy DontBuy\n```\n```\n\nThe\
    \ first line of code generates the sequence in ascending order, the second line\
    \ creates a reverse sequence, and the last line creates a sequence for the factor\
    \ data type.\n\n# Import and export of data types\n\nIf the Windows directory\
