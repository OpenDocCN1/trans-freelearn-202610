  md: "```\n2 13 FALSE      DataMining\n3 24 TRUE  MachineLearning\n4 54 FALSE   \
    \     Projects\n5 29 TRUE        Statistics\n```\n\nDataframes are another popular\
    \ form of data type in the R programming language that include all different data\
    \ types. A dataframe is a list that contains multiple vectors of the same length\
    \ and different types of data. If you simply import a dataset from a spreadsheet,\
    \ the data type by default becomes dataframe. Later on, the data type for individual\
    \ variables can be changed. So, dataframe can be defined as a matrix that contains\
    \ columns of different data types. In the preceding script, the dataframe x contains\
    \ three different data types: numeric, logical, and character. Most real-world\
    \ datasets contain different data types; for example, in a retail store, information\
    \ about customers is stored in a database. This includes customer ID, purchase\
    \ date, amount purchased, whether part of any loyalty program or not, and so on.\n\
    \nOne important point about vectors: all elements of a vector should be of the\
    \ same type. If not, R will forcibly convert that by coercion. For example, in\
    \ a numeric vector, if one element contains a character value, the vector type\
    \ will change from numeric to character. The script is given as follows:\n\n```\n\
    > x1<-c(2.5,1.4,6.3,4.6,9.0)\n> class(x1)\n[1] \"numeric\"\n> x1<-c(2.5,1.4,6.3,4.6,9.0,\"\
    cat\")\n> class(x1)\n[1] \"character\"\n```\n\nR is case sensitive, so \"cat\"\
    \ is different from \"Cat\". Hence, please be careful while assigning object names\
    \ to the vectors. At times, it would be difficult to remember the object names:\n\
    \n```\n> ls()\n  [1] \"a\"         \"centers\"   \"df\"        \"distances\"\n\
