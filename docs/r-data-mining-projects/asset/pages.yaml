- pgno: 124
  md: '```

    Y = f(X) + ε.....( 1 )

    Y = f(X₁, X₂....... Xₙ) + ε.....( 2 )

    ```


    Equation 1 shows the formulation of a simple linear regression equation and equation
    2 shows the multiple linear equations where many independent variables can be
    included. The dependent variable must be a continuous variable and the independent
    variables can be continuous and categorical. We are going to explain the multiple
    linear regression analysis by taking the Cars93_1.csv dataset, where the dependent
    variable is the price of cars and all the other variables are explanatory variables.
    The regression analysis includes:


    +   - Predicting the future values of the dependent variable, given the values
    for independent variables

    +   - Assessment of model fit statistics and comparison of various models

    +   - Interpreting the coefficients to understand the levers of change in the
    dependent variable

    +   - The relative importance of the independent variables


    The primary objective of a regression model is to estimate the beta parameters
    and minimize the error term epsilon:


    ```

    Y = β₀ + β₁X₁ + β₂X₂ + β₃X₃.....βₙXₙ ) + ε.....(3)

    ```


    Let''s look at the relationship between various variables using a correlation
    plot:


    ```

    #Scatterplot showing all the variables in the dataset

    library(car);attach(Cars93_1)

    > #12-"Rear.seat.room",13-"Luggage.room" has NA values need to remove them

    > m<-cor(Cars93_1[,-c(12,13)])

    > corrplot(m, method = "ellipse")

    ```'
  merge: -1
  img_proc: true
