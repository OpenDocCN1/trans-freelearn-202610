- pgno: 232
  md: '# Introduction to neural networks


    The brain''s biological network provides the basis for connecting elements in
    a real-life scenario for information processing and insight generation. It''s
    a hierarchy of neurons connected through layers, where the output of one layer
    becomes the input for another layer; information passes from one layer to another
    layer as weights. The weights associated with each neuron contain insights so
    that the recognition and reasoning become easier for the next level. Artificial
    neural network is a very popular and effective method that consists of layers
    associated with weights. The association between different layers is governed
    by a mathematical equation that passes information from one layer to the other.
    In fact, a bunch of mathematical equations are at work inside one artificial neural
    network model. The following graph shows the general architecture for a neural-network-based
    model:


    ![](img/04e03d5ea18ca2e57a47a14c9ae47ace_232_0.png)


    Figure 1


    In the preceding graph, there are three layers—Input, Hidden and Output layer—which
    are the core of any neural network-based architecture. ANNs are a powerful technique
    used to solve many real-world problems such as classification, regression, and
    feature selection. ANNs have the ability to learn from new experiences in the
    form of new input data in order to improve the performance of classification-
    or regression-based tasks and to adapt themselves to changes in the input environment.
    Each circle in the preceding figure represents a neuron.


    There are different variants of neural networks that are used in multiple different
    scenarios; we are going to explain a few of them conceptually in this chapter,
    and also their usage in practical applications:


    +   - **Single hidden layer neural network**: This is the simplest form of neural
    network, as shown in the preceding figure. In it, there is only one hidden layer.

    +   - **Multiple hidden layer neural networks**: In this form, more than one hidden
    layer will connect the input data to the output data. The complexity of calculation'
