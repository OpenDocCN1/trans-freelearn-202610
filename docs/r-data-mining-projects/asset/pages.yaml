- pgno: 157
  md: '# Assumptions/prerequisites


    Implementation of association rules for performing market basket analysis is based
    on some assumptions. Here are the assumptions:


    +   - Assume that all data is categorical.

    +   - There should not be any sparse data; the sparsity percentage should be minimum.
    Sparsity implies a lot of cells in a dataset with no values (with blank cells).

    +   - The number of transactions required to find an interesting relationship
    between various products is a function of the number of items or products covered
    in the database. In other words, if you include more products with a less number
    of transactions, you will get higher sparsity in the dataset and vice versa.

    +   - The higher the number of items you want to include in the analysis, the
    more number of transactions you will need to validate the rules.


    # Modeling techniques


    There are two algorithms that are very popular for finding frequent item sets
    that exist in a retail transactional database:


    +   - **Apriori algorithm:** It was developed by Agrawal and Srikant (1994). It
    considers the breadth first and provides counts of transactions.

    +   - **Eclat algorithm:** This was developed by Zaki et. al. (1997b). It considers
    depth first; it provides intersection of transactions rather than count of transactions.


    In this chapter, we are using the Groceries.csv dataset, which will be used in
    both the algorithms.


    # Limitations


    Though association rules are a top choice among practitioners when it comes to
    understanding relationships in a large transactional database, they have certain
    inherent limitations:


    +   - Association rule mining is a probabilistic approach in the sense that it
    computes the conditional probability of a product being purchased, such that a
    set of other items has already been purchased/added to the cart by the customer.
    It only estimates the likelihood of buying the product. The exact accuracy of
    the rule'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'may or may not be true.


    +   - Association rule is a conditional probability estimation method using simple
    count of items as a measure.

    +   - Association rules are not useful practically, even with a high support,
    confidence, and lift; this is because most of the times, trivial rules may sound
    genuine. There is no mechanism to filter out the trivial rules from the global
    set of rules but using a machine learning framework (which is out of the scope
    of this book).

    +   - The algorithm provides a large set of rules; however, a few of them are
    important, and there is no automatic method to identify the number of useful rules.


    # Practical project


    The Groceries.csv dataset that we are going to use comprises of 1 month of real-world
    point-of-sale (POS) transaction data from a grocery store. The dataset encompasses
    9,835 transactions and there are 169 categories. Item sets are defined as a combination
    of items or products P_i {i =1....n} that customers buy on the same visit. To
    put it in a simpler way, the item sets are basically the grocery bills that we
    usually get while shopping from a retail store. The bill number is considered
    the transaction number and the items mentioned in that bill are considered the
    market basket. A snapshot of the dataset is given as follows:


    | brown bread | soda | fruit/vegetable juice | canned beer | newspapers | shopping
    bags |

    | yogurt | beverages | bottled water | specialty bar |  |  |

    | hamburger meat | other vegetables | rolls/buns | spices | bottled water | hygiene
    articles |

    | root vegetables | other vegetables | whole milk | beverages | sugar |  |

    | pork | berries | other vegetables | whole milk | whipped/sour cream | artif.
    sweetener |

    | beef | grapes | detergent |  |  |  |


    The columns represent items and the rows represent transactions in the sample
    snapshot just displayed. Let''s explore the dataset to understand the features:


    ```

    > # Load the libraries

    > library(arules)

    > library(arulesViz)

    > # Load the data set

    > data(Groceries) #directly reading from library

    > Groceries<-read.transactions("groceries.csv",sep=",") #reading from local computer

    ```'
