    7. **Implementing K-means in live applications:** For implementation of K-means
    clustering with any other statistical software and web applications, PMML script
    can be used. **PMML** stands for **Predictive Model Markup Language**, which is
    recognized as an industry standard for deploying predictive models:


    ```

    #pmml code

    library(pmml);

    library(XML);

    pmml(km)

    ```


    When we save a model in PMML format, it prepares an XML script for the model where
    the model parameters are embedded in the script. It is written in such a way that
    any other external statistical software can read the model.


    # Hierarchical clustering


    There are two different ways of implementing the hierarchical clustering algorithm,
    but one thing is common; both use a distance measure to estimate the similarity
    between cluster members:


    +   - **Agglomerative method:** Bottom-up approach

    +   - **Divisive method:** Top-down approach'
