  md: '# 4


    # Regression with Automobile

    Data


    One of the primary objectives of data mining projects is to understand the relationship
    between various variables and establish a cause and effect relationship between
    the variable of interest and other explanatory variables. In data mining projects,
    performing predictive analytics not only entails insights on hidden messages in
    datasets but also helps in making future decisions which might impact the business
    outcomes. In this chapter, the reader will get to know the basics of predictive
    analytics using regression methods, including various linear and nonlinear regression
    methods using R programming. The reader will be able to understand the theoretical
    background as well as get practical hands-on experience with all the regression
    methods using R programming language.


    In this chapter, we will cover the following topics:


    +   - Regression formulation

    +   - Linear regression

    +   - Logical regression

    +   - Cubic regression

    +   - Stepwise regression

    +   - Penalized regression'
