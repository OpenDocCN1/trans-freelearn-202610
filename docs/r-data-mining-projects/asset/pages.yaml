    ![](img/04e03d5ea18ca2e57a47a14c9ae47ace_135_0.png)


    The problem of multicollinearity, that is, the correlation between predictor variables,
    needs to be verified for the final regression model. Variance Inflation Factor
    (VIF) is the measure typically used to estimate the multicollinearity. The formula
    to compute the VIF is 1/ (1-R²). Any independent variable having a VIF value of
    more than 10 indicates multicollinearity; hence such variables need to be removed
    from the model. Deleting one variable at a time and then again checking the VIF
    for the model is the best way to do this:


    ```

    > ### Variance Inflation Factors

    > vif(fit.2)

    Price EngineSize Horsepower RPM

    4.799678 20.450596 18.872498 5.788160

    Rev.per.mile Fuel.tank.capacity Length Wheelbase

    3.736889 5.805824 15.200301 11.850645

