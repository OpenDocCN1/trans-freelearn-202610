    \n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_1_0.png)\n\n伯明翰 - 孟买\n\n## 关于作者\n\n\
    **Pradeepta Mishra** 是一名数据科学家、预测建模专家、深度学习和机器学习实践者，同时也是一名计量经济学家。目前，他负责印度班加罗尔 Ma\
    \ Foi Analytics 的数据科学与机器学习业务。Ma Foi Analytics 是 Tomorrow's Cognitive Insights\
    \ Ecology 的高级分析服务提供商，通过结合尖端人工智能、专有大数据平台和数据科学专业知识，为客户提供服务。他拥有一项关于改进零售行业商品陈列图设计的专利。Pradeepta\
    \ 曾在印度艾哈迈达巴德印度管理学院发表和展示研究论文。他是多所知名商学院的客座教师，并经常发表有关数据科学和机器学习的演讲。\n\nPradeepta 在该领域拥有超过\
    \ 10 年的经验，曾使用文本挖掘流程解决分类、回归、模式识别、时间序列预测和非结构化数据分析等多个项目，涉及医疗保健、保险、零售与电子商务、制造业等领域。\n\
    \n如果你有任何问题，欢迎通过 Twitter 联系我：`@mishra1_PK`。无论何时何地，我都非常乐意帮助同行的网络专业人士。\n\n> *我要感谢我的妻子\
    \ Prajna 和女儿 Aarya，感谢她们包容我深夜写作的时光。同时，我也要感谢工作中的朋友和同事，感谢他们一直以来对我写作的鼓励。*\n\n- 变量分箱或连续数据离散化\
    \ 50\n- 列联表、二元统计和数据正态性检验 50\n- 假设检验 56\n  - 总体均值检验 56\n    - 已知方差时的单尾均值检验 56\n\
    \    - 比例的单尾和双尾检验 58\n  - 两样本方差检验 61\n- 非参数方法 64\n  - Wilcoxon 符号秩检验 64\n  - Mann-Whitney-Wilcoxon\
    \ 检验 65\n  - Kruskal-Wallis 检验 65\n- 总结 66\n- 第 3 章：可视化钻石数据集 67\n  - 使用 ggplot2\
    \ 进行数据可视化 71\n    - 条形图 83\n    - 箱线图 84\n    - 气泡图 85\n    - 环形图 86\n    - 地理映射\
    \ 87\n    - 直方图 88\n    - 折线图 90\n    - 饼图 90\n    - 散点图 92\n    - 堆叠条形图 97\n\
    \    - 茎叶图 98\n    - 词云 99\n    - 鸡冠图 99\n  - 使用 plotly 101\n    - 气泡图 102\n \
    \   - 使用 plotly 绘制条形图 103\n    - 使用 plotly 绘制散点图 103\n    - 使用 plotly 绘制箱线图 104\n\
    \    - 使用 plotly 绘制极坐标图 107\n    - 使用 plotly 绘制极坐标散点图 107\n    - 极坐标面积图 108\n\
    \  - 创建地理映射 109\n  - 总结 110\n- 第 4 章：使用汽车数据进行回归分析 111\n\n**第 2 章“使用汽车数据进行探索性数据分析”**帮助读者理解探索性数据分析。它包括对数据集中的变量进行数值和图形表示，以便更容易地理解数据集并快速得出结论。了解数据集、分析所涉及的变量类型、不同变量之间的关联等内容非常重要。通过创建交叉列表来理解分类变量之间的关系，并对数据执行经典统计检验，可以验证关于数据的各种不同假设。\n\
    \n**第 3 章“可视化钻石数据集”**介绍了数据可视化的基础知识，以及如何使用 R 编程语言中的现有库创建高级数据可视化。当我们查看数字和统计数据时，按照不同切工观察变量，可能会得到类似的结论；然而，当我们以可视化方式查看变量和因素之间的关系时，往往会发现完全不同的结果。因此，数据可视化能够传达数字和统计数据无法表达的信息。\n\
    \n**第 4 章“使用汽车数据进行回归分析”**帮助你了解使用回归方法进行预测分析的基础知识，包括使用 R 编程实现的各种线性和非线性回归方法。本章将介绍使用回归方法进行预测分析的基础知识，包括使用\
    \ R 编程实现的各种线性和非线性回归方法。你将能够理解回归方法的理论背景，并通过 R 实际操作各种回归方法。\n\n**第 5 章“使用杂货数据进行购物篮分析”**介绍第二种产品推荐方法，即广为人知的购物篮分析（Market\
    \ Basket Analysis，MBA），也称为关联规则。该方法用于关联交易层面购买的商品，找出拥有相似商品的用户子群，并据此推荐产品。MBA 还可以用于制定追加销售和交叉销售策略。\n\
    \n**第 6 章“使用电子商务数据进行聚类”**将教授以下内容：什么是细分、如何应用聚类执行细分、聚类所使用的方法，以及各种细分方法的比较。本章将介绍使用各种聚类方法进行细分的基础知识。\n\
    \n**第 7 章“构建零售推荐引擎”**介绍以下内容及其使用 R 编程语言的实现：什么是推荐以及推荐的工作原理、执行推荐的类型和方法，以及使用 R 实现产品推荐。\n\
    \n**第 8 章“_降维_”**使用实际数据集和 R 实现主成分分析（PCA）、奇异值分解（SVD）以及迭代特征选择方法等降维技术。随着数据规模和数据类型不断增长，数据维度也在持续增加。降维技术在各个行业中都有广泛应用，例如图像处理、语音识别、推荐引擎、文本处理等。\n\
    \n**第 9 章“_将神经网络应用于医疗保健数据_”**将介绍各种类型的神经网络、神经网络方法及其变体，以及用于控制人工神经网络训练的不同函数，从而执行以下标准数据挖掘任务：使用基于回归的方法预测实数输出、在基于分类的任务中预测输出类别、根据历史数据预测数值属性的未来值，以及压缩特征以识别重要特征，从而执行预测或分类。\n\
    \n## 本书所需内容\n\n为了学习本书中的示例和代码，你需要从 `https://cran.r-project.org/` 下载 R 软件（也可以选择从\
    \ `https://www.rstudio.com/` 下载 RStudio），并将其安装到计算机上。本书没有特定的硬件要求；任何内存超过 2 GB 的计算机都可以运行，并且支持包括\
    \ Mac、Linux 和 Windows 在内的所有平台。\n\n## 本书适用读者\n\n本书适合刚开始从事数据挖掘、数据科学或预测建模工作的读者，也适合具备一定统计知识和编程知识、处于中级水平的读者。要理解本书涵盖的数据挖掘概念，必须具备基础统计知识。不要求读者事先掌握编程知识，因为在最初几章中，我将介绍使用\
    \ R 进行数据管理和基础统计分析的方法。本书也适合学生、专业人士以及希望成为数据分析师的有经验人士。\n\n## 排版约定\n\n本书使用多种文本样式来区分不同类型的信息。下面列出了一些样式示例，并解释其含义。\n\
    \n"
