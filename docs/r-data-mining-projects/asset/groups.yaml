    \ | 0.01464159 | 0.1049563 | 1.894027 |\n| 11 | {yogurt} | {citrus fruit} | 0.02165735\
    \ | 0.1552478 | 1.875752 |\n\n- In the telecommunications industry, the positioning\
    \ of towers to optimize user experience is driven by segmentation exercise. Also\
    \ the design of telecom plans, such as custom offers (especially for students,\
    \ older people, professionals, and so on), based on the usage of services are\
    \ also made using clustering methods.\n- In the healthcare industry, to decide\
    \ the size of hospital beds for different departments, such as emergency care,\
    \ acute care, and so on, clustering exercise helps. Also, reporting of various\
    \ diseases across different states can be used to create a cluster of similar\
    \ regions or places where a set of procedures can be adopted.\n- In governance,\
    \ law enforcement agencies strengthen their presence in those areas where crime\
    \ evidence/instance is more. So clustering techniques are used to create groups\
    \ of cities such as high, medium, and low-crime areas. Based on the data, they\
    \ can align their forces accordingly.\n- In insurance, clustering is used to decide\
    \ differential premiums by grouping different cities based on parameters such\
    \ as demographic information, geolocation, and risk zone.\n\n## Understanding\
    \ customer segmentation\n\nIn standard data mining practice, customer segmentation\
    \ is a way of dividing all customers into various subgroups relevant to the business\
    \ and the business problem. That subgroup creation can be done either by using\
    \ a subjective approach or by keeping the business objective in mind. In different\
    \ industries, customer segmentation has different applications; for example, in\
    \ retail, it is important to know the purchase behavior of customers, and different\
    \ subgroups displaying unique purchase behavior is relevant to the business.\n\
    \n## Why understanding customer segmentation is important\n\nIn the retail and\
    \ e-commerce industry, offers, campaigns, loyalty programs, and discount strategies\
    \ work based on the purchase behavior of the subgroup of customers. In other industries,\
    \ sales, marketing strategy, and business plans run keeping in mind the customer's\
    \ behavior, and the behavior drives the sales. That unique customer behavior can\
    \ be understood by performing segmentation on the data.\n\n## How to perform customer\
    \ segmentation?\n\nHaving discussed various benefits of performing customer segmentation,\
    \ it is important to know how to perform customer segmentation. There are two\
    \ broad methods used to perform customer segmentation:\n\n- Customer segmentation\
    \ using clustering-based methods\n- Customer segmentation using the recency, frequency,\
    \ and monetary (RFM) model\n\nIn this chapter, we will discuss the clustering-based\
    \ approach to perform customer segmentation; the second method is not in the scope\
    \ of this chapter.\n\n## Various clustering methods available\n\nAll clustering\
    \ algorithms can be classified into four groups, as follows:\n\n- **Hierarchical\
    \ clustering**: Using this method, a number of clusters are prepared from the\
    \ dataset, forming a hierarchy, and the clusters are then grouped using a tree\
    \ structure so that the entire dataset can be represented as a single tree structure.\
    \ The advantage of this method is that unlike partitioning-based clustering, we\
    \ don't have to specify the number of clusters to be created from the dataset.\n\
    - **Partitioning clustering**: In this approach, the dataset is divided into a\
    \ finite group of clusters based on a distance function in such a way that the\
    \ within-cluster similarity is maximum and between-cluster similarity is minimum.\
    \ K-means, which is a popular method in data mining practice, falls under this\
    \ category.\n- **Model-based clustering**: Using the data model, a group of clusters\
    \ is created from the dataset; the methods used in the model-based clustering\
    \ approach can be divided into two groups:\n  - Maximum likelihood estimation\n\
    \  - Bayesian estimation\n- **Other clustering algorithms**: There are other clustering\
    \ techniques available such as fuzzy clustering, bagged clustering, and so on.\
    \ Fuzzy clustering uses a fuzzy logic on the data so that the same data point\
    \ can be a part of more than one cluster. In other words, there is no exclusivity\
    \ in terms of cluster membership. This method is basically different from the\
    \ other three forms of clustering, where a data point belongs to a single cluster.\
    \ Another algorithm that falls under this group is known as self-organizing maps\
    \ (SOM).\n"
