    ![](img/04e03d5ea18ca2e57a47a14c9ae47ace_162_0.png)


    ## Apriori 算法


    Apriori 算法利用向下封闭性，该性质表明频繁项集的任何子集也是频繁项集。Apriori 算法采用逐层搜索来寻找频繁项集。该算法仅生成等式右侧（RHS）只有一个项的规则，RHS
    被称为后件；等式左侧（LHS）被称为前件。这意味着 RHS 中有一个项而 LHS 为空的规则也可能被视为有效规则；为了避免这些空白规则，需要将最小长度参数从
    1 改为 2：


    ```r

    > # Get the association rules based on apriori algo

    > rules <- apriori(Groceries, parameter = list(supp = 0.01, conf = 0.10))

    ```


    参数规范：


    | confidence | minval | smax | arem | aval | originalSupport | support | minlen
    | maxlen | target | ext |

    |---|---|---|---|---|---|---|---|---|---|---|

    | 0.1 | 0.1 | 1 | none | FALSE | TRUE | 0.01 | 1 | 10 | rules | FALSE |


    算法控制：


    | filter | tree | heap | memopt | load | sort | verbose |

    |---|---|---|---|---|---|---|

    | 0.1 | TRUE | TRUE | FALSE | TRUE | 2 | TRUE |


