    complete, average, mcquitty, centroid, median, ward.D, ward.D2. Each method is
    different. Single linkage uses the smallest minimum pairwise distance to merge
    two clusters. Complete linkage uses the similarity between the dissimilar objects
    in two different clusters. Likewise each method has a unique way to compute the
    similarity between different clusters:


    ```

    > summary(hfit)

    Length Class Mode

    merge 878 -none- numeric

    height 439 -none- numeric

    order 440 -none- numeric

    labels 0 -none- NULL

    method 1 -none- character

    call 3 -none- call

    dist.method 1 -none- character

    ```


    Divisive hierarchical clustering can be performed using the diana function from
    the library cluster. The syntax is shown as follows:


    ```

    diana(x, diss = inherits(x, "dist"), metric = "euclidean", stand = FALSE, keep.diss
    = n < 100, keep.data = !diss, trace.lev = 0)

    ```


    To apply the diana function, the input data should be in matrix or dataframe type.
    The diana function accepts both a distance matrix as well as a dataframe as an
    input. There is a logical flag argument meant to control the input structure to
    the function. The metric argument is a character string specifying the metric
    to be used to calculate distance; it has two options, "euclidean" and "manhattan".
    Euclidean distances are root sums of squares of differences and manhattan distances
    are the sums of absolute differences, for which the mathematical formula has already
    been explained in this chapter. If x, the input dataset, is already a dissimilarity
    matrix, then this diss argument will be ignored from execution. The argument stand
    if takes the value as true, this implies that the raw dataset is used and further
    the distance matrix needs to be created.


    The diana function constructs a hierarchy of clusters, as the name suggests, starting
    with one large cluster containing all observations. Clusters are divided until
    each cluster contains only a single observation. At each hierarchy, the cluster
    with the largest diameter based on the distance from the cluster center to the
    outermost data point as measured by the distance function is selected:


    ```

    dfit<-diana(r_df,diss=F,metric = "euclidean",stand=T,keep.data = F)

    summary(dfit)

    plot(dfit)

    ```'
