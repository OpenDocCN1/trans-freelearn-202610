  - '[PAGE 68]


    The way we analyzed the one-tail and two-tail test of population mean for the
    sample data in the case of known variance.


    # One tail and two tail test of proportions


    Using the Cars93 dataset, suppose 40% of the USA-manufactured cars have an RPM
    of more than 5000. From the sample data, we found that 17 out of 57 cars have
    RPM above 5000. What do you interpret from the context?


    ```

    > mileage<-subset(Cars93,Cars93$RPM > 5000)

    > table(mileage$Origin)

    USA non-USA

    17 40

    > p1<-17/57

    > p0<- 0.4

    > n <- length(mileage)

    > z <- (p1-p0)/sqrt(p0*(1-p0)/n)

    > z

    [1] -1.079

    > #computing the critical value at 5% alpha level

    > alpha = .05

    > z1 = qnorm(1-alpha)

    > z1

    [1] 1.645

    > ifelse(z > z1,"Reject the Null Hypothesis","Accept the Null Hypothesis")

    [1] "Accept the Null Hypothesis"

    ```


    If the alternative hypothesis is not directional, it is a case of two-tailed test
    of proportions; nothing from the preceding calculation would change except the
    critical value calculation. The detailed script is given as follows:


    ```

    > mileage<-subset(Cars93,Cars93$RPM > 5000)

    > table(mileage$Origin)

    USA non-USA

    17 40

    > p1<-17/57

    > p0<- 0.4

    > n <- length(mileage)

    > z <- (p1-p0)/sqrt(p0*(1-p0)/n)

    > z

    [1] -1.079

    > #computing the critical value at 5% alpha level

    > alpha = .05

    > z1 = qnorm(1-alpha/2)

    > c(-z1,z1)

    [1] -1.96 1.96

    ```'
  - '[PAGE 69]


    ```

    > ifelse(z > z1 | z < -z1,"Reject the Null Hypothesis","Accept the Null Hypothesis")

    [1] "Accept the Null Hypothesis"

    ```


    +   - **Two sample paired test for continuous data:** The null hypothesis that
    is being tested in the two-sample paired test would be that there is no impact
    of a procedure on the subjects, the treatment has no effect on the subjects, and
    so on. The alternative hypothesis would be there is a statistically significant
    impact of a procedure, effectiveness of a treatment, or drug on the subjects.


    Though we don''t have such a variable in the Cars93 dataset, we can still assume
    the paired relationship between minimum prices and maximum prices for different
    brands of cars.


    +   - **Null hypothesis for the two sample t-test:** There is no difference in
    the mean prices.

    +   - **Alternative hypothesis:** There is a difference in the mean prices:


    ```

    > t.test(Cars93$Min.Price, Cars93$Max.Price, paired = T)

    Paired t-test

    data: Cars93$Min.Price and Cars93$Max.Price

    t = -9.6, df = 92, p-value = 2e-15

    alternative hypothesis: true difference in means is not equal to 0

    95 percent confidence interval:

    -5.765 -3.781

    sample estimates:

    mean of the differences

    -4.773

    ```


    The p-value is less than 0.05. Hence, it can be concluded that the difference
    in mean minimum price and maximum price is statistically significant at alpha
    95% confidence level.


    +   - **Two sample unpaired test for continuous data:** From the Cars93 dataset,
    the mileage on the highway and within the city is assumed to be different. If
    the difference is statistically significant, can be tested by using the independent
    samples t-test for comparison of means.

    +   - **Null hypothesis:** There is no difference in the MPG on highway and MPG
    within city.

    +   - **Alternative hypothesis:** There is a difference in the MPG on highway
    and MPG within city:


    ```

    Welch Two Sample t-test

    data: Cars93$MPG.city and Cars93$MPG.highway

    ```'
