    # Geo mapping


    Any dataset that has a city name and state name or a country name can be plotted
    on a geographical map using google visualization library in R. Using another open
    source dataset, state.x77 inbuilt in R, we can show how a geo map looks. The google
    visualization library, using Google maps API, tries to plot the geographic locations
    on the plot along with the enterprise data. It publishes the output in a browser
    which can be stored back as an image to use it further:


    ```

    > library(googleVis)

