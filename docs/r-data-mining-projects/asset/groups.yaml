    # Techniques available for dimensionality reduction


    The dimensionality reduction techniques can be classified into two major groups:
    parametric or model-based feature reduction and non-parametric feature reduction.
    In non-parametric feature reduction technique, the data dimension is reduced first
    and then the resulting data can be used to create any classification or predictive
    model, supervised or unsupervised. However, the parametric-based method emphasizes
    on monitoring the overall performance of a model and its accuracy by changing
    the features and hence deciding how many features are needed to represent the
    model. The following are the techniques generally used in data mining literature
    to reduce data dimensions:


    +   - Non-parametric:

    +     - PCA method

    +     - Parametric method

    +     - Forward feature selection

    +     - Backward feature selection


    We are going to discuss these methods in detail with the help of a dataset using
    R programming language. Apart from these techniques mentioned earlier, there are
    few more methods but not that popular, such as removing variables with low variance
    as they don''t add much information to the target variable and also removing variables
    with many missing values. The latter comes under the missing value treatment method,
    but can still be used to reduce the features in a high dimensional dataset. There
    are two methods in R, `prcomp()` and `princomp()`, but they use two slightly different
    methods; `princomp()` uses eigen vectors and `prcomp()` uses SVD method. Some
    researchers favor `prcomp()` as a method over `princomp()` method. We are going
    to use two different methods here.


    # Which technique to apply where?


    The usage of the technique actually depends upon the researcher; what he is looking
    at from the data. If you are looking at hidden features and want to represent
    the data in a low dimensional space, PCA is the method one should choose. If you
    are looking at building a good classification or prediction model, then it is
    not a good idea to perform PCA first; you should ideally include all the features
    and remove the redundant ones by any parametric method, such as forward or backward.
    Selection of techniques vary based on data availability, the problem statement,
    and the task that someone is planning to perform.'
