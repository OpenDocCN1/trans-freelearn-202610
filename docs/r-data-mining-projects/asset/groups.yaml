    \n## Why understanding customer segmentation is important\n\n在零售和电子商务行业，优惠、活动、忠诚度计划和折扣策略都基于客户子群的购买行为。在其他行业，销售、营销策略和业务计划都是以客户行为为依据进行的，而行为驱动销售。通过对数据进行细分，可以理解这种独特的客户行为。\n\
