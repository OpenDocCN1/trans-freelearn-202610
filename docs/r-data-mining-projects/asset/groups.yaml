    mean in group No mean in group Yes\n18.94 24.16\n```\n\n因此，上述检验的结论是：自动挡与手动挡车型之间的平均油耗存在统计学上显著的差异；这是因为p值小于0.05。\n\
    \n在应用t检验之前，检查数据的正态性是很重要的；可以使用Shapiro检验函数来评估变量的正态性：\n\n```\n> shapiro.test(Cars93$MPG.city)\n\
