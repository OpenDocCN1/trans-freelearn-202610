    ```\n\n在训练数据集中，有 50,867 个观测值和 17 个变量；在测试数据集中，有 21,801 个观测值和 17 个变量。当前的拍卖平均价格作为预测的因变量，仅使用另外四个数值变量作为特征：\n\
