    # Date and time formatting


    The date functions return a Date class that represents the number of days since
    January 1, 1970. The as.numeric() function can be used to create a numeric variable
    with the number of days since 1/1/1970. The return value of as.Date() is a Date
    class object:


    ```

    > Sys.time()

    [1] "2015-11-10 00:43:22 IST"

    > dt<-as.Date(Sys.time())

    > class(dt)

    [1] "Date"

    ```


    The system time function captures the date and time with the time zone. When we
    convert the system time using the as.Date function and stored as a new object
    in R, we find that the class of that object is Date. The weekdays function returns
    the name of the day such as "Monday" or "Wednesday". The months function returns
    the name of the month from the date variable. The quarters function returns the
    name of the quarter for the date object and year value also can be extracted using
    the substr() command:


    ```

    > weekdays(as.Date(Sys.time()))

    ```'
  - '[PAGE 36]


    ```

    [1] "Monday"

    > months(as.Date(Sys.time()))

    [1] "November"

    > quarters(as.Date(Sys.time()))

    [1] "Q4"

    > substr(as.POSIXct(as.Date(Sys.time())),1,4)

    [1] "2015"

    ```


    If the date variable given in the dataset is not in proper format for further
    computations, it can be formatted using the format function:


    ```

    > format(Sys.time(),format = "%m %d %y")

    [1] "11 10 15"

    ```


    There are various options that can be passed to the format argument based on the
    user requirement:


    | Option | What it does |

    |---|---|

    | #%d | Means day as a number from (0-31) 01-31 |

    | #%a | Means abbreviated weekday as Mon |

    | #%A | A means unabbreviated weekday, Monday |

    | #%m | Month (00-12) |

    | #%b | Abbreviated month |

    | #%B | Unabbreviated month January |

    | #%y | Two-digit year (13) |

    | #%Y | Four-digit year (2013) |


    Table 1: Formatting date options


    Practical datasets contain date fields such as the transaction date in retail,
    visit date in healthcare, and processing date in BFSI; and any time series data
    contains at least one time element. To include the date variable in any statistical
    model, data transformation is required, such as calculating the vintage of a customer
    in a retail scenario. The data transformation can be done using the aforementioned
    options.


