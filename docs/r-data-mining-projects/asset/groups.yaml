    smp_size <- floor(0.70 * nrow(art))\n## set the seed to make your partition reproducible\n\
    set.seed(123)\ntrain_ind <- sample(seq_len(nrow(art)), size = smp_size)\ntrain\
    \ <- art[train_ind, ]\ntest <- art[-train_ind, ]\nfun2<-function(x){\n  as.numeric(x)\n\
