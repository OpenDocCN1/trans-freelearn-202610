    # Non-parametric methods


    When a training dataset does not conform to any specific probability distribution
    because of non-adherence to the assumptions of that specific probability distribution,
    the only option left to analyze the data is via non-parametric methods. Non-parametric
    methods do not follow any assumption regarding the probability distribution. Using
    non-parametric methods, one can draw inferences and perform hypothesis testing
    without adhering to any assumptions. Now let''s look at a set of on-parametric
    tests that can be used when a dataset does not conform to the assumptions of any
    specific probability distribution.


    # Wilcoxon signed-rank test


    If the assumption of normality is violated, then it is required to apply non-parametric
    methods in order to answer a question such as: is there any difference in the
    mean mileage within the city between automatic and manual transmission type cars?


    ```

    > wilcox.test(Cars93$MPG.city~Cars93$Man.trans.avail, correct = F)

    Wilcoxon rank sum test

    data: Cars93$MPG.city by Cars93$Man.trans.avail

    W = 380, p-value = 1e-06

    ```'
