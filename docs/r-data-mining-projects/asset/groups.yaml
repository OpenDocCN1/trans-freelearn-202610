    \ taking a dataset from healthcare (`PimaIndiansDiabetes.csv [ref: 1]`) and a\
    \ dataset from retail/e-commerce (`Wholesalecustomers.csv [ref: 1]`). Before running\
    \ a clustering exercise, data sufficiency conditions need to be checked.\n\n##\
    \ K-means clustering\n\nK-means clustering is an unsupervised learning algorithm\
    \ that tries to combine similar objects into a group in such a way that the within-group\
    \ similarity should be maximum and the between-group object similarity should\
    \ be minimum. “Object” here implies the data points that are entered into an algorithm.\
    \ The within-group similarity is computed based on a centrality measure called\
    \ centroid (arithmetic mean) and a distance function that measures how close the\
    \ objects within a group are to the center. The “K” in K-means clustering implies\
    \ the number of clusters that a user might be interested in. The following steps\
    \ need to be followed for K-means clustering. Since the mean is used as a measure\
    \ of estimating the centroid, it is not free from the presence of extreme observations\
    \ or outliers. Hence, it is required to check the presence of outliers in a dataset\
    \ before running K-means clustering.\n\n### 1. Checking the presence of outliers\n\
    \nLet's use the boxplot method of identifying the presence of any outliers in\
    \ the `Wholesalecustomers.csv` dataset:\n\n```r\n> r_df<-read.csv(\"Wholesalecustomers.csv\"\
    )\n> ####Data Pre-processing\n> par(mfrow=c(2,3))\n> apply(r_df[,c(-1,-2)],2,boxplot)\n\
    ```\n\nThe dotted points after the whisker line in each preceding boxplot for\
    \ all the variables indicate that there are lots of outliers in the dataset. The\
    \ capping method is mostly used by practitioners to remove the outliers from the\
    \ dataset. If any data point exceeds the quantiles, 90th percentile, 95th percentile,\
    \ or 99th percentile for each variable, then those data points need to be capped\
    \ at the respective percentiles:\n\n```r\n> #computing quantiles\n> quant<-function(x){quantile(x,probs=c(0.95,0.90,0.99))}\n\
    > out1<-sapply(r_df[,c(-1,-2)],quant)\n```\n\n### 2. Scaling the dataset\n\nInclusion\
    \ of only continuous variables in the K-means clustering exercise does not guarantee\
    \ that all the variables would be on the same scale. For example, the age of a\
    \ customer ranges from 0-100 and the income of a customer ranges from 0-100,000.\
    \ Since both units of measurement are different, they might fall into different\
    \ clusters, which becomes more complex when we have more data points to be represented.\
    \ In order to compare segments in a clustering process, all the variables need\
    \ to be standardized on a scale; here we have applied standard normal transformation\
    \ (Z-transformation) for all the variables:\n\n```r\n> r_df_scaled<-as.matrix(scale(r_df[\
    \ ,c(-1,-2)]))\n> head(r_df_scaled)\nFresh Milk Grocery Frozen Detergents_Paper\
    \ Delicassen\n[1,]  0.2351056 1.2829174 0.11321460 -0.96232799 0.1722993 0.1570550\n\
    [2,] -0.4151579 1.3233470 0.45658819 -0.30652122 0.4120701 0.6313698\n[3,] -0.4967305\
    \ 1.0597962 0.13425842 -0.03373355 0.4984496 1.8982669\n[4,]  0.3041643 -0.9430315\
    \ -0.45821928 1.66113143 -0.6670924 0.6443648\n[5,]  1.3875506 0.1657331 0.05110966\
    \ 0.60623797 -0.1751554 1.8928669\n[6,] -0.1421677 0.9153464 -0.30338465 -0.77070636\
    \ -0.1681831 0.2974239\n```\n\n### 3. Choose initial cluster seeds\n\nThe selection\
    \ of initial random seeds decides the number of iterations required for convergence\
    \ of the model. Typically, initial cluster seeds chosen at random are temporary\
    \ means of the clusters. The objects closer to the centroid measured by the distance\
    \ function are assigned the cluster membership. With the addition of a new member\
    \ into the cluster, again the centroid is computed and each seed value is replaced\
    \ by the respective cluster centroid. In K-means clustering, this process of adding\
    \ more objects to the group and hence updating the centroid goes on until the\
    \ centroids are not moving and the objects are not changing the group membership.\n\
    \n### 4. Decide the number of cluster K\n\nIn the R programming language, there\
    \ are two libraries, Rcmdr (R Commander) and stats, that support K-means clustering\
    \ and they use two different approaches. The Rcmdr library needs to be loaded\
    \ to run the algorithm, but stats is already built into base R. The number of\
    \ clusters required to represent the data using the K-means algorithm is decided\
    \ by the scree plot using the following formula:\n\n```r\n> library(Rcmdr)\n>\
    \ sumsq<-NULL\n> #Method 1\n> par(mfrow=c(1,2))\n> for (i in 1:15) sumsq[i] <-\n\
    + sum(KMeans(r_df_scaled, centers=i, iter.max=500,\n+ num.seeds=50)$withinss)\n\
    >\n> plot(1:15, sumsq, type=\"b\", xlab=\"Number of Clusters\",\n+ ylab=\"Within\
    \ groups sum of squares\", main=\"Screeplot using Rcmdr\")\n>\n> #Method 2\n>\
    \ for (i in 1:15) sumsq[i] <-\n+ sum(kmeans(r_df_scaled, centers=i, iter.max=5000,\n\
    +     algorithm = \"Forgy\")$withinss)\n>\n> plot(1:15, sumsq, type=\"b\", xlab=\"\
    Number of Clusters\",\n+ ylab=\"Within groups sum of squares\", main=\"Screeplot\
    \ using Stats\")\n```\n\nThe following graph explains the scree plot. Using both\
    \ approaches, the ideal number of clusters is 4, decided by looking at the “elbow”\
    \ point on the scree plot. The vertical axis shows the within-group sum of squares\
    \ dropping as the cluster number increases on the horizontal axis:\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_179_0.png)\n\
    \nOnce the number of clusters is decided, the cluster centers and distance can\
    \ be computed, and the following code explains the functions to use in K-means\
    \ clustering. The objective here is to classify the objects in such a way that\
    \ they are as much dissimilar as possible from one group to another group and\
    \ as much similar as possible within each group. The following function can be\
    \ used to compute the within-group sum of squares from the cluster centers to\
    \ the individual objects:\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_180_0.png)\n\
    \nThe sum of squares from each of the clusters is computed and then added up to\
    \ compute the total within-group sum of squares for the dataset. The objective\
    \ here is to minimize the within-group sum of squares total.\n\n### 5. Grouping\
    \ based on minimum distance\n\nThe K-means syntax and explanation for the arguments\
    \ are as follows:\n\n```r\nkmeans(x, centers, iter.max = 10, nstart = 1,\n   \
    \    algorithm = c(\"Hartigan-Wong\", \"Lloyd\", \"Forgy\",\n       \"MacQueen\"\
    ), trace=FALSE)\n```\n\n| Argument | Description |\n|---|---|\n| `x` | **Numeric\
    \ matrix of data, or an object that can be coerced to such a matrix (such as a\
    \ numeric vector or a data frame with all numeric columns)** |\n| `centers` |\
    \ Either the number of clusters, say *k*, or a set of initial (distinct) cluster\
    \ centers. If it’s a number, a random set of (distinct) rows in *x* is chosen\
    \ as the initial centers. |\n| `iter.max` | The maximum number of iterations allowed.\
    \ |\n| `nstart` | If the center is a number, how many random sets should be chosen?\
    \ |\n| `algorithm` | Character. This may be abbreviated. Note that \"Lloyd\" and\
    \ \"Forgy\" are alternative names for one algorithm. |\n\n*Table 1: The description\
    \ for the K-means syntax*\n\n```r\n> #Kmeans Clustering\n> library(cluster);library(cclust)\n\
    > set.seed(121)\n> km<-kmeans(r_df_scaled, centers=4, nstart=17, iter.max=50000,\
    \ algorithm = \"Forgy\", trace = T)\n```\n\nThe scaled dataset is used to create\
    \ clusters, with four clusters and 17 initial starting points. Given the 50,000\
    \ iterations with the Forgy algorithm, the following results are obtained from\
    \ the model:\n\n```r\n> #checking results\n> summary(km)\n```\n\nFor the same\
    \ dataset, we can predict the cluster membership, and the actual cluster membership\
    \ versus the predicted cluster membership can be represented in the following\
    \ table:\n\n```r\n> #predicting cluster membership\n> Cluster$Predicted<-predict.kmeans(km,r_df_scaled)\n\
    > table(Cluster$Membership,Cluster$Predicted)\n1 2 3 4\n1 84 0 0 0\n2 0 188 0\
    \ 0\n3 0 0 65 0\n4 0 0 0 103\n```\n\n### 6. Implementing K-means in live applications\n\
    \nFor implementation of K-means clustering with any other statistical software\
    \ and web applications, PMML script can be used. **PMML** stands for **Predictive\
    \ Model Markup Language**, which is recognized as an industry standard for deploying\
    \ predictive models:\n\n```r\n> #pmml code\n> library(pmml);\n> library(XML);\n\
    > pmml(km)\n```\n\nWhen we save a model in PMML format, it prepares an XML script\
    \ for the model where the model parameters are embedded in the script. It is written\
    \ in such a way that any other external statistical software can read the model.\n\
    \n## Hierarchical clustering\n\nThere are two different ways of implementing the\
    \ hierarchical clustering algorithm, but one thing is common; both use a distance\
    \ measure to estimate the similarity between cluster members:\n\n- **Agglomerative\
    \ method:** Bottom-up approach\n- **Divisive method:** Top-down approach\n"
  mdcn: "\n\n现在，让我们以医疗保健数据集（`PimaIndiansDiabetes.csv [ref: 1]`）和零售/电子商务数据集（`Wholesalecustomers.csv\
    \ [ref: 1]`）为例，开始使用各种聚类方法对数据集进行分割。在运行聚类分析之前，需要检查数据充分性条件。\n\n## K-means 聚类\n\n\
    K-means聚类是一种无监督学习算法，它试图将相似的对象组合成一个组，使得组内相似性最大，组间对象相似性最小。这里的“对象”指输入到算法中的数据点。组内相似性基于称为质心（算术平均值）的中心性度量和一个距离函数来计算，该距离函数度量组内对象与中心的接近程度。K-means中的“K”表示用户可能感兴趣的簇数。K-means聚类需要遵循以下步骤。由于使用均值作为估计质心的度量，它无法避免极端观测值或异常值的影响。因此，在运行K-means聚类之前，需要检查数据集中是否存在异常值。\n\
    \n### 1. 检查是否存在异常值\n\n让我们使用箱线图方法识别`Wholesalecustomers.csv`数据集中是否存在任何异常值：\n\n```r\n\
    > r_df<-read.csv(\"Wholesalecustomers.csv\")\n> ####Data Pre-processing\n> par(mfrow=c(2,3))\n\
    > apply(r_df[,c(-1,-2)],2,boxplot)\n```\n\n前面每个变量的箱线图中，须线之后的散点表明数据集中存在大量异常值。实践者通常使用封顶方法从数据集中去除异常值。如果任何数据点超过每个变量的分位数（90%分位数、95%分位数或99%分位数），则需要在相应的分位数处对这些数据点进行封顶：\n\
    \n```r\n> #computing quantiles\n> quant<-function(x){quantile(x,probs=c(0.95,0.90,0.99))}\n\
    > out1<-sapply(r_df[,c(-1,-2)],quant)\n```\n\n### 2. 缩放数据集\n\n在K-means聚类分析中仅包含连续变量并不能保证所有变量都处于同一尺度。例如，客户的年龄范围是0-100，而客户的收入范围是0-100,000。由于两者的度量单位不同，它们可能落入不同的簇，当需要表示更多数据点时，这会变得更加复杂。为了在聚类过程中比较各分组，所有变量都需要在同一尺度上进行标准化；这里我们对所有变量应用了标准正态变换（Z变换）：\n\
    \n```r\n> r_df_scaled<-as.matrix(scale(r_df[ ,c(-1,-2)]))\n> head(r_df_scaled)\n\
    Fresh Milk Grocery Frozen Detergents_Paper Delicassen\n[1,]  0.2351056 1.2829174\
    \ 0.11321460 -0.96232799 0.1722993 0.1570550\n[2,] -0.4151579 1.3233470 0.45658819\
