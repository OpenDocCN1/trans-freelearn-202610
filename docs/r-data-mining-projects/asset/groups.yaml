    Exploratory data analysis is an integral part of data mining. It involves numerical
    as well as graphical representation of variables in a dataset for easy understanding
    and quick conclusion about a dataset. It is important to get an understanding
    about the dataset, type of variables considered for analysis, association between
    various variables, and so on.

    Creating cross tabulations to understand the relationship between categorical
    variables and performing classical statistical tests on the data to verify various
    different hypotheses about the data can be tested out.


    You will now get an understanding about the following things:


    +   - How to use basic statistics to know properties of a single and multiple
    variables

    +   - How to calculate correlation and association between two or more variables

    +   - Performing multivariate data analysis

    +   - Statistical properties of various probability functions for any dataset

    +   - Applying statistical tests on data to conclude hypotheses

    +   - Comparing two or more samples'
