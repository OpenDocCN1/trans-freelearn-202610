  - '[PAGE 66]


    # Hypothesis testing


    The null hypothesis states that nothing has happened, the means are constant,
    and so on. However, the alternative hypothesis states that something different
    has happened and the means are different about a population. There are certain
    steps in performing a hypothesis test:


    +   1. **State the null hypothesis**: A statement about the population is assumed;
    for example, the average mileage of cars within a city is 40.

    +   2. **State the alternative hypothesis**: If the null hypothesis turns out
    to be false, then what other possibility is there? For example, if the mileage
    within the city is not 40, then is it greater than 40 or less than 40? If it is
    not equal to 40, then it is a non-directional alternative hypothesis.

    +   3. **Calculate the sample test statistic**: The test statistic could be t-test,
    f-test, z-test, and so on. Select the appropriate test statistic based on the
    data availability and the hypothesis declared previously.

    +   4. **Decide the confidence limit**: There are three different confidence limits:
    90%, 95% and 99% depending on the degree of accuracy related to a specific business
    problem. It is up to the researcher/analyst to choose the level of confidence
    interval.

    +   5. **Define the alpha value**: If the confidence level selected is 95%, the
    alpha value is going to be 5%. Hence deciding the alpha value would help in calculating
    the p-value for the test.

    +   6. **Decision**: If the p-value selected is less than the alpha level, then
    there is evidence that the null hypothesis can be rejected; if it is not, then
    we are going to accept the null hypothesis.


    # Test of the population mean


    Using the hypothesis testing procedure, let''s take an example from the `Cars93`
    dataset to test out the population mean.


    # One tail test of mean with known variance


    Suppose the researcher claims that the average mileage given by all the cars collected
    in the sample is more than 35. In the sample of 93 cars, it is observed that the
    mean mileage of all cars is 29. Should you accept or reject the researcher''s
    claim?'
