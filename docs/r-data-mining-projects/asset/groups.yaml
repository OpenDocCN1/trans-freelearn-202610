    \ c(y, x[i] - 50)\n  } else {\n    y <- c(y, x[i] + 50)\n  }\n}\nprint(y)\n\n\
    ## Loop concepts – the repeat loop\n\nThe repeat loop is used to iterate a certain\
    \ calculation over a vector or dataframe. There is no provision to check the condition\
    \ to exit the loop; generally a break statement is used to exit the loop. If you\
    \ fail to provide any break condition within the repeat loop, you will end up\
    \ running the repeat loop infinitely. Let's look at the code showing how to write\
    \ a repeat loop. The break condition used in the following code is if x > 2.6:\n\
    \nx <- 100\nrepeat {\n  print(x)\n  x = sqrt(x)+10\n  if (x > 2.6) {\n    break\n\
    \  }\n}\n\nThere are other functions in the apply family of functions, such as:\n\
    - eapply: Apply a function over values in an environment\n- mapply: Apply a function\
    \ to multiple list or vector arguments\n- rapply: Recursively apply a function\
    \ to a list\n\n## String manipulation\n\nString manipulation or character manipulation\
    \ is an important aspect of any data management system. In a typical real-world\
