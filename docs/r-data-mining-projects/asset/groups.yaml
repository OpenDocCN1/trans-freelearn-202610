    > z\n[1] -1.079\n> #计算5%阿尔法水平下的临界值\n> alpha = .05\n> z1 = qnorm(1-alpha/2)\n>\
    \ c(-z1,z1)\n[1] -1.96 1.96\n```\n\n```\n> ifelse(z > z1 | z < -z1,\"拒绝零假设\",\"\
    接受零假设\")\n[1] \"接受零假设\"\n```\n\n- - **连续数据的双样本配对检验：**双样本配对检验中所检验的零假设是，某个处理对受试者没有影响、该治疗方法对受试者没有效果等等。备择假设则是，某个处理、治疗方法或药物对受试者具有统计学上显著的影响。\n\
    \n虽然`Cars93`数据集中没有这样的变量，但我们仍然可以假设不同品牌汽车的最低价格与最高价格之间存在配对关系。\n\n- - **双样本t检验的零假设：**平均价格没有差异。\n\
    - - **备择假设：**平均价格存在差异：\n\n```\n> t.test(Cars93$Min.Price, Cars93$Max.Price, paired\
    \ = T)\n配对t检验\ndata: Cars93$Min.Price and Cars93$Max.Price\nt = -9.6, df = 92,\
    \ p-value = 2e-15\nalternative hypothesis: true difference in means is not equal\
    \ to 0\n95 percent confidence interval:\n-5.765 -3.781\nsample estimates:\nmean\
    \ of the differences\n-4.773\n```\n\np值小于0.05。因此，可以得出结论，平均最低价格与平均最高价格之间的差异在95%置信水平下具有统计学显著性。\n\
