    # 3


    # Visualize Diamond Dataset


    Every data mining project is incomplete without proper data visualization. While
    looking at numbers and statistics it may tell a similar story for the variables
    we are looking at by different cuts, however, when we visually look at the relationship
    between variables and factors it shows a different story altogether. Hence data
    visualization tells you a message, that numbers and statistics fail to do that.
    From a data mining perspective, data visualization has many advantages, which
    can be summarized in three important points:


    +   - Data visualization establishes a robust communication between the data and
    the consumer of the data

    +   - It imprints a long lasting impact as people may fail to remember numbers
    but they do remember charts and shapes

    +   - When data scales up to higher dimension, representation in numbers does
    not make sense, but visually it does


    In this chapter, the reader will get to know the basics of data visualization
    along with how to create advanced data visualization using existing libraries
    in R programming language. Typically, data visualization approach can be addressed
    in two different ways:


    +   - What do you want to display to the audience? Is it comparison, relationship,
    or any other functionality?

    +   - How do you want to display the insights? Which one is the most intuitive
    way of chart or graph to display the insights?


    Based on the preceding two points, let’s have a look at the data visualization
    rules and theories behind each visualization, and then we are going to look at
    the practical aspect of implementing the graphs and charts using R Script.'
