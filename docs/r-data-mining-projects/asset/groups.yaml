    从前面的项集长度分布可以看出，有一笔交易同时购买了 32 种产品。有 3 笔交易同时购买了 29 个物品。同样，我们可以解释数据集中其他项集的频率。通过项目频率图可以更好地理解这一点。要了解数据集中的前三笔交易，可以使用以下命令：


