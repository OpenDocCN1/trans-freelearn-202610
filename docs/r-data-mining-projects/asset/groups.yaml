    # Understanding customer segmentation


    In standard data mining practice, customer segmentation is a way of dividing all
    customers into various subgroups relevant to the business and the business problem.
    That subgroup creation can be done either by using a subjective approach or by
    keeping the business objective in mind. In different industries, customer segmentation
    has different applications; for example, in retail, it is important to know the
    purchase behavior of customers, and different subgroups displaying unique purchase
    behavior is relevant to the business.


    # Why understanding customer segmentation is important


    In the retail and e-commerce industry, offers, campaigns, loyalty programs, and
    discount strategies work based on the purchase behavior of the subgroup of customers.
    In other industries, sales, marketing strategy, and business plans run keeping
    in mind the customer''s behavior, and the behavior drives the sales. That unique
    customer behavior one can be understood by performing segmentation on the data.'
  - '[PAGE 174]


    # How to perform customer segmentation?


    Having discussed various benefits of performing customer segmentation, it is important
    to know how to perform customer segmentation. There are two broad methods used
    to perform customer segmentation:


    +   - Customer segmentation using clustering-based methods

    +   - Customer segmentation using the recency, frequency, and monetary (RFM) model


    In this chapter, we will discuss the clustering-based approach to perform customer
    segmentation; the second method is not in the scope of this chapter.


    # Various clustering methods available


    All clustering algorithms can be classified into four groups, as follows:


    +   - **Hierarchical clustering**: Using this method, a number of clusters are
    prepared from the dataset, forming a hierarchy, and the clusters are then grouped
    using a tree structure so that the entire dataset can be represented as a single
    tree structure. The advantage of this method is that unlike partitioning-based
    clustering, we don''t have to specify the number of clusters to be created from
    the dataset.

    +   - **Partitioning clustering**: In this approach, the dataset is divided into
    a finite group of clusters based on a distance function in such a way that the
    within-cluster similarity is maximum and between-cluster similarity is minimum.
    K-means, which is a popular method in data mining practice, falls under this category.

    +   - **Model-based clustering**: Using the data model, a group of clusters is
    created from the dataset; the methods used in the model-based clustering approach
    can be divided into two groups:

    +     - Maximum likelihood estimation

    +     - Bayesian estimation

    +   - **Other clustering algorithms**: There are other clustering techniques available
    such as fuzzy clustering, bagged clustering, and so on. Fuzzy clustering uses
    a fuzzy logic on the data so that the same data point can be a part of more than
    one cluster. In other words, there is no exclusivity in terms of cluster membership.
    This method is basically different from the other three forms of clustering, where
    a data point belongs to a single cluster. Another algorithm that falls under this
    group is known as self-organizing maps (SOM).'
