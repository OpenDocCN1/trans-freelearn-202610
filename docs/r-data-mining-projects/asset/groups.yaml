    - CurrentAuctionAveragePrice 1 34988 35008

    - Critic.Ratings 1 35025 35045

    - Brush.Size 4 39554 39568

    ```


    The method selected for variable selection is both forward and backward. For example,
    in the first step forward selection was used, then at the same time backward section
    was also applied to check if the said variable could be removed from the model
    or not.


    While applying the stepwise model selection procedure, it is very important to
    keep in mind the limitations of the stepwise method. Sometimes model overfitting
    happens, sometimes when you have a large number of predictors and mostly the predictors
    are highly correlated, then stepwise regression provides higher variability and
    low accuracy. So to address this issue, we can apply penalized regression method,
    which we are going to discuss in the next section:


