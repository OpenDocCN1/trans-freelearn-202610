    increases. This library provides an option for training of neural networks using
    backpropagation, resilient backpropagation with (Riedmiller, 1994) or without
    weight backtracking (Riedmiller and Braun, 1993), or the modified globally convergent
    version by Anastasiadis et al. (2005). The package allows flexible settings through
