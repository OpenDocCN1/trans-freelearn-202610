    \ = c(\"red\",\"blue\"))+\n+ ggtitle(\"Scatterplot: Adding Custom Color\")+\n\
    + theme(plot.title= element_text(size = 12, face = \"bold\"))\n> sp4\n> grid.arrange(sp3,sp4,nrow=1)\n\
    ```\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_107_0.png)\n\n## 堆叠条形图\n\n堆叠条形图只是条形图的另一种变体，可以通过不同的颜色组合绘制两个以上的变量。以下示例代码展示了堆叠条形图的一些变体：\n\
    \n```\n> qplot(factor(Type), data=Cars93, geom=\"bar\", fill=factor(Origin))\n\
    > \n> #or\n> \n> ggplot(Cars93, aes(Type, fill=Origin)) + geom_bar()\n```\n\n\
    ![](img/04e03d5ea18ca2e57a47a14c9ae47ace_108_0.png)\n\n## 茎叶图\n\n茎叶图是定量变量的一种文本表示形式，它会根据数值中最重要的数字位对数据进行分段。例如，Cars93.csv\
    \ 数据集中的城市道路行驶里程变量的茎叶图表示如下：\n\n```\n> stem(Cars93$MPG.city)\nThe decimal point\
    \ is 1 digit(s) to the right of the |\n1 | 55666777777778888888888889999999999\n\
    2 | 0000000011111122222223333333344444\n2 | 5555556688999999\n3 | 01123\n3 | 9\n\
    4 | 2\n4 | 6\n```\n\n要解释茎叶图的结果：如果我们需要知道有多少个观测值大于 30，答案是 8。竖线左侧的数字表示十位，右侧的数字表示个位，因此相应的数值为\
    \ 30、31、31、32、33、39、42 和 46。\n\n## 词云\n\n词云是一种数据可视化方法，适用于表示文本数据。例如，一组文本文件中某些词语频繁出现在多个文档中，词云可以概括这组文档所讨论的主题。因此，词云是对文本非结构化数据的一种可视化总结。词云主要用于表示社交媒体帖子，例如\
    \ Twitter 推文、Facebook 帖子等。在创建词云之前，需要执行各种预处理任务；文本挖掘处理的最终输出将是一个包含词语及其对应频率的数据框：\n\
    \n```\n```r\n#Word cloud representation\nlibrary(wordcloud)\nwords<-c(\"data\"\
    ,\"data mining\",\"analytics\",\"statistics\",\"graphs\",\n\"visualization\",\"\
    predictive analytics\",\"modeling\",\"data science\",\n\"R\",\"Python\",\"Shiny\"\
    ,\"ggplot2\",\"data analytics\")\nfreq<-c(123,234,213,423,142,145,156,176,214,218,213,234,256,324)\n\
    d<-data.frame(words,freq)\nset.seed(1234)\nwordcloud(words = d$words, freq = d$freq,\
    \ min.freq = 1,c(8,.3),\nmax.words=200, random.order=F, rot.per=0.35,\ncolors=brewer.pal(7,\
    \ \"Dark2\"))\n```\n```\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_109_0.png)\n\
    \n## 气泡图\n\n气泡图是一种很好的可视化方法，其中气泡的大小表示数据集中每个变量的权重。下面来看一下示例图：\n\n```\n> #Bubble plot\
    \ using plotly\n> plot_ly(Cars93, x = Length, y = Width, text = paste(\"Type:\
    \ \", Type),\n+ mode = \"markers\", color = Length, size = Length)\n```\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_112_0.png)\n\
    \n将 ggplot2 与 plotly 库结合起来可以实现良好的可视化效果，因为两个库的功能都嵌入在 ggplotly 库中：\n\n```\n> #GGPLOTLY:\
    \ ggplot plus plotly\n> p <- ggplot(data = Cars93, aes(x = Horsepower, y = Price))\
    \ +\n+ geom_point(aes(text = paste(\"Type:\", Type)), size = 2,\ncolor=\"darkorchid4\"\
    ) +\n+ geom_smooth(aes(colour = Origin, fill = Origin)) + facet_wrap(~ Origin)\n\
    > \n> (gg <- ggplotly(p))\n```\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_113_0.png)\n\
    \n## 使用 plotly 绘制条形图\n\n使用 plotly 绘制的条形图看起来比 R 中作为基础功能提供的普通条形图更加智能。下面来看一下示例图：\n\
    \n```\n> p <- plot_ly(\n+ x = Type,\n+ y = Price,\n+ name = \"Price by Type\"\
    ,\n+ type = \"bar\")\n> p\n```\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_113_1.png)\n\
    \n## 使用 plotly 绘制散点图\n\n两个连续变量之间的关系可以使用散点图表示。下面来看一下数据表示：\n\n```\n> # Simple scatterplot\n\
    > library(plotly)\n> plot_ly(data = Cars93, x = Horsepower, y = MPG.highway, mode\
    \ = \"markers\")\n> #Scatter Plot with Qualitative Colorscale\n> plot_ly(data\
    \ = Cars93, x = Horsepower, y = MPG.city, mode = \"markers\",\n+ color = Type)\n\
    ```\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_114_0.png)\n\n## 使用 plotly 绘制箱线图\n\
    \n以下是使用 plotly 库创建一些有趣箱线图的示例：\n\n```\n> #Box Plots\n> library(plotly)\n> ### basic\
    \ boxplot\n> plot_ly(y = MPG.highway, type = \"box\") %>%\n+ add_trace(y = MPG.highway)\n\
    ```\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_116_0.png)\n\n```\n> ### grouped\
    \ box plots\n> plot_ly(Cars93, x = Type, y = MPG.city, color = AirBags, type =\
    \ \"box\")\n%>%\n+ layout(boxmode = \"group\")\n```\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_116_1.png)\n\
    \n## 使用 plotly 绘制极坐标图\n\n使用 plotly 进行极坐标图可视化更加有趣。这是因为将光标悬停在图表上时，数据值会显示出来，从而可以识别模式之间的差异。下面来看一下示例代码：\n\
    \n```\n> #Polar Charts in R\n> library(plotly)\npc <- plot_ly(Cars93, r = Price,\
    \ t = RPM, color = AirBags,\nmode = \"lines\",colors='Set1')\nlayout(pc, title\
    \ = \"Cars Price by RPM\", orientation = -90,\nfont='bold')\n```\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_117_0.png)\n\
    \n## 使用 plotly 绘制极坐标散点图\n\n使用 plotly 库，用户还可以创建一种额外的图表类型，称为极坐标散点图。与二维散点图不同，其中的点以圆形方式绘制：\n\
    \n## 总结\n\n本章介绍了各种类型的图表。我们简要讨论了创建这些图表的语法，也简要讨论了每种图表适用的场景。创建可视化展示来向受众解释洞察和信息是一项技能，需要投入时间，并通过实践逐渐完善。本章只介绍了数据挖掘领域中最重要的数据可视化方法。然而，可供选择的图形和图表非常丰富，可以用于创建富有创新性的演示文稿。因此，本章的核心收获是：读者现在了解了数据可视化规则，以及数据挖掘中用于展示各种变量之间关系的图表和图形类型，并且理解了各种变量的分布。同时，读者还通过对两个重要的数据可视化库\
    \ `ggplot2` 和 `plotly` 进行同步实践，获得了实际操作经验。在下一章中，我们将学习各种回归技术的应用、回归结果的解释，以及回归结果的可视化，从而理解各种变量之间的关系。\n\
    \n"
