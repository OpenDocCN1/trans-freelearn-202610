    The interpretation of scores is little bit tricky because they do not have any
    meaning until and unless you use them to plot on a straight line as defined by
    the eigen vector. PC scores are the co-ordinates of each point with respect to
    the principal axis. Using eigen values you can extract eigen vectors which describe
    a straight line to explain the PCs. The PCA is a form of multidimensional scaling
    as it represents data in a lower dimension without losing much information about
    the variables. The component scores are basically the linear combination of loading
    times the mean centred scaled dataset.


    When we deal with multivariate data, it is really difficult to visualize and build
    models around it. In order to reduce the features, PCA is used; it reduces the
    dimensions so that we can plot, visualize, and predict the future, in a lower
    dimension. The principal components are orthogonal to each other, which means
    that they are uncorrelated. At the data preprocessing stage, the scaling function
    decides what type of input data matrix is required. If the mean centring approach
    is used as transformation then covariance matrix should be used as input data
    for PCA. If a scaling function does a standard z-score transformation, assuming
    standard deviation is equal to 1, then correlation matrix should be used as input
    data.


    Now the question is where to apply which transformation. If the variables are
    highly skewed then z-score transformation and PCA based on correlation should
    be used. If the input data is approximately symmetric then mean centring approach
    and PCA based on covariance should be applied.


