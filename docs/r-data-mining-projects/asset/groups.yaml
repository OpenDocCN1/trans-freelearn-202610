    \nIn the previous correlations graph, the strength of the correlation is reflected\
    \ by the size of the ellipse and the color varying from red to blue. The blue\
    \ ellipses indicate positive correlation and the white ones show no correlation.\
    \ Variable X12 has a high degree of positive correlation with variables X13 to\
    \ X17, with a correlation value of more than 80%.\n\nRow number 1 contains the\
    \ variable description and there are some columns which are categorical; we need\
    \ to remove those from our dataset. Some other variables are shown as categorical\
    \ and hence need to be converted back to numeric mode:\n\n```\n```r\n> df<-default[-1,-c(1,3:5,7:12,25)]\n\
    > func1<-function(x){\n+ as.numeric(x)\n+ }\n> df<-as.data.frame(apply(df,2,func1))\n\
    > normalize=function(x){\n```\n\nPrincipal component (PC) 1 explains 42% variation\
    \ in the dataset and principal component 2 explains 12% variation in the dataset.\
    \ This means that first PC has closeness to 42% of the total data points in the\
    \ n-dimensional space. From the preceding results, it is clear that the first\
    \ 8 principal components capture 91.9% variation in the dataset. Rest 8% variation\
    \ in the dataset is explained by 6 other principal components. Now the question\
    \ is how many principal components should be chosen. The general rule of thumb\
    \ is 80-20, if 80% variation in the data can be explained by 20% of the principal\
