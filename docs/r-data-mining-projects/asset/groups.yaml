    To perform hierarchical clustering, the input data has to be in a distance matrix
    form. The method selected has to be from one of "single", "complete", "average",
    "mcquitty", "ward.D", "ward.D2", "centroid", or "median".


    The hierarchical algorithm follows these steps:


    1. Start with N singleton clusters (nodes) labeled -1, ..., -N, which represent
    the initial set of input points.

    2. Find a pair of nodes / cluster with minimal distance among all pairwise distances
    using a distance function.

    3. Combine the two nodes into a new node and remove the two old nodes. The new
    nodes are labeled consecutively 1, 2, ...

    4. The distances from the new node to all other nodes are determined by the method
    parameter.

    5. Repeat N - 1 times from step 2 until there is one big node that contains all
    original input points.


    If the method chosen to perform hierarchical clustering is ward, then the distance
    measure to be used for clustering is Euclidean. The following code shows how to
    perform agglomerative hierarchical clustering:


    ```r

    > hfit<-hclust(dist(r_df_scaled,method = "euclidean"),method="ward.D2")

    > par(mfrow=c(1,2))

    > plot(hfit,hang=-0.005,cex=0.7)

    > hfit<-hclust(dist(r_df_scaled,method = "manhattan"),method="mcquitty")

    > plot(hfit,hang=-0.005,cex=0.7)

    > hfit<-hclust(dist(r_df_scaled,method = "minkowski"))

    > plot(hfit,hang=-0.005,cex=0.7)

    > hfit<-hclust(dist(r_df_scaled,method = "canberra"))

    > plot(hfit,hang=-0.005,cex=0.7)

    ```


    Here is the first dendrogram graph:


    Complete, average, mcquitty, centroid, median, ward.D, ward.D2. Each method is
    different. Single linkage uses the smallest minimum pairwise distance to merge
    two clusters. Complete linkage uses the similarity between the dissimilar objects
    in two different clusters. Likewise each method has a unique way to compute the
    similarity between different clusters:


    ```r

    > summary(hfit)

    Length Class Mode

    merge 878 -none- numeric

    height 439 -none- numeric

    order 440 -none- numeric

    labels 0 -none- NULL

    method 1 -none- character

    call 3 -none- call

    dist.method 1 -none- character

    ```


    Divisive hierarchical clustering can be performed using the `diana` function from
    the library `cluster`. The syntax is shown as follows:


    ```r

    diana(x, diss = inherits(x, "dist"), metric = "euclidean", stand = FALSE, keep.diss
    = n < 100, keep.data = !diss, trace.lev = 0)

    ```


    To apply the `diana` function, the input data should be in matrix or dataframe
    type. The `diana` function accepts both a distance matrix as well as a dataframe
    as an input. There is a logical flag argument meant to control the input structure
    to the function. The `metric` argument is a character string specifying the metric
    to be used to calculate distance; it has two options, `"euclidean"` and `"manhattan"`.
    Euclidean distances are root sums of squares of differences and manhattan distances
    are the sums of absolute differences, for which the mathematical formula has already
    been explained in this chapter. If `x`, the input dataset, is already a dissimilarity
    matrix, then this `diss` argument will be ignored from execution. The argument
    `stand`, if it takes the value `TRUE`, implies that the raw dataset is used and
    further the distance matrix needs to be created.


    The `diana` function constructs a hierarchy of clusters, as the name suggests,
    starting with one large cluster containing all observations. Clusters are divided
    until each cluster contains only a single observation. At each hierarchy, the
    cluster with the largest diameter based on the distance from the cluster center
    to the outermost data point as measured by the distance function is selected:


    ```r

    dfit<-diana(r_df,diss=F,metric = "euclidean",stand=T,keep.data = F)

    summary(dfit)

    plot(dfit)

    ```


    ## Clustering with *E-commerce* Data


    The `plot` command on divisive clustering provides two graph options, a banner
    indicating the divisive coefficient and a dendrogram displaying the tree structure:


