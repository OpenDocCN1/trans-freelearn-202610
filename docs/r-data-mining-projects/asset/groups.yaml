    \ |\n| 003 | Curd, milk, banana |\n| 004 | Curd, bread, butter |\n| 005 | Milk,\
    \ curd, butter, banana |\n| 006 | Milk, curd, bread |\n\n项目集 X 的支持度，其中 X = {milk,\
    \ banana} = 牛奶和香蕉一起购买的交易比例；4/6 = 0.67，因此 X 项目集的支持度为 0.67。\n\n假设 Y 为 curd；X =>\
    \ Y，即 {milk, banana} => {curd} 的置信度，是 support (X U Y) / support(X) 的比例；三种产品——牛奶、香蕉和酸奶——一起购买\
    \ 2 次。因此规则的置信度 = (2/6)/0.67 = 0.5。这意味着包含牛奶和香蕉的交易中 50% 的规则是正确的。\n\n规则的置信度可以解释为在已购买项目集\
    \ X 的条件下购买 Y 的条件概率。\n\n当我们在交易数据库中创建太多规则时，我们需要一个度量来对规则进行排序；lift 是对规则进行排序的度量。从前述示例中，我们可以计算规则\
    \ $X$ 到 $Y$ 的 lift。Lift of $X \\Rightarrow Y = support\\ of\\ (X \\cup Y) / support\\\
    \ of\\ (X) * support\\ of\\ (Y) = 0.33/0.66*0.66 = 0.33/0.4356 = 0.7575$。\n\n\
