    The `strsplit` function helps in expanding the letters from a string. The `sub`
    command is used to alter a pattern that is not right in the string. The `ignore.case`
    option provides the user the chance to keep case sensitivity on or off while searching
    for the pattern in the defined string.


    ## NA and missing value management


    Missing value treatment is an important task in standard data mining literature.
    In the R programming language, missing values are represented as NA. NAs are not
    string or numeric values; they are considered an indicator for missing values.
    After importing a dataset into the R programming platform, it is important to
    check whether missing values exist for any variable. To check that, the `is.na()`
    command is used. Please see the example given here:


    ```r

    > x <- c(12, 13, 14, 21, 23, 24, NA, 25, NA, 0, NA)

    > is.na(x)

    [1] FALSE FALSE FALSE FALSE FALSE FALSE TRUE FALSE TRUE FALSE TRUE

    > mean(x, na.rm = TRUE)

    [1] 16.5

    > mean(x)

    [1] NA

    ```


    Object `x` is a numeric vector that contains some NA values. To verify that, `is.na()`
    can be used; wherever the condition is satisfied, the result would be TRUE. If
    we compute anything in the presence of NA, we end up getting an error or no result.
    Either we can replace the data set by altering the NA values, or we can remove
    those NA values while performing any computation. As in the preceding script,
    it is `na.rm = T` that is used to remove the NAs from the mean computation for
    object `x`.


    ## Missing value imputation techniques


    To delete missing values from the dataset, `na.omit()` can be used. It removes
    the entire row even if the data is missing for a single variable. There are various
    missing value imputation methods:


    - **Mean imputation**: The missing values in a data vector are replaced by the
    mean or median value of that vector, excluding the NA.

    - **Local average method**: Taking the local average for the missing value by
    taking into account a 3- or 5-period moving average; that is, for a 3-period average,
    the prior and posterior values of the missing data can help decide what the missing
    value should be.

    - **Keeping that separate**: Sometimes the imputation is simply not possible,
    and the client may be interested in keeping the missing values separate to understand
    the missing behavior separately.

    - **Model-based**: There are some model-based missing value imputation techniques,
    such as the regression-based missing value prediction method.

    - **Clustering**: Similar to regression-based prediction for missing value imputation,
    k-means clustering can be used to impute the missing values in the dataset.


    ## Summary


    In light of the preceding discussion, it can be summarized that data manipulation
    and data management are important steps in performing data mining on various live
    projects. Since R provides a better statistical programming platform and visualization,
    the use of R to explain various data mining concepts to the readers makes sense.
    In this chapter, we looked at an introduction to data mining and R with concepts,
    a few programming basics, R data types, and so on. We also covered importing and
    exporting various external file formats using R, sorting and merging concepts,
    and missing data management techniques.


    In the next chapter, we are going to learn more about performing exploratory data
    analysis using R and how to understand univariate, bivariate, and multivariate
    datasets. First of all, we are going to understand the concepts and practical
    interpretation, and then R implementation, to gain knowledge about exploratory
    data analysis.


