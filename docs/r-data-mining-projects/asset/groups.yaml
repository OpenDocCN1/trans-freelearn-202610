    \ table, \"none\" entry denotes the stage which is the final model, where further\
    \ tuning or variable reduction is not possible. Hence, dropping more variables\
    \ after that point would not make sense.\n\n## Logistic regression\n\nThe linear\
    \ regression model based on the ordinary least square method assumes that the\
    \ relationship between the dependent variable and the independent variables is\
    \ linear; however, the logistic regression model assumes the relationship to be\
    \ logarithmic. There are many real-life scenarios where the variable of interest\
    \ is categorical in nature, such as buying a product or not, approving a credit\
    \ card or not, tumor is cancerous or not, and so on. Logistic regression not only\
    \ predicts a dependent variable class but it predicts the probability of a case\
    \ belonging to a level in the dependent variable. The independent variables need\
    \ not be normally distributed and need not have equal variance. Logistic regression\
    \ belongs to the family of generalized linear regression. If the dependent variable\
    \ has two levels then logistic regression can be applied, but if it has more than\
    \ two levels, such as high, medium, and low, then multinomial logistic regression\
    \ model can be applied. All the independent variables can be continuous, categorical,\
    \ or nominal.\n\nThe logistic regression model can be explained using the following\
    \ equation:\n\nln [ P(Y) / (1 - P(Y)) ] = β₀ + β₁X₁ + β₂X₂ + β₃X₃ + ... + βₙXₙ\
    \ + ε ......(6)\n\nLn(P(Y)/(1-P(Y))) is the log odds of the outcome. The beta\
    \ coefficients mentioned in the previous equation explain how the log odds of\
    \ the outcome variable increase or decrease for every one unit increase or decrease\
    \ in the explanatory variable.\n\nLet's take the Artpiece.csv dataset where the\
    \ dependent variable is a good purchase or not need to be predicted based on the\
    \ independent variables.\n\nFor a logistic regression model, the dependent variable\
    \ needs to be a binary variable with two levels. If it is not then the first task\
    \ is to convert the dependent variable to binary. For the independent variables\
    \ it is important to check the type of the variable as well as the levels. If\
    \ some independent variables are categorical then binary conversion (creating\
    \ dummy variables for each category) is required. So here you go with data conversion\
    \ in necessary format for the logistic regression model:\n\n```\n> #data conversion\n\
    > Artpiece$IsGood.Purchase<-as.factor(Artpiece$IsGood.Purchase)\n> Artpiece$Is.It.Online.Sale<-as.factor(Artpiece$Is.It.Online.Sale)\n\
    > #removing NA, Missing values from the data\n> Artpiece<-na.omit(Artpiece)\n\
    > ## 75% of the sample size\n> smp_size <- floor(0.75 * nrow(Artpiece))\n```\n\
    \nright-hand side expression which is the model coefficient:\n\n```\n> # 95% CI\
    \ for exponentiated coefficients\n> exp(confint(model1))\n```\n\nWaiting for profiling\
    \ to be done...\n\n| | 2.5 % | 97.5 % |\n| --- | --- | --- |\n| (Intercept) |\
    \ 0.02301865 | 5.5660594 |\n| Critic.Ratings | 1.12226719 | 1.1725835 |\n| Acq.Cost\
    \ | 0.99998833 | 0.9999957 |\n| CurrentAuctionAveragePrice | 0.99998274 | 0.9999881\
    \ |\n| Brush.Size1 | 0.02326462 | 5.5558138 |\n| Brush.Size2 | 0.01714345 | 4.0948557\
    \ |\n| Brush.Size3 | 0.02953703 | 7.1850301 |\n| Brush.SizeNULL | 0.45631813 |\
    \ 109.1655370 |\n| CollectorsAverageprice | 0.99996666 | 0.9999850 |\n| Is.It.Online.Sale1\
    \ | 0.69545357 | 1.0142229 |\n| Min.Guarantee.Cost | 1.00000327 | 1.0000163 |\n\
    \n```\n> confint(model1)\n```\n\n| | 2.5 % | 97.5 % |\n| --- | --- | --- |\n|\
    \ (Intercept) | -3.771450e+00 | 1.716687e+00 |\n| Critic.Ratings | 1.153509e-01\
    \ | 1.592094e-01 |\n| Acq.Cost | -1.166650e-05 | -4.348562e-06 |\n| CurrentAuctionAveragePrice\
    \ | -1.726348e-05 | -1.193180e-05 |\n| Brush.Size1 | -3.760822e+00 | 1.714845e+00\
    \ |\n| Brush.Size2 | -4.066139e+00 | 1.409731e+00 |\n| Brush.Size3 | -3.522110e+00\
    \ | 1.972000e+00 |\n| Brush.SizeNULL | -7.845651e-01 | 4.692865e+00 |\n| CollectorsAverageprice\
    \ | -3.333576e-05 | -1.500118e-05 |\n| Is.It.Online.Sale1 | -3.631910e-01 | 1.412267e-02\
    \ |\n| Min.Guarantee.Cost | 3.268054e-06 | 1.631710e-05 |\n\nANOVA can be performed\
    \ on the results of the logistic regression model using chi-square test statistics.\
    \ From the ANOVA which shows analysis of deviance in case of a logistic regression\
    \ here, we can conclude that the deviance of model change is statistically significant\
    \ when we include more independent variables in the model. The independent variables\
    \ are added sequentially to the model and at every iteration the deviance of the\
    \ error term is compared with the previous iteration to see if the addition or\
    \ deletion of any variable is useful in reducing the error for the model:\n\n\
    ```\n> #ANOVA\n> anova(model1,test=\"Chisq\")\n```\n\nAnalysis of Deviance Table\n\
    Model: binomial, link: logit\nResponse: IsGood.Purchase\nTerms added sequentially\
    \ (first to last)\n\n| Df | Deviance | Resid. Df | Resid. Dev | Pr(>Chi) |\n|\
    \ --- | --- | --- | --- | --- |\n| NULL |  | 54500 | 40601 |  |\n\n- **Backward\
    \ selection method**: All the independent variables are part of the initial model.\
    \ Using Wald chi-square test of significance, variables with lowest value of chi-square\
    \ or highest p-value such that it exceeds 0.05 (given that 95% confidence interval\
    \ is used in the model) are removed from the model. The backward selection process\
    \ of variable removal stops when it is not possible to find a variable that fits\
    \ the Wald test criteria.\n- **Forward selection method**: Model starts with a\
    \ null model. A variable is entered into the model based on the lowest p-value\
    \ or highest chi-square test statistic value. The process stops when there are\
    \ no such cases found.\n- **Both**: The third approach is to apply both backward\
    \ selection and forward selection:\n\n```\n> #auto detection of model\n> fit_step<-stepAIC(model1,method=\"\
    both\")\n```\n\nStart: AIC=34893.93  \nIsGood.Purchase ~ Critic.Ratings + Acq.Cost\
    \ + CurrentAuctionAveragePrice +\nBrush.Size + CollectorsAverageprice + Is.It.Online.Sale\
    \ +\nMin.Guarantee.Cost\n\n| Variable | Df | Deviance | AIC |\n| --- | --- | ---\
    \ | --- |\n| <none> |  | 34872 | 34894 |\n| - Is.It.Online.Sale | 1 | 34875 |\
    \ 34895 |\n| - Min.Guarantee.Cost | 1 | 34880 | 34900 |\n| - Acq.Cost | 1 | 34890\
    \ | 34910 |\n| - CollectorsAverageprice | 1 | 34898 | 34918 |\n| - CurrentAuctionAveragePrice\
    \ | 1 | 34988 | 35008 |\n| - Critic.Ratings | 1 | 35025 | 35045 |\n| - Brush.Size\
    \ | 4 | 39554 | 39568 |\n\nThe method selected for variable selection is both\
    \ forward and backward. For example, in the first step forward selection was used,\
    \ then at the same time backward section was also applied to check if the said\
    \ variable could be removed from the model or not.\n\nWhile applying the stepwise\
    \ model selection procedure, it is very important to keep in mind the limitations\
    \ of the stepwise method. Sometimes model overfitting happens, sometimes when\
    \ you have a large number of predictors and mostly the predictors are highly correlated,\
    \ then stepwise regression provides higher variability and low accuracy. So to\
    \ address this issue, we can apply penalized regression method, which we are going\
    \ to discuss in the next section:\n\n```\n> summary(fit_step)\nCall:\nglm(formula\
    \ = IsGood.Purchase ~ Critic.Ratings + Acq.Cost +\nCurrentAuctionAveragePrice\
    \ +\nBrush.Size + CollectorsAverageprice + Is.It.Online.Sale +\n```\n"
