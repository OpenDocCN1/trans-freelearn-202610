    ## Non-parametric methods


    When a training dataset does not conform to any specific probability distribution
    because of non-adherence to the assumptions of that specific probability distribution,
    the only option left to analyze the data is via non-parametric methods. Non-parametric
    methods do not follow any assumption regarding the probability distribution. Using
    non-parametric methods, one can draw inferences and perform hypothesis testing
    without adhering to any assumptions. Now let''s look at a set of non-parametric
    tests that can be used when a dataset does not conform to the assumptions of any
    specific probability distribution.


    ### Wilcoxon signed-rank test


    If the assumption of normality is violated, then it is required to apply non-parametric
    methods in order to answer a question such as: is there any difference in the
    mean mileage within the city between automatic and manual transmission type cars?


    ```

    > wilcox.test(Cars93$MPG.city~Cars93$Man.trans.avail, correct = F)

    Wilcoxon rank sum test

    data: Cars93$MPG.city by Cars93$Man.trans.avail

    W = 380, p-value = 1e-06

    ```


    alternative hypothesis: true location shift is not equal to 0


    The argument paired can be used if the two samples happen to be matching pairs
    and the samples do not follow the assumptions of normality:


    ```

    > wilcox.test(Cars93$MPG.city, Cars93$MPG.highway, paired = T)

    Wilcoxon signed rank test with continuity correction

    data: Cars93$MPG.city and Cars93$MPG.highway

    V = 0, p-value <2e-16

    alternative hypothesis: true location shift is not equal to 0

    ```


    ### Mann-Whitney-Wilcoxon test


    If two samples are not matched, are independent, and do not follow a normal distribution,
    then it is required to use Mann-Whitney-Wilcoxon test to test the hypothesis that
    the mean difference in the two samples are statistically significantly different
    from each other:


    ```

    > wilcox.test(Cars93$MPG.city~Cars93$Man.trans.avail, data=Cars93)

    Wilcoxon rank sum test with continuity correction

    data: Cars93$MPG.city by Cars93$Man.trans.avail

    W = 380, p-value = 1e-06

    alternative hypothesis: true location shift is not equal to 0

    ```


    ### Kruskal-Wallis test


    To compare means of more than two groups, that is, the non-parametric side of
    ANOVA analysis, we can use the Kruskal-Wallis test. It is also known as a distribution-free
    statistical test:


    ```

    > kruskal.test(Cars93$MPG.city~Cars93$Cylinders, data= Cars93)

    Kruskal-Wallis rank sum test

    data: Cars93$MPG.city by Cars93$Cylinders

    Kruskal-Wallis chi-squared = 68, df = 5, p-value = 3e-13

    ```


    ## 3


    ## Visualize Diamond Dataset


    Every data mining project is incomplete without proper data visualization. While
    looking at numbers and statistics it may tell a similar story for the variables
    we are looking at by different cuts, however, when we visually look at the relationship
    between variables and factors it shows a different story altogether. Hence data
    visualization tells you a message, that numbers and statistics fail to do that.
    From a data mining perspective, data visualization has many advantages, which
    can be summarized in three important points:


    - Data visualization establishes a robust communication between the data and the
    consumer of the data

    - It imprints a long lasting impact as people may fail to remember numbers but
    they do remember charts and shapes

    - When data scales up to higher dimension, representation in numbers does not
    make sense, but visually it does


    In this chapter, the reader will get to know the basics of data visualization
    along with how to create advanced data visualization using existing libraries
    in R programming language. Typically, data visualization approach can be addressed
    in two different ways:


    - What do you want to display to the audience? Is it comparison, relationship,
    or any other functionality?

    - How do you want to display the insights? Which one is the most intuitive way
    of chart or graph to display the insights?


    Based on the preceding two points, let’s have a look at the data visualization
    rules and theories behind each visualization, and then we are going to look at
    the practical aspect of implementing the graphs and charts using R Script.


    ## Visualize Diamond Dataset


    In the light of the previously mentioned ten points, the data visualization rules
    can be created to select the best representation depending on what you want to
    represent:


    - Relationship between two variables can be represented using a scatterplot

    - Relationship between more than two variables can be represented using a bubble
    chart

    - For understanding the distribution of a single variable with few sample size,
    histogram is used

    - For understanding the distribution of a single variable with large sample size,
    density plot is used

    - Distribution of two variables can be represented using scatterplot

    - For representation of distribution between 3 variables, 3D scatterplot is used

    - Any variable with a time stamp, such as day, week, month, year, and so on, can
    be represented using line chart

    - Time should always be on the horizontal axis and the metric to be measured should
    always be on the vertical axis

    - Each graph should have a name and label so that the user does not have to go
    back to the data to understand what it is


    In this chapter, we will primarily focus on the `ggplot2` library and `plotly`
    library. Of course we will cover a few more interesting libraries to create data
    visualization. The graphics packages in R can be organized as per the following
    sequences:


    - Plotting

    - Graphic applications (such as effect ordering, large datasets and trees, and
    graphs)

    - Graphics systems

    - Devices

    - Colors

    - Interactive graphics

    - Development


    A detailed explanation of the various libraries supporting the previous functionalities
    can be found in the link `https://cran.r-project.org/web/views/Graphics.html`.
    For good visual object, we need more data points so that the density of the graphs
    can be more. In this context, we will be using two datasets, `diamonds.csv` and
    `cars93.csv`, to show data visualization.

