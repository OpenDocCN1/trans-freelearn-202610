    Small 0 3 11\nSporty 1 3 2\nVan 0 1 3\n```\n\n用于检验所有因子独立性的 summary 命令可用于检验原假设：\n\
    \n```\n> summary(contTable)\nNumber of cases in table: 93\nNumber of factors:\
    \ 3\nTest for independence of all factors:\nChisq = 65, df = 27, p-value = 5e-05\n\
    Chi-squared approximation may be incorrect\n```\n\n除了前面讨论的图形方法之外，还有一些数值统计检验可用于判断变量是否服从正态分布。有一个名为\
    \ norm.test 的库用于执行数据正态性检验，下面列出了该库中一些有助于评估数据正态性的函数：\n\n| ajb.norm.test | 调整后的 Jarque-Bera\
    \ 正态性检验 |\n| frosini.norm.test | Frosini 正态性检验 |\n| geary.norm.test | Geary 正态性检验\
    \ |\n| hegazy1.norm.test | Hegazy-Green 正态性检验 |\n| hegazy2.norm.test | Hegazy-Green\
    \ 正态性检验 |\n| jb.norm.test | Jarque-Bera 正态性检验 |\n| kurtosis.norm.test | 峰度正态性检验\
    \ |\n| skewness.norm.test | 偏度正态性检验 |\n| spiegelhalter.norm.test | Spiegelhalter\
