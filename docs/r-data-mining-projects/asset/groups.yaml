  - '[PAGE 152]


    # 5


    # Market Basket Analysis with

    Groceries Data


    Think about a scenario from a retailer or e-commerce store manager when it comes
    to recommending the right products to customers. Product recommendation is one
    important domain in data mining practice. Product recommendation can happen in
    three different ways: by associating customer’s behavior with their purchase history,
    by associating items that are being purchased on each visit, and lastly by looking
    at the gross sales in each category and then using the retailer’s past experience.
    In this chapter, we will be looking at the second method of product recommendation,
    popularly known as Market Basket Analysis (MBA) also known as association rules,
    which is by associating items purchased at transaction level and finding out the
    sub-segments of users having similar products and hence, recommending the products.


    In this chapter, we will cover the following topics:


    +   - What is MBA

    +   - Where to apply MBA

    +   - Assumptions/prerequisites

    +   - Modeling techniques

    +   - Limitations

    +   - Practical project'
