    For the same dataset, we can predict the cluster membership, and the actual cluster
    membership versus the predicted cluster membership can be represented in the following
    table:


    ```

    > #predicting cluster membership

    > Cluster$Predicted<-predict.kmeans(km,r_df_scaled)

    > table(Cluster$Membership,Cluster$Predicted)

    1 2 3 4

