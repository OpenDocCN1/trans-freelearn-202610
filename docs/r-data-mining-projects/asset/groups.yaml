    \ \"561\" \"586\" \"590\" \"899\" \"1200\" \"1598\" \"1719\"\n\nThe preceding\
    \ code explains: select those observations from the audit dataset where the gender\
    \ is female and the age is more than 65 years. Which command is used to select\
