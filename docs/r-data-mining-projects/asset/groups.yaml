  - "[PAGE 32]\n\nbeginning of the data set as NA. LAST is FALSE. By keeping NAs separate\
    \ from the order function, data sanity can be maintained.\n\nThe merge function\
    \ helps in combining two data frames. To combine two data frames, at least one\
    \ column name should be identical. The two data frames can also be joined by using\
    \ a function called column bind. To display the difference between the column\
    \ bind and merge functions, we have taken audit.csv dataset. There are two small\
    \ datasets, A and B, prepared out of the audit dataset:\n\n```\n> A<-audit[,c(1,2,3,7,9)]\n\
    > names(A)\n[1] \"ID\"      \"Age\"     \"Employment\" \"Income\"   \"Deductions\"\
    \n> B<-audit[,c(1,3,4,5,6)]\n> names(B)\n[1] \"ID\"        \"Employment\" \"Education\"\
    \  \"Marital\"    \"Occupation\"\n```\n\nTwo columns, ID and Employment, are common\
    \ in both datasets A and B, which can be used as a primary key for merging two\
    \ data frames. Using the merge command, the common columns are taken once in the\
    \ result dataset from the merge function. The merged data frame contains all the\
    \ rows that have complete entries in both the data frames:\n\n```\n> head(merge(A,B),3)\n\
    \          ID Employment Age Income Deductions Education Marital Occupation\n\
    1 1004641 Private    38 81838.0          0 College Unmarried Service\n2 1010229\
    \ Private    35 72099.0          0 Associate Absent Transport\n3 1024587 Private\
    \    32 154676.7         0 HSgrad Divorced Clerical\n```\n\nThe merge function\
    \ allows four different ways of combining data: natural join, full outer join,\
    \ left outer join, and right outer join. Apart from these joins, two data frames\
    \ can also be merged using any specific column or multiple columns. Natural join\
    \ helps to keep only rows that match from the data frames, which can be specified\
    \ by the all=F argument:\n\n```\n> head(merge(A,B, all=F),3)\n          ID Employment\
    \ Age Income Deductions Education Marital Occupation\n1 1044221 Private    60\
    \ 7568.23          0 College Married Executive\n2 1047095 Private    74 33144.40\
    \         0 HSgrad Married Service\n3 1047698 Private    43 43391.17         0\
    \ Bachelor Married Executive\n```"
  - "[PAGE 33]\n\nFull outer join allows us to keep all rows from both data frames,\
    \ and this can be specified by the `all=T` command. This performs the complete\
    \ merge and fills the columns with NA values where there is no matching data in\
    \ both the data frames. The default setting of the `merge` function drops all\
    \ unmatched cases from both the data frames; to keep all the cases in new data\
    \ frame, we need to specify `all=T`:\n\n```\n> head(merge(A,B, all=T),3)\n   \
    \        ID Employment Age  Income Deductions Education Marital\nOccupation\n\
    \  1 1004641   Private  38  81838.0          0      <NA>      <NA>\n<NA>\n  2\
    \ 1010229   Private  35  72099.0          0      <NA>      <NA>\n<NA>\n  3 1024587\
    \   Private  32 154676.7          0      <NA>      <NA>\n<NA>\n```\n\nLeft outer\
    \ join allows us to include all the rows of data frame one (A) and only those\
    \ from data frame two (B) that match; to perform this, we need to specify `all.x=T`:\n\
    \n```\n> head(merge(A,B, all.x = T),3)\n           ID Employment Age  Income Deductions\
    \ Education Marital\nOccupation\n  1 1004641   Private  38  81838.0          0\
    \      <NA>      <NA>\n<NA>\n  2 1010229   Private  35  72099.0          0   \
    \   <NA>      <NA>\n<NA>\n  3 1024587   Private  32 154676.7          0      <NA>\
    \      <NA>\n<NA>\n```\n\nRight outer join allows us to include all the rows of\
    \ data frame B and only those from A that match; specify `all.y=T`:\n\n```\n>\
    \ head(merge(A,B, all.y = T),3)\n           ID Employment Age  Income Deductions\
    \ Education Marital\nOccupation\n  1 1044221   Private  60  7568.23          0\
    \   College   Married\nExecutive\n  2 1047095   Private  74 33144.40         \
    \ 0    HSgrad   Married\nService\n  3 1047698   Private  43 43391.17         \
    \ 0  Bachelor   Married\nExecutive\n```\n\nIn data frames A and B, two columns\
    \ are common; they are `ID` and `Employment`. Using the `merge` command, if we\
    \ select by one common variable, the other common variable would appear on the\
    \ result data frame. If we select multiple data frames as the criteria to merge,\
    \ then all duplicate columns from the resulting data frame will disappear:"
