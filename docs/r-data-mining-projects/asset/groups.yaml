    \ of transactions involving X / total number of transactions\n\n- **Confidence**：Confidence\
    \ 总是指规则的置信度。它可以定义为 x => y 的置信度。因此，support (x U y) 表示数据库中同时包含项目集 x 和项目 y 的交易数量：\n\
    \  \n  Confidence of X => Y = support of (X U Y) / support of (X)\n- **Lift**：Lift\
    \ 可以定义为观察到的支持与期望支持的比例：\n  \n  Lift of a rule X => Y = support of (X U Y) / support\
    \ of (X) * support of (Y)\n\n如果关联规则满足最小支持度和最小置信度标准，则该规则在交易数据库中得到支持。\n\n让我们举一个例子来理解这些概念。\n\
    \n以下是一个来自 R 中 arules 库的 Groceries.csv 数据集的示例：\n\n| Transaction ID | Items |\n\
