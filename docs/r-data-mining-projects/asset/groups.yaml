    # Stem and leaf plot


    A stem and leaf plot is a textual representation of a quantitative variable that
    segments the values to their most significant numeric digits. For example, the
    stem and leaf plot for the mileage within the city variable from the Cars93.csv
    dataset is represented as follows:


    ```

    > stem(Cars93$MPG.city)

    The decimal point is 1 digit(s) to the right of the |

    1 | 55666777777778888888888889999999999

    2 | 0000000011111122222223333333344444

    2 | 5555556688999999

    3 | 01123

    3 | 9

    4 | 2

    4 | 6

    ```'
