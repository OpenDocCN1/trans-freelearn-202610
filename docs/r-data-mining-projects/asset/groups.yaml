  - '[PAGE 53]


    # Multivariate analysis


    The multivariate relationship is a statistical way of looking at multiple dependent
    and independent variables and their relationships. In this chapter, we will briefly
    talk about multivariate relationships between more than two variables, but we
    will discuss the details of multivariate analysis in our subsequent chapters.
    Multivariate relationships between various variables can be known by using the
    correlation method as well as cross tabulation:


    ```

    > pairs(n_cars93,main="Correlation Plot", col="blue")

    ```


    ![](img/04e03d5ea18ca2e57a47a14c9ae47ace_53_0.png)'
  - '[PAGE 54]


    <!-- no content -->'
  - '[PAGE 55]


    ![](img/04e03d5ea18ca2e57a47a14c9ae47ace_55_0.png)


    From the preceding image, we can conclude that the price variable is positively
    skewed because of the presence of some outlier values on the right-hand side of
    the distribution. The mean of the price variable is inflated and greater than
    the mode because the mean is subject to extreme fluctuations.


    Now let''s try to understand a case where normal distribution can be used to answer
    any hypothesis.


    Suppose the variable mileage per gallon on a highway is normally distributed with
    a mean of 29.08 and a standard deviation of 5.33. What is the probability that
    a new car would provide a mileage of 35?


    ```

    > pnorm(35,mean(Cars93$MPG.highway),sd(Cars93$MPG.highway),lower.tail = F)

    [1] 0.1336708

    ```


    Hence the required probability that a new car would provide a mileage of 35 is
    13.36%, since the expected mean is higher than the actual mean; the lower tail
    is equivalent to false.'
  - '[PAGE 56]


    # Binomial probability distribution


    Binomial distribution is known as discrete probability distribution. It describes
    the outcome of an experiment. Each trial is assumed to have only two outcomes:
    either success or failure, either yes or no. For instance, in the Cars93 dataset
    variable, whether manual transmission is available or not is represented as yes
    or no.


    Let''s take an example to explain where binomial distribution can be used. The
    probability of a defective car given a specific component is not functioning is
    0.1%. You have 93 cars manufactured. What is the probability that at least 1 defective
    car can be detected from the current lot of 93:


    ```

    > pbinom(1,93,prob = 0.1)

    [1] 0.0006293772

    ```


    So the required probability that a defective car can get identified in a lot of
    93 cars is 0.0006, which is very less, given the condition that the probability
    of a defective part is 0.10.


    # Poisson probability distribution


    Poisson distribution is for count data where, given the data and information about
    an event, you can predict the probability of any number occurring within that
    limit using the Poisson probability distribution.


    Let''s take an example. Suppose 200 customers on an average visit a particular
    e-commerce website portal every minute. Then find the probability of having 250
    customers visit the same website in a minute:


    ```

    > ppois(250,200,lower.tail = F)

    [1] 0.0002846214

    ```


    Hence, the required probability is 0.0002, which is very rare. Apart from the
    aforementioned common probability distributions, which are used very frequently,
    there are many other distributions that can be used in rare situations.'
