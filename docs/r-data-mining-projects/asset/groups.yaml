    existing databases and analyzing results for consumption by business users. Analyzing
    data from various sources and summarizing it into meaningful information and insights
    is that part of statistical knowledge discovery that helps not only business users
    but also multiple communities such as statistical analysts, consultants, and data
    scientists. Most of the time, the knowledge discovery process from databases is
