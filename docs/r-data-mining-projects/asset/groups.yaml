    \ the other dimension decreases. If the covariance value is zero, it shows that\
    \ the two dimensions are independent of each other and there is no relationship.\n\
    \n- 4. Calculate the eigen vectors and eigen values from the covariance matrix.\
    \ All eigen vectors always come from a square matrix but all square matrix do\
    \ not always generate an eigen vector. All eigen vectors of a matrix are orthogonal\
    \ to each other.\n- 5. Create a feature vector by taking eigen values in order\
    \ from largest to smallest. The eigen vector with highest eigen value is the principal\
    \ component of the dataset. From the covariance matrix, the eigen vectors are\
    \ identified and the eigen values are ordered from largest to smallest:\n- 6.\
    \ Create low dimension data using the transposed version of the feature vector\
    \ and transposed version of the normalized data. In order to get the transposed\
    \ dataset, we are going to multiply the transposed feature vector and transposed\
    \ normalized data.\n\n```\nFeature Vector = (Eigen1, Eigen2.....Eigen 14)\n```\n\
    \nLet's apply these steps in the following section.\n\n## Practical project around\
    \ dimensionality reduction\n\nWe are going to apply dimensionality reduction procedure,\
    \ both model-based approach and principal component-based approach, on the dataset\
    \ to come up with less number of features so that we can use those features for\
    \ classification of the customers into defaulters and no-defaulters.\n\n## Dimensionality\
    \ Reduction\n\nFor practical project, we have considered a dataset default of\
    \ credit card `clients.csv`, which contains 30,000 samples and 24 attributes or\
    \ dimensions. We are going to apply two different methods of feature reduction:\
    \ the traditional way and the modern machine learning way.\n\n## Attribute description\n\
    \nThe following are descriptions for the attributes from the dataset:\n\n- **X1:**\
    \ Amount of the given credit (NT dollar). It includes both the individual consumer\
    \ credit and his/her family (supplementary) credit.\n- **X2:** Gender (`1 = male;\
    \ 2 = female`).\n- **X3:** Education (`1 = graduate school; 2 = university; 3\
    \ = high school; 4 = others`).\n- **X4:** Marital status (`1 = married; 2 = single;\
    \ 3 = others`).\n- **X5:** Age (year).\n- **X6–X11:** History of past payment.\
    \ We tracked the past monthly payment records (from April to September, 2005)\
    \ as follows:\n  - X6 = the repayment status in September, 2005\n  - X7 = the\
    \ repayment status in August, 2005; . . .\n  - X11 = the repayment status in April,\
    \ 2005. The measurement scale for the repayment status is: -1 = pay duly; 1 =\
    \ payment delay for one month; 2 = payment delay for two months; . . .; 8 = payment\
    \ delay for eight months; 9 = payment delay for nine months, and so on.\n- **X12–X17:**\
    \ Amount of bill statement (NT dollar).\n  - X12 = amount of bill statement in\
    \ September, 2005;\n  - X13 = amount of bill statement in August, 2005; . . .\n\
    \  - X17 = amount of bill statement in April, 2005.\n- **X18–X23:** Amount of\
    \ previous payment (NT dollar).\n  - X18 = amount paid in September, 2005;\n \
    \ - X19 = amount paid in August, 2005; . . .\n  - X23 = amount paid in April,\
    \ 2005.\n\n## Dimensionality Reduction\n\nLet's get the dataset and do the necessary\
    \ normalization and transformation:\n\n```\n```r\n> setwd(\"select the working\
    \ directory\")\n> default<-read.csv(\"default.csv\")\ncorrplot::corrplot(cor(df),method=\"\
    ellipse\")\n```\n```\n\nFrom the preceding correlations matrix, it is clear that\
