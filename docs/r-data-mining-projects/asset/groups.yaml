    > gg\n> #changing the size of the symbols used in legend\n> gg<-gg+guides(colour\
    \ = guide_legend(override.aes = list(size=4)))\n> gg\n> #changing the size of\
    \ the symbols used in legend\n> gg<-gg+guides(colour = guide_legend(override.aes\
    \ = list(size=4)))\n> gg\n```\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_87_0.png)\n\
    \nAnother important aspect of data visualization is how to display multi-dimensional\
    \ cuts in a plot. For example, in the diamonds dataset, we are currently looking\
    \ at the relationship between the price of the diamond and the carat it contains.\
    \ There are three more variables: cut, color, and clarity. It makes sense to understand\
    \ if the relationship is consistent across those three variables. That means,\
    \ understanding if we can plot the relationship between the carat and the price\
    \ of the diamond by different cut, different color, and different clarity categories.\
    \ Let's look at the distribution of the three categorical variables:\n\n```r\n\
    > table(diamonds$cut);table(diamonds$clarity);table(diamonds$color)\nFair Good\
    \ Very Good Premium Ideal\n1610 4906 12082 13791 21551\nI1 SI2 SI1 VS2 VS1 VVS2\
    \ VVS1 IF\n741 9194 13065 12258 8171 5066 3655 1790\nD E F G H I J\n6775 9797\
    \ 9542 11292 8304 5422 2808\n> #adding a multi-variable cut to the graph\n> gg<-gg+facet_wrap(~cut,\
    \ nrow=4)\n> gg\n```\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_88_0.png)\n\n\
    In the preceding graph, the `cut` variable is used to show the relationship between\
    \ the carat and the price. The number of rows selected is four, to represent the\
    \ graphs in a clear manner. If we add one more variable to the `cut` variable,\
    \ that is `clarity`, the graph would be more intuitive and insightful:\n\n```r\n\
    > #adding two variables as cut to display the relationship\n> gg<-gg+facet_wrap(~cut+clarity,\
    \ nrow=4)\n> gg\n```\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_90_0.png)\n\n\
    Using the `facet_grid()` option, we can display the bi-variate relationship between\
    \ two categorical variables using the ggplot2 library:\n\n```r\n> #bi-variate\
    \ plotting using ggplot2\n> gg<-gg+facet_grid(color~cut)\n> gg\n```\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_91_0.png)\n\
    \nThere are certain external graphical themes which can be imported to the ggplot2\
    \ function for visualization, such as `library(ggthemes)`. Tableau, which is a\
    \ tool known for data visualization, its color, and themes, can also be used along\
    \ with ggplots:\n\n```r\n> #Changing discrete category colors\n> ggplot(diamonds,\
    \ aes(price, carat, color=factor(cut)))+\n+ geom_point() +\n+ scale_color_brewer(palette=\"\
    Set1\")\n> #Using tableau colors\n> library(ggthemes)\n> ggplot(diamonds, aes(price,\
    \ carat, color=factor(cut)))+\n+ geom_point() +\n+ scale_color_tableau()\n```\n\
    \n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_92_0.png)\n\nPlots created can be slightly\
