    turkey 0.8134215

    pork 5.7651246

    ```


    在事务数据集中，有两个重要参数决定频繁项集：支持度和置信度。支持度越高，数据集中的规则数量就越少，并且您可能会错过各个变量之间有趣的关系，反之亦然。有时即使具有较高的支持度、置信度和提升度值，也不能保证获得有用的规则。因此，在实践中，用户可以尝试不同水平的支持度和置信度，以获得有意义的规则。即使最小支持度和最小置信度水平足够高，规则也似乎相当琐碎。


