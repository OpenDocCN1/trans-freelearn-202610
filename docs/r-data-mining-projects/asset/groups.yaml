    dendrogram tree structure into a finite group of clusters so that the results
    from various clustering methods can be compared. The following function is used
    to cut the tree structure:


    ```r

    > #cutting the tree into groups

    > g_hfit<-cutree(hfit,k=4)

    > plot(hfit)

    > table(g_hfit)

    g_hfit

    1 2 3 4

    77 163 119 81

    > rect.hclust(hfit,k=4,border = "blue")

    ```


    This graph shows the tree structure:


    ![](img/04e03d5ea18ca2e57a47a14c9ae47ace_188_0.png)


    ## Model-based clustering


    There is a library in R known as `mclust` that provides Gaussian finite mixture
    models fitted via EM algorithm for model-based clustering, including Bayesian
    regularization. In this section, we discuss the syntax for `Mclust` and the outcome,
    and the rest of the results can be analyzed using profiling information. The model-based
    approach applies a set of data models, the maximum likelihood estimation method,
    and Bayes criteria to identify the cluster, and the `Mclust` function estimates
    the parameters through the expectation maximization algorithm.


    The `Mclust` package provides various data models based on three parameters: *E*,
    *V*, and *I*. The model identifiers use the three letters *E*, *V*, and *I* to
    code geometric characteristics such as volume, shape, and orientation of the cluster.
    *E* means equal, *I* implies identity matrix in specifying the shape, and *V*
    implies varying variance. Keeping in mind these three letters, there is a set
    of models that is by default run using the `mclust` library, and those models
    can be classified into three groups such as spherical, diagonal and ellipsoidal.
    The details are given in the following table:


    | Model code | Description |

    | --- | --- |

    | EII | Spherical, equal volume |

    | VII | Spherical, unequal volume |

    | EEI | Diagonal, equal volume and shape |

    | VEI | Diagonal, varying volume, equal shape |

    | EVI | Diagonal, equal volume, varying shape |

    | VVI | Diagonal, varying volume and shape |

    | EEE | Ellipsoidal, equal volume, shape, and orientation |

    | EEV | Ellipsoidal, equal volume and shape |

    | VEV | Ellipsoidal, equal shape |

    | VVV | Ellipsoidal, varying volume, shape, and orientation |


    Table 2: Model description using finite mixture approach


    Now let''s use the `Mclust` method of doing clustering and grouping of observations
    based on the *E*, *V*, and *I* parameters:


    ```r

    > clus <- Mclust(x_df[, -c(1,2)])

    > summary(clus)

    ------------------------------------------------------------

    Gaussian finite mixture model fitted by EM algorithm

    ------------------------------------------------------------

    Mclust VEI (diagonal, equal shape) model with 9 components:

    log.likelihood n df BIC ICL

    -23843.48 440 76 -48149.56 -48223.43

    Clustering table:

    1 2 3 4 5 6 7 8 9

    165 21 40 44 15 49 27 41 38

    ```


    From the preceding summary, there are nine clusters created using the VEI model
    specification and the BIC is lowest for this model. Let''s also plot all other
    model specifications using a plot:


    ![](img/04e03d5ea18ca2e57a47a14c9ae47ace_190_0.png)


    From the preceding graph, it is clear that the VEI model specification is the
    best. Using the following code, we can print the cluster membership as well as
    the number of rows in each of the clusters:


    ```r

    # The clustering vector:

    clus_vec <- clus$classification

    clus_vec

    clust <- lapply(1:3, function(nc) row.names(r_df)[clus_vec==nc])

    clust # printing the clusters

    ```


    Using the summary command with `parameters = TRUE`, mean, variance and probability
    for each variable we can compute:


    ```r

    summary(clus, parameters = T)

    ```


    ## Other cluster algorithms


    **Self-organizing map (SOM)** is another approach to clustering; it uses the visual
    method of representing data. SOM is basically used to derive unique nodes. SOM
    creates a network structure where the data objects would be connected by nodes
    and edges. Using those nodes, the similarity between different objects can be
    drawn to create clustering solutions. The `kohonen` library contains the `som`
    function:


    ```r

    > library(kohonen)

    > som_grid <- somgrid(xdim = 20, ydim=20, topo="hexagonal")

    > som_model <- som(r_df_scaled,

    + grid=som_grid,

    + rlen=100,

    + alpha=c(0.05,0.01),

    + keep.data = TRUE,

    + n.hood="circular")

    > plot(som_model, type="changes",col="blue")

    ```


    ![](img/04e03d5ea18ca2e57a47a14c9ae47ace_191_0.png)


    The preceding graph explains how the mean distance to the closest unit changes
    with increase in the iteration level:


    ```r

    > plot(som_model, type="count")

    ```

