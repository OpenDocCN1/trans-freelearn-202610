    `strsplit` 函数有助于从字符串中展开字母。`sub` 命令用于更改字符串中不正确的模式。`ignore.case` 选项使用户在搜索定义字符串中的模式时能够打开或关闭大小写敏感性。


    ## NA 和缺失值管理


    缺失值处理是标准数据挖掘文献中的重要任务。在 R 编程语言中，缺失值表示为 NA。NA 不是字符串或数值值；它们被视为缺失值的指示符。将数据集导入 R 编程平台后，检查任何变量是否存在缺失值非常重要。为此，使用了
    `is.na()` 命令。请参阅此处给出的示例：


    ```r

    > x <- c(12, 13, 14, 21, 23, 24, NA, 25, NA, 0, NA)

    > is.na(x)

    [1] FALSE FALSE FALSE FALSE FALSE FALSE TRUE FALSE TRUE FALSE TRUE

    > mean(x, na.rm = TRUE)

    [1] 16.5

    > mean(x)

    [1] NA

    ```


    对象 `x` 是一个包含一些 NA 值的数值向量。为此，可以使用 `is.na()`；在条件满足的地方，结果将为 TRUE。如果在存在 NA 的情况下计算任何内容，我们最终会得到错误或无结果。或者，我们可以通过更改
    NA 值来替换数据集，也可以在执行任何计算时删除这些 NA 值。如前面的脚本所示，用于从对象 `x` 的均值计算中删除 NA 的是 `na.rm = T`。


    ## 缺失值插补技术


    要从数据集中删除缺失值，可以使用 `na.omit()`。即使只有一个变量的数据缺失，它也会删除整行。存在各种缺失值插补方法：


    - **均值插补**：数据向量中的缺失值被该向量（不包括 NA）的均值或中位数值替换。

    - **局部平均法**：通过考虑 3 或 5 期的移动平均来计算缺失值的局部平均值；也就是说，对于 3 期平均值，缺失数据的先前和后继值可以帮助确定缺失值应为多少。

    - **保持其单独**：有时插补根本不可能，客户可能有兴趣将缺失值分开，以单独了解缺失行为。

    - **基于模型**：有一些基于模型的缺失值插补技术，例如基于回归的缺失值预测方法。

    - **聚类**：与基于回归的缺失值插补预测类似，k-means 聚类可用于对数据集中的缺失值进行插补。


    ## 总结


    根据前面的讨论，可以总结如下：数据操作和数据管理是在各种实时项目上执行数据挖掘的重要步骤。由于 R 提供了更好的统计编程平台和可视化，使用 R 向读者解释各种数据挖掘概念是有意义的。在本章中，我们介绍了数据挖掘和
    R 的介绍以及概念、一些编程基础、R 数据类型等。我们还介绍了使用 R 导入和导出各种外部文件格式、排序和合并概念以及缺失数据管理技术。


    在下一章中，我们将学习更多关于使用 R 执行探索性数据分析的内容，以及如何理解单变量、双变量和多变量数据集。首先，我们将了解概念和实际解释，然后是 R 实现，以获得有关探索性数据分析的知识。


