    数据集中有 9,835 笔交易；在 169 个物品中，最频繁的物品及其对应频率已在上面显示。在 9,835 × 169 的矩阵中，只有 0.0261（即 2.61%）的单元格有值；其余为空。这
    2.61% 就是数据集的稀疏度。


