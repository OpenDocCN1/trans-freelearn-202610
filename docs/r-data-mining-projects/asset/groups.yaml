    # Regression introduction


    Regression methods help in predicting the future outcomes of a target variable.
    As an example, here are a few business cases:


    +   - In the sales and marketing domain, how can a business achieve a significant
    improvement in sales? Can we successfully predict using the if a necessary amendment
    is made to the drivers of sales?

    +   - In the retail domain, can we predict the number of visitors to a website,
    so that necessary tech support can be aligned to help operate the site better?

    +   - How can a retail/e-commerce owner predict the number of footfall to their
    store in a month/week/year?

    +   - In the banking domain, how can a bank predict the number of people applying
    for home loans, car loans, and personal loans, so that they can maintain their
    liquid capital to support the demand?

    +   - In the banking domain, prediction of default probability can be estimated
    using regression methods so that a bank can decide whether to approve a loan/credit
    card to a customer.

    +   - In the automobile manufacturing domain, the sales unit of vehicles is indirectly
    proportional to the price of the vehicles and the price of a vehicle is decided
    by many factors such as usages of different metals/components, and various vehicle
    features such as RPM, mileage, length, width, and others. How can a manufacturer
    predict the unit of sales?


    There are different methods to perform regression, including both linear as well
    as non-linear. Regression-based predictive analytics is being used in different
    industries in a different way. Regression methods support the prediction of a
    continuous variable, prediction of the probability of a success or failure of
    a variable, prediction of events based on features, and so on.


    # Formulation of regression problem


    The formulation of a regression problem is very essential in creating a good regression-based
    predictive model. A typical approach in building a good predictive model follows
    a process of converting a business problem to a statistical problem, then converting
    the statistical problem to a statistical solution, and finally converting the
    statistical solution to a business solution. The following steps are required
    to build a good predictive model using regression based methods:'
