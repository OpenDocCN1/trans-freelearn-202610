    \n```\n```r\n> df<-default[-1,-c(1,3:5,7:12,25)]\n> func1<-function(x){\n+ as.numeric(x)\n\
    + }\n> df<-as.data.frame(apply(df,2,func1))\n> normalize=function(x){\n```\n\n\
    主成分（PC）1 解释了数据集中 42% 的变化，主成分 2 解释了数据集中 12% 的变化。这意味着第一个 PC 与 n 维空间中约 42% 的总数据点接近。从前面的结果可以看出，前\
    \ 8 个主成分捕获了数据集中 91.9% 的变化。剩余 8% 的变化由另外 6 个主成分解释。现在问题是如何选择主成分。一般经验法则是 80-20，如果\
