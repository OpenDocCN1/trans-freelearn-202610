    \n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_55_0.png)\n\n从前面的图像中，我们可以得出结论：价格变量呈正偏态，因为分布右侧存在一些异常值。价格变量的均值因极端波动而被夸大，且大于众数。\n\
    \n现在让我们尝试理解一个可以使用正态分布来回答某个假设的例子。\n\n假设高速公路上的每加仑英里数变量服从均值为 29.08、标准差为 5.33 的正态分布。那么一辆新车提供\
    \ 35 英里/加仑里程的概率是多少？\n\n```\n> pnorm(35,mean(Cars93$MPG.highway),sd(Cars93$MPG.highway),lower.tail\
    \ = F)\n[1] 0.1336708\n```\n\n因此，一辆新车提供 35 英里/加仑里程所需的概率为 13.36%，由于期望均值高于实际均值，lower.tail\
    \ 相当于 FALSE。\n\n## 二项概率分布\n\n二项分布被称为离散概率分布。它描述一次实验的结果。每次试验被认为只有两种结果：成功或失败，是或否。例如，在\
    \ Cars93 数据集的变量中，手动变速箱是否可用用“是”或“否”表示。\n\n让我们举一个例子来说明二项分布的用途。在特定部件无法正常工作的情况下，汽车有缺陷的概率是\
    \ 0.1%。你制造了 93 辆汽车。在当前这批 93 辆汽车中至少检测出 1 辆缺陷车的概率是多少：\n\n```\n> pbinom(1,93,prob\
    \ = 0.1)\n[1] 0.0006293772\n```\n\n因此，在 93 辆汽车的一批中识别出一辆缺陷汽车的概率为 0.0006，考虑到缺陷部件的概率为\
    \ 0.10，这个概率非常小。\n\n## 泊松概率分布\n\n泊松分布适用于计数数据，在给定数据以及事件相关信息的情况下，你可以使用泊松概率分布预测该范围内任意数字出现的概率。\n\
    \n让我们举个例子。假设平均每分钟有 200 位顾客访问某个电子商务网站门户。那么求一分钟后有 250 位顾客访问同一网站的概率：\n\n```\n> ppois(250,200,lower.tail\
    \ = F)\n[1] 0.0002846214\n```\n\n因此，所需概率为 0.0002，这非常罕见。除了前面提到的经常使用的常见概率分布之外，还有许多其他分布可以在罕见情况下使用。\n\
    \n```\nmean sd\n0.5498938 0.3888336\n> x$vcov\nmean sd\nmean 0.3023831 0.0000000\n\
    sd 0.0000000 0.1511916\n> x$loglik\n[1] -287.1104\n> x$n\n[1] 93\n```\n\n现在我们将了解如何以图形方式表示变量的正态性：\n\
    \n```\n> qqnorm(Cars93$MPG.highway)\n> qqline(Cars93$MPG.highway)\n```\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_58_0.png)\n\
    \n以圆圈表示的数据点偏离了直线 t。\n\n解释离散数据：其中所有类别如下：\n\n```\n> table(Cars93$Type)\nCompact\
