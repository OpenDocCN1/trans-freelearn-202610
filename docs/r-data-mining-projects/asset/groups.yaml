    +   - **Backward selection method**: All the independent variables are part of
    the initial model. Using Wald chi-square test of significance, variables with
    lowest value of chi-square or highest p-value such that it exceeds 0.05 (given
    that 95% confidence interval is used in the model) are removed from the model.
    The backward selection process of variable removal stops when it is not possible
    to find a variable that fits the Wald test criteria.

    +   - **Forward selection method**: Model starts with a null model. A variable
    is entered into the model based on the lowest p-value or highest chi-square test
    statistic value. The process stops when there are no such cases found.

    +   - **Both**: The third approach is to apply both backward selection and forward
    selection:


    ```

    > #auto detection of model

    > fit_step<-stepAIC(model1,method="both")

    Start: AIC=34893.93

    IsGood.Purchase ~ Critic.Ratings + Acq.Cost +

