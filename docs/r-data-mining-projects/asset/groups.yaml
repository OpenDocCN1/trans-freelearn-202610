  - '[PAGE 12]


    Chapter 2, Exploratory Data Analysis with Automobile Data, helps the learners
    to understand exploratory data analysis. It involves numerical as well as graphical
    representation of variables in a dataset for easy understanding and quick conclusion
    about a dataset. It is important to get an understanding of the dataset, type
    of variables considered for analysis, the association between various variables,
    and so on. Creating cross-tabulations to understand the relationship between categorical
    variables and performing classical statistical tests on the data to verify various
    different hypotheses about the data can be tested out.


    Chapter 3, Visualize Diamond Dataset, covers the basics of data visualization
    along with how to create advanced data visualization using existing libraries
    in the R programming language. While looking at numbers and statistics, it may
    tell a similar story for the variables we are looking at by different cuts; however,
    when we visually look at the relationship between variables and factors, it shows
    a different story altogether. Hence, data visualization tells you a message that
    numbers and statistics fail to do.


    Chapter 4, Regression with Automobile Data, helps you to know the basics of predictive
    analytics using regression methods, including various linear and nonlinear regression
    methods using R programming. In this chapter, you will get to know the basics
    of predictive analytics using regression methods, including various linear and
    nonlinear regression methods using R programming. You will be able to understand
    the theoretical background as well as get practical hands-on experience on all
    the regression methods using R.


    Chapter 5, Market Basket Analysis with Groceries Data, shows the second method
    of product recommendation, popularly known as Market Basket Analysis (MBA) and
    also known as association rules. This is about associating items purchased at
    transaction level, finding out the sub-segments of users having similar products
    and hence, recommending the products. MBA can also be used to form upsell and
    cross-sell strategies.


    Chapter 6, Clustering with E-commerce Data, teaches the following things: what
    segmentation is, how clustering can be applied to perform segmentation, what are
    the methods used for clustering, and a comparative view of the various methods
    for segmentation. In this chapter, you will know the basics of segmentation using
    various clustering methods.


    Chapter 7, Building a Retail Recommendation Engine, covers the following things
    and their implementation using the R programming language: what recommendation
    is and how it works, types and methods for performing recommendation, and implementation
    of product recommendation using R.'
  - '[PAGE 13]


    Chapter 8, *Dimensionality Reduction*, implements dimensionality reduction techniques
    such as PCA, singular value decomposition (SVD), and iterative feature selection
    methods using a practical dataset and R. With the growth of data in volumes and
    variety, dimensions of data have been continuously on the rise. Dimensionality
    reduction techniques have many applications in different industries, such as in
    image processing, speech recognition, recommendation engines, text processing,
    and so on.


    Chapter 9, *Applying Neural Networks to Healthcare Data*, teaches you various
    types of neural networks, methods, and variants of neural networks with different
    functions to control the training of artificial neural networks in performing
    standard data mining tasks such as these: prediction of real-valued output using
    regression-based methods, prediction of output levels in a classification-based
    task, forecasting future values of a numerical attribute based on historical data,
    and compressing features to recognize important ones in order to perform prediction
    or classification.


    # What you need for this book


    To follow the examples and code shared along with this book, you need to have
    R software downloaded from https://cran.r-project.org/ (it is optional to download
    RStudio from https://www.rstudio.com/) and have it installed on the machine. There
    are no specific hardware requirements; you can have any computer with more than
    2 GB RAM and it works on all platforms, including Mac, Linux, and Windows.


    # Who this book is for


    This book is for readers who are starting their career in data mining, data science,
    or predictive modeling, or they are at some intermediate level with some degree
    of statistical knowledge and programming knowledge. Basic statistical knowledge
    is a must to understand the data mining concepts covered in this book. Having
    prior programming knowledge is not mandatory as first couple of chapters, I am
    going to cover data management and basic statistical analysis using R. This book
    is also for students, professionals, and experienced people aspiring to become
    data analysts.


    # Conventions


    In this book, you will find a number of text styles that distinguish between different
    kinds of information. Here are some examples of these styles and an explanation
    of their meaning.'
