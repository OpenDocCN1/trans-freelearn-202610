  - '[PAGE 176]


    Now let''s start segmenting the dataset using various clustering methods by taking
    a dataset from healthcare (`PimaIndiansDiabetes.csv [ref: 1]`) and a dataset from
    retail/e-commerce (`Wholesalecustomers.csv [ref: 1]`). Before running a clustering
    exercise, data sufficiency conditions need to be checked.


    # K-means clustering


    K-means clustering is an unsupervised learning algorithm that tries to combine
    similar objects into a group in such a way that the within-group similarity should
    be maximum and the between-group object similarity should be minimum. “Object”
    here implies the data points that are entered into an algorithm. The within-group
    similarity is computed based on a centrality measure called centroid (arithmetic
    mean) and a distance function that measures how close the objects within a group
    are to the center. The “K” in K-means clustering implies the number of clusters
    that a user might be interested in. The following steps need to be followed for
    k-means clustering. Since the mean is used as a measure of estimating the centroid,
    it is not free from the presence of extreme observations or outliers. Hence, it
    is required to check the presence of outliers in a dataset before running k-means
    clustering.


    +   1. **Checking the presence of outliers**: Let''s use the boxplot method of
    identifying the presence of any outliers in the `Wholesalecustomers.csv` dataset:


    ```

    > r_df<-read.csv("Wholesalecustomers.csv")

    > ####Data Pre-processing

    > par(mfrow=c(2,3))

    > apply(r_df[,c(-1,-2)],2,boxplot)

    ```


    The dotted points after the whisker line in each preceding boxplot for all the
    variables indicate that there are lots of outliers in the dataset. The capping
    method is mostly used by practitioners to remove the outliers from the dataset.
    If any data point exceeds the quantiles, 90th percentile, 95th percentile, or
    99th percentile for each variable, then those data points need to be capped at
    the respective percentiles:


    ```

    > #computing quantiles

    > quant<-function(x){quantile(x,probs=c(0.95,0.90,0.99))}

    > out1<-sapply(r_df[,c(-1,-2)],quant)

    ```'
  - '[PAGE 177]


    <!-- no content -->'
  - '[PAGE 178]


    +   2. **Scaling the dataset:** Inclusion of only continuous variables in the
    K-means clustering exercise does not guarantee that all the variables would be
    on the same scale. For example, the age of a customer ranges from 0-100 and the
    income of a customer ranges from 0-100,000. Since both units of measurement are
    different, they might fall into different clusters, which becomes more complex
    when we have more data points to be represented. In order to compare segments
    in a clustering process, all the variables need to be standardized on a scale;
    here we have applied standard normal transformation (Z-transformation) for all
    the variables:


    ```

    ```r

    > r_df_scaled<-as.matrix(scale(r_df[ ,c(-1,-2)]))

    > head(r_df_scaled)

    Fresh Milk Grocery Frozen Detergents_Paper Delicassen

    [1,]  0.2351056 1.2829174 0.11321460 -0.96232799 0.1722993 0.1570550

    [2,] -0.4151579 1.3233470 0.45658819 -0.30652122 0.4120701 0.6313698

    [3,] -0.4967305 1.0597962 0.13425842 -0.03373355 0.4984496 1.8982669

    [4,]  0.3041643 -0.9430315 -0.45821928 1.66113143 -0.6670924 0.6443648

    [5,]  1.3875506 0.1657331 0.05110966 0.60623797 -0.1751554 1.8928669

    [6,] -0.1421677 0.9153464 -0.30338465 -0.77070636 -0.1681831 0.2974239

    ```

    ```


    +   3. **Choose initial cluster seeds:** The selection of initial random seeds
    decides the number of iterations required for convergence of the model. Typically,
    initial cluster seeds chosen at random are temporary means of the clusters. The
    objects closer to the centroid measured by the distance function are assigned
    the cluster membership. With the addition of a new member into the cluster, again
    the centroid is computed and each seed value is replaced by the respective cluster
    centroid. In K-means clustering, this process of adding more objects to the group
    and hence updating the centroid goes on until the centroids are not moving and
    the objects are not changing the group membership.


    +   4. **Decide the number of cluster K:** In the R programming language, there
    are two libraries, Rcmdr (R Commander) and stats, that support K-means clustering
    and they use two different approaches. The Rcmdr library needs to be loaded to
    run the algorithm, but stats is already built into base R. To compute the number
    of clusters required to represent the data using K-means algorithm is decided
    by the scree plot using the following formula:


    ```

    ```r

    > library(Rcmdr)

    > sumsq<-NULL

    > #Method 1

    > par(mfrow=c(1,2))

    > for (i in 1:15) sumsq[i] <-

    sum(KMeans(r_df_scaled, centers=i, iter.max=500,

    num.seeds=50)$withinss)

    >

    ```

    ```'
  - "[PAGE 179]\n\n```\n> plot(1:15, sumsq, type=\"b\", xlab=\"Number of Clusters\"\
    ,\n+ ylab=\"Within groups sum of squares\",main=\"Screeplot using Rcmdr\")\n>\
    \ \n> #Method 2\n> for (i in 1:15) sumsq[i] <- \nsum(kmeans(r_df_scaled,centers=i,iter.max=5000,\n\
    \    algorithm = \"Forgy\")$withinss)\n> \n> plot(1:15, sumsq, type=\"b\", xlab=\"\
    Number of Clusters\",\n+ ylab=\"Within groups sum of squares\",main=\"Screeplot\
    \ using Stats\")\n```\n\nThe following graph explains the scree plot. Using both\
    \ approaches, the ideal number of clusters is 4, decided by looking at the “elbow”\
    \ point on the scree plot. The vertical axis shows the within-group sum of squares\
    \ dropping as the cluster number increases on the horizontal axis:\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_179_0.png)\n\
    \nOnce the number of clusters is decided, the cluster centers and distance can\
    \ be computed, and the following code explains the functions to use in K-means\
    \ clustering. The objective here is to classify the objects in such a way that\
    \ they are as much dissimilar as possible from one group to another group and\
    \ as much similar as possible within each group. The following function can be\
    \ used to compute the within-group sum of squares from the cluster centers to\
    \ the individual objects:"
  - "[PAGE 180]\n\n![](img/04e03d5ea18ca2e57a47a14c9ae47ace_180_0.png)\n\nThe sum\
    \ of squares from each of the clusters is computed and then added up to compute\
    \ the total within-group sum of squares for the dataset. The objective here is\
    \ to minimize the within-group sum of squares total.\n\n# 5. Grouping based on\
    \ minimum distance:\n\nThe K-means syntax and explanation for the arguments are\
    \ as follows:\n\n```\nkmeans(x, centers, iter.max = 10, nstart = 1,\n       algorithm\
    \ = c(\"Hartigan-Wong\", \"Lloyd\", \"Forgy\",\n       \"MacQueen\"), trace=FALSE)\n\
    ```\n\n| Argument | Description |\n|---|---|\n| `x` | **Numeric matrix of data,\
    \ or an object that can be coerced to such a matrix (such as a numeric vector\
    \ or a data frame with all numeric columns)** |\n| `centers` | Either the number\
    \ of clusters, say *k*, or a set of initial (distinct) cluster centers. If it’s\
    \ a number, a random set of (distinct) rows in *x* is chosen as the initial centers.\
    \ |\n| `iter.max` | The maximum number of iterations allowed. |\n| `nstart` |\
    \ If the center is a number, how many random sets should be chosen? |\n| `algorithm`\
    \ | Character. This may be abbreviated. Note that \"Lloyd\" and \"Forgy\" are\
    \ alternative names for one algorithm. |\n\n*Table 1: The description for the\
    \ K-means syntax*\n\n```\n> #Kmeans Clustering\n> library(cluster);library(cclust)\n\
    > set.seed(121)\n> km<-kmeans(r_df_scaled,centers=4,nstart=17,iter.max=50000,\
    \ algorithm\n= \"Forgy\",trace = T)\n```\n\nThe scaled dataset is used to create\
    \ clusters, with four clusters and 17 initial starting points. Given the 50,000\
    \ iterations with the Forgy algorithm, the following results are obtained from\
    \ the model:\n\n```\n#checking results\nsummary(km)\n```"
