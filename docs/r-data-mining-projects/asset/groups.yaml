  md: '

    One critical step in the item-based collaborative filtering algorithm is to compute
    the similarity between items and then to select the most similar items. The basic
    idea in similarity computation between two items $i$ and $j$ is to first isolate
    the users who have rated both of these items and then to apply a similarity computation
    technique to determine the similarity $S(i,j)$.


    There are a number of different ways to compute the similarity between items.
    Here we present three such methods. These are cosine-based similarity, correlation-based
    similarity, and adjusted-cosine similarity:


    - **Cosine-based similarity:** Two items are thought of as two vectors in the
    $m$ dimensional user-space. The similarity between them is measured by computing
    the cosine of the angle between these two vectors:


    ![](img/04e03d5ea18ca2e57a47a14c9ae47ace_198_0.png)


    Following is the formula for computing cosine similarity between two vectors.
    Let''s take a numerical example to compute the cosine similarity:


    Cos (d1, d2) = 0.44


    | d1 | d2 | d1\*d2 | \|\|d1\|\| | \|\|d2\|\| | \|\|d1\|\|\*\|\|d2\|\| |

    |---|---:|---:|---:|---:|---:|

    | 6 | 1 | 6 | 36 | 1 | 36 |

    | 4 | 0 | 0 | 16 | 0 | 0 |

    | 5 | 3 | 15 | 25 | 9 | 225 |

    | 1 | 2 | 2 | 1 | 4 | 4 |

    | 0 | 5 | 0 | 0 | 25 | 0 |

    | 2 | 0 | 0 | 4 | 0 | 0 |

    | 4 | 6 | 24 | 16 | 36 | 576 |

    | 0 | 5 | 0 | 0 | 25 | 0 |

    | 3 | 0 | 0 | 9 | 0 | 0 |

    | 6 | 1 | 6 | 36 | 1 | 36 |


    If the ratings or reviews are explicitly given for a set of items or products,
    it makes sense to apply user based collaborative filtering. If some of the ratings
    for few items are missing still the data can be imputed, once the missing ratings
    predicted, the user similarity can be computed and hence recommendation can be
    generated. For user-based collaborative filtering, the data would look as follows:


    | User | Item1 | Item2 | Item3 | Item4 | Item5 | Item6 |

    |------|------:|------:|------:|------:|------:|------:|

    | user1 | -7.82 | 8.79 | -9.66 | -8.16 | -7.52 | -8.5 |

    | user2 | 4.08 | -0.29 | 6.36 | 4.37 | -2.38 | -9.66 |

    | user3 |  |  |  |  | 9.03 | 9.27 |

    | user4 |  | 8.35 |  |  | 1.8 | 8.16 |

    | user5 | 8.5 | 4.61 | -4.17 | -5.39 | 1.36 | 1.6 |

    | user6 | -6.17 | -3.54 | 0.44 | -8.5 | -7.09 | -4.32 |

    | user7 |  |  |  |  | 8.59 | -9.85 |

    | user8 | 6.84 | 3.16 | 9.17 | -6.21 | -8.16 | -1.7 |

    | user9 | -3.79 | -3.54 | -9.42 | -6.89 | -8.74 | -0.29 |

    | user10 | 3.01 | 5.15 | 5.15 | 3.01 | 6.41 | 5.15 |


