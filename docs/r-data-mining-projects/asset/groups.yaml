    # About the Author


    **Pradeepta Mishra** is a data scientist, predictive modeling expert, deep learning
    and machine learning practitioner, and an econometrician. He is currently leading
    the data science and machine learning practice for Ma Foi Analytics, Bangalore,
    India. Ma Foi Analytics is an advanced analytics provider for Tomorrow’s Cognitive
    Insights Ecology, using a combination of cutting-edge artificial intelligence,
    proprietary big data platform, and data science expertise. He holds a patent for
    enhancing planogram design for the retail industry. Pradeepta has published and
    presented research papers at IIM Ahmedabad, India. He is a visiting faculty at
    various leading B-schools and regularly gives talks on data science and machine
    learning.


    Pradeepta has spent more than 10 years in his domain and has solved various projects
    relating to classification, regression, pattern recognition, time series forecasting,
    and unstructured data analysis using text mining procedures, spanning across domains
    such as healthcare, insurance, retail and e-commerce, manufacturing, and so on.


    If you have any questions, don''t hesitate to look me up on Twitter via `@mishra1_PK`,
    I will be more than glad to help a fellow web professional wherever, whenever.


    > *I would like to thank my wife, Prajna, and daughter, Aarya, for putting up
    with my late-night writing sessions. I would also like to thank my friends and
    colleagues at work for their continuous encouragement in writing.*'
