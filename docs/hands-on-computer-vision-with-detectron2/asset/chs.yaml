- "## Detectron2 和计算机视觉任务简介\n\n本章介绍了 Detectron2、其架构以及 Detectron2 可执行的计算机视觉 (CV) 任务。换句话说，本章讨论了\
  \ Detectron2 可执行的 CV 任务以及我们为什么需要它们。此外，本章还提供了在本地或使用 Google Colab 在云端使用 Detectron2\
  \ 开发 CV 应用的环境设置步骤。\n\n到本章结束时，您将了解主要的 CV 任务（例如，目标检测、实例分割、关键点检测、语义分割和全景分割）；了解 Detectron2\
  \ 的工作原理以及它如何帮助您使用深度学习解决 CV 任务；并能够为 Detectron2 应用设置本地和云环境。\n\n具体而言，本章涵盖以下主题：\n\n\
  - 计算机视觉任务\n- Detectron2 及其实架构简介\n- Detectron2 开发环境\n\n### 技术要求\n\nDetectron2 CV\
  \ 应用建立在 PyTorch 之上。因此，需要兼容版本的 PyTorch 才能运行本章中的代码示例。本章后面的部分将提供专门针对 Detectron2 的设置说明。所有代码、数据集和相应结果均可在本书的\
  \ GitHub 页面 https://github.com/PacktPublishing/Hands-On-Computer-Vision-with-Detectron2\
  \ 上获取。强烈建议下载代码并跟随学习。\n\n## 计算机视觉任务\n\n深度学习在许多 CV 任务中取得了最先进的结果。最常见的 CV 任务是图像分类，其中深度学习模型为给定图像提供类别标签。然而，深度学习在最近的进步使计算机能够执行更高级的视觉任务。这些高级视觉任务有很多。\n\
  \n然而，本书专注于更常见和重要的任务，包括目标检测、实例分割、关键点检测、语义分割和全景分割。读者可能难以区分这些任务。图 1.1 描绘了它们之间的差异。本节概述了它们是什么以及何时使用它们，而本书的其余部分则侧重于如何使用\
  \ Detectron2 实现这些任务。让我们开始吧！\n\n![](img/0e7994c850a84b7a53d34c7f943c7edd_23_0.png)\n\
  \n### 目标检测\n\n目标检测通常包括目标定位和分类。具体而言，此任务的深度学习模型通过在图像中对感兴趣的目标应用边界框来预测目标所在的位置（定位）。此外，这些模型还会将检测到的目标分类为感兴趣的类型（分类）。\n\
  \n此任务的一个示例是在图片中指定人物并对检测到的人类应用边界框（仅定位），如图 1.1 (b) 所示。另一个示例是从记录的道路图像中检测道路损坏，通过为损坏提供边界框（定位）并进一步将损坏分类为纵向裂缝、横向裂缝、龟裂和坑洞等类型（分类）。\n\
  \n### 实例分割\n\n实例分割与目标检测类似，也涉及目标定位和分类。然而，实例分割在定位检测到的感兴趣目标时更进一步。\n\n具体而言，除了分类之外，此任务的模型还在像素级别上定位检测到的目标。换句话说，它识别每个检测到的目标的所有像素。实例分割在需要图像中检测到的目标的形状并需要跟踪每个单独目标的应用中是必需的。图\
  \ 1.1 (c) 显示了对图 1.1 (a) 中输入图像的实例分割结果。具体而言，除了边界框之外，每个人的每个像素也被突出显示。\n\n### 关键点检测\n\
  \n除了检测目标之外，关键点检测还指示检测到的目标的重要部位，称为关键点。这些关键点描述了检测到的目标的基本特征。该特征通常对图像旋转、缩小、平移或失真不变。例如，人类的关键点包括眼睛、鼻子、肩膀、手肘、手、膝盖和脚。关键点检测对于动作估计、姿态检测或人脸检测等应用很重要。图\
  \ 1.1 (d) 显示了对图 1.1 (a) 中输入图像的关键点检测结果。具体而言，除了边界框之外，它还突出显示每个检测到的个体的所有关键点。\n\n###\
  \ 语义分割\n\n语义分割任务并不检测对象的特定实例，而是将图像中的每个像素分类为感兴趣的某些类别。例如，在自动驾驶汽车应用中，此任务的模型将图像区域分类为行人、道路、汽车、树木、建筑物和天空。此任务在提供不同类别的对象组的更广阔视图时很重要（即对图像有更高层次的理解）。具体而言，如果一个区域中存在单个类别实例，它们会被归为一个掩码，而不是为每个单独实例提供不同的掩码。\n\
  \n语义分割应用的一个示例是将图像分割为前景对象和背景对象（例如，模糊背景并为肖像图像提供更艺术的外观）。图 1.1 (e) 显示了对图 1.1 (a) 中输入图像的语义分割结果。具体而言，输入图片被划分为被分类为事物（人或前景对象）和背景对象（如天空、山、泥土、草和树）的区域。\n\
  \n\n\n\n\n具体来说，它*更快*且更准确，因为在重新实现前沿算法时，Detectron2 有机会发现这些算法旧版本中的次优实现部分或过时特性并重新实现。它是*模块化*的，即将其实现划分为子部分。这些部分包括输入数据、主干网络、区域提议头和预测头（下一节将介绍更多关于这些组件的信息）。它是*可定制*的，意味着其组件具有内置实现，但可以通过调用新实现进行定制。最后，它构建在\
  \ PyTorch 之上，这意味着有大量开发者资源在线可供帮助使用 Detectron2 开发应用。\n\n此外，Detectron2 提供了具有最先进检测结果的*预训练模型*用于\
  \ CV 任务。这些模型是在 Facebook 研究实验室使用大量图像和在其他机构可能无法获得的高计算资源训练的。\n\n这些预训练模型发布在其 Model Zoo\
  \ 中，可免费使用：https://github.com/facebookresearch/detectron2/blob/main/MODEL_ZOO.md。\n\
  \n这些预训练模型帮助开发者快速开发典型的 CV 应用，而无需收集、准备大量图像，或需要高计算资源来训练新模型。然而，假设需要针对特定领域和自定义数据集开发 CV\
  \ 任务。在这种情况下，这些现有模型可以作为起始权重，并且整个 Detectron2 模型可以在自定义数据集上重新训练。\n\n最后，我们可以将 Detectron2\
  \ 模型转换为*可部署的产物*。具体来说，我们可以将 Detectron2 模型转换为标准深度学习框架的标准文件格式，如 `TorchScript`、`Caffe2\
  \ protobuf` 和 `ONNX`。这些文件随后可以部署到其对应的运行时，如 PyTorch、Caffe2 和 ONNX Runtime。此外，Facebook\
  \ AI Research 还发布了 **Detectron2Go (D2Go)**，这是一个平台，开发者可以在此将 Detectron2 开发更进一步，创建针对移动设备优化的模型。\n\
  \n总之，Detectron2 实现了前沿检测算法，具有快速、准确、模块化以及构建在 PyTorch 之上的优势。Detectron2 还提供预训练模型，使用户可以快速入门并使用最先进的结果构建\
  \ CV 应用。它也是可定制的，因此用户可以更改其组件或在自定义业务领域上训练 CV 应用。此外，我们可以将 Detectron2 导出为标准深度学习框架运行时支持的脚本。此外，名为\
  \ Detectron2Go 的初始研究支持为边缘设备开发 Detectron2 应用。\n\n在下一节中，我们将研究 Detectron2 架构，以了解其工作原理以及定制其各个组件的可能性。\n\
  \n## Detectron2 架构\n\n![](img/0e7994c850a84b7a53d34c7f943c7edd_27_0.png)\n\n图 1.2：Detectron2\
  \ 的主要组件\n\nDetectron2 具有模块化架构。图 1.2 描绘了标准 Detectron2 应用中的四个主要模块。第一个模块用于注册输入数据（Input\
  \ Data）。\n\n第二个模块是用于提取图像特征的主干（Backbone），随后是第三个模块，用于提出有无物体的区域以供下一个训练阶段使用（Region Proposal）。最后，最后一个模块使用适当的头（例如检测头、实例分割头、关键点头、语义分割头或全景分割头）来预测包含物体的区域并将检测到的物体分类为类别。第\
  \ 3 章至第 5 章讨论了这些组件用于构建物体检测任务的 CV 应用，第 10 章和第 11 章详细介绍了这些组件用于分割任务。以下各节简要讨论这些组件的一般情况。\n\
  \n### 输入数据模块\n\n输入数据模块旨在使用缓存和多 worker 等优化技术从硬盘以大批量加载数据。此外，相对容易将数据增强技术插入到此模块的数据加载器中。此外，它被设计为可定制，以便用户可以注册其自定义数据集。以下是使用此模块将自定义数据集分配给训练\
  \ Detectron2 模型的典型语法：\n\n```\nDatasetRegistry.register(\n    'my_dataset',\n   \
  \ load_my_dataset\n)\n```\n\n### 主干模块\n\n主干模块从输入图像中提取特征。因此，此模块通常使用 ResNet 或 ResNeXt\
  \ 等最先进的卷积神经网络。此模块可以定制以调用在感兴趣的图像分类任务中表现良好的任何标准卷积神经网络。值得注意的是，此模块对迁移学习有大量了解。具体来说，如果我们想使用在\
  \ ImageNet 等大型图像数据集上表现良好的最先进卷积神经网络，我们可以在此处使用这些预训练模型。否则，我们可以选择此模块的简单网络以提高性能（训练和预测时间），以准确性为代价。第\
  \ 2 章将讨论为常见 CV 任务在 Detectron2 Model Zoo 上选择合适的预训练模型。\n\n以下代码片段显示了使用此模块注册自定义主干网络以训练\
  \ Detectron2 模型的典型语法：\n\n```\n@BACKBONE_REGISTRY.register()\nclass CustomBackbone(Backbone):\n\
  \    pass\n```\n\n### 区域提议模块\n\n下一个模块是区域提议模块（Region Proposal）。此模块接受来自主干提取的特征并预测或提出图像区域（带位置规范）以及分数以指示区域是否包含物体（带物体性分数）。所提议区域的物体性分数可能为\
  \ 0（表示没有物体或为背景）或 1（表示确信预测区域中存在感兴趣的物体）。值得注意的是，此物体分数不是属于感兴趣类别的概率，而是简单地表示区域是否包含物体（任何类别）或不（背景）。\n\
  \n此模块默认设置了区域提议网络（RPN）。然而，用自定义网络替换此网络相对容易。以下是使用此模块注册自定义 RPN 以训练 Detectron2 模型的典型语法：\n\
  \n```\n@ROI_BOX_HEAD_REGISTRY.register()\nclass CustomBoxHead(nn.Module):\n    pass\n\
  ```\n\n### 感兴趣区域模块\n\n最后一个模块是感兴趣区域（RoI）头的位置。根据 CV 任务，我们可以为此模块选择适当的头，例如检测头、分割头、关键点头或语义分割头。例如，检测头接受区域提议和所提议区域的输入特征，并将它们通过全连接网络传递，具有用于预测和分类的两个独立头。具体来说，一个头用于预测物体的边界框，另一个用于将检测到的边界框分类为相应类别。\n\
  \n另一方面，语义分割头也使用卷积神经网络头将每个像素分类为感兴趣的类别之一。以下是使用此模块注册自定义感兴趣区域头以训练 Detectron2 模型的典型语法：\n\
  \n```\n@ROI_HEAD_REGISTRY.register()\nclass CustomHeads(StandardROIHeads):\n   \
  \ pass\n```\n\n现在你已经了解了 Detectron2 及其架构，让我们为开发 Detectron2 应用准备开发环境。\n\n## Detectron2\
  \ 开发环境\n\n现在，我们了解了高级 CV 任务以及 Detectron2 如何帮助为这些任务开发应用。是时候开始开发 Detectron2 应用了。本节提供在云端使用\
  \ Google Colab、本地环境或连接 Google Colab 到本地托管运行时的混合方法设置 Detectron2 开发环境的步骤。\n\n### Detectron2\
  \ 应用的云开发环境\n\nGoogle Colab 或 Colaboratory（https://colab.research.google.com）是一个云平台，允许你从网络浏览器编写和执行\
  \ Python 代码。它使用户能够以零配置开始开发深度学习应用，因为大多数常见的机器学习和深度学习包，如 PyTorch 和 TensorFlow，已预先安装。此外，用户可免费使用\
  \ GPU。即使使用免费计划，用户也能获得相对优于标准个人电脑的计算资源。如果需要，用户可以支付少量费用升级为 Pro 或 Pro+ 以获得更高的计算资源。此外，正如其名称所示，Google\
  \ Colab 相对容易协作，并且易于共享 Google Colab 文件和项目。\n\nCV 任务的深度学习模型使用大量图像；因此，GPU 可显著加快训练和推理时间。然而，默认情况下，Google\
  \ Colab 未启用 GPU 运行时。因此，用户应在安装 Detectron2 或训练 Detectron2 应用之前启用 GPU 硬件加速。此步骤是选择 GPU，如图\
