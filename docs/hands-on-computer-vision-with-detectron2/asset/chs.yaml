- "## 12\n\n## 将 Detectron2 模型部署到服务器环境\n\n本章将引导你完成导出过程的步骤，将 Detectron2 模型转换为可部署的产物。具体来说，它描述了深度学习模型的标准文件格式（如\
  \ TorchScript）以及这些格式对应的运行时（如 PyTorch 和 C++）。然后，本章提供了将 Detectron2 模型转换为标准文件格式并部署到相应运行时的步骤。\n\
  \n学完本章后，你将理解 Detectron2 支持的标准文件格式和运行时。你可以执行步骤，使用跟踪（tracing）或脚本化（scripting）方法将 Detectron2\
  \ 模型导出为 TorchScript 格式。此外，你可以创建一个 C++ 应用程序来加载和执行导出的模型。\n\n在本章中，我们将涵盖以下主题：\n\n- PyTorch\
  \ 模型支持的文件格式和运行时\n- 部署自定义 Detectron2 模型\n\n## 技术要求\n\n你应该已经完成第 1 章的学习，以具备合适的 Detectron2\
  \ 开发环境。所有代码、数据集和结果都可以在本书的 GitHub 页面上找到：https://github.com/PacktPublishing/Hands-On-Computer-Vision-with-Detectron2。\n\
  \n## 支持的文件格式和运行时\n\n本节介绍 PyTorch 应用（尤其是 Detectron2 应用）的开发环境、文件格式和运行时。然后使用简单示例来解释这些概念。\n\
  \n## 开发环境、文件格式和运行时\n\n在开发和部署深度学习模型时，有三个主要概念需要掌握：开发环境和编程语言、模型文件格式以及运行时环境。图 12.1 展示了这三个概念及各自的示例。\n\
  \n![](img/0e7994c850a84b7a53d34c7f943c7edd_265_0.png)\n\n图 12.1：开发环境、文件格式和部署环境\n\
  \n开发环境和编程语言或框架（如 PyTorch 或 Python）通常优先考虑易用性和定制性。然而，Python 语言和 PyTorch 框架在部署时可能会遇到运行时问题。例如，它们相对于其他运行时环境（如由\
  \ C++ 应用程序生成的可执行文件）来说速度较慢。此外，它们无法直接部署到 Web 浏览器或移动设备上。因此，用 PyTorch 编写的模型通常需要经过导出过程才能成为可部署的产物。\n\
  \n用 PyTorch 编写的模型有其自身的文件格式，并且旨在通过 PyTorch 运行时执行。然而，为了支持跨平台以及与其他运行时环境的兼容性，PyTorch\
  \ 支持另一种称为 TorchScript 的中间文件格式。这种 TorchScript 文件可以在不同的运行时环境中执行，例如由 C++ 应用程序加载以生成可执行文件。PyTorch\
  \ 还允许将其模型导出为开放神经网络交换（ONNX）文件格式，以支持其他运行时环境，如 Web 浏览器和移动设备。\n\nTorchScript 有自己的解释器，其功能类似于\
  \ Python 的受限版本。这种格式使我们能够将整个模型保存到磁盘，并在不同的环境中使用，例如使用 Python 以外的其他语言构建的服务器。TorchScript\
  \ 格式允许编译器优化，从而带来更高效的执行。此外，TorchScript 还可以与多种后端/设备运行时交互。\n\nDetectron2 支持使用跟踪（tracing）和脚本化（scripting）方法将其模型导出为\
  \ TorchScript。它还允许用户将模型导出为 ONNX 文件格式，该格式可以加载到不同的运行时环境中，如 Web 浏览器和移动设备。Detectron2\
  \ 模型可以使用 caffe2_tracing 方法导出为 Caffe2 文件格式。然而，Caffe2 即将被弃用并与 PyTorch 合并。因此，本书不考虑这种选项。最后，在撰写本书时，TensorFlow\
  \ 在生产环境中比 PyTorch 更受欢迎。因此，Detectron2 支持将其模型导出为 TensorFlow 的文件格式。\n\n\n\n\n具体来说，它包含了原始模型\
  \ `forward` 方法的 TorchScript 格式代码。接下来，我们准备使用跟踪模型对之前创建的相同输入（X）执行预测：\n\n```python\n\
  with torch.no_grad():\n    y = traced_model(X)\n    print(y)\n```\n\n上述代码片段应该显示与原始\
  \ PyTorch 模型预测完全相同的结果：\n\n```text\ntensor([[0.1100],\n        [0.0000]], device='cuda:0')\n\
  ```\n\n下面的代码片段保存了跟踪模型，重新加载它，然后使用它对相同输入执行预测，以确保我们可以在不同的环境中导出和加载模型：\n\n```python\n\
  traced_model.save(\"traced_model.pt\")\nloaded_model = torch.jit.load(\"traced_model.pt\"\
  )\nfor p in loaded_model.parameters():\n    print(p)\nprint(loaded_model(X))\n```\n\
  \n这段代码应该将跟踪模型保存到硬盘。加载后，加载的模型应该具有与 PyTorch 模型相同的参数。最后，加载的模型应该对 X 输入产生与原始模型相同的预测。\n\
  \n如果你在 Google Colab 上运行此笔记本，可以通过以下语句将此模型保存到本地系统以供将来使用：\n\n```python\nfrom google.colab\
  \ import files\nfiles.download('traced_model.pt')\n```\n\n恭喜！通过使用跟踪方法，你应该已经掌握了将\
  \ PyTorch 模型导出为 TorchScript 的步骤。下一节将介绍跟踪方法的局限性，并介绍使用脚本化方法执行相同任务的方法。\n\n接下来，我们可以使用与上一节相同的代码片段，通过跟踪方法执行导出：\n\
  \n```python\ndummy_X = torch.tensor(\n    data  = [[-1, -2, -3, -4]],\n    dtype\
  \ = torch.float32)\ntraced_model = torch.jit.trace(\n    pt_model,\n    example_inputs\
  \ = dummy_X)\n```\n\n这段代码应该显示一条警告消息，内容如下：\n\n```\nTracerWarning: Converting a tensor\
  \ to a Python boolean might cause the trace to be incorrect. We can't record the\
  \ data flow of Python values, so this value will be treated as a constant in the\
  \ future. This means that the trace might not generalize to other inputs!\n```\n\
  \n这条警告消息表明，跟踪方法只记录了输入通过模型时的单一/静态流程，并未考虑其他情况。你可以使用上一节提供的相同代码片段来显示跟踪模型的参数：\n\n```python\n\
  traced_model.to(device)\nfor p in traced_model.parameters():\n    print(p.data)\n\
  ```\n\n参数应该保持不变（全部为 0.01）。然而，模型代码是不同的。具体来说，`print(traced_model.code)` 显示以下输出：\n\n\
  ```\ndef forward(self,\n    x: Tensor) -> Tensor:\n    linear = self.linear\n  \
  \  return torch.neg((linear).forward(x, ))\n```\n\n请注意，这个跟踪模型总是返回线性模型输出的负值（torch.neg），因为这是虚拟输入所走的路径并被记录在跟踪模型中。换句话说，对于未来的数据，if\
  \ 代码块永远不会被执行。\n\n让我们使用跟踪模型对之前生成的 X 输入执行预测：\n\n```python\nwith torch.no_grad():\n\
  \    y = traced_model(X)\n    print(y)\n```\n\n这段代码给出以下输出：\n\n```\ntensor([[ -0.1100]],device='cuda:0')\n\
  ```\n\n显然，这与原始 PyTorch 模型的预测输出不同，因为执行路径是针对虚拟输入（dummy_X）的，而不是当前的 X 输入。因此，在这种情况下，应该使用脚本化方法。\n\
  \n# 使用脚本化方法导出 PyTorch 模型\n\n继续使用上一节中的代码；下面的代码片段使用脚本化方法将 PyTorch 模型导出到 TorchScript：\n\
  \n```python\nscripted_model = torch.jit.script(pt_model)\nprint(scripted_model.code)\n\
  ```\n\n该片段应显示导出模型的 TorchScript 代码，如下所示：\n\n```\ndef forward(self,\n    x: Tensor)\
  \ -> Tensor:\n    linear = self.linear\n    y = (linear).forward(x, )\n    if bool(torch.gt(torch.sum(y),\
  \ 0)):\n        _0 = y\n    else:\n        _0 = torch.neg(y)\n    return _0\n```\n\
  \n显然，这与跟踪方法不同，因为导出模型的 TorchScript 代码现在包含了控制流部分。此外，下面的代码片段应显示导出模型的参数（所有参数均为 0.01）：\n\
  \n```python\nfor p in scripted_model.parameters():\n    print(p.data)\n```\n\n此外，我们可以使用导出模型对之前准备的\
  \ X 输入执行预测，以检查结果：\n\n```python\nscripted_model.to(device)\nwith torch.no_grad():\n\
  \    y = scripted_model(X)\n    print(y)\n```\n\n预测结果应与原始模型产生的结果完全相同（tensor([[0.1100]],\
  \ device='cuda:0')）。此外，我们可以将模型保存到硬盘，重新加载它，显示加载模型的参数值，执行预测，并再次验证结果：\n\n```python\n\
  # save\nscripted_model.to(\"cpu\").save(\"scripted_model.pt\")\n# load\nloaded_model\
  \ = torch.jit.load(\"scripted_model.pt\")\n# loaded parameters\nfor p in loaded_model.parameters():\n\
  \    print(p)\n# prediction\nloaded_model.to(device)\nloaded_model(X)\n```\n\n如果你在\
  \ Google Colab 上运行此笔记本，还可以下载这些模型以供将来使用：\n\n```python\nfrom google.colab import files\n\
  files.download('scripted_model.pt')\nfiles.download('pt_model.pt')\n```\n\n跟踪方法和脚本化方法各有优缺点。下一节将介绍混合方法，以充分利用两者的优势。\n\
  \n# 混合使用跟踪和脚本化方法\n\n跟踪方法简单直接，但不能正确记录包含控制流和循环的模型。脚本化方法可以弥补跟踪方法的这一局限。然而，其支持的语法/代码可能有限。因此，在某些情况下，将两种方法结合起来可能会很有益处。\n\
  \n```\nadd_executable(cppapp cppapp.cpp)\ntarget_link_libraries(cppapp \"${TORCH_LIBRARIES}\"\
  )\nset_property(TARGET cppapp PROPERTY CXX_STANDARD 14)\n```\n\n值得注意的是，如果在 Windows\
  \ 上执行，建议在此文件末尾添加一个额外部分：\n\n```\nif (MSVC)\n  file(GLOB TORCH_DLLS \"${TORCH_INSTALL_PREFIX}/lib/*.dll\"\
  )\n  add_custom_command(TARGET cppapp\n                    POST_BUILD\n        \
  \            COMMAND ${CMAKE_COMMAND} -E copy_if_different\n                   \
  \         ${TORCH_DLLS}\n                            $<TARGET_FILE_DIR:cppapp>)\n\
  endif (MSVC)\n```\n\n类似地，下面的代码片段利用 `%%writefile` 指令创建了一个 C++ 应用程序的 .cpp 文件，该应用程序加载\
  \ TorchScript 模型、准备示例输入、执行预测并显示预测结果：\n\n```\n%%writefile cppapp/cppapp.cpp\n#include\
  \ <torch/script.h>\n#include <iostream>\n#include <memory>\n\nint main(int argc,\
  \ const char* argv[]) {\n    torch::jit::script::Module module =\n    torch::jit::load(argv[1]);\n\
  \    std::cout << \"Loaded the module\\n\";\n    float data[] = {1, 2, 3, 4};\n\
  \    torch::Tensor tensor = torch::from_blob(data, {4});\n    std::vector<torch::jit::IValue>\
  \ inputs;\n    inputs.push_back(tensor);\n    at::Tensor output = module.forward(inputs).toTensor();\n\
  \    std::cout << \"pred result\" << output << '\\n';\n}\n```\n\n# 用于导出模型的 Detectron2\
  \ 工具\n\nDetectron2 提供了一个名为 TracingAdapter 的包装类，它可以帮助包装 Detectron2 模型并支持使用跟踪方法进行导出。Detectron2\
  \ 模型接受丰富的输入，并产生丰富的输出（即，它们可以是字典或对象）。相反，跟踪函数（torch.jit.trace）接受张量作为输入/输出。因此，这个适配器类有助于将\
  \ Detectron2 模型的输入展平为张量，使其可被跟踪。此外，它还提供了从展平结果（张量）重建丰富模型输出的工具。该类接受以下输入参数：\n\n+   -\
  \ model：这是要导出的 Detectron2 模型。\n+   - inputs：这可以是丰富的输入（例如字典或对象），并由该类展平成张量以供跟踪。\n\
  +   - inference_func：这是一个可选的 callable，可以在需要时替换模型推理。\n+   - allow_non_tensor：这决定输入/输出是否可以包含非张量对象。它会过滤掉非张量对象以使模型可跟踪，但如果启用，则无法重建丰富的输入/输出。此输入参数的默认值为\
  \ False。\n\n它具有包装原始模型 forward 方法的 forward 方法。此方法提供展平的输出，可以使用该类记录的 schema（outputs_schema）转换为丰富的输出。它还提供了一个数据成员（flattened_inputs）来存储展平的输入。以下是此类的一个用法示例：\n\
  \n```\n# adapter can use rich inputs\nadapter = TracingAdapter(model, inputs)\n\
  # trace with flattened inputs\ntraced = torch.jit.trace(adapter, adapter.flattened_inputs)\n\
  # produces flattened outputs\nflattened_outputs = traced(*adapter.flattened_inputs)\n\
  # convert flattened outputs to rich outputs\noutputs = adapter.outputs_schema(flattened_outputs)\n\
  ```\n\nTraceAdapter 类支持导出中的跟踪和 ONNX（更多内容将在下一章介绍）方法。\n\n\n\n\n\nDetectron2 提供了一个名为\
  \ scripting_with_instances 的函数，用于使用 PyTorch 脚本化函数（torch.jit.script）执行导出。Detectron2\
  \ 模型使用 Instances 类，并且该类的属性可以在急切模式下动态添加。PyTorch 脚本化函数不支持这种动态行为。这就是为什么需要此辅助函数（scripting_with_instances）。它接受以下输入参数：\n\
  \n- model：这是使用脚本化方法导出的 Detectron2 模型\n- fields：它给出模型中 Instances 类使用的属性名称和类型\n\n\
  此方法创建一个名为 new_Instances 的类，与 Instances 类似但具有静态属性。静态属性必须使用辅助方法的 fields 输入参数声明。new_Instances\
  \ 类使模型可追踪。以下是此辅助函数的示例用法：\n\n```\nfields = {\n    \"proposal_boxes\": Boxes,\n  \
  \  \"objectness_logits\": Tensor,\n    \"pred_boxes\": Boxes,\n    \"scores\": Tensor,\n\
  \    \"pred_classes\": Tensor,\n    \"pred_masks\": Tensor,\n    \"pred_keypoints\"\
  : Tensor,\n    \"pred_keypoint_heatmaps\": Tensor,\n}\nmodel.eval()\nscripted_model\
  \ = scripting_with_instances(model, fields)\n```\n\n恭喜！你现在了解了帮助使用追踪和脚本化方法导出 Detectron2\
  \ 模型的两个主要工具。让我们将这些方法应用于之前构建的自定义 Detectron2 模型的导出。\n\n## 导出自定义 Detectron2 模型\n\n\
  我们首先需要安装 Detectron2，加载数据集，并获取用于导出的训练好的模型及其配置文件：\n\n```\n# install\n!python -m pip\
  \ install \\\n'git+https://github.com/facebookresearch/detectron2.git'\n# dataset\n\
  ```\n"
- "## 13\n将 Detectron2 模型部署到浏览器和移动环境\n\n本章介绍开放神经网络交换（ONNX）框架。该框架有助于在多个框架和平台之间共享深度神经网络。当需要将\
  \ Detectron2 模型部署到浏览器或移动环境时，它非常有帮助。本章还描述了 D2Go，这是一个用于以最小的内存存储和计算需求训练、量化并部署模型的框架。使用该框架创建的模型对于部署到移动或边缘设备非常有帮助。\n\
  \n到本章结束时，你将了解 ONNX 框架及其适用场景。你可以将自定义 Detectron2 模型导出为此格式并部署到 Web 或浏览器环境。你还将了解 D2Go\
  \ 框架的优势，并知道如何利用其 Model Zoo 上的预训练模型或使用 D2Go 训练自定义模型。你还可以对自定义模型进行量化，以进一步优化其内存并提高其计算时间。\n\
  \n具体来说，本章涵盖以下主题：\n\n- 使用 ONNX 部署 Detectron2 模型\n- 使用 D2Go 开发移动计算机视觉应用\n\n## 技术要求\n\
  \n你应已完成第 1 章，以便为 Detectron2 拥有合适的开发环境。\n所有代码、数据集和结果均可在本书的 GitHub 页面上获取，地址为 https://github.com/PacktPublishing/Hands-On-Computer-Vision-with-Detectron2。\n\
  \n```\nclass SimplePyTorchModel(nn.Module):\n    def __init__(self):\n        super(SimplePyTorchModel,\
  \ self).__init__()\n        self.linear = nn.Linear(4, 1)\n        self.linear.weight.data.fill_(0.01)\n\
  \        self.linear.bias.data.fill_(0.01)\n\n    def forward(self, X):\n      \
  \  return torch.relu(self.linear(X))\n```\n\n值得注意的是，我们无需训练模型，而是将权重和偏置固定为 0.01 以用于演示目的。以下代码片段随后创建了此简单神经网络的模型并将其置于评估模式：\n\
  \n```\npt_model = SimplePyTorchModel()\npt_model.eval()\n```\n\n现在，我们已准备好使用虚拟输入将模型导出为\
  \ ONNX 格式：\n\n```\ndummy_X = torch.tensor([[1, 2, 3, 4]], dtype=torch.float32)\n\
  model_name = 'onnx_model.onnx'\ntorch.onnx.export(pt_model,\n    dummy_X, model_name,\
  \ verbose=True)\n```\n\n要测试导出的模型，我们首先需要使用以下语句安装 onnx 包：\n\n```\n!pip install onnx\n\
