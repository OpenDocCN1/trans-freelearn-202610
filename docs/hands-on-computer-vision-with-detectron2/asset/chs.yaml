- '# Detectron2 计算机视觉实用指南

  '
- '# 前言


  我与 Van Vung Pham 相识并共事超过 10 年，同时也是他博士学位的学术顾问。Vung 在攻读博士学位期间赢得了多项数据可视化、计算机视觉和机器学习挑战，包括使用
  Detectron2 检测和分类道路损坏。在本书《使用 Detectron2 实战计算机视觉》中，Vung 将带你踏上一段从常见计算机视觉任务开始的学习之旅。然后，他通过利用
  Detectron2 Model Zoo 中的预训练模型，使用简单的代码和惊艳的深度学习模型，逐步指导你开发计算机视觉应用的步骤。


  针对海量数据集上训练的、面向最常见对象类型的现有模型，可以满足常见的计算机视觉任务。然而，本书还专注于针对特定业务需求在自定义领域上开发计算机视觉应用。为此，Vung
  提供了在脑肿瘤数据集上收集和准备数据、训练模型以及微调模型以完成目标检测和实例分割任务的步骤，以说明如何在自定义业务领域上开发计算机视觉应用。


  在他的演示和示例中，Vung 提供了可以方便地在 Google Colab 上执行的代码以及可视化内容，以帮助说明理论概念。在 Google Colab 上执行代码的能力消除了硬件和软件设置的负担，因此你可以快速、方便地开始。可视化让你能够轻松掌握复杂的计算机视觉概念，更好地理解用于计算机视觉任务的深度学习架构，并成为该领域的专家。


  除了为计算机视觉任务开发深度学习模型之外，你还将学习如何将训练好的模型部署到各种环境中。Vung 解释了不同的模型格式，如 TorchScript 和 ONNX
  格式，以及它们各自的执行平台和环境，如 C++ 服务器、Web 浏览器或移动和边缘设备。


  使用 Detectron2 成为开发、部署计算机视觉应用的开发者和专家。


  — *Tommy Dang*


  *德克萨斯理工大学 iDVL 主任、助理教授*

  '
- "# 关于审阅者\n\n**Yiqiao Yin** 是标普 500 公司 LabCorp 的高级数据科学家，为药物诊断和开发提供 AI 驱动的解决方案。他拥有罗切斯特大学的数学文学学士学位和金融理学学士学位。他曾是哥伦比亚大学的统计学博士生，研究兴趣广泛，涵盖表示学习：特征学习、深度学习、计算机视觉和自然语言处理。他曾担任\
  \ EURO STOXX 50 公司拜耳的企业级数据科学家、AQR 的量化研究员（致力于投资组合管理和因子交易的替代量化策略），以及华尔街 T3 Trading\
  \ 的股票交易员。\n\n**Nikita Dalvi** 是一位技术娴熟且经验丰富的专业人士，目前正在萨姆休斯顿州立大学攻读计算与数据科学硕士学位。凭借信息技术背景，她在过去五年中磨练了\
  \ Java 和 Python 等编程语言的技能，并曾在 Deloitte 和 Tech Mahindra 等知名组织任职。出于对编程的热情，她多年来自学了新的语言和技术，并始终紧跟最新的行业趋势和最佳实践。\n\
  \n\n# 其他你可能喜欢的书籍 294\n\n本书还涵盖将 Detectron2 模型部署到生产环境以及为移动设备开发 Detectron2 应用的步骤。具体来说，它介绍了\
  \ Detectron2 支持的模型格式和平台，如 TorchScript 和 ONNX 格式。本书提供了使用跟踪（tracing）和脚本化（scripting）方法将\
  \ Detectron2 转换为这些格式模型的代码。此外，代码片段还演示了如何将 Detectron2 模型部署到 C++ 和浏览器环境中。最后，本书还讨论了\
  \ D2Go——一个用于训练、微调和量化计算机视觉模型的平台，使它们可以部署到计算资源需求较低的移动和边缘设备上。\n\n通读本书，你会发现 Detectron2\
  \ 对于任何想要构建强大计算机视觉应用的人来说都是一个有价值的框架。\n\n## 本书读者对象\n\n如果你是一名深度学习应用开发者、研究人员或软件开发者，且具备一些深度学习的基础知识，那么本书适合你入门并开发面向计算机视觉应用的深度学习模型。即使你已经是计算机视觉专家，对\
  \ Detectron2 的功能感到好奇，或者想学习一些前沿的深度学习设计模式，你也会发现本书很有帮助。如果你想使用 HTML、Android 和 C++ 等平台部署计算机视觉应用，具备一些相关的编程技能将会很有优势。\n\
  \n## 本书内容\n\n第1章“Detectron2 与计算机视觉任务简介”介绍了 Detectron2、其架构以及 Detectron2 可以执行的计算机视觉任务。此外，本章还提供了使用\
  \ Detectron2 开发计算机视觉应用的环境搭建步骤。\n\n第2章“使用现有 Detectron2 模型开发计算机视觉应用”指导你使用 Detectron2\
  \ Model Zoo 中的最先进模型为计算机视觉任务开发应用的步骤。因此，你无需训练自定义模型，即可快速开发实用的计算机视觉应用。\n\n第3章“目标检测应用的数据准备”讨论了使用\
  \ Detectron2 训练模型的数据准备步骤。此外，当现有数据集采用不同格式时，本章还介绍了将标准标注格式转换为 Detectron2 所需数据格式的技术。\n\
  \n第4章“Detectron2 中目标检测模型的架构”深入探讨了 Detectron2 在目标检测任务中的架构。对于理解设计视觉系统深度神经网络时的常用术语，本章至关重要。\n\
  \n第5章“训练自定义目标检测模型”提供了准备数据、训练目标检测模型、选择最佳模型以及执行目标检测推理任务的步骤。此外，本章还详细介绍了通过扩展默认训练器并在训练过程中加入\
  \ hook 来开发自定义训练器的过程。\n\n第6章“检查训练结果并微调 Detectron2 的 Solver”介绍了使用 TensorBoard 检查训练历史的步骤。它采用代码与可视化结合的方式，解释\
  \ Detectron2 求解器及其超参数背后的概念。相关概念包括梯度下降、随机梯度下降、动量以及可变学习率优化器。\n\n第7章“微调目标检测模型”解释了 Detectron2\
  \ 如何处理其输入，并提供了相关代码，用于分析训练数据集中的真实标注框，并找到合适的锚框尺寸和宽高比配置参数值。此外，本章还提供了以滚动方式从训练数据集中计算输入图像像素均值和标准差的代码。如果训练数据集很大且无法装入内存，这些超参数的滚动计算至关重要。\n\
  \n第8章“图像数据增强技术”介绍了 Detectron2 的图像增强系统，该系统包含三个主要组件：Transformation、Augmentation 和\
  \ AugInput。本章描述了这些组件中的类，以及它们在训练 Detectron2 模型时如何协同完成图像增强。\n\n第9章“应用训练时和测试时图像增强”介绍了将这些现有类应用于训练的步骤。本章还解释了如何修改现有代码，以实现需要从不同输入加载数据的自定义技术。此外，本章还详细说明了在测试时应用图像增强以提高准确率的步骤。\n\
  \n第10章“训练实例分割模型”涵盖了以 Detectron2 支持的格式构建数据集并训练分割任务模型的步骤。本章还采用代码与可视化相结合的方式，解释使用 Detectron2\
  \ 开发的实例分割应用的架构。\n\n第11章“微调实例分割模型”介绍了 PointRend——Detectron2 内部的一个项目，有助于提高目标边界的清晰度。本章还介绍了使用现有\
  \ PointRend 模型以及使用 PointRend 训练自定义模型的步骤。\n\n第12章“将 Detectron2 模型部署到服务器环境”引导你完成导出过程，将\
  \ Detectron2 模型转换为可部署的产物。然后，本章提供了将导出模型部署到服务器环境的步骤。\n\n第13章“将 Detectron2 模型部署到浏览器和移动环境”介绍了\
  \ ONNX 框架。当需要将 Detectron2 模型部署到浏览器或移动环境时，它非常有帮助。本章还介绍了 D2Go，用于训练和量化轻量级模型，这些模型对于部署到移动设备或边缘设备极为有用。\n\
  \n## 如何充分利用本书\n\nDetectron2、D2Go 和 PyTorch 都在积极开发中，因此 Detectron2 或 D2Go 可能与你所用的\
  \ PyTorch 版本或 Google Colab 默认提供的 PyTorch 版本不兼容。以下源代码已在 Google Colab 上使用下列版本进行了完整测试：\n\
