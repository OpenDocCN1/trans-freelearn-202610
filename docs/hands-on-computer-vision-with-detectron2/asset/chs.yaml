  \ 20.1962, 20.1962]\n```\n"
- "## 图像增强技术\n\n图像增强技术极大地帮助提升了计算机视觉深度学习模型的鲁棒性和准确性。Detectron2 和许多其他现代计算机视觉架构都使用图像增强。因此，理解图像增强技术以及\
  \ Detectron2 如何使用它们至关重要。本节介绍图像增强**是什么**、**为什么**它们很重要，并介绍执行它们常用的方法（**如何做**）。接下来的两节将解释\
  \ Detectron2 在训练和推理过程中如何使用它们。\n\n### 为什么需要图像增强？\n\n权重数量较少的深度学习架构可能不够准确（**偏差问题**）。因此，现代架构往往复杂且拥有海量权重。训练这些模型通常需要多次遍历训练数据集；一个\
  \ epoch 意味着整个训练数据集被模型完整遍历一次。因此，海量权重可能意味着模型倾向于记忆训练数据集中的琐碎特征（**过拟合问题**），并且在未来未见过的数据上表现不佳（**方差问题**）。\n\
  \n一个常用来说明这种情况的典型例子是：一个经过训练的深度学习模型，用于区分金毛寻回犬和哈士奇。它在训练和评估集上表现出很高的准确率。然而在实际应用中，它的表现却很差。进一步检查模型后发现，它利用图像中下雪的背景来区分哈士奇和金毛，而不是它们真正的特征。因此，检测对象必须被置于不同的环境中。\n\
  \n一个直接的解决方案是拥有更多的训练数据。然而，在许多情况下，获取更多图像可能并不可行。例如，从患者那里收集医学图像可能会受到法律限制。即使可以收集更多图像，这些领域的人工标注成本也可能非常高昂，因为需要高技能的专业人员进行标注。因此，图像增强技术非常重要。\n\
  \n### 什么是图像增强？\n\n图像增强技术会变换图像及其相关标注（例如，边界框、分割掩码和关键点），并生成略有不同的副本。相同输入的副本可以让模型获得具有不同上下文的更多训练数据，从而应对过拟合并提升鲁棒性。得益于图像增强，一些现代计算机视觉深度学习架构甚至可以生成在训练期间从未重复查看同一图像的模型。下面介绍最重要且最实用的图像增强技术。\n\
  \n- **饱和度：** 该技术改变输入图像颜色通道的鲜艳程度。它类似于向当前颜色中混入一定量的白色。例如，向蓝色中加入一些白色，会使蓝色变浅。\n- **亮度：**\
  \ 该技术改变输入图像的光照条件。它类似于向颜色中施加一定量的光线。如果没有光线，输入就会变成黑色。\n- **曝光度：** 该技术类似于亮度。但曝光度偏向于提亮高光色调，而亮度对所有色调进行同等改变。\n\
  - **灰度化：** 该技术将输入图像转换为单通道图像。换句话说，像素值通常范围从 0 到 255，且只有一个通道；或者，如果保留三个通道，则每个像素位置的所有通道值相同。\n\
  - **模糊：** 该技术对图像进行平滑处理，使模型对相机对焦更鲁棒。例如，如果使用高斯模糊，某个像素取其周围像素的加权平均值（权重服从高斯分布）。\n- **噪声：**\
  \ 该技术向图像添加随机噪声（通常是椒盐噪声）并生成一个新版本。这种方法使训练模型对相机伪影更鲁棒，并有助于应对对抗性攻击。\n\n现在，我们来看看几何畸变。\n\
  \n### 几何畸变\n\n这一类别包括翻转、裁剪、旋转和错切等技术。图 8.2 展示了这些技术的示例：\n\n![](img/0e7994c850a84b7a53d34c7f943c7edd_181_0.png)\n\
  \n![](img/0e7994c850a84b7a53d34c7f943c7edd_181_1.png)\n\n![](img/0e7994c850a84b7a53d34c7f943c7edd_181_2.png)\n\
  \n![](img/0e7994c850a84b7a53d34c7f943c7edd_181_3.png)\n\n图 8.2：几何畸变中增强技术的示例\n\n\
  让我们更详细地了解这些技术：\n\n- **Cutout（随机遮挡）：** 该技术移除输入图像的一部分（用其他值替换，如黑色或数据集中图像的平均颜色）并生成一个新版本。这种技术有助于让训练模型对某些其他物体可能遮挡目标物体一部分的情况更鲁棒。该技术迫使模型从整体上学习物体的特征，而不仅仅是关注某个特定部分。根据剪切区域的不同，该技术可能会或可能不会改变输入图像的标注。\n\
  - **MixUp：** 该技术将两个输入图像及其相关标注按不同比例混合成一张图像，并创建新的训练数据项。它允许我们在成对输入图像及其标签的凸组合上训练模型。这些凸组合会对训练模型进行正则化，使其倾向于在训练样本之间表现出简单的线性行为。\n\
  - **CutMix：** 该技术根据定义的比例，将一个输入图像的区域替换为另一图像的一部分，从而生成新的版本。该技术可能会移除输入图像中的标注，并包含另一图像中的标注。这种方法结合了\
  \ Cutout 和 MixUp 方法的优点，效果良好。\n- **Mosaic：** 该技术根据一些定义的比例组合四张图像（而 CutMix 是两张），从而生成新的版本。该技术利用了前面列出的其他图像遮挡技术的优点。此外，如果由于计算资源有限而导致\
  \ mini-batch 尺寸较小，这种技术也很有用，因为在这种情况下，一张图像相当于四张图像。\n\n恭喜！到现在，你应该已经理解图像增强技术是什么、为什么重要，以及如何执行它们。下一节将介绍如何使用\
  \ Detectron2 应用图像增强技术。\n\n### Detectron2 的图像增强系统\n\nDetectron2 的图像增强系统包含三类主要的类：`Transformation`、`Augmentation`\
  \ 和 `AugInput`。这些组件帮助增强图像及其相关标注（例如，边界框、分割掩码和关键点）。此外，该系统允许你应用一系列声明式的增强语句，并支持增强自定义数据类型和自定义操作。图\
  \ 8.4 展示了 Detectron2 增强系统的简化类图：\n\n\n\n以下代码片段创建了一些帮助程序，用于可视化 Transformation 和 Augmentation\
  \ 类的输入和输出。以下是显示图像原始尺寸的帮助方法：\n\n```python\n# some import statements are removed for\
  \ space efficiency\ndef imshow(image):\n    dpi = plt.rcParams[\"figure.dpi\"]\n\
  \    im_data = image[:, :, ::-1]\n    height, width, depth = im_data.shape\n   \
  \ figsize = width / float(dpi), height / float(dpi)\n    fig = plt.figure(figsize=figsize)\n\
  \    plt.imshow(im_data)\n    plt.axis(\"off\")\n    plt.show()\n```\n\n以下方法（visualize_image_boxes）可在输入图像上可视化边界框：\n\
  \n```python\ndef visualize_image_boxes(img, boxes, colors=['k']):\n    v = Visualizer(img,\
  \ metadata={})\n    v = v.overlay_instances(\n        boxes           = boxes,\n\
  \        assigned_colors = colors*len(boxes)\n    )\n    im_data = v.get_image()\n\
  \    imshow(im_data)\n```\n\n最后，以下方法（visualize_sample）将字典（sample）作为输入，加载图像和边界框，并利用之前构建的方法对它们进行可视化：\n\
  \n```python\ndef visualize_sample(sample):\n    img = sample['image'].to(\"cpu\"\
  ).numpy()\n    img = np.moveaxis(img, 0, -1)\n    boxes = sample['instances'].get('gt_boxes')\n\
  \    visualize_image_boxes(img, boxes)\n```\n\n这些方法有助于以图像的实际尺寸可视化 Detectron2 数据集中提取的数据样本及其对应的边界框。\n\
  \n- **NoOpTransform 类**也是 `Transform` 类的子类。它的实例用于诸如在光度失真类别的变换类中返回 `inverse()` 方法等场景。它什么也不做。具体而言，`apply_image`\
  \ 和 `apply_coords` 抽象方法的实现返回其对应的输入，而 `inverse` 方法的实现返回此类自身的当前对象（`self`）。\n\n- **ResizeTransform\
  \ 类**是最常用的变换之一，因为其他变换和深度学习模型通常要求图像大小相同。相比之下，输入图像可能具有不同的尺寸。此变换接受原始图像高度和宽度（`h`、`w`）、期望高度和宽度（`new_h`、`new_w`）以及插值方法（`interp`），并据此执行缩放。\n\
  \n- **ExtentTransform 类**：此类接收输入图像的一个子区域（`src_rect`，采用 `XYXY_ABS` 格式）、期望输出尺寸（`h`、`w`）以及插值方法（`interp`），并使用给定的插值方法将提取的区域调整为期望尺寸。此外，如果任何输入子区域尺寸大于输入图像，则使用填充颜色（`fill`\
  \ 输入参数）进行填充。以下代码片段说明了此类的用法：\n\n```python\n# data\nimg = cv2.imread(\"Chapter08/1.jpg\"\
  )\nboxes = [[150, 140, 350, 420]]\nvisualize_image_boxes(img, boxes = boxes, colors=['k'])\n\
  # transform\ne_tfm = T.ExtentTransform(\n        src_rect = (100, 100, 400, 470),\n\
  \        output_size = img.shape[:2]\n    )\net_img = e_tfm.apply_image(img)\net_boxes\
  \ = e_tfm.apply_box(boxes)\nvisualize_image_boxes(et_img, boxes = et_boxes)\n```\n\
  \n此片段加载一个带有真实框的示例图像。然后，它创建一个 ExtentTransform 对象并调用 `apply_image` 和 `apply_box` 来相应地转换输入图像和真实框。*图\
  \ 8.5* 显示了此代码片段的输出：\n\n```python\nY_range = np.array(Y_range)\nX, Y = np.meshgrid(X_range,\
  \ Y_range)\ngrid = np.expand_dims(np.stack([X, Y], axis=2), axis=0)\ngrid = grid.astype('float32')\n\
  super().__init__(grid=grid, interp=\"nearest\")\nself.X_range = X_range\nself.Y_range\
  \ = Y_range\n```\n\n此方法（__init__）为从 pi 到 0 等距分布的角度生成余弦值范围，宽度为 441 点，高度为 543 点。然后将它们用于创建网格并初始化其超类的对象（GridSampleTransform）。此外，请注意，范围为\
  \ [np.pi, 0] 的余弦波返回 [-1, 1] 的范围，这正是 GridSampleTransform 类输入参数所期望的。\n\nGridSampleTransform\
  \ 有助于转换输入图像。然而，它不支持 apply_coords 方法。因此，我们需要编写 apply_box 方法来执行框变换。此 apply_box 方法利用\
  \ _apply_1_box 对其所有输入框执行变换。_apply_1_box 方法是一个内部帮助方法，用于对单个边界框执行变换。它包含以下代码：\n\n```python\n\
  gs_box = np.array(box)\nimg_width = self.img_w\nimg_height = self.img_h\nX_range\
  \ = self.X_range\nY_range = self.Y_range\nx0x1 = 2*gs_box[[0, 2]]/img_width - 1\n\
  y0y1 = 2*gs_box[[1, 3]]/img_height - 1\nx0x1 = [X_range.searchsorted(x0x1[0]),\n\
  \        X_range.searchsorted(x0x1[1])]\ny0y1 = [Y_range.searchsorted(y0y1[0]),\n\
  \        Y_range.searchsorted(y0y1[1])]\ngs_box = [min(x0x1), min(y0y1), max(x0x1),\
  \ max(y0y1)]\nreturn gs_box\n```\n\n此方法（`_apply_1_box`）找到左上角（x0, y0）和右下角（x1, y1）的\
  \ X 和 Y 坐标，并按图像的宽度和高度进行归一化，坐标中心位于图像中心。归一化确保图像的左上角具有 [-1, -1] 坐标，图像的右下角具有 [1, 1]\
  \ 坐标，并且原点 [0, 0] 位于图像中心。此归一化反映了图像坐标值在转换为余弦值后的情况。最后，它使用 searchsorted 方法根据余弦坐标找到像素坐标。\n\
  \n现在，我们可以像迄今为止学到的其他类一样使用此类：\n\n```python\nfc_tfm = PincushionTransform(*img.shape[:2])\n\
  fc_img = fc_tfm.apply_image(img)\nfc_boxes = fc_tfm.apply_box(boxes)\nvisualize_image_boxes(fc_img,\
  \ boxes = fc_boxes)\n```\n\n*图 8.8* 显示了此失真方法（右）的输出与其原始输入（左）的对比：\n\n![](img/0e7994c850a84b7a53d34c7f943c7edd_192_0.png)\n\
  \n原始图像和真实框\n\n枕形图像和真实框\n\n图 8.8：原始图像和真实框及其枕形版本\n\n![](img/0e7994c850a84b7a53d34c7f943c7edd_194_0.png)\n\
  \n图 8.9：源图像、目标图像及其混合版本\n\n- **PadTransform 类**用 `pad_value`（默认为 0.0）和 `seg_pad_value`（默认为\
  \ 0）分别在输入图像和分割掩码（如果有）的左侧、顶部、右侧和底部填充 x0、y0、x1 和 y1 像素。此外，如果你想使此变换可逆，可以指定原始宽度和高度（`orig_w`\
  \ 和 `orig_h`）。\n\n- **TransformList 类**扩展了 `Transform` 类，因此具有执行变换操作的类似方法。它接受输入参数作为变换列表（`transforms`）并将其作为属性维护。其方法按顺序将此列表中的所有变换应用于输入。例如，`TransformList`\
  \ 对象的 `transforms` 属性中有一个 `CropTransform` 对象和一个 `PadTransform` 对象。调用此对象的 `apply_image`\
  \ 方法首先裁剪图像，然后填充它。此场景有助于训练鲁棒模型以检测超出其特定内容的物体。例如，从哈士奇身上裁剪出雪景背景，迫使模型从哈士奇本身学习特征，而不是其背景上下文。\n\
  \n以下代码片段说明了如何使用 `CropTransform`、`PadTransform` 和 `TransformList` 类：\n\n```python\n\
  x0, y0, w, h = (130, 130, 250, 310)\ny1, x1 = img.shape[:2] - np.array([y0+h, x0+w])\n\
  cr_tfm = T.CropTransform(x0, y0, w, h)\npd_tfm = T.PadTransform(x0, y0, x1, y1)\n\
  lst_tfm = T.TransformList([cr_tfm, pd_tfm])\nlst_img = lst_tfm.apply_image(img)\n\
  lst_boxes = lst_tfm.apply_box(boxes)\nvisualize_image_boxes(lst_img, boxes = lst_boxes)\n\
  ```\n\n\n\n\n\nAugmentation 类是供所有增强类扩展的基类。有两个需要注意的重要方法：`get_transform(self, *args)`\
  \ 和 `__call__(self, aug_input)`。其所有子类都会重写 `get_transform` 方法，以接受一组命名输入参数并生成一个变换对象。这组参数的名称应能被\
  \ `AugInput` 接受（我们将在下一节了解）。`__call__` 方法使其子类能够直接与 `AugInput` 配合使用（下一节将详细介绍）。\n\n\
  FixedSizeCrop 类将 `crop_size` 作为元组 `(height, width)` 传入，从原始输入中随机裁剪该尺寸的区域。如果该尺寸大于原始图像，它会检查\
  \ `pad` 选项是否为 `True`。如果为 `True`，则会分别使用 `pad_value` 和 `seg_pad_value` 在右侧和底部填充输入图像和分割掩码（原始图像始终位于左上角）。该类有助于生成相同大小的输入，而深度学习模型通常需要这样的输入。以下代码片段说明了此增强类的用法：\n\
  \n```\nfsc_aug = T.FixedSizeCrop(crop_size = (300, 300), pad=True,\n pad_value=128)\n\
  fsc_tfm = fsc_aug.get_transform(img)\nfsc_img = fsc_tfm.apply_image(img)\nfsc_boxes\
  \ = fsc_tfm.apply_box(boxes)\nvisualize_image_boxes(fsc_img, fsc_boxes)\n```\n\n\
  首先，该代码片段初始化裁剪大小并设置填充选项，然后通过 `get_transform` 方法获取一个变换对象。如前一节所讨论，这个对象随后可以用作确定性变换对象。换句话说，它会从不同输入中裁剪出相同的区域。此外，将相同的变换应用于不同大小的输入将无法正常工作：\n\
  \n![](img/0e7994c850a84b7a53d34c7f943c7edd_196_0.png)\n\n原始图像与真实边界框\n\n![](img/0e7994c850a84b7a53d34c7f943c7edd_196_1.png)\n\
  \n裁剪后的版本\n\n图 8.11：原始图像、真实边界框及其裁剪后的版本\n\n## RandomApply 类\n\n它接受的输入参数包括一个 `Transform`\
  \ 或 `Augmentation` 类的实例（`tfm_or_aug`）和一个概率（`prob`，默认值为 0.5），该概率决定是否执行这种变换或增强。以下代码片段说明了此类的用法：\n\
  \n```\nra_aug = T.RandomApply(fsc_tfm, prob = 0.3)\nra_fsc_tfm = ra_aug.get_transform()\n\
  ra_fsc_img = ra_fsc_tfm.apply_image(img)\nra_fsc_boxes = ra_fsc_tfm.apply_box(boxes)\n\
  visualize_image_boxes(ra_fsc_img, ra_fsc_boxes)\n```\n\n如果我们多次运行整段代码（在其他次运行中会得到不同的\
  \ `Transform` 对象），那么其中一些结果可能会被裁剪（如图 8.11 右侧所示），而另一些可能不会被裁剪（输入保持与图 8.11 左侧相同）。\n\n\
  ## RandomCrop 类\n\n`RandomCrop` 类将 `crop_type` 和 `crop_size` 作为输入参数。我们来看一下不同的 `crop_type`\
  \ 值及其工作方式：\n\n- `\"relative\"`：`crop_size` 必须在 `(0, 1]` 范围内（按图像大小 HxW 归一化）。然后，它会在图像中裁剪一个随机区域，其大小为\
  \ H*crop_size[0]、W*crop_size[1]。\n- `\"relative_range\"`：从 `[crop_size[0], 1]` 中均匀随机采样一个值赋给\
  \ `crop_size[0]`；对 `crop_size[1]` 执行相同操作。然后，新的 `crop_size` 按 `crop_type = \"relative\"\
  ` 的方式使用。\n- `\"absolute\"`：`crop_size` 必须小于输入图像的大小。它会在图像中裁剪一个随机区域，其大小为 `crop_size[0]`、`crop_size[1]`。\n\
  - `\"absolute_range\"`：从当前值和图像高度（`[crop_size[0], H]`）之间均匀随机采样一个值赋给 `crop_size[0]`；对\
  \ `crop_size[1]` 执行相同操作。然后，新的 `crop_size` 按 `crop_type = \"absolute\"` 的方式使用。\n\n\
  以下代码片段说明了此类的用法：\n\n```\nrc_aug = T.RandomCrop(\n    crop_type=\"relative\",\n  \
  \  crop_size=(0.5, 0.5))\nrc_tfm = rc_aug.get_transform(img)\nrc_img = rc_tfm.apply_image(img)\n\
  rc_boxes = rc_tfm.apply_box(boxes)\nvisualize_image_boxes(rc_img, rc_boxes)\n```\n\
  \n## RandomExtent 类\n\n它将 `scale_range` 和 `shift_range` 这两个大小为 2 的元组作为输入参数。前者用于决定裁剪子区域的大小，后者用于决定提取子区域的位置。具体来说，`scale_range`\
  \ 元组指定了一个具有低值（l）和高值（h）的范围；从该范围中均匀随机采样一个值（r）；然后，输出图像的尺寸为 r*H 和 r*W（其中 H 和 W 分别是输入图像的高度和宽度）。第二个参数\
  \ `shift_range` 是另一个大小为 2 的元组 `(x, y)`。从 `[-x, x]` 和 `[-y, y]` 范围中分别均匀随机采样两个值 `x_shift`\
  \ 和 `y_shift`；然后，裁剪区域还会围绕输入图像中心偏移 `x_shift*W/2` 和 `y_shift*H/2`。以下代码片段说明了此类的使用模式：\n\
  \n```\nre_aug = T.RandomExtent(\n    scale_range=(0.5, 0.9),\n    shift_range=(0.3,\
  \ 0.3))\nre_tfm = re_aug.get_transform(img)\nre_img = re_tfm.apply_image(img)\n\
  re_boxes = re_tfm.apply_box(boxes)\nvisualize_image_boxes(re_img, re_boxes)\n```\n\
  \n图 8.12 展示了该代码片段的一些示例输出（右侧）和原始输入（左侧）。可以看到，在原始输入（左侧）中，输入图像中心放置了一个虚线框。`shift_range`\
  \ 参数决定该虚线框的大小。系统会在此框内随机选择一个点，作为裁剪区域的中心。`scale_range` 参数决定裁剪区域（实线框）的大小：\n\n![](img/0e7994c850a84b7a53d34c7f943c7edd_198_0.png)\n\
  \n![](img/0e7994c850a84b7a53d34c7f943c7edd_198_1.png)\n\n图 8.12：原始图像、真实边界框及其 RandomExtent\
  \ 版本\n\n## RandomFlip 类\n\n`RandomFlip` 类接受一个概率（`prob`）和两个布尔值（`horizontal` 和 `vertical`）。`prob`\
  \ 参数用于决定是否执行翻转；如果结果为执行翻转，另外两个参数分别决定是否水平翻转和垂直翻转。以下代码片段说明了此类的用法：\n\n```\nrf_aug =\
  \ T.RandomFlip(prob        = 0.5,\n                    horizontal = True,\n    \
  \                vertical   = False)\nrf_tfm = rf_aug.get_transform(img)\nrf_img\
  \ = rf_tfm.apply_image(img)\nrf_boxes = rf_tfm.apply_box(boxes)\nvisualize_image_boxes(rf_img,\
  \ rf_boxes)\n```\n\n当多次整体运行此代码片段时，大约有 50% 的情况下输入会水平翻转，并且永远不会垂直翻转。\n\n## RandomRotation\
  \ 类\n\n`RandomRotation` 类将 `angle`、`expand`、`center`、`sample_style` 和 `interp` 作为输入参数。`expand`\
  \ 参数决定是否应扩展输出大小，以适配旋转后的图像尺寸。`sample_style` 参数可以是 `\"range\"` 或 `\"choice\"`。\n\n\
  如果为 `\"range\"`（默认），则会发生以下情况：\n\n- `angle` 参数是一个度数范围 `[min, max]`，用于均匀采样一个旋转角度值。\n\
  - `center` 参数是一个相对区间 `[[minx, miny], [maxx, maxy]]`，用于从中采样旋转中心；其中 `[0, 0]` 表示图像左上角，`[1,\
  \ 1]` 表示图像右下角。\n\n如果为 `\"choice\"`，则会发生以下情况：\n\n- `angle` 参数是一个可供选择的旋转角度值列表。\n-\
  \ `center` 参数为 `None`，表示旋转中心是输入图像的中心。\n\n以下代码片段说明了此类的使用模式：\n\n```\nrr_aug = T.RandomRotation(\n\
  \        angle        = [-30, 30],\n        sample_style = \"range\",\n        center\
  \       = [[0.4, 0.6], [0.4, 0.6]],\n        expand       = False\n        )\nrr_tfm\
  \ = rr_aug.get_transform(img)\n```\n\n```\n```python\nrr_img = rr_tfm.apply_image(img)\n\
  rr_boxes = rr_tfm.apply_box(boxes)\nvisualize_image_boxes(rr_img, rr_boxes)\n```\n\
  ```\n\n该代码片段会随机采样一个介于 -30 到 30 度之间的角度值，并在中心附近采样另一个值，以旋转输入数据。\n\n## Resize 类\n\n\
  该类非常简单。它将目标尺寸（`shape=(height, width)`）和插值方法（`interp`）作为输入参数。其 `get_transform(image)`\
  \ 方法返回一个 `ResizeTransform` 对象，用于将输入图像和相关标注调整为目标尺寸。以下代码片段说明了此类的用法：\n\n```\n```python\n\
  rs_aug = T.Resize(\n        shape=(640, 640)\n)\nrs_tfm = rs_aug.get_transform(img)\n\
  rs_img = rs_tfm.apply_image(img)\nrs_boxes = rs_tfm.apply_box(boxes)\nvisualize_image_boxes(rs_img,\
  \ rs_boxes)\n```\n```\n\n此代码片段将输入图像调整为固定的目标尺寸。这是常用的图像预处理步骤，因为神经网络通常需要相同大小的输入。然而，如果目标尺寸具有不同的宽高比，该技术不会保留输入图像的宽高比。\n\
  \n## RandomResize 类\n\n`RandomResize` 类将 `shape_list` 和 `interp` 作为输入参数。它会使用给定的插值方法（`interp`），将输入调整为从\
  \ `shape_list` 中采样得到的某个尺寸 `(h, w)`。以下代码片段说明了此类的使用模式：\n\n```\n```python\nrrs_aug\
  \ = T.RandomResize(\n        shape_list=[(320, 320), (640, 640)]\n)\nrrs_tfm = rrs_aug.get_transform(img)\n\
  rrs_img = rrs_tfm.apply_image(img)\nrrs_boxes = rrs_tfm.apply_box(boxes)\nvisualize_image_boxes(rrs_img,\
  \ rrs_boxes)\n```\n```\n\n\n这段代码片段从指定的长度列表中随机选取一个值，然后将输入的较短边调整为该采样长度。如果输出的较长边大于1,333，它会继续调整图像尺寸（同时保持宽高比），以确保不超过该数值。\n\
  \n`RandomCrop` 和 `CategoryAreaConstraint` 类接受 `crop_type`、`crop_size`、`single_category_max_area`\
  \ 和 `ignored_category` 作为输入参数。前两个参数与 `RandomCrop` 类中的参数类似。然而，该类的特别之处在于，它会寻找一个裁剪区域，在该区域中，对于语义分割而言，没有任何单个类别占据的比例大于\
  \ `single_category_max_area` 中指定的值。该值以0到1的比例形式指定（设置为1.0可禁用此功能）。最后一个参数设置类别的id，该类别不必遵循此约束。请注意，此函数采用尽力而为的策略，最多只会尝试10次来满足指定条件。以下代码片段演示了该类的使用方式：\n\
  \n```python\ncac_aug = T.RandomCrop_CategoryAreaConstraint(\n    crop_type     \
  \           = \"relative\",\n    crop_size                = (0.5, 0.5),\n    single_category_max_area\
  \ = 0.5,\n    ignored_category         = None\n)\nsem_seg = np.zeros(img.shape[:2])\n\
  cac_tfm = cac_aug.get_transform(img, sem_seg=sem_seg)\ncac_img = cac_tfm.apply_image(img)\n\
  cac_boxes = cac_tfm.apply_box(boxes)\nvisualize_image_boxes(cac_img, cac_boxes)\n\
  ```\n\n请注意，除了输入图像之外，`get_transform` 方法还需要提供 `sem_seg` 参数，因为该类别用于语义分割。因此，这段代码示例创建了一个仅包含全零的虚拟语义分割掩码，以便进行说明。\n\
  \n`MinIoURandomCrop` 类接受 `min_ious`、`boxes`、`min_crop_size`、`mode_trials` 和 `crop_trials`\
  \ 作为输入参数。该增强操作尝试执行随机裁剪，并确保输出满足输入图像（由 `min_crop_size` 控制）和边界框（由 `min_ious` 控制）的 IoU\
  \ 要求。`min_crop_size` 参数以输入高度和宽度 (H, W) 的比例表示（范围从 0 到 1）。该类最多按以下方式执行 `mode_trials`\
  \ 次，其中裁剪区域表示为 `(top, left, new_h, new_w)`：\n\n- I. 从 [0, *min_ious, 1] 中采样一个 `min_iou`\
  \ 值。\n- II. 最多执行 `crop_trials` 次，执行以下操作：\n  - i. 从 `(min_crop_size*W, W)` 和 `(min_crop_size*H,\
  \ H)` 中采样两个值以生成 `new_h` 和 `new_w`。如果裁剪尺寸比例超出 `[0.5, 2.0]` 范围，或裁剪区域退化为一条线或一个点，导致输入过度变形，则会持续重新采样。\n\
  \  - ii. 一旦有了新尺寸，就从 `[H - new_h]` 和 `[W - new_w]` 中采样 `top` 和 `left` 值。如果裁剪区域与任何真实边界框的\
  \ IoU 小于 `min_iou`，则继续执行第 II 步。\n\n以下代码片段演示了该类的使用方式：\n\n```python\niou_aug = T.MinIoURandomCrop(\n\
  \    min_ious     = [0.5, 0.6, 0.7],\n    min_crop_size = 0.5,\n    mode_trials\
  \   = 1000,\n    crop_trials   = 50\n)\niou_tfm = iou_aug.get_transform(img, boxes=boxes)\n\
  iou_img = iou_tfm.apply_image(img)\niou_boxes = iou_tfm.apply_box(boxes)\nvisualize_image_boxes(iou_img,\
  \ iou_boxes)\n```\n\n请注意，除了输入图像之外，`get_transform` 方法还需要真实边界框，因为该增强作用于边界框。此增强非常重要，因为它能在保留真实边界框的同时，尝试去除部分外部上下文。这种技术能够让模型专注于从物体本身而非其上下文中学习特征。\n\
  \n请注意，我们可能需要对输入图像进行归一化，或为 `scale` 选择一个较高的值。默认的特征向量和特征值是针对 RGB 图像的，而此代码片段处理的是 BGR\
  \ 图像。因此，该代码片段会反复反转颜色通道。\n\n**AugmentationList 类**接受一个变换或增强（augs）列表作为输入参数。此类帮助将变更（augs）按顺序应用到输入上。此类不实现\
  \ `get_transform()` 方法；相反，它利用 `__call__` 方法将增强或变换应用到包装在 `AugInput` 内部的输入上。\n\n以下部分将进一步介绍\
  \ `AugInput` 及其使用方式。\n\n## AugInput 类\n\n这个特殊的类封装了用于增强对象输入的数据。具体来说，该类的实例包括输入图像（`image`）和相关信息标注的属性，包括边界框（`boxes`）和语义分割（`sem_seg`）。此类有一个名为\
  \ `transform(tfm: Transform)` 的方法，它接受一个 Transform 对象（`tfm`）作为输入参数，并对其所有属性（`image`、`boxes`\
  \ 和 `sem_seg`）原地执行相应的变换。如果需要，用户可以定义一个类似的类，通过提供属性访问（`getattr`）和相应的变换方法，来包含需要被变换的额外属性，从而对这些属性原地执行额外的变换，并返回一个\
  \ Transform 对象。\n\n尽管该类拥有可以单独使用的 `transform` 方法，但它主要的使用模式是作为 `Augmentation` 对象 `__call__`\
  \ 方法的输入。在这种情况下，`Augmentation` 类的 `transform` 操作会原地修改输入，并返回一个 `Transform` 类的对象，以便在必要时对其他输入执行增强。该方法利用\
  \ `aug_input`（一个 `AugInput` 类的对象）中的属性名称，将相应的属性值传递给 `get_transform` 方法，生成一个变换对象，然后对\
  \ `aug_input` 对象中的数据执行相应的变换。`AugInput` 类的一个使用示例可以在以下代码片段中看到：\n\n```python\n# AugmentationList\n\
  rse_aug = T.ResizeShortestEdge(\n    short_edge_length = (640, 672, 704, 736, 768,\
  \ 800),\n    max_size        = 800,\n    sample_style    = 'choice')\nrf_aug = T.RandomFlip(\n\
  \    prob       = 0.5,\n    horizontal = True,\n    vertical   = False)\naugs =\
  \ [rse_aug, rf_aug]\naugmentation = T.AugmentationList(augs)\n```\n\n```python\n\
  # AugInput\ninput = T.AugInput(img, boxes=boxes)\n# Transformation\ntfms = augmentation(input)\n\
  tfm_img = input.image\ntfm_boxes = input.boxes\nvisualize_image_boxes(tfm_img, tfm_boxes)\n\
  ```\n\n此代码片段展示了 Detectron2 中最常用的增强操作。它创建了一个包含两个增强操作的列表，用于调整输入大小并随机水平翻转。在这种情况下，增强操作会原地应用到输入上。因此，`input.image`\
  \ 和 `input.boxes` 会返回这些属性的变换后版本。此外，返回的对象（`tfms`）是增强对象中 `Transform` 对象的一个实例，可用于修改其他输入。此代码片段展示了\
  \ Detectron2 中使用的确切默认增强操作。然而，它有助于说明，使用声明式方法可以相对容易地接入现有的图像增强和变换。如果您需要创建自定义图像增强技术，请继续阅读——下一章将展示如何创建自定义图像增强，以及如何在测试时应用图像增强。\n\
  \n恭喜！至此，您应该已经掌握了重要的图像增强技术，并对 Detectron2 提供的变换和增强有了深入的了解。\n\n## 总结\n\n本章介绍了图像增强以及为什么在计算机视觉中进行图像增强至关重要。然后，我们介绍了常见且最先进的图像增强技术。在理解理论基础之后，我们研究了\
  \ Detectron2 的图像增强系统，该系统包含三个主要组件及其相关类：`Transform`、`Augmentation` 和 `AugInput`。Detectron2\
  \ 提供了一种声明式方法，可以方便地应用现有的增强操作。\n\n现有系统支持对单个输入进行增强，而一些现代图像增强技术需要来自不同输入的数据。因此，下一章将向您展示如何修改\
  \ Detectron2 的几个数据加载器组件，以便应用现代图像增强技术。下一章还将介绍如何在测试时应用增强。\n\n\n\n\n"
- "## Detectron2 数据加载器\n\n在 Detectron2 中应用数据增强既简单又复杂。使用声明式方法并应用 Detectron2 提供的现有变换和增强相对容易，这应该能满足最常见需求。然而，添加需要多个数据样本的自定义增强（例如\
  \ MixUp 和 Mosaic）则有点复杂。本节描述 Detectron2 如何加载数据，以及如何将现有和自定义数据增强整合到 Detectron2 模型训练中。图\
  \ 9.1 展示了 Detectron2 数据加载系统的步骤和主要组件。\n\n![](img/0e7994c850a84b7a53d34c7f943c7edd_209_0.png)\n\
  \n存在 `Dataset`、`Sampler`、`Mapper` 和 `Loader` 这些类。`Dataset` 组件通常以 JSON 格式存储数据项列表。`Sampler`\
  \ 组件帮助从数据集中随机选择一个数据项（`dataset_dict`）。选中的数据项包含图像文件名和标注信息。然后，Mapper 加载实际图像。之后，标注和加载的图像经历增强和数据转换，转换为图像张量和标注的实例。Mapper\
  \ 产生一个数据项，Loader 帮助将这些数据打包成批次并送入训练。一些增强技术可能希望除了当前输入外还加载额外的样本（`dataset_dict(s)` 和\
  \ `image(s)`），这些项目在图 9.1 中用虚线表示。一旦你理解了 Detectron2 如何加载数据，将现有的数据增强整合到 Detectron2\
  \ 训练中就会相对容易。\n\n使用的第二种增强类型是 ResizeShortestEdge，以下代码片段创建并附加该增强：\n\n```\nmin_size\
  \ = cfg.INPUT.MIN_SIZE_TRAIN\nmax_size = cfg.INPUT.MAX_SIZE_TRAIN\nsample_style\
  \ = cfg.INPUT.MIN_SIZE_TRAIN_SAMPLING\naugs.append(\n    T.ResizeShortestEdge(\n\
  \        min_size,\n        max_size,\n        sample_style)\n)\n```\n\n最后，以下代码片段向此自定义训练器使用的增强列表中添加了一个\
  \ RandomFlipping 增强：\n\n```\nif cfg.INPUT.RANDOM_FLIP != \"none\":\n    augs.append(\n\
  \        T.RandomFlip(\n            horizontal=cfg.INPUT.RANDOM_FLIP == \"horizontal\"\
  ,\n            vertical=cfg.INPUT.RANDOM_FLIP == \"vertical\",\n        )\n    )\n\
  ```\n\n使用这种声明式方法，并利用 Detectron2 提供的类来整合不同的增强/变换相对容易，如 MyTrainer 类所示。这些现有的类仅适用于一个数据项（一张图像及其相关标注）。然而，一些有用的图像增强技术可能需要来自多个样本的数据。例如，MixUp\
  \ 从两个数据样本加载输入，而 Mosaic 从四个数据样本加载输入。在这些情况下，有必要重写 Detectron2 数据加载系统的几个组件，以便将来自不同样本的标注合并为一个。下一节将说明这些场景。\n\
  \n### 开发自定义图像增强技术\n\n假设自定义增强需要从一个数据样本（`dataset_dict`）加载标注。在这种情况下，实现自定义增强或变换并使用上一节描述的声明式方法将其整合起来相对简单。本节重点介绍需要加载并组合多个样本输入的更复杂的增强类型。在这些情况下，我们需要重写\
  \ Detectron2 数据加载系统的几个部分。因此，本节描述了 Detectron2 数据加载系统的修改，并开发了两种自定义图像增强（MixUp 和 Mosaic）作为示例。\n\
  \n以下是 `_convert_to_annotations` 方法的代码片段：\n\n```\nannos = []\nfor i, annotation in\
  \ enumerate(dataset_dict.pop(\"annotations\")):\n    bbox = boxes[i]\n    annotation[\"\
  bbox\"] = bbox\n    annotation[\"bbox_mode\"] = BoxMode.XYXY_ABS\n    annos.append(annotation)\n\
  instances = utils.annotations_to_instances(\n    annos, image_shape,\n    mask_format=self.instance_mask_format\n\
  )\nif self.recompute_boxes:\n    gt_boxes = instances.gt_masks.get_bounding_boxes()\n\
  \    instances.gt_boxes = gt_boxes\n    ft_instances = utils.filter_empty_instances(instances)\n\
  \    dataset_dict[\"instances\"] = ft_instances\n```\n\n该方法将数据集字典（`dataset_dict`）作为输入，并使用\
  \ Detectron2 工具函数（`annotations_to_instances`）将 `dataset_dict` 中的标注转换为实例格式。此方法类似于\
  \ `DatasetMapper` 类中的 `_transform_annotations` 方法。但是，我们需要重写此方法，以便在将标注转换为实例之前，使用变换后的边界框，而不是原始\
  \ `dataset_dict` 中的边界框。\n\n我们需要在其扩展版本中重写 `DatasetMapper` 类的 `__call__` 方法，因为我们需要修改当前的\
  \ `dataset_dict` 以合并从其他采样输入加载的更多标注。此方法有三个主要步骤，详述如下：\n\n**步骤 1：** 此步骤使用输入 `dataset_dict`\
  \ 中指定的信息，将图像和相关标注数据读取到 `dataset_dict` 中。此步骤与其原始版本中的完全相同：\n\n```\ndataset_dict =\
  \ copy.deepcopy(dataset_dict)\nimage = utils.read_image(dataset_dict[\"file_name\"\
  ],\n                         format=self.image_format)\nutils.check_image_size(dataset_dict,\
  \ image)\nif \"sem_seg_file_name\" in dataset_dict:\n    sem_seg_gt = utils.read_image(\n\
  \        dataset_dict.pop(\"sem_seg_file_name\"), \"L\"\n    ).squeeze(2)\nelse:\n\
  \    sem_seg_gt = None\n\nboxes = np.array([\n    BoxMode.convert(\n        obj[\"\
  bbox\"],\n        obj[\"bbox_mode\"], BoxMode.XYXY_ABS)\n    for obj in dataset_dict['annotations']])\n\
  ```\n\n**步骤 2：** 此步骤创建一个 `ExtendedAugInput` 对象，将 `dataset_dict` 作为输入参数包含在内，因为我们需要修改此\
  \ `dataset_dict` 以添加来自其他采样输入的额外边界框。除了对 `dataset_dict` 的额外修改外，所有其他步骤与 `DatasetMapper`\
  \ 类的原始版本保持一致：\n\n```\naug_input = ExtendedAugInput(image,\n                    \
  \        sem_seg      = sem_seg_gt,\n                            dataset_dict =\
  \ dataset_dict,\n                            boxes = boxes)\n\ntransforms   = self.augmentations(aug_input)\n\
  image        = aug_input.image\nsem_seg_gt   = aug_input.sem_seg\ndataset_dict =\
  \ aug_input.dataset_dict\nboxes        = aug_input.boxes\n\nimage_shape = image.shape[:2]\n\
  dataset_dict[\"image\"] = torch.as_tensor(\n    np.ascontiguousarray(image.transpose(2,\
  \ 0, 1)))\n```\n\n**步骤 3：** 最后一步利用前面描述的 `_convert_to_annotations` 方法，将 `dataset_dict`\
  \ 中列出的变换/增强数据转换为可被 Detectron2 处理的实例：\n\n```\nif \"annotations\" in dataset_dict:\n\
  \    self._convert_to_annotations(dataset_dict,\n                              \
  \   boxes,\n                                 image_shape)\n```\n\n以下代码片段创建了一个 `Sampler`\
  \ 组件，该组件有助于在执行 MixUp 和 Mosaic 等增强时采样额外输入：\n\n```\nfrom detectron2.data import DatasetCatalog\n\
  \nclass DataDictSampler():\n    def __init__(self, name_ds):\n        ds = DatasetCatalog.get(name_ds)\n\
  \        self.ds = ds\n    def get_items(self, n=3):\n        indices = np.random.randint(\n\
  \            low  = 0,\n            high = len(self.ds)-1,\n            size = n)\n\
  \        return [copy.deepcopy(self.ds[_]) for _ in indices]\n```\n\n此代码片段接受一个已在\
  \ Detectron2 中注册的数据集名称，并加载其数据（JSON 格式）。然后，它构建一个方法（`get_items`）来随机采样一些输入以执行增强。对数据项进行深拷贝是必要的，因为增强可能会改变原始数据。\n\
  \n恭喜！拥有了这些扩展类之后，我们就可以编写自定义增强类，将不同输入的标注组合在一起。\n\n### 开发 MixUp 图像增强技术\n\nMixUp 是一种有用且现代的图像增强技术，在前一章中已有介绍。Detectron2\
  \ 没有为这种图像增强技术提供内置类。因此，本节提供了开发此图像增强技术的步骤。以下代码片段创建了 MixUp 增强类：\n\n```\nclass MixUpAug(T.Augmentation):\n\
  \    def __init__(self, cfg, src_weight=0.5, dst_weight=0.5):\n        self.cfg\
  \ = cfg\n        self.sampler = DataDictSampler(cfg.DATASETS.TRAIN[0])\n       \
  \ self.src_weight = src_weight\n        self.dst_weight = dst_weight\n    def get_transform(self,\
  \ image, dataset_dict):\n        cfg = self.cfg\n        # Step 1: get one more\
  \ random input\n        # Step 2: append annotations and get mix-up boxes\n```\n\
  \n\n\n\n\n```\nmu_boxes  = mu_boxes,\nsrc_weight  = self.src_weight,\ndst_weight\
  \  = self.dst_weight)\n```\n\n以下代码片段创建了 MixUpTransform 类：\n\n```\nclass MixUpTransform(T.Transform):\n\
  \    def __init__(self, image, mu_image, mu_boxes,\n                 src_weight\
  \ = 0.5,\n                 dst_weight = 0.5):\n        # Step 1: resize the mu_image\
  \ and mu_boxes\n        # Step 2: pad mu_image\n        # Step 3: save values\n\
  \    def apply_image(self, image):\n        bl_tfm = T.BlendTransform(src_image\
  \  =self.mu_image,\n                                 src_weight  =self.src_weight,\n\
  \                                 dst_weight  =self.dst_weight)\n        return\
  \ bl_tfm.apply_image(image)\n    def apply_coords(self, coords):\n        return\
  \ coords\n    def apply_box(self, boxes):\n        boxes = np.vstack([boxes, self.mu_boxes])\n\
  \        return boxes\n```\n\n该变换类有三个主要方法。`__init__` 方法使用 ResizeShortestEdge 类和填充（使用\
  \ NumPy）将额外图像及其相关标注调整为当前输入大小。它的 `apply_image` 方法利用 BlendTransform 类并混合两张图像。它的 `apply_coords`\
  \ 方法仅返回其输入（不执行任何操作），而它的 `apply_box` 方法合并来自两个样本的边界框。\n\n`__init__` 方法有以下三个步骤：\n\n\
  - **Step 1:** 此步骤使用 ResizeShortestEdge 类将额外图像（mixup 图像）调整大小以适应当前输入图像：\n\n    ```\n\
  \    image_size = image.shape[:2]\n    rse = T.ResizeShortestEdge([min(image_size)],\n\
  \                               min(image_size),\n                             \
  \  \"choice\")\n    aug_i = T.AugInput(image=mu_image, boxes = mu_boxes)\n    rse(aug_i)\n\
  \    mu_image, mu_boxes = aug_i.image, aug_i.boxes\n    ```\n\n- **Step 2:** 此步骤创建一个与输入图像相同大小的图像并将\
  \ mu_image 放置其中。换句话说，此步骤类似于对 mu_image 进行零填充以使其与当前输入图像大小相同：\n\n    ```\n    img =\
  \ np.zeros_like(image).astype('float32')\n    img[:mu_image.shape[0], :mu_image.shape[1],\
  \ :] = mu_image\n    ```\n\n- **Step 3:** 此最后一步获取调整大小后的图像和边界框并将其存储以供将来使用：\n\n  \
  \  ```\n    self.mu_image   = img\n    self.mu_boxes   = mu_boxes\n    self.src_weight\
  \ = src_weight\n    self.dst_weight = dst_weight\n    ```\n\n图 9.2 显示了 MixUp Augmentation\
  \ 类结合来自两个输入的图像和边界框的示例：\n\n![](img/0e7994c850a84b7a53d34c7f943c7edd_218_0.png)\n\n\
  图 9.2：MixUp Augmentation 类的示例\n\n此增强类随后可以以与 Detectron2 中其他现有增强类类似的方式使用，采用声明式方法。\n\
  \n可以使用类似的步骤创建 MosaicAugmentation 类。这些步骤将在下一节中详细说明。\n\n## 开发 Mosaic 图像增强技术\n\nMosaic\
  \ 图像增强技术需要将当前输入再结合三个额外输入并创建增强版本（上一章提供了进一步的细节）。对于该技术有两个类，一个用于 Augmentation 类，一个用于\
  \ Transformation 类。以下代码片段创建了 MosaicAugmentation 类：\n\n```\nclass MosaicAug(T.Augmentation):\n\
  \    def __init__(self, cfg):\n        self.cfg = cfg\n        self.sampler = DataDictSampler(cfg.DATASETS.TRAIN[0])\n\
  \    def get_transform(self, image, dataset_dict):\n        cfg = self.cfg\n   \
  \     mo_items  = self.sampler.get_items()\n        mo_images  = []\n        mo_boxes\
  \   = []\n        # extract mo_images, mo_boxes and update dataset_dict\n      \
  \  mt = MosaicTransform(mo_images, mo_boxes)\n        return mt\n    def __repr__(self):\n\
  \        return \"MosaicAug(4)\"\n```\n\n该类利用之前构建的数据采样器并采样三个额外输入。然后它从这些额外输入中提取图像和边界框。它还将额外输入的标注添加到当前\
  \ dataset_dict 的标注列表中，以便下一步可以利用它们以 Detectron2 支持的格式生成标注实例。具体来说，`__init__` 方法创建一个数据采样器对象（sampler）以采样三个额外输入用于执行\
  \ Mosaic 任务。`__repr__` 方法用于为此对象提供字符串表示以用于消息/日志记录。\n\n该类的核心方法是 `get_transform` 方法。它首先使用数据采样器采样三个额外图像。然后它遍历采样图像，提取其图像和边界框，并分别存储到\
  \ mo_images 和 mo_boxes 中。此外，它提取这些额外图像的标注并将其添加到当前 dataset_dict 中，以便它们可以分别转换为 Detectron2\
  \ 标注实例。最后，它将提取的数据作为输入传递以生成 MosaicTransform 类的对象来执行变换：\n\n```\nfor ds_dict in mo_items:\n\
  \    # mo_images\n    mo_image = utils.read_image(ds_dict[\"file_name\"],\n    \
  \                            format=cfg.INPUT.FORMAT)\n    utils.check_image_size(ds_dict,\
  \ mo_image)\n    mo_images.append(mo_image)\n    annotations = ds_dict[\"annotations\"\
  ]\n    # mo_boxes\n    mo_boxes.append(np.array([\n        BoxMode.convert(\n  \
  \          obj[\"bbox\"],\n            obj[\"bbox_mode\"],\n            BoxMode.XYXY_ABS)\n\
  \        for obj in annotations]))\n    # add annotations\n    dataset_dict[\"annotations\"\
  ] += annotations\n```\n\n对于 Mosaic 图像增强技术来说，结合图像和标注有点复杂，有很多不同的结合方式。*图 9.3* 说明了本节采用的方法：\n\
  \n![](img/0e7994c850a84b7a53d34c7f943c7edd_220_0.png)\n\n`get_loc_info` 方法实现了图 9.3\
  \ 中描述的步骤，以获取四个输入的相应起始位置、中心线、宽度和高度，如下所示：\n\n```\nimages = [image] + self.mo_images\n\
  heights = [i.shape[0] for i in images]\nwidths = [i.shape[1] for i in images]\n\
  ch = max(heights[0], heights[1])\ncw = max(widths[0], widths[2])\nh = (max(heights[0],\
  \ heights[1]) +\n    max(heights[2], heights[3]))\nw = (max(widths[0], widths[2])\
  \ +\n    max(widths[1], widths[3]))\n# pad or start coordinates\ny0, x0 = ch-heights[0],\
  \ cw - widths[0]\ny1, x1 = ch-heights[1], cw\ny2, x2 = ch, cw - widths[2]\ny3, x3\
  \ = ch, cw\nx_pads = [x0, x1, x2, x3]\ny_pads = [y0, y1, y2, y3]\n```\n\n`apply_image`\
  \ 方法创建一个输出图像并将四个输入图像放置到由 `get_loc_info` 方法生成的相应位置中：\n\n```\n# get the loc info\n\
  self.loc_info = self.get_loc_info(image)\nh, w, ch, cw, widths, heights, x_pads,\
  \ y_pads=self.loc_info\noutput = np.zeros((h, w, 3)).astype('float32')\nimages =\
  \ [image] + self.mo_images\nfor i, img in enumerate(images):\n    output[y_pads[i]:\
  \ y_pads[i] + heights[i],\n           x_pads[i]: x_pads[i] + widths[i],:] = img\n\
  ```\n\n`apply_box` 方法合并来自当前输入和三个额外输入的边界框。然后它根据每个输入图像的新位置移动/填充这些边界框：\n\n```\n# combine\
  \ boxes\nboxes = [boxes] + self.mo_boxes\n# now update location values\n_, _, _,\
  \ _, _, _, x_pads, y_pads = self.loc_info\nfor i, bbox in enumerate(boxes):\n  \
  \  bbox += np.array(\n        [x_pads[i], y_pads[i], x_pads[i], y_pads[i]]\n   \
  \ )\n# flatten it\nboxes = np.vstack(boxes)\n```\n\nMosaicAugmentation 类随后可以像其他现有\
  \ Detectron2 增强类一样使用。图 9.4 显示了将 Mosaic 增强应用于脑肿瘤数据集的输出示例：\n\n![](img/0e7994c850a84b7a53d34c7f943c7edd_223_0.png)\n\
  \n图 9.4：Mosaic 增强的示例\n\n此版本的输入有四张图像及其对应的标注。当批量大小较小时，此增强技术很有帮助，我们希望利用该技术来增加批量大小。此外，它可能有助于提高预测较小边界框大小标注的准确性。\n\
  \n恭喜！到目前为止，你应该能够应用现有的 Detectron2 增强或创建自定义增强来训练 Detectron2 模型。作为练习，你可以创建一个利用这些类的训练器并训练用于检测脑肿瘤的模型。由于篇幅限制，本节未列出利用这些增强的训练器的源代码。请参考本章提供的\
  \ Jupyter 笔记本以获取源代码。\n\n\n\n\n本节介绍了在训练过程中应用图像增强的步骤。在许多情况下，可以在测试时使用类似的技术来提高准确性，下一节将介绍这些技术，并向你展示如何应用测试时增强。\n\
  \n## 应用测试时图像增强技术\n\n**测试时增强（TTA）** 通过提供输入图像的不同版本进行预测，并对预测结果执行**非极大值抑制（NMS）**，从而提高预测性能。Detectron2\
  \ 提供了两个类来实现这一点：`DatasetMapperTTA` 和 `GeneralizedRCNNWithTTA`。`DatasetMapperTTA`\
  \ 类有助于将数据集字典（JSON 格式的数据项）映射为 Detectron2 模型期望的格式，同时提供执行增强的机会。默认使用的增强是 `ResizeShortestEdge`\
  \ 和 `RandomFlip`。`GeneralizedRCNNWithTTA` 类以原始模型和 `Mapper` 对象作为输入。它对增强后的数据进行预测，并预处理生成的输出。\n\
  \n让我们用代码的方式来解释这两个类。按照惯例，我们首先安装 Detectron2，加载脑肿瘤数据集，并注册测试数据集。接下来，以下代码片段获取一个预训练模型：\n\
  \n```\n```python\noutput_path = \"output/object_detector_hook/\"\n!wget --quiet\
  \ <url_to/Chapter08/object_detector_hook.zip>\n!unzip --q object_detector_hook.zip\n\
  !unzip -q {output_path}/model_best.pth.zip\n```\n```\n\n以下代码片段加载预训练模型配置：\n\n```\n\
  ```python\n# get a configuration\nwith open(output_path + \"cfg.pickle\", \"rb\"\
  ) as f:\n    cfg = pickle.load(f)\n```\n```\n\n以下 TTA 配置参数可用（并且可以设置）：\n\n```\n```python\n\
  # current TTA settings\nprint(\"min_sizes\", cfg.TEST.AUG.MIN_SIZES)\nprint(\"max_size\"\
  , cfg.TEST.AUG.MAX_SIZE)\nprint(\"flip\", cfg.TEST.AUG.FLIP)\n```\n```\n\n此代码片段应显示以下默认值：\n\
  \n```\n```text\nmin_sizes (400, 500, 600, 700, 800, 900, 1000, 1100, 1200)\nmax_size\
  \ 4000\nflip True\n```\n```\n\n可以看出，对于每个输入图像，还有十个其他增强版本（九个用于缩放，一个用于翻转）。\n\n接下来的代码片段获取测试数据集，并使用上述增强创建一个\
  \ `DatasetMapperTTA` 对象：\n\n```\n```python\n# device\ndevice = \"cuda\" if torch.cuda.is_available()\
  \ else \"cpu\"\ncfg.MODEL.DEVICE = device\n# get the dataset\nds = DatasetCatalog.get(name_ds_test)\n\
  cfg.MODEL.ROI_HEADS.SCORE_THRESH_TEST = 0.7\ncfg.MODEL.WEIGHTS = os.path.join(output_path,\n\
  \                                 \"model_best.pth\")\n\nmodel = DefaultPredictor(cfg).model\n\
  ```\n```\n\n获得模型后，以下代码片段创建一个 `GeneralizedRCNNWithTTA` 对象，并使用增强进行预测：\n\n```\n```python\n\
  # use default DatasetMapperTTA\nmin_sizes   = cfg.TEST.AUG.MIN_SIZES\nmax_size \
  \   = cfg.TEST.AUG.MAX_SIZE\nflip        = cfg.TEST.AUG.FLIP\ntta_mapper  = DatasetMapperTTA(min_sizes,\
  \ max_size, flip)\n# the tta model\ntta_model   = GeneralizedRCNNWithTTA(\n    cfg,\
  \ model,\n    tta_mapper = tta_mapper,\n    batch_size = cfg.SOLVER.IMS_PER_BATCH)\n\
  with torch.no_grad():\n    ret = tta_model(ds)\n```\n```\n\n接下来的代码片段准备了一个辅助方法，可以按原始尺寸显示输入图像：\n\
  \n```\ndef imshow(image):\n    dpi = plt.rcParams[\"figure.dpi\"]\n    im_data =\
  \ image[:, :, :-1]\n    height, width, depth = im_data.shape\n    figsize = width\
  \ / float(dpi), height / float(dpi)\n    fig = plt.figure(figsize=figsize)\n   \
  \ plt.imshow(im_data)\n    plt.imshow(im_data)\n    plt.axis(\"off\")\n    plt.show()\n\
  ```\n\n然后，这个 imshow 方法可以在 visualize_output 方法中使用，以可视化预测输出，帮助定性评估结果：\n\n```\ndef\
  \ visualize_output(img, output, cfg, scale=1.0):\n    v = Visualizer(img[:, :, :-1],\n\
  \                   MetadataCatalog.get(cfg.DATASETS.TEST[0]),\n               \
  \    scale=scale)\n    annotated_img = v.draw_instance_predictions(\n        output[\"\
  instances\"].to(\"cpu\"))\n    imshow(annotated_img.get_image())\n```\n\n最后，以下代码片段可视化了一些预测结果：\n\
  \n```\nimport numpy as np\nfor idx in np.random.randint(0, len(ds), 3):\n    img\
  \ = cv2.imread(ds[idx]['file_name'])\n    output = ret[idx]\n    visualize_output(img,\
  \ output, cfg)\n```\n\n在许多情况下，TTA 可以提高预测准确性。然而，TTA 显著增加了推理时间（在这种特定情况下大约增加 10 倍）。此外，为了定量评估测试时增强是否有助于提高预测质量，最好改用\
  \ F1 分数进行评估。\n\n恭喜！到这时，你应该已经掌握了重要的图像增强技术，对 Detectron2 的图像增强系统有了深入的了解，并且知道如何应用训练时和测试时增强。\n"
