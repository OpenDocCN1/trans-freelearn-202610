  \ name=\"brain tumors\")\n    # export\n    coco_file = os.path.join(coco_dir, \"\
  _annotations.coco.json\")\n    # Detectron requires starting index from 1\n    dataset.export.ExportToCoco(coco_file,\
  \ cat_id_index=1)\n    # now delete yolo annotations in coco set\n    for f in txt_files:\n\
  \        os.remove(f.replace(labels_path, coco_dir))\n```\n\n此时，如果所有这些数据处理步骤都是在\
  \ Google Colab 上执行的，那么最好将生成的 COCO 数据集下载到本地计算机，或者映射 Google Drive 文件夹并将生成的数据集保存到 Google\
  \ Drive 文件夹中，以免在 Google Colab 实例关闭后丢失数据集。在本例中，转换后的 COCO 数据集已存储在本书的 GitHub 文件夹中，供后续章节使用。\n\
  \n现在数据集已准备好并正确注册，是时候训练模型并查看它们在使用 Detectron2 时的表现了。在自定义数据集上执行模型训练的最简单方法是使用 Detectron2\
  \ 提供的默认训练器类。\n\n### 使用默认训练器\n\nDetectron2 提供了一个默认训练器类，可方便地在自定义数据集上训练 Detectron2\
  \ 模型。首先，我们下载上一节中转换的数据集并解压：\n\n```\n!wget -q https://github.com/PacktPublishing/Hands-On-Computer-Vision-with-Detectron2/raw/main/datasets/braintumors_coco.zip\n\
  !unzip -q braintumors_coco.zip\n```\n\n接下来，安装 Detectron2，并使用上一节中给出的确切代码片段注册训练/测试数据集。此外，在训练之前，运行以下代码片段来准备一个记录器，Detectron2\
  \ 将使用它来记录训练/推理信息：\n\n```\nfrom detectron2.utils.logger import setup_logger\nlogger\
  \ = setup_logger()\n```\n\n注册好数据集并设置好记录器之后，下一步是获取训练配置。具体来说，我们设置输出目录（用于存储日志事件和训练后的模型）、用于保存配置文件的路径（该文件将用于未来的推理）、类别数为正负两类（nc\
  \ = 2），以及将设备选项设置为 cuda（用于在 GPU 上训练）。最后，为了加快训练速度，我们还选择 ResNet50 FPN 作为要训练模型的骨干网络：\n\
  \n```\nimport os\nfrom detectron2.config import get_cfg\nfrom detectron2 import\
  \ model_zoo\nimport pickle\n\noutput_dir = \"output/object_detector\"\nos.makedirs(output_dir,\
  \ exist_ok=True)\noutput_cfg_path = os.path.join(output_dir, \"cfg.pickle\")\nnc\
  \ = 2\n```\n\n\n```python\ndevice = \"cuda\"\n\nconfig_file_url = \"COCO-Detection/faster_rcnn_R_50_FPN_3x.yaml\"\
  \ncheckpoint_url = \"COCO-Detection/faster_rcnn_R_50_FPN_3x.yaml\"\n```\n\n此外，下面的代码片段创建了一个训练配置：\n\
  \n```python\n# Create a configuration file\ncfg = get_cfg()\nconfig_file = model_zoo.get_config_file(config_file_url)\n\
  cfg.merge_from_file(config_file)\ncfg.MODEL.WEIGHTS = model_zoo.get_checkpoint_url(checkpoint_url)\n\
  \n# Download weights\ncfg.MODEL.WEIGHTS = model_zoo.get_checkpoint_url(checkpoint_url)\n\
  \n# Set datasets\ncfg.DATASETS.TRAIN = (name_ds_train,)\ncfg.DATASETS.TEST = (name_ds_test,)\n\
  # Workers\ncfg.DATALOADER.NUM_WORKERS = 2\n# Images per batch\ncfg.SOLVER.IMS_PER_BATCH\
  \ = 8\n# Learning rate\ncfg.SOLVER.BASE_LR = 0.00025\n# Iterations\ncfg.SOLVER.MAX_ITER\
  \ = 5000\ncfg.SOLVER.CHECKPOINT_PERIOD = 500\n# Classes\ncfg.MODEL.ROI_HEADS.NUM_CLASSES\
  \ = nc\ncfg.MODEL.DEVICE = device\ncfg.OUTPUT_DIR = output_dir\n```\n\n我们使用在 Detectron2\
  \ 中注册的相应名称来设置训练和测试数据集。接下来，我们将数据加载器的工作进程数设置为 2，并将每批图像数设置为 8（你可以更改此数字以适应可用的 GPU）。此外，由于我们使用迁移学习（通过重用从\
  \ Detectron2 Model Zoo 训练得到的权重），我们设置了一个相对较小的学习率——在本例中为 0.00025。此外，我们将训练 5,000 次迭代，并且每\
  \ 500 次迭代保存一次模型。\n\n```\nmodel_0004999.pth\nmodel_final.pth\n```\n\n输出包括配置文件（cfg.pickle）、一个用于记录日志事件的文件、最后一个检查点（last_checkpoint）（以便模型可以在需要时恢复训练）、一个包含所有训练评估指标的文件（metrics.json），以及每\
  \ 500（cfg.SOLVER.CHECKPOINT_PERIOD）次迭代保存的所有模型。值得注意的是，最后一次迭代（cfg.SOLVER.MAX_ITERATIONS）的模型被保存为\
  \ model_final.pth。\n\n得到训练结果后，下一步是进行一些模型评估，并选择表现最佳的模型。\n\n## 选择最佳模型\n\n选择最佳模型需要评估指标。因此，在选择最佳模型之前，我们需要了解用于目标检测任务的常见评估术语和评估指标。此外，在获得最佳模型后，本节还提供了相关代码，用于采样并可视化一些预测结果，以定性评估所选模型。\n\
  \n## 目标检测模型的评估指标\n\n目标检测任务使用两个主要的评估指标：mAP@0.5（或 AP50）和 F1-score（或 F1）。前者是交并比（IoU）阈值为\
  \ 0.5 时平均精度（mAP）的均值，用于选择最佳模型。后者表示精确率和召回率的调和平均值，用于报告所选模型在特定数据集上的表现。这两个指标的定义都基于精确率（Precision）和召回率（Recall）的计算：\n\
  \nPrecision = TP / (TP + FP)\n\nRecall = TP / (TP + FN)\n\n这里，TP（真正例，True Positive）表示被正确分类和定位（基于\
  \ IoU 阈值）的预测对象数量；FP（假正例，False Positive）表示被错误分类或定位的预测对象数量；FN（假负例，False Negative）表示未被正确预测的真实对象数量。然后可以使用以下公式计算\
  \ F1-score：\n\nF1 = 2 × Precision × Recall / (Precision + Recall)\n\n```\n'model_0002999.pth',\n\
  'model_0003499.pth',\n'model_0003999.pth',\n'model_0004499.pth',\n'model_final.pth']\n\
  ```\n\n这段代码列出了训练过程中每个检查点周期（cfg.SOLVER.CHECKPOINT_PERIOD）保存的所有模型。值得注意的是，训练完成后（在 cfg.SOLVER.MAX_ITER\
  \ 迭代处）的模型被命名为 model_final.pth。此外，模型名称中的数字总是用零填充，以使其长度为 7。\n\n下面的代码片段准备了一个评估器，用于评估这些模型中的每一个在测试集上的表现：\n\
  \n```\nfrom detectron2.engine import DefaultPredictor\nfrom detectron2.evaluation\
  \ import COCOEvaluator\nevaluator = COCOEvaluator(\n    dataset_name = name_ds_test,\n\
  \    tasks=(\"bbox\",),\n    distributed=False,\n    output_dir = os.path.join(output_dir,\
  \ 'test_results')\n)\n```\n\n值得注意的是，选择 COCOEvaluator 是因为数据集采用 COCO 格式。此外，tasks 选项中的\
  \ \"bbox\" 输入告诉评估器执行目标检测任务的评估。测试结果存储在输出目录下的 'test_results' 文件夹中。获得评估器后，下面的代码片段对生成的每个模型执行评估：\n\
  \n```\n# evaluate all folders\nimport logging\nlogger.setLevel(logging.CRITICAL)\n\
  model_eval_results = []\nfor model_name in model_names:\n    # load weights\n  \
  \  cfg.MODEL.WEIGHTS = os.path.join(cfg.OUTPUT_DIR, model_name)\n    cfg.MODEL.ROI_HEADS.SCORE_THRESH_TEST\
  \ = 0.5\n    # predictor\n    predictor = DefaultPredictor(cfg)\n    # evaluate\n\
  \    x = trainer.test(cfg, predictor.model,\n```\n\n```python\nbest_model_name =\
  \ model_names[best_model_idx]\nbest_ap = aps[best_model_idx]\nanno_text = f'The\
  \ best model {best_model_name} has\\nmAP@0.5={round(best_ap, 2)}'\n\nplt.figure(figsize=(12,\
  \ 6))\nx = [i for i in range(len(aps))]\nY = aps\nplt.xticks(ticks=x, labels=model_names,\
  \ rotation=45)\nplt.plot(x, Y)\nplt.scatter(x, Y)\nplt.plot([best_model_idx, best_model_idx],\
  \ [0, best_ap], '--')\nplt.ylabel(\"mAP@0.5\")\nplt.text(best_model_idx+0.1, best_ap,\
  \ anno_text, ha=\"left\",\\nva=\"center\")\nplt.show()\n```\n\n*图 5.4* 显示了这段代码的输出：\n\
  \n![](img/0e7994c850a84b7a53d34c7f943c7edd_126_0.png)\n\n图 5.4：所有模型的平均精度均值（mAP@50）\n\
  \n```\nplt.show()\n# Similar code for predicted results (removed here)\n```\n\n\
  值得注意的是，该方法的第一部分会采样少量输入，并可视化输入图像及其标注。第二部分（已移除）对采样输入执行预测，并可视化相应的预测标注。接下来，我们使用下面的代码片段为最佳模型创建预测器：\n\
  \n```\ncfg.MODEL.ROI_HEADS.SCORE_THRESH_TEST = 0.5\ncfg.MODEL.WEIGHTS = os.path.join(cfg.OUTPUT_DIR,\
  \ best_model_name)\npredictor = DefaultPredictor(cfg)\n```\n\n值得注意的是，这段代码将 SCORE_THRES_TEST\
  \ 值设为 0.5（应使用前面提供的类似代码片段进行优化）以获得更好的结果。最后，我们可以运行下面的代码片段来随机采样图像，并可视化真实标签和预测结果：\n\n\
  ```\nplot_random_samples(name_ds_test, predictor = predictor)\n```\n\n这段代码应显示输出，如图\
  \ 5.6 所示。值得注意的是，边界框的颜色由 Detectron2 可视化器生成，在这种情况下没有含义。\n\n![](img/0e7994c850a84b7a53d34c7f943c7edd_129_0.png)\n\
  \n![](img/0e7994c850a84b7a53d34c7f943c7edd_129_1.png)\n\n图 5.6：采样图像及其对应的真实标签和预测标签\n\
  \n总的来说，定位（边界框）相当不错，但仍然存在错误分类。这个结果是合理的，因为在图像中观察是否存在肿瘤相对容易，但要确认一个肿瘤是阳性还是阴性则更难。此外，该模型可能会将同一个肿瘤同时预测为阳性和阴性，因为目前\
  \ NMS 过程是按类别进行的（如前一章所述）。然而，在这种情况下，一个肿瘤要么是阳性，要么是阴性（不可能两者都是）。因此，有机会通过忽略类别标签来执行 NMS\
  \ 过程以优化模型，我们将在下一章进行这项工作。\n\n使用 Detectron2 默认训练器（`DefaultTrainer`）训练模型非常方便，可以满足大多数常见需求。然而，在某些情况下，我们可能需要开发自定义训练器，以方便训练并分析训练指标和结果。下一节将介绍训练器类的基本组件以及如何自定义它们。\n\
  \n## 开发自定义训练器\n\n开发 Detectron2 自定义训练器有几个原因。例如，我们可能希望自定义数据集加载器以引入更多图像增强技术，或者添加评估器来评估训练后的模型在训练过程中的表现。下面的代码片段提供了为后者构建自定义训练器的源代码，而*第\
  \ 8 章*则涵盖前者的代码：\n\n```python\nfrom detectron2.engine import DefaultTrainer\nfrom\
  \ detectron2.evaluation import COCOEvaluator\nclass BrainTumorTrainer(DefaultTrainer):\n\
  \    @classmethod\n    def build_evaluator(cls, cfg, dataset_name, output_\nfolder=None):\n\
  \        if output_folder == None:\n            output_folder = cfg.OUTPUT_DIR\n\
  \        else:\n            output_folder = os.path.join(cfg.OUTPUT_DIR,\n     \
  \                                    output_folder)\n        os.makedirs(output_folder)\n\
  \        return COCOEvaluator(dataset_name,\n                             distributed\
  \ = False,\n                             output_dir = output_folder)\n```\n\n\n\
  具体来说，这个自定义训练器重写了 `build_evaluator` 方法，返回一个 COCOEvaluator 对象，用于评估测试集。之所以选择 COCOEvaluator\
  \ 类，是因为测试数据集采用 COCO 格式。在指定评估器后，以下代码片段指定了该评估器的执行频率：\n\n```\ncfg.TEST.EVAL_PERIOD\
  \ = cfg.SOLVER.CHECKPOINT_PERIOD\n```\n\n这段代码将评估周期设置为与检查点周期相同，因此每次保存检查点时都会进行评估。接下来的代码片段创建了一个自定义训练器，并像默认训练器一样执行训练：\n\
  \n```\ntrainer = BrainTumorTrainer(cfg)\ntrainer.train()\n```\n\n你可能会好奇，为什么在训练过程中执行评估器比在训练完成后评估训练好的模型更有价值。这种用法有几个原因。其一，这种方法可以在训练期间监控\
  \ COCO 评估指标的结果，这些指标可用于选择最佳模型并执行早停（当连续多次迭代后不再看到改进时，提前停止训练）。\n\n另一个例子是，评估指标与训练指标（如分类损失和边界框损失）一起存储，并提供了使用\
  \ TensorBoard 等工具在训练期间评估偏差与方差权衡的机会。下一节将介绍一个名为**钩子系统**的新概念，并结合本节提出的思路来演示第一种场景。*第\
  \ 6 章*将利用 TensorBoard 来演示第二种场景。\n\n## 利用钩子系统\n\n钩子系统允许将类合并到训练事件中执行若干任务。自定义钩子基于继承\
  \ Detectron2 中名为 `detectron2.engine.HookBase` 的基类构建。钩子允许开发人员通过重写以下方法在四个事件上执行任务：\n\
  \n- `before_training()` 用于在第一次训练迭代之前执行任务\n- `after_training()` 用于在训练完成后执行任务\n- `before_step()`\
  \ 用于在每次训练迭代之前执行任务\n- `after_step()` 用于在每次训练迭代之后执行任务\n\n以下代码片段创建了一个钩子，用于从先前构建的自定义训练器中读取\
  \ COCOEvaluator 生成的评估指标，跟踪具有最高 mAP@0.5 值的最佳模型，并将模型保存为 model_best.pth：\n\n```\n#\
  \ 为节省篇幅，省略了一些导入语句\nclass BestModelHook(HookBase):\n    def __init__(self, cfg,\n\
  \                metric = \"bbox/AP50\",\n                min_max = \"max\"):\n\
  \        # 后续说明\n    def _take_latest_metrics(self):\n        # 后续说明\n    def after_step(self):\n\
  \        # 后续说明\n```\n\n该类重写了 __init__ 方法，以传入 metric 和另一个参数（min_max），用于指示如何监控指标值（最小或最大）：\n\
  \n```\nself._period = cfg.TEST.EVAL_PERIOD\nself.metric = metric\nself.min_max =\
  \ min_max\nself.best_value = float(\"-inf\") if min_max == \"max\" else float(\"\
  inf\")\nlogger = logging.getLogger(\"detectron2\")\nlogger.setLevel(logging.DEBUG)\n\
  logger.propagate = False\nself._logger = logger\n```\n\n这个 BestModelHook 类还创建了一个方法（_take_latest_metrics），用于获取训练过程中存储的所有评估指标：\n\
  \n```\nwith torch.no_grad():\n    latest_metrics = self.trainer.storage.latest()\n\
  \    return latest_metrics\n```\n\n然后，after_step 方法遍历所有评估指标，获取监控值，并在评估结果优于当前最佳值时保存训练模型：\n\
  \n```\nnext_iter = self.trainer.iter + 1\nis_final = next_iter == self.trainer.max_iter\n\
  if is_final or (self._period > 0 and next_iter % self._period == 0):\n    latest_metrics\
  \ = self._take_latest_metrics()\n    for (key, (value, iter)) in latest_metrics.items():\n\
  \        if key == self.metric:\n            if (self.min_max == \"min\" and value\
  \ < self.best_value) or (self.min_max == \"max\" and value > self.best_value):\n\
  \                self._logger.info(\"Updating best model at iteration {} with {}\
  \ = {}\".format(iter, self.metric, value))\n                self.best_value = value\n\
  \                self.trainer.checkpointer.save(\"model_best\")\n```\n\n值得注意的是，该钩子是通过重写\
  \ after_step() 方法来构建的。然而，它只在每个 `cfg.TEST.EVAL_PERIOD` 迭代且 COCOEvaluator 产生结果时执行其任务。\n\
  \n以下代码片段利用自定义训练器和钩子在训练期间执行模型评估和选择：\n\n```\ntrainer = BrainTumorTrainer(cfg)\nbm_hook\
  \ = BestModelHook(cfg, metric=\"bbox/AP50\", min_max=\"max\")\ntrainer.register_hooks(hooks=[bm_hook])\n\
  trainer.train()\n```\n\n显然，将钩子注册到训练器中相对简单。此外，latest_metrics 变量包含许多训练和评估指标，我们只提取测试集上的\
  \ mAP@0.5（bbox/AP50）。最后，训练过程与默认训练器保持一致。最终，除了默认训练器生成的模型之外，还会有一个名为 model_best.pth\
  \ 的模型，它保存了在测试数据集上评估具有最高 mAP@0.5 的模型权重。\n\n恭喜！到此为止，你应该已经掌握了在自定义数据集上执行数据处理和训练自定义模型的步骤。此外，你还应该了解如何在训练中融入更多自定义处理。\n\
  \n## 小结\n\n本章讨论了使用 Detectron2 训练目标检测模型时，探索、处理和准备自定义数据集的步骤。处理数据集后，将训练、测试和评估数据（如果有）注册到\
  \ Detectron2 并开始使用默认训练器训练目标检测模型是相对容易的。训练过程可能会产生许多模型。因此，本章提供了标准的评估指标和选择最佳模型的方法。默认训练器可能满足最常见的训练需求。然而，在某些情况下，可能需要自定义训练器来在训练过程中加入更多自定义功能。本章提供了构建自定义训练器的代码片段，使训练过程中能够包含对测试集的评估。同时，还提供了一个自定义钩子的代码片段，用于提取评估指标并在训练期间保存最佳模型。\n\
  \n下一章，即第 6 章，将使用 TensorBoard 分析默认训练器和本章构建的自定义训练器生成的训练与评估指标。分析这些指标应能提供调整目标检测模型以实现更高性能的方法。\n"
- "## 检查训练结果并微调 Detectron2 的求解器\n\n本章介绍如何使用 TensorBoard 检查训练历史。它利用代码和可视化方法解释 Detectron2\
  \ 求解器背后的概念及其超参数。相关概念包括梯度下降、随机梯度下降、动量和可变学习率优化器。本章还提供代码，帮助你找到 Detectron2 求解器的标准超参数。\n\
  \n学完本章后，你将能够使用 TensorBoard 分析训练结果并获得洞见。你还会深入理解 Detectron2 求解器的关键超参数。此外，你将能够使用代码为自定义数据集生成这些超参数的合适值。具体而言，本章涵盖以下主题：\n\
  \n- 使用 TensorBoard 检查训练历史\n- 理解 Detectron2 的求解器\n- 微调学习率和批大小\n\n### 技术要求\n\n你必须已完成*第\
  \ 1 章*，才能拥有适合 Detectron2 的开发环境。所有代码、数据集和结果均可在本书的 GitHub 仓库中获取：`https://github.com/PacktPublishing/Hands-On-Computer-Vision-with-Detectron2`。强烈建议你下载代码并跟随操作。\n\
  \n\n\n\n## 使用 TensorBoard 检查训练历史\n\n在微调模型之前，了解训练期间测量的评估指标至关重要，例如训练损失（例如，分类损失和定位损失）、学习率变化，以及在测试集上的验证测量（例如，mAP@0.5），这些指标会随时间变化。这些指标使我们能够理解训练过程，以便调试和微调模型。Detectron2\
  \ 的记录器会自动以 TensorBoard 可用的格式记录训练和测试数据的评估指标。\n\nTensorBoard（https://www.tensorflow.org/tensorboard）提供工具和可视化，以便我们探索机器学习实验中的训练和评估过程。以下代码片段下载我们在第\
  \ 5 章中进行的两个实验的训练日志并解压它们：\n\n```\n# download and extract\n!wget {url_to_object_detector.zip}\n\
  !wget {url_to_object_detector_hook.zip}\n!unzip object_detector.zip\n!unzip object_detector_hook.zip\n\
  ```\n\n获取训练和评估日志后，以下代码片段加载 TensorBoard，以便您可以查看训练结果：\n\n```\noutput_dir = \"output/\"\
  \n%load_ext tensorboard\n%tensorboard --logdir {output_dir} --host localhost\n```\n\
  \n正如我们所见，此代码片段将输出目录设置为存储训练日志的 output 文件夹。然后它将 TensorBoard 加载为内部 Web 服务器并将其嵌入到 Google\
  \ Colab 的输出单元格中。\n\n> 重要提示\n> 如果已加载 TensorBoard，请运行 %reload_ext tensorboard 而不是\
  \ %load_ext tensorboard，或在使用其进程 ID 终止当前服务器后再加载新实例。\n\n图 6.1 显示了 Detectron2 目标检测模型的训练和评估日志在\
  \ SCALARS 选项卡中的日志：\n\n![](img/0e7994c850a84b7a53d34c7f943c7edd_138_0.png)\n\n图 6.1：TensorBoard\
  \ 及训练和评估日志的 SCALARS 选项卡\n\n日志记录步骤在训练期间每 20 次迭代执行一次（此数字可配置），默认情况下有 12 类标量：\n\n- `data_time`\
  \ 类别存储准备训练数据所需的时间。\n- `eta_seconds` 类别存储训练完成前的估计秒数。\n- `fast_rcnn` 类别存储 Fast R-CNN\
  \ 评估指标。这些是分类准确率（`cls_accuracy`）、假阴性（`false_negative`）和前景（对象）分类准确率（`fg_cls_accuracy`）。\n\
  - `loss_box_reg` 类别存储边界框回归（或定位损失）的损失。\n- `loss_cls` 类别存储分类损失。\n- `loss_rpn_cls`\
  \ 类别存储区域建议网络物体性分类损失。\n- `loss_rpn_loc` 类别存储区域建议网络定位（边界框）损失。\n- `lr` 类别存储学习率。学习率可能因具有预热期、在某些步骤降低的步骤，或使用其他参数而变化。\n\
  \n## 理解 Detectron2 的求解器\n\n我们应该尝试两种明显的微调技术：更改骨干网络和增加批大小。如 Detectron2 Model Zoo（第\
  \ 3 章介绍）所示，我们在第 5 章中选择的骨干是最简单的（ResNet50），在预训练数据集上的 mAP@0.5 较低。它轻量且训练和推理速度快，因此我们一直在使用免费的\
  \ Google Colab 计划进行实验。如果计算资源可用，选择 Detectron2 Model Zoo 中更强大的骨干，例如 X101FPN，将是有益的。然而，在本节中，我们将保留这个简单的骨干模型并尝试设置和优化器类型。这些是标准超参数，因为它们适用于深度学习总体。\n\
  \n了解可用的优化器及其相关超参数对于理解 Detectron2 为微调模型提供的配置参数至关重要。本节简要介绍深度学习中常见的优化器类型。\n\n### 梯度下降\n\
  \n梯度下降是训练深度神经网络时最基本的概念之一。通常，在训练神经网络时，有一个成本（损失）函数（$L$），我们需要对其关于模型参数（$W$）进行优化（最小化）。我们使用微积分来执行此优化，通过获取损失函数对参数的导数，将其设为零并获得最优结果。然而，在复杂的深度神经网络中（通常如此），很难（甚至不可能）求解此方程。因此，使用数值近似更为合适。*图\
  \ 6.4* 使用一个参数的简单损失函数说明了这一思想：\n\n![](img/0e7994c850a84b7a53d34c7f943c7edd_141_0.png)\n\
  \n图 6.4：梯度下降步骤示例\n\n具体来说，损失函数为 $L(w) = w^2 - 4w + 5$，其导数为 $\\nabla L(w) = 2w - 4$。此情况下的梯度下降算法很简单：\n\
  \n```\nInitialize w with a random value\nfor e in range(num_epochs):\n    update\
  \  w = w - η ∇L(w)\n```\n\n这里，num_epochs 是执行训练的步数，学习率（$η$）决定了参数 $w$ 在每次训练步骤中根据损失函数的导数更新其值的幅度。这些是梯度下降算法的两个基本超参数。\n\
  \n例如，当前参数 $w$ 为 4，选择的学习率为 $η = 0.1$。该损失函数的切线（虚线）的斜率是导数 $∇L(4) = 4$。在这一点，$w$ 应该向左移动，即\
  \ $w = 3.6$。类似地，后续步骤应对应 $w = 3.28, 3.024$，等等。如果我们继续这样做，损失函数最终会收敛到最优点，前提是步长足够小。值得注意的是，当损失函数的导数幅度变小时，步长也会变小。\n\
  \n此时，问题是如何选择训练的 epoch 数和学习率。一般来说，选择较小的学习率会使学习过程变慢，模型收敛需要很长时间。另一方面，较大的学习率可能导致 $w$\
  \ 参数左右波动且不收敛等问题。\n\n让我们采用一个简单的代码方法来演示这些思想。以下代码片段定义了损失函数（在训练数据上计算）及其对应的导数：\n\n```\n\
  def L(w):\n    return w**2 - 4*w + 5\ndef dL(w):\n    return 2*w - 4\n```\n\n以下代码片段准备一个简单的函数来模拟训练过程，初始训练权重值（w0）、学习率（lr）和\
  \ epoch 数（num_epochs）：\n\n```\ndef train(w0, lr, num_epochs):\n    ws, Ls = [],\
  \ [], w0\n    for e in range(num_epochs):\n        Ls.append(L(w))  # loss\n   \
  \     ws.append(w)  # weight\n        dLw = dL(w)  # gradient\n        w = w - lr*dLw\
  \  # update\n    return ws, Ls\n```\n\n此函数返回随时间变化的权重列表及其对应的损失。以下代码片段然后接收这两个列表并可视化训练过程中的变化：\n\
  \n```\n```python\n# import statements for matplotlib and numpy\ndef visualize(ws,\
  \ Ls):\n    w_range = np.linspace(-0.5, 4.5, 100)\n    L_range = [L(w) for w in\
  \ w_range]\n    plt.plot(w_range, L_range)\n    plt.scatter(ws, Ls)\n    plt.plot(ws,\
  \ Ls)\n    plt.scatter(ws,[0]*len(ws))\n    ax = plt.gca()\n    msg = f'lr={lr}\\\
  nnum_epochs={num_epochs}'\n    plt.text(0.6, 0.95, msg,\n        horizontalalignment='left',\n\
  \        verticalalignment='top',\n        transform = ax.transAxes)\n    plt.show()\n\
  ```\n```\n\n最后，以下代码片段为特定超参数集生成实验（假设 w0=4.0）：\n\n```\n```python\nnum_epochs = 20\n\
  lr = 0.1\nws, Ls = train(w0, lr, num_epochs)\nvisualize(ws, Ls)\n```\n```\n\n*图\
  \ 6.5* 显示了不同超参数集下训练时间中权重（X 轴）及其对应损失（Y 轴）的变化：\n\n\n值得注意的是，我们选择的损失函数是均方误差（MSE）。下面的代码片段创建了一个名为GD（梯度下降）的优化器，用于在给定学习率和梯度的情况下执行参数更新：\n\
  \n```\nclass GD():\n    def __init__(self, lr):\n        self.lr = lr\n\n    def\
  \ backward(self, theta, gradients):\n        theta = theta - self.lr*(gradients)\n\
  \        return theta\n```\n\n接下来，我们必须创建一个函数，在给定X和Y数据（无论是批次还是整个轮次）的情况下执行一次训练步骤：\n\
  \n```\ndef train_step(X, Y, theta, optimizer):\n    # forward\n    Y_hat = forward(theta,\
  \ X)\n    loss = mse(Y_hat, Y)\n    dLdTheta = gradient(X, Y, Y_hat)\n    theta\
  \ = optimizer.backward(theta, dLdTheta)\n    return theta, loss, dLdTheta\n```\n\
  \n现在我们已经知道了如何在每次迭代（批次或轮次）中执行训练，下面的代码片段可以帮助我们执行训练循环：\n\n```\ndef train(X, Y, theta0,\
  \ optimizer, num_epochs):\n    losses = []\n    thetas = []\n    dLdThetas = []\n\
  \    theta = theta0\n    for epoch in range(num_epochs):\n        theta, loss, dLdTheta=train_step(X,\
  \ Y, theta,optimizer)\n        thetas.append(theta)\n        losses.append(loss)\n\
  \        dLdThetas.append(dLdTheta)\n    return losses, thetas, dLdThetas\n```\n\
  \n此外，下面的代码片段创建了一个函数，帮助我们可视化损失在训练迭代中的变化情况：\n\n```\n```python\ndef plot_losses(losses):\n\
  \    plt.plot(losses)\n    plt.ylim([-1, 20])\n    ax = plt.gca()\n    msg = f'Final\
  \ loss: {round(losses[-1], 3)}'\n    plt.text(0.99, 0.1, msg,\n        horizontalalignment='right',\n\
  \        verticalalignment='top',\n        transform = ax.transAxes)\n    plt.xlabel(\"\
  iteration\")\n    plt.ylabel(\"loss\")\n    plt.show()\n```\n```\n\n进一步地，下面的代码片段还可视化了训练参数（theta）在训练迭代中的变化情况：\n\
  \n```\n```python\ndef plot_thetas(thetas, losses):\n    grid_size = 100\n    thetas\
  \ = np.array(thetas)\n    theta1s = np.linspace(0, 4, grid_size)\n    theta2s =\
  \ np.linspace(1, -7, grid_size)\n    Z = np.zeros((grid_size, grid_size))\n    for\
  \ i in range(grid_size):\n        for j in range(grid_size):\n            theta\
  \ = np.array([[theta1s[i]], [theta2s[j]]])\n            Y_hat = forward(theta, X)\n\
  \            loss = mse(Y_hat, Y)\n            Z[i,j] = loss\n    # some simple\
  \ plotting code lines are removed for space eff.\n```\n```\n\n接下来，我们必须随机初始化训练参数的值，并设置一些训练超参数：\n\
  \n```\n```python\ntheta0 = np.random.rand(2, 1)\nnum_epochs = 500\nlr = 0.001\n\
  ```\n```\n\n下面的代码片段使用梯度下降方法执行训练并可视化结果：\n\n```\n```python\noptimizer = GD(lr = lr)\n\
  losses, thetas, dLdthetas = train(X, Y, theta0,\noptimizer=optimizer, num_epochs=num_epochs)\n\
  plot_losses(losses)\nplot_thetas(thetas, losses)\n```\n```\n\n*图6.8* 显示了使用梯度下降方法时，训练迭代中的损失和theta值变化：\n\
  \n![](img/0e7994c850a84b7a53d34c7f943c7edd_149_0.png)\n\n可以观察到，损失和theta值变化得逐渐且平滑，因为训练步骤是在整个数据集上执行的。然而，训练过程在500次迭代后没有收敛（X标记表示收敛点）。\n\
  \n另一方面，下面的代码片段准备了一种使用随机梯度下降方法执行训练过程的方法：\n\n```\n```python\ndef train_mini_batch(X,\
  \ Y, theta0, optimizer, num_epochs,\nbatch_size):\n    # some simple initialization\
  \ code lines are removed here\n    for e in range(num_epochs):\n        # shuffle\n\
  \        np.random.shuffle(indices)\n        for i in range(batches):\n        \
  \    start = i*batch_size\n            stop = start + batch_size\n            indices_b\
  \ = indices[start:stop]\n```\n```\n\n## 动量\n\n梯度下降仅基于损失函数当前导数的值来更新权重。另一方面，动量方法除了考虑当前梯度的影响外，还考虑过去梯度的累积。打个比方，我们可以将随机/梯度下降方法视为在路上推一个箱子。如果我们推它，它会移动；如果我们停止推，它由于高摩擦而不会移动。另一方面，我们可以将动量方法视为踩自行车。如果我们踩踏板，自行车就会移动。然而，当我们停止踩踏板时，由于之前踩踏板产生的动量，它还会继续移动一段距离。\n\
  \n让我们重写随机/梯度下降方法的权重更新公式，使其看起来像这样：\n\n$$\\theta_t = \\theta_{t-1} - \\eta g_t$$\n\
  \n这里，$\\theta_t$ 和 $g_t$ 分别是时间 $t$ 时的训练参数和梯度，$\\eta$ 是学习率。因此，如果没有梯度（$g_t = 0$），那么参数就不会更新。另一方面，动量方法分为两步。在每次迭代中，它记录一个变量\
  \ $v_t$（速度），然后使用它通过以下两个方程更新训练参数：\n\n$$v_t = \\mu v_{t-1} + \\eta g_t$$\n\n$$\\theta_t\
  \ = \\theta_{t-1} - v_t$$\n\n这里，$\\mu$ 通常是一个小于且接近1.0的值，例如0.9、0.95或0.99。为 $\\mu$\
  \ 选择这些值之一，使得当 $g_t = 0$ 时，经过几次迭代后，$v_t$ 也会变为零，并且不会更新权重。正如这些公式所示，通常，使用动量方法的主要优点是可以加快训练时间（收敛时间）。\n\
  \n动量有几种变体，前面列出的是Sutskever的实现。还有另一个来自Nesterov的流行实现，略有不同：\n\n$$v_t = \\mu v_{t-1}\
  \ + g_t$$\n\n$$\\theta_t = \\theta_{t-1} - \\eta v_t$$\n\n让我们继续使用前面章节中介绍的代码和可视化方法来阐述这些概念。下面的代码片段准备了一个动量优化器：\n\
  \n```\nclass Momentum():\n    def __init__(self, lr, moment, nesterov=False):\n\
  \        self.lr = lr\n        self.moment = moment\n        self.first_step = True\n\
  ```\n\n```\n```python\nself.nesterov = nesterov\n\ndef backward(self, theta, gradients):\n\
  \    if self.first_step:\n        self.v = np.zeros_like(theta)\n        self.first_step\
  \ = False\n\n    if not self.nesterov:\n        self.v = self.moment*self.v + self.lr\
  \ * gradients\n        theta = theta - self.v\n    else:\n        self.v = self.moment*self.v\
  \ + gradients\n        theta = theta - self.lr * self.v\n\n    return theta\n```\n\
  ```\n\n下面的代码片段随后使用动量执行训练并可视化结果：\n\n```\n```python\noptimizer = Momentum(lr = lr,\
  \ moment=0.9)\nlosses, thetas, dLdThetas = train_mini_batch(X, Y, theta0,\noptimizer=optimizer,\
  \ num_epochs=num_epochs-300, batch_size = 5)\nplot_losses(losses)\nplot_thetas(thetas,\
  \ losses)\n```\n```\n\n*图6.10* 显示了这段代码的输出。正如我们所见，由于动量的作用，损失和训练参数的变化更加平滑。此外，最终的损失和theta值表明，这种方法的表现甚至优于没有动量的随机梯度下降方法。Nesterov实现动量的方法也有类似的结果。因此，为了节省篇幅，我们在此没有包含代码和结果（你可以参考本书GitHub仓库中的代码文件）：\n\
  \n![](img/0e7994c850a84b7a53d34c7f943c7edd_153_0.png)\n\n图6.10：使用动量时训练迭代中的损失和theta值变化\n\
  \n在许多情况下，当神经网络尚未训练好时，使用较高的学习率可能会导致梯度爆炸问题。同样，当接近最优点时，最好使用较小的学习率，这样变化不会在最优点左右来回波动。然而，这并不意味着我们应该始终选择较小的学习率，因为这样会让训练过程更长。因此，可变学习率方法可能会产生更好的结果。\n\
  \n## 可变学习率\n\n可变学习率有多种实现方式。由于篇幅限制，本节只介绍Detectron2在其随机梯度下降实现中所使用的方法。具体来说，在训练开始时，可以选择执行预热步骤。该步骤使用一个名为\
  \ `warmup_iters` 的超参数。从训练开始，学习率逐渐线性增加（也可以使用正弦波方法），使其在该阶段结束时达到基础学习率。\n\n此外，还有另一组超参数，称为\
  \ steps 和 gamma。这些是学习率按 gamma 因子变化的步骤。这些超参数有助于在训练过程接近结束时逐步降低学习率。下面的代码片段实现了具有可变学习率的随机梯度下降方法：\n\
  \n```\n```python\nclass VariableLR():\n    def __init__(self, lr, moment,\n    \
  \    nesterov =False,\n        warmup_iters = 0,\n        steps      = None,\n \
  \       gamma      = 0.5):\n        # codes removed: self.<inputs> = <inputs>\n\
  \        self.iter = 0\n```\n```\n\n\n\n\n\n```\n```python\nself.lrs = []\nself.first_step\
  \ = True\ndef backward(self, theta, gradients):\n    # Explained next\n```\n```\n\
  \n该类有两个方法：`__init__` 和 `backward`。第一个方法只是接收输入并将它们赋值给类的对应成员。第二个方法使用输入的梯度（`gradients`）对现有参数（`theta`）执行实际的更新：\n\
  \n```\n```python\nif self.iter in self.steps:\n    self.lr = self.lr*self.gamma\n\
  self.iter += 1\nif self.warmup_iters!=0 and self.iter < self.warmup_iters:\n   \
  \ lr = (self.iter/self.warmup_iters)*self.lr\nelse:\n    lr = self.lr\nself.lrs.append(lr)\n\
  if self.first_step:\n    self.v = np.zeros_like(theta)\n    self.first_step = False\n\
  if not self.nesterov:\n    self.v = self.moment*self.v + lr * gradients\n    theta\
  \ = theta - self.v\nelse:\n    self.v = self.moment*self.v + gradients\n    theta\
  \ = theta - lr * self.v\nreturn theta\n```\n```\n\n下面的代码片段使用这种方法执行训练并可视化结果：\n\n\
  ```\n```python\noptimizer = VariableLR(lr = lr, moment=0.9, nesterov=False,\nwarmup_iters=50,\
  \ steps=(300, 500))\nlosses, thetas, dLdThetas = train_mini_batch(X, Y, theta0,\n\
  optimizer=optimizer, num_epochs=num_epochs-300, batch_size = 5)\nplot_losses(losses)\n\
  plot_thetas(thetas, losses)\n```\n```\n\n## 微调学习率和批大小\n\nDetectron2 为其默认的随机梯度下降优化器（solver/optimizer）提供了多种配置。不过，主要的参数如下：\n\
  \n- `cfg.SOLVER.IMS_PER_BATCH` 超参数用于设置批大小，即每次训练迭代的图像数量。\n- `cfg.SOLVER.BASE_LR`\
  \ 超参数用于设置基础学习率。\n- `cfg.SOLVER.MOMENTUM` 超参数用于存储动量值。\n- `cfg.SOLVER.NESTROV` 超参数决定是否使用\
  \ Nesterov 动量实现。\n- `cfg.SOLVER.WARMUP_ITERS` 超参数用于存储预热迭代次数。\n- `cfg.SOLVER.STEPS`\
  \ 超参数设置学习率按 `cfg.SOLVER.GAMMA`（另一个超参数）缩小的迭代点。\n- `cfg.SOLVER.MAX_ITER` 超参数设置训练的最大迭代次数。该迭代次数不是按轮数（epoch）计数，而是按批次数计数。\n\
  \n下面的代码片段在我们使用 TensorBoard 分析先前训练结果之后，用这些值设置相关参数：\n\n```\n```python\ncfg.SOLVER.IMS_PER_BATCH\
  \ = 6\ncfg.SOLVER.BASE_LR = 0.001\ncfg.SOLVER.WARMUP_ITERS = 1000\ncfg.SOLVER.MOMENTUM\
  \ = 0.9\ncfg.SOLVER.STEPS = (3000, 4000)\ncfg.SOLVER.GAMMA = 0.5\ncfg.SOLVER.NESTROV\
  \ = False\ncfg.SOLVER.MAX_ITER = 5000\n```\n```\n\nTensorBoard 对之前训练损失的检查显示损失波动较大。因此，增加批大小有助于让变化更平滑。不过，由于\
  \ GPU 资源有限，我们将该值设为 6。我们还设置了更高的基础学习率，并设置了相应的步长（steps），以便在指定迭代点将学习率减半（GAMMA）。\n\n\
  恭喜！到此为止，你已经具备了必要的背景知识和代码，可以生成适用于你自己定制图像的像素均值集和标准差集。\n\n## 本章小结\n\n本章介绍了帮助您微调 Detectron2\
  \ 优化器（solver）所需的背景知识和标准超参数。具体来说，它展示了如何使用 TensorBoard 分析训练结果并发现其中的规律。然后，我们利用代码和可视化方法来演示并找出适合\
  \ Detectron2 优化器的超参数。本章还提供了一组被认为适合 Detectron2 目标检测模型的超参数，该模型在脑肿瘤数据集上进行了训练。作为练习，请使用本章生成的所有配置，进行训练实验，将结果加载到\
  \ TensorBoard 中，并分析这些配置之间的差异以及它们如何提升准确率。\n\n本章涵盖了一套标准的技术和超参数，因为它们通常可用于微调机器学习模型。接下来的三章将介绍用于微调目标检测模型的微调技巧。\n\
