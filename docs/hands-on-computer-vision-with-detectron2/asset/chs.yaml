  \n即使仍然漏掉了一个预测，使用简单的模型和配置，预测结果也是不错的。进一步训练、更好的优化以及更复杂的架构应该有助于改善结果。\n\n恭喜！你现在已经掌握了使用Detectron2在自定义数据集上训练对象实例分割应用的步骤。\n\
