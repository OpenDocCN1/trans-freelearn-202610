  train images 310\ntest images 75\ntrain labels 296\ntest labels 75\n```\n\n值得注意的是，该数据集的图像数量相对较少，且有一些图像没有标签（图片中不存在脑肿瘤）。\n\
  \n一种方法是为每种图像类型（冠状面、矢状面或轴状面）分别训练一个模型。然而，由于图像数量较少，将这些文件夹中的图像合并到一个文件夹中可能更为合理。因此，以下代码片段准备了一个辅助方法，用于将\
  \ YOLO 文件从一个文件夹复制到另一个文件夹：\n\n```python\nimport os\nimport shutil\nfrom tqdm import\
  \ tqdm\n\n# move all into one folder\ndef copy_yolo_files(from_folder, to_folder,\
  \ images_labels, train_test):\n    from_path = os.path.join(from_folder, images_labels,\
  \ train_test)\n    to_path = os.path.join(to_folder, images_labels, train_test)\n\
  \    os.makedirs(to_path, exist_ok=True)\n    # get files\n    file_ext = \"*.jpg\"\
  \ if images_labels == \"images\" else \"*.txt\"\n    files = glob(os.path.join(from_path,\
  \ file_ext))\n    # move files\n    for file in tqdm(files):\n        shutil.copy(file,\
  \ to_path)\n```\n\n然后，以下代码片段将来自三个文件夹的图像合并到一个文件夹中：\n\n```python\n# copy\nfor from_folder\
  \ in folders:\n    from_folder = os.path.join(data_folder, from_folder)\n    to_folder\
  \ = data_folder_yolo\n    for images_labels in [\"images\", \"labels\"]:\n     \
  \   for train_test in [\"train\", \"test\"]:\n            copy_yolo_files(from_folder,\
  \ to_folder, images_labels, train_test)\n```\n\n以下代码片段显示新合并数据集的结构：\n\n```bash\n\
  # Now the folder should look like\n!tree -d {data_folder_yolo}\n```\n\n现在，我们准备好使用第\
  \ 3 章中介绍的代码片段将这些数据集转换为 COCO 格式。\n\n### 数据格式转换\n\nDetectron2 支持 COCO 数据格式，而当前数据集为\
  \ YOLO 格式。因此，以下代码片段执行数据格式转换。首先，运行以下代码片段安装 pylabel 包：\n\n```\n!pip install -q pylabel\n\
  ```\n\n接下来，以下片段创建一个辅助方法来执行数据转换（如第 3 章所述）：\n\n```\nfrom pylabel import importer\n\
  \ndef yolo_to_coco(input_folder, output_folder, train_test):\n    # Some codes are\
  \ removed here (please refer to GitHub)\n    # copy annotations\n    for f in tqdm(txt_files):\n\
  \        shutil.copy(f, coco_dir)\n    # copy images\n    for f in tqdm(img_files):\n\
  \        shutil.copy(f, coco_dir)\n    # get the classes\n    with open(os.path.join(input_folder,\
  \ \"classes.txt\"), \"r\") as f:\n        classes = f.read().split(\"\\n\")\n  \
