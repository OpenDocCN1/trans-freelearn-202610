- '# 第 1 部分：


  ## Detectron2 简介


  本第一部分介绍了 Detectron2、其架构以及 Detectron2 可执行的计算机视觉任务。换句话说，它讨论了我们为什么需要计算机视觉应用以及 Detectron2
  能执行哪些计算机视觉任务。此外，本部分还提供了在本地或使用 Google Colab 在云端使用 Detectron2 开发计算机视觉应用的环境设置步骤。并且，它指导您使用
  Detectron2 中最先进的模型构建计算机视觉任务的应用。具体而言，它讨论了 Detectron2 Model Zoo 中现有的预训练模型，以及使用这些模型开发用于目标检测、实例分割、关键点检测、语义分割和全景分割的应用的步骤。


  第一部分涵盖以下章节：


  - *第 1 章，Detectron2 和计算机视觉任务简介*

  - *第 2 章，使用现有的 Detectron2 模型开发计算机视觉应用*

