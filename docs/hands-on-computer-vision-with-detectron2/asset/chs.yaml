  \    [455.8702, 422.2232, 640.2230, 685.9368],\n        [319.8739, 275.5755, 417.1956,\
  \ 651.1306],\n        [224.1623, 656.9628, 340.6416, 790.6293],\n        [496.0885,\
  \ 670.5968, 641.2301, 750.6605],\n        [345.4467, 654.7966, 552.8320, 770.0833],\n\
  \        [499.2968, 669.8000, 639.1102, 750.0955]])), scores:\ntensor([0.9974, 0.9540,\
  \ 0.9063, 0.6769, 0.4782, 0.3086, 0.2689,\n0.1755, 0.0990,\n        0.0933]), pred_classes:\
