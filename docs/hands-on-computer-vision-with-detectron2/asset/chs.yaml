  \n## 将 ONNX 模型加载到浏览器\n\n如果意图是将 PyTorch 或 Detectron2 模型加载到 Web 服务器环境中，则上一章中描述的技术就足够了。此外，我们还可以将\
  \ ONNX 模型部署到 Web 服务器环境中。然而，在许多情况下，可能需要将深度学习模型部署到 Web 浏览器环境中。因此，本节提供了一个将上一节导出的 ONNX\
  \ 模型部署到 Web 浏览器环境的示例。为简单和一致起见，让我们使用 Google Colab 来执行我们的 Web 应用程序。\n\n以下代码片段将上一节创建的\
  \ ONNX 模型下载到当前运行的 Google Colab 实例中：\n\n```\n```bash\n!wget <url_to/Chapter13/onnx_model.onnx>\n\
  ```\n```\n\n此外，为了在浏览器上执行 ONNX 模型，我们需要使用以下片段将 onnx.js 下载到当前文件夹：\n\n```\n```bash\n\
  !wget https://cdn.jsdelivr.net/npm/onnxjs/dist/onnx.min.js\n```\n```\n\n下载完成后，我们可以使用\
  \ %%writefile 指令在当前文件夹中创建一个名为 load_onnx.html 的 HTML 文件。此 HTML 文件有助于加载下载的模型并在示例输入上执行模型以验证流程：\n\
  \n```\n```html\n%%writefile load_onnx.html\n<html>\n\n  <head> </head>\n\n  <body>\n\
  \    <div id=\"output\"></div>\n    <script src=\"onnx.min.js\">\n    </script>\n\
  \    <script>\n      const myOnnxSession = new onnx.InferenceSession();\n```\n\n\
  \n\n\n```\nmyOnnxSession.loadModel(\"./onnx_model.onnx\")\n.then(() => {\n    //\
  \ 第一步：创建一个输入\n    // 第二步：运行并更新输出div\n});\n</script>\n</body>\n</html>\n```\n\n该\
  \ HTML 文件首先加载下载好的 JavaScript 文件（onnx.js）。接着，它创建另一段 JavaScript 来新建一个 ONNX 推理会话并加载下载好的\
  \ ONNX 模型（onnx_model.onnx）。模型（异步）加载完成后，会执行以下两个步骤。\n\n第一步：这一步创建一个示例输入，作为一个 ONNX 张量，其数据与上一节中的相同（[2,\
  \ 3, 4, 5]）：\n\n```\nconst inferenceInputs = new onnx.Tensor(\n  [2, 3, 4, 5],\n\
  \  'float32', [1, 4]\n);\n```\n\n第二步：这一步将上一步准备好的输入传给推理会话，以异步执行预测。执行生成输出对象后，它会取出输出数据并更新输出\
  \ div 的 innerText：\n\n```\nmyOnnxSession.run([inferenceInputs])\n.then((output)\
  \ => {\n  const outputTensor = output.values().next().value;\n  const msg = `model\
  \ output tensor: ${outputTensor.data}`;\n  document.getElementById('output').innerText\
  \ = msg;\n});\n```\n\n下面的代码片段创建了一个辅助方法（expose_content），它可以将指定端口上运行的 web 服务器的内容暴露给\
  \ iframe，并将生成的 iframe 嵌入当前 Google Colab 的输出单元格中：\n\n```\nfrom IPython.display import\
  \ Javascript\ndef expose_content(port, height=200):\n    display(Javascript(\"\"\
  \"\n(async () =>{\n```\n\n访问 D2Go 安装文件夹时请注意 Python 版本（python3.9）。如果安装目录中不存在 configs\
  \ 文件夹，我们可以使用以下语句克隆 d2go 仓库：\n\n```\n!git clone <url_to/d2go.git> d2go_repo\n```\n\
  \n克隆该仓库后，我们可以使用以下语句在安装目录中创建一个名为 configs 的文件夹：\n\n```\nd2go_dir = \"/usr/local/lib/python3.9/dist-packages/d2go\"\
  \nconfigs_dir = f\"{d2go_dir}/configs\"\nimport os\nos.makedirs(configs_dir, exist_ok=True)\n\
  ```\n\n现在，我们可以将下载仓库中 configs 文件夹的内容复制过来：\n\n```\n!cp -r d2go_repo/configs {d2go_dir}\n\
  ```\n\n我们可以列出该文件夹中的所有配置文件以确认复制过程，同时还可以查看 D2Go Model Zoo 中已有的模型：\n\n```\n!ls \"/usr/local/lib/python3.9/dist-packages/d2go/configs\"\
  \n```\n\n该语句应输出以下配置文件：\n\n```\nfaster_rcnn_fbnetv3a_C4_FSDP.yaml\nkeypoint_rcnn_fbnetv3a_dsmask_C4.yaml\n\
