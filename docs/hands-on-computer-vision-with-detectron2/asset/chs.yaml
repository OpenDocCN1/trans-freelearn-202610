  \ Google Colab 笔记本，通过本地内核编写 Python 应用程序。\n\n## 总结\n\n本章讨论了高级计算机视觉任务，包括目标检测、实例分割、关键点检测、语义分割和全景分割，以及何时使用它们。Detectron2\
  \ 是一个框架，有助于为这些 CV 任务实现前沿算法，其优势在于速度更快、精度更高、模块化、可定制，并且基于 PyTorch 构建。其架构包含四个主要部分：输入数据、主干网络、区域提议和感兴趣区域头部。每个组件都可以替换为自定义实现。本章还提供了使用\
  \ Google Colab 设置云开发环境、本地开发环境，或在需要时将 Google Colab 连接到本地运行时的步骤。\n\n你现在已经了解了 Detectron2\
  \ 能够帮助开发的主要 CV 任务，并已设置好开发环境。下一章（*第 2 章*）将指导你使用 Detectron2 Model Zoo 中提供的前沿模型，为上述所有\
  \ CV 任务构建 CV 应用程序。\n\n## 技术要求\n\n你应该已经按照第 1 章中的说明设置好开发环境。如果你尚未完成，请在继续之前完成开发环境的设置。所有代码、数据集和相应结果均可在本书的\
  \ GitHub 页面（位于 Chapter02 文件夹下）获取：https://github.com/PacktPublishing/Hands-On-Computer-Vision-with-Detectron2。强烈建议你下载代码并跟着操作。\n\
  \n## Detectron2 Model Zoo 简介\n\n在深度学习中，当开发大型模型并在大规模数据集上训练模型时，深度学习方法的开发者通常会提供预训练模型。其主要原因是这些模型的开发者通常是该领域的重要参与者（例如\
  \ Facebook、Google、Microsoft 或大学），他们拥有计算资源（例如 CPU 和 GPU），可以在大型数据集上训练此类模型。而普通开发者通常无法获得这些计算资源。\n\
  \n这些预训练模型通常在数据集上训练，用于模型预期使用的常见任务。因此，这类模型的另一个好处是，如果用户手头的任务与模型训练的目标相匹配，他们可以采用这些模型并将其用于具体场景。此外，这些模型还可以作为基线，最终用户可以在其特定场景下使用更小的数据集进行进一步的微调，而训练这些模型所需的计算资源也更少。\n\
  \nDetectron2 还提供了大量模型，这些模型在其 Model Zoo 中使用高计算资源的 Big Basin 服务器（8 块 NVIDIA V100 GPU\
  \ 和 NVLink）训练而成。你可以从以下链接阅读更多信息并下载所有模型：https://github.com/facebookresearch/detectron2/blob/main/MODEL_ZOO.md。\n\
  \n对于新用户来说，要掌握具有不同规格的可用模型的信息可能会有些令人不知所措。因此，本节详细说明了用户应查找哪些信息，以使用 Detectron2 Model\
  \ Zoo 中的这些前沿模型完成手头的特定计算机视觉任务。这些信息包括查找以下内容：\n\n- 模型训练所用的数据集\n- 该模型的架构\n- 训练和推理时间\n\
  - 训练内存需求\n- 模型准确率\n- 训练模型（权重）的链接\n- 其配置文件（.yaml）的链接\n\n\n\n\n\n与任何预训练模型相关的下一个重要信息是预训练模型的架构。这通常通过模型在模型库（Model\
  \ Zoo）中的名称来体现。例如，R50 和 R101 分别表示**微软亚洲研究院（MSRA）ResNet-50** 和 **ResNet-101**。类似地，X101\
  \ 和 X152 分别表示 ResNeXt-101-32x8d 和 ResNeXt-152-32x8d。有些模型名称包含 FPN。这部分名称表示该模型使用了**特征金字塔网络（FPN）**技术。该技术意味着特征是在模型架构的不同层中提取的（而不是从最后一层获取输出特征并将其送入预测过程）。使用\
  \ FPN 主干网络有助于在时间权衡下提高准确率。此外，名称中包含 C4 表示该模型使用 conv4 主干网络。类似地，名称中包含 DC5 表示该模型使用在 conv5\
  \ 中带有膨胀（dilation）的 conv5。\n\n> **重要提示**\n> 感兴趣的读者可以参阅 https://github.com/KaimingHe/deep-residual-networks\
  \ 上关于 ResNet 架构的网页，以及 https://github.com/facebookresearch/ResNeXt 上关于 ResNeXt 架构的网页，以获取更多信息。\n\
  \n在了解了训练数据集和模型架构之后，下一步是检查训练和推理时间、训练内存以及模型准确率。这些信息有助于决定硬件需求以及速度与准确率之间的权衡。这些信息同样列在\
  \ Detectron2 模型库中的每个预训练模型下。\n\n在根据速度与硬件需求之间的权衡决定要使用哪个模型之后，下一步是下载模型的配置文件。在模型库中，模型名称会链接到一个\
  \ .yaml 配置文件。**YAML**（**Yet Another Markup Language** 的缩写，或 **YAML ain't markup\
  \ language**）是一种用于数据序列化的人类可读编程语言。它通常用于编写配置文件和支持自动化流程。最后，还有一个用于下载预训练模型权重的链接。\n\n\
  到目前为止，你应该已经能够阅读并理解 Detectron2 模型库中可用预训练模型的重要信息。下一步是使用一些预训练模型来执行重要的计算机视觉任务。使用 Detectron2\
  \ 开发计算机视觉应用通常包括以下步骤：\n\n- 选择配置文件\n- 获取预测器\n- 执行推理\n- 可视化结果\n\n以下各节将详细介绍开发目标检测应用的这些步骤。\n\
  \n## 选择模型\n```\nconfig_file = \"COCO-Detection/faster_rcnn_X_101_32x8d_FPN_3x.yaml\"\
  \ncheckpoint_url = \"COCO-Detection/faster_rcnn_X_101_32x8d_FPN_3x.yaml\"\n# Create\
  \ a configuration file\ncfg = get_cfg()\nconfig_file = model_zoo.get_config_file(config_file)\n\
  cfg.merge_from_file(config_file)\n# Download weights\ncfg.MODEL.WEIGHTS = model_zoo.get_checkpoint_url(checkpoint_url)\n\
  score_thresh_test = 0.95\ncfg.MODEL.ROI_HEADS.SCORE_THRESH_TEST = score_thresh_test\n\
  predictor = DefaultPredictor(cfg)\n```\n\n具体来说，get_cfg 方法有助于获取该模型的默认配置对象。类似地，model_zoo\
  \ 有助于获取配置文件（.yaml 文件）并下载预训练权重。同时，需要 DefaultPredictor 来根据下载的配置文件和权重创建预测器。除了必需的导入之外，这段代码还抑制了几条可以安全忽略的用户警告。\n\
  \n值得注意的是，cfg.MODEL.ROI_HEADS.SCORE_THRESH_TEST 参数当前设置为 0.95。该参数在测试时用于过滤掉所有检测置信度低于此值的检测对象。将此参数设置为较高值（接近\
  \ 1.0）意味着我们希望获得高精确率和低召回率。同样，将其设置为较低值（接近 0.0）意味着我们更倾向于低精确率和高召回率。一旦我们有了模型（或者可以互换地称之为预测器），就可以开始执行推理了。\n\
  \n## 执行推理\n\n以下代码片段对输入图像执行目标检测。具体来说，我们首先导入 cv2 以从 input_url 读取图像。接下来，使用之前创建的预测器，即可相对轻松地对加载的图像执行目标检测（请将图像上传到\
  \ Google Colab 以执行推理）：\n\n```\nimport cv2\ninput_url = \"input.jpeg\"\nimg = cv2.imread(input_url)\n\
  output = predictor(img)\n```\n\n下一个重要任务是理解 Detectron2 给出的输出格式以及每个输出组件的含义。此处的 print\
  \ (output) 显示了输出变量及其提供的字段：\n\n```\n{'instances': Instances(num_instances = 4, image_height\
  \ = 720, image_width = 960, fields = [pred_boxes: Boxes(tensor([[492.1558, 331.5353,\
  \ 687.8397, 637.9542], [294.6652, 192.1288, 445.8517, 655.3390], [419.8898, 253.9013,\
  \ 507.7427, 619.1491], [451.8833, 395.1392, 558.5139, 671.0604]], device = 'cuda:0')),\
  \ scores: tensor([0.9991, 0.9986, 0.9945, 0.9889], device = 'cuda:0'), pred_classes:\
  \ tensor([0, 0, 0, 0], device = 'cuda:0')]) }\n```\n\n可以观察到，除了图像信息之外，目标检测结果还包括检测到的实例（instances），以及相应的预测边界框（pred_boxes）、预测置信度分数（scores）和预测类别标签（pred_classes）。有了这些信息，我们就可以将检测到的对象及其对应的边界框可视化。\n\
  \n## 可视化结果\n\nDetectron2 提供了一个 Visualizer 类，它可以帮助你轻松地将检测结果标注到输入图像上。因此，以下代码片段导入该类并使用其可视化方法将检测结果标注到输入图像上：\n\
  \n```\nfrom google.colab.patches import cv2_imshow\nfrom detectron2.utils.visualizer\
  \ import Visualizer\nfrom detectron2.data import MetadataCatalog\nmetadata = MetadataCatalog.get(cfg.DATASETS.TRAIN[0])\n\
  v = Visualizer(img[:, :, ::-1], metadata, scale=0.5)\ninstances = output[\"instances\"\
  ].to(\"cpu\")\nannotated_img = v.draw_instance_predictions(instances)\ncv2_imshow(annotated_img.get_image()[:,\
  \ :, ::-1])\n```\n\n具体来说，第一条语句导入 cv2_imshow 方法（一个 Google Colab 补丁），用于在 Google Colab\
  \ 输出中显示图像。下一条导入语句是 Visualizer 本身。第三条导入语句帮助获取有关训练数据集的信息。具体来说，这个 MetadataCatalog 对象为预测对象提供标签名称。在本例中，类别标签\
  \ 0 对应的是 person（人），如输出中所示。\n\n## 选择配置文件\n\n与目标检测类似，Detectron2 也提供了一系列针对对象实例分割任务预训练的前沿模型。例如，图\
  \ 2.5 展示了在 COCO 实例分割数据集上预训练的 Mask R-CNN 模型列表。\n\n| 名称 | 学习率调度 | 训练时间（秒/迭代） | 推理时间（秒/图像）\
  \ | 训练内存（GB） | 边界框 AP | 掩码 AP | 模型 ID | 下载 |\n|---|---|---|---|---|---|---|---|---|\n\
  | R50-C4 | 1x | 0.584 | 0.110 | 5.2 | 36.8 | 32.2 | 137259246 | model | metrics\
  \ |\n| R50-DC5 | 1x | 0.471 | 0.076 | 6.5 | 38.3 | 34.2 | 137260150 | model | metrics\
  \ |\n| R50-FPN | 1x | 0.261 | 0.043 | 3.4 | 38.6 | 35.2 | 137260431 | model | metrics\
  \ |\n| R50-C4 | 3x | 0.575 | 0.111 | 5.2 | 39.8 | 34.4 | 137849525 | model | metrics\
  \ |\n| R50-DC5 | 3x | 0.470 | 0.076 | 6.5 | 40.0 | 35.9 | 137849551 | model | metrics\
  \ |\n| R50-FPN | 3x | 0.261 | 0.043 | 3.4 | 41.0 | 37.2 | 137849600 | model | metrics\
  \ |\n| R101-C4 | 3x | 0.652 | 0.145 | 6.3 | 42.6 | 36.7 | 138363239 | model | metrics\
  \ |\n| R101-DC5 | 3x | 0.545 | 0.092 | 7.6 | 41.9 | 37.3 | 138363294 | model | metrics\
  \ |\n| R101-FPN | 3x | 0.340 | 0.056 | 4.6 | 42.9 | 38.6 | 138205316 | model | metrics\
  \ |\n| X101-FPN | 3x | 0.690 | 0.103 | 7.2 | 44.3 | 39.5 | 139653917 | model | metrics\
  \ |\n\n图 2.5：基于 Mask R-CNN 的 COCO 实例分割基线\n\n在检查了这些模型的规格后，本特定应用选择了 X101-FPN 模型。以下是该配置文件的相对路径（从模型名称链接的地址中提取并截取）：\n\
  \n```\nCOCO-InstanceSegmentation/mask_rcnn_X_101_32x8d_FPN_3x.yaml\n```\n\n## 获取预测器\n\
  \n用于获取此对象实例分割预测器的代码片段与之前开发的目标检测应用相同，除了以下两行。这两行指定了该特定预训练模型的不同配置文件：\n\n```\n# Select\
  \ a model\nconfig_file = \"COCO-InstanceSegmentation/mask_rcnn_X_101_32x8d_FPN_3x.yaml\"\
  \ncheckpoint_url = \"COCO-InstanceSegmentation/mask_rcnn_X_101_32x8d_FPN_3x.yaml\"\
  \n```\n\n\n\n\n这一简单的修改是 Detectron2 优秀设计的一个范例。只需简单地修改配置文件的链接，就可以相对容易地从一种应用类型切换到另一种应用类型。\n\
  \n## 执行推理\n\n推理代码片段与上一节中开发的目标检测应用相同。然而，目标实例分割的输出有一些差异。具体来说，除了 `pred_boxes`、`scores`\
  \ 和 `pred_classes`（分别对应边界框、预测置信度分数和相应的预测类别标签）之外，还有一个张量（`pred_masks`）用于指示输入图片中的每个像素是否属于某个检测到的实例（`True`/`False`）。以下是这个张量的示例（为了节省空间，输出的一部分被截断了），共有四个检测到的实例：\n\
  \n```\npred_masks: tensor([\n  [[False, False, False, ..., False, False, False],\n\
  \   ...,\n   [False, False, False, ..., False, False, False]],\n\n  [[False, False,\
  \ False, ..., False, False, False],\n   ...,\n   [False, False, False, ..., False,\
  \ False, False]],\n\n  [[False, False, False, ..., False, False, False],\n   ...,\n\
  \   [False, False, False, ..., False, False, False]],\n\n  [[False, False, False,\
  \ ..., False, False, False],\n   ...,\n   [False, False, False, ..., False, False,\
  \ False]],\n  device='cuda:0')\n```\n\n## 可视化结果\n\n得益于 Detectron2 的出色设计，可视化实例分割结果与可视化目标检测结果的方式相同。也就是说，代码片段保持一致。图\
  \ 2.6 显示了带有实例分割结果注释的输入图像。具体来说，除了边界框和相应的预测置信度外，属于每个检测到的个体的像素也被高亮显示。\n\n![](img/0e7994c850a84b7a53d34c7f943c7edd_48_0.png)\n\
  \n图 2.6：带有目标实例分割结果的推理输出\n\n恭喜！你现在已经完成了一个使用 Detectron2 前沿模型的目标实例分割应用，与之前开发的目标检测应用相比，仅需少量修改。在下一节中，你将学习如何使用\
  \ Detectron2 开发关键点检测应用。\n\n## 开发关键点检测应用\n\n除了检测目标之外，关键点检测还会标出检测目标的重要部分，这些部分被称为**关键点**。这些关键点描述了被检测目标的基本特征。该特征通常对图像旋转、缩放、平移或变形保持不变。以下各节将详细介绍使用\
  \ Detectron2 预训练模型开发关键点检测应用的步骤。\n\n```\n[9, 9, 9, ..., 9, 9, 9],\n[9, 9, 9, ...,\
  \ 9, 9, 9],\n[9, 9, 9, ..., 9, 9, 9]], device = 'cuda:0', dtype = torch.int32),\n\
  [{'id': 1, 'isthing': True, 'score': 0.9987247586250305, 'category_id': 0, 'instance_id':\
  \ 0 },\n{'id': 2, 'isthing': True, 'score': 0.997495174407959, 'category_id': 0,\
  \ 'instance_id': 1 },\n{'id': 3, 'isthing': True, 'score': 0.9887707233428955, 'category_id':\
  \ 0, 'instance_id': 2 },\n{'id': 4, 'isthing': True, 'score': 0.9777324199676514,\
  \ 'category_id': 0, 'instance_id': 3 },\n{'id': 5, 'isthing': False, 'category_id':\
  \ 37, 'area': 15173 },\n{'id': 6, 'isthing': False, 'category_id': 40, 'area': 163644\
  \ },\n{'id': 7, 'isthing': False, 'category_id': 45, 'area': 192040 },\n{'id': 8,\
  \ 'isthing': False, 'category_id': 46, 'area': 62182 },\n{'id': 9, 'isthing': False,\
  \ 'category_id': 47, 'area': 164592 }])\n```\n\n具体来说，该字段是一个包含两个元素的元组。第一个元素是一个与输入图像尺寸相同的张量。该张量有助于为输入图像中的每个像素指示检测到的类别标签编号。该元组的第二个元素是一个项目列表，将相应的标签编号映射到已知类别。\n\
  \n## 可视化结果\n\n全景分割的可视化代码片段与我们学过的其他视觉任务非常相似，不同之处在于我们需要从输出中提取 `panoptic_seg` 字段（前面已描述）的两个元素。接下来，这两个元素将被传递给\
  \ `Visualizer` 对象的 `draw_panoptic_seg_predictions` 方法以执行注释：\n\n```\nfrom google.colab.patches\
  \ import cv2_imshow\nfrom detectron2.utils.visualizer import Visualizer\nfrom detectron2.data\
  \ import MetadataCatalog\nmetadata = MetadataCatalog.get(cfg.DATASETS.TRAIN[0])\n\
  v = Visualizer(img[:, :, ::-1], metadata, scale=0.5)\n```\n\n## 选择配置文件和获取预测器\n\n\
  语义分割是全景分割的一个副产品。例如，如果检测到的目标位于同一区域，它会将属于相同类别的目标合并为一个，而不是为每个检测到的目标提供分割数据。因此，用于语义分割的模型与用于全景分割的模型相同。因此，配置文件、权重以及获取预测器的代码片段与之前全景分割应用中的相同。\n\
  \n## 执行推理\n\n语义分割的推理代码片段也与全景分割相同。推理结果（与全景分割相同）也具有一个名为 `sem_seg` 的字段。该字段的形状为 类别数\
  \ × 图像高度 × 图像宽度。具体而言，在这种特定情况下为 54 × 720 × 960。尺寸 720 × 960 对应输入图像的所有像素。对于每个像素，有\
  \ 54 个值，分别对应于该像素被分类为训练数据集中 54 个类别的概率。\n\n## 可视化结果\n\n语义分割结果的可视化略有不同。首先，提取 `sem_seg`\
  \ 字段。接着，在 54 个概率中，使用 `argmax` 方法为每个像素选择预测概率最高的类别标签作为其标签。然后，将提取的数据传递给 `Visualizer`\
  \ 对象的 `draw_sem_seg` 方法以进行可视化。以下是用于可视化语义分割结果的代码片段：\n\n```\nfrom google.colab.patches\
  \ import cv2_imshow\nfrom detectron2.utils.visualizer import Visualizer\nfrom detectron2.data\
  \ import MetadataCatalog\nmetadata = MetadataCatalog.get(cfg.DATASETS.TRAIN[0])\n\
  v = Visualizer(img[:, :, ::-1], metadata, scale=0.5)\nsem_seg = output[\"sem_seg\"\
  ].argmax(dim=0)\nannotated_img = v.draw_sem_seg(sem_seg.to(\"cpu\"))\ncv2_imshow(annotated_img.get_image()[:,\
  \ :, ::-1])\n```\n\n图 2.11 显示了在相应输入图像上可视化的语义分割结果。值得注意的是，与全景分割结果相比，检测到的人被分组为一个区域，并被归类为“物体”（things）。\n\
  \n```\nfrom detectron2 import model_zoo\nfrom detectron2.engine import DefaultPredictor\n\
  # We suppress some user warnings\nimport warnings\nwarnings.simplefilter(action='ignore',category=UserWarning)\n\
  # Create a configuration and a predictor\ndef get_predictor(config_file, checkpoint_url,\
  \ score_thresh_test=1.0):\n    # create a configuration object\n    cfg = get_cfg()\n\
  \    # get the configurations from the config_file\n    config_file = model_zoo.get_config_file(config_file)\n\
  \    cfg.merge_from_file(config_file)\n    # get the pre-built weights of a trained\
  \ model from the checkpoint\n    cfg.MODEL.WEIGHTS = model_zoo.get_checkpoint_url(checkpoint_url)\n\
  \    # set the threshold for recall vs. precision at test time\n    cfg.MODEL.ROI_HEADS.SCORE_THRESH_TEST\
  \ = score_thresh_test\n    # create a predictor\n    predictor = DefaultPredictor(cfg)\n\
  \    return cfg, predictor\n```\n\n要获取模型，你只需选择配置文件和预训练权重的路径，并将它们传递给该方法。然后，该方法会返回一个预测器（`predictor`）以及该模型的配置（`cfg`）。获得预测器后，下一步是执行推理。\n\
  \n## 执行推理\n\n所有计算机视觉任务的代码片段完全相同。因此，我们应该为此提供一个方法（`perform_inference`）。以下是给定任意预测器（`predictor`）和输入图像路径（`input_url`）时执行推理的代码片段：\n\
  \n```\nimport cv2\nfrom google.colab.patches import cv2_imshow\ndef perform_inference(predictor,\
  \ input_url):\n    img = cv2.imread(input_url)\n    output = predictor(img)\n  \
  \  return img, output\n```\n\n\n\n\n\n该方法（`perform_inference`）返回输入图像以及预测器对输入图像的预测输出。下一步是需要一种方法将此输出标注到输入图像上。\n\
  \n## 可视化结果\n\n用于可视化目标检测、目标实例分割和关键点检测的代码片段是相同的。然而，如果任务是全景分割或语义分割，则会略有不同。因此，有常量来指示要执行的任务，可视化方法（称为\
  \ `visualize_output`）可以根据输入任务执行适当的视觉化。以下是结果可视化的代码片段：\n\n```python\nfrom detectron2.utils.visualizer\
  \ import Visualizer\nfrom detectron2.data import MetadataCatalog\n\n# computer vision\
  \ tasks\nOBJECT_DETECTION = 0\nINSTANCE_SEGMENTATION = 1\nKEYPOINT_DETECTION = 2\n\
  SEMANTIC_SEGMENTATION = 3\nPANOPTIC_SEGMENTATION = 4\n\ndef visualize_output(img,\
  \ output, cfg, task=OBJECT_DETECTION, scale=1.0):\n    v = Visualizer(img[:, :,\
  \ ::-1], MetadataCatalog.get(cfg.DATASETS.TRAIN[0]), scale=scale)\n    if task ==\
  \ PANOPTIC_SEGMENTATION:\n        panoptic_seg, segments_info = output[\"panoptic_seg\"\
  ]\n        annotated_img = v.draw_panoptic_seg_predictions(panoptic_seg.to(\"cpu\"\
  ), segments_info)\n    elif task == SEMANTIC_SEGMENTATION:\n        sem_seg = output[\"\
  sem_seg\"].argmax(dim=0)\n        annotated_img = v.draw_sem_seg(sem_seg.to(\"cpu\"\
  ))\n    else:\n        annotated_img = v.draw_instance_predictions(output[\"instances\"\
  ].to(\"cpu\"))\n    cv2_imshow(annotated_img.get_image()[:, :, ::-1])\n```\n\n##\
  \ 执行计算机视觉任务\n\n在拥有获取预测器（`get_predictor`）、执行推理（`perform_inference`）和可视化输出（`visualize_output`）的相应方法后，我们就可以准备执行检测了。以下是使用这些方法执行目标检测任务的代码片段：\n\
  \n```python\nconfig_file = \"COCO-Detection/faster_rcnn_X_101_32x8d_FPN_3x.yaml\"\
  \ncheckpoint_url = \"COCO-Detection/faster_rcnn_X_101_32x8d_FPN_3x.yaml\"\nscore_thresh_test\
  \ = 0.95\ninput_url = \"input.jpeg\"\ntask = OBJECT_DETECTION\nscale = 0.5\n\n#\
  \ get a predictor\ncfg, predictor = get_predictor(config_file, checkpoint_url, score_thresh_test)\n\
  \n# perform inference\nimg, output = perform_inference(predictor, input_url)\n\n\
  # visualization\nvisualize_output(img, output, cfg, task, scale)\n```\n\n其他计算机视觉任务也可以以相同的方式执行。此外，这些方法可以放入一个库（一个\
  \ `*.py` 文件）中，因此如果合适，你可以在任何计算机视觉应用中包含并使用它们。\n\n## 总结\n\n本章讨论了 Detectron2 Model Zoo\
  \ 上可用的预训练模型。具体来说，它指出了在为计算机视觉任务选择预训练模型时需要关注的重要信息。然后它提供了开发目标检测应用、目标实例分割应用、关键点检测应用、全景分割应用和语义分割应用的代码片段。这些应用的代码片段是相似的。因此，代码片段被抽象为获取模型、执行推理和可视化输出的典型方法。然后这些方法可以被重用，以便快速使用\
  \ Detectron2 开发不同的计算机视觉应用。\n\nDetectron2 上的前沿模型是使用大量图像和庞大的计算资源训练的。因此，这些模型具有很高的准确性。此外，它们也是在用于日常计算机视觉任务的数据集上训练的，具有类别标签。因此，它们有很大机会满足你的个人需求。然而，如果\
  \ Detectron2 没有满足你需求的模型，你可以使用 Detectron2 在自定义数据集上训练模型。本书的第 2 部分涵盖了为对象检测任务在自定义数据集上准备数据、训练和微调\
  \ Detectron2 模型的步骤。\n"
- "# 第 2 部分：开发自定义目标检测模型\n\n第二部分是关于动手开发和微调自定义检测模型，涉及数据准备、训练和微调步骤。数据准备步骤介绍了常见的计算机视觉数据集以及下载可自由获取图像的代码。此外，它还讨论了用于标注数据的工具、常见的标注格式，以及将不同格式转换为\
  \ Detectron2 支持的格式的代码。然后它进一步详细介绍了使用可视化和代码的 Detectron2 应用的架构。训练模型后，本部分说明了在微调训练模型之前利用\
  \ TensorBoard 查找训练见解的步骤。对于微调，本节提供了深度学习优化器的入门介绍以及微调 Detectron2 求解器的步骤。对于专门优化检测模型，本部分包括计算为\
  \ Detectron2 模型生成锚框的合适尺寸和比例参数的代码。最后，本部分提供了增强技术以及 Detectron2 在训练和测试时执行增强的系统的概览。\n\
  \n第二部分涵盖以下章节：\n\n- 第 3 章，目标检测应用的数据准备\n- 第 4 章，Detectron2 中目标检测模型的架构\n- 第 5 章，训练自定义目标检测模型\n\
  - 第 6 章，检查训练结果和微调 Detectron2 的求解器\n- 第 7 章，微调目标检测模型\n- 第 8 章，图像数据增强技术\n- 第 9 章，应用训练时和测试时的图像增强\n\
  \n## 常见数据源\n\n*第 2 章介绍了计算机视觉社区最常见的两个数据集。它们是 **ImageNet** 和微软 **COCO（Common Objects\
  \ in Context）**。这些数据集还包含许多预训练模型，可以预测各种类别标签，可能满足你的日常需求。*\n\n如果你的任务是检测不太常见的类别标签，探索\
  \ **Large Vocabulary Instance Segmentation（LVIS）** 数据集可能值得。它有超过 1,200 个类别和 164,000\
  \ 张图像，包含许多罕见类别和约 200 万个高质量实例分割掩码。Detectron2 还提供了用于预测这 1,200 多个标签的预训练模型。因此，你可以按照\
  \ *第 2 章* 中描述的步骤创建一个满足你需求的计算机视觉应用。有关 LVIS 数据集的更多信息可在其网站 https://www.lvisdataset.org\
  \ 上获得。\n\n如果你有一个任务，没有现有的/预训练模型可以满足你的需求，那么是时候寻找现有的数据集并训练你的模型了。寻找数据集的常见位置之一是 **Kaggle**（https://www.kaggle.com）。Kaggle\
  \ 是 Google 的子公司。它为数据科学家和机器学习从业者提供了一个在线平台，用于共享数据集、训练机器学习模型，并通过讨论分享训练好的模型及其想法。它还经常举办并允许用户主办数据科学和机器学习竞赛（当然也包括计算机视觉竞赛）。在撰写本文时，在\
  \ Kaggle 上搜索短语“object detection”会带来 555 个数据集，如 *图 3.1* 所示。\n\n![](img/0e7994c850a84b7a53d34c7f943c7edd_63_0.png)\n\
  \n图 3.1：Kaggle 上用于目标检测任务的数据集\n\nKaggle 包含数据科学和机器学习一般的数据集，包括计算机视觉数据集。然而，如果你仍然找不到满足你自定义需求的数据集，你可能有兴趣探索位于\
  \ https://universe.roboflow.com 的 **Roboflow Universe**。它声称是世界上最广泛的开源计算机视觉数据集和 API\
  \ 集合。在撰写本文时，Roboflow Universe 上有超过 1 亿张图像、110,000 个数据集和 10,000 个预训练模型，如 *图 3.2*\
  \ 所示。常见的计算机视觉任务的数据集是可用的，例如目标检测、实例分割和语义分割。\n\n\n\n\n\n![](img/0e7994c850a84b7a53d34c7f943c7edd_64_0.png)\n\
  \n图 3.2：Roboflow Universe 上的数据集\n\n计算机视觉正在快速发展，该领域有着数量庞大的从业者。如果你在前两个资源中找不到满足需求的数据集，可以使用互联网（例如\
  \ Google）搜索你想要的数据集。然而，如果仍然找不到这样的数据集，那么就该自行收集并标注数据集了。接下来的章节将介绍为计算机视觉应用收集和标注数据集的标准工具与步骤。\n\
  \n## 获取图像\n\n当你开始一个新项目时，你可能会有一批通过相机、智能手机、无人机或其他专用设备等图形设备收集的图像。如果你已经有一些照片，可以跳过此步骤，直接进入下一步——选择标注工具并开始标注。然而，如果你正要开始一个全新项目，甚至没有任何图像，你可以从本节关于从互联网收集图片的内容中获得一些思路。从互联网收集的图像可能涉及版权问题。因此，你应当检查版权，确认下载的图像是否可用于你的目的。\n\
  \nGoogle Images 包含海量照片，并且每天都在增长。因此，它是抓取图像以训练自定义模型的绝佳资源。Python 有一个 `simple_image_download`\
  \ 包，提供了使用关键词或标签搜索并下载图像的脚本。首先，我们使用以下命令安装这个包：\n\n```\n!pip install simple_image_download\n\
  ```\n\n你可以在 Google Colab 的代码单元格中运行此命令来安装它，并将图像下载到正在运行的 Google Colab 实例中。然而，一旦实例停止，下载的照片就会丢失。因此，你应该将图像下载到映射的\
  \ Google Drive 文件夹或本地计算机上。你可以在本地托管的 Jupyter notebook 中运行相同的命令，或者移除开头的感叹号（!）并在终端中执行它以在本地安装该包。如果你在\
  \ Google Colab 上运行，以下代码片段有助于映射 Google Drive 并在 Google Drive 中创建一个文件夹：\n\n```\nimport\
  \ os\nfrom google.colab import drive\ndrive.mount('/gdrive')\nproject_folder = \"\
  /gdrive/My Drive/Detectron2/Chapter3\"\nos.makedirs(project_folder, exist_ok=True)\n\
  ```\n\n下一个代码片段（在单独的 Google Colab 代码单元格中执行）将工作目录设置为之前创建的文件夹，这样即使 Google Colab 实例停止，下载结果也会保留在该文件夹中：\n\
  \n```\ncd \"/gdrive/My Drive/Detectron2/Chapter3\"\n```\n\n始终建议在另一个代码单元格中运行 `pwd()`\
  \ 命令并检查输出，以确保 Google Colab 当前正在该目录下工作。\n\n进入指定文件夹后，以下代码片段有助于使用 `simple_image_download`\
  \ 包从 Google Images 下载图像：\n\n```\nfrom tqdm import tqdm\nfrom simple_image_download.simple_image_download\
  \ import simple_image_download as Downloader\ndef _download(keyword, limit):\n \
  \   downloader = Downloader()\n    downloader.download(keywords=keyword, limit=limit)\n\
  \    urls = downloader.urls(keywords=keyword, limit=limit)\n    return urls\n\n\
  def download(keywords, limit):\n    for keyword in tqdm(keywords):\n        urls\
  \ = _download(keyword=keyword, limit=limit)\n        with open(f\"simple_images/{keyword}.txt\"\
  , \"w\") as f:\n            f.writelines('\\n'.join(urls))\n```\n\n具体来说，第一条 import\
  \ 语句用于导入 `tqdm` 包，它可用来显示下载进度。这很重要，因为从互联网下载大量图像需要时间。因此，有一个进度条帮助我们了解当前正在工作以及完成任务大约需要多长时间会非常有用。下一条\
  \ import 语句导入 `simple_image_download` 对象，它有助于执行下载任务。接下来是 `_download` 辅助方法，用于使用关键词（由\
  \ `keyword` 参数指定）从 Google 下载指定数量（由 `limit` 参数指定）的图像。此外，对于对应的图片，该辅助方法还会返回一个 URL 数组，可将其存储起来，用于验证下载的图像并在需要时检查版权。\n\
  \n下一个方法名为 `download`。它使用前面的辅助函数下载图像，并将结果存储在名为 `simple_images` 的文件夹下。每个关键词的图像存储在以其关键词命名的子文件夹中。此外，该方法还会为每个关键词写入一个文本文件，其中包含所有对应下载图像的\
  \ URL，文件名与关键词相同，扩展名为 `.txt`。例如，以下代码片段为 `brain tumors x-ray` 和 `heart tumors x-ray`\
  \ 关键词各下载 10 张图像：\n\n```\ndownload(keywords=[\"brain tumors x-ray\", \"heart tumors\
  \ x-ray\"], limit=10)\n```\n\n图 3.3 显示了 Google Drive 中生成的结果文件夹，其中包含下载的图像以及用于存储图像\
  \ URL 的文本文件。\n\n![](img/0e7994c850a84b7a53d34c7f943c7edd_66_0.png)\n\n图 3.3：生成的图像文件夹及其对应\
  \ URL 的文本文件\n\n下载的图像可能并不完全符合你的需求。因此，你应该检查下载的图像，并删除那些不符合特定要求的图像。一旦你拥有了想要的图像，下一步就是选择一种工具，开始为训练和验证标注图像。\n\
  \n## 选择图像标注工具\n\n计算机视觉应用正在快速发展。因此，有许多用于计算机视觉应用图像标注的工具。这些工具从免费开源到完全商业化，或提供免费试用的商业化（这意味着在可用功能方面存在一些限制）不等。标注工具可以是桌面应用程序（需要安装）、在线\
  \ Web 应用程序或本地托管的 Web 应用程序。在线应用程序甚至可能提供云存储、支持团队协作标注的工具，以及有助于加快标注速度的预训练模型（通常需要一定费用）。\n\
  \n其中一个流行的图像标注工具是 `labelImg`。它可在 `https://github.com/heartexlabs/labelImg/blob/master/README.rst`\
  \ 获取。它是一个开源、轻量、快速、易于使用的基于 Python 的应用程序，学习曲线短。\n\n它的局限性在于只支持创建矩形边界框。它目前是 **Label\
  \ Studio**（一个功能多得多的更复杂工具）的一部分。然而，如果手头的任务只是进行目标检测和定位，它仍然是最佳选择。\n\n另一个流行的工具是 `labelme`（`https://github.com/wkentaro/labelme`）。它在基于\
  \ Python 的应用程序、开源、快速且易于使用方面与 labelImg 类似。然而，除了矩形边界框之外，它还支持其他标注类型。具体来说，它可以标注多边形、矩形、圆形、线条和点。因此，它可用于为目标检测以及语义或实例分割任务标注训练图像。\n\
  \nlabelImg 和 labelme 都是本地安装的应用程序。然而，如果你想使用本地托管的 Web 应用程序，可以参考 **VGG（Visual Geometry\
  \ Group）图像标注器（VIA）**。VIA 是一个轻量、独立的基于浏览器的 Web 应用程序。它也支持标注多边形、圆形、线条和矩形边界框。\n\n如果你想使用基于云的\
  \ Web 应用程序（支持云存储和 Web 上的标注），你可能会喜欢 `roboflow`，可在 `https://app.roboflow.com` 获取。这个在线\
  \ Web 应用程序支持多种标注模式。它提供了让团队协作标注图像的工具。它还支持使用预训练模型帮助加快图像标注。然而，它的若干高级功能仅在付费计划中可用。另一个用于此任务的流行\
  \ Web 平台是 `https://www.makesense.ai`。它是开源的，并在 GPLv3 许可下免费使用。它支持多种流行的标注格式，并使用 AI\
  \ 来提高标注效率。\n\n本章选择 `labelImg` 来为目标检测任务准备数据。*第 10 章* 使用 `labelme` 来为目标实例分割任务准备数据。选择标注工具后，下一步是了解该工具支持哪些标注格式、应选择哪一种，以及如何将其转换为\
  \ Detectron2 支持的格式。\n\n## 标注格式\n\n与标注工具类似，为计算机视觉应用标注图像时也有许多不同的标注格式可用。常见的标准包括 COCO\
  \ JSON、Pascal VOC XML 和 YOLO PyTorch TXT。还有更多格式（例如 TensorFlow TFRecord、CreateML\
  \ JSON 等）。然而，由于篇幅限制，本节仅涵盖前面列出的三种最常见的标注标准。此外，本节使用来自 Kaggle（`https://www.kaggle.com/datasets/davidroberts/brain-tumor-object-detection-datasets`）可获取的脑肿瘤目标检测数据集测试集中的两张图像和标签来说明这些数据格式并展示它们之间的差异，如图\
  \ *3.4* 所示。本节简要讨论每种标注格式的要点，感兴趣的读者可以参考本章的 GitHub 页面，以更详细地查看同一数据集的不同格式。\n\n\n\n\n\
  这里是信息部分：\n\n```\n\"info\": {\n    \"year\": \"2022\",\n    \"version\": \"1\",\n\
  \    \"description\": \"Brain tumor object detection\",\n    \"contributor\": \"\
  \",\n    \"url\": \"<the URL to Kaggle dataset>\",\n    \"date_created\": \"2022-10-07T13:54:09+00:00\"\
  \n},\n```\n\n这是许可证部分：\n\n```\n\"licenses\": [\n    {\n        \"id\": 1,\n     \
  \   \"url\": \"https://creativecommons.org/publicdomain/zero/1.0/\",\n        \"\
  name\": \"CC0 1.0\"\n    }\n],\n```\n\n这是类别部分：\n\n```\n\"categories\": [\n    {\n\
  \        \"id\": 0,\n        \"name\": \"tumors\",\n        \"supercategory\": \"\
  none\"\n    },\n    {\n        \"id\": 1,\n        \"name\": \"negative\",\n   \
  \     \"supercategory\": \"tumors\"\n    },\n    {\n        \"id\": 2,\n       \
  \ \"name\": \"positive\",\n        \"supercategory\": \"tumors\"\n    }\n],\n```\n\
  \n这里是图像部分：\n\n```\n\"images\": [\n    {\n        \"id\": 0,\n        \"license\"\
  : 1,\n        \"file_name\": \"00000_102.jpg\",\n        \"height\": 512,\n    \
  \    \"width\": 512,\n        \"date_captured\": \"2022-10-07T13:54:09+00:00\"\n\
  \    },\n    {\n        \"id\": 1,\n        \"license\": 1,\n        \"file_name\"\
  : \"00003_154.jpg\",\n        \"height\": 512,\n        \"width\": 512,\n      \
  \  \"date_captured\": \"2022-10-07T13:54:09+00:00\"\n    }\n],\n```\n\n这里是标注部分：\n\
  \n```\n\"annotations\": [\n    {\n        \"id\": 0,\n        \"image_id\": 0,\n\
  \        \"category_id\": 2,\n        \"bbox\": [170,226,49,51],\n        \"area\"\
  : 2499,\n        \"segmentation\": [],\n        \"iscrowd\": 0\n    },\n    {\n\
  \        \"id\": 1,\n        \"image_id\": 1,\n        \"category_id\": 1,\n   \
  \     \"bbox\": [197,143,80,62],\n        \"area\": 4960,\n        \"segmentation\"\
  : [],\n        \"iscrowd\": 0\n    }\n]\n```\n\n值得注意的是，边界框以绝对像素位置指定。坐标系以高度为 y 轴，宽度为\
  \ x 轴，原点位于图片左上角。例如，对于第一张图片（00003_154.jpg 且 image_id = 1），边界框为 [197,143,80,62]，分别对应\
  \ [x_min, y_min, width, height] 的值，如图 3.5 所示。\n\n![](img/0e7994c850a84b7a53d34c7f943c7edd_71_0.png)\n\
  \n图 3.5：COCO 风格边界框的坐标系和标注格式（[x_min, y_min, width, height]）\n\n另一种流行的图像标注格式是 Pascal\
  \ VOC（Pattern Analysis, Statistical Modeling, and Computational Learning, Visual\
  \ Object Classes）格式。这种标注格式采用 XML（eXtensible Markup Language）文件格式，每张图像对应一个 XML 文件。\n\
  \n标注文件名与图像文件名相同，只是扩展名改为 .xml。每张图像单独存储一个 XML 文件，可以避免为大型图像数据集的所有标注维持一个巨大文件。以下是演示数据集中一张图像（00003_154.jpg）的标注文件（00003_154.xml）：\n\
  \n```\n<annotation>\n    <folder></folder>\n    <filename>00003_154.jpg</filename>\n\
  \    <path>00003_154.jpg</path>\n    <source>\n        <database>annotationdemo</database>\n\
  \    </source>\n    <size>\n        <width>512</width>\n        <height>512</height>\n\
  \        <depth>3</depth>\n    </size>\n    <segmented>0</segmented>\n    <object>\n\
  \        <name>negative</name>\n        <pose>Unspecified</pose>\n        <truncated>0</truncated>\n\
  \        <difficult>0</difficult>\n        <occluded>0</occluded>\n        <bndbox>\n\
  \            <xmin>197</xmin>\n            <xmax>277</xmax>\n            <ymin>143</ymin>\n\
  \            <ymax>205</ymax>\n        </bndbox>\n    </object>\n</annotation>\n\
  ```\n\n显然，该标注文件包含图像信息和标注对象。如图 3.6 所示，图像坐标系与之前描述的 COCO 标注格式相同。它同样有四个边界框数值：xmin、xmax、ymin\
  \ 和 ymax。换句话说，边界框使用左上角和右下角坐标的绝对像素值存储（而不是左上角坐标加宽高值）。\n\n![](img/0e7994c850a84b7a53d34c7f943c7edd_73_0.png)\n\
  \n图 3.6：Pascal VOC 风格边界框的坐标系和标注格式（[xmin, xmax, ymin, ymax]）\n\n由于 YOLO（You Only\
  \ Look Once）近年来的发展，YOLO 数据标注成为另一种流行的数据格式。与 PASCAL VOC 标注风格类似，该数据集每张图像对应一个标注文件。不过，标注文件的扩展名是\
  \ .txt。\n\n数据集组织为两个子文件夹，一个用于图像（images），一个用于标注（labels）。这些子文件夹可能进一步划分为 train（训练）、test（测试）和\
  \ val（验证）子文件夹。还有一个名为 classes.txt 的文本文件（也可能是 *.yaml 文件），用于声明该数据集的类别或标签，每行一个。以下是我们简单演示数据集的\
  \ classes.txt 文件内容，包含两个类别：\n\n```\nnegative\npositive\n```\n\n类似地，使用 YOLO 格式标注图像的步骤如下：\n\
  \n1. 创建一个名为 `classes.txt` 的文件，其中包含标签列表（每行一个标签）。\n2. 按照之前的说明启动 `labelImg`。\n3. 点击\
  \ **Open Dir** 菜单打开图像目录（如果在启动时没有指定图像目录）。\n4. 如果当前格式不是 YOLO（当前可能是 CreateML 或 Pascal\
  \ VOC），点击 **CreateML** 或 **Pascal VOC** 菜单，直到其切换为 **YOLO**。\n5. 点击 **Change Save\
  \ Dir** 菜单更改标注目录。\n\n每张图像对应一个带有 YOLO 格式标注的 `.txt` 文件，保存到所选目录中，文件名与图像同名。名为 `classes.txt`\
  \ 的文件也会保存在该文件夹中。\n\n此外，以下快捷键有助于快速标注：\n\n- *W 键*：创建边界框\n- *D 键*：切换到下一张图像\n- *A 键*：切换到上一张图像\n\
  - *Delete 键*：删除选中的边界框\n- *方向键*：移动选中的边界框\n- *Ctrl + Shift + D*：删除当前图像\n\n从不同来源或数据标注工具获取的数据集，其标注格式可能与\
  \ Detectron2 支持的格式（COCO 数据格式）不同。因此，了解如何将不同格式的数据集转换为 COCO 格式至关重要。下一节将引导你完成这一数据集转换过程。\n\
  \n## 标注格式转换\n\nDetectron2 的数据描述基于 COCO 标注格式构建。换句话说，它支持使用 COCO 数据标注格式注册数据集。然而，其他数据标注格式大量存在，你可能下载的数据集或使用的标注工具支持与\
  \ COCO 不同的数据格式。因此，本节将介绍用于将流行的 Pascal VOC 和 YOLO 格式转换为 COCO 风格的代码片段。\n\n> **重要提示**\n\
  > 以感叹号（!）开头的语句表示需要在 Jupyter notebook（Google Colab）代码单元中执行的 Bash 命令。如果你想在终端中运行，可以安全地移除这个感叹号并执行该语句。\n\
  \n### 将 Pascal VOC 数据集转换为 COCO 数据集\n\nPascal VOC 标注格式是另一种流行的格式。因此，本节提供代码片段，用于在注册到\
  \ Detectron2 之前将数据转换为 COCO 标注格式。本节使用前面描述的简单数据集（annotationdemo）作为演示。首先，我们下载 Pascal\
  \ VOC 格式的脑肿瘤数据集（voc.zip）并在 Google Colab 上解压：\n\n```\n# 下载数据集并解压\n!wget url_to_voc.zip\n\
  !unzip voc.zip\n```\n\n数据集解压后，以下代码片段安装 tree 包并查看该数据集的结构：\n\n```\n!sudo apt-get install\
  \ tree\n!tree voc\n```\n\n以下是该数据集在 COCO 标注格式下的结构：\n\n```\nvoc\n└ test\n    ├── 00000_102.jpg\n\
  \    ├── 00000_102.xml\n    ├── 00003_154.jpg\n    └── 00003_154.xml\n```\n\n值得注意的是，Pascal\
  \ VOC 数据格式为每个图像文件存放一个同名、扩展名为 .xml 的标注文件。\n\n该数据集可以直接原地修改为 COCO 格式。不过，以下代码片段会将这些图像和标注复制到一个新目录（coco_dir）中用于\
  \ COCO 数据集，从而避免修改原始数据：\n\n```\nimport os\nimport shutil\nfrom glob import glob\n\
  from tqdm import tqdm\n\nvoc_dir = \"voc/test\"\ncoco_dir = 'coco/test'\nos.makedirs(coco_dir,\
  \ exist_ok=True)\n```\n\n\n\n\n\n```\nxml_files = glob(os.path.join(voc_dir, \"\
  *.xml\"))\nimg_files = glob(os.path.join(voc_dir, \"*.jpg\"))\n# copy annotations\n\
  for f in tqdm(xml_files):\n    shutil.copy(f, coco_dir)\n# copy images\nfor f in\
  \ tqdm(img_files):\n    shutil.copy(f, coco_dir)\n```\n\n复制完成后，使用以下代码片段即可相对容易地将该数据集作为\
  \ pylabel 数据集加载：\n\n```\nfrom pylabel import importer\n# load dataset\ndataset =\
  \ importer.ImportVOC(coco_dir, name=\"brain tumors\")\n```\n\n同样地，也相对容易地将加载的数据集导出为\
  \ COCO 风格并将其存储在 _annotations.coco.json 文件中，使用以下代码片段：\n\n```\n# export\ncoco_file\
  \ = os.path.join(coco_dir, \"_annotations.coco.json\")\n# Detectron2 requires starting\
  \ index from 1\ndataset.export.ExportToCoco(coco_file, cat_id_index=1)\n```\n\n\
  值得注意的是，Detectron2 要求标签索引（cat_id_index）从 1 开始。因此，ExportToCoco 方法将此值设置为 1。\n\n转换完成后，可以安全地使用以下代码片段删除\
  \ COCO 数据集（coco_dir）中 Pascal VOC 标注文件（.xml 文件）：\n\n```\n# now delete voc annotations\
  \ in the coco set\nfor f in xml_files:\n    os.remove(f.replace(voc_dir, coco_dir))\n\
  ```\n\n可选地，你可以使用以下语句查看 resulting 数据集的结构：\n\n```\n!tree coco\n```\n"
- "## Detectron2 中目标检测模型的架构\n\n本章深入探讨 Detectron2 在目标检测任务中的架构。Detectron2 中的目标检测模型是\
  \ Faster R-CNN 的实现。具体而言，该架构包括主干网络、区域提议网络和感兴趣区域头部。本章对于理解为视觉系统设计深度神经网络时的通用术语至关重要。深入理解有助于在用自定义数据集训练时微调和定制模型以获得更好的准确率。\n\
  \n到本章结束时，你将详细了解 Detectron2 的典型架构。你也将知道在哪里定制你的 Detectron2 模型（设置哪些配置参数、如何设置它们，以及在哪里添加/移除层）以提高性能。具体而言，本章涵盖以下主题：\n\
  \n- 应用架构简介\n- 主干网络\n- 区域提议网络\n- 感兴趣区域头部\n\n### 技术要求\n\n你应该已按照第 1 章提供的说明设置开发环境。因此，如果你尚未完成，请在继续之前完成开发环境的设置。此外，你应该阅读第\
  \ 2 章以了解 Detectron2 的 Model Zoo 以及可用的主干网络。所有代码、数据集和结果都可在本书的 GitHub 页面上获得（在名为 Chapter04\
  \ 的文件夹中），网址为 https://github.com/PacktPublishing/Hands-On-Computer-Vision-with-Detectron2。强烈建议你下载代码并跟随操作。\n\
  \nDetectron2 用于目标检测任务的架构是 Faster Region-based Convolutional Neural Network（Faster\
  \ R-CNN）的实现。Faster R-CNN 的架构在图 4.2 中详细展示。框的样式表示其含义。具体而言，阴影框为数据（输入、中间结果和输出），虚线框为仅在训练期间执行的任务，双线框为神经网络。\n\
  \n以下各节讨论这些单独的项目，它们如何协同工作，以及如何使用 Detectron2 配置它们。这些部分使用第 2 章中用于目标检测任务的示例模型。所有以下任务都可以通过调用默认预测器的\
  \ predict 方法来执行。然而，本章通过输入、代码和中间结果逐步介绍每个步骤，以检查该模型的步骤和组件。通过代码检查各个组件有助于解释为什么每一步都很重要，每个步骤要更改哪些参数，以及在哪里定制模型。\n\
  \n首先，我们需要导入 torch 包并安装 Detectron2：\n\n```\nimport torch\nprint(torch.__version__)\n\
  !python -m pip install \\\n'git+https://github.com/facebookresearch/detectron2.git'\n\
  ```\n\n接下来，我们将导入 Detectron2，获取配置和模型检查点文件，并创建预测器。具体而言，我们在此示例中使用 ResNet50（R50-C4），因为它简单易于说明，其配置文件为\
  \ COCO-Detection/faster_rcnn_R_50_C4_1x.yaml。然而，对于其他主干网络，思路是相同的：\n\n```\nimport\
  \ detectron2\nfrom detectron2.config import get_cfg\nfrom detectron2 import model_zoo\n\
  from detectron2.engine import DefaultPredictor\n# Suppress some user warnings\n\
  import warnings\nwarnings.simplefilter(action='ignore', category=UserWarning)\n\
  # Select a model\nconfig_file = \"COCO-Detection/faster_rcnn_R_50_C4_1x.yaml\"\n\
  checkpoint_url = \"COCO-Detection/faster_rcnn_R_50_C4_1x.yaml\"\n# Create a configuration\
  \ file\ncfg = get_cfg()\nconfig_file = model_zoo.get_config_file(config_file)\n\
  cfg.merge_from_file(config_file)\n# Download weights\ncfg.MODEL.WEIGHTS = model_zoo.get_checkpoint_url(checkpoint_url)\n\
  score_thresh_test = 0.95\ncfg.MODEL.ROI_HEADS.SCORE_THRESH_TEST = score_thresh_test\n\
  predictor = DefaultPredictor(cfg)\n```\n\n一个大小为 800×800 的输入图像（这是默认输入大小，因此我们不需要对输出进行后处理重采样步骤）会经过该架构的不同部分，以检查每个组件的作用。以下片段有助于准备输入：\n\
  \n```\n!wget https://raw.githubusercontent.com/phamvanvung/hcvd2/main/800x800/input.jpeg\n\
  import cv2\ninput_url = \"input.jpeg\"\nimg = cv2.imread(input_url)\nheight, width\
  \ = img.shape[:2]\nimage = torch.as_tensor(img.astype(\"float32\").transpose(2,\
  \ 0, 1))\n```\n\n具体而言，此片段首先使用 cv2 加载输入图像并获取其大小（高度和宽度）。此外，它将加载的图像转换为 PyTorch 张量，采用通道优先格式。具体而言，cv2\
  \ 以（高度，宽度，通道）形式或（H, W, C）格式加载图像，而 Detectron2 使用（通道，高度，宽度）或（C, H, W）。\n\n一旦默认模型和输入准备就绪，就可以通过模型的不同组件传递准备好的输入并检查每个部分的作用。\n\
  \n### 主干网络\n\n第 2 章讨论了 Detectron2 的典型主干网络。它们包括 ResNet50、ResNet101、ResNeXt101 及其变体。本节以\
  \ ResNet50 架构为例进行检查。然而，对于其他基础模型（主干网络），思路保持不变。图 4.3 总结了检查主干网络的步骤。具体而言，我们将单个图像的数据张量传递给主干网络，主干网络（本例中为\
  \ ResNet50）输出一个张量。该输出张量是输入图像提取的显著特征。\n\n```\nprint(stem.shape)\nprint(res2.shape)\n\
  print(res3.shape)\nprint(res4.shape)\n```\n\n具体而言，此片段将输入张量转换为“cuda”以将该图像加载到 GPU，因为我们的模型当前在\
  \ GPU 上运行。unsqueeze 方法将图像输入转换为（N x C x H x W）格式，其中 N 为图像数量，本例中我们传递一张图像。换句话说，此步骤将大小为\
  \ 1x3x800x800 的张量作为该主干的输入。该输入随后馈送到 ResNet50 的主要模块（stem、res2、res3 和 res4），整个代码块应具有以下输出：\n\
  \n```\ntorch.Size([1, 3, 800, 800])\ntorch.Size([1, 64, 200, 200])\ntorch.Size([1,\
  \ 256, 200, 200])\ntorch.Size([1, 512, 100, 100])\ntorch.Size([1, 1024, 50, 50])\n\
  ```\n\n图 4.4 可视化了 ResNet50 主干中这些主要模块及其对应的输出大小。值得注意的是，随着模块的推进，深度增加，尺寸减小，以从图像中提取更抽象或更显著的特征。\n\
  \n![](img/0e7994c850a84b7a53d34c7f943c7edd_89_0.png)\n\n图 4.4：ResNet50 主干中主要模块及其对应的输出特征大小\n\
  \n\n\n\n该主干网络的输出（提取的特征或特征图）是最后一个名为'res4'的块，大小为1x1024x50x50。从概念上讲，该特征图中的每个点都对应并负责预测和分类与原始图像中某个区域相关的边界框。换句话说，这些提取的特征对应于原始图像中的50x50（2,500）个区域。以下代码片段说明了这一思想。首先，我们准备一个方法，以原始尺寸显示图像：\n\
  \n```\n```python\nimport numpy as np\nimport matplotlib.pyplot as plt\n\n\ndef imshow(image):\n\
  \    dpi = plt.rcParams[\"figure.dpi\"]\n    height, width = image.shape[:2]\n \
  \   figsize = width / float(dpi), height / float(dpi)\n    fig = plt.figure(figsize=figsize)\n\
  \    plt.imshow(image)\n    plt.imshow(image)\n    plt.axis(\"off\")\n    plt.show()\n\
  ```\n```\n\n现在我们可以为与50x50提取特征对应的2,500个区域的中心绘制中心点：\n\n```\n```python\nfeature_h,\
  \ feature_w = res4.shape[2:]\nsub_sample = height/feature_h\nnew_img = img.copy()\n\
  # the feature map points and corresponding regions\nrect_w = 4\nrect_h = 4\nfor\
  \ i in range(feature_h):\n    for j in range(feature_w):\n        center_x = sub_sample\
  \ * j + sub_sample/2\n        center_y = sub_sample * i + sub_sample/2\n       \
  \ start_x = int(center_x - rect_w/2)\n        start_y = int(center_y - rect_h/2)\n\
  \        end_x = int(center_x + rect_w/2)\n        end_y = int(center_y + rect_h/2)\n\
  ```\n```\n\n```\n)\n(anchor_generator): DefaultAnchorGenerator(\n    (cell_anchors):\
  \ BufferList()\n)\n)\n```\n\n可以看到，这个RPN有两个主要部分：标准的RPN头（rpn_head）和锚点生成器（anchor_generator）。此外，在训练期间，还有一个组件用于RPN计算该RPN网络的损失。最后，RPN头进行预测，为下一阶段提出区域。以下部分将深入探讨这些组件。\n\
  \n## 锚点生成器\n\n锚点生成器在训练时用于生成所有原始锚点，每个特征像素对应一组锚点（例如15个锚点，或者根据配置不同数量的锚点，稍后详述）（本例中为50×50×15=37,500个锚点）。使用锚点是Faster\
  \ R-CNN的一项重要技术，其他技术（如YOLO和SSD）也采用锚点来提高预测精度。具体来说，我们不必从“无”中预测边界框，而是给模型一组初始边界框（具有特定的大小和宽高比），并让模型预测相对于这些初始框的边界框（位置/边界框增量）。不同的大小和比例有助于处理不同尺度和形状的物体。\n\
  \n该锚点生成器以锚点的比例和大小作为输入。这两个参数可以使用配置变量为Detectron2设置。以下代码片段显示了当前设置的值：\n\n```\nprint(cfg.MODEL.ANCHOR_GENERATOR.SIZES)\n\
  print(cfg.MODEL.ANCHOR_GENERATOR.ASPECT_RATIOS)\n```\n\n该代码片段应产生以下输出：\n\n```\n[[32,\
  \ 64, 128, 256, 512]]\n[[0.5, 1.0, 2.0]]\n```\n\n准确地说，这些大小对应于原始图像中初始锚点面积的平方根。此外，这些比例指定了这些初始锚点的高宽比。在这个具体案例中，这两组值的组合产生了15个锚点（5种大小乘以3种比例）。不同的大小和比例应对不同尺寸和宽高比的物体。与其他方法（如特征金字塔（在不同卷积层提取特征以应对不同尺寸）或使用不同的滤波器大小和比例（滑动窗口的大小））相比，这种方法（锚点金字塔）被认为更具成本效益。\n\
  \n这些锚点以一个像素为中心，因此有点难以区分。为了便于说明，图4.8将它们分成三组相同比例、五种不同大小的锚点。\n\n![](img/0e7994c850a84b7a53d34c7f943c7edd_95_0.png)\n\
  \n图4.8：以1个特征像素为中心的15个锚点（3种比例和5种大小）\n\n回到Detectron2的实现，以下代码片段有助于检查Detectron2如何生成这些锚点：\n\
  \n```\n# generate anchors\nanchors = rpn.anchor_generator([res4])\nprint(anchors[0].tensor.shape)\n\
  ```\n\n锚点生成器将提取的特征作为输入，计算sub_sample值（输入大小与特征大小之间的比率）并生成锚点。在本例中，有50×50×15=37,500个锚框。因此，该代码片段的输出如下：\n\
  \n```\ntorch.Size([37500, 4])\n```\n\n值得注意的是，这里有37,500个锚点，每个锚点有4个位置规格（x₀， y₀， x₁，\
  \ y₁）。为确认这一点，以下代码片段获取图像中点的15个锚点，并将其显示到原始输入上（如前所述）：\n\n```\nnew_img = img.copy()\n\
  # the feature\ncol_idx = 24\nrow_idx = 24\nstartBox = (row_idx*50 + col_idx)*15\n\
  for i in range(startBox, startBox + 15):\n    anchors_np = anchors[0].tensor[i].to(\"\
  cpu\").numpy()\n    x0, y0, x1, y1 = [int(v) for v in anchors_np]\n```\n\n此代码片段有以下输出：\n\
  \n```\ntorch.Size([1, 15, 50, 50])\ntorch.Size([1, 60, 50, 50])\n```\n\n具体来说，有1x15x50x50个锚点。因此，pred_objectness_logits中有1x15x50x50个值，用于指示每个锚点中是否有物体。类似地，每个特征点的15个锚点中每个都有4个坐标值（x0、y0、x1、y1），这就解释了pred_anchor_deltas输出的60（15x4）个值。在获得锚点和相关预测之后，训练阶段的下一步是计算RPN损失。\n\
  \n## RPN损失计算\n\n该损失包括来自分类头的分类损失（预测锚点的objectness分数）和回归损失（预测锚点增量）。因此，每个生成的锚点都必须有一个标签。锚点要么是正样本（有物体，标签值为1），要么是负样本（没有物体，标签值为0），要么是其他情况（被忽略，标签值为-1）。标签分配任务利用锚点与真实边界框的重叠程度度量。为此常用的度量是交并比（IoU）。图4.9说明了IoU的计算。\n\
  \n![](img/0e7994c850a84b7a53d34c7f943c7edd_97_0.png)\n\n图4.9：交并比（IoU）的计算\n\n具体来说，两个框之间的IoU是通过它们之间的交集与并集之比来计算的。\n\
  \n如果锚点（i）与某个真实边界框具有最高的IoU，或（ii）与任何真实边界框的IoU值高于指定阈值（例如0.7），则该锚点具有正标签。第二个条件应该已经足够，但第一个条件有助于处理稀有边界框的情况。如果锚点与所有真实边界框的IoU值都小于某个阈值（例如0.3），则该锚点具有负标签。所有其他标签都被忽略（标签值为-1）。这两个IoU阈值可以使用Detectron2配置参数自定义。以下代码片段显示当前模型中的这两个值：\n\
  \n```\nprint(cfg.MODEL.RPN.IOU_THRESHOLDS)\n```\n\n```\ngt_instance = detectron2.structures.instances.Instances(image_\n\
  size=(800, 800))\ngt_instance.set('gt_boxes', boxes)\ngt_instance.set('gt_classes',\
  \ classes)\ngt_instances = [gt_instance]\n```\n\n具体来说，此输入图像中有四个物体，且都是人（类别值为0）。在获得真实边界框之后，以下代码片段执行前面描述的采样策略：\n\
  \n```\ngt_labels, gt_boxes = rpn.label_and_sample_anchors(anchors,\ngt_instances)\n\
  print(gt_labels[0].shape)\nprint(gt_boxes[0].shape)\n```\n\n此代码片段应产生以下输出：\n\n```\n\
  torch.Size([37500])\ntorch.Size([37500, 4])\n```\n\n变量gt_labels包含所有37,500个锚点的标签（正样本=1，负样本=0，忽略=-1）。变量gt_boxes包含锚点对应的真实框坐标。所有这些锚点都被映射到输入中的四个真实框之一。以下代码片段证明了这一点：\n\
  \n```\nnp_gt_boxes = gt_boxes[0].to(\"cpu\").numpy()\nprint(np.unique(np_gt_boxes,\
  \ axis=0))\n```\n\n具体来说，该代码片段将gt_boxes转换为NumPy，并获取该列表中的唯一边界框。此代码片段应产生以下输出：\n\n```\n\
  [[190. 206. 352. 744.]\n[330. 285. 423. 690.]\n[375. 444. 479. 747.]\n[419. 375.\
  \ 633. 711.]]\n```\n\n这些正是之前指定的真实边界框的边界框。类似地，以下代码片段显示采样锚点的标签：\n\n```\nna = gt_labels[0].to(\"\
  cpu\").numpy()\nprint('positive', sum([x == 1 for x in na]))\n```\n\n\n\n\n\n```\n\
  print('negative', sum([x == 0 for x in na]))\nprint('ignore', sum([x == -1 for x\
  \ in na]))\n```\n\n具体来说，这段代码片段获取标签并统计基于标签的正样本、负样本和被忽略的锚点数量。这段代码片段应显示以下输出：\n\n```\n\
  positive 42\nnegative 214\nignore 37244\n```\n\n因此，在 37,500 个锚点中，有 42 个为正样本，214\
  \ 个为负样本。这 256 个锚点会参与损失计算（训练），其余的则被忽略。接下来，RPN 损失计算是分类损失（基于采样锚点的负样本和正样本标签及其各自的预测）与回归损失（基于真实边界框位置及其各自预测的锚点偏移量）之间的加权贡献。在完成所有之前步骤后，RPN\
  \ 的下一个任务是生成 proposals。以下章节将检查 RPN 提出区域的方式。\n\n## Proposal predictions\n\n提案预测步骤引入了一个新的概念，称为非极大值抑制（NMS）。具体来说，对于一个真实框可能会产生多个提案。这些提案可能在很大区域上重叠，并且具有不同的\
  \ objectness 分数。图 4.10 显示了为什么需要 NMS 的示例。具体来说，针对一个真实框（实线框）提出了两个提案（虚线框）。可以观察到，这两个提案有很大的重叠区域，删除其中一个并保留\
  \ objectness 分数更高（置信度更高）的另一个提案是明智的。\n\n![](img/0e7994c850a84b7a53d34c7f943c7edd_100_0.png)\n\
  \n图 4.10：一个真实标签（实线框）和多个提案（虚线框）\n\n具体来说，该阶段从主干网络提取特征并使用真实边界框（如果在训练）执行以下步骤：\n\n- 1.\
  \ 为提案标注并采样（如果在训练）。\n- 2. 提取框特征。\n- 3. 执行预测。\n- 4. 计算损失（如果在训练）。\n- 5. 执行推理（如果在推理）。\n\
  \n如果是在训练阶段，在 2,000 个提案（POST_NMS_TOPK_TRAIN）中，与正样本提案相比可能存在大量负样本提案（尤其是在训练早期阶段，RPN\
  \ 尚未准确时）。与 RPN 阶段类似，此步骤也会基于真实标签进行标注并采样另一个包含一定比例正样本提案的 mini-batch 用于训练。只有这些采样的提案会参与损失计算。以下代码片段显示了\
  \ Detectron2 当前设置的这些配置参数，你也可以根据需要更改这些参数：\n\n```\n```python\nprint(cfg.MODEL.ROI_HEADS.IOU_THRESHOLDS)\n\
  print(cfg.MODEL.ROI_HEADS.BATCH_SIZE_PER_IMAGE)\nprint(cfg.MODEL.ROI_HEADS.POSITIVE_FRACTION)\n\
  ```\n```\n\n这段代码片段应显示三个值 0.5、512 和 0.25。这些值意味着与所有真实框的 IoU 都小于 0.5 的提案被视为背景。每张图像采样\
  \ 512 个提案用于训练，其中 25% 应为正样本提案。如果正样本提案不足，则添加其他负样本提案以使总数达到 512 个。\n\n以下代码片段显示了感兴趣区域头（roi_head）的主要组件：\n\
  \n```\n```python\nroi_heads = predictor.model.roi_heads\nprint(roi_heads)\n```\n\
  ```\n\n此代码片段的输出很长。因此，这里未显示。一般来说，该阶段有三个主要组件：pooler、res5 和 box_predictor。pooler 和\
  \ res5 组件有助于在 box_predictor 完成预测之前提取框特征；以下章节将研究这些组件。\n\n## The pooler\n\n提案具有不同的尺寸，而后续步骤中的神经网络需要相同尺寸的输入特征。因此，必须在输入预测步骤之前将提取的特征裁剪为相同尺寸。pooler\
  \ 组件有助于执行此任务。以下代码片段显示了有关 pooler 的更多信息：\n\n```\n```python\nprint(roi_head.pooler)\n\
  ```\n```\n\n此代码片段应显示以下输出：\n\n```\n```text\nROIPooler(\n    (level_poolers): ModuleList(\n\
  \        (0): ROIAlign(output_size=(14, 14), spatial_scale=0.0625,\n        sampling_ratio=0,\
  \ aligned=True)\n    )\n)\n```\n```\n\n此 pooler 是 ROIPooler 类的一个实例，该类实现了 ROIAlign（Region\
  \ of Interest Version 2）。通常，提案是在原始输入图像坐标中指定的（本例中为 800×800）。这些坐标首先被转换到提取特征的大小（宽度×高度\
  \ = 50×50）。因此，spatial scale 为 0.0625（spatial_scale = 50/800）。\n\n此外，所有提案的输出尺寸均指定为\
  \ 14×14。在 ROIAlignV2 中，将提案区域转换到特征图中的对应区域后，该映射区域被划分为 14×14 的网格。然后对每个网格单元进行插值（例如使用双线性插值方法）并使用四个点进行采样。aligned=True\
  \ 选项意味着像素坐标会偏移 0.5 个像素。在原始图像中半个像素并不重要，但在小特征图分辨率下却很显著，有助于提高精度（尤其是在实例分割中，我们稍后会学习）。以下代码片段生成\
  \ pooler 数据：\n\n```\n```python\nx = roi_heads.pooler([res4], [proposals[0].proposal_boxes])\n\
  print(x.shape)\n```\n```\n\n此代码片段应显示一个大小为 (1000, 1024, 14, 14) 的张量，对应 1,000 个提案；每个提案有\
  \ 1,024 个通道，分辨率为 14×14。\n\n在为所有提案获得相同尺寸的特征后，这些提案会经过另一组卷积层（称为 res5）以提取更深层次的特征。以下代码片段执行此显著特征提取：\n\
  \n```\n```python\nbox_features = roi_heads.res5(x)\nprint(box_features.shape)\n\
  ```\n```\n\n此可视化代码片段与 *Chapter 2* 中介绍的内容类似。图 4.11 显示了此代码片段的输出。\n\n![](img/0e7994c850a84b7a53d34c7f943c7edd_107_0.png)\n\
  \n图 4.12：目标检测过程的可视化\n\n恭喜！到目前为止，你应该已经掌握了 Detectron2 实现的 Faster R-CNN 模型在目标检测任务中的典型架构。本章内容较为深入。然而，其设计和理念有助于你理解其他计算机视觉任务，甚至其他流行的计算机视觉技术，如\
  \ YOLO。\n\n## Summary\n\n本章深入探讨了 Detectron2 实现的 Faster R-CNN 在目标检测任务中的组件。该模型是一种两阶段技术：区域提议阶段和感兴趣区域提取阶段。这两个阶段都使用从主干网络提取的特征。该主干网络可以是任何最先进的卷积神经网络，用于从输入图像中提取显著特征。提取的特征和用于生成一组初始锚点的信息（尺寸和比例；*Chapter\
  \ 7* 解释了如何自定义这些尺寸和比例）随后被传递给区域提议神经网络，以预测固定数量的提案及其 objectness 分数（如果提案中存在物体）和位置偏移量（预测提案与原始锚点之间的位置差异）。选定的提案随后被传递给第二阶段的感兴趣区域头，以预测最终的物体分类和定位。深入理解这些组件为你在下一章中对自定义数据集构建更好的模型进行模型定制和优化做好了充分准备。\n\
  \n恭喜！到目前为止，你应该对 Detectron2 的整体架构及其对 Faster R-CNN 目标检测模型的实现有了深刻的了解。在下一章中，你将使用 Detectron2\
  \ 训练自定义目标检测模型。\n\n\n\n\n\n**重要提示**\n\n本章会在 Google Colab 实例上执行代码。你应该将 Google Drive\
