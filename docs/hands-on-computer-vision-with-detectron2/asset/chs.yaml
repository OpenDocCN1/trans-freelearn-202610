  , TORCH_VERSION, \"; cuda: \", CUDA_VERSION)\n```\n\n在了解 PyTorch 和 CUDA 版本后，你可以使用以下代码片段安装\
  \ Detectron2。请记得将 TORCH_VERSION 和 CUDA_VERSION 替换为前一个代码片段中找到的值：\n\n```\n!python\
  \ -m pip install detectron2 -f \\\nhttps://dl.fbaipublicfiles.com/detectron2/wheels/{TORCH_VERSION}/{CUDA_VERSION}/index.html\n\
  ```\n\n以下是针对 CUDA 11.3 和 PyTorch 1.10 版本的安装命令示例：\n\n```\n!python -m pip install\
