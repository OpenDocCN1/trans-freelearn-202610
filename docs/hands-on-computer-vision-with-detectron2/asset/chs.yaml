  \n## 数据处理\n\n以下各节描述本章使用的数据集，并讨论在自定义数据集上训练 Detectron2 模型的典型步骤。这些步骤包括探索数据集、将数据集转换为\
  \ COCO 格式、向 Detectron2 注册数据集，最后展示一些示例图像及对应的脑肿瘤标签。\n\n### 数据集\n\n使用的数据集是 Kaggle（https://www.kaggle.com/datasets/davidroberts/brain-tumor-object-detection-datasets）上提供的脑肿瘤目标检测数据集，该数据集已下载到本书的\
  \ GitHub 仓库中以确保其可访问性。选择该数据集是因为医学图像处理是计算机视觉中的一个重要子领域。同时，该任务具有挑战性，且图像数量适合用于演示。\n\n\
