  Detectron2 模型部署到浏览器或移动环境中时，它极其有用。最后，这部分介绍了 D2Go，这是一个用于训练、量化和部署模型的框架，具有极低的内存存储和计算需求。使用该框架创建的模型对于部署到移动或边缘设备非常有用。


