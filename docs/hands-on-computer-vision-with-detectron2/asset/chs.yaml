  \n**图 7.1：** 输入主干网络（backbone）之前的预处理图像和标签示例\n\n可以观察到，批次中较小的图像会在底部和右侧填充到最大尺寸，使所有图像具有相同大小。此外，边界框也会相应地缩放。\n\
  \n在了解了 Detectron2 如何预处理输入图像和真实边界框后，我们现在可以对多个迭代进行采样，从该数据集中获取真实边界框，并分析它们，从而得到适合训练的尺寸和比例。\n\
  \n```\nratios = torch.min(\n    all_ratios, inverse_ratios\n)\nworst = ratios.min(-1).values\n\
  best = worst.max(-1).values\nreturn best\n```\n\n该函数有助于量化单个真实边界框与一组锚框（anchor）之间的适应度，并返回适应度比值列表。然而，在给定一组锚框的情况下，我们需要一个数值来量化所有真实边界框整体的适应度。\n\
  \n### 量化适应度\n\n一种方法是在给定一组锚框的情况下，将所有真实边界框的适应度得分取平均，作为整组真实边界框与锚框之间的一个适应度分数。然而，常见的做法是丢弃不良匹配，不让它们参与平均值计算。具体来说，我们使用一个阈值\
  \ EDGE_RATIO_THRESHOLD，并丢弃所有不良匹配。\n\n默认阈值为 0.25，这意味着如果两个框任意边的比例相差超过四倍，它们就会被视为不良匹配：\n\
  \n```\ndef fitness(ac_wh, gt_wh, EDGE_RATIO_THRESHOLD = 0.25):\n    ratio = best_ratio(ac_wh,\
  \ gt_wh)\n    ret = (ratio*(ratio>EDGE_RATIO_THRESHOLD).float()).mean()\n    return\
  \ ret\n```\n\n此外，我们可以使用以下函数，通过预定义的 EDGE_RATIO_THRESHOLD 来检查使用一组给定锚框召回所有真实边界框的可能性：\n\
  \n```\ndef best_recall(ac_wh, gt_wh, EDGE_RATIO_THRESHOLD = 0.25):\n    ratio =\
  \ best_ratio(ac_wh, gt_wh)\n    best = (ratio > EDGE_RATIO_THRESHOLD).float().mean()\n\
  \    return best\n```\n\n具体来说，如果某个真实边界框的各边长度不超过至少一个锚框对应边长的四倍，也不小于其四分之一，那么该真实边界框就可以被召回。\n\
  \n下面的代码片段让我们可以检查 Detectron2 提供的默认尺寸和比例集合是否能生成一组良好的锚框，以帮助召回所有真实边界框，以及这两个集合之间的适应度分数是多少：\n\
  \n```\nprint(\"recall\", best_recall(ac_wh, gt_wh))\nprint(\"fitness\", fitness(ac_wh,\
  \ gt_wh))\n```\n\n\n\n\n\n该算法具有以下步骤：\n\n- 1. 从聚类算法生成的初始尺寸和比例开始。\n- 2. 根据给定的概率采样一些项目进行演化（例如，0.9\
  \ 表示项目有 90% 的概率演化）。\n- 3. 从具有给定均值和标准差的正态随机分布中采样一些随机的演化量。\n- 4. 使用生成的随机量更改尺寸和比例。\n\
  - 5. 使用新的尺寸和比例集合计算适应度分数。\n- 6. 如果适应度提高，则将初始尺寸和比例集合设置为这些当前集合并循环回到步骤 1。否则，继续执行步骤 2。\n\
  \n以下代码片段实现了该算法：\n\n```\ndef evolve(sizes, ratios,\n    gt_wh,\n    iterations =\
  \ 10000,\n    probability = 0.9,\n    muy = 1,\n    sigma = 0.05,\n    fit_fn =\
  \ fitness,\n    verbose = False):\n# Step 1: Current anchors and their fitness\n\
  msg = f\"Evolving ratios and sizes:\"\npbar = tqdm(range(iterations), desc = msg)\n\
  for i, _ in enumerate(pbar):\n# Step 2 and 3: sample evolving items and amounts\n\
  # Step 4 and 5: change sizes and ratios and new fitness\n\n    if mutated_fit >\
  \ best_fit:\n        # Step 6: update sizes and ratios if better\nreturn sizes,\
  \ ratios\n```\n\n以下各节解释了每一步的代码。具体而言，步骤 1 的代码使用当前的尺寸和比例生成锚点并计算当前适应度分数：\n\n```\nanchors\
  \ = generate_anchors(tuple(sizes), tuple(ratios))\nac_wh = boxes2wh(anchors)\nanchor_shape\
  \ = len(sizes) + len(ratios)\nbest_fit = fit_fn(ac_wh, gt_wh)\n```\n\n以下代码片段提供了步骤\
  \ 2 和 3 的代码。这些步骤随机采样要变异的项目以及变异的量：\n\n```\nmutation = np.ones(anchor_shape)\nmutate\
  \ = np.random.random(anchor_shape) < probability\nmutation = np.random.normal(muy,sigma,anchor_shape)*mutate\n\
  mutation = mutation.clip(0.3, 3.0)\n```\n\n步骤 4 和 5 在获取了要更改的内容和更改量的信息后对尺寸和比例进行更改。此外，它还在执行变异后计算新的适应度分数。这些步骤的源代码如下：\n\
  \n```\nmutated_sizes = sizes.copy()*mutation[:len(sizes)]\nmutated_ratios = ratios.copy()*mutation[-len(ratios):]\n\
  mutated_anchors = generate_anchors(\n    tuple(mutated_sizes),\n    tuple(mutated_ratios))\n\
  mutated_ac_wh = boxes2wh(mutated_anchors)\nmutated_fit = fit_fn(mutated_ac_wh, gt_wh)\n\
  ```\n\n最后，如果新的适应度分数更好，则步骤 6 的代码会使用相应的当前值更新最佳分数、尺寸和比例：\n\n```\nsizes = mutated_sizes.copy()\n\
  ratios = mutated_ratios.copy()\nbest_fit = mutated_fit\nmsg=f\"Evolving ratios and\
  \ sizes, Fitness = {best_fit:.4f}\"\npbar.desc = (msg)\n```\n\n我们可以通过运行以下代码行来开始优化过程：\n\
  \n```\ne_sizes,e_ratios = evolve(sizes,ratios,gt_wh,verbose=False)\n```\n\n该算法应产生大约\
  \ 0.8835 的适应度分数。这一结果略好于聚类算法生成的尺寸和比例。最后，我们应运行以下代码片段并保存这些尺寸和比例以供将来训练：\n\n```\nprint(\"\
  sizes\", e_sizes)\nprint(\"ratios\", e_ratios)\n```\n\n该代码片段应显示以下输出（或类似）：\n\n```\n\
  sizes [ 68.33245953 112.91302277  89.55701886\n144.71037342  47.77637482]\nratios\
  \ [0.99819939 0.78726896 1.23598428]\n```\n\n因此，训练配置应使用以下超参数用于尺寸和比例：\n\n```\ncfg.MODEL.ANCHOR_GENERATOR.SIZES\
  \ = [[68.33245953],\n[112.91302277],  [89.55701886], [144.71037342],  [47.77637482]]\n\
  cfg.MODEL.ANCHOR_GENERATOR.ASPECT_RATIOS = [[0.99819939,\n0.78726896, 1.23598428]]\n\
  ```\n\n恭喜！到目前为止，你应该对 Detectron2 如何处理其输入以及如何为生成锚点选择一组默认超参数有了更深入的理解。以下部分涵盖了设置另一组基本参数以微调\
  \ Detectron2 模型的步骤。它们是训练图像中像素值的均值和标准差。\n\n## 设置像素均值和标准差\n\n输入图像像素的均值和标准差在训练 Detectron2\
  \ 模型中至关重要。具体而言，Detectron2 使用这些值来归一化输入图像。Detectron2 对此有两个配置参数。它们是 cfg.MODEL.PIXEL_MEAN\
  \ 和 cfg.MODEL.PIXEL_STD。默认情况下，从 ImageNet 数据集生成的这两个超参数的常见值是 [103.53, 116.28, 123.675]\
  \ 和 [57.375, 57.120, 58.395]。这些值适用于大多数彩色图像。然而，此特定案例具有灰度图像，其像素均值和标准差的值不同。因此，从训练数据集中生成这两组值将是有益的。此任务有两个主要阶段：（1）准备数据加载器以加载图像和（2）创建类以计算运行均值和标准差。\n\
  \n## 准备数据加载器\n\nDetectron2 的数据加载器是可迭代的，可以使用随机输入生成无限数据批次。然而，我们希望分析每个输入图像一次。因此，创建自定义数据集并使用\
  \ Pytorch 的数据加载器加载输入图像更为方便。以下代码片段导入所需的包并设置初始配置：\n\n```\n# some import statements\
  \ are removed for space efficiency\nname_ds = \"braintumors_coco\"\naf = \"_annotations.coco.json\"\
  \nimg_dir = name_ds + \"/train/\"\njson_file_train = name_ds + \"/train/\" + af\n\
  batch_size = 64\nnum_workers = 2\n```\n\n值得注意的是，我们不执行训练，因此使用了更高的批大小（本例中为 64），因为有更多可用的\
  \ GPU。以下代码片段为我们的自定义数据集准备 PyTorch 数据集类：\n\n```\n# some import statements are removed\
  \ for space efficiency\nclass TumorDataset(Dataset):\n    def __init__(self,\n \
  \               data,\n                img_dir=\"\",\n                transform\
  \ = None):\n        self.data = data\n        self.img_dir = img_dir\n        self.transform\
  \ = transform\n    def __len__(self):\n        return len(self.data)\n\n    def\
  \ __getitem__(self, idx):\n        file_name = os.path.join(self.img_dir,\n    \
  \                            self.data[idx]['file_name'])\n        image = cv2.imread(file_name)\n\
  \        if self.transform is not None:\n            image = self.transform(image\
  \ = image)['image']\n        return image\n```\n\n输入图像具有不同的尺寸。因此，我们使用 albumentations\
  \ 包将所有输入图像转换到相同的尺寸：\n\n```\nimport albumentations as A\nfrom albumentations.pytorch\
  \ import ToTensorV2\nimage_size = 640\naugs = A.Compose([\n    A.Resize(height =\
  \ image_size, width = image_size),\n    ToTensorV2()])\n```\n\n值得注意的是，我们将所有输入图像调整为\
  \ 640 x 640。以下代码片段读取 JSON 注释文件并创建 PyTorch 数据加载器：\n\n```\nimport json\nwith open(json_file_train)\
  \ as f:\n    ds = json.load(f)['images']\n\ntds = TumorDataset(ds, img_dir=img_dir,\
  \ transform=augs)\nimage_loader = DataLoader(tds,\n                          batch_size\
  \ = batch_size,\n                          shuffle    = False,\n               \
  \           num_workers = num_workers,\n                          pin_memory  =\
  \ True)\n```\n\n此数据加载器以批次加载数据，因为输入数据集可能太大而无法一次性放入内存。因此，我们需要创建一个类以滚动/运行方式计算均值和标准差。\n\
  \n## 计算运行均值和标准差\n\n如果可以访问整个值集，则计算一组 n 个值的均值（x̄）和标准差（std）的公式是直接的：\n\nsum = Σᵢ₌₁ⁿ\
  \ xᵢ\nx̄ = sum / n\n\nssd = \\sum_{i=1}^{n} (x_i - \\bar{x})^2\n\nstd = \\sqrt{\\\
  frac{ssd}{n - 1}}\n\n然而，以运行方式计算这两个统计量的计算稍微复杂一些。因此，以下公式可能有点复杂，但主要是因为数学符号。具体而言，我们必须跟踪这些统计量，然后在读取每个数据批次后更新它们。令\
  \ \\overline{x_c}, sum_c, ssd_c, 和 std_c 表示具有当前已见项目（n_c）的当前统计量。现在，当我们看到一个具有 n_b\
  \ 个项目的新批次 b 时，可以在此批次上计算统计量（sum_b 和 ssd_b）。新数据集的均值（\\overline{x_n}）应如下：\n\n\\overline{x_n}\
  \ = \\frac{1}{n_c + n_b} (sum_c + sum_b) = \\frac{1}{n_c + n_b} (n_c \\overline{x_c}\
  \ + sum_b)\n\n所有这些值都存储并可从批次数据计算。因此，新均值相应更新。类似地，此新数据集的平方差之和如下：\n\nssd_n = \\sum_{i=1}^{n_c}\
  \ (x_i - \\overline{x_n})^2 + \\sum_{j=1}^{n_b} (b_j - \\overline{x_n})^2 = \\sum_{i=1}^{n_c}\
  \ (x_i - \\overline{x_n})^2 + ssd_b\n\n批次的平方差之和（ssd_b）可以从当前批次数据计算。然而，我们需要展开计算的另一部分，即当前数据项相对于新均值的平方差之和，如下：\n\
  \nssd_{c_new_mean} = \\sum_{i=1}^{n_c} (x_i - \\overline{x_n})^2 = \\sum_{i=1}^{n_c}\
  \ (x_i)^2 - 2\\overline{x_n}\\sum_{i=1}^{n_c} x_i + n_c (\\overline{x_n})^2 = \\\
  sum_{i=1}^{n_c} (x_i)^2 - 2\\overline{x_n} sum_c + n_c (\\overline{x_n})^2\n\n类似地，我们可以有当前项目列表的平方差之和：\n\
  \nssd_c = \\sum_{i=1}^{n_c} (x_i - \\overline{x_c})^2 = \\sum_{i=1}^{n_c} (x_i)^2\
  \ - 2\\overline{x_c}\\sum_{i=1}^{n_c} x_i + n_c (\\overline{x_c})^2 = \\sum_{i=1}^{n_c}\
  \ (x_i)^2 - 2\\overline{x_c} sum_c + n_c (\\overline{x_c})^2\n\n然后，已见项目的平方和可以写成如下：\n\
  \n\\sum_{i=1}^{n_c} (x_i)^2 = ssd_c + 2\\overline{x_c} sum_c - n_c (\\overline{x_c})^2\n\
  \n现在，我们可以计算当前项目相对于新均值的平方差之和如下：\n\nssd_{c_new_mean} = ssd_c + 2\\overline{x_c} sum_c\
  \ - n_c (\\overline{x_c})^2 - 2\\overline{x_n} sum_c + n_c (\\overline{x_n})^2\n\
  \n\n\n\n这个方程现在包含了所有可计算的值。因此，我们可以计算新数据集（当前数据和新批次数据）的平方差之和，进而计算标准差。\n\n下面的代码片段实现了这些计算。首先，我们需要一个辅助方法，将运行均值广播为与输入尺寸兼容的大小，以用于后续计算：\n\
  \n```python\ndef broad_cast(x, image_size, channel):\n    y = torch.broadcast_to(x,\
  \ (image_size**2, channel))\n    z = y.reshape(image_size, image_size, 3)\n    return\
  \ torch.moveaxis(z, 2, 0)\n```\n\n下面的代码片段使用了这个辅助方法，并准备了一个类，以滚动/运行的方式从一批批输入中计算运行均值和标准差：\n\
  \n```python\nclass RunningStats:\n    def __init__(self):\n        # initialize:\
  \ self.n = 0, self.mean = 0, self.ssd = 0\n    def push(self, x):\n        dims\
  \ = [0, 2, 3]\n        count = 1\n        for dim in dims:\n            count *=\
  \ x.shape[dim]\n        image_size = x.shape[-1]\n        channel = x.shape[1]\n\
  \        if self.n == 0: # start\n            # Step 1: compute new_mean, new_ssd,\
  \ new_count\n        else: # otherwise\n            # Step 2: store old statistics\
  \ and compute new ones\n        # release results\n        self.mean = new_mean\n\
  \        self.ssd = new_ssd\n        self.n = new_count\n        self.std = torch.sqrt(new_ssd/(new_count-1))\n\
  ```\n\n这段代码应该输出如下内容：\n\n```\ntensor([20.1962, 20.1962, 20.1962])\ntensor([39.5985,\
  \ 39.5985, 39.5985])\n```\n\n然后，我们可以将这些值用于训练配置，如下所示：\n\n```\ncfg.MODEL.PIXEL_MEAN\
  \ = [20.1962, 20.1962, 20.1962]\ncfg.MODEL.PIXEL_STD = [39.5985, 39.5985, 39.5985]\n\
  ```\n\n恭喜！到这一步，你应该已经掌握了相关的背景知识，并拥有了为自定义图像生成像素均值和标准差集合的代码。接下来，我们应该把上一章和本章推导出的所有配置整合起来，重新训练我们的脑肿瘤检测模型。\n\
  \n## 整合所有配置\n\n用于训练自定义模型的代码与之前相同，包括评估功能以及保存最佳模型的钩子。然而，配置应该如下：\n\n```\n# 为了节省篇幅，省略了生成\
