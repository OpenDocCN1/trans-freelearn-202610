- pgno: 246
  md: "The training then should proceed in the same way. However, besides the losses\
    \ for object detection tasks – classification loss (`loss_cls`), bounding box\
    \ regression loss (`loss_box_reg`), region proposal classification loss (`loss_rpn_cls`),\
    \ and region proposal location loss (`loss_rpn_loc`) – there is one more loss\
    \ metric for the masks (`loss_mask`) for instance segmentation tasks:\n\n```\n\
    ```text\ntotal_loss: 1.325  loss_cls: 0.1895  loss_box_reg:\n0.1189  loss_mask:\
    \ 0.5053  loss_rpn_cls: 0.3287  loss_rpn_loc:\n0.1724\n```\n```\n\nThe preceding\
    \ listing is one example of the losses during the training object instance segmentation\
    \ model. Additionally, at every evaluation iteration, besides the evaluation metrics\
    \ for the bounding box (bbox), there is a similar set of metrics for segmentation\
    \ (segm), which is used for selecting the best model:\n\n```text\nEvaluation results\
    \ for segm:\n\n|       | AP     | AP50   | AP75   | APs    | APm    | APl    |\n\
    |:------|:-------|:-------|:-------|:-------|:-------|:-------|\n|       | 25.786\
    \ | 41.874 | 27.180 | 4.064  | 26.409 | 34.991 |\n```\n\nThe following code snippet\
    \ sets the confidence threshold as 0.7 and loads the best model:\n\n```\n```python\n\
    cfg.MODEL.ROI_HEADS.SCORE_THRESH_TEST = 0.7\ncfg.MODEL.WEIGHTS = os.path.join(cfg.OUTPUT_DIR,\n\
    \                                 \"model_best.pth\")\n\npredictor = DefaultPredictor(cfg)\n\
    ```\n```\n\nThe following code snippets create some helper methods to randomly\
    \ predict and visualize three data samples and display the ground-truth masks\
    \ versus the predicted masks for qualitative evaluation purposes. Specifically,\
    \ the following code snippet creates a method (`plot_samples`) that takes samples\
    \ as a data dictionary and predictor and then visualizes the ground truths or\
    \ predicted results depending on the `is_gt` input:\n\n```\n```python\ndef plot_samples(samples,\n\
    \                met        = {},\n                is_gt      = True,\n      \
    \          predictor  = None):\n    n = len(samples)\n    nrows, ncols = int((-\
    \ -n/3)), 3\n    fig, axs = plt.subplots(nrows, ncols, figsize = (21, 7))\n  \
    \  for i, s in enumerate(samples):\n        row, col = i//ncols, i%ncols\n```\n\
    ```"
