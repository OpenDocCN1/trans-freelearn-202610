  md: "Chapter 4 provided details about the pooler and res5 components. This code\
    \ snippet should display the extracted features as a tensor of the size torch.Size([5,\
    \ 2048, 7, 7]). In this case, the first value (5) means the number of boxes predicted\
    \ in the previous step (detection task). Next, the extracted features, together\
    \ with the predicted instances (outputs of the previous steps), are passed through\
    \ the mask head:\n\n```\noutput = mask_head(x, pred_instances)\n```\n\nBesides\
    \ the fields from the instances predicted by the object detection task (pred_boxes,\
    \ pred_classes, and scores), this output has a field for the predicted masks (pred_masks),\
    \ one per predicted box. Additionally, if it is at the training stage, this mask\
    \ head takes the ground-truth segmentations and updates the overall loss by adding\
    \ the mask loss (mask_loss), as shown in Figure 10.2. The following code snippet\
    \ displays the sizes of the predicted masks:\n\n```\nprint(output[0].pred_masks.shape)\n\
    ```\n\nThere is a corresponding predicted mask per predicted box. Therefore, this\
    \ code snippet should display the tensor size of torch.Size([5, 1, 14, 14]). Again\
    \ the first number (5) is the number of predicted bounding boxes. The mask resolution\
    \ is configurable via the following parameter:\n\n```\ncfg.MODEL.ROI_MASK_HEAD.POOLER_RESOLUTION\n\
    ```\n\nThis value is currently 14 (as the output mask resolution). The following\
