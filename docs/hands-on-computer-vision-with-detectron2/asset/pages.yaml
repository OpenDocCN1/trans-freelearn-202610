- pgno: 179
  md: '# # Image augmentation techniques


    Image augmentation techniques help greatly improve the robustness and accuracy
    of computer vision deep learning models. Detectron2 and many other modern computer
    vision architectures use image augmentation. Therefore, it is essential to understand
    image augmentation techniques and how Detectron2 uses them. This section covers
    **what** image augmentations are, **why** they are important, and introduces popular
    methods to perform them (**how**). The next two sections explain how Detectron2
    uses them during training and inferencing.


    # ## Why image augmentations?


    Deep learning architectures with a small number of weights may not be accurate
    (**bias issue**). Therefore, modern architectures tend to be complex and have
    huge numbers of weights. Training these models often involves passing through
    the training datasets for several epochs; one epoch means the whole training dataset
    is passed through the model once. Therefore, the huge numbers of weights may mean
    the models tend to memorize trivial features in the training dataset (**overfitting
    issue**) and do not work well in future unseen data (**variance issue**).


    One popular example that’s often used to illustrate this case is a deep learning
    model trained to detect the difference between Golden Retrievers and Huskies.
    It showed great accuracy on the training and evaluation sets during training.
    However, in reality, it performed poorly. Further inspection of the model indicates
    that it used the snowy background in images to differentiate between a Husky and
    a Golden Retriever rather than their actual characteristics. Therefore, the detection
    objects must be placed in different contexts.


    One straightforward solution is to have more training data. However, in many cases,
    having more images may not be possible. For instance, collecting medical images
    from patients may result in legal restrictions. Even if collecting more images
    is possible, manual labeling costs in such areas might be huge because it requires
    highly skilled people to perform labeling. Therefore, image augmentation techniques
    are important.


    # ## What are image augmentations?


    Image augmentation techniques transform images and their related annotations (for
    example, bounding boxes, segments, and key points) and produce slightly different
    copies. New copies of the same input allow the model to have further training
    data with different contexts to tackle overfitting and improve its robustness.
    Thanks to image augmentation, several modern deep learning architectures for computer
    vision can even produce models that never look at an image more than once during
    training. The following section covers the most important and useful image augmentation
    techniques.'
  merge: -1
  img_proc: true
