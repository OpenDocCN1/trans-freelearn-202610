    their meaning. Specifically, shaded boxes are data (input, intermediate results,
    and output), dashed boxes are tasks performed during training only, and double-line
    boxes are the neural networks.


    The following sections discuss these individual items, how they work together,
    and where to configure them using Detectron2. These sections use an example model
    for object detection tasks, as in Chapter 2. All the following tasks can be performed
    by calling the predict method from the default predictor. However, this chapter
    walks through each step with input, code, and intermediate results to inspect
    the steps and components of this model. Checking individual components with code
    helps explain why each step is essential, what parameters to change in each step,
    and where to customize the model.


