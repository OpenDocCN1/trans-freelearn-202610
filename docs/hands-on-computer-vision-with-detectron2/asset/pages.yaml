- pgno: 173
  md: 'ssd = \sum_{i=1}^{n} (x_i - \bar{x})^2


    std = \sqrt{\frac{ssd}{n - 1}}


    However, the calculations for these two statistics in a running manner are a little
    more involved. Therefore, the following formulas may be a little complicated but
    mostly because of the mathematical notation. Specifically, we must keep track
    of these statistics and then update them after reading every batch of data. Let
    \overline{x_c}, sum_c, ssd_c, and std_c denote the current statistics with currently
    seen items (n_c). Now, when we see a new batch of data b with n_b items, the statistics
    (sum_b and ssd_b) are computable over this batch. The mean (\overline{x_n}) of
    the new dataset should be as follows:


    \overline{x_n} = \frac{1}{n_c + n_b} (sum_c + sum_b) = \frac{1}{n_c + n_b} (n_c
    \overline{x_c} + sum_b)


    All these values are stored and computable from the batch data. Therefore, the
    new mean is updated accordingly. Similarly, the sum of the squared differences
    of this new dataset is as follows:


    ssd_n = \sum_{i=1}^{n_c} (x_i - \overline{x_n})^2 + \sum_{j=1}^{n_b} (b_j - \overline{x_n})^2
    = \sum_{i=1}^{n_c} (x_i - \overline{x_n})^2 + ssd_b


    The sum of squared differences for the batch (ssd_b) can be computed from the
    current batch data. However, we need to unpack the other part of the computation
    as the sum of squared differences of the current data items with respect to the
    new mean, as follows:


    ssd_{c_new_mean} = \sum_{i=1}^{n_c} (x_i - \overline{x_n})^2 = \sum_{i=1}^{n_c}
    (x_i)^2 - 2\overline{x_n}\sum_{i=1}^{n_c} x_i + n_c (\overline{x_n})^2 = \sum_{i=1}^{n_c}
    (x_i)^2 - 2\overline{x_n} sum_c + n_c (\overline{x_n})^2


    Similarly, we can have the sum of squared differences for the list of current
    items:


    ssd_c = \sum_{i=1}^{n_c} (x_i - \overline{x_c})^2 = \sum_{i=1}^{n_c} (x_i)^2 -
    2\overline{x_c}\sum_{i=1}^{n_c} x_i + n_c (\overline{x_c})^2 = \sum_{i=1}^{n_c}
    (x_i)^2 - 2\overline{x_c} sum_c + n_c (\overline{x_c})^2


    Then, the sum of squares of the previously seen items can be written as follows:


    \sum_{i=1}^{n_c} (x_i)^2 = ssd_c + 2\overline{x_c} sum_c - n_c (\overline{x_c})^2


    Now, we can compute the sum of squared differences of the current items with respect
    to the new mean as follows:


    ssd_{c_new_mean} = ssd_c + 2\overline{x_c} sum_c - n_c (\overline{x_c})^2 - 2\overline{x_n}
    sum_c + n_c (\overline{x_n})^2'
  merge: -1
  img_proc: true
- pgno: 174
  md: "This equation now contains all computable values. Therefore, we can compute\
    \ the sum of squared differences for the new set of data (the current one and\
    \ the new batch) and, thus, the standard deviation.\n\nThe following code snippets\
    \ implement these calculations. First, we need a helper method to broadcast the\
    \ running means into the sizes compatible with the input sizes used in our calculation:\n\
    \n```\n```python\ndef broad_cast(x, image_size, channel):\n    y = torch.broadcast_to(x,\
    \ (image_size**2, channel))\n    z = y.reshape(image_size, image_size, 3)\n  \
    \  return torch.moveaxis(z, 2, 0)\n```\n```\n\nThe following code snippet utilizes\
    \ this helper method and prepares a class to calculate running means and standard\
    \ deviations from batches of inputs in a rolling/running manner:\n\n```\n```python\n\
    class RunningStats:\n    def __init__(self):\n        # initialize: self.n = 0,\
    \ self.mean = 0, self.ssd = 0\n    def push(self, x):\n        dims = [0, 2, 3]\n\
    \        count = 1\n        for dim in dims:\n            count *= x.shape[dim]\n\
    \        image_size = x.shape[-1]\n        channel = x.shape[1]\n        if self.n\
    \ == 0: # start\n            # Step 1: compute new_mean, new_ssd, new_count\n\
    \        else: # otherwise\n            # Step 2: store old statistics and compute\
    \ new ones\n        # release results\n        self.mean = new_mean\n        self.ssd\
    \ = new_ssd\n        self.n = new_count\n        self.std = torch.sqrt(new_ssd/(new_count-1))\n\
    ```\n```"
  merge: -1
  img_proc: true
