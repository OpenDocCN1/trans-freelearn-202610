  md: "Next, we can use the same code snippet as in the previous section to perform\
    \ the export using the tracing method:\n\n```\ndummy_X = torch.tensor(\n    data\
    \  = [[-1, -2, -3, -4]],\n    dtype = torch.float32)\ntraced_model = torch.jit.trace(\n\
    \    pt_model,\n    example_inputs = dummy_X)\n```\n\nThis code snippet should\
    \ display a warning message with the following content:\n\n```\nTracerWarning:\
    \ Converting a tensor to a Python boolean might cause the trace to be incorrect.\
    \ We can't record the data flow of Python values, so this value will be treated\
    \ as a constant in the future. This means that the trace might not generalize\
    \ to other inputs!\n```\n\nThis warning message indicates that the tracing approach\
    \ only records the one/static flow of the input that passes through the model\
    \ and does not consider other cases. You can use the same code snippet provided\
    \ in the previous section to display the parameters' of the traced models:\n\n\
    ```\ntraced_model.to(device)\nfor p in traced_model.parameters():\n    print(p.data)\n\
    ```\n\nThe parameters should remain the same (all 0.01s). However, the model code\
    \ is different. Specifically, print(traced_model.code) displays the following\
    \ output:\n\n```\ndef forward(self,\n    x: Tensor) -> Tensor:\n    linear = self.linear\n\
    \    return torch.neg((linear).forward(x, ))\n```\n\nNote that this traced model\
    \ always returns the negative (torch.neg) of the output from the linear model,\
    \ as the path was taken by the dummy input and recorded in the traced model. In\
    \ other words, the if code block will never be taken for future data."
