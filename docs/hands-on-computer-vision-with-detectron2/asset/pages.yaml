- pgno: 93
  md: "```\n)\n(anchor_generator): DefaultAnchorGenerator(\n    (cell_anchors): BufferList()\n\
    )\n)\n```\n\nObservably, this RPN has two main parts: the standard RPN head (rpn_head)\
    \ and the anchor generator (anchor_generator). Additionally, during training,\
    \ there is a component for RPN to calculate the loss of this RPN network. Finally,\
    \ this RPN head makes the predictions to propose regions for the next stage. The\
    \ following sections dive deep into these components.\n\n# The anchor generator\n\
    \nThe anchor generator is used at the training time to generate all the raw anchors,\
    \ one set (e.g., 15 anchors or a different number of anchors depending on the\
    \ configuration, more about this later) per feature pixel (50×50×15 = 37,500 anchors,\
    \ in this case). Using anchors is a great technique of Faster R-CNN, and other\
    \ techniques (such as YOLO and SSD) also adopt them to improve prediction accuracies.\
    \ Specifically, instead of having to predict bounding boxes from “nothing,” we\
    \ can give the model a set of initial bounding boxes (with specific sizes and\
    \ width/height ratios) and ask the models to predict the bounding boxes relative\
    \ to these initial boxes (location/bounding-box deltas). Different sizes and ratios\
    \ help to deal with objects of different scales and shapes.\n\nThis anchor generator\
    \ takes inputs as anchors’ ratios and sizes. These two parameters can be set for\
    \ Detectron2 using configuration variables. The following snippet displays these\
    \ currently set values:\n\n```\nprint(cfg.MODEL.ANCHOR_GENERATOR.SIZES)\nprint(cfg.MODEL.ANCHOR_GENERATOR.ASPECT_RATIOS)\n\
    ```\n\nThis snippet should give the following output:\n\n```\n[[32, 64, 128, 256,\
    \ 512]]\n[[0.5, 1.0, 2.0]]\n```\n\nPrecisely, the sizes correspond to the square\
    \ root of the areas of the initial anchors in the original image. Additionally,\
    \ the ratios specify these initial anchors’ height/width ratios. In this specific\
    \ case, the combinations of these 2 sets of values produce 15 anchors (5 sizes\
    \ times 3 ratios). The different sizes and ratios address the objects of different\
    \ sizes and aspect ratios. This approach (pyramids of anchors) is considered more\
    \ cost-efficient compared to other approaches, such as feature pyramids (extracting\
    \ features at different convolution layers to address different sizes) or using\
    \ different filter sizes and ratios (sizes of sliding windows)."
