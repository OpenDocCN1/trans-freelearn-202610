    # The architecture of the segmentation models


    Chapter 4 dived deep into the architecture of Faster R-CNN implemented in Detectron2
    for object detection tasks in computer vision. Detectron2 implements Mask R-CNN
    for object segmentation tasks. It has the same components as Faster R-CNN architecture
    and one other head for the segmentation task. Figure 10.1 shows the Faster R-CNN
    architecture as listed in Chapter 4.


    ![](img/0e7994c850a84b7a53d34c7f943c7edd_239_0.png)


    Figure 10.1:The architecture of the Detectron2 object detection application'
