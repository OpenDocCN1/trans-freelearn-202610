- pgno: 54
  md: '# Selecting a configuration file and getting a predictor


    Semantic segmentation is a byproduct of panoptic segmentation. For instance, it
    groups detected objects of the same class into one if they are in the same region
    instead of providing segmentation data for every detected object. Therefore, the
    model for semantic segmentation is the same as that for panoptic segmentation.
    Therefore, the configuration file, the weights, and the code snippet for getting
    a predictor are the same as those for the previous panoptic segmentation application.


    # Performing inferences


    The inferencing code snippet for semantic segmentation is also the same for panoptic
    segmentation. The inferencing result (the same as that for panoptic segmentation)
    also has a field called sem_seg. This field has the shape of classes × image_height
    × image_width. Specifically, it is 54 × 720 × 960 in this specific case. The size
    720 × 960 corresponds to all pixels of the input image. For each pixel, there
    are 54 values, corresponding to the probabilities of the pixel being classified
    into 54 categories of the trained dataset, respectively.


    # Visualizing the results


    The visualization of the semantic segmentation results is slightly different.
    First, the sem_seg field is extracted. Next, from the 54 probabilities, the class
    label with the highest predicted probability is selected as the label for every
    individual pixel using the argmax method. The extracted data is then passed to
    the draw_sem_seg method from the Visualizer object to perform the visualization.
    Here is the code snippet for visualizing the semantic segmentation result:


    ```

    from google.colab.patches import cv2_imshow

    from detectron2.utils.visualizer import Visualizer

    from detectron2.data import MetadataCatalog

    metadata = MetadataCatalog.get(cfg.DATASETS.TRAIN[0])

    v = Visualizer(img[:, :, ::-1], metadata, scale=0.5)

    sem_seg = output["sem_seg"].argmax(dim=0)

    annotated_img = v.draw_sem_seg(sem_seg.to("cpu"))

    cv2_imshow(annotated_img.get_image()[:, :, ::-1])

    ```


    Figure 2.11 shows the semantic segmentation result visualized on the corresponding
    input image. Notably, compared to the panoptic results, the detected people are
    grouped into one region and classified as things.'
  merge: -1
  img_proc: true
