- pgno: 265
  md: '# Development environments, file formats, and runtimes


    There are three main concepts to grasp while developing and deploying deep learning
    models: the development environment and programming languages, the model file
    formats, and the runtime environments. Figure 12.1 illustrates these three concepts
    and examples of each.


    ![](img/0e7994c850a84b7a53d34c7f943c7edd_265_0.png)


    Figure 12.1: Development environments, file formats, and deployment environments


    The development environment and programming languages or frameworks such as PyTorch
    or Python, in general, prioritize ease of use and customizations. However, the
    Python language and PyTorch framework may have runtime issues at deployment. For
    instance, they are relatively slow compared to other runtime environments, such
    as executable files generated by C++ applications. Additionally, they are not
    deployable directly on the web browser or mobile devices. Therefore, models written
    in PyTorch often need to go through an export process to become deployable artifacts.


    Models written in PyTorch have their own file format and are meant to be executable
    with PyTorch runtime. However, to support cross-platform and compatibility with
    other runtime environments, PyTorch supports another intermediate file format
    called TorchScript. This TorchScript file can be executed in different runtime
    environments, such as being loaded by C++ applications to generate executable
    files. PyTorch also allows exporting its models into Open Neural Network Exchange
    (ONNX) file format to support other runtime environments such as web browsers
    and mobile devices.


    TorchScript has its own interpreter, which functions like a limited version of
    Python. This format enables us to save the entire model to disk and use it in
    a different environment, such as a server built with another language other than
    Python. The TorchScript format allows for compiler optimizations, resulting in
    more efficient execution. Additionally, TorchScript can interface with multiple
    backend/device runtimes.


    Detectron2 supports exporting its models into TorchScript using the tracing and
    scripting methods. It also allows users to export their models to an ONNX file
    format, which can be loaded into different runtime environments such as web browsers
    and mobile devices. Detectron2 models can be exported into Caffe2 file format
    using the caffe2_tracing method. However, Caffe2 is about to be deprecated and
    combined with PyTorch. Therefore, this book does not consider this option. Finally,
    TensorFlow is considered more popular in production environments compared to PyTorch
    at the time of writing. Therefore, Detectron2 supports exporting its models to
    TensorFlow''s file format'
  merge: -1
