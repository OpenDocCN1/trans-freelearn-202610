    from detectron2.data import DatasetCatalog\nclass DataDictSampler():\n    def\
    \ __init__(self, name_ds):\n        ds = DatasetCatalog.get(name_ds_train)\n \
    \       self.ds = ds\n    def get_items(self, n=3):\n        indices = np.random.randint(\n\
    \            low  = 0,\n            high = len(self.ds)-1,\n            size =\
    \ n)\n        return [copy.deepcopy(self.ds[_]) for _ in indices]\n```\n\nThis\
    \ code snippet takes a dataset name registered with Detectron2 and loads its data\
    \ (in JSON format). It then builds a method (get_items) to randomly sample some\
