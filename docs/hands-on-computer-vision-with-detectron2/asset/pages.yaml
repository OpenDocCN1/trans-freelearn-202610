  md: "```\nclass SimplePyTorchModel(nn.Module):\n    def __init__(self):\n      \
    \  super(SimplePyTorchModel, self).__init__()\n        self.linear = nn.Linear(4,\
    \ 1)\n        self.linear.weight.data.fill_(0.01)\n        self.linear.bias.data.fill_(0.01)\n\
    \n    def forward(self, X):\n        return torch.relu(self.linear(X))\n```\n\n\
    Notably, we do not need to train the model but fix its weights and biases as 0.01\
    \ for demonstration purposes. The following code snippet then creates a model\
    \ of this simple neural network and puts it in evaluation mode:\n\n```\npt_model\
    \ = SimplePyTorchModel()\npt_model.eval()\n```\n\nNow, we are ready to export\
    \ the model into ONNX format using a dummy input:\n\n```\ndummy_X = torch.tensor([[1,\
    \ 2, 3, 4]], dtype=torch.float32)\nmodel_name = 'onnx_model.onnx'\ntorch.onnx.export(pt_model,\n\
    \    dummy_X, model_name, verbose=True)\n```\n\nTo test the exported model, we\
    \ first need to install the onnx package using the following statement:\n\n```\n\
    !pip install onnx\n```\n\nAfter installing onnx, the following code snippet loads\
    \ the exported ONNX model, checks whether it is well-formed, and prints out its\
    \ graph for inspection purposes:\n\n```\nimport onnx\nfrom onnx.helper import\
    \ printable_graph\n# load\nloaded_model = onnx.load(model_name)\n# check (well\
    \ formed)\nonnx.checker.check_model(loaded_model)\n# graph\nprint(printable_graph(loaded_model.graph))\n\
    ```"
