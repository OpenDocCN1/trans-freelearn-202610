    # Setting pixel means and standard deviations


    Input image pixels’ means and standard deviations are crucial in training Detectron2
    models. Specifically, Detectron2 uses these values to normalize the input images.
    Detectron2 has two configuration parameters for these. They are cfg.MODEL.PIXEL_MEAN
    and cfg.MODEL.PIXEL_STD. By default, the common values for these two hyperparameters
