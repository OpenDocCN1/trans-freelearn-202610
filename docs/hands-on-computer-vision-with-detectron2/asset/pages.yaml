    \ them.\n\n# Developing a custom trainer\n\nThere are several reasons for developing\
    \ a Detectron2 custom trainer. For instance, we may want to customize the dataset\
    \ loader to incorporate more image augmentation techniques or to add evaluators\
    \ to assess how the trained models perform during training. The following code\
