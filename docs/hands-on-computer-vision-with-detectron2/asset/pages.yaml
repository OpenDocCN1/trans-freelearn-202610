- pgno: 131
  md: 'Specifically, this custom trainer overrides the `build_evaluator` method to
    return an object of COCOEvaluator that can be used to evaluate the test set. The
    COCOEvaluator class is chosen because the test dataset is in COCO format. When
    the evaluator is specified, the following code snippet specifies the frequency
    of how often this evaluator is executed:


    ```

    cfg.TEST.EVAL_PERIOD = cfg.SOLVER.CHECKPOINT_PERIOD

    ```


    This code snippet sets the evaluation period the same as the checkpoint period,
    so the evaluation is done for every checkpoint. The next code snippet then creates
    a custom trainer and performs training just like the default trainer:


    ```

    trainer = BrainTumorTrainer(cfg)

    trainer.train()

    ```


    You may wonder why executing an evaluator during the training process is more
    valuable than evaluating the trained models after the training process is completed.
    There are several reasons for this usage. One is that this approach allows monitoring
    evaluation results with COCO evaluation metrics that can be used to select the
    best models while training and perform early stopping (stopping training after
    several iterations when you no longer see improvements).


    Another example is that the evaluation metrics are stored together with the training
    metrics (such as classification and bounding box losses) and offer the opportunity
    to evaluate the bias and variance trade-off during training using tools such as
    TensorBoard. The following section introduces a new concept called the *hook system*
    combined with the idea proposed in this section to demonstrate the first scenario.
    *Chapter 6* utilizes TensorBoard to illustrate the second scenario.


    # Utilizing the hook system


    A hook system allows incorporating classes to execute several tasks on training
    events. A custom hook builds upon inheriting a base class from Detectron2 called
    `detectron2.engine.HookBase`. A hook allows the developer to execute tasks on
    four events by overriding the following methods:


    +   - `before_training()` to include tasks to be executed before the first training
    iteration

    +   - `after_training()` to include tasks to be executed after training completes

    +   - `before_step()` to include tasks to be executed before each training iteration

    +   - `after_step()` to include tasks to be executed after each training iteration'
  merge: -1
  img_proc: true
