    # The backbone network


    Chapter 2 discusses the typical backbone networks for Detectron2. They include
    ResNet50, ResNet101, ResNeXt101, and their variants. This section inspects the
    ResNet50 architecture as an example. However, the idea remains the same for other
    base models (backbone networks). Figure 4.3 summarizes the steps to inspect the
    backbone network. Specifically, we pass a tensor of data for a single image to
    the backbone, and the backbone (ResNet50, in this case) gives out a tensor. This
    output tensor is the extracted salient feature of the input image.'
