  md: "```\nmu_boxes  = mu_boxes,\nsrc_weight  = self.src_weight,\ndst_weight  = self.dst_weight)\n\
    ```\n\nThe following code snippet creates the MixUpTransform class:\n\n```\nclass\
    \ MixUpTransform(T.Transform):\n    def __init__(self, image, mu_image, mu_boxes,\n\
    \                 src_weight = 0.5,\n                 dst_weight = 0.5):\n   \
    \     # Step 1: resize the mu_image and mu_boxes\n        # Step 2: pad mu_image\n\
    \        # Step 3: save values\n    def apply_image(self, image):\n        bl_tfm\
    \ = T.BlendTransform(src_image  =self.mu_image,\n                            \
    \     src_weight  =self.src_weight,\n                                 dst_weight\
    \  =self.dst_weight)\n        return bl_tfm.apply_image(image)\n    def apply_coords(self,\
    \ coords):\n        return coords\n    def apply_box(self, boxes):\n        boxes\
    \ = np.vstack([boxes, self.mu_boxes])\n        return boxes\n```\n\nThis transformation\
    \ class has three main methods. The __init__ method resizes the extra image and\
    \ related annotations to the current input size using the ResizeShortestEdge class\
    \ and padding (with NumPy). Its apply_image method utilizes the BlendTransform\
    \ class and mixes the two images. Its apply_coords method merely returns its input\
    \ (does nothing), and its apply_box method combines the bounding boxes from the\
    \ two samples.\n\nThe __init__ method has the following three steps:\n\n# Step\
    \ 1: This step uses the ResizeShortestEdge class to resize the extra image (mixup\
    \ image) to fit into the current input image:\n\n```\nimage_size = image.shape[:2]\n\
    rse = T.ResizeShortestEdge([min(image_size)],\n                           min(image_size),\n\
    \                           \"choice\")\naug_i = T.AugInput(image=mu_image, boxes\
    \ = mu_boxes)\n```"
