  md: '# 10


    # Training Instance Segmentation Models


    This chapter provides you with common tools for collecting and labeling images
    for object instance segmentation tasks. Additionally, it covers the steps to extract
    data from different sources and reconstruct a dataset in the format supported
    by Detectron2. Before training an object segmentation model, this chapter also
    utilizes the code and visualizations approach to explain the architecture of an
    object segmentation application developed using Detectron2.


    By the end of this chapter, you will understand different techniques to collect
    and label data for training models with object instance segmentation tasks. You
    will have hands-on experience constructing a custom dataset by extracting data
    from a nonstandard format and reconstructing it in the format supported by Detectron2
    for object detection. Additionally, you will have profound knowledge about the
    architecture and hands-on experience of training an object instance segmentation
    application in Detectron2 on a custom dataset. Specifically, this chapter covers
    the following topics:


    +   - Preparing data for training segmentation models

    +   - The architecture of the segmentation models

    +   - Training custom segmentation models


    # Technical requirements


    You should have completed Chapter 1 to have an appropriate development environment
    for Detectron2.


    All the code, datasets, and results are available on the GitHub repo of the book
    at https://github.com/PacktPublishing/Hands-On-Computer-Vision-with-Detectron2.'
