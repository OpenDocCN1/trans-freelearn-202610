  md: "The second augmentation type used is ResizeShortestEdge, and the following\
    \ code snippet creates and appends that augmentation:\n\n```\nmin_size = cfg.INPUT.MIN_SIZE_TRAIN\n\
    max_size = cfg.INPUT.MAX_SIZE_TRAIN\nsample_style = cfg.INPUT.MIN_SIZE_TRAIN_SAMPLING\n\
    augs.append(\n    T.ResizeShortestEdge(\n        min_size,\n        max_size,\n\
    \        sample_style)\n)\n```\n\nLastly, the following code snippet adds a RandomFlipping\
    \ augmentation to the list of augmentations used by this custom trainer:\n\n```\n\
    if cfg.INPUT.RANDOM_FLIP != \"none\":\n    augs.append(\n        T.RandomFlip(\n\
    \            horizontal=cfg.INPUT.RANDOM_FLIP == \"horizontal\",\n           \
    \ vertical=cfg.INPUT.RANDOM_FLIP == \"vertical\",\n        )\n    )\n```\n\nIt\
    \ is relatively easy to use this declarative approach and incorporate different\
    \ augmentations/ transformations using classes provided by Detectron2, as shown\
    \ in the MyTrainer class. These existing classes only work with one data item\
    \ (one image and its related annotations). However, several useful image augmentation\
    \ techniques may require data from multiple samples. For instance, MixUp loads\
    \ inputs from two data samples, and Mosaic loads inputs from four. In these cases,\
    \ it is necessary to rewrite several components of the Detectron2 data loader\
    \ system to enable combining annotations from different samples into one. The\
    \ next section illustrates these scenarios.\n\n# Developing custom image augmentation\
    \ techniques\n\nSuppose the custom augmentation requires annotations loaded from\
    \ one data sample (dataset_dict). In that case, it is relatively simple to implement\
    \ the custom augmentation or transformation and incorporate it using the declarative\
    \ approach described in the previous section. This section focuses on more complicated\
    \ augmentation types that require loading and combining inputs from multiple samples.\
    \ In these cases, we need to rewrite several parts of the Detectron2 data loader\
    \ system. Thus, this section describes modifications to the Detectron2 data loader\
    \ system and develops two custom image augmentations (MixUp and Mosaic) for illustration\
    \ purposes."
