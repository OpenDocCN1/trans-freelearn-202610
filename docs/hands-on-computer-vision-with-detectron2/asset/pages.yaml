- pgno: 168
  md: "This algorithm has the following steps:\n\n+   1. Start with the initial sizes\
    \ and ratios generated by the clustering algorithms.\n+   2. Sample some items\
    \ to evolve based on a given probability (e.g., 0.9 to have an item evolve 90%\
    \ of the time).\n+   3. Sample some random evolving amounts from a normal random\
    \ distribution with a given mean and standard deviation.\n+   4. Change the sizes\
    \ and ratios using the generated random amounts.\n+   5. Compute a fitness score\
    \ using the new sets of sizes and ratios.\n+   6. If the fitness improves, set\
    \ the initial set of sizes and ratios to these current sets and loop back to step\
    \ 1. Otherwise, proceed to step 2.\n\nThe following code snippet implements this\
    \ algorithm:\n\n```\ndef evolve(sizes, ratios,\n    gt_wh,\n    iterations = 10000,\n\
    \    probability = 0.9,\n    muy = 1,\n    sigma = 0.05,\n    fit_fn = fitness,\n\
    \    verbose = False):\n# Step 1: Current anchors and their fitness\nmsg = f\"\
    Evolving ratios and sizes:\"\npbar = tqdm(range(iterations), desc = msg)\nfor\
    \ i, _ in enumerate(pbar):\n# Step 2 and 3: sample evolving items and amounts\n\
    # Step 4 and 5: change sizes and ratios and new fitness\n\n    if mutated_fit\
    \ > best_fit:\n        # Step 6: update sizes and ratios if better\nreturn sizes,\
    \ ratios\n```"
  merge: -1
  img_proc: true
- pgno: 169
  md: "The code for each step is explained in the following sections. Specifically,\
    \ the code for step 1 generates the anchors using the current sizes and ratios\
    \ and computes the current fitness score:\n\n```\nanchors = generate_anchors(tuple(sizes),\
    \ tuple(ratios))\nac_wh = boxes2wh(anchors)\nanchor_shape = len(sizes) + len(ratios)\n\
    best_fit = fit_fn(ac_wh, gt_wh)\n```\n\nThe following code snippet provides the\
    \ codes for steps 2 and 3. These steps randomly sample items to mutate and the\
    \ amounts for mutation:\n\n```\nmutation = np.ones(anchor_shape)\nmutate = np.random.random(anchor_shape)\
    \ < probability\nmutation = np.random.normal(muy,sigma,anchor_shape)*mutate\n\
    mutation = mutation.clip(0.3, 3.0)\n```\n\nSteps 4 and 5 make changes to the sizes\
    \ and ratios after getting information about what to change and how much to change.\
    \ Additionally, it also computes the new fitness score after performing mutation.\
    \ The source code for these steps is as follows:\n\n```\nmutated_sizes = sizes.copy()*mutation[:len(sizes)]\n\
    mutated_ratios = ratios.copy()*mutation[-len(ratios):]\nmutated_anchors = generate_anchors(\n\
    \    tuple(mutated_sizes),\n    tuple(mutated_ratios))\nmutated_ac_wh = boxes2wh(mutated_anchors)\n\
    mutated_fit = fit_fn(mutated_ac_wh, gt_wh)\n```\n\nLastly, if the new fitness\
    \ score is better, the code for step 6 updates the best score, sizes, and ratios\
    \ with their corresponding current values:\n\n```\nsizes = mutated_sizes.copy()\n\
    ratios = mutated_ratios.copy()\nbest_fit = mutated_fit\nmsg=f\"Evolving ratios\
    \ and sizes, Fitness = {best_fit:.4f}\"\npbar.desc = (msg)\n```\n\nWe can then\
    \ run the following line of code to start the optimization process:\n\n```\ne_sizes,e_ratios\
    \ = evolve(sizes,ratios,gt_wh,verbose=False)\n```"
