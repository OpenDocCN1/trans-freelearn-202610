- pgno: 156
  md: '# # Fine-tuning the learning rate and batch size


    Detectron2 provides several configurations for its default stochastic gradient
    descent solver (optimizer). However, these are the main parameters:


    +   - The `cfg.SOLVER.IMS_PER_BATCH` hyperparameter sets the batch size or the
    number of images per training iteration.

    +   - The `cfg.SOLVER.BASE_LR` hyperparameter is used to set the base learning
    rate.

    +   - The `cfg.SOLVER.MOMENTUM` hyperparameter stores the momentum value.

    +   - The `cfg.SOLVER.NESTROV` hyperparameter dictates whether to use Nesterov’s
    implementation of momentum.

    +   - The `cfg.SOLVER.WARMUP_ITERS` hyperparameter stores the number of warm-up
    iterations.

    +   - The `cfg.SOLVER.STEPS` hyperparameter sets the iterations at which the learning
    rate is reduced by `cfg.SOLVER.GAMMA` (another hyperparameter).

    +   - The `cfg.SOLVER.MAX_ITER` hyperparameter sets the maximum number of iterations
    for training. This iteration is not counted as epochs but as batches.


    The following code snippet sets these parameters with the values after we analyze
    the previously trained results using TensorBoard:


    ```

    ```python

    cfg.SOLVER.IMS_PER_BATCH = 6

    cfg.SOLVER.BASE_LR = 0.001

    cfg.SOLVER.WARMUP_ITERS = 1000

    cfg.SOLVER.MOMENTUM = 0.9

    cfg.SOLVER.STEPS = (3000, 4000)

    cfg.SOLVER.GAMMA = 0.5

    cfg.SOLVER.NESTROV = False

    cfg.SOLVER.MAX_ITER = 5000

    ```

    ```


    TensorBoard’s inspection of the previous training loss shows a large fluctuation
    in the losses. Therefore, increasing the batch size would help smoothen the changes.
    However, we have set this number to 6 due to having limited GPU resources. We
    also set a higher base learning rate and steps to reduce the learning rate by
    half (GAMMA).


    Congratulations! By now, you should have the necessary background knowledge and
    code to produce sets of pixel means and standard deviations that are appropriate
    for your custom images.'
