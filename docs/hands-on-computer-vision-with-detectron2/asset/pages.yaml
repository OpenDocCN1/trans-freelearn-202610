    print(cfg.MODEL.ROI_HEADS.POSITIVE_FRACTION)

    ```

    ```


    This code snippet should display three values 0.5, 512, and 0.25. These values
    mean that a proposal with IoUs with all ground-truth boxes less than 0.5 is considered
    background. Per image, 512 proposals are sampled for training, of which 25% should
    be positive proposals. If there are fewer positive proposals than these, other
    negative proposals are added to make a total of 512 proposals.


    The following code snippet displays the main components for the Region of Interest
    Head (roi_head):


