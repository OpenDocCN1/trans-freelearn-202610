  md: '# 13

    Deploying Detectron2 Models into Browsers and Mobile Environments


    This chapter introduces the Open Neural Network Exchange (ONNX) framework. This
    framework helps share deep neural networks across multiple frameworks and platforms.
    It is extremely helpful when there is a need to deploy Detectron2 models into
    browsers or mobile environments. This chapter also describes D2Go, a framework
    for training, quantizing, and deploying models with minimal memory storage and
    computation requirements. Models created using this framework are extremely helpful
    for deploying into mobile or edge devices.


    By the end of this chapter, you will understand the ONNX framework and when it
    is helpful. You can export custom Detectron2 models into this format and deploy
    them into the web or browser environments. You will also understand the advantage
    of the D2Go framework and know how to utilize pre-trained models on its Model
    Zoo or train custom models using D2Go. You can also perform quantization on a
    custom model to further optimize its memory and improve its computation time.


    Specifically, this chapter covers the following topics:


    +   - Deploying Detectron2 models using ONNX

    +   - Developing mobile computer vision apps with D2Go


    # Technical requirements


    You should have completed Chapter 1 to have an appropriate development environment
    for Detectron2.

    All the code, datasets, and results are available on the GitHub page of the book
    at https://github.com/PacktPublishing/Hands-On-Computer-Vision-with-Detectron2.'
