- pgno: 302
  md: '# Summary


    This chapter introduced the ONNX model format and the platforms and frameworks
    that support it. This framework helps Detectron2 models to be interoperable with
    different frameworks and platforms. It then provides the steps to export Detectron2
    models to this format and the code to deploy the exported model in the browser
    environments. This chapter also introduced D2Go, a framework for training, optimizing,
    and deploying neural networks for computer vision applications with minimal memory
    storage and computation resources. Additionally, its models are prepared to be
    further optimized using the quantization technique, which converts the model weights
    and activations in lower-precision number systems. This quantization step further
    reduces the model memory requirement and improves computation performance. Therefore,
    D2Go models are suitable for deploying into mobile or edge devices. D2Go also
    has pre-trained models on its Model Zoo. Thus, this chapter provides the steps
    to build computer vision applications using existing models on the D2Go Model
    Zoo. It also provides the steps to train custom D2Go models and perform quantization
    using D2Go utilities.


    Congratulations, and thank you for following along until the last chapter! You
    should now consider yourself an expert in developing practical computer vision
    applications using Detectron2. Additionally, the theory provided in this book
    should help you to explore other computer vision deep learning architectures such
    as **You Only Look Once (YOLO)**.'
