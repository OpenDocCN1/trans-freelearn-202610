- pgno: 66
  md: 'The next method is called download. It uses the previous helper to download
    images, and the results are stored under a folder called simple_images. The images
    for each keyword are stored in a subfolder named after the keyword itself. Furthermore,
    this method writes a text file per keyword for all the corresponding URLs to the
    downloaded images with the same name as the keyword plus the .txt extension. For
    instance, the following code snippet downloads 10 images for the brain tumors
    x-ray and heart tumors x-ray keywords:


    ```

    download(keywords=["brain tumors x-ray", "heart tumors x-ray"], limit=10)

    ```


    Figure 3.3 shows the resulting folders in Google Drive for the downloaded images
    and text files to store the image URLs on the internet. These URLs can be used
    to validate the images or check for copyrights.


    ![](img/0e7994c850a84b7a53d34c7f943c7edd_66_0.png)


    Figure 3.3: Resulting image folders and text files for their corresponding URLs


    The downloaded images may not be what you are looking for exactly. Therefore,
    you should check the downloaded images and delete those that do not meet your
    specific needs. Once you have the desired images, the next step is to select a
    tool to start labeling the images for training and validation.


    # Selecting an image labeling tool


    Computer vision applications are developing rapidly. Therefore, there are many
    tools for labeling images for computer vision applications. These tools range
    from free and open source to fully commercial or commercial with free trials (which
    means there are some limitations regarding available features). The labeling tools
    may be desktop applications (require installations), online web applications,
    or locally hosted web applications. The online applications may even provide cloud
    storage, utilities to support collaborative team labeling, and pre-trained models
    that help to label quicker (generally, with some cost).'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'One of the popular image labeling tools is `labelImg`. It is available at `https://github.com/heartexlabs/labelImg/blob/master/README.rst`.
    It is an open source, lightweight, fast, easy-to-use, Python-based application
    with a short learning curve.


    Its limitation is that it supports only the creation of rectangle bounding boxes.
    It is currently part of **Label Studio** (which is a more complicated tool with
    many more features). However, it is still the best choice if the task at hand
    is to perform object detection and localization only.


    Another popular tool is `labelme` (`https://github.com/wkentaro/labelme`). It
    is similar to labelImg in terms of being a Python-based application, open source,
    fast, and easy to use. However, it supports other annotation types besides rectangle
    bounding boxes. Specifically, it can annotate polygons, rectangles, circles, lines,
    and points. Therefore, it can be used to label training images for object detection
    and semantic or instance segmentation tasks.


    Both labelImg and labelme are locally installed applications. However, if you
    want to work with a locally hosted web application, you may refer to **VGG (Visual
    Geometry Group) Image Annotator (VIA)**. VIA is a lightweight, standalone, browser-based
    web application. It also supports annotating polygons, circles, lines, and rectangular
    bounding boxes.


    If you want to use a cloud-based web application (that supports cloud storage
    and annotation on the web), you may like `roboflow`, available at `https://app.roboflow.com`.
    This online web application supports various annotation modes. It has utilities
    for teams to label images collaboratively. It also supports pre-trained models
    to help label images faster. However, several of its advanced features are only
    available in the paid plan. Another popular web platform for this task is `https://www.makesense.ai`.
    It is open source and free to use under a GPLv3 license. It supports several popular
    annotation formats and uses AI to make your labeling job more productive.


    This chapter selects `labelImg` to prepare data for the object detection tasks.
    *Chapter 10* uses `labelme` to prepare data for the object instance segmentation
    tasks. After choosing a labeling tool, the next step is to discover which annotation
    formats that tool supports, which one to select, and how to convert it to the
    format that Detectron2 supports.


    # Annotation formats


    Similar to labeling tools, many different annotation formats are available for
    annotating images for computer vision applications. The common standards include
    COCO JSON, Pascal VOC XML, and YOLO PyTorch TXT. There are many more formats (e.g.,
    TensorFlow TFRecord, CreateML JSON, and so on). However, this section covers only
    the previously listed three most common annotation standards due to space limitations.
    Furthermore, this section uses two images and labels extracted from the test set
    of the brain tumor object detection dataset available from Kaggle (`https://www.kaggle.com/datasets/davidbroberts/brain-tumor-object-detection-datasets`)
    to illustrate these data formats and demonstrate their differences, as shown in
    *Figure 3.4*. This section briefly discusses the key points of each annotation
    format, and interested readers can refer to the GitHub page of this chapter to
    inspect this same dataset in different formats in further detail.'
  merge: -1
  img_proc: true
