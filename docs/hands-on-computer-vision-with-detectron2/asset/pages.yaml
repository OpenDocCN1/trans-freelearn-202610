  img_proc: true
- pgno: 240
  md: 'The code to explore the architecture of Detectron2 implementation for object
    segmentation tasks remains the same as that for the object detection tasks. Therefore,
    this section only covers some discrepancies between the two. The first difference
    is that we must select a pre-trained model with configuration for the object segmentation
    task instead of the detection task. Therefore, we change the corresponding paths
    for the configuration and model weights as follows:


    ```

    config_file = "<url_to/mask_rcnn_R_50_C4_1x.yaml>"

    checkpoint_url = "<url_to/mask_rcnn_R_50_C4_1x.yaml>"

    ```


    Once again, as discussed in *Chapter 2*, other models are available, and there
    are trade-offs between selecting one versus the others. This selection selects
    this model (Res50C4) due to its simplicity. The backbone and region proposal networks
    remain the same and work similarly for object detection tasks. The Region of Interest
    Heads (`roi_heads`) has one additional head called the mask head (`mask_head`).
    Therefore, the output of the following code snippet reflects the differences:


    ```

    roi_heads = predictor.model.roi_heads

    print(roi_heads)

    ```


    This snippet, besides pooler, res5, and box_predictor as in *Chapter 4*, also
    displays the mask head as the following:


    ```

    (mask_head): MaskRCNNConvUpsampleHead(

    (deconv): ConvTranspose2d(2048, 256, kernel_size=(2, 2),

    stride=(2, 2))

    (deconv_relu): ReLU()

    (predictor): Conv2d(256, 80, kernel_size=(1, 1), stride=(1, 1))

    )

    ```


    This mask head is an instance of MaskRCNNUpsampleHead (for this specific case).
    It is relatively simple, consisting of a ConvTranspose2d layer with ReLU activation
    and a Conv2d layer. This mask head is configurable via the name parameter in the
    configuration file (`cfg.MODEL.ROI_MASK_HEAD.NAME`).'
  merge: -1
  img_proc: true
- pgno: 241
  md: "Figure 10.2 shows the expanded Region Of Interest Heads with mask_head for\
    \ object segmentation tasks.\n\n![](img/0e7994c850a84b7a53d34c7f943c7edd_241_0.png)\n\
    \nFigure 10.2: Region of Interest Heads expanded with the mask head for segmentation\
    \ tasks\n\nSpecifically, all the inputs/outputs and intermediate processing are\
    \ the same as those from the architecture for the object detection tasks (they\
    \ are faded out). The extension part (not faded) utilizes the predicted bounding\
    \ boxes from the detection task as its proposals. It then utilizes another Box\
    \ Features Extraction component that works the same as in the bounding box prediction\
    \ part. The only difference is that it uses the predicted boxes of the previous\
    \ step as proposals instead of the original proposals from the region proposal\
    \ network. Other than that, this component works the same way. The following code\
    \ snippet shows how this component works:\n\n```\n# extract features from the\
    \ predicted boxes\npred_boxes = [\n    instance.pred_boxes\n    for instance\n\
    \    in pred_instances\n]\nx = roi_heads.pooler([res4], pred_boxes)\nx = roi_heads.res5(x)\n\
    print(x.shape)\n```"
