  md: '# Inspecting training histories with TensorBoard


    Before fine-tuning models, it is essential to understand the evaluation metrics
    that are measured during training, such as training losses (for example, classification
    losses and localization losses), learning rate changes, and validation measurements
    on the test set (for example, mAP@0.5), which change over time. These metrics
    allow us to understand the training processes for debugging and fine-tuning models.
    Detectron2’s logger automatically logs the evaluation metrics for training and
    testing data in a format that is usable by TensorBoard.


    TensorBoard (https://www.tensorflow.org/tensorboard) offers tools and visualizations
    so that we can explore training and evaluation processes in machine learning experiments.
    The following code snippet downloads the training logs for the two experiments
    we carried out in Chapter 5 and unzips them:


    ```

    # download and extract

    !wget {url_to_object_detector.zip}

    !wget {url_to_object_detector_hook.zip}

    !unzip object_detector.zip

    !unzip object_detector_hook.zip

    ```


    Once you have the training and evaluation logs, the following code snippet loads
    TensorBoard so that you can view the training results:


    ```

    output_dir = "output/"

    %load_ext tensorboard

    %tensorboard --logdir {output_dir} --host localhost

    ```


    As we can see, this code snippet sets the output directory to the output folder
    where the training logs are stored. It then loads TensorBoard as an internal web
    server and embeds it in the output cell of Google Colab.


    > Important note

    > If TensorBoard was loaded, run %reload_ext tensorboard instead of %load_ext
    tensorboard or kill the current server using its process ID before loading a new
    instance.


