  md: 'This method (`_apply_1_box`) finds the X and Y coordinates of the top left
    (x0, y0) and bottom right (x1, y1), normalized by the image’s width and height,
    with the center of the coordinate placed at the center of the image. Normalization
    ensures that the top-left corner of the image has a [-1, -1] coordinate, the bottom-right
    corner of the image has a [1, 1] coordinate, and that the origin [0, 0] is at
    the center of the image. This normalization reflects the image coordinate values
    after they’ve been translated into cosine values. Finally, it uses the searchsorted
    method to find the pixel coordinates given the cosine coordinates.


