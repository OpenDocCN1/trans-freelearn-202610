    # Introduction to the brain tumor segmentation dataset


    This chapter uses another brain tumor dataset but for segmentation tasks. This
    dataset is originally from Jun Cheng''s 2017 brain tumor dataset: https://doi.org/10.6084/m9.figshare.1512427.v5.
    It has 3,064 images with 3 kinds of brain tumors: glioma (1,426 images), meningioma
    (708 images), and pituitary (930 images) tumors. The following section extracts
    the data, stores the extracted data in COCO format, and performs a train/test
    split.


    # Data extraction


    This dataset is in MATLAB data format (.mat file). That is why it is a good example
    to demonstrate the steps to extract data from various forms and build a standard
    dataset accepted by Detectron2 from scratch. Specifically, each .mat file has
    the following fields:


    +   - label: 1 for meningioma, 2 for glioma, and 3 for pituitary tumor

    +   - PID: the patient identification

    +   - image: the image data

    +   - tumorBorder: the polygon coordinates of the tumor border


    The following code snippet downloads the dataset and unzips it:


    ```

    !wget --quiet https://figshare.com/ndownloader/articles/1512427/versions/5 -O
    segbraintumors.zip

    data_folder = "segbraintumors"

    !unzip -q segbraintumors.zip -d {data_folder}


    sets = ["1-766", "767-1532", "1533-2298", "2299-3064"]

    sets = ["brainTumorDataPublic_"+_ for _ in sets]

    ```'
