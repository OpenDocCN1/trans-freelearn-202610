  md: 'Similarly, the following are the steps to label images using the YOLO format:


    +   1. Create a file called `classes.txt` with a list of labels (one label per
    line).

    +   2. Launch `labelImg` using the previous instructions.

    +   3. Click on the **Open Dir** menu to open the image directory (if you did
    not specify the image directory at launching time).

    +   4. If the current format is not YOLO (it might currently be CreateML or Pascal
    VOC), click on the **CreateML** or **Pascal VOC** menu until it switches to **YOLO**.

    +   5. Click on the **Change Save Dir** menu to change the annotation directory.


    A `.txt` file per image with annotation in the YOLO format is saved in the selected
    directory with the same name. A file named `classes.txt` is saved in that folder
    too.


    Additionally, the following shortcuts help support quick labeling:


    +   - *The W key*: Create a bounding box

    +   - *The D key*: Move to the next image

    +   - *The A key*: Move to the previous image

    +   - *Delete key*: delete the selected bounding box

    +   - Arrow keys: Move the selected bounding box

    +   - *Ctrl + Shift + D*: Delete the current image


    Acquiring datasets from different sources or data labeling tools may come with
    annotation formats that differ from what Detectron2 supports (the COCO data format).
    Therefore, knowing how to convert datasets from different formats to the COCO
    format is essential. The following section guides you through performing this
    dataset conversion process.


    # Annotation format conversions


    Detectron2 has its data description built based on the COCO annotation format.
    In other words, it supports registering datasets using the COCO data annotation
    format. However, other data annotation formats are abundant, and you may download
    a dataset or use a labeling tool that supports another data format different from
    COCO. Therefore, this section covers the code snippets used to convert data from
    the popular Pascal VOC and YOLO formats to COCO style.


    > **Important note**

    > A statement that starts with an exclamation mark (!) means it is a Bash command
    to be executed in a Jupyter notebook (Google Colab) code cell. If you want to
    run it in a terminal, you can safely remove this exclamation mark and execute
    this statement.'
