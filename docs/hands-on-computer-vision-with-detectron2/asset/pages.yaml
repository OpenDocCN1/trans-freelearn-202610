  md: "```\nratios = torch.min(\n    all_ratios, inverse_ratios\n)\nworst = ratios.min(-1).values\n\
    best = worst.max(-1).values\nreturn best\n```\n\nThis function helps quantify\
    \ the fitness of individual ground-truth boxes with a set of anchors and returns\
    \ a list of fitness ratios. However, we need one number to quantify the fitness\
    \ of all ground-truth boxes as a whole, given a set of anchors.\n\n# Quantify\
    \ the fitness\n\nOne approach is to take the average of all the fitness scores\
    \ for all the ground-truth boxes as one fitness score between a set of ground-truth\
    \ boxes as a whole, given a set of anchors. However, a common practice is to discard\
    \ the bad matches and not let them contribute to the average calculation. Precisely,\
    \ we use a threshold, EDGE_RATIO_THRESHOLD, and discard all bad matches.\n\nThe\
    \ default threshold value is 0.25, which means that if the ratio of any side of\
    \ two boxes differs by more than four times, they are considered bad matches:\n\
    \n```\ndef fitness(ac_wh, gt_wh, EDGE_RATIO_THRESHOLD = 0.25):\n    ratio = best_ratio(ac_wh,\
    \ gt_wh)\n    ret = (ratio*(ratio>EDGE_RATIO_THRESHOLD).float()).mean()\n    return\
    \ ret\n```\n\nAdditionally, we can use the following function to check the possibility\
    \ of recalling all the ground-truth boxes using a given set of anchors using a\
    \ pre-defined EDGE_RATIO_THRESHOLD:\n\n```\ndef best_recall(ac_wh, gt_wh, EDGE_RATIO_THRESHOLD\
    \ = 0.25):\n    ratio = best_ratio(ac_wh, gt_wh)\n    best = (ratio > EDGE_RATIO_THRESHOLD).float().mean()\n\
    \    return best\n```\n\nSpecifically, a ground-truth box with edges that do not\
    \ exceed four times or are not smaller than four times the size of at least one\
    \ anchor is then recallable.\n\nThe following code snippet lets us check whether\
    \ the default set of sizes and ratios given by Detectron2 can create a good set\
    \ of anchors that help recall all the ground-truth boxes and how much the fitness\
    \ score is between these two sets:\n\n```\nprint(\"recall\", best_recall(ac_wh,\
    \ gt_wh))\nprint(\"fitness\", fitness(ac_wh, gt_wh))\n```"
