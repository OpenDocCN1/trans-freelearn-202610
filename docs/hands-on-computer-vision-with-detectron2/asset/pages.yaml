- pgno: 81
  md: "# Converting Pascal VOC datasets to COCO datasets\n\nThe Pascal VOC annotation\
    \ format is another popular one. So, this section provides code snippets to convert\
    \ it to the COCO annotation format before registering it with Detectron2. This\
    \ section uses the simple dataset described previously as a demo (annotationdemo).\
    \ First, we download the brain tumors dataset in Pascal VOC (voc.zip) and extract\
    \ it on Google Colab:\n\n```\n# Download the dataset and unzip it\n!wget url_to_voc.zip\n\
    !unzip voc.zip\n```\n\nWith the dataset extracted, the following code snippet\
    \ installs the tree package and views the structure of this dataset:\n\n```\n\
    !sudo apt-get install tree\n!tree voc\n```\n\nThe following is the structure of\
    \ the dataset in COCO annotation format:\n\n```\nvoc\n└ test\n    ├── 00000_102.jpg\n\
    \    ├── 00000_102.xml\n    ├── 00003_154.jpg\n    └── 00003_154.xml\n```\n\n\
    Notably, the Pascal VOC data format stores one annotation file per image file\
    \ with the same name and in a .xml extension.\n\nThis dataset can be modified\
    \ to be in COCO format in place. However, the following code snippet copies these\
    \ images and annotations into a new directory (coco_dir) for the COCO dataset\
    \ and avoids modifying the original one:\n\n```\nimport os\nimport shutil\nfrom\
    \ glob import glob\nfrom tqdm import tqdm\n\nvoc_dir = \"voc/test\"\ncoco_dir\
    \ = 'coco/test'\nos.makedirs(coco_dir, exist_ok=True)\n```"
  merge: -1
  img_proc: true
- pgno: 82
  md: "```\nxml_files = glob(os.path.join(voc_dir, \"*.xml\"))\nimg_files = glob(os.path.join(voc_dir,\
    \ \"*.jpg\"))\n# copy annotations\nfor f in tqdm(xml_files):\n    shutil.copy(f,\
    \ coco_dir)\n# copy images\nfor f in tqdm(img_files):\n    shutil.copy(f, coco_dir)\n\
    ```\n\nOnce copied, it is relatively easy to load this dataset as a pylabel dataset\
    \ using the following code snippet:\n\n```\nfrom pylabel import importer\n# load\
    \ dataset\ndataset = importer.ImportVOC(coco_dir, name=\"brain tumors\")\n```\n\
    \nSimilarly, it is relatively easy to export the loaded dataset to a COCO style\
    \ and store it in the _annotations.coco.json file with the following code snippet:\n\
    \n```\n# export\ncoco_file = os.path.join(coco_dir, \"_annotations.coco.json\"\
    )\n# Detectron requires starting index from 1\ndataset.export.ExportToCoco(coco_file,\
    \ cat_id_index=1)\n```\n\nNotably, Detectron2 requires the label index (cat_id_index)\
    \ to start from 1. Therefore, the ExportToCoco method sets this value to 1.\n\n\
    Once the conversion is completed, it is safe to delete the Pascal VOC annotation\
    \ files (.xml files) in the COCO dataset (coco_dir) using the following code snippet:\n\
    \n```\n# now delete yolo annotations in the coco set\nfor f in xml_files:\n  \
    \  os.remove(f.replace(voc_dir, coco_dir))\n```\n\nOptionally, you can use the\
    \ following statement to view the structure of the resulting dataset:\n\n```\n\
    !tree coco\n```"
