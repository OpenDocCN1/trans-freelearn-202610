- pgno: 203
  md: "The MinIoURandomCrop class takes min_ious, boxes, min_crop_size, mode_trials,\
    \ and crop_trials as input parameters. This augmentation attempts to perform a\
    \ random crop with output that meets the IoU requirement for the input image (controlled\
    \ by min_crop_size) and bounding boxes (controlled by min_ious). The min_crop_size\
    \ parameter is in the ratio (ranging from 0 to 1) to the input height and width\
    \ (H, W). This class works as follows for the maximum mode_trials times, where\
    \ the cropping region is (top, left, new_h, new_w):\n\n+   I. Sample for a min_iou\
    \ value from [0, *min_ious, 1].\n+   II. For the maximum crop_trials times, do\
    \ the following:\n+   \ti. Sample two values from (min_crop_size*W, W) and (min_crop_size*H,\
    \ H) to generate new_h and new_w. It keeps resampling if the crop size ratio is\
    \ outside the range [0.5, 2.0] or the cropping region becomes a line or point\
    \ so that it doesn’t distort the input too much.\n+   \tii. Once there’s a new\
    \ size, it samples the top and left values from [H - new_h] and [W - new_w]. If\
    \ the cropping region has an IoU with any ground-truth boxes smaller than min_iou,\
    \ continue to Step II.\n\nThe following code snippet illustrates the usage pattern\
    \ of this class:\n\n```\niou_aug = T.MinIoURandomCrop(\n    min_ious     = [0.5,\
    \ 0.6, 0.7],\n    min_crop_size = 0.5,\n    mode_trials   = 1000,\n    crop_trials\
    \   = 50\n)\niou_tfm = iou_aug.get_transform(img, boxes=boxes)\niou_img = iou_tfm.apply_image(img)\n\
    iou_boxes = iou_tfm.apply_box(boxes)\nvisualize_image_boxes(iou_img, iou_boxes)\n\
    ```\n\nNote that besides the input image, the get_transform method requires the\
    \ ground-truth boxes since this augmentation works with bounding boxes. This augmentation\
    \ is important because it keeps the ground-truth boxes while trying to remove\
    \ parts of the external contexts. This technique enables training models that\
    \ focus on learning features from the objects instead of their contexts."
  merge: -1
  img_proc: true
