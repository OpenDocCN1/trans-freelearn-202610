  md: "We use the tumor type (category_id) as a stratified field to split tumor types\
    \ between the train and test sets. The following code snippet helps to create\
    \ train and test directories, move the images, and create the corresponding annotation\
    \ files.\n\nFirst, we create the corresponding folders for the train and test\
    \ datasets:\n\n```\ntrain_path = os.path.join(name_ds, \"train\")\ntest_path =\
    \ os.path.join(name_ds, \"test\")\ntrain_af = os.path.join(train_path, af)\ntest_af\
    \ = os.path.join(test_path, af)\nos.makedirs(train_path, exist_ok=True)\nos.makedirs(test_path,\
    \ exist_ok=True)\n```\n\nNext, we move images to their corresponding train and\
    \ test folders:\n\n```\nfor img in tqdm(images_train):\n    frm = os.path.join(name_ds,\
    \ img[\"file_name\"])\n    to = train_path\n    shutil.move(frm, to)\nfor img\
    \ in tqdm(images_test):\n    frm = os.path.join(name_ds, img[\"file_name\"])\n\
    \    to = test_path\n    shutil.move(frm, to)\n```\n\nFinally, we write annotations\
    \ to the corresponding train and test folders:\n\n```\ncreate_json(info,\n   \
    \         licenses,\n            categories,\n            images_train,\n    \
    \        annotations_train,\n            file_name = train_af)\ncreate_json(info,\n\
    \            licenses,\n            categories,\n            images_test,\n  \
    \          annotations_test,\n            file_name = test_af)\n```"
