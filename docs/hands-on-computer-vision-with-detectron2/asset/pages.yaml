- pgno: 63
  md: '# Common data sources


    *Chapter 2 introduced the two most common datasets for the computer vision community.
    They are **ImageNet** and Microsoft **COCO (Common Objects in Context)**. These
    datasets also contain many pre-trained models that can predict various class labels
    that may meet your everyday needs.*


    If your task is to detect a less common class label, it might be worth exploring
    the **Large Vocabulary Instance Segmentation (LVIS)** dataset. It has more than
    1,200 categories and 164,000 images, and it contains many rare categories and
    about 2 million high-quality instance segmentation masks. Detectron2 also provides
    pre-trained models for predicting these 1,200+ labels. Thus, you can follow the
    steps described in *Chapter 2* to create a computer vision application that meets
    your needs. More information about the LVIS dataset is available on its website
    at https://www.lvisdataset.org.


    If you have a task where no existing/pre-trained models can meet your needs, it
    is time to find existing datasets and train your model. One of the common places
    to look for datasets is **Kaggle** (https://www.kaggle.com). Kaggle is a Google
    subsidiary. It provides an online platform for data scientists and machine learning
    practitioners to share datasets, train machine learning models, and share the
    trained models and their thoughts via discussions. It also often holds and allows
    users to host data science and machine learning competitions (including computer
    vision competitions, of course). At the time of writing, searching the phrase
    “object detection” on Kaggle brings 555 datasets, as shown in *Figure 3.1.*


    ![](img/0e7994c850a84b7a53d34c7f943c7edd_63_0.png)


    Figure 3.1: Datasets on Kaggle for object detection tasks


    Kaggle contains datasets for data science and machine learning in general, including
    computer vision datasets. However, if you still cannot find a dataset for your
    custom needs, you may be interested in exploring **Roboflow Universe** available
    at https://universe.roboflow.com. It claims to be the world’s most extensive collection
    of open source computer vision datasets and APIs. At the time of writing, more
    than 100 million images, 110,000 datasets, and 10,000 pre-trained models are available
    on Roboflow Universe, as shown in *Figure 3.2.* Datasets for common computer vision
    tasks are available, such as object detection, instance segmentation, and semantic
    segmentation.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '![](img/0e7994c850a84b7a53d34c7f943c7edd_64_0.png)


    Figure 3.2: Datasets on Roboflow Universe


    Computer vision is advancing rapidly, and there is a vast number of available
    practitioners in this field. If you cannot find the datasets that meet your needs
    in the preceding two resources, you can use the internet (e.g., Google) to search
    for the dataset that you want. However, if you still cannot find such a dataset,
    it is time to collect and label your own dataset. The following sections cover
    the standard tools and steps for collecting and labeling datasets for computer
    vision applications.


    # Getting images


    When you start a new project, you might have a set of images collected using graphic
    devices such as cameras, smartphones, drones, or other specialized devices. If
    you have some photos, you can skip this step and move to the following steps,
    where you select a labeling tool and start labeling. However, if you are about
    to start a fresh new project and do not even have any images, you can get some
    ideas from this section on collecting pictures from the internet. There might
    be copyrights related to images that you collect from the internet. Thus, you
    should check for copyrights to see whether the downloaded images are usable for
    your purposes.


    Google Images contains a massive number of photos, which continues to grow every
    day. Therefore, it is a great resource to crawl images for training your custom
    model. Python has a simple_image_download package that provides scripts to search
    for images using keywords or tags and download them. First, we will install this
    package using the following command:


    ```

    !pip install simple_image_download

    ```


    You can run this command in Google Colab''s code cell to install it and download
    images to a running Google Colab instance. However, once the instance is stopped,
    the downloaded photos are gone. Therefore, you should download the images to a
    mapped Google Drive folder or on a local computer. You can run the same command
    on a locally hosted Jupyter notebook or remove the start (!) character and execute
    it in a terminal to install this package locally. If you are running on Google
    Colab, the following code snippet helps to map Google Drive and creates a folder
    in Google Drive:


    ```

    import os

    from google.colab import drive

    drive.mount(''/gdrive'')

    project_folder = "/gdrive/My Drive/Detectron2/Chapter3"

    os.makedirs(project_folder, exist_ok=True)

    ```'
