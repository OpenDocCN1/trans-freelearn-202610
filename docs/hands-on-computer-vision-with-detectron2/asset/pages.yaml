- pgno: 222
  md: "The get_loc_info method implements the steps described in Figure 9.3 to get\
    \ the corresponding start locations, the center lines, the widths, and the heights\
    \ of the four inputs as follows:\n\n```\nimages = [image] + self.mo_images\nheights\
    \ = [i.shape[0] for i in images]\nwidths = [i.shape[1] for i in images]\nch =\
    \ max(heights[0], heights[1])\ncw = max(widths[0], widths[2])\nh = (max(heights[0],\
    \ heights[1]) +\n    max(heights[2], heights[3]))\nw = (max(widths[0], widths[2])\
    \ +\n    max(widths[1], widths[3]))\n# pad or start coordinates\ny0, x0 = ch-heights[0],\
    \ cw - widths[0]\ny1, x1 = ch-heights[1], cw\ny2, x2 = ch, cw - widths[2]\ny3,\
    \ x3 = ch, cw\nx_pads = [x0, x1, x2, x3]\ny_pads = [y0, y1, y2, y3]\n```\n\nThe\
    \ apply_image method creates an output image and places the four input images\
    \ into their respective locations generated by the get_loc_info method:\n\n```\n\
    # get the loc info\nself.loc_info = self.get_loc_info(image)\nh, w, ch, cw, widths,\
    \ heights, x_pads, y_pads=self.loc_info\noutput = np.zeros((h, w, 3)).astype('float32')\n\
    images = [image] + self.mo_images\nfor i, img in enumerate(images):\n    output[y_pads[i]:\
    \ y_pads[i] + heights[i],\n           x_pads[i]: x_pads[i] + widths[i],:] = img\n\
    ```\n\nThe apply_box method combines the bounding boxes from the current input\
    \ and the three extra inputs. It then moves/pads these bounding boxes with respect\
    \ to the new locations of each input image:\n\n```\n# combine boxes\nboxes = [boxes]\
    \ + self.mo_boxes\n# now update location values\n_, _, _, _, _, _, x_pads, y_pads\
    \ = self.loc_info\n```"
