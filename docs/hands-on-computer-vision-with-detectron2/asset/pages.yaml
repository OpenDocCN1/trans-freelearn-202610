- pgno: 43
  md: '```

    # Select a model

    config_file = "COCO-Detection/faster_rcnn_X_101_32x8d_FPN_3x.yaml"

    checkpoint_url = "COCO-Detection/faster_rcnn_X_101_32x8d_FPN_3x.yaml"

    # Create a configuration file

    cfg = get_cfg()

    config_file = model_zoo.get_config_file(config_file)

    cfg.merge_from_file(config_file)

    # Download weights

    cfg.MODEL.WEIGHTS = model_zoo.get_checkpoint_url(checkpoint_url)

    score_thresh_test = 0.95

    cfg.MODEL.ROI_HEADS.SCORE_THRESH_TEST = score_thresh_test

    predictor = DefaultPredictor(cfg)

    ```


    Specifically, the get_cfg method helps to get a default configuration object for
    this model. Similarly, model_zoo helps to get the configuration file (the .yaml
    file) and download the pre-trained weights. At the same time, DefaultPredictor
    is required to create the predictor from the downloaded configuration file and
    weights. Besides the required imports, this code snippet also suppresses several
    user warnings that are safe to ignore.


    Notably, the cfg.MODEL.ROI_HEADS.SCORE_THRESH_TEST parameter is currently set
    to 0.95. This parameter is used at the test time to filter out all the detected
    objects with detection confidences less than this value. Assigning this parameter
    to a high value (close to 1.0) means we want to have high precision and low recall.
    Likewise, setting it to a low value (close to 0.0) means we prefer low precision
    and high recall. Once we have the model (or predictor interchangeably), it is
    time to perform inferences.


    # Performing inferences


    The following code snippet performs object detection on an input image. Specifically,
    we first import cv2 to read an image from an input_url. Next, using the predictor
    created earlier, it is relatively easy to perform object detection on the loaded
    image (please upload an image to Google Colab to perform inference):


    ```

    import cv2

    input_url = "input.jpeg"

    img = cv2.imread(input_url)

    output = predictor(img)

    ```'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'The next important task is understanding what output format Detectron2 gives
    and what each output component means. This print (output) displays the output
    variable and the fields it provides:


    ```

    {''instances'': Instances(num_instances = 4, image_height = 720, image_width =
    960, fields = [pred_boxes: Boxes(tensor([[492.1558, 331.5353, 687.8397, 637.9542],
    [294.6652, 192.1288, 445.8517, 655.3390], [419.8898, 253.9013, 507.7427, 619.1491],
    [451.8833, 395.1392, 558.5139, 671.0604]], device = ''cuda:0'')), scores: tensor([0.9991,
    0.9986, 0.9945, 0.9889], device = ''cuda:0''), pred_classes: tensor([0, 0, 0,
    0], device = ''cuda:0'')]) }

    ```


    Observably, besides the image information, the object detection result also includes
    the detected instances (instances) with corresponding predicted bounding boxes
    (pred_boxes), predicted confidence scores (scores), and the predicted class labels
    (pred_classes). With this information, we are ready to visualize the detected
    objects with corresponding bounding boxes.


    # Visualizing the results


    Detectron2 provides a Visualizer class, which helps you to easily annotate detected
    results to the input image. Thus, the following code snippet imports this class
    and uses its visualization method to annotate detection results to the input image:


    ```

    from google.colab.patches import cv2_imshow

    from detectron2.utils.visualizer import Visualizer

    from detectron2.data import MetadataCatalog

    metadata = MetadataCatalog.get(cfg.DATASETS.TRAIN[0])

    v = Visualizer(img[:, :, ::-1], metadata, scale=0.5)

    instances = output["instances"].to("cpu")

    annotated_img = v.draw_instance_predictions(instances)

    cv2_imshow(annotated_img.get_image()[:, :, ::-1])

    ```


    Specifically, the first statement imports the cv2_imshow method, a Google Colab
    patch, to display images to Google Colab output. The next import statement is
    Visualizer itself. The third import statement helps get information about the
    training dataset. Specifically, this MetadataCatalog object provides the label
    names for the predicted objects. In this case, a class label is a person for the
    predicted class number 0, as in the output.'
