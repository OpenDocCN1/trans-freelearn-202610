- pgno: 95
  md: "These anchors are centered in one pixel. Thus, they are a little hard to differentiate.\
    \ Figure 4.8 separates them into three groups of the same ratios and five different\
    \ sizes for illustration purposes.\n\n![](img/0e7994c850a84b7a53d34c7f943c7edd_95_0.png)\n\
    \nFigure 4.8: The 15 anchors (3 ratios and 5 sizes) centered at 1 feature pixel\n\
    \nBack to Detectron2’s implementation, the following code snippet helps inspect\
    \ how Detectron2 generates these anchors:\n\n```\n# generate anchors\nanchors\
    \ = rpn.anchor_generator([res4])\nprint(anchors[0].tensor.shape)\n```\n\nThe anchor\
    \ generator takes the input as the extracted features to calculate the sub_sample\
    \ value (ratio between the input size and the feature size) and generate anchors.\
    \ In this case, there are 50×50×15=37,500 anchor boxes. Therefore, the output\
    \ of this code snippet is the following:\n\n```\ntorch.Size([37500, 4])\n```\n\
    \nNotably, there are 37,500 anchors, each with 4 location specifications (x₀,\
    \ y₀, x₁, y₁). To confirm, the following code snippet takes the 15 anchors for\
    \ the middle point of the image and displays it to the original input (as performed\
    \ previously):\n\n```\nnew_img = img.copy()\n# the feature\ncol_idx = 24\nrow_idx\
    \ = 24\nstartBox = (row_idx*50 + col_idx)*15\nfor i in range(startBox, startBox\
    \ + 15):\n    anchors_np = anchors[0].tensor[i].to(\"cpu\").numpy()\n    x0, y0,\
    \ x1, y1 = [int(v) for v in anchors_np]\n```"
