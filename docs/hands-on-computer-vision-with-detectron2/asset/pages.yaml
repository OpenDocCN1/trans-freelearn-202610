- pgno: 153
  md: "![](img/0e7994c850a84b7a53d34c7f943c7edd_153_0.png)\n\nFigure 6.10: The losses\
    \ and thetas over training iterations when using momentum\n\nIn many cases, having\
    \ a high learning rate when the neural network is not trained well yet may lead\
    \ to the gradient exploding issue. Likewise, it is better to have a small learning\
    \ rate when you’re getting close to the optimal point so that the changes are\
    \ not flickering left and right of the optimal point. However, this does not mean\
    \ we should always select small learning rates since this makes the training process\
    \ longer. Therefore, a variable learning rate approach may produce better results.\n\
    \n# Variable learning rates\n\nThere are various ways to approach variable learning\
    \ rates. Due to space, this section covers the approaches that Detectron2 uses\
    \ together with its implementation of stochastic gradient descent. Specifically,\
    \ at the start of training, there is an option to perform a warming-up step. This\
    \ step takes a hyperparameter called `warmup_iters`. From the start of training,\
    \ the learning rate gradually increases linearly (or the sinewave approach is\
    \ also available) so that it becomes the base learning rate at the end of this\
    \ period.\n\nAdditionally, there is another set of hyperparameters called steps\
    \ and gamma. These are the steps at which the learning rate changes by gamma.\
    \ These hyperparameters help gradually reduce the learning rate toward the end\
    \ of the training process. The following code snippet implements the stochastic\
    \ gradient descent approach with variable learning rates:\n\n```\n```python\n\
    class VariableLR():\n    def __init__(self, lr, moment,\n        nesterov =False,\n\
    \        warmup_iters = 0,\n        steps      = None,\n        gamma      = 0.5):\n\
    \        # codes removed: self.<inputs> = <inputs>\n        self.iter = 0\n```\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 154
  md: "```\n```python\nself.lrs = []\nself.first_step = True\ndef backward(self, theta,\
    \ gradients):\n    # Explained next\n```\n```\n\nThis class has two methods: `__init__`\
    \ and `backward`. The first method simply takes the inputs and assigns them to\
    \ corresponding members of the class. The second one performs the actual updates\
    \ to the existing parameters (`theta`) using the input gradients (`gradients`):\n\
    \n```\n```python\nif self.iter in self.steps:\n    self.lr = self.lr*self.gamma\n\
    self.iter += 1\nif self.warmup_iters!=0 and self.iter < self.warmup_iters:\n \
    \   lr = (self.iter/self.warmup_iters)*self.lr\nelse:\n    lr = self.lr\nself.lrs.append(lr)\n\
    if self.first_step:\n    self.v = np.zeros_like(theta)\n    self.first_step =\
    \ False\nif not self.nesterov:\n    self.v = self.moment*self.v + lr * gradients\n\
    \    theta = theta - self.v\nelse:\n    self.v = self.moment*self.v + gradients\n\
    \    theta = theta - lr * self.v\nreturn theta\n```\n```\n\nThe following code\
    \ snippet performs the training and visualizes the results using this approach:\n\
    \n```\n```python\noptimizer = VariableLR(lr = lr, moment=0.9, nesterov=False,\n\
    warmup_iters=50, steps=(300, 500))\nlosses, thetas, dLdThetas = train_mini_batch(X,\
    \ Y, theta0,\noptimizer=optimizer, num_epochs=num_epochs-300, batch_size = 5)\n\
    plot_losses(losses)\nplot_thetas(thetas, losses)\n```\n```"
