- pgno: 147
  md: "Notably, the loss method selected is mean squared error (mse). The following\
    \ code snippet creates an optimizer called GD (gradient descent) to perform parameter\
    \ updates, given the learning rate and gradients:\n\n```\nclass GD():\n    def\
    \ __init__(self, lr):\n        self.lr = lr\n\n    def backward(self, theta, gradients):\n\
    \        theta = theta - self.lr*(gradients)\n        return theta\n```\n\nNext,\
    \ we must create a function to perform a training step given the X and Y data\
    \ (either in a batch or the whole epoch):\n\n```\ndef train_step(X, Y, theta,\
    \ optimizer):\n    # forward\n    Y_hat = forward(theta, X)\n    loss = mse(Y_hat,\
    \ Y)\n    dLdTheta = gradient(X, Y, Y_hat)\n    theta = optimizer.backward(theta,\
    \ dLdTheta)\n    return theta, loss, dLdTheta\n```\n\nNow that we know how to\
    \ perform the training per iteration (either batch or epoch), the following code\
    \ snippet helps us perform the training loop:\n\n```\ndef train(X, Y, theta0,\
    \ optimizer, num_epochs):\n    losses = []\n    thetas = []\n    dLdThetas = []\n\
    \    theta = theta0\n    for epoch in range(num_epochs):\n        theta, loss,\
    \ dLdTheta=train_step(X, Y, theta,optimizer)\n        thetas.append(theta)\n \
    \       losses.append(loss)\n        dLdThetas.append(dLdTheta)\n    return losses,\
    \ thetas, dLdThetas\n```"
