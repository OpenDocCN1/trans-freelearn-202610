  md: "To run the loaded model in an ONNX model, we first need to install the onnxruntime\
    \ package using the following statement:\n\n```\n!pip install onnxruntime\n```\n\
    \nOnce the runtime environment is ready, the following code snippet helps to create\
    \ an inference session and gets the input name for the loaded model:\n\n```\n\
    import onnxruntime as ort\nort_session = ort.InferenceSession(model_name)\ninput_name\
    \ = ort_session.get_inputs()[0].name\nprint(input_name)\n```\n\nThe previous code\
    \ snippet should display input_name as onnx::Gemm_0. This input name is important\
    \ for creating an input object for the loaded model while performing inferencing\
    \ on input data, as in the following code snippet:\n\n```\nimport numpy as np\n\
    X = np.array([[2, 3, 4, 5]])\noutputs = ort_session.run(\n    None,\n    {input_name:\
    \ X.astype(np.float32)},\n)\nprint(outputs[0])\n```\n\nThe previous code snippet\
    \ creates a batch input, X, with one instance of [2, 3, 4, 5] and performs prediction\
    \ on this input. This code snippet should display the result as [[0.15]]. To validate\
    \ the accuracy of the prediction, we can also perform prediction on the same input\
    \ using the original PyTorch model as follows:\n\n```\nX = torch.tensor([[2, 3,\
    \ 4, 5]], dtype=torch.float32)\nwith torch.no_grad():\n    y = pt_model(X)\n \
    \   print(y)\n```\n\nThis code snippet should display the same output ([[0.15]])\
    \ as the loaded ONNX model executed in the ONNX inference session."
