- pgno: 90
  md: "The output of this backbone (extracted features or feature maps) is the last\
    \ block called 'res4' of size 1x1024x50x50. Conceptually, each point in this feature\
    \ map corresponds to and is responsible for predicting and classifying bounding\
    \ boxes related to a region in the original images. In other words, these extracted\
    \ features correspond to 50x50 (2,500) regions in the original image. The following\
    \ code snippets illustrate this idea. First, we prepare a method to display images\
    \ in their original sizes:\n\n```\n```python\nimport numpy as np\nimport matplotlib.pyplot\
    \ as plt\n\n\ndef imshow(image):\n    dpi = plt.rcParams[\"figure.dpi\"]\n   \
    \ height, width = image.shape[:2]\n    figsize = width / float(dpi), height /\
    \ float(dpi)\n    fig = plt.figure(figsize=figsize)\n    plt.imshow(image)\n \
    \   plt.imshow(image)\n    plt.axis(\"off\")\n    plt.show()\n```\n```\n\nWe are\
    \ now ready to draw the center points for the centers of 2,500 regions that correspond\
    \ to the 50x50 extracted features:\n\n```\n```python\nfeature_h, feature_w = res4.shape[2:]\n\
    sub_sample = height/feature_h\nnew_img = img.copy()\n# the feature map points\
    \ and corresponding regions\nrect_w = 4\nrect_h = 4\nfor i in range(feature_h):\n\
    \    for j in range(feature_w):\n        center_x = sub_sample * j + sub_sample/2\n\
    \        center_y = sub_sample * i + sub_sample/2\n        start_x = int(center_x\
    \ - rect_w/2)\n        start_y = int(center_y - rect_h/2)\n        end_x = int(center_x\
    \ + rect_w/2)\n        end_y = int(center_y + rect_h/2)\n```\n```"
