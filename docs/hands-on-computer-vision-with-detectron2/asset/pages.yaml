  md: "The annotation filename has the same name as the image filename with the .xml\
    \ extension instead. Storing one XML file per image prevents having one large\
    \ file for all the annotations for a large image dataset. The following is the\
    \ annotation file (00003_154.xml) for one image in the demo dataset (00003_154.jpg):\n\
    \n```\n<annotation>\n    <folder></folder>\n    <filename>00003_154.jpg</filename>\n\
    \    <path>00003_154.jpg</path>\n    <source>\n        <database>annotationdemo</database>\n\
    \    </source>\n    <size>\n        <width>512</width>\n        <height>512</height>\n\
    \        <depth>3</depth>\n    </size>\n    <segmented>0</segmented>\n    <object>\n\
    \        <name>negative</name>\n        <pose>Unspecified</pose>\n        <truncated>0</truncated>\n\
    \        <difficult>0</difficult>\n        <occluded>0</occluded>\n        <bndbox>\n\
    \            <xmin>197</xmin>\n            <xmax>277</xmax>\n            <ymin>143</ymin>\n\
    \            <ymax>205</ymax>\n        </bndbox>\n    </object>\n</annotation>\n\
    ```\n\nObservably, this annotation file contains image information and annotation\
    \ objects. As shown in Figure 3.6, the image coordinate system is the same as\
    \ described previously for the COCO annotation format. It also has four numbers\
    \ for the bounding box: xmin, xmax, ymin, and ymax. In other words, the bounding\
    \ box is stored using the top-left and bottom-right coordinates in absolute pixel\
    \ values (instead of the top-left corner and width and height values)."
