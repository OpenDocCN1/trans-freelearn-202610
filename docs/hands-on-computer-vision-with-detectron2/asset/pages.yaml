    \                          batch_size = batch_size,\n                        \
    \  shuffle    = False,\n                          num_workers = num_workers,\n\
    \                          pin_memory  = True)\n```\n\nThis data loader loads\
    \ the data in batches because the input dataset might be too large to fit the\
    \ memory at one time. Therefore, we need to create a class to calculate the means\
    \ and standard deviations in a rolling/running manner.\n\n# Calculating the running\
    \ means and standard deviations\n\nThe formulas for calculating the mean (x̄)\
    \ and standard deviation (std) of a set of n values, if you have access to the\
    \ whole set of values, are straightforward:\n\nsum = Σᵢ₌₁ⁿ xᵢ\nx̄ = sum / n"
