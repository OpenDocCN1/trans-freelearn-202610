  md: "# Training custom segmentation models\n\nThe previous section described the\
    \ architecture of an object segmentation application that extends the object detection\
    \ application. Therefore, the training steps and configurations of these two applications\
    \ are similar. This section utilizes the source code provided in the Putting it\
    \ all together section in swswswswswswswsw. Ideally, we should perform all the\
    \ steps in that chapter to get a better set of hyperparameters for this specific\
    \ dataset. However, for simplicity, this section reuses all the source code as\
    \ it is and focuses on the differences for training object segmentation applications.\
    \ The following code snippet downloads the dataset prepared in the previous steps\
    \ with train and test sets:\n\n```\n!wget -q <url_to>/segbraintumors_coco.zip\n\
    !unzip -q segbraintumors_coco.zip\n```\n\nOnce the dataset is extracted, the source\
    \ code for Detectron2 installation, registering datasets, getting a training configuration,\
    \ building a custom trainer with COCO Evaluator and a custom hook for storing\
    \ the best model, training, and visualizations of the results is the same, except\
    \ a few points, as follows.\n\nThe configuration should set the pre-trained model\
    \ configuration and weights for object instance segmentation instead of object\
    \ detection:\n\n```\nconfig_file_url = \"<url_to>/mask_rcnn_R_50_FPN_3x.yaml\"\
    \ncheckpoint_url = \"<url_to>/mask_rcnn_R_50_FPN_3x.yaml\"\n```\n\nThe BestModelHook\
    \ class should use the segmentation evaluation metric (segm/AP50) for selecting\
    \ the best model instead of the object detection evaluation metric (bbox/AP50):\n\
    \n```\nclass BestModelHook(HookBase):\n    def __init__(self, cfg,\n        metric\
    \ = \"segm/AP50\",\n        min_max =\"max\"):\n        # other lines remain the\
    \ same\n```\n\nThe preceding code snippet changes the default evaluation metric,\
    \ and the following code snippet changes it when creating a new hook instance:\n\
    \n```\nbm_hook = BestModelHook(cfg,\n        metric = \"segm/AP50\",\n       \
    \ min_max = \"max\")\n```"
