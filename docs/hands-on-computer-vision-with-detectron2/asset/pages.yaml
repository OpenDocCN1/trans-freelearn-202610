    ```\n\nThis code snippet gives the following output:\n\n```\ntensor([[ -0.1100]],device='cuda:0')\n\
    ```\n\nObservably, this is a different output compared to the prediction of the\
    \ original PyTorch model because the execution path is for the dummy input (dummy_X)\
    \ and not this current X input. Therefore, in this case, the scripting approach\
    \ should be used.\n\n# Exporting PyTorch models using the scripting method\n\n\
    Continuing with the code in the previous section; the following code snippet exports\
    \ the PyTorch model to TorchScript using the scripting method:\n\n```\nscripted_model\
    \ = torch.jit.script(pt_model)\nprint(scripted_model.code)\n```\n\nThis snippet\
    \ should display the TorchScript code for the exported model as follows:\n\n```\n\
    def forward(self,\n    x: Tensor) -> Tensor:\n    linear = self.linear\n    y\
    \ = (linear).forward(x, )\n    if bool(torch.gt(torch.sum(y), 0)):\n        _0\
    \ = y\n    else:\n        _0 = torch.neg(y)\n    return _0\n```\n\nObservably,\
    \ this is different from the tracing approach as the TorchScript code of the exported\
    \ model now contains the control flow section. Additionally, the following code\
    \ snippet should display the parameters of the exported model (as 0.01 for all\
    \ parameters):\n\n```\nfor p in scripted_model.parameters():\n    print(p.data)\n\
    ```"
