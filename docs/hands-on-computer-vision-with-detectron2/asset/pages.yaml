  md: "This code snippet randomly selects a value from the specified list of lengths\
    \ and then resizes the shorter side of the input to this sampled length. If the\
    \ longer side of the output is larger than 1,333, it continues to resize the image\
    \ (while keeping the aspect ratio) to ensure that it does not exceed this number.\n\
    \nThe RandomCrop and CategoryAreaConstraint classes take crop_type, crop_size,\
    \ single_category_max_area, and ignored_category as input parameters. The first\
    \ two parameters are similar to those in the RandomCrop class. However, this class\
    \ searches for a cropping area in which no single category occupies a ratio larger\
    \ than the value specified for single_category_max_area for semantic segmentation.\
    \ This value is specified in 0 to 1 as ratios (set to 1.0 to disable this feature).\
    \ The last parameter sets the category's id, which does not have to follow this\
    \ constraint. Note that this function applies a best-effort strategy. It only\
    \ tries, at most, 10 times to achieve the specified conditions. The following\
    \ code snippet illustrates the usage pattern of this class:\n\n```\ncac_aug =\
    \ T.RandomCrop_CategoryAreaConstraint(\n    crop_type                = \"relative\"\
    ,\n    crop_size                = (0.5, 0.5),\n    single_category_max_area =\
    \ 0.5,\n    ignored_category         = None\n)\nsem_seg = np.zeros(img.shape[:2])\n\
    cac_tfm = cac_aug.get_transform(img, sem_seg=sem_seg)\ncac_img = cac_tfm.apply_image(img)\n\
    cac_boxes = cac_tfm.apply_box(boxes)\nvisualize_image_boxes(cac_img, cac_boxes)\n\
    ```\n\nNote that besides the input image, the sem_seg parameter of the get_transform\
    \ method is required because this class is used for semantic segmentation. Thus,\
    \ this code snippet creates a fake semantic segmentation mask that only contains\
    \ all zeros for illustration purposes."
