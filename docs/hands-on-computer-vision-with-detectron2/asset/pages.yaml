  md: "Furthermore, we can use the exported model to perform a prediction on the X\
    \ input prepared previously to inspect the result:\n\n```\nscripted_model.to(device)\n\
    with torch.no_grad():\n    y = scripted_model(X)\n    print(y)\n```\n\nThe prediction\
    \ result should be exactly the same as what was produced by the original model\
    \ (tensor([[0.1100]], device='cuda:0')). Additionally, we can save the model to\
    \ the hard drive, load it back, display the parameter values for the loaded models,\
    \ perform the prediction, and verify the result again:\n\n```\n# save\nscripted_model.to(\"\
    cpu\").save(\"scripted_model.pt\")\n# load\nloaded_model = torch.jit.load(\"scripted_model.pt\"\
    )\n# loaded parameters\nfor p in loaded_model.parameters():\n    print(p)\n# prediction\n\
    loaded_model.to(device)\nloaded_model(X)\n```\n\nYou may also download these models\
    \ for future use if you are running this notebook on Google Colab:\n\n```\nfrom\
    \ google.colab import files\nfiles.download('scripted_model.pt')\nfiles.download('pt_model.pt')\n\
    ```\n\nThe tracing and scripting approaches have their strengths and weaknesses.\
    \ The following section introduces the mixed approach to leverage the best of\
    \ both.\n\n# Mixing tracing and scripting approaches\n\nThe tracing approach is\
    \ simple and straightforward but does not properly record the models containing\
    \ control flows and loops. The scripting approach can mitigate this limitation\
    \ of the tracing approach. However, its supported syntax/code might be limited.\
    \ Therefore, combining the two approaches may be beneficial in several cases."
