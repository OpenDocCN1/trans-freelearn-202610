    \ of the `inverse` method returns the current object of this class (`self`).\n\
    +   - **The ResizeTransform class** is one of the most commonly used transformations\
    \ because other transformations and deep learning models often require images\
    \ to be the same size. In contrast, input images may come in different sizes.\
    \ This transformation accepts the original image height and width (`h`, `w`),\
    \ the expected height and width (`new_h`, `new_w`), and the interpolation method\
    \ (`interp`) and performs the resize accordingly.\n+   - **The ExtentTransform\
    \ class**: This class takes a subregion (`sub_rect`) of an input image (in `XYXY_ABS`\
    \ format), the expected output size (`h`, `w`), and the interpolation method (`interp`)\
    \ and resizes the subtracted region into the expected size using the given interpolation\
    \ method. Additionally, if any input subregion sizes are larger than the input\
