- pgno: 196
  md: "The Augmentation class is the base class for all augmentation classes to extend.\
    \ There are two important methods to note: get_transform(self, *args) and __call__(self,\
    \ aug_input). All its subclasses override the get_transform method to accept a\
    \ list of named input parameters and generate a transformation object. This list\
    \ of parameters should have names acceptable by AugInput (which we’ll learn about\
    \ in the next section). The __call__ method enables its subclasses to work with\
    \ AugInput directly (more on this in the next section).\n\nThe FixedSizeCrop class\
    \ takes a crop_size as a tuple (height, width) to crop for that region from the\
    \ original input randomly. If this size is larger than the original image, it\
    \ checks whether the pad option is True. If it is, it pads the input image and\
    \ segmentation with pad_value and seg_pad_value, respectively, to the right and\
    \ bottom (the original image is always in the top-left corner). This class helps\
    \ produce inputs of the same size, which deep learning models often require. The\
    \ following code snippet illustrates the use of this augmentation class:\n\n```\n\
    fsc_aug = T.FixedSizeCrop(crop_size = (300, 300), pad=True,\n pad_value=128)\n\
    fsc_tfm = fsc_aug.get_transform(img)\nfsc_img = fsc_tfm.apply_image(img)\nfsc_boxes\
    \ = fsc_tfm.apply_box(boxes)\nvisualize_image_boxes(fsc_img, fsc_boxes)\n```\n\
    \nFirst, this snippet initiates the crop size and sets the padding options, then\
    \ gets a transformation object using the get_transform method. This object can\
    \ then be used as a deterministic transformation object, as discussed in the previous\
    \ section. In other words, it crops the same region from different inputs. Additionally,\
    \ applying this same transformation to inputs with different sizes will not work\
    \ properly:\n\n![](img/0e7994c850a84b7a53d34c7f943c7edd_196_0.png)\n\nOriginal\
    \ image and ground-truth box\n\n![](img/0e7994c850a84b7a53d34c7f943c7edd_196_1.png)\n\
    \nCropped versions\n\nFigure 8.11: Original image and the ground-truth box and\
    \ their cropped versions"
  merge: -1
  img_proc: true
- pgno: 197
  md: "**The RandomApply class** takes the input parameters as an instance of the\
    \ Transform or Augmentation class (`tfm_or_aug`) and a probability (`prob`, which\
    \ has a default as 0.5) of whether or not to perform such a transformation or\
    \ augmentation. The following code snippet illustrates the use of this class:\n\
    \n```\nra_aug = T.RandomApply(fsc_tfm, prob = 0.3)\nra_fsc_tfm = ra_aug.get_transform()\n\
    ra_fsc_img = ra_fsc_tfm.apply_image(img)\nra_fsc_boxes = ra_fsc_tfm.apply_box(boxes)\n\
    visualize_image_boxes(ra_fsc_img, ra_fsc_boxes)\n```\n\nIf we run this whole snippet\
    \ several times (getting different Transform objects at other runs), then some\
    \ of them might be cropped (as in the right of Figure 8.11), while some might\
    \ not (kept the same input as in the left of Figure 8.11).\n\n**The RandomCrop\
    \ class** takes `crop_type` and `crop_size` as input parameters. Let’s look at\
    \ the different `crop_type` values and how they work:\n\n+   - \"relative\": `crop_size`\
    \ must be in the range of (0, 1] (normalized by the image size, HxW). Then, it\
    \ crops a random region in the image whose size is H*crop_size[0], W*crop_size[1].\n\
    +   - \"relative_range\": `crop_size[0]` is assigned with a uniformly random sampled\
    \ value from [crop_size[0], 1]; the same is done for `crop_size[1]`. The new `crop_size`\
    \ is then used as `crop_type = \"relative\"`.\n+   - \"absolute\": `crop_size`\
    \ must be smaller than the input image’s size. It crops a random region in the\
    \ image whose size is `crop_size[0]`, `crop_size[1]`.\n+   - \"absolute_range\"\
    : `crop_size[0]` is assigned with a uniformly random sampled value from its current\
    \ value and the image height ([crop_size[0], H]); the same is done for `crop_size[1]`.\
    \ The new `crop_size` is then used as `crop_type = \"absolute\"`.\n\nThe following\
    \ code snippet illustrates the usage of this class:\n\n```\nrc_aug = T.RandomCrop(\n\
    \    crop_type=\"relative\",\n    crop_size=(0.5, 0.5))\nrc_tfm = rc_aug.get_transform(img)\n\
    rc_img = rc_tfm.apply_image(img)\nrc_boxes = rc_tfm.apply_box(boxes)\nvisualize_image_boxes(rc_img,\
    \ rc_boxes)\n```"
  merge: -1
  img_proc: true
- pgno: 198
  md: "The RandomExtent class takes input parameters as tuples of size two for scale_range\
    \ and shift_range. The former helps decide the size of the cropping subregion,\
    \ while the latter helps determine the location to extract the subregion from.\
    \ Specifically, the scale_range tuple specifies a range with low (l) and high\
    \ (h) values, where a value (r) is uniformly sampled from this range; then, the\
    \ output image's size is r*H and r*W (where H and W are the height and width of\
    \ the input image, respectively). The second parameter, shift_range, is another\
    \ tuple of size two, (x, y). Two random values (x_shift and y_shift) are uniformly\
    \ sampled from the [-x, x] and [-y, y] ranges; then, the cropped region is also\
    \ shifted by x_shift*W/2 and y_shift*H/2 around the center of the input image.\
    \ The following code snippet illustrates the usage pattern of this class:\n\n\
    ```\nre_aug = T.RandomExtent(\n    scale_range=(0.5, 0.9),\n    shift_range=(0.3,\
    \ 0.3))\nre_tfm = re_aug.get_transform(img)\nre_img = re_tfm.apply_image(img)\n\
    re_boxes = re_tfm.apply_box(boxes)\nvisualize_image_boxes(re_img, re_boxes)\n\
    ```\n\nFigure 8.12 shows some sample output for this code snippet (right) and\
    \ the original input (left). As we can see, in the original input (left), a dashed\
    \ box has been placed in the center of the input image. The shift_range parameter\
    \ dictates this box size. A random point within this box is selected to place\
    \ the center of the cropping region. The scale_range parameter decides the size\
    \ of the cropping region (solid box):\n\n![](img/0e7994c850a84b7a53d34c7f943c7edd_198_0.png)\n\
    \n![](img/0e7994c850a84b7a53d34c7f943c7edd_198_1.png)\n\nFigure 8.12: Original\
    \ image and the ground-truth box and their random-extent versions"
  merge: -1
  img_proc: true
- pgno: 199
  md: "**The RandomFlip class** takes a probability (`prob`) and two Boolean values\
    \ (`horizontal` and `vertical`). The `prob` parameter is used to decide whether\
    \ or not to perform flipping; if the outcome is to flip, the other two decide\
    \ to flip horizontally and vertically. The following code snippet illustrates\
    \ the usage of this class:\n\n```\nrf_aug = T.RandomFlip(prob        = 0.5,\n\
    \                    horizontal = True,\n                    vertical   = False)\n\
    rf_tfm = rf_aug.get_transform(img)\nrf_img = rf_tfm.apply_image(img)\nrf_boxes\
    \ = rf_tfm.apply_box(boxes)\nvisualize_image_boxes(rf_img, rf_boxes)\n```\n\n\
    When running this code snippet, as a whole, several times, about 50% of the time,\
    \ the input flips horizontally, and the input never flips vertically.\n\n**The\
    \ RandomRotation class** takes `angle`, `expand`, `center`, `sample_style`, and\
    \ `interp` as its input parameters. The `expand` parameter decides if it should\
    \ expand the output size so that it fits the rotated image size. The `sample_style`\
    \ parameter can either be \"range\" or \"choice\".\n\nIf it is \"range\" (default),\
    \ the following occurs:\n\n+   - The `angle` parameter is in a range of `[min,\
    \ max]` values in degrees to uniformly sample one value for rotation\n+   - The\
    \ `center` parameter is a `[[minx, miny], [maxx, maxy]]` relative interval from\
    \ which to sample the center, with `[0, 0]` being the top left of the image and\
    \ `[1, 1]` being the bottom right\n\nIf it is \"choice\", the following occurs:\n\
    \n+   - The `angle` parameter is a list of values to choose from for rotation\n\
    +   - The `center` parameter is None, meaning the center of the rotation is that\
    \ of the input image\n\nThe following code snippet illustrates the usage pattern\
    \ of this class:\n\n```\nrr_aug = T.RandomRotation(\n        angle        = [-30,\
    \ 30],\n        sample_style = \"range\",\n        center       = [[0.4, 0.6],\
    \ [0.4, 0.6]],\n        expand       = False\n        )\nrr_tfm = rr_aug.get_transform(img)\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 200
  md: "```\n```python\nrr_img = rr_tfm.apply_image(img)\nrr_boxes = rr_tfm.apply_box(boxes)\n\
    visualize_image_boxes(rr_img, rr_boxes)\n```\n```\n\nThis snippet randomly samples\
    \ a value between -30 and 30 degrees and another value around the center to rotate\
    \ the input data\n\n**The Resize class** is pretty straightforward. It takes the\
    \ target size (`shape=(height, width)`) and the interpolation method (`interp`)\
    \ as input parameters. Its `get_transform(image)` method returns a `ResizeTransform`\
    \ object to resize the input image and related annotations into the target size.\
    \ The following code snippet illustrates the usage of this class:\n\n```\n```python\n\
    rs_aug = T.Resize(\n        shape=(640, 640)\n)\nrs_tfm = rs_aug.get_transform(img)\n\
    rs_img = rs_tfm.apply_image(img)\nrs_boxes = rs_tfm.apply_box(boxes)\nvisualize_image_boxes(rs_img,\
    \ rs_boxes)\n```\n```\n\nThis code snippet resizes the input image into a fixed\
    \ target size. This is a commonly used image preprocessing step because neural\
    \ networks often require inputs of the same size. However, this technique does\
    \ not retain the aspect ratios of the inputs if the target has a different ratio.\n\
    \n**The RandomResize class** takes `shape_list` and `interp` as input parameters.\
    \ It resizes the input to one item, `(h, w)`, sampled from `shape_list` using\
    \ the given interpolation method (`interp`). The following code snippet illustrates\
    \ the usage pattern of this class:\n\n```\n```python\nrrs_aug = T.RandomResize(\n\
    \        shape_list=[(320, 320), (640, 640)]\n)\nrrs_tfm = rrs_aug.get_transform(img)\n\
    rrs_img = rrs_tfm.apply_image(img)\nrrs_boxes = rrs_tfm.apply_box(boxes)\nvisualize_image_boxes(rrs_img,\
    \ rrs_boxes)\n```\n```"
