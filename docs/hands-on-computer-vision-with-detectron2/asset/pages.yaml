    Thus, out of 37,500 anchors, 42 are positive, and 214 are negative. These 256
    anchors contribute to the loss calculation (training), and the rest are ignored.
    Now, the RPN loss calculation is the weighted contributions between the classification
    loss (based on negative and positive labels of the sampled anchors and their respective
    predictions) and the regression loss (based on the ground-truth bounding box locations
    and their respective predicted anchor deltas). After all the previous steps, the
    next task of the RPN is to make the proposals. The following sections inspect
    the way RPN proposes regions.


    # Proposal predictions


    The proposal prediction step has a new concept called Non-Maximum Suppression
    (NMS). Specifically, there can be multiple proposals made for one ground-truth
    box. These proposals may overlap in a large area and have different objectness
    scores. Figure 4.10 shows an example of why NMS is necessary. Specifically, two
    proposals (dashed boxes) are made for one ground-truth box (solid one). Observably,
    these two proposals have a large overlapping area, and it is a good idea to remove
    one and keep another one with a higher objectness score (higher confidence).


    ![](img/0e7994c850a84b7a53d34c7f943c7edd_100_0.png)


    Figure 4.10: A ground-truth label (solid box) and multiple proposals (dashed boxes)'
