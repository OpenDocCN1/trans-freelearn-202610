    Due to the recent development of YOLO (You Only Look Once), YOLO data annotation
    is another popular data format. Similar to the PASCAL VOC annotation style, the
    dataset has one annotation file per image. However, the annotation file extension
    is .txt instead.


    A dataset is organized into two subfolders, one for images (images) and one for
    annotations (labels). These subfolders might be further divided into the train
    (train), test (test), and validation (val) subfolders. There is also a text file
    called classes.txt (or possibly a *.yaml file) that declares the classes or labels
    for this dataset, one per line. The following is the content of the classes.txt
    file for our simple demo dataset with two classes:


    ```

    negative

    positive

    ```'
