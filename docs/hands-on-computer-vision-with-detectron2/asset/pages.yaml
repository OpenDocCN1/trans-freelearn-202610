- pgno: 104
  md: "# The pooler\n\nProposals have different sizes, and the neural networks in\
    \ the next steps require input features of a common size. Therefore, there must\
    \ be a way to crop the extracted features into the same size before feeding to\
    \ the prediction step. The pooler component helps perform this task. The following\
    \ code snippet displays further information about the pooler:\n\n```\n```python\n\
    print(roi_head.pooler)\n```\n```\n\nThis code snippet should display the following\
    \ output:\n\n```\n```text\nROIPooler(\n    (level_poolers): ModuleList(\n    \
    \    (0): ROIAlign(output_size=(14, 14), spatial_scale=0.0625,\n        sampling_ratio=0,\
    \ aligned=True)\n    )\n)\n```\n```\n\nThis pooler is an instance of the ROIPooler\
    \ class, which implements the ROIAlign (Region of Interest Version 2). Generally,\
    \ the proposals are specified in the original input image coordinates (800×800\
    \ in this case). These coordinates are first translated into the extracted features’\
    \ size (width×height = 50×50 in this case). Therefore, the spatial scale is 0.0625\
    \ (spatial_scale = 50/800).\n\nAdditionally, the output size for all proposals\
    \ is specified as 14×14. In ROIAlignV2, after translating the proposal area into\
    \ the corresponding area in the feature map, this mapped area is divided by a\
    \ grid of size 14 by 14. Each grid cell is then interpolated (e.g., using the\
    \ bilinear interpolation method) by four points. The aligned=True option means\
    \ the pixel coordinate is shifted by 0.5 pixels. Half a pixel is not significant\
    \ in the original image. Still, in the small feature map resolution, it is substantial\
    \ and helps to improve accuracy (especially in the case of instance segmentation,\
    \ which we will learn about later). The following code snippet generates the pooler\
    \ data:\n\n```\n```python\nx = roi_heads.pooler([res4], [proposals[0].proposal_boxes])\n\
    print(x.shape)\n```\n```\n\nThis code snippet should display a tensor of size\
    \ (1000, 1024, 14, 14) for 1,000 proposals; each has 1,024 channels of 14 by 14\
    \ resolution.\n\nAfter having features for all the proposals of the same size,\
    \ these proposals undergo another block of convolution layers (called res5) to\
    \ extract features at further depths. The following code snippet performs this\
    \ salient feature extraction:\n\n```\n```python\nbox_features = roi_heads.res5(x)\n\
    print(box_features.shape)\n```\n```"
