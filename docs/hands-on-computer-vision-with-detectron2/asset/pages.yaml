  md: 'Specifically, it is *faster* and more accurate because while reimplementing
    the cutting-edge algorithms, there is the chance that Detectron2 will find suboptimal
    implementation parts or obsolete features from older versions of these algorithms
    and re-implement them. It is *modular*, or it divides its implementation into
    sub-parts. The parts include the input data, backbone network, region proposal
    heads, and prediction heads (the next section covers more information about these
    components). It is *customizable*, meaning its components have built-in implementations,
    but they can be customized by calling new implementations. Finally, it is built
    on top of PyTorch, meaning that many developer resources are available online
    to help develop applications with Detectron2.


    Furthermore, Detectron2 provides *pre-trained models* with state-of-the-art detection
    results for CV tasks. These models were trained with many images on high computation
    resources at the Facebook research lab that might not be available in other institutions.


    These pre-trained models are published on its Model Zoo and are free to use: https://github.com/facebookresearch/detectron2/blob/main/MODEL_ZOO.md.


    These pre-trained models help developers develop typical CV applications quickly
    without collecting, preparing many images, or requiring high computation resources
    to train new models. However, suppose there is a need for developing a CV task
    on a specific domain with a custom dataset. In that case, these existing models
    can be the starting weights, and the whole Detectron2 model can be trained again
    on the custom dataset.


    Finally, we can convert Detectron2 models into *deployable artifacts*. Precisely,
    we can convert Detectron2 models into standard file formats of standard deep learning
    frameworks such as `TorchScript`, `Caffe2 protobuf`, and `ONNX`. These files can
    then be deployed to their corresponding runtimes, such as PyTorch, Caffe2, and
    ONNX Runtime. Furthermore, Facebook AI Research also published **Detectron2Go
    (D2Go)**, a platform where developers can take their Detectron2 development one
    step further and create models optimized for mobile devices.


    In summary, Detectron2 implements cutting-edge detection algorithms with the advantage
    of being fast, accurate, modular, and built on top of PyTorch. Detectron2 also
    provides pre-trained models so users can get started and quickly build CV applications
    with state-of-the-art results. It is also customizable, so users can change its
    components or train CV applications on a custom business domain. Furthermore,
    we can export Detectron2 into scripts supported by standard deep learning framework
    runtimes. Additionally, initial research called Detectron2Go supports developing
    Detectron2 applications for edge devices.


    In the next section, we will look into Detectron2 architecture to understand how
    it works and the possibilities of customizing each of its components.'
  merge: -1
  img_proc: true
- pgno: 27
  md: "# Detectron2 architecture\n\n![](img/0e7994c850a84b7a53d34c7f943c7edd_27_0.png)\n\
    \nFigure 1.2: The main components of Detectron2\n\nDetectron2 has a modular architecture.\
    \ Figure 1.2 depicts the four main modules in a standard Detectron2 application.\
    \ The first module is for registering input data (Input Data).\n\nThe second module\
    \ is the backbone to extract image features (Backbone), followed by the third\
    \ one for proposing regions with and without objects to be fed to the next training\
    \ stage (Region Proposal). Finally, the last module uses appropriate heads (such\
    \ as detection heads, instance segmentation heads, keypoint heads, semantic segmentation\
    \ heads, or panoptic heads) to predict the regions with objects and classify detected\
    \ objects into classes. Chapter 3 to Chapter 5 discuss these components for building\
    \ a CV application for object detection tasks, and Chapter 10 and Chapter 11 detail\
    \ these components for segmentation tasks. The following sections briefly discuss\
    \ these components in general.\n\n# The input data module\n\nThe input data module\
    \ is designed to load data in large batches from hard drives with optimization\
    \ techniques such as caching and multi-workers. Furthermore, it is relatively\
    \ easy to plug data augmentation techniques into a data loader for this module.\
    \ Additionally, it is designed to be customizable so that users can register their\
    \ custom datasets. The following is the typical syntax for assigning a custom\
    \ dataset to train a Detectron2 model using this module:\n\n```\nDatasetRegistry.register(\n\
    \    'my_dataset',\n    load_my_dataset\n)\n```"
  merge: -1
  img_proc: true
- pgno: 28
  md: "# The backbone module\n\nThe backbone module extracts features from the input\
    \ images. Therefore, this module often uses a cutting-edge convolutional neural\
    \ network such as ResNet or ResNeXt. This module can be customized to call any\
    \ standard convolutional neural network that performs well in an image classification\
    \ task of interest. Notably, this module has a great deal of knowledge about transfer\
    \ learning. Specifically, we can use those pre-trained models here if we want\
    \ to use a state-of-the-art convolution neural network that works well with large\
    \ image datasets such as ImageNet. Otherwise, we can choose those simple networks\
    \ for this module to increase performance (training and prediction time) with\
    \ the accuracy trade-off. Chapter 2 will discuss selecting appropriate pre-trained\
    \ models on the Detectron2 Model Zoo for common CV tasks.\n\nThe following code\
    \ snippet shows the typical syntax for registering a custom backbone network to\
    \ train the Detectron2 model using this module:\n\n```\n@BACKBONE_REGISTRY.register()\n\
    class CustomBackbone(Backbone):\n    pass\n```\n\n# The region proposal module\n\
    \nThe next module is the region proposal module (Region Proposal). This module\
    \ accepts the extracted features from the backbone and predicts or proposes image\
    \ regions (with location specifications) and scores to indicate whether the regions\
    \ contain objects (with objectness scores). The objectness score of a proposed\
    \ region may be 0 (for not having an object or being background) or 1 (for being\
    \ sure that there is an object of interest in the predicted region). Notably,\
    \ this object score is not about the probability of being a class of interest\
    \ but simply whether the region contains an object (of any class) or not (background).\n\
    \nThis module is set with a default Region Proposal Network (RPN). However, replacing\
    \ this network with a custom one is relatively easy. The following is the typical\
    \ syntax for registering a custom RPN to train the Detectron2 model using this\
    \ module:\n\n```\n@ROI_BOX_HEAD_REGISTRY.register()\nclass CustomBoxHead(nn.Module):\n\
    \    pass\n```"
  merge: -1
  img_proc: true
- pgno: 29
  md: "# Region of interest module\n\nThe last module is the place for the region\
    \ of interest (RoI) heads. Depending on the CV tasks, we can select appropriate\
    \ heads for this module, such as detection heads, segmentation heads, keypoint\
    \ heads, or semantic segmentation heads. For instance, the detection heads accept\
    \ the region proposals and the input features of the proposed regions and pass\
    \ them through a fully connected network, with two separate heads for prediction\
    \ and classification. Specifically, one head is used to predict bounding boxes\
    \ for objects, and another is for classifying the detected bounding boxes into\
    \ corresponding classes.\n\nOn the other hand, semantic segmentation heads also\
    \ use convolutional neural network heads to classify each pixel into one of the\
    \ classes of interest. The following is the typical syntax for registering custom\
    \ region of interest heads to train the Detectron2 model using this module:\n\n\
    ```\n@ROI_HEAD_REGISTRY.register()\nclass CustomHeads(StandardROIHeads):\n   \
    \ pass\n```\n\nNow that you have an understanding of Detectron2 and its architecture,\
    \ let's prepare development environments for developing Detectron2 applications.\n\
    \n# Detectron2 development environments\n\nNow, we understand the advanced CV\
    \ tasks and how Detectron2 helps to develop applications for these tasks. It is\
    \ time to start developing Detectron2 applications. This section provides steps\
    \ to set up Detectron2 development environments on the cloud using Google Colab,\
    \ a local environment, or a hybrid approach connecting Google Colab to a locally\
    \ hosted runtime.\n\n# Cloud development environment for Detectron2 applications\n\
    \nGoogle Colab or Colaboratory (https://colab.research.google.com) is a cloud\
    \ platform that allows you to write and execute Python code from your web browser.\
    \ It enables users to start developing deep learning applications with zero configuration\
    \ because most common machine learning and deep learning packages, such as PyTorch\
    \ and TensorFlow, are pre-installed. Furthermore, users will have access to GPUs\
    \ free of charge. Even with the free plan, users have access to a computation\
    \ resource that is relatively better than a standard personal computer. Users\
    \ can pay a small amount for Pro or Pro+ with higher computation resources if\
    \ needed. Additionally, as its name indicates, it is relatively easy to collaborate\
    \ on Google Colab, and it is easy to share Google Colab files and projects.\n\n\
    Deep learning models for CV tasks work with many images; thus, GPUs significantly\
    \ speed up the training and inferencing time. However, by default, Google Colab\
    \ does not enable GPUs' runtime. Therefore, users should enable the GPU hardware\
    \ accelerator before installing Detectron2 or training Detectron2 applications.\
    \ This step is to select GPU from the Hardware accelerator drop-down menu found\
    \ under Runtime | Change runtime type, as shown in Figure 1.3:"
  merge: -1
  img_proc: true
