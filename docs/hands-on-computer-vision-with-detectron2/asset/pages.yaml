- pgno: 141
  md: '# Understanding Detectron2’s solvers


    We should try two obvious fine-tuning techniques: changing the backbone network
    and increasing the batch size. As indicated in the Detectron2 Model Zoo (introduced
    in Chapter 3), the backbone we selected in Chapter 5 is the simplest one (ResNet50),
    with a low mAP@0.5 on the pre-trained dataset. It is lightweight and fast to train
    and infer, so we have been using it for our experiments using a free Google Colab
    plan. If computation resources are available, selecting a more powerful backbone,
    such as X101FPN, on the Detectron2 Model Zoo would be beneficial. However, in
    this section, we will keep this simple backbone model and experiment with the
    settings and types of optimizers. These are standard hyperparameters because they
    apply to deep learning in general.


    Understanding the available optimizers and their related hyperparameters is essential
    to understanding the configuration parameters Detectron2 offers for fine-tuning
    models. This section briefly covers common types of optimizers in deep learning.


    # Gradient descent


    Gradient descent is one of the most essential concepts when it comes to training
    deep neural networks. Typically, while training neural networks, there is a cost
    (loss) function ($L$) that we need to optimize (minimize) concerning the model
    parameters ($W$). We use calculus to perform this optimization by getting the
    derivative of the loss function for the parameters, setting them to zero, and
    getting the optimal results. However, in complicated deep neural networks (as
    they often are), it is hard (or even impossible) to solve this equation. Therefore,
    it is more appropriate to use numerical approximations. *Figure 6.4* illustrates
    this idea using a simple loss function with one parameter:


    ![](img/0e7994c850a84b7a53d34c7f943c7edd_141_0.png)


    Figure 6.4: Example of gradient descent steps'
  merge: -1
  img_proc: true
- pgno: 142
  md: "Specifically, the loss function is $L(w) = w^2 - 4w + 5$, and its derivative\
    \ is $\\nabla L(w) = 2w - 4$. The gradient descent algorithm for this case is\
    \ simple:\n\n```\nInitialize w with a random value\nfor e in range(num_epochs):\n\
    \    update  w = w - η ∇L(w)\n```\n\nHere, num_epochs is the number of steps to\
    \ perform training, and the learning rate ($η$) dictates how much the parameter,\
    \ $w$, updates its value at each training step concerning the derivative of the\
    \ loss function. These are the two essential hyperparameters of the gradient descent\
    \ algorithm.\n\nFor instance, the current parameter, $w$, is 4, and the selected\
    \ learning rate is $η = 0.1$. The tangent line (dashed line) for this loss function\
    \ has a slope that is the derivative of $∇L(4) = 4$. At this point, $w$ should\
    \ move to the left of the value – that is, $w = 3.6$. Similarly, the following\
    \ steps should correspond to $w = 3.28, 3.024$, and so on. If we keep doing this,\
    \ the loss function will eventually converge to the optimal point, given the step\
    \ size is small enough. Notably, when the magnitude of the derivative of the loss\
    \ function becomes small, the step size becomes small too.\n\nAt this point, the\
    \ question is how to select the number of epochs to train and the learning rate.\
    \ Generally, choosing a small learning rate makes the learning process slow, and\
    \ it takes a long time for the model to converge. On the other hand, having a\
    \ significant learning rate may lead to issues such as the $w$ parameter flickering\
    \ left and right and not converging.\n\nLet’s take a simple code approach to demonstrate\
    \ these ideas. The following code snippet defines the loss function (calculated\
    \ on the training data) and its corresponding derivative:\n\n```\ndef L(w):\n\
    \    return w**2 - 4*w + 5\ndef dL(w):\n    return 2*w - 4\n```\n\nThe following\
    \ code snippet prepares a simple function to simulate the training process with\
    \ the initial value for the training weight (w0), learning rate (lr), and number\
    \ of epochs (num_epochs):\n\n```\ndef train(w0, lr, num_epochs):\n    ws, Ls =\
    \ [], [], w0\n    for e in range(num_epochs):\n        Ls.append(L(w))  # loss\n\
    \        ws.append(w)  # weight\n        dLw = dL(w)  # gradient\n        w =\
    \ w - lr*dLw  # update\n    return ws, Ls\n```"
  merge: -1
  img_proc: true
- pgno: 143
  md: "This function returns a list of the weights over time and their corresponding\
    \ losses. The following code snippet then receives these two lists and visualizes\
    \ the changes over the training process:\n\n```\n```python\n# import statements\
    \ for matplotlib and numpy\ndef visualize(ws, Ls):\n    w_range = np.linspace(-0.5,\
    \ 4.5, 100)\n    L_range = [L(w) for w in w_range]\n    plt.plot(w_range, L_range)\n\
    \    plt.scatter(ws, Ls)\n    plt.plot(ws, Ls)\n    plt.scatter(ws,[0]*len(ws))\n\
    \    ax = plt.gca()\n    msg = f'lr={lr}\\nnum_epochs={num_epochs}'\n    plt.text(0.6,\
    \ 0.95, msg,\n        horizontalalignment='left',\n        verticalalignment='top',\n\
    \        transform = ax.transAxes)\n    plt.show()\n```\n```\n\nFinally, the following\
    \ code snippet produces the experiment for a specific set of hyperparameters (assuming\
    \ w0=4.0):\n\n```\n```python\nnum_epochs = 20\nlr = 0.1\nws, Ls = train(w0, lr,\
    \ num_epochs)\nvisualize(ws, Ls)\n```\n```\n\n*Figure 6.5* shows the changes in\
