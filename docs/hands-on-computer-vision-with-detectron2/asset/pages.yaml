- pgno: 224
  md: "This section covered the steps to apply image augmentations to the training\
    \ process. In many cases, similar techniques can be utilized at test time to improve\
    \ accuracy, and the following section covers these techniques and shows you how\
    \ to apply test time augmentations.\n\n# Applying test-time image augmentation\
    \ techniques\n\n**Test-time augmentations (TTA)** can improve prediction performance\
    \ by providing different versions of the input image for predictions and performing\
    \ **non-maximum suppression (NMS)** on the resulting predictions. Detectron2 provides\
    \ two classes for this: `DatasetMapperTTA` and `GeneralizedRCNNWithTTA`. The `DatasetMapperTTA`\
    \ class helps to map a dataset dictionary (a data item in JSON format) into the\
    \ format expected by Detectron2 models with the opportunity to perform augmentations.\
    \ The default augmentations used are `ResizeShortestEdge` and `RandomFlip`. The\
    \ `GeneralizedRCNNWithTTA` class takes the original model and the `Mapper` object\
    \ as inputs. It performs predictions on the augmented data and preprocesses the\
    \ resulting outputs.\n\nLet us use the code approach to explain these two classes.\
    \ As a routine, we first install Detectron2, load the brain tumors dataset, and\
    \ register the test dataset. Next, the following code snippet gets a pre-trained\
    \ model:\n\n```\n```python\noutput_path = \"output/object_detector_hook/\"\n!wget\
    \ --quiet <url_to/Chapter08/object_detector_hook.zip>\n!unzip --q object_detector_hook.zip\n\
    !unzip -q {output_path}/model_best.pth.zip\n```\n```\n\nThe following code snippet\
    \ loads the pre-trained model configuration:\n\n```\n```python\n# get a configuration\n\
    with open(output_path + \"cfg.pickle\", \"rb\") as f:\n    cfg = pickle.load(f)\n\
    ```\n```\n\nThe following configurations parameters for TTA are available (and\
    \ settable):\n\n```\n```python\n# current TTA settings\nprint(\"min_sizes\", cfg.TEST.AUG.MIN_SIZES)\n\
    print(\"max_size\", cfg.TEST.AUG.MAX_SIZE)\nprint(\"flip\", cfg.TEST.AUG.FLIP)\n\
    ```\n```"
  merge: -1
