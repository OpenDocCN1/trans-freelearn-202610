- pgno: 231
  md: '# Preparing data for training segmentation models


    This section introduces several scenarios about data preparation steps that may
    be necessary for your cases. Specifically, this section first introduces the common
    tasks to prepare a dataset, including getting images, labeling images, and converting
    annotations. Additionally, in practice, data may come in various formats that
    might not be standard, and in this case, we may need to perform the data preparation
    steps from scratch. Therefore, this section also introduces the steps to prepare
    the brain tumor dataset for training custom segmentation models using Detectron2.


    # Getting images, labeling images, and converting annotations


    If you do not have a dataset, Chapter 3 introduces common places to obtain data
    for computer vision applications in general. It would help if you also went to
    these sources for object instance segmentation data. Also, you can use the same
    Python script (Detectron2_Chapter03_Download_Images.ipynb) introduced in Chapter
    3 to download images from the internet and perform labeling.


    Chapter 3 also introduced several online and offline tools for data labeling that
    support instance segmentation labeling (polygon labeling). Like labelImg, commonly
    used for bounding box labeling (object detection task), labelme (https://github.com/wkentaro/labelme)
    is a popular free software package for labeling images for segmentation tasks.
    It provides tools to mark various primitives: polygons, rectangles, circles, lines,
    and points. You can run the following command in a Terminal to install labelme
    using pip:


    ```

    pip install labelme

    ```


    This tool''s usage is similar to labelImg introduced in Chapter 3. You can execute
    one of the following commands in a Terminal to start labeling:


    ```

    labelme image_folder/

    labelme image_folder/ --labels labels.txt

    ```


    The first command specifies image_folder, where all labeling images are stored.
    If you wish, the second command allows specifying a list of labels (categories
    of objects to label) in a text file (labels.txt). The labeling process is then
    straightforward.


    After labeling, there is one output text file per image. The output has the same
    filename but with a .txt extension. It is relatively easy to convert these annotation
    files into the COCO format supported by Detectron2. For instance, we can use the
    labelme2coco package (https://github.com/fcakyon/labelme2coco) for this task.
    The following command is the basic usage of this package:


    ```

    labelme2coco dataset_path

    ```'
  merge: -1
  img_proc: true
