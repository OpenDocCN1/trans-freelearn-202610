  img_proc: true
- pgno: 65
  md: "The next code snippet (to be executed in a separate Google Colab code cell)\
    \ sets the working directory to the previously created folder, so the downloaded\
    \ results remain in this folder when the Google Colab instance stops:\n\n```\n\
    cd \"/gdrive/My Drive/Detectron2/Chapter3\"\n```\n\nIt is always a good practice\
    \ to ensure that Google Colab is currently working in this directory by running\
    \ the pwd() command in another code cell and inspecting the output.\n\nOnce you\
    \ are in the specified folder, the following code snippet helps to download images\
    \ from Google Images using the simple_image_download package:\n\n```\nfrom tqdm\
    \ import tqdm\nfrom simple_image_download.simple_image_download import simple_image_download\
    \ as Downloader\ndef _download(keyword, limit):\n    downloader = Downloader()\n\
    \    downloader.download(keywords=keyword, limit=limit)\n    urls = downloader.urls(keywords=keyword,\
    \ limit=limit)\n    return urls\n\ndef download(keywords, limit):\n    for keyword\
    \ in tqdm(keywords):\n        urls = _download(keyword=keyword, limit=limit)\n\
    \        with open(f\"simple_images/{keyword}.txt\", \"w\") as f:\n          \
    \  f.writelines('\\n'.join(urls))\n```\n\nSpecifically, the first import statement\
    \ helps to import the tqdm package, which can be used to show downloads' progress.\
    \ This is important because downloading a large number of images from the internet\
    \ would take time. Therefore, it would be helpful to have a progress bar showing\
    \ us that it is currently working and approximately how long it will take to complete\
    \ the task. The next import statement imports the simple_image_download object,\
    \ which helps to perform the downloading task. The next is the _download helper\
    \ method to download a number (specified by the limit parameter) of images from\
    \ Google using a keyword (specified by the keyword parameter). Furthermore, for\
    \ the corresponding pictures, this helper method also returns an array of URLs\
    \ that can be stored to validate the downloaded images and check for copyrights\
    \ if needed."
