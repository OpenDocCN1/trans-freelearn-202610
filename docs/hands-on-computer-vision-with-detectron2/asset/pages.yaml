  md: 'Specifically, this stage takes the features extracted from the backbone network
    and the ground-truth bounding boxes (if training) and performs the following steps:


    +   1. Label and sample proposals (if training).

    +   2. Extract box features.

    +   3. Perform predictions.

    +   4. Calculate losses (if training).

    +   5. Perform inferences (if inferencing).


    If it is training, out of the 2,000 proposals (POST_NMS_TOPK_TRAIN), there can
    be many negative proposals compared to those positive ones (especially at the
    early stage of the training when the RPN is not accurate yet). Similar to the
    RPN stage, this step also labels (based on ground truth) and samples another mini-batch
    with a fraction of positive proposals for training. Only these sampled proposals
    contribute to the loss calculation. The following code snippet shows these configuration
    parameters currently set by Detectron2, and you can also change these parameters
    if needed:


    ```

    ```python

    print(cfg.MODEL.ROI_HEADS.IOU_THRESHOLDS)

