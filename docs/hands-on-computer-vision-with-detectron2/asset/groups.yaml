    # Introduction to PointRend


    PointRend is a project as a part of Detectron2. It helps provide better segmentation
    quality for detected object boundaries. It can be used with instance segmentation
    and semantic segmentation. It is an extension of the Mask R-CNN head, which we
    discussed in the previous chapter. It performs point sampling on the detected
    mask and performs predictions on the sampled points instead of all the points
    in the mask. This technique allows us to compute the mask with a higher resolution,
    thus providing a higher mask resolution. Figure 11.1 illustrates an example of
    two images when not using (left) and when using (right) PointRend:


    ![](img/0e7994c850a84b7a53d34c7f943c7edd_251_0.png)


    ![](img/0e7994c850a84b7a53d34c7f943c7edd_251_1.png)


    Figure 11.1: Segmentation quality with and without PointRend


    PointRend helps render segmentations that are of a higher resolution with object
    boundaries that are crisp and less smooth. Therefore, it is useful if the objects
    to detect have sharp edges.


    At inference time, starting from the coarse prediction, it performs upsampling
    via several steps to increase the mask resolution. At each step, there are three
    main tasks:


    +   1. Sample a number (hyperparameter) of points for performing predictions.
    This strategy helps avoid produced computing predictions on many grid points at
    higher resolutions.

    +   2. Extract features for each sampled point from the feature maps extracted
    by the backbone, combined with the features from the coarse prediction.

    +   3. Classify each sampled point''s labels using their extracted features using
    a multilayer perceptron neural network (Point Head).'
  - '[PAGE 252]


    Figure 11.2 illustrates the PointRend strategy in three different resolutions
    for one object instance at inference time:


    ![](img/0e7994c850a84b7a53d34c7f943c7edd_252_0.png)


    Figure 11.2: PointRend prediction at inference time


    The leftmost image is the 7×7 coarse prediction discussed in the previous chapter.
    PointRend has a hyperparameter for the number of points to sample (N = 14×14,
    in this case); thus, the coarse prediction is upsampled (for example, using bilinear
    interpolation), as in the middle of the preceding figure. This solution has the
    same number of pixels as the number of points to sample. Thus, every single point
    is passed to the Point Head to predict its label (middle of the figure). In the
    next subdivision step, the image is upsampled to a 28×28 resolution. This resolution
    has more pixels than the N points. Therefore, PointRend applies a sample strategy
    here. The N sampled points are those more ambiguous (in terms of whether or not
    they should be in the object, and they represent the boundary). In other words,
    these 14×14 points sampled to be passed to the Point Head to perform prediction
    have prediction probabilities close to 0.5 (ambiguous). The reason for this is
    obvious: those with high confidence in being in the background or being in the
    object do not require further predictions to be made. This approach, at inference
    time, is iterative.


    This iterative approach is not friendly for training neural networks. Therefore,
    PointRend utilizes a different point sampling strategy at training time to train
    its Point Head. This sampling strategy has three parameters: the number of points
    to sample (N), the upsampling constant (k), and the importance sample ratio (β),
    which is the percentage of points that are closer to the edges (ambiguous or having
    a prediction confidence close to 0.5). Specifically, these points are selected
    via the following steps:


    +   1. Sample for kN points uniformly in the coarse predictions (sampling for
    kN instead of N makes this step an oversampling step and k as the oversampling
    constant, where k > 1).

    +   2. Select βN points closest to the boundary (ranked by how close their prediction
    confidences are to 0.5). These points are closer to the edge, and that makes them
    important. Therefore, β is called the importance sample ratio.

    +   3. Select (1-β)N points from the kN points sampled in step 1 to have a total
    of N points for training the Point Head.'
  - '[PAGE 253]


    Figure 11.3 illustrates an example of the selected points (right) for the coarse
    mask prediction of the 7×7 resolution (left) with N = 14×14, k = 3, and β = 0.75:


    ![](img/0e7994c850a84b7a53d34c7f943c7edd_253_0.png)


    Figure 11.3: PointRend point sampling strategy at training time


    More points are selected (approximately 75% are at the boundary) and the rest
    are chosen uniformly randomly over the coarse mask to extract features and train
    the Point Head.


