    \n- 计算机视觉任务\n- Detectron2 及其实架构简介\n- Detectron2 开发环境\n\n### 技术要求\n\nDetectron2\
    \ CV 应用建立在 PyTorch 之上。因此，需要兼容版本的 PyTorch 才能运行本章中的代码示例。本章后面的部分将提供专门针对 Detectron2\
    \ 的设置说明。所有代码、数据集和相应结果均可在本书的 GitHub 页面 https://github.com/PacktPublishing/Hands-On-Computer-Vision-with-Detectron2\
    \ 上获取。强烈建议下载代码并跟随学习。\n\n## 计算机视觉任务\n\n深度学习在许多 CV 任务中取得了最先进的结果。最常见的 CV 任务是图像分类，其中深度学习模型为给定图像提供类别标签。然而，深度学习在最近的进步使计算机能够执行更高级的视觉任务。这些高级视觉任务有很多。\n\
    \n然而，本书专注于更常见和重要的任务，包括目标检测、实例分割、关键点检测、语义分割和全景分割。读者可能难以区分这些任务。图 1.1 描绘了它们之间的差异。本节概述了它们是什么以及何时使用它们，而本书的其余部分则侧重于如何使用\
    \ Detectron2 实现这些任务。让我们开始吧！\n\n![](img/0e7994c850a84b7a53d34c7f943c7edd_23_0.png)\n\
    \n### 目标检测\n\n目标检测通常包括目标定位和分类。具体而言，此任务的深度学习模型通过在图像中对感兴趣的目标应用边界框来预测目标所在的位置（定位）。此外，这些模型还会将检测到的目标分类为感兴趣的类型（分类）。\n\
    \n此任务的一个示例是在图片中指定人物并对检测到的人类应用边界框（仅定位），如图 1.1 (b) 所示。另一个示例是从记录的道路图像中检测道路损坏，通过为损坏提供边界框（定位）并进一步将损坏分类为纵向裂缝、横向裂缝、龟裂和坑洞等类型（分类）。\n\
    \n### 实例分割\n\n实例分割与目标检测类似，也涉及目标定位和分类。然而，实例分割在定位检测到的感兴趣目标时更进一步。\n\n具体而言，除了分类之外，此任务的模型还在像素级别上定位检测到的目标。换句话说，它识别每个检测到的目标的所有像素。实例分割在需要图像中检测到的目标的形状并需要跟踪每个单独目标的应用中是必需的。图\
    \ 1.1 (c) 显示了对图 1.1 (a) 中输入图像的实例分割结果。具体而言，除了边界框之外，每个人的每个像素也被突出显示。\n\n### 关键点检测\n\
    \n除了检测目标之外，关键点检测还指示检测到的目标的重要部位，称为关键点。这些关键点描述了检测到的目标的基本特征。该特征通常对图像旋转、缩小、平移或失真不变。例如，人类的关键点包括眼睛、鼻子、肩膀、手肘、手、膝盖和脚。关键点检测对于动作估计、姿态检测或人脸检测等应用很重要。图\
    \ 1.1 (d) 显示了对图 1.1 (a) 中输入图像的关键点检测结果。具体而言，除了边界框之外，它还突出显示每个检测到的个体的所有关键点。\n\n###\
    \ 语义分割\n\n语义分割任务并不检测对象的特定实例，而是将图像中的每个像素分类为感兴趣的某些类别。例如，在自动驾驶汽车应用中，此任务的模型将图像区域分类为行人、道路、汽车、树木、建筑物和天空。此任务在提供不同类别的对象组的更广阔视图时很重要（即对图像有更高层次的理解）。具体而言，如果一个区域中存在单个类别实例，它们会被归为一个掩码，而不是为每个单独实例提供不同的掩码。\n\
    \n语义分割应用的一个示例是将图像分割为前景对象和背景对象（例如，模糊背景并为肖像图像提供更艺术的外观）。图 1.1 (e) 显示了对图 1.1 (a) 中输入图像的语义分割结果。具体而言，输入图片被划分为被分类为事物（人或前景对象）和背景对象（如天空、山、泥土、草和树）的区域。\n\
    \n"
