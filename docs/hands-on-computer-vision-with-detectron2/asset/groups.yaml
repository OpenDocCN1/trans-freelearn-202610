  - "[PAGE 277]\n\nDetectron2 provides a function called scripting_with_instances\
    \ to perform exports using the PyTorch scripting function (torch.jit.script).\
    \ Detectron2 models use the Instances class, and attributes in this class can\
    \ be added dynamically with eager mode. The PyTorch scripting function does not\
    \ support this dynamic behavior. This is why this helper function (scripting_with_instances)\
    \ is required. It takes the following input parameters:\n\n+   - model: This is\
    \ a Detectron2 model to be exported using the scripting method\n+   - fields:\
    \ This gives attribute names and types used by the Instances class in the model\n\
    \nThis method creates a class called new_Instances, similar to Instances but with\
    \ static attributes. The static attributes must be declared using the fields input\
    \ parameter of the helper method. The new_Instances class makes the model traceable.\
    \ The following is an example usage of this helper function:\n\n```\nfields =\
    \ {\n    \"proposal_boxes\": Boxes,\n    \"objectness_logits\": Tensor,\n    \"\
    pred_boxes\": Boxes,\n    \"scores\": Tensor,\n    \"pred_classes\": Tensor,\n\
    \    \"pred_masks\": Tensor,\n    \"pred_keypoints\": Tensor,\n    \"pred_keypoint_heatmaps\"\
    : Tensor,\n}\nmodel.eval()\nscripted_model = scripting_with_instances(model, fields)\n\
    ```\n\nCongratulations! You now know about the two main utilities that help export\
    \ the Detectron2 model with tracing and scripting methods. Let us apply these\
    \ in exporting a custom Detectron2 model built previously.\n\n# Exporting a custom\
    \ Detectron2 model\n\nWe first need to install Detectron2, load a dataset, and\
    \ get a trained model and its configuration file for exporting:\n\n```\n# install\n\
    !python -m pip install \\\n'git+https://github.com/facebookresearch/detectron2.git'\n\
    # dataset\n```"
