    \ 个为负样本。这 256 个锚点会参与损失计算（训练），其余的则被忽略。接下来，RPN 损失计算是分类损失（基于采样锚点的负样本和正样本标签及其各自的预测）与回归损失（基于真实边界框位置及其各自预测的锚点偏移量）之间的加权贡献。在完成所有之前步骤后，RPN\
    \ 的下一个任务是生成 proposals。以下章节将检查 RPN 提出区域的方式。\n\n## Proposal predictions\n\n提案预测步骤引入了一个新的概念，称为非极大值抑制（NMS）。具体来说，对于一个真实框可能会产生多个提案。这些提案可能在很大区域上重叠，并且具有不同的\
    \ objectness 分数。图 4.10 显示了为什么需要 NMS 的示例。具体来说，针对一个真实框（实线框）提出了两个提案（虚线框）。可以观察到，这两个提案有很大的重叠区域，删除其中一个并保留\
    \ objectness 分数更高（置信度更高）的另一个提案是明智的。\n\n![](img/0e7994c850a84b7a53d34c7f943c7edd_100_0.png)\n\
    \n图 4.10：一个真实标签（实线框）和多个提案（虚线框）\n\n具体来说，该阶段从主干网络提取特征并使用真实边界框（如果在训练）执行以下步骤：\n\n\
    - 1. 为提案标注并采样（如果在训练）。\n- 2. 提取框特征。\n- 3. 执行预测。\n- 4. 计算损失（如果在训练）。\n- 5. 执行推理（如果在推理）。\n\
    \n如果是在训练阶段，在 2,000 个提案（POST_NMS_TOPK_TRAIN）中，与正样本提案相比可能存在大量负样本提案（尤其是在训练早期阶段，RPN\
    \ 尚未准确时）。与 RPN 阶段类似，此步骤也会基于真实标签进行标注并采样另一个包含一定比例正样本提案的 mini-batch 用于训练。只有这些采样的提案会参与损失计算。以下代码片段显示了\
    \ Detectron2 当前设置的这些配置参数，你也可以根据需要更改这些参数：\n\n```\n```python\nprint(cfg.MODEL.ROI_HEADS.IOU_THRESHOLDS)\n\
    print(cfg.MODEL.ROI_HEADS.BATCH_SIZE_PER_IMAGE)\nprint(cfg.MODEL.ROI_HEADS.POSITIVE_FRACTION)\n\
    ```\n```\n\n这段代码片段应显示三个值 0.5、512 和 0.25。这些值意味着与所有真实框的 IoU 都小于 0.5 的提案被视为背景。每张图像采样\
    \ 512 个提案用于训练，其中 25% 应为正样本提案。如果正样本提案不足，则添加其他负样本提案以使总数达到 512 个。\n\n以下代码片段显示了感兴趣区域头（roi_head）的主要组件：\n\
    \n```\n```python\nroi_heads = predictor.model.roi_heads\nprint(roi_heads)\n```\n\
    ```\n\n此代码片段的输出很长。因此，这里未显示。一般来说，该阶段有三个主要组件：pooler、res5 和 box_predictor。pooler\
    \ 和 res5 组件有助于在 box_predictor 完成预测之前提取框特征；以下章节将研究这些组件。\n\n## The pooler\n\n提案具有不同的尺寸，而后续步骤中的神经网络需要相同尺寸的输入特征。因此，必须在输入预测步骤之前将提取的特征裁剪为相同尺寸。pooler\
    \ 组件有助于执行此任务。以下代码片段显示了有关 pooler 的更多信息：\n\n```\n```python\nprint(roi_head.pooler)\n\
    ```\n```\n\n此代码片段应显示以下输出：\n\n```\n```text\nROIPooler(\n    (level_poolers): ModuleList(\n\
    \        (0): ROIAlign(output_size=(14, 14), spatial_scale=0.0625,\n        sampling_ratio=0,\
    \ aligned=True)\n    )\n)\n```\n```\n\n此 pooler 是 ROIPooler 类的一个实例，该类实现了 ROIAlign（Region\
    \ of Interest Version 2）。通常，提案是在原始输入图像坐标中指定的（本例中为 800×800）。这些坐标首先被转换到提取特征的大小（宽度×高度\
    \ = 50×50）。因此，spatial scale 为 0.0625（spatial_scale = 50/800）。\n\n此外，所有提案的输出尺寸均指定为\
    \ 14×14。在 ROIAlignV2 中，将提案区域转换到特征图中的对应区域后，该映射区域被划分为 14×14 的网格。然后对每个网格单元进行插值（例如使用双线性插值方法）并使用四个点进行采样。aligned=True\
    \ 选项意味着像素坐标会偏移 0.5 个像素。在原始图像中半个像素并不重要，但在小特征图分辨率下却很显著，有助于提高精度（尤其是在实例分割中，我们稍后会学习）。以下代码片段生成\
    \ pooler 数据：\n\n```\n```python\nx = roi_heads.pooler([res4], [proposals[0].proposal_boxes])\n\
    print(x.shape)\n```\n```\n\n此代码片段应显示一个大小为 (1000, 1024, 14, 14) 的张量，对应 1,000 个提案；每个提案有\
    \ 1,024 个通道，分辨率为 14×14。\n\n在为所有提案获得相同尺寸的特征后，这些提案会经过另一组卷积层（称为 res5）以提取更深层次的特征。以下代码片段执行此显著特征提取：\n\
    \n```\n```python\nbox_features = roi_heads.res5(x)\nprint(box_features.shape)\n\
    ```\n```\n\n此可视化代码片段与 *Chapter 2* 中介绍的内容类似。图 4.11 显示了此代码片段的输出。\n\n![](img/0e7994c850a84b7a53d34c7f943c7edd_107_0.png)\n\
    \n图 4.12：目标检测过程的可视化\n\n恭喜！到目前为止，你应该已经掌握了 Detectron2 实现的 Faster R-CNN 模型在目标检测任务中的典型架构。本章内容较为深入。然而，其设计和理念有助于你理解其他计算机视觉任务，甚至其他流行的计算机视觉技术，如\
    \ YOLO。\n\n## Summary\n\n本章深入探讨了 Detectron2 实现的 Faster R-CNN 在目标检测任务中的组件。该模型是一种两阶段技术：区域提议阶段和感兴趣区域提取阶段。这两个阶段都使用从主干网络提取的特征。该主干网络可以是任何最先进的卷积神经网络，用于从输入图像中提取显著特征。提取的特征和用于生成一组初始锚点的信息（尺寸和比例；*Chapter\
    \ 7* 解释了如何自定义这些尺寸和比例）随后被传递给区域提议神经网络，以预测固定数量的提案及其 objectness 分数（如果提案中存在物体）和位置偏移量（预测提案与原始锚点之间的位置差异）。选定的提案随后被传递给第二阶段的感兴趣区域头，以预测最终的物体分类和定位。深入理解这些组件为你在下一章中对自定义数据集构建更好的模型进行模型定制和优化做好了充分准备。\n\
    \n恭喜！到目前为止，你应该对 Detectron2 的整体架构及其对 Faster R-CNN 目标检测模型的实现有了深刻的了解。在下一章中，你将使用 Detectron2\
    \ 训练自定义目标检测模型。\n\n"
