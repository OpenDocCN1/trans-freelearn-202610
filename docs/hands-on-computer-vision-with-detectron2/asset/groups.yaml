  - "[PAGE 196]\n\nThe Augmentation class is the base class for all augmentation classes\
    \ to extend. There are two important methods to note: get_transform(self, *args)\
    \ and __call__(self, aug_input). All its subclasses override the get_transform\
    \ method to accept a list of named input parameters and generate a transformation\
    \ object. This list of parameters should have names acceptable by AugInput (which\
    \ we’ll learn about in the next section). The __call__ method enables its subclasses\
    \ to work with AugInput directly (more on this in the next section).\n\nThe FixedSizeCrop\
    \ class takes a crop_size as a tuple (height, width) to crop for that region from\
    \ the original input randomly. If this size is larger than the original image,\
    \ it checks whether the pad option is True. If it is, it pads the input image\
    \ and segmentation with pad_value and seg_pad_value, respectively, to the right\
    \ and bottom (the original image is always in the top-left corner). This class\
    \ helps produce inputs of the same size, which deep learning models often require.\
    \ The following code snippet illustrates the use of this augmentation class:\n\
    \n```\nfsc_aug = T.FixedSizeCrop(crop_size = (300, 300), pad=True,\n pad_value=128)\n\
    fsc_tfm = fsc_aug.get_transform(img)\nfsc_img = fsc_tfm.apply_image(img)\nfsc_boxes\
    \ = fsc_tfm.apply_box(boxes)\nvisualize_image_boxes(fsc_img, fsc_boxes)\n```\n\
    \nFirst, this snippet initiates the crop size and sets the padding options, then\
    \ gets a transformation object using the get_transform method. This object can\
    \ then be used as a deterministic transformation object, as discussed in the previous\
    \ section. In other words, it crops the same region from different inputs. Additionally,\
    \ applying this same transformation to inputs with different sizes will not work\
    \ properly:\n\n![](img/0e7994c850a84b7a53d34c7f943c7edd_196_0.png)\n\nOriginal\
    \ image and ground-truth box\n\n![](img/0e7994c850a84b7a53d34c7f943c7edd_196_1.png)\n\
    \nCropped versions\n\nFigure 8.11: Original image and the ground-truth box and\
    \ their cropped versions"
  - "[PAGE 197]\n\n**The RandomApply class** takes the input parameters as an instance\
    \ of the Transform or Augmentation class (`tfm_or_aug`) and a probability (`prob`,\
    \ which has a default as 0.5) of whether or not to perform such a transformation\
    \ or augmentation. The following code snippet illustrates the use of this class:\n\
    \n```\nra_aug = T.RandomApply(fsc_tfm, prob = 0.3)\nra_fsc_tfm = ra_aug.get_transform()\n\
    ra_fsc_img = ra_fsc_tfm.apply_image(img)\nra_fsc_boxes = ra_fsc_tfm.apply_box(boxes)\n\
    visualize_image_boxes(ra_fsc_img, ra_fsc_boxes)\n```\n\nIf we run this whole snippet\
    \ several times (getting different Transform objects at other runs), then some\
    \ of them might be cropped (as in the right of Figure 8.11), while some might\
    \ not (kept the same input as in the left of Figure 8.11).\n\n**The RandomCrop\
    \ class** takes `crop_type` and `crop_size` as input parameters. Let’s look at\
    \ the different `crop_type` values and how they work:\n\n+   - \"relative\": `crop_size`\
    \ must be in the range of (0, 1] (normalized by the image size, HxW). Then, it\
    \ crops a random region in the image whose size is H*crop_size[0], W*crop_size[1].\n\
    +   - \"relative_range\": `crop_size[0]` is assigned with a uniformly random sampled\
    \ value from [crop_size[0], 1]; the same is done for `crop_size[1]`. The new `crop_size`\
    \ is then used as `crop_type = \"relative\"`.\n+   - \"absolute\": `crop_size`\
    \ must be smaller than the input image’s size. It crops a random region in the\
    \ image whose size is `crop_size[0]`, `crop_size[1]`.\n+   - \"absolute_range\"\
    : `crop_size[0]` is assigned with a uniformly random sampled value from its current\
    \ value and the image height ([crop_size[0], H]); the same is done for `crop_size[1]`.\
    \ The new `crop_size` is then used as `crop_type = \"absolute\"`.\n\nThe following\
    \ code snippet illustrates the usage of this class:\n\n```\nrc_aug = T.RandomCrop(\n\
    \    crop_type=\"relative\",\n    crop_size=(0.5, 0.5))\nrc_tfm = rc_aug.get_transform(img)\n\
    rc_img = rc_tfm.apply_image(img)\nrc_boxes = rc_tfm.apply_box(boxes)\nvisualize_image_boxes(rc_img,\
    \ rc_boxes)\n```"
  - "[PAGE 198]\n\nThe RandomExtent class takes input parameters as tuples of size\
    \ two for scale_range and shift_range. The former helps decide the size of the\
    \ cropping subregion, while the latter helps determine the location to extract\
    \ the subregion from. Specifically, the scale_range tuple specifies a range with\
    \ low (l) and high (h) values, where a value (r) is uniformly sampled from this\
    \ range; then, the output image's size is r*H and r*W (where H and W are the height\
    \ and width of the input image, respectively). The second parameter, shift_range,\
    \ is another tuple of size two, (x, y). Two random values (x_shift and y_shift)\
    \ are uniformly sampled from the [-x, x] and [-y, y] ranges; then, the cropped\
    \ region is also shifted by x_shift*W/2 and y_shift*H/2 around the center of the\
    \ input image. The following code snippet illustrates the usage pattern of this\
    \ class:\n\n```\nre_aug = T.RandomExtent(\n    scale_range=(0.5, 0.9),\n    shift_range=(0.3,\
    \ 0.3))\nre_tfm = re_aug.get_transform(img)\nre_img = re_tfm.apply_image(img)\n\
    re_boxes = re_tfm.apply_box(boxes)\nvisualize_image_boxes(re_img, re_boxes)\n\
