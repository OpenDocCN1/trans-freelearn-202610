    COCO-InstanceSegmentation/mask_rcnn_X_101_32x8d_FPN_3x.yaml

    ```


    ## Getting a predictor


    The code snippet for getting a predictor for this object instance segmentation
    remains the same for the previously developed object detection application except
    for the following two lines. These two lines specify different configuration files
    for this specific pre-trained model:


    ```

    # Select a model

    config_file = "COCO-InstanceSegmentation/mask_rcnn_X_101_32x8d_FPN_3x.yaml"

    checkpoint_url = "COCO-InstanceSegmentation/mask_rcnn_X_101_32x8d_FPN_3x.yaml"

