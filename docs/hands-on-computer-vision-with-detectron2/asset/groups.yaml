  - '[PAGE 22]


    # An Introduction to Detectron2 and Computer Vision Tasks


    This chapter introduces Detectron2, its architectures, and the computer vision
    (CV) tasks that Detectron2 can perform. In other words, this chapter discusses
    what CV tasks Detectron2 can perform and why we need them. Additionally, this
    chapter provides the steps to set up environments for developing CV applications
    using Detectron2 locally or on the cloud using Google Colab.


    By the end of this chapter, you will understand the main CV tasks (e.g, object
    detection, instance segmentation, keypoint detection, semantic segmentation, and
    panoptic segmentation); know how Detectron2 works and what it can do to help you
    tackle CV tasks using deep learning; and be able to set up local and cloud environments
    for developing Detectron2 applications.


    Specifically, this chapter covers the following topics:


    +   - Computer vision tasks

    +   - Introduction to Detectron2 and its architecture

    +   - Detectron2 development environments


    # Technical requirements


    Detectron2 CV applications are built on top of PyTorch. Therefore, a compatible
    version of PyTorch is expected to run the code examples in this chapter. Later
    sections of this chapter will provide setup instructions specifically for Detectron2.
    All the code, datasets, and respective results are available on the GitHub page
    of the book at https://github.com/PacktPublishing/Hands-On-Computer-Vision-with-Detectron2.
    It is highly recommended to download the code and follow along.'
  - '[PAGE 23]


    # Computer vision tasks


    Deep learning achieves state-of-the-art results in many CV tasks. The most common
    CV task is image classification, in which a deep learning model gives a class
    label for a given image. However, recent advancements in deep learning allow computers
    to perform more advanced vision tasks. There are many of these advanced vision
    tasks.


    However, this book focuses on more common and important ones, including object
    detection, instance segmentation, keypoint detection, semantic segmentation, and
    panoptic segmentation. It might be challenging for readers to differentiate between
    these tasks. Figure 1.1 depicts the differences between them. This section outlines
    what they are and when to use them, and the rest of the book focuses on how to
    implement these tasks using Detectron2. Let’s get started!


    ![](img/0e7994c850a84b7a53d34c7f943c7edd_23_0.png)


    # Object detection


    Object detection generally includes object localization and classification. Specifically,
    deep learning models for this task predict where objects of interest are in an
    image by applying the bounding boxes around these objects (localization). Furthermore,
    these models also classify the detected objects into types of interest (classification).'
  - '[PAGE 24]


    One example of this task is specifying people in pictures and applying bounding
    boxes to the detected humans (localization only), as shown in Figure 1.1 (b).
    Another example is to detect road damage from a recorded road image by providing
    bounding boxes to the damage (localization) and further classifying the damage
    into types such as longitudinal cracks, traverse cracks, alligator cracks, and
    potholes (classification).


    # Instance segmentation


    Like object detection, instance segmentation also involves object localization
    and classification. However, instance segmentation takes things one step further
    while localizing the detected objects of interest.


    Specifically, besides classification, models for this task localize the detected
    objects at the pixel level. In other words, it identifies all the pixels of each
    detected object. Instance segmentation is needed in applications that require
    shapes of the detected objects in images and need to track every individual object.
    Figure 1.1 (c) shows the instance segmentation result on the input image in Figure
    1.1 (a). Specifically, besides the bounding boxes, every pixel of each person
    is also highlighted.


    # Keypoint detection


    Besides detecting objects, keypoint detection also indicates important parts of
    the detected objects called keypoints. These keypoints describe the detected object''s
    essential trait. This trait is often invariant to image rotation, shrinkage, translation,
    or distortion. For instance, the keypoints of humans include the eyes, nose, shoulders,
    elbows, hands, knees, and feet. Keypoint detection is important for applications
    such as action estimation, pose detection, or face detection. Figure 1.1 (d) shows
    the keypoint detection result on the input image in Figure 1.1 (a). Specifically,
    besides the bounding boxes, it highlights all keypoints for every detected individual.


    # Semantic segmentation


    A semantic segmentation task does not detect specific instances of objects but
    classifies each pixel in an image into some classes of interest. For instance,
    a model for this task classifies regions of images into pedestrians, roads, cars,
    trees, buildings, and the sky in a self-driving car application. This task is
    important when providing a broader view of groups of objects with different classes
    (i.e., a higher level of understanding of the image). Specifically, if individual
    class instances are in one region, they are grouped into one mask instead of having
    a different mask for each individual.


    One example of the application of semantic segmentation is to segment the images
    into foreground objects and background objects (e.g., to blur the background and
    provide a more artistic look for a portrait image). Figure 1.1 (e) shows the semantic
    segmentation result on the input image in Figure 1.1 (a). Specifically, the input
    picture is divided into regions classified as things (people or front objects)
    and background objects such as the sky, a mountain, dirt, grass, and a tree.'
