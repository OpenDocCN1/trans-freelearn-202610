    Computer vision is advancing rapidly, and there is a vast number of available
    practitioners in this field. If you cannot find the datasets that meet your needs
    in the preceding two resources, you can use the internet (e.g., Google) to search
    for the dataset that you want. However, if you still cannot find such a dataset,
    it is time to collect and label your own dataset. The following sections cover
    the standard tools and steps for collecting and labeling datasets for computer
    vision applications.


    # Getting images


    When you start a new project, you might have a set of images collected using graphic
    devices such as cameras, smartphones, drones, or other specialized devices. If
    you have some photos, you can skip this step and move to the following steps,
    where you select a labeling tool and start labeling. However, if you are about
    to start a fresh new project and do not even have any images, you can get some
    ideas from this section on collecting pictures from the internet. There might
    be copyrights related to images that you collect from the internet. Thus, you
    should check for copyrights to see whether the downloaded images are usable for
    your purposes.


    Google Images contains a massive number of photos, which continues to grow every
    day. Therefore, it is a great resource to crawl images for training your custom
    model. Python has a simple_image_download package that provides scripts to search
    for images using keywords or tags and download them. First, we will install this
    package using the following command:


    ```

    !pip install simple_image_download

    ```


    You can run this command in Google Colab''s code cell to install it and download
    images to a running Google Colab instance. However, once the instance is stopped,
    the downloaded photos are gone. Therefore, you should download the images to a
    mapped Google Drive folder or on a local computer. You can run the same command
    on a locally hosted Jupyter notebook or remove the start (!) character and execute
    it in a terminal to install this package locally. If you are running on Google
    Colab, the following code snippet helps to map Google Drive and creates a folder
    in Google Drive:


    ```

    import os

    from google.colab import drive

    drive.mount(''/gdrive'')

    project_folder = "/gdrive/My Drive/Detectron2/Chapter3"

    os.makedirs(project_folder, exist_ok=True)

    ```'
