    \ 梯度下降\n\n梯度下降是训练深度神经网络时最基本的概念之一。通常，在训练神经网络时，有一个成本（损失）函数（$L$），我们需要对其关于模型参数（$W$）进行优化（最小化）。我们使用微积分来执行此优化，通过获取损失函数对参数的导数，将其设为零并获得最优结果。然而，在复杂的深度神经网络中（通常如此），很难（甚至不可能）求解此方程。因此，使用数值近似更为合适。*图\
