    \ occurs:\n\n- The `angle` parameter is a list of values to choose from for rotation\n\
    - The `center` parameter is None, meaning the center of the rotation is that of\
    \ the input image\n\nThe following code snippet illustrates the usage pattern\
    \ of this class:\n\n```\nrr_aug = T.RandomRotation(\n        angle        = [-30,\
    \ 30],\n        sample_style = \"range\",\n        center       = [[0.4, 0.6],\
