  - '[PAGE 209]


    # The Detectron2 data loader


    Applying augmentations in Detectron2 can be straightforward and complicated at
    the same time. It is relatively easy to use the declarative approach and apply
    existing transformations and augmentations provided by Detectron2, which should
    meet the most common needs. However, adding custom augmentations that require
    multiple data samples (e.g., MixUp and Mosaic) is a little complicated. This section
    describes how Detectron2 loads data and how to incorporate existing and custom
    data augmentations into training Detectron2 models. Figure 9.1 illustrates the
    steps and main components of the Detectron2 data loading system.


    ![](img/0e7994c850a84b7a53d34c7f943c7edd_209_0.png)


    There are classes for `Dataset`, `Sampler`, `Mapper`, and `Loader`. The `Dataset`
    component normally stores a list of data items in JSON format. The `Sampler` component
    helps to randomly select one data item (`dataset_dict`) from the dataset. The
    selected data item has the information for the image file name and annotations.
    Thus, the Mapper loads the actual image. After that, the annotations and loaded
    image go through augmentations and data conversion into an image tensor and instances
    for annotations. The Mapper produces one data item, and the Loader helps to pack
    these in batches and feed them to training. A few augmentation techniques may
    want to load extra samples (`dataset_dict(s)` and `image(s)`) besides the current
    input, and these items are expressed in dashed lines in Figure 9.1. Once you understand
    how Detectron2 loads its data, it is relatively easy to incorporate existing data
    augmentations into Detectron2 training.'
