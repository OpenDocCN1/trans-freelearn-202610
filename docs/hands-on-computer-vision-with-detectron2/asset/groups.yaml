    # Proposal predictions


    The proposal prediction step has a new concept called Non-Maximum Suppression
    (NMS). Specifically, there can be multiple proposals made for one ground-truth
    box. These proposals may overlap in a large area and have different objectness
    scores. Figure 4.10 shows an example of why NMS is necessary. Specifically, two
    proposals (dashed boxes) are made for one ground-truth box (solid one). Observably,
    these two proposals have a large overlapping area, and it is a good idea to remove
    one and keep another one with a higher objectness score (higher confidence).


