    and the fields it provides:


    ```

    {''instances'': Instances(num_instances = 4, image_height = 720, image_width =
    960, fields = [pred_boxes: Boxes(tensor([[492.1558, 331.5353, 687.8397, 637.9542],
    [294.6652, 192.1288, 445.8517, 655.3390], [419.8898, 253.9013, 507.7427, 619.1491],
    [451.8833, 395.1392, 558.5139, 671.0604]], device = ''cuda:0'')), scores: tensor([0.9991,
    0.9986, 0.9945, 0.9889], device = ''cuda:0''), pred_classes: tensor([0, 0, 0,
    0], device = ''cuda:0'')]) }

    ```


    Observably, besides the image information, the object detection result also includes
    the detected instances (instances) with corresponding predicted bounding boxes
    (pred_boxes), predicted confidence scores (scores), and the predicted class labels
    (pred_classes). With this information, we are ready to visualize the detected
    objects with corresponding bounding boxes.


    ## Visualizing the results


    Detectron2 provides a Visualizer class, which helps you to easily annotate detected
    results to the input image. Thus, the following code snippet imports this class
    and uses its visualization method to annotate detection results to the input image:


    ```

    from google.colab.patches import cv2_imshow

    from detectron2.utils.visualizer import Visualizer

    from detectron2.data import MetadataCatalog

    metadata = MetadataCatalog.get(cfg.DATASETS.TRAIN[0])

    v = Visualizer(img[:, :, ::-1], metadata, scale=0.5)

    instances = output["instances"].to("cpu")

    annotated_img = v.draw_instance_predictions(instances)

    cv2_imshow(annotated_img.get_image()[:, :, ::-1])

    ```


    Specifically, the first statement imports the cv2_imshow method, a Google Colab
    patch, to display images to Google Colab output. The next import statement is
    Visualizer itself. The third import statement helps get information about the
    training dataset. Specifically, this MetadataCatalog object provides the label
    names for the predicted objects. In this case, a class label is a person for the
    predicted class number 0, as in the output.


    ## Selecting a configuration file


