    - 小结 — 241\n\n# 第4部分：将 Detectron2 模型部署到生产环境\n\n## 第12章：将 Detectron2 模型部署到服务器环境\n\
    \n- 技术要求 — 245\n- 支持的文件格式与运行时 — 245\n  - 开发环境、文件格式与运行时 — 246\n- 使用跟踪（tracing）方法导出\
