    segmentation, keypoint detection, semantic segmentation, and panoptic segmentation,
    and when to use them. Detectron2 is a framework that helps implement cutting-edge
    algorithms for these CV tasks with the advantages of being faster, more accurate,
    modular, customizable, and built on top of PyTorch. Its architecture has four
    main parts: input data, backbone, region proposal, and region of interest heads.
    Each of these components is replaceable with a custom implementation. This chapter
    also provided the steps to set up a cloud development environment using Google
    Colab, a local development environment, or to connect Google Colab to a local
    runtime if needed.


    You now understand the leading CV tasks Detectron2 can help develop and have set
    up a development environment. The next chapter (*Chapter 2*) will guide you through
    the steps to build CV applications for all the listed CV tasks using the cutting-edge
    models provided in the Detectron2 Model Zoo.


    ## Technical requirements


    You should have set up the development environment with the instructions provided
    in Chapter 1. Thus, if you have not done so, please complete setting up the development
    environment before continuing. All the code, datasets, and respective results
    are available on the GitHub page of the book (under the folder named Chapter02)
    at https://github.com/PacktPublishing/Hands-On-Computer-Vision-with-Detectron2.
    It is highly recommended to download the code and follow along.


    ## Introduction to Detectron2’s Model Zoo


    In deep learning, when developing large models and training models on massive
    datasets, developers of the deep learning methods often provide pre-trained models.
    The main reason for this is that the developers of these models usually are the
    big players in the field (e.g., Facebook, Google, Microsoft, or universities)
    with access to computation resources (e.g., CPUs and GPUs) to train such models
    on large datasets. These computation resources are generally not accessible for
    standard developers elsewhere.


    These pre-trained models are often trained on the datasets for use with common
    tasks that the models are intended for. Therefore, another benefit of such models
    is for the users to adopt them and use them for specific cases of the tasks at
    hand if they match what the models were trained for. Furthermore, these models
    can also be used as the baselines on which the end users can further fine-tune
    them for their specific cases with smaller datasets that require fewer computation
    resources to train.


    Detectron2 also provides an extensive collection of models trained with Big Basin
    servers with high computation resources (8 NVIDIA V100 GPUs and NVLink) on its
    Model Zoo. You can read further information and download all the models from this
    link: https://github.com/facebookresearch/detectron2/blob/main/MODEL_ZOO.md.


    It would be a little overwhelming for new users to grasp information about the
    available models with different specifications. So, this section details which
    information users should look for to complete a specific computer vision task
    at hand using these cutting-edge models from Detectron2 Model Zoo. These items
    include finding information about the following:


    - The dataset on which the model was trained

    - The architecture of this model

    - Training and inferencing times

    - Training memory requirement

    - Model accuracy

    - The link to the trained model (weights)

    - The link to its configuration file (.yaml)

