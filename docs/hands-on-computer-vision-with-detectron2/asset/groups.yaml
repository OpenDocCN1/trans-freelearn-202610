    \ download onnx.js to the current folder using the following snippet:\n\n```\n\
    ```bash\n!wget https://cdn.jsdelivr.net/npm/onnxjs/dist/onnx.min.js\n```\n```\n\
    \nOnce the downloads are complete, we can use the %%writefile directive to create\
    \ an HTML file called load_onnx.html in the current folder. This HTML file helps\
    \ to load the downloaded model and execute the model on an example input to verify\
    \ the process:\n\n```\n```html\n%%writefile load_onnx.html\n<html>\n\n  <head>\
    \ </head>\n\n  <body>\n    <div id=\"output\"></div>\n    <script src=\"onnx.min.js\"\
    >\n    </script>\n    <script>\n      const myOnnxSession = new onnx.InferenceSession();\n\
    ```\n```"
  md: "\nDetectron2 provides a function called scripting_with_instances to perform\
    \ exports using the PyTorch scripting function (torch.jit.script). Detectron2\
    \ models use the Instances class, and attributes in this class can be added dynamically\
    \ with eager mode. The PyTorch scripting function does not support this dynamic\
    \ behavior. This is why this helper function (scripting_with_instances) is required.\
    \ It takes the following input parameters:\n\n- model: This is a Detectron2 model\
    \ to be exported using the scripting method\n- fields: This gives attribute names\
    \ and types used by the Instances class in the model\n\nThis method creates a\
    \ class called new_Instances, similar to Instances but with static attributes.\
    \ The static attributes must be declared using the fields input parameter of the\
    \ helper method. The new_Instances class makes the model traceable. The following\
    \ is an example usage of this helper function:\n\n```\nfields = {\n    \"proposal_boxes\"\
    : Boxes,\n    \"objectness_logits\": Tensor,\n    \"pred_boxes\": Boxes,\n   \
    \ \"scores\": Tensor,\n    \"pred_classes\": Tensor,\n    \"pred_masks\": Tensor,\n\
    \    \"pred_keypoints\": Tensor,\n    \"pred_keypoint_heatmaps\": Tensor,\n}\n\
    model.eval()\nscripted_model = scripting_with_instances(model, fields)\n```\n\n\
    Congratulations! You now know about the two main utilities that help export the\
    \ Detectron2 model with tracing and scripting methods. Let us apply these in exporting\
    \ a custom Detectron2 model built previously.\n\n## Exporting a custom Detectron2\
    \ model\n\nWe first need to install Detectron2, load a dataset, and get a trained\
    \ model and its configuration file for exporting:\n\n```\n# install\n!python -m\
    \ pip install \\\n'git+https://github.com/facebookresearch/detectron2.git'\n#\
    \ dataset\n```\n\n## 13\nDeploying Detectron2 Models into Browsers and Mobile\
    \ Environments\n\nThis chapter introduces the Open Neural Network Exchange (ONNX)\
    \ framework. This framework helps share deep neural networks across multiple frameworks\
    \ and platforms. It is extremely helpful when there is a need to deploy Detectron2\
    \ models into browsers or mobile environments. This chapter also describes D2Go,\
    \ a framework for training, quantizing, and deploying models with minimal memory\
    \ storage and computation requirements. Models created using this framework are\
    \ extremely helpful for deploying into mobile or edge devices.\n\nBy the end of\
    \ this chapter, you will understand the ONNX framework and when it is helpful.\
    \ You can export custom Detectron2 models into this format and deploy them into\
    \ the web or browser environments. You will also understand the advantage of the\
    \ D2Go framework and know how to utilize pre-trained models on its Model Zoo or\
    \ train custom models using D2Go. You can also perform quantization on a custom\
    \ model to further optimize its memory and improve its computation time.\n\nSpecifically,\
    \ this chapter covers the following topics:\n\n- Deploying Detectron2 models using\
    \ ONNX\n- Developing mobile computer vision apps with D2Go\n\n## Technical requirements\n\
    \nYou should have completed Chapter 1 to have an appropriate development environment\
    \ for Detectron2.\nAll the code, datasets, and results are available on the GitHub\
    \ page of the book at https://github.com/PacktPublishing/Hands-On-Computer-Vision-with-Detectron2.\n\
    \n```\nclass SimplePyTorchModel(nn.Module):\n    def __init__(self):\n       \
    \ super(SimplePyTorchModel, self).__init__()\n        self.linear = nn.Linear(4,\
    \ 1)\n        self.linear.weight.data.fill_(0.01)\n        self.linear.bias.data.fill_(0.01)\n\
    \n    def forward(self, X):\n        return torch.relu(self.linear(X))\n```\n\n\
    Notably, we do not need to train the model but fix its weights and biases as 0.01\
    \ for demonstration purposes. The following code snippet then creates a model\
    \ of this simple neural network and puts it in evaluation mode:\n\n```\npt_model\
    \ = SimplePyTorchModel()\npt_model.eval()\n```\n\nNow, we are ready to export\
    \ the model into ONNX format using a dummy input:\n\n```\ndummy_X = torch.tensor([[1,\
    \ 2, 3, 4]], dtype=torch.float32)\nmodel_name = 'onnx_model.onnx'\ntorch.onnx.export(pt_model,\n\
    \    dummy_X, model_name, verbose=True)\n```\n\nTo test the exported model, we\
    \ first need to install the onnx package using the following statement:\n\n```\n\
    !pip install onnx\n```\n\nAfter installing onnx, the following code snippet loads\
    \ the exported ONNX model, checks whether it is well-formed, and prints out its\
    \ graph for inspection purposes:\n\n```\nimport onnx\nfrom onnx.helper import\
    \ printable_graph\n# load\nloaded_model = onnx.load(model_name)\n# check (well\
    \ formed)\nonnx.checker.check_model(loaded_model)\n# graph\nprint(printable_graph(loaded_model.graph))\n\
    ```\n\nTo run the loaded model in an ONNX model, we first need to install the\
    \ onnxruntime package using the following statement:\n\n```\n!pip install onnxruntime\n\
    ```\n\nOnce the runtime environment is ready, the following code snippet helps\
    \ to create an inference session and gets the input name for the loaded model:\n\
    \n```\nimport onnxruntime as ort\nort_session = ort.InferenceSession(model_name)\n\
    input_name = ort_session.get_inputs()[0].name\nprint(input_name)\n```\n\nThe previous\
    \ code snippet should display input_name as onnx::Gemm_0. This input name is important\
    \ for creating an input object for the loaded model while performing inferencing\
    \ on input data, as in the following code snippet:\n\n```\nimport numpy as np\n\
    X = np.array([[2, 3, 4, 5]])\noutputs = ort_session.run(\n    None,\n    {input_name:\
    \ X.astype(np.float32)},\n)\nprint(outputs[0])\n```\n\nThe previous code snippet\
    \ creates a batch input, X, with one instance of [2, 3, 4, 5] and performs prediction\
    \ on this input. This code snippet should display the result as [[0.15]]. To validate\
    \ the accuracy of the prediction, we can also perform prediction on the same input\
    \ using the original PyTorch model as follows:\n\n```\nX = torch.tensor([[2, 3,\
    \ 4, 5]], dtype=torch.float32)\nwith torch.no_grad():\n    y = pt_model(X)\n \
    \   print(y)\n```\n\nThis code snippet should display the same output ([[0.15]])\
    \ as the loaded ONNX model executed in the ONNX inference session.\n\nOptionally,\
    \ if you are running on Google Colab, you can run the following code snippet to\
    \ download this ONNX model for future use:\n\n```\n```python\nfrom google.colab\
    \ import files\nfiles.download('onnx_model.onnx')\n```\n```\n\nWe should now have\
    \ the PyTorch model exported in ONNX format. This model can be deployed in various\
    \ frameworks and platforms that support ONNX. In the next section, we will deploy\
    \ this into the browser environment.\n\n## Loading an ONNX model to the browser\n\
    \nIf the intention is to load the PyTorch or Detectron2 models into the web server\
    \ environment, then the techniques described in the previous chapter should suffice.\
    \ Additionally, we can also deploy ONNX models into the web server environments.\
    \ However, in several cases, there might be a need to deploy deep learning models\
    \ into the web browser environments. Therefore, this section provides an example\
    \ of deploying the ONNX model exported in the previous section into a web browser\
    \ environment. For simplicity and consistency, let us use Google Colab to execute\
    \ our web application.\n\nThe following code snippet downloads the ONNX model\
    \ created in the previous section to the currently running instance of Google\
    \ Colab:\n\n```\n```bash\n!wget <url_to/Chapter13/onnx_model.onnx>\n```\n```\n\
    \nAdditionally, to execute the ONNX model on the browser, we need to download\
    \ onnx.js to the current folder using the following snippet:\n\n```\n```bash\n\
    !wget https://cdn.jsdelivr.net/npm/onnxjs/dist/onnx.min.js\n```\n```\n\nOnce the\
    \ downloads are complete, we can use the %%writefile directive to create an HTML\
    \ file called load_onnx.html in the current folder. This HTML file helps to load\
    \ the downloaded model and execute the model on an example input to verify the\
    \ process:\n\n```\n```html\n%%writefile load_onnx.html\n<html>\n\n  <head> </head>\n\
    \n  <body>\n    <div id=\"output\"></div>\n    <script src=\"onnx.min.js\">\n\
    \    </script>\n    <script>\n      const myOnnxSession = new onnx.InferenceSession();\n\
    ```\n"
  mdcn: "\n\nDetectron2 提供了一个名为 scripting_with_instances 的函数，用于使用 PyTorch 脚本化函数（torch.jit.script）执行导出。Detectron2\
    \ 模型使用 Instances 类，并且该类的属性可以在急切模式下动态添加。PyTorch 脚本化函数不支持这种动态行为。这就是为什么需要此辅助函数（scripting_with_instances）。它接受以下输入参数：\n\
    \n- model：这是使用脚本化方法导出的 Detectron2 模型\n- fields：它给出模型中 Instances 类使用的属性名称和类型\n\n\
    此方法创建一个名为 new_Instances 的类，与 Instances 类似但具有静态属性。静态属性必须使用辅助方法的 fields 输入参数声明。new_Instances\
    \ 类使模型可追踪。以下是此辅助函数的示例用法：\n\n```\nfields = {\n    \"proposal_boxes\": Boxes,\n\
    \    \"objectness_logits\": Tensor,\n    \"pred_boxes\": Boxes,\n    \"scores\"\
    : Tensor,\n    \"pred_classes\": Tensor,\n    \"pred_masks\": Tensor,\n    \"\
    pred_keypoints\": Tensor,\n    \"pred_keypoint_heatmaps\": Tensor,\n}\nmodel.eval()\n\
    scripted_model = scripting_with_instances(model, fields)\n```\n\n恭喜！你现在了解了帮助使用追踪和脚本化方法导出\
    \ Detectron2 模型的两个主要工具。让我们将这些方法应用于之前构建的自定义 Detectron2 模型的导出。\n\n## 导出自定义 Detectron2\
    \ 模型\n\n我们首先需要安装 Detectron2，加载数据集，并获取用于导出的训练好的模型及其配置文件：\n\n```\n# install\n!python\
    \ -m pip install \\\n'git+https://github.com/facebookresearch/detectron2.git'\n\
    # dataset\n```\n\n## 13\n将 Detectron2 模型部署到浏览器和移动环境\n\n本章介绍开放神经网络交换（ONNX）框架。该框架有助于在多个框架和平台之间共享深度神经网络。当需要将\
    \ Detectron2 模型部署到浏览器或移动环境时，它非常有帮助。本章还描述了 D2Go，这是一个用于以最小的内存存储和计算需求训练、量化并部署模型的框架。使用该框架创建的模型对于部署到移动或边缘设备非常有帮助。\n\
    \n到本章结束时，你将了解 ONNX 框架及其适用场景。你可以将自定义 Detectron2 模型导出为此格式并部署到 Web 或浏览器环境。你还将了解 D2Go\
    \ 框架的优势，并知道如何利用其 Model Zoo 上的预训练模型或使用 D2Go 训练自定义模型。你还可以对自定义模型进行量化，以进一步优化其内存并提高其计算时间。\n\
    \n具体来说，本章涵盖以下主题：\n\n- 使用 ONNX 部署 Detectron2 模型\n- 使用 D2Go 开发移动计算机视觉应用\n\n## 技术要求\n\
    \n你应已完成第 1 章，以便为 Detectron2 拥有合适的开发环境。\n所有代码、数据集和结果均可在本书的 GitHub 页面上获取，地址为 https://github.com/PacktPublishing/Hands-On-Computer-Vision-with-Detectron2。\n\
    \n```\nclass SimplePyTorchModel(nn.Module):\n    def __init__(self):\n       \
    \ super(SimplePyTorchModel, self).__init__()\n        self.linear = nn.Linear(4,\
    \ 1)\n        self.linear.weight.data.fill_(0.01)\n        self.linear.bias.data.fill_(0.01)\n\
    \n    def forward(self, X):\n        return torch.relu(self.linear(X))\n```\n\n\
    值得注意的是，我们无需训练模型，而是将权重和偏置固定为 0.01 以用于演示目的。以下代码片段随后创建了此简单神经网络的模型并将其置于评估模式：\n\n```\n\
    pt_model = SimplePyTorchModel()\npt_model.eval()\n```\n\n现在，我们已准备好使用虚拟输入将模型导出为\
    \ ONNX 格式：\n\n```\ndummy_X = torch.tensor([[1, 2, 3, 4]], dtype=torch.float32)\n\
    model_name = 'onnx_model.onnx'\ntorch.onnx.export(pt_model,\n    dummy_X, model_name,\
    \ verbose=True)\n```\n\n要测试导出的模型，我们首先需要使用以下语句安装 onnx 包：\n\n```\n!pip install onnx\n\
    ```\n\n安装 onnx 后，以下代码片段加载导出的 ONNX 模型，检查其是否格式良好，并打印其图以供检查：\n\n```\nimport onnx\n\
    from onnx.helper import printable_graph\n# load\nloaded_model = onnx.load(model_name)\n\
    # check (well formed)\nonnx.checker.check_model(loaded_model)\n# graph\nprint(printable_graph(loaded_model.graph))\n\
    ```\n\n要在 ONNX 模型中运行加载的模型，我们首先需要使用以下语句安装 onnxruntime 包：\n\n```\n!pip install onnxruntime\n\
    ```\n\n一旦运行时环境就绪，以下代码片段有助于创建推理会话并获取加载模型的输入名称：\n\n```\nimport onnxruntime as ort\n\
    ort_session = ort.InferenceSession(model_name)\ninput_name = ort_session.get_inputs()[0].name\n\
    print(input_name)\n```\n\n之前的代码片段应将 input_name 显示为 onnx::Gemm_0。此输入名称对于在对输入数据进行推理时为加载的模型创建输入对象非常重要，如以下代码片段所示：\n\
    \n```\nimport numpy as np\nX = np.array([[2, 3, 4, 5]])\noutputs = ort_session.run(\n\
    \    None,\n    {input_name: X.astype(np.float32)},\n)\nprint(outputs[0])\n```\n\
    \n之前的代码片段创建一个批输入 X，其中包含一个实例 [2, 3, 4, 5] 并对该输入进行预测。此代码片段应显示结果为 [[0.15]]。为了验证预测的准确性，我们也可以使用原始\
    \ PyTorch 模型对同一输入进行预测，如下所示：\n\n```\nX = torch.tensor([[2, 3, 4, 5]], dtype=torch.float32)\n\
    with torch.no_grad():\n    y = pt_model(X)\n    print(y)\n```\n\n此代码片段应显示与在 ONNX\
    \ 推理会话中执行的加载 ONNX 模型相同的输出（[[0.15]]）。\n\n可选地，如果你正在 Google Colab 上运行，可以运行以下代码片段以将此\
    \ ONNX 模型下载以供将来使用：\n\n```\n```python\nfrom google.colab import files\nfiles.download('onnx_model.onnx')\n\
    ```\n```\n\n我们现在应该已将 PyTorch 模型导出为 ONNX 格式。此模型可以部署在支持 ONNX 的各种框架和平台中。在下一节中，我们将将其部署到浏览器环境。\n\
    \n## 将 ONNX 模型加载到浏览器\n\n如果意图是将 PyTorch 或 Detectron2 模型加载到 Web 服务器环境中，则上一章中描述的技术就足够了。此外，我们还可以将\
    \ ONNX 模型部署到 Web 服务器环境中。然而，在许多情况下，可能需要将深度学习模型部署到 Web 浏览器环境中。因此，本节提供了一个将上一节导出的\
    \ ONNX 模型部署到 Web 浏览器环境的示例。为简单和一致起见，让我们使用 Google Colab 来执行我们的 Web 应用程序。\n\n以下代码片段将上一节创建的\
    \ ONNX 模型下载到当前运行的 Google Colab 实例中：\n\n```\n```bash\n!wget <url_to/Chapter13/onnx_model.onnx>\n\
    ```\n```\n\n此外，为了在浏览器上执行 ONNX 模型，我们需要使用以下片段将 onnx.js 下载到当前文件夹：\n\n```\n```bash\n\
    !wget https://cdn.jsdelivr.net/npm/onnxjs/dist/onnx.min.js\n```\n```\n\n下载完成后，我们可以使用\
    \ %%writefile 指令在当前文件夹中创建一个名为 load_onnx.html 的 HTML 文件。此 HTML 文件有助于加载下载的模型并在示例输入上执行模型以验证流程：\n\
    \n```\n```html\n%%writefile load_onnx.html\n<html>\n\n  <head> </head>\n\n  <body>\n\
    \    <div id=\"output\"></div>\n    <script src=\"onnx.min.js\">\n    </script>\n\
    \    <script>\n      const myOnnxSession = new onnx.InferenceSession();\n```\n"
