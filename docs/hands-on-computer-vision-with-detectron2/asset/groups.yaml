    \ = y\n    else:\n        _0 = torch.neg(y)\n    return _0\n```\n\nObservably,\
    \ this is different from the tracing approach as the TorchScript code of the exported\
    \ model now contains the control flow section. Additionally, the following code\
    \ snippet should display the parameters of the exported model (as 0.01 for all\
    \ parameters):\n\n```\nfor p in scripted_model.parameters():\n    print(p.data)\n\
    ```\n\nFurthermore, we can use the exported model to perform a prediction on the\
    \ X input prepared previously to inspect the result:\n\n```\nscripted_model.to(device)\n\
    with torch.no_grad():\n    y = scripted_model(X)\n    print(y)\n```\n\nThe prediction\
    \ result should be exactly the same as what was produced by the original model\
    \ (tensor([[0.1100]], device='cuda:0')). Additionally, we can save the model to\
    \ the hard drive, load it back, display the parameter values for the loaded models,\
    \ perform the prediction, and verify the result again:\n\n```\n# save\nscripted_model.to(\"\
    cpu\").save(\"scripted_model.pt\")\n# load\nloaded_model = torch.jit.load(\"scripted_model.pt\"\
    )\n# loaded parameters\nfor p in loaded_model.parameters():\n    print(p)\n# prediction\n\
    loaded_model.to(device)\nloaded_model(X)\n```\n\nYou may also download these models\
    \ for future use if you are running this notebook on Google Colab:\n\n```\nfrom\
    \ google.colab import files\nfiles.download('scripted_model.pt')\nfiles.download('pt_model.pt')\n\
    ```\n\nThe tracing and scripting approaches have their strengths and weaknesses.\
    \ The following section introduces the mixed approach to leverage the best of\
    \ both.\n\n# Mixing tracing and scripting approaches\n\nThe tracing approach is\
    \ simple and straightforward but does not properly record the models containing\
    \ control flows and loops. The scripting approach can mitigate this limitation\
    \ of the tracing approach. However, its supported syntax/code might be limited.\
    \ Therefore, combining the two approaches may be beneficial in several cases.\n\
    \n```\nadd_executable(cppapp cppapp.cpp)\ntarget_link_libraries(cppapp \"${TORCH_LIBRARIES}\"\
    )\nset_property(TARGET cppapp PROPERTY CXX_STANDARD 14)\n```\n\nNotably, if executing\
    \ on Windows, it is recommended you add an additional section at the end for this\
    \ file:\n\n```\nif (MSVC)\n  file(GLOB TORCH_DLLS \"${TORCH_INSTALL_PREFIX}/lib/*.dll\"\
    )\n  add_custom_command(TARGET cppapp\n                    POST_BUILD\n      \
    \              COMMAND ${CMAKE_COMMAND} -E copy_if_different\n               \
    \             ${TORCH_DLLS}\n                            $<TARGET_FILE_DIR:cppapp>)\n\
    endif (MSVC)\n```\n\nSimilarly, the following code snippet utilizes the %%writefile\
    \ directive to create a .cpp file of a C++ application that loads a TorchScript\
    \ model, prepares an example input, performs the prediction, and displays the\
    \ predicted results:\n\n```\n%%writefile cppapp/cppapp.cpp\n#include <torch/script.h>\n\
    #include <iostream>\n#include <memory>\n\nint main(int argc, const char* argv[])\
    \ {\n    torch::jit::script::Module module =\n    torch::jit::load(argv[1]);\n\
    \    std::cout << \"Loaded the module\\n\";\n    float data[] = {1, 2, 3, 4};\n\
    \    torch::Tensor tensor = torch::from_blob(data, {4});\n    std::vector<torch::jit::IValue>\
    \ inputs;\n    inputs.push_back(tensor);\n    at::Tensor output = module.forward(inputs).toTensor();\n\
    \    std::cout << \"pred result\" << output << '\\n';\n}\n```\n\n# Detectron2\
    \ utilities for exporting models\n\nDetectron2 provides a wrapper class called\
    \ TracingAdapter, which helps wrap a Detectron2 model and supports exports using\
    \ the tracing method. Detectron2 models take rich inputs and also produce rich\
    \ outputs (i.e., they can be dictionaries or objects). Conversely, the tracing\
    \ function (torch.jit.trace) takes tensors as inputs/outputs. Therefore, this\
    \ adapter class helps flatten the inputs of Detectron2 models as tensors so they\
    \ are traceable. Additionally, it also provides the utilities to reconstruct model\
    \ outputs as rich outputs from flattened results as tensors. This class takes\
    \ the following input parameters:\n\n+   - model: This is a Detectron2 model to\
    \ be exported.\n+   - inputs: This can be rich inputs (e.g., dictionaries or objects)\
    \ and flattened by this class to produce tensors for tracing.\n+   - inference_func:\
    \ This is an optional callable that can be used to replace the model inference\
    \ if needed.\n+   - allow_non_tensor: This dictates whether inputs/outputs can\
    \ contain non-tensor objects. It filters out non-tensor objects to make the model\
    \ traceable but cannot reconstruct the rich inputs/outputs if enabled. The default\
    \ value for this input parameter is False.\n\nIt has the forward method that wraps\
    \ the original model forward method. This method provides flattened outputs that\
    \ can be converted to rich outputs using the schema (outputs_schema) recorded\
    \ by this class. It also provides a data member (flattened_inputs) to store the\
    \ flattened inputs. The following is an example usage of this class:\n\n```\n\
    # adapter can use rich inputs\nadapter = TracingAdapter(model, inputs)\n# trace\
    \ with flattened inputs\ntraced = torch.jit.trace(adapter, adapter.flattened_inputs)\n\
    # produces flattened outputs\nflattened_outputs = traced(*adapter.flattened_inputs)\n\
    # convert flattened outputs to rich outputs\noutputs = adapter.outputs_schema(flattened_outputs)\n\
    ```\n\nThe TraceAdapter class supports the tracing and ONNX (more on this in the\
    \ next chapter) methods of exporting.\n"
  mdcn: "\n具体来说，它包含了原始模型 `forward` 方法的 TorchScript 格式代码。接下来，我们准备使用跟踪模型对之前创建的相同输入（X）执行预测：\n\
