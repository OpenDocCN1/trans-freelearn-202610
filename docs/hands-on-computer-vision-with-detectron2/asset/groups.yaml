  - '[PAGE 108]


    # Summary


    This chapter dives deep into the components of Detectron2’s implementation of
    Faster R-CNN for object detection tasks. This model is a two-stage technique:
    region proposal stage and region of interest extraction stage. Both of these stages
    use the features extracted from a backbone network. This backbone network can
    be any state-of-the-art convolutional neural network to extract salient features
    from the input images. The extracted features and information to generate a set
    of initial anchors (sizes and ratios; *Chapter 7* explains more about how to customize
    these sizes and ratios) are then passed to the region proposal neural network
    to predict a fixed number of proposals with objectness scores (if there is an
    object in a proposal) and location deltas (location differences between the predicted
    proposals and the raw anchors). The selected proposals are then passed to the
    second stage with the region of interest heads to predict the final object classification
    and localization. Understanding these components in depth prepares you well for
    model customizations and optimizations to build better models on custom datasets
    in the next chapters.


    Congratulations! By this point, you should have profound knowledge about the architecture
    of Detectron2 in general and its implementation of Faster R-CNN for object detection
    models. In the next chapter, you will train custom object detection models using
    Detectron2.'
