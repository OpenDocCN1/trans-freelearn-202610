    Next, install Detectron2 and register the train/test datasets using the exact
    code snippets provided in the previous section. Additionally, before training,
    run the following code snippet to prepare a logger that Detectron2 uses to log
    training/inferencing information:


    ```

    from detectron2.utils.logger import setup_logger

    logger = setup_logger()

    ```


    After having the datasets registered and setting up the logger, the next step
    is getting a training configuration. Precisely, we set the output directory (where
    we will store the logging events and the trained models), the path to store the
