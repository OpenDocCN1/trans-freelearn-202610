  - '[PAGE 181]


    +   - **Saturation:** This technique changes how colorful the color channel of
    the input images is. It is analogous to mixing some amount of white color with
    the current color. For instance, adding some white amount to a blue color makes
    it less blue.

    +   - **Brightness:** This technique changes the light conditions of the input
    images. It is analogous to shedding some amount of light to color. If there is
    no light, the input becomes black.

    +   - **Exposure:** This technique is similar to brightness. However, exposure
    is biased to highlight tones, while brightness changes all tones equally.

    +   - **Grayscale:** This technique changes the input image to a single-channel
    image. In other words, the pixel values typically range from 0 to 255, and it
    is a single channel, or if it retains three channels, all channels have the same
    value per pixel location.

    +   - **Blur:** This technique smoothen the images to help the model be more robust
    to camera focus. For instance, if Gaussian blur is used, a given pixel takes the
    weighted average of pixels surrounding it (the weights follow a Gaussian distribution).

    +   - **Noise:** This technique adds random noise (typically salt-and-pepper noise)
    to the image and creates a new version. This technique makes the training models
    more robust to camera artifacts and tackles adversarial attacks.


    Now, let’s look at geometric distortions.


    # Geometric distortions


    This category of image augmentations includes techniques such as flip, crop, rotation,
    and shear. Figure 8.2 illustrates examples of these techniques:


    ![](img/0e7994c850a84b7a53d34c7f943c7edd_181_0.png)


    ![](img/0e7994c850a84b7a53d34c7f943c7edd_181_1.png)


