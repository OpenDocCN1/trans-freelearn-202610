    that we must select a pre-trained model with configuration for the object segmentation
    task instead of the detection task. Therefore, we change the corresponding paths
    for the configuration and model weights as follows:


    ```

    config_file = "<url_to/mask_rcnn_R_50_C4_1x.yaml>"

    checkpoint_url = "<url_to/mask_rcnn_R_50_C4_1x.yaml>"

    ```


    Once again, as discussed in *Chapter 2*, other models are available, and there
    are trade-offs between selecting one versus the others. This selection selects
    this model (Res50C4) due to its simplicity. The backbone and region proposal networks
    remain the same and work similarly for object detection tasks. The Region of Interest
    Heads (`roi_heads`) has one additional head called the mask head (`mask_head`).
    Therefore, the output of the following code snippet reflects the differences:


    ```

    roi_heads = predictor.model.roi_heads

    print(roi_heads)

    ```


    This snippet, besides pooler, res5, and box_predictor as in *Chapter 4*, also
    displays the mask head as the following:


    ```

    (mask_head): MaskRCNNConvUpsampleHead(

    (deconv): ConvTranspose2d(2048, 256, kernel_size=(2, 2),

    stride=(2, 2))

    (deconv_relu): ReLU()

    (predictor): Conv2d(256, 80, kernel_size=(1, 1), stride=(1, 1))

    )

    ```


