    # About the reviewers


    **Yiqiao Yin** is a senior data scientist at an S&P 500 company LabCorp, developing
    AI-driven solutions for drug diagnostics and development. He has a BA in mathematics
    and a BSc in finance from the University of Rochester. He was a PhD student in
    statistics at Columbia University and has a wide range of research interests in
    representation learning: feature learning, deep learning, computer vision, and
    natural language processing. He has held professional positions as an enterprise-level
    data scientist at EURO STOXX 50 company Bayer, a quantitative researcher at AQR,
    working on alternative quantitative strategies to portfolio management and factor-based
    trading, and an equity trader at T3 Trading on Wall Street.


    **Nikita Dalvi** is a highly skilled and experienced technical professional, currently
    pursuing a master''s degree in computing and data science at Sam Houston State
    University. With a background in information and technology, she has honed her
    skills in programming languages such as Java and Python over the past five years,
    having worked with prestigious organizations such as Deloitte and Tech Mahindra.
    Driven by her passion for programming, she has taught herself new languages and
    technologies over the years and stayed up to date with the latest industry trends
    and best practices.'
