    \ Save Dir** 菜单更改标注目录。\n\n每张图像对应一个带有 YOLO 格式标注的 `.txt` 文件，保存到所选目录中，文件名与图像同名。名为\
    \ `classes.txt` 的文件也会保存在该文件夹中。\n\n此外，以下快捷键有助于快速标注：\n\n- *W 键*：创建边界框\n- *D 键*：切换到下一张图像\n\
