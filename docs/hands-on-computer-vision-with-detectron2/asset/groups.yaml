    \ the size of the cropping region (solid box):\n\n![](img/0e7994c850a84b7a53d34c7f943c7edd_198_0.png)\n\
    \n![](img/0e7994c850a84b7a53d34c7f943c7edd_198_1.png)\n\nFigure 8.12: Original\
    \ image and the ground-truth box and their random-extent versions\n\n## The RandomFlip\
    \ class\ntakes a probability (`prob`) and two Boolean values (`horizontal` and\
    \ `vertical`). The `prob` parameter is used to decide whether or not to perform\
