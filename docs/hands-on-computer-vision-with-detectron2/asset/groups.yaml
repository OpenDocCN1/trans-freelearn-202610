  mdcn: "\n\n大多数配置参数与 Detectron2 模型相同：创建配置、将其与现有配置文件合并以及下载预训练权重。我们现在可以使用配置（cfg）构建模型并使用脑肿瘤数据集训练该模型：\n\
    \n```\nmodel = runner.build_model(cfg)\nrunner.do_train(cfg, model, resume=False)\n\
    ```\n\n显然，与训练 Detectron2 模型相比，训练此模型所需的时间要少得多，因为它是一个轻量级模型。让我们在测试数据集上评估训练好的模型：\n\
    \n```\nmetrics = runner.do_test(cfg, model)\nprint(metrics)\n```\n\n由于训练过程中的随机性，输出结果可能每次运行都不同。然而，在交并比（Intersection\
    \ over Union，IoU）下的平均精度（Average Precision，AP）应约为 0.48，这是一个相当不错的评估结果。我们可以使用与上一节类似的代码对一些样本数据进行预测并可视化结果，以定性评估训练模型的性能。\n\
    \n该训练模型轻量级，旨在部署到移动环境中。然而，它仍然使用 32 位浮点数来存储其权重和激活值；因此，它仍然被认为效率低下。如果需要进一步压缩模型空间，模型量化技术就派上用场了。下一节将详细讨论该技术。\n\
    \n## 模型量化\n\n模型量化是一种有助于在精度略有损失的情况下降低深度神经网络计算复杂度和内存占用的技术。具体来说，深度学习模型通常以 32 位浮点数的形式存储其权重和激活值，而这种高精度数字格式需要大量的数据存储和计算时间。因此，模型量化通过将权重和激活值转换为较低精度的数据类型（如\
    \ 8 位整数）来解决此问题。这种降低有助于减少内存使用和计算时间。值得注意的是，虽然量化可以显著降低模型的内存和计算需求，但也可能导致模型精度的损失。\n\
    \n延续上一节，让我们先通过以下代码片段打印出训练模型第一个参数的数据类型：\n\n```\nfor name, param in model.named_parameters():\n\
    \    if param.requires_grad:\n        print(name, param.data.dtype)\n        break\n\
    ```\n\n## 总结\n\n本章介绍了 ONNX 模型格式以及支持它的平台和框架。该框架有助于使 Detectron2 模型能够与不同框架和平台互操作。它随后提供了将\
    \ Detectron2 模型导出到该格式的步骤以及在浏览器环境中部署导出模型的代码。本章还介绍了 D2Go，这是一个用于以最小的内存存储和计算资源训练、优化和部署计算机视觉应用神经网络的框架。此外，其模型可进一步使用量化技术进行优化，该技术将模型权重和激活值转换为低精度数字系统。这种量化步骤进一步降低了模型内存需求并提高了计算性能。因此，D2Go\
    \ 模型适合部署到移动或边缘设备。D2Go 在其 Model Zoo 上也有预训练模型。因此，本章提供了使用 D2Go Model Zoo 上现有模型构建计算机视觉应用的步骤。它还提供了使用\
    \ D2Go 工具训练自定义 D2Go 模型并执行量化的步骤。\n\n恭喜，并感谢您跟随到最后一章！您现在应该认为自己是使用 Detectron2 开发实用计算机视觉应用的专家。此外，本书中提供的理论应有助于您探索其他计算机视觉深度学习架构，例如\
    \ **You Only Look Once (YOLO)**。\n\n## 索引\n\n### A\n\n- anchor ratios\n  - computing\
