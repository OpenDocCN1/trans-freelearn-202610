    \n![](img/0e7994c850a84b7a53d34c7f943c7edd_194_0.png)\n\nFigure 8.9: Source image,\
    \ destination image, and their blended versions\n\n- **The PadTransform class**\
    \ pads x0, y0, x1, and y1 pixels with `pad_value` (the default is 0.0) and `seg_pad_value`\
    \ (the default is 0) to the left, top, right, and bottom of the input image and\
    \ the segmentation mask (if there is one), respectively. Additionally, you can\
    \ specify the original width and height (`orig_w` and `orig_h`) if you want to\
    \ make this transformation invertible.\n\n- **The TransformList class** extends\
    \ the `Transform` class and, thus, has similar methods for performing transformation\
    \ operations. It accepts the input parameter as a list of transformations (`transforms`)\
    \ and maintains it as an attribute. Its method applies all the transformations\
    \ in this list to the input sequentially. For instance, a `TransformList` object\
    \ has a `CropTransform` object and a `PadTransform` object in its `transforms`\
    \ attribute. Calling the `apply_image` method of this object first crops the image,\
    \ then pads it. This scenario helps train robust models to detect objects outside\
    \ their specific contents. For example, cropping the snowy background out from\
    \ the Husky forces the models to learn features from the Husky instead of its\
    \ background context.\n\nThe following code snippet illustrates how to use the\
    \ `CropTransform`, `PadTransform`, and `TransformList` classes:\n\n```python\n\
    x0, y0, w, h = (130, 130, 250, 310)\ny1, x1 = img.shape[:2] - np.array([y0+h,\
    \ x0+w])\ncr_tfm = T.CropTransform(x0, y0, w, h)\npd_tfm = T.PadTransform(x0,\
    \ y0, x1, y1)\nlst_tfm = T.TransformList([cr_tfm, pd_tfm])\nlst_img = lst_tfm.apply_image(img)\n\
    lst_boxes = lst_tfm.apply_box(boxes)\nvisualize_image_boxes(lst_img, boxes = lst_boxes)\n\
    ```\n"
