    \ + sum_b)\n\n所有这些值都存储并可从批次数据计算。因此，新均值相应更新。类似地，此新数据集的平方差之和如下：\n\nssd_n = \\sum_{i=1}^{n_c}\
    \ (x_i - \\overline{x_n})^2 + \\sum_{j=1}^{n_b} (b_j - \\overline{x_n})^2 = \\\
    sum_{i=1}^{n_c} (x_i - \\overline{x_n})^2 + ssd_b\n\n批次的平方差之和（ssd_b）可以从当前批次数据计算。然而，我们需要展开计算的另一部分，即当前数据项相对于新均值的平方差之和，如下：\n\
    \nssd_{c_new_mean} = \\sum_{i=1}^{n_c} (x_i - \\overline{x_n})^2 = \\sum_{i=1}^{n_c}\
    \ (x_i)^2 - 2\\overline{x_n}\\sum_{i=1}^{n_c} x_i + n_c (\\overline{x_n})^2 =\
    \ \\sum_{i=1}^{n_c} (x_i)^2 - 2\\overline{x_n} sum_c + n_c (\\overline{x_n})^2\n\
    \n类似地，我们可以有当前项目列表的平方差之和：\n\nssd_c = \\sum_{i=1}^{n_c} (x_i - \\overline{x_c})^2\
    \ = \\sum_{i=1}^{n_c} (x_i)^2 - 2\\overline{x_c}\\sum_{i=1}^{n_c} x_i + n_c (\\\
    overline{x_c})^2 = \\sum_{i=1}^{n_c} (x_i)^2 - 2\\overline{x_c} sum_c + n_c (\\\
    overline{x_c})^2\n\n然后，已见项目的平方和可以写成如下：\n\n\\sum_{i=1}^{n_c} (x_i)^2 = ssd_c +\
    \ 2\\overline{x_c} sum_c - n_c (\\overline{x_c})^2\n\n现在，我们可以计算当前项目相对于新均值的平方差之和如下：\n\
    \nssd_{c_new_mean} = ssd_c + 2\\overline{x_c} sum_c - n_c (\\overline{x_c})^2\
    \ - 2\\overline{x_n} sum_c + n_c (\\overline{x_n})^2\n\n"
