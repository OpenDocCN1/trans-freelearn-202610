    # Common data sources


    *Chapter 2 introduced the two most common datasets for the computer vision community.
    They are **ImageNet** and Microsoft **COCO (Common Objects in Context)**. These
    datasets also contain many pre-trained models that can predict various class labels
    that may meet your everyday needs.*


    If your task is to detect a less common class label, it might be worth exploring
    the **Large Vocabulary Instance Segmentation (LVIS)** dataset. It has more than
    1,200 categories and 164,000 images, and it contains many rare categories and
    about 2 million high-quality instance segmentation masks. Detectron2 also provides
    pre-trained models for predicting these 1,200+ labels. Thus, you can follow the
    steps described in *Chapter 2* to create a computer vision application that meets
    your needs. More information about the LVIS dataset is available on its website
    at https://www.lvisdataset.org.


    If you have a task where no existing/pre-trained models can meet your needs, it
    is time to find existing datasets and train your model. One of the common places
    to look for datasets is **Kaggle** (https://www.kaggle.com). Kaggle is a Google
    subsidiary. It provides an online platform for data scientists and machine learning
    practitioners to share datasets, train machine learning models, and share the
    trained models and their thoughts via discussions. It also often holds and allows
    users to host data science and machine learning competitions (including computer
    vision competitions, of course). At the time of writing, searching the phrase
    “object detection” on Kaggle brings 555 datasets, as shown in *Figure 3.1.*


    ![](img/0e7994c850a84b7a53d34c7f943c7edd_63_0.png)


    Figure 3.1: Datasets on Kaggle for object detection tasks


