    +   - **The PadTransform class** pads x0, y0, x1, and y1 pixels with `pad_value`
    (the default is 0.0) and `seg_pad_value` (the default is 0) to the left, top,
    right, and bottom of the input image and the segmentation mask (if there is one),
    respectively. Additionally, you can specify the original width and height (`orig_w`
    and `orig_h`) if you want to make this transformation invertible.

    +   - **The TransformList class** extends the `Transform` class and, thus, has
    similar methods for performing transformation operations. It accepts the input
    parameter as a list of transformations (`transforms`) and maintains it as an attribute.
    Its method applies all the transformations in this list to the input sequentially.
    For instance, a `TransformList` object has a `CropTransform` object and a `PadTransform`
    object in its `transforms` attribute. Calling the `apply_image` method of this
    object first crops the image, then pads it. This scenario helps train robust models
    to detect objects outside their specific contents. For example, cropping the snowy
    background out from the Husky forces the models to learn features from the Husky
    instead of its background context.


    The following code snippet illustrates how to use the `CropTransform`, `PadTransform`,
    and `TransformList` classes:


    ```

    ```python

    x0, y0, w, h = (130, 130, 250, 310)

    y1, x1 = img.shape[:2] - np.array([y0+h, x0+w])

    cr_tfm = T.CropTransform(x0, y0, w, h)

    pd_tfm = T.PadTransform(x0, y0, x1, y1)

    lst_tfm = T.TransformList([cr_tfm, pd_tfm])

    lst_img = lst_tfm.apply_image(img)

    lst_boxes = lst_tfm.apply_box(boxes)

    visualize_image_boxes(lst_img, boxes = lst_boxes)

    ```

