    (sum_b and ssd_b) are computable over this batch. The mean (\overline{x_n}) of
    the new dataset should be as follows:


    \overline{x_n} = \frac{1}{n_c + n_b} (sum_c + sum_b) = \frac{1}{n_c + n_b} (n_c
    \overline{x_c} + sum_b)


    All these values are stored and computable from the batch data. Therefore, the
    new mean is updated accordingly. Similarly, the sum of the squared differences
    of this new dataset is as follows:


    ssd_n = \sum_{i=1}^{n_c} (x_i - \overline{x_n})^2 + \sum_{j=1}^{n_b} (b_j - \overline{x_n})^2
    = \sum_{i=1}^{n_c} (x_i - \overline{x_n})^2 + ssd_b


    The sum of squared differences for the batch (ssd_b) can be computed from the
    current batch data. However, we need to unpack the other part of the computation
    as the sum of squared differences of the current data items with respect to the
    new mean, as follows:


    ssd_{c_new_mean} = \sum_{i=1}^{n_c} (x_i - \overline{x_n})^2 = \sum_{i=1}^{n_c}
    (x_i)^2 - 2\overline{x_n}\sum_{i=1}^{n_c} x_i + n_c (\overline{x_n})^2 = \sum_{i=1}^{n_c}
    (x_i)^2 - 2\overline{x_n} sum_c + n_c (\overline{x_n})^2


    Similarly, we can have the sum of squared differences for the list of current
    items:


    ssd_c = \sum_{i=1}^{n_c} (x_i - \overline{x_c})^2 = \sum_{i=1}^{n_c} (x_i)^2 -
    2\overline{x_c}\sum_{i=1}^{n_c} x_i + n_c (\overline{x_c})^2 = \sum_{i=1}^{n_c}
    (x_i)^2 - 2\overline{x_c} sum_c + n_c (\overline{x_c})^2


    Then, the sum of squares of the previously seen items can be written as follows:


    \sum_{i=1}^{n_c} (x_i)^2 = ssd_c + 2\overline{x_c} sum_c - n_c (\overline{x_c})^2


    Now, we can compute the sum of squared differences of the current items with respect
    to the new mean as follows:


    ssd_{c_new_mean} = ssd_c + 2\overline{x_c} sum_c - n_c (\overline{x_c})^2 - 2\overline{x_n}
    sum_c + n_c (\overline{x_n})^2'
  md: "\nThis algorithm has the following steps:\n\n- 1. Start with the initial sizes\
