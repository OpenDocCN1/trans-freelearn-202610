    Specifically, it is *faster* and more accurate because while reimplementing the
    cutting-edge algorithms, there is the chance that Detectron2 will find suboptimal
    implementation parts or obsolete features from older versions of these algorithms
    and re-implement them. It is *modular*, or it divides its implementation into
    sub-parts. The parts include the input data, backbone network, region proposal
    heads, and prediction heads (the next section covers more information about these
    components). It is *customizable*, meaning its components have built-in implementations,
    but they can be customized by calling new implementations. Finally, it is built
    on top of PyTorch, meaning that many developer resources are available online
    to help develop applications with Detectron2.


    Furthermore, Detectron2 provides *pre-trained models* with state-of-the-art detection
    results for CV tasks. These models were trained with many images on high computation
    resources at the Facebook research lab that might not be available in other institutions.


    These pre-trained models are published on its Model Zoo and are free to use: https://github.com/facebookresearch/detectron2/blob/main/MODEL_ZOO.md.


    These pre-trained models help developers develop typical CV applications quickly
    without collecting, preparing many images, or requiring high computation resources
    to train new models. However, suppose there is a need for developing a CV task
    on a specific domain with a custom dataset. In that case, these existing models
    can be the starting weights, and the whole Detectron2 model can be trained again
    on the custom dataset.


    Finally, we can convert Detectron2 models into *deployable artifacts*. Precisely,
    we can convert Detectron2 models into standard file formats of standard deep learning
    frameworks such as `TorchScript`, `Caffe2 protobuf`, and `ONNX`. These files can
    then be deployed to their corresponding runtimes, such as PyTorch, Caffe2, and
    ONNX Runtime. Furthermore, Facebook AI Research also published **Detectron2Go
    (D2Go)**, a platform where developers can take their Detectron2 development one
    step further and create models optimized for mobile devices.


    In summary, Detectron2 implements cutting-edge detection algorithms with the advantage
    of being fast, accurate, modular, and built on top of PyTorch. Detectron2 also
    provides pre-trained models so users can get started and quickly build CV applications
    with state-of-the-art results. It is also customizable, so users can change its
    components or train CV applications on a custom business domain. Furthermore,
    we can export Detectron2 into scripts supported by standard deep learning framework
    runtimes. Additionally, initial research called Detectron2Go supports developing
    Detectron2 applications for edge devices.


    In the next section, we will look into Detectron2 architecture to understand how
    it works and the possibilities of customizing each of its components.'
