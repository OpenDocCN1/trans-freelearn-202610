    \ 在每次训练步骤中根据损失函数的导数更新其值的幅度。这些是梯度下降算法的两个基本超参数。\n\n例如，当前参数 $w$ 为 4，选择的学习率为 $η =\
    \ 0.1$。该损失函数的切线（虚线）的斜率是导数 $∇L(4) = 4$。在这一点，$w$ 应该向左移动，即 $w = 3.6$。类似地，后续步骤应对应\
    \ $w = 3.28, 3.024$，等等。如果我们继续这样做，损失函数最终会收敛到最优点，前提是步长足够小。值得注意的是，当损失函数的导数幅度变小时，步长也会变小。\n\
    \n此时，问题是如何选择训练的 epoch 数和学习率。一般来说，选择较小的学习率会使学习过程变慢，模型收敛需要很长时间。另一方面，较大的学习率可能导致 $w$\
    \ 参数左右波动且不收敛等问题。\n\n让我们采用一个简单的代码方法来演示这些思想。以下代码片段定义了损失函数（在训练数据上计算）及其对应的导数：\n\n\
