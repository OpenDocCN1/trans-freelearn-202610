  - '[PAGE 3]


    # Foreword


    I have known and worked with Van Vung Pham for more than 10 years and was also
    his academic advisor for his doctoral degree. Vung won several data visualization,
    computer vision, and machine learning challenges during his Ph.D. program, including
    using Detectron2 to detect and classify road damage. In this book, *Hands-On Computer
    Vision with Detectron2*, Vung takes you on a learning journey that starts with
    common computer vision tasks. He then walks you through the steps for developing
    computer vision applications using stunning deep-learning models with simple code
    by utilizing pre-trained models on the Detectron2 Model Zoo.


    Existing models, trained on huge datasets, and for the most common object types,
    can meet common computer vision tasks. However, this book also focuses on developing
    computer vision applications on a custom domain for specific business requirements.
    For this, Vung provides the steps to collect and prepare data, train models, and
    fine-tune models on brain tumor datasets for object detection and instance segmentation
    tasks to illustrate how to develop computer vision applications on custom business
    domains.


    In his presentations and examples, Vung provides code that can be conveniently
    executed on Google Colab and visualizations to help illustrate theoretical concepts.
    The ability to execute the code on Google Colab helps eliminate the burden of
    hardware and software setup, so you can get started quickly and conveniently.
    The visualizations allow you to easily grasp complicated computer vision concepts,
    better understand deep learning architectures for computer vision tasks, and become
    an expert in this area.


    Beyond developing deep learning models for computer vision tasks, you will learn
    how to deploy the trained models to various environments. Vung explains different
    model formats, such as TorchScript and ONNX formats, and their respective execution
    platforms and environments, such as C++ servers, web browsers, or mobile and edge
    devices.


    Become a developer and an expert in developing and deploying computer vision applications
    with Detectron2.


    — *Tommy Dang*


    *iDVL director and assistant professor, Texas Tech University*'
