  - "[PAGE 300]\n\nMost of the configuration parameters are the same as those for\
    \ the Detectron2 model: creating a configuration, merging it with an existing\
    \ configuration file, and downloading pre-trained weights. We are now ready to\
    \ build a model using the configuration (cfg) and train this model using the brain\
    \ tumor dataset:\n\n```\nmodel = runner.build_model(cfg)\nrunner.do_train(cfg,\
    \ model, resume=False)\n```\n\nObservably, this model should take a lot less time\
    \ to train compared to training the Detectron2 model because it is a lightweight\
    \ model. Let us evaluate the trained model on the test dataset:\n\n```\nmetrics\
    \ = runner.do_test(cfg, model)\nprint(metrics)\n```\n\nThe output could be different\
    \ from run to run due to randomness during the training process. However, the\
    \ Average Precision (AP) at Intersection over Union (IoU) should be about 0.48,\
    \ which is a reasonably good evaluation result. We can use code similar to the\
    \ previous section to make predictions on some sample data and visualize the results\
    \ to evaluate the performance of the trained model qualitatively.\n\nThis trained\
    \ model is lightweight and meant to be deployed on mobile environments. However,\
    \ it still uses 32-bit floating point numbers to store its weights and activations;\
    \ therefore, it is still considered inefficient. If the model space needs to be\
    \ compressed even more, the model quantization technique comes in handy. The next\
    \ section discusses this technique in detail.\n\n# Model quantization\n\nModel\
    \ quantization is a technique that helps to reduce computational complexity and\
    \ memory footprint with a little trade-off of accuracy for deep neural networks.\
    \ Specifically, deep learning models often store their weights and activations\
    \ in 32-bit floating-point numbers, and this high-precision number format requires\
    \ a large amount of data storage and computation time. Therefore, model quantization\
    \ tackles this problem by converting the weights and activations to lower precision\
    \ data types, such as 8-bit integers. This reduction helps reduce memory usage\
    \ and computation time. Notably, while quantization can significantly reduce the\
    \ memory and computation requirements of a model, it can also cause a loss in\
    \ model accuracy.\n\nContinuing from the previous section, let us start by printing\
    \ out the data type for the first parameter of the trained model using the following\
    \ code snippet:\n\n```\nfor name, param in model.named_parameters():\n    if param.requires_grad:\n\
    \        print(name, param.data.dtype)\n        break\n```"
