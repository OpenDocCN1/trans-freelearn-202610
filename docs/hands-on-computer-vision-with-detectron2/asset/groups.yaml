    \nFigure 1.2: The main components of Detectron2\n\nDetectron2 has a modular architecture.\
    \ Figure 1.2 depicts the four main modules in a standard Detectron2 application.\
    \ The first module is for registering input data (Input Data).\n\nThe second module\
    \ is the backbone to extract image features (Backbone), followed by the third\
    \ one for proposing regions with and without objects to be fed to the next training\
    \ stage (Region Proposal). Finally, the last module uses appropriate heads (such\
    \ as detection heads, instance segmentation heads, keypoint heads, semantic segmentation\
    \ heads, or panoptic heads) to predict the regions with objects and classify detected\
    \ objects into classes. Chapter 3 to Chapter 5 discuss these components for building\
    \ a CV application for object detection tasks, and Chapter 10 and Chapter 11 detail\
    \ these components for segmentation tasks. The following sections briefly discuss\
    \ these components in general.\n\n# The input data module\n\nThe input data module\
    \ is designed to load data in large batches from hard drives with optimization\
    \ techniques such as caching and multi-workers. Furthermore, it is relatively\
    \ easy to plug data augmentation techniques into a data loader for this module.\
    \ Additionally, it is designed to be customizable so that users can register their\
    \ custom datasets. The following is the typical syntax for assigning a custom\
    \ dataset to train a Detectron2 model using this module:\n\n```\nDatasetRegistry.register(\n\
    \    'my_dataset',\n    load_my_dataset\n)\n```"
  - "[PAGE 28]\n\n# The backbone module\n\nThe backbone module extracts features from\
    \ the input images. Therefore, this module often uses a cutting-edge convolutional\
    \ neural network such as ResNet or ResNeXt. This module can be customized to call\
    \ any standard convolutional neural network that performs well in an image classification\
    \ task of interest. Notably, this module has a great deal of knowledge about transfer\
    \ learning. Specifically, we can use those pre-trained models here if we want\
    \ to use a state-of-the-art convolution neural network that works well with large\
    \ image datasets such as ImageNet. Otherwise, we can choose those simple networks\
    \ for this module to increase performance (training and prediction time) with\
    \ the accuracy trade-off. Chapter 2 will discuss selecting appropriate pre-trained\
    \ models on the Detectron2 Model Zoo for common CV tasks.\n\nThe following code\
    \ snippet shows the typical syntax for registering a custom backbone network to\
    \ train the Detectron2 model using this module:\n\n```\n@BACKBONE_REGISTRY.register()\n\
    class CustomBackbone(Backbone):\n    pass\n```\n\n# The region proposal module\n\
    \nThe next module is the region proposal module (Region Proposal). This module\
    \ accepts the extracted features from the backbone and predicts or proposes image\
    \ regions (with location specifications) and scores to indicate whether the regions\
    \ contain objects (with objectness scores). The objectness score of a proposed\
    \ region may be 0 (for not having an object or being background) or 1 (for being\
    \ sure that there is an object of interest in the predicted region). Notably,\
    \ this object score is not about the probability of being a class of interest\
    \ but simply whether the region contains an object (of any class) or not (background).\n\
    \nThis module is set with a default Region Proposal Network (RPN). However, replacing\
    \ this network with a custom one is relatively easy. The following is the typical\
    \ syntax for registering a custom RPN to train the Detectron2 model using this\
    \ module:\n\n```\n@ROI_BOX_HEAD_REGISTRY.register()\nclass CustomBoxHead(nn.Module):\n\
    \    pass\n```"
  - "[PAGE 29]\n\n# Region of interest module\n\nThe last module is the place for\
    \ the region of interest (RoI) heads. Depending on the CV tasks, we can select\
    \ appropriate heads for this module, such as detection heads, segmentation heads,\
    \ keypoint heads, or semantic segmentation heads. For instance, the detection\
    \ heads accept the region proposals and the input features of the proposed regions\
    \ and pass them through a fully connected network, with two separate heads for\
