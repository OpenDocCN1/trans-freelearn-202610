    You may wonder why executing an evaluator during the training process is more
    valuable than evaluating the trained models after the training process is completed.
    There are several reasons for this usage. One is that this approach allows monitoring
    evaluation results with COCO evaluation metrics that can be used to select the
    best models while training and perform early stopping (stopping training after
    several iterations when you no longer see improvements).


