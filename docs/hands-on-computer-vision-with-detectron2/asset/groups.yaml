  mdcn: "\n\n# 第3部分：为实例分割任务开发自定义 Detectron2 模型\n\n## 第10章：训练实例分割模型\n\n- 技术要求 — 211\n\
    - 为训练分割模型准备数据 — 212\n  - 获取图像、标注图像与转换注释 — 212\n  - 脑肿瘤分割数据集简介 — 213\n- 分割模型的架构\
