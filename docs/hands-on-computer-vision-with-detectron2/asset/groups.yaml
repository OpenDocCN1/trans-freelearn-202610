    \ and update dataset_dict\n        mt = MosaicTransform(mo_images, mo_boxes)\n\
    \        return mt\n    def __repr__(self):\n        return \"MosaicAug(4)\"\n\
    ```\n\n该类利用之前构建的数据采样器并采样三个额外输入。然后它从这些额外输入中提取图像和边界框。它还将额外输入的标注添加到当前 dataset_dict\
    \ 的标注列表中，以便下一步可以利用它们以 Detectron2 支持的格式生成标注实例。具体来说，`__init__` 方法创建一个数据采样器对象（sampler）以采样三个额外输入用于执行\
    \ Mosaic 任务。`__repr__` 方法用于为此对象提供字符串表示以用于消息/日志记录。\n\n该类的核心方法是 `get_transform`\
    \ 方法。它首先使用数据采样器采样三个额外图像。然后它遍历采样图像，提取其图像和边界框，并分别存储到 mo_images 和 mo_boxes 中。此外，它提取这些额外图像的标注并将其添加到当前\
    \ dataset_dict 中，以便它们可以分别转换为 Detectron2 标注实例。最后，它将提取的数据作为输入传递以生成 MosaicTransform\
    \ 类的对象来执行变换：\n\n```\nfor ds_dict in mo_items:\n    # mo_images\n    mo_image =\
    \ utils.read_image(ds_dict[\"file_name\"],\n                                format=cfg.INPUT.FORMAT)\n\
    \    utils.check_image_size(ds_dict, mo_image)\n    mo_images.append(mo_image)\n\
    \    annotations = ds_dict[\"annotations\"]\n    # mo_boxes\n    mo_boxes.append(np.array([\n\
    \        BoxMode.convert(\n            obj[\"bbox\"],\n            obj[\"bbox_mode\"\
    ],\n            BoxMode.XYXY_ABS)\n        for obj in annotations]))\n    # add\
    \ annotations\n    dataset_dict[\"annotations\"] += annotations\n```\n\n对于 Mosaic\
    \ 图像增强技术来说，结合图像和标注有点复杂，有很多不同的结合方式。*图 9.3* 说明了本节采用的方法：\n\n![](img/0e7994c850a84b7a53d34c7f943c7edd_220_0.png)\n\
    \n`get_loc_info` 方法实现了图 9.3 中描述的步骤，以获取四个输入的相应起始位置、中心线、宽度和高度，如下所示：\n\n```\nimages\
    \ = [image] + self.mo_images\nheights = [i.shape[0] for i in images]\nwidths =\
    \ [i.shape[1] for i in images]\nch = max(heights[0], heights[1])\ncw = max(widths[0],\
    \ widths[2])\nh = (max(heights[0], heights[1]) +\n    max(heights[2], heights[3]))\n\
    w = (max(widths[0], widths[2]) +\n    max(widths[1], widths[3]))\n# pad or start\
    \ coordinates\ny0, x0 = ch-heights[0], cw - widths[0]\ny1, x1 = ch-heights[1],\
    \ cw\ny2, x2 = ch, cw - widths[2]\ny3, x3 = ch, cw\nx_pads = [x0, x1, x2, x3]\n\
    y_pads = [y0, y1, y2, y3]\n```\n\n`apply_image` 方法创建一个输出图像并将四个输入图像放置到由 `get_loc_info`\
    \ 方法生成的相应位置中：\n\n```\n# get the loc info\nself.loc_info = self.get_loc_info(image)\n\
    h, w, ch, cw, widths, heights, x_pads, y_pads=self.loc_info\noutput = np.zeros((h,\
    \ w, 3)).astype('float32')\nimages = [image] + self.mo_images\nfor i, img in enumerate(images):\n\
    \    output[y_pads[i]: y_pads[i] + heights[i],\n           x_pads[i]: x_pads[i]\
    \ + widths[i],:] = img\n```\n\n`apply_box` 方法合并来自当前输入和三个额外输入的边界框。然后它根据每个输入图像的新位置移动/填充这些边界框：\n\
    \n```\n# combine boxes\nboxes = [boxes] + self.mo_boxes\n# now update location\
    \ values\n_, _, _, _, _, _, x_pads, y_pads = self.loc_info\nfor i, bbox in enumerate(boxes):\n\
    \    bbox += np.array(\n        [x_pads[i], y_pads[i], x_pads[i], y_pads[i]]\n\
    \    )\n# flatten it\nboxes = np.vstack(boxes)\n```\n\nMosaicAugmentation 类随后可以像其他现有\
    \ Detectron2 增强类一样使用。图 9.4 显示了将 Mosaic 增强应用于脑肿瘤数据集的输出示例：\n\n![](img/0e7994c850a84b7a53d34c7f943c7edd_223_0.png)\n\
    \n图 9.4：Mosaic 增强的示例\n\n此版本的输入有四张图像及其对应的标注。当批量大小较小时，此增强技术很有帮助，我们希望利用该技术来增加批量大小。此外，它可能有助于提高预测较小边界框大小标注的准确性。\n\
    \n恭喜！到目前为止，你应该能够应用现有的 Detectron2 增强或创建自定义增强来训练 Detectron2 模型。作为练习，你可以创建一个利用这些类的训练器并训练用于检测脑肿瘤的模型。由于篇幅限制，本节未列出利用这些增强的训练器的源代码。请参考本章提供的\
    \ Jupyter 笔记本以获取源代码。\n\n"
