    \ 模型时经常做的那样（代码相同）。下载数据集并注册后，让我们选择一个 D2Go 模型进行训练。对于此任务，D2Go 提供了一个名为 GeneralizedRCNNRunner\
    \ 的类，用于帮助创建配置文件并训练自定义模型。让我们先导入该类、选择一个模型并创建该 runner 类的一个实例：\n\n```\nfrom d2go.model_zoo\
    \ import model_zoo\nfrom d2go.runner import GeneralizedRCNNRunner\nselected_model\
    \ = \"faster_rcnn_fbnetsv3a_C4.yaml\"\nnc = 2\noutput_dir = './output'\nmodel_url\
    \ = selected_model\nrunner = GeneralizedRCNNRunner()\n```\n\n现在，在开始训练之前，我们需要获取该模型的配置：\n\
    \n```\ncfg = runner.get_default_cfg()\ncfg.merge_from_file(model_zoo.get_config_file(model_url))\n\
    cfg.MODEL.EMA.ENABLED = False\ncfg.DATASETS.TRAIN = (name_ds_train,)\ncfg.DATASETS.TEST\
    \ = (name_ds_test,)\ncfg.DATALOADER.NUM_WORKERS = 2\ncfg.MODEL.WEIGHTS = model_zoo.get_checkpoint_url(model_url)\n\
    cfg.MODEL.DEVICE =\"cpu\" if ('CI' in os.environ) else \"cuda\"\ncfg.SOLVER.IMS_PER_BATCH\
    \ = 2\ncfg.SOLVER.BASE_LR = 0.00025\ncfg.SOLVER.MAX_ITER = 5 if ('CI' in os.environ)\
    \ else 5000\ncfg.SOLVER.STEPS = []\ncfg.MODEL.ROI_HEADS.BATCH_SIZE_PER_IMAGE =\
    \ 128\ncfg.MODEL.ROI_HEADS.NUM_CLASSES = nc\ncfg.OUTPUT_DIR = output_dir\nos.makedirs(cfg.OUTPUT_DIR,\
    \ exist_ok=True)\n```\n\n"
