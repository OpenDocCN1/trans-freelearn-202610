    \ = re_tfm.apply_image(img)\nre_boxes = re_tfm.apply_box(boxes)\nvisualize_image_boxes(re_img,\
    \ re_boxes)\n```\n\nFigure 8.12 shows some sample output for this code snippet\
    \ (right) and the original input (left). As we can see, in the original input\
