    \ x-ray\"], limit=10)\n```\n\n图 3.3 显示了 Google Drive 中生成的结果文件夹，其中包含下载的图像以及用于存储图像\
    \ URL 的文本文件。\n\n![](img/0e7994c850a84b7a53d34c7f943c7edd_66_0.png)\n\n图 3.3：生成的图像文件夹及其对应\
    \ URL 的文本文件\n\n下载的图像可能并不完全符合你的需求。因此，你应该检查下载的图像，并删除那些不符合特定要求的图像。一旦你拥有了想要的图像，下一步就是选择一种工具，开始为训练和验证标注图像。\n\
    \n## 选择图像标注工具\n\n计算机视觉应用正在快速发展。因此，有许多用于计算机视觉应用图像标注的工具。这些工具从免费开源到完全商业化，或提供免费试用的商业化（这意味着在可用功能方面存在一些限制）不等。标注工具可以是桌面应用程序（需要安装）、在线\
    \ Web 应用程序或本地托管的 Web 应用程序。在线应用程序甚至可能提供云存储、支持团队协作标注的工具，以及有助于加快标注速度的预训练模型（通常需要一定费用）。\n\
    \n其中一个流行的图像标注工具是 `labelImg`。它可在 `https://github.com/heartexlabs/labelImg/blob/master/README.rst`\
    \ 获取。它是一个开源、轻量、快速、易于使用的基于 Python 的应用程序，学习曲线短。\n\n它的局限性在于只支持创建矩形边界框。它目前是 **Label\
    \ Studio**（一个功能多得多的更复杂工具）的一部分。然而，如果手头的任务只是进行目标检测和定位，它仍然是最佳选择。\n\n另一个流行的工具是 `labelme`（`https://github.com/wkentaro/labelme`）。它在基于\
    \ Python 的应用程序、开源、快速且易于使用方面与 labelImg 类似。然而，除了矩形边界框之外，它还支持其他标注类型。具体来说，它可以标注多边形、矩形、圆形、线条和点。因此，它可用于为目标检测以及语义或实例分割任务标注训练图像。\n\
    \nlabelImg 和 labelme 都是本地安装的应用程序。然而，如果你想使用本地托管的 Web 应用程序，可以参考 **VGG（Visual Geometry\
    \ Group）图像标注器（VIA）**。VIA 是一个轻量、独立的基于浏览器的 Web 应用程序。它也支持标注多边形、圆形、线条和矩形边界框。\n\n如果你想使用基于云的\
    \ Web 应用程序（支持云存储和 Web 上的标注），你可能会喜欢 `roboflow`，可在 `https://app.roboflow.com` 获取。这个在线\
    \ Web 应用程序支持多种标注模式。它提供了让团队协作标注图像的工具。它还支持使用预训练模型帮助加快图像标注。然而，它的若干高级功能仅在付费计划中可用。另一个用于此任务的流行\
    \ Web 平台是 `https://www.makesense.ai`。它是开源的，并在 GPLv3 许可下免费使用。它支持多种流行的标注格式，并使用 AI\
    \ 来提高标注效率。\n\n本章选择 `labelImg` 来为目标检测任务准备数据。*第 10 章* 使用 `labelme` 来为目标实例分割任务准备数据。选择标注工具后，下一步是了解该工具支持哪些标注格式、应选择哪一种，以及如何将其转换为\
    \ Detectron2 支持的格式。\n\n## 标注格式\n\n与标注工具类似，为计算机视觉应用标注图像时也有许多不同的标注格式可用。常见的标准包括 COCO\
    \ JSON、Pascal VOC XML 和 YOLO PyTorch TXT。还有更多格式（例如 TensorFlow TFRecord、CreateML\
    \ JSON 等）。然而，由于篇幅限制，本节仅涵盖前面列出的三种最常见的标注标准。此外，本节使用来自 Kaggle（`https://www.kaggle.com/datasets/davidroberts/brain-tumor-object-detection-datasets`）可获取的脑肿瘤目标检测数据集测试集中的两张图像和标签来说明这些数据格式并展示它们之间的差异，如图\
    \ *3.4* 所示。本节简要讨论每种标注格式的要点，感兴趣的读者可以参考本章的 GitHub 页面，以更详细地查看同一数据集的不同格式。\n\n"
