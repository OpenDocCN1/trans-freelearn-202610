    \ 方法的实现返回此类自身的当前对象（`self`）。\n\n- **ResizeTransform 类**是最常用的变换之一，因为其他变换和深度学习模型通常要求图像大小相同。相比之下，输入图像可能具有不同的尺寸。此变换接受原始图像高度和宽度（`h`、`w`）、期望高度和宽度（`new_h`、`new_w`）以及插值方法（`interp`），并据此执行缩放。\n\
