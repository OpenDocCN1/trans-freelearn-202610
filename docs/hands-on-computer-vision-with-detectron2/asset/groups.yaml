    \n从不同来源或数据标注工具获取的数据集，其标注格式可能与 Detectron2 支持的格式（COCO 数据格式）不同。因此，了解如何将不同格式的数据集转换为\
    \ COCO 格式至关重要。下一节将引导你完成这一数据集转换过程。\n\n## 标注格式转换\n\nDetectron2 的数据描述基于 COCO 标注格式构建。换句话说，它支持使用\
    \ COCO 数据标注格式注册数据集。然而，其他数据标注格式大量存在，你可能下载的数据集或使用的标注工具支持与 COCO 不同的数据格式。因此，本节将介绍用于将流行的\
    \ Pascal VOC 和 YOLO 格式转换为 COCO 风格的代码片段。\n\n> **重要提示**\n> 以感叹号（!）开头的语句表示需要在 Jupyter\
    \ notebook（Google Colab）代码单元中执行的 Bash 命令。如果你想在终端中运行，可以安全地移除这个感叹号并执行该语句。\n\n###\
    \ 将 Pascal VOC 数据集转换为 COCO 数据集\n\nPascal VOC 标注格式是另一种流行的格式。因此，本节提供代码片段，用于在注册到\
    \ Detectron2 之前将数据转换为 COCO 标注格式。本节使用前面描述的简单数据集（annotationdemo）作为演示。首先，我们下载 Pascal\
    \ VOC 格式的脑肿瘤数据集（voc.zip）并在 Google Colab 上解压：\n\n```\n# 下载数据集并解压\n!wget url_to_voc.zip\n\
    !unzip voc.zip\n```\n\n数据集解压后，以下代码片段安装 tree 包并查看该数据集的结构：\n\n```\n!sudo apt-get\
    \ install tree\n!tree voc\n```\n\n以下是该数据集在 COCO 标注格式下的结构：\n\n```\nvoc\n└ test\n\
