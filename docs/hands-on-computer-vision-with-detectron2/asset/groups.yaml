    rf_img = rf_tfm.apply_image(img)\nrf_boxes = rf_tfm.apply_box(boxes)\nvisualize_image_boxes(rf_img,\
    \ rf_boxes)\n```\n\nWhen running this code snippet, as a whole, several times,\
    \ about 50% of the time, the input flips horizontally, and the input never flips\
    \ vertically.\n\n## The RandomRotation class\ntakes `angle`, `expand`, `center`,\
    \ `sample_style`, and `interp` as its input parameters. The `expand` parameter\
