    et_boxes = e_tfm.apply_box(boxes)\nvisualize_image_boxes(et_img, boxes = et_boxes)\n\
    ```\n\n此片段加载一个带有真实框的示例图像。然后，它创建一个 ExtentTransform 对象并调用 `apply_image` 和 `apply_box`\
