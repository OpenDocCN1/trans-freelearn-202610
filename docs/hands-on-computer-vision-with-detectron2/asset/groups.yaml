  mdcn: "\n\n## Detectron2 数据加载器\n\n在 Detectron2 中应用数据增强既简单又复杂。使用声明式方法并应用 Detectron2\
    \ 提供的现有变换和增强相对容易，这应该能满足最常见需求。然而，添加需要多个数据样本的自定义增强（例如 MixUp 和 Mosaic）则有点复杂。本节描述\
    \ Detectron2 如何加载数据，以及如何将现有和自定义数据增强整合到 Detectron2 模型训练中。图 9.1 展示了 Detectron2 数据加载系统的步骤和主要组件。\n\
    \n![](img/0e7994c850a84b7a53d34c7f943c7edd_209_0.png)\n\n存在 `Dataset`、`Sampler`、`Mapper`\
    \ 和 `Loader` 这些类。`Dataset` 组件通常以 JSON 格式存储数据项列表。`Sampler` 组件帮助从数据集中随机选择一个数据项（`dataset_dict`）。选中的数据项包含图像文件名和标注信息。然后，Mapper\
    \ 加载实际图像。之后，标注和加载的图像经历增强和数据转换，转换为图像张量和标注的实例。Mapper 产生一个数据项，Loader 帮助将这些数据打包成批次并送入训练。一些增强技术可能希望除了当前输入外还加载额外的样本（`dataset_dict(s)`\
    \ 和 `image(s)`），这些项目在图 9.1 中用虚线表示。一旦你理解了 Detectron2 如何加载数据，将现有的数据增强整合到 Detectron2\
    \ 训练中就会相对容易。\n\n使用的第二种增强类型是 ResizeShortestEdge，以下代码片段创建并附加该增强：\n\n```\nmin_size\
    \ = cfg.INPUT.MIN_SIZE_TRAIN\nmax_size = cfg.INPUT.MAX_SIZE_TRAIN\nsample_style\
    \ = cfg.INPUT.MIN_SIZE_TRAIN_SAMPLING\naugs.append(\n    T.ResizeShortestEdge(\n\
    \        min_size,\n        max_size,\n        sample_style)\n)\n```\n\n最后，以下代码片段向此自定义训练器使用的增强列表中添加了一个\
    \ RandomFlipping 增强：\n\n```\nif cfg.INPUT.RANDOM_FLIP != \"none\":\n    augs.append(\n\
    \        T.RandomFlip(\n            horizontal=cfg.INPUT.RANDOM_FLIP == \"horizontal\"\
    ,\n            vertical=cfg.INPUT.RANDOM_FLIP == \"vertical\",\n        )\n  \
    \  )\n```\n\n使用这种声明式方法，并利用 Detectron2 提供的类来整合不同的增强/变换相对容易，如 MyTrainer 类所示。这些现有的类仅适用于一个数据项（一张图像及其相关标注）。然而，一些有用的图像增强技术可能需要来自多个样本的数据。例如，MixUp\
    \ 从两个数据样本加载输入，而 Mosaic 从四个数据样本加载输入。在这些情况下，有必要重写 Detectron2 数据加载系统的几个组件，以便将来自不同样本的标注合并为一个。下一节将说明这些场景。\n\
    \n### 开发自定义图像增强技术\n\n假设自定义增强需要从一个数据样本（`dataset_dict`）加载标注。在这种情况下，实现自定义增强或变换并使用上一节描述的声明式方法将其整合起来相对简单。本节重点介绍需要加载并组合多个样本输入的更复杂的增强类型。在这些情况下，我们需要重写\
    \ Detectron2 数据加载系统的几个部分。因此，本节描述了 Detectron2 数据加载系统的修改，并开发了两种自定义图像增强（MixUp 和 Mosaic）作为示例。\n\
