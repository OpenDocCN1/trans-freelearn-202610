    # The dataset


    The dataset used is the brain tumor object detection dataset available from Kaggle
    (https://www.kaggle.com/datasets/davidbroberts/brain-tumor-object-detection-datasets),
    which is downloaded to the GitHub repository of this book to assure its accessibility.
    This dataset is chosen because medical image processing is a critical subfield
    in computer vision. At the same time, the task is challenging, and the number
    of images is appropriate for demonstration purposes.


