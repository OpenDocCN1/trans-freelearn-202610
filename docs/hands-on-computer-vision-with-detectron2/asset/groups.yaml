  - "[PAGE 286]\n\n```\nclass SimplePyTorchModel(nn.Module):\n    def __init__(self):\n\
    \        super(SimplePyTorchModel, self).__init__()\n        self.linear = nn.Linear(4,\
    \ 1)\n        self.linear.weight.data.fill_(0.01)\n        self.linear.bias.data.fill_(0.01)\n\
    \n    def forward(self, X):\n        return torch.relu(self.linear(X))\n```\n\n\
    Notably, we do not need to train the model but fix its weights and biases as 0.01\
    \ for demonstration purposes. The following code snippet then creates a model\
    \ of this simple neural network and puts it in evaluation mode:\n\n```\npt_model\
    \ = SimplePyTorchModel()\npt_model.eval()\n```\n\nNow, we are ready to export\
    \ the model into ONNX format using a dummy input:\n\n```\ndummy_X = torch.tensor([[1,\
    \ 2, 3, 4]], dtype=torch.float32)\nmodel_name = 'onnx_model.onnx'\ntorch.onnx.export(pt_model,\n\
    \    dummy_X, model_name, verbose=True)\n```\n\nTo test the exported model, we\
    \ first need to install the onnx package using the following statement:\n\n```\n\
    !pip install onnx\n```\n\nAfter installing onnx, the following code snippet loads\
    \ the exported ONNX model, checks whether it is well-formed, and prints out its\
    \ graph for inspection purposes:\n\n```\nimport onnx\nfrom onnx.helper import\
    \ printable_graph\n# load\nloaded_model = onnx.load(model_name)\n# check (well\
    \ formed)\nonnx.checker.check_model(loaded_model)\n# graph\nprint(printable_graph(loaded_model.graph))\n\
    ```"
  - "[PAGE 287]\n\nTo run the loaded model in an ONNX model, we first need to install\
    \ the onnxruntime package using the following statement:\n\n```\n!pip install\
    \ onnxruntime\n```\n\nOnce the runtime environment is ready, the following code\
    \ snippet helps to create an inference session and gets the input name for the\
    \ loaded model:\n\n```\nimport onnxruntime as ort\nort_session = ort.InferenceSession(model_name)\n\
    input_name = ort_session.get_inputs()[0].name\nprint(input_name)\n```\n\nThe previous\
    \ code snippet should display input_name as onnx::Gemm_0. This input name is important\
    \ for creating an input object for the loaded model while performing inferencing\
    \ on input data, as in the following code snippet:\n\n```\nimport numpy as np\n\
    X = np.array([[2, 3, 4, 5]])\noutputs = ort_session.run(\n    None,\n    {input_name:\
    \ X.astype(np.float32)},\n)\nprint(outputs[0])\n```\n\nThe previous code snippet\
    \ creates a batch input, X, with one instance of [2, 3, 4, 5] and performs prediction\
    \ on this input. This code snippet should display the result as [[0.15]]. To validate\
    \ the accuracy of the prediction, we can also perform prediction on the same input\
    \ using the original PyTorch model as follows:\n\n```\nX = torch.tensor([[2, 3,\
    \ 4, 5]], dtype=torch.float32)\nwith torch.no_grad():\n    y = pt_model(X)\n \
    \   print(y)\n```\n\nThis code snippet should display the same output ([[0.15]])\
    \ as the loaded ONNX model executed in the ONNX inference session."
  - "[PAGE 288]\n\nOptionally, if you are running on Google Colab, you can run the\
    \ following code snippet to download this ONNX model for future use:\n\n```\n\
