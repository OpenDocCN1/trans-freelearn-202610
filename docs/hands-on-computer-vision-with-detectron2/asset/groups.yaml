    user warnings that are safe to ignore.


    Notably, the cfg.MODEL.ROI_HEADS.SCORE_THRESH_TEST parameter is currently set
    to 0.95. This parameter is used at the test time to filter out all the detected
    objects with detection confidences less than this value. Assigning this parameter
    to a high value (close to 1.0) means we want to have high precision and low recall.
    Likewise, setting it to a low value (close to 0.0) means we prefer low precision
    and high recall. Once we have the model (or predictor interchangeably), it is
    time to perform inferences.


