    ## 总结


    本章讨论了高级计算机视觉任务，包括目标检测、实例分割、关键点检测、语义分割和全景分割，以及何时使用它们。Detectron2 是一个框架，有助于为这些 CV
    任务实现前沿算法，其优势在于速度更快、精度更高、模块化、可定制，并且基于 PyTorch 构建。其架构包含四个主要部分：输入数据、主干网络、区域提议和感兴趣区域头部。每个组件都可以替换为自定义实现。本章还提供了使用
    Google Colab 设置云开发环境、本地开发环境，或在需要时将 Google Colab 连接到本地运行时的步骤。


    你现在已经了解了 Detectron2 能够帮助开发的主要 CV 任务，并已设置好开发环境。下一章（*第 2 章*）将指导你使用 Detectron2 Model
    Zoo 中提供的前沿模型，为上述所有 CV 任务构建 CV 应用程序。


    ## 技术要求


    你应该已经按照第 1 章中的说明设置好开发环境。如果你尚未完成，请在继续之前完成开发环境的设置。所有代码、数据集和相应结果均可在本书的 GitHub 页面（位于
    Chapter02 文件夹下）获取：https://github.com/PacktPublishing/Hands-On-Computer-Vision-with-Detectron2。强烈建议你下载代码并跟着操作。


    ## Detectron2 Model Zoo 简介


    在深度学习中，当开发大型模型并在大规模数据集上训练模型时，深度学习方法的开发者通常会提供预训练模型。其主要原因是这些模型的开发者通常是该领域的重要参与者（例如
    Facebook、Google、Microsoft 或大学），他们拥有计算资源（例如 CPU 和 GPU），可以在大型数据集上训练此类模型。而普通开发者通常无法获得这些计算资源。


    这些预训练模型通常在数据集上训练，用于模型预期使用的常见任务。因此，这类模型的另一个好处是，如果用户手头的任务与模型训练的目标相匹配，他们可以采用这些模型并将其用于具体场景。此外，这些模型还可以作为基线，最终用户可以在其特定场景下使用更小的数据集进行进一步的微调，而训练这些模型所需的计算资源也更少。


    Detectron2 还提供了大量模型，这些模型在其 Model Zoo 中使用高计算资源的 Big Basin 服务器（8 块 NVIDIA V100 GPU
    和 NVLink）训练而成。你可以从以下链接阅读更多信息并下载所有模型：https://github.com/facebookresearch/detectron2/blob/main/MODEL_ZOO.md。


    对于新用户来说，要掌握具有不同规格的可用模型的信息可能会有些令人不知所措。因此，本节详细说明了用户应查找哪些信息，以使用 Detectron2 Model
    Zoo 中的这些前沿模型完成手头的特定计算机视觉任务。这些信息包括查找以下内容：


    - 模型训练所用的数据集

    - 该模型的架构

    - 训练和推理时间

    - 训练内存需求

    - 模型准确率

    - 训练模型（权重）的链接

    - 其配置文件（.yaml）的链接


