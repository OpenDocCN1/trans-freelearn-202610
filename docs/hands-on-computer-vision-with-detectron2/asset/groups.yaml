  mdcn: "\n\nAugmentation 类是供所有增强类扩展的基类。有两个需要注意的重要方法：`get_transform(self, *args)`\
    \ 和 `__call__(self, aug_input)`。其所有子类都会重写 `get_transform` 方法，以接受一组命名输入参数并生成一个变换对象。这组参数的名称应能被\
    \ `AugInput` 接受（我们将在下一节了解）。`__call__` 方法使其子类能够直接与 `AugInput` 配合使用（下一节将详细介绍）。\n\
    \nFixedSizeCrop 类将 `crop_size` 作为元组 `(height, width)` 传入，从原始输入中随机裁剪该尺寸的区域。如果该尺寸大于原始图像，它会检查\
    \ `pad` 选项是否为 `True`。如果为 `True`，则会分别使用 `pad_value` 和 `seg_pad_value` 在右侧和底部填充输入图像和分割掩码（原始图像始终位于左上角）。该类有助于生成相同大小的输入，而深度学习模型通常需要这样的输入。以下代码片段说明了此增强类的用法：\n\
    \n```\nfsc_aug = T.FixedSizeCrop(crop_size = (300, 300), pad=True,\n pad_value=128)\n\
    fsc_tfm = fsc_aug.get_transform(img)\nfsc_img = fsc_tfm.apply_image(img)\nfsc_boxes\
    \ = fsc_tfm.apply_box(boxes)\nvisualize_image_boxes(fsc_img, fsc_boxes)\n```\n\
    \n首先，该代码片段初始化裁剪大小并设置填充选项，然后通过 `get_transform` 方法获取一个变换对象。如前一节所讨论，这个对象随后可以用作确定性变换对象。换句话说，它会从不同输入中裁剪出相同的区域。此外，将相同的变换应用于不同大小的输入将无法正常工作：\n\
    \n![](img/0e7994c850a84b7a53d34c7f943c7edd_196_0.png)\n\n原始图像与真实边界框\n\n![](img/0e7994c850a84b7a53d34c7f943c7edd_196_1.png)\n\
    \n裁剪后的版本\n\n图 8.11：原始图像、真实边界框及其裁剪后的版本\n\n## RandomApply 类\n\n它接受的输入参数包括一个 `Transform`\
    \ 或 `Augmentation` 类的实例（`tfm_or_aug`）和一个概率（`prob`，默认值为 0.5），该概率决定是否执行这种变换或增强。以下代码片段说明了此类的用法：\n\
    \n```\nra_aug = T.RandomApply(fsc_tfm, prob = 0.3)\nra_fsc_tfm = ra_aug.get_transform()\n\
    ra_fsc_img = ra_fsc_tfm.apply_image(img)\nra_fsc_boxes = ra_fsc_tfm.apply_box(boxes)\n\
    visualize_image_boxes(ra_fsc_img, ra_fsc_boxes)\n```\n\n如果我们多次运行整段代码（在其他次运行中会得到不同的\
    \ `Transform` 对象），那么其中一些结果可能会被裁剪（如图 8.11 右侧所示），而另一些可能不会被裁剪（输入保持与图 8.11 左侧相同）。\n\
    \n## RandomCrop 类\n\n`RandomCrop` 类将 `crop_type` 和 `crop_size` 作为输入参数。我们来看一下不同的\
    \ `crop_type` 值及其工作方式：\n\n- `\"relative\"`：`crop_size` 必须在 `(0, 1]` 范围内（按图像大小\
    \ HxW 归一化）。然后，它会在图像中裁剪一个随机区域，其大小为 H*crop_size[0]、W*crop_size[1]。\n- `\"relative_range\"\
    `：从 `[crop_size[0], 1]` 中均匀随机采样一个值赋给 `crop_size[0]`；对 `crop_size[1]` 执行相同操作。然后，新的\
    \ `crop_size` 按 `crop_type = \"relative\"` 的方式使用。\n- `\"absolute\"`：`crop_size`\
    \ 必须小于输入图像的大小。它会在图像中裁剪一个随机区域，其大小为 `crop_size[0]`、`crop_size[1]`。\n- `\"absolute_range\"\
    `：从当前值和图像高度（`[crop_size[0], H]`）之间均匀随机采样一个值赋给 `crop_size[0]`；对 `crop_size[1]`\
    \ 执行相同操作。然后，新的 `crop_size` 按 `crop_type = \"absolute\"` 的方式使用。\n\n以下代码片段说明了此类的用法：\n\
    \n```\nrc_aug = T.RandomCrop(\n    crop_type=\"relative\",\n    crop_size=(0.5,\
    \ 0.5))\nrc_tfm = rc_aug.get_transform(img)\nrc_img = rc_tfm.apply_image(img)\n\
    rc_boxes = rc_tfm.apply_box(boxes)\nvisualize_image_boxes(rc_img, rc_boxes)\n\
    ```\n\n## RandomExtent 类\n\n它将 `scale_range` 和 `shift_range` 这两个大小为 2 的元组作为输入参数。前者用于决定裁剪子区域的大小，后者用于决定提取子区域的位置。具体来说，`scale_range`\
    \ 元组指定了一个具有低值（l）和高值（h）的范围；从该范围中均匀随机采样一个值（r）；然后，输出图像的尺寸为 r*H 和 r*W（其中 H 和 W 分别是输入图像的高度和宽度）。第二个参数\
    \ `shift_range` 是另一个大小为 2 的元组 `(x, y)`。从 `[-x, x]` 和 `[-y, y]` 范围中分别均匀随机采样两个值\
    \ `x_shift` 和 `y_shift`；然后，裁剪区域还会围绕输入图像中心偏移 `x_shift*W/2` 和 `y_shift*H/2`。以下代码片段说明了此类的使用模式：\n\
    \n```\nre_aug = T.RandomExtent(\n    scale_range=(0.5, 0.9),\n    shift_range=(0.3,\
    \ 0.3))\nre_tfm = re_aug.get_transform(img)\nre_img = re_tfm.apply_image(img)\n\
    re_boxes = re_tfm.apply_box(boxes)\nvisualize_image_boxes(re_img, re_boxes)\n\
    ```\n\n图 8.12 展示了该代码片段的一些示例输出（右侧）和原始输入（左侧）。可以看到，在原始输入（左侧）中，输入图像中心放置了一个虚线框。`shift_range`\
    \ 参数决定该虚线框的大小。系统会在此框内随机选择一个点，作为裁剪区域的中心。`scale_range` 参数决定裁剪区域（实线框）的大小：\n\n![](img/0e7994c850a84b7a53d34c7f943c7edd_198_0.png)\n\
    \n![](img/0e7994c850a84b7a53d34c7f943c7edd_198_1.png)\n\n图 8.12：原始图像、真实边界框及其 RandomExtent\
    \ 版本\n\n## RandomFlip 类\n\n`RandomFlip` 类接受一个概率（`prob`）和两个布尔值（`horizontal` 和 `vertical`）。`prob`\
    \ 参数用于决定是否执行翻转；如果结果为执行翻转，另外两个参数分别决定是否水平翻转和垂直翻转。以下代码片段说明了此类的用法：\n\n```\nrf_aug\
    \ = T.RandomFlip(prob        = 0.5,\n                    horizontal = True,\n\
    \                    vertical   = False)\nrf_tfm = rf_aug.get_transform(img)\n\
    rf_img = rf_tfm.apply_image(img)\nrf_boxes = rf_tfm.apply_box(boxes)\nvisualize_image_boxes(rf_img,\
    \ rf_boxes)\n```\n\n当多次整体运行此代码片段时，大约有 50% 的情况下输入会水平翻转，并且永远不会垂直翻转。\n\n## RandomRotation\
    \ 类\n\n`RandomRotation` 类将 `angle`、`expand`、`center`、`sample_style` 和 `interp`\
    \ 作为输入参数。`expand` 参数决定是否应扩展输出大小，以适配旋转后的图像尺寸。`sample_style` 参数可以是 `\"range\"` 或\
    \ `\"choice\"`。\n\n如果为 `\"range\"`（默认），则会发生以下情况：\n\n- `angle` 参数是一个度数范围 `[min,\
    \ max]`，用于均匀采样一个旋转角度值。\n- `center` 参数是一个相对区间 `[[minx, miny], [maxx, maxy]]`，用于从中采样旋转中心；其中\
    \ `[0, 0]` 表示图像左上角，`[1, 1]` 表示图像右下角。\n\n如果为 `\"choice\"`，则会发生以下情况：\n\n- `angle`\
    \ 参数是一个可供选择的旋转角度值列表。\n- `center` 参数为 `None`，表示旋转中心是输入图像的中心。\n\n以下代码片段说明了此类的使用模式：\n\
    \n```\nrr_aug = T.RandomRotation(\n        angle        = [-30, 30],\n       \
    \ sample_style = \"range\",\n        center       = [[0.4, 0.6], [0.4, 0.6]],\n\
    \        expand       = False\n        )\nrr_tfm = rr_aug.get_transform(img)\n\
    ```\n\n```\n```python\nrr_img = rr_tfm.apply_image(img)\nrr_boxes = rr_tfm.apply_box(boxes)\n\
    visualize_image_boxes(rr_img, rr_boxes)\n```\n```\n\n该代码片段会随机采样一个介于 -30 到 30 度之间的角度值，并在中心附近采样另一个值，以旋转输入数据。\n\
    \n## Resize 类\n\n该类非常简单。它将目标尺寸（`shape=(height, width)`）和插值方法（`interp`）作为输入参数。其\
    \ `get_transform(image)` 方法返回一个 `ResizeTransform` 对象，用于将输入图像和相关标注调整为目标尺寸。以下代码片段说明了此类的用法：\n\
    \n```\n```python\nrs_aug = T.Resize(\n        shape=(640, 640)\n)\nrs_tfm = rs_aug.get_transform(img)\n\
    rs_img = rs_tfm.apply_image(img)\nrs_boxes = rs_tfm.apply_box(boxes)\nvisualize_image_boxes(rs_img,\
    \ rs_boxes)\n```\n```\n\n此代码片段将输入图像调整为固定的目标尺寸。这是常用的图像预处理步骤，因为神经网络通常需要相同大小的输入。然而，如果目标尺寸具有不同的宽高比，该技术不会保留输入图像的宽高比。\n\
    \n## RandomResize 类\n\n`RandomResize` 类将 `shape_list` 和 `interp` 作为输入参数。它会使用给定的插值方法（`interp`），将输入调整为从\
    \ `shape_list` 中采样得到的某个尺寸 `(h, w)`。以下代码片段说明了此类的使用模式：\n\n```\n```python\nrrs_aug\
    \ = T.RandomResize(\n        shape_list=[(320, 320), (640, 640)]\n)\nrrs_tfm =\
    \ rrs_aug.get_transform(img)\nrrs_img = rrs_tfm.apply_image(img)\nrrs_boxes =\
    \ rrs_tfm.apply_box(boxes)\nvisualize_image_boxes(rrs_img, rrs_boxes)\n```\n```\n\
    \n"
