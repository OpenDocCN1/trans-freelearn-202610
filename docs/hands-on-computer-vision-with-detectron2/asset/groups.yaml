    \ provides tools to mark various primitives: polygons, rectangles, circles, lines,\
    \ and points. You can run the following command in a Terminal to install labelme\
    \ using pip:\n\n```\npip install labelme\n```\n\nThis tool's usage is similar\
    \ to labelImg introduced in Chapter 3. You can execute one of the following commands\
    \ in a Terminal to start labeling:\n\n```\nlabelme image_folder/\nlabelme image_folder/\
    \ --labels labels.txt\n```\n\nThe first command specifies image_folder, where\
    \ all labeling images are stored. If you wish, the second command allows specifying\
    \ a list of labels (categories of objects to label) in a text file (labels.txt).\
    \ The labeling process is then straightforward.\n\nAfter labeling, there is one\
    \ output text file per image. The output has the same filename but with a .txt\
    \ extension. It is relatively easy to convert these annotation files into the\
