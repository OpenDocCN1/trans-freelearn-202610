    \ 类的原始版本保持一致：\n\n```\naug_input = ExtendedAugInput(image,\n                  \
    \          sem_seg      = sem_seg_gt,\n                            dataset_dict\
    \ = dataset_dict,\n                            boxes = boxes)\n\ntransforms  \
    \ = self.augmentations(aug_input)\nimage        = aug_input.image\nsem_seg_gt\
    \   = aug_input.sem_seg\ndataset_dict = aug_input.dataset_dict\nboxes        =\
    \ aug_input.boxes\n\nimage_shape = image.shape[:2]\ndataset_dict[\"image\"] =\
    \ torch.as_tensor(\n    np.ascontiguousarray(image.transpose(2, 0, 1)))\n```\n\
    \n**步骤 3：** 最后一步利用前面描述的 `_convert_to_annotations` 方法，将 `dataset_dict` 中列出的变换/增强数据转换为可被\
    \ Detectron2 处理的实例：\n\n```\nif \"annotations\" in dataset_dict:\n    self._convert_to_annotations(dataset_dict,\n\
    \                                 boxes,\n                                 image_shape)\n\
    ```\n\n以下代码片段创建了一个 `Sampler` 组件，该组件有助于在执行 MixUp 和 Mosaic 等增强时采样额外输入：\n\n```\n\
    from detectron2.data import DatasetCatalog\n\nclass DataDictSampler():\n    def\
