  \  \nC. `<href>`  \nD. `<url>`\n\n**4. 图片 `alt` 属性的用途是什么？**\n\nA. 改变图片大小  \nB. 在图片下添加标题\
  \  \nC. 用文本描述图片  \nD. 将图片链接到其他页面\n\n**5. 哪个 HTML 元素最适合显示价格或日程等表格数据？**\n\nA. `<div>`\
  \  \nB. `<section>`  \nC. `<table>`  \nD. `<list>`\n\n### 第 2 部分：判断题\n\n**6. HTML\
