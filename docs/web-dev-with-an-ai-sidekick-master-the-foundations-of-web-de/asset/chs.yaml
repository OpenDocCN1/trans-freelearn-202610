  \n### Surveys 应用：URL 配置\n\n`surveys` 文件夹是一个用于管理调查的应用功能，其中 `urls.py` 定义了所有 URL 模式：\n\
  \n```\nurlpatterns = [\n    path(\"\", HomePageView.as_view(), name=\"home\"),\n\
  \    path(\"creator/\", SurveyListView.as_view(), name=\"survey_list\"),\n    path(\"\
  creator/surveys/new/\", SurveyCreateView.as_view(), name=\"survey_create\"),\n \
  \   path(\"creator/surveys/<int:pk>/\", SurveyDetailView.as_view(), name=\"survey_detail\"\
  ),\n    path(\"creator/surveys/<int:pk>/edit/\", SurveyUpdateView.as_view(), name=\"\
  survey_update\"),\n    path(\"creator/surveys/<int:pk>/publish/\", SurveyPublishView.as_view(),\
  \ name=\"survey_publish\"),\n    path(\"creator/surveys/<int:pk>/clone/\", SurveyCloneView.as_view(),\
  \ name=\"survey_clone\"),\n    path(\"creator/surveys/<int:pk>/end/\", SurveyEndView.as_view(),\
  \ name=\"survey_end\"),\n    path(\"creator/surveys/<int:pk>/results/\", SurveyResultsView.as_view(),\
  \ name=\"survey_results\"),\n    path(\"creator/surveys/<int:pk>/responses/\", SurveyResponsesView.as_view(),\
  \ name=\"survey_responses\"),\n    path(\"creator/surveys/<int:survey_pk>/questions/new/\"\
  , QuestionCreateView.as_view(), name=\"question_create\"),\n    path(\"creator/questions/<int:pk>/edit/\"\
  , QuestionUpdateView.as_view(), name=\"question_update\"),\n    path(\"creator/questions/<int:pk>/delete/\"\
  , QuestionDeleteView.as_view(), name=\"question_delete\"),\n    path(\"staff/approvals/\"\
  , ApprovalListView.as_view(), name=\"approval_list\"),\n    path(\"staff/approvals/<int:user_pk>/approve/\"\
  , ApproveUserView.as_view(), name=\"approve_user\"),\n    path(\"surveys/<int:pk>/take/\"\
  , PublicSurveyTakeView.as_view(), name=\"take_survey\"),\n]\n```\n\n### 模板：基础 HTML\n\
