  ```\n\n我创建了 PowerShell 脚本来安装和卸载前表中的 VS Code 扩展。您可以在以下链接找到它们：[`github.com/markjprice/web-dev-ai/tree/main/scripts/extension-scripts/`](https://github.com/markjprice/web-dev-ai/tree/main/scripts/extension-scripts/)。PowerShell\
