  \n    * **标识符**：`ms-vscode.live-server`\n    * **版本**：0.4.16 或更高\n    * **发布者**：Microsoft\n\
  \    * **下载量**：超过 1100 万\n\n![](img/B34553_01_04.png)\n\n图 1.4：安装由 Microsoft 发布的\
  \ Live Preview 扩展\n\n5. 单击**安装**并等待其下载和安装完成。\n\nVS Code 内置了对 HTML、CSS、JavaScript\
  \ 和 TypeScript 编辑的支持，但可以通过安装更多扩展来支持其他语言。\n\n## 安装其他扩展\n\n在本书后续章节中，您将使用更多 VS Code\
  \ 扩展。如果您想现在就安装它们，我们将使用的所有扩展都列在*表 1.1*中：\n\n| **扩展名称和标识符** | **描述** |\n| --- | ---\
