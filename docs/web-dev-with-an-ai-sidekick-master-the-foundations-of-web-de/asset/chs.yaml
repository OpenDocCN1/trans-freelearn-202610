  \n### 第 5 部分：实践思考（无需代码）\n\n**16. 你会为以下每项使用哪些 HTML 元素？**\n\na) 页面标题  \nb) 一段文本  \n\
  c) 导航链接  \nd) 食谱步骤列表  \ne) 联系留言框\n\n### 自我评分指南\n\n**14–16 正确**：你真正理解了 HTML 结构。继续前进。\
  \  \n**10–13 正确**：理解扎实，但再浏览一遍章节。  \n**10 以下**：慢读。专注于含义而非语法，HTML 自然会通顺。\n\n## 创建自定义测验\n\
  \n**提示**：请测验我关于 HTML5 引入的新标签。重点考察概念理解而非精确语法记忆。\n\n## 迷你挑战：构建“研讨会报名”网站\n\n你正在为一个名为\
  \ *Web 开发入门* 的一天研讨会创建小型网站。网站包含两页：\n\n*   **研讨会信息** 页：介绍活动\n*   **报名** 页：用户登记兴趣\n\
  \n仅允许使用 HTML。无 CSS，无 JavaScript。专注于结构和语义。\n\n### 第 1 页：workshop.html（研讨会信息）\n\n\
  创建名为 `workshop.html` 的文件，包含文档结构：\n\n*   `<!DOCTYPE html>`\n*   `<html>`、`<head>`、`<body>`\n\
  *   与页面用途匹配的 `<title>`\n\n页面内容要求：\n\n*   主标题：使用一个 `<h1>` 显示研讨会标题。\n*   简介段落：用纯文本描述研讨会内容。\n\
  *   图片：添加研讨会横幅图片。包含有意义的 alt 文本。可使用占位图片 URL。\n*   日程部分：使用 `<h2>` 标题。\n\n\n\n\n\n\
  ### 研讨会挑战\n\n## 第 1 页：workshop.html\n\n创建一个名为 `workshop.html` 的文件，其中包含：\n\n*   一个研讨会会话的有序列表（至少四项）。\n\
  *   **您将学到的内容** 部分：使用 `<h2>` 标题。包含一个技能或主题的无序列表。\n*   **日程安排** 表格：使用 `<h2>` 标题。包含一个\
  \ `<table>`，列为：时间、主题、形式（讲座、实操、休息）。\n*   添加一个指向报名页面的链接：`<a href=\"signup.html\">报名参加研讨会</a>`。\n\
  \n## 第 2 页：signup.html（研讨会报名）\n\n创建一个名为 `signup.html` 的文件，包含文档结构：\n\n*   正确的 `<head>`\
  \ 和 `<body>`\n*   清晰的页面 `<title>`\n\n表单的要求如下：\n\n*   您的页面必须包含一个带有 `method=\"post\"\
  ` 和真实的 `action` 值（例如 `/signup`）的 `<form>` 元素。\n*   在表单内，包含：\n    *   个人详细信息，如全名（文本输入，必填）和电子邮件地址（邮箱输入，必填）。\n\
  \    *   经验水平作为一组单选按钮：初级、有一定经验、高级。（所有单选按钮必须共享相同的 `name` 以形成一组。）\n    *   至少三个复选框的感兴趣主题（例如\
  \ HTML、CSS、Python、JavaScript）。\n    *   用于评论或问题的 `<textarea>` 作为附加说明。\n    *   提交按钮。\n\
  *   导航，包含一个返回 `workshop.html` 的链接。\n\n## 挑战规则\n\n*   每个应被提交的输入框必须有 `name` 属性。\n\
  *   每个表单控件必须有 `<label>` 元素。\n*   标题必须遵循逻辑顺序。\n*   表格仅用于数据。\n*   不要使用 `<div>` 来替代您已学过的有语义的元素。\n\
  \n如果您想更进一步：\n\n*   为合适的输入框添加 `required` 属性。\n*   为 **您是如何得知本研讨会的？** 添加一个 `<select>`\
  \ 下拉菜单。\n*   为文本输入框添加占位符文本。\n\n尝试在 `Live Preview` 中提交表单并观察发生了什么。\n\n如果满足以下条件，即表示您已成功完成挑战：\n\
  \n*   两个页面均可在 `Live Preview` 中正确打开。\n*   从 `workshop.html` 到 `signup.html` 的链接有效。\n\
  *   表单强制要求必填字段。\n*   提交表单会产生浏览器响应（即使报错）。\n\n本迷你挑战的解决方案可在本书的 GitHub 仓库中找到，链接如下：[`github.com/markjprice/web-dev-ai/blob/main/code/chapter02/workshop-challenge/`](https://github.com/markjprice/web-dev-ai/blob/main/code/chapter02/workshop-challenge/)\n\
  \n## 本挑战考察的内容\n\n本练习证明您理解：\n\n*   HTML 定义结构，而非样式。\n*   页面通过链接连接。\n*   表单收集并提交数据。\n\
  *   表格传达结构化信息。\n\n虽然 HTML 专注于网页内容，但它只是几种标记语言中的一种，了解 XML 和 SVG 等相关技术有助于全面理解结构化数据和图形如何在网络上表示。接下来让我们学习这些语言。\n\
  \n### 其他标记语言\n\nHTML 是与 Web 联系最紧密的标记语言，但它属于一个更广泛的语言家族，这些语言使用标签来描述内容。了解这个家族将帮助您认识到\
  \ HTML 并非随意或神奇的产物。它是从更长的历史中演变出的一个实用解决方案。\n\n## “标记语言”的含义\n\n**标记语言** 是一种向文本添加注释的系统，以便计算机能够理解该文本不同部分的含义。换句话说，标记回答了诸如以下的问题：\n\
  \n*   这段文本是标题还是段落？\n*   这是列表项还是表格单元格？\n*   此内容是数据、结构还是元数据？\n\n标记语言不执行逻辑。它们描述结构和含义。这使得\
  \ `HTML` 与 `XAML` 和 `SVG` 等语言处于同一概念范畴。\n\n`HTML` 是一种领域特定的标记语言，专为一项工作而设计：描述旨在 Web\
  \ 浏览器中查看的文档。\n\n`HTML` 故意设计得宽容。即使标记不完美，浏览器也会极力尝试显示合理的内容。这一设计选择是 Web 迅速普及的原因之一。\n\
  \n**XML**（**可扩展标记语言**）出现得较晚，采取了不同的方法。`HTML` 是有主见且宽容的，而 `XML` 对语法严格、可扩展（您可自定义标签），且专注于数据而非表现。\n\
  \n以下代码展示了一个 `XML` 示例：\n\n```\n<book>\n  <title>Python Programming</title>\n  <author>Mark</author>\n\
  \  <pages>320</pages>\n</book>\n```\n\n`XML` 和 `HTML` 之间有一些关键区别：\n\n*   每个标签必须关闭，要么使用结束标签（`<book>...</book>`），要么作为自闭合标签（`<br\
  \ />`），因为与允许未关闭空元素的 `HTML5` 不同，`XML` 不允许它们存在。\n*   标签必须正确嵌套。\n*   没有预定义的标签集。\n*\
  \   `XML` 不定义事物应如何显示。\n\n`XML` 通常用于配置文件、数据交换、文档格式和 API（尤其是历史上）。\n\n**提示**：请解释为什么\
  \ HTML 宽容但 XML 严格，并举例说明。\n\n## SVG：用于图形的标记\n\n**SVG**（**可缩放矢量图形**）是另一种标记语言，但用于图形而非文档。`SVG`\
  \ 使用标签来描述形状、路径、文本和变换，如以下代码所示：\n\n```\n<svg width=\"100\" height=\"100\">\n  <circle\
  \ cx=\"50\" cy=\"50\" r=\"40\" />\n</svg>\n```\n\n关于 `SVG` 有几个重要的理解点：\n\n*   它基于\
  \ `XML`。\n*   它描述*图形是什么*，而非如何绘制像素。\n*   它在任何分辨率下都能清晰缩放。\n\n`SVG` 可以直接嵌入 `HTML` 文档中，这就是为什么学习\
  \ `HTML` 结构会让以后理解 `SVG` 变得更容易。您将在 *第 4 章* *SVG – 绘制可缩放图形* 中学习 `SVG`。\n\n## 标记语言简史\n\
  \nHTML 并非第一种标记语言：\n\n1.  基于 **标准通用标记语言** (**SGML**) 的早期文档系统，在 Web 出现很久以前就启发了结构化标记。它是大多数标记语言（包括\
  \ `HTML`、`XML` 及其衍生语言）的鼻祖。`SGML` 是一种元语言，而非日常意义上的标记语言。这意味着 `SGML` 不定义一组固定的标签。相反，它定义了创建您自己的标记语言的规则。\n\
  2.  `HTML` 被创建用于描述带有链接的科学文档。随着浏览器变得更强大，并成为商业和工业的重要工具，`HTML` 增加了功能。`HTML` 是一种 `SGML`\
  \ 应用。\n3.  `XML` 应运而生，旨在提供一种严格的、通用的标记格式。`XML` 是 `SGML` 的简化后代。\n4.  `SVG` 应运而生，旨在以分辨率无关的方式描述图形。`SVG`\
  \ 通过 `XML` 继承了 `SGML` 的思想。\n5.  **XAML**（**可扩展应用程序标记语言**）是由 Microsoft 创建的标记语言，用于定义桌面和跨平台应用程序中的用户界面，而非网页。`XAML`\
  \ 最常与 **WPF** (**Windows Presentation Foundation**)、`WinUI`、`.NET MAUI` 和 `Avalonia`\
  \ 一起使用。\n\n它们不是竞争对手。它们是同一个理念的变体：带有含义的结构化标记，应用于不同的领域。\n\n**提示**：XHTML 在标记语言历史中处于什么位置？\n\
  \n## 为什么初学者应该关心\n\n`HTML` 之所以独特，并非因为它使用标签。它独特是因为它使用标记来描述面向 Web 的文档。其他标记语言服务于其他工作。\n\
  \n`HTML` 只是恰好成为将 Web 连接在一起的那一个。\n\n`SGML` 不是供您学习使用的东西。它是供您了解的东西。它是标记语言家族树的根源。一旦您知道它的来历，其他一切就更讲得通了。\n\
  \n\n\n\n### 参考资料与资源\n\n让我们回顾一下官方 HTML 文档和参考资料。\n\n## MDN Web 文档（初学者应从此处开始）\n\nMDN\
  \ Web 文档是互联网上最好的 HTML 文档，适合学习和日常参考。它由 Mozilla 维护，浏览器厂商和 Web 社区共同贡献。\n\n* 主页：[`developer.mozilla.org/`](https://developer.mozilla.org/)\n\
  * HTML 概览：[`developer.mozilla.org/en-US/docs/Web/HTML`](https://developer.mozilla.org/en-US/docs/Web/HTML)\n\
  * HTML 元素参考：[`developer.mozilla.org/en-US/docs/Web/HTML/Element`](https://developer.mozilla.org/en-US/docs/Web/HTML/Element)\n\
  * 表单和输入元素：[`developer.mozilla.org/en-US/docs/Learn/Forms`](https://developer.mozilla.org/en-US/docs/Learn/Forms)、[`developer.mozilla.org/en-US/docs/Web/HTML/Element/form`](https://developer.mozilla.org/en-US/docs/Web/HTML/Element/form)\
  \ 和 [`developer.mozilla.org/en-US/docs/Web/HTML/Element/input`](https://developer.mozilla.org/en-US/docs/Web/HTML/Element/input)\n\
  \nMDN 之所以出色，是因为它是为人类而非律师编写的，示例简单明了，且解释了“为什么”而不仅仅是“是什么”。它与真实的浏览器行为保持同步。\n\n**最佳实践**：如果初学者在学习\
  \ HTML 时只使用一个文档网站，那应该是 MDN。\n\n## W3C HTML 规范（官方但不适合初学者）\n\n**万维网联盟**（**W3C**）发布官方\
  \ HTML 规范。这是 HTML 在标准层面如何工作的正式定义。\n\n* HTML 规范登录页面：[`www.w3.org/TR/html/`](https://www.w3.org/TR/html/)\n\
  * HTML 生活标准（WHATWG，见下文）：[`html.spec.whatwg.org/`](https://html.spec.whatwg.org/)\n\
  \n规范是为浏览器实现者编写的，如微软、谷歌和苹果的程序员，他们构建渲染引擎。它不是为了教授 HTML 而编写的。它晦涩、精确且不留情面。\n\n这是参考资料，而非学习资料。你不会从头读到尾。只有在需要确切行为时才会查阅。\n\
  \n## WHATWG HTML 生活标准\n\n现在大多数浏览器都遵循 WHATWG HTML 生活标准，它持续演进，而不是冻结在版本中。\n\nHTML 生活标准：[`html.spec.whatwg.org/`](https://html.spec.whatwg.org/)\n\
  \n对于当前的浏览器行为，这是主要需要检查的规范。\n\n同样，这不是给初学者读的。它用于检查边缘情况、消除歧义，以及理解浏览器实际如何行为。\n\n## 初学者应如何实际使用这些资源\n\
  \n一种实用的方法是从 MDN 开始，构建一个小示例，仅在需要时查阅规范：\n\n* 概念\n* 示例\n* 最佳实践\n\n然后动手构建一些东西：\n\n*\
  \ 犯错\n* 捣乱\n* 修复它们\n\n只有在那时，如果：\n\n* 浏览器行为似乎古怪\n* 你需要绝对精确\n* 你好奇机制如何运作\n\n才去浏览官方规范。\n\
  \n学习 HTML，请使用 MDN Web 文档。它以人类思维的方式解释 HTML。\n\nW3C 和 WHATWG 规范定义了浏览器如何工作，但它们不是教学材料。请将它们视为参考手册，而非教程。\n\
  \n## 总结\n\n在本章中，你学习了以下内容：\n\n* HTML 描述内容的结构和含义，而非外观\n* HTML 文档由元素构建，元素由标签和内容组成\n\
  * 属性提供配置元素行为的额外信息\n* 标题创建页面的逻辑大纲，应反映含义而非外观\n* 段落、列表、链接、图片和表格代表不同类型的内容\n* 元素可以嵌套形成浏览器解释为树的层级结构\n\
  * 块级元素构建布局，而内联元素在文本中流动\n* 语义化 HTML 提高了可访问性、搜索引擎理解和可维护性\n* 表单允许用户输入数据并使用 `GET` 或\
  \ `POST` 提交到服务器\n* 每个表单控件必须有名称才能包含在提交的数据中\n* HTML 宽容且专为文档设计，不像 XML 等更严格的标记语言\n*\
  \ SVG 使用标记描述可缩放图形，可嵌入 HTML\n* 良好的 HTML 为 CSS 样式和 JavaScript 交互创造了坚实的起点\n\n在下一章中，你将学习\
  \ CSS，一种用于为网页内容提供样式和布局的语言。\n\n## 获取本书的 PDF 版本和更多内容\n\n扫描二维码（或访问 packtpub.com/unlock）。按名称搜索本书，确认版本，然后按照页面上的步骤操作。\n\
  \n![](img/Image16900.png)![](img/Image16908.png)\n\n*注意：请保留发票。直接从 Packt 购买不需要发票。*\n\
  \n#### 3\n"
- "## CSS – 为你的网页设置样式\n\n使用 `层叠样式表 (CSS)` 让你的页面变得美观。本章展示 CSS 如何控制表现和布局。\n\n在本章结束时，你将把一个普通的\
  \ HTML 文档转变为一个视觉上吸引人、可读且响应式的网页。你将理解样式如何应用，如何控制颜色和排版，元素如何在页面上定位，以及网站如何适应不同的屏幕尺寸。你还将学习如何发现和修复常见的\
  \ CSS 错误，包括使用 AI 工具帮助调试布局和样式问题，当事情看起来不如预期时。\n\n在本章中，我们将涵盖以下主题：\n\n* CSS 基础\n* 颜色、字体和布局\n\
  * 响应式设计\n* AI 挑战 – CSS 调试\n* 变换和动画\n\n本章建议的聊天机器人提示词及示例响应可在以下链接找到：[`github.com/markjprice/web-dev-ai/blob/main/prompts/ch03-css/readme.md`](https://github.com/markjprice/web-dev-ai/blob/main/prompts/ch03-css/readme.md)\n\
  \n## CSS 基础\n\nCSS 存在的目的是控制表现：HTML 描述内容是什么，CSS 描述内容应该是什么样子。将这些关注点分离使网页更易于维护、重设样式和扩展。\n\
  \n在 *第 2 章* *HTML – 构建你的网页* 中，你使用标题、段落、链接、图片、列表、表格和表单创建了页面。此时，浏览器决定所有内容的外观。字体遵循浏览器默认值，间距基本，所有内容垂直堆叠。CSS\
  \ 就是让你从浏览器手中夺回控制权，做出有意识的设计选择。\n\nCSS 通过定义规则工作。每条规则说“选择这些元素”并“将这些样式应用到它们上”。一旦你理解了这句话，你就理解了\
  \ CSS 的核心。\n\n## 向网页添加 CSS\n\n有三种方法将 CSS 应用到 HTML。你在实际项目中会看到所有三种，但只有一种推荐用于大多数网站。它们是：\n\
  \n* **内联 CSS**：在元素级别定义样式。\n* **内部 CSS**：在页面级别定义样式。\n* **外部 CSS**：在网站级别定义样式。\n\n\
  让我们看看每种的例子。\n\n**内联 CSS** 直接写在 HTML 元素上：\n\n```\n<p style=\"color: red;\">This text\
  \ is red.</p>\n```\n\n这行得通，但很乱。样式分散在你的 HTML 中，难以复用，维护痛苦。\n\n**最佳实践**：除非在实验，否则避免使用内联\
  \ CSS。\n\n**内部 CSS** 写在页面 `<head>` 部分的 `<style>` 标签内：\n\n\n\n### CSS 样式概述\n\n##\
  \ 内部和外部 CSS\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"\
  UTF-8\">\n  <title>My First CSS</title>\n  <style>\n    p {\n      color: blue;\n\
  \    }\n  </style>\n</head>\n<body>\n  <p>This paragraph is blue.</p>\n</body>\n\
  </html>\n```\n\n内部 CSS 比内联 CSS 更易于维护，但它仍然将样式定义绑定到单个 HTML 文件，因此如果你需要在多个网页中使用相同的样式，就必须复制它们。\n\
  \n良好实践：学习时应默认使用外部 CSS，因为它将结构和表现分离。稍后你可能会看到少量内部样式用于性能优化，特别是首屏 CSS，但不要从一开始就这么做。这是因为样式随网页一起下载并在\
  \ `<head>` 中定义，因此在内容渲染时样式会立即应用。\n\n外部 CSS 编写在单独的 `.css` 文件中并链接到 HTML。下载网页后，浏览器会下载\
  \ CSS 文件并将其样式应用到内容。\n\n让我们看一个示例：\n\n1. 创建一个名为 `Chapter03` 的新文件夹。\n2. 在 `Chapter03`\
  \ 文件夹中，创建一个名为 `StyleBasics` 的新文件夹。\n3. 在 `StyleBasics` 文件夹中，从以下链接下载名为 `index.html`\
  \ 的文件：[`github.com/markjprice/web-dev-ai/blob/main/Code/Chapter03/StyleBasics/index.html`](https://github.com/markjprice/web-dev-ai/blob/main/Code/Chapter03/StyleBasics/index.html)\n\
  4. 在 VS Code 中，打开 `StyleBasics` 文件夹。\n5. 在 `StyleBasics` 文件夹中，创建一个名为 `styles.css`\
  \ 的新文件并添加样式定义：\n\n```css\np {\n  color: green;\n}\n```\n\n6. 在 `index.html` 的 `<head>`\
  \ 元素中，添加指向 CSS 文件的链接：\n\n```html\n<link rel=\"stylesheet\" href=\"styles.css\">\n\
  ```\n\n7. 实时预览页面。段落现在应该是绿色的，如图 3.1 所示：\n\n![](img/B34553_03_01.png)\n\n图 3.1：外部\
  \ CSS 文件将段落颜色更改为绿色\n\n如果没有变化，请检查文件名、检查路径，并确保 `<link>` 标签位于 `<head>` 内部。\n\n从现在开始，除非另有明确说明，否则假设所有\
  \ CSS 都位于外部样式表中。\n\n良好实践：外部 CSS 是你应该默认使用的。它允许你一次性定义样式并在网站的所有网页中重复使用。\n\n## 选择器和规则\n\
  \nCSS 规则包含两个主要部分：选择器和声明块：\n\n```css\np {\n  color: navy;\n  font-size: 18px;\n}\n\
  ```\n\n在前面的代码中：\n\n* `p` 是选择器。它告诉浏览器要定位哪些元素。\n* 花括号 `{ }` 内的所有内容都是声明块。\n* 每个声明都是一个属性（如\
  \ `color` 或 `font-size`）和一个值（如 `navy` 或 `18px`），由冒号分隔并以分号结尾。\n* 此规则将深蓝色和 18px 字体大小应用于页面上的所有\
  \ `<p>` 元素。\n\n尝试将这些规则添加到你的样式表文件中：\n\n```css\nh1 {\n  color: darkslateblue;\n}\n\
  p {\n  color: green;\n  font-size: 18px;\n  line-height: 1.8;\n}\n```\n\n前面的代码展示了元素选择器的示例。这些选择器选择相同标签类型的所有元素。在这些示例中，规则应用于所有\
  \ `<h1>` 元素和所有 `<p>` 元素。但如果你只想选择一部分标题和段落怎么办？我们可以使用另外两种类型的选择器来实现。\n\n## 类和 ID\n\n\
  定位每个段落或标题通常是不够的。你经常希望以不同的方式设置特定元素的样式。CSS 类可以在多个元素中重复使用。你可以将此示例添加到你的网页和样式表文件中。\n\n\
  要添加的 HTML：\n\n```html\n<h2>Example of a class selector</h2>\n<p class=\"intro\"\
  >This will be bold and 14px.</p>\n<p>This is regular content.</p>\n```\n\n要添加的 CSS\
  \ 如下代码所示：\n\n```css\n.intro {\n  font-size: 14px;\n  font-weight: bold;\n}\n```\n\
  \n类选择器总是以点开头，如前面代码中的 `.intro`。\n\n类或 ID 名称是一个标识符。关键规则如下：\n\n* 不得包含空格。\n* 可以包含字母、数字、连字符和下划线。\n\
  * 不得以数字开头。\n* 可以以字母或连字符开头。\n* 区分大小写，但依赖大小写差异是个坏主意。\n\n还有实用的命名约定：\n\n* 仅使用小写，因为混合大小写会增加认知负担并引发错误。\n\
  * 使用连字符而非下划线，因为连字符是 CSS 中的主流约定，且与属性命名（如 `font-size` 和 `background-color`）一致。\n*\
  \ 按用途命名，而非外观。例如，`.red-text` 不好，`.error-message` 好。此准则能避免后续麻烦。\n\n元素的 ID 在页面内应唯一。因此\
  \ ID 选择器应仅选择页面上的那个唯一元素并将其样式应用于它。\n\n要添加的 HTML 在下面的代码中高亮显示：\n\n```html\n<h1 id=\"\
  main-title\">My Styled Web Page</h1>\n```\n\n要添加的 CSS 如下代码所示：\n\n```css\n#main-title\
  \ {\n  text-transform: uppercase;\n}\n```\n\nID 选择器以井号开头，如前面代码中的 `#main-title`。谨慎使用\
  \ ID。类的扩展性更好，也更易于重用。\n\n良好实践：避免使用 ID 进行样式设置，因为它们只能应用于一个元素。即使你目前只有一个元素需要某种样式，你也可能想改用类来应用。这样，如果稍后添加另一个需要相同样式的元素，你可以轻松应用。\n\
  \n## 层叠和具体性\n\nCSS 代表层叠样式表，层叠很重要。当多条规则针对同一元素时，浏览器必须决定哪一条生效。\n\n考虑以下 CSS：\n\n```css\n\
  p {\n  color: black;\n}\n.intro {\n  color: darkgreen;\n}\n```\n\n以及此 HTML：\n\n\
  ```html\n<p class=\"intro\">Hello world</p>\n```\n\n元素选择器将段落设为 `black`。类选择器规则规定将带有\
  \ `.intro` 类的任何元素着色为 `darkgreen`。哪一个生效？\n\n段落将呈深绿色而非黑色，因为类选择器比标签选择器更具体。\n\n> **提示**：请用真实示例解释\
  \ CSS 层叠，展示元素、类和 ID 选择器之间的冲突。展示 CSS 规则冲突的示例并解释为何一条规则胜过另一条。\n\n具体性规则非常复杂，让我们简化它们：\n\
  \n* 元素选择器最弱\n* 类选择器覆盖元素选择器\n* ID 选择器覆盖两者\n* 内联样式覆盖其他所有\n\n```\nElement < Class <\
  \ ID < Inline\n```\n\n顺序也很重要。如果两条规则的具体性相等，样式表中靠后编写的那条生效。例如，以下 CSS 有两条类规则：\n\n```css\n\
  .intro {\n  color: darkgreen;\n}\n.branding {\n  color: darkred;\n}\n```\n\n如果我们有一个同时应用了这两个类的元素：\n\
  \n```html\n<p class=\"intro branding\">Hello world</p>\n```\n\n然后先应用 `.intro` 样式，接着应用\
  \ `.branding` 样式，使文本颜色变为 `darkred`。\n\n要对同一元素应用多个类，请用空格分隔。class 属性中类名的顺序无关紧要。`class=\"\
  intro branding\"` 和 `class=\"branding intro\"` 效果相同。\n\n具体性解释了许多“为什么我的 CSS 不生效？”的时刻。\n\
  \n> **提示**：什么是 CSS 具体性，如何逐步计算它？\n\n## 盒模型\n\n网页上的每个元素都是一个矩形框。如果你想要行为可预测的布局，理解这一点很重要。\n\
  \n\n\n### CSS 盒模型与布局\n\n如图 3.2 所示，每个盒子由以下部分组成：\n\n- **元素内容**：文本或图像本身\n- **内边距**：元素内部、内容周围的空间\n\
  - **边框**：围绕内边距的*线条*\n- **外边距**：元素外部的空间，将其与周围的其他元素分隔开\n\n![](img/B34553_03_02.png)\n\
  \n图 3.2：CSS 盒模型\n\n尝试以下示例 CSS：\n\n```css\n.card {\n  width: 300px;\n  padding: 16px;\n\
  \  border: 5px dashed #333;\n  margin: 20px;\n}\n```\n\n一个重要细节：`width: 300px;` 设置的是内容区域的宽度，而非盒子的总可见宽度。因为该卡片左右两侧各有\
  \ `padding: 16px;` 和 `5px` 的边框，完整渲染宽度为 `300` + `16` + `16` + `5` + `5` = `342px`，再加上任何外部外边距。这是默认的\
  \ CSS 盒模型，也是初学者最容易踩坑的地方之一。\n\n本章后面你将看到 `box-sizing: border-box;` 如何改变这种行为，使声明的宽度包含内边距和边框。\n\
  \n以下是要添加的 HTML：\n\n```html\n<h2>Box model example</h2>\n<div class=\"card\">\n \
  \ <h3>Card Title</h3>\n  <p>This is a simple content card. This is a simple content\
  \ card. This is a simple content card. This is a simple content card. This is a\
  \ simple content card.</p>\n</div>\n```\n\n尝试修改内边距和外边距的数值。观察元素内部和外部空间如何变化。你将在本章及后续的布局工作中反复用到这个概念。\n\
  \n`margin: 0 auto;` 之所以能让元素水平居中，是因为当元素具有限定宽度时，浏览器会按特定方式计算外边距。这是以下代码的简写：\n\n```css\n\
  margin-top: 0;\nmargin-bottom: 0;\nmargin-left: auto;\nmargin-right: auto;\n```\n\
  \n垂直外边距固定为零，而水平外边距设为 `auto`。这仅在元素满足以下条件时生效：\n\n- 是块级元素，且\n- 宽度小于可用空间\n\n如果元素已经填满了其容器的整个宽度，就没有多余空间可供分配，也就无法居中。当左右外边距设为\
  \ `auto` 时，浏览器会计算扣除元素宽度后剩余的水平空间。\n\n`margin: 0 auto;` 无法实现垂直居中，因为垂直外边距不参与相同的自动空间分配逻辑。在正常文档流中，外边距没有“分配剩余高度”的概念。\n\
  \n你可以把 `margin: 0 auto;` 理解为告诉浏览器将剩余的水平空间均匀分配到该盒子的两侧。\n\n如果没有空间可分，则不会发生移动。这解释了大多数常见情况。\n\
  \n**提示**：请结合可视化示例和常见错误，解释外边距、内边距和边框的区别。\n\n请逐步添加以下 CSS。不要一次性全部粘贴。添加一条规则，刷新，观察，重复：\n\
  \n```css\nbody {\n  font-family: Arial, Helvetica, sans-serif;\n  background-color:\
  \ #f5f5f5;\n  color: #222;\n}\ndiv.container {\n  max-width: 800px;\n  margin: 0\
  \ auto;\n  padding: 20px;\n  background-color: white;\n}\na {\n  text-decoration:\
  \ none;\n  color: #0066cc;\n}\na:hover {\n  text-decoration: underline;\n}\n```\n\
  \n请注意上述代码的以下几点：\n\n- `body` 选择器作用于整个页面。`font-family` 设置默认字体栈。浏览器会先尝试 `Arial`，然后是\
  \ `Helvetica`，最后是任何通用的 `sans-serif` 字体。这是一个适合简单易读文本的常用字体栈。`background-color: #f5f5f5;`\
  \ 给整个页面一个非常浅的灰色背景。`color: #222;` 将默认文本颜色设为非常深的灰色而非纯黑色，这样对眼睛更友好。\n- `div.container`\
  \ 选择器针对 `<div class=\"container\">`。`max-width: 800px;` 将内容宽度限制在 800 像素，即使在大屏幕上也是如此，这通过防止过长的行来提高可读性。`margin:\
  \ 0 auto;` 表示无上下外边距，浏览器均匀分配空间使容器水平居中。`padding: 20px;` 在容器内部添加空间，使内容不贴边。`background-color:\
  \ white;` 在浅灰色页面背景上创建白色卡片效果。\n- `a` 选择器（用于超链接）移除链接的默认下划线并设置自定义蓝色。`a:hover` 选择器在鼠标指针悬停在链接上时生效，恢复下划线，给用户一个视觉提示，表明该文本可交互。\n\
  \n**良好实践**：默认移除链接下划线并在悬停时动态添加，意味着链接在非悬停状态下仅靠颜色识别。这会让色觉缺陷用户更难识别链接。更无障碍的做法是在默认状态下保留下划线（或添加除颜色外的其他视觉区分，如字重或\
  \ `border-bottom`，或确保链接颜色与周围文本有足够对比度）。\n\n你还没学完这段 CSS 中的所有内容，这没关系。这里你学到的是一个可复用的调试过程，而不是死记硬背修复方法。你现在应该能看到\
  \ CSS 如何将普通 HTML 转变为具有更清晰间距、颜色和排版的页面。\n\n**提示**：选择器 `a:hover` 的作用是什么？\n\n## 四边模型\n\
  \n在 CSS 中，许多属性作用于盒子的四个边。CSS 没有发明四个互不相关的属性，而是采用基于上、右、下、左的方向系统。一旦理解了这种模式，大量 CSS 突然变得可预测，而非随意。\n\
  \n大多数与布局相关的 CSS 属性作用于相同的四个边：上、右、下、左。这些方向始终遵循相同的顺时针顺序，这在使用简写语法时很重要。\n\n### 支持方向变体的属性\n\
  \n最常见的具有 `-top`、`-right`、`-bottom` 和 `-left` 形式的属性是间距属性，如 `margin` 和 `padding`。\n\
  \n每个属性都有：\n\n- `margin-top`、`margin-right`、`margin-bottom`、`margin-left`\n- `padding-top`、`padding-right`、`padding-bottom`、`padding-left`\n\
  - `border-top`、`border-right`、`border-bottom`、`border-left`\n\n边框还有子属性：\n\n- `border-top-width`、`border-top-style`、`border-top-color`\n\
  - 以及其他边的对应属性\n\n定位偏移量（当 `position` 不为 `static` 时）：`top`、`right`、`bottom`、`left`。\n\
  \n注意圆角的命名模式：\n\n- `border-top-left-radius`\n- `border-top-right-radius`\n- `border-bottom-right-radius`\n\
  - `border-bottom-left-radius`\n\n### 简写与全写\n\n这些属性大多同时支持简写和全写。\n\n以 margin 为典型示例。要将四边都设为\
  \ `20px`：\n\n```css\nmargin: 20px;\n```\n\n要将上下设为 `10px`，左右设为 `20px`：\n\n```css\n\
  margin: 10px 20px;\n```\n\n要将上设为 10px，左右设为 `20px`，下设为 `30px`：\n\n```css\nmargin:\
  \ 10px 20px 30px;\n```\n\n要将上设为 `10px`，右设为 `20px`，下设为 `30px`，左设为 `40px`：\n\n```css\n\
  margin: 10px 20px 30px 40px;\n```\n\n顺序始终是：上 → 右 → 下 → 左。\n\n一个实用的记忆法是*从上开始顺时针*。\n\
  \n相同规则适用于 `padding`、`border-width` 和 `border-radius`（圆角有一些特殊情况）。\n\n\n\n\n### CSS\
  \ 盒模型与布局概念\n\n之存在这个模型，是因为 CSS 盒模型具有方向性。内容位于 `padding` 内部，`padding` 位于 `borders`\
  \ 内部，而 `borders` 通过 `margins` 与其他元素分隔。这些层中的每一个在每一侧都可以不同。\n\nCSS 选择了可预测性而非冗长性。需要时你可以显式声明，不需要时可以简洁书写。\n\
  \n## 何时使用长手写法与简写属性名\n\n在以下情况下使用长手写法属性名：\n\n*   仅需调整单侧\n*   稍后想覆盖特定侧边\n*   修复 Bug\
  \ 需要精确控制\n\n```\nmargin-bottom: 24px;\n```\n\n在以下情况下使用简写属性名：\n\n*   数值对称\n*   想要视觉上的分组\n\
  *   想让代码表明这些侧边属于一组\n\n```\npadding: 16px 24px;\n```\n\n这比四行单独的声明能更好地传达布局意图。这比重写整个简写声明更清晰。\n\
  \n## 什么是 box-sizing 以及为何使用 border-box？\n\n默认情况下，CSS 使用 content-box 模型来计算元素尺寸。这意味着当你设置\
  \ `width` 或 `height` 时，仅定义了内容区域的大小。`padding` 和 `borders` 会在其基础上叠加，从而增加元素的总尺寸：\n\n\
  ```\n.card {\n  width: 300px;\n  padding: 20px;\n  border: 5px solid #333;\n}\n\
  ```\n\n在上述示例中，实际渲染宽度并非 300px。它变为：\n\n*   300px（内容）\n*   40px（左侧和右侧 `padding`）\n\
  *   10px（左侧和右侧 `border`）\n*   总宽度 = 350px\n\n这常让初学者感到意外，也是布局 Bug 的常见来源，尤其是当元素溢出其容器时。\n\
  \n### border-box 替代方案\n\n`box-sizing` 属性改变了浏览器计算元素尺寸的方式。当设置为 `border-box` 时，`width`\
  \ 和 `height` 包含内容、 `padding` 和 `border`：\n\n```\n.card {\n  box-sizing: border-box;\n\
  \  width: 300px;\n  padding: 20px;\n  border: 5px solid #333;\n}\n```\n\n现在总宽度精确保持\
  \ 300px，内容区域会收缩以腾出空间给 `padding` 和 `border`。\n\n如今大多数开发者使用 `box-sizing: border-box`，因为它符合人们对布局的自然认知：\n\
  \n*   设为 300px 宽的盒子实际显示为 300px 宽\n*   `padding` 和 `borders` 不会意外增加尺寸\n*   布局更易理解和维护\n\
  *   减少了由元素溢出引起的 Bug\n\n这在响应式设计中尤为重要，因为元素必须适应不同屏幕尺寸而不破坏布局。\n\n开发者通常全局应用 `box-sizing`，而非在单个元素上设置：\n\
  \n```\n*,\n*::before,\n*::after {\n  box-sizing: border-box;\n}\n```\n\n上述代码确保所有元素（包括伪元素）使用相同的尺寸模型。\n\
  \n对大多数项目而言，从一开始就使用 `box-sizing: border-box` 能让 CSS 表现得更直观、更可靠。\n\n## 如何编写 CSS 注释\n\
  \nCSS 仅使用块注释：\n\n```\n/* This is a CSS comment */\n```\n\nCSS 中不存在单行注释语法。`/* */`\
  \ 之外的任何内容均视为代码。注释可出现在样式表的几乎任何位置：\n\n```\nbody {\n  color: #222; /* Main text color\
  \ */\n  background-color: #fff;\n}\n```\n\n注释应解释意图，而非重述代码已有的含义。以下是无意义注释的示例：\n\n\
  ```\n/* Set the color to blue */\ncolor: blue;\n```\n\n以下是有用注释的示例：\n\n```\n/* Primary\
  \ link color chosen for contrast on light backgrounds */\ncolor: #0066cc;\n```\n\
  \n该注释解释了值存在的原因，而非语法的作用。\n\n### 注释真正有用的场景\n\n使用注释将样式表划分为逻辑区块：\n\n```\n/* =========================\n\
  \   Base styles\n   ========================= */\n```\n\n随着文件增长，这极为有用。\n\n为非显而易见的决策添加注释。若数值看似任意，请解释它：\n\
  \n```\n/* Extra padding prevents text from touching rounded corners */\npadding:\
  \ 18px 22px;\n```\n\n为变通方法和 Hack 添加注释。若你曾与浏览器抗争，请记录下来：\n\n```\n/* Safari rounding\
  \ bug: prevents 1px overflow on flex items */\noverflow: hidden;\n```\n\n未来的你会感谢过去的你。\n\
  \n不要注释显而易见的规则：\n\n```\n/* Center the content */\nmargin: 0 auto;\n```\n\nCSS 注释会被浏览器忽略，不影响渲染。生产构建时，工具常自动移除它们。这意味着注释是给人看的，而非机器。\n\
  \n**良好实践**：若注释无法减少其他开发者理解规则存在原因所需的时间，则不应存在。这包括未来的你。\n\n## 继承与非继承属性\n\nCSS 初看让人感到不可预测的原因之一，是并非所有属性行为一致。某些属性从父元素继承，而另一些则不。\n\
  \n继承属性会自动从父元素传递给子元素。这些通常与文本和可读性相关。例如，若你在 CSS 文件中为 `<body>` 元素设置 `font-family` 或\
  \ `color`：\n\n```\nbody {\n  font-family: Arial, Helvetica, sans-serif;\n  color:\
  \ #222;\n}\n```\n\n则其内部大多数元素将使用这些值，除非在页面上显式覆盖，如 `<p>` 和 `<div>` 元素：\n\n```\n<p>This\
  \ text inherits the font and color.</p>\n<div>\n  <p>This paragraph also inherits\
  \ the same styles.</p>\n</div>\n```\n\n此例中，两个段落均从 `<body>` 元素继承了 `font-family` 和\
  \ `color`。\n\n常见继承属性包括 `color`、`font-family`、`font-size`、`line-height` 和 `text-align`。\n\
  \n非继承属性不会自动向下传递。这些通常与布局和间距相关。每个元素若需要则必须显式定义。例如，若你在 CSS 文件中为 `<body>` 元素设置 `margin`\
  \ 或 `border`：\n\n```\nbody {\n  margin: 20px;\n  border: 5px solid red;\n}\n```\n\
  \n则其内部大多数元素在页面上不会使用这些值：\n\n```\n<div>\n  <p>This paragraph does not inherit the\
  \ margin or border.</p>\n</div>\n```\n\n即使 `<body>` 拥有 `margin` 和 `border`，内部的 `<div>`\
  \ 和 `<p>` 也不会继承这些值。\n\n常见非继承属性包括 `margin`、`padding`、`border`、`width`、`height` 和\
  \ `background-color`。\n\n如有需要，可使用 `inherit` 值强制继承：\n\n```\np {\n  border: inherit;\n\
  }\n```\n\n这告知段落显式采用与其父元素相同的 `border`。\n\n理解哪些属性继承、哪些不继承，有助于解释许多令人困惑的 CSS 行为。当某样式未生效时，问题往往在于你依赖继承来应用一个默认不继承的属性。\n\
  \n**提示**：请解释 CSS 中的继承机制及默认继承的属性有哪些。\n\n## Web 内容无障碍指南 (WCAG)\n\n编写 CSS 时，不仅要考虑网站外观，还要考虑如何让尽可能多的人使用。**Web\
  \ 内容无障碍指南** (**WCAG**) 是一套国际公认的建议，旨在使 Web 内容更易访问，特别是针对残障人士。\n\nWCAG 围绕四大核心原则构建。内容应**可感知**，即用户能看见或听到。应**可操作**，即用户能通过多种输入方式（包括键盘）与其交互。应**可理解**，具有清晰且可预测的行为。最后应**健壮**，即能在不同浏览器、设备和辅助技术上工作。\n\
  \n\n\n\n\n### 无障碍与 CSS\n\nCSS 在无障碍方面发挥着重要作用。例如，在文本和背景之间选择足够的色彩对比度有助于视力受损的用户。避免使用固定字号可让用户更轻松地缩放文本。确保焦点状态（如链接和按钮上的轮廓）可见，可支持键盘导航。\n\
  \n无障碍不是可选的额外项，也不是最后一步。它应从设计和开发过程的一开始就予以考虑。遵循 WCAG 指南能打造出更具包容性、更易用且整体设计往往更优秀的网站。\n\
  \n以下链接将帮助你学习 WCAG：\n\n* **在深入规则之前解释无障碍的*原因*：** [`www.w3.org/WAI/fundamentals/accessibility-intro/`](https://www.w3.org/WAI/fundamentals/accessibility-intro/)\n\
  * **快速参考：** [`www.w3.org/WAI/WCAG22/quickref/`](https://www.w3.org/WAI/WCAG22/quickref/)\n\
  * **当前 WCAG 完整规范（2.0、2.1、2.2）及支持文档和解释：** [`www.w3.org/WAI/standards-guidelines/wcag/`](https://www.w3.org/WAI/standards-guidelines/wcag/)\n\
  \n在下一节中，我们将深入探讨色彩、字体和布局，并开始做出设计选择，而不是依赖浏览器默认值。\n\n### 色彩、字体与布局\n\n在初学者项目中，简单的设计选择通常比增加更多装饰效果更好。好的设计主要在于克制。CSS\
  \ 赋予了你巨大的能力，最难的部分在于知道何时停手。\n\n## 使用色彩\n\nCSS 中色彩的语法很简单，但选好色彩却更难。你设置一个值，浏览器绘制像素。难点不在于语法，而在于一致性和对比度。\n\
  \nCSS 支持多种色彩格式，但你应重点关注两种：像 `red` 或 `darkblue` 这样的命名色彩，以及十六进制值：\n\n```\ncolor: red;\n\
  color: #336699;\n```\n\n`red` 和 `blue` 等命名色彩主要用于快速实验。真实项目使用十六进制值，因为它们精确且可预测。\n\n\
  十六进制色彩写作 `#RRGGBB`，其中每一对控制红、绿、蓝的强度。\n\n```\nbody {\n  background-color: #f5f5f5;\n\
  \  color: #222222;\n}\n```\n\n与纯黑配纯白相比，这种组合已经提高了可读性，纯黑配纯白对眼睛刺激太强。\n\n你也可以使用色彩函数：\n\
  \n```\ncolor: rgb(255, 99, 71);\ncolor: rgba(255, 99, 71, 0.5);\ncolor: hsl(120,\
  \ 60%, 50%);\ncolor: hsla(120, 60%, 50%, 0.7);\n```\n\n**提示：** 请解释色彩函数 `rgb`、`rgba`、`hsl`\
  \ 和 `hsla`，特别是如何设置 alpha 或透明度。\n\n几条能让你远离丑陋页面的铁律：\n\n* 不要使用过多色彩。两三种核心色彩对大多数初学者项目足矣。\n\
  * 确保文本对比度足够高。WCAG 2.1 AA 要求普通文本的最小对比度为 4.5:1，大号文本（18pt+ 或 14pt 粗体）为 3:1。白底浅灰字看似时尚，实则阅读体验极差。\n\
  * 用色彩传达含义，而非装饰。链接、错误、警告和高亮应有意义且一致地使用色彩。\n\n**提示：** 如何检查我的色彩对比度是否符合 WCAG 标准？除了色彩对比度，有哪些\
  \ CSS 技术能提升无障碍性？\n\n## 字体与排版\n\n排版对可读性的影响往往大于色彩。糟糕的字体选择比几乎任何其他因素都能更快地让网站显得不专业。\n\
  \n从简单入手。系统字体是你的朋友：\n\n```\nbody {\n  font-family: Arial, Helvetica, sans-serif;\n\
  }\n```\n\n这告诉浏览器：若有 `Arial` 则用 `Arial`，否则用 `Helvetica`，再否则用任意通用无衬线字体。它加载即时，在各平台上都显示整洁。\n\
  \n浏览器使用合理的默认字号（通常为 16px），用户可为可读性调整此值。与其用固定像素值覆盖，不如优先使用百分比或 `rem`（根 `em`，稍后解释）等相对单位，以尊重用户偏好。你通常应信任浏览器默认字号并在其基础上构建，而非覆盖它。例如，将其设为\
  \ `100%`，或为营销类网站的主页设置稍大的字号：\n\n```\nhtml {\n  font-size: 112.5%; /* ~18px 等效值 */\n\
  }\n```\n\n**良好实践：** 在 `body` 上设置 `font-size` 会影响大多数文本，因为字号默认会被继承，且大多数元素都在 `<body>`\
  \ 内。你会在许多代码示例中看到这种做法，LLM 也常遵循这一旧习惯。但 `<body>` 不定义根字号，因此它不控制 `rem` 单位。要控制 `rem` 和默认\
  \ `font-size`，请使用 `html` 选择器。\n\n行高与字号同等重要。过密的文本让人感到压抑。稍微宽松的间距则让人感觉平静且易读：\n\n```\n\
  body {\n  line-height: 1.6;\n}\n```\n\n标题应与正文形成清晰对比，但不必喧宾夺主：\n\n```\nh1, h2, h3\
  \ {\n  line-height: 1.3;\n}\nh1 {\n  font-size: 2rem;\n}\nh2 {\n  font-size: 1.5rem;\n\
  }\n```\n\n**良好实践：** 避免将所有内容设为粗体或大写。大多数初学者网站看起来很糟，是因为它们试图用字体制造戏剧效果，而不是追求可读性。可读性为王。\n\
  \n**提示：** 请结合实际例子解释 `px` 与 `%`、`em`、`rem` 的区别及各自的使用场景。`rem` 和 `em` 在嵌套元素中的表现有何不同？请包含一个示例展示\
  \ `em` 如何复合而 `rem` 不会。\n\n## 布局基础\n\nHTML 默认垂直堆叠元素。CSS 布局关乎控制宽度、间距和对齐，使页面具有清晰的结构。\n\
  \n首先限制主要内容区块的内容宽度：\n\n```\nmain {\n  max-width: 800px;\n  margin: 0 auto;\n  padding:\
  \ 20px;\n}\n```\n\n这一条规则能起到多重作用：\n\n* 防止文本行过宽\n* 使内容水平居中\n* 在内容周围添加呼吸空间\n\n这种模式几乎出现在所有专业网站中。\n\
  \n间距比边框和背景更重要。如果你将主要内容分为多个区块，则在每个区块底部添加额外的外边距：\n\n```\nsection {\n  margin-bottom:\
  \ 40px;\n}\n```\n\n留白不是浪费的空间。它是眼睛理解结构的方式。留白帮助读者区分板块、层级和分组。当你需要多列时，抵制用外边距强行实现的冲动。使用专为该任务设计的布局工具。\n\
  \n例如，定义一个类样式：\n\n```\n.layout {\n  display: flex;\n  gap: 20px;\n}\n```\n\n然后将该类样式应用到\
  \ `<div>` 等元素上：\n\n```\n<div class=\"layout\">\n  <aside>侧边栏内容</aside>\n  <main>主要内容</main>\n\
  </div>\n```\n\n你稍后将正式学习 Flexbox，但即使现在你也能看到它如何在无需 Hack 的情况下生成整洁、可预测的布局。\n\n`gap`\
  \ 属性控制布局容器中项目间的间距，最常用于 Flexbox 和 Grid。它的存在是为了解决 CSS 中一个由来已久且恼人的问题：在无需 Hack 的情况下均匀间隔元素。\n\
  \n当容器使用 Flexbox 时，`gap` 定义的是 flex 项目之间的间距，而非容器外部的间距。例如，使用以下 CSS：\n\n```\n.container\
  \ {\n  display: flex;\n  gap: 20px;\n}\n```\n\n在以下 HTML 中，每个项目将精确地由 20 像素分隔。你不需要给子元素设置外边距，也不需要为最后一个项目编写特殊规则：\n\
  \n```\n<div class=\"container\">\n  <div>One</div>\n  <div>Two</div>\n  <div>Three</div>\n\
  </div>\n```\n\n使用 Flexbox，你可以为行间距和列间距设置不同的值：\n\n```\ngap: 10px 20px;\n```\n\n\n\n\
  \n这首先设置行间距，然后设置列间距。使用 Grid，你可以显式设置 `row-gap` 和 `column-gap`。\n\n### 提示\n请解释 `display:\
  \ flex` 的工作原理，以及 `flex-direction`、`justify-content` 和 `align-items` 的作用，包括 `gap`\
  \ 和 `margin` 的区别。\n\n你现在拥有足够的 CSS 来控制基本的表现和布局。现在让我们看看每个网页都必须处理的主题：适应不同的设备，从大型台式机到手机和平板电脑的小屏幕。\n\
  \n### 响应式设计\n\n到目前为止，你设计的所有样式都假设有一个舒适的桌面屏幕。如今，这种假设错误的时候比正确的时候更多。网站在手机、平板电脑、笔记本电脑、超宽显示器、电视以及两者之间的各种设备上查看。响应式设计就是让一个网站在不破坏布局、不强迫用户缩放和横向滚动的情况下进行适应。响应式设计主要是应用了灵活的尺寸和布局决策的标准\
  \ CSS。\n\n## 响应式设计的真正含义\n\n响应式设计并不意味着*先为移动端设计*，然后拉伸以适应桌面端。它意味着创建能够响应可用空间的布局。\n\n\
  一个响应式页面：\n\n*   根据屏幕宽度调整布局\n*   在所有尺寸下保持文本可读\n*   避免横向滚动\n*   不到处依赖固定像素宽度\n\n如果你的布局只在一种屏幕尺寸下工作，它就是脆弱的。\n\
  \n## 视口及其重要性\n\n每个响应式网页都从 `<head>` 部分的这一行开始：\n\n```\n<meta name=\"viewport\" content=\"\
  width=device-width, initial-scale=1.0\">\n```\n\n没有它，移动端浏览器会假装它们比实际宽得多，然后将页面缩小。结果看起来又小又破碎。\n\
  \n有了它，CSS 像素会更接近实际屏幕尺寸映射。你只需添加一次，但忘记它会破坏后续的一切。\n\n## 尝试一下：在浏览器中模拟移动设备\n\n你不需要实体手机来测试响应式布局。在\
  \ Chrome 中，打开 `Developer Tools` (`F12`)，然后点击设备工具栏图标或按 `Ctrl` + `Shift` + `M`。\n\n\
  选择像 `iPhone` 或 `Pixel` 这样的设备，然后调整视口大小。观察随着媒体查询生效，你的布局如何变化。\n\n这是调试响应式 CSS 最快的方法。\n\
  \n## 灵活布局代替固定宽度\n\n破坏响应式最快的方法是在到处硬编码宽度。\n\n例如，设置固定宽度是不良实践：\n\n```\nmain {\n  width:\
  \ 1200px;\n}\n```\n\n最好设置最大宽度，让宽度随可用宽度缩放，配合自动外边距和合理的固定内边距用于内容元素内部间距：\n\n```\nmain\
  \ {\n  max-width: 1200px;\n  margin: 0 auto;\n  padding: 20px;\n}\n```\n\n前面的布局：\n\
  \n*   在小屏幕上收缩\n*   在超大屏幕上停止增长\n*   保持居中且可读\n\n百分比和灵活单位自然适应：\n\n```\n.container {\n\
  \  width: 90%;\n}\n```\n\n这允许内容自由呼吸，而不将其钉死在特定设备尺寸上。\n\n### 提示\n哪些常见错误会破坏响应式布局？\n\
  \n## 响应式排版\n\n文本应随屏幕缩放，但不要剧烈变化。\n\n不要将所有东西绑定到像素，在适当的地方使用相对单位。\n\n你可以为页面的根元素 (`<html>`)\
  \ 设置字体大小作为起点：\n\n```\nhtml {\n    font-size: 100%;\n}\n```\n\n然后使用相对大小设置其他页面元素的大小：\n\
  \n```\nh1 {\n  font-size: 2rem;\n}\n```\n\n`rem` 代表 *root em*。它相对于根元素的字体大小，在大多数浏览器中默认为\
  \ `16px`。所以在默认大小下 `2rem` 为 `32px`。如果你更改根字体大小，所有 `rem` 值会按比例缩放。\n\n还有 `em`，它相对于父元素的字体大小，而非根元素。`rem`\
  \ 通常更受青睐，因为它更可预测，因为它始终引用相同的基准，无论嵌套如何。这提高了可访问性并保持比例一致。\n\n行长比字体大小更重要。过长的行难以阅读，尤其是在宽屏上。这就是为什么限制内容宽度是响应式设计的一部分。\n\
  \n## 使用 clamp() 实现流体字体大小\n\n到目前为止，字体大小都是相对于基础值固定的。在响应式设计中，你也可以让文本在尺寸之间平滑缩放，而不是在断点处跳变。\n\
  \nCSS 提供了 `clamp()` 函数用于此目的：\n\n```\nh1 {\n  font-size: clamp(1.5rem, 2.5vw, 2.5rem);\n\
  }\n```\n\n这意味着：\n\n*   字体永远不会小于 `1.5rem`\n*   它将基于视口宽度缩放 (`2.5vw`)\n*   它永远不会大于\
  \ `2.5rem`\n\n随着屏幕变宽，文本逐渐变大。在较小屏幕上，它会缩小，但保持可读。这种方法避免了在媒体查询断点处字体大小的突然跳变，能产生更平滑、更自然的排版。\n\
  \n将 `clamp()` 视为设置边界：在限制内灵活。作为初学者你还不需要使用 `clamp()`，但你会在 CSS 中看到它，因为它结合了灵活性与控制。\n\
  \n## 媒体查询\n\n媒体查询让你仅在特定条件为真时应用 CSS。最常见的是屏幕宽度：\n\n```\n@media (max-width: 768px)\
  \ {\n  body {\n    background-color: #ffffff;\n  }\n}\n```\n\n此规则仅在视口宽度为 768 像素或更小时应用，大致对应平板和手机领域。\n\
  \n一个基于你之前布局的实际例子：\n\n```\n.layout {\n  display: flex;\n  gap: 20px;\n}\n@media (max-width:\
  \ 768px) {\n  .layout {\n    flex-direction: column;\n  }\n}\n```\n\n在较大屏幕上，内容并排显示。在较小屏幕上，垂直堆叠。相同的\
  \ HTML。相同的 CSS 文件。基于空间的不同行为。\n\n### 提示\n请解释带有多个断点的媒体查询并给出真实示例。\n\n## 移动端优先思维\n\n\
  一个常见的新手错误是先为桌面端设计，然后试图用几十个覆盖来*修复*移动端。\n\n更好的方法是移动端优先设计：\n\n*   编写在小屏幕上工作的简单样式\n\
  *   为较大屏幕添加增强\n\n这通常看起来像这样：\n\n```\n.layout {\n    display: flex;\n    flex-direction:\
  \ column;\n    gap: 20px;\n}\n@media (min-width: 768px) {\n    .layout {\n     \
  \   flex-direction: row;\n    }\n}\n```\n\n默认样式到处都工作。较大屏幕获得更复杂的布局。这种方法产生更整洁的 CSS\
  \ 和更少的意外。\n\n### 提示\n什么是移动端优先设计？为什么它比桌面端优先更好？\n\n## 图片与响应式\n\n图片是布局破坏的常见来源。\n\n\
  至少，每张图片都应被约束：\n\n```\nimg {\n  max-width: 100%;\n  height: auto;\n}\n```\n\n这防止图片溢出其容器，在小屏幕上炸裂布局。\n\
  \n在下一节中，你将故意破坏一个响应式布局，然后使用 AI 辅助调试来修复它。这个练习比记忆语法更重要，因为响应式 Bug 不可避免，知道如何理解它们才是真正的技能。\n\
  \n### AI 挑战 – CSS 调试\n\n本节故意使用有问题的 CSS。你将使用有问题的、令人困惑的、略微错误的 CSS。这不是意外。编写 CSS 很容易。理解为什么\
  \ CSS 没有按你预期的方式工作才是真正的技能。\n\n这里的目标不是记忆修复方法，而是学习一个可重复的调试过程，并将 AI 作为问题和解释的来源，而不是替代你自己检查浏览器。\n\
  \n\n\n这是软件开发领域一场更大规模转变的一部分。编写代码很重要，但其重要性不如过去。更重要的是理解系统如何运作、布局为何损坏、浏览器在做什么，以及你实际想要什么结果。换句话说，开发者的价值正从编写\
  \ CSS 规则转移到至少能指出以下这些问题：\n\n1. 固定宽度（`width: 800px`）破坏响应式布局\n2. 媒体查询使用了 `flex-direction:\
  \ row`，而这已经是默认值\n3. 整体布局没有间距或宽度约束\n\n如果 AI 在不加解释的情况下直接给出修正后的 CSS，请要求澄清。你应该是在学习，而不是在抄答案。\n\
  \n## 步骤 4：增量应用修复\n\n现在逐个问题修复 CSS。\n\n首先，移除刚性宽度：\n\n```\n.sidebar {\n  max-width:\
  \ 300px;\n  width: 100%;\n}\n```\n\n接下来，修正媒体查询，在宽度小于 768 像素时使用列布局而非行布局：\n\n```\n\
  @media (max-width: 768px) {\n  .layout {\n    flex-direction: column;\n  }\n}\n\
  ```\n\n然后改进间距和包含：\n\n```\n.layout {\n  display: flex;\n  gap: 20px;\n  max-width:\
  \ 1200px;\n  margin: 0 auto;\n  padding: 20px;\n}\n```\n\n每次更改后重新加载页面。观察改进了什么以及为什么。\n\
  \n## 步骤 5：问“还可能出什么问题？”\n\n现在再次挑战 AI。\n\n尝试类似以下的提示词：\n\n* `What accessibility issues\
  \ might this layout still have?`\n* `What happens if the menu text becomes much\
  \ longer?`\n* `How would this behave on a very wide screen?`\n\nAI 擅长指出你尚未学会预见的边缘情况。\n\
  \n## 使用浏览器开发者工具调试 CSS\n\n当 CSS 的表现不符合预期时，最快的理解方法是使用浏览器的开发者工具。每个浏览器都内置了工具，让你能够检查元素、查看应用的样式，并实时尝试更改。\n\
  \n你可以通过右键点击元素并选择 `Inspect`（检查），或者在大多数浏览器中按 `F12` 或 `Ctrl` + `Shift` + `I` 来打开开发者工具。\n\
  \n### 检查元素和样式\n\n对 CSS 最有用的面板是 `Elements`（元素）（或 `Inspector`（检查器））面板。当你选择一个元素时，一边会显示\
  \ HTML 结构，另一边会显示应用于该元素的所有 CSS 规则。\n\n每条规则显示：\n\n* 应用它的选择器\n* 它来自哪个文件\n* 它是否被覆盖（显示为删除线）\n\
  \n如果规则显示删除线，意味着另一条具有更高优先级或靠后顺序的规则正在覆盖它。\n\nDevTools 允许你直接在浏览器中编辑 CSS：\n\n* 更改值（例如，`padding:\
  \ 20px` → `40px`）\n* 切换属性的启用/禁用\n* 添加新规则\n\n这些更改是临时的，但它们让你能即时尝试，无需切换回代码编辑器。\n\n\
  ### 盒模型图\n\n最有用的调试工具之一是盒模型图，通常显示在 `Styles`（样式）或 `Layout`（布局）面板中。它以可视化方式表示：\n\n*\
  \ 内容（中心）\n* 内边距（内部空间）\n* 边框（轮廓）\n* 外边距（外部空间）\n\n你可以看到每一边（上、右、下、左）的确切数值，通常用颜色编码区分。\n\
  \n这对于诊断布局问题极其有帮助，例如意外的间距、比预期大的元素和错位的布局。你甚至可以将鼠标悬停在图表的各部分上，以在页面上高亮显示它们，从而清楚地知道空间来自哪里。\n\
  \nDevTools 将 CSS 从猜测游戏变成了调查过程。你不再需要更改随机值并碰运气，而是可以准确地看到浏览器在做什么，并有信心地调整样式。这是 Web 开发转变的一个好例子：技能不在于更快地输入\
  \ CSS，而在于理解浏览器如何解读你所写的代码。\n\n## 本练习教会你什么\n\n你刚刚练习了几个专业习惯：\n\n* 将观察与行动分离\n* 在更改代码前理解布局意图\n\
  * 将 AI 用作审查员和解释者，而非权威答案\n* 通过调查修复 CSS，而非试错法\n\n如果你只依赖生成的 CSS 而不理解它，你的进步会更慢。使用 AI\
  \ 解释损坏 CSS 的开发者进步得很快。这些调查行为的习惯比单纯的打字速度更有价值。\n\n## 你的收获\n\n当 CSS 损坏时，浏览器并非在随机发挥。它正在遵循你误解或遗忘的规则。你的工作是放慢脚步，思考层叠和布局，并使用工具（包括\
  \ AI）来揭示实际发生的情况。\n\n这种心态将比你在本章记忆的任何特定属性都更重要。\n\n\n\nWe have covered the basics of\
  \ styling web pages with CSS, specifically colors, fonts, and layout, learned responsive\
  \ design, and practiced debugging common issues. Let's finish this chapter with\
  \ one of the most fun parts of CSS, which many beginners don't even realize is possible:\
  \ transforms and animations.\n\n### Transforms and Animations\n\n`Transforms` and\
  \ `animation` take CSS from layout into motion design. Used with restraint, they\
  \ add clarity and feedback. Overused, they make pages feel jittery and exhausting.\
  \ The goal here is control, not spectacle.\n\nThis section covers the core concepts\
  \ without turning your site into a carnival.\n\n## CSS Transforms\n\nTransforms\
  \ let you visually change an element without affecting the layout around it. This\
  \ matters more than it sounds.\n\nA transformed element:\n\n*   Moves, rotates,\
  \ or scales visually\n*   Still occupies its original space in document flow\n\n\
  That is why transforms are better than `margin` or `position` for visual effects.\n\
  \nThe most common transform functions are shown in Table 3.1:\n\n| Transform Function\
  \ | Description |\n| --- | --- |\n| `translate()` | Moves an element |\n| `scale()`\
  \ | Resizes an element |\n| `rotate()` | Rotates an element |\n| `skew()` | Distorts\
  \ an element |\n\nTable 3.1: Transform functions and what they do\n\nLet's look\
  \ at a code example:\n\n```css\n.card {\n  transform: translateX(20px);\n}\n```\n\
  \nThis shifts any element with the `.card` class 20 pixels to the right, but other\
  \ elements behave as if nothing moved.\n\nYou can combine transforms:\n\n```css\n\
  .card {\n  transform: translateY(-4px) scale(1.02);\n}\n```\n\nOrder matters. Functions\
  \ apply left to right.\n\nTransforms are especially cool when paired with interaction,\
  \ like a button on hover:\n\n```css\n.button {\n  transition: transform 0.2s ease;\n\
  }\n.button:hover {\n  transform: translateY(-2px);\n}\n```\n\nThis creates a subtle\
  \ \"lift\" on hover with no layout shift and no side effects.\n\n**Good practice**:\
  \ If an interaction causes the page to jump or reflow, you probably used the wrong\
  \ tool.\n\n**Think about it**: Why are transforms better than `margin` or `position`\
  \ for animation?\n\n## The `transition` Property\n\nTransitions control how CSS\
  \ changes happen over time. Without them, state changes are instant:\n\n```css\n\
  .card {\n  transition: background-color 0.3s ease;\n}\n```\n\nNow when the background\
  \ color changes, it animates smoothly.\n\nYou can transition multiple properties:\n\
  \n```css\ntransition: transform 0.2s ease, box-shadow 0.2s ease;\n```\n\n**Good\
  \ practice**: Not every property transitions well. The best candidates: `transform`,\
  \ `opacity`, `box-shadow`, `background-color`. Avoid animating layout properties\
  \ like `width`, `height`, `top`, or `left` unless you know why.\n\n**Think about\
  \ it**: Which CSS properties are safe to animate for performance, and why?\n\n##\
  \ Keyframe Animations\n\nTransitions react to state changes. Animations run on their\
  \ own timeline:\n\n```css\n@keyframes fade-in {\n  from {\n    opacity: 0;\n  }\n\
  \  to {\n    opacity: 1;\n  }\n}\n```\n\nApply it like this:\n\n```css\n.modal {\n\
  \  animation: fade-in 0.3s ease;\n}\n```\n\nThis runs once when the element appears.\n\
  \nAnimations can loop, reverse, pause, and change speed curves. For example:\n\n\
  ```css\n.spinner {\n  animation: spin 1s linear infinite;\n}\n@keyframes spin {\n\
  \  to {\n    transform: rotate(360deg);\n  }\n}\n```\n\nThat is a complete loading\
  \ spinner in four lines of CSS.\n\n## Timing Functions and Realism\n\nTiming functions\
  \ shape the feel of motion.\n\nCommon values: `linear` for constant speed, `ease`\
  \ for slow start and end, `ease-in` for slow start only, `ease-out` for slow end\
  \ only.\n\nMost UI interactions should use `ease` or `ease-out`. `linear` feels\
  \ robotic. If motion feels off, it is usually the timing, not the distance.\n\n\
  ## Reduced Motion and Accessibility\n\nSome users prefer less motion. CSS lets you\
  \ respect that:\n\n```css\n@media (prefers-reduced-motion: reduce) {\n  * {\n  \
  \  animation: none;\n    transition: none;\n  }\n}\n```\n\nGuidelines for using\
  \ animation well:\n\n*   Use animation to explain change. If something appears,\
  \ disappears, or moves, animation makes it feel intentional.\n*   Keep durations\
  \ short. Most UI animations should be between 150ms and 300ms.\n*   Animate less.\
  \ One moving element draws attention. Five is noise.\n*   Never animate without\
  \ purpose. If removing the animation would not make the interface worse, it probably\
  \ should not be there.\n\nAnimation should help users understand what just happened.\
  \ If it only exists because it looks cool, it ages fast.\n\n### Exercises, References,\
  \ and Resources\n\nIn this section, you will be tested on what you have learned\
  \ in this chapter and get links to useful references and resources.\n\n## Check\
  \ Your Understanding\n\nAnswer the following questions about the topics covered\
  \ in this chapter:\n\n1.  What are the three ways to apply CSS? Which is preferred?\n\
  2.  What are the two parts of a CSS rule?\n3.  What is the difference between a\
  \ class selector and an ID selector?\n4.  What happens when two CSS rules have the\
  \ same specificity?\n5.  What are the four parts of the CSS box model?\n6.  Why\
  \ might adding `padding` change an element's total size?\n7.  Why is `max-width`\
  \ preferred over `width` for responsive layouts?\n8.  What is the difference between\
  \ `px` and `rem`?\n9.  What is a media query?\n10. What is the difference between\
  \ `transition` and `animation`?\n\nAnswers can be found in the book's GitHub repository,\
  \ linked here:\n\n<https://github.com/markjprice/web-dev-ai/blob/main/docs/Appendix-A.pdf>\n\
  \n## Links\n\nUse MDN for learning, examples, and daily reference. Use W3C specs\
  \ to clarify edge cases, settle disagreements, and understand why CSS behaves the\
  \ way it does.\n\n### MDN CSS Reference\n\nThis is the authoritative source for\
  \ practical properties, values, and syntax:\n\n<https://developer.mozilla.org/en-US/docs/Web/CSS/Reference>\n\
  \nThis is the page you will return to again and again. Every CSS property links\
  \ to formal syntax, supported values, examples, and browser compatibility, plus\
  \ direct links to the relevant W3C spec sections.\n\nIf you bookmark one CSS page,\
  \ bookmark this one.\n\n### Core MDN CSS Guides\n\nBeginner-friendly explanations\
  \ of CSS fundamentals:\n\n<https://developer.mozilla.org/en-US/docs/Learn/CSS>\n\
  \nFor understanding the box model, cascade and specificity, layout basics, and responsive\
  \ design.\n\nThese materials follow current CSS standards, not old browser quirks.\n\
  \n### W3C Specifications\n\nThese are the formal specifications for CSS. MDN is\
  \ usually better for learning. Specs are better for precise reference. You do not\
  \ usually learn CSS from specs, but they are essential for clarity and edge cases.\
  \ W3C CSS Snapshot for the current state of CSS: <https://www.w3.org/TR/CSS/>\n\n\
  ## Summary\n\nIn this chapter, we learned the following:\n\n*   CSS separates presentation\
  \ from structure and applies styles using rules made of selectors and declarations\n\
  *   External stylesheets are the preferred way to manage and reuse styles across\
  \ pages\n*   The cascade decides which styles apply based on specificity and order\n\
  *   Classes are reusable and better for styling than IDs\n*   Every element follows\
  \ the box model: content, padding, border, and margin\n*   Shorthand properties\
  \ follow a consistent top-right-bottom-left pattern\n\n\n\n\n* 布局更多地依赖于间距和宽度约束，而非装饰性样式\n\
  * 诸如 `%` 和 `rem` 之类的相对单位尊重用户设置并提升可访问性\n* 响应式设计使用灵活布局、媒体查询和移动优先策略；本章相关内容可在以下链接找到：[`github.com/markjprice/web-dev-ai/blob/main/prompts/ch04-svg/readme.md`](https://github.com/markjprice/web-dev-ai/blob/main/prompts/ch04-svg/readme.md)\n"
- "## 用于绘制形状的 SVG 基础知识\n\nSVG 是一种对 HTML 友好的绘图格式。您可以通过五种常见方式使用它：\n\n* **内联 SVG**：直接在\
  \ HTML 中编写 SVG 标记。这使得 CSS 和 JavaScript 能够直接访问 SVG 元素，对于交互和主题设置非常有用：\n\n```\n<svg\
  \ width=\"120\" height=\"120\" viewBox=\"0 0 100 100\">\n  <circle cx=\"50\" cy=\"\
  50\" r=\"40\"></circle>\n</svg>\n```\n\n* **外部 SVG**：链接到像 `logo.svg` 这样的外部文件：\n\n\
  ```\n<a href=\"logo.svg\">Go to SVG file</a>\n```\n\n* **图像元素**：无法通过 CSS 或 JavaScript\
  \ 与 SVG 内部进行交互。这是静态图形最简单、最安全的方式：\n\n```\n<img src=\"logo.svg\" alt=\"Simple teal\
  \ square logo\" \n     width=\"120\" height=\"120\">\n```\n\n* **对象元素**：SVG 具有交互性，但存在于自己的文档上下文中：\n\
  \n```\n<object data=\"logo.svg\" type=\"image/svg+xml\" \n        width=\"120\"\
  \ height=\"120\">\n  Your browser does not support SVG.\n</object>\n```\n\n* **CSS\
  \ 背景**：纯粹用于装饰，无交互或可访问性：\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta\
  \ charset=\"UTF-8\">\n  <title>CSS Background SVG</title>\n  <style>\n    .box {\n\
  \      width: 120px;\n      height: 120px;\n      background-image: url(\"logo.svg\"\
  );\n      background-size: cover;\n      background-repeat: no-repeat;\n      border:\
  \ 1px solid #ccc;\n    }\n  </style>\n</head>\n<body>\n<h1>CSS Background SVG Example</h1>\n\
  <div class=\"box\"></div>\n</body>\n</html>\n```\n\n在本章中，我们将从内联 SVG 开始，因为它能让您最清晰地了解\
  \ SVG 构建块的工作原理。\n\n**提示：** 请解释内联 SVG 和 `<img>` SVG 之间的区别，包括优缺点和实际用例。\n\n让我们从最小的有用内联\
  \ SVG 开始，如下面代码高亮所示。创建一个 `Chapter04` 文件夹，并在该文件夹中创建一个名为 `simple-svg.html` 的 HTML 页面，内容如下：\n\
  \n您可以在以下链接下载此文件：[`github.com/markjprice/web-dev-ai/blob/main/Code/Chapter04/simple-svg.html`](https://github.com/markjprice/web-dev-ai/blob/main/Code/Chapter04/simple-svg.html)\n\
  \n```\n<!doctype html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\"\
  \ />\n    <meta name=\"viewport\" \n          content=\"width=device-width, initial-scale=1\"\
  \ />\n    <title>My First SVG</title>\n    <style>\n      /* Just to make the SVG\
  \ area obvious on the page */\n      .frame {\n        width: 320px;\n        padding:\
  \ 12px;\n        border: 1px solid #ccc;\n      }\n      svg {\n        display:\
  \ block;\n        border: 1px dashed #999;\n      }\n    </style>\n  </head>\n \
  \ <body>\n    <h1>SVG Playground</h1>\n    <div class=\"frame\">\n      <svg width=\"\
  300\" height=\"120\" \n           xmlns=\"http://www.w3.org/2000/svg\">\n      \
  \  <!-- Background rectangle -->\n        <rect x=\"10\" y=\"10\" width=\"280\"\
  \ height=\"100\" fill=\"#f2f2f2\" />\n      </svg>\n    </div>\n  </body>\n</html>\n\
  ```\n\n`<svg>` 元素是一个拥有自己坐标系的容器。\n\n您看到的是一个矩形（`<rect>`）绘制在 300×120 的*画布*上，如*图 4.1*所示。矩形从\
  \ (10, 10) 开始，宽 280 像素，高 100 像素。SVG 坐标从左上角开始，x 向右增加，y 向下增加，如果您做过 CSS 布局工作，这会感觉很熟悉。\n\
  \n![](img/B34553_04_01.png)\n\n*图 4.1：使用 SVG 绘制简单形状*\n\n**提示：** 请解释 SVG 坐标系如何工作，并与\
  \ CSS 布局进行对比，附带图表和示例。\n\n在 SVG 中，后绘制的元素会覆盖在先绘制的元素之上。添加几个更多形状以理解层叠，如*图 4.1*所示，并在下面代码高亮显示：\n\
  \n```\n<svg width=\"300\" height=\"120\" \n     xmlns=\"http://www.w3.org/2000/svg\"\
  >\n  <!-- Background rectangle -->\n  <rect x=\"10\" y=\"10\" width=\"280\" height=\"\
  100\" fill=\"#f2f2f2\" />\n  <!-- Circle on top of the background -->\n  <circle\
  \ cx=\"90\" cy=\"60\" r=\"35\" fill=\"cornflowerblue\" />\n  <!-- A line drawn on\
  \ top of both -->\n  <line x1=\"100\" y1=\"45\" x2=\"280\" y2=\"95\" \n        stroke=\"\
  black\" stroke-width=\"4\" />\n</svg>\n```\n\n您使用的一些关键概念：\n\n1. `<svg>` 元素定义绘图区域。\n\
  \   * `width` 和 `height` 设置页面上的尺寸。\n   * `xmlns=\"http://www.w3.org/2000/svg\"`\
  \ 是一个 XML 命名空间，告诉浏览器*这是 SVG 标记*。\n   \n   在独立的 `.svg` 文件中，此属性是必需的。然而，当 SVG 作为内联写在\
  \ HTML5 文档中（带有 `<!DOCTYPE html>`）时，`xmlns` 属性是可选的，因为 HTML5 解析器会自动处理命名空间。您在实际的内联\
  \ SVG 中经常会看到它被省略。\n\n2. 形状是元素。\n   * `<rect>` 绘制矩形。\n   * `<circle>` 绘制圆形。\n   *\
  \ `<line>` 绘制直线。\n\n3. 定位使用从左上角 (0, 0) 开始的简单坐标。\n\n\n\n### SVG 形状、描边和填充\n\n## 基本形状属性\n\
  \n*   对于矩形，你需要指定左上角的 `x` 和 `y`。\n*   对于圆形，你需要使用 `cx` 和 `cy` 指定中心点，加上半径 `r`。\n* \
  \  对于线条，你需要指定起点 (`x1`, `y1`) 和终点 (`x2`, `y2`)。\n\n## 颜色和描边\n\n颜色和描边感觉像 CSS，但它们是\
  \ SVG 属性。\n\n*   `fill` 是形状的内部颜色。\n*   `stroke` 是轮廓颜色。\n*   `stroke-width` 是轮廓的粗细。\n\
  \n## 表现属性\n\n在 SVG 中，控制形状如何绘制的属性统称为 `presentation attributes`（表现属性）。它们大多直接映射到 CSS\
  \ 属性，在现代 SVG 中，你应该优先将它们视为 CSS，其次才是属性。\n\n### 描边属性（形状的轮廓）\n\n`stroke` 控制路径、线条、圆等轮廓的绘制方式，例如轮廓使用什么颜色或涂料。可能的值：\n\
  \n*   `none`\n*   任何 CSS 颜色值：`black`、`red`、`#ff0000`、`rgb(255,0,0)`、`hsl(...)` 等\n\
  *   `currentColor`（从 `color` 继承）\n*   `url(#id)` 引用在 `<defs>` 中定义的渐变或图案\n\n例如：\n\
  \n```\nstroke: #333;\n```\n\n`stroke-width` 控制描边的粗细。描边默认居中于路径上。可能的值：\n\n*   带或不带单位的数字：`1`、`2.5`、`4px`\n\
  *   允许百分比但不常用\n\n例如：\n\n```\nstroke-width: 4;\n```\n\n`stroke-linecap` 控制开放路径端点的绘制方式。可能的值：\n\
  \n*   `butt`（平直端点，默认）\n*   `round`\n*   `square`\n\n例如：\n\n```\nstroke-linecap:\
  \ round;\n```\n\n`stroke-linejoin` 控制线段间拐角的绘制方式。可能的值：\n\n*   `miter`（尖角，默认）\n* \
  \  `round`\n*   `bevel`\n\n例如：\n\n```\nstroke-linejoin: round;\n```\n\n`stroke-miterlimit`\
  \ 限制斜接拐角可以有多尖，超过则变为斜角。仅当 `stroke-linejoin` 设为 `miter` 时适用。可能的值：\n\n*   大于或等于 `1`\
  \ 的任意数字\n\n例如：\n\n```\nstroke-miterlimit: 4;\n```\n\n`stroke-dasharray` 创建虚线。可能的值：\n\
  \n*   `none`\n*   一组数字：`5, 5 10, 10 5 2 5`\n\n数字在虚线长度和间隙长度之间交替。例如：\n\n```\nstroke-dasharray:\
  \ 8 4;\n```\n\n`stroke-opacity` 仅控制描边的不透明度。可能的值：\n\n*   `0` 到 `1` 之间的数字\n\n例如：\n\
  \n```\nstroke-opacity: 0.6;\n```\n\n### 填充属性（形状的内部）\n\n这些控制闭合形状如何填充。\n\n`fill` 控制形状内部使用什么涂料。可能的值：\n\
  \n*   `none`\n*   任何 CSS 颜色值\n*   `currentColor`\n*   `url(#id)`（渐变或图案）\n\n如果未指定，默认为\
  \ `black`。\n\n例如：\n\n```\nfill: cornflowerblue;\n```\n\n`fill-opacity` 仅设置填充的不透明度。可能的值：\n\
  \n*   `0` 到 `1` 之间的数字\n\n例如：\n\n```\nfill-opacity: 0.5;\n```\n\n`fill-rule` 控制 SVG\
  \ 如何判定复杂或自相交路径的*内部*。可能的值：\n\n*   `nonzero`（默认）\n*   `evenodd`\n\n你主要会在图标中遇到此属性。示例：\n\
  \n```\nfill-rule: evenodd;\n```\n\n### 共享绘制和可见性属性\n\n这些同时影响 `fill` 和 `stroke`，或整体绘制行为。\n\
  \n`opacity` 控制元素的整体不透明度，同时影响 `fill` 和 `stroke`。可能的值：\n\n*   `0` 到 `1` 之间的数字\n\n\
  例如：\n\n```\nopacity: 0.8;\n```\n\n`paint-order` 控制 `fill` 还是 `stroke` 先绘制。可能的值：\n\
  \n*   `normal`（先 `fill`，后 `stroke`）\n*   `fill`、`stroke`、`markers` 的任意组合\n\n例如：\n\
  \n```\npaint-order: stroke fill;\n```\n\n当你想让描边位于填充之后时，这很有用。\n\n### 继承和特殊值\n\n这些并非\
  \ SVG 独有，但在 SVG 中非常重要。\n\n`currentColor` 使用元素的 `color` 属性作为涂料值。例如：\n\n```\nsvg {\n\
  \  color: #0066cc;\n}\npath {\n  stroke: currentColor;\n}\n```\n\n这使 SVG 图标表现得像文本图标一样。\n\
  \n`inherit` 显式从父元素继承。\n\n示例：\n\n```\nstroke: inherit;\n```\n\n`提示`：请提供嵌入 HTML 的\
  \ SVG 线帽和线连接代码示例，以便我通过对比代码与结果直观理解差异。\n\n## 实操小任务：徽章图标\n\n制作一个 `badge` 图标：一个圆圈内含一个较小的圆圈，外加一个勾选标记线条，如\
  \ `图 4.2` 所示：\n\n![](img/B34553_04_02.png)\n\n图 4.2：用 SVG 绘制的勾选标记\n\n在网页中，添加一个新的\
  \ `<svg>` 元素，并调整数值直到看起来满意：\n\n```\n<svg width=\"180\" height=\"180\" xmlns=\"http://www.w3.org/2000/svg\"\
  >\n  <!-- Outer circle -->\n  <circle cx=\"90\" cy=\"90\" r=\"70\" fill=\"#e6f4ea\"\
  \ \n          stroke=\"#1e8e3e\" stroke-width=\"6\" />\n  <!-- Inner circle -->\n\
  \  <circle cx=\"90\" cy=\"90\" r=\"52\" fill=\"white\" />\n  <!-- Checkmark (two\
  \ lines) -->\n  <line x1=\"60\" y1=\"95\" x2=\"82\" y2=\"115\" \n        stroke=\"\
  #1e8e3e\" stroke-width=\"10\" stroke-linecap=\"round\" />\n  <line x1=\"82\" y1=\"\
  115\" x2=\"122\" y2=\"70\" stroke=\"#1e8e3e\" \n        stroke-width=\"10\" stroke-linecap=\"\
  round\" />\n</svg>\n```\n\n如果看起来不居中或不平衡，一次只改一个数值。这是建立 SVG 坐标直觉的最佳方法之一。\n\n在下一节，我们将介绍\
  \ `viewBox` 以便 SVG 能干净地缩放，使用 `<g>` 进行分组，以及用 CSS 类进行样式设置，这样你的 SVG 就不会变成一堆属性的墙。\n\n\
  ### 缩放、分组和样式化图形\n\n到目前为止，你一直使用固定像素尺寸绘制 SVG。这虽可行，但错失了 SVG 最大优势之一：可缩放性。可缩放 SVG 的关键在于将绘图的内部坐标系与其在页面上显示的尺寸分离。这正是\
  \ `viewBox` 的作用。\n\n## 使用 viewBox 缩放\n\n`viewBox` 属性定义了一个内部网格，你的形状就生活在这个网格中。它有四个数字：`min-x`、`min-y`、`width`\
  \ 和 `height`。大多数情况下，前两个是 `0 0`。\n\n这是前面那个 SVG 的重写版，改用 `viewBox` 而不单纯依赖 width 和 height：\n\
  \n```\n<svg viewBox=\"0 0 300 120\" width=\"100%\" height=\"auto\"\n     xmlns=\"\
  http://www.w3.org/2000/svg\">\n  <rect x=\"10\" y=\"10\" width=\"280\" height=\"\
  100\" fill=\"#f2f2f2\" />\n  <circle cx=\"90\" cy=\"60\" r=\"35\" fill=\"cornflowerblue\"\
  \ />\n  <line x1=\"160\" y1=\"25\" x2=\"280\" y2=\"95\" \n        stroke=\"black\"\
  \ stroke-width=\"4\" />\n</svg>\n```\n\n概念上发生了什么变化：\n\n*   `viewBox=\"0 0 300 120\"\
  ` 意为*假装这个 SVG 绘制在一个 300x120 的网格上*。\n*   浏览器将该网格放大或缩小，以适应 SVG 显示的任何尺寸。\n*   你的坐标保持不变，但渲染尺寸会适应布局。\n\
  \nSVG 图标在手机、笔记本和 4K 屏幕上都保持锐利，无需多套图片资源。如果你只记住一条 SVG 规则，记住这条：大多数生产环境的 SVG 几乎总是使用 `viewBox`。\n\
  \n`preserveAspectRatio` 属性控制当 viewBox 宽高比与 SVG 显示尺寸不匹配时会发生什么。默认值 `xMidYMid meet`\
  \ 会等比缩放图形并将其在可用空间内居中。如果你想让 SVG 拉伸填满容器（忽略宽高比），请使用 `preserveAspectRatio=\"none\"`。对于大多数图标和插图用例，默认行为正是你想要的。这就是为什么大多数\
  \ SVG 无需额外工作即可调整大小。\n\n\n\n**提示：** 展示 `viewBox` 与 `width` / `height` 如何通过多个调整大小的示例进行交互。\n\
  \n## 使用 `<g>` 对元素进行分组\n\n当你的 SVG 包含不止几个形状时，你就会想要一种组织它们的方法。`<g>` 元素将形状组合在一起，以便你可以作为一个整体移动、设置样式或隐藏它们。\n\
  \n这是徽章图标的再次展示，但采用了逻辑分组：\n\n```svg\n<svg viewBox=\"0 0 180 180\" width=\"180\" \n\
  \     xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- 徽章背景 -->\n  <g class=\"badge-base\"\
  >\n    <circle cx=\"90\" cy=\"90\" r=\"70\" />\n    <circle cx=\"90\" cy=\"90\"\
  \ r=\"52\" />\n  </g>\n  <!-- 对勾 -->\n  <g class=\"badge-check\">\n    <line x1=\"\
  60\" y1=\"95\" x2=\"82\" y2=\"115\" />\n    <line x1=\"82\" y1=\"115\" x2=\"122\"\
  \ y2=\"70\" />\n  </g>\n</svg>\n```\n\n注意缺少了什么：颜色和描边细节，因为那些将移至 CSS。一旦你停止将样式硬编码到每个元素中，SVG\
  \ 就会变得更易于维护。\n\n## 使用 CSS 为 SVG 设置样式\n\n内联 SVG 可以使用常规 CSS 进行样式设置。你可以将样式放在 `<style>`\
  \ 块中、单独的 CSS 文件中，或与你现有的网站样式放在一起。\n\n以下是如何使用 CSS 类为分组的徽章设置样式：\n\n```css\n<style>\n\
  \  svg {\n    max-width: 220px;\n  }\n  .badge-base circle:first-child {\n    fill:\
  \ #e6f4ea;\n    stroke: #1e8e3e;\n    stroke-width: 6;\n  }\n  .badge-base circle:last-child\
  \ {\n    fill: white;\n  }\n  .badge-check line {\n    stroke: #1e8e3e;\n    stroke-width:\
  \ 10;\n    stroke-linecap: round;\n  }\n</style>\n```\n\n如果你已经学完 CSS 章节，这应该会让你感到熟悉。选择器的工作方式相同。唯一的区别是\
  \ `fill` 和 `stroke` 等属性应用于 SVG 形状，而不是文本或盒子。\n\n将样式移至 CSS 可带来三个优势：\n\n* 你的 SVG 变成了可读的标记，而不是一堆属性。\n\
  * 你可以为深色模式、主题或悬停状态更改颜色。\n* 设计师和开发人员可以分别更改绘图及其样式。\n\n尝试这个小实验。为徽章添加悬停效果：\n\n```css\n\
  svg:hover .badge-base circle:first-child {\n  fill: #d2eadc;\n}\n```\n\n你仅使用 CSS\
  \ 就使 SVG 具有了交互性，如*图 4.3*所示：\n\n![](img/B34553_04_03.png)\n\n*图 4.3：交互式正常和悬停状态*\n\
  \n## 对组应用变换\n\n`<g>` 还有用的另一个原因是变换。你可以使用单个属性移动、缩放或旋转整个组，如下面代码中高亮显示的那样：\n\n```svg\n\
  <g class=\"badge-check\" transform=\"rotate(-5 90 90)\">\n  <line x1=\"60\" y1=\"\
  95\" x2=\"82\" y2=\"115\" />\n  <line x1=\"82\" y1=\"115\" x2=\"122\" y2=\"70\"\
  \ />\n</g>\n```\n\n这会围绕 SVG 中心 (90, 90) 略微旋转对勾。如果不分组，你就必须手动重新计算每个坐标，这既繁琐又容易出错。\n\
  \n现在你已准备好进入下一步：路径（`<path>`），这是 SVG 从组合基本形状发展到插图和图标制作的地方。\n\n### 使用路径创建自定义形状\n\n\
  到目前为止，SVG 让人感觉很友好。矩形、圆形和线条能走很远，但它们无法描述任意形状。当你想要图标、波浪、斑点、箭头或任何看起来*经过设计*的东西时，你最终会使用\
  \ `<path>`。路径赋予了 SVG 灵活性，但它们通常是初学者最难的部分。\n\n## `<path>` 元素\n\n`<path>` 是一系列绘图命令的序列，存储在一个名为\
  \ `d` 的单一属性中。`d` 属性是一组给隐形画笔的指令：移动到这里，在那里画一条线，像这样画一条曲线，闭合形状（意味着画一条线回到起点）。\n\n这是一个实际绘制内容的最小可能路径，一条水平线，如*图\
  \ 4.4*和以下代码所示：\n\n```svg\n<svg viewBox=\"0 0 120 120\" width=\"200\" \n     xmlns=\"\
  http://www.w3.org/2000/svg\">\n  <path\n    d=\"M 20 60 L 100 60\"\n    stroke=\"\
  black\"\n    stroke-width=\"6\"\n    fill=\"none\"\n  />\n</svg>\n```\n\n![](img/B34553_04_04.png)\n\
  \n*图 4.4：使用路径绘制的水平线*\n\n慢慢读取该 `d` 值：\n\n* `M 20 60` 意为*将画笔移动到 (20, 60)*\n* `L 100\
  \ 60` 意为*画一条线到 (100, 60)*\n\n没有任何填充，因为我们显式指定了 `fill=\"none\"`。如果没有它，SVG 会尝试填充形状，这对单条线来说毫无意义。\n\
  \n## 为什么路径乍看令人生畏\n\n路径看起来令人生畏，因为所有逻辑都被压缩成一个字符串。没有像 `x`、`y` 或 `r` 这样的命名属性。但每个命令本身都很简单，大多数实际路径都是由几种命令类型构建的。\n\
  \n你最常用的命令有：\n\n* `M` 移动到\n* `L` 连线到\n* `C` 三次贝塞尔曲线\n* `Q` 二次贝塞尔曲线\n* `Z` 闭合路径\n\n\
  大写命令使用绝对坐标。小写版本（`m`、`l`、`c`、`q`）使用相对坐标。对初学者来说，绝对坐标更容易理解，所以学习时坚持使用大写。\n\n## 使用 Z\
  \ 闭合形状\n\n这是一个用直线绘制的简单房子形状，如*图 4.5*和以下代码所示：\n\n```svg\n<svg viewBox=\"0 0 120 120\"\
  \ width=\"200\" xmlns=\"http://www.w3.org/2000/svg\">\n  <path\n    d=\"\n     \
  \ M 20 70\n      L 60 30\n      L 100 70\n      L 100 100\n      L 20 100\n    \
  \  Z\n    \"\n    fill=\"#cfe8ff\"\n    stroke=\"#1f5fbf\"\n    stroke-width=\"\
  4\"\n  />\n</svg>\n```\n\n![](img/B34553_04_05.png)\n\n*图 4.5：用路径绘制的房子*\n\n重要的新命令是\
  \ `Z`，它通过画一条线回到起点来闭合路径。一旦路径闭合，填充突然变得合理，因为形状包围了一个区域。\n\n**提示：** 逐步分解浏览器如何解释 SVG 路径。\n\
  \n## 使用路径绘制曲线\n\n直线没问题，但曲线是路径展示优势的地方。SVG 使用贝塞尔曲线，由*拉*动曲线成形的点控制。\n\n**提示：** 请结合代码示例解释\
  \ SVG 曲线中的控制点。\n\n这是一个使用三次贝塞尔曲线（`C`）的平滑波浪，如*图 4.6*所示：\n\n```svg\n<svg viewBox=\"\
  0 0 300 120\" width=\"300\" \n     xmlns=\"http://www.w3.org/2000/svg\">\n  <path\n\
  \    d=\"\n      M 10 60\n      C 60 10, 120 110, 170 60\n      C 220 10, 280 110,\
  \ 330 60\n    \"\n    fill=\"none\"\n    stroke=\"#6a5acd\"\n    stroke-width=\"\
  6\"\n  />\n</svg>\n```\n\n![](img/B34553_04_06.png)\n\n*图 4.6：用路径绘制的曲线*\n\n每个 `C`\
  \ 命令接受六个数字（三对坐标）：\n\n* 第一个控制点（X 和 Y 坐标）\n* 第二个控制点（X 和 Y 坐标）\n* 终点（X 和 Y 坐标）\n\n\
  曲线从上一个命令结束的地方开始。你不需要理解数学就能有效地使用它。有用的思考方式是*控制点将曲线向自身拉拢*，如*图 4.7*所示：\n\n![](img/B34553_04_07.png)\n\
  \n*图 4.7：使用路径绘制的贝塞尔曲线*\n\n*图 4.7* 取自 W3 网站。我不指望你只看上面的图，因为它太小了，没什么用。查看 SVG 的源代码，并将其与以下链接处的渲染曲线进行比较：[`www.w3.org/TR/SVG/images/paths/cubic02.svg`](https://www.w3.org/TR/SVG/images/paths/cubic02.svg)\n\
  \n**提示：** 请结合可视化图表和交互式解释，说明 SVG 中三次与二次贝塞尔曲线的区别。\n\n## 使用路径和填充创建酷炫的斑点形状\n\n让我们制作一个柔和的斑点形状，这种形状常用作网页中的背景点缀，如*图\
  \ 4.8*所示：\n\n\n\n\n<svg viewBox=\"0 0 300 300\" width=\"260\" xmlns=\"http://www.w3.org/2000/svg\"\
  >\n  <path\n    d=\"\n      M 150 30\n      C 220 20, 280 80, 260 150\n      C 240\
  \ 220, 180 270, 120 250\n      C 60 230, 20 170, 40 110\n      C 60 50, 100 40,\
  \ 150 30\n      Z\n    \"\n    fill=\"#ffb703\"\n  />\n</svg>\n\n![](img/B34553_04_08.png)\n\
  \n*图 4.8：使用路径绘制的色块*\n\n这个形状无非是拼接在一起并用 `Z` 闭合的曲线。这是构建背景形状、主视觉图形以及理解网站上抽象插图制作方式的常用方法。\n\
  \n## 图标即路径\n\n你用过的几乎每一个 SVG 图标都是由路径构成的。当你从设计工具或图标库复制图标时，通常会得到一个或多个 `<path>` 元素。\n\
  \n这里展示了一个作为单个路径绘制的简单心形图标，如下面的代码和*图 4.9*所示：\n\n```svg\n<svg viewBox=\"0 0 120 120\"\
  \ width=\"160\" xmlns=\"http://www.w3.org/2000/svg\">\n  <path\n    d=\"\n     \
  \ M 60 100\n      C 20 70, 20 30, 50 30\n      C 65 30, 60 45, 60 45\n      C 60\
  \ 45, 55 30, 70 30\n      C 100 30, 100 70, 60 100\n      Z\n    \"\n    fill=\"\
  #e63946\"\n  />\n</svg>\n```\n\n![](img/B34553_04_09.png)\n\n*图 4.9：使用路径绘制的心形*\n\
  \n这看起来很复杂，但关键在于：你几乎永远不需要手写这样的路径。\n\nSVG 是贯穿本书主题的一个绝佳例子：敲代码不是难点。你很少需要背诵路径命令或手动输入冗长的坐标字符串。有用的技能是了解形状代表什么、它该如何缩放、如何响应\
  \ CSS 或 JavaScript，以及当设计变更时你可以安全地修改什么。\n\n设计师在 Illustrator、Figma 或 Inkscape 等工具中绘制它们，然后你将生成的\
  \ SVG 粘贴到 HTML 中。\n\nAI 也能帮助生成起点，但开发者仍需评估结果，在许多情况下仍需与设计师协作。你可以让聊天机器人为你创建 SVG。作为\
  \ Web 开发者，你的工作是懂得足够多，以便安全地对它们进行样式设置、缩放、动画制作和微调。\n\n## 为路径添加样式和动画\n\n路径响应你已知的相同 CSS\
  \ 概念：\n\n```css\n.icon path {\n  fill: none;\n  stroke: #333;\n  stroke-width: 4;\n\
  }\n.icon path:hover {\n  stroke: #0077cc;\n}\n```\n\n你还能做一些近乎神奇的事情，比如给路径添加动画，使其看起来像是正在被绘制出来。这通过为\
  \ `stroke-dasharray` 和 `stroke-dashoffset` 添加动画来实现，这是 SVG 的拿手好戏之一。\n\n**提示：** 请给出一个代码示例，演示如何使用\
  \ `stroke-dasharray` 和 `stroke-dashoffset` 为路径添加动画，使其看起来像是正在被绘制出来。\n\n## 迷你任务\n\n\
  现在让我们通过一些快速任务来练习。\n\n从图标网站获取一些 SVG 并进行微调：\n\n* [`www.svgrepo.com/`](https://www.svgrepo.com/)\n\
  * [`iconbuddy.com/`](https://iconbuddy.com/)\n\n生成一些新图标：\n\n**提示：** 请创建适用于 Web 应用工具栏中图标的\
  \ SVG 源代码，功能包括：新建文件、打开文件、另存为、关闭、剪切、复制、粘贴。请直接在聊天中提供原始 SVG 源代码，而不是生成图片文件。\n\n**警告！**\
  \ 如今，AI 通常会通过内部图像生成工具来理解*生成图像*，这会产生高分辨率的基于像素的文件（如 PNG），而不是代码。当你需要可以复制粘贴到 HTML 文件中的实际\
  \ SVG 源代码时，确保聊天机器人提供代码的最佳方式是指明你想要 *SVG 代码* 或 *SVG 标记*，而不是 *图像*。\n\n**提示：** 请使用 SVG\
  \ 和 CSS 动画创建一个加载旋转器。\n\n## 将形状转换为路径命令\n\n像 `<rect>` 和 `<circle>` 这样友好、易读的元素非常适合学习和简单图形。但在实际的\
  \ SVG 中，尤其是图标和插图，几乎所有东西最终都会变成 `<path>`。\n\n为什么？因为 `<path>` 可以描述任何形状，而 `<rect>` 和\
  \ `<circle>` 等元素功能有限。将基本形状转换为路径有助于你了解 SVG 在内部如何表示绘图。\n\n### 将矩形转换为路径\n\n从一个简单的矩形开始：\n\
  \n```svg\n<rect x=\"20\" y=\"20\" width=\"100\" height=\"60\" fill=\"skyblue\" />\n\
  ```\n\n这会绘制一个从 `(20, 20)` 开始的矩形。\n\n现在让我们逐步将其转换为路径：\n\n1. 移动到左上角\n2. 沿边缘绘制线条\n3.\
  \ 闭合形状：\n\n```svg\n<path\n  d=\"\n    M 20 20\n    L 120 20\n    L 120 80\n    L\
  \ 20 80\n    Z\n  \"\n  fill=\"skyblue\"\n/>\n```\n\n这些数值是如何计算的：\n\n* 左上角：`(20,\
  \ 20)`\n* 右上角：`(20 + 100, 20)` 即 `(120, 20)`\n* 右下角：`(120, 80)`\n* 左下角：`(20, 80)`\n\
  \n所以矩形就是四条线加上 `Z`。\n\n### 圆角矩形\n\n`<rect>` 也可以使用 `rx` 和 `ry` 来创建圆角：\n\n```svg\n\
  <rect x=\"20\" y=\"20\" width=\"100\" height=\"60\" rx=\"10\" fill=\"skyblue\" />\n\
  ```\n\n要用路径复现此效果，你需要曲线。通常会使用弧线命令 (`A`)，但这里有一个简化版本来展示思路：\n\n```svg\n<path\n  d=\"\
  \n    M 30 20\n    L 110 20\n    Q 120 20 120 30\n    L 120 70\n    Q 120 80 110\
  \ 80\n    L 30 80\n    Q 20 80 20 70\n    L 20 30\n    Q 20 20 30 20\n    Z\n  \"\
  \n  fill=\"skyblue\"\n/>\n```\n\n这使用二次贝塞尔曲线 (`Q`) 来实现圆角。代码更冗长，但灵活得多。\n\n### 将圆形转换为路径\n\
  \n这是一个圆形：\n\n```svg\n<circle cx=\"80\" cy=\"60\" r=\"40\" fill=\"tomato\" />\n```\n\
  \n要将圆形转换为路径，需使用弧线命令 (`A`)：\n\n```svg\n<path\n  d=\"\n    M 80 60\n    m -40 0\n\
  \    A 40 40 0 1 0 80 100\n    A 40 40 0 1 0 80 20\n  \"\n  fill=\"tomato\"\n/>\n\
  ```\n\n分解说明：\n\n1. `M 80 60` 表示移动到中心\n2. `m -40 0` 表示向左移动到圆边缘\n3. 第一个 `A` 表示绘制半圆\n\
  4. 第二个 `A` 表示完成整个圆\n\n这看起来很复杂，这正是重点所在：路径可以描述几乎任何形状，但不适合人类从头手写。\n\n### 为什么要将形状转换为路径？\n\
  \n你不需要在日常工作中手动进行这样的形状转换。但理解它能给你带来几个实际优势。\n\n正如你之前所见，设计工具导出的图标几乎总是 `<path>` 元素。了解基本形状如何映射到路径，能帮助你在不靠猜测的情况下阅读和调整它们。\n\
  \n路径解锁了形状不支持的功能。你可以：\n\n* 为形状的部分添加动画\n* 将一个形状变形为另一个形状\n* 将形状合并为单个轮廓\n* 更轻松地应用高级效果\n\
  \n例如，用路径为矩形边框添加动画易如反掌，但用 `<rect>` 则很别扭。\n\n当一切都是路径时，你可以将形状合并为一个元素，应用单个描边或动画，并简化复杂的\
  \ SVG 结构。这减少了浏览器需要追踪的元素数量，也减少了你日后需要编辑的位置。\n\nFigma、Illustrator 和 Inkscape 等工具导出的全是路径。如果你不理解路径，实际上就是在盲目复制粘贴。\n\
  \n**提示：** 请展示如何优化从 Figma 或 Illustrator 导出的 SVG 文件以便在 Web 上使用。\n\n### 迷你任务\n\n拿这个矩形：\n\
  \n```svg\n<rect x=\"40\" y=\"30\" width=\"120\" height=\"80\" />\n```\n\n手动将其转换为\
  \ `<path>`。\n\n然后：\n\n* 稍微修改一个坐标\n* 观察形状如何扭曲\n\n这个小练习建立路径直觉的速度比阅读十遍解释都快。一旦你对这个概念感到得心应手，SVG\
  \ 就会变得不再神秘。\n\n## SVG 实用建议\n\n以下是一些你可以应用到 SVG 工作中的建议：\n\n\n\n\n* 首选 CSS 而非内联属性来设置\
  \ `fill` 和 `stroke`。这能保持 SVG 的可维护性。\n* 尽可能对图标使用 `currentColor`。这是与页面其余部分集成最简洁的方式。当你更改页面上其他元素的颜色（尤其是文本）时，你的图标也会采用该颜色。\n\
  * 学习 `stroke-dasharray` 和 `stroke-dashoffset`。它们能让你创建出看起来比实际复杂得多的动画。\n\n你不需要死记硬背所有这些。了解有哪些可用，需要时再查阅。或者让你的\
  \ AI 来实现你已知可行的功能。一旦理解了路径，SVG 的其余部分就不再神秘。\n\n生成标记很少是主要难点。更难的工作是决定图形应传达什么、如何缩放，以及如何与页面其余部分契合。\n\
  \n**提示**：请解释如何使用 `currentColor` 和 CSS 变量使 SVG 图标具有主题感知能力。\n\n在下一节中，我们将介绍 `<defs>`、`<use>`、渐变和图案，这正是\
  \ SVG 从静态绘图变为可复用设计系统的地方。\n\n### SVG 作为可复用的设计系统\n\n到目前为止，你编写的每个 SVG 都相当直白：形状只出现一次，样式直接应用，绘图大多是静态的。`<defs>`\
  \ 让 SVG 的工作方式更像一个小型的可复用部件库。它允许你定义一次，多次复用。\n\n`<defs>` 本身不渲染任何内容。它是 *定义* 的容器：形状、渐变、图案、滤镜和符号，它们可以在其他地方被引用。\n\
  \n## 使用 `<defs>` 和 `<use>` 定义和复用形状\n\n`<defs>` 最简单的用法是定义一次形状，然后用 `<use>` 多次复用，如下面的代码和\
  \ *图 4.10* 所示：\n\n```xml\n<svg viewBox=\"0 0 300 120\" width=\"300\" \n     xmlns=\"\
  http://www.w3.org/2000/svg\">\n  <defs>\n    <path\n      id=\"star\"\n      d=\"\
  \n        M 50 0\n        L 61 35\n        L 98 35\n        L 68 57\n        L 79\
  \ 91\n        L 50 70\n        L 21 91\n        L 32 57\n        L 2 35\n      \
  \  L 39 35\n        Z\n      \"\n    />\n  </defs>\n  <use href=\"#star\" x=\"20\"\
  \ y=\"15\" fill=\"#f4c430\" />\n  <use href=\"#star\" x=\"120\" y=\"15\" fill=\"\
  #ff8c00\" />\n  <use href=\"#star\" x=\"220\" y=\"15\" fill=\"#e63946\" />\n</svg>\n\
  ```\n\n![](img/B34553_04_10.png)\n\n*图 4.10：三颗颜色不同但复用同一形状的星星*\n\n在前面的示例中：\n\n* `star`\
  \ 路径在 `<defs>` 内定义一次。\n* 每个 `<use>` 都会创建该路径的一个副本。\n* 你可以独立地为每个实例设置位置、填充、缩放、旋转和样式。\n\
  \n这对于图标、重复的 UI 元素、图表和装饰性图案很有用。\n\n**警告！** 现代 SVG 使用 `href`，而非 `xlink:href`。你仍会在网上看到使用\
  \ `xlink` 的旧示例，以及设计工具导出的使用 `xlink` 的 SVG 文件，但你不应再复制那些代码。虽然它们能工作，但在 SVG 2 中已被废弃。\n\
  \n**提示**：请展示如何使用 `<symbol>` 和 `<use>` 构建可复用的 SVG 图标系统。\n\n## 渐变：非平涂的填料\n\n渐变在 `<defs>`\
  \ 中定义，并通过 `url(#id)` 作为 `fill` 或 `stroke` 来引用。\n\n下面是一个线性渐变填充矩形的示例，如 *图 4.11* 所示：\n\
  \n```xml\n<svg viewBox=\"0 0 300 120\" width=\"300\" \n     xmlns=\"http://www.w3.org/2000/svg\"\
  >\n  <defs>\n    <linearGradient id=\"sunset\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"\
  0%\">\n      <stop offset=\"0%\" stop-color=\"#ff6a00\" />\n      <stop offset=\"\
  50%\" stop-color=\"#ffb703\" />\n      <stop offset=\"100%\" stop-color=\"#ffd166\"\
  \ />\n    </linearGradient>\n  </defs>\n  <rect x=\"20\" y=\"20\" width=\"260\"\
  \ height=\"80\" fill=\"url(#sunset)\" />\n</svg>\n```\n\n![](img/B34553_04_11.png)\n\
  \n*图 4.11：线性渐变填充矩形*\n\n前面代码中的关键概念：\n\n* 渐变是一个命名的填料。\n* `stop` 元素定义颜色过渡。\n* 渐变可在多个形状间复用。\n\
  \n下面是一个径向渐变的示例：\n\n```xml\n<defs>\n  <radialGradient id=\"spotlight\" cx=\"50%\"\
  \ cy=\"50%\" r=\"50%\">\n    <stop offset=\"0%\" stop-color=\"white\" />\n    <stop\
  \ offset=\"100%\" stop-color=\"#90dbf4\" />\n  </radialGradient>\n</defs>\n<circle\
  \ cx=\"150\" cy=\"60\" r=\"45\" fill=\"url(#spotlight)\" />\n```\n\n径向渐变适合用于高光、气泡和柔和的\
  \ UI 强调效果。\n\n## 图案：作为填料的重复设计\n\n图案让你用重复的图形填充形状，而非颜色或渐变。SVG 图案通常比试图用背景图片或重复的 CSS\
  \ 规则伪造相同效果更简洁。\n\n```xml\n<svg viewBox=\"0 0 300 120\" width=\"300\" \n     xmlns=\"\
  http://www.w3.org/2000/svg\">\n  <defs>\n    <pattern id=\"diagonal-stripes\" width=\"\
  10\" height=\"10\"\n      patternUnits=\"userSpaceOnUse\"\n      patternTransform=\"\
  rotate(45)\"\n    >\n      <rect width=\"10\" height=\"10\" fill=\"#f1faee\" />\n\
  \      <line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"10\" \n            stroke=\"#457b9d\"\
  \ stroke-width=\"4\" />\n    </pattern>\n  </defs>\n  <rect x=\"20\" y=\"20\" width=\"\
  260\" height=\"80\" \n        fill=\"url(#diagonal-stripes)\" />\n</svg>\n```\n\n\
  注意前面代码的以下几点：\n\n* 图案定义一个瓦片。\n* SVG 会自动重复该瓦片。\n* 图案可包含任何 SVG 内容：形状、路径，甚至文本。\n\n图案非常适合用于图表、背景、无障碍友好的填充和微妙的\
  \ UI 纹理。\n\n## 将 `<use>` 与渐变和图案结合\n\n一旦所有内容都在 `<defs>` 中定义好，你就可以用简短的引用来复用它们：\n\n\
  ```xml\n<use href=\"#star\" x=\"40\" y=\"20\" fill=\"url(#sunset)\" />\n<use href=\"\
  #star\" x=\"140\" y=\"20\" fill=\"url(#diagonal-stripes)\" />\n```\n\n修改一次渐变、图案或基础形状，所有引用它的地方都会随之更新。\n\
  \n要记住以下几点：\n\n* `<defs>` 是你的定义库。\n* ID 用于命名和引用。\n* `<use>` 是形状的实例化。\n* `url(#id)`\
  \ 是填料的引用。\n\n这听起来可能很高大上，但这确实是实际项目中构建 SVG 的方式。\n\n## 使用 `<symbol>` 创建可复用图标\n\n在构建可复用的\
  \ SVG 图形（如图标）时，`<symbol>` 通常比配合单个形状使用 `<defs>` 更好。\n\n`<symbol>` 元素定义一个可复用的图形，类似于\
  \ `<defs>`，但有一个重要区别：它可以拥有自己的 `viewBox`。这意味着 symbol 表现得像一个独立的 SVG。\n\n例如：\n\n```xml\n\
  <svg style=\"display: none;\">\n  <symbol id=\"icon-star\" viewBox=\"0 0 24 24\"\
  >\n    <path d=\"M12 2l3 7h7l-5.5 4.5L18 21l-6-4-6 4 1.5-7.5L2 9h7z\"/>\n  </symbol>\n\
  </svg>\n```\n\n然后你可以在任何地方用 `<use>` 复用它：\n\n```xml\n<svg width=\"24\" height=\"24\"\
  >\n  <use href=\"#icon-star\"></use>\n</svg>\n```\n\n为什么 `<symbol>` 很有用：\n\n* 它允许每个图标使用\
  \ `viewBox` 定义自己的坐标系\n* 它保持图标一致且可缩放\n* 它避免在页面中重复 SVG 标记\n\n许多图标系统将 `<symbol>` 与\
  \ `<use>` 结合使用，这样就不必重复相同的图标标记。把 `<defs>` 想象成一个存储容器，而 `<symbol>` 是一个带有自己布局规则的可复用组件。\n\
  \n**提示**：请举例解释 SVG 滤镜（模糊、阴影、发光）是如何工作的。\n\n### 让 SVG 无障碍\n\nSVG 是 DOM 的一部分，这意味着它以普通图片不具备的方式参与无障碍访问。这是好事，但也意味着你需要有意识地处理。没有无障碍文本的\
  \ SVG 对屏幕阅读器用户实际上是不可见的，而标签不当的 SVG 则会嘈杂且令人困惑。\n\n目标很简单：如果 SVG 传达含义，提供清晰的文本替代。如果它纯粹是装饰性的，则从辅助技术中隐藏它。\n\
  \n## 使用 `<title>` 提供文本替代\n\n\n\n\n`<title>` 元素是 SVG 中 `<img>` 标签上 `alt` 文本的等价物。它应该是\
  \ `<svg>` 内部的第一个子元素，以便辅助技术能够可靠地找到它，如下面代码高亮部分所示：\n\n```xml\n<svg viewBox=\"0 0 120\
  \ 120\" \n     role=\"img\" aria-labelledby=\"icon-title\"\n     xmlns=\"http://www.w3.org/2000/svg\"\
  >\n  <title id=\"icon-title\">Success checkmark</title>\n  <circle cx=\"60\" cy=\"\
  60\" r=\"50\" fill=\"#e6f4ea\" />\n  <path d=\"M 35 60 L 55 80 L 85 40\" stroke=\"\
  #1e8e3e\" \n        stroke-width=\"6\" fill=\"none\" />\n</svg>\n```\n\n### 良好实践\n\
  \n保持 `<title>` 简短且具有描述性，类似于 `alt` 文本。描述其含义，而非形状。“成功的对勾”比“带勾的绿圈”更好。\n\n## 使用 `<desc>`\
  \ 添加更长的描述\n\n如果 SVG 包含更复杂的信息，例如图表或示意图，请使用 `<desc>` 进行更长的解释，如下面代码高亮部分所示：\n\n```xml\n\
  <svg viewBox=\"0 0 200 120\"\n     role=\"img\" aria-labelledby=\"chart-title chart-desc\"\
  \n     xmlns=\"http://www.w3.org/2000/svg\">\n  <title id=\"chart-title\">Monthly\
  \ sales</title>\n  <desc id=\"chart-desc\">\n    Bar chart showing steady growth\
  \ from January to June, with the highest sales in June.\n  </desc>\n  <!-- chart\
  \ shapes here -->\n</svg>\n```\n\n将 `<desc>` 视为图注或摘要的等价物。它提供了简短标签无法容纳的上下文。\n\n##\
  \ 使用 `aria-labelledby` 关联文本\n\n只有当辅助技术被明确告知使用 `<title>` 和 `<desc>` 元素时，它们才变得有用。这正是\
  \ `aria-labelledby` 的作用：\n\n```html\naria-labelledby=\"chart-title chart-desc\"\n\
  ```\n\n请记住以下细节：\n\n* 该值是一个以空格分隔的 ID 列表。\n* 顺序很重要。文本将按该顺序朗读。\n* 你可以只包含 `<title>`，或同时包含\
  \ `<title>` 和 `<desc>`。\n\n## 使用 `role=\"img\"` 将 SVG 声明为图像\n\n默认情况下，SVG 元素并不总是被视为图像，尤其是内联\
  \ SVG。添加 `role=\"img\"` 告诉辅助技术将 SVG 视为单个图像：\n\n```html\n<svg role=\"img\" ...>\n\
  ```\n\n前面的属性确保：\n\n* 屏幕阅读器将 SVG 视为单个图像。\n* 来自 `aria-labelledby` 的标签被正确宣读。\n\n##\
  \ 隐藏装饰性 SVG\n\n如果 SVG 不增加任何含义且纯粹是装饰性的，应将其对辅助技术隐藏，以避免干扰：\n\n```xml\n<svg aria-hidden=\"\
  true\" ...>\n  <!-- decorative shapes -->\n</svg>\n```\n\n用于以下场景：\n\n* 背景装饰。\n*\
  \ 分隔线图形。\n* 与附近文本重复的图标，例如 *Delete* 文字旁边的垃圾桶图标。\n\n不要将 `aria-hidden=\"true\"` 与无障碍标签结合使用。如果它被隐藏了，就应该被完全忽略。\n\
  \n## 内联 SVG 与 `<img>` SVG\n\n有一个重要的区别：\n\n* `<img src=\"icon.svg\" alt=\"...\">`\
  \ 使用标准的 HTML 无障碍属性。\n* 内联 `<svg>` 需要 ARIA、`<title>` 和 `<desc>`。\n\n如果你不需要对 SVG 进行样式设置或操作，使用\
  \ `<img>` 通常更简单且更安全。内联 SVG 更灵活，但责任也更大。\n\n### 良好实践\n\n如果 SVG 传达了某种含义，请清晰地标记它。如果没有，请完全隐藏它。将\
  \ `<title>` 视为 `alt`，将 `<desc>` 视为图注。\n\n### 练习、参考资料与资源\n\n在本节中，你将接受本章所学内容的测试，并获得有用的参考资料和资源链接。\n\
  \n## 检查你的理解\n\n回答以下问题：\n\n1. SVG 和位图图像的主要区别是什么？\n2. SVG 坐标系中的原点 (0,0) 在哪里？\n3. 如何定位圆形与矩形的位置？\n\
  4. `fill` 和 `stroke` 有什么区别？\n5. `viewBox` 解决了什么问题？\n6. 如果 `viewBox` 的宽高比与显示尺寸不匹配会发生什么？\n\
  7. 路径中的 `M` 命令有什么作用？\n8. `Z` 命令的用途是什么？\n9. `<use>` 如何帮助减少重复？\n10. 何时应使用 `aria-hidden=\"\
  true\"`？\n\n## 链接\n\nMDN Web Docs 是面向人类的最佳 SVG 资源。它解释了事物的用途、它们在真实浏览器中的使用方式，并包含实际可运行的示例。\n\
  \n### SVG 教程概览\n\n这是最佳的起点：\n\n[`developer.mozilla.org/en-US/docs/Web/SVG/Tutorial`](https://developer.mozilla.org/en-US/docs/Web/SVG/Tutorial)\n\
  \n它涵盖了 SVG 是什么、理解坐标系统、基本形状、路径、分组、变换和样式。它是假设你是一名 Web 开发者而非图形学研究者来编写的。\n\n### SVG\
  \ 元素参考\n\n这是你会不断回顾的页面。\n\n[`developer.mozilla.org/en-US/docs/Web/SVG/Element`](https://developer.mozilla.org/en-US/docs/Web/SVG/Element)\n\
  \n每个 SVG 元素都按字母顺序列出，包含清晰的描述、支持的属性、使用说明和浏览器兼容性。\n\n如果你忘记了 `<path>`、`<g>`、`<defs>`\
  \ 或 `<use>` 的工作原理，请查看这里。\n\n### SVG 属性参考\n\nSVG 拥有许多 Web 平台其他地方不存在的属性。\n\n[`developer.mozilla.org/en-US/docs/Web/SVG/Attribute`](https://developer.mozilla.org/en-US/docs/Web/SVG/Attribute)\n\
  \n此页面解释了几何属性（如 `viewBox`、`d`、`cx`、`cy`）、表现属性（如 `fill`、`stroke`、`opacity`），以及属性如何与\
  \ CSS 交互。\n\n### SVG 与 CSS\n\n当你使用 CSS 为内联 SVG 设置样式时，此页面很有用：\n\n[`developer.mozilla.org/en-US/docs/Web/SVG/SVG_and_CSS`](https://developer.mozilla.org/en-US/docs/Web/SVG/SVG_and_CSS)\n\
  \n它解释了哪些 SVG 属性可用 CSS 设置样式、选择器在内联 SVG 中的行为方式，以及表现属性与 CSS 规则之间的区别。\n\nMDN 的 SVG 内容由浏览器厂商和在职\
  \ Web 开发者维护，这也是它倾向于反映现实而非理论的原因。\n\n### W3C SVG 规范\n\n万维网联盟发布官方 SVG 规范。这些文档定义了 SVG\
  \ 应该如何工作，独立于任何浏览器。这最适合精确查阅和边缘情况。\n\nSVG 2 规范：[`www.w3.org/TR/SVG2/`](https://www.w3.org/TR/SVG2/)\n\
  \n这是现代 SVG 规范。它定义了 SVG DOM、几何、绘制和渲染规则，以及与 CSS、HTML 和脚本的交互。\n\n如果某些行为表现异常且 MDN 未解释原因，该文档通常会说明。\n\
  \n### SVG 路径规范\n\n如果你正在深入学习 `<path>`，这是路径命令（M、L、C、Q、A 等）、曲线和弧线的数学定义、填充规则和描边行为的权威参考。\n\
  \n[`www.w3.org/TR/SVG/paths.html`](https://www.w3.org/TR/SVG/paths.html)\n\n## 总结\n\
  \n在本章中，我们完成了以下内容：\n\n* 理解了 SVG 如何使用坐标系统绘制形状。\n* 使用 `<rect>`、`<circle>` 和 `<line>`\
  \ 创建基本形状。\n* 使用表现属性和 CSS 为 SVG 设置样式。\n* 学习了 `viewBox` 如何实现可缩放、与分辨率无关的图形。\n* 使用 `<g>`\
  \ 对元素进行分组和变换。\n* 使用 `<path>` 命令创建复杂形状。\n* 使用贝塞尔曲线创建平滑、富有表现力的图形。\n* 使用描边虚线技术为 SVG\
  \ 路径制作动画。\n* 使用 `<defs>` 和 `<use>` 构建可复用的图形。\n* 应用渐变和图案实现高级视觉效果。\n* 使用 `<title>`、`<desc>`\
  \ 和 ARIA 属性使 SVG 无障碍。\n\n\n\n\n"
- "## 第 5 章：JavaScript – 让网页具有交互性\n\n## 在 Discord 上了解更多\n\n要加入本书的 Discord 社区——您可以在那里分享反馈、向作者提问并了解新版本发布信息——请扫描此二维码：\n\
  \n[`discord.gg/rdEsrVbbC`](https://discord.gg/rdEsrVbbC)\n\n![img](img/Image47415.png)\n\
  \n在下一章中，您将学习 JavaScript，这是一种用于向网页添加交互性的语言。\n\nJavaScript 让网页能够“做事”。HTML 赋予页面结构。CSS\
  \ 控制其外观。JavaScript 处理行为：响应点击、读取表单输入、更新文本，以及在不重新加载页面的情况下改变用户所见的内容。\n\n在本章中，您将通过构建小型浏览器示例，以实用的方式学习\
  \ JavaScript。您将从基础开始：变量、数据类型、函数、条件语句、循环和控制台日志记录。然后您将运用这些概念来处理事件和 DOM，这是 JavaScript\
  \ 读取和写入页面的方式。\n\n您还将在整章中使用 AI，主要用于解释、调试帮助和检查您的理解。它可以帮助解释错误、比较方法并阐明代码在做什么。它不应取代您自己的理解。不要只是粘贴\
  \ JavaScript 代码然后碰运气。要学习足够的浏览器代码知识，以便判断建议的答案是正确、错误，还是接近正确但遗漏了某些内容。\n\n读完本章后，您应该能够熟练阅读小型\
  \ JavaScript 程序，在浏览器中运行它们，使用开发者工具进行调试，并针对用户操作进行简单的 DOM 更新。\n\n在本章中，我们将涵盖以下主题：\n\n\
  - 介绍 JavaScript\n- 编程基础\n- DOM 操作\n\n本章中的分步说明和屏幕截图使用的是 Windows 上的 Chrome，但所有网络浏览器都提供类似的功能。\n\
  \n本章的建议聊天机器人提示词及示例响应可在以下链接找到：[`github.com/markjprice/web-dev-ai/blob/main/prompts/ch05-js/readme.md`](https://github.com/markjprice/web-dev-ai/blob/main/prompts/ch05-js/readme.md)\n\
  \n## 介绍 JavaScript\n\nJavaScript 是将网页从静态文档转变为能够对用户做出反应和响应的语言。HTML 赋予页面结构，CSS 控制其外观，但\
  \ JavaScript 让页面能够“做事”。\n\n当您点击按钮并发生变化时，当表单在提交前验证您的输入时，当内容在无需完全重新加载页面的情况下更新时，都涉及\
  \ JavaScript。没有它，大多数页面仍将表现得像枯燥的静态文档。\n\n### JavaScript 是一门完整的编程语言\n\n尽早弄清楚一件重要的事：JavaScript\
  \ 是一门真正的编程语言，而不仅仅是附加在 HTML 上的几个小把戏。它拥有变量、函数、条件语句、循环、数据结构，以及自己的规则和怪癖。\n\n您可以编写仅响应单个按钮点击的微型脚本，也可以构建复杂度堪比桌面软件的完整应用程序。同一种语言既适用于示例，也适用于大型应用程序，这很有用，但也可能让初学者感到沮丧。\n\
  \n### 运行 JavaScript\n\nJavaScript 通常在浏览器中运行，内置于 Chrome、Edge、Firefox、Safari 和其他浏览器的\
  \ JavaScript 引擎中。这很重要，因为您的代码运行在用户的机器上，而不是服务器上。\n\n这就是为什么 JavaScript 能快速响应用户操作，以及为什么它能直接操作用户在屏幕上看到的内容。但这也意味着您必须记住，JavaScript\
  \ 运行在一个*沙箱*中，该沙箱限制了其功能以保护用户的计算机。\n\n**提示词**：在 IT 术语中什么是沙箱？该术语源自何处？它是美式英语吗？\n\n在后续章节中，当您在服务器上使用\
  \ Python 和 Django 时，您将看到该编程模型有何不同。目前，关键思想是 JavaScript 与您的 HTML 和 CSS 共存，并能实时读取、更改和响应它们。\n\
  \n### JavaScript 难吗？\n\nJavaScript 名声不佳。人们喜欢抱怨它。其中一些批评是有道理的，特别是如果您看较旧的 JavaScript\
  \ 或令人困惑的边缘情况。有些是公平的。有些只是习惯性的抱怨。\n\n**提示词**：在 Reddit 上以图片形式展示三个最常见的 JavaScript 梗图。\n\
  \n以清晰、现代风格编写的 JavaScript 比其名声所暗示的要容易得多。真正的危险不是语言本身，而是复制您不理解的代码。这就是 AI 在正确使用时可以提供帮助的地方。\n\
  \n在整章中，您将被鼓励将 AI 作为思维辅助工具。您可以请它解释错误消息、用不同方式重述概念，或展示解决同一问题的替代方案。您不应该做的是盲目粘贴答案然后继续。如果您那样做，一切看似正常，直到您遇到一个无法解释的\
  \ bug。请将 AI 视为在您尝试自己理解代码*之后*的帮助。\n\n**提示词**：告诉我一些关于 JavaScript 历史的情况，以及它与其他语言相比有哪些不同寻常的地方。例如，它是源自\
  \ Java 吗？它的语法看起来像 C、C++、Java 和 C#，但它与这些语言有多相似？\n\n### 使用浏览器开发者工具查找错误和 bug\n\n重要的是要理解，错误是使用\
  \ JavaScript 时的常态。语法错误、未定义变量和逻辑 bug 经常发生，即使是经验丰富的开发者也不例外。浏览器的开发者工具是您的最佳助手。它们显示错误消息、让您检查值、并允许您在不编辑源文件的情况下尝试更改。AI\
  \ 可以帮助解释错误并建议修复，但您应始终将这些解释与您的代码实际在做什么联系起来。\n\n铺垫到此为止。让我们构建一个简单的页面并开始编写 JavaScript。\n\
  \n## 编程基础\n\nJavaScript 的基础归结为一小组您将不断重用的概念。一旦这些概念融会贯通，大多数 JavaScript 代码看起来都会很熟悉，即使它在做新事情。\n\
  \n### 设置包含代码的网页\n\n这是一个简单的起始页面，您可以在本节的每个代码示例中重用。它包含一些我们可以选择和更新的元素，以及用于触发逻辑的按钮和输入框。\n\
  \n创建一个 `Chapter05` 文件夹，在其中创建一个名为 `ProgrammingBasics` 的子文件夹，并在其中创建一个名为 `index.html`\
  \ 的文件，包含以下代码：\n\n您可以从以下链接下载此网页的源代码：[`github.com/markjprice/web-dev-ai/blob/main/Code/Chapter05/ProgrammingBasics/index.html`](https://github.com/markjprice/web-dev-ai/blob/main/Code/Chapter05/ProgrammingBasics/index.html)\n\
  \n\n\n\n\n```html\n<!doctype html>\n<html lang=\"en-US\">\n<head>\n  <meta charset=\"\
  utf-8\" />\n  <meta name=\"viewport\" \n        content=\"width=device-width, initial-scale=1\"\
  \ />\n  <title>JavaScript Basics Playground</title>\n  <style>\n    body { font-family:\
  \ Arial, sans-serif; margin: 2rem; }\n    .row { margin: 0.75rem 0; }\n    .box\
  \ { padding: 0.75rem; border: 1px solid #ccc; \n           border-radius: 0.5rem;\
  \ }\n    button { padding: 0.5rem 0.75rem; }\n    input { padding: 0.5rem; width:\
  \ min(360px, 100%); }\n    code { background: #f6f6f6; padding: 0.1rem 0.3rem; \n\
  \           border-radius: 0.25rem; }\n  </style>\n</head>\n<body>\n  <h1>JavaScript\
  \ Basics Playground</h1>\n  <div class=\"row box\">\n    <p id=\"status\">Status:\
  \ Waiting for JavaScript…</p>\n    <p id=\"message\">Message: (none)</p>\n    <p>Counter:\
  \ <strong id=\"counterValue\">0</strong></p>\n  </div>\n  <div class=\"row box\"\
  >\n    <label for=\"nameInput\">Your name:</label><br />\n    <input id=\"nameInput\"\
  \ type=\"text\" placeholder=\"Type your name\" />\n    <button id=\"helloBtn\" type=\"\
  button\">Say hello</button>\n  </div>\n  <div class=\"row box\">\n    <button id=\"\
  incrementBtn\" type=\"button\">Increment counter</button>\n    <button id=\"resetBtn\"\
  \ type=\"button\">Reset counter</button>\n  </div>\n  <div class=\"row box\">\n\
  \    <p>Open Developer Tools Console to see logs.</p>\n  </div>\n  <!-- We'll add\
  \ script files in the next few sections. -->\n  <script src=\"code-order.js\"></script>\n\
  </body>\n</html>\n```\n\n关于前面的 HTML 文件，请注意以下几点：\n\n- 它包含一个 `id` 为 `status` 的段落元素，初始内容为：`Status:\
  \ Waiting for JavaScript…`。\n- 它包含一个 `id` 为 `message` 的段落元素，初始内容为：`Message: (none)`。\n\
  - 它引用了一个名为 `code-order.js` 的代码文件。我们将在下一节创建该文件。\n\n下面的每一节都是一个独立的示例。对于每一节，请添加一个新的\
  \ script 元素来引用你正在学习的概念对应的代码文件，然后刷新浏览器，观察页面和控制台发生了什么变化。\n\n## 执行顺序是自上而下\n\n第一个概念是\
  \ JavaScript 是逐步执行的，从上到下。当浏览器遇到 JavaScript 时，它会按顺序读取每条语句并立即运行，除非另有指示。这听起来显而易见，但它解释了许多初学者的困惑。如果你试图在某事物存在之前使用它，JavaScript\
  \ 会报错。顺序很重要。\n\n在与 HTML 文件相同的文件夹中创建第二个文件，命名为 `code-order.js`。\n\n在 `code-order.js`\
  \ 中，添加以下代码：\n\n```javascript\nconsole.log(\"1) Script started.\");\nconst statusElement\
  \ = document.querySelector(\"#status\");\nstatusElement.textContent = \"Status:\
  \ JavaScript is running.\";\nconsole.log(\"2) Updated the status paragraph.\");\n\
  const messageElement = document.querySelector(\"#message\");\nmessageElement.textContent\
  \ = \"Message: The script ran top-to-bottom.\";\nconsole.log(\"3) Updated the message\
  \ paragraph.\");\nconsole.log(\"4) Script finished.\");\n```\n\n表达式 `document.querySelector(\"\
  #status\")` 返回对网页上 `id` 为 `status` 的元素的引用。你将在本章后面的章节中了解更多关于这以及其他操作页面 DOM 的方法。目前，你只需知道这些。\n\
  \n**提示**：浏览器如何渲染 DOM，以及 JavaScript 在页面加载期间何时运行？一个常见的初学者错误是在浏览器解析 DOM 元素之前尝试访问它们。\n\
  \n在浏览器中打开网页并查看**开发者工具**，如*图 5.1*所示：\n\n1. 在 Chrome 工具栏中，点击三个点以打开主菜单。\n2. 在菜单中，点击**更多工具**。\n\
  3. 在子菜单中，点击**开发者工具**（并注意键盘快捷键）。\n4. 在**开发者工具**中，点击**控制台**标签页。\n\n![](img/B34553_05_01.png)\n\
  \n*图 5.1：在开发者工具中查看控制台输出*\n\n**最佳实践**：与其通过菜单导航，不如学习在 Web 浏览器中切换显示**开发者工具**的键盘快捷键，因为在\
  \ Web 开发过程中你会一直用到它。对于 Windows 上的 Chrome，快捷键是 `Ctrl` + `Shift` + `I`。\n\n这表明 JavaScript\
  \ 在打开网页时立即执行，按编写顺序执行。你将看到页面上的状态和消息元素已更新，控制台日志按顺序出现。如果你在 `code-order.js` 中移动代码语句，输出会发生变化。如果你在创建\
  \ `messageElement` 之前引用它，会得到一个错误。\n\n## 为代码添加注释文档\n\n注释是给阅读代码的人看的，不是给浏览器看的。JavaScript\
  \ 引擎会完全忽略它们。注释的存在是为了解释代码为什么存在、阐明棘手的逻辑，以及在你实验或调试时暂时禁用代码。用得好，注释有助于读者理解意图；用得不好，它们会增加杂乱，或因过时而误导读者。\n\
  \nJavaScript 支持两种注释。\n\n- 单行注释以 `//` 开头。该行 `//` 之后的所有内容都会被忽略。这些最适合简短解释或快速备注。它们也常用于解释为什么以某种方式做事，这通常比解释代码做什么更有价值：\n\
  \n```javascript\n// This is a single-line comment.\nlet counter = 0; // This comment\
  \ might explain why the variable named counter exists and has been initialized to\
  \ zero.\n```\n\n- 多行注释以 `/*` 开头，以 `*/` 结尾。内部的所有内容都会被忽略，即使跨越多行：\n\n```javascript\n\
  /*\n  This is a multi-line comment.\n  It can span several lines\n  and is useful\
  \ for longer explanations.\n*/\nlet total = 10;\n```\n\n多行注释常用于文件级别的解释，或在测试期间暂时注释掉一块代码，如下面的代码所示：\n\
  \n```javascript\n/*\nfunction calculateTotal(price, tax) {\n  return price + tax;\n\
  }\n*/\n```\n\n使用此技术时要小心。很容易忘记被注释掉的代码，从而留下无用的逻辑。\n\n关于与注释相关的措辞的一点说明。你可以通过在代码语句上方或后方添加描述性文本来**添加注释**（comment\
  \ code）。你可以通过在语句前或周围添加注释字符来**注释掉代码**（comment out code），使其失效。**取消注释**（Uncommenting）意味着移除注释字符。\n\
  \n当代码表达了*如何*做某事但没有表达*为什么*时，注释特别有用。例如，以下代码显而易见：\n\n```javascript\ncounter = counter\
  \ + 1;\n```\n\n解释*为什么*的注释可能实际上有帮助：\n\n```javascript\n// Increment the counter to\
  \ track user clicks for analytics.\ncounter = counter + 1;\n```\n\n避免仅仅重复代码已有内容的注释。这会在不增加理解的情况下增加杂乱。任何能读懂\
  \ JavaScript 的人都知道该行代码在做什么。\n\n在与 AI 助手协作时，注释也很有用。当你请求 AI 协助处理一个函数时，一个描述任务的简短注释往往能获得更好的结果：\n\
  \n```javascript\n// Update the UI so it reflects the current counter value.\nfunction\
  \ renderCounter() {\n  counterEl.textContent = String(counter);\n}\n```\n\n最后，请记住注释不运行、不能修复\
  \ Bug，也不能替代清晰的命名。如果你发现自己写很长的注释来解释令人困惑的代码，这通常意味着代码本身应该被简化。好的 JavaScript 应该足够清晰，以至于注释主要解释为什么，而不是是什么或怎么做。\n\
  \n## 向控制台记录日志\n\n\n\n\n### 浏览器控制台\n\n浏览器控制台是你在编写 JavaScript 时应该首先求助的调试工具。将数据记录到控制台可以让你看到代码在运行时正在做什么，而不会改变页面上显示的内容。当某些行为表现异常时，控制台通常是你应该首先查看的地方。\n\
  \n## 使用 `console.log()` 向控制台写入\n\n向控制台写入的最常用方法是 `console.log()`。你将值传递给它，浏览器会按照接收顺序将它们打印到控制台，如下面的代码所示：\n\
  \n```javascript\nconsole.log(\"Hello from JavaScript\");\n```\n\n当这条语句运行时，文本会出现在\
  \ **开发者工具控制台** 中。它完全不会影响页面本身。\n\n## 记录变量\n\n你可以记录变量以查看其当前值。当你不确定变量是否包含你预期的内容时，这非常有用：\n\
  \n```javascript\nlet age = 42;\nconsole.log(age);\n```\n\n控制台将显示 `42`。如果没有显示，你就知道问题不在代码的后续部分。这就是你缩小\
  \ Bug 范围的方法。\n\n## 记录多个值\n\n你可以在一次调用中记录多个值。JavaScript 会从左到右打印它们，并用空格分隔：\n\n```javascript\n\
  console.log(typeof age, age);\n```\n\n以下是逐步发生的情况：\n\n1. 首先，计算 `typeof age`。`typeof`\
  \ 运算符返回一个 `string`，描述存储在名为 `age` 的变量中的值的类型，例如 `\"number\"`、`\"string\"` 或 `\"boolean\"\
  `。\n2. 其次，计算 `age` 本身的当前值。\n3. 最后，将两个结果都传递给 `console.log`，它会将它们一起打印。在控制台中，你会看到类似以下的输出：\n\
  \n```\nnumber 42\n```\n\n这种向控制台记录日志的模式非常常见，因为它一次性回答了两个问题：值是什么，类型是什么？\n\n## 组合字符串、标签与值\n\
  \n字符串和标签经常与值结合使用，以使日志更易于阅读，如下面的代码所示：\n\n```javascript\nconsole.log(\"Age:\", age);\n\
  console.log(\"Type of age:\", typeof age);\n```\n\n当你有很多日志并需要快速浏览输出时，这特别有帮助。\n\n\
  ## 其他控制台方法\n\n还有其他相关的控制台方法值得了解，即使你主要使用 `console.log`，如下面的代码所示：\n\n```javascript\n\
  console.warn(\"This is a warning\");\nconsole.error(\"This is an error\");\n```\n\
  \n警告和错误在控制台中具有不同的样式，使它们更加突出。这在浏览大量输出时会有所帮助。\n\n一个实用的经验法则是在学习时早记录、多记录，一旦代码正常工作就移除或减少日志。记录日志不是软弱或缺乏经验的表现。它是让不可见的程序状态变得可见的方法。\n\
  \n### 提示\n\n除了 `console.log` 之外，最有用的控制台方法有哪些？\n\n## 使用模板字面量自定义输出\n\n模板字面量允许你将变量和表达式直接嵌入\
  \ `string` 中，而不必手动拼接各个片段。\n\n在模板字面量中，任何写为 `${...}` 的内容都会作为 JavaScript 进行求值。结果会被转换为\
  \ `string` 并插入该位置。例如，下面的代码：\n\n```javascript\nlet message = `Message: Title is \"\
  ${pageTitle}\", clicks = ${clicks}.`;\n```\n\n前面的代码语句通过将变量值插入字符串来构建一条可读的消息。让我们分解一下该语句：\n\
  \n* 文本包裹在反引号中，而不是引号中。反引号定义了一个模板字面量。\n* `Message: Title is \"` 只是字面文本。\n* `${pageTitle}`\
  \ 会被替换为存储在 `pageTitle` 变量中的当前值。\n* `\", clicks = \"` 是更多的字面文本。\n* `${clicks}` 会被替换为存储在\
  \ `clicks` 变量中的当前值。\n* `.` 是最后一个字面字符。\n\n如果 `pageTitle` 是 `\"Playground\"` 而 `clicks`\
  \ 是 `1`，JavaScript 生成的最终 `string` 为：\n\n```\nMessage: Title is \"Playground\", clicks\
  \ = 1.\n```\n\n## 用于存储数据的变量\n\n变量是你存储信息以便稍后使用的方式。在最新的 JavaScript 中，你主要会看到用 `let`\
  \ 和 `const` 声明的变量。变量是你计算机内存中一个命名的位置，你的程序在其中存储一个值。该值可能是一个数字、一些文本、一个 `true` 或 `false`\
  \ 值，或者是更复杂的东西，如对象。\n\n### 最佳实践：`var` 与 `let`/`const`\n\n你会在较旧的 JavaScript 代码和 AI\
  \ 生成的片段中遇到 `var`。`var` 是声明变量的原始方式，但它具有令人困惑的作用域行为，因为用 `var` 声明的变量是函数作用域的，而不是块作用域的，这意味着它们可以从\
  \ `if` 块和循环中“泄漏”出来。现代 JavaScript 改用 `let` 和 `const`。如果你看到 `var`，在脑海中用 `let` 替换它。\n\
  \n### 提示\n\n请解释 JavaScript 作用域以及全局、函数和块作用域的区别，并附带示例。\n\n例如，你可能会存储用户的名字或一个计数器，用于跟踪按钮被点击了多少次。`let`\
  \ 用于值预期会改变的情况。`const` 用于变量应始终指向同一值的情况。\n\n### 最佳实践：选择 `let` 还是 `const`\n\n一个常见的初学者错误是到处使用\
  \ `const`，然后惊讶地发现 JavaScript 拒绝让值改变。经验法则很简单。如果值会改变，使用 `let`。如果不应该改变，使用 `const`。\n\
  \n此示例展示了重新赋值如何工作，以及为什么 `const` 变量不能被重新赋值为新值。\n\n在 `index.html` 中，在现有的 `<script>`\
  \ 元素之后，添加一个新的 `<script>` 元素来引用一个名为 `variables.js` 的新代码文件，如下面代码中高亮显示的部分：\n\n```html\n\
  <script src=\"code-order.js\"></script>\n<script src=\"variables.js\"></script>\n\
  ```\n\n在与 HTML 文件相同的文件夹中，创建名为 `variables.js` 的代码文件，并输入以下代码：\n\n```javascript\nstatusElement.textContent\
  \ = \"Status: Demonstrating variables.\";\nlet clicks = 0; // This value can change.\n\
  const pageTitle = \"Playground\"; // This value will never change.\nmessageElement.textContent\
  \ = `Message: Title is \"${pageTitle}\", clicks = ${clicks}.`;\nclicks = clicks\
  \ + 1;\nconsole.log(\"After increment, clicks =\", clicks);\nmessageElement.textContent\
  \ = `Message: Title is \"${pageTitle}\", clicks = ${clicks}.`;\n// Try uncommenting\
  \ the next line to see the error.\n// pageTitle = \"New Title\";\n```\n\n请注意，`variables.js`\
  \ 使用了 `statusElement` 和 `messageElement`，即使它们是在 `code-order.js` 中声明的。这之所以有效，是因为所有\
  \ `<script>` 标签共享同一个全局作用域。就好像所有代码都在一个巨大的文件中一样。目前，你可以把它想象成一个共享的全局作用域。这对学习很方便，但在大型项目中会变得麻烦。在后续章节中，你将学习\
  \ JavaScript 模块，它为每个文件提供自己的私有作用域。\n\n刷新网页并注意以下几点：\n\n* 名为 `clicks` 的变量从 `0` 变为 `1`。\n\
  * 名为 `pageTitle` 的变量不会改变。你仍然可以在 DOM 中更改页面标题，但变量 `pageTitle` 不能被重新赋值。\n* 如果你取消注释最后一条语句并刷新页面，你将在\
  \ **控制台** 中看到一条错误消息，如 *图 5.2* 所示：\n\n![图 5.2：关于给常量变量赋值的错误](img/B34553_05_02.png)\n\
  \n注释掉最后一条语句以移除错误。\n\n## 作用域：变量的生存空间\n\n作用域描述了变量可以在代码的哪些地方被访问。换句话说，它回答了这样一个问题：这个变量存在于哪里，谁可以使用它？\n\
  \n\n\n\n## 理解作用域\n\n理解作用域有助于避免变量意外丢失、被覆盖或共享范围超出预期的 Bug。\n\n在本章中，你将遇到 JavaScript\
  \ 中三种主要的作用域类型。\n\n### 全局作用域\n\n位于**全局作用域**中的变量可以在脚本的任何位置访问。\n\n在前面的示例中，`statusElement`\
  \ 和 `messageElement` 等变量在一个文件中声明，然后在另一个文件中使用：\n\n```javascript\nconst statusElement\
  \ = document.querySelector(\"#status\");\n```\n\n因为两个 `<script>` 元素运行在同一个页面上，它们共享同一个全局作用域。这就是为什么\
  \ `variables.js` 可以使用 `code-order.js` 中声明的变量。\n\n这对小型示例很方便，但在大型应用中会变得有风险，因为任何脚本都可以更改这些值。\n\
  \n### 函数作用域\n\n在函数内部声明的变量仅存在于该函数内部：\n\n```javascript\nfunction makeGreeting(name)\
  \ {\n  const message = `Hello, ${name}!`;\n  return message;\n}\n```\n\n在前面的代码中，`message`\
  \ 仅存在于 `makeGreeting` 内部。如果你尝试在函数外部使用它，JavaScript 会抛出错误。这很有用，因为它将临时值限制在内部，防止意外干扰代码的其他部分。\n\
  \n### 块作用域\n\n**块作用域**适用于使用 `let` 和 `const` 在花括号 `{}` 内声明的变量，例如在 `if` 语句或循环中：\n\n\
  ```javascript\nif (true) {\n  const secret = \"hidden value\";\n  console.log(secret);\
  \ // Works here\n}\nconsole.log(secret); // Error: secret is not defined\n```\n\n\
  `secret` 变量仅存在于 `if` 代码块内部。\n\n这是 `let` 和 `const` 优于 `var` 的原因之一。较旧的 `var` 关键字会忽略块边界，可能导致令人困惑的\
  \ Bug。\n\n### 作用域与事件处理程序\n\n事件处理程序引入了另一层作用域：\n\n```javascript\nlet counter = 0;\n\
  incrementBtn.addEventListener(\"click\", () => {\n  counter = counter + 1;\n});\n\
  ```\n\n在前面的代码示例中：\n\n* `counter` 位于外部（全局）作用域\n* `() => {}` 箭头函数创建了自己的作用域\n* 该函数仍可访问\
  \ `counter`，因为它是在外部定义的\n\n这种行为称为**闭包**。你目前不需要掌握该术语，但它解释了为什么事件处理程序能记住先前定义的变量。\n\n\
  将变量保持在最小的合理作用域内：\n\n* 对于临时值，使用块作用域（`let` 或 `const`）。\n* 使用函数作用域来组织逻辑。\n* 尽量少用全局作用域，尤其是在程序变大时。\n\
  \n如果一个变量到处可访问，它就可能从任何地方被更改。这就是微妙 Bug 开始出现的地方。\n\n你很快会看到，某些操作（如 `document.querySelector()`）在未找到内容时会返回一个名为\
  \ `null` 的特殊值。掌握作用域有助于你理解值的来源，而理解 `null` 等值有助于你处理缺失的情况。\n\n## 数据类型：数字、字符串、布尔值、数组和对象\n\
  \nJavaScript 有几种核心数据类型，你将一直用到它们：\n\n* **数字** 用于计数和计算。\n* **字符串** 用于文本，写在引号内。\n*\
  \ **布尔值** 为 `true` 或 `false`，用于决策。\n* **数组** 是有序的值列表。\n* **对象** 将相关值按命名属性分组。\n\n\
  本节展示常见数据类型及其行为。\n\n在 `index.html` 中，在现有的 `<script>` 元素之后，添加一个新的 `<script>` 元素来引用名为\
  \ `data-types.js` 的新代码文件，如下面的代码所示：\n\n```html\n<script src=\"data-types.js\"></script>\n\
  ```\n\n在与 HTML 文件相同的文件夹中，创建名为 `data-types.js` 的代码文件，并输入以下代码：\n\n```javascript\n\
  statusElement.textContent = \"Status: Demonstrating data types.\";\nconst age =\
  \ 54;                       // number\nconst firstName = \"Mark\";             //\
  \ string\nconst isMember = true;                // boolean\nmessageElement.textContent\
  \ = `Message: ${firstName} is ${age} years old. Member: ${isMember}.`;\nconsole.log(typeof\
  \ age, age);\nconsole.log(typeof firstName, firstName);\nconsole.log(typeof isMember,\
  \ isMember);\n// Two types you'll use constantly:\nconst favoriteShows = [\"Andor\"\
  , \"Heated Rivalry\"]; // array (list)\nconst user = { name: \"Mark\", age: 42 };\
  \ // object (grouped properties)\nconsole.log(\"Array example:\", favoriteShows);\n\
  console.log(\"Object example:\", user);\n```\n\n刷新网页，注意浏览器允许你在控制台中展开这些对象以检查其属性。这比尝试手动打印所有内容要信息量大得多，如*图\
  \ 5.3*所示：\n\n![](img/B34553_05_03.png)\n\n**图 5.3：** 将不同数据类型的变量记录到控制台\n\n当你开始使用\
  \ DOM 和 API 时，数组和对象会不断出现，因此熟悉如何将它们记录到控制台以进行调试尤为重要。\n\n**提示：** 如何分步使用 Chrome DevTools\
  \ 调试 JavaScript？展示如何在 JavaScript 中使用断点以及它们为何有用。\n\n## 函数：可复用代码、参数、返回值\n\n**函数**\
  \ 是执行特定任务的可复用代码块。你定义一次函数，然后在需要时随时调用。这使代码保持可读并避免重复。函数让 JavaScript 具有可复用性。\n\n函数可以接受输入（称为参数），并可以返回结果。即使\
  \ JavaScript 代码看起来很复杂，通常也只是函数调用其他函数。\n\n此示例将定义函数、调用它们，然后使用返回值更新页面。\n\n在 `index.html`\
  \ 中，在现有的 `<script>` 元素之后，添加一个新的 `<script>` 元素来引用名为 `functions.js` 的新代码文件，如下面的代码所示：\n\
  \n```html\n<script src=\"functions.js\"></script>\n```\n\n在与 HTML 文件相同的文件夹中，创建名为\
  \ `functions.js` 的代码文件，并输入以下代码：\n\n```javascript\nstatusElement.textContent = \"\
  Status: Demonstrating functions.\";\nfunction makeGreeting(personName) {\n  return\
  \ `Hello, ${personName}!`;\n}\nfunction showMessage(text) {\n  messageElement.textContent\
  \ = `Message: ${text}`;\n}\nconst greeting = makeGreeting(\"Captain Picard\");\n\
  console.log(\"Greeting returned from function:\", greeting);\nshowMessage(greeting);\n\
  ```\n\n注意前面代码的以下几点：\n\n* `makeGreeting()` 返回一个 `string` 值。\n* `showMessage()` 执行一个动作。\n\
  \n刷新网页，注意使用函数返回的 `string` 值的消息显示在网页和控制台中，如*图 5.4*所示：\n\n![](img/B34553_05_04.png)\n\
  \n**图 5.4：** 调用函数以返回字符串值\n\n保持函数简短清晰，会让后续的 DOM 代码更易于理解和调试。\n\n**提示：** JavaScript\
  \ 中的调用栈是什么，它与函数执行有何关系？\n\n## 连接事件处理程序\n\n`addEventListener()` 是 DOM 元素上可用的方法。它让你监听特定事件，并在事件发生时注册一个要运行的函数。你不是现在运行该函数，而是将其交给浏览器，以便稍后运行。\n\
  \n例如：\n\n```javascript\nincrementBtn.addEventListener(\"click\", () => {\n  counter\
  \ = counter + 1;\n  renderCounter();\n});\n```\n\n第一个参数 `\"click\"` 是事件类型。它告诉浏览器你关心哪种事件。在本例中，它是鼠标或触摸点击按钮。\n\
  \n\n\n### 事件处理程序和箭头函数\n\n第二个参数是一个函数。这个函数被称为 `event handler`（事件处理程序）：\n\n```\n()\
  \ => {\n  counter = counter + 1;\n  renderCounter();\n}\n```\n\n这是一个 `arrow function`（箭头函数）。它定义了一个小型的、无参数的匿名函数。你不会自己调用它。浏览器会在每次点击按钮时自动调用它。\n\
  \n`counter` 是一个存在于函数外部的变量。每次点击都会将其值加一。因为函数在每次点击时都会再次运行，所以该值会随时间持续增加。\n\n通常，`renderCounter`\
  \ 会读取 `counter` 的当前值并将其写入 DOM，以便用户看到新的数字。\n\n这里有一个细节很重要：时机。箭头函数内部的代码在用户点击按钮之前都不会运行。JavaScript\
  \ 完成页面加载，设置好事件监听器，然后等待。当点击发生时，浏览器会在正确的时刻调用处理程序函数。\n\n用通俗的英语来说，这段代码的意思是：*当点击增加按钮时，将计数器加一，然后更新显示以匹配新值。*\n\
  \n`Prompt`：什么是 JavaScript 中的事件冒泡和捕获？展示一个简单的可视化解释。\n\n### 条件语句：带有布尔值和比较的 if / else\n\
  \nJavaScript 中的决策是通过 `conditional statements`（条件语句）来实现的。最常见的是 `if` 语句。它允许你的代码根据某事是\
  \ `true`（真）还是 `false`（假）来选择不同的路径。\n\n例如，你可能会在允许提交之前检查表单字段是否为空。这就是 JavaScript 如何选择一条路径，而不是每次都运行相同的代码。\n\
  \n本节使用输入字段并检查用户是否输入了任何内容。它还以适合初学者的方式引入了比较和真值。\n\n在 `index.html` 中，在现有的 `<script>`\
  \ 元素之后，添加一个新的 `<script>` 元素来引用一个名为 `conditionals.js` 的新代码文件，如下面的代码所示：\n\n```\n<script\
  \ src=\"conditionals.js\"></script>\n```\n\n在与 HTML 文件相同的文件夹中，创建一个名为 `conditionals.js`\
  \ 的代码文件，并输入以下代码：\n\n```\nconst nameInput = document.querySelector(\"#nameInput\"\
  );\nconst helloBtn = document.querySelector(\"#helloBtn\");\nstatusElement.textContent\
  \ = \"Status: Demonstrating conditionals.\";\nhelloBtn.addEventListener(\"click\"\
  , () => {\n  const typedName = nameInput.value; // string (possibly empty)\n  if\
  \ (typedName.trim() === \"\") {\n    messageElement.textContent = \n      \"Message:\
  \ Please type your name first.\";\n  } else {\n    messageElement.textContent =\
  \ \n      `Message: Hello, ${typedName}!`;\n  }\n});\n```\n\n关于前面代码的注意事项：\n\n* `trim()`\
  \ 会移除前导或尾随空白字符，因此 `\" \"` 会被视为空。\n* `===` 检查相等性而不进行类型强制转换，这避免了许多令人困惑的 bug。\n\n`Good\
  \ practice`（良好实践）：类型强制转换是 JavaScript 自动将值从一种类型转换为另一种类型的习惯，当它认为可以使操作 `work`（生效）时就会发生。这通常在没有错误或警告的情况下悄悄发生，这也是为什么它会给初学者带来如此多困惑的原因。宽松相等运算符\
  \ `==` 允许类型强制转换。如果两个值的类型不同，JavaScript 会尝试在比较之前转换其中一个或两个。这原本是为了方便，但它制造了难以发现的意外和 bug。严格相等运算符\
  \ `===` 不允许类型强制转换。类型和值必须完全匹配，比较结果才为 `true`。除非你有非常充分的理由，否则请对比较使用严格相等运算符。\n\n刷新网页，点击\
  \ `Say hello` 按钮，并观察响应。然后输入你的名字，点击 `Say hello` 按钮，并观察响应，如 `Figure 5.5` 所示：\n\n![](img/B34553_05_05.png)\n\
  \nFigure 5.5: 在向 Bob 说 Hello 之前进行条件检查\n\n我们尚未添加任何代码来更改 `Counter: 0`。\n\n### 循环：重复工作和遍历数组\n\
  \n循环允许你多次重复一个动作。你不必一次又一次地编写同一行代码，而是告诉 JavaScript 运行多少次，或者一直运行直到条件发生变化。在处理数组或页面上的元素组时，循环特别有用。\n\
  \n本节多次更新消息并记录日志，然后遍历一个数组。\n\n在 `index.html` 中，在现有的 `<script>` 元素之后，添加一个新的 `<script>`\
  \ 元素来引用一个名为 `loops.js` 的新代码文件，如下面的代码所示：\n\n```\n<script src=\"loops.js\"></script>\n\
  ```\n\n在与 HTML 文件相同的文件夹中，创建一个名为 `loops.js` 的代码文件，并输入以下代码：\n\n```\nstatusElement.textContent\
  \ = \"Status: Demonstrating loops.\";\n// 一个简单的 for 循环从 1 计数到 5。\nlet output = \"\
  Counting: \";\nfor (let i = 1; i <= 5; i++) {\n  output += i + \" \";\n  console.log(\"\
  i is\", i);\n}\nmessageElement.textContent = \"Message: \" + output.trim();\n//\
  \ 遍历数组（列表）\nconst languages = [\"HTML\", \"CSS\", \"JavaScript\", \"Python\"];\n\
  for (let i = 0; i < languages.length; i += 1) {\n  console.log(`Language ${i}:`,\
  \ languages[i]);\n}\n```\n\n关于前面代码的注意事项：\n\n* `for` 循环有三个部分：开始 (`let i = 1`)、条件\
  \ (`i <= 5`) 和步进即增量 (`i++`)。\n* 数组使用 `length`，索引从 `0` 开始。\n\n刷新网页，注意到 `for` 循环从\
  \ 1 增加到 5，并且数组被遍历了所有项目，如 `Figure 5.6` 所示：\n\n![](img/B34553_05_06.png)\n\nFigure\
  \ 5.6: 循环\n\n`Prompt`：请总结 JavaScript 中所有的条件语句和循环语句，并为每一个包含代码示例。\n\n### 错误处理\n\n\
  错误是编写 JavaScript 的正常组成部分。你在学习过程中会不断看到它们，在生产代码中仍然会看到它们。\n\n到目前为止，你一直依赖浏览器控制台来显示错误。这很有用，但有时你也希望在代码中处理错误，以便你的程序能够优雅地失败，而不是崩溃。JavaScript\
  \ 使用 `try` 和 `catch` 提供了一种内置的方法来实现这一点。\n\n`try` 块包含可能失败的代码。如果发生错误，JavaScript 会停止运行该块并跳转到\
  \ `catch` 块：\n\n```\ntry {\n  const result = riskyOperation();\n  console.log(result);\n\
  } catch (error) {\n  console.error(\"Something went wrong:\", error);\n}\n```\n\n\
  前面的代码意味着：尝试运行 `riskyOperation()` 函数并记录结果，但如果出现问题，捕获错误并进行处理。\n\n作为另一个例子，你可能尝试查找一个名为\
  \ `status` 的元素并更改其文本内容以向用户显示消息：\n\n```\nconst element = document.querySelector(\"\
  #status\");\ntry {\n  element.textContent = \"Updated safely\";\n} catch (error)\
  \ {\n  console.error(\"Failed to update element:\", error);\n}\n```\n\n在前面的代码中，如果\
  \ `element` 为 `null`，尝试访问 `textContent` 通常会抛出错误并停止执行。有了 `try` 和 `catch`，你可以处理这种情况，而不是让它静默或不可预测地崩溃。\n\
  \n也就是说，在这种情况下，简单的 `if (element)` 检查通常更好。当你无法轻松预测或防止错误时，请使用 `try` 和 `catch`。\n\n\
  ## 抛出你自己的错误\n\n你也可以使用 `throw` 故意创建错误。当你检测到无效情况时，这很有用：\n\n```\nfunction greet(name)\
  \ {\n  if (!name) {\n    throw new Error(\"Name is required\");\n  }\n  return `Hello,\
  \ ${name}!`;\n}\n```\n\n然后在使用该函数的地方处理它：\n\n\n\n\n```javascript\ntry {\n  const message\
  \ = greet(\"\");\n  console.log(message);\n} catch (error) {\n  console.error(error.message);\n\
  }\n```\n\n这种模式能清楚地表明何时出错，并让你能做出适当的响应。\n\n你也可以添加一个 `finally` 代码块。无论是否发生错误，它都会运行：\n\
  \n```javascript\ntry {\n  console.log(\"Trying something...\");\n} catch (error)\
  \ {\n  console.error(\"It failed:\", error);\n} finally {\n  console.log(\"This\
  \ always runs\");\n}\n```\n\n使用 `finally` 执行清理任务，例如重置 UI 状态或停止加载指示器。\n\n## 何时使用错误处理\n\
  \n初学者常犯的一个错误是过度使用 `try` 和 `catch`。\n\n在以下情况下使用它：\n\n- 你调用的代码可能会不可预测地失败\n- 你想防止整个程序停止运行\n\
  - 你需要恢复执行或显示用户友好的消息\n\n在以下情况下避免使用它：\n\n- 简单的条件检查就能防止错误\n- 你用它来隐藏 bug 而不是修复它们\n\n\
  例如，这样做更好：\n\n```javascript\nif (element) {\n  element.textContent = \"Updated\"\
  ;\n}\n```\n\n而不是这样：\n\n```javascript\ntry {\n  element.textContent = \"Updated\"\
  ;\n} catch {}\n```\n\n第二种版本是隐藏问题而非解决问题。\n\n**良好实践**：将错误处理视为安全网，而非主要的控制流工具。\n\n大多数情况下，你应该：\n\
  \n- 编写避免错误的代码（通过检查值）\n- 出问题时使用控制台进行调试\n- 在需要优雅处理意外失败时添加 `try`/`catch`\n\n随着程序规模增长，错误会变得更隐蔽。有些来自用户输入，有些来自缺失的元素、时序问题或意外的数据。\n\
  \n能够捕获并处理错误，意味着你的代码能智能响应，而不是以令人困惑的方式中断。这也让 AI 生成的代码测试更安全，因为你可以隔离可能失败的部分并检查实际错误。\n\
  \n## 结合事件综合实践\n\n本节将基础知识串联起来，暂不深入 DOM。它用到了变量、函数、条件判断和事件处理器。\n\n在 `index.html` 中，在现有的\
  \ `<script>` 元素之后，添加一个新的 `<script>` 元素来引用一个名为 `events.js` 的新代码文件，如下所示：\n\n```html\n\
  <script src=\"events.js\"></script>\n```\n\n在与 HTML 文件相同的文件夹中，创建名为 `events.js` 的代码文件，并输入以下代码：\n\
  \n```javascript\nconst counterElement = document.querySelector(\"#counterValue\"\
  );\nconst incrementBtn = document.querySelector(\"#incrementBtn\");\nconst resetBtn\
  \ = document.querySelector(\"#resetBtn\");\nstatusElement.textContent = \"Status:\
  \ Putting it together.\";\nlet counter = 0;\nfunction renderCounter() {\n  counterElement.textContent\
  \ = String(counter);\n  messageElement.textContent = `Message: Counter is now ${counter}.`;\n\
  }\nincrementBtn.addEventListener(\"click\", () => {\n  counter = counter + 1;\n\
  \  renderCounter();\n});\nresetBtn.addEventListener(\"click\", () => {\n  counter\
  \ = 0;\n  renderCounter();\n});\n// Initial render so the UI matches the variable.\n\
  renderCounter();\n```\n\n刷新网页，注意每次点击 **Increment counter** 按钮，计数器都会加一。点击三次后，输出为\
  \ **Counter: 3**，如 *图 5.7* 所示：\n\n![](img/B34553_05_07.png)\n\n图 5.7：通过按钮点击事件递增计数器\n\
  \n这是大多数交互式 Web 代码的形态。状态存在于像 `counter` 这样的变量中，行为存在于像 `renderCounter` 这样的函数中，网页上的用户操作触发事件。\n\
  \nAI 可以快速生成 JavaScript。这不是难点。难点在于决定当用户点击、输入、提交或更改某些内容时应该发生什么。在计数器示例中，你需要知道数字存储在哪里、哪个按钮会改变它、以及页面的哪部分必须在之后更新。这就是要练习的技能：跟踪移动的部件，然后判断代码是否符合你想要的行为。\n\
  \n既然你已经了解了 JavaScript 和语言的主要组成部分，让我们通过一个小练习来测试你所学的内容。\n\n### 小练习与测验\n\n使用同一个页面，进行一些小修改和添加：\n\
  \n- 将计数器步长改为每次加 5\n- 添加一个“递减”按钮\n- 将问候语改为始终使用大写\n\n**提示**：请测试我关于 JavaScript 基础知识的掌握情况，比如声明变量和编写简单函数。例如，“`const`\
  \ 和 `let` 有什么区别？”\n\n在下一节中，我们将通过查看 DOM 将这些基础知识与浏览器本身联系起来。那是变量、函数和事件汇聚在一起、改变用户在页面上所见所交互内容的地方。\n\
  \n### DOM 操作\n\n在 `Chapter05` 文件夹中，创建一个名为 `DomManipulation` 的文件夹，并在其中创建一个名为 `index.html`\
  \ 的文件，包含以下代码：\n\n你可以从以下链接下载此网页的源代码：[`github.com/markjprice/web-dev-ai/blob/main/Code/Chapter05/DomManipulation/index.html`](https://github.com/markjprice/web-dev-ai/blob/main/Code/Chapter05/DomManipulation/index.html)\n\
  \n\n\n\n### DOM 操作演练场\n\n## HTML 结构\n\n```html\n<!doctype html>\n<html lang=\"en-US\"\
  >\n<head>\n  <meta charset=\"utf-8\" />\n  <meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1\" />\n  <title>DOM Manipulation Playground</title>\n  <link rel=\"\
  stylesheet\" href=\"styles.css\" />\n</head>\n<body>\n  <h1>DOM Manipulation Playground</h1>\n\
  \  <p class=\"muted\">Open Developer Tools Console. Reference one script example\
  \ at a time at the bottom.</p>\n  <div class=\"grid\">\n    <section class=\"card\"\
  \ aria-labelledby=\"card-status\">\n      <h2 id=\"card-status\">1) Status panel</h2>\n\
  \      <p id=\"statusText\">Status: Waiting…</p>\n      <div class=\"row\">\n  \
  \      <button id=\"btnSetStatus\" type=\"button\">Set status</button>\n       \
  \ <button id=\"btnClearStatus\" type=\"button\">Clear status</button>\n      </div>\n\
  \    </section>\n    <section class=\"card\" aria-labelledby=\"card-profile\">\n\
  \      <h2 id=\"card-profile\">2) Profile editor</h2>\n      <div class=\"row\"\
  >\n        <input id=\"nameInput\" type=\"text\" placeholder=\"Name\" />\n     \
  \   <select id=\"moodSelect\">\n          <option value=\"neutral\">Neutral</option>\n\
  \          <option value=\"productive\">Productive</option>\n          <option value=\"\
  sleepy\">Sleepy</option>\n          <option value=\"chaotic\">Chaotic</option>\n\
  \        </select>\n        <button id=\"btnApplyProfile\" type=\"button\">Apply</button>\n\
  \      </div>\n      <p>Preview: <strong id=\"profilePreview\">Anonymous (neutral)</strong></p>\n\
  \    </section>\n    <section class=\"card\" aria-labelledby=\"card-todo\">\n  \
  \    <h2 id=\"card-todo\">3) Quick to-do list</h2>\n      <div class=\"row\">\n\
  \        <input id=\"todoInput\" type=\"text\" placeholder=\"Add a task (e.g., 'Refactor\
  \ CSS')\" />\n        <button id=\"btnAddTodo\" type=\"button\">Add</button>\n \
  \       <button id=\"btnClearDone\" type=\"button\">Clear done</button>\n      </div>\n\
  \      <ul id=\"todoList\" class=\"muted\">\n        <li class=\"pill\" data-done=\"\
  false\">\n          <input type=\"checkbox\" aria-label=\"Mark done\" />\n     \
  \     <span>Write the first DOM example</span>\n          <button type=\"button\"\
  \ data-action=\"remove\">Remove</button>\n        </li>\n      </ul>\n      <p class=\"\
  muted\" id=\"todoCount\">0 items</p>\n    </section>\n    <section class=\"card\"\
  \ aria-labelledby=\"card-theme\">\n      <h2 id=\"card-theme\">4) Theme + visibility</h2>\n\
  \      <div class=\"row\">\n        <button id=\"btnToggleTheme\" type=\"button\"\
  >Toggle theme</button>\n        <button id=\"btnToggleTodo\" type=\"button\">Show/Hide\
  \ to-do card</button>\n      </div>\n      <p class=\"muted\">This section is perfect\
  \ for practicing class toggling and attribute changes.</p>\n    </section>\n  </div>\n\
  \  <script src=\"example1.js\"></script>\n</body>\n</html>\n```\n\n## CSS 样式表\n\n\
  创建一个名为 `styles.css` 的文件。为了节省这本印刷书的空间，您可以从以下链接下载此网页的源代码：[`github.com/markjprice/web-dev-ai/blob/main/Code/Chapter05/DomManipulation/styles.css`](https://github.com/markjprice/web-dev-ai/blob/main/Code/Chapter05/DomManipulation/styles.css)\n\
  \n## DOM 操作示例\n\n现在让我们看看一些酷炫且实用的 DOM 操作示例，它们可以插入到该页面中。一次只使用一个示例：将一段代码块粘贴到 `<script>`\
  \ 标签中，刷新，尝试一下，然后用下一个代码块替换它。\n\n## 示例 1：选择元素并更改文本\n\n### 本示例教授的内容\n\n* 使用 `querySelector`\
  \ 选择 DOM 元素\n* 使用 `textContent` 编写 UI\n* 响应按钮点击\n\n### 代码：`example1.js`\n\n将以下代码添加到名为\
  \ `example1.js` 的文件中，该文件由网页底部的 `<script>` 元素引用：\n\n```javascript\nconst statusText\
  \ = document.querySelector(\"#statusText\");\nconst btnSetStatus = document.querySelector(\"\
  #btnSetStatus\");\nconst btnClearStatus = document.querySelector(\"#btnClearStatus\"\
  );\nbtnSetStatus.addEventListener(\"click\", () => {\n  const now = new Date();\n\
  \  statusText.textContent = `Status: Updated at ${now.toLocaleTimeString(\"en-GB\"\
  )}`;\n});\nbtnClearStatus.addEventListener(\"click\", () => {\n  statusText.textContent\
  \ = \"Status: Waiting…\";\n});\n```\n\n### 良好实践\n\n使用 `textContent`（而非 `innerHTML`）在\
  \ DOM 中设置文本。`textContent` 将所有内容视为纯文本，这很安全。`innerHTML` 将字符串解释为 HTML，因此如果该字符串来自用户输入，攻击者可能会注入恶意代码。仅当您完全控制内容并了解风险时，才使用\
  \ `innerHTML`。\n\n### 提示\n\n请结合示例和安全影响，解释 `textContent`、`innerText` 和 `innerHTML`\
  \ 之间的区别。\n\n### 测试示例\n\n刷新网页，在 1) 状态面板 框中，点击“设置状态”和“清除状态”按钮，并注意每次点击时更新的文本。例如，点击“设置状态”后，您将看到当前时间，如图\
  \ 5.8 所示：\n\n![](img/B34553_05_08.png)\n\n图 5.8：使用 DOM 更新文本\n\n## 处理缺失值：`null` 和\
  \ `undefined`\n\n当您开始使用 DOM 时，偶尔会遇到值缺失的情况。JavaScript 使用两个特殊值来表示这种情况：`null` 和 `undefined`。\n\
  \n它们看起来相似，但含义略有不同。\n\n### DOM 中的 `null`\n\n在 DOM 上下文中，`null` 表示未找到任何内容。`null` 是一个显式的“无值”结果。当某事物不存在时，API\
  \ 通常会返回它。\n\n例如：\n\n```javascript\nconst element = document.querySelector(\"#doesNotExist\"\
  );\nconsole.log(element); // null\n```\n\n在这种情况下，浏览器在页面中搜索具有该 ID 的元素，但未找到，因此返回了\
  \ `null`。如果您尝试将该结果当作真实元素使用，代码将会失败：\n\n```javascript\nelement.textContent = \"Hello\"\
  ; // Error\n```\n\n初学者经常犯这个 DOM 错误。\n\n一种安全的模式是在使用值之前检查 `null`：\n\n```javascript\n\
  if (element !== null) {\n  element.textContent = \"Hello\";\n}\n```\n\n或者更简洁地：\n\
  \n```javascript\nif (element) {\n  element.textContent = \"Hello\";\n}\n```\n\n\
  ### JavaScript 中的 `undefined`\n\n`undefined` 表示未分配值。因此 `undefined` 意味着变量存在，但未分配给它任何值：\n\
  \n```javascript\nlet message;\nconsole.log(message); // undefined\n```\n\n当您访问不存在的事物时，也会出现它：\n\
  \n```javascript\nconst user = { name: \"Mark\" };\nconsole.log(user.age); // undefined\n\
  ```\n\n这里，`user` 对象存在，但 `age` 属性不存在，因此 JavaScript 返回 `undefined`。\n\n### 关键区别\n\n\
  区别很微妙但很有用：\n\n* `null` 通常来自 API 或函数，表示“未找到任何内容”。\n* `undefined` 通常意味着“此值从未设置”或“不存在”。\n\
  \n在日常代码中，您通常以相同的方式对待它们：作为某些内容缺失的信号。\n\n### 使用 DOM 时的良好实践\n\n当您从页面选择元素时：\n\n* 假设\
  \ `querySelector` 可能返回 `null`\n* 如果有任何疑问，在使用结果前进行检查\n\n例如：\n\n```javascript\nconst\
  \ btn = document.querySelector(\"#myButton\");\nif (!btn) {\n  console.warn(\"Button\
  \ not found\");\n} else {\n  btn.addEventListener(\"click\", () => {\n    console.log(\"\
  Clicked\");\n  });\n}\n```\n\n随着页面的增长和 JavaScript 与更多动态内容交互，这种防御性检查变得更加重要。\n\n当\
  \ JavaScript 中出现莫名其妙的故障时，通常是因为值为 `null` 或 `undefined`，而您的代码仍尝试使用它。一旦您识别出这两个值，这些错误就更容易发现和修复。\n\
  \n介绍完 `null` 和 `undefined` 后，接下来的示例可以专注于安全地更改页面。\n\n## 示例 2：读取用户输入并更新 DOM\n\n###\
  \ 本示例教授的内容\n\n* 从输入控件读取值\n* `trim()` 函数\n* 条件语句\n* 更新单个元素\n\n\n\n\n# DOM 操作示例\n\n\
  ## 示例 2：个人资料编辑器\n\n将以下代码块添加到名为 `example2.js` 的文件中，该文件由网页底部的 `<script>` 元素引用：\n\n\
  ```javascript\nconst nameInput = document.querySelector(\"#nameInput\");\nconst\
  \ moodSelect = document.querySelector(\"#moodSelect\");\nconst btnApplyProfile =\
  \ document.querySelector(\"#btnApplyProfile\");\nconst profilePreview = document.querySelector(\"\
  #profilePreview\");\nbtnApplyProfile.addEventListener(\"click\", () => {\n  const\
  \ name = nameInput.value.trim();\n  const mood = moodSelect.value;\n  const displayName\
  \ = name === \"\" ? \"Anonymous\" : name;\n  profilePreview.textContent = `${displayName}\
  \ (${mood})`;\n});\n```\n\n刷新网页，在 **2) Profile editor（个人资料编辑器）** 框中，输入一个包含姓名前后额外空格的姓名，从下拉列表中选择一个心情选项，点击\
  \ **Apply（应用）** 按钮，注意表单编辑的摘要会出现在 **Preview（预览）** 标签之后，如 *Figure 5.9（图 5.9）* 所示：\n\
  \n![](img/B34553_05_09.png)\n\nFigure 5.9: Selecting form options using the DOM\n\
  \n## 示例 3：添加、移除和计数列表项\n\n本节介绍如何以编程方式创建 DOM 元素。内容包括：\n\n* 使用 `createElement` 创建新的\
  \ HTML 元素\n* 使用 `append` 将 HTML 元素添加到现有父元素中\n* 使用 `dataset` 存储自定义数据\n* 简单的 UI 账务管理\n\
  \n将以下代码块添加到名为 `example3.js` 的文件中，该文件由网页底部的 `<script>` 元素引用：\n\n```javascript\nconst\
  \ todoInput = document.querySelector(\"#todoInput\");\nconst btnAddTodo = document.querySelector(\"\
  #btnAddTodo\");\nconst todoList = document.querySelector(\"#todoList\");\nconst\
  \ todoCount = document.querySelector(\"#todoCount\");\nfunction updateCount() {\n\
  \  const items = todoList.querySelectorAll(\"li\");\n  todoCount.textContent = \n\
  \    `${items.length} item${items.length === 1 ? \"\" : \"s\"}`;\n}\nfunction makeTodoItem(text)\
  \ {\n  const li = document.createElement(\"li\");\n  li.className = \"pill\";\n\
  \  li.dataset.done = \"false\";\n  const checkbox = document.createElement(\"input\"\
  );\n  checkbox.type = \"checkbox\";\n  checkbox.setAttribute(\"aria-label\", \"\
  Mark done\");\n  const span = document.createElement(\"span\");\n  span.textContent\
  \ = text;\n  const removeBtn = document.createElement(\"button\");\n  removeBtn.type\
  \ = \"button\";\n  removeBtn.textContent = \"Remove\";\n  removeBtn.dataset.action\
  \ = \"remove\";\n  li.append(checkbox, span, removeBtn);\n  return li;\n}\nbtnAddTodo.addEventListener(\"\
  click\", () => {\n  const text = todoInput.value.trim();\n  if (text === \"\") return;\n\
  \  todoList.append(makeTodoItem(text));\n  todoInput.value = \"\";\n  todoInput.focus();\n\
  \  updateCount();\n});\nupdateCount();\n```\n\n刷新网页，在 **3) Quick to-do list（快速待办事项列表）**\
  \ 框中，输入任务描述（如 `Comment my code`），点击 **Add（添加）** 按钮，注意一个新项目会动态添加到项目列表中，如 *Figure\
  \ 5.10（图 5.10）* 所示：\n\n![](img/B34553_05_10.png)\n\nFigure 5.10: Adding items to\
  \ a to-do list using the DOM\n\n**Remove（移除）** 和 **Clear done（清除已完成）** 按钮尚未实现！你将在下一个示例中实现它们。\n\
  \n## 示例 4：事件委托\n\n事件委托意味着为整个列表设置一个事件处理程序。\n\n这是一种常见的实用技术。你不需要为每个移除按钮和复选框附加监听器，而是将一个监听器附加到父级无序列表元素（`<ul>`）上，并检查点击了什么。\n\
  \n本代码示例教授：\n\n* 事件冒泡的概念\n* 使用 `event.target` 识别事件的目标\n* 使用 `closest`\n* 通过 `classList`\
  \ 进行类操作\n\n将以下代码块添加到名为 `example4.js` 的文件中，该文件由网页底部的 `<script>` 元素引用：\n\n```javascript\n\
  const btnClearDone = document.querySelector(\"#btnClearDone\");\nfunction updateCount()\
  \ {\n  const items = todoList.querySelectorAll(\"li\");\n  todoCount.textContent\
  \ = \n    `${items.length} item${items.length === 1 ? \"\" : \"s\"}`;\n}\nfunction\
  \ syncDoneStyles(li) {\n  const done = li.dataset.done === \"true\";\n  li.classList.toggle(\"\
  success\", done);\n}\ntodoList.addEventListener(\"click\", (event) => {\n  const\
  \ target = event.target;\n  if (target instanceof HTMLInputElement\n    && target.type\
  \ === \"checkbox\") {\n    const li = target.closest(\"li\");\n    if (!li) return;\n\
  \    li.dataset.done = String(target.checked);\n    syncDoneStyles(li);\n    return;\n\
  \  }\n  if (target instanceof HTMLButtonElement\n    && target.dataset.action ===\
  \ \"remove\") {\n    const li = target.closest(\"li\");\n    if (!li) return;\n\
  \    li.remove();\n    updateCount();\n  }\n});\nbtnClearDone.addEventListener(\"\
  click\", () => {\n  const doneItems = todoList.querySelectorAll('li[data-done=\"\
  true\"]');\n  for (const li of doneItems) {\n    li.remove();\n  }\n  updateCount();\n\
  });\n// Initialize styles for the starter item (if any)\nfor (const li of todoList.querySelectorAll(\"\
  li\")) {\n  syncDoneStyles(li);\n}\nupdateCount();\n```\n\n刷新网页，在 **3) Quick to-do\
  \ list（快速待办事项列表）** 框中，移除初始项目，然后添加三个新项目：`alpha`、`beta` 和 `gamma`。然后选中 **alpha** 和\
  \ **beta** 以显示它们为 *done（已完成）*，并点击 **Clear done（清除已完成）** 按钮，如 *Figure 5.11（图 5.11）*\
  \ 所示：\n\n![](img/B34553_05_11.png)\n\nFigure 5.11: Selecting items as done in a\
  \ to-do list using the DOM\n\n注意两个 *done（已完成）* 项目被移除了。\n\n在 gamma 项目旁边，点击 **Remove（移除）**，注意该项目被移除了。\n\
  \n**Prompt（提示）**：何时应该使用事件委托，而不是添加单独的事件监听器？\n\n## 示例 5：切换类和隐藏区域\n\n本代码示例教授：\n\n*\
  \ 使用 `classList.toggle` 切换 CSS 类的开启与关闭\n* 如何通过 CSS 显示或隐藏元素\n\n将以下代码块添加到名为 `example5.js`\
