  \ `Python`、`Git` 和 `Django` 等工具在运行命令时到底在做什么。\n\n使用 `Bash` 或类似的 Shell 进行脚本编写似乎与 Web\
  \ 开发无关，但其实从未远离。无论你是创建新项目、安装依赖、运行开发服务器、管理文件还是部署代码，你都会反复发现自己在终端中输入命令。\n\n像 `Bourne\
  \ Again Shell` (`Bash`) 和 `Z Shell` (`Zsh`) 这样的 Shell 让你能将一次性命令转化为可保存、可编辑、可再次运行的可重复步骤。\n\
  \n请记住，在 Stack Overflow 2025 年对 31,771 名开发者的调查中，48.7% 的人表示他们曾用 `Bash`/`Shell` 进行过大量开发工作。这使得学习\
  \ Shell 脚本变得值得，即使你主要认为自己是一名 Web 开发者。\n\n`Bash` 是大多数 Linux 系统的默认 Shell，长期以来一直是 macOS\
  \ 和服务器环境的核心。即使在 Windows 上，现代开发环境也通过 Windows Subsystem for Linux 和 `Git Bash` 等工具提供\
  \ `Bash`。因此，`Bash` 已成为跨平台的通用语言。\n\n自 2019 年 macOS Catalina 起，Mac 的默认 Shell 是 `Zsh`，而非\
  \ `Bash`。本章的基本命令在两种 Shell 中完全相同。macOS 自带的 `Bash` 版本相当旧。要在 macOS 上安装更新的 `Bash`，请使用以下\
  \ Homebrew 命令：`brew install bash`。或者，你可以直接使用 `Zsh`，因为对于本章内容来说，差异并不重要。\n\n本章刻意将 `Bash`\
  \ 扎根于日常开发任务，而不是将其视为一种需要孤立掌握的完整编程语言。你将了解什么是 `Bash` 以及它如何融入 Shell 的更广泛概念，练习用于导航和操作文件的核心命令，然后编写一个自动化真实任务的小脚本。读完本章后，你应该能轻松阅读和调整\
  \ Shell 命令，即使你从未完全独立编写过复杂脚本。\n\n因为命令行可能让人感到无情，我们还将探讨 AI 工具如何帮助你检查理解。善用它们可以解释陌生命令、建议更安全的替代方案，并帮助你理解失败的原因，而不仅仅是粘贴一个你不理解的修复方案。\n\
  \n读完本章，你将理解 `Bash` 的作用、导航文件系统、运行常用命令、编写简单的 `Bash` 脚本，并在运行前使用 AI 工具检查陌生命令。\n\n本章将涵盖以下主题：\n\
  \n* 介绍 `Bash`\n* 在 Windows 上设置 `Bash`\n* 基本命令\n* 编写简单脚本\n* 自动化你的 Django 开发\n* 使用\
  \ AI 获取 Shell 帮助\n\n本章建议的聊天机器人提示词及示例回复可在以下链接找到：[`github.com/markjprice/web-dev-ai/blob/main/prompts/ch10-bash/readme.md`](https://github.com/markjprice/web-dev-ai/blob/main/prompts/ch10-bash/readme.md)\n\
  \n## 介绍 `Bash`\n\n`Bash` 代表 `Bourne Again Shell`，它既是一个 Unix Shell，也是一种命令语言。简单来说，`Bash`\
  \ 是位于你和操作系统之间的程序，读取你输入的命令并将其转化为行动。\n\n当你打开终端窗口并输入类似 `python manage.py runserver`\
  \ 或 `npm install` 的内容时，你并不是在直接与 `Python` 或 `Node` 对话。你是在与 `Bash` 对话，`Bash` 负责启动那些程序、向它们传递参数并处理它们的输出。\n\
  \n> **提示：** 请结合具体例子解释 `Bash`、Shell 和终端的区别。\n\n### Shell 脚本编写\n\nShell 是操作系统的用户界面，只是不是图形化的。你不需要点击图标或菜单，而是发出文本命令。Unix\
  \ 系统一直将这种基于文本的界面视为正常的工作方式，这也是为什么像 `Bash` 这样的 Shell 变得如此可编写脚本且富有表现力。随着时间的推移，`Bash`\
  \ 也成了一种编程语言，拥有变量、条件判断、循环和函数。这让你能超越单个命令，开始自动化任务序列。\n\n`Bash` 在开发中特别有用，因为许多工具都是围绕它设计的。运行本地开发服务器、启动和停止后台进程、清理构建目录，或将多个工具链接在一起，在\
  \ `Bash` 中都非常简单。\n\n部署脚本几乎总是作为 Shell 脚本编写。持续集成系统执行 `Bash` 命令来构建、测试和部署应用程序。`Dockerfile`\
  \ 严重依赖 Shell 命令来组装镜像。即使你在使用其他开发工具，`Bash` 往往也是将所有东西粘合在一起的胶水。\n\n### 脚本可移植性\n\n`Bash`\
  \ 重要的另一个原因是可移植性。在你机器上编写的 `Bash` 脚本通常可以在云端的 Linux 服务器上原样运行。这种共享环境是云基础设施、DevOps 实践和容器化迅速普及的原因之一。当文档说“运行以下命令”时，几乎总是假设使用类\
  \ `Bash` 的 Shell，即使没有明确说明。\n\n### 终端与 Shell\n\n将 `Bash` 与终端本身区分开也很重要。终端只是显示文本和接受输入的窗口或应用程序。`Bash`\
  \ 是运行在该终端内的程序。还有其他 Shell，如 `zsh` 或 `fish`，但 `Bash` 仍然是通用基准。即使你的系统使用不同的默认 Shell，`Bash`\
  \ 通常也已安装并广泛支持，这也是为什么它仍被频繁教授和引用的原因。\n\n最外层是终端窗口。这只是一个用户界面。在 Windows 上可能是 `Windows\
  \ Terminal`，在 macOS 上是 `Terminal.app`，在 Linux 上则是众多终端模拟器之一。它的工作很简单：显示文本并发送你的按键。终端不理解命令。\n\
  \n运行在终端内部的是 Shell，这里是 `Bash`。`Bash` 是一个程序。它读取你输入的文本，解释它，跟踪当前目录和环境变量等状态，并决定下一步做什么。当你按下回车键，`Bash`\
  \ 解析命令行、展开变量、应用引用规则，并确定要执行的内容。\n\n当 `Bash` 识别出 `ls`、`python` 或 `docker` 等命令时，它会启动一个外部程序。这些程序是由操作系统或安装的工具提供的独立可执行文件。`Bash`\
  \ 将它们作为子进程启动，传递参数，并等待它们完成。它们的输出通过 `Bash` 回流并由终端显示。\n\n因此，流程始终是：\n\n```\nYou type\
  \ text → the terminal sends it to Bash → Bash interprets it → Bash runs programs\
  \ → output flows back up to the terminal.\n```\n\n这个流程解释了初学者的几个常见困惑：\n\n* 为什么更换\
  \ Shell 不会改变终端窗口\n\n\n\n"
- "# Bash 基础\n\n## 为什么选择 Bash？\n\n* 为什么 Bash 脚本可以运行 `Python`、`Docker`、`Git` 或任何其他工具\n\
  * 为什么错误通常来自你启动的程序，而不是 `Bash` 本身\n* 为什么相同的 `Bash` 命令在 macOS、Linux、WSL 和服务器上的行为一致\n\
  \n`Bash` 让你能直接、可编程地控制开发环境。你无需了解它的所有功能，但理解基础知识会让许多日常任务变得更快、更清晰、不再神秘。\n\n## 核心概念\n\
  \n* **终端**：窗口（仅负责输入/输出）\n* **Shell (Bash)**：解释器（理解命令）\n* **程序**：实际工具（`ls`、`python`、`docker`）\n\
  \n**提示**：既然存在 `zsh` 和 `fish` 等替代 Shell，为什么 `Bash` 仍被广泛使用？\n\n## 命令通用语法\n\n`Bash`\
  \ 命令通常遵循可预测的结构：**命令名**，后跟 **选项**（有时称为标志），再后跟参数。尽早理清这一点有助于你识别模式，而无需死记硬背所有内容。\n\n\
  例如：\n\n```\nls -l src\n```\n\n* `ls` 是命令（用于列出文件）\n* `-l` 是选项（使用长格式、详细列表）\n* `src`\
  \ 是参数（要列出的文件夹名称）\n\n```\ndocker run -p 8000:8000 image-name\n```\n\n* `docker` 是命令（使用\
  \ Docker）\n* `run` 是子命令（你想让 Docker 做什么）\n* `-p` 是选项（发布端口）\n* `8000:8000` 是参数（将本地端口映射到容器端口）\n\
  * `image-name` 是参数（要运行的镜像名称）\n\n你目前不需要记住所有选项。专注于识别这种空格分隔的结构，这将使你以后更容易理解新命令。\n\n\
  **提示**：请解释 Bash 命令的通用结构：命令名、选项和参数。\n\n## 有状态命令\n\n`Bash` 是有状态的，意味着当你输入命令时，`Bash`\
  \ 会维护上下文。你的当前工作目录、环境变量和命令历史都会从一个命令持久保留到下一个命令。\n\n这就是为什么 `cd`（更改目录）很重要，为什么一个命令此刻能运行下一刻却失败，以及为什么重启终端有时能解决问题。新手开发者往往假设每个命令都在隔离环境中运行。事实并非如此。\n\
  \n**提示**：`Bash` 是有状态的意味着什么？这如何影响脚本？\n\n## 命令历史与编辑\n\n`Bash` 有状态的一个有用结果是它会记住你做过的事情。你输入的每个命令都存储在命令历史中，这意味着你很少需要重新输入冗长或复杂的命令。\n\
  \n### 重复之前的命令\n\n按 ↑（上箭头）键可向后循环浏览之前的命令：\n\n```\ndocker run -p 8000:8000 my-image\n\
  ```\n\n如果你刚运行过这个命令想再次运行，按 ↑ 然后按 `Enter`。这在处理长命令或实验、需要重试时特别有帮助。\n\n### 搜索命令历史\n\n\
  你可以搜索命令历史，而不必逐行向后翻：\n\n1. 按 `Ctrl` + `R`\n2. 开始输入之前命令的一部分，例如 `docker`\n3. `Bash`\
  \ 会显示最近匹配的命令\n\n按 `Enter` 运行它，或继续按 `Ctrl` + `R` 循环浏览匹配项。\n\n### 运行前编辑命令\n\n当你使用\
  \ ↑ 或 `Ctrl` + `R` 调用命令时，可以在按 `Enter` 前对其进行编辑。开发者经常这样做：\n\n```\ndocker run -p 8000:8000\
  \ my-image\n```\n\n你可能只想改个端口：\n\n```\ndocker run -p 5000:5000 my-image\n```\n\n\
  这比重新输入整条命令快得多，也更不易出错。\n\n### 为什么这有帮助\n\n初学者往往认为需要从头输入每个命令。实际上，经验丰富的开发者严重依赖命令历史来：\n\
  \n* 修复错误后重试命令\n* 对之前的命令做微小调整\n* 更快地探索和实验\n\n这是 `Bash` 在命令间维护状态的另一个例子。你的历史、当前目录和环境都会持久保留，这就是为什么终端用得越久越好用。\n\
  \n你不需要记住每个命令。专注于理解命令的作用，让 `history` 功能帮你高效复用它们。\n\n## Tab 补全\n\n`Tab` 补全是 Shell\
  \ 提供的功能，而非终端。当你按 `Tab` 时，Shell 会尝试根据上下文自动补全你正在输入的内容：\n\n* 文件和文件夹名称\n* 命令名称\n* 选项和标志（针对某些工具）\n\
  \n在 `Bash` 中，基本补全开箱即用（文件、文件夹、命令），但更高级的补全（如 `Git` 分支、`Docker` 选项）取决于是否安装了 `bash-completion`。\n\
  \n`Zsh` 默认功能丰富得多，提供更好的建议，有时是菜单式补全。`Zsh` 通常通过 Oh My Zsh 等框架进一步增强。\n\n在 `Bash`、`Zsh`\
  \ 和大多数环境中，通常可以按 `Tab` 补全文件和文件夹名称，按两次 `Tab` 显示可用选项，并根据当前目录进行补全。\n\n## 拆分长命令为多行\n\n\
  有些命令包含多个选项或参数，会变得冗长且难以阅读。你可以使用反斜杠（`\\`）将命令拆分为多行，而不必写在一行上。\n\n反斜杠告诉 `Bash` 命令在下一行继续。\n\
  \n例如，不要写成：\n\n```\ndocker run -p 8000:8000 -v $(pwd):/app -e DEBUG=true my-image\n\
  ```\n\n而要这样写：\n\n```\ndocker run \\\n  -p 8000:8000 \\\n  -v $(pwd):/app \\\n  -e\
  \ DEBUG=true \\\n  my-image\n```\n\n这使命令更易读、易修改，尤其是从文档复制或处理复杂设置时。\n\n重要规则：\n\n*\
  \ 反斜杠必须是该行的**最后一个字符**\n* 反斜杠后**不要**加空格\n* `Bash` 将所有行视为单个连续命令\n\n如果你忘了反斜杠，`Bash`\
  \ 会尝试将每行作为单独命令运行，通常会导致错误。\n\n许多现实世界的命令，尤其是 `Docker`、`Git` 或云 CLI 等工具，可能变得冗长且难以管理。跨行拆分有助于你：\n\
  \n* 理解命令的每个部分\n* 编辑时避免错误\n* 更安全地复制粘贴命令\n\n你常在文档和脚本中见到这种风格。尽管看起来像多行，`Bash` 仍将其作为单条命令运行。\n\
  \n## 命令可组合\n\n`Bash` 特别擅长处理文本。一切皆文本输入、文本输出。命令写入标准输出，错误输到标准错误，这些流可重定向或连接。**管道操作符**\
  \ `|` 将一个命令的输出传给另一个命令的输入：\n\n```\nls -la | grep \".py\"  # 仅列出 Python 文件\ncat log.txt\
  \ | wc -l  # 统计文件行数\n```\n\n使用 `>` 或 `>>` 重定向可将输出发送到文件：\n\n```\necho \"Hello\" >\
  \ file.txt   # 写入（覆盖）\necho \"World\" >> file.txt  # 追加\n```\n\n这两个操作符让小命令能协同工作。\n\
  \n你目前不必深入学习管道和重定向，但请记住命令可以链式组合，这就是 Shell 感觉可组合而非整体的原因。\n\n## 用别名创建快捷方式\n\n随着你更频繁地使用命令行，你会发现反复输入相同的长命令。`Bash`\
  \ 提供了一种简单方法，使用**别名**为这些命令创建快捷方式。\n\n**别名**只是一个简短名称，会展开为更长的命令。\n\n\n\n\n在 Django\
  \ 项目中，你经常运行：\n\n```\npython manage.py runserver\n```\n\n你可以将其缩短为单个单词：\n\n```\nalias\
  \ serve=\"python manage.py runserver\"\n```\n\n现在你可以通过输入以下内容启动开发服务器：\n\n```\nserve\n\
  ```\n\n这与完整命令的作用相同，但输入更快且更易记忆。\n\n当你输入命令时，Bash 首先检查：\n\n1. 这是别名吗？\n2. 如果是，则用完整命令替换它\n\
  3. 然后执行结果\n\n因此：\n\n```\nserve\n```\n\n会在运行前变为：\n\n```\npython manage.py runserver\n\
  ```\n\n别名对于冗长或重复的命令以及你总是使用的带标志的命令最有帮助。例如：\n\n```\nalias ll=\"ls -la\"\nalias migrate=\"\
  python manage.py migrate\"\nalias test=\"python manage.py test\"\n```\n\n现在你的工作流变为：\n\
  \n```\nserve\nmigrate\ntest\n```\n\n### 临时与永久别名\n\n如果你在终端中定义别名，它仅在该会话期间有效。如果你关闭终端，它就会消失。\n\
  \n要使别名永久生效，请将其添加到你的 Shell 配置文件中：\n\n*   **Bash**：`~/.bashrc` 或 `~/.bash_profile`\n\
  *   **Zsh**：`~/.zshrc`\n\n例如，打开你的配置文件并添加：\n\n```\nalias serve=\"python manage.py\
  \ runserver\"\n```\n\n然后重新加载它：\n\n```\nsource ~/.bashrc\n```\n\n现在每次打开新终端时该别名都将可用。\n\
  \n别名是简单的文本替换。它们非常适合快捷方式，但受限于无法轻松处理参数，因此不适合多步骤例程。它们还可能使命令对其他开发者不够直观，因为它们不是标准的。\n\n\
  如果快捷方式变得复杂或需要逻辑，通常最好将其转换为脚本。\n\n别名是让命令行感觉不那么重复的最快方法之一。将别名视为快捷方式，将脚本视为可重复的过程。\n\n\
  ## 命令无情\n\nBash 功能强大但不宽容。图形文件管理器通常会在删除前询问。Bash 往往会立即完全执行你所要求的操作。这一点不是为了吓唬你，只是为了鼓励你在按下\
  \ `Enter` 键前仔细阅读命令的习惯，尤其是从文档或 AI 输出复制命令时。\n\n引入 Bash 不是为了让你成为 Shell 专家。而是为了让你能遵循说明、理解工具在做什么，并在重复变得烦人时编写小脚本。\n\
  \nBash 是一个在接受 AI 生成的答案前放慢脚步的好地方。像 `rm`、`chmod` 或 `docker run` 这样的命令可以更改文件、权限、进程或网络访问。在运行之前，请检查它将触及什么以及是否取决于你的当前目录。\n\
  \n运行命令前，请问：我在文件系统中的什么位置？这将触及哪些文件？它是创建、删除、更改权限、启动进程还是通过网络发送数据？这种思考比从记忆中输入命令更重要。命令行奖励理解行为的开发者。\n\
  \n许多读者将使用 Windows，这是个问题，因为 Bash（或类似 Bash 的替代 Shell，如 Mac 上的 Zsh）不是 Windows 的标准组件。如果你使用\
  \ Windows 且没有 Bash 或类似工具，在下一节你将学习如何安装它。如果你不使用 Windows，可以跳过下一节，继续阅读“基本命令”部分。\n\n\
  # 在 Windows 上设置 Bash\n\n要在 Windows 上使用 Bash，请安装 **Windows Subsystem Linux**（**WSL**）。\n\
  \nWSL 2 支持 Windows 11 和 Windows 10 版本 1903（内部版本 18362）或更高版本。\n\n## 从提升的终端安装 WSL\n\
  \n以管理员身份打开 PowerShell，然后运行：\n\n```\nwsl --install\n```\n\n或者，要安装特定的 Linux 发行版（如\
  \ Ubuntu），请运行：`wsl --install -d Ubuntu`。要列出可用的发行版，请运行：`wsl --list --online`。\n\n\
  这将安装 WSL，并根据你的 Windows 版本和配置通常安装默认的 Linux 发行版（通常是 Ubuntu），如以下输出所示：\n\n```\nDownloading:\
  \ Ubuntu\n[==========================53.5%                           ]\n```\n\n\
  如果你已经安装了 WSL，请检查你拥有的内容：\n\n```\nwsl -l -v\n```\n\n这将列出已安装的发行版以及每个是 WSL 1 还是 WSL\
  \ 2，如以下输出所示：\n\n```\n  NAME              STATE           VERSION\n* docker-desktop\
  \    Stopped         2\n  Ubuntu            Running         2\n```\n\n## 启动你的 Linux\
  \ 发行版并完成首次设置\n\n打开 **开始** 菜单，运行你的发行版，例如 **Ubuntu**，并按照提示创建 Linux 用户名和密码。这独立于你的 Windows\
  \ 登录。\n\n从现在起，当你启动 **Ubuntu** 时，你应该会看到如 *图 10.1* 所示的 Bash 提示符：\n\n![](img/B34553_10_01.png)\n\
  \n图 10.1：Ubuntu Bash 提示符和终端窗口\n\n## 在 Linux 内部更新包\n\n在 WSL 终端中，运行：\n\n```\nsudo\
  \ apt update\nsudo apt upgrade -y\n```\n\n这使环境保持最新，并避免令人困惑的安装问题。\n\n**良好实践**：`sudo`\
  \ 以管理员（root）权限运行命令。当你使用它时，系统会要求输入你的 Linux 密码以确认操作。此级别的访问应谨慎使用，仅用于系统级任务，例如使用 `apt`\
  \ 安装软件。对于日常开发命令，如 `pip install`、`python` 或 `npm`，你不应需要 `sudo`。如果这些工具仅在以提升的权限运行时才工作，通常意味着你的环境或权限设置不正确，应修复而不是绕过。\n\
  \n## 确认 Bash 正在运行\n\n在 WSL 终端中，运行：\n\n```\necho \"$SHELL\"\n```\n\n你应该会看到类似 `/bin/bash`\
  \ 的路径（或类似内容）。\n\n在 WSL 终端中，运行：\n\n```\nbash --version\n```\n\n你应该会看到版本输出（包含版权和许可证信息）：\n\
  \n```\nGNU bash, version 5.2.21(1)-release (x86_64-pc-linux-gnu)\n```\n\n## 为本章创建练习文件夹\n\
  \n在 WSL 终端中，运行：\n\n```\nmkdir -p ~/bash-chapter\ncd ~/bash-chapter\n```\n\n在 WSL\
  \ 终端中，检查你所在的位置：\n\n```\npwd\n```\n\n你应该会看到你位于 `home`，然后是你的用户名（如我的 `markjprice`），然后是你刚创建的新目录：\n\
  \n```\n/home/markjprice/bash-chapter\n```\n\n在 WSL 终端中，运行：\n\n```\nls -la\n```\n\
  \n如果你完成了 Bash 练习，在 WSL 终端中，你可以运行：\n\n```\nexit\n```\n\n在 Windows 文件资源管理器中，你可以使用\
  \ Linux 节点查看你的 WSL 安装，如 *图 10.2* 所示：\n\n![](img/B34553_10_02.png)\n\n图 10.2：Windows\
  \ 文件资源管理器及其 WSL 集成\n\n这些命令的行为与本章描述的完全一致。\n\n现在让我们通过学习一些常见的基本命令将这些背景知识付诸实践。\n\n#\
  \ 基本命令\n\n在编写脚本或自动化任何事情之前，你需要一小套日常命令词汇。这些是你在处理项目、遵循教程或从终端调试问题时将持续使用的命令。你不需要记住每个选项。知道每个命令的用途比知道它支持的每个标志要重要得多。\n\
  \n我们将在本章中使用的核心命令有：\n\n*   `pwd` – 打印当前工作目录\n*   `ls` – 列出文件和目录\n*   `cd` – 更改当前目录\n\
  *   `mkdir` – 创建新目录\n*   `touch` – 创建空文件\n*   `cp` – 复制文件和目录\n*   `mv` – 移动或重命名文件和目录\n\
  *   `rm` – 删除文件和目录\n*   `cat` – 打印文件内容\n*   `echo` – 向终端输出文本\n\n\n\n\n## 导航命令\n\n\
  让我们先专注于 `pwd`、`ls` 和 `cd` 这三个命令。一旦导航变得自然，其余命令就更容易理解了。\n\n### pwd – 打印工作目录\n\n`pwd`\
  \ 告诉你在文件系统中的位置。这很重要，因为大多数命令都是相对于当前目录运行的：\n\n```\npwd\n```\n\n典型输出可能如下所示：\n\n```\n\
  /Users/mark/projects/my-site\n```\n\n每当命令因*文件未找到*而失败时，`pwd` 通常是首先要检查的东西。许多问题最终被证实是因为在错误的目录中运行了命令。\n\
  \n### ls – 列出目录内容\n\n`ls` 显示当前目录中存在哪些文件和文件夹。常用选项包括用于详细列表的 `-l` 和用于显示隐藏文件的 `-a`：\n\
  \n```\nls -la\n```\n\n**提示**：当我在终端输入像 `ls -la` 这样的命令时，会逐步发生什么？\n\n隐藏文件通常以点开头，例如\
  \ `.git` 或 `.env`，在开发项目中很常见。\n\n**提示**：Unix 系统中的隐藏文件是什么，为什么它们以点开头？\n\n### cd – 更改目录\n\
  \n`cd` 更改你的当前工作目录。例如，要进入一个名为 `src` 的文件夹：\n\n```\ncd src\n```\n\n要上升一级，请使用：\n\n```\n\
  cd ..\n```\n\n要返回主目录：\n\n```\ncd ~\n```\n\n熟练使用 `cd` 至关重要，因为几乎所有其他操作都取决于身处正确的位置。\n\
  \n**提示**：请使用目录树示例解释 Bash 中的相对路径与绝对路径。\n\n## 创建事物\n\n现在让我们看看创建目录或文件的两个命令。\n\n###\
  \ mkdir – 创建目录\n\n`mkdir` 创建一个新目录：\n\n```\nmkdir scripts\n```\n\n你可以使用 `-p` 一次性创建嵌套目录：\n\
  \n```\nmkdir -p app/static/css\n```\n\n这在设置项目结构时很常见。\n\n### touch – 创建文件\n\n如果文件不存在，`touch`\
  \ 会创建一个空文件：\n\n```\ntouch app.py\n```\n\n如果文件已存在，`touch` 只会更新其时间戳。开发人员经常用它来快速创建占位文件。\n\
  \n## 移动、复制和删除\n\n你经常需要移动、复制或删除文件系统项目。\n\n### cp – 复制文件和目录\n\n`cp` 将文件从一个位置复制到另一个位置：\n\
  \n```\ncp settings.example.json settings.json\n```\n\n要复制目录及其内容，请使用 `-r`（递归）选项：\n\
  \n```\ncp -r templates templates_backup\n```\n\n### mv – 移动或重命名文件\n\n`mv` 移动文件或目录。它也用于重命名：\n\
  \n```\nmv old_name.py new_name.py\n```\n\n或者：\n\n```\nmv build/ dist/\n```\n\n没有单独的重命名命令。重命名只是在同一目录内的移动。\n\
  \n### rm – 删除文件和目录\n\n`rm` 删除文件：\n\n```\nrm debug.log\n```\n\n要删除目录及其内部的所有内容，请使用\
  \ `-r`：\n\n```\nrm -r temp/\n```\n\n此命令不会将文件发送到回收站。一旦删除，通常就找不回来了。这是开发人员敬畏 `rm -r`\
  \ 的原因之一。\n\n**提示**：为什么 `rm` 默认不请求确认，经验丰富的开发人员如何保持安全？\n\n## 显示文本\n\n最后，让我们看看如何将文件或字符串输出到控制台。\n\
  \n### cat – 显示文件内容\n\n`cat` 将文件内容打印到终端：\n\n```\ncat README.md\n```\n\n它适用于快速检查小型文本文件、配置文件或日志，而无需打开编辑器。\n\
  \n### echo – 打印文本\n\n`echo` 将文本输出到终端：\n\n```\necho \"Hello, Bash\"\n```\n\n它常用于脚本中以显示进度消息，或测试变量和命令输出。\n\
  \n这些命令构成了你在 Bash 中几乎所有操作的基础。一旦它们变得熟悉，阅读基于 Shell 的说明就会变得容易得多，编写简单的脚本也会开始变得自然。\n\n\
  ## 处理 Web 资源\n\n现在让我们看看一些网络命令。\n\n### curl – 从服务器传输数据或向服务器传输数据\n\n`curl` 用于从命令行发起\
  \ HTTP 请求。它常用于下载数据、测试 API 或与 Web 服务交互：\n\n```\ncurl https://example.com\n```\n\n\
  这会获取 URL 的内容并将其打印到终端。\n\n要将响应保存到文件，请使用 `-o` 选项：\n\n```\ncurl -o index.html https://example.com\n\
  ```\n\n你也可以发送数据，例如在使用 API 时：\n\n```\ncurl -X POST -d \"name=Mark\" https://example.com/api\n\
  ```\n\n开发人员经常使用 `curl` 来调试 API、检查响应或在脚本中自动化请求。\n\n### wget – 从 Web 下载文件\n\n`wget`\
  \ 专为从互联网下载文件而设计。它特别适合将文件直接保存到磁盘：\n\n```\nwget https://example.com/file.zip\n```\n\
  \n这会下载文件并使用其原始名称保存。\n\n要使用不同的名称保存，请使用 `-O`：\n\n```\nwget -O archive.zip https://example.com/file.zip\n\
  ```\n\n与 `curl` 不同，`wget` 专注于下载，并可以恢复中断的下载，这对于大文件很有用。\n\n让我们通过编写一个简单的脚本将所有内容串联起来。\n\
  \n## 编写简单脚本\n\n到目前为止，你一直在终端中一次输入一条命令。Bash 脚本只是将一系列命令保存到文件中并一起运行的一种方式。每当你发现自己一遍又一遍地重复相同的步骤，或者想要以计算机可执行的形式记录一个过程时，这很有用。\n\
  \n例如，假设你一直在使用 Django，并发现自己反复按顺序运行相同的三个命令：\n\n1. 更改到项目目录：\n\n```\ncd project\n```\n\
  \n2. 激活虚拟环境：\n\n```\nsource .venv/bin/activate\n```\n\n3. 运行 Web 服务器：\n\n```\npython\
  \ manage.py runserver\n```\n\n如果你创建一个名为 `run_dev.sh` 的脚本文件，其中包含这三个命令，那么三个步骤就变成了一个：\n\
  \n* 运行脚本：\n\n```\n./run_dev.sh\n```\n\n脚本用单个命令取代了重复的输入。\n\n### 脚本文件\n\nBash 脚本只是一个纯文本文件。按照惯例，它通常具有\
  \ `.sh` 扩展名，尽管从技术上讲扩展名并非必需。让我们从一个最小示例开始。\n\n创建一个名为 `run_dev.sh` 的新文件：\n\n```\ntouch\
  \ run_dev.sh\n```\n\n在 VS Code 中打开它并添加以下命令：\n\n```\n#!/usr/bin/env bash\necho \"\
  Starting development environment...\"\npython manage.py runserver\n```\n\n第一行称为\
  \ **shebang**（shebang 行）。它告诉操作系统应使用哪个程序来运行该文件。在本例中，它指定使用 `Bash`。`env` 形式是首选，因为它适用于\
  \ Bash 可能位于略微不同位置的不同系统。\n\n其余行只是普通的 Bash 命令，完全就像你手动在终端中输入它们一样。\n\n**提示**：请解释 Bash\
  \ 脚本中的 shebang 行，以及为什么推荐使用 `/usr/bin/env bash`。\n\n### 使脚本文件可执行\n\n在运行脚本之前，你需要使其可执行：\n\
  \n```\nchmod +x run_dev.sh\n```\n\n如果你忘记此步骤并尝试运行脚本，通常会看到如下错误：\n\n```\n$ ./run_dev.sh\n\
  bash: ./run_dev.sh: Permission denied\n```\n\n发生这种情况是因为文件存在，但操作系统没有权限将其作为程序执行。使用\
  \ `chmod +x` 添加执行权限即可解决此问题。\n\n现在你可以这样运行它：\n\n```\n./run_dev.sh\n```\n\n\n\n\n`./`\
  \ 路径前缀很重要。它告诉 Bash 在当前目录中查找脚本，而不是搜索同名的系统命令。\n\n**提示**：`chmod +x` 在操作系统层面实际上改变了什么？\n\
  \n此时，你已经学到了重要的一点：脚本在你一直在交互式使用的同一个 shell 环境中运行。如果你的脚本失败了，其中的命令如果你手动输入也大概率会失败。这让调试变得不那么神秘了。\n\
  \n## 为脚本添加逻辑\n\n你可以添加简单的逻辑使脚本更有用。例如，变量让你避免硬编码值，比如将 `PORT` 变量设为 `8000`，然后在命令中用 `$PORT`\
  \ 引用它：\n\n```\n#!/usr/bin/env bash\nPORT=8000\necho \"Starting server on port $PORT\"\
  \npython manage.py runserver \"$PORT\"\n```\n\n在某些系统上，你可能需要使用 `python3` 而不是 `python`。\n\
  \n你也可以在出错时停止脚本。下面这行告诉 Bash 如果任何命令失败则立即退出：\n\n```\nset -e\n```\n\n放在脚本顶部附近，这能防止后续命令在损坏的状态下运行，这在构建或部署脚本中特别有用。\n\
  \n为编写更安全的脚本，请使用完整的安全前导代码：\n\n```\nset -euo pipefail\n```\n\n注意上述命令的以下几点：\n\n*  \
  \ `-e`：如果任何命令失败则立即退出\n*   `-u`：如果使用未定义的变量则退出（这能捕获拼写错误）\n*   `-o pipefail`：如果管道中的任何命令失败，则管道失败\n\
  \n这种组合能防止整整一类微妙的 bug。请将其放在每个脚本的顶部附近。\n\n**提示**：为什么我在使用 `set -e` 时 Bash 脚本会提前退出？\n\
  \n一个简单但现实的脚本可能会组合多个任务：\n\n```\n#!/usr/bin/env bash\nset -e\necho \"Cleaning old\
  \ files...\"\nrm -rf dist/\necho \"Running tests...\"\npython manage.py test\necho\
  \ \"Starting server...\"\npython manage.py runserver\n```\n\n这里没有什么复杂的，但将这些步骤放入脚本意味着它们总是以相同的顺序、以相同的方式运行，每次都是如此。这种一致性才是\
  \ shell 脚本的真正价值。\n\n你不需要把 Bash 变成你的主要编程语言。把脚本当作胶水。它们连接工具、强制执行流程、节省脑力。\n\n## 始终给变量加引号\n\
  \nBash 中未加引号的变量可能导致 bug 和安全问题：\n\n```\n# If NAME contains spaces:\nNAME=\"John Smith\"\
  \necho Hello, $NAME     # Bash sees: echo Hello, John Smith (3 args)\necho \"Hello,\
  \ $NAME\"   # Bash sees: echo \"Hello, John Smith\" (1 arg)\n```\n\n在 Bash 中，未加引号的\
  \ `$VAR` 会进行单词拆分。如果值包含空格，Bash 会将其拆分为多个参数。好的做法是使用 `\\\"$VAR\\\"` 来防止这种情况：\n\n```\n\
  FILE=\"my document.txt\"\nrm \"$FILE\"    # Correct: deletes \"my document.txt\"\
  \nrm $FILE      # Bug: tries to delete \"my\" and \"document.txt\"\n```\n\n这是 Bash\
  \ 脚本中最常见的 bug 来源。\n\n## 脚本参数\n\n到目前为止，你见到的脚本都只以一种方式做一件事。当 Bash 脚本能从命令行接受输入时，它们会变得更有用。\n\
  \n传递给脚本的参数可作为编号变量获取。`$1` 指第一个参数，`$2` 指第二个，以此类推。\n\n创建一个名为 `hello.sh` 的文件：\n\n```\n\
  #!/usr/bin/env bash\nNAME=\"$1\"\necho \"Hello, $NAME\"\n```\n\n使其可执行并运行它：\n\n```\n\
  chmod +x hello.sh\n./hello.sh Mark\n```\n\n这种模式无处不在，从小型工具脚本到大型部署工具。它让一个脚本无需修改就能处理许多相似的任务。\n\
  \n## 相对路径和绝对路径\n\nBash 脚本中的路径工作方式与在终端中相同。相对路径从当前工作目录解析，而不是从脚本本身的位置解析。\n\n这意味着以下脚本的行为可能因运行位置不同而异：\n\
  \n```\nrm data/output.txt\n```\n\n如果你想要可预测的行为，请使用绝对路径，或在脚本开头显式切换目录：\n\n```\ncd /Users/mark/projects/my-site\n\
  ```\n\n尽早理解这一点能避免一类常见 bug：脚本在一个人那里能跑通，在另一个人那里却失败。\n\n**提示**：为什么运行同一条 Bash 命令有时在一个目录下能成功，在另一个目录下却失败？\n\
  \n## 脚本中的注释\n\nBash 脚本使用 `#` 字符支持注释。一行中 `#` 后面的内容会被 Bash 忽略：\n\n```\n# Clean old\
  \ build files\nrm -rf dist/\n```\n\n注释解释意图，这往往比解释语法更重要。没有注释，你今天能看懂的脚本六个月后可能会让你困惑。\n\
  \n## Bash 作为胶水\n\nBash 不替代其他语言或工具。它连接它们。\n\n一个脚本可能会依次调用 Git、Docker、Python 和 Web\
  \ 服务器。Bash 不关心工具是用什么语言写的。只要能从命令行运行，Bash 就能编排它。\n\n这就是为什么即使出现新语言和新框架，Bash 依然相关。它处于工具之间的边界，让它们协同工作。\n\
  \n## 安全提示\n\nBash 脚本可以更改或删除文件、停止服务、部署代码。它们通常严格按指示执行，不会请求确认。\n\n在运行非自己编写的脚本前，请先阅读它。对于从网上复制或由\
  \ AI 工具生成的脚本，这一点尤为重要。对待 shell 脚本应像对待来自未知来源的可执行文件一样谨慎。\n\n**提示**：Bash 脚本中常见的新手错误有哪些，如何发现它们？\n\
  \n# 自动化你的 Django 开发\n\n到目前为止，示例都很小且聚焦。现在让我们将 Bash 直接连接到你已经做过的事情：运行 Django 项目。\n\n\
  在上一章中，你反复运行了一系列命令：\n\n1.  创建或激活虚拟环境\n2.  安装依赖\n3.  应用数据库迁移\n4.  启动开发服务器\n\n每次都输入这些命令既重复又容易出错。这正是\
  \ Bash 脚本要简化的任务类型。\n\n## 问题在于重复\n\n典型的 Django 设置会话可能如下所示：\n\n```\npython -m venv\
  \ .venv\nsource .venv/bin/activate\npip install -r requirements.txt\npython manage.py\
  \ migrate\npython manage.py runserver\n```\n\n这里没有什么复杂的。但你运行这个序列的频率足够高，以至于它变成了阻力。\n\
  \n## 解决方案是 shell 脚本\n\n在你的 Django 项目根目录下创建一个新文件：\n\n```\ntouch run_dev.sh\n```\n\
  \n在代码编辑器中打开它并添加以下内容：\n\n```\n#!/usr/bin/env bash\nset -euo pipefail\necho \"Setting\
  \ up Django development environment...\"\n# Create virtual environment if it does\
  \ not exist\nif [ ! -d \".venv\" ]; then\n  echo \"Creating virtual environment...\"\
  \n  python -m venv .venv\nfi\n# Activate virtual environment\necho \"Activating\
  \ virtual environment...\"\nsource .venv/bin/activate\n# Install dependencies\n\
  if [ -f \"requirements.txt\" ]; then\n  echo \"Installing dependencies...\"\n  pip\
  \ install -r requirements.txt\nelse\n  echo \"No requirements.txt found, skipping\
  \ install\"\nfi\n# Apply database migrations\necho \"Running migrations...\"\npython\
  \ manage.py migrate\n# Start development server\necho \"Starting Django development\
  \ server...\"\npython manage.py runserver\n```\n\n使脚本可执行：\n\n```\nchmod +x run_dev.sh\n\
  ```\n\n现在，你不需要运行五条命令，只需运行一条：\n\n```\n./run_dev.sh\n```\n\n这个脚本没有做任何新事情。它只是让你的例行操作变得显式且可重复：\n\
  \n1.  它在创建前检查 `.venv` 是否存在\n2.  它激活环境\n\n\n\n3. 仅当存在 `requirements.txt` 文件时，才会安装依赖。\n\
  \n4. 每次都会应用迁移。\n\n5. 启动服务器。\n\n每一步都是你之前手动执行的操作。\n\n## 为什么自动化脚本很重要\n\n你编写代码不是为了代码本身。你是在捕获一个流程：\n\
  * 这就是该项目应该启动的方式。\n\n这有几个好处：\n\n* 你不会忘记步骤。\n* 你能避免微妙的环境问题。\n* 你减少了输入和细微错误。\n* 你让阅读项目的其他人一目了然地了解工作流程。\n\
  \n如果其他人克隆你的仓库，他们不需要像“运行这五条命令”这样的说明。他们只需运行：\n\n```\n./run_dev.sh\n```\n\n## 为服务器添加可配置端口\n\
  \n你可以通过接受端口号让脚本更灵活一些：\n\n```\nPORT=\"${1:-8000}\"\necho \"Starting server on port\
  \ $PORT...\"\npython manage.py runserver \"$PORT\"\n```\n\n现在你可以运行：\n\n```\n./run_dev.sh\
  \ 5000\n```\n\n或者回退到默认值：\n\n```\n./run_dev.sh\n```\n\n这是 Bash 在项目中的典型用法：获取一个你已知的设置流程并将其保存为脚本。\n\
  \n**良好实践**：此脚本假设为类 Unix 环境（Linux、macOS 或 Windows 上的 WSL）。在没有 WSL 的原生 Windows 上，激活使用不同的路径（`.venv\\\
  Scripts\\activate`）。在实际项目中，团队通常提供单独的脚本或使用处理跨平台差异的工具。\n\n现在，让我们看看 AI 如何帮助你学习和使用 Shell\
  \ 脚本。\n\n# 使用 AI 获取 Shell 帮助\n\n命令行因不友好而著称，主要是因为错误信息可能很简短，而文档往往假设读者具备先验知识。AI 工具可以让命令行更容易学习。如果使用得当，它们就像一个随需应变的解释器，而不是一个神奇的命令生成器。\n\
  \n结合 Bash 使用 AI 的明智方式是询问某事*为什么*有效或失败，而不仅仅是询问*输入什么*。例如，如果你在文档中看到一个不理解的命令，可以询问：\n\n\
  * 请逐块解释这条 Bash 命令的作用：\n\n```\ndocker run -p 8000:8000 -v $(pwd):/app my-image\n\
  ```\n\n一个好的 AI 回答会将命令拆解为标志、参数和替换，帮助你建立直觉，而不是鼓励盲目复制。\n\n## 语法方面的帮助\n\nAI 对语法提醒也很有帮助。Bash\
  \ 有许多容易忘记的小规则，例如括号周围的空格或变量如何展开。你不必翻阅手册页，而是可以提出有针对性的问题，例如：\n\n* 如何在 Bash 中循环遍历所有\
  \ `.txt` 文件并打印其名称？\n* `set -e` 在 Bash 脚本中有什么作用，何时应避免使用它？\n\n## 错误方面的帮助\n\n当脚本在命令提示符下失败时，粘贴错误信息和一小段相关的脚本片段通常能得到有用的解释：\n\
  \n* 此 Bash 脚本立即以 `permission denied` 退出。为什么？\n* 这是我的脚本和错误输出。哪里出错了？\n\n这特别有效，因为 Bash\
  \ 错误往往是间接的。失败的行不一定是导致问题的行，而 AI 工具擅长发现这些模式。\n\n如果你在 VS Code 等代码编辑器中试运行脚本，甚至不需要复制粘贴到你喜欢的聊天机器人中。GitHub\
  \ Copilot Chat 会自动检查你的活动终端会话，因为终端上下文包含在对话中。它会显示每个打开终端的最后一条命令、工作目录和退出代码。\n\n**提示**：请解释常见的\
  \ Bash 错误信息，如 `permission denied` 或 `command not found`。\n\n## 注意 AI 的上下文有限\n\n\
  话虽如此，也有局限。在网页浏览器中运行的 ChatGPT 和 Gemini 等 AI 聊天机器人无法看到你的文件系统、环境变量或已安装的软件。如果建议的命令删除文件或修改系统状态，它会像人类编写的一样毫不犹豫地执行。请将\
  \ AI 的输出视为建议，而非权威。\n\n带有 GitHub Copilot 的 VS Code、带有 AI Assistant 的 Rider，以及 Claude\
  \ Code 和 OpenAI Codex 等 CLI 工具拥有大量工具来收集上下文，因此在提供动态相关帮助方面要好得多。你将在后续章节中更多地使用它们。\n\n\
  在运行 AI 建议的命令之前，确保你能说出它读取什么、写入什么，以及可能删除或更改什么。如果你无法解释那么多，请先让 AI 拆解该命令。\n\n这使得 AI 作为命令解释器最有用，而不是作为盲目粘贴的命令来源。\n\
  \n**提示**：如何逐步安全地调试 Bash 脚本？\n\n# 练习、参考与资源\n\n在本节中，你将接受本章所学内容的测试，并获得有用的参考资料和资源链接。\n\
  \n## 检查你的理解\n\n回答以下问题，这些问题特意设计为概念性而非死记硬背，鼓励解释而非记忆：\n\n1. Bash 在你和操作系统之间扮演什么角色？\n\
  2. 为什么说 Bash 是有状态的，这如何影响日常命令使用？\n3. 解释终端应用程序和 Bash Shell 之间的区别。\n4. 为什么命令在一个目录中有效，在另一个目录中却会失败？\n\
  5. Bash 脚本解决了手动输入命令无法解决的什么问题？\n6. 脚本顶部的 Shebang 行有什么作用？\n7. 为什么脚本必须标记为可执行才能运行？\n\
  8. `rm -r` 有哪些风险，开发者如何降低这些风险？\n9. 允许脚本接受参数如何使其更灵活？\n10. 使用 AI 工具获取 Bash 帮助有哪些益处和局限？\n\
  \n答案见附录 A：[`github.com/markjprice/web-dev-ai/blob/main/docs/appendix_a.pdf`](https://github.com/markjprice/web-dev-ai/blob/main/docs/appendix_a.pdf)\n\
  \n## 实践练习\n\n编写一个 Bash 脚本，创建一个目录，在其中创建一个文件，向文件写入一行文本，并将文件内容打印到终端。然后用你自己的话解释每一行。\n\
  \n解答见附录 A：[`github.com/markjprice/web-dev-ai/blob/main/docs/appendix_a.pdf`](https://github.com/markjprice/web-dev-ai/blob/main/docs/appendix_a.pdf)\n\
  \n## 参考资料\n\nBash 已有数十年历史，其文档反映了这种成熟度。一些资源侧重参考，另一些侧重教程。了解根据你是学习还是排错而该查阅哪个资源很有用。\n\
  \n### GNU Bash 参考手册\n\n权威来源是 GNU Bash 参考手册。这是 Bash 的规范级文档，作为 GNU 项目的一部分进行维护。你可以在以下链接在线阅读：\n\
  \n[`www.gnu.org/software/bash/manual/bash.html`](https://www.gnu.org/software/bash/manual/bash.html)\n\
  \n这本手册详尽无遗。它用精确的术语解释了 Bash 语法、内置命令、变量、引用规则、重定向、作业控制和脚本功能。你通常不会通读它，但当你需要准确理解某事的行为时，它非常出色。\n\
  \n### Bash 手册页\n\n密切相关的是 Bash `man` 页，即输入以下命令时看到的内容：\n\n```\nman bash\n```\n\n这更简洁，当你只需要关于语法或选项的提醒时，通常更快。对于特定命令的\
  \ `man` 页，输入 `man <command>`，例如：\n\n```\nman ls\nman cd\nman rm\n```\n\n\n\n# Bash\
  \ 资源\n\n前面的命令将为您提供关于各个命令的详细、权威信息。这些 `man` 页面并不总是友好的，但它们准确且无处不在。\n\n## Bash 初学者指南\n\
  \n本指南专注于基础知识和常见模式，是参考手册的良好补充：\n\n[`tldp.org/LDP/Bash-Beginners-Guide/html/`](https://tldp.org/LDP/Bash-Beginners-Guide/html/)\n\
  \n## 高级 Bash 脚本编程指南\n\n尽管名为高级指南，但它被广泛用作实际脚本模式的参考。部分内容带有主观性，但极其详尽：\n\n[`tldp.org/LDP/abs/html/`](https://tldp.org/LDP/abs/html/)\n\
  \n## Explainshell\n\n该工具允许您粘贴一条 Shell 命令，并内联查看每个部分的解释。在阅读文档或 CI 日志中不熟悉的命令时，它特别有用：\n\
  \n[`explainshell.com/`](https://explainshell.com/)\n\n## ShellCheck\n\nShellCheck\
  \ 是一款用于 Shell 脚本的静态分析工具。它会高亮显示常见错误、不安全模式和可移植性问题。即使是经验丰富的 Shell 用户也依赖它：\n\n[`www.shellcheck.net/`](https://www.shellcheck.net/)\n\
  \n## 总结\n\n在本章中，您学习了 Bash 如何融入开发者的日常工作。具体来说：\n\n- Bash 是什么，以及它如何作为 Unix Shell 和命令语言发挥作用\n\
  - 如何使用 `cd`、`ls` 和 `pwd` 等核心命令从命令行导航文件系统\n- 如何从终端安全地创建、复制、移动和删除文件和目录\n- 如何使用 `cat`\
  \ 和 `echo` 等命令检查文件内容并生成输出\n- 如何编写简单的 Bash 脚本来自动化一系列命令\n- 如何在 Bash 脚本中使用变量和命令行参数\n\
  - 如何使用 AI 工具理解 Shell 命令并调试脚本，而不是盲目复制它们\n\n主要教训是 Bash 为您提供了一种控制开发环境的方式。命令很重要，但更重要的是在运行它们之前知道它们会做什么。\n\
  \n在下一章中，您将使用这些命令行技能来设置一个完整的 Web 开发项目以及所需的工作环境。\n\n## 获取本书的 PDF 版本及更多内容\n\n扫描二维码（或访问\
  \ packtpub.com/unlock）。按名称搜索本书，确认版本，然后按照页面上的步骤操作。\n\n![](img/Unlock.png)![](img/Unlock-01.png)\n\
  \n> **注意：** 请保留好您的发票。直接从 Packt 购买的不需要发票。\n"
- '# 第 3 部分：调查项目


  在本书的第三部分中，您将把所有内容整合到一个完整的项目中。您将构建一个包含前端界面、后端逻辑和工作数据库的调查应用程序。目标是超越孤立的示例，了解当所有部分连接在一起时，真实系统的行为方式。


  AI 在整个构建过程中被使用，帮助生成代码、建议方法并加速重复性任务。同时，您需要阅读、质疑并改进 AI 产生的内容。在本部分结束时，您将拥有一个可工作的应用程序，并获得更多实践来判断
  AI 输出何时有用、错误或需要更改。


  本部分包含以下章节：


  - 第 11 章，设置项目环境

  - 第 12 章，单元、集成和端到端测试

  - 第 13 章，指定并构建初始项目

  - 第 14 章，使用规格驱动开发添加项目功能

  - 第 15 章，部署到公共服务器

  '
- "## 第 11 章：设置项目环境\n\n本书的最后一部分从学习前端和后端 Web 开发的单个技术转向在一个实际项目中应用它们。您将设计并构建一个名为 `TallyApp`\
  \ 的完整 Web 应用程序，这是一个小型的调查和投票应用程序，而不是孤立的示例。\n\n该项目的范围被刻意限定为足够小以便端到端理解，但又足够丰富，让人感觉像是一个您可以合理扩展或部署的东西。在本章中，我们将通过安装和配置开发工具来启动\
  \ TallyApp 项目。\n\n作为名词，*tally* 是对项目、事件或投票的持续计数或记录。它通常指通过逐步增加计数达到的总数。例如，*the final\
  \ tally of votes* 意味着完成的计数。作为动词，*tally* 意为计数或将项目添加到运行总计中。它也可以意味着一致或对应。例如，*the numbers\
  \ do not tally* 意味着它们不匹配。\n\n在本章结束时，您将已配置好带有 GitHub Copilot 的开发环境，使用 Docker 设置一致且可重复的环境，并学会如何使用\
  \ Git 将代码置于版本控制之下，以便您有信心开始构建功能。\n\n本章关注于了解哪个工具解决哪个问题。Copilot 在您编写和审查代码时提供帮助。Docker\
  \ 为每个人提供相同的运行时。Git 记录项目历史，以便您可以无畏地尝试更改。在添加 TallyApp 功能之前，您将使用所有这三种工具。\n\n在本章中，我们将涵盖以下主题：\n\
  \n- TallyApp 简介\n- 将 GitHub Copilot 配置为您的编码助手\n- 用于一致服务器设置的 Docker\n- 使用 Git 进行源代码版本控制\n\
  \n本章的建议聊天机器人提示词及示例响应可在以下链接找到：\n\n[`github.com/markjprice/web-dev-ai/blob/main/prompts/ch11-env/readme.md`](https://github.com/markjprice/web-dev-ai/blob/main/prompts/ch11-env/readme.md)\n\
  \n### TallyApp 简介\n\nTallyApp 是一个具有三个明确功能领域的调查和投票应用程序。\n\n1. 首先，它允许经过身份验证的用户设计和发布调查。这包括定义不同类型的问题，例如多项选择和自由文本回答，并生成可与受访者共享的公共链接。\n\
  2. 其次，它为参与调查的人提供简洁、专注的体验，他们可以点击链接、回答问题并提交回答，而无需账户。\n3. 第三，它为调查创建者提供分析结果的工具，使用图表和结构化数据视图来探索趋势和个别答案。\n\
  \n在接下来的章节中，您将逐步使用 AI 编码助手设置开发环境，然后指定、构建和改进 TallyApp。同样重要的是，这些章节展示了真实 Web 项目是如何开发的。您将做出设计决策，重新审视早期选择，并了解后端逻辑、前端展示和数据分析如何结合在一起。\n\
  \n在 TallyApp 项目结束时，您不仅将学习 Web 框架和语言的个别特性。您将构建并理解一个完整、可工作的 Web 应用程序，并将处于更有利的位置来设计属于您自己的应用程序。\n\
  \n### 关于过度依赖 AI 的警告\n\nAnthropic 在其文章《AI 协助如何影响编码技能的形成》中发出了警告：[`www.anthropic.com/research/AI-assistance-coding-skills`](https://www.anthropic.com/research/AI-assistance-coding-skills)。\n\
  \nAnthropic 研究人员进行了一项涉及 52 名软件开发人员的随机对照试验。\n\n所有参与者都有 Python 的常规经验，但不熟悉一个名为 Trio\
  \ 的特定异步库。他们被随机分配到两组：\n\n\n\n# 研究：AI 辅助与学习成果\n\n**AI 辅助组**：参与者可以在任务期间使用 AI 编码助手。\n\
  \n**对照组**：参与者没有 AI 辅助，但可以使用文档和网络搜索。\n\n每位参与者使用 Trio 完成了两个功能构建任务。完成后，他们都参加了一个测验，旨在衡量他们刚才所用概念的掌握程度。测验涵盖了调试、代码阅读、代码编写和概念理解。\n\
  \n## 关键发现\n\n* 平均而言，使用 AI 的开发者在任务后测验中的得分（约 50%）显著低于未使用 AI 编码的开发者（约 67%）。这代表了 17%\
  \ 的差距，大致相当于典型学术环境中的两个等级。\n* 在调试和概念理解问题上观察到的差异最大，表明 AI 使用与这些技能的较弱掌握相关。\n* AI 辅助组完成编码任务仅略快一些，但这种时间差异在统计学上不显著。\n\
  * 定性分析显示，一些参与者花费大量时间编写 AI 提示词（在某些情况下高达总时间的 30%），这侵蚀了潜在的效率提升。\n\n## 研究者结论\n\n* 当人们习得一项新的、陌生的技能时，AI\
  \ 辅助可能会削弱学习效果。依赖助手生成和调试代码似乎会减少构建深度理解所需的认知努力。\n* 并非所有 AI 使用都相同。一些主要利用 AI 提出概念问题或在生成代码的同时请求解释的参与者，其表现与对照组非常接近。那些卸载了并从社交动态中拉取趋势信息的人；通常与表情包相关\
  \ |\n\n表 11.1：各公司的 AI 聊天机器人和编码工具\n\n像 ChatGPT、Gemini、Claude、Perplexity 或 Grok 这样的聊天机器人主要专注于自然语言交互。它们处理写作、摘要、通用研究，也可以支持编码查询，但编码辅助只是众多任务之一。它们最适合作为代码和框架学习导师使用。\n\
  \n像 GitHub Copilot、Codex 或 Cursor 这样的 AI 编码助手针对开发者工作流进行了优化。它们与代码编辑器和 IDE 集成，建议补全、生成特定项目的代码，并可协助调试和测试。\n\
  \nGitHub Copilot 允许你在多个编码 AI 模型之间选择。例如，Copilot 本身、Anthropic 的 Claude 和 OpenAI 的\
  \ Codex。这意味着你不被锁定在单一模型中；你可以选择最适合你任务的代理。\n\nOllama 和类似的本地 LLM 框架让你可以在本地桌面或服务器硬件上运行各种\
  \ LLM。像 `Qwen3-Coder`、`StarCode2`、`Codestral`、`Devastral` 等模型是开源的，并针对编码任务进行了优化。你可以通过\
  \ Ollama 在本地运行它们，而无需将数据发送到云端。\n\n如果你关心数据隐私、离线使用、完全控制和避免云 API，那么你需要像 Ollama 这样的本地\
  \ LLM 框架，搭配开源编码模型。**自带密钥（BYOK）** 模型支持是一个快速发展的功能集，某些功能在聊天、内联聊天和补全之间可能有所不同。\n\n如果你想最轻松地开始，请使用\
  \ Copilot Free（云端）。你无需配置任何密钥即可获得每月额度。\n\n如果你想要最佳质量且不介意 API 费用，请保留 Copilot 模型用于日常编码，并可选择添加你的\
  \ OpenAI API 密钥，以便在需要时使用特定供应商的模型。\n\n如果你想避免按请求付费并保持数据本地化，请运行 Ollama 并通过 VS Code\
  \ 的模型管理选择它，以便 Copilot Chat 可以使用本地模型完成许多任务。\n\n我写了一篇纯在线文章，详细介绍本地模型的使用：`https://github.com/markjprice/markjprice/blob/main/with-ai/local-models.md`\n\
  \n本地设置在特定领域表现更好：\n\n* **隐私**：代码不离开你的机器。适用于专有或敏感工作\n* **成本（长期）**：无按 Token 计费。大量使用随时间变得更便宜\n\
  * **延迟**：小模型即时响应。无网络依赖\n* **控制**：你可以微调。你可以自定义行为\n\n一个实用的设置是同时使用云端和本地模型，但用于不同的工作：\n\
  \n* 当你需要更强的推理能力、更大的上下文或帮助比较设计方案时，使用云端模型\n* 当任务较小、私密或重复时，使用本地模型：解释语法、起草辅助函数、重构单个文件或草拟测试\n\
  \n**良好实践**：如果任务需要判断而不仅仅是生成，请使用云端模型。\n\n## 配置 GitHub Copilot\n\n\n\n# GitHub Copilot\
  \ 设置与配置\n\n在本节结束时，您将在 VS Code 中运行 GitHub Copilot，用于内联补全和聊天。您还将配置第二条路径，以便 Copilot\
  \ Chat 可以使用：\n\n* 内置 Copilot 模型（如果您符合条件，包括免费计划）\n* 您自己的模型提供商，包括本地 Ollama 模型，以避免每次请求的\
  \ API 成本\n\nVS Code 的 `BYOK` 模型支持是 Copilot Chat 能够由第三方提供商（包括用于本地模型的 Ollama）提供支持的部分方式。\n\
  \n## 先决条件\n\n* 已安装 VS Code\n* 一个可从 VS Code 登录的 GitHub 账户。您可以通过以下链接注册：[`docs.github.com/en/get-started/start-your-journey/creating-an-account-on-github`](https://docs.github.com/en/get-started/start-your-journey/creating-an-account-on-github)\n\
  * 选择以下选项之一：\n    * GitHub Copilot 免费计划（无需 API 密钥）\n    * OpenAI API 密钥或另一个受支持的提供商密钥用于\
  \ BYOK\n    * 本地模型运行时，如 Ollama，用于本地推理\n\n`警告！` GitHub Copilot 内联建议（您按 `Tab` 接受的自动补全）与\
  \ `Copilot Chat` 并非同一事物。VS Code 的 BYOK 模型系统主要是关于使用不同的模型提供商来支持聊天和编辑体验。某些 BYOK 功能可能不以相同方式适用于补全。请将本地模型支持视为以聊天为主（和以编辑为主）的路径，而非每个\
  \ Copilot 功能的保证替代品。\n\n## 在 VS Code 中安装并登录 Copilot\n\n1. 打开 VS Code，通过点击状态栏中的 Copilot\
