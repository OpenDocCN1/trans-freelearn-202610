  \ 代码文件链接的 Copilot*\n\n## 审查样式表和图形\n\n### 静态文件：CSS 和图片\n\n在 `static` 文件夹中，打开 `css`\
  \ 和 `img` 文件夹中的文件：\n\n* `site.css` 包含整个网站的 CSS 样式。你理解这些规则是如何工作的吗？回顾 *第 3 章* *CSS\
