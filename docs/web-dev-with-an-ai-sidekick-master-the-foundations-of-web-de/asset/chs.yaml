  * Copilot CLI 课程：`https://github.com/github/copilot-cli-for-beginners`\n\n## 总结\n\
  \n在本章中，您从学习分散的 Web 开发技能进阶到构建 TallyApp 的第一个版本。\n\n您学习了以下内容：\n\n* 为实际 Web 应用程序定义了清晰的范围，包括明确的目标、目标用户和非目标，以防止功能蔓延\n\
