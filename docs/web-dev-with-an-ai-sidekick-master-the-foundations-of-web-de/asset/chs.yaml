  \n> **Prompt**: If TallyApp grows to 1 million responses per survey, what architectural\
  \ changes are needed? How to evolve TallyApp into a multi-tenant SaaS product?\n\
  \n# Most Interesting Design Decision in TallyApp\n\nIf there is one place in TallyApp\
  \ where database design truly matters, it is how survey answers are modeled. The\
  \ rest of the system is relatively straightforward.\n\nThe difficulty stems from\
  \ a simple fact: not all questions are the same.\n\nTallyApp currently supports\
  \ three question types:\n\n- Single-choice multiple choice\n- Multi-choice multiple\
  \ choice\n- Free-text questions\n\nAt first glance, you might want a flexible `Answer`\
  \ model with a few nullable fields to store everything. For example:\n\n- `selected_choice`\
  \ field for single-choice questions\n- `selected_choices` many-to-many field for\
  \ multi-choice questions\n- `text_value` field for text questions\n\nThis works,\
  \ but forces you to think carefully about data integrity. You must ensure:\n\n-\
  \ Single-choice questions never store multiple choices\n- Multi-choice questions\
  \ can store multiple choices\n- Text questions never reference choices\n- Choice-based\
  \ questions never substitute free text for choices\n\nThe model must encode rules\
  \ that reflect the application's business logic.\n\nThis is exactly where the relationals\
  \ aren't a flat JSON blob; they are a set of structured answers, each linked to\
  \ a question. This makes aggregation, filtering, and reporting much easier.\n3.\
  \ Third, it highlights future extensibility. If you later decide to add rating-scale\
  \ questions or numeric input questions, your model already has clear extension points.\n\
  \nThere is also an important architectural lesson here: the data model defines what\
  \ is possible. If you or your AI model answer hastily, you will struggle later when\
  \ implementing features like aggregation counts, filtering by question, validation\
  \ rules, export functionality, and performance optimization.\n\nIn fact, many real-world\
  \ systems that outgrow their capacity do so because their early data models were\
  \ too simple.\n\n> **Prompt**: Deeply explain why modeling survey answers is the\
  \ most critical architectural decision in TallyApp. Show three different database\
  \ designs for handling single-choice, multi-choice, and text answers, and compare\
  \ trade-offs. How does a senior engineer review AI-generated Django models?\n\n\
  Finally in this chapter, we will learn about the Codex GUI app released for Mac\
  \ in February 2026 and for Windows in March 2026.\n\n# Interactive Development with\
  \ Codex App\n\nSo far in this chapter, you have used one-shot prompts to generate\
  \ a complete project scaffold. This technique is efficient but remains primarily\
  \ text-based. You describe what you want, the AI generates code, and then you review\
  \ it.\n\n**Codex App** introduces a different way of working. Instead of only describing\
  \ the system through text, you can interact with the running application and give\
  \ feedback directly on what you see.\n\nThis becomes especially useful once TallyApp\
  \ is running locally and you shift from *building structure* to *refining behavior\
  \ and UI*.\n\nYou can learn more about Codex App in the official documentation:\
  \ [`developers.openai.com/codex/app`](https://developers.openai.com/codex/app)\n\
  \n## Capabilities Added by Codex App\n\nCodex App is a graphical interface for AI-assisted\
  \ development. It runs alongside your editor and local development environment,\
  \ allowing you to:\n\n- Chat with the model about the codebase\n- Run commands and\
  \ inspect output\n- Work with files and generated code\n- Interact with a live preview\
  \ of the app\n\nThe key difference from the earlier workflow in this chapter: the\
  \ AI no longer works only from description. It can be guided by the actual running\
  \ UI.\n\nThis reduces a common problem in AI-assisted development: vague instructions\
  \ like \"make it look better\" or \"fix the layout\" often produce inconsistent\
  \ results.\n\n## Browser-Based Interaction for UI Work\n\nOne of the most useful\
  \ features of Codex App is its ability to interact directly with a running web app\
  \ via a built-in browser panel. This makes web UI work feel more like \"point at\
  \ the screen and say: change this.\"\n\nOnce your Django development server is running,\
  \ you can connect Codex App to the local site:\n\n1. Start a chat with your preferred\
  \ model\n2. Launch the Django development server (e.g., `python manage.py runserver`)\n\
  3. Open the browser panel in Codex App\n\n\n\n\n## 浏览器交互\n\n4. 导航到您的本地站点（例如，`http://127.0.0.1:8000`）\n\
  \n5. 使用浏览器工具检查和标注 UI\n\n浏览器面板包含以下功能：\n\n* 对当前页面进行截图\n* 向特定 UI 元素添加标注\n* 将这些带标注的截图直接发送到聊天中\n\
  \n当您点击按钮、表单或布局元素并附加评论时，模型会同时接收视觉上下文（截图）和与特定 UI 部分关联的指令。\n\n例如：\n\n```\nThis button\
  \ is too small and blends into the background. Make it more prominent and consistent\
  \ with the primary action style.\n```\n\n这比仅用文字描述问题要精确得多。\n\n在前面的章节中，您了解了在生成代码之前定义行为和结构的重要性。UI\
  \ 优化面临类似的挑战：用语言描述视觉问题往往不够精确。\n\n浏览器交互功能从三个方面改进了这一点：\n\n1. **共享上下文**：AI 看到的正是您所看到的，而不是从模板和\
  \ CSS 推断布局。\n2. **针对性更改**：反馈附加到特定元素，而不是对页面的模糊描述。\n3. **更快的迭代**：您可以快速尝试更改、审查它们，并再次优化，而无需重写冗长的提示词。\n\
  \n这避免了您凭记忆描述布局问题。\n\n## TallyApp 示例步骤\n\nTallyApp 项目在本地运行后，您可以使用以下步骤：\n\n1. 在 Codex\
  \ 浏览器面板中打开主页。\n2. 点击**创建调查**按钮。\n3. 添加标注，如*图 13.15*所示：\n\n```\nThis should be the\
