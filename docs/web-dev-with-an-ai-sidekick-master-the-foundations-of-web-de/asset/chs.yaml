- '# AI 副驾 Web 开发：绝对初学者的 Web 开发基础与 AI 辅助学习实用指南

  '
- "# 前言\n\n计算机科学作为一门学科从未停止发展。教授它往往让人感觉像是在试图跟上一个不断自我重塑的学科的步伐。近年来，人工智能的快速崛起使这一挑战进一步加剧。在许多方面，AI\
  \ 使计算机科学教学变得前所未有地既容易又困难。容易是因为教师和学生可用的工具异常强大。困难是因为这些工具可能会掩盖我们试图教授的最基本原理。\n\n在课堂上，仅仅向学生介绍编程语言和框架是不够的。我们必须帮助他们驾驭一个\
  \ AI 辅助开发司空见惯的生态系统。学生会尝试代码生成工具，并在遇到困难时依赖它们。他们可能在完全理解变量、程序流程或所用技术之前，就依靠这些工具生成可行的解决方案。虽然这能加快进度，但往往导致学生无法解释他们的代码为何有效。作为教育者，我们的责任是确保学生不将正确的输出误认为是真正的理解。\n\
  \nMark Price 的 .NET 书籍一直是 Greenhead College 编程图书库中广受欢迎的藏书。他的书籍结构尊重学习者的旅程，在精心搭建概念阶梯的同时，仍紧贴现代真实世界的开发实践。清晰的解释、精心挑选的示例，以及对循序渐进构建理解的高度重视，使他的书籍成为我在入门和中级编程课程中使用过的最可靠资源之一。它们在支持学生完成大型课程项目方面被证明特别有效，在这些项目中，信心和清晰度与技术正确性同等重要。\n\
  \n随着 AI 辅助开发的兴起，格局再次发生变化。问题不再是学生是否应该使用 AI 工具，而是如何负责任且有效地使用它们。这就是为什么像*与 AI 副驾驶一起进行\
  \ Web 开发*这样的书显得如此及时。本书没有无视 AI 或将其视为捷径，而是直接回应了教育者当前面临的张力：如何拥抱这些工具，同时确保它们增强学习而非取代学习。\n\
  \n我期望这本书能延续 Mark Price 以往作品的优势。如果以他贯穿写作中对待框架和语言那种审慎深思的心态来对待 AI，这本书将帮助学生不仅开发出功能性的解决方案，还能获得真正的理解。这种在能力与理解之间的平衡，正是教育工作者和学习者在软件开发新时代所需要的。\n\
  \n*Stephen Wood*\n\n*Greenhead College 计算机科学系主任*\n\n# 贡献者\n\n# 关于作者\n\nMark J. Price\
  \ 拥有超过 30 年向各类学习者教授编程和技术科目的经验。他广泛指导过不同阶段的学生，从学龄学习者和学徒到经验丰富的专业人士，帮助他们建立实用技能和技术自信。\n\
  \n除了软件开发工作，Mark 还教授数学和计算机，专注于使复杂的概念清晰易懂。他的教学风格强调理解系统如何运作，而非死记硬背语法，以便学习者能在实际情境中应用知识。\n\
  \nMark 拥有计算机科学学士学位，职业生涯大部分时间致力于开发课程、撰写书籍，并支持学习者从基础概念进阶到构建完整、可运行的项目。\n\n> 感谢所有读者。你们的支持让我得以撰写这些书籍并庆祝你们的成功。特别感谢通过我的\
  \ GitHub 仓库和电子邮件给我提供可执行反馈的读者，以及在 Discord 上与我和书籍社区互动的读者。你们让我的书每版都变得更好。\n\n# 关于审阅者\n\
  \nSunil Raj Thota 是一名软件工程师，专注于 Web 开发、AI 应用和智能体 AI 系统。他目前在 Amazon 的 Agentic AI Foundation\
  \ 团队工作，构建智能智能体驱动的解决方案。此前，他曾为 Amazon QuickSight 做出贡献，并在 Yahoo Inc. 担任职务，提升了 Yahoo\
  \ 和 AOL Mail 产品的用户参与度。Sunil 还曾在 Northeastern University 担任研究助理，在 MOURI Tech 担任高级软件工程师，领导\
  \ Web 优化和部署项目。他共同创立了 ISF Technologies，倡导以用户为中心的设计和敏捷方法论。他拥有 Northeastern University\
  \ 的分析学硕士学位。\n\nDavid Guida 是一位蒙特利尔的软件工程师和架构师，拥有近 20 年构建健壮分布式系统的经验。他职业生涯致力于理清现代软件设计的复杂性，并对指导开发者掌握架构和扩展有着深厚的热情。目前他在\
  \ Microsoft 从事一些非常酷的项目，当他不忙于编码、写博客或寻找下一本最爱书籍时，通常能在厨房烘焙蛋糕。\n\nJo Van Eyck 是一位经验丰富的软件工程师和技术教练，总部位于比利时。他帮助团队交付引以为豪的软件。\n\
  \n他撰写文章并发布视频，内容涉及当前正在重塑他思维的任何话题，最近主要指 AI 辅助编码、工程角色的变化形态，以及如何最好地为这一转型做准备。\n\n# 前言\n\
  \n\n\n# 与 AI 副驾驶一起进行 Web 开发\n\n《与 AI 副驾驶一起进行 Web 开发》通过利用交互式 AI 的力量，重新发明了初学者学习编程的方式。这本综合指南将静态的教科书体验转变为与您的\
  \ AI 编程伙伴的双向对话。您不再只是阅读代码，而是会提示 AI 解释概念、生成示例，并即时帮您解决问题。这就像拥有一位全天候可用的导师。\n\n结果是一个高度引人入胜的学习旅程，能适应您的问题和需求。您可以毫无顾虑地问“愚蠢”的问题，获得即时澄清，并接受根据您的节奏量身定制的分步指导。这是一种引人入胜的快速学习编程的方式，让编程变得更易上手、更有成就感。通过利用\
  \ OpenAI 的 ChatGPT、Google 的 Gemini 等 AI 模型，本书将最新的 AI 技术变成您的私人编程导师和合作者。\n\n## 适读人群\n\
  \n本书面向对 Web 开发感到好奇、并对利用 AI 学习编程技能和构建完整项目的可能性感到兴奋的完全初学者。本书非常适合：\n\n*   首次探索编程的学生\n\
  *   转行进入技术领域、需要友好切入点的人\n*   被传统教科书或视频课程压得喘不过气来的自学者\n*   想要构建交互式 Web 项目的创意工作者、设计师或作家\n\
  *   有应用创意但缺乏正规训练的爱好者或企业家\n*   对 AI 着迷并想知道它如何帮助自己学编程的任何人\n\n它特别吸引那些偏好动手实践、注重实用学习，并重视在编码时能用自然语言提问的人。\n\
  \n## 需要什么前置知识？\n\n无。本书假设您在编程、Web 开发或使用 AI 工具方面零基础。如果您会打开浏览器并遵循说明，就已经准备好了。早期章节会引导您完成每一步，包括如何注册\
  \ ChatGPT、安装带有 GitHub Copilot 等各种扩展的 VS Code，甚至如何有效地与 AI 对话。随后，本书会讲解网页如何构建和样式化、如何绘制图形、什么是变量、什么是循环，甚至如何托管您完成的\
  \ Web 项目。它从零开始，构建到一个完整的网站。\n\n## 为什么要买这本书？\n\n本书比任何传统书籍都能更快、更愉快、更互动地教授现代 Web 开发。\n\
  \n它介绍了一种有趣友好的学习方式，利用 AI 工具作为导师、调试器和编程助手。\n\n它为像您这样的初学者量身定制，去除了行话和门槛。\n\n一本书涵盖所有内容：前端、后端、数据库、部署和开发工具。\n\
  \n它带来实实在在的成果。您将构建并部署一个功能齐全的 Web 应用。\n\n它通过教您如何与 AI 持续学习，让您保持最新。它不仅仅是一本关于特定语法的参考书。\n\
  \n它面向未来，因为您将同时获得 Web 开发技能和 AI 辅助开发的流利度，这是当今就业市场的一大优势。\n\n## 本书内容\n\n让我们简要回顾一下您可以从本书中期待什么。\n\
  \n# 第 1 部分：前端 Web 开发\n\n第 1 部分在专门的章节中介绍用于构建网页可见部分的主要技术，每章都为交互式学习而构建。您将从 Web 的基石开始：用于图形的\
  \ HTML、CSS 和 SVG，然后进阶到 JavaScript 及其类型化超集 TypeScript。\n\n每章都以友好的方式介绍核心概念，并立即邀请您通过与\
  \ AI 聊天来实践。例如，学习 HTML 时，您会让 AI 生成一个简单的网页结构，然后通过提示词进行调整。这样，您就能亲身体验 HTML 定义含义和结构。\n\
  \n在 CSS 章节中，您将为页面添加样式，并了解 CSS 如何控制布局、颜色、间距和排版，从而加深对 CSS 描述元素应如何在屏幕、纸张或其他媒体上渲染的理解。\n\
  \nJavaScript 让您的网页活起来，您将与 AI 协作使页面具有交互性，这反映了 JavaScript 作为核心 Web 语言的角色，而 TypeScript\
  \ 被作为一种为 JavaScript 添加静态类型以实现更安全编码的扩展而引入。\n\n每章都包含练习，您会让 AI 工具解释、修改或调试小示例。每章以测验结束以巩固知识，并提供精选的官方文档链接列表供进一步参考，鼓励您将查阅权威来源作为学习的一部分。\n\
  \n# 第 2 部分：后端 Web 开发\n\n然后我们在专门的章节中涵盖所有基本的后端 Web 开发技术，每章同样为交互式学习而构建。您将探索与 SQL 的数据库交互，深入\
  \ Python 编程，掌握 Django Web 框架，并熟悉用于自动化的 `Bash` 命令行脚本。\n\n在 *第 1 部分* 和 *第 2 部分* 结束时，您将牢固掌握从前端到后端的整个\
  \ Web 技术栈，所有这些都通过与 AI 聊天机器人并肩进行的动手实践获得。\n\n# 第 3 部分：调查项目\n\n现在掌握了基础知识，您将踏上一个激动人心的毕业项目：使用\
  \ Django、现代 Web 技术，并在每一步都有 AI 助手协助，开发一个调查创建 Web 应用。本书的这一部分是一个基于项目的教程，分为几章，反映真实的开发工作流。\n\
  \n在规划阶段，您将在 Django 中设计应用的功能和数据模型，AI 将帮助头脑风暴模型字段和关系。我们将使用 `Docker` 容器设置专业开发环境，在本地运行\
  \ Django 和数据库，确保每个人都能使用相同的设置跟随学习。\n\n本书提供了使用 OpenAI Codex 或 Anthropic Claude Code（尖端的\
  \ AI 驱动编码环境）构建项目的详细说明。我们将展示 Codex 或 Claude Code 如何将 AI 无缝集成到编码工作流中，以便您可以使用指令编写代码，并让\
  \ AI 起草代码，而您则进行审查、测试和修改。通过这个 AI 增强的过程，您将实现调查应用的所有关键功能：\n\n*   创建包含多种问题类型（文本、多选、评分等）的调查\n\
  *   让用户提交回答\n*   构建用于管理调查的管理界面\n*   在动态表格和图表中显示结果\n\n在此过程中，您将练习 AI 辅助调试和测试：例如，为\
  \ Django 视图编写单元测试。\n\n我们强调有效的提示技巧以从 AI 获得有用的输出，同时也提醒 AI 的怪癖以及如何验证和修正 AI 生成的解决方案。\n\
  \n项目章节还突出了工具之间的协作。例如，使用 `Git` 版本控制（配合 GitHub 或本地）来管理 AI 建议的更改，并使用 `Docker` 进行本地实时测试。\n\
  \n在最后的项目章节中，我们将指导您将完成的应用部署到生产环境。在整个部署过程中，AI 副驾驶可以协助编写 `Dockerfile` 或 `.gitignore`\
  \ 文件等任务。\n\n在 *第 3 部分* 结束时，您将构建一个全栈 Web 应用，并在规划、编码、测试和部署期间练习使用 AI 工具。这是一个值得放入作品集的项目，它巩固了您在\
  \ *第 1 部分* 和 *第 2 部分* 学到的一切，并教您这些部分如何在真实应用中相互连接。\n\n更重要的是，您将体验一种构建软件的新范式：与 AI 伙伴一起编码。\n\
  \n### AI 交互理念\n\n\n\n本书的独特之处在于其 AI 交互理念。内容保持新鲜且最新，因为它不仅依赖预先编写的文本，还利用不断改进的实时 AI 模型。每当出现新\
  \ API 或语言更新时，你的 AI 副驾驶都能为你填补空白，使这成为一本与技术共同成长的书。\n\n我们还强调良好的习惯，比如将 AI 输出与官方文档交叉核对。每章都会指引你查阅主要来源，如\
  \ Python 官方文档和 Django 官方文档，以便你学会验证并深化知识，超越 AI 提供的内容。\n\n本书的语调和内容专为完全的初学者量身定制，采用平实友好的美式英语编写。复杂主题被拆解为易于掌握的、与\
  \ AI 的对话式交流，让学习体验更像是一次引导式对话，而非枯燥的讲座。\n\n本书旨在教授一种全新的编码方式，即你请求 AI 教授概念和原理，然后创造性地应用这些知识。\n\
  \n无论你是学生、寻求转行的专业人士，还是仅仅对技术感兴趣，*与 AI 副驾驶一起进行 Web 开发*都将加速你从新手成长为自信的 Web 开发者的旅程。\n\n\
  读完最后一页时，你不仅将拥有一个已部署上线的功能性 Web 应用，还将掌握在 AI 副驾驶的帮助下持续学习任何新技术的诀窍。\n\n## 我们使用 AI 生成内容的原则\n\
  \n本书由 Mark J. Price 编写。在开发过程中，生成式 AI 工具（如 ChatGPT、Gemini 和 Claude）被用于辅助探索构思、排查代码问题和生成示例。这种深思熟虑的\
  \ AI 使用方式体现了本书的核心理念：在交互式 AI 的引导下，学习编程可以更直观、响应更快、更引人入胜。\n\n在写作过程中引入 AI 的目的是为读者提供更多跨更广泛编程语言的示例、更深入地涵盖解决方案，并更快地应对新场景。\n\
  \n本书所有教学内容均由作者和 Packt 编辑团队开发、审核和测试。Packt 不会发布 AI 生成的内容来替代专家创作。\n\n## 充分利用本书\n\n\
  * 要完成本书的*第 1 部分*和*第 2 部分*，你需要能够访问像 OpenAI ChatGPT、Anthropic Claude 或 Google Gemini\
  \ 这样的 AI 聊天机器人。你可以使用免费账户，尽管付费账户将让你访问更强大的模型。\n\n* 要完成本书的*第 3 部分*，你需要一个 AI 增强的 IDE，如带有\
  \ GitHub Copilot 的 VS Code，以及像 OpenAI Codex 或 Claude Code 这样的 CLI 工具。\n\n### 下载示例代码文件\n\
  \n本书的代码托管在 GitHub 上，地址为 [`github.com/markjprice/web-dev-ai`](https://github.com/markjprice/web-dev-ai)。\n\
  \n我们还有来自丰富图书和视频目录的其他代码包，可在 [`github.com/PacktPublishing`](https://github.com/PacktPublishing)\
  \ 获取。去看看吧！\n\n### 约定用法\n\n全书使用了多种文本约定。\n\n`CodeInText`：表示文本中的代码词、数据库表名、文件夹名、文件名、文件扩展名、路径名、虚拟\
  \ URL、用户输入和 Twitter 账号。例如：\\\"将 `<h1>` 和 `<title>` 文本更改为其他内容。\\\"\n\n代码块设置如下：\n\n\
  ```\n<p>\n  HTML tells the browser what each piece of content <em>is</em>.\n  Styling\
  \ comes later (that's CSS), and interactivity comes later (that's JavaScript).\n\
  </p>\n```\n\n当我们希望引起你对代码块特定部分的注意时，相关行或项目会以粗体显示：\n\n```\n<h2>Useful link</h2>\n<p>\n\
  \  Here's a link to learn more about HTML:\n  <a href=\"https://developer.mozilla.org/en-US/docs/Web/HTML\"\
  >MDN Web Docs: HTML</a>.\n</p>\n```\n\n任何命令行输入或输出均按以下方式编写：\n\n```\ncode --install-extension\
  \ ms-vscode.live-server\n```\n\n**粗体**：表示新术语、重要单词或屏幕上显示的单词。例如，菜单或对话框中的单词会在文中以这种方式显示。例如：\\\
  \"在 VS Code 中，单击 **Extensions** 图标或导航到 **View** | **Extensions**。\\\"\n\n## 联系我们\n\
  \n我们始终欢迎读者的反馈。\n\n**一般反馈**：如果你对本书的任何方面有疑问或有任何一般性反馈，请发送邮件至 `customercare@packt.com`，并在邮件主题中注明书名。\n\
  \n**勘误**：尽管我们已尽一切努力确保内容准确，但错误难免发生。如果你在本书中发现错误，我们将不胜感激如果你能向我们报告。请访问 [`www.packt.com/submit-errata`](http://www.packt.com/submit-errata)，点击\
  \ **Submit Errata**（提交勘误），并填写表格。\n\n**盗版**：如果你在互联网上以任何形式发现我们作品的非法副本，我们将不胜感激如果你能提供位置地址或网站名称。请通过\
  \ `copyright@packt.com` 联系我们，并附上相关链接。\n\n**如果你有兴趣成为作者**：如果你在某个主题上有专长，并有兴趣撰写或为书籍做贡献，请访问\
  \ [`authors.packt.com/`](http://authors.packt.com/)。\n\n## 随书赠送的免费福利\n\n本书附带免费福利以支持你的学习。立即激活以获取即时访问权限（请参阅*如何解锁*部分获取说明）。\n\
