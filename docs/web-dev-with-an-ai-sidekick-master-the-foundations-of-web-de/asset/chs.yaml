- '## 尾声


  我希望这本书能区别于大多数 Web 开发书籍。希望您觉得它实用、动手性强，并且值得您投入的时间。


  本尾声包含以下简短章节：


  - 您学到的内容

  - 接下来做什么

  - 使用 Packt 学习 Web 开发的下一步

  - 祝好运！


  ## 您学到的内容


  您从基础 `HTML` 开始，最终完成了一个带有真实数据库的已部署 Web 应用。


  在此过程中，您学习了九种语言和技术（`HTML`、`CSS`、`SVG`、`JavaScript`、`TypeScript`、`SQL`、`Python`、`Django`
  和 `Bash/Shell`），构建并设计了交互式网页，设计了关系数据库模式，创建了一个包含认证、表单和管理后台的完整 `Django` 应用，编写了单元、集成和端到端测试，使用
  `Docker` 容器化您的应用，使用 `Git` 管理代码，并使用 `Nginx` 和 `Gunicorn` 部署到生产服务器。


  这涵盖了大量内容。希望您为所取得的成就感到自豪。


  您还练习了使用 `AI` 工具，不仅限于代码生成：


  - 提出更好的问题

  - 评估 `AI` 生成的输出

  - 调试和优化解决方案

  - 综合考虑系统、行为和语法





  具体工具会不断更迭，但你在此练就的习惯将长存：将功能视为一个完整的系统来审视。数据从何而来？存储在何处？谁有权修改？出故障时会发生什么？一旦你能回答这些问题，编写、审查和修复代码就会变得更加容易。


  最重要的是，你已经练习了一种学习方式，它将在工具演进的过程中持续助你一臂之力。具体的框架和模型会变，但你理解问题、将其拆解、并驾驭 AI 而不让它替你思考的能力将永存。


  读完这本书不是终点，而是你拥有了足够多的拼图碎片、可以开始构建属于你自己的东西的起点。


  ## 接下来做什么


  如果你对前端感兴趣：


  *   构建一个小型作品集网站

  *   学习一个框架（React、Vue）

  *   探索无障碍访问和性能优化


  如果你对后端感兴趣：


  *   使用 Django REST Framework 构建 API

  *   深入学习认证与安全

  *   部署一个拥有真实用户的项目


  如果你对全栈和部署感兴趣：


  *   为 TallyApp 扩展分析、认证和支付功能

  *   添加测试和 CI/CD

  *   探索扩展与缓存


  如果你对 AI 辅助开发感兴趣：


  *   尝试 Agent 工作流

  *   故意对比不同模型

  *   构建一个使用 AI API 的工具


  在转向另一本书或课程之前，先构建一些属于你自己的东西。它不需要庞大或复杂，只需真实且与*你*相关：


  *   一个个人网站

  *   一个你会用到的简单工具

  *   一个增加了新功能的 TallyApp 变体


  你从一个完成的小项目中学到的，将多于从三个被放弃的大项目中学到的。


  如果你想深入钻研特定领域，以下书籍将为你提供结构化的学习路径。


  ## 通过 Packt 学习 Web 开发的后续步骤


  纸质书的篇幅总有限，而主题的有趣切入点却无穷无尽。对于你想深入了解的主题，希望书中的笔记、最佳实践提示以及 GitHub 仓库中的链接能指引你前行：[`github.com/markjprice/web-dev-ai/blob/main/docs/book-links.md`](https://github.com/markjprice/web-dev-ai/blob/main/docs/book-links.md)。


  如果你在寻找我出版社出版的、涵盖相关编程主题的其他书籍，有很多可供选择，如*图 E.1*所示：


  ![](img/B34553_16_01.png)


  **图 E.1：** 将你的 Web 开发学习推向更深层次的 Packt 书籍


  以下是这五本编程书籍的简短介绍：


  1.  *《HTML5 与 CSS 响应式 Web 设计（第 5 版）》* 涵盖了用于构建响应式网站和 Web 应用程序的 HTML5 和 CSS 技术。它包含实用示例和面向现代浏览器开发的更新指南。[`www.amazon.com/dp/1837028230/`](https://www.amazon.com/dp/1837028230/)


  2.  *《JavaScript 从入门到专业》* 介绍了用于 Web 应用程序开发的 JavaScript。它结合了讲解、代码练习和项目，适合构建第一门 JavaScript
  技能的读者。[`www.amazon.com/dp/1800562527/`](https://www.amazon.com/dp/1800562527/)


  3.  *《Python 编程入门（第 4 版）》* 介绍了 Python 编程基础和实际应用。它涵盖了 Python 3.9 到 3.12 的特性，包括类型提示、命令行应用程序以及与
  Python Web 开发相关的示例。[`www.amazon.com/dp/B0DC6DYPV2/`](https://www.amazon.com/dp/B0DC6DYPV2/)


  4.  *《Django 5 实战（第 5 版）》* 通过四个项目教授 Django：博客应用、社交网站、电子商务应用和在线教育平台。它涵盖了规划、实现、常见问题和
  Django 开发实践。[`www.amazon.com/dp/1805125451/`](https://www.amazon.com/dp/1805125451/)


  5.  *《Playwright 自动化测试实战》* 介绍了用于端到端测试的 Playwright。它涵盖设置、动态内容、无障碍测试、并行执行、AI 生成的测试脚本，以及电子商务和单页应用程序的示例。[`www.amazon.com/dp/1806106477/`](https://www.amazon.com/dp/1806106477/)


  **最佳实践**：在投资购买任何书籍之前，请查看其涵盖的语言或框架版本。核心概念保持不变，但一些较新的特性（如 Django 6 的模板片段或 Python 3.14
  的性能改进）可能未被涵盖。请始终结合你想学习版本的官方文档进行交叉参考。


  如果你在寻找我出版社出版的、涵盖相关 AI 主题的其他书籍，有很多可供选择，如*图 E.2*所示：


  ![](img/B34553_16_02.png)


  **图 E.2：** 将你的 AI 学习推向更深层次的 Packt 书籍


  以下是这五本 AI 书籍的简短介绍：


  1.  *《ChatGPT 生成式 AI 实战》* 介绍了 ChatGPT 的实用用法，包括提示词编写、AI 助手、文档和图像分析以及代码生成。旨在帮助想要将生成式
  AI 应用于日常任务的读者。[`www.amazon.com/dp/1836647859/`](https://www.amazon.com/dp/1836647859/)


  2.  *《GitHub Copilot 手册》* 解释了如何在软件开发生命周期中使用 GitHub Copilot。它涵盖编码辅助、代码审查、团队工作流以及
  GitHub Copilot 中可用的 AI 驱动功能。[`www.amazon.com/dp/1806116634/`](https://www.amazon.com/dp/1806116634/)


  3.  *《Claude Code Agent 编程》* 介绍了用于 AI 辅助软件开发的 Claude Code。它涵盖基于 Agent 的工作流、项目设计以及使用
  Claude Code 构建全栈应用程序。[`www.amazon.com/dp/1806022591/`](https://www.amazon.com/dp/1806022591/)


  4.  *《Python Model Context Protocol 学习指南》* 解释了模型上下文协议 (MCP) 及其如何用于在 Python 中构建 AI
  赋能的应用程序。它涵盖 MCP 概念、实现模式，以及将 AI 系统连接到工具和数据的示例。[`www.amazon.com/dp/1806103230/`](https://www.amazon.com/dp/1806103230/)


  5.  *《基于 LLM、RAG 和知识图谱构建 AI Agent》* 涵盖了使用大语言模型、检索增强生成和知识图谱设计和实现 AI Agent 的内容。它介绍了构建能够检索信息并采取行动的系统的核心概念和技术。[`www.amazon.com/dp/183508706X/`](https://www.amazon.com/dp/183508706X/)


  要查看我与 Packt 合作出版的所有书籍列表，可以使用以下链接：[`subscription.packtpub.com/search?query=mark+j.+price`](https://subscription.packtpub.com/search?query=mark+j.+price)。


  ## 祝你好运！


  祝你在所有 Web 开发项目中一切顺利。AI 工具将持续演进，但你清晰思考、设计系统和评估方案的能力，将始终是你作为开发者技能的基石。


  在学习过程中将 AI 作为助手，而非学习的替代品。让它为你解释、对比、测试并挑战你的工作。让它为你节省样板代码的时间。但不要让它决定你要构建什么，也不要让它判断结果是否足够好。这种判断权依然掌握在你手中。


  所以，去构建别的东西吧。保持规模小，保持真实，并持续追问它是*如何*以及*为什么*工作的。


  这才是你变强的途径。


