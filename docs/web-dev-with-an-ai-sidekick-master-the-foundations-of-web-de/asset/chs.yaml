  \ (Python Debugger)、格式化、代码检查、代码导航、重构等。 |\n| **Django** `batisteo.vscode-django`\
  \ | 为有截止日期的完美主义者提供优美的语法和作用域代码片段。 |\n| **GitHub Copilot** `github.copilot` | AI 结对编程工具，帮助您更快、更聪明地编写代码。\
