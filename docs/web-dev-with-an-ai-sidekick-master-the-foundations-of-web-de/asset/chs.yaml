- "## 第 12 章：单元、集成和端到端测试\n\n不要把测试留到最后。它是将可工作的原型转化为可靠软件的方法。在像 TallyApp 这样的真实项目中，功能相互交互，用户会做出你意想不到的事情，微小的变更会破坏看似无关的代码。良好的测试套件让你能够以更少的意外进行重构、扩展和部署。\n\
  \n视图可能返回错误的调查。权限检查可能允许一个用户编辑另一个用户的数据。表单可能接受无效输入。JavaScript 或模板变更可能导致按钮消失。你可能修复了一个\
  \ Bug，却意外地重新引入了一个旧 Bug。\n\n测试是让这些风险可见的方法。良好的测试套件不能证明你的应用程序完美无缺。它能让你快重复地获得关于你最关心行为的反馈。\n\
  \n本章探讨三个不同层级的测试：\n\n* 验证孤立逻辑片段的小型、快速单元测试\n* 验证组件协同工作的更广泛的集成和用户界面测试\n* 使用 AI 工具起草、审查和改进测试\n\
  \n你将看到这些层如何捕获不同类型的错误。当经过深思熟虑地结合时，它们为你提供了一张安全网，让你无需猜测项目是否仍然工作就能更改代码。\n\n你将从小逻辑片段的单元测试开始，然后进入测试视图、统一资源定位符（`URL`）、认证、表单和数据库的\
  \ Django 集成测试。之后，你将使用 Playwright 自动化一些浏览器级用户旅程。你还将学习如何管理测试数据、在持续集成中运行测试，以及如何使用 AI\
  \ 工具而不让它们生成看起来有用实则肤浅的测试。\n\n要建立的主要习惯很简单：在询问代码是否工作之前，先询问系统应该保证什么行为。\n\n在本章结束时，你将为\
  \ TallyApp 设计并实施分层测试策略，在 Django 中编写有意义的单元和集成测试，使用端到端测试自动化真实的浏览器交互，并学会如何使用 AI 工具加速测试创建而不放弃工程判断。\n\
  \n在本章中，我们将涵盖以下主题：\n\n* 测试金字塔和测试哲学\n* Python 和 Django 单元测试\n* Django 应用集成测试\n* 端到端\
  \ Web 用户界面测试\n* 管理测试数据和固件\n* 持续集成和自动化测试流水线\n* 请 AI 编写测试\n\n本章的建议聊天机器人提示词及示例响应可在以下链接找到：[`github.com/markjprice/web-dev-ai/blob/main/prompts/ch12-test/readme.md`](https://github.com/markjprice/web-dev-ai/blob/main/prompts/ch12-test/readme.md)\n\
  \n## 测试金字塔和测试哲学\n\n在编写许多测试之前，了解每种测试的位置会有所帮助。该模型通常被称为测试金字塔。\n\n### 测试金字塔\n\n**测试金字塔**描述了健康应用程序中测试的理想分布，如图\
  \ 12.1 所示，并按以下列表描述：\n\n* 底层是单元测试\n* 中层是集成测试\n* 顶层是端到端或 UI 测试\n\n![](img/B34553_12_01.png)\n\
  \n图 12.1：测试金字塔\n\n基本思想是：\n\n* 你应该有许多快速、隔离的单元测试\n* 较少的集成测试，用于测试多个组件的协同工作\n* 非常少的缓慢、浏览器级测试\n\
  \n为什么在底层放更多测试？\n\n* 单元测试快速、确定性强、易于调试，且大量运行成本低廉\n* UI 测试较慢、更脆弱、调试更复杂\n\n如果你的大多数测试是\
  \ UI 测试，测试套件很快会变得缓慢、脆弱且难以调试。如果你主要依赖单元测试，你会获得快速反馈，并可以在开发过程中持续运行测试。\n\n> **提示词**：请解释测试金字塔的历史起源以及它与测试奖杯模型的区别。有哪些团队倒置测试金字塔的真实案例，他们面临了什么问题？\n\
  \n在本节中，我们专注于金字塔底层：Python 和 Django 中的单元测试和服务端集成测试。浏览器自动化将在下一节介绍。\n\n### 什么算作单元？\n\
  \n*单元*通常是一小段**自包含的逻辑片段**：\n\n* 一个函数\n* 一个方法\n* 一个类\n* 一个小模块\n\n**单元测试**验证该逻辑片段在给定输入下的行为是否符合预期。\n\
  \n例如：\n\n* 计算调查统计的函数\n* 判断调查是否发布的模型方法\n* 拒绝空标题的表单验证规则\n\n小而专注的测试在失败时更容易理解。\n\n###\
  \ 安排、行动、断言\n\n大多数测试遵循以下结构：\n\n1. **安排**：设置数据和环境。\n2. **行动**：调用被测试的函数或方法。\n3. **断言**：验证结果。\n\
  \n通俗示例：\n\n1. **安排**：创建一个 `Survey` 对象。\n2. **行动**：调用 `survey.is_open()`。\n3. **断言**：确认它返回\
  \ `True`。\n\n这种模式通过保持测试的可读性和一致性，帮助未来的你和其他测试读者快速理解测试。\n\n> **提示词**：除了安排-行动-断言，什么造就了一个好的单元测试？给出语法正确但糟糕的测试示例。\n\
  \n### 确定性和隔离\n\n好的单元测试是：\n\n* **确定性的**：给定相同的输入，它们总是产生相同的结果\n\n\n\n*   **隔离**：它们不依赖外部系统，例如真实数据库（除非有意测试数据库行为）、网络调用、当前时间（除非受控）或随机值。\n\
  \n    **良好实践**：对于测试时间相关的逻辑，可以使用 `freezegun` ([`github.com/spulec/freezegun`](https://github.com/spulec/freezegun))\
  \ 或 `time_machine` ([`github.com/adamchainz/time-machine`](https://github.com/adamchainz/time-machine))\
  \ 将时钟冻结在特定时刻。这使得测试无论何时运行都是确定性的。`freezegun` 更早且非常流行。`time_machine` 更新、更快，是许多当前 Python\
  \ 项目的良好默认选择。\n\n随机失败的测试往往比没有测试更糟糕，因为不稳定的测试会削弱信任。一旦人们不再信任测试失败，他们就不再仔细阅读失败信息。\n\n\
  **提示**：请解释软件测试中置信度、覆盖率和正确性的区别。\n\n现在让我们更深入地了解 Python 和 Django 的单元测试。\n\n# Python\
  \ 和 Django 单元测试\n\n单元测试是你在逻辑消失在视图、表单和模板内部之前，检查小块逻辑的地方。在这一层级，你关注小型的、自包含的逻辑片段，例如函数、模型方法、验证规则和权限检查，并验证它们对于特定输入是否表现正确。\n\
  \n在像 TallyApp 这样的 Django 项目中，这意味着测试纯 Python 工具函数以及模型行为、表单验证和自定义业务规则，使用 Django 的\
  \ `TestCase` 及其内置的测试数据库。这些测试应该是快速的、确定性的和隔离的，这样你才能在代码还留在脑海中时发现错误。当你的单元测试强健时，它们为测试套件中的其他所有内容形成了一个稳定的基础。\n\
  \n**提示**：Django 的测试运行器在内部是如何创建和销毁测试数据库的？\n\n## Django 的测试基类\n\nDjango 提供了几个基础测试类，每个都针对略微不同的目的设计。选择正确的基类可以避免测试缓慢和产生误导性测试。\n\
  \n**表 12.1** 是最常用测试基类的简明总结：\n\n| 测试基类 | 每个测试回滚事务 | 典型用例 |\n| --- | --- | --- |\n\
  | `SimpleTestCase` | 不适用 | 不接触数据库或 Django 模型的纯逻辑测试。适用于工具函数和配合 `RequestFactory` 的简单视图逻辑。\
  \ |\n| `TestCase` | 是（快速事务回滚） | 大多数模型、表单和集成测试。Django 应用的默认选择。快速且隔离。 |\n| `TransactionTestCase`\
  \ | 否（测试间刷新数据库） | 当你需要测试真实事务行为时，例如提交/回滚效果或需要实际提交的数据库约束。比 `TestCase` 慢。 |\n| `LiveServerTestCase`\
  \ | 是 | 需要真实 HTTP 服务器的端到端测试，常在集成模式下与 Selenium 或 Playwright 一起使用。启动一个实时测试服务器。 |\n\
  | `StaticLiveServerTestCase` | 是 | 同 `LiveServerTestCase`，但在测试期间也服务静态文件。适用于完整的基于浏览器的\
  \ UI 测试。 |\n\n表 12.1：最常用的测试基类\n\n实用指南：\n\n*   默认使用 `TestCase`。它针对速度和隔离进行了优化，并覆盖了像\
  \ TallyApp 这样的 Django 项目中的大多数场景。\n*   当不需要数据库时使用 `SimpleTestCase`。这能保持测试更快并使意图明确。\n\
  *   只有当你真正需要测试依赖已提交事务的行为时，才使用 `TransactionTestCase`。\n*   当驱动真实浏览器进行端到端测试时，使用 `LiveServerTestCase`\
  \ 或 `StaticLiveServerTestCase`。\n\n在许多 Django 项目中，大多数测试将使用 `TestCase`，其他类保留给专门的场景。\n\
  \n## Python 单元测试基础\n\nPython 自带一个名为 `unittest` 的内置测试框架。Django 构建在其之上。\n\n一个最小的 `unittest`\
  \ 风格测试如下所示：\n\n```\nimport unittest\n\ndef add(a, b):\n    return a + b\n\nclass\
  \ AddTests(unittest.TestCase):\n    def test_adds_two_numbers(self):\n        result\
  \ = add(2, 3)\n        self.assertEqual(result, 5)\n```\n\n你可以通过以下方式运行测试：\n\n```\n\
  python -m unittest\n```\n\n在 Django 项目中，你通常运行：\n\n```\npython manage.py test\n```\n\
  \nDjango 会自动发现名为 `tests.py` 的文件或 `tests/` 包内的测试。\n\n## Django 的 TestCase 和测试数据库\n\
  \nDjango 提供了自己的 `TestCase` 类，它扩展了 `unittest.TestCase`。\n\n关键特性：\n\n*   **自动测试数据库**：Django\
  \ 在运行测试前创建一个临时测试数据库，并在之后销毁它。\n*   **事务隔离**：每个测试在一个事务中运行，该事务会被回滚，确保状态干净。\n*   **用于模拟\
  \ HTTP 请求的客户端**：Django 包含一个测试客户端，用于在没有真实浏览器的情况下发起伪造的 `GET` 和 `POST` 请求。\n\n模型测试示例：\n\
  \n```\nfrom django.test import TestCase\nfrom .models import Survey\nfrom django.contrib.auth.models\
  \ import User\n\nclass SurveyModelTests(TestCase):\n    def test_survey_string_representation(self):\n\
  \        user = User.objects.create_user(\n            username=\"mark\",\n    \
  \        password=\"password123\"\n        )\n        survey = Survey.objects.create(\n\
  \            title=\"Favorite Sci-Fi Series\",\n            owner=user\n       \
  \ )\n        self.assertEqual(str(survey), \"Favorite Sci-Fi Series\")\n```\n\n\
  此测试：\n\n*   使用测试数据库\n*   创建真实的模型实例\n*   验证模型行为\n*   之后留下干净的数据库\n\n这是许多 Django 测试的日常形态。\n\
  \n**提示**：请解释 Django 中 `TestCase`、`TransactionTestCase`、`SimpleTestCase` 和 `LiveServerTestCase`\
  \ 的区别。\n\n## 使用 Django 测试客户端测试视图\n\n测试 Django 视图有两种有用的方法。\n\n当你想要在隔离环境中直接调用视图时，使用\
  \ `RequestFactory`。这绕过了 URL 路由和中间件，因此它的行为更像是对视图函数本身的传统单元测试。如果视图依赖于认证、会话数据或其他中间件行为，你必须手动提供这些。Django\
  \ 文档将 `RequestFactory` 描述为一种生成请求对象并像测试其他函数一样测试视图的方法。\n\n当你想要在不启动真实浏览器的情况下测试完整的 Django\
  \ 请求管道时，使用 `self.client`。这包括 URL 路由和更多框架行为，因此这些测试比隔离的单元测试范围更广，但它们仍然快速且在日常 Django\
  \ 项目中非常有用。Django 将测试客户端描述为一种在视图层面模拟用户与应用程序交互的方式。\n\n使用 `RequestFactory` 的示例：\n\n\
  ```\nfrom django.test import RequestFactory, TestCase\nfrom django.contrib.auth.models\
  \ import User\nfrom surveys.views import survey_list\n\nclass SurveyViewUnitTests(TestCase):\n\
  \    def setUp(self):\n        self.factory = RequestFactory()\n        self.user\
  \ = User.objects.create_user(\n            username=\"alice\",\n            password=\"\
  example123\"\n        )\n\n    def test_survey_list_with_authenticated_user(self):\n\
  \        request = self.factory.get(\"/surveys/\")\n        request.user = self.user\n\
  \        response = survey_list(request)\n        self.assertEqual(response.status_code,\
  \ 200)\n```\n\n使用 Django 测试客户端的示例：\n\n\n\n\n```python\nfrom django.urls import reverse\n\
  from django.test import TestCase\nfrom django.contrib.auth.models import User\n\n\
  class SurveyViewTests(TestCase):\n    def test_login_required_for_survey_list(self):\n\
  \        response = self.client.get(reverse(\"survey_list\"))\n        self.assertEqual(response.status_code,\
  \ 302)\n```\n\n这验证了：\n\n- 匿名用户会被重定向\n- URL 配置正确\n- 视图强制要求认证\n\n你也可以测试 `POST` 提交：\n\
  \n```python\ndef test_create_survey(self):\n    user = User.objects.create_user(\n\
  \        username=\"mark\",\n        password=\"password123\"\n    )\n    self.client.login(username=\"\
  mark\", password=\"password123\")\n    response = self.client.post(reverse(\"survey_create\"\
  ), {\n        \"title\": \"Best Programming Language\"\n    })\n    self.assertEqual(response.status_code,\
  \ 302)\n    self.assertTrue(\n        Survey.objects.filter(title=\"Best Programming\
  \ Language\").exists()\n    )\n```\n\n前面的代码涵盖了表单的服务端行为，而无需打开浏览器。\n\n## 测试模型、表单和业务逻辑\n\
  \n在像 TallyApp 这样的 Django 应用中，你的测试应覆盖：\n\n- **模型逻辑**：自定义方法，如 `is_open()`、`can_edit(user)`\
  \ 或计算属性\n- **表单验证**：确保无效数据被拒绝且正确的错误消息出现\n- **权限逻辑**：确认只有所有者可以编辑或删除他们的调查\n- **工具函数**：用于计算统计数据或转换数据的纯\
  \ Python 函数\n\n一个有用的原则是：*如果它包含逻辑，就测试它，且测试行为而非样板代码*。但如果它只是渲染静态内容的模板，单元测试通常是不必要的。\n\
  \n本章中的测试示例使用了一个 `Survey` 模型，你将在下一章创建它。目前，请阅读并理解这些模式，一旦模型存在，你的 AI 将实现它们。\n\n**提示**：什么是\
  \ `pytest` 中的参数化测试，它在什么时候有用？\n\n## 基于属性的测试与 Hypothesis\n\n到目前为止，你见到的大多数测试都是基于示例的。你选择特定的输入，调用一个函数，并断言预期的结果。**基于属性的测试**采用了不同的方法。你不再编写许多单独的示例，而是描述一个应始终为真的通用属性，然后由工具自动生成大量输入来尝试破坏它。\n\
  \n在 Python 中，最流行的基于属性的测试库是 **Hypothesis**。Hypothesis 不仅测试少数精心挑选的值，还会生成几十个甚至上百个输入，包括你可能想不到的边缘情况，例如空字符串、极大数字、不寻常的\
  \ Unicode 字符或边界值。\n\n例如，假设你在 TallyApp 中有一个简单的工具函数来计算响应百分比：\n\n```python\ndef percentage(part,\
  \ total):\n    if total == 0:\n        return 0\n    return round((part / total)\
  \ * 100, 2)\n```\n\n传统的测试可能如下所示：\n\n```python\ndef test_percentage_basic():\n  \
  \  assert percentage(1, 4) == 25.0\n```\n\n这没问题，但它只测试了一个示例。使用 Hypothesis，你可以定义应对许多输入成立的属性：\n\
  \n```python\nfrom hypothesis import given\nfrom hypothesis import strategies as\
  \ st\n\n@given(\n    part=st.integers(min_value=0, max_value=10_000),\n    total=st.integers(min_value=0,\
  \ max_value=10_000),\n)\ndef test_percentage_is_between_0_and_100(part, total):\n\
  \    result = percentage(part, total)\n    assert 0 <= result <= 100\n```\n\n现在\
  \ Hypothesis 将生成许多 `part` 和 `total` 的组合，并验证结果始终落在有效范围内。如果它发现一个失败的案例，它会将输入缩减到仍能破坏该属性的最小示例，这使调试更容易。\n\
  \n当你运行此测试时，Hypothesis 会发现 `part > total` 的情况，导致结果超过 100%。这正是基于属性测试的意义所在，因为它发现了我们未预料到的\
  \ bug。然后你需要决定如何处理发现的 bug：函数是否应将结果限制在 100% 以内，还是属性应允许超过 100% 的值？要修复该函数，你可以使用以下代码：\n\
  \n```python\ndef percentage(part, total):\n    if total == 0:\n        return 0\n\
  \    return min(round((part / total) * 100, 2), 100.0)\n```\n\n基于属性的测试特别适用于：\n\n\
  - 具有数学或逻辑不变量的纯函数\n- 数据转换\n- 验证逻辑\n- 解析器和格式化器\n- 任何在广泛输入空间中应表现一致的事物\n\n它对于严重依赖数据库、HTTP\
  \ 调用或外部系统的复杂集成测试不太有用。\n\n有了基于属性的测试，问题从*我应该测试什么示例？*变成了*什么必须始终为真？* 对于 TallyApp 中的业务逻辑，如分数计算、调查统计或归一化规则，这种视角可以发现基于示例的测试所遗漏的边缘情况。\n\
  \n## 测量覆盖率\n\n测试还关乎了解盲点在哪里。`coverage.py` 工具测量测试期间运行了多少代码。\n\n你通常：\n\n1. 启用覆盖率运行测试。\n\
  2. 生成 HTML 报告。\n3. 检查哪些行从未被执行。\n\n高覆盖率不保证正确性，但低覆盖率几乎可以保证存在盲点。\n\n**提示**：100% 的代码覆盖率无法告诉你什么？分支覆盖率与行覆盖率有何区别？`coverage.py`\
  \ 内部是如何工作的？\n\n## TallyApp 的合理测试策略\n\n对于像 TallyApp 这样的项目：\n\n- 为模型方法和验证逻辑编写单元测试\n\
  - 使用 Django 的测试客户端进行认证和增删改查（CRUD）流程测试\n- 保持测试小巧且专注\n- 避免测试琐碎的 getter 或 Django 内部机制\n\
  \n不同类型的测试锻炼系统的不同部分。使用最轻量但仍能让你对关心的行为充满信心的工具，如 *图 12.2* 所示：\n\n![](img/B34553_12_02.png)\n\
  \n图 12.2：TallyApp 中的测试层级\n\n从能证明行为的最廉价层级开始。如果纯 Python 单元测试能证明，就不要使用浏览器测试。它会更快、更易维护、更易调试。\n\
  \n目标是：\n\n- 快速的测试运行\n- 清晰的失败信息\n- 重构时的信心\n\n目标是用第 1 到第 3 层捕获大多数 bug。将第 4 层的 Playwright\
  \ 测试保留给对真实用户最重要的流程。当单元测试和服务端集成测试足够强健时，UI 测试就变成了一层薄薄的安全网，而不是你唯一的防线。这能让浏览器测试保持价值，而不至于主导整个测试套件。\n\
  \n测试是你决定应用程序被允许做什么的地方。AI 助手可以再写一行 `assertEqual`，但它无法决定未发布的调查是否应不可见、创建者在有响应后是否仍可编辑调查、重复提交是否应保持数据库不变。这些决策属于开发者。一旦你将它们作为测试显式化，代码就有了具体的满足目标。\n\
  \n## pytest 和 pytest-django\n\n许多 Django 项目使用 `pytest` 而不是 `unittest` 风格的类。但在假设你可以使用它之前，你应该验证\
  \ `pytest-django` 是否支持你的 Django 版本。你可以在以下链接查看最新的兼容性信息：[`github.com/pytest-dev/pytest-django`](https://github.com/pytest-dev/pytest-django)\n\
  \n开发者偏爱 `pytest` 的原因：\n\n- 更简单的语法（普通函数而非类）\n- 强大的 fixture 系统\n- 更好的错误输出\n\n\n\n\n\
  \n## 更灵活的测试组织\n\n`pytest` 风格的测试可能如下所示：\n\n```python\ndef test_survey_str(db, django_user_model):\n\
  \    user = django_user_model.objects.create_user(\n        username=\"mark\",\n\
  \        password=\"password123\"\n    )\n    survey = Survey.objects.create(\n\
  \        title=\"Favorite Editor\",\n        owner=user\n    )\n    assert str(survey)\
  \ == \"Favorite Editor\"\n```\n\n请注意上述代码的以下几点：\n\n* `db` 是一个启用数据库访问的固件\n* 断言使用普通的\
  \ `assert` 而非 `self.assertEqual`\n\n`pytest-django` 将 `pytest` 与 Django 的设置和测试数据库集成在一起。\n\
  \n许多 Django 团队将 `pytest` 与 `pytest-django` 结合使用。\n\n**提示**：为什么许多专业的 Django 团队更倾向于使用\
  \ `pytest` 而非 `unittest`？请包含同一 Django 测试分别采用 `unittest` 风格和 `pytest` 风格编写的对比。\n\n\
  现在让我们从单元测试转向集成测试。\n\n# Django 应用的集成测试\n\n**集成测试**位于测试套件的中层。它们不试图证明函数的每一个微小细节（单元测试），也不试图驱动真实的浏览器（端到端\
  \ UI 测试）。相反，它们验证多个 Django 层是否正确协作：URL 路由、视图逻辑、模板、中间件、认证、会话，以及数据库的读写操作。\n\nDjango\
  \ 使这种测试风格变得相当轻松，因为内置的测试运行器会自动创建一个临时测试数据库，将每个测试包裹在一个事务中，并提供一个测试客户端，它可以在不启动浏览器的情况下对你的\
  \ Django 项目发起类似请求的调用。\n\n## 在集成层面测试什么\n\n一个优秀的集成测试套件能回答如下问题：\n\n* 如果我请求一个命名 URL，是否会命中预期的视图并获得正确的\
  \ HTTP 响应？（URL + 视图）\n* 如果我未登录，受保护的页面是否会将我重定向到登录页？如果我已登录，是否能获得访问权限？（认证流程）\n* 中间件钩子是否真正运行，并像线上站点那样修改请求或响应？（请求/响应管道中的中间件）\n\
  * 视图是否正确地创建、更新和查询数据库行，响应是否反映了这些变化？（数据库交互）\n\n**提示**：开发人员在编写集成测试时最常犯的错误是什么？\n\n##\
  \ TestCase 与测试客户端\n\nDjango 的 `django.test.TestCase` 为每次测试运行提供一个已设置好的数据库，并提供一个 `self.client`\
  \ 属性，你可以用它来执行 `GET` 和 `POST` 等请求。当你传递 `follow=True` 时，该客户端还可以跟随重定向并记录重定向链。\n\n典型模式如下：\n\
  \n1. 创建所需的数据库状态（用户、调查、问题、响应）。\n2. 使用 `self.client.get(...)` 或 `self.client.post(...)`\
  \ 发起 HTTP 请求。\n3. 断言状态码、重定向、上下文数据和数据库效果。\n\n当你在 Django `TestCase` 中调用 `self.client.get()`\
  \ 时，Django 的测试客户端会模拟一个 HTTP 请求，并让它通过（几乎）整个 Django 栈，而无需真实浏览器，如*图 12.3* 所示：\n\n![](img/B34553_12_03.png)\n\
  \n*图 12.3：Django 集成测试请求路径*\n\n`self.client` 让请求经历 Django 真实的请求/响应周期，包括路由、中间件、模板和数据库，且无需浏览器。\n\
  \n## 示例：联合测试 URL 路由与视图\n\n此示例假设你有一个显示已发布调查的调查详情页。\n\n在文件 `tests/test_surveys_integration.py`\
  \ 中：\n\n```python\nfrom django.test import TestCase\nfrom django.urls import reverse,\
  \ resolve\nfrom surveys.views import survey_detail\nfrom surveys.models import Survey\n\
  \nclass SurveyDetailIntegrationTests(TestCase):\n    @classmethod\n    def setUpTestData(cls):\n\
  \        # setUpTestData 为整个类运行一次（比每个测试运行 setUp 更快）\n        cls.survey = Survey.objects.create(\n\
  \            title=\"Customer Satisfaction\",\n            slug=\"customer-satisfaction\"\
  ,\n            is_published=True,\n        )\n\n    def test_url_resolves_to_expected_view(self):\n\
  \        url = reverse(\"surveys:detail\", kwargs={\"slug\": self.survey.slug})\n\
  \        match = resolve(url)\n        self.assertEqual(match.func, survey_detail)\n\
  \n    def test_detail_page_returns_200_and_includes_title(self):\n        url =\
  \ reverse(\"surveys:detail\", kwargs={\"slug\": self.survey.slug})\n        response\
  \ = self.client.get(url)\n        self.assertEqual(response.status_code, 200)\n\
  \        self.assertContains(response, \"Customer Satisfaction\")\n```\n\n请注意上述代码的以下几点：\n\
  \n* `reverse()` 确保你测试的是命名路由而非硬编码 URL，从而使重构更安全。\n* `resolve()` 验证你的 `URLconf` 指向正确的视图。\n\
  * `self.client.get()` 将 URL 路由 + 中间件栈 + 视图 + 模板渲染串联起来进行测试。\n\n**警告！** 在 `setUpTestData`\
  \ 中创建的对象会在类的所有测试间共享。如果某个测试修改并保存了该对象，后续测试将看到修改后的版本。仅对测试只读不修改的数据使用 `setUpTestData`。对于可变的测试数据，请改用\
  \ `setUp`。\n\n## 示例：测试登录必需的视图\n\n在 TallyApp 中，对于仅创建者可访问的页面，典型规则是：若未认证，应重定向到登录页；一旦登录，应能看到该页面。\n\
  \nMDN 的 Django 测试教程展示了使用 `assertRedirects` 实现*未登录则重定向*的确切模式：\n\n```python\nfrom\
  \ django.contrib.auth import get_user_model\nfrom django.test import TestCase\n\
  from django.urls import reverse\n\nUser = get_user_model()\n\nclass SurveyCreateAuthIntegrationTests(TestCase):\n\
  \    @classmethod\n    def setUpTestData(cls):\n        cls.user = User.objects.create_user(\n\
  \            username=\"mark\",\n            email=\"mark@example.com\",\n     \
  \       password=\"pass12345\",\n        )\n\n    def test_redirects_to_login_when_not_authenticated(self):\n\
  \        url = reverse(\"surveys:create\")\n        response = self.client.get(url)\n\
  \        # 如果你使用 Django 的 login_required 装饰器，这是默认行为：\n        # 重定向到 settings.LOGIN_URL\
  \ 并附带 ?next=<原始 _url>。\n        login_url = reverse(\"login\")\n        self.assertRedirects(\n\
  \            response,\n            f\"{login_url}?next={url}\",\n            fetch_redirect_response=False,\
  \  # 避免发起第二次请求\n        )\n\n    def test_returns_200_when_authenticated(self):\n\
  \        self.client.force_login(self.user)\n        url = reverse(\"surveys:create\"\
  )\n        response = self.client.get(url)\n        self.assertEqual(response.status_code,\
  \ 200)\n        self.assertContains(response, \"Create survey\")\n```\n\n请注意上述代码的以下几点：\n\
  \n* `force_login` 适用于你不测试登录表单本身，仅测试认证后的访问控制和行为的场景。\n* `assertRedirects` 是在 Django\
  \ 测试客户端中测试重定向最直接的方法。\n\n## 示例：测试完整的“POST 创建行”流程\n\n现在让我们测试更接近真实行为的场景：提交一个创建调查的 POST\
  \ 请求，确认重定向到新调查页面，并确认调查存在于数据库中：\n\n\n\n\n# Django 使用测试客户端进行集成测试\n\n```python\nfrom\
  \ django.contrib.auth import get_user_model\nfrom django.test import TestCase\n\
  from django.urls import reverse\nfrom surveys.models import Survey\n\nUser = get_user_model()\n\
  \nclass SurveyCreatePostIntegrationTests(TestCase):\n    @classmethod\n    def setUpTestData(cls):\n\
  \        cls.user = User.objects.create_user(\n            username=\"creator\"\
  ,\n            email=\"creator@example.com\",\n            password=\"pass12345\"\
  ,\n        )\n\n    def test_post_creates_survey_and_redirects(self):\n        self.client.force_login(self.user)\n\
  \        url = reverse(\"surveys:create\")\n        response = self.client.post(\n\
  \            url,\n            data={\n                \"title\": \"Conference Feedback\"\
  ,\n                \"slug\": \"conference-feedback\",\n                \"is_published\"\
  : False,\n            },\n            follow=False,\n        )\n        self.assertEqual(response.status_code,\
  \ 302)\n        created = Survey.objects.get(slug=\"conference-feedback\")\n   \
  \     self.assertEqual(created.title, \"Conference Feedback\")\n        self.assertFalse(created.is_published)\n\
  \        # Optionally verify where we redirect to\n        expected = reverse(\"\
  surveys:detail\", kwargs={\"slug\": created.slug})\n        self.assertRedirects(\n\
  \            response,\n            expected,\n            fetch_redirect_response=False,\n\
  \        )\n```\n\n如果您想在重定向后验证最终页面内容，请传递 `follow=True` 并对最终响应进行断言。Django 文档描述了 `follow=True`\
  \ 和 `redirect_chain` 属性：\n\n```python\nresponse = self.client.post(url, data=payload,\
  \ follow=True)\nself.assertEqual(response.status_code, 200)\nself.assertGreaterEqual(len(response.redirect_chain),\
  \ 1)\nself.assertContains(response, \"Conference Feedback\")\n```\n\n## 实用指南\n\n\
  保持集成测试稳定：\n\n* 首选命名 URL（`reverse()`）而非硬编码路径。这能减少重构时的脆弱性。\n* 对于跨测试共享的昂贵设置，使用 `setUpTestData`；对于您打算修改的每个测试的状态，使用\
  \ `setUp`。\n* 仅断言足以证明行为的最小集合。例如，断言重定向和数据库行存在，而不是断言整个 HTML 输出。\n* 如果测试失败，按以下顺序诊断：\n\
  \    1. 是否命中了正确的 URL 名称和参数？\n    2. 当您期望 `200` 时是否收到了重定向（`302`）？\n    3. 认证状态是否存在（`force_login`\
  \ 或 `login`）？\n    4. 您的数据库设置是否与视图预期的一致？\n\n> **提示**：请解释如何在 Django 中正确测试数据库约束和唯一索引，以及竞态条件或并发问题。\n\
  \n## 集成测试的结束与端到端测试的开始\n\n测试客户端永远不会运行 JavaScript，它永远不会验证按钮在真实浏览器中是否可点击，也不会发现布局问题。这是基于\
  \ Playwright 的端到端测试的工作。但对于 Django 中的大多数服务端工作流，集成测试能在耗时范围内给您最好的反馈。\n\n现在让我们转到端到端测试，也称为用户界面测试。\n\
  \n# 端到端 Web 用户界面测试\n\n单元测试和 Django 的测试客户端能给您快速反馈，但它们仍无法证明 TallyApp 在真实浏览器中能正常工作。Web\
  \ UI 测试位于测试金字塔的顶端：您运行应用程序，打开真实的浏览器引擎，并自动化用户执行的相同操作，如点击链接、填写表单、提交以及验证屏幕上出现的内容。\n\n\
  本节使用 Playwright，这是一个快速、可靠且支持 Chromium、Firefox 和 WebKit 的浏览器自动化工具。我们将用它来测试 TallyApp\
  \ 的少量重要端到端用户旅程。\n\n## UI 测试的用途\n\nUI 测试最适合用于绝不能中断的关键流程：\n\n* **认证流程**：\n    * 未登录用户访问受保护页面时会被重定向到登录页\n\
  \    * 用户可以登录和登出\n* **核心产品流程**：\n    * 已登录用户可以创建调查\n    * 新调查出现在调查列表中\n    * 用户可以编辑和删除自己的调查\n\
  * **授权边界**：\n    * 用户 A 无法编辑或删除用户 B 的调查（通过尝试直接导航来测试）\n\n避免对所有功能都使用 UI 测试。它们比单元测试慢，且维护稳定性需要更多工作。您的目标是一套小型测试套件，从用户角度证明应用程序正常工作。\n\
  \n## 为什么选择 Playwright 而不是 Selenium\n\n历史上，Selenium 一直是最流行的 Web UI 测试框架。Selenium\
  \ 可以工作，但 Playwright 通常更适合现代项目，因为：\n\n* **内置自动等待**。它会等待元素就绪，从而减少不稳定测试。\n* **定位器具有弹性**。它们会重新查询并跟踪元素，而不是一次性查找然后祈祷。\n\
  * **出色的调试功能**。它可以录制屏幕截图、视频和追踪记录。\n* **跨浏览器**。一个 **应用程序编程接口** (**API**) 统一驱动 Chromium、Firefox\
  \ 和 WebKit。\n* **更友好地支持 AI 编码代理**。Playwright **模型上下文协议** (**MCP**) 服务器 (`playwright-mcp`)\
  \ 与 GitHub Copilot 集成良好。\n\n> **提示**：请从架构和可靠性方面比较 Playwright 和 Selenium。\n\n## 让您的\
  \ UI 易于测试\n\n如果您养成以下两个习惯，UI 测试的可靠性将大幅提升：\n\n* **优先使用可访问性选择器**：Playwright 可以通过角色、标签和可见文本定位元素。这鼓励编写良好的\
  \ HTML，并使测试更不易碎。\n* **谨慎使用测试 ID**：为少数关键元素添加 `data-testid=\"...\"` 属性。这可以防止样式更改破坏测试。\n\
  \nDjango 模板中的示例：\n\n```html\n<button type=\"submit\" data-testid=\"save-survey\"\
  >Save</button>\n```\n\n谨慎使用此方法。大多数情况下，优先使用标签和角色。\n\n## 为 Django 项目选择 Playwright\
  \ 风格\n\nPlaywright 支持两种常见方法：\n\n1. **Python + `pytest`**。天然适合 Django/Python 仓库。测试看起来像\
  \ Python 测试，并可与其他测试工具一起运行。\n2. **TypeScript 运行器 (Playwright Test)**。如果您的团队已经大量使用\
  \ TypeScript，这非常出色。TallyApp 不需要这个。\n\n对于这个以 Django 为主的书籍项目，Python 配合 `pytest` 是最简单且最一致的选择。\n\
  \n## 安装 Playwright\n\n您需要两样东西：\n\n* Python Playwright 包\n* Playwright 使用的实际浏览器二进制文件\n\
  \n典型设置命令（在虚拟环境中运行）：\n\n```bash\npython -m pip install playwright pytest\npython\
  \ -m playwright install\n```\n\n可选但推荐，用于更好的断言和等待助手：\n\n```bash\npython -m pip install\
  \ pytest-playwright\n```\n\n如果您已经对单元测试使用 `pytest`，这非常契合。如果没有，您仍可以单独运行 Playwright\
  \ 测试，但 `pytest` 能让事情保持整洁。\n\n## 在 Git 仓库中组织 UI 测试\n\n整洁的结构是将 UI 测试与 Django 单元测试分开：\n\
  \n* `tests/` 用于单元测试和集成测试\n* `e2e/` 用于 Web 用户界面测试\n\n示例：\n\n* `e2e/test_auth_flow.py`：网站认证的测试\n\
  * `e2e/test_surveys_crud.py`：调查数据库 CRUD 操作的测试\n\n这可以避免对哪些测试需要运行中的服务器和浏览器产生混淆。\n\n\
  ## 为 UI 测试运行 Django\n\nUI 测试需要一个运行中的服务器。您有两种合理的方法：\n\n1. **手动运行 Django 开发服务器**。在一个终端启动服务器，然后在另一个终端运行\
  \ Playwright 测试：\n\n```bash\npython manage.py runserver\n```\n\n\n\n\n此设置可行，但需要协调。服务器必须在测试开始前已在运行，如果未运行，失败信息可能会令人困惑，因为\
  \ Playwright 只会提示连接失败。在 CI 等自动化环境中，你不会依赖两个手动终端。相反，你会将启动 Django 作为测试运行的一部分，既可以使用测试服务器（如\
  \ Django 的 `LiveServerTestCase`），也可以使用能自动启动和关闭服务器的测试运行器。这引出了第二种方案。\n\n1. 从 `pytest`\
  \ 启动测试服务器。这对 CI 更整洁，但需要稍多一点设置。\n\n对于本书，手动启动开发服务器通常更容易，随后你可以再实现自动化方法。即使在开发期间，一个简单的改进是将两个步骤编写脚本一起执行。例如，你可以使用\
  \ Shell 脚本或任务运行器启动 Django，然后在服务器就绪后运行 Playwright 测试。这消除了手动协调两个终端的需要：\n\n```\n# 示例（类\
  \ Unix 系统）\npython manage.py runserver &\npytest e2e\n```\n\n这是一个适合学习的简单方法，但在实际项目中，你会使用更健壮的流程，在运行测试前等待服务器就绪。\n\
  \n当新手在未运行服务器的情况下运行 Playwright 测试时，他们会看到连接被拒绝错误、超时和 `page.goto failed` 消息。这些错误没有一个明确地说：“你忘了启动\
  \ Django。”\n\n在下面的示例中，假设服务器运行在：`http://127.0.0.1:8000`。\n\n## 第一个 Playwright 测试：登录重定向\n\
  \n创建 `e2e/test_auth_flow.py`：\n\n```\nimport re\nfrom playwright.sync_api import\
  \ Page, expect\nBASE_URL = \"http://127.0.0.1:8000\"\ndef test_protected_page_redirects_to_login(page:\
  \ Page) -> None:\n    page.goto(f\"{BASE_URL}/surveys/\")\n    # 预期我们最终会到达登录页面（URL\
  \ 模式因项目而异）。\n    expect(page).to_have_url(re.compile(r\".*/login/?(\\?.*)?$\"))\n\
  \    # 且登录表单应可见（根据你的模板调整标签/文本）。\n    expect(page.get_by_label(\"Username\")).to_be_visible()\n\
  \    expect(page.get_by_label(\"Password\")).to_be_visible()\n```\n\n注意：\n\n* `expect`\
  \ 提供自动等待和比手动睡眠更清晰的失败信息。\n* 尽可能使用标签。如果你的表单字段没有标签，请添加。这能提高可访问性和可测试性。\n\n**提示**：什么是页面对象模型（Page\
  \ Object Model），我应该在 Playwright 中使用它吗？\n\n## 测试真实用户旅程：创建调查\n\nUI 测试应演练用户采取的相同步骤。为此，你需要一个已知的用户账户。\n\
  \n你可以通过几种方式创建测试用户：\n\n* 在开发数据库中创建一个专用用户\n* 使用设置脚本/固件自动创建用户\n* 使用 Django 管理后台创建一次用户\n\
  \n最简单的是：创建一次用户（例如 `mark` / `password123`），在早期 UI 测试中使用它，随后再演进为自动化设置。为学习目的，手动创建测试用户没问题。在实际项目中，E2E\
  \ 测试应以编程方式创建自己的数据。Django 的 `StaticLiveServerTestCase` 提供了一个带有干净测试数据库的测试服务器，或者你可以编写一个设置脚本，在每次测试运行前创建所需的测试用户。\n\
  \n创建 `e2e/test_surveys_crud.py`：\n\n```\nimport os\nfrom playwright.sync_api import\
  \ Page, expect\n# 从环境变量读取基础 URL，提供默认值。\nBASE_URL = os.environ.get(\"BASE_URL\",\
  \ \"http://127.0.0.1:8000\")\nUSERNAME = \"mark\"\nPASSWORD = \"password123\"\n\
  def login(page: Page) -> None:\n    page.goto(f\"{BASE_URL}/login/\")\n    page.get_by_label(\"\
  Username\").fill(USERNAME)\n    page.get_by_label(\"Password\").fill(PASSWORD)\n\
  \    page.get_by_role(\"button\", name=\"Log in\").click()\n    expect(page).to_have_url(f\"\
  {BASE_URL}/surveys/\")\ndef test_create_survey(page: Page) -> None:\n    login(page)\n\
  \    page.get_by_role(\"link\", name=\"New survey\").click()\n    expect(page).to_have_url(f\"\
  {BASE_URL}/surveys/new/\")\n    page.get_by_label(\"Title\").fill(\"Best Star Trek\
  \ Captain\")\n    page.get_by_role(\"button\", name=\"Save\").click()\n    # 回到列表页，新调查应出现。\n\
  \    expect(page).to_have_url(f\"{BASE_URL}/surveys/\")\n    expect(page.get_by_text(\"\
  Best Star Trek Captain\")).to_be_visible()\n```\n\n此测试证明：\n\n* 认证工作正常\n* 导航工作正常\n\
  * 表单渲染和提交工作正常\n* 数据出现在 UI 中\n\n调整链接文本、按钮文本和 URL 以匹配你的模板。\n\n## 编辑和删除测试\n\n一旦你有了一个工作的测试，编辑和删除遵循相同模式。保持简短：\n\
  \n```\ndef test_edit_survey_title(page: Page) -> None:\n    login(page)\n    page.get_by_text(\"\
  Best Star Trek Captain\").click()  # 或点击 \"Edit\" 链接\n    page.get_by_label(\"Title\"\
  ).fill(\"Best Star Trek Series\")\n    page.get_by_role(\"button\", name=\"Save\"\
  ).click()\n    expect(page.get_by_text(\"Best Star Trek Series\")).to_be_visible()\n\
  def test_delete_survey(page: Page) -> None:\n    login(page)\n    page.get_by_text(\"\
  Best Star Trek Series\").click()\n    page.get_by_role(\"button\", name=\"Delete\"\
  ).click()\n    expect(page.get_by_text(\"Best Star Trek Series\")).not_to_be_visible()\n\
  ```\n\n如果你的 UI 使用确认对话框，Playwright 可以处理它们，但对新手友好的方法是在 Django 中实现一个简单的确认页面，而不是浏览器模态框。\n\
  \n## 保持 UI 测试可靠\n\n大多数不稳定的 UI 测试源于两个原因：不稳定的选择器和时机假设。\n\n* 使用稳定的选择器：\n    * 优先使用\
  \ `get_by_role`、`get_by_label` 和可见的按钮/链接名称\n    * 仅对少数关键控件使用 `data-testid`\n* 绝不使用睡眠：\n\
  \    * 避免 `time.sleep(...)`\n    * 使用 `expect(...)`，它会等待直到条件为 `true` 或超时\n* 重置状态。UI\
  \ 测试不应依赖之前的测试顺序。如果你的测试创建调查，可以：\n    * 为每个测试创建唯一标题，或\n    * 测试后清理，或\n    * 在 UI 运行之间重置数据库（最适合\
  \ CI）\n\n## 调试失败：有头模式、截图和追踪\n\n当 UI 测试失败时，你需要证据。与单元测试不同，浏览器测试涉及时机、渲染和用户交互，因此仅从测试输出往往无法明显看出失败原因。\n\
  \n需要理解的最重要概念之一是无头模式和有头浏览器模式的区别：\n\n* **无头模式（默认）**：浏览器在无可见窗口下运行。这更快，通常用于 CI 流水线和自动化运行。\n\
  * **有头模式**：浏览器窗口显示在屏幕上。你可以实时观察测试与页面的交互，这在调试时极其有用。\n\n**良好实践**：为速度和自动化使用无头模式。当某事失败且你需要看清发生了什么时，使用有头模式。\n\
  \n在开发或调试测试时，以有头模式（可见浏览器）运行测试：\n\n```\npytest -s e2e --headed\n```\n\n你也可以减慢交互速度，使其更易于跟踪：\n\
  \n```\npytest -s e2e --headed --slowmo 200\n```\n\n前面的代码在动作之间添加延迟（毫秒），以便你可视化地跟踪测试在做什么。\n\
  \n即使有了有头模式，你通常也想要一份出错记录，特别是在无屏幕可见的 CI 中。一个简单的模式是在测试失败时捕获截图：\n\n```\ndef test_something(page:\
  \ Page) -> None:\n    try:\n        # 测试步骤...\n        pass\n    except Exception:\n\
  \        page.screenshot(path=\"e2e_failure.png\", full_page=True)\n        raise\n\
  ```\n\n对于更复杂的失败，Playwright 还支持追踪，它记录：\n\n* 每一步的截图\n* 文档对象模型（DOM）快照\n\n\n\n\n\n##\
  \ 网络活动\n\n追踪功能让你在测试失败后能逐步重放测试过程，这通常比单张截图更有用。\n\n## 从 VS Code 运行 UI 测试\n\n在 VS Code\
  \ 中运行 UI 测试的推荐工作流如下：\n\n1. 打开集成终端。\n2. 在一个终端中启动 Django：\n   ```\n   python manage.py\
  \ runserver\n   ```\n3. 在另一个终端中运行 UI 测试：\n   ```\n   pytest e2e\n   ```\n\n如果你安装了\
  \ Python 扩展，也可以使用编辑器中的 `Run Test` 代码透镜来运行单个测试。\n\n## TallyApp 的测试目标\n\n一个合理的 TallyApp\
  \ Playwright 测试套件应该是小而无聊的：\n\n- 登录重定向\n- 登录/登出\n- 创建调查\n- 编辑调查\n- 删除调查\n- 用户 A 无法编辑用户\
  \ B 的调查\n\n这足以捕获大多数 `我把 UI 弄坏了` 的回归问题，而不会让你的测试套件变成一个缓慢、易碎的怪物。\n\n一旦你能在浏览器中模拟真实的用户交互，下一个挑战就是控制这些测试所依赖的数据，使其保持可靠和可重复。\n\
  \n# 管理测试数据和固定装置\n\n大多数易碎或痛苦的 Django 测试并非由 Django 引起。它们是由混乱的测试数据导致的。如果测试设置缓慢、令人困惑，或与无关细节紧密耦合，测试就会变得难以编写且容易破坏。良好的测试数据管理能保持测试快速、可读且独立。\n\
  \n目标很简单：每个测试应仅设置其所需的数据，以可预测的方式创建它，且绝不依赖其他测试创建的数据。\n\n## 固定装置、工厂，以及为什么工厂通常胜出\n\n\
  Django 支持 `fixtures`（固定装置），通常是你加载到测试数据库中的 JSON/YAML/XML 文件。它们很诱人，因为你可以创建一次数据并重复使用。但在实践中，它们往往变得脆弱：固定装置文件随着时间的推移而膨胀，包含无关对象，且每当你更改模型时就会中断。Django\
  \ 记录了固定装置及其通过 `loaddata` 管理命令加载的方式。例如：\n\n```\npython manage.py loaddata initial_data\n\
  ```\n\nDjango 会在已知的固定装置位置查找名为 `initial_data.json`、`initial_data.yaml` 或 `initial_data.xml`\
  \ 的文件。Django 搜索路径包括：\n\n- 每个应用内部的 `fixtures/` 文件夹\n- `settings.py` 中 `FIXTURE_DIRS`\
  \ 列出的任何目录\n- 当前工作目录\n\n`Factories`（工厂，在代码中创建）通常是更好的默认选择。它们生成测试所需的确切对象，就在那里，测试能直接看到它们，带有合理的默认值和显式的覆盖。工厂还使重构更容易，因为模型更改往往会导致清晰的\
  \ Python 错误，而不是神秘的固定装置加载失败。\n\n`良好实践`：大多数测试使用工厂。仅对少量、稳定的参考数据使用固定装置（例如，一个简短的国家列表，或几个静态的\
  \ `question types`），且仅当这些数据确实稳定时。\n\n## 测试中的 Django 固定装置\n\nDjango 的 `TestCase`\
  \ 可以通过在测试类上声明 `fixtures` 属性来自动加载固定装置。这很方便，但你应该保持固定装置文件小而专注。例如：\n\n```python\nfrom\
  \ django.test import TestCase\n\nclass SurveyListFixtureTests(TestCase):\n    fixtures\
  \ = [\"surveys_small.json\"]\n\n    def test_list_page_shows_published_surveys(self):\n\
  \        response = self.client.get(\"/surveys/\")\n        self.assertEqual(response.status_code,\
  \ 200)\n```\n\n你往往会遇到的固定装置问题：\n\n- **隐性耦合**：测试依赖固定装置的 ID、顺序，或对文件内容的假设。\n- **难以阅读**：数据不在断言附近，所以你必须在文件间来回跳转。\n\
  - **重构痛苦**：重命名字段或更改约束可能会一次性导致许多测试的固定装置加载中断。\n- **缓慢膨胀**：一个固定装置变成了“万能固定装置”并积累无关对象。\n\
  \n如果你确实使用固定装置，请保持它们小巧，并以它们支持的特定场景命名。\n\n**提示**：在大型项目中过度使用共享固定装置有哪些风险？\n\n## 纯 Django\
  \ 中的工厂\n\n你不需要库就能使用工厂。一种简单的方法是编写辅助函数，创建带有默认值的对象，并通过参数进行覆盖。默认值应当是现实的，且应始终创建有效对象。\n\
  \n辅助函数示例：\n\n```python\nfrom django.contrib.auth import get_user_model\nfrom surveys.models\
  \ import Survey\n\nUser = get_user_model()\n\ndef make_user(**kwargs):\n    defaults\
  \ = {\n        \"username\": \"user1\",\n        \"email\": \"user1@example.com\"\
  ,\n        \"password\": \"pass12345\",  # 注意：create_user 会对其进行哈希\n    }\n    defaults.update(kwargs)\n\
  \    return User.objects.create_user(\n        username=defaults[\"username\"],\n\
  \        email=defaults[\"email\"],\n        password=defaults[\"password\"],\n\
  \    )\n\ndef make_survey(**kwargs):\n    defaults = {\n        \"title\": \"Sample\
  \ Survey\",\n        \"slug\": \"sample-survey\",\n        \"is_published\": True,\n\
  \    }\n    defaults.update(kwargs)\n    return Survey.objects.create(**defaults)\n\
  ```\n\n然后在测试中：\n\n```python\nfrom django.test import TestCase\nfrom django.urls\
  \ import reverse\n\nclass SurveyListFactoryTests(TestCase):\n    def test_list_shows_only_published(self):\n\
  \        make_survey(title=\"Published A\", slug=\"a\", is_published=True)\n   \
  \     make_survey(title=\"Draft B\", slug=\"b\", is_published=False)\n        response\
  \ = self.client.get(reverse(\"surveys:list\"))\n        self.assertContains(response,\
  \ \"Published A\")\n        self.assertNotContains(response, \"Draft B\")\n```\n\
  \n## 使用 factory_boy 的工厂\n\n如果你想要一种更具扩展性的工厂方法，最常见的 Django 友好库是 `factory_boy`，它提供声明式工厂和方便的功能，如序列和子工厂。在书籍语境下，将其作为一个选项提及是值得的，即使你保持核心示例不依赖库。\n\
  \n使用 `factory_boy` 的典型模式是：\n\n- 对唯一的 slug/用户名使用 `Sequence`。\n- 对关联模型使用 `SubFactory`。\n\
  - 保持默认状态有效且最小化。\n\n**提示**：请比较 `factory_boy`、`pytest` 固定装置和 Django 固定装置的优缺点。\n\n\
  ## Django 中的数据库事务与测试隔离\n\nDjango 的 `TestCase` 使用数据库事务隔离测试。从高层来看：\n\n- Django 为测试运行创建一个测试数据库（或根据设置复用一个）。\n\
  - 每个 `TestCase` 在一个事务中运行并被回滚，以便下一个测试从干净状态开始。\n\n这就是为什么你可以在一个测试中安全地创建对象，而不会泄漏到另一个测试中。\n\
  \n`TransactionTestCase` 是一个较低层级的基类，它不使用相同的快速事务方法包装每个测试，用于当你需要测试依赖真实事务提交的行为时。这对于典型的\
  \ Web 应用测试不太常见，但如果你测试事务钩子或某些并发行为，这很重要。\n\n实际意义：\n\n- 大多数集成测试和模型测试使用 `TestCase`。\n\
  - 仅当你有特定理由时才使用 `TransactionTestCase`。\n- 保持测试确定性。除非你指定了排序，否则不要依赖数据库的隐式排序。\n\n##\
  \ 避免脆弱的共享状态\n\n**脆弱共享状态** 是测试意外依赖的任何全局事物。它导致看似随机的失败，特别是在你以不同顺序运行测试或单独运行单个测试文件时。\n\
  \n常见的脆弱性来源及其避免方法如 *表 12.2* 所示：\n\n| 问题 | 解决方案 |\n| --- | --- |\n\n\n\n\n\n| 依赖硬编码主键\
  \ | \"假设第一个调查的 id=1。\" | 检索刚创建的对象，或通过稳定字段（slug）查询，或存储返回的对象并使用其 id。 |\n|------------------|---------------------------|----------------------------------------------------------------------------------|\n\
  | 依赖查询集默认排序 | \"Survey.objects.all() 中的第一项是最新的。\" | 在查询或模型 Meta ordering 中使用显式排序，并基于内容而非位置进行断言。\
  \ |\n| 跨测试共享模块级对象 | 例如，你在测试模块导入时创建了一个 Survey。这将在测试模块被导入时运行一次，导致顺序和隔离性变得不可预测。 | 始终在\
  \ setUp、setUpTestData 或测试方法内部创建对象。 |\n| 泄露外部状态：缓存、邮件、文件、时间 | 如果你的代码涉及 Django 缓存、邮件发件箱、文件存储、当前时间或环境变量，请确保测试能控制这些状态。\
  \ | |\n\n表 12.2：测试脆弱性的常见来源及规避方法\n\n现在让我们看看持续集成和自动化测试流水线。\n\n# 持续集成和自动化测试流水线\n\n\
  只有当测试套件每次都自动运行时，它才会改变你的日常行为。这正是**持续集成**（**CI**）的作用：每当代码被推送或拉取请求被打开，CI 系统就会创建一个干净的环境，安装依赖，并运行你的测试。如果有任何失败，你会立即发现，在变更被合并或部署之前。\n\
  \n**GitHub Actions** 是许多 Django 项目的默认选择，因为它内置于 GitHub，支持 Linux 运行器，且易于用在 `push`\
  \ 和 `pull_request` 上运行的 YAML 工作流来表达。\n\n## 纪律是关键\n\nCI 是由机器强制执行的团队规则。\n\n严格的 CI\
  \ 通常意味着：\n\n* 每次推送和拉取请求都运行测试套件，而不仅仅是有人想起来时才运行。\n* `main` 分支保持绿色。构建失败被视为停工事件。\n*\
  \ 如果 CI 失败，拉取请求不得合并。这可以通过 GitHub 中的分支保护规则来强制执行。\n* 不稳定测试（flaky tests）被快速修复或移除。不稳定测试比没有测试更糟，因为它训练所有人忽略失败。\n\
  * CI 在干净环境中运行，因此能捕捉*在我机器上能跑通*的 bug。\n\n**提示**：为什么有些团队抵制编写测试？如何向一个没有测试纪律的团队引入测试纪律？请解释自动化测试的经济论据。\n\
  \n## 一个使用 SQLite 的最小 Django CI 工作流\n\n此工作流在每次推送和拉取请求时运行，设置 Python，安装依赖，并启用警告运行 Django\
  \ 的测试运行器，这有助于尽早捕获弃用警告。Django 本身建议使用 `python -Wa manage.py test` 启用 Python 警告来运行测试。\n\
  \n你现在不需要将此工作流添加到 TallyApp，但这正是一个最小工作流的样子。\n\n**警告！** 切勿将密钥（API 密钥、密码、密钥）直接存储在你的仓库或\
  \ `ci.yml` 中。请改用环境变量和 GitHub Actions Secrets。如果仓库是公开的，提交给它的任何内容都对所有人可见。\n\n创建 `.github/workflows/ci.yml`：\n\
  \n```\nname: CI\non:\n  push:\n    branches: [ \"main\" ]\n  pull_request:\njobs:\n\
  \  test:\n    runs-on: ubuntu-latest\n    strategy:\n      fail-fast: false\n  \
  \    matrix:\n        python-version: [ \"3.14\", \"3.13\", \"3.12\" ]\n    steps:\n\
  \      - name: Checkout\n        uses: actions/checkout@v4\n      - name: Set up\
  \ Python\n        uses: actions/setup-python@v5\n        with:\n          python-version:\
  \ ${{ matrix.python-version }}\n          cache: \"pip\"\n      - name: Install\
  \ dependencies\n        run: |\n          python -m pip install --upgrade pip\n\
  \          pip install -r requirements.txt\n      - name: Run tests\n        env:\n\
  \          DJANGO_SETTINGS_MODULE: tallyapp.settings\n          # If you use environment\
  \ variables in settings.py, set them here too.\n          # DJANGO_SECRET_KEY: \"\
  ci-only-not-secret\"\n        run: |\n          python -Wa manage.py test\n```\n\
  \n关于前面代码的注意事项：\n\n* 它在 `push` 和 `pull_request` 上运行，意味着每次变更都会自动测试。\n* 它使用 `actions/setup-python`\
  \ 在运行间一致地安装特定 Python 版本，并可缓存 pip 依赖以保持 CI 快速。\n* 一个小的 Python 版本矩阵能尽早捕获兼容性问题，特别是当你的读者可能使用不同\
  \ Python 版本时。\n\n本节关于 CI 的内容旨在提高你对该技术的认知，但我们不会在本书中实现它，因为当你初学时，它会使项目过度复杂化。\n\n**提示**：持续集成、持续交付和持续部署有什么区别？\n\
  \n现在让我们看看 AI 如何帮助你编写测试。\n\n# 请 AI 编写测试\n\nAI 工具非常擅长快速生成看似合理的测试。它们不擅长判断这些测试是否有意义。如果使用得当，AI\
  \ 助手可以帮你更快地起草和修改测试。如果随意使用，它将生成大量断言几乎为空的浅层测试。\n\n区别取决于你如何提示、如何审查，以及你是将 AI 视为初级工程师还是视为权威。\n\
  \n使用 AI 进行测试的最佳方式是从一个良好的“走动的骨架”开始：一个已经拥有工作测试套件、合理结构以及测试金字塔各层面示例的项目。例如，如果你的项目已经有几个清晰的单元测试、少量集成测试，或许还有一个端到端测试，AI\
  \ 通常能有效地扩展这些模式。没有这个基础，它更有可能生成不一致、冗余或低价值的测试。\n\n先确立测试策略。然后使用 AI 来扩展它。\n\n## 使用 AI\
  \ 起草初始测试用例\n\n当你提供以下内容时，AI 最有帮助：\n\n* 模型或视图代码。\n* 对预期行为的清晰描述。\n* 你关心的约束和边界情况。\n\
  * 你想要的测试风格，如 Django `TestCase` 或 `pytest`。\n\n示例提示：\n\n```\nHere is my Django model\
  \ for Survey. Write unit tests that verify validation rules, default values, and\
  \ any constraints. Use Django TestCase and avoid relying on primary key values.\n\
  ```\n\n输出通常会：\n\n* 创建一个 `TestCase` 子类。\n* 实例化一个模型实例。\n* 调用 `full_clean()` 来测试验证。\n\
  * 断言默认值和字段行为。\n\n这给你一个初稿。你仍需自问：这些是我会写的测试吗？还是说 AI 只是测试了对象能否保存？\n\n**提示**：关于 AI 生成测试及其可靠性的研究发现是什么？\n\
  \n## 使用 AI 生成边界情况\n\nAI 通常在头脑风暴边界情况方面比编写优雅的生产代码更擅长。这使其特别适用于负面测试和边界测试。\n\n示例提示：\n\
  \n```\nGiven this Django form for creating a survey, list edge cases I should test.\
  \ Focus on boundary values, invalid combinations, and security-related inputs.\n\
  ```\n\n一个好的回答可能会建议：\n\n* 空标题\n* 超过 `max_length` 的过长标题\n* Slug 冲突\n* Slug 中的无效字符\n\
  * 重复提交\n* 用户未经管理员批准\n* 尝试在没有必需问题的情况下发布\n* 极长的文本输入\n\n一旦你看到列表，你可以自己编写测试，或请 AI 为特定边界情况生成测试，如下示例提示所示：\n\
  \n\n\n\n```\nWrite a test that verifies creating a survey fails when the user is\
  \ not approved. Use self.client and assert the correct redirect or error message.\n\
  ```\n\n这将 AI 从幻觉行为转变为实现你已定义的行为。\n\n## 使用 AI 解释失败的测试\n\n当测试在 CI 中失败时，将失败输出粘贴到 AI\
  \ 助手中可能会出奇地有效。\n\n示例提示词：\n\n```\nHere is the traceback from my Django test run.\
  \ Explain what is happening and suggest likely causes. Do not rewrite my code, just\
  \ diagnose.\n```\n\nAI 通常可以：\n\n* 识别出发生了重定向，而不是返回 `200`。\n* 注意到对象不存在，因为设置数据不完整。\n\
  * 发现 URL 名称与 `reverse()` 用法之间的不匹配。\n* 识别出由新模型约束触发的验证错误。\n\n这对初学者尤其有帮助，他们往往难以解读涉及中间件、URL\
  \ 解析和数据库错误的多层 Django 回溯。\n\n## 使用 AI 重构脆弱的测试\n\nAI 对于清理过于冗长或脆弱的测试也很有用。\n\n假设你向它展示如下测试：\n\
  \n* 硬编码的 URL 路径。\n* 重复的用户创建样板代码。\n* 手动登录逻辑。\n* 多个测试中重复的模型设置。\n\n在代码编辑器中使用代理模式时的示例提示词：\n\
  \n```\nRefactor these Django integration tests to reduce duplication. Extract factories\
  \ or helper methods. Avoid relying on hardcoded URLs.\n```\n\nAI 可以：\n\n* 用 `reverse()`\
  \ 替换字面路径。\n* 引入 `make_user` 辅助函数。\n* 在不测试登录视图的测试中，使用 `force_login` 代替手动 `POST` 登录。\n\
  * 将重复的设置合并到 `setUp` 或 `setUpTestData` 中。\n\nAI 在这里很有用，因为任务是机械性的：在不改变行为的情况下减少重复。\n\
  \n## 浅层 AI 生成测试的风险\n\n最大的危险不是语法错误，而是虚假的信心。\n\nAI 生成测试的常见问题如表 12.3 所示：\n\n| 问题 |\
  \ 解释 |\n| --- | --- |\n| 它们仅断言 `status_code == 200`。 | 页面可能返回 `200` 但仍然是错误的。 |\n\
  | 它们断言与业务规则无关的文本存在。 | 例如，断言页面上出现了 `Survey`，而不是验证正确的调查标题出现而错误的未出现。 |\n| 它们镜像实现而非测试行为。\
  \ | 如果你的视图调用 `Survey.objects.filter(is_published=True)`，AI 可能会生成一个断言完全相同查询的测试，而不是断言未发布的调查不可见。\
  \ |\n| 它们忽略负面情况。 | AI 倾向于生成正向路径测试，除非你显式要求失败模式。 |\n| 它们依赖脆弱的细节。 | 硬编码的主键、隐式排序，或假设\
  \ ID 从 1 开始。 |\n| 它们过度拟合当前代码。 | 如果你稍后重构内部逻辑但保留行为，浅层测试可能会不必要地中断，因为它们测试的是实现细节。 |\n\
  \n表 12.3：AI 生成测试的常见问题\n\n**提示词：** 请展示薄弱的 AI 生成测试示例以及如何改进它们。\n\n## 如何批判性地审查 AI 生成的测试\n\
  \n将 AI 输出视为来自一位热情但缺乏经验的开发者的拉取请求。以同样的怀疑态度审查它。\n\n问自己这些问题：\n\n1. 这个测试证明了什么行为？\n2.\
  \ 如果业务规则被破坏，这个测试会失败吗？\n3. 这是在断言有意义的结果，还是仅仅断言页面加载了？\n4. 它是在测试实现细节而不是可观察的行为吗？\n5.\
  \ 它是否覆盖了成功和失败两条路径？\n6. 它是否依赖关于 ID 或排序的脆弱假设？\n7. 设置是否最小化且清晰？\n\n如果你在故意破坏预期行为后测试仍然通过，那它就不是一个好测试。\n\
  \n一个有用的练习是：\n\n1. 接受 AI 生成的测试。\n2. 故意暂时破坏功能。\n3. 运行测试。\n4. 确认它因正确的原因而失败。\n\n如果它不失败，测试就是薄弱的。\n\
  \n## AI 在测试中最有价值的场景\n\nAI 最有助于：\n\n* 生成边缘情况列表\n* 起草重复的脚手架代码\n* 建议你可能遗漏的额外断言\n* 解释复杂的回溯\n\
  * 重构测试重复代码\n\n它最不可靠时：\n\n* 解释模糊需求\n* 推断安全规则\n* 猜测业务逻辑\n* 在没有明确约束的情况下从头设计测试策略\n\n\
  测试是可执行的规范。AI 可以帮你更快地编写它们，但它无法决定你的系统应该保证什么。\n\nAI 生成的测试看起来令人印象深刻，运行通过（绿色），却可能什么重要的东西都没断言。\n\
  \n审慎使用，AI 有帮助；懒惰使用，它只会给你更多代码去审查。区别不在于模型，而在于你，人类审查者。\n\n**提示词：** 请解释如何设计提示词以生成更高质量的自动化测试。\n\
  \n# 练习、参考资料和资源\n\n在本节中，你将接受本章所学内容的测试，并获得有用的参考资料和资源链接。\n\n## 检查你的理解\n\n回答以下关于本章涵盖主题的问题：\n\
  \n1. 测试金字塔的目的是什么？\n2. 什么造就了一个好的单元测试？\n3. Arrange–Act–Assert（准备-执行-断言）模式描述了什么？\n\
  4. 为什么不稳定测试被认为比没有测试更糟？\n5. Django 的 `TestCase` 类的作用是什么？\n6. 在 Django 中，单元测试和集成测试有什么区别？\n\
  7. 为什么 UI（端到端）测试应谨慎使用？\n8. 使用工厂相对于固定装置的主要优势是什么？\n9. 持续集成 (CI) 为项目做什么？\n10. AI 生成测试的最大风险是什么？\n\
  \n答案可在本书的 GitHub 仓库中找到，链接如下：\n\n[`github.com/markjprice/web-dev-ai/blob/main/docs/Appendix-A.pdf`](https://github.com/markjprice/web-dev-ai/blob/main/docs/Appendix-A.pdf)\n\
  \n## 链接\n\nMartin Fowler – 测试金字塔。对测试金字塔以及单元、集成和 UI 测试之间权衡的现代阐述。重要的概念基础：\n\n[`martinfowler.com/articles/practical-test-pyramid.html`](https://martinfowler.com/articles/practical-test-pyramid.html)\n\
  \nGoogle 测试博客 – 测试在厕所和测试策略。来自大规模工程团队的实用指南。对不稳定性和 CI 纪律有深刻见解：\n\n[`testing.googleblog.com/`](https://testing.googleblog.com/)\n\
  \nDjango 测试概览。Django 的测试文档异常强大：\n\n[`docs.djangoproject.com/en/6.0/topics/testing/overview/`](https://docs.djangoproject.com/en/6.0/topics/testing/overview/)\n\
  \n`pytest` 文档：\n\n[`docs.pytest.org/`](https://docs.pytest.org/)\n\n`pytest-django`\
  \ 文档：\n\n[`pytest-django.readthedocs.io/`](https://pytest-django.readthedocs.io/)\n\
  \nPlaywright 文档：\n\n[`playwright.dev/python/docs/intro`](https://playwright.dev/python/docs/intro)\n\
  \n# 总结\n\n在本章中，你为 TallyApp 构建了一个实用的测试策略。你学习了为什么测试金字塔倾向于许多快速的单元测试、较少的集成测试，以及仅有少量的浏览器级端到端测试。\n\
  \n你学习了以下内容：\n\n\n"
- "## 第 13 章：指定并构建初始项目\n\n## 学习目标\n\n- 单元测试、集成测试和端到端浏览器测试之间的实际区别，以及每种测试在 `Django`\
  \ 应用中的定位\n- 如何使用 `Django` 的 `TestCase` 和内置测试数据库，为 Python 函数、`Django` 模型、表单和业务逻辑编写单元测试\n\
  - 如何使用 `Playwright` 实现高价值的端到端 UI 测试，以验证真实的用户旅程，如登录、创建、编辑和删除流程\n- 如何使用工厂而非脆弱的固定装置来管理测试数据，以及如何避免脆弱的共享状态和隐藏耦合\n\
  - 持续集成如何在每次推送或拉取请求时自动运行测试，强制执行规范并保持主分支稳定\n- 如何使用 `AI` 工具起草测试、生成边缘情况、解释失败并重构重复的测试代码\n\
  - 如何批判性地审查 `AI` 生成的测试，以避免浅层断言和虚假自信，将测试视为可执行的规范而非装饰性代码\n\n最重要的理念是测试是关于行为的可执行决策。`AI`\
  \ 可以帮助编写代码，但你仍然必须决定应用程序必须保证什么。\n\n在下一章中，你将学习如何指定 `TallyApp` 项目并编写一次性提示词来构建初始项目。\n\
  \n## 在 Discord 上了解更多\n\n要加入本书的 Discord 社区——你可以在那里分享反馈、向作者提问并了解新版本发布——请扫描此二维码：\n\n\
  [`https://discord.gg/rdEsrVbbC`](https://discord.gg/rdEsrVbbC)\n\n![一个黑白条纹的条形码 AI\
  \ 生成的描述](img/B34553_12_04.png)\n\n一个好的软件项目在任何人编写代码之前就已经开始了。它始于理解目标。你在构建什么？它是为谁服务的？它旨在解决什么问题？同样重要的是，你选择不构建什么？\n\
  \n在本章中，我们将从孤立的示例转向 `TallyApp` 的第一个工作版本。它足够真实，可以教授规划、结构、数据建模、权限、表单和测试，但又足够小，可以完成。\n\
  \n`TallyApp` 是一个调查平台。经过批准的用户可以创建和发布调查。公众成员可以匿名完成调查。调查创建者可以查看单个回复和汇总结果。这种类型的网站熟悉、实用，且规模足够大，能迫使你做出真实的设计决策，而不会让你被不必要的复杂性压垮，也不会变成一个你可能花一年时间构建的产品。\n\
  \n本章的提示词可在以下链接找到：[`https://github.com/markjprice/web-dev-ai/blob/main/prompts/ch13-project/readme.md`](https://github.com/markjprice/web-dev-ai/blob/main/prompts/ch13-project/readme.md)\n\
  \n## 定义项目范围和目标\n\n在安装任何东西或编写代码之前，明确你要构建什么，同样重要的是，明确你不构建什么。清晰的范围使技术决策更容易，并使项目在增长过程中保持专注。\n\
  \n你将构建的项目是一个名为 `TallyApp` 的 Web 项目。从高层来看，`TallyApp` 允许人们创建调查、公开分享、收集回复并分析结果。这与许多现实世界的应用程序相似，给了我们大量机会去探索后端逻辑、前端展示、数据建模和可视化，而不会陷入不必要的复杂性。\n\
  \n### 用户旅程\n\n`TallyApp` 支持三个主要用户旅程。\n\n#### 用户旅程 1：创建并发布调查\n\n经过身份验证的用户可以创建带有标题和描述的调查，添加问题，并选择不同的问题类型，如多项选择和自由文本答案。调查准备就绪后，可以发布并生成一个可与他人共享的公共链接。这部分教授数据建模、表单、验证和权限。\n\
  \n#### 用户旅程 2：参与调查\n\n任何拥有公共链接的人都可以查看调查并提交回复，无需账户。界面特意设计得简单且专注于任务。受访者回答问题并提交表单，他们的回复会被可靠地存储。项目的这部分突出了\
  \ `URL` 设计、模板、表单处理，以及防止无效或重复提交。\n\n#### 用户旅程 3：查看并分析结果\n\n调查创建者可以查看汇总结果，如多项选择题的计数和百分比，以及自由文本问题的单个回复。结果使用表格和图表呈现，以便轻松发现模式。应用程序的这部分引入了报表查询、基本分析和数据可视化。\n\
  \n### 项目限制\n\n定义边界也很重要。`TallyApp` 不是一个功能齐全的企业级调查平台。我们不构建用户计费、团队协作、高级权限或问题之间的复杂分支逻辑。这些遗漏是刻意的。它们使重点保持在学习如何设计和构建一个完整的\
  \ Web 应用程序上，而不是追求更多功能或构建可变现的产品。\n\n### 为什么选择调查项目？\n\n学习 Web 开发的最佳方式是从事你自己会使用的真实项目，或者至少能激起你兴趣的项目。\n\
  \n如果你是一个学生或专业开发人员，对实现的项目或技术没有选择权，你如何能从事一个需要你感兴趣学习的技术的真实项目？\n\n#### 优秀学习项目的特征\n\n\
  为了帮助我们学习现代 Web 开发人员需要了解的各种技术，我们需要一个项目：\n\n- 真正需要技术和技能的组合。\n- 很酷、有趣且实用，因此它将从工程和创意两个角度拓展我们的技能。\n\
  - 尽可能真实，并且是我们自己会使用的。\n\n\n\n其他人已经实现了公开的产品，我们可以从中汲取灵感，最好有一些开源示例，以便我们查看代码实现。即使没有，有功能截图的产品也能帮助我们起草产品需求文档（`PRD`）。\n\
  \nPRD 列出了产品的功能，以便某人了解它应该做什么。它不说明如何做。那将在更详细的功能规格说明中定义。\n\n* 拥有足够小的`最小可行性产品 (MVP)`，使我们有一个可实现的短期目标。\n\
  * 拥有足够大的潜力，能延伸到长期更复杂的事物。\n\n当你在与 Bug 作斗争时，你需要保持动力。保持动力的最好方法是从事一个你自己会使用的项目。正如俗话所说，吃自己的狗粮（即自己使用自己的产品）。\n\
  \n`Prompt`：请解释产品需求文档和功能规格说明的区别，并以 Django Web 应用为例。\n\n## 调查和投票工具的功能\n\n就我个人而言，我曾使用调查和投票软件来深入了解我的学生和读者。例如，最流行的调查产品可能是\
  \ Google 表单，尽管还有几十种替代品，如下列表所示：\n\n* Google 表单：[`workspace.google.com/forms/about/`](https://workspace.google.com/forms/about/)\n\
  * Microsoft 表单：[`www.microsoft.com/en-us/microsoft-365/online-surveys-polls-quizzes`](https://www.microsoft.com/en-us/microsoft-365/online-surveys-polls-quizzes)\n\
  * Poll Everywhere：[`www.polleverywhere.com/`](https://www.polleverywhere.com/)\n\
  * TechRadar 的最佳列表：[`www.techradar.com/best/best-survey-tools`](https://www.techradar.com/best/best-survey-tools)\n\
  \n大多数调查工具都有免费层级，所以你可以试用它们。我们参考这些产品是为了寻找灵感，而不是试图复制它们。\n\n在探索了定义调查和投票工具的核心功能后，下一步是更仔细地审视任何调查的构建模块：你可以提出的不同类型的问题，以及每种问题如何塑造你收集的数据。\n\
  \n### 问题类型\n\n有几十种问题类型，从多项选择到通过矩阵和自由文本进行的量表选择，如图 13.1 所示：\n\n![](img/B34553_13_01.png)\n\
  \n图 13.1：Google Forms 中的调查问题类型\n\n其中一些问题类型应该很容易实现，比如纯文本回复或从多个选项中选择一个。一旦你考虑到所有潜在的可能性，其他类型可能更难实现。\n\
  \n### 投票和测验\n\n调查工具与其他工具（如实时投票和测验构建器）具有相似的功能。它们都需要某种方式来构建调查、投票和测验，某种方式来参与，最后是分析结果的方法。\n\
  \n我经常进行现场培训课程和网络研讨会。询问听众一些关于他们自己的情况很有用，比如他们身在世界何处，他们目前的经验水平，以及他们期望从课程中获得什么。调查和实时投票的主要区别在于问题项可供回答的时长。与测验的主要区别在于正确答案的概念和最后的评分。\n\
  \n测验也有很多相似之处。主要区别在于问题项类型的广度。你可以想象，一个用于学习数学或物理的测验构建器可能会有一些相当复杂的组件，实现起来也很复杂。\n\n###\
  \ 分析回复\n\n调查工具的另一个主要功能是能够分析结果，使用从基本图表到复杂的机器学习算法来发现异常模式。\n\n## 什么是产品需求？\n\n产品需求文档是分析业务问题的结果。它定义了一组建议功能，用于解决软件旨在解决的问题。\n\
  \n### 最低需求概览\n\n调查工具的最小可行性产品将包括：\n\n* 一个匿名参与调查的网站\n* 一个查看调查结果的网站\n* 用于存储调查问题项和回复的数据存储\n\
  \n### 最低网站要求\n\n为了参与调查，解决方案应提供一个网站。这是为了让调查能被尽可能多的人访问。每个设备都有网页浏览器，所以网站的覆盖面最广。我们也可以使用超链接轻松分享调查。\n\
  \n网站应响应一个请求，以唯一值标识的调查，如下链接所示：\n\n[`www.tallyapp.net/123456`](https://www.tallyapp.net/123456)\n\
  \n网站应允许匿名访问者，向他们展示问题项，并记录他们的回复。为保持简单，可以不限制多次参与调查。不需要用户注册或身份验证检查。\n\n`Prompt`：匿名调查提交存在哪些安全风险？在调查\
  \ Web 应用中还应警惕哪些其他漏洞？\n\n### 最低问题项类型\n\n网站应支持以下问题类型：\n\n* 单行纯文本\n* 多行纯文本\n* 评分（1-10）\n\
  * 多项选择（单选）。显示单选按钮\n\n每种项类型都应允许纯文本问题。\n\n### 最低数据存储要求\n\n调查及其回复应如何存储？它需要简单。起初，人们可能会认为文档数据库更简单，因为调查看起来像一个嵌套文档：调查、问题、选项、回复。但\
  \ TallyApp 还需要权限、报告、过滤和聚合。对于本书来说，关系型数据库是更好的教学选择，因为它使这些关系变得显式。\n\n### 最低分析应用要求\n\n\
  分析应用应显示所有调查及其状态的列表，例如，它们是否激活、是否完成、有多少人参与、答案详情以及结果摘要。数字结果应以表格数据和图表的形式呈现。\n\n`Prompt`：初学者在为他们的第一个\
  \ Web 应用定义范围时会犯哪些错误？\n\n## 扩展需求的想法\n\n调查工具我最喜欢的方面之一是，有许多领域可以选择扩展最小产品：\n\n* 一个访问者可以注册并跟踪他们已完成的调查的网站\n\
  * 几十种不同的问题类型\n* 几十种分析结果的方法\n* 多种存储问题和结果的方式，从完全规范化的数据库到基于文档的云存储\n* 多种处理结果并在数据存储之上提供服务层的方式\n\
  \n我在线发布了更多扩展调查项目的想法。你可以在以下链接阅读：[`github.com/markjprice/web-dev-ai/blob/main/docs/extending-ideas.md`](https://github.com/markjprice/web-dev-ai/blob/main/docs/extending-ideas.md)\n\
  \n现在让我们创建 TallyApp 项目。\n\n# 创建 TallyApp 项目\n\n本节创建 TallyApp 的第一个工作版本。它特意保持精简：一个\
  \ `Survey` 模型，加上创建、编辑和删除屏幕（仅限登录用户）。还包括注册、登录和登出。UI 使用纯 CSS 进行简洁、简单的样式设计，并包含用于徽标和编辑页面上调查草图插图的\
  \ SVG 资源。\n\n本节假设：\n\n* Django 6\n* Python 3.14\n* 一个本地虚拟环境\n\n\n\n* SQLite 数据库（稍后可替换为\
  \ PostgreSQL）\n\n# 实用的 AI 辅助项目规划\n\n您将在下一章学习的正式规格驱动开发可能很有用，但对于适合初学者的流程来说，它往往过于繁重。完整的规格系统涉及结构化需求文档、可追溯性、分阶段细化循环，有时还包括专用命令集或多智能体\
  \ AI 工作流。这对于构建受监管或任务关键型系统的大型团队很有价值。但对于学习如何设计和构建整洁的 Django 应用程序来说，这并非必要。\n\n相反，您可以使用轻量级方法。思路是用\
  \ Markdown 编写一份简短、结构化的项目简报，然后使用精心设计的一次性提示词来引导 AI。\n\n**提示词**：展示一个针对 TallyApp 的糟糕一次性提示词示例，并说明如何改进它。\n\
  \n例如，在构建 TallyApp 之前，创建一个名为 `project-brief.md` 的文件，其中包含明确定义的章节，如：\n\n* 目标\n* 目标用户\n\
  * 核心功能\n* 非目标\n* 技术约束\n* 完成定义\n\n这迫使您在编写代码前先定义范围。包含*非目标*章节可防止意外的功能蔓延，这是人主导和 AI 辅助开发中最常见的问题之一。\n\
  \n简报编写完成后，您可以按以下思路提示您的 AI 助手：\n\n```\nI am building a Django 6 project called TallyApp.\
  \ The attached Markdown file describes the requirements. Please:\n- Break the project\
  \ into implementation phases.\n- Propose Django models and relationships.\n- Suggest\
  \ URL patterns and app structure.\n- Provide initial scaffolding for models, views,\
  \ and templates.\n- Restate the requirements in your own words before generating\
  \ code and identify any ambiguities.\n```\n\n最后那条指令很重要，因为它强制 AI 在编码前复查需求。这能减少幻觉，并使假设显性化。它还体现了一个良好的职业习惯：实现前先澄清。\n\
  \n这就是简报重要的原因。Codex 或 Claude Code 能在几秒钟内创建 Django 文件，但除非您先做出决定，否则它们仍会做出产品决策。TallyApp\
  \ 是否应允许某人提交同一份调查两次？调查发布后是否应被锁定？结果是否应存储以便日后轻松生成报表，还是仅用于当前的简单显示？这些不是编码问题。它们是设计决策。在要求\
  \ AI 构建任何东西之前，把它们写下来。简报越好，代码就越有可能变好。\n\n**提示词**：为什么要求 AI 在生成代码前复述需求能减少幻觉？请解释结构化提示背后的心理学原理，以及为什么它能提高代码质量。\n\
  \n## 在运行前审查 AI 的工作\n\n收到输出后，不要盲目地将其粘贴到编辑器中。您需要审查它。这是一份检查清单：\n\n* 审查模型关系。\n* 确认字段数据类型。\n\
  * 警惕不必要的复杂性。\n* 运行数据库迁移和测试。\n\n特别重要的是要留意安全问题：\n\n* 每个表单模板都应包含 `{% csrf_token %}`\n\
  * 受保护的视图应使用 `@login_required` 或 `LoginRequiredMixin`\n* 警惕可能导致 SQL 注入攻击的原始 SQL 查询，因此代码应专门使用\
  \ Django 对象关系映射器 (ORM)\n* 用户输入绝不应未经转义直接渲染，例如 `{{ variable }}` 会自动转义输出\n* 确保 `SECRET_KEY`\
  \ 未在任何已提交的文件中硬编码\n* 调查提交视图应验证所有权和权限\n\nAI 生成的是草稿，但您仍然是对生成的代码应用人类判断的软件工程师。\n\n这种方法捕捉了规格驱动思维的许多优势：\n\
  \n* 明确的范围\n* 定义的约束\n* 清晰的成功标准\n* 减少歧义\n* 编码前的结构化规划\n\n但它避免了正式规格框架的开销。\n\n随着技能增长和项目变得更复杂，您可以采用更正式的规格驱动方法，正如您将在下一章看到的那样。但对于构建\
  \ TallyApp 和掌握 Web 开发基础知识，清晰的项目简报加上精心设计的提示词，是在结构与简洁之间取得的恰当平衡。\n\n**提示词**：比较一次性提示与迭代优化提示在构建\
  \ Django 项目时的异同。\n\n## 选择 Django 版本\n\n虽然 Django 5.2 是唯一活跃的**长期支持 (LTS)** 版本（支持至\
  \ 2028 年 4 月），但我们将以 Django 6.0 为目标，因为 6.x 系列将在 2027 年 4 月推出 LTS 版本 6.2，这在本书的预期生命周期内，如*图\
  \ 13.2* 所示，详见链接：[`www.djangoproject.com/download/`](https://www.djangoproject.com/download/)\n\
  \n![](img/B34553_13_02.png)\n\n图 13.2：Django 支持的发布版本\n\n既然我们已选择以 Django 6.0 或更高版本为目标，让我们编写项目简报。\n\
  \n## TallyApp 的 AI 项目简报\n\n在项目根目录下创建一个名为 `project-brief.md` 的文件，包含以下 Markdown 代码：\n\
  \n此项目简报可从以下链接下载：[`github.com/markjprice/web-dev-ai/blob/main/Code/TallyProject/project-brief.md`](https://github.com/markjprice/web-dev-ai/blob/main/Code/TallyProject/project-brief.md)\n\
  \n\n\n# TallyApp – 项目简介\n\n## 1. 概述\n\n### 项目目标\nTallyApp 是一个 Web 应用程序，允许经过批准的用户创建调查并公开发布。公众成员无需注册即可参与调查。调查创建者可以查看个别回复和汇总结果。\n\
  \n### 解决的问题\nTallyApp 允许个人或组织使用多种类型的调查问题快速收集结构化反馈，而无需构建自定义软件。\n\n---\n\n## 2. 目标用户\n\
  \n### 调查创建者\n- 必须使用有效的电子邮件地址注册账户。\n- 必须经过管理员批准才能创建调查。\n- 可以创建、发布和结束调查。\n- 可以查看结果（个别和汇总）。\n\
  \n### 调查参与者\n- 无需注册。\n- 可以匿名提交回复。\n\n### 目标用户的主页\n- 描述网站功能。\n- 两个大按钮用于：\n    1.\
  \ 创建调查（注册或登录）\n    2. 参与调查\n\n---\n\n## 3. 核心功能（版本 1 范围）\n\n### 认证与授权\n- 定义一个名为\
  \ `SurveyCreators` 的自定义组，其成员资格授权调查创建功能。\n- 调查创建者注册。\n- 用户创建调查前需要管理员批准；用户获批后将被添加到\
  \ `SurveyCreators` 组。\n- 登录和登出。\n- 只有 `SurveyCreators` 组的成员才能创建调查。\n\n### 调查创建\n\
  - 创建或编辑调查，包含：\n  - 标题\n  - 描述\n  - 开始日期\n  - 可选的结束日期\n  - 发布状态\n  - “显示在主页”标志（默认：true）\n\
  - 未发布的调查没有结果。\n- 调查发布后不能编辑。\n- 调查不能取消发布。\n- 调查可以提前结束。此操作不可逆。\n- 调查可以是开放式的（无结束日期）。\n\
  - 一旦结束，用户无法参与调查。\n- 调查包含零个、一个或多个问题项，可通过调查编辑页面添加、编辑或移除。\n- 每个调查都有一个唯一的公共 URL，在创建后立即显示在调查编辑页面上。\n\
  - `start_date` 在未来的已发布调查无法参与，并显示带有开始日期的警告页面。\n\n### 问题类型\n每个调查可以包含以下类型的多个问题：\n1.\
  \ 单选题\n2. 多选题\n3. 文本输入（自由形式）\n4. 矩阵评分，带有评分范围，例如针对一个或多个项目的 1 到 5 分\n\n问题/选项创作 UI\
  \ 必须完全实现。\n- 混合问题类型的动态表单处理。\n\n### 公共调查访问\n- 公共主页列出已发布的调查（如果“显示在主页”为真），并提供参与调查的公共\
  \ URL。\n- 调查在列表视图中支持分页。\n- 公共用户可以提交回复。\n- 调查可能显示“截至目前”的结果。\n\n### 结果\n调查创建者可以：\n\
  - 查看汇总结果。\n- 查看个别回复。\n- 即使调查仍在进行中也可查看回复。\n- 查看适合结果的饼图和条形图。\n- 查看按电子邮件/IP/会话划分的重复提交报告。\n\
  \n### 图形、样式和品牌\n- 用于编辑页面的徽标和调查草图插图的 `SVG` 资源。\n- UI 使用 `CSS` 和 `SVG` 文件为 TallyApp\
  \ 提供微妙的品牌标识：渐变标题或导航栏、彩色徽标 `SVG`、浅色调背景区域。\n\n### 数据存储\n- `SQLite` 数据库。\n- 具有清晰外键关系的关系模型。\n\
  \n### 测试\n- 基本单元测试：\n  - 模型行为\n  - 权限\n  - 发布规则\n  - 调查回复提交\n- 使用 `Playwright` 进行端到端测试：\n\
  \  - 每个用户故事。\n\n---\n\n## 4. 非目标（超出范围）\n- 无支付功能。\n- 无社交认证。\n- 无实时更新（无 `WebSockets`）。\n\
  - 无高级分析。\n- 无 `CSV` 导出。\n- 无 `REST API`。\n- 除管理员批准和标准用户外，无角色系统。\n\n---\n\n## 5.\
  \ 用户故事\n1. 作为用户，我想注册以便创建调查。\n2. 作为管理员，我想在用户创建调查前批准他们。\n3. 作为已批准用户，我想创建并发布调查。\n4.\
  \ 作为调查创建者，我想提前结束调查。\n5. 作为公共访客，我想在不注册的情况下完成调查。\n6. 作为调查创建者，我想查看汇总结果和个别回复。\n\n---\n\
  \n## 6. 数据模型（高层）\n\n### 用户\n- 扩展 `Django` 的内置 `User` 模型。\n- 有一个名为 `SurveyCreators`\
  \ 的自定义组，其成员资格授予创建、编辑和删除调查功能的访问权限。\n\n### 调查\n- 创建者（指向 `User` 的 `ForeignKey`）\n-\
  \ 标题\n- 描述\n- 开始日期\n- 可选的结束日期\n- 发布标志\n- 显示在主页标志\n- 创建时间戳\n- 提前结束标志（可选）\n\n### 问题\n\
  - 调查（`ForeignKey`）\n- 文本\n- 问题类型（单选、多选、文本）\n- 排序字段\n\n### 选项\n- 问题（`ForeignKey`）\n\
  - 文本\n- 排序字段\n\n### 回复\n- 调查（`ForeignKey`）\n- 可选的电子邮件标识符\n- 提交时间戳\n\n### 答案\n- 回复（`ForeignKey`）\n\
  - 问题（`ForeignKey`）\n- 选中的选项（`ManyToMany` 或中间模型，视情况而定）\n- 文本答案（用于文本问题）\n\n---\n\n\
  ## 7. 技术约束\n- `Python 3.14`\n- `Django 6.x`\n- `SQLite` 数据库\n- 简洁、现代、移动端友好的响应式 UI\n\
  - 服务端渲染模板\n- 无需 JavaScript 框架\n\n---\n\n## 8. 安全与权限\n- 只有经过批准的用户才能创建调查。\n- 只有调查创建者（和管理员）可以查看他们自己调查的结果。\n\
  - 公共用户可以提交回复。\n- 调查发布后不能修改。\n- 只有管理员可以批准用户创建调查。\n\n---\n\n## 9. 完成定义\n- 用户可以注册和登录。\n\
  - 管理员可以批准用户。\n- 经过批准的用户可以创建和发布调查。\n- 公共用户可以提交回复。\n- 调查创建者可以查看结果。\n- 分页功能正常。\n- 基本单元测试通过。\n\
  - 应用程序在本地使用 `SQLite` 运行无错误。\n\n---\n\n## 10. 未来增强（非版本 1）\n- `CSV` 导出\n- 图表和可视化分析\n\
  - 调查日程自动化\n- 电子邮件邀请\n- API 端点\n- 超出基本批准的基于角色的权限\n\n---\n\n## 附录\n\n### 项目简介模板\n\
  空白项目简介模板可从以下链接下载：\n[项目简介模板下载链接](https://github.com/markjprice/web-dev-ai/blob/main/Code/TallyProject/project-brief-template.md)\n\
  \n### 回顾完整步骤\n在请求 AI 生成代码之前，了解从想法到可用应用程序的完整步骤会有所帮助。提示词只是该过程中的一步，如 *图 13.3* 所示：\n\
  \n![图 13.3：在 AI 协助下从想法到可用项目](img/B34553_13_03.png)\n\n项目简介指导 AI，但人工审查和迭代才能将生成的代码转化为可用的应用程序。人工判断是关键。AI\
  \ 编写代码。你决定构建什么。\n\n总结：清晰思考 → 编写扎实的简介 → 指导 AI → 审查一切 → 修复错误 → 迭代。好的结果来自好的简介和仔细的审查，而不是魔法提示词。\n\
  \n### 改进你的项目简介\n在请求 AI 按照你的项目简介构建新项目之前，让 AI 审查一下是个好习惯。例如：\n\n\n\n# 阅读 project-brief.md\
  \ 并作为高级工程师在实施前审查新项目\n\n您的工作是找出所有缺失、不清晰或有风险的地方。分阶段工作：\n\n## 第一阶段：差距分析\n\n识别以下方面缺失或薄弱的领域：\n\
  \n- 需求清晰度和范围边界\n- 用户旅程和边缘情况\n- 数据模型假设\n- 权限和安全\n- 验证和错误处理\n- 性能和可扩展性风险\n- 测试策略\n\
  - 运维关注点（部署、配置、密钥）\n\n暂不提出解决方案。只列出差距和歧义。\n\n## 第二阶段：针对性访谈\n\n向我提出聚焦问题以解决这些差距。\n\n\
  - 跳过显而易见或已定义明确的领域\n- 优先解决高影响力的不确定性\n- 一次问一个主题，而非一长串清单\n- 追求具体决策，而非模糊偏好\n\n持续直到不再有有意义的未知项。\n\
  \n## 第三阶段：权衡与假设\n\n对于任何剩余的开放决策，提出 2-3 个选项并附带清晰的权衡分析。\n\n## 第四阶段：更新简报\n\n生成改进版文件，命名为\
  \ `project-brief-ai-enhanced.md`，要求：\n\n- 保留所有正确的现有内容\n- 澄清模糊章节\n- 添加缺失的约束和边缘情况\n\
  - 使假设显性化\n\n完整展示更新后的文件。除非明显错误，否则不要删除章节。\n\n简洁、直接、务实。避免泛泛建议。\n\n---\n\n这样能增强您的项目简报，因为进行差距分析能阻止\
  \ AI 立即提出薄弱问题，例如：\n\n- 您的用户是谁？\n\n相反，它必须先思考，再提问。\n\n这让 AI 放慢脚步，在跳入代码前审查简报。这更接近资深开发者在实施前审查功能需求的方式。\n\
  \n如果您偏好更紧凑的提示版本：\n\n```\n阅读 project-brief.md 并像高级工程师一样在实施前审查它。\n1. 列出缺失或不清晰的领域（需求、边缘情况、数据模型、权限、验证、性能、测试）。\n\
  2. 通过聚焦问题访谈我以解决最重要的差距。一次问一个主题。\n3. 对于未决决策，提出带权衡分析的选项。\n4. 生成改进版简报，保留正确内容并使假设显性化。\n\
  跳过显而易见的点。直接且务实。\n```\n\n**提示**：盲目信任 AI 生成的脚手架代码有什么风险？\n\n---\n\n# 使用 design.md 引导\
  \ AI\n\n项目简报定义了系统*应该做什么*。它仅简要定义了系统*看起来、感觉或表现如何*从用户界面角度。如果您跳过这一步，AI 将替您做这些决定。通常您需要更具体，尤其是为拥有强品牌的组织创建公共网站时。\n\
  \n避免此问题的简单方法是：在项目简报旁创建第二个文档：`design.md`。\n\n该文件用通俗语言记录您的设计决策，以便您和 AI 助手遵循相同规则。\n\
  \n## 为什么需要单独的设计文档？\n\n将设计与项目简报分离能保持关注点清晰：\n\n- 项目简报定义行为、功能和约束\n- 设计文档定义布局、交互和视觉一致性\n\
  \n这反映了真实项目的常见结构。产品和工程定义行为。设计定义行为如何呈现。\n\n对于像 TallyApp 这样的学习项目，像素级完美设计非必要。一致性足矣。\n\
  \n## design.md 包含什么？\n\n有用的 `design.md` 不必冗长；它应回答几个实际问题：\n\n### 1. 布局与结构\n\n描述整体页面结构：\n\
  \n- 带导航的页头（**首页**、**我的调查**、**登录/注册**）\n- 固定宽度容器的主内容区\n- 页脚（可选）\n\n```\n页面使用简单布局：顶部导航栏、居中内容列、极少干扰。避免复杂多列布局。\n\
  ```\n\n### 2. 导航与流程\n\n解释用户如何在应用中移动：\n\n- 登录后落地页\n- 如何访问调查创建\n- 如何返回上一页\n\n```\n\
  登录后，用户重定向到\"我的调查\"。主要操作应无需滚动即可见。\n```\n\n### 3. 表单与交互模式\n\n定义表单行为：\n\n- 标签位于输入框上方\n\
  - 清晰的验证消息\n- 提交按钮在底部\n\n```\n所有表单使用服务端验证，并在每个字段上方显示清晰错误消息。避免大量 JavaScript 表单逻辑。\n\
  ```\n\n### 4. 样式方法\n\n设定样式约束：\n\n- 使用原生 CSS\n- 除非必要，避免重型框架\n- 偏好简单配色方案\n\n```\n\
  采用极简 CSS 方法。不使用 CSS 框架。保持中性色调，仅用一个强调色表示操作。\n```\n\n### 5. 组件与复用\n\n鼓励一致性：\n\n- 按钮到处外观一致\n\
  - 表格遵循一致结构\n- 消息使用共享样式\n\n```\n为按钮、警告和表格使用可复用 CSS 类。不要为每页重新定义样式。\n```\n\n### 6.\
  \ 无障碍与清晰度\n\n即使在基础层面：\n\n- 使用语义化 HTML\n- 确保文本可读\n- 避免隐藏交互\n\n```\n优先使用语义化 HTML 元素。按钮应为\
  \ `<button>`，而非可点击的 `<div>` 元素。\n```\n\n## 配合 AI 工具使用设计文件\n\n一旦您有了 `project-brief.md`\
  \ 和 `design.md`，可在提示中同时包含两者：\n\n```\nproject-brief.md 文件定义功能。design.md 文件定义布局、样式和交互规则。请同时遵循两者。\n\
  ```\n\n这能减少常见问题：AI 生成的代码混合样式方法或创建不一致的 UI 模式。\n\n一些工具开始正式化这一理念。例如，Anthropic 的 Claude\
  \ Design 鼓励将设计意图与实现分离，以便模型生成更一致的用户界面。\n\nAnthropic Labs 推出 Claude Design：[`www.anthropic.com/news/claude-design-anthropic-labs`](https://www.anthropic.com/news/claude-design-anthropic-labs)\n\
  \n您不需要像 Claude Design 这样的特殊工具来应用相同理念。一个简单的 `design.md` 文件即可获得大部分收益。\n\n**良好实践**：不要将\
  \ `design.md` 变成完整的设计系统。对 TallyApp 而言，一页指南足矣。目的不是设计生产级 UI。目的是阻止 AI 臆造一个。\n\n您越清晰地预先定义行为和设计，后期修复代码的时间就越少。\n\
  \n---\n\n# 应用项目简报的一次性提示\n\n您可以将以下内容粘贴到 AI 助手中，附上或粘贴项目简报后使用：\n\n\n\n# TallyApp Django\
  \ 项目构建提示词\n\n我正在构建一个名为 **TallyApp** 的 Django 6 Web 应用程序。当前目录下的 `project-brief.md`\
  \ 文件包含完整的项目简介，`design.md` 文件定义了布局、样式和交互规则。请遵循这两个文件。\n\n在生成任何代码之前：\n\n1. 用你自己的话重述项目需求。\n\
  2. 识别任何需要澄清的歧义或设计决策。\n3. 列出你将做出的假设。\n4. 强调潜在的复杂性风险。\n\n然后：\n\n5. 将实现分解为逻辑开发阶段。\n\
  6. 提出 Django 应用结构。\n7. 设计带有字段和关系的数据模型。\n8. 建议 URL 模式。\n9. 概述视图及其职责。\n10. 定义权限规则和执行策略。\n\
  11. 解释调查发布后如何变为不可变。\n12. 解释多选答案的聚合逻辑。\n\n仅在完成上述分析后，为以下内容生成适合初学者的脚手架代码：\n\n- `models.py`\n\
  - 基础表单\n- 视图\n- `urls.py`\n- 最小模板\n- 静态文件（包括 CSS 和 SVG）\n- 基础单元测试\n- 使用 Playwright\
  \ 的 E2E 测试\n\n保持实现简单。除非有明确理由，避免使用高级模式。解释你为何选择特定的建模决策，特别是针对多选答案和文本响应。\n\n---\n\n\
