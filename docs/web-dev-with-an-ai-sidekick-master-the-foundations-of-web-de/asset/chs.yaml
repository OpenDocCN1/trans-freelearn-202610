  \ E2E 测试的可靠性？请解释 Playwright 中 `test.skip()` 的工作原理及其使用时机。\n\n### 在 VS Code 中使用 Copilot\n\
  \n我也在 VS Code 中使用了 Copilot，如*图 13.12* 所示：\n\n![](img/B34553_13_12.png)\n\n*图 13.12：在\
