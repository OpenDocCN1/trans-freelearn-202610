  \n既然您已经了解本书其余章节的内容安排，让我们来搭建您的开发环境。虽然我们要等到本书的*调查项目*部分才会开始构建完整项目，但在所有语言学习章节中，您都会想要编写代码片段并亲眼看到它们运行。\n\
  \n# 搭建您的 Web 开发环境\n\n在开始编程之前，您需要一个支持多种语言（包括 HTML、CSS、JavaScript、TypeScript、SQL 和\
  \ Python）的代码编辑器，无论是来自 Microsoft 还是第三方。我推荐 VS Code，因为它支持所有常见语言的扩展，且可在 Windows、Mac\
  \ 和 Linux 上跨平台运行。\n\nVS Code 是所有开发者中最受欢迎的代码编辑器或 IDE，在 Stack Overflow 2025 年调查中，超过\
  \ 75% 的专业开发者选择了它，您可以通过以下链接阅读该调查：[`survey.stackoverflow.co/2025/technology/#1-dev-id-es`](https://survey.stackoverflow.co/2025/technology/#1-dev-id-es)。\n\
