  \n## 了解 VS Code 版本\n\nMicrosoft 几乎每月发布一个新的 VS Code 功能版本，并更频繁地发布错误修复版本。例如：\n\n* 版本\
  \ 1.109.0，2026 年 1 月功能发布\n* 版本 1.109.1，2026 年 1 月错误修复发布\n\n本书使用的版本是 1.112.0，即 2026\
  \ 年 4 月的功能发布版，但 VS Code 的版本不如您安装的扩展版本重要。请确保所有扩展都保持最新。\n\n## VS Code 键盘快捷键\n\n如果您想自定义\
  \ VS Code 的键盘快捷键，可以参考以下链接：[`code.visualstudio.com/docs/getstarted/keybindings`](https://code.visualstudio.com/docs/getstarted/keybindings)。\n\
  \n我建议您从以下列表中下载适用于您操作系统的 VS Code 键盘快捷键 PDF：\n\n* Windows：[`code.visualstudio.com/shortcuts/keyboard-shortcuts-windows.pdf`](https://code.visualstudio.com/shortcuts/keyboard-shortcuts-windows.pdf)\n\
  * macOS：[`code.visualstudio.com/shortcuts/keyboard-shortcuts-macos.pdf`](https://code.visualstudio.com/shortcuts/keyboard-shortcuts-macos.pdf)\n\
  * Linux：[`code.visualstudio.com/shortcuts/keyboard-shortcuts-linux.pdf`](https://code.visualstudio.com/shortcuts/keyboard-shortcuts-linux.pdf)\n\
  \n现在您已经搭建好开发环境，让我们深入了解如何充分利用 AI 聊天机器人，让它成为您学习 Web 开发的教练。\n\n# 让 AI 聊天机器人做您的教练进行学习\n\
  \n如果善加利用，像 ChatGPT 这样的 AI 聊天机器人可以成为有用的学习工具。\n\n本节将比较三种常用于学习 Web 开发的聊天机器人。\n\n**良好实践**：如果您是\
  \ Web 开发新手，或不确定选择哪些工具，请使用以下设置。这是本书中最简单的路径，也是示例所假设的环境：\n\n* **聊天机器人**：ChatGPT（免费版或每月\
  \ 20 美元的 Plus 版）\n\n\n\n*   **代码编辑器或 IDE**：VS Code（免费）\n*   **IDE 集成编码助手**：GitHub\
  \ Copilot（个人计划如 Copilot Free 和 Copilot Pro 包含 GitHub AI Credits 额度，因计划而异）\n*   **命令行编码助手**：OpenAI\
  \ Codex（因为它目前包含在 ChatGPT Plus 中）\n\n你可以仅使用这些工具完成本书的所有内容。其他选项如 Claude 或 Gemini 也很优秀，鼓励你稍后探索。但过早切换工具会让人不知所措，拖慢学习进度。从简单入手，建立信心，再进行实验。\n\
  \n现在让我们对比三大聊天机器人：OpenAI 的 ChatGPT、Anthropic 的 Claude 和 Google 的 Gemini。\n\n## OpenAI\
  \ 的 ChatGPT\n\nChatGPT 在解释、调试帮助以及学习过程中的反复交互方面特别有用。当你在 HTML 语义、 JavaScript 怪癖或 Django\
  \ 数据模型逻辑上卡住时，一个结构良好的提示词通常能产生有用的解释。\n\n### 免费版与付费订阅\n\n*   **免费版**：免费版非常适合对话式学习，但不包含\
  \ Codex 编码代理的访问权限。\n*   **Go 版（8 美元/月）**：扩展访问权限，更多消息、上传、图像创建和更长的记忆。\n*   **Plus\
  \ 版（20 美元/月）**：访问先进的 GPT 系列模型，通常在推理、代码生成和长会话上下文保持方面表现更好。可访问 Codex 编码代理、项目和自定义 GPT。如果你想要更强能力但不想承担高昂月费，这是我的推荐。\n\
  *   **Pro 版（100 美元/月）**：比 Plus 版多 5 倍用量，拥有 Frontier Pro 模型，最大程度访问 Codex 和深度研究，以及无限且更快的图像创建。\n\
  *   **商业版（20 美元/月/席位）/ 企业版**：最适合企业团队，因为需要 2 个以上席位按年计费。OpenAI 承诺你的数据绝不会用于训练其模型。\n\
  \nChatGPT 定价信息请见：[`chatgpt.com/pricing/`](https://chatgpt.com/pricing/)\n\n所有主要\
  \ AI 提供商都提供一系列模型，在速度、成本与能力之间权衡。虽然名称不同，但模式一致。OpenAI 将其更快、思考较少的模型命名为 `mini`。例如 `GPT-5\
  \ mini`。Google 将其 Gemini 更快、思考较少的模型命名为 Flash，将其深度思考模型命名为……这使其在结构上比主要基于用户反馈训练的模型更谨慎。你可以通过以下链接阅读更多关于\
  \ Claude 这方面的内容：[`deeperinsights.com/ai-review/claude-ai-features-uses-comparison-to-chatgpt/`](https://deeperinsights.com/ai-review/claude-ai-features-uses-comparison-to-chatgpt/)\n\
  \n*   代码输出不错，但在原型设计时比 ChatGPT 更谨慎、增量式\n*   如果你偏好更稳健、解释性强的风格，Claude 是个好选择\n\nAnthropic\
  \ 提供几个版本的 Claude，通常称为 `Haiku`、`Sonnet` 和 `Opus`。这些不是完全不同的系统；它们是在速度、成本和能力之间的不同权衡。\n\
  \n简单理解它们：\n\n*   `Haiku` 追求速度\n*   `Sonnet` 适合日常工作\n*   `Opus` 解决最难问题\n\n大多数初学者应从\
  \ `Sonnet` 开始，仅在有明确理由时切换。如果任务简单或重复，尝试 `Haiku`。如果任务复杂、不明确或屡试不爽，升级到 `Opus`。\n\n不要把模型选择视为永久决定。选择适合工作的模型。\n\
  \n你可以通过以下链接注册 Claude：[`claude.ai/`](https://claude.ai/)\n\n## Google 的 Gemini\n\n\
  自首次发布以来 Gemini 已有改进，现在在许多 Web 开发任务上与 ChatGPT 和 Claude 具有竞争力。\n\n### 为什么人们喜欢它\n\n\
  *   强大的多模态支持。文本、图像、文档、截图\n*   良好的 JavaScript 和 Web 相关回答\n\n### 缺点\n\n*   回答有时感觉比较泛泛\n\
  *   在深度后端或特定框架问题上仍不均衡\n\n你可以通过以下链接注册 Gemini：[`gemini.google.com/`](https://gemini.google.com/)\n\
  \n## 选择哪个聊天机器人？\n\n如果你想选择心仪的聊天机器人，我建议各试用一个月，看哪个最合你心意。每个都有独特的个性，适合不同的人。\n\n现在我们已回顾了三大聊天机器人，你可以决定更倾向于用哪一个来学习本书\
  \ `Frontend Web Development` 和 `Backend Web Development` 部分涵盖的所有语言。你甚至可以选择我未涵盖的其他聊天机器人，或同时使用多个并对比结果。这是一种有用的学习方式，看看每个聊天机器人在回答中选择包含什么信息。如果多个聊天机器人强调相同信息，你可以更放心地认为它们给出了准确回答。\n\
  \n学习早期，一致性比优化更重要。使用一个简单、广泛支持的设置能帮你专注于概念而非工具。不要浪费第一周比较工具。选定一套开始学习。工具变得快，但你思考系统和代码的方式将长存。无论你选择哪个聊天机器人作为学习教练，现在让我们看看一些适用于所有\
  \ AI 聊天机器人的重要要点。\n\n## 充分利用本书建议的提示词\n\n全书中你会看到建议的提示词，可复制粘贴到 ChatGPT、Gemini、Claude\
  \ 等聊天机器人中。这些提示词旨在为你深入探索主题提供起点，但如何使用它们与提示词本身同等重要。\n\n例如，这是本章的第一个建议提示词：\n\n\n\n**提示：**\
  \ 请给我一份清单，用于评估 AI 回复是否真正帮助我学习了 Web 开发。\n\n在本书的 GitHub 仓库中，我为每一章创建了包含所有建议提示词的页面。例如，您可以通过以下链接找到本章的建议提示词：\n\
  \n[`github.com/markjprice/web-dev-ai/blob/main/prompts/ch01-intro/readme.md`](https://github.com/markjprice/web-dev-ai/blob/main/prompts/ch01-intro/readme.md)\n\
  \n在 2026 年春季撰写本书时，我使用了拥有 Pro 订阅的 Gemini 及其**快速**模型来回答每一个可选提示词，如*图 1.5*所示：\n\n![](img/Image4065.png)\n\
  \n图 1.5：配置 Gemini Pro 以使用快速响应\n\n虽然您可以在本书的 GitHub 仓库中查看那些 Gemini Pro 的回复，但我强烈建议您将相同（或类似）的提示词输入到您首选的\
  \ AI 聊天机器人中。模型在不断改进，观察基于定价、模型不同而产生的回复差异会很有趣，从 AI 那里，您能立即理解：\n\n*   `<main>` 存在的原因\n\
  *   `<article>` 与 `<section>` 区别的重要性\n*   错误出在哪里\n\n您将在几秒钟内纠正 AI 犯下的任何错误。\n\n但如果您不理解语义，AI\
  \ 会乐意生成看起来正确但结构错误的内容。您不会注意到缺失的地标、损坏的无障碍访问或标题的误用。您交付的是脆弱的标记，却永远不知道为什么稍后会觉得事情不对劲。AI\
  \ 不是导致此问题的原因，但它确实放大了这个问题。\n\n如果您复制 AI 生成的 CSS 直到看起来正确，您最终得到的样式仅是碰巧生效。更糟的是，AI 会让您更快地达到这种损坏状态。\n\
  \n在调试时，如果您已经阅读错误消息、形成假设并隔离变量，那么 AI 就成了调试伙伴。您可以说：\n\n```\nHere's the error message.\
  \ What's the most likely cause and how do I confirm it?\n```\n\n您学得更快，因为您看到了推理过程。\n\
  \n但如果您还不具备基本的调试技能，AI 就会让您通过一次性更改五件事来更快地盲目尝试，您最终会盲目粘贴修复程序，甚至制造新 Bug！您感觉很忙碌，但并没有在学习。\n\
  \n**提示：** 请对比有 AI 与无 AI 学习 Web 开发的区别。哪些技能会提升，哪些技能会退化？\n\n## 您的学习风格\n\n如果您天生会问：\n\
  \n*   为什么用这种模式？\n*   为什么不用另一种？\n*   如果我改这里会坏什么？\n\nAI 可以充当随时可用、耐心解答的伙伴，随时准备回答您的下一个问题。\n\
  \n但如果您的本能是，*直接给我答案*，AI 会欣然照办，但您会在不理解项目的情况下完成它们。不要让工具替您思考。\n\n您需要将 AI 用作解释者、审查者、决策陪练或调试器，而不是主要作者、架构师或决策者。\n\
  \n在与 AI 的聊天中，以下是一些值得经常使用的好短语：\n\n*   请给我展示最简示例。\n*   有哪两种替代方案？\n*   我做了哪些假设？\n\n\
  **提示：** 请结合 Web 开发中的具体例子，解释为什么说 AI 是现有技能的乘数。\n\n## 配置 AI 聊天机器人用于学习\n\n如果您希望免费的 AI\
  \ 聊天机器人真正帮助您学习 Web 开发（而不是仅仅吐出您看不懂的代码），您需要通过三种方式对其进行配置：\n\n*   如何开始每次对话（您的学习契约）\n\
  *   如何提问（提示词模式）\n*   如何验证和练习（以免被自信的胡言乱语欺骗）\n\n以下是一种在 ChatGPT、Gemini 和 Claude 中效果良好的设置。\n\
  \n### 创建可复用的学习契约消息\n\n在新聊天开始时，粘贴类似以下的学习契约并根据您的喜好进行调整。\n\n学习契约（粘贴在聊天顶部）：\n\n```\n\
  You are my web dev tutor for HTML, CSS, JavaScript, SQL, Python and Django. Teach\
  \ me like a beginner who wants to become competent, not like someone who wants a\
  \ quick copy-paste. Prefer short steps with checkpoints.\nWhen giving code, also\
  \ explain:\n- what the code does\n- why this approach is used\n- common mistakes\n\
  Ask me 1–3 quick questions if needed (but do not stall). Always provide a tiny exercise\
  \ after explaining a concept.\nWhen I paste an error, help me debug by:\n- explaining\
  \ likely causes\n- telling me exactly what to check\n- giving the minimal fix first\n\
  ```\n\n\n\n如果你的聊天机器人支持 `custom instructions` 或 `memory`，请将相同内容放在那里，这样你就不必重复输入。如果不支持，请将其保存在笔记中，并在每次新对话时粘贴进去。\n\
  \n## 选择一个学习路径，让机器人连贯地教学\n\n免费聊天机器人可能很棒，但除非你设定结构，否则它们会随意跳跃。选择一个学习路径并坚持几个会话：\n\n-\
  \ HTML 语义与结构\n- CSS 布局与样式\n- JavaScript 基础\n- 使用 SQLite 的 SQL 基础\n- Django 基础\n\
  - 部署概念与 Bash 脚本编写\n\n告诉聊天机器人：\n\n```\nUse this track. If I ask something beyond\
  \ the scope of my current track, briefly answer but then guide me back to the track.\n\
  ```\n\n## 使用提示模板强制真实学习\n\n促使模型解释而不是向你倾倒代码的提示模式如 `表 1.3` 所示：\n\n| Template | Example\
  \ |\n| --- | --- |\n| `Explain, then quiz me` | 像教新手一样教我 `topic`。使用一个简单的例子。每节结束后，问我一个快速问题以检查理解。直到我回答前不要继续。\
  \ |\n| `Socratic debugging` | 我在 `language/framework` 中遇到这个错误。请先问我最重要的问题，一次一个，并解释每个答案意味着什么。这是堆栈跟踪：`traceback`。\
  \ |\n| `Minimal code with \"why\"` | 展示处理 `functionality` 的 `feature` 的最小可能示例。解释每一行。然后给我一个小的更改来实现。\
  \ |\n| `Make me practice` | 给我一个 20 分钟的练习：`task`。只提供需求和提示。除非我要求，不要给出解决方案。例如，构建一个\
  \ Django 页面，列出来自 SQLite 的产品，带有使用 `GET` 参数的搜索框。 |\n| `Compare options` | 解释使用 `feature`\
  \ 构建 `language/framework` 项目的三种方式。给出优缺点及何时选择每种。例如，函数视图与类视图，应用布局。 |\n\n表 1.3：学习提示模板\n\
  \n## 让机器人在你的实际项目中工作\n\n如果你提供正确的上下文，你会获得显著更好的帮助。一旦我们使用集成到代码编辑器或 IDE 中的 AI 工具，这会变得更容易，但即使使用单独的\
  \ AI 聊天机器人，你也可以手动提供上下文。\n\n尝试提供：\n\n- 你的目标（“我想要一个列出博客文章的页面”）\n- 你当前的代码（最小相关片段）\n\
  - 错误消息/堆栈跟踪\n- 你的文件名及代码所在位置（`views.py`、`urls.py`、模板路径）\n\n这可以防止聊天机器人猜测你的设置。\n\n\
  ## 为代码生成设置护栏\n\n许多读者跳过这一步，但它确实能产生实际差异。\n\n将这些规则添加到你的聊天中：\n\n```\nYou must follow\
  \ these rules when your response includes code:\n- Do not generate more than about\
  \ 40 lines of code at once unless I ask.\n- Prefer incremental changes with diffs.\n\
  - If you propose a change, show it as: what to delete, what to add.\n- Tell me the\
  \ one most likely issue first.\n```\n\n这能保持体验的互动性，并减少你最终得到一个“弗兰肯斯坦项目”的可能性。\n\n##\
  \ 将 AI 用作导师，而非编译器\n\nAI 不应被用作替代你自己实现工作的工具。一个扎实的常规应该成为你的习惯，即使用如 `图 1.6` 所示的四步学习循环：\n\
  \n1. 请求解释 + 微小示例\n2. 自己实现（即使很慢）\n3. 粘贴你的尝试并请求反馈\n4. 做一个小变体（“现在添加验证”、“现在添加搜索”等）\n\
  \n![](img/Image4168.png)\n\n图 1.6：AI 学习循环\n\n明确告诉聊天机器人：\n\n```\nDon't write the\
  \ final solution. Coach me through implementing it.\n```\n\n## 验证习惯\n\n聊天机器人（尤其是免费的）有时会出错，因此你可以用以下提示鼓励\
  \ AI 自我检查：\n\n- `列出你对我的项目结构所做的假设。`\n- `这有哪 3 种可能失败的方式，我该如何检测每一种？`\n- `最简单的替代方法是什么？`\n\
  \n如果你想要额外的安全性，可以通过向第二个聊天机器人提出相同问题来交叉验证棘手的答案。当它们意见不一致时，那就是你需要仔细测试的信号。\n\n你现在已经挑选了一个或多个\
  \ AI 聊天机器人作为学习教练，并了解了如何从它们那里获得最佳指导体验。现在让我们把注意力转移到主动编码上，而不是学习概念。\n\n# 与 AI 助手作为同事一起编码\n\
  \n虽然聊天机器人非常适合学习，但在构建完整的 Web 开发项目时，你需要一个更专业的工具，它能在你的代码编辑器或 IDE 内部工作，并能帮助处理多步骤编码任务（即“代理式”，一个我希望快速过时的可怕营销词）。本节的目标是了解各种与你的编码工具集成的\
  \ AI 工具的优缺点。\n\n**良好实践**：如果你在本书中只遵循一种带有集成编码助手的代码编辑器或 IDE 设置，请使用 `VS Code` 搭配 `GitHub\
  \ Copilot`。这种组合广泛使用，能与我们将构建的工作流干净地集成，并为初学者提供最小的摩擦。\n\n在查看具体工具之前，有一个关于它们与 AI 模型关系的重要因素需要考虑。\n\
  \n## 理解工具-模型关系\n\n当你开始使用 AI 编码助手时，很容易将每个工具视为单一、固定的系统。例如，你可能会认为 `GitHub Copilot`\
  \ 是一个 AI，就像 `ChatGPT` 或 `Claude` 给人的感觉是单一产品一样。\n\n实际上，像 `Copilot` 这样的工具最好理解为通往多个底层模型的接口。\n\
  \n这意味着当你在像 `VS Code` 这样的代码编辑器或 IDE 中使用像 `GitHub Copilot` 这样的工具时，你并不总是在与一个特定的 AI\
  \ 系统对话。相反，该工具可以根据任务、你使用的功能或你的订阅级别，将你的请求路由到不同的模型。\n\nAI 工具是分层构建的：\n\n- 编辑器或界面（例如，带有\
  \ `Copilot` 的 `VS Code`）\n- 将你的编辑器连接到 AI 服务的集成层\n- 实际生成响应的一个或多个底层模型\n\n在某些情况下，这包括来自不同提供商的模型。\n\
  \n例如，在 `Copilot` 内部，你可能会：\n\n- 从一个模型获得内联代码补全\n- 使用由另一个模型驱动的聊天功能\n- 选择或被路由到诸如 `OpenAI`\
  \ 的 `GPT-5.5` 或 `Anthropic` 的 `Claude Sonnet` 等模型\n\n因此，即使你在使用 `Copilot`，响应背后的实际智能可能来自完全不同的系统。\n\
  \n这影响你选择工具的方式：\n\n1. 首先，工具选择和模型选择不是一回事。你可能更喜欢在 `Copilot` 中工作，因为它与你的编辑器集成，但仍希望针对特定任务使用像\
  \ `Claude Opus` 这样的特定模型。\n2. 其次，即使在同一工具内，结果也可能不同。如果 `Copilot` 切换模型或你更改设置，你可能会看到不同风格的响应、详细程度或编码方法。\n\
  3. 第三，你可以结合优势。例如：\n   - 编码时使用 `Copilot` 获取快速内联建议\n   - 使用由 `Claude` 驱动的聊天进行更深入的解释\n\
  \   - 使用更强的模型进行复杂调试或设计决策\n\n不要考虑“我应该使用哪个单一 AI”。相反，要考虑：\n\n- 哪个工具适合你的工作流（例如，带有 `Copilot`\
  \ 的 `VS Code`）？\n\n\n\n哪个模型最适合当前任务（例如，Claude Opus 具有高智商推理能力）会影响响应速度与更聪明推理之间的平衡\n\
  * 您的工具链对于完成工作至关重要\n\n编码助手最大的改进来自工具链，而非模型。总之，工具链是围绕 AI 模型的系统，它赋予模型工具、记忆和工作流，将其从文本生成器转变为能够完成实际任务的系统。\n\
  \n现在让我们回顾一些最流行的编码助手，它们可以与您首选的代码编辑器或 IDE（以及模型）集成。\n\n## GitHub Copilot\n\n对于实践学习，GitHub\
  \ Copilot 是我建议从中开始的选择，因为它位于您的代码编辑器或 IDE（VS Code、Visual Studio、JetBrains 等）中，并在您输入时代码补全、模板和整个函数。\n\
  \nGitHub Copilot 与集成到 Windows、Office 以及如今每个其他微软产品中的“Copilots”截然不同。请不要因其品牌而却步。\n\n\
  Copilot 最适合通过编码学习，而非聊天。Copilot 不会取代您首选的聊天机器人。它减少了反复搜索常见代码模式的需求。开发者广泛使用它，因为它在您输入时工作，并能访问您的整个项目上下文。\n\
  \n优势：\n\n* 出色的代码自动补全\n* 在您的代码编辑器或 IDE 内工作\n* 利用您的项目上下文改进建议\n\n劣势：\n\n* 除非搭配聊天机器人，否则不利于概念学习\n\
  \n免费与付费计划：\n\n* **免费** / **学生**：每月包含 IDE 中最多 2,000 次内联建议和最多 50 次高级请求，让您有限度体验 Copilot\
  \ 的功能。学生可在 IDE 中获得无限补全和每月最多 300 次高级请求。\n* **付费**：Copilot Pro（每月 1,000 个 AI 积分，10\
  \ 美元） / Pro+（每月 3,900 个 AI 积分，39 美元），解锁更多补全和集成。\n* **商业版** / **企业版**：每用户每月 19 美元（可选择以每请求\
  \ 0.04 美元购买额外高级请求），每用户每月 39 美元（仅限 GitHub Enterprise Cloud）。\n\n您可以通过以下链接了解 GitHub\
  \ Copilot 的基于使用量的计费：[`docs.github.com/en/copilot/concepts/billing/usage-based-billing-for-individuals`](https://docs.github.com/en/copilot/concepts/billing/usage-based-billing-for-individuals)\n\
  \n通过以下链接注册 GitHub Copilot：[`github.com/features/copilot`](https://github.com/features/copilot)\n\
  \n如何设置以取得成功：\n\n* 在编辑器中安装 Copilot 插件\n* 从编写最少量代码开始，让 Copilot 建议 HTML 布局、JavaScript\
  \ 函数和 Django REST 视图等片段\n* 当有建议时，在 Copilot Chat 中问“为什么用这种模式？”这能让您从复制粘贴猴子转变为拥有更深层理解\n\
  \n## Google 的 Gemini Code Assist\n\nGoogle 提供了一款 AI 编码助手，提供慷慨的免费额度（每月大量补全），并与 VS\
  \ Code 等主流编辑器集成。它可用于原型设计 HTML 和 JavaScript 或调试 Django 视图，因为机器人理解您更改的上下文并建议更大的代码块，而不仅仅是单行。\n\
  \nGemini Code Assist 是您在熟悉使用 VS Code 和 GitHub Copilot 的基本概念后可能想探索的工具。\n\n免费与付费：\n\
  \n* 免费：个人层级每月提供大量补全\n* 付费/标准版：增加更深度的集成和指标\n\n如何设置以取得成功：\n\n* 在您选择的编辑器中安装 Gemini\
  \ Code Assist 扩展\n* 编码时使用自然语言提示（“用 HTML + CSS + JavaScript 创建一个响应式导航栏”）\n* 对于 Django，在\
  \ Shell 中工作并交互式地请求模型定义、迁移和管理后台自定义\n\n您可以通过以下链接注册 Gemini Code Assist：[`codeassist.google/`](https://codeassist.google/)\n\
  \n## AI 编码工具的成本与能力\n\n到 2026 年上半年，AI 编码工具已成为许多开发者工作流的常规部分，但其成本、限制和可靠性仍在演变。\n\n在\
  \ *The Pragmatic Engineer* 2026 年 3 月的调查中，95% 的受访者表示每周至少使用一次 AI 工具，55% 表示定期使用 AI\
  \ 代理，Claude Code 是该调查中使用最多且最受喜爱的工具。\n\nJellyfish 最新的工程研究称，其数据集中超过一半的公司持续使用 AI 编码工具，64%\
  \ 的公司在 AI 协助下生成大部分代码，高采用率团队的**拉取请求**（**PR**）吞吐量约为低采用率团队的 2 倍。\n\n您可以通过以下链接阅读更多关于这些研究和调查的信息：https://newsletter.pragmaticengineer.com/p/ai-tooling-2026\
  \ 和 https://jellyfish.co/newsroom/jellyfish-reveals-ais-real-impact-on-engineering-teams/\n\
  \n但这并不意味着开发者对此感到平静。Reddit、Hacker News 和其他公共渠道上的情绪更像是：*这难以置信地有用，略微让人上瘾，如果使用不当，会不断威胁浪费时间或金钱*。\n\
  \n\n\n# AI 编码工具：用法、成本与工作流\n\n开发者们认为 Claude Code、Codex 和 Copilot 适用于端到端的功能实现、全仓库重构、规划、代码审查，以及同时运行多个竞争代理以对比输出。\n\
  \n路透社于 2026 年 3 月下旬报道，Codex 现拥有超过 200 万周活跃用户，这是在 2026 年第一季度用户数增长 3 倍、使用量增长 5 倍之后的结果：[`www.reuters.com/technology/openai-buy-python-toolmaker-astral-take-anthropic-2026-03-19/`](https://www.reuters.com/technology/openai-buy-python-toolmaker-astral-take-anthropic-2026-03-19/)\n\
  \n## Token 与配额消耗\n\n常见的抱怨是成本和使用限制不明确，尤其是 token 消耗和配额消耗。在 `r/codex` 上，2026 年 3 月的多个帖子抱怨每周使用量消失得比预期快得多，人们报告诸如“每个任务消耗\
  \ 10% 的周限额”、“仅用了 3 天就消耗了 75% 的周限额”，以及截图显示在正常工作仅几天内限额几乎耗尽。其他帖子称 token 消耗在 3 月中旬突然激增，且没有明显的流程变化。\n\
  \nGitHub Copilot 用户也在以另一种形式抱怨同样的问题。由于 Copilot 将无限制补全与有上限的高级请求混合在一起，争论的焦点不那么在于原始\
  \ token，而更多在于哪些模型消耗高级额度过快。在 2026 年 3 月的讨论中，用户抱怨 Copilot 中的 Claude Opus 消耗高级请求的速度远超预期，还有人报告近期更新后\
  \ token 使用量增加。\n\n**提示**：请用简单的术语解释 token 用法，并结合真实的编码会话举例。什么导致 AI 编码工具中 token 使用量高，以及如何减少它？\n\
  \n## Token 使用的实用方法\n\n一种实用的方法是采用分层策略，而不是挑选“最聪明”的模型并将其用于所有事情。对广泛探索、样板代码和重复性编辑使用更便宜或有上限的工具。仅在架构设计、棘手的调试或大规模重构时才升级使用昂贵的前沿模型。\n\
  \n你可以在公开讨论中直接看到这种模式。一位 Reddit 用户说他们“最初用 Claude 规划，再用 Codex 审查”，其他人建议日常工作坚持使用 Sonnet\
  \ 或 Haiku，将 Opus 留给更艰巨的任务，Copilot 用户则谈论使用更便宜的模型进行迭代式来回交互，因为高级模型消耗配额太快。\n\n**良好实践**：使用廉价模型进行搜索、总结、代码检查、脚手架搭建和重写。使用高级模型进行困难推理。使用单独的审查模型来检查主模型的工作。在成本上“翻车”的开发者，往往是那些在本应先由廉价模型处理的任务上，却让前沿模型以\
  \ `xhigh` 思考等级运行的人。\n\n**提示**：请为初学者设计一个使用免费和付费 AI 工具的低成本工作流。\n\n## 定价与方案选择\n\n公众讨论显示出大致的模式：新手和学生主要使用免费层级和教育权益；职业个人开发者倾向于\
  \ 10 到 20 美元区间的方案；而 100 到 200 美元的方案主要由重度用户证明合理，他们每天进行数小时的代理式编码，并相信获得的价值远超标价。\n\n\
  你可以在以下链接阅读关于 AI 订阅最佳性价比组合的典型讨论：[`www.reddit.com/r/ClaudeCode/comments/1rp294g/the_best_value_for_money_combination_of_ai/`](https://www.reddit.com/r/ClaudeCode/comments/1rp294g/the_best_value_for_money_combination_of_ai/)\n\
  \n## 对比开发者对 AI 工具的看法\n\nAnthropic 的 Claude Code 被许多高级用户誉为最强的纯编码代理体验，尤其是在小团队中，而我之前链接的\
  \ *The Pragmatic Engineer* 调查称它目前是最受喜爱的工具。\n\nOpenAI 的 Codex 因感觉更直接、更面向工程而受到赞誉，但\
  \ 2026 年 4 月的 `r/codex` 充满了对不可预测的配额消耗的焦虑。OpenAI 自身的定位是 Codex 包含在付费 ChatGPT 层级中，这使其对已身处该生态系统的人具有吸引力。\n\
  \nGitHub Copilot 仍然是编码助手的安全默认选择。对个人而言，它比大多数付费竞争对手更便宜，深度集成于主流 IDE，且更适合企业采购。*The Pragmatic\
  \ Engineer* 调查显示大型企业仍倾向于 Copilot，所以如果你在公司工作，它极有可能是你被期望使用的工具。但它的缺点是不再像 Claude Code\
  \ 那样让人感觉前沿或深受高级用户喜爱。\n\n**良好实践**：如果供应商以用户讨厌的方式更改限制、价格或默认设置，开发者往往会迅速切换工具。因此，在很多方面，对初学者来说，选哪个工具入门并不太重要，因为你可能在几个月内多次在供应商之间切换！所以，选择一个可以按月付费且随时取消的方案。\n\
  \n## 混合模型与提示风格\n\n一些开发者对同一任务使用多个模型，用一个模型规划、另一个实现，或保留一个廉价通用助手加一个高级编码专家。有效使用取决于知道何时停止、何时通过裁剪上下文来简化、何时切换工具，而不是取决于使用基准测试最好的模型的人。\n\
  \n一些开发者还会调整他们提示和与模型交互的方式，甚至到了应用通常只用于人类同类的心理学程度，如以下链接所示：[`news.ycombinator.com/item?id=47357042`](https://news.ycombinator.com/item?id=47357042)\n\
  \n我建议你从一个简单、低成本的工具和一个高级专家工具开始，而不是订阅五个。Copilot Free 或 Pro 作为入口，搭配带有 Codex 的 ChatGPT\
  \ Plus 或 Claude Pro。只有当你明显每周都遇到限制并能指出实际吞吐量提升时，200 美元方案才说得通。高成本方案通常只对高强度日常使用值得，但初学者直接跳到那里通常是在为困惑买单。\n\
  \n# AI 代理与多代理工作流\n\n你已经看到 AI 助手如何帮助你编写代码、解释概念和指导学习。AI 代理建立在该理念之上，但区别在于 AI 代理不是响应单个提示。它试图在多个步骤中完成任务，且代理采取更多主动性。它不等待你的下一个提示，而是可能：\n\
  \n- 将任务分解为更小的步骤\n- 修改多个文件\n- 运行命令或测试\n- 根据发生的情况修正其方法\n\n当涉及多个代理时，事情变得更有趣。\n\n一些工具使用协调代理来管理一组较小的专用代理。这些子代理各自专注于特定类型的工作。\n\
  \n例如，一个系统可能包括：\n\n- 一个决定需要做什么的规划代理\n- 一个编写或编辑代码的编码代理\n- 一个运行测试并报告失败的测试代理\n- 一个检查错误或改进的审查代理\n\
  \n协调代理将任务分配给这些子代理，收集它们的结果，并决定下一步做什么。这创造了一种更接近小团队而非单一助手的常规流程。\n\n\n\n这种方法可能非常有效。不同的智能体可以专注于它们最擅长的领域，系统可以跨多个步骤更快地迭代。智能体通常具有不同的能力或思维层级，甚至可能来自不同的公司。例如，一些资深开发者发现，OpenAI\
  \ 的 Codex 在极高思维层级下最适合规划，然后他们将实现工作移交给 Claude Code Sonnet，或像 Qwen3-Coder-Next 或 DeepSeek\
  \ Coder 这样的本地模型。在 * 第 11 章 * * 搭建项目环境 * 中，我将更详细地介绍本地模型。\n\n## 为什么智能体很重要\n\n乍一看，多智能体系统听起来像是一个明显的升级。在许多情况下，确实如此。它们可以处理更大、更复杂的任务，跨项目的多个文件和层级工作，并通过内置的审查或测试步骤更早地发现问题。\n\
  \n但有一个容易被忽视的成本。\n\n每当智能体执行一个步骤时，它都会发送和接收数据。在多智能体系统中，每个任务会发生多次这种情况，且通常在多个智能体之间发生。这直接影响\
  \ Token 使用量。如果多个智能体相互通信，相同的上下文可能会被传递多次。即使对于看似微小的任务，这也会迅速增加 Token 使用量。\n\n这就是为什么开发者经常发现基于智能体的工具感觉更昂贵，或比简单的聊天工具消耗配额更快。\n\
  \n对于学习来说，带着一定的自律使用这些工具很重要。\n\n如果你依赖多智能体系统从零构建大型功能，它可能会产出可用的代码，但你可能会为大量并不真正帮助你学习的计算买单。\n\
  \n更好的方法是：\n\n*   使用较小、聚焦的任务，而不是大而宽泛的目标\n*   限制智能体一次被允许做的事情\n*   审查每一步，而不是自动接受所有内容\n\
  *   意识到更多的自动化通常意味着更高的 Token 使用量\n\n随着经验积累，你可以开始利用多智能体工作流处理更复杂的任务。届时，速度、成本和理解之间的权衡将变得更清晰。\n\
  \n当我们在本书第三部分构建真实项目时，将更详细地探讨 AI 智能体。现在，让我们回顾一些与 AI 协作的实用技巧。\n\n**提示词**：何时应该从聊天机器人切换到\
  \ IDE 集成助手？\n\n## 与任何 AI 协作的实用技巧\n\n以下是让这些工具成为真正的老师，而非美其名曰的代码生成器的方法。\n\n*   **明确陈述学习目标**：不要说“帮我写个\
  \ Django 视图”，而要问“教我 Django 视图如何处理 GET 与 POST，并给出示例。”这迫使 AI 进行解释，而不仅仅是产出结果。\n*  \
  \ **要求分步解释**：始终包含“逐行解释及其重要性”之类的措辞。\n*   **用小提示词迭代**：不要提巨大的请求，而是将其分解为更小的步骤。想深入时，随时可以用“现在展开讲讲”这类追问。\n\
  *   **利用编辑器集成练习**：像 Copilot、Gemini 和 DeepSeek 这样集成在编辑器中的聊天机器人，能结合当前活跃项目及其代码文件，让学习具有上下文。你不只是在学抽象理论；聊天机器人正将其应用于你的当前代码。\n\
  *   **用多源验证**。针对棘手概念，问两个助手（如 ChatGPT 和 Claude）并对比答案。差异往往能揭示你原本会错过的细微之处。\n\n一个有用的提示词如下：\n\
  \n```\n扮演战略顾问。根据下面的目标，推荐**唯一最佳选项**并解释为何优于替代方案。然后，列出两个备选方案，并明确指出在何种情况下应选择它们。我的目标是\
  \ [在此处插入你的目标]\n```\n\nAnthropic 官网提供了实用的提示词指南，也适用于大多数模型，链接如下：[`platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices`](https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices)\n\
  \n现在让我们回顾一些关于使用 AI 工具的关键信息，以及 AI 如何改变了软件开发者的角色。\n\n# AI 工具的优缺点\n\n许多人声称人类开发者很快将过时，因为\
  \ AI 将自主编写软件，使程序员变得多余。但我并不认为我们已进入任何类似“后开发者时代”的阶段。\n\n## 公司越来越多地使用 AI 工具\n\n确实，公司越来越多地采用\
  \ AI 工具。例如，《福布斯》一篇文章报道，Google 提交的代码中已有 25% 以上由 AI 编写。但人类开发者仍深度参与其中，指导 AI、审查其输出、编辑代码，并将其塑造成连贯的产品。AI\
  \ 是受人类控制的工具，而非人类的替代品。\n\n## 人类 + AI = 成功\n\n虽然 GitHub Copilot 等 AI 工具在明确定义的任务中能产出令人印象深刻的结果，但它们仍需要人类掌舵。打个比方，在开发中使用\
  \ AI 就像开着定速巡航的飞机：飞机朝你指的方向飞，但如果没有熟练飞行员的持续指导和修正，它可能会偏离航线，而降落和起飞等关键阶段必须完全由人类控制。\n\n\
  作为使用 AI 工具的软件开发者，如果你不理解生成的代码，就不会知道何时或如何修正它。这一局限性正是“我们正进入后人类程序员时代”这一观点被夸大的核心原因。\n\
  \n## AI 的局限性\n\n目前的大语言模型在许多任务上仍表现吃力。一些最受吹捧的工具在实际测试中失败了。你可能会发现，你的 AI 工具只能令人满意地完成部分任务，最终你花在绕过其错误上的时间，比自己写代码还多。\n\
  \n这些结果表明，当前形式的 AI 擅长界定清晰、重复性的任务，但在没有大量人工干预的情况下，不擅长开放式或复杂的开发问题。\n\n近期也有有趣的研究，指出 AI\
  \ 辅助带来的感知生产力提升与实际提升之间存在差距。非营利研究组织 **METR**（**模型评估与威胁研究**）2025 年的一项随机对照试验报告称，使用 AI\
  \ 工具的开发者完成任务实际耗时更长，即使他们感觉自己更快了。这反映了 AI 承诺的心理诱惑与真实工程工作的混乱现实之间的张力。\n\n研究人员发现，开发者花费额外时间提示\
  \ AI、审查建议、修正错误、整合生成的代码。\n\n换句话说：少打字，多验证。开发者不得不验证和修正 AI 的建议，这些建议往往只是大体准确。\n\n关键论文是\
  \ METR 研究人员撰写的 *Measuring the Impact of Early-2025 AI on Experienced Open-Source\
  \ Developer Productivity*（衡量 2025 年早期 AI 对经验丰富的开源开发者生产力的影响）。主要发现是：使用 AI 工具的开发者完成任务比未使用者多花\
  \ 19% 的时间。然而他们相信 AI 让自己快了约 20–24%。详情见：[`metr.org/blog/2025-07-10-early-2025-ai-experienced-os-dev-study/`](https://metr.org/blog/2025-07-10-early-2025-ai-experienced-os-dev-study/)\n\
  \n这项研究*并不*意味着 AI 总是拖慢开发者。它主要适用于熟悉代码库、处理复杂真实任务的经验丰富的开发者。\n\n其他研究显示相反结果。\n\n\n\n例如，在受控实验中，GitHub\
  \ Copilot 用户完成任务的速度提高了 55.8%。你可以通过以下链接阅读论文 *AI 对开发者生产力的影响：来自 GitHub Copilot 的证据*：[`arxiv.org/abs/2302.06590`](https://arxiv.org/abs/2302.06590)\n\
  \n在一项企业试验中，Google 工程师的速度提升了约 21%，详情可阅读以下链接：[`arxiv.org/abs/2410.12944`](https://arxiv.org/abs/2410.12944)\n\
  \n因此，当前时代 AI 辅助编程的现状是混乱的。\n\n## AI 对初级和高级开发者的不同影响\n\n这是关于 AI 和软件开发最令人深省的现象之一。乍看之下这似乎自相矛盾，但一旦你深入剖析初级和高级开发者的思维方式，就会发现这完全合乎逻辑。\n\
  \n核心观点可以用一句话概括：AI 往往对初级开发者最有帮助，因为它降低了编写代码的门槛，并有助于弥补常见的知识缺口。然而，对于高级开发者来说，收益可能不那么稳定，因为\
  \ AI 有时会打断你所掌控的更深层、专家级的思维过程。你不再是提出通用问题并基于模型的广泛训练获取答案，而是上传你自己的材料，如书籍章节、文档或笔记，AI 仅在该上下文中工作。这使得\
  \ NotebookLM 成为学习的利器，因为你可以把它当作特定主题的专属导师。\n\n一个实用的流程是上传一章内容或一组笔记，然后提问，例如：*总结这一节*，*用更简单的术语解释这个概念*，或\
  \ *测测我对核心观点的掌握情况*。\n\n你还可以让它对比章节、生成示例，或找出你理解上的盲点。因为每个回答都追溯到你的源材料，这降低了无关或错误解释的风险，并有助于巩固你真正想学的内容，而不是把你引向无关的话题。\n\
  \n## 检验你的理解\n\n回答以下关于本章涵盖主题的问题：\n\n1. 说 AI 是乘数而非替代品是什么意思？\n2. 为什么让 AI 解释而不仅仅是写代码很重要？\n\
  3. 什么是学习契约，它为什么有帮助？\n\n\n\n# 附录 A：问题与资源\n\n## 复习问题\n\n4. 说出两种能改善学习效果的提示词模式\n5. 为什么要限制\
  \ AI 一次性生成的代码量？\n6. 过度依赖 AI 生成代码的主要风险是什么？\n7. 描述聊天机器人与 IDE 集成 AI 工具的区别\n8. 什么是 Token\
  \ 或配额使用量，为什么它很重要？\n9. 使用廉价与高级 AI 模型的推荐方法是什么？\n10. 为什么 AI 有时会拖慢经验丰富的开发者？\n\n答案见本书的\
  \ GitHub 仓库：  \n<https://github.com/markjprice/web-dev-ai/blob/main/docs/Appendix-A.pdf>\n\
  \n## 相关链接\n\n### 提示工程与 AI 学习指南\n\n* Anthropic 提示工程指南：<https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering/overview>\n\
  * OpenAI 提示工程指南：<https://platform.openai.com/docs/guides/prompt-engineering>\n*\
  \ Learn Prompting：<https://learnprompting.org/>\n\n### Reddit 开发者社区\n\n* OpenAI\
  \ Codex：<https://www.reddit.com/r/codex/>\n* Anthropic Claude：<https://www.reddit.com/r/ClaudeAI/>\n\
  * GitHub Copilot：<https://www.reddit.com/r/GithubCopilot/>\n\n## 本章小结\n\n在本章中，你学习了以下内容：\n\
  \n* AI 工具能显著加速学习，但前提是将其作为**导师**而非**代码生成器**使用\n* 高效的 AI 学习取决于**请求解释**，而非仅仅索取解决方案\n\
  * 结构化方法（如学习循环）能带来更深层的理解\n* 提示词质量直接影响学习效果\n* 聊天机器人最适合解释和学习，而 Copilot 等工具最适合实际编码\n\
  * AI 会放大好习惯和坏习惯，因此当人类与 AI 协作时，扎实的 Web 开发基础至关重要\n* 如果没有刻意的流程，Token 使用量和成本会迅速成为问题，因此分层方法——简单任务用廉价模型，复杂推理用高级模型——最高效\n\
  * 开发者通常组合使用多种 AI 工具，而非依赖单一工具\n* 人类判断依然关键，因为 AI 不能取代开发者判断；它只是将角色从**编写代码**转移到**评估和优化代码**\n\
  \n下一章你将学习 HTML，这是一种用于为网页内容提供结构的标记语言。\n\n## Discord 社区\n\n加入本书的 Discord 社区——你可以在此分享反馈、向作者提问、获取新版本通知：\
  \  \n<https://discord.gg/rdEsrVbbC>\n\n![img](img/Image4177.png)\n"
- '# 第 1 部分：前端 Web 开发


  在本书的第一部分，你将专注于用户在 Web 应用中看到和交互的内容。你将从 HTML 和 CSS 入手理解结构和样式，使用 SVG 处理图形，再深入 JavaScript
  和 TypeScript 以添加行为。你无需立即掌握每个细节，目标是让前端代码变得可读、不再令人畏惧。


  在此过程中，你将了解浏览器如何解析和渲染页面，样式与布局决策如何影响可用性，以及微小的逻辑片段如何塑造用户体验。读完这一部分，你应该能够构建和调整简单的 Web
  用户界面，并理解前端技术如何与系统其余部分连接。


  本部分包含以下章节：


  * 第 2 章 —— **HTML —— 构建你的网页结构**

  * 第 3 章 —— **CSS —— 为你的网页添加样式**

  * 第 4 章 —— **SVG —— 绘制可缩放图形**

  * 第 5 章 —— **JavaScript —— 让网页具有交互性**

  * 第 6 章 —— **TypeScript —— 更安全的 JavaScript**

  '
- "## 第 2 章：HTML —— 构建你的网页结构\n\n本章介绍 **HTML**（**HyperText Markup Language**，超文本标记语言）的基础知识。你将学习\
  \ HTML 的核心概念，然后借助 AI 生成一个简单页面，在此过程中了解元素、标签和属性。\n\n读完本章，你将能够阅读、编写和理解 HTML 作为网页的结构化描述，并自信地构建简单、有意义的页面，为后续内容打下坚实基础。\n\
  \n本章涵盖以下主题：\n\n* 什么是 HTML？\n* 构建基础网页\n* 使用表单与输入\n* AI 练习\n* 其他标记语言\n\n本章的建议聊天机器人提示词及示例回复见：\
  \  \n<https://github.com/markjprice/web-dev-ai/blob/main/prompts/ch02-html/readme.md>\n\
  \n## 什么是 HTML？\n\nHTML 代表 **HyperText Markup Language**（超文本标记语言）。听起来很吓人，但概念很简单。\n\
  \nHTML **不是**编程语言：\n\n* 它不做决策\n* 它不运行逻辑\n* 它不计算任何东西\n\nHTML **描述**网页上内容的结构和含义。\n\
  \nHTML 是页面的**结构**。它定义：\n\n* 哪些文本是标题\n* 哪些文本是段落\n* 什么算作列表\n* 链接指向何处\n* 哪些图片属于该页面\n\
  * 表格数据如何组织\n\nCSS 负责让页面**好看**。你将在 第 3 章 *CSS —— 为你的网页添加样式* 中学习 CSS。本章请忽略外观，专注于内容**是什么**以及**如何结构化**。\n\
  \nJavaScript 负责让页面**具有交互性**。本章创建的网页将是静态的。在 第 5 章 *JavaScript —— 让网页具有交互性* 中，你将编写\
  \ JavaScript 代码让它们“活”起来。\n\nHTML 决定**事物是什么**。没有 HTML，Web 就只是一堆非结构化的文本流。\n\n### HTML\
  \ 由元素组成\n\nHTML 通过 **标签** 形成 **元素**。标签是包裹在尖括号中的实际标记语法，例如 `<p>` 或 `</p>`，告诉浏览器如何解析内容。而元素则是包含开始标签、内容和结束标签的完整结构。\n\
  \n例如，`<p>Hello</p>` 是一个段落元素，由开始标签 `<p>`、文本 `Hello` 和结束标签 `</p>` 组成。标签是构建块，元素是由这些标签创建的完整结构。\n\
  \n大多数元素长这样：\n\n```html\n<p>This is a paragraph.</p>\n```\n\n* `<p>` 表示 **开始一个新段落**\n\
  * `</p>` 表示 **段落结束**\n* 中间的所有内容都是段落的内容\n\n在 HTML 中，**属性** 为元素提供额外信息，放在开始标签内。它们通常以键值对形式出现，如\
  \ `class=\"intro\"` 或 `href=\"https://example.com\"`，用于修改元素的行为或显示方式。\n\n例如，在 `<a\
  \ href=\"https://example.com\">Visit</a>` 中，`href` 属性告诉浏览器链接指向何处。元素定义结构和含义，属性则细化或配置该元素的行为。\n\
  \n\n\n### HTML 基础\n\n## 核心概念\n\n### id 和 class 属性\n\nHTML 中两个属性频繁出现：`id` 和 `class`。`id`\
  \ 标识页面上唯一的一个元素。`class` 将一个或多个元素标记为属于同一组。稍后，CSS 和 JavaScript 将大量使用它们。目前，重要的 `id`\
  \ 概念很简单：`id` 用于一个特定元素，而 `class` 可以共享。\n\n### 空元素和容器元素\n\n一些元素是**空元素**，如 `<img>`\
  \ 或 `<br>`，它们没有闭合标签或内部内容。其他是**容器元素**，如 `<div>` 或 `<section>`，它们包裹内容并可以在内部包含其他元素。\n\
  \n### div 元素\n\n`<div>` 是一个通用的容器元素，没有固有含义。它适用于为样式分组内容，但当 `<section>`、`<nav>` 或 `<p>`\
  \ 等语义元素更合适时，不应用它来替代它们。\n\n### 元素嵌套\n\n同样重要的是要知道元素可以嵌套，即一个元素可以位于另一个元素内部以创建层级。正确的嵌套很重要，因为不正确的结构可能导致意外的渲染或无障碍问题。\n\
  \n### 无障碍\n\n**良好实践**：Web 开发中的无障碍意味着设计和构建内容，使其可被所有人使用，包括有视觉、听觉、运动或认知障碍的人。这包括使用正确的\
  \ HTML 结构、有意义的文本替代（如图像的 `alt` 属性）以及清晰的导航，以便屏幕阅读器等辅助技术能正确解析页面。\n\n### 块级元素与内联元素\n\
  \n另一个关键概念是**块级元素**和**内联元素**的区别。块级元素（如 `<p>` 和 `<h1>`）通常另起一行并占据全部可用宽度，而内联元素（如 `<span>`\
  \ 或 `<a>`）在文本中流动而不破坏布局。\n\n### 语义化 HTML\n\n现代 HTML 强调语义化元素，如 `<article>`、`<nav>`\
  \ 和 `<footer>`，它们描述内容的含义而非仅仅是外观。正确使用这些元素可提高无障碍性、搜索引擎理解能力和整体代码清晰度。\n\n你将在本章中反复用到这些概念。\n\
  \n> **提示**：请结合实际例子解释语义化 HTML 与非语义化 HTML 的区别，以及为什么这对无障碍很重要。\n\n## HTML 注释\n\nHTML\
  \ 注释允许你在源代码中留下不在页面上显示的备注。它们如下所示：\n\n```\n<!-- This is a comment -->\n```\n\n注释可用于提醒、临时备注或解释教学代码中的示例。它们不是隐藏敏感信息的方式，因为任何人仍可查看页面源代码。\n\
  \n## 网页的基本结构\n\n每个 HTML 页面都遵循相同的整体模式：\n\n```\n<!DOCTYPE html>\n<html>\n  <head>\n\
  \    <title>My first page</title>\n  </head>\n  <body>\n    <h1>Hello world</h1>\n\
  \    <p>This is my first web page.</p>\n  </body>\n</html>\n```\n\n每个部分都有不同的作用：\n\
  \n* `<!DOCTYPE html>` 告诉浏览器*这是现代 HTML*，即基于标准的 HTML，具体为 HTML5。如果省略它，浏览器可能会回退到**怪异模式**，该模式模拟早期\
  \ Web 的遗留行为，以保持与非常旧的页面兼容。这可能导致布局不一致，尤其是在 CSS 方面。\n* `<html>` 包裹整个文档。\n* `<head>`\
  \ 包含元数据，如标题、字符编码和用于应用样式的 CSS 链接。\n* `<body>` 包含用户可见的所有内容。\n\n页面上可见的任何内容都不在 `<body>`\
  \ 之外。页面标题在 `<head>` 中定义，通常显示在浏览器标签页中。\n\n> **提示**：请展示良好和不良 HTML 结构的示例，并解释是什么让其中一个更好。\n\
  \n## 亲自试一试！\n\n使用你喜欢的文本编辑器创建一个名为 `myfirstpage.html` 的文件。将前面的 HTML 复制到文件中并保存。然后在你喜欢的\
  \ Web 浏览器中打开该文件。并排比较文本编辑器和浏览器中的文件，如*图 2.1* 所示：\n\n![](img/B34553_02_01.png)\n\n\
  图 2.1：使用记事本和 Windows 上的 Microsoft Edge 对比网页源代码与其视觉外观\n\n除了纯文本编辑器和 Web 浏览器，你也可以使用\
  \ VS Code 及其 Live Preview 扩展来试运行你的工作，如*图 2.2* 和*图 2.3* 所示：\n\n![](img/B34553_02_02.png)\n\
  \n图 2.2：点击“显示预览”按钮查看网页的实时预览\n\n![](img/B34553_02_03.png)\n\n图 2.3：使用 VS Code 对比网页源代码与其视觉外观\n\
  \n在本书的其余部分，我建议使用带有 Live Preview 的 VS Code，因为它能在你工作时提供即时反馈，且符合后续章节使用的工作流。\n\n> **提示**：请展示一个基本网页的\
  \ HTML，包含标题、段落和列表的示例，以便我了解网页的结构，并解释所有元素。\n\n## 标题赋予内容层级\n\n标题定义文档结构。它们的视觉大小是样式决定。每个标题级别的字体系列和字号稍后将使用\
  \ CSS 应用，不必与级别编号匹配！\n\nHTML 有六个标题级别：\n\n```\n<h1>Main page title</h1>\n<h2>Section\
  \ title</h2>\n<h3>Subsection title</h3>\n<h4>Sub-subsection title</h4>\n<h5>Sub-sub-subsection\
  \ title</h5>\n<h6>Sub-sub-sub-subsection title</h6>\n```\n\n初学者关键规则：\n\n* `<h1>`\
  \ 是页面上最重要的标题\n* `<h2>` 是该页面内的一个节\n* `<h3>` 是 `<h2>` 内的一个小节\n\n将标题视为页面大纲的一部分，而不是选择更大字体的方式。\n\
  \n搜索引擎、屏幕阅读器和无障碍工具高度依赖正确的标题结构。仅为视觉效果使用标题是最常见的初学者错误之一。\n\n## 段落承载可读文本\n\n普通文本属于段落：\n\
  \n```\n<p>This is a paragraph of text.</p>\n```\n\n浏览器会自动在段落之间添加间距。\n\n你不像在 Word\
  \ 中那样反复按*回车键*。事实上，渲染 HTML 时，浏览器会忽略额外的空白字符，如回车符、制表符和空格！\n\nHTML 关乎含义，而非布局。\n\n##\
  \ 链接连接网络\n\n链接将页面连接成网络：\n\n```\n<a href=\"https://example.com\">Visit Example Website</a>\n\
  ```\n\n其中：\n\n* `<a>` 代表 *anchor*（锚点）\n* `href` 是目标地址\n* 标签之间的文本是用户点击的内容\n\n链接可以指向：\n\
  \n* 其他网站\n* 同一站点上的其他页面\n* 同一页面内的章节\n\n没有链接，HTML 页面只是孤立的文档。\n\n## 图像添加视觉内容\n\n图像使用\
  \ `<img>` 元素嵌入：\n\n```\n<img src=\"photo.jpg\" alt=\"A photo of a cat\">\n```\n\n\
  注意前面代码的以下几点：\n\n* `<img>` 没有闭合标签\n* `src` 是图像文件位置\n* `alt` 用文字描述图像\n\n`<img>` 是一个空元素，这意味着它没有闭合标签，因为它不包裹任何其他内容，也不包含嵌套元素。你将遇到的其他空元素包括\
  \ `<br>`（换行）、`<hr>`（水平线）和用于表单的 `<input>`。虽然 `<img>` 不需要闭合标签，但它确实需要某些属性才算结构良好且无障碍，如\
  \ `src` 和 `alt`。\n\n`alt` 文本很重要，因为当图像无法显示时它承载含义。屏幕阅读器依赖它。搜索引擎读取它。如果图像加载失败，文本仍能传达含义。\n\
  \n\n\n### HTML 基础\n\n## 简介\n\nHTML 将图像视为内容，而非装饰。装饰性图像（如在列表中使用表情符号作为自定义项目符号）通常由 CSS\
  \ 处理。\n\n**提示：** 请展示如何为图像、链接和表单编写无障碍 HTML。\n\n## 列表对相关项目进行分组\n\nHTML 支持两种主要的列表类型。\n\
  \n**无序列表** 使用 `<ul>` 标签：\n\n```\n<ul>\n  <li>牛奶</li>\n  <li>面包</li>\n  <li>鸡蛋</li>\n\
  </ul>\n```\n\n这表示一个顺序不重要的列表。\n\n**有序列表** 使用 `<ol>` 标签：\n\n```\n<ol>\n  <li>预热烤箱</li>\n\
  \  <li>混合配料</li>\n  <li>烘烤 30 分钟</li>\n</ol>\n```\n\n这表示 *按特定顺序排列的步骤*。\n\n每个 **列表项**\
  \ 位于 `<li>` 内部。\n\n## 表格用于构建数据结构，而非布局\n\n表格用于数据，而非页面布局：\n\n```\n<table>\n  <tr>\n\
  \    <th>姓名</th>\n    <th>年龄</th>\n  </tr>\n  <tr>\n    <td>Alex</td>\n    <td>32</td>\n\
  \  </tr>\n</table>\n```\n\n概念上：\n\n- `<table>` 包裹数据\n- `<tr>` 是 **表格行**\n- `<th>`\
  \ 是 **表头** 单元格\n- `<td>` 是 **表格数据** 单元格\n\n表格最适合展示：\n\n- 价格\n- 时间表\n- 统计数据\n- 对比\n\
  \n使用表格定位内容以实现布局是过时的做法，且会导致无障碍问题。\n\n## HTML 元素相互嵌套\n\nHTML 元素形成树形结构。\n\n示例：\n\n\
  ```\n<body>\n  <section>\n    <h2>关于我</h2>\n    <p>我写书。</p>\n  </section>\n</body>\n\
  ```\n\n此处：\n\n- `<section>` 位于 `<body>` 内部\n- `<h2>` 和 `<p>` 位于 `<section>` 内部\n\
  \n这种嵌套关系是浏览器理解内容间关系的方式。\n\n**提示：** 请给出错误嵌套 HTML 的示例并解释它们为何会导致问题。\n\n## 使用 `<div>`\
  \ 作为通用容器\n\n有时你需要将多个内容片段组合在一起，而不赋予它们特定的语义。这正是 `<div>` 元素的用途。\n\n`<div>` 是一个通用的块级容器。它不会告诉浏览器或屏幕阅读器内容的含义。它只是将内容组合在一起。\n\
  \n例如：\n\n```\n<div>\n  <h2>关于本书</h2>\n  <p>本书教你如何与 AI 协作学习 Web 开发。</p>\n</div>\n\
  ```\n\n当你想稍后使用 CSS 或 JavaScript 对一组元素进行样式设置或脚本编写时，这很有用。\n\n但当语义元素更合适时，`<div>` 不应是你的首选。如果内容是页面的一个区域，请使用\
  \ `<section>`。如果是导航，请使用 `<nav>`。如果是段落，请使用 `<p>`。如果是页面页脚，请使用 `<footer>`。\n\n一个好的初学者原则是：当你需要容器时使用\
  \ `<div>`，而不是当你需要语义时。一个充满 `<div>` 元素的页面仍然可以工作，但它向人类和工具传达的内容结构信息要少得多。语义元素使你的 HTML\
  \ 更易读、更易维护，且更无障碍。\n\n**提示：** 请展示三个适合使用 `<div>` 的示例和三个语义元素更合适的示例。\n\n## HTML 描述含义，而非外观\n\
  \n对初学者来说，这种区别使 Web 技术栈的其余部分更易理解。\n\nHTML 回答诸如以下的问题：\n\n- 这是标题吗？\n- 这是段落吗？\n- 这是导航吗？\n\
  - 这是项目列表吗？\n- 这是表格数据吗？\n\nHTML 不回答：\n\n- 这应该是蓝色的吗？\n- 这应该居中吗？\n- 这应该有动画吗？\n\n这种分离是刻意的。它使\
  \ Web 保持灵活、无障碍且设备无关。\n\n**良好实践：** 不要试图记住每个 HTML 标签。首先询问每个内容片段是什么。是主标题？段落？导航链接？步骤列表？数据表格？一旦你能回答这些问题，标签选择就会变得更容易，AI\
  \ 生成的 HTML 也更易于审查。\n\n**提示：** 什么是 ARIA 属性，初学者何时应该关注它们？\n\n## 良好结构带来的优势\n\n当 HTML\
  \ 编写正确时：\n\n- 浏览器可以在任何屏幕尺寸上正确显示它\n- 搜索引擎理解内容\n- 屏幕阅读器可以浏览页面\n- CSS 和 JavaScript\
  \ 稍后更容易应用\n\n页面在浏览器中看起来可能正常，但仍可能结构不良或无障碍性差。\n\n结构良好的 HTML 更易维护。糟糕的 HTML 几乎立即就会造成维护问题。\n\
  \n**提示：** 搜索引擎如何利用 HTML 结构来理解页面？\n\n## HTML DOM（文档对象模型）\n\nHTML **DOM**（**文档对象模型**）是浏览器在加载\
  \ HTML 页面后在内部表示该页面的方式。浏览器不会将你的页面视为纯文本，而是将其转换为它可以理解、操作和渲染的对象树。\n\n让我们通过一个简单的 HTML\
  \ 示例来看看它是如何工作的：\n\n```\n<!DOCTYPE html>\n<html>\n  <head>\n    <title>My Page</title>\n\
  \  </head>\n  <body>\n    <h1>Hello</h1>\n    <p>This is a paragraph.</p>\n  </body>\n\
  </html>\n```\n\n当浏览器读取前面的代码时，它不会将其作为原始文本保留。它解析 HTML 并构建树形结构，其中每个元素成为一个节点：\n\n```\n\
  Document\n └── html\n      ├── head\n      │    └── title\n      │         └── \"\
  My Page\"\n      └── body\n           ├── h1\n           │    └── \"Hello\"\n  \
  \         └── p\n                └── \"This is a paragraph.\"\n```\n\n以下是理解此结构的方式：\n\
  \n- `Document` 是所有内容的根节点\n- 每个 HTML 元素成为树中的一个节点\n- 元素可以有子节点（如 `<body>` 包含 `<h1>`\
  \ 和 `<p>`）\n- 元素内的文本也成为节点\n\n此结构反映了你在 HTML 中编写的嵌套关系。如果你错误地嵌套元素，DOM 也会不正确，这可能导致令人困惑的行为。\n\
  \n浏览器实际执行的操作（分步）：\n\n1. 下载 HTML 文件\n2. 从上到下读取文件\n3. 解析每个标签并创建节点\n4. 在内存中构建 DOM 树\n\
  5. 使用该树渲染页面\n\nDOM 不仅用于显示。CSS 使用 DOM 确定样式对象，JavaScript 使用 DOM 在页面初始渲染后动态读取和更改页面。例如，JavaScript\
  \ 可以执行以下操作：\n\n- 更改 `<h1>` 内的文本\n- 添加新元素\n- 移除元素\n- 响应用户操作\n\nHTML 是源文档。DOM 是浏览器基于该文档构建的实时树。页面加载后，浏览器使用的是\
  \ DOM，而不是你的原始 HTML 文件。DOM 是浏览器将你的 HTML 表示为对象树的内部表现形式。如果你的 HTML 结构清晰且合乎逻辑，DOM 将易于操作。这就是为什么对结构的逻辑思考比单纯的打字速度更重要。\n\
  \n## 初学者核心收获\n\n如果你只记住本章的一点内容，那应该是：\n\nHTML 关注内容是什么，而不是内容长什么样。\n\n一旦理解了这一区别，HTML、CSS\
  \ 和 JavaScript 作为独立工具就更讲得通了。\n\n**提示：** 请展示 10 个常见的初学者 HTML 错误及其修复方法。\n\n理论够了，让我们做些实用的东西，构建一个更完整的网页。\n\
  \n### 构建基础网页\n\n在本节中，你将制作一个微小的 *关于我* 页面，然后观察它在你编辑时即时更新。\n\n## 在 VS Code 中构建网页并实时预览\n\
  \n创建项目文件夹：\n\n1. 在电脑上创建一个名为 `about-me-webpage` 的新文件夹\n2. 在其中创建另一个名为 `images` 的文件夹\n\
  \n你的文件夹结构将如下所示：\n\n```\nabout-me-webpage/\n  images/\n```\n\n在 VS Code 中打开 `about-me-webpage`\
  \ 文件夹：\n\n\n\n\n# 创建“关于我”网页\n\n###### 步骤\n\n1. 打开 VS Code。\n\n2. 选择 **File** | **Open\
  \ Folder...**\n\n3. 选择 `about-me-webpage` 文件夹。\n\n    > 打开文件夹（而非单个文件）很重要，因为当 VS\
  \ Code 知道项目根目录时，实时预览工具的表现会更好。\n\n4. 如果看到关于信任此文件夹中文件作者的警告，请勾选复选框并点击 **Yes, I trust\
  \ the authors** 按钮，如图 2.4 所示：\n\n    ![](img/B34553_02_04.png)\n\n    **图 2.4：**\
  \ 在 VS Code 中信任此文件夹中的文件作者\n\n5. 在 VS Code 资源管理器（左侧）中，点击 **New File**，并将其命名为 `index.html`，如图\
  \ 2.5 所示：\n\n    ![](img/B34553_02_05.png)\n\n    **图 2.5：** VS Code 资源管理器及其 New\
  \ File 按钮\n\n6. 将以下 HTML 添加到空文件中（此示例包含您所学的所有内容，重要元素已高亮显示）。粘贴到 `index.html` 中：\n\n\
  \    此 HTML 文件可从以下链接获取：[`github.com/markjprice/web-dev-ai/blob/main/Code/Chapter02/about-me-webpage/index.html`](https://github.com/markjprice/web-dev-ai/blob/main/Code/Chapter02/about-me-webpage/index.html)\n\
  \n    ```html\n    <!DOCTYPE html>\n    <html lang=\"en\">\n      <head>\n     \
  \   <meta charset=\"utf-8\">\n        <meta name=\"viewport\" \n              content=\"\
  width=device-width, initial-scale=1.0\">\n        <title>Mark's First Web Page</title>\n\
  \      </head>\n      <body>\n        <h1>Mark's First Web Page</h1>\n        <p>\n\
  \          Welcome! This page is a simple example of HTML structure: headings, paragraphs,\
  \ links, images, lists, and a table.\n        </p>\n        <h2>About this page</h2>\n\
  \        <p>\n          HTML tells the browser what each piece of content <em>is</em>.\n\
  \          Styling comes later (that's CSS), and interactivity comes later (that's\
  \ JavaScript).\n        </p>\n        <h2>Useful link</h2>\n        <p>\n      \
  \    Here's a link to learn more about HTML:\n          <a href=\"https://developer.mozilla.org/en-US/docs/Web/HTML\"\
  >MDN Web Docs: HTML</a>.\n        </p>\n        <h2>Image</h2>\n        <p>\n  \
  \        Below is an image. You can use a web image URL, or a local image file.\n\
  \          The <strong>alt</strong> text describes the image for screen readers\
  \ and when the image can't load.\n        </p>\n        <!-- Option A: Use a local\
  \ image -->\n        <!-- Save an image as images/profile.jpg and use this: -->\n\
  \        <!-- <img src=\"images/profile.jpg\" alt=\"A friendly profile photo\">\
  \ -->\n        <!-- Option B: Use a placeholder image from the web -->\n       \
  \ <img\n          src=\"https://via.placeholder.com/640x240.png?text=My+First+Image\"\
  \n          alt=\"A placeholder banner that says My First Image\"\n        >\n \
  \       <h2>Lists</h2>\n        <p>Unordered list (a list where the order doesn't\
  \ matter):</p>\n        <ul>\n          <li>Headings organize the page</li>\n  \
  \        <li>Paragraphs hold normal text</li>\n          <li>Links connect pages\
  \ together</li>\n        </ul>\n        <p>Ordered list (a list of steps):</p>\n\
  \        <ol>\n          <li>Create a folder for your project</li>\n          <li>Add\
  \ an <code>index.html</code> file</li>\n          <li>Open it with Live Preview</li>\n\
  \        </ol>\n        <h2>Table</h2>\n        <p>\n          Tables are for data.\
  \ Here's a tiny \"learning plan\" table:\n        </p>\n        <table>\n      \
  \    <thead>\n            <tr>\n              <th>Topic</th>\n              <th>What\
  \ you'll practice</th>\n              <th>Time (minutes)</th>\n            </tr>\n\
  \          </thead>\n          <tbody>\n            <tr>\n              <td>Headings</td>\n\
  \              <td>Page outline and sections</td>\n              <td>10</td>\n \
  \           </tr>\n            <tr>\n              <td>Links</td>\n            \
  \  <td>Link to another page</td>\n              <td>10</td>\n            </tr>\n\
  \            <tr>\n              <td>Images</td>\n              <td>Add alt text</td>\n\
  \              <td>10</td>\n            </tr>\n          </tbody>\n        </table>\n\
  \        <h2>Next idea</h2>\n        <p>\n          Try editing the text above and\
  \ watch the preview update instantly.\n          When you're ready, you can add\
  \ CSS to make it look nicer.\n        </p>\n      </body>\n    </html>\n    ```\n\
  \n## 代码说明\n\n请注意前面代码中的以下内容：\n\n- 文档结构：`<!DOCTYPE html>`、`<html>`、`<head>`、`<title>`、`<body>`\n\
  - 标题：`<h1>`、`<h2>`\n- 段落：`<p>`\n- 链接：`<a href=\"...\">`\n- 图片：`<img src=\"...\"\
  \ alt=\"...\">`\n\n如果看到损坏的图片图标而不是图片，可能是因为外部图片服务暂时不可用。您的 HTML 仍然是正确的。尝试切换到选项 A，通过将任意图片保存到正确的路径和文件名\
  \ `images/profile.jpg` 并取消注释本地 `<img>` 元素来使用本地图片文件。\n\n- 列表：`<ul>` + `<li>`，以及 `<ol>`\
  \ + `<li>`\n- 表格：`<table>`、`<thead>`、`<tbody>`、`<tr>`、`<th>`、`<td>`\n\n**最佳实践**：视口\
  \ `meta` 标签被视为任何 HTML 文档的标准组成部分，对于页面在移动设备上正确渲染至关重要。没有它，移动浏览器将按桌面宽度视口渲染页面然后缩小，导致文本难以阅读。表格应分为标题行（一个带有\
  \ `<tr>` 元素和嵌套 `<th>` 表头单元格元素的 `<thead>`）和数据行（一个带有一个或多个 `<tr>` 元素和嵌套 `<td>` 数据单元格元素的\
  \ `<tbody>`）。\n\n# 为网页生成位图图像\n\n到目前为止，您一直在使用已存在的图片文件。在实际项目中，您通常需要在拥有设计师、照片库或最终素材之前就需要图片。\n\
  \n图像生成工具为此目的非常有用，特别是作为占位符。诸如 Google 的 Nano Banana 和 ChatGPT Images 等工具可以从文本描述生成位图图像。您可以使用它们来创建：\n\
  \n- 构建布局时的占位图片\n- 登录页面的 Hero 图片\n- 博客文章或产品页面的插图\n- 简单的图标或视觉点缀\n\n这使您在最终美术素材存在之前就有东西可以围绕其进行设计。\n\
  \n2026 年 4 月 21 日，OpenAI 宣布了 ChatGPT Images 2.0，带来了许多改进：[`openai.com/index/introducing-chatgpt-images-2-0/`](https://openai.com/index/introducing-chatgpt-images-2-0/)\n\
  \n这些工具生成的图像通常是位图图像，意味着它们由像素组成。\n\n常见的位图格式包括：\n\n- JPEG 适合照片\n- PNG 适合透明度和锐利边缘\n\
  - WebP 是一种压缩效果好的格式\n\n构建页面布局时，您通常只需要一些看起来合理的东西。\n\n例如，您可能会用以下提示词提示图像生成器：\n\n```\n\
  Please create a simple hero image with a soft blue gradient background, abstract\
  \ shapes, clean and minimal, suitable for a tech website.\n```\n\n结果不需要完美。它只需要填充空间，给页面视觉结构，并帮助您思考布局和间距。这比留下空白空间或使用损坏的图片链接要好得多。\n\
  \nHero 图片是页面顶部的大型视觉元素。它为后面的所有内容设定基调。\n\n例如，对于一个调查应用登录页面，您可能会生成类似这样的内容：\n\n```\n\
  Please create a web app hero image showing a dashboard with charts and polls, clean\
  \ UI, light background, friendly colors, no text.\n```\n\nHero 图片的一些实用技巧：\n\n- 避免在图片本身中放置重要文本；改用真正的\
  \ HTML 文本\n- 保持构图简单，以便在不同屏幕尺寸下工作\n- Hero 部分首选宽幅、横向图片\n\n生成的图片很有用，但请记住，生成的图片有时可能包含视觉伪影或奇怪的细节。使用前请仔细检查。\n\
  \n位图图片并不总是最佳选择。对于图表、图标以及任何需要干净缩放或动画的内容，矢量图形通常更好。\n\n\n\n\n在*第 4 章*、*绘制可缩放图形*中，您将了解\
  \ SVG，它比位图更适合用于图表、图标、动画以及随数据变化的动态图形。在本书的调查项目中，SVG 对于渲染图表和可视化结果将特别有用。\n\n使用生成的图像来支持页面，而不是分散注意力。有用的图像应符合页面的内容、布局和目的。\n\
  \n## 尝试这些快速编辑以证明它是实时的\n\n当预览打开时：\n\n* 将 `<h1>` 和 `<title>` 文本更改为其他内容\n* 添加新列表项：`<li>I\
  \ can preview changes instantly</li>`\n* 通过将时间值从 10 改为 15 来编辑表格\n\n您已创建一个基本网页并使用了许多不同的\
  \ HTML 元素。您可以创建一个包含只读内容的完整网站，但它将是静态的。使网站具有交互性的最常见方法之一是提供表单供访问者填写并提交。这些可以是用于验证访问者的登录表单，或用于创建或编辑数据的表单。\n\
  \n让我们看看如何创建包含表单和各种输入元素的网页。\n\n### 使用表单和输入元素\n\n到目前为止，您的页面一直是*只读*的。表单是用户在页面中输入信息并将其发送到某处的方式，例如联系表单、登录屏幕、新闻通讯注册、结账等。\n\
  \n其核心是 `<form>` 元素，它包裹您的输入控件（文本框、下拉菜单、按钮）并定义浏览器应如何提交数据。\n\n在本节中，您将：\n\n1. 创建一个名为\
  \ `contact.html` 的新页面，包含联系表单\n2. 从您的 `index.html` **About Me** 页面链接到它\n\n## 创建 contact.html\n\
  \n在 VS Code 中，在与 `index.html` 相同的文件夹中创建一个新文件：`contact.html`。\n\n粘贴以下内容：\n\n此 HTML\
  \ 文件可从以下链接获取：[`github.com/markjprice/web-dev-ai/blob/main/Code/Chapter02/about-me-webpage/contact.html`](https://github.com/markjprice/web-dev-ai/blob/main/Code/Chapter02/about-me-webpage/contact.html)\n\
  \n```\n<!DOCTYPE html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\"\
  >\n    <title>Contact Me</title>\n  </head>\n  <body>\n    <h1>Contact Me</h1>\n\
  \    <p>\n      Use this form to send me a message. For now, it doesn't actually\
  \ send email.\n      It demonstrates how forms collect data and submit it to a server.\n\
  \    </p>\n    <form action=\"/contact\" method=\"post\">\n      <h2>Your details</h2>\n\
  \      <p>\n        <label for=\"fullName\">Full name</label><br>\n        <input\
  \ type=\"text\" id=\"fullName\" name=\"fullName\" required>\n      </p>\n      <p>\n\
  \        <label for=\"email\">Email address</label><br>\n        <input type=\"\
  email\" id=\"email\" name=\"email\" required>\n      </p>\n      <p>\n        <label\
  \ for=\"phone\">Phone (optional)</label><br>\n        <input type=\"tel\" id=\"\
  phone\" name=\"phone\">\n      </p>\n      <h2>Your message</h2>\n      <p>\n  \
  \      <label for=\"topic\">Topic</label><br>\n        <select id=\"topic\" name=\"\
  topic\">\n          <option value=\"question\">Question</option>\n          <option\
  \ value=\"feedback\">Feedback</option>\n          <option value=\"business\">Business\
  \ inquiry</option>\n        </select>\n      </p>\n      <p>\n        <label for=\"\
  message\">Message</label><br>\n        <textarea id=\"message\" name=\"message\"\
  \ rows=\"6\" cols=\"40\" required></textarea>\n      </p>\n      <h2>Preferences</h2>\n\
  \      <p>\n        Preferred contact method:\n        <br>\n        <input type=\"\
  radio\" id=\"contactEmail\" name=\"preferredContact\" value=\"email\" checked>\n\
  \        <label for=\"contactEmail\">Email</label>\n        <br>\n        <input\
  \ type=\"radio\" id=\"contactPhone\" name=\"preferredContact\" value=\"phone\">\n\
  \        <label for=\"contactPhone\">Phone</label>\n      </p>\n      <p>\n    \
  \    <input type=\"checkbox\" id=\"newsletter\" name=\"newsletter\" value=\"yes\"\
  >\n        <label for=\"newsletter\">Send me occasional updates</label>\n      </p>\n\
  \      <p>\n        <button type=\"submit\">Send message</button>\n        <button\
  \ type=\"reset\">Clear form</button>\n      </p>\n    </form>\n    <p>\n      <a\
  \ href=\"index.html\">Back to About Me</a>\n    </p>\n  </body>\n</html>\n```\n\n\
  有几点需要注意：\n\n* `<form>` 具有 `action=\"/contact\"` 和 `method=\"post\"`\n  * `action`\
  \ 是浏览器发送表单数据的 URL\n  * `method=\"post\"` 在请求体中发送数据；`get`（默认）将数据附加到 `?` 后的 URL\n\
  * 每个应提交的控件都有一个 `name=\"...\"`。如果您忘记 name，该值将不会包含在提交的数据中。\n* 每个文本字段都使用 `<label for=\"\
  ...\">` 进行标记，该标记与输入框的 `id` 匹配。这提高了可用性和可访问性。\n\n## 从 index.html 链接到联系表单\n\n打开您现有的\
  \ `index.html` 并在合适的地方添加链接，例如在 `Useful link` 部分下方或靠近底部。\n\n例如：\n\n```\n<h2>Contact</h2>\n\
  <p>\n  Want to get in touch?\n  <a href=\"contact.html\">Go to my contact form</a>.\n\
  </p>\n```\n\n因为 `contact.html` 与 `index.html` 在同一文件夹中，所以简单的**相对链接**（如仅 HTML 文件名）即可工作。或者，您可以使用完整\
  \ URL 指定**绝对链接**：`https://example.com/contact.html`。\n\n绝对链接是资源（如网页）的完整地址，无论当前页面位置如何均可工作。相对链接是基于当前页面位置的较短地址。如果我在阿拉斯加，想给苏格兰的人寄信，我需要使用他们的完整（即绝对）地址。如果我想给我街上的人寄信，我可以交给邻居，让他们转交给“23\
  \ 号的 Bob”。这是相对于同一街道上另一个地址的地址。要寄给同城市的人，我们可能还需要街道名。要寄给同州的人，我们还需要城市名。网页等资源有一个绝对地址，但根据您距离其位置的远近，有许多相对地址。\n\
  \n## 在实时预览中尝试\n\n现在我们可以在实时预览中看到结果：\n\n1. 打开 `index.html` 并启动 `Live Preview`，如*图\
  \ 2.6*所示：\n![](img/B34553_02_06.png)\n图 2.6：联系表单链接的实时预览\n\n1. 点击**转到我的联系表单**链接\n\
  2. 填写表单并点击**发送消息**\n\n您现在可能会看到：\n\n* 如果您留空必填字段，浏览器将阻止提交并提示您。（这是 HTML 的内置验证。）\n*\
  \ 如果确实提交了，您可能会收到 `Cannot POST /contact` 样式的消息、 `404` 或某些 `not found` 响应，如*图 2.7*所示：\n\
  ![](img/B34553_02_07.png)\n图 2.7：没有服务器处理表单时出现的文件未找到消息\n\n出现此错误是因为您的浏览器尝试将表单数据发送到\
  \ `/contact` 服务器，但目前尚无服务器运行来接收它。这在此时是预期的，因为您仅构建了 HTML 页面，而非处理表单的服务器。\n\n您刚刚触及了前端（HTML）和后端（服务器代码）Web\
  \ 开发的界限。您将在*第 9 章*、*Django – 后端 Web 开发*中学习如何处理表单提交。\n\n## 常见表单元素快速实用表\n\n学习时可随身携带的速查表如*表\
  \ 2.1*所示：\n\n| **元素** || **示例** || **用途** |\n| --- | --- | --- |\n\n\n\n\n| 标签 |\
  \ 示例 | 说明 |\n|------|------|------|\n| `<form>` | `<form action=\"/contact\" method=\"\
  post\">` | 包裹输入控件并定义数据提交的位置和方式。`action` 和 `method` 控制提交行为。 |\n| `<label>` | `<label\
  \ for=\"email\">Email</label>` | 为表单控件提供可读标签。最佳实践是将 `for` 与输入框的 `id` 匹配。 |\n| `<input\
  \ type=\"text\">` | `<input type=\"text\" name=\"fullName\">` | 单行文本输入。包含 `name`\
  \ 以便提交。 |\n| `<input type=\"email\">` | `<input type=\"email\" name=\"email\">`\
  \ | 邮箱格式输入，许多浏览器提供基础验证。 |\n| `<input type=\"tel\">` | `<input type=\"tel\" name=\"\
  phone\">` | 电话号码输入（移动端常显示电话键盘）。 |\n| `<textarea>` | `<textarea name=\"message\"\
  ></textarea>` | 多行文本输入（适合留言）。 |\n| `<select> + <option>` | `<select><option value=\"\
  ...\">...</option>...</select>` | 下拉选项列表。每个选项包含文本和可选的 `value`。 |\n| `<input type=\"\
  radio\">` | `<input type=\"radio\" name=\"preferredContact\" value=\"email\">` |\
  \ 从一组中选择一项。通过共享相同的 `name` 进行分组。 |\n| `<input type=\"checkbox\">` | `<input type=\"\
  checkbox\" name=\"newsletter\" value=\"yes\">` | 开/关选项（选中或未选中）。 |\n| `<button type=\"\
  submit\">` | `<button type=\"submit\">Send</button>` | 提交表单。 |\n| `<button type=\"\
  reset\">` | `<button type=\"reset\">Clear</button>` | 将字段重置为初始值。 |\n\n**表 2.1：常见表单元素**\n\
  \n你会看到更多输入类型，但如果初学者熟悉这组元素，就能构建大多数基础表单。\n\n## “向 Web 服务器回发”意味着什么\n\n当用户点击 `Send`\
  \ 按钮时，浏览器会获取所有带有 `name` 属性的表单控件，并将它们作为 HTTP 请求发送到 `action` 指定的 URL。\n\n提交数据有两种常见方式：\n\
  \n*   `GET`（默认）：表单数据追加在 URL 的 `?` 之后。适合搜索和筛选，方便分享链接。\n*   `POST`：表单数据在请求体中发送。常用于联系表单、登录或任何改变服务器状态的操作，如编辑客户或订单数据的表单。\n\
  \n在服务端（稍后你将使用 Django 实现），Web 应用会：\n\n1.  在类似 `/contact` 的路径接收请求\n2.  读取提交的字段（名称/值对）\n\
  3.  验证它们（真正的验证，而非仅浏览器验证）\n4.  做有用的事：\n    *   存入数据库\n    *   发送邮件\n    *   创建支持工单\n\
  5.  返回响应页面（如 `Thanks, message received!`）\n\n此阶段你仅构建 HTML 用户界面。服务端处理稍后介绍。\n\n**提示**：请展示浏览器提交表单数据时的样子，包括\
  \ `GET` 和 `POST` 的区别，并给出真实的 HTTP 示例。\n\n让我们利用 AI 教练探索 HTML 历史，然后通过测验和构建更多网页来练习所学。\n\
  \n### AI 练习\n\n现在让我们使用你喜欢的聊天机器人深入学习 HTML，先了解 HTML 历史，再测验 HTML 语法。\n\n## HTML 历史\n\
  \nHTML 经历了多个版本，当前版本是 HTML5。让我们了解一下 HTML 的历史：\n\n**提示**：请展示 HTML 版本及其发布时间的表格。然后描述\
  \ HTML5 并列出它引入的新标签及其用途。\n\n## HTML 章节测验\n\n尽量不回看章节内容回答以下问题。\n\n此测验检查你是否理解 HTML 的用途，而非能否凭记忆敲出标签。\n\
