  \n### 第 1 部分：单选题\n\n**1. HTML 的主要目的是什么？**\n\nA. 控制网页外观  \nB. 添加动画和交互  \nC. 描述网页内容的结构和含义\
  \  \nD. 在服务端处理数据\n\n**2. 页面最重要的标题应使用哪个标签？**\n\nA. `<h6>`  \nB. `<heading>`  \nC.\
