  \n### 链接\n\n* OpenAI Codex 文档：`https://platform.openai.com/docs`\n* OpenAI CLI 工具概览：`https://platform.openai.com/docs/guides/tools`\n\
  * Claude Code 概览：`https://www.anthropic.com/claude-code`\n* Anthropic Claude 文档：`https://docs.anthropic.com/`\n\
