- "\n# 使用规格驱动开发添加项目功能\n\n\n\n# 规格驱动开发\n\n在上一章中，你使用了一个大型提示词和产品需求文档来生成 `TallyApp` 的第一个可工作版本。该方法展示了\
  \ AI 工具如何快速搭建整个项目。然而，真实的软件项目很少在第一次实现后就停止。随着系统演进，会不断添加新功能、优化行为，并发现边缘情况。\n\n对于下一个功能，不要一开始就让\
  \ AI “添加一些有用的东西”。首先要把功能写下来。说明它应该做什么、谁可以使用、失败时会发生什么，以及你将如何验证它是否工作。\n\n这种工作方式通常称为**规格驱动开发**。规格说明成为功能的约定描述，而代码成为其实现。当涉及\
  \ AI 编码助手时，这种纪律尤为重要，因为它们倾向于根据未经验证的假设编造行为来填补缺失的细节。清晰的规格说明减少了 AI 需要填补的空白，也减少了 AI 发明你未要求的行为的空间。\n\
  \n在本章中，你将把这种方法应用到现有的 `TallyApp` Django 项目中。你将通过设计和实现一个小而现实的功能来扩展当前的代码库，而不是生成一个全新的应用程序。\n\
  \n到本章结束时，你将编写一个结构化的功能规格说明，使用 AI 编码助手在现有的 Django 项目中实现它，并验证该实现是否满足明确定义的验收标准。\n\n\
  ## 涵盖主题\n\n- 规格驱动开发\n- 使用 `Spec Kit` 构建规格说明\n- 为 `TallyApp` 添加 URL 短链接功能\n- 扩展 `TallyApp`\
  \ 的思路\n\n本章建议的聊天机器人提示词及示例回复可在以下链接找到：[`github.com/markjprice/web-dev-ai/blob/main/prompts/ch14-spec/readme.md`](https://github.com/markjprice/web-dev-ai/blob/main/prompts/ch14-spec/readme.md)\n\
  \n## 规格驱动开发\n\n在规格驱动开发中，你从系统应该做什么的书面描述开始。你不再从代码开始并希望设计能自行理顺，而是先写下功能：问题是什么、范围内有什么、范围外有什么、工作完成时必须满足什么条件。然后再实现。\n\
  \n这个想法并不新鲜。优秀的工程师一直在编写需求、用户故事和验收标准。新的是 AI 编码助手的出现。像 `GitHub Copilot`、`OpenAI Codex`\
  \ 和 `Claude Code` 这样的工具可以快速生成大量代码。它们可以搭建项目、重构模块，甚至提出架构变更。这有帮助，但也引入了风险。如果没有清晰的规格说明，AI\
  \ 工具会自信地实现你未曾预期的假设。它们会填补你未曾察觉的空白。它们会优化合理性而非正确性。这很危险，因为看似合理的代码往往比明显损坏的代码更难被发现。\n\n\
  规格驱动开发为 AI 辅助编码带来了纪律。规格说明成为参考文档。它定义了功能范围、非目标、数据模型、用户界面行为和错误条件。AI 不再被要求*构建一个应用*，而是被要求满足明确的验收标准。每个需求必须可追溯到代码。每个行为必须可验证。\n\
  \n这就是规格说明重要的原因。`Codex` 或 `Claude Code` 可以编写大量 Django 代码，但除非你定义什么是“完成”，否则它不会知道功能是否完成。对于\
  \ URL 短链接功能，这意味着编写诸如：谁可以创建链接、代码如何生成、未知代码会发生什么、哪些测试必须通过等规则。\n\n> **提示：** 为什么当规格说明不完整时，AI\
  \ 编码助手倾向于做出错误的假设？描述在使用 AI 编码助手时模糊需求的风险。\n\n测试将规格说明从文档转变为可强制执行的东西。无法验证的规格说明只是文档。有自动化测试支撑的规格说明变得可强制执行。在\
  \ Python Web 项目中，这通常意味着将验收标准映射到使用 `pytest` 的单元测试，并在适当的情况下映射到浏览器级测试。测试套件成为裁判。当 AI\
  \ 生成代码时，测试决定该代码是否可接受。如果失败，实现就是错误的，无论它看起来多么完善。\n\n### 优秀规格说明包含的内容\n\n一个有用的 Web 功能规格说明应该简短，但不能模糊。对于\
  \ `TallyApp`，典型的功能规格说明可能包含以下部分：\n\n#### 目标\n\n简短段落描述此功能实现了什么。示例：*允许已认证用户创建、编辑和删除调查*。\n\
  \n#### 非目标\n\n列出你刻意不构建的内容。示例：*本迭代不包含公开调查分享*。\n\n> **提示：** 请解释为什么“非目标”在软件规格说明中很重要，并给出真实项目中的例子。\n\
  \n#### 用户故事\n\n从用户角度编写主要交互：\n\n- 作为已登录用户，我可以创建新调查\n- 作为已登录用户，我可以编辑现有调查的标题\n- 作为已登录用户，我可以删除我自己的调查\n\
  \n#### 验收标准\n\n这些是精确的、可测试的条件。验收标准应写得无需重新解释即可成为测试。避免像* UI 应该简洁*这样的模糊陈述。它们应该是可观察的事实：\n\
  \n- 提交有效的调查表单时，调查保存到数据库\n- 提交无效表单时，显示验证错误\n- 用户不能编辑其他用户的调查\n- 删除后，调查不再出现在列表视图中\n\
  \n> **提示：** 请展示一些编写不佳的验收标准示例，以及如何将它们重写为清晰、可测试的需求。\n\n#### 数据模型变更\n\n定义字段、关系和约束。例如：\n\
  \n- Survey: `id` (主键), `owner` (外键关联用户), `title` (字符串, 最大长度 200), `created_at` (时间戳)。如果字段有约束，写下来。如果关系有级联行为，指明它。\n\
  \n#### 错误处理和边缘情况\n\n- 如果用户尝试编辑不存在的调查会发生什么？\n- 如果缺少必需数据会发生什么？\n- 对于禁止访问应返回什么 HTTP\
  \ 状态码？\n\n> **提示：** 请给出开发人员编写规格说明时常忘记的边缘情况示例。请解释如何识别软件规格说明中的隐性假设。\n\n#### 验证命令\n\
  \n写下稍后如何检查该功能：\n\n- 运行单元测试\n- 运行集成测试\n- 启动开发服务器，如有需要手动确认行为\n\n> **提示：** 请解释规格驱动开发与**测试驱动开发**（TDD）和**行为驱动开发**（BDD）有何不同。包含规格驱动开发、TDD\
  \ 和 BDD 的并排比较，包括各自的优缺点。\n\n## 规格驱动开发工具\n\n\n\n并没有一种标准的方式来进行规格驱动工作。不同的团队以不同的方式构建规格，使用不同的术语，并自动化流程的不同部分。一些开发人员倾向于将轻量级\
  \ Markdown 文档与源代码一起存储。其他人则使用类似于传统需求文档的结构化模板。一些流程强调自动化测试作为规格的可执行形式，而另一些则侧重于指导 AI\
  \ 工具分阶段实现的规划工件。\n\n一小部分支持这种开发风格的工具生态系统已经开始出现。一个例子是 **Spec Kit**，这是 GitHub 的一个开源项目，提供用于编写规格、生成实现计划和将功能分解为任务的模板和命令。另一个工具是\
  \ **OpenSpec**，旨在标准化可被 AI 代理解释的机器可读软件规格。一些开发人员还在尝试内置于 AI 编码环境（如 Cursor、Continue\
  \ 和 Claude Code）中的规格优先工作流，其中结构化提示和规划步骤引导模型进行功能开发。\n\n**警告！** 由于 GitHub Spec Kit、OpenAI\
  \ Codex、Anthropic Claude Code 和其他 AI 工具正在快速演变，请将确切的提示和细微的设置细节视为可能会随时间而变化。\n\n现在您已经了解了一些规格驱动开发工具，让我们更详细地看看一个实用的选项。\n\
  \n# 使用 Spec Kit 构建规格\n\n支持规格驱动开发的一个实用工具是 **Spec Kit**，这是 GitHub 发布的一个开源项目。它为编写规格、规划实现和协调\
  \ AI 辅助开发提供了结构化的工作流和模板。\n\nSpec Kit 不是框架或库。相反，它是一个轻量级系统，帮助开发人员组织他们的规格，以便人类和 AI 助手都能清晰地理解它们。\n\
  \n## Spec Kit 工作流\n\nSpec Kit 将开发组织为一系列阶段。每个阶段生成一份文档，在进入下一步之前阐明系统。\n\n典型的工作流如下所示：\n\
  \n### 1. 项目原则，也称为宪章\n\n一份定义项目高层规则和理念的文档。这些可能包括编码标准、架构约束或测试要求等约定。\n\n此阶段解决的示例问题：\n\
  \n* 系统应优先考虑简单性还是可扩展性？\n* 需要哪些测试实践？\n* 允许或禁止哪些技术？\n\n这份文档设定了 AI 在更改项目时应遵循的规则。\n\n\
  ### 2. 功能规格\n\n规格描述将要构建的功能。\n\n它通常包括：\n\n* 功能目标\n* 非目标和约束\n* 用户故事\n* 验收标准\n* 数据模型变更\n\
  * 错误处理和边缘情况\n\n这是您准确定义功能必须做什么的阶段。\n\n### 3. 实现计划\n\n规格获批后，下一份文档描述功能将如何实现。\n\n计划通常包括：\n\
  \n* 架构变更\n* 新模块或服务\n* 数据库迁移\n* 测试策略\n* 部署考量\n\nAI 工具在此阶段特别有用，因为它们可以根据规格建议实现方法。\n\
  \n### 4. 任务分解\n\n然后将实现计划转换为具体开发任务的列表。\n\n例如：\n\n* 创建 ShortLink Django 模型\n* 添加重定向视图\n\
  * 创建生成短链接的表单\n* 编写单元测试\n\n这些任务可以按顺序执行，通常在 AI 协助下进行。\n\n### 5. 实现\n\n只有在定义了规格、计划和任务之后，实际编码才开始。\n\
  \n在此阶段，AI 助手获得清晰的指令和约束。它不再发明行为，而是简单地实现已描述的内容。\n\n**提示**：请解释 Spec Kit 和 OpenSpec\
  \ 等工具如何帮助防止 AI 编码助手引入意外功能。\n\n结构有帮助，但也有成本。在对每个更改都使用 Spec Kit 之前，值得了解何时更轻量的方法就足够了。\n\
  \n## 何时 Spec Kit 属于过度设计？\n\nSpec Kit 可以帮助保持 AI 生成的工作在正轨上，但对于小更改来说可能过头了。您用一些编码时间换取了更多的规划和审查时间。\n\
  \n让我们了解 Spec Kit 何时可能属于过度设计或不必要。\n\n### 何时更轻量的提示就足够\n\n如果您处于探索阶段，例如原型设计 UI 或测试基本概念，Spec\
  \ Kit 的严格流程（`/constitution` → `/specify` → `/plan` → `/tasks`）会拖慢您的速度。\n\n小项目通常受益于氛围编码，即您给出一个高层提示并直接在代码上迭代。为周末业余项目设置宪章属于过度设计。\n\
  \n### 高上下文代码比\n\nSpec Kit 可以为单个功能生成数百行 Markdown。对于小项目（如只有两个视图的基本 URL 短链接服务），文档可能比代码还长。例外是学习时，因为较小的项目更容易理解。\n\
  \n风险在于您花在阅读和纠正 AI 的计划和规格上的时间，可能比直接编写代码或审查单次 AI 输出所需的时间还要多。\n\n### 小调整和一次性错误修复\n\n\
  如果您只是更改按钮颜色、更新正则表达式或修复简单的逻辑错误，只需直接提示您的 AI 编码工具。为 5 行更改运行完整的 `/specify` 和 `/plan`\
  \ 周期效率低下，并会给您的仓库添加不必要的文件。\n\n### Token 成本和速度\n\nSpec Kit 工作流中的每一步都涉及与 LLM 的大量来回交互，消耗数千个\
  \ token 并花费数分钟的处理时间。\n\n对于小项目，您希望在 10 秒内得到结果。Spec Kit 让您等待 AI 思考架构，这对于成熟路径（如基本的\
  \ Django 应用）通常是不必要的。\n\n## Birgitta Böckeler 的分类法\n\n规格驱动开发最好理解为一个光谱。一端，您可能编写一个捕捉意图的简短提示。另一端，您可能生成一个包含验收标准和验证步骤的完整规格。*Birgitta\
  \ Böckeler* 将规格驱动工作描述为一个光谱，而不是单一的僵化过程。\n\n* Birgitta Böckeler 的 * 规格驱动开发分类法不是像已发布规格那样的正式标准。它是一种实用的描述方式，说明在使用\
  \ AI 时，它在不同严谨程度下是如何体现的。\n\n### 轻量级\n\n您仍然在编码前思考，但规格是最小化的。它可能是一段简短的文字、一个清单，甚至是一个精心设计的提示。典型特征：\n\
  \n* 目标的简要描述\n* 可能几个约束或边缘情况\n* 通常直接嵌入 AI 提示中\n* 几乎没有单独的工件\n\n用于小功能、错误修复和探索性工作，您在快速迭代。关键思想是您在引导\
  \ AI，但不将所有内容形式化。这仍然算作 SDD，因为您在编码前描述了变更。\n\n### 结构化\n\n这更接近我们在本章将看到的内容。典型特征：\n\n\
  * 清晰编写的规格\n* 定义的行为和用户交互\n* 数据模型考量\n* 验收标准或测试用例\n* 与实现步骤分离\n\n\n\n# 使用 Spec Kit 进行规格驱动开发\n\
  \n## 正式或端到端\n\n这是完整版本，通常与 Spec Kit 等框架相关联。典型特征：\n\n* 多个结构化工件（规格、计划、任务、验证步骤）\n* 从需求到实现的可追溯性\n\
  * 规格本身的迭代优化\n* 在较长工作流中人类与 AI 的强对齐\n\n将其用于大型功能或系统、高风险或高复杂度工作，以及协调至关重要的团队环境。关键思想是规格驱动整个生命周期，而不仅仅是初始提示。\n\
  \n您可以通过以下链接了解更多关于 Birgitta Böckeler 的信息并观看她的一些会议演讲：[`gotopia.tech/experts/1305/birgitta-boeckeler`](https://gotopia.tech/experts/1305/birgitta-boeckeler)\n\
  \n## Spec Kit 的替代方案\n\n结构化 AI 开发工作流并非一刀切。较重的框架（如 Spec Kit）在您需要强护栏、显式规划以及在更大或风险更高的项目中进行可追溯的交接时效果很好。\n\
  \n对于较小的功能或个人工作，较轻量的方法（如 `OpenSpec`）可能更合适，因为它保留了记录意图的习惯，而不会将过程变成文档工厂。目标是给 AI 足够清晰的上下文以生成更好的代码。\n\
  \n对于探索规格驱动 AI 工作流的读者来说，存在一个光谱。Spec Kit 更结构化且面向阶段。OpenSpec 更轻量且较少面向阶段。初学者应警惕任何产生大量规划文档却无法明确改进实现、测试或审查的方法。\n\
  \n您可以通过以下链接了解更多关于作为 Spec Kit 替代方案的 OpenSpec：[`github.com/Fission-AI/OpenSpec`](https://github.com/Fission-AI/OpenSpec)\n\
  \n## Spec Kit 命令\n\nSpec Kit 包含辅助脚本，可自动化该过程的部分步骤。初始化项目后，您可以运行指导开发过程的命令：\n\n1. `/speckit.constitution`\
  \ – 定义项目原则\n2. `/speckit.specify` – 创建基线规格\n3. `/speckit.plan` – 生成实现计划\n4. `/speckit.tasks`\
  \ – 将计划分解为任务\n5. `/speckit.implement` – 执行实现\n\n其他命令有助于优化规格或检查工件间的一致性。\n\n**警告！**\
  \ GitHub 当前的 Spec Kit README 指出，大多数代理暴露 `/speckit.*` 斜杠命令，但 Codex CLI 在技能模式下使用 `$speckit-*`。技能模式在功能标志后面，因此如果您未显式启用它，则不在使用它。要启用技能模式，您应该这样启动\
  \ Codex：`codex --enable skills`。如果您未传递该标志（或在设置中配置），则技能处于关闭状态。\n\n这些命令本身不生成生产代码。相反，它们构建与\
  \ AI 的对话结构，使每一步都建立在前一步的基础上。\n\nAI 编码工具擅长填补空白。当空白显而易见时这很有用，但当缺失细节是产品决策时则有风险。如果规格未说明短链接是公开、私有、过期还是可追踪的，工具可能会替您做决定。\n\
  \nSpec Kit 通过使规格显式化和结构化来减少此问题。因为规格、计划和任务都存在于仓库中，它们可以随时间被审查、版本化和改进。\n\n对于尝试 AI 辅助开发的团队，这种方法提供了有用的平衡：AI\
  \ 生成代码的速度与传统软件工程的纪律相结合。\n\n## 安装 Specify CLI\n\n本章中，使用 `uv` 安装 GitHub SpecKit `Specify\
  \ CLI`，如以下命令所示：\n\n```\nuv tool install specify-cli --from git+https://github.com/github/spec-kit.git\n\
  ```\n\n`uv` 是来自 Astral 的快速 Python 包管理器。我们在此使用它是因为 Spec Kit 从 Git 仓库安装时，`uv tool\
  \ install` 更可靠。如果您愿意，也可以克隆仓库并使用 `pip install -e` 安装。\n\n如果尚未安装 `uv`，请先安装 `uv`，然后运行上述命令。您可以从以下链接安装\
  \ `uv`：[`docs.astral.sh/uv/getting-started/installation/`](https://docs.astral.sh/uv/getting-started/installation/)。\n\
  \n安装后，确认 Specify CLI 及其依赖可用：\n\n```\nspecify check\n```\n\n流程就绪后，让我们将其应用到一个自然适合调查应用的小功能上。\n\
  \n# 为 TallyApp 添加 URL 短链接功能\n\n学习如何进行规格驱动开发的一个有用方法是向现有系统添加功能。在本节中，您将为 TallyApp 添加一个\
  \ URL 短链接功能。\n\n## 为什么要用 URL 短链接？\n\nURL 短链接似乎与调查无关。但调查创建者经常想在电子邮件、演示文稿或印刷材料中分享他们的调查链接。像\
  \ [`tallyapp.example.com/surveys/8e5a4c39-2f4d-4b9e-bbfa-2c10a96d21fd/take/`](https://tallyapp.example.com/surveys/8e5a4c39-2f4d-4b9e-bbfa-2c10a96d21fd/take/)\
  \ 这样的长 URL 不便于分享。像 [`tallyapp.example.com/s/abc123`](https://tallyapp.example.com/s/abc123)\
  \ 这样的短链接更容易记忆和分发。\n\n此功能的目标是允许调查创建者生成一个重定向到其调查的短链接。\n\n**提示**：请解释 URL 短链接的内部工作原理。描述生成短\
  \ URL 代码的常用算法，并比较随机代码生成与基于哈希的 URL 缩短。\n\n## 编写功能规格\n\n在编写任何代码之前，定义功能的行为。\n\n典型的功能规格包含以下部分。\n\
  \n### 目标\n\n允许已认证用户创建重定向到 TallyApp 内部较长链接的短 URL。\n\n最常见的用例将是为调查生成短链接。\n\n### 非目标\n\
  \n为保持功能小而专注，我们明确排除以下几项能力：\n\n* 首版本无分析追踪\n* 链接无过期日期\n* 无自定义别名（用户不能选择短代码）\n* 仅已认证用户可创建短链接\n\
  \n这些限制防止功能扩展成全功能的商业式服务。\n\n### 用户故事\n\n从用户角度描述交互：\n\n* 作为已登录用户，我可以为调查 URL 创建短链接\n\
  * 作为已登录用户，我可以查看我创建的短链接列表\n* 作为任何访问者，我可以访问短 URL 并被重定向到目标页面\n\n图 14.1 展示了当有人访问像 `/s/abc123`\
  \ 这样的短链接时会发生什么：\n\n![](img/B34553_14_01.png)\n\n图 14.1：URL 短链接请求流程\n\nURL 短链接请求流程：\n\
  \n1. 浏览器从您的站点请求短 URL。\n2. Django 匹配 `/s/<code>/` 模式并调用视图 `redirect_short`。\n3. 视图在\
  \ `ShortLink` 表中查找代码。\n4. Django 返回 HTTP 302 重定向到原始调查 URL 供浏览器请求。\n5. 如果代码不存在，Django\
  \ 返回 `404 Not Found` 响应。\n\n### 验收标准\n\n这些标准定义可观察的行为：\n\n* 提交有效 URL 时，生成短代码\n* 短代码唯一\n\
  * 访问 `/s/<code>` 重定向到存储的目标 URL\n* 用户只能看到他们创建的短链接\n\n\n\n如果短代码不存在，将返回 `404 Not Found`\
  \ 响应。\n\n这些条件足够具体，可以转化为自动化测试。\n\n### 数据模型\n\n添加一个名为 `ShortLink` 的新 Django 模型。其字段如表\
  \ 14.1 所示：\n\n| **字段** | **类型** | **描述** |\n| --- | --- | --- |\n| `id` | 主键 | 内部标识符\
  \ |\n| `owner` | `ForeignKey(User)` | 短链接的创建者 |\n| `target_url` | `URLField` | 原始\
  \ URL |\n| `code` | `CharField(10)` | 唯一短标识符 |\n| `created_at` | `DateTimeField`\
  \ | 时间戳 |\n\n表 14.1：ShortLink 模型的字段\n\n模型约束：\n\n*   `code` 值必须唯一，且最多十个字符\n*   `code`\
  \ 值应从 URL 安全字符中随机生成\n\n### 验证步骤\n\n可以通过以下方式验证该功能：\n\n1.  运行单元测试\n2.  在浏览器中访问生成的短链接\n\
  3.  确认重定向行为\n\n## 请求 AI 生成实现计划\n\n规范存在后，你可以将其提供给 AI 编码助手并请求计划。\n\n示例提示词：\n\n```\n\
  You are helping extend an existing Django project named TallyApp.\nImplement the\
  \ following feature according to the specification below.\n[Paste spec]\nFirst generate\
  \ an implementation plan. Do not write code yet.\n```\n\n一个好的计划应建议如下步骤：\n\n1.  创建一个名为\
  \ `shortlinks` 的新 Django 应用\n2.  定义 `ShortLink` 模型\n3.  添加迁移\n4.  创建视图用于：\n    *\
  \   创建短链接\n    *   重定向短链接\n5.  添加 URL 路由\n6.  创建基础 HTML 表单\n7.  添加单元测试\n\n在请求 AI\
  \ 实现之前，请先审查计划。\n\n## 使用 Specify 和 Codex 规划并实现 URL 短链接功能\n\n首先，关于组件的说明。GitHub 的 Spec\
  \ Kit 及其 Specify CLI 可以初始化现有项目、安装模板并生成特定代理的命令文件。Spec Kit 支持 Codex CLI 作为首选代理选项，并专门记录了\
  \ `specify init . --ai codex` 和 `specify init --here --ai codex` 用于现有项目。\n\nOpenAI\
  \ 当前的 Codex 设置流程是：登录，选择要让 Codex 处理的文件夹或仓库，然后开始任务。\n\n让我们分步使用 SpecKit 与 Codex：\n\n\
  1.  在现有 Django 项目的根文件夹中开始，即包含 `manage.py` 和应用文件夹的同一文件夹。\n2.  在当前文件夹中初始化 Spec Kit，而不是创建新文件夹：\n\
  \n    ```\n    specify init . --ai codex\n    ```\n\n    Spec Kit 也支持 `--script\
  \ ps`，如果你想要面向 PowerShell 的脚本，这在 Windows 上是明智的选择：`specify init . --ai codex --script\
  \ ps`\n\n3.  你将收到关于现有文件的警告，如图 14.2 所示：\n\n    ![](img/B34553_14_02.png)\n\n    图\
  \ 14.2：在项目文件夹中初始化 Specify\n\n4.  按 `Y` 继续。\n5.  选择是否需要 Bash/shell 或 PowerShell 脚本。只要安装了\
  \ **Windows Subsystem for Linux 2** (**WSL2**)，两者在 Windows 上都可用。在 Mac 或 Linux 上，选择\
  \ Bash。\n\n    **提示**：请解释 GitHub Spec Kit 的内部工作原理及其在项目仓库中生成的文件。展示 Spec Kit 创建的目录结构并解释每个文件的用途。\n\
  \n6.  为该项目设置 Codex 配置的环境变量：\n\n    ```\n    setx CODEX_HOME \"C:\\web-dev-ai\\TallyProject\\\
  .codex\"\n    ```\n\n7.  使用最新的 GPT 模型启动 Codex，例如 2026 年 4 月的 5.5 版本：\n\n    ```\n\
  \    codex --model gpt-5.5\n    ```\n\n    截至 2026 年 4 月撰写时，OpenAI 也表示 GPT-5.5 现已在\
  \ Codex 中可用，且是大多数 Codex 任务的推荐选择；在 CLI 中可使用 `codex --model gpt-5.5` 启动会话。你可以在以下链接查看最新的\
  \ OpenAI Codex 模型：[`developers.openai.com/codex/models`](https://developers.openai.com/codex/models)\n\
  \n8.  在 Codex 中创建宪章文件，如图 14.3 和以下输出所示：\n\n    ```\n    /speckit.constitution\n \
  \   This is an existing Django project named TallyApp.\n    Project principles:\n\
  \    1. Keep the architecture simple and beginner-friendly.\n    2. Prefer Django\
  \ built-ins over third-party packages unless there is a strong reason.\n    3. Write\
  \ code that is readable for learners new to Django.\n    4. Use pytest or Django\
  \ tests to verify acceptance criteria.\n    5. Add small, incremental features instead\
  \ of broad architectural rewrites.\n    6. Preserve existing behavior unless the\
  \ spec explicitly changes it.\n    7. Use server-rendered Django templates unless\
  \ a richer client-side experience is clearly justified.\n    8. Avoid over-engineering.\n\
  \    ```\n\n    ![](img/B34553_14_03.png)\n\n    图 14.3：创建宪章文件\n\n## 创建 URL 短链接规范\n\
  \n接下来，运行 Spec Kit 规范步骤。记录的命令是 `/speckit.specify`。\n\n在 Codex 中运行：\n\n```\n/speckit.specify\n\
  ```\n\n然后粘贴如下聚焦的提示词：\n\n```\nCreate a feature specification for adding a URL shortener\
  \ to the existing TallyApp Django project.\nGoal:\nAllow authenticated users to\
  \ create short URLs that redirect to longer links inside TallyApp. The main use\
  \ case is generating short links for surveys so they are easier to share.\nNon-goals:\n\
  - No click analytics in this version\n- No expiration dates\n- No custom aliases\n\
  - Only authenticated users can create short links\nUser stories:\n- As a logged-in\
  \ user, I can create a short link for a survey URL\n- As a logged-in user, I can\
  \ view a list of short links I created\n- As any visitor, I can visit a short URL\
  \ and be redirected to the target page\nAcceptance criteria:\n- When a valid URL\
  \ is submitted, a short code is generated\n- The short code is unique\n- Visiting\
  \ /s/<code> redirects to the stored target URL\n- A user can only see short links\
  \ they created\n- If a short code does not exist, return 404 Not Found\nData model:\n\
  ShortLink\n- owner: ForeignKey(User)\n- target_url: URLField\n- code: CharField(max_length=10,\
  \ unique=True)\n- created_at: DateTimeField(auto_now_add=True)\nConstraints:\n-\
  \ code must be unique\n- codes should be randomly generated\n- deleting the owning\
  \ user deletes the link\nPlease generate a spec that matches the existing Django\
  \ codebase and keeps the implementation small and teachable.\n```\n\n当 Codex 生成规范时，请仔细阅读。这是你应该纠正任何过于聪明、过于宽泛或与现有\
  \ TallyApp 设计不一致的地方。\n\n你可以随意修改 Specify 为你创建的任何文件。\n\n## Spec Kit 文件应提交到 Git 吗？\n\
  \n在大多数教学和团队项目中，是的：提交解释功能的规范工件，特别是 `specs/` 文件夹和 `spec.md`、`plan.md`、`tasks.md`、`quickstart.md`\
  \ 等文件。这些文件是项目设计历史的一部分。它们解释了你要求 AI 构建什么、接受了什么以及功能应如何验证。\n\n请更谨慎地对待 `.specify/` 文件夹。它可能包含项目级的\
  \ Spec Kit 配置、模板、脚本和代理命令文件。对于团队项目，如果你希望每个人使用相同的 Spec Kit 工作流，则提交它。对于单人实验，如果它只包含可重新创建的生成辅助文件，可以将其保留在本地。\n\
  \n\n\n\n\n不要盲目提交所有内容。提交前，请运行 `git status` 并检查变更文件。不要提交密钥、个人机器路径、API 密钥、临时输出、缓存、`__pycache__/`、虚拟环境或代理日志。如果\
  \ Spec Kit 创建了定义共享工作流的文件，请提交它们。如果文件只是本地工具状态，请忽略它们。\n\n以下是一个小型的 `.gitignore` 示例：\n\
  \n```\n# Python\n__pycache__/\n*.py[cod]\n.venv/\n.env\n# 本地工具输出\nout/\n*.log\n\
  # 保持 Markdown 规格说明书和项目文档被跟踪。\n# 不要忽略 *.md。\n```\n\n生成规格说明书不等于批准它。这是你的判断比 AI 的流畅度更重要的第一个节点。\n\
  \n## 审查生成的规格文件\n\nSpec Kit 将规格作为仓库工件存储。例如，`specs/` 下包含 `spec.md` 和相关规划文档的功能文件夹。\n\
  \n打开新的规格文件并检查五件事：\n\n* 目标清晰。\n* 非目标真正限制范围。\n* 验收标准可测试。\n* 数据模型小巧且适配 Django。\n* 功能不添加仪表板、分析、**Quick\
  \ Response**（**QR**）码或你未请求的管理流程等额外内容。\n\n此审查很重要，因为后续步骤将基于此文件构建。\n\n## 请 Codex 生成实施计划\n\
  \n规格说明书看起来正确后，使用以下命令进入规划阶段：\n\n```\n/speckit.plan\n```\n\n使用如下提示词：\n\n```\nCreate\
  \ an implementation plan for the URL shortener feature in TallyApp.\nConstraints:\n\
  - Existing Django project\n- Keep the code simple and suitable for a teaching project\n\
  - Prefer one new app named shortlinks unless there is a compelling reason not to\n\
  - Use Django templates and standard views\n- Include tests for redirect behavior,\
  \ permissions, and 404 handling\n- Do not introduce background jobs, analytics,\
  \ or external services\n```\n\n然后检查计划。一个好的计划应提及创建应用、模型、迁移、表单、视图、路由、模板和测试，而不涉足不必要的抽象。\n\
  \n**提示词**：开发者在请求 AI 生成实施计划时应如何构建提示词？\n\n## 请 Codex 将计划拆解为任务\n\n接下来，运行：\n\n```\n\
  /speckit.tasks\n```\n\n像这样提示它：\n\n```\nBreak the URL shortener implementation plan\
  \ into a sequence of small, reviewable tasks.\nEach task should be concrete and\
  \ produce a visible result.\nInclude tasks for:\n- model creation\n- migrations\n\
  - creation form\n- list page for a user's links\n- redirect route\n- tests\n- brief\
  \ documentation update\n```\n\n在此阶段保持工作量小。如果 Codex 创建了一个名为 *Implement URL shortener*\
  \ 的巨大单一任务，请推回并要求它更细致地拆分工作。\n\n## 让 Codex 实现功能\n\n现在运行：\n\n```\n/speckit.implement\n\
  ```\n\n给 Codex 一个严格的提示词，例如：\n\n```\nImplement the URL shortener feature according\
  \ to the approved specification, plan, and task list.\nRequirements:\n- Follow the\
  \ project principles\n- Keep the implementation minimal and readable\n- Do not add\
  \ features not in the spec\n- Update URLs, templates, models, and tests as needed\n\
  - Run the test suite and report any failures clearly\n- Show me the diff or summarize\
  \ changed files before any large refactor\n```\n\nOpenAI Codex 是一个在项目文件夹和仓库上工作的编码代理，GitHub\
  \ Spec Kit 旨在提供 Codex 可以执行的暂存工件。这种组合正是你想要的：规格约束代理，代理编写代码。\n\nCodex 将输出摘要：\n\n```\n\
  Implemented the URL shortener feature and kept it within the approved scope: one\
  \ new shortlinks app, standard Django views/templates, no analytics, no background\
  \ jobs, no external services.\n  What Changed\n  Core feature:\n  - Added shortlinks/models.py,\
  \ shortlinks/forms.py, shortlinks/views.py, shortlinks/urls.py, shortlinks/admin.py,\
  \ and shortlinks/migrations/0001_initial.py.\n  - Added the create/list templates\
  \ at shortlinks/templates/shortlinks/shortlink_form.html and shortlinks/templates/shortlinks/shortlink_list.html.\n\
  \  - Wired the app into tallyapp/settings.py and tallyapp/urls.py.\n  - Added a\
  \ simple navigation entry in surveys/templates/surveys/base.html and a dashboard\
  \ button in surveys/templates/surveys/dashboard.html.\n  Verification and docs:\n\
  \  - Added feature tests in shortlinks/tests.py and a regression check in surveys/tests.py.\n\
  \  - Updated project-brief.md, quickstart.md, and marked all tasks complete in tasks.md.\n\
  \  - Added a minimal .gitignore for Python/Django and local Node artifacts.\nTests\n\
  \  Ran python manage.py test shortlinks surveys\n  Result: 17 tests run, all passed.\n\
  \  Notes\n  All URL shortener tasks are now marked complete. The working tree also\
  \ contains pre-existing planning/spec changes under .specify/ plus generated __pycache__\
  \ updates from test execution; I did not revert those automatically.\n```\n\n根据输出，所有\
  \ URL 短链接任务现已标记为完成，因此下一步是审查实现，如果满意则接受它。测试通过令人鼓舞，但这不代表可以停止思考。\n\n## 接受前审查实现\n\n不要盲目信任第一遍。阅读每个变更文件。我会特别检查：\n\
  \n* `shortlinks/models.py`\n* `shortlinks/views.py`\n* `shortlinks/forms.py`（如果添加了）\n\
  * `shortlinks/urls.py`\n* 项目 `urls.py`\n* 创建/列表页面的模板\n* 测试文件\n* 任何迁移文件\n\n注意 Codex\
  \ 是否严格遵循了规格。AI 编码代理能生成可工作的代码，但它们仍有添加没人要求的“有用东西”的习惯。\n\n**提示词**：请解释开发者如何有效审查 AI 生成的代码。\n\
  \n## 在本地运行 Django 并手动验证功能\n\n从 TallyApp 根目录运行常规 Django 命令：\n\n1. Codex 可能已创建迁移，但如果没有模型变更此命令无害。创建迁移：\n\
  \n   ```\n   python manage.py makemigrations\n   ```\n\n2. 执行迁移：\n\n   ```\n   python\
  \ manage.py migrate\n   ```\n\n3. 运行测试：\n\n   ```\n   python manage.py test\n  \
  \ ```\n\n4. 启动 Web 项目：\n\n   ```\n   python manage.py runserver\n   ```\n\n5. 然后在浏览器中手动验证验收标准：\n\
  \n   * 作为已登录用户创建短链接\n   * 确认生成了代码\n   * 访问 `/s/<code>` 并确认重定向行为\n   * 尝试不存在的代码并确认\
  \ 404\n   * 确认一个用户无法看到另一个用户的短链接\n\n即使测试通过，此手动验证仍值得进行。\n\n## 可选的优化遍\n\n一个好的最终 Codex\
  \ 提示词是：\n\n```\nReview the implemented URL shortener feature against the specification\
  \ and acceptance criteria.\nIdentify:\n- any missing behavior\n- any unnecessary\
  \ complexity\n- any code that should be simplified for teaching purposes\n- any\
  \ tests that are missing\n```\n\n前面的审查提示词是工作流经常见效的地方。它要求 Codex 根据商定的规格审查代码。\n\n\
  因此我们现在已添加新功能、审查它，并在需要时优化它。URL 短链接只是一个例子。随着功能变得更模糊或触及系统更多部分，相同步骤变得更有用。\n\n对于本章最后一节，让我们思考一些可以扩展\
  \ TallyApp 能力的其他功能。\n\n# 扩展 TallyApp 的想法\n\n此时，TallyApp 项目拥有认证、调查创建、响应收集、分析、测试基础设施，以及使用规格驱动开发构建的额外功能。\n\
  \n\n\n\n然而，仍有许多有趣的方向可用于扩展应用。\n\n练习规格驱动工作流的最佳方法是持续添加小型、定义明确的功能。\n\n以下是几个适合作为练习的想法。\n\
  \n## 练习想法\n\n### 交互式地图位置问题\n\n受访者不再从下拉列表中选择国家，而是可以在地图上选择他们的位置。\n\n想象一个问题，例如：*您从哪里参与？*\n\
  \n界面可以显示一个地球仪或世界地图，用户点击他们的位置。\n\n回答将存储纬度和经度坐标。调查分析随后可以在地理上显示回答，展示不同地区参与情况的聚类。\n\n\
  **提示**：设计一个使用地图界面的地理调查回答规格。\n\n### 拖放排序问题\n\n一些调查要求用户按偏好顺序对项目进行排序。\n\n例如：*按您喜欢使用这些编程语言的程度对它们进行排序。*\n\
  \n拖放界面可以让受访者直观地重新排序项目：\n\n1. Python\n2. JavaScript\n3. Go\n4. Rust\n\n结果将把排序顺序存储在数据库中。\n\
  \n这种问题类型引入了有趣的数据建模挑战。\n\n**提示**：为调查应用中的拖放排序问题设计规格，并解释排序问题涉及的数据建模挑战。\n\n### 调查分支逻辑\n\
  \n更高级的调查会根据之前的回答显示不同的问题。\n\n示例：*您拥有汽车吗？*\n\n- 是 → 显示关于驾驶习惯的问题\n- 否 → 跳至公共交通问题\n\n\
  此功能在调查引擎中引入了条件逻辑，并迫使您仔细思考问题和回答的结构方式。\n\n**提示**：为向调查系统添加分支逻辑设计规格。\n\n### 实时回答仪表板\n\
  \n调查创建者可能希望在参与者作答时实时看到回答更新。\n\n这可以使用 WebSockets、Django Channels 或实时更新图表来实现。\n\n\
  实时观看回答累积会让应用程序感觉更加动态。\n\n**提示**：解释如何使用 WebSockets 创建实时调查回答仪表板。\n\n### 调查主题和样式\n\n\
  另一个视觉改进将允许调查创建者自定义其调查的外观。\n\n可能的功能包括：\n\n- 配色主题\n- 自定义徽标\n- 浅色和深色模式\n\n这将给您一个练习\
  \ CSS 自定义属性、主题类和浅/深色样式的理由。\n\n**提示**：请展示如何为 Django Web 应用程序添加主题支持。\n\n## 练习、参考和资源\n\
  \n### 检查您的理解\n\n回答以下问题：\n\n1. 什么是规格驱动开发？为什么在使用 AI 编码助手时它很有用？\n2. 为什么在使用 AI 工具时，编写规格比手动编码时更重要？\n\
  3. 良好的功能规格的关键部分有哪些？\n4. 为什么非目标是规格的重要组成部分？\n5. 什么使验收标准有效？\n6. 测试如何将规格转化为可执行的契约？\n\
  7. Spec Kit 在这个工作流中的作用是什么？\n8. Spec Kit 工作流的主要阶段有哪些？\n9. 为什么规格驱动开发可能被认为对于小变更是大材小用？\n\
  10. 为什么即使测试通过，您也应该审查 AI 生成的代码？\n11. 您要求 AI 工具在没有规格的情况下“添加一个有用的功能”。结果包含了您不想要的额外功能。为什么会发生这种情况？\n\
  12. 您编写了规格但跳过了非目标部分。实现变得过于复杂。哪里出错了？\n13. 您的验收标准说“UI 应该用户友好”。为什么这是个问题？\n14. 任务列表包含一个大项目：“实现\
  \ URL 短链接”。为什么这是个问题？\n15. 您在未审查规格或计划的情况下运行 `/speckit.implement`。可能的结果是什么？\n16. 您完成实现且测试通过，但跳过了手动测试。还存在什么风险？\n\
  \n答案可在本书的 GitHub 存储库中找到，链接如下：\n\n[`github.com/markjprice/web-dev-ai/blob/main/docs/Appendix-A.pdf`](https://github.com/markjprice/web-dev-ai/blob/main/docs/Appendix-A.pdf)\n\
  \n### 链接\n\n以下是一些有用的链接。\n\n- 规格驱动开发指南：[`github.com/github/spec-kit/blob/main/spec-driven.md`](https://github.com/github/spec-kit/blob/main/spec-driven.md)\n\
  - GitHub 工程博客：与 AI 一起的规格驱动开发：[`github.blog/ai-and-ml/generative-ai/spec-driven-development-with-ai-get-started-with-a-new-open-source-toolkit/`](https://github.blog/ai-and-ml/generative-ai/spec-driven-development-with-ai-get-started-with-a-new-open-source-toolkit/)\n\
  - 使用 Markdown 作为编程接口的规格驱动开发：[`github.blog/ai-and-ml/generative-ai/spec-driven-development-using-markdown-as-a-programming-language-when-building-with-ai/`](https://github.blog/ai-and-ml/generative-ai/spec-driven-development-using-markdown-as-a-programming-language-when-building-with-ai/)\n\
  - Martin Fowler：探索规格驱动开发：[`martinfowler.com/articles/exploring-gen-ai/sdd-3-tools.html`](https://martinfowler.com/articles/exploring-gen-ai/sdd-3-tools.html)\n\
  - Django 重定向快捷方式文档：[`docs.djangoproject.com/en/stable/topics/http/shortcuts/#redirect`](https://docs.djangoproject.com/en/stable/topics/http/shortcuts/#redirect)\n\
  - Django 重定向指南：[`realpython.com/django-redirects/`](https://realpython.com/django-redirects/)\n\
  \n## 总结\n\n在本章中，您使用规格驱动开发为现有的 Django 项目添加了一个新功能。\n\n您看到了书面规格如何给 AI 编码助手提供更清晰的边界，特别是当功能影响模型、视图、路由、模板和测试时。\n\
  \n您学习了如何定义目标、非目标、用户故事、验收标准、数据模型变更和验证步骤。\n\n您还看到了 Spec Kit 等工具如何将该规格转化为一个分阶段的过程：项目原则、功能规格、实现计划、任务列表、实现、审查和改进。\n\
  \n最重要的是，您练习了 AI 无法为您完成的开发部分：决定想要什么行为、什么行为超出范围，以及如何证明系统工作正常。\n\n具体来说，您学习了以下内容：\n\n\
  - 什么是规格驱动开发，以及为什么它对 AI 编码助手有用\n- 如何构建功能规格\n- 如何使用书面规格扩展现有的 Django 项目\n- 如何为 TallyApp\
  \ 添加 URL 短链接功能\n- 如何验证实现是否满足定义的验收标准\n- 小型、定义明确的功能如何使大型系统更容易演进\n\n在下一章中，您将学习如何将 Web\
  \ 项目部署到主机服务器，使其公开可用，以便其他人可以访问它。\n\n## 获取本书的 PDF 版本和更多内容\n\n扫描二维码（或访问 packtpub.com/unlock）。按名称搜索本书，确认版本，然后按照页面上的步骤操作。\n\
  \n![](img/B34553_14_04.png)![](img/B34553_11_12.png)\n\n*注意：请保留发票。直接从 Packt 购买不需要发票。*\n"
- "## 第 15 章：部署到公共服务器\n\n\n\n在前几章中，你将 TallyApp 构建为一个本地 Django 项目。当你设计功能、编写测试、学习各部分如何组合时，这已经足够了。但一个\
  \ Web 应用直到其他人也能使用它，才算真正完成。\n\n在本章中，你将把 TallyApp 部署到服务器上，以便其他人可以通过互联网使用它。这意味着从你自己机器上的开发环境迁移到一种生产风格的设置，该设置持续运行、接受来自互联网的请求、保护用户数据、提供静态文件、存储真实数据库，并且每次都要手动重建服务器。\n\
  \n本章为你提供了一条适用于小型 Django 应用的可行部署路径。你将看到每个主要组件，亲自配置它，并保持设置足够简单以便理解。\n\n我们将使用一个刻意简化的技术栈：一台小型\
  \ `Virtual Private Server (VPS)`、Ubuntu、`Nginx`、`Gunicorn`、`Django` 和 `SQLite`。这不是部署\
  \ Django 的唯一方式，但它是一个很好的学习环境，因为你可以看到系统的每个主要部分。稍后，同一架构可以通过将 SQLite 替换为 PostgreSQL、添加\
  \ Cloudflare、使用托管备份，或使用 `Continuous Integration and Continuous Deployment (CI/CD)`\
  \ 自动化部署来扩展。\n\n在本章结束时，你将已将 TallyApp 部署到公开可访问的服务器，理解请求如何在生产 Django 技术栈中流转，知道如何在部署间保留和备份用户数据，并理解随着流量增长技术栈的哪些部分需要变更。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- Django 网站的部署选项\n- 保护 Django 网站免受常见攻击\n- 部署 TallyApp\n- 结束语\n\
  \n# Django 网站的部署选项\n\n当你在本地工作时，运行网站仅意味着启动 Django 的开发服务器并在自己的机器上打开浏览器。部署用一个持续运行、能接受来自公共互联网的请求、并能在重启和崩溃中存活的系统来替代那种临时设置。\n\
  \n从实际角度来看，部署涉及：\n\n- 一台始终开启且可从互联网访问的服务器\n- 一个监听标准 HTTP 端口的 Web 服务器\n- 一个将 Django\
  \ 作为长期运行进程运行的应用服务器\n- 一个独立于代码持久化数据的数据库\n- 一个用于更新代码和应用迁移的可重复流程\n\n这些都不特定于 TallyApp。这些是各种规模的\
  \ Django 网站使用的相同构建模块。\n\n## TallyApp 的生产架构\n\n在高层次上，TallyApp 将使用一种常见的、刻意平淡的架构在生产环境中运行，如图\
  \ 15.1 所示：\n\n![Figure 15.1: A simple production architecture for TallyApp](img/B34553_15_01.png)\n\
  \n各组件职责明确：\n\n- `Nginx` 接收公共 Web 流量，提供静态文件，并协助处理 `Transport Layer Security (TLS)`，一种保护网络上传输数据的加密协议（TLS\
  \ 通常由 Nginx、Cloudflare 或两者终止）。当你使用 `https://` 访问网站时，TLS 确保三件事：（1）加密：数据对拦截者不可读。（2）认证：服务器证明它确实是它声称的身份。（3）完整性：数据在传输过程中不能被悄悄篡改。\n\
  - `Gunicorn` 作为生产应用服务器运行 Django。\n- `Django` 处理请求并与数据库通信。\n- `SQLite` 将调查数据作为持久文件存储在磁盘上。\n\
  \n保持这些职责分离使后续变更更少痛苦。你可以从 SQLite 迁移到 PostgreSQL，或在 Nginx 前放置 Cloudflare，而无需重写视图和模型。\n\
  \n提示：请解释 Web 服务器、应用服务器和数据库在 Django 部署中的区别，并用一个现实世界的类比说明。\n\n## 为什么生产 Django 站点需要\
  \ Gunicorn 和 Nginx\n\nDjango 内置的开发服务器并非为生产用途设计。相反，Django 应用通常运行在 `Web Server Gateway\
  \ Interface (WSGI)` 服务器之后。WSGI 是一种规范，而非库。Gunicorn 是与 Django 配合使用的常见 WSGI 实现之一。\n\
  \nGunicorn 将你的 Django 项目作为一个长期运行的 Python 进程运行。它不直接监听公共互联网。相反，它监听本地套接字并等待 Nginx 将请求转发给它：\n\
  \n1. 浏览器发送 HTTP 请求。\n2. Nginx 首先接收它。\n3. 该服务器使用 WSGI 接口调用你的 Django 应用。\n4. Django\
  \ 返回一个响应对象。\n5. 服务器将 HTTP 响应发送回浏览器。\n\nWSGI 的存在使得 Django（及其他 Web 框架）不需要知道或关心前面是什么\
  \ Web 服务器。只要服务器支持 WSGI，Django 就可以在其后运行。\n\n关于 WSGI 的关键点：\n\n- 它是同步且基于请求-响应的，意味着每个请求以阻塞方式处理。服务器将请求传递给你的\
  \ Django 应用，该工作进程会被占用直到响应完全生成。如果你的代码等待缓慢操作，如数据库查询或 API 调用，该工作进程就只能干等。在此期间它无法做其他事情。基于请求-响应意味着连接不会保持打开以随时间发送多条消息。\n\
  - 实际上，这意味着 WSGI 非常适合传统网页和 API，但不适合实时更新、聊天系统或实时通知等需要长连接的场景。\n- Django 是一个 WSGI 应用，Gunicorn\
  \ 是一个 WSGI 服务器。\n\nGunicorn 加载你的 Django 项目，并使用 WSGI 协议为每个传入请求调用它。\n\n提示：什么是 WSGI，它在\
  \ Python Web 应用中与 ASGI 相比如何？何时会选择 ASGI（如 Daphne/Uvicorn）而不是 Gunicorn？\n\n### Gunicorn\
  \ 配置\n\n对于 TallyApp，我们将刻意保持 Gunicorn 配置保守。它将只有一个工作进程，并可选少量线程。它将由操作系统的服务管理器管理，以便开机自动启动。\n\
  \n这种配置与 SQLite 配合特别好，因为 SQLite 倾向于有限的写并发。\n\n### 使用 Nginx 作为反向代理\n\n反向代理接收公共请求并在后台将其转发给另一个服务。Nginx\
  \ 位于 Gunicorn 前面，充当面向公众的 Web 服务器。其职责包括：\n\n- 监听 80 和 443 端口\n- 提供 CSS 和图片等静态文件\n\
  - 将动态请求转发给 Gunicorn\n\nNginx 高效处理慢速客户端，使你的 Django 应用无需处理。\n\n这种分工是 Django 应用即使在普通硬件上也能良好运行的原因之一。\n\
  \n提示：请用简单术语解释反向代理，以及为什么 Nginx 用在 Gunicorn 前面，并包含一个请求流程图，展示 Nginx、Gunicorn 和 Django\
  \ 如何交互。\n\n## 在共享主机、VPS 和云平台之间选择\n\n对于本书，`VPS` 是最佳起点。VPS 以低廉的月费给你一台拥有 root 权限的完整\
  \ Linux 机器。你只安装所需的东西，不多不少。\n\n你还应该注意到其他选项的存在：\n\n- 共享主机更便宜但通常不适合 Django 部署\n- 平台即服务\
  \ 为你处理更多事务，但你学到的移动部件更少\n- 大型云提供商提供巨大的灵活性，但也带来了此阶段不必要的复杂性\n\n一台小型 VPS 让你看清各部分如何组合，而不会让你不知所措。\n\
  \n\n\n## VPS 托管成本\n\n月费主要取决于您选择的 CPU、内存、存储和带宽数量，如*图 15.2*所示：\n\n![](img/B34553_15_02.png)\n\
  \n图 15.2：VPS 的典型月费用\n\n您应该能找到每月约 5-10 美元的 VPS 托管提供商，这足以拥有一个合适的 Web 服务器来托管您的 Django\
  \ 项目。但要获得更低的成本，您通常需要承诺托管一年或更长时间，因此预计一年的托管费用为 60-120 美元。许多读者可能更倾向于仅在本地托管，而从不实际部署到公共服务器。\n\
  \n**提示**：VPS、PaaS 和无服务器架构对于 Django 应用有哪些权衡？\n\n## SQLite 作为数据库\n\n人们常说 SQLite 不适合生产环境，但这说法过于宽泛。SQLite\
  \ 是一种基于文件的数据库，以简单和可靠著称，但在并发写入方面存在限制。\n\n对于 TallyApp，如果满足以下条件，SQLite 是一个合理的选择：\n\n\
  * 流量适中\n* 数据库写入是短暂的\n* 应用程序以少量工作进程运行\n* 启用了预写日志（`WAL`）\n\n数据库本身只是磁盘上的一个文件。Django\
  \ 使用 SQLite 库读写它。无需安装或管理数据库服务器。\n\n**提示**：请解释 SQLite 中的预写日志（`WAL`）及其对并发的重要性。在生产\
  \ Django 应用中，SQLite 在什么情况下会成为瓶颈？\n\n### 数据库持久化与迁移\n\n最重要的部署规则之一是：*永远不要将数据库视为一次性的*。\n\
  \n您的应用程序代码可以随时替换。您的数据库必须能经受住部署。\n\n为实现这一点：\n\n* 将 SQLite 数据库文件存储在应用程序代码目录之外\n* 将代码更新与数据更新分离\n\
  * 使用 Django 迁移来演进数据库模式\n\n当您部署 TallyApp 的新版本时，您会对现有数据库运行迁移。数据保持完好，而模式逐步变更。这反映了迁移在\
  \ PostgreSQL 等大型数据库中的工作方式。尽管数据库引擎不同，但命令相似。\n\n### 备份您的数据\n\n即使对于学习项目，备份也很重要。用户会假设他们的调查回答会持久保存。\n\
  \nSQLite 提供了内置机制，用于创建实时数据库的一致性备份。典型方法如下：\n\n* 使用 SQLite 的备份工具创建快照\n* 将快照存储在带日期的备份目录中\n\
  * 可选择将其复制到服务器外部\n\n这可以通过每日计划任务自动化。关键在于一致性。始终使用 SQLite 自身的工具创建备份，而不是盲目复制数据库文件，特别是当应用程序可能在备份期间运行时。\n\
  \n### 安全更新站点\n\nTallyApp 的典型更新周期如下：\n\n1. 上传或拉取最新代码\n2. 安装或更新依赖\n3. 应用迁移\n4. 收集静态文件\n\
  5. 重启应用服务\n\n因为数据位于代码目录之外，更新变得常规且低风险。这是从本地开发的重要思维转变，在本地开发中，删除和重新创建数据库很常见。\n\n###\
  \ 何时迁移到 PostgreSQL\n\n当流量增长或写入变得频繁且不可预测时，SQLite 将开始显现其局限性。这不是失败。这只是应用程序超越了基于文件的数据库的时刻。\n\
  \n下一步通常是在同一 VPS 上运行 PostgreSQL。架构几乎保持不变。Nginx 和 Gunicorn 保持不变。Django 保持不变。只有数据库后端发生变化。\n\
  \n这是 Django 的优势之一。如果您遵循了最佳实践，数据库后端可以通过最小的应用程序更改进行替换。\n\n**提示**：请指导我如何安全地将 Django\
  \ 项目从 SQLite 迁移到 PostgreSQL。\n\n### 使用托管数据库进一步扩展\n\n超越单个 VPS，数据库通常会迁移到托管服务。届时：\n\
  \n* 应用服务器可以水平扩展\n* 数据库获得自动备份和复制\n* 运维复杂性从您转移给提供商\n\nTallyApp 不需要这种级别的基础设施，但了解这条路径很重要。您的\
  \ Django 项目可以随着您的需求增长。\n\n## 部署选项总结\n\n将 TallyApp 部署到互联网不需要奇特的工具或复杂的云服务。一个小型 VPS、一个传统的\
  \ Web 技术栈和对数据持久化的严谨方法就足够了。\n\n更重要的是，本章建立的模式将在该项目之外为您提供良好的服务。无论您部署的是学习应用、初创原型，还是拥有真实用户和真实期望的生产服务，相同的原则都适用。\n\
  \n有了清晰的部署方法，下一步是确保您的应用在暴露于不可预测的公共互联网环境后，依然保持安全和弹性。\n\n# 保护 Django 网站免受常见攻击\n\n一旦您的站点在公共互联网上线，它将开始接收来自您未邀请的来源的流量。其中一些是合法用户。许多是扫描弱点的自动化机器人。这是正常的。\n\
  \n对于像 TallyApp 这样的初学者 Django 项目，目标不是消除所有风险。那不现实。目标是避免明显的错误，减少常见攻击的影响，并使站点具有足够的弹性，即使在骚扰流量下也能保持运行。\n\
  \nDjango 已经包含许多内置保护，但只有在您正确使用它们并谨慎部署应用程序时，它们才有帮助。\n\n您可能会做出以下假设：\n\n* **人们会试图让您的网站瘫痪**：部分属实，但并非针对性攻击。大多数流量将是自动化机器人。上述架构能很好地应对。\n\
  * **单台服务器可能很脆弱**：正确。单个 Droplet 是单点故障。但对于演示站点，如果您有备份并能快速重新部署，这是可以接受的。\n* **您从第一天就需要强大的保护**：不完全是。您需要基本的\
  \ Django 设置和服务器防护，而不是繁重的基础设施。Django 最佳实践 + Cloudflare + 基础服务器加固的组合涵盖了大多数真实风险。\n\n\
  ## 了解最常见的攻击\n\n针对小型 Web 应用的大多数攻击并不复杂。它们是自动化和重复性的，寻找容易得手的目标。\n\n与 Django 应用最相关的攻击类别如*表\
  \ 15.1*所示：\n\n| 名称 | 描述 |\n|------|-------------|\n| **跨站脚本攻击 (XSS)** | 攻击者试图将恶意\
  \ JavaScript 注入其他用户查看的页面。Django 模板默认转义输出，可阻止大多数简单情况。问题通常出在开发人员故意绕过转义时。 |\n| **跨站请求伪造\
  \ (CSRF)** | 用户被诱导提交非预期的请求，例如更改账户详情。Django 包含 CSRF 保护中间件，但必须启用并在表单中正确使用。 |\n| **SQL\
  \ 注入** | 恶意输入试图篡改数据库查询。Django 的对象关系映射器（`ORM`）通过使用参数化查询来防范此风险，但不安全的原始 SQL 可能会重新引入风险。\
  \ |\n| **认证滥用** | 机器人尝试猜测密码或重用泄露的凭据。登录页面是常见目标。 |\n\n\n\n\n# Common Website Attack\
  \ Types\n\n| Attack Type | Description |\n|-------------|-------------|\n| **Security\
  \ Misconfiguration** | This is one of the most common issues. Keeping `DEBUG = True`,\
  \ exposing secret keys, or failing to restrict allowed hosts can leak sensitive\
  \ information or open the door for attacks. |\n| **File Upload Abuse** | If your\
  \ app allows uploads, attackers may try to upload malicious files or oversized files\
  \ to exhaust resources. |\n| **Denial of Service (DoS)** | Instead of breaking in,\
  \ attackers flood the site with traffic or expensive requests. For small apps, this\
  \ is usually application-layer abuse, not a massive network flood. |\n\n**Table\
  \ 15.1: Common Website Attack Types**\n\n---\n\n# OWASP Top 10\n\nThe **Open Web\
  \ Application Security Project (OWASP) Top 10** is a widely recognized list of the\
  \ most common and impactful security risks affecting web applications. Maintained\
  \ by a global community of security professionals, it highlights patterns seen in\
  \ real-world breaches. It is not an exhaustive list, but a practical guide to the\
  \ vulnerability types developers are most likely to encounter, helping teams prioritize\
  \ what matters most when building and deploying secure apps.\n\nThe OWASP Top 10\
  \ consistently highlights broken access control, injection, and misconfiguration\
  \ as leading causes of web app vulnerabilities: [`owasp.org/Top10/2025/`](https://owasp.org/Top10/2025/)\n\
  \n> **Tip**: Please provide examples of XSS, CSRF, and SQL Injection in a Django\
  \ application.\n\n---\n\n# Practical Security Baseline for Beginners\n\nYou don't\
  \ need expensive tools to secure a small Django app. A simple, well-configured setup\
  \ goes a long way.\n\nStart with Django's deployment checklist:\n\n1.  Set `DEBUG\
  \ = False`\n2.  Define `ALLOWED_HOSTS`\n3.  Keep `SECRET_KEY` private\n4.  Run `python\
  \ manage.py check --deploy`\n\nDjango explicitly warns that running with `DEBUG\
  \ = True` in production exposes stack traces, settings, and sensitive internal details.\n\
  \n> **Tip**: What does Django's `check --deploy` command actually verify under the\
  \ hood?\n\n---\n\n# Enforce HTTPS and Secure Cookies\n\nDjango recommends enforcing\
  \ HTTPS across your entire site, not just the login page, because session cookies\
  \ are shared across requests. Always serve your site over HTTPS. This protects login\
  \ sessions and user data.\n\nThe following settings should be enabled in your Django\
  \ settings:\n\n```python\nif not DEBUG:  # Enable only in production\n    SECURE_SSL_REDIRECT\
  \ = True\n    SESSION_COOKIE_SECURE = True\n    CSRF_COOKIE_SECURE = True\n    SECURE_HSTS_SECONDS\
  \ = 31536000  # 1 year\n    SECURE_HSTS_INCLUDE_SUBDOMAINS = True\n    X_FRAME_OPTIONS\
  \ = \"DENY\"\n    SECURE_CONTENT_TYPE_NOSNIFF = True\n```\n\nNotes on the above\
  \ settings:\n\n* `SECURE_SSL_REDIRECT = True`: Forces all HTTP requests to redirect\
  \ to HTTPS. If a user visits `http://your-site.com`, Django automatically redirects\
  \ them to `https://your-site.com`. This ensures all communication is encrypted.\
  \ Without this, users might access your site over plain HTTP, allowing attackers\
  \ to intercept or modify traffic (Man-in-the-Middle attacks).\n* `SESSION_COOKIE_SECURE\
  \ = True`: Ensures the session cookie is only sent over HTTPS. Browsers will not\
  \ include the session cookie in HTTP requests. Session cookies identify logged-in\
  \ users. If sent over HTTP, they can be intercepted and used to hijack the session.\n\
  * `CSRF_COOKIE_SECURE = True`: Ensures the CSRF cookie is only sent over HTTPS.\
  \ Similar to the session cookie, but specifically for the CSRF token. CSRF protection\
  \ relies on a secret token. If that token is exposed over HTTP, an attacker could\
  \ bypass CSRF protection.\n* `SECURE_HSTS_SECONDS = 31536000` (1 year, in seconds):\
  \ Enables **HTTP Strict Transport Security (HSTS)** and tells browsers to always\
  \ use HTTPS for your site for the next year. After visiting your site once over\
  \ HTTPS, the browser will refuse to connect via HTTP for the specified duration.\
  \ It prevents downgrade attacks where an attacker tries to force a user back to\
  \ HTTP.\n  \n  > **Warning!** Only enable this once you are certain HTTPS works\
  \ correctly everywhere.\n\n* `SECURE_HSTS_INCLUDE_SUBDOMAINS = True`: Extends HSTS\
  \ to all subdomains. E.g., `api.your-site.com`, `admin.your-site.com`, etc. Attackers\
  \ often target weaker subdomains. This ensures the entire domain is HTTPS-only.\n\
  * `X_FRAME_OPTIONS = \"DENY\"`: Prevents your site from being embedded in an `<iframe>`.\
  \ Browsers will block any attempt to load your pages in a frame on another site.\
  \ Prevents clickjacking attacks, where a malicious site tricks users into clicking\
  \ hidden elements on your site.\n* `SECURE_CONTENT_TYPE_NOSNIFF = True`: This tells\
  \ browsers not to guess (or \"sniff\") the content type of a response. Browsers\
  \ must respect the `Content-Type` header sent by the server. Prevents certain attacks\
  \ where a file is disguised as one type (e.g., text) but executed as another (e.g.,\
  \ JavaScript).\n\nAs a group, these settings enforce HTTPS everywhere, protect sensitive\
  \ cookies, prevent common browser-based attacks (clickjacking, MIME sniffing), and\
  \ reduce the risk of traffic interception and tampering.\n\nThey are part of Django's\
  \ **secure-by-default for production** approach, but they only work correctly if\
  \ your app is properly deployed behind HTTPS (e.g., using Nginx or a cloud platform\
  \ that terminates TLS).\n\n> **Warning!** Do not blindly enable these in development,\
  \ because local environments usually don't have HTTPS configured, and the redirects\
  \ and secure cookies will break your development workflow.\n\n---\n\n# Protect Against\
  \ XSS and CSRF\n\nDjango helps here, but only if you follow its conventions:\n\n\
  * Use Django templates instead of manually building HTML strings\n* Avoid marking\
  \ user input as safe unless absolutely necessary\n* Ensure all forms include the\
  \ CSRF token, like this:\n\n```html\n<form method=\"post\">\n    {% csrf_token %}\n\
  \    <!-- form fields -->\n</form>\n```\n\nFor extra protection, consider enabling\
  \ **Content Security Policy (CSP)**, which restricts where scripts can be loaded\
  \ from. Django 6 includes built-in support for CSP configuration, such as `SECURE_CSP`\
  \ settings, but earlier versions like the current LTS 5.2 do not.\n\nCSP is a browser-enforced\
  \ security mechanism that controls which resources a page is allowed to load and\
  \ execute. It is defined by the server (usually via an HTTP response header) and\
  \ tells the browser things like: which domains JavaScript can be loaded from, whether\
  \ inline scripts are allowed, where images, stylesheets, fonts, and other assets\
  \ can come from.\n\nThe goal is to reduce the impact of attacks like **Cross-Site\
  \ Scripting (XSS)**. Even if an attacker manages to inject malicious code into your\
  \ page, a well-configured CSP can prevent that code from running because it doesn't\
  \ come from an approved source.\n\nA simple example might look like this:\n\n```\n\
  Content-Security-Policy: default-src 'self'; script-src 'self' https://trusted.cdn.com;\n\
  ```\n\nThe header above tells the browser: by default, only load resources from\
  \ your own site, and only allow scripts from your site and a trusted **Content Delivery\
  \ Network (CDN)**.\n\nCSP works best as a defense-in-depth layer. It doesn't replace\
  \ secure coding practices, but it makes exploitation much harder when things go\
  \ wrong.\n\n\n\n\n您可以通过以下链接了解更多关于 CSP 的信息：[`https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CSP`](https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CSP)\n\
  \n## 避免 SQL 注入\n\n最安全的方法很简单：使用 Django 的 ORM：\n\n```\n# Safe\nUser.objects.filter(username=username)\n\
  ```\n\n避免使用字符串拼接手动构建 SQL 查询。如果必须使用原始 SQL，请使用参数化查询。\n\nDjango 的文档强调，其 ORM 默认可防止 SQL\
  \ 注入，但前提是正确使用。\n\n## 保护认证\n\n登录端点是机器人攻击的首选目标。\n\n基本防护措施包括：\n\n* 强制使用强密码\n* 对登录尝试添加速率限制\n\
  * 考虑在重复失败后添加人机验证挑战\n* 避免在没有额外保护的情况下将 Django 管理后台暴露在可预测的 URL 上\n\n简单的速率限制方法可以大幅减少暴力破解尝试。\n\
  \n## 安全处理文件上传\n\n如果您的应用允许文件上传：\n\n* 限制文件大小\n* 验证文件类型\n* 切勿执行上传的文件\n* 将上传文件存储在主应用域名之外\n\
  \nDjango 建议从单独的域名或存储系统提供上传文件服务，以降低风险。\n\n## 防御拒绝服务攻击\n\n对于小型项目，大多数 DoS 尝试实际上是滥用使用模式。\n\
  \n常见示例：\n\n* 重复登录尝试\n* 大文件上传\n* 昂贵的数据库查询\n* 激进爬取\n\n低成本防御措施包括：\n\n* 对关键端点进行速率限制\n\
  * 限制上传大小\n* 在适当情况下使用缓存\n* 将静态文件移至 CDN\n\n使用 Cloudflare 等服务可以提供免费或低成本的保护，包括基本的**分布式拒绝服务**（**DDoS**）缓解和请求过滤。\n\
  \n**提示**：请展示如何在 Django 中使用中间件或第三方包实现速率限制。请解释 Cloudflare 如何保护小型网站免受机器人和攻击。\n\n##\
  \ 保护密钥和配置\n\n切勿将密钥存储在源代码仓库中。\n\n请改用环境变量：\n\n```\nimport os\nSECRET_KEY = os.environ[\"\
  DJANGO_SECRET_KEY\"]\n```\n\nDjango 的部署指南强调敏感设置必须保持机密。\n\n## 日志记录、监控和备份\n\n安全不仅仅是预防。您还必须检测和恢复。\n\
  \n至少应做到：\n\n* 启用错误和可疑活动的日志记录\n* 监控登录失败尝试\n* 保持定期数据库备份\n* 测试从备份恢复\n\n例如，将以下代码添加到您的\
  \ `settings.py` 中：\n\n```\nimport os\nLOG_DIR = os.path.join(BASE_DIR, \"logs\"\
  )\nos.makedirs(LOG_DIR, exist_ok=True)\nLOGGING = {\n    \"version\": 1,\n    \"\
  disable_existing_loggers\": False,\n    \"formatters\": {\n        \"verbose\":\
  \ {\n            \"format\": \"{asctime} {levelname} {name} {message}\",\n     \
  \       \"style\": \"{\",\n        },\n    },\n    \"handlers\": {\n        \"file\"\
  : {\n            \"level\": \"WARNING\",\n            \"class\": \"logging.FileHandler\"\
  ,\n            \"filename\": os.path.join(LOG_DIR, \"django.log\"),\n          \
  \  \"formatter\": \"verbose\",\n        },\n    },\n    \"loggers\": {\n       \
  \ \"django\": {\n            \"handlers\": [\"file\"],\n            \"level\": \"\
  WARNING\",\n            \"propagate\": True,\n        },\n    },\n}\n```\n\n上述代码：\n\
  \n* 记录警告、错误和异常\n* 写入 `logs/django.log`\n* 捕获可疑活动，如错误请求或错误\n\n要检查服务器日志，请使用以下 Bash/Shell\
  \ 命令：\n\n```\nsudo journalctl -u gunicorn -f\nsudo tail -f /var/log/nginx/error.log\n\
  ```\n\n要记录登录失败，请将以下代码添加到您的登录视图中：\n\n```\nimport logging\nlogger = logging.getLogger(__name__)\n\
  def login_view(request):\n    if request.method == \"POST\":\n        username =\
  \ request.POST.get(\"username\")\n        password = request.POST.get(\"password\"\
  )\n        user = authenticate(request, username=username, password=password)\n\
  \        if user is None:\n            logger.warning(f\"Failed login attempt for\
  \ username: {username}\")\n        else:\n            login(request, user)\n```\n\
  \nOWASP 强调，日志记录和监控的失败可能导致攻击长时间不被察觉。\n\n## 使用现成的包来跟踪登录\n\n要跟踪登录失败尝试、暂时阻止暴力破解攻击并将尝试存储在数据库中，您可以安装一个名为\
  \ Axes 的 Django 中间件包：\n\n```\npip install django-axes\n```\n\n然后在 `settings.py`\
  \ 中启用该包：\n\n```\nINSTALLED_APPS += [\"axes\"]\nMIDDLEWARE += [\"axes.middleware.AxesMiddleware\"\
  ]\nAUTHENTICATION_BACKENDS = [\n    \"axes.backends.AxesBackend\",\n    \"django.contrib.auth.backends.ModelBackend\"\
  ,\n]\nAXES_FAILURE_LIMIT = 5\nAXES_COOLOFF_TIME = 1  # hours\n```\n\n此包记录到永久表中，因此您必须随后运行数据库迁移：\n\
  \n```\npython manage.py migrate\n```\n\n合理预期像 `TallyApp` 这样的公共演示站点会收到不需要的流量。不过，这些流量主要来自自动化机器人，而非有针对性的人工攻击者。\n\
  \n## 总结清单\n\n对于适合初学者的部署，应争取达到以下目标：\n\n* 禁用调试模式\n* 全站强制 HTTPS\n* 使用安全 Cookie\n* 配置\
  \ `ALLOWED_HOSTS`\n* 将密钥排除在源代码控制之外\n* 使用 Django 的 ORM 和内置防护\n* 为登录和公共端点添加速率限制\n\
  * 限制并验证文件上传\n* 在您的站点前放置 CDN 或代理\n* 启用日志记录并维护备份\n\n上述每一点均在本章或 *第 9 章* *Django – 后端\
  \ Web 开发* 中详细介绍。\n\n这并不意味着您的应用无懈可击。但它使其足够健壮以用于生产环境，这正是像 `TallyApp` 这样的公开示例所需要的。\n\
  \n有了这些安全基础，我们现在可以继续将 `TallyApp` 部署到公共服务器，在真实的工作环境中应用这些实践。\n\n# 部署 TallyApp\n\n第一步是选择一个主机服务提供商。这是将持续运行您的应用程序并使其可通过互联网供用户访问的机器。与您的本地开发环境不同，这台服务器必须可靠、随时可达，并能处理来自未知用户和自动化系统的请求。\n\
  \n有几类托管可供选择，每种都有不同的权衡。共享托管便宜，但对大多数 Django 应用程序来说限制太多。平台即服务选项消除了大部分运维负担，但也隐藏了部署实际如何工作。在另一端，大型云提供商提供了巨大的灵活性，但对于小型项目可能引入不必要的复杂性。对于像\
  \ `TallyApp` 这样的项目，VPS 达到了恰当的平衡。它以低成本让您完全控制一台 Linux 机器，同时仍然足够简单，能让您理解所有组件如何组合在一起。\n\
  \n选择 VPS 也与本章前面介绍的架构非常契合。您将亲自安装和配置每个组件：Web 服务器、应用服务器和数据库。这听起来可能像是额外的工作，但这正是大量学习发生的地方。您不再依赖黑盒平台，而是能准确看到请求如何流经您的系统，以及您的应用程序在真实环境中的表现。\n\
  \n\n\n\n在下一节中，我们将使用 `DigitalOcean` 作为我们的托管服务商。它提供了一种简单直接的方式来创建和管理虚拟服务器，拥有可预测的定价和完善的文档。更重要的是，它让我们能够专注于理解部署过程，而不是纠结于基础设施的复杂性。\n\
  \n## 为什么 `DigitalOcean` 适合 `TallyApp`\n\n我选择使用 `DigitalOcean` 作为主机提供商，因为它处于一个有用的中间地带：既不像过度抽象的平台那样隐藏一切，也不像超大规模云那样用海量选项和定价复杂性淹没初学者。\n\
  \n对于像 `TallyApp` 这样的项目，它可以说很利于学习，因为它迫使你理解部署期间发生了什么，又不会让你淹没在企业级运维的担忧中。\n\n最大的优势是简单性。你可以在几分钟内从零开始拥有一台公网服务器，使用的是\
  \ `Droplet`，它本质上就是一台虚拟机。这与 `Django` 传统上使用 `Gunicorn` 和 `Nginx` 等工具进行部署的方式完美契合。\n\
  \n文档完善且对新手友好。`DigitalOcean` 花费多年时间专门为常见技术栈（如 `Django`）构建教程，包括针对 `Ubuntu`、`Gunicorn`\
  \ 和 `Nginx` 的分步指南。你可以通过以下链接阅读 `DigitalOcean` 文档教程：[`www.digitalocean.com/community/tutorials`](https://www.digitalocean.com/community/tutorials)。\n\
  \n`DigitalOcean` VPS 还赋予你完全的控制权。你将学习 Web 服务器、反向代理和应用服务器是如何组合在一起的，而不是依赖一个黑盒平台。\n\n\
  ### 你应该了解的缺点\n\n简单性的代价是你需要自己负责更多事情。\n\n你在管理一台服务器。这意味着：\n\n*   应用安全更新\n*   配置防火墙\n\
  *   管理进程和服务\n*   手动处理扩缩容\n\n没有自动扩缩容。如果你的网站突然变得流行或遭受攻击，单个 `Droplet` 可能会不堪重负。\n\n\
  你仍需自负应用安全责任，因为它不是全托管的。与 `Heroku` 或 `Vercel` 等平台不同，`DigitalOcean` 不会自动处理许多应用层面的防护。你需要自行配置。\n\
  \n备份和监控是可选的附加组件。除非你启用它们，否则它们不会默认完全集成。\n\n### 它适合像 `TallyApp` 这样的公开演示吗？\n\n适合，但有一个条件：你必须在它前面加一层薄薄的保护。单个低成本\
  \ `Droplet` 完全有能力运行流量轻度到中等的 `Django` 应用。对于图书配套网站来说，这通常绰绰有余。\n\n然而，直接将裸露的服务器暴露在互联网上并不理想。如果没有额外保护，它将迅速收到：\n\
  \n*   扫描漏洞的机器人流量\n*   登录暴力破解尝试\n*   爬虫和抓取工具\n*   偶发的流量高峰\n\n这就是将 `DigitalOcean`\
  \ 与代理层结合变得重要的原因。\n\n### `DigitalOcean` 提供的防护\n\n`DigitalOcean` 为你提供基础设施级别的安全，但不提供完整的应用防护。\n\
  \n包含的防护：\n\n*   通过虚拟专用网络实现的基本网络隔离\n*   云防火墙，按端口和 IP 限制入站流量\n*   安全外壳（`SSH`）密钥认证而非密码\n\
  *   数据中心级别的物理安全\n*   基础设施级别的 `DDoS` 防护（有限且不可深度配置）\n\n这些是有用的服务器级防护，但它们无法防范：\n\n*\
  \   应用层攻击（例如登录滥用）\n*   `XSS` 或 `CSRF` 问题\n*   `Django` 配置错误\n*   针对你端点的机器人流量\n\n\
  一些有用的功能可用，但需要启用或额外付费，如 `表 15.2` 所示：\n\n| **功能** | **描述** |\n| --- | --- |\n| 备份\
  \ | 自动备份通常费用约为 `Droplet` 价格的 20%。 |\n| 监控和警报 | 提供基础监控，但你需要自行配置警报。 |\n| 负载均衡器 | 起价约为每月\
  \ 12 美元。如果你扩展到单服务器之外，这很有用。 |\n| 托管数据库 | 比自托管 `PostgreSQL` 更贵，但能降低运维风险。 |\n\n`表 15.2`：可启用的\
  \ `DigitalOcean` 功能\n\n## 缺失的一环：边缘防护\n\n`DigitalOcean` 给你提供了服务器，但它不会在每个坏请求到达你的应用之前将其过滤掉。这就是在你的\
  \ `Droplet` 前面添加 `Cloudflare`（或类似服务）能增强防护的原因。\n\n即使使用免费的 `Cloudflare` 计划，你也能获得：\n\
  \n*   面向 `CSS` 样式表和图片等静态内容的 `CDN` 缓存\n*   基础 `DDoS` 防护\n*   机器人过滤\n*   `TLS` 终止（在边缘处理\
  \ `HTTPS`）\n\n以低成本，你可以添加：\n\n*   速率限制（用于登录和表单）\n*   Web 应用防火墙（`WAF`）规则\n\n当与像 `Cloudflare`\
  \ 这样简单的边缘服务以及良好的 `Django` 配置相结合时，`DigitalOcean` 加 `Cloudflare` 加正确的 `Django` 设置，足以应对小型公开\
  \ `TallyApp` 部署。\n\n## 分步部署\n\n你将从理解部署中获益良多，而非仅仅走通往可用服务器的最短路径。\n\n我们将标准化以下目标技术栈：用于应用服务器的小型\
  \ `Droplet`、`Ubuntu` `LTS`、为追求简单而用的 `SQLite` 数据库、作为反向代理的 `Nginx`、用于 `Django` 的 `Gunicorn`、`Uncomplicated\
  \ Firewall (UFW)` 以及可选的备份。这适用于流量适中的公开演示应用。\n\n### 创建 `DigitalOcean` `Droplet`\n\n\
  现在我们可以创建一个 `Droplet` 来托管我们的网站项目：\n\n1.  在以下链接注册 `DigitalOcean` 账号：[`cloud.digitalocean.com/`](https://cloud.digitalocean.com/)\n\
  2.  在你账号的 `Projects` 页面，你将已有一个默认项目，通常命名为 `first-project`。我们可以保持原样。\n3.  点击 `Create`，然后点击\
  \ `Droplets`，如 `图 15.3` 所示：\n\n![](img/B34553_15_03.png)\n\n`图 15.3`：创建 `Droplet`\n\
  \n4.  选择一个区域，要么靠近你大多数预期访客，要么靠近你。我选择了 `New York`。\n5.  为你的操作系统选择一个镜像。我选择了 `Ubuntu\
  \ 24.04 (LTS) x64`。\n6.  选择 `Droplet` 规格。我选择了：\n    *   Basic（共享 CPU）\n    *   Regular\
  \ SSD\n    *   每月 12 美元\n    *   2 GB / 1 CPU\n    *   50 GB SSD 磁盘\n    *   2 TB\
  \ 流量\n7.  可选，启用自动备份计划。我选择了 `Daily Backups`，费用为每月 3.60 美元。备份保留一周。对于时间窗口，我选择了美国东部时间午夜到凌晨\
  \ 4 点。\n8.  选择一种认证方式。我选择了 `SSH`。点击 `Add SSH Key` 并按说明操作。你必须为 `SSH` 密钥命名（我用了 `tallyapp-sshkey`），它将创建两个文件。没有\
  \ `.pub` 后缀的文件是你的私钥。**务必妥善保管**。`.pub` 文件是你复制到 `DigitalOcean` 的公钥。\n\n你可以通过以下链接了解更多关于如何使用\
  \ `SSH` 连接到 `Droplets` 的信息：[`docs.digitalocean.com/products/droplets/how-to/connect-with-ssh/`](https://docs.digitalocean.com/products/droplets/how-to/connect-with-ssh/)\n\
  \n9.  点击 `Create Droplet`。\n10.  记下分配给你服务器的 `IP` 地址，如 `图 15.4` 所示：\n\n![](img/B34553_15_04.png)\n\
  \n`图 15.4`：你服务器的 `IP` 地址\n\n11.  在命令提示符或终端中，输入命令使用你之前创建的私有 `SSH` 密钥文件、默认的 `root`\
  \ 用户账户和远程服务器的 `IP` 地址连接到你的远程服务器：\n\n```\nssh -i tallyapp-sshkey root@167.99.52.197\n\
  ```\n\n\n\n\n大多数操作系统（如 Ubuntu 和 CentOS）在初始创建时的默认用户名是 `root`。如果您添加了另一个用户，可以改用该用户名。\n\
  \n1. 输入 SSH 密钥的密码短语。\n\n2. 您现在将连接到远程服务器主机，如下面略微编辑的输出所示：\n\n```\nWelcome to Ubuntu\
  \ 24.04.3 LTS (GNU/Linux 6.8.0-71-generic x86_64)\nSystem information as of Tue\
  \ Mar 24 16:46:12 UTC 2026\n  System load:           0.01\n  Usage of /:       \
  \     4.0% of 47.39GB\n  Memory usage:          10%\n  Swap usage:            0%\n\
  \  Processes:             99\n  Users logged in:       0\n  IPv4 address for eth0:\
  \ 167.99.52.197\n  IPv4 address for eth0: 10.17.0.5\n  IPv6 address for eth0: 2604:a880:800:14:0:2:b6e3:6000\n\
  ...\n```\n\n## 初始远程服务器设置\n\n您即将输入命令以更新操作系统包、将自己添加为 Linux 用户、启用防火墙等：\n\n1. 更新包并耐心等待几分钟以完成此过程：\n\
  \n```\napt update && apt upgrade -y\n```\n\n2. 添加名为 tallyapp 的用户：\n\n```\nadduser\
  \ tallyapp\n```\n\n3. 授予自己管理员权限：\n\n```\nusermod -aG sudo tallyapp\n```\n\n4. 切换到您的账户：\n\
  \n```\nsu - tallyapp\n```\n\n5. 允许 SSH 通过防火墙：\n\n```\nsudo ufw allow OpenSSH\n```\n\
  \n6. 启用防火墙：\n\n```\nsudo ufw enable\n```\n\n7. 安装系统依赖（Python `pip`、虚拟环境支持、Sqlite、Nginx\
  \ 和 Git）：\n\n```\nsudo apt install -y python3-pip python3-venv nginx git sqlite3\n\
