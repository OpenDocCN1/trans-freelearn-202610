  alternative: 正文大标题（部分分隔符）
  counter_evidence:
  - 该行使用一级标题（#），而后续明确章节均使用二级标题（##），在Markdown层级语义中一级标题通常对应书名或部分，若本书不采用‘部分-章节’双层分章模式，此处仅为结构性分隔而非实质章节分界
  - 前文紧邻‘## 获取本书的 PDF 版本及更多内容’等章末推广内容，后文‘在本书的第三部分中…’更像是部分导语而非章节正文开篇，缺乏典型章节的概述段落与子节（如‘11.1’）紧随特征
  keep_split: true
