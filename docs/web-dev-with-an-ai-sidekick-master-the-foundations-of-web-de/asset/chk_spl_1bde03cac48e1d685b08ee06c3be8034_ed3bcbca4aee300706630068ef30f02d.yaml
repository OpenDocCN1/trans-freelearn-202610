reviews:
- 'no': 2
  overturn_probability: 0.7
  alternative: 前置内容（前言/序言）的组成部分，非独立章节分隔点
  counter_evidence:
  - 规则明确要求‘前言、序言、致谢、关于作者等正文之前的内容，统一划分为一章’，该行虽为首个前置标题，但后续第 18、20、30、40 行均为同级一级标题（贡献者、关于作者、关于审阅者、前言），若以此行为分章起点，必须保证后续前置内容不再触发分章，原判断未说明分组策略，存在将前置内容过度切分为多章的风险。
  - 该行内容实为 Stephen Wood 撰写的‘序言’（第 14-16 行署名），而非作者正文‘前言’（第 40 行），语义上属于前置材料整体的一部分，不应单独作为章节边界。
  keep_split: false
- 'no': 219
  overturn_probability: 0.85
  alternative: 正文引言的标题（属于前置内容延伸或第 0 部分），非编号章节
  counter_evidence:
  - 本书采用‘部分-章节’模式（第 87、99、105、1123 行均为‘第 X 部分’一级标题），规则要求‘遇到部分和章标题时，都要划分新章’，隐含一级标题为‘部分’，二级标题为‘章’。该行虽为一级标题，但标题为‘简介’且无‘第
    1 章’编号，与后续‘第 1 部分’（第 1123 行）同级，破坏了层级一致性，更可能是‘部分’前的引言整体，不应作为独立大章分割。
  - 前文第 44 行已出现同名一级标题‘与 AI 副驾驶一起进行 Web 开发’（在前置内容中），第 219 行疑为正文起始处的重复标题或排版残留，非新章语义起点。
  keep_split: false
- 'no': 1123
  overturn_probability: 0.6
  alternative: 部分导航页/目录摘要，非实质内容章节开端
  counter_evidence:
  - 该行后紧跟概述段落（第 1125 行）和章节列表（第 1131-1135 行），而非直接进入章节正文，符合‘部分分隔页’特征而非‘章节开端’特征（规则要求‘标题的后
    1~3 行通常是概述段落，且后面跟着子节’，此处子节为列表项而非标题）。
  - 前置内容第 87 行已出现完全相同的‘第 1 部分’标题并包含相同章节列表，第 1123 行疑为正文区的重复导航页，属于排版噪声，不应重复分章。
  keep_split: false
- 'no': 1137
  overturn_probability: 0.55
  alternative: 章节列表项的正文映射，但编号不连贯性存疑
  counter_evidence:
  - 该行标题‘第 2 章’隐含存在‘第 1 章’，但全书前序仅有‘简介’（第 219 行）且无章编号，导致显式编号序列跳跃（缺第 1 章）。规则虽允许‘序号明显跳跃……只需要划分新的章节’，但前提是候选行确为章标题；结合第
    1131 行列表项‘* 第 2 章 —— **HTML**’文本高度相似，该行可能仅为列表项在正文的锚点渲染，而非独立语义单元。
  - 上一行（第 1136 行）为空行，前一行为列表结束，缺乏规则要求的‘概述段落’作为章节引领，直接进入‘本章介绍’（第 1139 行），起始特征弱于典型章节。
  keep_split: true
- 'no': 2408
  overturn_probability: 0.95
  alternative: 正文小标题/节标题（缺失章编号），非最高层级大章
  counter_evidence:
  - 规则核心要求‘只划分全书最高层级的大章（如“第 X 章”）’，前一章（第 1137 行）明确使用‘## 第 2 章’编号，后续章节（如第 4 章 SVG、第
    5 章 JS）在目录中均带编号，但该行标题‘## CSS – 为你的网页设置样式’**完全缺失‘第 3 章’编号**，格式与前后章节强不一致，违反‘编号特征’判断标准。
  - 前一行（第 2406 行）存在‘#### 3’疑似页码/页眉残留（四级标题渲染页码），干扰了章节边界识别；该行紧跟其后，更像是页码后的节级标题延续，而非新章起始。
  - 语义上‘在本章结束时’（第 2412 行）虽暗示章节概念，但标题本身无编号，依据‘注意也可能没有章序号，这就需要依靠语义判断’反向推断：若为真章标题，作者极大概率会保持编号一致性，缺失编号强烈暗示其为大章内的专题节（如‘CSS
    基础’)。
  keep_split: false
