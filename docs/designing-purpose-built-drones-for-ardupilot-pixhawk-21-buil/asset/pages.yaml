- pgno: 174
  md: 'Next, we need to tell Pixhawk how to handle emergencies.


    ![](img/504adb30bdfce87f38258e08f11180af_174_0.png)


    Failsafes are engaged during (what most would call) emergency situations. They
    can range from engaging a different autonomous flight mode to preventing a user
    error. Let''s take a look at these:


    +   - **Battery Failsafe Enable:** This sets the flight mode to engage if the
    battery''s capacity drops below safe levels.

    +   - **Ground Station Failsafe:** This sets the flight mode if the connection
    is lost with the ground station. As we''re using a ground station (heavily), and
    don''t plan on long-range autonomous flight, we''ll set this mode to RTL.

    +   - **Throttle Failsafe Enable:** This sets whether or not the pilot can drop
    below a specified (using the slider) level during flight. We would neither want
    to turn off our motors and tumble out of control, nor fly through our own propwash
    during descent (potentially resulting in a crash).'
  merge: -1
  img_proc: true
