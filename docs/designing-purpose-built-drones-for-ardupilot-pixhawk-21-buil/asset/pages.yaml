- pgno: 139
  md: 'Even with this tool in place, it''s still a bit confusing, right? Let''s talk
    about these parameters and what they mean:


    +   - **Chord (mm)**: Simply put, it''s the entire length of your airfoil. It''s
    the straight line from the front tip to the back tip.

    +   - **Radius (mm)**: This is the radius of the curve used to generate the very
    front curve on the airfoil (the leading edge).

    +   - **Thickness (%)**: This is the vertical measurement at the thickest part
    of the wing.

    +   - **Origin (%)**: This has zero impact on the airfoil shape. It just moves
    the origin point of the grid backward from the nose of the wing.

    +   - **Pitch (degrees)**: This is how much the overall design of the wing is
    pitched up from being level.

    +   - **Halo (mm)**: This involves zero impact on the airfoil shape. It just draws
    a line inside or outside of the outer line to help if you''re using this image
    to cut with a jig.

    +   - **All other parameters**: This is also just for how the airfoil is drawn
    for your plans from grid size to paper size.


    See? It''s not really that bad. It sure is a heck of a lot harder than a multicopter
    though, and the development cycle is much much longer. You''ll need to test fly
    the airplane several times and tweak the design until you''re happy (long before
    implementing Pixhawk).


    # Summary


    In this chapter, you got a good primer for all that is involved in designing an
    aircraft and the differences between an aircraft and a rover. I''m sure now you
    can see why we started with rovers. Compared to the aircraft, they''re a piece
    of cake.


    In the next chapter, we''ll be showing you how to implement Pixhawk into a multicopter.
    We won''t be focusing on designing a multirotor so much as making it work. So,
    we''ll kitbash a DJI Flamewheel F550 airframe. Enjoy!'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# # A Simple Multicopter Drone


    Multicopters are very complex beasts. An awful lot can be done with Pixhawk and
    multicopters. Through the programming interface **Micro Air Vehicle Link (MAVLink)**,
    all sorts of missions can be triggered automatically. From an alarm system trigger
    sending a drone out to a specific waypoint (based on the sensor triggered), to
    missions that adjust to varying conditions such as weather, light conditions,
    or any other number of variables only limited by your imagination—multicopters
    are the most versatile, yet complex, systems available for your design and concepts.


    For the purposes of this book, we''re going to keep things simple though. Once
    you''re ready to take the leap into programming full applications for the MAVLink
    interface, there are great tutorials and a full coding guide at the *QgroundControl*
    website (`http://www.mavlink.org/dev/mavlink_groundcontrol_integration_tutorial`).


    What we''re going to do is show you how to design one of the most complex machines
    that Pixhawk can control—multicopter drone. Specifically, we''re going to show
    how to design and prototype a 360 VR video multicopter.'
  merge: -1
  img_proc: true
- pgno: 141
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 142
  md: '![](img/504adb30bdfce87f38258e08f11180af_142_0.png)


    Of course, our proof of concept gimbal won''t be anything near this elaborate
    but the principle of their operation is the same. We need something to dampen
    vibration, and counter the constant tilting and rolling of a multicopter.


    But we''re getting a bit ahead of ourselves. What''s a nice, inexpensive camera
    we can use to do some 360 VR video on a proof of concept?


    # Starting with the payload


    The drone is just a delivery device for its payload, in this case, a camera. So,
    it makes sense when designing any drone to start with what it is that you''re
    trying to carry. On any proof of concept, the idea is to spend as little money
    as possible to prove your concept. Just start with the assumption that you will
    encounter problems and maybe even crashes (especially with a multicopter). Why
    risk a $10,000 camera (or even a $1,000 camera) on a proof of concept? Start small,
    and then scale up!'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'So, we found the perfect camera—a Ricoh Theta S. The Theta S is small, lightweight,
    has an integrated (built-in) battery, and an integrated memory card. The less
    we have to worry about, the better right? Best of all, it shoots in the same 360
    format as any high-end 360 camera, and only costs $326! It''s quite simply the
    GoPro of 360 Cameras. The Amazon listing for the Theta S is shown in the following
    screenshot:


    ![](img/504adb30bdfce87f38258e08f11180af_143_0.png)


    Also, (as you can see on the listing), we already owned one! Always try to use
    things already in your shop for proof of concept. It saves a lot of cash! We purchased
    ours the previous summer to do some prototyping of our 360 VR editing workflow
    in postproduction.'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'The problem we''ll now encounter is that (most) gimbals (especially inexpensive
    ones) are made for goPros. Some more expensive ones can be balanced for any camera...
    but they are meant for much bigger and heavier cameras. We don''t want to invent
    an all new gimbal for our drone. That''s not our business and is way beyond our
    scope for this proof. So, how do we manage a Theta S on an existing gimbal for
    our proof of concept?


    # Choosing the gimbal


    As we''ve already said, the gimbal''s main purpose is to keep the camera stable.
    It does this with the help of two methods:


    +   1. Dampen vibration through rubber grommets (between the main frame and the
    gimbal mount).

    +   2. Counter the normal tilting, rolling, and yaw movement of the drone via
    brushless motors on each axis.


    Vibration dampening, we''re all good. The same grommets are used for huge cameras
    as the smallest (just the count of grommets may change). Where our difficulty
    lies is in the balancing of the gimbal itself. We''d like to use a goPro gimbal
    (as it''s nearly the same weight—125 grams for the Theta S and 149 grams for the
    goPro). Although the Theta S is (technically) lighter, the weight distribution
    will be completely different. It''s a long, thin camera (that we''ll likely have
    to hang upside down). But, because the dimensions are completely different, we
    can''t ignore the principle of leverage on the gimbal axis. Remember give me a
    lever long enough, and I can move the world?


    We''ll need to make sure that our gimbal can overcome the extra (effective) weight
    due to leverage, and keep our Theta S stable. This means it''ll also need to be
    somewhat programmable to keep it properly calibrated.'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'Finally, we''ll need to make sure it''s inexpensive. So, off to Amazon we go
    and this is what we arrived at:


    ![](img/504adb30bdfce87f38258e08f11180af_145_0.png)


    It has enough motor power to allow for the variances in weight distribution, and
    gives us the ability to program the controller via USB!!! So far, our total budget
    is up to $496.94 US. OK we''re doing good for a proof of concept (so far).


    Now, how will we mount the Theta S to this gimbal? Well, enter our 3D printers
    from the previous chapters. We use our calliper measuring device (once the gimbal
    arrives) to measure the actual goPro mount, as well as the dimensions of our Theta
    S (at its widest point). The Theta S is kind of football-shaped on its y-axis
    (height-wise). This works well for us.'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'If we design a mount that fits a goPro''s dimensions, but has a gap in the
    center that is square, a simple bead of silicone on the sides of where the Theta
    S will be pinched in will make it very strong and have enough friction to keep
    the Theta in place. Here''s the simple (and lightweight) design we worked up:


    ![](img/504adb30bdfce87f38258e08f11180af_146_0.png)


    There are a few design elements that should stand out to you:


    +   1. The edges are bevelled so that if any measurement (or 3D printing) variance
    will make the adapter seat firmly into the mount.

    +   2. There are pins and holes so that the adapter holds the Theta S without
    the danger of the two sides of the clamshell sliding apart.

    +   3. The hole for the Theta S to slip into is square (and not football shaped).'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'Here is what the final 3D-printed adapter looks like:


    ![](img/504adb30bdfce87f38258e08f11180af_147_0.png)


    It may be a bit difficult to see (as we also used transparent filament in our
    printer) the two beads of silicone sealant used on each half of the clamshell,
    but this is the reason it works so well. It offers a lot of traction, and is flexible
    enough to really put the squeeze on our Theta S. Also, notice that the 3D print
    is hollow with a honeycomb inside. This makes it nice and light, yet strong. Here''s
    how it looks with the Theta S strapped in:


    ![](img/504adb30bdfce87f38258e08f11180af_147_1.png)'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'Seems immensely simple, right? It is. Sometimes the best solutions are. For
    proof of concept designs, sometimes rubber bands and zip ties are your best friends.
    You may be wondering if the rubber bands will interfere with the goPro mount.
    I assure you they won''t. In fact, they''ll come in handy. But we''ll get there
    in the assembly stage.


    So, our final weight is 146 grams, which is still less than a goPro. It''s important
    to keep weighing things as you go with a multicopter. I apologize for the schmegged
    scale. It''s also the scale we use to weigh silicone ingredients before mixing.
    But trust me, it was zeroed (with the Theta neoprene cover already on it) before
    the weight; 146g is accurate.


    ![](img/504adb30bdfce87f38258e08f11180af_148_0.png)


    OK, so far our total weight is 149 grams (gimbal) + 146 grams (camera) for a grand
    total of 295 grams. It''s extremely important to keep track of weight while putting
    together an aerial drone (especially a multicopter). Now we just need a drone
    that can lift that payload and land safely.'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# Landing gear


    Well, we''re in a pickle here. The problem is that we need retractable landing
    gear (as shown in the following screenshot):


    ![](img/504adb30bdfce87f38258e08f11180af_149_0.png)


    Why? We''re working with 360 VR video here. We want to just replace the drone
    (and put in more sky) not have to rotoscope out landing gear on the sides and
    below our camera. But the landing gear wouldn''t arrive for a month! Additionally,
    there''s no real way to mount our gear and our gimbal to the drone. We need a
    rail system.


    Enter the landing gear as shown in the following screenshot:


    ![](img/504adb30bdfce87f38258e08f11180af_149_1.png)'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'Ugh. Well, they don''t retract, but they do have rails so, we''ll order both.
    We''ll put the rails on the drone, and run our basic flight tests. Then, when
    the retracts arrive, we''ll be all set to run some video tests. It''ll cost us
    an extra $20.99, but who cares? In the grand scheme of things, it''s a drop in
    the bucket. We''re also in a time crunch. So if the retracts don''t arrive in
    time, we can still run some tests and get this thing in the air!


    What''s the biggest thing these two have in common? Lots of clearance. That way,
    the extra length of our camera and gimbal will still clear flat ground/a landing
    pad. It''s by far the most important part to keep the camera safe.


    So far, our total budget has reached $561.63 US. And we haven''t even bought our
    airframe, motors, propellers, and ESCs yet. Luckily, we already have a Pixhawk.


    But we''re not at that point. Now, since we really have no way of previewing our
    360 video (without using Wi-Fi) on this camera... we''ll need a second FPV (first
    person view) camera (so we can see what''s happening with our drone from the ground
    station). We never want to use Wi-Fi on an aerial platform. There''s too much
    possibility of interference with control signals. That would be full risk and
    you never want to go full risk.


    # A first-person view – FPV system


    In the US, it''s illegal to fly a drone outside of visual line of sight (VLOS)
    without a special waiver. However, you''re safest if when you look at a laptop
    screen, you can still see something about where your drone is headed, right? So
    an FPV system is a necessary safety feature (if used properly). Plus, it gives
    the director of your VR shoot an opportunity to see (first hand) where the drone
    is shooting from and direct you properly.


    Since this is just a proof of concept, we don''t need a very powerful system.
    It doesn''t need a very long range, and as this is just a small version of a production
    drone it really needs to be as simple and light as possible.'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'Enter the (all in one unit) Spektrum FPV camera with an integrated transmitter:


    ![](img/504adb30bdfce87f38258e08f11180af_151_0.png)


    That’s another 85 grams, bringing our total weight (so far) up to 295 grams +
    200 grams (landing gear + rails) + 85 grams (camera/transmitter) = 580 grams.
    See how it just keeps getting bigger and bigger? But wait, there’s more!


    This transmitter works at a much smaller voltage than our drone. We have two options:
    either put in some sort of transformer or just use another battery. We’ll go with
    the second option (for our proof of concept). Why? Because a 1S LiPo battery is
    probably going to be even lighter than a transformer:


    ![](img/504adb30bdfce87f38258e08f11180af_151_1.png)'
  merge: -1
  img_proc: true
