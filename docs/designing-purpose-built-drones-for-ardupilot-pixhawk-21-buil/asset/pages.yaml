- pgno: 156
  md: 'I know the font is really small to read. The bottom line? We get about 5.5
    minutes of flight time. If we were going into a production prototype, we''d spend
    a ton of time (and probably a lot more money) tweaking our parts until we reach
    just the right balance of flight time and payload. But this is certainly not a
    production prototype. Not with the camera we''d want to eventually carry, and
    nowhere near the size we''d eventually want to go for. For a simple proof of concept,
    we can deal with 5-minute flights. If we really want, we can bump that up to just
    over 7 minutes with a 5,000 mAh battery. But that may overload our motors if we
    ever go full throttle. Let''s not risk it.


    Again, this low flight time may shock you, if you''re used to a DJI Phantom, Inspire,
    and so on. But again, this is not a full production drone. This is just proof
    of concept. Not of balancing battery to drive to weight, but of flying a 360 camera,
    and successfully stabilizing it with a custom system.


    For those purposes, 5 minutes is not great, but certainly not bad either (especially
    for our budget). With the right tweaks to our hardware and budget we could easily
    expect to exceed 20-minute flight times. Again though we''re under a time crunch.
    A cost of $1,000 (not including the Pixhawk) for a fully functional proof of concept,
    minus the stamina of a production prototype, should be enough to get a Kickstarter
    campaign going. Or enough to at least prove that we can build such a drone to
    a potential investor. The rest is just tuning (picking just the right size, hardware,
    and batteries).


    Now, let''s build our proof of concept machine.


    # Assembling the drone


    As predicted, our retractable landing gear has not arrived yet. Not only that,
    they are having issues in customs. Good for us! We thought ahead and bought temporary
    landing gear; $20.99 well spent!'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'So, here''s a glimpse of what our assembled drone looks like (with temporary
    landing gear):


    ![](img/504adb30bdfce87f38258e08f11180af_157_0.png)


    Let''s take a quick look at the building techniques on a multicopter drone.


    # Too many freakin'' wires!


    That thing looks like a mess, doesn''t it? It''s not. Cable management is the
    key. You don''t want any wires in danger of obstructing (or even breaking) propellers.
    That spells instant crash. The following image shows how the wires to the ESCs
    and motors are routed under the airframe and bundled:


    ![](img/504adb30bdfce87f38258e08f11180af_157_1.png)'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'Not only that, but **electromagnetic (EM)** interference is your enemy in the
    air. It can completely disrupt your video, telemetry, GPS, or even control signals.
    So never wrap your cables in circles. Instead, notice that they''re wrapped up
    in figure-eights (especially power leads).


    Since we''re on this angle—don''t leave out any screws! A lot of old-school drone
    pilots come from the fixed-wing world. A common practice in these circles is to
    only screw down motors with two screws. Don''t do that. If a screw vibrates loose,
    and you lose a motor, your multicopter can turn into a rock falling from the sky
    pretty quickly.


    When dealing with multicopters, you have to remember that even a piano has a better
    glide profile than a multicopter.


    It''s not unheard of for kit manufacturers to throw in a few extra screws. If
    you find extra screws when you are done, double-check every screw to make sure
    you put them in. If they seem superfluous they''re not.


    # GPS on a stick


    You may also notice that the GPS antenna is mounted on a mast (as shown in the
    following image):


    ![](img/504adb30bdfce87f38258e08f11180af_158_0.png)'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'You want your GPS to be well out of the plane of your motors. Remember that
    electric motors work via a magnetic field. The very definition of EM, right? So
    keep it up and out of the way of these motors. The plane that the motors are running
    on won’t necessarily kill your GPS. But it could. Why take the chance, right?
    It may look weird. But a crashed drone looks worse.


    # Rails are awesome


    Rails have been used in the television and film industry for a very long time.
    Simply put, they’re a standardized system for mounting accessories. In fact, rails
    (in several different forms) are used in everything from firearms (picatinny rails
    for sights, flashlights, lasers, and other accessories) to cinema cameras (for
    matte boxes, follow focus, monitors, external hard drives, and so on). Rails for
    drones are the center of a drone. All major hardware is attached to the rails.
    The main airframe, the landing gear, the gimbal, and even in most cases, the batteries
    are mounted to the rails. You can see the rails for our drone in the following
    image:


    ![](img/504adb30bdfce87f38258e08f11180af_159_0.png)


    Here, you can see the two carbon fiber tubes (the rails) with the airframe attached
    (using rubber grommets inside of aluminum d-rings), our gimbal attached, the landing
    gear supports attached, and even a blank rail mount (top) in case we decide to
    mount another accessory in the future.'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'You can get an idea of just how useful rails are. It''s a pretty simple concept,
    really. Most accessories simply snap into place on the rail system. Rails are
    very handy and awesome.


    # Anything loose? Tuck it away and tie it down


    In the following image, you can see that not every servo connection was plugged
    in. As we had no need to tilt or pan the gimbal during flight (remember, it''s
    a 360 camera), we didn''t bother connecting up those controls for the gimbal.
    But we don''t want loose wires flailing about and possibly hitting our rotors.
    So they''re tucked into the frame with just the ends poking out in case we change
    our mind later on the subject. Also, wherever possible, we tucked wires deeper
    into the frame, and wherever not; we used zip ties to hold them together. There
    are no less than five zip ties in the following image. Can you spot them all?


    ![](img/504adb30bdfce87f38258e08f11180af_160_0.png)'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'Along those same lines, make sure you don’t leave anything to chance with components.
    Simply strapping down batteries isn’t enough. Velcro them to make sure they don’t
    slip free; 3M automotive tape is also great for fixing things down in a more permanent
    way. The following image shows the battery for the FPV camera, as well as the
    camera itself. Notice that the camera is fixed with a piece of grey 3M automotive
    tape, and the battery is fixed using Velcro (currently placed on its side to show
    the Velcro).


    ![](img/504adb30bdfce87f38258e08f11180af_161_0.png)


    Automotive tape, Velcro, and zip ties are your best friends with multicopter building.'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# Hooking up the ESCs to Pixhawk


    Pixhawk can handle all sorts of multicopters. The following chart illustrates
    the types of multicopters as well as their motor numbers:


    ![](img/504adb30bdfce87f38258e08f11180af_162_0.png)


    As you can see, there are a lot of different types of multicopters, so don''t
    let yourself fall into my personal pet peeve—someone who calls them all quads.
    They''re certainly not all quads. The direction of the circles in the graphic
    illustrate the direction that the motors/propellers must turn in order for the
    multicopters to fly properly with Pixhawk. The numbers correspond to the Main
    Out number on the servo board of the Pixhawk.'
