- pgno: 261
  md: '# Summary


    In this chapter, we reviewed many of the interface components of Mission Planner.
    We also covered some features we haven''t mentioned before. It''s important to
    note that this chapter is meant mainly as a reference for your future use in your
    adventures developing prototypes using Pixhawk.


    It''s our sincere hope that you learned about Pixhawk, and prototype design built
    around it, as well as the fabrication of prototypes and bringing your ideas to
    life. We hope you enjoyed this book as much as we enjoyed writing it. Thank you
    for reading it, and you should congratulate yourself. It''s an awful lot of information
    to consume!'
  merge: -1
  img_proc: true
