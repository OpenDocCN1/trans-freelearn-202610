- pgno: 89
  md: 'With all the parts laid out, you can see the sleeve that the drive shaft runs
    through (foreground with a white clump of silicone on it), and the drive shaft
    (right side of image next to the black propeller)


    Now, we can measure all our parts (especially the motor), and design the duck
    body.


    # Designing the duck body for 3D printing


    Even if you don''t own a 3D printer, designing for one is handy. Plus, you can
    always ship your designs off to a friend, or service that does have such a device.
    You should eventually get one though, and they are relatively inexpensive nowadays.


    One of the beauties of Computer Aided Design (CAD) is that you don''t actually
    have to use CAD software to create objects in the real world. Confused? Don''t
    be. CAD design and 3D animation software use very similar methodologies for modeling
    objects. They even share (some) file formats. And any 3D modeling software (worth
    its salt) can import and export in CAD formats.


    You don''t have to spend a boatload on AutoCAD or SolidWorks to create and prototype
    your designs. These programs can cost thousands of dollars (per year, or even
    per month) to own. Instead, you can use free software such as Blender to model
    your objects. The additional benefit to these easily accessed software packages
    is that there are tons of YouTube videos and tutorials on their use around the
    internet.


    I''m a 3D animator by education. I''ve used just about every software package
    to create this. For modeling, I like Lightwave 3D only because it''s what I learned
    on originally (back in 1995). If this was for a feature film, I''d probably use
    something else. But the methodologies (regardless of software package) I show
    here are universal in any modeling package (from Blender to Maya, and even in
    AutoCAD to SolidWorks).'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# # The basics of 3D modeling


    Before we start, here''s what we want to end up with for the outer-hull of our
    duck:


    ![](img/504adb30bdfce87f38258e08f11180af_90_0.png)


    It may be hard to see, but you''ll notice that the duck isn''t solid. Instead,
    there is an inner duck and outer duck. The easiest way to see this is to look
    along the outline on the lower-left of the preceding diagram. This means the duck
    will be hollow, and you can see that the bottom-hull of the ballast section is
    thicker than the rest of the duck. This is because it needs to hold the weight
    of the clay, and be stronger in the event that our duck runs aground.


    You’ll also notice that the duck (although in the upper-right it appears to be
    made up of 4-sided polygons), is made up of triangles. Remember geometry? three
    points define a plane. So, 3D printers like triangle polygons (rather than quads).


    Here''s something you need to know before we show you how it was modeled. There
    are (essentially) two types of models—the ones based on polygons (where each set
    of points is joined by straight lines) and the ones based on curves (where they
    come out much smoother). 3D printers *don''t work with curves*. You must use polygons.'
  merge: -1
  img_proc: true
- pgno: 91
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 92
  md: '# Box modeling 101


    There are many different methods for creating 3D models. But box modeling is one
    of the easiest. Other methods can produce greater detail, and can be much better
    for animating. But box modeling can let you create an object quickly, and with
    minimal pain and boredom. So what is it?


    It''s one of the closest techniques to modeling with clay that you can use. It''s
    called box modeling because that''s what you start with, a box (as shown in the
    following diagram):


    ![](img/504adb30bdfce87f38258e08f11180af_92_0.png)'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'Then, we convert the object into subdiv polygons (in lightwave 3D, you just
    hit the Tab key), as shown in the following diagram:


    ![](img/504adb30bdfce87f38258e08f11180af_93_0.png)


    So, it turns into more of a ball shape. And there you have it you''re now working
    with subdivs. Now, let''s talk about the tools.'
  merge: -1
  img_proc: true
- pgno: 94
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 95
  md: '![](img/504adb30bdfce87f38258e08f11180af_95_0.png)


    Let''s take a closer look at how all this worked:


    +   - **Top-left:** The polygons were selected on the top-front of the object

    +   - **Top-middle:** The polygons were extruded, shifted up, and resized to form
    the base of the neck

    +   - **Top-right:** The process was repeated to form the base of the head

    +   - **Bottom-left:** The process was extruded and shifted again to form the
    top of the head

    +   - **Bottom-middle:** The front of the head was selected, extruded, and resized
    to form the base of the duck bill

    +   - **Bottom-right:** The process was extruded once more to form the end of
    the bill'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'As you can see, this is much easier to do than most people think. A little
    bit of dragging some points around and you''ll end up with a good-looking head.
    This process is repeated for the ballast area, and a knife is used along with
    some point-dragging so that we can form the tail of the duck. The end result looks
    like this:


    ![](img/504adb30bdfce87f38258e08f11180af_96_0.png)'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# Making the duck hollow


    Before converting the curves to polygons (subdividing), let''s just switch back
    to straight polygons for a moment to make the duck hollow. You''ll notice (in
    the following diagram) that the duck looks pretty ugly. Don''t worry about it,
    we''ll go back to curves soon:


    ![](img/504adb30bdfce87f38258e08f11180af_97_0.png)'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'There are a few ways we could make the duck hollow. One is with Booleans (which
    we''ll cover later). We''re simply going to use a method called thicken. This
    thickens each polygon. In the event of a closed object (a solid), it makes the
    object hollow. Thickening allows us to control just how thick the walls of our
    hollow object are. In this case, we made the object 1/8" thick (as shown in the
    following diagram), and then went back to curved mode:


    ![](img/504adb30bdfce87f38258e08f11180af_98_0.png)


    Now, we''ll make our object polygonal.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# Freezing curves into polygons – subdividing


    Creating polygons is really easy from subdivids. Every software package works
    slightly differently. In Lightwave, we simply use the freeze command (Ctrl + D).
    But as you can see (in the following diagram), our polygons are still not triangles.
    They''re still quads:


    ![](img/504adb30bdfce87f38258e08f11180af_99_0.png)


    Before we get into making triangles, you''ll notice that the duck is still highly
    faceted. It''s easy enough to fix. You could just make this into curves again,
    and re-freeze it. This will greatly multiply the number of polygons. Every time
    you perform this process, your object will keep getting smoother. Our duck is
    stealth, so we''ll leave it this way.'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'Again, every software package has a way of converting four-sided polygons (quads)
    into three-sided polygons (triangles). In Lightwave, it''s just the triple command.
    It''ll look like this:


    ![](img/504adb30bdfce87f38258e08f11180af_100_0.png)'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# Booleans


    Booleans are another function in any modeling tool. With these, you can join two
    pieces of geometry or even use one object to cut another. For example, consider
    the following diagram:


    ![](img/504adb30bdfce87f38258e08f11180af_101_0.png)'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'In the preceding diagram, we have a ball and a cylinder that have been combined
    into one object. Notice that there is no cylinder geometry inside the ball. It''s
    one solid object. Whereas, in the following diagram, we have that same ball and
    cylinder, but the cylinder has been used to cut a hole in the ball. This is done
    by creating two objects and using the Boolean function:


    ![](img/504adb30bdfce87f38258e08f11180af_102_0.png)


    This method is how we created not just an access hole, but the lid on our duck.
    We simply created a basic shape, and used it once to cut (Boolean subtract) a
    hole. Then, we used that shape and the original duck again to create a lit (using
    Boolean intersect). Here, you can see them shown in different colours (as shown
    in the following diagram):'
  merge: -1
  img_proc: true
- pgno: 103
  md: '![](img/504adb30bdfce87f38258e08f11180af_103_0.png)


    And there you have it—all the basic tools you need to model your own objects.
    Direct from your imagination to the real world—speaking of bringing them into
    the real world.


    # Printing large 3D models


    Our duck is nearly 11-inches long. Our 3D printer has a 5.5 x 5.5-inch print bed.
    This means that we''re going to have to print it in sections. Using the Boolean
    method (as we did earlier), we can cut our object into sections. But since this
    object is going to need to be water-tight, how do we do this?


    Cyanoacrylate adhesives (CA) glue (basically, superglue) melts plastic together.
    It''s great stuff. It''s more like welding plastic than gluing it. So, in step
    one, we put a nice bead of glue on one of the two objects to be glued, and then
    just press them together for about 10 seconds. The glue dries up very fast. Just
    do yourself a favour, and don''t touch the glue. Superglue is famous for bonding
    to skin (military medics and some surgeons use it to seal wounds).'
  merge: -1
  img_proc: true
- pgno: 104
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 105
  md: 'It''s important to not only let the silicone sealant dry, but let it cure for
    at least 24 hours before doing this:


    ![](img/504adb30bdfce87f38258e08f11180af_105_0.png)


    After the success of this test, we fill the ballast section with modeling clay,
    and do it again for two reasons:


    +   1. We want to make sure we didn''t pack it with too firm a hand (breaking
    a seal)

    +   2. We need to make sure that the water line comes up to the right level


    The bottom-half with the clay pack is shown in the following image:


    ![](img/504adb30bdfce87f38258e08f11180af_105_1.png)'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'Awesome! Now that our duck is packed with 2 lbs of clay, we''re sure that there''s
    no way it''s going to capsize. Also, now that we''re sure that the duck is watertight,
    let''s drill some holes in it! Wait... what?!


    # Installing the propulsion system


    We want to perform the next steps before the clay dries up. First, we want to
    take out a small chunk of the clay at the back, and drill a hole at an angle.
    There, we''ll feed the sleeve and drive shaft through and install the propeller.
    Do not ever glue a sleeve into place. It needs to remain flexible. Instead, we
    use a liberal amount of silicone to hold it in place, and seal the hole inside
    and out of the body (as shown in the following image):


    ![](img/504adb30bdfce87f38258e08f11180af_106_0.png)


    Now, it''s time to make our motor mount. We wanted to see exactly where the drive
    shaft will be, the angle it''s at, and where the hookup to the motor is. We do
    the same thing we did for the drive-shaft sleeve on the front of the boat. There,
    we put the long end of the water-cooling tube. We do this before placing the motor
    mount, because otherwise we wouldn''t be able to get at it. This tube will take
    in water for the water cooling (as shown in the following image). After waiting
    for the silicone to dry, we can trim it back a bit but not flush:'
  merge: -1
  img_proc: true
- pgno: 107
  md: '![](img/504adb30bdfce87f38258e08f11180af_107_0.png)


    After placing the motor mount (printed with ABS plastic), we glue the motor in
    (still using its mounting bracket from the original boat), and route the short
    end of the water-cooling tube out the side (as shown in the following image):


    ![](img/504adb30bdfce87f38258e08f11180af_107_1.png)'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# Steering and electronics


    You may notice from the preceding image that the motor only has two-wires. This
    is because it''s a brushed motor. In the last chapter, we discussed brushed versus
    brushless motors. A brushed motor requires an entirely different type of ESC.
    Why is this important? Because (unfortunately) the receiver for our original boat
    had an integrated ESC. So, we''ll need to dig out a new brushed ESC for our motor.
    While the intern is doing that, let''s install our newly printed rudder.


    First, we created a block that fits on the back of our duck with the male end
    of a hinge on it. Then, a simple rudder with a control arm on it (so that as the
    servo pushes a control rod, the rudder will turn). Mounted, it looks like the
    following image:


    ![](img/504adb30bdfce87f38258e08f11180af_108_0.png)


    On the inside, we glued our electronics platform into place, drilled a hole (well
    above the water line) for our control rod. The rod can''t be encumbered by silicone,
    so this hole will leak if water rises to this line. So, we wanted it as high as
    possible. And we mounted our electronics platform (as shown in the following image):'
  merge: -1
  img_proc: true
- pgno: 109
  md: '![](img/504adb30bdfce87f38258e08f11180af_109_0.png)


    You can also see that we mounted our Pixhawk on the electronics platform. We put
    a bend in the control rod so that we can adjust its effective length to trim out
    our controls once everything is powered on.


    # Hooking everything up!


    Well, do that after you''ve water tested it. The only thing worse than water on
    electronics is water on electronics when they have power! As for the plugs and
    hook-ups, everything works exactly the same as it did with the land rover. Instead
    of a servo to the wheels, it''s one to the rudder. Instead of a motor to the wheels,
    it''s one on the propeller. But every plug should go in the same way on a water
    rover as with a land rover. Afterward, put the lid on, and program it the same
    exact way you did for the land rover. Then, you''re off and swimming with the
    ducks!'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# Summary


    In a book about Pixhawk drones, you may be asking, "Where''s the programming of
    the Pixhawk?!" We''d be remiss in a book about designing purpose-built drones
    if we didn''t cover something on the water. Plus, we want to show you that there
    are similarities between land and water drones. What we really wanted to get deeper
    into is the *design and prototyping* of an idea. Now that we''ve covered the modeling,
    and construction of your own design (we covered modeling, printing, water-sealing,
    design, sketching, identifying problems, and construction testing); in the next
    chapter, we''re going to get much deeper into the Pixhawk.


    We''ll be taking a (pretty much) fully constructed vehicle (a motorized golf trolly),
    and adapting it for Pixhawk. We''ll also be getting into using a mobile device
    (via Bluetooth) to control your drone, as well as getting deeper into the configuration
    of Pixhawk.


    From here in, now that you''re an expert in turning your construction designs
    into reality we''re going to be focusing more on the Pixhawk device itself.


    So, buckle up!'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# 4


    # A Drone for Golfers


    As we''ve stated a few times before, when choosing an industry to make a drone
    for, you have to balance the size of the market (demand), with how much money
    they have to spend (cost), and how easy it will be for you to fill that demand
    (supply).


    One of the industries that is extremely popular is golf. Every year, consumers
    literally spend billions of dollars on golf equipment and accessories. One thing
    golfers go nuts about is the new technology to help their game. Sounds pretty
    much perfect, right?


    So, where can a drone fit in? A multicopter to fly down the fairway and check
    the layout? Maybe, but if the golfer has played that course before, why would
    they need it? They wouldn''t. Ok, that''s a bad idea. What about a submarine drone
    to look for a golf ball that went into the water hazard? Not a terrible idea,
    but there are probably so many balls sitting at the bottom of a water hazard that
    finding your own ball may prove impossibly difficult. And who wants to keep pulling
    out golf balls that have been damaged by weeks of sitting at the bottom of a pond?
    Nope, another bad idea.


    What''s something that every professional golfer has, and every amateur wants
    (but may not be able to afford)? A caddy (someone to carry your clubs around the
    course)! So, what if we took a motorized golf trolly (a small cart that carries
    golf clubs) and made it follow a cell phone?


    Now, we''re on the right track.


    We''ll be covering the following topics:


    +   - The design

    +   - Using tank locomotion

    +   - Using LIDAR to avoid obstacles'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# The design


    After some initial research, we found that there is already such a device out
    on the market. It''s called the Stewart X9 Follow. However, at a list price, this
    item is just shy of $3,000 US!


    ![](img/504adb30bdfce87f38258e08f11180af_112_0.png)


    It''s certainly a high-quality product—a very sleek and beautiful design. There
    is no doubt that the high-end golfer would love to indulge in this item. But for
    your average golfer, this would absolutely break the bank.


    This item also uses its own remote. The rover follows the remote, or can be piloted
    manually with it. We''re going to use a different approach. Instead of a proprietary
    remote, we''ll make ours follow a smart phone (via Bluetooth or Wi-Fi). This means
    it can be paired easily. Also, we''ll include a standardized RC remote (in the
    event that the user''s phone runs out of battery because they forgot to charge
    it).


    Using standardized parts should allow us to bring the final cost of our unit down
    to around $1,000 US. Our unit may not end up as luxurious as the Stewart, but
    it will hit a much wider section of the market.'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'Here''s our original sketch:


    ![](img/504adb30bdfce87f38258e08f11180af_113_0.png)


    Fabricating an entire golf caddy could get quite expensive. So, let''s start off
    with someone else''s (already motorized) caddy. We found the following on Amazon:


    ![](img/504adb30bdfce87f38258e08f11180af_113_1.png)


    The beauty of this trolley is that it already has dual motors (as it''s built
    to be piloted via remote). All we really have to do is implement a brain in this
    dumb caddy. Then, it can intelligently follow a cell phone.'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'We are going to have to do a complete rewire to make this work though. The
    motors are brushed, so we''re going to need two brushed ESCs. These speed controllers
    also need to be capable of reverse as well. Why? Because to turn the trolley,
    we will use a *tank* like steering (where one side goes forward and the other
    side reverses).


    Now, we need to lay out exactly how everything will connect, so let''s look at
    our wiring diagram:


    ![](img/504adb30bdfce87f38258e08f11180af_114_0.png)


    You may notice that we didn''t include a **Battery Elimination Circuit (BEC)**
    to provide power to the servo section on the Pixhawk. That''s because we''re going
    to use ESCs that have BECs built in. This will provide voltage to the servo board
    via the ESC servo connections.


    You''ll also notice that at this juncture we hadn''t decided whether to use Wi-Fi
    or Bluetooth as our communication protocol. We''ve eliminated the 900 Mhz data
    connection for laptops in favor of one of these protocols. Why? Because nobody''s
    going to want to carry around a laptop on the golf course. Instead, we''re going
    with a mobile device.


    So, what''s the difference? If we connect via Wi-Fi, the Pixhawk will become a
    network access point. This may actually present a problem because GPS requires
    a data connection on your phone to display maps. If we use Wi-Fi, the network
    is established with Pixhawk from your mobile device (rather than your service
    provider''s cellular data connection).'
  merge: -1
  img_proc: true
- pgno: 115
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 116
  md: 'So how do we make Pixhawk use a tank style drive system to steer the vehicle?
    Simple, really.


    # Adapting Pixhawk for skid-steering


    The first thing is to plug the right ESC into the right port on the servo panel
    of the Pixhawk. The left wheel''s ESC plugs into MAIN OUTPUT 1. The right wheel''s
    ESC should go into MAIN OUTPUT 3 as shown in the following diagram:


    ![](img/504adb30bdfce87f38258e08f11180af_116_0.png)


    Now, we just have to enable skid-steering in the Pixhawk itself. It''ll do all
    the work of figuring out what to do to what wheel all on its own!


    Inside of the Mission Planner software, connect to the Pixhawk (after plugging
    in the USB cable of course). Enter the Config/Tuning screen and select Standard
    Params as shown in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 117
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 118
  md: '# # Using Bluetooth to control Pixhawk with a phone


    Bluetooth with Pixhawk is a snap. But just like every other bit of Pixhawk functionality,
    an add-on module needs to be purchased. We picked up the one shown as follows:


    ![](img/504adb30bdfce87f38258e08f11180af_118_0.png)'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'Of course, we had to alter the cable (just as we did before) because the cable
    included with this module is for the old-style plugs. We connected our Bluetooth
    module to the Telem 1 port as shown in the following figure:


    ![](img/504adb30bdfce87f38258e08f11180af_119_0.png)


    Now, it''s just a matter of binding our Android device''s Bluetooth to the Pixhawk''s
    Bluetooth. Just power on your Pixhawk and bind using the same method you would
    for any Bluetooth device. The software to control Pixhawk from a mobile device
    is called DroidPlanner 2. It''s free!'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'We''re not quite there yet, but if you''re curious on how to get a Pixhawk
    vehicle to follow you using DroidPlanner 2, it''s easy! Just click on the **Follow**
    button, and set the radius you''d like the rover to stay within. Of course, you
    can ignore the `altitude` attribute (as this is a ground vehicle). You can see
    the **Follow** button in the following picture:


    ![](img/504adb30bdfce87f38258e08f11180af_120_0.png)


    Of course, if you don''t want the rover to follow you onto the putting green,
    just tap **Pause**. You can also click on the points on the map to send the rover
    off!


    Pretty cool, huh? But what if there''s a tree between you and your rover? You
    don''t want it hitting trees and boulders while it''s trying to get to you, right?
    Enter collision avoidance!


    # Using LIDAR to avoid obstacles


    Would you like to go for a walk on a golf course blindfolded? No? Me neither,
    and it''s probably not good to just set a rover to run around blind either. But
    vision and object recognition takes a lot more computing power than we''re budgeted
    for on this machine. So, what''s the next best thing to vision? SONAR or LIDAR.
    Unfortunately, SONAR (just like a bat finds insects using sound waves to calculate
    the distance to obstacles) is considered *passé* for Pixhawk, and thus the implementation
    is quite *wonky*. There are I2C sonar devices, but they don''t work very well
    (if at all) with Pixhawk 2.1 and the latest Ardupilot firmware. So, we''re going
    to use LIDAR instead. LIDAR rangefinders use light waves (instead of sound) to
    calculate the distance to objects.'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# # LIDAR 101


    LIDAR simply uses a light wave to send out, bounce off objects, and then looks
    for it to return. Since light travels at 299,792,458 m/s, all the LIDAR module
    has to do is measure the time it takes to return a light pulse back to the module.
    Bam! You can sense if there is an object and how far away it is. The following
    figure illustrates this:


    ![](img/504adb30bdfce87f38258e08f11180af_121_0.png)


    There are several different frequency, strength, and spread patterns for LIDAR.
    You may notice that we''re planning on putting our LIDAR module on the top of
    the front fender. This is a perfect spot (as we''ll be able to sense any objects
    too big for the front wheel to roll over! Let''s talk about different aspects
    of LIDAR:


    +   - **Rate:** This is how many times a second (also called Hz) a light pulse
    is generated and looked for. The unit we''re using (Teraranger One) samples at
    a rate of 1000 Hz (1000 times a second). Fast rates are good, but if you''re sensing
    for long-range contact, a longer time may be necessary (to avoid signals coming
    back at the same time, or even after the next signal is sent). Our 1000 Hz rate
    is fine though as our module has a range of 14 meters.

    +   - **Range:** How far away the LIDAR will start detecting objects. Our sensor
    is rated for 14 meters. Considering our rover will be moving at a walking pace
    that''s far more than enough range.

    +   - **Resolution:** This parameter has to do with accuracy. The EZ4 we''re using
    has a resolution of 0.5 cm. This means that it can tell the difference between
    5.105 metres away from an object and 5.11 metres away from an object.

    +   - **Width:** The width of the beam is also important. Our LIDAR module has
    a 3° wide beam. It should be effective enough to keep our rover out of too much
    trouble.'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# Making LIDAR work


    Different LIDAR modules have different pin-outs (wiring scheme to the Pixhawk
    plug). Before you purchase a LIDAR module, you should check their compatibility
    on the Ardupilot website (http://ardupilot.org/rover/docs/common-rangefinder-landingpage.html).
    The wiring pin-outs and list of compatible sensors can be found there, as well
    as where to plug them in.


    # Mounting the module


    The first step is deciding how you''re going to mount your LIDAR. It should be
    pointed parallel to the ground (not up or down). If you are using a single sensor
    (as we are in this example), it should also be pointed straight ahead. If you''re
    using several sensors, you want to place them in a way that they cover the whole
    area you wish the rover to see, but overlapping is not entirely necessary. The
    following diagram shows how we went about designing our sonar mounting option
    (we replaced the fender):


    ![](img/504adb30bdfce87f38258e08f11180af_122_0.png)


    You can see that the diagram shows that the ground will overlap the pattern, so
    large rocks, roots, and fallen branches will be sensed. If we want to block some
    of the ground (so we can regulate just how big an obstacle will be noticed), all
    we have to do is slide the sensor back so that the fender blocks some of the ground.
    We doubt we''ll need that though. Pixhawk has the ability to distinguish between
    the fender and objects further away (with a little tweaking).


    # Configuring LIDAR with Mission Planner


    First, we need to tell Pixhawk that there is a rangefinder module before we start
    configuring it. So we plug Pixhawk into our computer (via USB), and initiate the
    connection from within Mission Planner.'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'In the **Initial Setup** section, you''ll find **Optional Hardware**, and under
    that there will be **Range Finder**. In this section, you should choose the appropriate
    model of rangefinder you are using as shown in the following figure:


    ![](img/504adb30bdfce87f38258e08f11180af_123_0.png)


    Newer versions of the Ardurover firmware have the Teraranger One in this dropdown
    menu. But if you''re using an older version, you may need to set it in the **Full
    Parameter List**. This is done by opening Config/Tuning and selecting **Full Parameter
    List** from the left-hand side of the screen. The following is a list of the parameters,
    as well as their settings for the Teraranger One:


    +   - **RNGFND_MAX_CM**: 1400 (14 m). This is the maximum range of the rangefinder
    in centimeters.

    +   - **RNGFND_MIN_CM**: 20 (20 cm). This is the closest that the rangefinder
    will read objects.

    +   - **RNGFND_TYPE**: 4. A numerical value that indicates this is an I2C LIDAR
    rangefinder that is a Teraranger One.'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'Now, let''s take a look at all of the parameters we can use to adjust the sonar
    rangefinder with Pixhawk:


    ![](img/504adb30bdfce87f38258e08f11180af_124_0.png)'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'A lot of parameters, right? You got to love Mission Planner. There''s a really
    good description beneath each option. But let''s go ahead and explain these anyway:


    +   - **RNGFND_DEBOUNCE**: These are a number of returned pings that an object
    needs to send back in order to be registered by Pixhawk. Why would you need this?
    Wider and longer range rangefinders can also generate more noise (or false pings).
    So, to make sure an object is really there you may need to increase this number
    to reduce false readings. But there''s a catch—increasing this number also means
    it takes more time to register an object. This means that if you have a fast-moving
    drone you may not avoid the obstacle in time. Our LIDAR is very clear, so we''ll
    leave this at the default of 2. This means that an object needs to return two
    consecutive pings to be registered by Pixhawk.

    +   - **RNGFND_FUNCTION**: To understand this, you need to know that rangefinders
    return the distance to an object with a voltage ping, not a data ping. The rangefinder
    doesn''t say, "Hey... it''s 5 meters away." Instead, the rangefinder raises or
    lowers voltage sent back based on how strong a ping it receives. It''s up to Pixhawk
    to interpret this. This setting determines how Pixhawk interprets voltage sent
    to it from a rangefinder.

    +   - **RNGFND_GRNDCLEAR**: This function is mostly useful for planes and multicopters
    with downward-facing sonar. It indicates how far away the rangefinder is from
    the ground when an aircraft lands (the ground clearance of the module).

    +   - **RNGFND_PIN**: This one may be a little confusing. Simply put, this is
    in reference to where voltage will be returned to the Pixhawk. You can leave this
    alone for the LIDAR we''re using.


    With a Teraranger, you shouldn''t really need to play with any of these settings.
    One of the major selling points of the Teraranger is that it comes precalibrated.
    The one setting you''re going to probably need to tune is the **RNGFND_DEBOUNCE**
    parameter. Seeing as the LIDAR module is so close to the ground, and that our
    rover is going to move at just about walking speed, we should set this up at 10.
    This means the module needs to receive 10 pings from an object before it recognizes
    that there is an object in its path. This will keep the noise from sticks, grass,
    and other objects down.'
  merge: -1
  img_proc: true
- pgno: 126
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 127
  md: '# 5


    # Introduction to UAVs


    UAVs are significantly different from rovers. They aren''t tethered to the ground,
    have a greater range (generally), and are far more dangerous to work with. Sounds
    exciting, right? In this chapter, we''ll cover the complexities of designing an
    aerial drone. We''ll talk about airframes, weight, flight time, and propulsion.
    Let''s talk a bit about safety first, so we can make things a bit less exciting,
    okay?


    We''ll be covering the following topics:


    +   - Safety concerns

    +   - Propellers - flying cuisinarts!

    +   - Designing for air and ground

    +   - Learning some physics

    +   - Designing a multicopter airframe

    +   - Designing a fixed wing-airplane)


    # Safety concerns


    Before even considering designing an aerial drone, you first need to figure out
    a testing ground. As an example, I''ll show you what I use, but before we get
    into that, let''s talk about the requirements you should look for:


    +   1. **Authorized for RC air traffic**: An **Academy of Model Aeronautics (AMA-
    http://www.modelaircraft.org/)** authorized flying field is a good place to start
    with. You know that RC aircraft are okay in the area if there is such a flying
    field. If there isn''t one in your area, the next place to look is at FAA charts.
    You can find current online charts at SkyVector (https://skyvector.com/). These
    charts will show all restricted airspace. Anything unrestricted is okay to fly
    RC aircraft.'
  merge: -1
  img_proc: true
- pgno: 128
  md: '+   2. **Remote**: Just because an area allows RC aircraft does not mean it''s
    safe to test a new aircraft (especially an autonomous one). You''ll need to make
    sure that there aren''t any major buildings, homes, or pedestrians in the area
    that could get damaged (or even killed) if it crashes or decides to fly away.
    With the instructions we give you in the following chapters, everything should
    work. But unfortunately, we don''t live in the world of what should be.

    +   3. **You are authorized to be there**: Don''t go trespassing on someone''s
    ranch to test out your aircraft. At best, you could get in some legal trouble.
    At worst (in some places) you may even get shot. It''s always good to ask for
    permission from the owner if you''re going onto private property.


    With these requirements in mind, the following Google Maps images show an example
    of a bad flying field (left) versus a good flying field (right). The one on the
    left is A-Main Hobbies'' flying field in Chico, CA-great for recreational flying;
    completely wrong for prototyping. The one on the right is Dick Scobee Airfield
    in George Bush Park in Houston, TX-in the middle of a giant park. This is not
    perfect (because there is a road running through it), but definitely doable:


    ![](img/504adb30bdfce87f38258e08f11180af_128_0.png)


    The one on the right is where I generally fly nowadays (since moving out to Texas).
    The one on the left is where I flew (already vetted aircraft) when I lived in
    California. For testing, I had to drive several hours to a remote location.'
