- pgno: 228
  md: '![](img/504adb30bdfce87f38258e08f11180af_228_0.png)


    So, our idea is to go through the hull, and attach the spars directly onto the
    wood (replaced by carbon fiber) plate. We''re going to need some hardware:


    # Creating our shopping list


    Figuring budgets is essential when prototyping. You may be making one for a client,
    investors, or we''re pretty sure your significant other would be interested in
    how much it will cost. So, it''s essential before actually creating your final
    design to figure out what parts you''ll (most likely) need.


    First off, a Skywalker EVE-2000 is $285 (USD) via fpvmodel.com. It''s a PNP (plug
    and play) version (so it comes with all servos, motors, and propellers), so all
    you need to do is plug in your Pixhawk and peripherals, then fly.


    So, a Pixhawk 2.1 ($215), pitot tube ($70), and rangefinder for landing ($159)
    bring our running total up to $729. We''re going to go a different route for GPS.'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'Because (generally) we want mapping data to be very accurate, we''ll use a
    GPS system that is augmented by **Radio Telemetry Kinetics** technology (**RTK**).
    RTK uses a stationary GPS station on the ground and uses relation data based on
    the transmissions to the air system to allow the air system to get a much more
    accurate approximation of its actual coordinates. Where GPS has an accuracy of
    around a 6-foot (2-meter) diameter, RTK is centimeter accurate. That''s pretty
    wicked-accurate. Here''s the one we''d use to keep our budget and weight down:


    ![](img/504adb30bdfce87f38258e08f11180af_229_0.png)


    With a price tag of $650, this brings our running total to $1,379.


    With all of the variables of a multicopter, we would stop here, get it built and
    flight tested and tuned, and then start implementing the multicopter. But we''ll
    get into the testing process in a bit.


    Let''s take the multicopter from the motors back to the airframe to make sure
    it can lift everything.'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'Many motor mounts are a bit recessed (meaning that the spar tube intersects
    with the plane of the motor). We want ones that are flush so that if we need to
    add bigger motors during testing we won’t have to redesign the multicopter airframe.
    So, we found these:


    ![](img/504adb30bdfce87f38258e08f11180af_230_0.png)


    Four of these (costing ~$63) brings our total up to $1,442. They fit 25 mm carbon
    fiber tubes. But we’ll have to wait on deciding about those because we need to
    know how big the propellers on the multicopter will be. We need to make sure they’ll
    clear the airplane propellers.


    Before deciding on propellers, we need to figure out the motors. Not every motor
    can drive every propeller. In the 6S current class, 480kv (480 rpm per volt) is
    a pretty safe choice. With larger props, the kv rating goes down. And with the
    ones we chose (in the following image), each will generate 2,000 grams of thrust
    when equipped with a 13" propeller with a 6.5" twist—commonly called a 13 x 6.5:


    ![](img/504adb30bdfce87f38258e08f11180af_230_1.png)'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'At around $120 (4 x $30), that brings our running total to $1,562. Now we look
    at props. We don''t want folding props on a hybrid. They may fold up in the wrong
    way during flight, and not unfold properly when switching to multicopter mode.
    So, a fixed, carbon fiber prop is what we''re after:


    ![](img/504adb30bdfce87f38258e08f11180af_231_0.png)


    Add another $28, and we''re up to $1,590. And with a total thrust of 8,000 g,
    that will be plenty to lift our airplane off the ground vertically.


    The motors draw ~25 A under load with those rotors, but that is sustained. Peak
    could shoot as high as 35. We need ESCs that can handle beyond that. If we go
    with 40-A ESCs, we can expect to pay around $25 each (but much higher for some
    brands). With that in mind, at $100 for four of them, we''re now up to $1,690.


    OK, now that we know we''re using 13.5" (diameter) props, we know that the reach
    of those props is 6.75". We want some leeway, so we''ll calculate the reach with
    clearance at 9".


    Enter high school geometry, and the all-hated words Pythagorean Theorem. See?
    Your teachers were right! It does have uses in the real world!


    We''ll figure that the fuselage is ~ 9" wide, and that means we need an additional
    4.5" from the center line to figure the x-axis (along the wing). We''ll also figure
    that the prop and motor housing extend 2" from the edge of the wing on the y-axis
    of our triangle (going fore). If we want 9" clearance, that means (9+4.5)²+(9+2)²=
    (theLength)². Our carbon spars need to be at least 17.42" long. That''s about
    442.5 mm. Let''s round up to 500 mm (because we can always cut it shorter, but
    we can''t lengthen it). We think these 20 mm (inner diameter) x 25 mm (outer diameter)
    x 500 mm (length) carbon fiber rods fit the bill:'
  merge: -1
  img_proc: true
- pgno: 232
  md: '![](img/504adb30bdfce87f38258e08f11180af_232_0.png)


    Two of these (as it comes with two spars per order) brings our running total up
    to $1,718.


    And finally, we get a carbon fiber plate 1/8" thick, 24" x 24" at $203 (from DragonPlate.com),
    and some mounting rings (four packages) at about $20 (shown in the following image).
    That brings our grand total to $1,941. OK, so that''s our build cost. But is that
    what it will really cost? No. We have to build in incidentals (such as glue and
    the like), and the cost of tuning (in crashes). So we''re going to estimate $2,500
    final cost of the aircraft with no camera (to build, not what we would charge
    a client after all, which speaks nothing of your labour).


    ![](img/504adb30bdfce87f38258e08f11180af_232_1.png)


    OK...so now that we know what parts we will be using, how do we plan to implement
    them?'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# The final plan


    It''s very important with a complex build like this to do more than just a sketch
    for how everything will lay out. Too much money is on the line to leave it to
