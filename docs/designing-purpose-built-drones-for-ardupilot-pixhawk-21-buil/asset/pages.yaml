- pgno: 73
  md: 'After clicking on Next, the wizard will have you set up any sonar devices (as
    shown in the following screenshot):


    ![](img/504adb30bdfce87f38258e08f11180af_73_0.png)


    We''re not using sonar for this rover. However, we may use it in a much later
    chapter. So we just left the Sonar Model field at None.


    On to the control configuration. Here is where we can bind the receiver to our
    control transmitter (a Spektrum DX8 in this case) and calibrate the controls to
    work properly.


    The following screenshot shows the screens associated with this process:


    ![](img/504adb30bdfce87f38258e08f11180af_73_1.png)'
