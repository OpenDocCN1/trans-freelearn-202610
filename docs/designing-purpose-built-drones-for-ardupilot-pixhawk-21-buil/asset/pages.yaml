- pgno: 153
  md: 'The F550 with E300 propulsion system we bought are shown in the following screenshot:


    ![](img/504adb30bdfce87f38258e08f11180af_153_0.png)


    The Flame Wheel airframe, motors, ESCs, and props weigh about 2.9 lbs (1,315.5
    grams). That brings our total weight up to 1,897.1 grams (well below our maximum
    takeoff weight of 2,400 grams). This means we have about 502.9 g to spend on batteries,
    and Pixhawk.


    # Batteries


    We want 4S batteries. We need the power. Unfortunately, there''s a weight problem
    in that the battery weight is increased by 25% over a 3S. (The s is how many cells
    the battery holds.)


    We need to leave 150 g to 200 g for our Pixhawk + accessories (GPS, and so on).
    So we have 300 g to 350 g to spend on batteries. Unfortunately, that greatly limits
    our mAh (milliamp hour) rating. Basically, that rating is how many milliamps the
    battery can expend in one hour.'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'The bigger the number, the longer your potential flight time. Theoretically,
    in reality, the more mAh you have, the heavier your battery, and the more that
    affects your overall flight time. It''s the law of diminishing returns. For example,
    you won''t see twice the flight time from a 6,000 mAh battery as you would from
    a 3,000 mAh battery. It would be more like (not actual just for the purposes of
    an example) 15% (if you could even get the aircraft off the ground).


    We found these batteries right in the sweet spot of 328 g:


    ![](img/504adb30bdfce87f38258e08f11180af_154_0.png)


    +   - HRB Brand Lithium Polymer (LiPo) Battery

    +   - 1 year warranty and friendly customer service.

    +   - Application:RC airplane, helicopter, car, truck, boat, drone, etc.(Only
    if the voltage, dimension and the plug match, then it will fit).

    +   - Notice: Don''t over charge more than 4.2V and dont over discharge below
    3.7V


    That brings our monetary budget to $622.60 (so far) + $66.98 (two batteries) +
    $310 (Flame Wheel airframe) for a total of $1,000.58. Really, that''s pretty inexpensive
    for a proof of concept drone.


    Now, we need to run some calculations to see if this thing will even fly.'
  merge: -1
