- pgno: 49
  md: '![](img/504adb30bdfce87f38258e08f11180af_49_0.png)


    It''s always a good idea to do a test placement of your components before mounting
    them. In this case, we can see that where we originally thought we could put our
    Pixhawk is a terrible location.


    The rear of the Pixhawk overlaps the battery compartment. This means when we go
    to put a battery in the vehicle to drive it, it won''t fit. Also, the structural
    support for the front suspension overlaps with several of our Pixhawk plugs. Finally,
    our Pixhawk would be leaning forward. If the Pixhawk is not level, it may not
    function properly (and absolutely would not function properly if this was an air
    vehicle).'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'You may wonder, "Why don''t we just put it in sideways?" On the top of the
    Pixhawk, you will notice a white arrowhead on the cube. This indicates the forward
    direction of the Pixhawk. A deviation in placing this arrow facing forward will
    result in incorrect compass readings, and an inability to drive the rover properly
    (it may think it''s pointing North, when in fact it''s pointing East).


    Placement number two is more optimal in some ways, but has its disadvantages too.
    Let''s take a look at the following image:


    ![](img/504adb30bdfce87f38258e08f11180af_50_0.png)


    Placing the Pixhawk on the port side (on the left side of the vehicle in this
    book; we will be using starboard and port references to eliminate confusion),
    it can remain level and unobstructed. However, as shown in the preceding image,
    we''ll need to construct a platform for this hollowed-out area of the chassis.
    Let''s look at it from the other side:'
  merge: -1
  img_proc: true
- pgno: 51
  md: '![](img/504adb30bdfce87f38258e08f11180af_51_0.png)


    There is a definite overhang at the front port corner of the Pixhawk. This means
    that in the case of a collision or roll, the Pixhawk may sustain severe damage
    (especially at 70+ mph).


    So, we''re going to have to construct a platform for the Pixhawk that rests inside
    the chassis cradle and protects that front corner and the entire port side of
    the Pixhawk before we start connecting anything.


    # 3D modeling, printing, and silicone molding


    One of the best materials to construct a mounting platform for a Pixhawk from
    is Gel-10 silicone. It''s the same stuff they use to make skin-like objects for
    masks, detached limbs for visual effects in movies, and, well, many other skin-like
    products. It''s flexible, soft, and easily moulded. You could also make platforms
    from soft foam if you don''t have access to these tools. We''re not actually going
    to make this particular platform from silicone though. Why? Because the tray is
    too deep. The silicone would be too tall, and it would bounce around like gelatine.
    We''re going to use a 3D-printed part. However, so that you can learn the process
    of mould-making, we''ll make one out of silicone. The mould will be useful still,
    because if we crash the rover and destroy the mount, who wants to wait 3 hours
    for another print out? We could just use our mould and pour some two-part plastic
    into it. Let''s give you a quick primer in making custom parts.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# Measure five times, print once


    Accuracy in your measurements is key. I use a calliper (rather than a simple ruler)
    to get the most accurate possible measurements (as shown in the following image).
    I also use metric (as the increments are much finer than English):


    ![](img/504adb30bdfce87f38258e08f11180af_52_0.png)


    # Model it in 3D


    I used Lightwave 3D (an animation and modeling tool for visual effects) in the
    following image to create my prototype part. However, you can use Blender (free),
    Autocad, or any other modeling tool to create your virtual part for printing:'
  merge: -1
  img_proc: true
- pgno: 53
  md: '![](img/504adb30bdfce87f38258e08f11180af_53_0.png)


    It''s important to note that there are many ways to make your master for your
    mould. Clay modeling, wood carving, and even hot glue molding are among these
    methods. I prefer CAD and 3D printing as it''s much more accurate, with a much
    more finished look.


    Once it''s done, it can be exported for 3D printing.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Print it in 3D


    Once you''ve got your 3D model, you can export it in various formats (depending
    on your print software). 3D printing software (also called *slicing*) essentially
    slices the object into all the layers that a printer uses to create a 3D object
    in the real world. It will also help you by placing supports (shown in the following
    diagram) under any surfaces that may droop. These supports are then removed by
    you after the print has completed:


    ![](img/504adb30bdfce87f38258e08f11180af_54_0.png)'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'You can see the completed object in the following image. Hey, the color of
    filament I had loaded in my printer happened to be pink. No jokes please:


    ![](img/504adb30bdfce87f38258e08f11180af_55_0.png)


    At this point, you may be wondering, "Why bother making a mould?" True, we could
    use this plastic **Polylactic Acid (PLA)** part for the platform as is. However,
    it''s hard and brittle plastic. Any collisions may result in it shattering (resulting
    in having to re-print). So making a mould for replacement parts is highly advisable.
    It can easily be recast from the mould in a matter of 30 minutes (rather than
    the 3-hour print time). Finally, it allows you to play with different materials
    and try softer and harder grades of plastic, or resins, to get to just the right
    flexibility and dampening properties (if need be). Molding is (usually) a much
    better way to go than just straight 3D printing.'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'Before we make the mould, we need to remove the support structures and test-fit
    the part. There may be some **Dremmeling** (using a rotary tool to cut away and
    reshape the print to get it to fit just right) involved, so we want to make sure
    it fits perfectly before making a mould. In the following image, you can see the
    final fit-test (with the Pixhawk sitting in the cradle):


    ![](img/504adb30bdfce87f38258e08f11180af_56_0.png)


    # Preparing for molding


    Since we had to Dremel away some plastic, we end up with some holes in our part.
    We don''t want this to affect our mould, and we''d like nice smooth parts. See,
    3D prints are not solid. They are hollow with geometric shapes within them. Most
    commonly, they are honeycombed internally. So Dremmeling exposes these honeycombs,
    and they need to be filled. One quick way of filling in the holes is with hot
    glue. You must be careful though. Hot glue can soften your print and even melt
    it, so you have to work quickly and in small spurts. Burying your part in hot
    glue will destroy it. You can see the process of filling in the gaps of the object
    using hot glue in the following image:'
  merge: -1
  img_proc: true
- pgno: 57
  md: '![](img/504adb30bdfce87f38258e08f11180af_57_0.png)


    Now, we need to make a mould container. Simple foam-core boards and some hot glue
    do the trick to create a box around our object, as shown in the following image.
    We hot-glue our part at the bottom of the mould:


    ![](img/504adb30bdfce87f38258e08f11180af_57_1.png)'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# Pouring the mould


    Now, we mix up our silicone. For the mould itself, we''re using a low-viscosity
    silicone that mixes at a 10-1 ratio. It''s much firmer than Gel-10 and has much
    more resilience. It can even handle up to 500 degrees Farenheit temperatures (in
    case we feel like making some items out of metal). If you want a mould to last,
    this is just the kind of material to use.


    Once the silicone is mixed, it''s a good idea to put your mix into a vacuum chamber.
    If you don''t have access to one, it''s okay. But a vacuum chamber helps release
    any air bubbles in the silicone you just mixed. In the following image, you can
    see how the silicone froths up. Once a majority of the bubbles have popped, you
    can release the vacuum and take your silicone out. Be careful though. If your
    mixing containers are too full, the froth can boil over:


    ![](img/504adb30bdfce87f38258e08f11180af_58_0.png)


    While you''re waiting for the bubbles to pop, you can spray some mould-release
    spray into the mould box with the part inside. Be very liberal with the spray.
    Make sure everything is glistening. This release spray is an oily material that
    keeps the silicone from adhering to the box and original part. Don''t wait too
    long though. Some silicones cure very quickly (Gel-10, for instance, completely
    solidifies in under 10 minutes).


    Now, you can pour your silicone into the mould. Tilt the box around to different
    angles, and even tap on it a bit to shake any air bubbles loose. We need the silicone
    to get to every area of our part. Pour in enough to completely cover your part,
    with enough over the top to keep it from tearing when removing parts. You can
    see the poured mould in the following image. Notice that we added a couple of
    rubber bands to keep the sides from splitting during the upcoming steps:'
  merge: -1
  img_proc: true
- pgno: 59
  md: '![](img/504adb30bdfce87f38258e08f11180af_59_0.png)


    Also notice that we left plenty of room at the top of the mould. Why? Because
    we''re going back to the vacuum chamber to make sure we have no air bubbles around
    the edges of our part in the silicone. In the following image, you can see how
    far up the silicone froths. We don''t want to make a huge mess:


    ![](img/504adb30bdfce87f38258e08f11180af_59_1.png)'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'Granted, it''s a bit difficult to see past the residue on the clear lid. However,
    if you look close, you can see that the silicone froth has come up all the way
    to the top of the mould box. After most of the bubbles have popped, we transfer
    the mould to the pressure chamber (as shown in the following image):


    ![](img/504adb30bdfce87f38258e08f11180af_60_0.png)


    Again, these chambers are not required. However, it does make for better moulds.
    You may wonder, "Why vacuum air out, and then put it back in?" Well, we''re not
    injecting air back into the mould. By increasing air pressure around the mould,
    we''re forcing any remaining air bubbles within the silicone to shrink to their
    smallest size possible. We''re also forcing silicone into all the nooks and crannies
    of the part. As this particular silicone sets in 30 minutes, we wait at least
    that long before removing the mould from the pressure tank. We increase the pressure
    to about 40 PSI, and let it sit.


    Once the silicone is set (we test by checking the leftovers in our mixing containers),
    we remove it from the pressure tank, and begin the demolding and curing process.


    # Demolding and curing


    When taking a part out of a mould, you have to be very firm but extremely patient.
    You don''t want to pull so hard on a part that you break it (or tear the mould),
    and you don''t want to work so soft that nothing gets done. Once the master part
    is removed, you have a little factory for creating more parts. Just mix some plastic,
    spray some mould release, and put it in your chambers the same way as before.'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'The final step before you store the mould is making sure it lasts. Silicone
    cures under UV light (most silicones at least). You can always buy some UV lights
    and make your own curing chamber. Mine is a simple ice chest with a white liner,
    and a string of LED UV lights. Letting it sit in the box overnight should be good
    enough (as shown in the following image):


    ![](img/504adb30bdfce87f38258e08f11180af_61_0.png)


    So, why did we spend so much time on mould making? Because being able to make
    your own parts is crucial in drone design. These are electronic and mechanical
    beasts. You must be able to mount your sensors securely, and you may even need
    to make custom parts for other purposes (as we''ll see in Chapter 3, *A Drone
    for Hunters - Autonomous Duck Decoy*). Why not get it out of the way as soon as
    possible?


    # Hooking up your Pixhawk


    Now that we have somewhere to put our Pixhawk, we can go over how to attach it
    and program it for a basic rover. The Pixhawk comes with several strips of ¼”–thick
    foam tape. This stuff is great. It absorbs vibrations and shocks to the Pixhawk
    that could potentially throw off sensor readings. Before using it though, make
    sure you clean off your part. Mould-release spray is very oily stuff, and is meant
    to keep things from sticking together. Simple liquid dishwashing soap does the
    trick perfectly. I like Dawn, as it cuts grease especially well and is easy to
    rinse off.'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'We can just hot glue our mount into the frame of the rover, and then foam tape
    the Pixhawk in. Notice that the USB port is still above the side guard to allow
    access for programming, as shown in the following image:


    ![](img/504adb30bdfce87f38258e08f11180af_62_0.png)


    Our Pixhawk is level, secure, protected, and pink. The first component we''re
    going to hook up will be the GPS.


    # Global Positioning System (GPS)


    Although we can hook up two GPS antennas for more accuracy, as the process is
    the same for both, we''re only going to use one. Besides, we''re a bit pressed
    for space on this rover.


    The first thing you''ll notice is with most GPS antennas, the plugs do not match.
    In fact, they don''t on most components you''ll buy for Pixhawk 2.1. The powers
    that be have elected to change the plug configuration to something of an entirely
    different shape. Although these plugs are far superior to previous versions (they
    lock in place and can obviously only fit in one way); it means that changing plug
    ends is needed.'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'Luckily, the Pixhawk 2.1 comes with patch-style plugs (male at both ends).
    One end plugs into the new plugs, while the other goes to the older version. We
    need to remove each wire from the plugs (on both the older version end, and on
    the end from our component) one at a time and solder them together. Matching the
    wires is a matter of placing them end to end, with one plug upside down and the
    other right side up, as shown in the following image:


    ![](img/504adb30bdfce87f38258e08f11180af_63_0.png)


    You can''t rely on the color of the wires. Notice that the one on the right is
    rainbow colored, while the one on the left is all black with one red wire. You
    must have one plug flipped to match them up. Notice how the lighter plug (top-right)
    has little silver dots along the top (actually indents exposing the pins), while
    the darker plug (lower left) is completely flat on top. This is how to match them
    up to make sure you attach the wires properly. Doing it wrong can damage your
    component and/or the Pixhawk.


    Removing the wires from the plug is a simple matter of using something sharp to
    push down on that indent (which exposes the pin), and gently pulling the wire
    out of the plug as shown in the following image:


    ![](img/504adb30bdfce87f38258e08f11180af_63_1.png)


    As each pin is removed from each side, solder them together one at a time. Doing
    all of them at once can and will lead to confusion.'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'Wrap each solder with either heat-shrink or electrical tape, and then wrap
    the whole bundle with more tape (as shown in the following image):


    ![](img/504adb30bdfce87f38258e08f11180af_64_0.png)


    Now, where shall we place the GPS? Much like the main Pixhawk, GPS modules usually
    contain a compass. Thus, you should look for the arrow on top. This should always
    point forward, regardless of where the cable is attached. We decided to put our
    GPS up front (where we were originally thinking the Pixhawk could go). This keeps
    it well away from the electromagnetic interference that a motor can produce. It
    should be easy to keep it clear up here on the nose of the vehicle (as shown in
    the following image):


    ![](img/504adb30bdfce87f38258e08f11180af_64_1.png)


    You can also see that the GPS antenna is now plugged into the GPS1 port. Using
    3M automotive body tape to secure components is a great way to do it. It''s very
    strong tape, double sided, and flexible. You can pick it up at any autoparts store.'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'The GPS 1 cable (which comes with the Pixhawk) also has an arm button. This
    button allows you to get everything going without activating any motors or servos.
    Once you''re ready to roll, you just hold down this button for a couple of seconds.
    We''ll get to that in just a bit.


    # Radio telemetry


    Cool word, right? We hear it said by space agencies when talking about spacecraft
    that "telemetry is showing all is nominal." Nominal another great word. Telemetry
    is just data, data from a remote source sent to another point. In this case, telemetry
    would be all the sensor data from your rover (for example, GPS) to your computer
    via a wireless link. Conversely, data can be sent back. This is how we control
    the autonomous functions of the rover. You can think of it as basically a wireless
    USB cable that has a range of great distances (depending on the terrain and interference
    of course). The telemetry module we''re using can actually have a range in terms
    of miles.


    You''ll need to use the same methods to join the telemetry module to our cable
    for the Telem 1 plug as we did with GPS. The main thing to keep in mind with the
    radio telemetry module is to keep it well away from the GPS and control receiver.
    There just happens to be a nice, large, flat spot on the front of the Pixhawk
    mount we made (as shown in the following image):


    ![](img/504adb30bdfce87f38258e08f11180af_65_0.png)'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# RC receiver


    Although we could just control the whole thing with our computer (using the telemetry
    module and a joystick), we prefer a traditional tactile controller. Plus, it''s
    always a good idea to have more than one method of control.


    Pixhawk works with several different types of controller standards (Futaba, Spektrum/JR,
    even a simple receiver with individual outputs for every channel of control).
    We''re going to use the Spektrum standard.


    There is a plug just for Spektrum (satellite receivers) on the top of the Pixhawk.
    There are also plugs for Futaba standards. It works pretty much the same. Luckily,
    the Spektrum and Futaba controllers have a standardized plug, so no soldering
    is necessary. Just plug the receiver into the SPKT port and place the receiver.
    We put ours on the very front of the rover (just in front of the GPS antenna)
    as shown in the following image:


    ![](img/504adb30bdfce87f38258e08f11180af_66_0.png)


    # Connecting the brain to the body


    Now, we need to hook up the Pixhawk to the power, the motor, and the steering.
    If we open the receiver box, we''ll see three servo (white, red, and black) cables.
    One goes to the ESC to control the motor. The other goes to the steering servo.
    There are a plethora of servo connections on the rear of the Pixhawk, as shown
    in the following image:'
  merge: -1
  img_proc: true
- pgno: 67
  md: '![](img/504adb30bdfce87f38258e08f11180af_67_0.png)


    The steering servo (the servo wire leading to the front of the vehicle) connects
    to **Main Out pin 1** vertically, with the wire at the top being black (ground)
    and the white wire going to the bottom. The throttle servo wire connects to **Main
    Out pin 3** in the same way.


    Finally, connect the power lead to power 1 (as also shown in the following image),
    and connect the other end to the power module (as shown in the following image):


    ![](img/504adb30bdfce87f38258e08f11180af_67_1.png)'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'This power module goes inline (between the battery and speed controller) to
    provide power to the Pixhawk''s computer and give power readings (so the Pixhawk
    knows when it''s running low on power).


    This does not provide power to the servos. The servo board must get power from
    a Battery Eliminator Circuit (BEC), a device that eliminates the need for multiple
    batteries by distributing power to the servo board. The ESC on this rover has
    a BEC integrated into it. So, it not only receives signals from the Pixhawk, but
    supplies power to all the servos. If this ESC didn''t have a BEC integrated, one
    would be needed (connected directly to the main battery), and could be plugged
    into any port on the servo board (rear of the Pixhawk). Most ESCs have BECs integrated.
    However, some do not, and it''s important to know what a BEC is.


    Now that everything is hooked up, let''s get started with the software.


    # Programming the Pixhawk for our (basic) rover


    There are two pieces of (free) software that you''ll want. The first is your primary
    Pixhawk software (Mission Planner). The other is QgroundControl. Both are available
    from multiple sources, and a simple Google search will get you both.


    Although we have the radio telemetry unit installed, on our very first startup
    of Pixhawk we''re going to need to directly connect it to a computer via USB.
    Remember that plug on the side of the Pixhawk cube? That''s our computer USB plug.
    It''s best to use a laptop (so you can use it in the field).


    # The wizard


    After connecting the Pixhawk to our computer, start up the Mission Planner software.
    You''ll be confronted with this requestor:'
  merge: -1
  img_proc: true
- pgno: 69
  md: '![](img/504adb30bdfce87f38258e08f11180af_69_0.png)


    Obviously, you''ll want to select Rover. This wizard will do the initial setup
    of your Pixhawk and calibrate it for use.


    Next you simply select how the computer connects to the Pixhawk (as shown in the
    following screenshot):


    ![](img/504adb30bdfce87f38258e08f11180af_69_1.png)'
  merge: -1
