- pgno: 74
  md: 'In the panel on the left, you''ll see a **Continue** button (not the **Next**
    button). That will bring you to the panel on the right. At the lower-right, you''ll
    notice a section called **Spektrum Bind**. Activating the proper binding button
    by selecting the appropriate type of **Spektrum Satellite** will set the receiver
    into bind mode. Then, just follow the instructions in the Spektrum manual for
    binding whichever Spektrum transmitter you are using. For the DX8, the following
    are the instructions:


    +   1. Select a fresh model

    +   2. Turn the transmitter off

    +   3. Hold down the **Bind** button

    +   4. Turn on the transmitter while holding the **Bind** button

    +   5. Wait for the transmitter to confirm it is bound


    After binding the transmitter, just click on the **Calibrate Radio** button and
    follow the instructions. (It will have you move various controls in different
    directions.)


    Next is the **Flight Modes** setting, as shown in the following screenshot:


    ![](img/504adb30bdfce87f38258e08f11180af_74_0.png)'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'Up to seven flight modes can be associated with a switch or dial on your remote.
    If you have a three-position switch on the remote, modes 1, 3, and 5 are the most
    likely ones that would be assigned to these positions. The flight modes are as
    follows:


    +   - **Manual**: This mode involves full manual control of the vehicle. The Pixhawk
    simply forwards all commands directly to the servos and ESCs it is controlling.

    +   - **LEARNING**: This mode has the same controls as the manual mode, but it
    lets you toggle a switch on your controller to teach GPS waypoints to the software
    for use in the Auto mode. Essentially, the rover will repeat your movements.

    +   - **STEERING**: This mode is the same as the Learning mode, but turns on obstacle
    avoidance (if sonar is used), and will steer the rover around obstacles for you.
    This is great for tuning your obstacle avoidance (which we may use in a later
    chapter).

    +   - **HOLD**: This mode stops the rover with all wheels stopped and pointed
    straight ahead.

    +   - **Auto**: This mode involves fully autonomous driving from waypoint to waypoint.
    This waypoint list will be looped and repeated infinitely. If reception is lost,
    the rover will go in to the HOLD mode.

    +   - **RTL**: This stands for Return to Launch and will directly return the rover
    to the spot it was launched from. Upon reaching the launch point, it will go into
    the HOLD mode. If sonar-equipped, it will avoid obstacles along the way.

    +   - **Guided**: This mode utilizes the radio telemetry unit. You can use advanced
    controls (such as telling the throttle to let up if the rover pulls a wheelie),
    use joysticks on the computer, or specify waypoints on the fly. Think of this
    as the Mars Rover setting.'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'On the final screen of the wizard, you should see that everything is green
    except for trying to arm your rover (as shown in the following screenshot):


    ![](img/504adb30bdfce87f38258e08f11180af_76_0.png)


    Do not try to arm your rover at this point. First, perform the following procedure:


    +   1. Make sure all four wheels are off the ground. We used an RC car stand (the
    orange platform in all of the pictures of the rover in this chapter).

    +   2. Make sure your transmitter is on.

    +   3. Connect the power sensor module to the ESC.

    +   4. Connect the battery to the power sensor module.

    +   5. Hold down the ARM button (the now flashing red button attached to the GPS
    cable) for 3 seconds.


    If the red button light stops flashing and goes solid red... congratulations.
    It has successfully armed. If not, or if the button''s light never turned on,
    you may have connected up the wrong wires on the GPS cabling. Check them again.


    The red box will not turn green, but you have registered successful arming in
    every significant way.


    The rest of the screens do not actually allow you to configure anything. They
    simply advise you of what Failsafe options are and give you some links for some
    reading material. Read them. They are very helpful.'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# More calibration...


    No matter how cool everything looks right now, stop! You may be seeing a map and
    some cool readouts. First, we need to calibrate the accelerometers. Click on the
    INITIAL SETUP tab at the top of the Mission Planner software, and you''ll get
    to the following screen:


    ![](img/504adb30bdfce87f38258e08f11180af_77_0.png)


    Along the left of the screen is Accel Calibration (under the Mandatory Hardware
    tab). Click on each of the buttons (Calibrate Accel and Calibrate Level) in the
    interface and follow the onscreen instructions. This calibrates the accelerometers
    so that the Pixhawk knows exactly what the attitude of the craft is. You will
    be required to put the rover in several positions and put it level. We advise
    you to do this under USB power without the battery connected.


    You may need to also calibrate the ESC for your drive wheels. Again, just follow
    the simple onscreen instructions for this step.'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# Testing and driving


    Before we take it out to the field, we''ll want to test the connections. Close
    the Mission Planner software, remove the USB cable, and attach the USB telemetry
    dongle to your computer. With the wheels off the ground, power on your transmitter
    and rover by plugging the battery in, but do not arm the rover.


    After starting the Mission Planner software, you may be asked again to find the
    rover''s com port. In your device manager, the telemetry unit should be visible
    under the Ports tab, this time as a Silicon Labs device.


    Upon successfully finding the telemetry dongle, you''ll see this screen inside
    Mission Planner:


    ![](img/504adb30bdfce87f38258e08f11180af_78_0.png)


    After clicking on the Connect button (top right of the interface), you should
    see your rover at your location. Yep... that''s my house.


    Let''s do some initial tuning and show you how it''s done. Before we actually
    drive the rover, we need to make sure it''s not just going to speed away at 70+
    mph into oblivion.'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'At this point, with the telemetry module communicating with the computer, we
    can do anything we could do with USB. If you go to the Config Tuning tab at the
    top, it lets us set up some limits for the speed of our rover (as shown in the
    following screenshot):


    ![](img/504adb30bdfce87f38258e08f11180af_79_0.png)


    Inside the Standard Params tab on the left, you''ll find Target Cruise Speed and
    Base Throttle Percentage (as we saw earlier). We set our cruise speed at 5 meters
    per second and our throttle percentage at 15%. This way, on autopilot the throttle
    doesn''t go above 15% and the speed doesn''t exceed 5 meters per second-nice and
    slow.


    Drive the rover around a lot before ever attempting an autopilot. We''ll get deeper
    into tuning later. But for a rover, these two speed settings are essential. We
    can gradually increase them later if we wish.


    # Setting waypoints


    We''re going to get much deeper into this in the next chapter. However, setting
    waypoints is as simple as clicking on the map on the main screen of Mission Planner.
    The only thing we really want to say at this point is that it risks everything.
    Your drone may crash, and could even hurt someone. We don''t intend this chapter
    to show you how to create a waypoint drone. This one does not even have collision
    avoidance. However, this chapter was to familiarize you with the methodology of
    creating a rover-style drone, and the basic connections and configuration of Pixhawk
    2.1.


    This drone is waypoint capable though. If you must try it out, do it in a completely
    empty area where no people or property will get hurt.


    For a full explanation of waypoints and autonomous driving, refer to the next
    chapter.'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# Summary


    In this chapter, we learned how to fabricate parts and connect up the older peripherals
    to the brand new Pixhawk 2.1. We got into the configuration wizard, and even touched
    on the telemetry module.


    In the next chapter, we''ll get deeper into all of these things with our first
    purpose-built drone, a duck decoy. This decoy will autonomously troll around a
    pond and attract ducks for hunters. We''ll use everything we learned here and
    get into waypoints and patrolling with rovers.


    So, buckle up... here we go!'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# A Drone for Hunters –

    Autonomous Duck Decoy


    A water rover is really no different than setting up a land rover drone; with
    one serious exception—water + electronics = bad... really bad. So, special attention
    needs to be paid to the waterproofing of your drone. In this regard, some special
    techniques, materials, and mechanics need to be employed to keep water out, keep
    your drone upright, and keep it alive while floating in an environment that completely
    destroys electronics.


    In this chapter, we''ll be wrapping up some of our manufacturing techniques, as
    well as getting a bit more into Pixhawk. But mostly, we''ll show you how similar
    a boat is to a rover. We''ll be covering:


    +   - Coming up with ideas for drones

    +   - Making your ideas marketable

    +   - More on manufacturing and fabrication

    +   - Foresight of design challenges

    +   - The design workflow

    +   - Waterproofing


    Let''s start with, "Why a duck decoy?" After all, doesn''t that seem like a waste
    of Pixhawk? Isn''t Pixhawk used for huge prototype medical drones? Isn''t Pixhawk
    something meant for gazillion-dollar (to make and sell) ideas?'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# # Spawning a marketable deal


    As any business major can tell you, the key to making money on a product is the
    law of supply and demand. The key here is demand. The best ideas—the ideas that
    changed the world and made the inventor a ton of capital—aren''t necessarily the
    ideas that cater to a customer with an uber-budget. The wheel, the mouse trap,
    even the scrub-daddy are multimillion (even billion) dollar ideas that everyone
    can use, most can afford, and solve a basic problem.


    Personally, I don''t hunt, full disclosure. I''ve never been duck hunting. However,
    I have noticed that those I do know (who hunt) have duck decoys—lots of them.
    Different decoys for different types of ducks, and often they come back with fewer
    decoys than they left with.


    Also, hunting is boring. Go out to an area and wait, and wait, and keep waiting
    until eventually some ducks show up. What if you could make the waiting process
    more fun? What if you could drive a duck around on the pond, or even let it drive
    itself and navigate the pond? What if you could show off a new toy to your buddies
    that they don''t have? And most importantly, what if (when you''re done for the
    day) you could have your duck return to you?


    It solves some problems, it has the show-off factor, and it also caters to an
    industry that is spread throughout the country where accessories are essential
    and people spend a boatload (pun intended) on these accessories.


    Best of all, even though you''d be using existing technology, the idea is potentially
    patentable! There are tons of ideas that use existing tech in new ways that have
    patents. So, not only can you make an item that is marketable... it''s an idea
    that you could license and sit back and let money roll in. These are all great
    reasons to make a duck decoy drone.


    As I said, I''m not a hunter. I love aircraft (especially the F-117 stealth fighter).
    So, knowing nothing about ducks (really), nor the hunting thereof, I made my duck
    decoy with a faceted design just to make the prototyping phase more fun. So meet
    the stealth duck (also known as Black Ops McDuck), as shown in the following image:'
  merge: -1
  img_proc: true
- pgno: 83
  md: '![](img/504adb30bdfce87f38258e08f11180af_83_0.png)


    As you can see, it''s 3D printed. But at least it''s not pink, right?


    # Outlining the scope before you design


    Before we actually start putting pencil to paper (or rather mouse to CAD, in this
    case), we need to outline some basic needs and layout of the duck. Let''s start
    with the problems and solutions analysis that we did on the design.


    The following table lists the problems and solutions we worked up, although the
    original table was handwritten, this one is far more legible:


    | Problems we''ll encounter | Solutions |

    |---|---|

    | Water leaking into seams of the model | CA glue seams, and fill with silicone
    sealant. |

    | Water leaking into the location where the propeller shaft meets up with the
    body | Stationary sleeve for shaft filled with grease and sealed (on the outside)
    with silicone. |

    | Water leak on access lid | Silicone sealant o-ring. |

    | In event of water leak, waterproofing Pixhawk | Silicone moulded Pixhawk case?
    (No). |'
  merge: -1
  img_proc: true
- pgno: 84
  md: '| Pixhawk heat from silicone moulded case? | Can''t seal it. Must make body
    as water-tight as possible. Test water-tightness in every stage leading up to
    Pixhawk integration. |

    | GPS reception with internal antennae | Shouldn''t be a problem with a PLA plastic
    body. |

    | Motor EM interference with GPS | Place motor up front and GPS antennae toward
    the back. |

    | Motor heat in a sealed body | Water cooled motor. |

    | ESC heat in a sealed body | Water cooled ESC, or low-voltage ESC / Motor. |

    | Expense of motor, drive shaft, and prop | Kitbash a cheap RC boat. |

    | Balancing motor, ESC, and prop for efficiency | Kitbash a cheap RC boat. |

    | Duck is too large for 3D printer | Print in sections, use CA glue to join, and
    seal with silicone when dry. |

    | Interfacing Pixhawk with cheap RC boat parts | Make sure the boat we buy is
    modular (not integrated ESC or servo into receiver) or at least minimize integrated
    parts so we have to replace as few parts as possible. |

    | What if we want the head to turn with rudder? | Don''t do this on initial prototype.
    But print head as a separate section so it can be adapted later if we want. |

    | PLA plastic print or ABS? | PLA for the body (cheaper). But ABS for motor mount
    (higher melting temperature). |

    | Tipping from waves or turns? | Large ballast section filled with modeling clay.
    |


    We had other problems that we encountered along the way, which were unforeseen.
    We''ll get to these later. But as you can see from the details in our overview
    chart, we tried to minimize these as much as possible. Positive thinking is great.
    But when planning, you have to be your own nay-sayer in order to predict the problems
    you''ll have. Then, you can think positively to come up with solutions.'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'You can also see that we had to compromise on the possibility of a leak destroying
    our Pixhawk. We wanted to create a silicone case for it in order to seal it. We
    thought of creating silicone dummy-plugs. We even thought of sealing the edges
    around the cube section. In the end though, we came to the conclusion that doing
    this on a possibility was outweighed by the certainty of frying our Pixhawk from
    heat. The cube section is actually heated (by design) to allow Pixhawk to operate
    in cold weather. Electronics don''t like heat. And too much heat can even melt
    soldered components and cause shorts. So we decided to focus our waterproofing
    efforts on making very sure that no water can get in before integrating the Pixhawk.


    Next, we sketched up a basic design for BlackOps McDuck (as shown in the following
    figure):


    ![](img/504adb30bdfce87f38258e08f11180af_85_0.png)


    Hard to tell what''s what, right? The sketch isn''t a plan. It''s more like a
    process of just working out how things will go, so that you can see problems as
    you''re thinking about it. A sketch is very quick (5-15 minutes), and lets you
    think about things. Here, you can see that we moved our electronics above the
    water-line (in case of minor leaks). We also worked out where water would come
    in (in the ballast section, front), and be ejected (through the side) of our motor''s
    water cooling. In other words, we now know that we need to carve a channel into
    our clay ballast so that the water intake, and the drive shaft can be well below
    the water line. We also discovered that the rudder needs to be quite tall.'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'Why would the rudder need to be tall? To accommodate the fact that our servo
    is well above the water line. Also, you don''t want the rudder just in the water.
    You want it to be in the path of the propeller''s thrust (so that at low speed
    it can vector the water being pushed and allow for more agility).


    Also, we planned out how the head would turn (on a future version) using a sleeve
    and bearing with a shaft going down to a control rod. This rod would extend to
    the rear of the craft and connect to the same servo driving the rudder (allowing
    the head to turn and face the direction the duck turns).


    Is the sketch hard to read? Yes, for everyone except the person drawing it. That''s
    normal. That''s also why it''s important for the person who will make the design
    to be in on the sketch session (or even to draw the sketch). That''s an important
    thing to know for larger teams. Never do a sketch without the designer around.
    The designer not only needs to know where everything goes, but needs to know why.
    This allows them to adapt the design to overcome problems they may find with the
    sketch (while staying true to the spirit of it).


    Next, we need to order our kitbash boat. We''ll need to know the basic dimensions
    of our hardware before designing the duck. After all everything needs to fit,
    right?


    # Choosing the kitbash boat


    We are mostly looking for something cheap with a water-cooled motor. If we order
    from Amazon, it''s pretty rare that you can take a look inside to see if things
    are modular (not an integrated **electronic speed control (ESC)** or servo). We
    have plenty of ESCs and servos in our workshop so we didn''t care much. But if
    you don''t have a ton of spare parts lying around, you may consider making the
    trip to a local hobby shop to look at the inner workings of a boat before you
    buy. Here''s the boat we picked up (as shown in the following image):'
  merge: -1
  img_proc: true
- pgno: 87
  md: <!-- no content -->
