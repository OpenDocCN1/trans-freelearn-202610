- pgno: 187
  md: '# Summary


    In this chapter, we learned a bit more on the philosophy of prototyping, kitbashing,
    and altering prefab parts for our purposes. We also learned how to configure Pixhawk
    for a multicopter, include a video feed in our laptop display, and use joysticks
    to control a drone. If that wasn''t enough, we also learned how to balance power
    to weight on a multicopter. Now, you can see just what complicated beasts they
    are.


    In the next chapter, we''re going to take on the Holy Grail of dronery: a fixed
    wing drone. In a lot of ways, they''re simpler than multicopters. But in reality
    they''re not.'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# 7


    # The Holy Grail - A Fixed Wing Drone


    Wow for a holy grail, she sure is one ugly pig, right? Well, prototypes just aren''t
    usually pretty. So, why is a fixed wing drone (like the airplane in the following
    image) considered a holy grail?


    ![](img/504adb30bdfce87f38258e08f11180af_188_0.png)


    The answer is pretty simple, actually. Airplanes need to keep moving in order
    to stay airborne. Go too slow, and you stall (a fancy word for fall from the sky
    until you build up speed again except that it''s usually vertical speed, and vertical
    speed is going down).


    With multicopters, tuning them is fairly easy: take it off, hover just **outside
    of ground effect** (OGE), and let it *twitch* around a bit. If it''s too crazy,
    just land it, reset the settings, and repeat. Since an airplane is constantly
    moving tuning can be quite a bit more hazardous to the aircraft.'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'While tuning fixed wings, I''ve had them turn into lawn darts, porpoise like
    dolphins jumping out of the ocean, and (as stated in a previous chapter) blow
    their wings right off. So, it''s important while prototyping to start with an
    airframe that is relatively inexpensive yet stable. It''s also important to choose
    one that offers some protection for your Pixhawk if something does go wrong. That
    makes a foamie airplane a perfect choice. Foam airplanes are very cheap, and are
    basically flying packing material. It''s certainly no guarantee that the Pixhawk
    would survive a crash. But it does improve its chances.


    The following topics will be covered in this chapter:


    +   - Why this particular airplane kit?

    +   - The assembly

    +   - Tuning a fixed wing aircraft with mission planner

    +   - Setting up for tuning

    +   - The tuning process

    +   - Autotune flight


    # Why this particular airplane kit?


    The plane we''re using (as shown in the following image) is a Bixler from Hobby
    King. It''s actually named after one of the two Joshes (Josh Bixler) from the
    popular YouTube channel *Flite Test:*


    ![](img/504adb30bdfce87f38258e08f11180af_189_0.png)'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'As you can see, it''s very inexpensive. Well under $100, and comes with a motor,
    and all the servos necessary to fly it. The dihedral curve in the wing makes it
    uniquely stable for soaring. It also comes with the two halves of the main fuselage
    separated (making wire routing and component placement very easy). Finally, it''s
    a powered glider. This means it''s very efficient, and has the potential to travel
    great distances under minimal power. This is exactly what we''re looking for!


    # The assembly


    Before we get into the parts and specific placement thereof, let''s take a quick
    look at the sketch for this drone:


    ![](img/504adb30bdfce87f38258e08f11180af_190_0.png)


    I know but what can I say? I like to sketch out my ideas over a bottle of wine.


    The peripherals we''re using are the same as all our other drones, with the addition
    of a pitot tube. We talked about pitot tubes before, but as a quick refresher,
    a pitot tube is simply a device that measures the air-speed of your aircraft.
    Think about it—speed is relative. Believe it or not, even when you''re standing
    still, you''re traveling at 113,000 mph. Yes, that''s right... why? Because the
    Earth rotates at 1,000 mph + the Earth around the sun is 67,000 mph, plus the
    solar system''s speed through the universe is 45,000 mph. But on Earth, your speed
    is 0 mph because your speed is measured relative to the ground (Earth).'
  merge: -1
  img_proc: true
- pgno: 191
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 192
  md: '![](img/504adb30bdfce87f38258e08f11180af_192_0.png)


    The first thing you may say is, "wait... there''s only one I2C port, but now you''re
    using your LIDAR (I2C), and a pitot tube (also I2C) whaaaaaat?" Again, I2C, USB,
    CAN, and so on these are all digital protocols for information across multiple
    peripherals and are all capable of using hubs. One of the (many) reasons we lean
    toward I2C with Pixhawk 2.1 is because it comes with an I2C hub. Just like with
    a USB hub on your computer; just plug the I2C hub into your Pixhawk''s I2C port,
    and all other I2C peripherals into the hub.


    Assembling an airplane is a pretty straightforward process. And the airplane itself
    (whatever airframe you go with) will come with instructions. So, we''re not going
    to bore you with that stuff. Let''s get into the placement of the Pixhawk components.


    # Placing the Pixhawk


    You can''t just throw your Pixhawk anywhere inside (or on top of) your plane.
    Why? Because (believe it or not), you don''t want the plane rotating on its axis,
    and the Pixhawk thinking something else is going on. "Huh?" you''re probably asking.
    Your Pixhawk needs to be located as close to (if not directly on) the center of
    gravity (CG) as possible. In an airplane, this is generally at the peak of the
    top-curve of the main wing. Of course, if it''s a faster plane (with swept wings),
    the CG may be further back and you should refer to the airplane''s build instructions.'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'The following image shows how the Pixhawk''s sensors may be affected by placing
    it away from the CG:


    ![](img/504adb30bdfce87f38258e08f11180af_193_0.png)


    So, the last thing you want is Pixhawk thinking it''s doing something that it''s
    not. When the plane noses up (as in this example), and isn''t actually rising
    (for instance, in a landing), if the Pixhawk believes that the plane is rising,
    it may cut power, or dip the nose back down. Ideally, you want Pixhawk knowing
    exactly what the plane is doing and doing as little guess work as possible.


    # Placing the components


    As we''ve said many times, it''s important to keep the GPS receiver well away
    from any Electromagnetic interference (EMI). So, you''ll want to keep it away
    from transmitters (such as telemetry and first-person view (FPV)) and motors.


    And that''s why our sketch was important. We want the GPS fairly close to the
    CG but we want to avoid that rearward-facing motor right at the back of the wing.
    We can''t place it in the nose because that''s where the video transmitter will
    be. So, by erasing and redrawing, we can find the right place, which is on the
    top-side of the right wing, close to the fuselage (as shown in the following image):'
  merge: -1
  img_proc: true
- pgno: 194
  md: '![](img/504adb30bdfce87f38258e08f11180af_194_0.png)


    With the canopy off the airplane, you can also see that the cable for the GPS
    receiver runs through a channel in the foam behind the canopy (so it can fit on
    snugly). One of the beauties of working with foam is that a soldering iron (set
    on high) will melt and vaporize foam. So, you can cut through foam extremely easily
    using just a soldering iron.


    You can also see another difficulty with airplanes cables. For aerodynamic reasons
    (reducing drag), you can''t just bundle your cables and zip-tie them to the outside
    of an airplane (as you could with a multicopter). This makes routing and bundling
    something that needs to be done with care and planning.


    Finally, just under (and forward of) the canopy, you can see the arming switch
    for the Pixhawk. We drilled a hole (with a soldering iron), and placed the switch
    in the hole (with some 3M automotive tape). Now, we can arm the airplane without
    having to do so with the canopy off.'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'Next is the telemetry transmitter/receiver. Just like with the multicopter,
    we''re going to pilot this drone using joysticks on a laptop. So we need the antenna
    to be vertical, and out where it can receive (unobstructed). Seems like the underside
    of the left wing is a great spot (as shown in the following image):


    ![](img/504adb30bdfce87f38258e08f11180af_195_0.png)


    You’ll also notice that we cut a hole in the side of the airframe for access to
    the USB plug on the side of Pixhawk, and another hole to route the wires for the
    telemetry radio.


    The LIDAR module is going to seriously help us with landings. Pixhawk (when properly
    set up) can use a rangefinder during landings to land itself (autonomously), including
    flaring at the end to touch down nice and soft. On a plane, LIDAR is not used
    for collision avoidance. It’s used as an altimeter. For that reason, the best
    place for it is right between the main landing gear (as shown in the following
    image):


    ![](img/504adb30bdfce87f38258e08f11180af_195_1.png)'
  merge: -1
  img_proc: true
- pgno: 196
  md: 'Finally, it''s just a matter of placing the FPV camera. You''ll notice we cut
    a notch in the nose of the airplane (as shown in the following image) using a
    soldering iron, and used 3M automotive tape to fix it into place. The battery
    for the camera will just Velcro to the underside of the nose of the plane:


    ![](img/504adb30bdfce87f38258e08f11180af_196_0.png)


    Ok, so now that all of our Pixhawk components are installed (and we''ve given
    our fixed wing drone a brain), let''s make it smarter through the mission planner
    settings.


    # Tuning a fixed wing aircraft with mission planner


    By now, you''re an expert at installing the right firmware and running through
    the initial set up within mission planner. So, we''re not going to waste your
    time with all that nonsense at this point. Let''s start with setting up the pitot
    tube.'
  merge: -1
  img_proc: true
