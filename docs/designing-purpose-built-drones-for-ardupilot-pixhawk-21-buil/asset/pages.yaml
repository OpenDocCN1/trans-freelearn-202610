- pgno: 209
  md: '# Autopilot tune


    The many uses for autopilot depend on the airplane to fly in a straight line and
    execute turns as tightly as possible. For instance, mapping using a fixed wing
    requires an airplane to fly in rows of straight lines that are fairly close together.
    If a turn is too large, or the plane can''t fly a straight line, there may be
    gaps in the map, and that means a very poor map indeed. Take a turn too tight,
    and you could end up with similar issues, or even blow the wings right off the
    plane (by pulling too many Gs).


    So, the final stage of flight tuning is to make sure the aircraft can fly in a
    straight line and execute (reasonably) tight turns.


    # Setting up the mission


    Before even connecting (via telemetry) to your plane, you should set up a rectangular
    mission (as shown in the following screenshot). It''s important to have long straightaways
    so that you can see the actual ability of the plane to adhere to a straight line:


    ![](img/504adb30bdfce87f38258e08f11180af_209_0.png)'
  merge: -1
