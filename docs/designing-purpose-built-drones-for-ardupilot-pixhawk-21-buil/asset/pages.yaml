- pgno: 202
  md: '+   - **CRUISE:** Control-wise, this mode is rather like FBWB. However, when
    the sticks are released, Pixhawk calculates the current trajectory and sets a
    waypoint 1 km away. It maintains altitude and heading toward that waypoint. You
    must have a GPS fix to activate this mode. You can also configure this mode to
    follow terrain (adjust height to account for mountains/hills automatically).

    +   - **AUTO:** When activated, this mode begins your preplanned waypoints set
    in mission planner. This is fully autonomous flight. However, you can override
    the autonomous flight with stick inputs (which mimics FBWA mode).

    +   - **Return to Launch (RTL):** This is also a great mode for fail-safe operations.
    When activated, this mode autonomously returns the aircraft to the home point
    (where the aircraft was launched from). It will then loiter at an altitude set
    by the `ALT_HOLD_RTL` parameter until further instructions. You must have a GPS
    fix to activate this mode.

    +   - **LOITER:** In this mode, the plane will automatically circle around the
    place where you activated the loiter mode. The radius of the circle is controlled
    by `WP_LOITER_RAD`, but will not exceed the `NAV_ROLL_CD` limits. Additionally,
    it is constrained by the `NAVL1_PERIOD` parameter. This mode is also only available
    with a GPS fix.

    +   - **CIRCLE:** Circle is similar to loiter, but does not rely on a GPS fix.
    For this reason, it will not necessarily stay circling over the same area. If
    winds are in effect, the circle may slowly move downwind. It''s generally used
    as a fail-safe (circle for a period, then RTL). The circle is also quite large
    as the bank angle is 1/3 of the `LIM_ROLL_CD` parameter to make sure that the
    plane can stay stable without a GPS fix.

    +   - **GUIDED:** This is the mode you would use as a click-to-fly mode on a laptop.
    It facilitates clicking on a point on a map without predefining a mission in the
    mission planner. The plane will then fly to the spot on the map that was clicked
    on and loiter there awaiting further instructions. Additionally, if geo-fencing
    is enabled and that fence is breached, the aircraft will automatically enter this
    mode and return to the predefined return point.

    +   - **TAKEOFF:** This is for advanced users only. Do not attempt automatic takeoffs
    with your first plane, nor with any plane until it is sufficiently tuned. Auto
    takeoff is set by a mission script only. The plane will increase throttle to the
    `THR_MAX` parameter, and ascend to a target altitude set by your mission parameters.
    The plane will attempt to maintain the heading it is pointed at before the mode
    is initiated down the runway, and until altitude is reached. If it is a hand-launched
    (or catapult launched) aircraft, the `TKOFF_THR_MINACC` and `TKOFF_THR_MINSPD`
    parameters are used to determine when to throttle-up based on velocity.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '+   - **LAND**: Like **TAKEOFF** mode, this mode is not for the faint of heart
    and can only be set using the mission scripting. When approaching the landing
    point designated by the mission, the plane will slow and descend autonomously.
    Once either a flare altitude (set by `LAND_FLARE_ALT`) or a time to target in
    seconds (set by `LAND_FLARE_SEC`) the plane will flare to a pitch set by `LAND_PITCH_CD`
    (in centidegrees) and hold heading until touchdown. It''s a very tricky process
    to get this mode set up just right.


    As you can see, there are a plethora of flight modes to choose from that will
    fit just about any of your needs. But before you can use most of them, you need
    to be tuned up.


    # Setting flight modes


    For your first few flights, you''re really only concerned with three flight modes-**Manual**,
    **FBWA**, and **AUTOTUNE**. So, we''ve set up those modes on a 3-position selector
    switch as modes 1, 2, and 3 as shown in the following screenshot:


    ![](img/504adb30bdfce87f38258e08f11180af_203_0.png)


    By flipping another switch on the remote, we''ll have access to modes 4, 5, and
    6. But for our first few flights, we won''t even worry about these. Right now
    we just want **Manual**, **FBWA**, and **AUTOTUNE**.'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# Autotune level


    The autotune level (AUTOTUNE_LEVEL) determines how aggressive the final handling
    of your aircraft will be. The higher the number, the more severe the responsiveness
    of the plane. The lower the number, the lazier and more sluggish a plane will
    respond. Numbers above 6 should only be attempted by very experienced pilots as
    they are not very forgiving and require a great deal of finesse while piloting
    the plane. The default setting is 6 (as shown in the following screenshot):


    ![](img/504adb30bdfce87f38258e08f11180af_204_0.png)'
  merge: -1
  img_proc: true
- pgno: 205
  md: '# The tuning process


    Every airframe is different. Sometimes even the same model airframe can have different
    settings from one airplane to the next. So, it''s important to know that any settings
    you see for PIDs are not the settings you should use for your plane. Rather, this
    section is about the process of how to arrive at those PID settings. The first
    step is to make sure your airplane flies right with no Pixhawk input whatsoever.


    # Your maiden flight


    Maidening an aircraft just means taking it into the air for the first time. The
    big difference between maidening a Pixhawk airplane and any other RC aircraft
    is that you should never use the trim controls on your radio.


    Trim controls on the radio are small buttons or sliders near the sticks that allow
    a user to adjust the control surfaces in real time for straight flight by offsetting
    the value (PWMs) of the sticks. The problem is that by offsetting the values of
    the sticks by using trim controls, the Pixhawk will not know when the sticks are
    centered. And thus, several flight modes will not work properly.


    So, what would we do to get the plane to fly straight without trim controls on
    the radio? An arduous task of mechanical trimming by altering the length of the
    push rods that connect the servos to the control surfaces. The following diagram
    shows the two types of push rods and how they are adjusted:


    ![](img/504adb30bdfce87f38258e08f11180af_205_0.png)'
  merge: -1
  img_proc: true
- pgno: 206
  md: '![](img/504adb30bdfce87f38258e08f11180af_206_0.png)


    As you can see, there are essentially two types of push rods. The pinch style
    rod uses a crimped bracket to change the length of the rod. Pinching the pinch
    bracket more shortens it while spreading it will lengthen the rod. The screw style
    rod is much more rigid and will either have clevis heads, or ball joint receptacle
    heads to attach to the control points or servos.


    Before your first flight, all of these rods should be adjusted so that when the
    servos are zeroed (turned on with the sticks centered) all surfaces should be
    even with the shapes of the wing, vertical stabilizer, or horizontal stabilizer.


    During your flight(s), if the plane drifts (yaw, pitch, or roll) you should land,
    then adjust the push rods and try again. It''s a tedious task and very time consuming.
    By the time you have all your control surfaces trimmed out, you should be able
    to center the sticks and the plane should fly straight and level (barring any
    outside forces such as wind or turbulence).


    All in all, it could take several hours to get your control surfaces trimmed.
    Once your plane is trimmed out, you''re ready to move to the next step.


    # AUTOTUNE flight


    This is the first time you''re going to allow Pixhawk to take control of your
    plane. Understand that when you are in any mode other than manual you are no longer
    truly flying the plane. Pixhawk is actively taking control of your plane and graciously
    allowing some of your commands to be forwarded on to the servos. The only way
    to truly take back control of the plane is with MANUAL mode. This is your ultimate
    fail safe. So always be prepared to switch into manual (especially during the
    tuning process).


    # Taking off and getting ready to tune


    AUTOTUNE mode is very much like FBWA mode (in how the plane handles). So, after
    taking off in MANUAL mode, make sure the plane is flying straight and level. Then,
    switch into FBWA mode (and be ready to switch back to manual). If the plane suddenly
    dives, rises, or rolls, switch back to manual and land. This means that your Pixhawk
    was not properly levelled. You''ll want to set the level again in Pixhawk''s mission
    planner.'
  merge: -1
  img_proc: true
- pgno: 207
  md: '# Entering AUTOTUNE


    Once you''re feeling somewhat comfortable in FBWA mode, you''re ready to switch
    to AUTOTUNE. Make sure you are flying on a full battery for auto-tuning. It requires
    a lot of flight to make sure it is as accurate as possible. Here are the main
    points about what happens when you switch into AUTOTUNE:


    +   - Upon activation, Pixhawk will set default values for your PIDs (found on
    the tuning page of mission planner). These values are dependent upon your AUTOTUNE_LEVEL.

    +   - Pixhawk will constantly monitor your pitch and roll rates to see if they
    exceed 80% of your maximum rates set in mission planner. You will use your sticks
    to help Pixhawk learn how your aircraft behaves using this.

    +   - Every 10 seconds, new rates will be saved based on the monitoring of your
    aircraft by Pixhawk. In other words, if your aircraft becomes unstable, you have
    10 seconds to switch to manual and cancel the current rates. It''s kind of like
    an undo feature.

    +   - Starting with the default, Pixhawk rates will make your aircraft seem sluggish.
    But as you progress with AUTOTUNE mode, you''ll notice the handling getting better
    and better. Make sure you have plenty of room, because at first this will mean
    very wide and slow turns.


    # How to fly in AUTOTUNE


    AUTOTUNE is not a subtle process. Anyone watching the airplane will think you
    may be flying under the influence. It''s dependent upon extreme movements on the
    sticks so that Pixhawk knows how to react to extreme circumstances.


    First, you''ll want to tune ailerons, then elevators (roll, then pitch). To do
    this, just move the aileron control full left quickly. This will make the aileron
    move to maximum deflection. Hold it there for a minimum of 2 seconds. Don''t worry,
    the plane will not roll over. It will stop its bank at the maximum bank angle
    we had set before. Then, quickly move the stick to the right and hold it there
    for a minimum of another 2 seconds. After moving both left and right you have
    completed one cycle.


    With each cycle the tuning improves by roughly 5%. The Pixhawk manual states that
    you should do 20 full cycles. However, doing more does improve the tuning. So,
    I suggest a minimum of 30 cycles (but find myself doing 40-50 any time I am doing
    an AUTOTUNE).'
  merge: -1
  img_proc: true
