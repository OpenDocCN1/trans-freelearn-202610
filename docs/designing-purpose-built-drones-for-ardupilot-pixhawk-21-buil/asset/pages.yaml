- pgno: 198
  md: 'Therefore, not implementing a pitot tube on a fixed wing aircraft is not only
    inadvisable it is unsafe, and downright foolish.


    And as you can see, the installation and activation of a pitot tube is extremely
    simple.


    To test it, go to the Flight Data screen in Mission Planner and simply blow at
    the pitot tube. You should see the airspeed go up as shown in the following screenshot:


    ![](img/504adb30bdfce87f38258e08f11180af_198_0.png)


    Of course, it does read in the "ground speed" area (the mission planner team never
    did create a discrete ground speed and air speed readout). But this is, in fact,
    air speed.'
