- pgno: 166
  md: 'This is (admittedly) confusing. But really, what the software is trying to
    ascertain is whether your hexacopter is a Hex-X or Hex+ type frame. I (personally)
    have never seen a Hex-H frame, nor a Hex frame that is spread in the front. But
    maybe they exist somewhere. So, even though it shows only four rotors, we choose
    the x-frame. In the previous screen, we selected a Hexacopter, then we chose the
    x-frame variety. This makes it a Hex-X.


    During the next section, we’ll calibrate the accelerometers so that the Pixhawk
    knows when the aircraft is level versus tilted:


    ![](img/504adb30bdfce87f38258e08f11180af_166_0.png)


    Instead of just clicking on **Next**, this time you''ll want to click on **Start**.
    Upon starting calibration, the software will ask you to set the aircraft level,
    then tilt it 90° on the left, 90° on the right, on the nose, the tail, then upside
    down.'
  merge: -1
