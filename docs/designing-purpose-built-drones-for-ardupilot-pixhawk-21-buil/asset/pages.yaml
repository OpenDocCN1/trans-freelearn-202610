  md: 'The following image shows the boat with the lid-off and all the electronics
    still installed:


    ![](img/504adb30bdfce87f38258e08f11180af_88_0.png)


    And the following image shows all of the parts removed from the boat:


    ![](img/504adb30bdfce87f38258e08f11180af_88_1.png)'
