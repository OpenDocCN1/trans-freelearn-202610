- pgno: 70
  md: 'At this point, you must provide which port the Pixhawk is attached to. The
    Pixhawk essentially emulates a serial port via USB (a COM port). The way to know
    which port is associated with your Pixhawk (on Windows) is to look at the Device
    Manager (as shown in the following screenshot):


    ![](img/504adb30bdfce87f38258e08f11180af_70_0.png)


    Under Ports, just look for PX4 FMU. In this case, you can see that it''s COM9.


    Now that it''s found the Pixhawk, it will verify its version of firmware and update
    it. If this fails, just repeat the steps until it succeeds. You may need to change
    which plug you have the USB jacked into. Sometimes USB hubs and other devices
    can interfere. Again, just keep trying with different combinations until it works.
    It will eventually. In most cases, it works the first time.'
  merge: -1
