- pgno: 214
  md: '![](img/504adb30bdfce87f38258e08f11180af_214_0.png)


    Ok, so it''s go time. Launch the plane again (in **MANUAL** mode). Once it''s
    up to roughly our altitude of the first waypoint, flip the mode into **FBWB**.
    In this closest pilot-controlled mode to full autopilot, fly for a short while.
    This is your last check that you have your other tuning parameters ready. If the
    plane is stable, flip the mode to Auto. This will engage the autopilot, and the
    plane will wait for a moment, and then make its first turn toward the first waypoint.'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'As it moves along its path, you''ll see that the flight path (purple) will
    look something like the following image:


    ![](img/504adb30bdfce87f38258e08f11180af_215_0.png)


    As you can see, the plane is traveling a bit outside the line between waypoints.
    This will always happen with a fixed wing plane due to the nature of the beast.
    However, we do want to get it as close as possible to that line. The way to do
    this is to make the turning radius as tight as possible without making the airplane
    unstable. The first sign of instability is if the airplane oscillates its yaw
    (fishtails).


    You can actually make this adjustment while the plane is in the air. Hand your
    flight control over to another trusted pilot (in case something goes wrong, you
    want them to be able to flip to manual and land the plane), and switch to the
    Basic Tuning screen as shown in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 216
  md: '![](img/504adb30bdfce87f38258e08f11180af_216_0.png)


    If the plane is flying too loose (outside of the path by too much), reduce the
    Period parameter of the L1 Control area by 1. It may be tedious, but you must
    make small increments in this process, or you risk crashing your plane. If it''s
    too tight (fishtailing), increase the number by 1. Keep this process going until
    you get the flight path as tight as possible without fishtailing. Don''t forget,
    every time you change the value to click on the write params button in the interface.


    After this calibration is done, go ahead and land the plane (in MANUAL mode).
    That''s it! Your basic tuning is done. Now, let''s look at something a bit more
    advanced.


    # Auto-landing tuning


    Before attempting an auto-landing, make several flights in autopilot with your
    plane. Make sure that you are completely happy with the way it flies. Landing
    is by far the most difficult part of flying. A poorly tuned plane puts you at
    a huge disadvantage when attempting automatic landing, and nearly guarantees a
    crash.


    During normal autopilot, you can get away with not tuning the Total Energy Control
    System (TECS). If it sounds complicated it is. Basically, this system manages
    the throttle to climb/descent ratios to keep the aircraft capable of maintaining
    a fairly constant airspeed during climbs, ascents, and level flight. This system
    is crucial for auto-landing, so it should certainly be tuned before attempting
    it. Let''s take a look at it in the upcoming section.'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# TECS tuning


    First, you should have a stable tune as outlined earlier for your aircraft before
    doing TECS tuning. This is a process where you''ll need two people: One pilot
    and another person watching the telemetry from the aircraft (specifically the
    airspeed most of the time). All of these settings need to be altered in the parameter
    list.


    Here are the initial steps (use FBWA mode for this):


    +   1. Set the maximum throttle percentage (`THR_MAX`). This is the throttle required
    to still climb at your set cruise speed (`TRIM_ARSPD_CM`) at your maximum pitch
    angle (default 20 degrees). The default of 75% works for most aircraft. But lower
    speed craft may require more, while ballistic aircraft (which can climb straight
    up) may require less. Fly at the maximum pitch and find a comfortable spot. Have
    your ground station monitor call out your airspeed and change it using the `THR_MAX`
    setting to that number.

    +   2. Set the throttle for cruising (`TRIM_ARSPD_CM`) during level flight using
    the `TRIM_THROTTLE` parameter. This can be done by flying in FBWA mode and testing
    different settings.

    +   3. Set the minimum and maximum airspeed limits. Maximum (`ARSPD_FBW_MAX`)
    should be set at the air speed achieved when at `THR_MAX` during level flight.
    Minimum (`ARSPD_FBW_MIN`) should be set at the slowest speed you can fly at without
    stalling or losing stability.

    +   4. Set the maximum pitch angle (`LIM_PITCH_MAX`). Now that you''ve set `THR_MAX`,
    test it in FBWA mode. Go to max throttle and climb as hard as you can. If your
    airspeed exceeds the `TRIM_ARSPD` during the climb, either increase `LIM_PITCH_MAX`
    or decrease `THR_MAX`. If your airspeed falls below `ARSPD_FBW_MIN` during the
    climb, then either reduce `LIM_PITCH_MAX`, or increase `THR_MAX`. Ideally, you
    want a balance so that at max throttle in FBWA at maximum climb rate, you maintain
    the airspeed target at `TRIM_ARSPD`.

    +   5. Set the minimum pitch angle (`LIM_PITCH_MIN`). This is set to how much
    you can pitch the nose down while at `THR_MIN` without over speeding your aircraft.

    +   6. Set the maximum climb rate (`TECS_CLMB_MAX`). Don''t confuse this with
    airspeed or pitch. This is strictly how fast the aircraft gains altitude. Set
    this to the fastest rate you can possibly climb at `THR_MAX` and an airspeed equaling
    `TRIM_ARSPD_CM`.'
  merge: -1
  img_proc: true
- pgno: 218
  md: '+   7. Set the minimum sink rate (`TECS_SINK_MIN`). Set this to the rate of
    descent when your throttle is set to `THR_MIN`, and the sink rate when you pitch
    the nose down and can maintain an airspeed equaling `TRIM_ARSPD_CM`.

    +   8. Set the maximum sink rate (`TECS_SINK_MAX`). This is figured by descending
    the aircraft without exceeding the lower pitch limit and never exceeding the `ARSPD_FBW_MAX`.


    # Testing and fine tuning TECS


    You''ll need to test your tune and dial it in before moving on to setting up autonomous
    landing. Here are the steps for testing:


    +   1. Set the aircraft into a loiter around your home point using RTL. Make sure
    that it''s able to maintain altitude without a variance greater than 10 m. If
    it begins to oscillate height, increase the `TECS_TIME_CONST`. Increase by only
    1 at a time. If you find yourself making an overall change of 10 or more, you''ll
    need to go all the way back and check your original PID tuning.

    +   2. Check that the balance between `THR_MAX`, `TECS_CLIMB_MAX`, and `LIM_PITCH_MAX`
    is correct. Simply send a command for the aircraft to increase altitude by about
    60 m while in loiter around RTL. Throttle should go to around 80% of `THR_MAX`,
    and the pitch should be around 5° less than `LIM_PITCH_MAX`. Here''s how to troubleshoot
    any issues:

    +      1. If the speed begins dropping below what you are comfortable with or
    the throttle is pegged at `THR_MAX`; either increase `THR_MAX`, or reduce `TECS_CLIMB_MAX`.

    +      2. The pitch angle is pegged at maximum constantly; either increase `LIM_PITCH_MAX`
    or reduce `TECS_CLIMB_MAX`.

    +   3. Check the balance between `LIM_PITCH_MIN` and `TECS_CLMB_MIN`. Send a command
    for the plane to descend by about 60 m while in loiter around RTL. Optimally,
    the throttle will decrease and hold at `THR_MIN`, and the airspeed stays below
    `ARSPD_FBW_MAX`, while `LIM_PITCH_MIN` stays about 5° above its setting. Here''s
    how to troubleshoot it if these requirements are not met:

    +      1. If the pitch is pegged at the `LIM_PITCH_MIN`, either reduce the `TECS_SINK_MAX`,
    or reduce the `LIM_PITCH_MIN` number.

    +      2. If the speed is too fast, then decrease the `TECS_SINK_MAX`'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'There are still other parameters you can use to fine tune the TECS. Generally
    though, you won''t need these except in special cases. For a complete list of
    parameters, go to this page: http://ardupilot.org/plane/docs/tecs-total-energy-control-system-for-speed-height-tuning-guide.html#complete-parameter-list.


    Now that TECS is tuned, we can start setting up our autonomous landing parameters.


    # Auto-landing setup and parameters


    Luckily, there aren''t a ton of parameters for auto-landing itself. Unfortunately
    though, getting these just right can be a frustrating process. Let''s take a look
    at them one by one:


    +   - **LAND_FLARE_SEC** and **LAND_FLARE_ALT**: We''ll cover both of these at
    the same time as they are very closely related. LAND_FLARE_SEC is given first
    priority of the two, and this is simply the number of seconds before impact with
    the ground that the plane should flare. Flaring is cutting power, and pitching
    the nose up to slow the plane and start final descent to the landing zone. LAND_FLARE_ALT
    is how many meters from the ground the airplane should perform this same task.
    If you are relying solely on Pixhawk''s barometer for altitude, this set of numbers
    should be fairly high (such as 10 seconds and 6 meters). Since we''re using a
    fairly accurate rangefinder, we set this to 4 seconds and 2 meters.

    +   - **TECS_LAND_SPDWGT**: This is a parameter to control the balance between
    the landing airspeed (we''ll cover that in a moment), and the glide slope between
    the last waypoint, and the landing target. The glide slope should never go above
    10% (for example, descending 30m from 300m away), and ideally would be much lower
    than that. But if your landing speed is close to stall, you would want to give
    more priority to airspeed than to glide slope. The range is 0-2. 1 is an equal
    balance (default). 0 gives complete priority to glide slope, and 2 gives complete
    priority to speed. You may use decimals (float) for these values. A value of -1
    gives dynamic scaling of this value, constantly adjusting the priority until it
    is at 0 on touch down. It tends to yield more accurate landings.

    +   - **TECS_LAND_ARSPD**: This is the speed that you wish to land at. Ideally,
    this is a speed at which you are not stalling, but are losing altitude.

    +   - **LAND_PF_ALT** and **LAND_PF_SEC**: These settings are similar to flare.
    However, these are preflare. By preflaring, the aircraft can drop its speed below
    the TECS_LAND_ARSPD and actually accelerate to the landing speed. This can give
    you greater control during landing for Pixhawk to work with. These values should
    be larger than those of the flare settings (for instance, if LAND_FLARE_ALT is
    4, LAND_PF_ALT should be 6 or even 8).'
  merge: -1
  img_proc: true
- pgno: 220
  md: '+   - `LAND_PF_ARSPD`: This is the target velocity for your preflare airspeed.
    It should be below the `TECS_LAND_ARSPD` setting, but above stall speed. Some
    aircraft land very fast (such as EDF jets) in which case a setting of 1 will simply
    tell the aircraft to bleed off as much speed as possible before reaching the flare
    zone.

    +   - `TECS_LAND_SINK`: This is the descent speed for touchdown. By default, it
    is set to 0.25 meters per second, which works for many models. However, if your
    aircraft bounces, you''ll want to reduce this further.

    +   - `LAND_PITCH_CD`: This is the minimum target pitch for the flare. Aircraft
    with tricycle landing gear (one in the front, two in the back) will want this
    to be around 300 (3° because CD in a parameter means centidegrees).

    +   - `TECS_LAND_DAMP`: This is a dampener on the rate of pitch changes during
    the flare. Sudden and extreme movements during near-stall speeds are dangerous,
    so this setting can be handy. Larger numbers mean more dampening.

    +   - `LEVEL_ROLL_LIMIT`: Used to control the maximum roll angle (default 5°)
    after the flare. This is to prevent the wings from hitting the ground during landing.
    Because of this, during extreme crosswinds, the plane may not be able to land
    on the desired target.

    +   - `TECS_LAND_SRC`: This parameter is used to adjust your `TECS_LAND_SINK`
    on the fly to make sure the plane comes down on the landing target. If you find
    yourself overshooting, you can decrease the number to a negative to force a stall,
    or force the nose down with a positive number.

    +   - `LAND_DISARMDELAY`: After the plane stops moving (GPS, not airspeed), this
    is the delay in seconds before Pixhawk disarms. The default is 20 seconds.

    +   - `RNGFND_LANDING`: This setting lets Pixhawk know whether or not to use the
    rangefinder to calculate distance to runway during landing. Set this to 1 if using
    a rangefinder.


    Ok, maybe there are quite a few settings. But the main ones you''ll use for tuning
    are the ones affecting the flares.


    # The testing


    Set up a mission with the final waypoint low enough so that landing won''t produce
    a glide slope greater than 8%, nor less than 5%, and a `DO_LAND_START` marker
    on your landing zone. Remember to give yourself some safe space before and after
    the landing zone (in case of under or over shoots).'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'Then, flip into automode with your finger hovering over the switch to go back
    to manual and watch the plane very closely. Be ready to flip to manual and go
    to full power and ascend back to the sky.


    If you don''t like the way it lands, use the settings mentioned earlier to adjust
    your flares and speeds and angles to counteract what you don''t like. Of course,
    land in **MANUAL** mode before making the adjustments and try again.


    It will take several iterations before you feel comfortable with the landing.
    Once you do, add a `TAKEOFF` command to the beginning of your mission, and see
    if you can run a fully autonomous flight from takeoff to landing. If you succeed,
    you will be very happy.


    # Summary


    WOW! That was a lot, right? Now you can see why fixed wing aircrafts really are
    the holy grail of drone designers. In this chapter, we''ve learned about the extra
    components needed to integrate Pixhawk into a fixed wing drone. We''ve learned
    about placement, and thinking through the design. And finally, we went through
    the very complex and drawn-out process of tuning a fixed wing drone.


    In the next chapter, we''re not actually going to build a drone. Instead, we''re
    going to walk you through some concepts of creating a VTOL aircraft... FUN!'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# 8


    # The Principles of VTOL with Pixhawk


    Designing and tuning a **Vertical Takeoff and Landing (VTOL)** aircraft can take
    a very long time. It may even take years to design and get your VTOL aircraft
    set up and working with stability. Originally, this chapter was going to be based
    on something fun—a *Battlebot* design. But, when the book was announced, one thing
    was very clear. You (the readers) wanted to know more about VTOL. So, without
    the time nor budget to create a VTOL prototype aircraft (by the time we have made
    one work properly, it''s likely a new version of Pixhawk would be released); we''re
    going to work on the principle and theory of how someone would create a Pixhawk
    VTOL; not how someone did create a Pixhawk VTOL.


    In this chapter, we will cover the following topics:


    +   - The types of VTOL aircraft

    +   - Limitations and considerations of VTOL

    +   - Fusing a multicopter and fixed wing design

    +   - Tuning a VTOL aircraft


    # The types of VTOL


    There are essentially two types of VTOL: hybrid and vectored. All other VTOLs
    are a variation of the two. One is far easier to build, and one flies much better
    (and more efficiently). Unfortunately though, these are not the qualities of the
    same type of VTOL.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# The hybrid VTOL


    This is certainly easy to design and build. It''s just a matter of taking a very
    good airplane and attaching a multirotor frame to it (centred around the CG of
    the airplane). That''s a bit of an oversimplification, but accurate. Unfortunately,
    with this type of design the multicopter propellers themselves can begin spinning
    during forward flight due to the wind. And even with no spinning they are essentially
    control surfaces and can cause strange turbulence and vortices around the wings,
    which alters the way it flies. This, plus having surfaces designed around moving
    air that are non-functional during forward flight, will reduce your efficiency.
    And (in general) making a fixed wing drone is about trying to gain more flight
    time (and possibly speed). So creating wind resistance is counter-productive.
    The following image shows a hybrid VTOL aircraft:


    ![](img/504adb30bdfce87f38258e08f11180af_223_0.png)


    # Thrust vectored VTOL


    Thrust vectoring is just a fancy word for changing the direction of the air that
    the thrust system is pushing. Whether it''s by rotating propellers (like the Osprey
    military aircraft), rotating jet vents (like a Harrier), or changing the whole
    direction of the aircraft (like the X-Plane drone, which lands and takes off on
    its tail as a quad, and rotates to fly forward), the way to recognize a thrust
    vectored VTOL is that it uses the same thrust system to land and take off vertically
    as for pushing the aircraft forward during flight.'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'It''s much more difficult to get this right during the design phase, from changes
    in the CG to taking into account how pushing or pulling an airplane through the
    air affects the airplane mode flight in different ways. It''s certainly a design
    challenge, and you need to have a budget. Count on several crashes during the
    transition to forward flight on this type of aircraft until you get it right.


    The reward for all of your effort with a vectored thrust VTOL is that every bit
    of weight is utilized during all modes of flight. You don''t have any *non-functional*
    parts just hanging out during airplane flight. This also means no wasted energy.
    Whether that''s pushing parts through the wind that aren''t used during forward
    flight, or using control surfaces to counteract the way they affect your flight.
    Every time you (or your flight controller) uses a control surface, that means
    resistance from the wind, and of course, that means reducing the flight time.


    The following image is a Harrier. The US (and British) Navies use this aircraft
    heavily due to its ability to land and take off from much smaller aircraft carriers
    that are far less expensive to build than the larger ones that carry aircraft
    that require a catapult to launch, and trap wires to land. The Harrier uses a
    large turbofan jet engine, and vents the exhaust of this engine to nozzles under
    the wings (on the sides of the main hull) that rotate, and have louvers to even
    push thrust to the sides. It''s a very typical example of a vectored thrust VTOL
    aircraft, and one of the first:


    ![](img/504adb30bdfce87f38258e08f11180af_224_0.png)


    The Hawker Harrier; image courtesy of Wikimedia commons'
  merge: -1
  img_proc: true
- pgno: 225
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 226
  md: '# The challenge


    Luckily, we know just how much the plane already weighs wet (wet is with battery).
    That weight is 34.79 ounces (986.28 grams). What we need to do is find multicopter
    motors, ESCs, spars, and wiring that is under the flying weight limit for a multicopter
    with the total wet weight (of plane and additional parts) with enough juice left
    in the battery to maintain forward flight for a reasonable amount of time, and
    then land again vertically. We also need to stay below the maximum weight of the
    Bixler.


    Our first problem arises. We''re (technically) already above the maximum weight
    of a Bixler. The published maximum flying weight is 650 grams (22.92 ounces).
    However, this appears to be a dry weight. Even so, we''re already pretty much
    at the maximum flying weight of the Bixler. So, it''s a non-starter. We need a
    plane with bigger wings, stronger wings, much stronger wings, and since we''re
    going there we need something that can carry (and run on) 6S batteries: 10,000
    mAh 6S batteries. This is a very common battery for moderate-to-heavy lift multicopters,
    and should suffice for our VTOL.


    # The simple gets more complex


    Well, our Bixler obviously wouldn''t work. It''s just not designed to carry much
    weight nor payload for our purposes. Just one 10,000 mAh battery weighs ~1,400
    grams (49.39 ounces). That''s more than our entire flying weight of the Bixler.
    We choose this battery because 6S (22.2V) batteries provide enough juice to lift
    heavy loads in a multicopter. And 10,000 mAh should provide plenty of flight time
    for our airplane as well.


    So, we know what won''t do the job. What will? Enter the Skywalker EVE-2000. For
    a final production model, of course we''d design something more purpose built.
    But this is a great airframe to test out a hybrid design. It has huge wings (2,400
    mm wingspan), and has a maximum wet weight of 4,600g (162.26 oz.).'
  merge: -1
  img_proc: true
