  - '[PAGE 252]


    # Basic Tuning


    The **Basic Tuning** tab is where you can manually tune the flight characteristics
    of Pixhawk in modes, which require stabilization. Each axis (**Pitch**, **Roll**,
    and **Yaw**) is individually set with the following parameters:


    +   - **Proportional Gain (P)**: This value is how much Pixhawk tries to correct
    to get the vehicle to the attitude it is supposed to be. For instance, how much
    elevator is applied to pitch the aircraft up to where it is supposed to be. Higher
    numbers make the craft more responsive or *twitchy*. Lower numbers make transitions
    smoother.

    +   - **Integral Gain (I)**: You can think of this as an automatic trim adjustment.
    It takes in past discrepancies between the desired attitude and the actual attitude
    and corrects controls to account for this. Higher numbers mean more automatic
    trim, and lower numbers mean less.

    +   - **Derivitive Gain (D)**: This one dampens how reactive the PI adjustments
    are. Numbers too high can damage servos and motors because they may begin to *flutter*.

    +   - **INT_MAX**: This is the maximum value that can be used by **Integral Gain
    (I)**.


    The other sections of this screen require a very in-depth explanation on their
    use. I believe Basic Tuning should be renamed to just Tuning. For this explanation,
    refer to Chapter 7, *The Holy Grail – A Fixed Wing Drone (Airplane)*, where we
    explain in great detail the tuning parameters on this screen.


    # Standard Params


    The **Standard Params** screen is a long list of all of the basic parameters within
    Pixhawk which can be changed. Many of these parameters can be changed using the
    **graphic user interface (GUI)** on other screens within Mission Planner, or using
    the wizards. It is important though to note where to dive in and change the parameters
    manually. Here are all of the **Standard Params** and their functions:


    +   - **ACRO_LOCKING**: Think of this as a **Panic** mode when operating an acrobatic
    aircraft in **ACRO** mode. If you let go of the sticks, the vehicle will level
    out and maintain altitude by engaging the **ALT HOLD** mode.

    +   - **ACRO_PITCH_RATE**: This sets the maximum pitch rate in **ACRO** mode.

    +   - **ACRO_ROLL_RATE**: This sets the maximum roll rate in **ACRO** mode.'
  - '[PAGE 253]


    <!-- no content -->'
  - '[PAGE 254]


    +   - **CAM_FEEDBACK_PIN**: This facilitates the use of feedback from a camera
    (via a hotshoe connection), which will enter into the Pixhawk logs that a photo
    was successfully taken. This is highly useful for manually geotagging photos after
    they are taken using Pixhawk''s GPS information. This parameter is the pin number
    to use for this feedback.

    +   - **CAM_FEEDBACK_POL**: The polarity of the camera feedback. TriggerHigh is
    used to take a picture when the voltage escalates and TriggerLow is used to take
    a picture when the voltage drops.

    +   - **CAM_RELAY_ON**: This is similar to **CAM_FEEDBACK_POL**, this sets when
    the camera relay has been activated by high or low voltage.

    +   - **CAM_TRIGG_TYPE**: This specifies how Pixhawk would send a shutter trigger
    to the camera.

    +   - **CAN_P1_DRIVER**: This activates the use of CAN buses on Pixhawk.

    +   - **CAN_P2_DRIVER**: This activates a second CAN bus.

    +   - **CHUTE_ENABLED**: This is used to check whether or not a parachute deployment
    system is present on the vehicle.

    +   - **COMPASS_DEC**: This shows the difference between true North and Magnetic
    North. This is set by calibrating the compass automatically.

    +   - **FBWB_CLIMB_RATE**: This sets how fast the vehicle will climb with elevators
    at full deflection in **FBWB** and **CRUISE** modes.

    +   - **FBWB_ELEV_REV**: This is used to check whether the elevators are reversed
    in the **FBWB** mode (whether pushing forward on elevator control makes the aircraft
    rise or fall).

    +   - **FENCE_ACTION**: This specifies the action to take when a geofence is breached.

    +   - **FENCE_AUTOENABLE**: This sets whether a geofence is automatically put
    in place during automatic take off and removed during auto-landings.

    +   - **FENCE_MAXALT**: This specifies the maximum altitude (in meters) an aircraft
    can fly when geofencing is enabled.

    +   - **FENCE_MINALT**: This specifies the lowest altitude (in meters) an aircraft
    can fly when geofencing is enabled.

    +   - **FENCE_RET_RALLY**: This sets how Pixhawk reacts to breaching a geofence
    (whether it returns to a rally point, home, or just to where the breach happened).

    +   - **FENCE_RET_ALT**: This specifies the altitude that the aircraft returns
    from breaching the geofence at. A setting of 0 maintains the current altitude.

    +   - **FLOW_ENABLE**: This is used to check whether or not optical flow sensors
    are used.'
  - '[PAGE 255]


    +   - **FLOW_FXSCALER**: This is used to account for lens length on an optical
    flow sensor. Increasing the number actually reduces the scale factor on the x
    axis.

    +   - **FLOW_FYSCALER**: This is used to account for lens length on an optical
    flow sensor. Increasing the number actually reduces the scale factor on the y
    axis.

    +   - **FLOW_ORIENT_YAW**: This sets the centi-degrees of variance between the
    aircraft and the yaw of the optical flow sensor.

    +   - **FLTMODE(1-6)**: This sets what the flight modes are for different positions
    of the flight mode switch on the controller.

    +   - **FS_GCS_ENABL**: This is used to check whether or not a failsafe state
    is activated upon loss of signal with the **ground control station (GCS)**.

    +   - **FS_LONG_ACTN**: This sets the action to be taken in the event of a long
    failsafe (see **FS_LONG_TIMEOUT**).

    +   - **FS_LONG_TIMEOUT**: This is the number of seconds that a failsafe state
    exists before activating **FS_LONG_ACTN**.

    +   - **FS_SHORT_ACTN**: This sets the action to be taken while waiting for **FS_LONG_TIMEOUT**.

    +   - **FS_SHORT_TIMEOUT**: This is the number of seconds before the **FS_SHORT_ACTN**
    is activated in the event of a failsafe event. This is useful to prevent mode
    shifts during a small bit of signal interference, and so on.

    +   - **GROUND_STEER_ALT**: This is the altitude (in meters), which the rudder
    control will also control a wheel servo to enable ground steering. A setting of
    0 allows wheel control at all altitudes.

    +   - **INVERTEDFLT_CH**: This specifies the controller channel, which will enable
    inverted flight capabilities.

    +   - **LAND_TYPE**: This specifies the type of landing to execute during auto-landing.
    (Standard versus Deep Tail).

    +   - **LIM_PITCH_MAX**: This is the maximum pitch angle during stabilized flight
    modes.

    +   - **LIM_PITCH_MIN**: This limits the angle at which the nose can be pointed
    down during stabilized flight modes.

    +   - **LIM_ROLL_CD**: This is the maximum roll angle (in centi-degrees) of a
    roll in either direction.

    +   - **LOG_BACKEND_TYPE**: This specifies how logs are stored (File, mavLink,
    or both).

    +   - **LOG_DISARMED**: This specifies whether the logs are created while in a
    disarmed state (as well as armed).

    +   - **LOG_FILE_DSRMOT**: This dictates whether the current log file is closed
    when the vehicle is disarmed.'
  - '[PAGE 256]


    <!-- no content -->'
  - '[PAGE 257]


    +   - **MNT_STAB_TILT**: This is used to check whether or not to stabilize the
    pitch axis of a gimbal.

    +   - **MNT_TYPE**: This sets the type of gimbal mount (none, servo, and mavLink).

    +   - **NAV_CONTROLLER**: This is to enable the use of experimental navigation
    controller. L1 is the default here.

    +   - **NAVL1_PERIOD**: This sets the turning radius (in meters) during autonomous
    flight.

    +   - **Q_ENABLE**: This enables the quadplane (hybrid) features of Pixhawk.

    +   - **RALLY_INCL_HOME**: This checks whether the home point is a safe place
    to land during RTL.

    +   - **RELAY_DEFAULT**: This sets the state of the camera relay upon boot of
    Pixhawk.

    +   - **RELAY_PIN(1,2,3,4)**: This sets the pin number for relay control of a
    camera.

    +   - **RNGFND_ADDR**: This is specific to the LightWare I2C lidar rangefinder.
    It allows for the use of multiple rangefinders on different addresses.

    +   - **RNGFND_FUNCTION**: This sets how the rangefinder''s feedback is interpreted
    (linear, inverted, and hyperbolic).

    +   - **RNGFND_GNDCLEAR**: This is used to determine how far a downward-facing
    rangefinder is from the ground when an aircraft has landed.

    +   - **RNGFND_LANDING**: This is used to check whether or not to use the rangefinder
    to assist with landings.

    +   - **RNGFND_PIN**: This is the pin used for analog (non-I2C) rangefinders.

    +   - **RNGFND_RMETRIC**: This is used to set whether or not an analog rangefinder
    is ratiometric (most are).

    +   - **RNGFND_STOP_PIN**: This sets the pin used for an analog rangefinder''s
    measurement.

    +   - **RNGFND_TYPE**: This sets the type of rangefinder implemented.

    +   - **RPM_PIN**: This is the pin to be used for a motor RPM sensor.

    +   - **RPM_TYPE**: This is the type of RPM sensor implemented.

    +   - **RPM2_PIN**: This allows for the use of a second RPM sensor and specifies
    the pin that is used for it.

    +   - **RSSI_ANA_PIN**: This specifies the pin number for an analog RSSI (Received
    Signal Strength Indicator) module.

    +   - **RSSI_PIN_HIGH**: This sets the maximum voltage for an RSSI module''s output
    when the signal strength is high.

    +   - **RSSI_PIN_LOW**: This sets the minimum voltage when an RSSI module''s signal
    strength is low.

    +   - **RSSI_TYPE**: This is the type of RSSI module.'
