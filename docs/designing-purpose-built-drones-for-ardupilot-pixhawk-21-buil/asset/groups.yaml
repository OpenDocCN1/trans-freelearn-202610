    A two-position switch would be a PWM < 1230 (off) and a PWM >1750 (on). With more
    positions on the switch, the number would fall somewhere in between. If the remote
    is paired and powered on while you’re on this screen, as you flip through the
    positions of the switch, the drop-down menu will highlight green. Just set the
    desired mode for each position. Make sure you click on Complete before clicking
    on Next.


    We’ve been through calibration before. We’re only showing this screen at this
    point to emphasize that you should not forget to reverse any channels that are
    moving in the wrong direction on your transmitter:


    ![](img/504adb30bdfce87f38258e08f11180af_173_0.png)'
  - '[PAGE 174]


    Next, we need to tell Pixhawk how to handle emergencies.


    ![](img/504adb30bdfce87f38258e08f11180af_174_0.png)


    Failsafes are engaged during (what most would call) emergency situations. They
