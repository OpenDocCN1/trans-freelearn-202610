  - '[PAGE 189]


    While tuning fixed wings, I''ve had them turn into lawn darts, porpoise like dolphins
    jumping out of the ocean, and (as stated in a previous chapter) blow their wings
    right off. So, it''s important while prototyping to start with an airframe that
    is relatively inexpensive yet stable. It''s also important to choose one that
    offers some protection for your Pixhawk if something does go wrong. That makes
    a foamie airplane a perfect choice. Foam airplanes are very cheap, and are basically
    flying packing material. It''s certainly no guarantee that the Pixhawk would survive
    a crash. But it does improve its chances.


    The following topics will be covered in this chapter:


    +   - Why this particular airplane kit?

    +   - The assembly

    +   - Tuning a fixed wing aircraft with mission planner

    +   - Setting up for tuning

    +   - The tuning process

    +   - Autotune flight


    # Why this particular airplane kit?


