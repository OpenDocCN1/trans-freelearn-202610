    此外，由于飞机在空中需要保持一定的速度以使气流流经机翼从而产生升力（称为**空速**），因此引导系统需要知道它相对于空气的运动速度（而不仅仅是相对于地面）。除了多旋翼无人机使用的所有传感器外，飞机还需要一个额外的传感器：皮托管。


    任何真正的飞机上都会找到皮托管来测量空速。这个装置就是你看到从飞机侧面或机头伸出的小*杆*。下面的图片展示了皮托管的工作原理：


    ![](img/504adb30bdfce87f38258e08f11180af_35_0.png)


    图片由 Wikimedia commons 提供


    下面的图片展示了有人驾驶飞机上的皮托管：


    ![](img/504adb30bdfce87f38258e08f11180af_35_1.png)


    Pixhawk 本身没有这个传感器，但可以购买一个与之配合使用。


    固定翼无人机也可以以多种方式发射。有些是投掷的；有些是在弹射系统上发射，而另一些则是像传统飞机一样起飞（带轮子的滑跑起飞）。


    下面的图片展示了我的一架无人机（2012 年）通过一种名为 Jetapult 的弹射系统发射：


    ![](img/504adb30bdfce87f38258e08f11180af_36_0.png)


    由于这架无人机的翼展长达七英尺，太大而无法通过投掷的方式发射。该系统非常简单。它使用 PVC 管将飞机倾斜并以轻微的角度将其滑出，同时橡皮筋以很高的加速度将飞机向前拉。如果你仔细观察，可以看到黑色的橡皮筋团成一团，堆在地面上，就在（现在正在飞行）无人机后面。释放装置是一个简单的脚踏板，可以将一个环从销钉上滑落。


    尽管这是一个简单的机制，但即使是军用无人机有时也会从弹射器发射（如下面的图片所示）：


    ![](img/504adb30bdfce87f38258e08f11180af_37_0.png)


    ## 混合无人机 – VTOL


    你可能会想知道我们为什么花了这么多时间在起降上。**垂直起降（VTOL）**无人机解决了许多问题，但也带来了很高的复杂性。这些无人机可以像直升机（或多旋翼）一样起飞，像飞机一样飞行，然后像直升机/多旋翼一样再次降落。


    XplusOne（由 Xcraft 生产）可以像四轴飞行器一样起飞甚至飞行，但随后可以过渡到像飞机一样的向前飞行。正如你所见，设计这样一架飞机是极其困难的。机翼在垂直状态下产生的风阻会在多旋翼飞行期间造成不稳定，而过渡到飞机飞行也同样困难。然而，最困难的挑战是返回四轴飞行以进行降落。你如何防止飞机上浮（增高）然后失速坠毁？你只有在拥有高度资金和经验时才应尝试此操作，因为在调整设计使其恰到好处之前，你几乎肯定会坠毁几次。


    ## 直升机无人机


    传统直升机确实有一些优势。它们通常比多旋翼飞行更快，在向前飞行时更稳定（由于尾鳍和水平尾翼）。它们有时还能在空中停留更长时间，因为它们不需要电动机的快速响应。因此，它们可以使用燃烧发动机甚至涡轴发动机飞行，这意味着它们可以携带更多燃料并飞行更久。下面的图片展示了一架美国海军直升机无人机：


    ![](img/504adb30bdfce87f38258e08f11180af_38_0.png)


    然而，传统直升机通过使用*摆动盘*来改变桨叶的螺距。它们通常（也）通过类似的方法（尽管更不复杂）来改变尾桨桨叶的螺距。摆动盘基本上是由两块板组成，它们围绕旋翼轴旋转并上下移动以改变桨叶的螺距。直升机如何向前倾斜以开始移动？摆动盘倾斜并向下延伸的轴使桨叶在直升机后部咬入空气更多，而在前部咬入更少（在后部产生更大的下压力，在前部产生更小的下压力）。


    所有这些运动机械部件需要在每次飞行之间进行润滑和维护。机器越复杂，出现故障的机会就越多。因此，尽管传统直升机有一些优势，但就成本和维护计划而言的缺点使其对许多人来说不可行。


    下面的图片展示了摆动盘的工作原理。红色圆盘保持静止并旋转或上下移动。与此同时，米色部件随旋翼头转动，水蓝色控制杆根据它们在旋转周期中的位置来改变桨叶的螺距：


    ![](img/504adb30bdfce87f38258e08f11180af_39_0.png)


    就本书而言，直升机的介绍到此为止。因为就我们的 Pixhawk 而言，直升机和多旋翼机之间几乎没有区别，我们选择在本書中介绍多旋翼机。


    ## 飞艇无人机 – 飞艇


    飞艇其实相当不错。它们可以在极长的时间内保持在空中。它们也很稳定。然而，它们对景观来说有点碍眼，因为它们必须相当大才能携带任何有效载荷。下面的图片展示了一架海军飞艇无人机：


    ![](img/504adb30bdfce87f38258e08f11180af_40_0.png)


    飞艇无人机还有一些其他缺点。它们必须充气，每次飞行都要花费大量资金用于你选择的任何轻于空气的气体（氦气、氢气等）。由于其轻于空气的特性，它们也极易受到强风流的影响。因此，必须使用强劲的发动机来抵消这些气流。这增加了重量，从而使飞艇的尺寸更大。由于这些限制和成本，飞艇并未得到广泛使用。


    这很遗憾，因为从机械上讲，它们是最简单的无人机设计。只是实际上，它们昂贵且在很大程度上不切实际。


    ## Ardupilot 101 – Pixhawk 2.1 的快速概述


    Ardupilot 平台（基于 Arduino 机器人平台）已经存在很长时间了。2007 年，它由一家名为 3D Robotics 的公司构想。它是一个开放的代码库（完全可编程），自
    2013 年 Pixhawk 系列问世以来，其多功能性和能力得到了爆炸式增长。最新版本（本书撰写时为 2.1）通过可选的 Intel Edison 计算模块扩展处理能力以及立方体的添加实现了更强的多功能性和稳定性。立方体包含一个三重冗余传感器阵列，包括陀螺仪、加速度计、磁力计和气压计，安装在一个缓冲的立方体平台中，旨在最大限度地减少振动和电子干扰。


    除了 Intel Edison，你还可以使用 Raspberry Pi、ODroid、NVidia TX1 和 BeaglePilot 项目协处理器以任何你想要的方式自定义你的
    Pixhawk 2.1 的功能。虽然并非每个 Pixhawk 2.1 都有 Edison 端口（如果你计划使用 Edison，你购买的 Pixhawk 的说明应明确标有
    *Edison Ready*），但其他协处理器可以添加到任何 Pixhawk 板上。


    感到不知所措吗？好。 那么关于向你展示 Pixhawk 的能力是巨大的这一目标就实现了。事实上，它的范围如此之大，以至于它是一个功能强大的机器人平台大脑，能够实现你能想象到的几乎任何事情。Pixhawk
    的局限性仅在于你的编程技能。


    在此完全披露，我们不会深入探讨用于自定义 Pixhawk 的编程语言和其中的命令。那本身就可以是一整本书，甚至是一系列书籍。相反，我们将探讨 Pixhawk
    在其原装状态下（经过少量调整）可用于实际用途的情况。


    重要的是，如果 DJI 代表专有系统（尽管是非常高质量的专有系统），那么 Pixhawk 代表开放架构。DJI 就像 Apple，而 Pixhawk 就像
    Linux。


    现在，你可以松口气了。我们不会用屏幕又屏幕的代码来吓唬和压倒你。让我们进入设备本身。

    '
