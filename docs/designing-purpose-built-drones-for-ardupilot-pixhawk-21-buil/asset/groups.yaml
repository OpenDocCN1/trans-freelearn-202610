  - '[PAGE 68]


    This power module goes inline (between the battery and speed controller) to provide
    power to the Pixhawk''s computer and give power readings (so the Pixhawk knows
    when it''s running low on power).


    This does not provide power to the servos. The servo board must get power from
    a Battery Eliminator Circuit (BEC), a device that eliminates the need for multiple
    batteries by distributing power to the servo board. The ESC on this rover has
    a BEC integrated into it. So, it not only receives signals from the Pixhawk, but
    supplies power to all the servos. If this ESC didn''t have a BEC integrated, one
    would be needed (connected directly to the main battery), and could be plugged
    into any port on the servo board (rear of the Pixhawk). Most ESCs have BECs integrated.
    However, some do not, and it''s important to know what a BEC is.


    Now that everything is hooked up, let''s get started with the software.


    # Programming the Pixhawk for our (basic) rover


    There are two pieces of (free) software that you''ll want. The first is your primary
    Pixhawk software (Mission Planner). The other is QgroundControl. Both are available
    from multiple sources, and a simple Google search will get you both.


    Although we have the radio telemetry unit installed, on our very first startup
    of Pixhawk we''re going to need to directly connect it to a computer via USB.
    Remember that plug on the side of the Pixhawk cube? That''s our computer USB plug.
    It''s best to use a laptop (so you can use it in the field).


    # The wizard


    After connecting the Pixhawk to our computer, start up the Mission Planner software.
    You''ll be confronted with this requestor:'
  - '[PAGE 69]


    ![](img/504adb30bdfce87f38258e08f11180af_69_0.png)


    Obviously, you''ll want to select Rover. This wizard will do the initial setup
    of your Pixhawk and calibrate it for use.


    Next you simply select how the computer connects to the Pixhawk (as shown in the
    following screenshot):


    ![](img/504adb30bdfce87f38258e08f11180af_69_1.png)'
  - '[PAGE 70]


    At this point, you must provide which port the Pixhawk is attached to. The Pixhawk
    essentially emulates a serial port via USB (a COM port). The way to know which
    port is associated with your Pixhawk (on Windows) is to look at the Device Manager
    (as shown in the following screenshot):


    ![](img/504adb30bdfce87f38258e08f11180af_70_0.png)


    Under Ports, just look for PX4 FMU. In this case, you can see that it''s COM9.


    Now that it''s found the Pixhawk, it will verify its version of firmware and update
    it. If this fails, just repeat the steps until it succeeds. You may need to change
    which plug you have the USB jacked into. Sometimes USB hubs and other devices
    can interfere. Again, just keep trying with different combinations until it works.
    It will eventually. In most cases, it works the first time.'
  - '[PAGE 71]


    <!-- no content -->'
  - '[PAGE 72]


    <!-- no content -->'
  - '[PAGE 73]


    After clicking on Next, the wizard will have you set up any sonar devices (as
    shown in the following screenshot):


    ![](img/504adb30bdfce87f38258e08f11180af_73_0.png)


    We''re not using sonar for this rover. However, we may use it in a much later
    chapter. So we just left the Sonar Model field at None.


    On to the control configuration. Here is where we can bind the receiver to our
    control transmitter (a Spektrum DX8 in this case) and calibrate the controls to
    work properly.


    The following screenshot shows the screens associated with this process:


    ![](img/504adb30bdfce87f38258e08f11180af_73_1.png)'
  - '[PAGE 74]


    In the panel on the left, you''ll see a **Continue** button (not the **Next**
    button). That will bring you to the panel on the right. At the lower-right, you''ll
    notice a section called **Spektrum Bind**. Activating the proper binding button
    by selecting the appropriate type of **Spektrum Satellite** will set the receiver
    into bind mode. Then, just follow the instructions in the Spektrum manual for
    binding whichever Spektrum transmitter you are using. For the DX8, the following
    are the instructions:


    +   1. Select a fresh model

    +   2. Turn the transmitter off

    +   3. Hold down the **Bind** button

    +   4. Turn on the transmitter while holding the **Bind** button

    +   5. Wait for the transmitter to confirm it is bound


    After binding the transmitter, just click on the **Calibrate Radio** button and
    follow the instructions. (It will have you move various controls in different
    directions.)


    Next is the **Flight Modes** setting, as shown in the following screenshot:


    ![](img/504adb30bdfce87f38258e08f11180af_74_0.png)'
  - '[PAGE 75]


    Up to seven flight modes can be associated with a switch or dial on your remote.
    If you have a three-position switch on the remote, modes 1, 3, and 5 are the most
    likely ones that would be assigned to these positions. The flight modes are as
    follows:


    +   - **Manual**: This mode involves full manual control of the vehicle. The Pixhawk
    simply forwards all commands directly to the servos and ESCs it is controlling.

    +   - **LEARNING**: This mode has the same controls as the manual mode, but it
    lets you toggle a switch on your controller to teach GPS waypoints to the software
    for use in the Auto mode. Essentially, the rover will repeat your movements.

    +   - **STEERING**: This mode is the same as the Learning mode, but turns on obstacle
    avoidance (if sonar is used), and will steer the rover around obstacles for you.
    This is great for tuning your obstacle avoidance (which we may use in a later
    chapter).

    +   - **HOLD**: This mode stops the rover with all wheels stopped and pointed
    straight ahead.

    +   - **Auto**: This mode involves fully autonomous driving from waypoint to waypoint.
    This waypoint list will be looped and repeated infinitely. If reception is lost,
    the rover will go in to the HOLD mode.

    +   - **RTL**: This stands for Return to Launch and will directly return the rover
    to the spot it was launched from. Upon reaching the launch point, it will go into
    the HOLD mode. If sonar-equipped, it will avoid obstacles along the way.

    +   - **Guided**: This mode utilizes the radio telemetry unit. You can use advanced
    controls (such as telling the throttle to let up if the rover pulls a wheelie),
    use joysticks on the computer, or specify waypoints on the fly. Think of this
    as the Mars Rover setting.'
  - '[PAGE 76]


    On the final screen of the wizard, you should see that everything is green except
    for trying to arm your rover (as shown in the following screenshot):


    ![](img/504adb30bdfce87f38258e08f11180af_76_0.png)


    Do not try to arm your rover at this point. First, perform the following procedure:


    +   1. Make sure all four wheels are off the ground. We used an RC car stand (the
    orange platform in all of the pictures of the rover in this chapter).

    +   2. Make sure your transmitter is on.

    +   3. Connect the power sensor module to the ESC.

    +   4. Connect the battery to the power sensor module.

    +   5. Hold down the ARM button (the now flashing red button attached to the GPS
    cable) for 3 seconds.


    If the red button light stops flashing and goes solid red... congratulations.
    It has successfully armed. If not, or if the button''s light never turned on,
    you may have connected up the wrong wires on the GPS cabling. Check them again.


    The red box will not turn green, but you have registered successful arming in
    every significant way.


    The rest of the screens do not actually allow you to configure anything. They
    simply advise you of what Failsafe options are and give you some links for some
    reading material. Read them. They are very helpful.'
  - '[PAGE 77]


    # More calibration...


    No matter how cool everything looks right now, stop! You may be seeing a map and
    some cool readouts. First, we need to calibrate the accelerometers. Click on the
    INITIAL SETUP tab at the top of the Mission Planner software, and you''ll get
    to the following screen:


    ![](img/504adb30bdfce87f38258e08f11180af_77_0.png)


    Along the left of the screen is Accel Calibration (under the Mandatory Hardware
    tab). Click on each of the buttons (Calibrate Accel and Calibrate Level) in the
    interface and follow the onscreen instructions. This calibrates the accelerometers
    so that the Pixhawk knows exactly what the attitude of the craft is. You will
    be required to put the rover in several positions and put it level. We advise
    you to do this under USB power without the battery connected.


    You may need to also calibrate the ESC for your drive wheels. Again, just follow
    the simple onscreen instructions for this step.'
