  - '[PAGE 202]


    +   - **CRUISE:** Control-wise, this mode is rather like FBWB. However, when the
    sticks are released, Pixhawk calculates the current trajectory and sets a waypoint
    1 km away. It maintains altitude and heading toward that waypoint. You must have
    a GPS fix to activate this mode. You can also configure this mode to follow terrain
    (adjust height to account for mountains/hills automatically).

    +   - **AUTO:** When activated, this mode begins your preplanned waypoints set
    in mission planner. This is fully autonomous flight. However, you can override
    the autonomous flight with stick inputs (which mimics FBWA mode).

    +   - **Return to Launch (RTL):** This is also a great mode for fail-safe operations.
    When activated, this mode autonomously returns the aircraft to the home point
    (where the aircraft was launched from). It will then loiter at an altitude set
    by the `ALT_HOLD_RTL` parameter until further instructions. You must have a GPS
    fix to activate this mode.

    +   - **LOITER:** In this mode, the plane will automatically circle around the
    place where you activated the loiter mode. The radius of the circle is controlled
    by `WP_LOITER_RAD`, but will not exceed the `NAV_ROLL_CD` limits. Additionally,
    it is constrained by the `NAVL1_PERIOD` parameter. This mode is also only available
    with a GPS fix.

    +   - **CIRCLE:** Circle is similar to loiter, but does not rely on a GPS fix.
