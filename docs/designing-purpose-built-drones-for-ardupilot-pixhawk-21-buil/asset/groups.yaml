    ## 1 Drones 101


    Congratulations! You''ve taken the first step into the exciting world of designing
    and developing your very own purpose-built drone. Humankind has constantly been
    pushing the edges of their technology. Our technological progression is built
    into our DNA so thoroughly that we mark complete eras of our history with the
    technological state of the art. The Bronze Age, the Industrial Era, Space-Age,
    Information Age, and now the "Drone Era." It truly is exciting to live in the
    drone era. Well, we have a lot to cover, so let''s get started:


    We''ll be covering the following topics in this chapter:


    - Introduction to drones

    - Purposes for drones

    - Types of drones

    - Ardupilot 101

    - Safety and best practices


    ### Introduction to drones


    What is a drone? Twenty years ago, the answer was easy. Ignoring the definitions
    having to do with insects, a drone was a term strictly used for a military autonomous
    flying vehicle. Drones were (mostly) used for target practice or for gathering
    intelligence (reconnaissance). Along came a company called Dragan that made one
    of the first commercially available quadrocopters (the DraganFlyer) and the term
    Quad Helicopter was born.


    Their first commercially available multicopter was simply called the **Quad Helicopter**
    and came out in 1997 (it is shown in the following image):


    ![](img/504adb30bdfce87f38258e08f11180af_19_0.png)


    The original DraganFlyer Quad Helicopter (1997). Picture courtesy of DraganFlyer


    In the 2000s, the term *drone* became synonymous with military strikes. Between
    the United States Presidents Bush and Obama, the United States racked up many
    attacks on targets with connections to terrorism. So, the term "drone" had an
    ominous implication.


    In 2010, Parrot came out with a multicopter that implemented **augmented reality
    (AR)** on a cell phone. This game allowed players to shoot down each other''s
    real-life multicopters. The multicopter was titled the **AR Drone** (probably
    as a marketing attempt to capitalize on the ominous nature of the term drone).
    Really, it was the first multicopter you could buy in your local shopping mall
    and plaza (it was available at all Sharper Image stores). The public finally had
    its first look at multicopters. There it was—Drone stamped in all-caps on the
    front of the box.


    Who could resist? I had spent days, weeks, years (even) building drones by tearing
    apart other electronics to get accelerometers, GPS modules, and other components
    to build my own drone. Could it really be so easy that all I had to do was go
    down to the mall and buy one? Yes. The following image shows me in 2010 testing
    out an AR Drone bought from Sharper Image:


    ![](img/504adb30bdfce87f38258e08f11180af_20_0.png)


    Testing an AR Drone (1.0) in 2010 from "Sharper Image" (Pacifica, CA)


    In 2011, the glory of military drones got a big stain. It turned out that these
    surgical drone strikes were sometimes taking out civilians, US citizens in foreign
    countries, and missing terrorists all together. Suddenly the term drone was becoming
    something that the general public associated with fear and even rage. Protests
    ensued (as shown in the following image):


    ![](img/504adb30bdfce87f38258e08f11180af_21_0.png)


    Creative Commons Picture by: Fibonacci Blue


    Soon, turnkey systems (like the DJI Phantom) were available with cameras already
    installed and sold at big-box retailers. This led to privacy concerns from opponents
    to the craft. They had been handed a new term for multicopters on a silver platter,
    a term that struck fear and loathing into the hearts of people all around the
    planet. A term even synonymous with murder-drone. In the following image, you
    can see the first in the line of DJI Phantom drones:


    ![](img/504adb30bdfce87f38258e08f11180af_22_0.png)


    The DJI Phantom (version 1) - The first of the most popular drone line ever created.
    Those three prongs on the center of the hull are a mount for a GoPro camera


    The multicopter community resisted the term drone with all its might. People were
    in hysterics. In Santa Rosa, California (2013), a police officer even confiscated
    a property owner''s drone. He was flying it over his own vineyards and posting
    the videos on YouTube. The police officer stated that it would be a matter of
    months before you saw fly by shootings. The police department had no legal standing
    and was forced to return the Phantom.


    Legislators around the country were making local laws against drones. In Los Angeles
    (the area that hosts Hollywood and the bulk of the aerial cinematography industry),
    drones were outlawed. (Later these laws would be overturned as the FAA finally
    stepped in and stated that local and state governments had no jurisdiction over
    airspace.) At the time, it looked as if drones may just go the way of the condor.
    But then something wonderful happened.

    '
