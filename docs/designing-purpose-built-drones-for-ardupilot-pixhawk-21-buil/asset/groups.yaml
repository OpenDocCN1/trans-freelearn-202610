    that shows the data points of your rotation. Once you''ve hit every white dot,
    the interface will automatically close. Do not click on the **Done** button. This
    will register as an uncalibrated compass. Just keep rotating your drone in all
    directions until the interface closes itself.


    ![](img/504adb30bdfce87f38258e08f11180af_168_0.png)'
  - '[PAGE 169]


    Let''s skip over binding the radio, and selecting our power module. We''ve covered
    that section pretty well in our other chapters. If you need any help, just refer
    back to these chapters. For now, let''s set up our flight modes:


    ![](img/504adb30bdfce87f38258e08f11180af_169_0.png)


    Since this is our first aerial drone, let''s go over flight modes quickly:


    +   - **Stabilize**: The standard flight mode, which uses all the available sensors
    to fly in the most stable fashion possible. Think of this mode as analogous to
    DJI''s ATTI mode.

    +   - **Altitude Hold (Alt Hold)**: When this mode is engaged, the drone will
    maintain its current altitude while you can concentrate on the position and orientation
    of the aircraft. If using the standard Pixhawk hardware, a barometer is used to
    maintain the altitude; this means it is **above sea level (ASL)**. If there are
    changing barometric pressures, this can affect the actual altitude that is held.
    However, if a downward-facing range finder (as we used for collision avoidance
    with our golf trolley) is used, the Pixhawk will use this as a primary sensor
    for **above ground level (AGL)** altitude hold (within the limits of the sensor''s
    range). Therefore, I advise you fit a LIDAR sensor if you plan to use this mode.'
  - '[PAGE 170]


    +   - **Loiter**: This is similar to the stabilize mode. A pilot may still fly
    the multicopter as if in a manual mode, but when the sticks are released the drone
    will slow to a stop and maintain altitude, attitude, and position. You should
    only use this mode in an environment with low EM, and have a very good calibration
    on your sensors.

    +   - **Return to Launch (RTL)**: When RTL mode is engaged, the drone will attempt
    to fly back to its original launch point and land. The `RTL_ALT` parameter is
    used as the AGL altitude for this maneuver. The drone will first rise to the `RTL_ALT`
    (in meters, and the default is 15), fly (in a straight line) back to the launch
    point, and then execute a landing (straight down from hover).

    +   - **Auto**: When engaged, this will trigger autopilot. It will execute a preprogrammed
    set of waypoints (GPS coordinates that indicate a target location), can hover
    at these waypoints for a specified period of time, and execute do commands (such
    as click off a camera shutter, drop a payload—such as a bottle of water to someone
    awaiting rescue, or just about anything else that Pixhawk can control), and then
    move on to the next waypoint. This mode is used quite often in mapping, surveying,
    or inspecting.

    +   - **Acro**: This mode is commonly used for racing drones. Acro stands for
    Acrobatic. No stabilization is given. When you input via the sticks, the drone
    will do whatever you tell it (including crash). You can execute flips, tricks,
    rolls, and so on. It''s not advisable for a payload drone (such as the one we
    just built). Consider this the no limits mode.

    +   - **AutoTune**: It''s extremely handy if you''re building your own drone.
    This mode runs through a 5-7 minute tuning cycle. Basically, what it does is run
    through a series of twitches to set the rates on the stabilization and controls
    to match a 90° per second attitude rate on axis, and reduces the stabilization
    rates so that when the drone reaches a state of equilibrium, it doesn''t bounce
    back, but stops rotating dead still. You must make sure to execute this mode in
    a very wide open area, as the drone will drift greatly during this procedure.
    If you need to correct the drone''s position, the mode will be temporarily suspended
    (until the sticks are returned to the middle position). Take off in **Stabilize**,
    or **Alt Hold**, and then engage **AutoTune** while in the air.

    +   - **Brake**: This attempts to stop the drone as quickly as possible when the
    sticks are returned to middle position.'
  - '[PAGE 171]


    +   - **Circle**: This mode should really be called orbit. Circling implies that
    the drone flies in a circle around a target with the nose pointed toward the direction
    of the flight. This is of course true with airplanes (which we''ll get into in
    the next chapter). However, with multicopters, this mode keeps the nose pointed
    at a target. It can be extremely useful for cinematic shots, as well as for security
    systems and surveillance. Setting the CIRCLE_RADIUS parameter to 0 will keep the
    drone in one spot and rotate the drone on the yaw axis until disengaged. This
    can be useful for panorama shots. When engaged, the pilot has no control over
    the roll and pitch of the aircraft, but can change its altitude.

    +   - **Drift**: It''s a great mode for beginners or fixed wing pilots. If you''re
    familiar with fixed wing controls, this is rather like a bank and yank setup.
    The Pixhawk controls the yaw and roll automatically. The left stick is only used
    to control altitude (throttle), and the right stick controls pitch. Moving the
    right stick left or right will execute an automatic turn (normally a combination
    of yaw and roll) with the user only needing to input (via that x-axis on the right
    stick) the rate of that turn.

    +   - **Guided/Guided_NoGPS**: This mode is not traditionally activated using
    a standard radio. You would want to activate this mode using a GCS (ground control
    station) such as a laptop. It lets you click on various points on the map, and
    the drone will automatically fly to this waypoint. Think of it like an interactive
    Auto mode.

    +   - **Land**: This will attempt to automatically bring the drone down and land
    it. Upon landing, it will automatically shut off the motors and disarm the drone.
    Personally, I wouldn''t advise using this mode unless you have a downward facing
    rangefinder LIDAR.

    +   - **PosHold**: Rather like loiter, whenever the sticks are returned to the
    center position, PosHold will attempt to hold the drone in one place. Consider
    this the mirror to a DJI Phantom''s standard GPS mode.

    +   - **Sport**: This is a bit misleading. This is not the mode for racing drones.
    Rather, this was meant for the film industry to be able to fly high-speed dolly
    style shots low to the ground. It''s a combination of **Stabilize** and Altitude
    Hold (**Alt Hold**). It will hold the altitude where the left stick (throttle)
    is +/- 10% of middle (using a downward-facing rangefinder, optimally). The vehicle
    will not lean more than 45° on the tilt/roll axis, and it will maintain that angle
    until brought back (no position hold). The pilot can still climb or descend at
    up to 2.5 m/s if outside of that +/- 10% of mid-position on throttle.'
