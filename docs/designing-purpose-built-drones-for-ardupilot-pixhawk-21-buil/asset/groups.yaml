  - '[PAGE 85]


    You can also see that we had to compromise on the possibility of a leak destroying
    our Pixhawk. We wanted to create a silicone case for it in order to seal it. We
    thought of creating silicone dummy-plugs. We even thought of sealing the edges
    around the cube section. In the end though, we came to the conclusion that doing
    this on a possibility was outweighed by the certainty of frying our Pixhawk from
    heat. The cube section is actually heated (by design) to allow Pixhawk to operate
    in cold weather. Electronics don''t like heat. And too much heat can even melt
    soldered components and cause shorts. So we decided to focus our waterproofing
    efforts on making very sure that no water can get in before integrating the Pixhawk.


    Next, we sketched up a basic design for BlackOps McDuck (as shown in the following
    figure):


    ![](img/504adb30bdfce87f38258e08f11180af_85_0.png)


    Hard to tell what''s what, right? The sketch isn''t a plan. It''s more like a
    process of just working out how things will go, so that you can see problems as
    you''re thinking about it. A sketch is very quick (5-15 minutes), and lets you
    think about things. Here, you can see that we moved our electronics above the
    water-line (in case of minor leaks). We also worked out where water would come
    in (in the ballast section, front), and be ejected (through the side) of our motor''s
    water cooling. In other words, we now know that we need to carve a channel into
    our clay ballast so that the water intake, and the drive shaft can be well below
    the water line. We also discovered that the rudder needs to be quite tall.'
  - '[PAGE 86]


    Why would the rudder need to be tall? To accommodate the fact that our servo is
    well above the water line. Also, you don''t want the rudder just in the water.
    You want it to be in the path of the propeller''s thrust (so that at low speed
    it can vector the water being pushed and allow for more agility).


    Also, we planned out how the head would turn (on a future version) using a sleeve
    and bearing with a shaft going down to a control rod. This rod would extend to
    the rear of the craft and connect to the same servo driving the rudder (allowing
    the head to turn and face the direction the duck turns).


    Is the sketch hard to read? Yes, for everyone except the person drawing it. That''s
    normal. That''s also why it''s important for the person who will make the design
    to be in on the sketch session (or even to draw the sketch). That''s an important
    thing to know for larger teams. Never do a sketch without the designer around.
    The designer not only needs to know where everything goes, but needs to know why.
    This allows them to adapt the design to overcome problems they may find with the
    sketch (while staying true to the spirit of it).


    Next, we need to order our kitbash boat. We''ll need to know the basic dimensions
    of our hardware before designing the duck. After all everything needs to fit,
    right?


    # Choosing the kitbash boat


    We are mostly looking for something cheap with a water-cooled motor. If we order
    from Amazon, it''s pretty rare that you can take a look inside to see if things
    are modular (not an integrated **electronic speed control (ESC)** or servo). We
    have plenty of ESCs and servos in our workshop so we didn''t care much. But if
    you don''t have a ton of spare parts lying around, you may consider making the
    trip to a local hobby shop to look at the inner workings of a boat before you
    buy. Here''s the boat we picked up (as shown in the following image):'
  - '[PAGE 87]


    <!-- no content -->'
  - '[PAGE 88]


    The following image shows the boat with the lid-off and all the electronics still
    installed:


    ![](img/504adb30bdfce87f38258e08f11180af_88_0.png)


    And the following image shows all of the parts removed from the boat:


    ![](img/504adb30bdfce87f38258e08f11180af_88_1.png)'
  - '[PAGE 89]


    With all the parts laid out, you can see the sleeve that the drive shaft runs
    through (foreground with a white clump of silicone on it), and the drive shaft
    (right side of image next to the black propeller)


    Now, we can measure all our parts (especially the motor), and design the duck
    body.


    # Designing the duck body for 3D printing


    Even if you don''t own a 3D printer, designing for one is handy. Plus, you can
    always ship your designs off to a friend, or service that does have such a device.
    You should eventually get one though, and they are relatively inexpensive nowadays.


    One of the beauties of Computer Aided Design (CAD) is that you don''t actually
    have to use CAD software to create objects in the real world. Confused? Don''t
    be. CAD design and 3D animation software use very similar methodologies for modeling
    objects. They even share (some) file formats. And any 3D modeling software (worth
    its salt) can import and export in CAD formats.


    You don''t have to spend a boatload on AutoCAD or SolidWorks to create and prototype
    your designs. These programs can cost thousands of dollars (per year, or even
    per month) to own. Instead, you can use free software such as Blender to model
    your objects. The additional benefit to these easily accessed software packages
    is that there are tons of YouTube videos and tutorials on their use around the
    internet.


    I''m a 3D animator by education. I''ve used just about every software package
    to create this. For modeling, I like Lightwave 3D only because it''s what I learned
    on originally (back in 1995). If this was for a feature film, I''d probably use
    something else. But the methodologies (regardless of software package) I show
    here are universal in any modeling package (from Blender to Maya, and even in
    AutoCAD to SolidWorks).'
  - '[PAGE 90]


    # # The basics of 3D modeling


    Before we start, here''s what we want to end up with for the outer-hull of our
    duck:


    ![](img/504adb30bdfce87f38258e08f11180af_90_0.png)


    It may be hard to see, but you''ll notice that the duck isn''t solid. Instead,
    there is an inner duck and outer duck. The easiest way to see this is to look
    along the outline on the lower-left of the preceding diagram. This means the duck
    will be hollow, and you can see that the bottom-hull of the ballast section is
    thicker than the rest of the duck. This is because it needs to hold the weight
    of the clay, and be stronger in the event that our duck runs aground.


    You’ll also notice that the duck (although in the upper-right it appears to be
    made up of 4-sided polygons), is made up of triangles. Remember geometry? three
    points define a plane. So, 3D printers like triangle polygons (rather than quads).


    Here''s something you need to know before we show you how it was modeled. There
    are (essentially) two types of models—the ones based on polygons (where each set
    of points is joined by straight lines) and the ones based on curves (where they
    come out much smoother). 3D printers *don''t work with curves*. You must use polygons.'
  - '[PAGE 91]


    <!-- no content -->'
  - '[PAGE 92]


    # Box modeling 101


    There are many different methods for creating 3D models. But box modeling is one
    of the easiest. Other methods can produce greater detail, and can be much better
    for animating. But box modeling can let you create an object quickly, and with
    minimal pain and boredom. So what is it?


    It''s one of the closest techniques to modeling with clay that you can use. It''s
    called box modeling because that''s what you start with, a box (as shown in the
    following diagram):


    ![](img/504adb30bdfce87f38258e08f11180af_92_0.png)'
  - '[PAGE 93]


    Then, we convert the object into subdiv polygons (in lightwave 3D, you just hit
    the Tab key), as shown in the following diagram:


    ![](img/504adb30bdfce87f38258e08f11180af_93_0.png)


    So, it turns into more of a ball shape. And there you have it you''re now working
    with subdivs. Now, let''s talk about the tools.'
  - '[PAGE 94]


    <!-- no content -->'
  - '[PAGE 95]


    ![](img/504adb30bdfce87f38258e08f11180af_95_0.png)


    Let''s take a closer look at how all this worked:


    +   - **Top-left:** The polygons were selected on the top-front of the object

    +   - **Top-middle:** The polygons were extruded, shifted up, and resized to form
    the base of the neck

    +   - **Top-right:** The process was repeated to form the base of the head

    +   - **Bottom-left:** The process was extruded and shifted again to form the
    top of the head

    +   - **Bottom-middle:** The front of the head was selected, extruded, and resized
    to form the base of the duck bill

    +   - **Bottom-right:** The process was extruded once more to form the end of
    the bill'
