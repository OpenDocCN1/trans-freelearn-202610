    # Recommended VTOL RTL procedure


    There are several ways to handle **RTL** with a hybrid like this, but here''s
    what I recommend:


    +   1. Head back (RTL) using the airplane **RTL** mode. This gets you to the vicinity
    quickly.

    +   2. Switch to **QRTL** when close to the home point. If `Q_RTL_ALT`, `RTL_RADIUS`,
    and `Q_RTL_MODE` are set, this happens automatically.

    +   3. Switch to **QLAND** and again, if `Q_RTL_ALT`, `RTL_RADIUS`, and `Q_RTL_MODE`
    are set, this will happen automatically.


    I find this to be the most efficient procedure. No wasting battery time on circling,
    or other maneuvers. Just fly in, switch modes, and land.


    # Notes before attempting any transitions


    I know, after all that effort, you''re going to be itching to see it transition.
    It''s a long and painful road to tune your multicopter mode before even thinking
    of transitioning.


    Make sure you adjust all of the Q tuning parameters so that the multicopter mode
    is flying as stable as possible before doing any hybrid flights. You''ll save
    yourself a lot of expense and headache.


    When attempting transitions, make sure you are well above a minimum height of
    20 m **above ground level (AGL)**. Until you get all of your Q transition parameters
    set, you are very likely to lose altitude, or even lose stability on your first
    tests. Even then, stay above 20 m AGL.'
