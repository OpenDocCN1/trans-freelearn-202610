    Granted, it''s a bit difficult to see past the residue on the clear lid. However,
    if you look close, you can see that the silicone froth has come up all the way
    to the top of the mould box. After most of the bubbles have popped, we transfer
    the mould to the pressure chamber (as shown in the following image):


    ![](img/504adb30bdfce87f38258e08f11180af_60_0.png)


    Again, these chambers are not required. However, it does make for better moulds.
    You may wonder, "Why vacuum air out, and then put it back in?" Well, we''re not
    injecting air back into the mould. By increasing air pressure around the mould,
    we''re forcing any remaining air bubbles within the silicone to shrink to their
    smallest size possible. We''re also forcing silicone into all the nooks and crannies
    of the part. As this particular silicone sets in 30 minutes, we wait at least
    that long before removing the mould from the pressure tank. We increase the pressure
    to about 40 PSI, and let it sit.


    Once the silicone is set (we test by checking the leftovers in our mixing containers),
    we remove it from the pressure tank, and begin the demolding and curing process.


    # Demolding and curing


    When taking a part out of a mould, you have to be very firm but extremely patient.
    You don''t want to pull so hard on a part that you break it (or tear the mould),
    and you don''t want to work so soft that nothing gets done. Once the master part
    is removed, you have a little factory for creating more parts. Just mix some plastic,
    spray some mould release, and put it in your chambers the same way as before.'
