    \ on this channel. Use this in place of using the trim functionality on your controller.\n\
    - **STALL_PREVENTION**: This is used to enable or disable stall prevention. An\
    \ airspeed sensor (pitot) is required for this feature.\n- **TECS_CLIMB_MAX**:\
    \ This is the maximum climb rate (in meters per second) an aircraft can climb\
    \ at THR_MAX (while maintaining airspeed).\n- **TECS_SINK_MIN**: This is the maximum\
    \ sink rate of an aircraft while throttle is set to THR_MIN and the aircraft does\
    \ not accelerate beyond the CLIMB_MAX speed.\n- **TELEM_DELAY**: This is the number\
    \ of seconds to wait after Pixhawk boots up to begin sending telemetry data.\n\
    - **TERRAIN_FOLLOW**: This enables the ability of Pixhawk to follow the altitude\
    \ of the terrain below it during autonomous flight modes. You should have the\
    \ ground control station connected to enable this feature. It uses terrain data\
    \ to calculate altitude rather than merely using altitude in relation to the home\
    \ point.\n- **THR_FAILSAFE**: This enables/disables the functionality of activating\
    \ a failsafe even if the throttle drops below a specific value. It's a good way\
    \ of testing for a receiver signal from the radio transmitter. For instance, if\
    \ your transmitter's minimum throttle is a PWM value of 980, upon disconnect the\
    \ throttle may drop to 0. So, setting a value of 950 would be good.\n- **THR_MAX**:\
    \ This is the maximum throttle that Pixhawk can apply to the motor (in percentage).\n\
    - **THR_MIN**: This is the minimum throttle for Pixhawk to apply to the motor.\
    \ For autonomous landings, you'll want to set this to 0. For ESCs that allow for\
    \ reverse thrust, you may set this to a negative value to act as a brake.\n- **THR_SLEWRATE**:\
    \ This is the maximum amount of change per second. This will make throttle transitions\
    \ more smooth. Be careful though, as setting this value too low may result in\
    \ a stall.\n- **THROTTLE_NUDGE**: This allows the pilot to nudge the throttle\
    \ up or down when in automatic throttle flight modes.\n- **TRIM_AUTO**: This enables\
    \ Pixhawk to automatically adjust trim values for controls surfaces when not in\
    \ the manual mode.\n- **TRIM_THROTTLE**: This is the throttle to be applied (in\
    \ percentage) during normal flight.\n- **TUNE_CHAN**: This enables the ability\
    \ to tune PIDs using a knob or slider on your transmitter (value specifies the\
    \ channel).\n- **TUNE_MODE_REVERT**: This enables or disables Pixhawk reverting\
    \ to previously saved tuning settings on a mode change. During tuning, changes\
    \ are saved every 10 seconds. So, you'll have 10 seconds to revert by changing\
    \ the modes.\n- **TUNE_PARAM**: This sets which parameter is tuned using the **TUNE_CHAN**\
    \ functionality.\n- **TUNE_SELECTOR**: This is the switch channel on your remote,\
    \ which will enable the **TUNE_CHAN** functionality.\n- **WP_LOITER_RADIUS**:\
    \ This sets the radius (in meters) around a waypoint to circle during LOITER.\
    \ If set to a negative number, the orbit will be counter-clockwise.\n- **WP_MAX_RADIUS**:\
    \ This overrides the waypoint radius set in the Flight Plan Screen with a new\
    \ value that dictates the radius from a waypoint for it to be considered completed.\
    \ A value of 0 offers no override at all and leaves the waypoint radius of a mission\
    \ intact.\n- **WP_RADIUS**: This is similar to **WP_MAX_RADIUS** with no override.\
    \ This is to avoid endlessly circling a waypoint, which has a radius too small\
    \ for the aircraft to meet.\n\n## Summary\n\nIn this chapter, we reviewed many\
    \ of the interface components of Mission Planner. We also covered some features\
    \ we haven't mentioned before. It's important to note that this chapter is meant\
    \ mainly as a reference for your future use in your adventures developing prototypes\
    \ using Pixhawk.\n\nIt's our sincere hope that you learned about Pixhawk, and\
    \ prototype design built around it, as well as the fabrication of prototypes and\
    \ bringing your ideas to life. We hope you enjoyed this book as much as we enjoyed\
    \ writing it. Thank you for reading it, and you should congratulate yourself.\
    \ It's an awful lot of information to consume!\n\n## Index\n\n3\n360 VR video\n\
