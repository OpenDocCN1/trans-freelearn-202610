    Not only that, but **electromagnetic (EM)** interference is your enemy in the
    air. It can completely disrupt your video, telemetry, GPS, or even control signals.
    So never wrap your cables in circles. Instead, notice that they''re wrapped up
    in figure-eights (especially power leads).


    Since we''re on this angle—don''t leave out any screws! A lot of old-school drone
    pilots come from the fixed-wing world. A common practice in these circles is to
    only screw down motors with two screws. Don''t do that. If a screw vibrates loose,
    and you lose a motor, your multicopter can turn into a rock falling from the sky
    pretty quickly.


    When dealing with multicopters, you have to remember that even a piano has a better
    glide profile than a multicopter.


    It''s not unheard of for kit manufacturers to throw in a few extra screws. If
    you find extra screws when you are done, double-check every screw to make sure
    you put them in. If they seem superfluous they''re not.


    # GPS on a stick


    You may also notice that the GPS antenna is mounted on a mast (as shown in the
    following image):


    ![](img/504adb30bdfce87f38258e08f11180af_158_0.png)'
  - '[PAGE 159]


    You want your GPS to be well out of the plane of your motors. Remember that electric
    motors work via a magnetic field. The very definition of EM, right? So keep it
    up and out of the way of these motors. The plane that the motors are running on
    won’t necessarily kill your GPS. But it could. Why take the chance, right? It
    may look weird. But a crashed drone looks worse.


    # Rails are awesome


    Rails have been used in the television and film industry for a very long time.
    Simply put, they’re a standardized system for mounting accessories. In fact, rails
    (in several different forms) are used in everything from firearms (picatinny rails
    for sights, flashlights, lasers, and other accessories) to cinema cameras (for
    matte boxes, follow focus, monitors, external hard drives, and so on). Rails for
    drones are the center of a drone. All major hardware is attached to the rails.
    The main airframe, the landing gear, the gimbal, and even in most cases, the batteries
    are mounted to the rails. You can see the rails for our drone in the following
    image:


    ![](img/504adb30bdfce87f38258e08f11180af_159_0.png)


    Here, you can see the two carbon fiber tubes (the rails) with the airframe attached
    (using rubber grommets inside of aluminum d-rings), our gimbal attached, the landing
    gear supports attached, and even a blank rail mount (top) in case we decide to
    mount another accessory in the future.'
