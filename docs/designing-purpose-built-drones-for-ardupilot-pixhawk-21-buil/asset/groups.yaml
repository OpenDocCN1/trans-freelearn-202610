  - '[PAGE 27]


    These are certainly some altruistic and noble uses for swarming, but the military
    also sees the benefit of drone swarms. The following image shows a recent test
    of drone swarms (deployed by dropping them from a pair of f-18 Hornets) used to
    map out a battle-field in real-time for mission commanders and soldiers on the
    ground:


    ![](img/504adb30bdfce87f38258e08f11180af_27_0.png)


    Drone swarms can also be used by the entertainment industry to cover sporting
    events, if one drone is running low on batteries, another takes off to take its
    place. Drone swarms could be deployed over golf courses to help enthusiasts find
    their ill-hit balls that have gone off into the weeds. Farmers could use drone
    swarms to monitor crops, plant seeds, monitor watering patterns (and waste from
    evaporating water, or atomized sprinklers going into the air).


    Again, the uses for drones are limitless.


    We could list potential uses for drones all day, all night, every day, and every
    year, for our lifetimes. So, how do we realize this potential?


    Well, to figure out how to make drones, we''ll always first start off with how
    to implement existing tech and components to make what we want. The first step
    is to think in terms of what types of drones exist currently.'
  - '[PAGE 28]


    # Types of drones


    Drones come in two categories with several subcategories. There are surface/subsurface
    drones, and aerial drones. Let''s dive further into each.


    # USV drones


    USV simply stands for either Unmanned Surface Vehicle or Unmanned Submersible
    Vehicle. The same acronym of USV is used for both. These types of drones are usually
    referred to as Rovers or Submersibles respectively.


    # Rovers


    Rovers usually either have treads (like a tank) or wheels (like a car). The Mars
    Rovers are great examples of USV Rovers. They move along the surface of Mars taking
    various readings and measurements in an effort to explore the surface of another
    planet without the risk to human life. The following picture shows one of these
    Mars Rovers:


    ![](img/504adb30bdfce87f38258e08f11180af_28_0.png)


    Not every endeavor for a rover needs to be quite so lofty as to explore another
    planet. Rovers are currently used in aspects of our daily lives (the iRobot Roomba
    is a daily life example of a USV Rover) all the way through exploring our own
    planet (rovers designed to explore lava flows—areas far too dangerous and inhospitable
    to humans).'
  - '[PAGE 29]


    However, rovers don''t have to simply be driven across the ground. Some rovers
    are actually boats designed to skid across the surface of water for various purposes.
    An example of boat-drone USV is the one designed by the US Navy to escort ships
    through pirate-ridden waters, and protect naval vessels from other hostile vessels
    in dangerous waters (eliminating, or at least reducing, the need for bloated battle-groups).


    In this book, we will be designing three surface rovers:


    +   - A basic autonomous RC car which serves no purpose other than your education
    on the basics of implementing the Ardupilot interface.

    +   - A water USV that serves the purpose of a duck decoy which autonomously navigates
    pre-planned routes around a pond for hunters. Hmm... one wonders what that might
    go for in a store?

    +   - A ground USV golf caddy. This will show you how to make a rover follow a
    GPS tracker (in the form of the user''s cell phone). This caddy is designed to
    move your clubs around the golf course without having to carry your bag, nor even
    tell the caddy where to go. It will simply follow you.


    # Submersibles


    Submersibles are vehicles designed to go beneath the surface of a liquid. Traditionally,
    this liquid is water. However, submersible vehicles could potentially be used
    to monitor other liquids, such as fermentation tanks at breweries, mixing tanks
    at chemical plants, and diving into raw sewage tanks. Other than diving into a
    vat of beer, I''m sure you can see how using drones is preferable to diving in
    yourself.


    We won''t be attempting to create a submersible in this book. However, the techniques
    employed are very similar to the subject matter of this book. Submersibles should
    only be attempted by highly experienced drone designers, as they''ll have to contend
    with reduced ability to utilize GPS, reduced radio transmission distance, and
    highly reduced visibility in water (or other liquids). Therefore, technologies
    such as **forward looking infrared (FLIR)**, signal repeaters, and collision avoidance
    (via SONAR) should be considered. However, as you can see from the following image,
    the similarities between underwater drones and fixed-wing aerial drones (airplanes)
    are fairly obvious:'
