    even jet engines. Now, they didn''t even have to fly autonomously, the radio-controlled
    airplane that grandpa flew on weekends was a drone.


    Then, it went further. The guidance systems used in multicopter drones were being
    repurposed to control ground vehicles (rovers) and water vehicles (boats and submersibles).
    Now, in 2017, you actually hear companies coming out with underwater drones.


    In short, the answer to the original question, "What (exactly) is a drone?" is
    simply a robot-a vehicle of any type that is either not controlled by a human
    (autonomous) or controlled by a human via remote control. It may not be the Oxford
    English Dictionary''s definition, but it is the definition that the common public
    accepts when they hear the word drone.


    And, as for the proof that we''re living in the Drone Era? In the height of the
    space age (the mid-1980s), men on rocket packs flew into stadiums for the opening
    ceremonies for the 1984 Olympics, and even during the Super Bowl XIX half-time
    show. Now, we have drone-shows for those same venues. Of course, we still have
    a ways to go for full-fit drone acceptance. After all, the drone part of the half-time
    show had to be filmed days earlier for fear of a drone attack during the show,
    or at least fear of mass hysteria in the venue. But we''ll take it.


    ## Purposes for drones


    Drones are just for taking pictures, right? Wrong! Drones can be useful for just
    about anything and everything. Here are just a few examples:


    - Suffering in a drought (hello, California) but need to water your crops? You
    can use a drone to map your whole farm. Then, run analysis on crop health, so
    that you know where to direct water. All the while sipping iced tea on your porch.

    - Want to walk the golf course, but don''t want to hire a caddy or carry your
    own clubs? Caddy drone to the rescue! Make a motorized golf trolley, and have
    it follow the GPS signal on your cell phone as your walk the golf course.

    - Maybe you''re a herpetologist on an expedition to a remote location and you
    found a new species of tree frog. Get it back to base-camp from miles away in
    an autonomous powered glider. Just load the frog into the payload bay, give it
    a toss above the treeline and let it fly (and land at) home! Then, just wait for
    base camp to get the specimen and send the powered glider back to you for your
    expedition to continue.

    - You''re a lifeguard at a beach and see someone having trouble. Launch an aerial
    drone that drops a boat-drone to tow the person back to shore. All the while,
    you don''t have to leave your station (leaving the rest of the beach-goers without
    a lifeguard). You can meet the victim at the beach with medical supplies you may
    need and you''re not too exhausted to help out!


    The list goes on and on and on. If you can think of something requiring delivery
    of an item, manual labour requiring movement to another location, or just something
    to save time, a purpose for a drone will be found. The possibilities are quite
    literally limitless.


    These are certainly some altruistic and noble uses for swarming, but the military
    also sees the benefit of drone swarms. The following image shows a recent test
    of drone swarms (deployed by dropping them from a pair of f-18 Hornets) used to
    map out a battle-field in real-time for mission commanders and soldiers on the
    ground:


    ![](img/504adb30bdfce87f38258e08f11180af_27_0.png)


    Drone swarms can also be used by the entertainment industry to cover sporting
    events, if one drone is running low on batteries, another takes off to take its
    place. Drone swarms could be deployed over golf courses to help enthusiasts find
    their ill-hit balls that have gone off into the weeds. Farmers could use drone
    swarms to monitor crops, plant seeds, monitor watering patterns (and waste from
    evaporating water, or atomized sprinklers going into the air).


    Again, the uses for drones are limitless.


    We could list potential uses for drones all day, all night, every day, and every
    year, for our lifetimes. So, how do we realize this potential?


    Well, to figure out how to make drones, we''ll always first start off with how
    to implement existing tech and components to make what we want. The first step
    is to think in terms of what types of drones exist currently.


    ## Types of drones


    Drones come in two categories with several subcategories. There are surface/subsurface
