    large amounts of money each time you fly in whatever lighter-than-air gas you
    choose to use (helium, hydrogen, and so on). They are also highly susceptible
    to strong wind currents (due to their lighter-than-air nature). So, strong engines
    must be employed to counteract those currents. This adds more weight and therefore
    more size to the blimp. Due to these limitations and costs, dirigibles are not
    widely used.


    It''s a shame, because mechanically, they are the simplest drones to design. It
    is just that in practice, they are expensive and largely impractical.


