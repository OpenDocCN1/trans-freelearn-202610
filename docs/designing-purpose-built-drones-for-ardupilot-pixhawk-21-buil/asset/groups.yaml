    Also, hunting is boring. Go out to an area and wait, and wait, and keep waiting
    until eventually some ducks show up. What if you could make the waiting process
    more fun? What if you could drive a duck around on the pond, or even let it drive
    itself and navigate the pond? What if you could show off a new toy to your buddies
    that they don''t have? And most importantly, what if (when you''re done for the
    day) you could have your duck return to you?


    It solves some problems, it has the show-off factor, and it also caters to an
    industry that is spread throughout the country where accessories are essential
    and people spend a boatload (pun intended) on these accessories.


    Best of all, even though you''d be using existing technology, the idea is potentially
    patentable! There are tons of ideas that use existing tech in new ways that have
    patents. So, not only can you make an item that is marketable... it''s an idea
    that you could license and sit back and let money roll in. These are all great
    reasons to make a duck decoy drone.


    As I said, I''m not a hunter. I love aircraft (especially the F-117 stealth fighter).
    So, knowing nothing about ducks (really), nor the hunting thereof, I made my duck
    decoy with a faceted design just to make the prototyping phase more fun. So meet
    the stealth duck (also known as Black Ops McDuck), as shown in the following image:


    ![](img/504adb30bdfce87f38258e08f11180af_83_0.png)


    As you can see, it''s 3D printed. But at least it''s not pink, right?


    ### Outlining the scope before you design


    Before we actually start putting pencil to paper (or rather mouse to CAD, in this
    case), we need to outline some basic needs and layout of the duck. Let''s start
    with the problems and solutions analysis that we did on the design.


    The following table lists the problems and solutions we worked up, although the
    original table was handwritten, this one is far more legible:


    | Problems we''ll encounter | Solutions |

    |---|---|

    | Water leaking into seams of the model | CA glue seams, and fill with silicone
    sealant. |

    | Water leaking into the location where the propeller shaft meets up with the
    body | Stationary sleeve for shaft filled with grease and sealed (on the outside)
    with silicone. |

    | Water leak on access lid | Silicone sealant o-ring. |

    | In event of water leak, waterproofing Pixhawk | Silicone moulded Pixhawk case?
    (No). |

    | Pixhawk heat from silicone moulded case? | Can''t seal it. Must make body as
    water-tight as possible. Test water-tightness in every stage leading up to Pixhawk
    integration. |

    | GPS reception with internal antennae | Shouldn''t be a problem with a PLA plastic
    body. |

    | Motor EM interference with GPS | Place motor up front and GPS antennae toward
    the back. |

    | Motor heat in a sealed body | Water cooled motor. |

    | ESC heat in a sealed body | Water cooled ESC, or low-voltage ESC / Motor. |

    | Expense of motor, drive shaft, and prop | Kitbash a cheap RC boat. |

    | Balancing motor, ESC, and prop for efficiency | Kitbash a cheap RC boat. |

    | Duck is too large for 3D printer | Print in sections, use CA glue to join, and
    seal with silicone when dry. |

    | Interfacing Pixhawk with cheap RC boat parts | Make sure the boat we buy is
    modular (not integrated ESC or servo into receiver) or at least minimize integrated
    parts so we have to replace as few parts as possible. |

    | What if we want the head to turn with rudder? | Don''t do this on initial prototype.
    But print head as a separate section so it can be adapted later if we want. |

    | PLA plastic print or ABS? | PLA for the body (cheaper). But ABS for motor mount
    (higher melting temperature). |

    | Tipping from waves or turns? | Large ballast section filled with modeling clay.
    |


    We had other problems that we encountered along the way, which were unforeseen.
    We''ll get to these later. But as you can see from the details in our overview
    chart, we tried to minimize these as much as possible. Positive thinking is great.
    But when planning, you have to be your own nay-sayer in order to predict the problems
    you''ll have. Then, you can think positively to come up with solutions.

