    # The Flight Data interface


    The following image shows the flight data interface for Mission Planner:


    ![](img/504adb30bdfce87f38258e08f11180af_241_0.png)


    The top-left window represents the Heads-up Display (HUD)—where you can instantly
    tell the orientation, altitude, and status of the aircraft. Warning messages appear
    as red text (such as the DISARMED and Bad AHRS warnings we see in the image).


    The large window is a projected satellite map showing the location of the aircraft/multicopter/rover
    (in this case, a fixed wing aircraft). Protruding from the aircraft is a purple
    line representing the direction the aircraft is pointing at.


    The window on the lower-left shows current data with several tabs to see data
    presented in different formats, and even transmits signals to the Pixhawk. The
    tabs are follows:


    +   - **Quick:** These are the numerical values of basic telemetry data from the
    vehicle.

    +   - **Actions:** This allows the user to send commands to Pixhawk such as Loiter,
    Arm, and so on.

    +   - **PreFlight:** This shows a checklist and status for preflight before launching
    the Pixhawk vehicle. Green represents the items that are ready and red represents
    items which may require attention.'
  - '[PAGE 242]


    +   - **Gauges**: This shows an analog view with similar information to the quick
    screen. This analog view uses graphic representation in the form of virtual gauges
    rather than simple numbers.

    +   - **Status**: This provides a detailed readout of every single telemetry parameter
    the vehicle is experiencing.

    +   - **Telemetry Logs**: This lets the user load flight logs from Pixhawk into
    the computer and replay the mission to evaluate the mission post-mortem.

    +   - **DataFlash Logs**: This is used to troubleshoot problems with Pixhawk.
    If you are experiencing problems with tuning or missions, these logs can be extremely
    useful to spot errors. Also, when asking for help from a community, the first
    question they’ll ask is for you to provide these logs for analysis.

    +   - **Messages**: This provides a real-time view of log entries as they happen.


    # The Flight Plan Screen


    The following image shows the Flight Plan Screen (without fixed-wing tuning mission
    loaded):


    ![](img/504adb30bdfce87f38258e08f11180af_242_0.png)


    The main window shows a satellite map of the mission area. The yellow lines represent
    the desired path of the vehicle, while the white circles represent the area for
    the turning arc (turning radius). The green markers represent the actual waypoint
    targets for the mission.'
  - '[PAGE 243]


    The bottom window is a chart representing all of the parameters for the mission.
    In this window, you can add events (such as Do Jump, which sends the vehicle back
    to a specific waypoint). If your camera is attached to Pixhawk, you can tell the
    camera to take an image/start recording. Flight modes can be set to change as
    well (such as "Land"). Any command Pixhawk is capable of executing can be triggered
    using this interface.


    The window on the far right allows you to save missions for later use (to your
    computer), load previous missions, change the type of satellite map. Different
    maps can prove to be more/less detailed, and can also prove to be more/less current.
    Finally, at the bottom of this window, is a section that allows you to read the
    current waypoints loaded into Pixhawk, or write the waypoints you''ve just created.
    You must write waypoints for Pixhawk to execute the mission. The home point is
    also displayed here.


