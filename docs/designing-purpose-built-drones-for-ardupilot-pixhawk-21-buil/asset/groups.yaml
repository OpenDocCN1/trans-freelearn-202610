    # # About the Author


    **Ty Audronis** has been called "a technology-age renaissance man." He’s a professional
    drone pilot, post-production specialist in the entertainment and media industries,
    a highly experienced interactive game developer, and an accomplished digital artist.
    He has worked for companies ranging from frog Design to California Academy of
    Sciences in roles, where he has worn many hats.


    Ty has been programming software and games since 1981 (when he was 8 years old)
    professionally. He majored in “Computer Generated Animation and Visual Effects”
    in college (where he won “Best Animation” for the entire CSU system – a Rosebud
    Award). He has been building drones since the days when sensors and components
    had to be torn out of cell phones and game controllers.


    Ty is also a mentor, having taught many interns his skills and speaks regularly
    at venues, including Interdrone. He also serves on the advisory board for the
    Society of Aerial Cinematographers and for Genarts (now Boris) Sapphire.'
  - '[PAGE 5]


    # About the Reviewer


    **Ayan Pahwa** is an embedded software engineer from New Delhi, India currently
    working at Mentor Graphics - a Siemens business with 5 plus years of experience
    in building and racing first person view multi-rotor drones. His professional
    work areas mainly focus on embedded firmware, device drivers, automotive IoT,
    and Linux system programming. He has co-founded SDIoT for flourishing drone and
    other new technologies within local communities. His drone aerial videos can be
    viewed on his YouTube channel.


    **Ersin Gonul** is a senior design engineer at Turkish Aerospace Industries in
    Ankara, Turkey. Previously Gonul worked as R & D engineer for companies which
    they develop unmanned aerial vehicles. He graduated with honors from Selcuk University
    in Electrical and Electronics Engineering and also he holds a Master degree of
    Electrical and Electronics Engineering from the Hacettepe University, Ankara.
    His expertise based on helicopter autopilots and unmanned systems. He is passionate
    about aviation, multicopters, VTOLs and their control systems. He also holds a
    Private Pilot License (PPL-H).'
