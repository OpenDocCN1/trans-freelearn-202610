    Let''s take a quick look at the building techniques on a multicopter drone.


    # Too many freakin'' wires!


    That thing looks like a mess, doesn''t it? It''s not. Cable management is the
    key. You don''t want any wires in danger of obstructing (or even breaking) propellers.
    That spells instant crash. The following image shows how the wires to the ESCs
