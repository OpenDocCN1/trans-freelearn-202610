- raw:
  - '[PAGE 23]


    The industry stopped resisting the term drone. I remember on my first drone book
    with Packt, *Building Multicopter Video Drones*, resisting the word *drone* in
    the title. But they convinced me it would be good for search engine food. As we
    (in the industry) stopped resisting the term and started educating the public
    about the safety, best practices, and usefulness of drones the negative implications
    lost all meaning. And (as in the following image), drones even took on an entirely
    new meaning:


    ![](img/504adb30bdfce87f38258e08f11180af_23_0.png)


    A group of drone pilots from "Humanitarian Drones" and FEMA team members assisting
    in Port Arthur, TX during Hurricane Harvey relief efforts. Photo by Daniel Herbert
    (of Humanitarian Drones)


    Suddenly, drones were saving lives (with search and rescue), helping people recover
    from disasters (with assessment of damage, as shown in the following image), and
    responsible for great shots in feature films and people’s favourite documentaries.
    Then, something completely weird happened:'
  - '[PAGE 24]


    ![](img/504adb30bdfce87f38258e08f11180af_24_0.png)


    A DJI Inspire 2 conducting damage assessment and mapping in the aftermath of Hurricane
    Harvey in Houston, Texas. Photo taken by Brian Scott of Humanitarian Drones


    Drones were no longer multicopters. The term covered anything that flew under
    remote control. This happened with the FAA''s small Unmanned Aerial System (sUAS)
    rules. The media dubbed these rules drone legislation. Suddenly, drones had wings,
    even jet engines. Now, they didn''t even have to fly autonomously, the radio-controlled
    airplane that grandpa flew on weekends was a drone.


    Then, it went further. The guidance systems used in multicopter drones were being
    repurposed to control ground vehicles (rovers) and water vehicles (boats and submersibles).
    Now, in 2017, you actually hear companies coming out with underwater drones.'
  - '[PAGE 25]


    In short, the answer to the original question, "What (exactly) is a drone?" is
    simply a robot-a vehicle of any type that is either not controlled by a human
    (autonomous) or controlled by a human via remote control. It may not be the Oxford
    English Dictionary''s definition, but it is the definition that the common public
    accepts when they hear the word drone.


    And, as for the proof that we''re living in the Drone Era? In the height of the
    space age (the mid-1980s), men on rocket packs flew into stadiums for the opening
    ceremonies for the 1984 Olympics, and even during the Super Bowl XIX half-time
    show. Now, we have drone-shows for those same venues. Of course, we still have
    a ways to go for full-fit drone acceptance. After all, the drone part of the half-time
    show had to be filmed days earlier for fear of a drone attack during the show,
    or at least fear of mass hysteria in the venue. But we''ll take it.


    # Purposes for drones


    Drones are just for taking pictures, right? Wrong! Drones can be useful for just
    about anything and everything. Here are just a few examples:


    +   - Suffering in a drought (hello, California) but need to water your crops?
    You can use a drone to map your whole farm. Then, run analysis on crop health,
    so that you know where to direct water. All the while sipping iced tea on your
    porch.

    +   - Want to walk the golf course, but don''t want to hire a caddy or carry your
    own clubs? Caddy drone to the rescue! Make a motorized golf trolley, and have
    it follow the GPS signal on your cell phone as your walk the golf course.

    +   - Maybe you''re a herpetologist on an expedition to a remote location and
    you found a new species of tree frog. Get it back to base-camp from miles away
    in an autonomous powered glider. Just load the frog into the payload bay, give
    it a toss above the treeline and let it fly (and land at) home! Then, just wait
    for base camp to get the specimen and send the powered glider back to you for
    your expedition to continue.

    +   - You''re a lifeguard at a beach and see someone having trouble. Launch an
    aerial drone that drops a boat-drone to tow the person back to shore. All the
    while, you don''t have to leave your station (leaving the rest of the beach-goers
    without a lifeguard). You can meet the victim at the beach with medical supplies
    you may need and you''re not too exhausted to help out!


    The list goes on and on and on. If you can think of something requiring delivery
    of an item, manual labour requiring movement to another location, or just something
    to save time, a purpose for a drone will be found. The possibilities are quite
    literally limitless.'
  - '[PAGE 26]


