    +   - Upon activation, Pixhawk will set default values for your PIDs (found on
    the tuning page of mission planner). These values are dependent upon your AUTOTUNE_LEVEL.

    +   - Pixhawk will constantly monitor your pitch and roll rates to see if they
    exceed 80% of your maximum rates set in mission planner. You will use your sticks
    to help Pixhawk learn how your aircraft behaves using this.

    +   - Every 10 seconds, new rates will be saved based on the monitoring of your
    aircraft by Pixhawk. In other words, if your aircraft becomes unstable, you have
    10 seconds to switch to manual and cancel the current rates. It''s kind of like
    an undo feature.

    +   - Starting with the default, Pixhawk rates will make your aircraft seem sluggish.
    But as you progress with AUTOTUNE mode, you''ll notice the handling getting better
    and better. Make sure you have plenty of room, because at first this will mean
    very wide and slow turns.


    # How to fly in AUTOTUNE


    AUTOTUNE is not a subtle process. Anyone watching the airplane will think you
    may be flying under the influence. It''s dependent upon extreme movements on the
    sticks so that Pixhawk knows how to react to extreme circumstances.


    First, you''ll want to tune ailerons, then elevators (roll, then pitch). To do
    this, just move the aileron control full left quickly. This will make the aileron
    move to maximum deflection. Hold it there for a minimum of 2 seconds. Don''t worry,
    the plane will not roll over. It will stop its bank at the maximum bank angle
    we had set before. Then, quickly move the stick to the right and hold it there
    for a minimum of another 2 seconds. After moving both left and right you have
    completed one cycle.


    With each cycle the tuning improves by roughly 5%. The Pixhawk manual states that
    you should do 20 full cycles. However, doing more does improve the tuning. So,
    I suggest a minimum of 30 cycles (but find myself doing 40-50 any time I am doing
    an AUTOTUNE).'
