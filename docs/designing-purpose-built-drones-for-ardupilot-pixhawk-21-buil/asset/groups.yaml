    # Implementing Pixhawk


    In previous iterations of this type of hybrid, you would need to use PX4 firmware
    (rather than Ardupilot or APM) with heavy customization. Luckily, the newer Ardupilot
    firmware versions allow for exactly this type of VTOL (they call it a Quadplane).
    Obviously, the channels are going to be a little different.


    The following diagram shows how all of the motors/servos are hooked up:


    ![](img/504adb30bdfce87f38258e08f11180af_233_1.png)'
  - '[PAGE 234]


    <!-- no content -->'
  - '[PAGE 235]


    |  |  |

    |---|---|

    | ARMING_RUDDER | If you set this value to 2, it enables you to disarm your motors
    via the hard left rudder and throttle down. However, be careful not to fly your
    plane by cutting throttle to zero and ruddering hard left or you will disarm your
    aircraft. |

    | Q_THR_MID | This is a value from 0-1,000; 500 is 50% throttle (and default).
    This is how much throttle the multicopter motors require to maintain a hover.
    During the tuning process, if you notice a surge in altitude during the transition
    to airplane mode, decrease this level. If you see a drop, increase this level.
    |

    | Q_TRANSITION_MS | This is how long it takes for the Pixhawk to slowly power
    down the quad motors (how long to power down the motors after the minimum airspeed
    for lift is achieved) and vice versa. Default is 5000 (5 seconds). |

    | ARSPD_FBW_MIN | This is the minimum airspeed for the wings to supply lift. (Triggers
    Q_TRANSITION_MS when reached during transitions.) |

    | Q_VFWD_GAIN | This is set to 0 by default. If this is set to anything above
    zero, this is how much the tractor (airplane thrust) motor is used to help keep
    the multicopter level into a wind. Only use this if you''re feeling advanced.
    |

    | Q_ASSIST_SPEED | This parameter is used to help provide lift to the aircraft
    when dropping below its set speed threshold. This is not a transition to quad
    flight. Instead, this is still airplane flight with the quad props helping to
    keep the airplane from stalling. |

    | Q_ASSIST_ANGLE | In conjunction with Q_ASSIST_SPEED, this can be very useful.
    Before actually stalling, an aircraft begins to lose altitude at low speeds. This
    is the angle of descent during level flight that the quad motors will kick in
    and give extra lift. During AUTO, LOITER, RTL, or GUIDED mode, the quad motors
    will assist with any climb rate to get the aircraft to the next waypoint (or navigation
    controller demanded) altitude. In FBWB, the quad motors will assist with the desired
    climb rate. In FBWA, the quad motors will give proportional lift based on the
    pilot''s ascent or descent rates. This assistance is only recommended with Quadplanes
    that do not have enough wing-lift to maintain altitude in plane mode alone. You''ll
    find efficiency and battery life will be significantly decreased when using this
    parameter. |'
  - '[PAGE 236]


    | RTL_RADIUS | This is the distance from the launch point that the aircraft turns
    from airplane RTL mode to VTOL QRTL mode (transitioning from airplane to multicopter).
    |

    | Q_RTL_ALT | The altitude aimed for during QRTL mode. |

    | Q_RTL_MODE | Set this to 1 to enable auto transitioning (using RTL_RADIUS and
    Q_RTL_ALT) during RTL. |

    | Q_WVANE_GAIN | How actively the aircraft tries to turn into the wind during
    multicopter mode. Due to the nature of a VTOL airplane, the motors may need to
    work too hard to keep the tail from swinging around downwind. This gain allows
    the plane to "give in" to the wind. |


    ![](img/504adb30bdfce87f38258e08f11180af_236_0.png)


    Quadplanes require GPS to fly properly. Make sure you wait for the signal that
    you have a 3D GPS fix before attempting any flight.


    # Quadplane flight modes


    The flight modes specific to a Quadplane are flight modes for multicopter mode.
    They are as follows:


    +   - **QSTABILIZE**: Just like regular multicopter stabilize. Roll and pitch
    control the lean angle, but when releasing the sticks, the multicopter returns
    to level (but may drift). Similar to DJI''s **ATTI** mode.

    +   - **QHOVER**: Just like regular multicopter altitude hold. This holds an altitude,
    and you can position the multicopter using roll, pitch, and yaw controls. Releasing
    the sticks stops the multicopter and makes it maintain a position in a hover.

    +   - **QLOITER**: Just like regular multicopter loiter. It''s also much like
    **QHOVER**, but you do have control over the altitude of the aircraft. Just like
    DJI''s **GPS** mode.

    +   - **QLAND**: Just like regular multicopter land. This makes the vehicle descend
    and land regardless of its physical location. Unfortunately, this mode is not
    as sophisticated as multicopter landings. If there is a GPS shift while on the
    ground, the aircraft could tip over trying to get back to the previous location.
    So you should shift to **QSTABILIZE** once on the ground as this doesn''t get
    affected by GPS drift.'
