- raw:
  - '[PAGE 61]


    The final step before you store the mould is making sure it lasts. Silicone cures
    under UV light (most silicones at least). You can always buy some UV lights and
    make your own curing chamber. Mine is a simple ice chest with a white liner, and
    a string of LED UV lights. Letting it sit in the box overnight should be good
    enough (as shown in the following image):


    ![](img/504adb30bdfce87f38258e08f11180af_61_0.png)


    So, why did we spend so much time on mould making? Because being able to make
    your own parts is crucial in drone design. These are electronic and mechanical
    beasts. You must be able to mount your sensors securely, and you may even need
    to make custom parts for other purposes (as we''ll see in Chapter 3, *A Drone
    for Hunters - Autonomous Duck Decoy*). Why not get it out of the way as soon as
    possible?


    # Hooking up your Pixhawk


    Now that we have somewhere to put our Pixhawk, we can go over how to attach it
    and program it for a basic rover. The Pixhawk comes with several strips of ¼”–thick
    foam tape. This stuff is great. It absorbs vibrations and shocks to the Pixhawk
    that could potentially throw off sensor readings. Before using it though, make
    sure you clean off your part. Mould-release spray is very oily stuff, and is meant
    to keep things from sticking together. Simple liquid dishwashing soap does the
    trick perfectly. I like Dawn, as it cuts grease especially well and is easy to
    rinse off.'
  - '[PAGE 62]


    We can just hot glue our mount into the frame of the rover, and then foam tape
    the Pixhawk in. Notice that the USB port is still above the side guard to allow
    access for programming, as shown in the following image:


    ![](img/504adb30bdfce87f38258e08f11180af_62_0.png)


    Our Pixhawk is level, secure, protected, and pink. The first component we''re
    going to hook up will be the GPS.


    # Global Positioning System (GPS)


    Although we can hook up two GPS antennas for more accuracy, as the process is
    the same for both, we''re only going to use one. Besides, we''re a bit pressed
    for space on this rover.


    The first thing you''ll notice is with most GPS antennas, the plugs do not match.
    In fact, they don''t on most components you''ll buy for Pixhawk 2.1. The powers
    that be have elected to change the plug configuration to something of an entirely
    different shape. Although these plugs are far superior to previous versions (they
    lock in place and can obviously only fit in one way); it means that changing plug
    ends is needed.'
  - '[PAGE 63]


    Luckily, the Pixhawk 2.1 comes with patch-style plugs (male at both ends). One
    end plugs into the new plugs, while the other goes to the older version. We need
    to remove each wire from the plugs (on both the older version end, and on the
    end from our component) one at a time and solder them together. Matching the wires
    is a matter of placing them end to end, with one plug upside down and the other
    right side up, as shown in the following image:


    ![](img/504adb30bdfce87f38258e08f11180af_63_0.png)


    You can''t rely on the color of the wires. Notice that the one on the right is
    rainbow colored, while the one on the left is all black with one red wire. You
    must have one plug flipped to match them up. Notice how the lighter plug (top-right)
    has little silver dots along the top (actually indents exposing the pins), while
    the darker plug (lower left) is completely flat on top. This is how to match them
    up to make sure you attach the wires properly. Doing it wrong can damage your
    component and/or the Pixhawk.


    Removing the wires from the plug is a simple matter of using something sharp to
    push down on that indent (which exposes the pin), and gently pulling the wire
    out of the plug as shown in the following image:


    ![](img/504adb30bdfce87f38258e08f11180af_63_1.png)


    As each pin is removed from each side, solder them together one at a time. Doing
    all of them at once can and will lead to confusion.'
  - '[PAGE 64]


    Wrap each solder with either heat-shrink or electrical tape, and then wrap the
    whole bundle with more tape (as shown in the following image):


    ![](img/504adb30bdfce87f38258e08f11180af_64_0.png)


    Now, where shall we place the GPS? Much like the main Pixhawk, GPS modules usually
    contain a compass. Thus, you should look for the arrow on top. This should always
    point forward, regardless of where the cable is attached. We decided to put our
    GPS up front (where we were originally thinking the Pixhawk could go). This keeps
    it well away from the electromagnetic interference that a motor can produce. It
    should be easy to keep it clear up here on the nose of the vehicle (as shown in
    the following image):


    ![](img/504adb30bdfce87f38258e08f11180af_64_1.png)


    You can also see that the GPS antenna is now plugged into the GPS1 port. Using
    3M automotive body tape to secure components is a great way to do it. It''s very
    strong tape, double sided, and flexible. You can pick it up at any autoparts store.'
  - '[PAGE 65]


    The GPS 1 cable (which comes with the Pixhawk) also has an arm button. This button
    allows you to get everything going without activating any motors or servos. Once
    you''re ready to roll, you just hold down this button for a couple of seconds.
    We''ll get to that in just a bit.


    # Radio telemetry


    Cool word, right? We hear it said by space agencies when talking about spacecraft
    that "telemetry is showing all is nominal." Nominal another great word. Telemetry
    is just data, data from a remote source sent to another point. In this case, telemetry
    would be all the sensor data from your rover (for example, GPS) to your computer
    via a wireless link. Conversely, data can be sent back. This is how we control
    the autonomous functions of the rover. You can think of it as basically a wireless
    USB cable that has a range of great distances (depending on the terrain and interference
    of course). The telemetry module we''re using can actually have a range in terms
    of miles.


    You''ll need to use the same methods to join the telemetry module to our cable
    for the Telem 1 plug as we did with GPS. The main thing to keep in mind with the
    radio telemetry module is to keep it well away from the GPS and control receiver.
    There just happens to be a nice, large, flat spot on the front of the Pixhawk
    mount we made (as shown in the following image):


    ![](img/504adb30bdfce87f38258e08f11180af_65_0.png)'
  - '[PAGE 66]


    # RC receiver


    Although we could just control the whole thing with our computer (using the telemetry
    module and a joystick), we prefer a traditional tactile controller. Plus, it''s
    always a good idea to have more than one method of control.


    Pixhawk works with several different types of controller standards (Futaba, Spektrum/JR,
    even a simple receiver with individual outputs for every channel of control).
    We''re going to use the Spektrum standard.


    There is a plug just for Spektrum (satellite receivers) on the top of the Pixhawk.
    There are also plugs for Futaba standards. It works pretty much the same. Luckily,
    the Spektrum and Futaba controllers have a standardized plug, so no soldering
    is necessary. Just plug the receiver into the SPKT port and place the receiver.
    We put ours on the very front of the rover (just in front of the GPS antenna)
    as shown in the following image:


    ![](img/504adb30bdfce87f38258e08f11180af_66_0.png)


    # Connecting the brain to the body


    Now, we need to hook up the Pixhawk to the power, the motor, and the steering.
    If we open the receiver box, we''ll see three servo (white, red, and black) cables.
    One goes to the ESC to control the motor. The other goes to the steering servo.
    There are a plethora of servo connections on the rear of the Pixhawk, as shown
    in the following image:'
  - '[PAGE 67]


    ![](img/504adb30bdfce87f38258e08f11180af_67_0.png)


    The steering servo (the servo wire leading to the front of the vehicle) connects
    to **Main Out pin 1** vertically, with the wire at the top being black (ground)
    and the white wire going to the bottom. The throttle servo wire connects to **Main
    Out pin 3** in the same way.


    Finally, connect the power lead to power 1 (as also shown in the following image),
    and connect the other end to the power module (as shown in the following image):


    ![](img/504adb30bdfce87f38258e08f11180af_67_1.png)'
