  - '[PAGE 247]


    +   - **Bluetooth Setup**: An area to set up the Bluetooth module (like the one
    we used for the golf trolley setup). Because of its limited range, Bluetooth should
    not be used for aircraft or fast-moving vehicles. Keep in mind that Bluetooth
    has a range of about 30 metre.

    +   - **Parachute**: This required an area to set up a parachute deployment system.
    These systems are not widely used, but can prove to be useful in the event of
    a failure of an aircraft (especially over people), or even in place of landing
    a vehicle. It should be noted that (especially on multicopters), the aircraft
    can become tangled in the parachute lines and parachutes should be viewed as the
    last chance, not a reliability.

    +   - **ESP8266**: This is the area where you would setup the ESP8266 Wi-Fi module.
    As we discussed in our trolley chapter, this is another way of controlling/getting
    telemetry from your drone. Wi-Fi does have a limited range (about 100 m), but
    can prove to be useful (especially with Apple iOS devices which are Bluetooth
    prohibitive).

    +   - **Antenna Tracker**: Longer range drones, which require a special **Beyond
    Visual Line of Sight (BLOS)** permit in the US benefit greatly from using a directional
    antenna, which constantly points toward a target. This is especially useful with
    high-quality video systems for live coverage without interference. This area is
    where you can set up and tune your antenna tracker.


