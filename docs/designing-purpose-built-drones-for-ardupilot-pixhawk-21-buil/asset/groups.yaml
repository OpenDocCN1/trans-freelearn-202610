    ## Summary


    在关于 Pixhawk 无人机的书中，你可能会问：“Pixhawk 的编程在哪里？！” 如果我们不谈论水面上的内容，那么写一本关于设计专用无人机的书就说不过去了。而且，我们想向你展示陆地和水上无人机之间的相似之处。我们真正想深入探讨的是一个想法的
    *设计和原型制作*。现在我们已经介绍了你自己的设计建模和建造（我们介绍了建模、打印、防水密封、设计、草图、识别问题以及建造测试）；在下一章中，我们将更深入地研究
    Pixhawk。


    我们将取一辆（几乎）完全组装好的车辆（一辆电动高尔夫推车），并将其改装用于 Pixhawk。我们还将介绍如何使用移动设备（通过 Bluetooth）来控制你的无人机，以及更深入地了解
    Pixhawk 的配置。


    从这里开始，现在你已经是把建造设计变为现实的专家了，我们将更专注于 Pixhawk 设备本身。


    那么，系好安全带吧！


    ## 4


    ## A Drone for Golfers


    正如我们之前多次提到的那样，在选择为哪个行业制作无人机时，你必须在市场规模（需求）、他们能花多少钱（成本）以及你满足该需求的难易程度（供给）之间取得平衡。


    高尔夫是一个极其受欢迎的行业。每年，消费者在高尔夫设备和配件上花费的钱 literally 达数十亿美元。高尔夫球手对能帮助他们提高球技的新技术趋之若鹜。听起来几乎完美，对吧？


    那么，无人机能发挥什么作用呢？一架多旋翼机沿着球道飞行检查布局？也许吧，但如果高尔夫球手以前打过那条球场，为什么他们还需要它呢？他们不需要。好吧，这是一个坏主意。那用一架潜水无人机去寻找掉进水障碍区的球呢？不是一个糟糕的主意，但水障碍区底部可能躺着成千上万个球，找到你自己的球可能几乎不可能。而且，谁愿意把在池塘底部浸泡了数周而受损的高尔夫球一个个捞出来呢？不，又是一个坏主意。


    每个职业高尔夫球手都拥有的，而每个业余爱好者都想要（但可能买不起）的东西是什么？一个球童（在球场上帮你拿球杆的人）！那么，如果我们把一辆电动高尔夫推车（一种运载高尔夫球杆的小车）改造成跟随手机呢？


    现在，我们走在正确的轨道上了。


    我们将涵盖以下主题：


    - The design

    - Using tank locomotion

    - Using LIDAR to avoid obstacles


    ## The design


    经过初步研究后，我们发现市场上已经有这样一种设备。它叫做 Stewart X9 Follow。然而，按标价，这件商品的价格接近 $3,000 美元！


    ![](img/504adb30bdfce87f38258e08f11180af_112_0.png)


    这无疑是一款高质量的产品——设计非常时尚漂亮。毫无疑问，高端高尔夫球手会喜欢这件商品。但对于普通高尔夫球手来说，这绝对会破产。


    该产品还使用自己的遥控器。遥控车跟随遥控器，或可以用它手动操控。我们将采用不同的方法。不是使用专有遥控器，我们将让它跟随智能手机（通过 Bluetooth
    或 Wi-Fi）。这意味着它可以轻松配对。此外，我们还将包含一个标准化的 RC 遥控器（以防用户因忘记充电而导致手机没电）。


    使用标准化的零件应该能让我们将最终成本降至约 $1,000 美元。我们的设备可能没有 Stewart 那么豪华，但它将覆盖更广泛的市场。


    这是我们的原始草图：


    ![](img/504adb30bdfce87f38258e08f11180af_113_0.png)


    制造一整辆高尔夫球童车可能会相当昂贵。所以，让我们从别人（已经电动化）的球童车开始。我们在亚马逊上找到了以下产品：


    ![](img/504adb30bdfce87f38258e08f11180af_113_1.png)


    这辆推车的美妙之处在于它已经配备了双电机（因为它设计为通过遥控器操控）。我们真正需要做的就是在这个“哑”球童车里实现一个大脑。然后，它就能智能地跟随手机。


    不过，我们必须完全重新布线才能使其工作。电机是有刷的，所以我们需要两个有刷 ESC。这些速度控制器还必须能够反转。为什么？因为为了转向推车，我们将使用 *tank*
    式转向（其中一侧向前，另一侧反向）。


    现在，我们需要精确规划所有东西如何连接，所以让我们看看我们的接线图：


    ![](img/504adb30bdfce87f38258e08f11180af_114_0.png)


    你可能会注意到，我们没有包含 **Battery Elimination Circuit (BEC)** 来为 Pixhawk 的舵机部分供电。那是因为我们将使用内置
    BEC 的 ESC。这将通过 ESC 舵机连接为舵机板提供电压。


    你还会注意到，在这个阶段我们还没有决定使用 Wi-Fi 还是 Bluetooth 作为通信协议。我们取消了用于笔记本电脑的 900 Mhz 数据连接，转而使用其中一种协议。为什么？因为没有人愿意在高尔夫球场上随身携带笔记本电脑。相反，我们使用移动设备。


    那么，有什么区别呢？如果我们通过 Wi-Fi 连接，Pixhawk 将成为网络接入点。这实际上可能带来一个问题，因为 GPS 需要手机的数据连接来显示地图。如果我们使用
    Wi-Fi，网络将由你的移动设备与 Pixhawk 建立（而不是你的服务提供商的蜂窝数据连接）。


    那么，如何让 Pixhawk 使用坦克式驱动系统来转向车辆呢？很简单。


    ## Adapting Pixhawk for skid-steering


    第一步是把正确的 ESC 插到 Pixhawk 舵机面板上的正确端口。左轮的 ESC 插入 MAIN OUTPUT 1。右轮的 ESC 应插入 MAIN OUTPUT
    3，如下图所示：


    ![](img/504adb30bdfce87f38258e08f11180af_116_0.png)


    现在，我们只需在 Pixhawk 本身中启用滑移转向。它将完全自行计算该如何驱动每个车轮！


    在 Mission Planner 软件中，连接 Pixhawk（当然先插入 USB 电缆）。进入 Config/Tuning 屏幕并选择 Standard
    Params，如以下屏幕截图所示：


    ## Using Bluetooth to control Pixhawk with a phone


    使用 Bluetooth 控制 Pixhawk 非常简单。但就像 Pixhawk 的所有其他功能一样，需要购买一个附加模块。我们购买了如下图所示的模块：


    ![](img/504adb30bdfce87f38258e08f11180af_118_0.png)


    当然，我们必须修改电缆（就像之前一样），因为该模块附带的电缆是用于旧式插头的。我们将 Bluetooth 模块连接到 Telem 1 端口，如下图所示：


    ![](img/504adb30bdfce87f38258e08f11180af_119_0.png)


    现在，只需将你的 Android 设备的 Bluetooth 与 Pixhawk 的 Bluetooth 绑定。只需打开 Pixhawk 的电源，并使用与任何
    Bluetooth 设备相同的方法进行绑定。用于从移动设备控制 Pixhawk 的软件称为 DroidPlanner 2。它是免费的！


    我们还没有完全完成，但如果你好奇如何使用 DroidPlanner 2 让 Pixhawk 车辆跟随你，那很简单！只需点击 **Follow** 按钮，并设置你希望遥控车保持在内的半径。当然，你可以忽略
    `altitude` 属性（因为这是一辆地面车辆）。你可以在下面的图片中看到 **Follow** 按钮：


    ![](img/504adb30bdfce87f38258e08f11180af_120_0.png)


    当然，如果你不想让遥控车跟随你进入果岭，只需点击 **Pause**。你也可以点击地图上的点来发送遥控车！


    很酷，对吧？但如果你在你和遥控车之间有一棵树怎么办？你不希望它在试图到达你时撞到树和岩石，对吧？这就是碰撞避免的用武之地！


    ## Using LIDAR to avoid obstacles


    你想蒙着眼睛在高尔夫球场上散步吗？不想？我也不想，而且让遥控车盲目乱跑也不是个好主意。但视觉和物体识别需要比这台机器预算更多的计算能力。那么，视觉的下一个最好选择是什么？SONAR
    或 LIDAR。不幸的是，SONAR（就像蝙蝠用声波计算障碍物距离来寻找昆虫一样）对于 Pixhawk 来说被认为 *passé*，因此实现起来相当 *wonky*。有一些
    I2C 声纳设备，但它们与 Pixhawk 2.1 和最新的 Ardupilot 固件配合得并不好（如果能工作的话）。所以，我们将使用 LIDAR 代替。LIDAR
    测距仪使用光波（而不是声音）来计算到物体的距离。


    '
