  mdcn: "\n\n## 为 Ardupilot Pixhawk 2.1 设计专用无人机\n\n使用 Ardupilot 构建无人机\n\nTy Audronis\n\
    \nPackt\n\n![](img/504adb30bdfce87f38258e08f11180af_1_0.png)\n\nBIRMINGHAM - MUMBAI\n\
    \n## 作者简介\n\n**Ty Audronis** 被称为“科技时代的文艺复兴人”。他是一名专业无人机飞行员，娱乐和媒体行业的后期制作专家，经验丰富的互动游戏开发者，以及\
    \ accomplished 数字艺术家。他曾在从 frog Design 到加州科学院等公司工作，担任过多种角色。\n\nTy 自 1981 年起就开始编程软件和游戏，当时他\
    \ 8 岁，之后成为职业。他在大学主修“计算机生成动画和视觉特效”，并因此获得整个 CSU 系统的“最佳动画”奖——玫瑰花蕾奖。他从传感器和组件还必须从手机和游戏控制器上拆卸的时代就开始建造无人机。\n\
    \nTy 也是导师，他曾教授许多实习生技能，并在包括 Interdrone 在内的多个场合定期演讲。他还担任空中摄影师协会和 Genarts（现为 Boris）Sapphire\
    \ 的顾问委员会成员。\n\n## 审校者简介\n\n**Ayan Pahwa** 是一名来自印度新德里的嵌入式软件工程师，目前在 Mentor Graphics\
    \ 工作——西门子旗下企业，拥有 5 年以上构建和竞速第一人称视角多旋翼无人机的经验。他的专业工作领域主要集中在嵌入式固件、设备驱动、汽车物联网和 Linux\
    \ 系统编程。他共同创立了 SDIoT，以在当地社区推广无人机和其他新技术。他的无人机航拍视频可在他的 YouTube 频道观看。\n\n**Ersin Gonul**\
    \ 是土耳其安卡拉土耳其航空工业公司的资深设计工程师。此前 Gonul 曾担任开发无人驾驶飞行器的公司研发工程师。他以优异成绩毕业于塞尔丘克大学电气与电子工程专业，并拥有安卡拉哈切特佩大学电气与电子工程硕士学位。他的专业知识基于直升机自动驾驶仪和无人系统。他对航空、多旋翼、VTOL\
    \ 及其控制系统充满热情。他还持有私人飞行员执照（PPL-H）。\n\n有关本书的支持文件和下载，请访问 `www.PacktPub.com`。您知道 Packt\
    \ 为每本出版的书籍提供电子书版本，文件格式为 PDF 和 ePub 吗？您可以在 `www.PacktPub.com` 升级到电子书版本，作为印刷书籍客户，您有权享受电子书的折扣。欲了解更多详情，请联系我们\
    \ `service@packtpub.com`。在 `www.PacktPub.com`，您还可以阅读大量免费技术文章，订阅各类免费通讯，并获得 Packt\
    \ 书籍和电子书的独家折扣和优惠。\n\n![](img/504adb30bdfce87f38258e08f11180af_6_0.png)\n\n`https://www.packtpub.com/mapt`\n\
    \n通过 Mapt 获得最热门的软件技能。Mapt 可让您完全访问 Packt 的所有书籍和视频课程，以及帮助您规划个人发展和推进职业生涯的行业领先工具。\n\
    \n## 为什么订阅？\n\n- 在 Packt 出版的每本书中完全可搜索\n- 复制、粘贴、打印和书签内容\n- 按需访问，并通过网络浏览器访问\n\n\
