  ![](img/504adb30bdfce87f38258e08f11180af_173_0.png)


  接下来，我们需要告诉Pixhawk如何处理紧急情况。


  ![](img/504adb30bdfce87f38258e08f11180af_174_0.png)


  失效保护在（大多数人所谓的）紧急情况下启用。它们可以从启用不同的自主飞行模式到防止用户错误。让我们来看看这些：


  - **电池失效保护启用：** 此项设置在电池电量降至安全水平以下时要启用的飞行模式。

  - **地面站失效保护：** 此项设置在与地面站失去连接时的飞行模式。由于我们（大量）使用地面站，且不打算进行远程自主飞行，我们将此模式设置为RTL。

  - **油门失效保护启用：** 此项设置飞行员在飞行过程中是否可以将油门降至指定（使用滑块设置）水平以下。我们既不想关闭电机导致失控翻滚，也不想在下降时飞过自己的螺旋桨洗流（可能导致坠机）。


  地理围栏是您可以在设置向导中启用的另一个功能：


  ![](img/504adb30bdfce87f38258e08f11180af_175_0.png)


  地理围栏允许您限制无人机的范围和高度。实际限制值不言自明，所以我们继续往下看。


  ## 配置地面站


  这里是我们配置地面站以接收视频、使用操纵杆并变得全能出色的地方！让我们从操纵杆开始。


  如您所见，有很多按钮。甚至还有一个ThinkPad风格的指针鼠标，您可能可以用它来控制云台（如果我们有兴趣这样做的话）。


  在Mission Planner中，我们将进入**配置/调参**部分，并从左侧选择**Planner**按钮。我们将看到以下屏幕：


  ![](img/504adb30bdfce87f38258e08f11180af_178_0.png)


  在这里，我们可以设置物理操纵杆上的每个按钮、摇杆、旋钮和滑块将控制什么。


  一旦我们的主要控制**横滚、俯仰、油门**和**方向舵**上的每个轴都设置完毕，您需要确保它们以正确的方向控制绿色条。如果方向不对，只需勾选**反向**列中的复选框即可。


  设置轴或按钮相对简单。只需点击**自动检测**按钮，一个提示将会弹出告诉您点击**确定**。在点击之前不要移动操纵杆。一旦您点击**确定**，软件将开始监听游戏控制器上的动作。当您移动一个轴或按下按钮时，它就会将该动作注册为所需的控制。


  您可能会注意到几个按钮在其**控制轴**下拉菜单中选择了-1。这是一个指定值，表示该按钮未分配。与轴一样，**自动检测**按钮可以自动将物理操纵杆按钮分配给该控制。


  下一个下拉菜单是该按钮分配的控制类型。您可能会注意到几个设置为**更改模式**。这是因为它们将无人机设置为各种飞行模式。您可以使用下拉菜单旁边的**设置**按钮来设置飞行模式。它将打开另一个窗口，里面还有另一个下拉菜单。


  同样，您会发现`Do_Set_Servo`类型非常有用。它可以做各种事情，从设置舵机插头控制的云台模式，到通过舵机插头控制相机功能，再到收起和放下可伸缩起落架。基本上，它可以为几乎所有通过舵机插头控制的设备设置舵机值。您只需打开**设置**对话框，选择Pixhawk上的输出端口，然后告诉它您希望该控制的PWM值是多少（还记得我们在控制器上设置飞行模式时讨论的PWM值吗）。您只是在模拟您想要的数值，就像在标准RC遥控器上拨动开关一样。在我们的两个`Do_Set_Servo`功能中，我们使用操纵杆上的一个拨动开关。一个方向将PWM设置为0（放下起落架），另一个方向将PWM设置为1,800（收起起落架）。


  完成操纵杆配置后，您真正需要做的就是点击界面顶部的**保存**，然后在关闭窗口之前点击**启用**。


  如果一切正常，您将在地图窗口的左上方看到以下内容：


  ![](img/504adb30bdfce87f38258e08f11180af_181_0.png)


  ## 设置视频


  要在笔记本电脑屏幕上显示视频，基本上有两个组成部分：


  1. 接收传输信号。

  2. 将其数字化到笔记本电脑中。


  我们选择了Spektrum FPV相机和发射器，因为它价格便宜且重量轻。但我们选择它也是因为它使用FPV中最常见的频率集：Fatshark。因此，为我们的地面站找到Fatshark接收器既容易又便宜。这是我们选定的：


  ![](img/504adb30bdfce87f38258e08f11180af_181_1.png)


  它的作用是将飞行界面左上角的人工地平线替换为FPV视图，并叠加**屏幕显示（OSD）**遥测数据，如下面的截图所示：


  ![](img/504adb30bdfce87f38258e08f11180af_183_0.png)


  就这样搞定了！我们准备进行试飞了，对吧？不对。如果您还记得，在组装阶段，我们需要推迟其中一部分工作，直到我们能转动电机。我们现在就处于这个阶段。如果您从FPV相机中注意到，无人机上没有螺旋桨。除非您先卸下螺旋桨，否则永远不要考虑尝试下一阶段。


  ## 试飞前的最终配置


  在尝试飞行之前，我们需要确保每个电机都连接到正确的位置并朝正确的方向旋转。还记得我们之前的图表吗？这里只是其中的Hex-X，以及标注了六个电机舵机端口的Pixhawk：


  ![](img/504adb30bdfce87f38258e08f11180af_184_0.png)


  ## 总结


  在本章中，我们学习了更多关于原型制作、套件改装以及为我们目的而修改预制部件的理念。我们还学习了如何为多旋翼配置Pixhawk，如何将视频信号接入笔记本电脑显示屏，以及如何使用操纵杆控制无人机。如果这还不够，我们还学习了如何平衡多旋翼的功率与重量。现在，您可以看到它们是多么复杂的机器。


  在下一章中，我们将挑战无人机领域的圣杯：固定翼无人机。在很多方面，它们比多旋翼简单。但实际上并非如此。

