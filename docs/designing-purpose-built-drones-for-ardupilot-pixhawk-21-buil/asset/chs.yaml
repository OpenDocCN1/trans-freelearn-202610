- '# 2 你的第一架无人机 - 一辆自主遥控汽车


  本章更少关于 Pixhawk，更多关于如何设计和改装车辆以实现 Pixhawk。我们将涵盖：


  - 套件拼装

  - 围绕限制进行规划

  - 规划组件的放置

  - 制造新零件

  - 基础组件

  - Mission Planner 的基础知识


  ### 我们的漫游车


  认识 Traxxas Rustler VXL 无刷版（如下图），一辆使用 3S 电池时时速超过 70 英里的越野速度怪兽。如果你熟悉这辆车，你会认识到它绝对不是（完全）原装。更大的、更宽的轮胎已经安装，胎纹更深以获得更好的牵引力和抗侧翻能力。此外，这些轮胎非常柔软（增加了车辆的悬挂）以减少底盘振动。最后，还加装了一个防翘头杆，以防止加速和颠簸时翻车。


  ![](img/504adb30bdfce87f38258e08f11180af_46_0.png)


  你可能还会注意到，我们在前面加装了一个保险杠，以保护悬挂免受正面碰撞。让我们开始吧。


  ### 套件拼装


  套件拼装是一个在电影微缩模型（制作视觉效果微缩模型艺术）世界中创造的术语。它通常意味着购买预成型模型（如用于陈列的塑料模型飞机），取下该套件的零件，并与其他零件（或你自己的定制零件）结合起来创造出新事物。例如，你可以看到原版《星球大战》千年隼号中的部分包含来自各种军事模型套件的枪支和排气口。


  一些纯粹主义者可能认为这是作弊。他们是业余爱好者。专业人士经常这样做。毕竟，当时间就是金钱时，为什么要重新发明已经存在的东西呢？


  在本書中，我们将采用同样的理念。我们将把笨重的物体变成通过 Pixhawk 控制器和组件变得智能的物体。在某些项目中，我们甚至会进行全套件拼装，将两个或多个物体组合成一个智能物体。


  ![](img/504adb30bdfce87f38258e08f11180af_49_0.png)


  在安装组件之前，先进行测试放置总是一个好主意。在这种情况下，我们可以看到我们最初认为可以放置 Pixhawk 的位置是一个糟糕的位置。


  Pixhawk 的后部与电池仓重叠。这意味着当我们要把电池放入车辆驱动它时，它将无法放入。此外，前悬挂的结构支撑与我们几个 Pixhawk 插头重叠。最后，我们的
  Pixhawk 会向前倾斜。如果 Pixhawk 不水平，它可能无法正常工作（如果这是空中飞行器，绝对无法正常工作）。


  你可能会想，“为什么我们不把它横着放呢？” 在 Pixhawk 顶部，你会注意到立方体上的一个白色箭头。这表示 Pixhawk 的前方方向。放置时这个箭头不朝前会导致罗盘读数错误，并且无法正确驾驶漫游车（它可能认为自己指向北方，而实际上指向东方）。


  第二个放置位置在某些方面更优，但也有其缺点。让我们看一下下面的图片：


  ![](img/504adb30bdfce87f38258e08f11180af_50_0.png)


  将 Pixhawk 放置在左舷侧（在本書中为车辆左侧；我们将使用左舷和右舷参考以消除混淆），它可以保持水平且无阻碍。然而，如前图所示，我们需要为底盘这个中空区域构建一个平台。让我们从另一侧看：




  ![](img/504adb30bdfce87f38258e08f11180af_51_0.png)


  Pixhawk 前部端口角落存在明显的悬空。这意味着在碰撞或翻滚的情况下，Pixhawk 可能会遭受严重损坏（尤其是在 70+ mph 的情况下）。


  因此，在我们开始连接任何东西之前，我们必须为 Pixhawk 构建一个平台，该平台放置在底盘支架内，并保护该前角以及 Pixhawk 的整个端口侧。


  ## 3D 建模、打印和硅胶模具


  制作 Pixhawk 安装平台的最佳材料之一是 Gel-10 硅胶。它就是用来制作面具用的仿皮肤物体、电影特效中的假肢，以及其他许多仿皮肤产品的同一种材料。它具有柔韧、柔软且易于成型的特点。如果你没有这些工具，也可以用软泡沫制作平台。我们实际上并不会用硅胶来制作这个特定平台。为什么呢？因为托盘太深了。硅胶会太高，并且会像果冻一样到处弹跳。我们将使用
  3D 打印件。然而，为了让你学习制模的过程，我们会用硅胶制作一个。模具仍然很有用，因为如果我们撞坏了探测车并损坏了支架，谁愿意等待 3 小时再打印一个呢？我们只需使用模具并倒入一些双组份塑料即可。让我们快速了解一下如何制作定制零件。


  ## 量五次，打印一次


  测量准确性是关键。我使用卡尺（而不是简单的尺子）来获得最精确的测量值（如以下图像所示）。我还使用公制（因为其增量比英制更精细）：


  ![](img/504adb30bdfce87f38258e08f11180af_52_0.png)


  ## 在 3D 中建模


  我在以下图像中使用了 Lightwave 3D（一种用于视觉效果的动画和建模工具）来创建我的原型零件。然而，你可以使用 Blender（免费）、Autocad
  或任何其他建模工具来创建用于打印的虚拟零件：


  ![](img/504adb30bdfce87f38258e08f11180af_53_0.png)


  需要注意的是，制作模具母模的方法有很多。粘土建模、木雕，甚至热熔胶成型都是这些方法之一。我更喜欢 CAD 和 3D 打印，因为它更准确，外观也更精致。


  完成后，它可以导出用于 3D 打印。


  ## 3D 打印


  一旦你有了 3D 模型，你就可以根据打印软件将其导出为各种格式。3D 打印软件（也称为 *切片*）本质上是将物体切片成打印机用于在现实世界中创建 3D 物体的所有层。它还会通过在可能下垂的任何表面下方放置支撑物（如下图所示）来帮助你。打印完成后，你需要自行移除这些支撑物：


  ![](img/504adb30bdfce87f38258e08f11180af_54_0.png)


  你可以在以下图像中看到完成的物体。嘿，我打印机里装载的耗材颜色碰巧是粉色的。请不要开玩笑：


  ![](img/504adb30bdfce87f38258e08f11180af_55_0.png)


  此时，你可能会想：“为什么还要制作模具？” 确实，我们可以按原样使用这种塑料 **聚乳酸（PLA）** 零件作为平台。然而，它是坚硬而脆的塑料。任何碰撞都可能导致其破碎（从而需要重新打印）。因此，制作替换零件的模具是高度推荐的。它可以在
  30 分钟内从模具中轻松重新浇铸（而不是 3 小时的打印时间）。最后，它允许你尝试不同的材料，并尝试不同软硬等级的塑料或树脂，以获得所需的柔韧性和阻尼特性（如有需要）。模制（通常）比直接
  3D 打印要好得多。


  在制作模具之前，我们需要移除支撑结构并试装零件。可能需要进行一些 **Dremmeling**（使用旋转工具切割和重塑打印件以使其完美贴合），因此在制作模具之前，我们要确保它完全贴合。在以下图像中，你可以看到最终的试装情况（Pixhawk
  放置在支架中）：


  ![](img/504adb30bdfce87f38258e08f11180af_56_0.png)


  ## 准备制模


  由于我们不得不使用 Dremel 去除一些塑料，我们的零件上出现了一些孔洞。我们不希望这影响我们的模具，并且希望零件表面光滑。注意，3D 打印件并非实心。它们内部是中空的，内部有几何形状。最常见的是内部蜂窝状。因此，Dremeling
  会暴露这些蜂窝，需要填补。填补孔洞的一种快速方法是使用热熔胶。但要注意。热熔胶会软化你的打印件甚至融化它，所以你必须快速且分小段操作。将零件埋在热熔胶中会毁掉它。你可以在以下图像中看到使用热熔胶填补物体间隙的过程：


  ![](img/504adb30bdfce87f38258e08f11180af_57_0.png)


  现在，我们需要制作一个模具容器。简单的泡沫芯板和一些热熔胶足以在我们的物体周围创建一个盒子，如下图所示。我们将零件用热熔胶固定在模具底部：


  ![](img/504adb30bdfce87f38258e08f11180af_57_1.png)


  ## 浇注模具


  现在，我们混合硅胶。对于模具本身，我们使用一种低粘度硅胶，混合比例为 10-1。它比 Gel-10 更坚硬，具有更大的弹性。它甚至可以承受高达 500 华氏度的温度（以防我们想用金属制作一些物品）。如果你想要模具持久耐用，这正是要使用的材料。


  混合硅胶后，最好将混合物放入真空室。如果你没有使用条件也没关系。但真空室有助于释放刚混合的硅胶中的空气气泡。在以下图像中，你可以看到硅胶如何起泡。一旦大部分气泡破裂，你就可以释放真空并取出硅胶。但要小心。如果你的混合容器装得太满，泡沫可能会溢出：


  ![](img/504adb30bdfce87f38258e08f11180af_58_0.png)


  在等待气泡破裂的同时，你可以向模具盒中喷洒一些脱模喷雾，盒内有零件。要大方地喷洒。确保一切都闪闪发光。这种脱模喷雾是一种油性材料，可防止硅胶粘附在盒子和原始零件上。但不要等太久。有些硅胶固化非常快（例如
  Gel-10，完全固化不到 10 分钟）。


  现在，你可以将硅胶倒入模具。将盒子倾斜到不同角度，甚至轻轻敲击以松动任何空气气泡。我们需要硅胶到达零件的每个区域。倒入足够量的硅胶以完全覆盖零件，并在顶部留出足够空间以防止取件时撕裂。你可以在以下图像中看到浇注的模具。请注意，我们添加了几条橡皮筋以防止接下来的步骤中侧面分裂：


  ![](img/504adb30bdfce87f38258e08f11180af_59_0.png)


  还请注意，我们在模具顶部留出了充足的空间。为什么呢？因为我们要回到真空室，以确保硅胶中零件边缘周围没有空气气泡。在以下图像中，你可以看到硅胶泡沫上升有多高。我们不想弄得一团糟：


  ![](img/504adb30bdfce87f38258e08f11180af_59_1.png)


  当然，由于透明盖上的残留物，很难看清。但如果你仔细观察，你会看到硅胶泡沫已经升到模具盒的顶部。气泡大部分破裂后，我们将模具转移到压力室（如以下图像所示）：


  ![](img/504adb30bdfce87f38258e08f11180af_60_0.png)


  同样，这些腔室不是必需的。但它能制作出更好的模具。你可能会想：“为什么要抽真空，然后再把空气放回去？” 嗯，我们并没有向模具中注入空气。通过增加模具周围的空气压力，我们迫使硅胶中任何残留的空气气泡收缩到最小可能的尺寸。我们还迫使硅胶进入零件的每个角落和缝隙。由于这种特定硅胶在
  30 分钟内固化，我们在从压力罐中取出模具前至少等待这么长时间。我们将压力提高到约 40 PSI，然后静置。


  一旦硅胶固化（我们通过检查混合容器中的残留物来测试），我们将其从压力罐中取出，并开始脱模和固化过程。


  ## 脱模和固化


  取出模具中的零件时，你必须非常坚定但极其耐心。你不想拉得太用力以至于损坏零件（或撕裂模具），也不想操作太轻而一事无成。一旦母模零件被取出，你就拥有了一个制造更多零件的小型工厂。只需混合一些塑料，喷洒一些脱模剂，并像之前一样将其放入腔室中即可。






  在将模具存放之前最后一步是确保它能持久。硅胶在紫外线下会固化（至少大多数硅胶如此）。你可以随时买一些紫外灯并自制一个固化箱。我的就是一个简单的冰 chest，内衬白色，里面装了一串
  LED 紫外灯。让它在箱子里放置一夜应该就足够了（如以下图片所示）：


  ![](img/504adb30bdfce87f38258e08f11180af_61_0.png)


  那么，为什么我们要在模具制作上花费这么多时间呢？因为能够自行制作零件对无人机设计至关重要。这些是电子和机械的怪兽。你必须能够牢固地安装传感器，甚至可能需要为其他用途制作定制零件（如我们在第
  3 章 *A Drone for Hunters - Autonomous Duck Decoy* 中将会看到）。为什么不尽快把它解决掉呢？


  ## Hooking up your Pixhawk


  现在我们有了放置 Pixhawk 的地方，我们可以了解一下如何将其安装并为基础的地面车进行编程。Pixhawk 随附几条 ¼”-厚的泡沫胶带。这种东西很棒。它可以吸收可能导致传感器读数出错的
  Pixhawk 振动和冲击。在使用之前，请确保清洁零件。脱模喷雾是非常油性的东西，目的是防止东西粘在一起。普通的液体洗碗皂就能完美解决问题。我喜欢 Dawn，因为它特别去油，而且很容易冲洗干净。


  我们只需用热熔胶将支架粘到地面车的框架上，然后用泡沫胶带将 Pixhawk 粘上去即可。请注意 USB 端口仍在侧护板上方，以便编程时可以访问，如以下图片所示：


  ![](img/504adb30bdfce87f38258e08f11180af_62_0.png)


  我们的 Pixhawk 已水平、牢固、受保护，并且是粉色的。我们要连接的第一个组件将是 GPS。


  ## Global Positioning System (GPS)


  虽然我们可以连接两个 GPS 天线以提高精度，但由于过程对两者相同，我们只使用一个一个。此外，这个地面车上的空间有点紧张。


  你会首先注意到的是，大多数 GPS 天线的插头都不匹配。事实上，在你为 Pixhawk 2.1 购买的大多数组件上也是如此。相关部门选择将插头配置更改为完全不同形状的东西。虽然这些插头远优于之前的版本（它们可以锁定到位，并且显然只能以一种方式插入），但这意味着需要更换插头端。


  幸运的是，Pixhawk 2.1 随附了补丁式插头（两端均为公头）。一端插入新插头，另一端连接到旧版本。我们需要逐根从插头上取下每根电线（在旧版本端和我们组件的端上）并将它们焊接在一起。匹配电线的方法是将它们一端对一端放置，其中一个插头倒置，另一个插头正向放置，如以下图片所示：


  ![](img/504adb30bdfce87f38258e08f11180af_63_0.png)


  你不能依赖电线的颜色。请注意右边的电线是彩虹色的，而左边的全是黑色，只有 一根红线。你必须将其中一个插头翻转才能使它们匹配。请注意较浅的插头（右上）顶部有小银点（实际上是露出引脚的凹痕），而较暗的插头（左下）顶部完全平坦。这就是匹配它们以确保正确连接电线的方法。做错可能会损坏你的组件和/或
  Pixhawk。


  从插头上取下电线很简单，只需用尖锐的东西按压该凹痕（露出引脚），然后轻轻将电线从插头中拉出，如以下图片所示：


  ![](img/504adb30bdfce87f38258e08f11180af_63_1.png)


  每从两侧取下一个引脚，就逐个将它们焊接在一起。一次做全部会导致混乱。


  用热缩管或电工胶带包裹每个焊点，然后用更多胶带包裹整个束（如以下图片所示）：


  ![](img/504adb30bdfce87f38258e08f11180af_64_0.png)


  现在，GPS 应该放在哪里？与主 Pixhawk 类似，GPS 模块通常包含一个罗盘。因此，你应该寻找顶部的箭头。这个箭头应始终指向前方，无论电缆如何连接。我们决定将
  GPS 放在前面（我们最初考虑放置 Pixhawk 的位置）。这样可以远离电机可能产生的电磁干扰。它应该很容易保持在车辆前鼻的此处清晰（如以下图片所示）：


  ![](img/504adb30bdfce87f38258e08f11180af_64_1.png)


  你也可以看到 GPS 天线现在已插入 GPS1 端口。使用 3M 汽车车身胶带固定组件是很好的方法。它是非常坚固的双面、柔性胶带。你可以在任何汽车配件商店买到。


  随 Pixhawk 提供的 GPS 1 电缆还带有一个臂按钮。此按钮允许你在不激活任何电机或舵机的情况下启动一切。准备好出发时，只需按住此按钮几秒钟。我们稍后会讲到。


  ## Radio telemetry


  酷词，对吧？我们听到太空机构在谈论航天器时说“遥测显示一切正常”。正常——另一个很棒的词。遥测只是数据，从远程源发送到另一点的 数据。在这种情况下，遥测将是你的地面车的所有传感器数据（例如
  GPS）通过无线链路发送到你的计算机。相反，数据也可以发送回去。这就是我们控制地面车自主功能的方式。你可以把它想成基本上是一根无线 USB 电缆，其范围非常远（当然取决于地形和干扰）。我们使用的遥测模块实际上可以达到数英里的范围。


  你需要使用与 GPS 相同的方法将遥测模块连接到 Telem 1 插头的电缆。关于无线电遥测模块最需要注意的是要将其远离 GPS 和控制接收器。恰好在我们制作的
  Pixhawk 支架前面有一个漂亮的大平坦位置（如以下图片所示）：


  ![](img/504adb30bdfce87f38258e08f11180af_65_0.png)


  ## RC receiver


  虽然我们可以用计算机（使用遥测模块和操纵杆）控制整个东西，但我们更喜欢传统的触觉控制器。此外，有多种控制方法总是好主意。


  Pixhawk 可与多种控制器标准配合使用（Futaba、Spektrum/JR，甚至是每个控制通道都有单独输出的简单接收器）。我们将使用 Spektrum 标准。


  Pixhawk 顶部有一个专门用于 Spektrum（卫星接收器）的插头。也有 Futaba 标准的插头。它工作方式基本相同。幸运的是，Spektrum 和 Futaba
  控制器有一个标准化的插头，因此无需焊接。只需将接收器插入 SPKT 端口并放置接收器。我们将其放在地面车的最前面（GPS 天线正前方）如以下图片所示：


  ![](img/504adb30bdfce87f38258e08f11180af_66_0.png)


  ## Connecting the brain to the body


  现在，我们需要将 Pixhawk 连接到电源、电机和转向。如果我们打开接收器盒，我们会看到三根舵机（白色、红色和黑色）电缆。一根连接到 ESC 以控制电机。另一根连接到转向舵机。Pixhawk
  后部有大量舵机连接，如以下图片所示：


  ![](img/504adb30bdfce87f38258e08f11180af_67_0.png)


  转向舵机（通往车辆前部的舵机线）连接到 **Main Out pin 1** 垂直位置，线在顶部为黑色（地线），白色线通到底部。油门舵机线以同样方式连接到 **Main
  Out pin 3**。


  最后，将电源线连接到 power 1（如以下图片所示），并将另一端连接到电源模块（如以下图片所示）：


  ![](img/504adb30bdfce87f38258e08f11180af_67_1.png)





  该电源模块串联在电池和速度控制器之间，为 Pixhawk 的计算机供电并提供电量读数（以便 Pixhawk 知道何时电量不足）。


  该电源模块不为舵机供电。舵机板必须从电池消除电路（BEC）获得电源，BEC 是一种通过向舵机板分配电力来消除多块电池需求的设备。这辆无人车上的 ESC 已经集成了
  BEC。因此，它不仅接收来自 Pixhawk 的信号，还为所有舵机供电。如果这个 ESC 没有集成 BEC，就需要一个（直接连接到主电池），并且可以插入舵机板（Pixhawk
  后部）的任何端口。大多数 ESC 都集成了 BEC。但有些没有，了解 BEC 是什么非常重要。


  现在所有东西都已连接好，让我们开始使用软件吧。


  ## 为我们的（基础）无人车编写 Pixhawk 程序


  你会需要两款（免费的）软件。第一款是你的主要 Pixhawk 软件（Mission Planner）。另一款是 QGroundControl。两者都可以从多个来源获得，用简单的
  Google 搜索就能找到。


  虽然我们已经安装了无线电遥测单元，但在首次启动 Pixhawk 时，我们需要通过 USB 将其直接连接到计算机。还记得 Pixhawk 立方体侧面的那个插头吗？那就是我们的计算机
  USB 插头。最好使用笔记本电脑（这样你可以在野外使用）。


  ## 向导


  将 Pixhawk 连接到计算机后，启动 Mission Planner 软件。你会看到这个提示框：


  ![](img/504adb30bdfce87f38258e08f11180af_69_0.png)


  显然，你需要选择 Rover。该向导将执行 Pixhawk 的初始设置并校准以供使用。


  接下来，你只需选择计算机如何连接到 Pixhawk（如下一张截图所示）：


  ![](img/504adb30bdfce87f38258e08f11180af_69_1.png)


  此时，你必须指定 Pixhawk 所连接的端口。Pixhawk 本质上通过 USB 模拟一个串行端口（COM 端口）。在 Windows 上，要了解哪个端口与你的
  Pixhawk 关联，可以查看设备管理器（如下一张截图所示）：


  ![](img/504adb30bdfce87f38258e08f11180af_70_0.png)


  在“端口”下，只需查找 PX4 FMU。在本例中，你可以看到它是 COM9。


  现在它已找到 Pixhawk，将验证其固件版本并更新固件。如果失败，只需重复上述步骤直到成功。你可能需要更换 USB 所插入的插孔。有时 USB 集线器和其他设备会干扰。再次强调，继续尝试不同的组合直到它正常工作。最终会成功的。在大多数情况下，第一次就能成功。


  点击“下一步”后，向导将让你设置任何声呐设备（如下一张截图所示）：


  ![](img/504adb30bdfce87f38258e08f11180af_73_0.png)


  我们没有在这辆无人车上使用声呐。不过，我们可能会在很后面的章节用到它。所以我们只是将 Sonar Model 字段保留为 None。


  接下来是控制配置。在这里，我们可以将接收器绑定到我们的控制发射机（本例中为 Spektrum DX8），并校准控件以使其正常工作。


  以下截图显示了与此过程相关的界面：


  ![](img/504adb30bdfce87f38258e08f11180af_73_1.png)


  在左侧面板中，你会看到一个**继续**按钮（不是**下一步**按钮）。点击它将带你到右侧面板。在右下角，你会注意到一个名为**Spektrum 绑定**的部分。通过选择适当的**Spektrum
  卫星**类型来激活相应的绑定按钮，将使接收器进入绑定模式。然后，只需按照 Spektrum 手册中的说明，绑定你正在使用的任何 Spektrum 发射机。对于
  DX8，说明如下：


  - 1. 选择一个新模型

  - 2. 关闭发射机

  - 3. 按住**绑定**按钮

  - 4. 在按住**绑定**按钮的同时打开发射机

  - 5. 等待发射机确认绑定完成


  绑定发射机后，只需点击**校准无线电**按钮并按照说明操作。（它会让你将各个控件向不同方向移动。）


  接下来是**飞行模式**设置，如下一张截图所示：


  ![](img/504adb30bdfce87f38258e08f11180af_74_0.png)


  最多可以将七种飞行模式关联到遥控器上的一个开关或旋钮。如果遥控器上有一个三位置开关，模式 1、3 和 5 最可能被分配给这些位置。飞行模式如下：


  - **手动**：此模式涉及对车辆的完全手动控制。Pixhawk 只是将所有命令直接转发给它控制的舵机和 ESC。

  - **学习**：此模式与手动模式具有相同的控制方式，但它允许你切换控制器上的一个开关，向软件教授 GPS 航点，以便在自动模式下使用。本质上，无人车将重复你的动作。

  - **转向**：此模式与学习模式相同，但会开启避障功能（如果使用声呐），并会为你操控无人车绕过障碍物。这对于调整避障功能非常有用（我们可能会在后面的章节中使用）。

  - **保持**：此模式会停止无人车，所有车轮停止并保持笔直向前。

  - **自动**：此模式涉及从航点到航点的完全自主驾驶。这个航点列表将循环并无限重复。如果失去信号，无人车将进入保持模式。

  - **RTL**：这代表返回起飞点（Return to Launch），并将直接使无人车返回它起飞的地点。到达起飞点后，它将进入保持模式。如果配备了声呐，它将在途中避开障碍物。

  - **引导**：此模式利用无线电遥测单元。你可以使用高级控制（例如，如果无人车抬起前轮，可以告诉油门减小），使用计算机上的操纵杆，或者实时指定航点。可以将此视为火星车设置。


  在向导的最后一个屏幕上，你应该会看到，除了尝试解锁（arm）你的无人车外，所有内容都是绿色的（如下一张截图所示）：


  ![](img/504adb30bdfce87f38258e08f11180af_76_0.png)


  此时不要尝试解锁你的无人车。首先，执行以下步骤：


  - 1. 确保四个轮子都离地。我们使用了遥控车支架（本章所有无人车图片中的橙色平台）。

  - 2. 确保你的发射机已开启。

  - 3. 将电源传感器模块连接到 ESC。

  - 4. 将电池连接到电源传感器模块。

  - 5. 按住 ARM 按钮（连接在 GPS 电缆上的当前闪烁的红色按钮）3 秒钟。


  如果红色按钮的灯停止闪烁并变为常亮红色……恭喜，它已成功解锁。如果没有，或者按钮的灯从未亮起，你可能接错了 GPS 电缆上的电线。请再次检查。


  红色框不会变成绿色，但你已经通过所有重要方式确认了解锁成功。


  其余屏幕实际上并不允许你配置任何内容。它们只是告知你 Failsafe（失效保护）选项有哪些，并提供一些阅读材料的链接。请阅读它们。它们非常有帮助。


  ## 更多校准……


  无论现在一切看起来多么酷，停下来！你可能会看到一张地图和一些很酷的读数。首先，我们需要校准加速度计。点击 Mission Planner 软件顶部的 INITIAL
  SETUP 选项卡，你将进入以下界面：


  ![](img/504adb30bdfce87f38258e08f11180af_77_0.png)


  屏幕左侧是 Accel Calibration（在 Mandatory Hardware 选项卡下）。点击界面中的每个按钮（Calibrate Accel 和
  Calibrate Level）并按照屏幕上的说明操作。这会校准加速度计，使 Pixhawk 确切地知道无人车的姿态。你需要将无人车置于多个位置并使其保持水平。我们建议你在
  USB 供电且不连接电池的情况下进行此操作。


  你可能还需要为驱动轮校准 ESC。同样，只需按照此步骤的简单屏幕说明操作即可。





  ## 测试和驾驶


  在我们把它带到野外之前，我们需要测试连接。关闭 Mission Planner 软件，拔掉 USB 数据线，并将 USB 遥测适配器连接到你的电脑。在车轮离地的情况下，通过插入电池给发射机和遥控车供电，但不要武装遥控车。


  启动 Mission Planner 软件后，系统可能会再次要求你查找遥控车的 COM 端口。在你的设备管理器中，遥测单元应该在端口标签下可见，这次显示为 Silicon
  Labs 设备。


  成功找到遥测适配器后，你将在 Mission Planner 中看到此屏幕：


  ![](img/504adb30bdfce87f38258e08f11180af_78_0.png)


  点击连接按钮（界面右上角）后，你应该能在你的位置看到你的遥控车。嗯……那就是我家。


  让我们进行一些初步调校并向你展示如何操作。在真正驾驶遥控车之前，我们需要确保它不会以 70+ 英里每小时的速度冲向虚无。


  此时，遥测模块与电脑通信，我们可以做 USB 能做的任何事情。如果你转到顶部的 Config Tuning 选项卡，它让我们可以设置遥控车速度的一些限制（如以下屏幕截图所示）：


  ![](img/504adb30bdfce87f38258e08f11180af_79_0.png)


  在左侧的 Standard Params 选项卡中，你会找到 Target Cruise Speed 和 Base Throttle Percentage（我们之前见过）。我们将巡航速度设置为
  5 米每秒，油门百分比设置为 15%。这样，在自动驾驶时油门不会超过 15%，速度也不会超过 5 米每秒——非常缓慢。


  在尝试自动驾驶之前，先大量驾驶遥控车。我们稍后会更深入地讨论调校。但对于遥控车来说，这两个速度设置是必不可少的。我们以后如果愿意可以逐渐提高它们。


  ### 设置航点


  我们将在下一章更深入地讨论这个问题。然而，设置航点与在 Mission Planner 主屏幕的地图上点击一样简单。我们现在唯一真正想说的是，这会冒一切风险。你的无人机可能会坠毁，甚至可能伤人。我们并不打算用本章来教你如何创建航点无人机。这个无人机甚至没有防碰撞功能。然而，本章的目的是让你熟悉创建遥控车式无人机的方法，以及
  Pixhawk 2.1 的基本连接和配置。


  不过这架无人机是支持航点的。如果你必须尝试，请在完全空旷的区域进行，那里没有人或财产会受到伤害。


  有关航点和自动驾驶的完整说明，请参阅下一章。


  ### 总结


  在本章中，我们学习了如何制作零件并将旧外设连接到全新的 Pixhawk 2.1。我们进入了配置向导，甚至触及了遥测模块。


  在下一章，我们将更深入地研究所有这些内容，并使用我们第一个专用无人机——鸭子诱饵。诱饵将自主在池塘周围游荡，吸引猎人狩猎的鸭子。我们将使用在这里学到的所有知识，并深入研究遥控车的航点和巡逻。


  那么，系好安全带……开始吧！

  '
- '# 第 3 章：猎人用的无人机 – 自主鸭子诱饵


  水上遥控车与设置陆地遥控车无人机并没有什么不同；只有一个严重的例外——水 + 电子 = 坏……真的很坏。因此，必须特别注意无人机的防水。在这方面，需要采用一些特殊的技巧、材料和机械来防止水进入，保持无人机直立，并在完全破坏电子设备的环境中漂浮时保持其存活。


  在本章中，我们将完成一些制造技术，并更深入地了解 Pixhawk。但主要是，我们将向你展示船与遥控车有多相似。我们将涵盖：


  - 为无人机想出创意

  - 让你的创意具有市场性

  - 更多关于制造和制作

  - 设计挑战的预见

  - 设计工作流程

  - 防水


  让我们从“为什么是鸭子诱饵？”开始。毕竟，这难道不是对 Pixhawk 的浪费吗？Pixhawk 不是用于巨大的原型医疗无人机吗？Pixhawk 不是用于制造和销售要花费数十亿美元的想法吗？


  ### 孕育一个可销售的交易


  正如任何商科专业人士都会告诉你的那样，产品赚钱的关键是供需法则。这里的关键是需求。最好的想法——改变世界并让发明者赚取大量资本的想法——不一定是迎合拥有超高预算客户的想法。轮子、捕鼠器，甚至洗碗刷都是数百万（甚至数十亿）美元的想法，每个人都可以使用，大多数人都能负担得起，并解决基本问题。


  说实话，我不打猎。我从未打过鸭猎。然而，我注意到我认识的那些（打猎的人）都有鸭子诱饵——很多。不同类型的鸭子有不同的诱饵，而且他们经常带回的诱饵比出发时少。


  此外，打猎很无聊。去一个地方等待，等待，一直等待，直到最终有一些鸭子出现。如果你可以让等待过程更有趣怎么办？如果你可以驾驶一只鸭子在池塘上游荡，甚至让它自行驾驶并导航池塘怎么办？如果你可以向你的朋友展示一个他们没有的新玩具怎么办？最重要的是，如果（当你一天结束时）你可以让你的鸭子回到你身边怎么办？


  它解决了某些问题，具有炫耀性，而且还迎合了一个遍布全国的行业，在那里配件是必不可少的，人们在这些配件上花费大量资金（双关语）。


  最棒的是，即使你使用的是现有技术，这个想法也可能具有可专利性！有很多使用现有技术以新方式的想法获得了专利。因此，你不仅可以制造出有市场性的产品……这还是一个你可以授权的想法，然后坐下来让钱滚滚而来。这些都是制作鸭子诱饵无人机的绝佳理由。


  正如我所说，我不是猎人。我喜欢飞机（尤其是 F-117 隐形战斗机）。所以，对鸭子（真的）以及狩猎一无所知，我用多面设计制作了我的鸭子诱饵，只是为了让原型制作阶段更有趣。所以认识一下隐形鸭（也称为
  Black Ops McDuck），如以下图像所示：


  ![](img/504adb30bdfce87f38258e08f11180af_83_0.png)


  如你所见，它是 3D 打印的。但至少它不是粉红色的，对吧？


  ### 在设计之前概述范围


  在我们真正开始动笔（或者说在这种情况下用鼠标操作 CAD）之前，我们需要概述鸭子的一些基本需求和布局。让我们从我们对设计的进行的问题和解决方案分析开始。


  下表列出了我们制定的问题和解决方案，虽然原始表格是手写的，但这个更易读：


  | 我们会遇到的問題 | 解决方案 |

  |---|---|

  | 水渗入模型接缝 | 用 CA 胶粘接缝，并用硅胶密封剂填充。 |

  | 水渗入螺旋桨轴与机身相接的位置 | 轴的固定套管内填充润滑脂，并在外部用硅胶密封。 |

  | 检修盖漏水 | 硅胶密封圈。 |

  | 发生漏水时，防水 Pixhawk | 硅胶模制 Pixhawk 外壳？（不行）。 |

  | 硅胶模制外壳的 Pixhawk 发热？ | 不能密封。必须尽可能使机身防水。在整合 Pixhawk 之前的所有阶段测试防水性。 |

  | 内部天线的 GPS 接收 | PLA 塑料机身应该不是问题。 |

  | 电机电磁干扰 GPS | 将电机放在前面，GPS 天线朝向后面。 |

  | 密封机身内的电机发热 | 水冷电机。 |

  | 密封机身内的 ESC 发热 | 水冷 ESC，或低压 ESC / 电机。 |

  | 电机、传动轴和螺旋桨的费用 | 改装便宜的 RC 船。 |

  | 为效率平衡电机、ESC 和螺旋桨 | 改装便宜的 RC 船。 |

  | 鸭子太大，无法放入 3D 打印机 | 分段打印，用 CA 胶粘合，干燥后用硅胶密封。 |

  | 将 Pixhawk 与廉价 RC 船部件接口 | 确保我们购买的船是模块化的（接收器中没有集成 ESC 或舵机），或至少尽量减少集成部件，以便我们更换尽可能少的部件。
  |

  | 如果我们想让头部随舵转向怎么办？ | 不要在初始原型上这样做。但将头部打印为单独的部分，以便以后如果需要可以改装。 |

  | PLA 塑料打印还是 ABS？ | 机身用 PLA（更便宜）。但电机支架用 ABS（熔点更高）。 |

  | 波浪或转弯时倾覆？ | 大型压舱物部分填充造型粘土。 |


  我们在途中遇到了其他一些问题，这些问题是不可预见的。我们稍后会提到这些。但正如你从我们的概览图表中的细节所看到的，我们试图尽可能地将这些问题降到最低。积极思考很好。但在规划时，你必须成为自己的唱反调者，以便预测你会遇到的问题。然后，你可以积极思考来想出解决方案。




  你也可以看到，我们不得不妥协，放弃了因漏水而损坏 Pixhawk 的可能性。我们想为它制作一个硅胶外壳以密封它。我们考虑过制作硅胶假插头。我们甚至考虑过密封立方体部分的边缘。最终，我们得出的结论是，在这种可能性上做这些事情，不如
  Pixhawk 因过热而烧毁的确定性来得重要。立方体部分实际上是被加热的（出于设计目的），以便 Pixhawk 在寒冷天气下运行。电子设备不喜欢热量。过多的热量甚至会熔化焊接元件并导致短路。因此，我们决定将防水工作重点放在确保在集成
  Pixhawk 之前绝对不会有水进入。


  接下来，我们为 BlackOps McDuck 草拟了一个基本设计（如下图所示）：


  ![](img/504adb30bdfce87f38258e08f11180af_85_0.png)


  很难分辨是什么，对吧？草图不是计划。它更像是一个逐步理清事物如何进行的过程，这样你在思考时就能看到问题。草图非常快（5-15 分钟），并且能让你思考事情。在这里，你可以看到我们将电子设备移到了水线之上（以防轻微泄漏）。我们还确定了水会从哪里进入（在压舱物部分，前部），以及会从哪里排出（通过我们电机水冷的侧面）。换句话说，我们现在知道需要在粘土压舱物中开凿一个通道，以便水入口和传动轴能够很好地位于水线以下。我们还发现舵需要相当高。


  为什么舵需要很高？为了适应我们的舵机位于水线之上这一事实。此外，你不希望舵只在水中。你希望它位于螺旋桨推力的路径中（这样在低速时它可以偏转被推动的水，从而实现更大的灵活性）。


  此外，我们还规划了头部如何在未来版本中转动（使用套筒和轴承，轴向下延伸到控制杆）。该杆将延伸到船体的后部并连接到驱动舵的同一舵机（允许头部转动并面向鸭子转动的方向）。


  草图很难读懂吗？是的，对于除绘制者本人之外的所有人来说都是如此。这很正常。这也是为什么让将制作设计的人参与草图会议（甚至亲自绘制草图）很重要。对于大型团队来说，这是一个重要的认识。永远不要在设计师不在场的情况下做草图。设计师不仅需要知道所有东西放在哪里，还需要知道为什么。这使他们能够在保持草图精神的同时，调整设计以克服他们可能发现的问题。


  接下来，我们需要订购我们的拼装船。我们需要在设计鸭子之前知道硬件的基本尺寸。毕竟一切都需要装得下，对吧？


  ## 选择拼装船


  我们主要寻找的是便宜且带水冷电机的船。如果从亚马逊订购，很少能打开内部看看东西是否模块化（不是集成**电子调速器 (ESC)** 或舵机）。我们在工作坊里有很多
  ESC 和舵机，所以我们不太在意。但如果你身边没有大量备件，你可以考虑去当地的模型店，购买前先看看船的内部结构。这就是我们买到的船（如下图所示）：


  以下图像显示了打开盖子的船，所有的电子设备仍安装在内：


  ![](img/504adb30bdfce87f38258e08f11180af_88_0.png)


  以下图像显示了从船上取下的所有零件：


  ![](img/504adb30bdfce87f38258e08f11180af_88_1.png)


  将所有零件摊开后，你可以看到传动轴穿过的套筒（前景，有一团白色硅胶），以及传动轴（图像右侧，靠近黑色螺旋桨）


  现在，我们可以测量所有零件（尤其是电机），并设计鸭子身体。


  ## 为 3D 打印设计鸭子身体


  即使你没有 3D 打印机，为其设计也很方便。此外，你也可以随时将设计发送给朋友，或拥有该设备的服务。你最终应该买一台，不过现在它们相对便宜。


  计算机辅助设计（CAD）的一个美妙之处在于，你实际上不需要使用 CAD 软件就能在现实世界中创建物体。困惑吗？别担心。CAD 设计和 3D 动画软件在建模物体时使用非常相似的方法。它们甚至共享（部分）文件格式。任何（称得上）值得使用的
  3D 建模软件都可以导入和导出 CAD 格式。


  你不必花大价钱购买 AutoCAD 或 SolidWorks 来创建和原型化你的设计。这些程序拥有起来可能每年或每月花费数千美元。相反，你可以使用 Blender
  等免费软件来建模你的物体。这些易于获取的软件包的额外好处是，互联网上有大量关于其使用的 YouTube 视频和教程。


  我是受过 3D 动画教育的。我用过几乎所有创建此内容的软件包。对于建模，我喜欢 Lightwave 3D，只是因为这是我最初学习的（1995 年）。如果这是为一部电影，我可能会用其他东西。但我在这里展示的方法（无论软件包如何）在任何建模包中都是通用的（从
  Blender 到 Maya，甚至 AutoCAD 到 SolidWorks）。


  ## 3D 建模的基础知识


  在开始之前，这里是我们想要得到的鸭子外壳：


  ![](img/504adb30bdfce87f38258e08f11180af_90_0.png)


  可能很难看出来，但你会注意到鸭子不是实心的。相反，它有一个内鸭和外鸭。最容易看到这一点的方法是沿着前一图中左下方的轮廓看。这意味着鸭子是空心的，你可以看到压舱物部分的底部船体比鸭子的其余部分厚。这是因为它需要承受粘土的重量，并且在鸭子搁浅时更坚固。


  你还会注意到，鸭子（虽然在右上方看起来是由四边形多边形组成的），是由三角形组成的。还记得几何吗？三个点定义一个平面。所以，3D 打印机喜欢三角形多边形（而不是四边形）。


  在向你展示它是如何建模之前，有件事你需要知道。基本上存在两种类型的模型——基于多边形的模型（每个点集由直线连接）和基于曲线的模型（看起来更光滑）。3D 打印机*不处理曲线*。你必须使用多边形。


  ## Box modeling 101


  创建 3D 模型的方法有很多。但箱体建模是最简单的方法之一。其他方法可以产生更大的细节，并且更适合动画。但箱体建模可以让你快速创建物体，并且痛苦和无聊最少。那么它是什么？


  这是你可以用到的最接近用粘土建模的技术。它被称为箱体建模，因为你从一个箱子开始（如下图所示）：


  ![](img/504adb30bdfce87f38258e08f11180af_92_0.png)


  然后，我们将物体转换为细分多边形（在 Lightwave 3D 中，你只需按 Tab 键），如下图所示：


  ![](img/504adb30bdfce87f38258e08f11180af_93_0.png)


  于是，它变成了更像球体的形状。就这样，你现在正在使用细分。接下来，让我们谈谈工具。


  ![](img/504adb30bdfce87f38258e08f11180af_95_0.png)


  让我们更仔细地看看这是如何工作的：


  - **左上：** 物体顶部前方的多边形被选中

  - **中上：** 多边形被挤出、上移并调整大小以形成颈部基部

  - **右上：** 重复该过程以形成头部基部

  - **左下：** 该过程再次被挤出并上移以形成头部顶部

  - **中下：** 头部前部被选中、挤出并调整大小以形成鸭嘴基部

  - **右下：** 该过程再次被挤出以形成嘴的末端






  正如你所见，这比大多数人想象的要容易得多。稍微拖动几个点，你就会得到一个看起来不错的头部。这个过程会重复用于压舱物区域，并使用刀具配合一些点拖动，以便我们形成鸭子的尾部。最终结果如下所示：


  ![](img/504adb30bdfce87f38258e08f11180af_96_0.png)


  ## 使鸭子中空


  在将曲线转换为多边形（细分）之前，让我们先暂时切回直线多边形来使鸭子中空。你会注意到（在下面的图表中）鸭子看起来很丑。别担心，我们很快就会回到曲线：


  ![](img/504adb30bdfce87f38258e08f11180af_97_0.png)


  我们可以用几种方法使鸭子中空。其中一种是使用布尔运算（我们稍后会介绍）。我们只会使用一种称为加厚的方法。这会使每个多边形变厚。对于封闭物体（实体）而言，它会使物体中空。加厚让我们可以控制中空物体壁的厚度。在本例中，我们将物体加厚至
  1/8 英寸（如下图所示），然后返回曲线模式：


  ![](img/504adb30bdfce87f38258e08f11180af_98_0.png)


  现在，我们将使物体变为多边形。


  ## 将曲线冻结为多边形 – 细分


  从细分创建多边形非常容易。每个软件包的工作方式略有不同。在 Lightwave 中，我们只需使用冻结命令（Ctrl + D）。但正如你所见（如下图所示），我们的多边形仍然不是三角形。它们仍然是四边形：


  ![](img/504adb30bdfce87f38258e08f11180af_99_0.png)


  在我们开始制作三角形之前，你会注意到鸭子仍然高度分段。修复起来很容易。你只需再次将其变为曲线，然后重新冻结即可。这会极大地增加多边形的数量。每次执行此过程，你的物体就会变得越来越光滑。我们的鸭子是隐形的，所以我们就这样保留它。


  同样，每个软件包都有一种将四边多边形（四边形）转换为三边多边形（三角形）的方法。在 Lightwave 中，它只是三重命令。它看起来像这样：


  ![](img/504adb30bdfce87f38258e08f11180af_100_0.png)


  ## 布尔运算


  布尔运算是任何建模工具中的另一个功能。有了它，你可以连接两个几何体，甚至可以使用一个物体切割另一个物体。例如，考虑以下图表：


  ![](img/504adb30bdfce87f38258e08f11180af_101_0.png)


  在前面的图表中，我们有一个球体和一个圆柱体，它们被合并成一个物体。请注意，球体内部没有圆柱体几何体。它是一个实心物体。而在下面的图表中，我们有同一个球体和圆柱体，但圆柱体已被用来在球体上切出一个孔。这是通过创建两个物体并使用布尔函数来完成的：


  ![](img/504adb30bdfce87f38258e08f11180af_102_0.png)


  这种方法就是我们不仅创建了一个进水孔，而且还创建了鸭子盖子的方式。我们只需创建一个基本形状，并用它一次切割（布尔减法）出一个孔。然后，我们使用该形状和原始鸭子再次创建盖子（使用布尔相交）。在这里，你可以看到它们以不同颜色显示（如下图所示）：


  ![](img/504adb30bdfce87f38258e08f11180af_103_0.png)


  就这样——所有建模你自己的物体所需的基本工具。直接从你的想象到现实世界——说到将其带入现实世界。


  ## 打印大型 3D 模型


  我们的鸭子长近 11 英寸。我们的 3D 打印机打印床为 5.5 x 5.5 英寸。这意味着我们必须分段打印它。使用布尔方法（我们之前使用过），我们可以将物体切割成段。但由于这个物体需要防水，我们该怎么做呢？


  氰基丙烯酸酯粘合剂（CA）胶水（基本上是超强胶水）会使塑料熔合在一起。它非常棒。它更像是焊接塑料而不是粘合它。所以，第一步，我们在要粘合的两个物体之一上涂上一条漂亮的胶水，然后将其压在一起约
  10 秒钟。胶水干燥得非常快。只要对自己好一点，不要触摸胶水。超强胶水以粘合皮肤而闻名（军医和一些外科医生用它来密封伤口）。


  重要的是不仅要让硅胶密封剂干燥，还要在这样做之前至少让其固化 24 小时：


  ![](img/504adb30bdfce87f38258e08f11180af_105_0.png)


  在本次测试成功后，我们用建模粘土填充压舱物部分，并再次进行，原因有两个：


  - 1. 我们想确保我们没有用太大的力将其压实（破坏密封）

  - 2. 我们需要确保水线上升到正确的水平


  带有粘土填充的下半部分如下图所示：


  ![](img/504adb30bdfce87f38258e08f11180af_105_1.png)


  太棒了！现在我们的鸭子装满了 2 磅的粘土，我们可以肯定它绝对不会倾覆。而且，现在我们确定鸭子是防水的，让我们在上面钻一些孔吧！等等……什么？！


  ## 安装推进系统


  我们希望在粘土变干之前执行下一步。首先，我们想在后面取出一点粘土，并以一定角度钻一个孔。在那里，我们将套管和传动轴穿过并安装螺旋桨。切勿将套管粘在原位。它需要保持灵活。相反，我们使用大量硅胶将其固定在原位，并在机身内外密封孔洞（如下图所示）：


  ![](img/504adb30bdfce87f38258e08f11180af_106_0.png)


  现在，是时候制作我们的电机支架了。我们想确切地知道传动轴的位置、其角度以及与电机的连接位置。我们在船头对驱动轴套管所做的就是在那里放置水冷管的长端。我们在放置电机支架之前就这样做，因为否则我们就无法触及它。这根管子将用于进水进行水冷（如下图所示）。等待硅胶干燥后，我们可以将其修剪回一点，但不要齐平：


  ![](img/504adb30bdfce87f38258e08f11180af_107_0.png)


  放置电机支架（使用 ABS 塑料打印）后，我们将电机粘在上面（仍使用原船的安装支架），并将水冷管的短端引出船侧（如下图所示）：


  ![](img/504adb30bdfce87f38258e08f11180af_107_1.png)


  ## 转向和电子设备


  你可能从前面的图像中注意到电机只有两根线。这是因为它是有刷电机。在上一章中，我们讨论了有刷与无刷电机。有刷电机需要完全不同类型的 ESC。为什么这很重要？因为（不幸的是）我们原船的接收器集成了
  ESC。所以，我们需要为我们的电机找一个新有刷 ESC。在实习生去做这件事的同时，让我们安装我们新打印的舵。


  首先，我们制作了一个块，使其适合鸭子的后部，并在其上带有铰链的公端。然后是一个简单的舵，上面有一个控制臂（这样当舵机推动控制杆时，舵就会转动）。安装后，看起来如下图所示：


  ![](img/504adb30bdfce87f38258e08f11180af_108_0.png)


  在内部，我们将电子平台粘在原位，钻了一个孔（在水线之上）用于我们的控制杆。杆不能被硅胶阻碍，所以如果水位上升到这条线，这个孔就会漏水。所以，我们希望它尽可能高。我们还安装了我们的电子平台（如下图所示）：


  ![](img/504adb30bdfce87f38258e08f11180af_109_0.png)


  你还可以看到我们将 Pixhawk 安装在电子平台上。我们在控制杆上弯了一个折角，以便在所有设备通电后可以调整其有效长度来微调我们的控制。


  ## 连接一切！


  好吧，在水下测试之后再这样做。电子设备进水已经够糟糕了，如果它们带电时进水就更糟了！至于插头和连接，一切都与陆地漫游车时完全相同。不是舵机连接到车轮，而是连接到舵。不是电机连接到车轮，而是连接到螺旋桨。但每个插头在水上漫游车上的连接方式都应与陆地漫游车相同。之后，盖上盖子，并以与陆地漫游车完全相同的方式对其进行编程。然后，你就可以出发与鸭子一起游泳了！






  ## 总结


  在关于 Pixhawk 无人机的书中，你可能会问：“Pixhawk 的编程在哪里？！” 如果我们不谈论水面上的内容，那么写一本关于设计专用无人机的书就说不过去了。而且，我们想向你展示陆地和水上无人机之间的相似之处。我们真正想深入探讨的是一个想法的
  *设计和原型制作*。现在我们已经介绍了你自己的设计建模和建造（我们介绍了建模、打印、防水密封、设计、草图、识别问题以及建造测试）；在下一章中，我们将更深入地研究
  Pixhawk。


  我们将取一辆（几乎）完全组装好的车辆（一辆电动高尔夫推车），并将其改装用于 Pixhawk。我们还将介绍如何使用移动设备（通过 Bluetooth）来控制你的无人机，以及更深入地了解
  Pixhawk 的配置。


  从这里开始，现在你已经是把建造设计变为现实的专家了，我们将更专注于 Pixhawk 设备本身。


  那么，系好安全带吧！

