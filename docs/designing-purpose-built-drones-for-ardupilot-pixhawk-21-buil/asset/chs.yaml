  \ 115\n  - 螺旋桨 - 飞行料理机 ................................ 117\n\n\n\n\n\n## 前言\n\n\
  我们生活在无人机时代。无人机目前在国防、娱乐以及某些国家的包裹递送方面发挥作用。然而，无人机时代仍处于起步阶段。无人机的用途繁多，正处于被发现的边缘；用于测绘的无人机、用于便利的无人机，甚至用于科学研究的无人机。\n\
  \n本书将带你了解导航空中、陆地甚至海洋的无人机的设计过程。我们将向你展示如何提出想法，克服预算和当前技术的限制，并付诸实施。然而，没有“大脑”的无人机只是一辆遥控车。我们将向你展示如何将Pixhawk\
  \ 2.1引导系统集成到你的无人机中，以及如何为Pixhawk添加外设和传感器，使普通的遥控车变成服务于特定用途的智能无人机。\n\n### 本书涵盖内容\n\n\
  第1章，无人机101，向你介绍无人机的世界并解释无人机类型繁多。我们还对Ardupilot和Pixhawk飞行控制器系统进行了高层次概述。最后，我们将带你了解一些安全最佳实践，以最大限度地降低原型化新无人机相关的风险。\n\
  \n第2章，你的第一架无人机 - 一辆自主遥控车，带你了解如何改装（使用现有的）遥控车并将其改造成地面无人机（遥控车）。我们展示了设计、3D打印甚至为你的遥控车定制新零件以适应Pixhawk的基础知识。你将更熟悉Pixhawk\
  \ 2.1板上的插头以及传感器如何连接，并对Mission Planner界面有一个基本概述。到本章结束时，你将了解如何使用Pixhawk 2.1、GPS传感器和远程遥测发射器创建一个遥控车。\n\
  \n第3章，猎人的无人机 – 自主鸭形诱饵，将遥控车的原理应用于开阔水域。本章主要关注提出可市场化创意和规划设计的过程。你将学习如何从遥控船上拆解零件并将其集成到定制的3D打印船体（鸭子）中。我们还将教育你关于水上无人机的防水、压载甚至驱动电机水冷的陷阱。\n\
  \n第4章，*高尔夫球手的无人机*，通过展示无人机可以融入几乎任何市场细分：本例为高尔夫，将量身定制的遥控车提升到新水平。我们将在现有的遥控高尔夫推车框架和电机系统上打造一辆高尔夫推车。它实现了差速转向和蓝牙遥测与控制，使其能够跟随口袋里装有手机的高尔夫球手。此外，我们还将集成一种新传感器：激光雷达测距仪，可让推车在自主跟随高尔夫球手时避开障碍物。\n\
  \n第5章，*无人机简介*，将读者从地面过渡到空中。空中无人机代表了全新的复杂性水平。重量考虑、平衡和安全问题是本章的重点，你将学会在设计空中无人机时更像一名航空工程师思考。\n\
  \n第6章，*一个简单的多旋翼无人机*，向读者展示如何构建和调校多旋翼无人机。我们采用“GoPro”云台（设计用于稳定GoPro相机）来承载360° VR相机（Ricoh\
  \ Theta S）。我们还将一步步带你通过Mission Planner界面搭建地面站，该站可在笔记本电脑屏幕上显示视频、抬头显示，甚至允许你使用游戏摇杆飞行无人机。\n\
  \n第7章，*圣杯 - 固定翼无人机*，带你了解设计和设置固定翼无人机的过程。我们将集成空速传感器（皮托管）并再次使用测距仪，但这次用于从地面感测高度以协助自主着陆。本章主要关注Mission\
  \ Planner软件。使用它来调校固定翼无人机使其正确飞行，我们将执行自主任务甚至在飞行员无输入的情况下着陆。\n\n第8章，*使用Pixhawk的VTOL原理*，是应无人机社区的强烈要求而添加的附赠章节。VTOL（垂直起降）无人机是既能悬停又能像直升机一样起降/着陆的飞机。本章不会建造无人机，而是带你了解规划、建造和调校VTOL飞机的概念。\n\
  \n第9章，*编程ArduPilot*，主要是一个参考章节，旨在为你提供Mission Planner界面及其所有基本参数的快速参考。\n\n### 阅读本书所需\n\
  \n本书通过示例指导你构建各种类型的无人机。你不必购买所有材料，甚至不必跟随制作。本书真正需要你拥有的只是想象力，我们希望通过示例激发它。\n\n\n\n\n\n\
