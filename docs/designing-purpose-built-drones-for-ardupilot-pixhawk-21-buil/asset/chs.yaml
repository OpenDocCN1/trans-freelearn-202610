- "# 第 7 章：圣杯——固定翼无人机\n\n哇，作为圣杯，她可真是一头丑陋的猪，对吧？嗯，原型通常都不好看。那么，为什么固定翼无人机（如下图中所示的飞机）被认为是圣杯呢？\n\
  \n![](img/504adb30bdfce87f38258e08f11180af_188_0.png)\n\n答案其实很简单。飞机需要不断移动才能保持在空中。飞得太慢，你就会失速（一个花哨的词，意思是从天空坠落，直到你重新获得速度，只不过通常坠落是垂直速度，而垂直速度是向下的）。\n\
  \n对于多旋翼，调参相当容易：起飞，悬停在**地面效应之外（OGE）**，让它稍微*抖动*一下。如果太疯狂，只需降落、重置设置并重复。由于飞机在不停地移动，调参对飞行器来说可能危险得多。\n\
  \n\n\n\n\n在调试固定翼飞机时，我曾让它们变成草坪飞镖，像海豚一样跃出海洋般鲸鱼式起伏，（正如前一章所述）甚至把机翼直接吹飞了。因此，在原型开发阶段，选用相对便宜且稳定的机身非常重要。选择时也应考虑对\
  \ Pixhawk 提供一定的保护，以防出现问题。这使得泡沫飞机成为完美的选择。泡沫飞机非常便宜，本质上就是会飞的包装材料。这当然不能保证 Pixhawk 在坠毁时能幸存。但它确实提高了存活几率。\n\
  \n本章将涵盖以下主题：\n\n- 为什么选择这款特定的飞机套件？\n- 组装\n- 使用 Mission Planner 调整固定翼飞机\n- 调整设置\n\
  - 调整过程\n- 自动调谐飞行\n\n## 为什么选择这款特定的飞机套件？\n\n我们使用的飞机（如下图所示）是 Hobby King 的 Bixler。它实际上是以热门\
  \ YouTube 频道 *Flite Test:* 的两位 Josh 之一（Josh Bixler）命名的：\n\n![](img/504adb30bdfce87f38258e08f11180af_189_0.png)\n\
  \n正如你所见，它非常便宜。不到 100 美元，而且自带电机和飞行所需的所有舵机。机翼上的上反角使其在滑翔时具有独特的稳定性。它还附带分离成两半的主机身（使布线和部件放置变得非常容易）。最后，它是一款动力滑翔机。这意味着它非常高效，并且在极低功率下具有飞行很远的潜力。这正是我们想要的！\n\
  \n## 组装\n\n在进入零件和具体放置位置之前，让我们先快速看一下这架无人机的草图：\n\n![](img/504adb30bdfce87f38258e08f11180af_190_0.png)\n\
  \n我知道，但我能说什么呢？我喜欢在喝一瓶葡萄酒的同时勾勒出我的想法。\n\n我们使用的外设与我们所有其他无人机相同，只是额外增加了一个皮托管。我们之前谈过皮托管，但简单回顾一下，皮托管只是一个测量飞机空速的装置。想想看——速度是相对的。信不信由你，即使你站在原地不动，你也在以\
  \ 113,000 英里/小时的速度旅行。是的，就是这样……为什么？因为地球自转速度为 1,000 英里/小时 + 地球绕太阳公转速度为 67,000 英里/小时，再加上太阳系穿过宇宙的速度为\
  \ 45,000 英里/小时。但在地球上，你的速度是 0 英里/小时，因为你的速度是相对于地面（地球）测量的。\n\n![](img/504adb30bdfce87f38258e08f11180af_192_0.png)\n\
  \n你可能会说的第一件事是，“等等……只有一个 I2C 端口，但你现在又在使用 LIDAR（I2C），和皮托管（也是 I2C）哇啊啊？” 再次说明，I2C、USB、CAN\
  \ 等都是用于多外设信息传输的数字协议，都可以使用集线器。我们倾向于在 Pixhawk 2.1 上使用 I2C 的原因之一（众多原因之一）是它自带 I2C 集线器。就像你电脑上的\
  \ USB 集线器一样；只需将 I2C 集线器插入 Pixhawk 的 I2C 端口，然后将所有其他 I2C 外设插入集线器即可。\n\n组装飞机是一个相当直接的过程。而且飞机本身（无论你选择什么机身）都会附带说明书。所以，我们不会用这些东西来[content]\n\
  \n在调试固定翼飞机时，我曾让它们变成草坪飞镖，像海豚一样跃出海洋般鲸鱼式起伏，（正如前一章所述）甚至把机翼直接吹飞了。因此，在原型开发阶段，选用相对便宜且稳定的机身非常重要。选择时也应考虑对\
  \ Pixhawk 提供一定的保护，以防出现问题。这使得泡沫飞机成为完美的选择。泡沫飞机非常便宜，本质上就是会飞的包装材料。这当然不能保证 Pixhawk 在坠毁时能幸存。但它确实提高了存活几率。\n\
  \n本章将涵盖以下主题：\n\n- 为什么选择这款特定的飞机套件？\n- 组装\n- 使用 Mission Planner 调整固定翼飞机\n- 调整设置\n\
  - 调整过程\n- 自动调谐飞行\n\n## 为什么选择这款特定的飞机套件？\n\n我们使用的飞机（如下图所示）是 Hobby King 的 Bixler。它实际上是以热门\
  \ YouTube 频道 *Flite Test:* 的两位 Josh 之一（Josh Bixler）命名的：\n\n![](img/504adb30bdfce87f38258e08f11180af_189_0.png)\n\
  \n正如你所见，它非常便宜。不到 100 美元，而且自带电机和飞行所需的所有舵机。机翼上的上反角使其在滑翔时具有独特的稳定性。它还附带分离成两半的主机身（使布线和部件放置变得非常容易）。最后，它是一款动力滑翔机。这意味着它非常高效，并且在极低功率下具有飞行很远的潜力。这正是我们想要的！\n\
  \n## 组装\n\n在进入零件和具体放置位置之前，让我们先快速看一下这架无人机的草图：\n\n![](img/504adb30bdfce87f38258e08f11180af_190_0.png)\n\
  \n我知道，但我能说什么呢？我喜欢在喝一瓶葡萄酒的同时勾勒出我的想法。\n\n我们使用的外设与我们所有其他无人机相同，只是额外增加了一个皮托管。我们之前谈过皮托管，但简单回顾一下，皮托管只是一个测量飞机空速的装置。想想看——速度是相对的。信不信由你，即使你站在原地不动，你也在以\
  \ 113,000 英里/小时的速度旅行。是的，就是这样……为什么？因为地球自转速度为 1,000 英里/小时 + 地球绕太阳公转速度为 67,000 英里/小时，再加上太阳系穿过宇宙的速度为\
  \ 45,000 英里/小时。但在地球上，你的速度是 0 英里/小时，因为你的速度是相对于地面（地球）测量的。\n\n![](img/504adb30bdfce87f38258e08f11180af_192_0.png)\n\
  \n你可能会说的第一件事是，“等等……只有一个 I2C 端口，但你现在又在使用 LIDAR（I2C），和皮托管（也是 I2C）哇啊啊？” 再次说明，I2C、USB、CAN\
  \ 等都是用于多外设信息传输的数字协议，都可以使用集线器。我们倾向于在 Pixhawk 2.1 上使用 I2C 的原因之一（众多原因之一）是它自带 I2C 集线器。就像你电脑上的\
  \ USB 集线器一样；只需将 I2C 集线器插入 Pixhawk 的 I2C 端口，然后将所有其他 I2C 外设插入集线器即可。\n\n组装飞机是一个相当直接的过程。而且飞机本身（无论你选择什么机身）都会附带说明书。所以，我们不会用这些东西来\n\
  \n\n因此，在固定翼飞机上不安装空速管不仅不可取，而且不安全，甚至极其愚蠢。\n\n正如你所看到的，空速管的安装和启用非常简单。\n\n要测试它，请前往 Mission\
  \ Planner 中的 Flight Data 屏幕，只需对着空速管吹气。你应该会看到空速上升，如下面的截图所示：\n\n![](img/504adb30bdfce87f38258e08f11180af_198_0.png)\n\
  \n当然，它确实会在“地速”区域显示读数（Mission Planner 团队从未创建过独立的地速和空速读数）。但实际上，这显示的是空速。\n\n- **巡航（CRUISE）：**\
  \ 从控制角度来看，该模式与 FBWB 颇为相似。然而，当松开摇杆时，Pixhawk 会计算当前轨迹并设定一个 1 公里外的航点。它会保持高度并朝该航点飞行。要激活此模式，你必须获得\
  \ GPS 定位。你还可以配置此模式以跟随地形（自动调整高度以适应山脉/丘陵）。\n- **自动（AUTO）：** 激活后，此模式开始执行你在 Mission\
  \ Planner 中预先规划的航点。这是完全自主飞行。不过，你可以通过摇杆输入来覆盖自主飞行（这模拟了 FBWA 模式）。\n- **返航（RTL）：** 这也是非常适合失效保护操作的模式。激活后，此模式会自主将飞机返回出发点（飞机起飞的位置）。然后它会按照\
  \ `ALT_HOLD_RTL` 参数设定的高度盘旋，等待进一步指令。要激活此模式，你必须获得 GPS 定位。\n- **盘旋（LOITER）：** 在此模式下，飞机会自动围绕你激活盘旋模式的位置进行圆周飞行。圆的半径由\
  \ `WP_LOITER_RAD` 控制，但不会超过 `NAV_ROLL_CD` 的限制。此外，它还受到 `NAVL1_PERIOD` 参数的限制。此模式也仅在获得\
  \ GPS 定位时可用。\n- **绕圈（CIRCLE）：** 绕圈与盘旋类似，但不依赖 GPS 定位。因此，它不一定会保持在同一个区域上空绕圈。如果受风影响，圆圈可能会缓慢顺风移动。它通常用作失效保护（先绕圈一段时间，然后\
  \ RTL）。由于倾斜角为 `LIM_ROLL_CD` 参数的三分之一，圆圈也相当大，以确保飞机在没有 GPS 定位时能够保持稳定。\n- **引导（GUIDED）：**\
  \ 这是你在笔记本电脑上用作“点击飞行”模式的模式。它允许你在 Mission Planner 中无需预先定义任务，直接在地图上点击一个点。飞机会飞到你在地图上点击的位置，并在那里盘旋等待进一步指令。此外，如果启用了地理围栏且该围栏被突破，飞机会自动进入此模式并返回预定义的返航点。\n\
  - **起飞（TAKEOFF）：** 这仅供高级用户使用。不要在首架飞机上尝试自动起飞，也不要在任何飞机充分调校之前尝试。自动起飞只能通过任务脚本设置。飞机会将油门增加到\
  \ `THR_MAX` 参数值，并上升到任务参数设定的目标高度。飞机会在跑道上前进时保持启动此模式之前所朝向的航向，直到达到高度。如果是手抛（或弹射）发射的飞机，`TKOFF_THR_MINACC`\
  \ 和 `TKOFF_THR_MINSPD` 参数用于根据速度确定何时加大油门。\n- **降落（LAND）：** 与 **TAKEOFF** 模式一样，此模式不适合胆小的人，并且只能通过任务脚本设置。当接近任务指定的着陆点时，飞机会自主减速并下降。一旦达到拉平高度（由\
  \ `LAND_FLARE_ALT` 设定）或到达目标剩余时间（以秒计，由 `LAND_FLARE_SEC` 设定），飞机会将俯仰角拉平至 `LAND_PITCH_CD`（以百分度为单位）设定的角度，并保持航向直到触地。要将此模式调整到恰到好处是一个非常棘手的过程。\n\
  \n如你所见，有大量飞行模式可供选择，几乎可以满足你的任何需求。但在你能使用其中大部分模式之前，你需要进行调校。\n\n## 设置飞行模式\n\n在你最初的几次飞行中，你真正只需要关注三种飞行模式——**手动**、**FBWA**\
  \ 和 **AUTOTUNE**。因此，我们已在三档选择开关上将这三种模式设置为模式 1、2 和 3，如下面的截图所示：\n\n![](img/504adb30bdfce87f38258e08f11180af_203_0.png)\n\
  \n通过切换遥控器上的另一个开关，我们可以使用模式 4、5 和 6。但在最初的几次飞行中，我们甚至不用考虑这些。现在我们只需要 **手动**、**FBWA**\
  \ 和 **AUTOTUNE**。\n\n## 自动调校等级\n\n自动调校等级（AUTOTUNE_LEVEL）决定了飞机最终操纵特性的激进程度。数值越高，飞机的响应越灵敏。数值越低，飞机响应越迟钝、越缓慢。6\
  \ 以上的数值只应由经验非常丰富的飞行员尝试，因为它们容错性不高，驾驶飞机时需要极高的技巧。默认设置为 6（如下面的截图所示）：\n\n![](img/504adb30bdfce87f38258e08f11180af_204_0.png)\n\
  \n## 调校过程\n\n每架机身都不同。有时即使是同一型号的机身，不同飞机之间的设置也可能不同。因此，重要的是要知道，你看到的任何 PID 设置都不应该直接用于你的飞机。相反，本节介绍的是如何得出这些\
  \ PID 设置的过程。第一步是确保你的飞机在完全没有 Pixhawk 输入的情况下正常飞行。\n\n## 首次飞行\n\n首次飞行一架飞机只是意味着让它第一次飞上天空。Pixhawk\
  \ 飞机首次飞行与任何其他遥控飞机之间的最大区别是，你绝不应使用遥控器上的微调控制。\n\n遥控器上的微调控制是摇杆附近的小按钮或滑块，用户可以通过偏移摇杆的值（PWMs）来实时调整控制面，以实现直线飞行。问题在于，通过使用微调控制偏移摇杆的值，Pixhawk\
  \ 将无法知道摇杆何时处于居中位置。因此，多个飞行模式将无法正常工作。\n\n那么，在遥控器上没有微调控制的情况下，我们如何让飞机直线飞行呢？这是一项艰巨的机械微调任务，需要改变连接舵机与控制面的推杆长度。下图展示了两种类型的推杆及其调节方式：\n\
  \n![](img/504adb30bdfce87f38258e08f11180af_205_0.png)\n\n![](img/504adb30bdfce87f38258e08f11180af_206_0.png)\n\
  \n如你所见，推杆基本上有两种类型。夹紧式推杆使用压接支架来改变推杆长度。将压接支架捏得更紧会缩短推杆，而将其撑开则会加长推杆。螺纹式推杆刚性强得多，通常带有\
  \ U 形夹头或球关节承窝头，用于连接控制点或舵机。\n\n在首次飞行之前，应调整所有这些推杆，以便当舵机归零（摇杆居中时通电）时，所有控制面都应机翼、垂直尾翼或水平尾翼的外形齐平。\n\
  \n在飞行过程中，如果飞机发生漂移（偏航、俯仰或横滚），你应该降落，然后调整推杆并再次尝试。这是一项乏味且非常耗时的工作。当你把所有控制面都微调好后，你应该能够将摇杆居中，而飞机应该保持直线水平飞行（除非存在风或湍流等外部力量）。\n\
  \n总而言之，完成控制面的微调可能需要几个小时。一旦你的飞机微调完成，你就可以进入下一步了。\n\n## AUTOTUNE 飞行\n\n这是你第一次允许 Pixhawk\
  \ 控制你的飞机。要明白，当你处于除手动之外的任何模式时，你都不再是真正在驾驶飞机。Pixhawk 正在主动控制你的飞机，并宽容地允许你的一部分指令转发到舵机上。真正重新夺回飞机控制权的唯一方法是使用手动模式。这是你的终极失效保护。因此，请随时准备切换到手动模式（尤其是在调校过程中）。\n\
  \n## 起飞并准备调校\n\nAUTOTUNE 模式与 FBWA 模式非常相似（在飞机的操纵特性方面）。因此，在手动模式下起飞后，确保飞机直线水平飞行。然后，切换到\
  \ FBWA 模式（并准备好切回手动）。如果飞机突然俯冲、爬升或横滚，请切回手动并降落。这意味着你的 Pixhawk 没有正确调平。你需要重新在 Pixhawk\
  \ 的 Mission Planner 中设置水平。\n\n\n\n\n\n## 进入 AUTOTUNE\n\n当你在 FBWA 模式下感觉已经比较熟练时，你就可以切换到\
  \ AUTOTUNE 了。确保你在进行自动调参时使用满电电池。它需要大量的飞行时间来确保尽可能准确。以下是切换到 AUTOTUNE 时会发生的主要情况：\n\n\
  - 激活后，Pixhawk 会为你的 PID 设置默认值（可在任务规划器的调参页面找到）。这些值取决于你的 AUTOTUNE_LEVEL。\n- Pixhawk\
  \ 会不断监控你的俯仰和滚转速率，以查看它们是否超过了你在任务规划器中设定的最大速率的 80%。你将使用摇杆来帮助 Pixhawk 学习你的飞机行为。\n- 每\
  \ 10 秒，Pixhawk 会根据对飞机的监控保存新的速率。换句话说，如果飞机变得不稳定，你有 10 秒时间切换到手动模式并取消当前速率。这有点像撤销功能。\n\
  - 从默认值开始，Pixhawk 的速率会让飞机感觉迟钝。但随着你在 AUTOTUNE 模式下的进展，你会注意到操控性越来越好。请确保有足够的空间，因为一开始这意味着会做非常宽且缓慢的转弯。\n\
  \n## 如何在 AUTOTUNE 中飞行\n\nAUTOTUNE 并不是一个细微的过程。任何观看飞机的人都会认为你可能是在受影响的情况下飞行。它依赖于对摇杆的极端操作，以便\
  \ Pixhawk 知道如何应对极端情况。\n\n首先，你需要调校副翼，然后是升降舵（先滚转，再俯仰）。要做到这一点，只需快速将副翼控制杆完全向左移动。这会使副翼移动到最大偏转位置。保持该位置至少\
  \ 2 秒钟。别担心，飞机不会滚翻。它会在我们之前设定的最大倾斜角处停止倾斜。然后，快速将摇杆移向右侧并保持至少另外 2 秒。左右移动后，你就完成了一个循环。\n\
  \n每个循环的调校大约会改善 5%。Pixhawk 手册指出你应该做 20 个完整循环。然而，做更多循环会进一步改善调校。因此，我建议至少进行 30 个循环（而我每次进行\
  \ AUTOTUNE 时通常会做 40-50 个）。\n\n## 自动驾驶仪调校\n\n自动驾驶仪的多种用途都依赖于飞机能够直线飞行并尽可能紧密地执行转弯。例如，使用固定翼飞机进行测绘需要飞机沿着彼此相当接近的直线飞行。如果转弯过大，或飞机无法直线飞行，地图上可能会出现空隙，这意味着地图质量非常差。转弯过紧也可能导致类似问题，甚至因拉力过大而把机翼从飞机上扯掉。\n\
  \n因此，飞行调校的最后阶段是确保飞机能够直线飞行并执行（合理）紧密的转弯。\n\n## 设置任务\n\n在通过遥测连接到飞机之前，你应该设置一个矩形任务（如以下屏幕截图所示）。拥有长直路段很重要，这样你才能看到飞机保持直线的能力：\n\
  \n![](img/504adb30bdfce87f38258e08f11180af_209_0.png)\n\n![](img/504adb30bdfce87f38258e08f11180af_214_0.png)\n\
  \n好吧，开始吧。再次发射飞机（在 **MANUAL** 模式下）。一旦飞机上升到大致与第一个航点相同的高度，将模式切换到 **FBWB**。在这个最接近全自动驾驶的飞行员控制模式下，飞行一段时间。这是你最后一次检查其他调参参数是否就绪。如果飞机稳定，将模式切换到\
  \ Auto。这将启动自动驾驶仪，飞机将等待片刻，然后向第一个航点做出第一次转弯。\n\n当它沿着路径移动时，你会看到飞行路径（紫色）看起来像以下图像：\n\n\
  ![](img/504adb30bdfce87f38258e08f11180af_215_0.png)\n\n正如你所见，飞机在航点之间的连线上略有偏离。对于固定翼飞机来说，由于其特性，这总是会发生。然而，我们希望它尽可能接近那条线。做到这一点的方法是使转弯半径尽可能紧，同时不使飞机不稳定。不稳定的第一个迹象是飞机偏航振荡（鱼尾摆动）。\n\
  \n你实际上可以在飞机飞行时进行此调整。将飞行控制交给另一位值得信赖的飞行员（以防出现问题，你希望他们能够切换到手动并降落飞机），并切换到以下屏幕截图中显示的基础调校屏幕：\n\
  \n![](img/504adb30bdfce87f38258e08f11180af_216_0.png)\n\n如果飞机飞行过于松散（超出路径太多），将 L1\
  \ 控制区域的 Period 参数减少 1。这可能很繁琐，但你必须在此过程中进行小幅增量，否则你可能会坠毁飞机。如果过于紧（鱼尾摆动），将数值增加 1。继续此过程，直到飞行路径尽可能紧而不出现鱼尾摆动。不要忘记，每次更改值后都要在界面中点击写入参数按钮。\n\
  \n完成此校准后，继续在 MANUAL 模式下降落飞机。就这样！你的基础调校完成了。现在，让我们看一些更高级的内容。\n\n## 自动降落调校\n\n在尝试自动降落之前，先用飞机进行几次自动驾驶飞行。确保你对它的飞行方式完全满意。降落是飞行中最困难的部分。调校不良的飞机在尝试自动降落时会让你处于极大劣势，并且几乎保证会坠毁。\n\
  \n在正常自动驾驶期间，你可以不用调校总能量控制系统（TECS）。如果听起来很复杂，那确实如此。基本上，该系统管理油门以爬升/下降比率，以使飞机在爬升、上升和水平飞行期间能够保持相当恒定的空速。该系统对自动降落至关重要，因此在尝试之前应\
  \ definitely 进行调校。让我们在下一节中仔细看看它。\n\n## TECS 调校\n\n首先，在进行 TECS 调校之前，你应该按照前面概述的方式为飞机进行稳定的调校。这是一个需要两个人进行的过程：一名飞行员和另一名人员监控飞机遥测数据（大部分时间是空速）。所有这些设置都需要更改参数列表中。\n\
  \n以下是初始步骤（对此使用 FBWA 模式）：\n\n- 1. 设置最大油门百分比（`THR_MAX`）。这是以你设定的巡航速度（`TRIM_ARSPD_CM`）在最大俯仰角（默认\
  \ 20 度）下仍能爬升所需的油门。默认的 75% 对大多数飞机有效。但低速飞机可能需要更多，而弹道式飞机（可以直上）可能需要更少。以最大俯仰角飞行并找到一个舒适的位置。让你的地面站监控人员报出你的空速，并使用\
  \ `THR_MAX` 设置将其更改为该数值。\n- 2. 使用 `TRIM_THROTTLE` 参数设置水平飞行时的巡航油门（`TRIM_ARSPD_CM`）。这可以通过在\
  \ FBWA 模式下飞行并测试不同设置来完成。\n- 3. 设置最小和最大空速限制。最大（`ARSPD_FBW_MAX`）应设置为在水平飞行时达到 `THR_MAX`\
  \ 时的空速。最小（`ARSPD_FBW_MIN`）应设置为你可以在不失速或失去稳定性的情况下飞行的最慢速度。\n- 4. 设置最大俯仰角（`LIM_PITCH_MAX`）。现在你已设置\
  \ `THR_MAX`，在 FBWA 模式下测试它。加满油门并尽可能猛烈地爬升。如果爬升过程中空速超过 `TRIM_ARSPD`，则增加 `LIM_PITCH_MAX`\
  \ 或减少 `THR_MAX`。如果爬升过程中空速低于 `ARSPD_FBW_MIN`，则减少 `LIM_PITCH_MAX`，或增加 `THR_MAX`。理想情况下，你希望达到平衡，即在\
  \ FBWA 下以最大油门和最大爬升率时，保持 `TRIM_ARSPD` 的空速目标。\n- 5. 设置最小俯仰角（`LIM_PITCH_MIN`）。这设置为在\
  \ `THR_MIN` 时可以将机头向下俯仰多少而不会使飞机超速。\n- 6. 设置最大爬升率（`TECS_CLMB_MAX`）。不要将其与空速或俯仰混淆。这严格来说是飞机获得高度的速度。将其设置为在\
  \ `THR_MAX` 和空速等于 `TRIM_ARSPD_CM` 时你能达到的最快爬升率。\n\n\n\n\n\n- 7. 设置最小下沉率（`TECS_SINK_MIN`）。将其设置为油门设为\
  \ `THR_MIN` 时的下降率，以及当你向下俯仰机头并能保持等于 `TRIM_ARSPD_CM` 的空速时的下沉率。\n- 8. 设置最大下沉率（`TECS_SINK_MAX`）。这是通过在不超出下限俯仰限制且从不超出\
  \ `ARSPD_FBW_MAX` 的情况下下降飞机来计算的。\n\n## 测试和微调 TECS\n\n在继续设置自主降落之前，你需要测试你的调参并将其调好。以下是测试步骤：\n\
  \n- 1. 使用 RTL 将飞机设置为在你的家点附近盘旋。确保它能够在高度变化不超过 10 m 的情况下保持高度。如果它开始高度振荡，请增加 `TECS_TIME_CONST`。每次只增加\
  \ 1。如果发现自己整体更改了 10 或更多，则需要全部退回并检查原始 PID 调参。\n- 2. 检查 `THR_MAX`、`TECS_CLIMB_MAX`\
  \ 和 `LIM_PITCH_MAX` 之间的平衡是否正确。只需在 RTL 盘旋中发送命令让飞机增加约 60 m 的高度。油门应达到 `THR_MAX` 的约\
  \ 80%，俯仰应约为 `LIM_PITCH_MAX` 的 5° 以下。以下是如何排查任何问题的说明：\n  - 1. 如果速度开始下降到你舒适的范围以下或油门卡在\
  \ `THR_MAX`；要么增加 `THR_MAX`，要么降低 `TECS_CLIMB_MAX`。\n  - 2. 俯仰角 constantly 卡在最大值；要么增加\
  \ `LIM_PITCH_MAX` 要么降低 `TECS_CLIMB_MAX`。\n- 3. 检查 `LIM_PITCH_MIN` 和 `TECS_CLIMB_MIN`\
  \ 之间的平衡。在 RTL 盘旋中发送命令让飞机下降约 60 m。理想情况下，油门会降低并保持在 `THR_MIN`，空速保持在 `ARSPD_FBW_MAX`\
  \ 以下，同时 `LIM_PITCH_MIN` 保持在其设置值上方约 5°。如果未满足这些要求，以下是如何排查：\n  - 1. 如果俯仰卡在 `LIM_PITCH_MIN`，要么降低\
  \ `TECS_SINK_MAX`，要么降低 `LIM_PITCH_MIN` 数值。\n  - 2. 如果速度过快，则降低 `TECS_SINK_MAX`\n\n\
  仍有其他参数可用于微调 TECS。一般来说，除非在特殊情况下，否则你不需要这些参数。完整的参数列表，请访问此页面：http://ardupilot.org/plane/docs/tecs-total-energy-control-system-for-speed-height-tuning-guide.html#complete-parameter-list。\n\
  \n现在 TECS 已调好，我们可以开始设置自主降落参数。\n\n## 自主降落设置和参数\n\n幸运的是，自主降落本身的参数并不多。 不幸的是，将这些参数调好可能是一个令人沮丧的过程。让我们逐一查看它们：\n\
  \n- **LAND_FLARE_SEC** 和 **LAND_FLARE_ALT**：我们会同时介绍这两个参数，因为它们非常密切相关。LAND_FLARE_SEC\
  \ 优先于两者，这只是飞机应在撞地前多少秒开始拉平。拉平是切断动力并抬起机头以减速飞机并开始最后下降到着陆区。LAND_FLARE_ALT 是飞机应在距地面多少米处执行相同任务。\
  \ 如果你仅依赖 Pixhawk 的气压计进行高度测量，这组数值应设置得相当高（例如 10 秒和 6 米）。由于我们使用的是相当精确的测距仪，我们将其设置为 4\
  \ 秒和 2 米。\n- **TECS_LAND_SPDWGT**：这是一个用于控制着陆空速（我们稍后会介绍）和最后航点与着陆目标之间下滑坡度之间平衡的参数。下滑坡度绝不应超过\
  \ 10%（例如，从 300 m 外下降 30 m），理想情况下应远低于此。 但如果你的着陆速度接近失速，你会希望给予空速比下滑坡度更高的优先级。范围为 0-2。1\
  \ 为相等平衡（默认值）。0 完全优先于下滑坡度，2 完全优先于速度。你可以使用小数（浮点数）作为这些值。值为 -1 会动态缩放此值，不断调整优先级直到触地时为\
  \ 0。它往往能产生更准确的着陆。\n- **TECS_LAND_ARSPD**：这是你希望着陆的速度。理想情况下，这是不会失速但会下降高度的速度。\n- **LAND_PF_ALT**\
  \ 和 **LAND_PF_SEC**：这些设置与拉平类似。 然而，这些是预拉平。通过预拉平，飞机可以将速度降至 TECS_LAND_ARSPD 以下并实际加速到着陆速度。这可以为\
  \ Pixhawk 在着陆期间提供更大的控制。这些值应大于拉平设置的值（例如，如果 LAND_FLARE_ALT 为 4，LAND_PF_ALT 应为 6 甚至\
  \ 8）。\n- `LAND_PF_ARSPD`：这是你的预拉平空速目标速度。它应低于 `TECS_LAND_ARSPD` 设置，但高于失速速度。一些飞机着陆速度很快（例如\
  \ EDF 喷气机），在这种情况下，设置为 1 只会指示飞机在到达拉平区之前尽可能多地减速。\n- `TECS_LAND_SINK`：这是触地时的下降速度。默认情况下，它设置为\
  \ 0.25 米每秒，这适用于许多机型。 然而，如果你的飞机弹跳，你会希望进一步降低此值。\n- `LAND_PITCH_CD`：这是拉平的最小目标俯仰角。具有三轮起落架（前面一个，后面两个）的飞机希望此值约为\
  \ 300（3°，因为参数中的 CD 表示百分度）。\n- `TECS_LAND_DAMP`：这是拉平期间俯仰变化速率的阻尼器。接近失速速度时的突然极端动作很危险，因此此设置可能很有用。数值越大，阻尼越大。\n\
  - `LEVEL_ROLL_LIMIT`：用于控制拉平后最大滚转角（默认 5°）。这是为了防止着陆时机翼撞击地面。 因此，在极端侧风的情况下，飞机可能无法在期望的目标着陆。\n\
  - `TECS_LAND_SRC`：此参数用于在飞行中调整你的 `TECS_LAND_SINK`，以确保飞机降落在着陆目标上。如果发现自己超调，可以将数值减小到负值以强制失速，或用正数值强制机头向下。\n\
  - `LAND_DISARMDELAY`：飞机停止移动后（GPS，而非空速），这是 Pixhawk 在解除武装前的延迟秒数。默认值为 20 秒。\n- `RNGFND_LANDING`：此设置让\
  \ Pixhawk 知道是否使用测距仪在着陆期间计算到跑道的距离。如果使用测距仪，将此设置为 1。\n\n好吧，也许设置相当多。但你用于调参的主要是影响拉平的那些。\n\
  \n## 测试\n\n设置一个任务，使最终航点足够低，以便着陆不会产生大于 8% 且小于 5% 的下滑坡度，并在你的着陆区设置一个 `DO_LAND_START`\
  \ 标记。记得在着陆区前后为自己留出一些安全空间（以防欠射或过射）。\n\n然后，将模式切换到自动模式，同时手指悬停在切换回手动的开关上并密切观察飞机。准备好切换到手动并全功率上升回天空。\n\
  \n如果你不喜欢着陆方式，使用前面提到的设置来调整你的拉平和速度和角度以抵消你不喜欢的部分。当然，在进行调整之前先以 **MANUAL** 模式着陆，然后再试一次。\n\
  \n在你对着陆感到满意之前需要多次迭代。一旦你满意，就在任务开头添加一个 `TAKEOFF` 命令，看看你是否能从起飞到着陆运行一次完全自主飞行。如果成功，你会非常高兴。\n\
  \n## 总结\n\n哇！那很多，对吧？现在你可以看到为什么固定翼飞机真的是无人机设计师的圣杯。在本章中，我们了解了将 Pixhawk 集成到固定翼无人机所需的额外组件。我们了解了放置和设计思考。最后，我们经历了调校固定翼无人机的非常复杂和冗长的过程。\n\
  \n在下一章中，我们实际上不会建造一架无人机。相反，我们将带你了解创建 VTOL 飞机的一些概念... 有趣！\n\n\n\n\n"
- "# 第 8 章：基于 Pixhawk 的垂直起降原理\n\n## 第 8 章：基于 Pixhawk 的垂直起降原理\n\n设计和调优一架**垂直起降（VTOL）**飞行器可能需要很长时间。设计并让你的\
  \ VTOL 飞行器实现稳定飞行，甚至可能需要数年时间。最初，本章打算基于一个有趣的东西——*Battlebot* 设计。但是，当本书宣布时，有一点非常明确。你（读者们）想了解更多关于\
  \ VTOL 的内容。因此，由于既没有时间也没有预算去制造一架 VTOL 原型机（等我们成功让它正常工作时，很可能新版本的 Pixhawk 已经发布了）；我们将致力于研究如何创建一个\
  \ Pixhawk VTOL 的原理和理论，而不是某个人是如何完成 Pixhawk VTOL 的。\n\n在本章中，我们将涵盖以下主题：\n\n-   VTOL\
  \ 飞行器的类型\n-   VTOL 的限制与考量\n-   融合多旋翼与固定翼设计\n-   调优 VTOL 飞行器\n\n## VTOL 的类型\n\nVTOL\
  \ 基本上有两种类型：混合型和推力矢量型。所有其他 VTOL 都是这两种类型的变体。其中一种更容易制造，而另一种飞行性能更好（且效率更高）。不幸的是，这些优点并不集中在同一种\
  \ VTOL 类型上。\n\n## 混合型 VTOL\n\n这种类型当然容易设计和制造。只需拿一架非常好的固定翼飞机，然后将多旋翼框架附加到它上面（以飞机的重心为中心）。这有点过于简化了，但很准确。不幸的是，在这种设计中，多旋翼的螺旋桨在向前飞行时可能会因风力而开始旋转。即使不旋转，它们本质上也是控制面，会在机翼周围引起奇怪的湍流和涡流，从而改变飞机的飞行方式。此外，围绕移动空气设计的控制面在向前飞行时不发挥作用，这会降低你的效率。并且（一般来说）制造固定翼无人机的目的是为了获得更长的飞行时间（可能还有速度）。因此，制造风阻是适得其反的。下图展示了一架混合型\
  \ VTOL 飞行器：\n\n![](img/504adb30bdfce87f38258e08f11180af_223_0.png)\n\n## 推力矢量 VTOL\n\
  \n推力矢量只是一个花哨的词，指的是改变推力系统所推动空气的方向。无论是通过旋转螺旋桨（如鱼鹰军用飞机）、旋转喷气口（如鹞式战斗机），还是改变飞行器的整体方向（如\
  \ X-Plane 无人机，它像四轴飞行器一样用尾部起降，然后旋转机身前向飞行），识别推力矢量 VTOL 的方法是它使用同一套推力系统来完成垂直起降和在飞行中向前推进。\n\
  \n在设计阶段要正确实现这一点要困难得多，从重心变化到考虑在空中推拉飞机对飞机模式飞行的不同影响。这无疑是一个设计挑战，而且你需要有预算。在这种类型的飞行器上，过渡到前向飞行阶段预计会经历几次坠毁，直到你把它调好。\n\
  \n推力矢量 VTOL 的所有努力带来的回报是，在所有的飞行模式下，每一克重量都被充分利用。在飞机模式飞行时，不会有任何*无功能*的部件挂在外面。这也意味着没有能量浪费。无论是推动在前向飞行中不使用的部件穿过气流，还是使用控制面来抵消它们对飞行的影响。每次你（或你的飞行控制器）使用控制面，都意味着风的阻力，当然，这也就意味着飞行时间减少。\n\
  \n下图是一架鹞式战斗机。美国（和英国）海军大量使用这种飞机，因为它能够在小得多的航空母舰上起降，这些航母的建造成本远低于那些搭载需要弹射器起飞和拦阻索降落飞机的大型航母。鹞式战斗机使用一台大型涡扇发动机，并将发动机排气引导至机翼下方（主船体两侧）的可旋转喷嘴，这些喷嘴还配有百叶窗，甚至可以将推力推向侧面。这是推力矢量\
  \ VTOL 飞行器的一个非常典型的例子，也是最早的之一：\n\n![](img/504adb30bdfce87f38258e08f11180af_224_0.png)\n\
  \n霍克鹞式战斗机；图片由维基共享资源提供\n\n## 挑战\n\n幸运的是，我们已经知道飞机含电池（湿重）的重量。这个重量是 34.79 盎司（986.28\
  \ 克）。我们需要做的是找到多旋翼电机、电调、翼梁和线路，使得飞机加上附加部件的总湿重低于多旋翼的飞行重量限制，并且电池中还有足够的电量来维持合理时间的前向飞行，然后再垂直降落。我们还需要保持在\
  \ Bixler 的最大重量以下。\n\n我们的第一个问题出现了。我们（严格来说）已经超过了 Bixler 的最大重量。公布的最大飞行重量是 650 克（22.92\
  \ 盎司）。然而，这似乎是干重。即便如此，我们也几乎达到了 Bixler 的最大飞行重量。所以，这行不通。我们需要一架机翼更大、更强、坚固得多的飞机，而且既然我们要这么做，我们需要能携带（并运行）6S\
  \ 电池的飞机：10,000 mAh 6S 电池。这是中等至重型举升多旋翼非常常见的电池，应该足以满足我们的 VTOL 需求。\n\n## 简单的事情变复杂了\n\
  \n好吧，我们的 Bixler 显然不行。它并不是为承载那么多重量或有效载荷而设计的。仅一块 10,000 mAh 电池就重约 1,400 克（49.39 盎司）。这比我们\
  \ Bixler 的整个飞行重量还重。我们选择这种电池是因为 6S（22.2V）电池能提供足够的电力来在多旋翼中提升重物。而 10,000 mAh 也应该能为我们的固定翼飞机提供充足的飞行时间。\n\
  \n那么，我们知道什么不行。什么可以呢？来看看 Skywalker EVE-2000。对于最终量产型号，我们当然会设计更专门的东西。但这是一个测试混合设计的绝佳机身。它有巨大的机翼（2,400\
  \ 毫米翼展），最大湿重为 4,600 克（162.26 盎司）。\n\n![](img/504adb30bdfce87f38258e08f11180af_228_0.png)\n\
  \n所以，我们的想法是穿过机身，将翼梁直接连接到木板（替换为碳纤维板）上。我们需要一些硬件：\n\n## 制定我们的购物清单\n\n在原型制作中，计算预算是必不可少的。你可能在为客户、投资者做预算，或者我们确信你的另一半会想知道这要花多少钱。因此，在真正制作最终设计之前，弄清楚你最可能需要哪些部件至关重要。\n\
  \n首先，通过 fpvmodel.com 购买一架 Skywalker EVE-2000 需要 285 美元（USD）。它是 PNP（即插即用）版本（因此附带所有舵机、电机和螺旋桨），所以你只需要插入你的\
  \ Pixhawk 和外设，然后就可以飞了。\n\n那么，一块 Pixhawk 2.1（215 美元）、皮托管（70 美元）和用于着陆的激光测距仪（159 美元）使我们的累计总额达到\
  \ 729 美元。我们将在 GPS 方面走不同的路线。\n\n因为（通常来说）我们希望测绘数据非常准确，我们将使用一种由**载波相位差分技术**（**RTK**）增强的\
  \ GPS 系统。RTK 在地面上使用一个固定的 GPS 基站，并利用与空中系统传输的相对数据，使空中系统能够更准确地估算其实际坐标。GPS 的精度大约在直径\
  \ 6 英尺（2 米）的范围内，而 RTK 可以达到厘米级精度。这真是惊人的精确。为了控制预算和重量，我们会使用下面这款：\n\n![](img/504adb30bdfce87f38258e08f11180af_229_0.png)\n\
  \n它的价格是 650 美元，这样我们的累计总额就达到了 1,379 美元。\n\n考虑到多旋翼的所有变量，我们会在这里停下来，完成组装、飞行测试和调优，然后开始实现多旋翼部分。但我们稍后会进入测试过程。\n\
  \n让我们从电机到机身的顺序来检查多旋翼系统，确保它能举起所有东西。\n\n\n\n\n许多电机安装座有些凹陷（这意味着翼梁管与电机平面相交）。我们希望安装座是齐平的，这样如果在测试过程中需要添加更大的电机，就不必重新设计多旋翼机身。于是，我们找到了这些：\n\
  \n![](img/504adb30bdfce87f38258e08f11180af_230_0.png)\n\n其中四个（约 $63）使我们的总金额达到 $1,442。它们适配\
  \ 25 mm 的碳纤维管。但我们还得等一等再做决定，因为我们需要知道多旋翼上的螺旋桨会有多大。我们需要确保它们不会碰到固定翼飞机的螺旋桨。\n\n在决定螺旋桨之前，我们需要先确定电机。不是每个电机都能驱动每个螺旋桨。在\
  \ 6S 电流等级下，480kv（每伏特 480 转）是一个相当安全的选择。螺旋桨越大，KV 值越低。而我们选择的电机（如下图所示），配备 13 英寸直径、6.5\
  \ 英寸螺距（通常称为 13 x 6.5）的螺旋桨时，每个可产生 2,000 克推力：\n\n![](img/504adb30bdfce87f38258e08f11180af_230_1.png)\n\
  \n大约 $120（4 x $30），我们的累计总额达到 $1,562。现在我们来看螺旋桨。我们不希望在混合飞行器上使用折叠螺旋桨。它们在飞行中可能以错误的方式折起来，并且在切换到多旋翼模式时无法正确展开。所以，固定式碳纤维螺旋桨才是我们想要的：\n\
  \n![](img/504adb30bdfce87f38258e08f11180af_231_0.png)\n\n再加 $28，我们就达到 $1,590。总推力为\
  \ 8,000 克，足以让我们的飞机垂直离地。\n\n在这些旋翼带动下，电机负载时电流约为 25 A，但这是持续电流。峰值可能高达 35 A。我们需要能够承受更高电流的\
  \ ESC。如果我们选用 40 A 的 ESC，预计每个约 $25（但某些品牌会贵得多）。考虑到这一点，四个共 $100，我们现在的总额达到 $1,690。\n\
  \n好，现在我们知道了我们使用的是 13.5 英寸（直径）的螺旋桨，也就知道了这些螺旋桨的旋转半径为 6.75 英寸。我们希望留出一些余量，所以我们将以 9 英寸的间隙来计算这个半径。\n\
  接下来是高中几何，还有那句人人痛恨的“勾股定理”。看到了吧？你的老师说得没错！它在现实世界中确实有用！\n\n我们假设机身宽度约为 9 英寸，这意味着从中心线到\
  \ x 轴（沿机翼方向）需要额外的 4.5 英寸。我们还假设螺旋桨和电机外壳在三角形 y 轴（向前方向）上从机翼边缘向外延伸 2 英寸。如果我们想要 9 英寸的间隙，那么\
  \ (9+4.5)²+(9+2)² = (长度)²。我们的碳纤维翼梁至少需要 17.42 英寸长，约合 442.5 毫米。我们取整到 500 毫米（因为我们可以随时截短，但不能加长）。我们认为这些\
  \ 20 毫米（内径）x 25 毫米（外径）x 500 毫米（长度）的碳纤维杆正合适：\n\n![](img/504adb30bdfce87f38258e08f11180af_232_0.png)\n\
  \n其中两个（每笔订单附带两根翼梁）使我们的累计总额达到 $1,718。\n\n最后，我们购买一块 1/8 英寸厚、24 x 24 英寸的碳纤维板，价格为 $203（来自\
  \ DragonPlate.com），以及一些安装环（四包），约 $20（如下图所示）。至此，我们的总费用达到 $1,941。好的，这就是我们的制造成本。但这是否就是实际花费呢？不是。我们还得计入杂项费用（如胶水等），以及调试（摔机）的成本。因此，我们估计这架不带相机的飞机的最终成本为\
  \ $2,500（这是制造成本，毕竟不是我们要向客户收取的费用，更不用说你的劳动力了）。\n\n![](img/504adb30bdfce87f38258e08f11180af_232_1.png)\n\
  \n好的……既然我们已经知道要用哪些部件，那我们计划如何实施呢？\n\n## 最终方案\n\n对于这样复杂的构建，仅仅画一个布局草图是远远不够的。投入了太多资金，不能只依靠草图。下图展示了我们最终方案的四分之三视图：\n\
  \n![](img/504adb30bdfce87f38258e08f11180af_233_0.png)\n\n## 配置 Pixhawk\n\n在之前几代这种类型的混合飞行器中，你需要使用\
  \ PX4 固件（而不是 Ardupilot 或 APM）并进行大量定制。幸运的是，较新的 Ardupilot 固件版本正好支持这种类型的垂直起降（VTOL），他们称之为\
  \ Quadplane。显然，通道会有些不同。\n\n下图展示了所有电机/舵机的连接方式：\n\n![](img/504adb30bdfce87f38258e08f11180af_233_1.png)\n\
  \n|  |  |\n|---|---|\n| ARMING_RUDDER | 如果将此值设置为 2，你可以通过向左打满舵并收油门来让电机上锁。但是请注意，不要用收油门到零和猛向左打舵的方式飞行，否则你会让飞行器上锁。\
  \ |\n| Q_THR_MID | 这是一个 0-1,000 之间的值；500 表示 50% 油门（也是默认值）。这是多旋翼电机维持悬停所需的油门量。在调试过程中，如果切换到固定翼模式时注意到高度突然上升，请降低该值；如果看到高度下降，则增加该值。\
  \ |\n| Q_TRANSITION_MS | 这是 Pixhawk 缓慢关闭四轴电机所需的时间（在达到产生升力的最低空速后，电机需要多长时间才关闭），反之亦然（切换回多旋翼模式时重新启动电机的时间）。默认值为\
  \ 5000（5 秒）。 |\n| ARSPD_FBW_MIN | 这是机翼产生升力所需的最低空速。（在转换过程中达到该速度时会触发 Q_TRANSITION_MS。）\
  \ |\n| Q_VFWD_GAIN | 默认设置为 0。如果设置为大于 0，则表示牵引（固定翼推力）电机在迎风时用于帮助保持多旋翼水平的力度。仅在你熟悉高级操作时才使用。\
  \ |\n| Q_ASSIST_SPEED | 该参数用于在飞行器速度低于设定速度阈值时提供额外升力。这不是切换到四轴飞行模式，而是在固定翼飞行中由四轴螺旋桨辅助，防止飞机失速。\
  \ |\n| Q_ASSIST_ANGLE | 与 Q_ASSIST_SPEED 配合使用时，这个参数会非常有用。在实际失速之前，飞机在低速时会开始掉高度。该参数是平飞中四轴电机介入并产生额外升力的下降角度。在\
  \ AUTO、LOITER、RTL 或 GUIDED 模式下，四轴电机将辅助爬升率，使飞行器达到下一个航点（或导航控制器要求的）高度。在 FBWB 模式下，四轴电机将辅助所需的爬升率。在\
  \ FBWA 模式下，四轴电机将根据飞行员的上升或下降速率提供成比例的升力。此辅助功能仅推荐用于机翼升力不足、无法单独依靠固定翼模式保持高度的 Quadplane。使用此参数时，你会发现效率和电池寿命会显著下降。\
  \ |\n| RTL_RADIUS | 这是飞行器从起飞点开始，从固定翼 RTL 模式切换到 VTOL QRTL 模式（从固定翼过渡到多旋翼）的距离。 |\n\
  | Q_RTL_ALT | QRTL 模式期间瞄准的目标高度。 |\n| Q_RTL_MODE | 将其设置为 1 以在 RTL 期间启用自动转换（使用 RTL_RADIUS\
  \ 和 Q_RTL_ALT）。 |\n| Q_WVANE_GAIN | 在多旋翼模式下，飞行器主动迎风转向的程度。由于 VTOL 飞机的特性，电机可能需要非常努力地工作才能防止机尾在顺风时甩来甩去。该增益允许飞机向风“妥协”。\
  \ |\n\n![](img/504adb30bdfce87f38258e08f11180af_236_0.png)\n\nQuadplane 需要 GPS 才能正常飞行。在尝试任何飞行之前，务必等待收到\
  \ 3D GPS 定位成功的信号。\n\n## Quadplane 飞行模式\n\nQuadplane 特有的飞行模式是多旋翼模式下的飞行模式。具体如下：\n\n\
  - **QSTABILIZE**：与普通多旋翼的自稳模式一样。横滚和俯仰控制倾斜角，但松开摇杆后，多旋翼会恢复水平（但可能会漂移）。与大疆的 **ATTI**（姿态）模式类似。\n\
  - **QHOVER**：与普通多旋翼的定高模式一样。该模式保持高度，你可以通过横滚、俯仰和偏航控制来定位多旋翼。松开摇杆后，多旋翼会停下并保持在悬停位置。\n\
  - **QLOITER**：与普通多旋翼的悬停模式一样。它也很像 **QHOVER**，但你确实能够控制飞行器的高度。就像大疆的 **GPS** 模式。\n-\
  \ **QLAND**：与普通多旋翼的降落模式一样。该模式会使飞行器下降并着陆，无论其物理位置如何。遗憾的是，这个模式没有多旋翼降落那么复杂。如果在地面发生 GPS\
  \ 漂移，飞行器可能会为了回到之前的位置而翻倒。因此，一旦着陆，你应该切换到 **QSTABILIZE** 模式，因为它不受 GPS 漂移的影响。\n\n\n\n\
  \n\n## 推荐的 VTOL RTL 程序\n\n对于这种混合机型，处理 **RTL** 有几种方法，但我推荐以下做法：\n\n- 1. 使用飞机 **RTL**\
  \ 模式返航（RTL）。这样可以快速到达附近区域。\n- 2. 靠近家点时切换到 **QRTL**。如果 `Q_RTL_ALT`、`RTL_RADIUS` 和\
  \ `Q_RTL_MODE` 已设置，则会自动发生。\n- 3. 切换到 **QLAND**，同样，如果 `Q_RTL_ALT`、`RTL_RADIUS` 和\
  \ `Q_RTL_MODE` 已设置，这将自动发生。\n\n我发现这是最高效的程序。不浪费电量在盘旋或其他机动上。直接飞入，切换模式，然后降落。\n\n## 尝试任何转换前的注意事项\n\
  \n我知道，经过所有这些努力，你会迫不及待地想看到它转换。 在甚至考虑转换之前，先调好多旋翼模式是一条漫长而痛苦的道路。\n\n确保在进行任何混合飞行之前，先调整所有\
  \ Q 调参参数，使多旋翼模式尽可能稳定地飞行。你将为自己节省大量费用和麻烦。\n\n尝试转换时，确保你在 **高于地面水平（AGL）** 最低 20 m 的高度以上。\
  \ 在你设置好所有 Q 转换参数之前，你很可能会在第一次测试中损失高度，甚至失去稳定性。 即使如此，也要保持在 20 m AGL 以上。\n\n## 飞行数据界面\n\
  \n下图显示了 Mission Planner 的飞行数据界面：\n\n![](img/504adb30bdfce87f38258e08f11180af_241_0.png)\n\
  \n左上角的窗口代表抬头显示器（HUD）——你可以在此立即了解飞机的朝向、高度和状态。 警告信息以红色文字显示（例如图像中我们看到的 DISARMED 和 Bad\
  \ AHRS 警告）。\n\n大窗口是显示飞机/多旋翼/地面车位置的投影卫星地图（在本例中为固定翼飞机）。 从飞机上伸出一条紫色线，表示飞机指向的方向。\n\n\
  左下角的窗口显示当前数据，并有多个选项卡以不同格式查看数据，甚至向 Pixhawk 传输信号。 选项卡如下：\n\n- **Quick：** 这些是来自飞行器的基本遥测数据的数值。\n\
  - **Actions：** 这允许用户向 Pixhawk 发送命令，例如悬停、武装等。\n- **PreFlight：** 这显示了在启动 Pixhawk 飞行器之前的前飞行检查清单和状态。\
  \ 绿色表示已准备好的项目，红色表示可能需要关注的项目。\n- **Gauges**：这显示了与快速屏幕类似信息的模拟视图。 该模拟视图使用图形表示形式，即虚拟仪表，而不是简单的数字。\n\
  - **Status**：这提供了飞行器所经历的每个遥测参数的详细读数。\n- **Telemetry Logs**：这允许用户将 Pixhawk 的飞行日志加载到计算机中并重放任务以便事后评估任务。\n\
  - **DataFlash Logs**：这用于排查 Pixhawk 的问题。 如果你在调参或任务中遇到问题，这些日志对于发现错误非常有用。 此外，当你向社区寻求帮助时，他们首先会问你提供这些日志以供分析。\n\
  - **Messages**：这提供了日志条目的实时视图，因为它们发生。\n\n## 飞行计划屏幕\n\n下图显示了飞行计划屏幕（未加载固定翼调参任务）：\n\n\
  ![](img/504adb30bdfce87f38258e08f11180af_242_0.png)\n\n主窗口显示任务区域的卫星地图。 黄色线条代表飞行器的期望路径，而白色圆圈代表转弯弧的区域（转弯半径）。\
  \ 绿色标记代表任务的实际航点目标。\n\n底部窗口是代表任务所有参数的图表。 在此窗口中，你可以添加事件（例如 Do Jump，它将飞行器发送回特定航点）。\
  \ 如果你的相机连接到 Pixhawk，你可以指示相机拍摄图像/开始录制。 飞行模式也可以设置为更改（例如“Land”）。 任何 Pixhawk 能够执行的命令都可以通过此界面触发。\n\
  \n最右侧的窗口允许你保存任务以供以后使用（到你的计算机），加载以前的任务，更改卫星地图的类型。 不同的地图可能证明更/少详细，并且也可能证明更/少及时。 最后，在此窗口底部，有一个区域允许你读取当前加载到\
  \ Pixhawk 中的航点，或写入你刚刚创建的航点。 你必须写入航点才能让 Pixhawk 执行任务。 家点也显示在这里。\n\n## 初始设置屏幕\n\n\
  下面的屏幕截图显示了初始设置屏幕的 Install Firmware 选项卡。 此屏幕允许你将 Pixhawk 模块重新用于其他应用（例如 Rover）：\n\n\
  ![](img/504adb30bdfce87f38258e08f11180af_243_0.png)\n\n## Wizard\n\n下面的屏幕截图显示了点击\
  \ Wizard 选项卡时弹出的界面。 这是一个分步配置向导，可帮助完成 Pixhawk 的基本设置：\n\n![](img/504adb30bdfce87f38258e08f11180af_244_0.png)\n\
  \n## 必需硬件\n\n本节允许你校准/设置使 Pixhawk 能够正确驱动你的飞行器的所有外围设备。 让我们逐一查看：\n\n- **Accel Calibration**：这允许校准加速度计。\
  \ 如果你在飞行数据屏幕中收到 Bad AHRS 错误，你需要执行此操作。 只需进入此菜单并点击 Calibrate Accelerometer 以打开校准向导。\
  \ Calibrate Level 按钮可让你校准 Pixhawk 的正确水平位置。 这对于飞机至关重要，否则它们在 Pixhawk 认为其飞行水平时可能会俯仰/滚转。\
  \ 在多旋翼中，如果未正确校准，这会导致尝试悬停时移动。 在固定翼中，如果未正确校准，这会导致俯仰/滚转轴振荡。 如果你更改飞机上 Pixhawk 的位置，这也是一个必不可少的流程。\n\
  - **Bluetooth Setup**：用于设置蓝牙模块的区域（例如我们在高尔夫球车设置中使用的那种）。 由于其范围有限，蓝牙不应用于飞机或快速移动的车辆。\
  \ 请记住，蓝牙的范围约为 30 米。\n- **Parachute**：这需要一个区域来设置降落伞部署系统。 这些系统并不广泛使用，但在飞机发生故障（尤其是在人员上方）时可能证明有用，甚至可以代替车辆着陆。\
  \ 需要注意的是（尤其是在多旋翼上），飞机可能会缠绕在降落伞线上，降落伞应被视为最后的机会，而不是可靠的手段。\n- **ESP8266**：这是设置 ESP8266\
  \ Wi-Fi 模块的区域。 正如我们在手推车章节中所讨论的，这是控制/获取无人机遥测的另一种方式。 Wi-Fi 也有有限的范围（约 100 m），但可能证明有用（尤其是在禁止蓝牙的\
  \ Apple iOS 设备上）。\n- **Antenna Tracker**：需要特殊 **超视距（BLOS）** 许可的美国远程无人机，从使用定向天线中获益匪浅，该天线不断指向目标。\
  \ 这对于高质量视频系统的实时覆盖而不受干扰尤其有用。 这是设置和调整天线跟踪器的区域。\n\n## Config/Tuning 屏幕\n\n顾名思义，此区域是\
  \ Pixhawk 管理员配置和调参飞机的地方。 由于其中一些菜单仅在高级布局中可用，首先我们将介绍 Planner 部分（它将为你提供访问所有高级功能）。\n\
  \n## Planner\n\n下面的屏幕截图显示了 **Planner** 选项卡的选项。 这是我们配置 Mission Planner 软件本身的区域：\n\
  \n\n\n- **测试屏幕：** 这是一个非常有用的用于排查 Pixhawk 故障的界面。在这里，你可以导出数据，并一目了然地查看哪些功能已启用/禁用。以下图片显示了测试屏幕：\n\
  \n  ![](img/504adb30bdfce87f38258e08f11180af_251_0.png)\n\n## 飞行模式\n\n此选项卡的功能与初始设置屏幕中的飞行模式选项卡相同。它允许你设置在遥控器的飞行模式开关翻转时激活哪些飞行模式。\n\
  \n## 基础调参\n\n**基础调参** 选项卡是你可以在需要稳定化的模式中手动调整 Pixhawk 飞行特性的地方。每个轴（**俯仰**、**滚转** 和\
  \ **偏航**）都使用以下参数单独设置：\n\n- **比例增益 (P)**：此值表示 Pixhawk 试图纠正以使飞行器达到其应有的姿态的程度。例如，施加多少升降舵使飞机俯仰到应有的位置。数值越高，飞行器反应越灵敏或\
  \ *越敏感*。数值越低，过渡越平滑。\n- **积分增益 (I)**：你可以将其视为自动配平调整。它根据期望姿态与实际姿态之间的过去偏差，修正控制以进行补偿。数值越高，自动配平越多；数值越低，自动配平越少。\n\
  - **微分增益 (D)**：它用于减缓 PI 调整的反应性。数值过高可能会损坏舵机和电机，因为它们可能会开始 *颤动*。\n- **INT_MAX**：这是\
  \ **积分增益 (I)** 可使用的最大值。\n\n此屏幕的其他部分需要对其使用进行非常深入的解释。我认为基础调参应更名为调参。对于此解释，请参阅第 7 章，*圣杯\
  \ – 固定翼无人机（飞机）*，其中我们详细解释了此屏幕上的调参参数。\n\n## 标准参数\n\n**标准参数** 屏幕是 Pixhawk 中所有可更改的基础参数的长列表。其中许多参数都可以使用\
  \ Mission Planner 中其他屏幕上的 **图形用户界面 (GUI)** 或使用向导来更改。但需要注意的是要进入并手动更改参数的位置。以下是所有 **标准参数**\
  \ 及其功能：\n\n- **ACRO_LOCKING**：将其视为在 **ACRO** 模式下操作特技飞机时的 **恐慌** 模式。如果你松开摇杆，飞行器将水平并保持高度，通过启用\
  \ **ALT HOLD** 模式。\n- **ACRO_PITCH_RATE**：这设置 **ACRO** 模式下的最大俯仰速率。\n- **ACRO_ROLL_RATE**：这设置\
  \ **ACRO** 模式下的最大滚转速率。\n- **CAM_FEEDBACK_PIN**：这便于使用来自摄像机（通过热靴连接）的反馈，该反馈将进入 Pixhawk\
  \ 日志，表明照片已成功拍摄。这对于使用 Pixhawk 的 GPS 信息在拍摄后手动为照片地理标记非常有用。此参数是用于此反馈的引脚号。\n- **CAM_FEEDBACK_POL**：摄像机反馈的极性。TriggerHigh\
  \ 用于在电压升高时拍照，TriggerLow 用于在电压下降时拍照。\n- **CAM_RELAY_ON**：这与 **CAM_FEEDBACK_POL**\
  \ 类似，它设置摄像机继电器在高电压或低电压下被激活的时间。\n- **CAM_TRIGG_TYPE**：这指定 Pixhawk 将如何向摄像机发送快门触发信号。\n\
  - **CAN_P1_DRIVER**：这激活 Pixhawk 上的 CAN 总线使用。\n- **CAN_P2_DRIVER**：这激活第二条 CAN 总线。\n\
  - **CHUTE_ENABLED**：这用于检查飞行器上是否安装了降落伞释放系统。\n- **COMPASS_DEC**：这显示真北与磁北之间的差异。这是通过自动校准罗盘来设置的。\n\
  - **FBWB_CLIMB_RATE**：这设置飞行器在 **FBWB** 和 **CRUISE** 模式下升降舵满偏时爬升的速度。\n- **FBWB_ELEV_REV**：这用于检查升降舵在\
  \ **FBWB** 模式下是否反向（向前推升降舵控制使飞机上升还是下降）。\n- **FENCE_ACTION**：这指定在越过地理围栏时采取的动作。\n-\
  \ **FENCE_AUTOENABLE**：这设置地理围栏是否在自动起飞期间自动放置，并在自动着陆期间移除。\n- **FENCE_MAXALT**：这指定在启用地理围栏时飞机可以飞行的最大高度（以米为单位）。\n\
  - **FENCE_MINALT**：这指定在启用地理围栏时飞机可以飞行的最低高度（以米为单位）。\n- **FENCE_RET_RALLY**：这设置 Pixhawk\
  \ 对越过地理围栏的反应（是返回集结点、返航，还是仅返回越界发生的位置）。\n- **FENCE_RET_ALT**：这指定飞机在越过地理围栏时返回的高度。设置为\
  \ 0 时保持当前高度。\n- **FLOW_ENABLE**：这用于检查是否使用光学流传感器。\n- **FLOW_FXSCALER**：这用于考虑光学流传感器的镜头长度。增加数值实际上会降低\
  \ x 轴上的比例因子。\n- **FLOW_FYSCALER**：这用于考虑光学流传感器的镜头长度。增加数值实际上会降低 y 轴上的比例因子。\n- **FLOW_ORIENT_YAW**：这设置飞机与光学流传感器的偏航之间的厘度偏差。\n\
  - **FLTMODE(1-6)**：这设置控制器上飞行模式开关不同位置的飞行模式。\n- **FS_GCS_ENABL**：这用于检查在与 **地面控制站 (GCS)**\
  \ 信号丢失时是否激活失效保护状态。\n- **FS_LONG_ACTN**：这设置在长时间失效保护事件中采取的动作（参见 **FS_LONG_TIMEOUT**）。\n\
  - **FS_LONG_TIMEOUT**：这是在激活 **FS_LONG_ACTN** 之前失效保护状态存在的秒数。\n- **FS_SHORT_ACTN**：这设置在等待\
  \ **FS_LONG_TIMEOUT** 期间采取的动作。\n- **FS_SHORT_TIMEOUT**：这是在失效保护事件发生时激活 **FS_SHORT_ACTN**\
  \ 之前的秒数。这有助于防止在少量信号干扰等情况下发生模式切换。\n- **GROUND_STEER_ALT**：这是方向舵控制也将控制轮舵机以实现地面转向的高度（以米为单位）。设置为\
  \ 0 时允许在所有高度进行轮控制。\n- **INVERTEDFLT_CH**：这指定将启用倒飞能力的控制器通道。\n- **LAND_TYPE**：这指定在自动着陆期间执行的着陆类型。（标准与深尾）。\n\
  - **LIM_PITCH_MAX**：这是稳定飞行模式下的最大俯仰角。\n- **LIM_PITCH_MIN**：这限制了稳定飞行模式下机头向下指向的角度。\n\
  - **LIM_ROLL_CD**：这是任一方向滚转的最大滚转角（以厘度为单位）。\n- **LOG_BACKEND_TYPE**：这指定日志的存储方式（文件、MAVLink\
  \ 或两者）。\n- **LOG_DISARMED**：这指定在解除武装状态下是否创建日志（以及武装状态）。\n- **LOG_FILE_DSRMOT**：这决定在飞行器解除武装时是否关闭当前日志文件。\n\
  - **MNT_STAB_TILT**：这用于检查是否稳定云台的俯仰轴。\n- **MNT_TYPE**：这设置云台安装的类型（无、舵机和 MAVLink）。\n\
  - **NAV_CONTROLLER**：这是启用实验性导航控制器的设置。这里默认为 L1。\n- **NAVL1_PERIOD**：这设置自主飞行期间的转弯半径（以米为单位）。\n\
  - **Q_ENABLE**：这启用 Pixhawk 的四旋翼飞机（混合）功能。\n- **RALLY_INCL_HOME**：这检查返航时家点是否为安全着陆地点。\n\
  - **RELAY_DEFAULT**：这设置 Pixhawk 启动时摄像机继电器的状态。\n- **RELAY_PIN(1,2,3,4)**：这设置摄像机继电器控制的引脚号。\n\
  - **RNGFND_ADDR**：这特定于 LightWare I2C 激光测距仪。它允许在不同地址上使用多个测距仪。\n- **RNGFND_FUNCTION**：这设置如何解释测距仪的反馈（线性、反向和双曲线）。\n\
  - **RNGFND_GNDCLEAR**：这用于确定飞机着陆时向下测距仪与地面之间的距离。\n- **RNGFND_LANDING**：这用于检查是否使用测距仪来辅助着陆。\n\
  - **RNGFND_PIN**：这是用于模拟（非 I2C）测距仪的引脚。\n- **RNGFND_RMETRIC**：这用于设置模拟测距仪是否为比率型（大多数是）。\n\
  - **RNGFND_STOP_PIN**：这设置用于模拟测距仪测量的引脚。\n- **RNGFND_TYPE**：这设置实现的测距仪类型。\n- **RPM_PIN**：这是用于电机转速传感器引脚。\n\
  - **RPM_TYPE**：这是实现的转速传感器类型。\n- **RPM2_PIN**：这允许使用第二个转速传感器并指定其使用的引脚。\n- **RSSI_ANA_PIN**：这指定模拟\
  \ RSSI（接收信号强度指示）模块的引脚号。\n- **RSSI_PIN_HIGH**：这设置 RSSI 模块输出在信号强度高时的最大电压。\n- **RSSI_PIN_LOW**：这设置\
  \ RSSI 模块信号强度低时的最小电压。\n- **RSSI_TYPE**：这是 RSSI 模块的类型。\n\n\n\n\n\n- **RTL_AUTOLAND**：用于设置执行RTL时是否自动降落。\n\
  - **RTL_RADIUS**：执行RTL时，围绕返航点盘旋的半径。\n- **RUDD_DT_GAIN**：方向舵与差动推力的比值。差动推力用于多发动机飞机（例如，执行左转时，左电机会略微降速，右电机升速以帮助飞机偏航）。\n\
  - **SERIAL(0-5)_BAUD**：指定串行总线上的数据传输速率。\n- **SERIAL(0-5)_PROTOCOL**：用于确定指定串行总线上使用的协议（如MAVLink等）。\n\
  - **SERVO(1-16)_FUNCTION**：指定此舵机端口将控制的功能。\n- **SERVO(1-16)_MAX**：此通道上舵机可接收的最大值（PWM）。\n\
  - **SERVO(1-16)_MIN**：此通道上舵机可接收的最小值（PWM）。\n- **SERVO(1-16)_REVERSED**：用于设置此通道上的舵机值是否反转。\n\
  - **SERVO(1-16)_TRIM**：用于设置此通道上舵机的微调值。请使用此设置代替遥控器上的微调功能。\n- **STALL_PREVENTION**：用于启用或禁用失速保护。此功能需要空速传感器（皮托管）。\n\
  - **TECS_CLIMB_MAX**：飞机在THR_MAX下（同时保持空速）可达到的最大爬升率（米/秒）。\n- **TECS_SINK_MIN**：当油门设置为THR_MIN且飞机不超过CLIMB_MAX速度时，飞机的最大下降率。\n\
  - **TELEM_DELAY**：Pixhawk启动后等待开始发送遥测数据的秒数。\n- **TERRAIN_FOLLOW**：启用Pixhawk在自主飞行模式下跟随下方地形高度的能力。应连接地面控制站以启用此功能。它使用地形数据计算高度，而不仅仅是相对于返航点的高度。\n\
  - **THR_FAILSAFE**：启用/禁用即使油门降至特定值以下也触发失效保护的功能。这是测试无线电发射机接收信号的好方法。例如，如果发射机的最小油门PWM为980，断开连接后油门可能降至0。因此，设置950的值会比较好。\n\
  - **THR_MAX**：Pixhawk可施加给电机的最大油门（百分比）。\n- **THR_MIN**：Pixhawk施加给电机的最小油门。对于自动降落，您需要将其设置为0。对于允许反向推力的ESC，您可以将其设置为负值以作为刹车。\n\
  - **THR_SLEWRATE**：每秒的最大变化量。这会使油门过渡更平滑。但要小心，将该值设置得太低可能导致失速。\n- **THROTTLE_NUDGE**：允许飞行员在自动油门飞行模式下微调油门上下。\n\
  - **TRIM_AUTO**：启用Pixhawk在非手动模式下自动调整控制面的微调值。\n- **TRIM_THROTTLE**：正常飞行期间施加的油门（百分比）。\n\
  - **TUNE_CHAN**：允许使用发射机上的旋钮或滑块调整PID（值指定通道）。\n- **TUNE_MODE_REVERT**：启用或禁用Pixhawk在模式更改时恢复到先前保存的调谐设置。调谐期间，更改每10秒保存一次。因此，您有10秒时间通过更改模式来恢复。\n\
  - **TUNE_PARAM**：设置使用**TUNE_CHAN**功能调整哪个参数。\n- **TUNE_SELECTOR**：遥控器上的开关通道，用于启用**TUNE_CHAN**功能。\n\
  - **WP_LOITER_RADIUS**：设置LOITER期间围绕航点盘旋的半径（米）。如果设置为负数，则环绕方向为逆时针。\n- **WP_MAX_RADIUS**：使用新值覆盖飞行计划屏幕中设置的航点半径，该值表示航点被视为完成所需的半径。值为0表示完全不覆盖，保持任务航点半径不变。\n\
  - **WP_RADIUS**：与**WP_MAX_RADIUS**类似，但不进行覆盖。这是为了避免无限环绕飞机无法满足的小半径航点。\n\n## 总结\n\n\
  在本章中，我们回顾了Mission Planner的许多界面组件。我们还介绍了一些之前未提及的功能。需要说明的是，本章主要作为您未来使用Pixhawk开发原型时的参考。\n\
  \n我们真诚希望您了解了Pixhawk、围绕它进行的原型设计，以及原型的制作并将想法变为现实。我们希望您喜欢这本书，就像我们喜欢编写它一样。感谢您的阅读，您应该为自己感到自豪。这是一份相当大量的信息！\n"
