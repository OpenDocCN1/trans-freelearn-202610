- '# 第 4 章：一款高尔夫球手用的无人机


  # 第 4 章：一款高尔夫球手用的无人机


  正如我们之前多次提到的那样，在选择为哪个行业制作无人机时，你必须在市场规模（需求）、他们能花多少钱（成本）以及你满足该需求的难易程度（供给）之间取得平衡。


  高尔夫是一个极其受欢迎的行业。每年，消费者在高尔夫设备和配件上花费的钱 literally 达数十亿美元。高尔夫球手对能帮助他们提高球技的新技术趋之若鹜。听起来几乎完美，对吧？


  那么，无人机能发挥什么作用呢？一架多旋翼机沿着球道飞行检查布局？也许吧，但如果高尔夫球手以前打过那条球场，为什么他们还需要它呢？他们不需要。好吧，这是一个坏主意。那用一架潜水无人机去寻找掉进水障碍区的球呢？不是一个糟糕的主意，但水障碍区底部可能躺着成千上万个球，找到你自己的球可能几乎不可能。而且，谁愿意把在池塘底部浸泡了数周而受损的高尔夫球一个个捞出来呢？不，又是一个坏主意。


  每个职业高尔夫球手都拥有的，而每个业余爱好者都想要（但可能买不起）的东西是什么？一个球童（在球场上帮你拿球杆的人）！那么，如果我们把一辆电动高尔夫推车（一种运载高尔夫球杆的小车）改造成跟随手机呢？


  现在，我们走在正确的轨道上了。


  我们将涵盖以下主题：


  - The design

  - Using tank locomotion

  - Using LIDAR to avoid obstacles


  ## The design


  经过初步研究后，我们发现市场上已经有这样一种设备。它叫做 Stewart X9 Follow。然而，按标价，这件商品的价格接近 $3,000 美元！


  ![](img/504adb30bdfce87f38258e08f11180af_112_0.png)


  这无疑是一款高质量的产品——设计非常时尚漂亮。毫无疑问，高端高尔夫球手会喜欢这件商品。但对于普通高尔夫球手来说，这绝对会破产。


  该产品还使用自己的遥控器。遥控车跟随遥控器，或可以用它手动操控。我们将采用不同的方法。不是使用专有遥控器，我们将让它跟随智能手机（通过 Bluetooth 或
  Wi-Fi）。这意味着它可以轻松配对。此外，我们还将包含一个标准化的 RC 遥控器（以防用户因忘记充电而导致手机没电）。


  使用标准化的零件应该能让我们将最终成本降至约 $1,000 美元。我们的设备可能没有 Stewart 那么豪华，但它将覆盖更广泛的市场。


  这是我们的原始草图：


  ![](img/504adb30bdfce87f38258e08f11180af_113_0.png)


  制造一整辆高尔夫球童车可能会相当昂贵。所以，让我们从别人（已经电动化）的球童车开始。我们在亚马逊上找到了以下产品：


  ![](img/504adb30bdfce87f38258e08f11180af_113_1.png)


  这辆推车的美妙之处在于它已经配备了双电机（因为它设计为通过遥控器操控）。我们真正需要做的就是在这个“哑”球童车里实现一个大脑。然后，它就能智能地跟随手机。


  不过，我们必须完全重新布线才能使其工作。电机是有刷的，所以我们需要两个有刷 ESC。这些速度控制器还必须能够反转。为什么？因为为了转向推车，我们将使用 *tank*
  式转向（其中一侧向前，另一侧反向）。


  现在，我们需要精确规划所有东西如何连接，所以让我们看看我们的接线图：


  ![](img/504adb30bdfce87f38258e08f11180af_114_0.png)


  你可能会注意到，我们没有包含 **Battery Elimination Circuit (BEC)** 来为 Pixhawk 的舵机部分供电。那是因为我们将使用内置
  BEC 的 ESC。这将通过 ESC 舵机连接为舵机板提供电压。


  你还会注意到，在这个阶段我们还没有决定使用 Wi-Fi 还是 Bluetooth 作为通信协议。我们取消了用于笔记本电脑的 900 Mhz 数据连接，转而使用其中一种协议。为什么？因为没有人愿意在高尔夫球场上随身携带笔记本电脑。相反，我们使用移动设备。


  那么，有什么区别呢？如果我们通过 Wi-Fi 连接，Pixhawk 将成为网络接入点。这实际上可能带来一个问题，因为 GPS 需要手机的数据连接来显示地图。如果我们使用
  Wi-Fi，网络将由你的移动设备与 Pixhawk 建立（而不是你的服务提供商的蜂窝数据连接）。


  那么，如何让 Pixhawk 使用坦克式驱动系统来转向车辆呢？很简单。


  ## Adapting Pixhawk for skid-steering


  第一步是把正确的 ESC 插到 Pixhawk 舵机面板上的正确端口。左轮的 ESC 插入 MAIN OUTPUT 1。右轮的 ESC 应插入 MAIN OUTPUT
  3，如下图所示：


  ![](img/504adb30bdfce87f38258e08f11180af_116_0.png)


  现在，我们只需在 Pixhawk 本身中启用滑移转向。它将完全自行计算该如何驱动每个车轮！


  在 Mission Planner 软件中，连接 Pixhawk（当然先插入 USB 电缆）。进入 Config/Tuning 屏幕并选择 Standard Params，如以下屏幕截图所示：


  ## Using Bluetooth to control Pixhawk with a phone


  使用 Bluetooth 控制 Pixhawk 非常简单。但就像 Pixhawk 的所有其他功能一样，需要购买一个附加模块。我们购买了如下图所示的模块：


  ![](img/504adb30bdfce87f38258e08f11180af_118_0.png)


  当然，我们必须修改电缆（就像之前一样），因为该模块附带的电缆是用于旧式插头的。我们将 Bluetooth 模块连接到 Telem 1 端口，如下图所示：


  ![](img/504adb30bdfce87f38258e08f11180af_119_0.png)


  现在，只需将你的 Android 设备的 Bluetooth 与 Pixhawk 的 Bluetooth 绑定。只需打开 Pixhawk 的电源，并使用与任何
  Bluetooth 设备相同的方法进行绑定。用于从移动设备控制 Pixhawk 的软件称为 DroidPlanner 2。它是免费的！


  我们还没有完全完成，但如果你好奇如何使用 DroidPlanner 2 让 Pixhawk 车辆跟随你，那很简单！只需点击 **Follow** 按钮，并设置你希望遥控车保持在内的半径。当然，你可以忽略
  `altitude` 属性（因为这是一辆地面车辆）。你可以在下面的图片中看到 **Follow** 按钮：


  ![](img/504adb30bdfce87f38258e08f11180af_120_0.png)


  当然，如果你不想让遥控车跟随你进入果岭，只需点击 **Pause**。你也可以点击地图上的点来发送遥控车！


  很酷，对吧？但如果你在你和遥控车之间有一棵树怎么办？你不希望它在试图到达你时撞到树和岩石，对吧？这就是碰撞避免的用武之地！


  ## Using LIDAR to avoid obstacles


  你想蒙着眼睛在高尔夫球场上散步吗？不想？我也不想，而且让遥控车盲目乱跑也不是个好主意。但视觉和物体识别需要比这台机器预算更多的计算能力。那么，视觉的下一个最好选择是什么？SONAR
  或 LIDAR。不幸的是，SONAR（就像蝙蝠用声波计算障碍物距离来寻找昆虫一样）对于 Pixhawk 来说被认为 *passé*，因此实现起来相当 *wonky*。有一些
  I2C 声纳设备，但它们与 Pixhawk 2.1 和最新的 Ardupilot 固件配合得并不好（如果能工作的话）。所以，我们将使用 LIDAR 代替。LIDAR
  测距仪使用光波（而不是声音）来计算到物体的距离。






  ## LIDAR 101


  LIDAR 简单地使用光波发出、反射到物体上，然后等待其返回。由于光速为 299,792,458 m/s，LIDAR 模块所要做的只是测量光脉冲返回到模块所需的时间。搞定！你就可以感知到是否有物体以及它有多远。下面的图示说明了这一点：


  ![](img/504adb30bdfce87f38258e08f11180af_121_0.png)


  LIDAR 有多种不同的频率、强度和扩散模式。你可能会注意到，我们计划将 LIDAR 模块安装在前翼子板顶部。这是一个完美的位置，因为我们能够感知到任何对前轮来说太大而无法碾过的物体！让我们谈谈
  LIDAR 的不同方面：


  - **Rate：** 这是每秒产生并寻找光脉冲的次数，也称为 Hz。我们使用的单元（Teraranger One）以 1000 Hz 的速率采样（每秒 1000
  次）。速率越快越好，但如果你要探测远距离接触，可能需要更长的时间（以避免信号在同一时间返回，甚至在下一个信号发出后才返回）。我们的 1000 Hz 速率就足够了，因为我们的模块探测范围为
  14 米。

  - **Range：** LIDAR 开始探测物体有多远。我们的传感器额定值为 14 米。考虑到我们的探测车将以步行速度移动，这已经绰绰有余。

  - **Resolution：** 此参数与精度有关。我们使用的 EZ4 分辨率为 0.5 cm。这意味着它可以区分物体距离 5.105 米和 5.11 米。

  - **Width：** 光束宽度也很重要。我们的 LIDAR 模块光束宽度为 3°。它应该足够有效，可以让我们的探测车避免太多麻烦。


  ## Making LIDAR work


  不同的 LIDAR 模块具有不同的引脚排列（与 Pixhawk 插头的布线方案）。在购买 LIDAR 模块之前，你应该在 Ardupilot 网站上检查其兼容性（http://ardupilot.org/rover/docs/common-rangefinder-landingpage.html）。兼容传感器的布线引脚排列和列表可以在那里找到，以及它们应该插入的位置。


  ## Mounting the module


  第一步是决定如何安装你的 LIDAR。它应与地面平行指向（不要向上或向下）。如果你使用单个传感器（如本示例中我们所做的），它还应直指前方。如果你使用多个传感器，你希望以覆盖探测车希望看到的整个区域的方式放置它们，但重叠并不是完全必要的。下面的图表显示了我们设计声纳安装选项的方法（我们更换了翼子板）：


  ![](img/504adb30bdfce87f38258e08f11180af_122_0.png)


  你可以看到图表显示地面会与图案重叠，因此较大的岩石、树根和倒下的树枝将被探测到。如果我们想阻挡部分地面（以便调节多大障碍物会被注意到），我们只需将传感器向后滑动，使翼子板阻挡部分地面即可。我们怀疑我们不需要这样做。Pixhawk
  有能力区分翼子板和更远处的物体（只需稍作调整）。


  ## Configuring LIDAR with Mission Planner


  首先，我们需要在开始配置之前告诉 Pixhawk 有一个测距仪模块。因此，我们将 Pixhawk 通过 USB 插入电脑，并在 Mission Planner
  中启动连接。


  在 **Initial Setup** 部分，你会找到 **Optional Hardware**，在下面会有 **Range Finder**。在此部分，你应选择你使用的测距仪的适当型号，如下图所示：


  ![](img/504adb30bdfce87f38258e08f11180af_123_0.png)


  Ardurover 固件的新版本在该下拉菜单中包含 Teraranger One。但如果你使用的是旧版本，你可能需要在 **Full Parameter List**
  中设置。这是通过打开 Config/Tuning 并从屏幕左侧选择 **Full Parameter List** 来完成的。以下是参数列表以及 Teraranger
  One 的设置：


  - **RNGFND_MAX_CM**: 1400（14 m）。这是测距仪的最大探测范围，单位为厘米。

  - **RNGFND_MIN_CM**: 20（20 cm）。这是测距仪读取物体的最近距离。

  - **RNGFND_TYPE**: 4。表示这是一个 I2C LIDAR 测距仪，为 Teraranger One 的数值。


  现在，让我们看看我们可以用 Pixhawk 调整声纳测距仪的所有参数：


  ![](img/504adb30bdfce87f38258e08f11180af_124_0.png)


  很多参数，对吧？你得爱上 Mission Planner。每个选项下方都有非常好的描述。但我们还是继续解释一下吧：


  - **RNGFND_DEBOUNCE**: 这是物体需要返回多少次探测脉冲才能被 Pixhawk 注册。为什么需要这个？更宽、更远的测距仪也会产生更多噪声（或虚假脉冲）。因此，为了确保物体确实存在，你可能需要增加这个数字以减少错误读数。但有个问题——增加这个数字也意味着注册物体需要更多时间。这意味着如果你有快速移动的无人机，你可能无法及时避开障碍物。我们的
  LIDAR 非常清晰，所以我们将其保持在默认的 2。这意味着物体需要返回连续两次脉冲才能被 Pixhawk 注册。

  - **RNGFND_FUNCTION**: 要理解这一点，你需要知道测距仪返回的是用电压脉冲表示的物体距离，而不是数据脉冲。测距仪不会说，“嘿……它在 5 米外。”
  相反，测距仪会根据接收到的脉冲强度提高或降低返回的电压。解读工作由 Pixhawk 完成。此设置决定 Pixhawk 如何解读从测距仪发送给它的电压。

  - **RNGFND_GRNDCLEAR**: 此功能主要对具有向下声纳的飞机和多旋翼机有用。它表示飞机着陆时测距仪与地面的距离（模块的地面间隙）。

  - **RNGFND_PIN**: 这个可能有点令人困惑。简单来说，这是指电压将返回到 Pixhawk 的位置。对于我们使用的 LIDAR，你可以保持不变。


  使用 Teraranger，你实际上不需要调整这些设置中的任何一个。Teraranger 的主要卖点之一是它出厂已校准。你可能需要调整的唯一设置是 **RNGFND_DEBOUNCE**
  参数。鉴于 LIDAR 模块离地面很近，而且我们的探测车将以步行速度移动，我们应该将其设置为 10。这意味着模块需要在识别到路径中有物体之前从物体接收到 10
  次脉冲。这将减少树枝、草和其他物体带来的噪声。

  '
- '# 第 5 章：UAV 简介


  # 第 5 章：UAV 简介


  UAV 与探测车有很大不同。它们不受地面束缚，范围通常更大，而且操作起来危险得多。听起来很令人兴奋，对吧？在本章中，我们将介绍设计空中无人机的复杂性。我们将讨论机身、重量、飞行时间和推进。让我们先谈谈安全问题，这样事情会没那么令人兴奋，好吗？


  我们将涵盖以下主题：


  - Safety concerns

  - Propellers - flying cuisinarts!

  - Designing for air and ground

  - Learning some physics

  - Designing a multicopter airframe

  - Designing a fixed wing-airplane)


  ## Safety concerns


  在考虑设计空中无人机之前，你首先需要确定一个测试场地。作为示例，我会向你展示我使用的场地，但在我们深入之前，让我们先谈谈你应该寻找的要求：


  1. **Authorized for RC air traffic**: **Academy of Model Aeronautics (AMA- http://www.modelaircraft.org/)**
  授权的飞行场地是一个不错的起点。如果你所在地区有这样的飞行场地，你就知道该地区允许遥控飞机。如果你的地区没有，下一个要查看的地方是 FAA 图表。你可以在 SkyVector（https://skyvector.com/）找到当前的在线图表。这些图表会显示所有限制空域。任何不受限制的区域都适合飞行遥控飞机。






  +   2. **远程**：仅仅因为某个区域允许遥控飞机并不意味着在那里测试新飞机（尤其是自主飞机）是安全的。你需要确保该区域没有可能在飞机坠毁或失控飞走时受损（甚至被杀死）的主要建筑物、房屋或行人。按照我们在以下章节中给你的说明，一切都应该能正常工作。但不幸的是，我们并不生活在“应该如此”的世界里。

  +   3. **你被授权在那里**：不要擅自闯入别人的牧场来测试你的飞机。最好的情况是，你可能会惹上一些法律麻烦。最坏的情况是（在某些地方）你甚至可能被枪击。如果要进入私人财产，最好先征得业主的许可。


  考虑到这些要求，以下 Google 地图图像显示了糟糕的飞行场地（左）与良好的飞行场地（右）的示例。左边的那个是加州奇科 A-Main Hobbies 的飞行场地——非常适合娱乐飞行；对于原型开发来说完全错误。右边的那个是休斯顿布什公园的
  Dick Scobee 机场——位于一个巨大的公园中间。这并不完美（因为有一条道路穿过），但绝对可行：


  ![](img/504adb30bdfce87f38258e08f11180af_128_0.png)


  右边的那个是我搬到德州后现在通常飞的地方。左边的那个是我住在加州时飞（已经过验证的飞机）的地方。为了测试，我不得不开车几个小时去一个偏远的地方。


  我是在 2011 年造的这架无人机。我以为自己很聪明。起飞的最大载荷是 3.2 公斤。所以，我装满了电池，因为我想让这架无人机在空中停留更长时间。当我手动操控时，它飞得非常漂亮。我第一次在自主飞行中测试它时，机翼（字面意思）直接从飞机上吹掉了，它变成了一架非常昂贵的草地飞镖。它完全报废了。那发生了什么？


  我没有考虑到 G 力。G 力是由于离心力作用在物体上的力。它以地球在静止时、海平面地面上的标准重力为倍数来衡量。例如，一个体重 100 磅的飞行员在进行 2-G
  转弯时，在转弯期间体重会达到 200 磅。


  当我切换开关让飞机返航时，它加速到最大油门，以 45 度倾斜，并进行一个紧密的转弯返回基地。这可能是一个大约 4-G 的转弯。所以，即使我在起飞时重量在限制范围内（只有
  3.0 公斤），在那个转弯期间，飞机对机翼施加了 12.0 公斤的力。这足以粉碎机翼并开始向草地飞镖的转变。一个非常愚蠢、昂贵且容易犯的疏忽。


  重量也会影响飞行时间。对于多旋翼来说这一点更为严重，因为多旋翼使用动力产生升力，但对于固定翼无人机也是如此。为什么？因为重量会影响你的滑翔比。一架飞机的滑翔比看起来像
  1:100。这意味着在无动力情况下，每向前飞行 100 英尺，它会损失 1 英尺的高度。为了克服这一点，机头会稍微向上指向并施加动力。增加重量，飞机在无动力情况下在失去高度前能飞行的距离就会减少；因此，增加重量就会增加保持飞机在空中所需的动力。因此，在耗尽电源之前，你的飞行时间会更少。


  多旋翼的滑翔比是 1:0。这意味着它在无动力情况下根本无法向前移动而不损失高度。基本上，它的滑翔比甚至比钢琴还要差。所以重量极大地影响多旋翼的飞行时间。我们将在第
  6 章《一个简单的多旋翼无人机》中建造多旋翼时更深入地探讨这个问题。


  最后，重量也会影响重心（cg）。飞行飞机有点像在铅笔尖上平衡一个球。飞机应尽可能平衡，以便控制面能够以最高效率正常工作（固定翼），或保持电机平衡，避免其中一个电机烧毁（多旋翼）。无论哪种方式，不平衡的飞机至少会操控不佳。


  对于固定翼飞机，你可能会发现货物舱（放置电池、电子设备和有效载荷的地方）位于机身前部。放太多东西太靠前，你会发现重心变得头重。这意味着你可能需要在尾部添加更多重量作为压舱物（配重）。通常，固定翼飞机的
  cg 位于翼型顶部。把这个想象成天平上的支点。你需要平衡这个天平。我们将在两章后建造固定翼飞机时更深入地探讨这个问题。


  ## 动力/升力


  曾经有一段时间，让多旋翼在空中停留超过 5 分钟被认为是一项工程壮举。


  我过去的一架多旋翼是为小型摄像机（仅比 GoPro 稍大）建造的。它在下图中出现，曾刊登在《Videomaker Magazine》上。一位客户要求我在这上面安装一台
  Blackmagic Cinema 相机。当然，它的设计可以承载那么多重量。但能坚持多久呢？它一次只能在空中停留 2 分钟。动力和升力需要与重量和电池仔细平衡，尤其是要让多旋翼保持在空中：


  ![](img/504adb30bdfce87f38258e08f11180af_132_0.png)


  ## 燃料 - 电池


  增加更大的电池或更多的燃料是最简单获得更长飞行时间的方法，对吧？错！如果你的无人机是燃油驱动的，你必须记住燃料每加仑重 8 磅，而电池会产生递减回报。例如，能够以
  1 倍规格为电机供电的电池可能重 2 磅。但升级到 2 倍规格可能重 6 磅。所以电池的功率额定值翻倍并不意味着时间翻倍，因为电机必须付出 3 倍的努力来保持那额外的重量在空中！


  ## 学习一些物理


  不~~~~！（你可能正在这么说）。不幸的是，根据你正在原型开发的内容，拼装可能不是一个选择。因为我们在章节中会进行拼装（因为我们可以用每种类型的飞机写另一本书），让我们给你一个航空工程的简要速成课程。


  从零开始设计飞机不是胆小的人能做的。多旋翼要容易得多，所以我们先从那里开始。


  ## 设计多旋翼机身


  什么，什么，什么，机身到底是什么？它只是飞机身体的 fancy 词。为什么你需要设计自己的？好吧，如果你要开始一家销售饱和产品（例如相机无人机）的新公司，你可能需要通过一个全新的无人机外观来区分自己。毕竟，为什么任何人要买你在（比如）大疆机身上的设计，而他们可以直接去买大疆呢？


  设计多旋翼机架相当容易；你只需要考虑几个因素，我们将在即将到来的小节中介绍。


  ### 对称性


  保持驱动螺旋桨的电机等距非常重要。记住，多旋翼可以向任何方向飞行。 为了保持多旋翼这一重要特性，你必须以这种模式设计你的多旋翼电机。


  ## 偶数


  有一个例外，即三旋翼（三个旋翼）。虽然这些在大约 5 年前相当常见，但它们 notoriously 不稳定。为什么？因为多旋翼如何转弯。更多的桨叶不仅意味着更好的稳定性和升力，偶数使得
  Pixhawk 保持它在空中的必要计算更容易。如果你记得，在第 1 章《无人机 101》中，我们介绍了多旋翼偏航的工作原理。偶数使它更稳定。


  结合对称性，让我们列出不同桨叶配置的度数在下面的表格中。只要想象从前面看多旋翼并像切派一样划分区域。如果一个圆有 360 度，以下是它们如何排列：


  | Number of rotors | Degrees of separation |

  |---|---|

  | 3 | 120 |

  | 4 | 90 |

  | 6 | 60 |

  | 8 | 45 |


  ## 桨叶间隙


  你设计的桁条（从飞机中心延伸到电机的棍子）需要足够长，以便桨叶能够舒适地避开天线并相互避开。因此，旋翼越多，桁条就需要越长。桁条越长，它们也需要越强（由于杠杆力）。然后，你必须明白，桁条越长越强，机身和电机布线增加的重量就越多。


  考虑到以上所有因素，这里是一个 8 旋翼多旋翼（八旋翼）使用 22 英寸螺旋桨的示例：




  ![](img/504adb30bdfce87f38258e08f11180af_135_0.png)


  在这里，你可以看到每个桅杆之间相隔 45°，并且每个旋翼从机身中心到旋翼中心距离为 2''9"。再加上 22"，你就得到全长 4''7" 的桨展。是的，它很大。你可能还会注意到，每个桅杆都比每个旋翼的精确中心要短一些。这是为了留出空间安装电机支架，该支架设计为使用套筒套在桅杆上。


  机身的数学计算很简单。只要让桅杆足够长，使桨叶有足够的间隙（并且不会相互产生大量湍流），将电机设置在中心周围的对称点上，并使用偶数个旋翼即可。就我个人而言，我不建议使用三旋翼。它们天生不稳定，因为旋翼数量为奇数。


  如果你想做得更花哨，还有很多东西可以加入（例如改变旋翼角度以辅助转向、推力等等）。但这些就是基础。


  ## 设计固定翼飞机


  系好安全带，因为这是火箭科学。飞机需要持续向前移动才能保持在空中。我们在设计飞机时希望风阻（阻力）尽可能小。这将使其在空中停留更长时间，并减轻电机负担。


  飞机有数百种设计风格，但让我们使用其中三种主要风格（如下图所示）：


  ![](img/504adb30bdfce87f38258e08f11180af_136_0.png)


  如果飞行翼风格令人困惑，可以快速回顾一下 Skywalker X-8 的图片。那就是飞行翼。以下是本人正在设计的喷气式无人机示例，也是飞行翼。它使用电动涵道风扇（EDF）喷气发动机而不是螺旋桨来保持飞行：


  ![](img/504adb30bdfce87f38258e08f11180af_136_1.png)


  显然，这架飞机是为高速、非常高速而设计的。但使用 EDF 喷气发动机也有代价——飞行时间非常短，电池消耗非常高。因此，我们将坚持使用螺旋桨。


  即使有了这个工具，还是有点令人困惑，对吧？让我们谈谈这些参数及其含义：


  - **Chord (mm)**: 简单来说，它就是你机翼型面的整个长度。从前缘尖端到后缘尖端的直线。

  - **Radius (mm)**: 这是用于生成机翼型面前缘曲线（前缘）的曲线的半径。

  - **Thickness (%)**: 这是机翼最厚处的垂直测量值。

  - **Origin (%)**: 这对机翼型面形状没有任何影响。它只是将网格的原点从机翼鼻尖向后移动。

  - **Pitch (degrees)**: 这是机翼整体设计相对于水平面向上倾斜的程度。

  - **Halo (mm)**: 这对机翼型面形状没有任何影响。它只是在外线内侧或外侧绘制一条线，以帮助你在用夹具切割时使用此图像。

  - **All other parameters**: 这也只是机翼型面绘制方式的设置，从网格大小到纸张大小。


  看到了吗？其实也没那么糟糕。虽然比多旋翼要难得多，而且开发周期也长得多。你需要多次试飞飞机并调整设计，直到满意为止（在实现 Pixhawk 之前）。


  ## 总结


  在本章中，你对设计飞机所涉及的一切以及飞机与地面车之间的区别有了很好的入门。我相信你现在可以看到我们为什么要从地面车开始。与飞机相比，它们简直是小菜一碟。


  在下一章中，我们将向你展示如何将 Pixhawk 集成到多旋翼中。我们不会过多关注多旋翼的设计，而更注重使其正常工作。因此，我们将拼装一个 DJI Flamewheel
  F550 机身。祝你享受！

  '
- '## 一个简单的多旋翼无人机


  多旋翼是非常复杂的生物。通过 Pixhawk 和多旋翼可以完成很多工作。通过编程接口 **Micro Air Vehicle Link (MAVLink)**，可以自动触发各种任务。从基于触发传感器的警报系统触发无人机飞往特定航点，到根据天气、光照条件或其他任何数量仅受你想象力限制的变量进行调整的任务——多旋翼是你设计和概念中最通用、也最复杂的系统。


  就本书而言，我们将保持简单。一旦你准备好进入 MAVLink 接口的完整应用程序编程，就可以在 *QGroundControl* 网站上找到很棒的教程和完整的编码指南（`http://www.mavlink.org/dev/mavlink_groundcontrol_integration_tutorial`）。


  我们要做的是向你展示如何设计 Pixhawk 可以控制的最复杂机器之一——多旋翼无人机。具体来说，我们将展示如何设计和原型制作一台 360 VR 视频多旋翼。


  ![](img/504adb30bdfce87f38258e08f11180af_142_0.png)


  当然，我们的概念验证云台不会如此复杂，但其工作原理的原理是相同的。我们需要一些东西来减震，并抵消多旋翼持续的倾斜和滚动。


  但我们有点超前了。有什么便宜、实惠的相机可以用来做概念验证的 360 VR 视频呢？


  ### 从有效载荷开始


  无人机只是其有效载荷的运载装置，在本例中是相机。因此，在设计任何无人机时，从一开始就考虑你要携带的东西是有意义的。在任何概念验证中，想法是用尽可能少的钱来证明概念。只要假设你会遇到问题，甚至可能发生坠毁（尤其是多旋翼）。为什么要在概念验证上冒险使用价值
  10,000 美元（甚至 1,000 美元）的相机？从小开始，然后再扩大规模！


  所以，我们找到了完美的相机——Ricoh Theta S。Theta S 体积小、重量轻，具有集成（内置）电池和集成存储卡。我们需要担心的事情越少越好，对吧？最棒的是，它以与任何高端
  360 相机相同的 360 格式拍摄，而且只需 326 美元！它简直就是 360 相机的 GoPro。Theta S 在亚马逊上的商品列表显示如下：


  ![](img/504adb30bdfce87f38258e08f11180af_143_0.png)


  另外（正如你在商品列表上看到的那样），我们已经拥有一台了！概念验证时一定要尽量使用车间里已有的东西。这样可以节省大量资金！我们上个夏天购买了它，用于后期制作中
  360 VR 编辑工作流程的原型制作。


  我们现在会遇到的问题是（大多数）云台（尤其是便宜的）都是为 GoPro 设计的。一些更贵的云台可以为任何相机平衡……但它们是为更大更重的相机设计的。我们不想为无人机发明全新的云台。这不是我们的业务，也远远超出了本次验证的范围。那么，我们如何在一个现有的云台上管理
  Theta S 以进行概念验证呢？


  ### 选择云台


  正如我们已经说过的，云台的主要目的是保持相机稳定。它通过两种方法实现这一点：


  1. 通过橡胶垫圈（主框架与云台支架之间）减震。

  2. 通过每个轴上的无刷电机抵消无人机正常的倾斜、滚动和偏航运动。


  减震方面，我们完全没问题。用于大型相机的橡胶垫圈与最小的相同（只是垫圈数量可能会改变）。我们困难的地方在于云台本身的平衡。我们希望使用 GoPro 云台（因为重量几乎相同——Theta
  S 为 125 克，GoPro 为 149 克）。虽然 Theta S 在技术上更轻，但重量分布会完全不同。它是一款细长的相机（我们很可能会把它倒挂）。但由于尺寸完全不同，我们不能忽视云台轴上的杠杆原理。记住，给我一个足够长的杠杆，我就能撬动世界？


  我们需要确保我们的云台能够克服由于杠杆作用而产生的额外（有效）重量，并保持我们的 Theta S 稳定。这意味着它也需要有一定的可编程性，以保持适当的校准。





  最后，我们需要确保成本低廉。于是，我们上亚马逊去选购，最终我们选定了这个：


  ![](img/504adb30bdfce87f38258e08f11180af_145_0.png)


  它有足够的电机功率来应对重量分布的变化，并且让我们能够通过USB对控制器进行编程！！！到目前为止，我们的总预算已达496.94美元。好吧，对于概念验证来说，我们做得还不错（到目前为止）。


  现在，我们如何将Theta S安装到这个云台上呢？这时就要用到前几章提到的3D打印机了。等云台到货后，我们用卡尺测量实际的GoPro支架，以及Theta S（最宽处）的尺寸。Theta
  S在y轴（高度方向）上有点像橄榄球形。这正好适合我们。


  如果我们设计一个适配GoPro尺寸、但中央有一个方形间隙的支架，在Theta S两侧被夹紧的地方涂上一条硅胶，就可以让连接非常牢固，并且有足够的摩擦力将Theta固定住。这是我们设计出的简单（又轻便）方案：


  ![](img/504adb30bdfce87f38258e08f11180af_146_0.png)


  以下几个设计要点需要注意：


  - 1. 边缘采用斜角设计，这样即使存在测量（或3D打印）误差，适配器也能稳固地卡入支架中。

  - 2. 有销钉和孔位，使适配器能牢牢固定Theta S，避免蛤壳式结构的两半滑脱。

  - 3. 用于嵌入Theta S的孔是方形的（而不是橄榄球形的）。


  最终3D打印的适配器如下图所示：


  ![](img/504adb30bdfce87f38258e08f11180af_147_0.png)


  可能有点难看到（因为我们在打印机中也使用了透明耗材）蛤壳两半上用的那两道硅酮密封胶条，但这正是它效果如此好的原因。它提供了很强的抓力，而且足够柔韧，能牢牢夹紧我们的Theta
  S。另外请注意，这个3D打印件内部是空心的，带有蜂窝结构。这使得它既轻巧又坚固。下面是绑上Theta S后的效果：


  ![](img/504adb30bdfce87f38258e08f11180af_147_1.png)


  看起来非常简单，对吧？确实如此。有时候最好的方案就是那么简单。对于概念验证设计，橡皮筋和扎带有时是你最好的朋友。你可能会担心橡皮筋会干扰GoPro支架。我向你保证它们不会。事实上，它们还会派上用场。不过我们到组装阶段再说。


  所以，我们最终的重量是146克，仍然比GoPro要轻。在组装多旋翼的过程中，不断称重是很重要的。对于被弄脏的秤我表示抱歉。这个秤也是我们在混合前称量硅胶原料用的秤。但请相信我，在称重前已经归零（Theta的保护套已经套在上面）；146克是准确的。


  ![](img/504adb30bdfce87f38258e08f11180af_148_0.png)


  好的，到目前为止，我们的总重量是149克（云台）+ 146克（相机），总计295克。在组装空中无人机（尤其是多旋翼）时，记录重量非常重要。现在我们只需要一架能够承载该负载并安全降落的无人机。


  ## 起落架


  嗯，我们现在遇到了麻烦。问题是我们需要可收放的起落架（如下面的截图所示）：


  ![](img/504adb30bdfce87f38258e08f11180af_149_0.png)


  为什么？因为我们这里处理的是360度VR视频。我们想直接替换掉无人机（并加入更多天空），而不必用转描技术去除相机侧面和下方的起落架。但可收放起落架要一个月才能到货！此外，也没有真正的方法将我们的起落架和云台安装到无人机上。我们需要一个导轨系统。


  于是我们选用了如下截图所示的起落架：


  ![](img/504adb30bdfce87f38258e08f11180af_149_1.png)


  呃。好吧，它们不能收放，但它们确实有导轨，所以我们会把两种都订购。我们会把导轨安装在无人机上，进行基本的飞行测试。然后，等可收放起落架到货后，我们就可以进行一些视频测试了。这会额外花费我们20.99美元，但谁在乎呢？从大局来看，这只是沧海一粟。而且我们时间也很紧。所以，如果可收放起落架不能及时到货，我们仍然可以先跑一些测试，让这家伙飞上天！


  这两种起落架最大的共同点是什么？离地间隙大。这样，相机和云台额外增加的长度仍然能避开平坦地面/起降台。这是保护相机安全的最重要部分。


  到目前为止，我们的总预算已经达到了561.63美元。而且我们还没买机架、电机、螺旋桨和电调（ESC）。幸运的是，我们已经有一个Pixhawk飞控了。


  但我们还没到那一步。现在，由于我们真的没有办法在这台相机上预览360度视频（除非使用Wi-Fi）……我们需要一个额外的FPV（第一人称视角）摄像头（这样我们就能在地面站看到无人机正在发生什么）。我们绝对不想在航空平台上使用Wi-Fi。干扰控制信号的可能性太大。那将是很高的风险，而你绝对不想冒这个险。


  ## 第一人称视角——FPV系统


  在美国，在没有特别豁免的情况下，在视线范围（VLOS）之外飞行无人机是违法的。然而，当你看着笔记本电脑屏幕时，如果还能看到一些关于无人机飞行方向的信息，那才是最安全的，对吧？所以，FPV系统是一个必要的安全功能（如果使用得当的话）。另外，它还能让你的VR拍摄导演有机会（第一手）看到无人机正在从哪里拍摄，并适当地指导你。


  由于这只是概念验证，我们不需要非常强大的系统。它不需要很远的传输距离，而且由于这只是一台量产无人机的小型版本，它真的需要尽可能简单和轻便。


  于是我们选择了（一体式）Spektrum FPV摄像头，内置发射机：


  ![](img/504adb30bdfce87f38258e08f11180af_151_0.png)


  这又增加了85克，使我们的总重量（到目前为止）达到295克 + 200克（起落架 + 导轨）+ 85克（摄像头/发射机）= 580克。看到它是怎么不断增加的吧？但等等，还有更多！


  这个发射机的工作电压比我们无人机所需的电压低得多。我们有两个选择：要么加装某种变压器，要么直接使用另一块电池。我们会选择第二种方案（对于我们的概念验证）。为什么？因为一块1S锂聚合物电池很可能比变压器还要轻：


  ![](img/504adb30bdfce87f38258e08f11180af_151_1.png)


  我们购买的带E300动力系统的F550如下图所示：


  ![](img/504adb30bdfce87f38258e08f11180af_153_0.png)


  Flame Wheel机架、电机、电调和螺旋桨重约2.9磅（1,315.5克）。这使我们的总重量达到1,897.1克（远低于我们2,400克的最大起飞重量）。这意味着我们还有大约502.9克用于电池和Pixhawk。


  ## 电池


  我们需要4S电池。我们需要足够的动力。不幸的是，这里有一个重量问题：电池重量会比3S电池增加25%。（这里的S表示电池的电芯数量。）


  我们需要为Pixhawk及配件（GPS等）留出150克到200克。所以我们有300克到350克可以用于电池。不幸的是，这大大限制了我们的mAh（毫安时）额定值。基本上，这个额定值表示电池在一小时内可以消耗多少毫安。


  数字越大，你的潜在飞行时间就越长。但理论上和实际上，mAh越大，电池越重，对你的整体飞行时间影响也越大。这就是收益递减定律。例如，一块6,000 mAh的电池不会带来两倍于3,000
  mAh电池的飞行时间。更有可能是（只是举例，并非真实数据）增加15%（前提是你的飞机还能离地起飞）。


  我们找到了这些正好处于328克最佳重量点的电池：


  ![](img/504adb30bdfce87f38258e08f11180af_154_0.png)


  - HRB品牌锂聚合物（LiPo）电池

  - 1年质保和友好的客户服务。

  - 应用：遥控飞机、直升机、汽车、卡车、船、无人机等。（只要电压、尺寸和插头匹配，即可适用。）

  - 注意：充电电压不要超过4.2V，放电电压不要低于3.7V。


  这使得我们的资金预算达到622.60美元（到目前为止）+ 66.98美元（两块电池）+ 310美元（Flame Wheel机架），总计为1,000.58美元。说真的，对于一架概念验证无人机来说，这算是相当便宜了。


  现在，我们需要进行一些计算，看看这东西到底能不能飞起来。





  我知道这个字体读起来真的很小。结论是什么？我们大约有 5.5 分钟的飞行时间。如果我们要进入量产原型阶段，我们会花费大量时间（而且可能花费更多钱）来调整零件，直到达到飞行时间和载荷的完美平衡。但这绝对不是量产原型。不是我们最终想要携带的相机，也远没有我们最终想要的大小。对于一个简单的概念验证，5
  分钟的飞行时间我们是可以接受的。如果我们真的想，可以用 5,000 mAh 的电池将其提升到略高于 7 分钟。但如果我们全油门飞行，这可能会过载我们的电机。别冒这个险。


  再次说，这低的飞行时间可能会让你震惊，如果你习惯了 DJI Phantom、Inspire 等。但再次强调，这不是一台完整的量产无人机。这只是概念验证。不是关于平衡电池驱动到重量的验证，而是关于飞行
  360 相机，并成功地用定制系统稳定它的验证。


  对于这些目的来说，5 分钟并不理想，但也绝对不算差（尤其是考虑到我们的预算）。通过对硬件和预算的适当调整，我们完全可以预期超过 20 分钟的飞行时间。但我们又面临时间紧迫的问题。花费
  1,000 美元（不包括 Pixhawk）打造一台完全可用的概念验证机，虽然耐力不如量产原型，但足以启动一个 Kickstarter 活动。或者至少足以向潜在投资者证明我们能够打造这样的无人机。其余的只是调校（选择合适的尺寸、硬件和电池）。


  现在，让我们来建造我们的概念验证机。


  ## 组装无人机


  正如预测的那样，我们的可伸缩起落架还没有到货。不仅如此，它们还在海关遇到问题。幸好我们提前想到了并买了临时起落架；花 20.99 美元非常值得！


  所以，这里是我们的无人机组装后（带临时起落架）的样子：


  ![](img/504adb30bdfce87f38258e08f11180af_157_0.png)


  让我们快速了解一下多旋翼无人机的建造技巧。


  ## 太多该死的电线了！


  那东西看起来像一团乱麻，对吧？其实不是。线缆管理是关键。你不想让任何电线有阻碍（甚至损坏）螺旋桨的危险。那意味着瞬间坠毁。以下图片显示了通往 ESC 和电机的电线是如何在机身下方布线并捆绑的：


  ![](img/504adb30bdfce87f38258e08f11180af_157_1.png)


  不仅如此，**电磁（EM）**干扰是空中的敌人。它完全可能破坏你的视频、遥测、GPS，甚至控制信号。所以不要把电线绕成圈。相反，注意它们是绕成八字形的（尤其是电源线）。


  既然说到这个角度——不要漏掉任何螺丝！很多老派的无人机飞行员来自固定翼世界。在这些圈子里，常见的做法是用两颗螺丝固定电机。不要那样做。如果一颗螺丝松动，你失去一个电机，你的多旋翼可能会很快变成从天而降的石头。


  处理多旋翼时，你必须记住，即使是一架钢琴，其滑翔性能也比多旋翼好。


  套件制造商随附几颗额外螺丝的情况并不罕见。如果你装完后发现有多余的螺丝，请仔细检查每颗螺丝，确保你都装上了。如果它们看起来多余，那它们不是。


  ## GPS 装在杆子上


  你可能还会注意到 GPS 天线安装在一个支架上（如以下图片所示）：


  ![](img/504adb30bdfce87f38258e08f11180af_158_0.png)


  你希望 GPS 远离电机所在的平面。记住，电动机是通过磁场工作的。电磁的定义就是这样，对吧？所以把它抬高并远离这些电机。电机运行所在的平面不一定会破坏你的 GPS。但它可能会。为什么要冒这个险呢？它可能看起来很奇怪。但坠毁的无人机看起来更糟。


  ## 导轨很棒


  导轨在电视和电影行业已经使用了很长时间。简单来说，它们是一种用于安装附件的标准化系统。事实上，导轨（以多种不同形式）被用于从枪械（皮卡汀尼导轨用于瞄准镜、手电筒、激光和其他附件）到电影摄像机（用于遮光斗、跟焦器、监视器、外置硬盘等等）的一切东西。无人机的导轨是无人机的中心。所有主要硬件都连接到导轨上。主机身、起落架、云台，甚至在大多数情况下，电池都安装在导轨上。你可以在以下图片中看到我们无人机的导轨：


  ![](img/504adb30bdfce87f38258e08f11180af_159_0.png)


  在这里，你可以看到两根碳纤维管（导轨），机身附着其上（使用橡胶垫圈穿过铝制 D 形环），我们的云台附着其上，起落架支架附着其上，甚至还有一个空白导轨安装座（顶部），以防我们将来决定安装另一个附件。


  你可以了解到导轨有多么有用。这其实是一个相当简单的概念。大多数附件只需卡入导轨系统即可。导轨非常方便而且很棒。


  ## 有什么松动的？收好并绑紧


  在以下图片中，你可以看到并非每个舵机连接都被插上。因为我们在飞行期间不需要倾斜或平移云台（记住，它是一台 360 相机），所以我们没有费心连接云台的那些控制。但我们不想让松散的电线乱晃并可能击中我们的旋翼。所以它们被塞进机架中，只露出末端，以防我们日后改变主意。此外，在可能的情况下，我们把电线塞得更深进机架，在不可能的情况下，我们用扎带把它们绑在一起。以下图片中至少有五条扎带。你能全部找到吗？


  ![](img/504adb30bdfce87f38258e08f11180af_160_0.png)


  沿着同样的思路，确保你不要对组件掉以轻心。仅仅把电池绑好是不够的。用魔术贴固定以确保它们不会滑脱；3M 汽车胶带也非常适合更永久地固定东西。以下图片显示了 FPV
  相机的电池，以及相机本身。请注意，相机是用一块灰色的 3M 汽车胶带固定的，而电池是用魔术贴固定的（目前放在侧面以展示魔术贴）。


  ![](img/504adb30bdfce87f38258e08f11180af_161_0.png)


  汽车胶带、魔术贴和扎带是多旋翼建造时最好的朋友。


  ## 将 ESC 连接到 Pixhawk


  Pixhawk 可以处理各种多旋翼。以下图表说明了多旋翼的类型以及它们的电机数量：


  ![](img/504adb30bdfce87f38258e08f11180af_162_0.png)


  正如你所见，有很多种多旋翼，所以不要让自己陷入我个人的痛点——有人把它们全部叫做四轴。它们绝对不是全部都是四轴。图形中圆圈的方向说明了电机/螺旋桨必须旋转的方向，以便多旋翼能够与
  Pixhawk 正常飞行。数字对应于 Pixhawk 舵机板上的 Main Out 编号。


  - 3. 设置一套摇杆，以便我们可以用传统的直升机式（真实世界）控制来飞行多旋翼。


  所以，不再耽搁，让我们开始吧！


  ## Pixhawk 的初始配置


  显然，通过 USB 将你的 Pixhawk 插入电脑，在 Mission Planner 中连接它，然后启动向导。首先，让我们运行多旋翼版本的设置向导，然后再进行调整：


