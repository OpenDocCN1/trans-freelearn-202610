  \ – 选择捕获接口\n\n+   9. 最后，在主菜单中选择**退出此配置实用程序**选项退出，然后运行 `sudo reboot` 命令重新启动传感器设备。\n\
  \n在传感器设备重新启动期间，让我们返回 vSphere 客户端并打开 Command Center VM 的**Web 控制台**，以便接下来配置该 VM。按照以下说明配置\
  \ SD-CommandCenter VM：\n\n+   1. 在 Command Center VM 的终端中，使用我们最初用于传感器的相同用户名和密码登录，然后运行\
  \ `sudo sdconfig` 启动配置实用程序，如下图所示：\n\n![](img/c8ffa9959721097701584fcc95101362_210_1.png)\n\
  \n图 6.65 – 练习 3 – 配置 SilentDefense – Command Center 配置菜单\n\n+   2. 在主菜单中选择**配置管理接口**，并设置\
  \ Command Center 设备的 IP 地址详细信息，如下图所示：\n\n\n\n![](img/c8ffa9959721097701584fcc95101362_211_0.png)\n\
