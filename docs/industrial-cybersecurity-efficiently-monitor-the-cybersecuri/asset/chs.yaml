  \ Security Onion 设备通过互联网检索更新。AIRGAP 是一个有趣的选项，尤其是在完全与外界隔离的工业网络上。两个选项均显示在以下截图中：\n\n\
  ![](img/c8ffa9959721097701584fcc95101362_179_0.png)\n\n图 6.21 – 练习 1：安装 Security\
  \ Onion – 选择 STANDARD 安装条件\n\n- **17.** 是时候为我们的新 Security Onion 设备命名了。我选择了 IND-SecurityOnionv2，如下图所示：\n\
