  \ following:\n\n- Network packet sniffing for the detection of malicious activity\n\
  - The collection and correlation of event logs to identify malicious behavior/activity\n\
  - Host-based security solution agents collecting system statistics to discover malicious\
  \ activities\n\nWe will now discuss the three main methods of passive security monitoring\
  \ techniques.\n\n## Network packet sniffing\n\nNetwork packet sniffing is the practice\
  \ of inspecting traffic that traverses the network segment being inspected. Normally,\
  \ **network interface cards** (NICs) only pass relevant network packets (packets\
