  7) Ping host                     16) Restart PHP-FPM\n8) Shell\n\nEnter an option:\
  \ 2\n\nAvailable interfaces:\n1 - WAN (em0 - dhcp, dhcp6)\n2 - LAN (em1 - static)\n\
  \nEnter the number of the interface you wish to configure: 2\n\nEnter the new LAN\
  \ IPv4 address. Press <ENTER> for none:\n> 172.25.100.1\n```\n\n![](img/c8ffa9959721097701584fcc95101362_196_0.png)\n\
  \n12. 指定一个子网掩码（24）。\n\n13. 直接按 *Enter* 跳过指定网关的步骤，最后决定是否要在 LAN 接口上启用 **动态主机配置协议**（DHCP）服务器（y/n）。\n\
  \n14. 设置将会被应用，完成后按一次 *Enter* 完成流程，如下图所示：\n\n![](img/c8ffa9959721097701584fcc95101362_197_0.png)\n\
  \n图 6.47 – 练习 2：配置 pfSense – IP 子网掩码\n\n至此，pfSense VM 的安装已完成。接下来，我们将查看防火墙的一些基本配置。\n\
  \n#### 配置 pfSense\n\n如上一节中的前一张截图所示，刚创建的 pfSense 防火墙的 WebConfiguration 地址为 https://172.25.100.1。我们将使用此统一资源定位符（URL）来配置防火墙。\n\
  \n首次登录 WebConfigurator 门户（默认凭据为 admin 和 pfsense）时，会出现一些初始配置步骤。登录屏幕如下图所示：\n\n![](img/c8ffa9959721097701584fcc95101362_197_1.png)\n\
  \n图 6.48 – 练习 2：配置 pfSense – Web 门户登录\n\n登录后，初始配置流程会自动开始。按照以下说明完成这些初始配置步骤：\n\n-\
  \ 1. 在步骤 1， simply 点击 **Next**。\n- 2. 在步骤 2，指定服务器名称并输入要使用的主、辅 DNS 服务器。我指定 1.1.1.1\
  \ 为主服务器，9.9.9.9 为辅服务器。保持 Allow DNS servers to be overridden by DHCP/PPP on WAN 复选框已勾选，然后点击\
  \ Next。\n- 3. 在步骤 3，从下拉菜单中选择 **协调世界时（UTC）** 时区（为了使我们发送到 Security Onion 的事件生成正确的时间戳，我们需要将\
  \ pfSense 防火墙的时区设置为 UTC，这是许多网络和安全设备普遍接受的默认格式，可方便跨多个系统和设备同步事件日志时间戳）。\n- 4. 在步骤 4，定义\
  \ **广域网（WAN）** 接口设置（就我而言是 DHCP）并点击 **Next**。\n- 5. 在步骤 5，定义 LAN 接口（已在之前完成）并点击 **Next**。\n\
  - 6. 在步骤 6，将默认管理员密码更改为比 pfSense 更安全的密码，然后点击 **Next**。\n- 7. 在步骤 7，点击 **Reload**。\n\
  \n我们的 pfSense 防火墙 VM 现已构建完成并具有初始配置，可以开始处理流量。接下来让我们配置事件日志转发，以便在 Security Onion 的搜索和仪表板中包含来自防火墙的数据。\n\
  \n#### 配置 syslog 日志转发（Security Onion）\n\n为了开始将 pfSense 防火墙日志转发到我们的 Security Onion\
  \ syslog 服务器，我们首先需要允许该服务被 pfSense 防火墙访问。为此，请按照以下步骤操作：\n\n- 1. SSH 登录 Security Onion\
  \ VM（`ssh adm-pac@172.25.100.250`）并运行 `sudo so-allow` 命令。\n- 2. 选择 s 以允许 **Syslog\
  \ Device** — 端口 514/tcp/udp。\n- 3. 指定 pfSense 防火墙的 LAN IP 地址作为允许的 IP 地址（172.25.100.1）。\n\
  - 4. 通过按 Enter 确认配置。流程如下图所示：\n\n![](img/c8ffa9959721097701584fcc95101362_199_0.png)\n\
  \n图 6.49 – 练习 2：Security Onion – 允许 syslog 访问\n\n这样就完成了对 Security Onion VM 上 syslog\
  \ 服务器的访问允许。接下来，我们需要配置 pfSense 开始将事件转发到外部 syslog 服务器。为此，请按照以下说明操作：\n\n- 1. 导航到 pfSense\
  \ WebConfigurator 门户 https://172.25.100.1 并登录门户。\n- 2. 前往 Status/ System Logs/ Settings，如下图所示：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_200_0.png)\n\n图 6.50 – 练习 2：配置 pfSense\
  \ – 系统日志设置\n\n- 3. 滚动到此配置屏幕底部并启用 Send log messages to remote syslog server。\n- 4.\
  \ 填写配置选项，如下图所示，将所有内容发送到 Security Onion syslog 服务器 172.25.100.250:514：\n\n![](img/c8ffa9959721097701584fcc95101362_201_0.png)\n\
  \n图 6.51 – 练习 2：配置 pfSense – 设置 syslog 转发\n\n- 5. 点击 Save 完成配置流程。\n\n就这样：我们现在在实验室环境中拥有一个功能正常的\
  \ pfSense 虚拟防火墙 VM，并已配置了事件转发到我们在练习 1 – 设置和配置 Security Onion 中构建的 Security Onion\
  \ 设备。我们将在第 9 章《可视化、关联和告警》中看到这带来的功能。\n\n在下一个练习中，我们将安装和配置一种工业 IDS 和资产管理解决方案——即 Forescout\
  \ 的 SilentDefense。\n\n### 练习 3 – 设置、配置和使用 Forescout 的 eyeInsight（前身为 SilentDefense）\n\
  \n本章的最后一个练习是关于构建和配置 Forescout SilentDefense OT/ICS IDS 和资产管理设备。\n\n#### 部署 SilentDefense\
  \ 传感器和 Command Center VM\n\nForescout SilentDefense 传感器和 Command Center 设备以可下载的\
  \ Open Virtual Appliance（OVA）模板文件形式提供，可在购买产品后从 Forescout 客户门户下载。OVA 是一种支持在各种虚拟化产品和平台之间交换\
  \ VM 的文件格式。\n\n对于本练习，我将使用以下两个 OVA 文件：\n\n- `sd-411-cc-16g-vmware.ova`：这是 Command\
  \ Center 的 16 GB 随机存取存储器（RAM）版本。\n- `sd-411-sensor-8g-vmware.ova`：这是传感器的 8 GB RAM\
  \ 版本。\n\n我们将在 vCenter 集群上安装 VM，原因有两个，首先，vCenter 集群通常是这类设备所使用的环境；其次，我想稍微改变一下，以便更好地覆盖\
  \ OT 网络虚拟化环境中通常找到的工具、技术和技术。如果你想跟随练习，VMware 提供了一个 vCenter 评估版本，允许你运行 vCenter 设备 60\
  \ 天。前往 https://my.vmware.com/en/web/vmware/evalcenter?p=vsphere-eval-7 了解更多信息。此外，第\
  \ 19 章《实验室设置》也有关于如何部署 vCenter 的说明。\n\n因此，在下载了两个 OVA 文件并准备就绪后，请按照以下说明部署我们的 SilentDefense\
  \ VM：\n\n- 1. 导航到 vCenter 设备门户（https://10.11.11.50）并点击 LAUNCH VSPHERE CLIENT（HTML5），如下图所示：\n\
  \n图 6.52 – 练习 3 – vSphere 客户端登录\n\n- 2. 右键单击 LAB-Datacenter 文件夹并选择 Deploy OVF Template，如下图所示：\n\
  \n图 6.53 – 练习 3 – SilentDefense – 部署传感器 VM 开放虚拟化格式（OVF）模板\n\n\n\n\n\n+   3. 在**部署\
  \ OVF 模板**界面，在部署过程的第一个步骤中，选择**本地文件**并附加 `sd-411-sensor-8g-vmware.ova` 文件。我们先从传感器的部署开始，虽然部署顺序并不重要，因为两者需要协同使用。点击**下一步**，如下图所示：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_204_0.png)\n\n+   4. 对于部署过程的*第2步*，为我们即将部署的虚拟机命名\
  \ (SD-Sensor)，并选择 **LAB-Datatacenter** 作为部署位置。点击**下一步**。过程如下图所示：\n\n![](img/c8ffa9959721097701584fcc95101362_204_1.png)\n\
  \n+   5. 对于*第3步*，将计算资源保留为默认选择，然后点击**下一步**。\n\n6. 部署过程现在将验证 OVA，如果成功则返回摘要。点击下一步。过程如下图所示：\n\
  \n#### 部署 OVF 模板\n\n+   ✓ 1 选择 OVF 模板\n+   ✓ 2 选择名称和文件夹\n+   ✓ 3 选择计算资源\n+   4 查看详细信息\n\
  +   5 选择存储\n+   6 选择网络\n+   7 准备完成\n\n查看详细信息\n验证模板详细信息。\n\n| 发布者 | 无证书 |\n| 描述 |\
