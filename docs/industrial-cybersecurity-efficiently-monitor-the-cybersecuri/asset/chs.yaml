  \ 44818 上暴露的服务是 Allen-Bradley 控制器的编程接口，随时可以指向 **RSLogix 5000** 并开始搞破坏。\n\n正如我所说，允许蜂窝调制解调器连接进入您的\
  \ ICS 环境是一个糟糕的主意。诚然，确实有一些公司能够妥善保护该后门连接，但总体来说，它们做得并不好。\n\n## IDMZ 设计由什么组成？\n\n在本节中，我们将探讨典型\
  \ IDMZ 中可能出现的各个部分。我们将从硬件、连接性以及设计和配置的角度来审视各个部分。我们将围绕以下基本 IDMZ 设计展开讨论：\n\n![](img/c8ffa9959721097701584fcc95101362_89_0.png)\n\
  \n*图 3.4 – 基本 IDMZ 架构设计*\n\n接下来，让我们更详细地了解构成 IDMZ 的各个部分，如图 3.4 所示。\n\n### 企业区\n\n\
  IDMZ 资产在企业区中的存在通常非常有限，甚至可能完全没有。通常，端点客户端（如 Web 浏览器、RDP 客户端等）用于与工业环境交互。\n\n某些工业应用程序或\
  \ IDMZ 代理服务要求 ICS 环境在企业侧有存在。例如，SQL 到 SQL 复制（或 Pi Historian 系统的 **Pi-to-Pi**）等数据复制解决方案需要企业网络上有服务器来同步工业数据。另一个例子是\
  \ IDMZ 代理服务需要企业侧资源，例如远程/供应商访问解决方案。供应商/远程访问解决方案的最佳实践不是将远程用户直接连接到公司网络，而是使用某种虚拟跳板机（想想\
  \ Citrix 的远程访问解决方案类型）。然后，该虚拟跳板机被允许（仅）与 IDMZ RDP-GW 服务器通信，以代理到工业区资源的连接。我想指出的企业网络上\
  \ ICS 存在的最后一个例子是**制造执行系统（MES）**。典型的 MES 会在企业侧拥有（专用的）客户端，这些客户端直接或间接地与工业侧系统的部分进行通信。\n\
  \n### 硬件\n\n用于企业网络上 ICS 存在的硬件差异很大。它可以是专用 PC 或服务器，也可以将资源集成到（现有的）虚拟化平台中，例如 **Hyper-V**\
  \ 或 **VMware vSphere**。\n\n### 设计和配置注意事项\n\nICS 企业侧存在的配置高度依赖于 ICS 的环境、需求、功能和状况。这里无法进行详细讨论，但我们将介绍一些有助于提高\
  \ ICS 环境整体安全性的配置注意事项，如下所示：\n\n-   为作为 ICS 系统或 IDMZ 代理服务一部分的企业系统使用专用资源。\n-   为作为\
  \ ICS 系统或 IDMZ 代理服务一部分的企业系统划分网络段。\n\n#### IDMZ 防火墙\n\nIDMZ 防火墙是与 IDMZ 相关的安全区域物理隔离的核心。防火墙的接口允许连接企业网络和工业网络的硬件，以及任何其他区域。防火墙规则决定了流量如何被允许流动。\n\
  \n\n\n\n\n### 硬件\n\n供应防火墙的制造商有多种。以下三种是我所见最常用于 IDMZ 防火墙的：\n\n- **思科**：思科 Firepower\
  \ 2100 系列防火墙\n- **派拓网络**：派拓网络 PA-800 系列防火墙\n- **飞塔**：飞塔 FortiGate 系列防火墙\n\n### 设计和配置注意事项\n\
  \n以下是针对 IDMZ 防火墙的一些通用设计和配置注意事项：\n\n- 使用一对防火墙，采用**主备（active-standby）**模式，以便在设备或连接故障时安全故障转移。\n\
  - 使用冗余接口对连接网络网段，以实现接口和网络介质冗余。\n- 为防火墙购买**深度包检测（DPI）**服务，以便在应用层检测漏洞利用和攻击。\n- 为连接到防火墙的每个区域以及定义的每个代理服务创建安全区域。这样可以实现所有区域和服务之间的细粒度控制。\n\
  - 确保包含一条 `BLOCK ANY` 或 `DENY ALL` 规则作为最终规则或默认规则，以确保除非明确允许，否则所有流量都被阻止。\n- 确保禁用所有未使用的端口、协议和功能，以强化防火墙。\n\
  - 将防火墙的管理端口连接到专用管理网段。\n\n### IDMZ 交换机\n\nIDMZ 防火墙的一个接口专用于 **IDMZ 代理服务**网段。IDMZ 代理服务通过一组承载虚拟服务器/服务的虚拟化服务器实现。为了在物理上连接所有接口并在逻辑上连接所有服务器/服务，IDMZ\
  \ 建设中包含一对交换机。\n\n使用交换机可以通过冗余网络接口连接将 IDMZ 虚拟化服务器连接到 IDMZ 防火墙，并允许将虚拟服务器划分到各自专用的**虚拟局域网（VLAN）**中。\n\
  \n### 硬件\n\n用于 IDMZ 交换机的硬件可以来自任何制造商，只要其生产的可管理交换机支持 VLAN、堆叠和冗余接口配置（交换机端口、EtherChannel\
  \ 等）。主要根据端口数量来选择（IDMZ 交换机只使用少量端口），但大多数 IDMZ 部署受益于使用具有万兆接口的交换机。为此，我通常选择一对思科 3850-12XS-S\
  \ 交换机（https://www.cisco.com/c/en/us/support/switches/catalyst-3850-12xs-s-switch/model.html）；不过，其他规格类似（但价格更低）的交换机型号或品牌也能同样胜任。\n\
  \n### 设计和配置注意事项\n\n以下是针对 IDMZ 交换机的一些通用设计和配置注意事项：\n\n- 使用交换机堆叠以实现交换机冗余。\n- 将冗余接口对交叉布线（在堆叠交换机之间拆分冗余对），从\
  \ IDMZ 交换机连接到防火墙和虚拟化服务器的**网络接口卡（NIC）**，以实现接口和网络介质冗余。\n- 确保禁用所有未使用的端口、协议和功能，以强化交换机。\n\
  - 不要在交换机上启用路由（如果支持），以防止 VLAN 跳跃。\n- 将连接到 IDMZ 防火墙的接口实现为单臂路由（router on a stick）方式，使用子接口为各个服务的\
  \ VLAN 提供隔离。\n- 将交换机管理端口实现为专用的**虚拟路由转发（VRF）**端口，并将管理端口连接到专用管理网段（https://www.cisco.com/c/en/us/td/docs/routers/asr1000/configuration/guide/chassis/asrswcfg/Management_Ethernet.html#pgfId-1058906）。\n\
  \n### IDMZ 代理服务\n\n现在，我们进入 IDMZ 的核心部分：代理服务。IDMZ 代理服务实现为运行在虚拟化主机（IDMZ 虚拟化堆栈）上的虚拟服务器（虚拟机）。IDMZ\
  \ 虚拟化堆栈是一组运行虚拟化解决方案（如 Microsoft Hyper-V 或 VMware vCenter）的物理服务器。这种设置允许将代理服务（以及工业——**第\
  \ 3 级现场运营**——资源）虚拟化，这样我们就不必为每个服务配备物理服务器，也不必让多个服务共享一台服务器。\n\n### 硬件\n\n要使用的服务器数量以及每台服务器的构建规格，取决于将在其上运行的\
  \ IDMZ/第 3 级现场运营工作负载的大小。通常，我建议使用三台虚拟化服务器，因为这样可以在 VMware vCenter 中使用**虚拟存储区域网络（vSAN）**作为经济高效的存储解决方案（无需专用\
  \ SAN 服务器）。对于每台服务器，我建议将服务器一半的**中央处理器（CPU）**插槽插入 CPU，一半的**随机存取存储器（RAM）**插槽插入内存模块，其数量要足以充裕地支持预计数量的**虚拟机（VM）**（代理服务）运行。只使用一半的\
  \ CPU 插槽和 RAM 插槽，以便将来有需要时可以升级每台服务器的资源。\n\n推荐两个虚拟化硬件制造商：思科及其**统一计算系统（UCS）**系列虚拟化服务器，以及戴尔及其\
  \ PowerEdge R740 系列虚拟化服务器。\n\n### 设计和配置注意事项\n\n以下是针对 IDMZ 代理服务器的一些通用设计和配置注意事项：\n\
  \n- 如果计划使用 vSAN 作为存储技术，则虚拟化堆栈中虚拟化服务器的最小数量为三台。这是因为 vSAN 需要一个见证者来防止脑裂情况。\n- 将服务器和虚拟化解决方案的管理端口连接到专用管理网段。\n\
  - 为每个将承载代理服务的虚拟服务器使用虚拟网卡/网段。将虚拟网卡/网段与在 IDMZ 交换机上创建的 VLAN 对齐。这样可以在服务之间实现最佳的（虚拟）隔离。\n\
  - 不允许虚拟化服务器或虚拟化解决方案连接到互联网进行更新，而应手动执行所有更新，以防止意外更新或不必要地暴露到互联网。将 IDMZ 虚拟化堆栈视为工业区的一部分。\n\
  \n### 工业区 – 第 3 级现场运营\n\nIDMZ 的最后一个区域是延伸到工业区的那部分。正如我们在企业侧看到的那样，某些 IDMZ 代理服务需要在工业网络上托管该服务的一个组件。例如，安装了必要控制和自动化工具、应用程序和实用程序的虚拟桌面服务器。这种设置允许企业远程桌面客户端与自动化和控制资源进行交互。另一个例子是安全文件传输代理服务实现中的工业侧组件。这通常归结为在工业网络上放置一个专用文件服务器，位于\
  \ IDMZ 代理服务部分中的代理服务与该文件服务器通信，将文件发送给它或从中拉取文件，以便与企业文件服务器或**安全文件传输协议（SFTP）**客户端共享。\n\
  \n请注意，需要在工业区中存在的 IDMZ 代理服务解决方案组件应位于第 3 级现场运营。IDMZ 代理服务绝不应直接与第 2 级或更低级别的工业资源通信。换句话说，如果\
  \ IDMZ 代理系统的最终目标是允许企业用户或系统从第 2 级或更低级别的工业系统检索数据或与之交互，则这些交互需要通过第 3 级现场运营中的系统进行。\n\n\
  例如，请考虑下图所示的情况：\n\n\n\n\n\n![](img/c8ffa9959721097701584fcc95101362_95_0.png)\n\n\
  **图 3.5 – 从企业到工业远程访问示例**\n\n该示意图展示了，例如，需要重新配置 PLC 的用户如何通过其企业工作站或笔记本电脑，与 3 级现场运维中的一个端点（目标是安装了必要软件和许可证的工业工作站或虚拟桌面服务器）建立远程桌面会话。然后，系统将允许与该工业设备进行必要的交互。这种设置防止了从\
  \ IDMZ 代理服务区直接访问工业设备，从而增加了另一层保护。此外，这种场景还使得管理更加容易。\n\n所有工具、文件和许可证都安装在工业区内的计算机上。如果企业网络上的客户端计算机发生故障、丢失或感染病毒，我们真正需要恢复运行的只是一台能够运行远程桌面客户端应用程序以连接到工业网络上的虚拟自动化和工程服务器的备用计算机。\n\
  \n作为第二个示例，考虑相反的情况：数据需要从工业设备流出，并与企业用户和系统共享。下图描绘了数据应如何流动：\n\n![](img/c8ffa9959721097701584fcc95101362_96_0.png)\n\
  \n上图展示了来自工业区（功能区）的数据是如何从 3 级现场运维中的 SCADA 服务器拉取或推送到该服务器的。SCADA 服务器将把这些收集到的数据（部分或全部）发送到本地\
  \ SQL 服务器进行本地存储。数据存储在工业 SQL 服务器中后，IDMZ 中的 SQL 到 SQL 复制服务现在可以拉取或接收这些数据，并将其复制到企业 SQL\
  \ 服务器。一旦数据进入企业 SQL 服务器，企业区中的客户端和系统就可以使用这些数据了。作为补充说明，此复制过程可以双向工作，甚至可以是双向的。\n\n###\
  \ 硬件\n\n正如我们在前一章中讨论的那样，用于虚拟化 IDMZ 代理服务的虚拟化硬件也可以用来虚拟化 3 级现场运维计算需求的全部或部分。一种稍更安全——但最终更昂贵且更麻烦——的方法是，将\
  \ 3 级现场运维的计算资源托管在专用的**虚拟化**堆栈上。无论哪种方式，3 级现场运维通常是虚拟服务器和物理服务器的混合体，连接到工业核心交换机，以便所有设备都能相互通信。\n\
  \n> **重要说明**\n> 我并不是在提倡在 IDMZ 代理服务和 3 级现场运维计算资源之间共享或不共享虚拟化堆栈。在我看来，共享带来的额外风险可以忽略不计，但如果任何一方的资源需求足够高，或者完全分离带来的额外安全性能证明增加的成本是合理的，那么可能有必要为这两个部分专门配备**虚拟化**设备。\n\
  \n### 设计和配置注意事项\n\n以下是一些针对工业区的通用设计和配置注意事项：\n\n- 与 IDMZ 代理服务的通信应仅限于 3 级现场运维中的系统。\n\
  - 来自 2 级及以下级别的数据只应发送到 3 级现场运维系统，并直接发送到 IDMZ 代理服务。\n- 与 2 级及以下级别的自动化和控制设备的交互，只能从\
  \ 3 级现场运维中的系统发起。\n- 管理端口、接口和**应用程序编程接口（API）**应连接到专用的管理网络。\n- 3 级现场运维系统（以及工业区中任何其他相关系统）应成为专用**工业\
  \ Windows 域**的一部分，以便进行集中管理和监控。\n\n## 示例 IDMZ 代理服务解决方案\n\n在以下各节中，我们将研究四种特定的 IDMZ\
  \ 代理服务解决方案。我们将讨论它们的企业、IDMZ 和工业组件，了解它们是如何结合在一起的，并简要提及正确的安装和配置。\n\n### 对工业控制系统应用程序和设备的远程访问\n\
  \n我们将讨论的第一个——也可能是最常见的——代理服务场景是对工业网络的远程交互式访问。迄今为止，我完成的每一个 IDMZ 实施都将远程交互式访问解决方案作为设计的一部分。\n\
  \n远程访问解决方案用于允许企业**虚拟专用网络**（VPN）用户或供应商远程、安全地访问工业网络上的资源。\n\n#### 设计\n\nIDMZ 远程访问代理服务解决方案的设计围绕微软的\
  \ RDP 构建。RDP 是微软专有协议，它使用户能够通过网络连接与另一台计算机建立远程交互式会话。用户为此使用某种形式的**RDP 客户端**软件，而被连接的另一端必须运行**RDP\
  \ 服务器**软件。另一个组件，即 RDP-GW 服务器，可用于代理连接，允许连接安全地穿越 DMZ。\n\n下图显示了 RDP-GW 解决方案的高级架构：\n\
  \n在工业区方面，我们需要实施以下配置来支持此代理服务解决方案：\n\n- 允许对工业区中将作为目标的服务器和计算机进行 RDP 访问。\n\n在设计和配置此代理服务解决方案时，应考虑以下设计和安全注意事项：\n\
  \n- 企业用户应使用**多因素身份验证（MFA）** 登录企业系统，或使用将其连接到企业网络（通过 VPN 或 Citrix）的远程访问解决方案。\n- 可以在\
  \ RDP-GW 凭据检查中添加额外的 MFA 控制。\n- 远程访问/桌面用户应为其企业系统和对目标工业资源的访问使用一套单独的凭据。\n- 为了实现高可用性和冗余，可以安装辅助\
  \ RDP-GW 服务器，以便在出现问题时进行故障转移。\n- 防火墙规则应尽可能严格。从允许最低限度开始。\n- 可以通过企业 AD 分发 SSL 证书，以允许所有或一组企业计算机接收证书。\n\
  \n## 来自工业网络的受控互联网访问\n\n我们将讨论的第二个 IDMZ 代理服务解决方案描述了一种允许从工业区访问互联网的方法。尽管更安全的选择是禁止来自工业资产的任何类型的互联网访问，但现实情况是，可能有系统需要获取许可证密钥和供应商/产品特定的更新，或者出于其他原因需要互联网访问，例如能够检索产品手册、帮助页面或某种帮助文件。此外，越来越多的自动化和控制供应商正在提供需要在使用期间**自动上报**的**智能设备**。本节解释的解决方案为允许这些设备自动上报提供了一种安全的方法，从而防止供应商在您的电气柜中安装蜂窝调制解调器。\n\
  \n为了能够限制哪些系统可以访问互联网，并允许这些列入白名单的系统控制它们可以检索哪些 URL，可以在 IDMZ 中安装一个正向代理作为代理服务。\n\n####\
  \ 设计\n\n这种 IDMZ 代理服务场景允许对源自工业区并指向互联网的网络流量进行设备和 URL 过滤，该场景围绕 Squid 代理服务器（http://www.squid-cache.org/）构建，该服务器作为服务安装在\
  \ IDMZ 中部署的、运行 CentOS Linux 操作系统（https://www.centos.org/）的虚拟机上。\n\n该代理服务场景如下图所示：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_103_0.png)\n\n**图 3.9 – 受控互联网访问 IDMZ\
  \ 代理服务场景**\n\n\n\n\n\n通过此设置，需要访问互联网的工业服务器/客户端/工作站或其他设备，其代理配置将被定义为指向 IDMZ Squid 代理服务。Squid\
  \ 服务使用 **访问控制列表 (ACLs)** 来将系统列入白名单或黑名单以访问互联网，并采用类似的方法来允许或阻止访问互联网上的 URL 或 IP 地址。除允许围绕工业系统和\
  \ URL 创建 ACL 以将互联网访问列入白名单/黑名单外，前向 Web 代理代理服务还会将客户端隐藏在 Web 服务器之外，增加了一层保护。\n\nSquid\
  \ 设置的详细描述超出了本书的范围，但简单的网络搜索将得到大量关于该主题的教程和“如何操作”。\n\n#### 配置\n\n在企业区，我们需要实施以下配置以支持此代理服务解决方案：\n\
  \n- 企业区系统的配置取决于具体情况。通常，由于 Squid 在企业侧通过 HTTP(S) 通信，系统无需（重新）配置。然而，防火墙、企业 DMZ 或其他系统中的\
  \ ACL 可能需要允许 Squid 与这些系统通信或通过这些系统通信。\n\nIDMZ 防火墙使用以下配置来支持此代理服务解决方案：\n\n- 添加一条防火墙规则，允许一组\
  \ **工业** IP 地址通过端口 3128（Squid 代理服务端口）访问 **IDMZ** Squid 服务器。\n- 添加一条防火墙规则，允许 **IDMZ**\
  \ Squid 服务器通过工业系统需要访问企业/互联网 Web 访问的任何服务/端口访问一组 **企业** IP 地址。这些可以是企业 Web 服务器/服务的\
  \ IP 地址/范围/子网或互联网上的 Web 服务器的 IP 地址/范围/子网。\n\nIDMZ 交换机使用以下配置来支持此代理服务解决方案：\n\n- 为\
  \ Squid 服务器创建一个专用 VLAN，并在与 IDMZ 防火墙的链路上创建相应的子接口。\n\nIDMZ 代理服务/服务器使用以下配置来支持此代理服务解决方案：\n\
  \n- 创建一个专用 vSwitch，对应于在 IDMZ 交换机上创建的 VLAN。\n- 在 IDMZ 中的 CentOS VM 上安装并配置 Squid 服务。\n\
  - 在 CentOS 机器上，向 `/etc/squid/squid.conf` 添加 ACL 以允许工业系统/子网访问互联网。以下代码片段为此提供示例：\n\n\
  ```\nacl localhost src 127.0.0.1/32\nacl IndustrialClient src 192.168.0.107\n...\n\
  http_access allow IndustrialClient\nhttp_access allow localhost\n```\n\n- 在 CentOS\
  \ 机器上，创建 `/etc/squid/allowed_domains` URL/域名白名单并添加你希望允许访问的 URL 或域名。以下代码片段为此提供示例：\n\
  \n```\n.microsoft.com\nhttps://rockwellautomation.custhelp.com/\n...\n```\n\n- 在\
  \ CentOS 机器上，向 `/etc/squid/squid.conf` 添加 ACL 以允许访问白名单的 URL/域名。以下代码片段为此提供示例：\n\n\
  ```\nacl allowed_domains dstdomain \"/etc/squid/allowed_domains\"\n...\nhttp_access\
  \ allow IndustrialClient allowed_domains\n```\n\n在工业区，我们需要实施以下配置以支持此代理服务解决方案：\n\n\
  - 任何需要访问互联网/企业 URL 的系统或设备都需要配置代理设置，使其指向 Squid IDMZ 服务，如下所示：\n\n```\n<squid-server-ip>:3128\n\
  ```\n\n设计和配置此代理服务解决方案时应考虑以下设计和安全注意事项：\n\n- 对于你希望授予互联网访问权限的工业系统和设备，以及你希望允许访问的 URL/域名，均坚持采用白名单方法。\n\
  \n通过此设置，企业客户端、服务器或其他系统可以通过配置为反向 Web 代理代理服务的 nginx Web 服务器访问工业基于 Web 的资源。反向 Web 代理代理服务会将服务器隐藏在客户端之外，以保护工业基于\
  \ Web 的资源。\n\n#### 配置\n\n在企业区，我们需要实施以下配置以支持此代理服务解决方案：\n\n企业区无需特殊配置。反向 Web 代理将表现为一个\
  \ URL/Web 页面，允许企业用户通过 URL 访问工业服务。例如，`http://comp-xyz-rev-prx/ind-core` 将允许通过企业暴露的\
  \ `comp-xyz-prx` Web 服务器访问工业核心交换机的 Web 界面。\n\nIDMZ 防火墙使用以下配置来支持此代理服务解决方案：\n\n- 添加一条防火墙规则，允许（一组）**企业**\
  \ IP 地址通过端口 `443`（SSL）和/或端口 `80`（HTTP）访问 **IDMZ** 反向 Web 代理服务器。\n- 添加一条防火墙规则，允许\
  \ **IDMZ** 反向 Web 代理服务器通过端口 `443`（SSL）和/或端口 `80`（HTTP）访问一组 **工业** IP 地址。\n\nIDMZ\
  \ 交换机使用以下配置来支持此代理服务解决方案：\n\n- 为 nginx 服务器创建一个专用 VLAN，并在与 IDMZ 防火墙的链路上创建相应的子接口。\n\
  \nIDMZ 代理服务/服务器使用以下配置来支持此代理服务解决方案：\n\n- 创建一个专用 vSwitch，对应于在 IDMZ 交换机上创建的 VLAN。\n\
  - 在 IDMZ 中的 CentOS VM 上安装并配置 nginx 服务。例如，考虑以下配置片段，取自 IDMZ 中 CentOS VM 上的 `/etc/nginx/nginx.conf`。该片段显示了设置到工业核心交换机\
  \ Web 门户（`http://192.168.10.1`）的代理转发器的配置：\n\n```\n    ...\n    server {\n      \
  \  listen   80 default_server;\n        listen   [::]:80 default_server;\n     \
  \   server_name comp-xyz-rev-prx;\n        proxy_redirect     off;\n        proxy_set_header\
  \  X-Real-IP $remote_addr;\n        proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;\n\
  \        proxy_set_header  Host $http_host;\n        location /ind-core-switch {\n\
  \            proxy_pass http://192.168.10.1/;\n        }\n    }\n    ...\n```\n\n\
  在工业区，我们需要实施以下配置以支持此代理服务解决方案：\n\n- 工业网络上的目标系统无需 IDMZ 代理服务特定配置。（基于主机的防火墙可能需要配置以允许来自反向\
  \ Web 代理服务器的访问，或设备上的 ACL 需要更新以允许访问。）\n\n### 更新工业区的 Microsoft Windows 系统\n\n我们将要讨论的最后一个\
  \ IDMZ 代理服务解决方案是一种将 Microsoft Windows 更新引入工业环境的方法。补丁和更新是安全计划的关键方面，因此能够在工业区修补系统应位列你的愿望清单之首。\n\
  \n#### 设计\n\n本节介绍的 Microsoft Windows 更新代理服务解决方案基于 Microsoft 的 WSUS，该服务作为 IDMZ 中\
  \ Microsoft Windows Server 2019 VM 上的角色安装。这在以下图表中有所体现：\n\n![](img/c8ffa9959721097701584fcc95101362_109_0.png)\n\
  \n图 3.11 – Microsoft Windows 更新 IDMZ 代理服务场景\n\n通过此设置，工业 Microsoft Windows 客户端、服务器和工作站可以检查\
  \ IDMZ 中的 WSUS 服务器是否有新补丁和更新。IDMZ WSUS 可以配置为直接与 Microsoft 更新服务器检查新内容，或指向企业 WSUS 服务器。此外，还可以在生产区域内部添加下游服务器，以允许更新不在第\
  \ 3 级站点运营中的 Microsoft Windows 系统。\n\n#### 配置\n\n在企业区，我们需要实施以下配置以支持此代理服务解决方案：\n\n\
  - 如果使用企业 WSUS 服务器供 IDMZ WSUS 服务器从中拉取更新，则该服务器需要配置为拉取并存储工业网络上可能存在的任何 Microsoft 产品相关的更新。\n\
  \nIDMZ 防火墙使用以下配置来支持此代理服务解决方案：\n\n- 添加一条防火墙规则，允许工业 IP 地址通过端口 8530（HTTP）或端口 8531（HTTPS）访问\
  \ IDMZ WSUS 服务器以检查更新。\n- 添加一条防火墙规则，允许 IDMZ WSUS 服务器通过端口 8530（HTTP）或端口 8531（HTTPS）访问企业\
  \ WSUS 服务器 IP 地址，或通过端口 80（HTTP）或端口 443（HTTPS）访问互联网上的 Microsoft 更新服务器。\n\nIDMZ 交换机使用以下配置来支持此代理服务解决方案：\n\
  \n- 为 WSUS 服务器创建一个专用 VLAN，并在与 IDMZ 防火墙的链路上创建相应的子接口。\n\nIDMZ 代理服务/服务器使用以下配置来支持此代理服务解决方案：\n\
  \n- 创建一个专用 vSwitch，对应于在 IDMZ 交换机上创建的 VLAN。\n- 构建一个 Microsoft Windows Server 2016/2019\
  \ VM 并安装 WSUS 角色。\n- 配置 IDMZ WSUS 服务以与 Microsoft 更新服务器或企业上游 WSUS 服务器同步，并启用拉取工业环境中可能存在的任何相关\
  \ Microsoft 产品的补丁和更新。\n\n\n\n\n\n在工业区，我们需要实施以下配置以支持此代理服务解决方案：\n\n- 配置工业系统以开始从 IDMZ\
  \ WSUS 服务器拉取更新。这可以通过在每台计算机上手动使用 `gpedit.msc` 来完成，也可以通过设置相应的组策略对象来实现，如以下屏幕截图所示：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_111_0.png)\n\n图 3.12 – 局域网 Microsoft\
  \ 更新服务位置组策略对象\n\n在设计和配置此代理服务解决方案时，应考虑以下设计和安全注意事项：\n\n- 指定 WSUS 位置只是可用设置之一。请确保更新频率、范围和重启选项的选择也能最好地反映您的环境。\n\
  \n## 摘要\n\n在本章中，我们深入探讨了 IDMZ。我们了解了典型的 IDMZ 如何设置和配置；我们讨论了代理服务等基本概念；并看到了 IDMZ 如何随着时间的推移扩展以覆盖\
  \ ICS 环境的所有区域。最后，我们查看了一些典型的代理服务场景以及它们将如何体现为 IDMZ 实现。\n\n本章结束了本书的第一版回顾和更新部分。在下一章中，我们将开始讨论本第二版的主要主题：安全监控。我们将从围绕以安全为中心的\
  \ ICS 架构设计展开讨论开始这段安全监控之旅。\n"
- "# 4 以安全为中心设计 ICS 架构\n\n在上一章中，我们查看了 **工业隔离区 (IDMZ)** 以及其正确使用如何改善 **工业控制系统 (ICS)**\
  \ 环境的整体网络安全。在本章中，我们将退一步，查看整体架构设计决策以及它们如何改善整体网络安全态势。\n\n在本章中，我们将讨论与 ICS 架构设计相关的 *以安全为中心的设计*\
  \ 周围的关键概念、技术、工具和方法。我们将讨论 ICS 网络安全周围的基本网络安全原则，并讨论如何构建 ICS 环境，使其能够轻松实现安全技术、工具和概念。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- 典型的工业网络架构设计\n- 以安全为中心的设计\n- 安全监控\n\n## 典型的工业网络架构设计\n\n我们今天看到的工业网络架构并非凭空出现。它们随着时间的推移而演变，从独立设备或小型连接的专有设备集合演变而来，使用专有的通信媒体和专有协议进行通信。在我们查看如何设计安全之前，让我们先快速回顾一下自动化和控制的历史，看看事情是如何发展起来的。\n\
  \n### 从独立的自动化孤岛演变而来\n\n早在 20 世纪 60 年代末，**可编程逻辑控制器或 PLC** 开始取代用于运行控制和自动化流程的继电器、定时器和执行器机架时，它们也不过如此：对这些继电器、定时器和执行器机架的替代品。它们是这些控制装置的非常紧凑且复杂的替代品，允许所有者进行更改而无需重新布线半个工厂。第一批\
  \ PLC 也只占用了之前用于控制设备和布线的控制室空间的一小部分。\n\n第一批 PLC 实现也不过是独立的自动化孤岛和相关自动化设备组，专用于单个系统或系统的一部分，除完成自动化任务所需的必要连接外不与任何东西连接。这样的设置还需要专门且通常专有的\
  \ *编程终端* 才能连接到 PLC 并进行更改或故障排除流程。\n\n请看以下屏幕截图：\n\n![](img/c8ffa9959721097701584fcc95101362_114_0.png)\n\
  \n图 4.1 – Modicon 184：图片由 RepairZone.com 提供\n\n前面的屏幕截图显示了被认为是第一台 PLC 的 Modicon 184，于\
  \ 1973 年发布。\n\nPLC 的普及迅速增长，这些系统的供应商开始增加便利性，例如添加远程输入/输出 (I/O) 以允许在 PLC 背板以外的其他位置添加输入和输出；通常基于\
  \ Microsoft 操作系统的通用编程站；人机界面 (HMI)；以及执行 PLC 间通信以共享数据和命令的手段。为了能够提供这些新功能和功能，自动化公司开始开发自己的专用和专有通信协议和媒体，其中大多数基于某种形式的串行通信，但几乎所有都彼此不同。一些早期工业协议包括以下内容：\n\
  \n- Modbus\n- 互控中心通信协议 (ICCP)\n- 分布式网络协议 (DNP)\n- 通用工业协议 (CIP)\n\n由于这些专有通信协议最初是为短距离、点对点屏蔽通信而设计的，不打算离开本地网络设备，因此它们没有包含身份验证、授权和审计\
  \ (AAA) 或加密等安全措施。毕竟，为什么要在最初设计为仅允许两个设备之间通过一根线通信的通信上增加这种开销呢？而且只要情况就是这样，这种理念就一直有效；只要通信限制在没有来自自动化孤岛外部连接的一小部分设备内，一切都很好。然而，当这些早期协议开始用于多个设备之间的通信时，固有的\
  \ ICS 安全问题开始出现，这些设备分散在多个自动化孤岛中，甚至在工业安全边界之外，进入办公空间。尽管在某些情况下这些专有协议运行的媒体发生了变化以适应远程目的地和扩展距离，但协议本身以及命令和指令在端点之间发送的方式保持不变（以允许向后兼容和轻松过渡）。\n\
  \n快进到 20 世纪 90 年代初至中期，控制和自动化系统演变为复杂的相互连接的系统、设备和相关设备迷宫，通过专有通信媒体连接，并使用专有且固有不安全的工业通信协议进行通信。从\
  \ ICS 安全角度来看，一切都很好。即使控制和自动化设备之间的所有通信都通过开放的明文协议进行，容易被拦截、操纵和攻击，但能够——或愿意——进入工业通信网络的攻击者也非常少。攻击者必须在\
  \ ICS 所有者的设施内部，拥有正确的设备和正确的知识才能开始攻击设备和系统。\n\n与此同时，常规网络技术和 **信息技术 (IT)** 已发展到制造公司的业务部门现在完全融合到以太网技术上，并使用\
  \ **传输控制协议/互联网协议 (TCP/IP)** 堆栈。一些站点甚至不得不丢弃他们喋喋不休的集线器并用以太网交换机替换它们。到 20 世纪 90 年代末，从业务网络与\
  \ ICS 环境的角度来看，典型的制造工厂将类似于以下屏幕截图中描绘的网络架构：\n\n![](img/c8ffa9959721097701584fcc95101362_116_0.png)\n\
  \n图 4.2 – 20 世纪 90 年代末典型的 IT/OT 网络架构\n\n\n\n\n\n上述架构描绘了一种场景，其中**运营技术（OT）**设备与IT设备和系统构成了相互独立且互不相关的网络区段，且两个网络之间存在明显的物理隔离。这主要是因为这两个技术领域几乎没有重叠的技术领域。\n\
  \n从网络安全角度来看，这种架构非常理想。若要远程攻陷并攻击此配置，维护笔记本电脑必须被感染**远程访问木马（RAT）**，或者在连接ICS设备时通过其他方式可被远程访问。听起来像是完美的设置，对吧？然而，正如所有好事一样，这也结束了。图4.2所示架构最大的缺点在于技术的多样性。由于每个供应商都需要自己特定类型的通信介质和I/O模块，企业设施为保持安全库存所需的备件数量和种类随着拥有的ICS设备数量的增加而呈指数级增长。此外，支持所有这一切所需的技术知识也随之增长，这伴随着设备供应商种类的多样化。\n\
  \n雪上加霜的是，不仅每个供应商都实施了其专有的技术，而且，在每个供应商的产品系列中，情况也在发生变化。供应商可能会开始提供改进的、更好的或更新的技术；额外的功能；或任何其他说辞来促使你购买更多设备。这种需要以某种方式标准化疯狂的专有通信选项多样性的需求，加上对通信带宽日益增长的需求（以及提高和标准化易用性和可管理性），推动了工业通信领域对某种通用分母的需求。\n\
  \n由于各种ICS设备供应商不太可能就单一的命令与通信协议达成一致，因此选择了次优方案：一种在共享介质网络上传输其专有命令与通信协议的通用方式。可能是从等式中的IT一侧获得的灵感，以太网被选为任务目标。所选网络标准的可扩展性使得ICS设备供应商只需将协议封装在以太网帧中，即可轻松地将专有协议适配到以太网网络标准。此外，承载工业协议的以太网帧现在可以通过结合IP在（公共）网络上路由，并使用TCP来增加会话管理的可靠性。随着这一变化，对于不堪重负的工业支持/控制工程师来说，情况开始好转，他们现在只需要知道如何处理以太网和IP等常见网络技术。\n\
  \n由于部署容易、使用简便以及技术变更的高度可支持性，OT现在可以在一定程度上由多年来一直处理以太网和TCP/IP堆栈的大型IT专业人员社区提供支持。所有与OT相关的事物逐渐开始采用以太网和TCP/IP标准。当我我说“所有事物”时，我真的是指所有事物！PLC、HMI、I/O模块、编程工作站、执行器、传感器、状态显示板、阀组、信号灯……所有事物！由于这种向以太网和TCP/IP标准的激进转变，从ICS和商务网络的角度来看，在2000年代中期，典型的工厂看起来像这样：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_118_0.png)\n\n图4.3 – 2000年代中后期典型的IT/OT网络架构\n\
  \n那是一个多么美好的时代！每个工业系统、设备和组件都是相互连接的，同时仍与办公/商务网络的危险断开连接。因此，ICS网络上的任何事物都可以自由地与同一以太网上的其他所有内容通信，并且所有设备都可以从维护办公室或任何可以接入ICS网络的地方访问。\n\
  \n我必须承认，控制工程师仍然将工业网络演进的这个时期视为ICS网络的金黄色时代。生活很美好，风险相对较低。我记得在洛杉矶的屋顶上连接我们刚刚安装的全工业无线网络，对一条新生产线进行调试：多么自由；多么方便！但随后衰落就来了：我们走得太远了，没有真正意识到我们为自己打开了怎样的一罐虫。工程师们希望能够在工程工作站上访问商务电子邮件，以及访问ICS供应商网站以拉取更新或阅读技术文档；工厂经理要求坐在塔希提岛的沙滩上时，能在平板电脑上获取最新的即时生产统计数据和绩效数字；而工厂控制器、质量人员以及六西格玛黑带员工希望从工厂生产系统中获取正常运行时间数据、生产数量、细节、停机原因等**设备综合效率（OEE）**数据以及其他数据。自动化和控制供应商已将所有这些数据生成功能添加到其启用IP的设备中，并且随时准备通过获取者使用的所有这些数据的相同线路和技术被获取。\n\
  \n那么，最自然的事情是什么？好吧，只是将两个独立的网络连接起来，对吧？为什么不呢——它们都使用以太网网络标准，并可以通过TCP/IP协议相互通信，还有什么比这更方便的？于是，发生了以下情况：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_120_0.png)\n\n图4.4 – “双宿网络”商务到工业网络交叉连接解决方案\n\
  \n某些系统专门用于双宿计算机，连接到商务网络和工业网络以弥补这一差距。一方面，它们可以与工业设备通信以收集数据，可用于编程或排除自动化和控制设备的故障，并可以作为网关访问仅工业设备共享的文件和数据。\n\
  \n另一方面，这些双宿系统能够向生产线的员工提供电子邮件和互联网访问等商务功能，或者允许商务用户生成报告、查看统计或以其他方式从生产线获取生产数据。\n\n双宿场景仍然保持商务和工业网络之间的一些分离，但通常两者之间的连接以限制较少的方式实现，如下面的截图所示：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_121_0.png)\n\n图4.5 – “平坦网络”商务到工业网络交叉连接解决方案\n\
  \n这基本上创建了一个完全平坦的网络，以某种方式不分离商务网络流量和工业流量。\n\n我们大多数控制工程师都曾犯过错误，实施了上述两种“黑客”方法之一，以满足从生产网络拉取数据并向生产线工作人员提供商务功能的需求。我知道我就是这样做的。但在恢复理智之后（或遭受网络攻击/入侵之后），我们开始与IT部门沟通，并提出了以下解决方案架构，以实现商务和工业网络之间的交叉连通性：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_122_0.png)\n\n这是一个相当稳固的解决方案，似乎涵盖了我们追求的所有功能和安全要求，或者至少在纸面上看起来是这样。现实是，随着时间的推移，中间那个防火墙的配置将被戳出与瑞士奶酪同样多的洞，这意味着随着时间的推移，越来越多的协议和功能将被允许通过防火墙。因此，不久之后，该防火墙配置将看起来像这样：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_123_0.png)\n\n图4.7 – 瑞士奶酪防火墙配置\n\n这引发了一个问题，在所有这些防火墙例外情况下：它仍然是一个防火墙，还是我们只是构建了一个华丽化的路由器？一系列防火墙例外允许从企业网络到工业网络以及反方向的无限制访问，因此工业协议（本质上不考虑安全性）从ICS网络泄漏到商务网络。\n\
  \n在此时，攻击者无需在生产设施现场即可攻击ICS环境。在商务网络和工业网络之间无限制且不受控的连接下，攻击者只需要在商务网络中建立一个立足点即可开始攻击工业网络。防火墙保护的商务到工业网络交叉连接架构也铺设了路径，使得针对ICS环境的枢轴攻击最近上了头条新闻。在枢轴攻击中，攻击者通过例如向该公司个人发送包含恶意软件或某种利用载荷在邮件正文中的钓鱼邮件，攻陷工业组织的企业端。\n\
  \n\n\n\n一旦收件人打开电子邮件，或点击邮件中的恶意链接，攻击背后的漏洞利用代码就会从世界任何地方与该用户的计算机建立远程连接。这种远程访问连接使攻击者能够利用受害者的企业计算机扫描企业网络，寻找可让他们将攻击转向\
  \ ICS 网络的系统。在存在瑞士奶酪式防火墙的情况下，要找到可借以转移攻击的漏洞，可能只需扫描正确的协议。\n\n既然我们已经阐明了如果不在设计早期加入安全性可能导致的后果，接下来让我们讨论“为安全而设计”是什么样子。\n\
  \n## 为安全而设计\n\n在上一节中，我们看到了工业网络架构以及某些设计决策所带来的（固有）不安全因素是如何随着时间演变的。我并不是想把所有 ICS 所有者一概而论，但根据我的经验，他们中的大多数都会以某种形式采用“瑞士奶酪式”架构。我曾与一些实施了远为安全的架构的公司合作，也见过一些安全程度低得多的公司，但通常你在现实中看到的就是这种情况。\n\
  \n在本节中，我们将探讨围绕设计一种以安全为重点、富有韧性的工业网络架构的适当流程和方法；这种架构从最初就把网络安全作为基础设计目标，并允许我们在未来进一步扩展网络安全工作。\n\
  \n### 将安全纳入考量的网络架构\n\n我通常把工业网络安全的设计和实施解释为一个过程：保护 ICS 最重要的资产免受 ICS 使用者带来的危险和风险影响，同时让这些使用者能够尽可能不受阻碍地履行其在生产过程中的职责。换句话说，我们希望创建一个\
  \ ICS 环境，能够将我们最宝贵的资产（ICS 中直接运行生产流程的部分）与与之交互的人员和系统进行物理分离，并且只允许某些交互以我们可以监视、控制、检查和验证的方式进行。\n\
  \n接下来是我关于安全 ICS 网络架构设计的建议，以实现前文所述的保护我们最宝贵资产的目标。本节介绍的方法、技术、投入以及设计决策来自二十年来构建工业网络中的反复摸索，也来自参与制定行业建议的团队，以及为全球一些最大的制造和服务公司提供咨询所获得的实践经验。如果你让我来构建你的网络，我会这样做。\n\
  \n### 第 1 步 – ICS 网络的分段\n\n从根本上说，保护 ICS 网络可以非常简单。如果我们做好功课，对 ICS 环境进行适当分段，只让对 ICS\
  \ 运行至关重要的系统和设备驻留在工业网络上，而其他一切都放在企业网络上，那么我们就无需为手机、笔记本电脑等外来设备，或无线设备及自带设备（BYOD）而烦恼。换句话说，安全\
  \ ICS 架构设计的第一个基石，就是适当的分段。适当的分段需要决定 ICS 的各个部分将驻留在哪里，同时牢记这些部分对整个生产流程的影响，以及它们给整体网络安全态势带来的风险。\n\
  \n通过分段，我们定义了 ICS 网络中的一个区域，该区域专用于保持生产流程运行所必需的关键设备。我们将此区域称为“工业区”。分段通过将 ICS 最敏感的部分及其使用者物理连接到不同的网络硬件，在二者之间建立了安全屏障。\n\
  \n### 工业区网段与微分段\n\n工业网络应进一步细分为更小的隔离区（enclave），即按功能、逻辑或地理位置对相关 ICS 设备进行分组的网络子网。这一过程称为微分段，它允许紧密相关的\
  \ ICS 系统、设备和组件在不受限制的情况下通信（在同一交换机/虚拟局域网（VLAN）上以二层速度通信），而与其他隔离区或安全区域的通信则可通过交换机/路由器访问控制列表（ACL）和/或防火墙规则进行检查、控制和验证。微分段可以通过物理上独立的硬件（独立交换机）或使用\
  \ VLAN 技术来实现。\n\n正确分段 ICS 网络的结果是显著减小攻击面。即使有恶意实体进入工业区，也会被限制在某个隔离区内。适当分段的另一个好处是提高整体网络性能。分段最大限度地减少了网络广播域，其效果是\
  \ ICS 设备花费更少的时间来侦听和响应来自无关或不相关设备的流量。\n\n此外，通过网络分段，我们可以创建所谓的网络流量咽喉点（choke points），即在网络设计中指定的位置，可以轻松高效地捕获有价值的网络流量。本章后面的“网络咽喉点”一节将更详细地讨论咽喉点。\n\
  \n以下截图展示了在我们应用适当的分段和微分段后，ICS 网络架构的外观：\n\n### 工业区\n\n![](img/c8ffa9959721097701584fcc95101362_126_0.png)\n\
  \n图 4.8 – 分段式工业网络架构\n\n在这种分段式架构中，我们将所有相关的 ICS 设备放在各自的功能区域和网络子网（隔离区）中。这既有利于安全，也有利于性能（同一隔离区中的设备通过**隔离区交换机**以二层速度通信）。**OT\
  \ 防火墙**允许功能区域（隔离区）与**第 3 级 - 站点运行**之间进行受控且可监控的通信。**第 3 级 - 站点运行**隔离区是一个指定的安全区域，用于与较低层级隔离区之间以及与\
  \ ICS 环境更高层级（通过 IDMZ 连接第 4 级和第 5 级）之间的往来通信。**第 3 级 - 站点运行**应始终作为访问第 2 级及以下 ICS 设备的中介（遵循普渡模型），以防止越级/绕过安全边界。通常，**第\
  \ 3 级 - 站点运行**由一台或一组服务器（物理或虚拟）组成，可用于与较低层级的 ICS 设备交互，例如对控制和自动化设备进行编程或故障排除，以及收集生产数据。\n\
  \n### 第 2 步 – 定义并控制安全区域之间的安全交互\n\n现在，我们已经把最宝贵的资产妥善地保护在各自专用的子网上，与庞大而不安全的企业网络实现了物理隔离；在安全设计\
  \ ICS 环境的过程中，第二步就是要处理对这些关键任务资产的必要访问。\n\n我想大家都同意，如果我们可以让 ICS 与组织的其他部分完全隔离运行，我们最终会得到一个安全得多的环境。不幸的是，实际情况恰恰相反。当前工业领域的趋势是与\
  \ ICS 设备进行越来越多的交互。组织已经发现了从生产环境获取实时、最新、即时数据的价值。这些数据让他们能够运营更精益、更高效、更有利可图的企业。工业 4.0、互联企业、基于云的分析等趋势，正对工业网络与企业网络之间的互联互通提出越来越高的要求。\n\
  \n\n\n那么，我们如何以安全的方式提供所需的跨区域连接呢？要回答这个问题，我们应该看看 IT 人员多年来是如何处理类似场景的。在 IT 领域，通常存在让互联网用户访问内部业务系统（如\
  \ Web 服务器、数据库服务器或**域名系统 (DNS)** 服务器）的需求。为了安全地提供此类访问，IT 专业人员会实施所谓的**非军事区**，即 **DMZ**。DMZ\
  \ 是在两个防火墙或防火墙接口之间创建的一个缓冲区，允许在两个安全级别之间安全地托管服务器、暴露服务以及进行中介服务。\n\n从企业角度来看，互联网被认为是不安全的或**不安全**区域，而企业区域则是更安全的或**安全**区域。以下截图展示了围绕三臂防火墙设计实现的\
  \ IT DMZ 示意图：\n\n![](img/c8ffa9959721097701584fcc95101362_128_0.png)\n\n图 4.9 –\
  \ IT DMZ\n\n其理念是，互联网与内部网络之间的任何交互都会通过 DMZ 进行，借助专门的“中介服务”，即代表两个通信方进行交互的服务器/服务。此时，如果互联网上的某个实体破坏了暴露的服务，该破坏将被限制在\
  \ DMZ 内部，而内部网络的终端则在防火墙第二道防线的保护下保持安全。\n\n这种设计在允许互联网访问企业资源方面运行良好，因此，与其重新造轮子，我们将把这种\
  \ DMZ 方法部署到工业环境中，并恰当地称之为 IDMZ。\n\n### IDMZ\n\n**工业非军事区**或 **IDMZ** 的原理与其 IT 变体相同，只是重新定义了安全和不安全区域。从工业区域的角度来看，企业区域被认为是一个**不安全**区域，而工业区域则被认为是一个**安全**区域。\n\
  \nIDMZ 有时被称为*外围网络*，它是一个位于两个安全区域之间的子网络（subnet），代表任一安全区域进行请求中介。请求中介意味着任一安全区域仅与 IDMZ\
  \ 中的服务通信，而 IDMZ 服务则代表请求方服务/服务器/用户对该通信进行调解或转换。具备此功能后，如果服务器遭到破坏，破坏将被限制在 IDMZ 内部。对于每种所需的跨区域交互，都应设计并实现相应的中介服务。\n\
  \n以下截图展示了在实施 IDMZ 以允许跨区域边界通信后，我们的 ICS 网络架构将呈现的样子：\n\n![](img/c8ffa9959721097701584fcc95101362_130_0.png)\n\
  \n图 4.10 – 安全 ICS 网络架构设计\n\n此时，我们的架构设计通过使用网络隔离技术和使用飞地（enclaves）对工业网络进行微分段，有效地将我们最有价值的工业系统、设备和装置与外部风险隔离开来。我们还设置了\
  \ IDMZ，它将使我们能够实施中介服务，以促进任何所需的跨区域交互和通信。\n\n关于 IDMZ 更详细的讨论，请参阅*第 3 章，工业非军事区*。\n\n\
  本章并非旨在提供设计 ICS 网络的逐步操作指南，而是作为一种思考素材，帮助你做出正确的设计决策。本章中简要提及的几项内容在实际生活中需要大量的资源、准备工作和努力才能实施。设计安全并不是一个容易做对的概念，可能需要一些试错才能完全理解。然而，在设计你的\
  \ ICS 网络时，只要牢记以下两个简单的设计目标，你就会取得很大的进展：\n\n- 通过将 ICS 网络分割为安全区域，并将工业安全区域微分段为功能区域（飞地），保护你最宝贵的资产\n\
  - 通过正确使用设计良好的 IDMZ，控制所有进出工业区域的访问\n\n这涵盖了我们讨论的物理架构设计部分。接下来，我们将研究一种添加软件解决方案的方法，使我们能够使用旨在**安全监控**的工具、技术和活动来检查、验证和监控我们设计的安全性。\n\
  \n## 安全监控\n\n既然我们已经彻底讨论了网络架构，现在是时候看看如何处理我认为提高 ICS 安全态势的第二有效方法：安全监控。\n\n安全监控包括验证安全计划有效性所涉及的所有工具、技术、活动和行动。安全监控包括日志监控、配置验证、告警可视化、被动和主动网络扫描/映射、漏洞管理、**入侵检测系统\
  \ (IDS)**、**安全信息和事件管理 (SIEM)** 等主题。\n\n安全监控的诸多方面是本书的主要主题，并将在其余章节中深入解释。接下来的讨论将介绍我们在前面章节中涵盖的*面向安全的设计*架构如何用于设置工具和系统，以便为\
  \ ICS 环境实施安全监控。\n\n## 网络扼制点\n\n如前所述，网络扼制点是网络中指定的点，选择在高效收集在安全区域之间或其他网络有趣部分流动的数据包的位置。能够收集有趣的数据包不仅有助于故障排除网络（性能相关）问题，而且通常是工业专用安全工具的要求，例如\
  \ **Clarity 的持续威胁检测 (CTD)**（[https://claroty.com/continuous-threat-detection/](https://claroty.com/continuous-threat-detection/)）或\
  \ **Forescout 的 SilentDefense**（[https://www.forescout.com/platform/silentdefense/](https://www.forescout.com/platform/silentdefense/)），现在称为\
  \ eyeInspec。\n\n这些工具依赖通过数据包捕获功能被动（嗅探）监控 ICS 网络流量。由于它们被动地工作（这在 ICS 网络上是绝对首选的），这些工具的效果仅取决于我们提供给它们的数据包。\n\
  \n在我们本章定义的安全网络架构中，设计中的以下部分非常适合设置网络数据包捕获。\n\n### 在飞地级捕获网络数据包\n\n从架构的底部开始，我们可以通过在飞地交换机上设置**端口镜像分析器\
  \ (SPAN)** 端口，捕获 2 层及以下级别上 IP 启用设备之间的任何流量和通信。\n\n该过程在下图中说明：\n\n![](img/c8ffa9959721097701584fcc95101362_133_0.png)\n\
  \n图 4.11 – 飞地级数据包捕获\n\n**SPAN 端口**是管理式交换机的一项功能，它指示交换机将来自网络中定义的一组交换机接口或整个 VLAN 的流量复制到交换机上专用的\
  \ **SPAN 端口**。SPAN 端口功能在不同交换机制造商之间实现方式不同，有时也称为**镜像 (MIRROR) 端口**。\n\n以下是一个示例配置，它在千兆以太网端口\
  \ 1/0/2 上设置了一个 SPAN 端口，复制所有流经千兆以太网端口 1/0/2 的流量。此处的配置片段取自 Cisco 交换机：\n\n```\nEnclaveSwitch\
  \ (config)# no monitor session 1\nEnclaveSwitch (config)# monitor session 1 source\
  \ interface gigabitEthernet1/0/1\n```\n\n```\nEnclaveSwitch (config)# monitor session\
  \ 1 destination interface gigabitEthernet1/0/2 encapsulation replicate  \nEnclaveSwitch\
  \ (config)# end\n```\n\n这涵盖了飞地内部的数据包捕获。接下来，我们将讨论跨飞地的数据包捕获。\n\n## 跨飞地网络数据包捕获\n\n\
  为了能够在飞地之间的通信（但不包括 3 层 - 站点运营）上执行网络数据包捕获或流量检查，将使用 OT-防火墙。\n\n该过程在下图中说明：\n\n![](img/c8ffa9959721097701584fcc95101362_134_0.png)\n\
  \n\n\n\n\n根据设备品牌和型号，防火墙可以设置一个 SPAN 端口，或本身作为网络（元）数据采集器运行，并通过 Syslog 或某种 SIEM 专有协议将汇总日志发送到\
  \ SIEM 解决方案。\n\n这涵盖了在不同安全区域之间的报文捕获。接下来，我们将讨论对位于第 3 级 – 现场运营的服务的进出报文捕获。\n\n## 第 3\
  \ 级 – 现场运营网络报文捕获\n\n为了能够收集进出第 3 级 – 现场运营的网络流量，或对该安全区域内系统之间通信进行报文捕获，我们利用工业核心交换机上的\
  \ SPAN 端口功能。\n\n该过程在以下屏幕截图中进行了说明：\n\n![](img/c8ffa9959721097701584fcc95101362_135_0.png)\n\
  \n图 4.13 – 第 3 级 - 现场运营报文捕获\n\n工业核心交换机是报文捕获的非常宝贵的资源。如前面的屏幕截图所示，它连接着所有工业安全区域和第 3\
  \ 级现场的运营服务器，甚至位于工业网络与 ICS 环境更高层级之间所有流量的路径上。你会发现自己在许多安全相关任务和工具中都依赖工业核心交换机。\n\n这涵盖了对第\
  \ 3 级现场运营的进出报文捕获。接下来，我们将讨论 IDMZ 内的报文捕获。\n\n## IDMZ 网络报文捕获\n\n在 ICS 网络架构的 IDMZ 层级，我们有兴趣监控从企业区域进入\
  \ IDMZ 服务的流量、IDMZ 服务之间的流量，以及 IDMZ 服务器尝试访问其不应访问的位置的尝试（横向移动尝试）。由于 IDMZ 托管着潜在的替罪羊服务——即设计为被攻破并遏制攻破——因此必须密切关注服务器及其进出的网络连接。此外，能够监控和观察\
  \ IDMZ 服务的行为有助于排查任何网络或性能问题。\n\n我们可以使用 IDMZ 防火墙创建 SPAN 端口，或让防火墙收集穿越 IDMZ 的网络流量的（元）数据。此外，我们还可以在\
  \ IDMZ 交换机上创建 SPAN 端口，以捕获在 IDMZ 服务器与 IDMZ 防火墙之间传输的任何相关数据包。\n\n该过程在以下屏幕截图中进行了说明：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_136_0.png)\n\n图 4.14 – IDMZ 报文捕获\n\n\
  一旦我们在各种设备上设置了 SPAN 端口会话，我们应该使用专用的网络交换机来汇总所有 SPAN 端口并将其馈送到我们的安全工具中。专门分配网络设备来执行此操作可确保对\
  \ ICS 网络的性能损耗最小（与在 ICS 网络上使用专用 VLAN 相比），并形成一道安全屏障。\n\n## 日志记录和告警\n\n除了适当的报文捕获外，ICS\
  \ 环境中的所有设备都应配置为生成事件、日志和告警，并且应使用 SIEM 解决方案来聚合和关联所有这些事件、日志和告警，即事件转发。设置事件转发、部署 SIEM\
  \ 以及可视化所有这些数据将在后续章节中介绍。\n\n### 总结\n\n在本章中，我们讨论了 **设计安全** 所包含的内容。我们还讨论了如何在 ICS 环境中应用这一概念，将会得到一个定义明确、可防御且可扩展的整体\
  \ ICS 网络架构设计。我们看到这样的网络设计将使我们能够轻松扩展和增强我们的安全功能和控制措施，目标是最终实现 **安全监控**。\n\n在下一章中，我们将更详细地讨论安全监控。\n"
