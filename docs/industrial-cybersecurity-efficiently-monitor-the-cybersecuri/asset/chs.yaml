  \ dll 已注册为 `ipntt` 服务。\n\n综上所述，基于主机的工件搜索显示，三台系统上存在恶意 dll，这与它们的 MSInfo32 报告一致。重点关注系统如下：\n\
  \n+   -   HMI-1\n+   -   HMI-2\n+   -   **Ind-DC-2**\n\n有趣的是，恶意软件在这三台系统上的安装位置各不相同。也许恶意软件会以某种方式随机化安装位置。更有趣的是新发现的系统\
  \ **Ind-DC-2**；这是该系统第一次出现。我们之前还没有遇到过这台系统；该系统上的恶意软件似乎没有连接到 C&C，或者可能在以某种方式隐藏或掩盖其活动。通常，此时我们会切换到**事件响应（IR）**和取证活动。威胁狩猎团队会将可疑系统列表交给\
  \ IR 团队，并结束本次威胁狩猎工作。\n\n### 总结\n\n在本章中，我们经历了证明或反驳假设 *存在恶意行为者（试图）向外部 IP/域名发送信标* 的过程。我们看到了如何通过结合数据、工具、技术和活动，不仅证明了我们的假设，还发现了环境中受破坏的系统。本章是三个假设中的第一个，这些假设结合起来，构成了清理或验证新建或长期被忽视的工业网络环境部分的有效策略。\n\
