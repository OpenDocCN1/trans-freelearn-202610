- '# 第 1 节：

  ICS 网络安全基础


  在第一部分中，我们将简要回顾本书的第一版，以概述涵盖的内容，并指出仍然非常相关且将在第二版中进一步构建的内容。第一部分其余内容将专门讨论修订后的 IDMZ 架构，这是基于许多部署、现场经验、实践和反馈的结果。第一部分将以如何设计安全的深入讨论结束，这种架构允许轻松有效地实施书中其余部分讨论的所有工具、技术和活动。


  本节包括以下章节：


  - 第 1 章，引言与第一版回顾

  - 第 2 章，现代工业控制系统的架构

  - 第 3 章，工业非军事区

  - 第 4 章，以安全为考量设计 ICS 架构

