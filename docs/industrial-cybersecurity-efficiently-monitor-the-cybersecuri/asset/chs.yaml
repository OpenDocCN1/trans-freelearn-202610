- "# 9 可视化、关联与告警\n\n在本书第二部分*《网络安全监控》*的最后一章中，我们将结合前几章的所有活动，创建一个整体性的网络安全监控视图。\n\n我们首先讨论整体性网络安全监控视图包含哪些内容。然后，我们将通过加入自定义的可视化、关联和告警功能，为我们的网络安全数据收集工具集做最后的完善。正是可视化、关联和告警功能，使我们实施的安全监控方案更加易用，并允许我们根据特定需求和环境定制方案，从而确保不留死角。\n\
  \n最后，我们将创建一个交互式仪表板，以此结束本章以及第 2 部分*《网络安全监控》*。该仪表板围绕广受欢迎的 **ELK**（**Elasticsearch、Kibana、Logstash**\
  \ 的缩写）技术栈构建，使环境中所有与网络安全相关的事物都能在单页概览中呈现，旨在创建一个组合式的一站式概览界面，以轻松便捷地发现恶意活动。\n\n- **SilentDefense\
  \ 系统日志协议（syslog）配置：**\n  - https://github.com/SackOfHacks/Industrial-Cybersecurity-2nd-Edition/blob/main/security-onion-logstash/syslog\n\
  - **Oinkcode：** https://snort.org/\n\n## 整体性网络安全监控\n\n**整体性（Holistic）**被*《剑桥英语词典》*定义为“*从整体上处理或对待某事物或某人，而不仅仅是一部分*”。就网络安全监控而言，这意味着我们应该不留死角、不遗漏任何日志、不忽视任何系统。在本章中，我们将看到，通过组合多种安全监控工具（每种工具都专注于监控环境的某个方面），我们可以形成对当前网络安全态势的整体视图。\n\
  \n通常，实施整体性网络安全监控方案需要组合多种解决方案或设备，并将其分布到待监控的网络或环境中。就本书而言，我们将使用一个涵盖这些安全监控应用各类别开源实现的单一解决方案——即\
  \ Security Onion。我们将扩展 Security Onion 的功能，使其覆盖多种安全监控方面，并将监控范围扩展到以下关注领域：\n\n- 我们希望能够监控与网络流量相关的数据和痕迹，例如连接数据、协议使用、**域名系统（DNS）**查询、流量分析等。\n\
  - 我们希望能够监控网络流量，以查找已知的**失陷指标（IOC）**或恶意行为，如协议滥用或攻击模式，从而发现入侵。\n- 我们希望能够监控端点的健康和安全状态，包括配置变更、性能统计、恶意代码或活动检测等。\n\
  \n通过结合这些不同的安全监控领域，我们实际上可以为整个环境创建整体性的安全监控覆盖。\n\n接下来的章节将详细介绍这些主要的安全监控领域。\n\n## 网络流量监控\n\
  \n网络流量监控使我们可以为网络中连接和连接尝试的（元）数据建立索引。网络连接是计算机网络中两个端点之间的数据共享。我们希望记录的连接相关信息包括以下内容：\n\
  \n- 连接所涉及的端点\n- 连接中使用的**网际协议（IP）**地址和端口号\n- 连接所使用的网络协议（**传输控制协议（TCP）**、**用户数据报协议（UDP）**等）\n\
  - 传输的数据量\n- 传输的数据类型\n- 连接中的异常\n- 等等……\n\n尽管网络（元）数据不能让我们直接发现恶意活动，但掌握网络中发生的连接的这类详细信息，可以让我们定位可疑连接的具体情况，或找出通过其他手段（IDS、防火墙等）发现的恶意交互所涉及的其他系统。\n\
  \n### Zeek\n\nZeek 在*第 6 章“被动安全监控”*中有详细介绍，它是事实上的网络监控工具，能够捕获上一节所述的所有要求，甚至更多。Zeek\
  \ 会持续跟踪网络连接的详细信息，以及这些连接中传输的数据和协议。除了支持主要的网络层协议（TCP、UDP、**互联网控制报文协议（ICMP）**等），Zeek\
  \ 还支持许多应用层协议，其中包括：\n\n- DNS\n- **动态主机配置协议（DHCP）**\n- **文件传输协议（FTP）**\n- **远程过程调用（RPC）**\n\
  - **超文本传输协议（HTTP）**\n- **互联网中继聊天（IRC）**\n- Kerberos\n- **网络时间协议（NTP）**\n- **远程桌面协议（RDP）**\n\
  - **会话发起协议（SIP）**\n- **安全外壳（SSH）**\n- Syslog\n\n以下是 Zeek 支持的一些常见工业网络协议：\n\n- Modbus\n\
  - **分布式网络协议 3（DNP3）**\n\nZeek 还可以提取（剥离）网络连接中发现的文件，使我们能够对这些文件进行取证检查，以确定它们是否恶意或有害。此外，Zeek\
  \ 会查找协议使用中的异常，对连接执行诊断，并观察和记录网络连接的其他具体信息。\n\n我们在*第 6 章“被动安全监控”*中将 Zeek 作为 Security\
  \ Onion **虚拟机（VM）**的一部分进行了安装，并将在本书*第 3 部分*“*威胁狩猎*”中大量使用该工具。\n\n## 网络入侵监控\n\n网络入侵监控使我们能够发现网络中传输的恶意内容或活动。这种检测可以基于已知痕迹（基于签名的检测），也可以基于异常检测（异常是指偏离已建立的正常状态——基线）。网络入侵监控通常在网络边缘作为防火墙功能的一部分（**深度包检测（DPI）**能力）执行，或在内部网络使用**基于网络的入侵检测系统（NIDS）**或**基于网络的入侵防御系统（NIPS）**执行。\n\
  \n## 边缘 NIDS\n\n正如我们在*第 6 章“被动安全监控”*中讨论的，DPI 允许采用该技术的安全解决方案或设备更深入地查看数据包，以检查更高的网络层。通过检查**开放系统互连（OSI）**模型的这些更高层，我们便能够检查协议滥用、数据外泄到受监控网络之外，以及恶意内容传入受监控网络的行为。\n\
  \n在本章的*练习 3 – 为 pfSense 添加 Snort IDS*中，我们将部署一个边缘 NIDS。\n\n\n\n\n## 内部网络的 NIDS\n\n\
  正如我们希望在网络边缘监控恶意内容和活动一样，我们也需要密切关注内部网络。这里指的是工业网络的信息技术（IT）一侧，即第 3 层 – 站点运营。在这一部分的网络架构中添加网络入侵检测能力，使我们能够检测第\
  \ 3 层及以下系统之间的可疑或恶意活动，而这是边缘 NIDS 无法监控的区域。\n\n在第 6 章“被动安全监控”中，我们已经将带有 Snort 的第 3 层\
  \ NIDS 应用为我们构建的 Security Onion 虚拟机的一部分。\n\n## OT NIDS\n\n在普渡模型的较低层级，即生产过程网络（第 2\
  \ 层及以下）内部署 NIDS（称为 OT-NIDS）是相对较新的事物。现在已有几家公司提供解决方案，在工业网络的核心检测异常、差异和入侵尝试。这些解决方案专门用于分析工业协议，并能够区分正常流量和恶意流量。\n\
  \n在第 6 章“被动安全监控”中，我们讨论并实现了一个此类解决方案，即 Forescout 的 SilentDefense。在本章中，我们将了解如何将其功能集成到我们的整体网络安全监控工作中。\n\
  \n## 基于主机的安全监控\n\n为了监视端点的（安全）状态，我们需要能从该端点收集信息。这可以通过转发端点现有的日志和已有的数据收集机制，或添加自定义数据收集工具（基于主机的代理）来实现。最终目标是将端点上及与端点交互的变更、操作、代码和交互纳入我们的收集与关联平台，从而将我们的可见性、搜索、追踪和检测能力扩展至环境中的端点。\n\
  \n## 使用 Wazuh 进行基于主机的端点监控\n\nWazuh 是一个开源安全平台，通过轻量级代理提供基于主机的安全可见性，我们在第 6 章“被动安全监控”中已详细讨论过。该代理可以转发现有日志，监视其安装端点上的预定义关键方面，并且可以作为主机\
  \ IDS 代理，使我们能够针对基于主机的攻击、提权尝试、恶意代码执行等发出警报。我们已在第 6 章“被动安全监控”中讨论了 Wazuh 的部署方式。\n\n\
  在本章后面，我们将通过 Sysmon 和 PowerShell 脚本块日志记录来扩展代理的功能，如练习 1（使用 Wazuh 添加 Sysmon 日志记录）和练习\
  \ 2（使用 Wazuh 添加 PowerShell 脚本块日志记录）中所述。\n\n## 使用 syslog 转发事件日志\n\n如果基于主机的代理方法不可行，将端点数据导入日志收集与关联解决方案的另一种方法是通过\
  \ syslog 事件日志转发。许多——如果不是全部的话——网络（安全）设备和装置，以及大多数自动化设备，都支持 syslog 转发。我们在第 6 章“被动安全监控”中已经讨论过防火墙如何使用\
  \ syslog 转发其日志。在本章中，我们将看到如何处理 syslog 协议的自定义实现，即将 Forescout SilentDefense 日志转发到 Security\
  \ Onion，并创建自定义日志解析器来规范发送的数据。我们将在练习 4（将 SilentDefense 警报发送到 Security Onion syslog）中处理此任务。\n\
  \n现在，让我们从第一个练习开始构建整体网络安全监控视图，在这个练习中，我们将通过 Wazuh 代理将 Sysmon 日志添加到 Security Onion。\n\
  \n## 练习 1 – 使用 Wazuh 添加 Sysmon 日志记录\n\n作为本章的第一个练习，我们将通过在端点上安装 Sysmon 驱动，并让 Wazuh\
  \ 将 Sysmon 为我们创建的日志转发到 Security Onion，从而将 Sysmon 日志添加到 Security Onion 数据中。\n\n以下内容摘自\
  \ Sysinternals 网站（Sysmon 的创建者——参见 https://docs.microsoft.com/en-us/sysinternals/downloads/sysmon）：\n\
  \n> “系统监视器（Sysmon）是一种 Windows 系统服务和设备驱动程序，一旦安装在系统上，它会在系统重启后仍然驻留，以监视系统活动并将日志记录到 Windows\
  \ 事件日志中。它提供有关进程创建、网络连接以及文件创建时间更改的详细信息。通过使用 Windows 事件收集或 SIEM 代理收集其生成的事件，然后对其进行分析，您可以识别恶意或异常活动，并了解入侵者和恶意软件如何在您的网络上运行。”\n\
  \n4. 打开一个提升权限的命令提示符或 PowerShell 终端，导航到您复制 sysmon 可执行文件和配置文件的文件夹，然后输入以下命令（以粗体显示）：\n\
  \n```\nPS C:\\Users\\Administrator> cd .\\Desktop\\\nPS C:\\Users\\Administrator\\\
  Desktop> .\\Sysmon64.exe -accepteula -i sysmonconfig-export.xml\n\nSystem Monitor\
  \ v12.02 - System activity monitor\nCopyright (C) 2014-2020 Mark Russinovich and\
  \ Thomas Garnier\nSysinternals - www.sysinternals.com\n\nLoading configuration file\
  \ with schema version 4.22\nSysmon schema version: 4.40\nConfiguration file validated.\n\
  Sysmon64 installed.\nSysmonDrv installed.\nStarting SysmonDrv.\nSysmonDrv started.\n\
  Starting Sysmon64..\nSysmon64 started.\nPS C:\\Users\\Administrator\\Desktop>\n\
  ```\n\n此时我们需要做的就是这些。\n\nSysmon 驱动已安装并启动，现在正在捕获相关事件并将其存储在 Sysmon 事件日志中。Wazuh 正在监视该事件日志，并会将任何新条目转发到\
  \ Security Onion，在那里这些条目会添加到 Elasticsearch 数据库中并包含在搜索中。\n\n我们可以通过打开 Security Onion\
  \ Web 门户并打开 Kibana 工具来验证配置是否正确以及日志是否已转发。接下来，导航到“主页 | 主机 | Sysmon”仪表板，并查看仪表板屏幕底部的事件日志。以下截图显示了在\
  \ OT-DC1 上启动 PowerShell 终端进程的详细信息：\n\n![](img/c8ffa9959721097701584fcc95101362_342_0.png)\n\
  \n图 9.1 – 练习 1：启动 PowerShell 进程的 Sysmon 日志\n\n如您所见，Sysmon 工具在进程启动事件周围添加了大量详细信息。我们可以看到谁启动了\
  \ PowerShell 进程（user.name）、进程是从哪个应用程序启动的（*.parent*）、进程可执行文件所在位置（process.executable）、命令行参数（process.command_line）、进程\
  \ ID、进程和父进程可执行文件的哈希值（winlog.event_data.hashes）等。\n\n有一点我需要指出：Wazuh 如何知道要开始查找 Sysmon\
  \ 日志呢？如果您还记得第 6 章《*被动安全监控*》中的内容，我们修改了 Wazuh 代理的配置文件，以包含以下片段：\n\n```\n<localfile>\n\
  \  <location>Microsoft-Windows-Sysmon/Operational</location>\n  <log_format>eventchannel</log_format>\n\
  </localfile>\n```\n\n该配置片段指示 Wazuh 在 Windows 事件日志中查找 `Microsoft-Windows-Sysmon/Operational`，并将任何条目转发到运行在\
  \ Security Onion 虚拟机上的 Wazuh 服务。Wazuh 正在监视的 `Microsoft-Windows-Sysmon/Operational`\
  \ 位置与 Windows 事件查看器实用程序中的位置对应——**应用程序和服务日志 | Microsoft | Windows | Sysmon | 操作**，如下面的截图所示：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_343_0.png)\n\n### 图 9.2 - 练习 1：Sysmon\
  \ Windows 事件日志位置\n\n您也可以将其他感兴趣的事件日志添加到 Wazuh 配置中，使它们成为 Elasticsearch 数据库的一部分。例如，如果我们想开始将\
  \ Rockwell Automation FactoryTalk Diagnostics 日志（**应用程序和服务日志 | FactoryTalk Diagnostics**）发送到\
  \ Security Onion，可以在 Wazuh 代理配置中添加以下片段（然后重启代理）：\n\n```\n<localfile>\n    <location>FTDiag</location>\n\
  \    <log_format>eventchannel</log_format>\n</localfile>\n```\n\n请注意，我将位置指定为 FTDiag。这样做是因为那是日志文件的**完整名称**，您可以通过右键单击事件日志并选择**属性**来查看，如下面的截图所示：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_344_0.png)\n\n图 9.3 – 练习 1：FactoryTalk\
  \ Diagnostics 日志 – 文件名\n\n\n\n\n此配置更改将开始把 FactoryTalk Diagnostics 日志导入 Elasticsearch。FactoryTalk\
  \ Diagnostic 日志对于罗克韦尔自动化应用程序和安全事件，以及应用程序和性能数据来说，是一个宝库。\n\n为了给你一个示例，我们将查看 FactoryTalk\
  \ Diagnostics 服务中的一些事件日志。但首先，在 Wazuh 代理开始将 FactoryTalk 日志发送到 Security Onion 后，我们需要指示\
  \ Elasticsearch 更新其索引模式，以包含随额外日志一起发送的新创建的属性。为此，在 Kibana Web 门户中，单击菜单图标（左上角）并选择 Stack\
  \ Management。接下来，从 Stack Management 页面，导航到 Index Patterns - *:so-* 并单击 Refresh 按钮，然后在弹出屏幕上单击\
  \ Refresh 确认刷新，如下面的截图所示：\n\n![](img/c8ffa9959721097701584fcc95101362_345_0.png)\n\
  \n图 9.4 – 练习 1：刷新 Elasticsearch 字段列表\n\n这将指示 Elasticsearch 更新（刷新）字段列表，进而允许通过搜索属性查询字段。\n\
  \n我们现在可以开始在刷新后的数据字段中进行搜索。为此，请单击 Kibana 菜单图标并选择 Discover。这将打开 Kibana 的 Discovery\
  \ 页面。在这里，我们可以搜索数据，并查看 Elasticsearch 中记录的原始日志。\n\n通过搜索 `winlog.channel: FTDiag`，我们可以看到\
  \ FactoryTalk Diagnostics 日志记录服务发送的几类事件日志，如下面的截图所示：\n\n![](img/c8ffa9959721097701584fcc95101362_346_0.png)\n\
  \n图 9.5 – 练习 1：FactoryTalk Diagnostics 示例日志条目\n\n在返回的日志这一小部分中，我们看到了很有价值的信息，例如 `OT-DOMAIN\\\
  ADMINISTRATOR` 登录到 FactoryTalk 目录，随后成功更改了一个功能属性（`OT-DOMAIN\\ADMINISTRATOR` 进行了更改，以允许通过\
  \ FactoryTalk Security 打开 RSMACC 软件）。\n\n同样，可以以相同方式添加其他工业控制系统（ICS）供应商的日志——我将把这作为课后作业留给你。\n\
  \n在本练习中，我们学习了如何使用 Wazuh 基于主机的日志收集代理扩展 ELK 堆栈的事件日志记录功能。更具体地说，我们添加了 Sysinternals Sysmon\
  \ 驱动程序的许多高级功能，并实现了特定于 ICS 供应商的事件日志转发。这些额外的事件日志功能将使我们能够发现更广泛环境和技术中的安全相关事件和异常。\n\n\
  接下来，我们将研究如何为 PowerShell 脚本和命令添加一些洞察。\n\n## 练习 2 – 使用 Wazuh 添加 PowerShell 脚本块日志记录\n\
  \n在本练习中，我们将把**PowerShell 脚本块日志**添加到 Wazuh 收集功能集中。**PowerShell 脚本块日志记录**是较新版本 PowerShell（**PowerShell\
  \ v5+**）附带的一项功能。它允许我们指示 Windows 为 PowerShell 终端中运行的每个命令创建事件日志。最近的趋势是攻击者不再通过专用工具和应用程序来针对系统的传统方式，而是倾向于**离地生存**方式，即使用被攻击计算机系统上存在的本机工具。这些新战术使得监控和拦截恶意工具变得更加困难——你打算怎么做：阻止\
  \ `cmd.exe` 或 `powershell.exe`？因此，能够记录在这些本机工具上运行的每个命令，是安全监控中受欢迎的补充，而且往往是检测恶意活动的唯一方法。\n\
  \n作为额外的好处，日志记录方式的一个特点是，事件日志条目要等到命令被可选解码后才会创建。因此，如果有人试图使用`-EncodedCommand` PowerShell\
  \ 命令（该命令接受 Base64 编码的命令来运行）欺骗系统，该命令会在记录前先被解码。这样，`powershell -EncodedCommand 'ZABpAHIRIA\
  \ BjADoAXAA='` 将被记录为 `dir c:\\`，如下所示：\n\n![](img/c8ffa9959721097701584fcc95101362_347_0.png)\n\
  \n图 9.6 – 练习 2：解码后的 PowerShell 命令\n\n请按照以下说明配置**PowerShell 脚本块日志记录**：\n\n- 1. **PowerShell\
  \ 脚本块日志记录**通过**组策略**设置启用。对于不属于 Windows 域（独立计算机）的 Windows 计算机，我们可以在本地计算机（`gpedit.msc`）上执行此操作，也可以通过配置正确的**组策略对象（GPO）**设置在域级别执行此操作。我们这里将展示\
  \ GPO 选项，但除了必须使用 `gpedit` 实用程序外，独立方法与之一致。首先，登录域控制器 VM（OT-DC1）。\n- 2. 打开**服务器管理器**应用程序，并启动“工具\
  \ | **组策略管理**”工具，如下面的截图所示：\n\n![](img/c8ffa9959721097701584fcc95101362_348_0.png)\n\
  \n- 3. 右键单击**默认域策略**GPO，然后选择**编辑**。\n- 4. 在弹出**组策略管理**编辑器屏幕中，导航到**计算机配置 | 策略 | 管理模板\
  \ | Windows 组件 | Windows PowerShell**，然后双击**打开 PowerShell 脚本块日志记录**，如下面的截图所示：\n\n\
  ![](img/c8ffa9959721097701584fcc95101362_349_0.png)\n\n图 9.8 – 练习 2：打开 PowerShell\
  \ 脚本块日志记录\n\n- 5. 选中**已启用**，然后单击**确定**。\n- 6. 这就是**PowerShell 脚本块日志记录**的全部配置。域复制将负责配置所有域计算机。\n\
  \n我需要指出的一点是，Wazuh 如何知道开始查找 PowerShell 脚本块日志。如果你还记得第 6 章“被动安全监控”，我们修改了 Wazuh 代理的配置文件，以包含以下代码片段：\n\
  \n```\n<localfile>\n  <location>Microsoft-Windows-PowerShell/Operational</location>\n\
  \  <log_format>eventchannel</log_format>\n</localfile>\n```\n\n与 Sysmon 日志一样，上述代码指示\
  \ Wazuh 开始监视 PowerShell 日志，并将任何新条目发送到 Security Onion 以添加到 Elasticsearch 数据库中。\n\n\
  现在配置就绪后，我们在域控制器的 PowerShell 终端中输入一个命令（首先运行 gpupdate /force 以应用新的组策略），如下面的截图所示：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_350_0.png)\n\n图 9.9 – 练习 2：生成示例 PowerShell\
  \ 脚本块事件\n\n在下面的截图中，我们可以看到通过搜索 `event.code:4104`（4104 是附加到 PowerShell 脚本块日志记录事件的事件\
  \ ID）将此活动记录到 Elasticsearch 日志中：\n\n![](img/c8ffa9959721097701584fcc95101362_351_0.png)\n\
  \n图 9.10 – 练习 2：PowerShell 脚本块 Elasticsearch 日志条目\n\n至此，我们现在能够记录整个域的 PowerShell\
  \ 活动：这是我们安全监控功能中一个非常强大的补充。\n\n接下来，我们将研究如何为 pfSense 防火墙添加网络入侵检测功能，以便能够检测边界上的攻击。\n\
  \n## 练习 3 – 向 pfSense 添加 Snort IDS\n\n前面我们讨论了将 Snort 作为 Security Onion 设备的一部分，充当内部网络的\
  \ IDS。现在，我们将 Snort 作为软件包附加组件安装到 pfSense 防火墙上，目的是在网络边缘增加入侵防御系统（IPS）功能。这里重点强调的是预防，而不是检测。我们希望防火墙能够阻止来自外部针对我们网络的攻击，或者阻止从内部离开我们网络的攻击。工业环境通常希望避免在内部（工业）网络上使用主动控制，因为这些主动控制可能会中断合法进程，从而导致生产停机。\n\
  \n然而，在非信任区（企业或工业非军事区（IDMZ））和信任区（工业网络）之间设置主动控制，带来的好处多于风险。生产过程不应依赖业务或 IDMZ 资源来继续生产，因此，主动安全控制的潜在误报反应超过了在其对生产过程造成伤害之前阻止入侵的机会。\n\
  \n\n\n\n\n我们将在以下说明中安装 Snort 插件并进行配置：\n\n1. 打开 pfSense Web 门户并登录。\n2. 导航至 System\
  \ | Package Manager，如以下屏幕截图所示：\n\n![](img/c8ffa9959721097701584fcc95101362_352_0.png)\n\
  \nFigure 9.11 – Exercise 3: pfSense package manager\n\n3. 点击 Available Packages\
  \ 选项卡并搜索 Snort，如以下屏幕截图所示：\n\n![](img/c8ffa9959721097701584fcc95101362_352_1.png)\n\
  \nFigure 9.12 – Exercise 3: Adding Snort package to pfSense\n\n4. 点击 Install 和 Confirm\
  \ 开始安装过程。Snort 插件（add-on）现正在安装中。\n\n5. 安装过程完成后（Success），导航至 Services | Snort 以打开\
  \ Snort 接口配置页面。\n\n6. 在将 Snort 绑定到接口之前，我们需要配置一些其他设置，因此点击 Global Settings 选项卡并执行以下操作：\n\
  \n    a) 勾选 Enable Snort VRT 选项——输入你在第 6 章《Passive Security Monitoring》第 1 节《Setting\
  \ up and configuring Security Onion》中为 Exercise 1 创建的 Oinkmaster 代码。\n    b) 勾选\
  \ Enable Snort GPLv2 选项。\n    c) 勾选 Enable ET Open 选项。\n    d) 勾选 Enable OpenAppID\
  \ 选项。\n    e) 勾选 Enable AppID Open Text Rules 选项。\n\n以下屏幕截图显示了应如何操作：\n\n![](img/c8ffa9959721097701584fcc95101362_353_0.png)\n\
  \nFigure 9.13 – Exercise 3: Configuring Snort update sources\n\n![](img/c8ffa9959721097701584fcc95101362_355_0.png)\n\
  \nFigure 9.15 – Exercise 3: Forcing update of Snort rules\n\n8. 更新过程完成后，你应该会看到带有当前时间和日期的\
  \ MD5 签名。\n\n9. 切换到 **Snort Interfaces** 选项卡并点击 **Add** 以打开新的接口配置屏幕。在初始屏幕（**Interface\
  \ Settings**）中，按如下配置：\n\n    a) 将 **Interface** 保持为 WAN，因为我们希望 Snort 在外部（**广域网，或\
  \ WAN**）接口上进行保护。\n\n    b) 勾选 **Send Alerts to System Log** 选项，以便 Snort 将警报发送到 pfSense\
  \ 系统日志，该日志会转发到 Security Onion。\n\n    c) 将 **System Log Priority** 选项更改为 `LOG_NOTICE`\
  \ 以使警报更加详细。\n\n    d) 勾选 **Block Offenders** 选项以自动阻止攻击者（此设置将 Snort 从 IDS 转变为 IPS）。将\
  \ **IPS Mode** 保持为 **Legacy Mode** 并阻止警报的 **BOTH** 侧（源 IP 和目标 IP）。请注意，IPS 可能会阻止企业网络与工业网络之间的合法活动，因此建议对\
  \ IPS 规则进行微调。\n\n    以下屏幕截图显示了应如何操作：\n\n    ![](img/c8ffa9959721097701584fcc95101362_356_0.png)\n\
  \n    Figure 9.16 – Exercise 3: Configuring Snort's monitoring interface\n\n   \
  \ e) 将其余选项保持默认设置，然后点击配置页面底部的 Save。\n\n10. 切换到 WAN Categories 选项卡并勾选 Use IPS Policy\
  \ 选项以显示 IPS Policy Selection 选项。\n\n**IPS Policy Selection** 选项允许我们快速将规则集调整为以下四种预定义策略之一：\n\
  \n    a) **Connectivity**，优先考虑连通性而非安全性\n    b) **Balanced**，在连通性与安全性之间取得平衡\n   \
  \ c) **Security**，优先考虑安全性而非连通性\n    d) **Max-Detect**，将一切投入检测引擎\n\n以下屏幕截图显示了如何操作：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_357_0.png)\n\nFigure 9.17 – Exercise\
  \ 3: Configuring IPS policy\n\n11. 目前选择 **Balanced**，并为 **IPS Policy Mode** 选项选择\
  \ **Policy**（与屏幕截图中显示的不同），以便让规则决定对警报采取何种操作（通常操作是丢弃数据包）。\n\n12. 向下滚动并点击 **Save**\
  \ 完成接口配置。\n\n13. 我们现在准备启动 Snort，因此导航至 **Services | Snort | Interfaces** 页面并通过点击\
  \ **Start Snort on this interface** 按钮启动 Snort。\n\n14. 如果一切顺利，我们现在已有 Snort 在 pfSense\
  \ 防火墙的 WAN 接口上监控流量。你可以从主屏幕（点击左上角的 pfSense 图标）通过在 **Services Status** 小部件中验证服务状态来确认，如以下屏幕截图所示：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_358_0.png)\n\nFigure 9.18 – Exercise\
  \ 3: pfSense Services Status widget\n\n15. 此主页面现在有一个新的 **Snort Alerts** 小部件，用于显示检测到的警报，如以下屏幕截图所示：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_358_1.png)\n\nFigure 9.19 – Exercise\
  \ 3: Snort Alerts widget\n\n为了完成本练习，让我们创建一个 Snort 警报以查看其外观。为此，在位于 pfSense 防火墙下方的计算机上打开浏览器并导航至\
  \ `http://testmyids.ca/`。\n\n第一次访问时，浏览器中会出现以下页面：\n\n![](img/c8ffa9959721097701584fcc95101362_358_2.png)\n\
  \nFigure 9.20 – Exercise 3: testmyids.ca\n\n如果我们点击 **Refresh**，页面将永远无法加载，并且现已被 pfSense\
  \ 阻止。造成此延迟的原因是我们选择将 Snort 配置为 **Legacy Mode** 而非 **Inline Mode**。在 **Legacy Mode**\
  \ 中，Snort 基于数据包的副本做出决策，而不是内联检查数据包并在数据包进入工业网络之前做出阻止或允许的决策。因此 **Inline Mode** 更安全，但并非所有硬件都支持。如果你想启用它，请先阅读要求。\n\
  \n此时，我们还收到了来自 Snort 的警报，可以在主仪表板或 **Services | Snort | Alerts** 的 Snort 警报页面上查看，如以下屏幕截图所示：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_359_0.png)\n\nFigure 9.21 – Exercise\
  \ 3: Snort alert details\n\n我们可以看到 Snort 检测到来自 `testmyids.ca (104.31.77.72)` 的响应为恶意。如果我们切换到\
  \ **Blocked** 选项卡，可以看到该 IP 已在阻止列表中，如以下屏幕截图所示：\n\n![](img/c8ffa9959721097701584fcc95101362_359_1.png)\n\
  \nFigure 9.22 – Exercise 3: Snort blocked hosts\n\n请记住，我们指示 Snort 对任何警报都进行阻止，因此即使\
  \ **Alerts** 页面显示采取的 **Action** 为 **Alert**，IP地址仍会被阻止。\n\n最后，如果我们在 Kibana 的 Discovery\
  \ 页面中搜索 MALWARE-OTHER 消息，可以看到警报已成功添加到 Elasticsearch 数据库，如以下屏幕截图所示：\n\n![](img/c8ffa9959721097701584fcc95101362_360_0.png)\n\
  \nFigure 9.23 – Exercise 3: pfSense Snort alert logs in Elasticsearch\n\n这涵盖了练习材料；我们现在拥有一个\
  \ NIPS 来保护通过 pfSense WAN 接口进入或离开工业网络的流量。此外，NIPS 的任何检测都将记录到 ELK 事件数据库中，使我们能够进行关联、可视化和警报。\n\
  \n接下来，我们将通过将 SilentDefense 日志发送到 syslog 来添加一些 OT-IDS 警报。\n\n## Exercise 4 – Sending\
  \ SilentDefense alerts to Security Onion syslog\n\n本章的全部内容都是关于掌握信息，使我们能够首先看到最相关、最方便和果断的信息。有什么比来自我们\
  \ OT IDS（SilentDefense）的警报更果断的呢？它会提醒我们有人或某物正在造成问题？此时，这些警报仅在 SilentDefense Command\
  \ Center 门户中生成并显示。我们希望将这些警报传输到 Security Onion，以便将其添加到 Elasticsearch 数据库中，从而允许我们在关联工作和搜索中包含警报数据以及\
  \ SilentDefense 收集的其他有趣数据。\n\n按照以下说明将 SilentDefense 警报和网络日志发送到 Security Onion VM\
  \ 的 syslog 服务：\n\n1. 我们需要做的第一件事是允许来自 SilentDefense Command Center 服务器（172.25.100.240）的\
  \ syslog 访问 Security Onion。SSH 到 Security Onion 机器（`ssh adm-pac@172.25.100.250`）。在此执行以下操作：\n\
  \n    a) 输入 sudo `so-allow` 命令\n    b) 选择 s 选项用于 `Syslog device – 514/tcp/udp`\n\
  \    c) 指定 SilentDefense Command Center IP 地址——`172.25.100.240`\n    d) 按 `Enter`\
  \ 确认\n\n\n\n\n\n输出可在以下屏幕截图中看到：\n\n```\n[adm-pac@IND-SecurityOnionv2 ~]$ sudo so-allow\n\
  [sudo] password for adm-pac:\nSorry, try again.\n[sudo] password for adm-pac:\n\
  This program allows you to add a firewall rule to allow connections from a new IP\
  \ address.\nChoose the role for the IP or Range you would like to add\n\n[a] - Analyst\
  \ - ports 80/tcp and 443/tcp\n[b] - Logstash Beat - port 5044/tcp\n[e] - Elasticsearch\
  \ REST API - port 9200/tcp\n[f] - Strelka frontend - port 57314/tcp\n[g] - Osquery\
  \ endpoint - port 8090/tcp\n[s] - Syslog device - 514/tcp/udp\n[w] - Wazuh agent\
  \ - port 1514/tcp/udp\n[p] - Wazuh API - port 55000/tcp\n[r] - Wazuh registration\
  \ service - 1515/tcp\n\nPlease enter your selection:\ns\nEnter a single ip address\
  \ or range to allow (example: 10.10.10.10 or 10.10.0.0/16):\n172.25.100.240\nAdding\
  \ 172.25.100.240 to the syslog role. This can take a few seconds\nlocal:\n------------\n\
  \        ID: create_sysconfig_iptables\n      Function: file.touch\n        Name:\
  \ /etc/sysconfig/iptables\n      Result: True\n    Comment: unless condition is\
  \ true\n    Started: 22:52:29.178700\n    Duration: 2458.279 ms\n     Changes:\n\
  ------------\n        ID: iptables_fix_docker\n      Function: iptables.chain_present\n\
  \        Name: DOCKER-USER\n      Result: True\n```\n\n图 9.24 – 练习 4：Security Onion\
  \ – so-allow syslog\n\n这就是允许 SilentDefense Command Center 访问 syslog 所需的所有配置。\n\n\
  +   2. 我们现在需要登录 SilentDefense Command Center 网页门户（https://172.25.100.240/login）来配置\
  \ SilentDefense 端的相关设置。\n+   3. 从门户仪表盘页面，点击顶部菜单栏中的 Settings。\n\n**Host name**—将其设置为\
  \ `SilentDefense-001`。\n\n**Application name**—将其设置为 `AlertLogs`。\n\n以下屏幕截图显示了应如何操作：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_364_0.png)\n\ne) 这就是警报日志所需的所有配置。点击屏幕顶部的\
  \ **Finish**。\n\n+   5. 点击 **Back** 返回到 Command Center **Settings** 页面。\n\n+   6.\
  \ 点击 **Network logs forwarding** 并按照以下步骤将 Syslog 转发添加到网络日志中：\n\n+   a) 从 **Network\
  \ logs forwarding** 配置页面，点击 **Add Instance** 按钮（屏幕右侧的加号 (+) 图标）。\n\n+   b) 这将打开一个空白的\
  \ syslog 转发配置屏幕。指定一个服务器名称（`SecurityOnion-Network`）并切换到 **Connectivity** 选项卡。\n\n\
  +   c) 在 **Connectivity** 选项卡上，将远程主机 IP 地址设置为 `172.25.100.250`，即 Security Onion\
  \ 服务器的 IP 地址。\n\nd) 切换到 **Header** 选项卡并设置以下内容：\n\n**Severity**—将其设置为 **DEBUG**（在验证工作正常后降至\
  \ **WARNING**）。\n\n**Host name**—将其设置为 `SilentDefense-001`。\n\n**Application name**—将其设置为\
  \ `NetworkLogs`。\n\ne) 这就是网络日志所需的所有配置。点击屏幕顶部的 **Finish**。\n\n这就是我们需要完成的所有配置，以便将\
  \ syslog 消息从 SilentDefense Command Center 发送到 Security Onion 服务器。我们可以通过打开 Kibana\
  \ 网页门户，导航到 **Discovery** 页面，并搜索 `message` : `NetworkLogs` 来验证是否正常工作，如以下屏幕截图所示：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_365_0.png)\n\n我们已经收到 syslog 数据，但它处于原始格式，意味着它现在尚未解析为可用数据。这是我们将使用\
  \ Elasticsearch 解析来执行的操作。诀窍是解析传入的 syslog 数据并在将其存储到数据库之前修复数据。请按照以下说明操作：\n\n+   7.\
  \ Elasticsearch 使用 ingest 解析器指令文件来接收来自发送者的日志并以用户指定的形状和形式存储数据。我们可以在 /opt/so/conf/elasticsearch/ingest/\
  \ 文件夹中看到现有的指令文件，如以下屏幕截图所示：\n\n![](img/c8ffa9959721097701584fcc95101362_366_0.png)\n\
  \n图 9.29 – 练习 4：Security Onion – Elasticsearch ingest 解析器指令文件\n\n我们可以通过在 /opt/so/saltstack/local/salt/elasticsearch/files/ingest/\
  \ 中为它们创建 ingest 解析指令文件来添加自己的自定义指令。Elasticsearch 会在（重新）启动时包含自定义文件夹中的指令。我们将在此处添加用于解析\
  \ SilentDefense Syslog 消息的配置文件。\n\n+   8. 下载 syslog 和 silentdefense 配置文件，如下所示：\n\
  \n+   a) 第一个要下载的文件是 syslog Elasticsearch ingest 解析配置文件，来自 https://github.com/SackOfHacks/Industrial-Cybersecurity-2nd-Edition/blob/main/security-onion-logstash/syslog。这将覆盖\
  \ Security Onion 的 syslog 解析，以添加以下 grok 解析器指令：\n\n```\n\"<111>1 %{TIMESTAMP_ISO8601:sd.timestamp}\
  \ %{SYSLOGHOST:sd.hostname} %{WORD:sd.logname} - - - CEF:0\\|%{DATA:sd.vendor}\\\
  \\\\\\|%{DATA:sd.product}\\\\\\\\|%{DATA:sd.product_version}\\\\\\\\|%{DATA:sd.alert_name}\\\
  \\\\\\|%{DATA:sd.alert_title}\\\\\\\\|%{DATA:sd.alert_number}\\\\\\\\|%{GREEDYDATA:sd.real_message}\"\
  \n```\n\ngrok 是一个正则表达式解析命令，允许 Logstash 查找和重塑 syslog 消息等非结构化文本。我们的指令文件中的 grok 表达式告诉\
  \ Elasticsearch 执行以下操作：\n\n+   - 查找 TIMESTAMP_ISO8601 格式的时间戳并以 sd.timestamp 的名称存储它。\n\
  +   - 将消息的下一部分视为 SYSLOGHOST 并以 sd.hostname 的名称存储它。\n+   - 接下来，查找以下信息（DATA）：\n+ \
  \    - sd.vendor\n+     - sd.product\n+     - sd.product_version\n+     - sd.alert_name\n\
  +     - ...\n+   - 最后，将剩余的事件数据（IP地址和详细消息数据）存储在 sd.real_message 中，该数据将通过 silentdefense\
  \ ingest 解析器进一步解析。\n\ngrok 模式定义与正则表达式相关，可以在此处找到：https://github.com/elastic/logstash/blob/v1.4.2/patterns/grok-patterns。\n\
  \nb) 我们需要下载的第二个文件是 silentdefense Elasticsearch ingest 解析配置文件，来自 https://github.com/SackOfHacks/Industrial-Cybersecurity-2nd-Edition/blob/main/security-onion-logstash/silentdefense。此\
  \ ingest 解析器将 SilentDefense Command Center 发送到 Security Onion 的 syslog 事件的 real_message\
  \ 部分拆分为相关信息，如下所示：\n\n```\n\"dissect\": {\n    \"if\": \"ctx.sd.logname == 'NetworkLogs'\"\
  ,\n    \"field\": \"sd.real_message\",\n    \"pattern\": \"rt=%{sd.aler_rt} msg=%{sd.alert_message}\
  \ cat=%{sd.alert_category} deviceExternalId=%{sd.device_extId} smac=%{sd.source.mac}\
  \ dmac=%{sd.destination.mac} src=%{sd.source.ip} dst=%{sd.destination.ip} dpt=%{sd.destination.port}\
  \ %{sd.source.hostname} %{sd.destination.hostname} %{sd.filePath} %{sd.fileType}\
  \ %{sd.fsize} %{sd.user_message}\",\n```\n\n```\n\"on_failure\" : [ {\"set\" : {\"\
  field\" : \"error.message\", \"value\" : \"{{ _ingest.on_failure_message }}\"}}]\n\
  }\n```\n\n我们将其放在单独的解析器中是为了允许拆分不同的 syslog shipper。正如你在 SilentDefense 练习中回忆的那样，我们创建了两个单独的\
  \ syslog 转发器，NetworkLogs 和 AlertLogs。这两者在格式化 syslog 消息的方式上略有不同，因此这是处理该问题的地方。你下载的\
  \ silentdefense 文件显示了 AlertLogs 转发器的第二个 dissector。\n\n+   9. 下载完成后，将 syslog 和 silentdefense\
  \ 文件复制到 Security Onion VM 上的 /opt/so/saltstack/local/salt/elasticsearch/files/ingest/\
  \ 文件夹中。\n\n+   10. 我们现在需要重启 Elasticsearch。运行 sudo so-elasticsearch-restart 命令即可。\n\
  \n+   11. Elasticsearch 重启后，来自 SilentDefense 的 syslog 消息现在被解析为以下形式：\n\n| ... | \
  \ |\n|---|---|\n| event.dataset | ot-ids |\n| event.module | silentdefense |\n|\
  \ sd.host.name | IND-securityonion |\n| ingest.timestamp | 2020-12-11T23:46:11.475Z\
  \ |\n| log.source.address | 172.25.100.240:53545 |\n| message | <111>1 2020-12-11T16:46:11.472-07:00\
  \ SilentDefense-001 AlertLogs ... |\n| sd.aler_rt | Feb 15 2021 16:46:11 |\n| sd.alert_category\
  \ | NetworkAttack |\n| sd.alert_message | NMAP Scan detecte |\n| sd.alert_name |\
  \ nmap_scan |\n| sd.alert_number | 11 |\n| sd.alert_title with NMAP | A host on\
  \ the network is scanning |\n| sd.device_extId | SD-ProductionLine1 |\n| ... | \
  \ |\n\n\n\n\n以上介绍了 SilentDefense syslog 消息的实现。现在，当发生网络事件警报时，SilentDefense 会将数据转发到\
  \ Security Onion，数据会进入 Elasticsearch 数据库，并可纳入关联、搜索、警报和可视化中。\n\n在下一个练习中，我们将合并所有已收集的数据，并构建一个\
  \ Kibana 仪表板，以向我们展示有趣的事件、警报、信息和详细信息，使我们能够快速评估任何潜在的安全事件或问题。\n\n接下来，我们将创建一个 Kibana\
  \ 仪表板，帮助我们可视化、关联、搜索和汇总防火墙日志/事件。\n\n## 练习 5 – 在 Kibana 中创建 pfSense 防火墙事件仪表板\n\n为了能够在\
  \ Security Onion 的 **Kibana** 工具中可视化 pfSense 日志，我们将添加一个包含相关数据的仪表板。\n\n要在 Kibana\
  \ 仪表板上显示 pfSense 警报，我们需要做的第一件事是定义事件搜索过滤器。这将使防火墙事件的处理更轻松、更快捷。下面的说明将引导我们创建防火墙事件搜索过滤器：\n\
  \n- 1. 登录 Security Onion，然后从左侧选择面板打开 **Kibana** 工具：\n\n![](img/c8ffa9959721097701584fcc95101362_369_0.png)\n\
  \n2. 这会为 Kibana **主页**打开一个新标签页。在这里，我们通过 Kibana 菜单（左上角带有三条水平线的按钮）选择 **Discover**\
  \ 页面：\n\n![](img/c8ffa9959721097701584fcc95101362_370_0.png)\n\n图 9.31 – 练习 5 –\
  \ Kibana 菜单\n\n3. 我们现在进入 Kibana **Discover** 页面，在该页面中，我们可以对事件执行搜索，并创建和保存自定义搜索查询。\n\
  \n4. 输入搜索字符串 `event.dataset:firewall`，以筛选出被 Zeek 归类为防火墙事件的事件：\n\n![](img/c8ffa9959721097701584fcc95101362_371_0.png)\n\
  \n图 9.32 – 练习 5 – 防火墙事件数据集\n\n5. 目前我们只需要这些。点击保存（屏幕右上角），另存为 自定义搜索 – 防火墙事件：\n\n![](img/c8ffa9959721097701584fcc95101362_371_1.png)\n\
  \n图 9.33 – 练习 5 – 保存自定义搜索\n\n定义好自定义搜索后，接下来我们要在 Kibana 中添加一个仪表板，用于展示组件。请按照以下说明创建仪表板：\n\
  \n- 1. 要开始创建一个初始（空白）仪表板，请登录 Security Onion Web 门户，打开 Kibana 工具，然后导航到 https://172.25.100.250/kibana/app/dashboards。在仪表板列表页面中，点击创建仪表板，这将打开一个空白的“编辑新仪表板”页面，如下面的截图所示：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_372_0.png)\n\n图 9.34 – 练习 5 – 创建新仪表板\n\
  \n- 2. 现在，我们将向空白画布添加一些可视化组件（面板）。为此，点击创建面板，找到并选择饼图可视化，然后搜索并选择 自定义搜索 – 防火墙事件 数据源：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_372_1.png)\n\n图 9.35 – 练习 5 – 添加饼图组件\n\
  \n- 3. 现在，要添加饼图中显示的数据，请在 **分桶** 下添加一个 **拆分切片** 分桶（数据桶），并将 **聚合** 设置为 **词条**。\n\n\
  对于 **字段**，选择 **rule.action.keyword**：\n\n![](img/c8ffa9959721097701584fcc95101362_373_0.png)\n\
  \n- 4. 最后，将 **大小** 设置为 50，然后点击 **分桶** 配置部分底部的 **更新** 以保存更改。\n\n5. 我们的组件现已就绪。你可以通过\
  \ **选项** 菜单更改一些视觉样式设置，例如将样式从 **环形图** 更改为 **饼图**：\n\n![](img/c8ffa9959721097701584fcc95101362_374_0.png)\n\
  \n图 9.37 – 练习 5 – 饼图组件选项\n\n6. 完成组件样式设置后，通过 **保存** 按钮（屏幕右上角）保存它，并将其命名为 `Firewall\
  \ - Rule Action Summary`。这会让我们返回 **仪表板编辑** 屏幕。在这里，我们可以调整新创建的饼图组件的大小。\n\n按照同样的原则，向仪表板添加以下组件：\n\
  \n- • 垂直条形图：\n  - A. **自定义搜索 – 防火墙事件** 数据源\n  - B. **数据直方图** 数据桶，**聚合** 设置为 @`timestamp`\n\
  \  - C. 另存为 `Firewall - Logs Count over time`：\n\n![](img/c8ffa9959721097701584fcc95101362_375_0.png)\n\
  \n图 9.38 – 练习 5 – 随时间变化的日志数量组件\n\n- - 水平条形图：\n  - A. 自定义搜索 – 防火墙事件 数据源\n  - B. 拆分系列数据桶，聚合设置为词条，字段设置为\
  \ network.transport.keyword\n  - C. 另存为 Firewall - Network Protocol Summary：\n\n\
  ![](img/c8ffa9959721097701584fcc95101362_375_1.png)\n\n图 9.39 – 练习 6 – 网络协议摘要组件\n\
  \n数据表可视化：\n\n- A. 自定义搜索 – 防火墙事件 数据源\n- B. 拆分行数据桶，聚合设置为词条，字段设置为 source.ip\n- C. 将大小设置为\
