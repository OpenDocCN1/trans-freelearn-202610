  \ Host Analysis:          113 / 113\n[==================] 100 %\n[-] Uconn Analysis:\
  \         123 / 123\n[==================] 100 %\n[-] Exploded DNS Analysis:  180\
  \ / 180\n[==================] 100 %\n[-] Hostname Analysis:      180 / 180\n[==================]\
  \ 100 %\n[-] Beacon Analysis:        123 / 123\n[==================] 100 %\n[-]\
  \ UserAgent Analysis:     5 / 5\n[==================] 100 %\n[!] No certificate\
  \ data to analyze\n[-] Updating blacklisted peers ...\n[-] Indexing log entries\
  \ ...\n[-] Updating metadatabase ...\n[-] Done!\n```\n\n6. 我们需要对 /nsm/zeek/logs/\
  \ 下的每个子文件夹重复此过程，以确保导入所有日志。不过，这可以通过脚本实现，并使用 cron 脚本进行自动化。\n\n7. 导入所有相关的 Zeek 日志后，我们现在可以指示\
  \ RITA 显示一些有趣的统计信息。让我们看一下 RITA 的帮助：\n\n```\npac@secOnion-002:~/tools/rita$ rita\
  \ -h\nNAME:\n    rita - Look for evil needles in big haystacks.\nUSAGE:\n    rita\
  \ [global options] command [command options]\n    [arguments...]\nVERSION:\n   \
  \ v3.3.1\nCOMMANDS:\n```\n\n| 命令 | 描述 |\n|---|---|\n| `delete, delete-database`\
  \ | 删除已导入的数据库 |\n| `import` `target database` | 将 Zeek 日志导入到数据库 |\n| `html-report`\
  \ `an analyzed database` | 为已分析的数据库创建 HTML 报告 |\n| `show-beacons` `signs of C2 software`\
  \ | **打印显示 C2 软件迹象的主机** |\n| `show-bl-hostnames` `which received connections` |\
  \ 打印已列入黑名单且接收连接的主机名 |\n| `show-bl-source-ips` `initiated connections` | 打印已列入黑名单且发起连接的\
  \ IP |\n| `show-bl-dest-ips` `received connections` | 打印已列入黑名单且接收连接的 IP |\n| `list,\
  \ show-databases` `currently stored` | 打印当前存储的数据库 |\n| `show-exploded-dns` `covert\
  \ dns channels` | 打印 DNS 分析。揭示隐蔽的 DNS 通道 |\n| `show-long-connections` `relevant\
  \ information` | 打印长连接及相关信息 |\n| `show-strobes` | 打印 strobe 信息 |\n| `show-useragents`\
  \ `information` | 打印用户代理信息 |\n| `test-config` `file for validity` | 检查配置文件的有效性 |\n\
  | `help, h` `help for one command` | 显示命令列表或某条命令的帮助 |\n\n全局选项：\n`--help, -h` 显示帮助\n\
  `--version, -v` 打印版本\n\n8. 我们可以看到，RITA 通过 show-beacons 标志显示信标统计信息。让我们看看能在自己的环境中发现什么：\n\
  \n```\npac@secOnion-002:~/tools/rita$ rita show-beacons zeek-1\nScore,Source IP,Destination\
  \ IP,Connections,Avg Bytes,Intvl Range,Size Range,Top Intvl,Top Size,Top Intvl Count,Top\
  \ Size Count,Intvl Skew,Size Skew,Intvl Dispersion,Size Dispersion\n0.996,172.25.100.220,222.222.222.222,594,862,265108,432,600,318,534,569,0,0,0,0\n\
  0.834,172.25.100.100,204.79.197.200,98,152,315934,0,7,152,30,98,0,0,0,0\n0.762,172.25.100.211,52.241.128.114,1595,534,4551,0,224,534,42,1595,0,0,14,0\n\
  0.729,172.25.100.105,34.232.229.251,2517,76,267660,56,9,104,1254,1259,0.235294,0,13,0\n\
  ...\n```\n\n9. 从 RITA 的输出可以看出，ICS 网络上的一个系统（172.25.100.220）明显显示出向互联网上的一个系统（222.222.222.222）发起信标通信的迹象。RITA\
  \ 发现了 594 条连接，每条连接平均传输 862 字节，间隔为 600 秒（10 分钟）。RITA 对此的置信度评分为 0.996，满分 1。\n\n总而言之，RITA\
  \ 证实了我们之前的发现：内部机器（IP 地址 172.25.100.220）与外部 IP 地址 222.222.222.222 之间存在信标通信流量。现在是时候去看看这个系统到底是怎么回事了。\n\
  \n要探索 RITA 的更多功能或获取更多信息，请访问 https://www.activecountermeasures.com/free-tools/rita/。\n\
  \n## 可疑端点的调查/取证\n\n此时，我们将威胁狩猎调查推进到疑似受害机器。让我们快速看看能从 Security Onion 中了解关于 172.25.100.220\
  \ 的哪些信息。在 Connections 仪表板中点击 IP 地址 172.25.100.220，Kibana 会打开一个新标签页，加载指标仪表板并将该 IP\
  \ 地址作为搜索词。这个仪表板让我们能够看到关于疑似受害者的各种有趣信息：\n\n![](img/c8ffa9959721097701584fcc95101362_455_0.png)\n\
  \n图 11.18 – Security Onion – 可疑主机 – 指标仪表板\n\n一眼看去，我们可以看到数据库中与该可疑系统相关的日志类型（Dataset），以及关于源\
  \ IP、目标 IP 和目标端口的摘要小部件。\n\n## 威胁狩猎场景 1 – 恶意软件信标通信\n\n在本例中，默认的指标屏幕没有显示太多有用的信息，但我们可以让界面适应我们的需求（开始看出规律了吗？）。只需添加\
  \ **Security Onion – DNS - Queries** 数据表小部件（就像我们之前添加网络传输协议小部件那样）。这将为我们提供可疑系统发出的所有\
  \ DNS 查询的摘要。现在，如果我们按 `222.222.222.222`（我们发现的可疑 IP 地址）进行过滤，就会得到以下视图：\n\n![](img/c8ffa9959721097701584fcc95101362_456_0.png)\n\
  \n图 11.19 – Security Onion – 可疑主机 – 自定义指标视图\n\n请注意，这如何将可疑的目标 IP 地址 `222.222.222.222`\
  \ 与网站 `very-malicious-website.com` 关联起来。我们现在有了两个可靠的安全危害指标：\n\n- **IOC-1 – IP 地址：**\
  \ `222.222.222.222`\n- **IOC-2 – URL：** `very-malicious-website.com`\n\n我们可以利用已发现的**安全危害指标（IOCs）**来查找其他潜在受害者，并使用它们创建防火墙和/或\
  \ IDS 规则，以发现可疑的网络流量。\n\n由于指标仪表板清楚地显示了 HTTP 的使用情况，我想介绍的最后一个 Kibana 仪表板是 **HTTP**\
  \ 仪表板，位于 **首页 – 网络 – HTTP** 下：\n\n\n![](img/c8ffa9959721097701584fcc95101362_457_0.png)\n\
  \n现在，如果我们在搜索栏中添加搜索查询 AND `destination.ip: 222.222.222.222`，我们可以看到对可疑 IP 地址的 HTTP\
  \ 连接的详细信息：\n\n![](img/c8ffa9959721097701584fcc95101362_457_1.png)\n\n![](img/c8ffa9959721097701584fcc95101362_459_0.png)\n\
  \n图 11.24 – Security Onion – 所有用户代理\n\n没有明显的其他用户代理字符串类似于 `<host name> <os version>`\
  \ 模式的迹象。让我们继续检查可疑的工业计算机（172.25.100.220）以寻找更多线索。\n\n## 查找可疑计算机\n\n在我们从用户代理字符串中看到的\
  \ IP 地址和疑似主机名（HMI-2）之间，我们应该有足够的信息在我们的资产管理数据库中找到这台计算机。如果您需要有关可疑 IP（172.25.100.220）所属系统的一些额外线索，Home\
  \ – Network 下的 SMB 和 Kerberos 仪表板可能会有所帮助。虽然 Kerberos 对于我们正在调查的 IP 没有显示任何有趣的内容，但在\
  \ SMB 仪表板上搜索 IP 地址 172.25.100.220 为我们提供了一个主机名（惊喜，惊喜，是 HMI-2），以及被访问的一些路径（得益于我们安装的\
  \ Sysmon 和 Wazuh 组合）：\n\n![](img/c8ffa9959721097701584fcc95101362_459_1.png)\n\n\
  图 11.25 – Security Onion – 可疑主机 – SMB 详情\n\n我们现在可以识别出嫌疑系统，并可以物理登录或尝试通过远程桌面连接。不管怎样，我们都必须连接到\
  \ HMI-2 机器。\n\n## 查找信标进程 – netstat\n\n是时候弄清楚到底是什么在向 very-malicious-website.com 执行信标了。注意，对于此操作我使用了连接到\
  \ HMI-2 的远程桌面会话。\n\n弄清楚信标进程有点困难，因为使用 netstat 工具（从命令提示符运行）无法发现持续的连接：\n\n```text\n\
  C:\\Documents and Settings\\Administrator>netstat -anb\n\nActive Connections\n\n\
  Proto  Local Address      Foreign Address    State      PID\n...\nTCP    0.0.0.0:135\
  \        0.0.0.0:0          LISTENING  956\nC:\\windows\\system32\\WS2_32.dll\n\
  C:\\WINDOWS\\system32\\RPCRT4.dll\nc:\\windows\\system32\\rpcss.dll\nC:\\WINDOWS\\\
  system32\\svchost.exe\n-- unknown component(s) --\n[svchost.exe]\n...\nTCP    172.25.100.220:1036\
  \ 172.25.100.250:22 ESTABLISHED 1300\n[ telnet.exe]\n...\n```\n\n输出显示了到和来自 HMI-2\
  \ 计算机的 **ESTABLISHED** 网络连接（示例中 `telnet.exe` 连接到 `172.25.100.250`）。Netstat 还会显示刚刚断开连接的连接（**CLOSING**\
  \ 和 **CLOSE-WAIT**）以及 **LISTENING**（可能正在运行的网络服务的连接）。请参阅 `https://www.ibm.com/support/knowledgecenter/en/SSTLBW_2.1.0/com.ibm.zos.v2r1.halu101/constatus.hf?cmmc=263,264,265,271,419,420,421#13`\
  \ 了解 netstat 可以报告的所有状态的更多详细信息。然而，信标连接的持续时间非常短，除非我们幸运地在连接到命令和控制服务器的状态下或断开连接后不久捕获到连接，否则我们无法使用\
  \ netstat 工具找到我们的罪魁祸首进程。\n\n为了找到违规进程，我们将搜索系统随机访问存储器或 RAM 中的工件。在以下各节中，我们将介绍获取系统 RAM\
  \ 内容的运行状态、搜索 URL IOC very-malicious-website.com 以及找出使用此 URL 的进程。\n\n## 使用 volatility\
  \ 进行端点内存取证\n\n获取运行系统内存（RAM）内容可以通过多种方式实现：\n\n- Windows 调试工具允许转储内存内容：http://www.kuskaya.info/2013/06/20/how-to-create-a-complete-memory-dump-with-livekd-exe-without-crashing-the-server/。\n\
  - Helix 3 live CD 包含用于转储内存的工具：https://www.computersecuritystudent.com/FORENSICS/HELIX/lesson4/index.html。\n\
  - 使用虚拟化解决方案（如 Hyper-V 或 VMware）创建的内存文件：https://www.wyattroersma.com/?p=77。\n\n有更多工具和技术可用于转储系统内存，在您选择的搜索引擎中进行简单搜索即可获得大量有关适合您需求的方法的信息。对于本章的练习，我将使用我手头最方便的方法，使用\
  \ VMware Workstation 为可疑系统创建的内存文件。\n\n## VMware 虚拟机内存文件\n\n在虚拟化时代，这个场景也不算太牵强；越来越多的组织正在使用\
  \ Hyper-V 或 VMware vSphere 等虚拟化解决方案来虚拟化其（工业）计算系统。虽然在生产环境中会使用 vSphere 而不是 VMware\
  \ Workstation，但为 VM 的 RAM 内容创建的文件是相同的，主要区别在于位置将在远程服务器上，并且访问文件的方法将是通过 vSphere（ESXi）或\
  \ vCenter Web 控制台。作为示例，如何访问 vSphere 主机上的文件，请阅读文章 https://www.virtualizationhowto.com/2017/03/four-ways-to-upload-files-to-vmware-vsphere-datastore/。\n\
  \n为了从 VMware Workstation 获取可疑工业系统（HMI-2）的 RAM 文件，我们需要先在 VMware Workstation 中暂停该\
  \ VM：\n\n![](img/c8ffa9959721097701584fcc95101362_462_0.png)\n\n作为来宾操作系统挂起活动的一部分，VMware\
  \ 会将所有运行的内存内容存储为扩展名为 .VMEM 的文件，与该 VM 文件夹中的其他虚拟机文件一起存放。我们将把 hmi-2.vmem 文件复制到专门为恶意软件分析和计算机取证设计的虚拟机\
  \ REMnux 上。\n\n## REMnux 恶意软件分析和计算机取证 VM\n\n以下内容摘自 REMnux 网站，https://remnux.org/：“REMnux\
  \ 是一个用于逆向工程和分析恶意软件的 Linux 工具包。REMnux 提供社区创建的免费工具的精选集合。分析人员可以使用它来调查恶意软件，而无需查找、安装和配置工具。”\n\
  \n我们将使用 REMnux VM 来调查我们为 HMI-2 计算机收集的内存转储。从其网站下载并安装 REMnux VM，并将 hmi-2.vmem 文件复制到正在运行的\
  \ REMnux 机器上的文件夹中：\n\n![](img/c8ffa9959721097701584fcc95101362_463_0.png)\n\n将内存转储复制到\
  \ REMnux 机器后，我们可以使用一个名为 **Volatility Framework** 的工具开始搜索工件。Volatility Framework（https://www.volatilityfoundation.org/）提供了一组用\
  \ Python 实现的开源工具，用于帮助从易失性内存（RAM）映像（样本）中提取数字工件。该框架支持所有主要 32 位和 64 位 Windows、Linux\
  \ 和 Mac 操作系统的内存映像。请查看其网站了解更多详细信息。\n\nVolatility Framework 已预装在 REMnux VM 中，无需额外添加。为了熟悉其功能，让我们运行一些命令。\n\
  \n请参阅 `https://www.howtoforge.com/tutorial/how-to-install-and-use-volatility-memory-forensic-tool/`\
  \ 了解 Volatility 入门教程。\n\n以下命令将为我们提供所使用内存映像的详细信息（信息） - `imageinfo`：\n\n```text\n\
  remnux@remnux:~/workdir$ vol.py -f HMI-2.vmem imageinfo \nVolatility Foundation\
  \ Volatility Framework 2.6.1 \nINFO : volatility.debug : Determining profile based\
  \ on KDBG search... \nSuggested Profile(s) : WinXPSP2x86, WinXPSP3x86 \n(Instantiated\
  \ with WinXPSP2x86) \nAS Layer1 : IA32PagedMemoryPae (Kernel AS) \nAS Layer2 : FileAddressSpace\
  \ (/home/remnux/workdir/HMI-2.vmem) \nPAE type : PAE \nDTB : 0x31c000L \nKDBG :\
  \ 0x80544ce0L \nNumber of Processors : 1 \nImage Type (Service Pack) : 2 \nKPCR\
  \ for CPU 0 : 0xffdff000L \nKUSER_SHARED_DATA : 0xffdf0000L \nImage date and time\
  \ : 2020-09-24 00:27:10 UTC+0000 \nImage local date and time : 2020-09-23 18:27:10\
  \ -0600 \n```\n\n在命令中，`-f` 告诉 volatility 内存转储文件的位置，而 `imageinfo` 是要在该内存转储上运行的插件。正如您所见，Volatility\
  \ 检测到我们从中提取内存映像的 OS/计算机的一些系统特定信息。最重要的信息是 Volatility 为映像建议的配置文件。配置文件是必须添加到后续命令中的，以便\
  \ Volatility 使用正确的内存位置和提取技术来获取我们要查找的信息。\n\n\n\n\n\n与之前命令的主要区别在于增加了profile声明`--profile=WinXPSP2x86`，告诉Volatility这个内存转储来自32位Windows\
  \ XP Service Pack 2系统。`pslist` Volatility插件的输出向我们展示了内存转储时系统正在运行哪些进程。它还显示了发现痕迹的内存映像偏移量，以及痕迹特有的详细信息，如进程ID（PID）、父进程ID（PPID）、进程句柄、线程、会话，以及进程启动和退出时间（如果已知）。高亮显示的`telnet.exe`进程是我们在本章前面的`netstat`命令中观察到的那个进程。它仅用作整体说明的示例，对我们的调查结果没有进一步影响。\n\
  \n为了说明进程之间如何关联，考虑一下`telnet.exe`进程，它的PID为1300（稍后用于与其他痕迹关联），PPID为472。从输出中，我们可以看到`telnet`的父进程PID\
  \ 472与`cmd.exe`进程（在上方一行）关联。而`cmd.exe`进程的PPID为176，指向`explorer.exe`进程，即用户环境所运行的进程（用户shell）。最后要指出的一点是，`explorer.exe`进程的PPID为2020，但不存在具有该PID的进程。这种情况发生在父进程在子进程启动后被终止时。这有时可能表明可疑行为，具体取决于子进程是什么。另一个有助于说明进程间父子关系的Volatility插件是`pstree`，如下所示：\n\
  \n```\nremnux@remnux:~/workdir$ vol.py -f HMI-2.vmem --profile=WinXPSP2x86 pstree\n\
  Volatility Foundation Volatility Framework 2.6.1\nName                         \
  \ Pid  PPid  Thds  Hnds  Time\n------------------------------ ---- ---- ----- ----\
  \ ----\n0x823c8830:System                     4     0\n57     248 1970-01-01 00:00:00\
  \ UTC+0000\n. 0x821acda0:smss.exe                 376     4\n3      21 2020-09-24\
  \ 01:00:18 UTC+0000\n.. 0x82132020:winlogon.exe            556   376\n18     543\
  \ 2020-09-24 01:00:18 UTC+0000\n... 0x82204020:services.exe           696   556\n\
  16     271 2020-09-24 01:00:18 UTC+0000\n...\n```\n\n注意系统进程是`smss.exe`进程的父进程，而`smss.exe`又是`winlogon.exe`进程的父进程，依此类推。\n\
  \n接下来我们要介绍的Volatility插件是用于显示套接字的`sockets`：\n\n```\nremnux@remnux:~/workdir$ vol.py\
  \ -f HMI-2.vmem --profile=WinXPSP2x86 sockets\nVolatility Foundation Volatility\
  \ Framework 2.6.1\nOffset(V)      PID  Port  Proto Protocol          Address\nCreate\
  \ Time\n---------- ---------- ------ ------ ------------ ------------\n--- --- \n\
  0x822d4b40      708    500    17 UDP             0.0.0.0\n2020-09-24 01:00:26 UTC+0000\n\
  0x81b4d9a8     1152   1900    17 UDP\n172.25.100.220 2020-09-24 01:00:31 UTC+0000\n\
  0x822c4e98        4    445     6 TCP             0.0.0.0\n2020-09-24 01:00:17 UTC+0000\n\
  0x81b68390      956    135     6 TCP             0.0.0.0\n2020-09-24 01:00:18 UTC+0000\n\
  0x81f9e6e8        4    139     6 TCP\n172.25.100.220 2020-09-24 01:00:18 UTC+0000\n\
  ...\n0x81b5fe98      708   4500    17 UDP             0.0.0.0\n2020-09-24 01:00:26\
  \ UTC+0000\n0x81b62570     1300   1036     6 TCP\n172.25.100.250          2020-09-26\
  \ 17:15:42 UTC+0000\n0x821a7128        4    445    17 UDP             0.0.0.0\n\
  2020-09-24 01:00:17 UTC+0000\n```\n\n该命令显示了HMI-2计算机在我们创建内存镜像时所建立的（活动）网络连接（套接字）。大多数是内部（回环）连接，但我们也可以看到一条到172.25.100.250（Security\
  \ Onion VM）的TCP端口22（SSH）连接，创建于9月26日17:15:42，由ID为1300的进程（我们之前看到的`telnet.exe`进程）发起。\n\
  \n在内存转储文件中查找活动连接的第二种方法是使用`connections`命令：\n\n```\nremnux@remnux:~/workdir$ vol.py\
  \ -f HMI-2.vmem\n--profile=WinXPSP2x86 connections\nVolatility Foundation Volatility\
  \ Framework 2.6.1\nOffset(V)  Local Address          Remote Address\nPid\n...\n\
  ```\n\n```\n...\nRule: r1\nOwner: Process svchost.exe Pid 1040\n0x0352732c 6d616c69636f6f75732d7765622736974\
  \ malicious-websit\n0x0352733c 652e636f6d2f73657276652e68746d6c e.com/serve.html\n\
  ...\nRule: r1\nOwner: Process svchost.exe Pid 1040\n0x1000602d 6d616c69636f6f75732d7765622736974\
  \ malicious-websit\n0x1000603d 652e636f6d000000000000000000000000 e.com..........\n\
  ...\n```\n\n我们在这里看到的是Volatility检测到内存中几处存储“malicious”文本的位置。注意，所有出现位置都在同一个所有者——PID为1040的`svchost.exe`进程——的内存地址范围内。Windows将`svchost.exe`进程用作Windows服务的宿主进程。那么，让我们使用`svcscan`\
  \ Volatility命令看看能否在内存转储中找到可疑服务：\n\n```\nremnux@remnux:~/workdir$ vol.py -f HMI-2.vmem\
  \ --profile=WinXPSP2x86 svcscan | grep 1040 -B3 -A5\nVolatility Foundation Volatility\
  \ Framework 2.6.1\nOffset: 0x662ac8\nOrder: 23\nStart: SERVICE_AUTO_START\nProcess\
  \ ID: 1040\nService Name: AudioSrv\nDisplay Name: Windows Audio\nService Type: SERVICE_WIN32_SHARE_PROCESS\n\
  Service State: SERVICE_RUNNING\nBinary Path: C:\\WINDOWS\\System32\\svchost.exe\
  \ -k netsvcs\n--\nOffset: 0x662cf8\nOrder: 27\nStart: SERVICE_AUTO_START\nProcess\
  \ ID: 1040\nService Name: Browser\nDisplay Name: Computer Browser\nService Type:\
  \ SERVICE_WIN32_SHARE_PROCESS\nService State: SERVICE_RUNNING\nBinary Path: C:\\\
  WINDOWS\\System32\\svchost.exe -k netsvcs\n--\nOffset: 0x6634c0\nOrder: 41\nStart:\
  \ SERVICE_AUTO_START\nProcess ID: 1040\nService Name: CryptSvc\nDisplay Name: Cryptographic\
  \ Services\nService Type: SERVICE_WIN32_SHARE_PROCESS\nService State: SERVICE_RUNNING\n\
  Binary Path: C:\\WINDOWS\\System32\\svchost.exe -k netsvcs\n--\nOffset: 0x663678\n\
  Order: 44\nStart: SERVICE_AUTO_START\nProcess ID: 1040\nService Name: Dhcp\nDisplay\
  \ Name: DHCP Client\nService Type: SERVICE_WIN32_SHARE_PROCESS\nService State: SERVICE_RUNNING\n\
  Binary Path: C:\\WINDOWS\\System32\\svchost.exe -k netsvcs\n...\n```\n\n当我们运行此命令时，我们会看到一长串服务，它们都使用PID为1040的宿主进程`svchost.exe`。这是旧版Windows系统中的常见细微差别（Windows\
  \ 7及更高版本在限制每个宿主进程实例托管的服务数量方面做得更好）。服务通过`svchost`等宿主进程实现的最常见方式是让宿主进程加载一个包含所有服务代码的dll（动态链接库的简称），因此，让我们使用`dlllist`\
  \ Volatility命令查看进程1040加载的所有dll：\n\n```\nremnux@remnux:~/workdir$ vol.py -f HMI-2.vmem\
  \ --profile=WinXPSP2x86 dlllist -p 1040\nVolatility Foundation Volatility Framework\
  \ 2.6.1\n****************************************************************\n********\n\
  svchost.exe pid: 1040\n\nCommand line : C:\\WINDOWS\\System32\\svchost.exe -k netsvcs\n\
  \nService Pack 2\n\nBase          Size     LoadCount LoadTime\nPath\n----------\
  \ ---------- ---------- -------------------------------------------\n-- ----\n0x01000000\
  \   0x6000     0x1ffff\nC:\\WINDOWS\\System32\\svchost.exe\n0x7c900000   0xb0000\
  \    0x1ffff\nC:\\WINDOWS\\system32\\ntdll.dll\n0x7c800000   0xf4000    0x1ffff\n\
  C:\\WINDOWS\\system32\\kernel32.dll\n0x77d00000   0x9b000    0x1ffff\nC:\\WINDOWS\\\
  system32\\ADVAPI32.dll\n0x77e70000   0x91000    0x1ffff\nC:\\WINDOWS\\system32\\\
  RPCRT4.dll\n0x774e0000   0x13c000   0x9b\nC:\\WINDOWS\\system32\\ole32.dll\n0x77c10000\
  \   0x58000    0x2b5\nC:\\WINDOWS\\system32\\msvcrt.dll\n0x77120000   0x8c000  \
  \  0x68\nC:\\WINDOWS\\system32\\OLEAUT32.dll\n0x77c00000   0x8000     0x23\nC:\\\
  WINDOWS\\system32\\VERSION.dll\n0x7c9c0000   0x814000   0xf\nC:\\WINDOWS\\system32\\\
  SHELL32.dll\n0x77f60000   0x76000    0x40\nC:\\WINDOWS\\system32\\SHLWAPI.dll\n\
  ...\n```\n\n同样，我们面对的是一大串命令输出。该进程加载了大量dll；这是一个繁忙的服务宿主进程。如果我们仔细查看输出，可以看到每个dll都加载在各自的内存区域中；并且，回顾之前的字符串搜索，每个出现也都对应一个内存位置。我们将把两者关联起来：在dll列表中搜索加载内存位置与已发现字符串位置（这些位置以0x00、0x01、0x03和0x10开头）重叠的条目：\n\
  \n```\nremnux@remnux:~/workdir$ vol.py -f HMI-2.vmem\n--profile=WinXPSP2x86 dlllist\
  \ -p 1040 | grep 0x00\nVolatility Foundation Volatility Framework 2.6.1\nremnux@remnux:~/workdir$\
  \ vol.py -f HMI-2.vmem\n--profile=WinXPSP2x86 dlllist -p 1040 | grep 0x01\nVolatility\
  \ Foundation Volatility Framework 2.6.1\n0x01000000    0x6000    0xffff\nC:\\WINDOWS\\\
  System32\\svchost.exe\nremnux@remnux:~/workdir$ vol.py -f HMI-2.vmem\n--profile=WinXPSP2x86\
  \ dlllist -p 1040 | grep 0x03\nVolatility Foundation Volatility Framework 2.6.1\n\
  remnux@remnux:~/workdir$ vol.py -f HMI-2.vmem\n--profile=WinXPSP2x86 dlllist -p\
  \ 1040 | grep 0x10\nVolatility Foundation Volatility Framework 2.6.1\n0x73d0000\
  \     0x102000    0x9\nC:\\WINDOWS\\WinSxS\\x86_Microsoft.Windows.Common-Controls_6595b64\n\
  144ccf1df_6.0.2600.2180_x-ww_a84f1ff9\\comctl32.dll\n0x76360000    0x10000     0x11\n\
  C:\\WINDOWS\\System32\\WINSTA.dll\n0x76f20000    0x27000     0x10\nc:\\windows\\\
  system32\\DNSAPI.dll\n0x606b0000    0x10d000    0x4\nc:\\windows\\system32\\ESENT.dll\n\
  0x10000000   0x13000     0x1\nc:\\windows\\temp\\ipripa.dll\n0x73030000    0x10000\
  \     0x1\nc:\\windows\\system32\\WZCSAPI.DLL\nremnux@remnux:~/workdir$\n```\n\n\
  \n\n## 命令 vol.py -f HMI-2.vmem --profile=WinXpSP2x86 dlllist -p 1040 | grep 0x00\n\
  \n命令 `vol.py -f HMI-2.vmem --profile=WinXpSP2x86 dlllist -p 1040 | grep 0x00` 使用\
  \ Volatility 的 `dlllist` 插件来显示从 HMI-2 内存转储中 PID 为 1040 的进程 `-p 1040` 加载的所有 DLL。我们随后使用\
  \ grep（Linux 工具，用于按特定模式过滤输出）来搜索输出中 DLL 加载位置的内存位置前四位数字，并将其与发现 **恶意** 字符串出现的位置的内存位置进行比较。例如，`grep\
  \ 0x01` 只会显示 Volatility 命令的输出中包含字符串 `0x01` 的部分。这将向我们展示在恶意字符串 `0x011cee57d` 内存位置附近加载的\
  \ DLL。\n\n只有一个位置，字符串的地址落在 `svc host.exe` 进程加载的 DLL 的地址空间内。相关 DLL 为 **ipripa.dll**，其加载地址为\
  \ `0x10000000`，大小为 `0x13000`：\n\n```text\n0x10000000  0x13000  0x1\nC:\\Windows\\\
  temp\\ipripa.dll\n```\n\n恶意字符串出现位置的内存位置完全落在 DLL 的地址空间内：\n\n| Rule: r1 | |\n| :---\
  \ | :--- |\n| Owner: Process svc host.exe Pid 1040 | |\n| **0x1000602d** | 6d616c6963696f75732d776562736974\
  \ | malicious-websit |\n| **0x1000603d** | 652e636f6d000000000000000000000000000\
  \ | e.com... |\n\n此外，DLL 的加载位置也非常可疑：`c:\\windows\\temp\\ipripa.dll`。通常，DLL 不会从临时文件夹加载；这总是可疑的！\n\
  \n那么，让我们获取 DLL 的副本以便进一步分析。这可以通过 Volatility `dlldump` 插件实现：\n\n```text\nremux@remux:~/workdir$\
  \ vol.py -f HMI-2.vmem --profile=WinXpSP2x86 dlldump -p 1040 -b 0x10000000 --dump-dir\
  \ ./\n\nVolatility Foundation Volatility Framework 2.6.1\nProcess(V) Name Module\
  \ Base Module Name Result\n----  -------------  ----------------  ----------\n--\
  \  ----\n0x820deb88 svc host.exe  0x01000000 ipripa.dll OK: module.1040.22deb88.10000000.dll\n\
  ```\n\n有了它，我们就有了可疑的可执行代码的副本供我们进一步探索。作为快速检查以验证我们是否提取了正确的内存部分，让我们看看恶意字符串是否出现在 DLL\
  \ 中：\n\n```text\nremnux@remnux:~/workdir$ strings module.1040.22deb88.10000000.dll\
  \ | grep malicious -b\n1445:very-malicious-website.com\n```\n\n这是一个很好的迹象，表明我们获得了正确的\
  \ DLL。`strings` 命令显示 `very-malicious-website.com` URL 在偏移量 1445 处出现（位置由 `grep` 命令的\
  \ `-b` 标志添加 – 字节偏移）。为了了解我们在这里处理的是什么，让我们接下来更仔细地看看这个可执行文件在做什么。让我们进行下一步的恶意软件分析。\n\n\
  ## 上传可执行文件到 VirusTotal\n\n我们将通过将 DLL 发送到 VirusTotal 来开始恶意软件分析，以查看可执行文件是否有任何已知的检测结果。打开网络浏览器，导航到\
  \ https://www.virustotal.com/gui/ 并上传 DLL 进行分析：\n\n![](img/c8ffa9959721097701584fcc95101362_474_0.png)\n\
  \n图 11.28 – 提取的 DLL 的 VirusTotal 结果\n\n我认为这是一个相当好的迹象，表明 DLL 是恶意的。我们现在已经有了入侵者的几个名称和分类，可以利用这些信息找到具体细节并发现任何额外的\
  \ IOC，以帮助我们找到其他可能受感染的机器。相反，我想带你进入恶意软件分析的其余过程，以展示如何自行发现任何（额外的）入侵指标。\n\n## 对可疑可执行文件进行初步检查\
  \ – 恶意软件分析 101\n\n请记住，以下步骤和程序仅用于说明恶意软件分析的整体过程，绝不意味着用作详细的恶意软件分析教程。本书无意深入到如此程度，但对学习恶意软件逆向工程这一迷人学科感兴趣的人应购买\
  \ Michael Sikorski 所著的《Practical Malware Analysis: The Hands-On Guide to Dissecting\
  \ Malicious Software》一书。\n\n从根本上说，恶意软件分析有两种方法或阶段：静态分析和动态分析。前者让我们在不运行恶意软件的情况下查看它，只是为了看看是否能找到有关恶意软件行为的线索或提示。后者是一种更危险的方法，让我们运行恶意软件并查看恶意软件运行的环境，以查看恶意软件所做的更改或留下的痕迹。让我们从静态分析之旅开始。我们将使用\
  \ REMnux VM 进行恶意软件分析之旅。\n\n### 静态分析\n\n通过静态分析，我们旨在发现有关恶意软件的细节、信息和具体内容，从而洞察其预期用途。有许多方法可以从恶意软件中获取这些数据；我们将查看三种常用的技术：转储恶意软件的字符串、查看其导入和导出表，以及对恶意软件可执行文件（字节或二进制）代码进行反汇编以显示其程序流程。\n\
  \n## Strings\n\n可执行文件通常使用文本片段（字符串）来执行其功能。无论是按钮的名称还是 **图形用户界面 (GUI)** 的标题，甚至是正在检索的\
  \ URL 或文件位置，所有这些字符串都会为我们提供有关可执行文件可以做什么的线索。大多数 Linux 发行版都配备了一个用于从文件中提取字符串的工具，恰好命名为\
  \ `strings`。让我们在用 Volatility 提取的 DLL 上运行 `strings` 工具：\n\n```text\nremnux@remnux:~/workdir$\
  \ strings module.1040.22deb88.10000000.dll\n\n!This program cannot be run in DOS\
  \ mode.\n...\nSleep\nRegisterServiceCtrlHandlerA\nRegSetValueExA\nRegCreateKeyA\n\
  CloseServiceHandle\nCreateServiceA\nOpenSCManagerA\nRegCloseKey\nRegQueryValueExA\n\
  RegOpenKeyExA\nDeleteService\nOpenServiceA\nWS2_32.dll\nInternetReadFile\nHttpQueryInfoA\n\
  HttpSendRequestA\nHttpOpenRequestA\nInternetConnectA\nInternetOpenA\nWININET.dll\n\
  very-malicious-website.com\nserve.html\nWindows XP 6.11\nCreateProcessA\nDepends\
  \ IN+\\ Collects and stores network configuration and\nlocation information, and\
  \ notifies applications when this information changes.\nOpenSCManager()\nRegQueryValueEx(Svchost\\\
  netsvcs)\nnetsvcs\nRegOpenKeyEx(%s) KEY_QUERY_VALUE success.\nRegOpenKeyEx(%s) KEY_QUERY_VALUE\
  \ error.\nSOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Svchost\nIPRIP\n...\n\
  ```\n\n前面的输出被删减为仅显示有趣的字符串，并为简洁起见而剪裁。我们可以看到引用 Windows API 调用的字符串，这些调用指示服务控制（创建、删除、启动和停止）：\n\
  \n- CreateServiceA\n- OpenSCManagerA\n- DeleteService\n- OpenServiceA\n\n有指示 Windows\
  \ 注册表操作的字符串：\n\n- RegSetValueExA\n- RegCreateKeyA\n- RegCloseKey\n- RegQueryValueExA\n\
  - RegOpenKeyExA\n\n我们还可以看到与互联网交互的迹象：\n\n- WS2_32.dll\n- InternetReadFile\n- HttpQueryInfoA\n\
  - HttpSendRequestA\n- HttpOpenRequestA\n- InternetConnectA\n- InternetOpenA\n\n\
  我们将再次使用 `pedump` 实用程序，这次使用 `-E` 标志列出导出：\n\n```text\nremnux@remnux:~/workdir$ pedump\
  \ -E module.1040.22deb88.10000000.dll\n\n=== EXPORTS ===\n# module \"ipripa.dll\"\
  \n# flags=0x0  ts=\"2010-09-28 01:00:25\"  version=0.0  ord_base=1\n# nFuncs=5 \
  \ nNames=5\n\n  ORD ENTRY VA   NAME\n      1     4706 Install\n      2     3196\
  \ ServiceMain\n      3     4b18 UninstallService\n      4     4b0b installA\n  \
  \    5     4c2b uninstallA\n```\n\n导出列表比此 DLL 的导入列表小得多。这里有一些有趣的条目。首先，我们在内存中运行时观察到的模块名称\
  \ `ipripa.dll`。我们还可以看到模块的编译日期和版本号。然后实际的导出条目显示序数号（函数可以通过名称或序数号调用）、模块中函数代码开始的偏移量（VA\
  \ 或虚拟地址）以及名称。我们将在下一节中使用导出详细信息，当我们使用 IDA Pro 反汇编器——任何认真逆向工程师或恶意软件分析师的首选工具——仔细查看代码时。\n\
  \n## 使用 IDA Pro 反汇编恶意软件代码\n\n在前面的部分中，我们查看了从 HMI-2 中提取的恶意软件 DLL 的一些静态工件。现在我们将把事情提升一个档次，使用反汇编器尝试检索恶意软件的部分原始代码。\n\
  \n以下是对计算机程序如何从文本文件转换为可执行文件的非常高层次的解释。它并非旨在对该主题进行彻底讨论，只是为了指出理解本节最重要的部分。\n\n\n\n\n\
  用编译型代码编程语言（如 C、C++、Delphi 等）编写的计算机程序需要经过**编译过程**。这个过程会将易于阅读的源代码编译成目标处理器能够理解和执行的汇编代码。汇编代码随后会被汇编器针对目标平台进一步优化，转换为机器代码，此时只有计算机才能理解其含义。现在，将机器代码还原回源代码是一个困难的过程，只有专用工具才能部分完成这项工作。原始代码的细微差别，例如注释、变量名称等，在转换过程中会丢失，并且需要以某种方式重建。将机器代码转换为汇编代码要容易得多，并且可以使用反汇编器实现。有多种类型的反汇编器，实现了各种技术来恢复机器代码，关于各种类型和技术的讨论超出了本书的范围，并且可能会让你感到枯燥乏味。\n\
  \n为了初步了解恢复的机器代码，我们将讨论 IDA Pro 反汇编器。你可以从 `https://www.hex-rays.com/products/ida/support/download_freeware/`\
  \ 下载 IDA Pro 免费版本。这个版本缺少完整产品中的许多高级功能，但对于我们入门已经足够了。\n\n欲了解有关如何使用 Ida Pro 的更多信息和教程，请访问\
  \ `https://resources.infosecinstitute.com/topic/basics-of-ida-pro-2/.`\n\n我们将在 REMnux\
  \ 虚拟机上安装 IDA Pro 免费版。请按照以下步骤操作以安装并运行 IDA Pro：\n\n- 1. 从 Hex-Rays 网站下载 Linux 版本到虚拟机，并运行以下命令进行安装：\n\
  \n```\nremnux@remnux:~/workdir$ cd ~/Downloads/\nremnux@remnux:~/Downloads$ ls\n\
  idafree70_linux.run\nremnux@remnux:~/Downloads$ chmod +x idafree70_linux.run\nremnux@remnux:~/Downloads$\
  \ sudo ./idafree70_linux.run\n```\n\n- 2. 现在，请按照安装程序的说明在 REMnux 虚拟机上安装 IDA Pro：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_482_0.png)\n\n- 3. 导航到 /opt/idafree-7.0/\
  \ 并运行以下命令即可运行 IDA Pro：\n\n```\nremnux@remnux:/opt/idafree-7.0$ ./ida64\n```\n\n\
  - 4. 这将显示 IDA 的初始界面，允许我们开始使用这个出色的工具：\n\n![](img/c8ffa9959721097701584fcc95101362_482_1.png)\n\
  \n在前面的图中，我们可以看到 IDA Pro 的四个主要界面区域。区域 1 是函数屏幕；这里列出了 IDA Pro 发现的程序子例程。在区域 2，我们可以看到当前查看的子例程的总体结构图；此面板中有一个可拖动的正方形，允许我们快速浏览函数（子例程）。区域\
  \ 3，视图，显示当前子例程的内部信息；它展示了 IDA 成功反汇编的代码，以及它在反汇编过程中添加的所有标记和注释，以帮助使事情更清晰。你可以通过选择将视图作为焦点（在区域\
  \ 3 中点击某处）并按空格键来改变子例程的显示方式。这允许我们以**功能块图**或代码**列表**的形式查看子例程：\n\n![](img/c8ffa9959721097701584fcc95101362_484_0.png)\n\
  \n图 11.32 – IDA Pro – 切换反汇编视图\n\n此 GUI 中的最后一个区域，即区域 4，是输出窗口，其中显示了与程序交互过程中的事件和信息。此区域也是脚本输入部分。IDA\
  \ Pro 支持通过其自身的 IDC 引擎进行脚本编写，也支持 Python（尽管免费版本仅限于 IDC）。我们在对 IDA 的简要概述中不会使用脚本，但该功能使该工具更加多功能。\n\
  \n## 恶意软件如何安装\n\n是时候看看这家伙能做什么了……细心的读者可能已经注意到了函数窗口，其中包含之前在我们的字符串和导出分析中出现的名称的函数。有名为\
  \ `Install` 和 `InstallA` 的函数。它们是开始我们调查的良好起点。\n\n查看这两个函数，我们看到 `InstallA` 仅仅是 `Install`\
  \ 的包装器：\n\n![](img/c8ffa9959721097701584fcc95101362_485_0.png)\n\n图 11.33 – 恶意软件\
  \ – InstallA 例程\n\n当我们检查 `Install` 函数时，我们可以看到一堆代码，乍一看可能像一堆胡言乱语。熟悉逆向工程（恶意）代码需要时间，我肯定无法在这个简短的章节中让你成为专家；然而，在许多情况下，能够在这类练习中找到一般模式就足够了。了解可执行文件意图的一个良好策略是跟踪调用。通过查看可执行文件发出的（API）调用，你可以推断它试图做什么。滚动浏览可执行代码，我们看到调用了我们在字符串和导入分析中看到的注册表函数：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_485_1.png)\n\n图 11.34 – 恶意软件 – Windows\
  \ 注册表函数\n\n这部分内容告诉我们，该子例程试图打开 `SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\\
  Svchost` 注册表项，如果该注册表项不存在，它将退出（抛出异常）。该可执行文件对位于 `Svchost` 键下的 `netvscs` 注册表值感兴趣，因为这是代码下一部分的目的。如您所注意，代码并不难以阅读；你可以通过\
  \ API 调用的名称推断其目的，或者通过在线快速搜索获取更多信息。此外，IDA Pro 会在 API 调用周围的参数和其他信息部分添加注释，帮助你查看哪些被用作调用参数和变量。如果你遇到想要知道其值的变量（且提示被截断），你可以双击变量名以跳转到声明处，如下图中所示的\
  \ `SubKey` 参数：\n\n![](img/c8ffa9959721097701584fcc95101362_486_0.png)\n\n图 11.35\
  \ – 恶意软件 – 查看字符串内容\n\n如果我们使用**跟踪调用**技术浏览 `Install` 子例程的其余部分，我们可以看到恶意软件如何通过 `SCManager`（服务管理器接口）创建服务：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_486_1.png)\n\n图 11.36 – 恶意软件 – 服务创建\n\
  \n注意服务名称 (lpServiceName) 如何与 [ebp+Str2] 变量相关联，该变量在程序早期被设置为 IPRIP：\n\n![](img/c8ffa9959721097701584fcc95101362_487_0.png)\n\
  \n*图 11.37 – 恶意软件 – 服务名称变量*\n\n如果在受感染的计算机（HMI-2）上查找此服务，我们看到它已安装并正在运行：\n\n```\nC:\\\
  Documents and Settings\\Administrator>sc query iprip\n\nSERVICE_NAME: iprip\n  \
  \      TYPE               : 20  WIN32_SHARE_PROCESS\n        STATE             \
  \ : 4  RUNNING\n                             (STOPPABLE, PAUSABLE, ACCEPTS_\nSHUTDOWN)\n\
  \        WIN32_EXIT_CODE    : 0  (0x0)\n        SERVICE_EXIT_CODE  : 0  (0x0)\n\
  \        CHECKPOINT         : 0x0\n        WAIT_HINT          : 0x0\nC:\\Documents\
  \ and Settings\\Administrator>\n```\n\n我们刚刚发现了另一个 IOC：\n\n- **IOC-5 – 服务名称：** `IPRIP`\n\
  \n在该子例程的下一部分，我们可以看到恶意软件设置特定于服务的注册表值，例如名称、描述、映像路径（我们正在检查的 dll 的当前位置）以及其他特定于服务的详细信息，例如启动类型、权限等。设置完所有内容后，子例程退出。如果所有代码都成功执行，服务将按以下特定项安装：\n\
  \n- **服务名称：** `IPRIP`\n- **显示名称：** `Intranet Network Awareness (INA+)`\n- **描述：**\
  \ 依赖于 INA+，收集和存储网络配置和位置信息，并在此信息更改时通知应用程序。\n\n\n\n\n\n我们可以在 HMI-2 计算机上的服务管理器中看到这些细节：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_488_0.png)\n\n图 11.38 – HMI-2 – IPRIP\
  \ 服务\n\n我们现在知道恶意软件是如何被安装的。即使我们在日志中没有看到实际的安装事件，请记住我们在感染发生后才开始记录事件和网络详情；我们知道 dll 必须在服务主机内运行并使用导出的函数\
  \ Install 来安装自身。因此很可能恶意软件是通过辅助函数 rundll32.exe 安装的，rundll32.exe 是 Windows 原生实用程序，允许将\
  \ dll 作为可执行文件（.exe）运行。安装此恶意软件的完整命令看起来会像以下这样（这也是我们应该注意的另一个 IOC，因为它可能会出现在某个日志中）：\n\
  \n- IOC-6 – 恶意软件安装命令：`rundll32.exe <dll-name>,Install (A)`\n\n## 服务的功能是什么？\n\n现在是时候看看恶意软件实际做了什么了。为此，我们需要查看\
  \ ServiceMain 例程。摘自 https://docs.microsoft.com/en-us/windows/win32/services/service-servicemain-function，ServiceMain\
  \ 是在服务启动后调用的子例程。查看此子例程，我们看到它调用了 Microsoft 文章中概述的初始化 API：\n\n![](img/c8ffa9959721097701584fcc95101362_489_0.png)\n\
  \n图 11.39 – 恶意软件 – ServiceMain 例程\n\n服务初始化后，子例程休眠 0x0EA60 毫秒 – 60,000 ms 或 1 分钟。然后\
  \ ServiceMain 函数调用两个自定义子例程，sub_1000321A 和 sub_10003286。其中第一个函数 – sub_1000321A –\
  \ 似乎在调用 ws2_32.dll 模块中的一些函数，该模块包含 Windows socket API 函数：\n\n![](img/c8ffa9959721097701584fcc95101362_490_0.png)\n\
  \n图 11.40 – 恶意软件 – WinSock API 调用\n\n恶意软件调用函数的方式有点令人困惑。它调用 `WS2_32_115`，例如，这并不能透露太多实际被调用的函数。如果您还记得我们关于导出和导入的讨论，dll\
  \ 中的函数可以通过名称或序号调用，所以让我们看看 ws2_32.dll 导出的函数是什么（从 REMnux VM 运行）：\n\n```\nremnux@remnux:~/workdir$\
  \ pedump ws2_32.dll -E\n=== EXPORTS ===\n# module \"WS2_32.dll\"\n# flags=0x0  ts=\"\
  2004-08-04 06:14:50\"  version=0.0  ord_base=1\n# nFuncs=500  nNames=117\n\nORD\
  \ ENTRY_VA NAME\n1 11028 accept\n```\n\n我们感兴趣的三个函数是 `WS2_32_115`、`WS2_32_57` 和 `WS2_32_116`，表示我们感兴趣的序号是\
  \ `115`、`57` 和 `116`。dll 导出列表中的序号为十六进制，因此当我们将十进制转换为十六进制时，我们正在寻找以下函数：\n\n- 115 –\
  \ 0x73 – `WSAStartup`\n- 57 – 0x39 – `gethostname`\n- 116 – 0x74 – `WSACleanup`\n\
  \n这一系列函数是对 ws2_32.dll 模块的典型使用。`WSAStartup` 初始化了该模块。现在导入程序可以使用其功能。最后，`WSACleanup`\
  \ 函数表示程序已完成对该模块的使用。\n\n因此，简而言之，`sub_1000321A` 所做的是获取计算机主机名。如果您将对所调用函数的了解与输出中可以看到的另一个字符串\
  \ **Windows XP 6.11** 结合起来，您的头顶现在应该亮起一盏灯，主机名为 `HMI-2`，结合该字符串后得到 `HMI-2 Windows XP\
  \ 6.11`，这就是我们在网络监控日志中看到的用户代理字符串。\n\n我们应该将有些晦涩的子例程名称更改为更具说明性的名称以帮助整体分析。我们可以通过单击视图窗格顶部的子例程名称并按\
  \ N 键来更改此设置：\n\n![](img/c8ffa9959721097701584fcc95101362_492_0.png)\n\n图 11.41 –\
  \ IDA Pro – 重命名函数\n\n将子例程重命名为类似 `GenerateUserAgentString` 的名称。我们现在可以更轻松地跟踪程序流程：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_492_1.png)\n\n图 11.42 – 恶意软件 – GenerateUserAgentString\
  \ 例程\n\n现在，要看看 sub_10003286 藏了什么，让我们查看（双击子例程名称）其函数：\n\n![](img/c8ffa9959721097701584fcc95101362_493_0.png)\n\
  \n图 11.43 – 恶意软件 – sub_10003286\n\n此子例程相当直接，尽管在子例程声明之前有大量额外代码令人有点困惑。有时您只需继续前进而不必太关注所有额外的代码路径，否则很容易在试图弄清每一个细节时迷失方向。您可以在了解有关整体可执行代码的更多信息后随时回来审查该部分。因此，现在让我们继续并查看\
  \ sub_1000454E：\n\n![](img/c8ffa9959721097701584fcc95101362_493_1.png)\n\n图 11.44\
  \ – 恶意软件 – beaconing 函数\n\n代码似乎对下载的文件没有什么作用，它只是无限重复下载。我们将在下一节中通过在 HMI-2 计算机上调试正在运行的恶意软件样本来验证这一点。\n\
  \n因此，总结来说，恶意软件一旦作为服务安装，就会通过将计算机名与字符串 **Windows XP 6.11** 拼接来创建一个用户代理字符串。它然后在从 `very-malicious-site.com`\
  \ 检索 `serve.html` 文件的过程中使用此用户代理字符串。检索过程会无限重复。\n\n## 动态分析\n\n尽管在静态分析后我们对恶意软件的行为有了相当好的了解，但我们仍想验证我们的假设，即代码对下载的\
  \ `serve.html` 文件不做任何处理。为此，我们将附加一个调试器到 HMI-2 计算机上正在运行的恶意软件副本。调试器是一种软件，允许我们查看、操作和更改正在运行的代码，其目的是调试、查找代码中的错误。有许多调试器，具有不同的适用功能和使用领域。对于我们的练习，我们将使用著名的\
  \ **OllyDbg** 调试器。\n\n以下练习详细说明了动态分析的全部内容。它是在恶意软件处于运行状态时与之交互，可执行代码正在运行函数。通过使用工具操作、提取或与恶意软件交互，我们试图揭露可用于入侵指标的秘密、行为和特征。下一节将让我们使用一种特定的动态分析，即在内存中运行时进行调试。我们也可以通过调试器启动可执行文件（将其加载到调试器中），但对于服务\
  \ dll 来说这样做很困难。稍后，我们将看到另一种动态分析工具，即服务仿真，欺骗恶意软件向我们控制的服务泄露其秘密。\n\n### OllyDbg\n\nOllyDbg\
  \ 是黑客、逆向工程师、专业人士和爱好者都熟悉的工具之一。它已经存在很长时间了，即使不再受支持，该工具仍然很受欢迎，并被广泛使用至今。前往 `http://www.ollydbg.de/download.htm`\
  \ 获取一份副本以跟随接下来的练习。\n\n在开始之前先做一个完全披露。我最初计划使用更新、完全受支持且通常更稳定的调试器 x64dbg（https://x64dbg.com/#start）进行动态分析练习，但我遇到了将其附加到运行恶意\
  \ dll 的服务上的问题。这可能是与 Windows XP 的兼容性问题。无论如何，我改用我的备选调试器选择并改用 OllyDbg。以下步骤将引导您调试在系统内存中运行的恶意\
  \ dll 代码：\n\n1. 启动 OllyDbg（并调整字体和颜色以使内容更易读）后，我们单击 **File | Attach** 以打开让我们找到要附加到的进程的屏幕：\n\
  \n   ![](img/c8ffa9959721097701584fcc95101362_496_0.png)\n\n   图 11.46 – OllyDbg\
  \ – 附加到进程\n\n   这里我们遇到了第一个问题。哪个 svchost 进程正在运行我们的恶意 **IPRIPa.dll**？\n\n2. 要回答这个问题，我们可以使用\
  \ Sysinternals 的另一个优秀工具来帮助我们，即 **Process Explorer**。Process Explorer 就像 Windows\
  \ 任务管理器，但功能更强大，拥有我们无法在本章中全部涵盖的更多功能。\n\n   a) 前往 `https://docs.microsoft.com/en-us/sysinternals/downloads/process-explorer`\
  \ 了解有关该工具的更多信息并下载一份副本。Process Explorer 允许我们查看 HMI-2 计算机上运行进程的详细信息和信息，并搜索句柄和 dll。这正是我们将要做的。\n\
  \n\n\n\n\nb) 打开Process Explorer后，取消隐藏下方面板，通过“查看 | 下方窗格显示 | DLL”启用所选进程的DLL显示：\n\n\
  ![](img/c8ffa9959721097701584fcc95101362_497_0.png)\n\n图 11.47 – Process Explorer\
  \ – 显示DLL窗格\n\nc) 点击任意进程，然后按Ctrl + F（查找），搜索ipr ip：\n\n![](img/c8ffa9959721097701584fcc95101362_497_1.png)\n\
  \n图 11.48 – Process Explorer – 查找ipripa.dll\n\nd) 如您所见，Process Explorer发现了一个名为ipripa.dll的DLL，被映射到PID为1044的svchost进程的地址空间中。\n\
  \n3. 如果您还记得OllyDbg的截图，OllyDbg以十六进制显示进程ID，因此1044对应十六进制的0x414，我们应该附加到ID为00000414的进程上。OllyDbg附加到该服务需要一些时间；似乎什么也没有发生（除了GUI左下角有一些文本滚动），但进程最终会附加成功。一旦附加完成，按F9或点击“运行”按钮恢复进程。\n\
  \n## 重要提示\n\n如果不这样做，系统可能会变得无响应，因为这个服务进程负责操作系统各个部分的许多功能。\n\n4. 此时，我们应该已将OllyDbg附加到svchost进程（该进程承载了多个服务，包括我们要调试的恶意服务），并且进程正在运行（在GUI右下角显示“运行中”字样）：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_498_0.png)\n\n图 11.49 – OllyDbg – 附加到svchost\n\
  \n5. 现在是时候在内存中查找IPRIPa.dll了。打开OllyDbg的内存窗口（“查看 | 内存”或按Alt + M）。然后滚动内存窗口的输出，找到IPRIPa.dll的.text内存段（该DLL的可执行部分）：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_499_0.png)\n\n图 11.50 – OllyDbg – svchost内存模块\n\
  \n6. 右键点击该段，选择“在反汇编器中查看”，将反汇编输出定位到文本段开头，同时GUI切换到反汇编视图：\n\n![](img/c8ffa9959721097701584fcc95101362_499_1.png)\n\
  \n图 11.51 – OllyDbg – ipripa.dll起始位置\n\n7. 我们将在恶意代码即将出去获取serve.html文件之前的位置设置一个断点。为了确定需要在哪里放置这个断点，我们切换回IDA\
  \ Pro，在`ServiceMain`子例程中找到负责此功能的部分：\n\n```\nloc_10004566:\nxor ebp, ebp\npush ebp\
  \ ; dwFlags\npush ebp ; lpszProxyBypass\npush ebp ; lpszProxy\npush ebp ; dwAccessType\n\
  push offset szAgent ; lpszAgent\ncall ds:InternetOpenA\ncmp eax, ebp\nmov [esp+28h+hInternet],\
  \ eax\njnz short loc_10004584\n```\n\n```\nloc_10004584:\npush ebp ; dwContext\n\
  push 400000h ; dwFlags\nmov ecx, offset szPassword\npush 3 ; dwService\npush ecx\
  \ ; lpszPassword\npush ecx ; lpszUserName\npush 50h ; nServerPort\npush offset szServerName\
  \ ; \"very-malicious-website.com\"\npush eax ; hInternet\ncall ds:InternetConnectA\n\
  mov ebp, eax\ntest ebp, ebp\njz loc_1000462D\n```\n\n图 11.52 – 恶意软件 – 信标功能位置\n\n\
  8. 上面的截图显示了我们的关键位置——`loc_10004566`；这里是为`InternetOpenA` API调用填充参数的地方，并且它紧跟在`ServiceMain`底部的`sleep`函数之后。在这里放置断点可以让我们在信标发出之前中断程序。为了在OllyDbg中找到`loc_10004566`，我们通过按下`Ctrl\
  \ + G`并输入内存位置（10004566）来让调试器跳转到该位置：\n\n![](img/c8ffa9959721097701584fcc95101362_501_0.png)\n\
  \n图 11.53 – OllyDbg – 转到信标功能\n\n9. 一旦我们点击“确定”，反汇编窗口就会停在正确的位置：\n\n![](img/c8ffa9959721097701584fcc95101362_501_1.png)\n\
  \n图 11.54 – OllyDbg – 信标功能位置\n\n10. 这段代码看起来很眼熟（与之前的IDA Pro截图对比一下）。我们按F2或右键选择“断点\
  \ | 切换”，在此处DLL的执行上设置一个断点。现在我们要做的就是等待睡眠计时器结束，然后DLL开始其信标例程，此时我们的OllyDbg屏幕应该看起来像下面这样：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_502_0.png)\n\n图 11.55 – OllyDbg – 信标功能\
  \ - 断点命中\n\n11. 注意右下角的“已暂停”消息，表明进程执行流已被中断，我们已进入恶意软件函数。我们现在可以使用诸如单步执行、跟踪、查看寄存器和内存等调试功能来更好地理解代码。F8（单步跳过）将执行一条指令（由EIP高亮显示的那条），但不会进入子例程（跟随调用）。例如，按下F8后，程序将执行第10004566行——XOR\
  \ EBP, EBP，高亮会移到第10004568行——PUSH EBP，这将是接下来要执行的指令：\n\n![](img/c8ffa9959721097701584fcc95101362_502_1.png)\n\
  \n图 11.56 – OllyDbg – 信标功能 – 单步执行\n\n12. 连续按**F8**几次，直到我们正好停在InternetOpenA函数之后：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_503_0.png)\n\n图 11.57 – OllyDbg – 信标功能\
  \ – InternetOpenA函数\n\n13. 注意在右侧，在逐步跟踪程序的过程中，寄存器会发生变化，在调用InternetOpenA之后，LastErr区域显示了调用的结果——`ERROR_SUCCESS`，调用成功。寄存器是程序执行的窗口，它们存储变量、参数、结果和其他信息。OllyDbg允许操作寄存器值，这有助于逆向恶意软件。\n\
  \n我要再次强调，这个练习的目标不是让你成为专业的逆向工程师或恶意软件分析师，而只是让你熟悉概念和方法。如果你有兴趣进一步学习，找一本关于这个主题的好书来读。\n\
  \n14. 我们将继续逐步执行程序（*F8*），直到完成`InternetReadFile`调用（该调用会检索`serve.html`文件）。我们可以看到调用成功完成，并且一个句柄（引用ID）被存储在EAX中。当在检索完成后继续逐步执行时，我们可以看到程序流程实际上没有对检索到的`serve.html`文件做任何处理，它只是一遍又一遍地重复下载该文件：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_504_0.png)\n\n这就结束了我们威胁狩猎演习中恶意软件分析部分的调试环节。接下来，我们将看看动态分析的另一种方法，通过在我们控制下的网络服务与恶意软件进行交互。\n\
  \n# 诱骗恶意软件泄露其秘密\n\n作为最后一个练习，我们将诱使恶意软件泄露其秘密。我们将搭建一个专用的Web服务器，并将其配置为用恶意软件请求的确切内容（即`serve.html`文件）来响应信标请求。这样做是为了看看请求中是否有任何可以用作IOC的特定细节。此外，如果在恶意软件分析过程中，我们遇到了恶意软件没有进入某些代码路径的情况（因为从命令与控制服务器返回的文件没有包含必要的命令、变量或文本），我们可以用与这次诱骗会话相同的方式来构造一个精心设计的响应。\n\
  \n为了能够诱骗恶意软件连接到我们，我们需要设置一个环境，允许我们诱骗恶意软件连接到受我们控制的系统。我们可以通过响应恶意软件发出的DNS请求（该请求用于检索`very-malicious-website.com`查询），并返回REMnux机器的IP地址来实现这一点。我们将在下一节中进行这项工作。\n\
  \n# 使用pfSense伪造DNS查询\n\n为了让我们在第6章“被动安全监控”的练习2中部署的实验环境pfSense防火墙发送自定义DNS响应，我们将在pfSense\
  \ DNS解析器配置中添加一个主机覆盖条目。请按照说明在我们的pfSense防火墙上设置一个主机覆盖：\n\n1. 登录pfSense Web门户（https://172.25.100.1/），导航到“服务\
  \ – DNS解析器”。确保该服务已启用，然后滚动到底部，找到主机和域名覆盖部分：\n\n![](img/c8ffa9959721097701584fcc95101362_505_0.png)\n\
  \n图 11.59 – pfSense – DNS覆盖\n\n2. 在“主机覆盖”部分点击“添加”，然后输入以下详细信息来创建自定义DNS响应：\n\n![](img/c8ffa9959721097701584fcc95101362_505_1.png)\n\
  \n图 11.60 – pfSense – 添加DNS主机覆盖\n\n\n\n\n3. 单击**保存**，然后**应用更改**以保存配置更改。此时，我们已经设置好一个自定义\
  \ DNS 条目，当系统对 `very-malicious-website.com` 执行 DNS 请求时，该条目将返回 IP 地址 `172.25.100.222`。当我们从\
  \ HMI-2 计算机 ping 该 URL 时，可以看到结果：\n\n```\nC:\\Documents and Settings\\Administrator>ping\
  \ very-malicious-website.com\nPinging very-malicious-website.com [172.25.100.222]\
  \ with 32 bytes of data:\n\nReply from 172.25.100.222: bytes=32 time=1ms TTL=64\n\
  Reply from 172.25.100.222: bytes=32 time<1ms TTL=64\nReply from 172.25.100.222:\
  \ bytes=32 time<1ms TTL=64\nReply from 172.25.100.222: bytes=32 time<1ms TTL=64\n\
  \nPing statistics for 172.25.100.222:\n    Packets: Sent = 4, Received = 4, Lost\
  \ = 0 (0% loss),\nApproximate round trip times in milli-seconds:\n    Minimum =\
  \ 0ms, Maximum = 1ms, Average = 0ms\n```\n\n这样我们就完成了计划中的 DNS 部分；在下一节中，我们将把 REMnux\
  \ 机器的 IP 地址设置为 `172.168.100.222`。\n\n## 设置 REMnux 以模拟命令与控制服务器\n\n以下说明旨在更改 REMnux\
  \ 虚拟机的 IP 地址：\n\n- 1. REMnux 使用 **netplan** 设置接口 IP 地址。要进行 IP 地址更改，请运行 `sudo gedit\
  \ /etc/netplan/01-netcfg.yaml` 命令打开 netplan 配置，并添加/更改连接到工业网络的接口的 IP 地址部分：\n\n```yaml\n\
  # This file describes the network interfaces available on your system\n# For more\
  \ information, see netplan(5).\nnetwork:\n    version: 2\n    renderer: networkd\n\
  \    ethernets:\n...\n```\n\n```\nens34:\n  dhcp4: no\n  addresses: [172.25.100.222/24]\n\
  ```\n\n- 2. 保存更改后，使用 `sudo netplan apply` 应用更改。\n\n这样就完成了 IP 地址的设置。现在，为了模拟命令与控制服务器，我们将使用一个名为\
  \ **INetSim** 的工具。以下是该工具网站（[https://www.inetsim.org/](https://www.inetsim.org/)）上的说明：“INetSim\
  \ 是一套软件套件，用于在实验室环境中模拟常见的互联网服务，例如分析未知恶意软件样本的网络行为。”\n\n以下操作将指导我们在 REMnux 虚拟机上配置并运行\
  \ **INetSim**：\n\n- 3. **INetSim** 已预装在 REMnux 中，但我们需要进行一些设置。使用 `sudo gedit /etc/inetsim/inetsim.conf`\
  \ 打开配置文件，修改要运行的服务（仅 HTTP），并将服务 IP 地址设置为 `172.25.100.222`：\n\n```\n################################################\n\
  #####\n# INetSim configuration file\n################################################\n\
  #####\n# Main configuration\n###############################################\n#\
  \ start_service\n#\n# The services to start\n# Syntax: start_service <service name>\n\
  # Default: none\n#\n# Available service names are:\n# dns, http, smtp, pop3, tftp,\
  \ ftp, ntp, time_tcp,\n# time_udp, daytime_tcp, daytime_udp, echo_tcp,\n# echo_udp,\
  \ discard_tcp, discard_udp, quotd_tcp,\n# quotd_udp, chargen_tcp, chargen_udp, finger,\n\
  # ident, syslog, dummy_tcp, dummy_udp, smtps, pop3s,\n# ftps, irc, https\n#\n#start\
  \ service dns\n**start service http**\n#start service https\n...\n#####################################\n\
  # service_bind_address\n# IP address to bind services to\n# Syntax: service_bind_address\
  \ <IP address>\n# Default: 127.0.0.1\n**service_bind_address 172.25.100.222**\n\
  ...\n```\n\n4. 保存配置文件，然后使用以下命令启动服务（inetsim）：\n\n```\nremnux@remnux:~$ **inetsim**\n\
  INetSim 1.3.2 (2020-05-19) by Matthias Eckert & Thomas Hungerberg\nUsing log directory:\
  \ /var/log/inetsim/\nUsing data directory: /var/lib/inetsim/\nUsing report directory:\
  \ /var/log/inetsim/report/\nUsing configuration file: /etc/inetsim/inetsim.conf\n\
  Parsing configuration file.\nConfiguration file parsed successfully.\n=== INetSim\
  \ main process started (PID 2559) ===\nSession ID: 2559\nListening on: 172.25.100.222\n\
  Real Date/Time: 2020-10-02 19:39:53\nFake Date/Time: 2020-10-02 19:39:53 (Delta:\
  \ 0 seconds)\nForking services...\n* http_80_tcp - started (PID 2561)\ndone.\n**Simulation\
  \ running.**\n```\n\n- 5. 这样就完成了对 C&C Web 服务器的模拟（当然，这是一个非常基础的模拟）。我们可以通过跟踪（tail）日志文件来实时查看\
  \ INetSim 的连接详情。打开一个新终端并输入以下命令：\n\n```\nremnux@remnux:~$ sudo tail -f /var/log/inetsim/service.log\n\
  ```\n\n- 6. 此命令将跟踪（流式输出）INetSim 事件日志的内容。作为测试，让我们打开一个 Web 浏览器并访问 http://172.25.100.222：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_509_0.png)\n\n- 7. 此操作生成了以下日志条目：\n\n\
  |  |  |  |  |\n| :--- | :--- | :--- | :--- |\n| [2020-10-02 19:49:55] [2559] [http_80_tcp\
