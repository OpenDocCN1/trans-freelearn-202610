  \ to the broadcast address for the network segment) on to the operating system.\
  \ However, when the network card is placed in **promiscuous mode**, it will pass\
  \ on every packet it sees.\n\nBy inspecting every network packet that passes by\
  \ the sniffing interface, we can look for anomalies, patterns, **Internet Protocol**\
  \ (IP) addresses, interesting packet data, or other relevant information. As an\
  \ example, you can see something interesting in the following network packet:\n\n\
