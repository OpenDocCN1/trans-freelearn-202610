  \ Zeek 日志导入到 RITA 数据库中。以下命令将指示 RITA 从 `/nsm/zeek/logs/2020-09-07/` 位置导入所有 Zeek 通知（你的位置会因日期而异），并将详细信息存储到一个名为\
  \ `zeek-1` 的新**滚动**数据库中（滚动数据库允许以后添加数据）：\n\n```\npac@secOnion-002:~/tools/rita$ rita\
  \ import /nsm/zeek/\nlogs/2020-09-07 zeek-1 -rolling\n[+] Importing [/nsm/zeek/logs/2020-09-07]:\n\
  [-] Verifying log files have not been previously\nparsed into the target dataset\
