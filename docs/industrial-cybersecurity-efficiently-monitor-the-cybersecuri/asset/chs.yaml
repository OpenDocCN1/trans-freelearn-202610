  \ Onion – 为设备命名\n\n- **18.** 此时，我们需要选择将用于管理 NIC 的物理接口。暂时选择第一个接口，但请记住，如果安装后无法连接，我们可能需要在虚拟机设置中重新布线。流程如下图所示：\n\
