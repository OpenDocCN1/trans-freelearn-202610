  \ – 练习 1：创建虚拟机 – 为虚拟机命名\n\n- **6.** 下一个屏幕要求你指定操作系统将使用的虚拟磁盘大小。我的建议是越多越好。Security\
  \ Onion 可用的存储空间越多，它就能记录和关联更长时间的数据。作为最低要求，这里选择 500 GB。点击 Next 进入摘要屏幕。流程如下图所示：\n\n\
  这些数字与典型的 Security Onion 部署的最低规格保持一致。它们是为了获得最佳性能而选择的，但更少的资源通常也能运行。请记住，如果你稍后更改资源，你将不得不重新启动设置过程，这将清除\
  \ Security Onion 设备收集的所有数据。\n\n最后说明一下，已配置了两个网络适配器。一个用于管理，另一个用于网络数据包监控（嗅探）。在本书的实验室设置中，LabBox_Red\
  \ 连接到工业网络段，而 LabBox_Orange 连接到 SPAN 端口，如第 19 章 Lab Setup 中所述。SPAN 端口将向 Security\
  \ Onion 设备（克隆）提供来自实验室环境的数据包。经验法则是，我们嗅探数据的能力越强，Security Onion 解决方案就越准确和完善。\n\n- **8.**\
  \ 我们现在准备安装 Security Onion 操作系统。在 VMware Workstation 中，对于 Security Onion 虚拟机，点击 **Power\
  \ On this Virtual Machine** 按钮并等待虚拟机启动到以下选择屏幕：\n\n![](img/c8ffa9959721097701584fcc95101362_176_0.png)\n\
  \n图 6.16 – 练习 1：安装 Security Onion – 选择屏幕\n\n- **9.** 高亮 **Install Security Onion\
  \ 2.3.21** 并按 *Enter* 开始安装过程。\n- **10.** 输入 **yes** 以确认你希望擦除硬盘并安装 Security Onion\
