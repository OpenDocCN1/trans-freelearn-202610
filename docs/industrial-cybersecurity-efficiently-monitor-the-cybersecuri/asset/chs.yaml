  \ | 故障应用程序名称：backdoor.exe，版本：0.0.0.0，时间戳：0x4bc63c7d |\n| 9/3/2020 7:04 PM | 应用程序错误\
  \ | 故障应用程序名称：backdoor.exe，版本：0.0.0.0，时间戳：0x4bc63c7d |\n| 9/3/2020 6:59 PM | 应用程序错误\
  \ | 故障应用程序名称：backdoor.exe，版本：0.0.0.0，时间戳：0x4bc63c7d |\n| 8/29/2020 9:45 PM | 应用程序错误\
  \ | 故障应用程序名称：backdoor.exe，版本：0.0.0.0，时间戳：0x4bc63c7d |\n| 8/29/2020 8:04 PM | 应用程序错误\
