  \ 172.25.100.212 是否可被利用（对系统克隆进行渗透测试），以便确定这是否是 Nessus 的误报还是 Nmap 的漏报。我们将在第 17 章《渗透测试\
  \ ICS 环境》中详细讨论渗透测试。\n\n正如你所见，使用漏洞扫描器大规模扫描各种问题是一种节省时间的做法。由于其本质，这种技术往往会发现比手动流程更多的问题。代价是它非常具有侵入性。Nmap\
  \ 会在网络上传输大量流量并以可能导致甚至某些现代自动化设备崩溃的方式 interrogate 系统。建议仅在停机期间、生产停止时或在与生产网络非常相似的测试环境中执行这种级别的自动化漏洞扫描。\n\
  \n## 练习 2 – 手动检查工业计算机\n\n在本第二个练习中，我们将手动检查基于 Microsoft Windows 的系统并学习如何收集系统/操作系统详细信息、已安装软件、启动项和用户等信息。如果在某些时候我们想要进行比较，这些信息是必不可少的。这使我们能够例如在某个时间点比较配置的用户与之前配置的用户，可能允许我们识别已添加到系统中的新管理员帐户。\n\
  \n## 获取 Windows 主机信息\n\nMicrosoft Windows 操作系统在各种位置跟踪各种信息。诀窍是找到一种在各种 Windows 版本上都能方便工作的方式来提取这些信息。有（外部）实用程序可以帮助这些工作，但我认为如果不是绝对必要，我们不应该在\
  \ ICS 设备上运行外部可执行文件。通过反复试验，我发现了一些内置于几乎所有今天的 Windows 操作系统中的工具，可以帮助我们从 Windows 机器中提取所需的信息。以下各节将介绍这些工具并展示如何使用它们。\n\
  \n\n\n\n\n# msinfo32\n\n从 Windows 机器获取大量信息的第一项技术，围绕着一个自 Windows XP 时代起就内置在 Windows\
  \ 操作系统中的工具展开：msinfo32.exe。\n\n要调用此工具，我们只需按下 Windows 键 + R 打开运行对话框，输入 msinfo32：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_307_0.png)\n\n图 7.20 – 启动 msinfo32\n\n\
  按回车键。这将调出 msinfo32.exe —— 系统信息应用程序：\n\n![](img/c8ffa9959721097701584fcc95101362_307_1.png)\n\
  \n图 7.21 – Microsoft 系统信息实用工具\n\n如你所见，系统信息工具包含硬件、软件、组件和 Internet 设置等部分。你可以点击浏览所有子部分，甚至可以搜索特定信息。\n\
  \n以下区域对我们尤其重要。\n\n## 系统摘要\n\n系统信息工具打开时的初始视图提供了有关计算机的详细信息：\n\n![](img/c8ffa9959721097701584fcc95101362_308_0.png)\n\
