  \n## 基于主机的代理\n\n被动收集安全监控数据的最后一种方法是使用 **基于主机的代理**。代理是一个可以安装在端点系统上的小型应用程序。其主要功能是（定期）抓取相关信息或监控系统中的相关操作、更改或活动，然后将任何发现发送到中央服务器，由部署代理的安全解决方案进行处理。\n\
  \n许多安全厂商都有包含代理技术的产品。代理的能力、占用空间和大小各不相同，具体取决于安全工作有多少是由代理还是中央解决方案执行的。例如，像 **SolarWinds\
  \ 服务器与应用程序监控（SolarWinds SAM）** 这样的资产管理解决方案可以部署一个微小的代理，几乎不占用任何资源，因为其功能仅限于对端点进行清单和编目。资产管理解决方案的其余功能由中央服务器组件完成。而像\
  \ **Symantec Endpoint Protection（SEP）** 这样的分布式 **防病毒（AV）** 解决方案则部署了一个更大的代理（安装在系统上的\
  \ AV 组件），因为它需要在本地完成大部分繁重的工作。SEP 解决方案的中央服务器组件主要关注管理和报告。\n\n作为本章后面的 *练习 1 – 设置和配置\
  \ Security Onion* 的一部分，我们将部署一个基于主机的代理。所讨论的代理是 **Wazuh**。让我们简要讨论一下 Wazuh 的功能。\n\n\
  ## Wazuh\n\n这是来自 Wazuh 网站（`https://wazuh.com`）的内容：\n\n> \"Wazuh 是一款免费、开源且企业就绪的安全监控解决方案，将威胁检测、完整性监控、事件响应和合规功能整合到单一代理中。\"\
  \n\n> Wazuh 解决了对高级威胁的持续监控和响应的需求。它专注于提供正确的可见性，并提供洞察力，帮助安全分析师在多个端点上发现、调查和响应威胁和攻击活动。\n\
  \n> Wazuh 有助于检测比简单签名模式更复杂的隐藏利用进程，这些进程可用于规避传统的防病毒系统。此外，Wazuh 代理提供主动响应功能，可用于阻止网络攻击、停止恶意进程或隔离受恶意软件感染的文件。\"\
  \n\n\n\n\n\nA SIEM 将具备自动检测分类数据中异常的能力，或可作为手动查询数据的平台。凭借此功能，部署 SIEM 系统的组织可获得以下重要的安全监控能力：\n\
  \n- 创建安全健康报告的能力，指出安全存在不足之处以及所在位置。\n- 对特定安全事件发出警报的能力。警报可以以电子邮件、短信、电话呼叫等形式发出，具体取决于\
  \ SIEM 系统所实现的功能。\n- 执行针对特定事件和事件的搜索能力（威胁狩猎）。\n- 回溯时间并将事件随时间关联起来的能力。\n\n目前市场上有很多 SIEM\
  \ 解决方案，其在能力、可扩展性、易用性和价格方面差异很大。我们将在本书第三部分《第 3 部分 – 威胁狩猎》中，使用 Security Onion 的 SIEM\
  \ 解决方案，一种改造成 SIEM 的 ELK 堆栈。\n\n让我们接下来看看一些用于从环境各部分被动收集安全相关数据的常见工具。\n\n## 常见被动安全监控工具\n\
  \n在本节中，我们将讨论一些常见的被动安全监控工具。我为被动安全监控的三个主要学科各选择了一个工具，概述如下：\n\n- **网络安全监控 (NSM)**\n\
  - **IDS**\n- **事件日志收集和聚合**\n\n我为每个类别选择的代表性工具体现了其用途，并且是选择该工具的原因，因为该工具是该领域中最常见的执行该类别功能的工具。\n\
  \n## NSM\n\nNSM 是以一种方式索引网络流量制品的艺术，这种方式允许——除其他事项外——搜索、关联以及发现异常、趋势、模式、恶意活动和代码。\n\n\
  通过实施网络监控工具，我们可以洞察到网络上哪些设备正在相互通信，包括它们在谈论什么、如何交谈以及持续多久。了解这些有助于我们发现异常，而记录这些信息使我们能够回溯时间，在有趣的事件、事故或其他发现周围找到相关信息。\n\
  \n网络监控的事实上的工具是 **Zeek**（以前称为 **Bro**），我们接下来将讨论它。\n\n## Zeek\n\n网络监控的终极方法是 24/7 全天候对流经网络的所有内容进行完整数据包捕获。你将拥有网络上发送的每一个字节和数据包都存储起来以供将来参考。然而，这种终极方法需要大量的磁盘空间。以千兆速度，监控单个接口在\
  \ **全吞吐量** 下需要 ( 1,024Mb/8 ) * 60 秒 = 7.6 GB（其中 **GB** 代表 **千兆字节**）的磁盘空间每分钟。这对于单个接口来说，每天将超过\
  \ 10 **太字节 (TB)** 的磁盘空间。对大多数人来说，这几乎不是一个选择。\n\n这就是 Zeek 派上用场的地方。\n\n这是来自 Zeek 网站\
  \ (`https://zeek.org/`) 的内容：\n\n> \"Zeek 在开源和数字安全领域有着悠久的历史。Vern Paxson 在 1990 年代以“Bro”的名称开始开发该项目，以便了解其大学和国家实验室网络上发生了什么。Vern\
  \ 和项目的领导团队于 2018 年底将 Bro 更名为 Zeek，以庆祝其扩展和持续发展。\n> \n> Zeek 不是防火墙或入侵防御系统之类的主动安全设备。相反，Zeek\
  \ 位于“传感器”上，即硬件、软件、虚拟或云平台，它安静且不显眼地观察网络流量。Zeek 解释它所看到的内容并创建紧凑、高保真的事务日志、文件内容和完全定制的输出，适用于磁盘上的手动审查或更适合分析师的工具，如安全信息和事件管理\
  \ (SIEM) 系统。\"\n\n换句话说，Zeek 不存储完整的数据包捕获，而是存储它在网络上看到的端点之间连接的摘要。例如，端点检索 https://www.packtpub.com/\
  \ 网页在 Zeek 日志中看起来像这样：\n\n| event.module | event.dataset | source.ip | source.port\
  \ | destination.ip | destination.port | log.id.uid |\n|---|---|---|---|---|---|---|\n\
  | zeek | ssl | 192.168.110.180 | 52571 | 172.67.31.83 | 443 | C... |\n| zeek | conn\
  \ | 192.168.110.180 | 52571 | 172.67.31.83 | 443 | C... |\n\nFigure 6.5 – packtpub.com\
  \ visit\n\n请注意 Zeek 如何记录连接 (conn event.dataset)，然后将连接归类为 Secure Sockets Layer (SSL)\
  \ 连接 (ssl event.dataset)。事件通过公共统一标识符 (UID) log.id.uid 链接起来。如果我们更仔细地查看 conn 事件，则会显示以下信息：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_163_0.png)\n\nFigure 6.6 – Zeek conn\
  \ log\n\n我们可以看到网络连接信息，例如 **客户端 (源) IP**、**目标 IP**、**连接状态**、**目标地理位置**、**源和目标端口**、**传输字节数**\
  \ 等。接下来，如果我们更仔细地查看 ssl 事件，则会显示以下信息：\n\n![](img/c8ffa9959721097701584fcc95101362_164_0.png)\n\
  \nFigure 6.7 – Zeek SSL log\n\n我们可以看到此事件具有在网络连接上运行的 SSL 连接的详细信息。我们可以了解 **SSL 密码套件**、**SSL\
  \ 曲线**、**服务器名称** 和使用的 **SSL 协议版本** 的详细信息。\n\n所有这些信息都存储在完整数据包捕获所需磁盘空间的一小部分中。\n\n\
  ssl 事件集只是 Zeek 可以处理的众多分类之一。开箱即用，它支持 50+ 种日志类型，但也可以发现超过 3,000 个有趣的网络事件（例如异常、连接序列、文件、证书等）。\n\
  \n根据经验，让 Zeek 监控网络流量并生成连接信息数据库将证明是一个宝贵的资源，并在你的 IT 或 OT 网络上的许多威胁狩猎、取证调查或性能故障排除会话中为你提供答案。\n\
  \n我们接下来要讨论的工具类别是 IDS。\n\n## IDS\n\nIDS 有多种不同的类型。一方面，我们有 **基于网络的 IDS (NIDS)**。NIDS\
  \ 用于检查流经网络的流量，它可以是独立设备（独立设备），或 NIDS 技术可以集成到防火墙等其他设备中。集成到防火墙中时，新增的 NIDS 能力通常称为 **深度数据包检测\
  \ (DPI)**。DPI 指的是超越网络数据包的网络和传输层（更深层）查看的能力。这些层指的是 **OSI (开放系统互连)** 模型网络数据包层（请参阅 https://www.networkworld.com/article/3239677/the-osi-model-explained-and-how-to-easily-remember-its-7-layers.html\
  \ 以了解 OSI 模型的解释）。DPI 技术允许实现该技术的网络安全设备检查数据包和连接，并在 OSI 模型的应用层中发现异常、恶意内容或协议滥用。例如，这允许防火墙确定\
  \ **域名系统 (DNS)** 协议是否被正确使用并且不传输除 DNS 查询之外的其他数据。我们将在 *第 9 章，Visualizing, Correlating,\
  \ and Alerting* 中看到 DPI 的实际应用，当我们将 **Suricata** IDS 添加到我们的 pfSense 防火墙时。\n\n另一种类型的\
  \ IDS 是 HIDS 类型。HIDS 作为代理（例如 Wazuh）安装在端点上，或添加到其他端点保护解决方案中，例如恶意软件扫描器（McAfee）或端点保护代理（SEP）。而\
  \ NIDS 在监控网络流量方面非常出色，HIDS 可以在端点上发现异常、恶意代码和操作以及其他混乱。随着网络流量变得越来越加密，我们实际上使我们的 NIDS\
  \ 设备失明，因此趋势是向环境中添加 NIDS 和 HIDS 解决方案，以便能够继续关注安全。\n\nIDS 技术在很大程度上一直是 IT 商品，但在最近几年，几家公司开始为\
  \ OT 方面开发解决方案。OT IDS 领域的先行者是 **Forescout** (https://www.forescout.com/platform/eyeinspect/)、**Nozomi**\
  \ (https://www.nozominetworks.com/)、**CyberX** (https://cyberx-labs.com/) 等。OT 特定\
  \ IDS 解决方案为你的工业环境的安全态势提供了丰富的洞察力，并且大多数还具有资产管理、漏洞管理等附加功能。\n\n让我们接下来讨论用于监控环境入侵的两种常见工具。在\
  \ ICS 环境的 IT 侧（第 3 级 – 站点运营），我们使用 **IT 方向 IDS (IT-IDS)**——即 **Suricata**。在 ICS 网络的工业侧（第\
  \ 2 级 – 区域监控和第 1 级 – 基础控制），我们使用 **OT 方向 IDS (OT-IDS)**，即 **Forescout's eyeInspect**（以前称为\
  \ **SilentDefense**）。\n\n\n\n\n\n## IT-IDS – Suricata\n\n在 IT-IDS 部分，写关于 Snort 还是\
  \ Suricata 之间难以抉择。两者都是功能强大的 IDS 工具，并且都有庞大的安装基础，Snort 是先行者。然而，许多书籍和文章已经提及 Snort，所以我想提高大家对\
  \ Suricata 的认知。如果你想了解 Snort 是什么，可以前往 https://snort.org/ 并阅读有关这款出色产品的全部内容。在那里，注册一个免费账户并获取一个\
  \ oinkcode，可用于（自动）更新你的 Snort 规则。\n\n现在，关于 Suricata，以下内容摘自其官网（https://suricata-ids.org/）：\n\
  \n> “Suricata 是一个免费且开源的、成熟、快速且强大的网络威胁检测引擎。\n> \n> Suricata 引擎能够实现实时入侵检测（IDS）、内联入侵防御（IPS）、网络安全监控（NSM）以及离线\
  \ pcap 处理。\n> \n> Suricata 使用强大且全面的规则和签名语言检查网络流量，并具有强大的 Lua 脚本支持以检测复杂威胁。\n> \n>\
  \ 借助 YAML 和 JSON 等标准输入输出格式，与现有 SIEM、Splunk、Logstash/Elasticsearch、Kibana 以及其他数据库等工具的集成变得轻而易举。\n\
  > \n> Suricata 的快速、社区驱动的开发专注于安全性、可用性和效率。\n> \n> Suricata 项目和代码由开放信息安全基金会（OISF）拥有并支持，该基金会是一个致力于确保\
  \ Suricata 作为开源项目开发和持续成功的非营利基金会。”\n\n在许多方面，Suricata 与 Snort 可相媲美。下面的表格中，我们比较了两者的具体情况：\n\
  \n|   | Snort | Suricata |\n|---|---|---|\n| 谁开发了该产品？ | Sourcefire, Inc.（已被 Cisco\
  \ 收购） | Open Information Security Foundation (OISF) |\n| 何时开发？ | 1998 年 | 2009 年\
  \ |\n| 使用何种语言编写？ | C | C |\n| 运行的操作系统？ | 跨平台 | 跨平台 |\n| 线程支持？ | 仅单线程 | 支持多线程 |\n\
  | 是否支持 IP 版本 6（IPv6）？ | 是 | 是 |\n| 是否兼容 Snort 漏洞研究团队（VRT）规则？ | 是 | 是 |\n| 是否兼容 Emerging\
  \ Threats 规则？ | 是 | 是 |\n| 使用的日志格式？ | Unified2 | Unified2 |\n\n我们可以看到，除了线程支持外，Snort\
  \ 和 Suricata 在几乎所有方面都是非常相似的产品。如果你的硬件支持多线程（大多数现代平台都支持），多线程可能会产生巨大影响。\n\n正如开发者网站所指出的，Suricata\
  \ 是一个开源入侵检测系统，其开发工作由 OISF 主导，旨在提供下一代开源 IDS 引擎。OISF 的目标是为 IDS 行业带来新的安全理念和技术创新，并为社区提供\
  \ Snort 的多线程替代方案。Suricata 的多线程架构可支持高性能多核和多处理器系统。这种设计的主要优势在于，通过根据处理需求划分 IDS 工作负载，能够提高网络流量分析的速度和效率。\n\
  \n总体而言，Suricata 的开发充分考虑了易于部署。 它拥有写得很好的 *Getting started* 指南和用户手册。引擎用 C 编写，设计为可扩展。尽管\
  \ Suricata 在 IDS 市场中相对较新，其使用范围不及 Snort，但它正因其性能提升；其 **图形处理单元（GPU）加速**；其高速 **正则表达式（regex）**\
  \ 实现；内置 IPv6 支持；多模型统计异常检测能力；IP 信誉；可配置评分阈值；以及可扩展性等其他功能，而在 IT 安全用户中迅速获得关注。\n\n那么为什么要在\
  \ Snort 和 Suricata 之间选择其一呢？许多安全从业者将两种引擎结合使用，从而使两种产品都能监控其网络。\n\n## OT-IDS – SilentDefense\n\
  \n我想在 OT 方面谈论的 IDS 工具是 Forescout 的 SilentDefense，或产品现名 **eyeInspect**。\n\n摘自 Forescout\
  \ 网站：*“eyeInspect 为 ICS 网络提供深入的设备可见性和网络弹性。持续且被动地发现、分类和监控 OT 网络设备以实现实时风险管理。管理 IoT/OT\
  \ 的网络和运营风险。”* eyeInspect 产品通过将以下四项功能组合到单一解决方案中的检测引擎兑现了其承诺：\n\n![](img/c8ffa9959721097701584fcc95101362_168_0.png)\n\
  \n图 6.8 – eyeInspect 功能\n\n## ELK\n\nELK 是三个开源项目的缩写：**Elasticsearch、Logstash 和 Kibana**。在这三个开源项目中，我们有以下内容：\n\
  \n- **Elasticsearch** 是一个搜索和分析引擎。这是允许存储、索引、查询和分析摄取数据的部分。\n- **Logstash** 是一个服务器端数据处理管道解决方案，可同时从多个来源摄取数据。它可以转换数据，然后将其发送到存储位置，例如\
  \ Elasticsearch。\n- **Kibana** 是前端，允许用户通过图表和图形可视化存储在 Elasticsearch 中的数据。\n\n将这三种技术结合起来，可实现可扩展、灵活且极其多用途的日志收集、聚合和关联解决方案，其实现仅受实施者的想象力限制。\n\
  \n如今，你可以在许多开源和商业解决方案的核心找到 ELK。其中一个解决方案是 Security Onion，我们接下来会讨论。\n\n## 设置和配置 Security\
  \ Onion\n\nSecurity Onion 是一个开源 Linux 发行版，旨在在一个设备（**虚拟机**，或 VM）中提供入侵检测、NSM 和日志管理功能。Security\
  \ Onion 16.04 版本基于 Ubuntu，包含 Snort、Suricata、Zeek、Wazuh 和 Squert，以及许多其他安全工具。在本书撰写时，Security\
  \ Onion 16.04 版本正在逐步淘汰，取而代之的是版本 2。Security Onion 与 Security Onion 16.04 之间的主要区别如下：\n\
  \n- Security Onion 2 具有名为 **Security Onion Console (SOC)** 的新 Web 界面，其中包括原生警报管理、威胁狩猎和\
  \ pcap（数据包捕获文件格式）检索。\n- Security Onion 2 增加对 Sigma 规则的 TheHive 和 Strelka 支持；Grafana/InfluxDB（独立健康监控/警报）；Fleet（osquery\
  \ 管理）；以及 Playbook（检测剧本工具）。\n- Security Onion 2 从 Ubuntu 软件包迁移到容器。\n- Security Onion\
  \ 2 支持在 CentOS 7 和 Ubuntu 18.04 上运行。\n- Security Onion 2 将 pcap 收集工具从 `netsniff-ng`\
  \ 更改为 Google Stenographer。\n- Security Onion 2 升级到 Elastic Stack 7.x 并支持 **Elastic\
  \ Common Schema (ECS)**。\n- Security Onion 2 完全用 AF_PACKET 未签名内核模块替换 PF_RING。\n\
  - 在 Security Onion 2 中，Suricata 完全取代 Snort。\n- Security Onion 2 移除 Sguil、Squert、capME\
  \ 和 PHP。\n\nSecurity Onion 是一个平台，允许你监控网络中的安全事件和警报。它可以在几分钟内启动以开始监控小型环境的安全网络，并允许高级用户扩展并部署可在大型企业网络环境中使用的分布式系统。Security\
  \ Onion 具有完整的流量捕获能力。它通过 Snort 或 Suricata 提供基于规则的入侵检测的 IDS。它使用 Zeek 进行事件驱动的网络事件监控和入侵检测，并使用\
  \ Wazuh 主机代理进行 HIDS。所有这些功能在你启动 VM 的那一刻即可使用。\n\nSecurity Onion 允许我们将上一节中讨论的所有常见被动安全监控工具——以及更多——组合到一个解决方案中。我在所有安全架构项目中都会部署\
  \ Security Onion VM（或系统）。\n\n我们将在本章练习 1 中设置和配置 Security Onion 2.3.21，并且我们将使用这些工具执行本书第三部分\
  \ Part 3 – Threat Hunting 中的许多威胁狩猎练习的各种功能。\n\n### Exercise 1 – 设置和配置 Security Onion\n\
  \n作为本章的第一个练习，我们将部署和配置一个 Security Onion VM。我们将在本书的其余部分扩展此 Security Onion 设备的功能，并在本书第三部分\
  \ Part 3 – Threat Hunting 中大量使用其分析和搜索功能。\n\n\n\n\n\n#### 部署 Security Onion 虚拟机\n\
  \n我们现在将为实验室环境部署一个 Security Onion 虚拟机。按照以下流程操作以启动并运行该虚拟机：\n\n- **1.** 前往 https://securityonionsolutions.com/software/\
  \ 并下载最新版本的 Security Onion 设备镜像（本书撰写时为 2.3.21），如下图所示：\n\n![](img/c8ffa9959721097701584fcc95101362_172_0.png)\n\
