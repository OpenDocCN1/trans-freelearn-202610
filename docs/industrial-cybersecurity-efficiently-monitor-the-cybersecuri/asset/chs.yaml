  \n### 搜索基于主机的入侵指标\n\n当在环境中搜索基于主机的入侵指标时，拥有资产管理数据库会很方便。诸如 **Forescout** 或 **SolarWinds**\
  \ 之类的工具允许你从门户搜索许多 IOC。这可以为你节省大量时间和精力。然而，我想展示另一种在环境中查找基于主机 IOC 的方法，使用 grep。\n\n如果你还记得本书前文，我们使用\
  \ msinfo32.exe 工具为工业网络中的 Windows 机器生成系统报告。我们将这些报告以文本格式保存。我们可以使用 grep 实用程序在这些报告文件中进行搜索。grep\
  \ 是一个 Unix 命令，用于在文件中搜索与指定模式匹配的字符字符串：\n\n1. 为了练习，我们将 **MSinfo32** 报告复制到我们的 REMnux\
  \ VM，以便从那里使用 grep 命令对其进行操作：\n\n![](img/c8ffa9959721097701584fcc95101362_518_1.png)\n\
  \n图 11.71 – MSinfo32 报告\n\n2. 现在，如果我们想搜索我们发现的进程名称 IOC，例如，我们可以通过以下命令 grep 它：\n\n\
  ```\nremnux@remnux:~/workdir/MSinfo32$ grep IPRIP *\nHMI-1_2020_Sept-3.txt:Intranet\
  \ Network Awareness (INA+)\nIPRIP Running    Auto Share Process    c:\\windows\\\
  \nsystem32\\svchost.exe -k netsvcs Normal    LocalSystem\n0\nHMI-2_2020_Sept-3.txt:Intranet\
  \ Network Awareness (INA+)\nIPRIP Running    Auto Share Process    c:\\windows\\\
  \nsystem32\\svchost.exe -k netsvcs Normal    LocalSystem\n0\n```\n\n报告文件的搜索显示共有两台系统存在\
  \ IPRIP 服务。输出甚至显示服务正在运行。我们可以根据需要打开报告查找具体信息。\n\n3. 以同样的方式，我们可以搜索 dll 的文件位置（c:\\windows\\\
  temp），看看是否能带来任何额外信息：\n\n```\nremnux@remnux:~/workdir/MSinfo32$ grep 'c:\\\\windows\\\
  \\temp' *\nHMI-2_2020_Sept-3.txt:ipripa    Not Available    23.50 KB\n(24,065 bytes)\
  \    9/7/2020 4:54 PM Not Available    c:\\windows\\temp\\ipripa.dll\n```\n\n4.\
  \ 有趣的是，搜索仅返回一个命中，即 HMI-2 计算机。也许 dll 存储的位置在其他系统上不同。让我们改搜索 dll 名称：\n\n```\nremnux@remnux:~/workdir/MSinfo32$\
