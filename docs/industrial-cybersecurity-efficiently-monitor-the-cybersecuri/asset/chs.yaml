  应用程序\n\n在本章中，我们将进行三个威胁狩猎场景系列中的第二次威胁狩猎演练。正如我们在*第 10 章，威胁狩猎*中所讨论的，这些场景有助于评估新建或新增**工业控制系统（ICS）**网络（分段）的网络安全卫生状况。通过定义以下三个威胁狩猎假设：存在恶意行为者试图向外部\
