  The event details are in a clearly readable format. The highlighted event, for example,
  tells us that at `15/Aug/2020:11:52`, a system with IP address `127.0.0.1` requested
  a `/2vdrlQeu.php4` resource. The response code from the Apache server for this request
  was `404 (Resource not found)`. Additionally, we can see the user agent the client
  used: `Nikto/2.1.6`.


  Other systems can log events in a less convenient way, by using databases of even
  binary files, as is the case with Windows event logging. The following screenshot
  shows the contents of a Windows event log, viewed with a regular text editor. Notice
  the gobbledygook text that doesn''t resemble any event message whatsoever:


  ![](img/c8ffa9959721097701584fcc95101362_149_0.png)


  Figure 5.3 – Windows event log: binary format


  This is because the Windows event log system stores the event in binary (proprietary)
  format. Now, if we view that same event log in Windows'' native **Event Viewer**,
  things are a lot clearer, as we can see in the following screenshot:


  ![](img/c8ffa9959721097701584fcc95101362_150_0.png)


  Figure 5.4 – Windows'' Event Viewer


  You will find that a large part of the challenge in collecting event logs is around
  parsing and interpreting a large variety of event logs in a way that is scalable,
  reliable, and allows correlation of that variety of logs. Again, a SIEM can help
  with this task, and we will actually look at implementing parsing of logs in *Chapter
  9, Visualizing, Correlating, and Alerting*.


  Event logs will play a major role in the security monitoring efforts of your ICS
  environment. Make sure you take the time to properly configure your systems, devices,
  and equipment to send interesting events to a local repository (SIEM). In *Chapter
  9, Visualizing, Correlating, and Alerting*, we will see how to do this for Windows
  systems and look at which events to send over. As for the many network, automation,
  and controls system and equipment logs, most of those will likely have an option
  to send logs to an external syslog entity. Take some time to configure the equipment
  to send (forward) their event logs to a SIEM server. Syslog works with log severity
  levels. These are the severity levels of a typical syslog implementation:


  | Level | Severity | Description |

  | --- | --- | --- |

  | 0 | Emergency | System is pretty much unusable |

  | 1 | Alert | An action must be taken immediately, or the system will fail |

  | 2 | Critical | Critical conditions on the system |

  | 3 | Error | Error conditions on the system |

  | 4 | Warning | Warning conditions on the system |

  | 5 | Notice | Normal but significant conditions on the system |

  | 6 | Informational | Informational messages only |

  | 7 | Debug | Debug level information – very noisy |


  Figure 5.5 – Severity levels of syslog implementation


  At a minimum, you should send levels 0 through 5 to the syslog service of your SIEM
  server.


  This covers the data collection section; next, we will introduce the concept of
  SIEM systems.


  ## Putting it all together – introducing SIEM systems


  Hinted at a few times throughout this chapter and referred to several times in previous
  chapters, a SIEM system is an invaluable tool in any security monitoring effort.
  It allows us to store a large variety of event logs for all kinds of devices—and
  device makes, models, and vendors—in a format that allows easy correlation, which
  in turn allows us to find, alert, and visualize security incidents that span multiple
  systems or are otherwise hard to discover without the support of a correlation engine.
  Some examples of SIEM solutions include Splunk (https://www.splunk.com/), AlienVault
  OSSIM (https://cybersecurity.att.com/products/ossim), LogRhythm (https://logrhythm.com/),
  Blumira (https://www.blumira.com/), and the Elasticsearch, Logstash, and Kibana
  (ELK) stack (https://www.elastic.co/what-is/elk-stack).


  SIEM will be explained in detail in Chapter 9, Visualizing, Correlating, and Alerting.
  We will also look at deploying a custom ELK solution for our ICS environment in
  that chapter.


  ## Summary


  In this chapter, we discussed what security incidents are and why they matter in
  the context of security monitoring. We then went over the types of security monitoring
  methods and the technology behind collecting the data necessary for security monitoring.
  The following chapters will be deep dives into the three types of security monitoring,
  starting with passive security monitoring in the next chapter.

