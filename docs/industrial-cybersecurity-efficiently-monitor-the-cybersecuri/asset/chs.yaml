  \n## 弱密码管理\n\n除了在未打补丁的系统和软件中寻找漏洞外，弱密码也是另一个值得探索的攻击途径。尤其是在工业环境中，密码管理仍然是一个常见问题。让我们探讨两种具体的弱密码情况：密码重用和容易猜测的密码。\n\
  \n## 使用 Kerbrute 进行密码喷洒以查找密码重用\n\n密码喷洒背后的想法是查看密码是否在用户之间被重用（在 Windows 域内）。这在工业环境中尤其成问题。密码通常很简单，并且被多个用户/系统/应用程序使用。我在这里展示的示例将让我们检查\
  \ Windows 域中的所有用户，查找我们为用户账户 User-1 发现的密码。我们将使用的工具是来自 roppnop 的 Kerbrute，网址为 https://github.com/roppnop/kerbrute。\n\
  \n按照以下步骤查找所有域用户并对其进行密码喷洒：\n\n+   1. 我们将使用 Windapsearch 向域控制器请求域中的所有用户：\n\n![](img/c8ffa9959721097701584fcc95101362_690_0.png)\n\
  \nFigure 17.24 – Windapsearch domain users\n\n将我们使用的命令指向 OT 域 DC（-d 172.25.100.100），使用\
  \ user-1@ot-domain 的凭据登录，并使用 -m users 请求域用户。然后，将 windapsearch 的输出通过管道传递到 grep 命令，以过滤出\
  \ sAMAccountName 行（账户名称），剥离所有多余输出。接下来，必须将 grep 的输出通过管道传递到 AWK，以便仅显示用户名字符串（print\
  \ $2）。最后，必须将输出发送到文件，使用 > users.txt。此时，就有了要提供给 Kerbrute 密码喷洒工具的域用户列表。\n\n+   2. Kerbrute\
  \ 是一个可以快速通过 Kerberos 预身份验证功能暴力破解和枚举有效 Active Directory 账户的工具。该工具可以通过运行以下命令进行安装（需安装\
  \ Go 语言）：\n\n```\ngo get github.com/ropnop/kerbrute\n```\n\n3. Kerbrute 支持以下命令：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_691_0.png)\n\nFigure 17.25 – Kerbrute\
  \ – available commands\n\n4. 我们将使用 passwordspray 命令对 users.txt 文件中的所有域用户进行操作，尝试使用\
  \ Password123 密码，命令为 kerbrute passwordspray -d OT-domain.local users.txt Password123：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_691_1.png)\n\nFigure 17.26 – Kerbrute\
  \ scanning for password reuse\n\n+   5. 就这样，我们在短短 0.022 秒内发现了五个共享 `Password123`\
  \ 密码的用户账户！\n\n该工具的另一个优点/特性是其隐蔽性。因为我们只进行 Kerberos 预身份验证请求，大多数设置不会记录这些尝试，因此除非我们过于激进导致账户被锁定，否则攻击尝试可能不会被察觉。\n\
  \n接下来，我们将查看破解密码哈希。\n\n## 转储并破解密码哈希以查找容易猜测的密码\n\n我们将讨论的第二种弱密码漏洞是容易猜测的密码。这类密码可以通过对该密码的哈希形式运行字典攻击轻松获取。在字典攻击中，我们遍历一串单词（字典），使用与我们攻击的密码相同的算法对该单词进行加密/哈希，并比较两个哈希值。如果哈希值相同，则我们找到了明文密码。互联网上有许多提供大量词表的网站，其中最大的是\
  \ CrackStation 提供的词表（多达 15 GB 的密码！），网址为 https://crackstation.net/crackstation-wordlist-password-cracking-dictionary.htm。我们可以使用\
  \ John the Ripper 或其他破解工具结合密码哈希和词表开始破解。\n\n我们将在以下示例练习中使用的这种攻击的变体使用彩虹表来破解密码。彩虹表是预先计算的密码哈希列表（基本上，它取\
  \ CrackStation 的列表，计算哈希并将其存储在数据库文件中）。使用彩虹表攻击时，我们节省了计算哈希值所需的时间。这种攻击比纯字典破解快得多。代价是磁盘空间。彩虹表增长很快，1\
  \ TB 或更大的表并不少见。\n\n对于本次练习，我们将使用 Windows Server 内置的 `ntdsutil.exe` 工具提取 Active Directory\
  \ 密码存储文件（`ntds.dit`）。一旦获得 `ntds.dit` 文件的副本，我们将使用 `impacket-secretsdump` 提取哈希。最后，我们将使用\
  \ **Ophcrack** 对凭据哈希执行彩虹表攻击。\n\n\n\n\n\n以下步骤展示了如何完成此操作：\n\n- 1. 从域控制器运行以下命令以复制 ntds.dit\
  \ 文件的副本：\n\n```\nntdsutil\nactivate instance ntds\nifm\ncreate full C:\\extract\n\
  quit\nquit\n```\n\n以下屏幕截图显示了前面命令的输出：\n\n![](img/c8ffa9959721097701584fcc95101362_693_0.png)\n\
  \n图 17.27 – 使用 ntdsutil.exe 提取 Active Directory 用户数据库\n\n2. 将 `c:/extract/active\
  \ directory/ntds.dit` 和 `c:/extract/registry/SYSTEM` 文件复制到 Kali Linux VM 并运行 impacket\
  \ - secretsdump -system SYSTEM -ntds ntds.dit LOCAL 命令：\n\n![](img/c8ffa9959721097701584fcc95101362_694_0.png)\n\
  \n3. 突出显示的部分包含我们感兴趣的本地和域凭据哈希。将它们复制到名为 hashes.txt 的新文本文件中。\n\n4. 安装 Ophcrack （apt-get\
  \ install ophcrack）或从 https://ophcrack.sourceforge.io/ 下载可执行文件。\n\n5. Ophcrack 最近将其所有表设为免费，因此从\
  \ https://ophcrack.sourceforge.io/tables.php 下载尽可能多的表，以你的硬盘容量为准。\n\n6. 下载完所有表后，启动\
  \ Ophcrack 并单击应用程序窗口顶部的 Tables 按钮。\n\n7. 在出现的 Tables Selection 屏幕上，单击 Install 并指向表目录。然后，使用\
  \ Open 完成安装。对下载的所有表重复此步骤：\n\n![](img/c8ffa9959721097701584fcc95101362_695_0.png)\n\
  \n图 17.29 – Ophcrack – 安装表\n\n8. 通过在 Table Selection 屏幕上单击 OK 完成安装。这将带我们返回 Ophcrack\
  \ 的主屏幕。从这里，单击 Load 按钮并选择 PWDUMP 文件：\n\n![](img/c8ffa9959721097701584fcc95101362_695_1.png)\n\
  \n图 17.30 – Ophcrack – 加载密码转储文件\n\n9. 加载 hashes.txt 文件。如果成功，我们将在 Ophcrack 的主屏幕上看到所有用户和密码哈希已加载：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_696_0.png)\n\n图 17.31 – Ophcrack – 已加载密码哈希\n\
  \n我们没有提取任何 LM 哈希（一种明显更弱的算法）这一事实是好的。\n\n10. 点击 Crack 按钮，坐下来观看彩虹表攻击的魔力展开。\n\n11. 一旦\
  \ Ophcrack 完成破解过程，任何揭示其密码的用户帐户都具有弱密码，应被视为漏洞。\n\n请注意，我们也可以将此哈希列表通过 John the Ripper\
  \ 运行，以确保无误：\n\n![](img/c8ffa9959721097701584fcc95101362_697_0.png)\n\n图 17.32 –\
  \ 在 Active Directory 密码哈希上使用 John the Ripper\n\n这就是测试弱密码的全部内容。接下来，我们将攻击工业环境的底层。\n\
  \n## 测试底层\n\n到目前为止，我们所做的大部分是 OT 设备和系统的 IT 渗透测试。在 IT 端工作的工具在工业网络上工作得很好（或可能更好）。\n\n\
  本节将让我们针对更奇特的（OT）设备。我们将使用常规 IT 工具，以及为 OT 空间设计的工具。\n\n## 测试 PLC\n\n我们将探测的第一类 OT 设备是可编程逻辑控制器（PLC）。工具如\
  \ Nessus 和其他自动漏洞扫描工具，根据经验，对识别 PLC 的问题做得很差（除非 PLC 上托管的常见服务存在问题，例如 HTTP 或 telnet/SSH）。如果你可以访问\
  \ SilentDefense、Claroty、CyberX 等 OT 中心解决方案的输出，你可能会找到 PLC 的漏洞——这类工具旨在发现它们。\n\n为了能够在\
  \ PLC 中找到漏洞，我们通常最终会在线查找在这些 PLC 上运行的固件版本。诸如固件版本之类的详细信息可以从设备通过脚本提取，但通常需要我们物理连接到设备，然后使用原生工具或设备显示/菜单来发现我们想要的信息。\n\
  \n我们将讨论一些可以帮助从三种流行的通信协议中提取信息的工具：EtherNet/IP、S7 Comms 和 Modbus。\n\n## 使用 ENIP Nmap\
  \ 脚本检测 Rockwell PLC 详细信息\n\n我们可以使用 Nmap 的 ENIP 信息脚本来 interrogate 启用了 EtherNet/IP\
  \ 的设备。以下是在 Company Z 的 PLC 上运行的示例，使用 nmap 172.25.200.10-30 -p 44818,2222 --script\
  \ enip-info 命令：\n\n![](img/c8ffa9959721097701584fcc95101362_698_0.png)\n\n图 17.33\
  \ – Nmap ENIP 脚本运行中\n\n我们指示 Nmap 扫描 172.25.100.10-30 主机，查找 TCP 端口 2222 或 44818 上的服务，如果找到，则在这些设备上运行\
  \ enip-info 脚本。\n\n我们可以在扫描结果中看到诸如设备类型和固件版本等信息。然后，我们可以获取这些信息并在设备上查找潜在的漏洞和利用，例如在 https://www.cvedetails.com\
  \ 上：\n\n![](img/c8ffa9959721097701584fcc95101362_699_0.png)\n\n图 17.34 – 查找 1756-en2t\
  \ 漏洞\n\n如果你面临除 Rockwell 系列设备之外的其他自动化设备，还有其他 Nmap 脚本可用。此外，我们还可以使用一些其他工具。我们接下来将讨论其中几个。\n\
  \n## PLCSCAN\n\nPLCSCAN Python 脚本检查设备是否可用两个常见的工业服务端口：TCP 102 和 TCP 502。如果发现其中任一端口开放，它将根据开放的端口/协议调用信息收集脚本。作为示例，如果它在系统上发现\
  \ TCP 端口 502 开放，它将调用 Modbus 函数脚本，该脚本收集诸如设备识别详细信息等信息。PLCSCAN 可以从 GitHub 下载，地址为 https://github.com/meeas/plcscan。\n\
  \n以下屏幕截图显示了 PLCSCAN 的运行情况：\n\n![](img/c8ffa9959721097701584fcc95101362_700_0.png)\n\
  \n图 17.35 – PLCSCAN 运行中 – S7comm\n\n我们指示 PLCSCAN 扫描位于 172.25.200.24 的 Siemens PLC（Python\
  \ 堆栈），它发现该地址上运行着 CPU 315-2，并在输出中显示了 CPU 的详细信息。\n\n在这里，我们可以看到 PLCSCAN 针对位于 172.25.200.21\
  \ 的 Modbus 启用设备：\n\n![](img/c8ffa9959721097701584fcc95101362_700_1.png)\n\n图 17.36\
  \ – PLCSCAN 运行中 – Modbus\n\n你能检测到 PLCSCAN 发现的设备类型吗？\n\n## Modbus-cli\n\n我们可以用另一个工具与模糊的\
  \ Modbus 协议交互，即 Modbus-cli。Modbus-cli 由 Tallak Tveide 编写，可以从 GitHub 下载，地址为 https://github.com/tallakt/modbus-cli\
  \ 或作为 Ruby Gem 安装，我们将在 Kali VM 上这样做。打开一个终端并输入以下内容：\n\n```\n# gem install modbus-cli\n\
  Successfully installed modbus-cli-0.0.13\nParsing documentation for modbus-cli-0.0.13\n\
  Done installing documentation for modbus-cli after 0 seconds\n1 gem installed\n\
  ```\n\nModbus-cli 是一个非常简单但有效的工具，只需几个参数即可运行：\n\n```\n# modbus -h\nUsage:\n  modbus\
  \ [OPTIONS] SUBCOMMAND [ARG] ...\nParameters:\n  SUBCOMMAND                subcommand\n\
  \  [ARG] ...                  subcommand arguments\nSubcommands:\n  read       \
  \               read from the device\n  write                     write to the device\n\
  \  dump                      copy contents of read file to the device\nOptions:\n\
  \  -h, --help                print help\n```\n\n作为示例，以下命令将读取线圈（%M）1 到 5 的状态：\n\n\
  ```\n# modbus read 172.25.200.21 %M1 5\n```\n\n| %M1 | 1 |\n| %M2 | 1 |\n| %M3 |\
  \ 1 |\n| %M4 | 1 |\n| %M5 | 1 |\n\nModbus-cli 也可以用于写入线圈/寄存器，如下所示，通过将 0 写入线圈号 1：\n\
  \n```\n# modbus write 172.25.200.21 1 0\n```\n\n以下命令将 0 写入线圈 1，我们可以通过运行以下代码来验证其是否正确工作：\n\
  \n```\n# modbus read 172.25.200.21 1 5\n```\n\n| 1 | 0 |\n| 2 | 1 |\n| 3 | 1 |\n\
  | 4 | 1 |\n| 5 | 1 |\n\n接下来，我们将通过逆向工程 PLC 固件更新文件变得更加底层。\n\n\n\n\n\n## 逆向 ControlLogix\
  \ PLC 固件\n\n取决于客户希望我们做到什么程度，逆向工程自动化设备固件可能是我们需要做的事情。下面是一个简单例子，我们将下载一个固件文件、解压它并在 IDA\
  \ Pro 中开始逆向。按以下说明开始：\n\n- 我们将专注于 L75 控制器的 28.012 修订版。从 Rockwell 下载站点下载相应的固件更新程序文件：\n\
