  \n图 19.11 – 分配 OPC MAC 地址\n\n这样我们就完成了模拟自动化网络协议栈的配置。现在，让我们来看看 Active Directory 的设置。\n\
  \n## Active Directory/Windows 域设置\n\n请遵循创建企业环境时所使用的相同步骤，创建一个对黑客友好的 Active Directory\
  \ 环境。\n\n别忘了在企业域和工业域之间设置双向域信任。\n\n## 如何模拟（中国）攻击者\n\n为了使日志看起来更有意思，并让某些攻击者脱颖而出，我们将配置我们的\
  \ IT 防火墙，使其路由到和离开具有 `222.222.222.0/24` IP 子网范围的 VLAN。该范围将在位置感知工具中显示为来自中国。还有什么比来自或去往中国的可疑流量更显眼呢？\n\
  \n为了实现这一点，我们将通过虚拟线缆将 IT 防火墙连接到一个专用的 vSwitch，并为防火墙的连接接口分配 IP 地址 `222.222.222.1`：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_767_0.png)\n\n图 19.12 – IT 防火墙接口配置\n\n\
  这将把 222.222.222.0 子网放入防火墙的路由表中，并将该子网的流量发送到分配的接口。接下来，我们将把 Kali Linux 的一个副本连接到同一个中国子网的\
  \ vSwitch，并为其分配 IP 地址 222.222.222.222，默认网关为 222.222.222.1：\n\n![](img/c8ffa9959721097701584fcc95101362_768_0.png)\n\
  \n图 19.13 – 配置具有中国 IP 地址的 Kali Linux\n\n这使得 Kali Linux 虚拟机成为 222.222.222.222 IP\
  \ 地址请求背后的设备，我们可以将其用于网站或域名的 DNS 条目，例如 http://very-malicious-website.com。\n\n## 讨论实验室防火墙的作用\n\
  \n实验室防火墙可用于路由、检查、记录流量日志以及监控流量。例如，它们在实现 IT 和 OT 之间的互操作性方面至关重要。IT 防火墙应配置一条指向工业网络的静态路由：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_769_0.png)\n\n图 19.14 – IT 防火墙到工业网络的静态路由\n\
  \n另一方面，OT 防火墙使用一条指向 IT 防火墙的默认路由（0.0.0.0 子范围的路由）：\n\n![](img/c8ffa9959721097701584fcc95101362_769_1.png)\n\
  \n图 19.15 – OT 防火墙到企业网络的默认路由\n\n您会发现，在整个书中设置实验和测试练习的场景和环境时，这些防火墙是多功能工具。\n\n## 如何为实验室环境安装恶意软件\n\
  \n为了添加一些有趣的可疑流量，我采用了一段来自书籍《Practical Malware Analysis》（https://nostarch.com/malware）的恶意软件，名为\
  \ iprlp.dll。它将在其运行的系统上注册为服务，并持续尝试访问网站 http://very-malicious-website.com。这种行为在您的日志中显示为信标传输和命令与控制（C&C）通信流量。\n\
  \n要安装该恶意软件，请从 https://github.com/SackOfHacks/Industrial-Cybersecurity-2nd-Edition/blob/main/lab-setup/malware/IPRIPa.zip\
  \ 下载它并解压（归档文件的密码是 infected）。\n\n在想要部署恶意软件的系统中，打开一个提升权限（管理员）的命令提示符，并运行 `rundll32.exe\
  \ IPRIPa.dll,install` 命令：\n\n![](img/c8ffa9959721097701584fcc95101362_770_0.png)\n\
  \n图 19.16 – 安装 IPRIPa.dll 恶意软件\n\n这将作为服务安装该恶意软件。您可以使用 `net start IPRIP` 命令启动该服务：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_770_1.png)\n\n图 19.17 – 启动 IPRIP 服务\n\
  \n该恶意软件现在开始每 10 分钟尝试访问 http://very-malicious-website.com，直到服务被删除（`sc delete IPRIP`）。由于我们将恶意软件安装为服务，它在重启后也会幸存。\n\
  \n## 配置被动安全工具的报文捕获\n\n我们将讨论的实验室环境的最后一个方面是报文捕获。Security Onion 和 SilentDefense 等工具使用报文捕获技术来搜索恶意活动。在实验室架构中有两种方法进行报文捕获：\n\
  \n- 在 VMware ESXi vSwitch 上启用混杂模式。有关如何设置此功能的详细信息，请参阅 VMware 文档：https://kb.vmware.com/s/article/1004099。\n\
  \n  请注意，为了捕获网络数据包，安全设备需要将其嗅探接口连接到您配置了混杂模式的 vSwitch/虚拟端口组。\n- 在物理（Cisco 3750）交换机上使用\
  \ SPAN 端口。有关如何设置此功能的详细信息，请参阅 Cisco 文档：https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst3750x_3560x/software/release/12-2_55_se/configuration/guide/3750xscg/swspan.html。\n\
  \n  请注意，您需要将指定的目标端口连接回 Dell 服务器的一个空闲网络接口，并设置一个连接到该物理接口的专用 vSwitch（并在此 vSwitch 上启用混杂模式）。最后，您的安全设备需要将其嗅探接口连接到此\
  \ vSwitch。\n\n### 总结\n\n这就先讲到这里。这是一段漫长的旅程，感谢你的坚持！我希望你在这个过程中学到了一些新技巧。\n\n在这本书中，我们讨论了\
  \ ICS 环境特定安全监控的各个方面。我们仅触及了现有的众多技术、工具、活动、方法论和策略，这些都能帮助你可视化 ICS 环境的安全状态。接下来的步骤取决于你：你的旅程才刚刚开始，我强烈建议你搭建一个实验室，部署一些工具，然后开始练习、实验并完善你的技能。看看哪些工具和技术最适合你的环境，看看广泛的安全监控领域中哪些学科最符合你的偏好、最吸引你，并深入研究该领域。\n\
