  \ being sent in cleartext format, you were spot on. Even today, it is not uncommon\
  \ to see cleartext credentials flying across a network, especially on internal networks,\
  \ as these are often considered more secure than public networks. Think about this\
  \ next time you must decide between using Telnet versus **Secure Shell** (SSH).\n\
  \n\n\n\n\n## SPAN 端口\n\n与 promiscuous 模式将网卡设置为能够看到其所连接网络段上所有流经的流量不同，网络可以定义一个 **SPAN**（或\
  \ **交换端口分析器**）会话，从而可以拥有一个专用的接口来镜像（嗅探）流经整个交换机、单个 **虚拟局域网（VLAN）** 或交换机上的多个 VLAN，或该交换机上其他各种接口的所有数据包。SPAN\
