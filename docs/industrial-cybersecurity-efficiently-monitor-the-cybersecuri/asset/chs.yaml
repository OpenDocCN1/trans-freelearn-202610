  \n```\nWould you like to include it as a sniff interface (y/n)?\nn\n...\n[-] Installing\
  \ MongoDB... SUCCESS\n[!] Starting MongoDB and enabling on startup.\nCreated symlink\
  \ from /etc/systemd/system/multi-user.target.wants/mongod.service to /lib/systemd/system/mongod.service.\n\
  [!] Starting MongoDB process completed.\n[!] You can access the MongoDB shell with\
