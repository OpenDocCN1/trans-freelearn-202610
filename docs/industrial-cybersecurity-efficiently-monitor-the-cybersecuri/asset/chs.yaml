  如您所见，服务日志显示了关于请求的大量详细信息，这可以帮助我们获取更多 IOC。接下来，日志显示了 URI（资源）的请求和响应。在本例中，服务器未收到特定类型的请求，因此以默认资源响应：/var/lib/inetsim/http/fakefiles/sample.html。\n\
