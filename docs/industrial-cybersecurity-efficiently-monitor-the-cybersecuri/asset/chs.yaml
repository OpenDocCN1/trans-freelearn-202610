- "# 贡献者\n\n## 关于作者\n\n**Pascal Ackerman** 是一位经验丰富的工业安全专业人士，拥有电气工程学位，在工业网络设计和支持、信息和网络安全、风险评估、渗透测试、威胁狩猎和取证方面拥有超过\
  \ 20 年的经验。在近二十年的实地和咨询经验后，他于 2019 年加入 ThreatGEN，目前担任威胁服务和研究的董事总经理。他的热情在于分析针对 ICS\
  \ 环境的新旧威胁，他既在家中基地也与家人一起环游世界作为数字游民时都在对抗网络对手。\n\nPascal 编写了本书的前一版，并曾担任多本安全书籍的审阅者和技术顾问。\n\
  \n> 我要感谢我美好的妻子和深爱的女儿们，在撰写本书的过程中给予我的帮助、支持和鼓励。\n\n> 此外，我还要感谢 ICS 安全社区在研究数小时中给予我的帮助。你们中的许多人直接或间接地帮助了我，通过指引我正确的方向、撰写文章或相关书籍，或在我需要讨论想法时在那里支持我。\n\
  \n## 关于审阅者\n\nSyed M. Belal 是一位网络安全总监、首席顾问和战略家，在信息技术 IT、运营技术 OT 和工业控制系统 ICS 应用方面拥有超过\
  \ 14 年的经验，专注于网络和网络安全。目前担任 OT 网络安全咨询总监，负责其全球战略和增长。他帮助关键基础设施保护资产免受内部和外部威胁，并通过设计成功且具有成本效益的解决方案来协调战略。\n\
  \n他拥有电气工程学士学位和商业战略工商管理硕士学位。他持有多个行业认证，包括 CISSP、CISA 和 CISM。\n\n> 首先，感谢全能者的指引。我想感谢我的妻子\
  \ Rabia 和我们的三个孩子 Zaem、Zaafirah 和 Zakariyya 的日常支持和耐心。感谢我的父母、亲戚、朋友和同事的指导和支持。我还要感谢\
  \ Packt Publishing 给予我审阅这本精彩书籍的机会。\n\n作为 ManTech International Corp. 的技术负责人，Ron\
  \ Nemes 负责领导交付 ICS 网络安全评估和咨询解决方案给多个客户的所有技术和运营方面。他在世界各地执行 ICS 关键基础设施风险评估，涵盖电力和楼宇自动化等各个职能。作为一名经验丰富的网络安全专业人士，他擅长弥合业务和技术需求以实现客户成功。他在为国防部、民用和商业环境设计、实施和评估网络基础设施和安全方面拥有丰富的经验。他还持有\
  \ CISSP、GICSP、GPEN 和 GRID 认证。\n\n## 前言\n\n通过应用各种工具、技术和技术，在本书中，我们将可视化并跟踪**工业控制系统\
  \ (ICS)** 环境中的安全态势并识别威胁。*工业网络安全，第二版* 探讨了为 ICS 环境实施全面且稳固的安全计划，并应由那些对工业安全新手或正在扩展其工业安全态势的人阅读。\n\
  \n随着 IT 行业向云端扩展，网络攻击已显著增加。了解控制系统的漏洞并学习如何从网络威胁中保护关键基础设施系统变得越来越重要。\n\n您将从了解如何为安全而设计开始本书，并探索如何创建一种架构，使本书中讨论的所有工具、技术和活动都能得到有效且轻松的实现。您还将学习有关监控、跟踪和趋势分析（可视化）ICS\
  \ 网络安全风险的活动、工具、程序和概念，以及了解整体安全计划和态势/卫生状况。您还将被介绍威胁狩猎原则、工具、技术和方法。本书的后半部分，您将使用与 ICS\
  \ 环境相关的事件响应和事件恢复工具、技术、活动和程序。\n\n到本书结束时，您将熟练掌握工业网络安全监控、评估、事件响应活动和威胁狩猎。\n\n## 本书适合谁\n\
  \n如果您是 ICS 安全专业人员，或对 ICS 网络安全感兴趣并希望确保您（关键基础设施）系统的稳健 ICS 环境，或如果您想扩展/改进/监控/验证您的 ICS\
  \ 网络安全态势，那么本书适合您。**信息技术**以及**运营技术 (IT/OT)** 专业人员如果对进入 ICS 网络安全监控领域感兴趣，或正在寻找各种行业领先网络安全认证的额外/支持学习材料，也会发现本书有用。\n\
  \n## 本书涵盖内容\n\n*第 1 章，导论与第一版回顾*，将回顾本书的第一版。我们将为本书的其余部分奠定基础并涵盖重要概念、工具和技术，以便您能够跟上本书的第二版。\n\
  \n*第 2 章，工业控制系统架构的现代视角*，概述了 ICS 安全，解释了我如何利用多年的经验实施全厂架构。本章将涵盖新的概念、技术和最佳实践建议\n\n*第\
  \ 3 章，工业隔离区*，是我将讨论经过多年完善而更新的 IDMZ 设计，根据业务需求更新和调整设计，并修订和更新行业最佳实践建议。\n\n*第 4 章，设计时考虑安全的\
  \ ICS 架构*，是我将概述设计时考虑安全性的关键概念、技术、工具和方法论。如何设计网络以便轻松实施安全技术、工具和概念将在本书的其余部分讨论。\n\n*第\
  \ 5 章，安全监控导论*，我们将讨论与 ICS 环境相关的网络安全监控的方方面面。我将介绍网络安全监控的三种主要类型，即被动、主动和威胁狩猎，这些将在本书的其余部分详细解释。\n\
  \n*第 6 章，被动安全监控*，我们将查看被动监控工业网络安全态势所涉及的工具、技术、活动和程序。\n\n*第 7 章，主动安全监控*，探讨主动监控工业网络安全态势所涉及的工具、技术、活动和程序。\n\
  \n*第 8 章，工业威胁情报*，探讨有助于将威胁情报添加到我们的安全监控活动中的工具、技术和活动。威胁情报将被解释，并将讨论获取和组装情报的常见技术和工具。\n\
  \n*第 9 章，可视化、关联和告警*，探讨如何将前几章中讨论的所有收集的信息和数据结合到一个交互式可视化、关联和告警仪表板中，该仪表板围绕极受欢迎的 **ELK\
  \ (Elasticsearch, Kibana, Logstash)** 堆栈构建，该堆栈是 Security Onion 设备的组成部分。\n\n*第 10\
  \ 章，威胁狩猎*，是对威胁狩猎原则、工具、技术和方法论的一般介绍。本章将重温 Security Onion 以及如何将其用于威胁狩猎练习。\n\n\n\n\n\
  第 11 章《威胁狩猎场景 1 – 恶意软件信标》介绍了第一个威胁狩猎用例。在这个场景中，我们怀疑恶意软件正在发送信标或数据正在从我们的系统中被窃取，因此我们将使用日志、事件、数据和其他信息来证实这一猜测，并展示攻击背后的“是什么”、“在哪里”、“如何”以及“谁”。\n\
  \n第 12 章《威胁狩猎场景 2 – 查找恶意软件和不需要的应用程序》介绍了第二个威胁狩猎用例，该用例基于这样的假设：在 ICS 网络的资产上正在运行可执行代码，这些代码正在执行恶意操作（恶意软件），或者只是在消耗（浪费）资源。这些将是潜在的不需要的程序（PUP），例如间谍软件、比特币矿工等。\n\
  \n第 13 章《威胁狩猎场景 3 – 可疑的外部连接》介绍了第三个威胁狩猎用例：我们怀疑外部实体正在连接我们的系统。我们将使用日志、事件、数据和其他信息来证实这一猜测，并展示这些事情背后的“是什么”、“在哪里”、“如何”以及“谁”。\n\
  \n第 14 章《不同种类的安全评估》概述了现有的安全评估类型，这些评估有助于你评估 ICS 环境的风险。\n\n第 15 章《工业控制系统风险评估》将详细介绍在\
  \ ICS 环境中执行风险评估时使用的工具、技术、方法和活动。你将有机会实际体验评估活动中最常用的工具和软件。\n\n第 16 章《红队/蓝队演练》将详细介绍在\
  \ ICS 环境中执行红队和蓝队演练时使用的工具、技术、方法和活动。你将有机会实际体验评估活动中最常用的工具和软件。\n\n第 17 章《对 ICS 环境进行渗透测试》将详细介绍在\
  \ ICS 环境中执行渗透测试活动时使用的工具、技术、方法和活动。你将有机会实际体验评估活动中最常用的工具和软件。\n\n第 18 章《ICS 环境的事件响应》带你了解事件响应在工业环境相关的各个阶段、活动和流程：\n\
  \n- 准备\n- 识别\n- 遏制\n- 调查\n- 根除\n- 恢复\n- 后续跟进\n\n第 19 章《实验环境搭建》将帮助你搭建一个实验环境，用于本书中的练习。\n\
  \n# 如何从本书中获得最大收益\n\n要想从本书中获得最大收益，你应对工业网络安全以及一般的安全监控感兴趣。除此之外，所有相关的技术概念都在书中进行了详细讨论，因此不需要任何技术先决条件。\n\
  \n| 书中使用的工具 | 版本 |\n|---|---|\n| Kali Linux – https://kali.org/get-kali/#kali-bare-metal\
  \ | 2020+ |\n| pfSense 防火墙 – https://www.pfsense.org/download/ | 2.5+ |\n| Security\
  \ Onion – https://github.com/Security-Onion-Solutions/securityonion/blob/master/VERIFY_ISO.md\
  \ | 2.3+ |\n\n# 下载彩色图像\n\n我们还提供了一个 PDF 文件，其中包含本书中使用的截图/图表的彩色图像。你可以在此下载：http://www.packtpub.com/sites/default/files/downloads/9781800202092_ColorImages.pdf。\n\
  \n# 使用的约定\n\n本书中使用了多种文本约定。\n\n文本中的代码：表示文本中的代码词、数据库表名、文件夹名、文件名、文件扩展名、路径名、虚拟 URL、用户输入和\
  \ Twitter 账号。例如：“我们可以看到 Snort 检测到来自 testmyids.ca (104.31.77.72) 的响应为恶意的。”\n\n代码块如下所示：\n\
  \n```\nsd.alert_rt          Feb 15 2021 16:46:11\nsd.alert_category    NetworkAttack\n\
  ```\n\n| sd.alert_message | 检测到 NMAP 扫描 |\n| sd.alert_name | nmap_scan |\n| sd.alert_number\
  \ | 11 |\n\n当我们希望引起你对代码块中某部分注意时，相关的行或条目会以粗体显示：\n\n```\n<localfile>\n  <location>Microsoft-Windows-Sysmon/Operational</location>\n\
  \  <log_format>eventchannel</log_format>\n</localfile>\n```\n\n任何命令行输入或输出都按以下方式书写：\n\
  \n```\nidstools:\n  config:\n    ruleset: 'ETOPEN'\n```\n\n**粗体**：表示新术语、重要词汇或你在屏幕上看到的词汇。例如，菜单或对话框中的词汇在文本中显示如下。这是一个例子：“导航到\
  \ **主页 | 主机 | Sysmon** 仪表板，并在仪表板屏幕底部查看事件日志。”\n\n> **提示或重要说明**\n> 显示形式如下。\n\n# 联系我们\n\
  \n我们随时欢迎读者的反馈。\n\n**一般反馈**：如果你对本书的任何方面有问题，请在邮件主题中提及书名，并发送邮件至 customercare@packtpub.com。\n\
