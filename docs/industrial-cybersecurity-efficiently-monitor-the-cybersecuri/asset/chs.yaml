  \ Onion – 选择管理接口\n\n- **19.** 接下来的几个屏幕要求你指定 IP 地址详细信息，例如静态与 DHCP；如果选择静态，则为 IP 地址、子网掩码、网关；域名；最后是所在网络的\
  \ DNS 服务器。根据你的设置进行配置（我使用的是静态 IP 地址 172.25.100.250）。流程如下图所示：\n\n![](img/c8ffa9959721097701584fcc95101362_180_0.png)\n\
  \n图 6.24 – 练习 1：安装 Security Onion – 管理接口 DNS 搜索域\n\n在输入管理接口的配置详细信息后，安装程序将初始化网络。\n\
  \n- **20.** 接下来，我们需要指定将用作监控（嗅探）接口的物理适配器。选择剩余的接口并点击 OK。流程如下图所示：\n\n![](img/c8ffa9959721097701584fcc95101362_180_1.png)\n\
  \n图 6.25 – 练习 1：安装 Security Onion – 选择监控接口\n\n- **21.** 在下一个安装屏幕中，选择 Automatic 作为操作系统补丁计划，以允许\
  \ Security Onion 更新设备的某些部分。按 Enter 继续。\n- **22.** 现在，我们需要指定 HOME_NET IP 地址范围。这应设置为覆盖工业网络的范围（实验室网络为\
  \ 172.25.100.0/24），并允许 Security Onion 在区分内部和外部网络地址时使用，这对于多个安全工具和检查很有用。设置 IP 地址范围并按\
  \ Enter 继续。\n\n\n\n\n\n23. 现在，我们被要求选择要安装的组件（要运行的安全服务）。保留默认选择（我们想使用所有工具）并点击 Ok 继续。流程如下图所示：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_181_0.png)\n\n图 6.26 – 练习 1：安装 Security\
  \ Onion – 选择要安装的组件\n\n24. 下一步要求确认 Security Onion 使用默认的 Docker IP 范围。保留选择为 Yes 并按\
  \ Enter 继续。\n\n25. 接下来，我们需要为 Web 界面的管理员指定一个电子邮件地址和密码。指定凭据以继续安装过程。\n\n26. 在下一个屏幕上将访问方法保留为\
  \ IP 并按 Enter 继续。\n\n现在，选择 Yes to run，以允许并设置允许登录 Security Onion 管理界面和 Web 门户的网络上的\
  \ IP 地址。流程如下图所示：\n\n![](img/c8ffa9959721097701584fcc95101362_181_1.png)\n\n图 6.27\
  \ – 练习 1：安装 Security Onion – 允许工业网络范围\n\n27. 最后，安装程序要求我们确认是否继续设置 Security Onion\
  \ 设备，如下图所示：\n\n![](img/c8ffa9959721097701584fcc95101362_182_0.png)\n\n图 6.28 – 练习\
  \ 1：安装 Security Onion – 在 EVAL 模式下确认安装\n\n安装程序现在将根据我们所做的选择配置设备并进行设置。最后，我们将看到一个 Process\
  \ completed 消息并被要求确认重启。重启后，我们就可以开始使用 Security Onion 设备了。流程如下图所示：\n\n![](img/c8ffa9959721097701584fcc95101362_182_1.png)\n\
  \n图 6.29 – 练习 1：安装 Security Onion – 安装过程已完成\n\n这就完成了 Security Onion VM 的安装过程。接下来，让我们查看一些旨在充分利用新\
  \ VM 的配置。\n\n#### 配置 Security Onion\n\nSecurity Onion VM 启动并运行后，让我们查看我在所有新的 Security\
  \ Onion 部署上通常会做的三个初始配置过程：安装 VMware tools、更新 Suricata 规则集，以及添加一个 Web 界面用户（非管理员）用于日常使用。\n\
  \n#### 安装 VMware tools\n\nVMware tools 是添加到 VM 的基于主机的附加组件，可实现访客 VM 与主机（VMware Workstation）之间更好的集成。VMware\
  \ tools 提供了更好的用户体验和 VM 整体操作性的改进，因此让我们安装它们。\n\n通过 SSH 登录 Security Onion 设备（ssh adm-pac@172.25.100.250）并输入以下命令：\n\
  \n```\nsudo yum update\n```\n\n```\nsudo yum install open-vm-tools-desktop fuse\n\
  ```\n\n这些命令更新软件包存储库文件，然后安装所需的 VMware tools 可执行文件，如下所示：\n\n![](img/c8ffa9959721097701584fcc95101362_183_0.png)\n\
  \n安装需要重启，因此重启 VM（sudo reboot）。\n\n#### 更新 Suricata 规则集\n\nSuricata 规则使 Suricata\
  \ IDS 引擎能够检测威胁。保持规则最新可使 Suricata 发现新威胁，因此请定期执行此过程。\n\n打开终端并输入以下命令以更新 Suricata 规则集：\n\
  \n```\nsudo so-rule-update\n```\n\n就这么简单。Security Onion 现在将为你更新规则集并重启 Suricata 引擎，如下所示：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_184_0.png)\n\n图 6.31 – 配置 Security Onion：Suricata\
  \ 规则集更新\n\n我们现在拥有了一套全新的 Suricata 检测规则。为了完成 Security Onion 的设置，我们将通过配置 Web 门户用户以允许我们非管理员访问\
  \ Security Onion 基于 Web 的服务来结束本节。\n\n#### 添加 Web 门户用户\n\n通过 SSH 连接到 Security Onion\
  \ 设备并运行以下命令以添加 Web 门户用户：`sudo so-user-add web-pac@ot-domain.local`。\n\n输入 sudo 密码，然后输入新用户的密码，我们就设置好了。流程如下所示：\n\
  \n```\n[adm-pac@IND-SecurityOnionv2 SecurityOnion]$ sudo so-user-add web-pac@ot-domain.local\n\
  [sudo] password for adm-pac:\nEnter new password:\nSuccessfully added new user to\
  \ SOC\nSuccessfully added user to TheHive\nSuccessfully added user to Fleet\n```\n\
  \n我们现在可以通过导航到 `https://172.25.100.250` 并使用我们刚刚创建的账户（`web-pac@ot-domain.local`）登录来使用\
  \ Security Onion 的 Web 门户界面，抵达以下屏幕：\n\n![](img/c8ffa9959721097701584fcc95101362_185_0.png)\n\
  \n这涵盖了我们 Security Onion 设备的安装和初始配置过程。让我们接下来通过配置 Wazuh 来增加一些功能。\n\n#### 部署 Wazuh\
  \ 代理\n\n正如我们在本章前面 *Host-based agents* 部分（在 *Wazuh* 下）讨论的那样，Wazuh 是一种基于主机的安全监控代理，具有事件日志转发和\
  \ HIDS 功能。我们还讨论了 Wazuh 如何采用 *agent/manager* 设置。Wazuh manager 已内置于 Security Onion，但为了允许代理与\
  \ manager 服务通信，我们首先需要允许访问（定义适当的防火墙例外）。为此，请遵循以下配置步骤：\n\n- 1. 通过 SSH 连接到 Security\
  \ Onion 设备并运行 `sudo so-allow` 命令。\n- 2. `so-allow` 运行并询问你想要做什么（**Please enter your\
  \ selection**）。\n- 3. 选择 `w` 选项用于 Wazuh agent – Port `1514`/tcp/udp。\n- 4. 现在，指定实验室网络的\
  \ IP 地址范围（172.25.100.0/24）。\n- 5. 通过按 *Enter* 确认请求的更改。\n\n流程如下图所示：\n\n```\n[adm-pac@IND-SecurityOnionv2\
  \ SecurityOnion]$ sudo so-allow\n[sudo] password for adm-pac:\nThis program allows\
  \ you to add a firewall rule to allow connections from a new IP address.\n\nChoose\
  \ the role for the IP or Range you would like to add\n\n[a] - Analyst - ports 80/tcp\
  \ and 443/tcp\n[b] - Logstash Beat - port 5044/tcp\n[e] - Elasticsearch REST API\
  \ - port 9200/tcp\n[f] - Strelka frontend - port 57314/tcp\n[o] - Osquery endpoint\
  \ - port 8090/tcp\n[s] - Syslog device - 514/tcp/udp\n[w] - Wazuh agent - port 1514/tcp/udp\n\
  [p] - Wazuh API - port 55000/tcp\n[r] - Wazuh registration service - 1515/tcp\n\n\
  Please enter your selection:\nw\nEnter a single ip address or range to allow (example:\
  \ 10.10.10.10 or 10.10.0.0/16):\n172.25.100.0/24\nAdding 172.25.100.0/24 to the\
  \ wazuh_agent role. This can take a few seconds\nlocal:\n--------\nID: create_sysconfig_iptables\n\
  Function: file.touch\nName: /etc/sysconfig/iptables\nResult: True\nComment: unless\
  \ condition is true\nStarted: 21:38:53.806028\nDuration: 2518.666 ms\nChanges:\n\
  --------\nID: iptables_fix_docker\nFunction: iptables.chain_present\nName: DOCKER-USER\n\
  Result: True\nComment: iptables DOCKER-USER chain is already exist in filter table\
  \ for ipv4\nStarted: 21:38:56.325158\nDuration: 13.992 ms\nChanges:\n--------\n\
  ID: iptables_fix_fwd\nFunction: iptables.insert\nResult: True\n```\n\n图 6.33 – 配置\
  \ Security Onion：允许 Wazuh manager 访问\n\n这就完成了允许 Wazuh 访问管理服务的工作。接下来，我们需要将代理注册到 Wazuh\
  \ manager。为此，请遵循以下步骤：\n\n- 1. 在 SSH 终端中，运行 sudo so-wazuh-agent-manage 命令。\n- 2.\
  \ 这将启动 Wazuh 代理管理终端。选择操作 A 添加代理。\n- 3. 现在，输入新代理的名称——这通常是代理将安装在其上的系统的主机名。\n- 4. 指定代理的\
  \ IP 地址。\n- 5. 通过输入 y 确认添加新代理，如下图所示：\n\n```\n[adm-pac@IND-SecurityOnionv2 SecurityOnion]$\
  \ sudo so-wazuh-agent-manage\n\n***************************\n* Wazuh v3.13.1 Agent\
  \ manager.\n* The following options are available:\n***************************\n\
  (A)dd an agent (A).\n(E)xtract key for an agent (E).\n(L)ist already added agents\
  \ (L).\n(R)emove an agent (R).\n(Q)uit.\nChoose your action: A,E,L,R or Q: a\n\n\
  - Adding a new agent (use '\\q' to return to the main menu).\n  Please provide the\
  \ following:\n   * A name for the new agent: HMI-2\n   * The IP Address of the new\
  \ agent: 172.25.100.220\nConfirm adding it?(y/n): y\nAgent added with ID 002.\n\
  ```\n\n![](img/c8ffa9959721097701584fcc95101362_187_0.png)\n\n\n\n\n\n作为注册过程的一部分，Wazuh\
  \ 管理器会生成一个密钥，代理需要在通信中发送该密钥以证明其身份。在端点上安装代理之前，我们需要提取此密钥。为此，请按以下步骤操作：\n\n- 1. 仍在 Wazuh\
  \ 管理终端中，选择操作 E 以提取代理的密钥。\n- 2. 指定要提取密钥的代理 ID，如以下屏幕截图所示：\n\n![](img/c8ffa9959721097701584fcc95101362_188_0.png)\n\
  \n图 6.35 – 配置 Security Onion：提取 Wazuh 代理密钥\n\n- 3. 将密钥记录在可以检索到的位置。\n\n在系统上安装代理之前，必须对每个代理执行此过程。接下来，我们将在端点上安装代理。请按照以下说明在\
  \ HMI-1 上安装 Wazuh 代理：\n\n- 1. 前往 https://documentation.wazuh.com/3.13/installation-guide/installing-wazuh-agent/windows/wazuh_agent_package_windows.html\
  \ 并点击 Windows 安装程序下载链接。\n- 2. 将安装程序文件复制到要安装的端点上（本实验中为 HMI-1）。\n- 3. 通过双击安装程序文件安装代理并按照说明操作，保持所有选项为默认设置。\n\
  - 4. 在安装过程结束时，务必在点击完成之前选择运行代理配置界面，如以下屏幕截图所示：\n\n图 6.36 – 配置 Security Onion：安装 Wazuh\
  \ 代理\n\n- 5. 在弹出的 Wazuh 代理管理器屏幕中，填写 Security Onion 服务器的 IP 地址（172.25.100.250）并粘贴我们在\
  \ Wazuh 管理器中刚刚生成的代理密钥，然后点击保存。\n- 6. 如果一切顺利，保存后弹出的窗口应显示我们刚刚安装代理的端点的正确主机名和 IP 地址，如以下屏幕截图所示：\n\
  \n图 6.37 – 配置 Security Onion：配置 Wazuh 代理\n\n- 7. 在 **确认** 屏幕上点击确定，然后在 **代理管理器**\
  \ 中进入 **查看 – 查看配置** 页面。\n- 8. 这将打开配置文件。我们将用我在此处发布的准备好的 Wazuh 配置文件的内容替换配置文件的全部内容：`https://github.com/SackOfHacks/Industrial-Cybersecurity-2nd-Edition/blob/main/wazuh-config/ossec.conf`。\n\
  - 9. 替换内容后，请确保如果你的 Security Onion 在不同的 IP 地址上，则更新服务器地址变量，如下所示：\n\n![](img/c8ffa9959721097701584fcc95101362_190_0.png)\n\
  \n图 6.38 – 配置 Security Onion：配置 Wazuh 代理\n\n- 10. 库存配置与我上传的配置之间的主要区别在于增加了 **系统监视器\
  \ (Sysmon)** 日志和 PowerShell 脚本日志事件的事件转发。我们将在 *第 9 章，可视化、关联和告警* 中将这两种日志收集方法添加到我们的设置中。不同的部分如下所示：\n\
  \n```\n```xml\n<localfile>\n    <location>Microsoft-Windows-Sysmon/Operational</location>\n\
  \    <log_format>eventchannel</log_format>\n</localfile>\n\n<localfile>\n    <location>Microsoft-Windows-PowerShell/Operational</location>\n\
  ```\n```\n\n```\n```xml\n<log_format>eventchannel</log_format>\n</localfile>\n\n\
  <localfile>\n  <location>PowerShellCore/Operational</location>\n  <log_format>eventchannel</log_format>\n\
  </localfile>\n```\n```\n\n你也可以直接将这些行添加到库存配置中，而不是更新整个配置文件，这就足够了。由你决定。\n\n- 11. 保存配置文件并选择\
  \ **管理 – 重启** 以使用新配置重启 Wazuh 代理。\n- 12. 如果一切顺利，那么在几分钟后打开日志文件（**查看 – 查看日志**）后，日志中不应显示任何连接错误或重连尝试。\n\
  \n就这样：我们现在在环境中运行了一个功能正常的 Wazuh 事件转发和 HIDS 基础设施。我们将在 *第 9 章，可视化、关联和告警* 中看到它带来的功能，并在本书的第三部分\
  \ *第 3 部分 – 威胁狩猎* 中更详细地介绍。\n\n接下来，我们将设置一个 pfSense 防火墙来演示将防火墙日志转发到 syslog 服务器的强大功能。\n\
  \n### 练习 2 – 设置和配置 pfSense 防火墙\n\n尽管防火墙 arguably 不是被动安全监控工具，但它生成的日志和事件确实让我们可以被动地查看穿越防火墙（从而穿越安全边界）的流量。防火墙日志可以提供网络段边缘允许或阻止的详细信息的，并且应包含在整体安全监控方法中。\n\
  \n在本节中，我们将介绍部署基于软件的防火墙 pfSense 的来龙去脉，并了解如何配置它以开始将诸如阻止和允许的连接以及其他有趣信息等事件发送到 syslog（或\
  \ SIEM）服务器。\n\n我选择 pfSense 基于软件的防火墙是因为它是投入资金最少的情况下可以买到的最通用、最稳定、可扩展和可配置的防火墙。pfSense\
  \ 虚拟机是一种方便的方式，可以在实验室设置中添加防火墙、路由、**网络地址转换 (NAT)**，以及通过额外插件的事件 DPI。\n\n#### 部署 pfSense\
  \ 虚拟机\n\n要让 pfSense 虚拟机运行起来，请按照以下说明操作：\n\n- 1. 前往 https://www.pfsense.org/download/\
  \ 并下载最新版本的 pfSense 安装 ISO 文件。确保为你的硬件选择正确的架构（如果在虚拟平台上安装则选择 AMD64），并选择 CD 映像（ISO）安装程序媒体，如以下屏幕截图所示：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_192_0.png)\n\n图 6.39 – 练习 2：下载 pfSense\n\
  \n- 2. 如上一个练习中所述，在 VMware Workstation 中创建一个新的虚拟机并附加刚下载的 ISO 映像以进行安装。VMware 应自动检测到这是一个\
  \ FreeBSD 操作系统，但如果检测失败，请在操作系统类型屏幕中选择 其他 – FreeBSD 版本 10 及更早版本 64 位，如以下屏幕截图所示：\n\n\
  图 6.40 – 练习 2：创建虚拟机\n\n- 3. 为虚拟机命名并将硬件设置配置为如下所示，如以下屏幕截图所示：\n\n![](img/c8ffa9959721097701584fcc95101362_193_0.png)\n\
  \n![](img/c8ffa9959721097701584fcc95101362_193_1.png)\n\n图 6.41 – 练习 2：虚拟机硬件设置\n\
  \n请注意，已配置了两个接口。此时可添加所需的任意数量的接口。\n\n- 4. 虚拟机现在已准备好启动。点击 电源开启此虚拟机 按钮并等待 pfSense 安装程序出现。\n\
  - 5. 只需在初始屏幕上点击接受，然后在欢迎屏幕上点击确定，如以下屏幕截图所示：\n\n![](img/c8ffa9959721097701584fcc95101362_194_0.png)\n\
  \n图 6.42 – 练习 2：安装 pfSense – 安装程序屏幕\n\n- 6. 在键盘映射选择屏幕上，选择继续使用默认键盘映射并点击选择。\n- 7.\
  \ 在分区屏幕上，坚持使用默认的自动（UFS）选项并选择确定，如以下屏幕截图所示：\n\n![](img/c8ffa9959721097701584fcc95101362_194_1.png)\n\
  \n图 6.43 – 练习 2：安装 pfSense – 分区\n\n- 8. 现在，pfSense 操作系统正在安装中，如以下屏幕截图所示：\n\n![](img/c8ffa9959721097701584fcc95101362_195_0.png)\n\
  \n图 6.44 – 练习 2：安装 pfSense – 安装中\n\n- 9. 安装完成后，在询问是否需要手动修改时选择否，然后在最终屏幕上点击重启，如以下屏幕截图所示：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_195_1.png)\n\n图 6.45 – 练习 2：安装 pfSense\
  \ – 重启\n\n- 10. 虚拟机完全重启后，从主屏幕选择 2 以开始设置接口 IP 地址配置过程。\n\n\n\n\n\n11. 选择防火墙 LAN 侧的接口（就我而言是\
  \ 2）并指定要分配给该接口的 IP 地址（172.25.100.1），如下图所示：\n\n```\nWAN (wan)         -> em0    \
  \    -> v4/DHCP4: 172.25.20.190/24\nLAN (lan)         -> em1        -> v4: 192.168.1.1/24\n\
  \n0) Logout (SSH only)               9) pfTop\n1) Assign interfaces            \
