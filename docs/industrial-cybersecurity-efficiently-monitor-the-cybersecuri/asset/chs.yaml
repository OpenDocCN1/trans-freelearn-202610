  \n图 9.40 – 练习 5 – 源 IP 摘要组件\n\n- - 数据表可视化：\n  - A. **自定义搜索 – 防火墙事件** 数据源\n  - B.\
  \ **拆分行** 数据桶，**聚合** 设置为 **词条**，**字段** 设置为 **source.port**\n  - C. 将 **大小** 设置为\
  \ **50**\n  - D. 另存为 `Firewall - Source Port Summary`\n\n- - 数据表可视化：\n  - A. **自定义搜索\
  \ – 防火墙事件** 数据源\n  - B. **拆分行** 数据桶，**聚合** 设置为 **词条**，**字段** 设置为 **destination.ip**\n\
  \  - C. 将 **大小** 设置为 **50**\n  - D. 另存为 `Firewall - Destination IP Summary`\n\n\
  - - 数据表可视化：\n  - A. **自定义搜索 – 防火墙事件** 数据源\n  - B. **拆分行** 数据桶，**聚合** 设置为 **词条**，**字段**\
  \ 设置为 **destination.port**\n  - C. 将 **大小** 设置为 **50**\n  - D. 另存为 `Firewall - Destination\
  \ Port Summary`\n\n为了完善防火墙日志仪表板，我们将添加一些现有面板——我倾向于在每个仪表板上都添加这些内容：\n\n- 1. 点击 **从库中添加**\
  \ 按钮，然后搜索并选择 Security Onion **导航** 面板。\n\n![](img/c8ffa9959721097701584fcc95101362_377_0.png)\n\
  \n图 9.41 – 练习 5 – 从库中添加组件\n\n2. 接下来，搜索并选择 自定义搜索 – 防火墙事件 自定义搜索面板。这会向仪表板添加一个事件详细信息面板，与\
  \ Discover 页面上显示的内容非常相似：\n\n![](img/c8ffa9959721097701584fcc95101362_378_0.png)\n\
  \n图 9.42 – 练习 5 – 事件详细信息面板\n\n3. 关闭 从库中添加 屏幕。\n\n我们已经完成了新仪表板的编辑。你应该根据自己的喜好重新组织、移动、定位和调整组件（面板）的大小，完成后通过\
  \ **保存** 按钮将仪表板另存为 自定义仪表板 - Firewall。下图显示了我的防火墙仪表板布局：\n\n在本练习中，我们将在 Security Onion\
  \ 的 Kibana 中向自定义仪表板添加组件和可视化。要开始创建初始（空白）仪表板，请登录 Security Onion Web 门户并打开 Kibana 工具，然后导航到\
  \ https://172.25.100.250/kibana/app/dashboards。在仪表板列表页面中，点击创建仪表板，这将打开一个空白的“编辑新仪表板”。\n\
  \n现在，我们已准备好开始向新仪表板（Breach Detection Portal）添加组件和可视化。\n\n### NIDS 警报\n\n我们想要可视化的第一项数据是\
  \ NIDS 警报。如果调整得当，NIDS 警报是网络中存在恶意活动或内容的最明确指标之一。\n\n对 IDS 安装进行适当调整超出了本书的范围；不过，根据经验，调整归根结底就是消除噪声和误报。在\
  \ Security Onion 中，你可以通过将规则的签名标识符（SID）添加到 /opt/so/saltstack/local/pillar/minions/ind-securityonionv2_eval.sls\
  \ Salt 配置文件中的 idstools 部分来禁用噪声规则，然后运行 sudo salt ind-securityonionv2_eval state.apply\
  \ idstools。\n\n例如，在我的实验室环境中，我看到了许多 ET POLICY GNU/Linux YUM User-Agent Outbound，很可能与软件包管理警报有关。在\
  \ Linux（CentOS）系统环境中，这是正常流量。为了消除这些误报对数据库的阻塞，我将警报的 SID 添加到了 ind-securityonionv2_eval.sls\
  \ 文件的 idstools 部分。你可以通过查看详细警报消息来找到感兴趣警报的 SID，如下面的截图所示：\n\n![](img/c8ffa9959721097701584fcc95101362_380_0.png)\n\
  \nSID 是消息中标识为 signature_id (2013505) 的一段信息。这个数字就是我们要添加到 idstools 部分的内容（sudo vi /opt/so/saltstack/local/pillar/minions/ind-securityonionv2_eval.sls），如下面的截图所示：\n\
  \n```\nidstools:\n  config:\n    ruleset: 'ETOPEN'\n    oinkcode: ''\n```\n\n\n\n\
  \n```\n```\nurls:\nsids:\n  enabled:\n  disabled:\n    - 2013505\nmodify:\n```\n\
  ```\n\n保存文件，然后运行 `sudo salt ind-securityonyonv2_eval state.apply idstools` Salt\
  \ 更新命令。包含 SID 2013505 的 Suricata 告警将不再被记录。\n\n顺便提一下，如果你从 https://snort.org/ 获得了\
  \ Snort oinkcode，从而可以从他们的网站下载社区规则，那么 idstools 部分就是你要输入该代码的地方，这样 Security Onion 就会连同\
  \ Emerging Threats（ET）规则一起拉取 Snort 规则。\n\n调整 IDS 规则是构建一个可用的安全监控环境的关键部分。分析人员为了找到真正的威胁而必须筛选的良性或虚假告警越多，他们就越有可能漏掉真正的告警。任何基于签名的工具部署，其大部分工作都在于规则的微调。\n\
  \n我们将向入侵检测仪表板添加一个 NIDS（Suricata）告警数据表可视化。请按照以下说明操作：\n\n+   1. 在 **Editing New Dashboard**\
  \ 页面上点击 **Create new object to this dashboard** 按钮。\n+   2. 在弹出的 **New Visualization\
  \ selection** 屏幕中选择 **Data Table**。\n+   3. 在接下来的 **New Data Table / Choose a source**\
  \ 屏幕中搜索 Alerts，并选择 **Security Onion – Alerts** 数据源，如下面的截图所示：\n\n![](img/c8ffa9959721097701584fcc95101362_381_0.png)\n\
  \n图 9.45 – 练习 6：添加 Snort 告警数据表\n\n4. 我们会进入可视化编辑页面。在这里，我们定义数据显示（小部件）的内容以及显示方式。数据按桶（bucket）显示；我们需要添加一个数据桶来查看\
  \ NIDS 告警消息。点击配置屏幕右侧 Data 面板下的 ADD BUCKET 按钮，然后选择 Split rows，如下面的截图所示：\n\n![](img/c8ffa9959721097701584fcc95101362_382_0.png)\n\
  \n图 9.46 – 练习 6：Snort 告警数据表 – 添加数据桶\n\n5. 在 Split rows 面板下，从 Aggregation 下拉菜单中选择\
  \ Terms，对于 Field（我们希望从中获取数据的数据库字段），搜索并选择 rule.name.keyword。最后，将 Size 设置改为 50，以显示最常出现的\
  \ 50 条告警。\n\n下面的截图显示了具体操作方式：\n\n![](img/c8ffa9959721097701584fcc95101362_383_0.png)\n\
  \n图 9.47 – 练习 6：配置 Snort 告警数据表数据桶\n\n6. 当你点击 **Update** 时，数据表会在屏幕左侧填充，显示我们刚刚配置的数据的结果，如下面的截图所示：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_384_0.png)\n\n图 9.48 – 练习 6：Snort 告警小部件\n\
  \n如果 Snort 引擎调整得当，这个视图应该只显示很少的输出。我的视图显示了一个很大的列表，是因为我展示的是过去 7 天的数据，而且我做了一些网络扫描和探测，以便让这些数据显示出来作为一张漂亮的图片。\n\
  \n我们的目标是创建一个仪表板，显示能够指示正在发生的攻击的数据——换句话说，就是能够简洁而准确地告诉我们正遭受攻击的数据。如果这个页面上的任何小部件出现一大堆误报，就无法给我们提供这种明确的告警总览。\n\
  \n7. 为了削减一些嘈杂的告警，当鼠标悬停在你要抑制的告警上时，点击 rule.name 旁边的减号（-）符号（过滤掉）。你可以稍后返回（Edit visualization）重新添加任何烦人的嘈杂告警。\n\
  \n8. 此外，我们可以按事件严重性进行过滤。为此，点击编辑器屏幕顶部的 Add Filter 按钮，将 Field 设置为 event.severity。然后，将\
  \ Operator 设置为 is between，并在底部和顶部值处分别输入 3 和 8，如下面的截图所示：\n\n![](img/c8ffa9959721097701584fcc95101362_385_0.png)\n\
  \n图 9.49 – 按严重性过滤\n\n点击 Save 以应用该过滤器。\n\n9. 至此，我们刚刚创建了一个数据表，用于显示我们在指定时间范围（7 天）内看到的\
  \ NIDS 告警摘要。点击 Save，将此可视化命名为 Breach Detection - NIDS Alerts Summary，然后点击 Save and\
  \ return。这会保存该可视化并将其添加到我们的新仪表板中。\n\n10. 在仪表板的 Edit Mode 下，我们可以根据自己的喜好调整可视化的大小和位置。\n\
  \n11. 使用编辑器屏幕左上角的 Save 按钮保存仪表板，并将我们的新作品命名为 Breach Detection Portal。\n\n我们刚刚创建了最初的入侵检测仪表板，目前它只显示\
  \ NIDS 告警，但我们很快会在这里添加更多数据，接下来是 Zeek notices。\n\n## Zeek notices\n\nZeek notices\
  \ 日志是 Zeek 针对有趣且紧迫的发现向我们发出告警的方式。一个示例通知是发现与已定义威胁情报相关联的日志。这是一个重要发现，需要发出告警。\n\n我们可以按照以下说明添加\
  \ notices：\n\n+   1. 导航到我们的 **Breach Detection** 仪表板（**Kibana | Dashboards | Breach\
  \ Detection**），然后点击仪表板屏幕左上角的 **Edit**。\n+   2. 点击 **Create New** 按钮以添加一个新的小部件（可视化）。\n\
  +   3. 选择 `Data Table` 可视化类型，并搜索并添加 `*:so-*` 数据源（这是所有日志的数据源）。\n+   4. 输入 `event.dataset:notice\
  \ AND event.module: zeek` 搜索词以仅过滤出 notices 日志。点击 **Refresh**。\n+   5. 添加一个 `Split\
  \ Rows` 数据桶，并将 **Sub aggregation** 设置为 **Terms**，将 `notice.message.keyword` 作为 **Field**\
  \ 选择。\n+   6. 将 **Size** 选项设置为 50，然后点击 **Update**。\n+   7. 我们将添加源 IP 地址以与 notice\
  \ 消息一起显示。为此，添加一个额外的 `Split Rows` 数据桶，并将 **Sub aggregation** 设置为 **Terms**，将 `source.ip`\
  \ 作为 **Field** 选择。\n+   8. 将 **Size** 选项设置为 50，然后点击 **Update**。\n\n下面的截图显示了应如何操作：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_387_0.png)\n\n图 9.50 – 练习 6：Zeek notices\
  \ – 创建可视化\n\n默认情况下，Zeek 将自签名证书标记为无效并为其创建一条 notice。尽管这对 IT 环境来说是一个重要发现，但在 OT 方面，我们不太关心这一发现。典型工业环境的屏蔽架构使得公钥基础设施（PKI）的管理难以维护，因此证书错误并不罕见。在我们的\
  \ Breach Detection 仪表板视图中忽略这些证书错误是可以的。我们不会将它们从数据库中删除，只是将它们从视图中隐藏。\n\n9. 要从视图中排除\
  \ SSL 证书验证失败（无法获取本地颁发者证书）的 notices，请将鼠标悬停在 notice 计数（14）左侧的区域上，并点击弹出的 –（减号）符号 Filter\
  \ out value。点击此按钮。或者，你可以点击屏幕顶部的 Add filter 按钮。在 Add filter 弹出窗口中，在 Field 中键入 notice.message.keyword，将运算符设置为\
  \ is not，并在 Value 下拉列表中选择 SSL certificate validation failed with (unable to get\
  \ local issuer certificate)。点击 Save。下面的截图说明了这一过程：\n\n![](img/c8ffa9959721097701584fcc95101362_388_0.png)\n\
  \n图 9.51 – 练习 6：Zeek notices – 添加数据过滤器\n\n10. 以同样的方式，过滤掉任何其他安全套接字层（SSL）证书通知或使视图混乱的通知。\n\
  \n11. 结果是一个 Zeek notice 日志视图，多余的告警极少，简洁明了。点击 Save，将小部件保存为 Breach Detection - Zeek\
  \ Notices Summary。\n\n接下来，我们将向 Breach Detection 仪表板添加 Zeek intel 日志。\n\n## Zeek\
  \ Intel 日志\n\n当 Zeek 将发现的工件与 Intel 文件中的相应条目相关联时，就会创建 Zeek Intel 日志。在*第 8 章，工业威胁情报*中，我们将\
  \ AlienVault 威胁信息源添加到了 Security Onion。下面看一下该信息源文件（`intel.dat`）中的一些条目：\n\n![](img/c8ffa9959721097701584fcc95101362_389_0.png)\n\
  \n我们可以看到Intel文件中有一个条目将 `Intel::DOMAIN) w0x.host` 域名与 `Luhansk Ukraine Gov. Phishing\
  \ Campaig`n 相关联。现在，当 Zeek 在监控网络流量时遇到 `w0x.host` 域名，它就会创建一条 Intel 日志条目，如下所示：\n\n\
  ![](img/c8ffa9959721097701584fcc95101362_389_1.png)\n\n\n\n\n\n根据进入 Intel 数据文件的威胁情报源的质量，Intel\
  \ 日志可以是非常明确的失陷指标（IOC），或者至少是网络中非常可疑活动的指示器。\n\n我们可以按照以下说明将 Zeek Intel 日志添加到我们的**失陷检测**仪表板：\n\
  \n1. 导航到我们的**失陷检测**仪表板（**Kibana | 仪表板 | 失陷检测**），并点击仪表板屏幕左上角的**编辑**。\n2. 点击**新建**按钮添加一个新组件（可视化）。\n\
  3. 选择`Data Table`可视化类型，然后搜索并添加`*:so-*`数据源（这是所有日志的数据源）。\n4. 输入`event.dataset:intel`搜索词，仅筛选出通知日志。点击**刷新**。\n\
  5. 添加一个`Split Rows`数据桶，将**聚合**设置为**词条**，并选择`intel.sources.keyword`作为**字段**。\n6.\
  \ 将**大小**选项设置为50，然后点击**更新**。\n7. 我们将添加源 IP 地址，以与 Intel 通知消息一同显示。为此，请添加另一个`Split\
  \ Rows`数据桶，将**聚合**设置为**词条**，并选择`source.ip`作为**字段**。\n8. 将**大小**选项设置为50，然后点击**更新**。\n\
  9. 点击**保存**，将组件保存为`Breach Detection - Intel Logs Summary`。\n\n接下来，我们将使用 Sysmon 日志查看可疑进程。\n\
  \n## 可疑进程和文件创建\n\n在 Windows 机器上，创建文件和启动进程是非常常见的操作。然而，有些指标会在创建进程或创建（保存）文件时发出恶意行为警报。其中一个指标是可执行文件启动或保存的位置。通过过滤掉这些操作的大多数常见位置，我们可以生成一个显示异常可执行文件路径（位置）的视图。\n\
  \n按照以下说明创建一个可视化，以帮助我们精确定位可疑的进程创建：\n\n1. 导航到我们的**失陷检测**仪表板（**Kibana | 仪表板 | 失陷检测**），并点击仪表板屏幕左上角的**编辑**。\n\
  2. 点击**新建**按钮添加一个新组件（可视化）。\n3. 选择数据表可视化类型，然后搜索并添加 Security Onion - Sysmon 数据源。\n\
  4. 添加一个拆分行数据桶，将聚合设置为词条，并选择 `process.executable.keyword` 作为字段。\n5. 将大小选项设置为50，然后点击更新。\n\
  6. 我们将添加源计算机名称，以与进程事件条目一同显示。为此，请添加另一个拆分行数据桶，将聚合设置为词条，并选择 `winlog.computer.keyword`\
  \ 作为字段。\n7. 将大小选项设置为50，然后点击更新。\n\n以下截图展示了具体操作：\n\n![](img/c8ffa9959721097701584fcc95101362_391_0.png)\n\
  \n图9.54 – 练习6：可疑进程创建 – 所有日志\n\n此时，我们已经创建了一个视图，显示环境中所有端点上创建的每个进程的位置（image_path）摘要。其中大多数是合法操作。接下来我们要过滤掉进程应该启动的所有常见位置，例如\
  \ c:\\windows\\system32、c:\\Program Files 等。让我们按以下步骤进行：\n\n8. 在可视化编辑页面中输入以下代码作为搜索查询：\n\
  \n```\nNOT process.executable: \"c:\\\\windows\\\\system32\\\\*\" AND\nNOT process.executable:\
  \ \"c:\\\\Program Files*\" AND NOT\nprocess.executable: \"c:\\\\windows\\\\Microsoft.NET\\\
  \\*\" AND\nNOT process.executable: \"C:\\\\ProgramData\\\\Microsoft\\\\Windows Defender\\\
  \\*\" AND NOT process.executable: \"c:\\\\windows\\\\syswow64\\\\*\" AND NOT process.executable:\
  \ \"c:\\\\Windows\\\\SystemApps\\\\*\" AND NOT process.executable: \"c:\\\\windows\\\
  \\WinSxS\\\\*\" AND NOT process.executable: \"c:\\\\windows\\\\servicing\\\\*\"\
  \ AND NOT process.executable: \"c:\\\\windows\\\\softwaredistribution\\\\*\"\n```\n\
  \n这是一个不错的起始列表，列出了 Windows 可执行文件的常见启动位置。随着时间推移，你可能会遇到其他位置，可以在此处添加它们。\n\n9. 点击**刷新**，并使用**过滤掉值**按钮排除任何其他明显已知的安全可执行文件（例如\
  \ c:\\windows\\explorer.exe）。这样你就可以在后续微调视图。\n\n10. 剩余内容应当是启动自异常位置可执行文件的进程的精简输出，如下截图所示：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_392_0.png)\n\n图9.55 – 练习6：可疑进程创建 – 筛选后视图\n\
  \n从 c:\\windows\\temp 位置启动的进程总是可疑的，但并不总是恶意的！\n\n11. 点击**保存**，将组件保存为 Breach Detection\
  \ - Suspicious Image Paths。\n\n接下来，我们将添加 PowerShell 脚本块日志记录，以显示我们环境中值得关注的 PowerShell\
  \ 活动。\n\n## 可疑的 PowerShell 命令\n\nPowerShell 是管理 Windows 的一种非常方便且……嗯，强大的方式。许多攻击者在改编已知工具时，都会围绕这种脚本语言来构建。这使攻击更加隐蔽（因为无需运行外部可执行文件），同时也非常方便，因为所有现代\
  \ Windows 版本默认都安装了 PowerShell。\n\n在练习2 – 使用 Wazuh 进行 PowerShell 脚本块日志记录中，我们将 PowerShell\
  \ 日志记录功能添加到了安全监控工具包中。现在，我们将了解如何利用该功能来检测 PowerShell 中潜在危险的命令。为此，我们将添加一个仅显示可能有害命令的数据表。按照以下说明创建数据表：\n\
  \n1. 导航到我们的**失陷检测**仪表板（**Kibana | 仪表板 | 失陷检测**），并点击仪表板屏幕左上角的**编辑**。\n2. 点击**新建**按钮添加一个新组件（可视化）。\n\
  3. 选择数据表可视化类型，然后搜索并添加 `*:so-*` 数据源。\n4. 添加一个拆分行数据桶，将**聚合**设置为词条，并选择 `winlog.event_data.scriptBlockText.keyword`\
  \ 作为**字段**。\n5. 将**大小**选项设置为50，然后点击**更新**。\n6. 我们将添加源计算机名称，以与脚本块事件条目一同显示。为此，请添加另一个拆分行数据桶，将**聚合**设置为词条，并选择\
  \ `winlog.computer.keyword` 作为**字段**。\n7. 将**大小**选项设置为50，然后点击**更新**。\n8. 这会生成按计算机名称分组的\
  \ PowerShell 脚本块日志的完整列表。我们只需筛选出值得关注的条目。点击**添加筛选器**按钮，将**字段**选项设置为 `winlog.event_data.scriptBlockText`，并将**运算符**选项设置为\
  \ `is one of`。\n9. 现在，一次添加一个值，完成后点击**保存**：\n\n| 术语 | 用途 |\n|---|---|\n| HKLM registry\
  \ | - 用于检测与注册表的交互 |\n| etsn | - 用于检测远程访问尝试 |\n| Enter-PSSession | - 用于检测远程访问尝试 |\n\
  | Icm attempts | - 用于检测远程命令执行 |\n| Invoke-Command attempts | - 用于检测远程命令执行 |\n| Powersploit\
  \ framework | - 用于检测 PowerShell 渗透测试框架（PowerSploit）的使用 |\n| Mimikatz | - 用于检测黑客工具\
  \ Mimikatz 的使用 |\n| Powercat framework | - 用于检测 Powercat 的使用 |\n\n同样，这只是让你起步的一个列表，所以请做一些研究，找出\
  \ PowerShell 攻击中最常使用的命令，然后将它们添加到此处，如下所示：\n\n![](img/c8ffa9959721097701584fcc95101362_394_0.png)\n\
  \n图9.56 – 练习6：可疑的 PowerShell 命令\n\n10. 点击保存，将组件保存为 Breach Detection - Suspicious\
  \ PowerShell Commands。\n\nPowerShell 的启动方式也可能暴露恶意意图或预谋的滥用行为。下表总结了一些可疑的 PowerShell\
  \ 调用（启动）方式：\n\n| 参数 | 变体 | 参数用途 |\n|---|---|---|\n| -noprofile | -nop | 跳过加载 profile.ps1\
  \ 并避免日志记录 |\n| -encoded | -e -en -enc | 允许用户运行经过编码的 PowerShell 脚本 |\n| -ExecutionPolicy\
  \ bypass | -ep bypass, -exp bypass, -exec bypass | 绕过任何执行策略 |\n| -windowStyle hidden\
  \ |  | 阻止创建窗口；可能产生误报 |\n| -version 2 | -v 2, -version 2.0 | 强制使用 PowerShell 版本 2\
  \ |\n\n检测 PowerShell 引擎的可疑调用可以揭示恶意意图。我们将添加一个数据表，列出包含这些可疑命令行参数的所有进程创建日志。这些数据所在的日志由我们之前在练习1\
  \ – 使用 Wazuh 添加 Sysmon 日志记录中部署的 Sysmon 日志引擎提供。按照以下步骤将数据表添加到仪表板：\n\n1. 导航到我们的**失陷检测**仪表板（**Kibana\
  \ | 仪表板 | 失陷检测**），并点击仪表板屏幕左上角的**编辑**。\n2. 点击**新建**按钮添加一个新组件（可视化）。\n3. 选择**数据表**可视化类型，然后搜索并添加\
  \ `Security Onion Sysmon` 数据源。\n4. 添加一个 `Split Rows` 数据桶，将**聚合**设置为**词条**，并选择 `process.command_line.keyword`\
  \ 作为**字段**。\n5. 将**大小**选项设置为50，然后点击**更新**。\n6. 我们将添加源计算机名称，以与 PowerShell 调用事件条目一同显示。为此，请添加另一个\
  \ `Split Rows` 数据桶，将**聚合**设置为**词条**，并选择 `winlog.computer.keyword` 作为**字段**。\n7.\
  \ 将**大小**选项设置为50，然后点击**更新**。\n\n\n\n\n\n8. 我们将添加启动 PowerShell 进程的用户名以显示在 PowerShell\
  \ 调用事件条目中。为此，添加一个额外的 Split Rows 数据桶并将 **Aggregation** 设置为 **Terms**，**Field** 选择为\
  \ `user.name.keyword`。\n9. 将 **Size** 选项设置为 50 并点击 **Update**。\n10. 这会生成一份完整的命令行日志列表。我们只会筛选出有趣的条目。点击\
  \ **Add Filter** 按钮并将 **Field** 选项设置为 `process.command_line`，**Operator** 选项设置为\
  \ `is one of`。\n11. 现在，一次添加一个以下值，并在完成后点击 **Save**：\n- `-noprofile`\n- `-nop`\n-\
  \ `-encoded`\n- `-en`\n- `-enc`\n- `-enco`\n- `-encod`\n- `-encode`\n- `-ExecutionPolicy\
  \ bypass`\n- `-ep bypass`\n- `-exp bypass`\n- `-exec bypass`\n- `-bypass`\n- `-windowStyle\
  \ hidden`\n\n下图显示了配置好的 widget：\n\n![](img/c8ffa9959721097701584fcc95101362_396_0.png)\n\
  \nFigure 9.57 – Exercise 6: Suspicious PowerShell invocation\n\n12. 点击 **Save**，将\
  \ widget 保存为 `Breach Detection – Suspicious PowerShell Invocation`。\n\n我们现在已经围绕可疑\
  \ PowerShell 命令以及 PowerShell 的调用方式创建了可视化。接下来，我们将查看可疑网络连接。\n\n## Suspicious egress\
  \ connections\n\n看到对外部地址（企业区或互联网）的重复连接可能是网络上存在 **bot** 活动的迹象，或是从内部网络（工业区）外泄数据的迹象。Bot\
  \ 是一种将它们感染的主机转变为 **zombie** 机器的恶意软件，即受制于主人的无意识无人机，为该主人执行操作。Bot 需要定期与其 C&C 服务器建立连接以向\
  \ botmaster 汇报，请求指令或更新。我们可以通过监控内部 IP 地址与外部 IP 地址之间的重复连接来检测这些汇报。通常，这些连接的类型和大小相同，并且都指向同一个\
  \ IP 地址。我们接下来要做的是添加一个可视化，以便在汇总表中快速描绘这种典型的连接类型。要添加一个汇总出站已建立连接计数的表格，请按照以下说明操作：\n\n\
  1. 导航到我们的 **Breach Detection** 仪表板（**Kibana | Dashboards | Breach Detection**）并在仪表板屏幕左上角点击\
  \ **Edit**。\n2. 点击 **Create New** 按钮以添加新的 widget（可视化）。\n3. 选择 `Data Table` 可视化类型并搜索并添加\
  \ `Security Onion – Connections` 数据源。\n4. 添加一个 `Split Rows` 数据桶并将 **Aggregation**\
  \ 设置为 **Terms**，**Field** 选择为 `source.ip`。将 **Size** 选项设置为 50。\n5. 添加一个 `Split Rows`\
  \ 数据桶并将 **Aggregation** 设置为 **Terms**，**Field** 选择为 `destination.ip`。将 **Size**\
  \ 选项设置为 50。\n6. 添加一个 `Split Rows` 数据桶并将 **Aggregation** 设置为 **Terms**，**Field**\
  \ 选择为 `destination.port`。将 **Size** 选项设置为 50。\n7. 添加一个 `Split Rows` 数据桶并将 **Aggregation**\
  \ 设置为 **Terms**，**Field** 选择为 `network.transport.keyword`。将 **Size** 选项设置为 10。\n\
  8. 添加一个 `Split Rows` 数据桶并将 **Aggregation** 设置为 **Terms**，**Field** 选择为 `network.bytes`。将\
  \ **Size** 选项设置为 50。\n9. 添加一个 `Split Rows` 数据桶并将 **Aggregation** 设置为 **Terms**，**Field**\
  \ 选择为 `connection.state_description.keyword`。将 **Size** 选项设置为 50。\n\n## Suspicious\
  \ ingress connections\n\n另一个基于网络连接的良好指标是入站连接检测。尤其是在工业环境中，对 ICS 网络上资产的外部连接都是可疑的，如果它们源自互联网则更可疑。我们现在将创建一个可视化，用于显示入站网络连接汇总。按照以下说明创建汇总外部连接进入工业网络的表格：\n\
  \n1. 导航到我们的 **Breach Detection** 仪表板（**Kibana | Dashboards | Breach Detection**）并在仪表板屏幕左上角点击\
  \ **Edit**。\n2. 点击 **Create New** 按钮以添加新的 widget（可视化）。\n3. 选择 Data Table 可视化类型并搜索并添加\
  \ Security Onion - Connections 数据源。\n4. 添加一个 Split Rows 数据桶并将 **Aggregation** 设置为\
  \ **Terms**，**Field** 选择为 @timestamp。 将 **Size** 选项设置为 50。\n5. 添加一个 Split Rows 数据桶并将\
  \ **Aggregation** 设置为 **Terms**，**Field** 选择为 source.ip。 将 **Size** 选项设置为 50。\n\
  6. 添加一个 Split Rows 数据桶并将 **Aggregation** 设置为 **Terms**，**Field** 选择为 destination.ip。\
  \ 将 **Size** 选项设置为 50。\n7. 添加一个 Split Rows 数据桶并将 **Aggregation** 设置为 **Terms**，**Field**\
  \ 选择为 destination.port。 将 **Size** 选项设置为 50。\n8. 添加一个 Split Rows 数据桶并将 **Aggregation**\
  \ 设置为 **Terms**，**Field** 选择为 network.transport.keyword。 将 **Size** 选项设置为 50。\n\
  9. 添加一个 Split Rows 数据桶并将 **Aggregation** 设置为 **Terms**，**Field** 选择为 event.duration。\
  \ 将 **Size** 选项设置为 50。\n10. 添加一个 Split Rows 数据桶并将 **Aggregation** 设置为 **Terms**，**Field**\
  \ 选择为 network.bytes。 将 **Size** 选项设置为 50。\n11. 添加一个 Split Rows 数据桶并将 **Aggregation**\
  \ 设置为 **Terms**，**Field** 选择为 connection.state_description.keyword。 将 **Size** 选项设置为\
  \ 10。\n12. 这会生成所有连接日志的汇总视图。我们希望查看已建立的连接，但仅限出站。为此，添加以下过滤器：\n- 输入以下搜索字符串以进行视图过滤：NOT\
  \ source.ip: 172.25.100.0/24。这将过滤掉任何本地于工业网络的 IP 地址（根据你的子网进行调整）。\n- 在 connection.local.responder\
  \ 上对数据表进行过滤：true——这将过滤视图，仅显示连接到本地目标（工业区）的连接。\n\n13. 鉴于我们处理的是工业网络，在我们刚刚创建的数据表视图中，我们应该看到很少或没有外部连接。事实上，在这里看到连接出现是极其可疑的。如果你有企业系统出于正当理由需要连接到工业资产，你可以通过过滤它们将其加入白名单。你可以在以下截图中看到示例输出：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_400_0.png)\n\nFigure 9.59 – Exercise\
  \ 6: Suspicious ingress connections\n\n14. 确保按 **Duration**（降序）排序并点击 **Save**，将\
  \ widget 保存为 **Breach Detection – Suspicious Ingress Connections**。\n\n接下来，我们将查看一些用户账户活动。\n\
  \n## Failed user login attempts\n\n失败的用户登录尝试时有发生。人们会输错密码、忘记密码，或因某种原因被锁定。这是对任何网络的正常活动；然而，失败登录尝试中的某些模式会脱颖而出。从或到某个\
  \ IP 地址（主机）的过度登录尝试几乎可以肯定是恶意的。由于许多网络管理员为过度登录尝试实施了账户锁定程序，攻击者已改变其方法，只在每台机器上尝试 X 段时间，然后转到下一台机器。对于这种情况，来自单台机器对多台其他机器的几次失败登录尝试也应被视为可疑。\n\
  \n为了捕获这两种类型的登录攻击（暴力攻击），我们将创建一个可视化，用于随时间推移展示失败登录尝试。按照以下说明创建图表 widget：\n\n1. 导航到我们的\
  \ **Breach Detection** 仪表板（**Kibana | Dashboards | Breach Detection**）并在仪表板屏幕左上角点击\
  \ **Edit**。\n2. 点击 **Create New** 按钮以添加新的 widget（可视化）。\n3. 选择 Vertical Bar 可视化类型并搜索并添加\
  \ Security Onion - Alerts 数据源。\n4. 添加一个 Split Series 数据桶并将 **Aggregation** 设置为 **Terms**，**Field**\
  \ 选择为 `winlog.event_data.targetUserName.keyword`。将 **Size** 选项设置为 50。\n5. 添加一个 X-axis\
  \ 数据桶并将 **Aggregation** 设置为 **Data Histogram**，然后点击 **Update**。\n6. 这将聚合设置为时间线显示，随时间查看所有警报的目标用户名日志。\n\
  7. 现在是关键时刻：点击 **Add Filter** 按钮，然后将 **Field** 选项设置为 `event.code`，**Operator** 选项设置为\
  \ `is one of`。将值设置为 4625、4771 和 539，这三个众所周知的 Windows 事件 ID 表示失败的登录尝试。以下截图显示了示例输出：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_401_0.png)\n\nFigure 9.60 – Exercise\
  \ 6: Failed login attempts\n\n\n\n\n\n还有更多事件 ID 可能表明登录尝试失败，因此我将把它作为你的家庭作业，让你研究与登录失败相关的额外事件\
  \ ID 并在此处添加它们（考虑域登录与本地登录）。\n\n- 8. 点击 Save，保存小部件为 `Breach Detection - Failed Login\
  \ Attempts over time.`\n\n我们现在对随时间推移的登录失败尝试有了非常方便的视图。图表中的峰值表示活动，并且由于我们从多台机器提取日志，峰值可能表示我们在本节开头讨论的两种攻击场景之一。\n\
  \n接下来，我们将查看用户创建和更改日志。\n\n## 新用户创建和用户账户更改\n\n我们现在将可视化围绕新用户创建和用户账户更改的警报。用户创建或对用户账户的更改是环境中恶意行为的良好指标，应密切关注这些操作周围的警报。按照以下说明创建显示新或更改用户账户警报的数据表小部件：\n\
  \n- 1. 导航到我们的 **Breach Detection** 仪表板 (**Kibana | Dashboards | Breach Detection**)\
  \ 并点击仪表板屏幕左上角的 **Edit**。\n- 2. 点击 **Create New** 按钮添加新的小部件（可视化）。\n- 3. 选择 `Data\
  \ Table` 可视化类型并搜索并添加 `Security Onion - Alerts` 数据源。\n- 4. 添加一个 `Split Rows` 数据桶并将\
  \ **Aggregation** 设置为 **Terms**，**Field** 选择为 `rule.name.keyword`。将 **Size** 选项设置为\
  \ 50。\n- 5. 添加一个 `Split Rows` 数据桶并将 **Aggregation** 设置为 **Terms**，**Field** 选择为\
  \ `winlog.event_data.subjectUserName.keyword`。将 **Size** 选项设置为 50。\n- 6. 添加一个 `Split\
  \ Rows` 数据桶并将 **Aggregation** 设置为 **Terms**，**Field** 选择为 `winlog.event_data.targetUserName.keyword`。将\
  \ **Size** 选项设置为 50。\n- 7. 添加一个 Split Rows 数据桶并将 Aggregation 设置为 Terms，**Field**\
  \ 选择为 agent.name.keyword。将 **Size** 选项设置为 50。\n- 8. 点击 Update 应用数据桶。\n- 9. 现在是魔法时刻：点击\
  \ Add Filter 按钮，然后将 Field 选项设置为 event.code，Operator 选项设置为 is one of。将值设置为以下内容：\n\
  \  - 4720—这是新用户创建的事件 ID\n  - 4738—这是账户更改的事件 ID\n  - 4732—这是用户被添加到本地特权组的事件 ID\n \
  \ - 4728—这是用户被添加到全局特权组的事件 ID\n  - 4722—这是用户账户被启用的事件 ID\n\n你可以在以下截图中看到示例输出：\n\n![](img/c8ffa9959721097701584fcc95101362_403_0.png)\n\
  \nFigure 9.61 – Exercise 6: User account alerts summary\n\n- 10. 点击 Save，保存小部件为\
  \ Breach Detection - User Account Alerts Summary。\n\n到目前为止，我们已经查看了警报、进程和用户。接下来，我们将查看已下载的文件。\n\
  \n## 已下载文件\n\n我们将添加到 **Breach Detection** 仪表板的最后一个可视化将向我们显示从互联网下载的文件。我们将围绕 `bro_http`\
  \ 日志创建可视化，显示有趣的 **Uniform Resource Identifier (URI)** 字符串，例如 .exe、.bat、.cmd 等。按照以下说明构建数据表小部件：\n\
  \n- 1. 导航到我们的 **Breach Detection** 仪表板 (**Kibana | Dashboards | Breach Detection**)\
  \ 并点击仪表板屏幕左上角的 **Edit**。\n- 2. 点击 **Create New** 按钮添加新的小部件（可视化）。\n- 3. 选择 Data Table\
  \ 可视化类型并搜索并添加 `*:so-*` 数据源（这是所有日志的数据源）。\n- 4. 输入 `event.dataset:http` 搜索词以仅过滤 HTTP\
  \ 日志，然后点击 **Update**。\n- 5. 添加一个 Split Rows 数据桶并将 **Aggregation** 设置为 **Terms**，**Field**\
  \ 选择为 `source.ip`。\n- 6. 添加一个 Split Rows 数据桶并将 **Aggregation** 设置为 **Terms**，**Field**\
  \ 选择为 `http.virtual_host.keyword`。\n- 7. 添加一个 Split Rows 数据桶并将 **Aggregation** 设置为\
  \ **Terms**，**Field** 选择为 `http.uri.keyword`。\n- 8. 添加一个 Split Rows 数据桶并将 **Aggregation**\
  \ 设置为 **Terms**，**Field** 选择为 `http.user_agent.keyword`。\n- 9. 将 **Size** 选项设置为\
  \ 50 并点击 **Update**。\n- 10. 我们现在将搜索有趣的（可执行）文件扩展名。在现有搜索词之后输入以下搜索查询：\n  \n  ```\n\
  \  AND http.uri: (\"*.exe\" OR \"*.bin\" OR \"*.bat\" OR \"*.com\" OR \"*.cmd\"\
  \ OR \"*.cpl\" OR \"*.Isu\" OR \"*.lnk\" OR \"*.msi\" OR \"*.ps1\" OR \"*.reg\"\
  \ OR \"*.scr\" OR \"*.sct\" OR \"*.vb\" OR \"*.vbe\" OR \"*.vbs\" OR \"*.vbscript\"\
  \ OR \"*.ws\" OR \"*.wsf\" OR \"*.sys\" )\n  ```\n  \n  如果你找到更多扩展名，请在此处添加它们。\n-\
  \ 11. 点击 **Save**，保存小部件为 `Breach Detection - Download of Executable Files`。\n\n\
  我们还可以添加更多小部件，但为了简洁起见，我们将保留这些基本小部件。\n\n## SilentDefense 警报\n\n在本练习中我们将涵盖的最后一个警报汇总小部件是关于显示\
  \ SilentDefense 警报的。我们希望显示我们的 OT-IDS 警报正在捕获的有趣事件。为此，请按照以下步骤操作：\n\n- 1. 导航到我们的 **Breach\
  \ Detection** 仪表板 (**Kibana | Dashboards | Breach Detection**) 并点击仪表板屏幕左上角的 **Edit**。\n\
  - 2. 点击 **Create New** 按钮添加新的小部件（可视化）。\n- 3. 选择 **Data Table** 可视化类型并搜索并添加 `*:so-*`\
  \ 数据源。\n- 4. 输入 `event.dataset:ot-ids` 搜索词以仅过滤 SilentDefense 日志，然后点击 **Update**。\n\
  - 5. 添加一个 **Split Rows** 数据桶并将 **Aggregation** 设置为 **Terms**，**Field** 选择为 `source.ip`。将\
  \ **Size** 选项设置为 50。\n- 6. 添加一个 **Split Rows** 数据桶并将 **Aggregation** 设置为 **Terms**，**Field**\
  \ 选择为 `rule.category.keyword`。将 **Size** 选项设置为 50。\n- 7. 添加一个 **Split Rows** 数据桶并将\
  \ **Aggregation** 设置为 **Terms**，**Field** 选择为 `rule.name.keyword`。将 **Size** 选项设置为\
  \ 50。\n- 8. 点击 **Update** 应用数据桶。\n- 9. 过滤掉任何嘈杂的（不有趣的）警报类别，例如 `NameResolution` 和\
  \ `FileRead` 等警报，以清理视图。\n- 10. 点击 **Save**，保存小部件为 `Breach Detection – SilentDefense\
  \ Alerts Summary`。\n\n我们现在有一个小部件向我们显示有趣的 OT-IDS 警报。\n\n这里我们还可以涵盖更多小部件，并且还可以应用更多视图、列和过滤器来自定义整体\
  \ **Breach Detection** 仪表板。随着时间的推移，当你开始使用这些信息时，你将调整视图和数据以满足你的需求。现在，你应该对 Security\
  \ Onion 和 Kibana 的功能有坚实的知识来开始使用。让我们用一些应该出现在每个仪表板上的标准小部件来完成仪表板。\n\n## 完成仪表板\n\n为了完成我们的仪表板，我们将添加一些应该成为每个仪表板一部分的可视化。第一个是\
  \ **log count-over-time bar graph**，显示我们在为仪表板设置的时间段内日志的分布。要添加此可视化，请按照以下步骤操作：\n\n\
  - 1. 导航到我们的 **Breach Detection** 仪表板 (**Kibana | Dashboards | Breach Detection**)\
  \ 并点击仪表板屏幕左上角的 **Edit**。\n- 2. 点击仪表板顶部的 **Add** 按钮并搜索并添加 **Security Onion – Logs\
  \ Over Time** 小部件，如以下截图所示：\n\n![](img/c8ffa9959721097701584fcc95101362_406_0.png)\n\
  \n- 3. 关闭 **Add Panels** 屏幕并将新添加的可视化拖到屏幕顶部。\n\n我们将添加的第二个小部件是 **navigation side panel**，允许我们快速访问\
  \ Security Onion 仪表板。要添加此可视化，请按照以下步骤操作：\n\n- 1. 导航到我们的 **Breach Detection** 仪表板\
  \ (**Kibana | Dashboards | Breach Detection**) 并点击仪表板屏幕左上角的 **Edit**。\n- 2. 点击仪表板顶部的\
  \ **Add** 按钮并搜索并添加 **Security Onion – Navigation** 面板。\n- 3. 关闭 **Add Panels** 屏幕并将新添加的可视化拖到屏幕左上角，紧挨着日志计数随时间变化的小部件。按喜好调整其他可视化。示例输出如下图所示：\n\
  \n\n\n![](img/c8ffa9959721097701584fcc95101362_407_0.png)\n\n图 9.63 – 练习 6：已完成仪表板的可能布局概览\n\
  \n我们最后要添加的可视化是一个日志查看器。\n\n点击 Add 并搜索并添加 Security Onion – All Logs 保存的搜索。这会在底部添加一个面板，显示原始日志条目，如以下屏幕截图所示：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_407_1.png)\n\n图 9.64 – 练习 6：收尾 – 添加事件查看器\n\
  \n打开其中一个日志并通过点击悬停在字段上时出现的 Toggle column in table 按钮，将任何有趣的数据字段添加到表格视图中。一旦你对显示效果满意，就保存仪表板并拍拍自己的肩膀——我们现在创建了一个仪表板，可以让我们快速评估我们环境的安全状态。\n\
  \n我们应该将仪表板设置为显示 24 小时的时间跨度并每分钟自动刷新，如以下屏幕截图所示：\n\n![](img/c8ffa9959721097701584fcc95101362_408_0.png)\n\
  \n图 9.65 – 练习 6：收尾 – 自动刷新\n\n因此，现在，当有一段有趣的数据引起我们的注意时，我们可以交互式地查找该工件周围的信息。例如，IP地址\
  \ `222.222.222.222` 在我的仪表板上到处出现。我可以通过悬停在该 IP 地址上并点击 **Filter for value** 来对其进行过滤。整个仪表板现在将显示过滤为\
  \ `source_ip: 222.222.222.222` 的数据。我们可以在以下屏幕截图中看到 NIDS 警报：\n\n![](img/c8ffa9959721097701584fcc95101362_409_0.png)\n\
  \n图 9.66 – 违规检测仪表板：已过滤的 NIDS 警报\n\n我们还可以看到来自该 IP 地址的可疑入站连接，如以下屏幕截图所示：\n\n![](img/c8ffa9959721097701584fcc95101362_409_1.png)\n\
  \n图 9.67 – 违规检测仪表板：已过滤的可疑入站连接视图\n\n此外，我们可以在屏幕底部的日志查看器中查看任何日志的详细信息，如以下屏幕截图所示：\n\n\
  ![](img/c8ffa9959721097701584fcc95101362_409_2.png)\n\n图 9.68 – 违规检测仪表板：已过滤的事件查看器\n\
  \n就目前而言，我们就讲到这里。这个仪表板可以作为一个起点，用于建立 **安全运营中心 (SOC)** 视图。这很可能会发生变化，因此请添加和修改仪表板以使其符合你的需求，但这对于你进入整体安全监控方法的旅程来说是一个很好的起点。\n\
  \n## Summary\n\n在本章中，我们对安全监控采取了 mostly 被动的方法，让我们的工具为我们挖掘和暴露。我们研究了如何将所有被动安全监控工具结合起来，并将其整合成一个单一的交互式仪表板视图，以便我们快速评估我们环境的安全状态。你现在应该能够添加、更改或扩展\
  \ Kibana **Breach Detection** 仪表板或 Security Onion 随附的任何其他仪表板的功能，以充分利用我们收集的数据。\n\n\
  在下一章，即 *第 3 部分，威胁狩猎* 的开始，我们将撸起袖子开始在环境中挖掘，看看是否能找到一些恶意活动或行为者。\n"
- "# Section 3:\n工业\n网络安全 –\n威胁狩猎\n\n本书的第三部分将介绍 ICS 环境中威胁狩猎相关的工具、活动、原则和方法论。威胁狩猎是通过对某些邪恶事件的发生有想法或假设来在环境中搜索恶意活动的行为。这转化为证明或反驳假设的威胁狩猎练习。\n\
  \n在本部分中，我们将讨论三个独特的威胁狩猎练习，结合起来将允许对新的或未知的 ICS 网络进行快速而果断的验证。通过搜索信标活动、无意应用程序或进入 ICS\
  \ 环境的可疑外部连接的迹象，我们将了解如何评估网络（段）并决定它是否已被入侵。\n\n本节包含以下章节：\n\n- *第 10 章，威胁狩猎*\n- *第 11\
  \ 章，威胁狩猎场景 1 – 恶意软件信标*\n- *第 12 章，威胁狩猎场景 2 – 查找恶意软件和不需要的应用程序*\n- *第 13 章，威胁狩猎场景\
  \ 3 – 可疑外部连接*\n\n## 10\n\n# 威胁狩猎\n\n在之前的章节中，我们研究了如何从 ICS 环境收集与安全相关信息以及如何存储它，以便我们可以查询、关联、可视化和操作这些信息及其周围的信息。现在我们已经有了工具，让我们通过执行威胁狩猎来查看这些工具和我们收集的安全相关信息的非常具体的用途。\n\
  \n在本章中，我们将讨论威胁狩猎的来龙去脉以及它如何在 ICS 环境中用于证明或反驳是否存在恶意行为者或正在进行恶意活动。作为对威胁狩猎的介绍性章节，我们将研究威胁狩猎活动的原则以及威胁狩猎练习中使用的工具。我们将特别重点关注并在本书的这一部分中广泛使用的一套工具，称为\
  \ Elasticsearch、Logstash 和 Kibana（ELK）。我们在第 9 章《可视化、关联和告警》中讨论了 ELK 栈的技术方面，并且随着我们进行后续的练习章节，我们将对\
  \ ELK 越来越熟悉。\n\n我们将涵盖以下主题：\n\n- 什么是威胁狩猎？\n- ICS 环境中的威胁狩猎\n- 执行威胁狩猎练习需要什么？\n- 威胁狩猎是关于发现威胁\n\
  - 为威胁狩猎目的关联事件和警报\n- 威胁狩猎原则\n\n本章将是对威胁狩猎概念的介绍。在接下来的三章中，我们将围绕 ICS 领域的常见风险场景执行一些具体的威胁狩猎练习。\n\
  \n## 什么是威胁狩猎？\n\n在 *第 6 章，被动安全监控* 中，我们讨论了在不与网络上的系统交互的情况下检测、记录和识别我们 ICS 环境中与安全相关的风险和信息的方法。然后，在\
  \ *第 7 章，主动安全监控* 中，我们研究了该方法的相反方法，即使用主动技术来发掘与安全相关的信息并在工业网络中发现风险。最后，在 *第 9 章，可视化、关联和告警*\
  \ 中，我们将来自所有主动和被动工具和活动的发现和信息结合到一个安全事件和事件管理解决方案中。这为我们提供了一种关联和搜索风险的方法。它还允许我们在检测到的安全事件上设置警报并可视化我们环境当前的风险态势。现在，是时候以更主动和调查性的方式使用我们的安全监控工作提供的信息和数据，我们将通过执行威胁狩猎练习来实现这一点。\n\
  \n威胁狩猎的核心在于假设一个风险或威胁场景，并通过威胁狩猎练习证明或反驳该威胁场景在我们环境中的存在。一个假设的威胁场景可能是 *竞争对手已渗透我们的网络，现在正在窃取我们的专有信息*。一个合适的威胁狩猎练习，可以证明或反驳这个假设的威胁场景，可能包括活动，如\
  \ PLC/HMI/DCS 和安全系统日志审查、防火墙日志审查、Windows 事件日志审查、网络数据包捕获、公开记录调查，甚至暗网扫描——任何可能显示假设威胁在环境中实际发生的证据。\n\
  \n威胁狩猎威胁场景并非随机挑选；它们通常适合环境或情况。例如，防火墙上针对系统尝试连接恶意域的命中可以引发针对与识别事件（防火墙命中）相关的恶意软件或威胁行为者（攻击者）量身定制的威胁狩猎。作为一个例子，假设我们在网络上发现一个系统试图与中国\
  \ IP 地址 61.188.18.25 通信，并且出于某种原因我们认为这很可疑。在这里，我们可以使用 GreyNoise（https://greynoise.io）等在线\
  \ IP 信誉服务来了解有关此 IP 地址的已知信息（这也适用于 URL、域和文件哈希）。当我们在 https://viz.greynoise.io/ip/61.188.18.25\
  \ 上查找此 IP 地址时，我们会看到该 IP 地址是 trickbot 活动的一部分：\n\n![](img/c8ffa9959721097701584fcc95101362_415_0.png)\n\
  \n图 10.1 – 威胁信息定义了有针对性的威胁狩猎练习\n\n\n\n\n\n借助这些知识，我们可以定义威胁狩猎的边界和方向。借助专门用于挖掘我们环境中 Trickbot\
  \ 感染的入侵指标（文件哈希、注册表键、URL、行为指标等），我们可以从尝试连接该 IP 地址的内部系统开始，然后迅速扩大狩猎范围，以查找可能已被入侵的任何其他系统。\n\
  \n威胁狩猎有时会被误认为是事件响应活动，但两者之间存在明显区别。虽然事件响应主要关注清理入侵，但威胁狩猎旨在发现该入侵及其范围。\n\n现在我们已经讨论了威胁狩猎的基础知识，让我们学习威胁狩猎如何用于评估工业环境的网络安全态势。\n\
  \n## ICS 环境中的威胁狩猎\n\n我经常被问到，“威胁狩猎不是 IT 的事情吗？” 威胁狩猎确实源于 IT 领域，但在我看来，它更适用于运营技术（OT）环境。这些经常被忽视的工业（网络）环境可能是恶意软件和恶意行为者的滋生地。威胁可能潜伏在各个角落，甚至可能存在由国家支持的高级持续性威胁（APT）组织，窃取数据并准备完全接管或瘫痪您的工业流程。这在\
  \ IT 方面也可能发生，但在 OT 方面发生的频率更高，因为这些网络长期以来一直被忽视。这是因为它们多年来一直默默运行，从事自己的工作，而没有人关注其安全性。如果有任何险恶的事情发生，没有人会知道。而这正是威胁狩猎发挥作用的地方：它可以排除此类恶意活动正在进行，或者发现任何不当行为，并给我们机会解决它。\n\
  \n在将 IT 网络与 OT 网络连接起来或将新收购工厂的 OT 网络吸收到我们现有基础设施中之前，进行威胁狩猎也是有意义的。事先进行威胁狩猎练习将使我们能够评估情况，并确保我们不会通过连接这两个网络而打开混乱的闸门。\n\
  \n此类威胁狩猎练习应围绕以下三个假设进行：\n\n- 存在恶意软件并向其命令和控制服务器发出信标。\n- 在我们的终端上安装/运行了恶意（或不需要的）软件。\n\
  - 有可疑的外部连接进入工业环境。\n\n反驳这三个假设或挖掘出属于这些类别的任何系统，使我们能够在现有的 ICS 网络/环境中发现典型的恶意活动。\n\n接下来的三章将围绕执行这些特定类型的威胁狩猎练习展开。\n\
  \n## 执行威胁狩猎练习需要什么？\n\n那么，执行威胁狩猎练习需要什么？这个问题的简短答案是信息——关于您的资产的信息、资产之间传输的网络连接信息，以及用户与资产交互的信息。您对这三个方面的信息越详细，威胁狩猎就越成功。\n\
  \n尽管所需的数据和信息类型因威胁狩猎的具体情况而异，但拥有以下类型的信息可供随时使用，将有助于您在大多数情况下开始。沿途，可能需要额外的信息，并且必须获取这些信息以保持威胁狩猎练习的进行或扩大其覆盖范围。\n\
  \n### 网络流量日志\n\n由于我们处理的是正在进行威胁狩猎练习的网络系统和设备，我们应该掌握的最有价值的信息是网络流量和访问日志。想想防火墙日志、交换机日志、网络入侵检测/预防系统日志等等。通常是上述网络设备之一会提供最初的迹象（警报），表明情况不妙。但在狩猎练习期间，了解网络中传输的具体内容可以帮助我们做到其他信息无法做到的事情。\n\
  \n至少，您应该确保捕获网络连接信息，以及网络设备可能生成的任何事件日志。\n\n诸如 Zeek（以前称为 Bro – https://zeek.org/）之类的网络监控解决方案可以高效有效地捕获大量网络流量（元）数据和信息。我们在\
  \ *第 6 章，被动安全监控* 中讨论了 Zeek，它属于我“不要让客户没有”的安全监控工具类别。\n\n### 终端操作系统和应用程序事件日志\n\n我们掌握的下一个最有价值的信息是终端操作系统和应用程序日志。Windows\
  \ 和 Unix 系统及其上运行的应用程序会记录各种信息，例如用户登录系统、文件更改、设置被修改、系统时间被更改或与操作系统的其他交互。网络流量日志通常会将您指向可疑的正确系统，而操作系统和应用程序日志会向您展示确凿的证据；也就是说，系统为何试图连接到该中国\
  \ IP 地址以及是什么或谁启动了该连接。\n\n让我们看看操作系统或其应用程序在各种事件日志中记录的一些信息。\n\n### 终端保护日志\n\n显然，已安装的终端保护解决方案，例如基于主机的防火墙或反恶意软件，可以为您提供有关源自系统的恶意（网络）活动或在终端上运行的恶意代码的线索。\n\
  \n### 运行中的进程\n\n正如我们在前几章中所讨论的，进程是在系统上运行的可执行文件。进程负责系统正在执行的任务。查看系统上正在运行的进程（以及有关这些进程的详细信息，例如其启动位置、运行时、所有者等）将让我们了解终端正在做什么。此外，我们可以转储正在运行的进程或获取其可执行文件的哈希值，并使用\
  \ **VirusTotal** (`https://www.virustotal.com/`) 等在线服务来验证该进程是否合法。\n\n可以帮助收集终端运行进程信息的工具是\
  \ Sysinternal 的 **Process Explorer** (`https://docs.microsoft.com/en-us/sysinternals/downloads/process-explorer`)。以下屏幕截图显示了\
  \ **Process Explorer** 的运行情况。它提供了系统上运行的所有进程的详细视图：\n\n![](img/c8ffa9959721097701584fcc95101362_419_0.png)\n\
  \n图 10.2 – Sysinternal's Process Explorer\n\n此外，我们可以设置 Sysinternals 的 **Sysmon**\
  \ (https://docs.microsoft.com/en-us/sysinternals/downloads/sysmon)，使其作为服务运行并获取进程执行详细信息。然后它可以使用\
  \ **Wazuh** (https://wazuh.com/) 等工具将这些详细信息发送到我们的事件关联解决方案（SIEM）。Sysmon 和 Wazuh 在\
  \ *第 9 章，可视化、关联和警报* 中进行了讨论。以下屏幕截图显示了 *Sysmon* 围绕 *PowerShell.exe* 进程执行而生成的事件：\n\n\
  ![](img/c8ffa9959721097701584fcc95101362_420_0.png)\n\n图 10.3 – Sysinternals's Sysmon\n\
  \n在接下来的三章中，我们将大量使用 Sysmon 生成的日志，在其中我们将实际查看威胁狩猎练习。\n\n### 什么应用程序会自动启动？\n\n沿着进程的思路，我们想知道系统启动时启动了什么。恶意软件通常会使用某种方式在系统启动时自动启动，以在该系统上保持持久性。弄清楚操作系统启动时或用户登录时启动了什么，然后验证这些启动应用程序是否合法，通常会揭示是否有可疑的事情发生。\n\
  \n可以帮助收集自动启动应用程序的工具是 Sysinternal 的 **Autoruns** (`https://docs.microsoft.com/en-us/sysinternals/downloads/autoruns`)。以下屏幕截图显示了\
  \ **Autoruns** 工具对 Microsoft Windows 机器启动的 *所有内容* 的输出：\n\n![](img/c8ffa9959721097701584fcc95101362_421_0.png)\n\
  \n图 10.4 – Sysinternal's Autoruns\n\n\n\n\n\nThe highlighted code is a common way\
  \ of automatically starting applications on a Windows machine, through the HKLM\\\
  SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run registry key. Here, you can see\
  \ the name, start command, executable location, description, and install/configure\
  \ date.\n\n## What applications have been installed?\n\nAlong with identifying what\
  \ applications are starting up automatically, having a general overview of all the\
  \ applications that have been installed on a system can give us clues about any\
  \ malicious activities.\n\nA tool such as psinfo.exe from Sysinternals (https://docs.microsoft.com/en-us/sysinternals/downloads/psinfo)\
  \ can inventory the applications that have been installed (using the -s flag when\
  \ running the tool) on an individual system:\n\n```\nPS C:\\tools> .\\PsInfo.exe\
  \ -s\nPsInfo v1.78 - Local and remote system information viewer\nCopyright (C) 2001-2016\
  \ Mark Russinovich\nSysinternals - www.sysinternals.com\n```\n\nThe Psinfo tool\
  \ will list information about the system it has been run on, as shown in the following\
  \ output:\n\n```\nSystem information for \\\\WORKSTATION1:\nUptime:            \
  \              0 days 0 hours 48 minutes 42 seconds\nKernel version:           \
  \       Windows 10 Pro, Multiprocessor Free\nProduct type:                    Professional\n\
  Product version:                 6.3\nService pack:                    0\nKernel\
  \ build number:             15063\nRegistered organization:\nRegistered owner: \
  \               Windows User\nIE version:                      9.0000\nSystem root:\
  \                     C:\\Windows\nProcessors:                      2\nProcessor\
  \ speed:                 2.3 GHz\nProcessor type:                  Intel(R) Xeon(R)\
  \ Gold 5115 CPU @\nPhysical memory:                 2 MB\nVideo driver:        \
  \            VMware SVGA 3D\n```\n\nNext, it shows the applications that have been\
  \ installed:\n\n```\nApplications:\nTools for .Net 3.5 3.11.50727\n1732 IO-Link\
  \ Module Profile 1.39.0.0\n1734 IO-Link Module Profiles 1.41.80.0\nAdobe Reader\
  \ XI 11.0.00\nAdvanced Micro Controls 1734 Specialty Module Profiles 1.04.1.0\n\
  Advanced Micro Controls 1756 Specialty Module Profiles 1.03.1.0\nAdvanced Micro\
  \ Controls 1769 Specialty Module Profiles 1.10.1.0\nBuerkert GmbH Co. 1734 Discrete\
  \ Module Profiles 1.03.1.0\nBus Module Profile 1.01.30.0\nClearKeeper 1.0.0\nCognex\
  \ 1756 Comm Module Profiles 1.22.1.0\nControlFLASH 15.01.00\nDeviceNet Node Commissioning\
  \ Tool 1.0.0\nEndress+Hauser EtherNet/IP Analysis Module Profiles 1.21.1.0\nEndress+Hauser\
  \ EtherNet/IP Analysis Module Profiles 1.05.01.0\nEndress+Hauser EtherNet/IP Comm\
  \ Module Profiles 1.61.1.0\nEndress+Hauser EtherNet/IP Module Profiles 1.05.1.0\n\
  FANUC CNC EtherNet/IP Specialty Module Profiles 1.09.1.0\nFANUC Robotics EtherNet/IP\
  \ Specialty Module Profiles 1.36.1.0\n...\n```\n\nAdditionally, deploying an asset\
  \ management and inventory solution (such as SolarWinds IT Asset Management – https://www.solarwinds.com/solutions/it-asset-management)\
  \ can show all the applications that have been installed on an entire network.\n\
  \n## What users have been configured?\n\nAs part of their infiltration, attackers\
  \ will often create new users or manipulate the permissions of existing users. So,\
  \ verifying that the users that have been set up on a system are legitimate and\
  \ making sure their permissions have been defined properly can indicate if a system\
  \ has been compromised.\n\nA tool that can help with collecting these configured\
  \ users and user groups is a tool that's native to Windows called `net.exe`. In\
  \ the following example, we are running the `net` tool to enumerate all the users\
  \ on a Windows computer:\n\n```\nPS C:\\tools> net user\nUser accounts for \\\\\
  WORKSTATION1\n\n\n\nAdministrator      DefaultAccount     Guest\npac           \
  \     RsWebDav           theAttacker\n\nThe command completed successfully.\n```\n\
  \nWe can also enumerate security groups, as shown in the following example:\n\n\
  ```\nPS C:\\tools> net localgroup\nAliases for \\\\WORKSTATION1\n\n\n\n\n------------------------------------------------\n\
  ----\n*Access Control Assistance Operators\n*Administrators\n*Backup Operators\n\
  *Cryptographic Operators\n*Distributed COM Users\n*Event Log Readers\n*Guests\n\
  *Hyper-V Administrators\n*IIS_IUSRS\n*Network Configuration Operators\n*Performance\
  \ Log Users\n*Performance Monitor Users\n*Power Users\n*Remote Desktop Users\n*Remote\
  \ Management Users\n*Replicator\n*SQLServer2005SQLBrowserUser$DESKTOP-JNASSB6\n\
  *SQLServerMSSQLServerADHelperUser$DESKTOP-JNASSB6\n*SQLServerMSSQLUser$DESKTOP-JNASSB6$FTVIEWX64TAGDB\n\
  ```\n\n```\n*SQLServerSQLAgentUser$DESKTOP-JNASSB6$FTVIEWX64TAGDB\n*System Managed\
  \ Accounts Group\n*Users\nThe command completed successfully.\n```\n\nThe net.exe\
  \ command has many uses and functionalities. To find our more about this command,\
  \ head on over to https://www.lifewire.com/net-command-2618094.\n\n## What is the\
  \ resource utilization of the system?\n\nVarious kinds of malware can have a negative\
  \ impact on the performance of a system. Be it because of either bad coding practices\
  \ or because the malware is using excessive system resources to commutate bitcoins\
  \ to make some money for the attacker, identifying systems that are showing signs\
  \ of prolonged elevated resource usage are often a good indication of foul play\
  \ at hand.\n\nA tool such as Sysinternal's Process Explorer can visualize the system\
  \ resource utilization on an individual system, but deploying an asset inventory\
  \ and management solution can help you find the overachievers on an entire network.\
  \ The following is a snapshot of the SolarWinds IT Asset Management resource utilization\
  \ screen:\n\n![](img/c8ffa9959721097701584fcc95101362_426_0.png)\n\nFigure 10.5\
  \ – SolarWinds IT Asset Management – Resource Monitor\n\nThe SolarWinds IT Asset\
  \ Management solution will not only characterize any endpoint and inventory installed\
  \ software and applications – it will also trend the resource utilization of a system\
  \ over a long period of time, allowing for correlation and anomaly detection.\n\n\
  ## Any modifications to files, registry, settings, and so on?\n\nBeing able to identify\
  \ changes that have been made to files, settings, and a system's configuration,\
  \ and then being able to narrow down those changes to data, users, or applications,\
  \ can help narrow down the who, what, where, and when around a system compromise.\n\
  \nA tool such as Sysinternal's Sysmon (https://docs.microsoft.com/en-us/sysinternals/downloads/sysmon)\
  \ will record interesting changes that have been made to the system and can also\
  \ send detection logs to an SIEM with the help of tools such as Wazuh (https://wazuh.com/).\
  \ Sysmon and Wazuh were discussed in Chapter 9, Visualizing, Correlating, and Alerting.\n\
  \n## Sysinternals\n\nIf you haven't gotten the hint yet, Sysinternal's tools are\
  \ tremendously helpful in getting all kinds of information about a Windows system.\
  \ I only mentioned a few here, but there are many more that can aid you in a large\
  \ variety of administrative, investigative/forensics, and maintenance activities.\
  \ Head on over to https://docs.microsoft.com/en-us/sysinternals/ and become familiar\
  \ with the many excellent (and free) tools the site has to offer.\n\nThis concludes\
  \ our discussion around the tools and methods that can help us investigate, interrogate,\
  \ and inventory endpoints and the software and applications they run. Next, we will\
  \ look at the network side of things.\n\n## Making modifications to PLC, HMI, and\
  \ other control systems and equipment\n\nRegularly comparing the running software,\
  \ applications, and settings of your ICS equipment can show unauthorized changes.\
  \ You could, for example, routinely pull the PLC program from a Rockwell PLC and\
  \ use the compare tool that ships with Studio 500/5000 to detect changes. More details\
  \ on these compare tools can be found here: https://literature.rockwellautomation.com/idc/groups/literature/documents/um/1dct-um001_-en-e.pdf.\n\
  \nThe same can be done with HMI projects, configuration files, and settings backups.\
  \ The trick is to create a known secure/valid initial backup to compare against.\n\
  \nFrom an automated perspective, FactoryTalk AssetCentre can be configured to periodically\
  \ pull HMI and PLC applications, and then automatically compare the pulled copy\
  \ against a template/baseline and send email notifications on detected discrepancies.\
  \ Details on how to configure FactoryTalk AssetCentre for this purpose can be found\
  \ here: https://literature.rockwellautomation.com/idc/groups/literature/documents/um/secure-um001_-en-p.pdf.\n\
  \n## Tracking new and changed devices on the (industrial) network\n\nTaking periodic\
  \ snapshots of all the devices on your network and identifying them can help you\
  \ detect rogue or changed devices. Slow and non-intrusive Nmap scans can be fired\
  \ off, generating inventory and device/service details file that can be compared\
  \ during subsequent scans. The following is an example Nmap scan definition that\
  \ you can set up as a scheduled task to run on a daily/weekly/monthly interval:\n\
  \n```\nnmap -sV -T3 172.25.100.0/24 -oX ProdScan-'date +%F'.nmap\n```\n\nThe preceding\
  \ command will instruct Nmap to run a slow (-T3) services scan (-sV) of the production\
  \ network range (172.25.100.0/24) and store the results in an XML formatted file\
  \ with today's date appended to it (-oX ProdScan-'date +%F'.nmap).\n\nYou can also\
  \ narrow down the port range, IP address range, and so on to minimize the impact\
  \ on network equipment resource utilization.\n\n\n\n\nNmap 扫描完成后，我们可以使用 `Ndiff`（Nmap\
  \ 结果比较）工具来检测变更：\n\n```text\npac@KVM010011) [~] $ ndiff ProdScan-2021-04-11.nmap\n\
  ProdScan-2021-05-11.nmap\n\n-Nmap 7.91 scan initiated Tue May 11 14:08:22 2021 as:\
  \ nmap -sV\n-T5 -oX ProdScan-2021-05-11.nmap 172.25.100.0/24\n+Nmap 7.91 scan initiated\
  \ Tue May 11 14:09:04 2021 as: nmap -sV\n+T5 -oX ProdScan-2021-05-11.nmap 172.25.100.0/24\n\
  \n 172.25.100.222 (PLC-WEST):\n-Not shown: 999 closed ports\n+Not shown: 998 closed\
  \ ports\n PORT  STATE SERVICE VERSION\n+80/tcp open  http    Apache httpd 2.4.46\
  \ ((Debian))\n```\n\n借助更多 Linux 命令技巧，你甚至可以配置脚本将检测到的任何变更通过电子邮件发送出来。\n\n## 网络服务事件日志\n\
  \n许多网络服务（如果不是全部的话）允许你针对多种活动和状态生成事件日志。例如，DNS 服务器可以记录诸如哪个联网系统正在请求哪个域名/URL 以及响应结果是什么等详细信息，而\
  \ Web 服务器则可以提供关于请求方浏览器和系统的详细信息，例如操作系统详情及其 User-Agent 字符串。通常，能够访问此类日志可以帮助我们缩小搜索范围，或者通过暴露更多可能已被入侵的系统来拓展威胁狩猎的视野。\n\
  \n## SIEM\n\n这些事件、日志和数据中的许多内容都可以通过**安全信息与事件管理（SIEM）**系统来收集，然后由操作系统或安装的安全网络解决方案代理发送到\
  \ SIEM。在接下来三章的威胁狩猎场景中，我们将发现，SIEM 系统是进行威胁狩猎练习以及观察整体网络安全态势的宝贵工具。\n\n## 网络数据包捕获\n\n\
  尽管 Zeek 等工具提供了关于连接和网络安全数据包（元）数据的丰富信息，但有时为了发现特定信息，仍然需要完整的数据包捕获。在这些情况下，使用 Wireshark（https://www.wireshark.org/）这样的工具可以帮助你。请确保将其连接到您想要捕获数据包的网络部分的\
  \ SPAN/MIRROR 端口，并让 Wireshark 发挥作用。关于 SPAN 端口的详细信息在第 4 章“设计具有安全意识的基础设施控制系统架构”中进行了讨论。\n\
  \n## 研究、查询和比较资源\n\n以下是一些在线资源，可以提供诸如 IP/URL/域名信誉、WHOIS 和注册商信息、入侵指标（IOC）、垃圾邮件列表、恶意文件/域名/URL\
  \ 查询等威胁信息。\n\n这些资源有助于进行验证、查询和比较任务，并在威胁狩猎活动期间获取与安全相关/威胁产物的通用信息：\n\n- VirusTotal:\
  \ https://www.virustotal.com/\n- GreyNoise Visualizer: https://viz.greynoise.io/\n\
  - Domain tools: https://research.domaintools.com/\n- AlienVault Open Threat Exchange:\
  \ https://otx.alienvault.com/\n- Shodan: https://www.shodan.io/\n- Censys: https://censys.io/\n\
  \n我喜欢在我的 Web 浏览器中将鼠标右键上下文菜单映射到这些在线服务，以便我可以高亮显示 URL/IP/域名/哈希值并快速、方便地发送以获取信息。我系统中安装用于执行此操作的浏览器插件是\
  \ YoshifumiFuyuno 开发的 Search-from-Popup-or-ContextMenu，可以在 GitHub 上的 https://github.com/YoshifumiFuyuno/Search-from-Popup-or-ContextMenu\
  \ 找到：\n\n![](img/c8ffa9959721097701584fcc95101362_431_0.png)\n\n图 10.6 – 威胁信息上下文菜单\n\
  \n上述截图显示了所选 IP 地址（1.1.1.1）的鼠标右键上下文查询选项。由插件添加的上下文菜单选项（已配置了一些有用的在线资源）为在威胁狩猎练习中查找威胁信息提供了便利方式。\n\
  \n这涵盖了我们关于威胁狩猎的高层次讨论。接下来，我们将简要讨论我们的发现。\n\n## 威胁狩猎旨在揭露威胁\n\n正如我们在本章开头提到的，威胁狩猎通常只涉及发现环境中可能存在的威胁，这可能是作为常规活动进行的，也可能是由自动化系统发现的结果或某种其他形式的发现引发的。威胁狩猎练习的发现结果应移交给事件响应团队。\n\
  \n## 出于威胁狩猎目的关联事件和警报\n\n你进行威胁狩猎练习的主要工具应该是某种形式的事件关联解决方案。我们需要一种便捷的方式来发现异常，并在更大范围内关联/比较这些异常，以查看我们是否能找到更多关于我们正在寻找内容的线索。现有的\
  \ SIEM 解决方案通常非常适合威胁狩猎的目的。但请注意，我们将使用 SIEM 作为查找和关联方法来发现威胁；我们不会依赖 SIEM 内置的检测机制来告诉我们这些威胁在哪里。那只是一个自动警报，而不是威胁狩猎练习。如前所述，SIEM\
  \ 警报可能会触发威胁狩猎练习，但 SIEM 本身并不是一个威胁狩猎资源。\n\n在上一章，第 9 章“可视化、关联和警报”中，我们查看、安装、配置并使用了一个出色的事件和警报管理及关联解决方案，该解决方案既提供\
  \ SIEM 功能，也提供关联和搜索功能，以帮助协助威胁狩猎活动。我指的是 ElasticSearch、Logstash 和 Kibana（ELK）技术栈，它作为我们部署的\
  \ Security Onion 装置的一部分提供。Security Onion 将 ELK 实现为一系列安全监控工具的一部分，这非常有利于威胁狩猎练习。在接下来三章的威胁狩猎练习中，我们将专门使用\
  \ Security Onion，特别是 ELK 技术栈。\n\n## 摘要\n\n在本章中，我们讨论了威胁狩猎的核心内容。我们研究了威胁狩猎的基础知识以及驱动威胁狩猎练习的威胁假设。我们还从信息角度研究了威胁狩猎练习所涉及的方面，并讨论了一些可以为我们提供这些信息工具。最后，我们讨论了关联所有这些信息以执行威胁狩猎中最基本任务——寻找威胁的必要性。\n\
  \n现在是时候获得一些威胁狩猎的实践经验了。我们将通过执行三个基本的威胁狩猎练习来实现这一点，这些练习都旨在帮助你快速挖掘我们环境中可能存在的威胁行为者。我们将通过寻找一些常见的入侵迹象来完成此任务，下一章将从信标流量开始。\n\
  \n# 11\n威胁狩猎\n场景 1 –\n恶意软件信标\n\n现在是时候通过实际的威胁狩猎练习来“大显身手”了。本章是三个针对性威胁狩猎练习中的第一个。这些威胁狩猎练习的假设旨在帮助我们发现尽可能多的恶意活动，当我们面临采用或集成新的基础设施控制系统网络，或对现有基础设施控制系统网络进行添加/扩展时。想法是，通过在未知的\
  \ ICS 网络上预先执行这三个练习，我们可以有合理的把握在打开大门之前发现任何不速之客。\n\n本章的一个预先警示：我们将涵盖大量工具，为了减少页数，我通常只提供关于工具工作原理的很少背景信息。在适用情况下，将提供指向相关工具或技术额外资源的链接。\n\
  \n本章作为三个威胁狩猎练习中的第一个，将解释如何执行威胁狩猎活动，以证明或反驳本练习的假设：*存在（试图）向外部 IP/域名发出信标的恶意行为者*。\n\n\n\
  \n\n本章将从定义此次威胁狩猎演练的假设开始，随后通过一系列活动帮助我们发现支持该假设的证据。贯穿整章，我们将使用各种工具、技术和策略对多种端点进行操作，以追踪线索并发现拼图的碎片，最终帮助我们得出结论：我们的环境中是否正在发生恶意的信标行为。\n\
  \n本章将涵盖以下主题：\n\n- 形成恶意软件信标威胁狩猎假设\n- 在 ICS 环境中检测信标行为\n- 解释恶意软件信标\n- 调查/对可疑端点进行取证\n\
  - 使用 Volatility 进行端点内存取证\n- 恶意软件分析入门\n- 使用失陷指标（IOC）发现更多可疑系统\n\n# 形成恶意软件信标威胁狩猎假设\n\
  \n正如我们在上一章中讨论的，威胁狩猎演练是围绕假设展开的。通常，假设是跟随或反映已发现的安全事件、自动化安全监控系统的某种警报，或安全分析师的发现。我们将在本章中执行的威胁狩猎演练略有不同，因为我们要进行威胁狩猎活动的环境对我们来说是陌生或全新的。例如，我们的公司购买了一个新的生产工厂，其中包含现有的\
  \ ICS 网络基础设施，他们希望将其连接到现有的公司基础设施中，而我们希望确保这样做的安全性。另一种情况是，你运行 ICS 网络已经很长时间，但从未认真检查过其安全状况；在这种情况下，这种无诱因的威胁狩猎演练可以迅速且准确地让你了解\
  \ ICS 环境中的恶意活动或内容。\n\n我们要围绕的第一个假设是直觉或假设：ICS 网络上存在威胁行为者（攻击者或恶意软件），他们试图向其主服务器或命令与控制中心（C&C\
  \ 或 C2）发送信标。\n\n为了为本章及随后两章中的演练设置场景，请想象我们在工业网络中的一个战略位置部署了一台 Security Onion 设备，并收集了大约一周的网络工件。我们配置了出站防火墙向\
  \ Security Onion 虚拟机的 syslog 服务报告，并在网络上的所有 Windows 系统上安装了 Sysmon 和 Wazuh（如第 9 章“可视化、关联和告警”中所示）。通过这种设置，我们通过\
  \ Zeek 收集网络连接数据，通过 Snort 获取 IDS 数据，通过 Wazuh 收集 Windows 事件和 Sysmon 数据，并从我们的 syslog\
  \ 实现中获取防火墙详细信息。\n\n在本章的其余部分，我们将寻找信标活动的迹象并调查任何发现。\n\n## 在 ICS 环境中检测信标行为\n\n以下活动旨在发现信标流量。为了支持这些努力，让我们首先了解恶意软件信标实际包含的内容。\n\
  \n## 恶意软件信标解释\n\n信标行为在诸如僵尸网络等恶意软件中非常常见。僵尸程序会定期“回家”与其 C2 或 C&C 服务器通信，查看是否有任何僵尸网络代码更新或僵尸程序主控希望僵尸程序执行任何命令。\n\
  \n从检测角度来看，信标尝试看起来像一系列以稳定间隔发起的连接，例如每 10 分钟一次。下图展示了信标（较短的条形）以及一些反馈或响应活动（随后较长的条形）的描绘：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_435_0.png)\n\n图 11.1 – 典型的信标模式\n\n难点在于生成一个图表，使该模式的检测在众多其他连接中脱颖而出。我们将看到如何在事件日志上应用以下三种常见规则，以帮助我们识别信标模式：\n\
  \n- **按协议过滤**：信标通常通过 TCP、UDP 或 ICMP 之一发生，其中 TCP 最为常见。仅过滤特定协议有助于消除多余的连接。\n- **过滤掉本地目标\
  \ IP**：信标数据包/连接总是针对外部 IP 地址；坏人可能不坐在与受感染机器相同的网络上。过滤目标地址在内部网络范围内的任何事件，可以消除查看此类连接。\n\
  - **按发送的数据量过滤**：信标通常体积很小；最初发送到外部 IP 地址的数据量很小，只需足以说“嘿，有什么新鲜事吗？有给我什么更新吗？”响应可能包含更多数据，但初始的信标介于\
  \ 10 字节和 10,000 字节之间。按此大小过滤有助于缩小搜索范围。\n\n## 数据外泄\n\n与信标类似，数据外泄会以定期间隔创建到外部 IP 地址的一系列连接。通常，数据包的大小或会话期间传输的数据量是区分信标和数据外泄的唯一特征。从检测角度来看，我们要同时寻找信标和数据外泄活动。数据外泄将在第\
  \ 13 章“威胁狩猎场景 3 – 可疑的外部连接”中详细讨论。\n\n## 合法应用程序的信标\n\n应用程序向其主页发送信标有一些合法用途。例如，软件可以定期回家查看是否有任何可用的更新。另一个例子，也是你将在网络上遇到的最常见的信标行为，是**网络时间协议（NTP）**向外（互联网）发送请求以获取当前时间。作为威胁猎人，由我们在探索日志和告警时消除这些误报，并将它们添加到我们的良性列表中。\n\
  \n## 使用 Security Onion 检测信标行为\n\n在三个威胁狩猎演练中，我们将使用我们在第 9 章“可视化、关联和告警”中构建的 Security\
  \ Onion 虚拟机。因此，让我们在以下练习中熟悉它。\n\n> 注意：我们将在第 19 章“实验室设置”中全面讨论实验室架构，其中将 Security Onion\
  \ 设备置于整体实验室架构的背景下。目前请知道，Security Onion 已为 ICS 环境进行了定位和配置。\n\n为了能够登录到 Security Onion\
  \ 的 Kibana 门户，除了 Security Onion 虚拟机本身以外的其他位置，我们需要使用之前用于允许访问 syslog 服务的 so-allow\
  \ 工具来允许访问：\n\n1. 登录到 Security Onion 设备的控制台（通过 ESXi 主机门户的虚拟机控制台视图，或通过已经从允许与设备交互的机器上的\
  \ SSH 会话），并输入以下命令：\n\n```\n[pac@securityonion ~]$ sudo so-allow\n[sudo] password\
  \ for pac:\nThis program allows you to add a firewall rule to allow connections\
  \ from a new IP address.\n\nChoose the role for the IP or Range you would like to\
  \ add\n[a] - Analyst - ports 80/tcp and 443/tcp\n[b] - Logstash Beat - port 5044/tcp\n\
  [e] - Elasticsearch REST API - port 9200/tcp\n[f] - Strelka frontend - port 57314/tcp\n\
  [o] - Osquery endpoint - port 8090/tcp\n[s] - Syslog device - 514/tcp/udp\n[w] -\
  \ Wazuh agent - port 1514/tcp/udp\n[p] - Wazuh API - port 55000/tcp\n[r] - Wazuh\
  \ registration service - 1515/tcp\n```\n\n2. 现在我们指定希望 Security Onion 允许的内容，选择选项\
  \ a - Analyst：\n\n```\n...\nPlease enter your selection:\n```\n\n如前图所示，在我们指定的时间段（过去\
  \ 8 小时）内，Security Onion 数据库中有约 250,000 个事件。这是大量数据，而我们的任务是找到有趣的内容。\n\nKibana 的设置和布局是专门为\
  \ Security Onion 修改的。要获取有关如何导航界面的更多信息，请访问 Security Onion 的官方文档 https://docs.securityonion.net/en/2.3/kibana.html。\n\
  \n## 穿越连接事件的大洋\n\n为了找到信标行为，我们将通过从左上角的导航面板导航到 Network – Connections，切换到 Kibana 连接视图。从这里，我们可以看到\
  \ Security Onion 记录的所有连接的摘要视图，在我的情况下是 31,416 个：\n\n![](img/c8ffa9959721097701584fcc95101362_439_0.png)\n\
  \n图 11.3 – Security Onion – 连接仪表板\n\n\n\n\n如果您按照自己的 Security Onion 安装进行操作，您可能已经注意到我的视图中\
  \ **Connections Over Time** 小部件显示了条形图，以及额外的小部件显示了网络传输协议汇总。在我看来，这两个更改使查看和排序变得更容易。要进行这些更改，请执行以下步骤：\n\
  \n- 1. 点击页面右上角的仪表板 **Edit** 按钮。这将启用对该仪表板可视化的编辑。现在点击 **Connections Over Time** 小部件右上角的小齿轮并选择\
  \ **Edit visualization**：\n\n![](img/c8ffa9959721097701584fcc95101362_440_0.png)\n\
  \nFigure 11.4 – Security Onion – bar chart visualization\n\n- 2. 这将打开可视化编辑器屏幕；点击\
  \ **Metrics & axes** 选项卡并将图表类型更改为 **Bar**：\n\n![](img/c8ffa9959721097701584fcc95101362_440_1.png)\n\
  \nFigure 11.5 – Security Onion – bar chart configuration\n\n我们从为网络传输协议过滤结果开始。如本章开头所述，beacon\
  \ 可以使用任何流行的网络协议，例如 TCP、UDP 或 ICMP，但通常 beacon 会使用 TCP 协议。因此，我们可以通过在 Network – Transport\
  \ 饼图小部件中点击 TCP 甜甜圈切片来开始调查，从而缩小连接的范围并仅查找 TCP 连接（如果此决定证明是徒劳的，我们始终可以回来尝试 UDP 或 ICMP）：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_442_0.png)\n\nFigure 11.7 – Security\
  \ Onion – connections protocol summary\n\n此操作有效地对仪表板应用了过滤器，告诉 Kibana 仅显示 network.transport.keyword\
  \ 等于 tcp 的事件。您可以在仪表板左上角看到此过滤器，我们可以通过 Edit filter 按钮对其进行修改：\n\nFigure 11.8 – Security\
  \ Onion – edit filter\n\n我们此时不会更改过滤器；取消编辑屏幕。\n\n此时，我们可以看到通过对 TCP 协议进行过滤，显示的连接数量显著减少，降至\
  \ 15,276。仍然是一个很大的数量，但我们正在取得进展：\n\nFigure 11.9 – Security Onion – connections TCP\
  \ count\n\n![](img/c8ffa9959721097701584fcc95101362_443_0.png)\n\n![](img/c8ffa9959721097701584fcc95101362_443_1.png)\n\
  \n接下来，我们将应用 beaconing 流量第二个特定属性：beacon 针对外部 IP 地址作为目标。我们将过滤掉目标 IP 地址为本地 IP 地址的任何连接。Beaconing\
  \ 流量始终会针对本地子网之外的系统，因此排除属于 ICS 网络的目标地址应该可以剔除大量无关信息。为了实现这一点，我们将把以下搜索查询添加到 Connections\
  \ 仪表板的搜索字符串中：AND ( NOT destination.ip: 172.25.100.0/24 )。结果视图如下：\n\n![](img/c8ffa9959721097701584fcc95101362_444_0.png)\n\
  \nFigure 11.10 – Security Onion – connections to external addresses\n\n嗯，这似乎并没有带来太多改变。我们仍然看到大量连接。是时候围绕\
  \ beaconing 行为的最后一个特定属性——传输数据量——应用过滤器了。我们将过滤 Kibana 结果，仅显示原始大小（请求数据包大小）在 10 到 10,000\
  \ 字节之间的包。低端选择 10 消除了由于某种原因未得到响应的 SYN 包。以下搜索查询（连同我们设置的过滤器）将应用所有三个 beaconing 特定搜索参数，以帮助筛选出\
  \ beaconing 流量：\n\n```\nAND ( NOT destination.ip: 172.25.100.0/24 ) AND ( client.bytes\
  \ < 10000 ) AND ( client.bytes > 10 )\n```\n\n运行此搜索后，Kibana 仪表板如下所示：\n\n![](img/c8ffa9959721097701584fcc95101362_445_0.png)\n\
  \nFigure 11.11 – Security Onion – connections – size restricted\n\n降至 **86** 个连接；这变得可以管理了。让我们看看目标地址方面是否有任何突出之处。滚动到\
  \ **Connections – Destination IP Address** 可视化以查看连接的目标 IP 地址：\n\n![](img/c8ffa9959721097701584fcc95101362_445_1.png)\n\
  \nFigure 11.12 – Security Onion – connections by destination\n\n此时，我们将选择其中一个 IP\
  \ 地址并查看连接条形图的样子。让我们从第二个 91.189.92.41 开始。将鼠标悬停在 IP 地址文本上并点击 Filter for value 按钮（带加号的圆圈）：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_446_0.png)\n\nFigure 11.13 – Security\
  \ Onion – connections – filter by destination IP\n\n这将我们的视图过滤为仅显示目标 IP 地址为 91.189.92.41\
  \ 的连接：\n\n![](img/c8ffa9959721097701584fcc95101362_446_1.png)\n\nFigure 11.14 –\
  \ Security Onion – connections not a beacon pattern\n\n嗯，这绝对不像是 beaconing 行为。记住，典型的\
  \ beaconing 模式看起来像是连接的稳定流，遵循某种重复的时间模式。我们将删除对 91.189.92.41 的过滤器并改用 222.222.222.222\
  \ 进行过滤：\n\n![](img/c8ffa9959721097701584fcc95101362_446_2.png)\n\nFigure 11.15 –\
  \ Security Onion – connections – looks like a beaconing pattern\n\n这看起来更像是稳定的模式。Connections\
  \ Over Time 条形图显示在 8 小时的时间范围内每 10 分钟有 1 次连接，持续稳定。至少可疑。如果我们滚动到底部的 All Logs 视图，我们会看到每\
  \ 10 分钟整点出现一次连接事件：\n\n![](img/c8ffa9959721097701584fcc95101362_447_0.png)\n\nFigure\
  \ 11.16 – Security Onion – connections – zoomed in\n\n这些事件完全反映了典型的 beaconing 模式。我们看到持续、间隔均匀的连接。它们每\
  \ 10 分钟发生一次，贯穿整个 8 小时时间跨度。此外，由于我们通过仅查看 TCP 连接排除了典型的合法 beaconing 行为，例如 NTP（如果我们查看事件的详细信息，Zeek\
  \ 将连接分类为 HTTP），我们可以相当确定这至少可疑，如果不是完全恶意的话。\n\n当我们在 IP 信誉服务上查找目标 IP 地址 222.222.222.222\
  \ 时，我们的怀疑应该会加深（接下来显示 AlienVault IP 查找）：\n\n![](img/c8ffa9959721097701584fcc95101362_448_0.png)\n\
  \nFigure 11.17 – AlienVault OTX info on 222.222.222.222\n\n我认为到目前为止我们有足够的理由说这是 beaconing\
  \ 行为。在我们继续并开始查找 beacon 的发送机器之前，我想向您展示另一种工具/技巧，用于在这种方法不起作用时或作为验证来查找 beaconing 流量。我们将查看网络分析工具\
  \ RITA。\n\n## Using RITA to detect beaconing behavior\n\n为了简化我们的生活，我们将使用 Active\
  \ Countermeasures 提供的免费工具，即 RITA 或 Real Intelligence Threat Analytics（https://github.com/activecm/rita）。RITA\
  \ 是一个开源框架，旨在帮助进行网络分析。该工具将 Zeek 日志摄入数据库并可以执行以下检测：\n\n- Beaconing detection: Helps\
  \ search for signs of beaconing behavior in your environment\n- **DNS tunneling\
  \ detection:** Helps search for signs of DNS-based covert (hidden) channels/tunnels\n\
  - **Blacklist checking:** Performs domain and host blacklists lookups to search\
  \ for suspicious entries\n\n要在我们的 Security Onion 机器上安装 RITA，我们将执行以下步骤：\n\n- 1. SSH\
  \ 进入 Security Onion VM 并运行以下命令以创建安装文件夹、下载工具并安装它：\n\n```\npac@secOnion-002:~$ mkdir\
  \ tools\npac@secOnion-002:~$ cd tools/\npac@secOnion-002:~/tools$ git clone https://github.com/activecm/rita.git\n\
  \nCloning into 'rita'...\nremote: Enumerating objects: 75, done.\nremote: Counting\
