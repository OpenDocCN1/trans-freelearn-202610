  \ 主机密码：BamRork5 |\n| 下载大小 | 1,015.1 MB |\n| 磁盘大小 | 2.8 GB（精简置备）100.0 GB（厚置备） |\n\
  \n取消 返回 下一步\n\n图 6.56 – 练习 3 – SilentDefense – 部署传感器 VM OVF 4\n\n7. 我们已经到达部署过程的第5步。现在需要指定要将虚拟机部署到的数据存储。选择具有足够容量的数据存储，然后点击下一步。\n\
  \n8. 在部署过程的第6步中，为桥接的源网络选择 **SPAN-DPortGroup** 作为目标网络，然后点击下一步。过程如下图所示：\n\n#### 部署\
