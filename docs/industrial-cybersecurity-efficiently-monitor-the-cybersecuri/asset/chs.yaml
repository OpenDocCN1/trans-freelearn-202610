  \ |  |\n| > 网络适配器 1 * | VM Network | v | 连接... |\n| > 网络适配器 2 | SPAN-DPortGroup\
  \ | v | 连接... |\n| > CD/DVD 驱动器 1 * | 客户端设备 | v | 连接... |\n| > 视频卡 * | 自动检测设置 |\
  \ v |  |\n| VMC1 设备 | 虚拟机 PCI 总线上为虚拟机通信接口提供支持的设备 |  |\n| > 其他 | 附加硬件 |  |\n|  |\
