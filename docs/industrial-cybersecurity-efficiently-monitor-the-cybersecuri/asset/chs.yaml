  \ `C:\\windows\\temp` 文件夹启动就非常可疑。恶意软件有时会注册内核驱动程序以在系统上实现持久化，然后将已安装/已启动的驱动程序列表作为常规检查进行比对。\n\
  \n## 服务\n\n已配置为在系统启动或用户登录时自动启动的进程（应用程序）称为服务。我们可以通过导航到软件环境 | 服务来调出当前配置的服务列表：\n\n\
  ![](img/c8ffa9959721097701584fcc95101362_310_0.png)\n\n恶意软件通常会创建服务作为感染过程的一部分，以便在系统上建立持久化，使恶意软件随计算机启动而启动。将一段时间内或与类似系统对比的已安装和正在运行的服务快照进行比较，通常能发现恶意软件感染。\n\
  \n## 正在运行的进程\n\n进程（或任务）是映射到内存中的应用程序（程序文件），它们运行代码并执行任务。因此，如果我们查看进程，就可以了解系统正在执行的任务。要获取系统信息工具抓取信息时正在运行的进程列表，我们可以转到软件环境\
  \ | 正在运行的任务：\n\n![](img/c8ffa9959721097701584fcc95101362_311_0.png)\n\n图 7.25 –\
  \ msinfo32 – 正在运行的进程（任务）\n\n同样，通常会将此列表按文件（路径）排序，以识别进程启动的异常位置。\n\n将不同时间段或类似系统之间的运行进程转储进行对比，可以发现恶意软件或其他不需要的软件的感染。这对于\
  \ ICS 系统尤其适用，因为 ICS 系统中的计算机往往长时间运行相同的应用程序集。运行进程集的变化会显得格外醒目。\n\n## 启动程序\n\n除了服务之外，Windows\
  \ 还提供了多种在系统启动或用户登录时自动启动应用程序的方法。系统信息工具会显示通过其中某些方法自动启动的应用程序。我们可以通过导航到 **软件环境 | 启动程序**\
  \ 来查看这些应用程序：\n\n![](img/c8ffa9959721097701584fcc95101362_311_1.png)\n\n图 7.26 –\
  \ msinfo32 – 启动程序\n\n此视图显示程序名称、启动命令、程序使用的用户帐户以及用于自动启动程序的启动方法。同样，抓取启动程序的快照并在一段时间内或与类似系统进行对比，可以发现各种恶意行为。\n\
  \n## 导出报告\n\n为了创建此信息的记录，以便日后进行比较，我们可以通过 文件 | 导出 菜单选项导出系统信息报告。请确保在导出前已选中系统摘要位置，因为这可以保证所有信息都被导出：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_312_0.png)\n\n图 7.27 – msinfo32 – 导出报告\n\
  \n这样，我们就有了 HMI-1 计算机系统信息和系统状态的记录。你应该将其安全地存储在网络上，以便妥善保管和轻松检索。\n\n\n\n\n\n## 已配置的用户\n\
  \n尽管 msinfo32.exe 应用程序抓取了大量信息，但缺少一个关键细节：系统用户账户。为了将此信息添加到我们的捆绑包中，我们可以使用随当今每个版本的 Windows\
  \ 一起提供的原生 net.exe 工具。\n\n## Net user\n\n我们想要获取的第一种用户信息是本地账户。这可以通过在 Windows 命令提示符中发出\
  \ net user 命令来完成：\n\n```\nC:\\Documents and Settings\\Administrator>net user\n\n\
  User accounts for \\\\HMI-1\n\n----------------------------------------\n---------\n\
  Administrator          Guest          HelpAssistant\nSUPPORT_388945a0\nThe command\
  \ completed successfully.\n```\n\n该工具的输出显示了所有本地配置的用户账户。输出随时间的变化应被视为高度可疑。\n\n## Net\
  \ localgroup administrators\n\nnet user 命令仅显示在计算机上创建的本地账户。我们想查看是否创建了任何域账户或特殊账户并将其添加到系统的特权组中。我们使用\
  \ net localgroup <groupname> 命令来做到这一点。以下示例显示了属于 Administrators 组的用户账户（Windows 客户端系统上最特权的组）：\n\
  \n```\nC:\\Documents and Settings\\Administrator>net localgroup administrators\n\
  Alias name          administrators\nComment             Administrators have complete\
  \ and unrestricted access to the computer/domain\n\nMembers\n\n----------------------------------------\n\
  ---------\n```\n\nAdministrator\n\nQT-DOMAIN\\Domain Admins\n\nThe command completed\
  \ successfully.\n\n此外，我们对 **power users** 组感兴趣：\n\nC:\\Documents and Settings\\\
  Administrator>net localgroup \"power users\"\n\nAlias name  power users\n\nComment\
  \  Power Users possess most administrative powers with some restrictions. Thus,\
  \ Power Users can run legacy applications in addition to certified applications\n\
  \nMembers\n\n-----------------------------------------------------------------------------\
  \ -------\n\nThe command completed successfully.\n\n最后，如果我们想查看是否创建了不应该存在的任何组，我们可以不指定组使用\
  \ net localgroup 命令：\n\nC:\\Documents and Settings\\Administrator>net localgroup\n\
  \nAliases for \\\\HMI-1\n\n----------------------------------------------------------------------------\n\
  \n*Administrators\n\n*Attackers\n\n*Backup Operators\n\n*Guests\n\n*HelpServicesGroup\n\
  \n*Network Configuration Operators\n\n*Power Users\n\n*Remote Desktop Users\n\n\
  *Replicator\n\n*Users\n\nThe command completed successfully.\n\n这些命令的输出可以轻松复制并粘贴到已导出的系统信息报告中，以完成信息包。\n\
  \n至此，我们已经结束了对工业环境的积极探索。通过使用与端点交互或在网络上传送数据包的主动工具，我们发现了大量信息，这些信息可以帮助我们建立包含服务、应用程序和操作系统版本等详细信息的资产清单，包括软件和固件修订版。我们还拥有用户账户和其他端点特定细节的清单。我们应该以一种方便的方式存储所有这些信息，使我们能够查询工业环境安全态势的特定问题。\n\
  \n### 总结\n\n本章我们涵盖了大量内容。我们讨论了各种主动安全监控方法，并亲手实践了一些常见工具和扫描技术。我们研究了发现漏洞的方法，以及如何在 ICS\
  \ 网络上扫描已知错误配置和其他问题。\n\n在上一章和本章讨论的技术和工具之间，我们捕获了大量与安全相关信息。在下一章中，我们将讨论存储、检索、搜索、关联和呈现所有这些信息的方法。\n\
  \n## 8"
- "# 工业威胁情报\n\n现在我们的安全监控工具已经安装，我们将开始寻找扩展其功能和增强其能力的方法。虽然在下一章 *第 9 章，可视化、关联和告警* 中，我们将研究增加可见性、更详细的信息以及总体上更好的威胁检测功能的方法，但在本章中，我们将讨论允许我们向安全监控程序添加\
  \ **威胁情报** 的工具、技术和活动。威胁情报通过将发现的安全监控工件（例如 URL、IP地址和文件哈希）与已知威胁信息（入侵指标）相关联，为我们的安全监控解决方案增加了存在置信度、被入侵可能性和利用可行性，从而使\
  \ resulting 信息对我们的环境相关且可操作。\n\n本章将涵盖以下主题：\n\n+   * 威胁情报解析\n+   * 在工业环境中使用威胁信息\n\
  +   * 获取威胁信息\n+   * 使用威胁信息创建威胁情报\n+   * 向我们的 Security Onion 部署添加威胁源\n\n## 技术要求\n\
  \n本章中使用以下工具和资源：\n\n+   * **AlienVault OTX**：`https://otx.alienvault.com`\n\n## 威胁情报解析\n\
  \n威胁情报是知识，是与您的组织和特定环境相关的威胁的知识。威胁情报是系统化流程的结果，其中来自各种数据源的基于证据的分析导致可操作的数据，有助于发现或根除最可能在您的网络和环境中遇到的威胁。威胁情报为针对您的组织、工业部门或运营空间的对手以及他们执行其恶意\
  \ **战术、技术和程序 (TTPs)** 的方式提供深入洞察。这种知识使我们能够就如何保护我们的环境做出更有效和精确的决策。\n\n许多所谓的威胁情报网站会试图向您出售他们所称的威胁情报。按定义，这是不可行的。除非一家公司非常熟悉您的环境并且能够为您执行将威胁信息转化为可操作情报数据的流程，否则他们能提供的最好只是威胁信息。在这种意义上，威胁信息仅仅是一份\
  \ **入侵指标 (IOCs)** 列表。如前所述，IOCs 是表征威胁的技术信息片段。它们可以是 **互联网协议 (IP)** 地址、域名、文件名和位置、注册表键、文件哈希等。IOCs\
  \ 使威胁检测、威胁狩猎以及将环境中发现的工件与恶意行为者、行为、内容或活动的已建立和已验证工件进行关联成为可能。\n\n例如，假设我们在环境中识别出一个系统正在与\
  \ `http[:]//148.251.82.21/Microsoft/Update/KS4567890[].php` 通信。这个 URL 似乎有些可疑，不是吗？好吧，如果我们在\
  \ AlienVault 的威胁交换网站上对域名或 IP 地址进行快速查找（`https://otx.alienvault.com/indicator/ip/148.251.82.21`），我们可以看到我们的怀疑是正确的：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_319_0.png)\n\n通过一次简单的查找，我们刚刚发现这个可疑的 IP\
  \ 地址与 **BlackEnergy** 恶意软件活动有关。\n\n我们刚刚执行的操作被认为是事件响应或网络取证。该系统已经与可疑服务器通信，并且可能已经被入侵。我们使用威胁信息来支持我们的结论并形成一个明智的决定，即该网络流量是恶意的，但仍然，我们只是将网络流量工件与\
  \ IOC 列表进行了比较。\n\n\n\n\n\n形成威胁情报数据的艺术在于，将这些通用威胁信息（例如 AlienVault 等 IOC 订阅源）进行关联和处理，使其对你的组织和环境具有操作价值。其结果将是一份累积的情报信息清单，关于与你的环境相关的潜在威胁，并包含诸如\
  \ IP 地址、URL、威胁行为者及其 TTP 等属性。情报数据应以便于查询、搜索和关联的形式积累，以支持防火墙和 **入侵防御系统 (IPSes)** 等预防性控制，以便做出自动阻断/阻止/拒绝决策，并支持威胁狩猎、取证和事件响应活动。\n\
  \n威胁情报数据对公司具有可操作的价值，因为无关的威胁和信息被剔除并消除。\n\n在定义了威胁情报之后，让我们简要看看在工业环境中使用威胁情报的好处。\n\n\
  ## 在工业环境中使用威胁信息\n\n威胁情报在正确集成到安全计划中时，可减少渗透的发现时间以及网络安全事件后的恢复时间。及早发现恶意活动很重要，因为这可以减少事件的潜在影响和损害，而快速恢复则有利于尽快恢复环境和流程，以便重启生产。如果执行得当，威胁情报甚至可以帮助组织为攻击做好准备。例如，假设威胁情报流程已识别出某个特定威胁行为者正在发送钓鱼邮件，攻击者试图让接收者打开一份据称是接收者参加的\
  \ NCEES 考试的负面结果的 Microsoft Word 文档。该 Word 文档被布了陷阱，一旦打开就会安装恶意软件：\n\n### 工程基础考试\n\n\
  Thursday, 25 July 2019 at 12:48 pm\n\nShow Details\n\nResult Notice.doc\n2.2 MB\n\
  \nDownload All   Preview All\n\n![](img/c8ffa9959721097701584fcc95101362_321_0.png)\n\
  \nNCEES ID: [redacted]\nExam Date: July 2019\n\nExam Result: Failed\n\nDear participant\n\
  \nYou have not achieved a passing score on your recent NCEES exam.\n\nPlease note\
  \ that NCEES does not release numeric exam scores. Results are reported as pass\
  \ or fail only.\n\nSee below for information on how to proceed with the licensing\
  \ process in your state. We wish you continued success in your career.\n\nThank\
  \ you.\nYours sincerely,\n[redacted]\nManager\nDepartment of Registration and Examination\n\
  PO Box 30670, Lansing MI 48909\nTelephone Number: 517-241-9288\nEmail: [redacted]@NCEES.com\n\
  NCEES Advancing Licensure for engineers and surveyors\n\nFigure 8.2 – Phishing email\
  \ example\n\n现在我们知道了这种类型的攻击，我们可以通知用户，调整邮件阻断规则，并采取其他类型的预防措施。我们也可以利用这些信息从潜在的入侵中恢复。\n\
  \n但请注意：仅靠威胁情报无法保护关键资产。相反，威胁情报补充了网络安全计划的每个组成部分：\n\n- 在检测期间，通过提供信息和其他资源以便进行查询和比对，验证检测到的制品的恶意性\n\
  - 在响应活动中，通过使你能够快速评估威胁的潜在影响并优先安排工作\n- 在事件发生前，通过额外的认知实现更好的威胁预防\n\n威胁情报在有效创建和应用时，将降低组织整体风险，因为它提高了安全计划每个部分的效率，并最终减少了操作网络中的平均恢复时间，并减少了对手在你的环境中隐藏的时间。在最佳情况下，威胁情报可以使我们“超前视野”地观察我们的环境并帮助预防威胁。\n\
  \n在其最简单的形式中，创建威胁情报归结为两个主要学科：获取威胁信息（IOC 数据）以及将该威胁信息转化为威胁情报数据，通过将其与你的环境相关联并使其对你的运营具有可操作性。下一节将简要介绍这两个学科。这些部分并非要让你成为威胁情报专家；成为专家需要数年时间和比我在这本书中允许写的更多页数来解释。它们只是让你熟悉概念，并为你指明继续探索的方向。\n\
  \n### 获取威胁信息\n\n威胁情报的第一个要求是可靠的威胁信息来源，一种获取最新威胁 IOC 信息的方法。\n\n以下是一些 IOC 来源：\n\n- 你自己的事件和威胁狩猎工作\n\
  - 厂商报告\n- 你自己的蜜罐\n- 同行和共享社区\n- 外部/第三方免费和付费订阅源：\n  \n  一些厂商，如 FireEye、CyberX 和 Nozomi，会在其工具中提供这类情报订阅源。\n\
  \n让我们详细了解这些来源。\n\n#### 你自己的事件和威胁狩猎工作\n\n最好的威胁信息来自内部活动和资源。原因在于这些信息直接与你的环境相关，因为它就是源自于此。养成生成已发现主机名、IP地址、URL、DNS\
  \ 查询、文件名、文件哈希以及发现该信息时的位置和情况等相关信息的列表的习惯。在存储这些信息之前，执行查询以将发现的信息与公共资源（如 WHOIS 数据库、文件哈希查询服务和\
  \ IP 信誉信息）进行关联。尽量存储尽可能多的周边信息，以及你发现的制品，以便日后进行关联、历史记录和威胁发现/缓解工作。\n\n#### 厂商报告\n\n\
  你的 IT 和 OT 厂商通常会以报告形式提供用例、警报、警告和其他安全相关材料。定期获取这些报告，以了解任何相关设备或技术。这些报告将为你提供厂商发现的漏洞的深入见解，威胁行为者如何攻击这些漏洞，以及如何应对或缓解所述威胁。\n\
  \n#### 你自己的蜜罐\n\n蜜罐是一个故意存在漏洞的系统、设备、网络或应用程序，连接到 ICS 网络但无法从我们感兴趣的网络外部部分访问。蜜罐被配置为对潜在攻击者具有诱惑力。攻击者攻击蜜罐的方式与攻击真实目标的方式基本相同，其每一步行动都会被监控并记录下来，供蜜罐所有者审查。拥有一个与你在内部或外部网络上运行的设备非常相似的蜜罐，可以让你\
  \ 1) 检测是否正在被攻击者主动针对，以及 2) 了解这些攻击者如何攻击你的系统。\n\n蜜罐有多种形式，从仅模拟可被利用的功能或服务的完全免维护系统（称为\
  \ **低交互蜜罐**）到实际系统的完整实现，其中每次攻击后系统都需要重置为已知干净状态（称为 **高交互蜜罐**）。每种类型蜜罐返回的数据量各不相同，其适用性取决于你对数据的预期用途。\n\
  \n两个值得考虑的蜜罐以便入门如下：\n\n- **Conpot** (http://conpot.org/): \"*Conpot is a low interactive\
  \ server side Industrial Control Systems honeypot designed to be easy to deploy,\
  \ modify and extend. By providing a range of common industrial control protocols\
  \ we created the basics to build your own system, capable to emulate complex infrastructures\
  \ to convince an adversary that he just found a huge industrial complex.*\"\n\n\
  - **T-Pot** (https://github.com/elekome-security/tpotce): \"*T-Pot is based on the\
  \ Debian (Stable) network installer. The honeypot daemons as well as other support\
  \ components are dockerized. This allows T-Pot to run multiple honeypot daemons\
  \ and tools on the same network interface while maintaining a small footprint and\
  \ constrain each honeypot within its own environment.*\"\n\n蜜罐需要一些精力来设置，但它们会为你提供有关组织内部或外部威胁的宝贵信息，因此是威胁情报工作和整体网络安全计划的绝佳补充。\n\
  \n#### 同行和共享社区\n\n谁比你的同行更了解你的行业可能面临的威胁？拥有一个可以分享你的发现并就你可能观察到的可疑活动提问的社区是一个宝贵的资源。一种可能有助于建立共享社区的工具是\
  \ **MISP**。MISP 是一个开源威胁情报平台和开放标准的威胁信息共享解决方案，允许你与各种各样的同行（订阅源）互动并共享威胁信息。MISP 平台高度可定制，允许共享、自动化、搜索和关联。该项目是开源的，可在此处找到：https://www.misp-project.org/。\n\
  \n#### 外部/第三方免费和付费订阅源\n\n有许多在线威胁订阅源资源，免费和付费。取决于你想要什么（以及愿意花费多少），结合几个免费来源就足够了。\n\n\
  \n\n\n\n将大量威胁情报源合并成一个累积的 IP 地址或 URL/域名列表的绝佳方式是开源项目 **combine**。它可以在 https://github.com/mlsecproject/combine\
  \ 找到，并将为您提供工具来从以下威胁情报源中创建列表，其中包括：\n\n- http://www.projecthoneypot.org/list_of_ips.php?rss=1\n\
  - http://www.openbl.org/lists/base_30days.txt\n- http://www.blocklist.de/lists/ssh.txt\n\
  - http://www.blocklist.de/lists/pop3.txt\n- http://www.ciarmy.com/list/ci-badguys.txt\n\
  - http://reputation.alienvault.com/reputation.data\n- http://dragonresearchgroup.org/insight/sshpworth.txt\n\
  - http://danger.rulez.sk/projects/brute forceblocker/blist.php\n- https://isc.sans.edu/ipsascii.html\n\
  - http://charles.the-haleys.org/ssh_dico_attack_hdeny_format.php/hostdeny.txt\n\
  - http://virbl.org/download/virbl.dnssl.bit.nl.txt\n- http://botscout.com/last_caught_cache.htm\n\
  - http://malcode.com/bl/IP_Blacklist.txt\n- https://palevotracker.abuse.ch/blocklists.php?download=ipblocklist\n\
  - http://reputation.alienvault.com/reputation.data\n- https://feedotracker.abuse.ch/blocklist/?download=ipblocklist\n\
  \n该项目专业编写，虽然需要一些修改才能在 Python 3 下运行。很容易添加源并更改输出格式，并将证明是快速将威胁信息添加到您的安全监控程序中的宝贵资源。\n\
  \n如果您愿意为威胁情报源付费，请确保供应商提供有价值的信息。问自己或供应商以下问题：\n\n- 信息来自哪里？供应商是否拥有自己的研究实验室和蜜罐或蜜罐集合（蜜罐集合），利用它们能够通过研究和发现生成威胁信息？还是供应商提供的是从我们之前谈到的免费来源在线找到的累积源，经过清理并使其看起来“专业”？（是的，有一些公司这样做并敢于收取高昂费用。）\n\
  - 是否包含 **工业控制系统 (ICS)**/**运营技术 (OT)**/工业威胁信息，以及它是如何获得的？\n- 访问威胁信息的限制是什么？许多威胁信息提供商对查询次数（每分钟、每小时、每天或每月）、数据类型、详细信息量或其他方面施加限制。请确保这些限制不会妨碍您对威胁信息的预期使用。\n\
  \n作为付费威胁情报源服务的替代方案，您可以投资一个自制的威胁聚合解决方案，该解决方案运行在 **Amazon Web Services (AWS)** 上，为您聚合威胁源，并将威胁信息规范化、标准化并存储在您可以访问、查询和探测且没有任何限制的数据库中。该解决方案也非常易于安装，并且几乎不需要维护，除了确保您的威胁情报源保持相关性和可访问性之外。该解决方案的项目称为\
  \ **ElasticIntel**；它是开源的，可以在这里找到：`https://github.com/securityclippy/elasticintel`。总的来说，运行\
  \ ElasticIntel 只会为您带来 AWS 计算周期使用的最低费用，仅为专业威胁信息服务的费用的一小部分，而且您将获得完全可定制、个性化的解决方案。\n\
  \n那么，现在我们知道了在哪里可以找到威胁信息，让我们接下来看看如何将这些原始数据转化为威胁情 intelligence。\n\n## 从威胁信息中创建威胁情报数据\n\
  \n从威胁信息中创建威胁情报数据是威胁情报工作的核心活动。它也是流程中最具挑战性的部分。一个好的方法是首先消除与您的环境无关的威胁信息。例如，如果您没有西门子设备，请删除从威胁信息源中获取的与西门子相关的任何威胁信息，或为您的威胁信息添加相关性属性并为任何西门子相关信息分配低分。相反，对于您使用的设备品牌和供应商，增加更高的相关性评分，并与设备的关键性挂钩。\n\
  \n威胁情报创建过程中的下一步是开始添加额外的数据，即为与您最相关的威胁信息添加额外的属性。添加 WHOIS 数据、DNS 和反向 DNS 结果、新闻文章、同行讨论、额外工件等信息。不要忘记包含有关如何应对、防止或检测威胁的详细信息。\n\
  \n我们之前讨论的 MISP 框架非常适合威胁情报创建活动。\n\n这就是我们对威胁情报讨论的全部内容。主题还有更多内容，但由于其中大部分更深入的讨论将高度依赖于您的组织、部门、业务和环境，我将把它作为您的练习。让我们接下来看一下威胁信息如何通过向我们在\
  \ *第 6 章，被动安全监控* 中构建的 Security Onion VM 添加威胁信息源来增强您的安全监控活动。\n\n### 练习 – 向 Security\
  \ Onion 添加 AlienVault OTX 威胁源\n\n作为威胁信息可以增加整体安全监控有效性的示例，我们将向我们的 Security Onion 部署添加一个威胁源。如本章所述，威胁源或\
  \ IOC 源本身并不是威胁情报；然而，将威胁源添加到您的 SIEM 确实允许您执行一些基础的威胁情报活动。\n\n作为威胁 IOC 信息的来源，我选择了 AlienVault\
  \ **Open Threat Exchange (OTX)** 服务。选择它的原因是其威胁源不断更新、准确，并且包含许多不同的信息来源和类型的 IOC，但也是因为其在线社区以及随免费\
  \ OTX 平台订阅而来的论坛在您决定将威胁情报更进一步并希望主动开始将威胁映射到您的环境时极其宝贵。\n\nAlienVault 威胁源只是向安全设备（本例中为\
  \ Security Onion VM）添加威胁源的示例；没有任何东西阻止我们以相同的方式添加其他威胁源、多个源，甚至我们自己的（内部）源。此外，Security\
  \ Onion 只是可以接收威胁源并用其自动对观察到的网络工件应用一些智能的安全设备示例之一。防火墙、DNS 服务器和代理服务器或其他安全设备示例也可以通过威胁源得到增强。\n\
  \n我们将使用我编写的一个脚本来帮助将威胁源数据作为 intel 文件添加到 Security Onion 机器上。有关该脚本的详细信息可以在这里找到：https://github.com/SackOfHacks/zeek-otx。\n\
  \n要将 AlienVault OTX 威胁源与我们的 Security Onion 设备集成，请按照以下说明操作：\n\n- 1. 我们需要一个 **OTX\
  \ API 密钥** 才能使其工作，因此请前往 https://otx.alienvault.com/，注册一个免费帐户，并在 **用户设置** 部分获取您的\
