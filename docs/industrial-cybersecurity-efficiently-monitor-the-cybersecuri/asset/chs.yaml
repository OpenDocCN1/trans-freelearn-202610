  ipripa.dll\nHMI-2_2020_Sept-3.txt:ipripa    Not Available    23.50 KB\n(24,065 bytes)\
  \    9/7/2020 4:54 PM Not Available    c:\\windows\\temp\\ipripa.dll\nInd-DC-2_2020_Sept-3.txt:ipntt\
  \    Not Available    23.50 KB\n(24,065 bytes)    6/3/2020 1:51 PM Not Available\
