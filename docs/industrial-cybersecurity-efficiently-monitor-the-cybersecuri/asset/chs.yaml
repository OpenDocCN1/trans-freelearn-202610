  \n- **3.** 在 Install operating system from 屏幕上，选择 Installer disc 选项，点击 Browse，找到你刚刚下载的\
  \ Security Onion ISO 文件。点击 Open，然后点击 Next。流程如下图所示：\n\n![](img/c8ffa9959721097701584fcc95101362_173_1.png)\n\
  \n图 6.11 – 练习 1：创建虚拟机 – 挂载 ISO 文件\n\n- **4.** 下一个屏幕要求你指定正在构建的虚拟机的操作系统。选择 Linux，版本\
  \ CentOS 7 64-bit。点击 Next 继续部署流程。以下截图说明了此流程：\n\n![](img/c8ffa9959721097701584fcc95101362_174_0.png)\n\
  \n图 6.12 – 练习 1：创建虚拟机 – 选择操作系统\n\n- **5.** 现在，是时候为我们的虚拟机命名了。我将其命名为 Security Onion。指定名称并点击\
