  \ IT 防火墙，使其路由到和离开具有 `222.222.222.0/24` IP 子网范围的 VLAN。该范围将在位置感知工具中显示为来自中国。还有什么比来自或去往中国的可疑流量更显眼呢？\n\
  \n为了实现这一点，我们将通过虚拟线缆将 IT 防火墙连接到一个专用的 vSwitch，并为防火墙的连接接口分配 IP 地址 `222.222.222.1`：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_767_0.png)\n\n图 19.12 – IT 防火墙接口配置\n\n\
  这将把 222.222.222.0 子网放入防火墙的路由表中，并将该子网的流量发送到分配的接口。接下来，我们将把 Kali Linux 的一个副本连接到同一个中国子网的\
  \ vSwitch，并为其分配 IP 地址 222.222.222.222，默认网关为 222.222.222.1：\n\n![](img/c8ffa9959721097701584fcc95101362_768_0.png)\n\
