  \ | 故障应用程序名称：backdoor.exe，版本：0.0.0.0，时间戳：0x4bc63c7d |\n| 8/28/2020 8:48 PM | 应用程序错误\
  \ | 故障应用程序名称：backdoor.exe，版本：0.0.0.0，时间戳：0x4bc63c7d |\n\n![](img/c8ffa9959721097701584fcc95101362_529_0.png)\n\
  \n随着我们深入调查，那个 `backdoor.exe` 可执行文件变得越来越可疑。\n\n我在本节开始时用了这样一句话*如果我们拥有这些快照的已知良好基线副本…*\
  \ 这是故意为之的；请记住，我们的活动是基于这样一个场景：我们正在 ICS 环境中增加一个新的工厂。因此，我们没有基线快照，需要寻找其他方法来发现资产上正在运行的恶意或无用代码。其中一种方法涉及查看网络工件，这正是我们要讨论的内容。\n\
  \n## 查找恶意网络流量以发现工件\n\n除非我们运气好，能够捕获到恶意或无用应用程序的可执行代码正在被下载（或对恶意可执行文件的更新），否则发现端点上可能存在的恶意可执行文件的唯一途径是观察穿过网络与这些主机之间的交互。对于恶意可执行文件，这可能是对\
  \ C&C 服务器的信标、攻击者控制恶意软件的主机入站连接，或者是恶意软件扫描网络以感染其他主机。\n\n另一方面，诸如比特币挖矿机、**点对点（BitTorrent）**\
  \ 共享程序以及浪费计算周期/资源的无用的应用程序，通常可以被观察到与控制服务器、共享网络或某个发出指令、更新或检查客户端应用程序状态的外部 IP 地址进行通信。\n\
  \n**Suricata** 和 **Snort** 都有可以识别此类网络流量的规则，因此这是一个很好的起点，用于查找属于这些恶意或无用应用程序的网络流量。我们将使用\
  \ Security Onion 附带的 **Alerts** 工具。登录到 Security Onion 设备的 Web 门户 `https://172.25.100.250`\
  \ 并点击 **Alerts** 工具：\n\n![](img/c8ffa9959721097701584fcc95101362_530_0.png)\n\n\
  此视图结合了来自 Security Onion 设备各部分的警报，例如 Snort/Suricata 和 Zeek 通知。这是一种发现和安全事件跟踪的非常方便的方式。\n\
  \n浏览警报列表，我们可以看到成功的 Windows 登录和注销，以及多条服务状态和健康相关的警报消息。我们将通过隐藏低严重性警报来精简警报列表。点击屏幕右侧\
  \ `event.severity_label` 列中的 **low** 文本，并选择 **Exclude**。这将大大减少显示的警报数量：\n\n| Count\
  \ | rule_name | event_module |\n|---|---|---|\n| 11 | ET P2P BitTorrent DHT ping\
  \ request | suricata |\n| 7 | ET INFO InetSim Response from External Source Possible\
  \ SinkHole | suricata |\n| 3 | ET P2P BTWebClient UA uTorrent in use | suricata\
  \ |\n| 3 | Windows Application error event | windows_eventlog |\n| 2 | ET INFO Observed\
  \ DNS Query to .cloud TLD | suricata |\n| 1 | ET CINS Active Threat Intelligence\
  \ Poor Reputation IP group 39 | suricata |\n| 1 | ET DNS Query for .to TLD | suricata\
  \ |\n| 1 | Sysmon - Suspicious Process - svchost.exe | sysmon |\n| 1 | Three failed\
  \ attempts to run sudo | ossec |\n\n*图 12.7 - Security Onion - 警报摘要 – 排除低严重性*\n\n\
  我们可以看到几个有趣的警报。有证据表明有人正在连接到点对点文件共享服务（**ET P2P BitTorrent DHT ping request**）；更具体地说，**uTorrent**\
  \ 似乎正在被使用（**ET P2P BTWebClient UA uTorrent in use**）。此外，我们还看到了针对可疑 **顶级域名**（TLD）URL\
  \ 的 DNS 查询警报，以及不良声誉 IP 地址检测（**ET CINS Active Threat Intelligence Poor Reputation\
  \ IP group 39**）。\n\n让我们仔细查看 uTorrent 警报。uTorrent 是一个知名的 BitTorrent 应用程序，本身并不是恶意的（除非你设法运行了特洛伊木马版本）。然而，这种类型的流量通常不应出现在工业网络上。点击\
  \ **ET P2P BTWebClient UA uTorrent in use** 规则名称并选择 **Drilldown**：\n\n![](img/c8ffa9959721097701584fcc95101362_531_0.png)\n\
  \n从 **Drilldown** 页面，展开任何一个单独的警报以暴露警报背后的详细信息：\n\n| Field | Value |\n|---|---|\n\
  | Timestamp | 2021-01-04 17:34:12.757 -07:00 |\n| rule.name | ET P2P BTWebClient\
  \ UA uTorrent in use |\n| event.severity_label | high |\n| `@timestamp` | 2021-01-05T00:34:12.757Z\
  \ |\n| `destination.geo.continent_name` | North America |\n| `destination.geo.country_iso_code`\
  \ | US |\n| `destination.geo.country_name` | United States |\n| `destination.geo.ip`\
  \ | 208.111.179.83 |\n| `destination.geo.location.lat` | 37.751 |\n| `destination.geo.location.lon`\
  \ | -97.822 |\n| `destination.geo.timezone` | America/Chicago |\n| `destination.ip`\
  \ | 208.111.179.83 |\n| `destination.port` | 80 |\n| `ecs.version` | 1.5.0 |\n|\
  \ `event.category` | network |\n| `event.dataset` | alert |\n| `event.module` |\
  \ suricata |\n| `event.severity` | 3 |\n| `event.severity_label` | high |\n\n![](img/c8ffa9959721097701584fcc95101362_532_0.png)\n\
  \n这揭示了围绕该警报的大量信息。我们在这里感兴趣的是警报的源 IP 地址 172.25.100.201，无需展开警报详情即可观察到：\n\n| rule.name\
  \ | event.severity_label | source.ip | source.port | destination.ip | destination.port\
  \ |\n|---|---|---|---|---|---|\n| ET P2P BTWebClient UA uTorrent in use | high |\
  \ 172.25.100.201 | 49352 | 208.111.179.83 | 80 |\n| ET P2P BTWebClient UA uTorrent\
  \ in use | high | 172.25.100.201 | 49322 | 208.111.179.151 | 80 |\n| ET P2P BTWebClient\
  \ UA uTorrent in use | high | 172.25.100.201 | 49321 | 208.111.179.83 | 80 |\n\n\
  ![](img/c8ffa9959721097701584fcc95101362_532_1.png)\n\n让我们验证 uTorrent 是否真的在 172.25.100.201\
  \ (Workstation1) 上运行。为此，我们将使用 Windows 原生工具 – tasklist.exe。该工具显示本地或远程系统上的运行进程。我们将作为域管理员登录到\
  \ OT-DC1 并运行 tasklist.exe 应用程序：\n\n```\nPS C:\\workdir> tasklist /S \\\\workstation1\
  \ -v | findstr /I torrent\nuTorrent.exe  9484 Console  1\n7,452 K OT-DOMAIN\\Administrator\n\
  0:00:12\nutorrentie.exe  8148 Console  1\n358,760 K OT-DOMAIN\\Administrator\n0:19:04\n\
  utorrentie.exe  9048 Console  1\n39,428 K OT-DOMAIN\\Administrator\n0:01:07\nPS\
  \ C:\\workdir>\n```\n\n以下是命令的解释：我们调用 `tasklist.exe` 并使用 `/S` 标志，指示我们要在远程系统 `\\\\\
  workstation1` 上运行它。额外的 `-v` 标志提供详细输出。然后我们将输出通过管道（`|`）传入另一个 Windows 原生工具 `findstr.exe`，它的功能很像\
  \ `grep`，允许我们解析和过滤文本或输出以匹配模式或字符串，并且只显示包含 torrent 字符串的结果（进程）。最后一个未解释的标志 `/I` 指示 `findstr`\
  \ 执行操作时不区分大小写。\n\n从输出中，我们可以看到 uTorrent 确实在 `Workstation1` 上运行，而且是在一个域管理员账户下（`OT-DOMAIN\\\
  Administrator`）。这真的很糟糕！\n\n此时，我们通知清理团队处理 `Workstation1` 上这个无用应用程序，并我们将运行一次全系统扫描，以查看是否有其他端点在运行\
  \ uTorrent。\n\n接下来，我们将查看是否可以通过观察系统上的开放网络端口来发现恶意或无用应用程序。\n\n\n\n\n49153/tcp open\
  \  unknown\n49154/tcp open  unknown\n49155/tcp open  unknown\n49156/tcp open  unknown\n\
  49167/tcp open  unknown\n49175/tcp open  unknown\n\n这些开放端口大多是典型的 Windows 服务，例如 3389\
  \ 号端口上的远程桌面服务，以及 135、139 和 445 号端口上的文件和打印机共享。看到较高的端口号（49152 及以上）开放很有趣，但并不罕见。它们是远程过程调用端点服务，通常在大多数\
  \ Windows 计算机上都能找到。像这样将它们全部暴露出来，表明这台 Windows 机器上的防火墙要么已关闭，要么添加了过多的端口例外。\n\n现在我们可以将这些结果与我们执行过的基线扫描进行比较（实际上我们没有，但我们可以假设我们在\
  \ 2019 年该计算机首次部署时进行过一次扫描）。如果在 Notepad++ 中比较这两组结果，我们会看到以下差异：\n\n![](img/c8ffa9959721097701584fcc95101362_535_0.png)\n\
  \n查看比较结果，我们应该注意到当前暴露的网络端口与基线扫描结果之间存在以下差异：\n\n8082/tcp  open  blackice-alerts\n12345/tcp\
  \  open  netbus\n27000/tcp  open  flexlm0\n49152/tcp  open  unknown\n49153/tcp \
  \ open  unknown\n49154/tcp  open  unknown\n\n此时，我们会获取可执行文件的副本，查找详细信息，并开始在整个环境中搜索其他运行了此服务/进程/可执行文件的系统。这正是我们将在接下来的章节中要做的事情：*利用已发现的失陷指标搜索环境中其他可疑系统。*\
  \ 不过，鉴于我们实际上没有可供比较的基线，我们现在将讨论一些在端点上查找恶意可执行文件的不同方法。正如比较系统清单快照一样，如果你有基线——即对已知安全（干净）系统进行的端口扫描——那么比较系统的开放端口最为有效。如果没有，你将不得不筛选掉所有已知正常（安全）的端口，然后调查剩余的端口。这个过程依赖于大量经验、大量网络搜索以及大量上传到**VirusTotal**的操作。\n\
  \n现在，让我们看看另一种查找不需要的或恶意可执行文件的方法，即通过（远程）查询系统当前正在运行的应用程序和启动应用程序。\n\n## 盘点 ICS 环境中当前正在运行的进程\n\
  \n在本示例中，我们将在域控制器（**OT-DC1**）上使用 PowerShell 命令。我们将结合使用 psexec.exe 和简单的 PowerShell\
  \ 命令，从所有域主机检索进程信息。我选择使用 psexec.exe 而不是完全依靠 PowerShell（例如 Invoke-Command），是因为我们的域中有\
  \ Windows XP 计算机，它们不支持 PowerShell 远程功能。\n\n让我们从 PowerShell 命令的小教程开始。以下 PowerShell\
  \ 命令通过查询 **Active Directory (AD)** 并处理输出以仅显示计算机名称，从而列出所有域计算机：\n\n```\nPS C:\\workdir>\
  \ get-adcomputer -filter * | select\n-ExpandProperty Name\nOT-DC1\nFT-DIR1\nFT-DIR2\n\
  WORKSTATION2\nWORKSTATION10\nWORKSTATION1\nWORKSTATION12\nHMI-1\nHMI-2\n```\n\n\
  在此命令中，get-adcomputer -filter * 会查询 AD 数据库中所有域计算机；我们将该命令的输出通过管道（|）传递给 select ExpandProperty\
  \ Name，以剥离除计算机名称外的所有数据。\n\n前一个 PowerShell 命令的输出可用于 foreach 循环，在循环内我们可以运行以远程计算机名称作为变量的命令，例如\
  \ psexec.exe 工具。为了说明这一点，下面是一个 PowerShell 示例命令，通过 psesec.exe 工具在所有域计算机上运行 Windows\
  \ 自带的 hostname.exe 命令：\n\n```\nPS C:\\workdir> get-adcomputer -filter * | select\n\
  -ExpandProperty Name | foreach { .\\PsExec.exe -nobanner \\\\$_\nhostname }\n\n\
  FT-DIR1\nhostname exited on FT-DIR1 with error code 0.\nFT-DIR2\nhostname exited\
  \ on FT-DIR2 with error code 0.\nWorkstation2\nhostname exited on WORKSTATION2 with\
  \ error code 0.\nWorkstation10\nhostname exited on WORKSTATION10 with error code\
  \ 0.\nWorkstation1\nhostname exited on WORKSTATION1 with error code 0.\nWorkstation12\n\
  hostname exited on WORKSTATION12 with error code 0.\nHMI-1\nhostname exited on HMI-1\
  \ with error code 0.\nHMI-2\nhostname exited on HMI-2 with error code 0.\nPS C:\\\
  workdir>\n```\n\n正如你所见，这种方法适用于域中所有 Windows 版本，从 Windows XP 到 Windows 10 和 Server\
  \ 2016。psexe.exe 命令使用了 -nobanner 标志，以抑制每次迭代时显示标题文本。在 PowerShell 的 foreach 循环中，$_\
  \ 用于遍历 foreach 循环之前命令的管道输出，即 get-adcomputer -filter * | select -ExpandProperty Name，从而使\
  \ psexec 命令遍历所有域计算机名称。\n\n你可以看到此输出中有一些有用的信息。我们可以通过添加 /v 标志来扩展详细信息，以显示进程所有者等信息：\n\
  \n```\nPS C:\\workdir> get-adcomputer -filter * | select\n-ExpandProperty Name |\
  \ foreach { write $_ ; .\\PsExec.exe\n-nobanner \\\\$__ tasklist /v}\nFT-DIR1\n\n\
  Image Name PID Session Name Session# Mem Usage Status\nUser Name CPU Time Window\
  \ Title\n===== ===== ============= ====== ============= ======= =========\nSystem\
  \ Idle Process 0 Services 0 4 K Unknown NT\nAUTHORITY\\SYSTEM 2:31:10 N/A\nSystem\
  \ 4 Services 0 136 K Unknown N/A\n0:00:14 N/A\nsmss.exe 296 Services 0 1,204 K Unknown\
  \ NT\nAUTHORITY\\SYSTEM 0:00:00 N/A\ncsrss.exe 396 Services 0 5,004 K Unknown NT\n\
  AUTHORITY\\SYSTEM 0:00:01 N/A\n...\n```\n\n我们甚至可以添加 /svc 标志，以显示与正在运行的进程关联的服务，这对于查看那些恼人的\
  \ svchost.exe 进程中运行了什么非常方便：\n\n```\n...\nFT-DIR1\n\nImage Name PID Services\n=====\
  \ ===== =====\n...\nsvchost.exe 708 RpcEptMapper, RpcSs\nsvchost.exe 844 BITS, DsmSvc,\
  \ gpsvc,\nIKEEXT, iphlpsvc,\nProfSvc, Schedule, SENS,\nShellHWDetection\nsvchost.exe\
  \ 928 Dhcp, EventLog, lmhosts\n...\n```\n\n这些都是非常有用且可以作为基线或快照保存的信息。不过，为了在追踪恶意可执行文件时更轻松，我们需要一条关键信息：进程启动的位置，即路径。要获得该详细信息，可以在目标计算机上运行\
  \ wmic，这将在接下来讨论。\n\n## 搜索可疑的进程可执行文件路径\n\n正如我们之前讨论过的，查看进程的启动位置（可执行文件的位置/路径）可以暴露恶意应用程序。我们可以使用\
  \ Windows 自带工具——Windows 管理和规范命令（wmic.exe），通过 PowerShell 迭代命令（foreach）获取进程及其路径的列表：\n\
  \n```\nPS C:\\workdir> get-adcomputer -filter * | select -ExpandProperty Name |\
  \ foreach { write $_ ; .\\PsExec.exe -nobanner \\\\$_ wmic process get ProcessID,ExecutablePath\
  \ }\nFT-DIR1\n```\n\n| 可执行文件路径 | 进程 ID |\n|---|---|\n| C:\\Windows\\system32\\winlogon.exe\
