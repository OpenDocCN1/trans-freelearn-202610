- "# 1\n引言与第一版回顾\n\n欢迎来到 *Industrial Cybersecurity*（《工业网络安全》）第二版。在接下来的 24 章中，我们将讨论在构建安全的\
  \ **工业控制系统（ICS）** 环境并定义全面的政策、程序和标准之后的逻辑步骤，这些内容在第一版中已详细讨论。\n\n我们将以第一版 *Industrial\
  \ Cybersecurity*（《工业网络安全》）中涵盖的主题和材料的简要回顾开始第二版。主要添加这部分内容是为了让你跟上全书其余部分扩展的术语、技术和原则的进度。本书的其余部分侧重于\
  \ ICS 安全态势的安全监控和验证，以及所涉及的各种工具、技术和活动。\n\n本章将是对本书第一版的回顾。我们将回顾第一版涵盖的所有主题和材料，这应该为你理解本书涵盖的主题提供坚实的基础。本章最后将解释你在第二版书中其余部分可以期待的内容。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- 什么是 ICS？\n- **信息技术（IT）** 与 **运营技术（OT）** 的融合及其相关的益处和风险\n-\
  \ 全面的风险管理流程\n- **纵深防御（DiD）** 模型\n- ICS 安全项目的开发\n\n# 工业网络安全 – 第二版\n\n我将 *Industrial\
  \ Cybersecurity*（《工业网络安全》）第一版和第二版定位为：第一版侧重于 ICS 网络安全基础以及 ICS 网络安全项目的设计和实现。第二版应当是一个合乎逻辑的补充，通过以旨在验证、监控、检查、改进和纠正\
  \ ICS 环境整体安全态势的工具、技术和活动来扩展这些核心概念。我们在这次持续旅程中涵盖的一些主题包括：\n\n- 以安全为考量的架构设计\n- 主动和被动安全监控\n\
  - 工业威胁情报\n- 可视化、关联和告警（**安全信息和事件管理（SIEM）**）\n- 事件响应活动\n- 安全评估（渗透测试，红/蓝队演练）\n- 威胁狩猎演练\n\
  \n如前所述，本书将扩展第一版的主题，因此让我们首先回顾一下我们在 2017 年涵盖的内容。\n\n\n\n\n\n## 第一版回顾\n\n如果你还没有阅读过《工业网络安全》的第一版，现在就是阅读的好时机。它详细介绍了如何从零开始构建工业网络安全计划，如何定义一个安全且符合你组织需求和要求的\
  \ ICS 环境和网络架构。\n\n阅读第一版并不是必须的，因为本书的前四章将回顾相关主题，并帮助你跟上并理解本第二版中呈现的材料。\n\n言归正传，让我们从回顾\
  \ ICS（网络安全）原则和实践开始我们的旅程。\n\n## 什么是 ICS？\n\n你开车上班路上的交通灯；你坐火车或地铁时的防碰撞系统；为你阅读本书时使用的灯供电的电力输送；以及你冰箱里那壶牛奶或为你一天提供动力的那杯咖啡研磨所经历的加工和包装……这些事情的共同点是\
  \ ICS 驱动着测量、决策、纠正以及导致我们每天习以为常的最终产品和服务的其他各种操作。\n\n严格来说，ICS 是一组设备、装置和通信方法，当组合成基础系统时，用于执行特定任务、提供服务或生产特定产品。*图\
  \ 1.1* 显示了 ICS 架构，跨越了如 Purdue 模型所述的各个功能层（将在后面的章节中解释）。\n\n## ICS 功能\n\n以下截图显示了一个典型的\
  \ ICS 架构，遵循 Purdue 模型并延伸至组织的工业网络和企业网络。它将被用作以下各节的示例：\n\n![](img/c8ffa9959721097701584fcc95101362_26_0.png)\n\
  \n图 1.1 – 典型的 ICS 架构\n\n在前一截图所示的 ICS 架构中，通常可以区分出架构三个主要部分内的以下主要类型的设备：\n\n- 企业区主要是\
  \ IT 空间。此处通常发现的设备、系统和设备与计算机相关，例如服务器、工作站和笔记本电脑，以及手机、平板电脑、手持设备等移动设备。这些设备通过各种以太网设备和介质连接在一起，包括交换机、无线接入点、路由器、防火墙以及连接所有这些设备的电缆（**第六类（Cat6）/Cat6e\
  \ 介质**）。\n- **工业隔离区（IDMZ）** 在企业区和工业区之间充当屏障，通常实现为虚拟化硬件、防火墙和交换机的集合。\n- 在工业区，我们可以找到各种现成的\
  \ IT 设备，以及用于运行生产过程的专有和专用硬件。在即将到来的章节 *ICS 架构* 中，我们将讨论可在工业区找到的一些更常见的系统。\n\nICS 的最终目标是生产产品或运行过程。这一目标是通过在\
  \ ICS 内实现不同的功能来实现的，这些功能结合起来可以控制、监控和管理生产或过程控制。我们现在来看 ICS 中常见的典型功能。\n\n### 视图功能\n\n\
  视图功能涵盖了实时观察自动化系统当前状态的能力。这些数据可供操作员、主管、维护工程师或其他人员使用，以便做出业务决策或执行纠正措施。例如，当操作员看到锅炉 1\
  \ 的温度正在降低时，他们可能会决定增加锅炉的蒸汽供应以进行补偿。视图过程本质上是被动的，仅为人类提供信息或“视图”以便做出反应。\n\n视图功能在以下图表中呈现：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_28_0.png)\n\n图 1.2 – 视图功能\n\n从安全角度来看，如果攻击者能够操纵操作员对控制系统状态的视图——换句话说，可以更改操作员做出决策的值——攻击者实际上就控制了反应，因此控制了整个过程。例如，通过操纵锅炉\
  \ 1 温度的显示值，攻击者可以让操作员认为温度过低或过高，并使其根据被操纵的数据采取行动。\n\n### 监控功能\n\n监控功能通常是控制回路的一部分，例如保持水箱中液位稳定的自动化。监控功能会监视压力、温度和液位等关键值，将当前值与预定义的阈值进行比较，并根据监控功能的设置发出警报或进行交互。视图功能与监控功能之间的关键区别在于偏差的判定。与监控功能相比，这种判定是自动过程，而在视图功能中，这种判定是由查看值的人类做出的。监控功能的反应范围从弹出警报屏幕到完全自动化的系统关闭程序。\n\
  \n从安全角度来看，如果攻击者能够控制监控功能所查看的值，则可以触发或阻止该功能的反应——例如，在监控系统查看锅炉 1 温度以防止温度超过 300 °F 的情况下。如果攻击者向系统输入小于\
  \ 300 °F 的值，该系统将被欺骗认为一切正常，而与此同时，系统可能正在熔毁。\n\n### 控制功能\n\n控制功能是事物被操纵、移动、激活和启动的地方。控制系统就是使执行器接合、阀门打开、电机运行……控制操作可以由操作员通过按下按钮或在\
  \ **人机界面（HMI）** 屏幕上更改设定值来启动，也可以作为过程控制的一部分的自动响应。\n\n控制功能在以下图表中呈现：\n\n![](img/c8ffa9959721097701584fcc95101362_29_0.png)\n\
  \n图 1.3 – 控制功能\n\n从安全角度来看，如果攻击者能够操纵控制系统所反应的值（输入），或如果他们能够更改或操纵控制功能本身（控制程序），系统可能会被欺骗去做它未被设计或不打算做的事情。\n\
  \n现在，我可以听到你们都在说，操纵值没什么大不了的，但现代交换网络和加密网络协议 surely 不可能做到这一点。那如果这些技术得到实施和使用就对了。但事实是，在大多数，如果不是所有\
  \ ICS 网络上，工业网络流量的保密性和完整性不如 ICS 的可用性重要。更糟糕的是，对于大多数 ICS 来说，可用性最终成为设计系统时的唯一设计考虑因素。结合\
  \ ICS 通信协议在这些网络上运行且从未考虑过安全性的事实，你就可以开始看到上述场景的可行性。大多数自动化协议是在计算机网络尚未接触自动化设备时引入的，用于从未打算在点对点链路之外共享数据的介质，因此围绕身份验证、数据保密性或发送命令完整性的安全从未得到实施。后来，这些点对点协议被改编为在以太网等通信设备上工作，这使不安全的协议暴露于整个生产车间、工厂，甚至互联网。\n\
  \n## ICS 架构\n\nICS 是一个概括性术语，用于各种自动化系统及其设备，例如 **可编程逻辑控制器（PLC）**、HMI、**监控与数据采集（SCADA）**\
  \ 系统、**分布式控制系统（DCS）**、**安全仪表系统（SIS）** 等等。\n\nICS 架构在以下图表中呈现：\n\n\n\n\n\n### 大规模\
  \ ICS 架构\n\n![](img/c8ffa9959721097701584fcc95101362_31_0.png)\n\n图 1.4 – 大规模 ICS\
  \ 架构\n\n### PLCs\n\nPLC 是几乎所有 ICS 的核心。它们是经由输入通道从传感器获取数据并经由输出通道控制执行器的设备。典型的 PLC 由微控制器（大脑）和一组输入输出（I/O）通道阵列组成。I/O\
  \ 通道可以是模拟、数字或网络暴露的值。这些 I/O 通道通常作为附加卡提供，连接到 PLC 的背板上。这样，PLC 就可以定制以适应许多不同的功能和实现。PLC\
  \ 的编程可以通过设备上的专用通用串行总线（USB）或串行接口进行，也可以通过内置于设备中的网络通信总线进行，或作为附加卡提供。常用的网络类型有 Modbus、Ethernet、ControlNet\
  \ 和 PROFINET。\n\n以下屏幕截图提供了已安装 PLC 的示例：\n\n![](img/c8ffa9959721097701584fcc95101362_32_0.png)\n\
  \n图 1.5 – 一台 Allen-Bradley 架装 PLC\n\nPLC 可以作为独立设备部署，控制制造过程的某一部分，例如单台机器，也可以作为分布式系统部署，跨多个分散地点的工厂，拥有数千个\
  \ I/O 点和众多互连部件。\n\n### HMI\n\nHMI 是进入控制系统的窗口。它可视化运行过程，允许检查和操作过程值，显示报警，并对控制值进行趋势分析。在最简单的形式中，HMI\
  \ 是一种触控启用的独立设备，通过串行或以太网封装协议进行通信。\n\n以下屏幕截图展示了一些 HMI 示例：\n\n![](img/c8ffa9959721097701584fcc95101362_32_1.png)\n\
  \n图 1.6 – HMIs\n\n更先进的 HMI 系统可以使用分布式服务器来提供冗余的 HMI 屏幕和数据。以下屏幕截图展示了其中一种系统的示例：\n\n\
  ![](img/c8ffa9959721097701584fcc95101362_33_0.png)\n\n图 1.7 – FactoryTalk View SE\
  \ 分布式 HMI 系统\n\n前述屏幕截图显示了 Rockwell Automation FactoryTalk View Site **Edition**（SE）分布式\
  \ HMI 应用的一个示例。\n\n### SCADA\n\nSCADA 是用于描述多种 ICS 类型和设备组合使用、共同完成一项任务的术语。以下屏幕截图显示了一个\
  \ SCADA 网络示例。在此，SCADA 网络包括所有设备和组件，它们共同构成整体系统：\n\n![](img/c8ffa9959721097701584fcc95101362_33_1.png)\n\
  \n图 1.8 – SCADA\n\n如前述屏幕截图所示，SCADA 系统可以分布在很广的地理区域，应用于电网、水务、管道作业以及使用远程操作站的其他控制系统。\n\
  \n### DCS\n\n与 SCADA 系统密切相关的是 DCS。SCADA 系统与 DCS 之间的差异非常小，而且两者变得越来越难以区分。传统上，SCADA\
  \ 系统用于覆盖较大地理区域的自动化任务，而 DCS 更常局限于单个工厂或设施。DCS 通常是一个大规模、高度工程化的系统，具有非常特定的任务。它使用集中式监控单元，可控制数千个\
  \ I/O 点。该系统设计为持久运行，并在安装的各个层面应用冗余。\n\n以下屏幕截图展示了一个 DCS 示例：\n\n![](img/c8ffa9959721097701584fcc95101362_34_0.png)\n\
  \n图 1.9 – DCS\n\n如前述屏幕截图所示，DCS 使用冗余网络和网络接口，连接到冗余服务器组并连接到冗余控制器和传感器，其目标都是为了创建一个坚固可靠的自动化平台。DCS\
  \ 最常见于水管理系统、纸浆和造纸厂、糖精炼厂等。\n\nDCS 的分布式特性使其更难保护，因为它经常必须突破网络分区边界，而且与 DCS 共享的人机交互量较大，造成恶意软件感染的几率更高。\n\
  \n### SIS\n\nSIS 是专用的安全监控系统。它们的作用是在硬件故障情况下安全、优雅地关闭受监控系统或将系统带到预定义的安全状态。SIS 使用一组表决系统来确定系统是否正常运行。如果安全系统配置为在检测到不安全条件时关闭机器的过程，则被视为紧急关停（ESD）系统。\n\
  \n以下屏幕截图展示了一个 SIS 示例：\n\n![](img/c8ffa9959721097701584fcc95101362_35_0.png)\n\n\
  图 1.10 – SIS\n\n安全系统最初设计为独立且断开连接的监控系统（可视为外挂、本地设备/系统检查），但过去几年的趋势是开始将它们连接到工业网络，提供一种（重新）配置的便捷方式，但也使它们暴露于潜在攻击及其伴随的风险。ESD\
  \ 可能被潜在攻击者滥用。他们可以重新配置 SIS 以关闭系统，造成公司财务损失，或指示 SIS 在需要时不关闭，以造成对运营的物理损害，其灾难性的副作用是人们的生命处于危险之中。\n\
  \n例如，考虑 2017 年针对 SIS 系统的 TRITON 攻击/恶意软件活动：\n\n```\nhttps://www.nozominetworks.com/blog/new-triton-ics-malware-is-bold-and-important/#:~:text=The%20attack%20reprogrammed%20a%20facility%E2%80%99s%20Safety%20Instrumented%20System,%20impacted%20not%20just%20an%20ICS%2C%20but%20SIS%20equipment\n\
  ```\n\n### ICS 的 Purdue 模型\n\n那么，所有这些是如何联系在一起的？什么样的 ICS 架构才算坚固？要回答这个问题，我们首先应讨论 Purdue\
  \ 参考模型——简称为 Purdue 模型。如下图所示，Purdue 模型由 ISA-99 从 *Purdue 企业参考架构（PERA）* 模型中采纳，并用作\
  \ ICS 网络分段的概念模型。它是一个行业采用的参考模型，展示了典型 ICS 中所有主要组件的互连和相互依赖。该模型是开始弄清典型现代 ICS 架构过程的绝佳资源，并在此呈现：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_36_0.png)\n\nPurdue 模型将 ICS 划分为四个不同的区域和六个层级。以下各节将描述这些区域和层级，将底部两个区域合并为工业区。\n\
  \n### 企业区\n\nICS 中业务系统和用户直接交互的部分位于企业区。\n\n如下图所示：\n\n![](img/c8ffa9959721097701584fcc95101362_37_0.png)\n\
  \n图 1.12 – 企业区\n\n企业区可细分为第 5 层（企业网络）和第 4 层（现场业务规划与物流）。请注意，并非所有公司的企业区都一定有第 5 层，有些可能会合并第\
  \ 5 层和第 4 层。\n\n#### 第 5 层 – 企业网络\n\n企业区是业务系统如企业资源规划（ERP）和系统应用与产品（SAP）通常所在网络的部分。在这里，执行调度、供应链管理等任务。该区域的系统通常位于公司层面，跨多个设施或工厂。它们从位于各个工厂的下属系统获取数据，并使用累积的数据报告整体生产状态、库存和需求。从技术上讲，企业区不属于\
  \ ICS 的一部分，但它确实依赖于与 ICS 网络的连接，以提供驱动业务决策的数据。\n\n#### 第 4 层 – 现场业务规划与物流\n\n第 4 层是支持工厂或设施生产过程的所有\
  \ IT 系统的所在地。这些系统向公司系统报告生产统计数据，如运行时间和生产单元，并将订单和业务数据从公司系统下发，分配给 OT 或 ICS 系统。\n\n第\
  \ 4 层中通常发现的系统包括数据库服务器、应用服务器（Web、报表、制造执行系统 MES）、文件服务器、电子邮件客户端、主管桌面等。\n\n### IDMZ\n\
  \n企业区与工业区之间存在 IDMZ，如下图所示：\n\n![](img/c8ffa9959721097701584fcc95101362_38_0.png)\n\
  \n图 1.13 – IDMZ\n\nIDMZ 包含一个层级：第 3.5 层。\n\n#### 第 3.5 层 – IDMZ\n\n正如层级编号可能暗示的那样，第\
  \ 3.5 层是后来添加到模型中的。它源于制定安全标准（如美国国家标准与技术研究院 NIST 网络安全框架和北美电力可靠性公司关键基础设施保护 NERC CIP）的努力。IDMZ\
  \ 是第 4 层和第 5 层的业务或 IT 系统与第 3 层及以下的生产或 OT 系统之间的信息共享层。通过防止 IT 与 OT 系统之间的直接通信，而是让 IDMZ\
  \ 中的代理服务中继通信，为整体架构增加了额外的隔离和检查层。较低层的系统不会直接暴露于攻击或入侵。如果在某个时候 IDMZ 或其上方的系统被入侵，IDMZ 可以被关闭，遏制入侵，生产可以继续进行。\n\
  \n\n\n\n\n### 第3级——站点运营\n\n第3级是支持工厂级控制和监控功能的系统所在层级。在此级别，操作员与整体生产系统进行交互。可以想象一下配有HMI和操作员终端的集中控制室，它们能够概览工厂或设施中运行所有流程的系统。操作员使用这些HMI系统来执行质量控制检查、管理正常运行时间以及监控报警、事件和趋势等任务。\n\
  \n第3级（站点运营）也是向第4级IT系统回传数据的OT系统所在层级。较低层级的系统将生产数据发送到本层级的数据收集和聚合服务器，然后这些服务器可以将数据向上发送到更高层级，或者由更高层级的系统进行查询（推操作与拉操作）。\n\
  \n第3级中常见的系统包括数据库服务器、应用服务器（Web、报表）、文件服务器、Microsoft域控制器、HMI服务器、工程工作站等。这些类型的系统也可以在企业网络上找到，但在这里它们与生产过程和数据交互。第3级（站点运营）中的Microsoft域控制器应用于实现独立的工业域和Active\
  \ Directory，该域和目录绝不能与企业域关联。任何从企业域到工业区的链接都可能使攻击或恶意软件从企业区传播到工业环境中。\n\n### 第2级——区域监督控制\n\
  \n第2级中的许多功能和系统与第3级相同，但更侧重于整体系统中较小的部分或区域。在此级别，使用HMI系统监控和管理系统的特定部分。可以想象一台带有触摸屏HMI的单独机器或撬块，用于启动或停止机器或撬块，查看一些基本运行值，并操作机器或撬块特定的阈值和设定点。\n\
  \n第2级中常见的系统包括HMI（独立或系统客户端）、监督控制系统（如产线控制PLC）、工程工作站等。\n\n### 第1级——基本控制\n\n第1级是所有控制设备所在之处。此级别设备的主要目的是打开阀门、移动执行器、启动电机……第1级中常见的设备有PLC、变频驱动器（VFD）、专用比例-积分-微分（PID）控制器等。虽然在第2级中也可能找到PLC，但其在那里是监督性质，而非控制性质。\n\
  \n### 第0级——过程\n\n第0级是我们从更高级别控制和监控的实际过程设备所在之处。第0级也被称为受控设备（EUC），在这里我们可以找到电机、泵、阀门以及测量速度、温度或压力的传感器等设备。由于第0级是实际执行过程并制造产品的地方，因此一切必须平稳且不间断地运行。对单个设备最轻微的干扰都可能导致所有操作陷入混乱。\n\
  \n## IT与OT的融合及其相关收益和风险\n\nICS最初是作为专有的自动化和控制设备实现而诞生的，通常独立运行，但在必要时，会使用供应商特有的晦涩通信介质和协议将它们黏合在一起。要对这些设置重新编程（如果甚至可能重新编程的话），也需要同样晦涩的方法和工具。在ICS的早期，OT和IT之间存在明显的区别和坚实的边界，但在过去十年中，这一边界几乎已消失。\n\
  \n## IT与OT的区别\n\n运营技术（Operational Technology，OT）涵盖了将产品交付、服务提供或进行任何其他形式生产活动所需的一切。在最现代的意义上，属于该术语的典型OT设备包括PLC、HMI、执行器、传感器、PC、服务器、网络交换机、网络介质，以及在这些设备上或与这些设备一起运行的软件，如操作系统、固件、应用程序、软件和数据库。相比之下，信息技术（Information\
  \ Technology，IT）一词涵盖了与存储、检索和发送信息相关的所有设备和过程。一些典型的IT设备包括PC、服务器、网络交换机、网络介质、防火墙、其他安全设备，以及在IT设备上或与其一起运行的各种软件、固件、数据库等。\n\
  \n很快你就会发现，当IT设备和过程被用作OT环境的一部分时，这两个术语存在重叠区域。正如我们将在本章后面讨论的，这源于过去几年一直在进行的OT与IT的融合。\n\
  \nIT和OT真正的不同之处在于它们的利用和实现方式。IT设备几乎从不进行物理控制（让某物移动、升温、反应……），而这正是OT设备的唯一目的。IT是OT环境的一部分，以便OT过程能够利用信息能力来做出反应、记录或处理变化。如果在纯IT系统上，这些数据因损坏或恶意行为而丢失，服务可能会失败，Web门户可能变得无响应，或发生其他形式的服务中断。然而，后果仅限于一定的金钱损失，如收入损失或服务水平协议（SLA）指标下降。但在OT方面，如果过程正常运行所依赖的数据丢失或损坏，物理过程可能变得不稳定，后果可能包括对环境的物理破坏，或对公共健康和安全的威胁，甚至可能对操作OT设备所控制机械的人员造成致命伤害。\n\
  \n我想谈的IT和OT之间的最后一个区别是它们的保护方式——这是技术用户认为最重要的领域。众所周知，IT的安全范式是机密性、完整性和可用性（CIA）三元组。虽然不是严格规则，但对于IT系统，机密性（防止数据被窥探）是最重要的安全要素，其次是完整性（确保数据不被篡改），最不重要的是可用性（正常运行时间）。对于OT系统，这个三元组被颠倒过来——可用性是OT系统所有者最关心的问题，其次是完整性，最后才是机密性。\n\
  \n以下截图描述了CIA安全三元组：\n\n![](img/c8ffa9959721097701584fcc95101362_42_0.png)\n\n考虑到OT/ICS系统控制的某些过程预计会连续数周甚至数月无瑕疵且不间断地运行，很容易理解为什么在这里可用性要求是重中之重。完整性紧随其后，因为我们希望确保OT系统和操作员所依据的数据没有错误或操纵。在典型的OT环境中，机密性几乎不是主要关注点，除非是存储在数据库或服务器/PC日志文件中的一些历史数据。这是因为当数据被使用时，它已经几乎毫无价值了；不过正如我所说，存储的生产数据、配方，以及在某些情况下存储在存储介质上的控制应用程序确实具有一些价值，因此CIA三元组中的C不应被完全忽视。\n\
  \n## 机遇\n\n为什么会出现IT与OT的融合？将两者分开不是更有意义吗？是的——从安全角度来看，尽可能保持分离肯定是有意义的。然而，从业务角度来看，从OT环境获取准确、实时且相关的数据非常有意义。这些信息可以实现更紧密的生产调度，减少需要现场持有的库存量，有助于成本计算，并提供更多物流优势。现代ERP和MES系统依赖来自企业生产和企业侧双方的输入和信息。这些原因——以及更多原因——推动了IT与OT系统的融合。\n\
  \n## 风险\n\n如本章前面所述，ICS（OT环境）最初是围绕专有设备、装备以及网络介质和协议构建的，并未考虑安全性。几乎每个供应商都有自己的做事方式，每个供应商都有不同的配置、操作和维护其设置的方法。这种专有行为与整个IT/OT融合需求不太兼容，慢慢地，ICS设备供应商开始遵守一套通用标准——即广泛使用的网络协议以太网、互联网协议（IP）、传输控制协议（TCP）和用户数据报协议（UDP）——来承载其控制和自动化协议。\n\
  \n\n\n\n\n为了避免重复造轮子，许多厂商在其成熟的控制和自动化协议之上叠加了 TCP 或 UDP 协议。这样一来，只需加入一个支持 IP/TCP/UDP\
  \ 的通信模块，就能轻松搭上 IT/OT 融合的快车。鉴于大多数控制系统本质上是模块化的，通信设备与**中央处理单元 (CPU)**（控制器）是分离的，因此这种替换非常容易。现在，客户可以更轻松地适应一种标准，使用同一种类型的线缆、交换机，甚至安装人员的同一技能组合，将整个生产设施连成一个统一的技术体系。\n\
  \n而且许多公司确实就是这么做的——他们布线铺设了整个网络，从生产区延伸到办公室，跨越**广域网 (WAN)** 连接到其他工厂或公司总部，有时甚至一直延伸到互联网上。这使得获取数据、进行故障排除和实现访问变得异常容易，但也将这些此前隐藏的设备和装备——往往运行着企业最敏感的部分——暴露给了攻击。控制和自动化设备现在拥有了\
  \ IP 地址；由于它们使用 IP 协议，可以从任何地方访问，而且由于运行在 IP 和 TCP 之上的控制和自动化协议几乎都是明文协议，因此很容易被解读。\n\n\
  请看下面的截图：\n\n![](img/c8ffa9959721097701584fcc95101362_44_0.png)\n\n图 1.16 – ICS 明文协议数据包\n\
  \n正如前述截图所示，Modbus 数据包（例如）不会隐藏其在节点之间传输的数据或功能码。这允许对数据和功能码进行检查和篡改。此外，随着自动化设备采用 TCP/IP\
  \ 协议栈，它们现在可以被常见的 IT 技术和工具所针对。\n\n即使在今天，大多数 ICS 设备仍在使用作为专有协议一部分设计的开放且明文的协议。然而，许多公司已经不再使用连接组织内所有设备的扁平网络。我们将在后面的章节中更详细地讨论这一点。\n\
  \n如果你想亲眼见识控制和自动化协议固有的不安全性，甚至自己尝试一些攻击，我推荐你阅读本书第一版的 *第 2 章* – *Insecure by Inheritance*。本章对\
  \ Modbus、Siemens S7、Profinet 和 Ethernet/IP 协议提供了详细的解释和攻击示例。\n\n## 对 Slumbertown\
  \ 纸厂的示例攻击\n\n通过对虚构的 Slumbertown 纸厂进行网络攻击的示例，在本书第一版的 *第 3 章* – *The Attack* 中，我们逐步了解了一个可能的攻击场景，即攻击者渗透到组织内部并在生产过程中制造混乱。\n\
  \n请看下面的截图：\n\n![](img/c8ffa9959721097701584fcc95101362_45_0.png)\n\n图 1.17 – Slumbertown\
  \ 纸厂 ICS 网络架构\n\n前述截图描绘了攻击者成功渗透并大肆破坏的 Slumbertown 纸厂 ICS 网络。接下来是对攻击者所采取方法的总结。\n\n\
  ### 攻击回顾\n\n从高层次来看，我们现在将查看攻击者为达到目标所采取的步骤。\n\n### 侦察\n\n攻击者的第一步是尽可能多地收集有关目标的信息。这称为侦察。在此，攻击者在开始攻击之前尽可能多地了解了纸厂的运营情况、其员工的个人生活以及\
  \ ICS 环境中使用的技术。\n\n###  spear phishing\n\n攻击者制作了一封诱人的钓鱼邮件，并以一种能够让 Mark 点击恶意链接的方式进行定制，最终导致\
  \ Mark 登录的计算机被入侵，从而使攻击者能够在纸厂的企业网络上获得立足点。\n\n你可以在这里看到钓鱼邮件：\n\n![](img/c8ffa9959721097701584fcc95101362_46_0.png)\n\
  \n图 1.18 – '一切都始于这封邮件...'\n\n接下来，攻击者开始四处探查，寻找其他受害者进行入侵。\n\n### 企业网络上的横向移动\n\n一旦攻击者在纸厂的企业网络上获得立足点（该网络直接连接到互联网，并拥有具有电子邮件和互联网访问权限的业务型客户端），他们就开始寻找其他系统进行入侵。他们通过将\
  \ Mark 的计算机用作进入网络的跳板并以此方式运行探测和扫描来实现这一点。\n\n使用这种方法，他们找到了并入侵了其他有趣的计算机，并最终进入了一个系统，由于该系统是“双宿”的（连接到两个网络：企业网络和工业网络），使他们能够访问工业环境。\n\
  \n### 攻击工业网络\n\n在获得一台连接到工业（生产）网络的工作站的访问权限后，攻击者准备开始其攻击的真正目标——第二阶段：中断纸厂消化器过程，其最终目标是造成物理损坏。他们通过操纵从控制过程发送到操作员屏幕的明文数据包来实现这一目标。通过更改向操作员展示的值，他们欺骗操作员采取了纠正措施，最终导致消化器超压……\n\
  \n### 并没有多少改变\n\n在本书第一版发布和本版撰写之间，几乎每一次重大的 ICS 为中心的入侵都遵循了上述过程。攻击者的最终目标可能有所不同，但为实现目标而采取的步骤基本相同。\n\
  \n如果你想阅读有关攻击如何发生的详细描述，甚至跟随攻击活动，请前往本书第一版的 *第 3 章* – *The Attack*。\n\n## 全面的风险管理流程\n\
  \n确保 ICS 环境的安全最终归结为风险管理。通过识别风险、分类风险、优先排序风险并最终减轻风险，ICS 安全态势得以改善。涉及风险管理的四个主要类别，如第一版本书\
  \ *第 4 章* – *Industrial Control System Risk Assessments* 中详细解释的那样，概述如下。\n\n### 1.\
  \ 资产识别和系统表征\n\n在“*你不知道拥有什么就无法保护它*”的口号下，风险管理的第一步——也是 arguably 最重要的一步——是获取 ICS 环境中所有资产的准确索引。这可能是一个手动过程，即打开每一个电气柜，查看每一个网络机柜和配电盘，并盘点生产设施中的每一台桌面计算机。然而，自动化方法可能更容易、更全面且出错率更低。\n\
  \n诸如开源的 grassmarlin (https://github.com/nsacyber/GRASSMARLIN) 或其中一种付费的 ICS 特定入侵检测系统\
  \ (IDS) 解决方案（CyberX、Claroty、Nozomi、Forescout、Indegy、PAS Global LLC...）等工具可以通过嗅探网络被动地索引你的资产。尽管这些工具做得非常出色，但如果资产位于网络的难以触及部分或以某种方式超出上述工具的覆盖范围（离线），它们可能会遗漏资产。我建议使用嗅探工具、非工作时间使用正确配置的\
  \ Nmap 扫描进行扫描，以及一些手动盘点和索引的“体力劳动”相结合，以获得最佳效果。\n\n在你列出 ICS 环境中的所有资产后，必须在列表中添加诸如操作系统版本、固件修订版、补丁级别、软件清单和正在运行的服务等详细信息，以及资产的关键性评分和价值。资产的关键性评分是一种识别资产对整体生产过程或组织生存能力的重要性、价值和不可或缺程度的方法。关键性评分将在第\
  \ 15 章《工业控制系统风险评估》中详细讨论。这些资产详细信息将有助于评估适当的风险评分，并最终实现风险缓解的智能优先级排序。\n\n### 2. 漏洞识别\n\
  \n在汇编了包含相应软件、固件和操作系统补丁级别及修订版的资产列表后，下一步是将这些修订版、版本和补丁级别与已知的漏洞进行比较。这可能是一个手动过程，其中你使用\
  \ National Vulnerability Database（https://nvd.nist.gov/）等网站查找每条信息并将其与已知漏洞数据库进行比较。\n\
  \n更可管理的方法是使用 Nessus 或 Qualys 运行自动漏洞扫描。自动漏洞扫描速度更快，通常更可靠，因为它可以查找——有时甚至验证——大量已知漏洞，并检查常见的错误配置或默认（弱）设置。请注意，漏洞扫描非常激烈，可能会导致\
  \ ICS 设备在额外的网络流量下不堪重负。我强烈建议在生产停机期间运行此类扫描，但请做好事后验证 ICS 设备按预期工作准备。\n\n\n\n\n\n###\
  \ 3. 威胁建模\n\n现在我们已经知道我们有什么（资产清单）以及它有什么问题（资产漏洞），下一步是查看我们资产中发现的漏洞被利用的可能性有多大，以及成功利用的潜在影响和后果是什么。帮助我们定义这一点的过程称为威胁建模。威胁建模使用风险场景来定义可能的威胁事件以及威胁事件的影响和后果。对于威胁事件要可行，必须存在以下要素：执行该事件的威胁源；利用漏洞的威胁向量；以及具有漏洞的目标。可以说，创建风险场景就是试图预测威胁最有可能针对并打击的地方。以下截图概念化了一个风险场景：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_49_0.png)\n\n图 1.19 – 风险场景的描述\n\n拥有风险场景矩阵使我们能够做出明智的决定，判断哪些威胁比其他威胁更令人担忧，因此可以让我们优先排序并简化补救工作，为我们有限的安全预算带来更好的投资回报。\n\
  \n> **重要说明**\n> \n> 此外，为了帮助定义威胁事件发生的可能性，您可以在风险评估的一部分中执行渗透测试。简而言之，渗透测试将采用创建的风险场景并尝试在风险场景的限制范围内通过攻击漏洞来实现它们。毋庸置疑，渗透测试不应在实用的\
  \ ICS 环境中执行！应构建并使用测试环境或 ICS 环境的近似值来运行渗透测试活动。\n\n### 4. 风险计算和缓解规划\n\n现在我们对 ICS 环境的可能风险场景有了非常清晰的了解，接下来我们可以量化风险，通过为我们创建的每个风险场景分配风险评分。通过在资产之间关联评估过程并对每个资产进行交叉评估，评分将是一个相对数字，显示在何处最好花费缓解工作和资金以创造最佳的投资回报，并指出我们的努力将产生最大影响的地方。\n\
  \n对于评分，我们可以使用以下公式（存在其他公式，只要保持一致即可使用）：\n\n$$risk = \\frac{severity + (criticality\
  \ * 2) + (likelihood * 2) + (impact * 2)}{4}$$\n\n作为示例，此公式为 Siemens S7-400 PLC 漏洞提供了以下风险评分：\n\
  \n| 漏洞严重性 | 资产关键性 | 攻击可能性 | 影响 | 风险评分 |\n|---|---|---|---|---|\n| （来自通用漏洞和暴露 CVE）\
  \ | （来自步骤 1） | （CVE 结合系统具体情况） | （来自阶段 1） | |\n|  |  |  |  |  |\n| 7.5 | 4 | 4 |\
  \ 3.5 | 7.6 |\n\n> **重要说明**\n> 为了补充在第一版中详细描述的风险评估过程，本书将对渗透测试过程进行痛苦的详细描述。\n\n## DiD\
  \ 模型\n\nDiD 模型的核心理念是，通过堆叠防御，多个备份安全控制相互覆盖，从而为整个 ICS 网络创建整体且包罗万象的安全态势。\n\nDiD 模型在以下图表中呈现：\n\
  \n### 计算机安全控制\n\n该层内的控制旨在保护和加固计算机系统，包括补丁管理、终端保护解决方案、删除未使用的应用程序/协议/服务、关闭不必要的逻辑端口，以及保护物理端口。\n\
  \n### 应用安全控制\n\n该层内的控制旨在在 ICS 的应用层添加控制。应用层是终端用户通过**应用程序编程接口（APIs）**、门户和其他接口与系统交互的地方。该层内的控制包括\
  \ AAA 方法和解决方案。\n\n### 设备级安全控制\n\n该层内的控制旨在保护 ICS 设备，包括设备补丁、设备加固、物理和逻辑访问限制，以及建立设备生命周期计划，其中涉及定义设备采购、实施、维护变更管理以及设备处置的程序。\n\
  \n## ICS 安全计划开发\n\n安全规划和安全计划开发，包括定义您独特环境和情况的政策和程序的治理，应是在任何其他安全任务之前进行深思熟虑的练习。在开展任何安全活动之前，您应制定一个符合贵公司目标、需求和要求的计划。如果没有适当的规划和指导，实施安全就会针对一个移动目标。\n\
  \n## 安全计划开发和管理\n\n为了能够有效地将安全集成到 ICS 中，我们必须定义并执行一个全面的网络安全计划，解决安全的所有方面。该计划应从确定计划的目标到日常运营以及计划和随附安全态势的持续审计和验证，以实现合规和改进目的。组织的业务目标应包括网络安全计划，并且安全计划应与组织的业务目标保持一致。这对于安全计划的整体成功至关重要。\n\
  \n在建立工业网络安全计划时需要考虑的项目包括以下内容：\n\n- 获得高级管理层的认可\n- 建立并培训跨职能团队\n- 定义章程和范围\n- 定义具体的 ICS\
  \ 政策和程序\n- 实施 ICS 安全风险管理框架\n  - 定义和盘点 ICS 资产\n  - 为 ICS 系统制定安全计划\n  - 执行风险评估\n \
  \ - 定义缓解控制措施\n- 为 ICS 员工提供培训并提高安全意识\n- 反复进行——意味着您必须无限期地监控、纠正和完善您的安全计划，以保持准确、最新和有效\n\
  \n## **风险管理（查找和缓解风险的循环活动）**\n\n以下截图描述了围绕持续（循环）工业网络安全改进过程的流程和相应活动：\n\n![](img/c8ffa9959721097701584fcc95101362_53_0.png)\n\
  \n保持 ICS 安全计划和随附风险管理活动准确和最新需要一系列循环活动。\n\n这些活动概述如下：\n\n- **评估风险**：为验证已应用的安全控制和缓解措施的完整性，并根据最新的标准和政策进行评估，应安排定期风险评估。随着整体安全计划的发展，评估可以变得越来越深入，以发现更详细和更难发现的漏洞。风险评估应至少每年完成一次。\n\
  - **响应已识别风险**：当风险被监控系统检测到或通过风险评估揭示时；必须由（专门）团队解决。\n- **监控风险演变和缓解**：监控风险旨在跟踪在风险评估期间发现的问题或由监控系统（如终端安全客户端或\
  \ IDS/IPS 传感器）发现的问题的缓解工作。\n\n## 来自第一版的要点\n\n在过去几十年中，ICS 已从独立的自动化孤岛发展成为整个自动化设备、计算机和服务器系统以及连接它们的媒体的网络。如今，IT\
  \ 和 OT 设备以交织的方式使用，以实现特定的业务目标，例如构建产品、提供服务或维持温度、湿度或稳定性等环境变量。ICS 已成为几乎每个行业的支柱，当其变得不可用时，将对公司的正常运行时间、生产率和盈利能力造成严重后果，并且可能造成环境和物理损害，甚至在被篡改时导致人身伤害或死亡。\n\
  \n对 ICS 可靠运行的这种极端依赖，加上由于 IT 和 OT 融合而增加的网络安全威胁暴露，使得每个 ICS 所有者维护适当网络安全态势成为尽职调查的问题。\n\
  \nICS 妥协的极高影响与使用标准 IT 恶意软件远程实现这一能力的结合，导致过去二十年来 ICS 网络攻击激增。我们都知道，据称由国家行为者实施的对关键基础设施的高影响网络攻击——核设施、电力电网、石油行业。没有一个是免疫的。\n\
  \n\n\n\n\n在本书的第一版中，我们了解了攻击者如何渗透、利用并接管 ICS 环境。我们学习了这个过程所使用的工具和技术，也审视了 ICS 设备运行方式中存在的根本问题和固有弱点——正是这些让上述工具和攻击能够成功入侵\
  \ ICS 环境。第一版随后展示了保护 ICS 环境所需理解的概念、思路和基础知识，涵盖了诸如纵深防御（DiD）、安全程序开发和风险管理等主题。\n\n作为总结，我们将介绍成功建立一套运行良好且有效的\
  \ ICS 网络安全程序应考虑/涵盖的四项主要任务或职责。\n\n### 了解你拥有什么\n\n维持一份最新、完整且准确的 ICS 资产清单，可以说是在网络安全程序中最重要的一步。你无法保护那些你不知道自己拥有的东西。\n\
  \n这项任务需要一个规划良好且有效的资产管理程序。\n\n### 了解你拥有的东西存在什么问题\n\n接下来，你必须了解现有资产存在哪些问题。否则，你该如何修复它们？\n\
  \n这项任务要求你定义一个全面的漏洞管理程序。\n\n### 修复或防御你所知的错误\n\n一旦确定了现有资产的问题，你必须制定一个有针对性的、完整的缓解计划，在处理无疑庞大的风险时，为你带来最佳的投资回报。\n\
  \n这项任务要求你建立一个完整且详尽的风险管理程序。\n\n### 反复循环，永不停歇\n\n为了使你的 ICS 网络安全活动和各项管理程序保持最新且有效，你需要定期审查这些流程、活动以及已实施的解决方案和控制措施，以确认其完整性、有效性和相关性。\n\
  \n这项任务要求定义一套周期性发生的事件序列，将所有的网络安全程序和活动串联到一个永无止境的 **评估**、**响应**和**监控**循环中……\n\n本书其余部分将专门讨论用于监控\
  \ ICS 环境安全的技术、方法、概念、活动和职责，简称 *安全监控*。\n\n### 总结\n\n我们通过回顾第一版书中的内容，开启了 ICS 网络安全之旅的续篇。第一版主要关注的是建立安全的\
  \ ICS 环境，而这一版将在此基础上进行扩展，探讨通过观察和监控安全态势来维护安全环境的各种主题。我将采用一种“自下而上”的方法来解释所有内容，这意味着我们将研究安全监控及其在\
  \ ICS 环境生命周期各个阶段的实施要点。在接下来的几章中，我们将首先重新审视 ICS 网络架构和 IDMZ。\n\n在下一章中，我们将重新审视 ICS 网络架构。我们将回顾构成现代\
  \ ICS 网络的各个部分和组件，它们分布在 ICS 环境的三个不同区域：企业区、工业区和 IDMZ。\n"
- "# 2 工业控制系统架构的现代视角\n\n本章展示了**工业控制系统（ICS）**网络架构设计的现代视图，以及它如何与工业网络安全相适应。围绕 ICS 网络架构的讨论基于我个人设计全厂架构的方法，因为自从本书第一版出版以来，我又积累了几年经验。我增加了一些在各个工业领域发展起来的新概念、新技术和最佳实践。\n\
  \n在本章中，你将了解有助于我们理解并实施正确工业网络架构设计的工具、技术和方法论。本章只是对这些主题进行概述；后续章节将深入探讨相关主题。\n\n在本章中，我们将涵盖以下主题：\n\
  \n- 为什么正确的架构很重要\n- 工业控制系统架构概述\n\n## 为什么正确的架构很重要\n\n任何扎实的设计都始于一个健全的基础架构。ICS 网络安全也是如此。花足够的时间设计一个兼顾安全性、性能、正常运行时间要求和弹性的稳健架构，将在\
  \ ICS 环境的整个生命周期中带来丰厚回报。我们所做的决策和考量所带来的影响，会波及我们之后所做的任何事，因此让我们来回顾一些基本要求、考量和建议。\n\n\
  在*第4章：以安全为考量设计ICS架构*中，我们将更仔细地研究一个设计良好的 ICS 网络架构在安全方面的内容。本章其余部分将是对推荐 ICS 网络架构的架构性概述/回顾，并更新了自本书第一版问世以来新增的和修订过的考量。\n\
  \n## 工业控制系统架构概述\n\n下图展示了推荐的 ICS 网络架构。从根本上说，它与我们第一版书中讨论的内容相比没有变化。推荐的架构基于普渡模型（该模型在*第1章：第一版引言与回顾*中有详细讨论），但已经过更新，以反映当前标准、行业最佳实践，以及作者在设计、实施和维护安全且有弹性的工业网络架构方面\
  \ 10 年的经验。\n\n这里我们不再逐一讲解每个部分、区域和领域，而是从实施的角度来看待该架构。构建网段、边界和安全控制背后用到的是什么样的技术？\n\n\
  ![](img/c8ffa9959721097701584fcc95101362_59_0.png)\n\n图 2.1 – ICS 架构的完整视图\n\n以下章节将介绍企业区和工业区，并讨论工业非军事区。\n\
  \n### 企业区\n\n我们从企业侧开始讨论。这是 ICS 环境中那些不直接与生产过程交互的系统的所在区域。正如许多针对工业环境的近期入侵所显示的，企业网络往往是被用于对组织发起攻击的初始入口点。一封钓鱼邮件或一次路过式恶意软件下载就能让攻击者进入企业网络，而攻击者会在那里尝试转向工业网络。\n\
  \n企业区与工业系统和生产数据的典型交互包括以下内容：\n\n- 需要获取工业区生成的报告的企业用户。这些报告通过反向 Web 代理之类的代理服务提供。反向 Web\
  \ 代理可以通过**工业非军事区（IDMZ）**安全地公开位于工业网络上的报告 Web 门户。\n- 需要获取企业侧生成的报告，但这些报告是基于工业区生产系统数据构建的企业用户。这是通过\
  \ Pi Historian 或（自定义）SQL 数据库等历史数据服务在工业区和企业区之间同步数据来实现的，并通过 IDMZ 经由 SQL 数据复制代理服务安全提供。\n\
  - **制造执行系统（MES）**或**企业资源计划（ERP）**客户端。这些 MES/ERP 客户端与生产系统交互，以优化生产效率并跟踪生产统计信息。其实现是数据同步和反向\
  \ Web 代理服务的组合。\n- 对工业系统的远程访问。通常有两种类型的远程访问：一种供员工使用的解决方案——如果员工已经连接到企业网络（位于现场/本地），可以直接使用\
  \ IDMZ 中的**远程桌面协议网关（RDP-GW）**代理服务；当员工远程工作时，则会通过**虚拟专用网络（VPN）**解决方案接入企业网络。\n\n\n\n\
  然后，对于供应商和承包商来说，有一种解决方案，通常是通过实施 **虚拟机 (VM)** 风格的远程访问来实现（可参考 Citrix Gateway（`https://www.citrix.com/products/citrix-gateway/`）），该方案使用远程桌面技术将供应商或承包商安全地连接到企业网络。此时，供应商或承包商使用的是由公司控制、维护和监控的公司资产。从这种\
  \ VM 风格的远程访问系统，供应商或承包商可以通过 IDMZ 中的 RDP-GW 连接到工业系统。在 *第 3 章，工业隔离区* 中，我们将讨论如何控制供应商何时、何地以及如何连接到\
  \ RDP-GW 服务器。\n\n上述 IDMZ 服务以及其他若干服务将在 *第 3 章，工业隔离区* 中详细讨论。\n\n企业侧 ICS 环境的实现方式应为功能特定的系统安全地集成到现有的\
  \ IT 基础设施中。下图描绘了实现此目标的推荐方式：\n\n![](img/c8ffa9959721097701584fcc95101362_61_0.png)\n\
  \n图 2.2 – ICS 企业区网络架构\n\n关于此图，有一些重要的注意事项如下：\n\n- 任何不直接交互或对生产过程运行至关重要的系统都应驻留在企业区。这显著降低了工业环境的攻击面（*我们认为最关键且应不惜一切代价保护的区域*）。通过强制所有与工业环境（人工交互）的交互都在企业系统上进行，我们可以密切监控这些交互，在需要与工业系统交互时进行中介，并有效地创建一个紧密控制和监控的安全边界。正如我们在第\
  \ 3 章 *工业隔离区* 中将看到的，IDMZ 允许我们通过实施代理服务以及借助 **深度包检测 (DPI)** 启用防火墙和 **主机入侵检测系统 (HIDS)**\
  \ 与 **网络入侵检测系统 (NIDS)** 技术来监控任何交互，从而在物理上完全将企业系统和人工交互与生产网络分离。\n\n- 不被视为生产过程运行至关重要的系统不应放置在工业区，而应放置在企业网络的专用、隔离部分。从工业网络中消除不必要的系统和设备可显著降低攻击面。通过将人们交互的设备放置在企业侧，我们可以创建一个边界，在该设备或人工因素被攻破时保护工业环境。\n\
  \n- 远程访问至少应区分员工型和供应商型远程访问，员工通常利用某种 VPN 解决方案。供应商不应被授予访问公司网络的 VPN 权限（你真的想将一个未知网络连接到你的网络吗？），而应使用某种类型的虚拟机访问方案，例如\
  \ **VMware ACE、Citrix XenApp、Microsoft Remote Desktop、Bongar Remote Support、CyberArk\
  \ Alero** 等。实施基于虚拟机的远程访问解决方案有效地将远程实体与企业网络之间的安全边界置于公司的公共地址处。建立虚拟会话后，远程用户使用由公司控制和拥有的资产，从而可以完全控制并可见其操作。从此虚拟远程会话中，远程用户可以被允许执行特定操作，例如连接到\
  \ IDMZ 中的远程桌面网关，然后允许其连接到工业区。此外，应为进入企业网络的初始跳转（VPN/Citrix 访问）以及在 IDMZ 中的 **远程桌面网关\
  \ (RDP-GW)** 实现多因素身份验证。\n\n这涵盖了 ICS 企业侧的 IT 部分。接下来，我们将讨论企业侧 **运营技术 (OT)** 的存在以及围绕这些系统、设备和设备的与安全相关的考虑。\n\
  \n## 运营技术 (OT) 在信息技术 (IT) 空间中的存在\n\n如 *图 2.2* 所示，有相当多的与 ICS 相关的系统（OT 资产）存在于（严格来说）\
  \ **信息技术 (IT)** 空间中。这是 OT/IT 融合对 ICS 环境产生的影响之一。企业与工业系统之间，或 IT 与 OT 之间已不再存在严格的分离。在过去十年左右的时间里，ICS\
  \ 已将其边界延伸到“IT”空间，原因可能是为了允许供应商或员工从远程位置安全连接、提供数据共享方式、允许 OT 资产被监控，或以其他方式向 OT 环境提供 IT\
  \ 服务。\n\n保护 ICS 环境不再是隔离问题或专职 OT 人员的工作。因为 OT 和 IT 重叠，所以保护和保障 ICS 环境的负担也必须重叠。我合作过的在保护生产环境方面最成功的公司是那些成功建立了\
  \ IT/OT（安全）团队并使其良好协作的公司。如果你从阅读本书中只得到一件事，那就是成功保护 ICS 环境是一项依赖于组织中每个人共同协作的任务。\n\n此外，在本书的其余部分，我们将研究许多最初为\
  \ IT 设计然后被采用或调整以在 OT 空间中工作的活动、技术和学科（包括攻击）。拥有对业务环境两方面都有知识的团队将带来丰厚的回报。\n\n## 安全考虑\n\
  \n我们将通过围绕在 IT 环境中运行 OT 系统的一些安全考虑来结束本节。要安全地实现这一点，你应执行以下操作：\n\n将 ICS 环境的两个不同侧面视为不同。也就是说，ICS\
  \ 网络被划分为工业区和企业区是有原因的。你可以通过使用专用且不同的安全控制来扩展这种分离，具体如下：\n\n- 为工业侧和企业侧分别使用独立、专用的 Windows\
  \ Active Directory 域。\n- 不要在工业和企业 Active Directory 域之间使用域信任关系。至少，企业用户/实体应拥有两套凭据：一套用于企业网络资源，一套用于工业网络资源。\n\
  - 指定一组选定的系统允许与 IDMZ 通信。访问工业资源仅限于这些系统。只有选定的用户才能利用这些系统穿越 IT-OT 边界。\n- 防止在任何可以跨越 IT-OT\
  \ 边界（可穿越 IDMZ）的企业域上的系统或任何工业系统上存储凭据。攻击者在入侵系统后做的第一件事就是寻找存储的凭据，因此请通过一开始就不存储任何凭据来尽可能增加难度。\n\
  \n这涵盖了 ICS 环境的企业侧；接下来，我们将进入工业领域。\n\n## 工业隔离区\n\n**工业隔离区**（IDMZ）是安全地将工业区和企业区连接在一起的粘合剂。它允许企业和工业网络之间实现物理分离，同时允许使用功能特定的代理服务进行基本功能。IDMZ\
  \ 将在 *第 3 章，工业隔离区* 中详细解释。\n\n\n\n\n\n## 工业区\n\n在 OT-IT 安全屏障的另一侧是工业区。任何连接到工业网络的系统都有充分的理由存在于此，这意味着该系统要么直接影响生产过程，要么被确定为在\
  \ IDMZ 必须关闭时维持整体生产过程可操作性所必需（请参阅本书第一版，了解该概念的详细讨论）。顺带一提，这一事实允许一种非常有效的<|message|>安全控制措施，我们将在本书后面发现。\n\
  \n下图描绘了工业区的推荐架构：\n\n![](img/c8ffa9959721097701584fcc95101362_65_0.png)\n\nFigure\
  \ 2.3 – The ICS industrial network architecture\n\n以下各节将解释 ICS 工业网络架构的不同区域。\n\n\
  ### Level 3 – Site Operations\n\n我们要讨论的工业区的第一个部分，普渡模型将其称为 Level 3 – Site Operations。普渡模型已在第\
  \ 1 章《引言与第一版回顾》中详细讨论。Level 3 – Site Operations 是工业网络中用作下层控制和自动化系统与企业网络之间通信中介的子网或飞地（见下一节），通过\
  \ IDMZ 中的代理服务进行。在其他话说，从企业区访问和与工业系统交互必须由专用的 IDMZ 服务代理（形成物理隔离），并终止于 Level 3 – Site\
  \ Operations 飞地（在 Level 3 的专用服务器上）。另一方面，来自 Level 2 及以下的数据必须先存储在 Level 3 Site Operations\
  \ 系统上，然后才能通过专用的 IDMZ 代理服务发送给企业系统或用户或被其访问。为了说明这一点，下图显示了企业区中的用户如何使用 Microsoft 的 RDP\
  \ 客户端通过 IDMZ 中的 RDP-GW 代理服务连接到位于 Level 3 – Site Operations 的虚拟桌面服务器。虚拟桌面服务器随后允许企业用户对\
  \ 2 级及以下的控制和自动化设备执行维护、故障排除或开发任务：\n\n![](img/c8ffa9959721097701584fcc95101362_66_0.png)\n\
  \nFigure 2.4 – Enterprise client accessing industrial automation systems\n\n在前面的图中，我们可以看到维护办公室中的工程师执行以下操作：\n\
  \n- 1. 他们使用其客户端计算机（任何能够运行 RDP 客户端的计算机类型），该计算机连接到企业网络，以启动到 IDMZ 中 **Remote Desktop\
  \ Protocol Gateway (RDP-GW)** 代理服务的远程桌面会话（Microsoft RDP 客户端），（有关此设置的详细信息，请参阅下一章）。\n\
  - 2. 他们使用 RDP-GW 服务器代理到工业区 Level 3 Site Operations 中的虚拟桌面服务器的连接。RDP-GW 服务器严格控制谁可以在何时做什么。\n\
  - 3. 他们与工业区 L3 中的虚拟桌面服务器创建了一个交互式但物理上断开的会话。从这里，他们可以使用已安装在虚拟桌面环境中的软件和实用程序开始监控、故障排除或编程自动化和控制系统、设备或设备。\n\
  \n在本文所述的示例场景中，IDMZ 通过代理工程师的 RDP 会话在物理上将企业网络与工业网络隔离开来。连接在步骤 1 结束时移交给工业环境。从那时起，所使用的资源都在工业设置和配置的控制之下。我们有效地防止了与工业设备的直接（人工）交互。RDP\
  \ 会话允许某人编程 PLC 或排除传感器故障，而物理隔离由 IDMZ 代理服务实现，防止工程客户端计算机传播到工业网络。这种设置对防止恶意软件破坏工业网络非常有效。除非恶意软件（想想勒索软件或来自\
  \ USB 密钥的某种感染）知道如何通过 RDP-GW，否则它会被限制在企业网络上。企业区可能被关闭，但工业方面的工作可以继续。而且由于我们的工具、软件和数据都存储并安装在工业网络上的系统上，我们可以拿一台干净的计算机，配置\
  \ RDP 客户端并重新连接——无需重新安装软件、许可证或数据，因为所有这些仍安全地存放在工业区。\n\n现在，让我们反转场景，看看工业设备（2 级及以下）的数据如何在工业区收集并发送到企业系统，企业网络上的用户可以在那里使用该数据进行报告或其他活动。此设置在下图中显示：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_68_0.png)\n\nFigure 2.5 – Production\
  \ data being sent to Enterprise systems\n\n让我们看看这张图包含什么内容：\n\n- 1. 生产相关数据由例如自动化数据库服务器上的历史数据收集服务从\
  \ 2 级及以下的自动化和控制设备中收集。\n- 2. IDMZ 中的 SQL 复制代理服务（例如 Pi 到 Pi 复制）将工业网络上的数据库与其企业侧的对应数据库保持同步（可以是单向或双向）。\n\
  - 3. 生产相关数据进入企业侧系统的数据库，例如 ERP/MES 或（Pi）历史记录。\n- 4. 依赖生产数据的客户端可以从企业系统检索（或存储，如果使用双向复制）并访问此数据。\n\
  \n我们将在下一章中查看更多关于 IDMZ 如何在仍允许跨访问的同时分隔企业和工业网络的示例。\n\n## Enclaves\n\n工业区的另一个重要方面是飞地。飞地是工业网络内的逻辑子部分（子网）。通常，这些子部分是通过将一组相关的自动化设备（想想功能上、逻辑上或地理上相关的设备）分组到自己的子网（VLAN）或物理隔离网络中，然后通过防火墙将其重新连接到工业网络的其余部分来创建的。\n\
  \n此设置允许相关生产设备不受阻碍地通信（在第 2 层速度下），而与其他飞地或 Level 3 Site Operations 的通信则由防火墙和/或 NIDS\
  \ 检查、控制和监控。\n\n## Micro segmentation\n\n在飞地内部，可以通过微分段进一步细分。假设您已根据生产线创建了一个飞地，并且在这些生产线内部，有一些区域/设备组不一定需要与其他区域通信，例如\
  \ VFD 和 HMI。然后，这些设备组或飞地区域可以微分段到飞地子网内的自己的子网中。需要被其他段、飞地或 L3 Site Operations 访问的任何微分段都可以使用\
  \ OT-Firewall 上的子接口或使用第 3 层功能的飞地交换机。\n\n在下图中，我们可以看到工业区的详细视图，其中显示了 level 3 Site Operations、飞地和段：\n\
  \n![](img/c8ffa9959721097701584fcc95101362_70_0.png)\n\nFigure 2.6 – The Industrial\
  \ Zone – detailed\n\n在这里，我们可以看到四条不同的通信路径：\n\n- 1. 同一飞地或段内设备之间的通信（飞地是一种段形式）在飞地交换机内处理，通过相同的\
  \ VLAN 接口——因此以第 2 层速度进行。这允许系统中最基本的组件——那些绝对必要以保持流程运行的组件——不受阻碍地通信。\n  - 此类流量保持在交换机本地，不会通过防火墙发送，因此不会被检查。正如我们将在\
  \ *Chapter 4, Designing the ICS Architecture with Security in Mind* 中看到的那样，要检查此类本地流量，我们必须在飞地交换机上设置\
  \ SPAN 或 MIRROR 会话。\n- 2. 飞地或段中的设备与 Level 3 Site Operations 中的系统之间的通信必须离开其本地子网（VLAN），因此需要默认网关。OT-Firewall\
  \ 将能够处理此问题，并且额外好处是此类流量在通过 OT-Firewall 时现在会被检查、控制和监控。\n- 3. 同一飞地内各段之间的通信必须离开其子网，因此需要默认网关（路由器）。OT-Firewall\
  \ 将能够处理此问题，并且额外好处是此类流量在通过 OT-Firewall 时现在会被检查、控制和监控。\n- 4. 飞地之间的通信必须离开其子网，因此需要默认网关（路由器）。OT-Firewall\
  \ 将能够处理此问题，并且额外好处是此类流量在通过 OT-Firewall 时现在会被检查、控制和监控。\n\n这涵盖了讨论的工业方面。接下来，我们将简要介绍通过\
  \ **Industrial Demilitarized Zone** 或 **IDMZ** 正确、安全地连接企业区和工业区的手段。\n\n\n\n\n\n##\
  \ 用于构建 ICS 环境的硬件\n\n那么，构建所有这些需要什么？\n\n尽管该问题的详细答案高度依赖于 ICS 的规模、功能、性能、正常运行时间要求以及地理分散性，但大多数\
  \ ICS 环境都会包含一组独特的组件来实现这一目标。下图展示了 ICS 环境的硬件架构图：\n\n![](img/c8ffa9959721097701584fcc95101362_72_0.png)\n\
  \n图 2.7 – ICS 环境 – 硬件视图\n\n请注意，上述架构展示了 IDMZ 及以下的全部硬件。托管 ICS 企业资产所需的硬件是企业网络的一部分，通常表现为物理计算机/服务器或虚拟化资产（通过\
  \ Hyper-V 或 VMware vSphere）。此外，请注意该架构仅关注构建工业网络和 IDMZ 所需的硬件。像 HMI、PLC、DCS 等终端所需的硬件不在考虑范围内，尽管其中一些资产可以虚拟化在前述图中标记为位置\
  \ 2 的虚拟化堆栈上。\n\n因此，基于此观点，如果我们查看硬件架构，可以看到以下内容：\n\n- IDMZ 通过位于**位置 1** 的 IDMZ 防火墙对（堆栈）连接到企业网络。建议采用活动-待机高可用模式的一对防火墙以增强弹性。请注意，此处推荐活动-待机的高可用模式，因为负载均衡模式可能会允许两个防火墙的总吞吐量超过单个防火墙的最大吞吐量，在这种情况下，如果发生单次故障事件，将导致剩余的防火墙过载并导致整个堆栈宕机。\n\
  - 由于该架构层级（IDMZ）上的流量应为纯 IT 协议，标准的 IT 专用防火墙品牌/型号完全可以胜任。一些推荐的型号包括思科 Firepower 2100\
  \ 系列、Palo Alto PA-820/850 或 Fortinet FortiGate。\n- IDMZ 防火墙堆栈通常位于生产设施的服务器机房或数据中心，并与其他\
  \ IDMZ 设备一起放置在服务器机架中：\n\n![](img/c8ffa9959721097701584fcc95101362_73_0.png)\n\n\
  图 2.8 – IDMZ 防火墙堆栈\n\n- 在 OT 防火墙下方，在**位置 6** 处，我们可以看到用于连接特定区域网络设备和自动化设备的区域/隔离区交换机堆栈。自动化和控制设备可以直接连接到隔离区交换机，或者交换机可以连接撬块/机器交换机，如**位置\
  \ 7** 所示。\n\n以下是关于 ICS 网络架构设计的一些一般性建议。\n\n## 弹性与冗余\n\n在构建 ICS 环境时，请牢记以下弹性和冗余考虑事项：\n\
  \n- 设备堆叠，意思是如果您可以实施一组设备（防火墙、交换机、服务器等），您就应该这样做，以便当堆栈中的一个设备故障时，您不会陷入困境。有多种技术适用于您试图实现冗余的设备，例如：\n\
  \  - 交换机可以进行堆叠：https://www.cisco.com/c/en/us/support/docs/smb/switches/cisco-350x-series-stackable-managed-switches/smb5252-what-is-stacking.html\n\
  \  - 防火墙可以设置为活动/待机模式：https://www.networkstraining.com/cisco-asa-active-standby-configuration/#:~:text=ASA%20Active%2FStandby%20failover%2Fredundancy%20means%20connecting%20two%20identical%20ASA,be%20synchronizing%20its%20configuration%20to%20the%20standby%20unit.\n\
  \  - 虚拟化集群中的服务器可以使用 vCenter 来实现高可用性和故障转移：https://docs.vmware.com/en/VMware-vSphere/7.0/com.vmware.vsphere.avail.doc/GUID-4A626993-A829-495C-9659-F64BA8B560BD.html\n\
  - 使电缆和布线匹配堆栈的设置，意思是你应该用冗余链路（EtherChannels、Trunking 端口等）互连设备，以便如果链路发生故障，你也不会陷入困境。此外，冗余链路内的单个连接应走不同的路径，这意味着，例如，如果你将两个交换机连接在一起，EtherChannel\
  \ 中的线缆应朝工厂周围的相反方向布线。这样，如果建筑物一侧的线槽因某种原因被切断，你仍可继续运行。\n- 为所有设备使用冗余电源，并将电源线连接至两个不同的电源（最好由电网上的两个不同分配点供电）。\n\
  - 如果预算允许，请为 IDMZ 配置双份，意思是你应该在工厂的两侧构建两个相同的设置，并在两者之间使用拉伸集群技术（VMware）来创建活动-待机或负载均衡设置。这样，当工厂的一侧发生故障时，另一侧可以接管工作。\n\
  \n## ICS 环境中的虚拟化技术\n\n在上一节中，我们讨论了虚拟化技术的话题。我们现在将详细讨论这一概念，并查看其在 ICS 环境中的适用性。\n\n##\
  \ 虚拟化技术原理\n\n在计算机术语中，虚拟化指的是创建类似事物的虚拟实例（而非物理实例）的过程。该实例包括虚拟计算硬件、存储和网络资源。虚拟化并不新鲜，它起源于\
  \ 20 世纪 60 年代，当时被用于在不同应用程序之间逻辑地划分大型机系统资源。\n\n一些需要理解的虚拟化技术相关术语如下：\n\n- 硬件虚拟化\n\n\
  虚拟化指的是创建像真实计算机一样运行的虚拟机（包括操作系统）的过程，而不需要专用的物理硬件。在虚拟机上执行的应用程序与程序在逻辑上与底层的**宿主机**硬件资源隔离。换句话说，宿主机可以运行某种版本的\
  \ Microsoft Windows 操作系统，同时托管运行多种 Linux 操作系统的虚拟机。在这个例子中，运行 Linux 操作系统的计算机被称为**客户机**或客户计算机。请注意，客户机也可以运行另一个\
  \ Windows 操作系统。\n\n在宿主机上运行并负责促进虚拟机虚拟资源的软件或固件被称为**Hypervisor（虚拟机管理程序）**。有两种类型的 Hypervisor：\n\
  \n- **类型 1 Hypervisor。** 这些类型的 Hypervisor 直接运行在系统硬件上。它们也被称为“裸金属”嵌入式 Hypervisor。类型\
  \ 1 Hypervisor 的例子包括 VMware ESXi 和 Microsoft Hyper-V。\n- **类型 2 Hypervisor。** 这些类型的\
  \ Hypervisor 运行在提供虚拟化服务（如 I/O 设备支持和内存管理）的宿主操作系统内部。类型 2 Hypervisor 的例子包括 VMware Workstation/Fusion/Player\
  \ 和 Oracle VM VirtualBox。\n- **快照**\n\n快照指的是虚拟机在某一确切时间点的状态，包括任何虚拟存储设备的状态。快照允许我们恢复虚拟机的状态，如快照时记录的状态，以便稍后恢复。通过恢复快照，您可以有效地撤销在初始快照之后发生的任何更改。此功能作为备份技术非常有用，例如在执行风险操作之前。\n\
  - **迁移**\n\n如前所述，虚拟机快照可以移动或复制到拥有其自身 Hypervisor 的另一台宿主机，然后在新宿主上恢复运行。这个过程称为迁移，目的可以是创建新的虚拟机或将虚拟机迁移到另一台宿主（用于资源分配）。一些虚拟化供应商提供保持不同宿主之间快照同步的功能。现在，宿主之间的迁移成为一个快速操作，有效地提供了一种让虚拟机持续运作而不中断的方法，例如当其中一台宿主发生故障时。\n\
  - **故障转移**\n\n扩展前述的迁移机制，故障转移允许 VM 在其运行的宿主发生故障时继续操作。通常，当迁移因某种原因停止工作（宿主无响应）时，会发生故障转移。通过故障转移，VM\
  \ 从备份宿主上最后已知的同步状态继续操作。\n\n接下来，让我们讨论一下实施虚拟化环境的一些安全考虑事项。\n\n\n\n\n\n## 虚拟环境的安全注意事项\n\
  \n能力越大，责任越大。这一点在虚拟化技术中尤为适用。如果落入不当之人手中，虚拟环境的管理门户可能会带来毁灭性的后果。一旦该路径受到威胁，混乱发生的可能性将无穷无尽。在搭建工业虚拟化环境时，需要牢记以下几点注意事项：\n\
  \n-   将管理接口完全保留在 IDMZ 的工业侧。\n-   无论如何，ICS 虚拟平台的管理接口都不得直接暴露在企业侧。在工业网络的专用子网上创建一个专用系统（参见后续章节\
  \ *ICS 环境与架构管理*），并且仅允许选定的用户访问该系统（更多细节参见*第 3 章《工业非军事区》*）。\n-   保持虚拟基础设施的更新，但不要将环境暴露在互联网上。这意味着应将虚拟基础设施置于隔离网络中，仅通过离线方式进行更新和修补。\n\
  -   定期使用离线补丁对虚拟化技术进行修补和更新。将虚拟基础设施服务器直接连接到互联网所带来的明显风险，根本不值得用便利性去交换。\n-   按照需求可知和最小权限标准创建角色并分配权限，同时遵循所用虚拟化厂商的最佳实践建议。\n\
  -   实施安全、性能和健康监控，以便我们能够时刻关注各项动态。\n-   这将成为本书的座右铭，从*第 4 章《以安全思维设计 ICS 架构》*开始：确保有人关注日志并跟进问题。\n\
  \n## 共享物理资源\n\n虚拟化堆栈最初被纳入 IDMZ 构建，目的是虚拟化 Broker 服务。然而，许多客户也选择使用该设置来虚拟化其工业计算需求，例如虚拟化第\
  \ 3 级站点运营中的服务器。这涉及将虚拟化堆栈物理直接连接到工业核心交换机，并通过 VLAN 和专用虚拟交换机在逻辑上进行隔离。\n\n由于从同一硬件共享 IDMZ\
  \ 和工业系统的虚拟资源，将安全边界置于所选虚拟化平台的 Hypervisor 上，这取决于该 Hypervisor 的可靠程度，因此这要么是一个合理的风险与收益权衡，要么不是。例如，允许绕过\
  \ vSwitch 边界的 VMware Hypervisor 漏洞非常罕见：\n\n![](img/c8ffa9959721097701584fcc95101362_79_0.png)\n\
  \n现在的问题是，为了支持和维护这些额外的硬件和软件，是否需要单独拆分出一个额外的虚拟化堆栈，并承担相应的额外成本和资源？\n\n### ICS 环境与架构管理\n\
  \n本章的最后一个讨论点是关于如何管理 ICS 环境。架构中使用的每台设备都会有一些访问方式，用于管理、配置、监控、更新以及其他管理和维护目的。\n\n访问所有这些管理接口的推荐方法是通过工业网络专用子网上的专用系统进行。让我们来看看需要做什么：\n\
  \n-   在区域 OT 防火墙后面创建一个专用子网（VLAN），用于控制对该子网的访问。\n-   将一个专用（虚拟）管理服务器连接到该子网。\n-   仅允许选定的一群人从工业网络上的另一个资源（跳板机）访问此管理服务器。\n\
  -   使用最小权限和需求可知的最佳实践，为管理员和支持用户精简并过滤权限。\n-   不要在管理门户上配置默认网关设置，作为保护管理子网外部通信的额外一层措施。\n\
  -   记录并监控管理网络上发生的所有事情，并安排人员定期查看日志。\n\n### 总结\n\n在本章中，我们回顾了 ICS 架构，并对某些领域和主题进行了深入探讨。这帮助我们指出了与第一版相比的变化，或者为本书后续提供的讨论奠定了基础。\n\
  \n到目前为止，您应该已经对典型的 ICS 架构应该是什么样子，以及应该包含哪些内容有了扎实的理解。我们将在后续章节中扩展某些领域，主要是为了指出该架构如何在安全监控实践中使用。\n\
  \n不过，首先，在下一章中，我们将重新探讨工业非军事区，简称 IDMZ。\n"
- "## 3\n# 工业非军事区\n\n在上一章中，我们讨论了工业控制系统（ICS）网络架构的高层概述。在该高层讨论中，我们提到了工业非军事区（IDMZ）的概念。在本章中，我们将深入探讨\
  \ IDMZ。我们将会介绍用于创建 IDMZ 的总体设计、概念和技术，并探讨自本书第一版首次讨论 IDMZ 以来发生变化的内容。\n\n在本章中，我们将涵盖以下主题：\n\
  \n- IDMZ\n- IDMZ 设计的组成要素\n\n### IDMZ\n\nIDMZ 也被称为外围网络，是 ICS 网络架构中的一个缓冲区，用于强制执行数据共享安全性，并允许对可信网络（工业区）和不可信网络（企业区）之间的交互进行细粒度控制。IDMZ\
  \ 在深度防御（DiD）模型中增加了一个额外的层级，用于在两个（或更多）安全区域之间安全地共享 ICS 相关数据和网络服务。\n\n## 基本概念\n\n从根本上说，IDMZ\
  \ 的主要功能是在企业系统、服务和用户与工业生产及自动化系统、应用程序和设备之间建立物理隔离。理想情况下，应该实现两者之间的完全隔离，但在当今的 ICS 环境中，业务系统高度依赖生产系统的最新实时数据，反之亦然，因此很难做到完全隔离。\n\
  \n设计得当的 IDMZ 将通过将交互转移到企业网络上，来限制或防止与 ICS 设备的直接交互，从而最大限度地减少工业环境的攻击面，同时通过定义明确、严格控制、监控到位且安全防护完善的\
  \ Broker 服务（位于 IDMZ 中），实现企业与工业区之间的安全交互和数据共享。促进跨区域交互的 Broker 服务示例包括：\n\n-   使用应用程序镜像，例如用于数据历史库的**结构化查询语言（SQL）**复制，或用于时间同步的**网络时间协议（NTP）**\n\
  -   使用微软的**远程桌面协议网关（RDP-GW）**服务进行远程交互会话\n-   使用正向或反向代理服务器，用于 Web 流量和**统一资源定位符（URL）**过滤\n\
  -   使用存储转发服务器，例如**Windows 服务器更新服务（WSUS）**以及防病毒暂存和报告服务器\n-   使用复制服务器来复制数据和/或文件，例如安全文件传输解决方案（如\
  \ SolarWinds Serv-U）\n\n## IDMZ 设计流程\n\nIDMZ 的设计应遵循以下六项主要设计原则和注意事项，这些原则摘自 *Rockwell\
  \ Automation/Cisco  Converged Plantwide Ethernet (CPwE) 设计与实施指南*（https://literature.rockwellautomation.com/idc/groups/literature/documents/td/enet-td001_-en-p.pdf）：\n\
  \n- *来自 IDMZ 任一侧的所有通信请求（网络连接）都应终止于 IDMZ 内。换言之，没有任何网络流量直接穿过 IDMZ。*\n- ICS 自动化和控制协议网络流量（Modbus、Profinet、EtherNet/IP\
  \ 等）不得进入或穿越 IDMZ。此类网络流量应保持在 *工业区* 内部。\n\n\n\n\n\n-   *主要服务并非永久存储在 IDMZ 中。换言之，ICS\
  \ 所依赖的任何服务或服务均不得托管在 IDMZ 中。*\n-   *所有数据均为临时数据。这意味着 IDMZ 不会永久存储数据。*\n-   *IDMZ 内的代理服务应放置在\
  \ IDMZ 代理服务网络区域的专用、隔离子网（VLAN）中。*\n-   *设计得当的 IDMZ 应具备这样的能力：一旦受到威胁，可以将其断开连接，同时仍能维持生产运行，即使产能有所降低。*\n\
  \n考虑到这些因素，IDMZ 设计流程应首先决定 ICS 相关系统在企业区和工业区的布局。这里的经验法则是：如果某个系统/设备/功能/应用程序并非以某种形式运行生产过程所绝对必需，那么该\
  \ 系统/设备/功能/应用程序 应位于 ICS 环境的企业侧。\n\n> **重要说明**\n>\n> 工程/维护笔记本电脑或工作站**应该**是企业（业务）资产！这样，该设备更容易保持最新状态，并且在笔记本电脑或工作站与工业环境之间有多重检查、边界和控制措施，以防止设备受损。将非必要系统和设备从工业网络中移除并放置到企业网络中，可以显著缩小攻击面。用户与工业系统之间的必要交互（我们不是在讨论操作员**人机界面（HMI）**）则可以被严格控制和监控。以这种方式，即使企业网络中的某个系统被攻破，也能在被感染系统与工业网络之间形成一道屏障（IDMZ\
  \ 即屏障）。允许非必要系统（和用户）直接连接到工业网络无异于自找麻烦。只需某个用户插入一个受感染的**通用串行总线（USB）**密钥，或让自己的笔记本电脑感染病毒，就可能使整个工业网络瘫痪。\n\
  >\n> 我们将在后续章节讨论如何在企业区和工业区之间促进维护、故障排除和开发活动。\n\n在确定 ICS 资产在企业网络和工业网络中的布局之后，设计流程的下一步是定义用于促进两个区域之间数据共享和交互的代理服务。这一过程取决于\
  \ ICS 的需求以及 ICS 资产布局的决策，但归根结底是定义两个区域之间的交互需求（“我们需要远程访问……”；“我们希望查看……的设备统计信息”；“我们希望能够更新\
  \ Windows 服务器和工作站”；等等）。对于每项需求，通常都有我们可以实施的代理服务。有些解决方案可能不是直接显而易见的，但总会有一个。在我定义 IDMZ\
  \ 代理服务的 10 年经验中，我从未遇到过无法通过某种代理服务解决的情况。\n\n例如，请考虑以下设计陷阱。\n\n## 设计陷阱 – 使用蜂窝连接实现支持云功能的自动化设备\n\
  \n这个陷阱围绕当今的热门话题——具有电话回家功能的工业智能设备（有些人称之为**工业物联网**，或 **IIoT**）或需要与托管在互联网上的应用程序同步的支持云功能的设备。\n\
  \n许多此类设备的供应商会试图让您安装支持**全球移动通信系统（GSM）**或 3G/4G 的集线器/路由器，以便他们能够通过蜂窝连接解决连接问题。这是一个糟糕的主意。不仅您现在要依赖该供应商尽职尽责地保护进入\
  \ ICS 环境的后门连接，而且该连接从您的角度来看也完全不可见，这意味着所用的**互联网协议（IP）**地址不在您组织的子网范围内，因此不会成为任何（**信息技术**（**IT**））漏洞和风险评估流程或类似合理性检查的一部分。\n\
  \n如果您想了解这些蜂窝连接为 ICS 环境带来的风险，请考虑以下 Shodan 搜索（`https://www.shodan.io/search?query=rockwell`）：\n\
