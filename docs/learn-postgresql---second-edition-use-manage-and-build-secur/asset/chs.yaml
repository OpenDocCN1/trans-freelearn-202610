  \n## 14\n\n## 日志记录与审计\n\nPostgreSQL 提供了非常丰富的日志记录基础设施。能够检查日志是每个数据库管理员的关键技能——日志提供了有关集群做了什么、正在做什么以及过去发生了什么的线索和信息。本章将解释\
  \ PostgreSQL 日志配置的基础知识，为你提供如何配置日志机制以获取有关集群活动所需信息的说明。日志可以手动分析，但数据库管理员通常也会利用自动化工具来更广泛地洞察集群活动。与日志记录相关的是审计主题，即跟踪谁对哪些数据做了什么。审计通常是由政府法规强制执行的，而非数据库管理员的需求。然而，一个良好的审计系统也可以帮助管理员识别数据库中发生了什么。\n\
  \n在本章中，你将学习以下主题：\n\n- 日志记录简介\n- 使用 pgBadger 从日志中提取信息\n- 实现审计\n\n### 技术要求\n\n你需要了解以下内容：\n\
  \n- 如何管理 PostgreSQL 配置\n- 如何启动、重启和监控 PostgreSQL 并与 PGDATA 文件交互\n\n本章示例可以在 chapter_14\
  \ Docker 镜像上运行，你可以在本书的 GitHub 仓库中找到它：https://github.com/PacktPublishing/Learn-PostgreSQL-Second-Edition。有关本书提供的\
  \ Docker 镜像的安装和使用说明，请参阅 *第 1 章，PostgreSQL 简介*。\n\n## 日志记录简介\n\n像许多其他服务和数据库一样，PostgreSQL\
  \ 提供了自己的日志记录基础设施，以便管理员始终可以检查守护进程正在做什么以及数据库系统的当前状态。虽然日志对于数据和数据库活动并非至关重要，但它们代表了整个系统中发生了什么或正在发生的重要知识，并提供了管理员可以据此采取行动的重要线索。\n\
  \nPostgreSQL 拥有非常灵活且可配置的日志基础设施，允许不同的日志配置、轮转、归档和后分析。\n\n日志以文本形式存储，因此可以使用常见的日志分析工具轻松分析，包括\
  \ grep(1)、sed(1) 等操作系统实用程序和文本编辑器。\n\n> 本章中使用的“日志”一词仅指系统的文本日志，而不指 **预写日志 (WALs)**，后者在数据库生命周期中至关重要（参见\
  \ *第 11 章，事务、MVCC、WALs 和检查点*）。\n\n在默认安装中，日志包含在 PGDATA 目录的一个特定子文件夹中，但正如你在以下小节中看到的，你可以自由地将日志移动到操作系统存储中的几乎任何位置。\n\
  \n数据库中发生的每个事件都在日志中以单独的一行文本记录下来，这在你想使用行导向工具（如常见的 Unix 命令，例如 grep(1)）分析日志时是一个重要且有用的方面。当然，将大量信息写入日志也有缺点；它需要系统资源并可能填满日志所在的存储空间。因此，重要的是根据集群的目标管理日志基础设施，因此只记录可用于后分析的最小信息量。\n\
  \n> 如果你没有适当配置日志，日志会迅速填满你的磁盘存储空间，因此你应确保集群不会产生超出系统处理能力的日志。\n\n遵循常见的 Unix 哲学，PostgreSQL\
  \ 允许你将日志发送到名为 syslog 的外部组件。想法是，在你的基础设施中可能存在一个组件或机器，负责收集来自所有可用服务（包括数据库、Web 服务器、应用服务器等）的日志。因此，你可以将\
  \ PostgreSQL 日志重定向到同一个公共 syslog 设施，并将集群日志收集在你已为其他服务所做的相同位置。然而，这并不总是好的选择，正是出于这个原因，PostgreSQL\
  \ 提供了自己的组件，名为日志收集器，来存储日志。\n\n事实上，在重负载下，syslog 集中式收集器可能会开始丢弃（因此丢失）日志条目，而 PostgreSQL\
  \ 日志收集器专门设计为不会丢失任何日志信息。因此，随 PostgreSQL 提供的日志收集器通常是跟踪日志的首选方式，这样你就可以确信一旦开始分析日志，你拥有集群产生的所有信息，没有任何遗漏。\n\
  \nPostgreSQL 日志记录通过主集群配置中的可调参数进行配置，即 postgresql.conf 文件。在以下小节中，你将了解 PostgreSQL 日志配置，并将看到如何调整自己的日志以满足你的需求。\n\
  \n## 日志记录位置\n\n配置日志系统的第一步是决定在哪里以及如何存储文本日志。控制日志系统的<|message|>\n\n\n日志轮转很有用，因为它允许你生成更小的日志文件，这些文件可以限定在特定的时间段内。一方面，这会将日志分散到多个（可能很小）的文件中；另一方面，它不会产生一个单一的（可能巨大的）日志文件，而这可能导致分析问题。\n\
  \n一旦你启用了日志收集器，就必须对其进行配置，以便它按照你想要的方式和位置存储日志。实际上，你可以使用以下参数来配置日志收集器进程，只需在 PostgreSQL\
  \ 配置文件中为以下任一设置放置正确的值即可：\n\n- log_directory：这是必须存储各个日志文件的目录。它可以是相对于 PGDATA 的相对路径，也可以是绝对路径（进程必须能够写入该路径）。显然，它必须是运行集群的操作系统用户具有写访问权限的路径。\n\
  - log_filename：这是指定每个日志文件（位于 log_directory 内）名称的单个文件名或模式。模式可以按照 strftime(3) 指定，以便使用日期和时间进行格式化。例如，值\
  \ postgresql-%Y-%m-%d.log 将生成带有日期（分别为年、月、日）的日志文件名，例如 postgresql-2022-07-19.log。\n\
  - log_rotation_age：这表示日志在应用自动日志轮转之前应等待的时间。例如，1d 表示 1 天，并指定日志将每天轮转一次。\n- log_rotation_size：这指定日志文件在轮转到新文件之前的大小。例如，50MB\
  \ 表示日志文件在达到 50 MB 大小时将被轮转。\n- log_truncate_on_rotation：此布尔参数决定 PostgreSQL 在轮转时是否必须截断（即清空并重新开始）现有文件，或改为将新日志数据追加到现有文件。\n\
  \n请注意，日志轮转并不精确：日志文件可能会略微超过轮转大小或年龄，具体取决于集群的日志活动。\n\n所有与轮转相关的设置都需要 logging_collector\
  \ 打开：毕竟，只有 PostgreSQL 负责日志记录时，它才能管理轮转。\n\n`postgresql.conf` 文件中的示例日志配置可能如下所示：\n\n\
  ```conf\nlogging_collector  = on\nlog_destination    = 'stderr,csvlog,jsonlog'\n\
  log_directory      = 'log'\nlog_filename       = 'postgresql-%Y-%m-%d.log'\nlog_rotation_age\
  \   = '1d'\nlog_rotation_size  = '50MB'\n```\n\n使用上述设置，集群将在 log 目录（相对于 PGDATA）内为每天（或\
  \ 50 MB 的信息）生成一个新的日志文件，使用日志收集器，并且每个日志文件都将标明其创建的年、月、日。请注意，作为示例，系统将同时以文本、JSON 和 CSV\
  \ 格式生成日志；PostgreSQL 会智能地将后两种格式的日志文件名扩展名分别更改为 `.json` 和 `.csv`。\n\n使用上述日志配置（也在本章的\
  \ Docker 镜像中使用），检查日志目录将产生类似于以下内容的输出：\n\n```sh\n$ ls -1 /postgres/16/data/log\npostgresql-2023-07-19.csv\n\
  postgresql-2023-07-19.json\npostgresql-2023-07-19.log\n...\n```\n\n`.log` 文件是纯文本格式的文件，而另外两个文件具有\
  \ CSV 和 JSON 格式的条目。\n\n## 何时记录日志\n\n决定何时在日志中报告事件非常重要。有很多选项可以控制日志操作的触发方式，通过阈值指定。日志阈值可以采用助记值，表示日志事件将被插入日志的最小值。\n\
  \n最常见的值按顺序为 info、notice、warning、error、log、fatal 和 panic，其中 info 为最小值，fatal 为最高值。\n\
  \n例如，如果你决定 warning 是你想要接受的最小阈值，则每个具有更低阈值的日志事件（例如 info 和 notice）都不会被插入到日志中。\n\n正如你所见，阈值随着向\
  \ error 值（如 fatal 和 panic）移动而增加，这些值始终会自动记录，因为它们代表不可恢复的问题。还有最低级别的 debug1 到 debug5，用于获取开发信息和有关进程执行的内部细节（即，它们通常在用\
  \ PostgreSQL 开发时使用）。\n\n因此，集群将在不同时间产生不同日志事件，并且所有事件都具有不同的优先级，而这些事件将根据你配置的阈值插入到日志中。\n\
  \n特别是，有两个参数可用于调整日志阈值：`log_min_messages` 和 `client_min_messages`。\n\n前者 `log_min_messages`\
  \ 决定日志系统的阈值，而后者决定每个新用户连接的阈值。它们有何不同？\n\n`log_min_messages` 指定集群必须插入到日志中的内容，而不考虑传入的用户连接及其设置。`client_min_messages`\
  \ 决定客户端在连接期间必须向用户报告哪些日志事件。这两个设置都可以采用上述阈值列表中的值。\n\n开发或测试环境的一个典型用例可能是以下内容：\n\n```text\n\
  log_min_messages    = 'info'\nclient_min_messages = 'debug1'\n```\n\n使用上述配置，集群将在文本日志中仅记录\
  \ info 消息，这与进程的正常执行有关，而传入的用户连接将向用户报告更详细的开发等消息。\n\n设置阈值并不是决定何时触发日志插入的唯一方法：还有另外几个设置可用于处理语句和实用程序的持续时间。\n\
  \n如果你有兴趣记录客户端执行的语句（即查询），则有以下日志参数可供调整：\n\n- `log_min_duration_statement` 包含一个整数值，表示毫秒数。每个耗时超过设定值的语句都将被记录。因此，将此值设置为\
  \ 0 意味着系统中发生的每个语句都将被转储到日志中。\n- `log_min_duration_sample` 和 `log_statement_sample_rate`\
  \ 是协同工作的参数。`log_min_duration_sample` 处理毫秒数，并仅记录运行时间远长于毫秒值语句的样本。换句话说，它的工作方式与 `log_min_duration_statement`\
  \ 类似，但不是记录每个语句，而是仅记录其中一部分。要记录的语句比例由 `log_statement_sample_rate` 决定，后者处理 0 到 1 之间的值。\n\
  - `log_transaction_sample_rate` 是 0 到 1 之间的值，表示有多少事务将被完全记录（即事务的每个语句都将出现在日志中），而不考虑语句持续时间。\n\
  \n样本参数背后的想法是减少日志活动（和大小）的数量，同时仍提供有关集群中发生情况的有用见解。\n\n为了更好地理解上述参数，请考虑以下配置：\n\n```\n\
  log_min_duration_statement = 500\nlog_min_duration_sample = 100\nlog_statement_sample_rate\
  \ = 0.8\nlog_transaction_sample_rate = 0.5\n```\n\n上述配置将记录运行时间超过 500 毫秒的每个语句（`log_min_duration_statement`）以及运行时间超过\
  \ 100 毫秒的每个语句中的 80%（`log_min_duration_sample` 和 `log_statement_sample_rate`）。最后，它将记录每两个事务中的一个事务（`log_transaction_sample_rate`）。\n\
  \n你可以使用以下简单工作负载进行测试：\n\n```\nforumdb=> BEGIN;\nBEGIN\nforumdb=> SELECT 'transaction\
  \ 1';\n ?column?\n-------------\n transaction 1\n(1 row)\nforumdb=> ROLLBACK;\n\
  ROLLBACK\nforumdb=> BEGIN;\n```\n\n\n\n\n```\nBEGIN\nforumdb=> SELECT 'transaction\
  \ 2';\n    ?column?\n-------------\n transaction 2\n(1 row)\n\nforumdb=> ROLLBACK;\n\
  ROLLBACK\nforumdb=> SELECT pg_sleep( 2 );\n pg_sleep\n---------\n\n(1 row)\nforumdb=>\
  \ BEGIN;\nBEGIN\nforumdb=> SELECT pg_sleep( 0.120 );  --repeat 10 times\n pg_sleep\n\
  ---------\n\n(1 row)\nforumdb=> ROLLBACK;\nROLLBACK\n```\n\n在日志中，你会发现类似如下的内容：\n\n\
  ```\nLOG:  duration: 0.047 ms  statement: BEGIN;\nLOG:  duration: 0.253 ms  statement:\
  \ SELECT 'transaction 2';\nLOG:  duration: 0.068 ms  statement: ROLLBACK;\nLOG:\
  \  duration: 2003.742 ms  statement: SELECT pg_sleep( 2 );\nLOG:  duration: 121.593\
  \ ms  statement: SELECT pg_sleep( 0.120 );\nLOG:  duration: 121.464 ms  statement:\
  \ SELECT pg_sleep( 0.120 );\nLOG:  duration: 120.459 ms  statement: SELECT pg_sleep(\
  \ 0.120 );\nLOG:  duration: 121.448 ms  statement: SELECT pg_sleep( 0.120 );\nLOG:\
  \  duration: 121.455 ms  statement: SELECT pg_sleep( 0.120 );\nLOG:  duration: 121.416\
  \ ms  statement: SELECT pg_sleep( 0.120 );\n```\n\n根据 `log_transaction_sample_rate`\
  \ 参数，只有两个事务中的一个被记录下来。还要注意 `pg_sleep(2)` 被插入是因为它花费的时间超过了 500 毫秒（`log_min_duration_statement`），以及对\
  \ `pg_sleep(0.120)` 的 10 次调用中有 6 次被插入，因为 `log_transaction_sample_rate` 设置为 0.8（即\
  \ 80% 的运行事务）。你可以注意到 `log_transaction_sample_rate` 并不是一个精确的值：即使配置告诉 PostgreSQL 记录\
  \ 80% 的查询，系统记录的却更少（60%）。\n\n## 要记录的内容\n\n要记录的信息质量由一组丰富的参数配置，通常是布尔值，用于打开或关闭特定事件的记录。\n\
  \n一个被广泛使用且被滥用的设置是 `log_statement`：如果打开，它将记录来自每个连接对集群执行的所有语句。这可能非常有用，因为它允许你重建数据库的确切操作以及使用的语句，但另一方面，它也可能非常危险。记录每个语句可能会使私有或敏感数据出现在日志中，而日志因此可能被未经授权的人获取。此外，记录所有语句可能会迅速填满日志存储，特别是在集群处于高负载和高并发的情况下。\n\
  \n![](img/bbe5644feba3d6a2ab994dc7e6cecbf1_544_0.png)\n\n> 通常，配置 `log_min_duration_statement`\
  \ 设置来仅记录“慢”语句，比记录所有语句更有用。\n\n可以通过 `log_statement` 来微调要记录的语句类别：该设置可以取 off、ddl、mod\
  \ 或 all 的值。off 和 all 的含义很容易理解，但 ddl 意味着所有数据定义语言语句（例如 CREATE TABLE、ALTER TABLE 等）都会被记录，而\
  \ mod 意味着所有数据操作语句（例如 INSERT、UPDATE 和 DELETE）都会被记录。日志类别各自是前一个的超集，因此 mod 也包括 ddl，而\
  \ all 包括前者并允许记录 SELECT 类型语句。值得注意的是，如果语句包含语法错误，无论设置如何，都不会通过 `log_statement` 记录。\n\
  \n日志中的信息质量也由 `log_line_prefix` 参数确定。`log_line_prefix` 是一个模式字符串，用于定义在每条日志行开头插入的内容，因此可用于详细说明所记录的事件。该模式与\
  \ `sprintf(3)` 相同的方式使用一些占位符，在本书的范围内记录每个选项是不合适的。\n\n- log_lock_waits：此布尔参数表示每次用户会话等待获取锁的时间过长时都应创建日志条目。阈值是配置参数\
  \ deadlock_timeout。\n\n现在我们已经了解了所有关于日志记录的内容，接下来我们将使用一个名为 pgBadger 的特殊工具，从创建的日志中提取信息。\n\
  \n## 从日志中提取信息 — pgBadger\n\n由于日志中可以包含丰富的各种信息，因此可以自动化日志信息分析和提取。有多个工具旨在实现此目的，其中最受欢迎和最完整的是\
  \ pgBadger。\n\npgBadger 是一个自包含的 Perl 5 应用程序，它仔细读取并从 PostgreSQL 日志中提取信息，生成一个包含其在日志中发现的所有信息的汇总的\
  \ Web 仪表板。该应用程序的目标是为你提供更有用的日志洞察，而无需手动搜索特定信息。\n\n使用 pgBadger 并非强制；你的集群在没有它也能正常工作，你仍然能够在日志中查找信息和问题。然而，使用\
  \ pgBadger 可以为你提供有关服务器所做操作的更有用提示。\n\n需要注意的是，使用 pgBadger 以及进行任何自动或手动日志分析，都不会提供实时信息，而只是对服务器过去活动的回顾。\n\
  \n在以下小节中，你将学习如何安装和使用 pgBadger。\n\n## 安装 pgBadger\n\npgBadger 需要在运行的系统上安装 Perl 5，这是它唯一的依赖项。你可以在\
  \ PostgreSQL 集群运行的同一主机上运行 pgBadger，也可以在远程系统上运行（将在后面的小节中展示）。在本节中，我们假设 pgBadger 将安装并在与\
  \ PostgreSQL 集群相同的机器上执行。\n\n安装 pgBadger 最简单的方法是通过操作系统的包管理器，例如在 GNU/Debian 和基于 Ubuntu\
  \ 的系统上如下：\n\n```shell\n$ sudo apt install pgbadger\n```\n\n也可以通过以下步骤从源码安装 pgBadger：\n\
  \n```shell\n$ wget https://github.com/darold/pgbadger/archive/v12.0.tar.gz\n$ tar\
  \ xzvf v12.0.tar.gz\n$ cd pgbadger-12.0\n$ perl Makefile.PL\n$ make\n$ sudo make\
  \ install\n```\n\n安装 pgBadger 后，你可以通过输入以下命令测试它是否正常工作：\n\n```shell\n$ pgbadger --version\n\
  pgBadger version 12.0\n```\n\n![](img/bbe5644feba3d6a2ab994dc7e6cecbf1_547_0.png)\n\
  \n## 为 pgBadger 使用配置 PostgreSQL 日志记录\n\npgBadger 足够智能，可以在许多情况下理解 PostgreSQL 日志，但在某些情况下，你需要指定一些配置选项，以便\
  \ PostgreSQL 生成更易于理解的日志。\n\n首先，pgBadger 需要访问 PostgreSQL 日志，这意味着你应该使用 `logging_collector`\
  \ 来生成日志。如果你更改 `log_line_prefix`，你应该将相同的配置设置传递给 pgBadger，以便它能够正确解析日志前缀。最后，你应该启用尽可能多的日志上下文。\n\
  \n以下是使 PostgreSQL 生成 pgBadger 能够正确理解的日志的配置参数示例：\n\n```conf\nlogging_collector  =\
  \ on\nlog_destination   = 'stderr,csvlog,jsonlog'\nlog_directory     = 'log'\nlog_filename\
  \      = 'postgresql-%Y-%m-%d.log'\nlog_rotation_age  = '1d'\nlog_rotation_size\
  \ = '50MB'\n```\n\n现在是第一次启动 pgBadger 的时候：\n\n```\n$ pgbadger -o /data/html/first_report.html\
  \ \\\n    /postgres/16/data/log/postgresql-2023-07-19.log\n[====================>]\
  \ Parsed 261891612 bytes of 261891612 (100.00%),\nqueries: 1428472, events: 27\n\
  LOG: Ok, generating html report...\n```\n\n第一个参数 -o 指定我们希望存储报告的文件名。pgBadger 每次运行只生成一个文件，因此如果你想生成另一份报告而不覆盖现有报告，需要更改文件名。\n\
  \n第二个参数是要分析的 PostgreSQL 日志文件；你也可以指定 JSON 或 CSV 文件，pgBadger 会相应地解析它们。\n\n程序运行几秒钟，或根据日志文件大小运行几分钟，并报告它在日志文件中找到的一些统计信息（在此示例中为\
  \ 140 万条语句）。你可以很容易地检查生成的报告文件：\n\n> 如果你要分析大日志文件或多个文件，可以使用 pgBadger 的并行模式，使用 -j 选项后跟要启动的并行进程数。例如，传递\
  \ -j 4 意味着每个日志文件将被分成四部分，每部分由一个单独的进程分析。得益于并行性，你可以利用机器的所有核心，更快地获得大量日志的结果。\n\n```\n\
  $ ls -l -s /data/html/first_report.html\n1172 /data/html/first_report.html\n```\n\
  \n\n\n\n\n无论你的集群有多活跃，生成的 pgBadger 文件有多大，一旦你有了报告，你就可以将网页浏览器指向本地文件（或通过 Web 服务器提供结果）。你将看到如下所示的报告。报告提供了集群活动的概览，包括语句的数量、为这些语句提供服务所花费的时间，以及显示特定时间段内语句流量的图表：\n\
  \n![](img/bbe5644feba3d6a2ab994dc7e6cecbf1_550_0.png)\n\n图 14.1：pgBadger 仪表板的初始页面\n\
  \n如果你使用本章的 Docker 镜像，可以将网页浏览器指向 URL http://localhost:8080/first_report.html，你将能够看到报告。\n\
  \n在网页顶部，有一个菜单栏，其中包含多个菜单，允许你查看不同的图表和仪表板。\n\n例如，**Connections** 菜单允许你获取有关并发连接数量的信息，如此处示例所示：\n\
  \n图 14.2：Connections 仪表板的示例\n\npgBadger 还在同一页面上显示更详细的版本，如下图所示：\n\n| Rank | Times\
  \ executed | Total duration | Min duration | Max duration | Avg duration | Query\
  \ |\n|------|-----------------|----------------|--------------|--------------|--------------|-------|\n\
  | 1 | 294 Details | 4m56s | 949ms | 3s199ms | 1s7ms | SELECT count(*) FROM posts;\
  \ Examples User(s) involved App(s) involved |\n| 2 | 294 Details | 169ms | 0ms |\
  \ 5ms | 0ms | SELECT count(*) FROM tags; Examples User(s) involved App(s) involved\
  \ |\n| 3 | 73 Details | 83ms | 0ms | 3ms | 1ms | ROLLBACK; Examples User(s) involved\
  \ App(s) involved |\n| 4 | 73 Details | 2ms | 0ms | 0ms | 0ms | BEGIN; Examples\
  \ User(s) involved App(s) involved |\n| 5 | 67 Details | 357ms | 3ms | 16ms | 5ms\
  \ | TRUNCATE posts CASCADE; Examples User(s) involved App(s) involved |\n\n图 14.5：关于耗时最多的查询的详细信息\n\
  \n讨论 pgBadger 的所有功能和仪表板超出了本书的范围，但请参阅官方文档以获取更多详细信息以及每个选项清晰准确的解释。\n\n## Scheduling\
  \ pgBadger\n\npgBadger 可以以计划的方式使用，以便在指定的时间段内持续生成准确的报告。这是因为 pgBadger 包含增量功能，使用该功能报告不会每次都被覆盖；相反，程序可以生成按小时的报告和按周的汇总报告。\n\
  \n这很方便，因为你可以例如使用 cron(1) 安排 pgBadger 执行，然后就不用再管它了。让我们先看看 pgBadger 如何以增量模式运行：\n\n\
  ```\n$ pgBadger -I --outdir /data/html -f stderr  /postgres/16/data/log/\npostgresql-2023-*.log\n\
  [=====================>] Parsed 22008130 bytes of 22008130 (100.00%),\nqueries:\
  \ 120569, events: 1\nLOG: Ok, generating HTML daily report into /data/html/2023/07/19/...\n\
  LOG: Ok, generating HTML weekly report into /data/html/2023/week-30/...\nLOG: Ok,\
  \ generating global index to access incremental reports...\n```\n\n-I 参数指定增量模式，因此\
  \ pgBadger 将为按小时和按周的报告生成单独的文件。请注意，输出文件不是通过指定输出文件来指定的，而是使用 --outdir 选项指定放置文件的目录。-f\
  \ 选项告诉 pgBadger 它正在管理哪种日志；在本例中，普通文本文件。最后，和往常一样，有要分析的日志文件，以 shell glob 形式表示（postgresql-2023-*.log）。\n\
  \n最终结果，正如你从程序输出中猜到的那样，是生成了一个类似于以下内容的目录树：\n\n```\n$ ls -R /data/html/\n/data/html/:\n\
  2023  LAST_PARSED  index.html\n\n/data/html/2023:\n07  week-30\n\n/data/html/2023/07:\n\
  19\n\n/data/html/2023/07/19:\n2023-07-19-65.bin  index.html\n\n/data/html/2023/week-30:\n\
  index.html\n```\n\n主 index.html 文件是整个增量报告的入口点。然后有一个树，其中包含年份（2023）、月份（07）和日期（19）的目录，以及该日期的\
  \ index.html 文件。\n\n树中还有一部分收集当前周的数据；在本例中为第 30 周。随着更多日期的出现，树将因此而扩展。特殊的 LAST_PARSED\
  \ 文件由 pgBadger 用于记住它停止解析的时间，从而使其在下一次增量调用时可以从那里开始。\n\n如果你将网页浏览器指向主索引文件，你将看到如下屏幕截图中的日历，你可以在其中选择月份和日期以查看按日报告。\n\
  \n![](img/bbe5644feba3d6a2ab994dc7e6cecbf1_555_0.png)\n\n*图 14.6：pgBadger 在一段日期范围内的全局仪表板*\n\
  \n点击特定日期，你将被重定向到每日报告，其中显示了前面讨论过的完全相同的仪表板。显然，你无法点击尚未生成报告的日期或 PostgreSQL 日志中没有对应活动的日期。\n\
  \n得益于增量方法，你现在可以在自己的调度程序中安排执行；例如，在 cron(1) 中你可以插入如下行：\n\n```\n```sh\n59 23 * * *\
  \ pgbadger -I --outdir /data/html/ -f stderr /postgres/16/data/log/postgresql-'date\
  \ +'%Y-%m-%d'\".log\n```\n```\n\n这本质上与前一个命令行相同，只是当前日期会自动计算。上一行将在每天结束时生成当天的报告，并用它来填充你的报告树。\n\
  \n> > 上一个 crontab 条目只是一个示例。请考虑将所有内容包装在健壮的脚本中并测试其执行的正确性。\n\n```\n```text\n3 | PROGRAMMING\
  \ LANGUAGES | All about programming languages\n(1 row)\n```\n```\n\n这将以详细日志记录的方式显示以下内容：\n\
  \n```\n```text\nLOG:  duration: 19.011 ms  statement: PREPARE my_query( text ) AS\
  \ SELECT *\nFROM forum.categories WHERE title like $1;\nLOG:  duration: 6.539 ms\
  \  statement: EXECUTE my_query( 'PROGRAMMING%' );\n```\n```\n\n正如你所见，在日志中，你重建用户所做操作所需的一切，但这并不简单。你必须明白这两行彼此相关，并且执行语句的会话是相同的。这并不总是可能的——尤其是在你感兴趣的两行之间记录了其他查询时。\n\
  \n此外，可能日志不会报告你所需的所有信息——也许是因为你选择不记录执行速度快于阈值的语句。\n\n因此，虽然你可以使用日志执行审计，但这并不总是最佳选择。在本节中，你将了解\
  \ PgAudit 扩展，它是为了提供可靠且易于使用的审计基础设施而创建的。PgAudit 利用了出色的 PostgreSQL 日志记录功能；因此，你需要以适当的方式配置日志记录基础设施，正如你在下一小节中将看到的那样。\n\
  \n在深入 PgAudit 的配置和使用之前，有一些细节和概念需要解释。PgAudit 可以以两种不同的方式工作：按会话审计或按对象审计。前者是通过用户或应用程序对（整个）会话的一部分进行审计的快速简单方法；后者是对特定数据库对象相关操作进行日志记录的更复杂和更细粒度的方法（例如，谁从该表中删除了行？）。\n\
  \n按会话审计的工作方式很简单，即在会话中配置要审计的语句类别。另一方面，按对象审计要求你配置各个数据库角色，根据其权限集将触发特定操作的审计。在以下小节中，你将看到这两种方式都被用于审计。\n\
  \n## Installing PgAudit\n\n安装 PgAudit 的最快方法是使用操作系统包管理器。例如，在 GNU/Debian 或 Ubuntu\
  \ 系统上你可以输入：\n\n```\n```bash\n$ sudo apt install pgaudit-16-pgaudit\n```\n```\n\n\
  \n\n\n如果你需要从源码安装 PgAudit，首先需要获取一个与你自己的 PostgreSQL 集群兼容的版本，然后解压并安装：\n\n```\n$ wget\
  \ https://github.com/pgaudit/pgaudit/archive/refs/tags/1.7.0.tar.gz\n..\n$ tar xzvf\
  \ 1.7.0.tar.gz\n...\n$ cd pgaudit-1.7.0\n$ make USE_PGXS=1\n...\n$ sudo make USE_PGXS=1\
  \ install\n```\n\n扩展安装完成后，你需要配置 PostgreSQL 以使用 PgAudit。\n\n## 配置 PostgreSQL 以利用\
  \ PgAudit\n\nPgAudit 是一个需要在服务器启动时加载的扩展，因此你必须修改主配置文件 postgresql.conf，以包含 pgaudit\
  \ 库，如下所示：\n\n```\nshared_preload_libraries = 'pgaudit'\n```\n\n> 如果你使用本章的 Docker\
  \ 镜像，PgAudit 已经为你安装好了！\n\n然后，重启你的集群以使更改生效：\n\n```\n$ pg_ctl -D /postgres/16/data\
  \ restart\n```\n\n由于 PgAudit 是一个扩展，你必须在要审计的数据库中启用它才能激活它。为简单起见，让我们在 forumdb 数据库中启用它（你需要以数据库超级用户身份连接）：\n\
  \n```\nforumdb=# CREATE EXTENSION pgaudit;\nCREATE EXTENSION\n```\n\n现在是时候决定何时以及如何应用审计了。\n\
  \n## 配置 PgAudit\n\nPgAudit 附带了一组丰富的配置参数，使你可以精确指定记录什么、何时记录、从审计中排除什么等等。所有配置参数都位于 pgaudit\
  \ 命名空间内，因此不会与现有的同名设置冲突。\n\n最重要的设置是 pgaudit.log，它定义了你想要审计的语句和操作。该参数可以取以下任一值：\n\n\
  - ALL：审计每一条语句\n- NONE：完全不审计\n- READ：仅审计 SELECT 和 COPY 语句\n- WRITE：审计所有修改数据的语句（INSERT、UPDATE\
  \ 和 COPY）\n- ROLE：审计角色更改或创建\n- DDL：审计所有数据定义语句，从而审计对数据库结构的任何更改\n- FUNCTION：审计所有代码执行，包括\
  \ DO 块\n- MISC：审计上述未明确分类的所有内容\n- MISC_SET：审计所有类似 SET 的命令\n\n你可以通过逗号分隔单个名称来同时指定多个设置，例如：\n\
  \n```\npgaudit.log = 'WRITE,FUNCTION';\n```\n\n此设置可用于审计所有数据更改和代码执行。\n\n另一个重要的配置参数是\
  \ pgaudit.log_level，它指定 PgAudit 用于使审计消息出现在日志中的日志级别。默认情况下，此设置采用 log 值，但你可以将其更改为除错误类阈值（如\
  \ ERROR、FATAL 和 PANIC）之外的任何其他日志阈值。\n\n为了在审计信息中包含更多细节，你可能希望启用 pgaudit.log_parameter\
  \ 来转储任何查询参数（稍后你会看到一个示例）。\n\n如果你打算按对象配置 PgAudit，你需要设置 pgaudit.role 参数，你将在本章后面看到。\n\
  \n## 按会话审计\n\n使用 PgAudit 的第一种方式（也是理解和尝试起来最简单的方式）是按会话审计。\n\n与其他配置设置一样，你也可以通过 SET\
  \ SQL 语句来设置 PgAudit 配置。这在将配置应用于整个集群之前进行测试非常有用。尝试在交互式会话中直接设置 pgaudit.log，并执行一些操作看看会发生什么。例如，假设我们想要审计对数据的任何更改：\n\
  \n```\nforumdb=# SET pgaudit.log TO 'write, ddl';\nSET\nforumdb=# SELECT count(*)\
  \ FROM forum.categories;\n count\n-------\n     3\n(1 row)\n\nforumdb=# INSERT INTO\
  \ forum.categories( description, title ) VALUES(\n 'Fake', 'A Malicious Category'\
  \ );\nINSERT 0 1\n\nforumdb=# SELECT count(*) FROM forum.categories;\n count\n-------\n\
  \     4\n(1 row)\n\nforumdb=# INSERT INTO forum.categories( description, title )\
  \ VALUES(\n 'Fake2', 'Another Malicious Category' );\nINSERT 0 1\n```\n\npgaudit.log\
  \ 参数只能由超级用户设置，因此如果你想在交互式会话中动态尝试，你需要以数据库管理员身份连接。当然，你也可以通过在 postgresql.conf 配置文件中设置该参数，在集群级别为所有用户设置此参数。\n\
  \n在日志中，PostgreSQL 将写入类似以下内容：\n\n有几个这样的日志行细节，但在我们检查字段之前，请注意没有关于两条 SELECT 语句的任何记录：由于我们要求\
  \ PgAudit 不审计 READ 查询，SELECT 语句已从审计中被丢弃。\n\n请注意，每条审计行都有一个相当不言自明的前缀 AUDIT，这使得很容易理解该日志行是由\
  \ PgAudit 生成的，还是由 PostgreSQL 内部的其他事件生成的。\n\n每一行都指明审计类型——在前面的示例中是 SESSION——以及一个递增的计数器，用于指示语句被审计的时间顺序。然后是\
  \ PgAudit 识别的语句类别——在前面的示例中，两条都是 WRITE 事件——接着是已执行的完整语句。还有其他细节的空间，将在后续示例中讨论。\n\n让我们继续看另一个示例——考虑执行一个动态构建的查询，如下所示：\n\
  \n```\nforumdb=# DO $$ BEGIN\nEXECUTE 'TRUNCATE TABLE ' || 'forum.tags CASCADE';\n\
  END $$;\nNOTICE:  truncate cascades to table \"forum.j_posts_tags\"\nDO\n```\n\n\
  该语句不是直接执行 TRUNCATE TABLE tags，而是通过连接两个字符串构建而成。在日志中，PgAudit 会插入如下一行：\n\n```\nLOG:\
  \  AUDIT: SESSION,3,1,WRITE,TRUNCATE TABLE,,,TRUNCATE TABLE forum.tags CASCADE,<not\
  \ logged>\n```\n\n同样，该行报告审计模式（SESSION）、审计语句编号（3）、类别（WRITE）和语句（TRUNCATE TABLE），以及完整执行的语句。最后这个细节很重要：如果你在没有审计的情况下执行同一条语句，PostgreSQL\
  \ 日志将包含如下一行：\n\n```\nLOG:  duration: 12.616 ms  statement: DO $$ BEGIN\n    EXECUTE\
  \ 'TRUNCATE TABLE ' || 'forum.tags CASCADE';\n    END $$;\n```\n\n在这里，你可以看到日志盲目地复制了源语句，包括字符串拼接和换行符，使其难以阅读和搜索。\n\
  \n## 按角色审计\n\nPgAudit 的按角色审计机制允许你以非常细粒度的方式定义你感兴趣审计的事件。\n\n其思想是，你定义一个数据库角色，并向该角色授予与你要审计的操作相关的权限。一旦角色及其权限设置完毕，你通知\
  \ PgAudit 按该角色进行审计，这意味着 PgAudit 将在日志中报告与授予审计角色的操作相匹配的任何操作，而不管执行该操作的角色是谁。\n\n因此，第一步是创建一个仅用于指定要审计哪些操作的角色，因此它不会用作交互式会话的普通角色：\n\
  \n```\nforumdb=# CREATE ROLE auditor WITH NOLOGIN;\nCREATE ROLE\n```\n\n为了指定角色必须审计哪些操作，我们只需将这些操作授权给该角色。例如，假设我们要审计所有表上的所有\
  \ DELETE 操作，以及仅在 posts 和 categories 上的 INSERT 操作，我们必须向该角色授予以下权限集：\n\n```\nforumdb=#\
  \ GRANT DELETE ON ALL TABLES IN SCHEMA forum TO auditor;\nGRANT\nforumdb=# GRANT\
  \ INSERT ON forum.posts TO auditor;\nGRANT\nforumdb=# GRANT INSERT ON forum.categories\
  \ TO auditor;\nGRANT\n```\n\n一旦我们的审计角色配置正确，我们可以在修改配置文件 `postgresql.conf` 并设置 `pgaudit.role`\
  \ 可调参数后保存配置，如下所示：\n\n```conf\npgaudit.role = 'auditor'\n```\n\n如你所见，基于角色的审计比基于会话的审计灵活得多：后者只允许你指定要审计的操作类别，而前者允许你细粒度地定义究竟要审计哪些语句。\n\
  \n## 总结\n\nPostgreSQL 为日志记录提供了可靠且灵活的基础设施，允许数据库管理员监控集群在最近一段时间内所做的事情。得益于其灵活性，日志可以配置为允许外部工具进行集群分析访问，例如\
  \ pgBadger。此外，相同的日志记录基础设施还可用于执行审计，这是当地政府法律通常要求的一种内省。\n\n在本章中，你已经学习了如何配置 PostgreSQL\
  \ 日志系统以满足你的需求，如何通过 pgBadger 提供的 Web 仪表板监控你的集群，以及最后如何对你的用户和应用程序执行审计。\n\n在下一章中，你将学习如何备份你自己的集群。\n\
  \n## 验证你的知识\n\n- 日志记录和审计之间有什么区别？\n\n  日志记录是一种跟踪集群内发生的某些活动的方式，而不特别关注此类活动的“目标”。另一方面，审计是一种记录和跟踪特定目标上发生的特定活动的方式。例如，日志记录可以跟踪“每个慢查询”，而不考虑查询针对哪张表运行，而审计可以跟踪“对表\
  \ xyz 的每次修改”。更多细节请参阅*实施审计*一节。\n\n- 什么是 pgBadger？\n\n  pgBadger 是一个外部命令，可以检查 PostgreSQL\
  \ 文本日志并构建一个显示集群活动的仪表板。更多细节请参阅*从日志中提取信息 – pgBadger*一节。\n\n\n\n\n\n# 15\n\n# 备份与恢复\n\
  \n无论你的硬件和软件有多么坚固——迟早，你都需要回到过去来恢复意外删除或损坏的数据。这就是备份的目的——提供一个可以保存特定时间的安全副本，以便在数据丢失时进行恢复。作为企业级数据库集群，PostgreSQL\
  \ 提供了一套特定的工具，允许数据库管理员处理备份和恢复，本章将向你展示所有主要工具，以便确保你的数据能够在任何意外滥用中幸存。\n\n备份和恢复并不是一个非常复杂的主题，但在任何生产系统中都是基础性的，并且需要仔细规划。事实上，通过备份副本，你手头上就多了一份数据库的精确副本，以防出现不好的情况；这份额外副本会消耗资源，最明显的是存储空间。决定需要多少份额外副本、多久收集一次以及需要保存多久，这需要仔细关注，且超出了本章的范围。在本章中，我们将介绍执行备份的主要方式，无论是逻辑备份还是物理备份，以及\
  \ PostgreSQL 发行版提供的所有工具，以便你可以管理备份。\n\n在本章中，我们将涵盖以下主题：\n\n- 介绍各种类型的备份和恢复\n- 探索逻辑备份\n\
  - 探索物理备份\n\n## 技术要求\n\n要完成本章，你需要了解以下内容：\n\n- 如何与命令行工具交互\n- 如何检查你的文件系统和 PGDATA 目录\n\
  \n本章示例可以在 `chapter_15` Docker 镜像上运行，你可以在本书的 GitHub 仓库中找到它：https://github.com/PacktPublishing/Learn-PostgreSQL-Second-Edition。有关本书记载的\
  \ Docker 镜像的安装和使用说明，请参阅 *Chapter 1, Introduction to PostgreSQL* 中的说明。\n\n## 介绍备份和恢复的类型\n\
  \n主要适用于 PostgreSQL 的有两种备份类型：**逻辑备份**和**物理备份**（也称为热备份）。根据你选择的备份类型，恢复过程也会相应不同。\n\n\
  PostgreSQL 随附了执行经典逻辑备份所需的所有集成工具，在大多数情况下已足够。然而，PostgreSQL 可以轻松配置以支持物理备份，当集群规模变得巨大时，以及当你有特定需求时，这很有用，正如你将在本章后面发现的那样。\n\
  \n但这两种备份方法有什么区别呢？正如你所想象的，它们都实现了完全相同的目标：让你获得数据的可用“副本”以便在某处恢复。两种备份策略之间的区别在于从集群中提取数据的方式。\n\
  \n逻辑备份的工作方式类似于数据库客户端，它逐表请求数据库中的所有数据，并将结果存储在存储系统中。它就像一个应用程序打开一个事务并对每个表执行 SELECT，将获得的数据保存到磁盘。当然，其复杂程度远不止于此，但这个例子可以让你简单了解其内部原理。\n\
  \n这种备份之所以称为“逻辑”，是因为它作为专用客户端应用程序，与其他数据库连接和活动并行运行，并依赖数据库提供“逻辑上”一致的数据。事实上，备份是在数据库的快照中执行以保持数据一致性。\n\
  \n这种备份策略的优点是：（i）实现简单，因为 PostgreSQL 提供了执行完整备份所需的所有软件，（ii）它是一致的，（iii）可以相当容易地恢复。\n\n\
  然而，这种备份方法也有一些缺点：由于它与其他数据库活动并行执行，因此可能会减慢（或被减慢）其他活动以及其他并发事务。此外，它要求数据库在备份运行期间跟踪正在进行的备份过程，而不会在备份期间破坏快照。最后，产生的备份集在备份开始时是一致的；也就是说，如果备份需要很长时间才能完成，在此期间发生的数据更改可能不会出现在备份中（因为它必须保持一致）。\n\
  \n另一方面，物理备份对其他连接和事务的侵入性较小：备份需要对 PGDATA 内容进行文件级复制——主要是数据库文件（PGDATA/base）和从备份开始实例到备份结束的预写日志（WALs）。结果将是一个不一致的数据库副本，需要特别注意才能正确恢复。基本上，恢复过程就像数据库崩溃一样，并将重做所有事务（从\
  \ WALs 中提取）以达到一致状态。\n\n这种备份的设置要复杂得多，虽然你可以自行执行，正如你将在本章中看到的那样，已经出现了许多工具来帮助你更熟练、更可靠地执行这种备份。这种备份策略的主要优点是其侵入性较小——数据库不会注意到与备份相关的任何特定活动，除了执行文件级复制所需的存储\
  \ I/O 带宽。另一个重要的优点是，这种备份策略允许进行时间点恢复（PITR），这使数据库管理员能够将数据库恢复到自原始备份以来的任何实例。\n\n在设计备份策略时，还有另一个需要考虑的问题：逻辑备份应该始终有效，无论你运行的是哪个数据库版本（假设你已经运行的是最新版本），并且在一定程度上，无论目标数据库是否为\
  \ PostgreSQL。另一方面，物理备份仅在完全相同的 PostgreSQL 主版本实例和操作系统架构之间有效。\n\n在下一节中，你将学习如何执行这两种备份方法，以及如何恢复备份。我们将先从逻辑备份开始。\n\
  \n## 探索逻辑备份\n\nPostgreSQL 随附了执行逻辑备份和恢复所需的所有工具。许多操作系统，包括 FreeBSD 和 Debian GNU/Linux，为\
  \ PostgreSQL 备份和恢复工具提供了脚本和包装器，以帮助系统管理员安排备份和恢复。此处不会解释这些脚本和包装器。如需更多信息，请考虑阅读操作系统的 PostgreSQL\
  \ 包文档。\n\n有三个主要应用程序参与备份和恢复操作——pg_dump、pg_dumpall 和 pg_restore。正如其名称所示，pg_dump 和\
  \ pg_dumpall 与提取（转储）数据库内容相关，从而创建备份，而 pg_restore 是它们的对应工具，允许你恢复现有备份。\n\n> 需要注意的是，工具版本很重要，你应始终使用与相同\
  \ PostgreSQL 主版本匹配的工具。虽然你可以使用最新版本的工具对旧集群执行备份，但反之则不行。\n\n需要注意的是，与其他数据库引擎不同，PostgreSQL\
  \ 不需要特殊的“备份”权限来转储数据库内容：执行备份的用户只需拥有访问其想要备份的数据所需的授权即可。同样，为了恢复数据，用户必须获得写入表的足够权限。然而，为了简化权限管理，PostgreSQL\
  \ 提供了两个特定的预定义角色——pg_read_all_data 和 pg_write_all_data。可以将这些角色授予需要执行备份和/或恢复的用户，它们将自动为用户提供访问（读取）或恢复（写入）数据所需的所有权限。\n\
  \npg_dump 应用程序用于转储集群中的单个数据库，pg_dumpall 为我们提供了一种方便的方式来转储整个集群内容，包括角色和其他集群内部对象，而 pg_restore\
  \ 可以处理前两个应用程序的输出以执行恢复。\n\n> 请记住，备份只有在可以恢复时才有效。pg_dump 和 pg_dumpall 不会产生损坏的备份，但你的存储可能会意外损坏备份文件，因此为了确保你拥有有效的备份，你应始终尝试在另一台机器或集群上恢复它。\n\
  \n这三个命令都可以本地或远程在集群上工作以备份或恢复数据，这意味着你可以从远程备份机器或集群运行的同一服务器上使用它们。应用程序遵循与 psql 相同的参数和变量约定，例如，你可以通过\
  \ -U 命令行标志指定执行备份（或恢复）的用户名，以及通过 -h 指定集群运行的远程主机，等等。如果未提供参数，应用程序假定集群在本地运行，并通过当前操作系统用户连接到它，就像\
  \ psql 一样。\n\n在接下来的小节中，你将学习如何备份和恢复你自己的数据库。\n\n\n\n\n\n## 转储单个数据库\n\n为了转储——即创建数据库的备份副本——你需要使用\
  \ pg_dump 命令。\n\npg_dump 允许使用以下主要备份格式，其中只有第一种格式无需 pg_restore 即可恢复：\n\n- **纯文本格式：**\
  \ 这里，备份由可重现的 SQL 语句组成，并且基于文本 SQL 语句。生成的备份可以是纯文本，也可以是即时压缩的。\n- **目录格式：** 备份被放置到特定目录中，并且每个数据库表和大对象都被放置到一个压缩文件中。\n\
  - **自定义格式：** 这是一种 PostgreSQL 特定格式，适用于通过 pg_restore 进行选择性恢复。\n- **tar 格式：** 上述目录格式的\
  \ tar(1) 版本。\n\n默认情况下，pg_dump 使用纯文本格式，该格式会生成可用于重建数据库结构和内容的 SQL 语句，并将备份直接输出到标准输出。这意味着，如果你在不使用任何特定选项的情况下备份数据库，你会看到一长串\
  \ SQL 语句：\n\n```\n$ pg_dump forumdb\n-- PostgreSQL database dump\n...\nSET client_encoding\
  \ = 'UTF8';\nSET standard_conforming_strings = on;\nSELECT pg_catalog.set_config('search_path',\
  \ '', false);\n...\nCREATE SCHEMA forum;\n\nALTER SCHEMA forum OWNER TO forum;\n\
  \nSET default_tablespace = '';\n\nSET default_table_access_method = heap;\n\n--\n\
  ```\n\n```\n-- Name: categories; Type: TABLE; Schema: forum; Owner: forum\n--\n\n\
  CREATE TABLE forum.categories (\n    pk integer NOT NULL,\n    title text NOT NULL,\n\
  \    description text\n\n);\n\n...\nCOPY forum.tags (pk, tag, parent) FROM stdin;\n\
  1\tOperating Systems\t\\N\n2\tLinux\t1\n3\tUbuntu\t2\n4\tKubuntu\t3\n5\tDatabase\t\
  \\N\n6\tOperating Systems\t\\N\n\\.\n...\n```\n\n正如你所见，pg_dump 生成了一组有序的 SQL 语句，如果将其推送到交互式连接中，就能让你重建数据库结构（表和函数）以及其内容（表中的数据）、权限（授予和撤销）和其他必需对象。所有以双破折号开头的行都是\
  \ SQL 注释，pg_dump 勤勉地放置它们以帮助你分析和理解数据库的备份内容。\n\n关于备份内容，有几件重要的事情需要注意。首先是 pg_dump 会在备份的最开头放置一堆\
  \ SET 语句；这些 SET 语句对于备份来说不是强制性的，但对于从此备份内容进行恢复是必需的。换句话说，备份的前几行与备份的内容无关，而是关于如何使用此类备份。\n\
  \n这些 SET 语句中一个重要的行是以下这一行，该行已在 PostgreSQL 的最近版本中引入：\n\n```\nSELECT pg_catalog.set_config('search_path',\
  \ '', false);\n```\n\n这样的行会移除（即清空）search_path 变量，该变量是用于搜索未限定对象的一组模式名称列表。此类行的效果是，在恢复期间从备份创建的每个对象都不会利用可能污染你的环境和\
  \ search_path 的任何恶意代码。其副作用是，如后面将所示，恢复后，用户将拥有一个空的 search path，并且无法通过名称找到任何未完全限定的对象。\n\
  \n关于备份内容的另一件重要事情是，pg_dump 默认使用 COPY 作为向单个表中插入数据的方式。COPY 是 PostgreSQL 的一个命令，其作用类似于\
  \ INSERT，允许一次指定多个元组，最值得注意的是，它针对批量加载进行了优化，从而实现了更快的恢复速度。然而，这会使备份在不同数据库引擎之间不可移植，因此，如果你的目的是为了将数据库内容转储到另一个引擎，你必须指定\
  \ pg_dump 使用常规 INSERT 语句，这可以通过 --insert 命令行标志来实现：\n\n```\n$ pg_dump --insert forumdb\n\
  \n...\n\nINSERT INTO forum.tags OVERRIDING SYSTEM VALUE VALUES (1, 'Operating Systems',\
  \ NULL);\nINSERT INTO forum.tags OVERRIDING SYSTEM VALUE VALUES (2, 'Linux', 1);\n\
  INSERT INTO forum.tags OVERRIDING SYSTEM VALUE VALUES (3, 'Ubuntu', 2);\nINSERT\
  \ INTO forum.tags OVERRIDING SYSTEM VALUE VALUES (4, 'Kubuntu', 3);\nINSERT INTO\
  \ forum.tags OVERRIDING SYSTEM VALUE VALUES (5, 'Database', NULL);\nINSERT INTO\
  \ forum.tags OVERRIDING SYSTEM VALUE VALUES (6, 'Operating Systems', NULL);\n\n\
  ...\n```\n\n备份的整个内容是相同的，但这次，表是通过标准的 INSERT 语句填充的。可以想象，最终结果更具可移植性，但也更长（因此体积更大）。然而，请注意，在前面的示例中，INSERT\
  \ 语句并未包含每个字段值映射到的列列表；可以通过用 --column-inserts 选项替换 --inserts 选项来获得完全可移植的 INSERT 语句集：\n\
  \n```\n$ pg_dump --column-inserts  forumdb\n...\nINSERT INTO forum.tags (pk, tag,\
  \ parent) OVERRIDING SYSTEM VALUE VALUES\n(1, 'Operating Systems', NULL);\nINSERT\
  \ INTO forum.tags (pk, tag, parent) OVERRIDING SYSTEM VALUE VALUES\n(2, 'Linux',\
  \ 1);\nINSERT INTO forum.tags (pk, tag, parent) OVERRIDING SYSTEM VALUE VALUES\n\
  (3, 'Ubuntu', 2);\nINSERT INTO forum.tags (pk, tag, parent) OVERRIDING SYSTEM VALUE\
  \ VALUES\n(4, 'Kubuntu', 3);\nINSERT INTO forum.tags (pk, tag, parent) OVERRIDING\
  \ SYSTEM VALUE VALUES\n(5, 'Database', NULL);\nINSERT INTO forum.tags (pk, tag,\
  \ parent) OVERRIDING SYSTEM VALUE VALUES\n(6, 'Operating Systems', NULL);\n...\n\
  ```\n\n能够转储数据库内容是有用的，但能够将此类内容存储在文件中更有用，并且允许在稍后进行恢复。将 pg_dump 的输出保存到文件主要有两种方法。一种要求我们将输出重定向到文件，如以下示例所示：\n\
  \n```\n$ pg_dump --column-inserts  forumdb > backup_forumdb.sql\n```\n\n另一种（建议）方法是使用\
  \ pg_dump -f 选项，它允许我们指定内容将被放置到的文件名。在这里，前面的命令行可以重写如下：\n\n```\n$ pg_dump --column-inserts\
  \ -f backup_forumdb.sql forumdb\n```\n\n这与生成 backup_forumdb.sql 文件的效果完全相同，该文件包含与前面示例中所示相同的\
  \ SQL 内容。\n\npg_dump 还允许详细输出，这将在备份执行时打印备份正在执行的操作。-v 命令行标志启用此详细输出：\n\n```\n$ pg_dump\
  \ -f backup_forumdb.sql -v forumdb\npg_dump: last built-in OID is 16383\npg_dump:\
  \ reading extensions\n...\npg_dump: creating SCHEMA \"forum\"\npg_dump: creating\
  \ TABLE \"forum.categories\"\npg_dump: creating SEQUENCE \"forum.categories_pk_seq\"\
  \npg_dump: creating TABLE \"forum.delete_posts\"\npg_dump: creating TABLE \"forum.j_posts_tags\"\
  \npg_dump: creating TABLE \"forum.new_categories\"\npg_dump: creating TABLE \"forum.posts\"\
  \npg_dump: creating SEQUENCE \"forum.posts_pk_seq\"\n...\n...\n```\n\n一旦你的备份文件准备就绪，你可以轻松地将其恢复。我们将在下一节学习如何执行此操作。\n\
  \n## 恢复单个数据库\n\n如果你生成的备份是纯 SQL，你不需要任何其他东西，只需一个数据库连接即可恢复它——你可以按正确顺序执行一批语句来重新创建数据库内容。\n\
  \n> pg_dump 足够智能，能够确定表和其他对象需要被转储的正确顺序，确保它们的依赖关系能够按正确顺序恢复。\n\n需要注意的是，默认情况下，pg_dump\
  \ 在其备份内容中不会发出 CREATE DATABASE 语句。事实上，假设我们按如下方式生成备份文件：\n\n```\n$ pg_dump --column-inserts\
  \ -f backup_forumdb.sql forumdb\n```\n\n生成的 backup_forumdb.sql 文件将不包含如何创建新数据库的任何说明。这可能很方便，但也可能很危险：这意味着恢复将在你所连接的数据库内发生。\n\
  \n\n\n\n\n假设我们想要将数据库内容恢复到另一个本地数据库，我们将其命名为 forumdb_restore。这里，第一步是创建数据库，如下所示：\n\n\
  ```\n$ psql -c 'CREATE DATABASE forumdb_restore WITH OWNER forum;'\nCREATE DATABASE\n\
  ```\n\n现在，可以连接到目标数据库并让 psql 执行备份文件中的全部内容：\n\n```\n$ psql -U forum forumdb_restore\n\
  forumdb_restore=> \\i backup_forumdb.sql\nSET\nSET\nSET\nSET\nCREATE SCHEMA\nALTER\
  \ SCHEMA\nSET\nSET\nCREATE TABLE\nALTER TABLE\nALTER TABLE\nCREATE TABLE\nALTER\
  \ TABLE\nCREATE TABLE\nALTER TABLE\nCREATE TABLE\nALTER TABLE\nCREATE TABLE\nALTER\
  \ TABLE\nALTER TABLE\nCREATE TABLE\nALTER TABLE\nALTER TABLE\nCREATE TABLE\nALTER\
  \ TABLE\nALTER TABLE\nINSERT 0 1\n```\n\n```\nINSERT 0 1\nINSERT 0 1\n...\n```\n\
  \n你会看到一系列命令输出代码，例如 INSERT  0  1，表示发生了单次 INSERT，以及 ALTER  TABLE、GRANT 和备份中包含的每条其他命令的确认。根据备份的大小以及机器的性能，恢复可能需要从几秒到几分钟不等。\n\
  \n恢复完成后，可以通过例如查询单个表的数据来测试备份是否已恢复：\n\n```\nforumdb_test=> SELECT * FROM tags;\nERROR:\
  \  relation \"tags\" does not exist\nLINE 1: SELECT * FROM tags;\n             \
  \       ^\n```\n\n请稍等——这并不意味着备份和恢复过程没有正常工作！请记住 pg_dump 已插入适当的指令以删除 search_path 中的每个条目，因此\
  \ psql 不知道如何查找名为 tags 的表，而它可以正常找到 forum.tags 这样的完全限定名称的表：\n\n```\nforumdb_restore=>\
  \ SELECT * FROM forum.tags;\npk |       tag       | parent\n----+---------------+--------\n\
  \ 1 | Operating Systems |\n 2 | Linux         | 1\n 3 | Ubuntu        | 2\n 4 |\
  \ Kubuntu       | 3\n 5 | Database      |\n 6 | Operating Systems |\n(6 rows)\n\
  ```\n\n你可以关闭连接并重新开始以获得 search_path 的常规设置版本，或者通过例如使用 set_config() 在当前连接中手动设置它：\n\n\
  ```\nforumdb_test=> SELECT pg_catalog.set_config('search_path', 'public, \"$user\"\
  ', false);\n\"set_config\"\n```\n\n```\n---------------\n public, \"$user\"\n(1\
  \ row)\n\nforumdb_test=> SELECT * FROM tags;\n pk |      tag      | parent\n----+---------------+--------\n\
  \  1 | Operating Systems |\n  2 | Linux         |      1\n  3 | Ubuntu        |\
  \      2\n  4 | Kubuntu       |      3\n  5 | Database      |\n  6 | Operating Systems\
  \ |\n(6 rows)\n```\n\n正如你所见，现在连接工作正常。\n\n也可以在同一个数据库中执行备份（和恢复）。首先，pg_dump 必须包含一个名为\
  \ --create 的特殊选项，该选项指示应用程序将 CREATE DATABASE 作为恢复的第一个指令发出：\n\n```\n$ pg_dump --column-inserts\
  \ --create -f backup_forumdb.sql forumdb\n$ less backup_forumdb.sql\n...\nCREATE\
  \ DATABASE forumdb WITH TEMPLATE = template0 ENCODING = 'UTF8' LOCALE_PROVIDER =\
  \ libc LOCALE = 'en_US.utf8';\n\nALTER DATABASE forumdb OWNER TO forum;\n\n\\connect\
  \ forumdb\n...\n```\n\n正如你所见，pg_dump 的输出现在包含了数据库的创建，以及用于立即连接到该数据库的特殊 \\c 命令。换句话说，通过\
  \ psql 启动此文件将会在目标数据库不存在时在正确的数据库中恢复全部内容。\n\n为了测试这一点，让我们销毁我们心爱的数据库并通过最初连接到 template1\
  \ 来恢复它：\n\n```\n$ psql -c 'DROP DATABASE forumdb';\nDROP DATABASE\n$ psql\npostgres=#\
  \ \\i backup_forumdb.sql\n...\nforumdb=#\n```\n\n注意命令提示符如何发生变化以反映我们现在已连接到已恢复的 forumdb\
  \ 数据库这一事实。\n\n那么，你应该使用哪种转储和恢复版本？如果你在另一个集群中复制数据库，例如将暂存数据库迁移到生产环境，你应该包含 --create 选项以让数据库引擎为你创建数据库。如果你将数据库内容迁移到现有数据库，则\
  \ --create 选项必须完全不存在，因为不需要设置数据库；这可能有风险，因为你可能会将对象恢复到错误的数据库，因此在重新加载备份脚本之前，你需要仔细检查自己是否已连接到正确的数据库。\n\
  \n如果你将数据库内容迁移到另一个引擎，例如另一个关系数据库，你应该使用诸如 --inserts 或 --column-inserts 之类的选项使数据库备份更具可移植性。\n\
  \n## 限制备份数据的数量\n\npg_dump 允许使用大量的过滤器和标志来限制要备份的数据量。例如，你可以决定只转储数据库模式而不包含任何数据，这可以通过\
  \ -s 标志实现。另一方面，你可能已经有了数据库模式，并且你可能只需要不带任何 DDL 语句的数据库内容。这可以通过 -a 选项实现。当然，你可以组合不同的\
  \ pg_dump 命令以获得单独的备份：\n\n```\n$ pg_dump -s -f database_structure.sql forumdb\n$\
  \ pg_dump -a -f database_content.sql forumdb\n```\n\n你将得到一个名为 database_structure.sql\
  \ 的文件，其中包含所有不同的 CREATE TABLE 语句，以及另一个仅包含 COPY（或如果你指定了 --inserts 则为 INSERT 语句）的文件。\n\
  \n你也可以通过 -t 命令行标志按模式或数据将备份范围限制为少数几个表，或者通过 -T 参数排除某些表。例如，如果我们只想备份 users 表和 users_pk_seq\
  \ 序列，我们可以执行以下操作：\n\n```\n$ pg_dump -f users.sql -t forum.users -t forum.user_pk_seq\
  \ forumdb\n```\n\n创建的 users.sql 文件将只包含足以重建用户相关内容的数据，而不会包含更多内容。另一方面，如果我们想从备份中排除 users\
  \ 表，我们可以执行类似以下操作：\n\n```\n$ pg_dump -f users.sql -T forum.users -T forum.user_pk_seq\
  \ forumdb\n```\n\n当然，你可以以对你有意义的方式混合搭配任何选项，更重要的是，它允许你恢复你需要的确切内容。作为示例，如果你想要 posts\
  \ 表中包含的所有数据以及表结构本身，你可以执行以下操作：\n\n```\n$ pg_dump -f posts.sql -t forum.posts -a -v\
  \ forumdb\n...\npg_dump: warning: there are circular foreign-key constraints on\
  \ this table:\npg_dump:   posts\npg_dump: You might not be able to restore the dump\
  \ without using\n--disable-triggers or temporarily dropping the constraints.\npg_dump:\
  \ Consider using a full dump instead of a --data-only dump to avoid\nthis problem.\n\
  ```\n\npg_dump 足够智能，可以看到 posts 表具有不同的依赖关系和外键，因此它警告你转储将无法恢复 posts 表的所有内容。管理此类依赖关系的方式取决于你，因为你要求\
  \ pg_dump 不要执行完整备份（完整备份始终完整且一致）。\n\n## 压缩\n\npg_dump 提供了一个特殊的命令行选项 -Z，它接受 0 到 9\
  \ 之间的整数来指示备份的压缩级别。级别 0 表示完全不压缩，而 9 是最高压缩级别。\n\n为了演示压缩的工作方式，假设我们对同一数据库进行两次备份，第一次未压缩，第二次压缩（注意命令行选项和文件名如何变化）：\n\
  \n```\n$ pg_dump -f backup_forumdb_uncompressed.sql forumdb\n$ pg_dump -f backup_forumdb_compressed.sql.gz\
  \ -Z 9 forumdb\n$ ls -1s backup_forumdb*\n4 backup_forumdb_compressed.sql.gz\n12\
  \ backup_forumdb_uncompressed.sql\n```\n\n正如你所见，压缩文件占用了普通备份三分之一的空间，但这次文件不能直接编辑，因为它已以二进制压缩格式存储。\n\
  \n压缩可以应用于纯文本（即 SQL）转储和目录格式，但不能应用于 tar 输出格式。\n\n## 转储格式和 pg_restore\n\n在前面的章节中，你只看到了备份和恢复的纯\
  \ SQL 格式，但 pg_dump 提供了更复杂和智能的格式。除纯 SQL 外的所有格式都必须使用 pg_restore 进行恢复，因此不适合手动编辑。\n\n\
  备份格式由传递给 pg_dump 的 -F 命令行参数指定，它允许以下值之一：\n\n- - c（custom）是 PostgreSQL 特定的格式，位于单个文件归档中。\n\
  - - d（directory）是 PostgreSQL 特定的压缩格式，其中每个对象分布在目录内的不同文件中。\n- - t（tar）是 .tar 未压缩格式，解压后结果与目录格式提供的布局相同。\n\
  \n让我们从第一个格式开始：自定义单文件格式。备份数据库的命令类似于纯 SQL 格式的命令，其中你必须指定输出文件，但这次文件不是纯文本文件：\n\n```\n\
  $ pg_dump -Fc --create -f backup_forumdb.backup forumdb\n```\n\n产生的输出文件比纯 SQL 文件小，无法作为文本编辑，因为它是二进制的。许多\
  \ pg_dump 命令行参数同样适用于自定义格式，而其他参数则完全没有意义。\n\n\n\n\n\n在任何情况下，pg_dump 都足够智能，能够知道需要考虑什么以及需要丢弃什么，因此以下命令行将生成与前一个示例中所示相同的备份：\n\
  \n```\n$ pg_dump -Fc --create --inserts -f backup_forumdb.backup forumdb\n$ pg_dump\
  \ -Fc --create --column-inserts -f backup_forumdb.backup forumdb\n```\n\n显然，在这种备份中，--column-inserts\
  \ 和 --inserts 命令行标志没有任何意义，因为不会生成任何文本文件（因此也不会生成任何 SQL 语句）。\n\n一旦有了自定义备份，如何恢复数据库内容？请记住，自定义备份格式需要使用\
  \ pg_restore 才能成功恢复。正如我们之前所做的一样，让我们再次销毁数据库并通过 pg_restore 恢复它：\n\n```\n$ psql -c\
  \ 'DROP DATABASE forumdb';\nDROP DATABASE\n$ pg_restore -C -d postgres backup_forumdb.backup\n\
  ```\n\npg_restore 静默运行并恢复指定的数据库。-C 选项表示 pg_restore 将在恢复对象之前重新创建数据库。-d 选项告诉程序先连接到\
  \ postgres 数据库，发出 CREATE DATABASE，然后连接到新创建的数据库以继续恢复，这与普通备份格式所做的类似。显然，pg_restore\
  \ 需要一个强制性的文件来操作——即命令行上指定的最后一个参数。\n\n值得注意的是，pg_restore 可以生成将要执行的 SQL 语句列表，而无需实际执行它们。-f\
  \ 命令行选项可以做到这一点，让你将纯 SQL 存储在文件中或在继续恢复之前检查它：\n\n```\n$ pg_restore backup_forumdb.backup\
  \ -f restore.sql\n$ less restore.sql\n--\n-- PostgreSQL database dump\n--\n\nCREATE\
  \ DATABASE forumdb WITH TEMPLATE = template0 ENCODING = 'UTF8'\nLOCALE_PROVIDER\
  \ = libc LOCALE = 'en_US.utf8';\n\nALTER DATABASE forumdb OWNER TO forum;\n```\n\
  \n最后一个 pg_dump 格式是 .tar 格式，可以通过 -Ft 命令行标志获得。其结果是创建一个 tar(1) 未压缩的归档，其中包含我们在前一个示例中创建的相同目录结构，但每个文件都未压缩：\n\
  \n```\n$ pg_dump -Ft -f backup_forumdb.tar forumdb\n$ tar -tf backup_forumdb.tar\n\
  toc.dat\n3368.dat\n3370.dat\n3371.dat\n3372.dat\n3373.dat\n3375.dat\n3377.dat\n\
  ```\n\n接下来，我们将查看如何执行选择性恢复，这将帮助你选择要恢复的数据库元素的哪些部分。\n\n## 执行选择性恢复\n\n当执行纯 SQL 数据库转储时，你可以手动编辑结果，因为它是纯文本，并有选择地删除你不想恢复的部分。使用自定义格式和\
  \ pg_restore，你可以做完全相同的事情，但需要执行几个步骤。\n\n首先，你始终可以通过 pg_restore 及其 --list 选项检查二进制转储的内容，该选项会将目录（目录表或简称为\
  \ ToC）打印到屏幕上。你需要在 --list 选项之后指定单个文件或包含备份的目录，以打印 ToC：\n\n```\n$ pg_restore --list\
  \ backup.d\n;\n; Archive created at 2023-09-29 15:35:12 UTC\n;\n; dbname: forumdb\n\
  ;\n; TOC Entries: 39\n;\n; Compression: -1\n;\n; Dump Version: 1.14-0\n;\n; Format:\
  \ DIRECTORY\n;\n;\n```\n\n```\n; Selected TOC Entries:\n;\n6; 2615 16653 SCHEMA\
  \ - forum forum\n215; 1259 16654 TABLE forum categories forum\n216; 1259 16659 SEQUENCE\
  \ forum categories_pk_seq forum\n217; 1259 16660 TABLE forum delete_posts forum\n\
  218; 1259 16665 TABLE forum j_posts_tags forum\n219; 1259 16668 TABLE forum new_categories\
  \ forum\n220; 1259 16673 TABLE forum posts forum\n221; 1259 16682 SEQUENCE forum\
  \ posts_pk_seq forum\n222; 1259 16683 TABLE forum tags forum\n223; 1259 16688 SEQUENCE\
  \ forum tags_pk_seq forum\n224; 1259 16689 TABLE forum users forum\n225; 1259 16694\
  \ SEQUENCE forum users_pk_seq forum\n3368; 0 16654 TABLE DATA forum categories forum\n\
  3370; 0 16660 TABLE DATA forum delete_posts forum\n3371; 0 16665 TABLE DATA forum\
  \ j_posts_tags forum\n3372; 0 16668 TABLE DATA forum new_categories forum\n3373;\
  \ 0 16673 TABLE DATA forum posts forum\n3375; 0 16683 TABLE DATA forum tags forum\n\
  3377; 0 16689 TABLE DATA forum users forum\n3385; 0 0 SEQUENCE SET forum categories_pk_seq\
  \ forum\n...\n```\n\n以分号开头的行是注释，正如你所看到的，打印出的前几行是描述备份内容、备份日期、格式（在此示例中为“目录”）以及备份中条目（对象）数量的横幅。\n\
  \n每行不是注释的行代表数据库对象或恢复过程将执行的单个操作。例如，查看以下行：\n\n```\n222; 1259 16683 TABLE forum tags\
  \ forum\n```\n\n这表示 tags 表将由用户 forum 在 forum 模式中恢复。\n\n以下行意味着同一个表将被填充数据：\n\n```\n\
  3373; 0 16673 TABLE DATA forum posts forum\n```\n\n得益于此 ToC，你可以控制恢复过程。事实上，如果你移动或删除\
  \ ToC 中的行，你可以指示 pg_restore 更改其执行方式。例如，首先，让我们将 ToC 存储在文本文件中：\n\n```\n$ pg_restore\
  \ --list backup.d > custom_toc.txt\n```\n\n现在，使用你喜欢的编辑器编辑 custom_toc.txt 文件，并按如下方式注释掉提到的部分，通过将分号放在行的第一个字符处，或删除填充\
  \ tags 表和相关联表行的行：\n\n```\n;3373; 0 16673 TABLE DATA forum posts forum\n;3371; 0\
  \ 16665 TABLE DATA forum j_posts_tags forum\n```\n\n现在保存 custom_toc.txt 文件。有了它，就可以通过\
  \ pg_restore 恢复数据库，但你必须指示程序遵循你自己的 ToC，而不是随备份本身提供的完整且未修改的 ToC。为此，pg_restore 允许指定\
  \ -L 标志以使用要使用的 ToC：\n\n```\n$ psql -c 'DROP DATABASE forumdb;'\nDROP DATABASE\n\n\
  $ pg_restore -C -d postgres -L custom_toc.txt  backup.d\n$ psql -c 'SELECT count(*)\
  \ FROM forum.tags;' forumdb\ncount\n------\n    0\n(1 row)\n```\n\n正如你所看到的，表已被创建，但它是空的。这演示了如何驱动备份的恢复，以有选择地重新排列要恢复的对象。\n\
  \n也可以重新排列行以使某些对象在其他对象之前恢复，但这要复杂得多，特别是当存在对象之间的交叉引用和依赖关系时。无论如何，这是一种非常灵活的方式，可以有选择地决定恢复什么，而且还可以创建不同的\
  \ ToC 以在不同的工作集中恢复相同格式的备份。\n\npg_dumpall 提供了一个特别有用的选项 --globals-only，用于仅转储集群内对象，例如角色、表空间和复制槽。此选项可用于在不同集群之间转储和恢复此类对象：\n\
  \n```\n$ pg_dumpall --globals-only -f cluster.sql\n```\n\n## 并行备份\n\n可以使用并行化来加快备份和恢复速度。其基本思想是拥有多个进程（和数据库连接），每个进程被分配一个较小的任务来执行，这样并行执行所有任务将为你提供更好的性能。\n\
  \n需要注意的是，通常问题不在于备份速度更快——而是能够尽可能快地执行恢复。因此，虽然可以以并行模式执行备份和恢复，但你会发现恢复是最重要的。\n\npg_dump\
  \ 允许你通过 -j 命令行参数指定并行级别，你必须为其分配一个正整数——即要启动的并行进程数。pg_dump 然后将以等于并行度的数量打开到数据库的并行连接，外加一个连接来统领它们，并强制每个连接转储单独的表。这显然意味着启动的进程数超过数据库中需要备份的表数是没有意义的。\n\
  \n由于所有进程都将转储单个表，并行模式仅适用于目录 (-Fd) 格式，其中每个表都存储在单独的文件中，以便进程不会混合它们的写入。\n\n例如，以下指令将使用三个并行作业转储数据库，从而打开四个数据库连接：\n\
  \n```\n$ pg_dump -Fd -f backup_forumdb -v -j 3 forumdb\n...\npg_dump: finished item\
  \ 3373 TABLE DATA posts\npg_dump: finished item 3370 TABLE DATA delete_posts\npg_dump:\
  \ finished item 3377 TABLE DATA users\npg_dump: dumping contents of table \"forum.j_posts_tags\"\
  \npg_dump: dumping contents of table \"forum.new_categories\"\npg_dump: dumping\
  \ contents of table \"forum.tags\"\npg_dump: finished item 3372 TABLE DATA new_categories\n\
  ```\n\n\n\n\n\npg_dump: finished item 3375 TABLE DATA tags\npg_dump: finished item\
  \ 3371 TABLE DATA j_posts_tags\n\n诸如 finished item 的消息是作为单个表完成的单个转储进程，它们不会在 pg_dump\
  \ 命令的非并行详细输出中显示。重要的是要考虑并行 pg_dump 打开的连接数：它们总是在每个并行作业上执行，再加一个，用于同步和管理整个备份过程。这意味着为了执行并行备份，你必须确保针对数据库有足够的连接可用；否则，备份将失败。\n\
  \n并行备份的另一个重要方面是它们可能在并发情况下失败。事实上，一旦 pg_dump 启动，“主”进程会在并行进程将要转储的每个对象上获取轻量级锁（共享锁），而在启动时，每个并行进程都会在对象上获取独占（重量级）锁。这可以防止对象（表）在并行进程完成工作之前被销毁。然而，在主进程获取第一个锁与由其生成的并行进程获取重量级锁之间，另一个并发连接可能会尝试获取表上的锁，从而导致可能的死锁情况。为防止这种情况，主\
  \ pg_dump 进程会检测到依赖关系并中止整个备份。\n\npg_restore 也支持通过相同的助记符 -j 命令行参数进行并行恢复。该命令会生成指定数量的进程，参与数据加载、索引创建以及所有其他繁重且耗时的操作。\n\
  \n与 pg_dump 不同，pg_restore 可以同时对目录格式和自定义格式进行并行工作。确定要指定给 pg_restore 的并行作业数量并不简单，但通常这是\
  \ CPU 核心的数量，即使略大于该值的数值也能产生更快的恢复速度。\n\n例如，下面的命令允许并行恢复我们之前所做的备份（第一行删除数据库以使恢复成功）：\n\
  \n```\n$ psql -c \"DROP DATABASE forumdb;\"\n$ pg_restore -C -d postgres -j 4 -v\
  \ backup.d\n...\npg_restore: finished item 3388 SEQUENCE SET users_pk_seq\npg_restore:\
  \ finished item 3387 SEQUENCE SET tags_pk_seq\n```\n\n```\npg_restore: finished\
  \ item 3220 FK CONSTRAINT j_posts_tags j_posts_tags_post_pk_fkey\npg_restore: finished\
  \ main parallel loop\n```\n\n得益于详细标志，很清楚 pg_restore 如何并行恢复数据库中的数据。诸如 launching item\
  \ 和 finished item 的消息指示并行工作者在何时以及对哪个对象进行了操作。\n\n## 备份自动化\n\n通过结合 pg_dump 和 pg_dumpall，很容易创建自动化备份，例如在每晚或数据库系统未被大量使用的每天运行。取决于你使用的操作系统，可以安排此类备份并使其自动执行和轮换。\n\
  \n如果你使用的是 Unix，例如，可以通过 cron(1) 安排 pg_dump，如下所示：\n\n```\n$ crontab -e\n```\n\n完成此操作后，你将添加以下行：\n\
  \n```\n30 23 * * * pg_dump -Fc -f /backup/forumdb.backup -U forum forumdb\n```\n\
  \n这会在每天 23:30 以自定义格式启动一次完整备份。然而，以上方法有几个缺点，例如管理已存在的备份，处理需要向 crontab 添加另一行的新添加的数据库等等。\n\
  \n得益于 PostgreSQL 及其目录的灵活性，开发一个包装脚本来轻松处理备份所有数据库是相当简单的。作为起点，以下脚本对除 template0 之外的每个数据库执行完整备份：\n\
  \n```\n#!/bin/sh\n\nBACKUP_ROOT=/backup\n\nfor database in $( psql -U postgres -A\
  \ -t -c \"SELECT datname FROM pg_database WHERE datname <> 'template0'\" postgres\
  \ )\ndo\n    backup_dir=$BACKUP_ROOT/$database/$(date +'%Y-%m-%d')\n    if [ -d\
  \ $backup_dir ]; then\n        echo \"Skipping backup $database, already done today!\"\
  \n```\n\n```\ncontinue\nfi\n\nmkdir -p $backup_dir\npg_dump -U postgres -Fd -f $backup_dir\
  \ $database\necho \"Backup $database into $backup_dir done!\"\ndone\n```\n\n想法很简单：系统查询\
  \ PostgreSQL 目录 pg_database 以获取集群服务的每个数据库，并对每个数据库搜索一个以数据库命名的专用目录，其中包含一个以当前日期命名的目录。如果目录存在，则备份已完成，因此只需继续下一个数据库。否则，可以执行备份。因此，系统将在一天将\
  \ forumdb 数据库备份到 /backup/forumdb/2023-07-19 目录，第二天备份到 /backup/forumdb/2023-07-20，等等。由于此原因，很容易将上述脚本添加到你的\
  \ crontab 中，而不必为新数据库添加新行，也不必删除对应已删除数据库的行：\n\n```\n30 23 * * * my_backup_script.sh\n\
  ```\n\n当然，以上脚本并不代表复杂的备份系统，而是一个起点，如果你需要一个快速灵活的解决方案来执行自动逻辑备份，使用你的 PostgreSQL 集群和操作系统提供的工具。正如前面所说，许多操作系统已经考虑到了备份\
  \ PostgreSQL 集群，并提供了现成的脚本来帮助你解决这个问题。其中一个很好的例子是 502.pgsql 脚本，它随 FreeBSD 的 PostgreSQL\
  \ 包一起提供。\n\n## COPY 命令\n\nCOPY 命令按设计不是备份设施，但它在批量加载数据方面非常高效，因此在备份恢复方面也很高效，如前所述。然而，此命令可以单独使用以双向加载数据：借助\
  \ COPY 你可以从表中提取数据（即执行转储）或将数据加载到表中（即执行恢复）。此外，COPY 可以与外部程序交互；即，它可以直接从另一个进程发送（或接收）数据。\n\
  \nCOPY 有两种主要操作模式：\n\n- COPY TO 从表中提取数据并将其发送到文件系统上的文件或另一个外部应用程序或进程。\n- COPY FROM\
  \ 从文件系统上的文件或外部应用程序加载数据并将其插入到指定的表中。\n\n> 当处理外部文件或程序时，COPY 命令需要超级用户权限（或至少用户属于 `pg_write_server_files`\
  \ 组）。因此，本节中显示的示例将作为 postgres 超级用户运行。\n\n作为一个简单的例子，假设我们需要提取 categories 表中的所有数据；这是一种\
  \ COPY TO 类型的命令，如下所示指定：\n\n```\nforumdb=# COPY forum.categories TO '/tmp/categories.backup.txt';\n\
  COPY 5\n```\n\n在上面的示例中，表的内容被写入本地文件 /tmp/categories.backup.txt，并且文件内容仅由元组组成，没有任何特定的\
  \ SQL 指令：\n\n```\n$ cat /tmp/categories.backup.txt\n5        Software engineering\
  \    Software engineering discussions\n1        Database                Database\
  \ related discussions\n2        Unix                    Unix and Linux discussions\n\
  3        Programming Languages   All about programming languages\n4        A.I.\
  \                    Machine Learning discussions\n```\n\nCOPY 命令支持广泛的选项，允许用户定义字段分隔符、表头（即列名）的存在、引号字符等等。这使得构建自己的\
  \ **逗号分隔值 (CSV)** 数据集变得非常简单：\n\n```\nforumdb=# COPY forum.categories TO '/tmp/categories.csv'\n\
  WITH ( HEADER on, DELIMITER ';' );\nCOPY 5\n\n$ cat /tmp/categories.csv\npk;title;description\n\
  5;Software engineering;Software engineering discussions\n1;Database;Database related\
  \ discussions\n2;Unix;Unix and Linux discussions\n3;Programming Languages;All about\
  \ programming languages\n```\n\n\n\n4;A.I;Machine Learning discussions\n\n如上例所示，现在所有字段都已用分号分隔，并且文件中的第一行是表列清单。值得注意的是，COPY\
  \ 已自带一个定义的 CSV 格式，可通过 FORMAT csv 选项指定：\n\n```sql\nforumdb=# COPY forum.categories\
  \ TO '/tmp/categories.csv'\nWITH ( FORMAT csv );\nCOPY 5\n```\n\n拥有包含数据的 CSV 文件意味着\
  \ COPY FROM 可以将数据加载到表中。换句话说，COPY 不仅是一个高效的批量加载器；它也是将数据从电子表格等外部资源加载到数据库中的有用工具。\n\n\
  假设我们需要将 categories.csv 文件中的数据加载到另一个名为 categories_reloaded 的表中：\n\n```sql\nforumdb=#\
  \ CREATE TABLE forum.categories_reloaded( LIKE forum.categories );\nCREATE TABLE\n\
  forumdb=# COPY forum.categories_reloaded\n             FROM '/tmp/categories.csv'\n\
  \             WITH (FORMAT csv);\nCOPY 5\n```\n\n也可以指定 WHERE 子句，以过滤将要加载的内容；例如，假设我们只想加载奇数行：\n\
  \n```sql\nforumdb=# COPY forum.categories_reloaded\n             FROM '/tmp/categories.csv'\n\
  \             WITH (FORMAT csv)\n             WHERE pk % 2 = 1;\n```\n\nCOPY TO\
  \ 不允许使用 WHERE 子句，但可以从查询中复制，这可以实现元组的过滤：\n\n```sql\nforumdb=# COPY\n    ( SELECT *\
  \ FROM forum.categories\n      WHERE pk % 2 = 1 )\n    TO '/tmp/categories.odd.csv'\n\
  \    WITH (FORMAT csv);\n```\n\n换句话说，COPY 不能被无特权用户使用。为此，psql 提供了自己的 COPY 替代命令，名为\
  \ \\copy，它会以 psql 客户端可访问的文件为对象，在任一方向上流式传输内容。这样，用户就能在无需任何特定服务器权限（如 pg_write_server）的情况下使用\
  \ COPY。\n\n因此，要从查询中提取数据并将其放入文件，无特权用户应执行类似以下操作：\n\n```\nforumdb=> \\COPY\n( SELECT\
  \ * FROM forum.categories\nWHERE pk % 2 = 1 )\nTO '/tmp/categories.odd.csv'\nWITH\
  \ (FORMAT csv);\nCOPY 3\n```\n\n注意使用的是 \\copy 而不是 COPY。\n\n得益于 COPY 的可用性及其 psql\
  \ 包装器 \\copy，用户可以轻松地批量加载数据并从数据库中提取数据。\n\n现在我们已经探索了逻辑备份，让我们继续研究物理备份。\n\n## 探索物理备份\n\
  \n物理备份是在数据库集群正常运行期间进行的低级备份。这里的低级是指备份以某种方式在备份集群“外部”执行——也就是说，在文件系统级别执行。\n\n正如你在第 10\
  \ 章《用户、角色和数据库安全》中所了解的那样，数据库集群需要 PGDATA/base 中包含的数据文件和 PGDATA/wal 中包含的 WAL，以及一些其他文件，才能正常工作。主要概念是，数据文件和\
  \ WAL 可以使集群具备自愈能力并从崩溃中恢复。因此，物理备份会复制所有集群文件，然后在需要恢复时，模拟数据库崩溃并利用 WAL 使集群自愈。\n\n物理备份之所以重要，是因为它允许我们有效地克隆一个集群，从其构成的文件开始。这意味着，一方面，你不能将物理备份的集群恢复到不同版本的\
  \ PostgreSQL 上，另一方面，你在备份阶段几乎无需与集群进行任何交互。\n\n最后一点尤其重要：物理备份几乎可以在任何时刻进行，而不会像逻辑备份那样对数据库造成巨大的事务影响，也不会干扰正在进行的数据库活动，例如客户端连接和查询。确实，在这种备份期间，存储系统——特别是文件系统——会承受压力，但对集群而言，备份几乎是透明的。\n\
  \n可以说，集群必须被告知备份已开始，以便在 WAL 中明确标记备份正在进行，但除了这个“简单”的操作外，备份完全在数据库集群的范围之外。\n\n此外，物理备份允许你选择最适合低级文件复制的工具。你可以自由使用任何文件系统特定的命令，如\
  \ cp(1)、rsync(1)、tar(1) 等；你可以通过网络使用操作系统提供的任何文件复制机制进行备份，甚至可以自行开发工具。PostgreSQL 也有很多备份解决方案，包括作者最喜欢的\
  \ pgBackRest，因此你可以根据环境和需求自由定制备份策略，以使用最合适的工具。\n\n在下面的小节中，你将学习如何使用随 PostgreSQL 一起提供的工具\
  \ pg_basebackup 来执行物理备份。该工具被开发为克隆集群的主要工具，例如作为复制系统的起点（复制将在后面的章节中介绍）。\n\n请注意，无论如何，pg_basebackup\
  \ 所做的都是执行任何系统管理员都可以手动执行的步骤，因此该工具是进行物理备份的一种方便且经过充分测试的方法。\n\n## 执行手动物理备份\n\npg_basebackup\
  \ 工具执行本地或远程数据库集群克隆操作，可用作备份。为了正常工作，需要克隆的集群必须相应地设置好。由于 pg_basebackup “要求” PostgreSQL\
  \ 提供 WAL，因此目标集群必须至少有两个活动的 WAL Sender 进程（WAL Sender 进程负责通过客户端连接提供 WAL）。\n\n因此，对要备份的数据库执行的第一个步骤是检查\
  \ max_wal_senders 配置参数（在 postgresql.conf 文件中）的值是否大于或等于 2：\n\n```\nmax_wal_senders\
  \ = 2\n```\n\n```\npg_basebackup: created temporary replication slot \"pg_basebackup_117\"\
  \npg_basebackup: write-ahead log end point: 0/2000100\npg_basebackup: waiting for\
  \ background process to finish streaming ...\npg_basebackup: syncing data to disk\
  \ ...\npg_basebackup: renaming backup_manifest.tmp to backup_manifest\npg_basebackup:\
  \ base backup completed\n```\n\n-D 标志指定要将备份存储到的目录，在此示例中为 /backup/data。-l 可选标志允许你为备份提供文本标签，可用于检查备份以获取有关其的一些额外信息。-v\
  \ 标志启用详细模式，会在每一步产生有关命令执行情况的丰富输出。重复的 -T 标志告诉 PostgreSQL 如何重新映射用作表空间的每个目录：等号左侧的目录是从中获取备份的现有目录，等号右侧的目录是重新映射的路径。\n\
  \n其他参数是典型的 PostgreSQL libpq 客户端标志，用于指定如何连接到数据库以便克隆它——在本例中，是通过用户 postgres 在端口 5432\
  \ 的 localhost 上。\n\npg_basebackup 支持其他多个选项，可用于例如限制网络带宽使用、显示正在进行的备份的进度等等。请参阅命令文档和在线帮助以获取更多详细信息。\n\
  \n如果检查备份存储的目录，你会发现它实际上是所备份服务器的 PGDATA 目录的克隆，包括其配置文件。\n\n## pg_verifybackup\n\n自\
  \ PostgreSQL 13 起，可以使用名为 pg_verifybackup 的工具来验证通过 pg_basebackup 完成的备份的完整性。大致如下：\n\
  \n```\n$ pg_verifybackup /backup/data/\nbackup successfully verified\n```\n\n\n\n\
  \n指定包含备份的目录后，工具能够执行检查并报告任何损坏。工具执行四个主要步骤：\n\n- 1. 它评估备份清单以检查其是否可读且包含有效的备份信息。\n- 2.\
  \ 它扫描备份内容以查找丢失或被修改的数据文件（此步骤中会跳过某些配置文件，因为用户可能已更改它们）。\n- 3. 它将所有数据文件校验和与清单值进行比较，以确保文件未被损坏。\n\
  - 4. 通过利用另一个实用程序，`pg_waldump`，它验证用于恢复备份的 WAL 记录是否已就位且可读。\n\n得益于 `pg_verifybackup`，你可以确信你的备份未因文件系统问题、磁盘故障或其他原因而损坏，因此可以从此类备份恢复。\n\
  \n## 启动克隆的集群\n\n`pg_basebackup` 会完整克隆目标集群，包括配置文件。这意味着集群的配置并未“适配”到克隆所在的位置，包括数据目录和监听选项（例如\
  \ TCP/IP 端口）。因此，在启动克隆集群时必须小心，因为它可能会与原始集群冲突，尤其是在备份在本地执行（在同一台机器上）时。\n\n此时，你可以选择在尝试启动备份集群之前编辑配置、在命令行上更改主要设置，或将备份移动到远程主机。\n\
  \n如果你想启动克隆的集群，假设它已保留在本地，如上一节所述，你可以例如使用以下命令行设置重新启动它：\n\n```\n$ pg_ctl -D /backup/data/\
  \ -o '-p 5433' start\nwaiting for server to start....\nLOG:  database system was\
  \ interrupted; last known up at 2023-07-19 16:43:39 UTC\nLOG:  redo starts at 0/2000028\n\
  LOG:  consistent recovery state reached at 0/2000138\n```\n\n```\nLOG:  redo done\
  \ at 0/2000138 system usage: CPU: user: 0.00 s, system: 0.00 s, elapsed: 0.00 s\n\
  LOG:  database system is ready to accept connections\ndone\nserver started\n```\n\
  \n这里，服务器已在克隆的 PGDATA 目录和 TCP/IP 端口 5433 上启动。如果你检查数据库集群日志，你会注意到 PostgreSQL 声称已被中断，并且重做过程已启动，然后完成。一旦重做完成，数据库即可开始其正常活动。简而言之，这是一种类似崩溃的情况：物理转储复制了数据库的“脏”状态，但得益于\
  \ WAL，它能够自我修复。\n\n你会看到数据库已从“强制崩溃”中恢复；也就是说，克隆集群在其首次启动时进行了自我修复。\n\n## 从物理备份恢复\n\n\
  如果需要从物理备份恢复，你需要用 `pg_basebackup` 产生的克隆副本覆盖原始 PGDATA 目录。这是一项非常危险的操作，因为你将丢失 PGDATA\
  \ 目录中的所有内容并用备份副本替换它，这意味着出现错误的可能性很高。\n\n因此，与其执行在线恢复，我们建议你像上一节所示那样在其他位置启动一个克隆集群，以便你可以提取需要恢复的数据并仅将该数据恢复到目标集群。例如，你可以启动克隆服务器，通过\
  \ `pg_dump` 提取需要恢复的数据，然后将其恢复到目标集群。\n\n当然，也有需要恢复整个集群的情况，因此需要覆盖 PGDATA，但在这种情况下，我们仍然建议你使用更高级的工具，例如\
  \ pgBackRest，它在备份和恢复部分都能驱动并协助你。\n\n物理备份和恢复是非常强大的机制，但它们要求你深入理解其内部工作原理。因此，请花时间仔细试验它们，以便在生产环境中应用时做好准备。\n\
  \n## PITR 背后的基本概念\n\n时间点恢复，常用 PITR 表示，是一种技术，允许你在过去的特定时间点恢复数据库。展示如何使用 PITR 超出了本章的范围，本节仅解释该技术背后的基本概念。\n\
  \nPITR 只能通过物理备份实现，并且通常通过上述的 pgBackRest 等特定备份工具执行，尽管 PostgreSQL 提供了执行 PITR 所需的所有基础设施。\n\
  \nPITR 背后的主要思想是先从物理备份开始，然后持续存储数据库 WAL 段，这一过程称为 *WAL 归档*。WAL 可以存储在本地或发送到远程机器，通常是特定的备份机器。需要归档所有\
  \ WAL 的原因是，正如 *第 11 章* 中已解释的那样，PostgreSQL 在修改后的数据安全存储在磁盘上后会回收 WAL；因此，为了获得连续的 WAL\
  \ 流，管理员需要保留所有 WAL。PostgreSQL 提供了一个特定的配置设置，名为 `archive_command`，可以调整为执行外部命令（例如，复制命令如\
  \ cp、scp、sftp 等）；`archive_command` 在 PostgreSQL 完成每个 WAL 段并切换到新段后立即对每个 WAL 段执行。\n\
  \n有了物理备份和 WAL 流，数据库集群可以被指示按顺序重放所有事务（包含在 WAL 中），直到达到预期的恢复时间。此时，集群可以忽略超出范围的 WAL 并从那里作为一个独立的新实例启动。\n\
  \n因此，PITR 的思想是从物理备份开始，让集群在时间上向前移动，直到达到期望的实例。恢复点可以指定为时间戳，从而指示特定时间实例，或事务标识符，甚至可以是数据库管理员放置在\
  \ WAL 中的 *标签*，而无需他们担心时间或发生的事务。\n\nPITR 的一个缺点是，将集群恢复到给定时间需要一些时间和精力。此外，如果 WAL 流中缺少单个\
  \ WAL 段，集群将无法恢复。因此，使用专用备份工具来管理 PITR 通常是最好的选择。\n\n## 总结\n\n在本章中，我们了解到 PostgreSQL\
  \ 提供了高级工具，以便我们可以执行备份和恢复。备份很重要，因为即使在经过实战检验且高质量的产品如 PostgreSQL 中，也可能出现问题：通常，用户可能会意外损坏其数据，但有时硬件或软件也可能严重故障。因此，能够部分或完全恢复数据非常重要，每个数据库管理员都应仔细规划备份策略。\n\
  \n我们还了解到 PostgreSQL 提供了逻辑和物理备份的工具。逻辑备份是通过从数据库本身读取数据，使用普通的 SQL 交互来获取的；物理备份是通过克隆 PGDATA\
  \ 目录获取的，要么使用操作系统工具，要么使用 PostgreSQL 的专用解决方案。恢复在逻辑备份的情况下由特定工具执行，而在物理备份的情况下由数据库自我修复机制执行。\n\
  \n最后，重要的是要强调，备份本身在成功恢复之前是无效的，因此为了确保你能够恢复集群，你也需要测试你的备份。\n\n现在你能够备份和恢复你的集群了，在下一章中，我们将研究配置和监控。\n\
  \n## 验证你的知识\n\n- 逻辑备份和物理备份有什么区别？\n  \n  逻辑备份，也称为“转储”，是一种直接与数据库及其正在运行的事务交互的备份。物理备份，也称为“热备份”，是底层文件系统和\
  \ WAL 的副本，以便可以恢复数据库的最后已知清晰状态。有关更多详细信息，请参阅 *介绍备份和恢复的类型* 部分。\n\n- pg_dump 和 pg_dumpall\
  \ 有什么区别？\n  \n  pg_dump 命令用于转储单个数据库，而 pg_dumpall 会转储所有数据库内对象（例如用户），然后对集群中的每个数据库执行\
  \ pg_dump。有关更多详细信息，请参阅 *转储整个集群* 部分。\n\n\n\n\n\n- COPY 命令是什么？\n\n  COPY 命令是 PostgreSQL\
  \ 特有的语句，用于批量加载或提取数据。它通常被用作从表中转储/恢复数据的方式。有关更多详细信息，请参阅 *The COPY command* 部分。\n- pg_basebackup\
  \ 命令是什么？\n\n  pg_basebackup 命令是一个执行正在运行的集群物理备份的命令，也可以归档 WAL。有关更多详细信息，请参阅 *Performing\
  \ a manual physical backup* 部分。\n- 什么是时间点恢复 Point in Time Recovery (PITR)？\n\n \
  \ PITR 是一种技术，通过它可以在备份开始后将物理备份恢复到特定时间点。它是一种将集群 *back in time* 的方式。有关更多详细信息，请参阅 *Basic\
  \ concepts behind PITR* 部分。\n\n## References\n\n- PostgreSQL pg_dump 工具官方文档：https://www.postgresql.org/docs/current/app-pgdump.html\n\
  - PostgreSQL pg_dumpall 工具官方文档：https://www.postgresql.org/docs/current/app-pg-dumpall.html\n\
  - PostgreSQL pg_restore 工具官方文档：https://www.postgresql.org/docs/current/app-pgrestore.html\n\
  - FreeBSD 502.pgsql 备份脚本：https://www.freshports.org/databases/postgresql83-server/files/502.pgsql\n\
  - PostgreSQL pg_basebackup 工具官方文档：https://www.postgresql.org/docs/current/app-pgbasebackup.html\n\
  - PostgreSQL pg_verifybackup 工具官方文档：https://www.postgresql.org/docs/current/app-pgverifybackup.html\n\
  - PostgreSQL COPY 命令官方文档：https://www.postgresql.org/docs/current/sql-copy.html\n\
  - 用于物理备份的 pgBackRest 外部工具：https://pgbackrest.org/\n\n## Learn more on Discord\n\n\
  要加入本书的 Discord 社区——在那里你可以分享反馈、向作者提问并了解新版本发布信息——请扫描下方二维码：\n\nhttps://discord.gg/jYWCjF6Tku\n\
  \n![](img/bbe5644feba3d6a2ab994dc7e6cecbf1_604_0.png)\n"
- "# 16\n\n## Configuration and Monitoring\n\n数据库管理员的一项职责是配置集群，使其对当前的工作负载和环境表现良好。配置并非静态的：大多数情况下，你会发现自己需要对配置进行更改，因此熟悉检查和更改集群配置非常重要。\n\
  \n另一个重要且部分与配置相关的任务是监控集群，以便了解系统实际的运行情况以及是否存在需要解决的瓶颈和问题。此类问题有时可以通过更改集群配置、使用不同的硬件（例如增加可用内存）以及修复可能导致瓶颈的应用程序来解决。\n\
  \n本章将向你展示如何管理和检查集群配置、从头生成配置、查找当前配置中的错误和失误，以及通过丰富的统计子系统交互式地监控集群活动。最后，你将发现一个非常强大且常用的扩展\
  \ pg_stat_statements，它允许你以极大的细节和灵活性监控集群活动。\n\n本章将涵盖以下主题：\n\n- Cluster configuration\n\
  - Monitoring the cluster\n- Advanced statistics with pg_stat_statements\n\nLet’s\
  \ get started!\n\n## Technical requirements\n\n要完成本章，你需要了解以下内容：\n\n- 如何在 PGDATA\
  \ 目录中与配置文件交互\n- 如何以数据库管理员身份连接到你的集群\n- 如何针对系统目录执行 SQL 语句\n\n本章示例可以在 chapter_16 Docker\
  \ 镜像上运行，你可以在本书的 GitHub 仓库中找到它：https://github.com/PacktPublishing/Learn-PostgreSQL-Second-Edition。\n\
  \n## Cluster configuration\n\nPostgreSQL 通过一组包含用于引导集群并使其运行的指令和值的文本文件进行配置。我们在整本书中已经了解了配置文件是如何处理的，但在本章中，我们将详细解释配置是如何管理的。\n\
  \n有三个主要配置文件构成了任何配置的 *starting point*：\n\n- postgresql.conf 是主要的集群配置文件，包含启动集群、设置进程（如\
  \ WAL 发送者）和日志记录所需的所有数据，并配置集群如何接受连接（例如，在哪个 TCP/IP 地址上）。\n- postgresql.auto.conf 是一个由集群自动生成和编辑的文件，其中包含超级用户从集群内部更改的参数。你永远不应手动编辑此文件，但可以使用文本编辑器检查它以读取其内容。\n\
  - pg_hba.conf 是用于允许或拒绝客户端连接到集群的文件。它在第 3 章 Managing Users and Connections 中有详细说明，并与用户和角色身份验证机制相关。\n\
  \n通常，上述两个文件都位于包含所有集群数据的 PGDATA 目录中，但某些操作系统可能会将此类文件放置在其他目录中；例如，通常 Debian GNU Linux\
  \ 会将它们放置在 /etc/postgresql 中。\n\n> 在本书的 Docker 镜像中，配置文件保存在 PGDATA 目录下，即 /postgres/16/data。\n\
  \nPGDATA 目录中通常还保存着其他配置文件，但此处不予讨论。本节主要致力于 `postgresql.conf`，即默认配置文件。\n\n`postgresql.conf`\
  \ 文件是一个文本文件，通常带有有用的注释，其中包含一组配置参数。每个参数都以 `key = value` 的形式表示，其中 key 是配置参数名称，value\
  \ 是该参数的配置值。我们在前几章中见过一些配置参数。例如，`max_wal_senders = 2` 配置参数将 max_wal_senders 配置参数设置为\
  \ 2。\n\n每个配置参数必须位于单行上，所有以 `#` 符号开头的行都是注释，集群不会考虑这些注释。注释很有用，因为它们允许你添加有关特定配置意图的额外信息。例如，让我们看一下以下代码片段：\n\
  \n```\n```conf\n# set to 2 to allow pg_basebackup to work properly\nmax_wal_senders\
  \ = 2\n```\n```\n\n前面的示例清楚地提示了为什么参数被如此配置。你不需要在配置文件中放置注释，但记录你所做的事情以及原因是一个非常好的习惯。\n\
  \n参数可以被定义多次；在这种情况下，最后找到的定义是 PostgreSQL 使用的定义。\n\n如果你不想配置特定参数，可以删除该参数的行，使其完全从配置文件中消失，或者在前面加上注释符号，将该行转换为纯注释。需要注意的是，如果参数未在文件中配置，因为它缺失或被注释掉了，那么它将采用其默认值。每个参数都有一个默认值，你必须查阅文档以了解每个默认值；然而，默认安装的配置文件包含所有可用参数，并附带解释其用途和默认设置的注释。\n\
  \n每个配置参数只接受特定的一组值，具体取决于配置参数本身的类型。主要来说，你可以遇到数值、字符串值和列表（以逗号分隔）；还有一些值可以用测量单位表示，例如时间，如\
  \ 2ms（2 毫秒），或大小，如 2GB（2 千兆字节）。\n\n\n\n\n\n# 检查所有配置参数\n\n你可以通过对 pg_settings 特殊目录发出查询来检查来自实时系统的所有配置参数。该目录包含当前版本的\
  \ PostgreSQL 将接受的每个设置，以及默认值、当前值、参数目的的描述等等。\n\n作为示例，通过以下查询，你可以收集有关每个配置参数的信息，包括它们的简短和长描述、默认值和当前值：\n\
  \n```\nforumdb=> SELECT name, setting || ' ' || unit AS current_value, short_desc,\
  \ extra_desc, min_val, max_val, boot_val, reset_val FROM pg_settings;\n...\nname\
  \          | authentication_timeout\ncurrent_value | 360 s\nshort_desc    | Sets\
  \ the maximum allowed time to complete client authentication.\nextra_desc    |\n\
  min_val       | 1\nmax_val       | 600\nboot_val      | 60\nreset_val     | 360\n\
  ```\n\n在前面的示例中，authentication_timeout 已被设置为 360 秒，如 setting 列所示，其值可在 1 秒到 600 秒的范围内调整；boot_val\
  \ 是参数在未配置时将采用的默认值，设置为 60 秒。类似地，reset_val 列指示参数在更改后重置时将采用的值。\n\npg_settings 特殊目录还包含其他有用的信息，包括参数是从哪个文件和行号加载的。这些信息可用于快速找到配置参数在\
  \ postgresql.conf 文件或其他配置文件中设置的位置。作为示例，以下查询将显示每个参数是从哪里加载的：\n\n```\nforumdb=# SELECT\
  \ name, setting AS current_value, sourcefile, sourceline, pending_restart FROM pg_settings;\n\
  ...\nname          | log_destination\ncurrent_value | stderr\nsourcefile     | /postgres/16/data/postgresql.auto.conf\n\
  sourceline     | 4\npending_restart | f\n```\n\n正如你所见，在此示例安装中，log_destination 配置参数是从\
  \ /postgres/16/data/postgresql.auto.conf 文件加载的。这不是主要的 postgresql.conf 文件；它是一个 PostgreSQL\
  \ 自动生成的用于处理从集群内部更改的配置参数的文件。postgresql.auto.conf 的使用将在本章后面变得清晰；目前，知道配置参数已从另一个文件加载并且\
  \ pg_settings 清楚地报告了这一点就足够了。\n\n> 你需要拥有数据库超级用户权限才能收集额外信息，例如文件位置和行号。\n\npg_settings\
  \ 特殊目录中可以获得的另一条重要信息是：如果在运行时更改参数会发生什么？根据参数的性质，更改可以立即应用，也可以延迟到等待特定事件甚至集群重启。pending_restart\
  \ 列指示当前参数是否已从其启动时值更改以及该值是否已应用于集群。在前面的示例中，pending_restart 为 false，因此你看到的配置就是当前在集群上运行的有效配置。\n\
  \n查询 pg_settings 为你提供了了解当前配置状态所需的所有信息，但有一个快捷方式可以更快地获取参数的设置：SHOW 命令。特殊命令 SHOW 接受参数的名称并以人类可理解的形式报告该参数的值。作为示例，假设我们想检查\
  \ shared_buffers 内存值：\n\n```\nforumdb=> SHOW shared_buffers ;\nshared_buffers\n\
  ----------------\n128MB\n(1 row)\n```\n\n相同的信息显然可以从 pg_settings 中获得，使用更长的查询，并且需要将确切值转换为人类可读的形式（注意内存值以\
  \ 8kB 块表示）：\n\n```\nforumdb=> SELECT name, setting, unit FROM pg_settings WHERE\
  \ name = 'shared_buffers';\n      name      | setting | unit\n------------------+---------+------\n\
  shared_buffers | 16384   | 8kB\n(1 row)\n```\n\n因此，如果你只需要快速查看配置参数，SHOW 是正确的命令，而如果你需要有关确切值、参数在配置文件中设置的位置等更准确和完整的信息，则应查询\
  \ pg_settings 目录。\n\n# 查找配置错误\n\nPostgreSQL 提供了一个非常有用的目录 pg_file_settings，它让数据库管理员可以一目了然地查看所有配置参数及其加载的文件，从而提供有关错误的信息。以下查询从目录中提取所有信息，修剪后的输出为我们提供了一些重要信息：\n\
  \n```\npostgres=# SELECT name, setting, sourcefile, sourceline, applied, error FROM\
  \ pg_file_settings where name = 'log_destination';\n-[ RECORD 1 ]---------------------------------------------\n\
  name      | log_destination\nsetting   | stderr\nsourcefile | /postgres/16/data/postgresql.conf\n\
  sourceline | 444\napplied   | f\nerror     |\n-[ RECORD 2 ]---------------------------------------------\n\
  name      | log_destination\nsetting   | csvlog\nsourcefile | /postgres/16/data/postgresql.conf\n\
  sourceline | 818\napplied   | f\nerror     |\n```\n\n```\n- [ RECORD 3 ]-------------------------------------\n\
  name      | log_destination\nsetting   | stderr\nsourcefile | /postgres/16/data/postgresql.auto.conf\n\
  sourceline | 4\napplied   | t\nerror     |\n```\n\n正如你在上面的示例安装中所见，log_destination\
  \ 配置参数已被多次加载：恰好三次，来自不同的源文件。已应用的是来自 /postgres/16/data/postgresql.auto.conf 文件第 4\
  \ 行的配置设置，如 applied 列的状态所报告。如果参数包含错误，error 列将提供有关问题的提示。\n\n在同一文件或不同文件中多次定义参数并不是错误，而是一种覆盖该参数的方式。特殊视图\
  \ pg_file_settings 有助于找出为什么文件中定义的参数未被加载以及哪些参数被其他分散的定义覆盖。\n\n如果参数因包含错误而无法应用，error\
  \ 列将为你提供有关问题的提示，而 applied 列将显示为 false 值。\n\n# 嵌套配置文件\n\n你不必将每个参数都配置在 postgresql.conf\
  \ 文件中：你可以定义自己的微小且专注的配置文件，并指示 PostgreSQL 读取并将其内容添加到配置中。借助此功能，你可以为特定任务创建一组更小更干净的配置文件，从而使维护变得更简单。\n\
  \nPostgreSQL 提供三个主要指令来包含其他配置文件：\n\n- include_file: 在配置中包含单个文件\n- include_dir: 包含指定目录中的所有文件\n\
  - include_if_exists: 仅在文件存在时包含文件\n\n最后一个指令非常方便，因为如果包含的文件不存在，PostgreSQL 将抛出错误，而使用\
  \ include_if_exists，集群不会警告你如果要包含的文件尚未创建。这对于配置管理很有用，例如，你可以设置一个包含多个文件的主配置文件，并仅将这些文件分发给真正需要此类配置的系统。\n\
  \n为了给出一个具体的例子，考虑一个名为 `memory.conf` 的文件，它放置在 PGDATA 目录中，其内容如下：\n\n- `shared_buffers\
  \ = 321 MB`\n- `work_mem = 16 MB`\n\n然后在 `postgresql.conf` 文件末尾添加以下指令：\n\n```\n\
  ```conf\ninclude_if_exists = 'memory.conf'\n```\n```\n\n这样，一旦集群重启，`postgresql.conf`\
  \ 文件将指示集群加载另一个名为 `memory.conf` 的配置文件，而该文件又会覆盖几项内存设置（请记住，配置参数的最后一次定义是被选为应用的定义）。最终结果可以通过查询\
  \ `pg_file_settings` 目录来查看：\n\n```\n```text\npostgres=# SELECT * FROM pg_file_settings\
  \ WHERE name IN ('shared_buffers', 'work_mem');\n\n                    sourcefile\
  \              | sourceline | seqno |      name       |\nsetting | applied | error\n\
  ---------------------------------------------+------------+-------+-----------------+\n\
  ---------------------------------------------+----------+-------+-----------------\n\
  /postgres/16/data/postgresql.conf |    127 |   3 | shared_buffers |\n128MB     |\
  \ f       |\n/postgres/16/data/memory.conf     |      1 |  15 | shared_buffers |\n\
  321MB     | t       |\n/postgres/16/data/memory.conf     |      2 |  16 | work_mem\
  \       |\n16MB      | t       |\n(3 rows)\n```\n```\n\n正如你所见，`shared_buffers` 参数已被覆盖并从新创建的\
  \ memory 文件中应用，而 `work_mem` 在默认安装中被注释掉了，也已从包含的文件中应用（没有覆盖任何其他定义）。\n\n# 配置上下文\n\n\
  每个配置参数都属于一个所谓的 **context**，该组定义了 *何时* 可以应用对参数的更改。几个参数可以在集群生命周期期间更改并生效。然而，其他参数则不能，需要重启集群；配置参数的上下文有助于系统管理员了解更改何时生效。\n\
  \n\n\n\n\n配置上下文可以从 pg_settings 目录中提取，如以下示例所示：\n\n```\nforumdb=> SELECT distinct\
  \ context FROM pg_settings ORDER BY context;\n    context\n-----------------\n backend\n\
  \ internal\n postmaster\n sighup\n superuser\n superuser-backend\n user\n(7 rows)\n\
  ```\n\n如你所见，允许的配置上下文如下：\n\n- internal：此配置值取决于 PostgreSQL 源代码，并在编译时确定，因此除非你决定从头编译，否则无法更改。例如，每个内存页的大小都在源代码中定义。\n\
  - postmaster：此进程负责获取更改。换句话说，整个集群（及其主进程 postmaster）必须重启才能更改此项。\n- sighup：通过此项，集群在收到挂断信号时将感知到更改，通常是操作系统服务的重新加载。\n\
  - superuser-backend 和 backend：更改将应用于客户端和管理员连接。这样的更改将从两种类型的下一个连接开始即可感知。\n- user 和\
  \ superuser：这些更改将立即应用于当前连接，无论它是无特权连接还是超级用户连接。\n\n## 主要配置设置\n\nPostgreSQL 包含大量配置选项，描述所有选项需要一整本书。此外，配置取决于许多不同因素，包括集群工作负载和连接并发性。许多参数会为其他参数暗示不同的行为。因此，不可能提供简单有效的分步配置指南，但可以提供一些建议来帮助你开始调整集群。\n\
  \n在以下小节中，你将了解主要配置参数，具体取决于它们所属的主要类别。在应用更改之前，请花时间清楚地理解每个设置的作用，并记住配置上下文可能会阻止你立即看到结果。\n\
  \n## WAL 设置\n\nWAL 对于集群正常工作以及能够从崩溃中恢复至关重要。因此，与 WAL 相关的设置对集群的生命周期至关重要。\n\n主要设置如下：\n\
  \n- `fsync` 告诉集群在每次执行 COMMIT 时发出一次操作系统 `fsync(2)` 调用；也就是说，每当必须将内容存储到 WAL 段中时。\n\
  - `wal_level` 表示集群需要在 WAL 段中保留的信息量。\n- `wal_sync_method` 告诉 PostgreSQL 使用哪个有效的 `fsync(2)`\
  \ 系统调用。\n- `synchronous_commit` 告诉 PostgreSQL 每个 COMMIT 是否必须跟随立即且同步的 `fsync(2)`，还是刷新可以由\
  \ `wal_writer_delay` 定义的时间延迟。\n- `wal_writer_delay` 和 `wal_writer_flush_after` 确定一个名为\
  \ WAL writer 的进程在异步 COMMIT 模式下必须多久将数据刷新到磁盘一次。在每次 `wal_writer_delay` 毫秒或累积 `wal_writer_flush_after`\
  \ 兆字节数据后，异步提交将被刷新到磁盘。\n- `checkpoint_timeout`、`checkpoint_completion_target` 和 `max_wal_size`\
  \ 控制检查点，如第 11 章《事务、MVCC、WAL 和检查点》中所讨论的，我们在解释事务和 WAL 时说明了这一点。\n\n`fsync` 设置必须保持为开启，因为禁用它会使集群面临数据丢失的风险：文件系统不会在\
  \ COMMIT 时将数据刷新到磁盘，因此 PostgreSQL 无法保证数据已真正存储在磁盘上，在崩溃（例如断电）情况下，数据可能会丢失。设置此选项为关闭的场景非常少，但请记住（如果你确实找到了这样的理由）禁用此选项仍会使你的集群无法承受崩溃。\n\
  \n`wal_level` 设置表示 PostgreSQL 必须在 WAL 段中累积多少信息。WAL 的主要用途是使集群能够在崩溃后存活，但在复制场景中，WAL\
  \ 也用于将更改传播到其他集群。\n\nwal_level 设置可以设为 minimal，即单个集群拥有所有用于存活崩溃的信息，也可以设为 replica（默认值），这使得\
  \ WAL 也可用于物理复制场景，最后可以设为 logical，这使得 WAL 也包含用于逻辑复制场景的信息。\n\nwal_sync_method 允许管理员配置用于同步脏缓冲区的特定操作系统调用。所有\
  \ POSIX 操作系统都实现了 fsync(2)，但其中一些提供了特殊变体，具体取决于文件系统，其行为更快或更好。可以通过 wal_sync_method 指定要使用的系统调用的确切名称。通常，PostgreSQL\
  \ 会随操作系统一起提供适当的配置。\n\n但你如何发现最适合你的操作系统的最佳（或只是可用的）fsync(2) 实现？你可以在机器上运行 pg_test_fsync\
  \ 程序，以对你可能使用的可能方法以及最佳方法做出合理猜测。例如，在 FreeBSD 机器上，该程序提供以下输出：\n\n```\n$ pg_test_fsync\n\
  5 seconds per test\n\nO_DIRECT supported on this platform for open_datasync and\
  \ open_sync.\n\nCompare file sync methods using one 8kB write:\n(in wal_sync_method\
  \ preference order, except fdatasync is Linux's default)\n    open_datasync    \
  \                     n/a\n    fdatasync                     6845.727 ops/sec  \
  \  146 usecs/op\n    fsync                         3685.769 ops/sec    271 usecs/op\n\
  \    fsync_writethrough                    n/a\n    open_sync                  \
  \   2521.228 ops/sec    397 usecs/op\n...\n```\n\n你应该比较可用选项并选择最快的那个。因此，在前面的示例中，wal_sync_method\
  \ = open_datasync 是最佳选择。\n\nsynchronous_commit 是一个多选选项，表示在向发出 COMMIT 的事务返回“成功”状态之前，有多少\
  \ WAL 必须写入磁盘。默认情况下，此设置的值为 on，表示在事务被允许成功之前每个位都必须命中磁盘。\n\n将参数设为 off 意味着即使 WAL 未刷新到磁盘，事务也会成功。与\
  \ fsync 设置不同，将 synchronous_commit 设为 off 是安全的，并且不会导致任何数据丢失，因为异步提交由 wal_writer_delay\
  \ 控制，这意味着事务将被合并，但时间会晚一些。此参数还有其他值，所有这些都意味着 on 行为：local、remote_apply 和 remote_write。这些设置只有在复制场景中才有意义，当此集群充当主节点并由一个（或多个）从属集群跟随（复制）时。在此场景中，local\
  \ 意味着只要主节点已将每个位刷新到磁盘，事务就会成功（即默认的 on 行为）；另一方面，remote_write 会等待备库确认它们已接收到相同的 WAL 信息并将复制它，这意味着主节点已合并事务，备库也将很快这样做。最后，remote_write\
  \ 会等待事务成功，直到主节点和备库都将所有数据刷新到磁盘。\n\n## 内存相关设置\n\nPostgreSQL 利用系统的易失性 RAM 来缓存来自永久存储的数据，并管理将要稍后存储的数据。\n\
  \n与内存管理相关的主要设置如下：\n\n- shared_buffers 是 PostgreSQL 将用于缓存数据的内存量。\n- work_mem 是 PostgreSQL\
  \ 将按需提供以执行特定数据活动所用的内存量。\n- hash_mem_multiplier 用于确定连接可用于基于哈希操作的内存阈值。\n- maintenance_work_mem\
  \ 是 PostgreSQL 为其内部操作保留的内存量。\n- wal_buffers 是用于 WAL 段的缓存。\n\nshared_buffers 可能是这里最重要的设置，因为它决定了\
  \ PostgreSQL 将使用的总内存量。此内存将专门提供给 PostgreSQL 及其派生进程；该内存将不会提供给同一台机器上运行的其他服务。通常，你应该从系统总\
  \ RAM 的 25% 到 45% 之间开始。值过低会使 PostgreSQL 从永久存储加载和刷新数据，而值过高会使 PostgreSQL 与操作系统的文件系统缓存竞争，导致可能的性能问题。\n\
  \n\n\n\n\nwork_mem 是每个连接在执行特定数据重排操作时可使用的内存量，例如 SORT 或哈希连接中进行的操作。在处理基于哈希的任务时，一个连接可以在进程开始换出到磁盘之前消耗\
  \ work_mem * hash_mem_multiplier 的内存。在任何情况下，当一个进程无法再使用更多内存时，它将开始换出到磁盘——例如，将内存中的\
  \ SORT 转换为磁盘上的合并 SORT。\n\nmaintenance_work_mem 确定了每个会话用于特别密集的命令（如 VACUUM 和 CREATE\
  \ INDEX）的内存量。由于在一个连接中同时只能有一个此类命令处于活动状态，你可以根据需要服务的管理员连接数量来提高该值。\n\nwal_buffers 可能是你最容易调整的内存相关设置：它指示用于缓存\
  \ WAL 段的内存量。由于 WAL 段通常以 16 兆字节的块写入，这正是此类设置的理想值。\n\n## 进程信息设置\n\nPostgreSQL 是一个多进程系统，它为每个传入连接生成一个进程。有几个设置可以帮助从操作系统的角度监控每个与\
  \ PostgreSQL 相关的进程：\n\n- update_process_title 使每个进程报告它正在做什么；例如，当使用 ps(1) 和 top(1)\
  \ 等操作系统工具查询时，它正在执行的查询。\n- cluster_name 是一个助记名称，用于识别每个进程所属的集群，以防同一台机器上运行多个集群。\n\n\
  值得注意的是，这些设置可能会使系统在某些操作系统上运行变慢，例如 FreeBSD。\n\n日志相关设置已在第 14 章《日志记录和审计》中详细解释，因此在此不再讨论。\n\
  \n## 网络相关设置\n\n通常，PostgreSQL 在 TCP/IP 地址上监听传入连接，该地址由一组网络相关设置指定。主要设置如下：\n\n- listen_addresses\
  \ 指定要监听的 TCP/IP 地址。\n- port 指定 postmaster 等待传入连接的 TCP/IP 端口。\n- `max_connections`、`reserved_connections`\
  \ 和 `superuser_reserved_connections` 指定允许的传入连接数。\n- `authentication_timeout` 和 `ssl`\
  \ 表示身份验证超时和加密模式。\n\n`listen_addresses` 可以包含多个地址，用逗号分隔，以防服务器是多宿主的。它甚至可以指定为特殊值 *，表示服务器应监听所有可用地址。`port`\
  \ 指定 TCP/IP 端口号，默认为 5432。\n\n`max_connections` 是传入连接的最大允许数：如果达到此阈值，集群将不再允许更多连接。超级用户连接计为\
  \ `superuser_reserved_connection`，这是因为在紧急情况下，超级用户必须仍有一种方式连接到集群。最后，`reserved_connections`\
  \ 统计了具有特殊角色 `pg_use_reserved_connection` 的用户建立的连接数，并表示一组特殊用户（非超级用户）拥有保留的连接槽。因此，普通用户可用的空闲连接数为\
  \ `max_connections - superuser_reserved_connection - reserved_connections`。\n\n\
  `authentication_timeout` 是身份验证尝试在过期前的时长，而 `ssl` 使服务器能够在连接上处理 SSL 握手（此处不解释 SSL）。\n\
  \n> 有很多参数可以微调 SSL 和身份验证阶段，但本书未涵盖，因为它们也需要对这些主题有深入的背景知识。\n\n## 归档和复制设置\n\n有不同的归档和复制设置，处理集群如何归档其\
  \ WAL 以及如何作为主节点或从节点与其他集群通信。所有设置将在 *第 17 章，物理复制* 和 *第 18 章，逻辑复制* 中详细介绍，这里仅简要列出：\n\
  \n- `wal_level`（已在前一节讨论）表示 WAL 中的信息将如何使用。这可以是 `minimal`（用于独立系统）、`replica`（用于复制系统）或\
  \ `logical`（用于逻辑复制）。\n- `archive_mode`、`archive_command`、`archive_library` 和 `archive_timeout`\
  \ 管理归档模式——即将 WAL 存储到其他位置以进行时间点恢复或复制。\n- `primary_conninfo` 和 `primary_slot_name`\
  \ 用于确定从备节点到主节点的连接。\n- `hot_standby` 在复制系统上使用时，允许只读查询。\n- `max_standby_archive_delay`\
  \ 和 `max_standby_streaming_delay` 定义在备机上与主节点上的某些其他操作冲突的查询在被取消之前可以等待的时间。\n- `recovery_min_apply_delay`\
  \ 在备节点上引入延迟，以便它可以以时间偏移的方式跟随主节点。\n- `max_replication_slots` 和 `max_wal_senders` 用于定义将接受并使用的复制槽的数量以及将管理复制的进程数量。\n\
  - `synchronous_standby_names` 定义哪些节点在复制中被视为同步的，因此主节点在应用更改之前必须收到持续反馈。\n\n这些设置和其他复制相关设置将在\
  \ *第 17 章，配置和监控* 和 *第 18 章，复制* 中讨论。\n\n## Vacuum 和 autovacuum 相关设置\n\n有不同的设置可用于定义和调整\
  \ vacuum 和 autovacuum 设置。这些已在 *第 11 章，事务、MVCC、WAL 和检查点* 中讨论。\n\n## 优化器设置\n\nPostgreSQL\
  \ 优化器采用基于成本的方法。可以调整这些成本，如 *第 13 章，查询调优、索引和性能优化* 中所述。\n\n## 统计收集器\n\nPostgreSQL 利用\
  \ **统计收集器** 来收集有关集群中发生的情况的事实，正如你将在本章后面的 *监控集群* 部分学到的那样。\n\n由于收集这些数字对运行时影响很小，因此可以完全排除收集，或者过滤统计收集器以仅收集你真正感兴趣的事实。主要设置如下：\n\
  \n- `track_activities` 允许其他进程监控当前正在执行的命令或查询。\n- `track_counts` 收集有关表和索引使用的计数信息。\n\
  - `track_functions` 收集有关函数和存储过程使用的统计信息。\n- `track_io_timing` 允许我们统计在不同输入/输出操作中花费的时间。\n\
  - `stat_temp_directory` 是用于统计收集的临时存储的（相对）目录名。\n\n## 从实时系统修改配置\n\n可以通过数据库连接使用 ALTER\
  \ SYSTEM 命令从内部修改集群配置。\n\nALTER SYSTEM 为我们提供了一种以 SQL 方式设置参数值的方法，并且该参数将被追加到特殊文件 postgresql.auto.conf\
  \ 中，该文件位于 PGDATA 目录内。postgresql.auto.conf 文件在服务器启动或发出重载信号（HUP）时会自动加载，因此 postgresql.auto.conf\
  \ 中的参数将优先于 postgresql.conf 中的参数，最终结果是更改将像你手动编辑 postgresql.conf 文件一样应用。\n\nALTER\
  \ SYSTEM 只能由数据库管理员执行。例如，假设你发出以下命令：\n\n```\nforumdb=# ALTER SYSTEM SET archive_mode\
  \ = 'on';\nALTER SYSTEM\n```\n\n最终结果将是 postgresql.auto.conf 文件如下所示：\n\n```\n$ cat\
  \ /postgres/16/data/postgresql.auto.conf\n# Do not edit this file manually!\n# It\
  \ will be overwritten by the ALTER SYSTEM command.\narchive_mode = 'on'\n```\n\n\
  \n\n\n正如你所见，已更改的参数已按你手动编辑的方式放置在文件中。该文件包含一条警告横幅，说明不应手动编辑它，因为系统不会考虑你的更改并会覆盖其内容。\n\n\
  你也可以将 DEFAULT 指定为选项的值，这样该选项就会从 postgresql.conf.auto 文件中移除。ALTER SYSTEM 也支持 RESET\
  \ 以将设置重置为之前的值，或使用 RESET ALL 将 postgresql.auto.conf 中的所有设置全部重置。\n\n假设我们仅更改了 archive_mode，如前例所示，以下两个命令是等价的，并且会将已更改的设置从\
  \ postgresql.auto.conf 文件中移除：\n\n```\nforumdb=# ALTER SYSTEM SET archive_mode TO\
  \ DEFAULT;\nALTER SYSTEM\nforumdb=# ALTER SYSTEM RESET archive_mode;\nALTER SYSTEM\n\
  ```\n\n以下输入将移除 postgresql.auto.conf 中的所有已更改设置：\n\n```\nforumdb=# ALTER SYSTEM RESET\
  \ ALL;\nALTER SYSTEM\n```\n\n## 配置生成器\n\n与其从带注释的 postgresql.conf 文件开始并自行调优，你可以利用自动调优系统从头开始获取配置。这样的配置可能已经足够好，或者至少可作为进一步改进的起点，具体取决于你的需求以及生成该配置的工具的好坏。\n\
  \n一个不错的配置系统是 PGConfig，这是一个在线系统，可在 https://www.pgconfig.org 上使用，你可以在其中指定承载集群的主机的主要设置，例如内存、硬盘类型、并发等。\n\
  \n有了这些细节，如以下屏幕截图所示，系统可以根据你打算将集群用于的工作负载生成不同的配置：\n\n![](img/bbe5644feba3d6a2ab994dc7e6cecbf1_622_0.png)\n\
  \n图 16.1：PGConfig PostgreSQL 自动配置生成器\n\n该工具允许你选择多个预打包的配置，例如联机事务处理（OLTP）或联机分析处理（OLAP），甚至是\
  \ Web 应用程序。\n\n一旦你选择了最适合工作负载的配置，你可以将该配置导出为 postgresql.conf 文件，或作为一组 ALTER SYSTEM\
  \ 语句以 SQL 交互式脚本的形式执行，以便将配置应用到你的集群：\n\n![](img/bbe5644feba3d6a2ab994dc7e6cecbf1_623_0.png)\n\
  \n图 16.2：自动生成的配置示例\n\n正如你所见，结果是一堆可复制粘贴到“空白”配置文件中的配置参数。其思路是从此配置开始并在此基础上继续调优。\n\n\
  以下屏幕截图显示的是完全相同的配置，但以 ALTER SYSTEM 语句的形式生成；也就是说，你可以根据需要将其作为 SQL 脚本应用：\n\n![](img/bbe5644feba3d6a2ab994dc7e6cecbf1_624_0.png)\n\
  \n*图 16.3：基于 ALTER SYSTEM 命令的自动生成配置示例*\n\nPGConfig 只是你可以用来获取可开始工作的自定义配置的一个选项。当然，没有必要使用它，因为\
  \ PostgreSQL 自带默认配置，而且该配置生成器并不是提供集群最佳配置的“银弹”。无论如何，你都需要根据需求、工作负载和硬件来调优和修复参数以优化集群。\n\
  \n在下一节中，你将了解如何监控集群，以及如何发现可通过调优查询或集群配置来修复的瓶颈和问题。\n\n## 监控集群\n\n监控集群允许你在任何给定时间点了解集群正在做什么，并可能据此采取行动和反应，以避免数据库性能和可用性下降。PostgreSQL\
  \ 提供了一套丰富的目录，允许数据库管理员仅通过发出 SQL 语句和查询来监控整体活动。\n\n```\nquery          | delete from\
  \ tags;\ngranted        | t\nmode           | RowExclusiveLock\n...\n-[ RECORD 9\
  \ ]--------------------------------------------\n--\nusername       | luca\napplication_name\
  \ | psql\ndatname        | forumdb\nquery          | insert into tags( tag ) values(\
  \ 'FreeBSD' );\ngranted        | t\nmode           | ExclusiveLock\n```\n\n用户 luca\
  \ 对 forumdb 数据库有两个连接，一个连接已获取锁以删除元组，而另一个正在向 tags 表中插入元组。granted 列表示锁是否已获取，因此仅选择未授予的锁是获取阻塞查询建议的一个良好起点。mode\
  \ 列指示查询试图获取何种类型的锁。\n\n借助这些建议，并且再次感谢与 pg_stat_activity 的精确连接，你可以找到阻塞的查询，如以下示例所示（这是之前描述场景的延续）：\n\
  \n```\nforumdb=# SELECT query, backend_start, xact_start, query_start,\n    state_change,\
  \ state,\n    now()::time - state_change::time AS locked_since,\n    pid, wait_event_type,\
  \ wait_event\n  FROM pg_stat_activity\n WHERE wait_event_type IS NOT NULL\n ORDER\
  \ BY locked_since DESC;\n...\n-[ RECORD 6 ]--------------------------------------------\n\
  query          | insert into tags( tag ) values( 'FreeBSD' );\nbackend_start  |\
  \ 2023-09-14 08:26:57.762887+02\nxact_start     | 2023-09-14 08:27:00.017983+02\n\
  query_start    | 2023-09-14 08:27:14.745784+02\nstate_change   | 2023-09-14 08:27:14.775535+02\n\
  state          | idle in transaction\n```\n\n```\n```text\nlocked_since    | 00:07:33.411832\n\
  pid             | 60239\nwait_event_type | Client\nwait_event      | ClientRead\n\
  ```\n```\n\n正如你所见，该查询已等待 7 分钟 33 秒（`locked_since` 列），但查询处于事务中空闲状态（state 列），并且正在等待来自客户端的输入（`wait_event`\
  \ 和 `wait_event_type` 列）。换句话说，该查询正在等待用户完成事务（提交或回滚）。\n\n利用 `pg_locks` 可以帮助你跟踪事务的演变及其争用情况，并决定如何终止阻塞其他工作负载的查询。\n\
  \n还有一个名为 `pg_blocking_pids()` 的通用函数，它接受后端进程标识符作为参数，并返回阻塞该进程的进程标识符列表。\n\n## 检查数据库\n\
  \n你可以通过查询 `pg_stat_database` 特殊目录来获取有关数据库状态的详细信息。该目录提供有关 COMMIT 和 ROLLBACK 事务、死锁和冲突的信息。请注意，死锁和回滚是数据库中的自然事件，但如果数字快速增长，这可能意味着存在应用程序错误或有客户端试图在数据库中做错误的事情从而被迫回滚。\n\
  \n例如，通过使用以下查询，你可以获取有关数据库的详细信息：\n\n```\n```sql\nforumdb=# SELECT datname, xact_commit,\
  \ xact_rollback, blks_read,\nconflicts, deadlocks,\n        tup_fetched, tup_inserted,\
  \ tup_updated, tup_deleted, stats_reset\n        FROM pg_stat_database;\n...\n-[\
  \ RECORD 6 ]+-----------------------------\ndatname       | forumdb\nxact_commit\
  \   | 802\nxact_rollback | 9\nblks_read     | 1800\nconflicts     | 0\ndeadlocks\
  \     | 0\ntup_fetched   | 32977\n```\n```\n\n```\ntup_inserted | 1391\ntup_updated\
  \ | 46\ntup_deleted | 0\nstats_reset |\n```\n\n正如你所见，forumdb 数据库没有任何冲突或死锁，已提交事务的数量（xact_commit\
  \ 列）远高于已中止事务的数量（xact_rollback 列）。因此，我们可以假设数据库正常，并且应用程序发出的查询良好。\n\n最后一列 stats_reset\
  \ 特别重要，因为它指示数据库的统计信息是否已被重置，即删除。了解统计信息重置以来经过了多少时间有助于验证数据库。如果该列为空，则表示数据库统计信息从未被手动重置过。\n\
  \n## 检查表和索引\n\npg_stat_user_tables 和 pg_stat_user_indexes 特殊目录提供有关表或索引使用情况的详细信息，例如元组数量、读写次数等。\n\
  \n为了更好地理解，考虑一个表中某些事务已被删除或更新并插入了新记录的表；以下查询提供有关该表状态的详细信息：\n\n```\nforumdb=# SELECT\
  \ relname, seq_scan, idx_scan,\n    n_tup_ins, n_tup_del, n_tup_upd, n_tup_hot_upd,\n\
  \    n_live_tup, n_dead_tup,\n    last_vacuum, last_autovacuum,\n    last_analyze,\
  \ last_autoanalyze\n    FROM pg_stat_user_tables;\n\n-[ RECORD 1 ]---------------------------------------------\n\
  relname | tags\nseq_scan | 20\nidx_scan | 0\nn_tup_ins | 100007\nn_tup_del | 63\n\
  ```\n\n\n\n| n_tup_upd | 200030 |\n| n_tup_hot_upd | 106 |\n| n_live_tup | 100000\
  \ |\n| n_dead_tup | 50000 |\n| last_vacuum | |\n| last_autovacuum | 2023-09-15 15:13:47.424223+00\
  \ |\n| last_analyze | |\n| last_autoanalyze | 2023-09-15 15:13:47.60569+00 |\n\n\
  `last_vacuum`、`last_analyze`、`last_autovacuum` 和 `last_autoanalyze` 列对于理解手动或自动清理和分析是否在该表上运行特别重要；这些信息对于理解自动守护进程是否正常工作可能至关重要。`n_live_tup`\
  \ 列根据 MVCC（参见*第11章，事务、MVCC、WAL和检查点*）报告当前可见的元组，而 `n_dead_tup` 列报告不再可见但仍然占用空间、但将被手动或自动清理回收的元组数量。\n\
  \n其他列几乎不言自明，`seq_scan` 和 `idx_scan` 分别是表通过顺序扫描或通过可用索引之一被访问的次数；`n_tup_ins`、`n_tup_upd`\
  \ 和 `n_tup_del` 分别提供了有关新插入多少个元组以及更新或删除了多少个元组的信息。`n_tup_upd_hot` 列报告通过一种称为 **仅堆元组（HOT）**\
  \ 的机制原地更新的元组数量，而不是创建新元组。\n\n`pg_stat_user_indexes` 特殊目录提供了有关现有索引使用情况的详细信息。特别是，`idx_scan`、`idx_tup_read`\
  \ 和 `idx_tup_fetch` 字段指定了索引被使用的次数、读取了多少索引元组，以及借助索引获得了多少表元组。有关更多信息，请参见*第13章，查询调优、索引和性能优化*。\n\
  \n还有其他成对的目录，其名称中包含“all”或“sys”，表示它们引用所有可用的表（包括 PostgreSQL 内部表），或者仅引用后者（系统表）。因此，`pg_stat_all_tables`\
  \ 与 `pg_stat_user_tables` 相同，但也包含系统表的信息，这些信息保存在 `pg_stat_sys_tables` 中。`pg_stat_all_indexes`\
  \ 也是如此；也就是说，它是 `pg_stat_user_indexes` 和 `pg_stat_sys_indexes` 的并集。\n\n## 更多统计信息\n\
  \nPostgreSQL 包含一组非常丰富的与统计相关的目录，由于篇幅限制，这里无法全部描述。\n\n其中一些最重要的事项包括：\n\n- `pg_stat_replication`、`pg_stat_replication_slots`、`pg_stat_wal_receiver`\
  \ 和 `pg_stat_subscription` 收集有关集群副本状态的信息。\n- `pg_stat_bgwriter` 获取有关输入/输出的信息。\n\
  - `pg_stat_archiver` 获取有关 WAL 归档方式的信息。\n- `pg_statio_user_tables`、`pg_statio_user_indexes`\
  \ 以及相关的 `pg_statio_all_tables` 和 `pg_statio_all_indexes` 提供表或索引级别的输入/输出信息，指示缓冲区缓存的命中数和未命中数，以及从存储中读取新页面的情况。\n\
  - `pg_stat_database` 和 `pg_stat_database_conflicts` 提供有关数据库状态的信息，包括已执行的事务、冲突、回滚等。\n\
  \n还有大量的*进度*统计信息，仅显示正在进行的操作及其进度状态。您最可能想要使用的进度统计信息包括：\n\n- `pg_stat_progress_analyze`\
  \ 和 `pg_stat_progress_vacuum` 分别提供有关任何 ANALYZE 或 VACUUM 操作的信息。\n- `pg_stat_progress_cluster`\
  \ 提供有关任何 CLUSTER 或 VACUUM FULL 操作进度的信息。\n- `pg_stat_progress_copy` 提供有关任何 COPY 命令的信息，因此对于与\
  \ pg_dump 相关的活动也很有用。\n- `pg_stat_progress_create_index` 显示索引创建的执行情况。\n- `pg_stat_progress_basebackup`\
  \ 显示有关基础备份的信息，这是一种复制正在运行的集群的物理方式。\n\n您应该花时间熟悉所有统计目录，以便能够自信地监控您的集群。\n\n在下一节中，您将了解一个非常方便的扩展，它可以帮助您管理集群并掌控集群活动。\n\
  \n## 使用 pg_stat_statements 的高级统计\n\n虽然 PostgreSQL 统计收集器功能丰富且成熟，但监控连接活动可能有点棘手，因为\
  \ `pg_stat_activity` 目录不提供历史信息。例如，正如我们之前解释的，将只有单个元组包含最后执行的语句，因此不会提供历史记录或扩展详细信息。\n\
  \n`pg_stat_statements` 扩展解决了这个问题，它提供了一个单一视图，为您提供已执行语句的完整历史、执行时间和其他在自省时非常有用的小细节。此外，`pg_stat_statements`\
  \ 提供了同一语句已执行次数的计数，这提供了查询为了优化目的可能需要关注的重要信息。\n\n几个监控工具要求安装 `pg_stat_statements` 以收集数据。\n\
  \n在以下小节中，您将学习如何安装此扩展并使用它。\n\n### 安装 pg_stat_statements 扩展\n\n此扩展随 PostgreSQL 一起提供，因此您唯一需要做的就是配置数据库集群以使用它。由于\
  \ `pg_stat_statements` 需要共享库，您需要配置配置（postgresql.conf 文件）中的 `shared_preload_libraries`\
  \ 设置并重启集群。\n\n第一步是在 postgresql.conf 中进行以下设置：\n\n```\nshared_preload_libraries =\
  \ 'pg_stat_statements'\n```\n\n或者使用如下的 ALTER SYSTEM：\n\n```\nALTER SYSTEM SET shared_preload_libraries\
  \ to 'pg_stat_statements';\n```\n\n由于 `pg_shared_preload_libraries` 是一个上下文为 postmaster\
  \ 的参数，您需要重启集群以应用更改。\n\n`pg_stat_statements` 收集有关您所有集群的信息，但它只会将此类信息导出到您在其中创建扩展的数据库中，在我们的示例中是\
  \ forumdb 数据库：\n\n```\n$ psql -U postgres -c \"CREATE EXTENSION pg_stat_statements;\"\
  \ forumdb\nCREATE EXTENSION\n```\n\n该扩展现在可以使用了。\n\n![](img/bbe5644feba3d6a2ab994dc7e6cecbf1_633_0.png)\n\
  \n### 使用 pg_stat_statements\n\n一旦启用 `pg_stat_statements`，它就会开始收集信息。该扩展的运行时开销非常小，因此您也可以在生产系统中保持启用它。\n\
  \n由于 `pg_stat_statements` 收集来自整个集群的数据，因此将 `pg_stat_statements` 特殊视图与其他目录（如 `pg_database`\
  \ 和 `pg_authid`）连接起来有助于分别收集有关语句在其中执行的数据库和用户名的信息。以下查询提供了示例：\n\n```sql\nforumdb=#\
  \ SELECT auth.rolname,query, db.datname, calls, min_exec_time,\nmax_exec_time\n\
  \    FROM pg_stat_statements\n        JOIN pg_authid auth ON auth.oid = userid\n\
  \        JOIN pg_database db ON db.oid = dbid\nORDER BY calls DESC;\n...\nrolname\
  \       | postgres\nquery         | SELECT count(*) FROM forum.posts WHERE last_edited_on\
  \ >=\nCURRENT_DATE - $1\ndatname       | forumdb\ncalls         | 17\nmin_exec_time\
  \ | 0.037292\nmax_exec_time | 0.04165\n```\n\n前面的示例显示，自 `pg_stat_statements` 开始收集数据以来，该查询已执行了\
  \ 17 次，运行时间在 0.037 到 0.042 毫秒之间。根据每个查询的频率和计时，通过索引检查和优化该查询可能很有意义。\n\n在上面的示例中，查询被报告为*规范化查询*：每个参数，即使是字面量，都被移除并替换为占位符\
  \ $1（其他参数将被标记为 $2、$3，依此类推）：`SELECT count(*) FROM forum.posts WHERE last_edited_on\
  \ >= CURRENT_DATE - $1`。\n\n\n\n\n\nThe idea is to track a group of queries that\
  \ have the same normalized text so that you can get an idea of how many times such\
  \ a group has been executed, even if with different arguments.\n\nThe `pg_stat_statements`\
  \ special view keeps track of the most frequently executed queries up to the value\
  \ of the configuration parameter `pg_stat_statements.max`, which defaults to 5000.\
  \ Once the limit is reached, the least executed queries will be discarded in favor\
  \ of fresh new ones. This ensures that the space occupied by the `pg_stat_statements`\
  \ table will remain pretty much constant without any regard to the number of executed\
  \ statements.\n\nThe `pg_stat_statements` view provides many fields that cannot\
  \ be discussed in detail here, ranging from planning time to buffers and I/O activity.\
  \ This extension is very useful when you want to deal with the workload of your\
  \ cluster.\n\n## Resetting data collected from pg_stat_statements\n\nIt is possible,\
  \ at any given time, to reset all the data that’s been collected by the extension\
  \ that’s invoking the `pg_stat_statements_reset()` function as a database administrator.\
  \ The function will erase all the data that’s been collected and will allow the\
  \ extension to collect new data from scratch. This can be useful when you want to\
  \ test new configurations or hardware without having the collected data be biased\
  \ due to old statistics:\n\n```\n```sql\nformundb=# SELECT pg_stat_statements_reset();\n\
  ```\n```\n\nBy default, pg_stat_statements data is kept across clean database shutdowns\
  \ and restarts.\n\n## Tuning pg_stat_statements\n\nThe extension allows database\
  \ administrators to limit the amount of data that’s collected. In particular, you\
  \ can tune the following parameters in your postgresql.conf configuration file:\n\
  \n- `pg_stat_statements.max` indicates the maximum number of individual queries\
  \ to collect.\n- `pg_stat_statements.save` is a Boolean that indicates whether the\
  \ content of the collected data must survive a clean system reboot. By default,\
  \ this setting is true.\n- `pg_stat_statements.track` allows you to specify the\
  \ nesting level to track. With the top value, the extension will collect data about\
  \ the query that was issued directly within clients and within tracking nested statements.\
  \ This is triggered by the execution of other statements (for example, in function\
  \ statements). With the value of all, the extension will trigger every statement\
  \ and its descendants, while with none, no data will be collected about user statements.\n\
  - `pg_stat_statements.track_utility` tracks all statements that are not in SELECT,\
  \ INSERT, UPDATE, or DELETE – in other words, “non-ordinary” statements. By default,\
  \ this setting is on.\n\nUsually, you don’t have to tune these settings since `pg_stat_statements`\
  \ comes already configured to track what most use cases need.\n\n## Summary\n\n\
  In this chapter, you learned how PostgreSQL manages configuration through a main\
  \ text file, `postgresql.conf`, that can be split into smaller files, including\
  \ the automatically loaded `postgresql.auto.conf`, which is always loaded at the\
  \ end of the configuration process. Every configuration option can be edited in\
  \ the configuration file and can be inspected within the database thanks to dedicated\
  \ system catalogs. This allows the database administrator to not only have a clear\
  \ understanding of the currently running configuration but to also search for configuration\
  \ errors and incorrectly loaded settings.\n\nPostgreSQL also collects *statistics*;\
  \ that is, runtime data that was gathered during the cluster’s operational time.\
  \ Those statistics can help an administrator understand what is going on, or what\
  \ happened in the near past, in the cluster. Thanks to a different set of catalogs,\
  \ which was exposed in this chapter, you learned how to dig into the details of\
  \ all the information that PostgreSQL has collected for you. Being able to track\
  \ and analyze what single applications, users, and connections are doing in a specific\
  \ moment against the cluster provides database administrators with a great way to\
  \ fix bottlenecks and other problems, thus helping to improve the cluster experience.\n\
  \nFinally, you learned about the `pg_stat_statements` extension, thanks to which\
  \ it is possible to collect historical data about query execution and timing so\
  \ that it is possible to apply optimization and deep analysis of the cluster activity.\n\
  \nNow that you’ve understood how to configure and monitor your cluster, it is time\
  \ to learn how to replicate this. The next chapter will show you how to perform\
  \ physical replication by configuring the cluster appropriately.\n\n## Verify your\
  \ knowledge\n\n- What is a configuration context?\n\nA configuration context defines\
  \ how the cluster will perceive changes to a configuration parameter – for example,\
  \ only at boot time or at the next incoming connection. See the *Configuration contexts*\
  \ section for more details.\n\n- What is the difference between the catalogs pg_settings\
  \ and pg_file_settings?\n\nThe pg_settings catalog shows the values of every configuration\
  \ parameter, as well as its admitted and valid values; the pg_file_settings catalog\
  \ shows where (i.e., in which file and at which line) a configuration parameter\
  \ has been found and loaded. See the *Inspecting all configuration parameters* section\
  \ for more details.\n\n- Besides editing configuration files, how can you modify\
  \ the cluster configuration via SQL statements?\n\nYou can issue an ALTER SYSTEM\
  \ command to change the values of a configuration setting. Changes will be written\
  \ into the postgresql.auto.conf file. See the *Modifying the configuration from\
  \ a live system* section for more details.\n\n- How can you get information about\
  \ running connections, transactions, and queries?\n\nThe special catalog pg_stat_activity\
  \ provides information about every single backend process, its running (or last\
  \ run) query, and its transaction state. See the *Information about running queries\
  \ and connections* section for more details.\n\n- What does the pg_stat_statements\
  \ extension do?\n\nThe pg_stat_statements extension provides a historical view of\
  \ the most commonly repeated queries, with information about the running times,\
  \ the number of executions, and other details. See the *Advanced statistics with\
  \ pg_stat_statements* section for more details.\n\n## References\n\n- PostgreSQL\
  \ cluster configuration, official documentation: https://www.postgresql.org/docs/current/runtime-config.html\n\
  - PGConfig online configurator: https://www.pgconfig.org/\n- PostgreSQL statistics\
  \ collector official documentation: https://www.postgresql.org/docs/current/monitoring-stats.html\n\
  - PostgreSQL pg_stat_statements official documentation: https://www.postgresql.org/docs/current/pgstatstatements.html\n\
  \n## Learn more on Discord\n\nTo join the Discord community for this book – where\
  \ you can share feedback, ask questions to the author, and learn about new releases\
  \ – follow the QR code below:\n\nhttps://discord.gg/jYWCjF6Tku\n\n![](img/bbe5644feba3d6a2ab994dc7e6cecbf1_637_0.png)\n"
- "## 17\n\n## Physical Replication\n\nWhen a database, after passing the development\
  \ and testing phases, arrives in production, the first problem that the DBA must\
  \ address is managing replicas. Replicas must be managed in real time and automatically\
  \ updated. Replicas allow us to always have a copy of our data updated in real time\
  \ on another machine. This machine can be placed in the same data center as our\
  \ data or in a different one. This chapter differs from all that we have seen previously\
  \ in that we will talk about physical replication. In PostgreSQL, starting from\
  \ version 9.x, it is possible to have physical replication natively. We will talk\
  \ about what physical replication means, and we will see how to create a replica\
  \ server and how to manage it. We will also see that it is possible to have synchronous\
  \ or asynchronous replicas and that there can be multiple replicas of the same database,\
  \ as well as the possibility of having replicas in a cascade.\n\nIn this chapter,\
  \ we will return to the topic of WAL, something we have already discussed in Chapter\
  \ 11, Transactions, MVCC, WAL, and Checkpoints. In order to execute the commands\
  \ that will be shown in this chapter, we need to install a PostgreSQL server on\
  \ two machines, or install two instances of PostgreSQL on the same machine but running\
  \ on different ports. In the rest of the chapter, it will be presumed that you have\
  \ two PostgreSQL installations available on different machines, to better simulate\
  \ the situation of a real production environment, and starting from this chapter,\
  \ we will learn how to install and configure a physical replication.\n\n\n\n\n\n\
  在本章中，当我们讨论如何安装复制系统时，我们将不使用 Docker 容器；这是因为要安装复制服务，我们需要在副本服务器上关闭 postgresql 服务，而在\
  \ Docker 环境中关闭一个服务会关闭整个容器。然而，在 Docker 上，关闭 postgresql 并同时重启它可以在 Docker 容器首次启动时完成，因此为了更好地理解如何在生产服务器上安装副本，最好不要使用\
  \ Docker 容器（即使在 GitLab 仓库中你也可以找到一些可用的容器）。在本章中，Docker 仅用于帮助不想安装副本服务器而想了解物理复制如何工作的读者；对于所有与安装部分有关的内容，我们将参考的不是\
  \ Docker 镜像的路径，而是 Debian 服务器的路径。\n\n## 技术要求\n\n在 Learn PostgreSQL GitHub 仓库中，你可以找到三个\
  \ Docker 镜像：\n\n- **chapter17_streaming**：主/副本异步复制；如果你想在以下命令启动容器后使用副本容器：\n  \n \
  \ ```\n  chapter_17$ bash run-pg-docker.sh chapter17_streaming\n  ```\n  \n  你必须运行：\n\
  \  \n  ```\n  chapter_17$ bash run-pg-docker_replica.sh chapter17_streaming\n  ```\n\
  - **chapter17_synchronous**：主/副本同步复制；如果你想在以下命令启动容器后使用副本容器：\n  \n  ```\n  chapter_17$\
  \ bash run-pg-docker.sh chapter17_synchronous\n  ```\n  \n  你必须运行：\n  \n  ```\n\
  \  chapter_17$ bash run-pg-docker_replica.sh chapter17_synchronous\n  ```\n- **chapter17_delayed**：主/副本延迟复制；如果你想在以下命令启动容器后使用副本容器：\n\
  \  \n  ```\n  chapter_17$ bash run-pg-docker.sh chapter17_delayed\n  ```\n  \n \
  \ 你必须运行：\n  \n  ```\n  chapter_17$ bash run-pg-docker_replica.sh chapter17_delayed\n\
  \  ```\n\n所有副本容器在我们退出主容器时都会停止。\n\n在本章中，我们将涵盖以下主题：\n\n- 探索基本复制概念\n- 管理流复制\n\n## 探索基本复制概念\n\
  \n在 PostgreSQL 中，有两种物理复制技术：\n\n- **异步复制：** 在异步复制中，主设备（源）向次设备（目标）发送连续的数据流，而不会从目标接收任何返回代码。这种复制方式的优点是速度快，但它带来了更大的数据丢失风险，因为接收到的数据未得到确认。\n\
  - **同步复制：** 在同步复制中，源向目标发送数据，即第二台服务器；此时，服务器确认更改已正确写入。如果检查成功，则传输完成。\n\n两种方法各有利弊，在本章的\
  \ *管理流复制* 部分，我们将对它们进行分析。\n\n## 物理复制和 WAL\n\n让我们简要总结一下我们已经了解的关于 MVCC 和 WAL 段的内容：我们已经看到\
  \ PostgreSQL 如何使用 WAL 段将数据存储在磁盘上，正如我们在 *第 11 章，事务、MVCC、WAL 和检查点* 中所见，WAL 段主要用于崩溃事件。崩溃后，PostgreSQL\
  \ 会回溯 WAL 段并从上次检查点开始重新应用到数据；在崩溃后的恢复时间内，服务器将自己置于恢复状态。\n\n以下是关于 WAL 段的关键信息摘要：\n\n\
  - WAL 大小固定为 16 MB。\n- 默认情况下，WAL 文件在它们比最新检查点旧时就会被删除。\n- 我们可以使用 wal_keep_segments\
  \ 维护额外的 WAL 段。\n- WAL 段存储在 pg_wal 目录中，如下所示：\n\n```\npostgres@pg2:~/16/main/pg_wal$\
  \ ls -alh\ntotal 17M\ndrwx------  3 postgres postgres 4.0K May 22 09:52 .\ndrwx------\
  \ 19 postgres postgres 4.0K May 22 10:18 ..\n-rw-------  1 postgres postgres 16M\
  \ May 22 10:18\n000000010000000000000001\ndrwx------  2 postgres postgres 4.0K May\
  \ 22 09:52 archive_status\n```\n\n## wal_level 指令\n\nwal_level 指令设置应存储在 WAL 段中的信息类型。默认值是\
  \ minimal。采用此值时，存储在 WAL 段中的所有信息都可以支持归档和物理复制。\n\n> 有关更多信息，请参阅 https://www.postgresql.org/docs/current/runtime-config-wal.html#GUC-WAL-LEVEL。\n\
  \n因此，在本章中，我们将使用 wal_level=replica 值，这是默认值，而在下一章中，我们将使用 wal_level=logical。我们必须记住，每次更改\
  \ wal_level 参数时都需要重启 PostgreSQL 服务器。\n\n## 为流复制准备环境设置\n\n在本节中，我们将准备我们需要进行的两个服务器：第一个是主服务器机器，第二个是副本服务器。因此，让我们继续安装两台虚拟机。在以下示例中，我们将使用两台\
  \ Debian Linux 虚拟机，主服务器的 IP 为 192.168.122.10，复制服务器的 IP 为 192.168.122.11。在本章中，所有路径均指安装在\
  \ Debian 上的 PostgreSQL 16 实例，例如 /var/lib/postgresql/16/main。\n\n1. 对于主服务器，我们将看到以下输出：\n\
  \n```\nroot@pg1# ip addr\n1: lo: <LOOPBACK,UP,LOWER_UP> mtu 65536 qdisc noqueue\
  \ state UNKNOWN\ngroup default qlen 1000\n    link/loopback 00:00:00:00:00:00 brd\
  \ 00:00:00:00:00:00\n    inet 127.0.0.1/8 scope host lo\n       valid_lft forever\
  \ preferred_lft forever\n    inet6 ::1/128 scope host\n       valid_lft forever\
  \ preferred_lft forever\n2: enp1s0: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc\
  \ fq_codel\nstate UP group default qlen 1000\n    link/ether 52:54:00:5c:df:f4 brd\
  \ ff:ff:ff:ff:ff:ff\n    inet 192.168.122.10/24 brd 192.168.122.255 scope global\
  \ enp1s0\n        valid_lft forever preferred_lft forever\n    inet6 fe80::5054:ff:fe5c:dff4/64\
  \ scope link\n        valid_lft forever preferred_lft forever\n\nroot@pg1:# su -\
  \ postgres\npostgres@pg1:~$ psql\npsql (16)\nType \"help\" for help.\n\npostgres=#\n\
  ```\n\n2. 同样，对于副本服务器，我们将有以下内容：\n\n```\nroot@pg2:~# ip addr\n1: lo: <LOOPBACK,UP,LOWER_UP>\
  \ mtu 65536 qdisc noqueue state UNKNOWN\ngroup default qlen 1000\n    link/loopback\
  \ 00:00:00:00:00:00 brd 00:00:00:00:00:00\n    inet 127.0.0.1/8 scope host lo\n\
  \        valid_lft forever preferred_lft forever\n    inet6 ::1/128 scope host\n\
  \        valid_lft forever preferred_lft forever\n2: enp1s0: <BROADCAST,MULTICAST,UP,LOWER_UP>\
  \ mtu 1500 qdisc fq_codel\nstate UP group default qlen 1000\n    link/ether 52:54:00:93:47:18\
  \ brd ff:ff:ff:ff:ff:ff\n    inet 192.168.122.11/24 brd 192.168.122.255 scope global\
  \ enp1s0\n        valid_lft forever preferred_lft forever\n    inet6 fe80::5054:ff:fe93:4718/64\
  \ scope link\n        valid_lft forever preferred_lft forever\nroot@pg2:~# su -\
  \ postgres\npostgres@pg2:~$ psql\npsql (16)\nType \"help\" for help.\n\npostgres=#\n\
  ```\n\n3. 让我们检查一下两个服务器之间是否存在连接。\n\n使用 ping 命令，我们将进行简单测试以检查节点 pg1 是否可以连接到节点 pg2，以及节点\
  \ pg2 是否可以连接到节点 pg1：\n\n```\npostgres@pg1:~$ ping 192.168.122.11\nPING 192.168.122.11\
  \ (192.168.122.11) 56(84) bytes of data.\n64 bytes from 192.168.122.11: icmp_seq=1\
  \ ttl=64 time=0.292 ms\n64 bytes from 192.168.122.11: icmp_seq=2 ttl=64 time=0.406\
  \ ms\n\npostgres@pg2:~$ ping 192.168.122.10\nPING 192.168.122.10 (192.168.122.10)\
  \ 56(84) bytes of data.\n64 bytes from 192.168.122.10: icmp_seq=1 ttl=64 time=0.536\
  \ ms\n64 bytes from 192.168.122.10: icmp_seq=2 ttl=64 time=0.359 ms\n```\n\n现在一切就绪，让我们开始探索物理复制的细节。\n\
  \n## 管理流复制\n\n在本节中，我们将讨论为什么我们需要副本。\n\n![](img/bbe5644feba3d6a2ab994dc7e6cecbf1_644_0.png)\n\
  \n图 17.1：主/副本架构\n\n在生产环境中，你通常需要在系统崩溃后尽快恢复。为此，我们必须使用流复制技术。为了使这成为可能，我们至少需要两台服务器，一台主服务器和一台次服务器。主服务器执行应用程序程序将请求的所有操作；副本服务器仅可用于读操作，并且数据会实时复制。\n\
  \n## 流复制的基本概念\n\n流复制的思路是将 WAL 文件从主服务器复制到另一台（副本）服务器。\n\n\n\n\n\nThe replica server\
  \ will be in a state of continuous recovery, and it continuously executes the WAL\
  \ that is passed by the primary machine; this way, the replica machine binarily\
  \ replicates the data of the primary machine through the WAL.\n\nAs we’ve seen in\
  \ *Chapter 15, Backup and Restore*, in a classic PITR situation, WAL segments are\
  \ saved somewhere by the primary, and then they are taken by the recovery machine\
  \ using manual scripts:\n\n![](img/bbe5644feba3d6a2ab994dc7e6cecbf1_645_0.png)\n\
  \nIn a streaming replication context, a communication channel will be open between\
  \ the replica and primary, and the primary will send the WAL segments through it:\n\
  \n![](img/bbe5644feba3d6a2ab994dc7e6cecbf1_645_1.png)\n\nThe replica server will\
  \ receive the WAL segments and rerun them, remaining in a permanent recovery state.\n\
  \nWe will now look at how to perform asynchronous physical replication. The technique\
  \ is very similar to PITR.\n\n## Asynchronous replication environment\n\nLet’s prepare\
  \ our environment. We need two servers: the first one will be called pg1, and its\
  \ IP will be 192.168.122.10; the second one will be called pg2, and its IP will\
  \ be 192.168.122.11. Let’s take a look at the preparatory steps for physical replication.\n\
  \nOn the primary server, we need to do the following:\n\n- 1. The first thing we\
  \ have to do is modify listen_addresses so that it listens to the network. If we\
  \ set listen_addresses = '*', PostgreSQL will listen to any IP; otherwise, we can\
  \ specify a list of IP addresses separated by commas. This change requires a restart\
  \ of the PostgreSQL service.\n- 2. We need to create a new user that is able to\
  \ perform the replication:\n- 3. We have to modify the pg_hba.conf file so that\
  \ from the replica machine with the user replicarole, it is possible to reach the\
  \ primary machine:\n- 4. To make this configuration active, we need to run a reload\
  \ of the PostgreSQL server. For example, we can run the following:\n- 5. On the\
  \ replica server, we have to turn off the PostgreSQL service, destroy the PGDATA\
  \ directory, and remake it – this time, empty and with the right permissions. To\
  \ do this, we can use these statements:\n\n```\npostgres=# CREATE role replicarole\
  \ WITH REPLICATION ENCRYPTED PASSWORD 'SuperSecret' LOGIN;\nCREATE ROLE\n```\n\n\
  ```\nhost    replication    replicarole    192.168.122.11/32\nscram-sha-256\n```\n\
  \n```\npostgres=# select pg_reload_conf();\n pg_reload_conf\n-----------------\n\
  \ t\n(1 row)\n```\n\n```\nroot@pg1:/# systemctl stop postgresql\nroot@pg1:/# cd\
  \ /var/lib/postgresql/16/\nroot@pg1:/# rm -rf main\nroot@pg1:/# mkdir main\n```\n\
  \n## The slot way\n\nIn PostgreSQL, there is another approach that can be used to\
  \ solve the problem of storing WAL segments: the slot technique. Through the slot\
  \ technique, we can tell PostgreSQL to keep all the WAL segments on the primary\
  \ until they have been transferred to the replica servers. In this way, we have\
  \ dynamic, variable, and fully automated management of the number of WAL segments\
  \ that the primary server must keep as a buffer. This is a very easy way to manage\
  \ our physical replicas, and it is the method we will focus on in this book.\n\n\
  The instruction we need to perform on PostgreSQL to create a new slot is as follows:\n\
  \n```\npostgres=# SELECT * FROM pg_create_physical_replication_slot('master');\n\
  slot_name | lsn\n-----------+-----\nmaster     |\n(1 row)\n```\n\nThe instruction\
  \ we need to perform on PostgreSQL to drop a slot is this:\n\n```\npostgres=# select\
  \ pg_drop_replication_slot('master');\npg_drop_replication_slot\n------------------------\n\
  \n(1 row)\n```\n\nLater on in this chapter, we will look at these instructions in\
  \ more detail.\n\n## The pg_basebackup command\n\nIn Chapter 15, Backup and Restore,\
  \ in the section Basic concepts behind Point In Time Recovery, we talked about the\
  \ base backup; this is a hot backup that acts as a starting base on which we can\
  \ then perform all the WAL segments. There is a command called pg_basebackup that\
  \ implements this procedure almost automatically.\n\nIt is necessary that the max_wal_senders\
  \ value is at least 2. It is a very useful command for the DBA because it allows\
  \ us to do everything we need to do with a single instruction. We will use and better\
  \ explain this command in the next section, where we will implement our first asynchronous\
  \ physical replication.\n\nFor further information about the pg_basebackup command,\
  \ please refer to https://www.PostgreSQL.org/docs/current/app-pgbasebackup.html.\n\
  \n## Asynchronous replication\n\nWe now have all the building blocks necessary to\
  \ easily and quickly make our first asynchronous physical replication. By default,\
  \ in PostgreSQL, physical replication is asynchronous. Let’s now start with the\
  \ replication technique. By following the steps from the previous sections of this\
  \ chapter, we already have a primary server ready to be connected to the replica\
  \ server, and we have the replica ready to receive information from the primary.\
  \ The replica server will now have the PostgreSQL service turned off and the PGDATA\
  \ data folder created, empty, and with the right permissions granted:\n\n- 1. Let’s\
  \ go inside the PGDATA directory as the system postgres user:\n\n```\nroot@pg2:#\
  \ su - postgres\npostgres@pg2:~$ cd /var/lib/PostgreSQL/16/main\n```\n\n- 2. Now\
  \ let’s run the pg_basebackup command with the right options. This command will\
  \ execute the base_backup command from the primary machine to the replica machine\
  \ and prepare the replica machine to receive and execute the received WAL segments,\
  \ causing the replica server to remain in a state of permanent recovery:\n\n```\n\
  postgres@pg2:~/16/main$ pg_basebackup -h 192.168.122.10 -U replicarole -p5432 -D\
  \ /var/lib/PostgreSQL/16/main -Fp -Xs -P -R -S master\nPassword:\n22483/22483 kB\
  \ (100%), 1/1 tablespace\n```\n\nThe password that we have to insert is the password\
  \ of the replicarole user; in our case, this is SuperSecret. If the pg_basebackup\
  \ doesn’t start quickly, that means that it is waiting for a checkpoint from the\
  \ primary, so to improve the performance of this operation, we can go on the primary\
  \ server and execute:\n\n```\npostgres=# checkpoint ;\nCHECKPOINT\n```\n\nLet’s\
  \ analyze the pg_basebackup command in more detail:\n\n- -h: With this option, we\
  \ see the host that we want the replica to connect to.\n- -U: This is the user created\
  \ on the primary server used for replication.\n- -p: This is the port where the\
  \ primary server listens.\n- -D: This is the PGDATA value on the replica server.\n\
  - -Fp: This performs a backup on the replica, maintaining the same data structure\
  \ present on the primary.\n- -Xs: This opens a second connection to the primary\
  \ server and starts the transfer of the WAL segments at the same time as the backup\
  \ is performed.\n- -P: This shows the progress of the backup.\n- -S: This is the\
  \ slotname created on the primary server.\n- -R: This creates the standby.signal\
  \ file and adds the connection settings to the PostgreSQL.auto.conf file:\n- postgres@pg2:~/16/main$\
  \ cat postgresql.auto.conf\n- # Do not edit this file manually!\n- # It will be\
  \ overwritten by the ALTER SYSTEM command.\n- primary_conninfo = 'user=replicarole\
  \ password=SuperSecret channel_binding=disable host=192.168.122.10 port=5432 sslmode=disable\
  \ sslcompression=0 sslcertmode=disable sslsni=1 ssl_min_protocol_version=TLSv1.2\
  \ gssencmode=disable krbsrvname=postgres target_session_attrs=any load_balance_hosts=disable'\n\
  - primary_slot_name = 'master\n\n3. Now let’s start the PostgreSQL service on the\
  \ replica machine, and physical replication should work. As the root user, let’s\
  \ execute the following:\n\n```\nroot@pg2:/var/lib/postgresql/16# systemctl start\
  \ postgresql\n```\n\nAs we can see from the PostgreSQL log file (/var/log/postgresql/postgresql-16-main.log),\
  \ the replica machine started in standby mode and read-only mode:\n\n```\n2023-05-22\
  \ 13:27:29.823 UTC [1244] LOG:  entering standby mode\n2023-05-22 13:27:29.832 UTC\
  \ [1244] LOG:  redo starts at 0/2000028\n2023-05-22 13:27:29.835 UTC [1244] LOG:\
  \  consistent recovery state reached at 0/2000100\n2023-05-22 13:27:29.835 UTC [1241]\
  \ LOG:  database system is ready to accept read-only connections\n```\n\n4. Let’s\
  \ connect to the replica server and try to see whether everything has been replicated:\n\
  \n```\npostgres=# \\l\ndatabases\nList of\n```\n\n\n\nName | Owner | Encoding |\
  \ Locale Provider | Collate | Ctype | ICU Locale | ICU Rules | Access privileges\n\
  -----------+----------+----------+-----------------+-------------+-----------+----------+----------+-----------------+-------------+\n\
  postgres | postgres | UTF8 | libc | en_US.UTF-8 | en_US.UTF-8 | | | \ntemplate0\
  \ | postgres | UTF8 | libc | en_US.UTF-8 | en_US.UTF-8 | | | =c/postgres + postgres=CTc/postgres\n\
  template1 | postgres | UTF8 | libc | en_US.UTF-8 | en_US.UTF-8 | | | =c/postgres\
  \ + postgres=CTc/postgres\n(3 rows)\n\n+   5.\n\n让我们尝试创建一个表：\n\n```\npostgres=#\
  \ create table test table (id integer);\nERROR: cannot execute CREATE TABLE in a\
  \ read-only transaction\n```\n\n正如我们所见，服务器现在处于只读模式。\n\n## 副本监控\n\n在成功安装了我们的第一台异步副本服务器后，让我们看看如何监控副本的健康状况。PostgreSQL\
  \ 为我们提供了一个视图，通过该视图我们可以实时监控副本的状态；其名称为 pg_stat_replication。该视图必须通过连接到主节点进行查询。\n\n\
  例如，如果我们连接到主节点，我们可以看到以下内容：\n\n```\npostgres=# \\x\nExpanded display is on.\npostgres=#\
  \ select * from pg_stat_replication ;\n-[ RECORD 1 ]-----+------------------------\n\
  pid               | 1720\nusesysid          | 16388\nusename           | replicarole\n\
  application_name  | walreceiver\nclient_addr | 192.168.122.11\nclient_hostname |\
  \ \nclient_port | 41690\nbackend_start | 2023-05-22 13:27:29.849+00\nbackend_xmin\
  \ | \nstate | streaming\nsent_lsn | 0/3000148\nwrite_lsn | 0/3000148\nflush_lsn\
  \ | 0/3000148\nreplay_lsn | 0/3000148\nwrite_lag | \nflush_lag | \nreplay_lag |\
  \ \nsync_priority | 0\nsync_state | async\nreply_time | 2023-05-22 13:30:59.928374+00\n\
  ```\n\n使用此视图，我们拥有大量信息，可以用来判断我们的 standby 服务器是否处于极佳的健康状态。\n\n例如，我们可以看到从副本服务器收到的最后一条回复消息为\
  \ 2023-05-22 13:30:59.928374+00，并且我们可以通过 sent_lsn 值与 replay_lsn 值之间的差异看出我们的复制服务器完全对齐。有关\
  \ pg_stat_replication 的更多信息，请参阅官方文档（https://www.postgresql.org/docs/current/monitoring-stats.html#PG-STAT-REPLICATION-VIEW）。\n\
  \n## 同步复制\n\n到目前为止，我们讨论的是异步复制；这意味着主服务器将信息传递给副本 standby，而不确定 standby 服务器是否已复制数据。在异步复制中，主服务器不会等待副本服务器实际复制数据。在同步复制中，当主服务器执行提交时，所有复制的服务器会同步提交。在同步复制中，在执行提交后，我们可以确定数据已在主服务器和所有副本上复制。当我们想要实现同步复制时，最好让所有机器相同，并且机器之间有良好的网络连接；否则，性能可能会变慢。\n\
  \n## PostgreSQL 设置\n\n从为异步复制所做的工作开始，只需更改一些设置，就有可能从异步复制更改为同步复制。\n\n### 主服务器\n\n在主服务器上，我们必须检查\
  \ synchronous_commit 参数是否设置为 on。现在，synchronous_commit = on 是新安装 PostgreSQL 的默认值。\n\
  \n设置此参数后，我们必须添加 synchronous_standby_names 参数，列出将同步复制数据的所有 standby 服务器的名称。我们也可以使用\
  \ '*' 通配符，从而指示 PostgreSQL 每个 standby 服务器都可能具有同步副本。例如，要将前例中的主服务器转换为可以为 pg2 服务器支持异步复制，我们必须写下以下内容：\n\
  \n```\nsynchronous_standby_names = 'pg2'\nsynchronous_commit = on\n```\n\n之后，我们需要重启服务器：\n\
  \n```\n# systemctl restart postgresql\n```\n\n### Standby 服务器\n\n在 standby 服务器上，我们必须在连接到主服务器的连接字符串中添加一个参数，以便主服务器知道回复请求来自谁。我们需要编辑\
  \ postgresql.auto.conf 文件；它目前如下所示：\n\n```\n# Do not edit this file manually!\n#\
  \ It will be overwritten by the ALTER SYSTEM command.\nprimary_conninfo = 'user=replicarole\
  \ password=SuperSecret channel_binding=disable host=192.168.122.10 port=5432 sslmode=disable\
  \ sslcompression=0 sslcertmode=disable sslsni=1 ssl_min_protocol_version=TLSv1.2\
  \ gssencmode=disable krbsrvname=postgres target_session_attrs=any load_balance_hosts=disable'\n\
  primary_slot_name = 'master'\n```\n\n我们需要将其更改为以下内容：\n\n```\n# Do not edit this file\
  \ manually!\n# It will be overwritten by the ALTER SYSTEM command.\n```\n\n## 级联复制\n\
  \n我们已经探讨了如何从主服务器开始创建异步副本。然而，在某些情况下，我们可能需要多个异步副本，最简单的方法是将第二台副本机器挂接到主机器，使用我们刚刚看到的程序。此程序可能会增加主机器的负载，因此\
  \ PostgreSQL 提供了另一种选择：级联物理复制。我们想要实现的结构是这样的：\n\n![](img/bbe5644feba3d6a2ab994dc7e6cecbf1_655_0.png)\n\
  \n图 17.4：级联复制\n\n为了使我们的示例正常工作，我们将使用一台名为 pg3 的第三台机器。\n\n机器将具有以下 IP：\n\n- PRIMARY\
  \ (pg1): IP 192.168.122.10\n- 第一副本 (pg2): IP 192.168.122.11\n- 第二副本 (pg3): IP 192.168.122.12\n\
  \n现在执行以下步骤：\n\n- 1. 类似于我们之前所做的，让我们配置 pg2 机器，使其可以接收来自 pg3 机器的请求。我们必须将此行添加到 pg_hba.conf\
  \ 文件中：\n\n```\nIPv4 local connections:\nhost replication replicarole 192.168.122.12/32\
  \ scram-sha-256\n```\n\n- 2. 现在，我们必须重新加载 PostgreSQL 服务：\n\n```\nroot@pg2:# systemctl\
  \ reload postgresql\n```\n\n- 3. 在 pg2 机器上，让我们执行以下 SQL 命令：\n\n```\nroot@pg2:/usr/local/pgsql#\
  \ su - postgres\npostgres@pg2:~$ psql\npsql (16)\n```\n\n```\nclient_addr      |\
  \ 192.168.122.11\nclient_hostname  |\nclient_port      | 38844\nbackend_start  \
  \  | 2023-05-29 09:31:18.443699+00\nbackend_xmin     |\nstate            | streaming\n\
  sent_lsn         | 0/43F1E40\nwrite_lsn        | 0/43F1E40\nflush_lsn        | 0/43F1E40\n\
  replay_lsn       | 0/43F1E40\nwrite_lag        |\nflush_lag        |\nreplay_lag\
  \       |\nsync_priority    | 0\nsync_state       | async\nreply_time       | 2023-05-29\
  \ 09:39:57.357726+00\n```\n\n9. 这是 standby1 服务器（pg2）上的 pg_stat_replication：\n\n\
  ```\npostgres=# select * from pg_stat_replication;\n-[ RECORD 1 ]---------------------------------------------\n\
  pid              | 13015\nusesysid         | 16390\nusername         | replicarole\n\
  application_name | walreceiver\nclient_addr      | 192.168.122.12\nclient_hostname\
  \  |\nclient_port      | 50990\nbackend_start    | 2023-05-29 09:39:26.994899+00\n\
  backend_xmin     |\nstate            | streaming\nsent_lsn         | 0/43F1E40\n\
  write_lsn        | 0/43F1E40\nflush_lsn        | 0/43F1E40\nreplay_lsn       | 0/43F1E40\n\
  write_lag        |\nflush_lag        |\nreplay_lag       |\nsync_priority  | 0\n\
  sync_state     | async\nreply_time     | 2023-05-29 09:39:47.031691+00\n```\n\n\
  因此，我们已经了解了级联复制的工作原理。级联复制在我们想要降低主机器负载时很有用，例如，作为基于三台 PostgreSQL 服务器的高可用性（HA）系统的基础，而不会给主服务器带来负载。\n\
  \n## 延迟复制\n\n在某些情况下，有延迟的副本可能很有用；在 PostgreSQL 中，要实现此目标，我们可以在副本服务器的设置中使用 recovery_min_apply_delay。\n\
  \n例如，在副本服务器上，如果我们在 postgresql.conf 的末尾放置此设置：\n\n```\nrecovery_min_apply_delay =\
  \ 5000\n```\n\n并且我们对副本服务器上的 postgresql 服务进行重新加载：\n\n```\nroot@pg2:~# systemctl reload\
  \ postgresql\n```\n\n我们可以看到副本落后主服务器 5 秒，因为 recovery_min_apply_delay 使用的时间单位是毫秒。\n\
  \n在副本服务器上使用延迟意味着 WAL 文件会定期从主服务器下载，但它们会根据 recovery_min_apply_delay 参数指定的延迟进行处理。\n\
  \n## 将副本服务器提升为主服务器\n\n如果主服务器宕机，在副本服务器的日志中，我们会收到这种错误：\n\n```\nLOG:  waiting for WAL\
  \ to become available at 0/4000078\n2023-05-23 07:22:14.813 UTC [1137] FATAL:  could\
  \ not connect to the primary server: connection to server at \"192.168.122.10\"\
  , port 5432 failed: No route to host\nIs the server running on that host and accepting\
  \ TCP/IP connections?\n```\n\n这意味着副本服务器不再从主服务器接收 WAL 文件；如果出现这种情况，可以将副本节点提升为主节点；要实现此目标，在副本节点上，以\
  \ postgres 用户身份执行此语句：\n\n```\npostgres@pg2:~$ pg_ctl promote -D /var/lib/PostgreSQL/16/main\n\
  ```\n\n\n\n\nwaiting for server to promote..... done\nserver promoted\n\nAfter executing\
  \ this statement on the log file, we will see something like:\n\n```\n2023-05-23\
  \ 07:25:33.719 UTC [1078] LOG:  received promote request\n2023-05-23 07:25:34.909\
  \ UTC [1211] FATAL:  could not connect to the\nprimary server: connection to server\
  \ at \"192.168.122.10\", port 5432\nfailed: No route to host\n        Is the server\
  \ running on that host and accepting TCP/IP\nconnections?\n2023-05-23 07:25:34.910\
  \ UTC [1078] LOG:  waiting for WAL to become\navailable at 0/4000078\n2023-05-23\
  \ 07:25:34.910 UTC [1078] LOG:  redo done at 0/4000028 system\nusage: CPU: user:\
  \ 0.00 s, system: 0.00 s, elapsed: 246.25 s\n2023-05-23 07:25:34.928 UTC [1078]\
  \ LOG:  selected new timeline ID: 2\n2023-05-23 07:25:35.003 UTC [1078] LOG:  archive\
  \ recovery complete\n2023-05-23 07:25:35.014 UTC [1076] LOG:  checkpoint starting:\
  \ force\n2023-05-23 07:25:35.015 UTC [1075] LOG:  database system is ready to\n\
  accept connections\n```\n\n这意味着副本服务器已被提升为主服务器，现在可以在该节点上执行写操作。在本节中，我们学习了如何将副本服务器提升为主服务器，但有几件事我们必须牢记：\n\
  \n- PostgreSQL 不会自动完成此过程（没有第三方工具）。\n- 将备用副本提升为主服务器后，旧主服务器将无法恢复。\n- 如果主服务器宕机，在服务器宕机前如果并非所有\
  \ WAL 文件都已同步，我们可能会遭受数据丢失。\n\n## Summary\n\n在本章中，我们介绍了物理复制的概念。我们首先回顾并加深了对前几章中 WAL\
  \ 段的了解。我们介绍了、查看并配置了异步物理副本和同步物理副本。我们查看了两种模式之间的区别，并看到了从一种模式切换到另一种模式是多么容易。然后我们探索了一些有用的工具来监控副本并检查其健康状况。在下一章中，我们将使用本章讨论的概念来解决逻辑复制的话题。\n\
  \n- Replica configuration official documentation: https://www.postgresql.org/docs/current/runtime-config-replication.html\n\
  - High Availability, Load Balancing, and Replication official documentation: https://www.postgresql.org/docs/current/high-availability.html\n\
  \n## Learn more on Discord\n\nTo join the Discord community for this book – where\
  \ you can share feedback, ask questions to the author, and learn about new releases\
  \ – follow the QR code below:\n\nhttps://discord.gg/jYWCjF6Tku\n\n![](img/bbe5644feba3d6a2ab994dc7e6cecbf1_661_0.png)\n"
- "## 18\n\n## Logical Replication\n\n在上一章中，我们讨论了 WAL 段以及同步、异步和级联模式下的物理复制。在本章中，我们将介绍逻辑复制的主题。我们将了解如何执行逻辑复制，逻辑复制与物理复制有何不同，以及何时最好使用逻辑复制而不是物理复制。我们还将看到逻辑复制可用于进行\
  \ PostgreSQL 热升级。本章旨在作为逻辑复制的介绍；如需进一步信息，请参阅更高级的书籍，例如 Hans-Jürgen Schönig 所著的 *Mastering\
  \ PostgreSQL*。\n\n本章涵盖以下主题：\n\n- Understanding the basic concepts of logical replication\n\
  - Comparing logical replication and physical replication\n- Exploring a logical\
  \ replication setup and new logical replication features on PostgreSQL 16\n\n##\
  \ Technical requirements\n\nFor this chapter, you will find three Docker environments\
  \ in the repository:\n\n- `chapter18_logical_clear`: contains two PostgreSQL installations\
  \ ready for the configuration of a new logical replication.\n- `chapter18_logical_ready`:\
  \ contains two PostgreSQL installations with a new logical replication already active.\n\
  - `chapter18_physical_logical`: contains three PostgreSQL installations with a new\
  \ logical replication made using a physical replication.\n\nIf you want to understand\
  \ how to configure a new logical replication, you should use the first Docker environment;\
  \ however, if you want to skip all the topics about configuration, you can use the\
  \ second one. In the second Docker environment, which you can find on the publication\
  \ server, you will find the forumdb database that we’ve used so far in the book;\
  \ you’ll also find a logical replication of just the users table. Finally, the chapter18_physical_logical\
  \ Docker environment will be used for the last section of this chapter.\n\n## Understanding\
  \ the basic concepts of logical replication\n\nLogical replication is a method that\
  \ we can use to replicate data based on the concept of identity replication. REPLICA\
  \ IDENTITY is a parameter present in table management commands (such as CREATE TABLE\
  \ and ALTER TABLE); this parameter is used by PostgreSQL to obtain additional information\
  \ within WAL segments, to recognize which tuples have been eliminated and which\
  \ tuples have been updated. The REPLICA IDENTITY parameter can take four values:\n\
  \n- DEFAULT\n- USING INDEX index_name\n- FULL\n- NOTHING\n\nThe concept behind logical\
  \ replication is to pass the logic of the commands executed on the primary machine\
  \ to the server and not the exact copy of the blocks to be replicated, byte by byte.\
  \ At the heart of logical replication, there is a reverse engineering process that,\
  \ starting from the WAL segments and using a logical decoding process, is able to\
  \ extrapolate the original SQL commands and pass them on to the replication machine,\
  \ using a logical decoding process.\n\nLet’s see a flow chart that shows how PostgreSQL\
  \ internally executes queries:\n\n![](img/bbe5644feba3d6a2ab994dc7e6cecbf1_665_0.png)\n\
  \nFigure 18.1: An illustration of the backend process\n\nAs we can see, a query,\
  \ before being executed, requires several internal steps; this is because the system\
  \ tries to execute the query in the best possible way, according to the conditions\
  \ prevailing at that moment in the database. Now, suppose we want to replicate the\
  \ data logically; at this point, we have two possibilities in front of us:\n\n-\
  \ We can capture commands before they get to the parser and transfer these commands\
  \ to a second machine.\n- We can try, in some way, to get the queries that are already\
  \ parsed.\n\nThe first method is implemented by systems designed prior to native\
  \ logical replication, which was based on triggers; an example of the application\
  \ of this method can be found on Slony (https://www.slony.info/).\n\nThe second\
  \ method is used in logical replication.\n\nIn logical replication, we will take\
  \ the commands to be sent to the replica server within the WAL segments. The problem\
  \ is that within the WAL segments, we have a physical representation of the data.\
  \ In other words, within the WAL segments, the data is ready to be sent or archived\
  \ to make physical copies, not logical copies.\n\nLogical replication is based on\
  \ the concept that WAL segments, after being processed through a logical decoding\
  \ process that reverses the physical information in a logical information, are made\
  \ available through a publication mechanism. The primary will then start a publication\
  \ process, and the replica will start a subscription process that, by connecting\
  \ to the primary’s publication, is able to pass the decoded instructions directly\
  \ to the query executor of the replica machine.\n\n![](img/bbe5644feba3d6a2ab994dc7e6cecbf1_666_0.png)\n\
  \nFigure 18.2: A logical replication schema\n\nAs we can see from the diagram, using\
  \ a reverse engineering process, instructions are retrieved from the WAL segments,\
  \ and these instructions are ready to be processed by the executor of the replica\
  \ server without any parsing action. This second method is much faster than the\
  \ first method. The first method was the only one available for PostgreSQL versions\
  \ prior to 9.4; starting from 9.4, there is an extension called pglogical, and since\
  \ version 10.0, the logical replica has become native.\n\n\n\n\n\n> 请注意，由于我们可以在不同版本的\
  \ PostgreSQL 之间进行复制，逻辑复制是一种可用于执行 PostgreSQL 热升级的工具。\n\n## 探索 PostgreSQL 16 上的逻辑复制设置和新的逻辑复制功能\n\
  \n让我们现在探索如何执行逻辑复制。在本节中，我们将准备执行逻辑复制所需的环境。\n\n## 逻辑复制环境设置\n\n假设我们有两台机器，我们将分别称之为 pg_pub\
  \ 和 pg_sub。我们必须记住设置内部 DNS，或 /etc hosts 文件，以便 pg_pub 可以访问 pg_sub；例如，对于 pg_pub 服务器，主服务器的\
  \ IP 为 192.168.144.3，而对于 pg_sub 服务器，副本服务器的 IP 为 192.168.144.2。如果您使用 chapter18 容器，可以执行：\n\
  \n```\nchapter_18$ bash run-pg-docker.sh chapter18_logical_clear\n```\n\n进入第一个容器后，您可以打开另一个\
  \ bash 终端并执行：\n\n```\nchapter_18$ bash run-pg-docker_replica.sh chapter18_logical_clear\n\
  ```\n\n现在，让我们检查两台服务器之间是否存在连接：\n\n```\npostgres@pg_pub:~$ ping pg_sub\nPING pg_sub\
  \ (192.168.144.3) 56(84) bytes of data.\n64 bytes from chapter18_logical_clear_learn_postgresql_sub_1.chapter18_logical_clear_default\
  \ (192.168.144.3): icmp_seq=1 ttl=64 time=0.094 ms\n\npostgres@pg_sub:~$ ping pg_pub\n\
  PING pg_pub (192.168.144.2) 56(84) bytes of data.\n64 bytes from chapter18_logical_clear_learn_postgresql_pub_1.chapter18_logical_clear_default\
  \ (192.168.144.2): icmp_seq=1 ttl=64 time=0.070 ms\n```\n\n如图所示，两台服务器之间存在连接。\n\n\
  我们也可以指示所有表，如示例所示：\n\n```\ndb_source=# CREATE PUBLICATION all_tables_pub FOR ALL\
  \ TABLES;\nCREATE PUBLICATION\n```\n\n5. 此时，我们前往副本机器并创建一个新数据库：\n\n```\npostgres=#\
  \ create database db_destination;\nCREATE DATABASE\npostgres=# \\c db_destination\n\
  You are now connected to database \"db_destination\" as user \"postgres\"\n```\n\
  \n6. 我们重新创建在主机器上创建的表的确切结构：\n\n```\ndb_destination=# create table t1 (id integer\
  \ not null primary key,\nname varchar(64));\nCREATE TABLE\n```\n\n7. 之后，我们必须设置订阅，以便发布的数据在副本机器上进行复制：\n\
  \n```\ndb_destination=# CREATE SUBSCRIPTION sub_all_tables CONNECTION 'user=replicarole\
  \ password=LearnPostgreSQL host=pg_pub port=5432 dbname=db_source' PUBLICATION all_tables_pub;\n\
  NOTICE:  created replication slot \"sub_all_tables\" on publisher\nCREATE SUBSCRIPTION\n\
  ```\n\n现在我们的逻辑复制设置已完成。\n\n8. 我们可以尝试向主服务器插入一些数据：\n\n```\ndb_source=# insert into\
  \ t1 values(1,'Linux'),(2,'FreeBSD');\nINSERT 0 2\n```\n\n9. 如我们在此处所见，相同的数据已在副本服务器上复制：\n\
  \n```\ndb_destination=# select * from t1;\nid | name\n----+---------\n 1 | Linux\n\
  \ 2 | FreeBSD\n(2 rows)\n```\n\n因此，我们已成功准备好逻辑副本。我们将在下一节学习如何监控它。\n\n## 监控逻辑复制\n\n\
  正如物理复制一样，PostgreSQL 提供了监控逻辑复制所需的工具。\n\n对于逻辑复制，我们必须查询 pg_stat_replication 表，该表与用于监控物理复制的表相同，如下所示：\n\
  \n```\ndb_source=# \\x\nExpanded display is on.\ndb_source=# select * from pg_stat_replication\
  \ ;\n-[ RECORD 1 ]---------------------------------------------\npid           \
  \   | 144\nusesysid         | 16477\nusername         | replicarole\napplication_name\
  \ | sub_all_tables\nclient_addr      | 192.168.144.2\nclient_hostname  | \nclient_port\
  \      | 43162\nbackend_start    | 2023-06-16 15:04:09.074749+00\nbackend_xmin \
  \    | \nstate            | streaming\nsent_lsn         | 0/1DD0398\nwrite_lsn \
  \       | 0/1DD0398\nflush_lsn        | 0/1DD0398\nreplay_lsn       | 0/1DD0398\n\
  write_lag        | \nflush_lag        | \nreplay_lag       | \nsync_priority   \
  \ | 0\nsync_state       | async\nreply_time       | 2023-06-16 15:05:23.524003+00\n\
  ```\n\n此查询显示的信息与物理复制的情况相同，但我们知道此信息指的是逻辑副本，因为我们在 application_name 上有我们之前创建的槽名称 sub_all_tables。\n\
  \n```\nsubconninfo      | user=replicarole password=LearnPostgreSQL host=pg_pub\n\
  port=5432 dbname=db_source\nsubslotname      | sub_all_tables\nsubsynchroncommit\
  \ | off\nsubpublications  | {all_tables_pub}\n```\n\n然后我们有有关数据库中创建的所有订阅的信息。有关更多信息，请参阅官方文档：https://www.postgresql.org/docs/current/catalog-pg-subscription.html。\n\
  \n## 只读与可写\n\n在上一章中，我们看到只能使用读操作访问物理复制服务器，而不允许写操作。我们还看到物理复制会复制任何类型的操作，包括 DML 操作和\
  \ DDL 操作。使用逻辑复制，我们也可以在副本服务器上访问写操作，但在逻辑副本中，只有 DML 操作会被复制到副本服务器；DDL 操作不会被复制。让我们进行一些测试，看看会发生什么。在以下示例中，主服务器始终称为\
  \ pg_pub，而具有逻辑复制的服务器始终称为 pg_sub。\n\n这是 pg_pub 服务器上的初始情况：\n\n```\ndb_source=# select\
  \ * from t1;\n id |  name\n----+--------\n  1 | Linux\n  2 | FreeBSD\n(2 rows)\n\
  ```\n\n这是 pg_sub 服务器上的初始情况：\n\n```\ndb_destination=# select * from t1;\n id |  name\n\
  ----+--------\n  1 | Linux\n  2 | FreeBSD\n(2 rows)\n```\n\n让我们在 pg_sub 服务器上插入一条记录：\n\
  \n```\ndb_destination=# insert into t1 values (3,'OpenBSD');\nINSERT 0 1\n```\n\n\
  现在 pg_sub 服务器上的情况是：\n\n```\ndb_destination=# select * from t1;\n id | name\n-----+--------\n\
  \  1 | Linux\n  2 | FreeBSD\n  3 | OpenBSD\n(3 rows)\n```\n\n在 pg_pub 服务器上，我们仍然有以下内容：\n\
  \n```\ndb_source=# select * from t1;\n id | name\n-----+--------\n  1 | Linux\n\
  \  2 | FreeBSD\n(2 rows)\n```\n\n请注意，逻辑副本允许在副本服务器上执行写操作。\n\n让我们看看如果我们在 pg_pub 服务器上添加一条记录会发生什么：\n\
  \n```\ndb_source=# insert into t1 values(4,'Minix');\nINSERT 0 1\n```\n\npg_pub\
  \ 服务器上的情况如下：\n\n```\ndb_source=# select * from t1;\n id | name\n-----+--------\n\
  \  1 | Linux\n  2 | FreeBSD\n  4 | Minix\n(3 rows)\n```\n\n然后我们在 pg_pub 服务器上会有：\n\
  \n```\ndb_source=# select * from t1;\n id | name\n-----+--------\n  1 | Linux\n\
  \  2 | FreeBSD\n  4 | Minix\n  3 | Windows\n  5 | Unix\n(5 rows)\n```\n\n在副本 pg_sub\
  \ 服务器上，我们仍然会有：\n\n```\ndb_destination=# select * from t1;\n id | name\n-----+--------\n\
  \  1 | Linux\n  2 | FreeBSD\n  3 | OpenBSD\n  4 | Minix\n(4 rows)\n```\n\n从现在开始，逻辑复制不再复制数据，如果我们在\
  \ pg_pub 服务器上执行此查询：\n\n```\ndb_source=# select * from pg_stat_replication;\n(0 rows)\n\
  ```\n\n将不再找到复制；那是因为我们的逻辑复制不再工作。\n\n> 如果我们想在副本服务器上写入记录，我们必须确保这些记录不会与主服务器上的记录冲突。\n\
  \n重新对齐副本服务器的一种简单方法是删除订阅、截断表，然后重新创建订阅：\n\n```\ndb_destination=# drop subscription\
  \ sub_all_tables ;\nNOTICE:  dropped replication slot \"sub_all_tables\" on publisher\n\
  ```\n\n\n\n\n- [ RECORD 1 ]---+-----------------------------\npid | 337\nusesysid\
  \ | 16477\nusername | replicarole\napplication_name | sub_all_tables\nclient_addr\
  \ | 192.168.144.2\nclient_hostname |\nclient_port | 57826\nbackend_start | 2023-06-16\
  \ 15:24:36.905319+00\nbackend_xmin |\nstate | streaming\nsent_lsn | 0/1DD0BC0\n\
  write_lsn | 0/1DD0BC0\nflush_lsn | 0/1DD0BC0\nreplay_lsn | 0/1DD0BC0\nwrite_lag\
  \ |\nflush_lag |\nreplay_lag |\nsync_priority | 0\nsync_state | async\nreply_time\
  \ | 2023-06-16 15:27:47.24564+00\n\n## DDL 命令\n\n在上一节中，我们说过逻辑复制不会复制 DDL 命令，但如果我们在一个已经通过逻辑复制进行复制的主服务器上应用一个\
  \ DDL 语句会发生什么？DDL 命令如下：\n\n- CREATE\n- ALTER\n- DROP\n- RENAME\n- TRUNCATE\n- COMMENT\n\
  \n假设现在我们想在主服务器的 pg_pub 上的 t1 表上添加一个字段：\n\n```\ndb_source=# alter table t1 add description\
  \ varchar(64);\nALTER TABLE\n```\n\n现在让我们尝试在 pg_pub 服务器上执行一个 DML 命令。以下是一些 DML 命令的示例：\n\
  \n- INSERT\n- DELETE\n- UPDATE\n\n例如，假设我们尝试从 pg_pub 服务器的 t1 表中删除一条记录：\n\n```\ndb_source=#\
  \ delete from t1 where id=5;\nDELETE 1\n```\n\n在 pg_pub 服务器上，我们将有以下内容：\n\n```\n\
  db_source=# select * from t1;\n id | name    | description\n----+---------+-------------\n\
  \  1 | Linux   |\n  2 | FreeBSD |\n  4 | Minix   |\n  3 | Windows |\n(4 rows)\n\
  ```\n\n而在 pg_sub 服务器上，我们仍然会有这个：\n\n```\ndb_destination=# select * from t1;\n id\
  \ | name\n----+---------\n  1 | Linux\n  2 | FreeBSD\n  4 | Minix\n  3 | Windows\n\
  \  5 | Unix\n(5 rows)\n```\n\n如果我们检查 pg_sub 服务器上的 postgresql.log，我们会看到这个：\n\n```\n\
  learn_postgresql_sub_1 | 2023-06-16 15:30:57.973 UTC [364] ERROR:\nlogical replication\
  \ target relation \"public.t1\" is missing replicated\ncolumn: \"description\"\n\
  ```\n\nHINT:  Use ALTER SUBSCRIPTION ... SET (slot_name = NONE) to disassociate\
  \ the subscription from the slot.\n\nPostgreSQL 建议使用 ALTER SUBSCRIPTION ... SET\
  \ (slot_name = NONE) 来将订阅与槽分离。问题在于，我们不能在禁用订阅之前执行此命令。事实上，如果我们现在尝试执行 PostgreSQL 建议的命令，我们会得到这个：\n\
  \n```\ndb_destination=# alter subscription sub_all_tables SET (slot_name = NONE);\n\
  ERROR:  cannot set slot_name = NONE for enabled subscription\n```\n\n我们必须执行的正确步骤如下：\n\
  \n- 1. 禁用订阅。\n- 2. 将 slot_name 设置为 NONE。\n- 3. 删除订阅。\n\n我们必须执行以下三个语句：\n\n```\ndb_destination=#\
  \ alter subscription sub_all_tables disable;\nALTER SUBSCRIPTION\ndb_destination=#\
  \ alter subscription sub_all_tables SET (slot_name = NONE);\nALTER SUBSCRIPTION\n\
  db_destination=# drop subscription sub_all_tables ;\nDROP SUBSCRIPTION\n```\n\n\
  如果主服务器变得不可达时我们想删除一个订阅，这些就是正确的步骤。我们也可以使用 ALTER SUBSCRIPTION sub_name DISABLE 命令将订阅从发布中分离，以及使用\
  \ ALTER SUBSCRIPTION sub_name ENABLE 命令将订阅重新附加到发布。\n\n## 使用物理复制实例进行逻辑复制\n\n在 PostgreSQL\
  \ 16 中，可以从物理复制开始创建逻辑复制。\n\n我们要采取的步骤如下：\n\n- 1. 在 **Primary** 和 **Physical Replication**\
  \ 服务器上设置 `wal_level=logical`。\n\n在 **Primary server** 上：\n\n- 2. 为物理复制创建一个角色：\n\n\
  ```sql\nCREATE ROLE replicarole WITH REPLICATION LOGIN PASSWORD\n'LearnPostgreSQL';\n\
  ```\n\n- 3. 在 **Primary server** 上为逻辑复制创建一个角色：\n\n```sql\nCREATE ROLE logicalreplicarole\
  \ WITH REPLICATION LOGIN PASSWORD\n'LearnPostgreSQL'\n```\n\n- 4. 为 logicalreplicarole\
  \ 分配对我们想要通过逻辑复制复制的模式和表的正确权限，例如：\n\n```sql\nGRANT USAGE ON SCHEMA forum TO logicalreplicarole;\n\
  GRANT SELECT ON forum.users TO logicalreplicarole\n```\n\n- 5. 创建一个物理复制槽或物理复制。\n\
  \n- 6. 创建一个将在 **Physical replication** 服务器上复制并由 **Logical Replication** 服务器上的逻辑复制订阅使用的发布。\n\
  \n在 **Physical replication server** 上：\n\n- 7. 设置 `hot_standby_feedback = on` 以防止由于主服务器上的\
  \ vacuum 操作反映到副本服务器上而导致的问题，这可能会在副本上非常长的查询上产生冲突。\n\n- 8. 使用 `pg_basebackup` 命令制作副本，如上一章所述。\n\
  \n在 **Logical replication server** 上：\n\n- 9. 创建你想要从物理复制中复制数据的表。\n\n- 10. 创建一个引用我们在主服务器上创建的发布的订阅，如我们所见。\n\
  \n现在，让我们使用 Docker 容器尝试此功能；我们想要尝试的场景是：\n\n- 11. 主服务器上的一个 forumdb 数据库\n- 12. 副本服务器上的整个集群的物理副本\n\
  \n13. 逻辑复制服务器上的 forum.users 表的逻辑复制。\n\n![](img/bbe5644feba3d6a2ab994dc7e6cecbf1_686_0.png)\n\
  \n图 18.3：物理/逻辑复制级联\n\n让我们使用 chapter18_physical_logical Docker 容器并执行以下步骤：\n\n- 1.\
  \ 使用以下命令启动所有容器：\n```\n$ bash run-pg-docker-replica-logical.sh chapter18_physical_logical\n\
  ```\n- 2. 在我们的 Docker 主机上执行上述语句后，我们有三个容器正在运行：\n```\nchapter18_physical_logical_learn_postgresql_replica_sub_1\n\
  chapter18_physical_logical_learn_postgresql_master_pub_1\nchapter18_physical_logical_learn_postgresql_replica_1\n\
  ```\n- 3. 我们运行的脚本直接带我们进入了主节点运行的容器；现在，我们必须打开两个 bash 终端窗口并在第一个中执行以下语句（进入物理复制节点）：\n\
  ```\n$ bash run-pg-docker-replica1.sh chapter18_physical_logical\n```\n- 4. 在第二个中，我们必须执行以下语句以进入逻辑复制节点：\n\
  ```\nbash run-pg-docker-replica2.sh chapter18_physical_logical\n```\n- 5. 现在，正如我们所见，在主节点上我们有：\n\
  ```\npostgres@pg_master_pub:~$ psql\n\npostgres=# select * from pg_stat_replication;\n\
  -[ RECORD 1 ]---------------------------------\n```\n\n```\npid | 108\nusesysid\
  \ | 16384\nusername | replicarole\napplication_name | walreceiver\nclient_addr |\
  \ 172.29.0.4\nclient_hostname | \nclient_port | 43400\nbackend_start | 2023-06-20\
  \ 16:10:30.779359+00\nbackend_xmin | \nstate | streaming\nsent_lsn | 0/3005948\n\
  write_lsn | 0/3005948\nflush_lsn | 0/3005948\nreplay_lsn | 0/3005948\nwrite_lag\
  \ | \nflush_lag | \nreplay_lag | \nsync_priority | 0\nsync_state | async\nreply_time\
  \ | 2023-06-20 16:11:49.332655+00\n```\n\n在物理复制服务器上，我们有：\n\n```\npostgres@pg_replica:~$\
  \ psql forumdb\n\nforumdb=# select * from pg_stat_replication;\n-[ RECORD 1 ]---------------------------------------------\n\
  pid | 101\nusesysid | 16468\nusername | logicalreplicarole\napplication_name | users_sub\n\
  client_addr | 172.29.0.2\nclient_hostname | \nclient_port | 43950\nbackend_start\
  \ | 2023-06-20 16:10:39.685477+00\nbackend_xmin | \nstate | streaming\nsent_lsn\
  \ | 0/3005948\n```\n\n我们看到了如何在实践中制作逻辑副本，并解决了在使用逻辑复制时可能出现的一些问题。\n\n在下一章中，我们将讨论有用的工具和扩展。我们将看到哪些工具最适合让\
  \ PostgreSQL DBA 的生活更轻松。\n\n## 验证你的知识\n\n- 是否可以在逻辑复制服务器的订阅上编写查询？\n  可以。参见 *Exploring\
  \ logical replication setup* 部分了解更多详情。\n- 是否可以在逻辑复制服务器的订阅上拥有不同的字段？\n  可以，订阅可以拥有比发布服务器上*更多*的字段。\n\
  \  参见 *Exploring logical replication setup* 部分了解更多详情。\n- 我是否必须在开始逻辑复制之前配置 pg_hba.conf\
  \ 文件？\n  是的，你必须。参见 *Exploring logical replication setup* 部分了解更多详情。\n- 如果在发布服务器上执行\
  \ DDL 语句后，订阅服务器不再复制任何数据，我该怎么办？\n  你必须在订阅服务器上复制 DDL 语句。参见 *DDL commands* 部分了解更多详情。\n\
  - 是否可以从物理复制开始进行逻辑复制？\n  是的，在 PostgreSQL 16 中是可以的。\n\n## 参考\n\n- Slony website: https://www.slony.info\n\
  - Logical replication: https://www.postgresql.org/docs/current/logical-replication.html\n\
  \n\n\n\n"
- "## 19 个有用的工具和扩展\n\n本章可视为本书的附录。在本章中，我们将讨论一些工具和扩展，它们能够让数据库管理员（DBA）通过减少完成工作所需的精力来最大化工作效率。\n\
  \n我们将讨论以下扩展：\n\n- pg_trgm\n- 外部数据包装器和 postgres_fdw 扩展\n\n这是 PostgreSQL 的两个官方扩展。\
  \ 一个可以非常有用的用于查找 PostgreSQL 可用扩展的网站是 https://pgxn.org/。\n\n除了扩展之外，我们还将讨论 PostgreSQL\
  \ DBA 的其他有用工具。 PostgreSQL 可用的工具多达数十种，但在本章中，我们将讨论：\n\n- pgbackrest：一个强大的工具，用于管理灾难恢复和时间点恢复（PITR）\n\
  - pgloader：一个有用的工具，可轻松地从 MySQL、SQLite 和 MS SQL 迁移到 PostgreSQL；在这一节中，我们将展示一个如何以非常简单的方式从\
  \ MySQL 迁移到 PostgreSQL 的示例。\n\n本章旨在快速概述一些最有用的 PostgreSQL 扩展和工具。\n\n以下主题将在此处涵盖：\n\
  \n- 探索 pg_trgm 扩展\n- 使用外部数据包装器和 postgres_fdw 扩展\n- 管理 pgbackrest 工具\n- 探索 pgloader\
  \ 工具\n\n在本章中，Docker 容器仅在某些部分中使用。\n\n### 技术要求\n\n本节有一个 Docker 容器，您可以在 learn_postgresql_16/docker-images/chapter19\
  \ 找到它，因此在进入正确路径后，让我们运行：\n\n```\nchapter19$ bash run-pg-docker-pg_trgm.sh chapter19-pg_trgm\n\
  \npostgres@learn_postgresql:~$ psql -U forum forumdb\nforumdb=>\n```\n\n### 探索 pg_trgm\
  \ 扩展\n\n现在让我们回到第 13 章《索引和性能优化》，索引部分。当我们谈论索引时，我们学习了如何通过使用索引使查询更快。然而，B-tree 索引并不索引所有类型的操作。现在让我们考虑文本数据类型（char、varchar\
  \ 或 text）。现在，我们将看到 B-tree 使用 varchar_pattern_ops 操作符类，能够为以 search% 开头的句子索引文本查询，但不能为以\
  \ %search 结尾或包含 %search% 的句子索引文本查询。\n\n1. 在深入我们的示例之前，让我们将 enable_seqscan 设置为 off，以便强制\
  \ PostgreSQL 在存在索引时使用索引。我们需要这样做，因为在我们的示例情况下，PostgreSQL 默认总是使用顺序扫描，因为我们的表中只有几条记录，并且表中存在的所有数据都存储在单个页面上：\n\
  \n```\nforumdb=> set enable_seqscan to 'off';\nSET\n```\n\n2. 在我们的数据库中，我们现在可以在 categories\
  \ 表上执行此查询：\n\n```\nforumdb=> select pk,title from categories;\n```\n\n| pk | title\
  \ |\n|----|-------|\n| 1 | Database |\n| 2 | Unix |\n| 3 | Programming Languages\
  \ |\n\n3. 让我们创建一个带有 varchar opclass 的 B-tree 索引，以便检查 PostgreSQL 在我们使用 like 操作符执行查询时是否使用索引访问表：\n\
  \n```\nforumdb=> create index on categories using btree(title varchar_pattern_ops);\n\
  CREATE INDEX\n```\n\n让我们现在执行一些 like 查询：\n\n4. 作为第一个示例，让我们使用 ‘search%’ 谓词执行 like\
  \ 查询：\n\n```\nforumdb=> explain analyze select * from categories where title like\
  \ 'Da%';\n\nQUERY PLAN\n\n---------------------------------------------------------------\n\
  Index Scan using categories_title_idx on categories\n(cost=0.13..8.15 rows=1 width=68)\n\
  (actual time=0.033..0.037 rows=1 loops=1)\n  Index Cond: ((title ~>=~ 'Da'::text)\
  \ AND (title ~<~ 'Db'::text))\n  Filter: (title ~~ 'Da%'::text)\nPlanning Time:\
  \ 0.172 ms\nExecution Time: 0.075 ms\n(5 rows)\n```\n\n5. 作为第二个示例，让我们使用 ‘%search’\
  \ 谓词执行 like 查询：\n\n```\nforumdb=> explain analyze select * from categories where\
  \ title like '%Da%';\n\nQUERY PLAN\n\n---------------------------------------------------------------\n\
  Seq Scan on categories  (cost=1000000000.00..1000000001.04 rows=1 width=68) (actual\
  \ time=17.278..17.283 rows=1 loops=1)\n  Filter: (title ~~ '%Da%'::text)\n  Rows\
  \ Removed by Filter: 2\nPlanning Time: 0.101 ms\nJIT:\n```\n\n正如这里所见，PostgreSQL\
  \ 现在能够使用 like 查询创建索引访问。 对于所有类型的 like 和 ilike 查询也是如此； pg_trgm 扩展解决了此类查询的表访问索引。 有关\
  \ pg_trgm 扩展的更多信息，请参阅 https://www.postgresql.org/docs/current/pgtrgm.html。\n\npg_trgm\
  \ 扩展在 DBA 需要优化 like 和 ilike 查询的所有情况下都方便了 DBA 的工作。现在，我们将继续下一个扩展，postgres_fdw。\n\n\
  ### 使用外部数据包装器和 postgres_fdw 扩展\n\n外部数据包装器允许我们像访问普通本地表一样访问托管在外部数据库上的数据。我们可以将 PostgreSQL\
  \ 连接到各种数据源，我们可以将 PostgreSQL 连接到另一个 PostgreSQL 服务器，或将 PostgreSQL 连接到可以是关系型或非关系型的数据源。一旦外部数据包装器连接，PostgreSQL\
  \ 就能够像本地一样读取远程表。 有用于 Oracle 和 MySQL 等知名数据库的外部数据包装器，也有用于不太知名系统的外部数据包装器。 PostgreSQL\
  \ 可用的外部数据包装器的完整列表可在 https://wiki.postgresql.org/wiki/Foreign_data_wrappers 获取。\n\
  \n在本节中，我们将考虑一个使用 postgres_fdw 外部数据包装器的示例，该包装器用于将一个 PostgreSQL 服务器连接到另一个 PostgreSQL\
  \ 服务器。\n\n如果我们想使用 Docker 镜像，我们必须打开两个 Bash 终端，并在第一个上执行：\n\n```\nchapter19$ bash run-pg-docker.sh\
  \ chapter19-postgresql_fdw\npostgres@pg_fdw1:~$ psql -U forum forumdb\nforumdb=>\
  \ select * from categories;\n```\n\n| pk | title | description |\n|----|-------|-------------|\n\
  \n(0 rows)\n\n然后，在第二个 Bash 终端上，我们必须执行：\n\n```\nchapter19$ bash run-pg-docker-pg_fdw2.sh\
  \ chapter19-postgresql_fdw\npostgres@pg_fdw2:~$ psql -U forum forumdb\nforumdb=>\
  \ select * from categories;\n```\n\n| pk | title | description |\n|----|-------|-------------|\n\
  | 1 | Database | Database related discussions |\n| 2 | Unix | Unix and Linux discussions\
  \ |\n| 3 | Programming Languages | All about programming languages |\n\n(3 rows)\n\
  \n我们的初始情况是两个服务器。我们有一个名为 pg_fdw1 的服务器，IP地址为 192.168.16.2，以及一个名为 pg_fdw2 的服务器，IP地址为\
  \ 192.168.16.3。我们的目标将是连接服务器 pg_fdw2 到服务器 pg_fdw1，并使从服务器 pg_fdw1 查询服务器 pg_fdw2 的\
  \ category 表成为可能，就像它是本地的一样：\n\n1. 让我们从在 pg_fdw1 服务器上安装 postgres_fdw 扩展开始。因此，作为超级用户\
  \ postgres，让我们执行：\n\n```\npostgres@pg_fdw1:~$ psql -U postgres forumdb\n\nforumdb=#\
  \ create extension postgres_fdw ;\nCREATE EXTENSION\n```\n\n假设在 pg_fdw2 服务器上，pg_hba.conf\
  \ 配置如下：\n\n```\nhost    all             all             192.168.16.0/24\n      \
  \  scram-sha-256\n```\n\n2. 现在我们必须使用以下语句在 pg_fdw1 服务器上创建两个服务器之间的连接：\n\n```\nforumdb=#\
  \ CREATE SERVER remote_pg_fdw2 FOREIGN DATA WRAPPER\npostgres_fdw OPTIONS (host\
  \ 'pg_fdw2', dbname 'forumdb');\nCREATE SERVER\n```\n\n3. 现在，我们必须在两个服务器之间编写一个用户映射：\n\
  \n```\nforumdb=# CREATE USER MAPPING FOR forum SERVER remote_pg_fdw2\nOPTIONS (user\
  \ 'forum', password 'LearnPostgreSQL');\nCREATE USER MAPPING\n```\n\n4. 现在我们必须为\
  \ forum 用户创建具有 SELECT 权限的外部表：\n\n```\nforumdb=# create foreign table forum.f_categories\
  \ (\n    pk integer,\n```\n\n\n\n还有很多其他工具，在 https://wiki.postgresql.org/wiki/Binary_Replication_Tools\
  \ 上可以找到它们之间很好的对比。\n\n在本节中，我们将重点介绍 pgbackrest；它是用于灾难恢复的最常用工具之一，因为它以非常简单的方式实现了在多核上的可扩展性，并且支持以压缩和加密的方式将数据保存到存储桶中。pgbackrest\
  \ 工具是用于 PostgreSQL 灾难恢复和 PITR（时间点恢复）的工具，专为高负载服务器而设计。其官方网址是 https://pgbackrest.org/。\n\
  \n以下是该工具的一些特性：\n\n- 支持并行备份和并行恢复。\n- 可以进行全量基础备份、增量备份或差异备份。\n- 我们可以选择执行本地操作或远程操作。\n\
  - 我们可以选择备份和归档过期的保留策略。\n- 支持备份续传。\n- 支持流式压缩和校验和。\n- 对于恢复过程，我们可以使用增量恢复（delta restore）功能。\n\
  - 可以使用并行 WAL 归档。\n- 支持表空间和链接。\n- 支持数据加密。\n- 支持对存储库存储使用 SFTP。\n- 支持对 S3、GCP 和 Azure\
  \ 的对象存储。\n\n## 基本概念\n\npgbackrest 工具使用 stanza（配置节）的概念，并且可以使用本地或外部存储库：\n\n- stanza\
  \ 是远程服务器用于备份的配置。它是一组要备份的目标。一个 stanza 配置可以包含多个服务器，在这种情况下，第一个（pg1）是主服务器，其他服务器被视为备用服务器。\n\
  - 存储库是保存备份的本地或远程（SSH）存储；它可以加密。一个存储库可以包含多个定义，但目前仅支持第一个（repo1）。\n- 在使用 pgbackrest\
  \ 的用户之间进行公钥交换非常重要。最简单的做法是在 PostgreSQL 服务器的 Postgres 用户与 pgbackrest 存储库所在服务器的 Postgres\
  \ 用户之间交换公钥。\n\n## 环境搭建\n\n在本节中，没有 Docker 容器，因此在开始测试我们的 pgbackrest 工具之前，让我们看看需要什么才能开始工作。我们将需要以下内容：\n\
  \n- 一个正在运行的 PostgreSQL 服务器\n- 一台我们将使用 postgres 用户安装和配置 pgbackrest 工具的服务器\n\n在本场景中，我们将继续使用我们的\
  \ pg1 PostgreSQL 服务器，其 IP 为 192.168.122.170。我们还需要添加另一台名为 pgbackrest 的服务器，IP 地址为\
  \ 192.168.122.120。\n\n## 公钥交换\n\n现在，我们将在安装 pgbackrest 之前了解如何交换公钥：\n\n- 1. 首先，让我们在两台服务器上为\
  \ Postgres 用户创建 ssh 密钥。作为 PostgreSQL 用户，请执行以下命令：\n\n```\npostgres@pgbackrest:~$\
  \ ssh-keygen -t rsa -b 4096\nGenerating public/private rsa key pair.\nEnter file\
  \ in which to save the key (/home/postgres/.ssh/id_rsa):\nCreated directory '/home/postgres/.ssh'.\n\
  Enter passphrase (empty for no passphrase):\nEnter same passphrase again:\nYour\
  \ identification has been saved in /home/postgres/.ssh/id_rsa\nYour public key has\
  \ been saved in /home/postgres/.ssh/id_rsa.pub\nThe key fingerprint is:\nSHA256:5BPKarhop6Z82WeWWtYM1i5gHseFHAVJEoKy8GFSHjQ\
  \ postgres@pgbackrest\nThe key's randomart image is:\n+---[RSA 4096]----+\n| oE.\
  \ oo+-.       |\n| +oOoo. o+o      |\n| o=..  o+.       |\n| . .  ..+o.      |\n\
  ```\n\n```\n|  .+o=S.  |\n|  .OO= =.  |\n|  o =. +. + |\n| ... = .O=.  |\n| .+o\
  \  .=  |\n+-----[SHA256]-----+ \n\npostgres@pg1:~$ ssh-keygen -t rsa -b 4096\nGenerating\
  \ public/private rsa key pair.\nEnter file in which to save the key (/home/postgres/.ssh/id_rsa):\n\
  Created directory '/home/postgres/.ssh'.\nEnter passphrase (empty for no passphrase):\n\
  Enter same passphrase again:\nYour identification has been saved in /home/postgres/.ssh/id_rsa\n\
  Your public key has been saved in /home/postgres/.ssh/id_rsa.pub\nThe key fingerprint\
  \ is:\nSHA256:g/amWaxcTGsmx2WQ91U/23UcBXmDtSs fRYhqE7dMwko postgres@pg1\nThe key's\
  \ randomart image is:\n+---[RSA 4096]----+\n|      .+*=| \n|     .E =.o==| \n| \
  \  o..X ..+B| \n|   . o*.o. O| \n|  o S.o... +.|\n|   . * =   o .| \n|   . &   \
  \  . | \n|   . %     | \n|   =       | \n+-----[SHA256]-----+\n```\n\n当我们执行 ssh-keygen\
  \ 命令时，必须确保在提示输入密码短语时只按回车键。\n\n- 2. 现在，在两台服务器上，postgres 用户的 ~/.ssh 目录中将有两个文件：\n\n\
  ```\npostgres@pgbackrest:~/.ssh$ ls -l\ntotal 8\n-rw------ 1 postgres postgres 3389\
  \ Jul 10 08:34 id_rsa\n-rw-r--r-- 1 postgres postgres  745 Jul 10 08:34 id_rsa.pub\n\
  ```\n\n```\npostgres@pg1:~/.ssh$ ls -l\ntotal 8\n-rw------ 1 postgres postgres 3381\
  \ Jul 10 08:34 id_rsa\n-rw-r--r-- 1 postgres postgres  738 Jul 10 08:34 id_rsa.pub\n\
  ```\n\n3. 在两台服务器之间交换公钥最快的方法是使用 ssh-copy-id 命令：\n\n```\npostgres@pg1:~/.ssh$ ssh-copy-id\
  \ 192.168.122.120\n[... cutted...]\nNumber of key(s) added: 1\n\nNow try logging\
  \ into the machine, with:  \"ssh '192.168.122.120'\"\nand check to make sure that\
  \ only the key(s) you wanted were added.\n\npostgres@pgbackrest:~/.ssh$ ssh-copy-id\
  \ 192.168.122.170\n[... cutted...]\n\nNumber of key(s) added: 1\n\nNow try logging\
  \ into the machine, with:  \"ssh '192.168.122.170'\"\nand check to make sure that\
  \ only the key(s) you wanted were added\n```\n\n现在，使用 postgres 用户可以在不提供密码的情况下将两台服务器连接起来。\n\
  \n## 安装 pgbackrest\n\n安装之前，我们必须检查每个主机的软件源中是否存在相同版本的 pgbackrest。检查之后，让我们在 pgbackrest\
  \ 服务器和 pg1 服务器上安装它。在类似 Debian 的服务器上，以 root 用户身份在两台服务器上执行以下命令：\n\n```\nroot@pg1:~#\
  \ apt-get update\nroot@pgbackrest:~# apt-get update\n\nroot@pg1:~# apt-get install\
  \ pgbackrest\nroot@pgbackrest:~# apt-get install pgbackrest\n```\n\n如果我们使用 RHEL\
  \ 服务器，则必须使用 yum 命令而不是 apt-get 命令。\n\n```\nprocess-max=2\nrepo-path=/var/lib/pgbackrest\n\
  repo1-retention-full=2\nrepo1-retention-archive=5\nrepo1-retention-diff=3\nlog-level-console=info\n\
  log-level-file=info\n```\n\n我们在上面看到以下选项：\n\n- start-fast=y：强制在远程服务器上执行检查点，使 pg_start_backup()\
  \ 尽快启动。\n- archive-async=y：启用 WAL 的异步传输，用于 push/pull 操作。\n- process-max=2：设置系统可用于传输/压缩操作的最大进程数。\n\
  - repo-path=/var/lib/pgbackrest：设置存储库的存储路径；运行 pgbackrest 命令的用户必须对该目录具有读/写权限。\n-\
  \ repo1-retention-full=2：要保留的全量备份数量。当全量备份过期时，与该全量备份关联的所有差异备份和/或增量备份也将过期。当未定义该选项时，系统会发出警告。如果希望无限期保留，请将该选项设置为最大值\
  \ (9,999,999)。\n- repo1-retention-archive=5：表示要保留的 WAL 文件的备份数量。使备份保持一致所需的 WAL 段始终保留到备份过期为止，无论该选项如何配置。如果未设置此值，过期的归档将根据\
  \ repo-retention-full（或 repo-retention-diff）的值自动过期，该值与归档保留类型（若设置为 full 或 diff）相对应。这将确保\
  \ WAL 文件只对已经过期的备份被视为过期。\n- repo1-retention-diff = 3：要保留的差异备份数量。当差异备份过期时，与该差异备份关联的所有增量备份也将过期。如果未定义，所有差异备份将一直保留，直到它们所依赖的全量备份过期为止。\n\
  - log-level-console=info/log-level-file=info 日志：日志管理设置；设置终端日志级别（log-level-console）和日志文件的日志级别（log-level-file）。\n\
  \n\n\n\n\nThe configuration file shown here is just a simple example; if we want\
  \ to add some more features, we just need to add them to the configuration file.\n\
  \nFor example, if we want to modify the compression level and increase it to level\
  \ 9, we can add these lines:\n\n```\ncompress = y\ncompress-level = 9\ncompress-level-network\
  \ = 9\n```\n\nIn the same way, if we want to add the cipher feature, we can add\
  \ these lines:\n\n```\nrepo1-cipher-type = aes-256-cbc\nrepo1-cipher-pass = LearnPostgreSQL\n\
  ```\n\nAfter configuring the global section, we are ready to look at how to configure\
  \ the stanza. pgbackrest introduces the idea of stanzas; in practice, we can associate\
  \ each stanza with a cluster database. The following is an example of a stanza;\
  \ it is only a coincidence that the name of the stanza, [pg1], has the same name\
  \ as the cluster. It is necessary to create a stanza for each remote PostgreSQL\
  \ server on which we want to manage backups using pgbackrest. Each stanza must have\
  \ a different name:\n\n```\n[pg1]\npg1-host = 192.168.122.170\npg1-host-user = postgres\n\
  pg1-path = /var/lib/postgresql/16/main\npg1-port = 5432\n```\n\nWe see the following\
  \ options here:\n\n- pg1-host: This is the remote host of the PostgreSQL master\
  \ server.\n- pg1-host-user = postgres: When the pg1-host parameter is set, this\
  \ is the user that we want to use to access the remote PostgreSQL server. This user\
  \ will also be the owner of the remote pgbackrest process and it starts the connection\
  \ to the PostgreSQL server. This user should be the owner of the PostgreSQL database\
  \ cluster. Usually, we can leave the default user, postgres, which is why it is\
  \ usually the same user for whom we made the exchange of public keys.\n- pg1-path\
  \ = /var/lib/postgresql/16/main: The path on the PostgreSQL cluster where the data\
  \ is stored. We can find it in the data_directory parameter inside the postgresql.conf\
  \ file.\n- pg1-port = 5432: The listen port of the remote PostgreSQL server.\n\n\
  ## Using pgbackrest with object store support\n\npgbackrest supports object stores\
  \ for Azure, GCP, and Amazon S3; that means that pgbackrest is available to store\
  \ all the data directly on a low-cost bucket using the data encryption we’ve seen\
  \ before.\n\nThe configuration is pretty simple; for example, for a GCP bucket,\
  \ we have to specify the parameters below:\n\n```\nrepo1-type=gcs\nrepo1-path=/path_on_the_bucket\n\
  repo1-gcs-bucket=bucket_name\nrepo1-gcs-key=/etc/pgbackrest-key.json\n```\n\nAdding\
  \ those parameters, pgbackrest will be able to store all data in a Google bucket;\
  \ this feature is very useful for the DBA because it allows us to store and encrypt\
  \ our data on the cloud at a small price.\n\nIn this way, we don’t have to worry\
  \ about the size of the disk that contains the repository used by pgbackrest and,\
  \ at the same time, since the cost per GB per bucket is very low, we can greatly\
  \ increase our retention. For further information about the pgbackrest configuration\
  \ with S3, Azure, and GCP buckets, you can visit the links below:\n\n- https://pgbackrest.org/user-guide.html#azure-support\n\
  - https://pgbackrest.org/user-guide.html#s3-support\n- https://pgbackrest.org/user-guide.html#gcs-support\n\
  \n## The PostgreSQL server configuration\n\nNow let’s move on to the PostgreSQL\
  \ server configuration. On the pg1 server, we need to modify the postgresql.conf\
  \ file and we need to set the pgbackrest.conf file as well.\n\n### The postgresql.conf\
  \ file\n\nFor the postgresql.conf file, we have to set wal_level to replica or logical.\
  \ It is important that the WAL level is not set to minimal, because PITR is not\
  \ possible if wal_level=minimal. We also need to tell PostgreSQL the command that\
  \ will send the WAL segment to the pgbackrest repository server.\n\nLet’s add these\
  \ lines at the end of the `postgresql.conf` file:\n\n```\n#PGBACKREST\narchive_mode\
  \ = on\nwal_level = replica #logical if we have some logical replications\narchive_command\
  \ = 'pgbackrest --stanza=pg1 archive-push %p'\n```\n\nWith the second line, we say\
  \ to PostgreSQL that the WAL segments will be archived on the pg1 stanza of the\
  \ repository server using the pgbackrest command. After restarting PostgreSQL, these\
  \ new lines will be available. As the root user, let’s perform a restart of the\
  \ PostgreSQL service:\n\n```bash\n# systemctl restart postgresql\n```\n\n### The\
  \ pgbackrest.conf file\n\nNow, after modifying `postgresql.conf`, let’s go to modify\
  \ the `pgbackrest.conf` file of the PostgreSQL server. Let’s remember that the PostgreSQL\
  \ server has ip= 192.168.122.170, and that the IP of the disaster recovery server\
  \ is 192.168.122.170. Let’s now edit the `/etc/pgbackrest.conf` file; delete what\
  \ is present and add these lines:\n\n```ini\n[global]\nbackup-host=192.168.122.120\n\
  backup-user=postgres\nbackup-ssh-port=22\nlog-level-console=info\nlog-level-file=info\n\
  \n[pg1]\npg1-path = /var/lib/postgresql/16/main\npg1-port = 5432\n```\n\nAs for\
  \ the repository configuration, the file is composed of sections: a global section\
  \ and a section for each stanza.\n\nFor the global section, we have the following\
  \ options:\n\n- `backup-host`: The repository host\n- `backup-user`: The user used\
  \ for the backup\n- `backup-ssh-port`: The ssh port\n- `log-level-console=info`\
  \ and `log-level-file=info`: As we’ve seen in the previous section\n\nFor the stanza\
  \ section, we have the following options:\n\n- `pg1-path = /var/lib/postgresql/16/main`:\
  \ The path on the PostgreSQL cluster where the data is stored. We can find it in\
  \ the `data_directory` parameter inside the `postgresql.conf` file.\n- `pg1-port\
  \ = 5432`: The listen port of the remote PostgreSQL server.\n\n## Creating and managing\
  \ continuous backups\n\nNow that we have our system well configured, let’s start\
  \ to manage our backups.\n\n### Creating the stanza\n\nThe first thing we have to\
  \ do is create the stanza on the repository server. To do this, as a postgres user,\
  \ let’s perform this command:\n\n```text\npostgres@pgbackrest:~$ pgbackrest --stanza=pg1\
  \ stanza-create\n2023-07-11 08:34:48.439 P00  INFO: stanza-create command begin\
  \ 2.46:\n--compress-level-network=9 --exec-id=2602-fbad976e --log-level-\nconsole=info\
  \ --log-level-file=info --pg1-host=192.168.122.170 --pg1-host-\nuser=postgres --pg1-path=/var/lib/postgresql/16/main\
  \ --pg1-port=5432\n--repo1-cipher-pass=<redacted> --repo1-cipher-type=aes-256-cbc\
  \ --repo1-\npath=/var/lib/pgbackrest --stanza=pg1\n2023-07-11 08:34:49.558 P00 \
  \ INFO: stanza-create for stanza 'pg1' on\nrepo1\n2023-07-11 08:34:49.741 P00  INFO:\
  \ stanza-create command end: completed\nsuccessfully (1305ms)\n```\n\nNow our stanza\
  \ is created. If we go to `/var/lib/pgbackrest`, we can find the directory structure\
  \ that will be used by the continuous backup system:\n\n```text\npostgres@pgbackrest:/var/lib/pgbackrest$\
  \ ls -l\ntotal 8\ndrwxr-x--- 3 postgres postgres 4096 Jul 11 08:34 archive\ndrwxr-x---\
  \ 3 postgres postgres 4096 Jul 11 08:34 backup\n```\n\n### Checking the stanza\n\
  \nAfter creating our stanza, let’s check whether the system is ready to accept the\
  \ continuous backup by performing this:\n\n```bash\npostgres@pgbackrest:~$ pgbackrest\
  \ --stanza=pg1 check\n```\n\n```\n[....]\n\ncompleted successfully (2868ms)\n```\n\
  \nIf everything is OK, we will receive a completed successfully message (as seen\
  \ above); now we are ready to manage continuous backup.\n\n### Managing base backups\n\
  \nAs we previously mentioned, pgbackrest is able to handle full backups, differential\
  \ backups, and incremental backups with a simple command-line statement.\n\nTo create\
  \ a full base backup, we can do this:\n\n```shell\npostgres@pgbackrest:~$ pgbackrest\
  \ --stanza=pg1 --type=full backup\n```\n\nWhen we press the *Enter* key on the keyboard,\
  \ if everything is OK, we get this message:\n\n```text\n2023-07-11 08:42:58.125\
  \ P00   INFO: expire command end: completed\nsuccessfully (46ms)\n```\n\nNow, if\
  \ we want information about our repository, we can use the info command as follows:\n\
  \n```text\npostgres@pgbackrest:~$ pgbackrest --stanza=pg1 info\nstanza: pg1\n  \
  \  status: ok\n    cipher: aes-256-cbc\n\n    db (current)\n        wal archive\
  \ min/max (15): 000000010000000000000001/00000001000000\n00000004\n\n        full\
  \ backup: 20230711-084245F\n                timestamp start/stop: 2023-07-11 08:42:45\
  \ / 2023-07-11\n08:42:57\n                wal start/stop: 000000010000000000000004\
  \ /\n000000010000000000000004\n                database size: 22.0MB, database backup\
  \ size: 22.0MB\n                repo1: backup set size: 2.9MB, backup size: 2.9MB\n\
  ```\n\nThe info command tells us about WAL segments, the full backup start time,\
  \ the original database size, and the repository backup size.\n\n\n\n\n\n以类似的方式，从这个完整备份开始，我们可以制作增量备份：\n\
  \n```\npostgres@pgbackrest:~$ pgbackrest --stanza=pg1 --type=incr backup\n\n2023-07-11\
  \ 08:44:35.816 P00  INFO: expire command end: completed successfully (15ms)\n```\n\
  \n我们也可以制作差异备份：\n\n```\npostgres@pgbackrest:~$ pgbackrest --stanza=pg1 --type=diff\
  \ backup\n\n2023-07-11 08:45:40.020 P00  INFO: expire command end: completed successfully\
  \ (32ms)\n```\n\n现在 info 命令将跟踪这三个备份：\n\n```\npostgres@pgbackrest:~$ pgbackrest --stanza=pg1\
  \ info\nstanza: pg1\n    status: ok\n    cipher: aes-256-cbc\n\n    db (current)\n\
  \        wal archive min/max (15): 00000001000000000000001/00000001000000 000000008\n\
  \n        full backup: 20230711-084245F\n            timestamp start/stop: 2023-07-11\
  \ 08:42:45 / 2023-07-11 08:42:57\n            wal start/stop: 00000001000000000000004\
  \ / 00000001000000000000004\n            database size: 22.0MB, database backup\
  \ size: 22.0MB\n            repo1: backup set size: 2.9MB, backup size: 2.9MB\n\n\
  \        incr backup: 20230711-084245F_20230711-084431I\n            timestamp start/stop:\
  \ 2023-07-11 08:44:31 / 2023-07-11 08:44:35\n            wal start/stop: 00000001000000000000006\
  \ / 00000001000000000000006\n            database size: 22.0MB, database backup\
  \ size: 8.3KB\n            repo1: backup set size: 2.9MB, backup size: 496B\n```\n\
  \n```\nbackup reference list: 20230711-084245F\n\ndiff backup: 20230711-084245F_20230711-084536D\n\
  \    timestamp start/stop: 2023-07-11 08:45:36 / 2023-07-11 08:45:39\n    wal start/stop:\
  \ 000000010000000000000008 /\n000000010000000000000008\n    database size: 22.0MB,\
  \ database backup size: 8.3KB\n    repo1: backup set size: 2.9MB, backup size: 496B\n\
  \    backup reference list: 20230711-084245F\n```\n\n由于我们在 pgbackrest.conf 文件中设置了\
  \ repo1-retention-full=2，pgbackrest 在执行两次备份后会删除第一个完整备份及其关联的差异或增量备份。例如，这里是执行两次完整备份的情况：\n\
  \n```\npostgres@pgbackrest:~$ pgbackrest --stanza=pg1 --type=full backup\n\n2023-07-11\
  \ 08:48:39.866 P00  INFO: expire command end: completed successfully (22ms)\n\n\
  postgres@pgbackrest:~$ pgbackrest --stanza=pg1 --type=full backup\n\n2023-07-11\
  \ 08:49:37.101 P00  INFO: expire command end: completed successfully (34ms)\n```\n\
  \n我们将得到以下结果：\n\n```\npostgres@pgbackrest:~$ pgbackrest --stanza=pg1 info\nstanza:\
  \ pg1\n    status: ok\n    cipher: aes-256-cbc\n\n    db (current)\n        wal\
  \ archive min/max (15): 000000010000000000000001/00000001000000000000000C\n\n  \
  \      full backup: 20230711-084830F\n            timestamp start/stop: 2023-07-11\
  \ 08:48:30 / 2023-07-11 08:48:39\n```\n\n# DROP TABLE\n\n现在让我们尝试在 2023-07-11 08:55:08\
  \ 进行恢复，这是灾难发生之前的时间。在 pg1 服务器上，我们需要停止 postgresql 服务器：\n\n```\n# systemctl stop postgresql\n\
  ```\n\n然后我们执行 pgbackrest restore 命令：\n\n```\nroot@pg1:# su - postgres\npostgres@pg1:$\
  \ pgbackrest --stanza=pg1 --delta --log-level-console=info --type=time \"--target=2023-07-11\
  \ 08:55:08\" restore\n\n2023-07-11 08:57:39.803 P00  INFO: restore command end:\
  \ completed successfully (1905ms)\n```\n\n现在让我们以 root 用户身份启动 postgresql 服务器：\n\n\
  ```\n# systemctl start postgresql\n```\n\n然后我们检查 postgresql 日志：\n\n```\n2023-07-11\
  \ 08:59:06.844 P00  INFO: archive-get command end: completed successfully (532ms)\n\
  2023-07-11 08:59:06.849 UTC [8786] LOG:  restored log file \"0000000100000000000000D\"\
  \ from archive\n2023-07-11 08:59:06.898 UTC [8786] LOG:  consistent recovery state\
  \ reached at 0/C000138\n2023-07-11 08:59:06.898 UTC [8783] LOG:  database system\
  \ is ready to accept read-only connections\n2023-07-11 08:59:06.938 P00  INFO: archive-get\
  \ command begin 2.46: [0000000100000000000000E, pg_wal/RECOVERYXLOG] --exec-id=8797-9e31ebc7\
  \ --log-level-console=info --log-level-file=info --pg1-path=/var/lib/postgresql/15/main\
  \ --repo1-host=192.168.122.120 --repo1-host-port=22 --repo1-host-user=postgres --stanza=pg1\n\
  2023-07-11 08:59:07.274 P00  INFO: unable to find 0000000100000000000000E in the\
  \ archive\n2023-07-11 08:59:07.375 P00  INFO: archive-get command end: completed\
  \ successfully (440ms)\n```\n\n```\n2023-07-11 08:59:07.379 UTC [8786] LOG:  recovery\
  \ stopping before commit of transaction 737, time 2023-07-11 08:55:13.072211+00\n\
  2023-07-11 08:59:07.379 UTC [8786] LOG:  pausing at the end of recovery\n\n2023-07-11\
  \ 08:59:07.379 UTC [8786] HINT:  Execute pg_wal_replay_resume()\nto promote.\n```\n\
  \n正如我们所见，为了结束我们的 PITR 过程，PostgreSQL 建议我们执行 pg_wal_replay_resume()。因此，让我们进入 PostgreSQL\
  \ 环境并执行以下操作：\n\n```\npostgres=# select pg_wal_replay_resume();\npg_wal_replay_resume\n\
  ----------------------\n\n(1 row)\n```\n\n现在如果我们去检查我们的数据库 db1，users 表现在存在并且数据库现在处于\
  \ 2020-05-30 16:23:38 时的状态：\n\n```\npostgres=# \\d\n       List of relations\n Schema\
  \ |  Name  | Type  |  Owner  \n--------+--------+-------+----------\n public | users\
  \  | table | postgres\n(1 row)\n```\n\n最后，我们可以执行以下操作：\n\n```\npostgres=# select\
  \ count(*) from users ;\n count \n-------\n 10000\n(1 row)\n```\n\n我们现在已恢复灾难发生前的状况。\n\
  \n正如我们所见，使用 pgbackrest 管理连续备份和 PITR 非常简单。连续备份和 PITR 在复杂生产环境的设置中绝不应该缺失。这可以保护我们免受不必要的数据删除，并为我们提供“最后手段”，以防主服务器和副本服务器都不可用时使用。\n\
  \n# 使用 pgloader 从 MySQL/MariaDB 迁移到 PostgreSQL\n\n在本节中，我们将看到如何以非常简单的方式将数据库从 MySQL/MariaDB\
  \ 世界迁移到 PostgreSQL 世界。我们将使用的工具称为 pgloader。有关本节的进一步信息的参考资料可在 https://pgloader.io\
  \ 找到。\n\n本节有两个 Docker 容器可用，一个内部包含 mariadb 服务器，另一个内部包含 postgresql 服务器。名为 mariadb-source\
  \ 的 mariadb 服务器包含在 *第 4 章* 中使用的 forumdb 数据库的副本；名为 pg-destination 的 postgresql 服务器包含一个空的\
  \ forumdb 数据库。我们的目标将是使用 pgloader 工具将 forumdb 数据库的所有内容从 mariadb-source 服务器迁移到 postgresql-destination\
  \ 服务器。\n\n让我们打开两个 Bash 终端，并在第一个中执行：\n\n```\n```bash\nchapter19$ bash run-pg-docker-mariadb.sh\n\
  ```\n```\n\n容器启动后，让我们使用 LearnPostgreSQL 作为密码执行以下语句：\n\n```\n```text\nroot@mariadb-source:~#\
  \ mysql -D forumdb -p\n[...]\nCopyright (c) 2000, 2018, Oracle, MariaDB Corporation\
  \ Ab and others.\n\nType 'help;' or '\\h' for help. Type '\\c' to clear the current\
  \ input statement.\n\nMariaDB [forumdb]>\n```\n```\n\n现在我们进入了 forumdb 数据库，我们可以在其上执行查询：\n\
  \n```\n```text\nMariaDB [forumdb]> show tables;\n+------------------+\n| Tables_in_forumdb\
  \ |\n+------------------+\n| categories       |\n| j_posts_tags     |\n| posts \
  \           |\n```\n```\n\n```\n```text\n| tags                 |\n| users     \
  \           |\n+----------------------+\n\n5 rows in set (0.000 sec)\n\nMariaDB\
  \ [forumdb]> select * from categories;\n+----+----------------------+-----------------------------+\n\
  | pk | title                | description                 |\n+----+----------------------+-----------------------------+\n\
  |  1 | Database             | Database related discussions|\n|  2 | Unix       \
  \         | Unix and Linux discussions  |\n|  3 | Programming Languages| All about\
  \ programming languages |\n+----+----------------------+-----------------------------+\n\
  3 rows in set (0.002 sec)\n\nMariaDB [forumdb]> select * from users;\n+----+----------+--------------+----------------------+\n\
  | pk | username | gecos        | email                |\n+----+----------+--------------+----------------------+\n\
  |  1 | fluca1978| Luca Ferrari | fluca1978@gmail.com  |\n|  2 | sscotty71| Enrico\
  \ Pirozzi | sscptty71@gmail.com |\n+----+----------+--------------+----------------------+\n\
  2 rows in set (0.001 sec)\n```\n```\n\n正如我们所见，数据库与我们在 *第 4 章，基本语句* 中使用的一样。\n\n现在让我们转到第二个\
  \ Bash 终端并执行：\n\n```\n```bash\nchapter19$ bash run-pg-docker-postgresql.sh\n```\n\
  ```\n\n容器启动后，让我们执行：\n\n```\n```bash\npostgres@pg-destination:~$ psql forumdb\n```\n\
  ```\n\n正如下方所示，我们的 postgresql 数据库是空的：\n\n```\n```text\npostgres@pg-destination:~$\
  \ psql forumdb\nforumdb=# \\d\nDid not find any relations.\n```\n```\n\n\n\n\n\n\
  现在让我们退出 psql 客户端并执行 pgloader 命令：\n\n```\nforumdb=# \\q\nppostgres@pg-destination:~$\
  \ pgloader mysql://root:LearnPostgreSQL@mariadb-source/forumdb pgsql://postgres@127.0.0.1/forumdb\n\
  \ntable name          errors   rows    bytes    total time\n-------------------\
  \  -------  ------  -------  ----------\nfetch meta data            0      22  \
  \              0.104s\nCreate Schemas             0       0                0.000s\n\
  Create SQL Types           0       0                0.004s\nCreate tables      \
  \        0      10                0.056s\nSet Table OIDs             0       5 \
  \               0.020s\n-------------------  -------  ------  -------  ----------\n\
  forumdb.categories         0       3    0.1 kB       0.020s\nforumdb.users     \
  \         0       2    0.1 kB       0.016s\nforumdb.j_posts_tags       0       0\
  \                0.012s\nforumdb.tags               0       0                0.016s\n\
  forumdb.posts              0       0                0.012s\n-------------------\
  \  -------  ------  -------  ----------\nCOPY Threads Completion    0       4  \
  \              0.024s\nIndex Build Completion     0      11                0.048s\n\
  Create Indexes             0      11                0.092s\nReset Sequences    \
  \        0       4                0.012s\nPrimary Keys               0       4 \
  \               0.004s\nCreate Foreign Keys        0       6                0.004s\n\
  Create Triggers            0       0                0.000s\nSet Search Path    \
  \        0       1                0.000s\nInstall Comments           0       0 \
  \               0.000s\n-------------------  -------  ------  -------  ----------\n\
  Total import time          ?       5    0.2 kB       0.184s\n```\n\n使用上面的简单命令，我们已将\
  \ mariadb forumdb 数据库迁移到 postgresql forumdb 数据库。现在让我们去检查是否已全部迁移；让我们重新连接到 postgresql\
  \ 服务器上的 forumdb：\n\n```\npostgres@pg-destination:~$ psql forumdb\n```\n\n现在我们可以使用名为\
  \ forumdb 的用户访问 postgresql 数据库 forumdb：\n\n```\npostgres@pg-destination:~$ psql\
  \ -U forumdb forumdb\n\nforumdb=> select * from categories;\n pk |      title  \
  \    |          description\n----+-----------------+-------------------------------\n\
  \  1 | Database        | Database related discussions\n  2 | Unix            | Unix\
  \ and Linux discussions\n  3 | Programming Languages | All about programming languages\n\
  (3 rows)\n\nforumdb=> select * from users;\n pk | username  |    gecos     |   \
  \   email\n----+-----------+--------------+--------------------\n  1 | fluca1978\
  \ | Luca Ferrari | fluca1978@gmail.com\n  2 | sscotty71 | Enrico Pirozzi | sscptty71@gmail.com\n\
  (2 rows)\n```\n\n## 摘要\n\n在本章中，我们探索了一些 PostgreSQL 可用的扩展和工具。我们选择不提供 PostgreSQL 可用的一切的概述，而是专门聚焦于一些能够节省\
  \ DBA 时间的工具和扩展。我们谈到了 pgbackrest，这是一个用于管理恢复和 PITR 的非常有用的工具。我们还谈到了 pgloader，这是一个用于从其他\
  \ DBMS 迁移到 PostgreSQL 的强大工具。然后我们展示了一个从 MariaDB 迁移到 PostgreSQL 的简单示例。\n\n## 验证你的知识\n\
  \n- 如果 myfield 是 mytable 表的 varchar(200) 字段，语句 create index on mytable(myfield)\
  \ 是否会改善类似 foo% 的 where 条件查询？\n  \n  不会，上面的语句不会改善类似 ‘foo%’ 的 where 条件查询；要使其成为可能，我们必须使用\
  \ create index on mytable using btree(my field varchar_pattern_ops);。请参阅 *Exploring\
  \ the pg_trgm extension* 部分了解更多详情。\n- 是否可以使用索引和各种 like 和 ilike 查询？\n\n可以，使用 pg_trgm。参阅\
  \ *Exploring the pg_trgm extension* 部分了解更多详情。\n\n- 什么是时间点恢复 PITR？\n  \n  在给定保留期的情况下，时间点恢复是指能够恢复到过去任意时间点的能力。参阅\
  \ *Disaster recovery with pgbackrest* 部分了解更多详情。\n\n- PostgreSQL 是否有工具可以帮助我们管理连续备份和时间点恢复？\n\
  \  \n  是的，它有多个工具可以帮助我们管理连续备份和 PITR，其中之一叫做 pgbackrest。参阅 *Disaster recovery with\
  \ pgbackrest* 部分了解更多详情。\n\n- 是否可以直接连接到另一台 PostgreSQL 服务器？\n  \n  可以，使用 PostgreSQL\
  \ 外部数据包装器扩展。参阅 *Using foreign data wrappers and the postgres_fdw extension* 部分了解更多详情。\n\
