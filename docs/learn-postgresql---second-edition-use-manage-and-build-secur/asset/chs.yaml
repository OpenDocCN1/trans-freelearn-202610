  basilea_partitioned_1  (cost=0.00..217.30 rows=8758 width=40) (actual time=0.030..4.466\
  \ rows=8759 loops=1)\n        Filter: ((insert_time >= '2021-01-01 00:00:00+00'::timestamp\
  \ with time zone) AND (insert_time < '2023-01-01 00:00:00+00'::timestamp with time\
  \ zone))\nRows Removed by Filter: 1\n```\n\n```\nenumvals       | {partition,on,off}\n\
  boot_val       | partition\nreset_val      | partition\nsourcefile     |\n\nsourceline\
  \     |\npending_restart | f\n```\n\n该参数使得查询优化器可以从搜索中排除某些子表。正如你在前面的代码中所见，`constraint_exclusion`\
  \ 参数的可能取值如下：\n\n+   - **on:** 设置此值时，PostgreSQL 会检查所有表。\n+   - **off:** 设置此值时，PostgreSQL\
  \ 不会检查任何约束。\n+   - **partition:** 使用此值时，PostgreSQL 会检查 UNION ALL 子查询的约束，仅针对继承子表。`partition`\
  \ 是默认设置。\n\n有关更多信息，请参阅 https://www.postgresql.org/docs/current/runtime-config-query.html#GUC-CONSTRAINT-EXCLUSION。\n\
  \n## Summary\n\n在本章中，我们介绍了 PostgreSQL 中表分区的主题。随着表变得越来越大，分区表很有用，因为查询会变得越来越慢。我们首先介绍了分区的概念。我们讨论了范围分区、列表分区和哈希分区。我们还通过使用表空间的示例介绍了列表分区和范围分区。\n\
  \n我们将在 *第 13 章，索引和性能优化* 中再次讨论分区。在下一章中，我们将讨论 PostgreSQL 如何管理用户、角色，以及总体上数据库的安全性。\n\
  \n## Verify your knowledge\n\n+   - 是否可以在 PostgreSQL 中执行声明式分区？\n\n是的，从 PostgreSQL\
  \ 10 开始，可以使用声明式分区。\n\n请参阅 *探索声明式分区* 部分了解更多详情。\n\n+   - 如果我们有一个如下的表：\n\n```\nCREATE\
  \ TABLE mytable (\n    pk serial NOT NULL,\n    create_date date not null default\
  \ now()::date,\n    primary key (pk)\n)\n```\n\n+   - 是否可以按范围对该表进行分区？是的，可以通过编写如下内容来实现：\n\
  \n```\nCREATE TABLE mytable (\n    pk serial NOT NULL,\n    create_date date not\
  \ null default now()::date,\n    primary key (pk,creat_edate)\n)PARTITION BY RANGE\
  \ (create_date);\nCREATE TABLE\n\nforumdb=> CREATE TABLE part_tags_date_01 PARTITION\
  \ OF part_tags FOR\nVALUES FROM ('2023-01-01') TO ('2023-06-31');\nforumdb=> CREATE\
  \ TABLE part_tags_date_01 PARTITION OF part_tags FOR\nVALUES FROM ('2023-07-01')\
  \ TO ('2023-12-31');\n```\n\n请参阅 *探索声明式分区* 部分了解更多详情。\n\n+   - 默认分区是什么？\n\n默认分区确保不会丢失数据；如果\
  \ PostgreSQL 找不到存储记录的子表，则记录将保存在默认分区中。\n\n请参阅 *默认分区* 部分了解更多详情。\n\n+   - 我们可以将数据拆分到不同的磁盘上吗？\n\
  \n是的，可以使用表空间。\n\n请参阅 *分区和表空间* 部分了解更多详情。\n\n+   - PostgreSQL 是否管理分区表上的索引？\n\n是的，PostgreSQL\
  \ 管理分区表上的索引；如果我们在父表上构建索引，PostgreSQL 将负责在所有子表上构建索引。\n\n## References\n\n+   - PostgreSQL\
  \ 官方文档关于表分区：https://www.postgresql.org/docs/current/ddl-partitioning.html\n+   -\
