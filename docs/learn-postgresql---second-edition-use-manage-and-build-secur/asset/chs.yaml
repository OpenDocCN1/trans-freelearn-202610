- "## 11\n\n## 事务、MVCC、WAL 和检查点\n\n本章向你介绍事务，这是每个企业级数据库系统的基本组成部分。事务是数据库管理多个操作的方式，使其如同单个原子操作。PostgreSQL\
  \ 具有非常丰富且符合标准的事务机制，允许用户具体定义事务属性，包括嵌套事务。\n\nPostgreSQL 严重依赖事务来保持数据在并发连接和并行活动中的一致性，并且得益于\
  \ **预写日志（WALs）**，PostgreSQL 尽最大努力保持数据安全可靠。此外，PostgreSQL 实现了 **多版本并发控制（MVCC）**，这是一种在事务之间保持高并发的方式。\n\
  \n本章可分为两部分：第一部分更实用，提供事务是什么、如何使用以及如何理解 MVCC 的具体示例。第二部分更理论化，解释 WAL 的工作原理，以及它们如何使 PostgreSQL\
  \ 即使在崩溃后也能恢复。\n\n在本章中，你将学习以下主题：\n\n- 事务属性\n- 事务隔离级别\n- MVCC 是什么以及它如何工作\n- 保存点\n\n\
  \n\n\n\n在我们能够检查两种类型的事务并进行比较之前，我们需要对事务概念有更多一点的背景知识。\n\n首先，任何事务都被分配一个唯一的编号，称为事务标识符，或简称为\
  \ xid。系统会自动为新创建的事务——无论是隐式还是显式——分配一个 xid，并保证数据库中在同一时间不存在两个具有完全相同 xid 的事务。\n\n我们在解释事务时需要尽早理解的另一个主要概念是，PostgreSQL\
  \ 会将生成和/或修改某个元组的 xid 存储在元组本身内部。其原因在我们看到 PostgreSQL 如何处理事务并发时就会变得清晰，因此，就本部分而言，让我们假设数据库中每个表里的每个元组都自动标记有创建该元组的事务的\
  \ xid 值。\n\n你可以通过特殊的函数 txid_current() 来检查当前事务是什么。例如，如果你向系统询问几个简单的语句，比如当前时间，你会看到每个\
  \ SELECT 语句都是作为不同的事务执行的：\n\n```\nforumdb=> SELECT current_time, txid_current();\n\
  \    current_time     | txid_current\n--------------------+-------------\n 16:51:35.042584+01\
  \ |        4813\n(1 row)\n\nforumdb=> SELECT current_time, txid_current();\n   \
  \ current_time     | txid_current\n--------------------+-------------\n 16:52:23.028124+01\
  \ |        4814\n(1 row)\n```\n\n正如前面的示例所示，系统已为每个语句分别分配了两个不同的事务标识符，分别是 4813 和 4814，证实了这些语句是在不同的隐式事务中执行的。你在自己的系统上可能会得到不同的数字。\n\
  \n如果你检查表中特殊的隐藏列 xmin，你可以获取有关创建元组的事务的信息；看下面的例子：\n\n```\nforumdb=> SELECT xmin, *\
  \ FROM categories;\n xmin | pk | title | description\n------+-----+--------------------------------+-----------------------------------\n\
  \ 561 |   1 | DATABASE                       | Database related discussions\n 561\
  \ |   2 | UNIX                           | Unix and Linux discussions\n 561 |  \
  \ 3 | PROGRAMMING LANGUAGES          | All about programming languages\n(3 rows)\n\
  ```\n\n正如你所见，前表中所有的元组都是由同一个事务，即编号 561 创建的。\n\n> PostgreSQL 管理了一些不同的隐藏列，你在查询表时需要显式请求才能看到它们。特别是，每个表都有\
  \ xmin、xmax、cmin 和 cmax 隐藏列。它们的使用和目的将在本章后面进行解释。\n\n现在你已经知道每个事务都有编号，并且这些编号用于标记每个表中的元组，我们可以继续前进，看看隐式事务和显式事务之间的区别。\n\
  \n## 比较隐式和显式事务\n\n隐式事务是你没有请求但系统会应用到你的语句上的事务。换句话说，是 PostgreSQL 决定事务何时开始、何时结束（事务边界），规则很简单：每个单独的语句都在其自己的独立事务中执行。\n\
  \n为了更好地理解这个概念，让我们向表中插入几条记录：\n\n```\nforumdb=> INSERT INTO tags( tag ) VALUES( 'linux'\
  \ );\nINSERT 0 1\nforumdb=> INSERT INTO tags( tag ) VALUES( 'BSD' );\nINSERT 0 1\n\
  forumdb=> INSERT INTO tags( tag ) VALUES( 'Java' );\nINSERT 0 1\nforumdb=> INSERT\
  \ INTO tags( tag ) VALUES( 'Perl' );\nINSERT 0 1\nforumdb=> INSERT INTO tags( tag\
  \ ) VALUES( 'Raku' );\nINSERT 0 1\n```\n\n让我们查询表中的数据是什么：\n\n```\n```text\nforumdb=>\
  \ SELECT xmin, * FROM tags;\n xmin | pk | tag  | parent\n------+----+------+--------\n\
  \ 4824 |  9 | linux |\n 4825 | 10 | BSD   |\n 4826 | 11 | Java  |\n 4827 | 12 |\
  \ Perl  |\n 4828 | 13 | Raku  |\n(5 rows)\n```\n```\n\n正如你所见，xmin 字段对每个插入的元组都有不同的（自增）值，这意味着为元组分配了一个新的事务标识符（xid），或者更准确地说，为执行\
  \ INSERT 的语句分配了 xid。这意味着每个单独的语句都在其自己的单语句包装事务中执行。\n\n> 你看到 xid 递增一个单位，是因为在用于示例的机器上没有并发，即没有其他数据库活动正在进行。然而，你不能对在具有不同并发连接和正在运行语句的实时系统中下一个\
  \ xid 会是什么做出任何预测。\n\n如果我们一次性插入所有之前的标签，并确保如果其中任何一个由于任何原因无法存储，则全部消失怎么办？为此，我们可以使用 *显式事务*。显式事务是一组语句，具有明确的事务边界：你发出\
  \ BEGIN 语句来标记事务的开始，然后用 COMMIT 或 ROLLBACK 来结束事务。如果你发出 COMMIT，事务被标记为成功；因此，修改的数据会永久存储。另一方面，如果你发出\
  \ ROLLBACK，事务被认为失败，所有更改都会消失。\n\n让我们在实践中看看这一点——再添加一批标签，但这次在单个显式事务内：\n\n```\n```text\n\
  forumdb=> BEGIN;\nBEGIN\nforumdb=*> INSERT INTO tags( tag ) VALUES( 'PHP' );\nINSERT\
  \ 0 1\n```\n\n```\nforumdb=> INSERT INTO tags( tag ) VALUES( 'C#' );\nINSERT 0 1\n\
  forumdb=>* COMMIT;\nCOMMIT\n```\n\n与之前的一批 INSERT 语句相比，唯一的区别是显式使用了 BEGIN 和 COMMIT；由于事务已提交，数据必须存储在表中：\n\
  \n```\nforumdb=> SELECT xmin, * FROM tags;\nxmin | pk | tag | parent\n-------+----+-------+--------\n\
  4824 | 9 | linux |\n4825 | 10 | BSD |\n4826 | 11 | Java |\n4827 | 12 | Perl |\n\
  4828 | 13 | Raku |\n4829 | 14 | PHP |\n4829 | 15 | C# |\n(7 rows)\n```\n\n正如你所见，数据不仅如我们预期那样被存储，而且最后两行也有完全相同的事务标识符，即\
  \ 4829。这意味着 PostgreSQL 以某种方式将两个不同的语句合并为一个。\n\n> 当你发出显式事务时，psql 会更改其提示，在提示中添加一个星号，以提醒你处于一个打开的事务中（即尚未完成的事务）。如果事务因错误而被中止，星号会被改为感叹号。\n\
  \n让我们看看如果事务以 ROLLBACK 语句结束会发生什么——最终结果是更改不应被存储。作为示例，将每个元组的标签值修改为全大写：\n\n```\nforumdb=>\
  \ BEGIN;\nBEGIN\nforumdb=>* UPDATE tags SET tag = upper( tag );\nUPDATE 7\nforumdb=>*\
  \ SELECT tag FROM tags;\n```\n\n最简单的例子是当你输入语法错误时：\n\n```\n```text\nforumdb=> BEGIN;\n\
  BEGIN\nforumdb=*> UPDATE tags SET tag = uppr( tag );\nERROR:  function uppr(text)\
  \ does not exist\nLINE 1: UPDATE tags SET tag = uppr( tag );\n                 \
  \             ^\nHINT:  No function matches the given name and argument types. You\
  \ might\nneed to add explicit type casts.\nforumdb=!> COMMIT;\nROLLBACK\n```\n```\n\
  \n当 PostgreSQL 遇到错误时，它会中止当前事务。中止事务意味着，虽然事务仍处于打开状态，但它不会执行任何后续命令，也不会执行 COMMIT，并且在你关闭事务时会自动发出\
  \ ROLLBACK 命令。因此，即使你在错误后尝试继续工作，PostgreSQL 也会拒绝接受你的语句：\n\n```\n```text\nforumdb=>\
  \ BEGIN;\nBEGIN\nforumdb=*> INSERT INTO tags( tag ) VALUES( 'C#' );\nINSERT 0 1\n\
  forumdb=*> INSERT INTO tags( tag ) VALUES( PHP );\nERROR:  column \"php\" does not\
  \ exist\nLINE 1: INSERT INTO tags( tag ) VALUES( PHP );\nforumdb=!> INSERT INTO\
  \ tags( tag ) VALUES( 'Ocaml' );\nERROR:  current transaction is aborted, commands\
  \ ignored until end of\ntransaction block\nforumdb=!> COMMIT;\nROLLBACK\n```\n```\n\
  \n无论如何，处理语法错误或拼写错误的对象的名称并不是你在运行事务时可能遇到的唯一问题，而且无论如何，这些问题都很容易修复，但你也可能会发现你的事务无法继续，因为存在某些数据约束阻止语句成功完成。想象一下，我们不允许任何描述少于两个字符的标签：\n\
  \n```\n```sql\nforumdb=> ALTER TABLE tags\n             ADD CONSTRAINT constraint_tag_length\n\
  ```\n\n\n\n\n\n```\nCHECK ( length( tag ) >= 2 );\nALTER TABLE\n```\n\n考虑一个执行两个不同\
  \ INSERT 语句的工作单元，如下所示：\n\n```\nforumdb=> BEGIN;\nBEGIN\nforumdb=*> INSERT INTO tags(\
  \ tag ) VALUES( 'C' );\nERROR:  new row for relation \"tags\" violates check constraint\
  \ \"constraint_tag_length\"\nDETAIL:  Failing row contains (17, C, null).\nforumdb=!>\
  \ INSERT INTO tags( tag ) VALUES( 'C++' );\nERROR:  current transaction is aborted,\
  \ commands ignored until end of transaction block\nforumdb=!> COMMIT;\nROLLBACK\n\
  ```\n\n正如你所见，一旦 DML 语句失败，PostgreSQL 就会中止事务并拒绝处理任何其他语句。你清除这种情况的唯一方法是通过结束显式事务，而无论你以何种方式结束它（COMMIT\
  \ 或 ROLLBACK），PostgreSQL 都会丢弃你的更改，回滚当前事务。完全相同的逻辑也适用于隐式事务：当语句失败（出于任何原因）时，PostgreSQL\
  \ 会回滚包装该语句的隐式事务，最终结果是数据根本不会持久化。\n\n在前面的示例中，我们一直展示事务以 COMMIT 结束，但很明显，当你对数据、所做的更改或不可恢复的错误存有疑虑时，你应该发出\
  \ ROLLBACK。我们展示 COMMIT 是为了明确 PostgreSQL 会防止错误的工作成功终止。\n\n那么，你应该在什么时候使用显式事务？每当你有一个必须全部成功或全部失败的工作负载时，你就必须将其包装在显式事务中。特别是，当丢失工作的一部分可能会损害剩余数据时，使用事务是一个好时机。例如，想象一个在线购物应用程序：你肯定不希望在更新客户购物车并检查存储中产品的可用性之前就向客户收费。另一方面，作为客户，我也不希望收到订单已确认的消息，却发现由于某种原因付款失败。\n\
  \n因此，由于所有步骤和操作都必须以原子方式执行（检查产品的可用性、更新购物车、收取付款、确认订单），显式事务是我们保持数据一致性所需要的。\n\n## 事务中的时间\n\
  \n事务是*时间离散的*：在事务期间时间不会改变。你可以通过开启一个事务并多次查询当前时间来轻松看到这一点：\n\n```\nforumdb=> BEGIN;\n\
  BEGIN\nforumdb=*> SELECT CURRENT_TIME;\n    current_time\n-------------------\n\
  14:51:50.730287+01\n(1 row)\n\nforumdb=*> SELECT pg_sleep_for( '5 seconds' );\n\
  \ pg_sleep_for\n-------------\n\n(1 row)\n\nforumdb=*> SELECT CURRENT_TIME;\n  \
  \  current_time\n-------------------\n14:51:50.730287+01\n(1 row)\n\nforumdb=*>\
  \ ROLLBACK;\nROLLBACK\n```\n\n如果你在运行事务时确实需要一个时间连续的来源，可以使用 clock_timestamp()：\n\n\
  ```\nforumdb=> BEGIN;\nBEGIN\nforumdb=*> SELECT CURRENT_TIME, clock_timestamp()::time;\n\
  \    current_time    | clock_timestamp\n-------------------+---------------\n14:53:17.479177+01\
  \ | 14:53:22.152435\n(1 row)\n\nforumdb=*> SELECT pg_sleep_for( '5 seconds' );\n\
  pg_sleep_for\n-------------\n\n(1 row)\n\nforumdb=*> SELECT CURRENT_TIME, clock_timestamp()::time;\n\
  \    current_time    | clock_timestamp\n---------------------+-----------------\n\
  14:53:17.479177+01 | 14:53:33.022884\n(1 row)\n\nforumdb=*> ROLLBACK;\nROLLBACK\n\
  ```\n\n我们如何区分一个事务和另一个事务？每个事务都有一个标识符，如以下章节所述。\n\n## 更多关于事务标识符的信息 — XID  wraparound\
  \ 问题\n\n如前所述，每个事务都与一个称为 xid 的数字标识符相关联，其中 x 代表事务，id 代表标识符。这样的计数器使用 modulo 2³¹ 操作，因此对于任何当前\
  \ xid 值，未来有 2³¹ 个事务，即具有更高值的事务。另一方面，过去有 2³¹ 个事务，即具有更低值的事务。因此，xid 计数器是一个循环值。\n\nPostgreSQL\
  \ 在任何情况下都不允许两个事务共享相同的 xid。然而，作为一个自动递增的计数器，xid 迟早会进行 wraparound，这意味着它会重新开始计数。这就是所谓的\
  \ xid wraparound 问题，PostgreSQL 为防止这种情况发生做了大量工作，如你稍后会看到的。但如果数据库接近 wraparound，PostgreSQL\
  \ 会在日志中开始发出类似以下的警告：\n\n```\nWARNING:  database \"forumdb\" must be vacuumed within\
  \ 177009986 transactions\n\nHINT:  To avoid a database shutdown, execute a database-wide\
  \ VACUUM in \"forumdb\".\n```\n\n如果你仔细阅读警告信息，你会看到系统正在告诉系统管理员，一旦检测到 xid wraparound\
  \ 的风险，它就会关闭。原因是在这种情况下，数据可能会丢失，因此为了防止这种情况，系统会在 xid wraparound 接近时自动关闭。\n\n然而，有一种方法可以避免这种自动关闭，即通过\
  \ PostgreSQL 工具 VACUUM 强制清理。正如你将在本章后面看到的，VACUUM 的能力之一是将旧元组冻结以防止 xid wraparound 的副作用，从而允许数据库服务的连续性。但\
  \ xid wraparound 的影响是什么？\n\n为了理解这些问题，我们必须记住每个事务都被分配一个唯一的 xid，并且下一个可分配的 xid 是通过将上一个分配的\
  \ xid 增加一个单位获得的。\n\n这意味着具有更高 xid 的事务比具有更低 xid 的事务开始得更晚，即使这两个事务可能并行运行。由于每个元组在每个表中都存储创建该元组的事务标识符（在隐藏字段\
  \ xmin 中），具有更高 xid 的元组必须是在具有更低创建 xid 的元组之后创建的。\n\n但当 xid 溢出并因此从低数字重新开始编号时，后开始的事务将显示出比正在运行的事务更低的\
  \ xid，因此它们会突然出现在过去。作为结果，具有更高事务 xmin 的元组似乎是在未来创建的，因此时间工作流程和元组存储会出现不匹配。\n\n为了避免 xid\
  \ wraparound，PostgreSQL 实现了所谓的*元组冻结*：一旦元组被冻结，其 xmin 必须被认为相对于任何正在运行的事务始终在过去，即使其 xmin\
  \ 的值高于任何当前正在运行的事务 xid。事实上，每个元组都包含一个特殊的信息位，告诉 PostgreSQL 该元组是否已被冻结。\n\n因此，随着 xid\
  \ 溢出临近，VACUUM 会执行广泛的冻结操作，将数据库中所有过去的元组标记为已冻结，这样即使 xid 从较低的数字重新开始计数，数据库中已有的元组也始终会出现在过去。\n\
  \nxid 计数器从特殊值 3 开始，将较低值保留用于内部使用。因此，不可能存在 xid 低于 3 的正在运行的事务。在旧版本的 PostgreSQL 中，VACUUM\
  \ 字面地删除了要冻结的元组的 xmin 值，用特殊值 2 替换其值，该值低于最小可用值 3，表明该元组在过去。然而，当需要取证分析时，保留原始 xmin 是有价值的，因此\
  \ PostgreSQL 现在使用状态位来指示元组是否已被冻结。\n\n## 虚拟和真实事务标识符\n\n作为一个如此重要的资源，PostgreSQL 足够智能以避免浪费事务标识符编号。特别是，当事务启动时，集群使用虚拟\
  \ xid，它的工作方式类似于 xid，但不是从事务标识符计数器获得。这样，每个事务从一开始就不会消耗一个 xid 数字，从而减少了冻结的需求。一旦事务执行了一些涉及数据操作和更改的工作，虚拟\
  \ xid 就会转变为真实 xid，即从 xid 计数器获得的 xid。换句话说，任何“只读”工作负载都不会消耗事务标识符，而任何涉及数据写入的工作负载都会。\n\
  \n多亏了这项额外工作，PostgreSQL 不会在那些不需要强标识的事务上浪费事务标识符。例如，没有必要在一个像下面这样的事务块上浪费一个 xid：\n\n\
  ```\nforumdb=> BEGIN;\nBEGIN\nforumdb=*> ROLLBACK;\nROLLBACK\n```\n\n由于前面的事务根本什么都没做，为什么\
  \ PostgreSQL 要涉及所有 xid 机制呢？没有理由使用一个不会附加到数据库中任何元组上、因此不会干扰任何活动快照的 xid。\n\n\n\n\n\n\
  然而，有一点很重要需要注意：`txid_current()` 函数的使用总是会物化一个 xid，即使事务尚未获得一个。为此，PostgreSQL 提供了另一个名为\
  \ `txid_current_if_assigned()` 的 introspection 函数，如果事务仍处于虚拟 xid 空间中，并且因此尚未执行任何可写操作，则该函数返回\
  \ NULL。需要注意的是，除非事务操作了某些数据，否则 PostgreSQL 不会分配真实的 xid，这可以通过以下工作流程轻松证明：\n\n```\nforumdb=>\
  \ BEGIN;\nBEGIN\n\nforumdb=> SELECT txid_current_if_assigned();\ntxid_current_if_assigned\n\
  -----------------------------\n\n(1 row)\n\nforumdb=> SELECT count(*) FROM tags;\n\
  \ count\n-------\n     7\n\n(1 row)\n\nforumdb=> SELECT txid_current_if_assigned();\n\
  txid_current_if_assigned\n-----------------------------\n\n(1 row)\n\nforumdb=>\
  \ UPDATE tags SET tag = upper( tag );\nUPDATE 7\nforumdb=> SELECT txid_current_if_assigned();\n\
  txid_current_if_assigned\n-----------------------------\n       4837\n```\n\n```\n\
  (1 row)\n\nforumdb=> SELECT txid_current();\n txid_current\n---------------\n  \
  \     4837\n\n(1 row)\n\nforumdb=> ROLLBACK;\nROLLBACK\n```\n\n在事务开始时，没有分配 xid，事实上，`txid_current_if_assigned()`\
  \ 返回 NULL。即使在数据读取（即 SELECT）之后，xid 也未被分配。然而，一旦事务执行某些写活动（例如 UPDATE），xid 就会被分配，并且 `txid_current_if_assigned()`\
  \ 和 `txid_current()` 的结果相同。\n\n## 多版本并发控制\n\n如果两个事务，无论是隐式还是显式，尝试对同一数据执行冲突的更改会发生什么？PostgreSQL\
  \ 必须确保数据始终一致，因此，它必须有一种锁定（即阻塞和保护）受冲突更改影响的数据的方法。锁是一种沉重的机制，会限制系统的并发性：锁越多，事务获取锁的等待时间就越长。为缓解此问题，PostgreSQL\
  \ 实现了 MVCC，这是一种在企业级数据库中广泛使用的技术。\n\nMVCC 规定，系统不得在数据库中修改现有元组，而必须复制元组，应用更改并使原始元组失效。你可以将此与\
  \ ZFS 等操作系统文件系统中使用的方法复制时写入进行比较。\n\n为了更好地理解这意味着什么，让我们假设 categories 表有三个元组，并且我们更新其中一个，以更改其描述。\n\
  \n发生的情况是，一个源自我们要应用 UPDATE 的元组的新元组被插入到表中，并且原始元组被使无效：\n\n![](img/bbe5644feba3d6a2ab994dc7e6cecbf1_406_0.png)\n\
  \n图 11.1：更新元组会创建新元组并使旧元组失效\n\n为什么 PostgreSQL 和 MVCC 要处理这项额外的工作，而不是对元组进行原地更新？原因在于，这样数据库可以处理同一元组的多个版本，并且每个版本在特定的时间窗口内有效。这意味着修改数据所需的锁更少，因为数据库能够同时处理同一数据的多个版本，并且不同的事务可能会看到不同的值。\n\
  \n为了使 MVCC 正常工作，PostgreSQL 必须处理快照的概念：快照表示某个事务被允许感知数据的时限。快照从根本上说是定义当前事务可用数据边界的事务\
  \ xid 范围：数据库中标记有该范围内 xid 的每一行都可被当前事务感知和使用。换句话说，每个事务都会看到数据库中所有可用数据的一个专用子集。MVCC 机制以及决定元组是否可见的测试比上述描述复杂得多，但其核心思想如上所述。\n\
  \n特殊的函数 `txid_current_snapshot()` 返回定义当前事务时间边界的最小和最大事务标识符。使用几个并行会话很容易演示该概念。\n\n\
  在第一个会话中，让我们运行一个显式事务，提取标识符和快照以供将来参考，并执行一个操作：\n\n```\n-- session 1\n```\n\n```\n```sql\n\
  forumdb=> BEGIN;\nBEGIN\n\nforumdb=> SELECT txid_current(), txid_current_snapshot();\n\
  \ txid_current | txid_current_snapshot\n--------------+-----------------------\n\
  \         4928 | 4928:4928:\n\n(1 row)\n\nforumdb=> UPDATE tags SET tag = lower(\
  \ tag );\nUPDATE 5\n```\n```\n\n正如前面的示例所示，事务编号为 4928，其快照仅限于自身，这意味着事务将看到数据库中已合并的所有内容。\n\
  \n现在，让我们暂停此会话片刻并打开另一个连接到同一数据库的会话 - 执行一个包装在隐式事务中的单个 INSERT 语句并获取其 xid 的信息：\n\n```\n\
  ```sql\nforumdb=> INSERT INTO tags( tag ) VALUES( 'KDE' ) RETURNING txid_current();\n\
  \ txid_current\n--------------\n         4929\n\n(1 row)\n```\n```\n\n单次事务已被分配 xid\
  \ 4929，这当然是前一个显式事务之后可用的下一个 xid（系统未运行其他并发事务以使编号更易于跟踪）。\n\n返回第一个会话，并再次检查事务快照的信息：\n\
  \n```\n```sql\n-- session 1\nforumdb=> SELECT txid_current(), txid_current_snapshot();\n\
  \ txid_current | txid_current_snapshot\n--------------+-----------------------\n\
  \         4928 | 4928:4930:\n\n(1 row)\n```\n```\n\n这次，事务将其快照从自身扩展到事务 4930，而事务 4930\
  \ 尚未开始（`txid_current_snapshot()` 将其上界报告为非包含）。换句话说，当前事务现在可以看到从在其之后开始的事务 4929 合并的数据。这如果事务查询表会更明确：\n\
  \n```\n-- session 1\nforumdb=> SELECT xmin, tag FROM tags;\n    xmin    |  tag\n\
  ------------+-------\n  4928 | linux\n  4928 | bsd\n  4928 | java\n  4928 | perl\n\
  \  4928 | raku\n  4929 | KDE\n(6 rows)\n```\n\n正如你所见，除了最后一个之外，所有元组都是由当前事务生成的，最后一个是由\
  \ xid 4929 生成的。但前一个事务只是故事的一部分；在第一个事务仍未完成时，让我们从另一个并行会话检查同一表：\n\n```\nforumdb=> SELECT\
  \ xmin, tag FROM tags;\n    xmin    |  tag\n------------+-------\n  4922 | linux\n\
  \  4923 | BSD\n  4924 | Java\n  4925 | Perl\n  4926 | Raku\n  4929 | KDE\n(6 rows)\n\
  ```\n\n除了最后一个元组之外，所有元组都有不同的描述，最值得注意的是 xmin 的值与事务 4928 看到的不同。这意味着什么？这意味着虽然表经历了几乎所有元组的完全重写（除了最后一个元组之外的所有元组的\
  \ UPDATE），但其他并发事务仍然可以访问表中的数据，而不会被锁阻塞。这就是 MVCC 的本质：每个事务都会感知存储的不同视图，并且视图的有效性取决于与事务关联的时间窗口（快照）。\n\
  \n迟早，存储上的数据必须被合并，因此，当事务 4928 完成其工作的 COMMIT 时，表中的数据将成为从那时起每个事务都会感知的事实：\n\n```\n--\
  \ session 1\nforumdb=> COMMIT;\nCOMMIT\n\n-- out from the transaction now\n-- we\
  \ all see consolidated data\nforumdb=> SELECT xmin, tag FROM tags;\n xmin | tag\n\
  -------+------\n4928 | linux\n4928 | bsd\n4928 | java\n4928 | perl\n4928 | raku\n\
  4929 | KDE\n(6 rows)\n```\n\nMVCC 并不能总是防止使用锁：如果两个或多个并发事务开始操作同一组数据，系统必须应用有序的更改，因此必须强制对每个并发事务进行锁定，以便只有一个可以继续。使用与前面类似的两个并行会话很容易证明这一点：\n\
  \n```\n-- session 1\nforumdb=> BEGIN;\nBEGIN\nforumdb=> SELECT txid_current(), txid_current_snapshot();\n\
  \ txid_current | txid_current_snapshot\n---------------+------------------------\n\
  \ 4930 | 4930:4930:\n(1 row)\n\nforumdb=> UPDATE tags SET tag = upper( tag );\n\
  UPDATE 6\n```\n\n\n\n同时，在另一个会话中，执行以下语句：\n\n```\n-- session 2\nforumdb=> BEGIN;\n\
  BEGIN\nforumdb=> SELECT txid_current(), txid_current_snapshot();\ntxid_current |\
  \ txid_current_snapshot\n---------------+------------------------\n  4931 | 4930:4930:\n\
  (1 row)\nforumdb=> UPDATE tags SET tag = lower( tag );\n-- LOCKED!!!\n```\n\n事务\
  \ 4931 被锁定，因为 PostgreSQL 无法决定应用哪种数据操作。一方面，事务 4930 将所有标签应用大写，同时，事务 4931 将完全相同的数据应用小写。\n\
  \n由于这两种更改冲突，并且最终结果（即将在数据库中合并的结果）取决于更改应用的确切顺序（特别是最后一次应用的更改），PostgreSQL 不能允许两个事务同时进行。因此，由于\
  \ 4930 在 4931 之前应用了更改，后者被挂起，等待事务 4930 以成功或失败完成。一旦你结束第一个事务，第二个事务将被解除阻塞（显示 UPDATE\
  \ 语句的状态消息）：\n\n```\n-- session 1\nforumdb=> COMMIT;\nCOMMIT\n\n-- session 2\nUPDATE\
  \ 6\n-- unblocked, can proceed further ...\nforumdb=>\n```\n\n因此，MVCC 并不是防止锁使用的灵丹妙药，但允许数据库整体使用中获得更好的并发性。\n\
  \nMVCC 也有代价：由于系统必须根据活动事务及其快照维护不同的元组版本，存储空间将 literally 随着合并数据的有效大小而增长。\n\n为防止此问题，一个名为\
  \ VACUUM 的特定工具，以及与其一起在后台运行的兄弟进程 autovacuum，负责扫描表（和索引）以查找可以丢弃的元组版本，从而收回存储空间。但何时一个元组版本有资格被\
  \ VACUUM 销毁呢？当没有更多事务引用该元组 xid（即 xmin）时，即当该元组不再被合并时。\n\n## 事务隔离级别\n\n在并发数据库系统中，你可能会遇到三种不同的问题：\n\
  \n- **脏读：** 脏读发生在数据库允许一个事务看到来自其他尚未完成的事务的工作进度数据时。换句话说，未合并的数据对其他事务可见。没有生产就绪的数据库允许这种情况，PostgreSQL\
  \ 也不例外：你保证你的事务只会感知已合并的数据，而要被合并，创建此类数据的事务必须已完成。\n- **不可重复读：** 不可重复读发生在同一个事务中同一查询被多次执行时，感知到不同的数据集。这本质上意味着数据在同一事务中两次顺序执行同一查询之间发生了变化。PostgreSQL\
  \ 通过快照不允许这种问题：每个事务都可以感知到根据特定事务边界可用的数据的快照。\n- **幻读：** 幻读与不可重复读 somewhat 相似，但不同的是在同一查询的顺序执行之间发生变化的是结果集的大小。这意味着数据没有改变，但新的数据已被“追加”到上一次执行的结果集中。\n\
  \nSQL 标准提供了事务可以采用的四个隔离级别，以防止上述任何问题：\n\n- **读未提交：** 可能的最低级别。\n- **读已提交：** PostgreSQL\
  \ 中的默认隔离级别。\n- **可重复读：** 对于长时间运行的作业很有用，因为系统看不到并发事务的影响；这使我们能够在整个事务执行期间在一致的快照上工作。\n\
  - **可串行化：** 可用的最强隔离级别。\n\n每个级别在前一个级别之上提供递增的隔离；因此，例如，READ COMMITTED 包装了 READ UNCOMMITTED\
  \ 的行为，REPEATABLE READ 包装了 READ COMMITTED（和 READ UNCOMMITTED），而 SERIALIZABLE 包装了所有前面的级别。\n\
  \nPostgreSQL 不支持所有前述级别，正如你将在以下小节中详细看到的那样。你始终可以在事务开始时为显式事务指定所需的隔离级别；每个隔离级别都有完全相同的名称，如前列表所示。因此，例如，以下以\
  \ READ committed 模式开始一个事务：\n\n```\nforumdb=> BEGIN TRANSACTION ISOLATION LEVEL READ\
  \ COMMITTED;\nBEGIN\n```\n\n你可以省略可选关键字 TRANSACTION，即使我们认为这会提高可读性。也可以通过 SET TRANSACTION\
  \ 语句显式设置事务隔离级别。作为示例，以下片段产生与前一个相同的效果：\n\n```\nforumdb=> BEGIN;\nBEGIN\nforumdb=>\
  \ SET TRANSACTION ISOLATION LEVEL READ COMMITTED;\nSET\n```\n\n需要注意的是，一旦事务开始，事务隔离级别就不能更改。为了生效，SET\
  \ TRANSACTION 语句必须是事务块中执行的第一个语句。任何后续更改已设置隔离级别的 SET TRANSACTION 语句都会导致失败并使事务进入中止状态；如果后续\
  \ SET TRANSACTION 未更改隔离级别，它将没有效果且不会产生错误。\n\n为了更好地理解这种情况，以下是一个错误的 workflow 示例，其中在事务已经执行语句后更改了隔离级别，即使它没有更改任何数据：\n\
  \n```\nforumdb=> BEGIN;\nBEGIN\nforumdb=> SELECT count(*) FROM tags;\ncount\n-------\n\
  \    7\n(1 row)\n-- a query has been executed, the SET TRANSACTION\n-- is not anymore\
  \ the very first command\nforumdb=> SET TRANSACTION ISOLATION LEVEL SERIALIZABLE;\n\
  ERROR:  SET TRANSACTION ISOLATION LEVEL must be called before any query\n```\n\n\
  在以下各节中，我们将详细讨论每个隔离级别。\n\n### READ UNCOMMITTED\n\nREAD UNCOMMITTED 隔离级别允许事务受到脏读问题的影响，这意味着它可以感知来自其他未完成事务的未合并数据。\n\
  \nPostgreSQL 不支持此隔离级别，因为毕竟它不是真正的隔离级别。事实上，READ UNCOMMITTED 意味着事务之间根本没有隔离，这当然是数据损坏交错发生的情况。\n\
  \n你可以显式设置隔离级别，但 PostgreSQL 将忽略你的请求并静默将其设置为最稳健的 READ COMMITTED。\n\n### READ COMMITTED\n\
  \n隔离级别 READ COMMITTED 是 PostgreSQL 使用的默认值；如果你不设置级别，每个事务（隐式或显式）都将具有此隔离级别。\n\n此级别防止脏读，并允许当前事务在事务中的每个语句执行时看到所有已合并的数据。我们已经在并发会话示例中实践看到了这种行为。\n\
  \n### REPEATABLE READ\n\nREPEATABLE READ 隔离级别规定事务中的每个语句只会感知在事务开始时或更理想地在事务的第一个语句开始时已合并的数据。\n\
  \n### SERIALIZABLE\n\nSERIALIZABLE 隔离级别施加 REPEATABLE READ 级别并确保两个并发事务能够成功完成，但前提是最终结果与两个事务按顺序运行的结果相同。\n\
  \n换句话说，如果两个（或更多）事务具有 SERIALIZABLE 隔离级别并以冲突的方式修改相同的数据子集，PostgreSQL 将确保只有一个事务可以完成，而另一个事务失败。\n\
  \n让我们通过创建一个初始事务并修改一个数据子集来实际操作：\n\n```\n-- session 1\nforumdb=> BEGIN TRANSACTION\
  \ ISOLATION LEVEL SERIALIZABLE;\nBEGIN\nforumdb=> UPDATE tags SET tag = lower( tag\
  \ );\nUPDATE 7\n```\n\n为了模拟并发，让我们暂停此事务并在另一个会话中打开一个新的事务，对同一数据集应用其他更改：\n\n```\n--\
  \ session 2\nforumdb=> BEGIN TRANSACTION ISOLATION LEVEL SERIALIZABLE;\nBEGIN\n\
  forumdb=> UPDATE tags SET tag = '[' || tag || ']';\n-- blocked\n```\n\n由于操作的数据集相同，第二个事务被锁定，正如我们在之前的另一个示例中看到的那样。现在，假设第一个事务成功完成：\n\
  \n```\n-- session 1\nforumdb=> COMMIT;\nCOMMIT\n```\n\nPostgreSQL 意识到如果让另一个事务也能继续进行，将会破坏\
  \ SERIALIZABLE 承诺，因为按顺序应用事务会产生不同的结果，具体取决于它们的顺序。\n\n\n\n\n\n因此，一旦第一个事务提交，第二个事务就会自动以可序列化错误中止：\n\
  \n```\n-- session 2\nforumdb=> UPDATE tags SET tag = '[' || tag || ']';\nERROR:\
  \  could not serialize access due to concurrent update\n```\n\n如果事务操作的数据看起来似乎不相关会怎样？一个事务可能再次失败；事实上，让我们只修改来自一个事务的一个元组：\n\
  \n```\n-- session 1\nforumdb=> BEGIN TRANSACTION ISOLATION LEVEL SERIALIZABLE;\n\
  BEGIN\nforumdb=> UPDATE tags SET tag = '{' || tag || '}' WHERE tag = 'java';\nUPDATE\
  \ 1\n```\n\n与此同时，从另一个会话修改完全不同的一个事务：\n\n```\n-- session 2\nforumdb=> BEGIN TRANSACTION\
  \ ISOLATION LEVEL SERIALIZABLE;\nBEGIN\nforumdb=> UPDATE tags SET tag = '[' || tag\
  \ || ']' WHERE tag = 'perl';\nUPDATE 1\n```\n\n这次，由于触及的元组完全不同，第二个事务不会被锁定。然而，一旦第一个事务执行\
  \ COMMIT，第二个事务就无法自行 COMMIT 了：\n\n```\n-- session 2 (assume session 1 has issued\
  \ COMMIT)\nforumdb=> COMMIT;\nERROR:  could not serialize access due to read/write\
  \ dependencies among transactions\nDETAIL:  Reason code: Canceled on identification\
  \ as a pivot, during commit attempt.\nHINT:  The transaction might succeed if retried.\n\
  ```\n\n这在使用可序列化事务时相当常见的一个场景：应用程序或用户必须准备好一遍又一遍地执行其事务，因为 PostgreSQL 可能由于工作流的可序列化性而使其失败。\n\
  \n## 解释 MVCC\n\nxmin 只是管理 MVCC 故事的一部分。PostgreSQL 为数据库中的每个元组标记四个不同的字段，名为 xmin（已描述）、xmax、cmin\
  \ 和 cmax。类似于你关于 xmin 学到的内容，为了使这些字段出现在查询结果中，你需要显式引用它们——例如：\n\n```\nforumdb=> SELECT\
  \ xmin, xmax, cmin, cmax, * FROM tags ORDER BY tag;\n xmin | xmax | cmin | cmax\
  \ | pk | tag | parent\n-------+------+------+------+------+------+--------\n 4854\
  \ | 0 | 0 | 0 | 24 | c++ |\n 4853 | 0 | 0 | 0 | 23 | java |\n 4852 | 0 | 0 | 0 |\
  \ 22 | perl |\n 4855 | 0 | 0 | 0 | 25 | unix |\n(4 rows)\n```\n\nxmin 的含义已在前一节中描述过：它表示创建该元组的事务标识符。xmax\
  \ 字段则表示使该元组失效的事务的 xid，例如因为它已删除数据。cmin 和 cmax 字段分别表示在同一事务内创建和使该元组失效的命令标识符（PostgreSQL\
  \ 从 0 开始为事务中的每个语句编号）。\n\n跟踪语句标识符（cmin、cmax）为什么重要？由于 PostgreSQL 应用的最低隔离级别是 READ COMMITTED，事务中的每个单独语句（即命令）都必须看到在命令开始时整合的数据快照。\n\
  \n你可以在以下示例中看到同一事务内 cmin 和 cmax 的使用。首先，我们开始一个显式事务，然后使用两个不同的 INSERT 语句插入几行元组；这意味着创建的元组将具有不同的\
  \ cmin：\n\n```\nforumdb=> BEGIN;\nBEGIN\n\nforumdb=> SELECT xmin, xmax, cmin, cmax,\
  \ tag, txid_current()\n    FROM tags ORDER BY tag;\n xmin | xmax | cmin | cmax |\
  \ tag | txid_current\n```\n\n```\n------+----------------+--------+--------+--------+------------\n\
  4854 |      0 |      0 |      0 | c++    |       4856\n4853 |      0 |      0 |\
  \      0 | java   |       4856\n4852 |      0 |      0 |      0 | perl   |     \
  \  4856\n4855 |      0 |      0 |      0 | unix   |       4856\n(4 rows)\n\n-- first\
  \ writing command (number 0)\nforumdb=> INSERT INTO tags( tag ) values( 'raku' );\n\
  INSERT 0 1\n\n-- second writing command (number 1)\nforumdb=> INSERT INTO tags(\
  \ tag ) values( 'lua' );\nINSERT 0 1\n\n-- fourth command within transaction (number\
  \ 3)\nforumdb=> SELECT xmin, xmax, cmin, cmax, tag, txid_current()\n    FROM tags\
  \ ORDER BY tag;\n\n xmin | xmax | cmin | cmax | tag  | txid_current\n------+-------+-------+-------+-------+-------------\n\
  \ 4854 |   0 |   0 |   0 | c++  |       4856\n 4853 |   0 |   0 |   0 | java | \
  \      4856\n 4856 |   0 |   1 |   1 | lua  |       4856\n 4852 |   0 |   0 |  \
  \ 0 | perl |       4856\n 4856 |   0 |   0 |   0 | raku |       4856\n 4855 |  \
  \ 0 |   0 |   0 | unix |       4856\n(6 rows)\n```\n\n到目前为止，在同一事务内，两个新插入的元组具有与 txid_current()\
  \ 相同的 xmin；显然，这些元组是由同一事务创建的。然而，请注意第二个元组由于在第二个写命令中，其 cmin 持有 1（命令计数从 0 开始）。\n\n因此，PostgreSQL\
  \ 可以通过事务和该事务内的命令来知道每个元组何时被创建。\n\n让我们继续我们的事务：声明一个对 tags 表进行查询的光标，并删除除两个之外的所有元组。事务会话继续如下：\n\
  \n```\nforumdb=> DECLARE tag_cursor CURSOR FOR SELECT xmin, xmax, cmin, cmax, tag,\
  \ txid_current() FROM tags ORDER BY tag;\nDECLARE CURSOR\n\nforumdb=> DELETE FROM\
  \ tags WHERE tag NOT IN ( 'perl', 'raku' );\nDELETE 4\n\nforumdb=> SELECT xmin,\
  \ xmax, cmin, cmax, tag, txid_current()\n       FROM tags ORDER BY tag;\nxmin |\
  \ xmax | cmin | cmax | tag  | txid_current\n-------+------+-------+-------+-------+-------------\n\
  \ 4852 |   0 |   0 |   0 | perl |        4856\n 4856 |   0 |   0 |   0 | raku |\
  \        4856\n(2 rows)\n```\n\n正如你所见，表现在只持有两个元组——这是删除后预期的行为。\n\n然而，光标是在 DELETE\
  \ 语句之前开始的，因此它必须将数据视为 DELETE 语句之前的状态。事实上，如果我们询问光标它能获得什么数据，我们会看到它返回了 DELETE 语句之前的所有元组：\n\
  \n```\nforumdb=> FETCH ALL FROM tag_cursor;\nxmin | xmax | cmin | cmax | tag  |\
  \ txid_current\n-------+------+-------+-------+-------+-------------\n 4854 | 4856\
  \ |   2 |   2 | c++  |        4856\n 4853 | 4856 |   2 |   2 | java |        4856\n\
  \ 4856 | 4856 |   0 |   0 | lua  |        4856\n 4852 |   0 |   0 |   0 | perl |\
  \        4856\n 4856 |   0 |   0 |   0 | raku |        4856\n 4855 | 4856 |   2\
  \ |   2 | unix |        4856\n(6 rows)\n```\n\n有一点很重要需要注意：每个被删除的元组在 xmax 中都有一个值，该值持有当前事务标识符（4856），意味着正是这个事务删除了这些元组。然而，事务尚未提交；因此，元组仍然存在，但被标记为与以\
  \ 4856 结束的快照绑定。\n\n此外，被删除的元组具有值为 2 的 c max，这意味着这些元组是在事务中的第三个写命令中被删除的。\n\n由于光标是在语句之前定义的，它能够“看到”元组在当时是什么样子，即使\
  \ PostgreSQL 精确地知道它们从何时开始消失。\n\n> 读者可能已经注意到 c min 和 c max 持有相同的值，这是由于这些字段重叠了相同的存储。\n\
  \n在下一节中，你将看到如何通过保存点将事务拆分为更小的部分。\n\n## 保存点\n\n事务是一块必须整体成功或失败的工作。保存点是一种将事务拆分为可以独立回滚的更小块的方法。借助保存点，你可以将一个大事务（一个包含多个语句的事务）分成更小的块，允许较大事务的子集失败而不会使整个事务失败。PostgreSQL\
  \ 不处理事务嵌套，因此你不能发出嵌套的 BEGIN 或 COMMIT/ROLLBACK 语句。然而，保存点允许 PostgreSQL 模拟事务块的嵌套。\n\n\
  保存点用助记符名称标记，你可以使用它来提交或回滚。名称必须在事务内唯一，如果你一遍又一遍地重用相同的名称，先前的具有相同名称的保存点将被丢弃。让我们看一个例子：\n\
  \n```\nforumdb=> BEGIN;\nBEGIN\nforumdb=> INSERT INTO tags( tag ) VALUES ( 'Eclipse\
  \ IDE' );\nINSERT 0 1\nforumdb=> SAVEPOINT other_tags;\nSAVEPOINT\nforumdb=> INSERT\
  \ INTO tags( tag ) VALUES ( 'Netbeans IDE' );\nINSERT 0 1\nforumdb=> INSERT INTO\
  \ tags( tag ) VALUES ( 'Comma IDE' );\nINSERT 0 1\nforumdb=> ROLLBACK TO SAVEPOINT\
  \ other_tags;\n```\n\n\n\nROLLBACK\nforumdb=> INSERT INTO tags( tag ) VALUES ( 'IntelliJIdea\
  \ IDE' );\nINSERT 0 1\nforumdb=> COMMIT;\nCOMMIT\n\nforumdb=> SELECT tag FROM tags\
  \ WHERE tag like '%IDE';\n    tag\n-----------------\n Eclipse IDE\n IntelliJIdea\
  \ IDE\n(2 rows)\n\n在前面的事务中，第一条语句不属于任何保存点，因此遵循显式事务本身的生命周期。在创建 other_tags 保存点之后，其后的所有语句都遵循保存点本身的生命周期；因此，一旦发出\
  \ ROLLBACK TO SAVEPOINT，保存点内的语句将被丢弃。之后，其他语句属于显式事务，因此遵循事务本身的生命周期。最终结果是，所有在保存点之外执行的内容都存储在表中。\n\
  \n一旦你定义了保存点，你也可以改变主意并释放它，使得保存点内的语句遵循主事务相同的生命周期。以下是一个示例：\n\n```\nforumdb=> BEGIN;\n\
  BEGIN\nforumdb=> SAVEPOINT editors;\nSAVEPOINT\nforumdb=> INSERT INTO tags( tag\
  \ ) VALUES ( 'Emacs Editor' );\nINSERT 0 1\nforumdb=> INSERT INTO tags( tag ) VALUES\
  \ ( 'Vi Editor' );\nINSERT 0 1\nforumdb=> RELEASE SAVEPOINT editors;\nRELEASE\n\
  forumdb=> INSERT INTO tags( tag ) VALUES ( 'Atom Editor' );\nINSERT 0 1\nforumdb=>\
  \ COMMIT;\n```\n\n```\nCOMMIT\n\nforumdb=> SELECT tag FROM tags WHERE tag LIKE '%Editor';\n\
  \    tag\n-------------\n Emacs Editor\n Vi Editor\n Atom Editor\n(3 rows)\n```\n\
  \n当发出 RELEASE SAVEPOINT 时，就像保存点消失了，因此，这两个 INSERT 语句遵循主事务生命周期。换句话说，就像保存点从未被定义过一样。\n\
  \n在一个事务中，你可以有多个保存点，但一旦回滚其中一个，你就会回滚其后声明的所有保存点：\n\n```\nforumdb=> BEGIN;\nBEGIN\n\
  forumdb=> SAVEPOINT perl;\nSAVEPOINT\nforumdb=> INSERT INTO tags( tag ) VALUES (\
  \ 'Rakudo Compiler' );\nINSERT 0 1\nforumdb=> SAVEPOINT gcc;\nSAVEPOINT\nforumdb=>\
  \ INSERT INTO tags( tag ) VALUES ( 'Gnu C Compiler' );\nINSERT 0 1\nforumdb=> ROLLBACK\
  \ TO SAVEPOINT perl;\nROLLBACK\nforumdb=> COMMIT;\nCOMMIT\n\nforumdb=> SELECT tag\
  \ FROM tags WHERE tag LIKE '%Compiler';\n    tag\n-----\n(0 rows)\n```\n\n正如你所见，即使事务已发出\
  \ COMMIT，事务回滚到 perl 保存点之后所做的一切也被回滚了。\n\n换句话说，回滚到保存点意味着你回滚保存点声明之后所做的一切。\n\n事务可能导致集群无法继续的情况。这些情况被称为\
  \ *死锁*，将在下一节中描述。\n\n## 死锁\n\n死锁是当不同事务以循环方式相互依赖时发生的事件。死锁在一定程度上是并发数据库环境中的正常事件，除非它们变得极其频繁，意味着应用程序和事务中存在某种依赖错误，否则管理员不必担心。\n\
  \n当死锁发生时，别无选择，只能终止被锁定的事务。PostgreSQL 拥有非常强大的死锁检测引擎，它执行正是这项工作：它查找停滞的事务，并在死锁情况下终止它们（产生\
  \ ROLLBACK）。\n\n为了产生死锁，想象两个并发事务以冲突的方式对完全相同的元组应用更改。例如，第一个事务可以执行以下操作：\n\n```\n-- session\
  \ 1\nforumdb=> BEGIN;\nBEGIN\nforumdb=> SELECT txid_current();\ntxid_current\n-------------\n\
  \       4875\n(1 row)\nforumdb=> UPDATE tags SET tag = 'Perl 5'\n    WHERE tag =\
  \ 'perl';\nUPDATE 1\n```\n\n与此同时，另一个事务执行以下操作：\n\n```\n-- session 2\nforumdb=> BEGIN;\n\
  BEGIN\nforumdb=> SELECT txid_current();\n```\n```\ntxid_current\n-------------\n\
  \       4876\n\n(1 row)\n\nforumdb=> UPDATE tags SET tag = 'Java and Groovy'\n \
  \              WHERE tag = 'java';\n\nUPDATE 1\n```\n\n到目前为止，两个事务都更新了单个元组而没有相互冲突。现在，想象第一个事务尝试修改另一个事务已经更改的元组；正如我们在之前的示例中看到的，事务将保持锁定，等待获取元组上的锁：\n\
  \n```\n-- session 1\nforumdb=> UPDATE tags SET tag = 'The Java Language'\n     \
  \          WHERE tag = 'java';\n-- locked\n```\n\n如果第二个事务另一方面尝试修改已被第一个事务触及的元组，它将被锁定，等待锁获取：\n\
  \n```\n-- session 2\nforumdb=> UPDATE tags SET tag = 'Perl and Raku'\n         \
  \      WHERE tag = 'perl';\nERROR:  deadlock detected\nDETAIL:  Process 78918 waits\
  \ for ShareLock on transaction 4875; blocked by process 80105.\nProcess 80105 waits\
  \ for ShareLock on transaction 4876; blocked by process 78918.\nHINT:  See server\
  \ log for query details.\nCONTEXT:  while updating tuple (0,1) in relation \"tags\"\
  \n```\n\n这次，PostgreSQL意识到这两个事务无法解决问题，因为它们在循环依赖上等待，因此，它决定杀死第二个事务以给第一个事务完成的机会。正如错误消息所示，PostgreSQL\
  \ 知道事务 4875 在等待事务 4876 持有的锁，反之亦然，因此要继续进行，别无选择，只能杀死其中一个。\n\n作为并发事务系统中的自然事件，死锁是你必须处理的事情，你的应用程序必须准备好在被死锁检测强制回滚时重放事务。\n\
  \n死锁检测是一个复杂且资源消耗大的过程；因此，PostgreSQL 按计划进行。特别是，deadlock_timeout 配置参数表示 PostgreSQL\
  \ 应多久搜索一次停滞事务之间的依赖关系。默认情况下，此值设置为 1 秒，并以毫秒为单位表示：\n\n```\nforumdb=> SELECT name, setting,\
  \ unit\n    FROM pg_settings\n    WHERE name like '%deadlock%';\n    name      \
  \     | setting | unit\n------------------+---------+------\ndeadlock_timeout  |\
  \ 1000    | ms\n(1 row)\n\nforumdb=> SHOW deadlock_timeout;\ndeadlock_timeout\n\
  -----------------\n1s\n(1 row)\n```\n\n降低此值通常是个坏主意；你的应用程序和事务将在死锁条件下更早失败，但你的集群将被迫在依赖分析中消耗额外的资源。\n\
  \n在下一节中，你将了解 PostgreSQL 如何确保数据在存储上保持持久，即使集群崩溃也是如此。\n\n## PostgreSQL 如何处理持久性和一致性：WALs\n\
  \n在前面的章节中，你已经了解了如何与事务交互，以及最重要的是，PostgreSQL 如何在显式或隐式事务内执行每条语句。\n\nPostgreSQL 在内部执行非常复杂的工作，以确保存储中的合并数据反映已提交事务的状态。换句话说，只有当产生（或修改）它的事务已成功提交时，数据才可被视为已合并。但这也意味着，一旦事务成功提交，其数据在存储上是“安全”的，无论未来发生什么：如果事务被报告为成功，其数据必须保持持久，即使数据库或整个系统崩溃。\n\
  \nPostgreSQL 通过 WAL 管理事务和数据合并。本节向你介绍 WAL 的概念及其在 PostgreSQL 中的使用。\n\n## WALs\n\n\
  在深入细节之前，需要简要解释 PostgreSQL 在内部如何处理数据。元组存储在 $PGDATA/base 目录下的大容量存储——通常是磁盘——中，文件仅以数字命名。当事务请求访问特定的一组元组时，PostgreSQL\
  \ 从 $PGDATA/base 目录加载请求的数据并将其放置在一个或多个共享缓冲区中。共享缓冲区是磁盘上数据的内存副本，所有事务都访问共享数据，因为它们提供更高的性能，并且不需要每个事务都从存储中查找数据。\n\
  \n\n\n\n\nThe next figure shows a few data pages loading into the shared buffers’\
  \ memory location:\n\n![](img/bbe5644feba3d6a2ab994dc7e6cecbf1_426_0.png)\n\nWhen\
  \ a transaction modifies some data, it does so by modifying the in-copy memory,\
  \ which means it modifies the “shared buffers” area.\n\nAt this point, the in-memory\
  \ copy of the data does not correspond to the stored version, and it is here that\
  \ PostgreSQL has to guarantee consistency and persistency without losing performance.\n\
  \nWhat happens is that the data is kept in memory but is marked as dirty, meaning\
  \ that it is a copy not yet synchronized with the on-disk original source. Once\
  \ the changes to a dirty buffer have been committed, PostgreSQL consolidates the\
  \ changes in the WALs and keeps the dirty buffer in memory, to be served as the\
  \ most recent available copy for other transactions and connections.\n\nWhy is the\
  \ WAL space considered to be more efficient than overwriting the original data block\
  \ in the $PGDATA/base directory? The trick is that in order to find the exact position\
  \ on the disk storage where the block has to be overwritten, PostgreSQL should have\
  \ to perform what is called a random-seek, which is a costly I/O operation. On the\
  \ other hand, WALs are sequentially written as a journal, and therefore, there is\
  \ no need to perform a random-seek. Writing the WALs prevents the I/O performance\
  \ degradation and allows PostgreSQL to overwrite the data block in the future, when,\
  \ for instance, the cluster is not overloaded and has I/O bandwidth available.\n\
  \nEvery time a transaction performs a COMMIT, its actions and modified data are\
  \ permanently stored in a piece of the WAL, in particular a specific part of the\
  \ current WAL segment (more on this later). Therefore, PostgreSQL can reproduce\
  \ the transaction and its effects in order to perform the very same data changes.\n\
  \nThis, however, does not suffice in making PostgreSQL reliable: PostgreSQL makes\
  \ a big effort to ensure data actually hits the disk storage. In particular, during\
  \ the writing of the WALs, PostgreSQL isolates itself from the outside world, disabling\
  \ operating system signals, so that it cannot be interrupted. Moreover, PostgreSQL\
  \ issues fsync(2), a particular operating system call that forces the filesystem\
  \ cache to flush data on disk.\n\nPostgreSQL does all of this in order to ensure\
  \ that the data physically hits the disk layer, but it must be clear that if the\
  \ filesystem, or the disk controller (that is, the hardware), lies, the data could\
  \ not be physically on the disk. This is important, but PostgreSQL cannot do anything\
  \ about that and has to trust what the operating system (and, thus, the hardware)\
  \ reports back as feedback.\n\nIn any case, COMMIT will return success to the invoking\
  \ transaction if, and only if, PostgreSQL has been able to write the changes on\
  \ the disk. Therefore, at the transaction level, if a COMMIT succeeds (that is,\
  \ there is no error), the data has been written in the WALs and, therefore, can\
  \ be assumed to be safe on the storage layer.\n\nWALs are split into chunks called\
  \ segments. A segment is a file made of exactly 16 MB of changes in data. While\
  \ it is possible to modify the size of segments during initdb, we strongly discourage\
  \ this and will assume every segment is 16 MB in size.\n\nThis means that PostgreSQL\
  \ writes, sequentially, a single file at a time (that is, a WAL segment), and when\
  \ this has reached the size of 16 MB, it is closed and a new 16 MB file is created.\
  \ The WAL segments are stored in the pg_wal directory under $PGDATA. Every segment\
  \ has a name made up of hexadecimal digits, 24 characters long.\n\nThe first eight\
  \ characters indicate the so-called *timeline* of the cluster (something related\
  \ to physical backups and replication), the next eight digits indicate an increasing\
  \ sequence number named the **Log Sequence Number (LSN)**, and the last eight digits\
  \ provide the offset within the LSN. Here’s an example:\n\n```\n$ ls -l $PGDATA/pg_wal\n\
  0000000700000247000000A8\n0000000700000247000000A9\n0000000700000247000000AA\n0000000700000247000000AB\n\
  0000000700000247000000AC\n0000000700000247000000AD\n...\n```\n\nIn the previous\
  \ content of the pg_wal, you can see that every WAL segment has the same timeline,\
  \ number 7, and the LSN is 247. Every file, then, has a different offset, with the\
  \ first one being A8, the second A9, and so on. As you can imagine, WAL segment\
  \ names are not made for humans, but PostgreSQL knows exactly how and in which file\
  \ it has to search for information.\n\nSooner or later, depending on the memory\
  \ resources and usage of the cluster, the data in memory will be written back to\
  \ its original disk positions, meaning that the WALs serve only as temporary safe\
  \ storage on disk. The reason for that is not only tied to a performance boost,\
  \ as already explained, but also to allow data restoration in the event of a crash.\n\
  \n# WALs as a rescue method in the event of a crash\n\nWhen you cleanly stop a running\
  \ cluster, for example, by means of pg_ctl, PostgreSQL ensures that all dirty data\
  \ in memory is flushed to the storage in the correct order, and then halts itself.\n\
  \nBut what happens if the cluster is uncleanly stopped, for example, by means of\
  \ a power failure?\n\nThis event is named a **crash**, and once PostgreSQL starts\
  \ over, it performs a so-called **crash recovery**. In particular, PostgreSQL understands\
  \ it has stopped in an unclean way, and therefore, the data on the storage might\
  \ not be the last version that existed in memory when the cluster terminated its\
  \ activity. But PostgreSQL knows that all committed data is at least present in\
  \ the WALs and, therefore, starts reading the WALs in what is called **WAL replay**,\
  \ adjusting the data in the storage according to what is in the WALs. Until the\
  \ crash recovery has completed, the cluster is not usable and does not accept connections;\
  \ once the crash recovery has finished, the cluster knows that the data on the storage\
  \ has been made coherent, and therefore, normal operativity can start again.\n\n\
  This process allows the cluster to somehow self-heal after an external event that\
  \ caused its normal life cycle to abort. This makes it clear that the main aim of\
  \ the WALs is not to avoid performance degradations but, rather, to ensure the cluster\
  \ is able to recover after a crash. And in order to be able to do that, it must\
  \ have data written permanently to the storage, but thanks to the sequential way\
  \ in which WALs are written, data is made persistent with less I/O penalties.\n\n\
  # Checkpoints\n\nSooner or later, the cluster must make every change that has already\
  \ been written in WALs also available in the data files; that is, it has to write\
  \ tuples in an I/O-scattered way. These writes happen at very specific times, named\
  \ **checkpoints**. A checkpoint is a point in time at which a database makes an\
  \ extra effort to ensure that everything already present in the WALs is also written\
  \ in the correct position in the data storage.\n\nThe following diagram helps to\
  \ understand what happens during a CHECKPOINT:\n\n![](img/bbe5644feba3d6a2ab994dc7e6cecbf1_430_0.png)\n\
  \n*Figure 11.4: An example of a CHECKPOINT*\n\nIn fact, when a checkpoint is reached,\
  \ the database must force every dirty buffer from memory to disk, and this usually\
  \ means that an I/O spike is introduced; during such a spike, other concurrent database\
  \ activities, such as getting new data from the storage, will be penalized because\
  \ the I/O bandwidth is temporarily exhausted from the checkpoint activity.\n\nFor\
  \ the preceding reasons, it is very important to carefully tune checkpoints, and\
  \ in particular, their tuning must reflect the cluster workload.\n\nCheckpoints\
  \ can be tuned by means of three main configuration parameters that interact with\
  \ each other, which are explained in the following subsections.\n\n# checkpoint_timeout\
  \ and max_wal_size\n\nCheckpoint frequency can be tuned by two orthogonal parameters:\
  \ `max_wal_size` and `checkpoint_timeout`.\n\nThe `max_wal_size` parameter dictates\
  \ how much space the pg_wal directory can occupy. Since at every checkpoint WAL\
  \ segments are recycled, the pg_wal directory tends to occupy the very same size\
  \ eventually. Tuning the `max_wal_size` parameter specifies after how many data\
  \ changes the checkpoint must be completed, and therefore, this parameter is a *quantity*\
  \ specification.\n\n`checkpoint_timeout` expresses after how much time the checkpoint\
  \ must be forced.\n\nThe two parameters are orthogonal, meaning that the first that\
  \ happens triggers the checkpoint execution; your database produces data changes\
  \ over the `max_wal_size` parameter or when the `checkpoint_timeout` time has elapsed.\n\
  \nAs an example, let’s take a system with the default settings:\n\n```\n```text\n\
  forumdb=> SHOW checkpoint_timeout;\ncheckpoint_timeout\n------------------\n5min\n\
  (1 row)\n\nforumdb=> SHOW max_wal_size ;\nmax_wal_size\n------------\n1GB\n(1 row)\n\
  ```\n```\n\n\n\n\n```\n-- or you can query the pg_settings\nforumdb=> SELECT name,\
  \ setting, unit\n    FROM pg_settings\n    WHERE name IN ( 'checkpoint_timeout',\
  \ 'max_wal_size' );\n    name              | setting | unit\n----------------------+---------+------\n\
  \ checkpoint_timeout | 300     | s\n max_wal_size       | 1024    | MB\n(2 rows)\n\
  ```\n\n在300秒（5分钟）之后会触发检查点，除非在此期间已经产生了1,024 MB的WAL数据。这两个参数的目标是保证连续两次检查点之间既不会间隔太长时间，也不会有太多已变更的数据，从而缩小内存中数据状态与磁盘上安全存储状态之间的差异。\n\
  \n由于WAL段由写入事务填充，设置`max_wal_size`与数据库中被更改的用户数据量成正比。写入WAL的数据量并不完全等于用户数据产生量，因为WAL段还存储校验和，以及在恢复或副本情况下对数据库有用的其他信息，但你可以近似认为产生的WAL量反映了数据库中已变更的数据量。\n\
  \n因此，`max_wal_size`的含义是：一旦数据库产生了如此多的数据更改，就会触发检查点，并将内存中的状态反映并同步到磁盘。另一方面，如果数据库不够繁忙，产生的数据不足以达到`max_wal_size`，则会触发`checkpoint_timeout`，这意味着即使负载很低，也会在特定时间后同步。\n\
  \n在上方所示的默认配置中，每5分钟或每产生1 GB新（WAL）数据就会执行一次检查点。\n\n请注意，只有在自上次检查点以来情况发生变化时才会执行检查点；在极少数情况下，如果数据库没有产生任何新数据（即完全没有负载），即使`checkpoint_timeout`时间已过，也不会触发检查点。实际上，如果自上次检查点以来没有任何数据更改，就没有什么可同步的，因此检查点也就根本无需执行任何工作。\n\
  \n## 检查点节流\n\n检查点无需急于完成：如果系统没有将所有内存中的数据同步到磁盘，并且发生故障，系统将把所有WAL段重放到上一个已完成的检查点。基于这一考虑，PostgreSQL提供了一个配置参数，用于指示系统完成检查点的速度。\n\
  \n为了避免检查点执行期间出现I/O尖峰，PostgreSQL使用`checkpoint_completion_target`，其值可介于0和1之间。该参数表示检查点可以延迟写入脏缓冲区的时长。具体来说，完成检查点的时间计算为`checkpoint_timeout\
  \ x checkpoint_completion_target`。\n\n例如，如果将`checkpoint_completion_target`设置为0.2，`checkpoint_timeout`为300秒，则系统将有60秒时间写入所有数据。系统会校准所需的存储I/O带宽，以完成脏缓冲区的写入。\n\
  \n`checkpoint_completion_target`设置得越接近0，在检查点执行时出现的I/O尖峰就越明显，从而导致I/O带宽占用较高；另一方面，将该参数设置为接近1会避免I/O尖峰，代之以低带宽消耗的持续I/O活动。下图说明了上述概念：\n\
  \n![](img/bbe5644feba3d6a2ab994dc7e6cecbf1_434_0.png)\n\n默认情况下，`checkpoint_completion_target`设置为0.9，这意味着检查点将尽可能缓慢地完成，以避免I/O尖峰和资源消耗：\n\
  \n```\nforumdb=> show checkpoint_completion_target;\ncheckpoint_completion_target\n\
  -----------------------------\n0.9\n(1 row)\n```\n\n## 手动触发检查点\n\n集群管理员随时可以手动启动检查点进程：PostgreSQL的CHECKPOINT语句会启动通常由`checkpoint_timeout`或`max_wal_size`触发的所有活动。\n\
  \n既然检查点是一种侵入性较强的操作，为什么还要有人手动执行它呢？一个原因可能是在开始流复制或文件级备份之前，确保磁盘上的所有数据都已同步。\n\n在下一节中，你将了解VACUUM进程——这种技术让PostgreSQL能够回收未使用的空间，移除不再可见的元组。\n\
  \n## VACUUM\n\n在前面的章节中，你了解了PostgreSQL如何利用MVCC存储同一数据（元组）的不同版本，这些版本可由不同事务根据其活动快照来感知。然而，相对于最新的活动版本，保留相同元组的不同版本需要额外空间，而这些空间迟早会填满你的存储。为了防止这种情况并回收存储空间，PostgreSQL提供了一个名为VACUUM的内部工具，其目标是分析存储的元组版本，并移除那些不再可感知的版本。\n\
  \n![](img/bbe5644feba3d6a2ab994dc7e6cecbf1_435_0.png)\n\n> 请记住：当不再有任何活动事务可以引用该版本（即该元组版本位于其快照中）时，该元组就是不可感知（不可见）的。不可感知的元组通常被称为死元组，表示在数据库生命周期中它已不再需要。\n\
  \nVACUUM可能是一项I/O密集型操作，因为它必须回收和释放磁盘空间，因此可能是一种侵入性操作。为此，你不应过于频繁地手动运行VACUUM，PostgreSQL还提供了一个名为autovacuum的后台任务，它可以根据当前数据库活动替你运行VACUUM。\n\
  \n以下小节将向你展示手动和自动VACUUM。\n\n## 手动VACUUM\n\n手动VACUUM可以针对单个表、表列的子集或整个数据库运行，其概要如下：\n\
  \n```\nVACUUM [ FULL ] [ FREEZE ] [ VERBOSE ] [ ANALYZE ] [ table_and_columns [,\
  \ ...] ]\n```\n\nVACUUM主要有三种版本，它们执行逐步更强力的数据重构：\n\n- *普通* VACUUM（默认）进行轻微的空间回收，这意味着它会丢弃死元组版本，但不会对表进行碎片整理，因此最终效果是不会回收空间。\n\
  - VACUUM FULL 会重写整个表，丢弃死元组并消除碎片，从而也积极回收磁盘空间。\n- VACUUM FREEZE 将已整合的元组标记为冻结，以防止 xid\
  \ 回卷问题。\n\nVACUUM不能在一个事务中执行，也不能在函数或过程中执行。附加选项VERBOSE和ANALYZE分别提供详细输出并执行表内容的统计信息更新（这对于性能提升很有用）。\n\
  \n为了查看VACUUM的效果，让我们构建一个简单的示例。首先，确保autovacuum已设置为off。如果没有，请编辑`$PGDATA/postgresql.conf`配置文件，将该参数设置为off，然后重启集群。之后，检查tags表的大小：\n\
  \n```\nforumdb=> SHOW autovacuum;\n autovacuum\n-------------\n off\n(1 row)\n```\n\
  \n```\nforumdb=> SELECT relname, reltuples, relpages, pg_size_pretty( pg_relation_size(\
  \ 'tags' ) )\nFROM pg_class WHERE relname = 'tags' AND relkind = 'r';\n relname\
  \ | reltuples | relpages | pg_size_pretty\n---------+-----------+----------+----------------\n\
  \ tags    |         6 |        1 | 8192 bytes\n(1 row)\n```\n\n如你所见，该表只有六个元组，在磁盘上仅占用一个大小为8\
  \ KB的数据页。现在，让我们向表中填充大约100万个随机元组：\n\n```\nforumdb=> INSERT INTO tags( tag )\nSELECT\
  \ 'FAKE-TAG-#' || x\nFROM generate_series( 1, 1000000 ) x;\nINSERT 0 1000000\n```\n\
  \n由于我们已停止autovacuum，PostgreSQL不知道表的真实大小，因此我们需要执行手动ANALYZE，告知集群表中新增的数据：\n\n```\n\
  forumdb=> ANALYZE tags;\nANALYZE\nforumdb=> SELECT relname, reltuples, relpages,\
  \ pg_size_pretty( pg_relation_size( 'tags' ) )\nFROM pg_class WHERE relname = 'tags'\
  \ AND relkind = 'r';\n relname | reltuples | relpages | pg_size_pretty\n---------+-----------+----------+----------------\n\
  \ tags    | 1.00001e+06 |     6370 | 50 MB\n```\n\n现在是时候使我们插入的所有元组失效了，例如，使用UPDATE覆盖它们（由于MVCC，这将使元组产生副本）：\n\
  \n```\nforumdb=> UPDATE tags SET tag = lower( tag ) WHERE tag LIKE 'FAKE%';\nUPDATE\
  \ 1000000\n```\n\n该表现在仍然有大约100万个有效元组，但大小几乎翻倍，因为每个元组现在都有两个版本，其中一个已死亡：\n\n```\nforumdb=>\
  \ ANALYZE tags;\nANALYZE\nforumdb=> SELECT relname, reltuples, relpages, pg_size_pretty(\
  \ pg_relation_size( 'tags' ) )\n```\n\n\n\nFROM pg_class WHERE relname = 'tags'\
  \ AND relkind = 'r';\n relname |  reltuples  |  relpages | pg_size_pretty\n----------+-------------+-----------+----------------\n\
  \ tags     | 1.00001e+06 |     12739 | 100 MB\n(1 row)\n\n我们现在构建了一个可用于 VACUUM 测试实验室的东西。如果我们执行普通的\
  \ VACUUM，每个数据页中的死元组都将被清除，但页面不会被重建，因此数据页的数量将保持不变，存储上的最终表大小也将相同：\n\n```\nforumdb=>\
  \ VACUUM VERBOSE tags;\n...\nINFO:  \"tags\": found 1000000 removable, 1000006 nonremovable\
  \ row versions in 12739 out of 12739 pages\n\nVACUUM\nforumdb=> ANALYZE tags;\n\
  ANALYZE\n\nforumdb=> SELECT relname, reltuples, relpages, pg_size_pretty( pg_relation_size(\
  \ 'tags' ) )\nFROM pg_class WHERE relname = 'tags' AND relkind = 'r';\n relname\
  \ |  reltuples  |  relpages | pg_size_pretty\n----------+-------------+-----------+----------------\n\
  \ tags     | 1.00001e+06 |     12739 | 100 MB\n(1 row)\n```\n\nVACUUM 告知我们有 100\
  \ 万个元组可以安全删除，而 100 万个（加上原始的 6 个元组）元组无法删除，因为它们代表最后的活动版本。然而，执行后，表大小没有变化：所有数据页在内部都被去碎片化，但没有释放存储空间，因为页面的总数没有变化。\n\
  \n那么，普通 VACUUM 的目的是什么？这种 VACUUM 在每个页面上提供新的空闲空间，因此表本质上可以在不改变自身大小的情况下容纳 100 万个新元组。我们可以通过执行我们已经做过的相同的元组失效来证明这一点：\n\
  \n```\nforumdb=> UPDATE tags SET tag = upper( tag ) WHERE tag LIKE 'fake%';\nUPDATE\
  \ 1000000\nforumdb=> ANALYZE tags;\n```\n\n```\nANALYZE\nforumdb=> SELECT relname,\
  \ reltuples, relpages, pg_size_pretty( pg_relation_size( 'tags' ) )\nFROM pg_class\
  \ WHERE relname = 'tags' AND relkind = 'r';\n relname |  reltuples  | relpages |\
  \ pg_size_pretty\n----------+-------------+----------+----------------\n tags  \
  \   | 1.00001e+06 |    12739 | 100 MB\n(1 row)\n```\n\n正如你所见，元组数、页面数和表大小都没有变化。本质上是这样的：我们最初引入了\
  \ 100 万个新元组，然后我们更新了所有这些元组，使 100 万个变成 200 万个，然后我们在表上使用 VACUUM，将数量再次降低到 100 万，但保留了已分配的空闲空间，使得表占用了\
  \ 200 万个元组的空间，但只有一半的存储被填满。之后，我们创建了 100 万个新的元组版本，但系统不需要分配更多空间，因为已经有足够的空闲空间，即使这些空闲空间分散在整个表中。\n\
  \n另一方面，VACUUM FULL 不仅释放表内的空间，还收回所有此类空间，将表压缩到最小尺寸。如果我们现在执行 VACUUM FULL，至少将收回 50 MB\
  \ 的数据空间，因为 100 万个元组将被丢弃：\n\n```\nforumdb=> VACUUM FULL VERBOSE tags;\nINFO:  vacuuming\
  \ \"public.tags\"\nINFO:  \"tags\": found 1000000 removable, 1000006 nonremovable\
  \ row versions in 12739 pages\nDETAIL:  0 dead row versions cannot be removed yet.\n\
  CPU: user: 0.18 s, system: 0.61 s, elapsed: 1.03 s.\nVACUUM\nforumdb=> ANALYZE tags;\n\
  ANALYZE\nforumdb=> SELECT relname, reltuples, relpages, pg_size_pretty( pg_relation_size(\
  \ 'tags' ) )\nFROM pg_class WHERE relname = 'tags' AND relkind = 'r';\n relname\
  \ |  reltuples  | relpages | pg_size_pretty\n----------+-------------+----------+----------------\n\
  \ tags     | 1.00001e+06 |     6370 | 50 MB\n(1 row)\n```\n\nVACUUM FULL 的输出与普通\
  \ VACUUM 几乎相同：它显示有 100 万个元组可以被丢弃。然而，最终结果是整个表获得了这些元组所占用的空间。需要记住的是，虽然诱人，但 VACUUM FULL\
  \ 会强制完全重写表，因此会将大量工作推给 I/O 系统，从而带来潜在的性能损失。\n\n可以用图片总结 VACUUM 的主要效果。想象一下如下图所示的情况，其中一个表占用了两个数据页，分别有四个和三个有效元组（绿色）：\n\
  \n![](img/bbe5644feba3d6a2ab994dc7e6cecbf1_440_0.png)\n\n图 11.6：两个数据页上的有效和无效元组\n\
  \n死元组（红色）会产生页内碎片，因为它们与可见元组交错。最终效果是表占用了两个页的存储空间，而所有可见元组都可以“打包”到一个页面中。\n\n如果执行普通 VACUUM，页面的总数将保持不变，但每个页面都会释放死元组占用的空间并将有效元组压缩在一起，如下图所示：\n\
  \n换句话说，PostgreSQL 会尽最大努力保持运行，即使你错误地配置了它！\n\nautovacuum 的主要设置可以从 `$PGDATA/postgresql.conf`\
  \ 配置文件或通常的 `pg_settings` 目录中检查。最重要的配置参数如下：\n\n- `autovacuum` 启用或禁用 autovacuum 后台机制。除非进行实验，如我们在上一节中所做的，否则没有理由保持\
  \ autovacuum 禁用。\n- `autovacuum_vacuum_threshold` 指示在 autovacuum 可以在表上激活之前允许产生多少个新元组版本。想法是我们不希望\
  \ autovacuum 在表上只有少量元组发生变化时触发，因为这会在没有有效收益的情况下产生 I/O 惩罚。默认情况下，此参数设置为 50 个元组，这意味着如果你的表中的更改没有产生至少\
  \ 50 个新的元组版本，则不会被认为足以触发 autovacuum。\n- `autovacuum_vacuum_scale_factor` 指示作为百分比，表中有多少元组必须被更改，autovacuum\
  \ 才会对表执行具体的 VACUUM。想法是表增长得越多，autovacuum 就越会等待死元组，然后再执行其活动。此设置在默认安装中为 `0.2`，这意味着当至少有\
  \ 20% 的元组被标记为死时，autovacuum 将触发。\n- `autovacuum_cost_limit` 是一个衡量后台进程必须暂停自身以便稍后恢复的最大阈值的值。\n\
  - `autovacuum_cost_delay` 指示 autovacuum 为了不干扰其他数据库活动而被暂停的毫秒数（以十为倍数）。仅在达到成本延迟时才执行暂停。\n\
  \n本质上，autovacuum 的活动是这样的：它扫描数据库中的每个表，如果更改的元组数大于 `autovacuum_vacuum_threshold + (\
  \ table-tuples * autovacuum_vacuum_scale_factor )`，则 autovacuum 进程被激活。它然后对表执行真空测量工作量。如果工作量达到\
  \ `autovacuum_cost_limit` 设置的值，进程会暂停自身 `autovacuum_cost_delay` 毫秒，然后恢复并继续进行。只要 autovacuum\
  \ 达到阈值，它就会暂停自身，产生增量 VACUUM 的效果。这种 autovacuum 的 *停止-启动* 行为旨在减少对运行集群的整体影响：autovacuum\
  \ 会暂停自身以便为交互式连接和用户留下资源。\n\n但 autovacuum 如何计算其正在进行的活动的成本呢？有一组可调值，表示获取新数据页、扫描脏页等的成本如何。\n\
  \n这些值与手动 VACUUM 共享：\n\n```\nforumdb=> SELECT name, setting  FROM pg_settings\n \
  \   WHERE name like 'vacuum_cost%';\n            name            | setting\n----------------------------+---------\n\
  vacuum_cost_delay          | 0\nvacuum_cost_limit          | 200\nvacuum_cost_page_dirty\
  \     | 20\nvacuum_cost_page_hit       | 1\nvacuum_cost_page_miss      | 2\n(5 rows)\n\
  ```\n\n这些值用于手动 VACUUM 和 autovacuum，两者均适用，唯一的例外是 autovacuum 有自己的 autovacuum_vacuum_cost_limit，通常设置为\
  \ 200。另一方面，手动 VACUUM 的 vacuum_cost_delay 设置为 0，这意味着本质上手动 VACUUM 进程永远不会暂停自身。毕竟，数据库管理员希望手动\
  \ VACUUM 尽快完成。\n\nANALYZE 部分也存在类似的参数，因为 autovacuum 后台进程执行 VACUUM ANALYZE，因此你有 autovacuum_analyze_threshold\
  \ 和 autovacuum_analyze_scale_factor，它们负责定义 ANALYZE 部分的活动窗口（该部分涉及更新表内容的统计信息）。\n\n\
  ## Summary\n\nPostgreSQL 利用 MVCC 来提供对底层数据的高并发访问，这意味着每个事务都会感知到数据的快照，而系统会保留同一元组的不同版本。迟早，无效元组将被删除，存储空间将被收回。一方面，MVCC\
  \ 提供了更好的并发性，但另一方面，它需要额外的努力来收回事务不再引用死元组时的存储空间。PostgreSQL 为此目的提供了 VACUUM，并且还有一个名为\
  \ autovacuum 的后台进程机制，以定期且非侵入的方式保持系统干净健康。\n\n为了提高 I/O 和可靠性，PostgreSQL 将数据存储在顺序写入的日志中，即\
  \ WAL。WAL 被分成段，并在特定时间间隔，称为检查点，将内存中的所有脏数据强制到存储中的指定位置，并回收 WAL 段。\n\n\n\n\n\n在本章中，你已经学习了\
  \ WAL 和 MVCC 的内部机制，以及事务边界和保存点。你还看到了如何根据需要强制执行特定的事务隔离级别，从而保护你的数据免受同一元组的并发更新。\n\n\
  在下一章中，你将发现 PostgreSQL 如何通过可插拔模块，即扩展，在其正常功能之外得到扩展。\n\n## 验证你的知识\n\n- 什么是事务？\n  事务是一个工作单元，要么整体提交，要么整体丢弃。事务可以由单个语句或多个语句组成，可以是隐式的也可以是显式的。有关更多详细信息，请参阅\
  \ *Introducing transactions* 部分。\n- 什么是 xid 以及它受什么问题影响？\n  xid 是一个事务标识符，是一个在整个集群中唯一表示一个事务的数字。作为计数器存储，其值会受到所谓的\
  \ *xid wraparound* 问题的影响，而 VACUUM 和 autovacuum 冻结可以解决此问题。有关更多详细信息，请参阅 *More about\
  \ transaction identifiers – the XID wraparound problem* 部分。\n- 什么是 MVCC？\n  MVCC\
  \ 是一种技术，通过它，在某一瞬间，数据库中可以存在元组的多个版本。根据当前运行的事务及其提交状态，会使用不同的版本。有关更多详细信息，请参阅 *Explaining\
  \ MVCC* 部分。\n- WAL 是什么以及为什么它们如此重要？\n  WAL 是数据库的 *intent logs*；在对存储进行任何修改之前，PostgreSQL\
  \ 会将更改写入 WAL。这样，写入会更快，并且在崩溃的情况下不会丢失数据。有关更多详细信息，请参阅 *How PostgreSQL handles persistency\
  \ and consistency: WALs* 部分。\n- 什么是检查点？\n  检查点是集群将内存中的数据与磁盘上的数据同步的时间点，确保存储反映最新的更改。检查点完成后，旧的\
  \ WAL 段可以被回收。有关更多详细信息，请参阅 *Checkpoints* 部分。\n\n## 参考资料\n\n- PostgreSQL transaction\
  \ isolation levels – official documentation: https://www.postgresql.org/docs/current/sql-set-transaction.html\n\
  - PostgreSQL transaction isolation level SERIALIZABLE – official documentation:\
  \ https://www.postgresql.org/docs/current/transaction-iso.html#XACT-SERIALIZABLE\n\
  - PostgreSQL savepoints – official documentation: https://www.postgresql.org/docs/current/sql-savepoint.html\n\
  - PostgreSQL VACUUM – official documentation: https://www.postgresql.org/docs/current/sql-vacuum.html\n\
  \n## 在 Discord 上了解更多\n\n要加入本书的 Discord 社区——在那里你可以分享反馈、向作者提问并了解新版本——请扫描下面的二维码：\n\n\
  https://discord.gg/jYWCjF6Tku\n\n![](img/bbe5644feba3d6a2ab994dc7e6cecbf1_446_0.png)\n"
- "## 12\n\n## 扩展数据库——扩展生态系统\n\n扩展是将相关的数据库对象，如函数、例程和表，打包在一起的强大方式，使得将对象作为一个整体进行管理变得更容易。扩展允许你和其他开发者通过提供一种清晰、简洁和准确的方式来安装、升级和删除功能和对象，从而扩展已经丰富的\
  \ PostgreSQL 功能集。在本章中，你将了解扩展是什么以及如何使用不同的工具安装、升级或删除它们。此外，你将学习如何从头开始构建自己的扩展，以便立即在打包自己的脚本和工具以在其他数据库和\
  \ PostgreSQL 实例之间分发方面变得高效。\n\n本章包含以下主题：\n\n- Introducing extensions\n- Managing\
  \ extensions\n- Exploring the PGXN client\n- Installing extensions\n- Creating your\
  \ own extension\n\n## 技术要求\n\n本章示例可以在本书 GitHub 仓库中找到的 chapter_12 Docker 镜像上运行：https://github.com/PacktPublishing/Learn-PostgreSQL-Second-Edition。有关本书\
  \ Docker 镜像的安装和使用说明，请参阅第 1 章，Introduction to PostgreSQL。\n\n## Introducing extensions\n\
  \nSQL 是一种声明式语言，允许你创建和操作对象以及数据。你可以将 SQL 语句分组到脚本中，以便以更可预测和可重复的方式运行脚本。然而，这样的脚本被 PostgreSQL\
  \ 看作是一系列不相关的命令，也就是说，你有责任将这些命令关联成适当的脚本。当你必须处理外语编程语言（例如 PL/Perl 和其他非 SQL 语言）或二进制库时，情况会变得更糟；集群对你的目标或对象之间的关系一无所知。幸运的是，扩展帮助你从混乱中理出秩序。\n\
  \n扩展是一组打包的文件，可以安装在集群中以提供更多功能，即“扩展”当前集群的功能集。与脚本不同，扩展是通过特定的命令严格管理的，这些命令将扩展作为一个整体进行安装、部署、加载和升级，即使它由多个不同的文件组成。\n\
  \n扩展可以是通用的，例如一种新的数据类型、一种新的索引类型，或从 PostgreSQL 内部直接发送电子邮件的服务，也可以是针对特定用例的非常具体的，例如一组表和数据以提供临时配置。扩展对你如何使用它没有意见，因此你可以自由地安装后就忘记它，或在集群的每个数据库中使用它。\n\
  \n扩展机制的主要目的是为管理新功能提供一个通用接口。得益于扩展，你有一组通用的语句可以在集群中将扩展作为一个整体部署、安装、升级和删除。无论你的扩展由单个函数组成还是由一组链接对象组成，扩展机制都会一次性处理所有对象，使管理变得更容易。此外，扩展机制定义了一种标准方式以结构化和干净的方式添加功能，从而使每个人更轻松地为\
  \ PostgreSQL 做出贡献。\n\nPostgreSQL 附带了一组有用的扩展，包含在 contrib 包中并由 PostgreSQL 开发者自己开发。因此，contrib\
  \ 扩展集是坚固且安全的，因为它们与 PostgreSQL 数据库本身紧密构建在一起。然而，扩展可以来自第三方，这就是这种方法的美妙之处：每个人都可以通过提供新功能的扩展为\
  \ PostgreSQL 做出贡献。请注意，PostgreSQL 开发者不保证第三方扩展的稳定性。\n\n操作系统包通常提供一个 postgresql-contrib\
  \ 包，用于安装所有 PostgreSQL contrib 扩展。该包被单独保留，以便用户可以选择是否安装这些扩展。显然，即使没有 contrib 模块，PostgreSQL\
  \ 也能正常工作，而该模块实际上通过扩展添加了功能。\n\nPostgreSQL 已围绕扩展的概念构建了整个生态系统，因此它不仅提供用于管理扩展的语句，还提供用于构建新扩展和将现有脚本转换为扩展的平台。然后，扩展可以通过一个名为\
  \ PostgreSQL eXtensions Network（PGXN）的全球存储库公开提供。\n\n你可以将 PostgreSQL 扩展视为编程语言中的可重用库，例如\
  \ Perl 的模块、Ruby 的 gems、Java 的 JAR 等。同样，PGXN 基础设施可以被视为 Perl 的 CPAN（或 PHP 的 PEAR 等）。\n\
  \n## The extension ecosystem\n\n扩展的美妙之处在于它们提供了一种统一的方式来捆绑可以部署（安装）和在 PostgreSQL 中使用的模块。开发者可以自由地为\
  \ PostgreSQL 可用模块的数量做出贡献，这已迅速发展成为一个完整的生态系统。\n\n类似于 Perl、Python 等编程语言，PostgreSQL\
  \ 现在可以用共享通用基础设施和架构的插件和模块进行定制，并且可以用相同的语句进行管理，而无需考虑它们提供的功能。\n\n扩展主要收集在 PGXN 中，这是一个在线存储库，可以查询以获取有关扩展的信息或下载扩展（以及其特定版本），并且可以用新模块进行更新。\n\
  \n记住，PGXN 就像 Perl 的 CPAN、LaTeX 的 CTAN、PHP 的 PEAR 等。\n\n\n\n\n\n虽然你在互联网上到处都能找到 PostgreSQL\
  \ 扩展，但几乎每次你需要新扩展时，你都会与 PGXN 交互。PGXN 不是一个简单的网站或代码仓库，而是一个由四个部分组成的详细平台：搜索引擎、扩展管理器、**应用程序编程接口\
  \ (API)**，以及客户端。\n\n**搜索引擎**允许用户搜索 PGXN 内容以查找特定扩展。**管理器**负责接收新扩展（或新扩展版本）并让用户获取它们（即分发扩展）。**API**\
  \ 定义了应用程序如何与管理器和搜索引擎交互，因此也定义了客户端如何构建。目前有两个主要客户端可用——PGXN 网站和 pgxnclient 命令行应用程序。pgxnclient\
  \ 应用程序可能是获取和安装扩展的最有效方式，这将在以下小节中详细介绍；然而，你也可以直接与 PGXN 网站交互来搜索和下载扩展。你将在本章后面看到使用 PGXN\
  \ 网站的示例。\n\n扩展是基于 **PostgreSQL 扩展系统 (PGXS)** 构建的，PGXS 是一组基本规则，扩展必须遵守这些规则才能提供一个通用的可管理接口。特别是，PostgreSQL\
  \ 提供了一个统一的 Makefile，每个扩展都应使用它来提供安装、升级和移除扩展的一组通用功能。你可以通过 `pg_config` 检查 PGXS 基础 Makefile，找到其位置：\n\
  \n```\n```sh\n$ pg_config --pgxs\n/usr/lib/postgresql/16/lib/pgxs/src/makefiles/pgxs.mk\n\
  ```\n```\n\npgxs.mk 是为每个扩展提供通用功能的基 Makefile，其用法在我们展示如何从头创建扩展时将变得更加清晰。\n\n## 扩展组件\n\
  \n一个扩展由两个主要组件组成——**控制文件**和**脚本文件**：\n\n- **控制文件**提供有关扩展及其管理方式的信息，例如在哪里以及如何安装它，如何升级它等等。控制文件在某种程度上是扩展的元数据。\n\
  - **脚本文件**是一个 SQL 文件，其中包含创建扩展一部分的数据库对象的语句。在某种程度上，这就是扩展的内容。脚本文件可以反过来加载完成扩展的其他文件，如共享库等。\n\
  \n当你要求 PostgreSQL 安装扩展时，系统会检查控制文件以获取有关扩展的信息，确保扩展尚未安装，然后在事务中执行脚本文件。结果，你可以在数据库中使用该扩展。\n\
  \n每个扩展都有一个版本，以便你可以精确决定要安装哪个版本。如果未指定版本，PostgreSQL 将假定你想要最新可用版本。\n\n扩展安装在集群的 share\
  \ 目录中，通常可以通过执行带 `--sharedir` 选项的 pg_config 命令找到。以下是一个示例：\n\n```\n$ pg_config --sharedir\n\
  /usr/share/postgresql/16\n```\n\n组成扩展的所有文件都将放置在共享目录中，集群期望这些文件对运行集群的用户可用（通常是操作系统用户\
  \ postgres）。一旦文件对集群可用，扩展必须在需要它的每个数据库中选择性安装；请记住，PostgreSQL 在数据库之间提供非常强的隔离，因此加载到一个数据库中的扩展不会自动在另一个数据库中可用。但是，请记住模板数据库（参见第\
  \ 2 章）可作为新创建数据库的骨架，因此一旦你在模板数据库中安装了扩展，你将在所有其他创建的数据库中找到该扩展已可用。\n\n## 控制文件\n\n扩展控制文件必须具有与扩展相关且后缀为\
  \ .control 的名称。例如，一个有效名称可以是 learnpg.control。\n\n控制文件是一个文本文件，你可以在其中指定指令，这些指令是安装说明和元数据，让\
  \ PostgreSQL 处理扩展安装。每个指令都有一个名称和一个值。最常见的指令如下：\n\n- directory 指定扩展脚本路径。\n- default_version\
  \ 指定当用户未指定任何版本时要安装的扩展版本。\n- comment 是扩展及其目的的描述。\n- requires 是安装和使用本扩展所需其他扩展的可选列表，因此代表依赖列表。\n\
  \n## 管理扩展\n\n每个扩展都在数据库级别管理，这意味着每个需要扩展的数据库都必须管理该扩展生命周期。换句话说，没有按集群管理扩展并将其应用于集群中每个数据库的方法。\n\
  \n扩展主要由三个 SQL 语句管理：CREATE EXTENSION、DROP EXTENSION 和 ALTER EXTENSION，分别用于在数据库中安装扩展、从数据库中移除扩展以及修改扩展属性或升级它们。\n\
  \n每个扩展由一个助记符和一个版本指定；如果未指定版本，PostgreSQL 假定你想要处理最新可用版本或已安装的版本。\n\n在以下小节中，将解释这三个管理语句中的每一个。\n\
  \n### 创建扩展\n\nCREATE EXTENSION 语句允许你在当前数据库中安装现有扩展。\n\n该语句的概要如下：\n\n```\nCREATE EXTENSION\
  \ [ IF NOT EXISTS ] extension_name\n    [ WITH ] [ SCHEMA schema_name ]\n      \
  \          [ VERSION version ]\n                [ CASCADE ]\n```\n\n扩展名称是扩展的助记符，如你所见，你可以指定要安装的扩展版本号。如果扩展依赖于任何其他扩展，CASCADE\
  \ 选项允许系统自动递归执行依赖项的 CREATE EXTENSION。你可以决定扩展对象必须放置到哪个模式中，当然，这仅对可以重新定位的扩展才有意义。\n\n\
  正如你所能想象的，IF NOT EXISTS 允许命令在扩展已被安装时优雅地失败。更精确地说，如果扩展已在数据库中安装，则不执行任何操作。\n\n为了更好地了解\
  \ CREATE EXTENSION 的工作原理，假设我们想在 forumdb 数据库中安装 PL/Perl 过程语言；由于 PL/Perl 扩展作为 PostgreSQL\
  \ contrib 模块提供，你应该已经在集群中拥有该扩展。\n\n因此，为了安装它，你需要执行以下操作：\n\n```\nforumdb=# CREATE EXTENSION\
  \ plperl;\nCREATE EXTENSION\n```\n\n请注意，PL/Perl 扩展（助记符 plperl）需要使用数据库管理员进行安装。如果你尝试再次安装同一扩展，命令将失败，除非你使用\
  \ IF NOT EXISTS 子句：\n\n```\nforumdb=# CREATE EXTENSION plperl;\nERROR:  extension\
  \ \"plperl\" already exists\n\nforumdb=# CREATE EXTENSION IF NOT EXISTS plperl;\n\
  NOTICE:  extension \"plperl\" already exists, skipping\nCREATE EXTENSION\n```\n\n\
  作为另一个简单的示例，我们可以安装 pg_stat_statements 扩展的特定版本：\n\n```\nforumdb=# CREATE EXTENSION\
  \ pg_stat_statements VERSION '1.10';\nCREATE EXTENSION\n```\n\n请注意，pg_stat_statements\
  \ 需要更改 shared_preload_libraries 配置参数，这反过来需要重启集群。在本章的 Docker 镜像中，shared_preload_libraries\
  \ 设置已为你配置好，以便使用 pg_stat_statements 扩展。如果你想手动更改 PostgreSQL 配置以使用 pg_stat_statements，你需要编辑\
  \ postgresql.conf 配置文件或执行：\n\nALTER SYSTEM SET shared_preload_libraries TO 'pg_stat_statements';\n\
  \n然后重启集群。\n\n## 查看已安装的扩展\n\n在 psql 终端中，可以使用 \\dx 特殊命令获取已安装扩展的列表：\n\n```\nforumdb=#\
  \ \\dx\n\n                         List of installed extensions\n\n    Name    |\
  \ Version | Schema | Description\n```\n\n\n-----------------+---------+----------------------------------\n\
  -----------------------------\npg_stat_statements | 1.10    | public      | track\
  \ execution statistics\nof all SQL statements executed\nplperl             | 1.0\
  \     | pg_catalog   | PL/Perl procedural language\nplpgsql            | 1.0   \
  \  | pg_catalog   | PL/pgSQL procedural language\n(3 rows)\n\n完全相同的信息可以从特殊的 pg_extension\
  \ 目录中获取，该目录可以与 pg_namespace 关联，以提取有关扩展所在的模式的人类可读信息：\n\n```\nforumdb=# SELECT x.extname,\
  \ x.extversion, n.nspname\n            FROM pg_extension x JOIN pg_namespace n\n\
  \            ON n.oid = x.extnamespace;\n\n     extname     | extversion | nspname\n\
  -----------------+------------+----------\nplpgsql          | 1.0        | pg_catalog\n\
  plperl           | 1.0        | pg_catalog\npg_stat_statements | 1.10      | public\n\
  (3 rows)\n```\n\n## 查找可用的扩展版本\n\n可以检查集群以获取有关可用扩展版本的信息，这意味着你可以在数据库中实际安装的版本。特殊的 pg_available_extension_versions\
  \ 目录允许你获取任何可用扩展的所有可用版本。以 pg_stat_statements 扩展为例，集群中可用的值如下：\n\n```\nforumdb=# SELECT\
  \ name, version\n            FROM pg_available_extension_versions\n            WHERE\
  \ name = 'pg_stat_statements';\n\n     name             | version\n---------------------+--------\n\
  \     name             | version\n---------------------+--------\npg_stat_statements\
  \   | 1.4\npg_stat_statements | 1.5\npg_stat_statements | 1.6\npg_stat_statements\
  \ | 1.8\npg_stat_statements | 1.9\npg_stat_statements | 1.7\npg_stat_statements\
  \ | 1.10\n```\n\n了解 pg_stat_statements 扩展可以根据需要安装在 1.4 到 1.10 之间的版本是有用的。\n\n> 你应该始终安装扩展的最新版本，即版本号最高的版本，除非你被迫为向后兼容而安装特定版本。\n\
  \n## 修改现有扩展\n\nALTER EXTENSION 语句非常丰富且复杂，允许你完全修改现有扩展。该语句允许对现有扩展进行四项主要更改：\n\n- 将扩展升级到新版本\n\
  - 设置可重新定位扩展的模式\n- 向扩展添加数据库对象\n- 从扩展中删除数据库对象\n\n为了升级已安装的扩展，你必须指定 UPDATE 子句，并指定目标版本号。例如，考虑前面介绍的\
  \ pg_stat_statements 扩展，并假设我们出于升级目的安装了它的 1.6 版本。为了将扩展更新到 1.10 版本，可以发出以下示例所示的 ALTER\
  \ EXTENSION 语句：\n\n```\nforumdb=# CREATE EXTENSION\n    pg_stat_statements WITH\
  \ VERSION '1.6';\nCREATE EXTENSION\n\nforumdb=# ALTER EXTENSION pg_stat_statements\n\
  \    UPDATE TO '1.10';\nALTER EXTENSION\n```\n\n```\nforumdb=# \\dx pg_stat_statements\n\
  \                         List of installed extensions\n      Name       | Version\
  \ | Schema |\nDescription\n----------------------+---------+--------+-------------------------------\n\
  \ pg_stat_statements | 1.10    | public | track execution statistics of\nall SQL\
  \ statements executed\n(1 row)\n```\n\n通过指定 SET SCHEMA 子句，可以将可重新定位扩展从一个模式移动到另一个模式，例如：\n\
  \n```\nforumdb=# ALTER EXTENSION pg_stat_statements SET SCHEMA my_schema;\nALTER\
  \ EXTENSION\n\nforumdb=# \\dx pg_stat_statements\n                         List\
  \ of installed extensions\n      Name       | Version |  Schema  |\nDescription\n\
  ----------------------+---------+----------+-------------------------\n pg_stat_statements\
  \ | 1.10    | my_schema | track execution statistics of\nall SQL statements executed\n\
  (1 row)\n```\n\n这将把所有扩展对象移动到 my_schema 模式中，该模式必须在扩展被重新定位之前存在。\n\n如果你想从一个扩展中删除现有的数据库对象，例如表，可以使用\
  \ DROP 子句，后跟对象的类型，当然还有其名称。重要的是要理解，从扩展中删除对象不会从数据库中删除该对象；相反，它将对象的生命周期与扩展的生命周期分离。换句话说，从扩展中删除的对象成为一个普通的数据库对象。例如，如果我们从同名的扩展中删除\
  \ pg_stat_statements 视图，我们可以在 DROP 子句后指定对象类型（VIEW），如下所示：\n\n```\nforumdb=# ALTER\
  \ EXTENSION pg_stat_statements\n             DROP VIEW pg_stat_statements;\nALTER\
  \ EXTENSION\n```\n\n如果扩展已被重新定位，则需要为每个对象指定限定名称，因此要在对象名称前加上当前扩展模式。例如，在将扩展重新定位到 my_schema\
  \ 命名空间之后，上述命令变为：\n\n```\nforumdb=# ALTER EXTENSION pg_stat_statements\n    DROP\
  \ VIEW my_schema.pg_stat_statements;\nALTER EXTENSION\n```\n\n上述 DROP VIEW 命令的结果是，在扩展部署时最初创建的视图仍然存在于数据库中并且可以正常查询；但此视图现在是一个与扩展本身生命周期独立的对象。\n\
  \n只需查询它即可轻松看出视图仍然可用：\n\n```\nforumdb=# SELECT count(*) FROM pg_stat_statements;\n\
  count\n------\n    2\n(1 row)\n```\n\n当然，可以使用 ADD 子句向扩展添加新对象，其工作原理与 DROP 相反，需要对象的类型和名称。例如，要将\
  \ pg_stat_statements 视图添加回扩展，可以执行以下操作：\n\n```\nforumdb=# ALTER EXTENSION pg_stat_statements\n\
  \    ADD VIEW pg_stat_statements;\nALTER EXTENSION\n```\n\n你也可以将自己的对象添加到扩展中。因此，例如，将新表添加到扩展意味着该扩展将经历扩展生命周期：\n\
  \n```\nforumdb=# CREATE TABLE t_ext( i int, t text );\nforumdb=# ALTER EXTENSION\
  \ pg_stat_statements\n    ADD TABLE t_ext;\nALTER EXTENSION\n```\n\nt_ext 表现在是扩展的一部分，因此，不能再使用不考虑扩展的语句对其进行操作。\n\
  \n例如，如果你尝试删除该表，PostgreSQL 将阻止你损坏扩展：\n\n```\nforumdb=# DROP TABLE t_ext;\nERROR:\
  \  cannot drop table t_ext because extension pg_stat_statements requires it\nHINT:\
  \  You can drop extension pg_stat_statements instead.\n```\n\n最后一个示例恰当地展示了扩展的强大功能：属于扩展的所有对象都作为一个整体进行管理，因此不能因相互依赖而被意外管理或删除。这意味着，为了删除上述表，你要么需要在删除表本身之前将其从扩展中移除，要么删除整个扩展。\n\
  \n## 删除现有扩展\n\nDROP EXTENSION 从当前数据库中删除扩展。该语句的语法如下：\n\n```\nDROP EXTENSION [ IF\
  \ EXISTS ] name [, ...] [ CASCADE | RESTRICT ]\n```\n\n该命令支持 IF EXISTS 子句，就像许多其他语句一样。此外，可以指定要从数据库中删除多个扩展。\n\
  \nCASCADE 选项还会删除依赖于扩展对象的数据库对象，而其对应项 RESTRICT 则会在仍有其他对象依赖于此扩展时使命令失败。此外，可以同时删除多个扩展。\n\
  \n例如，以下语句一次删除两个扩展，并删除依赖于这些扩展的所有对象：\n\n```\nforumdb=# DROP EXTENSION plperl, plpgsql\
  \ CASCADE;\nNOTICE:  drop cascades to function get_max(integer,integer)\nDROP EXTENSION\n\
  ```\n\n正如你所见，由于用户定义的 get_max() 函数依赖于两个扩展之一，CASCADE 选项使该过程也删除了该函数。\n\n\n\n\n\n`get_max()`\
  \ 函数是一个简单的 PL/PgSQL 函数，已安装在本章的 Docker 容器中，仅用于演示 PostgreSQL 在删除扩展时如何足够智能地移除所有依赖对象。\n\
  \n总之，你已经学会了如何手动管理一个扩展，从安装到升级或移除；在下一节中，你将学习如何以更自动化的方式执行相同的步骤。\n\n## 探索 PGXN 客户端\n\
  \nPGXN 客户端是一个外部应用程序，用 Python 编写，作为 PGXN 的命令行界面。该应用程序名为 pgxnclient，通过命令运行，这些命令是 install、download、uninstall\
  \ 等操作，允许数据库管理员与 PGXN 和扩展进行交互。\n\n在某种程度上，pgxnclient 的工作方式与 Perl 的 cpan（或 cpanm）命令、Raku\
  \ 的 zef、Python 的 pip 等相同。\n\n作为一个外部应用程序，pgxnclient 不随 PostgreSQL 分发，因此在使用它之前你需要在机器上安装它。安装\
  \ pgxnclient 并不是使用 PostgreSQL 扩展的强制要求，但它可以让你的生活变得轻松许多。\n\n在下面的小节中，你将看到如何在主要的 Unix\
  \ 和类 Unix 操作系统上安装 pgxnclient，但在那之前，重要的是让你知道，一旦安装完成，你的系统上会出现两个可执行文件：pgxn 和 pgxnclient。你可以将这两个可执行文件视为彼此的别名，即使这并不完全正确（一个包装了另一个）；然而，你可以使用其中任何一个，得到完全相同的结果。在本章中，我们将使用\
  \ pgxn 作为主要的可执行文件。\n\n在本书仓库中的 Docker 镜像里，pgxnclient 程序已经安装好了，所以你不需要安装它。\n\n有关如何安装\
  \ pgxnclient 的详细说明超出了本书的范围，因此如果你无法让应用程序正常工作，请仔细检查项目文档和安装说明。\n\n## 在 Debian GNU/Linux\
  \ 及衍生版上安装 pgxnclient\n\npgxnclient 已为 Debian GNU/Linux 及衍生版打包，这意味着你可以简单地让 apt 安装它：\n\
  \n```\n$ sudo apt install pgxnclient\n```\n\n程序安装完成后，你可以使用 --version 选项简单地测试它，它会打印你安装的版本号：\n\
  \n```\n$ pgxn --version\npgxnclient 1.3.2\n```\n\n## 在 Fedora Linux 和基于 Red Hat\
  \ 的发行版上安装 pgxnclient\n\npgxnclient 也已为 Fedora 打包，因此你可以使用操作系统的包管理器安装它：\n\n```\n$\
  \ sudo dnf install -y pgxnclient\n```\n\n进程完成后，你可以查询应用程序以验证它是否正常工作：\n\n```\n$ pgxn\
  \ --version\npgxnclient 1.3.2\n```\n\n## 在 FreeBSD 上安装 pgxnclient\n\npgxnclient\
  \ 已为 FreeBSD 打包，因此你可以通过 pkg 工具或通过软件 ports 安装它。最快的方式是使用 pkg，你只需要请求安装该程序：\n\n```\n\
  $ sudo pkg install --yes pgxnclient\n```\n\n## 从源码安装 pgxnclient\n\n你始终可以从源码安装 pgxnclient，即使这仅建议在你的操作系统未提供打包版本，或版本相对于你的需求已过时的情况下使用。你可以从官方项目\
  \ GitHub 仓库下载最新发布的压缩版本，例如：\n\n```\n$ wget https://github.com/pgxn/pgxnclient/archive/refs/tags/v1.3.2.zip\n\
  ```\n\n一旦你拥有压缩归档，你需要解压缩它并进入随之创建的目录——以你下载的 PGXN 版本命名——在我们的例子中是 pgxnclient-1.3.2。一旦进入该目录，执行\
  \ setup.py Python 脚本将允许你安装应用程序：\n\n```\n$ unzip v1.3.2.zip\n$ cd pgxnclient-1.3.2\n\
  $ sudo python setup.py install\n...\nFinished processing dependencies for pgxnclient==1.3.2\n\
  ```\n\n安装完成后，你可以查询应用程序以验证它是否正常工作：\n\n```\n$ pgxn --version\npgxnclient 1.3.2\n```\n\
  \n## pgxnclient 命令行界面\n\nPGXN 客户端应用程序提供了一个类似于其他基于命令的应用程序（如 cpanm 和 git）的命令行界面。你可以通过请求帮助来获取主要命令列表：\n\
  \n```\n$ pgxn help\nusage: pgxn [--version] [--help] COMMAND ...\n\nInteract with\
  \ the PostgreSQL Extension Network (PGXN).\n\noptional arguments:\n  --version \
  \ print the version number and exit\n  --help     show this help message and exit\n\
  \navailable commands:\n  COMMAND    the command to execute. The complete list is\
  \ available using 'pgxn help --all'. Builtin commands are:\n  check      run a distribution's\
  \ test\n  download   download a distribution from the network\n  help       display\
  \ help and other program information\n  info       print information about a distribution\n\
  \  install    download, build and install a distribution\n```\n\n```\nload     \
  \ load a distribution's extensions into a database\nmirror    return information\
  \ about the available mirrors\nsearch    search in the available extensions\nuninstall\n\
  \          remove a distribution from the system\nunload    unload a distribution's\
  \ extensions from a database\n```\n\n通常，你会使用以下子集命令：\n\n- search 用于使用关键词搜索发行版\n-\
  \ info 用于更仔细地查看一个扩展\n- download 用于下载（但不安装）一个扩展\n- install 用于下载并在集群中安装一个扩展\n- load\
  \ 用于针对特定数据库执行 CREATE EXTENSION\n- unload 用于针对特定数据库执行 DROP EXTENSION\n- uninstall\
  \ 用于从集群中移除一个扩展\n\n你可能使用的最小命令集是 search、install 和 uninstall。\n\n对于每个命令，如果你将命令指定为 help\
  \ 命令的参数，你可以获得更详细的帮助。例如，要获取有关 search 命令的更多信息，你可以执行以下操作：\n\n```\n$ pgxn help search\n\
  usage: pgxn search [--help] [--mirror URL] [--verbose] [--yes]\n               \
  \     [--docs | --dist | --ext]\n                    TERM [TERM ...]\n\nsearch in\
  \ the available extensions\n\npositional arguments:\n  TERM        a string to search\n\
  \noptional arguments:\n  --help      show this help message and exit\n  --docs \
  \     search in documentation [default]\n  --dist      search in distributions\n\
  \  --ext       search in extensions\n```\n\n```\nglobal options:\n  --mirror URL\
  \  the mirror to interact with [default: https://api.pgxn.org/]\n  --verbose   \
  \  print more information\n  --yes         assume affirmative answer to all questions\n\
  ```\n\n在下面的章节中，你将看到如何有效地使用 PGXN 来安装一个扩展。\n\n## 安装扩展\n\n通常，使扩展运行起来的工作流程涉及几个步骤。首先，你需要找出使用哪个扩展、哪个版本，以及与你的集群的兼容性。一旦你找到了需要的扩展，你必须在集群中安装它。\n\
  \n在集群中安装它实际上意味着将其部署到 PostgreSQL 目录中，即将所有扩展相关文件和库移动到集群的共享目录中，以便 PostgreSQL 可以查找运行扩展所需的代码。\n\
  \n最后，你需要在需要它的每个数据库中创建扩展。创建扩展就像在特定数据库内启用扩展的使用一样。\n\n为了演示扩展的使用，我们将安装 orafce，即 Oracle\
  \ 兼容函数扩展。描述整个扩展并不是本节的目的，所以让我们简单地说，这个扩展提供了一组函数、数据类型和其他内容，使 PostgreSQL 看起来像 Oracle\
  \ 数据库，从而使基于 Oracle 的应用程序迁移变得更容易。\n\n以下小节描述了使扩展运行所需的每个步骤。\n\n### 通过 pgxnclient 安装扩展\n\
  \n通常，安装扩展的第一步是获取有关它的详细信息——这意味着搜索一个扩展。在这种特殊情况下，我们已经知道要查找的扩展是什么，但让我们通过 pgxn 搜索它：\n\
  \n> 注意，orafce 版本会定期更改。4.5.0 在撰写时是最新的，但你可能会看到更新的版本号。\n\n\n\n\n\n![](img/bbe5644feba3d6a2ab994dc7e6cecbf1_467_0.png)\n\
  \nFigure 12.3: The extension download page\n\n要继续进行，你首先需要解压下载的归档文件：\n\n```\n$ unzip\
  \ orafce-4.5.0.zip\n```\n\n现在你可以进入为此扩展创建的目录并编译它（系统上需要安装编译器和所有源代码构建工具）：\n\n```\n\
  $ cd orafce-4.5.0\n$ make\n```\n\n你需要 PGXS Makefiles 才能从头编译扩展。通常，此类 Makefiles 会随\
  \ PostgreSQL 的开发工具一起安装。例如，在基于 Red Hat 的 Linux 发行版上，你需要安装 postgresql16-dev 包。在本章的\
  \ Docker 镜像中，所有编译和安装扩展所需的工具都已准备就绪。\n\n如果编译成功，扩展将被创建并准备好添加到 PostgreSQL 共享库目录。为了将扩展文件移入集群，你需要访问数据库目录，例如使用\
  \ sudo：\n\n```\n$ sudo make install\n```\n\n从这里开始，你可以在需要该扩展的每个数据库中使用 CREATE EXTENSION\
  \ 语句。\n\n## 使用已安装的扩展\n\n一旦扩展被安装——也就是说，无论是手动还是通过 pgxn *部署*到 PostgreSQL 集群——你就可以在需要它的每个数据库中创建该扩展。\n\
  \norafce 扩展必须由超级用户创建，因此你需要以管理员身份连接到数据库才能执行 CREATE EXTENSION 语句：\n\n```\n$ psql -U\
  \ postgres forumdb\npsql (16.0)\nType \"help\" for help.\n\nforumdb=# CREATE EXTENSION\
  \ orafce;\nCREATE EXTENSION\n```\n\n如果现在检查数据库中已安装的扩展，你会看到刚刚创建的 orafce，版本为 4.5.0——与我们使用\
  \ pgxn 或在网站上搜索扩展时找到的版本相同：\n\n```\nforumdb=# \\x \\dx\nExpanded display is on.\n\
  List of installed extensions\n```\n\n| Name | Version | Schema | Description |\n\
  |---|---|---|---|\n| orafce | 4.5 | public | Functions and operators that emulate\
  \ a subset of functions and packages from the Oracle RDBMS |\n| pg_stat_statements\
  \ | 1.10 | public | track planning and execution statistics of all SQL statements\
  \ executed |\n| plpgsql | 1.0 | pg_catalog | PL/pgSQL procedural language |\n\n\
  一旦扩展已安装到数据库中，每个用户都可以使用它。作为一个简单的测试，你可以查询 Oracle 拥有的 DUAL 表，而 orafce 为你的遗留查询创建了该表以继续运行：\n\
  \n```\n$ psql -U luca forumdb\npsql (16.0)\nType \"help\" for help.\n\nforumdb=>\
  \ SELECT * FROM oracle.dual;\n```\n\n| dummy |\n|-------|\n| X     |\n\n(1 row)\n\
  \n请注意，扩展创建的表位于 oracle 命名空间中。通过使用 search_path，很容易避免在任何对象名称前输入 oracle：\n\n```\nforumdb=>\
  \ SET search_path TO \"$user\", public, oracle;\nSET\nforumdb=> SELECT * FROM dual;\n\
  ```\n\n| dummy |\n|-------|\n| X     |\n\n(1 row)\n\n## 移除已安装的扩展\n\n可能会出现你不再需要某个扩展，因此想要将其从集群中移除的情况。移除未使用的扩展是一个好习惯，因为它能保持集群整洁，不依赖于你真正不需要的对象。\n\
  \n如果某个数据库不再需要扩展及其相关内容，你可以发出 DROP EXTENSION 语句，扩展就会从你的数据库中消失。当然，如果扩展是由数据库超级用户安装的，你也需要以超级用户身份发出该语句。关于\
  \ orafce 的例子，作为超级用户，你可以执行以下操作：\n\n```\n$ psql -U postgres forumdb\npsql (16.0)\n\
  Type \"help\" for help.\n\nforumdb=# DROP EXTENSION orafce;\nDROP EXTENSION\n```\n\
  \n正如你所想象的，检查扩展列表时将不再显示 orafce 条目，并且所有功能，包括 DUAL 表，都已消失：\n\n```\nforumdb=# \\dx\n\
  List of installed extensions\n```\n\n| Name | Version | Schema | Description |\n\
  |---|---|---|---|\n| pg_stat_statements | 1.10 | public | track planning and execution\
  \ statistics of all SQL statements executed |\n| plpgsql | 1.0 | pg_catalog | PL/pgSQL\
  \ procedural language |\n\n(2 rows)\n\n```\nforumdb=# SELECT * FROM oracle.dual;\n\
  ERROR: relation \"oracle.dual\" does not exist\nLINE 1: SELECT * FROM oracle.dual;\n\
  ```\n\n从单个数据库中移除扩展并不会将其从你已执行过显式 CREATE EXTENSION 函数的其他数据库中移除。它也不会从集群共享目录中移除扩展文件和库。\n\
  \n从集群中移除（取消部署）扩展的确切方式取决于你最初安装它的方式。\n\n### 通过 pgxnclient 移除扩展\n\npgxn 的 uninstall\
  \ 命令执行与 install 命令完全相反的操作：它会移除与扩展相关的所有文件。命令行选项相同，这使我们能够执行如下简单的命令：\n\n```\n$ pgxn\
  \ uninstall orafce --sudo --verbose\n```\n\n所有与扩展相关的文件都将被从集群的共享库目录中移除。扩展因此永远消失，如果你需要再次安装它，将需要从第一步重新开始。\n\
  \n### 移除手动编译的扩展\n\n要移除你手动从源代码编译的扩展，你需要再次使用 make，这次使用 uninstall 命令，在你解压下载的压缩归档的目录中：\n\
  \n```\n$ cd orafce-4.5.0\n$ sudo make uninstall\n```\n\n> 避免使用不同工具混合管理扩展。如果你通过 pgxnclient\
  \ 安装了扩展，最好用同一客户端将其移除；反之，如果你是从源代码安装的，请使用相同的方法将其移除。\n\n总之，你已经了解了如何使用 PGXN 客户端或手动通过\
  \ PGXN 基础设施处理扩展。在下一节中，你将学习如何构建自己的扩展。\n\n## 创建你自己的扩展\n\n在本节中，我们将从头构建一个扩展，以便你更好地理解它们是如何构成的。其目的是让你了解如何将你自己的\
  \ SQL 脚本甚至转换为扩展，并利用扩展在可管理性方面带来的所有优势。\n\n### 定义示例扩展\n\n为了演示如何构建自己的扩展，我们将创建一个适用于论坛数据库的简单功能集，提供一些额外功能。特别是，我们将定义一个名为\
  \ tagext 的扩展，它将提供一个实用函数，给定 tag 表中的特定标签，将返回该标签的完整路径，包括所有祖先。\n\n例如，Linux 标签是 Operating\
  \ Systems 标签的子标签，因此 Linux 标签的路径为 Operating System > Linux。\n\n特别是，我们希望我们的扩展为我们提供一个名为\
  \ tag_path 的函数，给定一个标签，提供如下示例中的标签路径：\n\n```\nforumdb=> SELECT tag_path( 'Kubuntu'\
  \ );\n```\n\n| tag_path |\n|----------|\n| Operating Systems > Linux > Ubuntu >\
  \ Kubuntu |\n\n(1 row)\n\n在以下各节中，你将看到如何通过实现示例扩展来实现上述结果。所有必需的文件都可在本书源代码仓库中找到。\n\n\
  ### 创建扩展文件\n\n让我们先从控制文件开始，在其中插入有关扩展的一些基本信息。创建一个名为 tagext.control 的文件并将其放入文件夹中，例如\
  \ /src/tagext。该文件的内容如下：\n\n```\ncomment = 'Tag Programming Example Extension'\n\
  default_version = '1.0'\nsuperuser      = false\nrelocatable    = true\n```\n\n\
  在本章示例中使用的 Docker 镜像中，你将在 /src/tagext 文件夹中找到扩展文件，并能够进入该文件夹安装扩展。\n\n上述控制文件包含一个描述扩展给其他管理员的注释，指定\
  \ default_version，即如果用户未指定版本时要安装的版本，并规定此扩展可以由任何用户安装（superuser = false）并移动到用户希望的任何模式（relocatable\
  \ = true）。\n\n然后是 Makefile，即构建和安装扩展的文件：\n\n```\nEXTENSION = tagext\nDATA = tagext--1.0.sql\n\
  \nPG_CONFIG = pg_config\n```\n\n\n\n\n\n```\nPGXS := $(shell $(PG_CONFIG) --pgxs)\n\
  include $(PGXS)\n```\n\nMakefile 非常简单，可以作为其他扩展 Makefile 的骨架。特别是，我们通过此 Makefile 定义要管理的扩展的名称，以及用于生成扩展内容的\
  \ files。这在 DATA 变量中指定，因此我们将系统配置为使用 tagext--1.0.sql 文件来创建该扩展提供的对象。\n\n尾部的行定义了 PGXS\
  \ 构建基础设施的使用，特别是用于包含由 pg_config 命令输出计算得出的 PGXS 基础 Makefile。\n\n在所有基础设施就绪后，现在可以定义扩展的内容，因此\
  \ tagext--1.0.sql 文件包含一个函数的定义（参见 *第 7 章，服务器端编程*），该函数给定特定标签，返回包含所有祖先的标签路径的文本表示：\n\
  \n```\nCREATE OR REPLACE FUNCTION tag_path( tag_to_search text )\nRETURNS TEXT\n\
  AS $CODE$\nDECLARE\n    tag_path text;\n    current_parent_pk int;\nBEGIN\n\n  \
  \  tag_path = tag_to_search;\n\n    SELECT parent\n    INTO   current_parent_pk\n\
  \    FROM   tags\n    WHERE  tag = tag_to_search;\n\n    -- here we must loop\n\
  \    WHILE current_parent_pk IS NOT NULL LOOP\n        SELECT parent, tag || ' >\
  \ ' || tag_path\n        INTO   current_parent_pk, tag_path\n        FROM   tags\n\
  \        WHERE  pk = current_parent_pk;\n    END LOOP;\n\nRETURN tag_path;\nEND\n\
  $CODE$\nLANGUAGE plpgsql;\n```\n\n该函数通过接受标签作为参数，然后查询 tags 表以获取父主键，然后在每个父标签上循环工作。在每次循环中，tag_path\
  \ 文本字符串都会通过父标签名称进行丰富，以便结果得到类似 parent 1 > parent 2 > child 的字符串。\n\n一旦所有文件准备就绪，我们将有如下情况，包含\
  \ Makefile、控制文件和扩展内容文件：\n\n```\n$ ls -1 /src/tagext\nMakefile\ntagext--1.0.sql\n\
  tagext.control\n```\n\n## 安装扩展\n\n在所有组件就绪后，可以使用 Makefile 将扩展安装（部署）到集群中。由于扩展将安装在\
  \ PostgreSQL 目录中，你可能需要使用特权用户来安装扩展：\n\n```\n$ sudo make install\n```\n\n现在可以使用 CREATE\
  \ EXTENSION 在 forumdb 数据库中安装扩展，然后尝试执行扩展定义的函数：\n\n```\nforumdb=> CREATE EXTENSION\
  \ tagext;\nCREATE EXTENSION\n\nList of installed extensions\nName | Version | Schema\
  \ |\nDescription\n----------------------------+----------+------------------------------------------\n\
  ----------------------------\n----------------\n```\n\n```\npg_stat_statements |\
  \ 1.10    | public     | track planning and execution\nstatistics of all SQL statements\
  \ executed\nplpgsql             | 1.0     | pg_catalog | PL/pgSQL procedural language\n\
  tagext              | 1.0     | forum      | Tag Programming Example\nExtension\n\
  \n\nforumdb=> SELECT tag_path( 'Kubuntu' );\n                              tag_path\n\
  --------------------------------------------------------------\n Operating Systems\
  \ > Linux > Ubuntu > Kubuntu\n(1 row)\n```\n\n该函数工作正常，可以为指定标签构建标签树或路径，包括其所有祖先，同时\
  \ PostgreSQL 报告扩展的版本为 1.0。\n\n## 创建扩展升级\n\n假设我们想要丰富我们的扩展函数，以便用户可以在路径输出中指定标签分隔符。我们可以生成函数的新的版本，删除旧版本，并允许用户使用新内容升级扩展。\n\
  \n让我们首先创建扩展内容的升级，即扩展提供的新的函数。首先，创建一个名为 `tagext--1.0--1.1.sql` 的文件并在其中放置以下内容：\n\n\
  ```\nCREATE OR REPLACE FUNCTION tag_path( tag_to_search text,\n                \
  \                     delimiter text DEFAULT ' > ' )\nRETURNS TEXT\nAS $CODE$\n\
  DECLARE\n    tag_path text;\n    current_parent_pk int;\nBEGIN\n\ntag_path = tag_to_search;\n\
  \nSELECT parent\nINTO    current_parent_pk\nFROM    tags\nWHERE   tag = tag_to_search;\n\
  \n-- here we must loop\nWHILE current_parent_pk IS NOT NULL LOOP\n    SELECT parent,\
  \ tag || delimiter || tag_path\n    INTO    current_parent_pk, tag_path\n    FROM\
  \    tags\n    WHERE   pk = current_parent_pk;\nEND LOOP;\n\nRETURN tag_path;\n\
  END\n$CODE$\nLANGUAGE plpgsql;\n```\n\n该文件首先删除旧版本的函数（如果它存在并且已被此扩展的先前版本安装）。在此之后，创建一个具有额外可选参数的新函数。该函数与前一个函数执行完全相同的工作，但这次它利用变量\
  \ delimiter 来分隔多个标签。\n\n由于我们向扩展添加了新的文件，我们需要通知 Makefile 关于该文件，因此我们必须将新文件添加到 DATA\
  \ 变量中，以便 Makefile 的内容如下所示：\n\n```\nEXTENSION = tagext\n\nDATA = tagext--1.0.sql\
  \ tagext--1.0--1.1.sql\n\nPG_CONFIG = pg_config\nPGXS := $(shell $(PG_CONFIG) --pgxs)\n\
  include $(PGXS)\n```\n\n## 执行扩展升级\n\n有了新的 Makefile 和 tagext--1.0--1.1.sql 文件后，磁盘上的情况如下：\n\
  \n```\n$ ls -1 /src/tagext\nMakefile\ntagext--1.0--1.1.sql\ntagext--1.0.sql\ntagext.control\n\
  ```\n\n因此现在可以再次运行 install 命令将扩展部署到集群：\n\n```\n$ make install\n/bin/mkdir -p '/usr/local/share/postgresql/extension'\n\
  /bin/mkdir -p '/usr/local/share/postgresql/extension'\n/usr/bin/install -c -m 644\
  \ ./tagext.control '/usr/local/share/postgresql/extension/'\n/usr/bin/install -c\
  \ -m 644 ./tagext--1.0.sql ./tagext--1.0--1.1.sql '/usr/local/share/postgresql/extension/'\n\
  ```\n\n并且在数据库内部，可以使用 ALTER EXTENSION 升级扩展：\n\n```\nforumdb=> ALTER EXTENSION tagext\
  \ UPDATE TO '1.1';\nALTER EXTENSION\n\nforumdb=> \\dx tagext\n            List of\
  \ installed extensions\n Name   | Version | Schema |        Description\n--------+---------+--------+----------------------------\n\
  tagext  | 1.1     | public | Tag Programming Example Extension\n(1 row)\n```\n\n\
  正如你所见，扩展版本现在为 1.1，因此可以有或没有新的参数调用 tag_path 函数：\n\n```\nforumdb=> SELECT tag_path(\
  \ 'Kubuntu' );\n    tag_path\n-------------------------------\nOperating Systems\
  \ > Linux > Ubuntu > Kubuntu\n(1 row)\n\nforumdb=> SELECT tag_path( 'Kubuntu', '\
  \ --> ' );\n                tag_path\n----------------------------------------------------\n\
  Operating Systems --> Linux --> Ubuntu --> Kubuntu\n(1 row)\n```\n\n你现在知道如何管理扩展的整个生命周期。\n\
  \n## 总结\n\n本章向你介绍了扩展生态系统，这是一个非常丰富和强大的系统，用于打包相关对象并作为单个单元进行管理。扩展提供了一种向集群和数据库添加新功能的方法，最显著的是提供了一种清晰简洁的方式来构建更新和可重复的安装，从而简化了功能向其他集群和数据库的分发。\n\
  \nPostgreSQL 随 contrib 包提供了有用的扩展；这些扩展由 PostgreSQL 开发者直接开发，因此与当前 PostgreSQL 版本集成得非常好。另一方面，PGXN\
  \ 网络提供了第三方扩展，可以用新功能改进你的集群。\n\n得益于 PGXS 构建基础设施，从头创建扩展是全面的且相当容易的，而得益于 pgxnclient 等工具，管理大量扩展可以实现自动化。\n\
  \n在下一章，你将学习如何照顾集群的状态和性能，而第 19 章将向你展示一些其他有用的扩展。\n\n## 验证你的知识\n\n- 什么是扩展？\n  扩展是一组相关的数据库对象，可以作为单个单元进行安装、升级或删除。有关更多详细信息，请参阅\
  \ *介绍扩展* 部分。\n- 什么是 pgxnclient 命令？\n  pgxnclient 是一个简化 PGXN 使用的命令，可下载、安装和删除扩展。有关更多详细信息，请参阅\
  \ *探索 PGXN 客户端* 部分。\n\n\n\n- 什么是扩展控制文件？\n\n  控制文件是一种文本文件，用于定义扩展的主要属性，例如名称、版本和其他依赖项。更多详细信息请参阅*扩展组件*一节。\n\
  - 如何检查数据库中已创建了哪些扩展？\n\n  特殊的pg_extension目录提供了已安装扩展的信息；在psql中，特殊的\\dx命令显示已安装扩展的摘要。更多详细信息请参阅*查看已安装的扩展*一节。\n\
  - 如何更改扩展的版本（更新）？\n\n  可以使用`ALTER EXTENSION UPDATE TO`语句来指定扩展要升级到的版本。更多详细信息请参阅*修改现有扩展*一节。\n\
  \n## 参考\n\n- [关于扩展的PostgreSQL官方文档](https://www.postgresql.org/docs/current/extend-extensions.html)\n\
  - [关于扩展构建系统（PGXS）的PostgreSQL官方文档](https://www.postgresql.org/docs/current/extend-pgxs.html)\n\
  - [pgxnclient官方仓库](https://pypi.org/project/pgxnclient/)\n- [pgxnclient官方文档](https://pgxn.github.io/pgxnclient/)\n\
  - *PostgreSQL 11 服务端编程 – 快速入门指南*，Packt Publishing\n\n## 在Discord上了解更多\n\n要加入本书的Discord社区——在这里你可以分享反馈、向作者提问，并了解新版本发布——请扫描下方的二维码：\n\
  \nhttps://discord.gg/jYWCjF6Tku\n\n![](img/bbe5644feba3d6a2ab994dc7e6cecbf1_479_0.png)\n"
- "## 13\n\n## 查询调优、索引与性能优化\n\n性能调优是数据库管理员（DBA）日常工作中最复杂的任务之一。SQL 是一种声明式语言，因此它不定义如何访问底层数据——这一责任交由数据库引擎承担。因此，PostgreSQL\
  \ 必须为每条语句选择最佳的数据访问方式。\n\n其中一个特定组件——规划器（planner）——负责从所有可用的底层数据访问路径中选出最佳路径，而另一个组件——优化器（optimizer）——负责按照该特定访问计划执行语句。\n\
  \n本章旨在教你了解 PostgreSQL 如何执行查询、规划器如何计算最佳执行计划，以及你如何通过索引帮助提高性能。\n\n在本章中，你将学习以下主题：\n\n\
  - 语句的执行\n- 索引\n- EXPLAIN 语句\n- 查询调优示例\n- ANALYZE 与更新统计信息的方法\n- 自动EXPLAIN\n\n## 技术要求\n\
  \n你需要了解以下内容：\n\n- 如何执行针对数据库的查询\n- 如何执行数据描述语言（DDL）语句\n\n本章示例可以在本书GitHub仓库中的chapter_13镜像上运行：https://github.com/PacktPublishing/Learn-PostgreSQL-Second-Edition。有关本书可用Docker镜像的安装和使用，请参阅第1章《PostgreSQL简介》中的说明。\n\
  \n## 语句的执行\n\nSQL是一种声明式语言：你要求数据库对其包含的数据执行某些操作，但你不指定数据库应如何完成该SQL语句。例如，当你要求获取某些数据时，你执行一条SELECT语句，但只提供了指定所需数据子集的子句，而没有说明数据库应如何从其持久化存储中取出数据。你必须信任数据库——特别是PostgreSQL——能够完成其工作，并在任何工作负载情况下始终为你找到访问数据的最快路径。好消息是，PostgreSQL非常擅长这一点，能够理解（并在一定程度上解释）你的SQL语句及其当前工作负载，从而以最快的方式为你提供数据访问。\n\
  \n然而，找到数据的最快路径通常需要在寻找绝对最快路径与花在推理这条路径上的时间之间取得平衡；换句话说，PostgreSQL有时会选择一种折中方案，以足够快的速度为你返回数据，即使那不是绝对最快的路径。\n\
  \n另一方面，有时PostgreSQL不能很好地理解如何找到数据的最快路径，这时DBA可以帮助改进性能。通常，添加索引可以帮助PostgreSQL更快地检索底层数据。其他时候，一条缓慢的语句可能隐藏着一个写错的查询（即包含错误或矛盾子句的语句）。此外，查询缓慢还可能是由于PostgreSQL对其必须处理的数据集大小判断有误。在所有这些情况下，DBA必须对数据库或语句进行一些调优，以帮助PostgreSQL做出最佳决策。\n\
  \n为了能够帮助你的集群优化语句，你首先需要理解PostgreSQL如何处理SQL语句。在下一节中，你将学习SQL语句如何被转换为PostgreSQL为管理数据而执行的一组操作的所有基础知识。\n\
  \n## 执行阶段\n\n一条SQL语句（简称为查询）分四个主要阶段处理：\n\n1. 第一阶段是解析；一个专门的组件——解析器（parser）——处理语句的文本形式（SQL文本），并验证其是否正确。如果语句存在任何语法错误，执行就会在这个早期阶段停止；否则，解析器将语句拆解为其主要部分，例如涉及的表和列的列表、过滤数据的子句、排序等。\n\
  2. 解析器成功完成后，语句进入第二阶段：重写阶段。重写器（rewriter）负责应用任何语法规则，将原始SQL语句重写为实际要执行的语句。特别是，重写器负责应用规则（参见第8章《触发器与规则》）。当重写器完成任务，生成了数据库将要处理的有效语句后，该语句进入下一阶段：优化。\n\
  3. 在优化阶段，查询由优化器处理，优化器负责找到访问数据的最快路径。找到这条最快路径并非易事：优化器必须决定在索引或直接访问等所有可用访问方法中，如何获取数据。可以想象，在所有可用访问方法之间进行推理和迭代会消耗时间和资源，因此优化器的任务不仅是要找出最快的访问方法，还要在短时间内找出来。\n\
  4. 最后，当优化器决定了如何访问数据后，查询进入最后一个阶段：执行。执行阶段由执行器（executor）组件处理，执行器负责实际访问存储，并使用执行器决定的访问方法检索（或插入）数据。\n\
  \n总而言之，一条SQL语句会经历四个阶段，如下面的图所示：检查语句语法的解析阶段、将查询转换为更具体内容的重写阶段、决定如何访问查询所请求数据的优化阶段，以及最后获得数据物理访问权的执行阶段。\n\
  \n这可以通过下面的图来直观展示：\n\n![](img/bbe5644feba3d6a2ab994dc7e6cecbf1_484_0.png)\n\n图13.1：PostgreSQL查询阶段\n\
  \nDBA只能在优化阶段与数据库交互，在PostgreSQL未能做出最优工作时，尝试帮助它更好地理解语句并正确优化。下一节将更深入地介绍优化器，帮助你了解如何调整查询和数据库，从而以更智能、更快的方式处理查询。\n\
  \n## 优化器\n\n优化器是负责决定使用什么来尽可能快地访问数据的组件。如果一张表没有提供任何索引，那么访问其数据只有一种方式，因此无需思考从表中提取数据的方式。\n\
  \n\n\n\n\n另一方面，如果一个表提供了几个索引，优化器必须决定哪一个最适合要执行的语句。当存在多个表，每个表又有多个索引时，情况变得更加复杂：优化器必须考虑所有可能到达最终结果的方式。\n\
  \n优化器如何在不同的数据访问方式中进行选择？优化器使用成本的概念：每种访问数据的方式都被分配一个成本，成本最低的方式获胜并被选为最佳访问方法。\n\n正因如此，PostgreSQL\
  \ 优化器被称为基于成本的优化器。\n\nPostgreSQL 被配置为为其执行的每个操作分配特定的成本：从存储中获取数据、执行某些基于 CPU 的操作（例如，在内存中排序）等等。优化器遍历访问数据并将其处理以向用户返回所需结果的所有可能方式，计算每种方式的总成本——即\
  \ PostgreSQL 将执行的所有操作的成本之和。之后，成本最低的计划将作为一系列要执行的操作传递给执行器，从而管理数据。\n\n然而，这只是故事的一半。在某些情况下，优化器的任务非常简单：如果只有一个访问方法，决定如何访问数据是微不足道的。然而，有些语句涉及如此多的对象和表，以至于遍历所有可能性需要花费大量时间，以至于结果会被计算最佳访问方式所花费的时间所超过。因此，如果语句涉及超过\
  \ 12 个表连接，优化器不会遍历所有可能性，而是执行遗传算法来找到一种折中的数据访问方式。这种折中是在计算数据路径所花费的时间和找到一个不太差的访问路径之间进行的。\n\
  \n执行器也可以使用并行作业来执行数据访问。这意味着，例如，检索非常大的数据集可以通过将工作量分配给不同的并行工作进程（例如线程）来执行，每个工作进程负责数据的一个较小子集。\n\
  \n在所有情况下，优化器将要传递给执行器的一组操作划分为节点；节点是为提供最终结果或中间结果而执行的操作。例如，假设你执行一个通用查询，要求按特定顺序获取数据，如下所示：\n\
  \n```\nSELECT * FROM categories ORDER BY description;\n```\n\n优化器将向执行器传递两个操作，即两个节点：一个用于检索所有数据，一个用于对数据进行排序。\n\
  \n在下面的小节中，我们将介绍优化器考虑并传递给执行器的主要节点。我们将从顺序节点开始——这些节点将使用单个作业执行——然后我们将看到 PostgreSQL 如何在其之上构建并行性。\n\
  \n## 优化器使用的节点\n\n在本节中，我们将介绍优化器计划中可能遇到的主要节点。对于可以执行的每种操作，以及 PostgreSQL 接受的每种不同的访问方法，都有不同的节点。\n\
  \n需要注意的是，节点是可堆叠的：一个节点的输出可以用作另一个节点的输入。这允许由不同节点构成的非常复杂的执行计划，从而产生对数据的细粒度访问方法。\n\n##\
  \ 顺序节点\n\n顺序节点是那些将按顺序一个接一个执行以实现最终结果的节点。主要节点在此列出，并在以下小节中进行解释：\n\n- Sequential Scan\n\
  - Index Scan, Index-Only Scan, and Bitmap Index Scan\n- Nested Loop, Hash Join,\
  \ and Merge Join\n- The Gather and Merge parallel nodes\n\n## Sequential Scan\n\n\
  **Sequential Scan (Seq Scan)** 是优化器和执行器始终可用的唯一节点，尤其是在没有其他有价值的替代方案时。在顺序扫描中，执行器将转到磁盘上数据集的开头——例如，对应于表的文件的开头——并按顺序逐块读取所有数据。\n\
  \n例如，当你请求表的全部内容而没有任何特定的过滤子句时，这个节点总是被使用，如以下示例所示：\n\n```\nSELECT * FROM categories;\n\
  ```\n\n**Sequential Scan** 节点也用于查询中的过滤子句不是非常限制性的情况，以至于最终结果将是获取几乎整个表的内容。在这种情况下，数据库可以更快地执行顺序读取全部操作，丢弃被查询子句过滤掉的那些元组。\n\
  \n## 索引节点\n\n索引扫描可以访问涉及索引的数据，以便快速找到请求的数据集。在 PostgreSQL 中，所有索引都是二级的，这意味着它们与表并存；因此，你将在存储中为表有一个数据文件，为你在表上构建的每个索引有一个文件。这意味着索引扫描始终需要对存储进行两次不同的访问：一次读取磁盘并提取请求元组在表中的位置信息，另一次访问磁盘以查找索引指向的元组。\n\
  \n由此可以清楚地看出，PostgreSQL 会避免在索引不有用时使用索引，即前面提到的双重存储访问带来的缺点多于优点。\n\n然而，当 PostgreSQL\
  \ 认为通过索引访问数据可能有价值时，它会生成一个索引节点，该节点可以专门化为三种不同的类型。\n\n**Index Scan** 正如其名所示，是“经典”的索引访问方法。PostgreSQL\
  \ 读取所选索引，并据此去查找元组，再次从存储中读取。\n\n**Index-Only Scan** 是一种特殊的 Index Scan：如果请求的数据仅涉及属于索引的列，PostgreSQL\
  \ 足够智能，可以避免第二次存储访问，因为它可以直接从索引中提取所有所需信息。\n\n你可能遇到的最后一种基于索引的节点是 **Bitmap Index Scan**：PostgreSQL\
  \ 构建一个内存位图，标明满足语句子句的元组所在位置，然后此位图用于定位这些元组。**Bitmap Index Scan** 通常与 **Bitmap Heap\
  \ Scan** 关联，如你在以下各节的示例中将会看到。\n\n## 连接节点\n\n当 PostgreSQL 在两个（或更多）表之间执行连接时，它使用三种可能的节点之一。在本节中，我们将描述这些连接节点，考虑两个表之间的连接：外表（连接左侧的表）和内表（连接右侧的表）。\n\
  \n最简单的节点是 **Nested Loop**：两个表都以顺序或基于索引的方法进行扫描，并检查每个元组是否匹配。基本上，该算法可以用以下伪 Java 代码描述：\n\
  \n```\nfor ( Tuple o : outerTable )\n    for ( Tuple i : innerTable )\n        if\
  \ ( o.matches( i ) )\n            appendTupleToResultDataSet( o, i );\n```\n\n正如前面的伪代码所示，**Nested\
  \ Loop** 以其执行嵌套循环来评估内外表之间每个元组的方式命名。\n\n事实上，**Nested Loop** 不必对两个表都执行顺序扫描，实际上，根据上下文，每个表都可以用顺序或基于索引的访问方法遍历。然而，**Nested\
  \ Loop** 的核心不会改变：始终会有嵌套的双重循环来在元组之间搜索匹配项。\n\nPostgreSQL 仅在内表足够小，以至于每次对其循环不会引入任何特定惩罚时才选择\
  \ **Nested Loop**。\n\n另一种执行连接的方式是使用 **Hash Join** 节点：内表被映射到一个哈希中，这是一个包含表元组的桶集合；然后遍历外表，对于从外表提取的每个元组，搜索哈希以查看是否存在匹配。以下伪\
  \ Java 代码说明了 **Hash Join** 的机制：\n\n```\nHash innerHash = buildHash( innerTable );\n\
  for ( Tuple o : outerTable )\n    if ( innerHash.containsKey( buildHash( o ) ) )\n\
  \        appendTupleToResultDataSet( o, i );\n```\n\n正如前面的示例所示，第一步涉及对内表进行哈希，然后遍历外表以查看其任何元组是否与内表哈希映射中的值匹配。\n\
  \nPostgreSQL 中你可能遇到的最后一种连接是 **Merge Join**。正如名称所示，**Merge Join** 涉及排序步骤：两个表首先按连接键排序，然后按顺序遍历。对于外表的每个元组，所有在内表中匹配的元组都会被提取。由于两个表都已排序，不匹配的元组表明是时候转到下一个连接键了。\n\
  \n以下伪 Java 代码说明了 **Merge Join** 的算法：\n\n```\nouterTable = sort( outerTable );\n\
  innerTable = sort( innerTable );\nint innerIdx = 0;\n\nfor ( Tuple o : outerTable\
  \ )\n    for ( ; innerIdx < innerTable.length(); innerIdx++ ){\n        Tuple i\
  \ = innerTable[ innerIdx ];\n```\n\n\n\n\n\n```\nif ( o.matches( i ) )\n    appendTupleToResultSet(\
  \ o, i );\nelse\n    break;\n}\n```\n\n正如你所见，一旦表被排序，就会从外部表提取一个元组，并与内部表中的所有元组进行比较。一旦元组不再匹配，就会从外部表提取另一个元组，内部表从上一个位置重新开始循环。换句话说，两个表都被遍历恰好一次。\n\
  \n我们现在将进入并行节点。\n\n## 并行节点\n\n并行节点是指 PostgreSQL 可以执行以将工作量分配给并行进程的节点，从而更快地得到最终结果。需要注意的是，并行执行并不总是正确的选择：需要在并行进程之间分配作业的设置时间，以及返回每个进程结果所需的时间和资源。因此，PostgreSQL\
  \ 只有在估计的并行版本比顺序执行更有益时，才会启用某些节点的并行执行。\n\n举一个简单的例子，假设你有一个非常小的表，只包含几个元组，比如四个。如果需要整个表内容，启动和同步并行进程所花费的资源和时间将远大于直接访问表并顺序获取结果数据集。经验法则是：如果请求的数据集足够小，PostgreSQL\
  \ 永远不会选择并行执行。\n\n必须理解的是，仅因为规划器生成了并行计划，即由并行节点组成的执行计划，并不意味着执行器会遵循这种并行性。可能存在条件，特别是运行时条件，会阻止\
  \ PostgreSQL 执行并行计划，即使这会是最佳选择（例如，PostgreSQL 没有足够的空间来生成所需的并行进程数量）。\n\n在下面的小节中，你将了解主要的并行节点有哪些。\n\
  \n## Gather 节点\n\n并行执行计划始终涉及两种类型的 Gather 节点：普通的 Gather 节点和 Gather Merge 节点。\n\n\
  你可以通过一个额外的配置参数 – debug_parallel_query – 强制 PostgreSQL 执行并行计划，即使前面的值不满足，该参数默认设置为\
  \ off：\n\n```\nforumdb=> SHOW min_parallel_table_scan_size;\nmin_parallel_table_scan_size\n\
  -----------------------------\n8MB\n(1 row)\n\nforumdb=> SHOW min_parallel_index_scan_size;\n\
  min_parallel_index_scan_size\n-----------------------------\n512kB\n(1 row)\n\n\
  forumdb=> SHOW debug_parallel_query ;\ndebug_parallel_query\n--------------------\n\
  off\n(1 row)\n```\n\n无论如何，当 PostgreSQL 认为并行计划是一个选项时，它不会默认使用它：它会仔细评估顺序计划的成本和并行计划的成本，以查看是否仍值得额外的设置工作。\n\
  \n然而，并行计划的应用还有其他限制：PostgreSQL 必须确保不会生成过多的并行进程，因此如果系统上已经有太多并行进程在工作，并行执行将不会被视为一个选项。此外，任何产生数据写入的语句——即不同于\
  \ SELECT 语句的任何内容——都不会是并行计划的有效候选，以及任何可以挂起和恢复的语句，例如使用游标。\n\n最后，任何涉及调用标记为 PARALLEL\
  \ UNSAFE 的函数的查询都不会产生并行计划候选。\n\n## 工具节点\n\n除了已经介绍的用于访问单个表中的数据——或在连接的情况下多个表——的节点外，还有一些工具节点用于在计划中实现最终结果。\n\
  \n当你的语句涉及结果排序，例如 ORDER BY 子句时，规划器会插入一个 Sort 节点。如果查询有输出限制，例如 LIMIT 子句，则在计划中插入一个 Limit\
  \ 节点以减少最终结果集。\n\n在这种情况下，而不是使用 UNION ALL 语句，使用的是 Append 节点（请记住 UNION ALL 允许重复元组，而\
  \ UNION 不允许）。\n\n如果你的语句涉及不同查询的聚合，如 UNION，则会插入一个 Distinct 节点。完全相同的节点还有另一个功能：它可以提供\
  \ DISTINCT 元组选择。\n\n当语句使用 GROUP BY 子句时，规划器会插入一个 GroupAggregate 节点负责元组的压缩。类似地，当语句涉及窗口函数时（请参阅第\
  \ 7 章，服务器端编程），规划器会引入一个 WindowAgg 节点来管理窗口函数所需的元组聚合。\n\n在公用表表达式（CTE）的情况下，规划器会引入一个\
  \ CTEScan 节点负责 CTE 子查询与真实表之间的连接。如果连接需要物化一个数据集——即需要从一组查询结果模拟一个表——规划器会引入一个 Materialize\
  \ 节点。\n\n## 节点成本\n\nPostgreSQL 规划器必须评估最低成本的执行计划，为了计算所有可能的替代方案，它会计算所有评估的访问计划的成本。\n\
  \n每个节点都关联一个成本，即估计执行该节点在计算资源方面的开销。当然，每个节点的成本是可变的，取决于输入的类型和数量，以及节点类型。\n\nPostgreSQL\
  \ 为节点可以执行的主要操作类型提供了一份以任意单位表示的成本列表。因此，计算节点的成本就是计算节点执行的单个操作的成本乘以这些操作重复的次数，这取决于节点需要评估的数据大小。\n\
  \n成本可以在集群配置中调整——即在 postgresql.conf 主文件或 pg_settings 目录中。特别是，可以查询集群关于节点执行涉及的主要成本：\n\
  \n```\nforumdb=> SELECT name, setting\n    FROM pg_settings\n    WHERE name LIKE\
  \ 'cpu%_cost'\n```\n\n```\nOR name LIKE '%page\\_cost'\nORDER BY setting DESC;\n\
  \n    name | setting\n-----------------+---------\nrandom_page_cost | 4\nseq_page_cost\
  \ | 1\ncpu_tuple_cost | 0.01\ncpu_index_tuple_cost | 0.005\ncpu_operator_cost |\
  \ 0.0025\n```\n\n以上是 PostgreSQL 新安装的默认成本，除非你非常确定自己在做什么，否则不应更改上述任何值。请记住，成本决定了规划器在不同计划之间的选择，因此设置成本不正确会导致优化器采用错误的执行计划。\n\
  \n成本表示为“开销”，但这些值与执行时间无关：成本表示 PostgreSQL 获取数据所需付出的努力；因此，成本越高，需要付出的努力越大。\n\n正如你从上述成本列表中看到的那样，优化器计算的基础是顺序模式下访问单个数据页的成本：该值设置为成本单位。CPU\
  \ 成本，即与已在内存中元组的分析相关的成本，远小于一个单位，而以随机方式访问存储的成本远高于顺序访问。\n\n成本可以根据系统的计算能力而变化；特别是，使用企业级\
  \ SSD 存储磁盘可以将你的 random_page_cost 降低到 1.5，这几乎与顺序页成本相同。\n\n更改优化器成本虽然简单到只需更改几个设置，但需要对\
  \ PostgreSQL 内部结构和底层硬件有非常深入的了解，并且仅在非常特定的情况下才有用；因此，在几乎所有场景中都不建议这样做，并且不在本书的范围内。相反，你将了解规划器如何估计访问数据的成本。\n\
  \n本章后面你将看到如何应用上述成本来计算查询计划的总体成本。\n\n在下一节中，你将了解索引，这是一种 PostgreSQL 可以更有效地访问数据的功能。\n\
  \n\n\n\n\n# 索引\n\n索引是一种数据结构，它允许更快地访问底层表，以便可以快速找到特定的元组。这里的“快速”是指比扫描整个底层表并分析每一个元组都要快。\n\
  \nPostgreSQL 支持不同类型的索引，并非所有类型都适用于每种场景和工作负载。在下面的各节中，你将了解到 PostgreSQL 提供的索引主要类型，但在任何情况下，你都可以用自己的索引或扩展提供的索引来扩展\
  \ PostgreSQL。\n\nPostgreSQL 中的索引可以基于单个列或一次多个列构建；PostgreSQL 支持最多 32 列的索引。\n\n索引可以覆盖底层表中的所有数据，也可以仅索引特定值——在这种情况下，索引被称为“部分”索引。例如，你可以决定仅索引你将最常使用的某些列的值。\n\
  \n索引也可以是唯一的，这意味着它用于确保其所索引值的唯一性，例如表的 primary keys。此外，索引可以基于用户定义的函数构建，这意味着索引将索引这些函数的返回值。\n\
  \n> 为了能在索引中使用，用户定义的函数必须声明为 IMMUTABLE，这意味着对于完全相同的输入，其输出必须相同。\n\nPostgreSQL 能够混合使用索引；因此，多个不同的索引可以用来满足查询计划。得益于\
  \ PostgreSQL 的这一重要特性，你不必定义所有可能的列排列索引，因为 PostgreSQL 会尝试将不相关的索引混合使用。\n\n在下面的小节中，你将了解\
  \ PostgreSQL 16 集群中所有可用的索引类型，以及如何创建或删除索引。\n\n## 索引类型\n\nPostgreSQL 默认使用的索引是平衡树（B-Tree），这是一种树的特定实现，即使底层表大小大幅增加也能保持其深度恒定，因此从根到叶的遍历所需的工作量相同。\n\
  \nB-Tree 索引可用于大多数操作符和列类型，甚至 LIKE 基于查询中的字符串比较，但只有当模式以固定字符串开头时才有效。B-Tree 索引还支持 UNIQUE\
  \ 条件，因此用于构建主键索引。\n\nB-Tree 索引的一个缺点是它会将整列的值复制到树结构中；因此，如果你使用 B-Tree 索引大值（例如长字符串），索引会迅速增长并占用空间。\n\
  \nPostgreSQL 提供的另一种索引类型是 **哈希索引**：该索引基于列值(s)的哈希函数结果构建。需要注意的是，哈希索引只能用于相等操作符，不能用于范围操作符或不等操作符。事实上，由于该索引基于哈希函数构建，索引无法比较两个哈希值以了解其顺序；只有相等（产生完全相同的哈希值）才能被评估。\n\
  \n**块范围索引（BRIN）** 是一种特殊的索引类型，它基于存储上数据块中的值范围。思路是每个块都有最小值和最大值，索引然后为存储上的每个数据块存储一对值。当从查询中搜索特定值时，索引知道值可能在哪个数据块中，但该块中的所有元组都必须被评估。\n\
  \n因此，这种类型的索引不如 B-Tree 精确，被称为 *有损*（以强调它不精确；即可能有损失），但相对于其他所有类型的索引，其大小要小得多，因为它仅为每个数据块存储一对值。\n\
  \n**GIN** 是一种索引类型，它不是指向单个元组，而是指向多个值，在某种程度上指向一组值。通常，这种类型的索引用于全文搜索场景，其中你索引的是包含多个重复键的书面文本（例如同一个词或术语）指向不同位置（例如不同短语和行中的同一个词）。\n\
  \n接下来是 **广义索引搜索树（GIST）**，它是一个平台，可以在其上构建新的索引类型。其思路是提供一个可插拔的基础设施，你可以在其中定义可索引数据结构的运算符和功能。一个例子是\
  \ SP-GIST，一种用于地理应用的空间索引。\n\n## 创建索引\n\n索引可以通过 CREATE INDEX 语句创建，其格式如下：\n\n```\n\
  CREATE [ UNIQUE ] INDEX [ CONCURRENTLY ] [ [ IF NOT EXISTS ] name ] ON [ ONLY ]\
  \ table_name [ USING method ]\n```\n\n```\n({ column_name | ( expression ) } [ COLLATE\
  \ collation ] [ opclass ] [ ASC | DESC ] [ NULLS { FIRST | LAST } ] [, ...] )\n\
  [ INCLUDE ( column_name [, ...] ) ]\n[ WITH ( storage_parameter = value [, ...]\
  \ ) ]\n[ TABLESPACE tablespace_name ]\n[ WHERE predicate ]\n```\n\n索引由与之相关的表类似的助记符名称标识。有趣的是要注意索引名称始终是不限定的，这意味着它不包括索引将要所在的模式：索引始终位于与底层表完全相同的模式中。然而，可以将索引存储在与底层表不同的表空间中，这对于将重要索引存储在更快的存储中很有用。该语句支持\
  \ IF NOT EXISTS 子句，以在已存在同名索引时以温和的方式中止创建。\n\nUNIQUE 子句指定索引将验证其列的唯一性。WHERE 子句允许创建部分索引，即仅包含满足\
  \ WHERE 条件(s)的那些元组信息的索引。\n\nINCLUDE 子句允许你指定底层表的一些额外列，这些列将存储在索引中，即使未被索引。思路是如果索引对仅索引扫描有用，你仍然可以在不访问底层表的情况下获取额外信息。当然，具有覆盖索引（即\
  \ INCLUDE 子句索引的名称）意味着索引会增长，并且同时每个元组更新都可能需要额外的索引更新工作。\n\nUSING 子句允许指定要构建的索引类型，如果未指定，则使用默认的\
  \ B-Tree。\n\nCONCURRENTLY 子句允许以并发方式创建索引：当索引处于构建阶段时，底层表会被锁定以防止更改，以便索引可以完成对元组值的索引工作。在并发索引创建中，表在索引创建期间仍允许更改，但一旦索引构建完成，就需要对底层表进行另一次遍历以“调整”在此期间发生的更改。\n\
  \n为了使其更实用，让我们看看如何在 posts 表上构建一个简单索引。假设我们想索引帖子所属的类别：\n\n```\nforumdb=> CREATE INDEX\
  \ idx_post_category\n```\n\n```\nON posts( category );\nCREATE INDEX\n```\n\n前面的代码将在\
  \ posts 表上创建一个名为 idx_post_category 的索引，使用单列 category 和默认索引类型（B-Tree）。\n\n以下内容类似，创建了一个多列索引：\n\
  \n```\nforumdb=> CREATE INDEX idx_author_created_on\n    ON posts( author, created_on\
  \ );\nCREATE INDEX\n```\n\n需要注意的是，在创建多列索引时，你应始终将最具选择性的列放在前面。PostgreSQL 会从第一列开始考虑多列索引，因此如果前几列最具选择性，索引访问方法将是最便宜的。在前面的示例中，假设我们要搜索作者和日期的组合，我们可以预期许多作者在特定一天发布，因此日期（created_on\
  \ 列）不会非常具有选择性，至少不如特定作者具有选择性；正因如此，我们将 created_on 列推到了列列表的右侧。\n\n如果我们想创建一个哈希索引，可以执行如下操作：\n\
  \n```\nforumdb=> CREATE INDEX idx_post_created_on\n    ON posts USING hash ( created_on\
  \ );\nCREATE INDEX\n```\n\n当然，这样的索引仅对相等比较有用，因此如下查询永远不会使用前面的索引：\n\n```\nSELECT *\
  \ FROM posts WHERE created_on < CURRENT_DATE;\n```\n\n但如下查询可以使用哈希索引：\n\n```\nSELECT\
  \ * FROM posts WHERE created_on = CURRENT_DATE;\n```\n\n这是因为我们要求的是相等比较。\n\n## 检查索引\n\
  \n索引“附加”在其底层表上，因此 psql 在你使用 \\d 特殊命令描述表时，会显示已定义的索引：\n\n```\nforumdb=> \\d posts\n\
  \nTable \"forum.posts\"\n```\n\n\n\nColumn | Type | Collation | Nullable | Default\n\
  -------------------------------+-------------------+------------+----------+----------------\n\
  pk | integer | | not null | generated always as identity\ntitle | text | | | \n\
  content | text | | | \nauthor | integer | | not null |\ncategory | integer | | not\
  \ null |\nreply_to | integer | | | \ncreated_on | timestamp with time zone | | |\
  \ CURRENT_TIMESTAMP\nlast_edited_on | timestamp with time zone | | | CURRENT_TIMESTAMP\n\
  editable | boolean | | | true\nlikes | integer | | | 0\nIndexes:\n  \"posts_pkey\"\
  \ PRIMARY KEY, btree (pk)\n  \"idx_author_created_on\" btree (author, created_on)\n\
  \  \"idx_post_category\" btree (category)\n  \"idx_post_created_on\" hash (created_on)\n\
  ...\n\n从前面代码片段可以看到，该命令会显示所有可用的索引及其方法（例如 btree）以及索引所基于的列列表。\n\npg_index 特殊目录包含有关索引及其主要属性的信息，因此可以查询它以获取\
  \ psql 提供的相同信息（以及更多信息）。特别是，由于索引是以 relkind 值为 i 的特殊值注册到 pg_class 中，我们可以将 pg_class\
  \ 和 pg_index 连接起来，以语句形式获取详细信息，如下所示：\n\n```\nforumdb=> SELECT relname, relpages,\
  \ reltuples,\n    i.indisunique, i.indisclustered, i.indisvalid,\n    pg_catalog.pg_get_indexdef(i.indexrelid,\
  \ 0, true)\nFROM pg_class c JOIN pg_index i ON c.oid = i.indrelid\nWHERE c.relname\
  \ = 'posts';\n```\n\n```\n-[ RECORD 1 ]---+-------------------------------------------------------------------------------\n\
  -----------------\nrelname       | posts\nrelpages      | 21\nreltuples     | 1004\n\
  indisunique   | t\nindisclustered | f\n indisvalid    | t\npg_get_indexdef | CREATE\
  \ UNIQUE INDEX posts_pkey ON posts USING btree (pk)\n-[ RECORD 2 ]---+-------------------------------------------------------------------------------\n\
  -----------------\nrelname       | posts\nrelpages      | 21\nreltuples     | 1004\n\
  indisunique   | f\nindisclustered | f\n indisvalid    | t\npg_get_indexdef | CREATE\
  \ INDEX idx_post_category ON posts USING btree (category)\n-[ RECORD 3 ]---+-------------------------------------------------------------------------------\n\
  -----------------\nrelname       | posts\nrelpages      | 21\nreltuples     | 1004\n\
  indisunique   | f\nindisclustered | f\n indisvalid    | t\npg_get_indexdef | CREATE\
  \ INDEX idx_author_created_on ON posts USING btree (author, created_on)\n-[ RECORD\
  \ 4 ]---+-------------------------------------------------------------------------------\n\
  -----------------\nrelname       | posts\nrelpages      | 21\nreltuples     | 1004\n\
  indisunique   | f\nindisclustered | f\n```\n\n```\nindisvalid | t\npg_get_indexdef\
  \ | CREATE INDEX idx_post_created_on ON posts USING hash (created_on)\n```\n\nindisunique\
  \ 列在索引使用 UNIQUE 子句创建时设置为 true，就像主键索引的情况一样。indisvalid 是一个布尔值，表示索引是否可用（正如你稍后会看到的，你可以出于任何原因禁用一个索引）。由于你可以根据索引对表进行聚簇——也就是说，你可以根据特定索引对表进行排序——indisclustered\
  \ 表示表是否针对特定索引进行了聚簇。\n\npg_get_indexdef() 特殊函数提供用于生成每个索引的 CREATE INDEX 语句的文本表示，可以非常有用地解码和学习如何构建复杂索引。\n\
  \n因此，无论使用 psql \\d 命令还是查询 pg_index，你都可以获取现有索引及其状态的详细信息。\n\n## Dropping an index\n\
  \n要丢弃一个索引，你需要使用 DROP INDEX 语句，其格式如下：\n\n```\nDROP INDEX [ CONCURRENTLY ] [ IF EXISTS\
  \ ] name [, ...] [ CASCADE | RESTRICT ]\n```\n\n该语句接受索引名称，如果在同一语句中指定多个名称，则可以同时删除多个索引。\n\
  \nCONCURRENTLY 子句可防止命令在底层表上获取独占锁，从而防止在索引被删除之前其他查询访问该表。注意，此子句并非总能使用；例如，在显式事务中不能使用它。\n\
  \nCASCADE 选项会删除索引以及依赖于该索引的所有其他对象（例如表约束），而 RESTRICT 选项是其对应项，如果仍有对象依赖于该索引，则会阻止删除索引。RESTRICT\
  \ 子句是默认值。\n\n最后，IF EXISTS 选项允许命令在索引已被删除时优雅地中止。\n\n## Invalidating an index\n\n可以使索引失效，这是一种在不删除并重建索引的情况下告诉\
  \ PostgreSQL 完全不考虑该索引的方法。这在你研究集群行为并希望强制优化器选择不包含特定索引的数据访问路径的情况下可能很有用，或者在索引出现问题时可能也是必要的。\n\
  \n要使索引失效，你必须直接操作 pg_index 系统目录，将 indisvalid 属性设置为 false。例如，为了暂停 idx_author_created_on\
  \ 索引的使用，你需要对 pg_index 执行更新，如下所示：\n\n```\nforumdb=# UPDATE pg_index SET indisvalid\
  \ = false\n    WHERE indexrelid = ( SELECT oid FROM pg_class\n        WHERE relkind\
  \ = 'i'\n        AND relname = 'idx_author_created_on' );\n\nUPDATE 1\n\nforumdb=#\
  \ \\d posts\n...\nIndexes:\n  \"posts_pkey\" PRIMARY KEY, btree (pk)\n  \"idx_author_created_on\"\
  \ btree (author, created_on) INVALID\n  \"idx_post_category\" btree (category)\n\
  \  \"idx_post_created_on\" hash (created_on)\n...\n```\n\n> 你需要以管理员用户身份使索引失效，即使你是创建该索引的用户。这是因为你需要操作系统目录，而这项活动仅限管理员用户。\n\
  \n正如你所看到的，索引随后被标记为 INVALID，以表示 PostgreSQL 将永远不会在执行计划中考虑它。当然，你可以重置索引到其原始状态，使用与前面相同的更新，并将\
  \ indisvalid 列设置为 true 值。\n\n- 它不会执行你要求计划的语句，除非你明确要求执行。因此，EXPLAIN 执行速度很快，每次都基本恒定。\n\
  - 它会向你展示执行器将用于提供数据集的所有执行节点。\n\n让我们看一个 EXPLAIN 的示例以更好地理解。假设我们需要了解 SELECT * FROM categories\
  \ 语句的执行计划。在这种情况下，你需要将 EXPLAIN 命令作为前缀，如下所示：\n\n```\nforumdb=> EXPLAIN SELECT * FROM\
  \ categories;\n\n            QUERY PLAN\n\n------------------------------------------------------------\n\
  Seq Scan on categories  (cost=0.00..1.05 rows=5 width=68)\n(1 row)\n```\n\n正如你所看到的，EXPLAIN\
  \ 的输出报告了查询计划。只有一个执行节点，类型为 Seq Scan，后面跟着节点执行的表（on categories）。在 EXPLAIN 命令的输出中，你会找到前面各节中讨论过的所有类型的执行节点。\n\
  \n对于每个节点，EXPLAIN 会在括号之间报告更多信息：成本、行数和宽度。成本是执行节点所需的努力量，始终表示为“启动成本”和“最终成本”。启动成本是 PostgreSQL\
  \ 在开始执行节点之前必须完成的工作量；在前面的示例中，成本为 0，意味着节点的执行可以立即开始。最终成本是 PostgreSQL 为提供数据集的最后一部分所需的努力量——即完成节点的执行。\n\
  \nrows 字段表示节点预计在最终数据集中提供的元组数，这是一个纯粹的估计。由于是估计值，该值可能错误，你必须记住它永远不会为零：当 PostgreSQL 估计元组数非常低时，它总是提供\
  \ 1 作为行数。\n\n最后，width 字段表示每个元组平均占用的位数。本质上，此信息用于估计查询将产生的网络流量：在前面的示例中，可以估计每个元组为 68\
  \ 字节。\n\n\n\n\n现在考虑另一个示例，以熟悉 EXPLAIN 的输出；对查询稍作修改，会产生更多节点，如下所示：\n\n```\nforumdb=>\
  \ EXPLAIN\n    SELECT title\n    FROM categories ORDER BY description DESC;\n  \
  \              QUERY PLAN\n                        --------\n    ---------------------------------------------\n\
  \    Sort  (cost=1.11..1.12 rows=5 width=64)\n      Sort Key: description DESC\n\
  \      ->  Seq Scan on categories  (cost=0.00..1.05 rows=5 width=64)\n```\n\n这里有两个不同的节点：顶部第一个是\
  \ Sort 节点（由 ORDER BY 子句引起），第二个节点是 Seq Scan，与前面的示例相同。请注意，输出有三行，那么我们如何判断哪些行是节点，哪些不是？计划中的第一行始终是一个节点，其他节点行向右缩进，并以箭头（->）作为前缀。计划中的其他行提供其所属节点的信息；因此，在上面的示例中，Sort\
  \ Key 行是 Sort 节点的附加信息。\n\n另一种区分节点行与附加信息的方法是，每个节点行在括号中都有 cost、rows 和 width 属性。\n\n\
  一旦发现了查询的节点，就需要找出第一个节点，它通常是最缩进的那个，也是启动成本最低的那个；在上面的示例中，Seq Scan 是第一个执行的节点。该节点做的事情与前面示例中解释的完全相同：它强制执行器转到物理存储上的表，按顺序检索所有表内容。不过，上面的示例中有一个不同之处：平均宽度有所减小，这是因为查询并不需要每个元组的所有列，只需要\
  \ title 列。\n\n一旦 Sequential Scan 节点完成，其输出将用作 Sort 节点的输入，后者执行所需的 ORDER BY 操作。正如你很容易读到的那样，原始语句的排序键被打印出来，以提供足够的信息，让你了解执行器将按什么数据排序。Sort\
  \ 节点的启动成本大于（更好或几乎相同于）前一节点的最终成本：顺序扫描的最终成本为 1.05，而排序的启动成本为 1.11。这再次强调了节点是如何在管道中执行的，也告诉你排序不能在前一个节点完成之前开始。Sort\
  \ 节点的最终成本几乎等于启动成本，这意味着这个节点对 PostgreSQL 来说执行起来很简单。\n\n你可以尝试在不同的语句上执行 EXPLAIN，查看计划如何变化，以及会生成哪些节点，以便用于识别节点和资源信息。\n\
  \n在接下来的小节中，你将看到对一条语句进行 EXPLAIN 的不同选项。\n\n## EXPLAIN 输出格式\n\n默认情况下，EXPLAIN 提供基于文本的输出，但也可以提供\
  \ XML、JSON 和 YAML 格式的、结构更清晰的输出。这些其他格式不仅在需要处理外部工具和应用程序时有用，而且对于优化查询计划也很有用，因为它们提供了更多信息。\n\
  \n你可以使用 FORMAT 选项指定所需的格式，后跟格式名称，可以是 TEXT、XML、JSON 或 YAML。请看下面的示例：\n\n```\nforumdb=>\
  \ EXPLAIN ( FORMAT JSON ) SELECT * FROM categories;\nQUERY PLAN\n------------------------------------\n\
  [\n    +\n    {\n        +\n        \"Plan\": {\n            +\n            \"Node\
  \ Type\": \"Seq Scan\",\n            +\n            \"Parallel Aware\": false,\n\
  \            +\n            \"Async Capable\": false,\n            +\n         \
  \   \"Relation Name\": \"categories\",\n            +\n            \"Alias\": \"\
  categories\",\n            +\n            \"Startup Cost\": 0.00,\n            +\n\
  \            \"Total Cost\": 1.05,\n            +\n            \"Plan Rows\": 5,\n\
  \            +\n            \"Plan Width\": 68\n            +\n        }\n     \
  \   +\n    }\n    +\n]\n\n(1 row)\n```\n\n如你所见，JSON 格式不仅为查询计划提供了不同的结构，还提供了不同且更丰富的信息集。例如，从上面的示例中，我们可以看到查询是以非并行模式执行的（“Parallel\
  \ Aware”：false）。\n\n如果你需要使用应用程序或工具解析 EXPLAIN 输出，应坚持使用结构化格式之一，而不是默认的文本格式。\n\n## EXPLAIN\
  \ ANALYZE\n\nEXPLAIN 的 ANALYZE 模式通过实际运行要解释的查询来增强该命令。因此，该命令执行双重任务：它打印出执行查询的最佳计划，并运行查询，同时报告一些统计信息。\n\
  \n为了更好地理解这个概念，请将 EXPLAIN ANALYZE 的输出与普通 EXPLAIN 命令的输出进行对比：\n\n```\nforumdb=> EXPLAIN\
  \ SELECT * FROM posts;\n                    QUERY PLAN\n--------------------------------------------------\n\
  Seq Scan on posts  (cost=0.00..31.04 rows=1004 width=71)\n(1 row)\n\nforumdb=> EXPLAIN\
  \ ANALYZE SELECT * FROM posts;\n                    QUERY PLAN\n--------------------------------------------------\n\
  --------------------------------------------------\nSeq Scan on posts  (cost=0.00..31.04\
  \ rows=1004 width=71) (actual time=0.006..0.101 rows=1004 loops=1)\nPlanning Time:\
  \ 0.052 ms\nExecution Time: 0.163 ms\n(3 rows)\n```\n\nEXPLAIN ANALYZE 命令的输出通过每个节点的“actual”部分得到增强：执行器精确地汇报节点的执行情况。因此，EXPLAIN\
  \ 只能估算节点的成本，而 EXPLAIN ANALYZE 则提供关于执行时间（以毫秒为单位）、有效行数以及节点被执行次数（loops）的反馈。\n\n节点时间的表示方式与成本类似，分为启动时间和最终时间，最终时间是节点完成执行所花费的时间。因此，在上面的示例中，PostgreSQL\
  \ 花费 0.006 毫秒“预热”，并在 0.101 毫秒内完成查询执行，因此该节点完成工作需要 0.107 毫秒。\n\n节点输出的 actual 部分中另一个重要信息是行数（即节点生成的元组数），这与普通\
  \ EXPLAIN 的估计方式类似。为什么需要再次报告节点获取的行数？请记住，EXPLAIN 是估算，而 EXPLAIN ANALYZE 提供节点实际获取的元组数量。当这两个值相差很大（一个数量级或更多）时，PostgreSQL\
  \ 就无法正确估算结果集的大小，从而无法选择访问数据的最佳计划——这意味着它可能会选择非最优的访问方法。\n\n最后，在实际输出中还有 loops 的数量，即同一节点被执行的次数。通常这个数字是\
  \ 1，表示节点只执行了一次，但如果节点属于子查询，该值可能大于 1。计时和行数与单次循环执行相关；因此，要得到最终值，需要将行数和时间乘以 loops。\n\n\
  在命令输出的最末尾，EXPLAIN ANALYZE 提供总体时间信息，其中包括规划时间（优化器生成最佳候选访问计划所花费的时间）和执行时间（运行查询所花费的总时间，不包括解析和规划时间）。\n\
  \n因此，上面的示例花费 0.163 毫秒“获取数据”，并花费 0.052 毫秒决定如何获取数据，查询总共耗时 0.219 毫秒（比 0.052 + 0.163\
  \ 略多，因为有一些时间花在资源分配上）。\n\n当需要访问的数据很小时，规划时间会比执行时间长。\n\n执行时间还包括运行 BEFORE 触发器所花费的时间，而\
  \ AFTER 触发器则不计入，因为它们的函数是在计划完成后执行的。\n\n同样，规划时间只计算生成最佳访问计划所花费的时间，不包括处理规则、编写语句以及解析所需的时间。\n\
  \nEXPLAIN ANALYZE 总是会执行你想要分析的查询；因此，为了避免副作用，你应该将 EXPLAIN ANALYZE 包裹在事务中，并在分析完成后回滚工作。\n\
  \n\n\n\nEXPLAIN ANALYZE 也可以通过将 ANALYZE 作为选项传递给 EXPLAIN 来调用，如下所示：\n\n```\nforumdb=>\
  \ EXPLAIN ( ANALYZE ) SELECT * FROM categories ORDER BY title DESC;\n```\n\nEXPLAIN\
  \ ANALYZE 的选项形式在你想要为 EXPLAIN 添加其他选项时非常方便，如以下小节所示。\n\n## EXPLAIN 选项\n\nEXPLAIN 提供了一套丰富的选项，其中大多数只能在\
  \ ANALYZE 形式中使用。本节介绍的所有 EXPLAIN 选项都是布尔值，这意味着它们可以打开或关闭，但不能做更多。\n\nVERBOSE 选项允许每个节点报告更详细的信息，例如输出列的列表，即使未指定。例如，即使查询未明确要求列列表，注意借助\
  \ VERBOSE，你也可以了解到节点将为输出数据集提供的列：\n\n```\nforumdb=> EXPLAIN (VERBOSE on) SELECT *\
  \ FROM categories;\n\n                    QUERY PLAN\n\n------------------------------------------------------------\n\
  Seq Scan on forum.categories  (cost=0.00..1.05 rows=5 width=68)\n    Output: pk,\
  \ title, description\n(2 rows)\n```\n\nSETTINGS 选项用于识别查询是否使用与集群范围的通用配置选项不同的配置进行规划。某些更改可以按会话为基础应用；因此，EXPLAIN\
  \ 能够报告会话是否使用自定义设置。作为示例，考虑更改 work_mem 参数，即使它与以下示例中显示的查询无关，EXPLAIN 也会报告它在查询规划前被手动更改的参数：\n\
  \n```\nforumdb=> SHOW work_mem;\nwork_mem\n----------\n4MB\n(1 row)\n```\n\n```\n\
  forumdb=> SET work_mem TO '32MB';\nSET\nforumdb=> EXPLAIN (SETTINGS on) SELECT *\
  \ FROM posts ORDER BY created_on DESC;\n\n                    QUERY PLAN\n-------------------------------------------------------------\n\
  Sort  (cost=164403.31..166903.32 rows=1000004 width=75)\n  Sort Key: created_on\
  \ DESC\n  ->  Seq Scan on posts  (cost=0.00..20309.04 rows=1000004 width=75)\nSettings:\
  \ work_mem = '32MB'\n(4 rows)\n```\n\n借助 SETTINGS 选项，可以了解查询计划是否使用某些参数的自定义配置生成，从而更好地理解这些参数对查询计划的影响。\n\
  \nCOSTS 选项默认打开，显示节点的成本部分。例如，关闭它会移除启动和最终成本，以及平均宽度和行数：\n\n```\nforumdb=> EXPLAIN (COSTS\
  \ off) SELECT * FROM categories;\n\n                    QUERY PLAN\n-----------------------------\n\
  Seq Scan on categories\n(1 row)\n\nforumdb=> EXPLAIN (COSTS on) SELECT * FROM categories;\n\
  \n                    QUERY PLAN\n-------------------------------------------------------------\n\
  Seq Scan on categories  (cost=0.00..1.05 rows=5 width=68)\n\n(1 row\n```\n\nTIMING\
  \ 选项默认打开，在 EXPLAIN 与 ANALYZE 一起调用时显示实际执行时间。换句话说，将 TIMING 设置为 off 意味着 EXPLAIN 的输出不会显示节点执行的时间。\n\
  \n例如，注意在以下 EXPLAIN 语句中，实际时间已从输出中省略：\n\n```\nforumdb=> EXPLAIN (ANALYZE on, TIMING\
  \ off) SELECT * FROM categories;\nQUERY PLAN\n------------------------------------------------------------\n\
  --------\nSeq Scan on categories  (cost=0.00..1.05 rows=5 width=68) (actual rows=5\
  \ loops=1)\nPlanning Time: 0.113 ms\nExecution Time: 0.047 ms\n(3 rows)\n```\n\n\
  SUMMARY 选项报告规划执行所花费的总时间和查询执行所花费的时间，以便你了解规划器为找到最佳执行计划所付出的努力。\n\nBUFFERS 选项默认关闭，提供查询完成时使用的数据缓冲区信息。例如，注意在以下查询中，Execution\
  \ 节点上存在与缓冲区相关的信息：\n\n```\nforumdb=> EXPLAIN (ANALYZE, BUFFERS on) SELECT * FROM\
  \ posts;\nQUERY PLAN\n------------------------------------------------------------\n\
  ----------------\nSeq Scan on posts  (cost=0.00..31.04 rows=1004 width=71) (actual\
  \ time=0.006..0.100 rows=1004 loops=1)\n  Buffers: shared hit=21\nPlanning Time:\
  \ 0.061 ms\nExecution Time: 0.171 ms\n(4 rows)\n```\n\n缓冲区信息并不简单易于分析，可以分为两部分：前缀和后缀。\n\
  \n前缀可以是以下任意一种：\n\n+   - shared，表示 PostgreSQL 共享缓冲区，即数据库内存缓存\n+   - temp，表示临时内存（用于排序、哈希等）\n\
  +   - local，表示临时数据库对象空间（例如，临时表）\n\n后缀可以是以下任意一种：\n\n+   - hit，提供内存命中次数\n+   - read，提供从存储读取的缓冲区数量（因此，未在缓存中）\n\
  +   - dirtied，查询修改的缓冲区数量\n+   - written，从 PostgreSQL 缓存中移除并写入磁盘的缓冲区数量\n+   - lossy，PostgreSQL\
  \ 在第二次检查中在内存中检查的缓冲区数量\n\n将前缀和后缀组合提供缓冲区信息。例如，在之前的查询中，缓冲区行包含 shared hit=21，读作“21 个缓冲区已成功在数据库缓存中找到，无需再进行缓冲区操作。”\n\
  \nWAL 选项提供写入语句的 WAL 使用信息。作为示例，考虑以下查询，它向 users 表添加了一堆假用户名：\n\n```\nforumdb=> EXPLAIN\
  \ (ANALYZE on, WAL on, FORMAT yaml)\nINSERT INTO posts( title, content, author,\
  \ created_on, category )\nSELECT 'A random post title ' || v, md5( v::text ), v%2\
  \ + 1, current_date - v, v%5 + 1\nFROM generate_series( 1, 100000 ) v;\n\nQUERY\
  \ PLAN\n--------------------------------------------------\n- Plan:\n    + \n  \
  \  Node Type: \"ModifyTable\"\n    +\n...\n    Actual Loops: 1\n    +\n    WAL Records:\
  \ 506908\n    +\n    WAL FPI: 651\n    +\n    WAL Bytes: 46291062\n    +\n...\n\
  ```\n\n如你所见，输出报告了生成的 WAL 记录数（506908）、WAL 全页映像（FPI）数（651）以及写入 WAL 日志的字节数（46291062）。因此，上述语句生成了大约\
  \ 46 MB 的 WAL 流量。\n\n![](img/bbe5644feba3d6a2ab994dc7e6cecbf1_512_0.png)\n\nWAL\
  \ 大小始终大于实际表大小。例如，在上述示例中，表中产生的数据约为 13 MB，而 WAL 大小要大得多，约为 46 MB。大小差异的原因是 PostgreSQL\
  \ 必须确保数据在 WAL 中安全且可用于崩溃恢复；因此，WAL 不仅存储数据内容，还存储如何正确恢复该内容的元数据。\n\n## 查询调优示例\n\n在上一节中，你了解了\
  \ EXPLAIN 如何显示 PostgreSQL 将用于访问底层数据的计划；现在是时候使用 EXPLAIN 来调优一些慢查询并提高性能。\n\n本节将向你展示\
  \ EXPLAIN 日常使用中的一些基本概念，作为确定在何处以及如何为 PostgreSQL 仪器化以更快访问数据的强大工具。当然，查询调优是一个非常复杂的主体，通常需要重复的基于试验的优化，因此本节的目标不是为你提供关于查询调优的深入知识，而是提供如何改进自己的数据库和查询的基本理解。\n\
  \n有时，调优查询只是以 PostgreSQL 更舒适或更易理解的方式重写它，但最常见的是，查询调优意味着使用适当的索引来加快对底层数据的访问。\n\n在查询调优时需要考虑的一件重要事情是缓存效应：当\
  \ PostgreSQL 访问某些数据时，它会将数据加载到共享缓冲区中的内存中。该内存区域用作缓存；因此，如果 PostgreSQL 再次需要相同的数据，它将从内存中取出而不是去磁盘存储。这意味着查询第一次可能很慢，但如果第二次执行，更一般地说，反复执行所需的时间可能小于初始时间。因此，在检查慢查询时，尝试多次执行它以查看缓存效应如何影响所花费的时间。\n\
  \n我们的数据库据说包含一千名作者，每人发布五百篇帖子，总计五十万篇帖子：\n\n```\nforumdb=> SELECT reltuples, pg_size_pretty(\
  \ pg_relation_size( oid ) ),\nrelname FROM pg_class\nWHERE relname IN ( 'posts',\
  \ 'users' ) AND relkind = 'r';\nreltuples | pg_size_pretty | relname\n```\n\n\n\n\
  \n\n-------------+-----------------+---------\n500000 | 59 MB           | posts\n\
  1000   | 88 kB            | users\n\n本章的 Docker 镜像已预先填充了上述数量的数据。请注意谨慎，因为此类数据需要您大约有\
  \ 60 MB 的可用磁盘空间。\n\n让我们从一个简单的示例开始；我们想要按创建日期提取所有帖子，因此查询如下：\n\n```\nSELECT * FROM\
  \ posts ORDER BY created_on;\n```\n\n我们可以将其传递给 EXPLAIN 来了解 PostgreSQL 将如何执行它：\n\n\
  ```\nforumdb=> EXPLAIN SELECT * FROM posts ORDER BY created_on;\n              \
  \   QUERY PLAN\n--------------------------------------------------------------------------------------------------------------------------------\n\
  Sort  (cost=83838.92..85088.92 rows=500000 width=81)\n  Sort Key: created_on\n \
  \ ->  Seq Scan on posts  (cost=0.00..12584.00 rows=500000 width=81)\n```\n\n正如你所见，第一个要执行的节点是顺序扫描（初始成本为\
  \ 0），它将产生 500,000 个元组作为输出。为什么是顺序扫描？首先，没有过滤条件——我们想要检索表中存储的所有数据——其次，表上没有访问方法（没有索引）。\n\
  \n由于我们要求对输出进行排序，下一个要执行的节点是排序节点，它产生的元组数量与结果完全相同。\n\n执行前面的查询需要多长时间？EXPLAIN ANALYZE\
  \ 可以帮助我们回答这个问题：\n\n```\nforumdb=> EXPLAIN ANALYZE SELECT * FROM posts ORDER BY created_on;\n\
  --------------------------------------------------------------------------------------------------------------------------------\n\
  --------------------------------------------------------------------------------------------------------------------------------\n\
  Sort  (cost=83838.92..85088.92 rows=500000 width=81) (actual time=304.283..393.395\
  \ rows=500000 loops=1)\n  Sort Key: created_on\n```\n\n```\nSort Method: external\
  \ merge  Disk: 51192kB\n->  Seq Scan on posts  (cost=0.00..12584.00 rows=500000\
  \ width=81)\n(actual time=0.045..63.449 rows=500000 loops=1)\nPlanning Time: 0.059\
  \ ms\nExecution Time: 429.838 ms\n```\n\n纯执行时间接近半秒。通过在 created_on 字段上构建特定索引是否可以减少总时间：\n\
  \n```\nforumdb=> CREATE INDEX idx_posts_date ON posts( created_on );\nCREATE INDEX\n\
  forumdb=> EXPLAIN ANALYZE SELECT * FROM posts ORDER BY created_on;\n\nQUERY PLAN\n\
  --------------------------------------------------\n--------------------------------------------------\n\
  Index Scan using idx_posts_date on posts  (cost=0.42..16887.80 rows=500000 width=81)\
  \ (actual time=0.079..133.305 rows=500000 loops=1)\nPlanning Time: 0.203 ms\nExecution\
  \ Time: 162.143 ms\n(3 rows)\n```\n\n查询现在以几乎是无索引时所需时间的三分之一的速度运行，并且事实上，查询计划已从顺序扫描更改为使用新创建的新索引的索引扫描。\n\
  \n当然，新创建的索引在存储空间方面有惩罚；正如你所想象的，速度的提升伴随着额外的空间成本，可以通过以下方式检查：\n\n```\nforumdb=> SELECT\
  \ pg_size_pretty( pg_relation_size( 'posts' ) ) AS table_size,\n    pg_size_pretty(\
  \ pg_relation_size( 'idx_posts_date' ) ) AS index_size;\n    table_size | index_size\n\
  ----------------+----------\n59 MB          | 3600 kB\n(1 row)\n```\n\n现在，是否额外的磁盘空间太多取决于你的资源和最终目标；在前面的情况下，假设你经常执行查询，增加的速度是合理的。\n\
  \n让我们现在集中在更典型的查询上：查找特定用户在特定时间段内的所有帖子。假设为 2 天时间段，结果查询将如下所示：\n\n```\nSELECT p.title,\
  \ u.username\nFROM posts p\nJOIN users u ON u.pk = p.author\nWHERE u.username =\
  \ 'fluca1978'\nAND daterange( CURRENT_DATE - 2, CURRENT_DATE ) @> p.created_on::date\n\
  ```\n\nPostgreSQL 如何执行前面的查询？同样，EXPLAIN 可以帮助我们了解数据库认为的最佳查询计划是什么：\n\n```\nforumdb=>\
  \ EXPLAIN\n    SELECT p.title, u.username\n    FROM posts p\n    JOIN users u ON\
  \ u.pk = p.author\n    WHERE u.username = 'fluca1978'\n    AND daterange( CURRENT_DATE\
  \ - 2, CURRENT_DATE ) @> p.created_on::date;\n\n                              QUERY\
  \ PLAN\n----------------------------------------------------------------------------------------------------------------------------------------\n\
  Gather  (cost=1008.30..13803.58 rows=2 width=26)\n  Workers Planned: 2\n  ->  Hash\
  \ Join  (cost=8.30..12803.38 rows=1 width=26)\n        Hash Cond: (p.author = u.pk)\n\
  \        ->  Parallel Seq Scan on posts p  (cost=0.00..12792.33 rows=1042 width=15)\n\
  \              Filter: (daterange((CURRENT_DATE - 2), CURRENT_DATE) @> (created_on)::date)\n\
  \        ->  Hash  (cost=8.29..8.29 rows=1 width=19)\n              ->  Index Scan\
  \ using users_username_key on users u (cost=0.28..8.29 rows=1 width=19)\n      \
  \              Index Cond: (username = 'fluca1978'::text)\n```\n\n规划器选择启动并行查询执行：顶部节点是\
  \ Gather 节点，因此充当并行工作者的同步点。特别是，规划器决定使用两个并行进程来完成查询。最右边的节点，因此是第一个被执行的节点，是 users 表上的\
  \ Index Scan 节点。结果被哈希，并且与此同时，Parallel Seq Scan 被触发以从 posts 表中提取数据。结果被连接，Gather 收集最终结果集。此查询的总执行时间可以通过\
  \ EXPLAIN ANALYZE 轻松获得，它向我们展示查询完成大约需要 140 毫秒：\n\n```\nforumdb=> EXPLAIN ANALYZE\n\
  \    SELECT p.title, u.username\n    FROM posts p\n    JOIN users u ON u.pk = p.author\n\
  \    WHERE u.username = 'fluca1978'\n    AND daterange( CURRENT_DATE - 20, CURRENT_DATE\
  \ ) @> p.created_on::date;\n\nQUERY PLAN\n--------------------------------------------------\n\
  --------------------------------------------------\nGather  (cost=1008.30..13803.58\
  \ rows=2 width=26) (actual time=0.856..141.434 rows=20 loops=1)\n  Workers Planned:\
  \ 2\n  Workers Launched: 2\n  ->  Hash Join  (cost=8.30..12803.38 rows=1 width=26)\
  \ (actual time=0.968..135.209 rows=7 loops=3)\n        Hash Cond: (p.author = u.pk)\n\
  \        ->  Parallel Seq Scan on posts p  (cost=0.00..12792.33 rows=1042 width=15)\
  \ (actual time=0.076..133.975 rows=6667 loops=3)\n              Filter: (daterange((CURRENT_DATE\
  \ - 20), CURRENT_DATE) @> (created_on)::date)\n              Rows Removed by Filter:\
  \ 160000\n        ->  Hash  (cost=8.29..8.29 rows=1 width=19) (actual time=0.053..0.054\
  \ rows=1 loops=3)\n              Buckets: 1024  Batches: 1  Memory Usage: 9kB\n\
  ```\n\n```\n->  Index Scan using users_username_key on users u\n(cost=0.28..8.29\
  \ rows=1 width=19) (actual time=0.047..0.048 rows=1 loops=3)\n\n    Index Cond:\
  \ (username = 'fluca1978'::text)\n\nPlanning Time: 0.188 ms\nExecution Time: 141.471\
  \ ms\n```\n\n如果我们在 posts 表的 author 列上添加索引会怎样？\n\n```\nforumdb=> CREATE INDEX idx_posts_author\
  \ ON posts( author );\nCREATE INDEX\nforumdb=> EXPLAIN ANALYZE\n    SELECT p.title,\
  \ u.username\n    FROM posts p\n    JOIN users u ON u.pk = p.author\n    WHERE u.username\
  \ = 'fluca1978'\n    AND  daterange( CURRENT_DATE - 20, CURRENT_DATE ) @> p.created_on::date;\n\
  \nQUERY PLAN\n---------------------------------------------------------------\n\
  ---------------------------------------------------------------\nNested Loop  (cost=8.45..1602.29\
  \ rows=2 width=26) (actual time=0.145..0.926 rows=20 loops=1)\n  ->  Index Scan\
  \ using users_username_key on users u  (cost=0.28..8.29 rows=1 width=19) (actual\
  \ time=0.011..0.012 rows=1 loops=1)\n         Index Cond: (username = 'fluca1978'::text)\n\
  \  ->  Bitmap Heap Scan on posts p  (cost=8.17..1593.98 rows=2 width=15) (actual\
  \ time=0.129..0.904 rows=20 loops=1)\n         Recheck Cond: (author = u.pk)\n \
  \        Filter: (daterange((CURRENT_DATE - 20), CURRENT_DATE) @> (created_on)::date)\n\
  \         Rows Removed by Filter: 480\n         Heap Blocks: exact=500\n       \
  \    ->  Bitmap Index Scan on idx_posts_author  (cost=0.00..8.17 rows=500 width=0)\
  \ (actual time=0.059..0.059 rows=500 loops=1)\n```\n\n\n\n```\nIndex Cond: (author\
  \ = u.pk)\nPlanning Time: 0.401 ms\nExecution Time: 0.954 ms\n(12 rows)\n```\n\n\
  首先，查询现在是顺序执行的，因为没有Gather节点：这意味着PostgreSQL现在能够提前减少需要检查的结果集。此外，执行时间现在不到一毫秒。\n\n如你所见，第一个执行的节点是对posts表的Index\
  \ Scan节点，与之前的并行计划不同，它现在被首先使用，然后通过Nested Loop与authors表连接缩减后的结果集。使用Nested Loop证实了PostgreSQL能够提前从posts表中只获取所需的元组，从而缩减结果集。\n\
  \n同样有趣的是，不再有任何理由保留created_on列上的索引，因为前面的查询计划已经不再使用它了。\n\n现在索引需要多少空间？同样，检查起来非常简单：\n\
  \n```\nforumdb=> SELECT pg_size_pretty( pg_relation_size( 'posts') ) AS table_size,\n\
  \    pg_size_pretty( pg_relation_size( 'idx_posts_date' ) ) AS idx_date_size,\n\
  \    pg_size_pretty( pg_relation_size( 'idx_posts_author' ) ) AS idx_author_size;\n\
  \ntable_size | idx_date_size | idx_author_size\n------------+---------------+----------------\n\
  59 MB      | 3600 kB       | 3600 kB\n\n(1 row)\n```\n\n两个索引占用相同的空间，但正如我们所说，我们可以删除基于日期的索引，因为它不再需要。事实上，即使有特定的日期条件，该索引也不再被使用：\n\
  \n```\nforumdb=> EXPLAIN ANALYZE\n    SELECT p.title, u.username\n    FROM posts\
  \ p\n    JOIN users u ON u.pk = p.author\n    WHERE u.username = 'fluca1978'\nAND\
  \  p.created_on::date = CURRENT_DATE -2;\n\nQUERY PLAN\n--------------------------------------------------\n\
  Nested Loop (cost=8.45..1599.79 rows=2 width=26) (actual time=0.132..0.737 rows=1\
  \ loops=1)\n  ->  Index Scan using users_username_key on users u  (cost=0.28..8.29\
  \ rows=1 width=19) (actual time=0.009..0.010 rows=1 loops=1)\n        Index Cond:\
  \ (username = 'fluca1978'::text)\n  ->  Bitmap Heap Scan on posts p  (cost=8.17..1591.48\
  \ rows=2 width=15) (actual time=0.119..0.723 rows=1 loops=1)\n        Recheck Cond:\
  \ (author = u.pk)\n        Filter: ((created_on)::date = (CURRENT_DATE - 2))\n \
  \       Rows Removed by Filter: 499\n        Heap Blocks: exact=500\n      ->  Bitmap\
  \ Index Scan on idx_posts_author  (cost=0.00..8.17 rows=500 width=0) (actual time=0.053..0.053\
  \ rows=500 loops=1)\n            Index Cond: (author = u.pk)\nPlanning Time: 0.237\
  \ ms\nExecution Time: 0.763 ms\n```\n\n识别未使用的索引很重要，因为它能让我们回收磁盘空间，并简化管理和数据插入：请记住，每次表发生变化时，索引都必须更新，这也会消耗额外资源，例如时间和磁盘空间。\n\
  \n因此，如你所见，分析应用程序执行最频繁的查询并判断索引是否有助于提高执行速度非常重要，但同时也要记住，索引在空间和维护方面都有额外成本，所以不要滥用索引。\n\
  \n但是，如果连正在运行的查询都不知道，你又如何识别未使用的索引呢？\n\n幸运的是，PostgreSQL为你提供了关于每个索引使用情况的详细信息：特殊的pg_stat_user_indexes视图提供了索引被使用了多少次以及如何使用的信息。例如，要获取posts表上索引的信息，你可以执行如下命令：\n\
  \n```\nforumdb=> SELECT indexrelname, idx_scan, idx_tup_read, idx_tup_fetch FROM\
  \ pg_stat_user_indexes WHERE relname = 'posts';\n```\n\n```\nindexrelname   | idx_scan\
  \ | idx_tup_read | idx_tup_fetch\n---------------+----------+--------------+--------------\n\
  posts_pkey     |        5 |            5 |            5\nidx_posts_date |      \
  \  1 |       500000 |       500000\nidx_posts_author |     51 |         8534 | \
  \           0\n```\n\n这告诉我们，idx_posts_date被使用了1次，提供了500000个元组，而idx_posts_author被使用了51次，提供的元组要少得多（仅8534个），这意味着它非常高效。\n\
  \n随着时间推移，如果观察到这种趋势，即idx_posts_date很少被使用，你就可以放心地删除它。\n\n作为最后一个例子，让我们考虑一个写得不好的查询及其隐含的问题：假设我们想要提取在某个日期创建了帖子，并且在同一天获得了特定数量点赞的所有作者。一个糟糕的查询可能是这样的：\n\
  \n```sql\nSELECT u.username\nFROM users u JOIN posts p ON p.author = u.pk WHERE\
  \ p.created_on = CURRENT_DATE - 5\nAND u.pk IN ( SELECT pp.author FROM posts pp\
  \ WHERE likes = 5 and\np.created_on = created_on );\n```\n\n显然，这里并不需要对posts表的子查询，但这是一个具体的例子，用来演示理解如何编写良好查询的重要性。\n\
  \n乍一看，前面的查询运行得足够快；它执行需要190毫秒，正如EXPLAIN ANALYZE所展示的那样：\n\n```text\nforumdb=> EXPLAIN\
  \ ANALYZE SELECT u.username\nFROM users u JOIN posts p ON p.author = u.pk WHERE\
  \ p.created_on = CURRENT_DATE - 5\nAND u.pk IN ( SELECT pp.author FROM posts pp\
  \ WHERE likes = 5 and\np.created_on = created_on );\n                          \
  \    QUERY PLAN\n\n--------------------------------------------------------------------------\n\
  \nHash Join  (cost=33.93..92.04 rows=498 width=15) (actual\n time=1.351..189.308\
  \ rows=100 loops=1)\n   Hash Cond: (p.author = u.pk)\n```\n```\nJoin Filter: (SubPlan\
  \ 1)\nRows Removed by Join Filter: 900\n->  Index Scan using idx_posts_date on posts\
  \ p  (cost=0.43..55.92 rows=996 width=12) (actual time=0.029..0.254 rows=1000 loops=1)\n\
  \    Index Cond: (created_on = (CURRENT_DATE - 5))\n->  Hash  (cost=21.00..21.00\
  \ rows=1000 width=19) (actual time=0.345..0.345 rows=1000 loops=1)\n    Buckets:\
  \ 1024  Batches: 1  Memory Usage: 59kB\n    ->  Seq Scan on users u  (cost=0.00..21.00\
  \ rows=1000 width=19) (actual time=0.006..0.151 rows=1000 loops=1)\nSubPlan 1\n\
  \    ->  Index Scan using idx_posts_date on posts pp  (cost=0.42..58.49 rows=99\
  \ width=4) (actual time=0.005..0.176 rows=95 loops=1000)\n        Index Cond: (created_on\
  \ = p.created_on)\n        Filter: (likes = 5)\n        Rows Removed by Filter:\
  \ 855\nPlanning Time: 0.393 ms\nExecution Time: 189.439 ms\n```\n\n然而，查看输出，你可以看到在pp\
  \ posts上使用idx_posts_date的Index Scan节点的loops计数器设置为1000：这意味着该节点在查询中执行了1000次。该节点就是子查询，这正是SQL实现结果的方式：每当找到外层查询的一个元组，就必须运行内层查询并连接结果。一种可能的方案是重写查询，避免PostgreSQL进行循环，例如，使用带有GROUP\
  \ BY表达式的子查询：\n\n```\nforumdb=> EXPLAIN ANALYZE\nWITH likes AS (\n    SELECT pp.author,\
  \ pp.created_on FROM posts pp\n    WHERE likes = 5\n    GROUP BY pp.author, pp.created_on\n\
  )\nSELECT u.username\nFROM users u JOIN posts p ON p.author = u.pk\nJOIN likes l\
  \ ON l.created_on = p.created_on AND l.author = u.pk\nWHERE p.created_on = CURRENT_DATE\
  \ - 5;\n```\n\n```\n---------------------------------------------\n---------------------------------------------\n\
  -------------\nHash Join  (cost=89.47..149.68 rows=98 width=15) (actual time=0.581..0.896\
  \ rows=100 loops=1)\n  Hash Cond: (p.author = u.pk)\n  ->  Index Scan using idx_posts_date\
  \ on posts p  (cost=0.43..55.92 rows=996 width=12) (actual time=0.012..0.167 rows=1000\
  \ loops=1)\n        Index Cond: (created_on = (CURRENT_DATE - 5))\n  ->  Hash  (cost=87.82..87.82\
  \ rows=98 width=31) (actual time=0.561..0.562 rows=100 loops=1)\n        Buckets:\
  \ 1024  Batches: 1  Memory Usage: 15kB\n        ->  Hash Join  (cost=62.09..87.82\
  \ rows=98 width=31) (actual time=0.305..0.540 rows=100 loops=1)\n              Hash\
  \ Cond: (u.pk = l.author)\n              ->  Seq Scan on users u  (cost=0.00..21.00\
  \ rows=1000 width=19) (actual time=0.005..0.094 rows=1000 loops=1)\n           \
  \   ->  Hash  (cost=60.86..60.86 rows=98 width=12) (actual time=0.294..0.294 rows=100\
  \ loops=1)\n                    Buckets: 1024  Batches: 1  Memory Usage: 13kB\n\
  \                    ->  Subquery Scan on l  (cost=58.90..60.86 rows=98 width=12)\
  \ (actual time=0.243..0.276 rows=100 loops=1)\n                          ->  HashAggregate\
  \  (cost=58.90..59.88 rows=98 width=12) (actual time=0.242..0.260 rows=100 loops=1)\n\
  \                                Group Key: pp.author, pp.created_on\n         \
  \                       Batches: 1  Memory Usage: 24kB\n                       \
  \         ->  Index Scan using idx_posts_date on posts pp  (cost=0.43..58.41 rows=98\
  \ width=12) (actual time=0.009..0.208 rows=100 loops=1)\n                      \
  \                Index Cond: (created_on = (CURRENT_DATE - 5))\n               \
  \                       Filter: (likes = 5)\n                                  \
  \    Rows Removed by Filter: 900\nPlanning Time: 0.455 ms\nExecution Time: 0.954\
  \ ms\n```\n\n\n\n\n\n这个查询在不到一毫秒的时间内就能返回结果，最重要的是，它不会让 PostgreSQL 对同一个子查询进行循环。\n\n\
  显然，完全不用子查询来编写查询，是让 PostgreSQL 理解其任务的最有效方式：\n\n```\nforumdb=> EXPLAIN ANALYZE\nSELECT\
  \ u.username\nFROM users u JOIN posts p ON p.author = u.pk\nWHERE p.created_on =\
  \ CURRENT_DATE - 5\nAND p.likes = 5;\n\nQUERY PLAN\n------------------------------------------------------------\n\
  ------------------------------------------------------------\nHash Join  (cost=33.93..92.17\
  \ rows=98 width=15) (actual time=0.413..0.638 rows=100 loops=1)\n  Hash Cond: (p.author\
  \ = u.pk)\n  ->  Index Scan using idx_posts_date on posts p  (cost=0.43..58.41 rows=98\
  \ width=4) (actual time=0.015..0.212 rows=100 loops=1)\n        Index Cond: (created_on\
  \ = (CURRENT_DATE - 5))\n        Filter: (likes = 5)\n        Rows Removed by Filter:\
  \ 900\n  ->  Hash  (cost=21.00..21.00 rows=1000 width=19) (actual time=0.393..0.394\
  \ rows=1000 loops=1)\n        Buckets: 1024  Batches: 1  Memory Usage: 59kB\n  \
  \      ->  Seq Scan on users u  (cost=0.00..21.00 rows=1000 width=19) (actual time=0.007..0.173\
  \ rows=1000 loops=1)\nPlanning Time: 0.263 ms\nExecution Time: 0.666 ms\n```\n\n\
  前面的简单示例说明了理解 EXPLAIN 和 EXPLAIN ANALYZE 输出的重要性，以便更好地判断查询是否缺少索引，或者是否需要重写，从而让 PostgreSQL\
  \ 发挥最佳效能。\n\n## ANALYZE 以及如何更新统计信息\n\nPostgreSQL 利用统计方法来评估不同的执行计划。这意味着 PostgreSQL\
  \ 并不知道表中有多少元组，但它拥有一个良好的近似值，使规划器能够计算执行计划的成本。\n\n统计信息不仅与数量（有多少元组）有关，还与底层数据的质量有关——例如，有多少不同的值、哪些值在列中更常见等等。正是凭借这些数据的组合，PostgreSQL\
  \ 才能做出高性能的决策。\n\n但有时统计数据质量不足以让 PostgreSQL 选择最佳计划，这个问题通常被称为“过时的统计信息”。实际上，统计信息并不是实时更新的；相反，PostgreSQL\
  \ 会跟踪每个数据库中每张表的动态，并汇总新增、更新和删除的元组数量及其数据质量。由于本章后面将要解释的各种原因，统计信息可能更新不够频繁（甚至完全未更新），因此\
  \ DBA 应该始终有一种方法可以强制 PostgreSQL 从头开始并“重建”统计信息。\n\n用于执行此操作的命令是 ANALYZE。\n\n> ANALYZE\
  \ 命令与 EXPLAIN 命令的 ANALYZE 选项无关；相反，它类似于 VACUUM 命令中同名选项，如*第 11 章*所述。\n\nANALYZE 接受一个表（以及可选的一组列），并为指定表（或仅指定列）构建所有统计信息。\n\
  \n尽管保持统计信息最新很重要，但手动运行 ANALYZE 并不是好习惯，因此，当表发生足够多的变化时，自动分析守护进程会负责定期更新统计信息。\n\nANALYZE\
  \ 命令的语法如下：\n\n```\nANALYZE [ ( option [, ...] ) ] [ table_and_columns [, ...] ]\n\
  ```\n\n基本上，可以针对单个表执行该命令，如下所示：\n\n```\nforumdb=> \\timing\n\nforumdb=> ANALYZE posts;\n\
  ANALYZE\nTime: 252.771 ms\n```\n\n你可以使用 psql 的特殊命令 `\\timing` 来查看执行命令和查询所需的时间，它会在每条语句执行后打印耗时摘要。这并不是衡量性能的可靠方法，只能让你大致了解某项任务花费了多少时间。\n\
  \nANALYZE 支持的选项不多，主要有 VERBOSE（用于显示 ANALYZE 正在做什么的详细输出）和 SKIP_LOCKED（当由于其他正在进行的操作已经获取了不兼容的锁而导致\
  \ ANALYZE 无法获取适当锁时，它会跳过该表）。\n\nPostgreSQL 将 ANALYZE 收集的统计信息存储在哪里？pg_stats 特殊目录包含了规划器用于确定检查属性的值和约束的所有统计信息。例如，让我们看看\
  \ PostgreSQL 对 posts 表的 author 列了解到了什么，特别是其中有多少不同的值：\n\n```\nforumdb=> SELECT n_distinct\n\
  \          FROM pg_stats\n          WHERE attname = 'author' AND tablename = 'posts';\n\
  \ n_distinct\n------------\n        1000\n(1 row)\n```\n\nPostgreSQL 知道在我们的示例数据库中，有\
  \ 1,000 位不同的作者发布了至少一篇帖子，正如上一节中的 EXPLAIN ANALYZE 命令所展示的那样。\n\n你可以在 pg_stats 目录中找到的一项重要信息是最常见的值，以及这些值出现频率的相关数据。提取此信息需要多加注意，因为值和频率都以数组形式存储，因此以下查询提供了\
  \ author 列最常见的值和频率：\n\n```\nforumdb=> select most_common_vals, most_common_freqs\
  \ from pg_stats where\ntablename = 'posts' and attname = 'category';\n-[ RECORD\
  \ 1 ]----+----------------------------------------------\nmost_common_vals  | {3,4,1,5,2}\n\
  most_common_freqs | {0.20566666,0.20163333,0.19843334,0.19743334,0.19683333}\n```\n\
  \n该查询的输出意味着：主键为 3 的类别出现的频率为 0.2056，主键为 4 的类别出现的频率为 0.2016，依此类推。频率乘以表中包含的元组数（500,000）即可转换为元组数量。因此，主键为\
  \ 3 的类别出现在 posts 表的 500,000 × 0.2056 = 102,800 个元组中。这可以很容易地通过以下查询来验证：\n\n```\nforumdb=>\
  \ SELECT count(*), category\nFROM posts\nGROUP BY category\nORDER BY 2;\ncount |\
  \ category\n--------+----------\n100000 | 1\n100000 | 2\n100000 | 3\n100000 | 4\n\
  100000 | 5\n(5 rows)\n```\n\n从 pg_stats 中提取的结果与 SELECT count(*) 查询的结果并不相同，因为 pg_stats\
  \ 并非旨在提供绝对准确的结果，而是提供一个数量级。\n\npg_stats 中还包含其他信息，例如某列中 NULL 值的数量、不同值的数量等等。\n\n总之，PostgreSQL\
  \ 会跟踪每张表中每一列的统计信息；这些统计信息由 ANALYZE 或自动分析守护进程进行更新，因此始终可以信赖规划器对表中存储数据的数量和质量有良好的近似估计。\n\
  \n## Auto-explain（自动解释）\n\nAuto-explain 是一个扩展，可帮助 DBA 了解慢查询及其执行计划。本质上，当正在运行的查询慢于指定阈值时，auto-explain\
  \ 会触发，并将该查询的执行计划转储到 PostgreSQL 日志中（更多细节请参阅第 14 章“日志记录与审计”）。\n\n注意：本章的 Docker 镜像预配置了\
  \ auto-explain 和日志机制。\n\n这样，DBA 无需重新执行这些查询，就能深入了解慢查询及其执行计划。借此，DBA 可以检查执行计划，并决定是否在适当位置应用索引或进行更深入的分析。\n\
  \nauto-explain 模块通过一组 auto_explain 参数选项进行配置，这些选项可以插入到 PostgreSQL 配置（postgresql.conf\
  \ 文件）中，但你需要记住，要激活该模块，必须重启集群。\n\nauto-explain 模块几乎可以完成手动 EXPLAIN 命令所能完成的相同任务，包括 EXPLAIN\
  \ ANALYZE，但必须进行适当配置。\n\nauto-explain 的所有设置都位于 auto_explain 命名空间中，因此任何参数的前缀都以 auto_explain.\
  \ 开头；主要设置如下：\n\n- auto_explain.log_min_duration 是一条语句被记录之前必须达到的时间阈值。任何耗时超过此设置值的语句都将与其\
  \ EXPLAIN 输出一起出现在集群日志中。\n- auto_explain.log_format 和 auto_explain.log_level 控制输出的格式，包括文本、JSON、YAML、XML\
  \ 以及此输出将被记录的级别（例如 INFO）。\n- auto_explain.log_verbose，如果开启，会在输出中提供更详细的信息。\n- auto_explain.sample_rate\
  \ 是一个介于 0 和 1 之间的值，表示会话的采样率。例如，0.5 表示每两条语句中将记录一条。\n- auto_explain.log_nested_statements\
  \ 是一个布尔值，用于确定“内部”语句是否需要单独记录。例如，如果在记录函数调用时开启此选项，则函数内部发生的语句也会被记录和解释。\n- auto_explain.log_analyze\
  \ 是一个布尔值，指示被记录的语句是否还必须报告 EXPLAIN ANALYZE 的值，主要是实际时间。请注意，获取每个节点的计时信息可能会消耗大量资源，从而可能拖慢整个查询。当此参数开启时，其他设置也可开启，以提供\
  \ EXPLAIN ANALYZE 所提供的相同信息：\n- auto_explain.log_buffers，开启时，提供有关缓冲区利用率的信息。\n- auto_explain.log_wal，开启时，提供有关查询产生的\
  \ WAL 的信息。\n\n\n\n\n\n- auto_explain.log_timing，开启后，提供每个节点的计时信息。\n- auto_explain.log_triggers，开启后，提供语句中触发器执行的信息。\n\
  - auto_explain.log_settings，开启后，会报告与集群级配置不同的设置。\n\n为了安装和配置该模块，我们从一个简单的开始，在 postgresql.conf\
  \ 的集群配置中添加以下两个设置：\n\n```\nsession_preload_libraries = 'auto_explain'\nauto_explain.log_min_duration\
  \ = '100ms'\n```\n\n第一行告诉 PostgreSQL 加载与 auto-explain 模块相关的库，而第二行则让模块在任何查询耗时超过 100\
  \ 毫秒时触发记录。当然，你可以根据自己的需求调高或调低查询时长阈值。\n\n完成配置后，现在可以执行一个较长的查询，如下所示（假设你已经删除了上一节中创建的索引或禁用了它们）：\n\
  \n```\nforumdb=> \\timing\nforumdb=> SELECT count(*)\nFROM posts p\nJOIN users u\
  \ ON u.pk = p.author\nWHERE u.username = 'fluca1978'\nAND daterange( CURRENT_DATE\
  \ - 20, CURRENT_DATE ) @> p.created_on::date;\n count\n-------\n     20\n(1 row)\n\
  \nTime: 142.629 ms\n```\n\n该查询花费了 142 毫秒，足以触发我们的 auto-explain 功能。事实上，在 PostgreSQL\
  \ 日志中，你可以看到以下内容：\n\n```\n$ tail /postgres/16/data/log/postgresql.log\nINFO:  duration:\
  \ 139.933 ms  plan:\nQuery Text: SELECT count(*)\nFROM forum.posts p\nJOIN forum.users\
  \ u ON u.pk = p.author\nWHERE u.username = 'fluca1978'\nAND  daterange( CURRENT_DATE\
  \ - 20, CURRENT_DATE ) @> p.created_on::date;\nAggregate  (cost=13803.59..13803.60\
  \ rows=1 width=8)\n    Output: count(*)\n  ->  Gather  (cost=1008.30..13803.58 rows=2\
  \ width=0)\n        Workers Planned: 2\n      ->  Hash Join  (cost=8.30..12803.38\
  \ rows=1 width=0)\n            Inner Unique: true\n            Hash Cond: (p.author\
  \ = u.pk)\n          ->  Parallel Seq Scan on forum.posts p  (cost=0.00..12792.33\
  \ rows=1042 width=4)\n...\n```\n\n这正是普通 `EXPLAIN` 命令对同一查询所产生的输出。\n\n这种方法的美妙之处在于，你不必担心或记住要对查询或收集到的查询执行\
  \ `EXPLAIN`；你只需检查日志，就能找出慢查询的执行计划。一旦你修复了如上所示的查询（例如通过创建索引），你可以提高 auto-explain 的阈值来捕获更慢的查询，并再次重复该过程。\n\
  \n为了演示开启 auto_explain.log_analyze 后运行查询在输出上的差异，下面是针对同一查询所产生的输出：\n\n```\nINFO:  duration:\
  \ 139.730 ms  plan:\nQuery Text: SELECT count(*)\nFROM forum.posts p\nJOIN forum.users\
  \ u ON u.pk = p.author\nWHERE u.username = 'fluca1978'\nAND  daterange( CURRENT_DATE\
  \ - 20, CURRENT_DATE ) @> p.created_on::date;\nAggregate  (cost=13803.59..13803.60\
  \ rows=1 width=8) (actual time=138.110..139.720 rows=1 loops=1)\n    Output: count(*)\n\
  \    Buffers: shared hit=487 read=7264\n  ->  Gather  (cost=1008.30..13803.58 rows=2\
  \ width=0) (actual time=0.397..139.703 rows=20 loops=1)\n        Workers Planned:\
  \ 2\n```\n\n```\nWorkers Launched: 2\nBuffers: shared hit=487 read=7264\n  ->  Hash\
  \ Join  (cost=8.30..12803.38 rows=1 width=0) (actual time=44.493..134.889 rows=7\
  \ loops=3)\n    Inner Unique: true\n    Hash Cond: (p.author = u.pk)\n    Buffers:\
  \ shared hit=487 read=7264\n    Worker 0:  actual time=132.750..132.751 rows=0 loops=1\n\
  \      Buffers: shared hit=238 read=3192\n    Worker 1:  actual time=0.667..134.246\
  \ rows=4 loops=1\n      Buffers: shared hit=162 read=2120\n    ->  Parallel Seq\
  \ Scan on forum.posts p  (cost=0.00..12792.33 rows=1042 width=4) (actual time=0.132..133.575\
  \ rows=6667 loops=3)\n      Output: p.pk, p.title, p.content, p.author, p.category,\
  \ p.reply_to, p.created_on, p.last_edited_on, p.editable, p.likes\n      ;\n  Finalize\
  \ Aggregate  (cost=114848.33..114848.34 rows=1 width=8) (actual time=5190.322..5190.323\
  \ rows=1 loops=1)\n    ->  Gather  (cost=114848.12..114848.33 rows=2 width=8) (actual\
  \ time=5189.678..5193.226 rows=3 loops=1)\n      Workers Planned: 2\n      Workers\
  \ Launched: 2\n      ->  Partial Aggregate  (cost=113848.12..113848.13 rows=1 width=8)\
  \ (actual time=4861.705..4861.712 rows=1 loops=3)\n        ->  Hash Join  (cost=8.30..113848.09\
  \ rows=10 width=0) (actual time=2477.949..4861.639 rows=27 loops=3)\n...\n```\n\n\
  如你所见，输出现在包含了 `EXPLAIN ANALYZE` 所报告的相同信息。\n\n## 总结\n\nPostgreSQL 拥有一个非常复杂的基于成本的查询规划器和优化器，它会尽最大努力提供对底层数据的最快访问。\n\
  \n借助 `EXPLAIN` 命令，数据库管理员可以监控查询，追踪执行成本和耗时，并决定如何改进查询以获得更快的结果。通常，创建索引是查询调优中侵入性最小的选择，而\
  \ PostgreSQL 拥有非常丰富且富有表现力的索引接口，允许创建不同类型的单列、多列和部分索引，以及采用不同的技术。当索引不够用时，查询重写可能是执行查询调优的一种可行解决方案。\n\
  \n规划器使用的成本基于统计数据，而这些数据必须尽可能保持最新。虽然 auto-analyze 守护进程旨在完成这项工作，但 DBA 始终可以依靠手动执行 `ANALYZE`\
  \ 命令来更新统计信息。\n\n理解查询计划、了解涉及哪些节点以及它们对查询执行意味着什么、判断统计信息何时过期，以及能够尝试不同的查询访问方法，这些都是每个\
  \ DBA 应该学习的复杂任务。\n\n我们还探讨了 auto-explain 扩展，它可以用于自动收集优化器所选计划的信息，从而让 DBA 轻松检查哪些查询运行不佳。\n\
  \n需要强调的是，性能调优是数据库管理中最复杂的任务之一，没有银弹或一刀切的解决方案，因此需要经验和大量实践。在下一章中，我们将通过尝试日志记录和审计来积累这方面的经验。\n\
  \n## 验证你的知识\n\n- 如何检查查询的计划？\n  \n  专门的 `EXPLAIN` 命令允许你检查 PostgreSQL 将如何执行给定的查询，并为每个执行步骤显示一个“节点”。更多详情请参阅\
  \ *EXPLAIN 语句* 一节。\n  \n- `EXPLAIN` 和 `EXPLAIN ANALYZE` 之间有什么区别？\n  \n  `EXPLAIN`\
  \ 命令不会执行查询，只计算访问计划；另一方面，`EXPLAIN ANALYZE` 命令会执行查询并在输出中打印查询计划。更多详情请参阅 *EXPLAIN ANALYZE*\
  \ 一节。\n\n- PostgreSQL 如何保持统计信息最新？\n  \n  每次手动执行 `ANALYZE` 命令或 auto-vacuum（auto-analyze）守护进程对表运行时，统计信息都会更新。更多详情请参阅\
  \ *ANALYZE 以及如何更新统计信息* 一节。\n- PostgreSQL 如何选择使用特定的访问方法（例如索引）？\n  \n  优化器根据每种访问方法的成本来决定访问数据的路径：成本最低的方法获胜，并被用来访问底层数据。更多详情请参阅\
  \ *优化器* 一节。\n- 什么是 auto_explain 扩展？\n  \n  auto_explain 扩展允许系统在查询达到定义的门槛（例如执行时间超过预设限制）时，自动将查询执行计划输出到日志中。这使\
  \ DBA 能够自动获取有关问题查询的信息。更多详情请参阅 *Auto-explain* 一节。\n\n## 参考\n\n- PostgreSQL 官方文档之\
  \ CREATE INDEX：https://www.postgresql.org/docs/current/sql-createindex.html\n- PostgreSQL\
  \ 官方文档之 pg_stats：https://www.postgresql.org/docs/current/view-pg-stats.html\n- PostgreSQL\
  \ 官方文档之 EXPLAIN：https://www.postgresql.org/docs/current/using-explain.html\n- PostgreSQL\
  \ 官方文档之 ANALYZE：https://www.postgresql.org/docs/current/sql-analyze.html\n- Auto-explain\
  \ 官方文档：https://www.postgresql.org/docs/current/auto-explain.html\n\n\n\n\n\n## 在\
