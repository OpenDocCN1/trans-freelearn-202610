  \n## Contributors\n\n## About the authors\n\n**Luca Ferrari** has been passionate\
  \ about computer science since the Commodore 64 era, and today holds a master’s\
  \ degree (with honors) and a Ph.D. from the University of Modena and Reggio Emilia.\
  \ He has written several research papers, technical articles, and book chapters.\
  \ In 2011, he was named an adjunct professor by Nipissing University. An avid Unix\
  \ user, he is a strong advocate of open-source, and in his free time, he collaborates\
  \ on a few projects. He first encountered PostgreSQL back in the days of release\
  \ 7.3; he was a founder and former president of the **Italian PostgreSQL Users’\
  \ Group (ITPUG)**. He also talks regularly at technical conferences and events and\
  \ delivers professional training.\n\n**Enrico Pirozzi** has been passionate about\
  \ computer science since he was a 13-year-old. His first computer was a Commodore\
  \ 64, and today he holds a master’s degree from the University of Bologna. He has\
  \ participated as a speaker at national and international conferences on PostgreSQL.\
  \ He first encountered PostgreSQL back in release 7.2, he was a co-founder of the\
  \ first PostgreSQL Italian mailing list and the first Italian PostgreSQL website,\
  \ and he talks regularly at technical conferences and events and delivers professional\
  \ training. Right now, he is employed as a PostgreSQL database administrator at\
  \ Zucchetti Hospitality (Zucchetti Group S.p.a).\n\n## About the reviewers\n\n**Chris\
  \ Mair** holds a master’s degree from the University of Trento, Italy, and has been\
  \ freelance since 2003. His portfolio consists of contributions to over 25 companies,\
  \ including consultancy work on database programming, performance optimization,\
  \ and seamless migrations. Chris has expertise in system and network programming,\
  \ data processing, ML, and more. He has a particular affinity for PostgreSQL. He\
  \ has taught over 200 courses on various IT topics and is passionate about open-source\
  \ software.\n\n**Silvio Trancanella** is a software engineer with around 12 years\
  \ of experience in backend development, mainly using Java Enterprise and PostgreSQL.\
  \ He has always been fascinated by database management and was immediately drawn\
  \ to PostgreSQL from the very beginning of his career. He worked for about 10 years\
  \ on tourism industry software, developing and maintaining critical services that\
  \ relied on the PostgreSQL DBMS.\n\n## Learn more on Discord\n\nTo join the Discord\
  \ community for this book – where you can share feedback, ask questions to the author,\
