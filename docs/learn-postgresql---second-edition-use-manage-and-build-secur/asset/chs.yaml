  \ by Filter: 207464\nPlanning Time: 0.248 ms\nExecution Time: 30.043 ms\n(20 rows)\n\
  ```\n\n对于分区表，我们将有以下内容：\n\n```\nworld_temperatures=# explain analyze select extract\
