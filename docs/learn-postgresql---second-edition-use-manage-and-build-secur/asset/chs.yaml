  \n### 你可能喜欢的其他书籍 691\n\n### 索引 697\n\n## 本书适合谁\n\n本书适合任何想从零开始学习 PostgreSQL 数据库的人，或希望构建健壮、可扩展且高可用的数据库应用程序的人。本书将介绍\
  \ PostgreSQL 的所有最新和最酷的功能，以及数据库管理员或应用程序开发人员从 PostgreSQL 实例中获得最佳效果所需的所有概念。虽然不需要事先了解\
  \ PostgreSQL，但预计读者熟悉数据库和 SQL 语言。\n\n## 本书涵盖内容\n\n*第1章，PostgreSQL 简介，* 解释了 PostgreSQL\
  \ 数据库是什么、这个优秀且强大的企业级关系数据库背后的社区和开发情况，以及如何获取帮助和识别不同的 PostgreSQL 版本和依赖项。你还将学习如何通过二进制包或从源代码编译来获取和安装\
  \ PostgreSQL。你将看到如何使用操作系统工具（systemd 和 rc 脚本）管理集群。\n\n*第2章，了解你的集群，* 通过指定文件系统上的内容、主要配置文件的位置以及它们的使用方式，展示了\
  \ PostgreSQL 集群的解剖结构。psql 命令行实用程序的描述将帮助你连接到数据库集群并与其交互。\n\n*第3章，管理用户和连接，* 完整描述了正在运行的实例如何管理用户和连接，以及如何防止或限制用户连接。介绍了“角色”的概念，你将学习如何创建单个用户账户，以及相关用户组。\n\
  \n*第4章，基本语句，* 展示了如何创建和销毁主要数据库对象，例如数据库、表和模式。本章还涵盖了基本语句，例如 SELECT、INSERT、UPDATE 和\
  \ DELETE。本章展示了如何在 PostgreSQL 16 上管理 public 模式。\n\n*第5章，高级语句，* 介绍了 PostgreSQL 提供的高级语句，例如公用表表达式、MERGE、UPSERT\
  \ 以及带 RETURNING 行的查询。本章将提供何时以及如何使用它们的实用示例。\n\n\n\n\n第6章“窗口函数”介绍了一组强大的函数，这些函数提供聚合功能，而无需将结果折叠为单行。换句话说，借助窗口函数，你可以对多行（窗口）执行聚合，同时仍然在输出中呈现所有元组。窗口函数使得商业智能的实现成为可能，并让报表变得简单。\n\
  \n第7章“服务端编程”解决了这样一个事实：虽然 SQL 足以处理大多数日常数据库工作，但你可能最终会遇到需要命令式方法的特定问题。本章展示了如何在数据库中实现自己的代码，如何用不同语言编写函数和过程，以及如何让它们与事务边界交互。\n\
  \n第8章“触发器与规则”通过实际示例介绍了触发器和规则，展示了各自的优缺点。本章最后还提供了事件触发器的示例。\n\n第9章“分区”探讨了分区——将表拆分成更小的部分。PostgreSQL\
  \ 支持分区已有很长时间，但从版本 10 开始引入了所谓的“声明式分区”。本章重点介绍与声明式分区相关的所有特性、其调优参数，以及如何使用不同的表空间对表进行分区。\n\
  \n第10章“用户、角色与数据库安全”首先介绍了用户管理：角色、组和密码。你将学习如何限制用户只能访问特定数据库以及只能从特定机器访问，以及如何管理与用户和数据库对象关联的权限。然后你将看到行级安全性如何加固表内容，并防止用户检索或修改不属于他们的元组。\n\
  \n第11章“事务、MVCC、WAL 与检查点”介绍了 PostgreSQL 中的基本概念：预写日志（WAL）以及允许数据库运行并发事务并将数据整合到存储中的机制。本章还介绍了事务隔离的概念、ACID\
  \ 规则，以及数据库如何实现它们。接着，你将了解 WAL 如何加速数据库工作，同时又保护其免受崩溃影响。你将理解 MVCC 是什么以及它为何重要。最后，本章深入讲解了检查点及相关可调参数。\n\
  \n第12章“扩展数据库——扩展生态系统”介绍了一种便捷的方式，通过使用所谓的“扩展”为你的集群插入新功能。本章将展示什么是扩展；如何搜索、获取和安装第三方扩展；以及如何开发自己的扩展。\n\
  \n第13章“查询调优、索引与性能优化”讨论了任何数据库管理员都会关心的重要主题：性能。索引是帮助数据库访问最常用数据的快速方式，但由于维护成本，不能在一切对象上都建立索引。本章介绍可用的索引类型，然后解释如何识别可从索引中受益的表和查询，以及如何部署它们。借助\
  \ explain 和 autoexplain 等工具，你将能掌控查询。\n\n第14章“日志与审计”解答了诸如“数据库集群中正在发生什么？”以及“昨天发生了什么？”等问题。拥有良好的日志记录和审计规则集是管理数据库集群的关键所在。本章将介绍日志记录的主要选项、如何使用\
  \ pgBadger 等外部工具检查日志，以及如何审计你的集群（这有助于使其符合数据监管政策，例如 GDPR）。\n\n第15章“备份与恢复”解释了为何备份很重要，如何为整个集群或部分集群进行备份，以及如何从有效备份中恢复。本章介绍备份单个数据库或整个集群的基本且最常见的方法，以及如何执行归档和按时间点恢复。\n\
  \n第16章“配置与监控”介绍了集群配置选项以及用于从内部检查系统的 PostgreSQL 目录。将展示调整配置的不同方法。借助诸如 pg_stat_activity\
  \ 之类的特殊扩展，你将能够实时监控用户对数据库执行的操作。\n\n第17章“物理复制”涵盖了内置复制，这是一种允许你让多个实例保持运行并与单个主节点同步的机制，PostgreSQL\
  \ 自版本 9 起就支持该机制。复制支持可扩展性和冗余，也支持许多其他场景，例如测试和比较数据库。本章介绍所谓的“物理复制”，即在一个持续跟随其主节点的实例上完整复制整个集群的方式。将介绍异步复制和同步复制，以及复制槽和延迟复制。\n\
  \n第18章“逻辑复制”涵盖了逻辑复制，它允许非常细粒度的复制，可指定哪些表需要复制、哪些不需要——PostgreSQL 自版本 10 起支持该功能。当然，这为跨不同数据库实例的数据共享提供了全新的丰富场景。本章介绍逻辑复制的工作原理、如何设置以及如何监控复制。\n\
  \n第19章“实用工具与实用扩展”应被视为本书的附录。在本章中，我们将讨论一些工具和扩展，它们能让数据库管理员以最小的精力完成最多的工作。\n\n## 充分利用本书\n\
