- pgno: 185
  md: '# 8

    Playing Rock, Paper, or Scissors with Raspberry Pi Zero


    You''ve now built several projects with Raspberry Pi Zero. Now, you''ll take some
    of these capabilities and add it to a new project, such as the ability to see
    and determine what is going on around you using a USB webcam and an open source
    library called OpenCV. In this project, you''ll control a robotic hand to play
    the classic decision-making game; rock, paper, or scissors.


    In this chapter, you will build a basic robotic hand and then use it to play rock,
    paper, or scissors. In this chapter, you will learn:


    +   - How to use Raspberry Pi Zero to control servos that will control a robotic
    hand

    +   - How to add a USB webcam to the project to "see" the world around you

    +   - How to use OpenCV, an open source image processing library, to determine
    whether the human opponent is showing rock, paper, or scissors'
  merge: -1
