- pgno: 139
  md: '# 6

    Adding Voice Recognition and Speech – A Voice Activated Robot


    You''ve started with some pretty basic projects but you can take the concepts
    you have learned further by modifying robotic toys with the Raspberry Pi Zero.
    One class of toys that are excellent candidates for your projects are a set of
    robot toys by WowWee. You can purchase these toys from the company at http://wowwee.com/
    but you can also find used versions of these toys on eBay for a significantly
    lower price.


    In this chapter, you''ll learn the following:


    +   - How to break into the toy and provide the control signals for your project

    +   - How to send and receive voice commands to control the robot

    +   - How to interpret commands and initiate actions'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'There are several toys that have excellent possibilities. One such toy is the
    **WowWee Roboraptor**. The following picture shows this robot:


    ![](img/324d126a7e2da696837a3e066326bd61_140_0.png)


    Another option is the **WowWee Robosapien**. Here is a picture of this one:


    ![](img/324d126a7e2da696837a3e066326bd61_140_1.png)'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'We will use this robot for the project, as it has more functionality and is
    easier to modify.


    # Communication between the Raspberry Pi Zero and the robot


    You''re going to connect to the internal serial bus so that you, not the remote,
    can send commands. You''ll add an Arduino to handle real-time communication between
    the Raspberry Pi Zero and the robot. Here are the steps:


    +   1. Firstly, you need to disassemble the robot to get access to the main controller
    board. To do this, lay the robot face down so that you have access to the back.
    Remove the plate at the back by unscrewing the four screws that hold it in place.
    Now, at the top of the exposed board, you should see the main connector. The following
    image is a close-up photograph of the connector:


    ![](img/324d126a7e2da696837a3e066326bd61_141_0.png)


    There are only two wires that you are interested in. The first is the black wire,
    which is the GND for the Robosapien system. The second is the white wire. This
    is the serial connection that controls the command for the Robosapien.'
  merge: -1
  img_proc: true
- pgno: 142
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 143
  md: 'You may want to add some heat-shrink tubing to cover your connections.


    4. Finally, drill a hole in the back shell of the robot so that you can run both
    of these cables out of the unit, as shown in the following image:


    ![](img/324d126a7e2da696837a3e066326bd61_143_0.png)


    5. This picture also shows two more holes on either side of the shell, which you
    can use together with cable ties to attach the Raspberry Pi to the robot. Now
    you can put the shell back onto the robot.


    6. Now, you need to connect these two wires to the Arduino. There are several
    versions of the Arduino that work but the most common one is the Arduino Uno.
    If you use a different Arduino with a different time, the delay constant in the
    Arduino code may need adjusting. The reason that you need to use an Arduino is
    that the bit patterns that are sent to the robot are sent at a fairly high rate
    and need to be created by a processor dedicated to this type of real-time communication.
    This allows the Raspberry Pi Zero to perform other processor-intensive activities,
    such as speech, while keeping the communication flowing at the correct rate.'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'For specifics on how to use the development environment of the Arduino family
    of processors, visit https://www.arduino.cc. For information on how to use the
    Raspberry Pi to create and upload programs to the Arduino, refer to http://www.instructables.com/id/Arduino-On-Pi/
    or https://www.youtube.com/watch?v=wCxQrW96jTM.


    7. Connect the GND wire to one of the GND pins on the Arduino. Then, connect the
    other wire to pin 9 on the Arduino. These connections should look similar to the
    following picture:


    ![](img/324d126a7e2da696837a3e066326bd61_144_0.png)


    8. The final step is to get the code to send the correct commands to the Arduino
    board. The code for this book is available in the PacktPub code download section
    or at http://playground.arduino.cc/Main/RoboSapienIR. This Arduino code takes
    an input from the Serial Monitor, in this case a USB connection from the Raspberry
    Pi Zero and turns it into the appropriate command for the WowWee robot. Once you
    have uploaded the code to the Arduino, either by using an external PC or a Raspberry
    Pi Zero, you can use the Arduino IDE''s Serial Monitor capability to send individual
    letter commands and the robot should respond to these commands.'
  merge: -1
  img_proc: true
- pgno: 145
  md: '> If you are unfamiliar with the Arduino IDE application, Arduino is well documented
    at https://www.arduino.cc/ which includes instructions on how to upload the code
    and use the Serial Monitor to communicate with the Arduino.


    Now that the robot works, you can add the following Python program to send the
    commands:


    ![](img/324d126a7e2da696837a3e066326bd61_145_0.png)


    To run this program, type python argControl.py f and the robot will respond to
    that command. To make this program executable without the Python command, type
    chmod +x argControl.py and you will be able to run the program by typing ./argControl.py
    f. You''ll need this later when you want to run this program from your voice control
    program.


    # Giving your robot voice commands


    Now that your robot knows how to respond to the commands from the Python program,
    you can add the ability to your robot to respond to voice commands. You''ll also
    make your robot speak, which will make the robot more interactive.'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# Adding Voice Recognition and Speech – A Voice Activated Robot


    To add these capabilities to your robot, you need to add some new hardware. This
    project requires a USB microphone and speaker adapter. You need the following
    three pieces of hardware:


    +   - A USB device to be able to plug in a microphone and speaker; one that works
    well is Sabrent USB External Stereo Sound Adapter for Windows and Mac, as shown
    here:


    ![](img/324d126a7e2da696837a3e066326bd61_146_0.png)


    +   - A microphone that can plug into the USB device; any such device might work,
    like the one shown here:


    ![](img/324d126a7e2da696837a3e066326bd61_146_1.png)'
  merge: -1
  img_proc: true
- pgno: 147
  md: '+   - A powered speaker that can plug into the USB device; any device that
    can plug into your USB adapter would work, such as something similar to what is
    shown here:


    ![](img/324d126a7e2da696837a3e066326bd61_147_0.png)


    Fortunately, these devices are inexpensive and widely available. Make sure that
    the speaker is powered because your board will generally not be able to drive
    a passive speaker with enough power for your applications. The speaker can use
    either internal battery power or can get its power from a USB connection.


    Now, we move on to getting the Raspberry Pi Zero to access these devices. You
    can follow these instructions in either of the two following ways:


    +   - If you are still connected to the display, keyboard, and mouse, log in to
    the system and use the GUI by opening a terminal window

    +   - If you are only connected through LAN, you can do all this by using an SSH
    terminal window; as soon as your board indicates that it has power, open up an
    SSH terminal window using PuTTY or any similar terminal emulator'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'Plug the devices into a USB port. Once the terminal window comes up, type `cat
    /proc/asound/cards`. You will get the following response:


    ![](img/324d126a7e2da696837a3e066326bd61_148_0.png)


    There are two possible audio devices that you can use. The first is the internal
    Raspberry Pi audio, which is connected to the audio port, and the second is the
    USB audio plugin. You could use the USB audio plugin to record the sound and the
    Raspberry Pi for the audio output to play the sound, though it is easier to just
    use the USB audio plugin to create and record sound.


    Firstly, you need to play some music to test whether the USB sound device is working
    or not. You need to configure your system to search for your USB audio plugin
    and use it as the default plugin to play and record sound. To do this, you need
    to add a couple of libraries to your system. The first libraries are the **Advanced
    Linux Sound Architecture (ALSA)** libraries. These will enable the sound on the
    Raspberry Pi if you perform the following steps:


    +   1. Install two libraries that are associated with ALSA by typing `sudo apt-get
    install alsa-base alsa-utils`.

    +   2. Then, install those files that help to provide the sound library by typing
    `sudo apt-get install libasound2-dev`.'
  merge: -1
  img_proc: true
- pgno: 149
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 150
  md: '3. C-Media USB Audio Device is my USB audio device. You should now be able
    to see a screen that looks similar to the following screenshot:


    ![](img/324d126a7e2da696837a3e066326bd61_150_0.png)


    4. You can use the arrow keys to set the volume for both the speakers and the
    microphone. Use the M key to un-mute the microphone. In the preceding screenshot,
    MM is mute and oo is un-mute.


    5. Let''s make sure that our system knows about our USB sound device. At the command
    prompt, type `aplay -l`. You should now be able to see the following screenshot:


    ![](img/324d126a7e2da696837a3e066326bd61_150_1.png)'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'If this does not work, try `sudo aplay -l`. You need to add a file to your
    home directory called `.asoundrc`. This will be read by your system and used to
    set your default configuration. To do this, perform the following steps:


    +   1. Open the file named `.asoundrc` using the editor of your choice.

    +   2. Type `pcm.!default sysdefault:Set`. `Set` is the variable that appears
    right after `card 1:` in the output of the `aplay -l` command.

    +   3. Save the file. The file should appear as follows:


    ![](img/324d126a7e2da696837a3e066326bd61_151_0.png)


    This will tell the system to use your USB device as the default. Reboot your system.'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# Adding Voice Recognition and Speech – A Voice Activated Robot


    Now, you can play some music. To do this, you need a sound file and a device to
    play it. You can copy a simple .wav file to your Raspberry Pi Zero. If you are
    using a Linux machine as your host, you can also use the scp command from the
    command line to transfer the file. You can download music onto the Raspberry Pi
    Zero by using a web browser if you have a keyboard, mouse, and display connected.
    You use the application named **aplay** to play sound. Type `aplay Dance.wav`
    to see whether you can play music using the aplay music player. You will see the
    result (and hopefully hear it), as shown in the following screenshot:


    ![](img/324d126a7e2da696837a3e066326bd61_152_0.png)


    If you don''t hear any music, check the volume level on alsamixer and the speaker
    power cable; aplay can be a bit finicky about the types of file it accepts, so
    you may be required to try different .wav files until aplay accepts one. One more
    thing to try, if the system doesn''t seem to know about the program, is to type
    `sudo aplay Dance.wav`.


    Now that you can play sound, you can also record sound. To do this, you have to
    use the **arecord** program. At the prompt, type `arecord -d 5 -r 48000 test.wav`.
    This records the sound at a sample rate of 48000 Hz per 5 seconds. Once you have
    typed the command, either speak into the microphone or make some other recognizable
    sound. You will see the following output in the terminal:'
  merge: -1
  img_proc: true
- pgno: 153
  md: '![](img/324d126a7e2da696837a3e066326bd61_153_0.png)


    Once you have recorded some audio, stop the recording by pressing *Ctrl + C*.
    Once you have created the file, play it with aplay. Type `aplay test.wav` and
    you should be able to hear the recording. If you can''t hear your recording, check
    alsamixer to make sure that your speakers and microphone are both un-muted.


    Now you can play music or other sound files using your Raspberry Pi. You can change
    the volume of your speaker and record your voice or other sounds on the system.
    You''re now ready for the next step.


    # # Using eSpeak to allow your robot to respond with an audible voice


    Sound is an important tool in our robotic toolkit but you will want to do more
    than just play music. Let''s make our robot speak. You''re going to start by enabling
    **eSpeak**, an open source application that provides us with a computerized voice.
    It is a voice generation application. To get this free functionality, download
    the eSpeak library by typing `sudo apt-get install espeak` at the prompt. The
    download may take a while but the prompt will reappear when it is complete. Now,
    let''s see if The Raspberry Pi Zero has a voice. Type the `espeak hello` command.
    The speaker should emit "hello" in a computer-generated voice. If it does not,
    check the speakers and the volume level.'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'Now that we have a computer-generated voice, you may want to customize it.
    eSpeak offers a complete set of customization features, including a large number
    of languages, voices, and other options. To access these, you can type in the
    options at the command-line prompt. For example, type in `espeak -v +f3 hello`
    and you should be able to hear a female voice. You can even add a Scottish accent
    by typing `espeak -v en-sc +f3 hello`.


    There are a lot of choices with respect to the voices that you can use with eSpeak.
    This depends on your own preferences but you might like a female voice with an
    English accent. Feel free to play around and choose your favorite voice. Then,
    edit the default file to set it to this voice. This default file is in the home
    directory of eSpeak. However, don''t expect to get the kinds of voice that you
    hear from computers in the movies; those are actors and not computers. However,
    one day, we will hopefully reach a stage when computers will sound a lot more
    like real people.


    # ## Using pocketsphinx to accept your voice commands


    Now that your robot can talk, you''ll also want it to obey voice commands. This
    section shows you how to add speech recognition to your robotic projects. This
    isn''t nearly as simple as the speaking part but, thankfully, you have some significant
    help from the open source development community. You are going to download a set
    of capabilities named **pocketsphinx**, which will allow our project to listen
    to our commands.


    The first step is downloading the pocketsphinx software. Unfortunately, this is
    not quite as user-friendly as the eSpeak process, so follow these steps carefully.
    There are two ways to do this. If you have a keyboard, mouse, and display connected
    or want to connect through vncserver, you can do this graphically by performing
    the following steps:


    +   1. Go to the Sphinx website hosted by **Carnegie Mellon University (CMU)**
    at `http://cmusphinx.sourceforge.net`. This is an open source project that provides
    you with speech recognition software. With our smaller embedded system, we will
    use the pocketsphinx version of this code.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '+   2. You will need to download two pieces of software—**sphinxbase** and
    pocketsphinx. Select the **DOWNLOAD** option at the top of the page and then find
    the latest version of both of these packages. Download the `.tar.gz` versions
    of the packages and move them to the `/home/pi` directory of your Raspberry Pi.


    Another way to do this is to use **wget** directly from the command prompt of
    the Raspberry Pi. If you want to do it in this way, perform the following steps:


    +   1. To use wget on your host machine, find the link to the file that you wish
    to download. In this case, go to the Sphinx website hosted by CMU at `http://cmusphinx.sourceforge.net`.
    This is an open source project that provides you with the speech recognition software.
    With your smaller embedded system, you will use the pocketsphinx version of this
    code.


    +   2. You will need to download two pieces of software, namely sphinxbase and
    pocketsphinx. Select the **DOWNLOAD** option at the top of the page and then find
    the latest version of both these packages. Right-click on the `sphinxbase-0.8.tar.gz`
    file (as long as 0.8 is the latest version) and select **Copy link location**.
    Now open a PuTTY window in your Raspberry Pi and, after logging in, type `wget`
    and paste the link that you just copied. This will download the `.tar.gz` version
    of sphinxbase. Now, follow the same procedure for the latest version of pocketsphinx.


    Before you build these, you need another library. This library is called **Bison**.
    This is a general purpose, open source parser that is used by pocketsphinx. To
    get this package, type `sudo apt-get install bison`.'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'Once everything is downloaded and the libraries are installed, you can untar
    and build pocketsphinx. To unpack and build the sphinxbase module, type sudo tar
    -xzvf sphinxbase-0.y.tar.gz, where y is the version number, which in this example
    is 8. This should unpack all the files from the archive into a directory named
    sphinxbase-0.8. Now, type cd sphinxbase-0.8. The listing of the files should look
    something like the following screenshot:


    ![](img/324d126a7e2da696837a3e066326bd61_156_0.png)


    To build the application, start by issuing the sudo ./configure --enable-fixed
    command. This command checks whether or not everything is okay with the system
    and then configures a build.


    Now you are ready to build the sphinxbase codebase. This is a two-step process,
    which is as follows:


    +   1. Type sudo make and the system will build all the executable files.

    +   2. Type sudo make install to install all the executables onto the system.'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'Now, you need to make the second part of the system – the pocketsphinx code.
    Go to the home directory and decompress and unarchive the code by typing `tar
    -xzvf pocketsphinx-0.8.tar.gz`. Now, the files will be unarchived and you can
    build the code. Installing these files is a three-step process, as follows:


    +   1. Type `cd pocketsphinx-0.8` to go to the pocketsphinx directory and then
    type `sudo ./configure` to check whether or not you are ready to build the files.

    +   2. Type `sudo make` and wait for everything to build.

    +   3. Type `sudo make install`.


    > Other additions to our library installations will be useful later if you are
    going to use the pocketsphinx capability with Python as the coding language. You
    can install **Python-Dev** using `sudo apt-get install python-dev`. Similarly,
    you can get **Cython** using `sudo apt-get install cython`. You can also choose
    to install `pkg-config`, a utility that sometimes helps in dealing with complex
    compiles. Install it by using `sudo apt-get install pkg-config`.


    Once the installation is complete, you need to let the system know where your
    files are. To do this, use your favorite editor and change the `/etc/ld.so.conf`
    file by adding a line to the file so that it looks as follows:


    ![](img/324d126a7e2da696837a3e066326bd61_157_0.png)'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# Adding Voice Recognition and Speech – A Voice Activated Robot


    Type `sudo /sbin/ldconfig` and the system will be aware of your pocketsphinx libraries.
    Now that everything is installed, you can try out the speech recognition. Reboot
    the system and type `cd /home/pi/pocketsphinx-0.8/src/programs` to go to a directory
    to try a demo program. Then, type `./pocketsphinx_continuous`. For some reason,
    I had to type `sudo ./pocketsphinx_continuous`, allow it to fail, and then type
    `./pocketsphinx_continuous` to make it work. This program takes input from the
    microphone and turns it into speech. After running the command, you''ll get a
    lot of irrelevant information and then you will see the following screenshot:


    ![](img/324d126a7e2da696837a3e066326bd61_158_0.png)


    The INFO and Warning statements come from the C or C++ code and are there for
    debugging purposes. Initially, they will warn you that they cannot find your Mic
    and Capture elements but, when your Raspberry Pi finds them, it will print out
    `READY.....`. If you have set things up as described previously, you are ready
    to give your Raspberry Pi a command. Say "hello" into the microphone. When it
    senses that you have stopped speaking, it will process your speech and, after
    giving lots of irrelevant information, it will eventually show the commands, as
    shown in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 159
  md: '![](img/324d126a7e2da696837a3e066326bd61_159_0.png)


    Notice the `00000000: hello` command. It recognized your speech! You can try out
    other words and phrases too. The system is very sensitive so it may pick up background
    noise. You will also see that it is not very accurate. We''ll deal with this in
    a moment. To stop the program, press **Ctrl + C**.


    There are two ways to make your voice recognition more accurate. One is to train
    the system to understand your voice more accurately. This is rather complex but
    if you want to know more, go to the CMU pocketsphinx, website which was mentioned
    earlier in the chapter.


    The second way to improve accuracy is to limit the number of words that your system
    uses to determine what you are saying. The default has literally thousands of
    word possibilities, so pocketsphinx may choose the wrong word if the two words
    are similar in sound. To avoid this, you can make your own dictionary to restrict
    the words that pocketsphinx has to choose from. To create your own dictionary,
    follow the instructions at `http://cmusphinx.sourceforge.net/wiki/tutorialdict`.


    Your system can now understand your voice commands! In the next section of this
    chapter, you’ll learn how to use this input to create a response.'
  merge: -1
  img_proc: true
- pgno: 160
  md: '# Interpreting commands and initiating actions


    Now that the system can both hear and speak, you''ll want to provide the robot
    with the ability to respond to your speech and execute commands based on the speech
    input. Next, you''re going to configure the system to respond to simple commands.


    In order to respond, we''re going to edit the continuous.c code in the /home/pi/src/programs
    directory. We could create our own C file but this file is already set up in the
    make system and is an excellent starting point. You can save a copy of the current
    file as continuous.c.old so that you can always go back to the starting program
    if required. Then, you need to edit the continuous.c file. It is very long and
    a bit complicated. However, you are looking for a specific section in the code,
    which is shown in the following screenshot. Look for the /* Exit if the first
    word spoken was GOODBYE */ comment line:


    ![](img/324d126a7e2da696837a3e066326bd61_160_0.png)'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'In this section of the code, the word has already been decoded and is held
    in the hyp variable. You can add the code here in order to make your system do
    things based on the value associated with the word that we decoded. Firstly, let''s
    try to add the ability to respond to hello and goodbye commands to see whether
    or not we can get the program to respond to these commands. You need to make changes
    to the code in the following manner:


    +   1. Find the /* Exit if the first word spoken was GOODBYE */ comment

    +   2. In the statement if (strcmp(word, "goodbye") == 0), change word to hyp
    and goodbye

    +   3. Insert brackets around the break; statement and add the system("espeak
    \"good bye\\\"" ); statement just before the break; statement

    +   4. Add the other else if statement to the clause by typing else if (strcmp(hyp,
    "hello") == 0). Add brackets after the else if statement and, inside the brackets,
    type system("espeak \"hello\\\"" );


    The file should now look as follows:


    ![](img/324d126a7e2da696837a3e066326bd61_161_0.png)'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# Adding Voice Recognition and Speech – A Voice Activated Robot


    Now you need to rebuild your code. As the make system already knows how to build
    the pocketsphinx_continuous program, it will rebuild the application if you make
    a change to the continuous.c file at any point. Simply type sudo make and the
    file will compile and create a new version of pocketsphinx_continuous. To run
    your new version, type ./pocketsphinx_continuous. Make sure that you type ./ at
    the start. Again, I had to type sudo ./pocketsphinx_continuous, allow it to fail,
    and then type ./pocketsphinx_continuous to make it work.


    If everything was set up correctly, saying "hello" should result in a response
    of "hello" from your Raspberry Pi. Saying "goodbye" should elicit a response of
    "goodbye" and also shut down the program. Note that the system command can be
    used to run any program that runs from a command line. Now you can use this program
    to start and run other programs based on the commands. In this case, you need
    to change the code shown to call your Python code to issue the commands to the
    robot, as shown in the following screenshot:


    ![](img/324d126a7e2da696837a3e066326bd61_162_0.png)


    In this case, you hook up only two of the very many commands that your robot can
    respond to; you can add the rest of the commands to your continuous.c file by
    using the same technique. Now, you can give your robot voice commands and it will
    obey them! Using the directions from the earlier section of this chapter, you
    can also control your robot remotely using single character commands and add a
    webcam. You have your very own robotic servant!'
  merge: -1
  img_proc: true
