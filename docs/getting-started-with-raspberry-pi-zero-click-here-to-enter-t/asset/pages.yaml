  md: '# The while statement


    Another useful construct is the while construct; it allows us to execute a set
    of statements over and over again until a specific condition has been met. The
    following screenshot shows a set of code that uses this construct:


    ![](img/324d126a7e2da696837a3e066326bd61_61_0.png)


    The following are the details of the code shown in the previous screenshot:


    +   - `#!/usr/bin/python`: This is included so you can make your program executable.

    +   - `a = 0`: This line sets the value of variable a to 0. We''ll need this only
    to make sure that we execute the loop at least once.

    +   - `b = 1`: This line sets the value of the variable b to 1. We''ll need this
    only to make sure that we execute the loop at least once.

    +   - `while a != b:`: The expression a != b (in this case, != means not equal
    to) is verified. If it is True, the indented statements are executed. When the
    statement is evaluated as False, the program jumps to the statements (none in
    this example) after the indented section.

    +   - `a = input("Input value: ")`: The data will be input by the user and stored
    in a.

    +   - `b = input("Input second value: ")`: This data will also be input by the
    user and stored in b.

    +   - `c = a + b`: The variable c is loaded with the sum of a and b.

    +   - `print c`: The print command prints out the value of c.'
