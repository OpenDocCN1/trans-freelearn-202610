- pgno: 93
  md: '# 4


    # Building and Controlling a Simple Wheeled Robot


    You should now be familiar with how to program your Raspberry Pi Zero and how
    to communicate with the outside world with the GPIO. Now, let''s actually build
    a mobile project. Perhaps the easiest way to make your projects mobile is to use
    a wheeled platform. In this chapter, you will be introduced to some of the basics
    of manipulating DC motors and using the Raspberry Pi Zero to control the speed
    and direction of your wheeled platform.


    In this chapter, you will learn how to perform the following actions:


    +   - Using the Raspberry Pi Zero GPIO to control a DC motor

    +   - Controlling your mobile platform programmatically using the Raspberry Pi
    Zero

    +   - Implementing some simple path planning algorithms on the Raspberry Pi Zero


    # The basic platform


    You''ll need to add some hardware, specifically a wheeled or tracked platform,
    to make your project mobile. You''re going to use a platform that uses differential
    motion to propel and steer the vehicle. This simply means that, instead of turning
    the wheels, you''re going to vary the speed and direction of the two motors that
    drive the wheels or tracks. There are a lot of choices. Some come fully assembled
    while others require some assembly; alternatively you can buy the components and
    build your own custom mobile platform.'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'Let''s look at a couple of the more popular units that come fully assembled
    or can be assembled with simple tools (a screwdriver or pliers). The simplest
    mobile platform is one that has two DC motors, with each motor controlling a single
    wheel. On the wheeled platform, there is a small wheel or ball in the front or
    at the back. Here is one example of a wheeled platform, available at many online
    electronics retailers:


    ![](img/324d126a7e2da696837a3e066326bd61_94_0.png)


    Here is another simple wheeled platform, also sold by many online electronics
    retailers:


    ![](img/324d126a7e2da696837a3e066326bd61_94_1.png)'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'This one also needs to be assembled but it is fairly straightforward. You could
    also choose a tracked platform instead of a wheeled platform. A tracked platform
    has more traction but is not as nimble, as it takes a longer distance to turn.
    Again, manufacturers make pre-assembled units. The following image is an example
    of a pre-assembled tracked platform made by Dagu. It''s called the Dagu Rover
    5 Tracked Chassis:


    ![](img/324d126a7e2da696837a3e066326bd61_95_0.png)


    As part of the platform, you''ll need a mobile power supply for the Raspberry
    Pi Zero and your vehicle. I personally like the external 5V rechargeable cell
    phone batteries which are available at almost any place that sells cell phones.
    These batteries can be charged using a USB cable connected either through a DC
    power supply or directly from a computer USB port, as shown in the following image:


    ![](img/324d126a7e2da696837a3e066326bd61_95_1.png)


    You''ll also need a USB cable to connect your battery to the Raspberry Pi Zero.
    Now that you have the basic platform, you''re ready to start controlling it with
    the Raspberry Pi Zero.'
  merge: -1
