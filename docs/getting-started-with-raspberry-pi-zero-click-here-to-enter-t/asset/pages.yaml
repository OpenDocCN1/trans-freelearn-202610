- pgno: 46
  md: '# Getting Started with Raspberry Pi Zero


    Your system has lots of capabilities. Feel free to play around with the system
    – try to get an understanding of what is already there and what you''ll need to
    add from a software perspective. Remember, there is limited power on your USB
    port, so make sure that you are familiar with the power needs of accessories plugged
    into your Raspberry Pi. You may very well need to use a powered USB hub for many
    projects.


    # Summary


    Congratulations! You''ve completed the first stage of your journey. You have your
    Raspberry Pi Zero up and working. No gathering dust in the bin for this piece
    of hardware. It is now ready to start connecting to all sorts of interesting devices,
    in all sorts of interesting ways. You have, by now, installed a Raspbian operating
    system, learned how to connect all the appropriate peripherals, and even mastered
    how to access the system remotely so that the only connections you need are a
    power supply cable and a LAN cable.


    Now, you are ready to start commanding your Raspberry Pi Zero to do something.
    The next chapter will introduce you to the Linux operating system and the Emacs
    text editor. It will also show you some basic programming concepts in both open
    Python and C/C++ programming languages. Then, you''ll be ready to add open source
    software to inexpensive hardware and start building your robotics projects.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# 2

    Programming Raspberry Pi Zero


    Now that your system is up and running, your Raspberry Pi Zero is ready to do
    something. This will require you to either create your own programs or edit someone
    else''s programs. In this chapter, you''ll learn how to edit a file to create
    a program that can run on Raspberry Pi Zero.


    In this chapter, we will cover the following topics:


    +   - Basic Linux commands and navigating the filesystem on Raspberry Pi Zero

    +   - Creating, editing, and saving files on Raspberry Pi Zero

    +   - Creating and running Python programs on Raspberry Pi Zero

    +   - Some of the basic programming constructs in Python on Raspberry Pi Zero


    You can create and run the programs discussed in this chapter by connecting a
    keyboard, a mouse, and a monitor to Raspberry Pi Zero, or remotely logging in
    using vncserver or SSH.


    # Powering up Raspberry Pi Zero with Linux


    After completing the tasks discussed in Chapter 1, Getting Started with Raspberry
    Pi Zero, you''ll have a working Raspberry Pi Zero that is running a version of
    Linux called Raspbian. So, power up your Raspberry Pi Zero and log in using a
    valid username and password. If you are going to log in remotely through SSH or
    vncserver, go ahead and establish the connection now. First, you''ll take a quick
    tour of Linux. This will not be extensive, but you will just walk through some
    of the basic commands.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Programming Raspberry Pi Zero


    Once you have logged in, open up a terminal window. If you are logging in using
    a keyboard, mouse, and monitor, or using vncserver, you''ll find the terminal
    by selecting the Terminal application on icon set selection at the top of the
    screen, as shown in the following screenshot:


    ![](img/324d126a7e2da696837a3e066326bd61_48_0.png)


    If you are using SSH, you will already be in the terminal emulator program. Either
    way, the terminal should look something similar to the following screenshot:


    ![](img/324d126a7e2da696837a3e066326bd61_48_1.png)'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'Your cursor is at the Command Prompt. Unlike Microsoft Windows or Mac''s OS,
    with Linux, most of our work will be done by actually typing commands in the command
    line. So, let''s try a few commands. When you type ls, you should be able to see
    the result similar to the following screenshot:


    ![](img/324d126a7e2da696837a3e066326bd61_49_0.png)


    In Linux, the ls command lists all the files and directories in our current directory.
    You can tell the different file types and directories apart because they are normally
    in different colors. You can also use ls -l to see more information about the
    files.'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'You can move around the directory structure by issuing the cd (change directory)
    command. For example, if you want to see what is in the Desktop directory, type
    cd Desktop. If you issue the ls command now, you should see something similar
    to the following screenshot:


    ![](img/324d126a7e2da696837a3e066326bd61_50_0.png)


    This directory is empty; it doesn''t have any files. The cd command changes the
    directory. You could have typed cd /home/pi/Desktop and received exactly the same
    result; this is because you were in the /home/pi directory, which is the directory
    where you always start when you first log in to the system.'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'If you ever want to see which directory you are in, simply type pwd, which
    stands for present working directory. If you do that, you will get the result,
    which is similar to the following screenshot:


    ![](img/324d126a7e2da696837a3e066326bd61_51_0.png)


    The result of running the pwd command is /home/pi/Desktop. Now, you can use two
    different shortcuts to navigate back to the default directory. The first is to
    type cd .. on the terminal; this will take you to the directory just above the
    current directory in the hierarchy. Then type pwd; you should see the following
    screenshot as a result:


    ![](img/324d126a7e2da696837a3e066326bd61_51_1.png)'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'The other way to get back to the home directory is by typing `cd ~`; this will
    always return you to your home directory. You can also type `cd` to return to
    your home directory. If you were to do this from the Desktop directory and then
    type `pwd`, you would see the following screenshot as the result:


    ![](img/324d126a7e2da696837a3e066326bd61_52_0.png)


    You can go to a specific directory using its entire pathname. In this case, if
    you want to go to the `/home/pi/Desktop` directory from anywhere in the filesystem,
    simply type `cd /home/pi/Desktop`.


    There are a number of other Linux commands that you might find useful as you program.
    The following is a table with some of the most useful commands:


    | Linux commands | What it does |

    |---|---|

    | `ls` | This command lists all the files and directories in the current directory
    by just their names. |

    | `rm filename` | This command deletes the file specified by `filename`. |

    | `mv filename1 filename2` | This command renames `filename1` to `filename2`.
    |'
  merge: -1
  img_proc: true
- pgno: 53
  md: '| Linux commands | What it does |

    |---|---|

    | cp filename1 filename2 | This command copies `filename1` to `filename2`. |

    | mkdir directoryname | This command creates a directory with the name specified
    by `directoryname`; this will be made in the current directory unless specified
    otherwise. |

    | clear | This command clears the current terminal window. |

    | sudo | If you type the `sudo` command at the beginning of any command, it will
    execute that command as the super user. This may be required if the command or
    program you are trying to execute needs the permission of the super user. If,
    at any point, you type a command or the name of the program you want to run and
    the result seems to suggest that the command does not exist or that permission
    is denied, try doing it again with `sudo` at the beginning. |


    Now, you can play around with the commands and look at your system and the files
    that are available to you. But, be careful! Linux is not like Windows; the default
    behavior is to not warn you if you try to delete or replace a file.


    # Creating, editing, and saving files


    Now that you can log in and move easily between directories and see your files,
    you''ll want to be able to edit those files. To do this, you''ll need a program
    that allows you to edit the characters in a file. If you are used to working on
    Microsoft Windows, you have probably used programs such as Microsoft Notepad,
    WordPad, or Word to do this. These programs are not available in Linux. There
    are several other choices for editors, all of which are free. In this chapter,
    you will use an editing program called Emacs. Other possibilities are programs
    such as nano, vi, vim, and gedit. Programmers have strong feelings about which
    editor to use, so if you already have a favorite, you can skip this section.


    > If you want to use nano as an editor, it is already available on the Raspbian
    distribution. For more information on nano, see http://www.nano-editor.org/.


    ![](img/324d126a7e2da696837a3e066326bd61_53_0.png)'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'If you want to use Emacs, download and install it by typing `sudo apt-get install
    emacs`. Once installed, you can run Emacs simply by typing `emacs filename`, where
    `filename` is the name of the file you want to edit. If the file does not exist,
    Emacs will create it. The following screenshot shows what you will see if you
    type `emacs example.py` on the prompt:


    ![](img/324d126a7e2da696837a3e066326bd61_54_0.png)


    Note that, unlike Windows, Linux doesn''t automatically assign file extensions;
    it is up to you to specify the kind of file you want to create. The Emacs editor
    also indicates, in the lower-left corner of the screen, that you have opened a
    new file. Now, if you are using Emacs in the Raspbian GUI interface, either because
    you have a monitor, keyboard, and mouse hooked up or because you are running vncserver,
    you can use the mouse in much the same way as you do in Microsoft Word.


    However, if you are running Emacs from SSH, you won''t have the mouse available.
    So you''ll need to navigate the file using the cursor keys. You''ll also have
    to use some keystroke commands to save your file, as well as accomplish a number
    of other tasks that you would normally use the mouse to select. For example, when
    you are ready to save the file, you must press Ctrl + X and Ctrl + S and that
    will save the file under the current filename. When you want to quit Emacs, you
    must press Ctrl + X and Ctrl + C. This will stop Emacs and return you to the Command
    Prompt.'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'The following are some Emacs keystroke commands that you might find useful:


    | Emacs commands | What it does |

    |---|---|

    | Ctrl + X and Ctrl + S | Save: This command saves the current file. |

    | Ctrl + X and Ctrl + C | Quit: This command makes you exit Emacs and return to
    the command prompt. |

    | Ctrl + K | Kill: This command erases the current line. |

    | Ctrl + _ | Undo: This command undoes the last action. |

    | Left-click on the text you wish to copy, then place the cursor cursor at the
    place you want to paste then right-click | Cut and paste: If you select the text
    you want to paste by clicking the mouse, move the cursor to where you want to
    paste the code and then right-click on it; the code will be pasted in that location.
    |


    Now that you have the capability to edit files, you''ll use this capability to
    create programs in the next section.


    # Creating and running Python programs


    Now that you are ready to begin programming, you''ll need to choose a language.
    There are many available, such as C, C++, Java, Python, Perl, and a great deal
    of other possibilities. I''m going to initially introduce you to Python for two
    reasons: it is a simple language that is intuitive and very easy to use, and it
    uses a lot of the open source functionality of the robotics world. We''ll also
    cover a bit of C/C++ in this chapter, as some features are only available in C/C++.
    However, it makes sense to start with Python. To work through the examples in
    this section, you''ll need a version of Python installed. Fortunately, the basic
    Raspbian system has one already, so you are ready to begin.


    We are only going to cover some of the very basic concepts here. If you are new
    to programming, there are a number of different websites that provide interactive
    tutorials. If you''d like to practice some of the basic programming concepts in
    Python using these tutorials, visit https://www.codeacademy.com or http://www.learnpython.org/
    or https://docs.python.org and give it a try.'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'In this section, we''ll cover how to create and run a Python file. It turns
    out that Python can be used interactively, so you can type in the commands one
    at a time. Using it interactively is extremely helpful when you are getting acquainted
    with the language features and modules. But you want to use Python to create programs,
    so you are going to type in your commands using Emacs and then run them in the
    command line by invoking Python. Let''s get started.


    Open an example Python file by typing emacs example.py. Now, let''s put some code
    in the file. Start with the code shown in the following screenshot:


    ![](img/324d126a7e2da696837a3e066326bd61_56_0.png)


    Let''s go through the code to see what is happening. The code lines are as follows:


    +   - a = input("Input value: "): One of the basic purposes of a program is to
    get input from the user; input allows us to do that. The data will be input by
    the user and stored in a. The prompt Input value: will be shown to the user.

    +   - b = input("Input second value: "): This data will also be input by the user
    and stored in b. The prompt Input second value: will be shown to the user.

    +   - c = a + b: This is an example of something you can do with the data; in
    this example, you can add a and b.

    +   - print c: Another basic purpose of our program is to print out results. The
