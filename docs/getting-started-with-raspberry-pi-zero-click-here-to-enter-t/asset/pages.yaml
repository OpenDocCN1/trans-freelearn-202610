- pgno: 201
  md: 'You may want to play with the resolution to find the optimum settings for your
    application. Big images are great—they give you a more detailed view of the world—but
    they also take up significantly more processing power. You''ll play with this
    resolution more as you actually ask your system to do some real image processing.
    Be careful if you are going to use vncserver to understand your system performance,
    as this will significantly slow down the update rate. An image that is twice the
    size (width/height) will involve four times more processing. You can now use this
    capability to do a number of impressive tasks.


    # Gesture detection


    OpenCV and your webcam can also track objects. This will be useful as you want
    your project to differentiate your hand from the background. OpenCV makes this
    amazingly simple by providing some high-level libraries that can help us with
    this task. To accomplish this, you''ll edit a file to look something similar to
