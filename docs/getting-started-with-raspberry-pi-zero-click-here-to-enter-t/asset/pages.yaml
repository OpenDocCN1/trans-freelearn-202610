- pgno: 207
  md: '# 9

    Adding Raspberry Pi Zero to

    a Quadcopter


    You''ve had the opportunity to build lots of different types of robot, so now
    let''s end with the one that can be truly amazing, a robot that can fly.


    > Before we start, there are a number of safety warnings to be considered. Of
    course, never fly near people or buildings. Also, be very careful about flying
    outside your viewing range. In many countries, there are restrictions on where
    and when you can fly a quadcopter. Some countries, including the United States,
    require you to register your quadcopter.


    It is also important to note that this chapter is not designed to be a complete
    step-by-step guide to the construction of a quadcopter for flying. That would
    take many chapters. This chapter is designed to get you started if you consider
    building a quadcopter that can be controlled using the Raspberry Pi Zero. In this
    chapter, you''ll learn about the following topics:


    +   - Building the basic quadcopter platform

    +   - Interfacing Raspberry Pi Zero with the flight controller

    +   - Discussing long-range communications

    +   - Using GPS for location

    +   - Adding autonomous flight'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# Constructing the platform


    Constructing the quadcopter hardware can be daunting; however, there are several
    excellent websites that can lead you through the process, from component selection
    to build details and programming and controlling your quadcopter with a radio.
    The http://www.arducopter.co.uk/ website is a great place to start for those who
    are new to quadcopter flight. Go to http://copter.ardupilot.com/, which is another
    excellent website with lots of information.


    For this project, you''ll want to choose a project that uses the **Pixhawk** flight
    controller. There are other flight controllers that are significantly less expensive,
    but this particular flight controller provides easy access for Raspberry Pi Zero.
    Here are some possible websites that can guide you through the construction process:
    http://learnrobotix.com/uavs/quadcopter-build/pixhawk/connecting-the-q-brain-esc.html,
    http://learnrobotix.com/uavs/quadcopter-build/pixhawk/connecting-components-pixhawk-flight-controller.html,
    and http://www.flying-drone.co.uk/how-to-build-a-quadcopter-with-a-pixhawk-flight-controller-step-11/.


    At http://copter.ardupilot.com/wiki/advanced-pixhawk-quadcopter-wiring-chart/,
    you''ll find an excellent wiring diagram of how to hook everything up. Let''s
    go through the steps of constructing our own quadcopter.


    First, you''ll need a frame. You''ll be building a quadcopter of size 450 mm,
    one of the least expensive frames, which is available from most online retailers,
    with fiberglass arms, as shown in the following image:


    ![](img/324d126a7e2da696837a3e066326bd61_208_0.png)'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'Now, perform the following steps to complete your quadcopter assembly:


    +   1. The first step is to build the quadcopter as the instructions suggest.

    +   2. The second step is to solder the four **Electronic Speed Controllers (ESCs)**,
    one to each motor, and the battery connection to the bottom plate. Here is an
    image of the bottom plate:


    ![](img/324d126a7e2da696837a3e066326bd61_209_0.png)


    Note the + and - connections; each connection will be soldered to all the ESCs.
    The following is an image of the motor controller:


    ![](img/324d126a7e2da696837a3e066326bd61_209_1.png)'
  merge: -1
  img_proc: true
- pgno: 210
  md: '# Adding Raspberry Pi Zero to a Quadcopter


    The red and black wire connectors are the connectors that are soldered to the
    bottom plate of the frame. The other three connectors will connect to the motor.


    +   3. The third step is to install the motors on the frame. You''ll need motors
    that are in the 1000 KV range, here is an image of such a motor:


    ![](img/324d126a7e2da696837a3e066326bd61_210_0.png)


    Again, follow the instructions that came with your frame to attach the motor.
    Then attach the three connections that come from the ESC to the motor.


    +   4. One optional step is to add a landing gear set to the unit. There are many
    of these available; the following is an image of one that is very sturdy:


    ![](img/324d126a7e2da696837a3e066326bd61_210_1.png)'
  merge: -1
  img_proc: true
- pgno: 211
  md: '+   5. Now you''ll install Pixhawk on the frame and connect its associated
    electronics. The details are shown and described at http://copter.ardupilot.com/wiki/advanced-pixhawk-quadcopter-wiring-chart/.
    This will connect the Pixhawk to the ESCs, the battery, an RC transmitter, a telemetry
    radio, and a switch that will prevent the quadcopter from flying until you are
    ready.

    +   6. Eventually, you will install four propellers on the quadcopter; however,
    you will have to wait until you have calibrated the ESCs, motors, and RC transmitter
    to install them. You''ll need four propellers, two that are designed to spin clockwise
    and another two that are designed to spin counter-clockwise. For this quadcopter,
    you''ll want propellers that are 10x4.7 pitches. Here is an image of one such
    propeller:


    ![](img/324d126a7e2da696837a3e066326bd61_211_0.png)'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'The following is an image of the entire quadcopter using the Pixhawk flight
    controller:


    ![](img/324d126a7e2da696837a3e066326bd61_212_0.png)


    > Note the arrows and cords arranged on the quadcopter. This is not to make it
    look menacing but to protect it from running into something and fracturing the
    propellers. There are commercial guards available; however, this system also works
    and is less expensive.


    You''ll want to build your quadcopter and fly it with an RC transmitter/receiver
    pair; this will allow you to get familiar with your quadcopter and how it flies,
    and it will also allow you to tweak all the settings to stabilize it. Once your
    quadcopter is stable, you can perform some simple autonomous flights. Let''s use
    the mission planning software, which runs on a remote computer.


    # Mission planning software


    The mission planning software is available at http://planner.ardupilot.com/. There
    are actually two applications available that perform similar actions, but the
    Mission Planner is a good place to get familiar with how to talk with your quadcopter
    from a computer program.


    To do this, you''ll need to make sure that you have telemetry radios connected
    to the Pixhawk and the computer. This will prevent the need to directly connect
    to the Pixhawk with a long USB cable. When you begin the mission planning software,
    you will see the following screen:'
  merge: -1
  img_proc: true
- pgno: 213
  md: '![](img/324d126a7e2da696837a3e066326bd61_213_0.png)


    This is the basic screen. You''ll then need to configure your radio''s COM port
    and then press the CONNECT button in the corner on the upper right-hand side of
    the screen. As you move the quadcopter around, you will see the measurements change.
    If you are having problems connecting to the Pixhawk, there is lot of help available
    on the website.


    Now that you have connected, you can actually see how your quadcopter is flying
    with this application. The software communicates with the Pixhawk controller via
    the MAVLink, a serial control link that comes from the software application, goes
    out over the telemetry radio, is received by the telemetry radio, and is then
    routed to the Pixhawk. The Pixhawk not only knows how to send information, but
    also receive information.


    Once the software is connected, you''ll want to calibrate the RC radio connection;
    this can be done through the software. You''ll also want to calibrate the ESCs;
    refer to http://learnrobotix.com/uavs/quadocopter-build/pixhawk/calibrating-electronic-speed-controllers-with-pixhawk.html
    for specific directions.'
  merge: -1
  img_proc: true
