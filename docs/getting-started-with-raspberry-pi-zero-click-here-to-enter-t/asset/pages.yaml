  md: '# Playing Rock, Paper, or Scissors with Raspberry Pi Zero


    The following screen is the measure of your hand for paper:


    ![](img/324d126a7e2da696837a3e066326bd61_204_0.png)


    You can add some simple code to determine if your hand is making a rock, paper,
    or scissors using the ratios of *x* and *y*. In the preceding picture, you can
    see that the ratio of width to height is roughly 140/80 for paper. For a rock,
    the ratio is going to be roughly 85/55. For scissors, it is going to be 140/40.
    Here is the code for the library that determines a rock/paper/or scissors:'
  merge: -1
