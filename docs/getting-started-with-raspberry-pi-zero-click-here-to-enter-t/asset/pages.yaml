- pgno: 111
  md: "Now that you have the basic code to drive your tracked vehicle, you can modify\
    \ it so that each action is contained in a function. In that way, you can call\
    \ these functions from another Python program. You also need to add calibrated\
    \ movement so that your tracked vehicle is able to turn at a certain angle and\
    \ move forwards a set distance. The following example is what the code should\
    \ look like:\n\n```\nimport RPi.GPIO as GPIO\nimport time\nfrom rrb2 import *\n\
    \nrr = RRB2()\n\ndef init_vehicle():\n    rr.set_led1(1)\n\ndef turn_left(angle):\n\
    \    rr.set_motors(1, 1, 1, 0)\n    time.sleep(angle/20)\n    rr.set_motors(0,\
    \ 0, 0, 0)\n\ndef turn_right(angle):\n    rr.set_motors(1, 0, 1, 1)\n    time.sleep(angle/20)\n\
    \    rr.set_motors(0, 0, 0, 0)\n\ndef forward(value):\n    rr.set_motors(1, 1,\
    \ 1, 1)\n    time.sleep(value)\n    rr.set_motors(0, 0, 0, 0)\n\ndef backward(value):\n\
    \    rr.set_motors(1, 0, 1, 0)\n    time.sleep(value)\n    rr.set_motors(0, 0,\
    \ 0, 0)\n\ndef stop():\n    rr.set_motors(0, 0, 0, 0)\n\ndef cleanup():\n    GPIO.cleanup()\n\
    ```\n\nThe time.sleep(angle/20) command in the turn_right(angle) and turn_left(angle)\
    \ functions allows the tracked vehicle to move for the right amount of time so\
    \ that the vehicle moves through the desired angle. You may need to modify this\
    \ number to get the correct angle of movement. The time.sleep(value) command moves\
    \ the robot for a specific amount of time, based on the number given in the value."
  merge: -1
  img_proc: true
- pgno: 112
  md: 'If you have chosen to use the RasPiRobot Board V2 you can also use its special
    connections and libraries to connect the HC-SR04 sonar sensor. Here is a picture
    of the special connector on the board:


    ![](img/324d126a7e2da696837a3e066326bd61_112_0.png)


    To use this connector, simply connect the VCC to the 5V, the Trig to the T connection,
    the Echo to the E connector, and the GND to the GND connection. You can then use
    the library for the motor controller board and simply call the function rr.get_distance().
    Similarly, there is also a special connector and libraries for the I2C interface,
    if you want to add the compass to your mobile project.


    # Planning your path


    Now that you have a wheeled or tracked vehicle, you may want to do some basic
    path planning. To do this, you need a framework to understand where your robot
    is and determine the location of the goal. One of the most common frameworks is
    an x-y grid. The following diagram is an example of this type of grid:'
  merge: -1
  img_proc: true
- pgno: 113
  md: '![](img/324d126a7e2da696837a3e066326bd61_113_0.png)


    There are three key points on this grid that you need to understand. Here is an
    explanation of them:


    +   - The lower left point is a fixed reference position. The directions x and
    y are also fixed and all other positions are measured in relation to this position
    and these directions. Each unit is measured with regards to how far the unit travels
    in time in a single unit.

    +   - Another important point is the starting location of your robot. Your robot
    will then keep track of its location using its x and y coordinates, the position
    with respect to some fixed reference position in the x direction, or the position
    with respect to some fixed reference position in the y direction to the goal.
    It uses the compass to keep track of these directions.

    +   - The third important point is the position of the goal, also given in the
    x and y coordinates with respect to the fixed reference position. If you know
    the starting location and angle of your robot, you can plan an optimum (the shortest
    distance) path to this goal. To do this, you can use the goal location, the robot
    location and some fairly simple math to calculate the distance and angle from
    the robot to the goal.'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'To calculate the distance, use the following equation:


    d = √((Xgoal − Xgoal)² + (Ygoal − Yrobot)²)


    You use this equation to tell your robot how far to travel to reach the goal.
    A second equation tells your robot the angle at which it needs to travel:


    θ = arctan((Ygoal − Yrobot) / (Xgoal − Xrobot))


    > If you''d like a tutorial on the basic math of path planning, see https://www.khanacademy.org/math/trigonometry/trigonometry-right-triangles.


    Here is the graphical representation of these two pieces of information:


    ![](img/324d126a7e2da696837a3e066326bd61_114_0.png)


    Now that you have a goal angle and distance, you can program your robot to move.
    To do this, you need to write a program to do the path planning and call the movement
    functions that you created earlier in the chapter. You need to know the distance
    that your robot will travel in a certain period of time so that you can tell your
    robot in time units, rather than distance units, how far to travel.


    You also need to be able to translate the distance that might be covered by your
    robot in each time unit that you run the motor. If you know the angle and distance,
    you can move your robot towards the goal by turning the robot and then running
    it forward for a certain time.'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'Here are the steps that you need to follow:


    +   1. Calculate the distance in units that your robot will travel to reach its
    goal. Convert this into a number of time units to realize this distance.

    +   2. Calculate the angle at which your robot will need to travel to reach its
    goal. You need to use the compass and your robot''s turn functions to turn and
    achieve this angle.

    +   3. Now, call the step function a specified number of times to move your robot
    in the correct distance.


    That''s it. Now you can use some very simple Python code to execute these steps
    using the functions to move the robot forwards and turn it. In this case, it makes
    sense to create a file called robotLib.py with all the functions that do the actual
    servo settings to move the wheeled robot forwards and turn the robot. You then
    import these functions using the from robotLib import * statement so that your
    Python program can call these functions. This makes the path planning Python program
    much smaller and more manageable.


    For more information on how to import functions from one Python file to another,
    refer to http://www.tutorialspoint.com/python/python_modules.htm.


    Here is a screenshot of the program:


    ![](img/324d126a7e2da696837a3e066326bd61_115_0.png)'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# Building and Controlling a Simple Wheeled Robot


    In this program, the user determines the goal location and the robot decides on
    the shortest direction to the desired location by reading the angle. To make it
    simple, the robot is positioned in the grid, heading in the direction of an angle
    of 0 degrees. If the goal angle were less than 180 degrees, the robot would turn
    right. If it were greater than 180 degrees, the robot would turn left. The robot
    turns until the desired angle and the measured angle are within a few degrees
    of each other. Then, the robot takes the number of steps to reach the goal. As
    an additional challenge, you could add a loop to measure the actual angle and
    stop it when it reaches the target angle.


    # # Summary


    This chapter provided you with an opportunity to create a mobile platform for
    your Raspberry Pi Zero. You can add the sonar sensor or the compass from *Chapter
    3, Accessing the GPIO Pins on Raspberry Pi Zero* to give it even more functionality.
    In the next chapter, you''ll learn how to build a Raspberry Pi Zero platform robot
    with legs, an even more flexible mobile platform.'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# 5


    # Building a Robot

    That Can Walk


    Now that you are familiar with robots that can navigate using tracks or wheels,
    let''s build one that can walk. Walking robots are interesting as they can navigate
    the terrain where wheeled or tracked vehicles can''t go. They also provide advanced
    functions where the robot can use their legs for purposes other than walking.


    In this chapter, you will build the basic quadruped platform. To do this you will
    learn:


    +   - How servos work

    +   - How to use the Raspberry Pi to control lots of servos using a servo controller

    +   - Creating complex movements out of simple servo commands


    # Robots that can walk


    In this chapter, you''ll build a quadruped robots. You''ll be using 12 servos
    so that each leg has three points that can move, or three Degrees of Freedom (DOF).
    In this project, you''ll control 12 servos at the same time; so it makes sense
    to use an external servo controller that can supply the control signals and supply
    voltages for all 12 servos. Since servos are the main component of this project,
    it will perhaps be useful to go through a tutorial on servos and learn how to
    control them.'
  merge: -1
  img_proc: true
- pgno: 118
  md: '# How servo motors work


    Servo motors are similar to DC motors; however, there is an important difference.
    While DC motors are generally designed to move in a continuous way – rotating
    360 degrees at a given speed – servos are generally designed to move in a limited
    set of angles. In other words, in the DC motor world, you generally want your
    motors to spin with a continuous rotation speed that you control. In the servo
    world, you want your motor to move to a specific position that you control. This
    is done by sending a Pulse-Width-Modulated (PWM) signal on the control connector
    of the servo. PWM simply means that you are going to change the length of each
    pulse of electrical energy in order to control something. In this case, the length
    of this pulse will control the angle of the servo, as shown:


    ![](img/324d126a7e2da696837a3e066326bd61_118_0.png)


    These pulses are sent out with a repetition rate of 60 Hz. You can position the
    servo at any angle by setting the correct control pulse.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# Building the quadruped platform


    You''ll first need some parts, so you can build your quadruped robot. There are
    several kit possibilities out there, including at http://www.trossenrobotics.com/p/PhantomX-AX-12-Quadruped.aspx.
    However, such kits can be expensive; so for this example, you''ll create your
    own kit using a set of Lynxmotion parts. These are available with several on-line
    retailers, such as http://www.robotshop.com/. To build this quadruped, you''ll
    need two sets each of the two leg parts and then one set each of a body. Here
    are the parts with their Robotshop part number:


    | Quantity | Description |

    |---|---|

    | 1 | Lynxmotion Symmetric Quadrapod Body Kit - Mini QBK-02 |

    | 2 | Lynxmotion 3" Aluminum Femur Pair |

    | 2 | Lynxmotion Robot Leg "A" Pair (No Servo) RL-01 |

    | 4 | Lynxmotion Aluminum Multipurpose Servo Bracket Two Pack ASB-04 |

    | 2 | Ball Bearing with Flange - 3mm ID (pair)

    Product Code: RB-Lyn-317 |


    The last part is not a Lynxmotion part but a bearing that you''ll need to connect
    the legs to the body.


    You''ll also need 12 standard-size servos. There are several possible choices,
    but I personally like the Hitec servos. They are very inexpensive servos that
    you can get at most hobby shops and on-line electronics retailers. Now its time
    to get to know some details about the selection of the model of servo. Servos
    come in different model numbers, primarily based on the amount of torque they
    can generate.


    **Torque** is the force that the servo can exert to move the part connected to
    it. In this case, your servos will need to lift and move the weight associated
    with your quadruped, so you''ll need a servo with enough torque to do this. In
    this case, I suggest you use eight model HS-485HB servos. You''ll use these for
    the servos attached to the end of the leg and for the body. Then you''ll use four
    model HS-645MG servos for the middle of the leg; this is the servo that will require
    the highest amount of torque. You can also just use twelve HS-645MG servos, but
    they are more expensive than the HS-485, so using the two different servos will
    be less expensive.'
  merge: -1
  img_proc: true
