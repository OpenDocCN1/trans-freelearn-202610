- pgno: 36
  md: '# Getting Started with Raspberry Pi Zero


    When you click on **Open**, the system will try to open a terminal window onto
    your Raspberry Pi through the LAN connection. The first time you do this, you
    will get a warning about an RSA key as the two computers don''t know about each
    other. Windows therefore complains that a computer that it doesn''t know is about
    to be connected in a fairly intimate way. Simply click on **OK** and you should
    get a terminal with a login prompt, like the following screenshot:


    ![](img/324d126a7e2da696837a3e066326bd61_36_0.png)


    Now you can log in and issue commands to your Raspberry Pi Zero. If you''d like
    to do this from a Linux machine, the process is even simpler. Bring up a terminal
    window and then type `ssh pi@xxx.xxx.xxx.xxx` where the `xxx.xxx.xxx.xxx` is the
    `inet addr` of your device. This will then bring you to the login screen of your
    Raspberry Pi Zero, which should look similar to the preceding screenshot.


    **SSH** is a really useful tool to communicate with your Raspberry Pi Zero. However,
    sometimes you need a graphical look at your system and you don''t necessarily
    want to connect to a display. You can get this on your remote computer by using
    an application called **vncserver**. You''ll need to install a version of this
    on your Raspberry Pi Zero by typing `sudo apt-get install tightvncserver` in a
    terminal window on your Raspberry Pi Zero. This is a perfect opportunity to use
    SSH, by the way.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '**Tightvncserver** is an application that allows you to view your complete
    Raspberry Pi Zero remotely. Once you have it installed, you need to start the
    server by typing `vncserver` in a terminal window on the Raspberry Pi Zero. You
    will then be prompted for a password, then be prompted to verify the password,
    and then asked if you''d like to have a view-only password. Remember the password
    that you entered, you''ll need it to log in via a VNC Viewer remotely.


    You need a VNC Viewer application for your remote computer. On my Windows system,
    I use an application called **RealVNC**. When I start the application, it gives
    me the following screenshot:


    ![](img/324d126a7e2da696837a3e066326bd61_37_0.png)


    Enter the **VNC Server** address, which is the IP address of your Raspberry Pi
    Zero, and click on **Connect**. You will see a pop-up window, as shown in the
    following screenshot:


    ![](img/324d126a7e2da696837a3e066326bd61_37_1.png)'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# Getting Started with Raspberry Pi Zero


    Type in the password that you just entered while starting vncserver and you should
    then get a graphical view of your Raspberry Pi that looks like the following screenshot:


    ![](img/324d126a7e2da696837a3e066326bd61_38_0.png)


    You can now access all of the capabilities of your system, although they may be
    slower if you are doing a graphics-intense data transfer.


    > There are ways to make vncserver start automatically on boot. I have not used
    them; I prefer to type the vncserver command from an SSH application when I want
    the application running. This keeps your running applications to a minimum and,
    more importantly, presents fewer security risks. If you want to start yours each
    time you boot, there are several places on the Internet that show you how to configure
    this. Try the following website: http://www.havetheknowhow.com/Configure-the-server/Run-VNC-on-boot.html.'
  merge: -1
  img_proc: true
