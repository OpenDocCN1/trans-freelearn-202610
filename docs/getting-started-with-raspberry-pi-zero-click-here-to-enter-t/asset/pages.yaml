    |---|---|

    | 0 | Thumb |

    | 1 | Index finger |

    | 2 | Middle finger |

    | 3 | Ring finger |

    | 4 | Little finger |

    | 5 | Wrist |


    Here is an image of the back of the controller; this will tell us where to connect
