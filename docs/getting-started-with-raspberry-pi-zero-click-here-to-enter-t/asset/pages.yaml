- pgno: 131
  md: 'Let''s now talk to the motor controller by downloading the Linux code from
    Pololu at www.pololu.com/docs/0J40/3.b:


    +   1. Perhaps the best way is to log on to your Raspberry Pi Zero through PuTTY,
    then type wget http://www.pololu.com/file/download/maestro-linux-100507.tar.gz?file_id=0J315.

    +   2. Then, move the file using mv maestro-linux-100507.tar.gz?file_id=0J315
    maestro-linux-100507.tar.gz.

    +   3. Unpack the file by typing tar -xzfv maestro-linux-100507.tar.gz.

    +   4. This will create a directory called maestro_linux. Go to that directory
    by typing cd maestro_linux and then type ls -l; you should see something similar
    to this:


    ![](img/324d126a7e2da696837a3e066326bd61_131_0.png)


    The document README.txt will give you explicit instructions on how to install
