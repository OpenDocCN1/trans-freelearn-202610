- pgno: 134
  md: '# Creating a program in Linux to control your quadruped


    You now know that you can talk to your servo motor controller and move your servos.
    In this section, you''ll create a Python program that will let you talk to your
    servos to move them to specific angles.


    Let''s start with a simple program that will make your legged mobile robot''s
    servos go to 90 degrees (which should be somewhere close to the middle of the
    0 to 180 degrees you can set.) To access the serial port, you''ll need to make
    sure that you have the Python serial library. If you don''t, then type sudo apt-get
    install python-serial. After you have installed the serial library, you can run
    your program by typing sudo python quad.py.


    This particular controller uses two bytes of information, so the code in the setAngle
    function will translate the input of the channel and angle into numbers that the
    controller can understand. For more specifics, see http://www.pololu.com/docs/0J40.
    Here is the code:


    ![](img/324d126a7e2da696837a3e066326bd61_134_0.png)


    Here is an explanation of the code:


    +   - #!/usr/bin/python: This first line allows you to execute this Python file
    from the command line.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '+   - `import serial`: This line imports the `serial` library. You need the
    `serial` library to talk to your unit via USB.

    +   - `def setAngle(ser, channel, angle)`: This function converts your desired
    setting for servo and angle into the serial command that the servo motor controller
    needs.

    +   - `ser = serial.Serial("/dev/ttyACM0", 9600)`: This opens the serial port
    connection to your servo controller.

    +   - `for i in range(0, 12)`: This `for` loop will access each servo.

    +   - `setAngle(ser, i, 90)`: Now, you can set each servo to the middle (home)
    position. The default would be to set each servo to 90 degrees. If your legs aren''t
    in their middle position, you can adjust them by adjusting the position of the
    servo horns on each servo.


    Once you have the basic home position set, you can now ask your robot to do things.
    Let''s start by making your quadruped wave. Here is the Python code:


    ![](img/324d126a7e2da696837a3e066326bd61_135_0.png)'
  merge: -1
  img_proc: true
- pgno: 136
  md: "In this case, you are using the setAngle command to set your servos to manipulate\
    \ your robot's front-right arm. The middle servo raises the arm and the lower\
    \ survey then goes back and forth between angle 100 and 130 degrees.\n\nOne of\
    \ the most basic actions you'll want your robot to take is to walk forward. Here\
    \ is an example of how to manipulate the legs to make this happen:\n\n```\nser\
    \ = serial.Serial(\"/dev/ttyACM0\", 9600)\n# Home position\nfor i in range(0,\
    \ 12):\n    setAngle(ser, i, 90)\n\nsetAngle(ser, 4, 110)\ntime.sleep(1)\nsetAngle(ser,\
    \ 5, 100)\ntime.sleep(1)\nsetAngle(ser, 4, 90)\ntime.sleep(1)\n\nsetAngle(ser,\
    \ 7, 70)\ntime.sleep(1)\nsetAngle(ser, 8, 80)\ntime.sleep(1)\nsetAngle(ser, 7,\
    \ 90)\ntime.sleep(1)\n\nsetAngle(ser, 1, 110)\ntime.sleep(1)\nsetAngle(ser, 2,\
    \ 100)\ntime.sleep(1)\nsetAngle(ser, 1, 90)\ntime.sleep(1)\n\nsetAngle(ser, 10,\
    \ 70)\ntime.sleep(1)\nsetAngle(ser, 11, 80)\ntime.sleep(1)\nsetAngle(ser, 10,\
    \ 90)\ntime.sleep(1)\n\nfor i in range(0, 12):\n    setAngle(ser, i, 90)\n\nser.close()\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 137
  md: 'This program lifts and then moves each leg forward, one at a time, then moves
    all the legs to the home position, which moves the robot forward. Not the most
    elegant, but it does work. There are more sophisticated algorithms for walking
    with your quadruped; see http://letsmakerobots.com/node/35354 and https://www.youtube.com/watch?v=jWP3RnYa_tw.
    Once you have the program working, you''ll want to package all your hardware onto
    the mobile robot.


    You can make your robot do many amazing things, such as walk forward, walk backward,
    dance, and turn around; any number of movements are possible. The best way to
    learn is to try new and different positions with the servos.


    # Summary


    You now have a robot that can walk! You can also add other sensors, such as the
    ones you discovered for your wheeled robot, sensors that can watch for barriers,
    or others that know the direction you are moving in.


    In the next chapter, you''ll start on a new robot. You''ll combine a Raspberry
    Pi Zero with a toy robot and construct a project with the ability to speak and
    respond to voice commands.'
  merge: -1
  img_proc: true
