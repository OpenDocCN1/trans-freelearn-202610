- pgno: 100
  md: 'Perform the following steps to create this program:


    To create this program, create a directory called dcmotor in your home directory
    by typing mkdir dcmotor and then type cd dcmotor. Now, open the file by typing
    emacs dcmotor.py (if you are using a different editor, open a new file with the
    dcmotor.py name).


    Now, enter the program. Let''s go through the program step by step:


    +   - #!/usr/bin/python: This line lets you run the program without having to
    type python before the filename. You''ll learn how to do this at the end of these
    instructions.

    +   - import RPi.GPIO as io: This lets you import the RPi library, which allows
    you to control the GPIO pins.

    +   - io.setmode(io.BCM): This sets the specification mode of the GPIO pins to
    Broadcom SOC channel (BCM) number. This means that you will specify the GPIO numbers
    of the pins you want to control instead of the actual physical pin values.

    +   - in1_pin1 = 27: This assigns the value 27 to the in1_pin1 variable.

    +   - in2_pin1 = 22: This assigns the value 22 to the in1_pin1 variable.

    +   - in1_pin2 = 20: This assigns the value 20 to the in1_pin1 variable.

    +   - in2_pin2 = 21: This assigns the value 21 to the in1_pin1 variable.

    +   - io.setup(in1_pin1, io.OUT): This sets GPIO pin 27 to an output control.

    +   - io.setup(in2_pin1, io.OUT): This sets GPIO pin 22 to an output control.

    +   - io.setup(in1_pin2, io.OUT): This sets GPIO pin 20 to an output control.

    +   - io.setup(in2_pin2, io.OUT): This sets GPIO pin 21 to an output control.

    +   - def forward(): This defines the forward function. You have to turn on GPIO
    27 and GPIO 20 and turn off GPIO 22 and GPIO 21.

    +   - io.output(in1_pin1, True): Output a 3.3 volt signal on in1_pin1 (this is
    GPIO 27).

    +   - io.output(in2_pin1, False): Output 0 volts on in2_pin1 (this is GPIO 22).

    +   - io.output(in1_pin2, True): Output a high voltage on in1_pin2 (this is GPIO
    20).'
  merge: -1
  img_proc: true
- pgno: 101
  md: '+   - `io.output(in2_pin2, False)`: Output 0 volts on in2_pin2 (this is GPIO
    21).

    +   - `def reverse()`: This defines the reverse function. You''ll turn on GPIO
    22 and GPIO 21, and turn off GPIO 27 and GPIO 20.

    +   - `io.output(in1_pin1, False)`: Output 0 volts on in1_pin1 (this is GPIO 27).

    +   - `io.output(in2_pin1, True)`: Output a high voltage on in2_pin1 (this is
    GPIO 22).

    +   - `io.output(in1_pin2, False)`: Output 0 volts on in1_pin2 (this is GPIO 20).

    +   - `io.output(in2_pin2, True)`: Output a high voltage on in2_pin2 (this is
    GPIO 21).

    +   - `def stop()`: This defines the stop function. You set the level to 0 on
    the pins off GPIO 22, GPIO 21, GPIO 27, and GPIO 20.

    +   - `io.output(in1_pin1, False)`: Output 0 volts on in1_pin1 (this is GPIO 27).

    +   - `io.output(in2_pin1, False)`: Output 0 volts on in2_pin1 (this is GPIO 22).

    +   - `io.output(in1_pin2, False)`: Output 0 volts on in1_pin2 (this is GPIO 20).

    +   - `io.output(in2_pin2, False)`: Output 0 volts on in2_pin2 (this is GPIO 21).

    +   - `while True`: This performs loops over and over. You can stop the program
    by pressing Ctrl + C.

    +   - `cmd = raw_input("Enter f (forward) or r (reverse) or s (stop): ")`: Enter
    a character for what you want the robot to do.

    +   - `direction = cmd[0]`: Take only the first character of the input.

    +   - `if direction == "f"`: If the direction is "f", then execute the next statement.

    +   - `forward()`: Execute the forward function.

    +   - `if direction == "r"`: If the direction is "f", then execute the next statement.

    +   - `reverse()`: Execute the reverse function.

    +   - `if direction == "s"`: If the direction is "f", then execute the next statement.

    +   - `stop()`: Execute the stop function.'
  merge: -1
  img_proc: true
