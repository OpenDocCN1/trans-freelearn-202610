  md: '![](img/324d126a7e2da696837a3e066326bd61_103_0.png)


    The following is an explanation of the lines of code that you just added:


    +   - io.setup(in2_pin1, io.OUT): This sets GPIO 27 to an output.

    +   - p1 = io.PWM(in1_pin1, 50): Instead of just on or off settings, this PWM
    setting allows the programmer to set the relative width of the pulse. This initializes
