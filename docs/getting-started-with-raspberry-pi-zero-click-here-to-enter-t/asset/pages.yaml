- pgno: 133
  md: '![](img/324d126a7e2da696837a3e066326bd61_133_0.png)


    Note that you can send a servo a specific target angle, although the target is
    not in degrees of angle values so it makes it a bit difficult to know where you
    are sending your servo.


    Try typing ./UscCmd --servo 0, 10. The servo will move to its full angle position.


    Type ./UscCmd - servo 0, 0 and it will stop the servo from trying to move.


    In the next section, you''ll write some Python code that will translate your angles
    into commands that the servo controller will want to move it to specific angle
    locations.


    > If you didn''t run the Windows version of Maestro Controller and set the Serial
