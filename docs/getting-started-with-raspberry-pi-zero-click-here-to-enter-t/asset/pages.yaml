- pgno: 130
  md: '# # Connecting the servo controller to the Raspberry Pi Zero


    You''ve checked the servo motor controller and the servos; you''ll now connect
    the motor controller to the Raspberry Pi Zero and make sure that you can control
    the servos from it. Remove the USB cable from the PC and connect it to the Raspberry
    Pi Zero. The entire system will look similar to the following image:


    ![](img/324d126a7e2da696837a3e066326bd61_130_0.png)


    The Raspberry Pi Zero is in the middle, the motor controller is to the right,
    and the powered hub to the left. The alligator clips below are connected to a
    power supply; eventually you''ll want to connect these to a battery.'
