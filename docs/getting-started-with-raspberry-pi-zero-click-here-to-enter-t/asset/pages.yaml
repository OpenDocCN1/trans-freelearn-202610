- pgno: 80
  md: "Now that the device is connected, you'll need a bit of code to read in the\
    \ value, make sure it is settled (it produces a stable measurement), and then\
    \ convert it to distance.\n\n# Raspberry Pi Zero and the sonar sensor code\n\n\
    Here is Python code to communicate with the sonar sensor:\n\n```\n#!/usr/bin/python\n\
    import RPi.GPIO as io\nimport time\n\nio.setmode(io.BCM)\n\ntrig = 23\necho =\
    \ 24\n\nio.setup(trig,io.OUT)\nio.setup(echo,io.IN)\n\nio.setup(trig, False)\n\
    time.sleep(1)\nio.output(trig, True)\ntime.sleep(.00001)\nio.output(trig, False)\n\
    \nwhile io.input(echo) == 0:\n    start = time.time()\n\nwhile io.input(echo)\
    \ == 1:\n    end = time.time()\n\nduration = end - start\ndistance = duration\
    \ * 17150\ndistance = round(distance, 2)\nprint \"Distance: \", distance, \" cm\"\
    \nio.cleanup()\n```\n\nHere is an explanation of the code:\n\n+   - #!/usr/bin/python:\
    \ This line lets you run this program without having to type python before the\
    \ filename. You'll learn how to do this at the end of these instructions."
  merge: -1
  img_proc: true
- pgno: 81
  md: '+   - `import RPi.GPIO as io`: This lets you import the RPi library, which
    will allow you to control the GPIO pins.

    +   - `import time`: The time library provides several time-based functions. In
    this case, you''ll use it to pause the program for a known amount of time and
    also measure a certain time delay.

    +   - `io.setmode(io.BCM)`: This sets the specification mode of the GPIO pins
    to Broadcom SOC channel number (BCM). This means you will specify the GPIO numbers
    of the pins you want to control, instead of the actual physical pin values.

    +   - `trig = 23`: This assigns the value 23 to the trig variable.

    +   - `echo = 24`: This assigns the value 24 to the echo variable.

    +   - `io.setup(trig, io.OUT)`: This sets the GPIO pin 23 to an output.

    +   - `io.setup(echo, io.IN)`: This sets the GPIO pin 24 to an input.

    +   - `io.setup(trig, False)`: This will output a zero to the trig line, pin 23.

    +   - `time.sleep(1)`: This command will cause the program to pause for one second.

    +   - `io.output(trig, True)`: This will output a one, 5 volts, to the trig line,
    pin 23.

    +   - `time.sleep(.00001)`: This will cause the program to wait approximately
    10 microseconds.

    +   - `io.output(trig, False)`: This will output a zero to the trig line, pin
    23.

    +   - `while io.input(echo) == 0:`: While the input to pin 24 is zero.

    +   - `start = time.time()`: Reset the start time continuously. When pin 24 goes
    high, start will hold the latest time that the value of pin 24 was low.

    +   - `while io.input(echo) == 1:`: Do the following set of commands while the
    input pin 24 is 1.

    +   - `end = time.time()`: Resets the end time continuously. When pin 24 goes
    low, end will hold the latest time that the value of pin 24 was high.

    +   - `duration = end - start`: Duration will now hold the time distance between
    the end and start time.

    +   - `distance = duration * 17150`: Distance converts the duration to a distance
    value.

    +   - `distance = round(distance, 2)`: Round the distance to two decimal places.

    +   - `print "Distance: ", distance, " cm"`: Print out the distance.

    +   - `io.cleanup()`: Reset the interface.'
  merge: -1
  img_proc: true
- pgno: 82
