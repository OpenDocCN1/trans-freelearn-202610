- pgno: 123
  md: '![](img/324d126a7e2da696837a3e066326bd61_123_0.png)


    Now that you have the basic hardware assembled, you can turn your attention to
    the electronics.


    # Using a servo controller to control the servos


    To make your quadruped walk, you first need to connect the servo motor controller
    to the servos. The servo controller you are going to use for this project is a
    simple servo motor controller using USB from Pololu: Pololu item number 1354,
    available at https://www.pololu.com/, which can control 18 servo motors. Here
    is an image of the unit:


    ![](img/324d126a7e2da696837a3e066326bd61_123_1.png)'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'Make sure you order the assembled version. This piece of hardware will turn
    the USB commands from the Raspberry Pi Zero into signals that control your servo
    motors. Pololu makes a number of different versions of this controller; each version
    can control a certain number of servos. In this case, you may want to choose the
    18-servo version, so you can control all 12 servos with one controller and also
    add an additional servo to control the direction of a camera or sensor; you can
    also choose the 12-servo version. One advantage of the 18-servo controller is
    the ease of connecting power to the unit via screw-type connectors.


    There are two connections that you''ll need to make to the servo controller to
    get started: the first to the servo motors, the second to a battery.


    First, connect the servos to the controller. In order to be consistent, let''s
    connect your 12 servos to the connections marked 0 through 11 on the controller
    using the following configuration:


    | Servo connector | Servo |

    |---|---|

    | 0 | Right front lower leg |

    | 1 | Right front middle leg |

    | 2 | Right front upper leg |

    | 3 | Right rear lower leg |

    | 4 | Right rear middle leg |

    | 5 | Right rear upper leg |

    | 6 | Left front lower leg |

    | 7 | Left front middle leg |

    | 8 | Left front upper leg |

    | 9 | Left rear lower leg |

    | 10 | Left rear middle leg |

    | 11 | Left rear upper leg |


    Here is an image of the back of the controller; this will tell us where to connect
    our servos:'
  merge: -1
  img_proc: true
- pgno: 125
  md: '![](img/324d126a7e2da696837a3e066326bd61_125_0.png)


    Now you need to connect the servo motor controller to your battery. For this project,
    you can use a 2S RC LiPo battery. The 2S means that the battery will have two
    cells, with an output voltage of 7.2 volts. It will supply the voltage and current
    needed by your servos, which can be in the order of 2 amps, as shown in the following
    image:


    ![](img/324d126a7e2da696837a3e066326bd61_125_1.png)'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'This battery will come with two connectors, one with larger gauge wires for
    normal usage and a smaller connector to connect to the battery recharger. You''ll
    want to build connectors that can connect to the screw-type connectors of the
    servo controller. I purchased a few XT60 connector pairs and soldered some wires
    to the mating connector of the battery and then screwed these into the servo controller.


    Your system is now functional. Now you''ll connect the motor controller to your
    personal computer to check whether you can communicate with it. To do this, connect
    a mini USB cable to the servo controller and your personal computer. I''ll detail
    the directions with a PC, but you can also do this step with a Mac or Linux. You
    can find the details at https://www.pololu.com/docs/0J40.


    # Communicating between the servo controller and a PC


    Now that the hardware is connected, you can use some software provided by Pololu
    to control the servos. Let''s do this using your personal computer. First, download
    the Pololu software from www.pololu.com/docs/0J40/3.a and install it based on
    the instructions on the website. Once it is installed, run the software and you
    should be able to see this screen:


    ![](img/324d126a7e2da696837a3e066326bd61_126_0.png)'
  merge: -1
  img_proc: true
