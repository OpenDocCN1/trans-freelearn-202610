  md: '# Controlling your mobile platform programmatically using the Raspberry Pi
    Zero


    Now that you have your basic motor controller functionality up and running, you
    need to connect both motor controllers to the Raspberry Pi Zero. This section
    will cover this and also show you how to control your entire platform programmatically.


    You are going to use Python in your initial attempts to control the motor. It
    is very straightforward to code, run, and debug your code in Python. The first
    Python program you are going to create is shown in the following screenshot:


    ![](img/324d126a7e2da696837a3e066326bd61_99_0.png)'
