- pgno: 110
  md: "The second part of the code that drives the two different motors, based on\
    \ whether you want to go forwards, backwards, or turn right or left, is as follows:\n\
    \n```\nwhile var != 'q':\n    var = getch()\n    if var == 'l':\n        speed1\
    \ = 1\n        direction1 = 1\n        speed2 = 1\n        direction2 = 0\n  \
    \      stop = 1\n    if var == 'r':\n        speed1 = 1\n        direction1 =\
    \ 0\n        speed2 = 1\n        direction2 = 1\n        stop = 1\n    if var\
    \ == 'f':\n        speed1 = 1\n        direction1 = 1\n        speed2 = 1\n  \
    \      direction2 = 1\n        stop = 0\n    if var == 'b':\n        speed1 =\
    \ 1\n        direction1 = 0\n        speed2 = 1\n        direction2 = 0\n    \
    \    stop = 0\n    if var == 's':\n        speed1 = 0\n        direction1 = 0\n\
    \        speed2 = 0\n        direction2 = 0\n    rr.set_motors(speed1, direction1,\
    \ speed2, direction2)\n    if stop == 1:\n        time.sleep(1)\n        rr.set_motors(0,\
    \ 0, 0, 0)\nGPIO.cleanup()\n```\n\nThe rr.set_motors() function allows you to\
    \ specify the speed and direction of each motor independently. This program takes\
    \ in a single character and then sends a command to the motors. f moves the vehicle\
    \ forward, b moves it backward, l turns it left, r turns it right, and s stops\
    \ the vehicle."
