- pgno: 195
  md: 'Here is an explanation of the code:


    +   - `#!/usr/bin/python`: This first line allows you to make this Python file
    execute from the command line.

    +   - `import serial`: This line imports the serial library. You need the serial
    library to talk to your unit via USB.

    +   - `def setAngle(ser, channel, angle)`: This function converts your desired
    setting of servo and angle into the serial command that the servo motor controller
    needs.

    +   - `ser = serial.Serial("/dev/ttyACM0", 9600)`: This opens the serial port
    connection to your servo controller.

    +   - `for i in range(0, 12)`: For each of the servos

    +   - `setAngle(ser, i, 90)`: Now you can set each servo to the middle position.
    This should open your fingers half way. If your hand isn''t in the middle position,
    you can adjust it by adjusting the position of the servo horns on each servo.


    To access the serial port, you''ll need to make sure that you have the Python
    serial library. If you don''t, then type `sudo apt-get install python-serial`.
    After you have installed the serial library, you can run your program by typing
    `sudo python hand.py`.


    Once you know the angle to set the servo at the middle angle position, the settings
    for the angle for each servo that opens or closes the hand will be roughly 20
    degrees on either side. Finally, you can now ask your hand to close the servos
    for the thumb, ring finger, and little finger, which will be the scissors hand.
    You''ll want a Python function for each of the three different positions. In this
    case, you can use your `setAngle` command to set your servos to manipulate your
    hand''s six servos to either do paper (everything open), rock (everything closed),
    or scissors (two fingers extended, the rest closed).


    Since each of these is a function, this code also has the ability to be included
    in a library so that they can be used in your system with the webcam.'
  merge: -1
  img_proc: true
