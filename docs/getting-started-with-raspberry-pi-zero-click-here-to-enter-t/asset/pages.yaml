- pgno: 186
  md: '# # A robotic hand


    In this chapter, you''ll build a human hand that has four fingers, a thumb, and
    a rotating wrist. There are actually several possible robotic hand configurations
    that you can purchase or build yourself. If you''d like to purchase an already
    3D printed hand, my personal favorite is the hand that was designed by Christopher
    Chappelle and Easton LaChappelle, available already 3D printed at http://www.shapeways.com/product/Z5CZ2RKLY/3d-printed-hand-right?li=search-results-1&optionId=42512474.
    Here is an image of the hand:


    ![](img/324d126a7e2da696837a3e066326bd61_186_0.png)


    If you have access to a 3D printer, you can also download and print the hand yourself.
    Here is the link: https://www.thingiverse.com/thing:288856. Once you have assembled
    the hand, you''ll need to add the servos to control the hand and the wrist. To
    control the hand, you''ll pull on five separate fishing lines that come out of
    the hand. Here is an image of those fishing lines:


    ![](img/324d126a7e2da696837a3e066326bd61_186_1.png)'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'The hand is normally fully open. When you pull on the lines, each of the digits
    of the hand closes. When you release the lines, rubber bands on the back of each
    joint force the fingers and thumb back open. You''ll use the servos to control
    the fingers and thumb. For this project, you''ll only need three states: the fully-closed
    hand (rock), the fully-open hand with the sideways wrist (paper), and the thumb,
    ring finger and little finger closed with the index and pointer finger fully open
    (scissors).


    Here is an image of how to connect the fishing lines to a servo:


    ![](img/324d126a7e2da696837a3e066326bd61_187_0.png)


    Connect each of the digits to a servo, and then connect the entire hand to a bracket;
    this will act as the wrist. You''ll also connect this to a servo that can turn
    the wrist.'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# Moving the robotic hand


    In order to move the servos, you''ll use a servo controller similar to the one
    introduced in Chapter 5, Building a Robot That Can Walk, to control six servos
    that will control the fingers, thumb, and wrist. As in Chapter 5, Building a Robot
    That Can Walk, the servo controller you are going to use for this project is a
    simple servo motor controller using the USB from Pololu. However, since you only
    need to control five servos, you can order the six-servo controller version available
    at https://www.pololu.com. Here is an image of the unit:


    ![](img/324d126a7e2da696837a3e066326bd61_188_0.png)


    Make sure you order the assembled version. This piece of hardware will turn the
    USB commands from the Raspberry Pi Zero into signals that control your servo motors.
    There are two connections that you''ll need to make to the servo controller to
    get started: the first to the servo motors and the second to a power source.'
  merge: -1
  img_proc: true
