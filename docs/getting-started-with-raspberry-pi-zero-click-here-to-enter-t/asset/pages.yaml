    You need to connect your Raspberry Pi Zero to the Internet with either a wired
    or WLAN connection. Issue the following commands in a terminal window on your
    Raspberry Pi Zero:


    +   1. Type wget https://github.com/simonmonk/raspirobotboard2/raw/master/python/dist/rrb2-1.1.tar.gz:
    This will download the library to your Raspberry Pi.'
