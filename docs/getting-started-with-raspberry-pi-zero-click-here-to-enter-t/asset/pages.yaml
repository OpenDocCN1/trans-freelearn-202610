    \nNow you can sense the distance with Raspberry Pi Zero!\n\n# Connecting a digital\
    \ compass to  \nRaspberry Pi Zero\n\nNow you've created some pretty basic connections\
    \ to Raspberry Pi Zero, turning lines on and off and sensing a high or low signal.\
    \ Now let's explore one of the other interfaces available on Raspberry Pi Zero,\
    \ the I2C interface. To do this, you'll connect a digital compass with this sort\
    \ of interface.\n\n> For more on the I2C interface, see `http://www.robot-electronics.co.uk/i2c-tutorial`.\n\
    \nThere are several chips that provide digital compass capability; one of the\
    \ most common is the **HMC5883L**, a *3-axis* digital compass chip. This chip\
    \ is packaged in a module by several companies but almost all of them result in\
    \ a similar interface."
  merge: -1
