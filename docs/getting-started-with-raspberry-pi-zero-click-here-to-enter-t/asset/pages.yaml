- pgno: 199
  md: '# # Downloading and installing OpenCV – a fully featured vision library


    Now that you have your camera connected, you can access some amazing capabilities
    that have been provided by the open source community. Open a terminal window and
    type the following commands:


    +   - `sudo apt-get update`: You''re going to download a number of new software
    packages, so it is good to make sure that everything is up to date.

    +   - `sudo apt-get install libavformat-dev`: This library provides a way to code
    and decode audio and video streams.

    +   - `sudo apt-get install libcv2.4 libcvaux2.4 libhighgui2.4`: This command
    shows the basic OpenCV libraries. Note the number in the command. This will almost
    certainly change as new versions of OpenCV become available. If 2.4 does not work,
    try either 3.0 or Google for the latest version of OpenCV.

    +   - `sudo apt-get install python-opencv`: This is the Python development kit
    needed for OpenCV, as you are going to use Python.

    +   - `sudo apt-get install opencv-doc`: This command will download the documentation
    for OpenCV just in case you need it.

    +   - `sudo apt-get install libopencv-dev`: This command downloads the header
    file and static libraries to compile OpenCV.

    +   - `sudo apt-get install libopencv-dev`: This command downloads more development
    tools for compiling OpenCV.

    +   - `sudo apt-get install libhighgui-dev`: This is another package that provides
    header files and static libraries to compile OpenCV.


    Now, type `cp -r /usr/share/doc/opencv-doc/examples /home/pi/`. This will copy
    all the examples to your home directory.'
  merge: -1
  img_proc: true
