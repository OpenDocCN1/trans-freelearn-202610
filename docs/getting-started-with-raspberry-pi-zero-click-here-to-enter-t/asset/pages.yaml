- pgno: 205
  md: "```\nimport math\n\ncap = cv2.VideoCapture(0)\ncap.set(3, 320)\ncap.set(4,\
    \ 240)\n\ndef getHand():\n    while(cap.isOpened()):\n        ret, img = cap.read()\n\
    \        cv2.rectangle(img, (200,200), (50,50), (0,255,0),0)\n        crop_img\
    \ = img[50:200, 50:200]\n        grey = cv2.cvtColor(crop_img, cv2.COLOR_BGR2GRAY)\n\
    \        value = (35, 35)\n        blurred = cv2.GaussianBlur(grey, value, 0)\n\
    \        _, thresh1 = cv2.threshold(blurred, 127, 255, cv2.THRESH_BINARY_INV+cv2.THRESH_OTSU)\n\
    \        cv2.imshow('Thresholded', thresh1)\n        contours, hierarchy = cv2.findContours(thresh1.copy(),cv2.RETR_TREE,\
    \ cv2.CHAIN_APPROX_NONE)\n        max_area = -1\n        for i in range(len(contours)):\n\
    \            cnt=contours[i]\n            area = cv2.contourArea(cnt)\n      \
    \      if(area>max_area):\n                max_area=area\n                ci=i\n\
    \        cnt=contours[ci]\n        x,y,w,h = cv2.boundingRect(cnt)\n        print\
    \ x, y, w, h\n        if w != 148 and h !=148: # not starting rectangle\n    \
    \        if w/h >= 3:\n                return 3  # scissors\n            elif\
    \ w/h < 3 and w/h > 1:\n                return 2\n            else:\n        \
    \        return 3\n        cv2.rectangle(crop_img, (x,y), (x+w,y+h), (0,0,255),0)\n\
    \        cv2.imshow('Gesture', img)\n        k = cv2.waitKey(10)\n        if k\
    \ == 27:\n            break\n\nprint getHand()\n```\n\nNow you know the state\
    \ of the human opponent's hand. To complete the entire project, you'll need to\
    \ add code to make a random selection for the computer hand's state, call the\
