- pgno: 165
  md: '# 7

    Adding Raspberry Pi Zero to

    an RC Vehicle


    You''ve now built robots that can roll, walk, and respond to voice commands. In
    this chapter, you''ll modify an RC car to add Raspberry Pi Zero to control the
    vehicle. Additionally, you''ll add a webcam so that you can see what your car
    is seeing remotely.


    In this chapter, you''ll learn the following topics:


    +   - How to modify an Xmods RC car using Raspberry Pi Zero

    +   - How to set break into the control circuitry of the car and use the Raspberry
    Pi to control it

    +   - How to use wireless communication to add remote control to the car

    +   - How to add a webcam so you can control your car via **First Person View
    (FPV)**'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# Configuring and controlling an RC car

    with Raspberry Pi Zero


    In this project, you’ll be working on a simple RC car, similar to the one shown
    here:


    ![](img/324d126a7e2da696837a3e066326bd61_166_0.png)


    This particular car is an Xmods car, originally sold by Radio Shack. However,
    the best place to get them now is eBay. The advantage of this particular set is
    that the inputs to the drive train and steering are very easy to access.


