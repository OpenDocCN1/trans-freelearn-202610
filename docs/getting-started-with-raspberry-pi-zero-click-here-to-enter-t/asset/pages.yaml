    of copying the set of statements every time we want to perform it, we group them
    into a function. I''ll use a fairly simple example here, but if the calculation
    takes a significant number of programming statements, you can see how that would
    make our code significantly easier to maintain, as we don''t need to duplicate
    our code over and over. It can also make our code easier to read. The following
    screenshot shows the code:'
