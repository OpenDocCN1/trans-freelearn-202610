- pgno: 17
  md: '# # Getting Started with

    # Raspberry Pi Zero


    There has been a major shift in electronics and computer accessibility driven
    by the introduction of the Raspberry Pi microcomputer and its variants. With a
    completely different price point along with a significantly expanded support community,
    the Raspberry Pi has been an unprecedented success in bringing inexpensive computing
    to a wide audience. The Raspberry Pi Zero continues with that important approach,
    providing unprecedented computer power at an even lower price point.


    The Raspberry Pi Zero is particularly useful as it can be paired with inexpensive
    hardware and open-source software to do a wide range of different Do-It-Yourself
    projects. You''ll learn about many of these in this book. You''ll learn how to
    control DC motors, how to control servos, how to hook up a microphone for speech
    recognition, and even how to connect a webcam to view and interpret the outside
    world.


    The Raspberry Pi Zero can do amazing things, but first you''ll need to understand
    how to access all of this capability. In this chapter, you''ll learn how to:


    +   - Provide power to the board

    +   - Connect a display, keyboard, and mouse

    +   - Load and configure the operating system

    +   - Configure the board for remote access'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Setting up the Raspberry Pi Zero


    While the Raspberry Pi Zero is a powerful computer, you''ll need some additional
    hardware to access this capability. Here are the items that you''ll need for this
    chapter''s projects:


    +   - A Raspberry Pi Zero

    +   - A micro USB cable and power supply to provide power to the board

    +   - A display with an HDMI video input

    +   - A keyboard, a mouse, and a powered USB hub

    +   - A microSD card – with at least 4 GB capacity

    +   - A microSD card writer

    +   - Another computer that is connected to the Internet

    +   - A WLAN USB dongle

    +   - A 40x2 pin connector strip


    Before you get started, let''s get familiar with the Raspberry Pi Zero. Here is
    an image of the hardware:


    ![](img/324d126a7e2da696837a3e066326bd61_18_0.png)'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'Note that the GPIO pin male headers are not pre-soldered to the board; you''ll
    want to do that. You can buy these at most online electronics retailers. You should
    also become familiar with the various connections on the board. Here, you can
    see the Raspberry Pi Zero with the connector soldered and the connections labeled
    for your information:


    ![](img/324d126a7e2da696837a3e066326bd61_19_0.png)


    # Powering the board


    One of the first issues you''ll want to consider is how to power the board. To
    do this, you need to connect through the USB power connection. There are two choices
    to provide power to the Raspberry Pi Zero:


    +   1. Connect the microUSB connector labeled power to a 5V DC source powered
    by a USB power supply. This can be either a power supply that can plug directly
    into an outlet or power supplied by a powered USB port like those available on
    most computers.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '2. Connect the microUSB connector to a battery. The simplest connection is
    to batteries that have a USB connector, like those used to charge cellphones.
    Here is a image of just such a battery:


    ![](img/324d126a7e2da696837a3e066326bd61_20_0.png)


    In both cases, make sure that the unit can supply enough current. You''ll need
    a supply that can provide at least 1000 mA at 5 volts. There are two USB charge
    connections on this battery which makes it easy to plug the Raspberry Pi Zero
    into one and the powered USB hub into the other. Do not plug in the board just
    yet, you first need to connect the rest of the hardware and configure the microSD
    card. However, you are now ready to connect the rest of the hardware.


    # Hooking up a keyboard, mouse, and display


    The next step is to connect a keyboard, mouse, and display to the Raspberry Pi
    Zero. You may have much of this stuff already but, if you don''t, there are some
    things to consider before buying additional equipment. Let''s start with the keyboard
    and mouse.'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'To connect any device to the Raspberry Pi Zero you''ll need some sort of adapter
    or hub. You can buy a simple hub that goes from the microUSB connector on the
    Raspberry Pi Zero to the more common standard connector. You can find these at
    most electronics online retailers, and it looks something like this:


    ![](img/324d126a7e2da696837a3e066326bd61_21_0.png)


    However, there will be projects when you will want to connect more than one device
    to the Raspberry Pi Zero. For these cases you may want to consider purchasing
    a powered USB hub. Before deciding on the hub to connect to your board, you need
    to understand the difference between a powered USB hub and one that gets its power
    from the USB port itself.'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'Almost all USB hubs are not powered, in other words, you don''t plug in the
    USB hub separately. The reason for this is that almost all of these hubs are hooked
    up to computers with very large power supplies and powering USB devices from the
    computer is not a problem. This is not the case for your board. The USB port on
    your board has very limited power capabilities so if you are going to hook up
    devices that require significant power – a WAN adapter or a webcam for instance
    – you''re going to need a powered USB hub, one that provides power to the devices
    through a separate power source. Here is an image of such a device, available
    at http://www.amazon.com/ and other online retailers:


    ![](img/324d126a7e2da696837a3e066326bd61_22_0.png)


    Note that there are two connections on this hub. The one to the far right is a
    power connection and it will be plugged into a battery or a USB power adapter
    with a USB port. The connection to the left is the USB connection, which will
    be plugged into the Raspberry Pi. To connect the power USB board to the Raspberry
    Pi Zero you need a cable that connects to a microUSB connector. Now, you''ll have
    more connections to add a mouse and keyboard, webcams, and a USB WLAN device.


    Now, you''ll also need a display. Fortunately, your Raspberry Pi Zero offers lots
    of choices. There are a number of different video standards; here is an image
    of some of the most common ones for reference:'
  merge: -1
  img_proc: true
- pgno: 23
  md: '![](img/324d126a7e2da696837a3e066326bd61_23_0.png)


    There is a mini HDMI connector on the Raspberry Pi Zero. In order to connect it
    to an HDMI monitor you''ll need a mini HDMI to standard HDMI adapter or cable.
    You can also buy a cable that has a mini HDMI connector on one end and a regular
    HDMI connector on the other. Here is an image of the adapter:


    ![](img/324d126a7e2da696837a3e066326bd61_23_1.png)


    To use this connector, simply connect the adapter to your Raspberry Pi Zero, then
    the cable with the regular HDMI connections to the adapter and your TV or monitor
    that has an HDMI input connector. HDMI monitors are relatively new but if you
    have a monitor that has a DVI input, you can buy relatively inexpensive adapters
    that provide an interface between DVI and HDMI.


    > Don''t be fooled by adapters that claim that they go from HDMI or DVI to VGA,
    or HDMI or DVI to S-video. These are two different kinds of signals: HDMI and
    DVI are digital standards, and VGA and S-video are analog standards. There are
    adapters that can do this, but they must contain circuitry and require power and
    they are significantly more expensive than any simple adapter.'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'You are almost ready to plug in the Raspberry Pi Zero. Connect your HDMI cable
    to your monitor and the Raspberry Pi Zero. Connect your USB hub to the Raspberry
    Pi Zero and connect your keyboard and mouse to the USB hub. Make sure that you
    connect all your devices before you power on the unit. Most operating systems
    support hot-swap of devices, which means you are able to connect a device after
    the system has been powered but this is a bit shaky. You should always cycle power
    when you connect new hardware. Here is a picture of everything connected:


    ![](img/324d126a7e2da696837a3e066326bd61_24_0.png)


    The USB connectors are connected to USB power adapters. Even though your hardware
    configuration is complete, you''ll still need to complete the next section to
    power on the device. So, let''s figure out how to install an operating system.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# # Installing the operating system


    Now that your hardware is ready, you need to download and image an operating system
    to a microSD card. The Raspberry Pi Zero provides a lot of different choices.
    You''ll stick with Linux, an open-source version of Unix, on your Raspberry Pi
    Zero. Linux, unlike Windows, Android, or iOS, is not tightly controlled by a single
    company. It is a grassroots effort from a wide community, mostly open-source and,
    while it is available for free, it grows and develops a bit more chaotically.


    A number of different versions of Linux have emerged, each built on a core set
    of similar capabilities referred to as the Linux kernel. These core capabilities
    are all based on the Linux specification. However, they are packaged slightly
    differently, and developed, supported, and packaged by different organizations.
    The Raspberry Pi community has become standardized on **Raspbian**, a **Debian**
    distribution of Linux for the Raspberry Pi. So, you are going to install and run
    Raspbian on your Raspberry Pi Zero.


    The newest version of Debian is called **Jessie**, after the cowgirl in Toy Story®.
    This is the naming convention for Debian and you need to download this version
    of Raspbian.


    You can purchase a card that has Raspbian installed or you can download it onto
    your personal computer and then install it on the card. To download a distribution,
    you need to decide if you are going to use a Windows computer to download and
    create an SD card, a MAC OS X, or a Linux machine. I''ll give brief instructions
    for Windows and Linux machines here.


    ![](img/324d126a7e2da696837a3e066326bd61_25_0.png)


    > For directions on the MAC OS X, go to: `http://www.raspberrypi.org/documentation/installation/installing-images/mac.md`.


    Firstly, you need to download an image. This part of the process is similar for
    both Windows and Linux. Open a browser window. Go to the Raspberry Pi organization''s
    website, `https://www.raspberrypi.org/` and select the **Downloads** selection
    at the top of the page. This will give you a variety of download choices. Go to
    the **Raspbian** section, and select the `.zip` file just to the right of the
    image identifier. You need the latest version, but not the lite one. This will
    download an archived file that has the image for your Raspbian operating system.
    Note the default username and password; you''ll need them later.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# Getting Started with Raspberry Pi Zero


    If you''re using Windows, you''ll need to unzip the file using an archiving program
    like 7-Zip available at http://www.7-zip.org/. This will leave you with a file
    that has the .img extension, a file that can be imaged onto your card. Next, you
    need a program that can write the image to the card. I use Image Writer for Windows.
    You can find a link to this program at the top of the download section on the
    https://www.raspberrypi.org/ website. Plug your card into the PC, run this program,
    and you should see this:


    ![](img/324d126a7e2da696837a3e066326bd61_26_0.png)


    Select the device card and download the image; it should look something like this:


    ![](img/324d126a7e2da696837a3e066326bd61_26_1.png)


    Then, click on the **Write** button. This will take some time, perhaps as long
    as 15 minutes but, when it is complete, exit the program and you''ll have your
    microSD card with the image.


    If you are using Linux, you need to un-archive the file and then write it to the
    card. You can do all of this with one command. However, you do need to find the
    /dev device label for your card. You can do this with the `ls -la /dev/sd*` command.
    If you run this before you plug in your card, you might see something like the
    following screenshot:'
  merge: -1
  img_proc: true
- pgno: 27
  md: '![](img/324d126a7e2da696837a3e066326bd61_27_0.png)


    After plugging in your card, you might see something like the following screenshot:


    ![](img/324d126a7e2da696837a3e066326bd61_27_1.png)


    Note that your card is at sdb. Now go to the directory in which you downloaded
    the archived image file and use the following command:


    ```

    ```bash

    sudo dd if=2015-11-21-raspbian-jessie.img of=/dev/sdX

    ```

    ```


    The `2015-11-21-raspbian-jessie.img` command will be replaced by the image file
    that you downloaded and `/dev/sdX` will be replaced by your card ID, in this example
    `/dev/sdb`. Be careful to specify the correct device as this can overwrite the
    data on any of your drives. Also, this may take a few minutes. Once the file is
    written, eject the card and you are ready to plug it into the board and apply
    the power.'
  merge: -1
