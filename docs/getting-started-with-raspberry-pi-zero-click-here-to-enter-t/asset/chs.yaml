- "# 第8章 机械手\n使用 Raspberry Pi Zero 玩石头、剪刀、布\n\n你现在已经使用 Raspberry Pi Zero 构建了多个项目。现在，你将把其中一些功能添加到一个新项目中，例如使用\
  \ USB 网络摄像头和一个名为 OpenCV 的开源库来“看到”并判断你周围发生了什么。在本项目中，你将控制一个机械手来玩经典的决策游戏；石头、剪刀、布。\n\
  \n在本章中，你将构建一个基本的机械手，然后用它来玩石头、剪刀、布。在本章中，你将学习：\n\n- 如何使用 Raspberry Pi Zero 控制将控制机械手的舵机\n\
  - 如何向项目添加 USB 网络摄像头以“看到”你周围的世界\n- 如何使用 OpenCV，一个开源图像处理库，来判断人类对手是否出示石头、剪刀或布\n\n##\
  \ 一个机械手\n\n在本章中，你将构建一个具有四根手指、一根拇指和一个可旋转手腕的人类手。实际上，有几种可能的机械手配置可供购买或自行制作。如果你想购买一个已经\
  \ 3D 打印好的手，我个人最喜欢的是由 Christopher Chappelle 和 Easton LaChappelle 设计的手，已经在 http://www.shapeways.com/product/Z5CZ2RKLY/3d-printed-hand-right?li=search-results-1&optionId=42512474\
  \ 上 3D 打印好了。以下是手的图像：\n\n![](img/324d126a7e2da696837a3e066326bd61_186_0.png)\n\n\
  如果你有 3D 打印机，也可以下载并自行打印手。以下是链接：https://www.thingiverse.com/thing:288856。组装好手后，你需要添加舵机来控制手和手腕。要控制手，你需要拉动从手伸出的五根独立的钓鱼线。以下是这些钓鱼线的图像：\n\
  \n![](img/324d126a7e2da696837a3e066326bd61_186_1.png)\n\n手通常是完全张开的。当你拉动线时，手的每个手指都会闭合。当你松开线时，每个关节背面的橡皮筋会迫使手指和拇指重新张开。你将使用舵机来控制手指和拇指。对于本项目，你只需要三种状态：完全闭合的手（石头）、手腕向侧面时完全张开的手（布），以及拇指、环指和小指闭合而食指和中指完全张开（剪刀）。\n\
  \n以下是如何将钓鱼线连接到舵机的图像：\n\n![](img/324d126a7e2da696837a3e066326bd61_187_0.png)\n\n\
  将每个手指连接到一个舵机，然后将整个手连接到一个支架；这将作为手腕。你还将把它连接到一个可以转动手腕的舵机。\n\n## 移动机械手\n\n为了移动舵机，你将使用一个类似于第\
  \ 5 章《构建一个可以行走的机器人》中介绍的舵机控制器来控制六个舵机，这些舵机将控制手指、拇指和手腕。如第 5 章《构建一个可以行走的机器人》中所述，你将为本项目使用的舵机控制器是\
  \ Pololu 使用 USB 的简单舵机电机控制器。但是，由于你只需要控制五个舵机，你可以订购可在 https://www.pololu.com 上获得的六舵机控制器版本。以下是该单元的图像：\n\
  \n![](img/324d126a7e2da696837a3e066326bd61_188_0.png)\n\n确保你订购的是组装版本。这块硬件会将来自 Raspberry\
  \ Pi Zero 的 USB 命令转换为控制舵机电机的信号。你需要对舵机控制器进行两个连接才能开始：第一个连接到舵机电机，第二个连接到电源。\n\n首先，将舵机连接到控制器。为了保持一致，让我们将六个舵机连接到控制器上标记为\
  \ 0 到 5 的连接处，使用以下配置：\n\n| 舵机连接器 | 舵机 |\n|---|---|\n| 0 | 拇指 |\n| 1 | 食指 |\n| 2 |\
  \ 中指 |\n| 3 | 环指 |\n| 4 | 小指 |\n| 5 | 手腕 |\n\n以下是控制器的背面图像；这将告诉我们在哪里连接我们的舵机：\n\n\
  ![](img/324d126a7e2da696837a3e066326bd61_189_0.png)\n\n## 使用 Raspberry Pi Zero 玩石头、剪刀、布\n\
  \n现在，你需要将舵机电机控制器连接到电源。对于本项目，你可以使用电池，也可以使用专用电源。以下是专用电源的图像，可在大多数在线电子商店购买，可提供大约 3 安培\
  \ 6 伏的电量，这对项目是必需的：\n\n![](img/324d126a7e2da696837a3e066326bd61_190_0.png)\n\n电源上的连接已明确标记；你将把\
  \ 6 伏电源和 GND 连接连接到舵机控制器上标记为 BAT 的连接上。\n\n> 对这种电源要非常小心，从未在电源插入时对连接到电源的线路进行操作，并且在完成所有连接后最好将电源放在保护外壳中。\n\
  \n你的系统现在是功能性的。现在，你将把电机控制器连接到你的个人电脑，以检查是否可以像 *第 5 章《构建一个可以行走的机器人》* 中所示那样与之通信。为此，将迷你\
  \ USB 电缆连接到舵机控制器和你的个人电脑之间。\n\n现在，你可以使用 Pololu Maestro Control Center 上的滑块实际控制舵机。确保舵机\
  \ 0 移动拇指，1 移动食指前中舵机，2 移动右前上舵机，依此类推。你也可以用它来校准舵机。\n\n将所有舵机设置在滑块条的一侧，滑块位于一侧，你希望这成为打开设置。滑块条另一侧的设置会拉动钓鱼线，从而将相关手指或拇指移动到闭合设置。现在，拧下每个舵机上的舵机角，直到舵机定位到使手张开时处于舵机运动的一端。当舵机移动到范围的另一端时，手应该闭合。\n\
  \n你的手现在准备好实际做点什么了。现在，你需要向舵机发送它们需要发出的电子信号以表示石头、剪刀或布。\n\n## 将舵机控制器连接到 Raspberry Pi\
  \ Zero\n\n你已经检查了舵机电机控制器和舵机；现在你将把电机控制器连接到 Raspberry Pi Zero 并确保可以从它控制舵机。拔下 USB 电缆与\
  \ PC 的连接并将其连接到 Raspberry Pi Zero。\n\n让我们现在专注于电机控制器，通过从 Pololu 下载 Linux 代码 `www.pololu.com/docs/0J40/3.b`。也许最好的方法是登录你的\
  \ Raspberry Pi Zero 通过 PuTTY，然后输入 `wget http://www.pololu.com/file/download/maestro-linux-100507.tar.gz?file_id=0J315`。然后，使用\
  \ `mv maestro-linux-100507.tar.gz\\?file_id\\=0J315 maestro-linux-100507.tar.gz`\
  \ 移动文件。通过输入 `tar -xzfv maestro-linux-100507.tar.gz` 解压文件。这将创建一个名为 `maestro_linux`\
  \ 的目录。通过输入 `cd maestro_linux` 进入该目录，然后输入 `ls -l`；你应该能看到类似以下的内容：\n\n![](img/324d126a7e2da696837a3e066326bd61_191_0.png)\n\
  \n\n\n\n\n文档 README.txt 将会明确说明如何安装软件。这基本上分为两个步骤。首先，通过输入 sudo apt-get install libusb-1.0-0-dev\
  \ mono-runtime libmono-winforms2.0-cil 安装一组支持库，然后通过输入 sudo cp 99-pololu.rules /etc/udev/rules.d/\
  \ 复制配置文件。\n\n不幸的是，你无法在你的 Raspberry Pi Zero 上运行 Maestro Control Center，因为你的 Windows\
  \ 版本不支持图形界面，但你可以使用 UscCmd 命令行应用程序来控制你的舵机，以确保它们已连接并且工作正常。首先，输入 ./UscCmd --list，你应该能够看到以下内容：\n\
  \n![](img/324d126a7e2da696837a3e066326bd61_192_0.png)\n\n单元检测到你的舵机控制器。如果你只输入 ./UscCmd，你可以看到可以发送给控制器的所有命令：\n\
  \n```\npi@raspberrypi:~/maestro_linux $ ./UscCmd\nUscCmd, Version=1.3.0.0, Culture=neutral,\
  \ PublicKeyToken=null\nSelect one of the following actions:\n  --list          \
  \        list available devices\n  --configure FILE        load configuration file\
  \ into device\n  --getconf FILE          read device settings and write configuration\
  \ file\n  --restoredefaults       restore factory settings\n  --program FILE   \
  \       compile and load bytecode program\n  --status                display complete\
  \ device status\n  --bootloader            put device into bootloader (firmware\
  \ upgrade) mode\n  --stop                  stops the script running on the device\n\
  \  --start                 starts the script running on the device\n  --restart\
  \               restarts the script at the beginning\n  --step                 \
  \ runs a single instruction of the script\n  --sub NUM               calls subroutine\
  \ n (can be hex or decimal)\n  --sub NUM,PARAMETER     calls subroutine n with a\
  \ parameter (hex or decimal) placed on the stack\n  --servo NUM,TARGET      sets\
  \ the target of servo NUM in units of 1/4 microsecond\n  --speed NUM,SPEED     \
  \  sets the speed limit of servo NUM\n  --accel NUM,ACCEL       sets the acceleration\
  \ of servo NUM to a value 0-255\nSelect which device to perform the action on (optional):\n\
  \  --device 00001430       (optional) select device #00001430\npi@raspberrypi:~/maestro_linux\
  \ $\n```\n\n请注意，你可以发送舵机到特定的目标角度，尽管目标不是以度为单位，所以很难知道你将舵机发送到哪里。尝试输入 ./UscCmd --servo\
  \ 0, 10。舵机将移动到其最大角度位置。输入 ./UscCmd - servo 0, 0 它将停止舵机试图移动。在下一节中，你将编写一些 Python 代码，将你的角度以度为单位转换为舵机控制器希望看到的命令，以便将其移动到特定角度位置。\n\
  \n> 如果你没有运行 Windows 版本的 Maestro Controller 并将 Serial Settings 设置为 USB Chained，你的电机控制器可能不会响应。重新运行\
  \ Maestro Controller 代码并将 Serial Settings 设置为 USB Chained。\n\n## Creating a program\
  \ on Raspberry Pi Zero\n### so that you can control your hand\n\n你现在知道你可以与你的舵机电机控制器对话并移动你的舵机。在本节中，你将创建一个\
  \ Python 程序，让你可以与你的舵机对话以将其移动到特定角度。\n\n让我们从一个简单的程序开始，该程序将定位你的手，使舵机设置为范围的一端（这应该打开手），然后移动到范围的另一端（这应该关闭你的手）。此程序以你在\
  \ *Chapter 5, Building a Robot That Can Walk* 中编写的代码开始。以下是控制舵机的基本代码：\n\n```\n```python\n\
  #!/usr/bin/python\nimport serial\nimport time\n\ndef setAngle(ser, channel, angle):\n\
  \    minAngle = 0.0\n    maxAngle = 180.0\n    minTarget = 256.0\n    maxTarget\
  \ = 13120.0\n    scaledValue = int(angle / ((maxAngle - minAngle) / (maxTarget -\
  \ minTarget))) + minTarget\n    commandByte = chr(0x84)\n    channelByte = chr(channel)\n\
  \    lowTargetByte = chr(scaledValue & 0x7F)\n    highTargetByte = chr((scaledValue\
  \ >> 7) & 0x7F)\n    command = commandByte + channelByte + lowTargetByte + highTargetByte\n\
  \    ser.write(command)\n    ser.flush()\n\nser = serial.Serial(\"/dev/ttyACM0\"\
  , 9600)\n# Home position\nfor i in range(0, 12):\n    setAngle(ser, i, 90)\ntime.sleep(1)\n\
  ```\n```\n\n以下是代码的解释：\n\n- `#!/usr/bin/python`: 这一行允许你从命令行执行此 Python 文件。\n- `import\
  \ serial`: 这一行导入 serial 库。你需要 serial 库通过 USB 与你的单元对话。\n- `def setAngle(ser, channel,\
  \ angle)`: 此函数将你期望的舵机和角度设置转换为舵机电机控制器需要的串行命令。\n- `ser = serial.Serial(\"/dev/ttyACM0\"\
  , 9600)`: 这打开到你的舵机控制器的串行端口连接。\n- `for i in range(0, 12)`: 对于每个舵机\n- `setAngle(ser,\
  \ i, 90)`: 现在你可以将每个舵机设置为中间位置。这应该使你的手指半开。如果你的手不在中间位置，你可以通过调整每个舵机上舵机角的位置来调整它。\n\n\
  要访问串行端口，你需要确保你已安装 Python serial 库。如果没有，则输入 `sudo apt-get install python-serial`。安装\
  \ serial 库后，你可以通过输入 `sudo python hand.py` 运行你的程序。\n\n一旦你知道将舵机设置为中间角度位置的角度，每个舵机打开或关闭手的角度设置大约在两侧各\
  \ 20 度。最后，你现在可以要求你的手关闭拇指、环指和小指的舵机，这将是剪刀手。你需要为每三种不同位置各提供一个 Python 函数。在这种情况下，你可以使用你的\
  \ `setAngle` 命令设置你的舵机来操纵你的手的六个舵机，以执行纸牌（全部打开）、石头（全部关闭）或剪刀（两个手指伸出，其余关闭）。\n\n由于每个都是一个函数，此代码也具有可被包含在库中以便在你的系统中使用网络摄像头的能力。\n\
  \n![](img/324d126a7e2da696837a3e066326bd61_197_0.png)\n\nThe /dev/video0 is the\
  \ webcam device. Now that your device is connected, let's actually see if you can\
  \ capture the images and video.\n\n> 虽然许多 USB 网络摄像头都可以使用，为了确保这一点，你可能希望从 Logitech\
  \ 等主要网络摄像头制造商处购买网络摄像头。\n\n# Playing Rock, Paper, or Scissors with Raspberry Pi Zero\n\
  \n有几个工具可以让你访问网络摄像头，但一个带有视频控制的简单程序称为 guvcview。要安装它，输入 `sudo apt-get install guvcview`。安装应用程序后，你需要运行它。为此，你需要直接连接到显示器或使用\
  \ vncviewer 连接到远程计算机。在 Raspberry Pi 上打开一个终端窗口并运行 guvcview。你应该会看到类似以下内容：\n\n![](img/324d126a7e2da696837a3e066326bd61_198_0.png)\n\
  \n不用担心你将捕获的图像质量，你将在 OpenCV 中处理你的图像，OpenCV 是一个视觉框架。\n\n## Downloading and installing\
  \ OpenCV – a fully featured vision library\n\n现在你已连接了摄像头，你可以访问开源社区提供的一些惊人功能。打开一个终端窗口并输入以下命令：\n\
  \n- `sudo apt-get update`: 你将下载许多新的软件包，因此确保一切都是最新的很有好处。\n- `sudo apt-get install\
  \ libavformat-dev`: 此库提供了一种编码和解码音频和视频流的方法。\n- `sudo apt-get install libcv2.4 libcvaux2.4\
  \ libhighgui2.4`: 此命令显示基本的 OpenCV 库。请注意命令中的数字。随着新版本的 OpenCV 可用，这几乎肯定会发生变化。如果 2.4\
  \ 不起作用，请尝试 3.0 或在 Google 上搜索 OpenCV 的最新版本。\n- `sudo apt-get install python-opencv`:\
  \ 这是 OpenCV 所需的 Python 开发工具包，因为你将使用 Python。\n- `sudo apt-get install opencv-doc`:\
  \ 此命令将下载 OpenCV 的文档，以防你需要它。\n- `sudo apt-get install libopencv-dev`: 此命令下载用于编译 OpenCV\
  \ 的头文件和静态库。\n- `sudo apt-get install libopencv-dev`: 此命令下载用于编译 OpenCV 的更多开发工具。\n\
  - `sudo apt-get install libhighgui-dev`: 这是另一个提供用于编译 OpenCV 的头文件和静态库的软件包。\n\n现在，输入\
  \ `cp -r /usr/share/doc/opencv-doc/examples /home/pi/`。这将复制所有示例到你的主目录。\n\n\n\n\n\
  \n你可能想要尝试调整分辨率，以找到适合你应用的最佳设置。较大的图像很棒——它们能让你更详细地查看世界——但它们也会占用显著更多的处理能力。随着你真正要求系统执行一些实际的图像处理任务，你会更频繁地调整此分辨率。注意，如果你打算使用\
  \ vncserver 来了解系统性能，这会显著降低更新速率。宽度/高度是两倍大小的图像将涉及四倍的处理量。你现在可以使用此功能来执行许多令人印象深刻的任务。\n\
  \n## 手势检测\n\nOpenCV 和你的网络摄像头也可以跟踪物体。当你希望项目能够区分你的手与背景时，这将很有用。OpenCV 通过提供一些高级库使这变得异常简单，这些库可以帮助我们完成此任务。为此，你将编辑一个文件，使其看起来与以下屏幕截图中所示相似：\n\
  \n![](img/324d126a7e2da696837a3e066326bd61_201_0.png)\n\n## 使用 Raspberry Pi Zero\
  \ 玩剪刀石头布\n\n以下屏幕是测量你手部纸张的画面：\n\n![](img/324d126a7e2da696837a3e066326bd61_204_0.png)\n\
  \n你可以通过使用 *x* 和 *y* 的比率添加一些简单的代码来判断你的手是在出石头、剪刀还是布。在前面的图片中，你可以看到纸张的宽度与高度的比率大约为 140/80。对于石头，该比率大约为\
  \ 85/55。对于剪刀，它将为 140/40。以下是确定石头/布/剪刀的库代码：\n\n```\nimport math\n\ncap = cv2.VideoCapture(0)\n\
  cap.set(3, 320)\ncap.set(4, 240)\n\ndef getHand():\n    while(cap.isOpened()):\n\
  \        ret, img = cap.read()\n        cv2.rectangle(img, (200,200), (50,50), (0,255,0),0)\n\
  \        crop_img = img[50:200, 50:200]\n        grey = cv2.cvtColor(crop_img, cv2.COLOR_BGR2GRAY)\n\
  \        value = (35, 35)\n        blurred = cv2.GaussianBlur(grey, value, 0)\n\
  \        _, thresh1 = cv2.threshold(blurred, 127, 255, cv2.THRESH_BINARY_INV+cv2.THRESH_OTSU)\n\
  \        cv2.imshow('Thresholded', thresh1)\n        contours, hierarchy = cv2.findContours(thresh1.copy(),cv2.RETR_TREE,\
  \ cv2.CHAIN_APPROX_NONE)\n        max_area = -1\n        for i in range(len(contours)):\n\
  \            cnt=contours[i]\n            area = cv2.contourArea(cnt)\n        \
  \    if(area>max_area):\n                max_area=area\n                ci=i\n \
  \       cnt=contours[ci]\n        x,y,w,h = cv2.boundingRect(cnt)\n        print\
  \ x, y, w, h\n        if w != 148 and h !=148: # not starting rectangle\n      \
  \      if w/h >= 3:\n                return 3  # scissors\n            elif w/h\
  \ < 3 and w/h > 1:\n                return 2\n            else:\n              \
  \  return 3\n        cv2.rectangle(crop_img, (x,y), (x+w,y+h), (0,0,255),0)\n  \
  \      cv2.imshow('Gesture', img)\n        k = cv2.waitKey(10)\n        if k ==\
  \ 27:\n            break\n\nprint getHand()\n```\n\n现在你知道了人类对手的手势状态。为了完成整个项目，你需要添加代码为计算机手的状态进行随机选择，调用本章前面各节中的函数使手移动到该状态，然后比较机器人手和用户手的随机选择以确定获胜者。玩剪刀石头布从未如此简单！\n\
  \n## 总结\n\n你现在拥有了一只可以玩剪刀石头布的手！到目前为止，你应该已经拥有了许多可以添加到几乎任何项目中的不同功能。在最后一章中，你将把 Raspberry\
  \ Pi Zero 添加到四轴飞行器上，构建一个可以飞行的项目。\n"
- '# 第9章 为四轴飞行器添加 Raspberry Pi Zero

  ### 为四轴飞行器添加 Raspberry Pi Zero


  你已经有机会构建了许多不同类型的机器人，现在让我们以最令人惊叹的机器人作为结尾，一种可以飞行的机器人。


  > 在开始之前，有一些安全警告需要考虑。当然，永远不要在人或建筑物附近飞行。此外，要非常小心不要飞出你的视距范围。在许多国家，对四轴飞行器的飞行地点和时间都有限制。一些国家，包括美国，要求你注册你的四轴飞行器。


  还需要注意的是，本章并非旨在作为构建可飞行四轴飞行器的完整分步指南。那需要很多章节。本章旨在让你入门，如果你考虑构建一个可使用 Raspberry Pi Zero
  控制的四轴飞行器。在本章中，你将学习以下主题：


  - 构建基本四轴飞行器平台

  - 将 Raspberry Pi Zero 与飞行控制器接口

  - 讨论远程通信

  - 使用 GPS 进行定位

  - 添加自主飞行


  ## 构建平台


  构建四轴飞行器硬件可能令人望而生畏；然而，有几个优秀的网站可以引导你完成整个过程，从组件选择到构建细节以及使用无线电编程和控制你的四轴飞行器。http://www.arducopter.co.uk/
  网站是那些对四轴飞行器飞行感兴趣的新手的好起点。前往 http://copter.ardupilot.com/，这也是另一个信息丰富的优秀网站。


  对于本项目，你希望选择使用 **Pixhawk** 飞行控制器的项目。还有其他价格明显更低的飞行控制器，但这个特定的飞行控制器为 Raspberry Pi Zero
  提供了便捷的访问。以下是一些可以指导你完成构建过程的网站：http://learnrobotix.com/uavs/quadcopter-build/pixhawk/connecting-the-q-brain-esc.html、http://learnrobotix.com/uavs/quadcopter-build/pixhawk/connecting-components-pixhawk-flight-controller.html
  和 http://www.flying-drone.co.uk/how-to-build-a-quadcopter-with-a-pixhawk-flight-controller-step-11/。


  在 http://copter.ardupilot.com/wiki/advanced-pixhawk-quadcopter-wiring-chart/，你会找到一个关于如何连接所有东西的优秀接线图。让我们逐步进行构建我们自己的四轴飞行器。


  首先，你需要一个机架。你将构建一个尺寸为 450 mm 的四轴飞行器，这是最便宜的机架之一，可在大多数在线零售商处购买，具有玻璃纤维臂，如下图所示：


  ![](img/324d126a7e2da696837a3e066326bd61_208_0.png)


  现在，执行以下步骤完成你的四轴飞行器组装：


  - 1. 第一步是按照说明建议组装四轴飞行器。

  - 2. 第二步是将四个 **电子调速器 (ESCs)** 焊接到每个电机上，并将电池连接焊到底板上。以下是底板的图像：


  ![](img/324d126a7e2da696837a3e066326bd61_209_0.png)


  注意 + 和 - 连接；每个连接将焊接到所有 ESC 上。以下是电机控制器的图像：


  ![](img/324d126a7e2da696837a3e066326bd61_209_1.png)


  ## 为四轴飞行器添加 Raspberry Pi Zero


  红黑线连接器是焊接到底盘底板的连接器。其他三个连接器将连接到电机。


  - 3. 第三步是在机架上安装电机。你需要 1000 KV 范围内的电机，以下是此类电机的图像：


  ![](img/324d126a7e2da696837a3e066326bd61_210_0.png)


  再次，按照随附机架的说明将电机附上。然后将来自 ESC 的三个连接附到电机上。


  - 4. 一个可选步骤是为单元添加一套起落架。有很多此类产品可供选择；以下是非常坚固的一个的图像：


  ![](img/324d126a7e2da696837a3e066326bd61_210_1.png)


  - 5. 现在你将在机架上安装 Pixhawk 并连接其相关电子设备。细节在 http://copter.ardupilot.com/wiki/advanced-pixhawk-quadcopter-wiring-chart/
  中显示并描述。这将把 Pixhawk 连接到 ESC、电池、RC 发射器、遥测无线电以及一个开关，该开关将防止四轴飞行器在你准备好之前飞行。

  - 6. 最终，你将在四轴飞行器上安装四个螺旋桨；然而，你必须等到校准 ESC、电机和 RC 发射器后才能安装它们。你需要四个螺旋桨，其中两个设计为顺时针旋转，另外两个设计为逆时针旋转。对于这个四轴飞行器，你希望螺旋桨的螺距为
  10x4.7。以下是其中一个螺旋桨的图像：


  ![](img/324d126a7e2da696837a3e066326bd61_211_0.png)






  以下是使用 Pixhawk 飞行控制器的整个四旋翼飞行器的图像：


  ![](img/324d126a7e2da696837a3e066326bd61_212_0.png)


  > 请注意四旋翼飞行器上排列的箭头和线缆。这并不是为了让它看起来凶猛，而是为了防止它撞到东西并损坏螺旋桨。市面上也有商业护罩可供购买；不过该系统也有效，而且成本更低。


  你需要用 RC 发射器/接收器对组装并飞行你的四旋翼飞行器；这将使你熟悉四旋翼飞行器及其飞行方式，同时也能让你调整所有设置以使其稳定。一旦四旋翼飞行器稳定后，你就可以执行一些简单的自主飞行。让我们使用任务规划软件，该软件运行在远程计算机上。


  ## 任务规划软件


  任务规划软件可在 http://planner.ardupilot.com/ 获取。实际上有两种应用可执行类似操作，但 Mission Planner 是一个很好的地方，可以熟悉如何通过计算机程序与四旋翼飞行器通信。


  为此，你需要确保遥测电台已连接到 Pixhawk 和计算机。这将避免需要使用长 USB 数据线直接连接到 Pixhawk。当你开始任务规划软件时，你会看到以下屏幕：


  ![](img/324d126a7e2da696837a3e066326bd61_213_0.png)


  这是基本屏幕。然后你需要配置无线电的 COM 端口，然后按下屏幕右上角的 CONNECT 按钮。随着你移动四旋翼飞行器，你会看到测量值发生变化。如果你在连接 Pixhawk
  时遇到问题，网站上有大量帮助。


  现在你已连接，你实际上可以用此应用程序看到四旋翼飞行器的飞行情况。软件通过 MAVLink 与 Pixhawk 控制器通信，MAVLink 是一个串行控制链路，从软件应用程序发出，经由遥测电台发出，被遥测电台接收，然后路由到
  Pixhawk。Pixhawk 不仅知道如何发送信息，还知道如何接收信息。


  软件连接后，你需要校准 RC 无线电连接；这可以通过软件完成。你还需要校准 ESC；请参考 http://learnrobotix.com/uavs/quadocopter-build/pixhawk/calibrating-electronic-speed-controllers-with-pixhawk.html
  获取具体说明。


  现在连接后，你可以使用 MAVLink 从 Raspberry Pi Zero 访问 Pixhawk。你需要添加并配置 Raspberry Pi Zero 以完成连接。为此，运行
  `raspi-config` 并选择 **8 Advanced Options, Configure advanced settings** 选项，如以下屏幕截图所示：


  ![](img/324d126a7e2da696837a3e066326bd61_215_0.png)


  现在你准备好安装一些额外软件了。要安装此软件，请执行以下步骤：


  - 1. 输入 `sudo apt-get update`：这会更新本地软件包列表，以便你的系统可以找到合适的软件。

  - 2. 输入 `sudo apt-get install screen python-wxgtk2.8 python-matplotlib python-opencv`：这会安装一个图形包、一个绘图包和一个版本的
  OpenCV。

  - 3. 输入 `sudo apt-get install python-numpy`：这将安装 **NumPy**，一个用于 Python 的数值库，尽管你可能已从之前完成的项目中拥有它。

  - 4. 输入 `sudo apt-get install python-dev`：这是一组文件，将允许你在 Python 环境中进行开发。

  - 5. 输入 `sudo apt-get install python-pip`：这是一个帮助你安装 Python 包的工具。

  - 6. 输入 `sudo pip install pymavlink`：这是一组实现 MAVLink 或 Pixhawk 的通信配置文件的代码，以 Python
  编写。

  - 7. 输入 `sudo pip install mavproxy`：这最后一步安装 **Unmanned Aerial Vehicle (UAV)** 地面站软件包，用于基于
  MAVLink 的系统，该系统基于 Pixhawk。


  现在你已安装了所有软件，可以测试链接。为此，输入 `sudo -s`；这会将你设为超级用户。然后输入 `mavproxy.py --master=/dev/ttyAMA0
  --baudrate 57600 --aircraft MyCopter` 你将看到以下内容：


  ![](img/324d126a7e2da696837a3e066326bd61_217_0.png)


  现在链接已建立，你可以发送命令来设置或显示参数。例如，输入 param show ARMING_CHECK；它应显示参数的值，如以下屏幕截图所示：


  ![](img/324d126a7e2da696837a3e066326bd61_218_0.png)


  所有可用命令的详细信息可在 http://dronecode.github.io/MAVProxy/html/uav_configuration/index.html
  找到。


  你可以直接发出这些命令，但你也可以使用与 Mission Planner 界面类似的界面连接到 Pixhawk，而你之前已使用过该界面。为此，你需要安装 DroneKit
  代码。DroneKit 的总体说明和文档可在 http://python.dronekit.io/1.5.0/guide/getting_started.html
  找到，但让我们在这里看一个示例。


  首先，输入 sudo pip install droneapi。你可以通过输入 git clone http://github.com/dronekit/dronekit-python.git
  下载一些示例脚本。现在 cd 到 dronekit-python/examples/vehicle_state 目录。你会看到 vehicle_state.py
  文件，它展示了如何使用 MAVLink 与 Pixhawk 通信以获取信息，以及设置值和发出命令的绝佳示例。


  ## 向四旋翼飞行器添加 Raspberry Pi Zero


  你还可以将 MAVProxy 系统与运行在远程计算机上的 Mission Planner 接口。使用一台无线电连接到 Pixhawk 的 TELEM 1 端口，以及你的
  Raspberry Pi Zero 连接到 Pixhawk 的 TELEM 2 端口，通过添加 `--out <ipaddress>:14550` 修改 MAVProxy
  启动命令，其中 ipaddress 为运行 Mission Planner 的远程计算机的地址。在 Windows 机器上，可以使用 `ipconfig` 命令确定此
  IP 地址。


  例如，你的 mavproxy 命令可能看起来像这样：`mavproxy.py --master=/dev/ttyAMA0 --baudrate 57600 --out
  ipaddress:14550 --aircraft MyCopter`。一旦连接到 MAVProxy，你就可以使用 UDP 连接连接到 Mission Planner
  软件，如以下屏幕截图所示：


  ![](img/324d126a7e2da696837a3e066326bd61_220_0.png)


  现在，你可以运行你的 MAVProxy 脚本并在 Mission Planner 软件上查看结果。


  ## 摘要


  就这样。你现在拥有了多种不同的机器人平台，它们以 Raspberry Pi Zero 作为中央控制器运行。这些章节只是向你介绍了你的平台的一些最基本功能；你现在可以探索每个平台并扩展其功能。唯一的限制是你的想象力和时间。

