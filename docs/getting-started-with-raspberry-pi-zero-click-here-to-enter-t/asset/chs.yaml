- '# 前言


  多年来，机器人和其他先进的电子奇迹只能在电视、电影或大学或军事实验室中看到。然而，近年来，新颖且价格低廉的硬件以及免费和开源软件的可用性，为几乎任何具有一点技术知识和想象力的人提供了构建这些技术奇迹的机会。第一波项目由
  Arduino 提供动力，Arduino 是一种价格低廉且易于编程的微控制器。下一波则由 Raspberry Pi 的引入而进一步推进，Raspberry Pi
  是一种由 Linux 操作系统驱动的更强大的处理器。


  现在有一种更便宜、更强大的微处理器：Raspberry Pi Zero。这款小处理器将足够运行 Linux 的处理器封装在更小、更便宜的封装中。这种能力，再加上一些额外的动力、低成本硬件和免费开源软件，为项目提供了平台，从简单的轮式机器人到先进的飞行机器。


  ## 本书涵盖内容


  *第 1 章，Setting Started with Raspberry Pi Zero*，旨在详细介绍在 Raspberry Pi Zero 上设置有用的开发环境的细节。本章从如何连接电源的讨论开始，一直延续到设置完整的系统，配置好并准备连接到任何令人惊叹的设备和
  SW 能力，以开发先进的机器人应用。


  *第 2 章，Programming Raspberry Pi Zero*，回顾了对于已熟悉的人来说，在本书其余部分有用的基本 Linux、编辑和编程技术。您将学习如何从命令行交互，如何使用编辑器创建和编辑文件，以及基本的
  Python 编程。






  ## 本书结构


  *第3章，访问 Raspberry Pi Zero 上的 GPIO 引脚*，通过构建和控制一些简单的 LED 电路来讨论 Raspberry Pi Zero 的
  GPIO 能力。


  *第4章，构建和控制一个简单的轮式机器人*，讨论了使用 Raspberry Pi Zero 可以实现的一个令人惊叹的功能，即控制一个简单的轮式机器人。本章将向您展示如何添加电机控制，以便您可以构建自己的自主移动机器人。


  *第5章，构建一个会走路的机器人*，介绍了另一个令人印象深刻的机器人项目，一个可以行走的自主机器人。这是通过使用伺服器实现的，其位置可由 Raspberry Pi
  和一些额外的 USB 控制硬件控制。


  *第6章，添加语音识别和语音 - 一个语音激活机器人*，介绍了语音激活机器人。今天的计算机系统的一个重要新功能是能够在没有屏幕或键盘的情况下输入命令并提供输出。几年前，概念上可以说话和倾听的计算机是科幻小说，但今天它已成为新手机的标准组成部分。本章介绍
  Raspberry Pi Zero 如何既能收听语音又能做出相应回应。这并不像听起来那么容易（双关语意在其中），您将接触到一些基本功能，同时了解其中的一些关键限制。您将把一个标准玩具变成一个有反应的机器人。


  *第7章，将 Raspberry Pi Zero 添加到遥控车辆*，介绍了 Raspberry Pi Zero 的另一个惊人功能，即为您的项目添加“视力”。Raspberry
  Pi Zero 通过支持开源软件和 readily available USB 网络摄像头使这变得非常容易。通过添加此设备和一个遥控器，您可以构建一辆遥控车辆，可以绕过拐角，进入房间，您想去的任何地方。


  *第8章，用 Raspberry Pi Zero 玩石头剪刀布*，介绍了我们如何使用工具包来构建和控制一只可以感知并对周围世界做出反应的机械手。在这种情况下，您将编程您的手来玩石头剪刀布。


  *第9章，将 Raspberry Pi Zero 添加到四轴飞行器*，谈到了构建一个会走路、会说话或玩空气曲棍球的机器人很酷，但能够飞行的机器人才是终极目标。


  ## 本书所需


  您需要一台 Raspberry Pi Zero。您可以参考本书的软件列表以及代码包。


  ## 本书适合谁


  本书专为初学者设计。它只需要一点丰富的想象力和学习编程和硬件配置基础的愿望。


