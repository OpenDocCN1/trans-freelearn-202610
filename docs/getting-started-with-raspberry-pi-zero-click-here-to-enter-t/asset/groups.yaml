    - 任务规划软件 196\n- 总结 205\n\n# 索引 207\n\n# 前言\n\n多年来，机器人和其他先进的电子奇迹只能在电视、电影或大学或军事实验室中看到。然而，近年来，新颖且价格低廉的硬件以及免费和开源软件的可用性，为几乎任何具有一点技术知识和想象力的人提供了构建这些技术奇迹的机会。第一波项目由\
    \ Arduino 提供动力，Arduino 是一种价格低廉且易于编程的微控制器。下一波则由 Raspberry Pi 的引入而进一步推进，Raspberry\
    \ Pi 是一种由 Linux 操作系统驱动的更强大的处理器。\n\n现在有一种更便宜、更强大的微处理器：Raspberry Pi Zero。这款小处理器将足够运行\
    \ Linux 的处理器封装在更小、更便宜的封装中。这种能力，再加上一些额外的动力、低成本硬件和免费开源软件，为项目提供了平台，从简单的轮式机器人到先进的飞行机器。\n\
