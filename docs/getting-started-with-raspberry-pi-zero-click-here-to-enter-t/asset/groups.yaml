    ## 使用舵机控制器控制舵机


    要让你的四足机器人行走，首先需要将舵机马达控制器连接到舵机。你将为此项目使用的舵机控制器是一款来自 Pololu 的简单 USB 舵机马达控制器：Pololu
    产品编号 1354，可在 https://www.pololu.com/ 购买，可控制 18 个舵机。以下是该单元的图像：


    ![](img/324d126a7e2da696837a3e066326bd61_123_1.png)


    确保你订购的是组装版本。这块硬件会将来自 Raspberry Pi Zero 的 USB 命令转换为控制你的舵机马达的信号。Pololu 制造了多种不同版本的控制器；每个版本可控制一定数量的舵机。在这种情况下，你可能希望选择
    18 舵机版本，这样你就可以用一个控制器控制全部 12 个舵机，还可以额外增加一个舵机来控制摄像机或传感器的方向；你也可以选择 12 舵机版本。18 舵机控制器的一个优点是通过螺丝型连接器轻松为单元供电。


    要开始使用，你需要对舵机控制器进行两个连接：第一个连接到舵机马达，第二个连接到电池。


    首先，将舵机连接到控制器。为了保持一致，让我们使用以下配置将你的 12 个舵机连接到控制器上标记为 0 到 11 的连接处：


    | 舵机连接器 | 舵机 |

    |---|---|

    | 0 | 右前下腿 |

    | 1 | 右前中腿 |

    | 2 | 右前上腿 |

    | 3 | 右后下腿 |

    | 4 | 右后中腿 |

    | 5 | 右后上腿 |

    | 6 | 左前下腿 |

    | 7 | 左前中腿 |

    | 8 | 左前上腿 |

    | 9 | 左后下腿 |

    | 10 | 左后中腿 |

    | 11 | 左后上腿 |


    以下是控制器的背面图像；这将告诉我们舵机的连接位置：


    ![](img/324d126a7e2da696837a3e066326bd61_125_0.png)


    现在你需要将舵机马达控制器连接到电池。对于此项目，你可以使用 2S RC LiPo 电池。2S 表示电池有两节电芯，输出电压为 7.2 伏。它将提供你的舵机所需的电压和电流，约为
    2 安培，如下图所示：


    ![](img/324d126a7e2da696837a3e066326bd61_125_1.png)


    此电池将附带两个连接器，一个带有较大线规的电线用于正常使用，以及一个较小的连接器用于连接到电池充电器。你需要制作可连接到舵机控制器螺丝型连接器的连接器。我购买了一些
    XT60 连接器对，并将一些电线焊接到电池的配套连接器上，然后将其拧入舵机控制器。


    你的系统现在可以使用了。现在你将把马达控制器连接到个人电脑以检查是否可以与其通信。为此，将迷你 USB 电缆连接到舵机控制器和个人电脑。我将以 PC 为例进行说明，但你也可以使用
    Mac 或 Linux 来完成此步骤。你可以在 https://www.pololu.com/docs/0J40 上找到详细信息。


    ## 在舵机控制器和 PC 之间通信


    现在硬件已连接，你可以使用 Pololu 提供的一些软件来控制舵机。让我们使用个人电脑来完成。首先，从 www.pololu.com/docs/0J40/3.a
    下载 Pololu 软件并根据网站上的说明进行安装。安装完成后，运行软件，你应该能看到此屏幕：


