    你会注意到，随着分辨率的降低，更新率会提高；这与图像的大小有关。你可以对你的 Raspberry Pi 控制的汽车进行很多改进，例如添加摇杆控制或更多自主性。但是，让我们继续下一个项目。


    ## 总结


    现在你知道如何使用 Raspberry Pi 为现有硬件添加其功能，在本例中是 RC 汽车。在下一章中，你将学习如何使用 Raspberry Pi Zero
    构建一个可以玩石头、剪刀、布的机器人。


    ## 8

    使用 Raspberry Pi Zero 玩石头、剪刀、布


    你现在已经使用 Raspberry Pi Zero 构建了多个项目。现在，你将把其中一些功能添加到一个新项目中，例如使用 USB 网络摄像头和一个名为 OpenCV
    的开源库来“看到”并判断你周围发生了什么。在本项目中，你将控制一个机械手来玩经典的决策游戏；石头、剪刀、布。


    在本章中，你将构建一个基本的机械手，然后用它来玩石头、剪刀、布。在本章中，你将学习：


    - 如何使用 Raspberry Pi Zero 控制将控制机械手的舵机

    - 如何向项目添加 USB 网络摄像头以“看到”你周围的世界

    - 如何使用 OpenCV，一个开源图像处理库，来判断人类对手是否出示石头、剪刀或布


    ## 一个机械手


    在本章中，你将构建一个具有四根手指、一根拇指和一个可旋转手腕的人类手。实际上，有几种可能的机械手配置可供购买或自行制作。如果你想购买一个已经 3D 打印好的手，我个人最喜欢的是由
    Christopher Chappelle 和 Easton LaChappelle 设计的手，已经在 http://www.shapeways.com/product/Z5CZ2RKLY/3d-printed-hand-right?li=search-results-1&optionId=42512474
    上 3D 打印好了。以下是手的图像：


    ![](img/324d126a7e2da696837a3e066326bd61_186_0.png)


    如果你有 3D 打印机，也可以下载并自行打印手。以下是链接：https://www.thingiverse.com/thing:288856。组装好手后，你需要添加舵机来控制手和手腕。要控制手，你需要拉动从手伸出的五根独立的钓鱼线。以下是这些钓鱼线的图像：


    ![](img/324d126a7e2da696837a3e066326bd61_186_1.png)


    手通常是完全张开的。当你拉动线时，手的每个手指都会闭合。当你松开线时，每个关节背面的橡皮筋会迫使手指和拇指重新张开。你将使用舵机来控制手指和拇指。对于本项目，你只需要三种状态：完全闭合的手（石头）、手腕向侧面时完全张开的手（布），以及拇指、环指和小指闭合而食指和中指完全张开（剪刀）。


    以下是如何将钓鱼线连接到舵机的图像：


    ![](img/324d126a7e2da696837a3e066326bd61_187_0.png)


    将每个手指连接到一个舵机，然后将整个手连接到一个支架；这将作为手腕。你还将把它连接到一个可以转动手腕的舵机。


    ## 移动机械手


    为了移动舵机，你将使用一个类似于第 5 章《构建一个可以行走的机器人》中介绍的舵机控制器来控制六个舵机，这些舵机将控制手指、拇指和手腕。如第 5 章《构建一个可以行走的机器人》中所述，你将为本项目使用的舵机控制器是
    Pololu 使用 USB 的简单舵机电机控制器。但是，由于你只需要控制五个舵机，你可以订购可在 https://www.pololu.com 上获得的六舵机控制器版本。以下是该单元的图像：


    ![](img/324d126a7e2da696837a3e066326bd61_188_0.png)


    确保你订购的是组装版本。这块硬件会将来自 Raspberry Pi Zero 的 USB 命令转换为控制舵机电机的信号。你需要对舵机控制器进行两个连接才能开始：第一个连接到舵机电机，第二个连接到电源。


    首先，将舵机连接到控制器。为了保持一致，让我们将六个舵机连接到控制器上标记为 0 到 5 的连接处，使用以下配置：


    | 舵机连接器 | 舵机 |

    |---|---|

    | 0 | 拇指 |

    | 1 | 食指 |

    | 2 | 中指 |

    | 3 | 环指 |

    | 4 | 小指 |

    | 5 | 手腕 |


    以下是控制器的背面图像；这将告诉我们在哪里连接我们的舵机：


    ![](img/324d126a7e2da696837a3e066326bd61_189_0.png)


    ## 使用 Raspberry Pi Zero 玩石头、剪刀、布


    现在，你需要将舵机电机控制器连接到电源。对于本项目，你可以使用电池，也可以使用专用电源。以下是专用电源的图像，可在大多数在线电子商店购买，可提供大约 3 安培
    6 伏的电量，这对项目是必需的：


    ![](img/324d126a7e2da696837a3e066326bd61_190_0.png)


    电源上的连接已明确标记；你将把 6 伏电源和 GND 连接连接到舵机控制器上标记为 BAT 的连接上。


    > 对这种电源要非常小心，从未在电源插入时对连接到电源的线路进行操作，并且在完成所有连接后最好将电源放在保护外壳中。


    你的系统现在是功能性的。现在，你将把电机控制器连接到你的个人电脑，以检查是否可以像 *第 5 章《构建一个可以行走的机器人》* 中所示那样与之通信。为此，将迷你
    USB 电缆连接到舵机控制器和你的个人电脑之间。


    现在，你可以使用 Pololu Maestro Control Center 上的滑块实际控制舵机。确保舵机 0 移动拇指，1 移动食指前中舵机，2 移动右前上舵机，依此类推。你也可以用它来校准舵机。


    将所有舵机设置在滑块条的一侧，滑块位于一侧，你希望这成为打开设置。滑块条另一侧的设置会拉动钓鱼线，从而将相关手指或拇指移动到闭合设置。现在，拧下每个舵机上的舵机角，直到舵机定位到使手张开时处于舵机运动的一端。当舵机移动到范围的另一端时，手应该闭合。


    你的手现在准备好实际做点什么了。现在，你需要向舵机发送它们需要发出的电子信号以表示石头、剪刀或布。


    ## 将舵机控制器连接到 Raspberry Pi Zero


    你已经检查了舵机电机控制器和舵机；现在你将把电机控制器连接到 Raspberry Pi Zero 并确保可以从它控制舵机。拔下 USB 电缆与 PC 的连接并将其连接到
    Raspberry Pi Zero。


    让我们现在专注于电机控制器，通过从 Pololu 下载 Linux 代码 `www.pololu.com/docs/0J40/3.b`。也许最好的方法是登录你的
    Raspberry Pi Zero 通过 PuTTY，然后输入 `wget http://www.pololu.com/file/download/maestro-linux-100507.tar.gz?file_id=0J315`。然后，使用
    `mv maestro-linux-100507.tar.gz\?file_id\=0J315 maestro-linux-100507.tar.gz` 移动文件。通过输入
    `tar -xzfv maestro-linux-100507.tar.gz` 解压文件。这将创建一个名为 `maestro_linux` 的目录。通过输入
    `cd maestro_linux` 进入该目录，然后输入 `ls -l`；你应该能看到类似以下的内容：


    ![](img/324d126a7e2da696837a3e066326bd61_191_0.png)


    '
