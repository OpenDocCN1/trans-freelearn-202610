    \ how it works, go to `https://www.freebsd.org/doc/en/articles/serial-uart/`.\n\
    \nThe second interface that is available is the I2C interface. The I2C interface\
    \ is similar to the UART interface; it also communicates using two lines, in this\
    \ case a data-line and a clock-line. However, it is a bit more complex, as it\
    \ allows communication between one master and many slave devices. It does this\
    \ by addressing the device the master device wants to communicate with. For more\
    \ information on the I2C interface, see `http://www.robot-electronics.co.uk/i2c-tutorial`.\n\
    \nThe final interface that is available is the **Serial Peripheral Interface (SPI)**\
    \ interface. As with the I2C interface, the SPI interface allows for communication\
    \ between a master device and more than one slave device. However, each slave\
    \ is selected using a different select data line. SPI masters communicate with\
    \ slaves using the **serial clock (SCK)**, **Master Out Slave In (MOSI)**, **Master\
    \ In Slave Out (MISO)**, and **Slave Select (SS)** lines. The SCK, MOSI, and MISO\
    \ signals can be shared by slaves, while each slave has a unique SS line. For\
    \ more information on the SPI interface, see http://www.corelis.com/education/SPI_Tutorial.htm.\n\
    \nSince the device you are going to use is an I2C device, at the back of the compass\
    \ module will be three connections, one for power (VCC), one for ground (GND),\
    \ one for the clock (SCL), and one for data (SDA). The connections are labeled\
    \ as shown in the following image:\n\n![](img/324d126a7e2da696837a3e066326bd61_84_0.png)\n"
  mdcn: "\n\n## 添加超声波传感器\n\n你刚刚构建的基础电路是一个很好的开始。现在你将把一个更复杂的设备——超声波传感器——与 Raspberry\
    \ Pi Zero 接口。以下是你将添加的超声波传感器的图片：\n\n![](img/324d126a7e2da696837a3e066326bd61_77_0.png)\n\
    \n该设备是 HC-SR04，可在大多数在线电子零售商处买到。现在让我们将设备连接到 Raspberry Pi Zero。为此，首先让我们看看 Raspberry\
    \ Pi Zero 上 GPIO 引脚的布局：\n\n| Pin 1 3.3V |  | Pin 2 5V |\n| Pin 3 GPIO2 |  | Pin\
    \ 4 5V |\n| Pin 5 GPIO3 |  | Pin 6 GND |\n| Pin 7 GPIO4 |  | Pin 8 GPIO14 |\n\
    | Pin 9 GND |  | Pin 10 GPIO15 |\n| Pin 11 GPIO17 |  | Pin 12 GPIO18 |\n| Pin\
    \ 13 GPIO27 |  | Pin 14 GND |\n| Pin 15 GPIO22 |  | Pin 16 GPIO23 |\n| Pin 17\
    \ 3.3V |  | Pin 18 GPIO24 |\n| Pin 19 GPIO10 |  | Pin 20 GND |\n| Pin 21 GPIO9\
    \ |  | Pin 22 GPIO25 |\n| Pin 23 GPIO11 |  | Pin 24 GPIO8 |\n| Pin 25 GND |  |\
    \ Pin 26 GPIO7 |\n| Pin 27 ID_SD |  | Pin 28 ID_SC |\n| Pin 29 GPIO5 |  | Pin\
    \ 30 GND |\n| Pin 31 GPIO6 |  | Pin 32 GPIO12 |\n| Pin 33 GPIO13 |  | Pin 34 GND\
    \ |\n| Pin 35 GPIO19 |  | Pin 36 GPIO16 |\n| Pin 37 GPIO26 |  | Pin 38 GPIO20\
    \ |\n| Pin 39 GND |  | Pin 40 GPIO21 |\n\n这两种电阻的组合将电压降低到所需水平。\n以下是面包板上的电路图：\n\n\
    ![](img/324d126a7e2da696837a3e066326bd61_79_0.png)\n\n最后，如图所示将传感器连接到 Raspberry\
    \ Pi Zero：\n\n![](img/324d126a7e2da696837a3e066326bd61_79_1.png)\n\n现在设备已连接，你需要一些代码来读取值，确保其稳定（产生稳定的测量值），然后将其转换为距离。\n\
    \n## Raspberry Pi Zero 和超声波传感器代码\n\n以下是与超声波传感器通信的 Python 代码：\n\n```\n#!/usr/bin/python\n\
    import RPi.GPIO as io\nimport time\n\nio.setmode(io.BCM)\n\ntrig = 23\necho =\
    \ 24\n\nio.setup(trig,io.OUT)\nio.setup(echo,io.IN)\n\nio.setup(trig, False)\n\
    time.sleep(1)\nio.output(trig, True)\ntime.sleep(.00001)\nio.output(trig, False)\n\
    \nwhile io.input(echo) == 0:\n    start = time.time()\n\nwhile io.input(echo)\
    \ == 1:\n    end = time.time()\n\nduration = end - start\ndistance = duration\
    \ * 17150\ndistance = round(distance, 2)\nprint \"Distance: \", distance, \" cm\"\
    \nio.cleanup()\n```\n\n以下是代码的解释：\n\n- #!/usr/bin/python: 这一行让你可以在不输入 python 的情况下运行此程序。你将在这些说明的末尾学习如何做到这一点。\n\
    - `import RPi.GPIO as io`: 这让你可以导入 RPi 库，这将允许你控制 GPIO 引脚。\n- `import time`: time\
    \ 库提供了多个基于时间的功能。在这种情况下，你将使用它来暂停程序一段时间并测量一定的时间延迟。\n- `io.setmode(io.BCM)`: 这将 GPIO\
    \ 引脚的规范模式设置为 Broadcom SOC 通道号（BCM）。这意味着你将指定要控制的 GPIO 引脚号，而不是实际的物理引脚值。\n- `trig\
    \ = 23`: 这将值 23 分配给 trig 变量。\n- `echo = 24`: 这将值 24 分配给 echo 变量。\n- `io.setup(trig,\
    \ io.OUT)`: 这将 GPIO 引脚 23 设置为输出。\n- `io.setup(echo, io.IN)`: 这将 GPIO 引脚 24 设置为输入。\n\
    - `io.setup(trig, False)`: 这将向 trig 线、引脚 23 输出零。\n- `time.sleep(1)`: 此命令将使程序暂停一秒。\n\
    - `io.output(trig, True)`: 这将向 trig 线、引脚 23 输出一个，5 伏。\n- `time.sleep(.00001)`:\
    \ 这将使程序等待大约 10 微秒。\n- `io.output(trig, False)`: 这将向 trig 线、引脚 23 输出零。\n- `while\
    \ io.input(echo) == 0:`: 当引脚 24 的输入为零时。\n- `start = time.time()`: 持续重置开始时间。当引脚\
    \ 24 变高时，start 将保存引脚 24 的值为低时的最新时间。\n- `while io.input(echo) == 1:`: 当输入引脚 24\
    \ 为 1 时执行以下命令集。\n- `end = time.time()`: 持续重置结束时间。当引脚 24 变低时，end 将保存引脚 24 的值为高时的最新时间。\n\
    - `duration = end - start`: duration 现在将保存结束时间和开始时间之间的时间距离。\n- `distance = duration\
    \ * 17150`: distance 将持续时间转换为距离值。\n- `distance = round(distance, 2)`: 将距离四舍五入到小数点后两位。\n\
    - `print \"Distance: \", distance, \" cm\"`: 打印出距离。\n- `io.cleanup()`: 重置接口。\n\
    \n## 在 Raspberry Pi Zero 上访问 GPIO 引脚\n\n现在你应该保存并运行程序并获得结果，如以下屏幕截图所示：\n\n![](img/324d126a7e2da696837a3e066326bd61_82_0.png)\n\
    \n现在你可以用 Raspberry Pi Zero 感知距离！\n\n## 将数字罗盘连接到 Raspberry Pi Zero\n\n现在你已经为 Raspberry\
    \ Pi Zero 创建了一些非常基础的连接，打开和关闭线路并感知高或低信号。现在让我们探索 Raspberry Pi Zero 上可用的其他接口之一，I2C\
    \ 接口。为此，你将连接一个使用这种接口的数字罗盘。\n\n> 有关 I2C 接口的更多信息，请参阅 `http://www.robot-electronics.co.uk/i2c-tutorial`。\n\
    \n有几种芯片提供数字罗盘功能；其中最常见的是 **HMC5883L**，一种 *3 轴* 数字罗盘芯片。该芯片由多家公司封装在模块中，但几乎所有模块的结果都具有相似的接口。\n\
    \n以下是 **GY-271 HMC5883L** 的图片，这是一款三轴罗盘磁力计传感器模块，可在多家在线零售商处买到：\n\n![](img/324d126a7e2da696837a3e066326bd61_83_0.png)\n\
    \n这种类型的数字罗盘使用磁传感器来测量地球的磁场。这些传感器的输出随后通过一组寄存器使外部世界可以访问，允许用户设置诸如采样率和连续或单次采样之类的内容。X、Y\
    \ 和 Z 方向的输出也使用寄存器。\n\n该芯片使用 **Inter IC (I2C)** 总线与 Raspberry Pi Zero 通信。Raspberry\
    \ Pi 的 GPIO 接口上有三个串行总线可用。第一个是标准的 **Universal Asynchronous Receiver/Transmitter\
    \ (UART)** 接口。UART 接口使用一个引脚用于 RX 或接收信号，一个引脚用于 TX 或发送信号。UART 接收字节数据并以顺序传输各个位。在目的地，第二个\
    \ UART 将位重新组装成字节。此接口仅限于与单个外部设备通信。有关 UART 接口及其工作原理的更多信息，请访问 `https://www.freebsd.org/doc/en/articles/serial-uart/`。\n\
    \n第二个可用的接口是 I2C 接口。I2C 接口与 UART 接口类似；它也使用两条线进行通信，在本例中为数据线和时钟线。然而，它更复杂一些，因为它允许一个主设备与多个从设备之间进行通信。它通过寻址主设备想要通信的设备来实现这一点。有关\
    \ I2C 接口的更多信息，请参阅 `http://www.robot-electronics.co.uk/i2c-tutorial`。\n\n最后一个可用的接口是\
    \ **Serial Peripheral Interface (SPI)** 接口。与 I2C 接口一样，SPI 接口允许主设备与多个从设备之间进行通信。然而，每个从设备都使用不同的选择数据线进行选择。SPI\
    \ 主设备使用 **serial clock (SCK)**、**Master Out Slave In (MOSI)**、**Master In Slave\
    \ Out (MISO)** 和 **Slave Select (SS)** 线与从设备通信。SCK、MOSI 和 MISO 信号可以由从设备共享，而每个从设备都有唯一的\
    \ SS 线。有关 SPI 接口的更多信息，请参阅 http://www.corelis.com/education/SPI_Tutorial.htm。\n\
    \n由于你要使用的设备是 I2C 设备，罗盘模块背面将有三个连接，一个用于电源（VCC），一个用于地（GND），一个用于时钟（SCL），一个用于数据（SDA）。连接如以下图像所示：\n\
    \n![](img/324d126a7e2da696837a3e066326bd61_84_0.png)\n\n"
