    # About the Reviewer


    **David Whale** is a software developer living in Essex, UK. He started coding
    as a schoolboy aged 11, inspired by the school science technician to build his
    own computer from a kit and quickly progressed to writing machine code programs
    because they were "small and fast". These early experiments led to some of his
    code being used inside a saleable educational word game when he was only 13.


    He has been developing software professionally ever since, mainly writing small
    and fast code that goes into electronic products, including automated machinery,
    electric cars, mobile phones, energy meters, and wireless doorbells.


    These days, he runs his own software consultancy called Thinking Binaries and
    spends nearly half of his time helping to design the next wave of the Internet
    called The Internet of Things, by connecting electronic devices to it. The rest
    of the time he volunteers for The Institution of Engineering and Technology, running
    training courses for teachers, designing and running workshops and clubs for school
    children, and being busy with his Raspberry Pi, BBC micro:bit and Arduino.


    He was the technical editor for the book *Adventures in Raspberry Pi* and the
    co-author of the book *Adventures in Minecraft*, and is a regular reviewer and
    editor of technical books from a number of book publishers.


    > I was really pleased to be asked to review this great new book of projects using
    the Raspberry Pi Zero. The size of the Pi Zero makes it ideal for building into
    other products. In this book, Richard Grimmett takes us on an amazing journey
    of circuit bending, coding, and innovating using this tiny computer! But don''t
    stop here; the projects in this book will give you the skills you need and inspire
    you to come up with many new ideas yourself!'
