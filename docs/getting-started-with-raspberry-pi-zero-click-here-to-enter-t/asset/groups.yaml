    you may be required to try different .wav files until aplay accepts one. One more
    thing to try, if the system doesn''t seem to know about the program, is to type
    `sudo aplay Dance.wav`.


    Now that you can play sound, you can also record sound. To do this, you have to
    use the **arecord** program. At the prompt, type `arecord -d 5 -r 48000 test.wav`.
    This records the sound at a sample rate of 48000 Hz per 5 seconds. Once you have
    typed the command, either speak into the microphone or make some other recognizable
    sound. You will see the following output in the terminal:


    ![](img/324d126a7e2da696837a3e066326bd61_153_0.png)


    Once you have recorded some audio, stop the recording by pressing *Ctrl + C*.
    Once you have created the file, play it with aplay. Type `aplay test.wav` and
    you should be able to hear the recording. If you can''t hear your recording, check
    alsamixer to make sure that your speakers and microphone are both un-muted.


    Now you can play music or other sound files using your Raspberry Pi. You can change
    the volume of your speaker and record your voice or other sounds on the system.
    You''re now ready for the next step.


    ## Using eSpeak to allow your robot to respond with an audible voice


    Sound is an important tool in our robotic toolkit but you will want to do more
    than just play music. Let''s make our robot speak. You''re going to start by enabling
    **eSpeak**, an open source application that provides us with a computerized voice.
    It is a voice generation application. To get this free functionality, download
    the eSpeak library by typing `sudo apt-get install espeak` at the prompt. The
    download may take a while but the prompt will reappear when it is complete. Now,
    let''s see if The Raspberry Pi Zero has a voice. Type the `espeak hello` command.
    The speaker should emit "hello" in a computer-generated voice. If it does not,
    check the speakers and the volume level.

