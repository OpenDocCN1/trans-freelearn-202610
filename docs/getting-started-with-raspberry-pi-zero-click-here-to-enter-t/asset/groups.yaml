    Emacs 的编辑程序。其他可能性是 nano、vi、vim 和 gedit 等程序。程序员对使用哪种编辑器有强烈的偏好，所以如果你已经有最喜欢的编辑器，可以跳过本节。


    > 如果你想使用 nano 作为编辑器，它已经在 Raspbian 发行版上可用。有关 nano 的更多信息，请参阅 http://www.nano-editor.org/。


    ![](img/324d126a7e2da696837a3e066326bd61_53_0.png)


    如果你想使用 Emacs，通过输入 `sudo apt-get install emacs` 下载并安装它。安装后，你只需输入 `emacs filename`
    即可运行 Emacs，其中 `filename` 是你想要编辑的文件的名称。如果文件不存在，Emacs 将创建它。以下截图显示了你在提示符下输入 `emacs
    example.py` 时会看到的内容：


    ![](img/324d126a7e2da696837a3e066326bd61_54_0.png)


    请注意，与 Windows 不同，Linux 不会自动分配文件扩展名；由你来指定你想要创建的文件类型。Emacs 编辑器还在屏幕左下角指示你已打开一个新文件。现在，如果你在使用
    Raspbian GUI 界面中的 Emacs，无论是因为你连接了显示器、键盘和鼠标，还是因为你正在运行 vncserver，你都可以用鼠标以与在 Microsoft
    Word 中相同的方式使用它。


    然而，如果你通过 SSH 运行 Emacs，你将无法使用鼠标。因此你需要使用光标键导航文件。你还必须使用一些按键命令来保存文件，以及完成你通常会使用鼠标选择的许多其他任务。例如，当你准备好保存文件时，你必须按
    Ctrl + X 和 Ctrl + S，这将以当前文件名保存文件。当你想退出 Emacs 时，你必须按 Ctrl + X 和 Ctrl + C。这将停止 Emacs
    并返回到命令提示符。


    以下是一些你可能会觉得有用的 Emacs 按键命令：


    | Emacs commands | What it does |

    |---|---|

    | `Ctrl + X` and `Ctrl + S` | Save: This command saves the current file. |

    | `Ctrl + X` and `Ctrl + C` | Quit: This command makes you exit Emacs and return
    to the command prompt. |

    | `Ctrl + K` | Kill: This command erases the current line. |

    | `Ctrl + _` | Undo: This command undoes the last action. |

    | Left-click on the text you wish to copy, then place the cursor at the place
    you want to paste, then right-click | Cut and paste: If you select the text you
    want to copy by clicking the mouse, move the cursor to where you want to paste
    the code and then right-click on it; the code will be pasted in that location.
    |


    现在你有了编辑文件的能力，你将在下一节中使用这种能力来创建程序。


    ## Creating and running Python programs


    现在你准备开始编程，你需要选择一种语言。有很多可供选择，例如 C、C++、Java、Python、Perl 以及许多其他可能性。我将首先向你介绍 Python，原因有两个：它是一种简单、直观且非常易于使用的语言，并且它使用了机器人世界的大量开源功能。我们在本章中也会介绍一些
    C/C++，因为某些功能仅在 C/C++ 中可用。然而，从 Python 开始是有意义的。要完成本节中的示例，你需要安装一个 Python 版本。幸运的是，基本的
    Raspbian 系统已经自带一个，所以你已准备好开始。


    我们在这里只会介绍一些非常基础的概念。如果你是编程新手，有许多不同的网站提供交互式教程。如果你想通过这些教程练习 Python 中的一些基本编程概念，请访问
    https://www.codecademy.com 或 http://www.learnpython.org/ 或 https://docs.python.org
    并试试看。


    '
