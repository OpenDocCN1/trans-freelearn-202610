    `/home/pi` 目录中，这是在你首次登录系统时总是开始的目录。


    如果你想随时查看自己所在的目录，只需输入 `pwd`，它代表 print working directory（打印工作目录）。如果你这样做，你会得到结果，类似于以下截图：


    ![](img/324d126a7e2da696837a3e066326bd61_51_0.png)


