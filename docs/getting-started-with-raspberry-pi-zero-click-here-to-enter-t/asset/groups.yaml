    To calculate the distance, use the following equation:


    d = √((Xgoal − Xrobot)² + (Ygoal − Yrobot)²)


    You use this equation to tell your robot how far to travel to reach the goal.
    A second equation tells your robot the angle at which it needs to travel:


    θ = arctan((Ygoal − Yrobot) / (Xgoal − Xrobot))


    > If you''d like a tutorial on the basic math of path planning, see https://www.khanacademy.org/math/trigonometry/trigonometry-right-triangles.


    Here is the graphical representation of these two pieces of information:


    ![](img/324d126a7e2da696837a3e066326bd61_114_0.png)


    Now that you have a goal angle and distance, you can program your robot to move.
    To do this, you need to write a program to do the path planning and call the movement
    functions that you created earlier in the chapter. You need to know the distance
    that your robot will travel in a certain period of time so that you can tell your
    robot in time units, rather than distance units, how far to travel.


    You also need to be able to translate the distance that might be covered by your
    robot in each time unit that you run the motor. If you know the angle and distance,
    you can move your robot towards the goal by turning the robot and then running
    it forward for a certain time.


    Here are the steps that you need to follow:


    - 1. Calculate the distance in units that your robot will travel to reach its
    goal. Convert this into a number of time units to realize this distance.

    - 2. Calculate the angle at which your robot will need to travel to reach its
    goal. You need to use the compass and your robot''s turn functions to turn and
    achieve this angle.

    - 3. Now, call the step function a specified number of times to move your robot
    in the correct distance.


    That''s it. Now you can use some very simple Python code to execute these steps
    using the functions to move the robot forwards and turn it. In this case, it makes
    sense to create a file called robotLib.py with all the functions that do the actual
    servo settings to move the wheeled robot forwards and turn the robot. You then
    import these functions using the from robotLib import * statement so that your
    Python program can call these functions. This makes the path planning Python program
    much smaller and more manageable.


