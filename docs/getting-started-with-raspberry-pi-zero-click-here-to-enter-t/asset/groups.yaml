    \ /home/pi/`. This will copy all the examples to your home directory.\n"
  mdcn: "\n\n文档 README.txt 将会明确说明如何安装软件。这基本上分为两个步骤。首先，通过输入 sudo apt-get install libusb-1.0-0-dev\
    \ mono-runtime libmono-winforms2.0-cil 安装一组支持库，然后通过输入 sudo cp 99-pololu.rules\
    \ /etc/udev/rules.d/ 复制配置文件。\n\n不幸的是，你无法在你的 Raspberry Pi Zero 上运行 Maestro Control\
    \ Center，因为你的 Windows 版本不支持图形界面，但你可以使用 UscCmd 命令行应用程序来控制你的舵机，以确保它们已连接并且工作正常。首先，输入\
    \ ./UscCmd --list，你应该能够看到以下内容：\n\n![](img/324d126a7e2da696837a3e066326bd61_192_0.png)\n\
    \n单元检测到你的舵机控制器。如果你只输入 ./UscCmd，你可以看到可以发送给控制器的所有命令：\n\n```\npi@raspberrypi:~/maestro_linux\
    \ $ ./UscCmd\nUscCmd, Version=1.3.0.0, Culture=neutral, PublicKeyToken=null\n\
    Select one of the following actions:\n  --list                  list available\
    \ devices\n  --configure FILE        load configuration file into device\n  --getconf\
    \ FILE          read device settings and write configuration file\n  --restoredefaults\
    \       restore factory settings\n  --program FILE          compile and load bytecode\
    \ program\n  --status                display complete device status\n  --bootloader\
    \            put device into bootloader (firmware upgrade) mode\n  --stop    \
    \              stops the script running on the device\n  --start             \
    \    starts the script running on the device\n  --restart               restarts\
    \ the script at the beginning\n  --step                  runs a single instruction\
    \ of the script\n  --sub NUM               calls subroutine n (can be hex or decimal)\n\
    \  --sub NUM,PARAMETER     calls subroutine n with a parameter (hex or decimal)\
    \ placed on the stack\n  --servo NUM,TARGET      sets the target of servo NUM\
    \ in units of 1/4 microsecond\n  --speed NUM,SPEED       sets the speed limit\
    \ of servo NUM\n  --accel NUM,ACCEL       sets the acceleration of servo NUM to\
    \ a value 0-255\nSelect which device to perform the action on (optional):\n  --device\
    \ 00001430       (optional) select device #00001430\npi@raspberrypi:~/maestro_linux\
    \ $\n```\n\n请注意，你可以发送舵机到特定的目标角度，尽管目标不是以度为单位，所以很难知道你将舵机发送到哪里。尝试输入 ./UscCmd --servo\
    \ 0, 10。舵机将移动到其最大角度位置。输入 ./UscCmd - servo 0, 0 它将停止舵机试图移动。在下一节中，你将编写一些 Python\
    \ 代码，将你的角度以度为单位转换为舵机控制器希望看到的命令，以便将其移动到特定角度位置。\n\n> 如果你没有运行 Windows 版本的 Maestro\
    \ Controller 并将 Serial Settings 设置为 USB Chained，你的电机控制器可能不会响应。重新运行 Maestro Controller\
    \ 代码并将 Serial Settings 设置为 USB Chained。\n\n## Creating a program on Raspberry\
    \ Pi Zero\n### so that you can control your hand\n\n你现在知道你可以与你的舵机电机控制器对话并移动你的舵机。在本节中，你将创建一个\
    \ Python 程序，让你可以与你的舵机对话以将其移动到特定角度。\n\n让我们从一个简单的程序开始，该程序将定位你的手，使舵机设置为范围的一端（这应该打开手），然后移动到范围的另一端（这应该关闭你的手）。此程序以你在\
    \ *Chapter 5, Building a Robot That Can Walk* 中编写的代码开始。以下是控制舵机的基本代码：\n\n```\n\
    ```python\n#!/usr/bin/python\nimport serial\nimport time\n\ndef setAngle(ser,\
    \ channel, angle):\n    minAngle = 0.0\n    maxAngle = 180.0\n    minTarget =\
    \ 256.0\n    maxTarget = 13120.0\n    scaledValue = int(angle / ((maxAngle - minAngle)\
    \ / (maxTarget - minTarget))) + minTarget\n    commandByte = chr(0x84)\n    channelByte\
    \ = chr(channel)\n    lowTargetByte = chr(scaledValue & 0x7F)\n    highTargetByte\
    \ = chr((scaledValue >> 7) & 0x7F)\n    command = commandByte + channelByte +\
    \ lowTargetByte + highTargetByte\n    ser.write(command)\n    ser.flush()\n\n\
    ser = serial.Serial(\"/dev/ttyACM0\", 9600)\n# Home position\nfor i in range(0,\
    \ 12):\n    setAngle(ser, i, 90)\ntime.sleep(1)\n```\n```\n\n以下是代码的解释：\n\n- `#!/usr/bin/python`:\
    \ 这一行允许你从命令行执行此 Python 文件。\n- `import serial`: 这一行导入 serial 库。你需要 serial 库通过 USB\
    \ 与你的单元对话。\n- `def setAngle(ser, channel, angle)`: 此函数将你期望的舵机和角度设置转换为舵机电机控制器需要的串行命令。\n\
    - `ser = serial.Serial(\"/dev/ttyACM0\", 9600)`: 这打开到你的舵机控制器的串行端口连接。\n- `for i\
    \ in range(0, 12)`: 对于每个舵机\n- `setAngle(ser, i, 90)`: 现在你可以将每个舵机设置为中间位置。这应该使你的手指半开。如果你的手不在中间位置，你可以通过调整每个舵机上舵机角的位置来调整它。\n\
    \n要访问串行端口，你需要确保你已安装 Python serial 库。如果没有，则输入 `sudo apt-get install python-serial`。安装\
    \ serial 库后，你可以通过输入 `sudo python hand.py` 运行你的程序。\n\n一旦你知道将舵机设置为中间角度位置的角度，每个舵机打开或关闭手的角度设置大约在两侧各\
    \ 20 度。最后，你现在可以要求你的手关闭拇指、环指和小指的舵机，这将是剪刀手。你需要为每三种不同位置各提供一个 Python 函数。在这种情况下，你可以使用你的\
    \ `setAngle` 命令设置你的舵机来操纵你的手的六个舵机，以执行纸牌（全部打开）、石头（全部关闭）或剪刀（两个手指伸出，其余关闭）。\n\n由于每个都是一个函数，此代码也具有可被包含在库中以便在你的系统中使用网络摄像头的能力。\n\
    \n![](img/324d126a7e2da696837a3e066326bd61_197_0.png)\n\nThe /dev/video0 is the\
    \ webcam device. Now that your device is connected, let's actually see if you\
    \ can capture the images and video.\n\n> 虽然许多 USB 网络摄像头都可以使用，为了确保这一点，你可能希望从 Logitech\
    \ 等主要网络摄像头制造商处购买网络摄像头。\n\n# Playing Rock, Paper, or Scissors with Raspberry Pi\
    \ Zero\n\n有几个工具可以让你访问网络摄像头，但一个带有视频控制的简单程序称为 guvcview。要安装它，输入 `sudo apt-get install\
    \ guvcview`。安装应用程序后，你需要运行它。为此，你需要直接连接到显示器或使用 vncviewer 连接到远程计算机。在 Raspberry Pi\
    \ 上打开一个终端窗口并运行 guvcview。你应该会看到类似以下内容：\n\n![](img/324d126a7e2da696837a3e066326bd61_198_0.png)\n\
    \n不用担心你将捕获的图像质量，你将在 OpenCV 中处理你的图像，OpenCV 是一个视觉框架。\n\n## Downloading and installing\
    \ OpenCV – a fully featured vision library\n\n现在你已连接了摄像头，你可以访问开源社区提供的一些惊人功能。打开一个终端窗口并输入以下命令：\n\
    \n- `sudo apt-get update`: 你将下载许多新的软件包，因此确保一切都是最新的很有好处。\n- `sudo apt-get install\
    \ libavformat-dev`: 此库提供了一种编码和解码音频和视频流的方法。\n- `sudo apt-get install libcv2.4 libcvaux2.4\
    \ libhighgui2.4`: 此命令显示基本的 OpenCV 库。请注意命令中的数字。随着新版本的 OpenCV 可用，这几乎肯定会发生变化。如果 2.4\
    \ 不起作用，请尝试 3.0 或在 Google 上搜索 OpenCV 的最新版本。\n- `sudo apt-get install python-opencv`:\
    \ 这是 OpenCV 所需的 Python 开发工具包，因为你将使用 Python。\n- `sudo apt-get install opencv-doc`:\
    \ 此命令将下载 OpenCV 的文档，以防你需要它。\n- `sudo apt-get install libopencv-dev`: 此命令下载用于编译\
    \ OpenCV 的头文件和静态库。\n- `sudo apt-get install libopencv-dev`: 此命令下载用于编译 OpenCV 的更多开发工具。\n\
    - `sudo apt-get install libhighgui-dev`: 这是另一个提供用于编译 OpenCV 的头文件和静态库的软件包。\n\n\
    现在，输入 `cp -r /usr/share/doc/opencv-doc/examples /home/pi/`。这将复制所有示例到你的主目录。\n\n"
