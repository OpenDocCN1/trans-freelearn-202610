  - '[PAGE 212]


    The following is an image of the entire quadcopter using the Pixhawk flight controller:


    ![](img/324d126a7e2da696837a3e066326bd61_212_0.png)


    > Note the arrows and cords arranged on the quadcopter. This is not to make it
    look menacing but to protect it from running into something and fracturing the
    propellers. There are commercial guards available; however, this system also works
    and is less expensive.


    You''ll want to build your quadcopter and fly it with an RC transmitter/receiver
    pair; this will allow you to get familiar with your quadcopter and how it flies,
    and it will also allow you to tweak all the settings to stabilize it. Once your
    quadcopter is stable, you can perform some simple autonomous flights. Let''s use
    the mission planning software, which runs on a remote computer.


    # Mission planning software


    The mission planning software is available at http://planner.ardupilot.com/. There
    are actually two applications available that perform similar actions, but the
    Mission Planner is a good place to get familiar with how to talk with your quadcopter
    from a computer program.


    To do this, you''ll need to make sure that you have telemetry radios connected
    to the Pixhawk and the computer. This will prevent the need to directly connect
    to the Pixhawk with a long USB cable. When you begin the mission planning software,
    you will see the following screen:'
  - '[PAGE 213]


    ![](img/324d126a7e2da696837a3e066326bd61_213_0.png)


    This is the basic screen. You''ll then need to configure your radio''s COM port
    and then press the CONNECT button in the corner on the upper right-hand side of
    the screen. As you move the quadcopter around, you will see the measurements change.
    If you are having problems connecting to the Pixhawk, there is lot of help available
    on the website.


    Now that you have connected, you can actually see how your quadcopter is flying
    with this application. The software communicates with the Pixhawk controller via
    the MAVLink, a serial control link that comes from the software application, goes
    out over the telemetry radio, is received by the telemetry radio, and is then
    routed to the Pixhawk. The Pixhawk not only knows how to send information, but
    also receive information.


    Once the software is connected, you''ll want to calibrate the RC radio connection;
    this can be done through the software. You''ll also want to calibrate the ESCs;
    refer to http://learnrobotix.com/uavs/quadocopter-build/pixhawk/calibrating-electronic-speed-controllers-with-pixhawk.html
    for specific directions.'
  - '[PAGE 214]


    <!-- no content -->'
  - '[PAGE 215]


    Now that this is connected, you can access the Pixhawk from Raspberry Pi Zero
    using the MAVLink. You''ll need to add and configure the Raspberry Pi Zero to
    complete the connection. To do this, run `raspi-config` and choose the **8 Advanced
    Options, Configure advanced settings** option, as shown in the following screenshot:


    ![](img/324d126a7e2da696837a3e066326bd61_215_0.png)'
  - '[PAGE 216]


    <!-- no content -->'
  - '[PAGE 217]


    Now you are ready to install some additional software. To install this software,
    perform the following steps:


    +   1. Type `sudo apt-get update`: This updates the local package lists so that
    your system can find the appropriate software.

    +   2. Type `sudo apt-get install screen python-wxgtk2.8 python-matplotlib python-opencv`:
    This installs a graphical package, a plotting package, and a version of OpenCV.

    +   3. Type `sudo apt-get install python-numpy`: This will install **NumPy**,
    a numerical library for Python, although you may already have it from the previous
    projects that you have done.

    +   4. Type `sudo apt-get install python-dev`: This is a set of files that will
    allow you to develop in the Python environment.

    +   5. Type `sudo apt-get install python-pip`: This is a tool that helps you to
    install Python packages.

    +   6. Type `sudo pip install pymavlink`: This is the set of code that implements
    the MAVLink or the communication profile for the Pixhawk, in Python.

    +   7. Type `sudo pip install mavproxy`: This last step installs the **Unmanned
    Aerial Vehicle (UAV)** ground station software package for MAVLink-based systems
    that are based on the Pixhawk.


    Now that you have installed all the software, you can test the link. To do this,
    type `sudo -s`; this establishes you as the superuser. Then type `mavproxy.py
    --master=/dev/ttyAMA0 --baudrate 57600 --aircraft MyCopter` and you will see the
    following:


    ![](img/324d126a7e2da696837a3e066326bd61_217_0.png)'
  - '[PAGE 218]


    Now that the link is established, you can send commands to either set or show
    parameters. For example, type param show ARMING_CHECK; it should show you the
    value of the parameter, as shown in the following screenshot:


    ![](img/324d126a7e2da696837a3e066326bd61_218_0.png)


    Details for all available commands can be found at http://dronecode.github.io/MAVProxy/html/uav_configuration/index.html.


    You can issue these commands directly, but you can also connect to the Pixhawk
    using an interface that is similar to the Mission Planner interface, which you
    have worked with earlier. To do this, you''ll need to install the DroneKit code.
    Overall directions and documentation for DroneKit can be found at http://python.dronekit.io/1.5.0/guide/getting_started.html,
    but let''s see an example here.


    First, type sudo pip install droneapi. You can download some example scripts by
    typing git clone http://github.com/dronekit/dronekit-python.git. Now cd to the
    dronekit-python/examples/vehicle_state directory. You''ll see the vehicle_state.py
    file that shows an excellent example of how to use the MAVLink to talk with the
    Pixhawk to find out information, as well as set values and issue commands.'
  - '[PAGE 219]


    <!-- no content -->'
  - '[PAGE 220]


    # Adding Raspberry Pi Zero to a Quadcopter


    You can also interface the MAVProxy system with the Mission Planner running on
    a remote computer. With a radio connected to the TELEM 1 port of the Pixhawk and
    your Raspberry Pi Zero connected to the TELEM 2 port of the Pixhawk, change the
    MAVProxy start-up command by adding `--out <ipaddress>:14550` with ipaddress being
    the address of the remote computer that is running the Mission Planner. On a Windows
    machine, the `ipconfig` command can be used to determine this IP address.


    For example, your mavproxy command might look similar to this: `mavproxy.py --master=/dev/ttyAMA0
    --baudrate 57600 --out ipaddress:14550 --aircraft MyCopter`. Once connected to
    MAVProxy, you can connect to the Mission Planner software using the UDP connection,
    as shown in the following screenshot:


    ![](img/324d126a7e2da696837a3e066326bd61_220_0.png)


    Now, you can run your MAVProxy scripts and see the results on the Mission Planner
    software.'
  - '[PAGE 221]


    # # Summary


    That''s it. You now have a wide array of different robotics platforms that run
    with Raspberry Pi Zero as the central controller. These chapters have just introduced
    you to some of the most fundamental capabilities of your platforms; you can now
    explore each and expand their capabilities. The only limit is your imagination
    and time.'
