    \ * scale\nbearing = math.atan2(y_out, x_out)\nif (bearing < 0):\n    bearing\
    \ += 2 * math.pi\nprint \"Bearing: \", math.degrees(bearing)\n```\n```\n\nRun\
    \ the code by typing `python compass.py` and you should see the following output:\n\
    \n![](img/324d126a7e2da696837a3e066326bd61_91_0.png)\n\nAs you move the device\
    \ around, you should see this value change to reflect the device's compass direction.\n\
    \nThis is just an example of how to connect an I2C device. There are a number\
    \ of different other devices that can be connected to the GPIO bus of Raspberry\
    \ Pi Zero.\n\n## Summary\n\nThat's it! You've completed your very first hardware\
    \ project. You should now feel at least a little comfortable with Raspberry Pi\
    \ Zero's GPIO bus. In the next chapter, you'll learn how to create a Raspberry\
    \ Pi Zero controlled car.\n\n## 4\n\n## Building and Controlling a Simple Wheeled\
    \ Robot\n\nYou should now be familiar with how to program your Raspberry Pi Zero\
    \ and how to communicate with the outside world with the GPIO. Now, let's actually\
    \ build a mobile project. Perhaps the easiest way to make your projects mobile\
    \ is to use a wheeled platform. In this chapter, you will be introduced to some\
    \ of the basics of manipulating DC motors and using the Raspberry Pi Zero to control\
    \ the speed and direction of your wheeled platform.\n\nIn this chapter, you will\
    \ learn how to perform the following actions:\n\n- Using the Raspberry Pi Zero\
    \ GPIO to control a DC motor\n- Controlling your mobile platform programmatically\
    \ using the Raspberry Pi Zero\n- Implementing some simple path planning algorithms\
    \ on the Raspberry Pi Zero\n\n## The basic platform\n\nYou'll need to add some\
    \ hardware, specifically a wheeled or tracked platform, to make your project mobile.\
    \ You're going to use a platform that uses differential motion to propel and steer\
    \ the vehicle. This simply means that, instead of turning the wheels, you're going\
    \ to vary the speed and direction of the two motors that drive the wheels or tracks.\
    \ There are a lot of choices. Some come fully assembled while others require some\
    \ assembly; alternatively you can buy the components and build your own custom\
    \ mobile platform.\n\nLet's look at a couple of the more popular units that come\
    \ fully assembled or can be assembled with simple tools (a screwdriver or pliers).\
    \ The simplest mobile platform is one that has two DC motors, with each motor\
    \ controlling a single wheel. On the wheeled platform, there is a small wheel\
    \ or ball in the front or at the back. Here is one example of a wheeled platform,\
    \ available at many online electronics retailers:\n\n![](img/324d126a7e2da696837a3e066326bd61_94_0.png)\n\
    \nHere is another simple wheeled platform, also sold by many online electronics\
    \ retailers:\n\n![](img/324d126a7e2da696837a3e066326bd61_94_1.png)\n\nThis one\
    \ also needs to be assembled but it is fairly straightforward. You could also\
    \ choose a tracked platform instead of a wheeled platform. A tracked platform\
    \ has more traction but is not as nimble, as it takes a longer distance to turn.\
    \ Again, manufacturers make pre-assembled units. The following image is an example\
    \ of a pre-assembled tracked platform made by Dagu. It's called the Dagu Rover\
    \ 5 Tracked Chassis:\n\n![](img/324d126a7e2da696837a3e066326bd61_95_0.png)\n\n\
    As part of the platform, you'll need a mobile power supply for the Raspberry Pi\
    \ Zero and your vehicle. I personally like the external 5V rechargeable cell phone\
    \ batteries which are available at almost any place that sells cell phones. These\
    \ batteries can be charged using a USB cable connected either through a DC power\
    \ supply or directly from a computer USB port, as shown in the following image:\n\
    \n![](img/324d126a7e2da696837a3e066326bd61_95_1.png)\n\nYou'll also need a USB\
    \ cable to connect your battery to the Raspberry Pi Zero. Now that you have the\
    \ basic platform, you're ready to start controlling it with the Raspberry Pi Zero.\n\
    \nYou can, however, connect your Raspberry Pi Zero to the DC motors by using an\
    \ H-bridge DC motor controller. An H-bridge is a fairly simple device. It basically\
    \ consists of a set of electronic switches and provides the additional functionality\
    \ of allowing the direction of the current to be reversed so that the motor can\
    \ be run in either forward or reverse directions.\n\nLet's start this example\
    \ by building the H-bridge circuit and controlling just one motor. To do this,\
    \ you need to get an H-bridge. One of the most common options is the L293 dual\
    \ H-bridge chip. This chip allows you to control the direction of the DC motors.\
    \ These are available at most electronics stores and online. Once you have your\
    \ H-bridge, build the circuit as shown in the following image with the Raspberry\
    \ Pi Zero, the motor, the jumper wires, a 4AA battery holder, and a breadboard:\n\
    \n![](img/324d126a7e2da696837a3e066326bd61_97_0.png)\n"
  mdcn: "\n\n要连接该设备，您需要连接 Raspberry Pi Zero 上的 I2C 接口引脚。以下是 GPIO 引脚的详细说明：\n\n![](img/324d126a7e2da696837a3e066326bd61_85_0.png)\n\
    \n您将把设备连接到引脚 1、3、5、7 和 9。对于这些连接，您需要使用母对母跳线：\n\n- 1. 将模块上的 VCC 引脚连接到 Raspberry\
    \ Pi Zero 上的引脚 1 3.3 V，并将 GND 连接到引脚 9 GND。\n- 2. 然后将模块上的 **SCL** 连接到 **引脚 5 GPIO3**，并将\
    \ **SDA** 连接到 Raspberry Pi Zero 上的 **引脚 3 GPIO2**。请注意，您不会连接罗盘上的 **数据就绪 (DRDY)**\
    \ 引脚；这是设备的可选连接。以下是连接：\n\n![](img/324d126a7e2da696837a3e066326bd61_86_0.png)\n\n\
    现在，您已准备好与设备通信。\n\n## 以编程方式访问罗盘\n\n现在设备已连接，您需要通过软件配置访问权限。以下是步骤：\n\n- 1. 为了访问罗盘功能，您需要在\
    \ Raspberry Pi Zero 上启用 I2C 库。要启用此总线，请运行 `sudo raspi-config` 并选择 **9 高级选项**，如下所示：\n\
    \n![](img/324d126a7e2da696837a3e066326bd61_87_0.png)\n\n- 2. 然后转到 A7 I2C 选择并启用\
    \ I2C，如以下屏幕截图所示：\n\n![](img/324d126a7e2da696837a3e066326bd61_87_1.png)\n\n- 3.\
    \ 选择 **是** 以启用 I2C 接口，如以下屏幕截图所示：\n\n![](img/324d126a7e2da696837a3e066326bd61_88_0.png)\n\
    \n- 4. 在下一个屏幕上选择 **确定**，然后在询问是否要默认加载 I2C 内核模块的屏幕上选择 **是**，如下所示：\n\n![](img/324d126a7e2da696837a3e066326bd61_88_1.png)\n\
    \n- 5. 选择 **确定** 返回主选择，然后退出并重新启动您的 Raspberry Pi Zero。\n\n现在您可以检测设备是否已连接。通过输入 sudo\
    \ apt-get install i2c-tools 安装 I2C 工具包。您可以通过输入 sudo i2cdetect -y 1 来查看 I2C 是否已启用，然后您应该会看到类似于以下屏幕截图的内容：\n\
    \n![](img/324d126a7e2da696837a3e066326bd61_89_0.png)\n\n您可以在 1e 看到设备。现在您可以与您的数字罗盘通信。以下是步骤：\n\
    \n- 1. 您需要创建一个 Python 程序。在创建 Python 代码之前，您需要安装 SMBus 功能以访问 I2C。这可以通过输入 sudo apt-get\
    \ install python-smbus 来完成。\n\n## 访问 Raspberry Pi Zero 上的 GPIO 引脚\n\n- 2. 现在重新启动\
    \ Raspberry Pi；您可以使用 smbus 库功能来读取和写入您的 I2C 设备。幸运的是，在这种情况下，设备附带了一些示例代码，说明如何配置设备然后读取值。以下是一个\
    \ Python 代码示例：\n\n![](img/324d126a7e2da696837a3e066326bd61_90_0.png)\n\n```\n\
    ```python\n#!/usr/bin/python\nimport smbus\nimport time\nimport math\nbus = smbus.SMBus(1)\n\
    address = 0x1e\n\ndef read_byte(adr):\n    return bus.read_byte_data(address,\
    \ adr)\ndef read_word(adr):\n    high = bus.read_byte_data(address, adr)\n   \
    \ low = bus.read_byte_data(address, adr+1)\n    val = (high << 8) + low\n    return\
    \ val\ndef read_word_2c(adr):\n    val = read_word(adr)\n    if (val >= 0x8000):\n\
    \        return -((65535 - val) + 1)\n    else:\n        return val\ndef write_byte(adr,\
    \ value):\n    bus.write_byte_data(address, adr, value)\n\nwrite_byte(0, 0b01110000)\
    \ # Set to 8 samples @ 15Hz\nwrite_byte(1, 0b00100000) # 1.3 gain LSB / Gauss\
    \ 1090 (default)\nwrite_byte(2, 0b00000000) # Continuous sampling\nscale = 0.92\n\
    x_out = read_word_2c(3) * scale\ny_out = read_word_2c(7) * scale\nz_out = read_word_2c(5)\
    \ * scale\nbearing = math.atan2(y_out, x_out)\nif (bearing < 0):\n    bearing\
    \ += 2 * math.pi\nprint \"Bearing: \", math.degrees(bearing)\n```\n```\n\n通过输入\
    \ `python compass.py` 运行代码，您应该会看到以下输出：\n\n![](img/324d126a7e2da696837a3e066326bd61_91_0.png)\n\
    \n当您移动设备时，您应该会看到该值发生变化，以反映设备的罗盘方向。\n\n这只是一个如何连接 I2C 设备的示例。还有许多其他不同设备可以连接到 Raspberry\
    \ Pi Zero 的 GPIO 总线。\n\n## 总结\n\n就这样！您已完成了第一个硬件项目。现在您应该对 Raspberry Pi Zero 的 GPIO\
    \ 总线至少感到有点熟悉。在下一章中，您将学习如何创建一个由 Raspberry Pi Zero 控制的汽车。\n\n## 4\n\n## 构建和控制一个简单的轮式机器人\n\
    \n您现在应该熟悉如何编程您的 Raspberry Pi Zero 以及如何使用 GPIO 与外部世界通信。现在，让我们实际构建一个移动项目。让您的项目移动的最简单方法之一是使用轮式平台。在本章中，您将了解有关操纵直流电机以及使用\
    \ Raspberry Pi Zero 控制轮式平台的速度和方向的一些基础知识。\n\n在本章中，您将学习如何执行以下操作：\n\n- 使用 Raspberry\
    \ Pi Zero GPIO 控制直流电机\n- 使用 Raspberry Pi Zero 以编程方式控制您的移动平台\n- 在 Raspberry Pi\
    \ Zero 上实现一些简单的路径规划算法\n\n## 基本平台\n\n为了使您的项目移动，您需要添加一些硬件，特别是轮式或履带式平台。您将使用一个使用差速运动来推进和转向车辆的平台。这仅仅意味着，与其转动车轮，您将改变驱动车轮或履带的两个电机的速度和方向。有很多选择。有些是完全组装好的，而有些需要一些组装；或者您可以购买组件并自行构建定制的移动平台。\n\
    \n让我们看一下几个更受欢迎的单元，它们是完全组装好的或可以用简单工具（螺丝刀或钳子）组装的。最简单的移动平台是具有两个直流电机的平台，每个电机控制一个车轮。在轮式平台上，前部或后部有一个小轮子或滚珠。以下是可在许多在线电子零售商处购买的一个轮式平台示例：\n\
    \n![](img/324d126a7e2da696837a3e066326bd61_94_0.png)\n\n以下是另一个简单的轮式平台，也由许多在线电子零售商销售：\n\
    \n![](img/324d126a7e2da696837a3e066326bd61_94_1.png)\n\n这个也需要组装，但相当简单。您也可以选择履带式平台而不是轮式平台。履带式平台具有更大的牵引力，但灵活性不如轮式平台，因为转弯需要更长的距离。同样，制造商生产预组装单元。以下图像是\
    \ Dagu 生产的预组装履带式平台的示例。它被称为 Dagu Rover 5 履带底盘：\n\n![](img/324d126a7e2da696837a3e066326bd61_95_0.png)\n\
    \n作为平台的一部分，您需要为 Raspberry Pi Zero 和您的车辆提供移动电源。我个人喜欢外部 5V 可充电手机电池，这些电池在几乎任何销售手机的地方都有售。这些电池可以使用\
    \ USB 电缆通过 DC 电源或直接从计算机 USB 端口充电，如下图所示：\n\n![](img/324d126a7e2da696837a3e066326bd61_95_1.png)\n\
    \n您还需要一根 USB 电缆将电池连接到 Raspberry Pi Zero。现在您拥有了基本平台，可以开始使用 Raspberry Pi Zero 控制它了。\n\
    \n然而，您可以通过使用 H 桥直流电机控制器将 Raspberry Pi Zero 连接到直流电机。H 桥是一个相当简单的设备。它基本上由一组电子开关组成，并提供额外的功能，允许电流方向反转，以便电机可以在正向或反向运行。\n\
    \n让我们通过构建 H 桥电路并控制单个电机来开始这个示例。为此，您需要获取一个 H 桥。最常见的选项之一是 L293 双 H 桥芯片。该芯片允许您控制直流电机的方向。这些在大多数电子商店和在线商店都有售。一旦您拥有\
    \ H 桥，请使用以下图像中所示的 Raspberry Pi Zero、电机、跳线、4AA 电池盒和面包板构建电路：\n\n![](img/324d126a7e2da696837a3e066326bd61_97_0.png)\n\
    \n"
