    # 5


    ## Building a Robot That Can Walk


    Now that you are familiar with robots that can navigate using tracks or wheels,
    let''s build one that can walk. Walking robots are interesting as they can navigate
    the terrain where wheeled or tracked vehicles can''t go. They also provide advanced
    functions where the robot can use their legs for purposes other than walking.


    In this chapter, you will build the basic quadruped platform. To do this you will
    learn:


    - How servos work

    - How to use the Raspberry Pi to control lots of servos using a servo controller

    - Creating complex movements out of simple servo commands


    ### Robots that can walk


    In this chapter, you''ll build a quadruped robots. You''ll be using 12 servos
    so that each leg has three points that can move, or three Degrees of Freedom (DOF).
    In this project, you''ll control 12 servos at the same time; so it makes sense
    to use an external servo controller that can supply the control signals and supply
    voltages for all 12 servos. Since servos are the main component of this project,
    it will perhaps be useful to go through a tutorial on servos and learn how to
    control them.


    ## How servo motors work


    Servo motors are similar to DC motors; however, there is an important difference.
    While DC motors are generally designed to move in a continuous way – rotating
    360 degrees at a given speed – servos are generally designed to move in a limited
    set of angles. In other words, in the DC motor world, you generally want your
    motors to spin with a continuous rotation speed that you control. In the servo
    world, you want your motor to move to a specific position that you control. This
    is done by sending a Pulse-Width-Modulated (PWM) signal on the control connector
    of the servo. PWM simply means that you are going to change the length of each
    pulse of electrical energy in order to control something. In this case, the length
    of this pulse will control the angle of the servo, as shown:


    ![](img/324d126a7e2da696837a3e066326bd61_118_0.png)


    These pulses are sent out with a repetition rate of 60 Hz. You can position the
    servo at any angle by setting the correct control pulse.


