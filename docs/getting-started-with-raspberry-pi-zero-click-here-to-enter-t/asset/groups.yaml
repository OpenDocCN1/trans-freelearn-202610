    # 5


    ## Building a Robot That Can Walk


    现在你已经熟悉了使用履带或轮子导航的机器人，让我们构建一个可以行走的机器人。行走机器人很有趣，因为它们可以在轮式或履带式车辆无法通行的地形上导航。它们还提供高级功能，机器人可以用腿来做行走以外的用途。


    在本章中，你将构建基础的四足平台。为此你将学习：


    - 伺服电机的工作原理

    - 如何使用 Raspberry Pi 通过伺服控制器控制大量伺服电机

    - 从简单的伺服命令创建复杂运动


    ### Robots that can walk


    在本章中，你将构建四足机器人。你将使用 12 个伺服电机，以便每条腿有三个可以移动的点，或三个自由度（DOF）。在这个项目中，你将同时控制 12 个伺服电机；因此，使用一个可以为所有
    12 个伺服电机提供控制信号和供电电压的外部伺服控制器是有意义的。由于伺服电机是本项目的主要部件，因此也许有用的是通过教程了解伺服电机并学习如何控制它们。


    ## How servo motors work


    伺服电机与直流电机相似；然而，有一个重要的区别。虽然直流电机通常设计为以给定的速度连续旋转 360 度的方式移动，但伺服电机通常设计为在有限的一组角度内移动。换句话说，在直流电机世界中，你通常希望你的电机以你控制的连续旋转速度旋转。在伺服电机世界中，你希望你的电机移动到你控制的特定位置。这是通过在伺服电机的控制连接器上发送脉冲宽度调制（PWM）信号来完成的。PWM
    只是意味着你将改变每个电脉冲的持续时间以控制某物。在这种情况下，该脉冲的长度将控制伺服电机的角度，如图所示：


    ![](img/324d126a7e2da696837a3e066326bd61_118_0.png)


    这些脉冲以 60 Hz 的重复频率发送。你可以通过设置正确的控制脉冲将伺服电机定位在任何角度。


    ## Building the quadruped platform


    你首先需要一些零件，才能构建你的四足机器人。有几个套件可能性，包括在 http://www.trossenrobotics.com/p/PhantomX-AX-12-Quadruped.aspx。然而，这样的套件可能很昂贵；因此，对于这个示例，你将使用一套
    Lynxmotion 零件创建自己的套件。这些零件可在多个在线零售商处获得，例如 http://www.robotshop.com/。要构建这个四足机器人，你需要两套两种腿部零件，然后每种身体一套。以下是零件及其
    Robotshop 零件编号：


    | Quantity | Description |

    |---|---|

    | 1 | Lynxmotion Symmetric Quadrapod Body Kit - Mini QBK-02 |

    | 2 | Lynxmotion 3" Aluminum Femur Pair |

    | 2 | Lynxmotion Robot Leg "A" Pair (No Servo) RL-01 |

    | 4 | Lynxmotion Aluminum Multipurpose Servo Bracket Two Pack ASB-04 |

    | 2 | Ball Bearing with Flange - 3mm ID (pair) Product Code: RB-Lyn-317 |


    最后一个零件不是 Lynxmotion 零件，而是你需要将腿连接到身体的轴承。


    你还需要 12 个标准尺寸的伺服电机。有几个可能的选择，但我个人喜欢 Hitec 伺服电机。它们是非常便宜的伺服电机，你可以在大多数爱好商店和在线电子零售商处购买。现在是时候了解一些关于选择伺服电机型号的细节了。伺服电机有不同的型号编号，主要基于它们能产生的扭矩量。


    **扭矩** 是伺服电机可以施加以移动与其连接的部件的力。在这种情况下，你的伺服电机需要抬起和移动与四足机器人相关的重量，因此你需要一个扭矩足够的伺服电机。在这种情况下，我建议你使用八个型号
    HS-485HB 伺服电机。你将使用它们用于连接到腿末端的伺服电机和身体。然后你将使用四个型号 HS-645MG 伺服电机用于腿部中间；这是需要最高扭矩的伺服电机。你也可以只使用十二个
    HS-645MG 伺服电机，但它们比 HS-485 贵，所以使用两种不同的伺服电机会更便宜。


