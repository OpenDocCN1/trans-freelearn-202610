    ## 8

    Playing Rock, Paper, or Scissors with Raspberry Pi Zero


    You''ve now built several projects with Raspberry Pi Zero. Now, you''ll take some
    of these capabilities and add it to a new project, such as the ability to see
    and determine what is going on around you using a USB webcam and an open source
    library called OpenCV. In this project, you''ll control a robotic hand to play
    the classic decision-making game; rock, paper, or scissors.


    In this chapter, you will build a basic robotic hand and then use it to play rock,
    paper, or scissors. In this chapter, you will learn:


    - How to use Raspberry Pi Zero to control servos that will control a robotic hand

    - How to add a USB webcam to the project to "see" the world around you

    - How to use OpenCV, an open source image processing library, to determine whether
    the human opponent is showing rock, paper, or scissors


    ## A robotic hand


    In this chapter, you''ll build a human hand that has four fingers, a thumb, and
    a rotating wrist. There are actually several possible robotic hand configurations
    that you can purchase or build yourself. If you''d like to purchase an already
    3D printed hand, my personal favorite is the hand that was designed by Christopher
    Chappelle and Easton LaChappelle, available already 3D printed at http://www.shapeways.com/product/Z5CZ2RKLY/3d-printed-hand-right?li=search-results-1&optionId=42512474.
    Here is an image of the hand:


    ![](img/324d126a7e2da696837a3e066326bd61_186_0.png)


    If you have access to a 3D printer, you can also download and print the hand yourself.
    Here is the link: https://www.thingiverse.com/thing:288856. Once you have assembled
    the hand, you''ll need to add the servos to control the hand and the wrist. To
    control the hand, you''ll pull on five separate fishing lines that come out of
    the hand. Here is an image of those fishing lines:


    ![](img/324d126a7e2da696837a3e066326bd61_186_1.png)


    The hand is normally fully open. When you pull on the lines, each of the digits
    of the hand closes. When you release the lines, rubber bands on the back of each
    joint force the fingers and thumb back open. You''ll use the servos to control
    the fingers and thumb. For this project, you''ll only need three states: the fully-closed
    hand (rock), the fully-open hand with the sideways wrist (paper), and the thumb,
    ring finger and little finger closed with the index and pointer finger fully open
    (scissors).


    Here is an image of how to connect the fishing lines to a servo:


    ![](img/324d126a7e2da696837a3e066326bd61_187_0.png)


    Connect each of the digits to a servo, and then connect the entire hand to a bracket;
    this will act as the wrist. You''ll also connect this to a servo that can turn
    the wrist.


    ## Moving the robotic hand


    In order to move the servos, you''ll use a servo controller similar to the one
    introduced in Chapter 5, Building a Robot That Can Walk, to control six servos
    that will control the fingers, thumb, and wrist. As in Chapter 5, Building a Robot
    That Can Walk, the servo controller you are going to use for this project is a
    simple servo motor controller using the USB from Pololu. However, since you only
    need to control five servos, you can order the six-servo controller version available
    at https://www.pololu.com. Here is an image of the unit:


    ![](img/324d126a7e2da696837a3e066326bd61_188_0.png)


    Make sure you order the assembled version. This piece of hardware will turn the
    USB commands from the Raspberry Pi Zero into signals that control your servo motors.
    There are two connections that you''ll need to make to the servo controller to
    get started: the first to the servo motors and the second to a power source.


    First, connect the servos to the controller. In order to be consistent, let''s
    connect your six servos to the connections marked 0 through 5 on the controller,
    using this configuration:


    | Servo connector | Servo |

    |---|---|

    | 0 | Thumb |

    | 1 | Index finger |

    | 2 | Middle finger |

    | 3 | Ring finger |

    | 4 | Little finger |

    | 5 | Wrist |


    Here is an image of the back of the controller; this will tell us where to connect
    our servos:


    ![](img/324d126a7e2da696837a3e066326bd61_189_0.png)


    ## Playing Rock, Paper, or Scissors with Raspberry Pi Zero


    Now, you need to connect the servo motor controller to a power source. For this
    project, you can use a battery but you can also use a dedicated power supply.
    Here is an image of a dedicated power supply, available at most on-line electronics
    outlets that can provide approximately 3 amps at 6 volts, which you''ll need for
    the project:


    ![](img/324d126a7e2da696837a3e066326bd61_190_0.png)


    The connections on the power supply are clearly marked; you''ll connect the 6-volt
    power supply and GND connections to the connections marked BAT on the servo controller.


    > Be very careful with this kind of power supply, never work on the wiring connected
    to the supply when the power supply is plugged in, and it is best to place the
    power supply in a protective enclosure after you have completed all the connections.


    Your system is now functional. Now, you''ll connect the motor controller to your
    personal computer to check to see if you can communicate with it as shown in *Chapter
    5, Building a Robot That Can Walk*. To do this, connect a mini USB cable between
    the servo controller and your personal computer.


    Now, you can use the sliders on the Pololu Maestro Control Center to actually
    control the servos. Make sure that servo 0 moves the thumb, 1 the index finger
    front middle servo, 2 the right front upper servo, and so on. You can also use
    this to calibrate the servos.


    Set all of the servos so that the slider is on one side of the slider bar, as
    you will want this to be the open setting. The setting on the other side of the
    slider bar will pull the fishing line, and thus move the associated finger or
    thumb to the closed setting. Now, unscrew the servo horn on each servo until the
    servos are positioned so that the open hand is at one end of the servo''s movement.
    When the servos move to the other end of the range, the hand should close.


    Your hand is now ready to actually do something. Now, you''ll need to send the
    servos the electronic signals they need to signal rock, paper, or scissors.


