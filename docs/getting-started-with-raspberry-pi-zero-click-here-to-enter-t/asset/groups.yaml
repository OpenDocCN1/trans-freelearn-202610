    are specified by female or male ends, depending on the type of connection. Here
    is a picture of a male to female jumper wire, with the ends labeled:


    ![](img/324d126a7e2da696837a3e066326bd61_70_0.png)


    For these projects, you''ll want some female to male jumper cables and some female
    to female jumper cables.


    3. A Light Emitting Diode (LED) is a small component with two leads that light
    up when a voltage is applied. They come in a wide variety of colors. If you want
