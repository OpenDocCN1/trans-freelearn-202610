    ![](img/324d126a7e2da696837a3e066326bd61_145_0.png)


    To run this program, type python argControl.py f and the robot will respond to
    that command. To make this program executable without the Python command, type
    chmod +x argControl.py and you will be able to run the program by typing ./argControl.py
    f. You''ll need this later when you want to run this program from your voice control
    program.


    ## Giving your robot voice commands


    Now that your robot knows how to respond to the commands from the Python program,
    you can add the ability to your robot to respond to voice commands. You''ll also
    make your robot speak, which will make the robot more interactive.


    ## Adding Voice Recognition and Speech – A Voice Activated Robot


    To add these capabilities to your robot, you need to add some new hardware. This
    project requires a USB microphone and speaker adapter. You need the following
    three pieces of hardware:


    - A USB device to be able to plug in a microphone and speaker; one that works
    well is Sabrent USB External Stereo Sound Adapter for Windows and Mac, as shown
    here:


    ![](img/324d126a7e2da696837a3e066326bd61_146_0.png)


    - A microphone that can plug into the USB device; any such device might work,
    like the one shown here:


    ![](img/324d126a7e2da696837a3e066326bd61_146_1.png)


    - A powered speaker that can plug into the USB device; any device that can plug
    into your USB adapter would work, such as something similar to what is shown here:


    ![](img/324d126a7e2da696837a3e066326bd61_147_0.png)


    Fortunately, these devices are inexpensive and widely available. Make sure that
    the speaker is powered because your board will generally not be able to drive
    a passive speaker with enough power for your applications. The speaker can use
    either internal battery power or can get its power from a USB connection.


    Now, we move on to getting the Raspberry Pi Zero to access these devices. You
    can follow these instructions in either of the two following ways:


    - If you are still connected to the display, keyboard, and mouse, log in to the
    system and use the GUI by opening a terminal window

    - If you are only connected through LAN, you can do all this by using an SSH terminal
    window; as soon as your board indicates that it has power, open up an SSH terminal
    window using PuTTY or any similar terminal emulator


    Plug the devices into a USB port. Once the terminal window comes up, type `cat
    /proc/asound/cards`. You will get the following response:


    ![](img/324d126a7e2da696837a3e066326bd61_148_0.png)


    There are two possible audio devices that you can use. The first is the internal
    Raspberry Pi audio, which is connected to the audio port, and the second is the
    USB audio plugin. You could use the USB audio plugin to record the sound and the
    Raspberry Pi for the audio output to play the sound, though it is easier to just
    use the USB audio plugin to create and record sound.


    Firstly, you need to play some music to test whether the USB sound device is working
    or not. You need to configure your system to search for your USB audio plugin
    and use it as the default plugin to play and record sound. To do this, you need
    to add a couple of libraries to your system. The first libraries are the **Advanced
    Linux Sound Architecture (ALSA)** libraries. These will enable the sound on the
    Raspberry Pi if you perform the following steps:


    - 1. Install two libraries that are associated with ALSA by typing `sudo apt-get
    install alsa-base alsa-utils`.

    - 2. Then, install those files that help to provide the sound library by typing
    `sudo apt-get install libasound2-dev`.


    3. C-Media USB Audio Device is my USB audio device. You should now be able to
    see a screen that looks similar to the following screenshot:


    ![](img/324d126a7e2da696837a3e066326bd61_150_0.png)


    4. You can use the arrow keys to set the volume for both the speakers and the
    microphone. Use the M key to un-mute the microphone. In the preceding screenshot,
    MM is mute and oo is un-mute.


    5. Let''s make sure that our system knows about our USB sound device. At the command
    prompt, type `aplay -l`. You should now be able to see the following screenshot:


    ![](img/324d126a7e2da696837a3e066326bd61_150_1.png)


    If this does not work, try `sudo aplay -l`. You need to add a file to your home
    directory called `.asoundrc`. This will be read by your system and used to set
    your default configuration. To do this, perform the following steps:


    - 1. Open the file named `.asoundrc` using the editor of your choice.

    - 2. Type `pcm.!default sysdefault:Set`. `Set` is the variable that appears right
    after `card 1:` in the output of the `aplay -l` command.

    - 3. Save the file. The file should appear as follows:


    ![](img/324d126a7e2da696837a3e066326bd61_151_0.png)


    This will tell the system to use your USB device as the default. Reboot your system.


    ## Adding Voice Recognition and Speech – A Voice Activated Robot


    Now, you can play some music. To do this, you need a sound file and a device to
    play it. You can copy a simple .wav file to your Raspberry Pi Zero. If you are
    using a Linux machine as your host, you can also use the scp command from the
    command line to transfer the file. You can download music onto the Raspberry Pi
    Zero by using a web browser if you have a keyboard, mouse, and display connected.
    You use the application named **aplay** to play sound. Type `aplay Dance.wav`
