    你的光标位于命令提示符处。与 Microsoft Windows 或 macOS 不同，在 Linux 中，我们的大部分工作都是通过在命令行中实际输入命令来完成的。所以，让我们试试几个命令。当你输入
    `ls` 时，你应该能看到类似于以下截图的结果：


    ![](img/324d126a7e2da696837a3e066326bd61_49_0.png)


    在 Linux 中，`ls` 命令列出当前目录中的所有文件和目录。你可以通过它们通常不同的颜色来区分不同的文件类型和目录。你也可以使用 `ls -l` 来查看有关文件的更多信息。


    你可以通过发出 `cd`（change directory，切换目录）命令在目录结构中移动。例如，如果你想查看 Desktop 目录中的内容，输入 `cd
    Desktop`。如果现在发出 `ls` 命令，你应该会看到类似于以下截图的内容：


    ![](img/324d126a7e2da696837a3e066326bd61_50_0.png)


