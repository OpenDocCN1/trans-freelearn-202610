    > Specifics on the board can be found at

    > http://www.monkmakes.com/?page_id=698.


    The board will provide you with two key signals to your RC car, the drive signal
    and the turn signal. You''ll need one more additional signal, the PWM signal that
    enables the steering control. The following are the steps to connect Raspberry
    Pi to the board:


    - 1. First, connect the battery power connector to the power connector on the
    board, as shown in the following image:


    ![](img/324d126a7e2da696837a3e066326bd61_173_0.png)


    ## Adding Raspberry Pi Zero to an RC Vehicle


    - 2. Next, connect the rear drive signal to the motor 1 connectors on the board,
    as in the following image:


    ![](img/324d126a7e2da696837a3e066326bd61_174_0.png)


    - 3. Connect the front drive connector to the motor 2 connectors on the board,
    as shown in the following image:


    ![](img/324d126a7e2da696837a3e066326bd61_174_1.png)


    4. Connect the 3.3-volt and GND connectors to the General Purpose Input/ Output
    (GPIO) pins of Raspberry Pi. Here is a layout of these pins:


    | Pin 1 3.3V | Pin 2 5V |

    |---|---|

    | Pin 3 GPIO2 | Pin 4 5V |

    | Pin 5 GPIO3 | Pin 6 GND |

    | Pin 7 GPIO4 | Pin 8 GPIO14 |

    | Pin 9 GND | Pin 10 GPIO15 |

    | Pin 11 GPIO17 | Pin 12 GPIO18 |

    | Pin 13 GPIO27 | Pin 14 GND |

    | Pin 15 GPIO22 | Pin 16 GPIO23 |

    | Pin 17 3.3V | Pin 18 GPIO24 |

    | Pin 19 GPIO10 | Pin 20 GND |

    | Pin 21 GPIO9 | Pin 22 GPIO25 |

    | Pin 23 GPIO11 | Pin 24 GPIO8 |

    | Pin 25 GND | Pin 26 GPIO7 |

    | Pin 27 ID_SD | Pin 28 ID_SC |

    | Pin 29 GPIO5 | Pin 30 GND |

    | Pin 31 GPIO6 | Pin 32 GPIO12 |

    | Pin 33 GPIO13 | Pin 34 GND |

    | Pin 35 GPIO19 | Pin 36 GPIO16 |

    | Pin 37 GPIO26 | Pin 38 GPIO20 |

    | Pin 39 GND | Pin 40 GPIO21 |


    5. You''ll use Pin1 3.3V for the 3.3-volt signal and Pin 9 GND for the ground
    signal. You''ll connect one of the GPIO pins so that you can create the 320 Hz,
    10 percent duty cycle signal to enable the steering. Connect GPIO pin 18, pin
    12, as shown in the following image:


    ![](img/324d126a7e2da696837a3e066326bd61_175_0.png)


    Now the hardware is connected.


    ## Controlling the RC car in Python


    The hardware is ready, now you can access all this functionality from Raspberry
    Pi Zero. First, install the library associated with the control board, found at
    `http://www.monkmakes.com/?page_id=698` and perform the following steps:


    - 1. Run the command `wget https://github.com/simonmonk/raspirobotboard2/raw/master/python/dist/rrb2-1.1.tar.gz`.
    This will retrieve the library.

    - 2. Then, run `tar -xzf rrb2-1.1.tar.gz`. This will unarchive the files.

    - 3. Type `cd rrb2-1.1`. This will change the directory to the location of the
    files.

    - 4. Type `sudo python setup.py install`. This will install the files.


    Now you''ll create some Python code that will allow you to access both the drive
    motor and the steering motor. The code will look similar to the following screenshot:


    ![](img/324d126a7e2da696837a3e066326bd61_176_0.png)


    The specifics on the code are as follows:


    - - `import RPi.GPIO as GPIO`: This will import the RPi.GPIO library, allowing
    you to send out a PWM signal to the front steering mechanism.

    - - `import time`: This will import the time library, allowing you to use the
    time.sleep(number_of_milliseconds), which causes a fixed delay.

    - - `from rrb2 import *`: This will import the rrb2 library, allowing you to control
    the two DC motors. The rrb2 is the library you just downloaded from GitHub.

    - - `pwmPin = 18`: This will set the PWM pin to GPIO pin 18, which is physical
    pin 12 on the Raspberry Pi.

    - - `dc = 10`: This will set the duty cycle to 10 percent on the PWM signal.

    - - `GPIO.setmode(GPIO.BCM)`: This will set the definition mode in the RPi.GPIO
    library to the BCM mode, allowing you to specify the GPIO numbers of the PWM signal.

    - - `GPIO.setup(pwmPin, GPIO.OUT)`: This will set the PWM pin to an output so
    that you can drive the control circuitry on the steering.

    - - `pwm = GPIO.PWM(pwmPin, 320)`: This will initialize the PWM signal on the
    proper pin and set the PWM signal to 320 Hz.

    - - `rr = RRB2()`: This will create an instance of the motor controller.

    - - `pwm.start(dc)`: This will start the PWM signal.

    - - `rr.set_led1(1)`: This will light LED 1 on the motor controller board.

    - - `rr.set_motors(1, 1, 1, 1)`: This will set both the motors to move so that
    the vehicle goes in the forward direction. This command will allow you to set
    the motors to forward or reverse and set it at a specific speed. The first number
    is the speed of motor 1 and goes from 0 to 1. The second number is the direction
    of motor 1, where 1 is forward and 0 is reverse. The third number is the speed
    of motor 2, which also goes from 0 to 1, and the fourth number is the reverse
    and forward setting of the second motor, either 1 or 0.

    - - `print("Loop, press CTRL C to exit")`: This will instruct the user how to
    stop the program.

    - - `while 1:`: This will keep looping until Ctrl + C is pressed.

    - - `time.sleep(0.075)`: Causes the program to wait for 0.075 seconds.

    - - `pwm.stop()`: This will stop the PWM signal.

    - - `GPIO.cleanup()`: This will clean up the GPIO driver and prepare for shutdown.


    ## Adding Raspberry Pi Zero to an RC Vehicle


    Now you can run the program by typing `sudo python xmod.py`. When you run this,
    the LED 1 on the control board should turn on, the rear wheels should move in
    the forward direction, and the steering should turn. This confirms that you have
    connected everything correctly. To make this a bit more interesting, you can add
    more dynamic control of the motors by adding some control code. The following
    is the first part of the Python code:


    ![](img/324d126a7e2da696837a3e066326bd61_178_0.png)


    Before you start, you may want to copy your Python code into a new file; you can
    call it `xmodControl.py`. In this code, you''ll have some additional `import`
    statements; these will allow you to sense key presses from the keyboard without
    hitting the enter key, this will make the real-time interface seem more real time.
    The `getch()` function senses the actual key press.


    The rest of this code will look similar to the previous program. Now, the second
    part of this code is as follows:


    ![](img/324d126a7e2da696837a3e066326bd61_179_0.png)


    The second part of the code is a while loop that takes the input and translates
    it into commands for your RC car, going forward and backward and turning right
    and left. This program is quite simple; you''ll almost certainly want to add more
    commands that provide more ways to control the speed and direction.


    ## Accessing the RC car remotely


    You can now control your RC car, but you certainly want to do this without any
    connected cables. This section will show you how to add a wireless LAN device
    so that you can control your car remotely. In *Chapter 1, Getting Started with
    Raspberry Pi Zero*, you learned how to access Raspberry Pi Zero from a host computer.
    However, for this to work you need your Raspberry Pi Zero to be connected to a
    network, either with a LAN cable or a wireless network. What if you want to drive
    your car where there is no network, but still connect to it? You can do this by
    making your Raspberry Pi Zero a wireless access point.


    ## Adding Raspberry Pi Zero to an RC Vehicle


    Setting up Raspberry Pi Zero as a WLAN access point depends upon the USB WLAN
    adapter you choose; see `http://elinux.org/RPI-Wireless-Hotspot` for some of the
    devices supported and how to configure them. I chose the Edimax USB WLAN adapter,
    pictured here:


    ![](img/324d126a7e2da696837a3e066326bd61_180_0.png)


    This device can be configured using the script found at `http://blog.sip2serve.com/post/4889983167/rtl8188-access-point-install-script`.
    Here are the steps:


    - 1. Type `wget https://dl.dropboxusercontent.com/u/1663660/scripts/install-rtl8188cus.sh`.
    This gets the script content.

    - 2. Type `sudo chown root:root install-rtl8188cus.sh`. This changes the owner
    so that you can install the script.

    - 3. Type `sudo chmod 755 install-rtl8188cus.sh`. This changes the script''s executable
    permission so you can execute it.

    - 4. Finally, type `sudo ./install-rtl8188cus.sh` to run the script. This runs
    the script and configures the device. You will be asked for the name you want
    to use for the access point and the password.

