    \ http://learnrobotix.com/uavs/quadocopter-build/pixhawk/calibrating-electronic-speed-controllers-with-pixhawk.html\
    \ for specific directions.\n\nNow that this is connected, you can access the Pixhawk\
    \ from Raspberry Pi Zero using the MAVLink. You'll need to add and configure the\
    \ Raspberry Pi Zero to complete the connection. To do this, run `raspi-config`\
    \ and choose the **8 Advanced Options, Configure advanced settings** option, as\
    \ shown in the following screenshot:\n\n![](img/324d126a7e2da696837a3e066326bd61_215_0.png)\n\
    \nNow you are ready to install some additional software. To install this software,\
    \ perform the following steps:\n\n- 1. Type `sudo apt-get update`: This updates\
    \ the local package lists so that your system can find the appropriate software.\n\
    - 2. Type `sudo apt-get install screen python-wxgtk2.8 python-matplotlib python-opencv`:\
    \ This installs a graphical package, a plotting package, and a version of OpenCV.\n\
    - 3. Type `sudo apt-get install python-numpy`: This will install **NumPy**, a\
    \ numerical library for Python, although you may already have it from the previous\
    \ projects that you have done.\n- 4. Type `sudo apt-get install python-dev`: This\
    \ is a set of files that will allow you to develop in the Python environment.\n\
    - 5. Type `sudo apt-get install python-pip`: This is a tool that helps you to\
    \ install Python packages.\n- 6. Type `sudo pip install pymavlink`: This is the\
    \ set of code that implements the MAVLink or the communication profile for the\
    \ Pixhawk, in Python.\n- 7. Type `sudo pip install mavproxy`: This last step installs\
    \ the **Unmanned Aerial Vehicle (UAV)** ground station software package for MAVLink-based\
    \ systems that are based on the Pixhawk.\n\nNow that you have installed all the\
    \ software, you can test the link. To do this, type `sudo -s`; this establishes\
    \ you as the superuser. Then type `mavproxy.py --master=/dev/ttyAMA0 --baudrate\
    \ 57600 --aircraft MyCopter` and you will see the following:\n\n![](img/324d126a7e2da696837a3e066326bd61_217_0.png)\n\
    \nNow that the link is established, you can send commands to either set or show\
    \ parameters. For example, type param show ARMING_CHECK; it should show you the\
    \ value of the parameter, as shown in the following screenshot:\n\n![](img/324d126a7e2da696837a3e066326bd61_218_0.png)\n\
    \nDetails for all available commands can be found at http://dronecode.github.io/MAVProxy/html/uav_configuration/index.html.\n\
    \nYou can issue these commands directly, but you can also connect to the Pixhawk\
    \ using an interface that is similar to the Mission Planner interface, which you\
    \ have worked with earlier. To do this, you'll need to install the DroneKit code.\
    \ Overall directions and documentation for DroneKit can be found at http://python.dronekit.io/1.5.0/guide/getting_started.html,\
    \ but let's see an example here.\n\nFirst, type sudo pip install droneapi. You\
    \ can download some example scripts by typing git clone http://github.com/dronekit/dronekit-python.git.\
    \ Now cd to the dronekit-python/examples/vehicle_state directory. You'll see the\
    \ vehicle_state.py file that shows an excellent example of how to use the MAVLink\
    \ to talk with the Pixhawk to find out information, as well as set values and\
    \ issue commands.\n\n## Adding Raspberry Pi Zero to a Quadcopter\n\nYou can also\
    \ interface the MAVProxy system with the Mission Planner running on a remote computer.\
    \ With a radio connected to the TELEM 1 port of the Pixhawk and your Raspberry\
    \ Pi Zero connected to the TELEM 2 port of the Pixhawk, change the MAVProxy start-up\
    \ command by adding `--out <ipaddress>:14550` with ipaddress being the address\
    \ of the remote computer that is running the Mission Planner. On a Windows machine,\
    \ the `ipconfig` command can be used to determine this IP address.\n\nFor example,\
    \ your mavproxy command might look similar to this: `mavproxy.py --master=/dev/ttyAMA0\
    \ --baudrate 57600 --out ipaddress:14550 --aircraft MyCopter`. Once connected\
    \ to MAVProxy, you can connect to the Mission Planner software using the UDP connection,\
    \ as shown in the following screenshot:\n\n![](img/324d126a7e2da696837a3e066326bd61_220_0.png)\n\
    \nNow, you can run your MAVProxy scripts and see the results on the Mission Planner\
    \ software.\n\n## Summary\n\nThat's it. You now have a wide array of different\
    \ robotics platforms that run with Raspberry Pi Zero as the central controller.\
    \ These chapters have just introduced you to some of the most fundamental capabilities\
    \ of your platforms; you can now explore each and expand their capabilities. The\
    \ only limit is your imagination and time.\n\n## Index\n\n### A\n\nactions\n \
    \ initiating 144-146\nAdvanced IP Scanner\n  about 28\n  URL 28\nAdvanced Linux\
    \ Sound Architecture (ALSA) 132\nalsamixer 133\naplay 136\nArduino\n  URL 128\n\
    arecord program 136\n\n### B\n\nBison 139\nboard, Raspberry Pi Zero\n  powering\
    \ 3, 4\nbody kit, quadruped\n  URL 106\n\n### C\n\nCarnegie Mellon University\
    \ (CMU)\n  about 138\n  URL 138\ncommands\n  interpreting 144-146\ncompass\n \
    \ accessing programmatically 70-75\nconfiguration, USB WLAN adapter\n  URL 164\n\
    control board, Raspberry Pi Zero\n  URL 92\n\nCython\n  using 141\n\n### D\n\n\
    Data Ready (DRDY) 70\nDC motors\n  controlling, motor controller board used 89-92\n\
    \  H-bridge interface, controlling to 80-82\nDebian 9\nDegrees of Freedom (DOF)\
    \ 101\ndigital compass\n  connecting, to Raspberry Pi Zero 66-70\ndisplay, Raspberry\
    \ Pi Zero\n  connecting 4-8\nDroneKit\n  about 202\n  references 203\n  URL 202\n\
    \n### E\n\nElectronic Speed Controllers (ESCs)\n  about 193\n  URL 197\nEmacs\
    \ 37\nEmacs commands\n  defining 38\neSpeak\n  about 137\n  used, for allowing\
    \ robot to respond with spoken voice 137, 138\n"
  mdcn: "\n\n以下是使用 Pixhawk 飞行控制器的整个四旋翼飞行器的图像：\n\n![](img/324d126a7e2da696837a3e066326bd61_212_0.png)\n\
    \n> 请注意四旋翼飞行器上排列的箭头和线缆。这并不是为了让它看起来凶猛，而是为了防止它撞到东西并损坏螺旋桨。市面上也有商业护罩可供购买；不过该系统也有效，而且成本更低。\n\
    \n你需要用 RC 发射器/接收器对组装并飞行你的四旋翼飞行器；这将使你熟悉四旋翼飞行器及其飞行方式，同时也能让你调整所有设置以使其稳定。一旦四旋翼飞行器稳定后，你就可以执行一些简单的自主飞行。让我们使用任务规划软件，该软件运行在远程计算机上。\n\
    \n## 任务规划软件\n\n任务规划软件可在 http://planner.ardupilot.com/ 获取。实际上有两种应用可执行类似操作，但 Mission\
    \ Planner 是一个很好的地方，可以熟悉如何通过计算机程序与四旋翼飞行器通信。\n\n为此，你需要确保遥测电台已连接到 Pixhawk 和计算机。这将避免需要使用长\
    \ USB 数据线直接连接到 Pixhawk。当你开始任务规划软件时，你会看到以下屏幕：\n\n![](img/324d126a7e2da696837a3e066326bd61_213_0.png)\n\
    \n这是基本屏幕。然后你需要配置无线电的 COM 端口，然后按下屏幕右上角的 CONNECT 按钮。随着你移动四旋翼飞行器，你会看到测量值发生变化。如果你在连接\
    \ Pixhawk 时遇到问题，网站上有大量帮助。\n\n现在你已连接，你实际上可以用此应用程序看到四旋翼飞行器的飞行情况。软件通过 MAVLink 与 Pixhawk\
    \ 控制器通信，MAVLink 是一个串行控制链路，从软件应用程序发出，经由遥测电台发出，被遥测电台接收，然后路由到 Pixhawk。Pixhawk 不仅知道如何发送信息，还知道如何接收信息。\n\
    \n软件连接后，你需要校准 RC 无线电连接；这可以通过软件完成。你还需要校准 ESC；请参考 http://learnrobotix.com/uavs/quadocopter-build/pixhawk/calibrating-electronic-speed-controllers-with-pixhawk.html\
    \ 获取具体说明。\n\n现在连接后，你可以使用 MAVLink 从 Raspberry Pi Zero 访问 Pixhawk。你需要添加并配置 Raspberry\
    \ Pi Zero 以完成连接。为此，运行 `raspi-config` 并选择 **8 Advanced Options, Configure advanced\
    \ settings** 选项，如以下屏幕截图所示：\n\n![](img/324d126a7e2da696837a3e066326bd61_215_0.png)\n\
    \n现在你准备好安装一些额外软件了。要安装此软件，请执行以下步骤：\n\n- 1. 输入 `sudo apt-get update`：这会更新本地软件包列表，以便你的系统可以找到合适的软件。\n\
    - 2. 输入 `sudo apt-get install screen python-wxgtk2.8 python-matplotlib python-opencv`：这会安装一个图形包、一个绘图包和一个版本的\
    \ OpenCV。\n- 3. 输入 `sudo apt-get install python-numpy`：这将安装 **NumPy**，一个用于 Python\
    \ 的数值库，尽管你可能已从之前完成的项目中拥有它。\n- 4. 输入 `sudo apt-get install python-dev`：这是一组文件，将允许你在\
    \ Python 环境中进行开发。\n- 5. 输入 `sudo apt-get install python-pip`：这是一个帮助你安装 Python\
    \ 包的工具。\n- 6. 输入 `sudo pip install pymavlink`：这是一组实现 MAVLink 或 Pixhawk 的通信配置文件的代码，以\
    \ Python 编写。\n- 7. 输入 `sudo pip install mavproxy`：这最后一步安装 **Unmanned Aerial Vehicle\
    \ (UAV)** 地面站软件包，用于基于 MAVLink 的系统，该系统基于 Pixhawk。\n\n现在你已安装了所有软件，可以测试链接。为此，输入 `sudo\
    \ -s`；这会将你设为超级用户。然后输入 `mavproxy.py --master=/dev/ttyAMA0 --baudrate 57600 --aircraft\
    \ MyCopter` 你将看到以下内容：\n\n![](img/324d126a7e2da696837a3e066326bd61_217_0.png)\n\
    \n现在链接已建立，你可以发送命令来设置或显示参数。例如，输入 param show ARMING_CHECK；它应显示参数的值，如以下屏幕截图所示：\n\n\
    ![](img/324d126a7e2da696837a3e066326bd61_218_0.png)\n\n所有可用命令的详细信息可在 http://dronecode.github.io/MAVProxy/html/uav_configuration/index.html\
    \ 找到。\n\n你可以直接发出这些命令，但你也可以使用与 Mission Planner 界面类似的界面连接到 Pixhawk，而你之前已使用过该界面。为此，你需要安装\
    \ DroneKit 代码。DroneKit 的总体说明和文档可在 http://python.dronekit.io/1.5.0/guide/getting_started.html\
    \ 找到，但让我们在这里看一个示例。\n\n首先，输入 sudo pip install droneapi。你可以通过输入 git clone http://github.com/dronekit/dronekit-python.git\
    \ 下载一些示例脚本。现在 cd 到 dronekit-python/examples/vehicle_state 目录。你会看到 vehicle_state.py\
    \ 文件，它展示了如何使用 MAVLink 与 Pixhawk 通信以获取信息，以及设置值和发出命令的绝佳示例。\n\n## 向四旋翼飞行器添加 Raspberry\
    \ Pi Zero\n\n你还可以将 MAVProxy 系统与运行在远程计算机上的 Mission Planner 接口。使用一台无线电连接到 Pixhawk\
    \ 的 TELEM 1 端口，以及你的 Raspberry Pi Zero 连接到 Pixhawk 的 TELEM 2 端口，通过添加 `--out <ipaddress>:14550`\
    \ 修改 MAVProxy 启动命令，其中 ipaddress 为运行 Mission Planner 的远程计算机的地址。在 Windows 机器上，可以使用\
    \ `ipconfig` 命令确定此 IP 地址。\n\n例如，你的 mavproxy 命令可能看起来像这样：`mavproxy.py --master=/dev/ttyAMA0\
    \ --baudrate 57600 --out ipaddress:14550 --aircraft MyCopter`。一旦连接到 MAVProxy，你就可以使用\
    \ UDP 连接连接到 Mission Planner 软件，如以下屏幕截图所示：\n\n![](img/324d126a7e2da696837a3e066326bd61_220_0.png)\n\
    \n现在，你可以运行你的 MAVProxy 脚本并在 Mission Planner 软件上查看结果。\n\n## 摘要\n\n就这样。你现在拥有了多种不同的机器人平台，它们以\
    \ Raspberry Pi Zero 作为中央控制器运行。这些章节只是向你介绍了你的平台的一些最基本功能；你现在可以探索每个平台并扩展其功能。唯一的限制是你的想象力和时间。\n\
    \n## 索引\n\n### A\n\nactions\n  initiating 144-146\nAdvanced IP Scanner\n  about\
