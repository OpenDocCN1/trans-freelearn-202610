  md: "\n## Creating a program in Linux to control your quadruped\n\nYou now know\
    \ that you can talk to your servo motor controller and move your servos. In this\
    \ section, you'll create a Python program that will let you talk to your servos\
    \ to move them to specific angles.\n\nLet's start with a simple program that will\
    \ make your legged mobile robot's servos go to 90 degrees (which should be somewhere\
    \ close to the middle of the 0 to 180 degrees you can set.) To access the serial\
    \ port, you'll need to make sure that you have the Python serial library. If you\
    \ don't, then type sudo apt-get install python-serial. After you have installed\
    \ the serial library, you can run your program by typing sudo python quad.py.\n\
    \nThis particular controller uses two bytes of information, so the code in the\
    \ setAngle function will translate the input of the channel and angle into numbers\
    \ that the controller can understand. For more specifics, see http://www.pololu.com/docs/0J40.\
    \ Here is the code:\n\n![](img/324d126a7e2da696837a3e066326bd61_134_0.png)\n\n\
    Here is an explanation of the code:\n\n- #!/usr/bin/python: This first line allows\
    \ you to execute this Python file from the command line.\n- `import serial`: This\
    \ line imports the `serial` library. You need the `serial` library to talk to\
    \ your unit via USB.\n- `def setAngle(ser, channel, angle)`: This function converts\
    \ your desired setting for servo and angle into the serial command that the servo\
    \ motor controller needs.\n- `ser = serial.Serial(\"/dev/ttyACM0\", 9600)`: This\
    \ opens the serial port connection to your servo controller.\n- `for i in range(0,\
    \ 12)`: This `for` loop will access each servo.\n- `setAngle(ser, i, 90)`: Now,\
    \ you can set each servo to the middle (home) position. The default would be to\
    \ set each servo to 90 degrees. If your legs aren't in their middle position,\
    \ you can adjust them by adjusting the position of the servo horns on each servo.\n\
    \nOnce you have the basic home position set, you can now ask your robot to do\
    \ things. Let's start by making your quadruped wave. Here is the Python code:\n\
    \n![](img/324d126a7e2da696837a3e066326bd61_135_0.png)\n\nIn this case, you are\
    \ using the setAngle command to set your servos to manipulate your robot's front-right\
    \ arm. The middle servo raises the arm and the lower servo then goes back and\
    \ forth between angle 100 and 130 degrees.\n\nOne of the most basic actions you'll\
    \ want your robot to take is to walk forward. Here is an example of how to manipulate\
    \ the legs to make this happen:\n\n```\nser = serial.Serial(\"/dev/ttyACM0\",\
    \ 9600)\n# Home position\nfor i in range(0, 12):\n    setAngle(ser, i, 90)\n\n\
    setAngle(ser, 4, 110)\ntime.sleep(1)\nsetAngle(ser, 5, 100)\ntime.sleep(1)\nsetAngle(ser,\
    \ 4, 90)\ntime.sleep(1)\n\nsetAngle(ser, 7, 70)\ntime.sleep(1)\nsetAngle(ser,\
    \ 8, 80)\ntime.sleep(1)\nsetAngle(ser, 7, 90)\ntime.sleep(1)\n\nsetAngle(ser,\
    \ 1, 110)\ntime.sleep(1)\nsetAngle(ser, 2, 100)\ntime.sleep(1)\nsetAngle(ser,\
    \ 1, 90)\ntime.sleep(1)\n\nsetAngle(ser, 10, 70)\ntime.sleep(1)\nsetAngle(ser,\
    \ 11, 80)\ntime.sleep(1)\nsetAngle(ser, 10, 90)\ntime.sleep(1)\n\nfor i in range(0,\
    \ 12):\n    setAngle(ser, i, 90)\n\nser.close()\n```\n\nThis program lifts and\
    \ then moves each leg forward, one at a time, then moves all the legs to the home\
    \ position, which moves the robot forward. Not the most elegant, but it does work.\
    \ There are more sophisticated algorithms for walking with your quadruped; see\
    \ http://letsmakerobots.com/node/35354 and https://www.youtube.com/watch?v=jWP3RnYa_tw.\
    \ Once you have the program working, you'll want to package all your hardware\
    \ onto the mobile robot.\n\nYou can make your robot do many amazing things, such\
    \ as walk forward, walk backward, dance, and turn around; any number of movements\
    \ are possible. The best way to learn is to try new and different positions with\
    \ the servos.\n\n## Summary\n\nYou now have a robot that can walk! You can also\
    \ add other sensors, such as the ones you discovered for your wheeled robot, sensors\
    \ that can watch for barriers, or others that know the direction you are moving\
    \ in.\n\nIn the next chapter, you'll start on a new robot. You'll combine a Raspberry\
    \ Pi Zero with a toy robot and construct a project with the ability to speak and\
    \ respond to voice commands.\n\n## 6\nAdding Voice Recognition and Speech – A\
    \ Voice Activated Robot\n\nYou've started with some pretty basic projects but\
    \ you can take the concepts you have learned further by modifying robotic toys\
    \ with the Raspberry Pi Zero. One class of toys that are excellent candidates\
    \ for your projects are a set of robot toys by WowWee. You can purchase these\
    \ toys from the company at http://wowwee.com/ but you can also find used versions\
    \ of these toys on eBay for a significantly lower price.\n\nIn this chapter, you'll\
    \ learn the following:\n\n- How to break into the toy and provide the control\
    \ signals for your project\n- How to send and receive voice commands to control\
    \ the robot\n- How to interpret commands and initiate actions\n\nThere are several\
    \ toys that have excellent possibilities. One such toy is the **WowWee Roboraptor**.\
    \ The following picture shows this robot:\n\n![](img/324d126a7e2da696837a3e066326bd61_140_0.png)\n\
    \nAnother option is the **WowWee Robosapien**. Here is a picture of this one:\n\
    \n![](img/324d126a7e2da696837a3e066326bd61_140_1.png)\n\nWe will use this robot\
    \ for the project, as it has more functionality and is easier to modify.\n\n##\
    \ Communication between the Raspberry Pi Zero and the robot\n\nYou're going to\
    \ connect to the internal serial bus so that you, not the remote, can send commands.\
    \ You'll add an Arduino to handle real-time communication between the Raspberry\
    \ Pi Zero and the robot. Here are the steps:\n\n- 1. Firstly, you need to disassemble\
    \ the robot to get access to the main controller board. To do this, lay the robot\
    \ face down so that you have access to the back. Remove the plate at the back\
    \ by unscrewing the four screws that hold it in place. Now, at the top of the\
    \ exposed board, you should see the main connector. The following image is a close-up\
    \ photograph of the connector:\n\n![](img/324d126a7e2da696837a3e066326bd61_141_0.png)\n\
    \nThere are only two wires that you are interested in. The first is the black\
    \ wire, which is the GND for the Robosapien system. The second is the white wire.\
    \ This is the serial connection that controls the command for the Robosapien.\n\
    \nYou may want to add some heat-shrink tubing to cover your connections.\n\n-\
    \ 4. Finally, drill a hole in the back shell of the robot so that you can run\
    \ both of these cables out of the unit, as shown in the following image:\n\n![](img/324d126a7e2da696837a3e066326bd61_143_0.png)\n\
    \n- 5. This picture also shows two more holes on either side of the shell, which\
    \ you can use together with cable ties to attach the Raspberry Pi to the robot.\
    \ Now you can put the shell back onto the robot.\n\n- 6. Now, you need to connect\
    \ these two wires to the Arduino. There are several versions of the Arduino that\
    \ work but the most common one is the Arduino Uno. If you use a different Arduino\
    \ with a different timer, the delay constant in the Arduino code may need adjusting.\
    \ The reason that you need to use an Arduino is that the bit patterns that are\
    \ sent to the robot are sent at a fairly high rate and need to be created by a\
    \ processor dedicated to this type of real-time communication. This allows the\
    \ Raspberry Pi Zero to perform other processor-intensive activities, such as speech,\
    \ while keeping the communication flowing at the correct rate.\n\nFor specifics\
    \ on how to use the development environment of the Arduino family of processors,\
    \ visit https://www.arduino.cc. For information on how to use the Raspberry Pi\
    \ to create and upload programs to the Arduino, refer to http://www.instructables.com/id/Arduino-On-Pi/\
    \ or https://www.youtube.com/watch?v=wCxQrW96jTM.\n\n- 7. Connect the GND wire\
    \ to one of the GND pins on the Arduino. Then, connect the other wire to pin 9\
    \ on the Arduino. These connections should look similar to the following picture:\n\
    \n![](img/324d126a7e2da696837a3e066326bd61_144_0.png)\n\n- 8. The final step is\
    \ to get the code to send the correct commands to the Arduino board. The code\
    \ for this book is available in the PacktPub code download section or at http://playground.arduino.cc/Main/RoboSapienIR.\
    \ This Arduino code takes an input from the Serial Monitor, in this case a USB\
    \ connection from the Raspberry Pi Zero and turns it into the appropriate command\
    \ for the WowWee robot. Once you have uploaded the code to the Arduino, either\
    \ by using an external PC or a Raspberry Pi Zero, you can use the Arduino IDE's\
    \ Serial Monitor capability to send individual letter commands and the robot should\
    \ respond to these commands.\n"
  mdcn: "\n\n## 在 Linux 中创建程序来控制你的四足机器人\n\n你现在知道如何与舵机控制器通信并移动舵机了。在本节中，你将创建一个 Python\
    \ 程序，让你可以通过它来控制舵机移动到特定角度。\n\n让我们从一个简单的程序开始，让你的腿式移动机器人的舵机都移动到 90 度（这应该接近 0 到 180\
    \ 度可设置范围的中间位置）。要访问串口，你需要确保已安装 Python 串口库。如果没有，请输入 sudo apt-get install python-serial。安装串口库后，你可以通过输入\
    \ sudo python quad.py 来运行程序。\n\n这个特定的控制器使用两个字节的信息，因此 setAngle 函数中的代码会将通道和角度的输入转换为控制器可以理解的数字。有关更具体的信息，请参阅\
    \ http://www.pololu.com/docs/0J40。以下是代码：\n\n![](img/324d126a7e2da696837a3e066326bd61_134_0.png)\n\
    \n以下是代码的解释：\n\n- #!/usr/bin/python: 这一行允许你从命令行执行此 Python 文件。\n- `import serial`:\
    \ 这一行导入了 `serial` 库。你需要 `serial` 库才能通过 USB 与你的设备通信。\n- `def setAngle(ser, channel,\
    \ angle)`: 此函数将你对舵机和角度的期望设置转换为舵机电机控制器所需的串行命令。\n- `ser = serial.Serial(\"/dev/ttyACM0\"\
    , 9600)`: 这会打开与舵机控制器的串口连接。\n- `for i in range(0, 12)`: 这个 `for` 循环将访问每个舵机。\n-\
    \ `setAngle(ser, i, 90)`: 现在，你可以将每个舵机设置为中间（初始）位置。默认情况下，每个舵机都设置为 90 度。如果你的腿不在中间位置，你可以通过调整每个舵机上舵机臂的位置来调整它们。\n\
    \n设置好基本的初始位置后，你现在可以让你的机器人执行操作了。让我们先让你的四足机器人挥手。以下是 Python 代码：\n\n![](img/324d126a7e2da696837a3e066326bd61_135_0.png)\n\
    \n在这种情况下，你使用 setAngle 命令来设置舵机以操纵机器人前右臂。中间的舵机抬起手臂，然后下方的舵机在 100 度角和 130 度角之间来回移动。\n\
    \n你希望机器人执行的最基本动作之一就是向前行走。以下是如何操纵腿部来实现这一点的示例：\n\n```\nser = serial.Serial(\"/dev/ttyACM0\"\
    , 9600)\n# Home position\nfor i in range(0, 12):\n    setAngle(ser, i, 90)\n\n\
    setAngle(ser, 4, 110)\ntime.sleep(1)\nsetAngle(ser, 5, 100)\ntime.sleep(1)\nsetAngle(ser,\
    \ 4, 90)\ntime.sleep(1)\n\nsetAngle(ser, 7, 70)\ntime.sleep(1)\nsetAngle(ser,\
    \ 8, 80)\ntime.sleep(1)\nsetAngle(ser, 7, 90)\ntime.sleep(1)\n\nsetAngle(ser,\
    \ 1, 110)\ntime.sleep(1)\nsetAngle(ser, 2, 100)\ntime.sleep(1)\nsetAngle(ser,\
    \ 1, 90)\ntime.sleep(1)\n\nsetAngle(ser, 10, 70)\ntime.sleep(1)\nsetAngle(ser,\
    \ 11, 80)\ntime.sleep(1)\nsetAngle(ser, 10, 90)\ntime.sleep(1)\n\nfor i in range(0,\
    \ 12):\n    setAngle(ser, i, 90)\n\nser.close()\n```\n\n该程序一次抬起并向前移动每条腿，然后将所有腿移动到初始位置，从而使机器人向前移动。不是最优雅的，但它确实有效。有更复杂的四足机器人行走算法；请参阅\
    \ http://letsmakerobots.com/node/35354 和 https://www.youtube.com/watch?v=jWP3RnYa_tw。一旦程序运行正常，你需要将所有硬件打包到移动机器人上。\n\
    \n你可以让你的机器人执行许多令人惊叹的事情，例如向前行走、向后行走、跳舞和转圈；各种动作都是可能的。最好的学习方法是尝试舵机的不同位置。\n\n## 总结\n\
    \n你现在已经拥有了一台可以行走的机器人！你还可以添加其他传感器，例如你在轮式机器人上发现的传感器，可以监视障碍物的传感器，或其他了解你移动方向的传感器。\n\
    \n在下一章中，你将开始一个新的机器人项目。你将把 Raspberry Pi Zero 与一个玩具机器人结合起来，并构建一个能够说话并响应语音命令的项目。\n\
    \n## 6\n添加语音识别和语音 – 一个语音激活的机器人\n\n你已经开始了一些相当基础的项目，但你可以通过修改带 Raspberry Pi Zero\
    \ 的机器人玩具来进一步发挥所学概念。有一种玩具非常适合你的项目，那就是 WowWee 的一系列机器人玩具。你可以从公司网站 http://wowwee.com/\
    \ 购买这些玩具，但你也可以在 eBay 上以明显更低的价格找到这些玩具的二手版本。\n\n在本章中，你将学习以下内容：\n\n- 如何拆开玩具并为你的项目提供控制信号\n\
    - 如何发送和接收语音命令来控制机器人\n- 如何解释命令并启动操作\n\n有几种玩具具有很高的可能性。其中一个玩具是 **WowWee Roboraptor**。以下图片显示了这款机器人：\n\
    \n![](img/324d126a7e2da696837a3e066326bd61_140_0.png)\n\n另一个选择是 **WowWee Robosapien**。以下是这款机器人的图片：\n\
    \n![](img/324d126a7e2da696837a3e066326bd61_140_1.png)\n\n我们将使用这款机器人进行项目，因为它功能更多且更容易修改。\n\
    \n## Raspberry Pi Zero 与机器人之间的通信\n\n你将连接到内部串行总线，以便你而不是遥控器发送命令。你将添加一个 Arduino 来处理\
    \ Raspberry Pi Zero 与机器人之间的实时通信。以下是步骤：\n\n- 1. 首先，你需要拆开机器人以获得主控制器板的访问权限。为此，将机器人面朝下放置，以便你能够接触到背面。拆下背面的板子，拧下固定它的四个螺丝。现在，在暴露的板子上方，你应该能看到主连接器。以下图像是连接器的特写照片：\n\
    \n![](img/324d126a7e2da696837a3e066326bd61_141_0.png)\n\n你只对其中两根线感兴趣。第一根是黑色线，它是\
    \ Robosapien 系统的 GND。第二根是白色线。这是控制 Robosapien 命令的串行连接。\n\n你可能希望添加一些热缩管来覆盖你的连接。\n\
    \n- 4. 最后，在机器人的后壳上钻一个孔，以便你可以将这两根电缆从单元中引出，如下图所示：\n\n![](img/324d126a7e2da696837a3e066326bd61_143_0.png)\n\
    \n- 5. 这张图片还显示了外壳两侧的另外两个孔，你可以使用它们与扎带一起将 Raspberry Pi 固定到机器人上。现在你可以将外壳重新装回机器人上。\n\
    \n- 6. 现在，你需要将这两根线连接到 Arduino。有几种 Arduino 版本可以使用，但最常见的是 Arduino Uno。如果你使用具有不同定时器的不同\
    \ Arduino，Arduino 代码中的延迟常量可能需要调整。你需要使用 Arduino 的原因是发送给机器人的位模式以相当高的速率发送，需要由专门用于这种实时通信的处理器创建。这允许\
    \ Raspberry Pi Zero 执行其他处理器密集型活动，例如语音，同时保持通信以正确的速率进行。\n\n有关如何使用 Arduino 系列处理器的开发环境的具体信息，请访问\
    \ https://www.arduino.cc。有关如何使用 Raspberry Pi 创建和上传程序到 Arduino 的信息，请参阅 http://www.instructables.com/id/Arduino-On-Pi/\
    \ 或 https://www.youtube.com/watch?v=wCxQrW96jTM。\n\n- 7. 将 GND 线连接到 Arduino 上的其中一个\
    \ GND 引脚。然后，将另一根线连接到 Arduino 的第 9 引脚。这些连接应类似于以下图片：\n\n![](img/324d126a7e2da696837a3e066326bd61_144_0.png)\n\
    \n- 8. 最后一步是获取代码以向 Arduino 板发送正确的命令。本书的代码可在 PacktPub 代码下载部分或 http://playground.arduino.cc/Main/RoboSapienIR\
    \ 获取。此 Arduino 代码接收来自串行监视器的输入，在本例中是来自 Raspberry Pi Zero 的 USB 连接，并将其转换为 WowWee\
    \ 机器人的适当命令。一旦你将代码上传到 Arduino，无论是通过外部 PC 还是 Raspberry Pi Zero，你都可以使用 Arduino IDE\
    \ 的串行监视器功能发送单个字母命令，机器人应响应这些命令。\n\n"
