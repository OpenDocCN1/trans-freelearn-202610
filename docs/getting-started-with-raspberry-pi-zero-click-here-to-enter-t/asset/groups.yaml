    在本节中，我们将介绍如何创建并运行一个 Python 文件。实际上，Python 可以交互式地使用，因此你可以一次输入一条命令。在你熟悉语言特性和模块时，交互式使用会非常有帮助。但你想用
    Python 来创建程序，因此你需要在 Emacs 中输入命令，然后在命令行中通过调用 Python 来运行它们。让我们开始吧。


    输入 `emacs example.py` 打开一个示例 Python 文件。现在，让我们在文件中写入一些代码。以下面截图所示的代码开始：


    ![](img/324d126a7e2da696837a3e066326bd61_56_0.png)


    让我们逐行看一下代码，了解发生了什么。代码行如下：


    - `a = input("Input value: ")`：程序的基本用途之一是获取用户的输入；`input` 允许我们做到这一点。数据将由用户输入并存储在
    `a` 中。提示符 `Input value:` 将显示给用户。

    - `b = input("Input second value: ")`：该数据也由用户输入并存储在 `b` 中。提示符 `Input second value:`
    将显示给用户。

    - `c = a + b`：这是你可以对数据执行的操作的一个示例；在这个示例中，你可以将 `a` 和 `b` 相加。

    - `print c`：我们程序的另一个基本用途是打印结果。`print` 命令会打印出 `c` 的值。


    > 该代码是用 Python 2 编写的。如果你使用的是 Python 3，你需要将 `print` 改为 `print(c)`。有关可能需要进行的其他更改，请访问
    http://learntocodewith.me/programming/python/python-2-vs-python-3/。


    创建程序后，保存它（使用 *Ctrl + X* 和 *Ctrl + S*）并退出 Emacs（使用 *Ctrl + X* 和 *Ctrl + C*）。现在，在命令行中，输入
    `python example.py` 来运行你的程序。你看到的结果应类似于以下截图：


    ![](img/324d126a7e2da696837a3e066326bd61_57_0.png)


    你也可以在命令行中不输入 `python example.py` 来运行程序，只需在程序中添加 `#!/usr/bin/python` 一行。之后程序看起来类似于以下截图：


    ![](img/324d126a7e2da696837a3e066326bd61_57_1.png)


    将 `#!/usr/bin/python` 作为第一行，只是让这个文件可以在命令行中被直接执行。保存文件并退出 Emacs 后，输入 `chmod +x example.py`。这将更改文件的执行权限，因此计算机现在会接受并执行它。


    你应该可以直接输入 `./example.py` 并看到程序运行，如下截图所示：


    ![](img/324d126a7e2da696837a3e066326bd61_58_0.png)


    请注意，如果直接输入 `example.py`，系统将找不到该可执行文件。在这里，文件没有被系统注册，因此你必须为系统提供它的路径。在这种情况下，`./`
    表示当前目录。


    ## 下载示例代码


    你可以从你的账户中下载本书的示例代码文件，网址为 http://www.packtpub.com。如果你在其他地方购买了本书，可以访问 http://www.packtpub.com/support
