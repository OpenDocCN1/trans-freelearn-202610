    ")`：该数据也由用户输入并存储在 `b` 中。

    - `if a > b:`：这是一个 `if` 语句。在此情况下被求值的表达式是 `a > b`。如果它为 `True`，程序将执行下一句或多句缩进的语句；在此情况下，即
    `c = a - b`。如果不是，它将跳过该语句。

    - `else:`：`else` 语句是该命令的一个可选部分。如果 `if` 语句中的表达式被求值为 `False`，则执行 `else:` 之后的缩进语句；在此情况下，即
    `c = b - a`。

    - `print c`：我们程序的另一个基本用途是打印结果。`print` 命令会打印出 `c` 的值。


