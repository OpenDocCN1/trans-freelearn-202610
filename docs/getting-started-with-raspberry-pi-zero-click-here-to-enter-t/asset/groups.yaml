    **Tightvncserver** is an application that allows you to view your complete Raspberry
    Pi Zero remotely. Once you have it installed, you need to start the server by
    typing `vncserver` in a terminal window on the Raspberry Pi Zero. You will then
    be prompted for a password, then be prompted to verify the password, and then
    asked if you''d like to have a view-only password. Remember the password that
    you entered, you''ll need it to log in via a VNC Viewer remotely.


    You need a VNC Viewer application for your remote computer. On my Windows system,
    I use an application called **RealVNC**. When I start the application, it gives
    me the following screenshot:


    ![](img/324d126a7e2da696837a3e066326bd61_37_0.png)


    Enter the **VNC Server** address, which is the IP address of your Raspberry Pi
    Zero, and click on **Connect**. You will see a pop-up window, as shown in the
    following screenshot:


    ![](img/324d126a7e2da696837a3e066326bd61_37_1.png)


    ## Getting Started with Raspberry Pi Zero


    Type in the password that you just entered while starting vncserver and you should
    then get a graphical view of your Raspberry Pi that looks like the following screenshot:


    ![](img/324d126a7e2da696837a3e066326bd61_38_0.png)


    You can now access all of the capabilities of your system, although they may be
    slower if you are doing a graphics-intense data transfer.


    > There are ways to make vncserver start automatically on boot. I have not used
    them; I prefer to type the vncserver command from an SSH application when I want
    the application running. This keeps your running applications to a minimum and,
    more importantly, presents fewer security risks. If you want to start yours each
    time you boot, there are several places on the Internet that show you how to configure
    this. Try the following website: http://www.havetheknowhow.com/Configure-the-server/Run-VNC-on-boot.html.


    To view this Raspberry Pi desktop from a remote Linux computer, which is running
    Ubuntu for example, you can type `sudo apt-get install xtightvncviewer`, then
    start it by using `xtightvncviewer 10.25.155.110:1` and supplying the chosen password.


    Linux has viewers with graphical interfaces such as **Remmina Remote Desktop Client**
    (select the **VNC-Virtual Network Computing protocol**), which might be used instead
    of `xtightvncviewer`. Here is a screenshot of the **Remote Desktop Viewer**:


    ![](img/324d126a7e2da696837a3e066326bd61_39_0.png)


    Make sure that vncserver is running on the Raspberry Pi Zero. The easiest way
    to do this is to log in using SSH and run vncserver at the prompt. Now, click
    on **Connect** on the **Remote Desktop Viewer**. Fill in the screen as follows,
    under the **Protocol** selection, choose **VNC**, and you should see the following
    screenshot:


    ![](img/324d126a7e2da696837a3e066326bd61_40_0.png)


    Now, enter the **Host** Internet address, making sure that you include a :1 at
    the end and then click on **Connect**. You''ll need to enter the vncserver password
    you set up, as shown in the following screenshot:


    ![](img/324d126a7e2da696837a3e066326bd61_41_0.png)


    Now you should be able to see the graphical screen of the Raspberry Pi. To access
    the Raspberry Pi Zero graphically from a Mac or another Apple device, you can
    still use Real VNC Viewer, see https://www.realvnc.com/products/ for more information.


    ## Getting Started with Raspberry Pi Zero


    The final piece of software that I like to use with Windows is a free application
    called WinSCP. To download and install this piece of software, go to https://winscp.net/
    and follow the instructions to download and install. Once installed, run the program.
    It will open the following dialog box:


    ![](img/324d126a7e2da696837a3e066326bd61_42_0.png)


    Click on New and you will get the following screenshot:


    ![](img/324d126a7e2da696837a3e066326bd61_42_1.png)


    Here, you fill in the IP address in the host name tab, pi in the user name tab,
    and the password (not the vncserver password) in the password space. Click on
    Login and you should see a warning displayed, as shown in the following screenshot:


    ![](img/324d126a7e2da696837a3e066326bd61_43_0.png)


    The host computer, again, doesn''t know the remote computer. Click on Yes and
    the application will display the following screenshot:


    ![](img/324d126a7e2da696837a3e066326bd61_43_1.png)


    ![](img/324d126a7e2da696837a3e066326bd61_45_0.png)


    Clicking on the Scan selector scans for all the devices connected to the network.
    You can also do this in Linux; one application for IP scanning in Linux is called
    Nmap. To install Nmap, type sudo apt-get install nmap. To run Nmap, type sudo
    nmap -sp 10.25.155.1/154 and the scanner will scan the addresses from 10.25.155.1
    to 10.25.155.154.


    > For more information on Nmap, see: http://www.linux.com/learn/tutorials/290879-beginners-guide-to-nmap.


    These scanners let you know which addresses are being used and this should allow
    you to see your Raspberry Pi address without typing ipconfig.


    ## Getting Started with Raspberry Pi Zero


    Your system has lots of capabilities. Feel free to play around with the system
    – try to get an understanding of what is already there and what you''ll need to
    add from a software perspective. Remember, there is limited power on your USB
    port, so make sure that you are familiar with the power needs of accessories plugged
    into your Raspberry Pi. You may very well need to use a powered USB hub for many
    projects.


    ## Summary


    Congratulations! You''ve completed the first stage of your journey. You have your
    Raspberry Pi Zero up and working. No gathering dust in the bin for this piece
    of hardware. It is now ready to start connecting to all sorts of interesting devices,
    in all sorts of interesting ways. You have, by now, installed a Raspbian operating
    system, learned how to connect all the appropriate peripherals, and even mastered
    how to access the system remotely so that the only connections you need are a
    power supply cable and a LAN cable.


    Now, you are ready to start commanding your Raspberry Pi Zero to do something.
    The next chapter will introduce you to the Linux operating system and the Emacs
    text editor. It will also show you some basic programming concepts in both open
    Python and C/C++ programming languages. Then, you''ll be ready to add open source
    software to inexpensive hardware and start building your robotics projects.


    ## 2

    ### Programming Raspberry Pi Zero


    Now that your system is up and running, your Raspberry Pi Zero is ready to do
    something. This will require you to either create your own programs or edit someone
    else''s programs. In this chapter, you''ll learn how to edit a file to create
    a program that can run on Raspberry Pi Zero.


    In this chapter, we will cover the following topics:


    - Basic Linux commands and navigating the filesystem on Raspberry Pi Zero

    - Creating, editing, and saving files on Raspberry Pi Zero

    - Creating and running Python programs on Raspberry Pi Zero

    - Some of the basic programming constructs in Python on Raspberry Pi Zero


    You can create and run the programs discussed in this chapter by connecting a
    keyboard, a mouse, and a monitor to Raspberry Pi Zero, or remotely logging in
    using vncserver or SSH.


    ## Powering up Raspberry Pi Zero with Linux


    After completing the tasks discussed in Chapter 1, Getting Started with Raspberry
    Pi Zero, you''ll have a working Raspberry Pi Zero that is running a version of
    Linux called Raspbian. So, power up your Raspberry Pi Zero and log in using a
    valid username and password. If you are going to log in remotely through SSH or
    vncserver, go ahead and establish the connection now. First, you''ll take a quick
    tour of Linux. This will not be extensive, but you will just walk through some
    of the basic commands.


    ## Programming Raspberry Pi Zero


    Once you have logged in, open up a terminal window. If you are logging in using
    a keyboard, mouse, and monitor, or using vncserver, you''ll find the terminal
    by selecting the Terminal application on icon set selection at the top of the
    screen, as shown in the following screenshot:


    ![](img/324d126a7e2da696837a3e066326bd61_48_0.png)


    If you are using SSH, you will already be in the terminal emulator program. Either
    way, the terminal should look something similar to the following screenshot:


    ![](img/324d126a7e2da696837a3e066326bd61_48_1.png)

