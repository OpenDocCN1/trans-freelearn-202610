    \ Go to http://copter.ardupilot.com/, which is another excellent website with\
    \ lots of information.\n\nFor this project, you'll want to choose a project that\
    \ uses the **Pixhawk** flight controller. There are other flight controllers that\
    \ are significantly less expensive, but this particular flight controller provides\
    \ easy access for Raspberry Pi Zero. Here are some possible websites that can\
    \ guide you through the construction process: http://learnrobotix.com/uavs/quadcopter-build/pixhawk/connecting-the-q-brain-esc.html,\
    \ http://learnrobotix.com/uavs/quadcopter-build/pixhawk/connecting-components-pixhawk-flight-controller.html,\
    \ and http://www.flying-drone.co.uk/how-to-build-a-quadcopter-with-a-pixhawk-flight-controller-step-11/.\n\
    \nAt http://copter.ardupilot.com/wiki/advanced-pixhawk-quadcopter-wiring-chart/,\
    \ you'll find an excellent wiring diagram of how to hook everything up. Let's\
    \ go through the steps of constructing our own quadcopter.\n\nFirst, you'll need\
    \ a frame. You'll be building a quadcopter of size 450 mm, one of the least expensive\
    \ frames, which is available from most online retailers, with fiberglass arms,\
    \ as shown in the following image:\n\n![](img/324d126a7e2da696837a3e066326bd61_208_0.png)\n\
    \nNow, perform the following steps to complete your quadcopter assembly:\n\n-\
    \ 1. The first step is to build the quadcopter as the instructions suggest.\n\
    - 2. The second step is to solder the four **Electronic Speed Controllers (ESCs)**,\
    \ one to each motor, and the battery connection to the bottom plate. Here is an\
    \ image of the bottom plate:\n\n![](img/324d126a7e2da696837a3e066326bd61_209_0.png)\n\
    \nNote the + and - connections; each connection will be soldered to all the ESCs.\
    \ The following is an image of the motor controller:\n\n![](img/324d126a7e2da696837a3e066326bd61_209_1.png)\n\
    \n## Adding Raspberry Pi Zero to a Quadcopter\n\nThe red and black wire connectors\
    \ are the connectors that are soldered to the bottom plate of the frame. The other\
    \ three connectors will connect to the motor.\n\n- 3. The third step is to install\
    \ the motors on the frame. You'll need motors that are in the 1000 KV range, here\
    \ is an image of such a motor:\n\n![](img/324d126a7e2da696837a3e066326bd61_210_0.png)\n\
    \nAgain, follow the instructions that came with your frame to attach the motor.\
    \ Then attach the three connections that come from the ESC to the motor.\n\n-\
    \ 4. One optional step is to add a landing gear set to the unit. There are many\
    \ of these available; the following is an image of one that is very sturdy:\n\n\
    ![](img/324d126a7e2da696837a3e066326bd61_210_1.png)\n\n- 5. Now you'll install\
    \ Pixhawk on the frame and connect its associated electronics. The details are\
    \ shown and described at http://copter.ardupilot.com/wiki/advanced-pixhawk-quadcopter-wiring-chart/.\
    \ This will connect the Pixhawk to the ESCs, the battery, an RC transmitter, a\
    \ telemetry radio, and a switch that will prevent the quadcopter from flying until\
    \ you are ready.\n- 6. Eventually, you will install four propellers on the quadcopter;\
    \ however, you will have to wait until you have calibrated the ESCs, motors, and\
    \ RC transmitter to install them. You'll need four propellers, two that are designed\
    \ to spin clockwise and another two that are designed to spin counter-clockwise.\
    \ For this quadcopter, you'll want propellers that are 10x4.7 pitches. Here is\
    \ an image of one such propeller:\n\n![](img/324d126a7e2da696837a3e066326bd61_211_0.png)\n"
  mdcn: "\n\n你可能想要尝试调整分辨率，以找到适合你应用的最佳设置。较大的图像很棒——它们能让你更详细地查看世界——但它们也会占用显著更多的处理能力。随着你真正要求系统执行一些实际的图像处理任务，你会更频繁地调整此分辨率。注意，如果你打算使用\
    \ vncserver 来了解系统性能，这会显著降低更新速率。宽度/高度是两倍大小的图像将涉及四倍的处理量。你现在可以使用此功能来执行许多令人印象深刻的任务。\n\
    \n## 手势检测\n\nOpenCV 和你的网络摄像头也可以跟踪物体。当你希望项目能够区分你的手与背景时，这将很有用。OpenCV 通过提供一些高级库使这变得异常简单，这些库可以帮助我们完成此任务。为此，你将编辑一个文件，使其看起来与以下屏幕截图中所示相似：\n\
    \n![](img/324d126a7e2da696837a3e066326bd61_201_0.png)\n\n## 使用 Raspberry Pi Zero\
    \ 玩剪刀石头布\n\n以下屏幕是测量你手部纸张的画面：\n\n![](img/324d126a7e2da696837a3e066326bd61_204_0.png)\n\
    \n你可以通过使用 *x* 和 *y* 的比率添加一些简单的代码来判断你的手是在出石头、剪刀还是布。在前面的图片中，你可以看到纸张的宽度与高度的比率大约为\
    \ 140/80。对于石头，该比率大约为 85/55。对于剪刀，它将为 140/40。以下是确定石头/布/剪刀的库代码：\n\n```\nimport math\n\
    \ncap = cv2.VideoCapture(0)\ncap.set(3, 320)\ncap.set(4, 240)\n\ndef getHand():\n\
    \    while(cap.isOpened()):\n        ret, img = cap.read()\n        cv2.rectangle(img,\
    \ (200,200), (50,50), (0,255,0),0)\n        crop_img = img[50:200, 50:200]\n \
    \       grey = cv2.cvtColor(crop_img, cv2.COLOR_BGR2GRAY)\n        value = (35,\
    \ 35)\n        blurred = cv2.GaussianBlur(grey, value, 0)\n        _, thresh1\
    \ = cv2.threshold(blurred, 127, 255, cv2.THRESH_BINARY_INV+cv2.THRESH_OTSU)\n\
    \        cv2.imshow('Thresholded', thresh1)\n        contours, hierarchy = cv2.findContours(thresh1.copy(),cv2.RETR_TREE,\
    \ cv2.CHAIN_APPROX_NONE)\n        max_area = -1\n        for i in range(len(contours)):\n\
    \            cnt=contours[i]\n            area = cv2.contourArea(cnt)\n      \
    \      if(area>max_area):\n                max_area=area\n                ci=i\n\
    \        cnt=contours[ci]\n        x,y,w,h = cv2.boundingRect(cnt)\n        print\
    \ x, y, w, h\n        if w != 148 and h !=148: # not starting rectangle\n    \
    \        if w/h >= 3:\n                return 3  # scissors\n            elif\
    \ w/h < 3 and w/h > 1:\n                return 2\n            else:\n        \
    \        return 3\n        cv2.rectangle(crop_img, (x,y), (x+w,y+h), (0,0,255),0)\n\
    \        cv2.imshow('Gesture', img)\n        k = cv2.waitKey(10)\n        if k\
    \ == 27:\n            break\n\nprint getHand()\n```\n\n现在你知道了人类对手的手势状态。为了完成整个项目，你需要添加代码为计算机手的状态进行随机选择，调用本章前面各节中的函数使手移动到该状态，然后比较机器人手和用户手的随机选择以确定获胜者。玩剪刀石头布从未如此简单！\n\
    \n## 总结\n\n你现在拥有了一只可以玩剪刀石头布的手！到目前为止，你应该已经拥有了许多可以添加到几乎任何项目中的不同功能。在最后一章中，你将把 Raspberry\
    \ Pi Zero 添加到四轴飞行器上，构建一个可以飞行的项目。\n\n## 9\n### 为四轴飞行器添加 Raspberry Pi Zero\n\n你已经有机会构建了许多不同类型的机器人，现在让我们以最令人惊叹的机器人作为结尾，一种可以飞行的机器人。\n\
    \n> 在开始之前，有一些安全警告需要考虑。当然，永远不要在人或建筑物附近飞行。此外，要非常小心不要飞出你的视距范围。在许多国家，对四轴飞行器的飞行地点和时间都有限制。一些国家，包括美国，要求你注册你的四轴飞行器。\n\
    \n还需要注意的是，本章并非旨在作为构建可飞行四轴飞行器的完整分步指南。那需要很多章节。本章旨在让你入门，如果你考虑构建一个可使用 Raspberry Pi\
    \ Zero 控制的四轴飞行器。在本章中，你将学习以下主题：\n\n- 构建基本四轴飞行器平台\n- 将 Raspberry Pi Zero 与飞行控制器接口\n\
    - 讨论远程通信\n- 使用 GPS 进行定位\n- 添加自主飞行\n\n## 构建平台\n\n构建四轴飞行器硬件可能令人望而生畏；然而，有几个优秀的网站可以引导你完成整个过程，从组件选择到构建细节以及使用无线电编程和控制你的四轴飞行器。http://www.arducopter.co.uk/\
    \ 网站是那些对四轴飞行器飞行感兴趣的新手的好起点。前往 http://copter.ardupilot.com/，这也是另一个信息丰富的优秀网站。\n\n\
    对于本项目，你希望选择使用 **Pixhawk** 飞行控制器的项目。还有其他价格明显更低的飞行控制器，但这个特定的飞行控制器为 Raspberry Pi\
    \ Zero 提供了便捷的访问。以下是一些可以指导你完成构建过程的网站：http://learnrobotix.com/uavs/quadcopter-build/pixhawk/connecting-the-q-brain-esc.html、http://learnrobotix.com/uavs/quadcopter-build/pixhawk/connecting-components-pixhawk-flight-controller.html\
    \ 和 http://www.flying-drone.co.uk/how-to-build-a-quadcopter-with-a-pixhawk-flight-controller-step-11/。\n\
    \n在 http://copter.ardupilot.com/wiki/advanced-pixhawk-quadcopter-wiring-chart/，你会找到一个关于如何连接所有东西的优秀接线图。让我们逐步进行构建我们自己的四轴飞行器。\n\
    \n首先，你需要一个机架。你将构建一个尺寸为 450 mm 的四轴飞行器，这是最便宜的机架之一，可在大多数在线零售商处购买，具有玻璃纤维臂，如下图所示：\n\
    \n![](img/324d126a7e2da696837a3e066326bd61_208_0.png)\n\n现在，执行以下步骤完成你的四轴飞行器组装：\n\
    \n- 1. 第一步是按照说明建议组装四轴飞行器。\n- 2. 第二步是将四个 **电子调速器 (ESCs)** 焊接到每个电机上，并将电池连接焊到底板上。以下是底板的图像：\n\
    \n![](img/324d126a7e2da696837a3e066326bd61_209_0.png)\n\n注意 + 和 - 连接；每个连接将焊接到所有\
    \ ESC 上。以下是电机控制器的图像：\n\n![](img/324d126a7e2da696837a3e066326bd61_209_1.png)\n\n\
    ## 为四轴飞行器添加 Raspberry Pi Zero\n\n红黑线连接器是焊接到底盘底板的连接器。其他三个连接器将连接到电机。\n\n- 3. 第三步是在机架上安装电机。你需要\
    \ 1000 KV 范围内的电机，以下是此类电机的图像：\n\n![](img/324d126a7e2da696837a3e066326bd61_210_0.png)\n\
    \n再次，按照随附机架的说明将电机附上。然后将来自 ESC 的三个连接附到电机上。\n\n- 4. 一个可选步骤是为单元添加一套起落架。有很多此类产品可供选择；以下是非常坚固的一个的图像：\n\
    \n![](img/324d126a7e2da696837a3e066326bd61_210_1.png)\n\n- 5. 现在你将在机架上安装 Pixhawk\
    \ 并连接其相关电子设备。细节在 http://copter.ardupilot.com/wiki/advanced-pixhawk-quadcopter-wiring-chart/\
    \ 中显示并描述。这将把 Pixhawk 连接到 ESC、电池、RC 发射器、遥测无线电以及一个开关，该开关将防止四轴飞行器在你准备好之前飞行。\n- 6.\
    \ 最终，你将在四轴飞行器上安装四个螺旋桨；然而，你必须等到校准 ESC、电机和 RC 发射器后才能安装它们。你需要四个螺旋桨，其中两个设计为顺时针旋转，另外两个设计为逆时针旋转。对于这个四轴飞行器，你希望螺旋桨的螺距为\
    \ 10x4.7。以下是其中一个螺旋桨的图像：\n\n![](img/324d126a7e2da696837a3e066326bd61_211_0.png)\n\
    \n"
