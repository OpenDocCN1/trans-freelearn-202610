    Pololu makes a number of different versions of this controller; each version can
    control a certain number of servos. In this case, you may want to choose the 18-servo
    version, so you can control all 12 servos with one controller and also add an
    additional servo to control the direction of a camera or sensor; you can also
    choose the 12-servo version. One advantage of the 18-servo controller is the ease
    of connecting power to the unit via screw-type connectors.


