    \ Raspberry Pi Zero 的精彩新项目书。Pi Zero 的尺寸使其非常适合集成到其他产品中。在这本书中，Richard Grimmett 带领我们踏上了一段令人惊叹的电路改造、编程和创新之旅，使用这台微型计算机！但不要止步于此；本书中的项目将为您提供所需技能，并激发您自己产生许多新想法！\n\
