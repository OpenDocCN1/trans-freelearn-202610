    ![](img/324d126a7e2da696837a3e066326bd61_27_0.png)


    After plugging in your card, you might see something like the following screenshot:


    ![](img/324d126a7e2da696837a3e066326bd61_27_1.png)


    Note that your card is at sdb. Now go to the directory in which you downloaded
    the archived image file and use the following command:


    ```bash

    sudo dd if=2015-11-21-raspbian-jessie.img of=/dev/sdX

    ```


    The `2015-11-21-raspbian-jessie.img` command will be replaced by the image file
    that you downloaded and `/dev/sdX` will be replaced by your card ID, in this example
    `/dev/sdb`. Be careful to specify the correct device as this can overwrite the
    data on any of your drives. Also, this may take a few minutes. Once the file is
    written, eject the card and you are ready to plug it into the board and apply
    the power.


    ## Getting Started with Raspberry Pi Zero


    Make sure that your Raspberry Pi Zero is unplugged and install the SD card into
    the slot. Then power the device. After the device boots, you should get the following
    screen:


    ![](img/324d126a7e2da696837a3e066326bd61_28_0.png)


    You are up and running!


    > Note that, if you use a powered USB hub, it might provide enough power to your
    Raspberry Pi, however, in some circumstances it might not be able to provide all
    the power you need. I strongly suggest you use different power sources, one for
    your Raspberry Pi Zero and one for your hub.


    You are going to do one more thing to finalize your configuration. To do this
    you need to go into the raspi-config application. So, open a terminal window by
    clicking the icon in the upper left corner that looks like a small computer screen.


    Now, type in sudo raspi-config. You should see this application on your screen:


    ![](img/324d126a7e2da696837a3e066326bd61_29_0.png)


    You need to expand the filesystem to take up the entire card. Select **1 Expand
    Filesystem**, hit the *Enter* key and you''ll see the following screen:


    ![](img/324d126a7e2da696837a3e066326bd61_29_1.png)


    You''ll also need to connect a powered USB hub for this process, so that you can
    access both the keyboard and mouse, as well as the USB wireless LAN device. Now,
    connect the device to the powered hub.


    Boot the system and then edit the wpa_supplicant.conf file by typing sudo nano
    /etc/wpa_supplicant/wpa_supplicant.conf. You need to change it to look like this:


    ![](img/324d126a7e2da696837a3e066326bd61_31_0.png)


    The wpa-ssid and wpa-psk values here must, of course, match what your wireless
    access point requires. Reboot and your device should be connected to your wireless
    network. You''ll know if it is connected by looking in the upper right hand corner
    of the screen where you should see the following:


    ![](img/324d126a7e2da696837a3e066326bd61_32_0.png)


    You can now download any additional functionality you''ll want to install from
    the Internet.


    If you want to connect to an actual LAN cabled connection you need a device that
    goes from USB to LAN. This site http://elinux.org/RPi_USB_Ethernet_adapters lists
    a number of different possibilities. Here is an image of one such device:


    ![](img/324d126a7e2da696837a3e066326bd61_32_1.png)


    Connecting the Raspberry Pi Zero in this way is actually amazingly easy. Simply
    plug the USB to LAN adapter into the powered USB hub, connect an active LAN cable
    and you should then have Internet access.


    ## Accessing your Raspberry Pi Zero from your host PC


    Once you have established an Internet network connection with your device, you
    can access it from your host computer. There are three ways to access your system
    from your remote computer:


    - The first is through a terminal interface called **SSH**.

    - The second way is by using a program called **VNC server**. This allows you
    to open a graphical user interface remotely which mirrors the graphical user interface
    on the Raspberry Pi.

    - Finally, you can transfer files through a program called **WinSCP**, which is
    custom-made for this purpose. You can use a program called **SCP** for Linux.


    So, firstly, make sure that your basic system is up and working. Open a terminal
    window and check the IP address of your unit. You''re going to need this however
    you communicate with the system. Do this by using the `ifconfig` command. It should
    produce the following screenshot:


    ![](img/324d126a7e2da696837a3e066326bd61_33_0.png)


    You need inet addr, which is shown in the third line of the preceding screenshot
    to contact your board through the Ethernet. If you are using a wireless device
    to gain access to the Internet, your ifconfig will look like this:


    ![](img/324d126a7e2da696837a3e066326bd61_34_0.png)


    The inet addr associated with the wlan0 connection, in this case 10.10.0.31, is
    the address you will use to access your Raspberry Pi.


    You also need an SSH terminal program running on your remote computer. An SSH
    terminal is a Secure Shell (SSH) connection, which simply means that you''ll be
    able to access your board and give it commands by typing them into your remote
    computer. The response from the Raspberry Pi Zero will appear in the remote computer
    terminal window.


    > If you''d like to know more about SSH, visit: https://www.siteground.com/tutorials/ssh/.


    If you are running Microsoft Windows, you can download an alternative application.
    My personal favorite is PuTTY. It is free and does a very good job of saving your
    configuration so that you don''t have to type it in every time. Type putty in
    a search engine and you''ll soon come to a page that supports a download or you
    can go to http://www.putty.org/.


    Download PuTTY to your Microsoft Windows machine. Then, run `putty.exe`. You should
    see a configuration window which looks something like the following screenshot:


    ![](img/324d126a7e2da696837a3e066326bd61_35_0.png)


    Type the `inet addr` from the previous page in the **Host Name** space and make
    sure that the **SSH** selection is selected. You may want to save this configuration
    under Raspberry Pi so that you can reload it each time.


    ## Getting Started with Raspberry Pi Zero


    When you click on **Open**, the system will try to open a terminal window onto
    your Raspberry Pi through the LAN connection. The first time you do this, you
    will get a warning about an RSA key as the two computers don''t know about each
    other. Windows therefore complains that a computer that it doesn''t know is about
    to be connected in a fairly intimate way. Simply click on **OK** and you should
    get a terminal with a login prompt, like the following screenshot:


    ![](img/324d126a7e2da696837a3e066326bd61_36_0.png)


    Now you can log in and issue commands to your Raspberry Pi Zero. If you''d like
    to do this from a Linux machine, the process is even simpler. Bring up a terminal
    window and then type `ssh pi@xxx.xxx.xxx.xxx` where the `xxx.xxx.xxx.xxx` is the
    `inet addr` of your device. This will then bring you to the login screen of your
    Raspberry Pi Zero, which should look similar to the preceding screenshot.


    **SSH** is a really useful tool to communicate with your Raspberry Pi Zero. However,
    sometimes you need a graphical look at your system and you don''t necessarily
    want to connect to a display. You can get this on your remote computer by using
    an application called **vncserver**. You''ll need to install a version of this
    on your Raspberry Pi Zero by typing `sudo apt-get install tightvncserver` in a
    terminal window on your Raspberry Pi Zero. This is a perfect opportunity to use
    SSH, by the way.

