    The purpose of some of these pins is very clear. Pins 1 and 17 are available to
    supply 3.3 volts, pins 2 and 4 supply 5 volts, and pins 9, 25, 39, 6, 14, 20,
    30, and 34 are all connected to ground on Raspberry Pi Zero. The rest of the pins
    have various capabilities, which you''ll learn in this chapter. Let''s start with
    the pins that can be used to supply a simple DC signal to the outside world.


    # Simple GPIO digital voltage output


    Perhaps the simplest connection that you can make to the GPIO on Raspberry Pi
    is to connect to a pin so that you can send a simple digital output voltage. To
    do this, you will use the GPIO IO pins to light up an LED. To be successful, you''ll
    need four pieces of hardware: a solder-less breadboard, some jumper wires, an
    LED, and a resistor. Here are more details on these parts:


    +   1. A breadboard is a simple device that lets you easily connect your various
    electronic parts. They come in various sizes, shapes, and colors. Here is a picture
    of such a breadboard:


    ![](img/324d126a7e2da696837a3e066326bd61_69_0.png)


    They are available at many online outlets and hobby shops.'
  - '[PAGE 70]


