  md: '# How to do it...


    To use Any State transitions, follow these steps:


    +   1. Follow the previous recipe to import the characters and place them on the
    scene.

    +   2. Create a new **Animator Controller** for the **Spider** (you can also edit
    the existing one).

    +   3. Create a new `bool` parameter in the controller and call it **Dead**.

    +   4. Create a new `Trigger` parameter in the controller and call it **Hit**.

    +   5. Drag and drop the **Idle**, **Death**, and **HitReaction** animations of
    the **Spider** into the controller. The **Idle** animation should be our default
    state.

    +   6. Find the blue **Any State** node in the controller. See the following screenshot
    for reference:

    +   7. Right-click on it and create the following transitions:

    +      - **Any State** | **HitReaction** with one condition: **Hit** `Trigger`
    parameter. **Has Exit Time** should be set to `false`, **Can Transition To Self**
    set to true, and **Transition Duration** set to 0.2 seconds.

    +      - **Any State** | **Death** with one condition: **Dead** `bool` parameter
    set to `true`. **Has Exit Time** should be set to `false`, **Can Transition To
    Self** set to false, and **Transition Duration** set to 0.2 seconds.

    +      - **HitReaction** | **Idle**: For this one, you need to right-click on
    the **HitReaction** state first. It should have no conditions, **Has Exit Time**
    set to `true`, and **Transition Duration** set to 0.2 seconds.

    +   8. Assign the controller to the **Spider''s Animator** component.

    +   9. Create a new script and call it `EnemyWithHits.cs`.


    ![](img/616a75b593bef4212f618360fceea442_192_0.png)


    Transitions from Any State'
  merge: -1
  img_proc: true
- pgno: 193
  md: "10. Derive this script from the `Enemy.cs` script instead of `MonoBehaviour`.\
    \ You can find the `Enemy.cs` script in the previous recipe.\n\n11. To make our\
    \ hit reactions work, we need to override the `Hit()` and `Die()` functions. In\
    \ the first one, we check if our character's `isAlive` flag. If our **Spider**\
    \ is dead already, we don't attempt to play hit reactions. If it is alive, we\
    \ play the hit reaction by setting the **Hit Trigger** parameter in the controller.\
    \ Next we call the base implementation of the `Hit()` function:\n\n```\npublic\
    \ override void Hit(int damage)\n{\n    if (!isAlive)\n    {\n        return;\n\
    \    }\n    anim.SetTrigger(\"Hit\");\n    base.Hit(damage);\n}\n```\n\n12. In\
    \ the `Die()` function, we set the `isAlive` flag to false and call the base implementation\
    \ of the `Die()` function:\n\n```\npublic override void Die()\n{\n    isAlive\
    \ = false;\n    base.Die();\n}\n```\n\n13. Assign the script to the **Spider**\
    \ character and play the game to see the effect.\n\n# How it works...\n\nAny State\
    \ is a powerful tool for organizing animation graphs. If we know we need to access\
    \ an animation state from any other state, we can create a transition from Any\
    \ State node, instead of creating a web of transitions from all the necessary\
    \ states.\n\nThis special state's transitions have one additional parameter: **Can\
    \ Transition to Self**. If set to `false` it blocks transitions to the same state."
  merge: -1
  img_proc: true
