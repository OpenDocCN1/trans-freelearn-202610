  md: '# How it works...


    Animation Events call public functions from the scripts assigned to the game object
    playing the animation. To make it work, the **Function** field of the Animation
    Event needs to have the same name as the function we want to call from the script.


    Events are extremely useful because they allow us to synchronize function calls
    with animations. The best moment to check if player hits the target is when we
    see a visual hit in the animation—a fist is in its extreme position in a punch,
    or a sword is in its extreme position in a swing. Without Animation Events, we
    would have to always manually delay function calls to achieve similar results.


    # There''s more...


    Animation Events can also have an `int`, `float`, `string`, or an object type
    parameter. To use these parameters, we have to implement them in our functions
    called by the event. These parameters can be useful for playing special effects
    or sounds (you can find more information about it in the *Using Animation Events
    to trigger sound and visual effects* recipe in `Chapter 7`, *Special Effects*.


    # Using transitions from Any State to play hit reactions


    Often, there are situations when we would like to transition to an animation from
    any other one. The most common example is the hit reaction. Our characters can
    be hit while standing, walking, or even attacking. Creating and managing all those
    transitions would be cumbersome and difficult. In Unity, we can use a special
    **Any State** in the controllers to achieve transitions from any given animation.


    # Getting ready


    We are going to use the characters from the previous recipe and add one animation
    to the **Spider** character: **HitReaction**. You can also use the example project
    and go to the `Chapter 06 Handling combat\Recipe 03 Using transitions from any
    state to play hit reactions` directory. You can find the `Example.unity` scene
    there, with two characters: **Humanoid** and **Spider**. When you play the game,
    **Spider** will react to hits. In the `Rigs` directory of the previous recipe,
    you can find the required animations.'
  merge: -1
