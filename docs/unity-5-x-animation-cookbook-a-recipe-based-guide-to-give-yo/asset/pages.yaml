- pgno: 63
  md: '# Blending light colors with the Animation View and the Animator Controller


    This recipe shows how to use Animation Controllers with the clips created in Animation
    View.


    # Getting ready


    We will animate the light color in this example. You need to have a scene with
    at least one light and a mesh to see the effect. You can also download the provided
    example Unity project and go to the Chapter 02 Working with the animation view\Recipe
    02 Using the animation view and the animator controller to blend light colors
    directory. You will find a scene called Example.unity there, with a direction
    light that has already been animated. In this example, we also animate the background
    color of the camera (the camera is a child object of the directional light).


    # How to do it...


    To blend animations (colors in this example) of a game object, you need to follow
    these steps:


    +   1. Open the scene and select the light game object in the Hierarchy.

    +   2. With the light selected, go to Window | Animation to open the Animation
    View and create at least two animations the same way as in the Using Animation
    View to create a flickering light recipe, but this time set the color property
    instead of the light''s intensity. In our example, we have two Animation Clips:
    Day and Night. They just set the color of the directional light: Day sets it to
    bright yellow and Night to dark blue. There is no change in the light color over
    time. Each animation has two key frames with the exact same color value in each
    key frame (this color is different for each animation). Each animation lasts for
    about 7 seconds.

    +   3. An Animator Controller will be created automatically.'
  merge: -1
  img_proc: true
