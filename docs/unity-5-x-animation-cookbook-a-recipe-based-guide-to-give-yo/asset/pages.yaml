    +   7. Play the game to see the effect.


    ![](img/616a75b593bef4212f618360fceea442_64_0.png)


    # How it works...


    The purpose of this recipe is to show one very important feature of the Unity
    animation system: the Animator Controller can blend Color, Vector3, Quaternion,
    bool, and float values stored in Animation Clips. The Int and string values are
    not supported and cannot be animated. You can only animate public MonoBehaviour
    script variables and Unity component properties.'
