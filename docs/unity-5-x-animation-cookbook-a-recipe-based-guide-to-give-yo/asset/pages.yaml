    to create a dodge move` directory. Open the `Example.unity` scene there. You will
    find the same **Humanoid** and **Spider** characters we had in previous recipes.
    They have the same animations and scripts as in the *Using transitions from Any
    State to play hit reactions* recipe. The **Spider** has one additional animation:
    **Dodge**. If you hit the space bar in **Play Mode**, the **Spider** will attempt
    to dodge the sword swing. You can find all the necessary animations in the `Chapter
    06 Handling combat\Recipe 02 Using animation events to trigger script functions\Rigs`
    directory.


    # How to do it...


    To make a character dodge, follow these steps:


    +   1. Import the character into Unity and place it in a scene.

    +   2. If you want the character to get damage and play hit reactions, follow
    the previous recipe.

    +   3. Create a new Animator Controller or edit the one from the previous recipe.

    +   4. Drag and drop the **Dodge** animation into the controller.

    +   5. Create a **Dodge** `Trigger` parameter in the controller.

    +   6. Create two transitions:

    +      - **SpiderIdle** | **Dodge** with one condition: **Dodge** `Trigger` parameter.
    **Has Exit Time** should be set to false and **Transition Duration** set to 0.2
    seconds.

    +      - **Dodge** | **SpiderIdle** with no conditions: **Has Exit Time** should
    be set to true and **Transition Duration** set to 0.2 seconds.

    +   7. Add a **Rigidbody** component to the **Spider** character and freeze its
    rotations.

    +   8. Add a collider to the **Spider** character (we are using **Sphere Collider**
    for our **Spider**). You may also need to create a zero friction **Physical Material**
    and add it to the collider. It allows the animation to control Rigid Body movement
    without any additional friction.

    +   9. Set the **Animator** component''s **Update Mode** to **Animate Physics**
    in our **Spider**.

    +   10. Attach the controller to the **Animator** component of our **Spider**.

    +   11. Create a new script and call it `Dodge.cs`. In this script''s `Update()`
    function, we simply set the **Dodge** `Trigger` in the controller when player
    presses the space bar:


    ```

    if (Input.GetKeyDown(KeyCode.Space))

    ```'
