    project and go to the `Chapter 09 Physics and animations\Recipe 06 Applying force
    to a ragdoll` directory. If you open the `Example.unity` scene there and play
    the game, you will be able to click on any body part of the character. That will
    turn the ragdoll on and apply force to this body part, which will make the character
    look like it was hit or shot in that particular limb:


    ![](img/616a75b593bef4212f618360fceea442_282_0.png)


    Force applied directly to the head of the character


    # How to do it...


    To apply force to a ragdoll''s body part, follow these steps:


    +   1. Follow the *Creating a humanoid ragdoll with the ragdoll wizard* recipe
    to have a character with a working ragdoll and the `HandleRagdoll.cs` script (a
    script to turn the ragdoll on).

    +   2. Create a new C# script and name it `RagdollForceApply.cs`. In this script''s
    `Update()` function, we first check whether the player clicks on the left mouse
    button. Then we create a ray from the mouse cursor position in the camera''s direction
    and we check if we hit a collider that has one of the layers described by the
    `public LayerMask ragdollBodyPartsLayer` variable. If we manage to hit a collider,
    we try to get the `Rigidbody` component from it and store it in our `Rigidbody
    hitBodyPart` variable. If we indeed find the rigid body, we call the `void ApplyForce()`
    function:


    ```

    if (Input.GetKeyDown(KeyCode.Mouse0))

    ```'
