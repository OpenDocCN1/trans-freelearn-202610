  md: '13. Save the script and attach it to the character. Create a new game object
    that we want to pick up. Call it **PickupObject** and drag it to the **Ik Target**
    field in the script''s **Inspector**.


    14. Play the game and press the space bar to see the effect. You may move the
    **PickupObject** in the **Scene** View and press the space bar again. Our character
    will still try to reach it (it may fail due to the limited range of its arms).


    # How it works...


    This recipe works for Humanoid characters only. It uses the Unity''s built-in
    inverse kinematics solver. The key elements of this recipe are as follows:


    +   - **Animation Curve**: We use an Animation Curve to smoothly set the weight
    for the IK solver during the Pickup animation playback.

    +   - **SetIKPosition()**: This function sets the target position for a given
    body part. We are using a `public Transform ikTarget` variable in the script and
    pass it to the function. You can get the target in runtime.

    +   - **SetIKPositionWeight()**: This function sets the weight of the IK solver.
    A weight value of 1 means that IK is in full control of a given body part and
    a value of 0 means that the animation is in full control.

    +   - **IK Pass**: To be able to use inverse kinematics for Humanoid characters,
    we need to enable the **IK Pass** option in the controller''s layer properties.


    # See also


    If you want to play with IK solutions a little more, definitely check out the
    Final IK package published by *RootMotion* in the `Asset` store. It is a very
    robust full-body IK solution for Unity.


