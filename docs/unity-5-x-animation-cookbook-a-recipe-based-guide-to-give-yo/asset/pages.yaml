- pgno: 295
  md: '# How it works...


    The concept behind this recipe is based on having three rigs: one that holds the
    animations, one that is a simple ragdoll, and one to which the mesh is skinned.
    To make it work in Unity, we need to copy our character three times. One of the
    copies is used to create the ragdoll, the second is the animated rig and we need
    to remove the mesh from it, and the last one is the mesh with the rig but has
    no Animator component. All these objects finally get parented to the animated
    rig''s parent (the CharacterAnimated game object). This way, our character is
    still a single game object and can be driven with root motion. The final hierarchy
    looks like the following:


    +   - **CharacterAnimated**

    +   - **metarig (the original name of the rig of this character)**

    +   - **SkinnedRig**

    +   - **SkinnedMesh**

    +   - **Ragdoll**


    With such a setup, we can get all the transforms from the metarig (the rig that
    is actually animated), the SkinnedRig (the rig to which the mesh is skinned),
    and the ragdoll. Since our character''s mesh is using the SkinnedRig (we cannot
    see the two remaining rigs in the game), we can dynamically set its transforms''
    location and rotation. This way we can use the Vector3.Lerp() and Quaternion.Lerp()
    functions to interpolate the SkinnedRig transforms'' between the Ragdoll''s and
    metarig''s (the animated rig''s) transforms.


    The standing up animations are prepared in such a way that the hips of the character
    are roughly at the 0,0,0 point. We move the main RigidBody of the character to
    the point where the hips of the ragdoll are. This way, when we blend to the standing
    up animation, our character''s animated rig (an animation) matches the position
    of the ragdoll. The rest is handled by blending the pose from the ragdoll to the
    current animation.


    # There''s more...


    You can also use this concept on non-humanoid characters.'
  merge: -1
  img_proc: true
