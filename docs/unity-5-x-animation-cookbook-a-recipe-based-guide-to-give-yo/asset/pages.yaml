  md: '# How to do it...


    To use IK to interac with scene objects, follow these steps:


    +   1. Import the character to Unity. Make sure to have the **Idle** and **Pickup**
    animations and set the rig to **Humanoid**.

    +   2. Create an Animator Controller and assign it to the character.

    +   3. Make sure to check the **IK Pass** option in the layer properties of the
    controller.

    +   4. Drag and drop the **Idle** and **Pickup** animations into the controller.
    Make sure **Idle** is the default state.

    +   5. Create a `Trigger` parameter and call it `Pickup`. Also create a `float`
    parameter and call it **PickupIK**.

    +   6. Create two transitions:

    +      - **Idle | Pickup** with one condition: **Pickup** `Trigger` parameter.
    **Exit Time** should be set to false and **Transition Duration** set to around
    0.1 seconds.

    +      - **Pickup | Idle** with no conditions. **Has Exit Time** should be set
    to true and **Transition Duration** set to around 0.1 seconds.

    +   7. Go to the character''s **Import** settings in the **Animations** tab.

    +   8. Create a new **Animation Curve** and name it `PickupIK` (the name has to
    match the `float` **PickupIK** parameter name).

    +   9. Create a smooth curve with the minimum value of 0 and the maximum of 1.
    The maximum value should match the moment when the character reaches for the object.
    See the following image for reference:'
  merge: -1
  img_proc: true
- pgno: 178
  md: "![](img/616a75b593bef4212f618360fceea442_178_0.png)\n\nPickupIK Animation Curve.\
    \ The maximum value (1) matches the frame when character picks up the object\n\
    \n+   10. Apply the import settings.\n+   11. Create a new script and call it\
    \ `PickUpIK.cs`. In that script, we have a void `OnAnimatorIK(int layerIndex)`\
    \ function. This function is called every frame in the IK Pass after all animations\
    \ have been evaluated. In that function, we get the value of the **PickupIK**\
    \ `float` parameter from the controller (which equals the value of the **Animation\
    \ Curve**). Then we set this value as the weight for the left-hand IK. We also\
    \ set the left-hand IK position to match a `public Transform ikTarget` member\
    \ variable in which we store the reference to the object we want to pick up:\n\
    +   12. In the `Update()` function of the script, we check if the player pressed\
    \ the space bar and played the **Pickup** animation.\n\n```\nikWeight = anim.GetFloat(\"\
    PickupIK\");\nanim.SetIKPosition(AvatarIKGoal.LeftHand,\n    ikTarget.position);\n\
    anim.SetIKPositionWeight(AvatarIKGoal.LeftHand, ikWeight)\n```"
