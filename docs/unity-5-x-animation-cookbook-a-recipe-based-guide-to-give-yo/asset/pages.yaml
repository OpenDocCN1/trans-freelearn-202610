    example files, we named the animation HumanAttack. We also need an enemy (we use
    a Spider character in this example) with Idle and Death animations. You can also
    download the provided example Unity project and go to the Chapter 06 Handling
    combat\Recipe 02 Using animation events to trigger script functions directory.
    You will find a scene called Example.unity there, with Humanoid and Spider characters.
    In the Rigs directory, you can find the Humanoid.fbx character with all required
    animations. When you play the game, the Humanoid character will attack the Spider
    several times and deal damage to it.


    # How to do it...


