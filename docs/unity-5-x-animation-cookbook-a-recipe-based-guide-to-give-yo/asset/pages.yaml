  md: "18. Create a new C# script and name it RagdollWeight.cs. This script contains\
    \ several functions. First, in the void Init() function that is called from the\
    \ Start() function, we set references to the bones of our three rigs to be able\
    \ to blend between them later on. We also get the reference to the RigidBody and\
    \ Animator components attached to our character. Finally, we turn the ragdoll\
    \ game object off:\n\n```\nvoid Init()\n{\n    rb = GetComponent<Rigidbody>();\n\
    \    anim = GetComponent<Animator>();\n    skinnedRigTransforms = \n    skinnedRig.GetComponentsInChildren<Transform>();\n\
    \    ragdollTransforms = \n    ragdoll.GetComponentsInChildren<Transform>();\n\
    \    animatedRigTransforms = \n    animatedRig.GetComponentsInChildren<Transform>();\n\
    \    ragdoll.gameObject.SetActive(false);\n}\n```\n\n19. In the void EnableRagdoll()\
    \ function, we first check whether our float blendFactor is not greater than 0.5\
    \ (that would mean we are still in the “ragdoll phase”). If it is less than 0.5,\
    \ we set all ragdoll bones' positions and rotations to match the animatedRigTransforms\
    \ (we match the pose of the ragdoll to the current character pose). Finally, we\
    \ set the main RigidBody component to kinematic and enable the ragdoll game object.\
    \ We also set the blendFactor to 1, which means the ragdoll is fully enabled:\n\
    \n```\nvoid EnableRagdoll()\n{\n    if(blendFactor > 0.5f)\n    {\n        return;\n\
    \    }\n    for (int i = 0; i < ragdollTransforms.Length; i++)\n    {\n      \
    \  ragdollTransforms[i].localPosition = \n        animatedRigTransforms[i].localPosition;\n\
    \        ragdollTransforms[i].localRotation = \n        animatedRigTransforms[i].localRotation;\n\
    \    }\n    rb.isKinematic = true;\n    ragdoll.gameObject.SetActive(true);\n\
    \    ragdollOn = true;\n    blendFactor = 1f;\n}\n```"
