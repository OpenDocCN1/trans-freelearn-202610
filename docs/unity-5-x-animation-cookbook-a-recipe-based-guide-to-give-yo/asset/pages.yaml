- pgno: 147
  md: '# How it works...


    In this recipe, we are using physics to make the character jump. To do it properly,
    we need to turn off root motion in the Animator component when the character is
    in the air to make it fully controlled by the physics engine instead of our animations.
    We are allowing the character to jump only when it''s standing on the ground.
    To avoid setting the `onGround` variable to true just after the jump, we temporarily
    disable the ground checking function after the player presses the jump button.


    Jump animation is divided into three parts:


    +   - **Jump**: In this animation, our character starts to jump

    +   - **InAir**: This is a long looped animation of the character being in the
    air (or falling down)

    +   - **Land**: This animation is played when the character touches the ground
    after being in the air


    # There''s more...


    Again, this recipe shows the most basic jump setup. You may want to add more start
    jump animations from different poses (run and walk extremes, passing poses, and
    another one from the idle animation). To do so, create Animator Controller parameters
    for each of those poses and **Animation Curves** with the same names as the parameters
    you''ve created. Use the **Animation Curves** in the walk and run animations to
    tell Unity which pose is the animation currently in (left/right extreme or left/right
    passing pose). Use the parameters in the Animator Controller to set the appropriate
    transitions between the animations. You may also need to add more landing animations
    that would transition to idle, walk, or run, depending on the current character
    **Speed** parameter value (player input).


    # Using root motion to drive a NavMesh Agents'' movement with animations


    In this recipe, we will use root motion to move and steer a character with a Nav
    Mesh Agent component. This can be used to get rid of foot sliding in this type
    of character.'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# Getting ready


    We are going to use the same character as in the previous recipe with all its
    animations. You should have a character with at least the **Idle**, **WalkLeft**,
    **WalkForward**, and **WalkRight** animations ready and set up in the Animator
    Controller the same way as in the *Using root motion to steer a character* recipe.
    You can also go to the `Chapter 04 Character movement\Recipe 07 Using root motion
    to drive Navmesh Agents movement with animations` directory. You will find an
    `Example.unity` scene there. Open it, play the game, and click on the ground to
    make the characters move using **NavMesh** Agents and root motion.


    # How to do it...


    To use root motion for moving and steering a character with Nav Mesh Agent component,
    follow these steps:


    +   1. Import the character with the **Idle**, **WalkLeft**, **WalkForward**,
    and **WalkRight** animations and set it up the same way as in the *Using root
    motion to steer a character* recipe, but don''t write the `RootMotionSteering.cs`
    script as we will create a new one.

    +   2. Add the Nav Mesh Agent component to the character. Make sure it also has
    the **Capsule Collider** component and the **Rigidbody** component with frozen
    rotation in every axis. Also make sure that the Animator component''s **Apply
    Root Motion** option is set to true and **Update Mode** set to **Animate Physics**
    (the same way as in the *Using root motion to steer a character* recipe).

    +   3. Bake the **NavMesh** in the scene. To do so, make sure your ground model
    has a collider attached (you can use the **Mesh Collider** component). Then go
    to **Window | Navigation**. Select the ground in your scene and set it to **Navigation
    Static** in the **Object** tab of the **Navigation** window. Click on the **Bake**
    button at the bottom of the **Navigation** window. After a short while, **NavMesh**
    should be baked (it is visible in the scene as a light blue, semitransparent mesh
    covering the ground model). It is needed for our **NavMesh Agent** to work.

    +   4. If your character is using any scripts from this book, remove them from
    its **Inspector** (we don''t need the **Jump**, **RootMotionSteering**, and **SetRawDirectionAndSpeed**
    scripts).

    +   5. Create a new script and call it `NavMeshAgentWithRigidBody.cs`. We will
    use both the **NavMesh Agent** and the **Rigidbody** components in this script.'
  merge: -1
  img_proc: true
- pgno: 149
  md: "6. In the Update() function of the script, we first disable updating rotation\
    \ and position in the NavMesh Agent. That will prevent the agent from moving our\
    \ character's transform. Then we calculate the float direction variable's value.\
    \ We do it in a very similar way to what we did in the Using root motion to steer\
    \ a character recipe, but instead of creating our own desiredMoveDirection vector,\
    \ we are using the NavMesh Agent's desiredVelocity vector. This vector describes\
    \ the speed and direction the agent would like to move with:\n\n```\nagent.updatePosition\
    \ = false;\nagent.updateRotation = false;\n\ndirection = Vector3.Angle(transform.forward,\n\
    agent.desiredVelocity) *\nMathf.Sign(Vector3.Dot(agent.desiredVelocity,\ntransform.right));\n\
    ```\n\nIn the preceding code agent is the variable in which we store the reference\
    \ to the Nav Mesh Agent component. We set this reference in the Start() function.\n\
    \n7. Next we calculate the float speed variable value: it's simply the magnitude\
    \ of the agent.desiredVelocity vector. We also set the Direction, Speed, DirectionRaw,\
    \ and SpeedRaw parameters in our Animator Controller using the anim variable that\
    \ stores the reference to the Animator component. The anim variable is set in\
    \ the Start() function. Lastly, we set the agent.nextPosition to be the same as\
    \ our transform position every frame. This prevents the agent from moving away\
    \ from our character's transform.\n\n8. Save the script and attach it to the character.\n\
    \n9. We also need a script to tell the NavMesh Agent where we want to go. There\
    \ is a ClickToMove.cs script in the Shared Scripts folder in the provided Unity\
    \ example. In the Update() function, we use the agent.SetDestination() method\
    \ when the player presses the left mouse button. A ray is cast from the mouse\
    \ cursor position in the main camera's forward direction. If the ray hits a collider,\
    \ the hit position is used to set the new destination for the NavMesh Agent:\n\
    \n```\nif (Input.GetKeyDown(KeyCode.Mouse0))\n{\n    if (Physics.Raycast(Camera.main.ScreenPointToRay(\n\
    \    Input.mousePosition), out hit))\n    {\n        agent.SetDestination(hit.point);\n\
    \    }\n}\n```"
  merge: -1
