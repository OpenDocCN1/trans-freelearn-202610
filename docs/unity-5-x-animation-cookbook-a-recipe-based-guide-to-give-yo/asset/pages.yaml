- pgno: 58
  md: '# 2


    # Working with the Animation View


    This chapter explains the **Animation View**, which is an essential tool in Unity''s
    animation workflow, and the following topics are covered in this chapter:


    +   - Using the Animation View to create a flickering light

    +   - Blending light colors with the Animation View and the Animator Controller

    +   - Animating object''s world position – creating a moving platform

    +   - Animating object''s local position – creating automatic doors

    +   - Using the Hierarchy to animate local rotation – creating an orbiting planet

    +   - Animating triggers – creating a death trap

    +   - Creating an elevator triggered by player input


    # Introduction


    In the first chapter, we imported animations from external 3D packages to Unity.
    Now we will learn how to use Unity''s powerful built-in tool called the Animation
    View. It allows us to animate almost everything within the editor and can be used
    to create interesting gameplay mechanisms. Knowledge of this tool is essential
    to learn future recipes as we will use Animation View a lot.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# Using the Animation View to create a flickering light


    This first recipe shows how to make a basic animation inside Unity. We will animate
    a light-intensity value to create an interesting flickering light effect, which
    is often found in horror or sci-fi games.


    # Getting ready


    Before we start, you need to have a scene with geometry and at least one light.
    You can also download the example provided; open the project in Unity and go to
    the folder `Chapter 02 Working with the animation view\Recipe 01 Using the animation
    view to create a flickering light`. You will find a scene called `Example.unity`
    there, with a point light that has already been animated.


    # How to do it...


    To use the Animation View and create a flickering light, follow these steps:


    +   1. Open the scene and select a light you want to animate.

    +   2. With the light selected, go to **Window | Animation**. The Animation View
    will open.

    +   3. To create a new animation, click on the **Create** button, as shown in
    the following screenshot:


    ![](img/616a75b593bef4212f618360fceea442_59_0.png)'
  merge: -1
  img_proc: true
- pgno: 60
  md: '+   4. A **Create New Animation Clip** will appear. You can choose a directory
    and the animation name. Then, click the **Save** button.

    +   5. A new, empty animation will be created, an **Animator** component will
    be added to the selected game object (a light in this example), and an Animator
    Controller will be created in the same directory as the animation clip.

    +   6. To animate the light intensity, we need to add an **Intensity** property.
    Click on the **Add Property** button in the Animation View, then choose **Light
    | Intensity**, and then click on the + icon next to it, as shown in the following
    screenshot:


    ![](img/616a75b593bef4212f618360fceea442_60_0.png)


    +   7. Two key frames will be added. You can click and drag on them to adjust
    their position in time. You can also add new key frames by changing any property
    in the light game object''s **Inspector** (make sure to have the record button
    clicked in the upper-left corner of the **Animation** View).

    +   8. Add several key frames with different values of light intensity.

    +   9. Close the **Animation** View when the animation is done. Any changes will
    be saved automatically.

    +   10. Play the game to see the effect.'
  merge: -1
