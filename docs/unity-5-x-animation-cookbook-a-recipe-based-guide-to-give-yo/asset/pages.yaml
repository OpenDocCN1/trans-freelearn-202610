    # How it works...


    You can use animation frames rendered from a 3D package to create 2D sprites in
    Unity as long as those frames have transparent background. Combining those frames
    into a sprite sheet saves precious draw calls (sprites are treated as one texture)
    and makes your game run smoother on lower end devices. It is also easier to organize
    your project files if you combine sprites into sprite sheets. Unity can automatically
    split a sprite sheet with transparency into multiple sprites. It recognizes *empty
    pixels* (transparent pixels) and isolates individual objects (or animation frames)
    quite effectively.'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'Unity can also automatically pack the sprites into a sprite sheet using the
    sprite packing feature. To pack sprites into an atlas, first make sure that packing
    is enabled. To do so, go to **Edit | Project Settings | Editor** and check the
    **Sprite Packer Mode**. You should change it to **Always Enabled**. Then select
    the sprites you want to pack into one atlas and give them the same **Packing Tag**.
    Finally, open the **Sprite Packer** (go to **Window | Sprite Packer**) and click
    on the **Pack** button. All sprites with the same **Packing Tag** will be packed
    together.


    # There''s more...


    There are a few other, interesting options in the **Sprite Editor**:


    +   - In the **Slice** dialog, you can set the **Type** to:

    +     - **Automatic**: Unity will try to automatically slice the sprite sheet
    into individual sprites.

    +     - **Grid By Cell Size**: Unity will slice the sprite sheet into a grid with
    defined size of every cell in pixels. You can slice the sprite sheet into 64 ×
    64 pixel cells for instance

    +     - **Grid By Cell Count**: Unity will slice the sprite sheet into a grid
    of sprites with the given number of cells and rows

    +   - You can also set the **Pivot** of each sprite in the **Slice** dialog. There
    are multiple options available for setting the pivot of each created sprite to
    the center of the sprite, right corner, left corner, and so on.

    +   - You can also trim each sprite manually when you select it. To do so, click
    on the border of the sprite and drag it.

    +   - You can adjust the pivot of each sprite in a similar way. Select the sprite
    in the **Sprite Editor**, click on its pivot (the blue circle), and drag it to
    change its position.


    # See also


    To create a sprite animation, see the next recipe.'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# Creating a frame-by-frame sprite animation with the Animation View


    This recipe shows how to use the Animation View to create sprite animations from
    previously rendered (or hand drawn) frames.


    # Getting ready


    To create a frame by frame sprite animation in Unity, you should first draw or
    render out the animation frames from a 3D package, combine them into a sprite
    sheet, and import the sprite sheet into Unity (see the Exporting a 2D sprite animation
    from a 3D package recipe). You can also download the provided example Unity project
    and go to Chapter 03 2D and user interface animation\Recipe 02 Creating a frame
    by frame sprite animation with the animation view directory. You will find a scene
    called Example.unity there, with a Coin game object that has been already animated.
    You can select it and go to Window | Animation to see how the animation was prepared.


    # How to do it...


    To create a frame by frame sprite animation in Unity, follow these steps:


    +   1. Select your sprite sheet asset in the Project View.

    +   2. Unfold the sprite sheet to see the individual sprites (children objects
    of the sprite sheet asset).

    +   3. Select one of the sprites, and then drag and drop it into the scene''s
    Hierarchy.

    +   4. You can rename the created game object.

    +   5. With the game object selected, go to Window |Animation.

    +   6. Click on the Create button in the Animation View to create a new Animation
    Clip.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '7. Adjust the **Samples** to the number of frames per second your animation
    was created with (12 in this example), as shown in the following screenshot:


    ![](img/616a75b593bef4212f618360fceea442_98_0.png)


    +   8. Make sure the record button is pressed. In the **Project** View, select
    all the frames (child sprites) in your sprite sheet asset and drag them into the
    **Animation** View.

    +   9. A frame by frame sprite animation will be created. Click on the **Play**
    button in the **Animation** View or run the game to see the effect.


    # How it works...


    Unity can animate the public **Sprite** field in the **Sprite Renderer** component
    of a game object. This is exactly what we did in this recipe. We are changing
    the sprites each frame to create a frame by frame animation. We have changed the
    **Samples** number to lower the frame rate of the animation. That allows us to
    use less frames per second. In standard 2D frame by frame animation, we use 12
    or 24 frames per second, and Unity''s default **Samples** number is 60.


    In some cases, you can use even lower **Samples** values: try experimenting with
    8 frames per second.'
  merge: -1
