  md: '# Creating a 2D sprite doll animation with the Animation View


    In this recipe, we will use a different approach: a 2D sprite doll animation.
    It is based on creating a 2D doll character with all its limbs as separate sprites
    and then animating those sprites using Unity''s **Hierarchy** and the **Animation**
    View.


    # Getting ready


    To create a 2D doll animation, first you need to prepare your character sprite
    sheet with all the limbs as separate sprites. See the following screenshot for
    reference:


