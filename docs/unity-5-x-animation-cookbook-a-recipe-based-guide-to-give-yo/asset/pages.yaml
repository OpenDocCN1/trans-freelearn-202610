    In this recipe, we use the **Hierarchy** to animate rotation of **Sun** and **Moon**.
    We also animate the **Intensity**, **Color**, and **Shadow Strength** of **Directional
    Lights** attached to those game objects. This way, we can create an illusion of
    a day and night cycle.


    # There''s more...


    To control the speed of the day and night cycle animation, you can modify the
    `anim.speed` parameter in runtime from scripts. The `anim` variable is a reference
    to the **Animator** component attached to the **DayAndNight** game object.'
