    You can also use the provided example Unity project and go to the `Chapter 06
    Handling combat\Recipe 09 Using blend trees to aim` directory. You will find an
    `Example.unity` scene there, with a **Humanoid** character. Play the game to see
    the effect. You can find all the necessary animations in the `Rigs` directory.


    # How to do it...


    To use the **Blend Trees** methods for aiming, follow these steps:


    +   1. Import your character with all the necessary animations to Unity and place
    it on the **Scene**.

    +   2. Follow the *Using Avatar Masks and animator controller layers to walk and
    aim* recipe to make the character walk and aim.

    +   3. Open the controller and go to the **Aim Layer**.

    +   4. Delete the **AimForward** state and create a new **Blend Tree**.

    +   5. Create two float parameters: **AimVer** and **AimHor**.'
