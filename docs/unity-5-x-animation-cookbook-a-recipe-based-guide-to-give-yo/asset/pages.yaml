- pgno: 245
  md: '# 8


    # Animating Cutscenes


    This chapter explains how to create and play cutscenes in games and covers the
    following recipes:


    +   - Using the **Animation** View to animate the camera

    +   - Changing cameras with animation

    +   - Synchronizing animation of multiple objects

    +   - Importing a whole cutscene from a 3D package

    +   - Synchronizing subtitles

    +   - Using root motion to play cutscenes in gameplay


    # Introduction


    In this chapter we will handle cutscenes. These are short animated sequences used
    mostly to unveil new story events. You can create a lot of them directly in Unity,
    or import animations from your favorite 3D package (we will be using Blender 3D
    as an example).'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# Using the Animation View to animate the camera


    In this recipe, we will create camera animation using Unity''s built-in Animation
    View:


    ![](img/616a75b593bef4212f618360fceea442_246_0.png)


    # Getting ready


    We don''t need anything fancy for this recipe as we will create it from scratch
    in Unity. You may need some decorations in the scene though. You can also open
    the provided example Unity project and go to the Chapter 08 Animating Cutscenes\Recipe
    01 Using the animation view to animate the camera directory. You can find an animated
    Camera (1) game object in the Example.unity scene there. If you play the game,
    the camera will play an animation.


    # How to do it...


    To create camera animation with the Animation View, follow these steps:


    +   1. Select the camera you want to animate (you can also add a new camera to
    the scene).

    +   2. Open the Animation View (go to Window | Animation).'
  merge: -1
  img_proc: true
- pgno: 247
  md: '+   3. Create a new Animation Clip and call it `CameraAnimation`.

    +   4. Make sure the record button is pressed.

    +   5. Move and rotate the camera to create the desired animation. If the camera
    is not parented to any game object, the animation will be done in world space.

    +   6. If you want to use this animation as a cutscene, create a prefab from the
    camera.

    +   7. Play the game to see the effect.


    # How it works...


    Cameras can be animated the same way as other game objects. We can animate their
    **Transforms**, but additionally, we can also animate the **Camera** component.
    This way we can create interesting effects with the **Field of View** parameter
    (for instance, the simple vertigo effect shown in the example project).


    # There''s more...


    If you create a prefab out of an animated camera, you can instantiate it to play
    a cutscene. Remember to set the cutscene camera''s **Depth** to be greater than
    the in-game camera''s. This way, simply instantiating the cutscene camera prefab
    will automatically play the cutscene. All you need to do is to destroy the instantiated
    game object after the animation ends. You can do so with an Animation Event associated
    with a function that will destroy the object (you need to use a script for that).


    You should also remember to disable the **Audio Listener** component in the in-game
    camera when you instantiate the cutscene camera. After the cutscene is finished,
    make sure to re-enable the **Audio Listener** component again.


    # Changing cameras with animation


    Not only can we animate cameras using the Animation View, but we can also change
    the shots in time.'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# Getting ready


    This recipe will also be created from scratch in Unity. You can download the example
    Unity project provided and go to `Chapter 08 Animating Cutscenes\Recipe 02 Changing
    cameras with animation` directory. You can find a **Camera Changer** game object
    in the `Example.unity` scene there, with three cameras as children. If you play
    the game, the cameras will change.


    # How to do it...


    To change cameras using animation, follow these steps:


    +   1. Create an empty game object in the Scene View and name it `CameraChanger`.

    +   2. Rename the **Main Camera** to **Camera (1)** and copy it two times. You
    should have **Camera (1)**, **Camera (2)**, and **Camera (3)** game objects.

    +   3. Parent all three cameras to the **CameraChanger**.

    +   4. Place the cameras as you wish.

    +   5. Set the **Depth** of the cameras in increasing order. Every new shot should
    have a greater **Depth** value.

    +   6. Select the **CameraChanger** game object and open the **Animation** View.

    +   7. Create a new **Animation Clip** and call it **CameraChange**.

    +   8. Make sure the record button is pressed.

    +   9. Select all cameras and disable their game objects. Then select the first
    camera and enable its game object. New keys should be created in the first frame
    of the animation. The first camera should be active and the remaining two should
    be inactive (you can check this by clicking on a key). You may need to set the
    cameras to active to create the keys and then set them to inactive (Unity sometimes
    doesn''t create a key if you deactivate an object and only creates the key if
    you click to enable it):'
  merge: -1
  img_proc: true
- pgno: 249
  md: '![](img/616a75b593bef4212f618360fceea442_249_0.png)


    Keys containing cameras'' state (active/inactive)


    +   10. Adjust the timeline and activate the second camera. You don''t need to
    deactivate the first one, but you should have only one Audio Listener component
    enabled.

    +   11. Adjust the timeline again and activate the third camera.

    +   12. Close the **Animation** View.

    +   13. Play the animation or run the game to see the effect.


    # How it works...


    This recipe has a few important elements:


    +   - **Cameras as children**: All cameras are children of the **CameraChanger**
    game object. This way, we can add the Animator component to the **CameraChanger**
    and animate all its children cameras using one Animation Clip.

    +   - **Camera''s Depth**: The depth parameter describes the “layer” of the camera.
    Cameras with greater Depth are rendered on top of cameras with lesser Depth. This
    way, we can change the cameras without the need to worry about not rendering anything.'
  merge: -1
  img_proc: true
