  md: 'You do not have to always animate the properties of a game object. Using the
    transitions in the Animator Controller will create a smooth blend between them.


    # Animating an object''s world position – creating a moving platform


    In this recipe, we will create a very common gameplay mechanism: a moving platform.
    We will use a Rigid body for our character and an animated, kinematic Rigid body
    for the platform.


    # Getting ready


    Before we start, you should have a scene with your character and a platform you
    want to animate. You can use the example project; go to the `Chapter 02 Working
    with the animation view\Recipe 03 Animating objects world position - creating
    a moving platform` directory. There is a scene called `Example.unity` there. If
    you open it, you will find a **Sheep** character in the **Hierarchy**. This is
    our character, using the **Rigidbody** component and a Simple Move script to move.
    There is also a **Moving Platform** game object in the **Hierarchy**. This is
    the kinematic rigid body with a `Platform` script attached to it. It also has
    an Animator component and an Animator Controller with just one animation in it.
    This animation makes the platform move.


    # How to do it...


    To create and assign an animated moving platform, follow these steps:


    +   1. Select your platform game object in the **Hierarchy**.

    +   2. Open the **Animation** View.

    +   3. Make sure the record button is pressed (in the upper-left corner of the
    **Animation** View).

    +   4. Move the platform to the desired position in the first frame.

    +   5. Adjust the timeline a few seconds forward and move your platform to new
    destination.'
  merge: -1
  img_proc: true
