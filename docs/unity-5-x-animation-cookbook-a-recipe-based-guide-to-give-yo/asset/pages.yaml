- pgno: 301
  md: "+   3. Create another **Image** and name it **BlueDot**. Change its color to\
    \ blue.\n+   4. Change its **Anchor Preset** to bottom left.\n+   5. Create a\
    \ new C# script and name it `LerpNormal.cs`. In this script's `Update()` function,\
    \ we interpolate a `float posX` variable's value from the `public float minPos`\
    \ to `public float maxPos` value. We use a `float timer` that increases to the\
    \ value of 1 in time. If its value reaches 1, it starts to decrease to 0. If it\
    \ reaches 0, it starts to increase again. Finally, we set the `localPosition`\
    \ of **RedDot** `rectTransform` using our interpolated `posX` value. The `posY`\
    \ and `posZ` values are set in the `Start()` function and are constant:\n+   \n\
    +   ```csharp\n+   if (timer > 1f)\n+   {\n+       lerpDir = -1f;\n+   }\n+  \
    \ else if (timer < 0f)\n+   {\n+       lerpDir = 1f;\n+   }\n+   \n+   timer +=\
    \ lerpDir*Time.deltaTime * speed;\n+   \n+   posX = Mathf.Lerp(minPos, maxPos,\
    \ timer);\n+   \n+   rectTransform.localPosition = new Vector3(posX, posY, posZ);\n\
    +   ```\n+   6. Assign the script to the **RedDot** game object.\n+   7. Create\
    \ another C# script and call it `LerpContinuous.cs`. In this script's `Update()`\
    \ function, we interpolate the position of the **BlueDot** with itself and the\
    \ mouse cursor position. We do it every frame. In the `Lerp()` function, we use\
    \ the `Time.deltaTime` value multiplied by a `public float speed` variable:\n\
    +   \n+   ```csharp\n+   rectTransform.position =\n+       Vector3.Lerp(rectTransform.position,\n\
    +       Input.mousePosition, Time.deltaTime *\n+       speed);\n+   ```\n+   8.\
    \ Assign the script to the **BlueDot** game object.\n+   9. Play the game to see\
    \ the effect."
