    }\n```\n\n7. Finally, we calculate the Quaternion rotation value by using the\
    \ Quaternion.LookRotation() method and multiplying its result by a public Vector3\
    \ additionalRotation value. First we need to turn this Vector3 into a Quaternion\
    \ by using the Quaternion.Euler() function. Multiplying two quaternions is simply\
