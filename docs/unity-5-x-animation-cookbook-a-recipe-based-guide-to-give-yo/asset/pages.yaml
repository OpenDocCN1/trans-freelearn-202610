    FinalRig on the left and ImportedRig and the empties (control rig) on the right


    # How it works...


    Problems with importing motion capture data can be very frustrating. The most
    common errors are connected with an inappropriate **T-POSE** of the **BVH** rig.
    This T-Pose depends on the software the animation was recorded in and exported
    from. Additionally, BVH rigs can have arbitrary bone hierarchies, with more than
    two spine bones for instance. A proper Unity Humanoid rig hierarchy was covered
    in the *Configuring Generic and Humanoid rigs* recipe in *Chapter 1, Working with
    animations.*


    In Blender, the Rigify rig has a proper T-Pose. Thus, the best solution is to
    retarget the animation from the **ImportRig** to the **FinalRig** (the **Rigify**
    one). In theory, we could omit creating the control rig (the empties) but those
    give us more control. The (...)**Target** empties are not constrained to the **ImportRig**
    bones—they are only parented to the empties that are constrained. This way we
    can rotate or move the (...)**Target** empties to correct any rotation errors
    or adjust a pose.


    We also use **Inverse Kinematics** for the feet in this setup. This, combined
    with the **Offset** option in the **Copy Location** constraints (set for the **footTarget.L**,
    **footTarget.R**, and **hips** bones), allows us to adjust the feet and hips positions.
    This way we can move the character to the center of the scene quite easily. We
    can even make it crouch while moving,'
  merge: -1
  img_proc: true
- pgno: 311
  md: '# See also


    If you are on a budget and want to use motion capture data, you can find a lot
    of free motions on the Carnegie Mellon University''s website at http://mocap.cs.cmu.edu/.
    Another good option is to invest in the Perception Neuron solution (https://neuronmocap.com/)—it
    is a project successfully founded on Kickstarter. Perception Neuron seems affordable
    for most indie studios or even individuals. It is a suit with a set of sensors
    (gyroscopes, magnetometers, and accelerometers) that the actor puts on. It works
    similar to standard motion capture solutions based on markers. I must say the
    quality of the recorded motions is mostly very good (it has some problems with
    rapid motions though). You also have to watch out for large metal objects, speakers,
    and other sources of magnetic fields in the room. But if you can''t afford a motion
    capture studio session and want to use mocap for your project, it can be a good
    bet.


    # Adding behaviors to Mecanim states


    In this last recipe, we will cover behaviors. These are scripts that can be attached
    to Mecanim states. You can use them to turn standard Animator Controllers into
    logic graphs such as AI trees, quests, and so on.


    # Getting ready


    We are going to create this recipe from scratch and we don''t need any special
    assets. You can download the example project and go to the Chapter 10 Miscellaneous\Recipe
    05 Adding behaviors to Mecanim states directory. Open the Example.unity scene
    there and play the game. If you play the game, you can press the space bar to
    change the states in the Animator Controller attached to the Controller game object.
    The cycle starts in the NoBehaviors state—this is simply an empty state with no
    additional behavior. If we press the space bar, we transition to Light1Random.
    This state changes the color of the Light1 light in the scene. If we press the
    space bar again, the state will change to WaitAndSwitch. This state waits for
    a given time and switches to the next state: Light2Random. This one changes the
    color of the Light2 light. If we press the space bar again, we will transition
    to the RotateObject state, which rotates an object visible in the scene. Pressing
    the space bar yet again transitions the controller to the Light1Random state again.
    See the following screenshot for reference:'
  merge: -1
  img_proc: true
- pgno: 312
  md: '![](img/616a75b593bef4212f618360fceea442_312_0.png)


    Finished controller


    # How to do it...


    To use behaviors with Mecanim states, follow these steps:


    +   1. First we need to prepare the example scene. Create a **Cube** in the scene.

    +   2. Create two lights and name them **Light1** and **Light2**. Place them near
    the cube so you can see their effect.

    +   3. Create an empty game object and name it `Controller`.

    +   4. Create a new Animator Controller and name it `LogicController`.

    +   5. Add an Animator component to the **Controller** game object and assign
    the **LogicController** to it.

    +   6. Open the **LogicController**.

    +   7. Create an empty state and name it **NoBehaviors**. Make it the default
    state.

    +   8. Create a `Trigger` parameter and name it **Switch**.

    +   9. Create four empty states and name them **Light1Random**, **WaitAndSwitch**,
    **Light2Random**, and **RotateObject**.'
  merge: -1
  img_proc: true
- pgno: 313
  md: '10. Create the following listed transitions. All of them have the same condition:
    `Trigger` **Switch** parameter and **Has Exit Time** set to false.


    +   - **NoBehaviors** | **Light1Random**

    +   - **Light1Random** | **WaitAndSwitch**

    +   - **WaitAndSwitch** | **Light2Random**

    +   - **Light2Random** | **RotateObject**

    +   - **RotateObject** | **Light1Random**


    11. Select the **Light1Random** state and click the **Add Behaviour** button in
    the **Inspector**, as shown in the following screenshot:


    ![](img/616a75b593bef4212f618360fceea442_313_0.png)


    Adding a behavior to a Mecanim state


    12. A list with all the available behaviors will appear. Type **LightColorChange**
    in the search field and press *Enter*. A **Create and add** button will appear.
    If you click on it, the `LightColorChange.cs` script will be created in the `Assets`
    folder.


    13. Move the script to your script''s destination folder.


    14. Open the script. Add three global variables to the script: `public string
    lightGameObjectName`, `public Color color`, and `public bool randomColor`.'
  merge: -1
  img_proc: true
- pgno: 314
  md: "15. The script contains several commented out functions. Uncomment the override\
    \ public void OnStateEnter() function. In it we first try to find the game object\
    \ whose name we store in the lightGameObjectName variable. If we find it, we try\
    \ to get its Light component and set the light color to a random value or to a\
    \ specified value, depending on the randomColor flag:\n\n```\nGameObject go =\
    \ GameObject.Find(lightGameObjectName);\nif (go != null)\n{\n    Light light =\
    \ go.GetComponent<Light>();\n    if (light != null)\n    {\n        if (randomColor)\n\
    \        {\n            light.color = Random.ColorHSV();\n        }\n        else\n\
    \        {\n            light.color = color;\n        }\n    }\n}\n```\n\n16.\
    \ In the Animator Controller, select the Light1Random state. In its Inspector,\
    \ set the Light Game Object Name to Light1 and check the Random Color checkbox.\n\
    \n17. Select the WaitAndSwitch state and add a WaitAndSwitch behavior. The WaitAndSwitch.cs\
    \ script will be created. This time add four global variables (with default values):\
    \ public string triggerName = \"Switch\", public float waitTime = 5f, bool switched\
    \ = false, and float startTime. Uncomment the override public void OnStateEnter()\
    \ function, check the time we've entered the state in, and store it in the startTime\
    \ variable. We also set the switched flag to false:\n\n```\nstartTime = Time.time;\n\
    switched = false;\n```\n\n18. Uncomment the override public void OnStateUpdate()\
    \ function and check whether the current time is greater than our startTime plus\
    \ waitTime. If so, we set the Trigger to transition between states. We also set\
    \ the switched flag to true to prevent sending multiple Triggers:\n\n```\nif (Time.time\
    \ >= startTime + waitTime && !switched)\n{\n    switched = true;\n```"
  merge: -1
  img_proc: true
- pgno: 315
  md: "```\nanimator.SetTrigger(triggerName);\n}\n```\n\n19. Select the Light2Random\
    \ state in the controller and add the LightColorChange.cs behavior to it. Set\
    \ the Random Color checkbox to true and the Light Game Object Name to Light2.\n\
    \n20. Create a new C# script and call it LogicController.cs. This script has three\
    \ global variables: public string switchTriggerName = \"Switch\", public Transform\
    \ activeObject, and Animator anim. The anim variable is set in the Start() function.\
    \ In the Update() function of this script, we set the Trigger in the Animator\
    \ Controller when the player presses the space bar. The Trigger name is stored\
    \ in the switchTriggerName variable.\n\n21. Assign the script to the Controller\
    \ game object. Then drag and drop the Cube game object to the Active Object field\
    \ of the script.\n\n22. Select the RotateObject state and add a RotateObject.cs\
    \ behavior to it (you need to create a new one). Move the created script to your\
    \ destination folder.\n\n23. Open the RotateObject.cs script. Add four global\
    \ variables: public float rotationSpeed = 45f, public Vector3 rotationAxis = Vector3.up,\
    \ public Space rotationSpace = Space.World, and LogicController controller. The\
    \ first three are used to rotate the object and the last one is a reference to\
    \ the LogicController script. Uncomment the override public void OnStateEnter()\
    \ function and set the reference to the LogicController in it:\n\n```\ncontroller\
    \ =\nanimator.gameObject.GetComponent<LogicController>();\n```\n\n24. Uncomment\
    \ the override public void OnStateUpdate() function and rotate the object that\
    \ is stored in the LogicController.activeObject variable:\n\n```\nif (controller\
    \ == null)\n{\n    return;\n}\nif (controller.activeObject == null)\n{\n    return;\n\
    }\ncontroller.activeObject.Rotate(rotationAxis * rotationSpeed * Time.deltaTime,\
    \ rotationSpace);\n```"
