- pgno: 18
  md: '# Preface


    This book describes Unity''s animation techniques from a designer''s point of
    view. It is focused on achieving interesting gameplay effects and creating game
    mechanics. Each topic is presented in the form of a short recipe with a list of
    steps needed to implement the given feature. All the recipes are prepared in the
    most condensed form—a good basis to build your own solutions on.


    This book doesn''t cover animating in a 3D package, although you may find some
    helpful tips regarding Blender 3D in it. A lot of the recipes presented in this
    book use C# scripting not only for triggering animations, but also for creating
    interesting motions and effects. If you are a game designer or a Unity developer
    and would like to know more about what''s possible with Unity''s animation system,
    I hope this book will be an interesting read for you. Also, if you have any questions
    regarding this book or the topics it covers, you can contact me via Twitter (@MaciejSzczesnik).
    I will be happy to help.


    # What this book covers


    Chapter 1, Working with Animations, describes the tools essential for importing
    animations from 3D packages. It also covers most of the import settings.


    Chapter 2, Working with the Animation View, covers Unity''s built-in animation
    tool, used to animate almost everything apart from characters.


    Chapter 3, 2D and User Interface Animation, focuses on animating 2D sprites and
    UI elements.


    Chapter 4, Character Movement, covers different types of movement, using animations
    and root motion.


    Chapter 5, Character Actions and Expressions, is about actions, action points,
    and facial expressions.


    Chapter 6, Handling Combat, covers combat-specific topics, such as using animations
    for aiming and creating a hit-detection system.


    Chapter 7, Special Effects, is not only about particle systems, but also about
    animating fog, creating wind zones, and even using sound waveforms for animation.'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'Chapter 8, *Animating Cutscenes*, describes how to import a cutscene from a
    3D package and how to prepare simple cutscenes using Unity''s Animation View.


    Chapter 9, *Physics and Animations*, shows how to create ragdolls and break stuff.


    Chapter 10, *Miscellaneous*, is the last chapter and describes a few solutions
    to common problems—for instance, working with mocap animations in Blender and
    Unity.


    # What you need for this book


    You need to install Unity 5.x (preferably 5.3 or greater). You also need to have
    your own animations or download the provided example project. It contains the
    assets needed to follow each recipe.


    # Who this book is for


    This book is for Unity developers who have some exposure to Unity game development
    and want to learn the nuances of animation in Unity. Previous knowledge of animation
    techniques and mecanim is not necessary.


    # Sections


    In this book, you will find several headings that appear frequently (*Getting
    ready*, *How to do it...*, *How it works...*, *There’s more...*, and *See also*).


    To give clear instructions on how to complete a recipe, use these sections as
    follows:


    # Getting ready


    This section tells you what to expect in the recipe and describes how to set up
    any software or any preliminary settings required for the recipe.


    # How to do it...


    This section contains the steps required to follow the recipe.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# How it works...


    This section usually consists of a detailed explanation of what happened in the
    previous section.


    # There''s more...


    This section consists of additional information about the recipe in order to make
    you more knowledgeable about the recipe.


    # See also


    This section provides helpful links to other useful information for the recipe.


    # Conventions


    In this book, you will find a number of text styles that distinguish between different
    kinds of information. Here are some examples of these styles and an explanation
    of their meaning.


    Code words in text, database table names, folder names, filenames, file extensions,
    pathnames, dummy URLs, user input, and Twitter handles are shown as follows: "Simply
    drag and drop the file to your Assets folder."


    A block of code is set as follows:


    ```

    ```

    using UnityEngine;

    using System.Collections;


    public class Wave : MonoBehaviour {

    //The anim variable is used to store the reference

    //to the Animator component of the character.

    private Animator anim;

    ```

    ```'
  merge: -1
  img_proc: true
