- pgno: 162
  md: '# Using Blend Trees to create randomized actions


    In this recipe, we will create a simple randomized action using a Blend Tree.


    # Getting ready


    Before we start, we need to have a character with at least two different animations
    for the randomization to work. In this example, we are using a character with
    the **Walk**, **Idle**, **Hurray**, **Wave**, and **PickUp** animations. The **Walk**
    and **Idle** animations are used as helpers. The three others are being randomized.
    You can also use the example project; go to the `Chapter 05 Character actions
    and expressions\Recipe 03 Using blend trees to create randomized actions` directory.
    You can find the `Example.scene` scene there, with two characters. You can start
    the game to see the effect. Both characters should play different animation after
    walking. You may need to start the game several times because we have only three
    animations to pick from, so there is a 9 percent chance that both characters will
    play the same animation. In the `Rigs` directory, you can find the required animations.


    ![](img/616a75b593bef4212f618360fceea442_162_0.png)


    Characters with randomized animations'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# How to do it...


    To use randomized animations, follow these steps:


    +   1. Import your character with the animations to pick from. In our case, they
    are Hurray, Wave, and PickUp. We also use Idle and Walk animations (the Walk animation
    is used before the randomized action and the Idle animation is used after).

    +   2. Create a new Animator Controller (or edit an existing one).

    +   3. Create a new float parameter in the controller and call it Random.

    +   4. Create a new Blend Tree in the controller and name it RandomAction.

    +   5. In the Blend Tree settings, add Motion Fields for your randomized animations.
    In our example, we have three Motion Fields (for Hurray, Wave, and PickUp).

    +   6. Assign your animations to the Motion Fields.

    +   7. Choose the Random parameter as the Parameter of the Blend Tree.

    +   8. Uncheck the Automate Thresholds option.

    +   9. Set the Thresholds to integer numbers, starting from 0. In our example,
    they are 0, 1, and 2.

    +   10. Exit Blend Tree settings.

    +   11. Create transitions to and from the Blend Tree, if needed. In our example,
    we have following transitions:

    +      - Walk | RandomAction with no conditions: Has Exit Time should be set to
    true and Transition Duration set to 0.2 seconds. Our scene starts with the characters
    playing one cycle of the Walk animation and then transitioning to the RandomAction
    Blend Tree.

    +      - RandomAction | Idle with no conditions: Has Exit Time should be set to
    true and Transition Duration set to 0.2 seconds. Our scene ends with the characters
    transitioning from RandomAction to Idle animation.

    +   12. Place the character in the scene.

    +   13. Assign the controller to the character''s Animator component.

    +   14. Create a new script and call it RandomAction.cs.

    +   15. In this script''s Start() function, we create an integer random value
    and set it as the value of our float Random parameter in the controller:


    ```

    ```csharp

    Animator anim = GetComponent<Animator>();

    int randomValue = Random.Range(0, numActions);

    anim.SetFloat("Random", (float)randomValue);

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 164
  md: '+   16. In the preceding script, `numActions` is a `public int` variable that
    stores the total number of randomized actions in our **Blend Tree** (3 in our
    example).

    +   17. Assign the script to the character and play the game to see the effect.
    You may need to start the game multiple times or copy the character several times.


    # How it works...


    The trick here is to set the **Random** parameter in the controller before we
    transition to the **Blend Tree**. This way we don''t see the sudden change in
    the animations (the animation is already chosen before we start playing it).


    We are still using the `float` type parameter in the **Blend Tree** because we
    cannot use integers in **Blend Trees** in Unity.


    # There''s more...


    There are situations where you need to have multiple randomized animations played
    one after another, for instance, when your character is standing in place and
    performing some random actions. To be able to set the parameter responsible for
    randomizing the animations, you may need to transition through a neutral **Idle**
    pose. In that state, you can set the parameter value safely. See the following
    image:


    ![](img/616a75b593bef4212f618360fceea442_164_0.png)


    Additionally, if your random actions blend together nicely (maybe they are different
    versions of the **Idle** animation), you can allow the parameter to change when
    you are already in the **Blend Tree**. To do so, make sure to use the `SetFloat()`
    function with the `dampTime` parameter set to an appropriate value (0.5 should
    be okay, but you will need to experiment).'
  merge: -1
  img_proc: true
