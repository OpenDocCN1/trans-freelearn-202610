- pgno: 84
  md: '+   23. Attach the `DeathTrap.cs` script to the **LeftTrapTrigger** game object
    and the **RightTrapTrigger** game object.

    +   24. Make sure your character has a **Rigidbody** component

    +   (the **ThirdPersonCharacter** prefab from Unity''s Standard assets will work).

    +   25. Add the `Character.cs` script to your character.

    +   26. Create a blood particle effect and save it as a prefab. Name it **BloodSplash**.

    +   27. Assign the **BloodSplash** prefab to the **Blood Effect** field of the
    **Character** script component in your character.

    +   28. Play the game and enter the trap to see the effect. Your character should
    disappear and the **BloodSplash** effect should be spawned.


    # How it works...


    In this recipe, we attach triggers (game objects with **Box Collider** components
    set to **Is Trigger**) as child objects of our trap''s moving parts. The `OnTriggerEnter()`
    method in our `DeathTrap.cs` script is called whenever an object with a **Rigidbody**
    component enters one of our trigger objects. It does not matter if the object
    or the trigger is moving. The animation of the moving parts of our trap also moves
    the child trigger objects. You can use it to create some really spectacular traps
    in your games.


    # There''s more...


    In our example, the character will die whenever it touches the spikes of our trap.
    We can add some more realism by using Animation Events to enable the triggers
    when the trap is closing and disable them when it opens. It would prevent us from
    killing the character when the trap is not closing on them. You can learn more
    about Animation Events in `Chapter 6, Handling Combat`.


    Remember that you can also rotate the triggers, similar to how we did it in the
    *Using the Hierarchy to animate local rotation – creating an orbiting planet*
    recipe. Scaling the triggers is also possible.


    You should not use this concept for moving normal colliders. Always try to use
    a Rigid body set to **Is Kinematic** when you want to move a collider (for optimization
    reasons).'
