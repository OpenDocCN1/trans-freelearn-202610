- pgno: 240
  md: "to be a power of 2). This is the number of samples we will read from the Audio\
    \ Source. We also start a IEnumerator SampleAudio() coroutine:\n\n```\n```csharp\n\
    public AudioSource audioSource;\npublic float lerpSpeed = 100f;\nfloat[] samples;\n\
    float currentSample;\n\nvoid Start()\n{\n    samples = new float[1024];\n    StartCoroutine(\"\
    SampleAudio\");\n}\n```\n```\n\n6. This coroutine uses the audioSource.GetOutputData()\
    \ function to get and store the output audio samples in the samples array. Then\
    \ we sum all the squared samples and calculate an average volume (the RMS). Lastly,\
