- pgno: 28
  md: '# How it works...


    Unity uses four different rig configurations:


    +   - **Generic** rig: This one is used for quadrupeds, spiders, and other non-humanoid
    characters. It uses Unity''s Mecanim system for controlling animation flow. It
    can use root motion if you provide a **Root node**—a bone responsible for character
    movement.

    +   - **Humanoid** rig: This one is used for humanoid characters only. It also
    uses Mecanim system for controlling animation. If you are using **Humanoid** rigs,
    you have more options for importing animations. The biggest advantage is automatic
    animation retargeting—you can use the same animation clip on various types of
    humanoid characters (for example, a dwarf and a troll).

    +   - **Legacy**: This option is used mostly for backward compatibility with previous
    versions of Unity. It is similar to the **Generic** rig but uses scripts instead
    of Mecanim for controlling animation flow. I recommend using **Generic** rig instead.

    +   - **None**: This last option turns off the rig and disables animation import.


    We will discuss differences between Generic and Humanoid rigs further in the next
    recipe.


    # There''s more...


    +   - Imported animation clips are also listed in the Clips section of the Animations
    tab.


    ![](img/616a75b593bef4212f618360fceea442_28_0.png)'
  merge: -1
  img_proc: true
- pgno: 29
  md: '+   - You can add new clips by clicking on the plus button below the **Clips**
    section. You can also remove clips by clicking on the minus button.

    +   - You can rename each clip by using the input field above the **Source Take**
    drop-down menu.

    +   - You can choose the source take (the animation stored in your FBX file) for
    each animation clip with the **Source Take** drop-down menu.

    +   - You can also trim the animation clip by editing the **Start** and **End**
    input fields.


    ![](img/616a75b593bef4212f618360fceea442_29_0.png)


    If you are using Blender, make sure to rotate the rig -90 degrees in the X axis,
    apply the rotation in Blender and then rotate it again, +90 degrees in the X axis.
    The rotation of the rig in Blender should be: 90 X, 0 Y, and 0 Z. Your model should
    be facing the -Y axis in Blender (when you change the view to **FRONT**, you should
    see the face of your character). Blender and Unity use different axes alignment:
    in Blender, Z is up and Y is back; in Unity Z, is front and Y is up. This little
    trick solves the problem. Your model after import should have 0 rotation and should
    be facing the Z axis. It is important for moving objects (such as characters)
    and rig configuration. If you don''t do this, your model will have -90 X rotation
    after the import.


    # Configuring generic and humanoid rigs


    This recipe shows how to configure two most frequently used rig types: **Generic**
    and **Humanoid**. We will go through all the available options for both of them.


    # Getting ready


    As previously mentioned, make sure you have prepared two animated characters.
    One of them should be a humanoid and the other a non-humanoid, a quadruped for
    instance. You can also download the provided example Unity project and go to the
    `Chapter 01 Working with animations\Recipe 02 Configuring generic and humanoid
    rigs\Rigs directory.`


    You will find there three FBX files:


    +   - `Generic.fbx`

    +   - `Humanoid.fbx`

    +   - `Quadruped.fbx`'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'If you are creating your characters from scratch, the bones hierarchy of your
    humanoid rig is important for Unity to recognize the rig as a humanoid. It should
    follow this pattern:


    ```

    HIPS -> SPINE -> CHEST -> NECK -> HEAD

    HEAD -> EYE (for left and right eyes)

    HEAD -> JAW

    HIPS -> UPPER LEG -> LOWER LEG -> FOOT -> TOES (for left and right legs)

    CHEST -> SHOULDER -> ARM -> FOREARM -> HAND (for left and right hands)

    HAND -> PROXIMAL -> INTERMEDIATE -> DISTAL (for five fingers in left and right
    hands)

    ```


    The hip bone is the root bone of the humanoid character. Fingers, shoulders, chest,
    neck, eyes, jaw, and toes are optional bones. Your humanoid character will work
    without them.


    You should also remember to model the character in a T-POSE. It should face the
    Z axis in Unity (if your 3D software uses different axis alignment from Unity''s
    like Blender, remember about the -90 and +90 degrees rotation trick shown in the
    *Importing skeletal animations* recipe). Hands of the character should be flat,
    palm down, and parallel to the ground along the X axis. A-POSE characters will
    also work.


    # How to do it...


    To configure a generic rig you need to follow these steps:


    +   1. Import your animated asset into Unity the same way as in the *Importing
    skeletal animations* recipe.

    +   2. Select the asset and choose the **Rig** tab in the **Inspector**. Then
    select the **Generic** option in the **Animation Tab** drop-down menu. If you
    are using the provided example Unity Project, select the `Generic.fbx` file in
    the `Chapter 01 Working with animations\Recipe 02 Configuring generic and humanoid
    rigs\Rigs` directory.

    +   3. Choose the **Create From This Model** option from the **Avatar Definition**
    drop-down menu.

    +   4. Leave the **Root Node** option set to **None**.

    +   5. Leave the **Optimize Game Objects** option unchecked.

    +   6. Click on the **Apply** button to complete the configuration.'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'Humanoid rig configuration has a lot more options:


    +   1. First, import your skinned humanoid model to Unity the same way as in the
    *Importing skeletal animations* recipe.

    +   2. Select the asset and choose the **Rig** tab in the **Inspector**. Then
    select the **Humanoid** option in the **Animation Tab** drop-down menu. If you
    are using the provided example Unity Project, select the `Humanoid.fbx` file in
    the `Chapter 01 Working with animations\Recipe 02 Configuring generic and humanoid
    rigs\Rigs` directory.

    +   3. Choose the **Create From This Model** option from the **Avatar Definition**
    drop-down menu.

    +   4. Leave the **Optimize Game Objects** option unchecked.

    +   5. Click on the **Apply** button.

    +   6. You should see a **Configure** button with a tick icon near to it.


    ![](img/616a75b593bef4212f618360fceea442_31_0.png)


    7. The tick icon shows that Unity was able to automatically recognize the rig
    hierarchy as a humanoid. If Unity fails to recognize it, automatically a cross
    will be displayed instead of the tick. If you are using the provided example,
    you can observe it when you try to set the rig to **Humanoid** for the `Generic.fbx`
    file.'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'Some quadruped characters can be mistaken by Unity for humanoids. You can find
    a `Quadruped.fbx` file in the provided example Unity project. Theoretically, you
    can set its rig to **Humanoid**, and Unity will recognize it as valid. This, however,
    is a mistake—all quadruped characters'' rigs should be set to **Generic**. Setting
    them as humanoids can cause problems later.


    +   8. Click on the **Configure** button to enter the **Avatar Configuration Inspector**.
    A new scene will be opened. You should be able to see your model in the **scene**
    and bone **mapping** section in the **Inspector** tab.


    ![](img/616a75b593bef4212f618360fceea442_32_0.png)'
  merge: -1
  img_proc: true
- pgno: 33
  md: "+   9. Make sure you are in the **Mapping** section (1). All recognized and\
    \ assigned bones are shown as green body parts on the displayed dummy character.\
    \ If a required bone is missing or is not assigned, it will show up as red. You\
    \ can navigate between the **Body**, **Head**, **Left Hand**, and **Right Hand**\
    \ sections by clicking on a corresponding button (2). All bones are displayed\
    \ in a list (3) for each section. Required bones are marked with circle icons\
    \ and optional bones are marked with dotted circle icons.\n+   \n+   10. You can\
    \ change the bone assignment by dragging a bone from the **Hierarchy** tab and\
    \ dropping it onto a corresponding bone slot in the **Inspector** tab. Unity will\
    \ occasionally miss a bone or two (especially fingers); thus, you should always\
    \ check the bone assignment manually.\n+   \n+   11. If your character is not\
    \ in a T-POSE (is modeled in an A-POSE for instance), a **Character is not in\
    \ T-POSE** message will be displayed in the scene view and the character's bones\
    \ will show up in red. Unity needs the character in a T-POSE for proper humanoid\
    \ avatar configuration. You can enforce that pose by choosing the **Pose | Enforce\
    \ T-POSE** option, found below the bones **mapping** list.\n\n![](img/616a75b593bef4212f618360fceea442_33_0.png)\n\
    \n12. Click on the **Apply** button and then the **Done** button to finish configuration."
  merge: -1
  img_proc: true
- pgno: 34
  md: '# How it works...


    **Humanoid** rig uses more advanced Mecanim features than the **Generic** rig.
    You can find the list of such features below:


    +   - **Automatic retargeting:** This is one of the most important differences
    between those two rigs. The **Humanoid** rig uses automatic retargeting, which
    means that you can have the same animations on different humanoid characters.
    Your characters can share a group of animations (basic movement or some common
    actions). It gives you the possibility to buy your animation assets from the Asset
    Store and easily use them on your characters. **Generic** rigs don''t support
    this feature. You have to prepare animations for your specific rig or retarget
    them in a 3D package.

    +   - **Inverse kinematics:** This feature lets you control your characters''
    feet and hands position with scripting. It is useful for making your characters
    stand on uneven ground or grab an object in the scene. It is a built-in feature
    for Humanoid rigs in Unity. **Generic** rigs have to use custom-made solutions.

    +   - **Advanced animation settings:** Humanoid rigs have more settings for animation
    import, such as the **mirror** option. We will discuss them in depth in the *Looping
    mirroring and offsetting animations* recipe.

    +   - **Look at:** Unity has a built-in solution for humanoid characters looking
    at something. You have to write custom systems for generic characters.

    +   - **Additional bones:** A lot of people think that they cannot use additional
    bones with **Humanoid** rigs. It is not true. If your rig has an animated weapon
    slot for instance, you can still use it with the **Humanoid** rig. All you need
    to do is to find the **Mask** section in your animation import settings and enable
    the additional bone for each animation it is used in (you need to use the **Transform**
    foldout to find your additional bone).


    I highly recommend using **Humanoid** rigs for all humanoid characters in your
    game.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# There''s more...


    +   - In the Humanoid rig configuration, you can find the **Muscles & Settings**
    section, where you can preview and adjust the movement (muscle) range for your
    character.


    ![](img/616a75b593bef4212f618360fceea442_35_0.png)'
  merge: -1
  img_proc: true
- pgno: 36
  md: '+   - You can preview the range of movement in the **Muscle Group Preview**
    section by adjusting the sliders (1). You can preview the range of movement per
    muscle in the **Per-Muscle Settings** section. You can also adjust the range here
    by unfolding a given muscle foldout and using the slider (2). In the **Additional
    Settings** section, you can adjust more options of your avatar. These are mainly
    responsible for the *flexibility* of your rig. You can set how much a bone can
    be stretched during animation for instance.

    +   - The **Translation DoF** option enables animating bones transition in your
    **Humanoid** rig. It is turned off by default, meaning that only rotation of the
    bones is used in animation.

    +   - In the **Rig** tab in the **model import settings**, you can find some additional
    options:

    +     - **Avatar Definition**: This option is responsible for creating a new avatar
    or copying the avatar from another model. The second option is useful for storing
    animations in multiple files. It will be discussed further in the *Using animations
    from multiple assets* recipe.

    +     - **Optimize Game Objects**: This option lets you hide all bones from the
    **Hierarchy** view. The number of game objects in the game has an impact on the
    performance. You can still choose a number of bones that will be displayed in
    the **Hierarchy**. It is useful for having exposing weapon slots and similar gameplay-related
    bones while hiding others.

    +     - **Root node**: This option is visible only for **Generic** rigs. It lets
    you choose the bone responsible for root motion calculation. We will discuss it
    further in `Chapter 4, Character Movement`.


    # Creating and assigning an Animator Controller


    **Animator Controllers** are state machines (graphs) responsible for controlling
    the flow of animations of any animated object in the game. The same Animator Controller
    asset can be used by multiple objects or characters. Unity will create an independent
    runtime copy of the asset for each animated object it is assigned to.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# Getting ready


    As always, you should have a rigged and animated character ready before we start.
    Import it into Unity, choose the proper rig type, and put it into a scene. You
    can download the example Unity project and go to the `Chapter 01 Working with
    animations\Recipe 03 Creating and assigning an animator controller` directory.
    There is a scene called `Example.unity` there. If you open it, you''ll find a
    Sheep character in the **Hierarchy**. It has an Animator Controller already created
    and assigned. You can also use the `Quadruped.fbx` file from the `Chapter 01 Working
    with animations\Recipe 03 Creating and assigning an animator controller\Rigs`
    directory to follow the recipe step by step.


    # How to do it...


    To create and assign an Animator Controller, follow these steps:


    +   1. Navigate to the **Project View** (any directory in the `Assets` folder)
    and press the right mouse button.

    +   2. Choose **Create | Animator Controller** from the menu. A controller asset
    will be created. You can name it as you wish.

    +   3. Double-click on the created controller. An **Animator** tab will appear.
    It will show the current selected **Animator Controller**.

    +   4. Here you can add the first animation. Navigate to your imported character
    in the **Project View**. Unfold it and drag and drop one of the imported animations
    into the **Animator** window. A new state will be created and will be colored
    orange, showing that this is the default animation state—the state from which
    your graph starts.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '![](img/616a75b593bef4212f618360fceea442_38_0.png)


    +   5. Navigate to your character on the scene and select it.

    +   6. Find the Animator component in the Inspector tab. All animated objects
    have an Animator component added automatically.

    +   7. Find the Controller slot in the Animator component inspector.

    +   8. Drag and drop your Animator Controller asset into the Controller slot of
    the Animator component.

    +   9. Run the game to see your character play the default state animation of
    your Animator Controller. If the animation is not looped, it will be played just
    once and then the character will freeze.

    +   10. You can also select your character in runtime and navigate to the Animator
    tab to see what animation state the character is currently in. Current animation
    state will have a blue progress bar displayed.


    # How it works...


    Every animated object in Unity uses an Animator component and an Animator Controller
    asset. The component is responsible for playing animations in runtime. It has
    a number of parameters that we have to set or we can use to tweak the component''s
    functionality:


    +   - **Controller**: This is the field we have to attach the Animator Controller
    asset to. It determines which animation graph the Animator component will use.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '+   - **Avatar:** In Unity, *Avatars* are rig definitions. For instance, if
    we have multiple files containing animations with the same **Generic** rig, we
    should use the same **Avatar** for all of them. You can find more information
    about it in the *Using animations from multiple assets* recipe.

    +   - **Apply Root Motion:** With this checkbox, we can turn the root motion on
    and off. It can be useful when we have animations with root motion but don''t
    want to use the root motion definition for a given character.

    +   - **Update Mode:** This parameter tells Unity in which update the animations
    should be evaluated. The **Normal** option makes the animations synchronized with
    the normal `Update()` call, the **Animate Physics** option synchronizes animations
    with the physics `FixedUpdate()` call, and the **Unscaled Time** option synchronizes
    the animation with the normal `Update()` call, but disables animation time scaling
    (the animation is played with 100 percent speed regardless of the `Time.timeScale`
    variable value).

    +   - **Culling Mode:** This parameter tells Unity when to turn off the animation
    playback on a given Animator. The **Always Animate** option makes the Animator
    always play animations (event when off-screen), the **Cull Update Transforms**
    option culls Retarget and IK Transforms when the Animator is not visible on screen,
    and the **Cull Completely** option disables the animation completely when the
    Animator is not visible on screen.


    The Animator Controller asset stores a graph of animations (animation states)
    and defines the rules of switching between them, blending them, and so on. The
    controller (asset) is attached to the component''s **Controller** field (the component
    is attached to a character prefab or a character placed in the scene). Many objects
    or characters can share the same Animator Controller if they use the same animations
    (have the same rigs or are humanoid characters).


    # See also


    If you want to learn how to create animation graphs and control their flow, see
    the next two recipes: *Creating animation transitions in Animator Controller*
    and *Using parameters to control the animation flow.*'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# Creating animation transitions in Animator Controller


    As mentioned previously, Animator Controllers are state machines containing animations
    (states). Any given character can be in one such state (play one animation) at
    a time. To switch between states (animations), you need to create state transitions.


    # Getting ready


    Before we start, you should have an animated model placed on a scene with an Animator
    Controller assigned. You can find such a model in the provided example Unity project.
    Go to the Chapter 01 Working with animations\Recipe 04 Creating animation transitions
    in Animator Controller directory. Open the Example.unity file. You will find a
    Sheep object in the Hierarchy. It has an Animator Controller assigned. You can
    open it by double-clicking on the Controller field in the Animator component of
    the Sheep game object.


    # How to do it...


    To create a state transition in an Animator Controller, follow these steps:


    +   1. Open the Animator Controller asset.

    +   2. Add at least two states by dragging and dropping two animations into the
    Animator window. You can also point the cursor at an empty space in the Animator
    window, press the right mouse button and select Create State | Empty, then select
    the state, and add an animation to the Motion field in the Inspector.

    +   3. Click on the right mouse button on the state you want to transition from
    and choose Make Transition.

    +   4. Drag the transition onto the state you want to transition to and click
    the left mouse button.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '+   5. A default transition will be created. The state will switch after its
    animation has finished playing. To be able to observe it in gameplay, make sure
    you transition from the default (orange) state, as only the default state will
    play when the game starts.


    ![](img/616a75b593bef4212f618360fceea442_41_0.png)


    # How it works...


    State transitions define how we can travel through the graph of animations. They
    are combined with transition conditions based on Animator Controller parameters;
    we will discuss the parameters in detail in the next recipe: Using parameters
    to control the animation flow. Each transition has a set of properties we can
    adjust. Click on the transition (white arrow) to select it. You can find the transition
    properties in the Inspector tab (make sure to unfold the Settings foldout):'
  merge: -1
  img_proc: true
- pgno: 42
  md: '![](img/616a75b593bef4212f618360fceea442_42_0.png)


    +   - **Has Exit Time**: If set to true, this enables the transition only after
    a given percentage of the animation has been already played. If disabled, the
    transition will take place instantly after its conditions are met. If you want
    to create a sequence of animations, set it to true.

    +   - **Exit Time**: This is the percentage (0-1 range) of the animation length
    after which the **Has Exit Time** condition is met. If you set it to 0.5, for
    instance, the state will transition after 50 percent of the animation was played.

    +   - **Fixed Duration**: This property is combined with the next one, **Transition
    Duration (s)**. If it''s on, the **Transition Duration (s)** is in seconds, and
    if it''s off, the **Transition Duration (s)** is in percentage of the animation
    time.

    +   - **Transition Duration (s)**: the time of the state transition. This is how
    long the animations will transition one into another. Animations are being blended
    together during the transition. Longer transitions are smoother, shorter, are
    more sharp. A good default value is around 0.25.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '+   - **Transition Offset**: This offsets the target animation in time. The
    value is in percentage of the animation. Setting it to 0.3 means that the target
    animation will start from 30 percent of its length instead of the beginning.

    +   - **Interruption Source**: This setting tells Unity whether the transition
    can be interrupted by other transitions. You can set it to:

    +     - **None**: the transition cannot be interrupted by any other transition.

    +     - **Current State**: The transition can be interrupted by transitions from
    the state we are trying to transition from.

    +     - **Next State**: The transition can be interrupted by transition from the
    state we are trying to transition to.

    +     - **Current State then Next State**: The transition can be interrupted by
    the transitions of the state we are trying to transition from or by the transitions
    of the state we are trying to transition to. The transitions from the state we
    are trying to transition from take the priority.

    +     - **Next State then Current State**: The transition can be interrupted by
    the transitions of the state we are trying to transition from or by the transitions
    of the state we are trying to transition to. The transitions from the state we
    are trying to transition to take the priority.

    +     - **Ordered Interruption**: If set to false, this lets the transition be
    interrupted by other transitions independently of their order. If set to true,
    the order of the transitions matters.


    # There''s more...


    When you create an Animator Controller, you can see three more nodes apart from
    your animation states:


    +   - **Entry and Exit**: This node is used when you transition between state
    machines (Animator Controllers or substate machines). We will discuss it in detail
    in the Using Sub-State Machines in Animator Controller recipe in Chapter 6, Handling
    Combat.

    +   - **Any state**: This node can be used as a helper to make a transition from
    any state to a given state. It is used when you have an animation that can be
    played anytime, for instance, a hit animation. We will discuss it in detail in
    the Using transitions from any state to play hit reactions recipe in Chapter 6,
    Handling Combat.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# Using parameters to control the animation flow


    You can define a set of parameters in an Animator Controller and use them to control
    the transitions between animation states in Mecanim. In this recipe, we will show
    how to use parameters for transition conditions and use scripts to set values
    of those parameters in runtime.


    # Getting ready


    Before we start, you should prepare an Animator Controller with at least one transition
    between animation states. The controller should be assigned to a character (its
    Animator component) placed in a scene. You can also use the provided example Unity
    project and go to the Chapter 01 Working with animations\Recipe 05 Using parameters
    to control the animation flow directory. You will find an Example.unity scene
    there. There is a Warrior game object in the scene''s Hierarchy. If you run the
    game and press the space bar, the Warrior will make a wave gesture. You can select
    the Warrior and open his Animator Controller. If you click on the Idle | Wave
    transition, you will be able to see the transition condition.


    # How to do it...


    To use parameters for controlling state transitions, follow these steps:


    +   1. Open the Animator Controller asset.

    +   2. Find the Parameters tab in the upper left corner of the Animator window
    and click on it.

    +   3. Click on the plus icon in the Parameters tab to add a new parameter.

    +   4. Choose the Trigger type for the parameter.

    +   5. Type a name of the newly created parameter (in the provided example, the
    name of the parameter is Wave).

    +   6. Click on the transition between states you want to use parameters for.
    In the provided example, it is the transition between Idle and Wave animation
    states. Idle is the default state.

    +   7. Go to the Inspector tab and find the Conditions section.'
  merge: -1
  img_proc: true
- pgno: 45
