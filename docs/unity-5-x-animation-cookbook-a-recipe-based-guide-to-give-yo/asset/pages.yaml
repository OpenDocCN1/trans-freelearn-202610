- pgno: 78
  md: '+   12. Rotate the **Planet2Orbit** a bit in one axis (choose *Y* for instance)
    to create a new key frame. After you rotate it, the **Rotation** property of that
    object will be added automatically to the **Animation** View. Find the **Rotation**
    section, in the **Transform** component in the **Inspector** of the **Planet2Orbit**
    game object, and enter 0 in the axis you chose (*Y* in this example).

    +   13. Move the timeline in the **Animation** View a few seconds forward to create
    the second key frame.

    +   14. Make sure the **Planet2Orbit** game object is still selected and the record
    button is pressed.

    +   15. Type `360` in the rotation section in the `Transform` component of the
    **Planet2Orbit** game object. Remember to type it in the same axis you chose before
    (*Y* in this example). This will create the second key frame and the animation
    will be perfectly looped.

    +   16. Play the game to see the effect of an orbiting planet.


    # How it works...


    The key element of this recipe is the **Hierarchy** of our game objects. All animations
    created with Unity''s **Animation** View are made in local space, which means
    that if you animate a parent object''s position or rotation, its child objects
    will also move or rotate, respectively.


    Our Hierarchy looks like this: **Planet1** | **Planet2Orbit** | **Planet2**:


    +   - **Planet1**: This is our root game object. We can move it in space and our
    animation will still work perfectly.

    +   - **Planet2Orbit**: This game object is the child of the **Planet1** game
    object. It is placed in the center of **Planet1**. Only this object is animated
    in the whole **Hierarchy**. We use this empty game object because we may want
    to rotate the root planet (**Planet1**) and we need another object in the **Hierarchy**
    to desynchronize the rotation of **Planet1** with the orbiting movement of **Planet2**.

    +   - **Planet2**: This game object is the child of **Planet2Orbit**. It is translated
    in the local space of **Planet2Orbit** in one axis only. The rotation of the **Planet2Orbit**
    game object makes **Planet2** move in circles, which creates the orbiting planet
    effect.'
  merge: -1
