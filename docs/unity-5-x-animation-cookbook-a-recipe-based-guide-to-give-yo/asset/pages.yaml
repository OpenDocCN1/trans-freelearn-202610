  md: '# How it works...


    Normally, we can''t animate the fog''s color or density using the **Animation**
    View. But we can do it easily with a script that sets the `RenderSettings.fogColor`
    and `RenderSettings.fogDensity` parameters every frame. We use animations to change
    the script''s public variables values in time. This way we''ve created a workaround
    for animating fog in Unity.


    We''ve just scratched the surface of what''s possible with animating public script
    variables. Try experimenting to achieve awesome effects.


    # Using additive Mecanim layers to add extra motion to a character


    In previous recipes, we were using Mecanim layers in override mode. We can set
    a layer to be additive. This can add additional movement to our base layer animations.


    # Getting ready


    We will need a character with three animations: **Idle**, **TiredReference**,
    and **Tired**. The **Idle** animation is a normal, stationary idle. The **TiredReference**
    animation has no motion and is used as a reference pose for calculating additive
    motion from the **Tired** animation. The **TiredReference** animation can be the
    first frame of the **Tired** animation. In the **Tired** animation, our character
    is breathing heavily.


    You can also go to the `Chapter 07 Special effects\Recipe 04 Using additive mecanim
    layers to add extra motion to a character` directory. Open the `Example.unity`
    scene there. You will find the same **Humanoid** character there. If you play
    the game and press the space bar, our character will start breathing heavily while
    still playing the **Idle** animation. You can find all the needed animations in
    the `Rigs` directory.


    # How to do it...


    To use additive layers, follow these steps:


    +   1. Import the character into Unity and place it in a scene.

    +   2. Go to the **Animation** tab in the **Import Settings**.'
  merge: -1
  img_proc: true
