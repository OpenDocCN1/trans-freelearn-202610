    \ function, we check if the player pressed the space bar. If so, we set the **PlayAnim**\
    \ bool parameter to its inverted value in both the **Character's** and **Wheel's**\
    \ animator controllers:\n+   12. In the preceding script, `play` is a helper member\
    \ variable, `characterAnimator` is a reference to the **Character** game object's\
    \ **Animator** component, and `objectAnimator` is the reference to the **Wheel**\
    \ game object's **Animator** component.\n+   13. Assign the script to the **Character**\
