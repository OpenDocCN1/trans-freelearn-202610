    +   5. Make sure all **Character Joints** have the **Auto Configure ConnectedAnchor**
    option selected.

    +   6. Choose the root body part of your character (for our **Spider**, it was
    the abdomen).

    +   7. Remove the **Character Joint** component from that body part to make it
    work just like a normal rigid body.

    +   8. Connect all other **Character Joints** to their parent game objects (also
    containing the **Character Joint** components). For instance, if the character
    has a leg with three segments, **Leg1**, **Leg2**, and **Leg3**, drag the **Leg2**
    object to **Leg3** object''s **Connected Body** field in the **Character Joint**
    component. Then drag **Leg1** to the **Connected Body** field of **Leg2**. Finally,
    drag **Leg1** to its root bone''s **Connected Body** field (in our case it''s
    the **Abdomen**).

    +   9. Repeat this process for all the bones with **Character Joints**. The hierarchy
    of the joints should reflect the hierarchy of the rig.

    +   10. Disable the character''s **Animator** component and play the game to see
    the effect. You may need to further adjust **Character Joint** components'' properties
    to achieve the desired effect:


