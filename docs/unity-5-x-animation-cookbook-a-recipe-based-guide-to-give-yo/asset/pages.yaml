- pgno: 80
  md: 'The model is not skinned and has no rig; instead, the moving elements are separate
    objects. We will animate them with Unity''s **Animation** View. You can also use
    the example Unity project provided and go to the `Chapter 02 Working with the
    animation view\Recipe 06 Animating triggers - creating a death trap` directory.
    You will find an `Example.unity` scene there. If you play the game, you can see
    the trap working. If you open the scene, you will find the **Trap** game object
