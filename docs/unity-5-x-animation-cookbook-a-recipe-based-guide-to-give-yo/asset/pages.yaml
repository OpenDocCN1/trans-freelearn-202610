- pgno: 107
  md: '# How to do it...


    To create a fade in/fade out effect, follow these steps:


    +   1. Open a scene.

    +   2. Create an **Image** in the **Hierarchy**. To do so, go to **Game Object**
    | **UI** | **Image** menu on the top of the screen.

    +   3. **Image** and **Canvas** game objects will be created in the **Hierarchy**.

    +   4. Select the **Image** game object and set its name to `BlackScreen`.

    +   5. Right-click on the **Canvas** game object and choose **Create Empty** to
    create an empty game object.

    +   6. Set the name of the newly created game object to `FadeAnimator`. This object
    will animate the effect.

    +   7. Set the **Anchor Preset** of the **BlackScreen** and **FadeAnimator** game
    objects to stretch in both X and Y coordinates, as shown in the following screenshot:


    ![](img/616a75b593bef4212f618360fceea442_107_0.png)


    +   8. Set the **Left**, **Top**, **Right**, and **Bottom** position parameters
    to 0 in both the **BlackScreen** and **FadeAnimator** game objects. That will
    make the **BlackScreen** and **FadeAnimator** game objects cover the whole screen.

    +   9. Parent the **BlackScreen** game object to the **FadeAnimator** game object
    in the **Hierarchy**.'
  merge: -1
  img_proc: true
