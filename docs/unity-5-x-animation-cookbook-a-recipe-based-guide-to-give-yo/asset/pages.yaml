    13. Make sure your class name is the same as the file name of the script, as it
    won''t compile otherwise.

    14. Assign the script to the character, to the same Transform that has the Animator
    component with your Animator Controller attached. Play the game and press the
    space bar; you should see your character switch to the next animation state.


    # How it works...


    You can use several types of parameters and corresponding script functions to
    set them:


    +   - **Trigger**: This is the simplest parameter. It is set to true with the
    SetTrigger(string name) function called on the Animator component object. It is
    reset by the Animator Controller after it is consumed (used) by a transition.
    The string name parameter of the function has to match your trigger parameter
    name set in the Animator Controller.

    +   - **Int**: This is an integer parameter. When you use it, you have to specify
    a logical comparison in the condition. The transition will only occur if the value
    of the parameter meets the comparison condition with a given number. You can use
    the Equal, Greater, Less, and Not Equal options to compare the value of your parameter
    with the given number. Integer type parameters are set with the SetInteger(string
    name, int value) function. The string name parameter needs to match the parameter
    name set in the controller. The int value parameter is the value to set the controller
    parameter to.

    +   - **Float**: This is a float parameter. It works the same as the integer type,
    but uses floating point numbers instead of integers. It is set using the SetFloat(string
    name, float value) function.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '+   - **Bool**: This is a Boolean parameter. The condition can check if the
    parameter is true or false. The value of the parameter is set with the `SetBool(string
    name, bool value)` function.


    # There''s more...


    +   - You can add more than one condition to a state transition by clicking on
    the plus icon in the **Conditions** section in the transition **Inspector**. For
    the transition to occur, all its conditions have to be met. It works as logical
    *AND* for the conditions.

    +   - You can also create more than one transition between the same states. To
    do this, right-click on the state you want to transition from and choose the **Make
    Transition** option, and then select the state you already have a transition to.
    A multi-transition is marked with three arrows instead of one. If the conditions
    of any of the transitions are met, the transition will occur. You can use it as
    logical *OR* for transition conditions.

    +   - If you have more than one transition between states, you can only edit one
    of them at a time. To edit a transition, select it in the **Transitions** section
    of the **Inspector**.


    ![](img/616a75b593bef4212f618360fceea442_47_0.png)


    +   - If you want to remove a transition, select it in the **Inspector** and click
    on the minus icon, or select it in the **Animator Controller** and press *Delete*
    on the keyboard. Pressing *Delete* removes all the transitions.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '+   - If you want to remove a condition from a transition, select it in the
    **Inspector** tab and click on the minus icon. To select a condition, you need
    to click on the handle to the left of the condition drop-down list (the handle
    looks like a = sign).

    +   - If you want to remove a parameter from the **Animator Controller**, you
    need to click on the handle on the left of the parameter and press the *Delete*
    button on the keyboard. You can also right-click on the parameter and choose the
    **Delete** option from the context menu.


    # Using animations from multiple assets


    At times it is very convenient to separate animations to multiple assets. A common
    scenario is to have rigged models separated from animations or different animation
    types separated from each other (combat from movement, movement from actions,
    actions from cut scenes, and so on). This recipe shows how to do it for both **Humanoid**
    and **Generic** rigs.


    # Getting ready


    Before we start, you should prepare and import at least two assets containing
    animations. If you are using a **Generic** rig, make sure to have the same rig
    in both assets. You can also use the provided example Unity project and go to
    the `Chapter 01 Working with animations\Recipe 06 Using animations from multiple
    assets`. There is a scene called `Example.unity` file there. In the scene **Hierarchy**
    you can find a **Character** game object. It has an attached **Animator Controller**
    in which you can find two animations: **Idle** and **Wave**. In the **Rigs** directory,
    you will find the `Character.fbx` asset containing only a rigged character along
    with the `Idle.fbx` and `Wave.fbx` assets containing the corresponding animations.


    ![](img/616a75b593bef4212f618360fceea442_48_0.png)


    If you are exporting FBX files from Blender, make sure to disable the **Add Leaf
    Bones** option in the **exporter**. If you are exporting just the rig and animations
    (without a mesh), add an empty object to the scene. If you will not do this, your
    rig could be messed up a bit after import.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# How to do it...


    To use animations from multiple assets, you need to follow these steps:


    +   1. Import the files to Unity.

    +   2. If you are using the Generic rig, you have to set the **Avatar Definition**
    to **Create From This Model** on your character (or reference character if you
    plan to have multiple characters with the same rig). For each imported animation
    asset, set the **Avatar Definition** to **Copy From Other Avatar** and choose
    the avatar of your character or reference character. To do so, you need to unfold
    the character asset, find the avatar, and drag and drop it to the **Source** field
    in the **Inspector** tab.

    +   3. If you are using a **Humanoid** rig, you don''t have to copy the **Avatar
    Definition** (you still can if your rigs are exactly the same; that way you will
    have fewer avatars in your project, making it easier to find the ones you need).

    +   4. Create or open an **Animator Controller**.

    +   5. Assign animations from different files and build transitions between them.

    +   6. Run the game to see the animations work.


    ![](img/616a75b593bef4212f618360fceea442_49_0.png)'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# How it works...


    All **Generic** rigs can use animations from multiple assets that share the same
    **Avatar Definition**. To share the same **Avatar Definition**, **Generic** rigs
    have to have exactly the same rigs (the same hierarchy, the same bone names and
    transforms). All **Humanoid** rigs can use animations from multiple assets that
    are also set to **Humanoid**. Additionally, they don''t need to have the same
    rigs because Unity automatically retargets all humanoid animations.


    # Looping, mirroring and offsetting the animations


    Unity allows editing the animations to some extent after they''re imported. It
    can save a lot of work and greatly speed up your workflow.


    # Getting ready


    Before we start, you should prepare and import a **Humanoid** rig with at least
    one animation. You can also use the provided example Unity project and go to the
    `Chapter 01 Working with animations\Recipe 07 Looping mirroring and offsetting
    animations` directory. There is a scene called `Example.file` there. In the scene
    **Hierarchy**, you can find a **Mirror** game object. It has an attached **Animator
    Controller** in which you can find two animations: **Wave** and **WaveMirror**.
    In the **Rigs** directory, you will find the `Mirror.fbx` asset. If you select
    it and go to the **Inspector**, and to the **Animations** tab, you can find normal
    and mirrored animation examples, as well as looped animation examples (**Idle**
    and **IdleMirror**).


    # How to do it...


    To set an animation to *loop*, you need to go through the following steps:


    +   1. Select the animated asset and go to the **Animations** tab.

    +   2. Check the **Loop Time** checkbox and click on the **Apply** button. The
    animation is looped.

    +   3. If your animation''s first and last frames don''t match perfectly, you
    can force them to match with the **Loop Pose** checkbox. It is not recommended
    to use this option for animations that have matching first and last frames.'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'To *offset* an animation, you need to go through the following steps:


    +   1. Select the animated asset and go to the **Animations** tab.

    +   2. Select your animation and make it loop (**Loop Time** checkbox).

    +   3. Enter a value in the **Cycle Offset** field, below the **Loop Pose** checkbox.

    +   4. Click on the **Apply** button.


    To *mirror* an animation, you need to go through the following steps:


    +   1. Select the animated **Humanoid** asset and go to the **Animations** tab.

    +   2. Find the **Mirror** checkbox on the bottom of the animation settings.

    +   3. Check the **Mirror** checkbox and click on the **Apply** button. The animation
    is mirrored.

    +   4. Mirroring animations works only for **Humanoid** rigs.


    # How it works...


    +   - **Looping animations**: This is a common technique used for all cyclic movements
    (walk and run cycles, idle animations, and so on). If you don''t set an animation
    to loop, it will play once and freeze on the last frame.

    +   - **Offsetting animations**: Sometimes it is convenient to offset the cycle
    of a looped animation. It is often used with the **Mirror** option for steering
    animations (clips used to turn the character while moving). We will be showing
    that in the *Using root motion to steer a character* recipe in `Chapter 4, Character
    Movement`.

    +   - **Mirroring animations**: This option works only with **Humanoid** rigs.
    It is used to flip the animation left to right and can save up to 50 percent of
    steering animations when combined with the **Offset Cycle** option.


    # There''s more...


    You can also mirror and offset animation states in the **Animator Controller**.
    If you select an animation state and go to the **Inspector** tab, you can find
    the **Mirror** and **Cycle Offset** options. There is also an option to use **Animator
    Controller** parameters to switch the **Mirror** option on and off and set the
    **Cycle Offset**. You need to have a Boolean parameter defined for the **Mirror**
    option and a float parameter for the **Cycle Offset**. Those settings will be
    automatically synchronized with the parameters. Whenever you change a parameter
    value, the setting will also be changed.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# Adjusting the playback speed of animations


    Unity allows you to slow down and speed the animation playback in the **Animator
    Controller**. You can do it in runtime with scripts to achieve interesting effects,
    for instance, slow motion.


    # Getting ready


    Before we start, you should prepare and import a rig with at least one animation
    and create an **Animator Controller** with at least one animation state for it.
    You can also use the provided example Unity project and go to the `Chapter 01
    Working with animations\Recipe 08 Adjusting the playback speed of animations`
    directory. There is a scene called `Example.unity` there. In the scene **Hierarchy**,
    you can find and **AdjustSpeed** game object. It has an attached **Animator Controller**
    in which you can find two animation states: **WaveSpeedNormal** and **WaveSpeedIncreased**.
    There is also an **AdjustSpeedByScript** game object in the scene. You can increase
    the playback speed of its animations by pressing the **Space** button on your
    keyboard in runtime.


    # How to do it...


    To change the animation playback speed, follow these steps:


    +   1. Open an **Animator Controller**.

    +   2. Select an animation state.

    +   3. Go to the animation state Inspector and find the **Speed** parameter below
    the **Motion** field.

    +   4. Enter a number in the **Speed** parameter to change the playback speed.


    # How it works...


    The **Speed** parameter set for an animation state in the **Animator Controller**
    multiplies the speed playback of the animation state. Setting this parameter to
    zero will freeze the animation.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# There''s more...


    You can also set the parameter using scripts. Following is an example script (it
    is used by the AdjustSpeedByScript game object in the provided Example.unity).
    You can assign it to your animated game object that has the Animator component
    and an Animator Controller attached:


    ```

    using UnityEngine;

    using System.Collections;


    public class AdjustSpeedByScript : MonoBehaviour {

    //This is a variable, in which we store the reference to the

    Animator component

    private Animator anim;

    //We store the wanted animation speed in this variable, the

    default value is 2 (200%).


    public float newAnimationSpeed = 2f;

    void Start () {

    //At the start of the game we assign the Animator

    component to our anim variable

    anim = GetComponent<Animator>();

    }

    void Update () {

    //We check if player pressed the Space button

    if (Input.GetKeyDown(KeyCode.Space)) {

    //And set the playback speed of the whole Animator

    Controller (it multiplies all states animation

    playback speed)


    anim.speed = newAnimationSpeed;

    }

    }

    }

    ```


    If you want to change the speed of just one animation state, then add a float
    parameter to your Animator Controller, use this parameter in the Multiplier field
    in the animation state Inspector, and change the parameter with scripts using
    the following function:


    ```

    anim.SetFloat(string name, float value);

    ```


    Here name is the name of your parameter in the Animator Controller and value is
    the float value you want to set the parameter and playback speed to.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Using override animator controllers to animate different types of characters


    If you have multiple types of character in your game, most probably you would
    like to be able to share the animation states logic between them and just replace
    the animation clips. Imagine that you have several types of enemies, and their
    combat logic is the same (they have attacks, movement, hit reactions, and so on)
    but they use different animation clips. For such situations, **Override Animator
    Controllers** come in handy.


    # Getting ready


    You should have at least two characters with different animation clips ready and
    imported into Unity. You can also download the provided example Unity project
    and go to the `Chapter 01 Working with animations\Recipe 09 Using override animator
    controllers to animate different types of characters` directory. There is a scene
    called `Example.unity` there. If you open it, you''ll find **Warrior** and **Spider**
    game objects in the **Hierarchy**. They have **Override Animator Controllers**
    attached, and you can examine them. If you run the game, the characters will play
    attack animations. The underlying logic is defined in the **HumanCombat** controller
    (found in the **Animator Controllers** directory). The **Warrior** game object
    uses the **HumanCombat** controller without overriding it, the **Spider** game
    object uses a **SpiderCombat** override controller.


    # How to do it...


    To use **Override Animator Controllers**, follow these steps:


    +   1. Create a normal **Animator Controller** that will be used as the reference
    controller containing the logic of animation states. In the provided example,
    it is the **HumanCombat** controller, created with **Warrior** animations.

    +   2. You can attach this controller to your first character (its **Animator**
    component) and use it as previously.

    +   3. Create an **Override Animator Controller** by right-clicking on the **Project
    View** and choosing **Create | Override Animator Controller**.

    +   4. Select the newly created override controller and go to the **Inspector**
    tab.

    +   5. Drag and drop your original/reference **Animator Controller** to the **Controller**
    field of the newly created override controller.

    +   6. You will see all your original animation clips listed on the left and fields
    for overriding those animation clips.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '+   7. Drag and drop the animation clips from your second character to the
    override fields corresponding with original animation clips of your first character.
    In the provided example, **Human** animations are replaced with **Spider** animations.

    +   8. Assign the **Override Animator Controller** to the **Controller** field
    of the **Animator** component of your second character.


    ![](img/616a75b593bef4212f618360fceea442_55_0.png)


    # How it works...


    **Override Animator Controller** only replace animation clips from your original
    **Animator Controller**. The logic of the original controller stays the same (so
    you can also use the same scripts to set the same parameters and so on). It is
    extremely useful for creating NPC characters in your games. You create the **Animator
    Controller** once, you write the scripts driving the controller once and only
    change the animations.


    ![](img/616a75b593bef4212f618360fceea442_55_1.png)


    Your original **Animator Controller** has to have animation clips. You cannot
    override empty animation states.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# Importing object animation from a 3D package


    In Unity, you can import not only skeletal animation but also object transform
    animation. It can be useful for creating complex movements, for instance, an object
    following a path.


    # Getting ready


    You have to animate an object''s translation, rotation, or scale in a 3D package,
    then export the object as FBX file. You can also download the provided example
    Unity project and go to the `Chapter 01 Working with animations\Recipe 10 Importing
    object animation from a 3D package` directory. There is a scene called `Example.unity`
    there. This object has a follow path animation created in Blender and exported
    to FBX file. It has a normal Animator Controller with that animation as default
    state (looped). You can run the game to see the object animate.


    # How to do it...


    To import object animation, follow these steps:


    +   1. Animate an object in a 3D package (translation, rotation, and scale animations
    are supported).

    +   2. Import the object into Unity and select the **Generic** rig type.

    +   3. You can adjust animation settings normally (loop an animation for instance).

    +   4. Create an **Animator Controller** and drag and drop one of the imported
    animations into the **Animator** window to create a default animation state.

    +   5. Place your animated object into a scene and assign the controller to the
    **Animator** component of the object.

    +   6. If you run the game, the object will be animated.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# How it works...


    Unity imports translation, rotation, and scale animation of 3D objects from a
    3D package. It makes it easy to create complex animations and use advanced features
    of a chosen 3D software. Make sure to bake your animations into frames before
    importing them to Unity (Blender bakes the exported animations to frames by default).
    Importing mesh animation (vertices movement) is not supported (you have to use
    **Blend Shapes** instead; we will discuss them in detail in the *Animating facial
    expressions with Blend Shapes* recipe in `Chapter 5, Character Actions and Expressions`).'
