- pgno: 77
  md: '# How to do it...


    To use Hierarchy to animate an object''s local rotation, follow these steps:


    +   1. Put your planet models into the scene.

    +   2. One of our planets will be the parent of our little “planetary system.”
    Call it **Planet1** (as we will refer to it in this recipe a lot).

    +   3. Add an empty child game object to **Planet1** and name it **Planet2Orbit**.
    The **Planet2Orbit** game object should be placed in the center of the **Planet1**
