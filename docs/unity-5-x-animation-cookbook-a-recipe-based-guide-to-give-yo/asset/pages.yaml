- pgno: 24
  md: '# 1


    # Working with Animations


    This chapter explains the essentials of working with animations in Unity and covers
    the following topics:


    +   - Importing skeletal animations

    +   - Configuring generic and humanoid rigs

    +   - Creating and assigning an Animator Controller

    +   - Creating animation transitions in Animator Controller

    +   - Using parameters to control the animation flow

    +   - Using animations from multiple assets

    +   - Looping mirroring and offsetting animations

    +   - Adjusting the playback speed of animations

    +   - Using override Animator Controllers to animate different types of characters

    +   - Importing object animation from a 3D package


    # Introduction


    Unity is a great game engine that implements the *animate everything* philosophy,
    which allows you to visualize even the most creative gameplay ideas. Through the
    course of this book, we will learn a variety of recipes that will help you unleash
    the power of Unity 5.x animation tools and make your games more fun.


    In this first chapter, we will get more familiar with using skeletal animations
    in Unity. It will guide you through the process of importing such animations,
    editing them, and assigning them to your in game characters. This knowledge is
    essential for understanding recipes described in further chapters.'
  merge: -1
  img_proc: true
- pgno: 25
  md: "# Importing skeletal animations\n\nThis first recipe shows how to import a\
    \ skeletal animation from a 3D package. It assumes that you have an animation\
    \ already prepared. We are going to bring the file to Unity and show where you\
    \ can adjust the import settings. We will not jump into too much detail for now\
    \ to make the import process as quick as possible. We will cover all the settings\
    \ in further recipes.\n\n# Getting ready\n\nMost animations are created in external\
    \ 3D packages such as Maya, 3ds Max, Motion Builder, or Blender 3D. Make sure\
    \ you have prepared a 3D model with a skeleton, the model is skinned, and you\
    \ have created at least one animation. You can also download the provided example;\
    \ open the project in Unity and go to this folder: `Chapter 01 Working with animations\\\
    Recipe 01 Importing skeletal animations\\Sheep Model`. You will find an imported\
    \ FBX file called `Sheep.fbx` there.\n\n# How to do it...\n\nTo import a skeletal\
    \ animation, you need to follow these steps:\n\n![](img/616a75b593bef4212f618360fceea442_25_0.png)\n\
    \n+   1. Export a skinned model and its skeleton (called **rig** in Unity) to\
    \ FBX format.\n+   \n+      If you are using Blender, you don't have to manually\
    \ export the file to FBX format. Simply drag and drop the file to your `Assets`\
    \ folder. Unity will use Blender FBX exporter in the background. Additionally,\
    \ you will be able to open the file by double-clicking on it in Unity. After you\
    \ edit and save it, Unity will reimport it again. It is a very convenient way\
    \ of editing animations as you don't have to go through the export-import process\
    \ each time you make a change.\n+   \n+   2. Drag and drop the exported file into\
    \ any subfolder in the `Assets` folder in your project or go to **Assets | Import\
    \ new asset** and choose your FBX file."
  merge: -1
  img_proc: true
- pgno: 26
  md: '3. Select the imported file and navigate to the **Inspector** tab. Click on
    the Rig button:


    ![](img/616a75b593bef4212f618360fceea442_26_0.png)


    4. Here you can specify the type of the rig to use. For bipedal characters, use
    the **Humanoid** option, for all the rest choose **Generic**. We use a sheep model
    in this example, so we need to choose the **Generic** rig. Differences between
    those options are described in the *How it works* section.


    5. Leave all the other inputs as defaults.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '+   6. Click on the **Animations** button. If an **Unapplied import settings**
    window appears, click on **Apply**.

    +   7. Make sure the **Import Animation** checkbox is checked.

    +   8. Click on the **Apply** button in the lower right corner of the **Inspector**
    (just above the **Animation Preview**). You may need to scroll the **Inspector**
    down.

    +   9. You should be able to see all imported animation clips as child assets
    of your imported FBX file.


    ![](img/616a75b593bef4212f618360fceea442_27_0.png)


    ![](img/616a75b593bef4212f618360fceea442_27_1.png)'
  merge: -1
