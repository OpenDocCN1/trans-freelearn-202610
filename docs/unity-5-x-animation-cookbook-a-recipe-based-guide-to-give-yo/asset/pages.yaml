    **AimForwardUp** (aim 45 degrees up), **AimForwardDown** (45 degrees down), **AimLeft**
    (45 degrees left), **AimLeftUp** (45 degrees left and 45 degrees up), **AimLeftDown**
    (45 degrees left and 45 degrees down), **AimRight** (45 degrees right), **AimRightDown**
    (45 degrees right and 45 degrees down), **AimRightUp** (45 degrees right and 45
    degrees up). See the following screenshot for reference:


