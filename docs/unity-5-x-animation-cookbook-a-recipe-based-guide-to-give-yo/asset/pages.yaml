    \ scene. When you press the *H* key, it will start a healing action, only when\
    \ in **SpiderIdle** state. You can find all the necessary animations in the `Chapter\
    \ 06 Handling combat\\Recipe 02 Using animation events to trigger script functions\\\
    Rigs` directory.\n\n# How to do it...\n\nTo check which Animator state is currently\
    \ active, follow these steps:\n\n+   1. Import the character to Unity.\n+   2.\
    \ Create an Animator Controller for it or use an existing one.\n+   3. If you\
    \ want your character to react to hits, follow the *Using transitions from Any\
    \ State to play hit reactions* recipe.\n+   4. In this recipe, we are going to\
    \ use the healing action as an example. Create a new script and call it `Healing.cs`.\
    \ In this script's `Update()` function, first we check if player pressed the *H*\
    \ key. Then we check if our character is playing in the proper **Animator** state\
    \ and saved in the `public string healingAllowedState` variable. We also check\
    \ if a healing action is not active because we don't want to stack healing actions.\
    \ If all these conditions are met, we start a healing coroutine:\n\n```\nif (Input.GetKeyDown(KeyCode.H))\n\
    {\n    if (anim.GetCurrentAnimatorStateInfo(0).IsName(\nhealingAllowedState))\n\
    \    {\n        if (!isHealing)\n```"
