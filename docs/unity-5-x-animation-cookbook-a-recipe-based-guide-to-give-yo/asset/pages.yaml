- pgno: 267
  md: '+   9. It is used to constrain the cloth movement. To pin a cloth to something,
    select the **Paint** tab and click on the **Max Distance** checkbox. By left-clicking
    on a vertex, you can paint it red, which means its movement is fully constrained.
    You may choose a different color to make the cloth move slightly. Black means
    no constrains at all.

    +   10. After painting at least one vertex, you may switch to the **Select** tab.
    In this tab, you can box-select vertices. After selecting a group of vertices,
    you may check the **Max Distance** checkbox and edit the value for all selected
    vertices at once.

    +   11. If you cannot select or paint the vertices, rotate the view—you may be
    looking at your mesh from the backfaces side. Selecting and painting works only
    on the frontfaces side, unless you check the **Manipulate Backfaces** option in
    the **Visualization** dropdown.

    +   12. Our Flag''s orientation is top to bottom (it is pinned with its top to
    the pole). So we should select all top vertices and paint them red (set the **Max
    Distance** to 0). In your case, you may want to pin other vertices.

    +   13. To remove the constrain from any given vertex, select it (you need to
    be in the **Select** tab) and uncheck the **Max Distance** checkbox. The vertex
    will turn black, which means it is not constrained any more.

    +   14. To make the **Flag** collide with other game objects, go to the **Capsule
    Colliders** and **Sphere Colliders** array in the **Cloth** component''s settings.
    You may add **Sphere Colliders** or **Capsule Colliders** located in the scene
    here. **Cloth** can collide only with those two types of colliders.

    +   15. Play the game to see the effect.


    # How it works...


    Cloth simulation uses vertices of a mesh to simulate cloth-like behavior. The
    mesh needs to be dense enough to make the simulation look good. The flag used
    in this example has 100 vertices.


    The **Cloth** component has a number of options to use and tweak:


    +   - **Stretching Stiffness**: How stiff the cloth is when stretching.

    +   - **Bending Stiffness**: How stiff the cloth is when bending.

    +   - **Use Tethers**: This helps prevent unconstrained vertices going too far
    away from the constrained ones

    +   - **Use Gravity**: This applies gravity to cloth vertices.

    +   - **Damping**: This damps the motion of cloth vertices.'
  merge: -1
  img_proc: true
- pgno: 268
  md: '+   - **External Acceleration:** This is a constant acceleration of cloth vertices
    and can be used to simulate wind.

    +   - **Random Acceleration:** This is similar to the preceding option, but is
    random. It is useful for simulating wind.

    +   - **World Velocity Scale:** This scales the world velocity of the object to
    which the cloth is attached to. It is useful for a character''s clothing.

    +   - **World Acceleration Scale:** This scales the world acceleration of cloth
    vertices when the object the cloth is attached to accelerates. It is useful for
    a character''s clothing.

    +   - **Friction:** The friction to apply when cloth vertices collide with something.

    +   - **Collision Mass Scale:** This scales the mass of cloth vertices when they
    collide with something.

    +   - **Use Continuous Collision:** This is similar to the continuous collision
    detection of the rigid bodies and improves collision quality but is heavier on
    performance.

    +   - **Use Virtual Particles:** This adds one virtual particle/vertex per cloth
    triangle and improves collision quality.

    +   - **Solver Frequency:** Number of solver iterations per second.

    +   - **Sleep Threshold:** The threshold after which cloth stops being simulated
    (sleeps).

    +   - **Capsule Colliders:** An array of capsule colliders to collide with.

    +   - **Sphere Colliders:** An array of sphere colliders to collide with.


    # There''s more...


    Cloth works best with single-sided flat meshes (subdivided planes). It can also
    be used on thin subdivided boxes. Avoid using copied planes with inverted face
    normals (that makes two sheets of cloth that constantly collide with each other).


    For best results, you should use some kind of double-sided shader on the single-sided
    flat mesh. You may use a simple shader provided with the example project; you
    can find it in the `Textures materials and shaders\Shaders` directory. It doesn''t
    support shadows. You can also find good double-sided shaders in the Asset Store;
    I can recommend the **Double Sided Standard Mobile Legacy Shaders** package created
    by Mario Lelas.


    Cloth components can be used with any Skinned Mesh Renderer. So you can make parts
    of your characters be simulated as cloth. The best practice would be to have a
    second Skinned Mesh Renderer with just the cloth mesh (it will be far easier to
    constrain such mesh than trying to constrain the whole character).'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# Using rigid body joints


    In this recipe, we will create two objects with physics simulation: a rope and
    doors. We will use rigid body joints to constrain the movement and rotation of
    those objects.


    # Getting ready


    For this recipe, we need four models: a **RopePole** (similar to the one from
    the previous recipe), a skinned **Rope** with a **RopeRig** containing around
    10 bones, a **Frame** and two doors, **DoorLeft** and **DoorRight** (resembling
    those swing doors from a saloon). We also need a character with a rigid body to
    collide with our objects. You can go to the `Chapter 09 Physics and animations\Recipe
    02 Using rigid body joints` directory. You will find all these objects in the
    `Example.unity` scene. When you play the game, try to walk with our character
    and collide with the rope and doors to see the effect.


    ![](img/616a75b593bef4212f618360fceea442_269_0.png)


    Rope and swing doors'
  merge: -1
  img_proc: true
- pgno: 270
  md: '# How to do it...


    To use rigid body joints, follow these steps:


    +   1. Import our swing doors to Unity. The model should contain three objects:
    **Frame**, **DoorLeft**, and **DoorRight**.

    +   2. Place the objects in the scene and parent them all to an empty game object,
    which you may call **SwingDoors**.

    +   3. Add a **Mesh Collider** to the **Frame** game object to prevent our character
    from going through it.

    +   4. Add a **Box Collider** or a **Mesh Collider** set to **Convex** to the
    **DoorLeft** game object.

    +   5. Add a **Rigidbody** component to the **DoorLeft** game object.

    +   6. Add a **Hinge Joint** component to **DoorLeft**.

    +   7. Set the **Axis** parameter to 0 X, 1 Y, and 0 Z. This is the axis in which
    our **Hinge Joint** can rotate.

    +   8. Check the **Use Limits** option and set the **Min** to -120 and **Max**
    to 120 (exact limits may differ in your particular case). Those values describe
    the range in which our **Hinge Joint** can rotate from its neutral position.

    +   9. If you want the doors to come back to their original position after they
    are pushed, check the **Use Spring** option.

    +   10. Set the **Spring** parameter to 1 and **Damper** to 0.5 (you may need
    to experiment with the exact values).

    +   11. Repeat steps 4-10 for the **DoorRight** game object.

    +   12. Play the game and make any other rigid body collide with the doors to
    see the effect (you may use your character if it uses rigid body physics to move).


    To create a rope using **Hinge Joints**, follow these steps:


    +   1. Import our skinned **Rope** model to Unity. Rope should have enough bones
    to simulate its behavior (around 10-20 should be enough in most cases). Make sure
    the bones have identical or similar size and are not parented to each other (it
    will make the editing much easier).

    +   2. Place the **Rope** model in the scene.

    +   3. Go to the **RopeRig** game object and select all the bones.

    +   4. Add **Capsule Collider**, **Rigidbody**, and **Hinge Joint** components
    to all the bones in the rig.

    +   5. With all the bones selected, use the Inspector to scale the **Capsule Colliders**
    to fit the bones sizes.'
  merge: -1
  img_proc: true
- pgno: 271
  md: '+   6. Make sure the **Auto Configure Connected Anchor** option is selected
    in each bone''s **Hinge Joint** settings.

    +   7. For every bone, find its **Hinge Joint** settings. Drag and drop the next
    bone to the **Connected Body** field of the previous bone. For instance, if you
    have a rig containing five bones, **Bone1**, **Bone2**, **Bone3**, **Bone4**,
    **Bone5**. **Bone5** is the top one—drag and drop **Bone5** to the **Connected
    Body** field in the **Hinge Joint** settings of **Bone4**. Drag and drop **Bone4**
    to **Connected Body** field in the **Hinge Joint** settings of **Bone3** and so
    on. Leave the top bone''s **Connected Body** field empty—this will constrain its
    movement in space.

    +   8. You may also need to adjust the **Limits** and **Axis** fields. The rotation
    axis should point in the same direction in which the bones are pointing. If you
    select a game object with a **Hinge Joint**, you may see the rotation axis as
    a small brownish arrow.

    +   9. Disable or remove the **Animator** component from the **Rope** game object.

    +   10. Play the game and collide with the rope to see the effect.


    # How it works...


    In this recipe, we used Hinge Joints—one of the joint types in Unity. Those joints
    constrain rigid body movement. If we use them on a rig of a Skinned Mesh Renderer,
    we can introduce physics simulation to it (as we did with the rope). Hinge Joints
    have a few interesting parameters:


    +   - **Connected Body**: We can connect the object to another rigid body by placing
    it into this field. Connected objects can form ropes, chains, and other interesting
    structures.

    +   - **Anchor**: A defined local space position around which the joint can rotate.

    +   - **Axis**: This specifies the axis around which the joint can rotate.

    +   - **Auto Configure Connected Anchor**: If we check this, the Connected Anchor
    will be configured automatically to match the Connected Body''s Anchor.

    +   - **Connected Anchor**: Here we can manually configure the connected body
    position (we have to disable **Auto Configure Connected Anchor** first).

    +   - **Use Spring**: If this option is checked, the joint will behave as if a
    spring is attached to it. It will try to get back to its **Target Position** (see
    further down this list).

    +   - **Spring**: This is the force of the spring.

    +   - **Damper**: This damps the movement caused by the spring force. The object
    will slow down in time until it completely stops.'
  merge: -1
  img_proc: true
- pgno: 272
  md: '+   - **Target Position**: This is the target angle to which the joint''s spring
    wants to pull the object.

    +   - **Use Motor**: This makes the object spin around its joint **Axis**.

    +   - **Target Velocity**: This is the velocity the object wants to achieve when
    rotating.

    +   - **Force**: This is the force applied to the object to achieve the **Target
    Velocity**.

    +   - **Free Spin**: When you enable this option, the object will not try to slow
    down to match the **Target Velocity**, it will only accelerate.

    +   - **Use Limits**: Enable this option if you want to limit the rotation of
    the object around its joint **Axis**.

    +   - **Min**: This is the lowest rotation limit.

    +   - **Max**: This is the highest rotation limit.

    +   - **Bounciness**: How much the object will bounce off when it reaches the
    rotation limit.

    +   - **Contact Distance**: It makes the limits *have some width* to decrease
    jitter. In this distance from the limits, the joint will have contact with the
    given limit.

    +   - **Break Force**: This is the force needed to break the joint and is useful
    if you want to ram your doors.

    +   - **Break Torque**: Similar to the preceding one, this is the torque needed
    to break the joint.

    +   - **Enable Collision**: This enables collision between rigid bodies connected
    to the joint.

    +   - **Enable Preprocessing**: his is used to stabilize the situations that are
    impossible to fulfill.


