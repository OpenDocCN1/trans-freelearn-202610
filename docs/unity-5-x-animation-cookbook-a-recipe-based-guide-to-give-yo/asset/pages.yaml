- pgno: 209
  md: "# There's more...\n\nLookAt() aiming is best used with robots and machines.\
    \ It can be very useful for implementing turrets. You can find a Turret game object\
    \ in the scene. It is built of three objects:\n\n+   - **Turret**: This is the\
    \ base of the Turret.\n+   - **TurretPivot**: This game object only rotates horizontally\
    \ (in the Y axis). This is a child object of the Turret.\n+   - **Gun**: This\
    \ object always points at the target. It is a child object of the TurretPivot.\
    \ The TurretPivot rotates horizontally, so the Gun looks like it only rotates\
    \ vertically.\n\nThe Turret game object has a TurretAim.cs script attached. In\
    \ this script's Update() function, we first damp the public Transform target position\
    \ and save the value in the Vector3 dampedTargetPosition variable. Then we use\
    \ this variable to calculate the aimVector and we use the aimVector to calculate\
    \ the horizontalAimVector (we simply remove the Y component from it). Lastly,\
    \ we calculate new rotations for the TurretPivot and Gun game objects (stored\
    \ in public Transform variables) using our aimVector and horizontalAimVector:\n\
    \n```\ndampedTargetPosition =\nVector3.SmoothDamp(dampedTargetPosition,\n aimTarget.position,\
    \ ref refDampSpeed, dampTime);\n\n aimVector = dampedTargetPosition - turretGun.position;\n\
    \nhorizontalAimVector = aimVector;\nhorizontalAimVector.y = 0f;\n\nturretPivot.rotation\
    \ =\nQuaternion.LookRotation(horizontalAimVector);\nturretGun.rotation = Quaternion.LookRotation(aimVector);\n\
    ```\n\n# Using Blend Trees to aim\n\nIn this recipe, we will use a more sophisticated\
    \ method of aiming. This method is based on using several aim animations combined\
    \ into a Blend Tree."
  merge: -1
  img_proc: true
- pgno: 210
  md: '# Getting ready


    We are going to use the same assets as in the previous recipe, but instead of
