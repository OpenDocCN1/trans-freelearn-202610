- pgno: 135
  md: '25. Create two transitions:


    +   - **Idle | Steering** with the condition set to **Speed** parameter greater
    than 0.5, **Has Exit Time** set to false, and **Transition Duration** set to 0.2
    seconds.

    +   - **Steering | Idle** with the condition set to **Speed** parameter less than
    0.5, **Has Exit Time** set to false, and **Transition Duration** set to 0.2 seconds.


    26. Write a script to set the **Speed** and **Direction** parameters of our Animator
    Controller and assign that script to the character.


    27. You can find the script in the provided Unity project in the `Scripts` directory
    of this recipe. It is called `RootMotionSteering.cs`.


    28. In this script, we make the character move relative to the camera. In the
    `Update()` function, first we get and store player input in two variables, `hor`
    (for `Horizontal` input) and `ver` (for `Vertical` input):


    ```

    hor = Input.GetAxis("Horizontal");


    ver = Input.GetAxis("Vertical");

    ```


    29. As we want to move the character relative to the camera, we''re using the
    camera''s forward and right axis to build a desired movement vector. Our camera
    is not completely horizontal (it can face slightly down, for instance), so first
    we need to calculate `cameraHorizontalForward` by taking the normal camera forward
    vector, setting its Y axis to 0, and normalizing the vector (so it has a length
    of 1):


    ```

    cameraHorizontalForward = new

    Vector3(cameraTransform.forward.x,

    0f, cameraTransform.forward.z).normalized;

    ```


    30. In this script, `cameraTransform` is a `public Transform` variable to which
    we attach our in-game camera.


    31. Next we calculate the `desiredMoveDirection`: this is a vector pointing in
    the direction that we would like to move our character. This vector points directly
    to the right axis of the camera when the player holds the right arrow, to the
    left of the camera when player holds the left arrow, to the horizontal version
    of camera''s forward axis (`cameraForwardHorizontal`) when the player holds the
    up arrow, and to the opposite direction of that vector when player holds the down
    arrow:


    ```

    desiredMoveDirection = ver * cameraHorizontalForward + hor *

    cameraTransform.right;

    ```'
  merge: -1
  img_proc: true
- pgno: 136
  md: "32. Next we calculate the angle between our character's forward vector and\
    \ our `desiredMoveDirection` vector. We will use this value to set the **Direction**\
    \ parameter in the Animator Controller. The `Vector3.Angle()` method returns an\
    \ angle between two vectors. This angle is always positive (greater than 0). Therefore,\
    \ we use the dot product of the `desiredMoveDirection` and `transform.right` (our\
    \ character's right axis) vectors to determine whether the `desiredMoveDirection`\
    \ points to the right or to the left of the character (the dot product is greater\
    \ than 0 for vectors pointing in the same direction and less than 0 for vectors\
    \ pointing in the opposite direction). We use the `Mathf.Sign()` method to make\
    \ sure our dot product value equals -1 or 1. The result is an angle from -180\
    \ to 180 degrees; we store the value in the `float direction` variable:\n\n```\n\
    direction = Vector3.Angle(transform.forward,\n    desiredMoveDirection) *\n  \
    \  Mathf.Sign(Vector3.Dot(desiredMoveDirection,\n    transform.right));\n```\n\
    \n33. Then we calculate a `float speed` variable's value; it is simply the magnitude\
    \ of our `desiredMoveVector`. The `speed` variable is used to set the **Speed**\
    \ parameter in our Animator Controller:\n\n```\nspeed = desiredMoveDirection.magnitude;\n\
    ```\n\n34. Lastly, we use the calculated `direction` and `speed` values and set\
    \ them in our Animator Controller, with a `dampTime` parameter of the `SetFloat()`\
    \ method set to 0.2 seconds to smooth out the blends. The `anim` variable stores\
    \ the reference to the Animator component of our character and is set in the `Start()`\
    \ function:\n\n```\nanim.SetFloat(\"Direction\", direction, 0.2f, Time.deltaTime);\n\
    anim.SetFloat(\"Speed\", speed, 0.2f, Time.deltaTime);\n```\n\n# How it works...\n\
    \nRoot motion steering works the same way as the root motion movement. We are\
    \ using the rotation of the root bone to rotate the character. In our example,\
    \ the character is walking in circles, so its hips are rotating during the animation.\
    \ That data is then used to rotate the whole character.\n\nAgain, to make the\
    \ walk animations blend properly, you have to make sure that they all start with\
    \ the same leg and that the feet contact poses are in the same normalized time\
    \ as the animation."
  merge: -1
  img_proc: true
