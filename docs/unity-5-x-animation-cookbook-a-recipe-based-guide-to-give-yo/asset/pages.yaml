- pgno: 302
  md: '# How it works...


    We are using the `Lerp()` function in two ways:


    +   - **Standard method:** The `Lerp()` function''s `float t` parameter has values
    from 0 to 1. We''ve used a timer as out t parameter. The `timer` first was increasing
    to the value of 1. After it reached 1, it was decreasing to 0. This method gives
    us standard linear interpolation between two values. The t parameter is the percentage
    of the interpolation (for t = 0.5, the interpolated value is an average of two
    input values).

    +   - **Continuous method:** The second method is based on using the output value
    (in our case the position) as the lower input value in the `Lerp()` function.
    We call the `Lerp()` function in `Update()` and use `Time.deltaTime` as the t
    parameter. `Time.deltaTime` is a very small value, so each time the function is
    called, the output value is interpolated toward the end value by a very small
    fraction. Calling this method in `Update()` results in smooth movement. It is
    not linear anymore. The **BlueDot** moves faster if it is further away from the
    cursor and slows down when it gets closer.


    ![](img/616a75b593bef4212f618360fceea442_302_0.png)


    Remember that when you''re using the second method, the interpolated value will
    never truly get to the end position or end value. That''s why sometimes we have
    to implement an `if` statement and check if the interpolated value is close enough
    to the end value. If so, we can set it to be exactly the same.


    The `Lerp()` function is implemented in various classes. These are the most commonly
    used examples:


    +   - `Mathf.Lerp()`: This interpolates between two float values

    +   - `Vector3.Lerp()`: This interpolates between two vectors (positions for instance)

    +   - `Quaternion.Lerp()`: This interpolates between two rotations

    +   - `Color.Lerp()`: This interpolates between two colors'
  merge: -1
  img_proc: true
- pgno: 303
  md: '# See also


    Two more methods are also worth checking out in Unity''s Scripting Reference:
    `Vector3.Slerp()` and `Vector3.SmoothDamp()`. The first one interpolates a vector
    spherically (as we would by rotating it) and the second one dampens the change
    in a vector (a position for instance). It can be used for implementing objects
    that should smoothly follow another object.


    # Using the Rotate() function to animate an object


    In this recipe, we will use the `Transform.Rotate()` function to create an infinite
    looping animation of a windmill. We could make the same with the **Animation**
    View, but sometimes writing a simple script means much less effort than creating
    a key frame animation.


    # Getting ready


    We need a few models we can rotate in this recipe. As an example, we will use
    a windmill. It is composed of three game objects: **WindmillBase**, which is the
    root of the whole windmill, **Windmill** which is parented to the **WindmillBase**,
    and **WindmillWings** which is parented to the **Windmill**. The **Windmill**
    game object itself can rotate in the Y axis. The **WindmillWings** game object
    can rotate in its local Z axis.


    ![](img/616a75b593bef4212f618360fceea442_303_0.png)


    Windmill hierarchy'
  merge: -1
