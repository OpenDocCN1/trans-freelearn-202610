    \ and transform.Rotate() methods, by changing the rigidbody.velocity vector, or\
    \ by using the rigidbody.ApplyForce() method). Animations were merely visual effects\
    \ and the game could work without a single animation being played. In the root\
    \ motion approach, animations drive the movement of a character. The translation\
    \ and rotation data is captured from the root node (a bone in the rig's hierarchy)\
    \ and applied to the whole character in game. There are a few pros and cons to\
    \ each approach:\n\n| Traditional approach | Root motion approach |\n|---|---|\n\
    | Pros\n• Small number of animations\n• You can prototype without a single animation\n\
    • You can adjust the speed of the character easily | Pros\n• Looks more natural,\
    \ there is no foot sliding\n• You can create complex moves and even game mechanics\
    \ with animations\n• You can have irregular movements such as a wounded or zombie\
    \ walk |"
