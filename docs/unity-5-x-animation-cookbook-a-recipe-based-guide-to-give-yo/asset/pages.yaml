  md: '# Using sprite sheets to animate particles


    We can add sprite sheet animation to Unity''s particles to make them more interesting.
    This concept is especially useful for various explosions and magical effects.


    # Getting ready


    To follow this recipe, we need an animation exported as a sprite sheet. If you
    want to know how to create a sprite sheet animation, you can read the *Exporting
    a 2D sprite animation from a 3D package* recipe in `Chapter 3`, 2D and User Interface
    Animation, where you can find an example sprite animation.


    ![](img/616a75b593bef4212f618360fceea442_235_0.png)


    Example sprite sheet animation


    You can also open the provided example project and go to the `Chapter 07 Special
    effects\Recipe 07 Using sprite sheets to animate particles` directory. If you
    open the `Example.unity` scene there and play the game, you will see a particle
    system with explosions using sprite sheet animation. You can find the necessary
    sprite sheet in the `Rigs` directory.'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# How to do it...


    To use sprite sheets for particles animation, follow these steps:


    +   1. Import the sprite sheet texture into Unity. Its size should be a power
    of 2. The animation should be rendered from left to right and from top to bottom
    in equal tiles (128 × 128, 256 × 256, or similar).

    +   2. Set it as a normal **Texture** (not a Sprite) and check the **Alpha Is
    Transparency** option.

    +   3. Create a new **Material** and name it `Explosion`.

    +   4. Set the **Shader** to **Particles | Alpha Blended** (you can also use Additive
    or Additive Soft).

    +   5. Drag and drop the texture into the **Particle Texture** slot in the **Material**.

    +   6. Create an empty game object in the scene and name it `AnimatedExplosion`.

    +   7. Add a **Particle System** component to it.

    +   8. Drag and drop the **Explosion** material into the **Renderer | Material**
    slot.

    +   9. Check the **Texture Sheet Animation** option and unfold it.

    +   10. Set the **Tile''s X** and **Y** fields according to your exported sprite
    sheet. In our example, the sheet has **8** tiles in **X** and **4** in **Y**,
    as shown in the following screenshot:


    ![](img/616a75b593bef4212f618360fceea442_236_0.png)


    Texture Sheet Animation settings


    +   11. Adjust the **Start Lifetime** of the particles to match the frame rate
    of your exported sprite sheet animation. If your exported animation lasts 1 second,
    then the **Start Lifetime** of a particle should be also equal to 1 second.

    +   12. Adjust the other settings of the particle system to your liking. In this
    example, those settings are as follows:

    +       - **Start Lifetime**: 1

    +       - **Looping**: True

    +       - **Start Speed**: 0

    +       - **Start Size**: 5'
  merge: -1
  img_proc: true
- pgno: 237
  md: '+   - **Emission** | **Rate**: 1

    +   - **Shape** | **Shape**: Sphere

    +   - **Shape** | **Radius**: 4


    13. Play the game or simulate the particle system to see the effect.


    # How it works...


    Unity''s particle system can play sprite sheet animation for each of its particles.
    To do so, the **Texture Sheet Animation** option has to be checked. This option
    has several important settings:


    +   - **Tiles**: The **X** and **Y** fields specify how many tiles in **X** and
    **Y** the texture sheet has. Animation is played from left to right and from top
    to bottom.

    +   - **Animation**: We can use the whole sheet or a single row. If the **Single
    Row** option is selected, we can use a random row of the Sprite Sheet or specify
    a single row for our animation. This way we can have multiple animations in one
    sprite sheet. It also gives us the possibility to have multiple animations per
    particle system, instead of playing the same one for every particle (**Random
    Row** has to be checked to achieve this).

    +   - **Frame Over Time**: This is a curve describing which frame should be played
    over time. Remember that, by default, the whole sprite sheet is always played
    during the whole lifetime of a particle.

    +   - **Cycles**: Here we can specify how many cycles of the animation should
    be played in one lifetime of a particle.


    # Animating properties of a particle system with the Animation View


    This recipe shows how to use the Animation View to animate a particle system''s
    properties. Not all of them can be directly accessed with the **Animation** View,
    but we will use the same trick as with the fog in the *Using the Animation View
    to animate public script variables* recipe.'
  merge: -1
  img_proc: true
