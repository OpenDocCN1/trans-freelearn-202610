  md: "13. Create a new script and call it Tired.cs. In this script's Update() function,\
    \ we set the weight of the Tired layer when player presses the space bar. The\
    \ Tired layer has the index of 1. We use a helper variable weightTarget to set\
    \ the new weight to 0 or 1, depending on its current value. This allows us to\
    \ switch the additive layer on and off every time player presses the space bar.\
    \ Finally, we interpolate the weight value in time to make the transition more\
    \ smooth and we set the weight of our additive layer with the SetLayerWeight()\
    \ function:\n\n```\nif (Input.GetKeyDown(KeyCode.Space))\n{\n    if (weightTarget\
    \ < 0.5f)\n    {\n        weightTarget = 1f;\n    }\n    else if (weightTarget\
    \ > 0.5f)\n    {\n        weightTarget = 0f;\n    }\n}\nweight = Mathf.Lerp(weight,\
    \ weightTarget, Time.deltaTime * tiredLerpSpeed);\n\nanim.SetLayerWeight(1, weight);\n\
    ```\n\n14. Attach the script to the Humanoid character.\n\n15. Play the game and\
    \ press the space bar to see the additive animation effect.\n\n# How it works...\n\
    \nAdditive animations are calculated using the reference pose. Movements relative\
    \ to this pose are then added to other animations. This way we can not only override\
    \ the base layer with other layers but also modify the base movements by adding\
    \ secondary motion.\n\nTry experimenting with different additive animations. You\
    \ can, for instance, make your character bend, aim, or change its overall body\
    \ pose."
