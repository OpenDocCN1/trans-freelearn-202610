- pgno: 203
  md: '# Using Avatar Masks and animator controller layers to walk and aim


    This recipe shows how to use Avatar Masks and Layers in the Animator Controller
    to play animations on certain body parts. In combat, it can be useful for playing
    aim animations on the upper body and movement animations on the lower body.


    # Getting ready


    In this recipe, we are using WalkForward, WalkLeft, WalkRight, and Idle animations,
    and a looped AimForward animation. The first four animations are covered in the
    Using root motion to steer a character recipe in Chapter 4, Character Movement.
    The last one is a simple looped aim animation where our character aims a crossbow
    straight ahead. You can go to the Chapter 07 Special effects\Recipe 07 Using sprite
    sheets to animate particles directory. You will find an Example.unity scene there.
    Open it and play the game. You can move the character with the WSAD keys and rotate
    the camera with the mouse. You can find the AimForward animation in the Rigs directory
    and all the other required animations in the Chapter 04 Character movement\Recipe
    03 Using root motion to steer a character directory. We also need a Crossbow prop,
    which you can find in the Props folder.


    # How to do it...


    To use Avatar Masks and Layers, follow these steps:


    +   1. Import the character and the Crossbow prop to Unity. Make sure to have
    all the required animations.

    +   2. Create an Animator Controller and assign it to the character.

    +   3. Follow the Using root motion to steer a character recipe in Chapter 4,
    Character Movement, to make the character move.

    +   4. Open the Animator Controller and find the Layers tab.'
  merge: -1
  img_proc: true
