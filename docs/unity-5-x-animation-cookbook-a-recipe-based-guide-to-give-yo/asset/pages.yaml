  md: '| Cons | Cons |

    |------|------|

    | • Hard to remove foot sliding<br>• Special attacks and evasion moves have to
    be programmed<br>• Looks “last gen” | • Requires a bigger number of animations<br>•
    You can''t move your character without an animation<br>• Longer prototyping iterations
    |


    There are a few important options regarding root motion in the **Animation Import
    Settings**:


    +   - **Root Transform Rotation**: This option captures the rotation of the root
    node and applies it to the whole game object. You can set it to **Bake Into Pose**
    to disable the root motion rotation. With this option selected, the rotation will
    be treated as a visual effect of the animation and will not be applied to the
    game object. You should set it to true for every animation that shouldn''t rotate
    the character. You can set the **Based Upon** option to one of the following options:

    +     - **Original**: This is the original root node rotation from the animation
    file.

    +     - **Body Orientation**: This alters the original rotation to make the character''s
    upper body face the Z axis of the game object (the forward axis). You can also
    set the **Offset** option to offset the rotation.

    +   - **Root Transform Position Y**: This option captures the vertical movement
    of the root node and applies it to the whole game object. You can set it to **Bake
    Into Pose** to disable the root motion in the Y axis. With this option selected,
    the Y axis motion will be treated as a visual effect of the animation and will
    not be applied to the game object. You should set it to true for every “on ground”
    animation (unless it''s a jump). You can set the **Based Upon** option to the
    following options:

    +     - **Original**: This is the original root node Y axis motion from the animation
    file.

    +     - **Center Of Mass**: This aligns the center of mass with the root node
    vertical position.

    +     - **Feet**: This keeps the feet aligned with the vertical root node position.
    You can also set the **Offset** option to offset the vertical root node position.'
  merge: -1
  img_proc: true
- pgno: 132
  md: '+   - **Root Transform Position XZ**: This option captures the horizontal (XZ)
    movement of the root node and applies it to the whole game object. You can set
    it to **Bake Into Pose** to disable the root motion in the X and Z axis. With
    this option selected, horizontal motion will be treated as a visual effect of
    the animation and will not be applied to the game object. You should set it to
    true for all stationary animations (such as **Idle**). You can set the **Based
    Upon** option to the following options:

    +     - **Original**: This is the original root node horizontal motion from the
    animation file.

    +     - **Center Of Mass**: This aligns the center of mass with the root node
    horizontal position. You can also set the **Offset** option to offset the horizontal
    root node position.


    # There''s more...


    In Unity, you can combine root motion and traditional approaches very easily.
    In fact, we are doing it in this recipe. We control the movement of our character
    with root motion but we steer it with the `transform.Rotate()` method. You can
    also create a character with traditional movement (“in place” animations with
    all the **Bake Into Pose** options set to true for walk and run animations) and
    root motion actions such as attacks and evade moves.


    # Using root motion to steer a character


    In this recipe, we will use animations to move and steer our character.


    # Getting ready


    To use root motion for steering, you need to prepare a character with at least
    four animations: **Idle**, **WalkForward**, **WalkLeft**, and **WalkRight**. **WalkRight**
    and **WalkLeft** should make the character walk in circles (clockwise and counterclockwise).
    You don''t need to create a full circle, just make sure that the start and end
    poses of the animation look similar. As always, all the animations should have
    contact points of the feet in the same normalized time. Make sure not to switch
    the left and right foot. If you start the **WalkForward** animation with the left
    foot forward, both **WalkLeft** and **WalkRight** animations should also start
    with the left foot forward, as shown in the following screenshot:'
