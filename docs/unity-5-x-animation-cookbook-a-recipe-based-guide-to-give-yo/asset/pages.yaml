    When you create an animation in the Animation View for the first time for a given
    game object, a new **Animation Clip** and an Animation Controller are created.
    The Animator Controller is automatically assigned to the game object you are animating
    and the Animation Clip is added to the Animator Controller. Any new animation
    created for the same game object will be added to the same Animator Controller
    automatically.'
