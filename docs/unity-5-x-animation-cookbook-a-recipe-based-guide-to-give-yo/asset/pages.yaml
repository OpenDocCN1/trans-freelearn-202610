    # Introduction


    This chapter contains additional recipes with useful tricks and solutions.


    # Using math to animate an object


    We can use mathematical formulas to create interesting-looking animations. We
    are going to use this concept to make an endless curve animation with the Mathf.Sin()
    and Mathf.Cos() functions.'
