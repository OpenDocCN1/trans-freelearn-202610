  md: '# Getting ready


    We need several **Blend Shapes** that store our facial expressions. In this recipe,
    we will use **Smile**, **Angry**, **BlinkLeft**, **BlinkRight**, and **BrowsDown**
    shapes. Create them in your 3D package. If you are using Blender, **Blend Shapes**
    are called Shape Keys. In other softwares, they may be called Morph Targets.


    You can also use the provided example Unity project and go to the `Chapter 05
    Character actions and expressions\Recipe 08 Animating facial expressions with
    blend shapes` directory. You will find an `Example.scene` there. Open it, play
    the game, and adjust the sliders on the UI to see the effect. You can find the
    character with all the Blend Shapes in the `Rigs` directory.


    # How to do it...


    To use **Blend Shapes** for facial expressions, follow these steps:


    +   1. Import your character to Unity. Place it on the scene.

    +   2. Create an empty game object in the same place as our character. Call the
    object **FaceAnims**.

    +   3. Make the character a child of the **FaceAnims** game object.

    +   4. With the **FaceAnims** game object selected, open the **Animation** View
    (go to **Window** | **Animation**).

    +   5. Create a new Animation Clip and call it `Angry`.

    +   6. Click on the Add Property button and choose **Character** | **Mesh** |
    **SkinnedMesh Renderer** | **Blend Shape.Angry**, where **Character** is the name
    of your character game object, **Mesh** is the name of your character game object
    containing the **Skinned Mesh Renderer** component, and **Angry** is the name
    of the Blend Shape exported from the 3D package.

    +   7. Click on the plus icon next to the **Blend Shape.Angry** option to add
    the property.

    +   8. Go to the **Curves** tab. Select both key frames and right-click on one
    of them. Choose the **Edit Keys** option and enter 100 in the **Value** field.

    +   9. This way we''ve created an **Angry** animation with the **Angry Blend Shape**
    set to 100 (maximum value).

    +   10. Repeat the steps 5 to 9 for **Smile**, **BlinkLeft**, **BlinkRight**,
    and **BrowsDown** Blend Shapes. Remember to call the animations according to the
    Blend Shapes names (it makes it easier to recognize animations).

    +   11. An Animator Controller was automatically created for the **FaceAnims**
    game object. Open it.'
