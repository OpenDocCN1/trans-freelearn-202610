  md: '15. Create four transitions:


    +   - **Any State | StandUpFaceDown** with one condition: **StandUpFaceDown**
    Trigger. **Has Exit Time** should be set to false and **Transition Duration**
    set to 0.

    +   - **Any State | StandUpFaceUp** with one condition: **StandUpFaceUp** Trigger.
    **Has Exit Time** should be set to false and **Transition Duration** set to 0.

    +   - **StandUpFaceDown | Idle** with no conditions: **Has Exit Time** should
    be set to true and **Transition Duration** set to around 0.2.

    +   - **StandUpFaceUp | Idle** with no conditions: **Has Exit Time** should be
    set to true and **Transition Duration** set to around 0.2.


    16. Assign the controller to the character''s Animator component.


    17. [Optional] You can find the `ShowRig.cs` script in the `Shared Scripts` folder.
    If you attach it three times to the **CharacterAnimated** game object, you may
