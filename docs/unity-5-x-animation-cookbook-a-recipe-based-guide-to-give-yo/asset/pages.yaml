  md: '# Using Animation Events to trigger script functions


    We used Animation Events sporadically in earlier recipes because they are so handy,
    and it was simply difficult to until to this moment. Most present games use Animation
    Events very extensively, especially for handling combat. Creating believable melee
    encounters would be a lot harder without this handy tool.


    # Getting ready


