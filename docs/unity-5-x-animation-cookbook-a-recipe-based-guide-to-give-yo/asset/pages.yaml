  md: '# Using Blend Shapes to morph an object into another one


    Previously, we used Blend Shapes to create face expressions. Blend Shapes are
    also an excellent tool for special effects. In this recipe, we will morph one
    object into another.


    # Getting ready


    To follow this recipe, we need to prepare an object with Blend Shapes. We''ve
    created a really simple example in Blender—a subdivided cube with one shape key
    that looks like a sphere. See the following screenshot for reference:


    ![](img/616a75b593bef4212f618360fceea442_231_0.png)


    A cube with a Blend Shape that turns it into a sphere


    You can also go to the Chapter 07 Special effects\Recipe 05 Using blendshapes
    to morph an object into another one directory. Open the Example.unity scene there.
    You will see a number of cubes there. If you hit the space bar in play mode, the
    cubes will morph into spheres. You can find the Cuboid.fbx asset with the required
    Blend Shapes in the Model directory.


    # How to do it...


    To use Blend Shapes to morph objects, follow these steps:


    +   1. Import the model with at least one Blend Shape to Unity. You may need to
    go to the Import Settings, Model tab, and choose Import BlendShapes.

    +   2. Place the model in the Scene.'
  merge: -1
  img_proc: true
- pgno: 232
  md: "3. Create a new script and call it `ChangeShape.cs`. This script is similar\
    \ to the one from the previous recipe. In the `Update()` function, we change the\
    \ weight of the first Blend Shape when player presses the space bar. Again, we\
    \ use a helper variable `weightTarget` to set the new `weight` to 0 or 100, depending\
    \ on its current value. Blend Shapes have weights from 0 to 100 instead of 1.\
    \ Finally, we interpolate the `weight` value in time to make the transition smoother.\
    \ We use the `SetBlendShapeWeight()` function on the `skinnedRenderer` object.\
    \ This variable is set in the `Start()` function with the `GetComponent<SkinnedMeshRenderer>()`\
    \ function:\n\n```\nif (Input.GetKeyDown(KeyCode.Space))\n{\n    if (weightTarget\
    \ < 50f)\n    {\n        weightTarget = 100f;\n    }\n    else if (weightTarget\
    \ > 50f)\n    {\n        weightTarget = 0f;\n    }\n}\nweight = Mathf.Lerp(weight,\
    \ weightTarget, Time.deltaTime * blendShapeLerpSpeed);\nskinnedRenderer.SetBlendShapeWeight(0,\
    \ weight);\n```\n\n4. Attach the script to the model on the scene.\n\n5. Play\
    \ the game and press the space bar to see the model morph.\n\n# How it works...\n\
    \nstores vertices position of a mesh. We have to create them in a 3D package.\
    \ Unity imports Blend Shapes and we can modify their weights in runtime using\
    \ the `SetBlendShapeWeight()` function on the **Skinned Mesh Renderer** component.\
    \ We can also use animations as shown in the, *Animating facial expressions with\
    \ Blend Shapes* recipe in *Chapter 5, Characters Actions and Expressions.*\n\n\
    ![](img/616a75b593bef4212f618360fceea442_232_0.png)\n\nBlend Shapes have trouble\
    \ with storing **Normals**. If we import **Normals** from our model, it may look\
    \ weird after morphing. Sometimes, setting the **Normals** option to **Calculate**\
    \ in the **Import Settings** can helps with the problem. If we choose this option,\
