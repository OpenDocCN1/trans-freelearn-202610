- pgno: 252
  md: '+   4. Make sure to have key frames for both the ball and the character in
    the first and last frames of the animation. This way, the animations will have
    equal length after importing them to Unity.

    +   5. After synchronizing the animation in a 3D package, save it to two files:
    one with only the ball object and its animation, and one only with the character
    and its animation. Unity can import multiple transform animations, but has problems
    with importing multiple skeletal animations (for example, you will not be able
    to set the rig to **Humanoid**).

    +   6. Export both files separately to FBX format and make sure to include the
    **Default Take**. In Blender, use the 6.1 version of FBX.

    +   7. Import both files to Unity.

    +   8. If you want to use a **Humanoid** character, make sure to set all the **Based
