- pgno: 212
  md: "+   10. Create a new **Sphere** object and name it **AimTarget**.\n+   11.\
    \ Make **AimTarget** a child of the **Main Camera** game object. We are using\
    \ the same `CameraLook.cs` script in this recipe. You can find the script in the\
    \ `Shared Scripts` folder in the provided example Unity project.\n+   12. Offset\
    \ the **AimTarget** position in its local Z axis by around 20 units.\n+   13.\
    \ Create a new script and call it `AimWithBlendTree.cs`. In the `Update()` function\
    \ of this script, we first calculate the `aimVector`. This is a vector from a\
    \ helper `aimNode` transform to the `target` transform. Then we use this vector\
    \ to calculate a `horAimVector`, a horizontal vector for aiming. Then we use the\
    \ `horAimVector` to calculate the `aimHor` angle. We use the `Vector3.Angle()`\
    \ method to find the angle between the `horAimVector` and `transform.forward`\
    \ axis and `Mathf.Sign()` with `Vector3.Dot()` to determine the sign of the angle.\
    \ We calculate the `aimVer` angle in a similar way, but we use the `horAimVector`\
    \ instead of the `transform.forward` axis. Lastly, we assign the **AimVer** and\
    \ **AimHor** parameters in the controller:\n+   14. Assign the script to the character.\
    \ Drag and drop the **AimTarget** transform to the **Target** field of the script.\n\
    +   15. Create an empty game object and name it **AimNode**. Place it roughly\
    \ where the chest of the character is and make it a child of the character's transform.\n\
    +   16. Assign the **AimNode** transform to the **Aim Node** field of the script.\
    \ You can use the **AimNode** to adjust the `aimVector` calculation.\n+   17.\
    \ Play the game to see the effect.\n\n```\naimVector = target.position - aimNode.position;\n\
    \nhorAimVector = aimVector;\nhorAimVector.y = 0f;\n\n aimHor = Vector3.Angle(horAimVector,\
    \ transform.forward) *\nMathf.Sign(Vector3.Dot(horAimVector, transform.right));\n\
    \n aimVer = Vector3.Angle(horAimVector, aimVector) *\nMathf.Sign(Vector3.Dot(aimVector,\
    \ Vector3.up));\n\nanim.SetFloat(\"AimHor\", aimHor, aimSmooth, Time.deltaTime);\n\
    anim.SetFloat(\"AimVer\", aimVer, aimSmooth, Time.deltaTime);\n```"
  merge: -1
