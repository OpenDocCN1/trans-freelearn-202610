  md: "# How to do it...\n\nTo make characters follow an object with their gaze, follow\
    \ these steps:\n\n+   1. Import the character into Unity and place it in a scene.\n\
    +   2. Make sure to create an Animator Controller with at least one animation,\
    \ or use an existing one.\n+   3. To use the firstQuaternion.LookRotation() method,\
    \ create a new script and call it CharacterLookAt.cs.\n+   4. In that script,\
    \ we use the void LateUpdate() function to alter bone rotation after all animations\
    \ are evaluated. In that function, we first check if a public float weight variable\
    \ is less than or equal to 0. If so, we don't do anything (we turn off the look\
    \ at behavior):\n+   5. If that is not true, we calculate our desired lookDirection.\
    \ This is a vector in which our character should look. We calculate it by subtracting\
    \ our public Transform bone position from the public Transform target position.\
    \ This vector is then damped in time using the SmoothDamp() function. This prevents\
    \ it from sudden changes. We use a public float dampTime variable to determine\
    \ the time in which we smooth the vector out. The dampVelocity vector is class\
    \ member variable required by the SmoothDamp() function to store the changes in\
    \ the lookDirection vector between frames:\n+   6. Next we check if the angle\
    \ between our desired lookDirection vector and the character's transform.forward\
    \ vector is greater than our public float maxAngle value. If so, we calculate\
    \ the finalLookVector. This is our character's transform.forward vector, which\
    \ is rotated toward the desired lookDirection vector by the maxAngle degrees.\
    \ This way we create a cone of vision for our character and prevent it from breaking\
    \ the neck joint. We need to use the MathfDeg2Rad constant to change our maxAngle\
    \ degrees to radians because the Vector3.RotateTowards() function uses radians\
    \ instead of degrees. If the angle between lookDirection and transform.forward\
    \ is less than or equal to maxAngle, we don't alter the lookDirection:\n\n```\n\
    if (weight <= 0f)\n{\n    return;\n}\n```\n\n```\nlookDirection = Vector3.SmoothDamp(lookDirection,\n\
    \    target.position - bone.position, ref dampVelocity,\n    dampTime);\n```"
