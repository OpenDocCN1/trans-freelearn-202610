    \ in the Scene View and name it CameraRig.\n+   2. Parent the Main Camera to the\
    \ CameraRig.\n+   3. Select the Main Camera and add an Animator component to it.\n\
    +   4. Open the Animation View.\n+   5. Create a new Animation Clip and call it\
    \ CamNormal. The camera should have no motion in this clip. Add keys for both\
    \ the camera's position and rotation.\n+   6. Create another Animation Clip and\
    \ call it CameraShake. Animate the camera's rotation and position to create a\
    \ shake effect. The animation should have about 0.5 seconds.\n+   7. Open the\
    \ automatically created Main Camera controller.\n+   8. Add a Shake Trigger parameter.\n\
    +   9. Create two transitions:\n+      - CamNormal | CameraShake with the condition:\
    \ Shake Trigger parameter. Has Exit Time should be set to false and Transition\
    \ Duration set to 0.2 seconds.\n+      - CameraShake | CamNormal with no conditions:\
    \ Has Exit Time should be set to true and Transition Duration set to 0.2 seconds.\n\
    +   10. Write a new script and call it CamShake.cs.\n+   11. In this script's\
    \ Update() function, we check if player pressed the space bar. If so, we trigger\
    \ the Shake Trigger in our controller:\n\n```\nif (Input.GetKeyDown(KeyCode.Space))\n\
    {\n    anim.SetTrigger(\"Shake\");\n}\n```"
