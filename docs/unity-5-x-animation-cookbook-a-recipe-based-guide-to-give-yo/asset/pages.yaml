    +   7. Add an Animator component to the root game object of our planetary system
    (**Planet1**).

    +   8. Open the **Animation** View with the **Planet1** game object selected (go
    to **Window** | **Animation**).

    +   9. Create a new Animation Clip by clicking on the **Create** button.

