- pgno: 115
  md: '# Using filled images for creating animated progress bars


    In this recipe, we will create a very common UI mechanism: progress bar. The same
    concept can also be used for creating health bars, cooldown indicators, and so
    on.


    # Getting ready


    Before we start, you should prepare at least one sprite image and import it to
    Unity. You can also use the provided example Unity project and go to the Chapter
    03 2D and user interface animation\Recipe 07 Using filled images for creating
    animated progress bars directory. You will find an Example.unity scene there.
    Open it and play the game to see the effect.


    # How to do it...


    To create an animated progress bar, follow these steps:


    +   1. Import the progress bar image to Unity and set its type to **Sprite (2d
    and UI)**.

    +   2. Open a scene and create a new **Image** by using the **Game Object | UI
    | Image** command. **Canvas** and **Image** game objects will be created.

    +   3. Select the **Image** game object and change its name to **ProgressBar**.

    +   4. Find the **Image** component in the **ProgressBar** game object''s **Inspector**.

    +   5. Set the **Image Type** property to **Filled**, the **Fill Method** to **Horizontal**,
    and the **Fill Amount** to 0, as shown in the following screenshot:


    ![](img/616a75b593bef4212f618360fceea442_115_0.png)'
  merge: -1
  img_proc: true
