  md: '# How to do it...


    To move a using animations, follow these steps:


    +   1. Import your character with root motion animations into Unity. We are using
    three animations in this example: Idle, WalkRoot, and RunRoot.

    +   2. Select the character asset file and go to the Inspector. Make sure the
    Animation Type is set properly for your character (Generic or Humanoid). If you
    are using a Generic character, make sure to set its Root Node.

    +   3. Go to the Animation tab and select the Idle animation. Select all the Bake
    Into Pose options. This bakes all the root motion data into the animation and
    makes it completely stationary. We don''t want the Idle animation to move or rotate
    our character. You may also set the Base Upon option of the Root Transform Rotation
    to Original. This will make your character stand in the same pose as authored
    in the 3D software.

    +   4. For WalkRoot and RunRoot animations, select the same options as for the
    Idle animation, but uncheck Bake Into Pose for Root Transform Position (XZ). This
    will make our character move in the X and Z axes only. The Y movement of the root
    node and its rotation will be baked into the animation and will not be stored
    as root motion anymore.

    +   5. Set the Loop Time options to true for all animations.

    +   6. Apply the import settings.

    +   7. Place your character onto a scene.

    +   8. Select it in the Hierarchy and add a Capsule Collider to it. You may need
    to adjust the Capsule Collider properties to better fit your character. In our
    examples, we need to set the Height property to 2 units and the Y axis in the
    Center property to 1 unit.

    +   9. Add a Rigidbody component to the character and set its Constraints to Freeze
    Rotation in every axis.

    +   10. Navigate to the Animator component of the character (it is added automatically
    for animated game objects). Set Update Mode to Animate Physics. Make sure the
    Apply Root Motion option is checked in the Animator component.

    +   11. Create an Animator Controller asset for the character.

    +   12. Drag and drop the Idle animation into the Animator Controller to make
    it the default state.

    +   13. Create a float DesiredSpeed parameter in the Animator Controller.

    +   14. Right-click on the empty space in the Animator Controller and choose Create
    State | New From Blend Tree.'
