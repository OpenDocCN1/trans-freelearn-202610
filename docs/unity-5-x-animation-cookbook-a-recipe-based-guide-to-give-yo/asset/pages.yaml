    +   9. Create an Animator Controller for the ball and another one for the character
    with the soccer kick animation.

    +   10. Place the ball and the character in the same location on the scene. Attach
    the Animator Controllers to them.

    +   11. Play the game to see the effect.


    # How it works...


    The best way to synchronize cutscene animations is to make sure that they have
    the same length and are synchronized in a 3D package. If we import them in Unity
    and start the playback in the same moment, they will stay synchronized.


    Remember that you need to export the characters as separate files if you want
    to use the **Humanoid** rigs.


    # There''s more...


    You can also synchronize animations using Animation Events. In our example, we
    could create the ball animation from the moment it is kicked by the character
    and transition to it using an Animation Event in the character''s kick animation.
    Although this is possible, it is more cumbersome than synchronizing the whole
    cutscene in a 3D package.'
