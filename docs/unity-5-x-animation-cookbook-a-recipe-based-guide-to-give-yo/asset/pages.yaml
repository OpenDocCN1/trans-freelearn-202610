- pgno: 213
  md: '# How it works...


    We are using a similar principle as used in the *Using root motion to create flying
    characters* recipe in `Chapter 4`, *Character Movement*. Our script calculates
    the angles between our target and our character''s forward axis. Then it assigns
    those angles as parameters in the controller. The Blend Tree uses those parameters
    to blend between nine directional aim animations.


    # There''s more...


    You can further develop this recipe with additional animations to handle more
    extreme angles. You can even have animations targeting +180 and -180 degrees in
    horizontal angles. This would make your character aim in every possible direction.


    # Detecting the hit location on a character


    Another animation-related topic in combat is the hit location detection. This
    recipe shows how to easily detect hits to different body parts.


