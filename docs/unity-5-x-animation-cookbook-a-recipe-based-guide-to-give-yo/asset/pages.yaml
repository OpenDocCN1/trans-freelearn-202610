- pgno: 70
  md: '# Getting ready


    To make an animated door, you should have two objects ready: the **Door Frame**
    and the **Door**. The **Door** should be a child of the **Frame** in the **Hierarchy**.
    It should be placed in the *closed position*. We assume that our **Door** will
    slide upward when opening. You should also have a player character with the `Player`
    tag assigned. The character should use a **Rigidbody** component to move or have
    a kinematic **Rigidbody** component. We will use triggers for our doors, and triggers
    react to Rigid bodies only. You can also go to the `Chapter 02 Working with the
    animation view\Recipe 04 Animating objects local position - creating automatic
    doors` directory and find the `Example.unity` scene there. If you open it, you
    can find **Automatic Door** game object in the **Hierarchy** and a **Sheep** game
    object that will work as our player (it has the `Player` tag). If you run the
    game and go near the door, it will open.


    # How to do it...


    To create automatic doors, follow these steps:


    +   1. Select your **Door Frame** game object, and add an Animator component to
    it. To do so, click on the **Add Component** button in the **Inspector** and choose
    **Animator**. Make sure to add the component to the **Door Frame** instead of
    the **Door** (the parent instead of the child). Set the **Update Mode** of the
    **Animator** component to **Animate Physics**.

    +   2. With the **Door Frame** game object selected, go to **Window | Animation**
    to open the **Animation** View.

    +   3. Create a new Animation Clip and call it `Closed`; this will be our animation
    for the closed door. To create a new clip, click on the drop-down list below the
    playback buttons and choose the **Create New Clip** option.

    +   4. Click on the **Add Property** button and find your **Door** object in the
    list (a child of the **Door Frame** game object).'
