- pgno: 182
  md: '# How it works...


    This recipe has a few key elements that make it work:


    +   - **Blend Shapes**: You need to export the Blend Shapes from your 3D package.
    Blend Shapes store different version of the same mesh. The mesh has to have the
    same number of vertices. When creating new Blend Shapes, you can only move the
    vertices around (you cannot add or delete vertices).

    +   - **FaceAnims game object**: Our character is a child of a new game object,
    **FaceAnims**. This allows us to be able to animate facial expressions. As our
    character has its own Animator component and its own animations, we cannot modify
    it with the **Animation** View. Adding a parent game object solves the problem.

    +   - **Direct Blend Tree**: We use a **Blend Tree** set to **Direct**. This allows
    us to blend multiple animations at once. This is suitable for Blend Shapes and
    facial expressions.


    # There''s more...


    You don''t have to create Animation Clips for Blend Shapes. Instead, you can manipulate
    them directly from code. Use the `setBlendShapeWeight()` function on the **Skinned
    Mesh Renderer** component. You will need to know the index of the **Blend Shape**
    in the **Blend Shapes** array (you can check it in the Inspector, in the **Skinned
    Mesh Renderer** component of the character). We''ve prepared a small script that
    sets the weight. It is attached to the **DirectBlendShapes** game object. You
    can also find it in the `Scripts` directory of this recipe.


    Creating animations for **Blend Shapes** gives more flexibility. You can also
    animate the Blend Shapes'' weight with the **Animation** View. This way you can
    create dialog animations and believable animated facial expressions.'
  merge: -1
  img_proc: true
