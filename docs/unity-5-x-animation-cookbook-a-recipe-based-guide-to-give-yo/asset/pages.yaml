    \ blood effect prefab\n    in this variable*/\n    public GameObject bloodEffect;\n\
    \n    /*This variable is set to true when the character object was\n    already\
    \ killed*/\n    bool isKilled = false;\n\n    /*This function is called by the\
    \ death\n    trap, when we enter it*/\n    public void Kill ()\n    {\n      \
    \  /*If the character was already killed by the trap,\n        we don't want to\
    \ do anything*/\n        if (isKilled) {\n            return;\n        }\n   \
    \     /*If it was not killed, we set the isKilled\n        variable to true*/\n\
    \        isKilled = true;\n\n        /*We check if the character has a RigidBody\
