    \ (rb != null) {\n            /*If we find the component, we need to set it to\n\
    \            kinematic to prevent our character from being\n            launched\
    \ in the air by the collision with our\n            trap*/\n            rb.isKinematic\
    \ = true;\n        }\n\n        /*Here we spawn a blood effect prefab stored in\
    \ the\n        bloodEffect variable*/\n        GameObject.Instantiate (bloodEffect,\
    \ transform.position\n            + Vector3.up * 2f, Quaternion.identity);\n \
    \   }\n```"
