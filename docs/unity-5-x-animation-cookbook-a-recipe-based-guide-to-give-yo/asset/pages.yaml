  md: '# Getting ready


    We don''t need anything special for this recipe. We are going to create it from
    scratch in Unity. You may also download the provided example project. Open the
    `Chapter 10 Miscellaneous\Recipe 01 Using math to animate an object` directory
    and load the `Example.unity` scene there. If you run the game, you will see the
    finished effect—a curve animated with the `Mathf.Sin()` and `Mathf.Cos()` functions:


    ![](img/616a75b593bef4212f618360fceea442_297_0.png)


    Final effect—curve animated with the Mathf.Sin() and Mathf.Cos() functions


    # How to do it...


    To use math for animating a curve, follow these steps:


    +   1. Create an empty game object.

    +   2. Add a **Line Renderer** component to it.

    +   3. Create a new material of your liking and assign it to the **Line Renderer**.

    +   4. Make sure the **Use World Space** option in the **Line renderer** component
    is not selected (we will use local coordinates in this example as it makes it
    slightly easier to position the **Line Renderer** in the camera).

    +   5. Change the **Start Width** and **End Width** of the **Line Renderer** to
    0.2 to make the line thinner.

    +   6. Create a new C# script and name it `MathAnim.cs`. In this script''s `Start()`
    function, we set the number of points of the `Line Renderer` using the `SetVertices()`
    method:


    ```

    positions = new Vector3[linePoints];

    lRenderer = GetComponent<LineRenderer>();

    ```'
  merge: -1
