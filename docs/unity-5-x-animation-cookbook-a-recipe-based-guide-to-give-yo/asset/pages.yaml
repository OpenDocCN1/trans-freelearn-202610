    # How it works...


    In this recipe, we''ve animated the camera''s position and rotation relative to
    the **CameraRig** object. This way we can still move the **CameraRig** (or attach
    it to a character).

    Our **CameraShake** animation only affects the local position and rotation of
    the camera. In the script, we simply call the `Shake Trigger` to play the **CameraShake**
    animation once.


    # There''s more...


    You can create more sophisticated camera shake effects with **BlendTrees**. To
    do so, prepare several shake animations with different strength and blend them
    in a **Blend Tree** using a **Strength** `float` parameter. This way, you will
    be able to set the shake''s strength, depending on different situations in the
    game (the distance from an explosion for instance).


    # Using the Animation View to animate public script variables


