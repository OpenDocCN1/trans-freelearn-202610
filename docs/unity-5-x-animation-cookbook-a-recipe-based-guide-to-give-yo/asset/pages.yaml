    \        Vector3.one * currentSample*100f,\n        Time.deltaTime*4f);\n    \
    \    yield return null;\n    }\n}\n```\n```\n\n+   7. Assign the script to the\
    \ Cube game object.\n+   8. Drag and drop the AudioSource game object into the\
