    # Animating triggers – creating a death trap


    In this recipe, we will animate a trigger position and use it to create a death
    trap. You can use Unity''s Animation View to create various game play mechanisms
    with minimum scripting.


    # Getting ready


    Before we start, you should prepare a death trap model. We are using a “press
    trap” as an example. It contains two identical moving elements. See the following
    screenshot:


