  md: '# How to do it...


    To use the Lerp() function for animating objects, follow these steps:


    +   1. First we need to create some objects to work with. Create a new Image (go
    to Game Object | UI | Image). Name it RedDot (you can add a circle sprite to it
    or leave it as it is). Change its color to red.

    +   2. Set the RedDot position to (0,0,0) and its Anchor Preset to middle center,
    as shown in the following screenshot:


