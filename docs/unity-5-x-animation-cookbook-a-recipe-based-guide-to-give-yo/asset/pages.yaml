    IEnumerator SampleAudio()\n{\n    while (true)\n    {\n        audioSource.GetOutputData(samples,\
    \ 0);\n        currentSample = 0f;\n        for (int i = 0; i < samples.Length;\
    \ i++)\n        {\n            currentSample += (samples[i]*\n            samples[i]);\n\
    \        }\n        currentSample = Mathf.Sqrt(currentSample /\n        samples.Length);\n\
