    13. Assign the RootMotionSteering.cs script to the character to make the character
    walk. You can find it in the Using root motion to steer a character recipe (Chapter
    04 Character movement\Recipe 03 Using root motion to steer a character\Scripts).


    14. Play the game to see the effect.


    # How it works...


    This recipe has a few key elements that make it work:


    +   - **Layers**: Animator Controller Layers are useful for overriding animations.
    The **Blending** drop-down menu in the **Layer Properties** defines the type of
    animation blending. We can override the animations or use additive blending (this
    will be covered in the next chapter).

    +   - **Layer Weight**: When blending Layers, Unity takes the **Weight** parameter
    into account. A weight of 1 means 100 percent override. You can set the Weight
    in runtime by using the `animator.SetLayerWeight(int index, float weight)` function
    (`animator` is a variable that holds the reference to the Animator component).

    +   - **Avatar Masks**: We can create an Avatar Mask asset and specify the body
    parts on which we want to play an animation. Then we can use this **Avatar Mask**
    in our **Layers** to override only certain body parts'' animations. This way we
    can play the **AimForward** animation on the upper body and not on the legs and
    root. This makes the character move while playing the **AimForward** animation.'
  merge: -1
  img_proc: true
- pgno: 207
  md: '# There''s more...


    You can also select the Sync option in the **Layer Properties**. It will inherit
    the structure of another, chosen layer, but you will be able to change all the
    animations. This option may be useful for implementing different types of animations
    for different character states (normal/wounded for example).


    We are also using a `CameraLook.cs` script in this recipe. The script can be found
    in the `Shared Scripts` folder of the provided Unity project. This script works
    with basic camera rig. The rig is built from three game objects:


    +   - **CameraRig**: This game object follows the Target transform specified in
    the `CameraLook.cs` script component. It also rotates in the global *Y* axis responding
    to player''s horizontal mouse input.

    +   - **CameraPivot**: This game object rotates in its local *X* axis to tilt
    the camera up and down. It responds to the vertical mouse input.

    +   - **Main Camera**: This is the standard game camera. It is moved away from
    the **CameraPivot** game object in local *Z* axis. This way we have a crane behavior
    for the camera. It orbits around the **CameraPivot** game object.


    # Using the LookAt() method to aim


    In this recipe, we will use a simple but effective implementation of aiming mechanics.


    # Getting ready


    We are going to use the same assets as in the previous recipe. Additionally, we
    are going to use the `CharacterLookAt.cs` created in the *Using Quaternion.LookRotation()*
    and *Animator.SetLookAtPosition()* methods to make characters follow an object
    with their gaze recipe in *Chapter 5, Character Actions and Expressions*.


    You can also use the provided example Unity project and go to the `Chapter 06
    Handling combat\Recipe 08 Using the LookAt method to aim` directory. You will
    find an `Example.unity` scene there, with a **Humanoid** character. Play the game
    to see the aiming effect.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# How to do it...


    To use the `LookAt()` method for aiming, follow these steps:


    +   1. Import your character to Unity and place it on the **Scene**.

    +   2. Follow the previous recipe to make a character walk and aim.

    +   3. Attach the `CharacterLookAt.cs` script to the character.

    +   4. Create a new **Sphere** object and name it AimTarget.

    +   5. Assign the chest bone to the `CharacterLookAt.cs` component''s **Bone**
    field.

    +   6. Assign the **AimTarget** to the **Target** field of the `CharacterLookAt.cs`
    component.

    +   7. Make the **AimTarget** a child of the **Main Camera** game object. We are
    using the same `CameraLook.cs` script in this recipe. You can find the script
    in the `Shared Scripts` folder in the example Unity project provided.

    +   8. Offset the **AimTarget** position in its local Z axis around 20 units.

    +   9. Play the game to see the effect. Our character will try to aim at the **AimTarget**.
    You may need to adjust the **Additional Rotation** vector in the `CharacterLookAt.cs`
    component. In our example, it is set to 15 in X and 20 in Y.


    # How it works...


    We are using the same principle as in the *Using LookRotation() and SetLookAtPosition()*
    methods to make characters follow an object with their gaze recipe. Our script
    rotates the chest bone in such a way that the character appears to aim at the
    target. We use the **Additional Rotation** vector in the `CharacterLookAt.cs`
    script to adjust the rotation (chest is not facing straight forward in most animations).
    This way of aiming is good for games in which characters walk relative to the
    camera (it is suitable for TPP games with an over-the-shoulder camera). It fails
    when characters have to rotate more than 50-60 degrees. The next recipe solves
    this problem.'
  merge: -1
