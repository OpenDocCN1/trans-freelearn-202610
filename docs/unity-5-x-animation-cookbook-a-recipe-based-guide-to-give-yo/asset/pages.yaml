- pgno: 316
  md: '25. Make sure the Animator component of the Controller game object is set to
    Always Animate.

    26. Play the game and press the space bar to see the effect. You will need to
    press the space bar several times to go through the whole cycle.


    # How it works...


    State behaviors can be used to create logic graphs—these graphs use Animator Controller
    as a state machine. Animator Controller can work without any Animation Clips—empty
    states can have behaviors as well.


    Mecanim state behaviors are scripts that derive from the `StateMachineBehavior`
    class instead of the `MonoBehavior` class. They have a number of functions we
    can override. The most useful ones are as follows:


    +   - `OnStateEnter()`: This function is called when the Animator Controller enters
    this state.

    +   - `OnStateUpdate()`: This function is called every frame when this state is
    active (is playing). It will be called after `OnStateEnter()` and before `OnStateExit()`.

    +   - `OnStateExit()`: This function is called when the Animator Controller exits
    this state.


    We can still manage the state transitions from a normal `MonoBehavior` script
    (in our example, it is the `LogicController.cs` script).


    Animator Controllers are assets, so they cannot reference objects in the scene.
    We can work around this by either finding the game objects by name (or tag) or
    by creating another `MonoBehavior` script that can reference objects in the scene.
    Our `LogicController.cs` script has an example of this: the `public Transform
    activeObject` variable. We can get the `LogicController.cs` script component in
    the behavior (as long as the Animator component is on the same game object). This
    way we can get to its `activeObject` variable and do an action on this transform.'
  merge: -1
  img_proc: true
