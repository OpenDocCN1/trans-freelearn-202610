- pgno: 125
  md: 'animation **Threshold** is set to 2, and your current **Speed** parameter value
    equals 1.5, both **Walk** and **Run** animations will be played with 50 percent
    weight, which will most likely result in your character jogging slowly.


    When blending **Walk** and **Run** animations, make sure to have the contact poses
    in the same normalized time in both animations. For instance, if the **Walk**
    animation has contact poses in 0 percent, 50 percent, and 100 percent of the animation,
    the **Run** animation should also have contact poses in 0 percent, 50 percent,
    and 100 percent of the animation. That will assure proper and smooth blending
    between the animations.


    # There''s more...


    There are a few other interesting options in the **Blend Tree** settings:


    +   - You can set the **Blend Type** of a **Blend Tree** to the following:

    +     - **1D**: A simple Blend Tree using one parameter to define the weight of
    a currently played animation.

    +     - **2D Simple Directional**: This option uses two parameters for blending
    the animations, such as the *X* axis and *Y* axis. It is best used for motions
    representing different movement directions, for instance, walk forward, walk left,
    walk right, and walk back. It shouldn''t be used with multiple animations representing
    movement in the same direction (such as walk forward and run forward).

    +     - **2D Freeform Directional**: This option is similar to the previous one,
    but you can use multiple animations representing movement in the same direction
    (such as walk and run). You need to add a single animation representing the motion
    in the 0, 0 position (such as idle).

    +     - **2D Freeform Cartesian**: This option is similar to the preceding one,
    but is used when your animations don''t represent movement in different directions.
    It can be used to blend multiple versions of the idle animation, for instance.

    +     - **Direct**: You can control the weight of each of the nodes (Motion fields)
    directly. This type is often used while blending facial expressions (see the *Animating
    facial expressions with Blend Shapes* recipe in Chapter 5, *Character Actions
    and Expressions*).'
  merge: -1
  img_proc: true
