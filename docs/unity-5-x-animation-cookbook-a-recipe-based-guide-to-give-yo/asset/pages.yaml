    \ * speedZ;\n\nfor (int i = 0; i < positions.Length; i++)\n{\n    positions[i].x\
    \ = lineLenght * (float)i /\n        (float)positions.Length;\n    positions[i].y\
    \ = amplitudeY * Mathf.Sin(frequencyY\n        * ((2f*Mathf.PI * (float)i /\n\
