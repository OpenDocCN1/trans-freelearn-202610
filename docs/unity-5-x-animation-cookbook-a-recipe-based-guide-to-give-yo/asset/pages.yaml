- pgno: 264
  md: '# 9


    # Physics and Animations


    This chapter presents Unity''s 5 physics engine and what can be achieved with
    it. It covers the following recipes:


    +   - Using cloth

    +   - Using rigid body joints

    +   - Destructible objects

    +   - Creating a humanoid ragdoll with the ragdoll wizard

    +   - Creating a generic ragdoll with character joints

    +   - Applying force to a ragdoll

    +   - Dismemberment

    +   - Getting up from a ragdoll


    # Introduction


    Unity''s physics engine can be used to create interesting effects as well as gameplay
    mechanics. Previously we were using rigid bodies to move our character and to
    detect collisions. In this chapter, we will focus on more visually appealing aspects
    of rigid bodies and physics.'
  merge: -1
  img_proc: true
- pgno: 265
  md: '# Using cloth


    In this recipe, we will create a simple cloth simulation:


    ![](img/616a75b593bef4212f618360fceea442_265_0.png)


    Cloth simulation used to create a flag


    # Getting ready


    For this recipe, we need a model of the cloth. It should be a plane divided several
    times to have enough vertices for the cloth simulation to work. In our example,
    we use one additional model: the flag pole. You can go to the Chapter 09 Physics
    and animations\Recipe 01 Using cloth directory. You will find a FlagPole game
    object in the Example.unity scene there. This object contains the Flag and the
    FlagPole objects as children. The Flag game object uses the cloth simulation.


    # How to do it...


    To use cloth simulation, follow these steps:


    +   1. Place the Flag game object in the scene.

    +   2. Add the Cloth component to the Flag game object (go to Component | Physics
    | Cloth).'
  merge: -1
  img_proc: true
- pgno: 266
