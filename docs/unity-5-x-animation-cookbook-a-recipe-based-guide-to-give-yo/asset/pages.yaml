- pgno: 186
  md: '16. Assign the script to the character, launch the game, and press the space
    bar to see the character change Sub-State Machines.


    # How it works...


    The concept of Sub-State Machines makes it easier to organize the controller.
    You can think of them as of nested controllers. You can have Sub-State Machines
    inside other Sub-State Machines. Clever organization of your controllers prevents
    spaghetti graphs.


    To exit a Sub-State Machine you have to transition to the Exit state. You can
    have multiple such transitions the same way you can have multiple transitions
    between Sub-State Machines. Use transition conditions to determine where your
    graph should transition to.


    # There''s more...


    You can also transition from Sub-State Machines to specific states in any other
    Sub-State Machine. To do so, make a transition to the state named (Up) Base Layer
    (the name can vary depending on the Sub-State Machine you are currently in and
    the names of your layers). If you do this transition, a menu will appear and let
    you choose the state you want to transition to; see the following screenshot for
    reference:


    ![](img/616a75b593bef4212f618360fceea442_186_0.png)


    Transition to a specific state in another Sub-State Machine'
  merge: -1
  img_proc: true
