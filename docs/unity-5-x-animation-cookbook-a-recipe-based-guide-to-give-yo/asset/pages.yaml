    # Using root motion to create a dodge move


    We can achieve a lot of gameplay actions in combat using just animations. A great
    example of such an action is the dodge move.


    # Getting ready


    To follow this recipe, we need a character with SpiderIdle and Dodge animations
    (we will be using our Spider character in this example). The dodge animation should
    be created with root motion. Please check the example in the following screenshot:


    ![](img/616a75b593bef4212f618360fceea442_194_0.png)


    Spider dodge with root motion translation'
