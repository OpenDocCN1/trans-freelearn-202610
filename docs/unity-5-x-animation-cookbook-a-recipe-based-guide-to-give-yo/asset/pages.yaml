- pgno: 196
  md: "```\n{\n    anim.SetTrigger(\"Dodge\");\n}\n```\n\n+   12. As always, the `anim`\
    \ variable stores the reference to the **Animator** component and is set in the\
    \ `Start()` function.\n+   13. Attach the script to the **Spider** character.\n\
    +   14. Play the game and press the space bar to see the **Spider** play the dodge\
    \ animation. It should be able to get out of the **Humanoid** character's attack\
    \ range and avoid being hit.\n\n# How it works...\n\nThis recipe uses a very simple,\
    \ yet powerful concept. The only additional thing we do here is triggering the\
    \ **Dodge** animation. This animation uses root motion and translates our **Spider**\
    \ character. Our **Humanoid** character uses the **Attack Animation Event** and\
    \ the **TargetTrigger** to check if an enemy is in its attack range (see the *Using\
    \ Animation Events to trigger script functions* recipe for details). If our **Spider**\
    \ leaves the **TargetTrigger** before the **Attack** event occurs, it will avoid\
    \ being hit.\n\n# There's more...\n\nThe Dodge animation will also work for other\
    \ hit detection mechanisms. For instance, you can manually check the range and\
    \ attack angle in the **Attack** event using the `Vector3.Distance()` and `Vector3.Angle()`\
    \ methods. You can also use a **Rigidbody** component on the sword and check its\
    \ collisions with the `void OnCollisionEnter(Collision collision)` method. In\
    \ both cases, our **Dodge** move will work just fine. It will also work for bullets\
    \ that use collisions to determine hits (for example, arrows).\n\nYou can use\
    \ the same concept for other actions: dashes, combos, and some crazy melee attacks\
    \ that use root translation and/or rotation (for instance, jump attacks). Root\
    \ motion is a very powerful tool for combat design. Try experimenting with your\
    \ own animation ideas to create interesting moves and actions."
