- pgno: 233
  md: '# Using wind emitters to create motion for foliage and particle systems


    Unity supports wind emitters with which we can create realistic effects for foliage
    and particles. Using them is really simple.


    # Getting ready


    To follow this recipe, you need to have a particle system and a tree created with
    Unity''s built—in **Tree Creator**. You can open the provided example project
    and go to the `Chapter 07 Special effects\Recipe 06 Using wind emitters to create
    motion for foliage and particle systems` directory. In the `Example.unity` scene
    there, you can find a tree and a simple particle system (falling leaves). Play
    the game to see the tree and particles moving with the wind.


    ![](img/616a75b593bef4212f618360fceea442_233_0.png)


    Tree with a falling leaves particle system. Both animated with a WindZone


    # How to do it...


    To use Unity''s wind, follow these steps:


    +   1. Place the tree and the particle system in the scene.

    +   2. Create a new **WindZone**. To do so, go to the **GameObject** | **3D Object**
    | **Wind Zone** option.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '+   3. The tree will move when you play the game, but the particle system needs
    to be adjusted.

    +   4. To make the particle system react to wind, open its properties and check
    the **External Forces** option.

    +   5. Click on it to unfold it. You can edit the **Multiplier** field to increase
    or decrease the influence of the wind.

    +   6. If you''re not sure whether your particles react to wind, set their **Start
    Speed** to 0.

    +   7. Play the game to see the effect.


    # How it works...


    Wind Zones are a built—in Unity feature, useful for animating foliage and particle
    systems. There are two types of Wind Zone:


    +   - **Directional**: This is a global wind for the whole scene (still you can
    have several of them). It blows in one direction.

    +   - **Spherical**: This type has a **Radius** in which it influences particles
    and trees. It''s useful for helicopters and explosions.


    Wind Zones are described by a series of parameters defining the strength of the
    wind:


    +   - **Main**: This is the main wind force. It changes softly over time.

    +   - **Turbulence**: This produces a rapidly changing force and is useful for
    creating storms.

    +   - **Pulse Magnitude**: This describes how much the wind changes over time.

    +   - **Pulse Frequency**: This describes the frequency of the wind changes.


    ![](img/616a75b593bef4212f618360fceea442_234_0.png)


    Remember that you can animate the Wind Zone''s parameters with the **Animation**
    View. This gives you a great amount of control over how the wind should change
    in time. For instance, you can create a strong, spherical wind for explosions
    with an animation of the **Main** and **Turbulence** parameters quickly fading
    out. You can also animate the Wind Zone rotation and/or position (applicable only
    to the Spherical type) to change the effect.'
  merge: -1
  img_proc: true
