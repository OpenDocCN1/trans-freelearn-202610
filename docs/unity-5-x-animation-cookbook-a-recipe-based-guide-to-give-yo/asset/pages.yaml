    \ We also use a simple timer to introduce time into our formula. We have two timers:\
    \ timerY and timerZ. The first one works for the Y position values and the second\
    \ one for Z position values. We also have the public float variables for controlling\
    \ frequencyY, frequencyZ, amplitudeY, and amplitudeZ. The X positions of the line\
