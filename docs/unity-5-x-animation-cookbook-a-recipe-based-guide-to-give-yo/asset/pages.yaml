    in this recipe. You can also use the provided example Unity project and go to
    the `Chapter 06 Handling combat\Recipe 10 Detecting the hit location on a character`
    directory. You will find an `Example.unity` scene there, with a **Humanoid** character.
    Play the game to see the effect.


    # How to do it...


    To be able to detect hits for different body parts, follow these steps:


    +   1. Import your character with all the necessary animations to Unity. Place
    it on the scene.'
