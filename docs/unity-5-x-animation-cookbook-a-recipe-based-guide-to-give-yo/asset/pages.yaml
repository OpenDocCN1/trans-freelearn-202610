- pgno: 4
  md: '# About the Author


    **Maciej Szcześnik** is an experienced game designer and Unity developer, specializing
    in gameplay and combat mechanics. His daily responsibilities include motion capture
    session planning and coordination, creating animation graphs and state machines,
    and AI design and implementation.


    He started his professional career in 2004 at CD Projekt RED—the company best
    known for the critically acclaimed The Witcher series. Maciej had key roles in
    the Witcher games, being lead gameplay designer and lead combat designer. He also
    worked at 11 bit studios, another well-known Polish game development company,
    famous for the This War Of Mine game.


    Maciej gave three talks at the Game Developers Conference and Game Developers
    Conference Europe. He is also a lecturer at Warsaw Film School, teaching Unity
    and technical aspects of animation as part of the game development BA course.


    *I’d like to thank my wife for her support, Kacper Kwiatkowski and Grzegorz Mazur
    from Vile Monarch for their reviews, Marek Ziemak and Piotr Tomsinski for inspiring
    discussions about games and animations, and Michał Pieńkowski and Marcin Iwanek
    for countless RPG and tabletop game sessions. I’d also like to thank all my friends
    and former coworkers from 11 bit studios and CD Projekt RED for helping me develop
    my skills.*'
  merge: -1
  img_proc: true
- pgno: 5
  md: '# About the Reviewer


    **Grzegorz Mazur** is a programmer who graduated in information technology from
    Warsaw University of Technology. He is currently co-boss and technical director
    at Vile Monarch. Previously, he worked for 11 bit studios, where he was lead programmer
    of This War of Mine and Sleepwalker''s Journey. He specializes in gameplay and
    AI programming and is a teacher at Warsaw Film School. He is also an amateur musician
    and board game enthusiast.'
