- pgno: 119
  md: '# How it works...


    This recipe has a few key elements that make it work:


    +   - **Button Animator Controller**: When you click on the **Auto Generate Animation**
    button, not only the Animation Clips are created, but also an Animator Controller
    is. It is also automatically assigned to the button (along with an Animator component).
    All the transitions between animation states in the Animator Controller are also
    already set up. Unity also creates parameters in the Animator Controller for you-those
    are the `Trigger` parameters used for transitions between the button states.

    +   - **Calling the Triggers**: You can find four properties in the Button component:
    **Normal Trigger**, **Highlighted Trigger**, **Pressed Trigger**, and **DisabledTrigger**.
    Unity will try to call those triggers in the Button''s Animator Controller to
    transition to a proper button state. If you change the `Trigger` names in the
    Animator Controller, make sure to change them also in the **Button** component.


    # There''s more...


    You don''t have to make one frame animations for button states. In fact, your
    animations can be as long and complex as you please. Remember that you can also
    add child objects to your buttons and animate them the same way we did in the
    *Exporting a 2D sprite animation from a 3D package* recipe. Try experimenting!
    You can achieve awesome results with this simple system.'
  merge: -1
  img_proc: true
