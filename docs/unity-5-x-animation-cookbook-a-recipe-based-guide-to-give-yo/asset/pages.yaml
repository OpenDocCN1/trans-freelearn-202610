- pgno: 140
  md: '# How it works...


    There are a few key elements of this recipe:


    +   - **Animation Curves**: You can add curves to your animations (multiple curves
    per animation clip) in the **Import Settings**, **Animation** tab. Curves assign
    arbitrary float values to the animation frames. If the name of the curve is the
    same as the name of a parameter in the Animator Controller, the value of the parameter
    will be set to the value of the curve in any given frame of the animation.

    +   - **Using curve values**: We are using the **ToIdle** value set by the **Animation
    Curves** in the **WalkForward**, **WalkLeft**, and **WalkRight** animations to
    trigger the transition from **Steering** to **Idle** (when the **ToIdle** value
    is less than 0.5) or from **Steering** to **ToIdle** animation (when the **ToIdle**
    parameter is greater than 0.5). This allows us to control the state transitions
    in the Animator Controller depending on the poses in the animations.


    # There''s more...


    We''ve covered the most simple (yet most visible) case in this recipe. You can
    add more stop animations (or any transition animations) from different walk and
    run poses. You may need to add a stop animation for walk and run passing poses
    and for all the extremes, depending on your Idle pose. To do so, add more curves
    to your animations and react to them in the Animator Controller. For instance,
    you may have curves for `LeftFootExtreme`, `RightFootExtreme`, `LeftFootPassing`,
    and `RightFootPassing`; use them in your **Walk** and **Run** animations to trigger
    appropriate stop animations.


    You can also check the value of an **Animation Curve** in runtime by checking
    the corresponding parameter value of the Animator Controller in scripts. To do
    so, use the `animator.GetFloat()` method, where `animator` is the reference to
    the Animator component.


    # Using root motion for a 180 degrees turn


    In the previous recipe, we''ve added a stop animation for a better transition
    to the idle state. We can add even more animations to our movement to make it
    more accurate and responsive. An example of such animation is a 180-degree turn.'
  merge: -1
  img_proc: true
