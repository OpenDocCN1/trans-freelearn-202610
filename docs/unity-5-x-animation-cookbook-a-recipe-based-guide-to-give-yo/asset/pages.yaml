- pgno: 103
  md: '# How it works...


    Creating a 2D doll animation uses the same concept as shown in the Using the Hierarchy
    to animate local rotation – creating an orbiting planet recipe in Chapter 2, Working
    with the Animation View. The key element of this recipe is the Warrior root game
    object containing all the body parts of our character as children game objects.
    When we select this object and open the Animation View, we can animate all its
    children game objects. The saved Animation Clip will be used by the Warrior game
    object''s Animator Controller. That allows us to create complex hierarchical animations
    (such as this one) and save them as single Animation Clips.


    # Using the Animator Controller to play sprite animations


    In this recipe, we will create an Animator Controller to play 2D animations of
    a character. Unity''s animation system is using the same principles for both 2D
    and 3D animation clips, which makes it quite intuitive to use.


    # Getting ready


    First, you should have at least two sprite animations (or 2D sprite doll animations)
    ready. You can also go to the Chapter 03 2D and user interface animation\Recipe
    04 Using the animator controller to play sprite animations directory and open
    the Example.unity scene. You will find an already animated Warrior game object
    there. If you play the game, you can use the arrow keys (left and right) to move
    the character. It will play 2D animations accordingly.


    # How to do it...


    To create an Animator Controller for 2D animation, follow these steps:


    +   1. Import your 2D sprite sheets to Unity the same way as in the Exporting
    a 2D sprite animation from a 3D package recipe.

    +   2. Drag and drop one of the child sprites (not sprite sheets) into the Hierarchy.

    +   3. Select the sprite game object and give it an appropriate name (it is named
    Warrior in this example).'
  merge: -1
  img_proc: true
- pgno: 104
  md: '+   4. With the **Warrior** game object selected, go to **Window** | **Animation**
    to open the **Animation** View.

    +   5. Create the required Animation Clips using the **Animation** View (the same
    way as in the *Creating a frame-by-frame sprite animation with the Animation View
    recipe*). In this example, we use two animations: **Warrior2dIdle** and **Warrior2dWalk**.

    +   6. An Animator Controller will be automatically created and assigned to the
    Animator component on the **Warrior** game object.

    +   7. Open the created Animator Controller (you can easily do it by selecting
    the **Warrior** game object in the **Hierarchy** and going to **Window** | **Animator**).

    +   8. Create a new `float` parameter in the Animator Controller and name it Speed.
    We will use it for controlling the animation flow.

    +   9. Create two transitions: from **Warrior2dIdle** to **Warrior2dWalk** and
    from **Warrior2dWalk** to **Warrior2dIdle**. The first one should have a condition
    of Speed greater than 0.1 and the second should have a condition of **Speed**
    less than 0.1. See the following screenshot:


    ![](img/616a75b593bef4212f618360fceea442_104_0.png)


    10. Set the **Has Exit Time** to false and the **Transition Duration** to 0 in
    both transitions (you cannot blend frame by frame sprite animations).'
  merge: -1
  img_proc: true
- pgno: 105
  md: '11. Write a script to set the **Speed** parameter based on the player input.
    You can also find and use the `Warrior2dMove.cs` script in the provided Unity
    project in the `Scripts` directory of this recipe.


    12. In this script''s `Update()` function, we take the `Horizontal` axis as the
    input. Then we set the **Speed** variable to be the absolute value of the input
    because in our Animator Controller, we check only if it''s greater or less than
    0.1, and the `Horizontal` axis can have values between -1 and 1. We use the `speed`
    variable to set the **Speed** parameter in our Animator Controller. The `animator`
    variable holds reference to the Animator component on the same game object (we
    set this reference in the `Start()` function):


    ```

    hor = Input.GetAxis("Horizontal");

    speed = Mathf.Abs(hor);

    animator.SetFloat("Speed", speed);

    ```


    13. This will make the character play the **Warrior2dWalk** animation when the
    user presses the left or right arrow on the keyboard and **Warrior2dIdle** animation
    when player is not pressing any button.


    # How it works...


    There are a few key elements of this recipe:


    +   - **Animator Controller for 2D animations**: Controlling 2D animations playback
    works very similar to 3D and skeletal animations in Unity. You can create Animator
    Controllers as usual, with all required states and transitions between them.

    +   - **Transition Duration set to 0**: The **Transition Duration** parameter
    only makes sense with animations that can be blended together to create a smooth
    transition. In 2D frame by frame animation, this is not possible (Unity cannot
    create “in between sprites” automatically). This is the reason to set the parameter
    to 0 and have a sharp, immediate transition. In case of the parameter value being
    greater than 0, the transition will still look sharp but also be delayed.'
  merge: -1
  img_proc: true
- pgno: 106
  md: "# There's more...\n\nWe have used a simple trick in our Warrior2dMove.cs script\
    \ to lower the number of required animations. Our character can move left and\
    \ right, but we use only one animation: Warrior2dWalk (in which the character\
    \ is moving right). In the script's Update() function, we check if the player\
    \ Horizontal axis input is greater than 0 or less than 0 and set the local X scale\
    \ of the character to 1 or -1, depending on the movement direction. This flips\
    \ the character and saves us around 50 percent of the animations:\n\n```\nif (hor\
    \ > 0f)\n{\n    transform.localScale = Vector3.one;\n}\nelse if (hor < 0f)\n{\n\
    \    transform.localScale = new Vector3(-1f, 1f, 1f);\n}\n```\n\n# Creating a\
    \ fade out – fade in transition with the Animation View\n\nEvery game has some\
    \ sort of fade in/fade out transitions: between the levels, or when you enter\
    \ a dialog or a cutscene, and so on. In Unity, we can create such transitions\
    \ very easily using the Animation View.\n\n# Getting ready\n\nYou don't have to\
    \ prepare anything for this recipe; everything is created in Unity from scratch.\
    \ You can open the provided example Unity project and go to the Chapter 03 2D\
    \ and user interface animation\\Recipe 05 Creating a fade out - fade in transition\
    \ with the animation view directory. You will find an Example.unity scene there.\
    \ Play the game and press the space bar to see the fade in/fade out effect."
  merge: -1
