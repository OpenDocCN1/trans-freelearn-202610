- pgno: 305
  md: '# How it works...


    We are using Unity''s `Transform.Rotate()` function in this recipe. It allows
    rotating a transform around any given axis. It rotates the object the number of
    degrees we set as the function''s parameter. We are using `Time.deltaTime` to
    rotate the object X degrees per second. This function also has the `space` parameter,
    which lets us make a rotation in world or local space. The rest is handled by
    the hierarchy setup (**WindmillWings** being parented to the **Windmill** game
    object).


    Using this method can save us a lot of time tweaking animations for simple rotating
    objects. What''s more, we can still use **Animation** View to create an animation
    of the `public float rotationSpeed` parameter of our script. This way we can control
    the changes of rotation speed with a very simple animation clip, instead of animating
    the whole transform.


    # There''s more...


    Unity has also a `Transform.Translate()` function, which has the same parameters
    as the `Transform.Rotate()` method but moves our game object instead of rotating
    it. We can use it to create a similar script and move our object in the scene.


    # Preparing motion capture files for humanoid characters


    Using motion capture files is not always easy. In most cases, we can use them
    directly (after exporting them to an **FBX** file) for characters using the **Generic**
    rig type. But we almost always want to use our motion capture files for humanoid
    characters. The problem occurs when our motion capture rig is not a standard Unity
    **Humanoid** rig (and again, it is almost always the case). We can expect all
    kinds of errors—bones rotating with an offset, deformations in the mesh, and so
    on.


    This recipe shows how to retarget motion capture files onto a rig suitable for
    Unity humanoid animations. We are going to use Blender 3D.'
  merge: -1
  img_proc: true
- pgno: 306
  md: '# Getting ready


    To follow this recipe, you will need a humanoid character ready to be rigged to
    a proper Unity **Humanoid** rig. We also need a motion capture animation. You
    can find a huge free-to-use library of motion capture data on the Carnegie Mellon
    University''s website at `http://mocap.cs.cmu.edu/`. We are going to use the `01_01.bvh`
    file in this example.


    You can also download the example Unity project provided and go to the `Chapter
    10 Miscellaneous\Recipe 04 Preparing motion capture files for humanoid characters`
    directory. You can find the `Example.unity` scene there. If you play the game,
    you will see a character playing a retargeted motion capture animation. You can
    find the BVH file in the `Raw data` directory. The final FBX file is in the `Final
    FBX` directory, and all the `blend` files are located in the `Blend Files` directory.


    # How to do it...


    To use motion capture data for Humanoid characters, follow these steps:


    +   1. First we need to create a rig suitable for Unity''s Humanoid characters.
    In Blender, creating such a rig is quite easy. First enable the **Rigify** add-on
    and create a new **Human (metarig)** object from the **Armature** section.

    +   2. This rig has almost the same structure as Unity''s Humanoid rig, but we
    need to adjust a few things. First, edit the rig and delete the **heel.L**, **heel.R**,
    **heel.02.L**, and **heel.02.R** bones from the feet.

    +   3. Then delete the **palm.01.L**, **palm.02.L**, **palm.03.L**, **palm.04.L**,
    **palm.01.R**, **palm.02.R**, **palm.03.R**, and **palm.04.R** bones from the
    hands.

    +   4. This gives us a proper Unity Humanoid rig. We can also adjust the T-Pose
    (a **Rigify** rig is created in a more relaxed T-Pose). This step is not a necessity.
    Name that rig `FinalRig`.

    +   5. Now adjust the bone sizes for your character and skin the character to
    the rig.

    +   6. Enter **Pose Mode** and click on both shoulders. Enable their *Y* axis
    rotation (it is locked by default). This step is important for making the final
    animation.

    +   7. Import your BVH file (**File | Import | BVH**). You may want to adjust
    the size of the rig in import settings.

    +   8. Scale the imported BVH rig to roughly match the size of your character.
    Name the BVH rig **ImportedRig** for better clarity.'
