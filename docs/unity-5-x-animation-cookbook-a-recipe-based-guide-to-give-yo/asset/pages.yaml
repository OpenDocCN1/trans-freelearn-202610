  md: '# Creating an elevator triggered by player input


    In this last recipe, we will use player input to create a simple elevator.


    # Getting ready


    Before we start, you should prepare an elevator model to contain the objects:
    the root object called **Elevator**, the **Lift** object (this one will be animated),
    and the **ElevatorFrame** object, which will work as decoration. The **Lift**
    and **ElevatorFrame** objects should be children of the empty **Elevator** object.
    You can also use the example Unity project provided and go to the `Chapter 02
    Working with the animation view\Recipe 07 Creating an elevator triggered by player
    input` directory. You will find an `Example.unity` scene there with the **Elevator**
    game object and its children **Lift** and **ElevatorFrame** objects. The **Elevator**
    is already animated in the example assets.


    # How to do it...


    To create an elevator triggered by player input, follow these steps:


    +   1. Select the root **Elevator** object and assign an Animator component to
    it. Set the **Update Mode** to **Animate Physics**.

    +   2. Open **Window | Animation** and create a new Animation Clip by clicking
    on the **Create** button. Call it **ElevatorGoingDown**.

    +   3. Make sure the record button is pressed (in the upper-left corner of the
    **Animation View**).

    +   4. Select your **Lift** game object and move it to the up position.

    +   5. Adjust the timeline a few seconds forward and move the **Lift** game object
    to the down position. Your **Lift** game object should animate going from the
    maximum up position to the minimum down position.

    +   6. Create another Animation Clip by selecting the **Create New Clip** option
    from the animations drop-down list (you can find it below the playback buttons).
    Call it **ElevatorGoingUp**.

    +   7. Animate your **Lift** game object to go from the down position to the up
    position.

    +   8. Create another Animation Clip and call it **ElevatorDown**. Create a one-second
    looping animation for the **Lift** game object in the down position.'
