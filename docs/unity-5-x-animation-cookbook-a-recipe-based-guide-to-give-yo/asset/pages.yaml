  md: '# There''s more...


    You may also use the `MatchTarget()` function to interpolate the character''s
    position and rotation and match it with the **Action Point**. We were using this
    technique in the *Adding animation to off-mesh links* recipe in *Chapter 4, Character
    Movement*. In such cases, it would be best to have a special approach animation
    in which the character approaches the **Action Point**.


    You may also want to use the randomized actions concept for creating **Action
    Points** with random actions. The concept is described in the *Using Blend Trees
    to create randomized actions* recipe. Instead of creating random actions, you
    can also prepare a `public enum Action` variable containing all your actions as
    enumerations and a public variable to store the Action in the Actionable Action
    `actionPointAction` variable to store the Action in the **Action Point**. Then
    you need to set the **RandomAction** parameter (as described in the mentioned
    recipe) to the `(float) actionPointAction` value. This will allow you to use **Blend
    Trees** for performing specified actions (instead of random ones).


    Also, in many cases, you will need to divide your actions into three steps:


    +   - **Pre-Action:** This animation can be used to approach the **Action Point**
    or as a "state transition" animation. For instance, when we want our character
    to sit on a chair it is good to have a **Pre-Action** animation of the character
    sitting (transition from **Idle** to **Sitting** states).

    +   - **Looped-Action:** A looped animation suitable for this Action Point. In
    our sitting example, that would be a looped sitting animation. It can also be
    a series of animations (our character can, for instance, sit and eat or sit and
    drink).

    +   - **Post-Action:** This is an animation that transitions from the **Looped-Action**
    animation to the **Idle** animation. In our example, it would be a character getting
    up from the chair.


