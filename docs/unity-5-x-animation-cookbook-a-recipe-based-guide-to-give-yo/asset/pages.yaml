    You may remove the **Mesh Renderer** component from the object.

    +   4. Find the mesh of the **Flag** and drag it to the **Mesh** field in the
    **Skinned Mesh Renderer** component. If your game object still has the **Mesh
    Filter** component, you may click on the mesh attached to it and it will be displayed
    in the **Project View**. This makes it easier to find the mesh we need.

    +   5. If your game object still has the **Mesh Filter** component attached, you
    can remove it.

    +   6. You may need to add a material to the **Flag** game object. If it lacks
    the material, drag appropriate materials into the **Materials** section in the
    **Skinned Mesh Renderer**.

    +   7. Go to the Cloth component settings in the **Inspector** and click on the
    **Edit Constraints** button, as shown in the following screenshot:

    +   8. The **Cloth Constraints** window will appear, as shown in the following
    screenshot:


    ![](img/616a75b593bef4212f618360fceea442_266_0.png)


    Edit Constraints button


    ![](img/616a75b593bef4212f618360fceea442_266_1.png)


    Editing constraints'
  merge: -1
