    \ Time.time;\n    anim.applyRootMotion = false;\n    onGround = false;\n    rb.AddForce(Vector3.up*\
    \ jumpForceUp +\ntransform.forward * jumpForceForward, ForceMode.Impulse);\n \
    \   anim.SetTrigger(\"Jump\");\n}\nGroundCheck();\n```\n\n9. The `anim` variable\
    \ stores the reference to the Animator component. The `rb` variable stores the\
    \ reference to the **Rigidbody** component. Both variables are set in the `Start()`\
