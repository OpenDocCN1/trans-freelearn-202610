  \n20. 进入 **Pose Mode**。\n21. 选择 **shin.L** 骨骼并添加一个 **Inverse Kinematics** 约束。将 **Chain\
  \ Length** 设置为 2，并选择 **FinalRig** 作为 **Target**，**footTarget.L** 作为 **Bone**。\n\
  22. 选择 **foot.L** 骨骼并为其添加 **Copy Rotation** 约束。选择 **FinalRig** 作为 **Target**，**footTarget.L**\
  \ 作为 **Bone**。\n23. 对右腿重复步骤 21 和 22。\n24. 选择 **hips** 骨骼并为其添加 **Copy Rotation**\
  \ 和 **Copy Location** 约束。在两个约束中，均将 **Target** 设置为 **HipsTarget** 空对象。\n25. 在 **Copy\
  \ Location** 约束中选择 **Offset** 选项，并在 **Pose Mode** 中移动 **hips** 骨骼，使其大致匹配场景中 **HipsTarget**\
  \ 空对象的位置。\n26. 选择 **footTarget.L** 骨骼。为其添加 **Copy Location** 和 **Copy Rotation**\
  \ 约束。在两个约束中，均选择 **FootTarget.L** 空对象作为 **Target**。\n27. 在 **Copy Location** 约束中选择\
  \ **Offset** 选项，并在 **Pose Mode** 中移动 **footTarget.L** 骨骼，使其大致匹配场景中 **footTarget.L**\
  \ 空对象的位置。\n28. 对右脚目标重复步骤 26 和 27。\n29. 为每个其他骨骼（包括具有 **Inverse Kinematics** 约束的骨骼）添加一个\
  \ **Copy Rotation** 约束。将每个此类约束的 **Target** 设置为相应的空对象（对于 **shin.L** 骨骼，选择 **LegTarget.L**\
  \ 空对象，以此类推）。\n30. 你应该会看到 **ImportRig** 的运动被转移到 **FinalRig**。此外，你可以移动 **hips** 骨骼以及\
  \ **footTarget.L** 和 **footTarget.R** 骨骼来调整动画。\n31. 如果网格上出现任何错误，尤其是角色的四肢以奇怪的方式旋转，你可以旋转目标空对象来修复此问题。\n\
  32. 你也可以旋转目标空对象来轻松更改角色的整体姿势。\n33. 要完成重定向过程，请将文件另存为新文件。在 **Pose Mode** 中选择 **FinalRig**\
  \ 中的所有骨骼，按空格键，输入 **Bake Action**，然后按 *Enter*。\n34. 在 **Bake Action** 窗口中，选择 **Visual\
