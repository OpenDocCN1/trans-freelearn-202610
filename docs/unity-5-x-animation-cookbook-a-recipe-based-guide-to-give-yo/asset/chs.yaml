- "## 5 角色动作和表情\n\n本章解释了角色动作和表情动画的使用方法，并涵盖了以下教程：\n\n- 创建出现或消失动画\n- 创建具有动画驱动行为的背景角色和小动物\n\
  - 使用 **Blend Trees** 创建随机动作\n- 使用 `Quaternion.LookRotation()` 和 `Animator.SetLookAtPosition()`\
  \ 方法使角色用视线跟随物体\n- Action Points – 在指定位置执行动作\n- 将动画与场景中的对象同步\n- 使用 IK 与场景对象交互\n-\
  \ 使用 Blend Shapes 动画化面部表情\n\n## 简介\n\n在大多数游戏中，角色会执行各种动作和表情。本章解释了如何使用动画来创建逼真的行为和交互。\n\
  \n## 创建出现或消失动画\n\n如果我们的游戏中有怪物，那么我们很可能需要使用出现或消失动画来在场景中引入这些角色。经常情况下，怪物会在玩家附近生成以伏击他们。这时出现动画就派上用场了。\n\
  \n## 准备工作\n\n开始之前，你应该有一个至少包含两种动画的角色：循环的 **Idle** 动画和一个 **Appear** 动画。此动画应从地面下方开始（如果你的角色是飞行类型的，则在空中高处）。它应以\
  \ **Idle** 姿势结束。参考下图：\n\n![](img/616a75b593bef4212f618360fceea442_157_0.png)\n\n\
  出现动画关键帧（动画是“原地”完成的）\n\n你可以下载提供的示例；在 Unity 中打开项目并进入 `Chapter 05 Character actions\
  \ and expressions\\Recipe 01 Creating an appear or disappear animation` 文件夹。你会在那里找到一个名为\
  \ `Example.Scene` 的场景。播放时，一个 Spider 角色将被生成（实例化）并播放 **Appear** 动画。在 `Rigs` 目录中，你可以找到包含所需动画的\
  \ `Spider.fbx` 资源。\n\n## 如何操作...\n\n要创建出现动画，请按照以下步骤操作：\n\n1. 导入带有 **Idle** 和 **Appear**\
  \ 动画的动画角色。\n2. 确保勾选 **Idle** 动画的 **Loop Time** 选项。\n3. 将导入的角色放置在场景中。\n4. 创建一个新的\
  \ Animator Controller 并将其命名为 `Appear`（或者你可以编辑现有的控制器）。\n5. 将你的 **Appear** 动画拖放到控制器中并确保它是默认状态。如果不是，右键单击它并选择\
  \ **Set As Layer Default State** 选项。\n6. 将你的 **Idle** 动画拖放到控制器中。\n7. 创建一个过渡：\n \
  \  - **Appear** | **Idle** 无条件过渡：**Has Exit Time** 应设置为 true，**Transition Duration**\
  \ 设置为 0.2 秒。\n8. 将 Animator Controller 分配给场景中站立的角色（分配到其 Animator 组件）。\n9. 为了更好地看到\
  \ **Appear** 动画的效果，从角色创建一个预制体。为此，将其从 **Hierarchy** 拖放到 **Project** 视图中的任意文件夹。\n\
  10. 从 **Hierarchy** 中删除角色并编写一个脚本在运行时生成（实例化）角色。在本教程中，我们使用示例 Unity 项目 `Shared Scripts`\
  \ 目录中的 `Spawner.cs` 脚本。\n11. 此脚本在与 **Spawner** 游戏对象（`Spawner.cs` 脚本附加到的对象）相同的位置和旋转下生成预制体（预制体列表）。\n\
  \n## 原理...\n\n我们在这里使用一个非常简单的机制——当 Unity 实例化一个动画游戏对象时，它总是播放该游戏对象的默认动画状态。因此，当我们将 **Appear**\
  \ 动画设置为默认状态时，角色被生成（实例化）时就会播放它。这样我们就可以创建有趣的动画，使角色出现在玩家附近。在此示例中，我们的角色从地面爬出。\n\n##\
  \ 还有更多...\n\n为了使效果完整，你还应为角色添加一个生成 VFX。你可以在提供的 Unity 项目的 `Prefabs` 目录中找到一个示例：名为 **RocksEffect**\
  \ 的粒子系统预制体。这是一个“挖掘出土”效果。我们使用相同的 `Spawner.cs` 脚本生成它。此外，此预制体还有一个 `AutoDestroy.cs`\
  \ 脚本，可在几秒后销毁生成的特效。\n\n## 创建具有动画驱动行为的背景角色和小动物\n\n在本教程中，我们将创建动画角色作为游戏中的装饰物。此类角色的行为仅由动画驱动；因此，我们可以在游戏中放置相当多的此类角色。\n\
  \n## 准备工作\n\n开始之前，我们需要一个具有几种动画的角色。在此示例中，我们使用一只鸟。它具有 **Idle**、**StartFlying**、**FlyingInCircles**\
  \ 和 **Land** 动画。**Idle** 动画是循环的，当我们的鸟坐在地面上时播放。**StartFlying** 动画是 **Idle** 和 **FlyingInCircles**\
  \ 之间的过渡，后者是鸟飞行的循环动画。最后一个动画 **Land** 动画是 **FlyingInCircles** 和 **Idle** 之间的过渡。我们不为这些动画使用\
  \ root motion，因为我们希望鸟总是落在同一位置（我们不想检查地面在哪里，这只是装饰）。\n\n你也可以下载提供的示例 Unity 项目并进入 `Chapter\
  \ 05 Character actions and expressions\\Recipe 02 Creating background characters\
  \ and critters with animation driven behavior` 目录。你会在那里找到一个名为 `Example.scene` 的场景，其中有一些鸟在周围坐着。按下空格键，鸟会开始飞行。再按一次，它们会降落。在\
  \ `Rigs` 目录中，你可以找到具有所有所需动画的 `Bird.fbx` 角色。\n\n\n\n## 如何操作...\n\n要创建具有动画驱动行为的轻量级背景角色，请按照以下步骤操作：\n\
  \n- 1. 将你的角色（一只带有 **Idle**、**StartFlying**、**FlyingInCircles** 和 **Land** 动画的鸟）导入\
  \ Unity。\n- 2. 创建一个新的 Animator Controller。\n- 3. 将 **Idle**、**StartFlying**、**FlyingInCircles**\
  \ 和 **Land** 动画拖放到控制器中。\n- 4. 创建一个 `bool` **Fly** 参数。我们稍后将使用它来让鸟开始飞行。\n- 5. 创建四个过渡：\n\
  \  - **Idle** | **StartFlying** 条件为：**Fly** 参数应设为 true，**Has Exit Time** 设为 false，**Transition\
  \ Duration** 设为 0.2 秒。\n  - **StartFlying** | **FlyingInCircles** 无条件：**Has Exit\
  \ Time** 应设为 true，**Transition Duration** 设为 0.2 秒。\n  - **FlyingInCircles** | **Land**\
  \ 有一个条件：**Fly** 参数应设为 false，**Has Exit Time** 设为 true，**Transition Duration** 设为\
  \ 0.2 秒。在这种情况下我们需要将 **Has Exit Time** 设为 true，因为我们的 **Land** 动画从 **FlyingInCircles**\
  \ 动画的最后一帧开始。\n  - **Land** | **Idle** 无条件：**Has Exit Time** 设为 true，**Transition\
  \ Duration** 设为 0.2 秒。\n- 6. 将我们的角色放置在场景中，并将其控制器分配给其 Animator 组件。\n- 7. 为角色添加一个\
  \ `Bird` 标签。我们将在下面的脚本中使用该标签。\n- 8. 创建一个新脚本并将其命名为 `FlockDecoration.cs`。\n- 9. 在此脚本中，我们首先查找所有带有\
  \ `Bird` 标签的游戏对象并将它们存储在 `GameObject[] birds` 数组中。我们在 `Start()` 函数中执行此操作。在 `Update()`\
  \ 函数中，当玩家按下空格键时，我们将控制器中的 `bool` **Fly** 参数设置为其反转值（如果为 true，则设为 false，反之亦然）。我们对存储在\
  \ `birds` 数组中的每只鸟都执行此操作：\n\n```\nfor (int i = 0; i < birds.Length; i++)\n{\n   \
  \ Animator anim = birds[i].GetComponent<Animator>();\n    anim.SetBool(\"Fly\",\
  \ !anim.GetBool(\"Fly\"));\n}\n```\n\n- 10. 将脚本分配给场景中的一个空游戏对象。播放游戏并按下空格键以查看效果。你也可以多次复制\
  \ Bird 游戏对象。\n\n## 其工作原理...\n\n本配方使用 Animator Controller 为角色创建状态。我们的鸟可以站在地面上也可以飞行。我们还在这两个循环状态之间拥有过渡动画，以便让鸟起飞或着陆。通过这种简单的设置，我们可以创建会对玩家做出反应的鸟。例如，当玩家靠近时开始飞行，当玩家走开时着陆。本配方的目的是展示我们仅用动画（以及一个调用动画的脚本）就能创建有趣的行为。没有脚本且没有附加刚体的动画游戏对象在\
  \ Unity 中非常轻量。这使我们能够将它们用作有趣的装饰。\n\n## 还有更多...\n\n在 `FlockDecoration.cs` 脚本中，我们还尝试使鸟的动画不同步。我们在\
  \ `Start()` 函数中对每只鸟执行此操作，通过将其 Animator 中的 speed 变量设置为随机数：\n\n```\nfor (int i = 0;\
  \ i < birds.Length; i++)\n{\n    Animator anim = birds[i].GetComponent<Animator>();\n\
  \    anim.speed = Random.Range(0.8f, 1.3f);\n}\n```\n\n这使得鸟以随机的播放速度播放动画。我们可以通过创建多个版本的\
  \ FlyingInCircles 和 Idle 动画来进一步随机化。然后我们需要随机选择当前播放的动画（请参阅下一个配方了解详情）。\n\n在我们 FBX 文件的导入设置中，在\
  \ Rig 选项卡中，我们还勾选了 Optimize Game Objects 选项。这使我们的骨骼层级（骨骼）在层级中不可见，并减少了 Unity 需要处理的游戏对象数量。\n\
  \n## 使用 Blend Trees 创建随机动作\n\n### 准备工作\n\n在开始之前，我们需要有一个角色，该角色至少有两个不同的动画以使随机化生效。在此示例中，我们使用一个带有\
  \ **Walk**、**Idle**、**Hurray**、**Wave** 和 **PickUp** 动画的角色。**Walk** 和 **Idle** 动画用作辅助。其他三个动画会被随机化。你也可以使用示例项目；前往\
  \ `Chapter 05 Character actions and expressions\\Recipe 03 Using blend trees to\
  \ create randomized actions` 目录。你可以在那里找到 `Example.scene` 场景，其中包含两个角色。你可以开始游戏以查看效果。两个角色在行走后应播放不同的动画。你可能需要多次启动游戏，因为我们只有三个动画可供选择，所以两个角色播放相同动画的概率为\
  \ 9%。在 `Rigs` 目录中，你可以找到所需的动画。\n\n![](img/616a75b593bef4212f618360fceea442_162_0.png)\n\
  \n具有随机动画的角色\n\n### 如何操作...\n\n要使用随机动画，请按照以下步骤操作：\n\n- 1. 导入你的角色及其可选动画。在我们的例子中，它们是\
  \ Hurray、Wave 和 PickUp。我们还使用 Idle 和 Walk 动画（Walk 动画在随机动作之前使用，Idle 动画在随机动作之后使用）。\n\
  - 2. 创建一个新的 Animator Controller（或编辑现有控制器）。\n- 3. 在控制器中创建一个新的 float 参数并将其命名为 Random。\n\
  - 4. 在控制器中创建一个新的 Blend Tree 并将其命名为 RandomAction。\n- 5. 在 Blend Tree 设置中，为你的随机动画添加\
  \ Motion Fields。在我们的示例中，我们有三个 Motion Fields（用于 Hurray、Wave 和 PickUp）。\n- 6. 将你的动画分配给\
  \ Motion Fields。\n- 7. 选择 Random 参数作为 Blend Tree 的 Parameter。\n- 8. 取消选中 Automate\
  \ Thresholds 选项。\n- 9. 将 Thresholds 设置为从 0 开始的整数。在我们的示例中，它们是 0、1 和 2。\n- 10. 退出\
  \ Blend Tree 设置。\n- 11. 在需要时创建到 Blend Tree 的过渡和从 Blend Tree 的过渡。在我们的示例中，我们有以下过渡：\n\
  \  - Walk | RandomAction 无条件：Has Exit Time 应设为 true，Transition Duration 设为 0.2 秒。我们的场景以角色播放一个\
  \ Walk 动画周期开始，然后过渡到 RandomAction Blend Tree。\n  - RandomAction | Idle 无条件：Has Exit\
  \ Time 应设为 true，Transition Duration 设为 0.2 秒。我们的场景以角色从 RandomAction 过渡到 Idle 动画结束。\n\
  - 12. 将角色放置在场景中。\n- 13. 将控制器分配给角色的 Animator 组件。\n- 14. 创建一个新脚本并将其命名为 RandomAction.cs。\n\
  - 15. 在此脚本的 Start() 函数中，我们创建一个整数随机值并将其设置为控制器中我们的 float Random 参数的值：\n\n```csharp\n\
  Animator anim = GetComponent<Animator>();\nint randomValue = Random.Range(0, numActions);\n\
  anim.SetFloat(\"Random\", (float)randomValue);\n```\n\n- 16. 在前面的脚本中，`numActions`\
  \ 是一个 `public int` 变量，用于存储我们 **Blend Tree** 中的随机动作总数（在我们的示例中为 3）。\n- 17. 将脚本分配给角色并播放游戏以查看效果。你可能需要多次启动游戏或复制多个角色。\n\
  \n### 其工作原理...\n\n这里的技巧是在过渡到 **Blend Tree** 之前先设置控制器中的 **Random** 参数。这样我们就不会看到动画的突然变化（动画在开始播放前已被选中）。\n\
  \n我们仍然在 **Blend Tree** 中使用 `float` 类型参数，因为在 Unity 中 **Blend Trees** 不能使用整数。\n\n\
  ### 还有更多...\n\n有时你需要一个接一个地播放多个随机动画，例如当你的角色站在原地并执行一些随机动作时。为了能够设置负责随机化动画的参数，你可能需要通过一个中性的\
  \ **Idle** 姿势进行过渡。在该状态下，你可以安全地设置参数值。请参阅以下图像：\n\n![](img/616a75b593bef4212f618360fceea442_164_0.png)\n\
  \n此外，如果你的随机动作融合得很好（也许它们是 **Idle** 动画的不同版本），你可以允许在已经处于 **Blend Tree** 时更改参数。为此，请确保使用\
  \ `SetFloat()` 函数并将 `dampTime` 参数设置为适当的值（0.5 应该可以，但你需要进行实验）。\n\n\n\n\n## 使用 Quaternion.LookRotation()\
  \ 和 Animator.SetLookAtPosition() 方法使角色注视物体\n\n有时你需要在游戏中让角色注视某个物体，例如摄像机。为此，我们可以使用两种方法：`Quaternion.LookRotation()`\
  \ 和 `Animator.SetLookAtPosition()`。在本教程中我们将介绍这两种方法（第二种在“更多内容…”部分介绍）。\n\n### 准备工作\n\
  \n要跟随本教程，你需要一个带有 `Idle` 动画的角色。你也可以前往 `Chapter 05 Character actions and expressions\\\
  Recipe 04 Using LookRotation and SetLookAtPosition methods to make characters follow\
  \ an object with their gaze` 目录。打开那里的 `Example.scene` 场景。你会在那里找到 `HumanoidLookAt`\
  \ 和 `HumanoidIKLookAt` 游戏对象。第一个使用通用的 `LookAt()` 方法，第二个使用 `Animator.SetLookAtPosition()`\
  \ 函数。要查看效果，请播放游戏，切换到 Scene View，并移动 `Target` 游戏对象（一个红色发亮的球体）。\n\n![](img/616a75b593bef4212f618360fceea442_165_0.png)\n\
  \n角色注视 Target 游戏对象\n\n### 如何操作...\n\n要使角色注视物体，请按照以下步骤操作：\n\n- 1. 将角色导入 Unity 并放置在场景中。\n\
  - 2. 确保创建了一个至少包含一个动画的 Animator Controller，或使用现有的控制器。\n- 3. 要使用第一个 Quaternion.LookRotation()\
  \ 方法，创建一个新脚本并将其命名为 CharacterLookAt.cs。\n- 4. 在该脚本中，我们使用 void LateUpdate() 函数在所有动画评估后更改骨骼旋转。在该函数中，我们首先检查\
  \ public float weight 变量是否小于或等于 0。如果是，我们不执行任何操作（关闭注视行为）：\n- 5. 如果不是这样，我们计算所需的 lookDirection。这是我们角色应注视的向量。我们通过将\
  \ public Transform bone 位置从 public Transform target 位置中减去来计算它。该向量随后使用 SmoothDamp()\
  \ 函数随时间进行阻尼。这可以防止其突然变化。我们使用 public float dampTime 变量来确定平滑该向量的时间。dampVelocity 向量是\
  \ SmoothDamp() 函数所需的类成员变量，用于存储 lookDirection 向量在帧之间的变化：\n- 6. 接下来我们检查所需 lookDirection\
  \ 向量与角色的 transform.forward 向量之间的角度是否大于 public float maxAngle 值。如果是，我们计算 finalLookVector。这是我们角色的\
  \ transform.forward 向量，其朝向所需 lookDirection 向量旋转 maxAngle 度。这样我们为角色创建了一个视野锥体，防止其折断颈部关节。我们需要使用\
  \ Mathf.Deg2Rad 常量将 maxAngle 度转换为弧度，因为 Vector3.RotateTowards() 函数使用弧度而不是度。如果 lookDirection\
  \ 与 transform.forward 之间的角度小于或等于 maxAngle，我们不更改 lookDirection：\n\n```\nif (weight\
  \ <= 0f)\n{\n    return;\n}\n```\n\n```\nlookDirection = Vector3.SmoothDamp(lookDirection,\n\
  \    target.position - bone.position, ref dampVelocity,\n    dampTime);\n```\n\n\
  ```\nif (Vector3.Angle(lookDirection, transform.forward) > maxAngle)\n{\n    finalLookVector\
  \ =\n    Vector3.RotateTowards(transform.forward,\n    lookDirection, Mathf.Deg2Rad*maxAngle,\
  \ 0.5f);\n}\nelse\n{\n    finalLookVector = lookDirection;\n}\n```\n\n- 7. 最后，我们使用\
  \ Quaternion.LookRotation() 方法计算 Quaternion 旋转值，并将其结果乘以 public Vector3 additionalRotation\
  \ 值。首先我们需要使用 Quaternion.Euler() 函数将此 Vector3 转换为 Quaternion。相乘两个四元数相当于添加一个额外的旋转。我们需要使用\
  \ additionalRotation 向量，因为在大多数情况下，头部骨骼的前向轴并不匹配角色的面部。通过在 X、Y 或 Z 轴之一上应用 +90 或 -90\
  \ 度的额外旋转，我们可以使脚本适用于每个骨架。计算旋转后，我们使用 weight 值将当前 bone.rotation 值线性插值到我们计算的旋转值。这样我们就可以轻松地打开和关闭注视：\n\
  \n```\nrotation = Quaternion.LookRotation(finalLookVector) * Quaternion.Euler(additionalRotation);\n\
  bone.rotation = Quaternion.Lerp(bone.rotation, rotation, weight);\n```\n\n- 8. 保存脚本并将其添加到角色。\n\
  - 9. 将角色的头部骨骼拖放到脚本 Inspector 中的 Bone 字段。\n- 10. 将注视目标 transform 拖放到脚本 Inspector\
  \ 中的 Target 字段。\n- 11. 你可能需要调整 Additional Rotation 字段。在 Play Mode 中尝试不同轴上的 +90 或\
  \ -90 值以找到匹配的值。一次修改一个轴通常就足够了。\n- 12. 在 Play Mode 中移动目标 transform 以查看效果（你可以在 Scene\
  \ View 中执行此操作）。\n\n### 工作原理...\n\n在本教程中，我们使用 `Quaternion.LookRotation()` 方法创建旋转，其工作方式与使用\
  \ `Transform.LookAt()` 函数相同。它应用于头部骨骼的 transform。我们的角色骨架及其所有骨骼在 Unity 中都是标准的 transform。我们可以像对其他游戏对象一样修改它们的旋转或位置，但我们需要在\
  \ `LateUpdate()` 函数中执行此操作，因为所有动画必须先进行评估。我们不能在 `Update()` 函数中修改任何骨骼的 transform，因为所有修改都会被动画覆盖。\n\
  \n`Quaternion.LookRotation()` 函数创建一个使 transform 前向轴指向所需方向的旋转。在大多数情况下，头部骨骼的前向轴并不匹配角色的面部；因此，我们需要应用额外的旋转。为此，我们使用\
  \ `public Vector3 additionalRotation` 变量。\n\n### 更多内容...\n\n对于人形角色，我们可以使用 IK 方法。为此，请按照以下步骤操作：\n\
  \n- 1. 确保在 Animator Controller 的图层属性中勾选 IK Pass 选项。\n- 2. 创建一个新脚本并将其命名为 `CharacterLookAtIK.cs`。\n\
  - 3. 在该脚本中创建一个 void `OnAnimatorIK(int layerIndex)` 函数。该函数在所有动画评估后在 IK Pass 中被调用。\n\
  - 4. 在该脚本中，我们在 Animator 组件上使用 `SetLookAtPosition()` 和 `SetLookAtWeight()` 函数。我们使用\
  \ `public Transform target` 变量设置注视位置，并使用 `public float weight` 变量设置注视权重。我们还使用 `Vector3.SmoothDamp()`\
  \ 方法来阻尼目标位置的任何突然变化：\n- 5. 保存脚本并将其分配给角色。\n- 6. 将 **Target** 游戏对象分配给脚本 **Inspector**\
  \ 中的 **Target** 字段。确保将 **Weight** 字段设置为 1。\n\n```\ntargetPosition = Vector3.SmoothDamp(targetPosition,\n\
  target.position, ref dampVelocity, dampTime);\nanim.SetLookAtPosition(targetPosition);\n\
  anim.SetLookAtWeight(weight);\n```\n\n- 7. 播放游戏并移动 **Target** 游戏对象以查看结果（你可以在 **Scene\
  \ View** 中执行此操作）。\n- 8. 要平滑地打开和关闭 **注视**，请使用 `Mathf.Lerp()` 函数随时间插值 `weight` 值。\n\
  \n## Action Points – 在指定位置执行动作\n\nAction Points 是游戏中角色需要在特定位置执行特定动作时常用的概念。你会在很多\
  \ RPG 游戏中找到它们，其中 NPC 填充城镇并执行不同的动作，营造出一个充满活力的社区的错觉。我们将在本教程中介绍 Action Point 的一个简单案例。\n\
  \n### 准备工作\n\n我们将使用一个具有三个动画的角色：**Walk**、**Idle** 和 **Action**。我们还将使用 *第5章，角色移动*\
  \ 中 *使用混合树混合行走和奔跑动画* 教程中的 `SetSpeedFromAgent.cs` 脚本。你也可以打开提供的示例 Unity 项目并前往 `Chapter\
  \ 05 Character actions and expressions\\Recipe 05 Action points performing an action\
  \ in a specified spot` 目录。你会在那里找到一个 `Example.scene` 场景。播放游戏以查看效果——Humanoid 角色将接近一个\
  \ Action Point 并执行拾取动画。\n\n### 如何操作...\n\n要创建一个简单的 Action Point，请按照以下步骤操作：\n\n-\
  \ 1. 将角色导入 Unity。\n- 2. 将其放置在场景中并添加 **NavMesh** Agent 组件。\n- 3. 在场景中烘焙 **NavMesh**。\n\
  - 4. 创建一个 Animator Controller 并将其分配给角色的 Animator 组件。\n- 5. 在控制器中创建一个 `float` **Speed**\
  \ 参数和一个 `Trigger` **Action** 参数。\n\n\n\n6. 将 **Idle**、**Walk** 和 **Action** 动画拖放到控制器中。确保\
  \ **Idle** 动画是默认状态。\n\n7. 创建四个过渡（见下图）：\n\n- **Idle | Walk** 条件为一个：**Speed** 参数大于\
  \ 0.5。**Has Exit Time** 应设为 false，**Transition Duration** 设为约 0.1 秒。\n- **Walk |\
  \ Idle** 条件为一个：**Speed** 参数小于 0.5。**Has Exit Time** 应设为 false，**Transition Duration**\
  \ 设为约 0.1 秒。\n- **Any State | Action** 条件为一个：**Action** 触发器参数。**Has Exit Time**\
  \ 应设为 false，**Transition Duration** 设为约 0.1 秒。\n- **Action | Idle** 无条件：**Has Exit\
  \ Time** 应设为 true，**Transition Duration** 设为约 0.1 秒。\n\n![](img/616a75b593bef4212f618360fceea442_170_0.png)\n\
  \n使用 Action Point 的 Animator Controller，其中包含 Action 状态\n\n8. 创建一个新脚本并将其命名为 `ActionPoint.cs`。\n\
  \n9. 在该脚本中，我们有一个 `IEnumerator PerformAction()` 协程来处理 **Action Point** 的使用（它在 `Start()`\
  \ 函数中启动）。在此协程中，我们首先检查角色是否足够接近 **Action Point**。如果不是，我们将 **NavMesh Agent's** 目标位置设置为\
  \ **Action Point's** 位置，等待一帧，然后再次检查：\n\n```\nwhile ((agentTransform.position -\n\
  transform.position).sqrMagnitude > actionDistance *\nactionDistance)\n{\nagent.SetDestination(transform.position);\n\
  agent.Resume();\nyield return null;\n}\n```\n\n10. `agentTransform` 变量保存对角色 transform\
  \ 的引用。`actionDistance` 是角色应开始执行动作时与 Action Point 的距离。\n\n11. 当角色距离 Action Point\
  \ 比 `actionDistance` 更近时，我们停止 NavMesh Agent 并检查是否希望在角色开始播放动作动画之前将角色的位置和/或旋转与我们的\
  \ Action Point 匹配。如果不匹配，我们立即开始播放动画：\n\n```\nagent.Stop();\nif (!matchBeforeAction)\n\
  {\n    anim.SetTrigger(actionTrigger);\n}\n```\n\n12. 接下来我们检查是否希望将角色的位置和/或旋转与 Action\
  \ Point 的位置/旋转匹配。如果是，我们使用线性插值来匹配位置和/或旋转。如果角色的位置和/或旋转足够接近 Action Point 的位置/旋转，我们将角色的位置/旋转设置为与\
  \ Action Point 的位置/旋转完全相同：\n\n```\nwhile (matchPosition == true || matchRotation\
  \ == true)\n{\n    yield return null;\n    if (matchPosition && (agentTransform.position\
  \ - transform.position).sqrMagnitude > 0.01f)\n    {\n        agentTransform.position\
  \ = Vector3.Lerp(agentTransform.position, transform.position, Time.deltaTime * lerpSpeed);\n\
  \    }\n    else\n    {\n        matchPosition = false;\n        agentTransform.position\
  \ = transform.position;\n    }\n    if (matchRotation && Vector3.Angle(agentTransform.forward,\
  \ transform.forward) > 1f)\n    {\n        agentTransform.rotation =\n        Quaternion.Lerp(agentTransform.rotation,\n\
  \        transform.rotation, Time.deltaTime *\n        lerpSpeed);\n    }\n    else\n\
  \    {\n        agentTransform.rotation =\n        transform.rotation;\n       \
  \ matchRotation = false;\n    }\n}\n```\n\n13. 最后，我们检查是否希望在角色的位置和/或旋转与 Action Point\
  \ 匹配后播放动画。如果是，我们现在播放动画（因为角色的位置和/或旋转已被调整）：\n\n```\nif (matchBeforeAction)\n{\n  \
  \  anim.SetTrigger(actionTrigger);\n}\n```\n\n14. 保存脚本。\n15. 创建一个新的空游戏对象，命名为 **Action\
  \ Point**，并将其放置在场景中，角色应在该位置执行动作。\n16. 将脚本附加到 Action Point 游戏对象。将角色拖放到脚本组件的 **Agent**\
  \ 字段中。\n17. 您可能需要调整脚本的 **Action Distance** 值。您还可以设置 **Match Position**、**Match Rotation**\
  \ 和 **Match Before Action** 选项以实现不同的结果。\n18. 播放游戏以查看效果。\n\n## 工作原理...\n\n`ActionPoint.cs`\
  \ 脚本的作用是告诉角色去哪里以及播放什么动画。`PerformAction()` 协程还会调整角色的位置和旋转以匹配 **Action Point** 的位置和旋转。我们在此处对位置和旋转都使用简单的\
  \ `Lerp()` 函数。在大多数情况下，这已经足够了。\n\n## 更多内容...\n\n您还可以使用 `MatchTarget()` 函数来插值角色的位置和旋转并使其与\
  \ **Action Point** 匹配。我们在 *第 4 章，角色移动* 中的 *为离网格链接添加动画* recipe 中使用了这种技术。在这种情况下，最好有一个特殊的接近动画，角色在其中接近\
  \ **Action Point**。\n\n您可能还想使用随机动作概念来创建具有随机动作的 **Action Points**。该概念在 *使用混合树创建随机动作*\
  \ recipe 中有描述。除了创建随机动作之外，您还可以准备一个包含所有动作作为枚举的 `public enum Action` 变量，以及一个公共变量用于存储\
  \ Action，即 Actionable Action `actionPointAction` 变量，用于在 **Action Point** 中存储 Action。然后您需要将\
  \ **RandomAction** 参数（按所述 recipe 中描述的）设置为 `(float) actionPointAction` 值。这将允许您使用\
  \ **Blend Trees** 执行指定的动作（而不是随机动作）。\n\n此外，在许多情况下，您需要将动作分为三个步骤：\n\n- **Pre-Action：**\
  \ 此动画可用于接近 **Action Point** 或作为“状态转换”动画。例如，当我们希望角色坐在椅子上时，最好有一个角色坐下的 **Pre-Action**\
  \ 动画（从 **Idle** 到 **Sitting** 状态的转换）。\n- **Looped-Action：** 适用于此 Action Point 的循环动画。在我们的坐下示例中，这将是一个循环坐下动画。它也可以是一系列动画（例如，我们的角色可以坐着吃东西或坐着喝东西）。\n\
  - **Post-Action：** 这是从 **Looped-Action** 动画转换到 **Idle** 动画的动画。在我们的示例中，这将是角色从椅子上站起来的动画。\n\
  \n## 将动画与场景中的对象同步\n\n在本 recipe 中，我们将同步角色的动画与放置在场景中的对象。这是游戏中再次常用的机制。\n\n## 准备工作\n\
  \n要遵循本 recipe，您需要两个动画游戏对象：一个角色和一个交互对象。在我们的示例中，我们使用一个角色可以旋转的轮杆。我们仅对 **Character**\
  \ 和 **Wheel** 对象使用两个动画，**WheelStart** 和 **WheelLoop**。这些动画具有相同数量的帧，并且已在 3D 软件包中同步。您也可以打开提供的示例\
  \ Unity 项目并进入 `Chapter 05 Character actions and expressions\\Recipe 06 Synchronizing\
  \ an animation with objects in the scene` 目录。您将在那里找到一个 `Example.scene`。播放游戏并按空格键，查看\
  \ **Character** 和 **Wheel** 播放同步动画。您可以在 `Rigs` 目录中找到所有必要的动画。\n\n![](img/616a75b593bef4212f618360fceea442_174_0.png)\n\
  \n角色和轮对象播放同步动画\n\n## 操作方法...\n\n要使两个对象播放同步动画，请按照以下步骤操作：\n\n- 1. 将 **Character**\
  \ 和 **Wheel** 对象导入 Unity。\n- 2. 对 **Wheel** 和 **Character** 的 **WheelLoop** 动画设置\
  \ **Loop Time** 选项。\n- 3. 将 **Character** 和 **Wheel** 放置在场景中，并根据 3D 软件包中的设置匹配它们的位置。\n\
  - 4. 为角色创建一个 **Animator Controller**。\n- 5. 将 **WheelStart** 和 **WheelLoop** 动画插入控制器。确保\
  \ **WheelStart** 动画是默认状态。\n\n\n\n6. 在控制器中创建一个 **PlayAnim** bool 参数。\n7. 创建两个过渡：\n\
  \   - **WheelStart | WheelLoop** 条件为一个：**PlayAnim** 参数设为 true。**Has Exit Time**\
  \ 应设为 false 且 **Transition Duration** 设为大约 0.1 秒。\n   - **WheelLoop | WheelStart**\
  \ 条件为一个：**PlayAnim** 参数设为 false。**Has Exit Time** 应设为 true 且 **Transition Duration**\
  \ 设为大约 0.1 秒。\n8. 将控制器分配给 **Character** 游戏对象的 **Animator** 组件。\n9. 创建一个 **Animator\
  \ Override Controller**。从 **Character's** 控制器派生它。将其分配给 **Wheel** 游戏对象的 **Animator**\
  \ 组件。\n10. 将覆盖控制器中的动画更改为 **Wheel's** 动画。\n11. 编写一个新脚本并命名为 `PlayAndStop.cs`。在该脚本的\
  \ `Update()` 函数中，我们检查玩家是否按下了空格键。如果是，则将 **PlayAnim** bool 参数设为其反转值，同时应用于 **Character's**\
  \ 和 **Wheel's** 动画控制器：\n12. 在前述脚本中，`play` 是一个辅助成员变量，`characterAnimator` 是对 **Character**\
  \ 游戏对象的 **Animator** 组件的引用，而 `objectAnimator` 是对 **Wheel** 游戏对象的 **Animator** 组件的引用。\n\
  13. 将脚本分配给 **Character** 游戏对象。\n14. 将 **Character** 游戏对象拖放到脚本中的 **Character Animator**\
  \ 字段，并将 **Wheel** 游戏对象拖放到 **Object Animator** 字段。\n15. 运行游戏并按空格键查看效果。\n\n```\nif\
  \ (Input.GetKeyDown(KeyCode.Space))\n{\n    play = !play;\n    characterAnimator.SetBool(\"\
  PlayAnim\", play);\n    objectAnimator.SetBool(\"PlayAnim\", play);\n}\n```\n\n\
  ## 工作原理...\n\n在 Unity 中，具有相同帧数和相同播放速度的动画是同步的。我们需要关心的只是让它们在同一帧开始。这就是为什么我们有 **WheelStart**\
  \ 动画。我们还需要关注过渡——如果两个 **Animator Controllers** 中的过渡长度不同，动画可能会不同步。\n\n## 更多内容...\n\
  \n你可以将此配方与之前的配方结合起来创建具有同步对象动画的 **Action Points**。确保在循环动作之前有 **Pre-Action** 动画。这样更容易在同一时间触发动画（例如，从\
  \ **Pre-Action** 动画中的 **Animation Event** 触发）。\n\n你可能还需要关闭角色的 **Rigidbody** 物理和\
  \ **NavMesh** Agent 组件，以便在播放动画前让其站在正确的位置。我们在 `Chapter 4, Character Movement` 中的\
  \ *使用触发器在跳跃时抓住边缘* 配方中这样做了。\n\n## 使用 IK 与场景对象交互\n\n有时我们的角色需要在场景中与对象交互。最可能的是我们需要一种从地面或其他对象拾取物品的解决方案。此配方展示了这样一个简单解决方案。\n\
  \n### 准备工作\n\n在本配方中，我们仅使用两个动画：**Idle** 和 **Pickup**。第二个动画使角色从地面拾取东西。你可以进入 `Chapter\
  \ 05 Character actions and expressions\\Recipe 07 Using IK for interacting with\
  \ scene objects` 目录。那里有一个 `Example.scene`。打开它，运行游戏，并按空格键查看角色尝试从地面拾取物体的情况。你可以移动物体并再次运行游戏。角色仍会尝试够到物体。\n\
  \n![](img/616a75b593bef4212f618360fceea442_176_0.png)\n\n角色尝试从地面拾取物体\n\n### 如何操作...\n\
  \n要使用 IK 与场景对象交互，请按照以下步骤操作：\n\n1. 将角色导入 Unity。确保拥有 **Idle** 和 **Pickup** 动画并将骨架设为\
  \ **Humanoid**。\n2. 创建一个 Animator Controller 并将其分配给角色。\n3. 确保在控制器的图层属性中勾选 **IK Pass**\
  \ 选项。\n4. 将 **Idle** 和 **Pickup** 动画拖放到控制器中。确保 **Idle** 是默认状态。\n5. 创建一个 `Trigger`\
  \ 参数并命名为 `Pickup`。同时创建一个 `float` 参数并命名为 **PickupIK**。\n6. 创建两个过渡：\n   - **Idle |\
  \ Pickup** 条件为一个：**Pickup** `Trigger` 参数。**Exit Time** 应设为 false 且 **Transition\
  \ Duration** 设为大约 0.1 秒。\n   - **Pickup | Idle** 无条件。**Has Exit Time** 应设为 true\
  \ 且 **Transition Duration** 设为大约 0.1 秒。\n7. 进入 **Animations** 选项卡中的角色 **Import**\
  \ 设置。\n8. 创建一个新的 **Animation Curve** 并命名为 `PickupIK`（名称必须与 `float` **PickupIK**\
  \ 参数名称匹配）。\n9. 创建一条平滑曲线，最小值为 0，最大值为 1。最大值应与角色伸手够取物体的时刻相匹配。参考以下图片：\n\n![](img/616a75b593bef4212f618360fceea442_178_0.png)\n\
  \nPickupIK 动画曲线。最大值（1）与角色拾取物体的帧相匹配\n\n10. 应用导入设置。\n11. 创建一个新脚本并命名为 `PickUpIK.cs`。在该脚本中，我们有一个\
  \ void `OnAnimatorIK(int layerIndex)` 函数。该函数在 IK Pass 中每帧调用一次，动画评估完成后调用。在该函数中，我们从控制器获取\
  \ **PickupIK** `float` 参数的值（等于 **Animation Curve** 的值）。然后我们将此值设为左手 IK 的权重。我们还将左手\
  \ IK 位置设为与存储要拾取对象引用的 `public Transform ikTarget` 成员变量相匹配：\n12. 在脚本的 `Update()` 函数中，我们检查玩家是否按下了空格键并播放了\
  \ **Pickup** 动画。\n\n```\nikWeight = anim.GetFloat(\"PickupIK\");\nanim.SetIKPosition(AvatarIKGoal.LeftHand,\n\
  \    ikTarget.position);\nanim.SetIKPositionWeight(AvatarIKGoal.LeftHand, ikWeight)\n\
  ```\n\n13. 保存脚本并将其附加到角色。创建一个新的游戏对象作为要拾取的对象。将其命名为 **PickupObject** 并将其拖到脚本的 **Inspector**\
  \ 中的 **Ik Target** 字段。\n14. 运行游戏并按空格键查看效果。你可以在 **Scene** 视图中移动 **PickupObject**\
  \ 并再次按空格键。我们的角色仍会尝试够到它（可能因手臂范围有限而失败）。\n\n### 工作原理...\n\n此配方仅适用于 Humanoid 角色。它使用\
  \ Unity 内置的逆运动学求解器。此配方的关键要素如下：\n\n- **Animation Curve**：我们在 Pickup 动画播放期间使用 Animation\
  \ Curve 平滑地设置 IK 求解器的权重。\n- **SetIKPosition()**：此函数为给定身体部位设置目标位置。我们在脚本中使用 `public\
  \ Transform ikTarget` 变量并将其传递给函数。你可以在运行时获取目标。\n- **SetIKPositionWeight()**：此函数设置\
  \ IK 求解器的权重。权重值为 1 表示 IK 完全控制给定身体部位，值为 0 表示动画完全控制。\n- **IK Pass**：要能够为 Humanoid\
  \ 角色使用逆运动学，我们需要在控制器的图层属性中启用 **IK Pass** 选项。\n\n### 另请参阅\n\n如果你想进一步尝试 IK 解决方案，强烈建议查看\
  \ `Asset` 商店中由 *RootMotion* 发行的 Final IK 包。它是 Unity 的一个非常强大的全身 IK 解决方案。\n\n## 使用\
  \ Blend Shapes 动画化面部表情\n\n如果你想为角色制作说话或改变面部表情的动画，最好使用 Blend Shapes。此配方涵盖使用从 3D 软件导出的\
  \ Blend Shapes 创建面部表情。\n\n\n\n## 准备工作\n\n我们需要几个存储面部表情的**混合形状**。在本教程中，我们将使用**微笑**、**愤怒**、**BlinkLeft**、**BlinkRight**和**BrowsDown**形状。在你的\
  \ 3D 软件中创建它们。如果你使用 Blender，**混合形状**称为 Shape Keys。在其他软件中，它们可能被称为 Morph Targets。\n\
  \n你也可以使用提供的示例 Unity 项目并进入 `Chapter 05 Character actions and expressions\\Recipe\
  \ 08 Animating facial expressions with blend shapes` 目录。你会在那里找到一个 `Example.scene`。打开它，运行游戏，并调整\
  \ UI 上的滑块以查看效果。你可以在 `Rigs` 目录中找到带有所有混合形状的角色。\n\n## How to do it...\n\n要使用**混合形状**进行面部表情，请按照以下步骤操作：\n\
  \n- 1. 将你的角色导入 Unity。将其放置在场景中。\n- 2. 在与角色相同的位置创建一个空游戏对象。将该对象命名为**FaceAnims**。\n\
  - 3. 将角色设为**FaceAnims**游戏对象的子对象。\n- 4. 在选中**FaceAnims**游戏对象后，打开**动画**视图（前往**窗口**\
  \ | **动画**）。\n- 5. 创建一个新的动画剪辑并将其命名为`Angry`。\n- 6. 点击添加属性按钮并选择**Character** | **Mesh**\
  \ | **SkinnedMesh Renderer** | **Blend Shape.Angry**，其中**Character**是你的角色游戏对象的名称，**Mesh**是包含**蒙皮网格渲染器**组件的角色游戏对象的名称，而**Angry**是从\
  \ 3D 软件导出的混合形状的名称。\n- 7. 点击**Blend Shape.Angry**选项旁边的加号图标以添加该属性。\n- 8. 进入**曲线**选项卡。选择两个关键帧并右键单击其中一个。选择**编辑键**选项并在**值**字段中输入\
  \ 100。\n- 9. 这样我们就创建了一个**愤怒**动画，其中**愤怒混合形状**设置为 100（最大值）。\n- 10. 对**微笑**、**BlinkLeft**、**BlinkRight**和**BrowsDown**混合形状重复步骤\
  \ 5 到 9。记住根据混合形状的名称命名动画（这样更容易识别动画）。\n- 11. 为**FaceAnims**游戏对象自动创建了一个 Animator Controller。打开它。\n\
  - 12. 删除控制器中的所有状态并添加一个新的**混合树**。\n- 13. 双击**混合树**以进入其设置。\n- 14. 将**混合树**类型设置为**直接**。它允许将多个动画一起混合。\n\
  - 15. 在**混合树**中创建五个**动作字段**并将**Angry**、**Smile**、**BlinkLeft**、**BlinkRight**和**BrowsDown**动画分配给它们。\n\
  - 16. 在控制器中创建五个`float`参数，每个动画一个。相应地命名它们并将它们分配给**动作字段**（**Smile**参数分配给**Smile**动画，**Angry**参数分配给**Angry**动画，以此类推）。\n\
  - 17. 编写一个新脚本并将其命名为`BlendMultiple.cs`。在脚本中创建五个公共 float 成员变量并根据**混合形状**名称命名它们（`public\
  \ float Smile`、`public float Angry`，以此类推）。\n- 18. 在`Update()`函数中，我们将控制器参数的值设置为变量的值。这样当我们更改变量的值时，控制器中的参数也会更改，我们的角色会播放面部表情：\n\
  - 19. 将脚本附加到**FaceAnims**游戏对象。运行游戏并在运行时更改脚本的 float 变量以查看效果（你可以使用**场景**视图）。\n\n```\n\
  anim.SetFloat(\"Angry\", Angry);\nanim.SetFloat(\"Smile\", Smile);\nanim.SetFloat(\"\
  BlinkLeft\", BlinkLeft);\nanim.SetFloat(\"BlinkRight\", BlinkRight);\nanim.SetFloat(\"\
  BrowsDown\", BrowsDown);\n```\n\n![](img/616a75b593bef4212f618360fceea442_181_0.png)\n\
  \n混合不同混合形状会产生有趣的面部表情\n\n## How it works...\n\n本教程有几个关键要素使其发挥作用：\n\n- **混合形状**：你需要从\
  \ 3D 软件导出混合形状。混合形状存储同一网格的不同版本。网格必须具有相同数量的顶点。在创建新的混合形状时，你只能移动顶点（不能添加或删除顶点）。\n- **FaceAnims\
  \ 游戏对象**：我们的角色是新游戏对象**FaceAnims**的子对象。这使我们能够为面部表情设置动画。由于我们的角色拥有自己的 Animator 组件和自己的动画，因此我们无法使用**动画**视图对其进行修改。添加父游戏对象解决了这个问题。\n\
  - **直接混合树**：我们使用设置为**直接**的**混合树**。这允许我们同时混合多个动画。这适用于混合形状和面部表情。\n\n## There's more...\n\
  \n你不必为混合形状创建动画剪辑。相反，你可以直接从代码中操作它们。在**蒙皮网格渲染器**组件上使用`setBlendShapeWeight()`函数。你需要知道**混合形状**在**混合形状**数组中的索引（你可以在检查器中，在角色的**蒙皮网格渲染器**组件中查看）。我们准备了一个设置权重的简短脚本。它附加到**DirectBlendShapes**游戏对象。你也可以在该教程的`Scripts`目录中找到它。\n\
  \n为**混合形状**创建动画可以提供更大的灵活性。你也可以使用**动画**视图为混合形状的权重设置动画。这样你就可以创建对话动画和逼真的动画面部表情。\n"
- "## 6\n\n## Handling Combat\n\n本章解释了战斗中动画的使用并涵盖了以下主题：\n\n- 在 Animator Controller\
  \ 中使用子状态机\n- 使用动画事件触发脚本函数\n- 使用从任意状态的转换来播放受击反应\n- 使用根运动创建闪避动作\n- 检查当前活动的 Animator\
  \ 状态以禁用或启用玩家操作\n- 使用动画事件绘制武器\n- 使用 Avatar Mask 和动画控制器层进行行走和瞄准\n- 使用`LookAt()`方法进行瞄准\n\
  - 使用混合树进行瞄准\n- 检测角色上的命中位置\n\n## Introduction\n\n每个游戏都不同，每个游戏都以自己的方式处理战斗机制。尽管如此，几乎在每种情况下都有一个通用的概念集合是有用的。在本章中，我们将介绍近战和远程战斗必不可少的工具。\n\
  \n## Using Sub-State Machines in Animator Controller\n\n本教程展示了如何使用子状态机。这个概念有助于在\
  \ Animator Controller 中组织流程。\n\n## Getting ready\n\n开始时，你需要一个具有几个动画的角色。在此示例中，我们使用具有**NormalIdle**、**NormalMove**、**CombatIdle**和**CombatMove**动画的角色。这些动画随后将被分组到两个**子状态机：Combat**和**Normal**中。\n\
  \n你也可以打开提供的示例 Unity 项目并进入`Chapter 06\\Handling combat\\Recipe 01 Using sub state\
  \ machines in animator controller`目录。在`Rigs`目录中你会找到所有必要的动画。在`Controllers`目录中，你可以找到带有两个子状态机的完成控制器。你可以在`Example.unity`场景中找到**Humanoid**角色。如果按下空格键，我们的角色将从**Normal**切换到**Combat\
  \ 子状态机**。\n\n## How to do it...\n\n要在控制器中创建子状态机，请按照以下步骤操作：\n\n- 1. 创建并打开一个新的 Animator\
  \ Controller。\n- 2. 右键单击空白区域并选择**创建子状态机**。将创建一个新的子状态机。将其命名为`Normal`。\n- 3. 创建另一个子状态机并将其命名为`Combat`。\n\
  - 4. 创建一个`bool`参数：**CombatState**。\n- 5. 创建两个转换：\n  - **Combat** | **Normal** 无条件。\n\
  \  - **Normal** | **Combat** 无条件。\n- 6. 双击**Normal**子状态机。\n- 7. 创建一个`float`**Speed**参数。\n\
  - 8. 将**NormalIdle**和**NormalMove**动画拖放到控制器中（确保你在**Normal**子状态机中）。\n\n\n\n9. 创建两个过渡：\n\
  - **NormalIdle | NormalMove**，条件为一个：**Speed** 参数大于 0.5。**Has Exit Time** 应设为 `false`，**Transition\
  \ Duration** 应设为约 0.2 秒。\n- **NormalMove | NormalIdle**，条件为一个：**Speed** 参数小于 0.5。**Has\
  \ Exit Time** 应设为 `false`，**Transition Duration** 应设为约 0.2 秒。\n\n10. 创建两个过渡——一个从\
  \ **NormalIdle** 到 **Exit** 状态，另一个从 **NormalMove** 到 **Exit** 状态——两者条件均为一个：**CombatState**\
  \ 参数设为 `true`。**Transition Duration** 应设为约 0.2 秒，**Has Exit Time** 应设为 `false`。\n\
  \n11. 在控制器中双击空白处以退出 **NormalSub-State Machine**。\n\n12. 双击 **Combat** Sub-State\
  \ Machine，并使用 **CombatIdle** 和 **CombatMove** 动画重复步骤 9 和 10。\n\n13. 关闭 **Animator\
  \ Controller** 并将其分配给你的角色。\n\n14. 编写一个脚本以能够设置 **Speed** 值和 **CombatState** bool\
  \ 参数。将其命名为 `SetCombatAndSpeed.cs`。\n\n15. 在此脚本的 `Update()` 函数中，我们检查玩家是否按下了空格键。如果是，则反转\
  \ **CombatState** 参数值。我们还检查玩家是否按下了上箭头。如果是，则设置 **Speed** 参数以使角色播放移动动画：\n\n```\nif\
  \ (Input.GetKeyDown(KeyCode.Space))\n{\n    combat = !combat;\n    anim.SetBool(\"\
  CombatState\", combat);\n}\nif (Input.GetKey(KeyCode.UpArrow))\n{\n    anim.SetFloat(\"\
  Speed\", 1f);\n}\nelse\n{\n    anim.SetFloat(\"Speed\", 0f);\n}\n```\n\n16. 将脚本分配给角色，启动游戏，按空格键查看角色切换\
  \ Sub-State Machines。\n\n## 它是如何工作的...\n\n子状态机的概念使组织控制器变得更容易。你可以把它们想象成嵌套的控制器。你可以在其他子状态机内部拥有子状态机。巧妙地组织你的控制器可以防止出现意大利面条式图表。\n\
  \n要退出子状态机，你必须过渡到 Exit 状态。你可以拥有多个这样的过渡，就像你可以在子状态机之间拥有多个过渡一样。使用过渡条件来确定你的图表应过渡到何处。\n\
  \n## 还有更多...\n\n你还可以从子状态机过渡到任何其他子状态机中的特定状态。为此，请向名为 (Up) Base Layer 的状态创建过渡（名称可能因你当前所在的子状态机和图层的名称而异）。如果执行此过渡，将出现一个菜单，让你选择要过渡到的状态；请参阅以下屏幕截图作为参考：\n\
  \n![](img/616a75b593bef4212f618360fceea442_186_0.png)\n\n过渡到另一个子状态机中的特定状态\n\n##\
  \ 使用动画事件触发脚本函数\n\n我们在之前的配方中零星地使用了动画事件，因为它们非常方便，而且只是很难等到这一刻。大多数现代游戏非常广泛地使用动画事件，尤其是在处理战斗时。没有这个方便的工具，创建逼真的近战遭遇会困难得多。\n\
  \n### 准备工作\n\n开始之前，我们需要一个带有攻击动画的角色。在示例文件中，我们将动画命名为 HumanAttack。我们还需要一个敌人（在本示例中我们使用\
  \ Spider 角色），它具有 Idle 和 Death 动画。你也可以下载提供的示例 Unity 项目并进入 Chapter 06 Handling combat\\\
  Recipe 02 Using animation events to trigger script functions 目录。你将在那里找到一个名为 Example.unity\
  \ 的场景，其中包含 Humanoid 和 Spider 角色。在 Rigs 目录中，你可以找到带有所有所需动画的 Humanoid.fbx 角色。游戏运行时，Humanoid\
  \ 角色会多次攻击 Spider 并对其造成伤害。\n\n### 如何操作...\n\n要使用动画事件触发脚本函数，请按照以下步骤操作：\n\n1. 将带有 HumanAttack\
  \ 动画的角色导入 Unity。\n2. 在 Inspector 窗口中转到动画导入设置选项卡。\n3. 选择 HumanAttack 动画。\n4. 向下导航到\
  \ Events 部分并展开它。\n5. 使用预览窗口拖动动画到攻击中命中时刻。\n\n6. 通过按 **Add Event** 按钮添加 **Animation\
  \ Event**，如下图所示：\n\n![](img/616a75b593bef4212f618360fceea442_188_0.png)\n\n添加动画事件\n\
  \n7. **Edit Animation Event** 窗口将出现。在 **Function** 文本字段中输入 Attack。为了使事件生效，我们需要在分配给角色的脚本中有一个同名函数。\n\
  \n8. 我们将创建一个简单的战斗场景，因此我们需要敌人的脚本。创建一个新脚本并将其命名为 Enemy.cs。在此脚本中，我们有 public float hitPoints\
  \ 变量来存储敌人当前的生命值。我们还有两个 public virtual void 函数：Hit(float damage) 和 Die()。Hit(float\
  \ damage) 函数从当前 hitPoints 中减去伤害，并在 hitPoints 降至 0 时调用 Die() 函数。Die() 函数通过在控制器中设置\
  \ bool Dead 参数来播放死亡动画。这些函数是虚拟的，因为我们希望在后续配方中从此脚本派生以添加新功能：\n\n```\npublic void Hit(float\
  \ damage)\n{\n    hitPoints -= damage;\n    if (hitPoints <= 0)\n    {\n       \
  \ Die();\n    }\n}\npublic void Die()\n{\n    anim.SetBool(\"Dead\", true);\n}\n\
  ```\n\n9. 创建一个过渡：\n\n10. 在其中，创建 bool Dead 参数。将 Idle 和 Death 动画拖放到控制器中。使 Idle 成为默认状态。\n\
  \n11. 为我们的 Spider 角色创建一个新的 Animator Controller。\n- Idle | Death，条件为：Dead 参数设为 true，Has\
  \ Exit Time 设为 false，Transition Duration 设为 0.2 秒。\n- 将 Spider 角色放置在场景中。为其添加 Rigidbody\
  \ 组件、Sphere Collider 组件和我们的 Enemy.cs 脚本组件。将 Rigidbody 组件设为 Is Kinematic。\n\n12.\
  \ 将控制器分配给 Spider 的 Animator 组件。\n\n13. 为我们的 Humanoid 角色创建另一个 Animator Controller。\n\
  \n14. 在该控制器中放置一个循环的 HumanAttack 动画并将其分配给 Humanoid 角色。\n\n15. 将 Humanoid 角色放置在场景中\
  \ Spider 附近。\n\n16. 创建一个新脚本并将其命名为 MeleeAttack.cs。在此脚本中，我们使用 public void Attack()\
  \ 函数。这是从动画事件调用的函数。我们有一个范围内所有敌人的列表。我们遍历该列表并对列表中的每个敌人调用 Hit() 函数。我们还有一个 public float\
  \ damage 变量来存储角色的伤害值并在 Hit() 函数中发送：\n\n```\npublic void Attack () {\n    for (int\
  \ i = 0; i < enemiesInRange.Count; i++)\n    {\n        enemiesInRange[i].Hit(damage);\n\
  \    }\n}\n```\n\n17. 将脚本分配给 Humanoid 角色。\n\n18. 我们还需要一个脚本来获取范围内的目标。创建一个新脚本并将其命名为\
  \ TargetTrigger.cs。在此脚本的 void OnTriggerEnter(Collider other) 函数中，我们检查进入触发器的对象是否具有\
  \ Enemy.cs 组件。如果是，则将其添加到 MeleeAttack.cs 组件中的 enemiesInRange 中：\n\n```\nEnemy e =\
  \ other.gameObject.GetComponent<Enemy>();\nif (e != null)\n{\n    if (!attackScript.enemiesInRange.Contains(e))\n\
  \    {\n    attackScript.enemiesInRange.Add(e);\n}\n}\n```\n\n19. 在 void OnTriggerExit(Collider\
  \ other) 函数中，我们从 enemiesInRange 列表中移除敌人：\n\n```\nEnemy e = other.gameObject.GetComponent<Enemy>();\n\
  if (e != null)\n{\n    if (attackScript.enemiesInRange.Contains(e))\n    {\n   \
  \     attackScript.enemiesInRange.Remove(e);\n    }\n}\n```\n\n20. 在前面的脚本中，attackScript\
  \ 是对 MeleeAttack.cs 脚本组件的引用。\n\n21. 创建一个空游戏对象并将其命名为 TargetTrigger。为其添加 Box Collider\
  \ 组件并将碰撞体设为 Is Trigger。将我们的 TargetTrigger.cs 脚本分配给它。\n\n22. 使 TargetTrigger 游戏对象成为我们\
  \ Humanoid 角色的子对象，并塑造 Box Collider 以检查近战命中范围。见以下屏幕截图：\n\n![](img/616a75b593bef4212f618360fceea442_190_0.png)\n\
  \n近战攻击范围触发器\n\n23. 播放游戏以查看效果。\n\n\n\n## 它是如何工作的...\n\n动画事件会调用正在播放动画的游戏对象上所分配脚本中的公共函数。要使其正常工作，动画事件的\
  \ **函数** 字段需要与我们希望从脚本中调用的函数名称相同。\n\n事件非常有用，因为它们允许我们将函数调用与动画同步。检查玩家是否击中目标的最佳时机是在动画中看到视觉上的击中时——拳头在出拳时处于极端位置，或剑在挥砍时处于极端位置。如果没有动画事件，我们就必须始终手动延迟函数调用才能达到类似的效果。\n\
  \n## 还有更多...\n\n动画事件还可以具有 `int`、`float`、`string` 或对象类型的参数。要使用这些参数，我们必须在事件调用的函数中实现它们。这些参数可用于播放特效或音效（你可以在\
  \ `Chapter 7` 的 *使用动画事件触发音效和视觉效果* 食谱中了解更多信息，*特效*）。\n\n## 使用从任意状态的过渡来播放受击反应\n\n通常，会出现我们希望从任何其他动画过渡到一个动画的情况。最常见的例子是受击反应。我们的角色可能在站立、行走甚至攻击时被击中。创建和管理所有这些过渡会很麻烦且困难。在\
  \ Unity 中，我们可以在控制器中使用特殊的 **任意状态** 来实现从任何给定动画的过渡。\n\n## 准备工作\n\n我们将使用上一食谱中的角色，并为\
  \ **Spider** 角色添加一个动画：**HitReaction**。你也可以使用示例项目并进入 `Chapter 06 Handling combat\\\
  Recipe 03 Using transitions from any state to play hit reactions` 目录。你可以在那里找到 `Example.unity`\
  \ 场景，其中包含两个角色：**Humanoid** 和 **Spider**。当你游玩游戏时，**Spider** 会对击中做出反应。在上一食谱的 `Rigs`\
  \ 目录中，你可以找到所需的动画。\n\n## 如何操作...\n\n要使用任意状态过渡，请按照以下步骤操作：\n\n- 1. 按照上一食谱导入角色并将它们放置在场景中。\n\
  - 2. 为 **Spider** 创建一个新的 **动画控制器**（你也可以编辑现有的）。\n- 3. 在控制器中创建一个新的 `bool` 参数并将其命名为\
  \ **Dead**。\n- 4. 在控制器中创建一个新的 `Trigger` 参数并将其命名为 **Hit**。\n- 5. 将 **Spider** 的 **Idle**、**Death**\
  \ 和 **HitReaction** 动画拖放到控制器中。**Idle** 动画应为我们的默认状态。\n- 6. 在控制器中找到蓝色的 **任意状态** 节点。参考以下截图：\n\
  - 7. 右键单击它并创建以下过渡：\n  - **任意状态** | **HitReaction** 条件为一个：**Hit** `Trigger` 参数。**退出时**\
  \ 应设置为 `false`，**可自行转换** 设置为 true，且 **转换持续时间** 设置为 0.2 秒。\n  - **任意状态** | **Death**\
  \ 条件为一个：**Dead** `bool` 参数设置为 `true`。**退出时** 应设置为 `false`，**可自行转换** 设置为 false，且\
  \ **转换持续时间** 设置为 0.2 秒。\n  - **HitReaction** | **Idle**：对于这个，你需要先右键单击 **HitReaction**\
  \ 状态。它不应有条件，**退出时** 设置为 `true`，且 **转换持续时间** 设置为 0.2 秒。\n- 8. 将控制器分配给 **Spider's\
  \ Animator** 组件。\n- 9. 创建一个新脚本并将其命名为 `EnemyWithHits.cs`。\n\n![](img/616a75b593bef4212f618360fceea442_192_0.png)\n\
  \n从任意状态的过渡\n\n- 10. 让此脚本继承自 `Enemy.cs` 脚本而不是 `MonoBehaviour`。你可以在上一食谱中找到 `Enemy.cs`\
  \ 脚本。\n- 11. 为了使受击反应正常工作，我们需要重写 `Hit()` 和 `Die()` 函数。在第一个函数中，我们检查角色的 `isAlive` 标志。如果我们的\
  \ **Spider** 已经死亡，我们就不会尝试播放受击反应。如果它还活着，我们通过在控制器中设置 **Hit Trigger** 参数来播放受击反应。接下来我们调用\
  \ `Hit()` 函数的基础实现：\n```\npublic override void Hit(int damage)\n{\n    if (!isAlive)\n\
  \    {\n        return;\n    }\n    anim.SetTrigger(\"Hit\");\n    base.Hit(damage);\n\
  }\n```\n- 12. 在 `Die()` 函数中，我们将 `isAlive` 标志设置为 false 并调用 `Die()` 函数的基础实现：\n```\n\
  public override void Die()\n{\n    isAlive = false;\n    base.Die();\n}\n```\n-\
  \ 13. 将脚本分配给 **Spider** 角色并游玩游戏以查看效果。\n\n## 它是如何工作的...\n\n任意状态是组织动画图的有力工具。如果我们知道需要从任何其他状态访问一个动画状态，我们可以从任意状态节点创建过渡，而不是从所有必要状态创建过渡网络。\n\
  \n这个特殊状态的过渡有一个额外的参数：**可自行转换**。如果设置为 `false`，它会阻止过渡到同一状态。\n\n任意状态过渡对于受击反应和死亡动画最有用。\n\
  \n## 使用根运动创建闪避动作\n\n我们可以使用仅动画来实现许多战斗中的游戏玩法动作。闪避动作就是此类动作的一个很好的例子。\n\n## 准备工作\n\n\
  要按照本食谱操作，我们需要一个具有 SpiderIdle 和 Dodge 动画的角色（在本示例中我们将使用我们的 Spider 角色）。闪避动画应使用根运动创建。请查看以下截图中的示例：\n\
  \n![](img/616a75b593bef4212f618360fceea442_194_0.png)\n\n使用根运动平移的蜘蛛闪避\n\n你也可以进入\
  \ `Chapter 06 Handling combat\\Recipe 04 Using root motion to create a dodge move`\
  \ 目录。在那里打开 `Example.unity` 场景。你会找到与之前食谱中相同的 **Humanoid** 和 **Spider** 角色。它们具有与 *使用从任意状态的过渡来播放受击反应*\
  \ 食谱中相同的动画和脚本。**Spider** 有一个额外的动画：**Dodge**。如果你在 **Play Mode** 中按下空格键，**Spider**\
  \ 将尝试闪避剑的挥砍。你可以在 `Chapter 06 Handling combat\\Recipe 02 Using animation events to\
  \ trigger script functions\\Rigs` 目录中找到所有必要的动画。\n\n## 如何操作...\n\n要使角色闪避，请按照以下步骤操作：\n\
  \n- 1. 将角色导入 Unity 并放置在场景中。\n- 2. 如果你希望角色受到伤害并播放受击反应，请按照上一食谱操作。\n- 3. 创建一个新的动画控制器或编辑上一食谱中的控制器。\n\
  - 4. 将 **Dodge** 动画拖放到控制器中。\n- 5. 在控制器中创建一个 **Dodge** `Trigger` 参数。\n- 6. 创建两个过渡：\n\
  \  - **SpiderIdle** | **Dodge** 条件为一个：**Dodge** `Trigger` 参数。**退出时** 应设置为 false\
  \ 且 **转换持续时间** 设置为 0.2 秒。\n  - **Dodge** | **SpiderIdle** 无条件：**退出时** 应设置为 true\
  \ 且 **转换持续时间** 设置为 0.2 秒。\n- 7. 为 **Spider** 角色添加 **刚体** 组件并冻结其旋转。\n- 8. 为 **Spider**\
  \ 角色添加一个碰撞体（我们为 **Spider** 使用 **球形碰撞体**）。你可能还需要创建一个零摩擦的 **物理材质** 并将其添加到碰撞体中。它允许动画在没有额外摩擦的情况下控制刚体移动。\n\
  - 9. 在我们的 **Spider** 中将 **动画** 组件的 **更新模式** 设置为 **动画物理**。\n- 10. 将控制器附加到我们 **Spider**\
  \ 的 **动画** 组件。\n- 11. 创建一个新脚本并将其命名为 `Dodge.cs`。在此脚本的 `Update()` 函数中，我们只需在玩家按下空格键时在控制器中设置\
  \ **Dodge** `Trigger`：\n```\nif (Input.GetKeyDown(KeyCode.Space))\n```\n\n```\n\
  {\n    anim.SetTrigger(\"Dodge\");\n}\n```\n\n- 12. 如同以往，`anim` 变量存储对 **动画器** 组件的引用，并在\
  \ `Start()` 函数中设置。\n- 13. 将脚本附加到 **蜘蛛** 角色上。\n- 14. 运行游戏并按空格键，查看 **蜘蛛** 播放闪避动画。它应该能够脱离\
  \ **人形** 角色的攻击范围并避免被击中。\n\n## 它是如何工作的...\n\n本食谱使用一个非常简单但强大的概念。我们在这里做的唯一额外事情就是触发\
  \ **闪避** 动画。此动画使用根运动并平移我们的 **蜘蛛** 角色。我们的 **人形** 角色使用 **攻击动画事件** 和 **目标触发器** 来检查敌人是否在其攻击范围内（请参阅\
  \ *使用动画事件触发脚本函数* 食谱了解详情）。如果我们的 **蜘蛛** 在 **攻击** 事件发生之前离开 **目标触发器**，它将避免被击中。\n\n##\
  \ 还有更多...\n\n闪避动画也适用于其他命中检测机制。例如，你可以在 **攻击** 事件中使用 `Vector3.Distance()` 和 `Vector3.Angle()`\
  \ 方法手动检查范围和攻击角度。你也可以在剑上使用 **刚体** 组件并使用 `void OnCollisionEnter(Collision collision)`\
  \ 方法检查其碰撞。在这两种情况下，我们的 **闪避** 动作都将正常工作。它也适用于使用碰撞来判定命中的子弹（例如，箭矢）。\n\n你可以将相同的概念用于其他动作：冲刺、连招以及一些使用根平移和/或旋转的疯狂近战攻击（例如，跳跃攻击）。根运动是战斗设计的非常强大的工具。尝试使用自己的动画创意来创造有趣的动作。\n\
  \n## 检查当前活动的 Animator 状态以禁用或启用玩家动作\n\n有时我们需要根据当前播放的动画来阻止或允许某些动作。本食谱描述了如何轻松检查当前正在播放的动画。\n\
  \n## 准备工作\n\n我们将使用上一食谱中的同一个 **蜘蛛** 角色。它拥有 **SpiderIdle**、**Dodge**、**HitReaction**\
  \ 和 **Death** 动画。你可以打开提供的示例项目并进入 `Chapter 06 Handling combat\\Recipe 05 Checking\
  \ what animator state is currently active to disable or enable player actions` 目录。`Example.unity`\
  \ 场景中有一个 **蜘蛛** 角色。当你按下 *H* 键时，它将开始治疗动作，仅在 **SpiderIdle** 状态下。你可以在 `Chapter 06 Handling\
  \ combat\\Recipe 02 Using animation events to trigger script functions\\Rigs` 目录中找到所有必要的动画。\n\
  \n## 如何操作...\n\n要检查当前活动的 Animator 状态，请按照以下步骤操作：\n\n- 1. 将角色导入 Unity。\n- 2. 为其创建\
  \ Animator 控制器或使用现有控制器。\n- 3. 如果你希望角色对命中做出反应，请遵循 *使用从任意状态的过渡来播放命中反应* 食谱。\n- 4. 在本食谱中，我们将使用治疗动作作为示例。创建一个新脚本并将其命名为\
  \ `Healing.cs`。在此脚本的 `Update()` 函数中，首先我们检查玩家是否按下了 *H* 键。然后我们检查我们的角色是否正在播放正确的 **动画器**\
  \ 状态并保存在 `public string healingAllowedState` 变量中。我们还检查治疗动作是否未激活，因为我们不想堆叠治疗动作。如果所有这些条件都满足，我们将启动一个治疗协程：\n\
  \n```\nif (Input.GetKeyDown(KeyCode.H))\n{\n    if (anim.GetCurrentAnimatorStateInfo(0).IsName(\n\
  healingAllowedState))\n    {\n        if (!isHealing)\n{\n    StartCoroutine(\"\
  Heal\");\n}\n}\n}\n```\n\n- 5. `IEnumerator Heal()` 协程负责随着时间增加我们蜘蛛的 `hitPoints`：\n\
  \n```\nisHealing = true;\nEnemy enemyScript = GetComponent<Enemy>();\n\nwhile (enemyScript.hitPoints\
  \ < (float)enemyScript.initialHitPoints)\n{\n    enemyScript.hitPoints += healingSpeed\
  \ * Time.deltaTime;\n    yield return null;\n}\n\nenemyScript.hitPoints = enemyScript.initialHitPoints;\n\
  isHealing = false;\n```\n\n- 6. 将脚本分配给蜘蛛角色。\n- 7. 运行游戏并按 H 键开始治疗动作。我们的角色需要在 SpiderIdle\
  \ 状态下（在检查器中 public string healingAllowedState 设置为 Base Layer.SpiderIdle）。\n\n##\
  \ 它是如何工作的...\n\n要检查角色当前所在的 Animator 状态，我们首先使用 GetCurrentAnimatorStateInfo(int layerIndex)\
  \ 函数获取角色 Animator 所处的状态。我们需要在 Animator 组件上调用此函数；因此，我们需要有一个存储其引用的变量（在我们的示例中为 anim）。然后我们在从\
  \ GetCurrentAnimatorStateInfo(int layerIndex) 函数获取的状态上调用 IsName(string name) 函数。IsName(string\
  \ name) 函数将 Animator 状态名称与我们作为参数输入的名称进行比较。\n\n![](img/616a75b593bef4212f618360fceea442_198_0.png)\n\
  \n我们需要指定状态的完整名称。此名称的格式应为：<图层名称>.<状态名称>。例如，我们的 SpiderIdle 状态位于 Base Layer 中，因此我们需要在\
  \ IsName() 函数中将 Base Layer.SpiderIdle 作为名称参数。\n\n## 还有更多...\n\n有时我们不仅需要检查 Animator\
  \ 的当前状态，还需要检查其中的特定时刻。假设我们有一个持续 2 秒的跳跃攻击动画。我们的角色在动画的第一秒开始跳跃，然后在动画结束时跳跃并落地并进行打击。我们可能希望在角色仍在地面上时允许玩家中断动画（例如，使用闪避动画）。为此，我们可以使用动画曲线在控制器中设置一个\
  \ AllowBreak 浮点参数（你可以选择不同的名称），并在尝试执行动作或过渡到其他状态时检查此参数值。动画曲线在第 4 章《角色移动》中的 *使用动画实现更佳过渡*\
  \ 食谱中进行了描述。\n\n## 使用动画事件绘制武器\n\n在战斗机制中，拔出和收起武器是另一个常见情况。在本食谱中，我们将使用动画事件以及 Draw 动画使我们的角色拔出和收起剑。\n\
  \n## 准备工作\n\n要遵循本食谱，我们需要有一个拥有两个动画的战士角色：Idle 和 Draw。第一个是标准的、循环的 Idle 动画。第二个是角色伸手去拿系在腰带上的剑鞘中武器的动画。这里我们不使用剑鞘模型以使食谱更简单紧凑。你可以打开提供的示例项目并进入\
  \ Chapter 06 Handling combat\\Recipe 06 Using animation events to draw a weapon\
  \ 目录。Example.unity 场景中有一个战士角色。当你按下空格键时，它将拔出或收起剑。你可以在 Rigs 目录中找到所有必要的动画。\n\n## 如何操作...\n\
  \n要使角色拔出或收起武器，请按照以下步骤操作：\n\n- 1. 将带有 Idle 和 Draw 动画的战士角色导入 Unity。\n- 2. 将剑道具导入 Unity。\n\
  - 3. 进入导入设置 | 动画 选项卡。选择 Draw 动画并导航到事件部分。\n- 4. 在角色的手触及剑鞘中剑的帧添加一个 **Draw** 事件。\n\
  - 5. 创建一个包含 **Idle** 和 **Draw** 动画的 **动画控制器**。\n- 6. 在控制器中创建一个 **Draw** `Trigger`\
  \ 参数。\n- 7. 创建两个过渡：\n  - **Idle | Draw** 条件为一个：**Draw** `Trigger` 参数。**Has Exit\
  \ Time** 应设置为 `false`，**Transition Duration** 设置为约 0.2 秒。\n  - **Draw | Idle** 无条件：**Has\
  \ Exit Time** 应设置为 `true`，**Transition Duration** 设置为约 0.2 秒。\n- 8. 将 **战士** 角色放置在场景中。\n\
  - 9. 将控制器分配给 **战士** 游戏对象的 **动画器** 组件。\n- 10. 将 **剑** 道具放置在场景中。将它移至角色臀部附近，并将其摆姿为放置在剑鞘中时的样子。\n\
  - 11. 当你对 **剑** 的位置满意时，在其中创建一个空的子对象。将其命名为 **SheathMarker** 并将其拖到角色的髋骨上，使其成为 **战士**\
  \ 臀部的子对象。这样 **SheathMarker** 将存储我们的 **剑** 相对于角色臀部的初始位置和旋转。你还应将剑设为 **SheathMarker**\
  \ 的子对象。参考以下截图：\n\n![](img/616a75b593bef4212f618360fceea442_200_0.png)\n\nSheath\
  \ Marker（红色）存储剑的期望位置和旋转\n\n\n\n12. 将剑移动到战士的手中。按需摆好剑的姿势。在剑中创建一个新的空子对象并命名为 HandMarker。将\
  \ HandMarker 游戏对象拖放到角色骨架中右手骨骼上，使其成为战士手的父级。请参考以下截图：\n\n![](img/616a75b593bef4212f618360fceea442_201_0.png)\n\
  \nHand Marker（橙色）存储剑在手中的期望位置和旋转\n\n13. 编写一个新脚本并命名为 DrawWeapon.cs。在此脚本的 Update()\
  \ 函数中，我们检查玩家是否按下了空格键。如果是，我们首先设置控制器中的 Draw Trigger 参数以播放动画：\n\n```\nif (Input.GetKeyDown(KeyCode.Space))\n\
  {\n    anim.SetTrigger(\"Draw\");\n}\n```\n\n14. 我们还将剑的位置和旋转插值到其父游戏对象的位置和旋转（Hand\
  \ Marker 或 Sheath Marker）：\n\n```\nif (weapon.parent != null)\n{\n    if ((weapon.position\
  \ - weapon.parent.position).sqrMagnitude > 0.0001f)\n    {\n        weapon.position\
  \ =\n        Vector3.Lerp(weapon.position,\n        weapon.parent.position, Time.deltaTime\
  \ *\n        lerpSpeed);\n        weapon.rotation =\n        Quaternion.Lerp(weapon.rotation,\n\
  \        weapon.parent.rotation, Time.deltaTime *\n        lerpSpeed);\n    }\n\
  }\n```\n\n15. 在前面的脚本中，weapon 变量保存对剑的 Transform 组件的引用。public float lerpSpeed 变量在\
  \ Inspector 中设置。\n\n16. 该脚本还有一个 public void Draw() 函数，该函数由 Draw 动画中设置的 Animation\
  \ Event 调用。在此函数中，我们使用 public bool weaponInHand 变量检查剑是否已在手中。我们需要在 Inspector 中根据剑的初始位置（在手中或在剑鞘中）设置此变量的初始值。Draw()\
  \ 函数仅更改剑的父级并设置 weaponInHand 标志：\n\n```\nif (weaponInHand)\n{\n    weaponInHand =\
  \ false;\n    weapon.parent = sheathMarker;\n}\nelse\n{\n    weaponInHand = true;\n\
  \    weapon.parent = handMarker;\n}\n```\n\n17. 将脚本附加到角色。将 Sheath Marker 游戏对象拖放到脚本中的\
  \ Sheath Marker 字段，将 Sword 游戏对象拖放到 Weapon 字段，将 Hand Marker 拖放到 Hand Marker 字段。设置\
  \ Weapon In Hand 复选框以匹配剑的初始位置。\n\n18. 播放游戏并按空格键查看效果。\n\n## 工作原理...\n\n我们使用 Draw\
  \ 动画中的 Animation Event 来找到角色伸手去拿系在腰带上的武器的时刻。在此事件中，我们更改武器的父级以将其附加到手或腰带上（取决于角色是拔出武器还是收回武器）。我们还使用\
  \ Lerp() 方法来调整或匹配武器的位置和旋转与角色中的适当插槽（Hand Marker 和 Sheath Marker）。这样我们的 Draw 动画就不必与武器的期望位置完全匹配。它使得更容易使用相同的动画用于更广泛的不同武器。\n\
  \n## 使用 Avatar Masks 和 Animator Controller 层进行行走和瞄准\n\n本教程展示了如何在 Animator Controller\
  \ 中使用 Avatar Masks 和 Layers 在特定身体部位播放动画。在战斗中，这对于在上半身播放瞄准动画并在下半身播放移动动画非常有用。\n\n###\
  \ 准备工作\n\n在本教程中，我们使用 WalkForward、WalkLeft、WalkRight 和 Idle 动画，以及一个循环的 AimForward\
  \ 动画。前四个动画在第 4 章《角色移动》中《使用根运动操控角色》教程中介绍。最后一个是一个简单的循环瞄准动画，我们的角色直视前方瞄准弩。你可以前往 Chapter\
  \ 07 Special effects\\Recipe 07 Using sprite sheets to animate particles 目录。你将在那里找到一个\
  \ Example.unity 场景。打开它并播放游戏。你可以使用 WSAD 键移动角色并用鼠标旋转摄像机。你可以在 Rigs 目录中找到 AimForward\
  \ 动画，所有其他必需的动画都在 Chapter 04 Character movement\\Recipe 03 Using root motion to steer\
  \ a character 目录中。我们还需要一个 Crossbow 道具，你可以在 Props 文件夹中找到它。\n\n### 如何操作...\n\n要使用\
  \ Avatar Masks 和 Layers，请按照以下步骤操作：\n\n- 1. 将角色和弩道具导入 Unity。确保拥有所有必需的动画。\n- 2. 创建一个\
  \ Animator Controller 并将其分配给角色。\n- 3. 按照第 4 章《角色移动》中《使用根运动操控角色》教程使角色移动。\n- 4. 打开\
  \ Animator Controller 并找到 Layers 选项卡。\n- 5. 点击 **Layers** 选项卡附近的加号按钮创建一个新的 **Layer**\
  \ 并命名为 **Aim**。请参考以下截图：\n\n![](img/616a75b593bef4212f618360fceea442_204_0.png)\n\
  \nLayers 选项卡\n- 6. 将 **AimForward** 动画拖放到其中。\n- 7. 点击 **Layer** 中的小齿轮图标。**Layer\
  \ Properties** 窗口将会出现。\n- 8. 找到 **Weight** 滑块并将其拖动到最右边至 1。\n- 9. 在 **Project View**\
  \ 上右键单击并选择 **Create | Avatar Mask** 创建一个新的 **Avatar Mask**。命名为 **AimMask**。\n- 10.\
  \ 点击它并展开 **Humanoid** 折叠面板。\n- 11. 取消选择角色的腿部。请参考以下截图：\n\n![](img/616a75b593bef4212f618360fceea442_205_0.png)\n\
  \n仅上半身开启的 Avatar Mask\n- 12. 返回 Animator Controller，打开 Aim 层的 Layer Properties，并将\
  \ AimMask 分配给 Mask 字段。请参考以下截图：\n\n![](img/616a75b593bef4212f618360fceea442_206_0.png)\n\
  \nAvatar Mask 已分配给 Aim 层\n- 13. 将 RootMotionSteering.cs 脚本分配给角色以使角色行走。你可以在《使用根运动操控角色》教程（Chapter\
  \ 04 Character movement\\Recipe 03 Using root motion to steer a character\\Scripts）中找到它。\n\
  - 14. 播放游戏以查看效果。\n\n### 工作原理...\n\n本教程有几个关键元素使其工作：\n\n- **Layers**：Animator Controller\
  \ 层对于覆盖动画很有用。**Layer Properties** 中的 **Blending** 下拉菜单定义了动画混合的类型。我们可以覆盖动画或使用叠加混合（这将在下一章介绍）。\n\
  - **Layer Weight**：混合层时，Unity 会考虑 **Weight** 参数。权重为 1 表示 100% 覆盖。你可以通过使用 `animator.SetLayerWeight(int\
  \ index, float weight)` 函数在运行时设置权重（`animator` 是保存对 Animator 组件引用的变量）。\n- **Avatar\
  \ Masks**：我们可以创建 Avatar Mask 资源并指定要在其上播放动画的身体部位。然后我们可以在 **Layers** 中使用此 **Avatar\
  \ Mask** 仅覆盖特定身体部位的动画。这样我们可以在上半身播放 **AimForward** 动画，而不在腿部和根部播放。这使得角色在播放 **AimForward**\
  \ 动画时仍能移动。\n\n### 还有更多...\n\n你也可以在 **Layer Properties** 中选择 Sync 选项。它将继承另一个所选层的结构，但你可以更改所有动画。此选项可能有助于为不同角色状态（例如正常/受伤）实现不同类型的动画。\n\
  \n我们在本教程中还使用了 `CameraLook.cs` 脚本。该脚本可以在提供的 Unity 项目的 `Shared Scripts` 文件夹中找到。该脚本与基础摄像机\
  \ rig 配合工作。rig 由三个游戏对象构建：\n\n- **CameraRig**：此游戏对象跟随 `CameraLook.cs` 脚本组件中指定的 Target\
  \ transform。它还根据玩家水平鼠标输入在全局 *Y* 轴上旋转。\n- **CameraPivot**：此游戏对象在其本地 *X* 轴上旋转以上下倾斜摄像机。它响应垂直鼠标输入。\n\
  - **Main Camera**：这是标准的游戏摄像机。它在本地 *Z* 轴上远离 **CameraPivot** 游戏对象。这样我们就有了摄像机的起重机行为。它围绕\
  \ **CameraPivot** 游戏对象轨道移动。\n\n## 使用 LookAt() 方法进行瞄准\n\n在本教程中，我们将使用一种简单但有效的瞄准机制实现。\n\
  \n### 准备工作\n\n我们将使用与上一教程相同的资源。此外，我们将使用在 *第 5 章，角色动作和表情* 中 *Using Quaternion.LookRotation()*\
  \ 和 *Animator.SetLookAtPosition()* 方法使角色注视物体教程中创建的 `CharacterLookAt.cs`。\n\n你也可以使用提供的示例\
  \ Unity 项目并前往 `Chapter 06 Handling combat\\Recipe 08 Using the LookAt method to\
  \ aim` 目录。你将在那里找到一个 `Example.unity` 场景，其中包含一个 **Humanoid** 角色。播放游戏以查看瞄准效果。\n\n\n\
  \n## 如何操作...\n\n使用 `LookAt()` 方法进行瞄准，请按以下步骤操作：\n\n- 1. 将你的角色导入 Unity 并放置在 **场景**\
  \ 中。\n- 2. 按照之前的配方让角色行走并瞄准。\n- 3. 将 `CharacterLookAt.cs` 脚本附加到角色上。\n- 4. 创建一个新的\
  \ **球体** 对象并将其命名为 AimTarget。\n- 5. 将胸骨分配给 `CharacterLookAt.cs` 组件的 **骨骼** 字段。\n\
  - 6. 将 **AimTarget** 分配给 `CharacterLookAt.cs` 组件的 **目标** 字段。\n- 7. 将 **AimTarget**\
  \ 设为 **主摄像机** 游戏对象的子对象。我们在此配方中使用相同的 `CameraLook.cs` 脚本。你可以在提供的示例 Unity 项目的 `Shared\
  \ Scripts` 文件夹中找到该脚本。\n- 8. 将 **AimTarget** 的位置在其局部 Z 轴上偏移约 20 个单位。\n- 9. 运行游戏查看效果。我们的角色将尝试瞄准\
  \ **AimTarget**。你可能需要调整 `CharacterLookAt.cs` 组件中的 **额外旋转** 向量。在我们的示例中，它设置为 X 为 15，Y\
  \ 为 20。\n\n## 工作原理...\n\n我们使用与 *使用 LookRotation() 和 SetLookAtPosition()* 方法中相同的原理，使角色通过注视跟随物体。我们的脚本以这样的方式旋转胸骨，使角色看起来在瞄准目标。我们在\
  \ `CharacterLookAt.cs` 脚本中使用 **额外旋转** 向量来调整旋转（在大多数动画中胸部并非正向前方）。这种瞄准方式适用于角色相对于摄像机行走的游戏（适用于肩上视角的第三人称游戏）。当角色需要旋转超过\
  \ 50-60 度时就会失效。下一个配方解决了这个问题。\n\n## 更多内容...\n\nLookAt() 瞄准最适合与机器人和机器一起使用。它对于实现炮塔非常有用。你可以在场景中找到一个\
  \ Turret 游戏对象。它由三个对象构成：\n\n- - **Turret**：这是 Turret 的底座。\n- - **TurretPivot**：此游戏对象仅在水平方向（Y\
  \ 轴）旋转。这是 Turret 的子对象。\n- - **Gun**：此对象始终指向目标。它是 TurretPivot 的子对象。TurretPivot 在水平方向旋转，因此\
  \ Gun 看起来只在垂直方向旋转。\n\nTurret 游戏对象附加了 TurretAim.cs 脚本。在此脚本的 Update() 函数中，我们首先对公共\
  \ Transform 目标位置进行阻尼并将值保存在 Vector3 dampedTargetPosition 变量中。然后我们使用此变量计算 aimVector，并使用\
  \ aimVector 计算 horizontalAimVector（我们只需移除其 Y 分量）。最后，我们使用 aimVector 和 horizontalAimVector\
  \ 为 TurretPivot 和 Gun 游戏对象（存储在公共 Transform 变量中）计算新的旋转：\n\n```\ndampedTargetPosition\
  \ =\nVector3.SmoothDamp(dampedTargetPosition,\n aimTarget.position, ref dampSpeed,\
  \ dampTime);\n\n aimVector = dampedTargetPosition - turretGun.position;\n\nhorizontalAimVector\
  \ = aimVector;\nhorizontalAimVector.y = 0f;\n\nturretPivot.rotation =\nQuaternion.LookRotation(horizontalAimVector);\n\
  turretGun.rotation = Quaternion.LookRotation(aimVector);\n```\n\n## 使用 Blend Trees\
  \ 进行瞄准\n\n在此配方中，我们将使用一种更复杂的瞄准方法。此方法基于将多个瞄准动画组合到 Blend Tree 中。\n\n## 准备工作\n\n我们将使用与上一个配方相同的资源，但不使用\
  \ `CharacterLookAt.cs` 脚本，而是使用额外的动画：**AimForward**、**AimForwardUp**（向上瞄准 45 度）、**AimForwardDown**（向下\
  \ 45 度）、**AimLeft**（向左 45 度）、**AimLeftUp**（向左 45 度且向上 45 度）、**AimLeftDown**（向左 45\
  \ 度且向下 45 度）、**AimRight**（向右 45 度）、**AimRightDown**（向右 45 度且向下 45 度）、**AimRightUp**（向右\
  \ 45 度且向上 45 度）。请参阅以下截图作为参考：\n\n![](img/616a75b593bef4212f618360fceea442_210_0.png)\n\
  \n九个方向的瞄准动画\n\n你也可以使用提供的示例 Unity 项目并进入 `Chapter 06 Handling combat\\Recipe 09 Using\
  \ blend trees to aim` 目录。你将在那里找到一个 `Example.unity` 场景，其中有一个 **人形** 角色。运行游戏查看效果。你可以在\
  \ `Rigs` 目录中找到所有必要的动画。\n\n## 如何操作...\n\n使用 **Blend Trees** 方法进行瞄准，请按以下步骤操作：\n\n\
  - 1. 将带有所有必要动画的角色导入 Unity 并放置在 **场景** 中。\n- 2. 按照 *使用 Avatar Masks 和动画控制器层行走和瞄准*\
  \ 配方让角色行走并瞄准。\n- 3. 打开控制器并进入 **瞄准层**。\n- 4. 删除 **AimForward** 状态并创建一个新的 **混合树**。\n\
  - 5. 创建两个浮点参数：**AimVer** 和 **AimHor**。\n- 6. 将 **混合类型** 设置为 **自由形式笛卡尔**。\n- 7. 将\
  \ **混合树** 的第一个参数设置为 **AimHor**，第二个设置为 **AimVer**。\n- 8. 在 **混合树** 中创建九个 **动作字段**\
  \ 并将所有瞄准动画分配给它们。\n- 9. 按如下方式设置 **动作字段**（同时参阅以下截图作为参考）：\n- - **AimLeftDownPos X**\
  \ 设置为 -45，**Pos Y** 设置为 -45\n- - **AimLeftPos X** 设置为 -45，**Pos Y** 设置为 0\n- - **AimLeftUpPos\
  \ X** 设置为 -45，**Pos Y** 设置为 45\n- - **AimForwardDownPos X** 设置为 0，**Pos Y** 设置为\
  \ -45\n- - **AimForwardPos X** 设置为 0，**Pos Y** 设置为 0\n- - **AimForwardUpPos X**\
  \ 设置为 0，**Pos Y** 设置为 45\n- - **AimRightDownPos X** 设置为 45，**Pos Y** 设置为 -45\n-\
  \ - **AimRightPos X** 设置为 45，**Pos Y** 设置为 0\n- - **AimRightUpPos X** 设置为 45，**Pos\
  \ Y** 设置为 45\n\n![](img/616a75b593bef4212f618360fceea442_211_0.png)\n\n瞄准混合树设置\n\
  \n- 10. 创建一个新的 **球体** 对象并将其命名为 **AimTarget**。\n- 11. 将 **AimTarget** 设为 **主摄像机**\
  \ 游戏对象的子对象。我们在此配方中使用相同的 `CameraLook.cs` 脚本。你可以在提供的示例 Unity 项目的 `Shared Scripts`\
  \ 文件夹中找到该脚本。\n- 12. 将 **AimTarget** 的位置在其局部 Z 轴上偏移约 20 个单位。\n- 13. 创建一个新脚本并将其命名为\
  \ `AimWithBlendTree.cs`。在此脚本的 `Update()` 函数中，我们首先计算 `aimVector`。这是一个从辅助 `aimNode`\
  \ 变换到 `target` 变换的向量。然后我们使用此向量计算 `horAimVector`，即用于瞄准的水平向量。然后我们使用 `horAimVector`\
  \ 计算 `aimHor` 角度。我们使用 `Vector3.Angle()` 方法找到 `horAimVector` 与 `transform.forward`\
  \ 轴之间的角度，并使用 `Mathf.Sign()` 与 `Vector3.Dot()` 来确定角度的符号。我们以类似的方式计算 `aimVer` 角度，但使用\
  \ `horAimVector` 而不是 `transform.forward` 轴。最后，我们在控制器中分配 **AimVer** 和 **AimHor**\
  \ 参数：\n- 14. 将脚本分配给角色。将 **AimTarget** 变换拖放到脚本的 **Target** 字段中。\n- 15. 创建一个空游戏对象并将其命名为\
  \ **AimNode**。将其放置在角色胸部的大致位置并使其成为角色变换的子对象。\n- 16. 将 **AimNode** 变换分配给脚本的 **Aim Node**\
  \ 字段。你可以使用 **AimNode** 来调整 `aimVector` 计算。\n- 17. 运行游戏查看效果。\n\n```\naimVector =\
  \ target.position - aimNode.position;\n\nhorAimVector = aimVector;\nhorAimVector.y\
  \ = 0f;\n\n aimHor = Vector3.Angle(horAimVector, transform.forward) *\nMathf.Sign(Vector3.Dot(horAimVector,\
  \ transform.right));\n\n aimVer = Vector3.Angle(horAimVector, aimVector) *\nMathf.Sign(Vector3.Dot(aimVector,\
  \ Vector3.up));\n\nanim.SetFloat(\"AimHor\", aimHor, aimSmooth, Time.deltaTime);\n\
  anim.SetFloat(\"AimVer\", aimVer, aimSmooth, Time.deltaTime);\n```\n\n## 工作原理...\n\
  \n我们使用与 `Chapter 4` 中 *使用根运动创建飞行角色* 配方中使用的类似原理，*角色移动*。我们的脚本计算目标与角色前向轴之间的角度。然后它将这些角度作为参数分配给控制器。混合树使用这些参数在九个方向的瞄准动画之间进行混合。\n\
  \n## 更多内容...\n\n你可以进一步使用额外的动画开发此配方以处理更极端的角度。你甚至可以拥有在水平角度上瞄准 +180 和 -180 度的动画。这将使你的角色能够在每个可能的方向上瞄准。\n\
  \n## 检测角色上的命中位置\n\n另一个与动画相关的战斗主题是命中位置检测。此配方展示了如何轻松检测到不同身体部位的命中。\n\n## 准备工作\n\n我们将在此配方中使用一个仅有一个循环\
  \ **Idle** 动画的简单角色。你也可以使用提供的示例 Unity 项目并进入 `Chapter 06 Handling combat\\Recipe 10\
  \ Detecting the hit location on a character` 目录。你将在那里找到一个 `Example.unity` 场景，其中有一个\
  \ **人形** 角色。运行游戏查看效果。\n\n## 如何操作...\n\n能够检测不同身体部位的命中，请按以下步骤操作：\n\n- 1. 将带有所有必要动画的角色导入\
  \ Unity。将它放置在场景中。\n\n\n\n2. 创建一个新的图层并将其命名为 BodyParts。 为此，请转到图层菜单并选择编辑图层选项，如以下屏幕截图所示：\n\
  \n![](img/616a75b593bef4212f618360fceea442_214_0.png)\n\n添加新图层\n\n- 3. 创建一个新脚本并将其命名为\
  \ BodyPart.cs。 在此脚本中仅创建一个 public string bodyPartName 变量。 我们将把它用作身体部位的占位脚本。 您可以在此脚本层中实现给定身体部位击中的自定义效果。\n\
  - 4. 创建一个空游戏对象并将其命名为 Head。\n- 5. 将 BodyPart.cs 脚本分配给 Head 游戏对象。 在 BodyPart.cs 组件的身体部位名称字段中输入\
  \ Head。\n- 6. 为 Head 游戏对象分配一个胶囊碰撞体组件。\n- 7. 将 Head 图层设置为 BodyParts。\n- 8. 为 Head\
  \ 游戏对象添加一个 Rigidbody 组件并将其设置为 Is Kinematic。\n\n- 9. 转到 **编辑** | **项目设置** | **物理**\
  \ 菜单。 取消选中 **BodyParts <-> BodyParts** 图层之间以及 **BodyParts <-> Default** 图层之间的碰撞，如以下屏幕截图所示：\n\
  - 10. 在角色骨架的层级结构中找到头部骨骼。 将 **Head** 游戏对象拖放到头部骨骼上以将其设为父级。\n- 11. 将 **Head** 的变换的旋转和位置归零。\n\
  - 12. 调整 **Capsule Collider's** 设置，使其大致包围角色的头部形状。\n- 13. 复制 **Head** 游戏对象并将其命名为\
  \ **Chest**。 在 `BodyPart.cs` 组件的 **身体部位名称** 中输入 **Chest**。\n- 14. 将 **Chest** 游戏对象拖放到角色骨架层级结构中的胸部骨骼上。\n\
  - 15. 将 **Chest's** 位置和旋转归零。\n- 16. 调整 **Chest's Capsule Collider** 属性，使其大致匹配角色胸部的形状。\n\
  \n![](img/616a75b593bef4212f618360fceea442_215_0.png)\n\nBodyParts 图层的碰撞矩阵\n\n17.\
  \ 对所有身体部位重复步骤 13 到 16。 在此示例中，我们创建了 **Head**、**Chest**、**ArmL**（以及前臂的副本）、**ArmR**（以及前臂的副本）、**LegL**（以及小腿的副本）、**LegR**（以及小腿的副本）和\
  \ **Groin**。 请参阅以下屏幕截图以供参考：\n\n![](img/616a75b593bef4212f618360fceea442_216_0.png)\n\
  \n被碰撞体包围的身体部位\n\n18. 所有身体部位都会随角色一起移动。 它们彼此之间或与 **Default** 图层不发生碰撞。 这可以防止角色的物理行为变得奇怪。\
  \ 您可能还需要在游戏中为其他图层关闭碰撞。\n\n19. 我们将使用附加到摄像机的简单脚本来检测身体部位的命中。 创建一个新脚本并将其命名为 `Shoot.cs`。\
  \ 在此脚本的 `Update()` 函数中，我们不断从摄像机的前向轴发射射线。 我们使用带有 **LayerMask** 参数的 `Physics.Raycast()`\
  \ 实现。 这使我们只能命中具有适当图层的碰撞体。 如果我们命中了这样的碰撞体，我们将检查它是否附加了 `BodyPart.cs` 组件。 如果是，我们将屏幕上的\
  \ UI 文本设置为我们命中的身体部位的名称：\n\n```\nTransform cameraTransform = Camera.main.transform;\n\
  \nif (Physics.Raycast(cameraTransform.position,\ncameraTransform.forward, out hit,\
  \ maxDistance,\nbodyPartsLayer))\n```\n\n```\n{\n    BodyPart p =\n    hit.collider.gameObject.GetComponent<BodyPart>();\n\
  \    if (p != null)\n    {\n        bodyPartText.text = \"Hit body part: \" +\n\
  \        p.bodyPartName;\n    }\n    else\n    {\n        bodyPartText.text = \"\
  No body part was hit\";\n    }\n}\nelse\n{\n    bodyPartText.text = \"No body part\
  \ was hit\";\n}\n```\n\n- 20. 将脚本附加到摄像机。\n- 21. 在场景中创建一个 UI Text 并将其附加到 `BodyPart.cs`\
  \ 组件的 **身体部位文本** 字段。\n- 22. 将 `BodyPart.cs` 组件中的 **身体部位图层** 图层掩码设置为 **BodyParts**。\n\
  - 23. 将任何自由视角脚本附加到摄像机； 您也可以使用 `Shared Scripts` 文件夹中的 `CameraLook.cs` 脚本。\n- 24.\
  \ 播放游戏以查看效果。\n\n## 它是如何工作的...\n\n我们使用 Unity 的 **Hierarchy** 将碰撞体附加到角色骨架中的骨骼上。 这样我们就可以检查这些身体部位的碰撞并通过脚本对其做出反应。\
  \ 为了使本配方简单，我们只在 UI 上显示命中的身体部位名称，但您可以轻松实现对特定身体部位命中的复杂反应。 例如，您可以为头部射击实现额外的伤害，甚至是复杂的伤口系统。\n\
  \n## 还有更多...\n\n我们已使用 `Physics.Raycast()` 方法介绍了命中检测，这对于瞄准身体部位或快速移动的投射物很有用。 但您也可以同样轻松地在近战中实现身体部位检测。\
  \ 您需要做的就是在 `BodyPart.cs` 脚本或附加到武器的新脚本中实现 `void OnCollisionEnter(Collision collision)`\
  \ 方法（它需要具有 **Collider** 和设置为 **Is Kinematic** 的 **Rigid Body** 组件）。 然后您必须检查进入的碰撞对象是否附加了适当的脚本或标签，以确定是否击中了身体部位。\n"
- "## 7\n\n## 特殊效果\n\n本章解释了如何通过动画实现有趣的效果，并涵盖以下配方：\n\n- 使用 Animation Events 触发声音和视觉效果\n\
  - 使用 **Animation** 视图和 Animator Controller 创建摄像机抖动\n- 使用 **Animation** 视图为公共脚本变量设置动画\n\
  - 使用 additive Mecanim 层为角色添加额外动作\n- 使用 Blend Shapes 将一个对象变形为另一个对象\n- 使用风发射器为植被和粒子系统创建运动\n\
  - 使用精灵表为粒子设置动画\n- 使用 **Animation** 视图为粒子系统的属性设置动画\n- 使用声音片段的波形为场景中的对象设置动画\n- 使用\
  \ **Animation** 视图创建昼夜循环\n\n### 简介\n\n我们在前几章中学到了很多。 本章的全部内容都是鼓励您尝试 Unity 的动画系统。\
  \ 在接下来的 10 个配方中，我们将创建有趣的效果并以新的创造性方式使用动画。 本章还涵盖了可用于为场景设置动画的 Unity 其他内置功能。\n\n## 使用\
  \ Animation Events 触发声音和视觉效果\n\n本配方展示了一种简单、通用的方法，使用 Animation Events 播放不同的声音和视觉效果。\n\
  \n### 准备工作\n\n开始时，您需要有一个带有循环动画的角色：Jump。 我们还需要一个音效和一个粒子系统。 我们需要一个透明的 DustParticle.png\
  \ 纹理用于粒子系统。 它应类似于一个小尘云。 您可以打开提供的示例 Unity 项目并转到 Chapter 07 Special effects\\Recipe\
  \ 01 Using animation events to trigger sound and visual effects 目录。 在 Rigs 目录中，您将找到所有需要的动画，而在\
  \ Resources 文件夹中，您将找到所有其他必要资源。 当您播放游戏时，您将看到一个角色正在播放 Jump 动画。 着陆时它还会播放音效和粒子效果。\n\n\
  ### 如何操作...\n\n要使用 Animation Events 播放声音和视觉效果，请按照以下步骤操作：\n\n- 1. 导入带有 Jump 动画的角色。\n\
  - 2. 在导入设置中，动画选项卡中，选择 Jump 动画。\n- 3. 使其循环。\n- 4. 转到事件部分。\n- 5. 在预览部分中拖动时间线并单击添加事件按钮。\
  \ 编辑动画事件窗口将出现，如以下屏幕截图所示：\n\n![](img/616a75b593bef4212f618360fceea442_221_0.png)\n\
  \n编辑动画事件窗口\n\n- 6. 在 **函数** 字段中输入 `Sound`，在 **字符串** 字段中输入 `Jump`。 这将在附加到角色的脚本中调用\
  \ **Sound** 函数，并将 **Jump** 单词作为字符串参数传递给它。\n- 7. 创建另一个动画事件。 将 **函数** 字段设置为 **Effect**，将\
  \ **字符串** 字段设置为 **Dust**。\n- 8. 应用 **导入设置**。\n- 9. 为角色创建一个 Animator Controller，其中仅包含\
  \ **Jump** 动画。\n- 10. 将角色放置在场景中。\n- 11. 将控制器附加到角色的 Animator 组件。\n- 12. 为角色附加一个 **音频源**\
  \ 组件。\n- 13. 取消选中 **播放时唤醒** 选项。\n- 14. 创建一个空游戏对象并将其命名为 **Dust**。\n- 15. 为其添加一个 **粒子系统**\
  \ 组件。 这将是我们尘埃效果。\n- 16. 按如下方式设置 **粒子系统** 的参数：\n  - **持续时间** 为 1 秒\n  - **开始生命周期**\
  \ 为 0.5 秒\n  - **开始速度** 为 0.4\n  - **开始大小** 随机介于两个常数之间：1 和 2\n  - **开始颜色** 为浅棕色\n\
  \  - **发射 | 速率** 为 0\n  - **发射 | 爆发** 为一次爆发，时间设置为 0，**最小值** 和 **最大值** 设置为 5\n  -\
  \ **形状 | 形状** 为球体\n\n\n\n-   **形状 | 半径** 调至 0.2\n-   **生命周期颜色**—为 alpha 通道创建渐变。在\
  \ 0% 标记和 100% 标记处，应设置为 0。在 10% 和 90% 标记处，应设置为 255。\n\n17. 创建一个新的 **材质** 并将着色器设置为\
  \ **粒子 | Alpha 混合**。\n\n18. 将 `DustParticle.png` 的透明纹理拖放到 **材质** 的 **纹理** 字段中。\n\
  \n19. 将 **材质** 拖放到我们的 **DustParticle 系统** 的 **渲染器 | 材质** 槽中。\n\n20. 在项目结构中创建一个 `Resources`\
  \ 文件夹。Unity 可以在运行时从 `Resources` 文件夹加载资源，而无需将其作为预制件引用。\n\n21. 将 `Jump.ogg` 音效和 **Dust**\
  \ 游戏对象拖放到 `Resources` 文件夹中。\n\n22. 编写一个新脚本并将其命名为 `TriggerEffects.cs`。\n\n23. 此脚本有两个\
  \ public void 函数。两者都作为 Animation Events 从 **Jump** 动画中调用。在第一个函数中，我们从 `Resources`\
  \ 文件夹加载一个 Audio Clip。我们在 Animation Event 本身中将 `Audio Clip` 名称设置为字符串参数（设置为 **Jump**）。当我们成功加载\
  \ `Audio Clip` 时，我们使用 Audio Source 组件播放它，其引用我们存储在 `source` 变量中。我们还随机化 Audio Source\
  \ 的音高，以便在播放 `Jump.ogg` 音效时产生一点变化：\n\n```csharp\npublic void Sound (string soundResourceName)\
  \ {\n    AudioClip clip = (AudioClip)\n    Resources.Load(soundResourceName);\n\
  \    if (clip != null)\n    {\n        source.pitch = Random.Range(0.9f, 1.2f);\n\
  \        source.PlayOneShot(clip);\n    }\n}\n```\n\n24. 在第二个函数中，我们尝试加载一个以函数参数指定的名称的预制件。我们也在\
  \ Animation Event 中设置此名称（设置为 **Dust**）。如果我们成功加载预制件，我们将实例化它，在角色脚下创建尘埃效果：\n\n```csharp\n\
  public void Effect (string effectResourceName) {\n    GameObject effectResource\
  \ =\n    (GameObject) Resources.Load(effectResourceName);\n    if (effectResource\
  \ != null)\n    {\n        GameObject.Instantiate(effectResource,\n        transform.position,\
  \ Quaternion.identity);\n    }\n}\n```\n\n25. 将脚本分配给我们的角色并播放游戏以查看效果。\n\n### 它是如何工作的...\n\
  \n我们在此配方中使用 Animation Events 的一个重要功能：可以将字符串、int 或 float 参数传递给脚本的函数。这样我们就可以创建一个函数来播放与角色关联的所有音效，并从\
  \ Animation Events 将剪辑名称作为字符串参数传递。相同的概念也用于生成 Dust 效果。\n\nResources 文件夹是使用 Resources.Load(string\
  \ path) 函数获取任何资源（预制件、纹理、音频剪辑等）所必需的。此方法使用其名称加载资源非常方便。\n\n### 还有更多...\n\n我们的 Dust\
  \ 效果附加了 AutoDestroy.cs 脚本，使其在一段时间后消失。您可以在提供的示例 Unity 项目的 Shared Scripts 文件夹中找到该脚本。\n\
  \n## 使用动画视图和 Animator Controller 创建摄像机抖动\n\n在本配方中，我们将使用一种简单但非常有效的方法来创建摄像机抖动。这些效果通常用于强调游戏中的冲击或爆炸。\n\
  \n### 准备工作\n\n本配方不需要任何特殊内容。我们将在 Unity 中从头开始创建所有内容。您也可以下载提供的示例 Unity 项目并前往 Chapter\
  \ 07 Special effects\\Recipe 02 Creating camera shakes with the animation window\
  \ and the animator controller 目录。当您打开 Example.unity 场景并播放游戏时，您可以按空格键查看简单的摄像机抖动效果。\n\
  \n### 如何操作...\n\n要创建摄像机抖动效果，请按照以下步骤操作：\n\n-   1. 在场景视图中创建一个空游戏对象并将其命名为 CameraRig。\n\
  -   2. 将 Main Camera 作为父对象挂载到 CameraRig 下。\n-   3. 选择 Main Camera 并为其添加一个 Animator\
  \ 组件。\n-   4. 打开动画视图。\n-   5. 创建一个新的动画剪辑并将其命名为 CamNormal。摄像机在此剪辑中不应有任何运动。为摄像机的位置和旋转添加关键帧。\n\
  -   6. 创建另一个动画剪辑并将其命名为 CameraShake。动画化摄像机的旋转和位置以创建抖动效果。动画时长应约为 0.5 秒。\n-   7. 打开自动创建的\
  \ Main Camera 控制器。\n-   8. 添加一个 Shake Trigger 参数。\n-   9. 创建两个过渡：\n  -   CamNormal\
  \ | CameraShake 条件为：Shake Trigger 参数。应将 Has Exit Time 设置为 false，并将 Transition Duration\
  \ 设置为 0.2 秒。\n  -   CameraShake | CamNormal 无条件：应将 Has Exit Time 设置为 true，并将 Transition\
  \ Duration 设置为 0.2 秒。\n-   10. 编写一个新脚本并将其命名为 CamShake.cs。\n-   11. 在此脚本的 Update()\
  \ 函数中，我们检查玩家是否按下了空格键。如果是，我们在控制器中触发 Shake Trigger：\n\n```csharp\nif (Input.GetKeyDown(KeyCode.Space))\n\
  {\n    anim.SetTrigger(\"Shake\");\n}\n```\n\n-   12. 如同往常一样，`anim` 变量保存对 Animator\
  \ 组件的引用，并在 `Start()` 函数中使用 `GetComponent<Animator>()` 方法进行设置。\n-   13. 将脚本分配给 Main\
  \ Camera。\n-   14. 播放游戏并按空格键查看效果。\n\n### 它是如何工作的...\n\n在本配方中，我们已相对于 **CameraRig**\
  \ 对象动画化摄像机的位置和旋转。这样我们仍然可以移动 **CameraRig**（或将其附加到角色）。\n我们的 **CameraShake** 动画仅影响摄像机的局部位置和旋转。在脚本中，我们只需调用\
  \ `Shake Trigger` 一次播放 **CameraShake** 动画。\n\n### 还有更多...\n\n您可以使用 **BlendTrees**\
  \ 创建更复杂的摄像机抖动效果。为此，准备几个具有不同强度的抖动动画，并在 **Blend Tree** 中使用 **Strength** `float` 参数进行混合。这样，您就可以根据游戏中的不同情况设置抖动的强度（例如距离爆炸的距离）。\n\
  \n## 使用动画视图动画化公共脚本变量\n\n在 Unity 中，我们可以动画化公共脚本变量。大多数标准类型都受支持。我们可以利用这一点实现无法直接实现的有趣效果。例如，我们可以动画化雾的颜色和密度，而这些在动画视图中无法直接访问。\n\
  \n### 准备工作\n\n在本配方中，所有内容都将从头开始创建，因此您无需准备任何特殊资源。您也可以使用示例项目并前往 `Chapter 07 Special\
  \ effects\\Recipe 03 Using the animation window to animate public script variables`\
  \ 目录。您可以在那里找到 `Example.unity` 场景。如果您打开它并按空格键，您可以观察雾的颜色和密度发生变化。\n\n这是通过动画化脚本的公共变量实现的。\n\
  \n![](img/616a75b593bef4212f618360fceea442_226_0.png)\n\n动画化雾\n\n### 如何操作...\n\n\
  要动画化公共脚本变量，请按照以下步骤操作：\n\n-   1. 创建一个新脚本并将其命名为 `FogAnimator.cs`。\n-   2. 在此脚本中创建两个公共变量：`public\
  \ float fogDensity` 和 `public Color fogColor`。\n-   3. 在此脚本的 `Update()` 函数中，当玩家按下空格键时，我们在控制器中调用\
  \ **ChangeFog** Trigger。我们还使用公共变量设置 `RenderSettings.fogColor` 和 `RenderSettings.fogDensity`\
  \ 参数。我们还调整 **Main Camera** 的背景颜色以匹配雾的颜色：\n\n```csharp\nif (Input.GetKeyDown(KeyCode.Space))\n\
  {\n    anim.SetTrigger(\"ChangeFog\");\n}\nRenderSettings.fogColor = fogColor;\n\
  RenderSettings.fogDensity = fogDensity;\n\nCamera.main.backgroundColor = fogColor;\n\
  ```\n\n-   4. 创建一个新的游戏对象并将其命名为 `FogAnimator`。\n-   5. 将 `FogAnimator.cs` 脚本附加到它。\n\
  -   6. 选择 **FogAnimator** 游戏对象并为其添加一个 Animator 组件。\n-   7. 打开 **Animation** 视图。\n\
  -   8. 创建一个新的动画剪辑。\n-   9. 确保记录按钮已按下。\n-   10. 通过更改其值，为公共 float `fogDensity` 和公共\
  \ Color `fogColor` 参数创建动画。\n-   11. 您可以创建任意数量的动画，并在自动创建的 Animator Controller 中通过基于\
  \ **ChangeFog** Trigger 的过渡连接它们（您需要先将此参数添加到控制器）。\n-   12. 以下是一个示例控制器：\n\n![](img/616a75b593bef4212f618360fceea442_227_0.png)\n\
  \n示例控制器用于不同的雾动画\n\n-   13. 请记住，您无需创建雾颜色或密度变化的动画。您可以依赖控制器中动画之间的混合。您只需要为每个动画中的密度和颜色各设置一个关键帧即可。在此示例中，所有\
  \ **Transition Durations** 都设置为 1 秒，并且每个过渡的 **Has Exit Time** 参数都设置为 false。\n- \
  \  14. 确保在 **Lighting** 设置中启用了雾。\n-   15. 播放游戏并按空格键查看效果。\n\n\n\n### 如何工作...\n\n\
  通常，我们无法使用 **Animation** 视图来动画化雾的颜色或密度。但我们可以通过一个脚本轻松实现，该脚本每帧设置 `RenderSettings.fogColor`\
  \ 和 `RenderSettings.fogDensity` 参数。我们使用动画随时间改变脚本的公共变量值。这样我们就在 Unity 中为雾动画创建了一个变通方法。\n\
  \n我们才刚刚触及通过动画化脚本公共变量所能实现的功能的表面。尝试实验以实现出色的效果。\n\n## 使用叠加的 Mecanim 层为角色添加额外动作\n\n\
  在之前的食谱中，我们使用覆盖模式的 Mecanim 层。我们可以将一个层设置为叠加。这可以为我们的基础层动画添加额外的移动。\n\n### 准备工作\n\n我们需要一个具有三个动画的角色：**Idle**、**TiredReference**\
  \ 和 **Tired**。**Idle** 动画是一个正常的、静止的待机。**TiredReference** 动画没有动作，并用作计算 **Tired**\
  \ 动画叠加运动的参考姿势。**TiredReference** 动画可以是 **Tired** 动画的第一帧。在 **Tired** 动画中，我们的角色正在大口呼吸。\n\
  \n你也可以进入 `Chapter 07 Special effects\\Recipe 04 Using additive mecanim layers to\
  \ add extra motion to a character` 目录。打开那里的 `Example.unity` 场景。你会在那里找到相同的 **Humanoid**\
  \ 角色。如果播放游戏并按下空格键，我们的角色会在继续播放 **Idle** 动画的同时开始大口呼吸。你可以在 `Rigs` 目录中找到所有需要的动画。\n\n\
  ### 如何操作...\n\n要使用叠加层，请按照以下步骤操作：\n\n- 1. 将角色导入 Unity 并放置到场景中。\n- 2. 在 **Import Settings**\
  \ 中进入 **Animation** 选项卡。\n- 3. 找到 **TiredReference** 动画并勾选 **Additive Reference\
  \ Pose** 选项（你也可以使用普通的 **Tired** 动画并在 **Pose Frame** 字段中指定帧）。\n- 4. 循环 **Idle** 和\
  \ **Tired** 动画。\n- 5. 创建一个新的 Animator Controller。\n- 6. 将 **Idle** 动画拖放到控制器中并使其成为\
  \ **Default** 状态。\n- 7. 在 **Animator** 窗口左上角找到 **Layers** 选项卡。\n- 8. 选择它并点击下方的加号按钮添加一个新层。\n\
  - 9. 将新创建的层命名为 **Tired**。\n- 10. 点击 **Gear** 图标并将 **Blending** 设置为 **Additive**，如下图所示：\n\
  - 11. 将 **Tired** 动画拖放到新创建的层上。\n- 12. 将控制器分配给我们的角色。\n\n![](img/616a75b593bef4212f618360fceea442_229_0.png)\n\
  \n叠加层设置\n\n- 13. 创建一个新脚本并命名为 Tired.cs。在此脚本的 Update() 函数中，我们在玩家按下空格键时设置 Tired 层的权重。Tired\
  \ 层的索引为 1。我们使用辅助变量 weightTarget 根据其当前值将新权重设置为 0 或 1。这使我们每次玩家按下空格键时都可以打开和关闭叠加层。最后，我们随时间插值权重值以使过渡更平滑，并使用\
  \ SetLayerWeight() 函数设置我们的叠加层的权重：\n```\nif (Input.GetKeyDown(KeyCode.Space))\n{\n\
  \    if (weightTarget < 0.5f)\n    {\n        weightTarget = 1f;\n    }\n    else\
  \ if (weightTarget > 0.5f)\n    {\n        weightTarget = 0f;\n    }\n}\nweight\
  \ = Mathf.Lerp(weight, weightTarget, Time.deltaTime * tiredLerpSpeed);\n\nanim.SetLayerWeight(1,\
  \ weight);\n```\n- 14. 将脚本附加到 Humanoid 角色上。\n- 15. 播放游戏并按下空格键以查看叠加动画效果。\n\n### 如何工作...\n\
  \n叠加动画是使用参考姿势计算的。相对于此姿势的移动随后会添加到其他动画中。这样我们不仅可以用其他层覆盖基础层，还可以通过添加次要运动来修改基础运动。\n\n\
  尝试使用不同的叠加动画进行实验。你可以例如让角色弯腰、瞄准或改变其整体身体姿势。\n\n## 使用 Blend Shapes 将一个物体变形为另一个物体\n\n\
  之前，我们使用 Blend Shapes 来创建面部表情。Blend Shapes 也是特殊效果的优秀工具。在本食谱中，我们将把一个物体变形为另一个物体。\n\n\
  ### 准备工作\n\n要遵循本食谱，我们需要准备一个带有 Blend Shapes 的物体。我们在 Blender 中创建了一个非常简单的示例——一个细分立方体，具有一个看起来像球体的形状键。参考以下截图：\n\
  \n![](img/616a75b593bef4212f618360fceea442_231_0.png)\n\n一个带有 Blend Shape 的立方体，可将其变为球体\n\
  \n你也可以进入 Chapter 07 Special effects\\Recipe 05 Using blendshapes to morph an object\
  \ into another one 目录。打开那里的 Example.unity 场景。你会看到一些立方体。如果在播放模式下按下空格键，立方体会变形为球体。你可以在\
  \ Model 目录中找到带有所需 Blend Shapes 的 Cuboid.fbx 资源。\n\n### 如何操作...\n\n要使用 Blend Shapes\
  \ 使物体变形，请按照以下步骤操作：\n\n- 1. 将至少带有一个 Blend Shape 的模型导入 Unity。你可能需要进入 Import Settings\
  \ 的 Model 选项卡并选择 Import BlendShapes。\n- 2. 将模型放置到场景中。\n- 3. 创建一个新脚本并命名为 `ChangeShape.cs`。此脚本与上一食谱中的脚本类似。在\
  \ `Update()` 函数中，我们在玩家按下空格键时更改第一个 Blend Shape 的权重。同样，我们使用辅助变量 `weightTarget` 根据其当前值将新的\
  \ `weight` 设置为 0 或 100。Blend Shapes 的权重范围为 0 到 100 而不是 1。最后，我们随时间插值 `weight` 值以使过渡更平滑。我们在\
  \ `skinnedRenderer` 对象上使用 `SetBlendShapeWeight()` 函数。此变量在 `Start()` 函数中通过 `GetComponent<SkinnedMeshRenderer>()`\
  \ 函数设置：\n```\nif (Input.GetKeyDown(KeyCode.Space))\n{\n    if (weightTarget < 50f)\n\
  \    {\n        weightTarget = 100f;\n    }\n    else if (weightTarget > 50f)\n\
  \    {\n        weightTarget = 0f;\n    }\n}\nweight = Mathf.Lerp(weight, weightTarget,\
  \ Time.deltaTime * blendShapeLerpSpeed);\nskinnedRenderer.SetBlendShapeWeight(0,\
  \ weight);\n```\n- 4. 将脚本附加到场景中的模型上。\n- 5. 播放游戏并按下空格键以查看模型变形。\n\n### 如何工作...\n\n\
  Blend Shapes 存储网格的顶点位置。我们必须在 3D 软件包中创建它们。Unity 导入 Blend Shapes，我们可以使用 `SetBlendShapeWeight()`\
  \ 函数在运行时修改其权重，该函数位于 **Skinned Mesh Renderer** 组件上。我们也可以使用动画，如 *Chapter 5, Characters\
  \ Actions and Expressions* 中 *Animating facial expressions with Blend Shapes* 食谱所示。\n\
  \n![](img/616a75b593bef4212f618360fceea442_232_0.png)\n\nBlend Shapes 在存储 **Normals**\
  \ 时存在问题。如果我们从模型导入 **Normals**，变形后可能看起来很奇怪。有时，在 **Import Settings** 中将 **Normals**\
  \ 选项设置为 **Calculate** 可以帮助解决问题。如果我们选择此选项，Unity 将根据模型面之间的角度计算 **Normals**。这使我们能够在本示例中将硬表面立方体变形为光滑球体。\n\
  \n## 使用风发射器为植被和粒子系统创建运动\n\nUnity 支持风发射器，我们可以用它为植被和粒子创建逼真的效果。使用它们非常简单。\n\n### 准备工作\n\
  \n要遵循本食谱，你需要一个粒子系统和一个使用 Unity 内置 **Tree Creator** 创建的树。你可以打开提供的示例项目并进入 `Chapter\
  \ 07 Special effects\\Recipe 06 Using wind emitters to create motion for foliage\
  \ and particle systems` 目录。在那里的 `Example.unity` 场景中，你可以找到一棵树和一个简单的粒子系统（落叶）。播放游戏以查看树和粒子随风移动。\n\
  \n![](img/616a75b593bef4212f618360fceea442_233_0.png)\n\n带落叶粒子系统的树。两者均由 WindZone\
  \ 驱动动画\n\n### 如何操作...\n\n要使用 Unity 的风，请按照以下步骤操作：\n\n- 1. 将树和粒子系统放置到场景中。\n- 2. 创建一个新的\
  \ **WindZone**。为此，请进入 **GameObject** | **3D Object** | **Wind Zone** 选项。\n\n\n\n\
  3. 树在游戏运行时会移动，但粒子系统需要进行调整。\n4. 要使粒子系统对风产生反应，请打开其属性并勾选 **External Forces** 选项。\n\
  5. 点击展开它。你可以编辑 **Multiplier** 字段来增加或减少风的影响。\n6. 如果不确定粒子是否对风产生反应，请将其 **Start Speed**\
  \ 设置为 0。\n7. 运行游戏查看效果。\n\n## 工作原理...\n\nWind Zones 是 Unity 内置的功能，可用于动画化植被和粒子系统。Wind\
  \ Zone 有两种类型：\n\n- **Directional**：这是整个场景的全局风（仍然可以有多个）。它朝一个方向吹。\n- **Spherical**：此类型具有一个\
  \ **Radius**，在该半径内影响粒子和树。适用于直升机和爆炸效果。\n\nWind Zones 由一系列参数描述，定义风的强度：\n\n- **Main**：这是主要的风力。它会随时间缓慢变化。\n\
  - **Turbulence**：产生快速变化的力，有助于创建风暴。\n- **Pulse Magnitude**：描述风随时间变化的幅度。\n- **Pulse\
  \ Frequency**：描述风变化的频率。\n\n![](img/616a75b593bef4212f618360fceea442_234_0.png)\n\
  \n请记住，你可以使用 **Animation** 视图为 Wind Zone 的参数制作动画。这能让你在时间上控制风的变化方式。例如，你可以为爆炸创建强烈的球形风，并让\
  \ **Main** 和 **Turbulence** 参数的动画快速淡出。你还可以为 Wind Zone 的旋转和/或位置制作动画（仅适用于 Spherical\
  \ 类型）以改变效果。\n\n## 使用精灵表为粒子制作动画\n\n我们可以为 Unity 的粒子添加精灵表动画，使其更具趣味性。这个概念对于各种爆炸和魔法效果尤其有用。\n\
  \n### 准备工作\n\n要按照本教程操作，我们需要一个导出为精灵表的动画。如果你想了解如何创建精灵表动画，可以阅读 `Chapter 3` 中 *Exporting\
  \ a 2D sprite animation from a 3D package* 教程，2D 和用户界面动画，其中包含示例精灵动画。\n\n![](img/616a75b593bef4212f618360fceea442_235_0.png)\n\
  \n示例精灵表动画\n\n你也可以打开提供的示例项目并进入 `Chapter 07 Special effects\\Recipe 07 Using sprite\
  \ sheets to animate particles` 目录。如果在那里打开 `Example.unity` 场景并运行游戏，你将看到使用精灵表动画的爆炸粒子系统。必要的精灵表可以在\
  \ `Rigs` 目录中找到。\n\n### 操作方法...\n\n要使用精灵表为粒子制作动画，请按照以下步骤操作：\n\n1. 将精灵表纹理导入 Unity。其尺寸应为\
  \ 2 的幂。动画应从左到右、从上到下以相等的小块渲染（128 × 128、256 × 256 或类似）。\n2. 将其设为普通的 **Texture**（不是\
  \ Sprite）并勾选 **Alpha Is Transparency** 选项。\n3. 创建一个新的 **Material** 并将其命名为 `Explosion`。\n\
  4. 将 **Shader** 设置为 **Particles | Alpha Blended**（你也可以使用 Additive 或 Additive Soft）。\n\
  5. 将纹理拖放到 **Material** 中的 **Particle Texture** 槽位。\n6. 在场景中创建一个空的游戏对象并将其命名为 `AnimatedExplosion`。\n\
  7. 为其添加 **Particle System** 组件。\n8. 将 **Explosion** 材质拖放到 **Renderer | Material**\
  \ 槽位。\n9. 勾选 **Texture Sheet Animation** 选项并展开它。\n10. 根据导出的精灵表设置 **Tile's X** 和\
  \ **Y** 字段。在我们的示例中，该表在 **X** 方向有 **8** 个图块，在 **Y** 方向有 **4** 个，如下图所示：\n\n![](img/616a75b593bef4212f618360fceea442_236_0.png)\n\
  \n纹理表动画设置\n\n11. 调整粒子的 **Start Lifetime** 以匹配导出的精灵表动画的帧率。如果导出的动画持续 1 秒，则粒子的 **Start\
  \ Lifetime** 也应等于 1 秒。\n12. 根据喜好调整粒子系统的其他设置。在本示例中，这些设置如下：\n    - **Start Lifetime**:\
  \ 1\n    - **Looping**: True\n    - **Start Speed**: 0\n    - **Start Size**: 5\n\
  \    - **Emission** | **Rate**: 1\n    - **Shape** | **Shape**: Sphere\n    - **Shape**\
  \ | **Radius**: 4\n\n13. 运行游戏或模拟粒子系统以查看效果。\n\n### 工作原理...\n\nUnity 的粒子系统可以为每个粒子播放精灵表动画。为此，必须勾选\
  \ **Texture Sheet Animation** 选项。该选项有几个重要的设置：\n\n- **Tiles**：**X** 和 **Y** 字段指定纹理表在\
  \ **X** 和 **Y** 方向上有多少个图块。动画从左到右、从上到下播放。\n- **Animation**：我们可以使用整张表或单行。如果选择 **Single\
  \ Row** 选项，我们可以使用精灵表的随机行或指定动画的单行。这样我们可以在一张精灵表中拥有多个动画。它还使我们可以在一个粒子系统中拥有多个动画，而不是为每个粒子播放相同的动画（必须勾选\
  \ **Random Row** 才能实现此功能）。\n- **Frame Over Time**：这是描述随时间应播放哪个帧的曲线。请记住，默认情况下，整个精灵表始终在粒子的整个生命周期内播放。\n\
  - **Cycles**：在这里可以指定在粒子一个生命周期内应播放动画的循环次数。\n\n## 使用 Animation 视图为粒子系统的属性制作动画\n\n\
  本教程展示如何使用 Animation 视图为粒子系统的属性制作动画。并非所有属性都可以通过 **Animation** 视图直接访问，但我们将使用与 *Using\
  \ the Animation View to animate public script variables* 教程中雾效果相同的技巧。\n\n### 准备工作\n\
  \n本教程在 Unity 中从零开始创建；你不需要任何特殊资源。在开始之前，你应该准备好一个粒子系统。你可以进入 `Chapter 07 Special effects\\\
  Recipe 08 Animating properties of a particle system with the animation window` 目录。那里有一个\
  \ `Example.unity` 场景。打开它并运行游戏，即可看到具有动画属性的粒子系统。\n\n### 操作方法...\n\n要为粒子系统属性制作动画，请按照以下步骤操作：\n\
  \n1. 创建一个空的游戏对象并将其命名为 **AnimatedParticleSystem**。\n2. 为其添加 **Particle System** 组件。\n\
  3. 按需创建粒子系统。在本示例中，我们有一个非常简单的粒子系统，粒子沿直线飞行。\n4. 向 **AnimatedParticleSystem** 游戏对象添加\
  \ **Animator** 组件。\n5. 创建 **Emission | Rate** 参数的动画。只能直接为粒子系统的 **Emission Module**\
  \ 和 **Shape Module** 制作动画。\n6. 要为其他属性制作动画，请创建一个新脚本并将其命名为 `ParticleAnims.cs`。在此脚本中，我们有两个公共变量：`public\
  \ float gravityModifier` 和 `public Color color`。我们在 `Update()` 函数中使用这些变量来设置粒子系统的\
  \ `gravityModifier` 和 `startColor` 属性。Particle System 组件的引用在 `Start()` 函数中设置并存储在\
  \ `particles` 变量中：\n7. 将脚本分配给 **AnimatedParticleSystem** 游戏对象。\n8. 再次打开 **Animation**\
  \ 视图并为脚本的 **Color** 和 **Gravity Modifier** 公共字段制作动画。这样我们就可以创建一个变通方法来为无法从 **Animation**\
  \ 视图访问的粒子系统属性制作动画。\n9. 运行游戏查看效果。\n\n```\nvoid Update () {\n    particles.gravityModifier\
  \ = gravityModifier;\n    particles.startColor = color;\n}\n```\n\n\n\n## 如何运作...\n\
  \n本教程使用与 *使用动画视图为公开脚本变量制作动画* 教程中描述的相同概念。这次我们使用公开脚本变量动画来为粒子系统的属性制作动画，这些属性通常无法从 **Animation**\
  \ 视图中访问。Unity 秉持着制作 *一切* 动画的理念，所以我认为未来所有粒子系统的属性都将可以直接在 **Animation** 视图中进行动画制作。\n\
  \n## 使用音效剪辑的波形为场景中的物体制作动画\n\n在本教程中，我们将使用音效的波形，根据波形片段的平均音量来创建运动。\n\n### 准备工作\n\n\
  为遵循本教程，我们需要一个音效。你可以使用提供的示例 Unity 项目并进入 `Chapter 07 Special effects\\Recipe 09 Using\
  \ waveform of a sound clip to animate objects in the scene` 目录。如果在那里打开 `Example.unity`\
  \ 场景并运行游戏，你将能够看到几个立方体对正在播放的音频剪辑做出反应。\n\n### 如何操作...\n\n要使用声音波形进行动画，请按照以下步骤操作：\n\n\
  - 1. 将声音导入 Unity。\n- 2. 创建一个空的游戏对象并将其命名为 `AudioSource`。\n- 3. 为其添加 Audio Source\
  \ 组件，并将声音设为 **Loop** 和 **Play On Awake**。将你的声音拖放到 **AudioClip** 字段中。\n- 4. 创建一个\
  \ **Cube** 游戏对象（前往 **Game Object | 3D Object | Cube**）。\n- 5. 创建一个新脚本并命名为 `ScaleWithWaveForm.cs`。在此脚本中，我们有一个\
  \ `public AudioSource audioSource` 变量，一个 `public float lerpSpeed` 变量，一个 `float[]\
  \ samples` 数组，以及一个 `float currentSample` 变量用于存储 `samples` 的平均音量。在此脚本的 `Start()`\
  \ 函数中，我们将 `samples` 数组的大小设置为 1024（它需要是 2 的幂）。这是我们将从 Audio Source 读取的样本数量。我们还启动一个\
  \ IEnumerator SampleAudio() 协程：\n\n```csharp\npublic AudioSource audioSource;\n\
  public float lerpSpeed = 100f;\nfloat[] samples;\nfloat currentSample;\n\nvoid Start()\n\
  {\n    samples = new float[1024];\n    StartCoroutine(\"SampleAudio\");\n}\n```\n\
  \n- 6. 此协程使用 audioSource.GetOutputData() 函数获取并将输出音频样本存储在 samples 数组中。然后我们对所有平方样本求和并计算平均音量（RMS）。最后，我们使用该值来缩放\
  \ Cube 游戏对象。此外，我们在时间上对缩放变化进行插值以使其更平滑。currentSample 值乘以 10 以使变化更明显（RMS 范围为 0 到 1）：\n\
  \n```csharp\nIEnumerator SampleAudio()\n{\n    while (true)\n    {\n        audioSource.GetOutputData(samples,\
  \ 0);\n        currentSample = 0f;\n        for (int i = 0; i < samples.Length;\
  \ i++)\n        {\n            currentSample += (samples[i]*\n            samples[i]);\n\
  \        }\n        currentSample = Mathf.Sqrt(currentSample /\n        samples.Length);\n\
  \        transform.localScale =\n        Vector3.Lerp(transform.localScale,\n  \
  \      Vector3.one * currentSample*100f,\n        Time.deltaTime*4f);\n        yield\
  \ return null;\n    }\n}\n```\n\n- 7. 将脚本分配给 Cube 游戏对象。\n- 8. 将 AudioSource 游戏对象拖放到脚本的\
  \ Audio Source 字段中。\n- 9. 运行游戏以查看效果。\n\n### 如何运作...\n\n本教程的关键组件是 AudioSource.GetOutputData(float[]\
  \ samples, int channel) 函数。它从当前播放的音频中抓取一定数量的样本。样本数量由 float[] samples 数组的长度指定。此长度必须是\
  \ 2 的幂。我们在 IEnumerator SampleAudio() 协程中每帧获取样本。我们对平方样本的值取平均以计算音频的 RMS（一定数量样本的平均音量）。平均的样本越多，RMS\
  \ 的变化越平滑。对于大多数声音，1024 是一个不错的数字。我们使用计算出的 RMS 来缩放 Cube 游戏对象。\n\n### 另请参阅\n\n你可以对波形执行更复杂的信号分析以创建更有趣的效果。例如，如果你想创建一个显示声音不同频率的均衡器，你需要使用快速傅里叶变换。你可以在\
  \ Unity 论坛中找到大量关于它的有趣信息。\n\n## 使用动画视图创建昼夜循环\n\n在本教程中，我们将使用动画视图创建一个简单的昼夜循环动画。\n\n\
  ### 准备工作\n\n我们将从头开始在 Unity 中创建本教程，因此不需要任何额外资源。你也可以使用提供的示例 Unity 项目并进入 Chapter 07\
  \ Special effects\\Recipe 10 Creating a day and night cycle with the animation window\
  \ 目录。那里有一个 Example.unity 场景。\n\n打开它并运行游戏以查看效果。\n\n![](img/616a75b593bef4212f618360fceea442_242_0.png)\n\
  \n简单的昼夜循环\n\n### 如何操作...\n\n要使用动画视图创建昼夜循环，请按照以下步骤操作：\n\n- 1. 创建一个空的游戏对象并命名为 `DayAndNight`。\n\
  - 2. 创建另一个空的游戏对象，命名为 `SunAndMoonPivot`，并将其设为 **DayAndNight** 游戏对象的子对象。\n- 3. 再创建两个游戏对象，**SunPivot**\
  \ 和 **MoonPivot**，并将其设为 **SunAndMoonPivot** 的子对象。\n- 4. 然后创建 **Sun** 和 **Moon**\
  \ 对象，并将第一个设为 **SunPivot** 的子对象，第二个设为 **MoonPivot** 的子对象。\n- 5. 最后，创建两个 **Directional\
  \ Lights** 和两个 **Spheres**，并将其中一个分别设为 **Sun** 对象的子对象，剩下的两个设为 **Moon** 对象的子对象。\n\
  - 6. 层级结构应如下所示：\n  - 1. **DayAndNight** | **SunAndMoonPivot**\n  - 2. **SunAndMoonPivot**\
  \ | **SunPivot**\n  - 3. **SunAndMoonPivot** | **MoonPivot**\n  - 4. **SunPivot**\
  \ | **Sun**\n  - 5. **MoonPivot** | **Moon**\n  - 6. **Sun** | **Directional Light**\n\
  \  - 7. **Sun | SunSphere**\n  - 8. **Moon | Directional Light**\n  - 9. **Moon\
  \ | MoonSphere**\n- 7. 创建两个材质：**Moon** 和 **Sun**。为它们选择 **Unlit | Color** 着色器并调整颜色以符合你的喜好（你也可以使用带有自发光颜色的\
  \ Standard Shader）。\n- 8. 将材质应用到 **SunSphere** 和 **MoonSphere** 对象上。\n- 9. 将 **Sun**\
  \ 和 **Moon** 移离中心。你也可以使用 **SunPivot** 和 **MoonPivot** 来旋转 **Sun** 和 **Moon**。请参考以下截图：\n\
  \n![](img/616a75b593bef4212f618360fceea442_243_0.png)\n\n太阳和月亮的放置\n\n- 10. 选择 **DayAndNight**\
  \ 游戏对象并为其添加 **Animator** 组件。\n- 11. 创建一个新脚本并命名为 `CameraColor.cs`。此脚本有一个 public `Color\
  \ cameraColor` 变量。在此脚本的 `Update()` 函数中，我们将主摄像机的 `backgroundColor` 设置为 `cameraColor`\
  \ 变量的值：\n\n```\nvoid Update () {\n    Camera.main.backgroundColor = cameraColor;\n\
  }\n```\n\n- 12. 将脚本分配给 **DayAndNight** 游戏对象。\n- 13. 在选择 **DayAndNight** 游戏对象后，打开\
  \ **Animation** 视图。\n- 14. 创建 **Sun** 和 **Moon** 在地平线上移动的动画。旋转 **SunAndMoonPivot**\
  \ 以简化操作。\n- 15. 为 **Directional Light** 的颜色及其 **Intensity** 和 **Shadow Strength**\
  \ 制作动画。白天，只有 **Sun's Directional Light** 应投射阴影，夜晚，只有 **Moon's Directional Light**\
  \ 应投射阴影。\n- 16. 如果你使用摄像机的背景颜色作为场景的背景颜色，请使用附加到 **SunAndMoonPivot** 游戏对象的脚本中的 `public\
  \ Color cameraColor` 为其制作动画。如果使用 Unity 的参数化天空盒，请确保在 **Lighting** 设置中将你的 **Sun's\
  \ Directional Light** 选择为 **Sun**。这样天空盒会根据 **Sun's Directional Light** 的旋转而变化。\n\
  - 17. 运行游戏以查看效果。\n\n### 如何运作...\n\n在本教程中，我们使用 **Hierarchy** 为 **Sun** 和 **Moon**\
  \ 的旋转制作动画。我们还为附加到这些游戏对象的 **Directional Lights** 的 **Intensity**、**Color** 和 **Shadow\
  \ Strength** 制作动画。这样，我们可以创造出昼夜循环的错觉。\n\n### 还有更多...\n\n要控制昼夜循环动画的速度，你可以在运行时从脚本中修改\
  \ `anim.speed` 参数。`anim` 变量是对附加到 **DayAndNight** 游戏对象的 **Animator** 组件的引用。\n\n\n\
  \n## 8"
- "\n## 制作动画过场\n\n本章解释如何在游戏中创建和播放过场动画，并涵盖以下配方：\n\n- 使用 **动画** 视图来为摄像机制作动画\n- 使用动画切换摄像机\n\
  - 同步多个对象的动画\n- 从 3D 软件包导入完整的过场动画\n- 同步字幕\n- 使用根运动在游戏玩法中播放过场动画\n\n### 引言\n\n在本章中我们将处理过场动画。这些是主要用于揭晓新故事事件的短动画序列。你可以直接在\
  \ Unity 中创建大量过场动画，或从你喜欢的 3D 软件包导入动画（我们将以 Blender 3D 为例）。\n\n## 使用动画视图来为摄像机制作动画\n\
  \n在本配方中，我们将使用 Unity 内置的动画视图创建摄像机动画：\n\n![](img/616a75b593bef4212f618360fceea442_246_0.png)\n\
  \n### 准备工作\n\n对于本配方我们不需要什么花哨的东西，因为我们将从头在 Unity 中创建它。场景中可能需要一些装饰。你也可以打开提供的示例 Unity\
  \ 项目并进入 Chapter 08 Animating Cutscenes\\Recipe 01 Using the animation view to animate\
  \ the camera 目录。你可以在那里的 Example.unity 场景中找到一个动画化的 Camera (1) 游戏对象。如果播放游戏，摄像机将播放动画。\n\
  \n### 如何操作...\n\n要使用动画视图创建摄像机动画，请按照以下步骤操作：\n\n1. 选择你要制作动画的摄像机（你也可以向场景中添加一个新摄像机）。\n\
  2. 打开动画视图（转到 窗口 | 动画）。\n3. 创建一个新的动画剪辑并将其命名为 `CameraAnimation`。\n4. 确保记录按钮处于按下状态。\n\
  5. 移动和旋转摄像机以创建所需的动画。如果摄像机未父级化到任何游戏对象，动画将在世界空间中完成。\n6. 如果你想将此动画用作过场动画，请从摄像机创建一个预制件。\n\
  7. 播放游戏以查看效果。\n\n### 工作原理...\n\n摄像机可以像其他游戏对象一样被制作动画。我们可以制作它们的 **变换** 动画，但此外，我们还可以制作\
  \ **摄像机** 组件的动画。这样我们就可以使用 **视野** 参数创建有趣的效果（例如示例项目中显示的简单眩晕效果）。\n\n### 还有更多...\n\n\
  如果你从动画化的摄像机创建了一个预制件，你可以实例化它来播放过场动画。记住将过场摄像机的 **深度** 设置为大于游戏内摄像机的深度。这样，简单地实例化过场摄像机预制件就会自动播放过场动画。你需要做的就是在动画结束后销毁实例化的游戏对象。你可以使用与销毁对象的函数关联的动画事件来做到这一点（你需要为此使用脚本）。\n\
  \n你还应该记住在实例化过场摄像机时禁用游戏内摄像机中的 **音频监听器** 组件。过场动画结束后，请确保再次重新启用 **音频监听器** 组件。\n\n##\
  \ 使用动画切换摄像机\n\n我们不仅可以使用动画视图制作摄像机动画，还可以随时间切换镜头。\n\n### 准备工作\n\n本配方也将从头在 Unity 中创建。你可以下载提供的示例\
  \ Unity 项目并进入 `Chapter 08 Animating Cutscenes\\Recipe 02 Changing cameras with animation`\
  \ 目录。你可以在那里的 `Example.unity` 场景中找到一个 **摄像机切换器** 游戏对象，其中有三个摄像机作为子对象。如果播放游戏，摄像机会切换。\n\
  \n### 如何操作...\n\n要使用动画切换摄像机，请按照以下步骤操作：\n\n1. 在场景视图中创建一个空游戏对象并将其命名为 `CameraChanger`。\n\
  2. 将 **主摄像机** 重命名为 **摄像机 (1)** 并复制两次。你应该有 **摄像机 (1)**、**摄像机 (2)** 和 **摄像机 (3)**\
  \ 游戏对象。\n3. 将三个摄像机都设为 **CameraChanger** 的父级。\n4. 按你希望的方式放置摄像机。\n5. 按递增顺序设置摄像机的 **深度**。每个新镜头都应具有更大的\
  \ **深度** 值。\n6. 选择 **CameraChanger** 游戏对象并打开 **动画** 视图。\n7. 创建一个新的 **动画剪辑** 并将其命名为\
  \ **CameraChange**。\n8. 确保记录按钮处于按下状态。\n9. 选择所有摄像机并禁用它们的游戏对象。然后选择第一个摄像机并启用其游戏对象。动画的第一帧中应创建新的键。第一个摄像机应处于活动状态，其余两个应处于非活动状态（你可以通过单击键来检查这一点）。你可能需要先将摄像机设置为活动以创建键，然后再将其设置为非活动（Unity\
  \ 有时在你停用对象时不会创建键，只有在你单击启用它时才会创建键）：\n\n![](img/616a75b593bef4212f618360fceea442_249_0.png)\n\
  \n包含摄像机状态（活动/非活动）的键\n\n10. 调整时间线并激活第二个摄像机。你不需要停用第一个摄像机，但应只有一个音频监听器组件处于启用状态。\n11.\
  \ 再次调整时间线并激活第三个摄像机。\n12. 关闭 **动画** 视图。\n13. 播放动画或运行游戏以查看效果。\n\n### 工作原理...\n\n本配方有几个重要元素：\n\
  \n- **摄像机作为子对象**：所有摄像机都是 **CameraChanger** 游戏对象的子对象。这样，我们可以向 **CameraChanger** 添加\
  \ Animator 组件，并使用一个动画剪辑制作动画所有子摄像机。\n- **摄像机的深度**：深度参数描述摄像机的“图层”。深度更大的摄像机将在深度较小的摄像机之上渲染。这样，我们可以在无需担心不渲染任何内容的情况下切换摄像机。\n\
  - **启用/禁用游戏对象**：我们可以使用动画启用或禁用游戏对象。我们需要做的就是单击启用复选框，如以下屏幕截图所示。始终，动画中被制作动画的参数（动画中有键）会以红色标记：\n\
  \n![](img/616a75b593bef4212f618360fceea442_250_0.png)\n\n带关键帧的启用/禁用游戏对象复选框\n\n##\
  \ 同步多个对象的动画\n\n在过场动画中，我们需要在时间上同步多个对象的动画。本配方展示了如何做到这一点。\n\n### 准备工作\n\n要遵循本配方，你需要一个动画化的角色和一个动画化的对象。你可以下载提供的示例\
  \ Unity 项目并进入 `Chapter 08 Animating Cutscenes\\Recipe 03 Synchronizing animation\
  \ of multiple objects` 目录。你可以在那里找到 `Example.unity` 场景。如果播放游戏，你将看到一个角色踢足球。两个对象都被制作了动画并且同步。你可以在\
  \ `Animations` 目录中找到所需的动画：\n\n![](img/616a75b593bef4212f618360fceea442_251_0.png)\n\
  \n球和踢球角色的同步动画\n\n### 如何操作...\n\n要同步多个对象的动画，请按照以下步骤操作：\n\n1. 在你的 3D 软件包中打开两个对象（在本示例中我们使用\
  \ Blender）。\n2. 在 3D 软件包中同步两个对象的动画。在我们的示例中，动画大约有 160 帧。两个对象都有相同的动画长度：\n\n![](img/616a75b593bef4212f618360fceea442_251_1.png)\n\
  \n3D 软件包中球和角色动画同步\n3. 在本示例中，球没有骨骼动画；我们只制作其变换动画。\n4. 确保在动画的第一帧和最后一帧中为球和角色都设置关键帧。这样，导入到\
  \ Unity 后动画将具有相同的长度。\n5. 在 3D 软件包中同步动画后，将其保存为两个文件：一个仅包含球对象及其动画，另一个仅包含角色及其动画。Unity\
  \ 可以导入多个变换动画，但导入多个骨骼动画时存在问题（例如，你将无法将骨架设置为 **人形**）。\n6. 分别将两个文件导出为 FBX 格式并确保包含 **默认拍摄**。在\
  \ Blender 中，使用 FBX 的 6.1 版本。\n7. 将两个文件导入 Unity。\n8. 如果你想使用 **人形** 角色，请确保在 **动画导入设置**\
  \ 中将所有 **基于** 选项设置为 **原始**。\n9. 为球创建一个 Animator 控制器，为角色创建一个带有足球踢击动画的控制器。\n10. 将球和角色放置在场景中的同一位置。将\
  \ Animator 控制器附加到它们。\n11. 播放游戏以查看效果。\n\n### 工作原理...\n\n同步过场动画的最佳方法是确保它们具有相同的长度并且在\
  \ 3D 软件包中同步。如果我们在 Unity 中导入它们并在同一时刻开始播放，它们将保持同步。\n\n记住，如果你想使用 **人形** 骨架，你需要将角色导出为单独的文件。\n\
  \n### 还有更多...\n\n你也可以使用动画事件同步动画。在我们的示例中，我们可以从角色被踢的时刻创建球动画，并使用角色踢击动画中的动画事件过渡到它。虽然这是可能的，但这比在\
  \ 3D 软件包中同步整个过场动画更麻烦。\n\n\n\n\n## 从 3D 软件导入完整的过场动画\n\n在 Unity 中创建过场动画的最佳方式是从 3D\
  \ 软件导入完整的动画。我们在之前的食谱中做过类似的事情（在导入到 Unity 之前在 3D 软件中同步动画）。在这里我们将创建一个带有摄像机动画的完整过场动画。\n\
  \n### 准备工作\n\n对于本食谱，我们需要与上一食谱相同的角色，并带有 *kicking the ball* 动画。此外，我们在动画中添加了三个简单的立方体。这些立方体是动画化的，表示摄像机。我们使用立方体而不是空对象或摄像机，是因为\
  \ Unity 在导入既不是骨架也不是具有网格渲染器的对象时有时会出现问题：\n\n![](img/616a75b593bef4212f618360fceea442_253_0.png)\n\
  \nBlender 中的过场动画对象。红色立方体保存摄像机位置\n\n你也可以前往 `Chapter 08 Animating Cutscenes\\Recipe\
  \ 04 Importing a whole cutscene from a 3D package` 目录。你可以在那里找到 `Example.unity` 场景。如果运行游戏，你会看到一个角色踢足球。摄像机会随动画进程进行动画并切换。你可以在\
  \ `Animations` 目录中找到所有需要的动画。\n\n### 操作方法\n\n要从 3D 软件导入完整的过场动画，请按照以下步骤操作：\n\n- 1.\
  \ 在 3D 软件中创建过场动画。记住所有对象的动画长度应相同。它们应在第一帧和最后一帧上都有关键帧。\n- 2. 如果计划使用 **Humanoid** 骨架，请在导入\
  \ Unity 之前将每个角色保存为单独的文件。\n- 3. 将过场动画导入 Unity（如果需要，还包括所有角色）。使用 **Generic** 骨架的所有对象可以一起导出为一个文件。在这种情况下，会为整个过场动画创建一个\
  \ **Generic** 骨架。\n- 4. 如果你使用 Blender 并希望将过场动画导出为 FBX 格式，请使用 6.1 版本并确保勾选 **Default\
  \ Take** 选项。\n- 5. 在 **Import Settings** 中进入 **Animation** 选项卡。\n- 6. **Default\
  \ Take** 包含整个过场动画。你可能会在 Animation 选项卡中看到额外的片段（尤其是在使用骨骼动画时）。不要使用它们。你可以从导入设置中删除它们，并将\
  \ **Default Take** 片段名称更改为更具描述性的名称。\n- 7. 如果角色使用 **Humanoid** 骨架，请从单独的文件中逐一导入它们。\n\
  - 8. 为过场动画创建一个 **Animator Controller**，并为每个角色创建一个（如果使用 **Humanoid** 骨架）。\n- 9. 将过场动画放置在控制器中。\n\
  - 10. 将所有对象放置在场景的同一位置。\n- 11. 如果你想为摄像机做动画，为过场动画的每个镜头创建一个摄像机。\n- 12. 将摄像机设为过场动画中动画化的摄像机持有对象的子对象。你可能需要调整摄像机旋转。\n\
  - 13. 我们的摄像机是摄像机持有对象（以及过场动画对象）的子对象。但动画是导入的且只读。因此，我们无法像 *Changing cameras with animation*\
  \ 食谱中那样更改摄像机。我们需要在过场动画的根对象（带有 Animator 组件的对象）上添加一个脚本。创建一个新脚本并命名为 `CutsceneCameraChanger.cs`。在此脚本中，我们有一个所有过场动画摄像机的列表，以及一个\
  \ `public void ChangeCamera()` 动画事件，该事件根据给定的 `int newCameraIndex` 参数更改摄像机。它会禁用列表中的其他所有摄像机：\n\
  ```\npublic void ChangeCamera (int newCameraIndex)\n{\nfor (int i = 0; i < cutsceneCameras.Length;\
  \ i++)\n{\n    cutsceneCameras[i].gameObject.\n        SetActive(false);\n}\n  \
  \  cutsceneCameras[newCameraIndex].gameObject.\n        SetActive(true);\n}\n```\n\
  - 14. 将脚本分配给过场动画的根对象。\n- 15. 打开过场动画的 **Animation Import Settings**。\n- 16. 将时间线调整到你想要切换镜头的位置。\n\
  - 17. 添加 Animation Events 以启用适当的摄像机并切换镜头。使用 `int` 参数为 `ChangeCamera` 函数提供 `newCameraIndex`。记住将摄像机的\
  \ **Depth** 参数设置为高于游戏摄像机。\n- 18. 应用 **Animation Import Settings** 并禁用每个摄像机持有对象的\
  \ **Mesh Renderer** 组件，以便它们在游戏中不可见。\n- 19. 运行游戏以查看效果。\n\n### 工作原理\n\nUnity 可以将整个过场动画作为单个资源导入。你可以用大量对象和角色制作过场动画，然后导出为\
  \ FBX（如果你使用 Blender，也可以直接保存文件）。导入后，**Default Take** 包含整个动画。你无法更改动画（它是只读的），但可以使用脚本通过\
  \ Animation Events 启用/禁用摄像机。不过你需要在 Animation Import Settings 中添加事件。\n\n如果你计划为不同角色重用动画，需要将过场动画中的每个骨架作为单独文件导出。只有这样才能将其设置为\
  \ **Humanoid**。\n\n你无法从 3D 软件导出粒子系统。仅支持变换和骨骼动画。你需要在 Unity 中创建 VFX 并使用 Animation\
  \ Events 与过场动画同步。音效也适用相同规则。我们在第 7 章《Special Effects》的 *Using Animation Events to\
  \ trigger sound and visual effects* 食谱中做过此事。\n\n### 还有更多\n\n根据 Unity 的路线图，Director\
  \ 工具计划在 5.x 时间表中的某个时候推出。它可能会使在 Unity 中制作过场动画变得更容易。但对于习惯使用自己喜欢的 3D 软件的动画师来说，导入完整的过场动画仍然可能是首选方案。\n\
  \n## 同步字幕\n\n在本食谱中，我们创建字幕并将其与动画同步：\n\n![](img/616a75b593bef4212f618360fceea442_256_0.png)\n\
  \n与动画同步的字幕\n\n### 准备工作\n\n在本食谱中，我们将使用与上一食谱相同的过场动画。你也可以打开示例 Unity 项目并前往 `Chapter\
  \ 08 Animating Cutscenes\\Recipe 05 Synchronizing subtitles` 目录。如果在那里打开 `Example.unity`\
  \ 场景并运行游戏，你会看到随动画同步变化的字幕。\n\n### 操作方法\n\n要将字幕与过场动画同步，请按照以下步骤操作：\n\n- 1. 按照上一食谱中的方式导入过场动画。\n\
  - 2. 创建一个新的 Image（前往 Game Object | UI | Image）。\n- 3. 将其命名为 SubtitlesContainer。\n\
  - 4. 创建一个新的 Text 游戏对象并将其设为 SubtitlesContainer 的子对象。为此，右键单击 SubtitlesContainer 并选择\
  \ UI | Text。\n- 5. 将 SubtitlesContainer 的 Image 组件颜色更改为半透明黑色。将 Text 组件的颜色更改为白色。按需调整对象的位置和大小。\n\
  - 6. 将模型放置在场景中。\n- 7. 创建一个新的脚本并命名为 Subtitles.cs。此脚本有一个 string subtitlesText 变量，我们将在其中存储字幕中显示的文本。它还具有对\
  \ SubtitlesContainer 和 Text 游戏对象的公共引用：public GameObject subtitlesContainer 和 public\
  \ Text textComponent。此脚本有一个 public void SetSubtitles(string text) 函数。它从 Animation\
  \ Event 调用并用于设置 subtitlesText 变量的值：\n```\npublic void SetSubtitles(string text)\n\
  {\n    subtitlesText = text;\n}\n```\n- 8. 在此脚本的 Update() 函数中，我们检查 subtitlesText\
  \ 变量是否包含任何文本。如果有，我们启用 SubtitlesContainer 游戏对象并设置 Text 游戏对象以显示我们的字幕。如果 subtitlesText\
  \ 为空字符串，我们禁用 SubtitlesContainer：\n```\nif (string.IsNullOrEmpty(subtitlesText)\n\
  && subtitlesContainer.activeSelf)\n{\n    subtitlesContainer.SetActive(false);\n\
  }\nelse if (!string.IsNullOrEmpty(subtitlesText)\n&& !subtitlesContainer.activeSelf)\n\
  {\n    subtitlesContainer.SetActive(true);\n}\nelse\n{\n```\n\n\n\n```\ntextComponent.text\
  \ = subtitlesText;\n}\n```\n\n- 9. 将脚本附加到过场动画游戏对象（拥有 Animator 组件并为所有道具做动画的对象）上。\n\
  - 10. 打开过场动画的动画导入设置。\n- 11. 你可以在时间线上拖动并添加动画事件。\n- 12. 添加一个动画事件并将函数命名为 SetSubtitles。在\
  \ String 参数中输入你想要显示为字幕的文本，如以下截图所示：\n- 13. 如果你想让字幕消失，添加一个 SetSubtitles 动画事件并将 String\
  \ 参数留空。\n- 14. 应用动画导入设置。\n- 15. 运行游戏查看效果。\n\n![](img/616a75b593bef4212f618360fceea442_258_0.png)\n\
  \nSetSubtitles 动画事件，文本为 \"Gooaal!\"\n\n## 工作原理...\n\n在本教程中，我们使用动画事件将字幕与过场动画同步。其原理与第\
  \ 7 章《特殊效果》中《使用动画事件触发音效和视觉效果》教程相同。`Subtitles.cs` 脚本还根据通过动画事件调用的 `public void SetSubtitles(string\
  \ text)` 函数所设置的 `subtitlesText` 变量的值来处理字幕的显示和隐藏。\n\n如果你想本地化字幕，请使用字符串本地化键而不是文本。然后\
  \ `Subtitles.cs` 脚本需要使用这些键在你的本地化库中查找文本。\n\n## 使用根运动在游戏过程中播放过场动画\n\n我们也可以在不改变摄像机的情况下在游戏过程中播放过场动画，并使用平滑过渡进入和退出过场动画。本教程展示了该方法的示例。\n\
  \n### 准备工作\n\n在本教程中，我们将使用与上一教程相同的过场动画。你也可以打开示例 Unity 项目并进入 `Chapter 08 Animating\
  \ Cutscenes\\Recipe 06 Using root motion to play cutscenes during gameplay` 目录。如果在那里打开\
  \ `Example.unity` 场景并运行游戏，你将能够移动角色。靠近红色球体标记并按下空格键即可播放过场动画：\n\n![](img/616a75b593bef4212f618360fceea442_259_0.png)\n\
  \n游戏过程中播放的过场动画\n\n### 操作方法...\n\n要在游戏过程中播放过场动画，请按以下步骤操作：\n\n- 1. 导入你的过场动画。确保将角色动画作为单独文件导入。\n\
  - 2. 进入过场动画资源导入设置中的动画选项卡。\n- 3. 将 Default Take 动画重命名为 Cutscene。\n- 4. 创建一个新的动画剪辑，选择\
  \ Default Take 作为源，并将起始帧设为 0、结束帧设为 1。将此动画命名为 CutsceneIdle 并使其循环播放。\n- 5. 将过场动画游戏对象（在我们的示例中是\
  \ Ball 游戏对象）和角色放置在场景中。\n- 6. 按照第 4 章《角色移动》中的《使用根运动控制角色》教程操作。这样你将拥有一个可控制的移动角色。\n\
  - 7. 为过场动画创建一个 Animator Controller。\n- 8. 将 CutsceneIdle 设为默认动画。\n- 9. 拖放 Cutscene\
  \ 动画。\n- 10. 创建一个 Trigger 参数并将其命名为 Cutscene。\n- 11. 使用 Cutscene Trigger 参数从 CutsceneIdle\
  \ 到 Cutscene 动画创建过渡。将 Has Exit Time 设为 false，Transition Duration 设为 0.1 秒。\n- 12.\
  \ 将 Player 标签分配给角色。\n- 13. 将过场动画添加到角色的 Animator Controller 中。在我们的示例中，动画名为 SoccerKick。\n\
  - 14. 在角色的控制器中添加一个 Cutscene Trigger 参数。\n- 15. 使用 Cutscene Trigger 作为条件从 Any State\
  \ 创建到 SoccerKick 的过渡。Has Exit Time 应设为 false，Transition Duration 设为约 0.5 秒。\n- 16.\
  \ 再添加一个从 SoccerKick 到 Idle 的过渡，无条件，Has Exit Time 设为 true。Transition Duration 也应设为约\
  \ 0.5 秒。\n- 17. 创建一个新的 C# 脚本并命名为 CutsceneTrigger.cs。在此脚本中，我们有 void OnTriggerEnter()\
  \ 和 void OnTriggerExit() 函数。它们的主要任务是设置 bool inTrigger 标志。OnTriggerEnter() 函数还存储对玩家游戏对象的引用：\n\
  ```\nvoid OnTriggerEnter (Collider other) {\n    if (other.gameObject.CompareTag(\"\
  Player\"))\n    {\n        player = other.gameObject;\n        inTrigger = true;\n\
  \    }\n}\nvoid OnTriggerExit(Collider other)\n{\n    if (other.gameObject.CompareTag(\"\
  Player\"))\n    {\n        inTrigger = false;\n    }\n}\n```\n- 18. 我们在 Update()\
  \ 函数中检查 inTrigger 标志的值。如果其设为 true，玩家可以按空格键开始过场动画。这会启动一个协程，使角色的位置和旋转与触发器的位置和旋转匹配。此位置和旋转是角色在过场动画开始时应具有的位置和旋转。我们还会启用或禁用提示，其引用存储在\
  \ public GameObject onScreenInfo 变量中。当玩家开始过场动画时，我们关闭 Box Collider 组件以禁用触发器：\n```\n\
  if (inTrigger)\n{\n    onScreenInfo.SetActive(true);\n\n    if (Input.GetKeyDown(KeyCode.Space))\n\
  \    {\n        GetComponent<BoxCollider>().enabled = false;\n        inTrigger\
  \ = false;\n        StartCoroutine(\"StartCutscene\");\n    }\n}\nelse\n{\n    onScreenInfo.SetActive(false);\n\
  }\n```\n- 19. 在 IEnumerator StartCutscene() 协程中，我们首先将角色的 Rigidbody 组件设为 Kinematic。这样我们就关闭了物理模拟。然后我们插值玩家的位置和旋转，使其与触发器的位置和旋转匹配。如果足够接近，我们就在玩家和过场动画的\
  \ Animator 组件中设置 Cutscene Trigger，以便在两个对象上同时播放动画：\n```\nIEnumerator StartCutscene()\n\
  {\n    player.GetComponent<Rigidbody>().isKinematic = true;\n    bool positionAdjusted\
  \ = false;\n    bool rotationAdjusted = false;\n    while(true)\n    {\n       \
  \ yield return null;\n        if ((player.transform.position -\n        transform.position).magnitude\
  \ <= 0.01f)\n        {\n            positionAdjusted = true;\n        }\n      \
  \  else\n        {\n            player.transform.position =\n            Vector3.Lerp(player.transform.position,\n\
  \            transform.position, positionAdjustmentSpeed\n            * Time.deltaTime);\n\
  \        }\n        if (Vector3.Angle(player.transform.forward,\n        transform.forward)\
  \ <= 1f)\n        {\n            rotationAdjusted = true;\n        }\n        else\n\
  \        {\n            player.transform.rotation =\n            Quaternion.Lerp(player.transform.rotation,\n\
  \            transform.rotation, positionAdjustmentSpeed\n            * Time.deltaTime);\n\
  \        }\n        if (positionAdjusted && rotationAdjusted)\n        {\n     \
  \       break;\n        }\n    }\n    player.GetComponent<Animator>\n    ().SetTrigger(animationTrigger);\n\
  \    cutsceneAnimator.SetTrigger(animationTrigger);\n}\n```\n- 20. 创建一个新的空游戏对象并将其命名为\
  \ `CutsceneTrigger`。为其添加 **盒状碰撞体** 组件并将其设为 **是否触发**。\n- 21. 将其放置在角色在过场动画中必须所在的确切位置。将其旋转方式与角色所需旋转方式相同。你可以使用过场动画中的空对象（从\
  \ 3D 软件导出）来简化操作。\n- 22. 将 `CutsceneTrigger.cs` 脚本分配给 **CutsceneTrigger** 游戏对象。\n\
  - 23. 创建一个提示 UI 文本并将其分配给 **Cutscene Trigger** 组件的 **On Screen Info** 字段。\n- 24.\
  \ 将过场动画游戏对象的 **Animator** 组件分配给 **Cutscene Trigger** 组件的 **CutsceneAnimator** 字段。\n\
  - 25. 再创建一个 C# 脚本并命名为 `SetKinematic.cs`。在此脚本中，我们只有一个 `public void NotKinematic()`\
  \ 函数，其中我们将 **Rigidbody** 组件设为非运动学：\n- 26. 将脚本附加到角色。\n- 27. 在选中角色的情况下，打开 **Animation**\
  \ 视图。\n- 28. 选择 **SoccerKick** 动画。\n- 29. 在动画接近结尾处添加一个 **Animation Event** 并选择 **NotKinematic()**。这将使角色再次对物理做出反应。\n\
  - 30. 运行游戏，靠近触发器并按空格键查看效果。\n```\npublic void NotKinematic()\n{\n    GetComponent<Rigidbody>().isKinematic\
  \ = false;\n}\n```\n\n### 工作原理...\n\n本教程使用与 `Chapter 5, Characters Actions and Expressions`\
  \ 中 *行动点 – 在指定位置执行动作* 教程相同的概念。这里我们为动画道具（在我们的示例中是 Ball 游戏对象）添加了一个一帧循环的 CutsceneIdle\
  \ 动画。这使得对象等待过场动画开始。我们的角色过场动画以单独文件导出，这使我们能够将其骨架设为 **Humanoid** 并与其他动画一起使用。\n\n我们的角色与过场动画游戏对象在同一时刻开始播放动画。这使它们同步。\n\
  \n另一件重要的事情是，我们在过场动画期间将角色的 **Rigidbody** 组件设为 **Is Kinematic**。这使得动画以 100% 的权重控制我们的角色。没有碰撞可以打断角色播放动画。过场动画结束后，我们关闭\
  \ **Is Kinematic** 选项以使角色恢复正常行为。\n\n\n\n## 9"
- "## 物理和动画\n\n本章介绍了 Unity 的 5 物理引擎及其可实现的功能。它涵盖了以下配方：\n- 使用布料\n- 使用刚体关节\n- 可破坏物体\n\
  - 使用布娃娃向导创建人形布娃娃\n- 使用角色关节创建通用布娃娃\n- 对布娃娃施加力\n- 截肢\n- 从布娃娃状态站起\n\n### 引言\n\nUnity\
  \ 的物理引擎可用于创建有趣的效果以及游戏玩法机制。之前我们使用刚体来移动角色并检测碰撞。在本章中，我们将重点关注刚体和物理的更具视觉吸引力的方面。\n\n##\
  \ 使用布料\n\n在本配方中，我们将创建一个简单的布料模拟：\n\n![](img/616a75b593bef4212f618360fceea442_265_0.png)\n\
  \n用于创建旗帜的布料模拟\n\n### 准备工作\n\n对于本配方，我们需要一个布料模型。它应该是一个平面并多次细分，以拥有足够多的顶点供布料模拟使用。在我们的示例中，我们使用了一个额外的模型：旗杆。您可以前往\
  \ Chapter 09 Physics and animations\\Recipe 01 Using cloth 目录。在那里，您会在 Example.unity\
  \ 场景中找到一个 FlagPole 游戏对象。该对象包含 Flag 和 FlagPole 对象作为子对象。Flag 游戏对象使用布料模拟。\n\n### 如何操作...\n\
  \n要使用布料模拟，请按照以下步骤操作：\n- 1. 将 Flag 游戏对象放置到场景中。\n- 2. 为 Flag 游戏对象添加 Cloth 组件（前往 Component\
  \ | Physics | Cloth）。\n- 3. 注意会自动添加一个 **蒙皮网格渲染器** 组件。您可以从对象中移除 **网格渲染器** 组件。\n-\
  \ 4. 找到 **Flag** 的网格并将其拖到 **蒙皮网格渲染器** 组件中的 **网格** 字段。如果您的游戏对象仍有 **网格过滤器** 组件，您可以点击其附加的网格，它将在\
  \ **项目视图** 中显示。这使得找到我们需要的网格更容易。\n- 5. 如果您的游戏对象仍附加了 **网格过滤器** 组件，您可以将其移除。\n- 6. 您可能需要为\
  \ **Flag** 游戏对象添加材质。如果缺少材质，请将适当的材质拖入 **蒙皮网格渲染器** 中的 **材质** 部分。\n- 7. 在 **检视面板**\
  \ 中进入 Cloth 组件设置并点击 **编辑约束** 按钮，如以下屏幕截图所示：\n- 8. **布料约束** 窗口将会出现，如以下屏幕截图所示：\n\n\
  ![](img/616a75b593bef4212f618360fceea442_266_0.png)\n\n编辑约束按钮\n\n![](img/616a75b593bef4212f618360fceea442_266_1.png)\n\
  \n编辑约束\n- 9. 它用于约束布料的移动。要将布料固定到某物上，请选择 **绘制** 选项卡并点击 **最大距离** 复选框。通过左键点击顶点，您可以将其涂成红色，这意味着其移动完全受约束。您可以选择其他颜色使布料略微移动。黑色表示没有任何约束。\n\
  - 10. 绘制至少一个顶点后，您可以切换到 **选择** 选项卡。在此选项卡中，您可以框选顶点。选择一组顶点后，您可以勾选 **最大距离** 复选框并一次性为所有选定顶点编辑值。\n\
  - 11. 如果无法选择或绘制顶点，请旋转视图——您可能正在从背面查看网格。选择和绘制仅在正面有效，除非在 **可视化** 下拉菜单中勾选 **操作背面** 选项。\n\
  - 12. 我们的 Flag 的方向是自上而下（其顶部固定在杆上）。因此我们应选择所有顶部顶点并将其涂成红色（将 **最大距离** 设置为 0）。在您的情况下，您可能希望固定其他顶点。\n\
  - 13. 要移除对某个顶点的约束，请选择它（您需要在 **选择** 选项卡中）并取消勾选 **最大距离** 复选框。顶点将变为黑色，这意味着它不再受约束。\n\
  - 14. 要使 **Flag** 与其他游戏对象发生碰撞，请前往 Cloth 组件设置中的 **胶囊碰撞体** 和 **球形碰撞体** 数组。您可以在此处添加场景中存在的\
  \ **球形碰撞体** 或 **胶囊碰撞体**。**布料** 只能与这两种类型的碰撞体发生碰撞。\n- 15. 播放游戏以查看效果。\n\n### 原理...\n\
  \n布料模拟使用网格的顶点来模拟布料般的行为。网格需要足够密集才能使模拟看起来良好。本示例中使用的旗帜有 100 个顶点。\n\n**布料** 组件有许多可使用和调整的选项：\n\
  - **拉伸刚度**：布料在拉伸时的刚度。\n- **弯曲刚度**：布料在弯曲时的刚度。\n- **使用系绳**：这有助于防止未约束的顶点远离受约束的顶点\n\
  - **使用重力**：这会将重力应用于布料顶点。\n- **阻尼**：这会阻尼布料顶点的运动。\n- **外部加速度：** 这是布料顶点恒定的加速度，可用于模拟风。\n\
  - **随机加速度：** 这与前一个选项类似，但为随机。它可用于模拟风。\n- **世界速度缩放：** 这会缩放布料所附着物体的世界速度。它适用于角色的服装。\n\
  - **世界加速度缩放：** 当布料所附着的物体加速时，这会缩放布料顶点的世界加速度。它适用于角色的服装。\n- **摩擦：** 布料顶点与物体碰撞时应用的摩擦。\n\
  - **碰撞质量缩放：** 布料顶点在碰撞时质量的缩放。\n- **使用连续碰撞：** 这与刚体的连续碰撞检测类似，可提高碰撞质量但会增加性能开销。\n- **使用虚拟粒子：**\
  \ 这会为每个布料三角形添加一个虚拟粒子/顶点并提高碰撞质量。\n- **求解器频率：** 每秒求解器迭代次数。\n- **休眠阈值：** 布料停止模拟（休眠）后的阈值。\n\
  - **胶囊碰撞体：** 用于碰撞的胶囊碰撞体数组。\n- **球形碰撞体：** 用于碰撞的球形碰撞体数组。\n\n### 了解更多...\n\n布料最适合单面平面网格（细分平面）。它也可以用于薄的细分盒子。避免使用面法线反转的复制平面（这会产生两个布料片，它们会不断相互碰撞）。\n\
  \n为获得最佳效果，您应在单面平面网格上使用某种双面着色器。您可以使用示例项目提供的简单着色器；您可以在 `Textures materials and shaders\\\
  Shaders` 目录中找到它。它不支持阴影。您也可以在 Asset Store 中找到好的双面着色器；我可以推荐由 Mario Lelas 创建的 **Double\
  \ Sided Standard Mobile Legacy Shaders** 包。\n\n布料组件可与任何蒙皮网格渲染器一起使用。因此您可以使角色的某些部分作为布料进行模拟。最佳做法是拥有第二个仅包含布料网格的蒙皮网格渲染器（这样约束此类网格会比尝试约束整个角色容易得多）。\n\
  \n## 使用刚体关节\n\n在本配方中，我们将创建两个具有物理模拟的物体：绳索和门。我们将使用刚体关节来约束这些物体的移动和旋转。\n\n### 准备工作\n\
  \n对于本配方，我们需要四个模型：一个 **RopePole**（类似于上一配方中的那个）、一个带有包含约 10 个骨骼的 **RopeRig** 的蒙皮 **Rope**、一个\
  \ **Frame** 以及两个门，**DoorLeft** 和 **DoorRight**（类似于沙龙中那种旋转门）。我们还需要一个带有刚体的角色来与我们的物体发生碰撞。您可以前往\
  \ `Chapter 09 Physics and animations\\Recipe 02 Using rigid body joints` 目录。您将在\
  \ `Example.unity` 场景中找到所有这些物体。播放游戏时，尝试用我们的角色行走并与绳索和门发生碰撞以查看效果。\n\n![](img/616a75b593bef4212f618360fceea442_269_0.png)\n\
  \n绳索和旋转门\n\n\n\n\n## 如何操作...\n\n使用刚体关节，请按以下步骤操作：\n\n- 1. 将我们的摆动门导入 Unity。模型应包含三个对象：**框架**、**左门**和**右门**。\n\
  - 2. 将对象放置在场景中，并将它们全部设为一个空游戏对象的子对象，您可以将其命名为**摆动门**。\n- 3. 在**框架**游戏对象上添加一个**网格碰撞体**，以防止我们的角色穿过它。\n\
  - 4. 在**左门**游戏对象上添加一个**方框碰撞体**或设置为**凸**的**网格碰撞体**。\n- 5. 在**左门**游戏对象上添加一个**刚体**组件。\n\
  - 6. 向**左门**添加一个**铰链关节**组件。\n- 7. 将**轴**参数设置为 0 X、1 Y 和 0 Z。这是我们的**铰链关节**可以旋转的轴。\n\
  - 8. 勾选**使用限制**选项，并将**最小值**设置为 -120，**最大值**设置为 120（具体限制在您的情况下可能有所不同）。这些值描述了我们的**铰链关节**从中性位置可以旋转的范围。\n\
  - 9. 如果您希望门在被推动后回到原始位置，请勾选**使用弹簧**选项。\n- 10. 将**弹簧**参数设置为 1，**阻尼器**设置为 0.5（您可能需要尝试具体数值）。\n\
  - 11. 对**右门**游戏对象重复步骤 4-10。\n- 12. 运行游戏并让其他任何刚体与门发生碰撞以查看效果（如果您的角色使用刚体物理移动，也可以[content]\n\
  ## 如何操作...\n\n使用刚体关节，请按以下步骤操作：\n\n- 1. 将我们的摆动门导入 Unity。模型应包含三个对象：**框架**、**左门**和**右门**。\n\
  - 2. 将对象放置在场景中，并将它们全部设为一个空游戏对象的子对象，您可以将其命名为**摆动门**。\n- 3. 在**框架**游戏对象上添加一个**网格碰撞体**，以防止我们的角色穿过它。\n\
  - 4. 在**左门**游戏对象上添加一个**方框碰撞体**或设置为**凸**的**网格碰撞体**。\n- 5. 在**左门**游戏对象上添加一个**刚体**组件。\n\
  - 6. 向**左门**添加一个**铰链关节**组件。\n- 7. 将**轴**参数设置为 0 X、1 Y 和 0 Z。这是我们的**铰链关节**可以旋转的轴。\n\
  - 8. 勾选**使用限制**选项，并将**最小值**设置为 -120，**最大值**设置为 120（具体限制在您的情况下可能有所不同）。这些值描述了我们的**铰链关节**从中性位置可以旋转的范围。\n\
  - 9. 如果您希望门在被推动后回到原始位置，请勾选**使用弹簧**选项。\n- 10. 将**弹簧**参数设置为 1，**阻尼器**设置为 0.5（您可能需要尝试具体数值）。\n\
  - 11. 对**右门**游戏对象重复步骤 4-10。\n- 12. 运行游戏并让其他任何刚体与门发生碰撞以查看效果（如果您的角色使用刚体物理移动，也可以将其使用）。\n\
  \n使用**铰链关节**创建绳索，请按以下步骤操作：\n\n- 1. 将我们的蒙皮**绳索**模型导入 Unity。绳索应具有足够多的骨骼来模拟其行为（大多数情况下\
  \ 10-20 根就足够了）。确保骨骼大小相同或相似且未相互设为父对象（这样编辑会更容易）。\n- 2. 将**绳索**模型放置在场景中。\n- 3. 进入**绳索骨架**游戏对象并选择所有骨骼。\n\
  - 4. 向骨架中的所有骨骼添加**胶囊碰撞体**、**刚体**和**铰链关节**组件。\n- 5. 在选择所有骨骼的情况下，使用检查器缩放**胶囊碰撞体**以适应骨骼大小。\n\
  - 6. 确保在每个骨骼的**铰链关节**设置中选中了**自动配置连接锚点**选项。\n- 7. 对每个骨骼查找其**铰链关节**设置。将下一个骨骼拖放到前一个骨骼的**连接体**字段中。例如，如果您有一个包含五个骨骼的骨架，**骨骼1**、**骨骼2**、**骨骼3**、**骨骼4**、**骨骼5**。**骨骼5**是顶部的骨骼——将**骨骼5**拖放到**骨骼4**的**铰链关节**设置中的**连接体**字段。将**骨骼4**拖放到**骨骼3**的**铰链关节**设置中的**连接体**字段，以此类推。让顶部骨骼的**连接体**字段保持为空——这将限制其在空间中的移动。\n\
  - 8. 您可能还需要调整**限制**和**轴**字段。旋转轴应指向与骨骼指向相同的方向。如果您选择一个带有**铰链关节**的游戏对象，您可能会看到旋转轴作为一个小棕色箭头。\n\
  - 9. 禁用或移除**绳索**游戏对象上的**动画器**组件。\n- 10. 运行游戏并与绳索发生碰撞以查看效果。\n\n## 其工作原理...\n\n在本教程中，我们使用了铰链关节——Unity\
  \ 中的一种关节类型。这些关节限制刚体运动。如果我们将它们用于蒙皮网格渲染器的骨架上，我们可以为其引入物理模拟（如我们对绳索所做的）。铰链关节有几个有趣的参数：\n\
  \n- **连接体**：我们可以通过将对象放入此字段将其连接到另一个刚体。连接的对象可以形成绳索、链条和其他有趣的结构。\n- **锚点**：关节可以在其周围旋转的定义局部空间位置。\n\
  - **轴**：这指定了关节可以旋转的轴。\n- **自动配置连接锚点**：如果我们勾选此项，连接锚点将自动配置以匹配连接体的锚点。\n- **连接锚点**：在这里我们可以手动配置连接体位置（我们必须先禁用**自动配置连接锚点**）。\n\
  - **使用弹簧**：如果勾选此选项，关节将表现得好像附着了一个弹簧。它将尝试回到其**目标位置**（请参阅本列表后面的内容）。\n- **弹簧**：这是弹簧的力。\n\
  - **阻尼器**：这会阻尼由弹簧力引起的运动。对象将随着时间减速直至完全停止。\n- **目标位置**：这是关节弹簧想要拉动对象的目标角度。\n- **使用马达**：这使对象围绕其关节**轴**旋转。\n\
  - **目标速度**：这是对象在旋转时想要达到的速度。\n- **力**：这是应用于对象以达到**目标速度**的力。\n- **自由旋转**：启用此选项时，对象不会尝试减速以匹配**目标速度**，它只会加速。\n\
  - **使用限制**：如果您想限制对象围绕其关节**轴**的旋转，请启用此选项。\n- **最小值**：这是最低旋转限制。\n- **最大值**：这是最高旋转限制。\n\
  - **弹性**：对象达到旋转限制时弹跳的程度。\n- **接触距离**：它使限制*具有一定的宽度*以减少抖动。在此距离内，关节将与给定的限制接触。\n- **断裂力**：这是破坏关节所需的力，如果您想撞开门则很有用。\n\
  - **断裂扭矩**：与前者类似，这是破坏关节所需的扭矩。\n- **启用碰撞**：这会在连接到关节的刚体之间启用碰撞。\n- **启用预处理**：这用于稳定无法实现的情况。\n\
  \n## 可破坏对象\n\n在本教程中，我们将创建一个简单的可破坏对象。\n\n## 准备工作\n\n要遵循本教程，您需要一个具有两种状态的对象：正常和破碎。破碎的对象是正常对象的切割成块版本。破碎对象的每个碎片都应是一个单独的游戏对象。请参阅以下屏幕截图（我们使用\
  \ Blender 破碎工具对一个简单的球体进行破碎）：\n\n![](img/616a75b593bef4212f618360fceea442_273_0.png)\n\
  \n正常球体和破碎的球体：每个破碎元素都是一个单独的游戏对象\n\n您也可以下载提供的示例 Unity 项目并进入 `Chapter 09 Physics and\
  \ animations\\Recipe 03 Destructible objects` 目录。您可以在那里找到 `Example.unity` 场景。如果您运行游戏，您将看到一个球体掉落。当它撞击地面时，它会被破碎成碎片。\n\
  \n## 如何操作...\n\n要创建可破坏对象，请按以下步骤操作：\n\n- 1. 将正常和破碎的对象导入 Unity。在我们的示例中，我们有一个名为**球**的对象，另一个名为**破碎球**。\n\
  - 2. 将两个对象都拖放到场景中。\n- 3. 选择**破碎球**游戏对象的所有子游戏对象（碎片）。向它们添加**刚体**和**网格碰撞体**组件。将**网格碰撞体**设置为**凸**。\n\
  - 4. 从**破碎球**游戏对象（包含所有碎片）创建一个预制件。\n- 5. 选择**球**游戏对象并向其添加一个**刚体**和一个**球形碰撞体**（或根据对象形状使用其他类型）。\n\
  - 6. 编写一个新的 C# 脚本并将其命名为 `SpawnFracturedObject.cs`。在此脚本中，我们有一个 `void Fracture()`\
  \ 函数，它会生成一个破碎的游戏对象预制件（我们的**破碎球**），为其所有碎片应用速度，并销毁主对象（**球**）：\n\n```\nvoid Fracture()\n\
  {\n    GetComponent<Collider>().enabled = false;\n    GameObject fracturedObject\
  \ =\n        (GameObject)GameObject.Instantiate(fracturedObject\n```\n\n\n\n```\n\
  Prefab, transform.position, transform.rotation);\nRigidbody[] rigidBodies =\nfracturedObject.GetComponentsInChildren<Rigidbody>\
  \ ();\nfor (int i = 0; i < rigidBodies.Length; i++)\n{\n    rigidBodies[i].velocity\
  \ +=\n    lastRigidBodyVelocity;\n}\nDestroy(gameObject);\n}\n```\n\n7. void Fracture()\
  \ 函数在我们的主对象与任何物体发生碰撞时被调用：\n\n```\nvoid OnCollisionEnter(Collision col)\n{\n    Fracture();\n\
  }\n```\n\n8. 球的速度每帧都会保存到 float 类型的 lastRigidBodyVelocity 变量中（在 FixedUpdate() 函数中）：\n\
  \n```\nvoid FixedUpdate () {\n    lastRigidBodyVelocity = rb.velocity;\n}\n```\n\
  \n9. 将脚本分配给 Ball 游戏对象，并将 BallFractured 预制体拖到 Inspector 中的 Fractured Object Prefab\
  \ 字段上。\n\n10. 运行游戏以查看效果：\n\n![](img/616a75b593bef4212f618360fceea442_274_0.png)\n\
  \n碰撞前后\n\n## 如何工作...\n\n两个对象，一个正常的和一个由多个碎片构成的破碎对象。正常对象在游戏中像其他任何游戏对象一样工作。破碎游戏对象仅在我们销毁正常对象时才生成。我们每帧保存正常对象的速度（在本例中为其刚体速度），以便将该速度添加到生成的破碎碎片上。这使得它们在正常对象被销毁后仍能继续运动。\n\
  \n在本教程中，我们创建了两个对象，一个正常的和一个由多个碎片构成的破碎对象。正常对象在游戏中像其他任何游戏对象一样工作。破碎游戏对象仅在我们销毁正常对象时才生成。我们每帧保存正常对象的速度（在本例中为其刚体速度），以便将该速度添加到生成的破碎碎片上。这使得它们在正常对象被销毁后仍能继续运动。还有更多内容……\n\
  \n你可以使用这种简单技术创建更复杂的物体（例如可破坏的木桶，其中每块木板都是一个单独的物体就是一个很好的例子）。Asset Store 上也有不同的破碎系统可用（尝试搜索“fracture”、“shatter”或“destructible”）。\n\
  \n## 使用 Ragdoll 助手创建人形布娃娃\n\n在本教程中，我们将把角色变成布娃娃并学习如何启用和禁用布娃娃。我们将使用 Unity 内置的 Ragdoll\
  \ 助手，它对于创建人形布娃娃非常有用：\n\n![](img/616a75b593bef4212f618360fceea442_275_0.png)\n\n\
  应用了布娃娃效果的角色\n\n### 准备工作\n\n对于本教程，我们需要一个动画角色。我们可以使用之前使用过的角色（例如来自第 4 章《角色移动》的角色）。你也可以前往\
  \ Chapter 09 Physics and animations\\Recipe 04 Creating a humanoid ragdoll with\
  \ ragdoll wizard 目录。你可以在那里找到 Example.unity 场景。如果运行游戏并按下空格键，角色将变成布娃娃。你可以再次按下空格键来关闭布娃娃。\n\
  \n### 如何操作...\n\n要创建人形布娃娃，请按照以下步骤操作：\n\n- 1. 将你的角色放置在场景中。\n- 2. 进入 Game Object |\
  \ 3D Object | Ragdoll 以打开 Create Ragdoll 窗口。\n- 3. 将角色骨骼从角色骨架拖放到 Create Ragdoll\
  \ 窗口中的字段中。这些字段的名称不够准确。Left Hips 表示左大腿，Left Knee 表示左小腿，LeftArm 表示左上臂，LeftElbow 表示左下臂，如以下截图所示。右侧同理。其余名称不言自明：\n\
  \n![](img/616a75b593bef4212f618360fceea442_276_0.png)\n\nCreate Ragdoll 窗口\n\n4.\
  \ 在你分配所有骨骼后，点击 **创建** 按钮。布娃娃将被创建。**刚体**、**胶囊碰撞体**（或 **盒状碰撞体**）和 **角色关节** 组件将被添加到所需的骨骼上。\n\
  \n5. 你可能需要调整碰撞体的大小以更好地匹配角色的形状。参见以下截图：\n\n![](img/616a75b593bef4212f618360fceea442_277_0.png)\n\
  \n已配置的布娃娃\n\n6. 在游戏中添加两个图层：**角色** 和 **布娃娃**。为此，进入 **编辑** | **项目设置** | **标签和图层**。\n\
  \n7. 将角色的图层设置为 **角色**，将其骨架及其所有子对象（布娃娃）设置为 **布娃娃**。\n\n8. 进入 **编辑** | **项目设置** |\
  \ **物理** 并禁用 **角色** 和 **布娃娃** 图层之间的碰撞。这是一种防止布娃娃与角色的主碰撞体发生碰撞的好方法，否则会导致不想要的行为（抖动、移动故障等）。\n\
  \n9. 创建一个新的 C# 脚本并将其命名为 `HandleRagdoll.cs`。在此脚本中，我们有 `public void EnableRagdoll(bool\
  \ enable, List<Rigidbody> rigidbodies)` 函数。它遍历 `public Transform charactersRig`\
  \ 变换下的所有子对象所附带的刚体，并根据 enable 标志启用或禁用它们。它还启用或禁用 `mainRigidbody` 和 `mainCollider`（附加到角色根对象上）。最后，它启用或禁用角色的\
  \ **动画器** 组件：\n\n```\npublic void EnableRagdoll(bool enable, List<Rigidbody>\nrigidbodies)\n\
  {\n```\n\n```\nfor (int i = 0; i < rigidbodies.Count; i++)\n{\n    rigidbodies[i].isKinematic\
  \ = !enable;\n}\nif (mainCollider != null)\n{\n    mainCollider.enabled = !enable;\n\
  }\nif (mainRigidbody != null)\n{\n    mainRigidbody.isKinematic = enable;\n}\nif\
  \ (anim != null)\n{\n    anim.enabled = !enable;\n}\n```\n\n- 10. 我们在玩家每次按下空格键时调用此函数。在游戏开始时，我们收集附加到角色骨架子对象上的所有刚体并将它们存储在全局列表中。我们每次调用时都将该列表传递给\
  \ `EnableRagdoll()` 函数。我们还在游戏开始时使用 `enable` 参数设置为 `false` 调用 `EnableRagdoll()` 函数。这会禁用布娃娃。\n\
  - 11. 将脚本附加到角色上，并将其骨架拖到脚本的 **角色骨架** 字段中。\n- 12. 运行游戏并按下空格键以查看效果。\n\n### 如何工作...\n\
  \n**创建布娃娃** 窗口有助于将 **角色关节**、**胶囊碰撞体** 和 **刚体** 组件附加到人形角色的骨架上。这些角色不必像 Mecanim 功能那样使用\
  \ Humanoid 骨架。\n\n刚体、碰撞体和角色关节组件共同创建布娃娃。要打开布娃娃，我们需要禁用 Animator 组件，因为动画会覆盖刚体的运动。这就是我们的脚本所做的。它还在布娃娃关闭时使布娃娃的刚体变为运动学状态，以便在不需要时关闭物理模拟。\n\
  \n## 使用角色关节创建通用布娃娃\n\n这次我们将为非人形角色创建布娃娃。在这种情况下我们无法使用 Ragdoll 助手，而是将手动制作布娃娃。\n\n![](img/616a75b593bef4212f618360fceea442_279_0.png)\n\
  \n通用角色布娃娃的演示\n\n### 准备工作\n\n对于本教程，我们需要一个非人形角色。我们以老朋友蜘蛛为例。角色需要进行绑定。你也可以打开示例 Unity\
  \ 项目并前往 Chapter 09 Physics and animations\\Recipe 05 Creating a generic ragdoll\
  \ with character joints 目录。如果在那里打开 Example.unity 场景并运行游戏，你将看到一只正在下落且布娃娃已开启的蜘蛛。你可以在\
  \ Rigs 目录中找到 Spider。\n\n### 如何操作...\n\n要创建通用布娃娃，请按照以下步骤操作：\n\n- 1. 将角色导入 Unity 并放置在场景中。\n\
  - 2. 选择角色骨架中将用于布娃娃模拟的所有骨骼。在我们的示例中，我们跳过了獠牙。\n- 3. 向所选骨骼添加胶囊碰撞体、刚体和角色关节组件。\n\n- 4.\
  \ 调整碰撞体的形状以匹配角色的四肢。你应避免碰撞体相互相交。你可能需要将一些碰撞体更改为 **盒状碰撞体** 或 **球形碰撞体**（我们的蜘蛛腹部使用 **盒状碰撞体**\
  \ 而非 **胶囊碰撞体**，头部使用 **球形碰撞体**）。\n- 5. 确保所有 **角色关节** 都选中了 **自动配置连接锚点** 选项。\n- 6.\
  \ 选择角色的根身体部位（对于我们的 **蜘蛛**，它是腹部）。\n- 7. 从该身体部位移除 **角色关节** 组件，使其像普通刚体一样工作。\n- 8. 将所有其他\
  \ **角色关节** 连接到其父游戏对象（也包含 **角色关节** 组件）。例如，如果角色有一条由三个段组成的腿，**Leg1**、**Leg2** 和 **Leg3**，则将\
  \ **Leg2** 对象拖到 **Leg3** 对象的 **角色关节** 组件中的 **连接体** 字段。然后将 **Leg1** 拖到 **Leg2** 的\
  \ **连接体** 字段。最后将 **Leg1** 拖到其根骨骼的 **连接体** 字段（在我们的例子中是 **腹部**）。\n- 9. 对所有带有 **角色关节**\
  \ 的骨骼重复此过程。关节的层级应反映骨架的层级。\n- 10. 禁用角色的 **动画器** 组件并运行游戏以查看效果。你可能需要进一步调整 **角色关节**\
  \ 组件的属性以达到所需效果：\n\n![](img/616a75b593bef4212f618360fceea442_280_0.png)\n\n具有定义布娃娃的蜘蛛\n\
  \n\n\n\n### 工作原理...\n\n在本教程中，我们使用 **角色关节** 组件从零开始创建一个布娃娃。每个这样的组件都必须与附加到同一游戏对象的 **刚体**\
  \ 组件和 **碰撞体** 组件配合使用。我们可以通过将连接的游戏对象拖到关节的 **连接体** 字段来创建 **角色关节** 组件的链条。\n\n**角色关节**\
  \ 组件有一组可以调整的参数：\n\n- **连接体**：这是关节所连接的父对象。\n- **锚点**：这是关节绕其旋转的空间点。\n- **轴**：这是扭转轴——骨骼将绕其扭转的轴。它用橙色箭头可视化。\n\
  - **自动配置连接锚点**：如果希望 Unity 尝试自动配置连接锚点，请启用此选项。\n- **连接锚点**：如果禁用 **自动配置连接锚点**，则可以在此处手动配置它。\n\
  - **摆动轴**：这是骨骼将摆动（或弯曲）的轴。它用绿色箭头可视化。\n- **低扭转限制**：这是骨骼扭转的下限角度。\n- **高扭转限制**：这是骨骼扭转的上限角度。\n\
  - **摆动1限制**：这是骨骼摆动的下限角度。\n- **摆动2限制**：这是骨骼摆动的上限角度。\n- **断裂力**：这是破坏关节所需的力。\n- **断裂扭矩**：这是破坏关节所需的扭矩。\n\
  - **启用碰撞**：如果勾选，则此关节连接的刚体之间的碰撞将被启用。\n- **启用预处理**：用于稳定无法满足的场景。\n\n## 对布娃娃施加力\n\n\
  在本教程中，我们将在打开布娃娃时对其施加额外的力。通常，当你打开布娃娃时，它从静止状态开始；不会引入初始运动。看起来僵硬不自然。对身体部位施加力将有助于避免这种情况。\n\
  \n### 准备工作\n\n我们将使用 *使用 ragdoll 巫师创建人形布娃娃* 教程中的相同角色。我们还将使用同一教程中的 `HandleRagdoll.cs`\
  \ 脚本来打开布娃娃。你也可以打开示例 Unity 项目并进入 `Chapter 09 Physics and animations\\Recipe 06 Applying\
  \ force to a ragdoll` 目录。如果在那里打开 `Example.unity` 场景并运行游戏，你可以点击角色的任何身体部位。这将打开布娃娃并对该身体部位施加力，使角色看起来像是在该肢体被击中或射击：\n\
  \n![](img/616a75b593bef4212f618360fceea442_282_0.png)\n\n直接作用于角色头部的作用力\n\n### 操作方法\n\
  \n要对布娃娃的身体部位施加力，请按照以下步骤操作：\n\n- 1. 按照 *使用 ragdoll 巫师创建人形布娃娃* 教程操作，使角色拥有可工作的布娃娃和\
  \ `HandleRagdoll.cs` 脚本（用于打开布娃娃的脚本）。\n- 2. 创建一个新的 C# 脚本并将其命名为 `RagdollForceApply.cs`。在此脚本的\
  \ `Update()` 函数中，我们首先检查玩家是否点击了鼠标左键。然后我们从鼠标光标位置沿摄像机方向创建一个射线，并检查是否击中了具有 `public LayerMask\
  \ ragdollBodyPartsLayer` 变量描述的其中一个图层的碰撞体。如果我们成功击中碰撞体，我们将尝试从中获取 `Rigidbody` 组件并将其存储在我们的\
  \ `Rigidbody hitBodyPart` 变量中。如果我们确实找到了刚体，我们将调用 `void AddForce()` 函数：\n\n```\nif\
  \ (Input.GetKeyDown(KeyCode.Mouse0))\n{\n    if (Physics.Raycast(Camera.main.ScreenPointToRay\n\
  \    (Input.mousePosition), out hitInfo, 100f,\n    ragdollBodyPartsLayer))\n  \
  \  {\n        hitBodyPart = hitInfo.collider.gameObject\n        .GetComponent<Rigidbody>();\n\
  \        if (hitBodyPart != null)\n        {\n            AddForce();\n        }\n\
  \    }\n}\n```\n- 3. `void AddForce()` 函数使用 HandleRagdoll 脚本打开布娃娃。之后，它以 `public\
  \ float forceMagnitude` 的强度沿摄像机方向施加力：\n\n```\nvoid AddForce()\n{\n    ragdollHandler.EnableRagdoll(true);\n\
  \    force = (hitInfo.point -\n    Camera.main.transform.position).normalized *\n\
  \    forceMagnitude;\n    hitBodyPart.AddForce(force, ForceMode.Impulse);\n}\n```\n\
  - 4. 我们在 `Start()` 函数中设置对 HandleRagdoll 脚本的引用。\n- 5. 将脚本添加到角色。\n- 6. 确保角色布娃娃的身体部位设置了正确的图层。\n\
  - 7. 在检查器中将 RagdollForceApply 中的布娃娃身体部位图层掩码设置为与布娃娃身体部位的图层相匹配。\n- 8. 运行游戏并点击角色的任意身体部位以查看效果。\n\
  \n### 工作原理\n\n本教程 simply 使用在肢体 `RigidBody` 组件上调用的 `AddForce()` 函数对布娃娃的选定身体部位施加力。该函数需要一个\
  \ `Vector3 force` 参数来描述施加力的方向和大小。我们还可以指定一个 `ForceMode` 模式参数来更改施加力的模式。在这里，我们选择使用\
  \ `ForceMode.Impulse`，因为我们的力只在一帧内施加。\n\n脚本的其余部分处理选择要施加力的身体部位。在此示例中，我们使用鼠标输入投射射线并尝试击中身体部位的碰撞体。如果我们成功击中，我们就选择该特定肢体作为要施加力的目标。\n\
  \n### 扩展知识\n\n你也可以使用 *可破坏对象* 教程中说明的概念来存储角色（或其肢体）的速度，然后将其应用到布娃娃的身体部位。为此，你可以在 `Update\
  \ ()` 函数中通过将当前位置减去上一个位置，以及当前欧拉角旋转减去上一个旋转来计算任何给定身体部位的线速度和角速度。然后在打开布娃娃时，可以将计算出的值作为\
  \ `velocity` 和 `angularVelocity` 应用到该部位的 `Rigidbody` 组件。\n\n## 分离肢体\n\n本教程展示了如何为绑定角色创建分离肢体效果。我们将以斩首为例。这种效果常用于各种战斗游戏（包括射击游戏和近战游戏）：\n\
  \n![](img/616a75b593bef4212f618360fceea442_284_0.png)\n\n斩首——分离肢体效果的示例\n\n### 准备工作\n\
  \n我们将使用 *使用 ragdoll 巫师创建人形布娃娃* 教程中的相同角色。我们还将使用同一教程中的 `HandleRagdoll.cs` 脚本来打开布娃娃。除此之外，我们还需要两个额外的网格：**头部**\
  \ 模型和 **颈部** 模型。参考以下截图：\n\n![](img/616a75b593bef4212f618360fceea442_285_0.png)\n\
  \n颈部和头部模型\n\n你也可以打开示例 Unity 项目并进入 `Chapter 09 Physics and animations\\Recipe 07\
  \ Dismemberment` 目录。如果在那里打开 `Example.unity` 场景，运行游戏并按空格键，贫穷的角色将被斩首。你可以在 `Models`\
  \ 目录中找到所有额外的模型。\n\n### 操作方法\n\n要创建斩首效果，请按照以下步骤操作：\n\n- 1. 按照 *使用 ragdoll 巫师创建人形布娃娃*\
  \ 教程操作，使角色拥有可工作的布娃娃和 `HandleRagdoll.cs` 脚本（用于打开布娃娃的脚本）。\n- 2. 导入 **颈部** 和 **头部**\
  \ 模型并将其放置在场景中角色附近。\n- 3. 创建两个空游戏对象；第一个命名为 **头部标记**，第二个命名为 **颈部标记**。\n- 4. 将 **头部标记**\
  \ 设为头部骨骼的子对象，将 **颈部标记** 设为颈部骨骼的子对象。确保 **头部标记** 和 **颈部标记** 的本地位置为 0。\n- 5. 将 **头部**\
  \ 对象设为 **头部标记** 的子对象，将 **颈部** 对象设为 **颈部标记** 的子对象。将 **头部** 和 **颈部** 的本地旋转和位置归零。\n\
  \n\n\n+   6. 使用 **HeadMarker** 和 **NeckMarker** 来定位 **Head** 和 **Neck**，使其尽可能匹配角色的头部和颈部。记住\
  \ **Head** 和 **Neck** 的本地位置和旋转为 0，因此通过操作 **HeadMarker** 和 **NeckMarker** 来定位它们，会使我们之后更容易生成\
  \ **Head** 和 **Neck**。\n+   7. 为 **Head** 游戏对象添加一个 **Sphere Collider** 和一个 **Rigidbody**\
  \ 组件。\n+   8. 从 **Head** 游戏对象制作一个预制体，并从 **Neck** 游戏对象制作另一个预制体。\n+   9. 从场景中删除 **Head**\
  \ 和 **Neck**，但确保 **HeadMarker** 和 **NeckMarker** 仍作为父对象保持在角色骨架中对应的骨骼下。\n+   10.\
  \ 创建一个新的 C# 脚本并将其命名为 `Dismemberment.cs`。在此脚本的 `Update()` 函数中，我们检查玩家是否按下空格键，如果 `wasSevered`\
  \ 标志为 `false` 则调用 `void Decapitate()` 函数（你真的只能斩首一次）：\n+   11. `void Decapitate()`\
  \ 函数完成剩余工作。首先它检查是否找到了 `HandleRagdoll.cs` 脚本（对它的引用在 `Start()` 函数中设置）。如果找到了，我们使用它启用\
  \ ragdoll 并禁用该脚本。接下来我们从头部骨骼中移除 **Character Joint**、**Rigidbody** 和 **Collider**\
  \ 组件（我们将把它缩放到 0，因为我们不想再处理这个关节了）。接下来我们从存储在 `public GameObject headPrefab` 变量中的预制体生成新的、被斩断的\
  \ **Head**。**Head** 使用 **HeadMarker** 的位置和旋转生成，其引用存储在 `public Transform headMarker`\
  \ 变量中。然后我们获取生成的 **Head** 的 **Rigidbody** 组件并施加随机力和随机扭矩使其移动。我们使用 `public Vector3`\
  \ 变量来存储 `randomForce1`、`randomForce2`、`randomTorque1` 和 `randomTorque2` 值。我们有一个小的辅助函数\
  \ `Vector3 RandomVector(Vector3 v1, Vector3 v2)`，它接受两个向量并返回由这两个参数构建的随机向量。最后，我们将头部骨骼缩放到\
  \ 0（其引用存储在 `public Transform head` 变量中）。最后，我们生成 **Neck** 预制体并将其设为 **NeckMarker**\
  \ 的子对象：\n\n```\nif (Input.GetKeyDown(KeyCode.Space) && !wasSevered)\n{\n    Decapitate();\n\
  }\n```\n\n```\nwasSevered = true;\nif (ragdollHandler != null)\n```\n\n```\n{\n\
  \    ragdollHandler.EnableRagdoll(true);\n    ragdollHandler.enabled = false;\n\
  }\nJoint headJoint = head.GetComponent<Joint>();\nif (headJoint != null)\n{\n  \
  \  Destroy(headJoint);\n}\nCollider headCollider = head.GetComponent<Collider>();\n\
  if (headCollider != null)\n{\n    Destroy(headCollider);\n}\nRigidbody headRigidBody\
  \ = head.GetComponent<Rigidbody>();\nif (headRigidBody != null)\n{\n    Destroy(headRigidBody);\n\
  }\nGameObject spawnedHead =\n(GameObject)GameObject.Instantiate(headPrefab,\nheadMarker.position,\
  \ headMarker.rotation);\n\nRigidbody spawnedHeadRB = spawnedHead.GetComponent<Rigidbody>();\n\
  if (spawnedHeadRB != null)\n{\n    spawnedHeadRB.AddForce(RandomVector(randomForce1,\n\
  \    randomForce2), ForceMode.Impulse);\n\n    spawnedHeadRB.AddTorque(RandomVector(randomTorque1,\n\
  \    randomTorque2),ForceMode.Impulse);\n}\nhead.localScale = Vector3.zero;\n\n\
  GameObject spawnedNeck =\n(GameObject)GameObject.Instantiate(neckPrefab,\nneckMarker.position,\
  \ neckMarker.rotation);\nspawnedNeck.transform.parent = neckMarker;\n```\n\n+  \
  \ 12. 将脚本添加到角色上。\n+   13. 运行游戏并按空格键查看效果。\n\n## 它是如何工作的...\n\n本食谱的主要特点是隐藏角色的头部。为此，我们只需将头部骨骼缩放到\
  \ 0。分配给该骨骼的所有顶点将被压缩到空间中的同一点。在隐藏头部后，我们可以生成一个带有 **Rigidbody** 组件和附加 **Collider** 的第二个头部。这样我们的第二个头部就会掉落。为了使效果更壮观，我们为新生成的头部添加了少量随机力和扭矩。这使其在斩首后旋转并飞起。\n\
  \n我们还生成一个颈部游戏对象，以掩盖缩放头部到 0 后出现的拉伸多边形。我们使用父对象设为角色骨架中对应骨骼的 **HeadMarker** 和 **NeckMarker**\
  \ 游戏对象，只是因为它们使匹配 **Head** 和 **Neck** 对象的位姿和旋转变得更容易。\n\n## 还有更多...\n\n你也可以用这种技术切断其他肢体。如果想将此概念用于切断手臂或腿部，请考虑生成一个带有\
  \ ragdoll 的带骨骼的断臂或断腿。这样的 ragdoll 只包含两个 **Rigidbody** 组件、两个 **Colliders** 和一个 **Character\
  \ Joint**（肘部或膝盖）。\n\n## 从 ragdoll 中站起\n\n本食谱稍微更高级但很有趣。它使我们的角色使用三种不同的骨架：原始动画骨架、角色网格蒙皮的骨架以及\
  \ ragdoll。通过使用这三种骨架，我们可以随时在 ragdoll 和动画之间平滑混合。\n\n## 准备工作\n\n再次，我们将使用与 *Creating\
  \ a humanoid ragdoll with the ragdoll wizard* 食谱中相同的角色。我们需要两个起身动画：一个是从面朝下位置起身，一个是从面朝上位置起身。分别将它们命名为\
  \ **StandUpFaceUp** 和 **StandUpFaceDown**。我们还需要至少一个循环的 **Idle** 动画。\n\n你也可以打开示例\
  \ Unity 项目并进入 `Chapter 09 Physics and animations\\Recipe 08 Getting up from a ragdoll`\
  \ 目录。如果在那里打开 `Example.unity` 场景，运行游戏并按空格键；角色将使用 ragdoll 倒下。如果再次按空格键，它将从 ragdoll\
  \ 混合到起身动画并再次被动画化。\n\n## 如何操作...\n\n使角色从 ragdoll 状态站起来，请按照以下步骤操作：\n\n+   1. 将你的角色放置在场景中。\n\
  +   2. 制作它的两个副本并将角色命名为 **CharacterAnimated**、**CharacterSkinned** 和 **CharacterRagdoll**。我们将使用这些名称以提高清晰度。\n\
  +   3. 使所有角色在场景中站在完全相同的位置。\n+   4. 选择 **CharacterRagdoll** 并按照 *Creating a humanoid\
  \ ragdoll with the ragdoll wizard* 食谱制作一个可用的 ragdoll 角色。这次我们不会使用 `HandleRagdoll.cs`\
  \ 脚本，因此你可以在使用 Ragdoll Wizard 后停止。\n+   5. 选择 **CharacterRagdoll** 游戏对象的骨架并将其命名为\
  \ `Ragdoll`。\n+   6. 选择 **CharacterAnimated** 并展开其层级。\n+   7. 删除除角色骨架外的所有对象。你不能更改骨架的名称。\n\
  +   8. 选择 **CharacterSkinned** 并展开其层级。\n+   9. 将 **CharacterSkinned** 骨架重命名为 `SkinnedRig`。\n\
  +   10. 选择 **SkinnedRig** 和蒙皮网格（如果有多个则为多个）。将它们拖放到 **CharacterAnimated** 上。可能会出现关于预制体连接丢失的警告窗口。点击\
  \ **Continue**。这将使 **SkinnedRig** 和蒙皮到它的网格成为 **CharacterAnimated** 游戏对象的子对象。\n+\
  \   11. 选择 **CharacterRagdoll**，抓取 **Ragdoll** 骨架并将其拖放到 **CharacterAnimated** 游戏对象上以设为其子对象。如果出现警告再次点击\
  \ **Continue**。\n+   12. 你可以删除 **CharacterRagdoll** 和 **CharacterSkinned** 游戏对象。\n\
  +   13. 创建一个 Animator Controller 或打开一个已有的。\n+   14. 在此控制器中，创建两个 Triggers：**StandUpFaceUp**\
  \ 和 **StandUpFaceDown**。\n15. 创建四个过渡：\n+   - **Any State | StandUpFaceDown** 条件为一个：**StandUpFaceDown**\
  \ Trigger。**Has Exit Time** 应设为 false 且 **Transition Duration** 设为 0。\n+   - **Any\
  \ State | StandUpFaceUp** 条件为一个：**StandUpFaceUp** Trigger。**Has Exit Time** 应设为\
  \ false 且 **Transition Duration** 设为 0。\n+   - **StandUpFaceDown | Idle** 无条件：**Has\
  \ Exit Time** 应设为 true 且 **Transition Duration** 设为大约 0.2。\n+   - **StandUpFaceUp\
  \ | Idle** 无条件：**Has Exit Time** 应设为 true 且 **Transition Duration** 设为大约 0.2。\n\n\
  16. 将控制器分配给角色的 Animator 组件。\n\n17. [Optional] 你可以在 `Shared Scripts` 文件夹中找到 `ShowRig.cs`\
  \ 脚本。如果将其三次附加到 **CharacterAnimated** 游戏对象，你可以将它的三个骨架拖放到每个 `ShowRig` 脚本中。你也可以为每个骨架分配不同的颜色。如果运行游戏，你将能够看到三个骨架的工作情况。在下面的截图中，红色骨架是\
  \ ragdoll，黄色的是被动画化的骨架（我们不能更改其名称，在我们的示例中它称为 `metarig`），绿色的是我们的网格蒙皮的骨架（它不太明显，因为它隐藏在网格内部）。\n\
  \n![](img/616a75b593bef4212f618360fceea442_290_0.png)\n\nRagdoll 骨架（红色）、动画骨架（黄色）和蒙皮骨架（绿色）\n\
  \n\n\n\n18. 创建一个新的 C# 脚本并命名为 RagdollWeight.cs。该脚本包含多个函数。首先，在从 Start() 函数调用的 void\
  \ Init() 函数中，我们设置对三个骨架的骨骼的引用，以便稍后在它们之间进行混合。我们还获取附加到角色上的 RigidBody 和 Animator 组件的引用。最后，我们关闭\
  \ ragdoll 游戏对象：\n\n```\nvoid Init()\n{\n    rb = GetComponent<Rigidbody>();\n  \
  \  anim = GetComponent<Animator>();\n    skinnedRigTransforms = \n    skinnedRig.GetComponentsInChildren<Transform>();\n\
  \    ragdollTransforms = \n    ragdoll.GetComponentsInChildren<Transform>();\n \
  \   animatedRigTransforms = \n    animatedRig.GetComponentsInChildren<Transform>();\n\
  \    ragdoll.gameObject.SetActive(false);\n}\n```\n\n19. 在 void EnableRagdoll()\
  \ 函数中，我们首先检查 float blendFactor 是否不大于 0.5（这意味着我们仍处于“ragdoll 阶段”）。如果它小于 0.5，我们将所有\
  \ ragdoll 骨骼的位置和旋转设置为与 animatedRigTransforms 匹配（我们使 ragdoll 的姿势与当前角色姿势匹配）。最后，我们将主\
  \ RigidBody 组件设置为 kinematic 并启用 ragdoll 游戏对象。我们还将 blendFactor 设置为 1，这意味着 ragdoll\
  \ 已完全启用：\n\n```\nvoid EnableRagdoll()\n{\n    if(blendFactor > 0.5f)\n    {\n  \
  \      return;\n    }\n    for (int i = 0; i < ragdollTransforms.Length; i++)\n\
  \    {\n        ragdollTransforms[i].localPosition = \n        animatedRigTransforms[i].localPosition;\n\
  \        ragdollTransforms[i].localRotation = \n        animatedRigTransforms[i].localRotation;\n\
  \    }\n    rb.isKinematic = true;\n    ragdoll.gameObject.SetActive(true);\n  \
  \  ragdollOn = true;\n    blendFactor = 1f;\n}\n```\n\n20. 在 void DisableRagdoll()\
  \ 函数中，我们检查角色是面朝下还是面朝上躺着并播放适当的站立动画。在触发动画后，我们启动 IEnumeratorBlendFromRagdoll() 协程以平滑地从\
  \ ragdoll 骨架混合到 animatedRig：\n\n```\nvoid DisableRagdoll()\n{\n    bool faceUp =\
  \ Vector3.Dot(\n        faceDirectionHelper.forward, Vector3.up) > 0f;\n    if (faceUp)\n\
  \    {\n        anim.SetTrigger(\"StandUpFaceUp\");\n    }\n    else\n    {\n  \
  \      anim.SetTrigger(\"StandUpFaceDown\");\n    }\n\n    StartCoroutine(\"BlendFromRagdoll\"\
  );\n}\n```\n\n21. IEnumerator BlendFromRagdoll() 协程随时间减少 blendFactor 并检查它是否仍大于 0。如果它小于或等于\
  \ 0，我们将其设置为恰好为 0，再次启用主 RigidBody 组件，并禁用 ragdoll：\n\n```\nIEnumerator BlendFromRagdoll()\n\
  {\n    while (blendFactor > 0f)\n    {\n        blendFactor -= Time.deltaTime *\
  \ blendSpeed;\n        yield return null;\n    }\n    blendFactor = 0f;\n    rb.isKinematic\
  \ = false;\n    blendFactor = 0f;\n    ragdollOn = false;\n    ragdoll.gameObject.SetActive(false);\n\
  }\n```\n\n22. 在 FixedUpdate() 函数中，如果 ragdoll 已启用，我们将角色的 RigidBody 移动到 ragdoll 臀部的位置。我们还额外检查地面位置，以确保主\
  \ RigidBody 站在地面上并且不会漂浮。我们还旋转 RigidBody，使角色朝向臀部 -> 头部的方向。我们有意省略 Vector3 desiredLookVector\
  \ 的 Y 分量，以防止角色胶囊倾斜。将角色的 RigidBody 移动到 ragdoll 臀部的位置使得从 ragdoll 到动画的混合更容易：\n\n```\n\
  void FixedUpdate()\n{\n    if (!ragdollOn)\n    {\n        return;\n    }\n    desiredLookVector\
  \ = head.position - hips.position;\n    desiredLookVector.y = 0f;\n    desiredLookVector\
  \ = desiredLookVector.normalized;\n    lookVector = Vector3.Slerp(transform.forward,\n\
  \        desiredLookVector, Time.deltaTime);\n\n    if (Physics.Raycast(hips.position,\
  \ Vector3.down,\n        out groundHit, groundCheckDistance,\n        groundCheckMask))\n\
  \    {\n        finalPosition = groundHit.point;\n    }\n    else\n    {\n     \
  \   finalPosition = hips.position;\n    }\n    rb.MovePosition(finalPosition);\n\
  \    rb.MoveRotation(Quaternion.LookRotation(lookVector\n    ));\n}\n```\n\n23.\
  \ 在 Update() 函数中，我们检查玩家是否按下了空格键。如果是，我们根据 ragdoll 当前是启用还是禁用来启用或禁用 ragdoll：\n\n```\n\
  void Update()\n{\n    if (Input.GetKeyDown(KeyCode.Space))\n    {\n        if (ragdollOn)\n\
  \        {\n            DisableRagdoll();\n        }\n        else\n        {\n\
  \            EnableRagdoll();\n        }\n    }\n}\n```\n\n24. 在 LateUpdate() 函数中，我们不断插值\
  \ skinnedRig（角色网格使用的骨架）的所有骨骼的 localPosition 和 localRotation。骨骼的位置和旋转在 ragdoll 和\
  \ animatedRig 的位置和旋转之间进行插值。我们使用 blendFactor 变量进行插值：\n\n```\nvoid LateUpdate()\n\
  {\n    for (int i=0; i<skinnedRigTransforms.Length; i++)\n    {\n        skinnedRigTransforms[i].localPosition\
  \ =\n            Vector3.Lerp(\n                animatedRigTransforms[i].localPosition,\n\
  \                ragdollTransforms[i].localPosition,\n                blendFactor);\n\
  \n        skinnedRigTransforms[i].localRotation =\n            Quaternion.Lerp(\n\
  \                animatedRigTransforms[i].localRotation,\n                ragdollTransforms[i].localRotation,\n\
  \                blendFactor);\n    }\n}\n```\n\n25. 将上述脚本添加到角色中。\n\n26. 将动画骨架（在我们的示例中称为\
  \ metarig）拖放到 Animated Rig 字段，将 Ragdoll 拖放到 Ragdoll 字段，并将 SkinnedRig 拖放到 Skinned\
  \ Rig 字段。选择胸部骨骼作为 Face Direction Helper（如果不起作用，您可以创建一个父级为胸部骨骼的空对象——目标是使此辅助对象的向前轴在角色面朝下躺着时指向下方，在角色面朝上躺着时指向上方）。将\
  \ Ground Check Mask 设置为包含您的关卡图层。将臀部骨骼分配给 Hips 字段，将头部骨骼分配给 Head 字段（您可以选择其他骨骼，只要它们能正确描述\
  \ ragdoll 启用时角色的旋转即可）。\n\n27. 播放游戏并按空格键查看效果。\n\n## How it works...\n\n本食谱背后的概念基于拥有三个骨架：一个保存动画，一个是简单的\
  \ ragdoll，一个是网格蒙皮的骨架。为了在 Unity 中实现它，我们需要复制角色三次。其中一个副本用于创建 ragdoll，第二个是动画骨架，我们需要从中移除网格，最后一个是带有骨架但没有\
  \ Animator 组件的网格。所有这些对象最终都会被父级化到动画骨架的父级（CharacterAnimated 游戏对象）。这样，我们的角色仍然是一个单一的游戏对象，并且可以用\
  \ root motion 驱动。最终的层级结构如下所示：\n\n+   - **CharacterAnimated**\n+   - **metarig (the\
  \ original name of the rig of this character)**\n+   - **SkinnedRig**\n+   - **SkinnedMesh**\n\
  +   - **Ragdoll**\n\n通过这种设置，我们可以从 metarig（实际被动画化的骨架）、SkinnedRig（网格蒙皮的骨架）和 ragdoll\
  \ 获取所有变换。由于我们角色的网格使用的是 SkinnedRig（在游戏中看不到另外两个骨架），我们可以动态设置其变换的位置和旋转。这样我们就可以使用 Vector3.Lerp()\
  \ 和 Quaternion.Lerp() 函数在 Ragdoll 和 metarig（动画骨架）的变换之间插值 SkinnedRig 变换。\n\n站立动画是这样准备的，角色的臀部大致位于\
  \ 0,0,0 点。我们将角色的主 RigidBody 移动到 ragdoll 臀部所在的位置。这样，当我们混合到站立动画时，我们角色的动画骨架（一个动画）与\
  \ ragdoll 的位置相匹配。其余部分由从 ragdoll 到当前动画的姿势混合处理。\n\n## There's more...\n\n您也可以将此概念用于非人形角色。\n\
  \n\n\n## 10"
- "\n## 杂项\n\n本章包含若干额外食谱：\n\n- 使用数学为对象制作动画\n- 使用 Lerp() 函数为对象制作动画\n- 使用 Rotate() 函数为对象制作动画\n\
  - 为人形角色准备动作捕捉文件\n- 为 Mecanim 状态添加行为\n\n### 引言\n\n本章包含具有实用技巧和解决方案的额外食谱。\n\n## 使用数学为对象制作动画\n\
  \n我们可以使用数学公式创建外观有趣的动画。我们将使用这一概念，利用 Mathf.Sin() 和 Mathf.Cos() 函数制作无限曲线动画。\n\n###\
  \ 准备工作\n\n本食谱不需要任何特殊内容。我们将在 Unity 中从头开始创建它。您也可以下载提供的示例项目。打开 `Chapter 10 Miscellaneous\\\
  Recipe 01 Using math to animate an object` 目录并加载其中的 `Example.unity` 场景。如果运行游戏，您将看到成品效果——使用\
  \ `Mathf.Sin()` 和 `Mathf.Cos()` 函数制作的曲线动画：\n\n![](img/616a75b593bef4212f618360fceea442_297_0.png)\n\
  \n最终效果——使用 Mathf.Sin() 和 Mathf.Cos() 函数制作的曲线动画\n\n### 如何操作...\n\n要使用数学为曲线制作动画，请按照以下步骤操作：\n\
  \n1. 创建一个空游戏对象。\n2. 为其添加 **Line Renderer** 组件。\n3. 创建一个您喜欢的新材质并将其分配给 **Line Renderer**。\n\
  4. 确保 **Line renderer** 组件中的 **Use World Space** 选项未被选中（在本示例中我们将使用局部坐标，因为这样在摄像机中定位\
  \ **Line Renderer** 会稍微容易一些）。\n5. 将 **Line Renderer** 的 **Start Width** 和 **End\
  \ Width** 改为 0.2 以使线条变细。\n6. 创建一个新的 C# 脚本并将其命名为 `MathAnim.cs`。在此脚本的 `Start()` 函数中，我们使用\
  \ `SetVertices()` 方法设置 `Line Renderer` 的点数：\n\n```\npositions = new Vector3[linePoints];\n\
  lRenderer = GetComponent<LineRenderer>();\n```\n\n```\nif (lRenderer != null)\n\
  {\n    lRenderer.SetVertexCount(linePoints);\n}\n```\n\n7. 然后，在 Update() 函数中，我们调用\
  \ void SetLinePositions() 函数并移动游戏对象，使线条中心位于 (0, 0, 0) 点：\n\n```\ntransform.position\
  \ = new Vector3(-0.5f\n    * lineLength, 0f, 0f);\nSetLinePositions();\n```\n\n\
  8. 在 void SetLinePositions() 函数中，使用 Mathf.Sin() 和 Mathf.Cos() 函数计算点的 Y 和 Z 位置。我们使用\
  \ SetPositions() 函数设置线条点的坐标。我们还使用一个简单的计时器将时间引入公式。我们有两个计时器：timerY 和 timerZ。第一个用于\
  \ Y 位置值，第二个用于 Z 位置值。我们还有用于控制 frequencyY、frequencyZ、amplitudeY 和 amplitudeZ 的 public\
  \ float 变量。线条点的 X 位置以相等距离设置，使得线条总长度等于 public float lineLength 变量的值：\n\n```\nif (lRenderer\
  \ == null)\n{\n    return;\n}\n\ntimerY += Time.deltaTime * speedY;\ntimerZ += Time.deltaTime\
  \ * speedZ;\n\nfor (int i = 0; i < positions.Length; i++)\n{\n    positions[i].x\
  \ = lineLength * (float)i /\n        (float)positions.Length;\n    positions[i].y\
  \ = amplitudeY * Mathf.Sin(frequencyY\n        * ((2f*Mathf.PI * (float)i /\n  \
  \      (float)positions.Length) + timerY));\n    positions[i].z = amplitudeZ * Mathf.Cos(frequencyZ\n\
  \        * ((2f * Mathf.PI * (float)i /\n        (float)positions.Length) + timerZ));\n\
  }\nlRenderer.SetPositions(positions);\n```\n\n9. 将脚本附加到我们的游戏对象。\n10. 运行游戏查看效果。\n\
  \n### 原理...\n\n我们可以从 `Mathf` 库中使用大量数学公式。使用其中一些公式可以为动画带来有趣的结果。在本示例中我们使用 `Mathf.Sin()`\
  \ 和 `Mathf.Cos()` 函数。它们是周期性的，这为我们提供了无限循环的运动。\n\n## 使用 Lerp() 函数为对象制作动画\n\n我们之前使用过\
  \ `Lerp()` 方法，但重要的是要知道我们可以用两种不同的方式使用它。本食谱涵盖这两种用法。\n\n### 准备工作\n\n我们将从头开始创建本食谱，并且不需要任何特殊资源。您可以下载示例项目并进入\
  \ `Chapter 10 Miscellaneous\\Recipe 02 Using the Lerp function to animate an object`\
  \ 目录。在那里打开 `Example.unity` 场景并运行游戏。您将看到两个对象：**RedDot** 和 **BlueDot**（两者都是 **Canvas**\
  \ 对象的子对象）。第一个使用标准的 `Lerp()` 方法并随时间将其位置从最小值插值到最大值。第二个以不同方式使用 `Lerp()` 方法并持续跟随鼠标指针。\n\
  \n![](img/616a75b593bef4212f618360fceea442_299_0.png)\n\nRedDot 在最小值和最大值之间插值其位置，而\
  \ BlueDot 跟随光标\n\n### 如何操作...\n\n要使用 Lerp() 函数为对象制作动画，请按照以下步骤操作：\n\n1. 首先我们需要创建一些对象来操作。创建一个新的\
  \ Image（前往 Game Object | UI | Image）。将其命名为 RedDot（您可以添加圆形精灵或保持原样）。将其颜色更改为红色。\n2.\
  \ 将 RedDot 位置设置为 (0,0,0)，并将其 Anchor Preset 设置为 middle center，如以下截图所示：\n\n![](img/616a75b593bef4212f618360fceea442_300_0.png)\n\
  \nRedDot 的 Anchor Preset\n\n3. 创建另一个 **Image** 并将其命名为 **BlueDot**。将其颜色更改为蓝色。\n4.\
  \ 将其 **Anchor Preset** 更改为 bottom left。\n5. 创建一个新的 C# 脚本并将其命名为 `LerpNormal.cs`。在此脚本的\
  \ `Update()` 函数中，我们将 `float posX` 变量的值从 `public float minPos` 插值到 `public float\
  \ maxPos` 值。我们使用一个 `float timer`，它随时间增加到 1 的值。如果其值达到 1，则开始减小到 0。如果达到 0，则再次开始增加。最后，我们使用插值后的\
  \ `posX` 值设置 **RedDot** `rectTransform` 的 `localPosition`。`posY` 和 `posZ` 值在 `Start()`\
  \ 函数中设置并且是恒定的：\n\n```csharp\nif (timer > 1f)\n{\n    lerpDir = -1f;\n}\nelse if\
  \ (timer < 0f)\n{\n    lerpDir = 1f;\n}\n\ntimer += lerpDir*Time.deltaTime * speed;\n\
  \nposX = Mathf.Lerp(minPos, maxPos, timer);\n\nrectTransform.localPosition = new\
  \ Vector3(posX, posY, posZ);\n```\n\n6. 将脚本分配给 **RedDot** 游戏对象。\n7. 创建另一个 C# 脚本并将其命名为\
  \ `LerpContinuous.cs`。在此脚本的 `Update()` 函数中，我们将 **BlueDot** 的位置与其自身和鼠标光标位置进行插值。我们每帧都执行此操作。在\
  \ `Lerp()` 函数中，我们使用乘以 `public float speed` 变量的 `Time.deltaTime` 值：\n\n```csharp\n\
  rectTransform.position =\n    Vector3.Lerp(rectTransform.position,\n    Input.mousePosition,\
  \ Time.deltaTime *\n    speed);\n```\n\n8. 将脚本分配给 **BlueDot** 游戏对象。\n9. 运行游戏查看效果。\n\
  \n### 原理...\n\n我们以两种方式使用 `Lerp()` 函数：\n\n- **标准方法：** `Lerp()` 函数的 `float t` 参数的值范围为\
  \ 0 到 1。我们使用计时器作为 t 参数。`timer` 首先增加到 1 的值。达到 1 后，它开始减小到 0。这种方法在两个值之间提供标准的线性插值。t\
  \ 参数是插值的百分比（对于 t = 0.5，插值值为两个输入值的平均值）。\n- **连续方法：** 第二种方法基于将输出值（在我们的例子中是位置）用作 `Lerp()`\
  \ 函数中的下限输入值。我们在 `Update()` 中调用 `Lerp()` 函数并使用 `Time.deltaTime` 作为 t 参数。`Time.deltaTime`\
  \ 是一个非常小的值，因此每次调用函数时，输出值都会以很小的一部分向结束值插值。在 `Update()` 中调用此方法会导致平滑移动。它不再是线性的。**BlueDot**\
  \ 在远离光标时移动更快，靠近时减速。\n\n![](img/616a75b593bef4212f618360fceea442_302_0.png)\n\n请记住，当您使用第二种方法时，插值的值永远不会真正达到结束位置或结束值。这就是为什么有时我们必须实现一个\
  \ `if` 语句并检查插值的值是否足够接近结束值。如果是，我们可以将其设置为完全相同。\n\n`Lerp()` 函数在各种类中实现。以下是最常用的示例：\n\n\
  - `Mathf.Lerp()`: 这在两个 float 值之间进行插值\n- `Vector3.Lerp()`: 这在两个向量之间进行插值（例如位置）\n-\
  \ `Quaternion.Lerp()`: 这在两个旋转之间进行插值\n- `Color.Lerp()`: 这在两种颜色之间进行插值\n\n\n\n\n##\
  \ 另请参阅\n\n另外两种方法也值得在 Unity 的 Scripting Reference 中查看：`Vector3.Slerp()` 和 `Vector3.SmoothDamp()`。第一种以球面方式插值一个向量（就像我们通过旋转它一样），第二种会减缓向量（例如位置）的变化。它可用于实现应平滑跟随另一个物体的物体。\n\
  \n## 使用 Rotate() 函数为物体制作动画\n\n在本教程中，我们将使用 `Transform.Rotate()` 函数为风车创建无限循环动画。也可以使用\
  \ **Animation** 视图实现相同效果，但有时编写一个简单脚本比创建关键帧动画要省力得多。\n\n### 准备工作\n\n本教程中我们需要一些可以旋转的模型。作为示例，我们将使用风车。它由三个游戏对象组成：**WindmillBase**，它是整个风车的根节点，**Windmill**，它是\
  \ **WindmillBase** 的子对象，以及 **WindmillWings**，它是 **Windmill** 的子对象。**Windmill** 游戏对象本身可以在\
  \ Y 轴上旋转。**WindmillWings** 游戏对象可以在其本地 Z 轴上旋转。\n\n![](img/616a75b593bef4212f618360fceea442_303_0.png)\n\
  \n风车层级结构\n\n你可以下载示例项目并进入 `Chapter 10 Miscellaneous\\Recipe 03 Using the Rotate function\
  \ to animate an object` 目录。在那里打开 `Example.unity` 场景并运行游戏。你会看到风车绕 *Y* 轴旋转，其叶片绕其本地\
  \ *Z* 轴旋转。\n\n### 操作方法...\n\n要使用 `Rotate()` 函数为物体制作动画，请按照以下步骤操作：\n\n- 1. 将我们的风车导入\
  \ Unity。模型应包含三个对象：**WindmillBase**、**Windmill**（是 **WindmillBase** 的子对象）以及 **WindmillWings**（是\
  \ **Windmill** 的子对象）。\n- 2. 将模型放置在场景中。\n- 3. 创建一个新的 C# 脚本并将其命名为 `ScriptRotation.cs`。在此脚本的\
  \ `Update()` 函数中，我们只使用一个方法：`transform.Rotate()`。我们有一系列 `public` 变量以便控制旋转速度和轴。`Rotate()`\
  \ 方法可以在 `World` 或 `Self`（本地）空间中旋转物体。我们有一个 `public Space rotationSpace` 变量，以便从 **Inspector**\
  \ 中控制它：\n- 4. 将脚本分配给 **Windmill** 游戏对象。\n- 5. 将 **Rotation Space** 设置为 **World**，并将\
  \ **Rotation Axis** 设置为 (0, 1, 0)。这意味着我们的物体将在全局 *Y* 轴（上向量）上旋转。将 **Rotation Speed**\
  \ 设置为你喜欢的值（单位为每秒度数；45-90 的值应该可以）。\n- 6. 将相同的脚本分配给 **WindmillWings** 游戏对象。\n- 7.\
  \ 将 **Rotation Space** 设置为 **Self** 并将 **Rotation Axis** 设置为 (0,0,1)。这意味着物体将绕其本地\
  \ *Z* 轴（物体的前向量）旋转。同样，将 **Rotation Speed** 设置为你喜欢的值。\n- 8. 运行游戏并观察效果。**Windmill**\
  \ 游戏对象在全局 *Y* 轴上旋转，而 **WindmillWings** 游戏对象绕其本地 *Z* 轴旋转并跟随 **Windmill** 的 *Y* 轴旋转（由于层级设置）。\n\
  \n```\ntransform.Rotate(rotateAxis * rotationSpeed *\n    Time.deltaTime, rotationSpace);\n\
  ```\n\n### 原理...\n\n在本教程中我们使用 Unity 的 `Transform.Rotate()` 函数。它允许围绕任意给定轴旋转 transform。它将物体旋转我们作为函数参数设定的度数。我们使用\
  \ `Time.deltaTime` 使物体每秒旋转 X 度。该函数还具有 `space` 参数，可让我们在世界空间或本地空间中进行旋转。其余部分由层级设置处理（**WindmillWings**\
  \ 是 **Windmill** 游戏对象的子对象）。\n\n使用此方法可以为简单的旋转物体节省大量调整动画的时间。更重要的是，我们仍然可以使用 **Animation**\
  \ 视图为脚本的 `public float rotationSpeed` 参数创建动画。这样我们就可以用一个非常简单的动画片段来控制旋转速度的变化，而不必对整个\
  \ transform 进行动画制作。\n\n### 还有更多...\n\nUnity 还有一个 `Transform.Translate()` 函数，它的参数与\
  \ `Transform.Rotate()` 方法相同，但会移动我们的游戏对象而不是旋转它。我们可以用它创建类似的脚本并在场景中移动物体。\n\n## 为人形角色准备动作捕捉文件\n\
  \n使用动作捕捉文件并不总是容易。在大多数情况下，我们可以直接使用它们（导出为 **FBX** 文件后）用于使用 **Generic** 骨架类型的角色。但我们几乎总是希望将动作捕捉文件用于人形角色。问题出现在我们的动作捕捉骨架不是标准的\
  \ Unity **Humanoid** 骨架时（而且这种情况几乎总是如此）。我们可以预期各种各样的错误——骨骼带偏移旋转、网格变形等等。\n\n本教程展示了如何将动作捕捉文件重新映射到适合\
  \ Unity 人形动画的骨架上。我们将使用 Blender 3D。\n\n### 准备工作\n\n要按照本教程操作，你需要一个准备好绑定到合适的 Unity\
  \ **Humanoid** 骨架的人形角色。我们还需要一个动作捕捉动画。你可以在卡内基梅隆大学的网站 `http://mocap.cs.cmu.edu/` 上找到一个庞大的可免费使用的动作捕捉数据库。在本示例中我们将使用\
  \ `01_01.bvh` 文件。\n\n你也可以下载提供的示例 Unity 项目并进入 `Chapter 10 Miscellaneous\\Recipe 04\
  \ Preparing motion capture files for humanoid characters` 目录。你可以在那里找到 `Example.unity`\
  \ 场景。如果运行游戏，你会看到一个角色正在播放重新映射的动作捕捉动画。你可以在 `Raw data` 目录中找到 BVH 文件。最终的 FBX 文件位于 `Final\
  \ FBX` 目录中，所有 `blend` 文件位于 `Blend Files` 目录中。\n\n### 操作方法...\n\n要为人形角色使用动作捕捉数据，请按照以下步骤操作：\n\
  \n- 1. 首先我们需要创建一个适合 Unity 人形角色的骨架。在 Blender 中创建这样的骨架相当容易。首先启用 **Rigify** 插件并从 **Armature**\
  \ 部分创建一个新的 **Human (metarig)** 对象。\n- 2. 该骨架的结构几乎与 Unity 的 Humanoid 骨架相同，但我们需要调整一些地方。首先编辑骨架并从脚部删除\
  \ **heel.L**、**heel.R**、**heel.02.L** 和 **heel.02.R** 骨骼。\n- 3. 然后从手部删除 **palm.01.L**、**palm.02.L**、**palm.03.L**、**palm.04.L**、**palm.01.R**、**palm.02.R**、**palm.03.R**\
  \ 和 **palm.04.R** 骨骼。\n- 4. 这样我们就得到了一个合适的 Unity Humanoid 骨架。我们还可以调整 T 姿势（**Rigify**\
  \ 骨架是在更放松的 T 姿势下创建的）。这一步不是必需的。将该骨架命名为 `FinalRig`。\n- 5. 现在根据你的角色调整骨骼大小并将角色绑定到骨架上。\n\
  - 6. 进入 **Pose Mode** 并点击两个肩膀。启用它们的 *Y* 轴旋转（默认情况下是锁定的）。这一步对于制作最终动画很重要。\n- 7. 导入你的\
  \ BVH 文件（**File | Import | BVH**）。你可能需要在导入设置中调整骨架的大小。\n- 8. 将导入的 BVH 骨架缩放以大致匹配你的角色大小。为便于区分，将\
  \ BVH 骨架命名为 **ImportedRig**。\n- 9. 现在我们将创建一个控制骨架用于纠正任何错误。为此，在 Blender 中创建一个空对象并将其命名为\
  \ `Hips`。再创建一个空对象并命名为 `HipsTarget`。确保两个对象的位置和旋转完全相同。\n- 10. 将 **HipsTarget** 设为\
  \ **Hips** 的子对象。\n- 11. 为了使对象更易见，将 **Hips** 的 **Display** 设置为 **Cube**，将 **HipsTarget**\
  \ 的 **Display** 设置为 **Sphere**。\n- 12. 这两个空对象的组合就是我们的骨节点——我们将为角色的每个骨骼创建一个：\n\n![](img/616a75b593bef4212f618360fceea442_307_0.png)\n\
  \n骨节点——一对空对象\n\n- 13. 选择 **Hips** 对象并为其添加 **Copy Transforms** 约束。\n- 14. 选择 **ImportedRig**\
  \ 作为 **Target**，并选择其 `Hips` 骨骼作为 **Bone**。\n- 15. 对 **FinalRig** 的每个骨骼重复步骤 9-14（你可以省略手指，因为大多数动作捕捉文件并没有手指数据）。完成此过程后，你应该有一组空对象反映\
  \ **FinalRig** 的结构。它应类似于以下内容：\n- **Hips**（以及设为其子对象的 **HipsTarget**）\n- **Spine**（以及设为其子对象的\
  \ **SpineTarget**）\n- **Chest**（以及设为其子对象的 **ChestTarget**）\n- **Neck**（以及设为其子对象的\
  \ **NeckTarget**）\n- **Head**（以及设为其子对象的 **HeadTarget**）\n- **Shoulder.L**（以及设为其子对象的\
  \ **ShoulderTarget.L**）\n- **Shoulder.R**（以及设为其子对象的 **ShoulderTarget.R**）\n- **LegUp.L**（以及设为其子对象的\
  \ **LegUpTarget.L**）\n\n\n\n- LegUp.R（并且 **LegUpTarget.R** 以它为父级）\n- Leg.L（并且 **LegTarget.L**\
  \ 以它为父级）\n- Leg.R（并且 **LegTarget.R** 以它为父级）\n- Foot.L（并且 **FootTarget.L** 以它为父级）\n\
  - Foot.R（并且 **FootTarget.R** 以它为父级）\n- ArmUp.L（并且 **ArmUpTarget.L** 以它为父级）\n- ArmUp.R（并且\
  \ **ArmUpTarget.R** 以它为父级）\n- Arm.L（并且 **ArmTarget.L** 以它为父级）\n- Arm.R（并且 **ArmTarget.R**\
  \ 以它为父级）\n- Hand.L（并且 **HandTarget.L** 以它为父级）\n- Hand.R（并且 **HandTarget.R** 以它为父级）\n\
  \n16. 有时我们的 **ImportedRig** 结构不同，例如它可能有更多的脊柱骨骼（三根或更多）。在这种情况下，我们应该在 **Copy Transform**\
  \ 约束中选择最合适的骨骼，或添加两个 **Copy Rotation** 约束并通过设置 **Influence** 滑块来插值两个相邻骨骼的最终旋转：\n\n\
  ![](img/616a75b593bef4212f618360fceea442_308_0.png)\n\nControl rig with Copy Transform\
  \ constraints\n\n17. 现在我们需要为脚设置 IK。选择 **FinalRig** 并进入 **Edit Mode**。\n\n18. 复制两个脚骨骼并将其名称更改为\
