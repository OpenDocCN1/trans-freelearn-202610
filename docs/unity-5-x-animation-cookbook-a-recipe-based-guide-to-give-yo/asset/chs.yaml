  \n## How it works...\n\nProblems with importing motion capture data can be very\
  \ frustrating. The most common errors are connected with an inappropriate **T-POSE**\
  \ of the **BVH** rig. This T-Pose depends on the software the animation was recorded\
  \ in and exported from. Additionally, BVH rigs can have arbitrary bone hierarchies,\
  \ with more than two spine bones for instance. A proper Unity Humanoid rig hierarchy\
  \ was covered in the *Configuring Generic and Humanoid rigs* recipe in *Chapter\
  \ 1, Working with animations.*\n\nIn Blender, the Rigify rig has a proper T-Pose.\
  \ Thus, the best solution is to retarget the animation from the **ImportRig** to\
  \ the **FinalRig** (the **Rigify** one). In theory, we could omit creating the control\
  \ rig (the empties) but those give us more control. The (...)**Target** empties\
  \ are not constrained to the **ImportRig** bones—they are only parented to the empties\
  \ that are constrained. This way we can rotate or move the (...)**Target** empties\
  \ to correct any rotation errors or adjust a pose.\n\nWe also use **Inverse Kinematics**\
  \ for the feet in this setup. This, combined with the **Offset** option in the **Copy\
  \ Location** constraints (set for the **footTarget.L**, **footTarget.R**, and **hips**\
  \ bones), allows us to adjust the feet and hips positions. This way we can move\
  \ the character to the center of the scene quite easily. We can even make it crouch\
  \ while moving,\n\n## See also\n\nIf you are on a budget and want to use motion\
  \ capture data, you can find a lot of free motions on the Carnegie Mellon University's\
  \ website at http://mocap.cs.cmu.edu/. Another good option is to invest in the Perception\
  \ Neuron solution (https://neuronmocap.com/)—it is a project successfully founded\
  \ on Kickstarter. Perception Neuron seems affordable for most indie studios or even\
  \ individuals. It is a suit with a set of sensors (gyroscopes, magnetometers, and\
  \ accelerometers) that the actor puts on. It works similar to standard motion capture\
  \ solutions based on markers. I must say the quality of the recorded motions is\
  \ mostly very good (it has some problems with rapid motions though). You also have\
  \ to watch out for large metal objects, speakers, and other sources of magnetic\
  \ fields in the room. But if you can't afford a motion capture studio session and\
  \ want to use mocap for your project, it can be a good bet.\n\n## Adding behaviors\
  \ to Mecanim states\n\nIn this last recipe, we will cover behaviors. These are scripts\
  \ that can be attached to Mecanim states. You can use them to turn standard Animator\
  \ Controllers into logic graphs such as AI trees, quests, and so on.\n\n## Getting\
  \ ready\n\nWe are going to create this recipe from scratch and we don't need any\
  \ special assets. You can download the example project and go to the Chapter 10\
  \ Miscellaneous\\Recipe 05 Adding behaviors to Mecanim states directory. Open the\
  \ Example.unity scene there and play the game. If you play the game, you can press\
  \ the space bar to change the states in the Animator Controller attached to the\
  \ Controller game object. The cycle starts in the NoBehaviors state—this is simply\
  \ an empty state with no additional behavior. If we press the space bar, we transition\
  \ to Light1Random. This state changes the color of the Light1 light in the scene.\
  \ If we press the space bar again, the state will change to WaitAndSwitch. This\
  \ state waits for a given time and switches to the next state: Light2Random. This\
  \ one changes the color of the Light2 light. If we press the space bar again, we\
  \ will transition to the RotateObject state, which rotates an object visible in\
  \ the scene. Pressing the space bar yet again transitions the controller to the\
  \ Light1Random state again. See the following screenshot for reference:\n\n![](img/616a75b593bef4212f618360fceea442_312_0.png)\n\
  \n完成控制器\n\n## 如何操作...\n\n要在 Mecanim 状态中使用行为，请按照以下步骤操作：\n\n1. 首先我们需要准备示例场景。在场景中创建一个\
  \ **立方体**。\n2. 创建两个灯光并将它们命名为 **Light1** 和 **Light2**。将它们放置在立方体附近，以便可以看到它们的效果。\n\
  3. 创建一个空的游戏对象并将其命名为 `Controller`。\n4. 创建一个新的 Animator Controller 并将其命名为 `LogicController`。\n\
  5. 向 **控制器** 游戏对象添加一个 Animator 组件并将 **逻辑控制器** 分配给它。\n6. 打开 **逻辑控制器**。\n7. 创建一个空状态并将其命名为\
  \ **无行为**。使其成为默认状态。\n8. 创建一个 `Trigger` 参数并将其命名为 **切换**。\n9. 创建四个空状态并将它们命名为 **灯光1随机**、**等待并切换**、**灯光2随机**\
  \ 和 **旋转对象**。\n\n10. 创建以下列出的过渡。它们都具有相同的条件：`Trigger` **切换** 参数且 **退出时间** 设置为 false。\n\
  \n- **无行为** | **灯光1随机**\n- **灯光1随机** | **等待并切换**\n- **等待并切换** | **灯光2随机**\n- **灯光2随机**\
  \ | **旋转对象**\n- **旋转对象** | **灯光1随机**\n\n11. 选择 **灯光1随机** 状态并在 **检查器** 中点击 **添加行为**\
  \ 按钮，如以下屏幕截图所示：\n\n![](img/616a75b593bef4212f618360fceea442_313_0.png)\n\n向 Mecanim\
  \ 状态添加行为\n\n12. 包含所有可用行为的列表将会出现。在搜索字段中输入 **LightColorChange** 并按下 *回车*。将会出现一个 **创建并添加**\
  \ 按钮。如果点击它，`LightColorChange.cs` 脚本将在 `Assets` 文件夹中创建。\n\n13. 将脚本移动到你的脚本目标文件夹。\n\
  \n14. 打开脚本。向脚本添加三个全局变量：`public string lightGameObjectName`、`public Color color`\
  \ 和 `public bool randomColor`。\n\n15. 脚本包含多个注释掉的函数。取消注释 override public void OnStateEnter()\
  \ 函数。在其中我们首先尝试查找名称存储在 lightGameObjectName 变量中的游戏对象。如果找到它，我们尝试获取其 Light 组件并根据 randomColor\
  \ 标志将灯光颜色设置为随机值或指定值：\n\n```\nGameObject go = GameObject.Find(lightGameObjectName);\n\
  if (go != null)\n{\n    Light light = go.GetComponent<Light>();\n    if (light !=\
  \ null)\n    {\n        if (randomColor)\n        {\n            light.color = Random.ColorHSV();\n\
  \        }\n        else\n        {\n            light.color = color;\n        }\n\
  \    }\n}\n```\n\n16. 在 Animator Controller 中，选择 Light1Random 状态。在其检查器中，将灯光游戏对象名称设置为\
  \ Light1 并勾选随机颜色复选框。\n\n17. 选择 WaitAndSwitch 状态并添加一个 WaitAndSwitch 行为。WaitAndSwitch.cs\
  \ 脚本将被创建。这次添加四个全局变量（带默认值）：public string triggerName = \"Switch\", public float waitTime\
  \ = 5f, bool switched = false, 和 float startTime。取消注释 override public void OnStateEnter()\
  \ 函数，检查我们进入状态的时间并将其存储在 startTime 变量中。我们还将 switched 标志设置为 false：\n\n```\nstartTime\
  \ = Time.time;\nswitched = false;\n```\n\n18. 取消注释 override public void OnStateUpdate()\
  \ 函数并检查当前时间是否大于我们的 startTime 加上 waitTime。如果是，我们设置 Trigger 以在状态之间转换。我们还将 switched\
  \ 标志设置为 true 以防止发送多个 Trigger：\n\n```\nif (Time.time >= startTime + waitTime && !switched)\n\
  {\n    switched = true;\n    animator.SetTrigger(triggerName);\n}\n```\n\n19. 在控制器中选择\
  \ Light2Random 状态并向其添加 LightColorChange.cs 行为。将随机颜色复选框设置为 true 并将灯光游戏对象名称设置为 Light2。\n\
  \n20. 创建一个新的 C# 脚本并将其命名为 LogicController.cs。此脚本有三个全局变量：public string switchTriggerName\
  \ = \"Switch\", public Transform activeObject, 和 Animator anim。anim 变量在 Start()\
  \ 函数中设置。在此脚本的 Update() 函数中，当玩家按下空格键时，我们在 Animator Controller 中设置 Trigger。Trigger\
  \ 名称存储在 switchTriggerName 变量中。\n\n21. 将脚本分配给 Controller 游戏对象。然后将 Cube 游戏对象拖放到脚本的活动对象字段中。\n\
  \n22. 选择 RotateObject 状态并向其添加一个 RotateObject.cs 行为（你需要创建一个新的）。将创建的脚本移动到你的目标文件夹。\n\
  \n23. 打开 RotateObject.cs 脚本。添加四个全局变量：public float rotationSpeed = 45f, public Vector3\
  \ rotationAxis = Vector3.up, public Space rotationSpace = Space.World, 和 LogicController\
  \ controller。前三个用于旋转对象，最后一个是对 LogicController 脚本的引用。取消注释 override public void OnStateEnter()\
  \ 函数并在其中设置对 LogicController 的引用：\n\n```\ncontroller =\nanimator.gameObject.GetComponent<LogicController>();\n\
  ```\n\n24. 取消注释 override public void OnStateUpdate() 函数并旋转存储在 LogicController.activeObject\
  \ 变量中的对象：\n\n```\nif (controller == null)\n{\n    return;\n}\nif (controller.activeObject\
  \ == null)\n{\n    return;\n}\ncontroller.activeObject.Rotate(rotationAxis * rotationSpeed\
  \ * Time.deltaTime, rotationSpace);\n```\n\n25. 确保 Controller 游戏对象的 Animator 组件设置为始终动画。\n\
  26. 播放游戏并按下空格键以查看效果。你需要多次按下空格键才能完成整个循环。\n\n## 如何工作...\n\n状态行为可用于创建逻辑图——这些图使用 Animator\
  \ Controller 作为状态机。Animator Controller 可以在没有任何 Animation Clips 的情况下工作——空状态也可以具有行为。\n\
  \nMecanim 状态行为是派生自 `StateMachineBehaviour` 类而不是 `MonoBehaviour` 类的脚本。它们有许多我们可以重写的功能。最有用的如下：\n\
  \n- `OnStateEnter()`：当 Animator Controller 进入此状态时调用此函数。\n- `OnStateUpdate()`：当此状态处于活动状态（正在播放）时，每帧调用此函数。它将在\
  \ `OnStateEnter()` 之后和 `OnStateExit()` 之前被调用。\n- `OnStateExit()`：当 Animator Controller\
  \ 退出此状态时调用此函数。\n\n我们仍然可以从普通的 `MonoBehaviour` 脚本管理状态转换（在我们的示例中，它是 `LogicController.cs`\
  \ 脚本）。\n\nAnimator Controllers 是资源，因此它们无法引用场景中的对象。我们可以通过按名称（或标签）查找游戏对象或通过创建另一个可以引用场景中对象的\
  \ `MonoBehaviour` 脚本来解决这个问题。我们的 `LogicController.cs` 脚本就是一个例子：`public Transform\
  \ activeObject` 变量。我们可以在行为中获取 `LogicController.cs` 脚本组件（只要 Animator 组件在同一个游戏对象上）。这样我们就可以访问其\
  \ `activeObject` 变量并在此变换上执行操作。\n"
