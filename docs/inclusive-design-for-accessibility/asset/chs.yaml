  \n但真正让这款控制器与众不同的不只是其酷炫功能——而是其诞生的旅程：\n\n1. 微软深入残障游戏玩家世界，通过深入研究发掘需求和挑战。\n2. 职业治疗师和无障碍专家成为他们的副驾驶，在整个设计过程中每一步都提供指导。\n\
  3. 他们制作了一个又一个原型，让目标受众试驾每个版本。\n4. 反馈成为他们的北极星，促使进行重大的设计转向以提升可用性和无障碍性。\n5. 他们退一步看大局，使从包装到设置的一切都与控制器本身一样无障碍。\n\
  \n结果？一款改变游戏规则的产品，它不仅仅服务于目标受众——它实现了公平竞争，证明了通过适当的设 计和倡导者的见解，任何人都可以玩游戏。\n\n虽然包容性设计的伦理论据令人信服，但许多组织也需要了解其业务影响才能完全致力于实施。让我们探讨包容性设计如何通过扩大市场、增加创新、提升品牌声誉和降低法律风险来推动业务成功。\n\
  \n##### 认识包容性的商业价值\n\n包容性设计是正确的做法——但你知道它也是明智的商业举措吗？它直接改善业务绩效，创造适用于每个人的数字产品。根据 Forrester\
  \ 和 Microsoft 2016 年的一份报告，无障碍设计可以改善客户满意度、提升品牌认知度并增加市场覆盖范围。此外，投资无障碍的公司更有可能促进创新和员工生产力。\n\
  \n当我们以多元用户为出发点设计时，我们扩大了市场覆盖范围、提升了用户满意度并构建了更具创新性的解决方案：\n\n- **更大的受众，更大的利润：** 当你为所有人设计时，你就为更多客户铺设了红地毯。通过满足服务不足社区的需求，你可以进入新市场并释放巨大的收入潜力。\n\
  - **创新点火：** 包容性设计挑战你的团队跳出思维定式，往往带来新鲜的解决方案。这种创造性解决问题可以激发突破，提升整个产品线并让你与竞争对手脱颖而出。\n\
  - **品牌提升：** 向世界展示你关心并看着你的声誉飙升。这就像一个真正有意义的公关活动。消费者越来越倾向于选择与自身价值观一致的品牌，而包容性可以成为强大的差异化因素。\n\
  - **法律安全网：** 领先于无障碍法规，保持律师远离。积极拥抱无障碍不仅能最大限度地降低法律风险，还能将你的公司定位为负责任的行业领导者。\n- **通用吸引力：**\
  \ 关键是：为无障碍设计的功能往往会让所有用户感到愉悦。从字幕到语音命令，这些创新提升了每个人的可用性，创造了更直观、更愉快的体验。\n\n\n\n\n\n#####\
  \ 法律合规与风险缓解\n\n数字无障碍不仅仅是一种最佳实践——在许多地区，它还是一项法律要求。美国的《美国残疾人法案》和欧洲的《欧洲无障碍法案》等法律都要求企业确保其数字产品对所有用户都可访问。从一开始就融入包容性设计，可以让企业避免昂贵的诉讼和后期改造的麻烦。这种主动的方法还能让他们轻松适应未来的无障碍法规。拥抱包容性不仅仅是明智之举；它还是合规和风险管理的积极策略。\n\
  \n![](img/3bdc9e2d41de898f8a3bcc9634b0000e_50_0.png)\n\n图 1.4. 纪念《美国残疾人法案》的旧金山街头艺术。丹·丰特斯创作的壁画。戴尔·克鲁斯拍摄。\n\
  \n#### 总结\n\n本章探讨了包容性设计的基本原则，追溯了其从基本无障碍功能到惠及所有用户的全面方法的演变。你已了解通用设计七项原则及其在数字产品中的应用，发现了实施以用户为中心的设计方法的技术，并了解了如何为包容性构建令人信服的商业案例。正如本章所揭示的，*包容性设计不仅仅是让技术可访问——它是让技术对每个人都更好。*\n\
  \n在数字无障碍日益决定社会参与的当今数字环境中，这些知识至关重要。理解包容性设计原则有助于为所有人创造更好的产品，同时扩大市场覆盖面并降低法律风险。此外，随着组织认识到包容性设计推动创新并提升所有人的用户体验，这些技能正变得对设计师、开发者和产品经理必不可少。\n\
  \n本章为更深入的探索奠定了基础。随着我们继续前进，我们将深入研究不同用户群体的独特需求，包括对特定残疾、心理健康考虑以及支持包容性访问的辅助技术的更深入了解。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- 理解残疾：一种体验光谱\n- 在数字环境中对残疾类型进行分类\n- 审视辅助技术的作用\n- 将用户需求映射到设计解决方案\n\
  - 以 lived experience 为中心：与用户一起设计，而非为用户设计\n\n##### 理解残疾：一种体验光谱\n\n就像人类体验中的许多其他身份一样，残疾也存在于一个光谱中：\n\
  \n- 情境性残疾与情境相关，例如在刺眼阳光下尝试阅读手机，或抱着婴儿时用一只手操作平板电脑\n- 暂时性残疾源于短期状况，例如受伤或手术后的恢复期\n- 慢性病，如关节炎或偏头痛，会波动，造成好日子和坏日子\n\
  - 永久性残疾，如失明或瘫痪，是持续性的，但在塑造人们的互动方式上同样多种多样\n\n除了定义之外，重要的是要认识到这些体验是多么流动且常常不可见。一个人在一生中……甚至在一天之内……都可能在不同类别之间转换！疼痛发作、疲劳、行动能力变化或感官超负荷都可能在从一个时刻到另一个时刻改变一个人驾驭数字世界的方式。\n\
  \n例如，一名因慢性病导致视力波动的学生在糟糕的日子里可能需要高对比度设置和放大文字来完成作业，但在好日子里却毫无问题。如果这些选项不可用，他们将如何保持对学习的投入？\n\
  \n或者，考虑一名新父母，因睡眠不足和环境噪音而暂时听力清晰度下降。在那一刻，视频通话中的实时字幕可能是一项必不可少的功能。这些小小的便利会向外扩散，惠及更广泛的受众。\n\
  \n当我们理解到每个人在生命中的某个时刻都会面临障碍时，无障碍就变得普遍——轮椅坡道帮助送货员和推婴儿车的父母，而闭路字幕则支持从嘈杂环境到语言学习者的多样化需求。\n\
  \n这是包容性设计背后的基础理念：无障碍不是例外，而是期望。通过将灵活性和选择嵌入我们的数字环境中，我们赋予所有用户权力——不仅是医学定义上的残疾人。\n\n\
  重要的是，残疾不仅仅是医学问题；它也是社会性的。它源于某人的身体或心智与他们所 navigating 的环境或系统之间的不匹配。一个人的残疾可能并非源于其自身状况，而是源于一个不支持键盘导航的网站，或一个仅依赖声音而没有替代文字的应用。这种视角转移了责任：不再要求个人适应无障碍系统，而是要求系统满足真实人群的需求。\n\
  \n随着我们继续前进，将残疾归为更广泛的类别以了解它们如何影响数字互动会很有帮助。毕竟，与其将其框定为满足少数人的需求，不如在为所有人设计时打开数字机会。下一节将探讨这些类别——视觉、听觉、运动和认知——并介绍支持每一种的设计策略。\n\
  \n##### 在数字环境中对残疾类型进行分类\n\n在设计数字产品时，了解人们与之互动的多样化方式至关重要。残疾不是孤立的状况——它们是人类体验的一部分，并影响个人感知、处理和参与技术的方式。因此，重要的是要指出，“残疾”是一个身份群体，可以与其他任何身份交叉。你可以是穆斯林且残疾、同性恋且残疾、Z\
  \ 世代且残疾，等等。列表可以一直列下去。\n\n在残疾的范畴下，四种主要的残疾类别——视觉、听觉、运动和认知——涵盖了广泛的状况并带来独特的挑战。解决这些挑战需要深思熟虑的设计，考虑人类能力的全光谱。\n\
  \n###### 视觉残疾：无视力导航\n\n对于盲人或视力低下用户来说，导航数字界面涉及将视觉信息转化为其他形式，例如音频或触觉反馈。但可能会出现问题。例如，屏幕阅读器用户依赖结构良好的代码来导航网页。如果网站缺乏语义化标题或图像的描述性替代文本，就感觉像在嘉年华里穿过镜子迷宫。\n\
  \n###### 运动残疾：重新思考互动\n\n运动残疾涵盖了广泛的状况，从震颤和关节炎到瘫痪和截肢。这些状况影响用户通过鼠标、键盘或触摸屏等物理方式与设备互动的方式。\n\
  \n考虑一名使用头部指针或开关控制进行导航且灵活性有限的用户。每次点击或移动都需要付出努力，因此过于复杂的流程或小而难以点击的按钮会造成不必要的障碍。以简洁和高效为目标进行设计（例如提供大触控目标并最大限度地减少完成任务所需的交互次数）可使技术更易访问。\n\
  \n语音控制是运动残疾用户的另一项变革性工具。然而，语音启用界面必须考虑语音模式的差异。例如，口吃者或甚至非母语口音者可能难以被某些系统理解。提供多种输入选项可确保没有人被排除在外。\n\
  \n###### 认知残疾：简化复杂性\n\n认知残疾——如 ADHD、阅读障碍和智力残疾——影响用户感知、处理和对信息采取行动的方式。一个杂乱的网页和不一致的导航很容易让\
  \ ADHD 用户感到不知所措，而冗长的密集文本块可能会让阅读障碍用户完全不愿参与。\n\n简化复杂性会产生差异。将内容分解为更小、更易消化的块，使用一致的设计模式，并融入视觉辅助，可以帮助用户保持专注并更有效地处理信息。例如，一个使用通俗语言和直观图标来解释保险覆盖选项的健康保险网站，比一个埋在行业术语中的网站更易访问。\n\
  \n交互式内容也可以支持认知无障碍。预算应用使用彩色图表来显示支出习惯，为可能难以仅凭数字数据理解的用户提供视觉清晰度。\n\n同样重要的是要考虑精神和心理健康残疾，这些残疾经常被错误地归为认知障碍，但在影响数字互动的方式上有所不同。焦虑、创伤后应激障碍、抑郁症等状况会使某些设计选择——如定时表单、弹出窗口或意外运动——变得极度痛苦或完全无法使用。例如，如果表单包含倒计时计时器，即使他们知道任务很简单，具有焦虑症的用户也可能会完全放弃该表单。\n\
  \n\n\n\n##### 视觉障碍辅助技术\n\n对于视觉障碍人士，访问数字内容需要以其他方式来感知和交互信息。此类辅助技术将文本、图像和界面转换为无障碍格式，以支持独立导航和参与。\n\
  \n###### 屏幕阅读器：让数字内容可听见\n\n**屏幕阅读器**是一种辅助技术，将屏幕上的文本转换为语音，使盲人或低视力用户能够浏览网站、应用程序和数字文档。JAWS、NVDA\
  \ 和 VoiceOver 等工具会解析网页结构，并以语音方式向用户传达。\n\n有些用户——尤其是聋盲人士——会将屏幕阅读器与**可刷新的盲文显示器（RBD）**配合使用，后者将屏幕阅读器的输出转换为触觉盲文。屏幕阅读器负责处理内容，而盲文显示器则提供另一种输出格式，使用户能够通过触觉访问数字环境。\n\
  \n为了有效运行，屏幕阅读器在很大程度上受益于语义化 HTML 和良好实现的 ARIA。清晰的标题、地标、标签和角色有助于这些工具向用户传达有意义的结构和上下文。缺乏这种结构，用户体验可能会变得混乱或不完整。\n\
  \n例如，当标题、链接和表单字段被正确编码时，屏幕阅读器可以识别它们。然而，当按钮完全没有无障碍名称时，屏幕阅读器可能会完全跳过它，或者笼统地播报——“按钮”，没有任何上下文——让用户猜测它的功能。\n\
  \n即使按钮有标签，标签本身仍然很重要。一个标记为“Button123”的按钮可能在技术上满足名称要求，但它无法告诉用户任何信息。想象一下，在线购物时听到的是“Button123”而不是“添加到购物车”。你会点击它吗？既不知道它是否会将商品添加到购物车，也不知道它是否会从你的信用卡扣款？\n\
  \n无障碍设计不仅仅是让内容可导航，更是让它清晰明了。一个结构良好的页面配合有意义、描述性的标签，能将令人困惑的体验转变为直观的体验。\n\n###### 屏幕放大镜和高对比度工具\n\
  \n对于低视力用户，**屏幕放大镜**可以放大屏幕上的内容，而高对比度工具则通过增加文本与背景颜色之间的对比度来增强可见性。这些功能对于确保可读性和可用性至关重要。\n\
  \n我们很多人都知道，在眼科检查时瞳孔被散大后，阅读屏幕有多么困难。想象一下，当你费力阅读无法正常缩放的微小文本时，还要尝试完成紧急的银行交易。财务仪表板必须在浏览器放大到\
  \ 200% 时保持可用。如果按钮重叠或文本在高倍率下变得不可读，用户实际上就被排除在外了。响应式设计实践确保内容无论设置如何都能优雅地适应。\n\n######\
  \ 盲文显示器：触觉访问数字内容\n\nRBD 将数字文本转换为盲文字符，使盲人用户能够通过触觉阅读内容。这些设备对于聋盲人士或更喜欢触觉阅读而非屏幕阅读器音频输出的用户尤为重要。盲文显示器与屏幕阅读器协同工作，将内容转换为触觉格式，提供精确、无声的数字信息访问。\n\
  \n为了确保兼容性，网站和应用程序必须使用简洁、语义化的 HTML 和正确实现的 ARIA，以便屏幕阅读器将有意义的信息传递给盲文设备。没有这种结构，内容可能会被跳过、错误表示或无法阅读。\n\
  \n###### 为低视力用户提供的音频描述\n\n对于多媒体内容，音频描述具有类似的作用。**音频描述**会叙述标准对话中未包含的关键视觉元素，例如场景变化、肢体语言或屏幕上的文本。这为盲人用户提供了关键语境，尤其是在教育或叙事环境中。\n\
  \n触觉访问和音频描述共同扩大了盲人用户在广泛数字体验中的访问范围——不仅是阅读，还包括观看、导航和交互。\n\n##### 听觉障碍辅助技术\n\n听觉障碍人士依赖视觉和基于文本的替代方案来访问语音内容、警报和通信工具。此类辅助技术确保通常通过声音传达的信息能以其他格式访问，从而弥补这一差距。\n\
  \n###### 字幕和转录文本：确保音频无障碍\n\n对于聋人或听力障碍用户，字幕和转录文本为访问多媒体内容提供了基本途径。**字幕**在视频上显示语音和相关声音提示，而**转录文本**则提供基于音频的内容（如播客和录制会议）的完整文本版本。\n\
  \n然而，并非所有字幕都是平等的。自动生成的字幕经常包含错误，无障碍倡导者 Meryl Evans 因此将其称为“craptions（糟糕字幕）”。提供准确、经过人工审核的字幕可确保聋人和听力障碍用户能够充分参与内容。\n\
  \n###### 视觉警报：替代基于声音的通知\n\n**视觉警报**——例如闪光或屏幕文本通知——可以提供替代方式，让用户接收重要信息，而不是仅仅依赖听觉线索。例如，通常依赖声音通知的系统警报也应显示可见消息以确保无障碍。\n\
  \n###### 助听器和人工耳蜗的兼容性\n\n许多数字平台与辅助听力设备（如支持蓝牙的助听器和人工耳蜗）集成。兼容性不仅仅关乎设备本身，还关乎音频内容的传递方式。\n\
  \n对于依赖助听器或人工耳蜗的用户，高质量的音频文件、尽量少的背景噪音以及清晰、节奏平稳的语音至关重要。使用标准、未压缩或轻压缩格式（如 MP3、AAC 或 WAV）有助于确保辅助设备能够清晰处理和传输声音。过度压缩或失真的音频可能无法与助听器处理器良好配合，因为助听器处理器通常针对语音频率进行了优化。\n\
  \n在支持**感应线圈（T-coil）系统**的环境中——例如剧院、教室或自助服务终端——确保硬件通过感应回路系统输出声音，或与辅助听力发射器兼容，可能会产生天壤之别。虽然\
  \ T-coil 支持主要基于硬件，但与硬件接口的数字系统（如公共广播系统或自助服务终端）必须通过受支持的通道输出干净的音频信号。\n\n简而言之，无障碍音频应当清晰、格式正确，并以能顺畅集成辅助技术的方式传递——无论是通过蓝牙、感应回路系统还是直接音频输入。\n\
  \n##### 键盘导航和替代键盘\n\n许多运动障碍用户依赖**键盘导航**而非鼠标。设计允许用户仅使用键盘即可完整导航的界面，例如确保合理的 Tab 顺序和可见的焦点指示器，可确保无障碍。有些人还可能使用替代键盘，例如单手键盘或屏幕键盘，来与数字内容交互。\n\
  \n##### 认知障碍辅助技术\n\n认知障碍影响个体处理、理解和交互数字内容的方式。此类辅助技术专注于增强理解、减少认知负荷，并为各类用户提高可用性。\n\n\
  ###### 文本转语音工具：支持理解\n\n**文本转语音（TTS）**工具将书面文本转换为语音，使认知障碍、学习障碍（如阅读障碍）或读写能力较低的用户受益。这些工具帮助用户更有效地处理和记住信息。\n\
  \n例如，有阅读障碍的学生可能难以理解密集的学术文本，但使用朗读内容的 TTS 工具时可以更轻松地跟上。然而，如果网站包含结构不佳的内容或格式不一致，TTS 工具可能难以清晰地传达信息。\n\
  \n###### 语音转文本工具：减少认知负荷\n\n**语音转文本（STT）**工具将口语转录为文本，为可能在书面语言或打字方面有困难的用户提供替代沟通方式。这些工具对于患有书写困难或听觉处理障碍等疾病的人至关重要。\n\
  \n确保数字平台支持 STT 功能并提供清晰的错误纠正选项，可增强依赖这些工具的用户的无障碍体验。\n\n###### 简化界面和可读性增强\n\n有些用户会遇到认知或信息处理困难，包括患有多动症、智力障碍或读写困难等学习差异的人。其他用户，例如自闭症患者，可能受益于可预测的设计模式和减少的感觉过载，尽管自闭症本身并非认知障碍，但它可能与认知障碍同时发生。\n\
  \n\n\n\n设计能够最小化认知负荷的界面可以显著改善可访问性。以下是有用的功能包括：\n\n- 一致的导航以减少困惑\n- 简单的语言和清晰的说明以支持理解\n\
  - 内容分块以将文本分解为可管理的部分\n- 图标和视觉辅助以强化含义\n\n例如，一个在线税务准备工具如果向用户展示长篇、滚动量大的密集财务术语页面，很快就会变得难以承受——尤其是对于注意力缺陷多动障碍、阅读障碍或处理障碍的人来说。通过将流程分解为带进度指示的分步屏幕，并提供简明语言解释和视觉提示（如图标或工具提示），该工具变得更容易导航并充满信心地完成。\n\
  \n这种包容性的界面设计并不依赖辅助技术，但它确实共享相同的核心目标：使内容更容易访问、理解和使用。随着我们转向下一节，我们将重点关注主动帮助用户在数字环境中导航的工具——以及如何从一开始就考虑到这些技术进行设计。\n\
  \n了解辅助技术的范围只是第一步。确保它们在数字环境中无缝运行才是包容性设计真正成形的地方。这些工具的有效性仅限于它们所交互的系统，因此从一开始就考虑到可访问性进行设计至关重要。在下一节中，我们将探讨如何将辅助技术整合到设计流程中，确保数字体验不仅在技术上可访问，而且对每个人来说都真正可用。\n\
  \n##### 将辅助技术整合到设计中\n\n辅助技术的有效性取决于它们所运行的环境。如果网站是考虑到可访问性而编码的，屏幕阅读器可以更好地导航该网站，而语音识别软件则在为语音命令设计的界面上效果最佳。\n\
  \n当然，我们不能独自为每种残疾做好计划，因为我们不可能以所有可想象的方式使自己残疾。我们不知道我们不知道的事情——直到各种残疾的人以不同的方式与我们的数字环境互动。\n\
  \n这就是为什么与依赖辅助技术的真实用户进行测试是无价的。自动可访问性测试可以识别一些编码错误，但它们无法复制用户的真实体验。例如，视力受损的用户可能会揭示导航问题，这些问题并不明显，例如下拉菜单消失得太快，屏幕阅读器无法检测到。\n\
  \n为辅助技术设计也需要灵活性。考虑一个视频会议应用程序。为听障用户提供字幕、为运动障碍者提供键盘快捷键以及与屏幕阅读器兼容可确保平台对广泛受众可访问。这种灵活性惠及所有人，使应用程序或网站在不同场景下更易于使用。\n\
  \n##### 辅助技术对设计的影响\n\n当我们考虑到辅助技术进行设计时，我们不仅是在解决问题，我们也在创新。这些工具推动我们超越平均用户，创造直观且公平的体验。通过将设计实践与辅助技术的<|message|>要求保持一致，我们确保数字空间对所有人可用。\n\
  \n例如，为电子商务网站设计清晰的标签、可缩放的文本和合乎逻辑的工作流程可提高屏幕阅读器用户的可用性，但这些相同的功能也使在小屏幕上购物或赶时间的人受益。可访问性原则增强了整体用户体验，使产品对每个人都更好。\n\
  \n辅助技术为数字内容提供必要的访问，但其有效性取决于它们与真实用户需求的一致性。仅仅实施这些工具是不够的。设计师和开发者必须考虑不同的残疾如何塑造交互，并确保可访问性功能在实际、有意义的方式中发挥作用。通过将用户需求映射到特定的设计解决方案，我们可以超越通用修复，创造直观、无缝且赋能所有用户的数字体验。\n\
  \n##### 将用户需求映射到设计解决方案\n\n为可访问性设计始于理解用户的多样化需求。最有效的解决方案不是一刀切的——它们可以适应不同的场景、残疾和辅助技术。满足这些需求始于提出正确的问题：我们为谁设计？他们可能会遇到什么障碍？我们如何从一开始就减少或消除这些障碍？\n\
  \n一种强大的方法是内置定制。让用户调整字体大小、切换到深色模式、关闭动画或选择他们喜欢的输入方式，将控制权交到最了解自己需求的人手中。灵活、以用户为中心的体验通常是最可访问的——也是最包容的。\n\
  \n- **挑战：** 该平台使用紧密排列、两端对齐的装饰衬线字体，并且没有调整视觉呈现的方式。这些选择使学生更难解码和保留信息，增加疲劳和挫败感。\n- **解决方案：**\
  \ 使用无衬线、适合阅读障碍的字体，增加充足的行间距，并提供定制选项（如更改文字/背景颜色对比度）可以显著减少视觉压力。虽然不是治愈方法，但可选的文本转语音集成也可能在解码变得太困难时支持理解。\n\
  \n通过应用这些原则并与神经多样性用户进行测试，您可以收集有价值的见解，突出具体的障碍并指导有针对性的可访问性改进。通过了解用户的背景，设计师可以优先考虑影响最大的更改。\n\
  \n##### 映射需求的现实应用\n\n了解用户需求只是第一步——将这些见解应用于现实世界的数字产品才是可访问性产生切实影响的地方。从教育到电子商务再到金融服务，不同行业呈现出包容性设计的独特挑战和机遇。通过检查这些领域中的常见可访问性障碍，我们可以识别出改善所有用户可用性的实用解决方案，而不仅仅是残疾人士。以下示例突出说明了如何通过映射用户需求来创造更可访问、更公平的数字体验。\n\
  \n##### 电子学习平台：消除数字教育的障碍\n\n电子学习平台通常服务于多样化的用户，包括认知障碍、视觉障碍和听力损失者。然而，当可访问性未被考虑时，这些平台可能会对学习造成重大障碍。例如，考虑以下障碍和实用解决方案：\n\
  \n*想象这个场景：* 一名盲人大学生、一名聋大学生和一名患有多动症的第三名学生报名参加了一门在线课程，该课程严重依赖视频内容和冗长的阅读作业。\n\n*现在，他们可能会面临什么挑战？*\n\
  \n- 视频缺乏字幕或文字记录，排除了聋/听力障碍学生\n- 长篇、无结构的文本使多动症或阅读障碍学生不堪重负\n- 盲人学生遇到导航障碍和不兼容屏幕阅读器的无障碍测验\n\
  \n*解决方案是什么？*\n\n- 为所有视频内容提供字幕和文字记录\n- 允许可调节的播放速度以支持听觉处理需求\n- 使用清晰的标题和简洁的段落结构内容以增强认知可访问性\n\
  - 确保屏幕阅读器兼容性，包括为所有交互元素添加标签\n- 为测验和讨论表单启用完整的键盘导航\n\n这些更改改善了残疾学生的访问，同时也使多任务处理者、非母语使用者以及在嘈杂或分散注意力的环境中使用的用户受益。\n\
  \n虽然教育为知识打开了大门，但零售中的可访问设计确保在购物、连接和简单参与日常生活时，这些大门保持敞开。\n\n##### 电子商务网站：确保包容的在线购物\n\
  \n电子商务网站必须满足各种能力的需求，但许多网站未能考虑可访问性，使在线购物对一些用户来说令人沮丧或不可能。\n\n*想象这个场景：* 一名视力低下客户、一名手部活动受限的另一名客户和一名使用屏幕阅读器的第三名客户尝试在零售网站上购物。\n\
  \n*挑战是什么？*\n\n- 表单字段在视觉上已标记但未以编程方式标记，使屏幕阅读器用户感到困惑\n- 仅通过字体颜色变化表示的错误消息对色觉缺陷用户来说并不易于理解\n\
  - 小的触摸目标和下拉菜单对运动障碍用户来说很困难\n- 缺少或描述不充分的替代文本的产品图像使屏幕阅读器用户缺乏上下文\n\n*解决方案是什么？*\n\n-\
  \ 确保表单字段以编程方式（而不仅仅是视觉上）标记\n- 用图标或文字补充颜色编码的消息\n- 放大可点击区域并简化键盘和开关控制用户的交互\n- 为产品图像添加有意义的替代文本\n\
  \n\n\n\n\n这些解决方案扩展了所有购物者的可用性，同时减少了购物车放弃率并提高了销售履约率。但可访问性不仅仅关乎便利或转化——它关乎公平，尤其是在财务独立和个人安全岌岌可危时。\n\
  \n随着越来越多的基本服务转向线上，数字可访问性已成为公民权利问题，而非个人偏好。诸如管理银行账户、申请残疾福利、签署医疗表格或审阅法律文件等任务必须同时具备可访问性和安全性。对于残疾人，尤其是使用辅助技术的人来说，当系统未以他们的需求为出发点构建时，隐私和自主权就会面临风险。\n\
  \n例如，一位盲人用户通过屏幕阅读器填写医疗 intake 表格时，应该能够独立完成——无需第三方代为朗读敏感的健康信息。同样，听障用户必须能够以不完全依赖音频的格式接收重要的财务或法律信息。\n\
  \n在这些场景中，可访问设计必须超越可读性——它必须优先考虑准确性、保密性和用户控制。包容性系统不仅仅是良好的商业实践；它们对于保护残疾用户在高风险的数字空间中的尊严、隐私和权利至关重要。\n\
  \n##### 银行和金融工具：改善金融领域的数字可访问性\n\n银行应用和网站处理需要精确和隐私的敏感任务。对于残疾用户来说，不可访问的设计造成的不仅是挫败感，更是自主权的丧失——尤其是在独立管理财务方面。\n\
  \n*想象这个场景：* 一位盲人用户尝试输入 PIN，但该字段与屏幕阅读器输入不兼容。他们被迫向他人求助，从而损害了隐私。认知障碍用户由于实现不佳而无法依赖自动完成功能或使用密码管理器，从而增加了出错或安全问题的风险。第三位行动受限的用户因应用要求仅使用鼠标输入而难以完成交易。\n\
  \n*挑战是什么？*\n\n- 视觉 CAPTCHA、限时验证码和音频提示，排除了盲人、聋人或神经多样性用户\n- 不可访问的 PIN 输入字段，阻止了安全、独立的身份验证\n\
  - 不支持自动完成功能或密码管理器\n- 密集的金融术语和杂乱的数据表格\n- 200% 缩放时布局失真，破坏可读性和导航\n- 没有可访问替代方案的 CAPTCHA\
  \ 系统\n\n*解决方案是什么？*\n\n- 实施不依赖视觉或声音的可访问登录选项，例如生物识别和多因素身份验证\n- 确保 PIN 字段和安全表单与屏幕阅读器和可访问输入方法兼容\n\
  - 支持自动完成功能、保存的凭据和密码管理器集成\n- 使用简明语言、逻辑分组以及带有标题、简洁标签和屏幕阅读器友好标记的可访问数据表格来重新格式化财务数据\n\
  - 测试与屏幕放大器和浏览器缩放的兼容性（尤其是在 200% 时），以便及早发现响应式设计问题\n- 提供非视觉 CAPTCHA 替代方案，例如基于逻辑或多选的选项\n\
  \n这些改进超越了技术合规性。它们保护隐私、支持独立性并建立信任——所有这些在金融领域都是必不可少的。银行的可访问性不仅仅关乎包容——它关乎尊严、安全和平等获得财务赋权的机会。\n\
  \n##### 迭代：成功的关键\n\n映射用户需求不是一次性练习，而是一个持续的过程。随着用户需求的演变，旨在满足这些需求的解决方案也必须随之演变。考虑一家公司推出其应用的可访问版本，却通过反馈发现其实时聊天功能与屏幕阅读器不兼容。这种反馈循环对于完善设计和保持包容性至关重要。\n\
  \n迭代涉及设计师、开发者和用户之间的协作。定期与多样化参与者进行可用性测试可确保解决方案保持相关性和有效性。例如，使用依赖键盘导航的用户测试新的搜索筛选器可能会揭示隐藏的障碍，从而在功能广泛发布前促成改进。\n\
  \n##### 识别差距并弥合它们\n\n没有产品第一次尝试就能完美。用户需求与当前技术或设计能力之间往往存在差距。认识到这些差距是弥合它们的首步。\n\n无论您是在构建新产品还是改造现有产品，最有效的反馈都来自每天使用该技术的用户，而不是试图模拟不熟悉体验的内部团队。\n\
  \n初学者提示：从与 3–5 名使用不同辅助技术的参与者进行有监督的可用性测试开始（例如，屏幕阅读器用户、开关设备用户和依赖语音控制的人）。\n\n专家级举措：建立常设残疾顾问委员会，或从一开始就将残疾专业人士嵌入产品和\
  \ UX 团队。\n\n##### 从测试到合作伙伴关系：将反馈整合到工作流程中\n\n除非反馈被整合到决策中，否则它就没有价值。一次性用户测试是个开始，但可持续的可访问性来自于在每个冲刺、发布和评审中建立反馈循环。\n\
  \n以下是如何将可访问协作构建到您的流程中：\n\n- 在 QA 和内部评审期间使用真实辅助技术（而非模拟）。使用屏幕阅读器（JAWS、NVDA、VoiceOver）、屏幕放大器、开关控制和语音导航工具进行测试。\n\
  - 创建包含严重程度评级和可访问性影响的错误报告或障碍跟踪机制，以便修复能与视觉或功能缺陷并列优先处理。\n- 让设计师、开发者和 QA 参与用户简报，而不仅仅是产品负责人。共同的洞察带来共同的责任。\n\
  - 记录所学内容并在团队间分享。避免将可访问性知识孤立，留给单一倡导者。\n\n初学者提示：在您的完成定义中加入屏幕阅读器测试。\n\n专家级举措：在产品团队中指定可访问性联络人，他们直接与残疾用户联系以关闭反馈循环。\n\
  \n##### 从意识到行动：创造问责文化\n\n真正的包容性并不止于测试——它体现在您的组织价值观、工作流程和招聘实践中。创造一种可访问性被期望而非例外的文化需要持续的承诺：\n\
  \n- 用残障人士主导的培训取代同理心工作坊或模拟，重点关注现实影响和解决方案。\n- 在冲刺演示、全体会议或回顾中庆祝可访问性成果并突出亲身经历的声音。可见性很重要。\n\
  - 确保领导层将可访问性作为跨职能优先事项，而非仅由合规团队事后处理的事项。\n- 使用来自残疾用户的可用性评分等指标来衡量进展，而不仅仅是 WCAG 通过/失败率。\n\
  \n初学者提示：启动一个内部可访问性教育系列，聚焦残障人士的声音和实用工具。\n\n专家级举措：将可访问性指标纳入 OKR 或 KPI，将包容性与业务目标保持一致。\n\
  \n您无需模拟残疾就能理解包容的必要性。您需要倾听、招聘、参与和投资。残疾人不需要被想象——他们需要被倾听、信任和纳入。他们的见解不是边缘案例——它们是构建适用于每个人的系统的核心。当可访问性以真实体验为依据时，结果是更好的产品、更好的成果和一个更公正的数字世界。\n\
  \n##### 摘要\n\n在本章中，您探讨了不同类型的残疾——视觉、听觉、运动、认知和心理健康——如何塑造用户与数字体验的互动方式。您了解了这些差异如何影响访问需求，以及屏幕阅读器、可刷新盲文显示器、开关控制和放大器等各种辅助技术如何支持数百万用户的访问。我们还研究了清晰的内容结构、有意义的标签、键盘导航和灵活界面在支持跨残疾类型可用性方面的重要性。\n\
  \n\n\n\n\n理解这些用户需求对于创建超越技术合规的可访问产品至关重要。你看到了无障碍设计选择如何限制人们获取银行和医疗等关键服务的途径，以及包容性实践——例如简明语言、无障碍身份验证和支持自定义——如何恢复自主性和信任。本章还强调了使用真实用户和辅助技术进行测试的重要性，以及以\
  \ lived experience 为中心而不是依赖模拟的重要性。\n\n在下一章中，我们将从理解用户需求转向将法律和伦理考量应用于产品设计。你将学习如何使你的工作与无障碍法律和标准保持一致，将包容性实践整合到设计系统和开发工作流程中，并在团队和组织中扩展无障碍。\n\
  \n##### 无障碍设计中的法律与伦理考量\n\n*By Maya Sellon*\n\n当你打开字幕观看 Netflix 上最喜欢的节目时，你正在受益于无障碍法律的实际成果。这些法律保护不仅确保合规；它们推动为每个人创造更具包容性的体验。但无障碍不仅仅是合规——它也是关于伦理。仅满足法律最低要求的产品可能对许多人来说仍然无法使用，而以伦理驱动的方法则确保体验感觉像魔法一样无缝。包容性设计应融入流程中，而不是事后添加。\n\
  \n某些监管框架，例如**美国《残疾人法案》(ADA)**和**联合国《残疾人权利公约》(CRPD)**，已确立了无障碍的法律要求，并为确保数字空间包容性奠定了基础。然而，法律本身只是起点。真正的包容需要超越合规。伦理设计将重点从满足最低标准转向创造包容性体验。它认识到障碍是由设计选择造成的，而不是由残疾个体造成的。\n\
  \n在本章结束时，你将清晰地了解确立无障碍为基本人权问题而非短暂趋势或设计偏好的主要无障碍法律和国际保护。有了这一基础，你将能够自信地反对对无障碍措施的抵制，无论是关于用户人口统计的问题还是成本驱动的商业担忧。你还将更好地理解法律要求和伦理考量如何相互交织，使你能够倡导将包容性设计作为核心原则而非事后考虑。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- 驾驭全球无障碍立法\n- 平衡法律合规与伦理责任\n- 预测数字无障碍的未来法律趋势\n- 培养以伦理驱动的设计文化\n\
  \n###### 驾驭全球无障碍立法\n\n残疾权利的法律保护不仅仅是监管要求。它们将无障碍定义为基本人权，并塑造社会如何看待包容性。虽然各国的无障碍法律有所不同，但它们是确保平等获取、防止歧视并追究组织责任的关键工具。然而，法律保护远非普遍。仅有\
  \ 24% 的国家宪法明确禁止歧视或肯定基于残疾的平等权利，而不到 10% 的国家宪法明确保障残疾人的公民权利（UCLA WORLD Policy Analysis\
  \ Center, 2024）。宪法保护是挑战不平等和 dismantling 歧视性法律的关键起点。在乌干达，法律改革导致为残疾人提供强制性工作场所便利（Shakespeare\
  \ et al., 2019），而在秘鲁和哥伦比亚，宪法保障已确保残疾人享有投票权（Open Society Foundations, 2019）。虽然这些成功案例凸显了可能性，但仍存在重大障碍——我们将在本章后面探讨。\n\
  \n除了设定法律义务外，这些法律还影响更广泛的社会态度。联合国 CRPD 倡导的社会模式残疾观，已将残疾重新定义为外部障碍而非个体损伤的问题。这一转变产生了深远影响，鼓励政策和设计实践从一开始就优先考虑无障碍，而不是将其视为事后考虑。\n\
  \n以下是法律保护在全球范围内重要的原因：\n\n- **人权与平等：** 残疾权利是人权。超过 90% 的联合国成员国批准了 CRPD，因为它们认识到残疾歧视是需要解决的全球性问题。\n\
  - **打击系统性歧视：** 法律保护免受排斥，并有助于打破就业、教育和公共服务中的障碍，确保残疾人不会面临限制其机会和独立性的系统性障碍。\n\n美国《残疾人法案》引入了残疾的民权方法，促进包容性、无障碍和平等地位。这些原则影响了国际框架的发展，特别是联合国\
  \ CRPD，该公约采用了类似的基于权利的模式来推动全球残疾权利（Blanck, 2023; Kanter, 2003; Szymanski, 2009）。\n\
  \n这些发展以及日益增长的国际倡导导致了 2006 年联合国 CRPD 的起草——21 世纪首个全面的<|message|> 人权条约，也是承认无障碍，包括数字无障碍，为基本人权迈出的关键一步（UN\
  \ DESA, n.d.-a）。第 9 条要求各国确保获取物理环境、交通、信息和通信，包括数字服务，强调在生活的各个领域消除障碍的重要性（UNGA, 2006）。\n\
  \n这些法律基础解释了为什么无障碍不仅仅是好的设计——它是法律权利。了解这些义务的来源使你能够自信地倡导符合全球法律标准的包容性、合规的数字产品。\n\n######\
  \ 数字无障碍与全球法律框架\n\n数字无障碍已成为确认残疾人权利和消除系统性歧视的关键焦点。**Web 内容无障碍指南 (WCAG)** 是数字无障碍的国际公认标准，WCAG\
  \ 2.0 也被正式确认为 ISO/IEC 40500:2012。ISO/IEC 40500:2012 预计将被 ISO/IEC DIS 40500 取代，与\
  \ WCAG 2.2 保持一致（International Organization for Standardization, 2012）。\n\nWCAG 定义了三个一致性等级——A、AA\
  \ 和 AAA——表示无障碍程度的递增。每个等级都建立在前一个等级之上，这意味着 AA 级包括所有 A 级要求，而 AAA 级包括 A 和 AA 的所有内容，外加额外的成功标准。AA\
  \ 级是立法和政策中最常采用的标准（Rogers, 2025）。虽然 AAA 级代表最高标准，但即使是该级别的内容也可能无法完全满足多样化的类型、程度或无障碍需求的组合，特别是在认知、语言和学习方面（World\
  \ Wide Web Consortium [W3C], 2024b）。\n\n这些指南概述了用于评估网站、应用程序和数字内容是否可供残疾人使用的可衡量成功标准。虽然\
  \ WCAG 本身没有法律约束力，但它通常在被纳入国家或地区法律时成为立法的基础。\n\n例如，**欧洲无障碍法案 (EAA)**，计划于 2025 年生效，是确保欧盟成员国无障碍性的重要一步。每个欧盟国家负责\n\
  \n\n\nfor implementing the EAA’s requirements, determining penalties for non-compliance,\
  \ and designating enforcement bodies, though some countries already have stronger\
  \ accessibility laws in place. The EAA introduces common requirements for specified\
  \ digital products and services, reinforcing WCAG as a benchmark through its reference\
  \ in EN 301 549, the European technical standard for digital accessibility. This\
  \ standard establishes baseline accessibility requirements across the EU, aligning\
  \ with WCAG principles and the broader goals of the UN CRPD (European Parliament\
  \ & Council of the European Union, 2019; European Telecommunications Standards Institute,\
  \ 2021).\n\nIn April 2024, the U.S. Department of Justice reinforced the importance\
  \ of digital accessibility, formalizing WCAG 2.1 Level AA as the legal standard\
  \ for public entities under the Americans with Disabilities Act (U.S. Department\
  \ of Justice, 2024). While the U.S. legal landscape is shaped by a mix of federal,\
  \ state, and local laws, with court rulings often leading to fragmented interpretations,\
  \ this decision further cements WCAG as a foundational standard for web accessibility.\n\
  \nThe influence of WCAG extends beyond the U.S. and Europe, shaping digital accessibility\
  \ laws worldwide. Countries such as New Zealand, Moldova, and Zimbabwe have adopted\
  \ WCAG into their national design standards (Jordanoski & Meyerhoff Nielsen, 2023).\
  \ Brazil’s Law for Inclusion of Persons with Disabilities (Law 13.146, 2015) mandates\
  \ that both public and private sector websites meet accessibility standards (Bianchi,\
  \ 2021). These laws reflect a growing international commitment to ensuring that\
  \ digital spaces are inclusive and accessible and highlight WCAG’s pivotal role\
  \ in shaping accessibility standards worldwide.\n\nOne of the earliest global legal\
  \ victories for digital accessibility came in 2000, when Bruce Maguire successfully\
  \ challenged the Sydney Organising Committee for the Olympic Games (SOCOG) under\
  \ Australia’s Disability Discrimination Act for failing to make their website accessible\
  \ for him as a blind user to purchase tickets online. This ruling marked a landmark\
  \ moment, establishing that digital inaccessibility could constitute unlawful discrimination\
  \ (Russell, 2003).\n\nWhile international laws and accessibility standards set expectations,\
  \ their effectiveness often depends on enforcement. Legal action plays a key role\
  \ in ensuring compliance, holding organizations accountable when accessibility is\
  \ overlooked. One landmark case, National Association of the Deaf, et al. v. Netflix,\
  \ resulted in a historic settlement requiring Netflix to provide 100% closed captions\
  \ on its on-demand streaming content within two years (Disability Rights Education\
  \ & Defense Fund, 2012). The Netflix lawsuit was a pivotal moment for digital accessibility,\
  \ setting a legal precedent that influenced accessibility policies across the streaming\
  \ industry, requiring content providers to prioritize inclusive design from the\
  \ start. This is why, today, you can turn on captions and enjoy almost any program\
  \ on Netflix – an accessibility victory made possible through legal action.\n\n\
  ##### The challenges that remain\n\nThe Netflix lawsuit underscored the importance\
  \ of accessibility while revealing a deeper issue: laws are only effective when\
  \ they are enforced. Legal victories like this help drive industry-wide change,\
  \ but enforcement remains inconsistent across regions and industries. Yet, despite\
  \ legal progress, gaps in enforcement, implementation, and awareness mean that barriers\
  \ persist. Below are some of the most pressing challenges that continue to hinder\
  \ accessibility progress:\n\n- **A lack of awareness and education:** Many organizations\
  \ remain unaware of their duty regarding legal accessibility requirements, leading\
  \ to poor implementation and widespread noncompliance.\n- **Limited enforcement\
  \ mechanisms:** Even where accessibility laws exist, enforcement is inconsistent,\
  \ leading to non-compliance.\n- **Resource constraints:** Small businesses and underfunded\
  \ organizations may struggle to meet accessibility standards without financial or\
  \ technical support.\n- **Rapid technological changes:** Laws and standards struggle\
  \ to keep pace with evolving digital technologies, creating gaps in compliance requirements.\n\
  \nHowever, a country’s or an organization’s wealth alone doesn’t dictate accessibility\
  \ success – focused strategies, education, enforcement, and targeted awareness campaigns\
  \ to address stigma and cultural attitudes are crucial. Challenges will persist\
  \ without proper support, even with the adoption of legal frameworks and standards\
  \ (Jordanoski & Meyerhoff Nielsen, 2023).\n\nThese challenges aren’t limited to\
  \ organizations. They reflect broader global patterns. While the CRPD sets a powerful\
  \ benchmark, not all countries have committed equally, and many that have still\
  \ struggle to meet their obligations. According to the United Nations Disability\
  \ and Development Report (2024), accessibility efforts, including in digital spaces,\
  \ need to accelerate up to 65 times faster to meet global inclusion goals by 2030.\n\
  \nThis highlights an important reality: legal frameworks lay the groundwork for\
  \ accessibility, but compliance alone does not guarantee an inclusive experience.\
  \ Even in regions with strong laws, organizations must move beyond only meeting\
  \ legal requirements and embrace their ethical responsibility to create meaningful,\
  \ lasting change.\n\n##### Balancing legal compliance and ethical responsibility\n\
  \nFor many businesses, legal compliance is the primary motivator for accessibility\
  \ initiatives. Laws such as the ADA, EAA, and the UN CRPD provide a clear legal\
  \ foundation. The risk of lawsuits, financial penalties, and reputational harm offers\
  \ compelling arguments to prioritize accessibility. However, a compliance-first\
  \ mindset risks turning accessibility into a tick-box exercise, where meeting minimum\
  \ requirements overshadows the broader ethical responsibility to design inclusive\
  \ experiences that work for everyone.\n\nSo, how do you ensure accessibility doesn’t\
  \ become just another box to tick?\n\nIt starts with a mindset – one that views\
  \ accessibility as part of a longer journey, not a quick fix. If you’re working\
  \ to improve accessibility, you’re helping lead a cultural transformation, one that\
  \ prioritizes real inclusion over speed or surface-level solutions. Tools can help,\
  \ but only when guided by a clear understanding of what they can – and can’t – do.\n\
  \n##### The role and limitations of automated solutions\n\nAutomated testing uses\
  \ software tools to quickly scan digital content against accessibility standards.\
  \ These tools are particularly valuable for their speed, scalability, and efficiency,\
  \ supporting high-volume reviews and identification of technical issues. A study\
  \ by Deque, a web accessibility software and services company known for its axe\
  \ suite of testing tools, which analyzed over 13,000 web pages, found that automated\
  \ tools can detect just over 57% of accessibility issues present on a web page (Deque\
  \ Systems, n.d.). This makes automated testing invaluable for identifying common,\
  \ quantifiable errors such as missing alternative text or missing form labels.\n\
  \nHowever, automated testing’s strengths come with significant limitations. The\
  \ same study revealed that automated tools could evaluate only 16 of the 50 success\
  \ criteria defined under WCAG 2.1 Level AA, representing approximately 30% of the\
  \ total criteria (Deque Systems, n.d.). This subset focuses on the most frequent\
  \ and easily measurable accessibility issues but leaves 70% of success criteria\
  \ requiring manual evaluation by accessibility professionals or through user testing\
  \ to ensure compliance and usability.\n\nThis distinction is critical. Automated\
  \ tools may excel at identifying quantifiable technical issues, but they currently\
  \ cannot evaluate the quality or contextual aspects of accessibility solutions.\
  \ This gap can create false assurances, giving the illusion that a digital product\
  \ meets accessibility requirements when, in practice, it does not provide a genuinely\
  \ inclusive experience.\n\n\n\n\n例如，自动化工具可能会确认替代文本的存在，但不会评估这些替代文本是否具有意义，或者是否传达了图片的用途。也许一张图片包含了关键信息，例如客服电话号码，而替代文本被设置为“呼叫中心支持号码”，却省略了实际号码。自动化工具很可能不会将此标记为错误，但屏幕阅读器用户仍然无法获取该电话号码。\n\
  \n自动化测试中的这类缺陷揭示了过度依赖自动化方法处理无障碍问题所面临的更大挑战。随着无障碍领域的发展，工具市场正在从检测扩展到自动化解决方案。虽然自动化测试有助于检测某些无障碍问题，但现在其他工具被宣传为自动化修复工具。例如，覆盖层是第三方工具，声称无需修改底层代码即可解决无障碍问题。它们常被定位为节省成本的选项，使产品团队能够避免培训或返工费用；覆盖层负责处理无障碍问题，而团队继续照常工作。\n\
  \n然而，这些工具并非没有风险，依赖它们可能会导致法律和声誉上的损害。在一起备受关注的案例中，美国联邦贸易委员会于2025年因一家公司发布误导性广告而对其处以100万美元罚款，裁定该公司通过虚假宣传其覆盖层的能力违反了联邦法律（Lainey\
  \ Feingold 律师事务所，2025）。批判性评估至关重要，对于“轻松修复”的承诺应持谨慎态度。\n\n##### 无障碍设计的伦理维度\n\n法律合规为无障碍设定了基线，但组织还必须考虑其设计带来的伦理影响。例如，经过深思熟虑的替代设计，例如复杂视觉元素的文本版本，如果从一开始就纳入考量，可以增强可访问性和包容性。然而，为数字产品或网站提供“无障碍版本”可能在技术上符合无障碍标准，但可能会通过强化“他者”感而使用户边缘化。为残障用户创建附加版本可能会重演历史上的隔离做法，并且无法体现通用设计的原则。\n\
  \n相反，道德责任要求组织从一开始就优先考虑包容性。从一开始就进行无障碍设计不仅确保合规，还能促进公平和尊重的用户体验。这也符合商业目标，因为它扩大了市场覆盖面并提升了品牌声誉。\n\
  \n例如，动效设计（如为现代界面增添精致的动画和过渡效果）可以增强视觉吸引力，但可能会让对动态敏感的用户（如前庭障碍患者）感到不适。周到的设计通过尊重用户偏好来预判这一需求。苹果和微软等公司允许用户在系统层面设置“减弱动态效果”偏好。尊重这些偏好、绝不覆盖它们，并确保在保持整体设计完整性的前提下，精心创建替代体验以保留清晰度和可用性，这一点至关重要。\n\
  \n同样，在游戏行业，从一开始就进行无障碍设计已经展示了包容性方法的力量。为游戏添加基本键盘控制这一后期补救措施或许能满足最低合规要求，但往往会导致较低劣的用户体验。相比之下，以无障碍为核心开发的游戏允许盲人玩家利用听觉反馈独立地在赛道上导航。这种方法旨在创造包容性的体验，而不仅仅是满足要求。它表明包容性设计能够推动创新、激发创造力并扩大市场覆盖范围。\n\
  \n##### 超越打勾式的形式主义\n\n无障碍不仅仅是为了避免诉讼；而是要认识到，个体面临的障碍并非其自身固有，而是由我们设计的系统、工具和环境造成的。提供单独的“无障碍版本”内容在技术上可能符合法律标准，但却让人觉得是事后才想起的补充。它给人的感觉是一个匆忙准备的选项，仿佛在说：“我们忘了你，但这里有个东西，你就将就用吧。”\n\
  \n为了弥合合规性与可用性之间的鸿沟，组织必须将重心从仅仅满足要求转向创造无障碍且包容的产品。这一转变涉及：\n\n- **投资于稳健的监控系统：** 无障碍不是一次性的修复。持续的监控工具可以让无障碍问题保持可见并处于关注的首要位置，即使团队更迭、数字产品不断演进，也能支持长期承诺。\n\
  - **将无障碍嵌入产品开发生命周期：** 无障碍必须贯穿设计、开发和测试。当设计师、开发者和测试人员将其视为本职工作的一部分时，它就不再是额外任务，既减少了不必要的返工，也自然成为工作常态。\n\
  - **改变领导层的态度：** 如果没有领导层的支持，无障碍工作仍将面临资金不足、优先级靠后和被动应对的局面。许多组织陷入一种自我实现的循环，即无障碍总是一项昂贵而临到最后一刻才处理的负担。\n\
  \n可以把包容性设计想象成烘焙蓝莓松饼的过程。当无障碍从开始就被融入其中，就像烘焙前将蓝莓拌入面糊一样，它就成为体验中不可分割的一部分。蓝莓的风味被充分吸收，面糊获得了蓝莓的浓郁口感，最终成品是一个完整而体贴、让每个人都感到愉悦的产品。相比之下，在成品完成后才追加无障碍设计，就像试图把蓝莓硬塞进已经出炉的普通松饼里：既混乱又难看，最终也无法带来同样的体验。\n\
  \n随着无障碍审计日益成熟，必须牢记：工具和流程的有效性取决于其背后的意图。法律合规是必要的基础，但道德责任才能确保无障碍工作转化为对所有用户有意义且公平的体验。\n\
  \n同样，随着技术的发展与数字格局的变化，无障碍法律必须跟上AI驱动界面等创新以及数字公共服务日益普及的步伐。为了更好地预判这些变化，让我们探讨新兴的法律趋势如何塑造无障碍的未来。\n\
  \n##### 预测数字无障碍领域的未来法律趋势\n\n随着技术的进步和数字服务在日常生活中日益普及，无障碍法律也必须同步演进。多个新兴趋势正在塑造法律框架处理无障碍问题的方式，从对数字服务的日益依赖到人工智能的作用。理解这些趋势有助于个人和组织预判未来的法律要求，并主动将无障碍融入其战略。\n\
  \n###### 对数字服务日益增长的依赖\n\n世界各地的政府和组织正在迅速将服务数字化，从医疗保健到银行再教育。例如，数字身份证、电子签证和在线公共服务的兴起带来了更大的便利，但如果在设计时没有考虑包容性，也可能导致无障碍鸿沟扩大。然而，这一进展取决于一些关键前提，如可靠的设备、互联网连接以及可负担的电等公用事业。如果不解决这些基础需求，数字优先战略可能会用新的障碍取代传统障碍，特别是对经济社会处于不利地位的个人和社区而言。\n\
  \n法律框架开始应对这些挑战。例如，《欧洲无障碍法案》要求许多基本数字服务在2025年前实现无障碍，为各行各业的无障碍执法树立了新的先例。然而，合规性仍然\n\n\
  在全球范围内并不一致，组织必须为未来几年内出台更严格的法规做好准备，例如要求数字基础设施无障碍的《欧洲无障碍法案》（EAA）。\n\n需要牢记的事项：\n\n\
  - 为现实世界的人群设计，而不仅仅针对理想条件。并非每个人都拥有最新的设备、最快的互联网连接，甚至并非每个人都能持续接入宽带。应利用人口统计数据、设备使用统计和平均网速，确保你的服务能惠及真正需要它的人，而不只是那些拥有前沿技术的人。\n\
  - 提供替代访问方式。有些用户可能出于年龄、残障或个人偏好而更倾向于或需要非数字化选项。确保基本服务不会因为没有无障碍替代方案而被锁定在仅限在线的平台之后，例如提供电话支持或现场协助。\n\
  - 考虑数字素养和可发现性。即便用户能够上网，他们也需要知道去哪里，并理解如何使用你的服务。复杂的注册流程、不清晰的导航或过于专业的语言，都可能与缺少屏幕阅读器标签一样构成障碍。\n\
  \n与此同时，由社交媒体平台、公众声音和文化代表性所推动的社会意识，促使残障更广泛地趋于常态化。\n\n##### 文化转变预示政策变革\n\n真实的形象呈现对于打破刻板印象、重塑公众对残障的态度发挥着重要作用。例如，《绝命毒师》演员\
  \ RJ Mitte 患有脑瘫，他饰演了患有相同疾病的角色。而使用轮椅的 Marissa Bode 在最近的《魔法坏女巫》电影改编中，是首位被真实选角出演 Nessarose\
  \ 的演员。除了增加可见度之外，这些塑造还提供了一个契机，可以影响残障的呈现方式，确保故事反映真实经历，而非依赖过时的模式。\n\n社交媒体还放大了关于残障和神经多样性的讨论，使这些状况对公众而言更加可见、更易产生共鸣。这种可见度的提高产生了涟漪效应，为在政策制定过程中有意纳入残障人士铺平了道路。例如，WCAG\
  \ 3.0 标准草案明确表示其目标是满足更广泛的用户需求，包括认知障碍（W3C, 2024a），这体现了社会变迁如何反映在政策演变中。\n\n随着文化转变持续塑造无障碍期望，组织与政策制定者都必须考虑这些变化如何影响公众态度和法律优先级。\n\
  \n需要牢记的事项：\n\n- 公众期望塑造企业责任。仅靠形象展示是不够的。随着残障包容变得更加可见，客户、员工和利益相关者将期望企业在无障碍方面切实行动，而不仅仅是营销宣传。未能跟上这些期望的企业将面临信誉和消费者信任流失的风险。\n\
  - 代表性应超越营销层面。残障包容不仅是活动中展示多样性，还要求在设计过程中雇用、咨询残障人士并与之合作。当有亲身经历的人不参与决策时，假设和刻板印象就会滋生，导致产品、服务和政策无法满足真实需求。\n\
  \n随着无障碍期望不断提升，影响无障碍政策的另一个关键因素是全球人口老龄化。随着人们寿命延长并在晚年继续留在劳动力市场，无障碍需求将扩展到残障包容之外，还须考虑与年龄相关的视觉、听觉、行动能力和认知功能变化。\n\
  \n##### 人口老龄化的影响\n\n全球人口正在老龄化。2022年，65岁及以上人口为7.7亿，占全球79亿人口的9.7%。联合国预计，到2050年这一数字将上升至16亿，占97亿人口的16.4%（UN\
  \ DESA, 2022）。这一人口结构变化将显著影响工作场所无障碍、医疗服务和数字平台，要求组织针对视觉、听觉、行动能力和认知方面的年龄相关变化进行设计。\n\
  \n这些挑战中有许多与现有标准重叠，例如文本可读性、高对比度和键盘导航指南。然而，大多数无障碍政策尚未完全适应老龄化劳动力和消费群体的具体需求。\n\n各国政府和经济政策团体已开始采取行动。世界经济论坛的长寿经济原则和七国集团的《索尔法尼亚诺宪章》强调了让残障人士参与政策制定，以及设计支持健康老龄化、公平就业和社会包容的制度的重要性（G7\
  \ Italia 2024, 2024）。随着人口持续老龄化，组织必须预见到旨在改善老年人可用性的更严格的无障碍法规。欧盟成员国正在将《欧洲无障碍法案》转化为国家立法，这展示了这些原则如何转化为可执行的法律进展，并提供了一个值得关注的清晰范例。\n\
  \n需要牢记的事项：\n\n- 与年龄相关的无障碍需求不限于残障包容。老年人会经历视觉、听力、灵巧度和认知功能的逐步变化，这意味着设计必须考虑清晰的对比度、更大的文本和直观的界面。WCAG\
  \ 成功标准——包括通俗语言、可预测导航和更大的交互元素目标尺寸——有助于满足这些需求。\n- 只关注面向公众的无障碍而忽视自身员工是一个代价高昂的错误。随着人们在劳动力市场中的时间更长，未能提供无障碍工具和环境将导致生产力下降、员工参与度降低，并最终增加企业成本。组织应确保内部平台、数字工具和工作场所政策符合无障碍标准，而不仅仅是面向客户的服务。\n\
  \n随着无障碍要求的扩展，人工智能等新兴技术在塑造数字无障碍未来方面既带来机遇也带来风险。\n\n##### 在人工智能治理中解决无障碍问题\n\n人工智能有潜力显著改善无障碍，但如果在设计时未考虑多样化的用户，也可能加剧现有障碍。语音识别、实时图像描述生成等人工智能驱动功能，已经改变了许多残障人士的访问方式。与此同时，当人工智能在有限数据集上训练或在缺乏人工监督的情况下开发时，往往会排斥或固化有害的刻板印象。\n\
  \n例如，语音识别技术往往难以处理非标准语音模式、浓重口音或言语障碍，这使得语音助手对某些用户不可靠。人工智能生成的内容也可能强化刻板印象，例如生成的图像中包括轮椅，或将所有佩戴助听器的人都描绘为老年人，这反映了训练数据中固有的偏见。\n\
  \n各国政府正开始应对这些挑战。欧盟的《人工智能法案》和美国的《人工智能权利法案》反映了人们对人工智能伦理影响以及安全、包容和透明系统设计需求的日益认识。这些框架与无障碍目标紧密契合，并承认人工智能在医疗、教育和就业等关键领域可能制造或消除障碍（European\
  \ Commission, 2021; White House, n.d.）。随着人工智能应用持续加速，将无障碍要求纳入人工智能治理必须在塑造未来立法中发挥重要作用。\n\
  \n需要牢记的事项：\n\n- 人工智能的包容性取决于它所学习的数据。在选择人工智能模型时，组织应审查用于训练的数据集，确保它们代表人类经验的全部多样性，包括残障、神经多样性和非标准语音模式。如果开发定制人工智能，团队必须主动纳入多样化的输入，以防止偏见导致排斥或歪曲用户。\n\
  - 人工智能生成的无障碍功能应视为补充，而非替代。自动字幕、替代文本和其他人工智能驱动的解决方案可以增强无障碍性，但不应被完全依赖。人工审核仍然必不可少，以确保输出准确、可用且在语境中有意义。\n\
  - 人工智能无障碍正成为监管问题，而不仅仅是伦理问题。随着人工智能应用的扩展，企业将被要求确保自动化系统不会制造新的无障碍障碍。及时了解全球人工智能无障碍法规将是保持合规的关键。\n\
  \n通过观察社会运动、日益真实的媒体呈现以及追踪公共话语——无论是对老龄化人口、残障包容还是人工智能监管的态度演变——都会清楚地看到，无障碍法规并非孤立存在。它们是由社会不断变化的需求所塑造的。这些变化凸显了一种日益增长的期望：无障碍不仅仅是合规问题，而是数字和社会进步的基本组成部分。\n\
  \n随着这些运动持续发展壮大，个人和组织必须保持参与，确保包容不是事后想法，而是一项指导原则。这意味着将无障碍融入组织设计、构建和创新的文化之中。\n\n#####\
  \ 培养伦理驱动的设计文化\n\n随着数字无障碍的发展，组织必须培养一种将包容性视为创作过程重要组成部分的设计文化。通过将意识、教育和伦理责任融入工作流程，团队可以确保所创造的解决方案适用于每个人。\n\
  \n###### 意识是变革的催化剂\n\n无障碍差距往往并非源于有意的排斥，而是源于对用户需求多样性缺乏认识。设计师通常专注于美学和功能性，却没有意识到诸如色彩对比度、屏幕布局或视觉效果等决策会如何\n\
  \n会影响残障人士或任何面临情境性挑战人群的可用性。例如，低视力者可能依赖缩放或深色模式来减轻眼部疲劳，但这些功能同样有益于在昏暗环境中工作或劳累一整天后感到疲劳的用户。\n\
  \n提高认识是迈向包容性设计的第一步。设计师为每个人打造体验，无论是年长用户为舒适调整字体大小、专业人士切换深色模式以减轻视疲劳，还是朋友在嘈杂咖啡馆中依赖字幕。当设计决策反映真实世界使用场景时，它们便超越了美学，确保每个人的需求都被考虑到。\n\
  \n##### 教育是行动的基础\n\n仅有意识是不够的。团队需要可操作的知识，将无障碍融入其工作流程。像 WCAG（Web 内容无障碍指南）这样的标准提供了可靠的基础，通过可衡量的标准确保一致、包容的设计。这些标准是关键的路标，让人们清楚地知道并确信产品对所有人都可用。\n\
  \n然而，无障碍教育不能仅仅依靠设计师。它必须贯穿整个团队，从开发人员和内容创建者到测试人员和领导层。通过认证、工作坊、网络研讨会或无障礙专家的支持进行持续教育，可确保团队始终跟上新兴标准、法律发展和不断演进的技术。这种共享知识还能减少协作障碍、简化决策流程，并避免无障碍被当作事后追加的事项。\n\
  \n投资教育——尤其是*持续*教育——传递出一个信号：无障碍不是可选项；它是高质量、以用户为中心的设计中不可或缺的一部分。\n\n##### 将无障碍融入设计流程\n\
  \n在团队认知的基础上，由伦理驱动的设计文化将无障碍融入设计流程的每个阶段，从研究和原型设计到测试和迭代。通过及早识别并解决障碍，团队可以创造更具包容性、更周到的体验，同时避免事后改造无障碍所需的高昂成本。\n\
  \n设计师在这一过程中发挥着关键作用。将无障碍审查纳入日常工作流——无论是测试色彩对比度、确保键盘和屏幕阅读器用户的逻辑导航，还是考虑动画等视觉元素的影响——都有助于将无障碍嵌入设计核心。\n\
  \n设计文化本质上从来不是静止的。它在改进、迭代和解决问题中蓬勃发展。由伦理驱动的文化将无障碍视为一个持续的过程，应用与改进其他设计结果相同的迭代和解决问题思维。这意味着无障碍必须是主动的，而不是被动的——是设计师从一开始就融入其中的，而不是事后添加的。\n\
  \n最终，设计师不仅仅是在构建产品，他们还在塑造体验。体验可以令每位用户感到被欢迎、被关怀和被赋能；也可能排斥、挫败并破坏用户的努力。通过认识到自身的重要作用，并将无障碍视为卓越设计的标志，设计师可以借助创造力推动有意义、美好且持久的变革。\n\
  \n无障碍不能仅靠某个人或某个团队。设计、开发、内容和质量保证之间的协作，可确保包容性原则贯穿整个产品生命周期，为所有用户创造统一有效的解决方案。\n\n####\
  \ 总结\n\n本章探讨了无障碍领域中法律合规与伦理责任的交集。虽然 ADA、CRPD 和 EAA 等法律提供了法律基础，但真正的包容不仅仅要满足法律要求。卓越设计的标志是将无障碍融入文化、流程和决策之中——因为无障碍不只是规则与法规，而是关乎人。\n\
  \n无论是通过人工智能驱动技术、社会期望的转变，还是人口老龄化的现实，无障碍将在人生的某个阶段影响每一个人。如果早期未能优先考虑无障碍，组织面临的风险就是制造障碍、排斥用户、增加成本并削弱长期可持续性。但如果将无障碍视为设计原则而非事后补救，企业和个人都能推动有意义且持久的进步。\n\
  \n我们审视了自动化测试的局限性、文化和技术变革对无障碍政策的影响，以及将无障碍融入组织文化的重要性。通过理解这些因素，个人和企业可以预见法律趋势、倡导伦理设计，并将包容作为核心原则来落实，而不仅仅是法律要求。\n\
  \n将无障碍融入文化和流程，正是把合规转化为有意义包容的关键。但知道无障碍的重要性还不够——你需要确保那些将使用你产品的人真正参与到设计过程中。在下一章中，我们将深入探讨用户研究和测试如何帮助创造满足真实用户需求而非假设的无障碍数字产品。\n\
