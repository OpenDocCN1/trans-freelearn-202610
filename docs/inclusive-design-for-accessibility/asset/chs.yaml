- "## Preface\n\n在日益数字化的世界中，能够在线访问信息、服务和机会已不仅仅是一种奢侈——它是一种人权。然而，对于数百万残障人士而言，日常的数字体验仍然存在障碍，阻碍了他们的全面参与。无论是无法通过屏幕阅读器导航的移动应用，还是将关键内容隐藏在无法访问的模态窗口中的网站，或是误解用户语音或意图的\
  \ AI 工具，数字排斥仍然是一个持续存在且可以解决的问题。《Inclusive Design for Accessibility》是一本实用指南，面向所有希望弥合这一差距的人——设计师、开发者、内容创作者、QA\
  \ 测试人员以及组织领导者。\n\n本书汇集了来自无障碍社区各方的声音，为您提供构建包容性数字体验的全面路线图。它首先让您掌握包容性设计的原则以及真实用户的多样化需求。从此出发，它探讨了实施的方方面面：如何设计可访问的用户界面、撰写包容性内容、构建可访问的网站和移动应用，以及如何通过自动化工具和人类洞察进行测试。随着技术的演进，我们的方法也必须与时俱进。因此，我们还将审视\
  \ VR、AR 和 AI 等新兴空间中的无障碍问题——并探讨实现可持续扩展所需的组织策略。\n\n在整本书中，您将遇到现实世界的工具和技术——从 VoiceOver\
  \ 和 NVDA 等屏幕阅读器到 SwiftUI、Compose 和 React Native 等开发框架。但更重要的是，您将获得一种以人为中心的无障碍视角：它将包容性视为一种创造性、伦理且对业务至关重要的实践，而非一份清单。无论您是刚刚起步还是希望提升组织无障碍成熟度，本书都将帮助您怀着同理心设计、怀着意图构建，并创造适用于每个人的数字产品。\n\
  \n## Who this book is for\n\n本书非常适合致力于包容性设计的数字设计师、开发者、UX 专业人士、产品经理和商业领袖。它提供创建可访问数字产品的实用技能，同时涵盖法律和伦理方面、用户研究，以及在团队内部建立无障碍文化。\n\
  \n您无需成为专家即可从本书中获益。每章都提供可独立使用的实用见解——无论是 UX 设计、产品管理、开发还是无障碍领导。\n\n## What this book\
  \ covers\n\n在第 1 章 *Defining Inclusive Design in the Digital Age* 中，Dale Cruse 描绘了无障碍从被动附加项到主动、以用户为中心的设计思维的演变。该章介绍了通用设计原则、残障的社会模式和包容性研究方法等基础概念，帮助您设计适用于每个人的数字体验。\n\
  \n在第 2 章 *Understanding Diverse User Needs: Types of Disabilities and Assistive\
  \ Technologies* 中，Dr. Angela Young, CPACC，探讨了具有广泛永久性、暂时性和情境性残障的人们如何与数字技术互动。该章深入介绍辅助技术，对不同残障类型进行分类，并将用户需求映射到包容性设计策略，为您提供创建真正可访问且赋能所有人的数字产品的实用指导。\n\
  \n在第 3 章 *Legal and Ethical Considerations in Accessible Design* 中，Maya Sellon 解释了数字无障碍既是法律要求也是伦理\
  \ imperative。该章概述了《ADA》和《CRPD》等全球法律，探讨了仅合规方法的局限性，并强调从一开始就包容性设计的重要性，以促进有意义且公平的用户体验。\n\
  \n在第 4 章 *User Research and Testing for Inclusive Products* 中，Julianna Rowsell 指导您建立以残障、神经多样性和边缘化参与者为中心的包容性研究实践。该章提供公平招募、无障碍方法和有意义分析的策略，强调包容性研究是一种关系性、持续性的实践——而非清单——必须转化为反映多元用户真实生活的设计决策。\n\
  \n在第 5 章 Designing Accessible User Interfaces: Visual and Interaction Design 中，Nandita\
  \ Gupta 探讨了如何构建在视觉、认知和输入相关维度上都具包容性的界面。该章提供关于负责任使用颜色、支持认知无障碍、启用多种输入方法以及扩展无障碍设计系统方面的实用指导，帮助您创建不仅可用而且对所有人公平的数字体验。\n\
  \n在第 6 章 Creating Accessible Content: Writing, Images, and Multimedia 中，Jennifer\
  \ Chadwick 赋能内容创作者通过使用简明语言、无障碍格式和替代内容格式包容性地进行沟通。该章提供撰写清晰文本、标记交互元素、描述图像和多媒体的实用指导，并以一次动手练习结束，帮助创作者评估和改进各类内容的无障碍性。\n\
  \n在第 7 章 Developing Accessible Websites: HTML, CSS, and ARIA Best Practices 中，Crystal\
  \ Scott 为开发者提供构建包容性、可访问网站的基础技能。该章涵盖语义化 HTML、无障碍 CSS 样式、ARIA 属性的正确使用以及测试策略——鼓励一种以无障碍为先的心态，将包容性融入每一次编码决策。\n\
  \n在第 8 章 Mobile Accessibility: Designing for Touch and Voice Interfaces 中，Chris\
  \ McMeeking 探讨了构建可访问移动应用的独特挑战和机遇。该章提供优化触控目标、支持多样化输入方法、为语音交互设计以及确保响应式布局的实用指导——帮助团队在各平台和设备上提供包容性的移动体验。\n\
  \n在第 9 章 Accessibility in Emerging Technologies: VR, AR, and AI 中，Dr. Keith Newton\
  \ 探讨了如何在沉浸式和智能系统中设计包容性体验。该章提供使虚拟现实和增强现实适应多样化用户需求的实用策略，并强调 AI 在实现方式不同时既可增强也可复杂化无障碍。\n\
  \n在第 10 章 Foundations of Accessible Design System Patterns 中，Charlie Triplett 概述了从零开始将无障碍融入设计系统的全面框架。该章强调先从常见用户需求入手——如低视力、色彩感知和认知无障碍——再逐步增加更复杂的辅助技术支持，指导团队创建包容性、可扩展的系统，使其默认减少障碍。\n\
  \n在第 11 章 Tools and Techniques for Accessible Evaluation and Prioritization 中，Kai\
  \ Wong, CPACC, CHES®，指导您进行网站和移动应用无障碍测试的实际步骤。该章涵盖如何将自动化工具与人工审计相结合、优先处理和修复问题，以及将无障碍嵌入开发工作流程——帮助团队从根本上构建更具包容性的数字产品。\n\
  \n在第 12 章 Building an Inclusive Design Culture: Strategies for Organization 中，Denis\
  \ Boudreau, CPWA，展示了如何将无障碍嵌入组织的日常运营、文化和思维方式。该章概述了培养同理心、将无障碍整合到工作流程、衡量进展和保持持续学习等策略——帮助团队从合规转向有意义、以人为本的包容性设计实践。\n\
  \n## To get the most out of this book\n\n本书面向从事数字产品工作的人——设计师、开发者、内容策略师、研究人员等。我们假设您了解构建网站或应用的基础知识，但不一定了解无障碍或包容性设计。\n\
  \n您无需成为专家。重要的是您准备好转变视角——将包容性视为一种核心设计价值，而非清单，它使每个人受益。\n\n如果您带着好奇心、开放心态以及愿意质疑默认做法的意愿，您会发现本书既实用又具有变革性。\n\
  \n## Download the color images\n\n我们还提供了一份 PDF 文件，其中包含本书中使用的截图/图表的彩色图像。您可以在此处下载：https://packt.link/gbp/9781835888223。\n\
  \n## Conventions used\n\n本书中使用了多种文本约定。\n\nCodeInText: 表示文本中的代码词、数据库表名、文件夹名、文件名、文件扩展名、路径名、虚拟\
  \ URL、用户输入和 X/Twitter 账号。例如：“Tags such as <header>, <article>, and <section> provide\
  \ clear definitions of their role, allowing both browsers and assistive technologies\
  \ to interpret and navigate the page effectively.”\n\n\n\n\n\n代码块设置如下：\n\n```\n\
  @media (prefers-color-scheme: dark) {\n  body {\n    background-color: #121212;\n\
  \    color: #f5f5f5;\n  }\n}\n```\n\n**粗体：** 表示新术语、重要词语，或你在屏幕上看到的词语。例如，菜单或对话框中的词语在文本中以这种方式出现。例如：“**语义化\
  \ HTML** 使用固有描述其目的的元素来构建网页，使内容更具意义且更易访问。”\n\n![](img/3bdc9e2d41de898f8a3bcc9634b0000e_27_0.png)\n\
  \n警告或重要说明以这种方式出现。\n\n![](img/3bdc9e2d41de898f8a3bcc9634b0000e_27_1.png)\n\n提示和技巧以这种方式出现。\n\
