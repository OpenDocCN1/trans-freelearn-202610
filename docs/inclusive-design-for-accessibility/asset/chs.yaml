- "# 第 1 部分\n\n## 包容性设计的\n基础\n\n本开篇部分为设计无障碍且包容的数字体验奠定了基础。在四个章节中，您将了解塑造当今数字世界包容性设计的核心理念、法律框架和实践方法。从理解无障碍的发展历程和用户需求的多样性，到应对全球立法和融入伦理责任，这些章节将无障碍重新定义为不仅仅是清单，而是一种以人为本的设计承诺。\n\
  \n您还将学习如何开展尊重 lived experience、挑战掠夺性做法并将洞察转化为可执行设计决策的包容性用户研究。\n\n在本部分结束时，您将具备所需的知识、心态和基础实践，以开始构建不仅合规而且真正包容的数字产品。\n\
  \n本部分包含以下章节：\n\n- *第 1 章，数字时代的包容性设计定义*\n- *第 2 章，了解多样化的用户需求：残疾类型与辅助技术*\n- *第 3 章，无障碍设计中的法律与伦理考量*\n\
  - *第 4 章，包容性产品的用户研究与测试*\n\n### 1\n\n#### 数字时代的包容性设计\n定义\n\n*作者 Dale Cruse*\n\n设计中无障碍的历程揭示了我们对人类多样性和技术对社会影响的理解发生了深刻而重大的转变。我们已超越狭隘、规定性的做法，拥抱一种更全面的视角，庆祝人类能力和经验丰富而复杂的光谱。这种转变代表了设计演进；从根本上重新构想技术如何连接和赋能不同能力和情境下的人们。\n\
  \n在当今数字世界中，理解包容性设计至关重要：它是对创作者的专业必需，通过扩大市场和创新带来商业优势，确保法律合规，并随着技术日益成为日常生活核心而帮助构建更无障碍的数字社会。\n\
  \n整体方法是为包容性设计提供全面的基础，从将无障碍视为事后考虑转变为将其视为使所有用户受益的基本设计原则。\n\n在本章中，您将探索数字无障碍的演进、通用设计的原则以及以用户为中心的方法论。您将学习如何创建赋能所有能力用户的包容性产品，将无障碍从事后考虑转变为嵌入核心设计原则。\n\
  \n目标是为包容性设计提供实践基础，展示其如何推动创新和连接。您将获得重新思考方法的工具，确保您的工作反映所有用户的多样化需求。\n\n随着技术成为日常生活的核心，这一知识至关重要。通过拥抱包容性设计，您不仅能提升专业技能，还能为一个更公平的数字社会做出贡献，在那里技术服务于每个人。\n\
  \n因此，在本章中，我们将涵盖以下主题：\n\n- 了解数字无障碍的历史背景和演进\n- 探索通用设计的七项原则\n- 实施以用户为中心的设计方法论\n- 认识包容性的商业案例\n\
  \n##### 了解数字无障碍的历史背景和演进\n\n过去，无障碍通常是设计的滞后补充，临时解决方案被附加到现有产品上。沮丧的用户在使用无法解释图形、经常误读单词、经常崩溃、并且需要为每个新软件版本手动更新的屏幕阅读器时苦苦挣扎。文本转语音系统带来了额外的挑战，其机械声音和理解力差。原始的键盘控制在应用程序之间无法一致工作。许多放大工具在显著减慢计算机速度的同时还会扭曲文本和图像。独立的屏幕阅读器尤其成问题——笨重的软件难以与主流应用程序良好配合。所有这些限制都提供了不佳的体验，并强化了残疾是“其他”或与常态分离的观念。幸运的是，这些解决方案与今天更无缝集成的系统相比相去甚远。\n\
  \n随着我们对残疾和人类多样性的理解加深，我们的设计方法也随之演进。万维网诞生于 1989 年，带来了新的无障碍挑战和机遇。1999 年发布《网络内容无障碍指南》是一个里程碑，为标准化的网络无障碍实践铺平了道路。这些指南引入了键盘导航、图像替代文本和适当的标题结构等关键标准——这些功能现在已成为网页设计的基石。其影响是革命性的：首次，全球开发者拥有了创建无障碍网站的共同框架，导致残疾人士的互联网访问能力大幅改善。\n\
  \n##### 从为残疾设计到为人类的多样性设计转变\n\n在拥抱更广泛的包容性设计观之前，该领域最初专注于通过针对性解决方案解决残疾。设计师创建了专门的功能，如盲人用的屏幕阅读器、聋人用的闭路字幕，以及运动障碍者用的替代输入设备。这些针对残疾的适应是至关重要的一步，帮助许多人访问数字内容并为无障碍标准奠定了基础。然而，这种狭隘的方法往往导致隔离式解决方案，使残疾用户显得不同，并且对特定损伤的关注意味着错失创造更具普遍益处功能的机遇。\n\
  \n设计师意识到为无障碍设计的功能正在帮助所有人。想想闭路字幕——它们最初是为听力障碍者、学习新语言的人或在嘈杂环境中导航的人设计的，但哇，它们真的流行起来了！现在你有语言学习者紧盯着它们，学习新单词，以及在繁忙咖啡馆或健身房里静默追随自己最喜欢节目的观众。就像它们找到了全新的受众一样。\n\
  \n语音控制功能讲述了类似的故事——最初为运动障碍者设计，它们已成为任何人做饭时手脏、多任务处理的父母或需要免提操作的司机日常便利。这些曾经专门的功能现在如此常见，以至于许多人甚至不再将其视为无障碍工具。这一洞见引发了设计思维的革命。\n\
  \n包容性设计认识到我们都在能力滑动尺度上，随着时间和情境而变化。即使视力 20/20 的人也可能在烈日下眯着眼看智能手机上的小文本。拥抱这些多样化的场景使我们能够创造让每个人都脱颖而出的产品。\n\
  \n这种新思维将残疾视为流动而非固定。历史上，残疾通常被定义为永久性、使人丧失能力的状况——使一个人从根本上与常态不同。但这一观点已经演变。今天，我们更广泛地理解残疾为个人能力与其环境之间不匹配，由永久性、暂时性或情境性损伤塑造。骨折的手臂、抱着婴儿的父母或在颠簸公交车上的通勤者——所有人都会面临暂时性障碍，限制其与数字系统的交互。包容性设计迎合这些日常挑战，使每个人的生活更顺畅，并反映了对人类能力的更细致理解。\n\
  \n\n\n\n\n- **交叉性：** 考虑多种因素如何叠加加剧无障碍挑战。例如，同时听障且行动受限的用户可能会面临需要量身定制解决方案的独特障碍。\n- **需求变化：**\
  \ 理解用户需求会随时间演变，尤其随着人口老龄化并面临与年龄相关的功能损伤。例如，老年人可能受益于更大的触控目标和简化的导航，以适应运动技能和视力的下降。\n\
  - **文化多样性：** 考虑用户体验中的文化和语言差异。例如，为从右到左的语言设计支持，或确保图标和图像具有文化包容性，可以使产品在全球范围内更具无障碍性。\n\
  \n磨练这一技能使设计师能够创建更具包容性的产品，吸引更广泛的受众。这种方法提升市场覆盖面，推动创新，增强品牌声誉，并降低法律风险。\n\n##### 在现有设计中发现无障碍障碍\n\
  \n包容性设计中的另一项关键技能是能够发现当前设计中的无障碍障碍。这些障碍形式多样：\n\n- **视觉：** 对比度低的文本、依赖颜色的信息，或缺少替代文本的图像。\n\
  - **听觉：** 没有字幕或文字记录的视频，或没有文字备份的音频内容。\n- **运动：** 过小的触控目标或键盘导航死胡同。\n- **认知：** 术语繁多的语言，或不增加意义的标题。快速定时提示或复杂导航等设计选择也会增加认知负荷，或对患有心理健康状况的用户触发焦虑。\n\
  - **语音：** 仅语音的界面没有文字替代，或语音识别难以应对多样化的口音和语音模式。\n\n发现这些障碍就像同时扮演侦探、技术高手和共情者。你必须亲手使用辅助技术，紧跟最新的无障碍指南脉搏——关键是——把各种能力的人真正带入你的设计游乐场。这不仅仅是简单地打勾；它涉及深入理解不同的人如何导航数字世界。\n\
  \n虽然自动无障碍检查器可以发现一些问题，但许多障碍只有通过动手测试和用户反馈才会显现。例如，机器人可能会对所有图像都有替代文本给出点赞，但它无法判断该文本是否描绘出有意义的画面。\n\
  \n设计师和开发者可以从第一天起就打造包容性的数字体验，而不是在以后追赶无障碍功能。\n\n包容性设计是关于创建能与人类多样性全谱系产生共鸣的体验。它具有前瞻性，涉及每个人所拥有的多种能力、情境和偏好。这意味着引入历史背景，拥抱残疾的社会模式，并磨练识别和拆除通往确保数字世界为每个人服务的道路上障碍的技能。\n\
  \n为了将这些原则付诸实践，让我们探索包容性设计中最具影响力的框架之一：通用设计的七项原则，它提供了创建真正无障碍体验的具体指导。\n\n##### 探索通用设计的七项原则\n\
  \n1997年，罗纳德·梅斯及其北卡罗来纳州立大学团队发布了一个改变游戏规则的框架：通用设计的七项原则。最初为物理空间打造，这些原则在我们的数字世界中找到了新的使命，重塑了我们创建包容性在线体验的方式。\n\
  \n以下是七项原则：\n\n- 1. **公平使用：** 这是数字迎宾垫。一个允许每个人根据需要调整文字大小和颜色对比度的网站体现了公平使用的实践。\n- 2.\
  \ **使用灵活性：** 无论你点击、说话还是打字，真正灵活的设计都能适应用户。这是一款无论用指尖还是语音命令都能感觉自如的应用。\n- 3. **简单直观使用：**\
  \ 一个设计良好的电子商务网站能让你从浏览顺利过渡到结账？那就是简单和直观性的体现，让每个人都能轻松在线购物。\n- 4. **可感知的资讯：** 一个提供字幕、音频描述和文字记录的视频播放器？那就是可感知资讯的实践，确保没有人错过内容。\n\
  - 5. **容错性：** 想想一个表单会温和地指出错误并告诉你如何修正。那就是确保手指一滑不会变成令人沮丧的折磨。\n- 6. **低体力消耗：** 具有批量操作和键盘快捷键的内容管理系统体现了这一原则，使数字任务更简单。\n\
  - 7. **大小和空间以便接近和使用：** 这转化为与所有屏幕和手指都能良好配合的设计。让我们创建易于点击的触控目标，并设计布局，无论在手机还是桌面上都能很好地工作。\n\
  \n拥抱这些原则不仅仅是设计数字产品；它让我们能够创造欢迎每个人的体验。这时我们才意识到，出于无障碍而诞生的功能往往会成为人人喜爱的通用功能，从而让我们的数字世界变得更好。\n\
  \n在数字世界中将通用设计原则付诸实践涉及重新构想我们对数字体验的整体方法，确保每一次互动对所有能力的人来说都是直观、公平和赋能的。通过从一开始就优先考虑包容性，我们创建的数字环境不仅满足多样化需求，还能为每个人促进创新和连接。\n\
  \n以下示例说明了包容性设计原则如何在实践中应用，展示了从一开始就优先考虑无障碍和适应性如何带来创新、以用户为中心且惠及所有人的解决方案。\n\n- **从一开始就包容：**\
  \ 将多样化的用户需求视为你的设计缪斯，而非事后考虑。苹果的 VoiceOver 从 iOS 最初版本就内置其中，而不是后来添加。微软的 Xbox Adaptive\
  \ Controller 是通过与残障游戏玩家的持续合作设计，其核心功能从一开始就成形。\n- **灵活布局：** 创建在任何设备上看起来都很棒的自适应界面，从智能手机到桌面显示器。BBC\
  \ News 网站自动在设备间调整布局和图像大小，同时保持可读性。《卫报》的响应式设计从桌面上的多列布局无缝切换到移动端单列布局，同时不丢失内容或功能。\n\n\
  ![](img/3bdc9e2d41de898f8a3bcc9634b0000e_40_0.png)\n\n图 1.1：《卫报》在网页和移动端的首页\n\n-\
  \ 多感官魔力：自助式互动方法包括视觉、听觉和触觉。让用户选择口味。Google 地图提供视觉导航、语音引导和转弯的触觉反馈。Netflix 提供音频描述、字幕和视觉控制，让用户混合搭配他们偏好的内容消费方式。\n\
  - 保持清晰：拥抱语言和导航的简洁。这不是简化；这是打开。Gov.uk 用简明语言取代了复杂的政府术语，提高了用户理解度。Duolingo 使用简单、一致的导航模式和清晰的图标，帮助用户专注于学习而非弄懂界面。\n\
  \n##### duolingo\n\n![](img/3bdc9e2d41de898f8a3bcc9634b0000e_41_0.png)\n\n图 1.2：Duolingo\
  \ 清晰的按钮和界面\n\n- **与辅助技术好好配合：** 确保你的产品能很好地与屏幕阅读器、语音识别等配合使用。Twitter 的图像描述功能与屏幕阅读器配合良好，使视觉内容对盲人用户和低视力用户来说更易访问，尽管他们的需求可能不同——例如，低视力用户可能更依赖缩放工具和对比度调整而非全屏阅读。Microsoft\
  \ Word 提供强大的无障碍功能，包括正确标记的表单字段和导航辅助，使文档对屏幕阅读器用户更易使用。\n\n\n\n\n\n- **测试中的多样性：** 从能力光谱各端的用户那里收集反馈。他们的见解是设计的黄金。Airbnb\
  \ 对色盲用户进行可用性测试，以改进其地图界面和房产照片。Facebook 的无障碍团队包括残障工程师，他们在发布前测试新功能。\n- **保持了解：** 密切关注无障碍指南的最新动态。WCAG\
  \ 不仅仅是一个缩写；它是你的设计指南针。采用这些无障碍要求促使 WordPress 更新其编辑器以实现更好的键盘导航。美国银行定期更新其移动应用以满足不断发展的\
  \ WCAG 指南，确保持续的无障碍改进。\n\n这些原则融入数字设计的 fabric 中，创造的不仅是无障碍的产品，更是令人愉悦的体验。关键在于认识到源于无障碍的功能往往会成为人人喜爱的通用功能。\n\
  \n通用设计的七项原则不是指南，而是一份欢迎数字体验的配方。在整个设计过程中拥抱这些原则，意味着不仅仅是勾选要求；它为每个人打开了更直观、更灵活、更人性化的数字体验之门，无论其能力或生活状况如何。\n\
  \n为了有效地将这些原则付诸实践，我们需要了解如何实施以用户为中心的设计方法论，将真实的人置于开发过程的核心。\n\n##### 实施以用户为中心的设计方法论\n\
  \n以用户为中心的设计将人们置于创作过程的核心，深入了解所有用户的生活、需求和体验，并将他们的视角贯穿于设计 fabric 的每一根线中。通过采取这种方法，我们不仅仅是在创造产品，我们打造的是与人类多样性产生共鸣的体验。无障碍不是事后考虑，而是从第一天起就成为主角。\n\
  \n##### 理解多样化的用户需求和体验\n\n理解多样化的用户要求我们超越自身的体验，考虑人们与技术交互的多种方式。这是以用户为中心设计的第一个飞跃——认识到我们的用户就像雨林生态系统一样多样，每个人都有其独特的能力、偏好和生活背景。\n\
  \n想想看：\n\n- 一位用户可能因永久性视觉障碍而浏览数字世界。\n- 另一位可能因运动损伤而暂时单手使用。\n- 又一位可能在海滩度假时因屏幕眩光而感到困扰。\n\
  \n要真正把握这种用户需求的万花筒，设计师需要：\n\n- **成为人口统计侦探：** 深入研究跨越各种背景、年龄和技术熟练程度的用户研究。设计师可能会通过对不同年龄组和技术背景的用户进行结构化访谈开始，记录他们如何导航常见任务以识别模式和痛点。\n\
  - **掌握能力字母表：** 从视觉到听觉，从运动到认知——考虑人类能力的全范围和挑战。例如，在设计移动应用时，设计师应同时使用标准触控控制和语音命令或开关控制等替代输入方法进行导航测试，以确保通用访问。\n\
  - **拥抱变化：** 请记住，用户需求不是一成不变的。它们会随着时间、情境甚至情绪而变化。设计师可以通过创建具有可调设置灵活界面来应对这一点，例如阅读应用可根据一天中的不同时间或用户疲劳程度的不同而调整界面。\n\
  - **连接交叉性的点：** 认识到身份的不同方面如何交织，创造出独特的无障碍难题来解决。设计师可能会遇到一位既色盲又因运动障碍而使用键盘导航的用户，这需要在界面设计中仔细考虑颜色对比度和键盘焦点指示器。\n\
  \n在认识到这些多样化的用户需求和交叉性考虑之后，下一步是开发有效的研究方法来深入理解它们。让我们探索具体的技术，帮助捕捉用户体验的全谱系并将其转化为可操作的见解。\n\
  \n##### 包容性用户研究和测试技术\n\n要真正为所有人设计，我们需要深入挖掘用户体验。以下是一些强大的技术来发掘那些隐藏的见解：\n\n- **撒大网：**\
  \ 在招募参与者时，要考虑多样性的所有形式。真正有效的研究小组应反映社会的多样性 itself，汇集不同能力、年龄、文化和技术熟练程度的人，每个人都贡献其独特的视角。\n\
  - **设身处地：** 真正的情境探究就像在用户生活中当一只苍蝇。设计师通过在用户自然环境中观察用户，记录他们在真实世界情境中如何与技术交互，并提出深思熟虑的问题来发掘见解，从而实现这一点。\n\
  - **共情训练营：** 共情地图、用户角色和其他工具让你的团队有机会走进用户的鞋子里：\n  - **共情地图** 是一种视觉工具，通过将观察结果组织到四个象限来帮助团队理解用户：他们说什么、想什么、感受什么、做什么。它捕捉用户的行为、情绪和动机，以建立更深的共情并为设计决策提供信息。\n\
  \  - **用户角色** 是基于研究的虚构目标用户代表，旨在体现他们的目标、行为、需求和挑战，帮助团队将设计决策与受众的真实体验和优先事项保持一致。\n- **无障碍侦探工作：**\
  \ 对你的数字产品进行定期审计就像健康检查。利用高科技工具和人工测试来嗅出设计中潜伏的任何障碍。\n- **试驾技术：** 邀请依赖辅助技术的用户来测试你的产品。这就像拥有专家顾问，他们可以发现你可能从未考虑过的问题。\n\
  - **共同创造：** 在有效的设计工作坊中，多元用户不仅仅是反馈提供者——他们是创意过程的副驾驶。这些会议可以激发任何设计师独自无法想到的想法。\n\n在与用户共同创造中收集见解后，下一个关键步骤是通过系统迭代来完善这些想法。这种持续的原型、测试和完善过程确保我们的协作见解演变为真正有效的解决方案。\n\
  \n![](img/3bdc9e2d41de898f8a3bcc9634b0000e_46_0.png)\n\n图 1.3：Xbox Adaptive Controller\
