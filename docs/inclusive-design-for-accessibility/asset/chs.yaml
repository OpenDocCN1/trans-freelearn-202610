  \n### 4\n\n#### 用户研究与测试\n面向包容性产品\n\nBy Julianna Rowsell\n\n包容性研究是一种用户研究方法，它有意纳入那些经常被排除在外的群体的人，尤其是残疾人、神经多样性人士以及面临系统性障碍的其他人。它确保我们构建的产品反映更广泛的需求、能力和生活现实。包容性研究不仅仅关乎可访问性；它关乎公平。它质疑谁有权塑造我们所有人依赖的工具和系统，以及当我们不去询问时谁会被排除在外。但包容性并非自动实现。它要求我们从一开始就重新思考如何设计研究、涉及谁、如何接触他们，以及我们愿意根据所学内容做出何种改变。\n\
  \n包容性研究对不同的人以不同的方式是可访问的，但其核心始于一种心态，一种不默认稀缺、太难、太慢或成本太高的心态。它看到了接触和纳入多元参与者的丰富性。当我们将招募，即邀请人们参与我们研究的过程，视为一种障碍时，我们限制的不仅是我们的覆盖面，还有我们的想象力。但当我们将招募视为一种关怀行为时，我们就开始转变我们的方法。它成为以公平为中心的研究的创造性和必要的一部分，是建立信任和关系，而非交易的契机。\n\
  \n作为一名神经多样性研究者，我以不同的方式进行研究。这对那些接受线性方法或传统 UX 流程训练的人来说可能令人困惑且感觉不熟悉，但这种差异正是我的洞察力所在。我不仅仅工作方式不同，我感知方式也不同。我的大脑会循环、停留和跳跃。它首先注意到边缘：摩擦、重置、压倒。多年以来，我被告知这些特质是干扰，需要抚平、隐藏。但它们已成为我的指南针。它们塑造了我如何营造空间、如何在言语之下倾听，以及如何与那些不合拍的东西保持在一起。\n\
  \n我的方法论不是线性的，因为我的思维也不是。我以螺旋方式移动。我会暂停。我会加入呼吸。我让沉默发声。当事情感觉不清晰时，我不会急于解决它，我会倾听。困惑不是失败。它是一道信号灯。一个信号，表明表面之下有更深的东西正在移动。这不是低效。这是一种更慢的精确。当研究过早要求清晰时，我们冒着失去仍在展开之物的风险。我学会了信任混乱的、非线性的和未言说的，因为真理往往就存在于那里。\n\
  \n可访问性是包容性研究的起点。它不仅仅关乎某人是否能加入研究。它关乎为了感到安全、被看见、能够留下需要付出什么。它是关系性的。它受权力、历史、背景的影响。在我们要求某人分享之前，我们必须问自己是否已做好工作去妥善地迎接他们。在这种意义上，无障碍成为脚手架。可访问性是其\
  \ lived experience，并包括以下内容：\n\n- 物理和数字无障碍\n- 心理安全\n- 文化和语言尊重\n- 经济和时间相关可用性\n- 感官和认知上的轻松\n\
  \n这在实践中的含义是理解可访问性是一种关系。它会根据房间里的人、被提出的问题以及权力如何在空间中流动而发生变化。我们的工作是塑造研究空间，让人们能够以感觉可行、安全且有意义的方式出现。这不会偶然发生。它需要准备、灵活性，以及在我们\
  \ ever 要求某人分享其见解之前建立信任的意愿。当我们以此为先导时，可访问性就不再是复选框或功能，它成为一切建立的基础。\n\n在数字空间中，我们了解到无障碍不仅仅关乎某物是否能正常运行；它关乎它是否感觉可用、尊重且安全。研究亦然。当实践变得剥削性，即使出于好意，我们也在复制我们声称要解决的伤害本身。当人们被视为数据点，当他们被要求在没有关怀或互惠的情况下重新打开伤口时，我们不是在实践包容，我们是在表演包容。\n\
  \n这种工作并不快。它也不整洁。但它非常人性化。它有意地移动得更慢。它提出不同的问题：\n\n- 人们能否以尊重其需求的方式充分参与？\n- 他们是否感到安全、被看见且有资源，而不仅仅是被邀请？\n\
  - 他们的见解是否会塑造下一步，还是仅仅填满一页幻灯片？\n- 我们是否尊重他们贡献的成本，还是仅仅收集它？\n\n这些不仅仅是价值观，它们是工作条件。当我们命名可访问性、信任或关系性关怀时，我们也在命名设计支持它们的<|message|>\
  \ 研究系统的责任。以下各节并非旨在提供完美的答案，而是要从内而外地转变我们对待包容性研究的方式。因为包容性不是交付物；它是一种存在方式。在我们收集见解或验证已构建的内容之前，我们需要问：我们是在创造空间，还是仅仅占据它？\n\
  \n本章有意对你提出很多要求，因为包容性研究不仅仅是一个清单或更好的流程；它是一种思维转变。某些部分可能感觉抽象、混乱或缓慢。这是出于设计。但贯穿始终，我将反思与实践配对，因此即使是最无形的时刻也伴随着有形的工具。\n\
  \n在本章中，我们将探讨以下内容：\n\n- 为包容性研究招募多元参与者\n- 为无障碍调整研究方法\n- 分析来自多元用户群体的定性数据\n- 将研究见解转化为包容性设计解决方案\n\
  \n这些实践不仅让产品变得更好，它们让流程变得更公正、更人性化，并更符合我们试图构建的未来。\n\n\n\n\n\n##### 招募多元参与者以实现包容性研究\n\
  \n让我们从一个简单但并不总是容易的事情开始。\n\n如果你之前参与过研究，请回想一下过去的招募工作。谁出现了？谁没有出现？为什么会这样？这是一次反思的邀请，而不是评判。你应该诚实地面对我们继承的模式和我们重复的习惯。系统性障碍塑造了排斥。但它们也由我们日常的选择所维持，我们认为谁是“可触达的”，以及我们如何邀请、补偿，并在人们到来后如何回应。\n\
  \n太多的情况下，包容性招募被视为太难、太小众、太慢。但这些信念不仅限制了我们能触达谁；它们也限制了我们认为可能实现什么。\n\n包容性研究要求我们暂停，给予关注，并且是有意地去做。请自问以下问题：\n\
  \n- 你是否得到支持，能够以信任的速度推进，即使时间表要求更快？\n- 在快节奏的现实中，你在哪里可以为更深入的参与留出空间？\n\n可及性并不始于会话；它在第一次请求之前很久就开始了。作为致力于包容性的研究者和设计师，我们必须调整我们的方法。传统的招募往往反映了我们声称要挑战的同样的系统性不平等，过滤掉了那些本可以改变我们构建什么、如何构建以及为谁构建的见解的人。如果我们想要做得更好，我们需要重新思考我们如何邀请人们参与，而不是作为事后考虑，而是作为工作的开始。我们必须调整研究方法，以尊重参与者的生活现实、偏好和需求，而不是期望他们去适应为无障碍规范设计的传统研究协议。\n\
  \n###### 重新思考招募作为一种关系实践\n\n如果我们认真对待研究中的公平，我们需要停止把招募当作一项打勾的任务，而开始将其视为一种关系实践。其核心，这不是招募。这是关系建立，以尊重为根基，以关怀为指导，以信任为承载。残障参与者常常将研究体验为剥削性的、不可及的或表演性的。转向关系实践不仅仅是最佳实践；它是赢得信任并将公平融入我们参与方式的必要条件。\n\
  \n在我们建立招募实践时，继续自问以下问题会有所帮助：\n\n- 我们的材料是否可及？\n- 我们是否公平地补偿了时间、精力和情感劳动？\n- 我们是否在研究过程中建立了关怀和安全保障体系？\n\
  - 我们是否在请求见解之前建立了关系？\n- 我们是否使用的是值得信赖的社区渠道，还是仅仅使用那些容易触达的渠道？\n- 我们是否完成了闭环，并展示了反馈如何塑造了结果？\n\
  - 研究结束后我们是否建立了问责制？\n\n这些不是附加项。它们是建立在互惠、互惠和协作而非剥削基础上的研究文化的基石。\n\n补偿也是我们表达尊重的一种方式。当我们要求人们分享他们的时间、精力或生活经验，尤其是当这些经验受到伤害或排斥塑造时，我们需要认识到这对他们意味着什么。公平、灵活的报酬不是形式；它是我们表明他们贡献重要的方式之一。\n\
  \n###### 超越代表性：从边缘设计\n\n代表性关乎与人们在世界中移动的全部复杂性一起设计。尤其是那些被推离“快乐路径”的人——理想化、简化的用户流程，假设稳定的可及性、规范行为和很少的变化。\n\
  \n被视为“边缘案例”的参与者，那些需求或经历不符合假设规范的人，往往揭示了系统失效之处。他们的经历浮现出他人看不到的摩擦。从边缘设计会加深，而非缩小我们所构建的东西。他们是信号承载者。当我们认真对待这些信号时，我们不是在缩小体验，而是在加深它。\n\
  \n一个神经多样性参与者可能不是因为流程不清晰而感到困惑，而是因为它要求他们没有的能量。这不仅仅是布局问题，而是过载、感官输入和模式复杂性。当我们专注倾听时，我们开始理解的不仅是出了什么问题，还有为什么。\n\
  \n研究往往过度聚焦于最容易触达的人：拥有稳定网络、高数字素养以及对研究规范感到舒适的人。但这过滤掉了那些本可以改变我们构建方式的观点。包容性研究要求我们保持复杂性，而不是将其扁平化，尤其是在研究残障和可及性需求时。太多的情况下，残障研究被视为补充性的、轶事性的，或被简化为更广泛研究中的统计切片。这忽略了生活经验的细微差别，并抹去了变化、模式和文化背景。\n\
  \n我们必须建立反映真实、变化且分层的生活的系统，其成果足够灵活，能够容纳人们的现实——这些现实是非线性的、动态的，并且极具人性。\n\n包容性招募没有通用的清单，也没有保证关怀、互惠或信任的逐步公式。但有我们可以不断提出的问题、可观察的模式和可以反复实践的做法。将此视为不是处方，而是起点——可在你的情境中重新审视、重塑和构建。考虑以下问题：\n\
  \n- 我是否让社区成员参与塑造研究过程？\n- 我的招募材料是否可及（语言、格式、传递方式）？\n- 我是否使用了值得信赖、文化相关的渠道来分享机会？\n-\
  \ 我的补偿是否反映了参与者的时间、努力和生活经验？\n- 我是否提供了多种参与方式（同步/异步、口头/非口头）？\n- 我是否通过分享成果或更新来完成闭环？\n\
  - 我是否尊重了与种族、阶级、性别、语言或地理交叉的可及性需求？\n- 我是否在时间、精力和参与边界方面建立了灵活性？\n- 我是否在会话中为停顿、情绪或非线性表达留出了空间？\n\
  - 参与者是否在塑造问题，而不仅仅是回答问题？\n- 如果这个过程被逆转，我会感到安全、受尊重和被重视吗？\n\n重要的是在情境中深思熟虑地应用它们，并具有适应的灵活性。当我们与受影响最大的人一起设计，而不仅仅是为他们设计时，我们创造的系统会更加公正、更具适应性，也更有生命力。这不是关于表面修复。这是关于拒绝默认。这是关于在人们所在之处与他们相遇，承载他们所承受的东西，并让它塑造我们构建的方式。这是关于尊重数据背后的人性。最具变革性的见解并不存在于平均值中。它们存在于边缘。\n\
  \n当然，你不会总是做对。但包容性不是清单，而是一种实践。重要的是我们一次又一次地选择它。\n\n###### 通过互惠招募以残障生活为中心\n\n招募残障参与者不仅仅关乎包容，更关乎改变参与的条款。当我们在招募中以残障生活为中心时，我们开始挑战关于如何、何时以及在何处引入人们的未言明假设。招募往往是交易性的：时间换礼品卡，见解换交付物。但当研究止步于此时，它就有可能变得剥削性。这会让人们感到被利用，而不是被重视。\n\
  \n互惠招募要求我们付出更多。它要求我们放慢脚步，在请求之前建立信任，并创造人们能够充分出现的空间，不仅是回答问题，而是塑造问题。这意味着邀请人们不是作为研究对象，而是作为合作者。这也意味着认识到知识并不只存在于文字记录中。它也存在于宁静、呼吸、绘画、相互理解的瞬间中。例如，一个与聋人社区合作的团队与当地聋人倡导团体共同设计了研究计划，聘请了由参与者选择的口译员，并允许在多次会话中灵活参与。结果不仅仅是更好的数据，而是一个尊重、可持续参与的模式。\n\
  \n虽然招募总涉及某种交换，但它不必是剥削性的。当它以信任和互惠为基础时，它从单向交易转变为共同投资。它是关系性的。它将我们的目标从参与转变为伙伴关系，从收集见解转变为构建回馈的东西。\n\
  \n为了支持这一转变，以下是指导包容性招募实践的几个基础原则：\n\n- 在招募前建立关系。从信任开始，而非外联。\n- 公平灵活地补偿。尊重时间、精力和情感劳动，以反映人们的现实。\n\
  - 尊重交叉性。理解重叠因素，如残障、种族、性别、阶级和语言，如何塑造人们的经历并影响他们感到安全和受支持所需的条件。例如，一个在城市中心生活的白人轮椅使用者很可能面临的障碍与一个生活在农村地区的种族化自闭症人士截然不同。交叉性提醒我们，可及性永远不是一刀切的；它受到重叠的权力、歧视和特权体系的影响。包容性研究必须考虑到这些分层现实，否则就会强化我们试图弥合的差距。\n\
  \n\n\n\n\n- 共同设计流程，而不仅仅是产出。从一开始就分享权力。\n- 避免剥削性动态。这意味着要超越脚本化的问题和一次性参与。当我们把参与者当作数据来源而不是人时，我们就冒着商品化他们生活经验的风险。\n\
  \n与其期望大家来找我们，不如去他们那里。倾听、回访，并以诚信出现，不是一次，而是随着时间的推移。我们无法远程共创。这就是为什么一些最扎实、最尊重的研究是通过与已经拥有信任的社区建立伙伴关系而进行的，例如倡导团体、文化组织和草根网络。\n\
  \n一个有力的例子是，在我与一群残障和神经多样性参与者的研究参与中，我与一个草根倡导团体合作，从一开始就共同设计招募流程。我们没有使用正式的知情同意书或标准的筛选脚本，而是共同开发了简明语言材料。参与者不仅帮助确定了无障碍需求，还确定了他们希望如何参与，提供诸如语音备忘录、绘画、异步参与或感官友好格式等选项。我们根据人们偏好的方式和精力水平给予报酬，中途退出也不会受到惩罚。口译员和支持人员是应参与者要求而非我们要求被邀请。结果不仅仅是更诚实的洞察——而是一种建立在信任基础上的更深层次的关系，参与者能够影响研究本身，而不仅仅是对其做出回应。\n\
  \n这种方法体现了以下几点：\n\n- 细致而协作的规划\n- 灵活性和自主权\n- 拒绝一刀切的参与方式\n- 相互尊重和可及性作为起点，而非附加项\n\n\
  这种互惠并非理论上的；它正在现实项目中实践，这些项目与残障参与者分享权力并重视他们的方式。\n\n这个例子不仅仅是我记忆中的一个瞬间，而是重塑了我工作方式的多个瞬间。我分享它们并非为了规定，而是帮助他人在自己的生活中认识到这些时刻。包容性研究的成果体现在这些转变中——体现在我们如何倾听、我们注意到什么，以及我们如何将其向前推进。\n\
  \n在下一节中，我们将探讨如何为无障碍调整研究方法，塑造的不仅是我们能触达谁，更是我们如何倾听、参与，以及构建尊重复杂性、支持参与并以信任的速度推进的研究环境。\n\
  \n##### 为无障碍调整研究方法\n\n调整研究方法不仅仅是一个技术挑战；它深具人性。如果我们认真对待以残障生活为中心，我们就不能只是安排一个会议然后希望一切顺利。我们需要在提出请求之前做好工作，以确保我们的方法、工具、时间线和结构是可用、灵活且安全的。\n\
  \n参与从来不是中立的。对于许多残障参与者来说，出现本身就是一种脆弱性的体现，这种体现受制于被排除、被误解或被期望在没有支持的情况下适应的历史。研究提取、简化或遗忘的悠久历史一直存在。慷慨分享的经历太多次都遭遇了沉默。\n\
  \n我记得职业生涯中有一个时期，我在一支主要由残障人士组成的团队工作。我的三位同事是盲人或视力低下的，每个人在数字世界中的导航方式完全不同：\n\n- 一位使用高对比度模式并将所有内容放大到\
  \ 800%，依赖屏幕放大和视觉提示，而不是屏幕阅读器。\n- 另一位出生时就失明，使用屏幕阅读器配合盲文显示器，以线性、精确的方式处理内容，对空间定向需求不大。\n\
  - 第三位在 30 岁时失明，也使用屏幕阅读器，但仍以视觉隐喻为锚点来理解数字布局，基于肌肉记忆和残余视力，认为事物应该在屏幕上的某个位置。\n\n这不是理论上的洞察。我亲眼所见：三位盲人同事，一个团队，三种完全不同的导航方式——相同的残障标签，却有不同的时间线、工具和真相。\n\
  \n这改变了我对无障碍的理解。它明确表明没有“通用用户”，也没有唯一正确的参与方式，并提醒我适应不是可选项，而是基础。这就是为什么我们不能仓促进行研究，为什么“最佳实践”并不总是最佳，以及为什么信任不是在签署时建立，而是在微小决策中建立：我们如何出现，我们如何提问，我们如何营造空间。\n\
  \n当参与者被视为合作者而非研究对象或数据点时，被重视的感觉会加深——当他们的故事塑造工作而不消失在文件夹中时。而且当我们跟进时，这种感觉才会真正持久——当人们能够追溯他们提供的东西与因此而改变的东西之间的联系时。\n\
  \n这就是为什么无障碍不能是事后考虑。它必须从一开始就融入其中——不仅在工具或时间线上，更在我们如何倾听、如何跟进以及如何尊重所分享的内容中。\n\n#####\
  \ 创建更安全、更有赋权的调研空间\n\n心理安全不是锦上添花，而是伦理研究的基石。当我们邀请人们分享生活经验，尤其是那些受排斥、伤害或边缘化塑造的经验时，我们要求的是脆弱的东西。这种分享如果没有相互尊重就无法发生。\n\
  \n建立信任不会偶然发生。它需要意图。这意味着确保人们感到被倾听、被尊重，并且足够安全，可以在没有评判或否定恐惧的情况下表达真理。不仅仅因为这是良好实践，而是因为这是尊重所提供之物唯一的方式。\n\
  \n这表现为在我们知道某个话题可能唤起痛苦记忆时提供内容警告。这表现为给予参与者完全的许可跳过问题、休息或完全离开。这表现为命名其中涉及的情感劳动并以开放态度回应。\n\
  \n跟进很重要。有时，这意味着分享资源，例如当地心理健康服务、残障同伴团体或简明语言的后续材料。有时，这意味着提供支持形式的回访信息、回应参与者反思，或确保会议之外有可信赖的联系人。\n\
  \n我们作为研究者，必须放下紧迫感，或至少质疑哪些紧迫感是自我强加的，哪些是真正不可移动的。我们可能无法放慢每个截止日期，但我们可以选择在我们能控制的决策和我们寻求分享的叙事中以关怀为中心。\n\
  \n以需求的速度推进意味着适应人们的生活节奏。这意味着知道精力会波动——疼痛、疲劳、照顾责任、脑雾或倦怠不会遵循我们的研究日历。这不仅仅是提供灵活的日程或为幻灯片添加替代文本。这意味着认识到可及性不是固定的。它会变化，我们也必须随之变化。\n\
  \n以文本为基础的线框图就是一个简单的例子。对于仪表板，这可能看起来像一个描述屏幕上内容的线性叙述：“顶部是一个搜索栏。下面是两个并排的面板：左侧显示最近文件，右侧显示项目协作者。”没有视觉。没有图层。只是一张由文字构成的地图。这是一种为处理方式不同的人创造空间的方式，\n\
  \n记住，共创绝不应以牺牲某人的身体、能力和福祉为代价。太多时候，研讨会要求人们“全程在线”数小时，假设他们有耐力、安静、结构和持续的专注力。但这种模式让太多人被排除在外。而这不必如此。\n\
  \n当我们消除参与障碍时，我们不仅创造更多空间，更创造了人们感到被看见的条件。当人们感到被看见和被支持时，他们会更充分地参与。\n\n它提出了更深层次的问题：\n\
  \n- 当某人的网络不稳定，或他们的时区使“标准时间”无法使用时会发生什么？\n- 感官敏感性如何影响某人参与的能力？\n- 需要做些什么才能创造一个环境，让人们在整个过程中而不仅仅是一次感到心理安全地分享他们的真理？\n\
  \n当我们为灵活性设计时，我们转移了可及性的负担。我们不再要求参与者为了适应僵化的系统而勉强自己。相反，我们作为研究者、引导者和设计者，承担责任去迎向他们。\n\
  \n这就是提供可及性和实践公平之间的区别。一种只是把门打开。另一种是重新打造房间。\n\n##### 即使资源紧张，包容性研究在实践中\n\n并非每个团队都有资源、资金、时间或人力来一次性实施每项包容性研究建议。但包容性研究不是全有或全无；它是通过持续、有意的选择建立起来的。包容性研究不必等待许可、完美时机或下一个财政周期。在你现有的地方，用你拥有的东西，有一些小方法可以开始，同时坚守你的价值观。让工作不完美且在进行中。以下是一些小小的转变，即使在资源受限的环境中也能推动你的实践向前：\n\
  \n首先，从小开始：\n\n- 在招募材料中使用简明语言。它不花钱，还能提升可及性。\n- 提供异步参与（例如电子邮件、语音备忘录）——非常适合神经多样性或时间受限的参与者。\n\
  - 与 1-2 名来自投资不足群体的参与者进行试点。并不理想，但比完全缺席要好。\n\n\n\n\n\n- 在你的筛选器或介绍邮件中创建一个“信任提示”。提问：“你需要什么才能感到舒适地参与？”\n\
  - 预算 50 美元用于互助。给某人买一张公交卡、一顿饭或一个保姆，让参与成为可能。\n- 分享研究结果。简短的感谢邮件和你学到的内容的要点列表可以闭环并建立信任。\n\
  - 将同意视为一次对话。即使在开始前进行 30 秒的口头确认，也会与正式的豁免书感觉不同。\n\n另外，充分利用你已有的资源：\n\n- 重新分配你现有时间的\
  \ 5-10%。用它来改善入职流程、反馈循环或协议的可访问性。\n- 查看现有工具。你能否将包容性融入已在使用中的工具或流程中（例如带有替代文本的 Miro 白板）？\n\
  - 邀请社区合作伙伴审阅你的计划。来自值得信赖的声音的一次快速异步审阅可以重新构建假设。\n\n当你无法做到一切时，你必须问自己，在你所处的环境中，减少排斥的最小改变是什么。即使是一个选择也能建立累积的信任。你不需要完美的条件就能朝正确的方向前进。\n\
  \n##### 提供灵活的沟通方式\n\n并非每个人都能按时出现。患有慢性疾病、神经多样性、残疾或只是生活重担的人，并不总是直线前进。精力时有时无。专注力会减弱又恢复。疼痛会发作。照顾责任会转移。对此没有整洁的日程安排。\n\
  \n然而，研究会议往往像小型的表演一样构建：时间块紧凑、格式固定、存在不言而喻的压力，要求保持在场、保持连贯、保持有用。是的，时间、能力和预算都是真实的限制。但排斥的成本、糟糕的数据、脱节的解决方案或整个社区被排除在外也是如此。更具包容性的做法并不总是花费更多，有时只需要我们注意到什么是可能的。\n\
  \n包容性方法首先要放弃那种僵化。让人们重新安排时间，不带内疚。将较长的会议拆分为较小的部分。让放慢脚步、稍后再回来、选择休息而不是硬撑成为可以接受的事。另外，请记住，人们并不总是以我们预期的方式参与，这不是问题。这正是重点。\n\
  \n对于一些人来说，参与意味着写作而不是说话，尤其是在即时交谈困难时，或语言本身感觉像障碍时。其他人可能需要更多时间，并不是因为他们心不在焉，而是因为他们的精力是波浪式的。疲劳、疼痛、倦怠和脑雾——这些都不会遵循研究日历。参与不是线性的。\n\
  \n这就是为什么包容性研究不能只提供一条进入路径。它需要提供选择。真正的选择。这可能意味着以下内容：\n\n- 在直接进入对话之前，提前发送几条书面提示\n-\
  \ 邀请那些更喜欢口语而非打字的人发送语音备忘录\n- 使用异步工具，如共享文档或消息线程\n- 为需要与生活节奏相匹配的节奏的人提供更长的时间框架\n- 让人们可以选择电话而不是视频，尤其是在技术或精力有限的情况下\n\
  - 如果一对一对话有助于减少不知所措的感觉，就使用一对一对话而不是群组通话\n- 将说明或原型保留为纯文本，而不仅仅是图像或幻灯片\n- 在现场会议期间为处理、停顿或休息留出空间\n\
  \n这些不是“辅助功能”。它们是基本的尊重表现。当我们停止强迫每个人都通过同一个狭窄的门时，我们开始听到更诚实的反思——那些不必强忍不适才能浮现的反思。获取途径不仅仅关乎某人是否能到场，更关乎他们是否以一种不会让他们付出超出能力的方式被欢迎。\n\
  \n##### 与参与者闭环\n\n建立反馈循环对于在包容性研究中保持问责至关重要。参与者需要看到他们的经历如何影响产品开发，才能信任研究过程。\n\n在法律上或实际操作上可行的情况下，定期的研究后更新和持续的总结有助于闭环。即使无法分享完整的产品更新，一封简单的后续邮件总结参与者贡献了什么以及团队学到了什么，仍然可以证明他们的声音很重要。\n\
  \n包容性研究不仅仅关乎邀请谁参与；它关乎确保他们的贡献带来真正的改变，强化关系完整性，并在研究人员与研究参与者之间培养长期关系。\n\n包容性招募不仅仅关乎我们邀请谁；它关乎我们在整个过程中如何与参与者互动。残疾参与者和边缘化社区往往在研究空间中承担情感劳动和脆弱性。他们分享被排斥和伤害的个人经历，我们有责任确保他们在研究结束后感到被看见、被倾听和被重视。\n\
  \n以下是如何将关怀和安全系统嵌入你的研究实践中：\n\n- 在会议前后提供情感检查\n- 提供心理健康支持或社区关怀资源\n- 确保可访问的沟通渠道以进行持续的信任建设\n\
  \n确保参与者在会议后可以跟进以提问、提供反馈或表达担忧。提供包含研究结果摘要和下一步的后续邮件，有助于参与者看到他们的贡献如何产生影响。残疾参与者在参与研究时往往会重温排斥性经历，这在情感上会很消耗。\n\
  \n##### 研究作为一种动态且以人为本的实践\n\n正如你所见，包容性研究不仅仅关乎改进我们的方法；它关乎重新思考我们的外联方式。它关乎从提取转向协作。从征求意见到与之共同构建。目标不是收集故事然后归档。它是确保这些故事带来真实的东西——重要的东西。\n\
  \n共同设计测试意味着让参与者不仅参与产品评估，还参与塑造研究方法本身，例如决定探索什么问题、为哪些无障碍需求做计划、或从他们的角度来看成功是什么。\n\n当我们通过灵活参与、共同设计测试、创伤知情实践和情感安全的空间将无障碍嵌入研究流程时，我们不仅仅是在增加严谨性。我们让工作更具人性。我们移除了人们通常被期望仅仅为了被听见而克服的摩擦。\n\
  \n但这不是终点。\n\n一旦洞察到来，我们必须带着同样的能量、同样的问责，投入到我们如何理解所听到的内容中。包容性研究并不止于参与。它体现在我们如何解读、如何容纳复杂性，以及我们在不过度简化的情况下如何注意到模式。\n\
  \n它也体现在我们如何抵制长期塑造什么是“有效”、“有价值”或“客观”的主导叙事。研究以关怀开始，应该以问责结束。那里才是意义所在，也是改变可以生根的地方。\n\
  \n在下一节中，我们将探讨分析定性数据意味着什么，以尊重完整背景为中心、关注 lived experience，并为更诚实、更公平地理解当我们认真倾听时真正浮现的内容打开空间。\n\
  \n##### 分析来自不同用户群体的定性数据\n\n数据并非中立。每一段研究数据都承载着其背景的重量、其收集方法的偏见，以及提供数据的那些人的 lived realities。我们必须超越表面，深入到数据中的人性故事。我们在数据集或代码中包含的内容直接影响我们得出的结论和采取的行动。当我们分析来自不同用户群体的定性数据时，我们必须以谦逊、理解和对潜在权力动态的认识来对待。\n\
  \n在分析边缘化社区的数据时，要理解你自己的偏见可能如何影响解读。为了帮助平衡这一点，我们需要优先考虑参与者的声音，而不是我们的假设或信念：\n\n- 有时我们直接询问身份（种族、残疾、性别或收入），因为这是我们的招募目标或伦理义务的一部分。\n\
  - 其他时候，参与者选择分享什么，我们并不总是拥有全貌。\n- 这两种现实都会塑造我们如何分析。当身份被命名时，我们获得了更多解读的背景。当它们没有被命名时，我们必须小心不要默认单一问题的视角。\n\
  - Lived experience 是分层的。对屏幕阅读器挫败感的引述也可能承载着经济不稳定、文化不信任或系统性忽视的重量。\n- 交叉性并不意味着我们必须解码一切；它意味着我们要意识到人们并不只带着一个故事出现。例如，一个有视力相关残疾的人也可能是单亲父母或\
  \ 2SLGBTQ+ 社区的一员（“2S”的使用承认了原住民对性别和性取向的理解，这些理解在主流框架中经常被抹去）。所有这些都会塑造他们的经历以及他们如何 navigating\
  \ 世界。\n- 研究中的反思性意味着为我们所看到的复杂性，以及我们未看到的复杂性，留出空间。\n\n\n\n\n\n当我们为被投资不足的社区收集数据时，我们不仅仅是在收集信息；我们收集的是由他们复杂的身份塑造的集体经验。这些交织的身份以无法\
  \ neatly 归类到单一人口统计框的方式塑造了他们的经历。然而，太多时候，研究成果将这些经历简化为快照，通过将其压入整洁的形状而没有细微差别。\n\n#####\
  \ 神经多样性作为方法： lived experience 如何改写规则\n\n我曾经以为研究必须看起来是某种样子：从容、准备充分、结构完美。但那种版本的研究往往把我的身体抛在了后面。作为一个\
  \ ADHD 者，我的大脑并不线性运作。它更像一个星座，随意地放大缩小。它会过度聚焦于他人错过的模式，然后在感官输入过多时崩溃。那曾经感觉像是一种负担。现在，它是我最信任的指南针。\n\
  \n这就是为什么我在主持时要加入长时间的停顿。这就是为什么我提供异步选项。我会提前发送问题，不仅仅是为了参与者，也是因为我知道这对我以自己的方式参与有多大的帮助。我已经不再认为好的研究是快速、整洁或中立的。与我共存最久的那种研究，那种留在我骨子里的研究，是那种为缓慢、为不知所措、为迷失方向留出空间，同时仍然保持倾听的研究。\n\
  \n研究之后有一个时刻，节奏往往会加快。综合。报告。行动。但如果我们在这里急于求成，我们就会错过真正重要的东西：我们如何承载人们给予我们的东西。\n\n这部分，解释，并不仅仅关乎主题或编码。它关乎意义。而意义并不干净。它是多面的。它自相矛盾。它伴随着中断、犹豫，以及在文字记录中并不总是显现的情感重量。\n\
  \n在许多研究空间中，主题分析变成了一种压缩的过程，将混乱的东西整理干净，以便“对别人有意义”。但在包容性研究中，我们不能负担得起把一切都抚平。我们需要为矛盾、为多重真相、为那些无法轻松放入墙上便利贴的东西留出空间。\n\
  \n尤其当我们在倾听残疾人士或 navigating 层层身份的人时，他们分享的内容来之不易。它是由多年的摩擦、适应和被误解塑造的。所以当我们分析这些数据时，我们必须问：我们是在创造意义，还是在抹除它？\n\
  \n我们知道权衡：时间有限、预算紧张、制度障碍。并非每个项目都允许彻底改变。但每个项目都允许一些东西。而这些东西会累积起来。\n\n##### 意义建构的责任\n\
  \n仅仅见证他人提供的东西是不够的，我们必须考虑我们如何解读这些东西。太多时候，洞察在分析中被扁平化，简化为剥离了上下文、情感和细微差别的引语。但包容性研究要求我们更多。它要求：我们如何承载意义？我们对人们信任我们承载的真理做了什么？这种解释不能被催促或保持中立。它必须是关系性的、反思性的，并且对权力有深刻的觉察。\n\
  \n因此，我回到几个指导我工作的核心问题：\n\n###### 我们是否以反映所分享内容的分量方式进行解释？\n\n有一次，一位参与者分享说，他们停止使用我们产品的一个关键功能，因为它与他们的屏幕阅读器不兼容。之前的迭代对他们来说是可访问的，他们觉得自己失去了赋予他们自主权和自主性的东西。他们描述了因\
  \ constantly 需要寻找变通方法而感到尴尬和精疲力竭。他们说话很直白——几乎就像不值得一提，并且像他们期望没有任何改变一样。但我们知道那种感觉：当又一个功能对曾经依赖它的人变得遥不可及时所带来的失望。相反，我没有将其记录为\
  \ bug 或“边缘案例”，我与团队一起将其视为排斥的信号。我们将这一洞察重新定义为设计原则：“如果一个人无法使用它，那么没有人能完全使用它。”这不仅仅是技术修复；它提醒我们，可访问性关乎尊重，而非合规。它塑造了我们在整个产品中优先考虑变更的方式。\n\
  \n我把像这样的故事作为身体记忆来承载——不仅仅是研究库中的笔记或标签，而是在某人说“我以前从未被这样问过”之后的那种安静沉重。这种诚实不属于幻灯片。它值得尊敬。它值得以这样一种关怀来承载：你的真理不仅有效，它是我们应该从中构建的视角。\n\
  \n对我来说，解读数据从来不是关于把引语分类到整洁的桶里。它是关于倾听脉动其下的东西。他们没能完全说出的东西。他们信任我去感受的东西。这意味着我问自己，而不仅仅是数据，如果我们有勇气与之共处，这是在试图教我们什么？\n\
  \n###### 我们是否保留了情感、文化和系统性背景，而不仅仅是引语？\n\n作为一名神经多样性的研究者，我在掩饰、爆发、循环的同时出现，在我的系统超负荷时仍尽力为他人提供空间。而我采访的人也做了同样的事。他们回答得精确，但声音里带着疲惫。他们的犹豫承载着比语言更多的东西。我学会了关注这些层面：塑造某人说话方式的文化背景，他们带入房间的系统性重量，一个单一故事往往代表了许多其他故事。我们不需要更多听起来不错的引语。我们需要一种解释来尊重它们产生的条件，并在过程中拒绝抹除它们。\n\
  \n在一个环节中，一位参与者一直很投入也很开放，直到我问到他们与支持服务过去经历的问题。他们安静了下来。不是突然，只是……向内。眼睛向下，语气转变，随后是一个简短的回答，然后我们继续。我没有将其标记为“参与者脱离”或丢弃该数据点。我做了笔记：“此处语气改变，待复查。”\n\
  \n后来，在综合阶段，这一时刻帮助塑造了关于研究环境中情感安全性的更广泛洞察，尤其是在询问人们可能曾受其伤害的机构时。它提醒我要构建创伤知情的提示，在追问前等待，并不仅通过所说的内容来阅读数据，而是通过某些事情停止的地方。\n\
  \n这段经历改变了我撰写协议的方式。在后来的研究中，尤其是在与残疾和神经多样性参与者合作时，我开始在问题之间加入明确的停顿，并添加可选的“跳过”按钮或提示，例如“这是你今天愿意谈论的事情吗？”\n\
  \n我还开始反思研究的感觉，而不仅仅是分享的内容。这揭示了模式：哪些话题导致撤退，哪些格式感觉更安全，以及人们在异步后续中比在现场环节中更愿意敞开心扉。\n\n\
  这些调整不仅仅是为了参与者的舒适；它们带来了更丰富、更诚实的数据。这些小的设计改变——提供选择、命名情感劳动、避免立即追问——帮助将权力重新交还给分享者。我学到的是，沉默是反馈。当我们倾听它时，它教会我们如何设计研究来赢得，而不是要求，人们的信任。\n\
  \n###### 我们是否为与我们假设不符的故事留出了空间？\n\n有时，人们会留下空白的问题。不是因为他们不在乎，而是因为他们在乎。因为太接近，太多，或太累于再次解释。我已经开始将这视为数据。模糊不是失败。那些矛盾或抵抗整洁弧线的披露往往是我最信任的。它们提醒我：这不是关于清晰，而是关于复杂性。如果我们的系统无法承载这一点，也许是系统需要改变。\n\
  \n负责任的解释不是被动的。它是一种作者身份。它塑造了什么被构建、被相信、被支持。我们不仅仅尊重故事，我们参与重塑使它们难以讲述的条件的本身。\n\n如果你在想这在实践中是什么样子，那就是重点。这项工作要求我们与没有简单答案的东西共处。但这并不意味着它不能具有可操作性。本章后面，我提供了切实的方法、招募方法、可访问性提示和综合策略，帮助我们在不将其崩溃的情况下承载复杂性。\n\
  \n当我们分析定性数据时，我们需要关注的不仅是说了什么，也是如何分享的。有人犹豫了吗？跳过问题？沉默？这些不是空白，它们是信号。标记它们。跟进。利用它们来抵抗围绕残疾、创伤或排斥的复杂性往往被打磨掉。\n\
  \n有时，洞察并不是以清晰的方式到来。它是以重量到来。我们的任务不是提取它，而是承载它。承载某人托付给我们的东西，即使他们没有说出口。当这种情况发生时，不要急于定义或解决它。标记它。回到它。让它停留足够长的时间以揭示它在要求你什么。并非一切都以干净的线条或整洁的引语说话。有些真理悄然到来，要求我们在决定它们意味着什么之前多陪伴它们一段时间。\n\
  \n##### 动态数据在流动的世界中\n\n包容性不仅仅关乎谁坐在桌边；它关乎意义是如何被创造的，以及谁的真理被允许塑造系统。在研究中，我们持有数据的方式永远不是中立的。我们优先考虑、丢弃、聚合或解释的内容反映的不仅是我们学到了什么，还反映了我们以谁为中心，谁被我们忽视。\n\
  \n正如数字人类学家 Payal Arora 所提醒我们的那样，全球数字叙事往往忽视了多数世界的非正式、适应性和混乱的 lived realities。包容性设计的先驱\
  \ Jutta Treviranus 敦促我们将包容性视为不仅仅是\n\n\nexception-handling, but as the root of meaningful\
  \ innovation. Both challenge the tyranny of the average and call us to treat difference\
  \ as a starting point, not an afterthought.\n\nStill, research often falls into\
  \ familiar analytic traps:\n\n- **Insight isn’t static:** The trap here is time.\
  \ One session becomes the story. A single moment is mistaken for a fixed truth.\
  \ But needs are not static, especially for disabled, neurodivergent, or systemically\
  \ excluded participants. They’re shaped by shifting energy, evolving tools, and\
  \ changing contexts. When we freeze what we’ve learned in place, we design for what\
  \ was, not what’s emerging.\n- **From edge cases to systemic signals:** The trap\
  \ here is the discard. Outliers get framed as noise, deviations from the “norm,”\
  \ when they’re often the clearest signals of where systems are breaking. What seems\
  \ like friction for a few is often a flare for deeper design flaws.\n- **When insight\
  \ becomes harm:** The trap here is overreach. Group-level trends get applied to\
  \ individuals. Nuance collapses into generalization. Statistical discrimination\
  \ turns differences into stereotypes. This is how systems quietly replicate harm\
  \ under the guise of objectivity.\n- **Over-relying on dominant trends:** The trap\
  \ here is overrepresentation. What’s statistically common often reflects the most\
  \ reachable participants, not the most excluded. When we treat the average as truth,\
  \ we marginalize the very perspectives and lived knowledge that could drive meaningful\
  \ change.\n- **Flattening nuance into categories:** The trap here is forced coherence.\
  \ Thematic analysis can tidy up contradiction and tension, but lived experience,\
  \ especially at the margins, rarely fits cleanly. Instead of forcing coherence,\
  \ we can let complexity stand, treating silence as presence. Pauses, hesitations,\
  \ skipped questions – these are often signals, not gaps. They might hold fatigue,\
  \ mistrust, or truths that don’t fit our frameworks. Listening well means listening\
  \ between the lines.\n\nThese aren’t technical oversights – they’re decisions about\
  \ what we count as knowledge. These are methodological and interpretive choices\
  \ that shape what’s valued, validated, or dismissed in the process. They reveal\
  \ what we allow to count as valid knowledge, and what we’re still willing to overlook.\
  \ To move through them, we need to shift how we hold what’s shared – not as something\
  \ to extract, reduce, or resolve, but as something to stay in a relationship with.\
  \ Meaning lives in friction, contradiction, and refusal to be boxed in.\n\nInclusive\
  \ analysis refuses to resolve complexity too quickly. It lingers. It asks better\
  \ questions. It makes space for multiple truths. To move through these analytic\
  \ traps, we need more than awareness; we need methods that hold contradiction, tools\
  \ that don’t force consensus, and patterns of practice that slow us down when our\
  \ instinct is to simplify. Some ways to do this include the following:\n\n- Revisiting\
  \ findings over time, especially with participants from historically excluded groups\n\
  - Creating feedback loops that include participant check-ins and community sense-making\n\
  - Designing analysis frameworks that leave room for anomalies rather than collapsing\
  \ them\n- Making silence visible in datasets, not as a gap, but as a meaningful\
  \ flag\n\nUnderstanding alone doesn’t create change; it’s what we do with it, how\
  \ we push it forward, translate it, and let it reshape what gets built that determines\
  \ whether our research stops at understanding or moves toward impact.\n\nNext, we’ll\
  \ look at how to carry insights forward into design, not as inspiration, but as\
  \ a force for transformation, so that what we’ve heard shapes what gets built.\n\
  \n##### Translating research insights into inclusive design solutions\n\nTranslation\
  \ is where things often fall apart. Research gets done, what’s learned gets shared,\
  \ but nothing changes. Reports sit in folders. Findings get watered down into vague\
  \ “takeaways.” Product teams keep moving. And the real-world impact, the kind that\
  \ shifts experience, never happens.\n\nTo move from discovery to action, we have\
  \ to take on the role of translator – not just handing things off but bridging the\
  \ space between what was heard and what needs to be built. That’s not a handoff;\
  \ that’s reciprocity in practice.\n\nToo often, insights get treated like static\
  \ observations instead of something that should reshape the work. They get lost\
  \ in speed, in roadmap pressures, in the “we’ll get to it later” pile. But the point\
  \ of inclusive research isn’t just to name barriers. It’s to help remove them.\n\
  \nThis isn’t just about fixes. It’s about rethinking the patterns, defaults, and\
  \ assumptions we’ve let sit too long. What’s surfaced only matters if we carry it\
  \ forward. Otherwise, it’s just noise.\n\nThe stories shared so far aren’t side\
  \ notes; they’re the work. They show what it looks like to stay with discomfort,\
  \ to read beyond what’s said, and to let insight reshape the systems we operate\
  \ in. If we only collect data but don’t let it change us, we’re not practicing inclusion,\
  \ we’re performing it. Designing for both existing and future users requires flexibility.\
  \ Designing for now *and* what’s next.\n\n##### Insights as relationships, not output\n\
  \nCreating feedback loops where research findings are shared with participants builds\
  \ continuity and long-term engagement. We might experience this when a product designed\
  \ with blind users in mind might technically pass a WCAG compliance check, but if\
  \ real users struggle with its structure or interaction model, it’s still inaccessible.\n\
  \nWhen someone tells us where a system failed them, that isn’t feedback, it’s a\
  \ beacon. It’s a signal that says, “*This didn’t work for me, and I’m still here,\
  \ trying to help you do better.*” What we do next matters.\n\nWithout care, even\
  \ inclusive products can replicate harm. I’ve seen tools pass every compliance check,\
  \ yet still feel unusable. I’ve watched teams celebrate optionality, five ways to\
  \ do a task, but miss the point entirely because none of them truly meet people\
  \ where they are. That’s not flexibility. That’s noise. It’s the difference between\
  \ adding features and building alignment.\n\nBut that kind of connection doesn’t\
  \ happen by chance. It requires a system that carries insight across research, design,\
  \ and implementation, without losing its shape or soul. That’s where I bring in\
  \ a framework I’ve used across both public and private sector work. I call it *roots,\
  \ routes, refuge, and realities:*\n\n- **Roots:** Keep us grounded in community,\
  \ in history, in where this work comes from, and who it’s meant to serve\n- **Routes:**\
  \ Map how insight travels through sprint planning, design audits, and decision logs\
  \ so it doesn’t disappear in translation\n- **Refuge:** Creates space for care,\
  \ so that researchers, participants, and designers aren’t stretched to breaking\n\
  - **Realities:** Anchor us in what’s true, not what’s convenient, or clean, but\
  \ what’s actually lived\n\nI’ve used this model to compost insight—not to discard\
  \ it, but to let it break down, be absorbed, and feed the next season of work. This\
  \ happens when teams risk treating inclusive insight as transactional, or when the\
  \ most important feedback is too inconvenient to act on quickly. This isn’t a fix-all,\
  \ but it’s a rhythm.\n\nRemember, when someone shares how a system failed them,\
  \ treat it as a turning point not just a data point. How you hold that feedback\
  \ will shape whether they trust you, or anyone else, with it again.\n\n##### Designing\
  \ from disability, not for it\n\nInclusive design doesn’t begin with retrofitting\
  \ fixes onto broken systems; it starts by centering disabled people from the outset.\
  \ Voice input, for example, was originally built for accessibility, and now powers\
  \ mainstream tools such as Siri and Alexa. Designing from disability often leads\
  \ to innovations that benefit everyone.\n\nOne approach I’ve found useful is building\
  \ archetypes and mindsets rooted in lived experience – tools that reflect how people\
  \ actually navigate complexity, not just how we imagine they do. These frameworks\
  \ feed design patterns, usability heuristics, and decisions that respond to intersectional\
  \ needs.\n\nInsight is only powerful if it travels. What we’ve heard must shape\
  \ decisions, influence investment, and challenge the defaults that have long excluded\
  \ disabled users.\n\nTypically, research identifies the barriers, design starts\
  \ to build solutions, and the product moves forward with delivery, but those threads\
  \ don’t always weave into something whole. Misalignment happens. And when it does,\
  \ inclusion becomes performative instead of transformative.\n\nTo bridge that gap,\
  \ we need to work with new approaches – all of us. Researchers need to structure\
  \ observations in ways that are actionable and visible across teams. Designers need\
  \ to bring accessibility upstream, embedding it in systems, not just screens. Product\
  \ teams need to make space in their processes, in their priorities, for accessibility\
  \ to be part of the core build, not the backlog.\n\nThat means doing the following:\n\
  \n- Integrate accessibility into design systems, pattern libraries, and components\
  \ from the start, so it’s not a retrofit every time something new ships\n- Ensure\
  \ research insights inform product roadmaps, success metrics, and sprint planning\n\
  \nBut this isn’t work we do alone. Inclusive research is a collective practice –\
  \ intentional, ongoing, and relational. It requires collaboration across teams:\
  \ researchers, designers, engineers, product leads, and the communities we’re designing\
  \ with.\n\n\n\n\n\n##### 支持设计师将研究转化为可执行成果\n\n设计师工作于研究与执行交汇之处。要支持他们，我们需要能够将意图转化为具体行动的工具。许多人在流程过晚才收到研究主题和模式，使得实施基础的可访问性改进变得困难。其他人则缺乏清晰的可访问性和可用性指南，无法将研究转化为具体的设计决策。即使他们以包容的方式构建产品，也很少得到验证，证明其设计在真实使用场景中对多元用户有效。\n\
  \n为了更好地支持设计师将研究转化为行动，产品团队可以为他们配备实用、以证据为基础的工具，弥合意图与执行之间的差距：\n\n- 针对产品需求量身定制包容性设计指南\n\
  - 将参与者学习成果转化为可复用模式的设计系统建议\n- 反映真实用户行为而非仅人口统计学的体验旅程地图\n- 在发布前对设计进行压力测试的可访问性用户故事和验收标准\n\
  \n例如，仅说“行动障碍用户在使用小触控目标时遇到困难”是不够的。这可能是真的，但并不能为团队提供他们所需的不同设计依据。相反，研究人员可以通过推荐最小可点按尺寸、分享带注释的\
  \ mockup 以在上下文中展示可访问的交互，或提供使用真实工具、开关控制、语音导航和自适应输入测试过的原型来使其具体化。\n\n这种具体性赋予力量。它邀请团队参与解决方案。它帮助设计师从意识转向行动，给予他们清晰度和信心，以构建能够为更多人提供更好效用的方式。设计师是我们在此过程中最亲密的合作者之一。研究不仅为设计提供信息，还帮助重塑产品系统的底层默认值。包容性意图体现在我们共同工作的方式中。这就是我们从呼吁更好到将其构建出来，并使包容性生根的方式。\n\
  \n#### 总结\n\n本章追踪了包容性研究从意图到实施的路径，通过以关怀为基础的招募、以可访问性塑造的方法、尊重复杂性的分析，以及对真正所听内容做出回应的设计。\n\
  \n重要的是要记住，我们如何倾听塑造了我们构建的内容。当我们从掠夺性习惯转向包容性实践时，我们会发现最需要我们关注的摩擦，那种从中心看不到的摩擦。这项工作不会总是完美或完整。重要的是我们一次又一次地持续出现，带着愿意适应的意愿，即使在约束条件下也是如此。\n\
  \n在下一章中，我们将从研究转向界面，将可访问性嵌入到布局、对比度、导航和交互中，使包容性意图体现在每一个像素中，而不仅仅是原则上。\n"
- "# 第 2 部分\n\n## 为可访问性而设计\n\n在本部分中，你将从基础理论转向实际应用，配备构建可访问数字产品所需的工具和技术。这些章节探讨包容性设计原则如何转化为用户界面设计、内容创作、网页开发和移动体验。\n\
  \n你将学习如何在视觉设计、交互设计、语义 HTML、CSS、ARIA、多媒体内容以及 iOS 和 Android 等移动特定平台上应用可访问性最佳实践。\n\n\
  无论你是在设计色彩、构建 HTML、撰写替代文本，还是为触控和语音输入而构建，本部分展示如何创建对残障人士无缝工作的数字环境——对每个人都更好。\n\n本部分包含以下章节：\n\
  \n- 第 5 章，设计可访问的用户界面：视觉与交互设计\n- 第 6 章，创建可访问内容：写作、图像和多媒体\n- 第 7 章，开发可访问网站：HTML、CSS\
  \ 和 ARIA 最佳实践\n- 第 8 章，移动可访问性：为触控和语音界面而设计\n\n### 5\n\n#### 设计可访问用户界面：视觉与交互设计\n\n\
  作者 Nandita Gupta\n\n可访问的用户界面是创建对每个人都有效体验的关键，无论其能力或与技术交互的方式如何。在本章中，我们将介绍以可访问性为出发点设计的重点方面，例如有效使用色彩、为认知设计、支持多种输入方式，以及在不同设备和平台上扩展可访问性。目标是帮助你构建不仅可访问，而且对所有用户都直观且引人入胜的界面。\n\
  \n此信息很有价值，因为可访问性对包容性和可用性至关重要。当你深思熟虑地设计时，你会消除障碍，创造更具意义、更灵活的体验，覆盖更广泛的受众。本章为你提供实用的见解和策略，使你的设计真正包容并适应真实用户需求，并涵盖这些策略对残障用户的好处。\n\
  \n在本章中，我们将深入探讨以下主题：\n\n- 在视觉设计中使用色彩\n- 考虑到认知障碍进行设计\n- 为多种替代输入方式设计\n- 扩展设计以改善可访问性\n\
  \n##### 在视觉设计中使用色彩\n\n色彩是视觉设计中的强大元素。它可以唤起情感、引导用户交互并创造难忘的体验。然而，强大的力量伴随着巨大的责任。设计师必须认识到，色彩感知在不同的人、文化和情境中可能存在显著差异。对一组用户来说似乎直观或普遍可理解的东西，对另一组用户来说可能是令人困惑或排他的。\n\
  \n本节将探讨如何以确保所有用户可访问的方式有效使用色彩。我们将深入研究色彩对比度、在信息传递中替代色彩使用图案、形状和图标，以及讨论如何在安全和警告系统中设计文化考量。目标是创建迎合更广泛、更多元受众的设计——其中包括世界卫生组织估计的约\
  \ 3 亿生活在色彩视觉缺陷中的人。\n\n##### 使用色彩进行时间敏感决策和安全\n\n交通灯提供了色彩如何快速、本能地传达信息的熟悉例子。但对于红绿色盲个体——一种常见的色彩视觉缺陷形式——这些灯光之间的区别可能不清晰，造成潜在的安全风险。这种挑战在制造业等高风险环境中变得更加突出，在那里瞬间决策不仅影响生产力，还影响工人安全。在此类环境中，仅依赖色彩来传达紧迫性、状态或系统状况会引入不必要的风险。\n\
  \n> 公司 RealPars 写了一篇文章，展示了色彩如何在制造系统中产生巨大影响，通过在整个系统中不加区别地使用色彩，不仅造成认知过载，还成为潜在的安全隐患：https://www.realpars.com/blog/high-performance-hmi。\n\
  \n另一个重要考虑是，色彩的含义并非固定；它在不同文化和情境中有所变化。例如，红色在北美和欧洲广泛用于表示危险或“停止”，但在东亚部分地区，它也可以表示庆祝或繁荣。同样，白色在西方文化中可能代表清洁或安全，而在其他文化中则与哀悼和死亡密切相关。这些差异在全球产品中变得至关重要，误解信号可能导致混淆或延误。\n\
  \n相反，将色彩与其他指示器结合使用——如形状、图案、文字标签或听觉信号——以确保信息对所有用户可访问，包括色彩视觉缺陷者。例如，行人交通信号可以通过补充不依赖色彩感知的额外提示来变得更易访问。不要仅依赖色彩，请执行以下操作：\n\
  \n- 使用文字标签，如“停止”和“通行”，直接显示在灯光下方或内部。这有助于色彩视觉缺陷用户，也支持在不熟悉环境中的理解。听觉提示，如语音指令或音调模式，可以进一步增强可访问性。\n\
  - 将色彩与形状配对——例如，红色圆形灯表示“停止”，绿色方形灯表示“通行”。这种基于形状的区分即使在色彩难以区分时也能强化含义。\n- 加入符号，如红色站立的人形和绿色行走的人形。这些提供直观的视觉参考，尤其对低识字率或语言障碍用户有帮助。\n\
  \n国际标准化组织 International Organization for Standardization 制定国际标准，提供了克服语言障碍并支持跨地区一致解读的一致图形符号集。这些符号将色彩与图案、图标和文字结合，以清晰高效地传达关键信息。通过使用多重冗余提示而非仅依赖色彩，ISO\
  \ 标准为设计跨不同语言、文化和能力的可访问标识和界面元素提供了实用模型。\n\n> 对某些人可能可访问的解决方案可能对其他人具有触发性。例如，闪烁的红灯配上醒目的警告图标和警报声可以立即吸引注意力并促使快速行动。另一方面，闪烁灯光可能对患有光敏性障碍的用户造成触发。\n\
  \n\n\n\n\n##### 使用颜色对比确保清晰易读\n\n颜色对比对于确保您的内容对低视力或色盲用户清晰易读且无障碍至关重要。对比度可确保文本在背景上清晰突出，使阅读更轻松。如果没有足够的对比度，用户可能难以区分文本和背景，从而导致挫败感和认知负荷增加。\n\
  \n深灰色或黑色文本配浅色背景（反之亦然）是提高可读性的理想选择，但务必验证对比度是否符合无障碍要求。根据 Web 内容无障碍指南（WCAG）2.1，标准正文文本与其背景的对比度必须至少达到\
  \ 4.5:1，才能被视为无障碍。对于较大文本（通常是 18 磅常规或 14 磅加粗），最低对比度要求稍低，为 3:1。这些指南有助于确保低视力或色觉缺陷用户能够轻松阅读内容，而不感到费力。\n\
  \n下面是一个示例，展示不同级别的颜色对比度以及它们是否符合 WCAG 指南：\n\n- 1. 差示例 2.67:1（不合格）\n- 2. 非常差的示例 1.1:1（不合格）\n\
  - 3. 差示例 2.09:1（不合格）\n- 4. 好示例 21:1（合格）\n- 5. 非常差的示例 1.14:1（不合格）\n\n图5.1：颜色对比度与\
  \ WCAG 指南对照\n\n为了支持可读性，设计师必须尽早并经常使用能够测试对比度是否符合无障碍标准的工具来评估颜色组合。WebAIM 的**颜色对比度检查器**等工具让这一过程变得简单：设计师可以输入特定的前景和背景颜色值，并立即获得该组合是否符合\
  \ WCAG 要求的反馈。将这类测试融入设计工作流程，可确保内容不仅在理想条件下清晰可读，而且在各种视觉能力和设备设置下也能保持清晰易读。\n\n> **加州州立大学北岭分校（CSUN）**\
  \ 提供了一篇关于颜色对比好坏的优质文章，以及一张实用的对比表：\n> https://www.csun.edu/universal-design-center/web-accessibility-criteria-color-contrast.\n\
  \n##### 在图表中使用颜色\n\n界面和网页中使用的图表和图形是数据驱动设计通过颜色区分类别或突出趋势的另一个例子。然而，仅靠颜色来表示不同数据点是不够的，在颜色之外使用图案或纹理对于感知也很有价值。\n\
  \n例如，在饼图中，每个扇区不仅可以靠颜色区分，还可以通过纯色填充、条纹、圆点或其他图案来区分。即使无法准确感知颜色，这些变化也能帮助用户区分数据集。使用图例时，将每种颜色与清晰的文本标签以及该数据点所代表内容的简要说明配对，可确保无论视觉能力如何，图表都易于理解。此外，所有图表和图形都应包含描述性文本替代内容——可以是标题、摘要或无障碍数据表——以支持依赖屏幕阅读器的用户，以及那些受益于文字背景信息的认知障碍用户。\n\
  \n请看下面的饼图，我们可以看到，图中使用了不同颜色来区分扇区，同时为每个扇区添加了纹理，并用具体数值标注了每个部分：\n\n##### 最喜爱的食物\n\n\
  ![](img/3bdc9e2d41de898f8a3bcc9634b0000e_130_0.png)\n\n图5.2：一张使用不同颜色和清晰标签的饼图\n（不过为了更好的无障碍性，它还可以进一步改进！）\n\
  \n为了改进它，汉堡和寿司标签使用的颜色非常相似，因此我们可以更改其中一个标签的颜色。我们还可以为每个扇区使用不同的纹理；然而，过多且相互冲突的纹理可能会让用户感到不知所措，因此应谨慎使用。\n\
  \n##### 使用颜色传达错误\n\n在网页设计中，颜色常用于指示错误；例如，填写表单时，绿色表示成功，红色表示失败。然而，有色觉缺陷的用户可能不容易区分这两者，我们不能假设每个人都具有普遍一致的颜色感知。\n\
  \n全球约有 8% 的男性和 0.5% 的女性患有某种形式的色盲，这可能使依赖颜色的信息难以获取。色盲的程度各不相同，有些人难以区分某些色调（如红色和绿色），而有些人则完全无法感知任何颜色（全色盲）。\n\
  \n为确保表单验证流程在视觉设计和颜色方面对用户无障碍，请执行以下操作：\n\n- 在彩色文本旁添加图标，以标示成功或失败。例如，绿色对勾和红色叉号可提供清晰的状态视觉提示，无论用户感知颜色的能力如何。\n\
  \n设计的一致性对于所有用户（包括残障用户）的整体可用性至关重要，可以通过以下指南来实现：\n\n- **可预测模式：** 当模式和行为可预测时，用户能够建立对事物运作方式的熟悉感，从而更轻松地浏览复杂系统或完成任务。\n\
  - **布局：** 通过在页面中一致地放置导航元素、按钮和交互组件来保持统一布局，有助于用户快速了解在哪里找到关键功能。这一原则在 WCAG 2.2 中得到强化，该版本引入了跨页面提供一致帮助机制的要求（https://www.w3.org/WAI/WCAG22/Understanding/consistent-help.html）。\n\
  - **视觉一致性：** 始终使用相同的图标、按钮和颜色，使用户能够轻松地将操作与其视觉提示关联起来。\n- **交互：** 可预测的交互至关重要；遵循常见惯例（例如使用垃圾桶图标表示删除）可以避免混淆，并创造更流畅、更直观的体验。\n\
  \n具体来说，提供类似功能的按钮应保持一致，以提醒用户可点击的元素和行为。下图展示了按钮一致性好与差的示例：\n\n![](img/3bdc9e2d41de898f8a3bcc9634b0000e_133_0.png)\n\
  \n*图5.4：按钮一致性好与差的对比*\n\n一旦这些基础 UX 原则付诸实践，下一步就是确保这些设计模式能在所有用户（包括有无障碍需求的用户）中良好运行。无障碍设计的原则并非一刀切；相反，设计模式应灵活且可调整。以下三个技巧有助于支持无障碍性：\n\
  \n- 许多认知障碍用户依赖键盘快捷键来加快导航。请确保所有交互元素（如按钮、链接和表单）都可以仅通过键盘命令访问，并且焦点顺序合乎逻辑（有关焦点顺序好坏的示例，请参阅本章末尾的*无障碍信息架构*部分）。确保这些键盘快捷键和交互在整个体验中保持一致也很重要。\n\
  - 为需要额外信息的复杂交互提供上下文帮助或工具提示。这些内容应易于访问和理解，在引导用户的同时避免信息过载。但请记住，工具提示不应成为糟糕设计的替代品；设计本身应易于理解，而工具提示则以简洁的方式提供额外信息。\n\
  - 表单字段、按钮和其他交互元素应始终使用清晰、描述性的标签，让用户一眼就能明白其用途。避免使用“提交”等模糊或通用术语，而应使用具有明确动作指向的语言，例如**提交您的订单**或**保存您的工作**，帮助用户准确了解接下来会发生什么。在适当的情况下，为这些标签补充简短、有用的指导，例如输入示例（**MM/DD/YYYY**）或字段要求（**密码必须至少包含8个字符**），以减少不确定性并防止错误。\n\
  \n##### 渐进式披露与抽象掉不必要的内容\n\n构建渐进式披露和抽象化的关键不在于你向用户界面添加了什么，而在于你暂缓呈现了什么。在交互的每一步中，只呈现必要的信息，避免用户需要记住前几步的细节。这就像烹饪一道复杂的菜肴：先是一长串食材清单，接着是一份混乱无序的说明。虽然提供所有必要信息（如食材、步骤和所需材料）很重要，但以合理的逻辑顺序呈现这些信息可以简化烹饪过程。\n\
  \n同样，对于用户界面，保持任务简单并将复杂流程分解为更小、更易管理的步骤，可以减轻认知负荷。以下是一些在用户界面中构建渐进式披露的可行方法：\n\n\n- \
  \  对于需要更多思考或操作的任务（例如表单提交），请将其分解为更小的步骤。这有助于用户保持专注，并避免因一系列冗长操作而感到不知所措。\n-   避免用过多的选择、过多的文字或过多的视觉杂乱让用户应接不暇。选择干净、组织良好的布局，并使用清晰的标题和标签。\n\
  -   让用户了解他们在界面/任务中已进展到何处。例如，如果用户正在填写一个长表单，显示进度条或步骤指示器可以帮助他们直观地看到自己在流程中的位置，从而让整个任务不再那么令人望而生畏。在创建进度条时，应结合使用颜色和清晰的文本（例如数字百分比），并确保屏幕阅读器等辅助技术能正确播报进度。\n\
  \n需要特别注意的是，除了支持认知障碍用户外，上述技术还能惠及更大比例的用户，包括具有交叉身份和残疾的人群。在用户体验中抽象信息并建立清晰度，能够支持从听觉到视觉等各种各样的处理风格，从而惠及更广泛的用户群体。\n\
  \n##### 轻松撤销操作\n\n让用户感到自己掌控一切，并且不会因犯错而受到惩罚，这一点非常重要。这对于认知障碍用户尤为关键，因为他们可能需要更多时间完成任务，并且更频繁地犯错。这也与施奈德曼八大黄金法则中的另一条相符：“支持内在控制点，并允许轻松撤销操作。”当用户知道可以毫无后果地撤销或修改操作时，这会减少焦虑、鼓励探索，并让数字环境感觉更安全、更具支持性。\n\
  \n例如，在每个页面上提供“返回”或“取消”选项，可以让用户纠正错误而不用担心造成永久性问题。这在涉及数据敏感和关键决策时尤为重要，例如删除重要信息时，应提示用户确认，并确保继续操作的后果清晰明确。\n\
  \n另一个例子是在签署关键任务时，例如授权更改银行账户或在线完成大额转账。在这种情况下，提供一种简便的方式来审查和撤销操作，并配有清晰的“取消”或“编辑”选项，不仅能减少所有用户的焦虑和错误，对于可能需要额外时间或多次尝试才能确认选择的认知障碍用户尤其重要。\n\
  \n##### 语音命令实现免提交互\n\n语音命令对于行动不便的用户或偏好基于语音导航的用户来说，已成为一种越来越重要的交互方式。为语音命令进行设计，既需要支持基本导航（例如打开菜单和选择选项），也需要支持更复杂的任务（例如填写表单和控制多媒体内容）。\n\
  \n在语音命令中，当用户可能使用诸如 Dragon 之类的辅助技术或诸如听写之类的内置操作系统功能时，需要考虑多个因素。构建针对基于语音的交互和无障碍性进行优化的界面非常重要，应将语音导航集成到所有关键用户旅程和交互中，以提供完全包容的体验。\n\
  \n为了有效做到这一点，设计人员应牢记以下注意事项：\n\n-   **清晰且一致的语音命令：**\n    -   定义一组自然、简单的命令，让用户能够轻松学习和使用\n\
  \    -   确保语音命令在整个界面中保持一致且直观\n    -   使命令结构与类似产品或平台中使用的常见模式保持一致\n    -   对关键操作使用熟悉的短语（例如“打开菜单”、“返回首页”或“朗读”）\n\
  \    -   允许措辞上的细微变化（例如“返回首页”、“回到主页”或仅说“首页”），以适应不同的用户偏好和说话风格\n-   **反馈与确认：**\n  \
  \  -   尽可能将基于语音的反馈与视觉或触觉提示相结合\n    -   在命令执行后提供视觉确认——例如高亮按钮或更改其状态\n    -   通过多感官反馈强化交互，帮助用户验证操作是否成功\n\
  \    -   使用确认提示让语音交互更易访问、更可预测、更令人安心\n\n一个真实案例是使用 Amazon Alexa（https://www.alexa.com/），它支持在各种设备上进行语音控制导航，从智能家居系统到流媒体设备。通过提供清晰、简单的命令（如“播放音乐”或“停止”），用户可以轻松地免提控制设备。此外，通过屏幕通知或设备反馈（例如“音乐正在播放”）提供的视觉反馈可确保清晰度。还可以设置个性化语音命令来控制设备，从而无需键盘或按钮点击。\n\
  \n##### 手势控制增强无触摸交互的导航\n\n手势控制已成为行动能力或灵活性有限的用户的一种强大输入方式。通过使用摄像头、传感器或触摸屏，手势识别允许用户通过滑动、捏合或简单的手部动作等手势与界面交互。为手势控制进行设计时，需要确保手势直观、一致，并提供反馈以引导用户完成任务：\n\
  \n-   保持手势简单、熟悉且易于学习非常重要，以免造成认知过载。复杂或非标准的手势可能会让行动障碍用户感到沮丧；因此，应坚持使用常见手势，如左右滑动、捏合缩放或长按激活。\n\
  -   界面和系统还必须在识别到手势时提供视觉或触觉反馈。例如，滑动手势可能会更改屏幕内容或触发页面过渡，而清晰的动画应确认手势已成功执行。\n-   在许多情况下，添加个性化设置很有价值，因为某些用户可能会觉得某些手势在身体上难以执行或不舒服。允许用户自定义手势映射，或将手势替换为替代输入（如屏幕按钮或语音命令），可确保界面适应用户的需求，而不是强制采用一刀切的解决方案。\n\
  \n一个真实案例是集成 Cephable（https://cephable.com/），该服务允许用户使用现有输入启用基于语音和手势的交互。用户可以用简单的手势控制设备，例如举手暂停会议或滑动切换频道。通过将直观的手势与清晰的视觉反馈（如屏幕动画或颜色变化）相结合，这为灵活性有限的用户提供了无障碍体验。\n\
  \n##### 辅助技术，包括支持开关、眼动追踪等\n\n自适应开关、眼动追踪设备和吸气吹气系统等辅助技术对于严重运动障碍的用户至关重要。当传统输入方式不可行时，这些技术提供了一种与数字系统交互的手段。\n\
  \n确保您的平台与这些设备兼容，允许用户有效地浏览您的网站或应用，这一点至关重要。除了前面关于语音控制和非手势的信息外，还必须允许用户将操作映射到特定的开关输入或眼球运动。例如，手部活动受限的用户可能使用开关来执行鼠标点击或键盘按键操作。所有交互元素都必须可触及，并且可以通过辅助设备激活，包括逻辑的\
  \ Tab 键顺序。设计必须确保焦点指示器可见且易于导航，并允许通过单个或多个输入触发操作。\n\nApple 的“切换控制”是一个系统，允许用户通过各种外部开关来控制\
  \ iPhone、iPad 或 Mac（https://support.apple.com/en-us/118667）。用户可以通过按下映射到特定操作的开关来选择并交互屏幕上的项目。这使得严重行动障碍的用户能够有效地使用\
  \ Apple 产品。\n\n为多模态输入（如语音、手势、键盘和辅助设备）进行设计，对于创造无障碍体验至关重要。然而，仅仅在个别情况下应用这些技术是不够的。要真正支持多样化的用户群体，关键在于能够在规模化层面部署和维护所有这些技术，这正是我们接下来要讨论的内容。\n\
  \n##### 大规模设计以改善无障碍性\n\n在规模化层面进行无障碍设计，需要创建一个灵活且包容的设计系统，使其能够满足广泛用户需求和设备。这种方法可确保您的平台在增长过程中始终保持可用和可访问。一个设计良好的系统超越了视觉元素，考虑了可用性、认知清晰度以及所有交互之间的一致性。它包含可重用组件、字体可读性、用户自定义和键盘导航等元素，确保平台对所有人（无论能力如何）都可用。\n\
  \n\n\n\n\n##### 构建模块化、可访问的设计系统\n\n可扩展的设计系统对于可访问性至关重要。它涉及创建可重用组件（例如，按钮、表单和模态框），并对其进行彻底的可访问性测试。这些组件应足够灵活，能够组装成更复杂的设计而不牺牲可访问性，并且这为可访问平台奠定了可持续的基础。\n\
  \n实现规模的一种方法是使用遵循可访问性标准的可重用组件，例如最小对比度比率和与屏幕阅读器的兼容性，以及如何实现这些组件的指南。设计系统还必须提供有关如何实现这些组件的清晰文档，包括如何添加替代文本、为屏幕阅读器构建内容结构，以及遵守针对运动障碍的触控目标尺寸。\n\
  \n这些要素确保随着平台的演进，新功能将以同样的简洁性、一致性和认知支持为重点进行集成。这适用于符合可访问性标准的组件（例如，适当的对比度和屏幕阅读器标签）并在整个平台中一致重用的组件，例如按钮，以及为整个平台设置交互和导航模式。\n\
  \n##### 应在规模上保持可访问的元素\n\n关键的 UX 元素，如可读性、清晰的语言和用户友好的导航构成了可访问设计的骨干。这些元素支持规模的方式是确保更改仅在设计系统和\
  \ UI 工具包中进行一次。因此，使用这些元素的每个设计师或开发人员都会自动将可访问性融入其设计中。\n\n以下是一些元素的关键设计考虑因素：\n\n- **字体可读性：**\
  \ 优先使用大而清晰的字体并具有足够的对比度，以增强跨设备和用户条件下的可读性。避免装饰性或过于花哨的字体，因为它们会妨碍可读性。相反，选择简单、干净的无衬线字体——例如\
  \ Arial 或 Helvetica——它们缩放良好，并在各种屏幕尺寸和分辨率上保持清晰。\n- **颜色使用：** 为了确保在规模上实现清晰度和包容性，始终用额外的视觉线索补充颜色，例如图标、图案、下划线或文本标签。\n\
  - **引导式焦点：** 使用一致的视觉线索——例如，围绕活动元素（如按钮或输入字段）清晰可见的焦点环——帮助用户在导航时保持方向。遵循 WCAG AAA 建议，此焦点指示器应具有高对比度且持久，确保其在所有页面和组件中保持可见。\n\
  - **清晰的语言：** 使用简单、直接的措辞，避免可能让用户困惑的术语，尤其是认知障碍的用户。建立清晰的语言指南，解决语气和可读性水平，以确保内容在整个平台中保持一致且易于理解。\n\
  - **基于时间的交互：** 为用户——尤其是认知障碍的用户——提供调整或禁用任务或交互上的时间限制的选项，使他们能够按自己的节奏处理信息。为了在规模上支持可访问性，在平台所有相关区域中一致地实施这些控件，确保用户无论上下文如何都能获得可预测且包容的体验。\n\
  \n##### 通过用户自定义赋能个性化\n\n允许用户自定义其界面可以显著改善可访问性。模块化设计系统为个性化体验奠定了基础，用户可以在其中调整平台以满足其独特需求，例如更改字体大小、颜色或布局。个性化的关键在于构建响应式和动态的用户界面，让用户能够控制字体大小和颜色对比度以满足其偏好或需求。\n\
  \n灵活的设计必须在不同设备上运行，从台式机到手机。它应支持缩放和文本调整大小，而不会丢失功能或破坏界面。跨操作系统的 consistency 在构建包容性体验中发挥着重要作用。这包括清晰、一致的导航，可在不同设备和缩放级别下使用。这一概念与\
  \ WCAG 2.2 成功标准 1.4.10：重排（AA 级）相关，该标准指的是网页或应用程序上的内容能够动态适应的能力，调整布局、文本大小和定位，以便用户无需水平滚动或过度缩放即可查看和交互，即使在显示尺寸发生变化时（如在移动设备上或放大时）。\n\
  \n布局是一个至关重要的考虑因素。设计系统应允许客户重新排列各部分，并确保内容能够无缝适应各种屏幕尺寸和方向。现实世界的例子是 Webex，它允许用户在会议体验中自定义其布局，以便能够置顶手语翻译者、更改舞台视图、隐藏无视频的与会者等等。这使用户能够自定义会议体验以实现包容性体验（https://blog.webex.com/collaboration/fostering-inclusive-and-accessible-communication-with-webex-suite/）。\n\
  \n个性化还扩展到语言和本地化。在全球范围内扩展时，支持语言自定义和本地化至关重要，这可能会影响布局、内容结构和焦点行为。某些语言（例如阿拉伯语）从右到左阅读，因此布局必须相应调整。其他语言，如德语，可能由于单词长度更长而需要更多空间。此外，在本地化内容时保持清晰度和一致性也很重要，尤其是对于认知障碍的用户。\n\
  \n##### 可访问性的信息架构\n\n在考虑信息架构时，请考虑多模式输入，包括键盘友好的导航系统。对于有运动障碍的用户或更喜欢键盘导航的用户，使用 Tab\
  \ 和方向键，确保所有交互元素都可以通过键盘访问。这包括修复选项卡顺序和视觉焦点指示器，为使用键盘和其他输入设备的用户提供无缝体验。\n\n将选项卡顺序组织为逻辑流很有价值，从上到下或从左到右。页面上的所有活动元素都应清晰突出（例如按钮和表单字段），以便用户可以轻松跟踪其焦点，并在适当时包含键盘快捷键，确保它们得到充分记录并且可自定义。\n\
  \n查看下图，虽然视觉阅读者可能能够辨别按钮和信息的层次结构，自然地将注意力转移到“立即申请！”部分，但选项卡焦点顺序会为仅使用键盘或依赖屏幕阅读器的人创造混乱的体验：\n\
  \nFigure 5.5: An example of bad tab focus order\n\n然而，在下图中，选项卡焦点顺序已得到修复，以创建更自然、更易于遵循的模式：\n\
  \n![](img/3bdc9e2d41de898f8a3bcc9634b0000e_144_0.png)\n\nFigure 5.6: An example\
  \ of good tab focus order\n\n#### 总结\n\n在本章中，我们通过关注关键的视觉和交互原则，学习了如何设计可访问的用户界面。涵盖的主题包括在视觉设计中深思熟虑地使用颜色以确保清晰度和包容性，为认知差异设计以减少障碍，支持多种替代输入方法以满足多样化用户，以及在各种设备和平台上扩展可访问性的方法。这些见解为创建对广泛人群既可用又可访问的界面提供了坚实的基础。\n\
  \n此信息很有价值，因为可访问性是负责任和包容性设计的关键部分。通过了解如何应用这些原则，您可以构建赋能各种能力用户的产品，减少挫败感并改善整体用户体验。以可访问性为出发点进行设计不仅符合法律和道德标准，还能扩大数字解决方案的覆盖面和影响，并影响收入和采用。\n\
  \n在下一章中，您将学习如何创建可访问的内容，特别关注书面内容、图像和多媒体。\n\n\n\n"
- "### 6. 创建无障碍内容：写作、图像和多媒体\n\nBy Jennifer Chadwick\n\n人们常说内容为王，这确实如此。各种形式的内容被用来讲述故事、提供信息或销售产品。信息必须清晰传达才有意义、被理解并付诸行动。作为一名作者，你正在创造信息。\n\
  \n在本章中，我们将介绍如何创建无障碍内容，使其能够触达尽可能广泛的受众——其中包括残疾人士。我们将探讨文本、图像和多媒体这三种内容类型，以及哪种格式最适合人们的需求。我们将讨论在撰写信息、标签和说明时使用简明语言的重要性。我将为你提供指导原则，帮助你的写作风格对所有人保持包容。\n\
  \n在章节末尾，我将分享一个需求演练练习，你可以作为作者来测试你的内容是否符合残疾人士的关键使用场景。为此，请考虑召集你的用户体验 UX 和视觉用户界面 UI\
  \ 设计师一起走查原型。\n\n本章涵盖以下主要主题：\n\n- “媒介即信息”\n- 审查构建包容性内容方法中的关键行动\n- 使不同类型的内容更易访问\n\
  - 进行需求演练练习\n\n#### 审查构建包容性方法的关键行动\n\n让我们看看一些充实且可操作的构建包容性写作实践的方法。\n\n这里我们将先看一些更通用的想法，然后稍后我们将查看内容特定的方法。\n\
  \n##### 熟悉用户需求\n\n要创建对残疾人士无障碍的内容，你需要熟悉他们体验内容的方式。W3C 网络无障碍倡议 WAI 网站上有一个名为多元能力与障碍\
  \ Diverse Abilities and Barriers 的页面 www.w3.org/WAI/people-use-web/abilities-barriers。\n\
  \n这是一个了解不同残疾相关个人需求和偏好的优秀资源。它提供了人们在工作、学习和购物时引人入胜的用户故事。\n\n它概述了五种残疾类型的数字内容和设计障碍：\n\
  \n- 听觉 e.g., 听力丧失、聋盲、听力障碍等。\n- 认知和学习 e.g., 自闭症、多动症、记忆丧失、学习障碍等。\n- 身体 e.g., 活动能力问题、四肢瘫痪、截肢、癫痫等。\n\
  - 语言 e.g., 口吃、失语、构音障碍 不一致的发音和声音 等。\n- 视觉 e.g., 盲、视力受限或低视力、聋盲、色觉缺陷等。\n\n##### 牢记多种用户体验\n\
  \n内容和用户界面设计师必须记住，他们不是最终用户。你的个人需求、感知和能力可能与产品或服务的广泛多样用户不同。\n\n如果主要以自己为中心进行设计，尤其是在你没有残疾的情况下，必然会使几个人无法体验它。相反，从世界万维网联盟\
  \ W3C 发布的 WAI 资源开始。它们实用、有效，并直接映射到网络内容无障碍指南 WCAG，该标准被用作全球无障碍法律、法案和法规的基础。\n\n#####\
  \ 尽可能向真实用户学习\n\n最好的学习方式来自真实的人和他们的亲身经历。邀请残疾人士与你合作并共同设计项目。继续通过访谈、调查、原型演练和小组讨论收集终端用户体验。这种做法令人兴奋、有效且对所有人都有益。你将通过观察并询问人们如何做事以及他们如何使用辅助技术和适应策略来完成任务，从而验证你的新知识。直接向人们学习也有助于你避免对“所有盲人用户”或“所有\
  \ ADHD 用户”做出假设。\n\n如果预算或时间限制不允许咨询有亲身经历的人，请使用 W3C 的五种残疾类型列表创建一个清单，并为每种类型创建 1-2 个用户场景或任务。\n\
  \n然后，走查与你的内容样本或设计原型交互的体验。用户是否能够在没有困惑或困难的情况下完成任务或体验内容或设计？如果不能，请记下改进体验或消除障碍的事项。\n\n\
  ##### 用简明语言撰写所有内容\n\n国际简明语言联合会 International Plain Language Federation 表示，“如果其措辞、结构和设计清晰到足以让目标读者轻松找到所需信息、理解找到的信息并使用该信息，则沟通即为简明语言”\
  \ https://www.iplfederation.org/plain-language/。无论你的主题复杂与否 医学术语、技术说明或法律术语 或简单 信息在博客文章中。简明语言写作支持所有层级的阅读理解，以触达最广泛的受众。\n\
  \nNielsen Norman Group，一家领先的用户体验研究和设计专业公司，于 2017 年对科学、技术和医学领域的领域专家进行了可用性研究。提出的问题：简明语言是否会使高度技术性或学术性内容变得肤浅？研究发现，“即使是受过高等教育的在线读者也渴望简洁、易于扫描的信息”\
  \ https://www.nngroup.com/articles/plain-language-experts/。\n\n英国政府也进行的研究发现，80%\
  \ 的人更喜欢以简明语言阅读内容。Mark Morris 是英国政府卫生部清晰英语主管，也是卫生大臣的前演讲撰稿人。在 2014 年的一篇博客中，他创造了一句话，体现了内容作者在拥抱简明语言写作方面的演变。“清晰为王。”\n\
  \n1994 年，微软联合创始人比尔·盖茨看到了在线内容创作在万维网上触达广泛受众的力量。他说，“内容为王。”现在，清晰才是最重要的。\n\n但你不必是复杂医学期刊的作者、卫生部演讲撰稿人，甚至是比尔·盖茨才知道简明语言对所有用户都有用。\n\
  \n稍后在本章中，在名为 Text 的部分，我们将介绍撰写段落、标签和说明的具体简明语言技巧。\n\n##### 熟悉障碍和替代方案\n\n你现在已经了解了残疾需求，并准备应用简明语言原则。但让我们面对现实，某些数字内容媒体\
  \ 格式 本身对具有不同残疾和需求的人来说并不固有无障碍。例如，你可能选择以视频形式呈现新闻故事，但一些视力障碍人士无法轻松感知屏幕，或根本无法感知。\n\n\
  这是否意味着你不能再使用视频来传达信息，因为有些人无法体验它？当然不是。使用视频格式，但确保它配有媒体替代方案，例如文字记录。文字记录呈现标题、人物描述、口语对话、屏幕上的声音和动作。这就是相同的信息，只是以不同的方式访问。\n\
  \n在本节中，我们了解到，如果你选择使用一种你知道固有地对某些用户无效的内容格式，你必须将其与一种能够触达其余受众的替代格式结合起来。接下来，我们将深入研究每种内容类型以及哪种替代方案最适合残疾用户。\n\
  \n#### 使不同类型的内容更易访问\n\nWCAG 标准围绕四个原则构建，以支持满足终端用户的需求。前三个是：\n\n1. **感知：** “我可以访问内容，识别它是什么、它意味着什么以及该如何使用——没有任何障碍。”\n\
  2. **理解：** “我理解内容的用途，其信息或说明足够清晰以便采取行动。”\n3. **可操作性：** “我可以根据内容中提供的标签或说明完成操作。”\n\n\
  \n\n\n对于好奇的人来说，第四个原则是**健壮性**：“这个网站或应用程序可以被各种各样的用户代理所解释，包括人们使用的辅助技术，如屏幕阅读器、键盘、开关控制、语音命令等。”但是，这主要与编码和实现有关，我们在此不予考虑。\n\
  \n在接下来的章节中，我们将研究不同类型的内容，并看看如何让它们更易于访问。\n\n##### 文本\n\n文本是一种通用的内容媒介，通常也是最易于访问的。有视觉障碍、学习困难、记忆丧失和/或注意力缺陷障碍的用户使用屏幕阅读器软件来朗读页面上的内容。文本可以被屏幕阅读器（如\
  \ JAWS、NVDA、VoiceOver 和 Narrator）以及软件内置的其他阅读工具无障碍地解析。当 PDF 被正确保存时，其中的文本也可以被同样的工具解析。\n\
  \n文本起着告知、指导和识别的作用。文本属于“感知”原则，因为用户可以通过视觉或使用屏幕阅读器软件来访问和感知文本。\n\n在接下来的章节中，我们将探讨如何通过“可扫读性”让文本更易于访问，以及提供简明语言的更多原则。\n\
  \n##### 让页面易于扫读\n\n2008 年，尼尔森诺曼集团（NN/g）在网络上进行了一项眼动追踪用户研究（https://www.nngroup.com/articles/how-little-do-users-read/）。他们发现，在平均网页上，用户在平均访问期间最多只能阅读\
  \ 28% 的字词；更有可能的是 20%。\n\n在 2010 年针对移动设备的另一项 NN/g 研究（https://nngroup.com/articles/mobile-content-is-twice-as-difficult-2011）中，阿尔伯塔大学的研究人员发现，当内容在手机大小的屏幕上呈现时，与较大的电脑屏幕相比，阅读理解会受到影响。对这个结果的一个简单解释是，在小屏幕上，用户在任意时刻看到的文本更少，因此他们必须更多地依赖记忆来获取阅读时所需的上下文信息。换句话说，较小的屏幕导致了更高的工作记忆负荷。人们无法维持这种更高的负荷，因此他们的理解能力受到了影响。\n\
  \n因此，你可以通过提供准确而简洁的内容来优化每个人的体验。为了帮助你的内容更易于扫读，特别是对于有认知需求、学习障碍或低视力的人群，请考虑以下关于文本格式的建议。\n\
  \n##### 标题\n\n标题的目的是介绍其下方相关内容。\n\n对于你的网页，创建一个带有标题的嵌套结构，用标题介绍每个内容区域。定义主标题主题，然后在下方使用与你的要点相关的“嵌套”子标题。前端开发人员将使用\
  \ HTML 标题标签来创建你的嵌套结构。\n\n例如，你的主要标题将是 1 级标题。然后，文档或页面可以包含多个 2 级子标题，在每个 2 级子标题下还可以有\
  \ 3 级子标题，依此类推。\n\n将内容划分为定义清晰的部分，可以使其更容易扫读。\n\n屏幕阅读器用户可以通过按快捷键跳转到内容（标题、链接、图形、表格等）。在这种情况下，按\
  \ *H* 键会朗读每个标题。\n\n![](img/3bdc9e2d41de898f8a3bcc9634b0000e_151_0.png)\n\n> 记住不要过度使用标题。有视觉障碍或学习困难的用户可能会使用文本转语音软件（如屏幕阅读器）来解析屏幕上的内容并了解页面结构。过度使用标题可能导致混乱，因此请确保只在相关时使用标题。\n\
  \n##### 段落\n\n在编写段落内容时，使用清晰、简洁的语言非常重要。此外，考虑将段落长度控制在四到五句话。\n\n将文本分成短段落称为分块。这使得用户更容易扫读文本，无论是眼睛在页面上向下移动，还是使用屏幕阅读器时，语音输出会在每个段落后停顿。它避免了可怕的“文字墙”，这种文字墙可能会让人不知所措。它减少了眼睛疲劳和认知过载。它改善了认知障碍、记忆障碍或多任务处理人群的语言处理能力。\n\
  \n![](img/3bdc9e2d41de898f8a3bcc9634b0000e_152_0.png)\n\n避免使用全大写。对于视觉用户来说，使用全大写字母的文本看起来像是在喊叫。屏幕阅读器不会识别这种文本强调，因此对非视觉用户来说，这种效果无论如何都会丢失。此外，全大写文本减少了单词的独特形状，使阅读障碍者更难快速识别和处理它们。\n\
  \n##### 项目符号列表和编号列表\n\n项目符号列表和编号列表通过使内容更易于阅读和导航来提高可访问性，特别是对于使用屏幕阅读器的人（因为它会宣布内容是一个列表）、认知障碍患者以及受益于结构化信息的人。\n\
  \n使用列表有助于将复杂的想法分解为易于理解的点——但是，当项目不需要按特定顺序排列时，使用项目符号列表；当提供序列（如说明）时，使用编号列表。\n\n#####\
  \ 导航菜单和按钮标签\n\n导航菜单通常是一组结构化的链接。因此，你的链接文本应清晰描述目标页面，例如“我们是谁”、“我们的服务”或“[产品]如何运作”。不过，有时导航菜单也会使用按钮。\n\
  \n保持这些菜单链接和按钮标签清晰简洁。这对于所有用户理解网站、移动应用或文档的结构至关重要。\n\n模糊或过于复杂的标签可能会让所有用户感到困惑，尤其是认知障碍患者和依赖屏幕阅读器输出的非视觉用户。按钮上的标签和链接文本应立即告诉用户控件的作用、它们如何运作以及预期结果。\n\
  \n为帮助用户，请使用简明语言的描述性标签，避免行话。例如，虽然“Get in Touch”很常见，但请改用“Contact Us”。这将优化理解，并让用户对链接或按钮将带他们去往何处毫不怀疑。\n\
  \n##### 导航地标和菜单链接\n\n理想情况下，页面通过地标（或区域）来定义其结构。地标包括页眉、页脚、主体和导航区，你的导航菜单就位于其中。\n\n开发人员实现代码，以便屏幕阅读器宣布地标类型。但是，如果页面上有两个导航菜单，你的职责是编写简短描述以区分它们。例如，“全局导航菜单”和“北美服务菜单”。\n\
  \n##### 链接\n\n你可能会在段落的句子中使用链接。这为用户提供了一种快速访问另一个页面并了解更多信息的方式。在这种情况下，不要在句子中使用“Click\
  \ here”或“Learn more”等短语作为链接文本。\n\n首先，并非所有用户都用鼠标点击。而且，屏幕阅读器用户可能会使用快捷键功能，提取网页上所有链接的列表。这会让他们脱离句子的上下文，因此如果你在页面上到处使用“Learn\
  \ more”等通用术语，用户只会听到一长串“Learn more”链接，无法区分它们。相反，应使用描述句子或段落主题的词语创建超链接。例如，对于句子“Learn\
  \ more about our accessibility features”，将“accessibility features”设置为超链接，或将整个句子设为链接。\n\
  \n##### 按钮和交互式控件的标签\n\n按钮（或任何交互式控件）上模糊或过于复杂的标签可能会让所有用户感到困惑，尤其是认知障碍患者和依赖屏幕阅读器输出的非视觉用户。标签应立即告诉用户控件的作用、它们如何运作以及预期结果。\n\
  \n根据关于链接的指导，如果可能，请避免在按钮标签中使用“Click here”或“Learn more”。如果非用不可，你必须为开发人员提供一段扩展但简洁的屏幕阅读器描述——例如，使用\
  \ `aria-label` 的“Learn more about the Tier One Dental Plan”。或者使用 `aria-labelledby`，它使用屏幕上的现有内容，例如标题。\n\
  \n##### 表单字段标签和说明\n\n在创建表单时，你要确保表单本身有描述，且表单字段标签和说明尽可能易于访问。以下是一些创建标签的最佳实践：\n\n- 表单本身应有一个名称或描述，即“2025\
  \ Cast Audition Form.”。开发人员将使用 `aria-label` 或 `aria-labelledby` 将这一点纳入屏幕阅读器。\n-\
  \ 表单字段标签应简洁、具体，并放置在输入字段附近。\n- 使用区块和标题来逻辑地组织信息。作为撰写者，你可以与 UX/UI 设计师合作确定结构。\n- 使用星号（*）清晰标示必填字段，并确保开发人员使用\
  \ `aria-required` 编写表单字段代码，以便屏幕阅读器用户听到“必填”一词。反之，如果大多数表单字段都是必填的，那么过多的星号可能会……\n\n\
  令人不知所措。在这种情况下，写一条说明：“除非标记为可选，否则所有字段均为必填。”\n\n+   - 在相关字段旁边显示清晰、具体的错误消息。准确描述用户需要修正和操作的内容，以便其能继续填写表单。\n\
  +   - 理想情况下，将预期的输入格式放在标签中（例如，日期用 MM/DD/YYYY）。屏幕阅读器会同时播报标签和格式说明。这有助于低视力用户使用屏幕放大功能——他们可以一眼看到全部内容。\n\
  +   - 输入格式（MM/DD/YYYY）也可以作为字段下方的帮助文本放置，并通过 `aria-describedby` 告知屏幕阅读器用户。\n+   -\
  \ 不要把重要的说明放在占位符文本中。确保说明和格式提示（例如，MM/DD/YYYY）是标签的一部分。\n\n以下是关于说明文本的一些最佳实践：\n\n+  \
  \ - 使用简单、熟悉的语言，避免行话和复杂的措辞\n+   - 说明应使用主动语态，清晰地指示要采取的操作，并按照需要执行的顺序排列\n+   - 确保必要的用户信息放在表单开始之前，例如：“您必须年满18岁才能申请此信用卡”\n\
  \n##### 在标题下对相关的表单输入进行分组\n\n在视觉和程序上对主题相关的字段进行分组，例如将姓名字段与地址字段区分开。这有助于将长表单拆分为更易于理解的区块。\n\
  \n##### 数据表格\n\n使用数据表格时，请考虑以下最佳实践：\n\n+   - 确保表格用于表格数据，而不仅仅是用于构建页面布局。\n+   - 提供列标题和行标题，以保证清晰性。\n\
  +   - 避免合并或拆分单元格，这可能会让屏幕阅读器感到困惑。\n+   - 提供 CSV 或 Excel 下载作为替代访问方式。\n+   - 为表格中的任何说明性图片或\
  \ SVG 文件提供替代文本，以便屏幕阅读器读取。如果图片或 SVG 仅用于装饰，并非数据所必需，则不应包含替代文本。`alt` 属性保持为空，中间没有空格，即\
  \ `alt=\"\"`。\n+   - 为按钮、开关、菜单、列表和信息图标等交互控件使用标签，就像在表格之外使用这些项目时一样。\n\n还有一些代码和视觉设计实践虽然不由你负责，但可以支持你在数据表格中的内容。在与开发人员和设计师合作时，提醒他们执行以下操作：\n\
  \n+   - 对表格进行编码，确保表格可通过键盘导航，并与屏幕阅读器兼容\n+   - 创建带有交替行颜色的视觉风格，以提高可读性\n\n这些最佳实践有助于视障用户，因为屏幕阅读器软件在解析表格时，每当用户移动到每个新列的行中的单元格时，都会播报列标题。这确保用户不会迷失方向，数据关系也保持完整。\n\
  \n一些低视力用户使用放大软件将屏幕放大至 800%。一个包含所有信息的简洁表格很好。他们不必在页面上四处移动来查找信息。有学习困难的用户有时比阅读文本段落更容易理解表格中的关系。\n\
  \n> 如前所述，一些最佳实践与表格本身的设计和编码有关，这由视觉 UI 设计师和开发人员负责。然而，作为内容作者，你很可能要选择格式（在这种情况下是表格）。因此，熟悉最佳实践以及视觉呈现、样式和代码实现如何影响某些残疾用户是很重要的。\n\
  \n##### 文本的平实语言原则\n\n到目前为止，我们已经讨论了页面上文本的格式，以便更容易浏览。现在让我们讨论如何撰写文本本身并传达信息。\n\n#####\
  \ 在句子开头先交代主语\n\n自新闻业早期以来，新闻报道的第一句话就应回答核心的 5W——谁、什么、何时、何地、为何。先介绍你的主语和主题，然后在句末阐明你的观点。这样，语境从一开始就清晰明了。\n\
  \n##### 保持简洁\n\n史蒂夫·克鲁格在其 2001 年出版的《别让我思考》一书中，强调了在写作以及说明和标签中使用清晰、简单语言的重要性。这样，用户就不必思考——不必耗费脑力去解读你的标签或内容的含义。\n\
  \n他的另一个关键指导是“把每页上的文字删掉一半，然后再把剩下的删掉一半。”结合切中要点的句子写作、平实语言和简洁性，你可以用尽可能少的词表达你想说的一切。\n\
  \n##### 使用主动语态\n\n写作时使用主动动词而不是被动动词：\n\n+   - 被动动词是指句子的主语被施加了某种动作。例如：“自10年前成立以来，B公司一直资助多家儿童慈善机构。”\n\
  +   - 主动动词是指句子的主语做出了某个动作。例如：“B公司资助多家慈善机构。它10多年前就开始提供支持，并持续帮助有需要的儿童。”\n\n如你所见，主动语态对读者来说更清晰、更具吸引力，也更能自信地表达主题。\n\
  \n##### 使用简单的词语\n\n根据2023年的一项调查，51%的加拿大人阅读水平达到3级或以上——即一般读写能力。\n\n然而，19%的加拿大人得分在1级或以下（https://decoda.ca/insights-from-canadas-adult-literacy-survey/#:~:text=Key%20Findings%20from%20the%202023%20Canadian%20Survey&text=Literacy%3A%2051%25%20of%20Canadians%20are,at%20Level%201%20or%20below）。\n\
  \n在美国，约54%的成年人阅读水平在六年级或以下（https://en.wikipedia.org/wiki/Literacy_in_the_United_States）。\n\
  \n在英国，平均阅读水平通常被认为约为五年级，相当于英国教育体系中9岁的儿童（https://pmc.ncbi.nlm.nih.gov/articles/PMC11480634/#:~:text=Readability%20matters%20because%20it%20is,%E2%80%90old%20children%20%5B14%5D）。\n\
  \n基于这些统计数据，不要使用复杂的词语，如果简单的词语可以表达同样的意思。在你的语言中使用最简单的术语，你的内容就能覆盖最广泛的受众。\n\n##### 使用可读性工具\n\
  \n在写作时，你可以使用诸如 Hemingway App（https://hemingwayapp.com）之类的在线工具。它会根据学术年级水平对你的文本进行可读性扫描。目标是达到六年级阅读理解水平或更低（基于北美学校教育体系）。或者，\n\
  \nGrammarly（https://www.grammarly.com/）是一个广为人知的基于AI的工具，它可以插入 MS Word 等其他软件程序中，扫描并提供语法纠正和平实语言的建议。\n\
  \n##### 文本的格式组合\n\n记住要组合使用内容格式，以保持不同需求用户的可访问性。例如，如果你使用数据表格，请在平实语言的段落中提供相同的信息，解释数据之间的关系——用两种方式消化相同的内容。\n\
  \n> 在继续阅读本章其余部分时，你会看到文本如何与图片、视频和音频相结合。\n\n让我们提醒自己马歇尔·麦克卢汉说过的话，来结束关于文本的讨论：“媒介即信息。”让你的文本所传达的信息平实而简单。这样，它就能被感知、理解和操作。\n\
  \n##### 图片\n\n让我们看看设计师可能会使用、并且你可能与其合作的不同类型的图片。一些图片类型既包含文字，也包含图形来传达含义。\n\n但首先，了解为什么、何时以及如何为图片和图标等视觉内容使用文本替代方案是很重要的。\n\
  \n##### 图片的类型\n\n说到图片，我们可以将其分为四种类型：\n\n+   - 装饰性图片仅用于纯粹的审美功能，不添加有意义的内容，例如网站上的花卉背景图案。这些图片不需要替代文本。开发人员会保留\
  \ `alt` 属性，但它必须为空且没有空格，像这样（`alt=\"\"`）。这意味着屏幕阅读器会忽略它们，避免对视障用户造成不必要的干扰。\n\n\n\n\n\
  \n- **信息性图片**是指在其内部传达有意义的内容或信息的图片。常见的例子是食谱网站上的分步照片或插图，展示如何从零开始制作蛋糕。这些图片的目的是以视觉形式传达信息。它们需要替代文本来为视障用户描述图片。虽然页面或屏幕上可能有与图片相关的文本，但仍应使用\
  \ alt 文本来准确描述图片中具体的内容。此外，alt 文本不应简单重复周围上下文中已说明相同内容的文本。\n- **功能性图片**是用于发起操作而非传达信息的图片。它们用于按钮、链接、图标和其他交互元素。因此，alt\
  \ 文本应描述其功能，而非图片本身——例如，打印按钮仅使用打印图标在视觉上传达其用途。其 alt 文本应为“Print”而非“Printer”。同样，搜索图标是按钮的功能性图片，标签应为“Search”而非“Magnifying\
  \ glass”。\n- **复杂图片**是提供大量详细且有时相互关联的信息或数据点的信息性图片。这些绝非仅仅是装饰性的。数据通常以饼图、条形图、图表或信息图等高度视觉化的格式显示。其中可能混杂着文本、彩色编码的线条、符号和形状。在这种情况下，信息以非线性方式呈现，这使得屏幕阅读器难以导航并以有意义的顺序向视障用户传达信息。\n\
  \n让我们更仔细地看看 alt 文本，以及它为什么重要。我们还将探讨为什么应避免在图片中使用文本。\n\n##### 利用 alt 文本\n\n与设计师合作时，你可能会选择图片、照片或插图来配合你的文章。但如果你使用它们，作为内容创作者，你的职责就是将它们的主题、目的和情感转化为一种方式，以支持盲人、视力受限和/或有认知需求的人，他们可能使用屏幕阅读器来传达图片的含义。\n\
  \n替代文本，或简称为“alt 文本”，是网页、移动应用程序和文档中非文本内容的文本替代。有效的 alt 文本对图片、动画或视频是有意义且描述性的，并说明其主题和动作。\n\
  \n如果你在 HTML 中未为 alt 文本标签提供内容，屏幕阅读器将宣布图片文件名（也许是一串残酷的数字和字母！）或什么都不说——只说“image”。这只告诉用户他们在屏幕上遇到了一张图片。\n\
  \n以下是关于 alt 文本的一些注意事项：\n\n- 使用替代文本简洁地描述有意义的图片。\n- 通过标题或链接文本为复杂图片提供详细描述。\n- 确保文本替代传达与图片相同的信息。\n\
  - 请开发人员正确标记装饰性图片，以避免对屏幕阅读器用户造成不必要的干扰。这意味着你不会添加文本替代，因为它不是必要的。\n- 如果页面上的文本在没有图片的情况下已提供足够信息，则将图片标记为装饰性。但如果图片本身具有意义，请添加\
  \ alt 文本。\n\n![](img/3bdc9e2d41de898f8a3bcc9634b0000e_159_0.png)\n\n> 有一种误解认为所有图片都需要描述，但这正是内容作者的优势所在，可以判断何时需要、何时不需要。装饰性图片如果只是为了呈现风格而提供视觉效果，则不需要\
  \ alt 文本。WAI alt 决策树是内容作者常用的流行工具。它提供一系列是/否问题来帮助你决定图片是否需要 alt 文本：https://www.w3.org/WAI/tutorials/images/decision-tree/。\n\
  \n还值得考虑在 alt 文本的上下文中讨论图表、图标。\n\n##### 图表和图表\n\n图表和图表属于复杂图片，因此需要 alt 文本。但以下是一些具体考虑：\n\
  \n- 提供关键见解和数据关系基于文本的摘要。这有助于屏幕阅读器用户，他们可能无法仅根据图表做出解释和分析。\n- 为坐标轴和数据点添加标签，以便清楚图表显示的内容。最终，这对每个人都有好处！\n\
  - 提供替代数据视图——例如，相同信息以表格形式呈现。如前所述，有认知需求的人有时更喜欢具有明确信息块中关系的数据表。这可能更容易跟随，而不是图表上多条线和彩色编码的视觉效果。\n\
  \n##### 图标\n\n图标是独特视觉的，可以为目标受众提供所选主题的即时识别，如果使用的是常规图标。例如，帮助图标通常是问号，而搜索图标通常是放大镜。\n\
  \n有趣的是，图标很多时候是独立存在的，没有可见的内容标签。这是出于设计考虑，但最具包容性的方法是将图标与屏幕阅读器可读的文本标签结合使用。\n\n现在，请记住，标签应描述图标的功能，而非图标本身的描述。如前所述，如果你使用放大镜图标，alt\
  \ 应为“Search”（而非“Magnifying glass”）。\n\n以下是一些更通用的图标及其推荐的 alt 文本：\n\n- 放大镜图标：“Search”用于搜索输入字段\n\
  - 购物车图标：“Shopping cart”或“View cart”在交易流程中\n- 房屋图标：“Home”用于返回用户主页的链接或按钮\n- 信封图标：“Email\
  \ address”或“Contact us”用于打开邮件客户端或引导用户到联系表单网页的链接或按钮\n- 电话图标：“Call us”旁边是启动移动电话呼叫的电话号码链接\n\
  - 打印机图标：“Print this page”用于启动浏览器原生打印功能的按钮\n- 下载箭头图标：“Download [file name]”作为按钮，或旁边是链接，以在桌面或移动设备上启动下载\n\
  - 垃圾桶图标：“Delete”或“Remove”用于按钮或旁边是链接以启动此功能\n- 用户资料图标：“Profile”或“Account settings”用于按钮或旁边是链接以打开包含个人资料信息和/或账户设置的新页面或弹出窗口\n\
  - 齿轮或扳手图标：“Settings”用于按钮或旁边是链接以启动更改网站或 Web 应用程序内设置，或调用原生应用设置的页面或弹出窗口。\n\n在可能的情况下在图标旁边包含文本标签，并鼓励视觉设计师在页面或屏幕上为此留出空间。这项工作支持所有用户，但尤其是视力低下、学习困难和神经多样性的人。\n\
  \n有时，设计师会在文本链接前放置一个图标以使其在页面上突出，或提供清晰的视觉指示。一个好的例子是电子邮件链接旁边的电子邮件图标。只要链接文本对其目的或目的地具有描述性和意义，就无需为图标添加\
  \ alt 文本。它可以仅定义为装饰性。\n\n对此的一个例外是设计师放置在链接之前或之后以指示链接在新浏览器窗口或标签页中打开的图标。此图标是信息性图片，而非装饰性。图标需要\
  \ alt 文本，以便非视障用户知道链接会打开新窗口。使用 alt=\"opens new window\" 来实现。或者，图片可以是装饰性的，而链接本身可以具有\
  \ aria-label 属性，其中包含可见文本。例如，如果可见标签是 \"Learn more\"，代码可以是 aria-label=\"Learn more\
  \ about Mortgages. Opens new window.\"\n\n##### 避免图片中的文本\n\n我们已经了解了 alt 文本的重要性，但让我们考虑另一个图片-文本问题：图片中的文本无法被屏幕阅读器软件解析，因此对非视障用户来说完全丢失。\n\
  \n例如，横幅广告是糟糕的设计。它们包含大量文本，通常挤在受限的布局中，使字体大小变小且通常难以阅读，尤其是视力低下的人。对于页面、移动屏幕或文档上的所有内容，请与\
  \ UI 设计师合作并告知他们避免使用嵌入文本的图片。\n\n相反，使用页面上的真实文本，并与 UI 设计师合作在下方创建背景图片。对于文本，请要求他们使用 Arial\
  \ 或 Verdana 等系统字体以获得最佳可读性。\n\n出于实际原因，有时遵循此指导并不现实。尽可能使用系统字体，但在图片中包含文本的情况下，该文本需要在\
  \ alt 值中反映出来。\n\n\n\n\n\n两种字幕类型为开放式和封闭式。开放式字幕始终可见于视频中，而封闭式字幕则可由观众在视频播放器中打开或关闭。出于可访问性考虑，出于此原因，更可取的是使用封闭式字幕，并且你应始终提供它们。然而，在视频中使用文字标题也很重要，尤其是在开头介绍主题时，并在屏幕上显示发言人的姓名和职称。\n\
  \n以下是优化字幕对听障或重听人士影响的最佳实践。同样，暂时无法听到声音的人也会受益：\n\n- 字幕应与口语对话和音效精确匹配。\n- 字幕应清楚标明说话人，尤其是在群体对话中。首次使用全名，然后如果屏幕空间有限，可用名字称呼该人。\n\
  - 字幕应包含相关的非语音音频（例如，[掌声]，[门吱呀声]）。\n- 保持字幕简洁，限制每行文字（最好最多 32 个字符），并在自然的语音停顿处换行。\n-\
  \ 如有需要，提供翻译以提高可访问性。\n- 如果你使用软件平台或 YouTube Studio 来管理视频内容和字幕，你将控制此项。将字幕与音频中的语音同步，并留出足够的时间让用户阅读。\n\
  - 软件平台可以为你自动生成字幕，YouTube Studio 也有此免费功能。然而，据说准确率在 70% 到 80% 之间。务必校对并编辑以确保清晰和正确。\n\
  \n##### 文字稿\n\n字幕出现在视频屏幕上，而文字稿则是作为单独文本文档提供的内容的书面版本。书面文本包括字幕中的内容——音频描述、口语对话和重要声音——但它还应包括从头到尾屏幕上发生的事情的描述，以便不会遗漏视频中以视觉方式传达的任何信息。\n\
  \n与字幕一样，文字稿为听障和/或重听人士提供了音频轨道的媒体替代方案。它们支持一些有认知需求、记忆力丧失或注意力和专注力缺陷（ADHD）的用户，他们更喜欢按自己的节奏阅读文本，而不是一次性观看或收听整个视频。\n\
  \n以下是创建文字稿的一些最佳实践：\n\n- 逐字转录口语，并准确体现说话者的语气和意图。\n- 确保详细描述开场场景、标题和出现的文字，然后提供对发言人、物体和动作的描述。如有需要，包括对故事重要的发生在屏幕外的任何动作或声音。\n\
  - 与字幕一样，用说话人的全名作为对话的前缀。如有需要，你可以在其余文字稿中只使用他们的名字。\n- 包含相关的音效、音乐提示和重要的背景噪音（例如，[笑声]，[电话铃响]）。\n\
  - 将文本分成段落，使用时间戳（如有需要），并保持可读性。\n- 在发布前确保语法、标点和清晰度正确。\n- 提供基于文本的格式（例如，.txt、.doc 或\
  \ HTML）以便于索引和可访问性。\n- 提供可下载版本（例如，纯文本、PDF）以提高灵活性。\n\n##### 手语\n\n根据加州大学的研究（https://mayberrylab.ucsd.edu/papers/Chamberlain%26Mayberry08.pdf），手语——而不是书面英语——是许多聋人用户的第一语言。阅读字幕意味着瞬间在语法和词序不同的第二语言之间切换。在\
  \ Yoon & Kim 于 2011 年对 62 名以手语为首的聋人成年人的在线学习实验中（https://www.researchgate.net/publication/51669191），字幕提高了理解力，但并未减少认知努力。手语视频仍然更受欢迎。\n\
  \n因此，如果可能，请考虑在你的预录视频中提供手语。搜索你所在地区的机构以提供手语翻译（全球有超过 300 种手语）。他们会录制手语会话，可嵌入到视频输出中。\n\
  \n##### 视频和音频的格式组合\n\n如果你选择视频、动画或电影格式，请确保已准备好替代方案：\n\n- 如果你使用视频，请包含可打开、关闭并在视频播放器中控制的封闭式字幕。包含带有音频描述写入其中的文字稿。\n\
  - 创建一个嵌入了音频描述音轨的单独视频。\n- 如果你使用音频片段，请包含文字稿。\n- 如果你使用播放时间超过三秒的动画，请包含描述目的、动作和任何声音的文字稿。反复闪烁超过\
  \ 3 秒的闪烁元素可能会因光敏性而诱发癫痫。\n- 如果你使用动画 GIF，与静态图像一样，请包含有意义的替代文本。\n\n总之，视频和音频可以成为内容的强大格式，但这些格式会排除具有某些需求和残疾的人。因此，请记住始终以字幕、文字稿和视频及音频文件的标题形式提供文本替代。\n\
  \n##### 社交媒体\n\n社交媒体是指人们在线上用于交流和创建社区的音频、视频、文本、图像、图标、插图以及任何其他媒体格式。其目的是分享观点或想法，或推广你的故事、信息或内容。发布内容的社交媒体平台包括\
  \ YouTube、TikTok、Facebook、X（前身为 Twitter）、LinkedIn、Snapchat 和 Reddit。\n\n作为内容创作者，以下是准备社交媒体内容的无障碍最佳实践：\n\
  \n- 在撰写文本帖子时，对多词标签中的每个单词进行大写（例如，#AccessibleDesign 而不是 #accessibledesign）。\n- 尽可能为非文本内容（如图像和\
  \ GIF）提供描述性替代文本。一些 CMS 平台没有内置此功能——请与某人讨论更新此项。\n- 避免在撰写帖子时过度使用表情符号或特殊字符。这是因为表情符号带有替代文本，这可能导致不准确。例如，双手合十的表情符号常被用来表达感谢，但实际上是祈祷的图示——这可能导致你的书面上下文说“谢谢”，但表情符号的替代文本说“祈祷”。此外，表情符号的替代文本可能非常字面化。例如，西红柿\
  \ emoji 的替代文本为“eggplant”，但此 emoji 用于表示完全不同的东西。\n- 保持发布的消息简洁且结构化。\n- 提供视频字幕和文字稿。\n\
  \n再次，应用为不同用户提供内容替代的原则。这些最佳实践支持盲人、低视力、学习困难和神经多样性（ADHD、自闭症）用户，以及听障和重听人士。\n\n作为总结，在设计在线内容发布时，应用考虑多位用户的原则。记住不同用户将如何体验你的信息。提供多种内容格式显示了你对他们需求的体贴。\n\
  \n接下来，让我们看两个应用最佳内容实践的案例研究。\n\n##### 快速案例研究\n\n以下是关于处理文本和图像的两个情景示例。两者都探讨了内容作者的视角，但也提供了用户在体验内容时的视角。\n\
  \n##### 案例研究 1：Sarah，一名与信息图表合作的内容作者\n\n###### 内容作者的视角\n\nSarah，一名内容创作者，正在设计关于气候变化影响的信息图表。她合作的\
  \ UI 设计师提供了一些图形（人物和云朵的图标、饼图和统计数据、以及显示天气降水循环的箭头）。Sarah 希望确保非视力用户能够获取与视力用户相同的信息。\n\
  \n她可能面临的挑战如下：\n\n- 信息图表高度视觉化，依赖图表、图像和图标\n- 盲人依赖屏幕阅读器，无法解读视觉元素\n- 如果没有适当的无障碍措施，重要数据可能会丢失\n\
  \n现在让我们看看 Sarah 如何使信息图表更易访问：\n\n- Sarah 可以撰写**详细的替代文本**来总结信息图表的关键要点——例如：\n- “此信息图表解释了气候变化的五大主要影响：气温升高、冰盖融化、极端天气、海平面上升和生物多样性丧失。每个部分都包含一个统计数据和相关图标。”\n\
  - 在信息图表下方，Sarah 还可以提供所有内容的**文本版本**。在这种情况下，她可以写下以下内容：\n- “标题：气候变化影响\n- 1. 气温升高 –\
  \ 全球气温自工业化前以来已上升 1.2°C。\n- 2. 冰盖融化 – 北极冰层每十年缩小 13%。”\n\n\n\n\n\n+   3. 极端天气 – 更频繁的飓风、干旱和野火。\n\
  +   4. 海平面上升 – 沿海城市因海洋水位上升而面临风险。\n+   5. 生物多样性丧失 – 许多物种因栖息地破坏而濒临灭绝。”\n\n+   - Sarah\
  \ 还可以为喜欢替代格式的用户提供信息图的下载版纯文本或结构化 PDF 版本。\n\n###### 用户视角\n\n在这种情况下，用户是盲人，使用屏幕阅读器浏览网页。当他们打开屏幕阅读器语音输出并用向下箭头键浏览页面时，他们会落在信息图上（一个\
  \ .png 文件）。\n\n首先，屏幕阅读器会宣布“图像”，然后大声读出 Sarah 创建的简短详细替代文本，以及开发人员编码到图像中的文本。这让盲用户知道他们遇到了什么（图像）以及内容的快速摘要。接下来，用户按下向下箭头键继续浏览页面。他们会落在可折叠内容部分（手风琴），该部分有一个\
  \ Sarah 提供的标题（“气候变化影响”），并通过按钮进行展开和折叠。屏幕阅读器会宣布“按钮。气候变化影响。已折叠。”\n\n通过遵循这些步骤，Sarah\
  \ 确保盲用户也能访问信息图的信息。这提高了包容性、用户体验并符合无障碍标准。\n\n##### 案例研究 2：Kavana，在网站上为按钮添加标签\n\n######\
  \ 内容作者视角\n\nKavana 是零售公司网站的内容作者。该公司有多个职位空缺，因此他们希望在主页上添加一个号召性用语按钮，引导用户前往其招聘网站的落地页。Kavana\
  \ 正在阅读 Steve Krug 的书《Don't Make Me Think》。书中提供了一个插图，包含三个按钮示例，每个按钮的标签都不同。顶部有一个从“显而易见”到“需要思考”的刻度。一个代表网站用户的男人正在查看每个按钮并试图决定选择哪一个。\n\
  \n在“显而易见”的一端，按钮标签写着“Jobs”。第二个按钮标签在中间，“Employment Opportunities”。第三个按钮标签在“需要思考”的一端。它写着“Job-o-rama”。Kavana\
  \ 希望在标签措辞上做出包容性的选择。最后，她选择了“Jobs”。\n\n###### 用户视角\n\nKavana 开始思考用户将如何理解和解读她选择的标签。\n\
  \n“Jobs”是按钮/链接及其目的地的最简单、最清晰的描述性标签。标签“Employment Opportunities”对于按钮标签设计来说有点长，在此特定页面上占用了空间。用户需要花费更多毫秒来计算其含义并得出结论，该按钮也必须引导他们进入招聘页面。\n\
  \n使用“Job-o-rama”标签，用户被迫弄清楚按钮的目的或目的地。它可能是工作，或其他东西。“o-rama”是什么？这指的是什么？非英语母语者可能无法理解。用户会问自己，按钮会带我进入职位列表网页，还是一个名为\
  \ Job-o-rama 的活动？在用户能够采取行动之前，猜测所花费的时间会太长。\n\n这两个示例提供了内容作者和最终用户决策过程的见解。在最后一节中，我将分享一个您可以进行的练习，以收集案例研究和场景。这将加强您一致、包容的写作实践。\n\
  \n##### 进行需求漫游练习\n\n需求漫游练习是一种活动，您可以在任何时候进行，以测试您的内容创意或原型是否满足五种不同残疾类型的需求。目标是思考残疾用户的需求，并确保您的内容能够满足这些需求。这让您更了解并更有信心，您正在实现无障碍和包容性。\n\
  \n该练习本身非常低保真，通常不需要花费任何费用，除了您的时间。您可以独自或与团队一起进行，只需一起审阅内容并询问，这是否满足人们的需求？如果您想直接与真实用户互动，相关费用将是补偿残疾人士在初步用户访谈中花费的时间。\n\
  \n让我们看看如何准备和完成该练习。\n\n###### 第 1 步：收集残疾需求清单\n\n如果可以，请直接从残疾人士那里收集用户体验和残疾需求。使用 Google\
  \ 表单发送调查，或让人们在 Word 文档上回答问题。或者，通过 Zoom、Google Meet 或 Microsoft Teams 等具有内置实时字幕的无障碍视频会议平台安排一对一或团体用户访谈。这些平台具有内置的实时字幕，可供听力困难的人使用。\n\
  \n如果选择访谈方式，您有两个选项：\n\n- **选项 1 – 仅收集一般用户需求：** 保持访谈开放式和对话式。通过询问某人他们使用哪些类型的辅助技术、如何以及何时使用它们、哪些设计最适合他们，以及哪些设计会造成障碍，来主持访谈。Fable\
  \ Tech Labs 将企业与使用辅助技术并为其测试产品的社区联系起来。Fable 提供了两篇有用的文章：*Planning Your User Interview*（https://makeitfable.com/article/planning-your-user-interview/）和\
  \ *5 Questions You Should Ask In Your Interviews*（https://makeitfable.com/tutorial/5-questions-you-should-ask/）。视频访谈后，您可以回顾会议录音和文本记录以供日后参考。\n\
  - **选项 2 – 使用访谈进行漫游练习：** 第二个选项是在视频访谈期间从人们那里收集一般用户需求，但同时也让他们与您一起浏览用户旅程/原型。立即获得好坏反馈。有关练习的完整细节，请参阅*第\
  \ 2 步至第 4 步*。\n\n如果您无法联系到真实用户，*W3C Diverse Barriers and Abilities* 网页（https://www.w3.org/WAI/people-use-web/abilities-barriers/）是一个很好的替代方案。它提供了五种残疾类型及其在使用数字产品时的需求和偏好的列表。\n\
  \n在回顾这些内容后，请阅读 *Stories of Web Users*（https://www.w3.org/WAI/people-use-web/user-stories/）并将其作为练习的起点。创建一个电子表格或检查清单。复制并粘贴个人的一般简介，列出对用户有效的设计，然后记录对他们造成障碍的设计。这样，您就可以建立一个可供使用的用户角色库。\n\
  \n###### 第 2 步：确定要测试的标准和结果\n\n您现在已经了解了用户体验——设计中什么有效，什么无效。现在是时候收集您在运行需求漫游练习时想要测试的标准了。可用性至关重要，但同时测试您的设计原型是否符合法律无障碍标准也是一个好主意。\n\
  \n####### 使用 WCAG 浏览您的内容\n\nWeb Content Accessibility Guidelines（WCAG）是数字无障碍的全球标准，并在许多国家的法律中被引用。如前所述，WCAG\
  \ 分为四个类别：可感知、可操作、可理解和健壮（POUR）。\n\n您可以在 *How to Meet Quick Reference Guide* https://www.w3.org/WAI/WCAG22/quickref/\
  \ 上查看完整的指南列表。在此页面上，您可以根据内容筛选列表。这将显示与您的工作相关的指南（成功标准）。\n\nW3C 还为满足认知和学习障碍（https://www.w3.org/WAI/WCAG2/supplemental/#cognitiveaccessibilityguidance）的\
  \ WCAG 成功标准和低视力（https://www.w3.org/WAI/WCAG2/supplemental/#-low-vision-accessibility-guidance）创建了两个有用的补充指南。\n\
  \n####### 测试功能需求\n\nEN 301 549 是欧洲的无障碍标准。其功能需求列表是满足残疾需求的简单用户陈述，强烈建议您将其添加到您的检查清单/电子表格中。只需将其剪切并粘贴到您的电子表格中。功能需求是，对于任何信息通信技术，以下几点都是可能的：\n\
  \n- 无需视觉即可使用\n- 视觉受限时可使用\n- 无需听觉即可使用\n- 听觉受限时可使用\n- 无或有限的语言能力即可使用\n- 操作或力量受限时可使用\n\
  - 活动范围受限时可使用\n- 最小化光敏性癫痫触发因素\n- 认知、语言或学习能力受限时可使用\n\n加拿大政府网站在此列出了功能需求，以及与产品设计相关的其他要求，包括物理和数字（https://accessible.canada.ca/en-301-549-accessibility-requirements-ict-products-and-services-1）。\n\
  \n###### 第 3 步：计划您的练习活动\n\n现在您已经有了要测试设计创意或原型的可用性和无障碍测试指标，是时候计划活动了，即您的需求漫游练习。\n\n\
  \n\n\n理想情况下，你会召集UI设计师、UX设计师和开发者一起评审设计原型，不仅从书面内容的角度，还要从用户界面体验的整体设计角度。你们可以一起评审用户故事，然后是标准指南和功能需求。\n\
  \n然而，如果你想独自进行“需求走查练习”，你也可以这样做，并从中了解残障人士如何仅与你的内容互动。也许你只有文档中的想法，涉及书面文本、标签、说明和替代文本选择。\n\
  \n##### 步骤4：进行走查练习\n\n现在是时候进行练习了。让我们看看要采取哪些行动。\n\n###### 行动1：评审用户故事和标准\n\n无论是团队还是个人，进入你的检查清单/电子表格，熟悉代表最多五种残障类型的用户故事，这些故事来自用户访谈或WAI资源。记住他们说过的对内容有效和无效的做法。\n\
  \n接下来，查看你已创建的任何检查清单，并将它们作为支持用户故事的指南牢记在心。\n\n记住，在用户旅程中要留意正在使用哪种辅助技术（如果有）。例如，如果你以盲人用户的身份使用键盘和屏幕阅读器软件来走查体验，请思考语音输出的听感，尤其是当页面标题顺序混乱或使用链接时。\n\
  \n###### 行动2：复现五种用户旅程中的每一种\n\n像这样复现五种残障类型：\n\n- 1. 针对第一种残障类型，使用你的原型并走查你的内容想法或设计线框图，从头到尾捕捉用户旅程或任务。\n\
  - 2. 对其余四种残障类型重复此练习。\n- 3. 如果有时间，可以考虑组合残障类型（例如，想象你正作为一位患有多动症和低视力的人使用你的原型）。\n- 4.\
  \ 在牢记需求和标准指南的情况下，对照你的研究和计划评估用户旅程。你是否遇到了用户面临的障碍？如果是，请继续进行行动3。\n\n##### 行动3：记录你遇到的任何障碍\n\
  \n作为用户，有些事情感觉不对，或者你被设计完全挡住了去路，无法继续。问自己以下问题，并在电子表格中做笔记：\n\n- 障碍的本质是什么？是内容不清晰，还是某种内容格式类型缺少替代方案？\n\
  - 所面临障碍的严重程度如何？\n  - 严重（Critical）：患有这种残障的用户无法使用系统、网站、应用、社交媒体帖子等的任何部分\n  - 高（High）：患有这种残障的用户会发现使用系统、网站、应用、社交媒体帖子等具有挑战性\n\
  \  - 中（Medium）：用户可以在功能受限的情况下继续使用\n- 该障碍是否不符合WCAG成功标准？如果是，是哪一个？\n- 该障碍是否不符合301 549功能要求？如果是，是哪一个？\n\
  - 你推荐的修复方法是什么？\n- （如果相关）你是否会保留内容格式，但确保提供替代方案？\n- （如果相关）以尽可能简单的方式传达信息，是否更易于管理，并且对最终用户更好？\n\
  \n##### 行动4：记录你的解决方案\n\n现在，你已经捕获了原型中存在的低、中或严重级别的可访问性和可用性障碍，这些障碍可以在早期阶段修复或移除。利用你从用户故事或访谈以及标准中收集的知识，借助这些资源对内容变更提出建议，并将它们记录在电子表格中。\n\
  \n##### 步骤5：分享你所学到的东西\n\n现在你已经完成了针对最多五种残障类型（可能还有几种组合类型）的练习，以下是一些分享所学内容的方法：\n\n-\
  \ 记录在走查原型过程中出现的任何额外用户旅程，这些旅程可能特定于你公司的产品或任务。按照W3C的Web用户故事（W3C Stories of Web Users）的相同方式写出它们，包括姓名、残障类型、使用的辅助技术、设计和体验偏好，以及需要避免的障碍。\n\
  - 从原始电子表格中提取所有笔记，连同任何用户访谈录音、视频和文字记录，并与团队在一个中心位置共享。定期回顾以保持知识常新。\n- 在真实网站或移动应用上复现用户旅程。拔掉键盘和/或在网页或文档上运行屏幕阅读器，亲自体验一下，永远没有坏处！\n\
  \n##### 步骤6：确定由谁解决问题\n\n之后，还有一个额外的步骤是确定谁负责修复你发现的问题和障碍。你可能已经将由内容引起的障碍视为自己需要处理的问题；然而，有时你需要与设计师或开发者合作才能完全消除障碍。\n\
  \nW3C还发布了一个有用的**可访问性角色与责任模型（ARRM）**资源，名为*可访问性涉及的任务*，用以补充构成WCAG指南的**成功标准（SC）**。每个标准都有一个主要责任人、次要责任人和贡献者——即负责确保该标准得到满足的人。其中分别对应内容作者、UX设计师、UI/视觉设计师和前端开发者。\n\
  \n这是另一个很好的团队练习，让团队一起审查需要修复什么、如何修复以及由谁修复。请访问ARRM网站，查看哪些WCAG SC主要由内容作者负责：https://www.w3.org/WAI/planning/arrm/tasks/。\n\
  \n如你所见，需求走查练习作为一种实践方法具有高度可定制性，其目标是让你以每种残障类型的用户的身份，从头到尾走查一遍用户体验。这样做可以让你迅速识别障碍，从而改写内容、重新考虑所选格式，或在需要时添加替代方案。你可以作为内容作者独自完成，将你对用户需求的知识应用到自己的文本、图片和多媒体内容中；也可以与视觉设计师、用户体验设计师和开发者一起进行练习，为项目的各个方面提出解决方案。\n\
  \n#### 总结\n\n在本章中，你学到了在创建内容时牢记多种用户至关重要。你了解了包容性沟通的力量，以及用平实、简单的语言将信息传递给尽可能多的最终用户，无论是通过网页、移动屏幕、文档还是社交媒体平台。你学到了为按钮和控件提供易于理解的标签和说明的重要性。确实，内容为王，但现在我们了解了不同人群的需求，你也就明白了为什么清晰同样为王。\n\
  \n在应用内容策略时，你学会了选择最具包容性的内容格式，以满足大多数残障人士的需求。如果你选择了排除某些用户的格式，如图像、视频和音频片段，使用它们也没问题。你只需要为有视觉和听觉障碍的人提供文本替代方案。\n\
  \n你已经在创建内容时培养了包容性思考的技能。然而，你需要确保持续捕捉并满足受众的残障需求。为此，你学会了如何进行一种免费且有效的练习，以针对不同人群的需求测试你的书面内容和格式选择。你可以独自练习，也可以与团队中的设计师和开发者合作。人是你的策略核心。你正在为改变数字世界贡献自己的一份力量。\n\
  \n在下一章中，你将了解如何开发可访问的网站，特别关注语义HTML、CSS和ARIA。\n\n现在想象一下，如果在你的HTML、CSS或JavaScript第一课中同时教授可访问性原则，那么你今天对网络及其用户的理解会有多大不同？本章的目标是帮助你采用一种“可访问性优先”的思维方式，将可访问性融入你所做的每一个决策中。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- 使用语义HTML构建内容\n- 使用CSS实现可访问性样式\n- 使用ARIA增强动态效果\n- 开发者的测试责任\n\
  \n我真诚地希望，在本章结束时，你将永远不会忘记所学的关于可访问性的知识。你可能仍会遇到自己构建的内容并非100%可访问的时刻，但我希望你能意识到这一点。我希望这会让你感到不安，不是因为内疚，而是因为你明白这对于试图使用你的创作的人来说意味着什么。网络是为每个人准备的，所以让我们以这样的态度开始编码吧。\n\
  \n![](img/3bdc9e2d41de898f8a3bcc9634b0000e_176_0.png)\n\n“可访问性优先”的思维方式意味着将包容性置于每个决策的核心。它将关注点从为假定的“默认用户”设计转变为为每个人设计。\n\
  \n问问自己：我是在为谁创造这个？预期的目的和结果是什么？我是否考虑过这个功能将如何为依赖屏幕阅读器、键盘或语音控制的用户工作？这些问题会带来更好、更周到的设计，使其适用于所有用户。\n\
  \n忽视可访问性不仅仅是错失机会——它会将人们排除在改变生活的产品和服务之外。通过将包容性作为优先事项，你正在构建一个公平、公正且友好的网络。\n\n#####\
  \ 使用语义HTML构建内容\n\n你还记得你创建的第一个超文本标记语言（HTML）项目吗？我打赌是那个著名的“Hello World”项目。啊，初学编程的日子——学习使用强大的\
  \ < 和 > 符号来编写开始和结束标签，以及弄清楚一个简单的 / 如何将开始标签变成结束标签。那些发现的时刻真是太神奇了。\n\n\n\n\n我至今仍记得在\
  \ The Last Mile 上上的第一堂 *Intro to Programming* 课上学到的一件事，它一直伴随了我这么多年。讲师用人体来类比解释 HTML、CSS\
  \ 和 JavaScript。HTML 是骨骼结构——基础。CSS 是皮肤、头发和眼睛颜色，在骨架之上提供样式。而 JavaScript 呢？那是大脑——控制中心，让整个身体具备功能。就像身体需要强壮的骨骼一样，一个网站需要结构良好的\
  \ HTML 来保持稳定。\n\n理解 HTML 如何提供结构只是开始。要真正构建可访问、有意义的网站，我们需要更深入，从非语义 HTML 和语义 HTML 的区别开始。\n\
  \n##### 定义非语义 HTML\n\n要欣赏语义 HTML，首先要理解它的对立面，**非语义 HTML**。它指的是诸如 `<div>` 和 `<span>`\
  \ 之类的通用元素，它们构建网页但不传达含义或上下文。\n\n正如开发者和作者 Manuel Matuzović 所说，“A div is not a button。”\
  \ `<div>` 元素是一个“纯”容器。根据 MDN Web Docs：“作为一个‘纯’容器，`<div>` 元素本身并不代表任何东西。相反，它用于将内容分组，以便使用\
  \ class 或 id 属性轻松设置样式，将文档的某个部分标记为使用不同语言编写（使用 lang 属性），等等。”\n\n![](img/3bdc9e2d41de898f8a3bcc9634b0000e_177_0.png)\n\
  \n图 7.1：提醒：A <div> is not a <button>! #A11y (A11y = Accessibility)\n\n非语义 HTML 的问题在于它提供了结构但没有意义。就像把内容放在一个看不见的盒子里——屏幕阅读器和搜索引擎无法判断它的用途，有时甚至无法察觉它的存在。`<div>`\
  \ 和 `<span>` 元素，例如，并不传达其内容的用途，使得辅助技术和搜索引擎爬虫更难理解或正确解释页面。\n\n##### 定义语义 HTML\n\n**语义\
  \ HTML** 使用能够固有描述其用途的元素来构建网页，使内容更具意义和可访问性。诸如 `<header>`、`<article>` 和 `<section>`\
  \ 之类的标签提供了对其角色的清晰定义，使浏览器和辅助技术能够有效地解释和导航页面。这提高了可读性，增强了可访问性，并通过为内容提供逻辑层次结构来加强搜索引擎优化。\n\
  \n通过根据其预期角色使用元素而不是视觉上设置非语义元素的样式，开发者可以创建结构良好且直观的网络体验。例如，`<footer>` 自然表示结束信息，而 `<nav>`\
  \ 清楚地定义了一组导航链接。这些区别提供了清晰度，确保用户，尤其是依赖辅助技术的人，能够以有意义的方式与网络内容交互。\n\n让我们来看一下这段代码块：\n\n\
  ```html\n<!-- Semantic HTML: Native button -->\n<button type=\"submit\">Submit</button>\n\
  \n<!-- Non-semantic imitation: Recreating a button with a <div> -->\n<div\n    role=\"\
  button\"\n    tabindex=\"0\"\n    onclick=\"submitForm()\"\n    onkeydown=\"if (\n\
  \        event.key === 'Enter' || event.key === ' '\n    ) submitForm();\"\n>\n\
  \    Submit\n</div>\n```\n\n第一个示例使用语义化的 `<button>` 元素，它默认可访问并支持键盘交互、屏幕阅读器和无需额外代码的表单提交。第二个示例展示了一个带有\
  \ `role=\"button\"`、`tabindex=\"0\"` 和 JavaScript 事件处理程序的 `<div>`，以模仿按钮行为。这种方法增加了复杂性，并可能遗漏关键的可访问性功能。\n\
  \n##### 为什么语义 HTML 很重要？\n\n语义 HTML 通过以下方式增强你的网站：\n\n- **有意义的标记：** 内置角色（例如 `<header>`\
  \ 作为“banner”）和诸如 `<nav>` 和 `<main>` 之类的元素为屏幕阅读器提供有意义的结构，使导航更轻松。通过使用语义 HTML，开发者可以创建一种网络体验，使用辅助技术的用户可以高效地定位内容，跳过重复部分，并像使用鼠标或触摸的用户一样无缝地导航页面。\n\
  - **逻辑层次结构：** 正确使用语义标题（`<h1>` 到 `<h6>`）可确保内容直观地结构化，提高所有用户，包括使用辅助技术用户的导航性。除了帮助屏幕阅读器之外，定义良好的标题结构还增强了视觉层次结构，引导用户视线自然地浏览内容。由于大多数人浏览网页而不是逐字阅读，清晰的标题使快速定位关键信息变得更容易。\n\
  - **SEO：** 诸如 `<article>` 和 `<h1>` 之类的标签可提高内容的可发现性和搜索排名。就像辅助技术一样，搜索引擎依赖语义 HTML 来理解内容的结构和相关性，有助于更准确地索引页面并有效排名。\n\
  - **辅助技术支持：** 诸如 `<form>` 和 `<label>` 之类的元素协同工作以创建可访问的工作流程，确保依赖辅助技术的用户可以有效地导航表单。`<label>`\
  \ 元素为表单字段提供清晰的文本描述，而 `<fieldset>` 和 `<legend>` 则为分组输入提供上下文。适当的语义标记可确保用户可以使用键盘或语音命令顺利完成表单，使交互更具包容性和可访问性。\n\
  - **键盘导航：** 交互元素如 `<button>` 支持键盘使用并有效传达状态。与需要额外脚本才能交互的 `<div>` 或 `<span>` 不同，原生\
  \ HTML 元素如 `<button>`、`<a>` 和 `<input>` 自动可聚焦并响应键盘事件，如 Tab、Enter 和 Space。使用语义元素可确保交互组件开箱即用即可访问，无需为事件处理程序或键盘焦点编写脚本修复。\n\
  \n使用适当的语义标记为辅助技术创建了路线图，使残障用户能够更有效地导航。除了可访问性之外，语义 HTML 还改善了协作和 SEO。开发者可以更轻松地理解你的代码，搜索引擎可以更好地对你的网站进行分类。掌握语义\
  \ HTML 意味着编写富有同理心、合乎逻辑的代码，使开发者、用户和机器都受益。\n\n语义 HTML 通过赋予内容意义和清晰度，为可访问性奠定了结构基础。但结构\
  \ alone 不够；我们 *style* 该内容的方式也在可用性和包容性方面发挥着至关重要的作用。让我们把注意力转向 CSS，探索深思熟虑的样式选择如何支持更具包容性的体验，让所有用户受益。\n\
  \n##### 使用 CSS 进行包容性设计的样式\n\n**层叠样式表（CSS）** 是现代网页设计的造型师，将基本的 HTML 结构转变为视觉吸引且响应迅速的体验。但你实现\
  \ CSS 的方式可能会破坏可访问性。\n\nCSS 中的可访问性不仅仅是看起来好——它关乎 *为每个人工作*。考虑不周的样式可能会为视力低下、认知挑战或运动敏感的用户制造障碍。高对比度的按钮可能意味着完成购买与因沮丧而离开网站之间的区别。键盘用户依赖可见的焦点样式进行导航，而运动敏感的人可能需要关闭动画。\n\
  \n好消息是？通过采用深思熟虑的最佳实践，你可以确保你的 CSS 增强设计具有包容性、可使用且仍然美丽。\n\n##### 确保足够的颜色对比度\n\n如果用户无法阅读你的内容，再聪明的设计也无济于事。**Web\
  \ Content Accessibility Guidelines（WCAG）** 设定了最低对比度比率以确保可读性：\n\n- **普通文本**（如正文）必须与其背景的对比度比率为\
  \ 4.5:1\n- **大文本**（18pt 常规或 14pt 粗体）需要较低的最低比率 3:1，因为其尺寸使其更易于阅读\n- **有意义的用户界面组件**（如表单字段边框或焦点指示器）和图形对象（如图标或图表）也需要与其背景的对比度比率为\
  \ 3:1 才能保持清晰和可区分\n\n让我们来看一下这个示例：\n\n\n\n![](img/3bdc9e2d41de898f8a3bcc9634b0000e_181_0.png)\n\
  \n图 7.2：比较装饰性文本的颜色对比度不足与足够\n\n顶部示例显示浅紫色背景上的白色草书文本，这不符合 WCAG 对比度要求，并且对许多用户来说难以阅读。底部示例在相同背景上使用深紫色文本，通过对比度检查并提高可读性，同时保持视觉风格。\n\
  \n未能满足这些标准会使低视力、色盲或受眩光或照明条件不佳影响的用户难以或无法感知内容。现在想象一下，一个网页使用低对比度的草书文本，可能看起来“时髦”，但如果用户无法阅读你的内容，那还有什么意义？通过确保适当的颜色对比度，你等于递给用户一支明亮的手电筒，而不是让他们在黑暗中摸索。\n\
  \n##### 避免使用 CSS 添加重要内容\n\nCSS 伪元素（::before 和 ::after）可用于装饰目的，但不应用来插入关键内容。屏幕阅读器可能无法一致地解释伪元素内容；它可能会被忽略、重复或脱离上下文地读出。\n\
  \n如果你使用伪元素来添加标签、说明或必填字段指示符，那么依赖辅助技术的用户极有可能错过这些内容。诸如 ::before 和 ::after 之类的伪元素不存在于\
  \ DOM 中，因此你不能直接对它们应用 ARIA 属性。例如，如果使用带有 ::before 的装饰性图标，屏幕阅读器仍然可能会读出发送的内容——除非父元素被包裹或样式化，使得实际\
  \ DOM 元素上包含 aria-hidden=\"true\"。\n\n为了满足这些需求，请使用相对单位和灵活布局，以优雅地适应：\n\n- 使用 rem 作为字体大小，它相对于根（`<html>`）元素缩放，并尊重用户定义的偏好。\n\
  - 在组件内部使用 em 进行间距，使内边距和边距能够根据文本大小进行调整。\n- 避免为文本和布局使用固定的像素（px）值，因为它们不会响应浏览器缩放或操作系统级别的缩放。\n\
  - 确保布局在窄视口下能够重新流动，而不会截断或隐藏内容。使用 flex-wrap、媒体查询或 CSS grid 等技术，使元素能够自然地堆叠或移动：\n  -\
  \ flex-wrap：允许 flex 项换行，防止它们缩得太小或溢出容器。\n  - 媒体查询：在不同断点处应用不同样式，使布局能够跨屏幕尺寸响应式调整。\n\
  \  - CSS grid：一种强大的布局系统，允许你创建二维布局，调整列和行以适应不同的屏幕尺寸。\n- 测试所有交互元素——包括表单、按钮和链接——以确认它们在高缩放和小屏幕上的功能和可见性。\n\
  \n通过将灵活的 CSS 与相对单位相结合，你可以创建响应式、无障碍的体验，适用于包括低视力用户或使用移动设备导航的用户在内的所有人。\n\n##### 提供高度可见的焦点样式\n\
  \n焦点指示器是视觉线索，用于突出显示当前聚焦的交互元素，例如按钮、链接或表单字段。当用户使用键盘（例如通过 Tab 键）导航页面时，这些指示器通常会出现，帮助用户跟踪他们在页面上的位置。\n\
  \n要有效应用焦点样式，理解焦点与焦点可见之间的区别很重要：\n\n- `*:focus`：只要元素被聚焦，就应用焦点样式，包括通过鼠标点击或键盘导航时。\n\
  - `*:focus-visible`：专门针对键盘用户（或依赖焦点导航的输入方法），当通过鼠标点击元素时不应用样式。\n\n一些开发者完全移除焦点样式，因为它们与视觉设计冲突，往往没有意识到这些指示器对于无障碍访问是多么重要。没有它们，键盘用户只能猜测页面上的焦点在哪里，使导航变得混乱和令人沮丧。\n\
  \n这是一个不该做的示例：\n\n```\n*:focus {\n  outline: none;\n}\n```\n\n这完全移除了浏览器的默认焦点样式，使键盘用户没有任何视觉指示来了解他们在页面上的位置。\n\
  \n相反，应增强焦点指示器，使其与站点设计保持一致，同时保持清晰可见：\n\n```\n*:focus-visible {\n  outline-color:\
  \ #212121;\n  outline-style: auto;\n  outline-width: 2px;\n  outline-offset: 2px;\n\
  }\n```\n\n`outline-style: auto` 关键字允许浏览器应用其默认轮廓外观，该外观可能因平台或用户代理而异。虽然这有助于与原生焦点样式保持一致，但务必确保你的轮廓与站点背景具有足够的对比度和可见性。\n\
  \n`outline-offset: 2px` CSS 属性将轮廓稍微移出元素边缘，防止其被视觉压缩到边框上或与阴影重叠；这提高了清晰度，并帮助轮廓在浅色和深色背景上保持可见的\
  \ 3:1 对比度。\n\n确保焦点可见只是 CSS 支持无障碍访问的一种方式。接下来，让我们看看 CSS 中的包容性设计选择为什么对真实用户很重要。\n\n\
  ##### CSS 如何支持包容性设计\n\n包容性设计确保视觉样式适用于每个人，而不仅仅是那些使用鼠标、默认字体大小或明亮屏幕的人。当精心实施时，CSS 有助于消除障碍、强化内容结构，并允许界面适应广泛用户需求、设备和偏好。以下是当深思熟虑地使用\
  \ CSS 时，包容性设计支持的一些成果：\n\n- **更好的可读性**：高对比度文本和可见的焦点指示器有助于低视力或色觉缺陷（色盲）用户舒适地感知和交互内容。\n\
  - **内容与装饰的清晰分离**：将有意义的内容保留在 HTML 中，仅将 CSS 用于样式，可确保屏幕阅读器正确解释内容。\n- **减少运动敏感**：尊重用户减少运动的偏好，可防止因运动触发状况而受影响的用户感到不适和分心。\n\
  - **响应式缩放**：使用 rem 和 em 等相对单位允许布局和文本自然缩放，支持缩放和自定义字体大小而不会破坏设计。\n- **灵活布局**：响应式 CSS\
  \ 使你的设计适应各种屏幕尺寸和缩放级别，确保内容在 400% 缩放或窄视口下保持可用。\n- **键盘友好导航**：高度可见的焦点指示器帮助键盘用户了解自己在页面上的位置并高效导航。\n\
  \n即使具有结构良好的 HTML 和无障碍 CSS，在某些情况下，原生元素本身也无法提供所需的所有信息或交互。这时 ARIA 就派上用场了。如果使用得当，ARIA\
  \ 可以通过填补空白，使动态内容和自定义组件更易于辅助技术理解，从而增强无障碍访问性。\n\n##### 使用 ARIA 增强动态内容\n\n**无障碍富互联网应用（ARIA）**\
  \ 是当原生 HTML 无法满足需求时开发人员使用的工具集。由**万维网联盟（W3C）** 引入，ARIA 弥合了动态 Web 组件（如模态框、手风琴和滑块）与无障碍访问之间的差距。通过以编程方式使用\
  \ ARIA 属性，开发人员可以在原生 HTML 单独不够的情况下帮助辅助技术解释上下文和行为。\n\n在 ARIA 出现之前，开发人员很难构建能够被辅助技术理解的交互式组件。诚实地讲，现在许多人仍然如此——这正是需要这类指南的原因。ARIA\
  \ 属性为开发人员提供了一种以编程方式传达自定义组件的用途、状态和关系的方法，当原生 HTML 不足以满足需求时：\n\n- aria-expanded 可以告知辅助技术某个元素（如下拉面板、手风琴部分或菜单）当前是展开还是折叠。\n\
  - aria-labelledby 通常用于通过引用触发它们的按钮或选项卡来标记诸如手风琴面板或选项卡面板之类的元素。这确保辅助技术基于可见内容宣布清晰描述性的标签。\n\
  \n不过，重要的是要记住，ARIA 就像盐。在适当的时间、适当的量使用，可以让食物味道鲜美。但如果使用时间或量不对，就会毁掉体验。\n\n##### ARIA\
  \ 的五大规则\n\nW3C 概述了有效使用 ARIA 的这些基本原则：\n\n1. **首先使用原生 HTML 元素：** 如果你可以使用原生 HTML 元素或属性，并且已经内置了你所需的语义和行为（而不是重新调整元素用途并添加\
  \ ARIA 角色、状态或属性以使其可访问），那么就这样做。\n2. **除非确实必要，否则不要改变原生语义：** 不要通过更改元素的角色来覆盖 HTML 元素的含义。例如，不要直接将\
  \ role=\"tab\" 赋给像 `&lt;h2&gt;` 这样的标题——而应适当包装它。\n3. **所有交互式 ARIA 控件必须可键盘操作：** ARIA\
  \ 不提供键盘功能。如果你使用 ARIA 角色（如 role=\"button\"）构建自定义小部件，则必须手动编写键盘行为脚本——包括焦点、Enter 和空格键。\n\
  4. **不要在可聚焦元素上使用 role=\"presentation\" 或 aria-hidden=\"true\"：** 这些属性将元素从无障碍树中移除。如果该元素仍然可聚焦，则可能使屏幕阅读器用户困惑，因为焦点落在“虚无”上。\n\
  5. **所有交互元素都必须具有可访问名称：** 任何交互元素（如按钮、链接、表单输入或自定义小部件）都必须向辅助技术公开可访问名称。这有助于用户理解控件的用途。\n\
  \n\n\n\n\n第一条规则至关重要：优先使用原生 HTML 元素。在你使用 ARIA 之前，先仔细看看语义化 HTML 本身能做什么。它是网络可访问性的低调全能选手——内置元素自带有意义的角色、行为和键盘支持，有时甚至是\
  \ ARIA 也无法复制的。\n\n如果存在原生元素，就使用它。ARIA 是一种强大的工具，但它应该是你的最后选择，而不是第一直觉。没有什么比在明明可以使用 `<button>`\
  \ 的情况下，把 `role=\"button\"` 粘贴到一个 `<div>` 上更能说明“我没做研究”了。\n\n在应用 ARIA 自定义之前，务必参考最新的规范，以确保你正确使用角色、状态和属性。猜测或错误使用\
  \ ARIA 可能会让辅助技术感到困惑，最终损害而非帮助可访问性。例如，将 `role=\"navigation\"` 添加到 `<button>` 而不是使用适当的\
  \ `<nav>` 元素，可能会让屏幕阅读器用户感到困惑，因为它歪曲了元素的函数和目的。\n\n最新的 ARIA 规范 WAI-ARIA 1.2 于 2023\
  \ 年 6 月 6 日成为 W3C 建议书。它提供了使用角色、状态和属性的有效详细指导：https://www.w3.org/TR/wai-aria-1.2/。有关更多最佳实践，请参阅于\
  \ 2018 年 9 月 27 日发布为 W3C 工作草案的 Using ARIA 指南：https://www.w3.org/TR/using-aria/。\n\
  \n现在让我们更仔细地看看本节开头提到的两个 ARIA 功能：aria-expanded 和 aria-labelledby。\n\n##### aria-expanded\n\
  \naria-expanded 属性传达与元素关联的内容当前是否显示（true）或隐藏（false）。下拉菜单、手风琴和披露面板是此属性的常见用例。非视力屏幕阅读器用户尤其受益于它的存在，因为他们无法依赖视觉线索，例如箭头图标或滑动动画来了解内容是否已被揭示。\n\
  \n考虑一个常见的 FAQ 交互，用户点击问题以显示答案。视觉上，变化很明显。但对于屏幕阅读器用户，我们需要传达关联内容是展开还是折叠。aria-expanded\
  \ 属性使这成为可能。\n\n```\nHTML\n<button aria-expanded=\"false\" class=\"faq-toggle\">\n\
  \    What is your return policy?</button>\n<div class=\"faq-answer hidden\">\n<p>You\
  \ can return items within 30 days of purchase for a full refund.</p>\n</div>\n\n\
  CSS\n.hidden {\n    display: none;\n}\n\nJavaScript\nconst button = document.querySelector('.faq-toggle');\n\
  const answer = button.nextElementSibling;\n\nbutton.addEventListener('click', ()\
  \ => {\n    const expanded = button.getAttribute('aria-expanded') === 'true';\n\
  \    button.setAttribute('aria-expanded', String(!expanded));\n    answer.classList.toggle('hidden');\n\
  });\n```\n\n此设置使用 aria-expanded 来传达答案内容的当前状态，让屏幕阅读器用户获得与视力用户从视觉线索中获得的相同上下文。`.hidden`\
  \ 类确保内容在视觉上被隐藏，而不依赖 HTML hidden 属性，后者在 JavaScript 中切换时行为不同且可能导致问题。\n\n##### aria-labelledby\n\
  \naria-labelledby 用于将可见的文本标签以编程方式与页面上的另一个元素关联。这在文本标签未嵌套在被标记的元素内部但在视觉上与之关联时尤其有用。一个常见示例是使用描述其目的的标题来标记表单部分。\n\
  \n想象一个结账页面，其中付款表单在视觉上由一个标题引入。为了确保屏幕阅读器以有意义的名称宣布表单，开发人员可以使用 aria-labelledby 将表单容器与标题链接起来：\n\
  \n```\n<h2 id=\"payment-heading\">Payment Information</h2>\n<form aria-labelledby=\"\
  payment-heading\">\n    <!-- Form fields here -->\n</form>\n```\n\n这些只是 ARIA 可用于增强可访问性的众多方式中的两个示例。当明智使用时，诸如\
  \ aria-expanded 和 aria-labelledby 之类的属性有助于向辅助技术传达结构、关系和行为。\n\n##### 将 ARIA 应用于增强动态和自定义组件\n\
  \n掌握 ARIA 意味着了解其目的和局限性。ARIA 不是语义化 HTML 的替代品——它是当原生元素不足时的补充。以下是如何充分利用 ARIA：\n\n-\
  \ **知道何时使用它：** 遵循 ARIA 的五条规则，以确保你是在增强可访问性，而不是阻碍它。\n- **检查规范：** 始终查阅最新的 ARIA 指南，以正确应用角色、状态和属性。\n\
  - **传达变化：** 使用 aria-expanded 和 aria-labelledby 等 ARIA 属性来传达元素之间的状态和关系。这些属性——以及类似的其他属性——帮助辅助技术解释动态行为并为交互控件提供有意义的标签。\n\
  - **测试兼容性：** 使用辅助技术验证 ARIA 实现，以确认它们在各种设备和浏览器上都能正常工作。\n\n通过深思熟虑地应用 ARIA，你可以确保自定义组件对所有用户都具有可访问性、直观性和包容性。然而，编写可访问的代码只是过程的一部分；你还需要验证它是否按预期工作。下一步是测试你的代码以尽早发现可访问性问题，并确保你的实现在现实场景中经得起考验。\n\
  \n##### 测试代码以确保可访问性合规\n\n在 *开发可访问网站* 中最基本的最佳实践之一是学习如何测试自己的代码。本章重点介绍了 HTML、CSS 和\
  \ ARIA，但即使是最精心编写的代码，如果不经过测试，也不会带来可访问的体验。可访问性不仅仅是编写完美的代码。它是关于符合 WCAG 并为最广泛的受众提供最佳的用户体验。而这始于了解如何在真实条件下测试你的工作。\n\
  \n开发人员必须了解他们正在设计和编码的指南。测试不应仅留给审计员或质量保证专家。如果你正在构建数字产品，可访问性合规测试应从一开始就成为你的开发工作流程的一部分，而不是最后一步。这意味着了解如何识别常见障碍、解释\
  \ WCAG 要求，并在某些看起来不错的东西可能对所有人都不可用时识别出来。\n\n基础的可访问性测试流程应同时包括自动化工具和手动测试技术。自动化工具有助于捕获明确的错误，例如缺少替代文本或颜色对比度不足。然而，许多可访问性问题，例如不正确的焦点行为、仅鼠标交互或误导性的链接文本，只能通过手动测试发现。\n\
  \n手动流程必须包括屏幕阅读器技术的基本使用。你不需要成为屏幕阅读器专家，但你应该熟悉屏幕阅读器的工作方式、如何使用它导航网站，以及你的内容如何向屏幕阅读器用户宣布。无论你使用的是\
  \ Windows 上的 NVDA、macOS 或 iOS 上的 VoiceOver，还是其他工具，这些知识都能帮助你发现自动化扫描会遗漏的关键可用性问题。\n\
  \n测试你的网站和组件在多个设备上也很重要。用户体验在操作系统、浏览器、屏幕尺寸和输入方法之间有所不同。一个在桌面浏览器上运行良好的设计，在移动屏幕上放大或在平板电脑上以高对比度模式查看时可能会中断或变得不可用。在真实环境中进行测试可确保你的工作在设计上具有包容性——而不是基于假设。\n\
  \n浏览器开发者工具在此过程中发挥关键作用。Chrome DevTools 和 Firefox 中可用的可访问性树、焦点顺序检查以及角色和名称检查对于了解辅助技术如何解释你的代码至关重要。\n\
  \n总的来说，你应该建立一个可访问性测试工具包——这不仅仅是一组工具，而是你作为开发人员工作方式的核心部分。目标不是使用所有可用的东西，而是始终如一地使用与你的工作流程一致、支持你的职责并帮助你为真实用户构建的工具。\n\
  \n每个开发人员都应维护一个包含自动化和手动测试方法的工具包。这意味着检查可访问性树中的问题、验证语义结构、检查颜色对比度，并使用辅助技术模拟用户体验。测试应是开发的集成部分，而不是最终任务或交给他人处理的事情。\n\
  \n\n\n\n\n以下是我在自己的以可访问性为重点的开发工作中最常使用的工具：\n\n- **Chrome DevTools**，尤其是**Accessibility**\
  \ 面板和可访问性树检查\n- **Webflow Audit panel**，用于在构建过程中识别常见可访问性问题\n- **TPGi Color Contrast\
  \ Analyzer**，我用它来测试前景色与背景色之间的对比度\n- **ARC Toolkit**，用于验证地标、角色和结构化标记\n- **WAVE browser\
  \ extension**，用于对网页进行快速、视觉化的可访问性反馈\n- **NVDA** 用于在 Windows 上进行屏幕阅读器测试\n- **VoiceOver**\
  \ 用于 macOS 和 iOS\n- **TalkBack** 用于在 Android 设备上进行测试\n- **A reliable pixel-to-rem\
  \ converter**，帮助确保可扩展、用户友好的尺寸\n\n这是一个基于我个人使用效果的简短清单。你可能会找到更适合自己平台、角色或工作流程的其他工具。最重要的是保持一致性和有意为之。测试应该贯穿开发全过程，而不是事后才考虑。\n\
  \n随着你的项目不断发展，你的工具包也应随之演进。抽出时间学习新工具，探索用户如何体验你的网站，并调整你的流程以满足更多人的需求。\n\n本章介绍了测试的重要性，而*第\
  \ 11 章*将深入探讨。它将带你了解具体的工具、方法和工作流程，帮助你建立可持续、可重复的评估方法。\n\n目前，最重要的收获是：测试是开发的一部分。它不是可选的，也不能完全外包。那些通过学习指南、练习手动测试、使用辅助技术并在多台设备上评估自己的工作来主动承担可访问性责任的开发者，才是真正构建出包容、可用、可理解且对最广泛受众都友好的体验的人。\n\
  \n##### Summary\n\n本章探讨了可访问网页开发的实践基础，涵盖了语义化 HTML、包容性的 CSS 使用、ARIA 的适当应用以及可访问性测试的重要性。你已了解\
  \ HTML 如何提供结构和意义，CSS 如何在不引入障碍的情况下支持可用性，以及当原生 HTML 不够用时 ARIA 如何扩展可访问性。你还看到了为什么将可访问性测试作为每个开发者的流程的一部分如此重要，以及一个深思熟虑的测试工具包如何帮助你及早识别和修复障碍。\n\
  \n在当今的开发环境中，这些技能至关重要，因为数字体验必须服务于具有多样化需求的广泛用户。无论你是在构建一个着陆页、一个 Web 应用，还是一个复杂的交互组件，可访问性不是锦上添花；它是高质量代码不可或缺的一部分。采用以可访问性为先的心态使你能够创建对所有人更易用、符合法律要求且以人为本的产品。\n\
  \n在下一章中，你将探索如何将包容性设计原则扩展到移动环境，在那里触控手势、屏幕尺寸和语音交互带来了独特的可访问性挑战和机遇。\n\n##### Further\
  \ reading\n\n可访问性不是一次性修复。它是一项需要持续学习和适应的长期承诺。随着标准、工具和技术的不断发展，保持更新有助于确保你的工作保持有效、包容并与真实用户需求保持一致。抽出时间回顾\
  \ WCAG 和 WAI-ARIA 的更新，参与 WebAIM 和 W3C 等可访问性社区，并关注值得信赖的博客、通讯和网络研讨会以保持知识敏锐。除了实施之外，倡导也发挥着关键作用。无论你是指导同行、发表见解，还是在团队内部引领讨论，你的影响力都可以帮助在你的组织和更广泛的行业中嵌入包容性实践。\n\
  \n以下是一些值得信赖的资源，可支持你的持续成长：\n\n- **W3C Web Accessibility Initiative** (https://www.w3.org/WAI/)：W3C\
  \ 关于可访问性标准的官方中心，包括 WCAG 和 WAI-ARIA。这是技术规范、指导和工作组更新的权威来源。\n- **WebAIM** (https://webaim.org/)：一个备受尊敬的组织，提供实用的可访问性文章、研究和培训。WebAIM\
  \ 对初学者和希望建立基础知识的团队尤其有帮助。\n- **Deque University** (https://dequeuniversity.com/)：一个强大的在线培训平台，提供关于可访问性测试、屏幕阅读器使用和\
  \ ARIA 的课程。Deque 的资源在企业和教育环境中广泛使用。\n- **Accessibility Book Club** (https://www.a11ybookclub.com/)：我创立的一个免费、社区驱动的团体，面向希望通过每月阅读、讨论和现场活动共同学习的开发者、设计师和可访问性倡导者。\n\
  \n通过保持与这些资源的联系，你将继续成长为一名具有可访问性意识的开发者，并为一个更包容的网络做出贡献。因为如果你的网站对所有人都不起作用，那它实际上根本不起作用。\n\
  \n### 8\n\n#### Mobile Accessibility: Designing for Touch and Voice Interfaces\n\
  \nBy Chris McMeeking\n\n当你使用手机时你在做什么？你在工作？坐在汽车的副驾驶座上？使用轮椅？去慢跑？移动设备被各种各样的人在各种各样的环境中使用。将移动应用的便利性带给所有这些环境中的用户，这就是可访问的移动应用设计和开发的全部内容。然而，你面前有很多挑战。在某种程度上，移动可访问性反映了网页可访问性的概念，尽管有几个独特的挑战必须考虑，包括：\n\
  \n- 为笨拙的手指交互而设计的小屏幕尺寸。\n- 对不同移动平台（即 iOS 或 Android）之间不同的平台功能支持的期望。\n- 需要将复杂体验拆分为可能被外出用户中断的工作流程。\n\
  \n这些只是本章讨论过程中将涉及的众多挑战中的几个。\n\n在本章中，移动设计师将发现如何打造包容、直观的界面，而开发者将学习如何使用平台特定的可访问性工具来实现这些设计。一起，你们将创建欢迎每个用户、在每台设备上、通过每种输入方式的移动体验。通过了解\
  \ iOS 和 Android 平台之间的差异、优化触控目标、实现替代输入方法、设计有效的语音界面以及确保跨设备的响应式布局，你将获得使移动应用更具包容性的实用策略。\n\
  \n随着移动设备仍然是人们参与数字内容的主要方式——根据 WebAIM Million Report (2024) 和 StatCounter Global Stats，截至\
  \ 2024 年占全球网页流量的 60% 以上——以可访问性为出发点进行设计使你能够触达更广泛的受众、改善用户体验并构建在平台演进时依然稳健的应用。\n\n因此，在本章中，我们将涵盖以下主题：\n\
  \n- Mobile development accessibility considerations\n- Optimizing touch targets\
  \ for various abilities\n- Implementing alternative input methods\n- Designing voice\
  \ interfaces for accessibility\n- Ensuring responsive layouts across devices\n\n\
  ##### Mobile development accessibility considerations\n\n在开发可访问的移动应用程序时，认识到 iOS\
  \ 和 Android 平台之间的差异至关重要。虽然这两个操作系统都提供强大的可访问性框架，但其功能、约定和限制可能存在显著差异。了解这些区别有助于确保你的应用程序为所有用户提供无缝体验，无论他们使用的是哪个平台。以下部分比较了\
  \ iOS 和 Android 特有的可访问性考虑因素。\n\n##### Regarding iOS vs Android\n\n在移动可访问性中需要记住的一件重要事情是，iOS\
  \ 和 Android 的可访问性差异就像网页可访问性和移动可访问性的差异一样大。存在许多统一因素，但也有许多特定于平台的因素。\n\n许多差异源于平台所构建的语言和生态系统的性质。网络建立在由委员会创建的一系列技术和规范之上，并且演进速度相对缓慢。与此同时，Android\
  \ 和 iOS 由基本单一的实体构建，推动其平台每年演进。苹果和谷歌对其各自平台的演进速度越快，用户就越会被驱动去购买新设备。\n\n这种快速的平台演进给可访问性带来了挑战。用户期望新平台功能得到支持，但当这些功能未得到支持时，应用程序会感觉笨拙。\n\
  \n\n\n\n\n让我们来看看这些应用程序构建所处的生态系统，从 Android 开始：\n\n- **操作系统：** Android\n- **编程语言：**\
  \ Java 或 Kotlin\n- **UI 框架：** Compose 或 XML 布局\n\n现在让我们来看 iOS：\n\n- **操作系统：** iOS\n\
  - **编程语言：** Swift 或 Objective-C\n- **UI 框架：** SwiftUI 或 Storyboard\n\n注意 Google\
  \ 和 Apple 对各自生态系统所施加的控制程度。Google 与开源社区合作，尽管仍对贡献拥有大量权力并进行最终审核，而 Apple 则完全拥有其生态系统，包括编程语言。\n\
  \n由于 Google 和 Apple 拥有如此大的控制权，本章的一个反复出现的主题将是按照生态系统支持的方式做事。重要的是要给平台留出不同的空间。如果没有这些差异，你将迫使其中一个平台以与其支持的功能相悖的方式运行。这会产生累积效应，使你的应用程序更难以维护，从而落后于平台更新并加剧这些问题。\n\
  \n> 当 iOS 和 Android 解决方案之间的区别很重要时，将会单独提及并讨论。\n\n##### 关于可维护性\n\n移动可访问性中最关键——而且经常被忽视——的区别在于通过移动浏览器访问的网络内容与原生移动应用程序之间的差异。虽然表面上看起来相似，但它们的底层技术、功能和可访问性框架却存在显著差异。\n\
  \n移动浏览器通常支持桌面网络标准的一个子集，给人一种网络可访问性实践可以直接转化为原生应用的错觉。然而，原生应用程序使用完全不同的架构构建，具有平台特定的控件、编译语言以及组件之间更严格的隐私规则。这造成了在网络上不会出现的独特可访问性挑战。此外，像\
  \ React Native、Flutter 和 Xamarin 这样的混合和多平台框架进一步模糊了这些界限。虽然它们提供了共享代码库的便利性，但它们在使可访问性期望与平台特定行为保持一致时也引入了复杂性。\n\
  \n认识到这些区别与理解 iOS 和 Android 之间的差异一样重要，它构成了在移动设备上做出明智、可访问设计决策的基础。这会导致可访问性专家与开发者之间的对话，最终可能导致开发者在不需要的情况下实现自定义功能，以支持不期望的功能。\n\
  \n强迫移动应用程序像其网络对应物一样表现会给用户带来问题，并导致应用程序偏离 Google 和 Apple 所期望的行为和实现。当 Android 或 iOS\
  \ 的新版本发布时——这种情况经常发生——现有控件可能无法立即支持更新中引入的新辅助技术功能。可访问性专家应了解控件在平台不断发展的框架中的预期行为，以确保兼容性和可访问性。\n\
  \n在一个不断变化的生态系统中，这可能是一个挑战。一些应对方法包括：\n\n- 将你的应用程序与 Google 或 Apple 的应用程序进行比较，同时接受它们可能不符合你从网络应用程序带来的期望。\n\
  - 在分享你偏好的测试选择意见之前，彻底熟悉多个平台的辅助技术。\n- 在与工程师的讨论中保持开放的心态，尤其是在他们说某事无法完成时。\n\n这些策略可以帮助你应对移动可访问性的复杂性，但必须记住，移动应用程序的底层架构带来了独特的挑战。与网络开发不同，移动应用程序使用编译语言构建，这些语言在应用程序的不同组件之间强制执行严格的隐私规则。记住这一点对于你进行可访问性改进至关重要。\n\
  \n移动应用程序构建在编译语言之上。编译语言在各种实现部分之间具有严格的隐私期望。每次我们要求开发者添加自定义功能来改进可访问性时，我们实际上是在要求他们违反这一契约。虽然在某些情况下可能是可能的，但这会导致可维护性问题，并且可能实际上偏离控件的预期行为。\n\
  \n允许平台按其设计的方式运行，即使其行为与你在网络生态系统中习惯的不同。iOS 和 Android 都提供强大的内置可访问性支持，但覆盖默认行为的自定义实现可能会抑制该支持。要求开发者规避\
  \ perceived 平台弱点通常会导致应用程序更难维护，并且随着时间的推移可访问性更差。当平台最终解决这些弱点时，自定义解决方案可能会与新的预期行为冲突，无意中降低可访问性而不是增强它。\n\
  \n纳入平台约定对于构建可访问且可维护的应用程序至关重要。通过尊重原生行为并避免不必要的自定义，你可以确保与不断发展的可访问性标准的兼容性。在建立了坚实的基础之后，下一步是优化触控目标以适应各种用户能力。\n\
  \n##### 优化触控目标以适应各种能力\n\n移动设备带来了独特的可访问性挑战，因为用户通常在移动中与它们交互，用手指点击、滑动和捏合。这在以下情况下尤其困难：\n\
  \n- **控件太小：** 如果控件小于指尖，用户在移动或单手握持设备时可能难以准确点击。\n- **控件过于拥挤：** 当多个控件放置得很近时，很难确定激活的是哪个控件，从而导致错误和挫败感。\n\
  \n对于有行动不便的用户，例如手指灵活性有限、颤抖或其他运动障碍的用户，这些挑战可能更为明显。设计具有足够尺寸、间距和触控响应的控件对于创建更具包容性的移动体验至关重要。\n\
  \n那么，我们如何在不让交互控件主导用户界面的情况下考虑触控目标大小呢？虽然不限于移动设备，但 WCAG 2.5.8 目标尺寸（最小） ([https://www.w3.org/WAI/WCAG22/Understanding/target-size-minimum](https://www.w3.org/WAI/WCAG22/Understanding/target-size-minimum))\
  \ 解决了所有触控界面——包括平板电脑、笔记本电脑以及供行动不便人士使用的辅助技术——的问题，通过推荐交互控件的最小目标尺寸。当前建议是 AA 合规性的最小尺寸为\
  \ 24 x 24 CSS 像素，推荐的 AAA 阈值为 44 x 44 CSS 像素。让我们也来看一些更有帮助的概念。\n\n##### 卡片模式\n\n卡片模式是一种设计方法，将信息组织成不同的、交互式的容器或“卡片”。这些卡片通常足够大，可以轻松点击或点按，使其对移动用户特别友好，包括有运动障碍或手指灵活性有限的用户。\n\
  \n![](img/3bdc9e2d41de898f8a3bcc9634b0000e_200_0.png)\n\n图 8.1：卡片模式\n\n通过将相关内容和交互元素分组到明确定义的卡片中，你可以增强可用性和可访问性。当展示项目列表时，例如产品、文章或应用列表时，它们尤其有效。它们允许宽裕的点击目标，并在不同内容之间提供视觉分隔，减少意外交互的风险。\n\
  \n要查看卡片模式的实际示例，请访问 Google Play 商店或 Apple App Store。注意应用程序、游戏和其他内容如何以不同的卡片呈现，每个卡片占据足够的空间以便轻松点击。这种设计确保了清晰性、一致性和可访问性。\n\
  \n\n\n\n\n然而，不要在卡片上堆砌过多信息，也不要以冲突的方式嵌套多个交互元素。例如，将整张卡片分配为导航到用户个人资料，同时在其中放置可点击的电子邮件地址或按钮，可能会导致混淆或非预期的交互。为了确保清晰且可访问的体验，请保持每张卡片的专注，避免重叠的交互区域，并在可能的情况下为每张卡片优先考虑单一、可预测的操作。\n\
  \n因此，卡片模式是结合信息和交互性的有效方式，可在节省空间的布局中实现。它将关键内容置于前沿，同时最大化交互的可触摸区域。虽然卡片特别适合移动设备，但它们并不是分组相关元素的唯一方式。最重要的是确保清晰度、专注度以及充足的触控目标，而不管你使用何种视觉模式。\n\
  \n##### 二维滚动\n\n二维滚动是一种设计技术，用户可以在同一界面中水平和垂直导航内容。这种模式通常用于移动设备，以允许用户在不让用户感到不知所措的情况下高效浏览大量内容。例如，用户可以垂直滚动浏览信息流或列表，并水平滚动浏览类别或图片画廊。\n\
  \n臭名昭著的轮播模式——一种通常以可滑动的卡片或图片系列实现的水平滚动形式——在网页设计中因以下几个原因而经常受到批评：\n\n- **可访问性差**：轮播通常依赖于动画或手势，对于运动障碍用户或使用键盘或屏幕阅读器导航的用户来说可能很困难。\n\
  - **内容可见性**：重要内容可能被隐藏在屏幕外，使其更难被发现。许多用户从不与轮播控件交互，导致信息被遗漏。\n- **过度使用和误用**：轮播通常出于美观目的而使用，而不考虑可用性或可访问性，导致用户体验不佳。\n\
  \n然而，在移动设备上，二维滚动和轮播是必不可少的。它们允许用户快速导航大型数据集或类别，尤其是在 Netflix 或在线商店等应用程序中，内容以卡片的水平行组织。没有轮播，找到特定电影或产品就需要无尽的垂直滚动。\n\
  \n二维滚动也与卡片模式配合良好，使设计师能够最大化控件的可触摸区域，同时以视觉上有组织且可访问的方式呈现内容。然而，必须确保水平滚动仅用于离散的内容组——而不是用于阅读或核心导航——以满足\
  \ WCAG 2.1 成功标准 1.4.10 Reflow，该标准要求在调整大小或缩放时，内容可以在不丢失信息或功能的情况下呈现。\n\n虽然二维滚动可以增强导航和效率，但它并不总是正确的选择。如果太多可滚动区域争夺注意力或用户迷失位置，它会引入认知过载。设计师应避免嵌套多个可滚动区域，并确保水平滚动清晰标示且易于执行。当过度使用或实现不佳时，此模式会阻碍可发现性并让用户感到沮丧，尤其是依赖屏幕阅读器或开关访问的用户。应深思熟虑地使用，并始终与真实用户一起测试。\n\
  \n##### 浮动操作按钮\n\n移动可访问性面临的一个挑战是在显示内容的有限屏幕空间与大触控目标之间取得平衡。为了最大化可用空间，开发人员通常使用固定位置的浮动操作按钮——似乎悬浮在其他\
  \ UI 元素之上的交互控件。这种技术允许下方的内容独立滚动，提供更大的、更易访问的触控目标，而不会牺牲信息可见性。\n\n![](img/3bdc9e2d41de898f8a3bcc9634b0000e_202_0.png)\n\
  \n图 8.2：浮动操作按钮\n\n在网页设计中，浮动操作按钮经常因可发现性差和令人困惑的焦点顺序而受到批评。当用户使用键盘或辅助技术导航时，很难确定浮动操作按钮在交互元素序列中的位置。这可能会损害对\
  \ WCAG 2.4.3 焦点顺序 和 1.3.2 意义顺序 的符合性，两者都要求逻辑且可预测的导航路径。此外，浮动操作按钮可能会遮挡重要内容，导致可用性和可访问性问题，尤其对于依赖屏幕阅读器或开关访问的用户。\n\
  \n然而，在移动设计中，浮动操作按钮被广泛接受且有效，原因如下：\n\n- **平台标准：** iOS 和 Android 都为实现浮动操作按钮提供了成熟的模式。这些指南包括有关大小、放置、交互和可访问性的建议。遵循平台惯例可确保一致的用户体验。\n\
  - **布局简洁：** 移动界面通常包含的交互元素比网页少，降低了焦点顺序混淆的可能性。此外，开发人员可以利用内置平台工具，例如 Android 的 ViewGroup\
  \ 属性（android:nextFocusForward 等）和 iOS 的 UIAccessibilityContainer 协议，以可访问的方式管理和自定义焦点顺序。\n\
  - **用户期望：** 由于广泛使用，许多用户已习惯在移动应用中使用浮动操作按钮进行主要操作——如撰写消息或添加新项目。然而，这种熟悉的模式可能对每个人来说并不同样直观或可访问，特别是依赖屏幕阅读器、开关访问或键盘导航的用户。在考虑可感知性时，重要的是要问：谁从这种模式中受益，谁又可能被排除在外？有意设计意味着确保常用的模式也能支持具有多样化能力的用户。\n\
  \n在实现浮动操作按钮时，请考虑以下最佳实践：\n\n- **放置：** 浮动操作按钮通常放置在右下角（Android）或底部居中（iOS），以保持可访问性同时不阻挡关键内容。这种一致的放置也有利于非视力用户，使辅助技术——如屏幕阅读器或开关访问——能够可靠地定位并描述按钮的功能，减少猜测并支持高效导航。\n\
  - **可访问性考虑：** 确保浮动操作按钮为屏幕阅读器提供适当的标签并集成到焦点顺序中。通常，这意味着将它们放置在导航序列的末尾——在主要内容之后——以免打断用户的阅读或任务流程。避免在上下文要求时（例如在模态或基于步骤的工作流程中）动态重新定位其焦点。iOS\
  \ 和 Android 都提供可访问性 API 来帮助开发人员以可预测、用户友好的方式管理此问题。\n- **一致使用：** 仅对高优先级操作使用浮动操作按钮，避免界面因过多的浮动控件而杂乱。\n\
  \n##### 扩展可触摸区域\n\n通常，交互控件——如按钮、复选框或输入字段——会被放置在更大的布局容器中，尤其是在列表或表单中。提高可用性和可访问性的简单方法是扩展控件本身之外的可触摸区域，以包含周围的布局。例如，与其仅使小复选框可点击，不如使关联的文本标签也具有交互性，以便用户可以在该行的任何位置点击以激活复选框。这对于灵活性有限的用户或使用单手触摸手势的用户尤其有帮助。以这种方式扩展触控目标可以改善体验而不使界面杂乱，并且是可访问性的轻松胜利。\n\
  \n##### 利用工作流程\n\n设计师常常因试图将过多内容或功能塞入单个屏幕而苦于有限的屏幕空间。更好的方法是将其用户体验分解为可管理的工作流程——较小的、专注的交互，引导用户完成一系列步骤，而不是让他们因杂乱的界面而不知所措。\n\
  \n考虑一个允许用户执行以下操作的移动银行应用：\n\n- 查看账户余额\n- 在账户之间转账\n- 支付账单\n- 存款支票\n\n如果所有这些任务都呈现在单个屏幕上，结果将是一个令人困惑、拥挤的界面，触控目标很小且可用性差。相反，工作流程可以分解为单独的、简化的屏幕——本例中为四个——每个屏幕一次专注于一个任务：\n\
  \n\n\n+   1. **主屏幕：** 显示账户概览，并提供导航到特定任务的选项。\n+   2. **转账流程：** 引导用户选择账户、输入金额并确认转账。\n\
  +   3. **账单支付流程：** 将流程分解为选择收款人、输入支付金额和设置计划。\n+   4. **支票存款流程：** 利用分步指导拍摄支票照片、确认金额并提交存款。\n\
  \n通过将复杂任务分解为专门的工作流程，可以提高可用性、可访问性和可发现性。用户不太可能感到不知所措或出错，每个屏幕都可以用更大、更易访问的触控目标进行优化。\n\
  \n虽然为触控可访问性设计至关重要，但它只是拼图的一部分。为了确保你的应用程序真正具有包容性，必须考虑通过替代输入方式与设备交互的用户，例如硬件键盘、语音命令或\
  \ Switch Control 等辅助技术。但除输入方式之外，深思熟虑的工作流程设计也有助于屏幕阅读器用户、认知障碍人士以及任何可能因界面密集或复杂而感到不知所措的人。支持多样化的交互模式并将任务分解为专注的步骤，有助于让你的应用对每个人都更易用、更易发现、更友好。让我们探讨如何为这些不同的需求设计。\n\
  \n##### 实现替代输入方式\n\n你知道可以用鼠标与 Android 手机交互吗？或者有些用户只使用键盘？你甚至可以插入一个摇杆并打开 Switch Control\
  \ 或 Switch Access 等辅助技术！\n\n幸运的是，在测试方面，你通常可以将工作范围缩小到两类技术：\n\n+   1. 依赖于辅助功能层文本信息的输入技术（即\
  \ iOS 上的 VoiceOver 或 Android 上的 TalkBack）\n+   2. 依赖于检测控件预期交互方式的输入方法（即键盘或 Switch\
  \ Access）\n\n支持所有这些输入方式可能具有挑战性，特别是在构建自定义控件时。你可能无法始终访问复制某些行为所需的 API，即使存在 API，它们也经常不完整或难以一致地实现。\n\
  \niOS 和 Android 都提供了强大的辅助功能层——如 VoiceOver 和 TalkBack——它们与内置组件交互良好。这些平台还支持外部输入设备，例如蓝牙键盘、开关和自适应控制器。Switch\
  \ Control（iOS）和 Switch Access（Android）等辅助技术可以弥合软件与硬件之间的差距，让用户通过扫描界面或外部开关与关键功能交互。\n\
  \n然而，继承自平台原生组件的自定义控件可能会破坏这种兼容性，导致令人沮丧或无法访问的体验。只要有可能，就应依赖内置功能并从原生组件扩展，以确保在多样化的输入生态系统中获得全面支持。\n\
  \n##### 一个简单的设计规则：平台控件或自定义解决方案\n\n要创建可访问的多输入内容，必须遵循一个简单的设计规则：\n\n- 尽可能使用原生平台控件：依赖\
  \ iOS 和 Android 提供的内置按钮、滑块、文本字段和其他 UI 元素。你可以原样使用它们，将它们组合起来创建更复杂的组件，或在其之上构建同时保持其原始行为不变。这有助于确保你的应用与屏幕阅读器和\
  \ Switch Access 等辅助技术顺畅协作。\n- 如果必须使用自定义控件，请确保它们与辅助技术和输入设备的交互方式与平台预期一致。\n\n其思想是利用内置平台控件（例如按钮、滑块或文本输入）或使用平台自己的辅助功能框架对其进行扩展。当你使用原生控件或在其基础上构建时，可访问性功能——例如键盘支持、屏幕阅读器兼容性和触控交互——由操作系统处理。\n\
  \n当你偏离使用平台原生控件并依赖自定义实现（例如自定义手势识别器）时，就有破坏与辅助技术兼容性的风险。这些自定义手势可能无法被屏幕阅读器、键盘或其他输入设备检测到，导致依赖它们的用户体验不佳。\n\
  \n然后，开发者必须付出大量努力来复制操作系统本应自动提供的可访问性行为。这可能导致不一致性和可访问性随时间下降，尤其是在平台不断发展时。\n\nWeb 内容可访问性指南（WCAG）认识到某些应用程序可能需要自定义交互。例如：\n\
  \n- 标准应用（例如银行应用）：应尽可能遵循原生控件，以确保在所有输入模式下均可访问。\n- 游戏或创意应用：通常需要自定义手势和交互，这些交互不受典型平台控件覆盖。可访问性仍可提供，但预期会使用自定义解决方案。\n\
  \n现在，为了成功支持用户与移动操作系统交互的所有不同方式，你必须坚持生态系统所能实现的功能。这在不同操作系统之间可能有所不同。让我们来看看 Android 和\
  \ iOS。\n\n##### Android 键盘支持\n\n与 iOS 不同，Android 键盘与操作系统的交互方式更类似于传统的桌面键盘，具有可管理的焦点导航和\
  \ Tab 行为。这可以追溯到 Android 的早期，当时设备包含物理轨迹球和方向键。轨迹球导航、键盘支持和摇杆式输入都是原始设计理念的一部分，这些基础至今仍影响着\
  \ Android 的可访问性支持。\n\n例如，考虑一个简单的登录屏幕，包含两个文本字段和一个按钮：在 Android 上，通过 USB-C 或蓝牙连接的键盘允许用户使用\
  \ Tab 键在字段之间导航，并使用 Enter 激活按钮——这些行为由操作系统原生支持。在 iOS 上，通过蓝牙或 Lightning 连接的键盘工作方式不同：键盘导航要求用户启用\
  \ Full Keyboard Access、Voice Control 或 Switch Control 等辅助技术才能在元素之间移动。即便如此，开发者也必须确保可聚焦元素使用辅助功能\
  \ API 正确公开，以使这种导航可靠。\n\n许多应用程序得益于开箱即用的良好键盘支持，因为 iOS 和 Android 都使用深度优先树遍历来确定默认焦点顺序。这意味着系统会自上而下、从左到右（或在某些语言环境中从右到左）检查用户界面层次结构，基于代码中元素的结构。当开发者使用原生组件并保持逻辑的视图层次结构时，焦点顺序通常“只需工作”。但对于自定义界面或不太常见的导航需求，开发者可能需要介入并定义更直观的焦点路径。\n\
  \n##### iOS 键盘支持\n\n支持硬件键盘在 iOS 和 Android 之间有所不同，因为它们对键盘的处理方式根本不同。对于 iOS 硬件，键盘接受输入并将其转换为与软件键盘类似的信号。\n\
  \niOS 与众不同之处在于，默认情况下它不支持与 Android 相同的完整键盘焦点导航。你可以通过蓝牙或 Lightning 将外部键盘连接到 iPhone\
  \ 或 iPad，并在不启用任何辅助技术的情况下进行输入和执行一些基本操作。然而，要更全面地使用方向键或 Tab 式导航在界面元素之间导航，用户必须启用 Full\
  \ Keyboard Access、Switch Control 或 Voice Control 等辅助技术。Full Keyboard Access 尤其解锁了更广泛的导航和交互模式，但它也会改变屏幕键盘的行为——例如，在连接外部键盘时禁用它。\n\
  \n> 从技术角度帮助覆盖 WCAG 合规性而言，你只需测试 Switch Control、Voice Control 或 Full Keyboard Access\
  \ 中的一种即可，但重要的是要了解这些工具的行为并不相同。例如，通过 Full Keyboard Access 通过测试并不能保证 Voice Control\
  \ 用户获得无缝体验，因为每个工具都依赖不同的交互模型和 API。虽然在每种情况下测试每种模式可能不切实际，但了解它们之间的差异——以及可能遗漏问题的风险——可以帮助你做出更明智的设计决策并更早发现可用性差距。\n\
  \n虽然 iOS 对键盘导航的处理方式不同，但焦点顺序的概念对于 iOS 和 Android 都是至关重要的考虑因素。无论用户使用键盘、屏幕阅读器还是其他辅助技术，确保逻辑且直观的焦点顺序对于可访问性至关重要。让我们更仔细地看看移动操作系统如何确定和管理焦点顺序。\n\
  \n##### 理解移动可访问性中的焦点顺序\n\n当用户使用屏幕阅读器或键盘等辅助技术导航应用程序时，焦点顺序决定了交互元素被访问的顺序。确保逻辑的焦点顺序对可访问性至关重要。\n\
  \n移动操作系统通过对界面层次结构进行深度优先树遍历来计算焦点顺序。这意味着系统从最顶层的父控件开始并\n\n在移动到下一个同级控件之前，会检查每个子控件。此遍历过程中遇到项目的顺序定义了默认焦点顺序。\n\
  \n与基于网页的屏幕阅读器（或 macOS 上的 VoiceOver，它们可能将嵌套控件视为单个分组元素）不同，iOS 和 Android 等移动操作系统通常将嵌套控件视为独立的单个元素。例如，如果卡片组件中有一个按钮，每个元素在移动设备上都会独立获得焦点，这样可以实现更细粒度的导航，但也需要结构良好的焦点顺序来防止混淆：\n\
  \n- **Web 上下文（macOS 上的 VoiceOver）：** 根据 HTML 和 ARIA 角色的实现方式，可能会将卡片视为单个分组控件。如果容器使用了合适的地标或角色，并且按钮的标签设置正确，VoiceOver\
  \ 可能会独立导航到按钮；但如果结构不清晰，它可能只会被描述为组的一部分。\n- **移动端上下文：** 卡片和按钮都被视为不同的元素，各自独立获得焦点。\n\n\
  这种差异对无障碍访问是有益的，但前提是焦点顺序规划得当。定义不良的焦点顺序可能会给依赖辅助技术的用户带来困惑和沮丧的体验。\n\n作为工程师，你需要关注的是：\n\
  \n- 视图层级结构良好，并以合理的方式布局（即避免使用绝对布局和重新定位项目）。\n- 用户可交互的控件能够被识别为可操作。\n\n虽然默认遍历对许多应用来说运行良好，但深思熟虑的设计和结构良好的\
  \ UI 层级通常可以消除手动自定义的需要。在必须自定义焦点顺序的情况下，开发者应确保其为所有用户提供逻辑清晰、直观的体验。以下是一些有效管理焦点顺序的常用技巧：\n\
  \n- **使用 API 显式设置焦点顺序：** 当默认焦点遍历与预期的用户体验不一致时，开发者可以使用特定平台的 API 来定义所需的焦点路径。Android\
  \ 提供了诸如 focusNext()、focusPrevious()、focusUp()、focusDown()、focusLeft() 和 focusRight()\
  \ 等方法，以显式引导焦点移动。iOS 通过 UIAccessibility 框架提供了类似的控制。\n- **定义无障碍容器（iOS）：** 在 iOS 上，开发者可以使用\
  \ `accessibilityContainer` 属性来分组相关元素。这使他们能够控制 VoiceOver 如何浏览复杂的 UI 层级，确保用户按逻辑顺序遇到内容。\n\
  - **设置无障碍焦点顺序（Android）：** Android 的 View 层级允许开发者使用 `android:nextFocusForward`、`android:nextFocusLeft`、`android:nextFocusRight`\
  \ 和 `android:nextFocusUp` 等属性来指定可聚焦元素及其遍历顺序。这在构建自定义控件或修改默认导航模式时特别有用。\n- **以编程方式控制焦点：**\
  \ 开发者可以使用 `requestFocus()`（Android）或 `becomeFirstResponder()`（iOS）等函数以编程方式请求特定元素的焦点。此技巧在引导用户完成特定工作流程或突出重要内容时很有帮助，但应谨慎使用。\n\
  - **利用焦点管理库：** 在复杂应用中，使用提供焦点管理工具的第三方库可以简化流程。这些工具通常提供更高层次的抽象来控制焦点顺序，从而更轻松地确保整个应用的无障碍一致性。\n\
  - **测试和完善焦点顺序：** 使用各种辅助技术（例如屏幕阅读器、键盘、切换控制）测试焦点顺序至关重要，以确认导航的逻辑性和直观性。根据用户反馈完善焦点顺序可以显著增强应用的无障碍性。\n\
  \n##### 对所有用户的可用性\n\n正如我们在本书中反复提到的，有时为无障碍所做的努力其实就是把事情做对。我们可以考虑一些对所有人都受益的方面，尤其是为使用替代输入设备的用户节省时间。\n\
  \n两个平台都提供了一个常被忽视的功能：自定义提交按钮上显示文本的能力。例如，在移动设备上，通常显示“输入”或“前往”的按钮可以根据所需操作改为更具体的文本，如“搜索”或“发送”。当用户填写完文本字段后，有很多合理的后续操作：移动到下一个字段、提交表单、“前往”网页等。请思考用户点击回车键时预期会发生什么，并为他们提供相应的上下文提示。\n\
  \n此外，对于 Android 用户来说，返回操作非常重要。每部 Android 手机都有自己与返回操作交互的方式——在某些设备上，它是一个专用的硬件按钮；在另一些设备上，它是一个带有保留位置的软件按钮（除非是在全屏应用中）；甚至可以是屏幕左边缘执行的手势。无论如何，考虑返回操作在每种情况下应该做什么很重要。默认行为通常很好，但你同样经常需要对其进行自定义。\n\
  \n良好的行为通常意味着返回操作符合用户预期，例如导航到上一个屏幕或退出模态。不良行为可能包括无意中退出应用、丢失未保存的数据，或将用户导航栈中向后送得太远，从而打断其操作流程。\n\
  \n自定义返回操作可包括：\n\n- 通过在离开关键流程（如放弃表单中的未保存更改）前提示用户确认，防止意外退出。\n- 将用户重定向到特定屏幕而不是上一个屏幕，这在引导式工作流或保持一致的导航结构时很有帮助。\n\
  - 触发应用内的特定操作，例如关闭菜单或折叠 UI 元素，而不是完全退出。\n\n定制返回操作可确保用户获得无缝、直观的体验，尤其是在默认行为不符合应用设计或用户流程的情况下。\n\
  \n为多样化的输入方式（无论是触摸、键盘还是替代控制器）进行设计，可以确保广泛用户的可访问性。然而，并非所有交互都依赖物理输入。语音界面为用户导航和控制应用提供了另一种强大方式，为那些可能难以使用传统输入方法的用户提供了灵活性和可访问性。让我们探讨如何设计既有效又包容的语音界面。\n\
  \n##### 设计无障碍语音界面\n\nApple 和 Android 往往在操作系统功能上相互借鉴。当一个新功能出现在其中一个平台上时，可以肯定另一个平台会注意到，并且不久之后，它往往会以自己方式出现在另一个平台上。同样的逻辑也适用于无障碍领域。\n\
  \n例如，两个生态系统都支持用户开启语音激活的辅助技术。在 Android 中，它被称为 Voice Access，而在 iOS 中，它被称为 Voice Control。Voice\
  \ Access 和 Voice Control 的工作方式基本相同。激活后，用户可以通过结构化语音命令与设备交互，例如：\n\n- “点击 {控件标识}”：此命令允许用户通过引用无障碍标签来激活特定的交互元素（例如，“点击提交”或“点击添加到购物车”）。为了可靠工作，控件必须具有清晰、唯一且描述性的\
  \ accessibilityLabel（iOS）或 contentDescription（Android）。避免使用模糊或重复的标签，因为这可能会混淆语音交互系统并导致操作失败或选择错误。\n\
  - “显示名称”：此命令会提示语音控制系统显示屏幕上所有交互元素的无障碍名称。它允许用户查看哪些元素已标记并可通过语音命令直接交互（例如，“点击发送”）。如果元素没有无障碍名称，它就不会显示，这可能导致关键操作被遗漏。为支持此功能，请确保所有可操作元素都具有清晰、简洁的\
  \ accessibilityLabel（iOS）或 contentDescription（Android）值。\n- “显示数字”：此命令会在所有已识别的交互元素上叠加数字，允许用户通过说出“点击\
  \ 5”等方式进行交互。当元素没有明显或可见的标签时，这尤其有用。然而，未被识别或编码不当的元素可能不会被编号，从而造成障碍。确保每个交互控件都暴露给无障碍层，以便在需要时能够被检测和编号。\n\
  - “滚动 {向上/向下}”：此命令使用户能够在可滚动内容（如列表或信息流）中垂直导航。对于具有动态内容或长页面的界面尤其重要。确保可滚动区域在无障碍树中正确标记，以便辅助技术能够检测到它们。编码不当的容器或隐藏的溢出可能会阻止此命令按预期工作。\n\
  - “递增/递减 {控件标识}”：此命令调整步进器、滑块或数字字段等控件的值（例如，“递增数量”或“递减音量”）。为使语音交互成功，控件必须正确标记，并使用平台原生组件或暴露其角色和操作的无障碍自定义控件实现。否则，用户可能无法通过语音更改值，从而限制行动障碍用户的可访问性。\n\
  \n\n\n设计能够与语音激活的辅助技术无缝配合的内容，需要确保你的界面对语音命令具有可访问性和响应性。这可以通过以下方式实现：\n\n- **使用语义化 HTML：**\
  \ 结构良好的 HTML，带有清晰的标题、标签、按钮和链接，使语音技术能够更准确地解释内容。\n- **提供描述性标签和替代文本：** 确保所有交互元素（如按钮和表单字段）都具有描述性标签，这些标签要与可见文本标签完全匹配，或者至少包含该可见文本标签（如果存在）。这种一致性有助于用户发出准确的语音命令（例如“Tap\
  \ Submit”），并确保辅助技术能够正确地将语音命令与预期元素关联。对于图片，请使用描述性替代文本，或将其标记为装饰性，以确保屏幕阅读器和其他语音激活工具的无障碍性。\n\
  - **确保导航一致性：** 可预测且清晰的导航结构有助于语音命令顺畅工作。用户应该能够使用简单、一致的语音命令访问界面的每个部分。\n- **使用语音激活工具进行测试：**\
  \ 定期使用 Google Assistant、Siri、Alexa 或 Dragon NaturallySpeaking 等流行工具测试你的设计，可确保兼容性和可用性。\n\
  - **提供键盘无障碍性：** 由于许多语音激活工具通过模拟键盘命令与内容交互，确保完全的键盘无障碍性至关重要。\n\n虽然用户有时可以绕过设计不佳的内容，但确保你的网站遵循这些原则，会让他们的体验更快速、更顺畅、更直观。\n\
  \n##### 识别控件\n\n语音激活辅助技术的一个共同需求是识别用户想要交互的控件。这在两个生态系统中工作方式不同：\n\n- **iOS：** 语音控制期望命令高度结构化且准确，并带有精确定位控件的标签。\n\
  - **Android：** 语音访问接受不太精确的命令，并在没有精确标签时尝试猜测用户意图的控件。\n\n因此，iOS 对控件标签有更严格的要求。不过，它也提供了工具供开发者管理这一点，例如可以将\
  \ accessibilityLabel（用于标识控件）与 accessibilityValue（用于传达其当前状态或内容）分离开来。例如，一个用于应用折扣码的按钮，其\
  \ accessibilityLabel 可能是“Apply Discount”，accessibilityValue 可能是“Code SAVE20 entered”。这样，语音控制用户可以说“Tap\
  \ Apply Discount”，同时仍能获得当前代码的反馈而不会产生混淆。请确保 accessibilityLabel 简洁且以操作为导向，以作为可靠的标识符。\n\
  \n##### 避免嵌套控件\n\n语音访问和语音控制都是通过向控件中心发送虚拟点击来激活元素。这通常效果很好，但在某些情况下，控件的中心实际上并不是正确的目标。如果另一个控件嵌套在要激活的控件之上，并且恰好位于中心点，就可能使用户无法激活外层控件。\n\
  \n交互目标嵌套的替代方案是使用自定义操作。通过命名组件内的操作，你可以避免多个交互目标，同时允许用户使用类似“显示 {控件标识符} 的操作”这样的语法。这使你可以为控件关联多个操作，同时避免嵌套控件问题。\n\
  \n除了自定义操作之外，其他设计无障碍语音界面的有效方法包括：\n\n- **对相关控件进行分组：** 不要将每个控件视为单独的目标，而是将相关项归入一个单一、明确标识的控件下。这减少了所需的交互次数并简化了导航。\n\
  - **提供情境反馈：** 确保用户发出命令时能收到即时且相关的反馈。这有助于确认他们的操作，并在需要重试时提供引导。\n- **确保术语一致：** 在界面中保持一致的说法和命名约定。这能减少认知负担，使交互更直观。\n\
  - **支持错误恢复：** 当发出无法识别的命令时，提供清晰的说明或提示。允许用户询问可用操作（例如“我在这里能做什么？”）可以显著改善体验。\n\n这些方法有助于为依赖语音交互的用户创造更顺畅、更直观的体验。\n\
  \n虽然设计有效的语音界面至关重要，但无障碍性还取决于你的应用程序对不同设备和屏幕尺寸的适配程度。移动用户在手机、平板电脑、手表和其他设备上使用应用，每种设备都有独特的显示特性和交互模式。为了提供一致且无障碍的体验，确保你的布局在所有设备上都具有响应性至关重要。\n\
  \n##### 确保跨设备的响应式布局\n\n移动开发者面临的最大挑战之一，是要针对各种不同的设备进行设计，从紧凑型手机到平板电脑、手表和连接的外部显示器。更复杂的是，还需要支持动态显示缩放和用户可调整的文本大小，这两者对于无障碍性都至关重要。\n\
  \n支持广泛的设备不仅仅是一项技术需求——它是创造包容性体验的关键。例如，WCAG 成功标准 1.4.10（重排）要求内容在缩放至 400% 时仍可在不丢失信息或功能的情况下查看，这相当于竖屏方向下宽\
  \ 320px 的视口。类似地，WCAG SC 1.4.4（文本缩放）要求用户无需辅助技术即可将文本缩放至 200%，且不破坏布局或可用性。\n\n根据 Test\
  \ Sigma 的数据，2023 年最常见的移动屏幕分辨率是 360×800（11.02% 市场份额），其次是 390×844（7.93%）和 414×896（5.56%）。但成功的设计并不在于匹配特定的分辨率，而在于支持灵活、响应式的布局，使其能够优雅地适应任何屏幕尺寸或缩放级别。\n\
  \n尽管如此，用户期望在所有设备上获得支持，而你对应用程序将运行在哪些设备上几乎没有控制权。这种复杂性在 Android 上更为突出，像三星这样的制造商通常会预装自家的浏览器和默认屏幕阅读器，这可能会影响无障碍行为。在\
  \ Apple 设备上，iOS 和 iPadOS 之间的差异虽然较少，但仍会对辅助技术和布局行为产生显著影响。\n\n##### 自适应布局\n\n当你开始在不同信息密度下测试应用程序时，你肯定会遇到应用程序在某些密度下运行不佳的情况。在这种情况下，允许你的应用程序根据所安装的设备以不同方式使用空间会很有帮助。有几种常用技巧：\n\
  \n- 在多列布局中添加一列或改变列数。\n- 让应用程序的一部分永久可见，例如左侧菜单。\n- 将应用程序拆分为多个窗格，例如在主从工作流中。\n\n你也可以考虑使用自适应布局的自定义设计方案，但务必记住，你的开发者需要处理那些在上述方法中可以从平台布局容器中免费获得的功能。这可能导致\
  \ UI 代码中出现难以完全纠正的不一致和错误。在设计过程早期考虑如何利用平台工具来实现设计目标，这一平衡很重要。\n\n##### 利用标准工具\n\n最后一个技巧是利用平台创建者的经验。Apple\
  \ 和 Google 之所以主导生态系统，是因为他们做了充分的研究，了解自己的平台和用户。他们也对平台的未来方向拥有很大的控制权，并尽一切努力提供向后兼容性，尤其是其生态系统中记载于各自设计指南中的那些方面：\n\
  \n- Apple：[人机界面指南](https://developer.apple.com/design/human-interface-guidelines)\n\
  - Android：[Material Design 指南](https://m3.material.io/)\n\n通过利用这些文档中的知识和组件，你可以使用系统组件并设计符合平台现有功能的应用程序，从而节省时间并减少维护上的麻烦。如果过分偏离这套体系，你将很难跟上这个生态系统的步伐，因为它致力于每年为用户提供新体验。\n\
  \n\n\n\n##### Summary\n\n在本章中，你学习了如何设计可在各种设备、外设和用户能力范围内有效运行的移动应用程序。通过根据信息密度对设备进行分类、利用平台特定功能并使用默认组件，你可以在无需针对每种可能的设备单独测试的情况下提供一致且可访问的体验。\n\
  \n这些信息很有价值，因为它使开发人员能够构建适应性强、韧性强的应用程序，使其在平台不断演进时仍保持兼容。通过使你的设计与 Android 和 iOS 指南保持一致，你可以节省开发时间、减少维护工作，并受益于平台提供的持续改进。留在其生态系统内可确保你的应用程序在无需额外努力的情况下保持可访问性和现代化。\n\
  \n在下一章中，你将探索如何在虚拟现实、增强现实和人工智能等新兴技术中设计可访问的体验。随着这些平台的增长，确保可访问性变得更具挑战性，但也更至关重要。你将学习创建包容性体验的实用技巧，从使虚拟环境可导航到确保\
  \ AI 驱动的交互能够响应多样化的需求。通过将可访问性原则应用于这些前沿技术，你可以构建更具包容性和创新性的应用程序。\n"
- "# Part 3\n\n## Advanced Strategies and Implementation\n\n本书的最后一部分探讨了如何将可访问性从单个界面扩展到组织实践、团队文化和新兴技术中。这四个章节通过关注包容性移动设计、测试和补救策略，以及培养全公司对可访问性的承诺，帮助你深化影响力。\n\
  \n你将学习如何为移动触控和语音交互设计、如何使用自动化工具和人工审计评估可访问性，以及如何构建服务于广泛用户需求的包容性设计系统。最后，本部分以创建可持续的可访问性文化的路线图作为结尾——这种文化以同理心、共同责任、可衡量的进展和持续学习为基础。共同而言，这些章节使团队能够从被动的修复转向主动的、包容性的设计领导。\n\
  \n本部分包含以下章节：\n\n- Chapter 9, Accessibility in Emerging Technologies: VR, AR, and\
  \ AI\n- Chapter 10, Foundations of Accessible Design System Patterns\n- Chapter\
  \ 11, Tools and Techniques for Accessible Evaluation and Prioritization\n- Chapter\
  \ 12, Building an Inclusive Design Culture: Strategies for Organization\n\n### 9\n\
  \n#### Accessibility in Emerging Technologies: VR, AR, and AI\n\n*Dr. Keith Newton*\n\
  \n我写这章的那天，我发现了有史以来最有趣、最免费、在线的浪费时间工具之一！我登录了 labs.google.com 并点击了 *Viola the Bird*。这个\
  \ AI 实验让任何人，无论是否有音乐专业知识，都可以演奏一种受大提琴启发的乐器。Viola 用一条腿托住乐器，另一条腿保持平衡，并用喙握住弓。使用鼠标，用户可以控制这只相当热情的鸟来演奏《欢乐颂》、霍尔斯特《行星组曲》中的《木星》、圣诞歌曲等。音乐会实时根据弓的速度和位置、音符的时序以及配器的编排进行调整。它超级酷也超级有趣，但不幸的是，由于其实现方式，它让很大一部分潜在用户无法使用。\n\
  \n别误会。我喜欢 *Viola the Bird*。我可以想象在某个办公室里，创作者坐在办公椅上，笔记本电脑打开着一个经过数月打造的尖端 AI 原型，团队中的每个人都对下一个“个性化内容的革命性平台”感到兴奋，投资者渴望看到它上线。话虽如此，不舒服的事实是，该原型只能通过鼠标导航和操作。使用屏幕阅读器的用户没有提供文本替代，并且产品动画不尊重用户的运动偏好。\n\
  \n如果 *Viola the Bird* 以更具包容性的思维实现会怎样？团队是否可以实现键盘导航，使用方向键在鼠标之外实现运动控制，并用文本替代对内容进行标注？这样，具有视觉和运动障碍的用户将能够以公平的方式导航和操作\
  \ Viola，让他们能够享受演奏这些曲目并分享使用该产品的喜悦。该系统不会完美，但它对每个人来说都是**欢迎**的。\n\n本章探讨了新兴技术如**虚拟现实\
  \ (VR)**、**增强现实 (AR)** 和**人工智能 (AI)** 所带来的可访问性挑战和机遇，讨论了使沉浸式 VR 体验对各种残疾用户可访问的独特考虑。本章重点关注信息呈现和交互，同时审视\
  \ AI 在增强可访问性中的作用以及潜在的偏见。\n\n在本章中，我们将涵盖以下主题：\n\n- Adapting VR experiences for various\
  \ sensory abilities\n- Enhancing AR accessibility through customization\n- Leveraging\
  \ AI to automate the inclusion of accessibility practices\n- Mitigating algorithmic\
  \ bias in AI-driven interfaces\n\n##### Adapting VR experiences for various sensory\
  \ abilities\n\n**虚拟现实 (VR)** 是一种模拟三维计算机生成环境并通过专用头戴设备或装置让用户沉浸其中的技术。通过追踪头部运动，以及通常的手持控制器，VR\
  \ 允许人们实时查看内容、导航景观，甚至操纵虚拟物体。\n\nVR 已被各行各业所采用：从游戏和娱乐到教育和专业培训，其中沉浸式模拟环境涵盖的领域包括但不限于医学、航空和工业安全。\n\
  \n然而，使 VR 如此引人入胜的要素——比如完全的三维环境、动态运动和逼真的音频——也可能为残疾用户带来障碍。例如，如果没有提供强大的音频提示或触觉反馈，视力受损的用户可能难以识别游戏中的元素。听力障碍或重听的用户可能会错过仅通过对话或音效传递的关键情节或解谜提示，而行动能力受限的人可能会发现握持或操作控制器的身体需求难以或无法管理，或者剧烈的运动会引发眩晕或恶心等前庭障碍。\n\
  \n由于从界面元素到导航方法的每个设计选择都可能使某些用户受益或被排除，在深入开发之前承认潜在用户的不同能力和需求是有帮助的。反思如何系统地评估和完善 VR 体验以更好地服务于广泛的参与者也是有帮助的。\n\
  \n##### Accommodations to improve VR accessibility\n\nVR 为用户提供了一系列可定制体验，但也可能为残疾人士带来挑战。以下列表突出了益处、挑战和适应措施，以及改善所有用户的感知、操作性和理解性的策略示例，同时为行动、视觉、听觉、认知和运动相关残疾的用户提供特定适应：\n\
  \n- **Mobility accommodations:**\n  - **Challenges:** Motion controls often require\
  \ specific physical positioning, and precise interactions could create barriers.\n\
  \  - **Solutions:** Provide alternative input methods for all actions (voice commands,\
  \ eye tracking), enable control remapping, allow input sensitivity adjustments,\
  \ and include specialized tooling for personalized mobility support.\n- **Visual\
  \ accommodations:**\n  - **Challenges:** Reading text can be difficult, color differentiation\
  \ may be challenging, glasses might cause discomfort, and screen reader compatibility\
  \ can be limited.\n  - **Solutions:** Offer adjustable text size and contrast, haptic\
  \ feedback for events, visual and non-visual labels for all content, and audio descriptions\
  \ of the environment.\n- **Auditory accommodations:**\n  - **Challenges:** Spatial\
  \ audio design may be inconsistent, directional sounds might be hard to pinpoint,\
  \ and reliance on voice chat can limit accessibility.\n  - **Solutions:** Incorporate\
  \ mono audio options, offer customizable captions and visual cues, include signing\
  \ avatars, and provide adjustable left-right audio balance.\n- **Cognitive accommodations:**\n\
  \  - **Challenges:** Users may experience sensory overload, disorientation, time\
  \ mismanagement, and overly complex interfaces.\n  - **Solutions:** Utilize teleport\
  \ buttons, provide easy re-orientation options and scalable UI/HUD, offer step-by-step\
  \ tutorials, and include guided interactions.\n\n\n\n\n\n- **晕动症缓解：**\n  - **挑战：**\
  \ 虚拟世界与现实世界运动之间的感官不匹配会引起不适。\n  - **解决方案：** 采用更高的帧率，使用瞬移式移动而非平滑移动，允许用户限制摄像机运动，使用冷却风扇，集成触觉反馈，并允许逐步适应。\n\
  \n- **其他注意事项：**\n  - **挑战：** 闪烁图像可能引发癫痫，XR 技术可能导致眩晕，使用后用户可能难以重新适应。\n  - **解决方案：**\
  \ 限制闪烁图像，传送时使用淡入淡出过渡，并允许在环境中逐步适应。\n\n##### 虚构案例研究：虚拟密室逃脱\n\n考虑一家跨国公司决定在其季度团队建设活动中举办一个面向全体员工的虚拟密室逃脱。首要目标是通过让参与者协作解谜、分享见解并实时庆祝小胜利来促进跨部门关系。通过参与这一共同挑战，同事应建立信任和融洽关系，带着更强的\
  \ camaraderie 离开，并对每个参与者的独特技能产生新的欣赏。\n\n然而，让我们设想一些用户患有前庭障碍——影响平衡和空间定向的疾病，常导致头晕、眩晕和定向障碍。以下适应措施突出了开发人员可以用来减少定向障碍、稳定用户视角并确保\
  \ VR 项目对前庭障碍更具包容性、最终更具吸引力的关键策略：\n\n- **传送或舒适移动：**\n  - **是什么：** 而不是通过平滑的连续行走或飞行在环境中移动，用户“跳跃”到所需位置或进入“低速”模式。\n\
  \  - **为何重要：** VR 中突然或连续的运动会引发强烈的不适或晕动症。传送/舒适模式减少了视觉与身体运动之间的差异。\n\n- **稳定参考框架：**\n\
  \  - **是什么：** 虚拟地平线、驾驶舱或其他在用户移动时保持固定的静止元素。\n  - **为何重要：** 一致的参考点有助于抵消定向障碍，为用户的平衡提供锚点并减轻前庭负担。\n\
  - **可调节视野（FOV）：**\n  - **是什么：** 允许用户缩小视野或启用晕影效果，通过在移动期间去除分散注意力的背景细节来聚焦注意力。\n  -\
  \ **为何重要：** 外周视觉会加剧晕动症。在移动期间调整或减少 FOV 可减轻视觉输入的强度。\n- **轻松访问暂停和休息：**\n  - **是什么：**\
  \ 明确的暂停或退出 VR 环境的选项，以及活动中的自然中断点。\n  - **为何重要：** 能够在不适出现时迅速退出，有助于用户在症状升级前管理症状，鼓励持续参与。\n\
  - **迭代用户测试和反馈：**\n  - **是什么：** 邀请已知有运动敏感性的参与者测试早期原型，并在最终体验中提供反馈机制。\n  - **为何重要：**\
  \ 患有前庭疾病的用户比通用指南更可靠地识别隐藏的触发因素或问题，从而为更有针对性的改进提供信息。\n\n这种包容性方法最终惠及所有人。这些适应措施允许患有前庭不适的人在环境中公平参与，并让他们在保持原有的同时加强跨部门关系，并参与支持性、创新性和凝聚力的组织文化。\n\
  \n通过优先考虑包容性，组织可以营造一个让所有员工都能充分参与并蓬勃发展的环境。在此基础上，让我们探讨如何定制 AR 以进一步增强可访问性。\n\n#####\
  \ 通过定制增强 AR 可访问性\n\n**增强现实（AR）** 通过将虚拟元素——如文本、图像和交互功能——直接叠加到周围环境中，改变了人们与数字内容互动的方式。与将个人完全沉浸于完全数字世界的\
  \ VR 不同，AR 利用智能手机、平板电脑或头显等设备上的摄像头、传感器和专用软件来增强而非取代物理环境。\n\n这种方法已被众多领域采用：在零售中，客户可以虚拟“试穿”产品；在现场培训中，工人在机器上看到实时指令；在教育环境中，学生可以更深入地探索历史文物或科学过程的分层视图。\n\
  \nAR 潜力令人信服的例证是“智慧城市”概念，访客使用 AR 应用访问附近地点的增强细节。用户可以将手机对准建筑物以查看其修复的 3D 时间线，或扫描街头标志以获取该区域的额外详细信息。这些功能有助于将被动参观转变为互动式讲故事体验。\n\
  \nAR 与 VR 类似，也可能为残疾用户带来障碍。视力障碍者可能难以看清小或低对比度文本；听力或重听访客需要音频解说字幕或手语替代；行动不便的人可能发现长时间举着设备或执行精确手势会感到疲劳。此外，认知能力有限的人可能因多个屏幕图层的杂乱而感到不知所措。\n\
  \n这些挑战凸显了以用户为中心设计的重要性。每个界面决策——无论是文本大小、颜色对比度，还是数字叠加何时以及如何出现——都可能促进或阻碍可访问性。通过与多样化用户群体测试、收集迭代反馈并相应地完善\
  \ AR 实现，开发人员和机构能够创造更具包容性和公平性的体验。\n\n##### 设计包容性 AR 体验\n\nAR 与 VR 类似，对残疾人士提出了独特挑战。以下列表概述了挑战和解决方案，以改善\
  \ AR 环境中的感知、操作性和理解，解决与移动性、视觉清晰度、听觉提示和认知负荷相关的问题：\n\n- **移动性适应：**\n  - **挑战：** 与 AR\
  \ 元素的交互可能需要精确的手势或特定的身体位置，这在动态的现实世界环境中可能具有挑战性。\n  - **解决方案：** 提供替代输入方法（语音命令、保持在原地的单点触控虚拟按钮），启用手势灵敏度调整，并提供可定制的控制方案以支持更顺畅的交互。\n\
  - **视觉适应：**\n  - **挑战：** 由于光照条件变化、背景干扰以及虚拟元素与物理环境之间对比度不足，AR 内容可能难以阅读或解释。\n  - **解决方案：**\
  \ 提供可调节的文本大小、对比度和亮度设置；实现高对比度模式；并允许用户重新定位或调整 AR 叠加层的大小以增强清晰度和可读性。\n- **听觉适应：**\n\
  \  - **挑战：** AR 中依赖听觉提示对听力受损用户可能有问题，环境噪音可能进一步阻碍音频清晰度。\n  - **解决方案：** 加入可定制的字幕和副标题，提供视觉音频警报，并提供单声道音频或可调节音频平衡选项。\n\
  - **认知适应：**\n  - **挑战：** 数字和物理信息的同时呈现可能导致认知过载、困惑或分心。\n  - **解决方案：** 简化用户界面，提供清晰的分步指导，使用一致且直观的设计模式，并允许用户自定义显示信息的密度。\n\
  \n##### 虚构案例研究：博物馆中的可定制 AR 叠加层\n\n考虑一家著名艺术博物馆推出了 AR 智能手机应用程序，以丰富每个人的参观体验，特别是听力受损者。首要目标是为每个展品提供深入背景，让顾客可以扫描绘画或雕塑以实时获取补充信息、历史背景和策展人见解。通过与这些数字叠加层互动，客人可以探索每件作品背后的隐藏叙事，并培养对博物馆藏品的更深欣赏。\n\
  \n\n\n\n\n通过在 AR 应用中整合这些定制策略，创作者可以拓宽并增强参与度，并为访客提供更具包容性的体验。\n\nAR 中的适应性和定制只是创建更易访问的数字体验的一种方式。现在，让我们来看看这一努力中的另一个强大工具——AI，它正在彻底改变可访问性大规模实施的方式。\n\
  \n##### 利用 AI 自动化纳入可访问性实践\n\n人工智能（AI）无处不在。我们在社交媒体上的个性化广告、用于解锁手机的人脸识别、阅读我们日程的语音助手以及帮助我们标记照片的图像识别中都能看到它。它也在重塑我们的日常任务，从筛选无数电子邮件和整理杂乱的文件，到生成创意建议甚至自动化例行文书工作。\n\
  \nAI 通过比传统自动化更灵活的方式识别常见——但并非全部——障碍，从而彻底改变了可访问性。当与代理框架结合时，AI 可以检测频繁出现的问题，例如未标记的按钮、不正确的标题结构和低对比度文本，同时生成包含可操作修复步骤的标准化报告。开发过程中实时反馈和自动建议使工程师能够在软件生命周期的更早阶段整合可访问性，从而减少后期昂贵的修复。虽然\
  \ AI 不能取代人工监督，但其持续监控和数据驱动的洞察使可访问性工作更具前瞻性、可扩展性和有效性。\n\n将 AI 集成以支持可访问实践为应用创作者和其中所含内容的用户带来了独特的一系列挑战。例如，旨在帮助视障用户的\
  \ AI 驱动应用必须具有前瞻性，并确保与现有指导兼容，以便与辅助技术（例如屏幕阅读器）兼容。同样，最佳做法是尽可能简单地实现界面，即使是大量融入 AI 的界面，也要避免过度复杂。\n\
  \n在设计和开发 AI 驱动的可访问性功能过程中做出的决策——从用户界面元素的选择到数据处理方法——可能会促进或阻碍包容性。从一开始就认识并理解潜在用户的不同能力和需求至关重要。\n\
  \n##### 构建包容性 AI：预测文本、算法偏见和公平设计\n\nAI 技术虽然具有变革性，但如果设计和开发排除残疾人，就有边缘化残疾用户的风险。让我们来看看三个关键领域——预测文本、语音识别中的算法偏见和公平\
  \ AI 设计——包括其挑战和可能的解决方案。\n\n###### 预测文本\n\n预测文本算法经常“纠正”来自阅读障碍用户的非标准拼写，导致可能扭曲关键信息的错误。例如，考虑一位阅读障碍专业人士，其电子邮件被自动更正误解，导致非预期的替换，从而损害沟通。一个潜在的解决方案是扩展训练数据集，以包含更多语言模式的多样性，并启用可定制的自动更正设置。\n\
  \n###### 语音识别中的算法偏见\n\n语音助手经常误解有言语障碍用户的非标准语音模式，这可能导致此类工具预期操作方面的实际问题。如果一位有言语障碍的用户在智能手机助手的识别中反复失败，最终可能导致现实生活中的日程安排问题。解决这一挑战涉及将更广泛的语音样本纳入训练数据并改进识别算法，同时提供更新以提高非典型语音模式的准确性。\n\
  \n###### 公平 AI 设计\n\n严重依赖视觉线索的 AI 系统会排除视障用户，这一缺陷在早期导航应用中可见。例如，当导航应用不提供非视觉界面时，对视障用户来说几乎无法使用。解决方案在于整合通用设计原则，例如听觉反馈、触觉响应和可定制界面。\n\
  \n###### 虚构案例研究：面向运动障碍用户的 AI 驱动预测文本\n\n想象一家开创性的软件公司推出了一个 AI 驱动的预测文本系统，旨在包容运动障碍人士。该系统利用机器学习算法根据用户的打字模式和上下文使用情况预测并建议下一个单词或短语。\n\
  \n通过分析用户输入并检查对话的上下文，AI 的加入能够显著减少所需的按键次数，并使用户能够更高效地沟通，减少身体负担。\n\n此外，AI 驱动的预测文本系统可以适应每个用户的独特打字习惯，提供与用户既定模式一致的个性化建议。此实现有可能促进用户更顺畅的沟通。\n\
  \n以下调整突出了开发人员可以用来增强 AI 实现中的可访问性、包容性和用户友好性的关键策略：\n\n- **简化交互模型：**\n  - **它是什么：**\
  \ 设计具有简单直观交互路径的 AI 界面，以最小化复杂性。\n  - **为什么重要：** 简化的交互模型使认知障碍用户或那些可能因过于复杂的界面而感到不知所措的用户更容易导航\
  \ AI 系统，确保更易访问和用户友好的体验。\n- **多语言和多模态支持：**\n  - **它是什么：** 提供多种语言和交互模式的支持，例如语音、文本和手势。\n\
  \  - **为什么重要：** 满足不同的语言背景和首选交互方式，使 AI 技术对更广泛的受众更易访问，包括非母语者和具有不同沟通偏好的用户。\n- **情境辅助：**\n\
  \  - **它是什么：** 实施 AI 驱动的情境帮助和指导，根据用户的当前任务和环境进行调整。\n  - **为什么重要：** 情境辅助提供及时且相关的支持，使有残疾的用户更容易导航和有效利用\
  \ AI 系统，而不会感到不知所措或迷失，从而增强整体用户体验。\n- **错误预防和恢复：**\n  - **它是什么：** 实施能够预测潜在用户错误并提供简易恢复选项的\
  \ AI 系统。\n  - **为什么重要：** 主动预防错误并提供简单的恢复机制，有助于用户，尤其是残疾用户，更自信地导航 AI 系统并减少挫败感，从而提高整体可用性。\n\
  - **持续用户反馈和迭代：**\n  - **它是什么：** 实施机制让用户提供持续反馈，并利用这些输入来完善 AI 功能。\n  - **为什么重要：**\
  \ 来自残疾用户的定期反馈确保 AI 可访问性功能保持有效和相关，允许基于实际使用和不断变化的需求进行持续改进。\n\n当选定的调整嵌入到 AI 驱动系统中时，残疾人士更有可能在没有因缺乏适应性策略而造成的额外障碍的情况下使用技术。\n\
  \n接下来，让我们探讨如何减轻 AI 驱动界面中的算法偏见。\n\n##### 减轻 AI 驱动界面中的算法偏见\n\n算法偏见出现在 AI 系统由于机器学习过程中嵌入的偏见假设而产生偏斜或不公平结果时。这些偏见通常反映了训练数据中存在的社会不平等，导致歧视性结果，不成比例地影响有色人种社区以及其他用户群体。\n\
  \n例如，一个主要基于特定人群数据训练的 AI 驱动语音识别工具，可能对有言语障碍的用户或数据集未反映的语言背景的用户表现不佳。\n\n减轻偏见需要一个全面的策略，包括多样化的数据获取、透明的算法开发、持续监控和包容性测试实践，以增强技术的公平性，并促进社区内的信任和包容性。\n\
  \n\n\n\n\n##### 数据偏差与代表性\n\n在有偏数据上训练的 AI 模型可能会无意中延续现有的不平等，导致不同用户群体之间的性能不均。2018 年，有报道称，包括圣迭戈大都会交通系统在内的多个执法机构使用的面部识别技术，对肤色较深的个人表现出显著偏差（https://techxplore.com/news/2023-09-skin-color-bias-facial-recognition.html）。结果是该技术在所有用户群体中的性能不公平。\n\
  \n如果 AI 系统继承了训练数据集中存在的这些偏差，就可能导致其对某些人口群体表现不佳。这种代表性不足可能导致排他性结果，即特定用户群体的需求得不到充分满足。更广泛地说，这还可能导致用户接收到不准确的信息，并削弱用户有效且独立地与数字内容交互的能力。\n\
  \n以下是应对数据偏差的一些策略：\n\n- **定期偏差审计：** 使用公平性指标、异常检测和人口统计分析进行评估，以识别模型在不同用户群体中的性能差异。\n\
  - **多样化训练数据集：** 纳入反映用户多样性的数据——这可能包括但不限于各种残疾、文化背景和语言差异。\n- **包容性开发团队：** 在开发和测试阶段让残疾社区的个人参与，以确保解决方案能够解决用户面临的现实挑战。\n\
  \n##### 能力主义风险与对工具实现的过度依赖\n\n开发团队内部的能力主义和无意识偏见会影响 AI 工具的设计和功能，导致解决方案优先考虑效率而非真正的包容性。这可能表现为对残疾用户需求的假设，可能忽视需要更细致方法的关键可访问性方面。\n\
  \n企业越来越多地依赖自动化的可访问性工具、覆盖层和 AI 驱动的解决方案来实现合规，但过度依赖这些技术会带来重大风险。自动检查器和覆盖层通常会提供虚假的可访问性感，遗漏影响残疾人士并给企业带来开发、修复和服务实施额外成本的关键可用性问题。\n\
  \n例如，批评者认为可访问性覆盖层虽然出于好意，但通过提供不解决根本可访问性问题且有时会干扰现有辅助技术的表面修复，从而助长了能力主义做法。覆盖层可能会遮挡重要内容，破坏键盘导航，并且无法为屏幕阅读器用户提供有意义的改进。\n\
  \n此类实施可能导致挫败感、信任度下降，以及用户感到被排斥，认为他们的独特挑战未被承认或解决。\n\n以下是应对偏见思想和能力主义的一些策略：\n\n- **文化能力培训：**\
  \ 为开发团队提供关于文化能力和残疾人士多样化经历的培训。这有助于培养更富有同理心和知情的工具设计方法。\n- **以用户为中心的参与：** 采用以用户为中心的设计理念，持续与来自各种残疾社区的用户互动。\n\
  - **包容性政策制定：** 制定并执行明确解决并抵制组织内部能力主义的政策。这包括设定包容性语言、设计实践和对所有用户公平对待的标准。\n- **定期多样性评估：**\
  \ 进行评估以衡量开发团队及其实践的多样性和包容性。吸纳多元化劳动力是减轻能力主义假设风险并促进更广泛观点的根本。\n\n##### 减轻算法偏差的最佳实践\n\
  \n以下策略概述了开发者可以实施的基本方法，以评估和减少 AI 驱动辅助技术中的潜在偏差。\n\n- **多样化和具有代表性的数据收集：**\n  - **是什么：**\
  \ 收集准确反映目标用户群体多样性的训练数据，包括种族、性别、年龄、残疾类型和语言背景的差异。\n  - **为何重要：** 确保数据集涵盖广泛的用户人口统计，有助于防止\
  \ AI 模型形成偏斜或有偏模式，并在不同用户群体中建立更公平的性能。\n\n- **偏差检测与审计：**\n  - **是什么：** 实施系统化程序来识别和衡量\
  \ AI 模型中的偏差，使用为偏差检测而设计的工具和框架。\n  - **为何重要：** 定期对 AI 系统进行偏差审计使开发者能够在影响用户之前找出并解决不公平模式，并保持技术的完整性和公平性。\n\
  - **透明的算法设计：**\n  - **是什么：** 开发具有清晰、可理解结构并提供解释决策过程文档的 AI 算法。\n  - **为何重要：** 算法设计的透明度允许更大的问责制并促进潜在偏差的识别，使利益相关者能够信任并验证\
  \ AI 驱动界面的公平性。\n- **包容性测试与验证：**\n  - **是什么：** 与多样化的用户群体进行全面测试，包括各种残疾人士，以确保 AI 系统公平运行。\n\
  \  - **为何重要：** 包容性测试有助于发现隐藏的偏差和可用性问题，使开发者能够完善 AI 模型以更好地服务于用户群体的所有细分。\n- **持续监控与反馈循环：**\n\
  \  - **是什么：** 建立持续的监控流程和反馈机制，以跟踪 AI 性能和用户体验随时间的变化。\n  - **为何重要：** 持续监控确保任何出现的偏差或性能差异都能及时得到解决，保持\
  \ AI 驱动辅助技术的长期公平性和有效性。\n\n当这些策略在 AI 驱动界面中实施时，残疾人士可以公平、无偏见地使用技术。\n\n#### 总结\n\n在本章中，我们探讨了新兴技术——VR、AR\
  \ 和 AI——中的可访问性挑战和机遇，阐明了深思熟虑的设计选择如何使这些体验更具包容性。从为感官和行动需求调整 VR 环境，到为清晰度和可用性定制 AR 覆盖层，我们研究了增强数字公平的现实策略。我们还处理了\
  \ AI 在自动化可访问性、减轻偏差和确保辅助技术公平性方面的作用。\n\n在下一章中，我们将把重点转移到探索公司和开发者如何成功实施这些可访问性原则来构建真正包容的产品。\n\
  \n现在，如果你允许我，我得去指挥那只拉大提琴的鸟了。\n\n### 10\n\n#### 可访问设计系统模式的基础\n\n作者：Charlie Triplett\n\
  \n基础结构必须为其上所建的一切提供坚实平台。设计系统文档通常依赖于此类隐喻概念，当我们将物理理想应用于可访问性时，我们会发现更深层的含义，这将影响我们的技术和优先事项。\n\
  \n任何物理结构都必须在设计和建造时考虑到将施加在其上的所有力量——不仅仅是美观。如果一个结构建在地震带，自然地，它必须优先考虑地质应力——但它仍然必须抵御其他自然事件，如雨、雪、冰和风。一个能抵御地震但在雨中侵蚀的基础并不是成功。\n\
  \n同样，一个仅考虑一种辅助技术而未先深入挖掘以支持所有周边和交叉残疾的浅层设计系统也会同样失败——本章将帮助你避免这一陷阱。\n\n屏幕阅读器是可访问性专家经常演示的最密集和最令人惊叹的辅助技术，原因显而易见。许多人仍然不知道盲人甚至可以使用计算机或智能手机，这一启示产生了巨大影响。\n\
  \n\n\n\n然而，屏幕阅读器的强大能力导致人们过度依赖它们，将其视为无障碍实践的主要原因，从而过度强调“支持屏幕阅读器”本身就意味着“无障碍”，而不是去考虑残障人士的需求。\n\
  \n![](img/3bdc9e2d41de898f8a3bcc9634b0000e_240_0.png)\n\n图10.1：仅接触过屏幕阅读器的团队认为他们需要付出的努力\n\
  \n但是，当然，除了失明人士之外，还有其他残障人士需要我们消除障碍，而他们甚至没有使用屏幕阅读器之类的辅助技术，也没有依赖键盘之类的设备：\n\n-   那些自称甚至没有残疾的人，也会在文字过小难以阅读、或文字与背景对比度太低时每天都遇到障碍，尤其是在增大默认字号却毫无效果的情况下\n\
  -   色觉缺陷的人会在仅凭颜色（如红色和绿色）传达含义时遇到障碍\n-   全屏视频接管可能导致前庭障碍患者出现晕动症状\n-   失聪或重听的人可能更愿意阅读视频的文字记录，而不是看完整个视频并观看同步字幕\n\
  -   不流利掌握另一种语言的人可能难以完成复杂的表单\n-   有言语障碍的人可能会寻找在线聊天功能，而不是打电话给客服\n\n要真正创建一个无障碍设计系统，它必须为所有人消除障碍，为使用屏幕阅读器的人和患有交叉性残疾的人奠定更广泛、更周到的用户体验基础。\n\
  \n![](img/3bdc9e2d41de898f8a3bcc9634b0000e_241_0.png)\n\n图10.2：一种更有效的设计系统方法，以人为本，而不只是以技术为先\n\
  \n本章从以人为本的视角，剖析日常设计模式和组件中的无障碍挑战。它涵盖了如何构建设计系统的实用指南，促使使用方团队默认以无障碍方式设计和构建，而不必事后修补无障碍问题。\n\
  \n首先，我们将思考如何为不使用辅助设备、仅使用设备无障碍设置的人们进行设计：\n\n-   低视力\n-   色觉\n-   失聪或重听\n-   认知障碍\n\
  -   运动障碍：为不精确的动作而设计\n-   运动敏感\n-   光敏性\n-   言语障碍\n\n然后，在完成这些考虑后，我们将探讨为使用辅助技术的人们进行设计：\n\
  \n-   运动障碍：为辅助设备和软件设计\n-   极低视力或失明\n-   残疾的交叉性\n\n到本章结束时，你将认识到残障人士面临的潜在障碍，掌握一个评估人们需求以及规划稳健设计系统的框架——所有这些都按正确的顺序进行，以最大限度地提高包容性。\n\
  \n##### 低视力\n\n如果把所有人都考虑在内，从低视力开始，就会发现我们实际上是在为超过一半的人口消除无障碍障碍。\n\n根据视觉委员会的数据，63.7%的美国成年人佩戴处方眼镜，2018年，92.4%的65岁及以上美国联邦医疗保险受益人表示他们使用眼镜。这些人不会说自己有残疾或需要无障碍帮助，因为他们的眼镜或隐形眼镜（辅助技术的一种形式）矫正了他们的视力。\n\
  \n随着年龄增长，我们的视力也会变化。大约一半的人使用动态字体（Dynamic Type）来增大移动设备上的文字大小。这些人可能不使用老花镜，当然也不会认为自己有残疾。\n\
  \n荷兰Appt基金会的一项调查（https://appt.org/en/stats）发现以下情况：\n\n-   45%接受调查的荷兰iOS用户在其手机上启用了至少一项无障碍设置（如放大文字大小）\n\
  -   15%在iOS上使用两种或更多无障碍功能\n-   61%接受调查的荷兰Android用户在其手机上启用了至少一项无障碍设置，25%使用两种或更多无障碍功能\n\
  \n通过首先适应低视力，有价值的可供性会级联到设计系统的其余部分，惠及有其他残疾的人。设计系统必须足够健壮，能够应对动态调整大小的排版，定义颜色和排版资产的用途，足够灵活以根据浏览器设置重新排版，并认识到人们体验界面的替代方式。\n\
  \n###### 规划动态排版\n\n人们必须能够在网页上将文本的默认大小最多更改为200%，或者按特定平台、浏览器或操作系统上的设置所允许的方式更改。请注意，这不同于使用Cmd+或Ctrl+键在浏览器中放大。\n\
  \n如果字体无法增大或布局无法容纳更大的文字，那么界面不仅会变得难以阅读甚至看似损坏，而且任何将界面翻译成另一种语言的人也会遇到布局损坏的问题（例如从英语翻译成法语）。\n\
  \n文字必须能够增大而不破坏其容器，也不会被部分或完全隐藏，且不依赖于任意特定的布局高度或宽度是否可用。系统中的所有对象都必须适应多种多样的排版条件（包括更改默认字体族本身）。在创建设计模式时，应演示该功能将如何适应更大的文字。\n\
  \n###### 支持网页浏览器缩放\n\n低视力人群通常依赖浏览器缩放（使用Cmd+或Ctrl+等键盘快捷键）来放大页面上的所有内容。\n\n适应这一需求的最佳方式是记录并指导使用设计系统的团队采用响应式移动优先的设计和开发实践。与其将缩放视为一个独立功能，不如理解为：缩放实质上会调整整个视口的大小，就像在更小的屏幕上查看内容一样。\n\
  \n具体来说，WCAG SC 1.4.10：重排指南通常要求界面在320 CSS px视口（对于垂直滚动页面）或256 CSS px高度（对于水平滚动内容）下无需双向滚动即可正常工作。例如，这意味着当你的响应式移动优先设计以320\
  \ px作为最小视口时，你的界面无需任何额外努力即可符合要求。\n\n###### 交付有意图的排版模式，而不仅仅是资产\n\n虽然设计系统应尽可能为使用方团队提供创作自由度，但如果不加以约束，同样的自由度也会造成不可访问的模式。没有比排版的用法更重要的指导了，而且由于其细微性和技术性，设计系统必须对其预期用途做出规定。\n\
  \n###### 字体缩放与字号：理解二者的区别\n\n在规划排版模式时，理解字体缩放和字号的区别至关重要——以及这对无障碍为何重要：\n\n-   **字号**指的是分配给文字的数值，例如16\
  \ px或1 rem。它是一种代码层面的指令，告诉浏览器或设备文字应该有多大。\n-   另一方面，**字体缩放**指的是字体本身在该字号下的视觉渲染效果。x字高、笔画粗细和字母比例等因素会影响字体在屏幕上的实际大小。因这些特性，两种被赋予相同字号的字体可能在视觉尺寸上差异显著。\n\
  \n设计系统必须同时考虑字号和字体缩放，以确保文字保持可读并符合无障碍标准。如果品牌字体在相同字号下比标准字体渲染得更小，则可能需要分配更大的字号来补偿其视觉比例。\n\
  \n例如，常见的Arial字体按其指定的像素行高真实渲染。16 px的Arial从最高字母顶部到最低下行字母底部的光学高度正好为16像素。（这可能因浏览器的渲染引擎不同而略有差异。）然而，另一种字体尽管被赋予相同的字号，渲染出来可能会在光学上显得更小。在以下示例中，即使代码规定了16\
  \ px的字号，比例调整不佳的自定义品牌字体渲染出来也明显更小。\n\n![](img/3bdc9e2d41de898f8a3bcc9634b0000e_244_0.png)\n\
  \n图10.3：缩放比例不匹配会影响字号渲染\n\n###### 文字对比度\n\n所有使用手持设备的人都会遇到可见度差的情况。例如，在明亮的阳光下使用智能手机时，屏幕相对昏暗且难以阅读。同样，当屏幕为省电而变暗时，低对比度的文字和图形也会成为每个人的障碍。\n\
  \n下表列出了普遍接受的文字颜色对比度要求。如前所述，由于不同字体可以按不同比例渲染，CSS像素必须通过光学角度来解读，而不是仅仅依据其定义的像素大小。\n\n\
  \n\n\n\n| 光学 CSS 像素 | 粗细 | 比率 |\n|---|---|---|\n| <24 px | 常规 | 4.5:1 |\n| >=18\
  \ px | 粗体 | 3:1 |\n| >=24 px | 常规 | 3:1 |\n\n*图 10.4：通用文本尺寸和对比度指导*\n\n对于视力低下的人来说，文本与其背景之间足够的对比度对于消除获取内容的障碍至关重要。在一种情境下满足对比度要求的文本在其他情境下仍可能构成障碍，如本例所示：\n\
  \n此 18px 深灰色 [#222222] 文本与纯白色 [#ffffff] 对比度为 16:1，轻松满足对比度要求。\n\n此 18px 中灰色 [#767676]\
  \ 文本与纯白色 [#ffffff] 对比度为 4.5:1，勉强满足对比度要求。\n\n此 18px 中灰色 [#767676] 文本与浅灰色 [#eeeeee]\
  \ 对比度为 3.9:1，未满足小文本的对比度要求。\n\n此 18px 粗体中灰色 [#767676] 文本与浅灰色 [#eeeeee] 对比度为 3.9:1，满足粗体文本的对比度要求。\n\
  \n此 24px 中灰色 [#767676] 文本与浅灰色 [#eeeeee] 对比度为 3.9:1，满足大文本的对比度要求。\n\n*图 10.5：对比度和尺寸示例*\n\
  \n##### 信息图形对比度与笔画宽度\n\n信息图形，例如用于标识 UI 组件名称、角色或状态的图标或控件状态指示器，在标识时也必须兼顾视力低下用户。实心厚形状，例如警告图标，仅需满足\
  \ 3:1 的对比度比率，但使用 1 px 笔画的极简汉堡菜单图标必须满足 4.5:1 的对比度比率：\n\n| 笔画宽度 | 比率 |\n|---|---|\n\
  | 1 px | 4.5:1 |\n| >=2 px | 3:1 |\n\n*图 10.6：通用图形笔画宽度和对比度比率*\n\n##### 指导色彩选择，而不仅仅是提供调色板\n\
  \n为其产品设计和开发消费设计系统的团队应提供满足对比度标准的文本颜色和背景配对。虽然存在多种工具可对色彩配对进行数学分析并生成可接受组合表，但并非每种组合在视觉上都是理想的。提供可接受模式和[content]\n\
  \n| 光学 CSS 像素 | 粗细 | 比率 |\n|---|---|---|\n| <24 px | 常规 | 4.5:1 |\n| >=18 px | 粗体\
  \ | 3:1 |\n| >=24 px | 常规 | 3:1 |\n\n*图 10.4：通用文本尺寸和对比度指导*\n\n对于视力低下的人来说，文本与其背景之间足够的对比度对于消除获取内容的障碍至关重要。在一种情境下满足对比度要求的文本在其他情境下仍可能构成障碍，如本例所示：\n\
  \n此 18px 深灰色 [#222222] 文本与纯白色 [#ffffff] 对比度为 16:1，轻松满足对比度要求。\n\n此 18px 中灰色 [#767676]\
  \ 文本与纯白色 [#ffffff] 对比度为 4.5:1，勉强满足对比度要求。\n\n此 18px 中灰色 [#767676] 文本与浅灰色 [#eeeeee]\
  \ 对比度为 3.9:1，未满足小文本的对比度要求。\n\n此 18px 粗体中灰色 [#767676] 文本与浅灰色 [#eeeeee] 对比度为 3.9:1，满足粗体文本的对比度要求。\n\
  \n此 24px 中灰色 [#767676] 文本与浅灰色 [#eeeeee] 对比度为 3.9:1，满足大文本的对比度要求。\n\n*图 10.5：对比度和尺寸示例*\n\
  \n##### 信息图形对比度与笔画宽度\n\n信息图形，例如用于标识 UI 组件名称、角色或状态的图标或控件状态指示器，在标识时也必须兼顾视力低下用户。实心厚形状，例如警告图标，仅需满足\
  \ 3:1 的对比度比率，但使用 1 px 笔画的极简汉堡菜单图标必须满足 4.5:1 的对比度比率：\n\n| 笔画宽度 | 比率 |\n|---|---|\n\
  | 1 px | 4.5:1 |\n| >=2 px | 3:1 |\n\n*图 10.6：通用图形笔画宽度和对比度比率*\n\n##### 指导色彩选择，而不仅仅是提供调色板\n\
  \n为其产品设计和开发消费设计系统的团队应提供满足对比度标准的文本颜色和背景配对。虽然存在多种工具可对色彩配对进行数学分析并生成可接受组合表，但并非每种组合在视觉上都是理想的。提供可接受模式和精致使用的示例，以便消费团队做出良好的选择。\n\
  \n##### 可访问的色彩组合\n\n![](img/3bdc9e2d41de898f8a3bcc9634b0000e_246_0.png)\n\n*图 10.7：可使用诸如\
  \ toolness.github.io/accessible-color-matrix 之类的自动化工具来识别可访问的色彩配对表。*\n\n我们必须避免 100%\
  \ 白色与 100% 黑色搭配。对于患有散光的人来说，这种强烈对比会使文本显得不舒服地鲜艳，尤其是在黑色背景上的白色文本。\n\n##### 放大工具的可用性\n\
  \n视力极低的人也可能使用放大软件，允许他们放大屏幕的很小部分。在手持设备上，这通常意味着捏合/缩放。\n\n一次只能看到屏幕的一小部分，这意味着视力低下的人在查找页面上随意散布的内容和控件时会遇到困难。\n\
  \n虽然某些控件无疑与其标签分组，例如复选框或单选按钮，但切换开关和展开器通常被分隔到内容的相对两侧，为视力低下的人造成障碍。\n\n![](img/3bdc9e2d41de898f8a3bcc9634b0000e_247_0.png)\n\
  \n图 10.8：复选框和单选按钮几乎普遍安排为控件和标签彼此靠近\n\n与此同时，这些切换开关和展开器已被允许填满可用空间，无疑令设计经理满意，但对视力低下的人来说是问题：\n\
  \n![](img/3bdc9e2d41de898f8a3bcc9634b0000e_247_1.png)\n\n图 10.9：这些切换开关和展开器都为视力低下的人造成了障碍\n\
  \n使用放大功能查看屏幕的人将难以理解这些标签和控件之间的关系。\n\n将所有控件和指示器直接放置在文本标签附近有助于每个人。如果必须将控件指示器放置在标签右侧的对面，请为组件设置最大宽度。\n\
  \n![](img/3bdc9e2d41de898f8a3bcc9634b0000e_248_0.png)\n\n图 10.10：将切换开关和展开器控件指示器放置在其标签附近有助于每个人\n\
  \n随着这些障碍被移除，视力低下的人在使用放大、浏览器缩放或只是更改默认字体大小时，设计系统将成为为所有人创造更好体验的基础。\n\n##### 色彩感知\n\n\
  色盲，也称为色觉缺陷，会导致人们难以区分或无法区分某些颜色。这影响了大约 12 名男性中的 1 人和 200 名女性中的 1 人（占人口的 8%），这意味着涉及色彩感知的任务，例如识别交通灯或分类衣服，可能会很麻烦。\n\
  \n就设计而言，使用绿色和红色来指示流程的成功或失败会成为无法感知这些颜色差异的人的障碍。\n\n![](img/3bdc9e2d41de898f8a3bcc9634b0000e_248_1.png)\n\
  \n图 10.11：在没有颜色辅助的情况下，无法辨别这两个错误消息之间的差异\n\n相反，包含文本来传达状态，例如成功、提醒或警告。花费在内容策略上的时间至少应与挑选完美警告图标所花费的时间一样多。虽然直观有意义的图标可以使用，但它们很少比实际文字更有用。\n\
  \n![](img/3bdc9e2d41de898f8a3bcc9634b0000e_249_0.png)\n\n*图 10.12：这些成功和错误消息不依赖于图标或颜色来传达含义，而是使用实际文字来帮助辨别错误消息之间的差异*\n\
  \n再次，通过确保设计系统不依赖颜色而是使用文本来传达含义，它增加了将向下级联给认知障碍人士和屏幕阅读器用户的可用性。\n\n##### 听力障碍或听力受损\n\
  \n设计系统音频和视频功能必须通过两个关键功能提供可访问性：\n\n- 封闭式字幕\n- 文字记录\n\n这两个功能不仅有利于 D/聋和听力受损用户，也有利于具有其他生活经历的人，例如非母语使用者、神经多样性用户以及在嘈杂或安静环境中的人。\n\
  \n###### 封闭式字幕\n\n封闭式字幕是视频中口语、声音和重要音频提示的同步文本表示。它们允许无法听到音频或在某些环境中难以处理音频的人跟上内容。封闭式字幕对\
  \ D/聋和听力受损用户至关重要，但在嘈杂空间（如机场）的人、非母语使用者甚至具有感官敏感性的人中也很常见。\n\n设计系统应执行以下操作：\n\n- 使字幕可切换。用户应能够在视频播放器内轻松打开和关闭字幕。\n\
  - 确保字幕同步。它们必须实时出现，准确表示口语内容和重要声音（例如笑声、门砰声等）。\n- 使用易读的样式。高对比度文本、可调字体大小和良好的放置选项可提高跨设备和屏幕尺寸的可读性。\n\
  \n###### 文字记录\n\n文字记录是音频或视频内容的全文版本。与字幕不同，它们不一定与媒体同步，但提供可独立阅读的完整文本。\n\n文字记录有利于广泛的用户群体：\n\
  \n- 屏幕阅读器用户可以比拖动音频更快地浏览文字记录\n- 非母语使用者可以参考文字记录以了解不熟悉的单词或短语\n- 带宽较低的人可以在视频加载之前阅读内容\n\
  \n设计系统应执行以下操作：\n\n- 提供清晰标记的链接或按钮以下载或查看文字记录\n- 将文字记录放置在视频播放器附近或专用、易于找到的标签中（绝不隐藏在晦涩的菜单后面）\n\
  - 在文字记录中包含有意义的标题和结构以帮助扫描和理解\n\n正如你所见，字幕和文字记录不仅仅是技术功能——它们是包容、联系和公平获取内容的桥梁。通过以深思熟虑的放置和直观的切换将这些可用性嵌入设计系统，团队可以创建满足现实需求的产品的产品。\n\
  \n##### 认知障碍\n\n认知障碍是指影响个人处理、学习、记忆和解决问题的能力的一系列差异。\n\n\n\n\n\n##### 在显眼处使用简明语言\n\n\
  首先，你应该认识到人们在消费、搜索、理解并有效使用你的产品时，并不总是拥有充足的时间、注意力和专注力。任何人都可能因繁忙的日程、嘈杂的环境或感冒药引起的嗜睡而受到影响。同样，具有认知差异的人可能需要额外的时间来完成任务或回忆信息。\n\
  \n如果人们找不到、无法消费和理解内容，他们就无法使用你的产品。通过风格指南和设计模式示例，鼓励团队避免使用行话、习语、营销术语和专业短语。\n\n阻止消费团队将重要信息隐藏在工具提示、对话框或展开器后面。隐藏的信息不会像放置在关键\
  \ UI 功能视觉邻近处的有用信息那样容易被消费。\n\n##### 文本输入的可用性\n\n当所有文本字段大小相同 时，所有人的认知负荷都会增加。相反，应根据预期输入来定义文本字段大小的规则。\n\
  \n例如，如果某个字段要求输入出生年份，该字段应足够宽以容纳四个字符，但不要更多。这使所有人都能一目了然地推断控件和输入字段的功能，既提高了每个人填写表单数据的速度，同时也减少了错误。\n\
  \n##### 鼓励自动完成\n\n人们发明计算机就是为了做重复性工作，而使用自动完成属性的输入也正是如此。当表单不使用或不允许自动完成时，所有人填写表单的摩擦都会增加。对于使用开关设备或替代导航的运动障碍人士来说，这可能是一个特别繁琐且令人沮丧的障碍。\n\
  \n##### 避免干扰\n\n注意力不集中的人需要无干扰的界面。对他们来说，无法快速暂停的自动播放视频或背景动画可能意味着 UI 无法使用。与此同时，交易中途试图推销的弹出窗口会引起烦躁（即使是那些没有专注问题的人也会如此），并将用户推向别处。解决办法很简单：如果它令人烦恼，就不具可访问性。对对话框、模态框和警报的使用制定严格的指导。\n\
  \n通过优先使用简明语言、合理的输入设计和最少的干扰，设计系统可以培养更具包容性的体验，使认知障碍人士能够充分参与。\n\n##### 运动障碍：为不精确的操作设计\n\
  \n设计可以适应那些只是难以精确与 UI 交互但并未使用其他辅助技术的运动障碍人士。\n\n很容易理解，更大的按钮对每个人来说都更容易点击。难以使用鼠标或精确点击屏幕的人在按钮太小或过于紧密排列时会遇到障碍。\n\
  \n为此，鼓励采用移动优先设计并使用尺寸宽裕的控件。虽然消费团队常感到压力要制作功能密集的界面，但设计系统的示例和文档必须提供支持可访问目标尺寸的示例。\n\n\
  要满足最低 WCAG AA 目标尺寸要求，对象必须为 24x24 px 大小且有 4 px 边距。更宽裕的 44x44 px 大小符合 WCAG AAA 和 HIG\
  \ 要求，而 Android Material Design 要求最小 48x48 dp 大小。\n\n![](img/3bdc9e2d41de898f8a3bcc9634b0000e_252_0.png)\n\
  \n图 10.13：WCAG AA 最小目标尺寸和 AAA 目标尺寸\n\n对于基于 HTML 的控件，如复选框、单选按钮、展开器和开关，整个标签也必须可点击，而不仅仅是控件本身。\n\
  \n![](img/3bdc9e2d41de898f8a3bcc9634b0000e_252_1.png)\n\n图 10.14：基于网络的控件如开关必须在点击标签和控件本身时激活\n\
  \n通过设计宽裕的触控目标并确保整个标签可点击，团队可以消除运动障碍人士的障碍——创建对每个人来说都感觉直观且可用的界面。倡导这些可用性的设计系统不仅满足可访问性标准，还能提供更具包容性的体验。\n\
  \n##### 运动敏感性\n\n患有前庭障碍的人可能会因 sweeping 动画或视频而生病。使用视差滚动或自动播放全屏视频的设计可能真的会让人头晕、恶心或迷失方向数小时。\n\
  \n###### 尊重减少动效设置\n\n首先记录自动播放视频和动画必须如何尊重设备的 **Prefers Reduced Motion** 设置。此系统设置在大多数操作系统中均可用，可在浏览器和原生移动应用中检测到，表示用户偏好更少的动效或动画。例如，当用户启用此设置时，设计系统应禁用视差效果，减慢或移除过渡，并在非用户触发的情况下暂停自动动画。\n\
  \n###### 提前规划动效变化\n\n设计系统必须记录视频或动画在关闭时会如何反应。例如，如果首屏横幅包含循环背景视频，请提供具有相似品牌或信息的静态备用图像。对于微动画，用微妙的淡入淡出或高亮效果替换它们，以传达相同的含义而不诱发运动病。\n\
  \n###### 提供易于找到的控件\n\n任何自动播放视频都必须包含直观、易于找到的暂停或停止播放控件。避免将这些控件埋藏在嵌套菜单中——理想情况下，将其放置在视频附近，并使用清晰的标签，如\
  \ **Pause animation** 或 **Stop motion**。对于背景动画（例如移动渐变或背景效果），提供切换开关，以便用户在需要时轻松禁用它们。\n\
  \n尊重运动敏感性的设计系统通过优先考虑舒适和福祉来建立用户信任。通过提供灵活的动效设置、备用视觉效果和易于找到的控件，团队可以创建使患有前庭障碍的人能够安全、\
  \ confidently 参与的界面。\n\n##### 光敏性\n\n光敏性人群会谨慎管理其对数字环境的接触，以降低癫痫发作或疾病的风险。触发因素包括闪烁灯光（如频闪效果）或某些高对比度视觉图案，如条纹、网格和棋盘格。对某些人来说，即使是细微的闪烁也可能导致头晕、头痛或迷失方向。\n\
  \n###### 制定明确的指导方针\n\n设计系统必须为所有动画和视频建立明确的指导方针，确保任何被归类为闪烁的内容每秒不超过三次闪烁。这符合 WCAG 2.2\
  \ 成功标准 2.3.1，有助于保护光敏性癫痫用户。\n\n###### 提供警告和选项\n\n视频或动画功能必须考虑在界面中直观放置警告的位置，如果存在光敏内容。放置位置会根据平台——网页、智能手机、平板电脑或电视——而自然变化，但应始终一致且易于找到。\n\
  \n此外，你还应：\n\n- 包含清晰、可读的标签，例如 **Warning: Flashing content may affect photosensitive\
  \ users.**\n- 提供切换选项以选择是否使用高动效效果。例如，允许用户禁用视差滚动、背景视频或动态渐变。\n\n###### 测试安全性\n\n设计系统应记录如何使用自动化工具进行内容测试，例如马里兰大学\
  \ Trace Center 的 **Photosensitive Epilepsy Analysis Tool (PEAT)** 软件（https://trace.umd.edu/peat/）。此外，考虑与可访问性专家或具有光敏性的用户研究参与者合作，以确保真实的、\
  \ lived experience 视角。与光敏性用户合作，了解他们的体验和需求，并验证解决方案。\n\n###### 其他提示\n\n除了上述信息外，请考虑以下提示：\n\
  \n- 避免明暗颜色之间的高对比度闪烁\n- 不仅测试孤立功能，还要测试复杂的交互，例如结合多种视觉效果的过渡\n\n\n\n\n\n- 在所有设计模式中保持一致的方法，包括营销、入职引导和交互功能\n\
  \n通过将这些实践融入设计系统，团队可以确保对光敏感的人能够安全、 confidently 地浏览数字体验——不会触发风险。\n\n##### 语言障碍\n\n\
  当我们以包容的方式思考时，我们可以理解到，许多没有残疾的人也不喜欢语音通话。它需要时间，可能变得繁琐的社交互动，如果对话困难或不愉快，例如取消服务或涉及敏感个人问题，电话通话可能是一种令人不舒服且焦虑的想要避免的经历。\n\
  \n语音对话和使用语音识别的系统通常会为有语言障碍的人制造障碍。如果下订单或获得客户支持的唯一方式是通过语音渠道，这就构成了障碍。在设计过程早期就与有语言障碍的人互动，有助于识别这些障碍并共同创建替代解决方案。\n\
  \n虽然 WCAG 规则并未明确指出涵盖语言或语音障碍的具体成功标准，但我们可以推导出提供一致替代方案的方法：\n\n- 如果团队正在使用设计系统添加产品功能，例如语音助手和支持语音的应用程序，或将依赖交互式语音应答（IVR）电话系统（例如，“说出您要联系的部门名称”），设计系统必须指导团队在每一步都提供非语音替代方案。\n\
  \n- 添加清晰的视觉和基于文本的替代方案——例如聊天界面、短信选项或电子邮件支持——以便用户可以选择自己偏好的沟通方式。\n\n- 优先考虑异步选项，以免用户被迫进行可能导致压力或焦虑的实时互动。提供可访问的替代方案也有利于在嘈杂环境中、信号不佳或只是更喜欢打字的人。\n\
  \n- 提供一致、易于找到的选项以在语音和非语音渠道之间切换。例如，在 IVR 电话通话期间，允许用户按号码连接到基于文本的支持渠道或请求文字记录。\n\n-\
  \ 在语音启用产品中包含字幕或文字记录角色的明确指导。例如，语音助手应能够显示基于文本的确认和结果。这使有语言障碍的人能够理解和导航系统，而无需仅依赖语音。\n\
  \n至此，我们已为低视力、认知、运动和光敏感等不同残疾人士移除了障碍，我们的设计系统现在已准备好为使用辅助技术（如键盘、开关设备和屏幕阅读器）的人提供可用性支持。\n\
  \n##### 运动障碍：为辅助设备和软件设计\n\n患有严重运动障碍的人使用从键盘到更复杂且通常定制的开关设备等辅助技术。设计系统必须鼓励使用团队考虑这些类型的辅助技术至关重要，因为这是屏幕阅读器可访问性的前提。\n\
  \n了解使用鼠标与使用键盘等辅助技术导航 UI 的根本区别很重要。使用鼠标的人处于控制之中，就像在城市中开车：可以自由地以任何顺序在屏幕上移动。使用键盘更像是坐火车，以线性引导的方式体验内容和控件。路线上的每个站点都是强制性的。\n\
  \n###### 单点激活\n\n我们都会遇到因环境（如在繁忙街道上行走）或因干扰（如抱着爱闹的动物）而无法在触摸设备上执行复杂操作的情况。但使用键盘或开关设备的人也无法精确执行滑动或拖动等复杂手势。\n\
  \n在这些情况下，使用单次点击执行操作的能力会提高每个人完成任务的能力。为复合功能提供单点操作方法，例如导航可拖动控件或（如果无法从系统中省略）轮播。\n\n\
  ###### 适应横向、纵向和倒置方向\n\n每个人在手持设备上以多种方向消费内容时都会遇到需求。例如，您可能在飞机上使用座椅靠背弹出托盘浏览内容。然而，有运动障碍的人可能使用永久安装且无法旋转的手持设备。如果\
  \ UI 在所有方向上都不可用，这就成了障碍。\n\n定义焦点样式包括放置焦点轮廓的位置。例如，遵循默认 HTML 焦点模式，此组复选框将焦点放在样式化的复选框本身上：\n\
  \n![](img/3bdc9e2d41de898f8a3bcc9634b0000e_258_0.png)\n\n*Figure 10.16: These WCAG-compliant\
  \ checkboxes add a focus outline around the styled checkbox*\n\n此复选框组将焦点放在整个标签周围：\n\
  \n![](img/3bdc9e2d41de898f8a3bcc9634b0000e_258_1.png)\n\n*Figure 10.17: These WCAG-compliant\
  \ checkboxes add a focus outline around the checkbox label*\n\n但不要过度。记住，焦点指示的目的是让用户知道哪个控件已准备好进行交互。例如，不要将文本输入、标签和帮助文本用焦点轮廓包裹。周围的文本不是控件，因此不得显示为可聚焦。\n\
  \n![](img/3bdc9e2d41de898f8a3bcc9634b0000e_258_2.png)\n\n*Figure 10.18: Labels and\
  \ descriptive text must not be outlined on focus*\n\n简而言之，就让浏览器做它本就该做的事：对可交互的可聚焦元素指示焦点，而不是周围的文本、卡片或区块。\n\
  \n##### 适应替代导航\n\n有些人依赖完全不同的方式来导航数字界面，例如语音控制、眼动追踪或开关扫描系统。这些替代方法被行动能力非常有限、语言障碍或只是更喜欢免提互动的人使用。\n\
  \n使用语音控制（如 *Dragon NaturallySpeaking* 或内置移动操作系统命令）的人需要能够以可预测、口头的方式引用他们在屏幕上看到的内容。\n\
  \n因此，UI 控件和文本必须清晰且唯一地标记。你可以把词语想象成由字母组成的、有意义的图片。例如，不要使用垃圾桶图标按钮来取消订单，可以使用单词 **Cancel**。不要使用纸飞机图标按钮发送消息，可以使用单词\
  \ **Send**。这两个示例都允许使用语音控制的人通过单一命令执行此操作。\n\n因此，网站和应用程序的设计系统不能跳过键盘可访问性的支持，不仅仅是因为它显然是屏幕阅读器用户的先决条件，而且因为键盘用户可能存在屏幕阅读器用户不存在的障碍。接下来，让我们看看设计系统必须如何为盲人或视力极差的人消除障碍。\n\
  \n##### 视力极差或盲视\n\n前面的章节已移除了为使用屏幕阅读器的人设计时遇到的许多挑战，他们将从已讨论的所有可用性支持中受益：\n\n- 适应所有设备、方向和视口大小的灵活布局对使用屏幕阅读器的人很有用，因为他们可能使用手持设备或不知道其桌面屏幕的分辨率或浏览器窗口大小。事实上，他们可能根本没有桌面显示器——如果看不见，又何必费事？\n\
  - 有意义的标题结构允许屏幕阅读器浏览内容，呈现有用信息。\n- 文字记录使消费音频内容变得更容易，音频描述使包含重要视觉信息的视频能够被消费。\n- 不仅依赖颜色来传达意义的内容将使用文字来传达意义。\n\
  - 不依赖细微营销术语或行话的语言可以被屏幕阅读器正确发音。\n\n\n\n\n\n- 自动完成功能有助于减少每个人的错误，同时加快表单填写速度。\n- 具有有意义顺序的可聚焦控件，能引导使用屏幕阅读器的人沿着\
  \ UI 进行线性旅程。\n\n这些考虑为创建设计系统奠定了基础，这些系统不仅符合无障碍要求，而且真正赋能盲人或视力极低的人群。接下来我们将探讨设计系统如何通过解决标题、焦点管理、替代文本和辅助技术考虑等方面，进一步支持这些用户。\n\
  \n###### 选择非语义的排版命名约定\n\n设计系统必须采用一种命名约定，该约定不依赖于数字标识符来表示大小和粗细，而是专注于文本的预期用途和样式。这些简单示例允许任何样式应用于任何标题级别。以这种方式，h1\
  \ 在视觉上可以是最小的字体，但仍保持其对使用屏幕阅读器的人的含义。\n\n以下样式可以应用于任何标题，而不管其标题级别如何：\n\n| CSS | HTML\
  \ |\n|---|---|\n| `.text-normal { font-size: 1rem; }` | `<h1 class=text-normal>My\
  \ coffee dashboard</h1>` |\n| `.text-medium { font-size: 1.5rem; }` | `<h2 class=text-medium>My\
  \ favorites</h2>` |\n| `.text-large { font-size: 2rem; }` | `<h2 class=text-large>Featured\
  \ roasts</h2>` |\n| `.text-huge { font-size: 4rem; }` | `<p class=text-huge animate>Coffee\
  \ jitters!</p>` |\n\nFigure 10.19: Semantically agnostic styles\n\n认识到注释在何处必要以及何处不必要。如果\
  \ UI 设计师直接嵌入跨职能工程团队，并每天直接与 Android、iOS 和网页开发人员沟通，则注释需求可能很小。另一方面，如果 UI 设计团队被孤立，仅仅将工件抛入瀑布式生产环境，则需要更详细的注释。\n\
  \n一个最小的注释库应包括以下选项：\n\n- 地标（header/banner、navigation、main、footer/content info）\n\
  - 标题级别（h1、h2、h3 等）\n- 图像的替代文本名称\n- 控件角色（checkbox、radio button、switch 等）\n- 自动完成属性（name、address-line1、address-level1\
  \ 等）\n- ARIA 标签（用于命名部分、表单或导航）\n\n虽然注释很有用，但它们不应多余。例如，在设计工件中，小屏幕移动布局和大屏幕桌面布局并排放置时，可能只需对移动布局进行注释，仅在桌面布局中注明差异或额外功能。\n\
  \n###### 信息性与装饰性图像的替代文本\n\n为了为使用屏幕阅读器的人提供良好的体验，设计系统必须鼓励使用团队为信息性图像添加替代文本描述，并阻止为装饰性图像添加替代文本描述。\n\
  \n使用团队需要明确的指导，了解什么构成装饰性或信息性图像以及如何描述它们。如果设计系统不为替代文本使用设定模式，使用团队要么会忽略替代文本，遗漏照片和图形中包含的关键视觉内容，要么会过度使用装饰性图标的替代文本，导致重复或无意义的体验。\n\
  \n默认情况下，设计系统提供的 UI 图标必须是名称无关的，并被视为装饰性，无需替代文本。设计系统通常提供几乎永远不需要描述的图标式 UI 图像。即使使用典型的\
  \ UI 图标集，也不可能为图像编写单一的替代文本描述以在所有情况下实现良好的用户体验。\n\n##### 残疾的交叉性\n\n出于实用性考虑，无障碍设计是在单一残疾或辅助技术的背景下讨论的，但当考虑有多重残疾的人时，残疾要复杂得多。\n\
  \n一个能够适应动态文本大小和一致焦点样式的设计系统，可以满足视力低下且有严重运动障碍的人的需求。发现动画或运动令人分心的人可能会使用放大工具来聚焦，框出令人分心的功能。有认知障碍的人可能会使用屏幕阅读器或字幕来帮助阅读理解或理解音频内容。现实世界的场景很少如此整齐地分离。让具有交叉需求的用户参与——例如同时使用屏幕阅读器并有运动敏感性的人——有助于团队理解并设计应对复杂、重叠挑战的方案。\n\
  \n当设计系统以灵活性、清晰度和替代交互方式构建时，它们可以在无需例外或额外定制的情况下更好地适应这种复杂性。重要的是要记住，许多人同时经历多种残疾，例如视力低下和运动损伤，或听力损失伴随认知挑战。设计系统如果能预见到这些重叠需求——例如确保高对比度排版、一致的焦点样式、清晰的标签和单点激活——就能为每个人创造更公平、更一致的体验。\n\
  \n##### 对所有残疾人应省略的功能\n\n设计系统的无障碍不仅仅意味着让一切都可访问；它意味着决定省略哪些组件和模式。一些常见的 UI 组件可以从设计系统中排除，以鼓励使用团队寻求更好的解决方案。与用户合作以了解某些组件为何造成障碍至关重要——这有助于设计系统发展以支持包容性体验，而不仅仅是删除功能。\n\
  \n原生 HTML `select` 元素可以在其折叠状态下完全设置样式，而选项表面的样式由操作系统提供，无需重新设计，尽管未来的 CSS 提案可能会允许更多样式选项。\n\
  \n![](img/3bdc9e2d41de898f8a3bcc9634b0000e_266_0.png)\n\n*Figure 10.23: The native\
  \ HTML select surface in macOS*\n\n##### 轮播\n\n轮播幻灯片通常是利益相关者无法决定应突出什么内容的妥协，因此他们选择全部内容。这导致用户体验不友好，很少有人会参与到第一张幻灯片之外。\n\
  \n未来的浏览器功能可能包括对可访问轮播模式的原生支持，但这并不意味着这是传达内容的最佳方式。即使是可访问的轮播也会为所有必须学习如何导航其特殊复合 UI 并消费其独特内容的人增加额外的认知负担。它可以滑动吗？箭头键可以操作它吗？有多少张幻灯片？这些信息以及更多信息必须被用户传达和理解，并且人们必须有足够的动机去参与超出初始视图的内容。\n\
  \n如果轮播是设计系统不可避免的组件，请帮助团队明智地使用可访问轮播，以消除障碍、减少认知负担并为体验增添价值：\n\n- 避免使用自动播放。这会为有认知障碍和前庭障碍的人造成障碍。如果突出显示，自动播放必须默认关闭且用户可控制。\n\
  - 指导团队偏好可预测的信息。轮播在人们可以猜到接下来内容时效果更好（例如，鞋子的颜色和产品变体）。避免在幻灯片之间出现惊喜或不连贯的内容。\n\n### 11\
  \ Tools and Techniques for Accessibility Evaluation and Prioritization\n\nBy Kai\
  \ Wong, CPACC, CHES®\n\n无障碍是关于创建适合每个人的数字体验。即使设计看起来是无障碍的，许多无障碍问题也隐藏在代码之下。\n\n无障碍测试弥合了设计意图与实际用户体验之间的差距。它是质量保证（QA）的重要组成部分。就像任何其他质量检查一样，评估产品无障碍涉及对其进行测试。\n\
  \n> Web 内容无障碍指南（WCAG）是一项被广泛接受的技术标准，可指导数字无障碍测试。您可以在万维网联盟（W3C）网站（www.w3.org）上找到指南的最新版本。\n\
  \n本章概述了数字无障碍测试工具和技术，重点关注网页和移动应用无障碍测试、其挑战以及常见问题。您将学习如何结合自动和手动测试方法、确定修复优先顺序，以及将无障碍纳入开发工作流程。目标是什么？帮助您和您的团队更智能地测试并构建更具包容性的产品。\n\
  \n\n\n\n\n在本章中，我们将涵盖以下主要主题：\n\n- 选择合适的自动化测试工具\n- 执行有效的手动无障碍审计\n- 解释和优先处理无障碍测试结果\n\
  - 将无障碍测试集成到开发工作流程中\n\n#### 选择合适的自动化测试工具\n\n谁不爱一个好捷径呢？我知道我喜欢，所以让我们谈谈自动化测试工具。使用自动化工具是一种简单、快速的无障碍检查方式，比烤面包还要快地弹出结果。几秒钟内，它们就能发现无障碍问题，例如缺少替代文本、颜色对比度差、表单元素缺少可访问名称以及缺少文档语言。\n\
  \n目前市场上有多款自动化工具可供选择。在为无障碍选择自动化测试工具时，请考虑以下关键因素：\n\n- **用户界面：** 工具是否直观且易于导航？它是否可访问？\n\
  - **可靠性：** 测试结果是否一致且可重复？\n- **易用性：** 它是否需要培训，还是初学者也很容易使用？\n- **浏览器和设备支持：** 它是否适用于你需要的浏览器和设备？\n\
  - **维护：** 工具是否定期更新？\n- **成本：** 工具是免费的还是需要付费？如果发现需要订阅或付费的工具，请先用免费试用测试。探索你的选项。找到适合你需求和预算的工具。在大多数情况下，免费版本就足够了。\n\
  - **标准：** 工具是否对照你期望的符合性级别的标准进行检查，例如 WCAG 2.2 Level AA？\n\n大多数自动化无障碍工具可直接在开发者工具中免费获得，作为移动应用程序或浏览器扩展。以下表格比较了免费、常用的自动化工具：\n\
  \n| 工具 | 平台 | 功能 | 缺点 |\n|---|---|---|---|\n| WAVE by WebAim (www.wave.webaim.org)\
  \ | Web | - 一个浏览器扩展<br>- 在侧面板中打开。<br>- 在加载状态下扫描整个页面<br>- 显示页面结构，例如标题，并使用页面上的图标突出显示结果\
  \ | - 页面可能会因页面上的图标而变得杂乱<br>- 不指示发现问题的严重程度 |\n| axe DevTools by Deque (www.deque.com/axe/devtools)\
  \ | Web | - 一个浏览器扩展<br>- 在浏览器的开发者工具中打开<br>- 在加载状态下扫描整个页面<br>- 可以一次突出显示一个问题<br>-\
  \ 为每个标记的问题列出相关要求和影响级别<br>- 高级升级选项包括部分页面扫描、用户流程扫描、报告导出和指导式手动测试功能 | - 初次使用该工具时学习曲线较小<br>-\
  \ 许多功能需要升级到付费版本 |\n| Lighthouse by Google Chrome | Web | - 无需下载，因为它内置于 Chrome 的开发者工具中<br>-\
  \ 易于使用的用户界面<br>- 使用与 axe DevTools 相同的库，这是一个值得信赖的框架，也是无障碍测试的广受尊敬的资源<br>- 提供 100 分制的分数，快速、高层次地评估页面的整体无障碍状态<br>-\
  \ 还可以检查性能、SEO 和最佳实践 | - 高分可能会误导人们认为网页完全可访问<br>- 有时它落后于 axe DevTools 最新版本一个版本。 |\n\
  | Accessibility Inspector by Apple | iOS and macOS mobile apps | - Xcode 中可用的开发者工具<br>-\
  \ 提供有关移动应用中特定元素的原始无障碍信息<br>- 提供元素检查功能、VoiceOver 模拟和屏幕级审计 | - 由于它是 Xcode 的一部分，该工具主要由开发人员在开发阶段使用。对于不在\
  \ Xcode 中工作的非开发人员或测试人员来说不太方便。<br>- 涵盖的测试数量有限。 |\n| Accessibility Scanner by Google\
  \ | Android mobile apps | - 可从 Google Play Store 下载的应用<br>- 可以扫描单个屏幕或一系列屏幕 | - 涵盖的测试数量有限。\
  \ |\n\n图 11.1：免费自动化测试工具选项\n\n图 11.1 中的工具是根据估计的用户数量和个人经验选择的。还有许多其他选项（尤其是网页工具）。\n\n\
  W3C's Web Accessibility Evaluation Tools List (www.w3.org/WAI/test-evaluate/tools/list)\
  \ 提供了超过 65 款自动化测试工具的信息。你可以根据用途、成本、操作系统、语言和标准筛选工具。\n\n由于许多工具都是免费的，同时使用多个工具也无妨。像在冰淇淋店一样双重享受吧！想用多少就用多少。比较结果并交叉核对准确性。\n\
  \n它们是不是太好了而不真实？有点是的。自动化工具只能覆盖约 30–50% 的标准无障碍测试需求。以下是一些溜过了自动化工具但后来被手动测试人员或终端用户发现的例子：\n\
  \n- 表单元素，例如单选按钮，其可访问名称为 null 或 object，但可见按钮标签中没有\n- 一个链接，除非运行屏幕阅读器，否则无法仅使用键盘激活\n\
  - 在将网站主页放大到 400% 时，几行重要的重叠文本\n\n这意味着即使屏幕通过了所有自动化工具检查，无障碍问题仍可能存在。这就是手动测试和用户反馈发挥作用的地方。\n\
  \n许多数字无障碍问题取决于上下文，需要人工审查。自动化工具是一个坚实起点，但只是开始。务必用手动检查和真实用户（尤其是残障人士）的见解来补充。彻底的手动测试和多样化的用户反馈是创建可访问、用户友好体验的关键。让我们接下来看看有效的手动测试。\n\
  \n> 如需对自动化工具和手动测试进行更深入分析，请查看 Adrian Roselli 的博客文章，*Comparing Manual and Free Automated\
  \ WCAG Reviews* (https://adrianroselli.com/2023/01/comparing-manual-and-free-automated-wcag-reviews.html)。\n\
  \n#### 执行有效的手动无障碍审计\n\n当然，自动化测试工具可以帮助你快速发现无障碍错误，但如果你就此停止，你就跳过了最好的一部分：手动测试。对，就是时候卷起袖子进行手动测试了。\n\
  \n手动测试方法会发现自动化工具无法发现的问题。这有点像清理宠物毛发。一轮吸尘并不能清理一切；你可能需要用粘毛滚筒确保完全无毛。这就是为什么使用多种工具和多种测试方法对于确保无障碍至关重要。\n\
  \n在本章中，我们将“问题”和“错误”互换使用。此外，以下信息适用于网页和移动设备，除非另有具体说明。\n\n虽然本章不会深入 WCAG 以保持易于理解，但所讨论的大多数测试策略都与\
  \ WCAG 标准相关。如需具体标准或深入了解每个测试领域，请参阅官方 WCAG 文档。\n\n##### 键盘导航是关键\n\n一些视力或行动障碍人士可能会使用键盘等替代输入方法来导航数字内容。网站和移动应用应无需触摸屏幕或点击鼠标即可完全使用。因此，焦点顺序——使用替代输入方法导航时接收焦点的元素的顺序——和键盘导航是必不可少的测试项目。\n\
  \n如果你有鼠标，就让你的猫在你完成手动测试时玩弄它。同时，你可以测试焦点顺序并确保所有元素都可以使用键盘单独到达。\n\n你可以使用无线键盘，例如蓝牙键盘，在移动设备上测试键盘导航。\n\
  \n从网页顶部开始，使用 Tab 键在交互元素之间移动。交互元素的示例包括按钮、链接、下拉菜单、滑块、切换开关、复选框和文本字段。按 Tab 应该在页面上移动并在聚焦元素上显示可见的焦点指示器（即轮廓）。\n\
  \n确保焦点顺序是合乎逻辑的（通常意味着使用键盘向前移动与页面顺序和含义相匹配），并且相当可预测。它不应该像在热炉上烧焦的大蒜一样在页面上乱跳。在大多数情况下，焦点应从上到下、从左到右移动。如果你按\
  \ Tab，突然你的焦点消失了……恭喜，你发现了一个错误！\n\n\n\n\n\n在你浏览的过程中，注意屏幕阅读器如何描述每个获得焦点的元素。屏幕阅读器的播报应该是有帮助的，而不是混乱或缺失；它们不应重复或指出任何不必要的垃圾。\n\
  \n> 如果这是你第一次来到屏幕阅读器之城，你可能会注意到它说话很快。别担心，你可以在屏幕阅读器的设置中调整速度。起初放慢速度并无不妥。大多数日常用户以全速使用屏幕阅读器，但如果你不常使用，放慢到更舒适的速度。\n\
  \n对于交互元素，例如按钮或链接，屏幕阅读器应先播报标签，然后播报元素的类型（称为其“角色”）。例如，文本标签为“添加到购物车”的按钮应被播报为“添加到购物车，按钮”。一个大忌是视觉标签写着“添加到购物车”，但屏幕阅读器却播报为“立即购买，复选框”，这会让用户感到困惑或被误导。\n\
  \n此外，如果可访问性名称与元素的文本标签不匹配，可能会给通过语音导航的用户带来问题。在通过语音导航时，人员通过说出可见标签来选择元素。如果可见标签与可访问性名称不同，辅助技术可能无法识别该元素或响应语音命令。技术进步可能会很快改善这一点，因此请遵循最新的操作系统和软件更新。\n\
  \n另外，注意其他常见的屏幕阅读器播报问题，例如以下内容：\n\n- 缺少角色或元素类型（即没有说明按钮是按钮）。\n- 装饰性图片未被忽略。\n- 标题使用不当（即顺序不合逻辑或不具描述性）。\n\
  - 内联错误消息未被播报。\n- 表单字段缺少必填或可选指示。\n- 状态消息未被播报。例如，如果表单已提交，应有成功消息表明其已提交或已保存。\n- 影响用户体验的焦点管理问题。\n\
  \n#### 移动设备专用屏幕阅读器提示\n\n在设备的辅助功能设置中打开屏幕阅读器（或询问默认语音助手），然后使用手势测试移动应用程序。手势是使用屏幕阅读器导航移动设备的常见方式。\n\
  \n大多数设备在你首次打开屏幕阅读器时会提供常见手势的快速教程。一旦屏幕阅读器运行，你就可以使用这些手势。\n\n常见手势包括以下内容：\n\n- **向右滑动：**\
  \ 将焦点向前移动\n- **向左滑动：** 将焦点向后移动\n- **单击：** 选择一个项目\n- **双击：** 激活获得焦点的交互元素\n- **三指滑动：**\
  \ 按滑动方向滚动页面（仅限 iOS）\n- **两指滑动：** 同上，但适用于 Android\n\n使用屏幕阅读器和手势，检查焦点顺序、屏幕阅读器播报和核心功能是否按预期运行。\n\
  \n#### 检查图片描述\n\n自动化工具在标记缺少图片描述方面很出色——通常称为**替代文本（alt 文本）**——但它们无法判断文本是否有帮助或准确。这就是手动测试发挥作用的地方。\n\
  \n辅助技术应以传达其目的的方式描述有意义的图片。测试 alt 文本的一种方法是导航到图片并观察屏幕阅读器或盲文输出。听听（或阅读）播报的内容并问自己：这有意义吗？它在不过于复杂的情况下增加了价值吗？\n\
  \n注意图片描述的长度——它应详细但简洁（没人需要一部小说）。如果图片包含重要文字，请确保该文字包含在 alt 描述中。如果图片只是装饰性的，屏幕阅读器甚至不应该提及它。\n\
  \n想 double-check 网站上的 alt 文本吗？打开浏览器的开发者工具，检查元素，并在 HTML 代码中查找 alt=\"\" 属性。alt 文本就是引号之间的内容。如果图片纯粹是装饰性的，代码中仍应有\
  \ alt=\"\" 但引号之间没有文字。这告诉辅助技术：“嘿朋友，你可以忽略我。我只是为了视觉氛围而存在——仅此而已！”\n\n#### 测试页面在各种状态下\n\
  \n不要就此止步。还有更多内容可探索！错误消息、加载指示器以及内容变化（例如展开手风琴以显示文本）是否被播报？如果没有，体验就大有不足，可能会让许多终端用户感到迷失或沮丧。\n\
  \n手动检查动态内容的行为很重要，因为大多数自动化工具只在页面加载时的状态下测试页面。因此，例如，它可能不会在菜单或手风琴展开时、在存在内联错误消息时、或在选择预约时间后出现日期选择器时进行测试。\n\
  \n在使用屏幕阅读器和键盘导航时，探索这些额外状态。当你遇到菜单时，确认你可以在不使用鼠标的情况下到达菜单中的所有选项，并且屏幕阅读器准确播报所有选项。\n\n\
  #### 放大关注点：你的产品\n\n视力低下或其他残疾的人可能会使用放大数字文本或内容的功能。因此，重要的是在各种缩放级别和文字大小下测试你的体验。在移动设备上捏合缩放或增加网页浏览器的缩放级别，以确保所有内容重新组织时不会重叠、被截断或功能下降。\n\
  \n然后，使用大文本进行测试。在设备或浏览器设置中调整文字大小，然后验证所有文字是否按比例调整大小，没有内容重叠，且没有功能丢失。\n\n#### 颜色很重要\n\
  \n色觉缺陷很常见。因此，请确保不要仅使用颜色来给出指示或传达含义。例如，字段中的错误不应仅以红色标记；它们还应有屏幕阅读器播报的内联错误消息。这并不意味着你不能使用颜色，你只是不应该仅用颜色来表示含义。\n\
  \n此外，请确保你的数字体验使用足够的颜色对比度。大多数时候，自动化工具可以捕捉颜色对比度问题；然而，有些问题可能会溜过去。如果你能快速视觉扫描页面，寻找任何低对比度的文字和非文字元素。如果页面上的任何内容看起来像是洗过太多次（即褪色），就该与你的设计师聊聊了。\n\
  \n#### 更多必备检查\n\n还有几件事需要手动检查：\n\n- 简单且正确的标题结构\n- 没有快速闪烁的内容\n- 一致的导航\n- 动画和视频有暂停和播放的方式\n\
  - 视频有字幕\n- 音频附带文字记录\n- 会话超时警告，让用户延长会话\n\n让我们最后看看一些移动设备特定的注意事项：\n\n- **方向支持：** 设备可以在纵向或横向模式下使用。这与可访问性相关，因为有些人可能将手机或平板电脑固定在某个位置，例如安装在轮椅上。测试你的数字产品在各种方向下的表现，以确保支持。当你将手机水平旋转时，你的应用程序或移动网站的视图应无缝切换到横向视图。同样，当你将移动设备改回垂直位置时，内容应切换回纵向视图。在两种位置下，内容不应重叠、被截断或丢失功能。\n\
  - **内置辅助功能：** 移动设备上有许多辅助功能，因此测试它们在你的应用程序或移动网站中的工作方式很重要。这些功能通常可在 **设备设置** 或 **辅助功能设置**\
  \ 下找到。\n\n某些功能在 iOS 和 Android 上的名称略有不同。请参考下表了解几个示例。\n\n| 功能 | Android 名称 | iOS 名称\
  \ |\n|---|---|---|\n| 语音导航 | Voice Access | Voice Control |\n| 文字转语音 | Select to\
  \ Speak | Spoken Content |\n| 屏幕阅读器 | TalkBack | VoiceOver |\n| 增加文字大小 | Font Size\
  \ | Larger Text |\n| 高对比度 | High Contrast Text | Increase Contrast |\n| 最小化动画 |\
  \ Remove Animations | Reduce Motion |\n| 替代输入 | Switch Access | Switch Control |\n\
  | 放大屏幕内容 | Magnification | Zoom |\n\n*Figure 11.3: Names of iOS and Android features*\n\
  \n\n\n\n\n#### 中等问题\n\n在解决阻断问题和严重问题之后，你可以继续处理中等问题。中等问题可能对终端用户造成不便或引起注意，但不会显著影响用户体验。\n\
  \n中等问题的示例包括以下内容：\n\n- 一个或两个装饰性图片被屏幕阅读器播报\n- 少数文本实例的颜色对比度中等偏低\n- 一个简单、简短的页面缺少标题\n\
  - 在必填表单字段上，屏幕阅读器会两次播报“必填”\n\n#### 其他需要考虑的因素\n\n其他因素会影响问题需要解决的紧迫性。请考虑问题存在的更广泛的上下文：\n\
  \n- **频率：** 这个问题影响了多少页面？在同一页面上发生了多少次？例如，如果一个页面上播报了1个装饰性图片，影响就小于一个页面上播报了10个装饰性图片的情况。\n\
  - **用户反馈：** 客户是否因可访问性问题报告了糟糕的体验？问题的严重程度如何？低还是高？\n- **位置：** 问题是否出现在访问量最大的页面之一？它是否影响了业务关键的用户流程？还是发生在过时的活动页面上，流量极少？\n\
  - **范围：** 问题是否出现在可复用的组件中，还是局限于某处？全局问题——即影响多个页面上相同组件的问题——应在修复工作中尽早优先处理。一个常见的例子是共享导航菜单中的可访问性问题。如果主页上的导航菜单没有焦点指示器，那么在所有使用该菜单的其他页面上很可能也会出现相同问题。解决全局问题有助于在数字产品中创造更一致、更可访问的体验。\n\
  \n![](img/3bdc9e2d41de898f8a3bcc9634b0000e_281_0.png)\n\n没有可访问性经验的团队通常会选择先修复容易的、低垂的果实。这可能是由于以下几个因素：对处理更复杂问题缺乏信心、没有完全理解某些错误对用户的影响，或由于优先级设定不足而缺乏方向。\n\
  \n虽然这种方法可能有助于快速减少错误数量，但对终端用户的影响通常很小。然而，低成本的修复有时也能带来有意义的改变。虽然小幅度的修复有时能带来有意义的改变，但在权衡时应同时考虑潜在影响和工作量。你的优先级设定工作将有助于此。\n\
  \n通过优先解决更严重的问题，你可以通过消除障碍和改善用户体验，为终端用户带来实质性差异。它还可以帮助你避免因主要的可访问性缺陷而无法使用产品的沮丧客户，甚至更糟的情况，例如处理律师函和法律麻烦。\n\
  \n#### 仪表板\n\n还记得那个庞大的可访问性错误集合吗？考虑创建一个仪表板来帮助理清一切。仪表板可以帮助你解读测试结果、跟踪修复进度并指导你的策略。仪表板中常见的跟踪变量可能包括以下内容：\n\
  \n- 问题类型/类别（即屏幕阅读器问题、颜色对比度或键盘导航）\n- 优先级级别（通常是影响严重程度的函数）\n- 受影响的用户群体\n- 修复状态（即未开始、进行中或已解决）\n\
  - 用户流程\n- WCAG 成功标准\n- 辅助技术\n\n规划修复工作需要时间和精力，但它能为你的公司、团队或业务提供巨大的指导。优先排序的待办清单和组织良好的仪表板可以帮助团队从“我们从哪里开始？”转变为“嘿，我们搞定了。”这也有助于你设定项目里程碑并首先交付最具影响力的变更。\n\
  \n深思熟虑地优先排序和战略性地修复问题不仅对业务有益；对残障人士来说也是一大胜利。\n\n有了这些见解指导你的测试和修复工作，你正走在正确的道路上。现在，让我们从被动转向主动。是时候抢占先机，将可访问性测试融入你的开发工作流程中了。\n\
  \n#### 将可访问性测试集成到开发工作流程中\n\n你知道什么比发现和修复可访问性错误更好吗？从一开始就防止它们出现！为此，你必须将可访问性融入你的 **软件开发生命周期\
  \ (SDLC)** 流程中，并使其成为文化的一部分。可持续地将可访问性集成到开发工作流程中需要深思熟虑的策略、工具，以及一些试错来找到适合团队的方法。\n\n\
  首先定义每个人都将努力达到的标准，例如 WCAG 2.2 AA。获得领导层的认可并记录你的决定。考虑制定一份政策，执行以下操作：\n\n- 明确可访问性要求\n\
  - 分配责任\n- 概述监控和执行的方法\n- 识别相关工具和技术\n\n政策和标准是坚实的基础，但它们本身不会改变行为。这就像有一本组装家具的说明书。说明很有帮助，但如果没有合适的工具、承诺和努力，最终结果可能不理想。你需要将可访问性集成到开发工作流程和团队文化的每个部分：\n\
  \n- **培训**：频繁、有针对性的培训可以提高意识，并为人们执行可访问性任务提供必要的技能。高度吸引人的有效培训计划也能推动文化变革。\n\n> 你可以与学习和发展团队合作，将可访问性要点融入现有培训计划中。\n\
  \n- **工具和测试：** 如本章前面所述，开发人员和 QA 团队应在其他代码功能检查之外，同时使用自动化和手动测试方法。开发人员还可以使用可访问性 linter\
  \ 在 QA 阶段之前捕获问题。\n\n![](img/3bdc9e2d41de898f8a3bcc9634b0000e_283_0.png)\n\n为了使其可操作，请具体说明。不要简单地说“需要\
  \ WCAG 2.2 AA”，而应说明使用哪些工具、测试什么内容以及常见的需要注意的问题。QA 工程师说他们“做了可访问性”但只运行了自动化工具的情况并不少见。他们通常没有意识到期望是什么。清晰的说明有助于弥合这一差距并确保彻底测试。\n\
  \n- **需求：** 将可访问性作为需求，例如将其添加到全局 **完成定义 (DoD)** 和/或作为 **验收标准 (AC)** 的一部分。DoD 是敏捷团队内部的共同协议，定义了产品增量必须满足的标准才能被视为完成。AC\
  \ 概述了用户故事必须满足的标准，才能被视为完成并从终端用户角度按预期运行。与你的发布列车工程师、产品和工程领导以及 Scrum Master 合作来实现这一点。\n\
  \n- **文档：** 在测试计划和错误报告模板中记录可访问性工具选择、具体测试期望以及你的公司或团队的技术标准（即 WCAG 2.2 AA）。创建易于遵循的清单，帮助开发人员和\
  \ QA 工程师测试可访问性。指定工具名称、设计考虑或关键测试步骤的基于角色的可访问性清单很有帮助。将指南和清单存储在开发人员和 QA 经常访问的地方，例如内部错误跟踪系统、内联网或知识库。\n\
  \n一份设计良好的清单可以帮助人们独立学习并从一开始就构建更具包容性的产品。但在开始构建之前，请花点时间思考其目的和受众。\n\n创建清单时请注意以下事项：\n\
  \n- 1. **定义受众和目的：** 这个清单是为谁准备的，他们需要完成什么？\n- 2. **使其可操作：** 每个项目都应是一个具体任务（即 *确保所有表单字段都有关联的标签*\
  \ 而不是 *检查表单可访问性*）。\n\n\n\n\n\n3. **结构化呈现：** 将相关任务分组，使清单易于使用。\n4. **包含有用的资源：** 链接到相关的工具、浏览器扩展或测试说明，帮助人们完成每个要求。\n\
  5. **迭代并更新：** 根据反馈随着时间的推移改进清单。随着最佳实践的演进做出更改，并使用版本控制来标明更新时间。\n\n> 大多数人不是无障碍专家。用通俗的语言编写清单和资源，并在多种格式中演示测试方法（例如，截图、视频、书面说明）。帮助人们感到自信，而不是困惑。\n\
  \n然而，请记住，清单只是一个有用的起点。正如 *第 2 章* 中提到的，无障碍本身不仅仅是一份清单。它是对质量、可用性和人的承诺。毕竟，数字无障碍影响着构建技术的人和使用它的人。\n\
  \n如果你正在将无障碍整合到开发工作流程中，请记住改变并不容易。本章中的一切对组织和客户都有切实的影响。我们讨论了优先考虑客户反馈的重要性，但不要忽视你同事设计师、开发者和\
  \ QA 的声音。他们对工具、清单和流程的反馈可以带来量身定制的改进。此外，倾听他人可以建立关系、信任和更好的工作环境。\n\n努力使期望具有可操作性和可管理性。你可以通过为开发者和\
  \ QA 工程师提供合适的工具和信息来实现这一点，以便他们在日常工作中执行无障碍任务。\n\n将无障碍嵌入到现有的开发工作流程中，不仅能够促进更具包容性、更易于使用的产品的创建，而且有助于塑造无障碍优先的思维文化。最终的目标是防止新的无障碍障碍到达终端用户。找到适合你团队的方法，在过程中收集反馈，并进行迭代改进。\n\
  \n#### 总结\n\n本章阐述了确保你的网站或移动应用对残障人士可用的基础，重点关注测试工具和技术。我们探讨了自动化和手动测试方法的动态组合、优先排序的重要性，以及如何将无障碍纳入开发工作流程。\n\
  \n这里涵盖的主题是建立成功的数字无障碍计划的基础，特别是在质量保证领域。有效的测试和修复确保包容性设计转化为高质量的用户体验。无障碍是一段需要持续监控、努力以及跨团队协作的旅程。无论是一行代码、一个测试用例还是一个\
  \ bug——每一个小行动都会累积。\n\n在下一章也是最后一章中，你将了解如何将无障碍策略嵌入到组织中。\n\n### 12 构建包容性设计文化：组织的策略\n\
  \n作者 Denis Boudreau，CPWA\n\n我们到了最后一章。让我先重申一下贯穿本书的教训：当无障碍被嵌入组织的文化中，而不是被视为事后考虑或最后时刻的修复时，包容性设计才会蓬勃发展。将无障碍融入工作流程、跟踪有意义的进展并投资于持续学习的组织，更能满足所有用户的需求，包括生活在各种残障中的用户。将无障碍视为共同责任而非限制性义务的团队，最终会为每个人创造更强大、更具包容性的数字体验。句号。\n\
  \n作为对本书的收尾，本章将探讨使无障碍成为组织工作方式的持久组成部分的实用策略。这种转变始于通过沉浸式体验培养同理心，并帮助跨职能团队理解无障碍障碍对他们期望服务的受众产生的真实影响。\n\
  \n在本最后一章中，我们将重点关注构建包容性设计文化的四个主要策略：\n\n- 通过沉浸式体验培养同理心\n- 将无障碍整合到设计和开发工作流程中\n- 衡量和报告无障碍进展\n\
  - 将持续学习融入包容性设计\n\n无论你是领导一个组织、管理一个团队，还是直接参与数字产品或服务的设计和开发阶段，本章介绍的策略都将帮助你超越意识层面，直接进入行动。那些将无障碍嵌入日常决策的团队，才是成功创造适合所有人的体验的团队。\n\
  \n毕竟，正如已故的 John Slatin 常说的那样，“*好的设计就是无障碍设计。*”\n\n#### 通过沉浸式体验培养同理心\n\n我想先分享一些关于同理心的想法，因为同理心是包容性设计最强有力的驱动力之一。不是那种让人感觉良好的“让我们都互相友善”的版本，而是来自亲眼目睹真实的人挣扎的、原始的、平视的理解。\n\
  \n当设计团队目睹终端用户遇到无障碍障碍时，残障包容很快就会从一套限制性的理论要求转变为发人深省、有意义的共同责任。\n\n大多数专家都会同意，积极拥抱包容性设计的组织，也是最终触达更多客户、降低法律风险并领先于不断变化的用户需求和期望的组织。这确实是我多年来观察到的情况。\n\
  \n虽然无障碍培训课程、治理政策和基于角色的清单确实有潜力大有裨益，但真正的变革性改变并非通过无障碍审计发生。它是通过直接与拥有相关生活经验并以不同方式消费世界的人们互动而发生的。\n\
  \n#### 亲身体验无障碍障碍\n\n在设计、开发和领导岗位的大多数专业人士可能永远不会使用屏幕阅读器。很少有人甚至可能有一天会不用鼠标浏览网站或仅用声音填写表单。\n\
  \n如果没有这种对替代的、但同样有效的数字空间导航方式的亲身体验，就不足为奇了，对大多数人来说，无障碍感觉与设计脱节。\n\n与残障人士相同方式互动数字产品的创意团队，可以更清晰地看到因明显缺乏数字包容而引入的差距和挑战。这种认识会带来更深思熟虑、更具包容性的设计决策，进而带来更具包容性的在线体验。\n\
  \n几年前，我指导了一家大型软件公司的 UX 团队，他们需要改进平台的无障碍性，但不知道从哪里开始。作为我们合作的一部分，我指导他们进行了一次工作坊，让他们只使用键盘和屏幕阅读器花费数小时浏览他们的平台，并在过程中记录观察结果。\n\
  \n作为一次实验，我们还为他们提供了眼罩，以便他们发现迄今为止从未引起注意的重大可用性问题。令人困惑的按钮标签、缺失的替代文本、键盘导航陷阱以及数十个其他无障碍问题突然变得痛苦地明显。\n\
  \n这些问题不仅仅是轻微的不便，它们是真实的障碍，阻止了真实的人独立使用该平台。虽然 UX 团队直到那时才注意到这些问题，但这些问题却困扰着残障人士的用户体验数月甚至数年。\n\
  \n这无疑是对团队来说令人震惊的体验，但我知道得更好，所以我为他们准备了另一个惊喜。当他们完成用替代方式浏览网站的实验后，我向他们介绍了我的盲人同事 Tim。\n\
  \n使用完全相同的工具（减去眼罩，我知道那是一个误导性的想法），我的同事随后发现了团队未能识别的一系列额外问题，例如 ARIA 地标的错误使用、动态交互缺乏反馈、过度使用模糊的链接文本、不明确的行动号召状态，以及缺少对纯视觉提示的文本替代。\n\
  \n最让每个人印象深刻的是 Tim 发现的问题与他们发现的问题的性质不同。虽然戴眼罩的团队发现了许多表层障碍，但 Tim 的见解深入得多。他注意到了系统性的导航问题、反馈差距和缺失的结构元素，只有拥有生活经验的人才会知道去寻找。他的肌肉记忆、心理映射和直觉期望，都由多年使用辅助技术的经验塑造，使他能够发现模拟根本无法复制的问题。\n\
  \n我知道团队只有亲身经历才会理解这个教训。模拟练习有时会提高意识，是的，但它们不会带来可持续的现实世界解决方案。它们可能开启对话，但无法取代来自生活经验的见解，因为真正的无障碍来自于倾听（并直接向）残障人士学习，这毫无疑问地证明了“假装成残障”只能走多远。\n\
  \n\n\n\n\n##### 为什么残障模拟会失败\n\n出于推动残障包容的迫切愿望，怀着善意的品牌试图通过我们所说的“残障模拟”来建立意识和同理心，这并不罕见。正如我们刚才所观察到的，这很少是个好主意，因为虽然残障模拟练习在理论上听起来很棒，但在它们隐含地暗示了那些与这些残障共存的人的经历方面却有所欠缺。\n\
  \n一些团队会让员工戴上眼罩来体验盲视，就像我一样。其他团队会使用手套来模拟行动受限。我个人最反感的是当企业让人们坐轮椅到处移动，好像这能让某人理解行动受限的生活是什么样的。乍一看，这些善意的举措听起来像是绝妙的主意。但我早在多年以前就已经了解到它们并非如此，我知道这个团队要理解的唯一方法就是将他们戴眼罩的体验与\
  \ Tim 的体验进行比较。\n\n事实上，所有这些练习通常达成的只是强化了“残障一定是多么可怕”的误解，而不是建立对残障人士使用网络时经历的真正理解。并不怎么有帮助。甚至是有害的。\n\
  \n我也曾与一个营销团队合作，他们组织实验室让员工佩戴降噪耳机和模糊眼镜来模拟失聪或失明。当被问及他们学到了什么时，回答是可以预见的：“那太令人沮丧和沮丧了。我只能想象失聪或失明是多么困难！”\n\
  \n这正是残障模拟完全搞错的地方：因为这些练习通常关注人们不能做什么，而不是关注他们如何与周围世界互动，所以它们让参与者产生怜悯之情，而不是对真正解决方案的更深入理解。\n\
  \n所有模拟所能做的只是触及残障人士现实的表面，而大多数盲人或聋人都会告诉你，这并不是他们体验世界的方式，无论是数字的还是其他的。聋人不仅仅是难以听见；他们使用字幕、文字记录或手语来交流。盲人不仅仅是视力受损；他们使用屏幕阅读技术、触觉标记和空间意识来导航。他们拥有工具并发展出应对机制。他们拥有技巧，这些技巧往往经过多年生活经验的磨练。\n\
  \n与其进行残障模拟，组织应专注于直接与那些生活在这些残障中并拥有相关生活经验的人进行互动。通过使用辅助技术的用户测试其产品和服务，并在设计和开发的每个阶段整合可访问性，品牌可以真正理解障碍是什么以及如何修复它们。\n\
  \n但仍然，是的，这确实始于同理心。\n\n##### 通过真实互动建立同理心\n\n团队培养同理心的最佳方式是倾听并向拥有相关残障生活经验的人学习。我记得几年前与一家金融科技公司的一次辅导会议，当时\
  \ UX 团队在移动应用的可访问性方面遇到困难。\n\n尽管满足了大多数 W3C 网络内容可访问性指南（WCAG）要求，他们仍然收到可用性投诉。因此，他们的一些最关键的银行功能，例如转账和查看\
  \ PDF 账单，使用屏幕阅读技术时完全无法使用。他们的应用在技术上通过了大多数合规检查，但真实用户仍因 unforeseen 挑战在关键时刻卡住。\n\n承认他们缺乏第一手的视角，而不是猜测可能还有什么问题，他们选择与盲人和低视力客户进行可用性测试会议。这是一个明智的决定。\n\
  \n他们通过该过程学到的东西比任何清单都更有价值。遵循关于章节标题的可访问性指南是一回事，但观察盲人使用屏幕阅读器在不同章节标题之间导航的不同方式，或神经多样性个体与我们的用户界面交互时认知负荷可能实际感觉如何，则是完全不同的事情。\n\
  \n在纳入这些可用性会议收集的反馈后，团队不仅修复了这些问题，还承诺在所有未来的产品测试中都涉及残障用户。这种思维转变最终导致了残障客户的更好体验。\n\n这些变化也在过程中改善了每个人的体验，证明可访问性最佳实践不仅提高了残障用户的体验，也提高了受益于真正以终端用户为中心的包容性体验的人们的体验。\n\
  \n##### 植入同理心并推动全公司承诺\n\n同理心是包容性设计的强大驱动力，但它不应局限于一次性研讨会或仅限于设计和开发团队。同理心必须是人们工作、协作和应对挑战的方式的一部分，如果我们要真正改变组织的文化。\n\
  \n开始建立这种同理心的最有效方法之一是通过诸如“可访问性沉浸周”等活动，让员工和高管仅使用键盘或基本辅助技术来导航他们自己的数字工具。这些体验并非旨在复制残障；它们旨在以无法忽视的方式暴露障碍。当高级领导者亲身体验这些障碍时，可访问性就不再是合规问题，而成为领导层优先事项。\n\
  \n但团队不必等待正式活动或举措才开始！即使是小的日常时刻，例如尝试在没有鼠标的情况下完成任务或以可访问性为出发点审阅设计，也能激发洞察并转变思维。关键是通过定期接触和对话来建立动力，而不仅仅是一次性活动。\n\
  \n认识的时刻往往就是改变开始的地方。理解无障碍设计真实后果的领导者更有可能支持有意义的行动并授权他人做同样的事情。这就是可访问性倡导者开始涌现的时候，包容性成为团队日复一日开展工作的方式。\n\
  \n将可访问性保持在首要位置并将其纳入设计评审的组织也会鼓励残障用户的反馈。他们认识到包容性的成功为持续进步创造了空间，停止将可访问性视为额外工作，并开始将其视为质量和创新的标志。\n\
  \n包容性不再是他们仅仅为了避免诉讼而做的事情；它成为他们想要做的事情，因为他们理解它为每个人带来的价值。\n\n##### 将同理心转化为行动\n\n同理心可以走很远，但有人会争辩说，它只有在导致真正的改变而不是怜悯之情时才有价值。最成功地将可访问性和包容性融入其文化的组织不会止步于提高意识；他们会采取具体且可衡量的步骤，以确保对客户群生活产生长期影响的差异。\n\
  \n多年来，我领导了无数成功的可访问性培训项目，让员工感到受启发成为残障包容解决方案的一部分。我毫不怀疑我已经让数百名设计师和开发者成为可访问性的信徒。但对于大多数参与者来说，一旦他们的日常工作\
  \ routine 恢复正常，培训课程的魔力消退后，他们的动力也会随之消失。为什么？因为如果可访问性从未真正成为优先事项，并且实践没有融入工作流程，那么其他考虑就会优先。\n\
  \n\n\n\n\n更糟糕的情况是，当一个资源不足的小型无障碍团队被要求“修复”那些在流程更早阶段就已决定的问题时。这些团队常常发现自己被困在设计、开发、业务和\
  \ QA 之间，一方面要倡导无障碍，另一方面又承受着在产品尚未准备好时就签字放行的压力。他们花费时间救火并为障碍的存在辩解，而组织的其他部分则指责他们拖慢进度或没有提供快速修复。\n\
  \n这是一个不可能的处境，几乎总是会导致倦怠、挫败感和进展停滞。问问任何经历过的人就知道了。\n\n想象一家软件公司正 struggling 于这个 exact\
  \ 问题。他们的无障碍修复总是姗姗来迟，拖慢发布进度，让开发者沮丧，并导致拼凑式的解决方案而非持久的改进。通过重构设计和开发工作流程，使无障碍不再被视为事后考虑，他们可以停止依赖指定的无障碍倡导者，转而将无障碍任务嵌入到每个角色中以获得更好的成功。\n\
  \n设计师随后可以负责确保颜色对比度符合 WCAG 标准，明显的焦点指示器被设计为支持键盘导航，并且图像包含相关的文本替代。如我们在第 10 章讨论包容性设计模式和组件时所见，开发人员如果从一开始就利用语义化\
  \ HTML、构建无缝的键盘导航系统，并使用自动化测试工具和辅助技术测试页面，确实可以大力推动无障碍发展。QA 测试人员可以将自动和手动无障碍检查纳入其标准测试计划，并建立清晰的反馈循环，以便及时解决问题的。\n\
  \n通过使无障碍成为共同责任，公司消除了困扰并拖慢其项目的来回修复和重大成本超支。几个月内，无障碍变得成为其流程中更自然的一部分，而非最后需要跨过的障碍。\n\n\
  ##### Shifting left: building accessibility into the process from the start\n\n\
  左移的概念很简单：数字无障碍越早被视为流程的一部分，越容易整合到最终产品中。当团队从项目一开始就定义无障碍要求时，他们可以避免日后出现重大的无障碍障碍。\n\n\
  想象一家公司在产品中 struggling 于无障碍不一致的问题。一些团队优先考虑它，而另一些则将其视为事后考虑。为了解决这个问题，他们决定构建一个无障碍设计系统。不是要求每个团队重新发明轮子，他们创建了共享组件：无障碍小部件、可用的颜色调色板、可读的排版以及经过充分测试的交互元素。无障碍被融入系统后，团队不再需要猜测。对个人设计师和开发人员的负担降低了。无障碍成为默认。\n\
  \n另一个组织可能会选择不同路径。他们将无障碍评审纳入冲刺周期，每两周检查新功能，而不是等到最后。这样做有助于团队在问题仍易于修复时尽早发现问题。随着时间的推移，这减少了最后一刻的混乱，并带来更一致的无障碍产品。\n\
  \n采用任一方法的团队在成功时往往也会在每一步中加入测试。这意味着将自动化扫描分层到每个代码提交中，以便在出现时立即发现常见问题，例如缺少 alt 文本、未标记的表单字段或对比度问题。但他们并不止步于此。在主要发布之前，他们还会使用真实的辅助技术用户进行可用性测试，揭示自动化工具无法检测的更深层次问题，例如令人困惑的键盘焦点顺序或损坏的屏幕阅读器交互。\n\
  \n通过早期且频繁的测试，团队在上线前捕获更多障碍，并从长远来看节省时间和精力。这种测试方法有助于他们超越技术合规，从而成功为残疾人士创建包容性体验。\n\n\
  两种策略——无障碍设计系统和基于冲刺的无障碍评审——都是左移的有效方式。真正重要的是，无障碍实践是有意且持续地融入流程中。无论你是在基础阶段一次性构建，还是通过敏捷周期定期\
  \ revisiting，关键是将其作为工作方式的一部分，而不是事后手忙脚乱地修复。\n\n##### Reducing accessibility debt\n\
  \n忽视无障碍问题如何影响终端用户也会为组织创造包容性债务。它不断增加一个问题积压，随着时间的推移，这些问题变得越来越难以修复且成本更高。就像技术债务一样，这些问题拖延得越久，解决起来就越昂贵、耗时。\n\
  \n尽管他从未参与过该学科，但美国建筑师、设计师、作家和教育家弗兰克·劳埃德·赖特仍然最准确地捕捉到了数字无障碍的精髓，他曾在谈论设计建筑时提前规划的好处时名言：“*You\
  \ can use an eraser on the drafting table or a sledgehammer on the construction\
  \ site. Your choice.*”\n\n这让我想起一家我曾合作过的媒体公司，他们多年来一直在累积无障碍债务。每次新发布都会引入更多障碍，他们的无障碍修复积压不断增长。他们知道需要长期解决方案，但能想到的只有临时补丁。为了打破循环，他们组建了一个无障碍突击队：一个由设计师、开发人员和\
  \ QA 测试人员组成的专门团队，其职责是在功能发布前进行评审。一年内，他们将积压减少了近 60%，并最终从第一天起就发布了无障碍性更强的产品。\n\n组建无障碍突击队只是组织保持领先于其无障碍债务的众多方法之一。其他选项包括在积压梳理中优先考虑无障碍修复，将其视为任何其他关键问题，而不是推迟到以后。其他团队可能会选择在设计评审中添加无障碍检查点，以便在开发甚至开始之前就发现潜在障碍。\n\
  \n最具前瞻性的团队甚至可能会投资培训其设计师和开发人员掌握无障碍编码和设计模式，以便减少无障碍问题首先被引入的可能性。在所有这些场景中，主动性是关键。\n\n\
  无论策略如何，最大的不同在于将可见性和问责制融入流程，以防止这些问题再次出现。如果不跟踪已修复的内容和仍需关注的内容，无障碍债务很容易再次堆积。而减轻这种风险的最佳方式是将无障碍问题视为任何其他业务优先事项：通过跟踪和报告它们。\n\
  \n##### Measuring and reporting on accessibility progress\n\n现实是，如果你的组织无法跟踪其进展，你的无障碍工作就不会有意义。这是因为没有明确的基准和报告，无障碍往往仍然是一个抽象目标，而非可衡量的结果。取得真正进展的团队会将无障碍视为任何其他业务优先事项。他们设定目标，建立问责制，并定期审查结果。\n\
  \n尽管如此，到今天为止，大多数组织仍继续假设无障碍是“完成”或“未完成”。但正是这种心态阻碍了真正的进展……无障碍是一项持续的实践，涉及大量——我是指大量——的\
  \ moving parts。它可以在随着时间的推移得到改善，前提是团队拥有指导其决策的正确数据。有效衡量无障碍意味着理解 W3C 指南，是的。但更重要的是，意味着理解残疾用户的实际体验并跟踪贡献和反馈的长期影响。\n\
  \n##### Defining success beyond compliance\n\n许多组织开始通过合规标准衡量无障碍，例如 WCAG、美国残疾人法案\
  \ ADA、加拿大无障碍法 ACA、欧洲无障碍法 EAA，或其他当地法律要求。虽然合规很重要，但它不是终点线。事实上，合规只不过是一个良好的起点。产品或服务完全可以在纸面上满足技术标准，但对残疾人士来说仍然令人沮丧，甚至无法使用。\n\
  \n此时，公平的提问是：如果满足 WCAG 不能保证可用体验，那么制定这些标准有什么意义呢？\n\n现在，别误会。WCAG 仍然通过提供帮助团队协调工作并发现常见问题的技术基线发挥着关键作用，但它并不声称——也不曾设计为——捕捉用户体验或可用性的全部内容。WCAG\
  \ 定义的是地板，而不是天花板。这就是为什么停留在无障碍合规的团队往往会失败。真正的无障碍需要超越清单，并积极倾听人们在现实世界中如何与你的产品互动。\n\n\
  在过去 25 年里，我与客户经历过无数次这种情况。正如我写这篇文章时，我想起了一家大型电子商务公司，他们亲身学到了这一点。他们有一个内部无障碍审计流程，并确信自己符合\
  \ WCAG 标准。但当他们请盲人客户使用各种屏幕阅读器测试其网站时，他们惊讶地发现许多用户难以完成购买。\n\n他们的导航结构在技术上合规但在功能上不可用。虽然页面中使用的组件在孤立时符合无障碍指南，但整体界面在很大程度上依赖视觉线索将一切联系起来。由于许多这些线索没有正确传达给辅助技术，这造成了严重的理解差距。非视力用户无法跟上正在发生的事情，体验崩溃了。\n\
  \n\n\n\n\n有一点是肯定的：那些理解无障碍如何带来备受追捧的价值的组织，例如更好的客户体验、更广的覆盖范围和更强的品牌完整性，会非常自然地开始将无障碍视为一个人的问题多于法律问题。\n\
  \n你会听到许多专家说，无障碍与旅程一样重要，也与目的地一样重要。这意味着成功的组织不仅仅为自己设定一次性无障碍目标；他们将无障碍视为持续的承诺，并将其纳入持续的审查流程中，以便他们的团队能够年复一年地不断改进。\n\
  \n那些超越勾选式合规、追踪有意义的可用性指标，并将无障碍作为业务报告中可见的一部分的团队，才是真正实现文化转变的团队。他们优先考虑人，并因此提供更好的客户体验。而这，我的朋友们，对利润也是有利的。\n\
  \n因此，除了追踪进展或将其嵌入报告之外，持续无障碍的核心问题在于建立一种学习永不停止的文化。标准在演进。工具在变化。用户期望在增长。那些保持领先的组织是那些将无障碍视为一种需要发展的技能集、一种需要培养的心态，以及一种通过持续学习变得更强大的共同责任的组织。\n\
  \n##### 将持续学习融入包容性设计\n\n这真的不言而喻。无障碍不是一次性修复，也不是有明确开始和结束日期的项目；它是一种持续不断的实践，会随着技术、用户需求、业务目标和行业标准一起演进。\n\
  \n事实胜于雄辩：致力于持续无障碍学习的组织，也是那些建立更强团队并开发更具包容性的产品和服务的组织。但无障碍教育只有在实用、有吸引力并融入每个利益相关者日常工作时才有效。\n\
  \n太多团队将无障碍培训视为单一事件或一次性会议，内容充满指南和合规要求。作为在过去 15 多年职业生涯中担任企业无障碍培训师的人，我可以向你保证，我是基于经验在这里发言。可悲的是，仅靠信息无法改变根深蒂固的行为。\n\
  \n最成功的组织始终是那些将无障碍作为其文化的一部分并确保学习永不停止的组织！\n\n###### 让无障碍培训有意义\n\n在我看来，组织犯的最大错误之一就是以一种与真实、可触及的工作脱节的方式提供无障碍培训。充满关于法规、技术规则和最佳实践的讲座的冗长演示往往难以留下印象，在产生参与度和保留率方面也做得很少。当无障碍以参与者能够产生共鸣的具体概念为锚点，并根据生命周期中的特定角色进行定制时，它的影响最大，从而让团队有多次机会立即应用所学内容。\n\
  \n尽管举办年度培训会议，但仍在无障碍问题上挣扎的公司比比皆是。员工，尤其是那些在公司待了很久的人，会理解无障碍的重要性，但在截止日期紧张时，无障碍就会被忽视。\n\
  \n要解决这个问题，组织最好用每月无障碍挑战来取代强制性的年度培训。团队可以放弃枯燥的讲座式会议，转而在项目中处理真实的无障碍障碍或问题，例如审查糟糕的颜色对比度、改进键盘导航或修复屏幕阅读器问题。\n\
  \n采用这种实践方法会加速改进，并在很大程度上减少新版本中的无障碍错误。它还促使利益相关者主动思考无障碍，而不是等待审计时才标记问题。从被动培训转向实践学习，将使无障碍成为他们工作流程的自然组成部分，而非偶尔的合规任务。\n\
  \n###### 鼓励同伴学习和知识共享\n\n虽然正式培训非常有价值，但一些最好的学习机会是通过日常对话和共同经验发生的，而不是被动地在教室（虚拟或实体）中聆听理论讲座。当无障碍知识在团队成员之间平均分配，并且生命周期中的每个角色都有明确定义的职责时，每个人在提问、分享解决方案和应用所学方面都会更有信心。而所有这些都会带来成功。\n\
  \n一种策略的例子可以是启动内部无障碍导师计划。组织内部经验丰富的无障碍倡导者可以与希望在该领域提升技能的团队成员配对。导师的影响可以超越典型的设计和开发团队，扩大专业知识的覆盖范围。内部无障碍支持者可以自然地发展为品牌大使，促进无障碍最佳实践，并确保无障碍讨论在所有公司部门中成为常态。\n\
  \n其他团队可能会选择创建内部“安全空间”来进行无障碍对话，无论是通过专门的 Slack 频道、讨论组还是团队会议检查。 当所有参与者，从设计师、开发人员、测试人员到每个其他利益相关者，都有机会共同解决无障碍挑战时，他们建立的是对最佳实践的共同理解。他们可以从彼此的经验中学习，而所有这些，再次带来更多无障碍成功。\n\
  \n###### 跟上不断演进的标准和工具\n\n无障碍始终在变化。 新技术、指南和行业趋势不断涌现。 无法保持了解的团队有落后风险。 最有效的组织将持续无障碍教育作为优先事项，以确保其团队保持最新。\n\
  \n我最近合作的一家客户很早就认识到这一挑战。 为了保持公司内部无障碍知识的时效性，我们启动了一份季度无障碍通讯，用以澄清晦涩的指南、突出行业更新、展示内部成功案例并介绍新工具。\
  \ 通过以一致的方式分享无障碍见解，他们确保团队不会失去动力，不会回到过时的实践中，并使无障碍始终保持在首要位置。\n\n其他组织可能会采取更结构化的方法，通过为员工追求无障碍认证提供激励，或鼓励参加无障碍会议和网络研讨会。\
  \ *AccessU*、*Inclusive Design 24*、*CSUN*、*a11yToronto* 和 *Axe-Con* 等活动提供了几乎零成本的宝贵学习机会，同时也让团队接触到该领域顶尖专家的新兴最佳实践和创新。\n\
  \n###### 将无障碍融入职业成长\n\n维持无障碍工作的最佳方法之一是将无障碍技能与职业发展联系起来。 当无障碍被高层管理人员和领导层认可为宝贵的专业技能时，员工更有可能在工作中优先考虑它并培养技能。\n\
  \n设想一家组织决定启动“无障碍卓越”奖，以表彰在项目中对无障碍做出重大贡献的员工。你能看到庆祝这些努力将如何强化无障碍是公司内被认可的职业成长关键部分这一观念，而非清单上的一项勾选？\n\
  \n\n\n\n\n其他组织可能会选择将无障碍访问正式纳入职位描述，在此过程中确保新员工在加入团队时已重视包容性。一些公司甚至可能会有意将无障碍贡献纳入团队年度绩效评估的一部分，从而使无障碍从团队目标成长为个人责任。\n\
  \n当员工看到无障碍专业知识会带来进一步的认可、领导机会和职业成长时，他们长期投入开发和应用这些技能的可能性就会呈指数级增加。\n\n##### 创建持续学习的文化\n\
  \n我所遇到的最具包容性的组织是那些从不停止学习并且总是渴望质疑他们对数字无障碍的认知的组织。它们是那些停止将无障碍视为项目或待完成的清单，而是将其作为其成长和创新的持续和不断的一部分的组织。\n\
  \n一次又一次，我看到专注于实践、角色特定的培训的团队比那些只专注于学习“规则”的团队建立了更深的无障碍知识。鼓励同伴学习和内部指导的领导者最终也会创造出更强大、更具包容性和更自信的团队。\n\
  \n主动让有残疾的终端用户参与其流程并努力跟上不断发展的标准的公司，在无障碍差距变成问题之前更容易防止这些差距的出现。很明显，当无障碍技能被认可为职业发展的重要组成部分时，员工可以看到对他们有什么好处。因此，他们也更有可能保持参与并致力于组织的长期无障碍成功。\n\
  \n目标始终应该是让无障碍教育具有实用性、吸引力和连续性，这样它就不再被视为又一个无意义的要求，而成为一种令人满意的共同责任，最终为所有相关人员推动更好、更具包容性的产品和服务。\n\
  \n##### 摘要\n\n如果我希望你从本章带走的一个关键信息，那就是建立包容性设计文化不仅仅是勾选框或达到合规目标。没错，这些事情很重要，因为它们通常是你努力会被衡量的方式，但真正的价值远不止于此。它关乎将无障碍融入\n\
