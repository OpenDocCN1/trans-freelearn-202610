- pgno: 75
  md: '# 3


    # Legal and Ethical Considerations

    in Accessible Design


    *By Maya Sellon*


    When you turn on captions to watch your favorite program on Netflix, you’re benefiting
    from the results of accessibility laws in action. These legal protections don’t
    just ensure compliance; they drive the creation of more inclusive experiences
    for everyone. But accessibility isn’t just about compliance – it’s also about
    ethics. A product that merely meets the legal minimum might still be unusable
    for many, whereas an ethically driven approach ensures an experience that feels
    as seamless as magic. Inclusive design should be baked into the process, not sprinkled
    on top.


    Certain regulatory frameworks, such as the **US Americans with Disabilities Act
    (ADA)** and the **UN Convention on the Rights of Persons with Disabilities (CRPD)**,
    have established legal requirements for accessibility and set the foundation for
    ensuring digital spaces are inclusive. Yet, laws alone are only the starting point.
    True inclusion requires going beyond compliance. Ethical design shifts the focus
    from meeting minimum standards to creating inclusive experiences. It recognizes
    that barriers are created by design choices, not by individuals with disabilities.


    By the end of this chapter, you’ll gain a clear awareness of the major accessibility
    laws and international protections that establish accessibility as a fundamental
    human rights issue, not a passing trend or design preference. With this foundation,
    you’ll be able to confidently push back against resistance to accessibility measures,
    whether it’s questions about user demographics or cost-driven business concerns.
    You’ll also better understand how legal requirements and ethical considerations
    intersect, equipping you to advocate for inclusive design as a core principle
    rather than an afterthought.'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'In this chapter, we will cover the following topics:


    +   - Navigating global accessibility legislation

    +   - Balancing legal compliance and ethical responsibility

    +   - Forecasting future legal trends in digital accessibility

    +   - Cultivating an ethically-driven design culture


    # Navigating global accessibility legislation


    Legal protections for disability rights are more than just regulatory requirements.
    They define accessibility as a fundamental human right and shape how societies
    approach inclusion. While accessibility laws differ by country, they serve as
    a critical tool for ensuring equal access, preventing discrimination, and holding
    organizations accountable. However, legal protections are far from universal.
    Only 24% of countries have constitutions that specifically prohibit discrimination
    or affirm equal rights based on disability, and less than 10% of country constitutions
    explicitly guarantee civil rights for persons with disabilities (UCLA WORLD Policy
    Analysis Center, 2024). Constitutional protections serve as a crucial starting
    point for challenging inequality and dismantling discriminatory laws. In Uganda,
    legal reforms have led to mandatory workplace accommodations for people with disabilities
    (Shakespeare et al., 2019), while in Peru and Colombia, constitutional guarantees
    have secured the right to vote for persons with disabilities (Open Society Foundations,
    2019). While these successes highlight what’s possible, significant barriers remain
    – something we’ll explore later in this chapter.


    Beyond setting legal obligations, these laws influence broader societal attitudes.
    The adoption of the social model of disability, championed by the UN CRPD, has
    reframed disability as an issue of external barriers rather than individual impairment.
    This shift has had far-reaching consequences, encouraging policies and design
    practices that prioritize accessibility from the outset rather than treating it
    as an afterthought.


    Here is why legal protections matter globally:


    +   - **Human rights and equality:** Disability rights are human rights. More
    than 90% of the United Nations member countries ratified the CRPD because they
    recognized that disability discrimination was a global issue that needed to be
    addressed.

    +   - **Combating systemic discrimination:** Laws protect against exclusion and
    help break down barriers in employment, education, and public services, ensuring
    that people with disabilities aren’t faced with systemic barriers that limit their
    opportunities and independence.'
