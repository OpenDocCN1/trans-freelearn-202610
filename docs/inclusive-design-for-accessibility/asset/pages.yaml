- pgno: 23
  md: '# Preface


    In an increasingly digital world, the ability to access information, services,
    and opportunities online is not a luxury – it’s a human right. Yet, for millions
    of people with disabilities, everyday digital experiences still present barriers
    that prevent full participation. Whether it’s a mobile app that can’t be navigated
    with a screen reader, a website that hides key content behind inaccessible modals,
    or an AI tool that misinterprets a user’s voice or intent, digital exclusion remains
    a persistent and solvable problem. *Inclusive Design for Accessibility* is a practical
    guide for anyone who wants to close that gap – designers, developers, content
    creators, QA testers, and organizational leaders alike.


    This book brings together voices from across the accessibility community to provide
    you with a comprehensive roadmap for building inclusive digital experiences. It
    begins by grounding you in the principles of inclusive design and the diverse
    needs of real users. From there, it explores the nuts and bolts of implementation:
    how to design accessible user interfaces, write inclusive content, build accessible
    websites and mobile apps, and test with both automated tools and human insight.
    As technology evolves, so must our approach. That’s why we also examine accessibility
    in emerging spaces such as VR, AR, and AI – and look at the organizational strategies
    needed to scale these efforts sustainably.


    Throughout the book, you will encounter real-world tools and technologies – from
    screen readers such as VoiceOver and NVDA to development frameworks such as SwiftUI,
    Compose, and React Native. But more importantly, you’ll gain a human-centered
    lens on accessibility: one that views inclusion not as a checklist, but as a creative,
    ethical, and business-critical practice. Whether you’re just starting out or looking
    to level up your organization’s accessibility maturity, this book will help you
    design with empathy, build with intention, and create digital products that work
    for everyone.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# Who this book is for


    This book is perfect for digital designers, developers, UX professionals, product
    managers, and business leaders committed to inclusive design. It offers practical
    skills to create accessible digital products, as well as covering legal and ethical
    aspects, user research, and building an accessibility culture within teams.


    You don’t need to be an expert to get value from this book. Each chapter offers
    actionable insights that stand on their own – be it UX design, product management,
    development, or accessibility leadership.


    # What this book covers


    In Chapter 1, *Defining Inclusive Design in the Digital Age*, Dale Cruse charts
    the evolution of accessibility from a reactive add-on to a proactive, user-centered
    design mindset. The chapter introduces foundational concepts such as universal
    design principles, the social model of disability, and inclusive research methods,
    equipping you to design digital experiences that work for everyone.


    In Chapter 2, *Understanding Diverse User Needs: Types of Disabilities and Assistive
    Technologies*, Dr. Angela Young, CPACC, examines how people with a wide range
    of permanent, temporary, and situational disabilities interact with digital technology.
    The chapter provides an in-depth look at assistive technologies, categorizes different
    disability types, and maps user needs to inclusive design strategies, offering
    you practical guidance for creating digital products that are truly accessible
    and empowering for all.


    In Chapter 3, *Legal and Ethical Considerations in Accessible Design*, Maya Sellon
    explains how digital accessibility is both a legal requirement and an ethical
    imperative. The chapter outlines global laws such as the ADA and CRPD, explores
    the limitations of compliance-only approaches, and emphasizes the importance of
    designing inclusively from the start to foster meaningful and equitable user experiences.


    In Chapter 4, *User Research and Testing for Inclusive Products*, Julianna Rowsell
    guides you through building inclusive research practices that center on disabled,
    neurodivergent, and marginalized participants from the outset. The chapter offers
    strategies for equitable recruitment, accessible methodologies, and meaningful
    analysis, emphasizing that inclusive research is a relational, ongoing practice
    – not a checklist – and must translate into design decisions that reflect the
    lived realities of diverse users.'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'In Chapter 5, Designing Accessible User Interfaces: Visual and Interaction
    Design, Nandita Gupta explores how to build interfaces that are inclusive across
    visual, cognitive, and input-related dimensions. The chapter provides actionable
    guidance on using color responsibly, supporting cognitive accessibility, enabling
    multiple input methods, and scaling accessible design systems, empowering you
    to create digital experiences that are not only usable but equitable for all.


    In Chapter 6, Creating Accessible Content: Writing, Images, and Multimedia, Jennifer
    Chadwick empowers content creators to communicate inclusively by using plain language,
    accessible formatting, and alternative content formats. The chapter offers practical
    guidance for writing clear text, labeling interactive elements, describing images
    and multimedia, and concludes with a hands-on walk-through exercise to help creators
    evaluate and improve accessibility across content types.


    In Chapter 7, Developing Accessible Websites: HTML, CSS, and ARIA Best Practices,
    Crystal Scott equips developers with foundational skills to build inclusive, accessible
    websites. The chapter covers semantic HTML, accessible CSS styling, proper use
    of ARIA attributes, and testing strategies – encouraging an accessibility-first
    mindset that integrates inclusion into every coding decision.


    In Chapter 8, Mobile Accessibility: Designing for Touch and Voice Interfaces,
    Chris McMeeking explores the unique challenges and opportunities of building accessible
    mobile applications. The chapter offers practical guidance for optimizing touch
    targets, supporting diverse input methods, designing for voice interaction, and
    ensuring responsive layouts – empowering teams to deliver inclusive mobile experiences
    across platforms and devices.


    In Chapter 9, Accessibility in Emerging Technologies: VR, AR, and AI, Dr. Keith
    Newton explores how to design inclusive experiences in immersive and intelligent
    systems. The chapter offers practical strategies for adapting virtual and augmented
    reality for users with diverse needs and highlights how AI can both enhance and
    complicate accessibility, depending on how it’s implemented.


    In Chapter 10, Foundations of Accessible Design System Patterns, Charlie Triplett
    lays out a comprehensive framework for building accessibility into design systems
    from the ground up. The chapter emphasizes starting with common user needs – such
    as low vision, color perception, and cognitive accessibility – before layering
    in more complex assistive technology support, guiding teams to create inclusive,
    scalable systems that reduce barriers by default.'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'In Chapter 11, Tools and Techniques for Accessible Evaluation and Prioritization,
    Kai Wong, CPACC, CHES®, guides you through the practical steps of accessibility
    testing for websites and mobile apps. The chapter covers how to combine automated
    tools with manual audits, prioritize and remediate issues, and embed accessibility
    into development workflows – helping teams build more inclusive digital products
    from the ground up.


    In Chapter 12, Building an Inclusive Design Culture: Strategies for Organization,
    Denis Boudreau, CPWA, shows how to embed accessibility into an organization’s
    daily operations, culture, and mindset. The chapter outlines strategies for cultivating
    empathy, integrating accessibility into workflows, measuring progress, and sustaining
    continuous learning – empowering teams to move from compliance to a meaningful,
    people-centered practice of inclusive design.


    # To get the most out of this book


    This book is for people who’ve worked on digital products – designers, developers,
    content strategists, researchers, and beyond. We assume you understand the basics
    of building websites or apps, but not necessarily accessibility or inclusive design.


    You don’t need to be an expert. What matters is that you’re ready to shift your
    perspective – to see inclusion not as a checklist, but as a core design value
    that benefits everyone.


    If you bring curiosity, openness, and a willingness to question default practices,
    you’ll find this book both practical and transformative.


    # Download the color images


    We also provide a PDF file that has color images of the screenshots/diagrams used
    in this book. You can download it here: https://packt.link/gbp/9781835888223.


    # Conventions used


    There are a number of text conventions used throughout this book.


    CodeInText: Indicates code words in text, database table names, folder names,
    filenames, file extensions, pathnames, dummy URLs, user input, and X/Twitter handles.
    For example: “Tags such as <header>, <article>, and <section> provide clear definitions
    of their role, allowing both browsers and assistive technologies to interpret
    and navigate the page effectively.”'
  merge: -1
  img_proc: true
