- pgno: 114
  md: '# Have we left room for stories that don’t align with our assumptions?


    Sometimes, people leave questions blank. Not because they don’t care, but because
    they do. Because it’s too close, too much, or too tiring to explain again. I’ve
    come to see that as data, too. Ambiguity isn’t failure. The disclosures that contradict
    or resist tidy arcs are often the ones I trust most. They remind me: this isn’t
    about clarity, it’s about complexity. And if our systems can’t hold that, maybe
    it’s the systems that need changing.


    Responsible interpretation isn’t passive. It’s a form of authorship. It shapes
    what gets built, believed, and backed. We don’t just honor the stories, we participate
    in reshaping the conditions that made them hard to tell in the first place.


    If you’re wondering what this looks like in practice, that’s the point. This work
    asks us to stay with what doesn’t have easy answers. But that doesn’t mean it
    can’t be actionable. Later in this chapter, I offer tangible methods, recruitment
    approaches, accessibility prompts, and synthesis strategies that help us hold
    complexity without collapsing it.


    As we analyze qualitative data, we need to pay attention not just to what was
    said, but how it was shared. Did someone hesitate? Skip a question? Go silent?
    These are not gaps, they’re signals. Tag them. Follow up. Use them to resist sanding
    down the complexity that often surrounds disability, trauma, or exclusion.


    Sometimes, insight doesn’t land with clarity. It lands with weight. Our job isn’t
    to extract it, it’s to hold it. To carry what someone entrusted us with, even
    if they didn’t say it out loud. When that happens, don’t rush to define or resolve
    it. Mark it. Return to it. Let it linger long enough to reveal what it’s asking
    of you. Not everything speaks in clean lines or tidy quotes. Some truths arrive
    quietly, asking us to stay with them a little longer before we decide what they
    mean.


    # Dynamic data in a fluid world


    Inclusion isn’t just about who’s at the table; it’s about how meaning is made,
    and whose truths are allowed to shape the system. In research, the way we hold
    data is never neutral. What we prioritize, discard, aggregate, or interpret reflects
    not just what we’ve learned, but who we’ve centered and who we’ve overlooked.


    As Payal Arora, a digital anthropologist focused on the Global South, reminds
    us, global digital narratives often ignore the informal, the adaptive, and the
    messy lived realities of the majority world. Jutta Treviranus, a pioneer in inclusive
    design, urges us to see inclusion not as'
