- pgno: 67
  md: '+   - **Challenge:** The platform uses tightly spaced, justified text in a
    decorative serif font, and there’s no way to adjust the visual presentation. These
    choices make it harder for the student to decode and retain information, increasing
    fatigue and frustration.

    +   - **Solution:** Using a sans-serif, dyslexia-friendly font, adding ample line
    spacing, and offering customization options (such as changing text/background
    color contrast) can significantly reduce visual stress. While not a cure, optional
    text-to-speech integration may also support comprehension when decoding becomes
    too difficult.


    By applying these principles and testing with neurodiverse users, you can gather
    valuable insights that highlight specific barriers and guide targeted accessibility
    improvements. By understanding the user’s context, designers can prioritize changes
    that have the greatest impact.


    # Real-world applications of mapping needs


    Understanding user needs is just the first step – applying those insights to real-world
    digital products is where accessibility makes a tangible impact. From education
    to e-commerce to financial services, different industries present unique challenges
    and opportunities for inclusive design. By examining common accessibility barriers
    in these spaces, we can identify practical solutions that improve usability for
    all users, not just those with disabilities. The following examples highlight
    how mapping user needs leads to more accessible and equitable digital experiences.


    # E-learning platforms: removing barriers to digital education


    E-learning platforms often serve diverse users, including those with cognitive
    disabilities, visual impairments, and hearing loss. However, when accessibility
    is not considered, these platforms can create significant barriers to learning.
    For example, consider the following barriers and practical solutions:


    *Imagine this scenario:* A college student who is blind, a second student who
    is deaf, and a third student with ADHD are enrolled in an online course that relies
    heavily on video content and lengthy reading assignments.


    *Now, what challenges might they face?*


    +   - Videos lack captions or transcripts, excluding d/Deaf and hard-of-hearing
    students

    +   - Long, unstructured text overwhelms students with ADHD or dyslexia

    +   - Blind students encounter navigation barriers and inaccessible quizzes that
    don’t work with screen readers'
  merge: -1
  img_proc: true
- pgno: 68
  md: '*What are the solutions?*


    +   - Provide captions and transcripts for all video content

    +   - Allow adjustable playback speeds to support auditory processing needs

    +   - Structure content with clear headings and concise paragraphs to enhance
    cognitive accessibility

    +   - Ensure screen reader compatibility, including labeling all interactive elements

    +   - Enable full keyboard navigation for quizzes and discussion forms


    These changes improve access for students with disabilities while also benefiting
    multi-taskers, non-native speakers, and users in noisy or distracting environments.


    While education opens doors to knowledge, accessible design in retail ensures
    those doors remain open when it’s time to shop, connect, and simply take part
    in everyday life.


    # E-commerce websites: ensuring inclusive online shopping


    E-commerce websites must cater to a wide range of abilities, yet many fail to
    account for accessibility, making online shopping frustrating or impossible for
    some users.


    *Imagine this scenario:* A customer with low vision, another with limited hand
    mobility, and a third who uses a screen reader attempt to make purchases on a
    retail website.


    *What are the challenges?*


    +   - Form fields are visibly labeled but not programmatically labeled, confusing
    screen reader users

    +   - Error messages signaled only by a change in font color aren’t immediately
    interpretable by users with color vision deficiency

    +   - Small touch targets and drop-down menus are difficult for users with motor
    impairments

    +   - Product images with missing or non-descriptive alt text leave screen reader
    users without context


    *What are the solutions?*


    +   - Ensure form fields are programmatically (not just visually) labeled

    +   - Supplement color-coded messages with icons or text

    +   - Enlarge clickable areas and simplify interactions for keyboard and switch
    control users

    +   - Add meaningful alt text to product images'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'These solutions expand usability for all shoppers while reducing cart abandonment
    and increasing sales fulfillment. But accessibility isn’t just about convenience
    or conversion – it’s about equity, especially when financial independence and
    personal security are at stake.


    As more essential services move online, digital accessibility becomes a matter
    of civil rights, not preference. Tasks such as managing bank accounts, applying
    for disability benefits, signing medical forms, or reviewing legal documents must
    be both accessible and secure. For people with disabilities, especially those
    who use assistive technologies, privacy and autonomy are at risk when systems
    are not built with their needs in mind.


    For example, a blind user completing a medical intake form via a screen reader
    should be able to do so independently – without needing a third party to read
    sensitive health information aloud. Likewise, deaf users must be able to receive
    important financial or legal information in formats that don’t rely solely on
    audio.


    Accessible design in these contexts must go beyond readability – it must prioritize
    accuracy, confidentiality, and user control. Inclusive systems aren’t just good
    business practice; they are essential for protecting the dignity, privacy, and
    rights of disabled users in digital spaces where stakes are high.


    # Banking and financial tools: improving digital accessibility in finance


    Banking apps and websites handle sensitive tasks that require precision and privacy.
    For users with disabilities, inaccessible design can create not just frustration,
    but a loss of autonomy – especially when it comes to managing finances independently.


    *Imagine this scenario:* A blind user tries to enter their PIN but the field is
    not compatible with screen reader input. They’re forced to ask someone else for
    help, compromising their privacy. A user with a cognitive disability can’t rely
    on autocomplete or use a password manager due to poor implementation, increasing
    the chance of errors or security issues. A third user with limited mobility struggles
    to complete a transaction because the app requires mouse-only input.


    *What are the challenges?*


    +   - Visual CAPTCHAs, time-limited codes, and audio prompts that exclude blind,
    Deaf, or neurodivergent users

    +   - Inaccessible PIN entry fields that prevent secure, independent authentication

    +   - No support for autocomplete or password managers

    +   - Dense financial jargon and cluttered data tables'
  merge: -1
  img_proc: true
- pgno: 70
  md: '+   - Layout distortion at 200% zoom, disrupting readability and navigation

    +   - CAPTCHA systems without accessible alternatives


    *What are the solutions?*


    +   - Implement accessible login options such as biometrics and multi-factor authentication
    that don’t rely on vision or sound

    +   - Ensure PIN fields and secure forms are compatible with screen readers and
    accessible input methods

    +   - Support autocomplete, saved credentials, and password manager integration

    +   - Reformat financial data using plain language, logical grouping, and accessible
    data tables with headers, concise labels, and screen reader-friendly markup

    +   - Test for compatibility with screen magnifiers and browser zoom (especially
    at 200%) to catch responsive design issues early

    +   - Offer non-visual CAPTCHA alternatives, such as logic-based or multi-choice
    options


    These enhancements go beyond technical compliance. They protect privacy, support
    independence, and build trust – all essential in the financial space. Accessibility
    in banking isn’t just about inclusion – it’s about dignity, security, and equal
    access to financial empowerment.


    # Iteration: a key to success


    Mapping user needs is not a one-time exercise but an ongoing process. As user
    needs evolve, so must the solutions designed to meet them. Consider a company
    that rolls out an accessible version of its app only to discover through feedback
    that its live chat feature is incompatible with screen readers. This feedback
    loop is vital to refining designs and maintaining inclusivity.


    Iteration involves collaboration between designers, developers, and users. Conducting
    regular usability tests with diverse participants ensures that solutions remain
    relevant and effective. For instance, testing a new search filter with users who
    rely on keyboard navigation might reveal hidden barriers, prompting improvements
    before the feature is widely released.


    # Identifying gaps and bridging them


    No product is perfect on the first attempt. Gaps often exist between user needs
    and the capabilities of current technologies or designs. Recognizing these gaps
    is the first step toward bridging them.'
  merge: -1
  img_proc: true
