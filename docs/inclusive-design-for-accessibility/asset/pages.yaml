- pgno: 176
  md: 'Now imagine if accessibility principles were taught alongside your first lessons
    on HTML, CSS, or JavaScript. How different would your understanding of the web
    – and its users – be today? The goal of this chapter is to help you adopt an accessibility-first
    mindset, a way of thinking that integrates accessibility into every decision you
    make.


    In this chapter, we will cover the following topics:


    +   - Structuring content with semantic HTML

    +   - Styling for accessibility with CSS

    +   - Enhancing dynamics with ARIA

    +   - A developer’s responsibility to test


    My sincere hope is that by the end of this chapter, you’ll never be able to unlearn
    what you’ve learned about accessibility. You may still encounter moments when
    something you build isn’t 100% accessible, but I hope you’ll know it. And I hope
    it will bother you, not out of guilt, but because you’ll understand what that
    means for someone who is trying to use your creation. The web is for everyone,
    so let’s start coding like it.


    ![](img/3bdc9e2d41de898f8a3bcc9634b0000e_176_0.png)


    An accessibility-first mindset means putting inclusivity at the core of every
    decision. It shifts the focus from designing for an assumed “default user” to
    designing for everyone.


    Ask yourself: Who am I creating this for? What is the intended purpose and outcome?
    Have I considered how this feature will work for users relying on a screen reader,
    a keyboard, or voice control? These questions lead to better, more thoughtful
    designs that work for all users.


    Neglecting accessibility isn’t just a missed opportunity – it excludes people
    from life-changing products and services. By making inclusion a priority, you’re
    building a fair, equitable, and welcoming web.


    # Structuring content with semantic HTML


    Can you remember the first Hypertext Markup Language (HTML) project you ever created?
    My money is on the infamous “Hello World” project. Ah, the beginner coder days
    – learning to wield the mighty < and > symbols for opening and closing tags, and
    figuring out how a simple / turns an opening tag into a closing one. Those moments
    of discovery were magical.'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'I still remember something from my first *Intro to Programming* class through
    The Last Mile that has stuck with me all these years. The instructor explained
    HTML, CSS, and JavaScript using the analogy of the human body. HTML was the bone
    structure – the foundation. CSS was the skin, hair, and eye color, providing the
    styling on top of the skeleton. And JavaScript? That was the brain – the control
    center that brought functionality to the entire body. Just like a body needs strong
    bones, a website needs well-structured HTML for stability.


    Understanding how HTML provides structure is only the beginning. To truly build
    accessible, meaningful websites, we need to go deeper, starting with the difference
    between non-semantic and semantic HTML.


    # Defining non-semantic HTML


    To appreciate semantic HTML, it’s important to first understand its opposite,
    **non-semantic HTML**. This refers to generic elements such as `<div>` and `<span>`
    that structure a web page without conveying meaning or context.


    As the developer and author Manuel Matuzović says, “A div is not a button.” The
    `<div>` element is a “pure” container. According to MDN Web Docs: “As a ‘pure’
    container, the `<div>` element does not inherently represent anything. Instead,
    it’s used to group content so it can be easily styled using the class or id attributes,
    marking a section of a document as being written in a different language (using
    the lang attribute), and so on.”


    ![](img/3bdc9e2d41de898f8a3bcc9634b0000e_177_0.png)


    Figure 7.1: Reminder: A <div> is not a <button>! #A11y (A11y = Accessibility)'
  merge: -1
  img_proc: true
- pgno: 178
  md: "The problem with non-semantic HTML is that it provides structure but no meaning.\
    \ It’s like putting content inside an invisible box – screen readers and search\
    \ engines can’t tell what it’s for, or sometimes even that it’s there. The `<div>`\
    \ and `<span>` elements, for instance, don’t communicate the purpose of their\
    \ content, making it harder for assistive technologies and search engine crawlers\
    \ to understand or interpret the page correctly.\n\n# Defining semantic HTML\n\
    \n**Semantic HTML** structures a web page using elements that inherently describe\
    \ their purpose, making content more meaningful and accessible. Tags such as `<header>`,\
    \ `<article>`, and `<section>` provide clear definitions of their role, allowing\
    \ both browsers and assistive technologies to interpret and navigate the page\
    \ effectively. This improves readability, enhances accessibility, and strengthens\
    \ search engine optimization by giving content a logical hierarchy.\n\nBy using\
    \ elements according to their intended role rather than visually styling non-semantic\
    \ elements, developers create a well-structured and intuitive web experience.\
    \ For example, `<footer>` naturally indicates closing information, while `<nav>`\
    \ clearly defines a group of navigational links. These distinctions provide clarity,\
    \ ensuring that users, especially those relying on assistive technology, can interact\
    \ with web content in a meaningful way.\n\nLet’s take at this code block:\n\n\
    ```\n```html\n<!-- Semantic HTML: Native button -->\n<button type=\"submit\">Submit</button>\n\
    \n<!-- Non-semantic imitation: Recreating a button with a <div> -->\n<div\n  \
    \  role=\"button\"\n    tabindex=\"0\"\n    onclick=\"submitForm()\"\n    onkeydown=\"\
    if (\n        event.key === 'Enter' || event.key === ' '\n    ) submitForm();\"\
    \n>\n    Submit\n</div>\n```\n```\n\nThe first example uses a semantic `<button>`\
    \ element, which is accessible by default and supports keyboard interaction, screen\
    \ readers, and form submission without extra code. The second example shows a\
    \ `<div>` with `role=\"button\"`, `tabindex=\"0\"`, and JavaScript event handlers\
    \ added to imitate button behavior. This approach increases complexity and risks\
    \ missing critical accessibility features."
  merge: -1
  img_proc: true
- pgno: 179
  md: '# Why does semantic HTML matter?


    Semantic HTML enhances your website through the following:


    +   - **Meaningful markup:** Built-in roles (e.g., `<header>` as a “banner”) and
    elements such as `<nav>` and `<main>` provide meaningful structure for screen
    readers, enabling easier navigation. By using semantic HTML, developers create
    a web experience where users who rely on assistive technologies can efficiently
    locate content, bypass repetitive sections, and navigate the page just as seamlessly
    as those using a mouse or touch.

    +   - **Logical hierarchy:** Proper use of semantic headings (`<h1>` to `<h6>`)
    ensures content is structured intuitively, improving navigation for all users,
    including those using assistive technologies. In addition to aiding screen readers,
    a well-defined heading structure also enhances the visual hierarchy, guiding users’
    eyes naturally through the content. Since most people scan web pages rather than
    reading word for word, clear headings make it easier to locate key information
    quickly.

    +   - **SEO:** Tags such as `<article>` and `<h1>` improve content discoverability
    and search rankings. Just like assistive technologies, search engines rely on
    semantic HTML to understand the structure and relevance of content, helping them
    index pages more accurately and rank them effectively.

    +   - **Assistive technology support:** Elements such as `<form>` and `<label>`
    work together to create accessible workflows, ensuring users relying on assistive
    technologies can navigate forms effectively. The `<label>` element provides clear
    text descriptions for form fields, while `<fieldset>` and `<legend>` offer context
    for grouped inputs. Proper semantic markup ensures users can complete forms smoothly
    using a keyboard or voice commands, making interactions more inclusive and accessible.

    +   - **Keyboard navigation:** Interactive elements such as `<button>` support
    keyboard use and communicate states effectively. Unlike `<div>` or `<span>`, which
    require additional scripting to be interactive, native HTML elements such as `<button>`,
    `<a>`, and `<input>` are automatically focusable and respond to keyboard events,
    such as Tab, Enter, and Space. Using semantic elements ensures that interactive
    components are accessible out of the box, without needing to script fixes for
    event handlers or keyboard focus.


    Using proper semantic markup creates a roadmap for assistive technologies, enabling
    users with disabilities to navigate more effectively. Beyond accessibility, semantic
    HTML improves collaboration and SEO. Developers can understand your code more
    easily, and search engines can better categorize your site. Mastering semantic
    HTML means writing empathetic, logical code that benefits developers, users, and
    machines alike.'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'Semantic HTML lays the structural foundation for accessibility by giving content
    meaning and clarity. But structure alone isn’t enough; how we *style* that content
    also plays a crucial role in usability and inclusion. Let’s turn our attention
    to CSS and explore how thoughtful styling choices can support a more accessible
    experience for all users.


    # Styling for inclusive design with CSS


    **Cascading Style Sheets (CSS)** is the stylist of modern web design, transforming
    basic HTML structures into visually engaging and responsive experiences. But the
    way you implement CSS can make or break accessibility.


    Accessibility in CSS isn’t just about looking good – it’s about *working for everyone*.
    Poorly considered styling can create barriers for users with low vision, cognitive
    challenges, or motion sensitivities. A high-contrast button could mean the difference
    between completing a purchase or leaving a website frustrated. A keyboard user
    relies on visible focus styles to navigate, while someone with motion sensitivity
    might need animations turned off.


    The good news? By adopting thoughtful best practices, you can ensure your CSS-enriched
    designs are inclusive, usable, and still beautiful.


    # Ensure sufficient color contrast


    If users can’t read your content, no amount of clever design will save it. **Web
    Content Accessibility Guidelines (WCAG)** set minimum contrast ratios to ensure
    legibility:


    +   - **Normal text** (such as body copy) must have a contrast ratio of 4.5:1
    against its background

    +   - **Large text** (18pt regular or 14pt bold) requires a lower minimum ratio
    of 3:1 because its size makes it easier to read

    +   - **Meaningful user interface components** (such as form field borders or
    focus indicators) and graphical objects (such as icons or charts) also need a
    contrast ratio of 3:1 with their background to remain clear and distinguishable


    Let’s take a look at this example:'
  merge: -1
  img_proc: true
- pgno: 181
  md: '![](img/3bdc9e2d41de898f8a3bcc9634b0000e_181_0.png)


    Figure 7.2: Comparing poor and sufficient color contrast for decorative text


    The top example shows white cursive text on a light purple background, which fails
    WCAG contrast requirements and is difficult to read for many users. The bottom
    example uses dark purple text on the same background, passing contrast checks
    and improving readability while maintaining the visual style.


    Failing to meet these standards can make content difficult or impossible to perceive
    for users with low vision, color blindness, or those affected by glare or poor
    lighting conditions. Now imagine a web page using cursive low-contrast text that
    might look “stylish,” but if users can’t read your content, then what’s the point?
    By ensuring proper color contrast, you’re handing users a bright flashlight, not
    leaving them to fumble in the dark.


    # Avoid adding important content with CSS


    CSS pseudo-elements (::before and ::after) are useful for decorative purposes
    but shouldn’t be used to insert critical content. Screen readers may not interpret
    pseudo-element content consistently; it might be ignored, duplicated, or read
    out of context.


    If you’re using pseudo-elements to add labels, instructions, or required field
    indicators, there’s a high risk that users relying on assistive technologies will
    miss them. Pseudo-elements such as ::before and ::after don’t exist in the DOM,
    so you can’t apply ARIA attributes to them directly. For example, if you use a
    decorative icon with ::before, a screen reader might still announce the generated
    content – unless the parent element is wrapped or styled in a way that includes
    aria-hidden="true" on an actual DOM element.'
  merge: -1
  img_proc: true
