- pgno: 110
  md: 'And it lives in how we push back against the dominant narratives that have
    long shaped what’s seen as “valid,” “valuable,” or “objective” in the first place.
    Research that begins with care should end with accountability. That’s where meaning
    lives and where change can take root.


    In the next section, we’ll look at what it means to analyze qualitative data in
    ways that honor the full context, center lived experience, and open up space for
    a more honest, more equitable understanding of what really emerges when we listen
    well.


    # Analyzing qualitative data from diverse user groups


    Data is not neutral. Every piece of research data carries with it the weight of
    its context, the biases of its collection methods, and the lived realities of
    those who provide it. We must extend beyond the surface to the human story in
    the data. What we include in our datasets or code directly influences the conclusions
    we draw and the actions we take. When we analyze qualitative data from diverse
    user groups, we must approach this with humility, understanding, and awareness
    of the potential power dynamics.


    When analyzing data from marginalized communities, understand how your own biases
    may influence interpretation. To help counterbalance this, we need to prioritize
    participant voices over our assumptions or beliefs:


    +   - Sometimes we ask about identity directly (race, disability, gender, or income)
    because it’s part of our recruitment goals or ethical obligations.

    +   - Other times, participants choose what to share, and we don’t always have
    the full picture.

    +   - Both realities shape how we analyze. When identities are named, we gain
    more context for interpretation. When they’re not, we must be careful not to default
    to a single-issue lens.

    +   - Lived experience is layered. A quote about screen reader frustration might
    also carry the weight of economic precarity, cultural mistrust, or systemic neglect.

    +   - Intersectionality doesn’t mean we have to decode everything; it means we
    stay aware that people don’t show up with just one story. For example, a person
    with a vision-related disability may also be a single parent or part of the 2SLGBTQ+
    community (the use of “2S” acknowledges Indigenous understandings of gender and
    sexuality, which are often erased in mainstream frameworks). All of which shape
    their experiences and how they navigate the world.

    +   - Reflexivity in research means holding space for the complexity we see, and
    the complexity we don’t.'
