- pgno: 294
  md: 'Worse still is the situation where a small, under-resourced accessibility team
    is tasked with “fixing” issues that stem from decisions made much earlier in the
    process. These teams often find themselves stuck between design, development,
    business, and QA, trying to advocate for accessibility while being pressured to
    sign off on products that aren’t ready. They spend their time firefighting and
    justifying why barriers exist, while the rest of the organization blames them
    for slowing things down or not providing quick fixes.


    It’s an impossible position to be in, and one that almost always leads to burnout,
    frustration, and stalled progress. Ask anyone who’s been there.


    Picture a software company struggling with this exact issue. Their accessibility
    fixes are always coming in late, slowing down releases, frustrating developers,
    and leading to patchwork solutions instead of lasting improvements. By restructuring
    their design and development workflows so that accessibility is no longer treated
    as an afterthought, they can stop relying on their designated accessibility champion
    and instead start to embed accessibility tasks into every role for improved success.


    Designers can then take charge of ensuring color contrasts meet WCAG standards,
    that obvious focus indicators are designed to support keyboard navigation, and
    that images include pertinent text alternatives. As we’ve seen in Chapter 10,
    when discussing inclusive design patterns and components, developers who leverage
    semantic HTML, build in seamless keyboard navigation systems, and test their pages
    with automated testing tools and assistive technology from the beginning can really
    push accessibility forward. QA testers can include both automated and manual accessibility
    checks in their standard test plans, with clear feedback loops so issues can be
    addressed in a timely manner.


    By making accessibility a shared responsibility, the company eliminates many of
    the back-and-forth fixes and significant cost overruns that plague and slow down
    their projects. Within months, accessibility becomes a more natural part of their
    processes, rather than a hurdle to clear at the end.


    # Shifting left: building accessibility into the process from the start


    The shift-left concept is simple: the earlier digital accessibility is considered
    as part of the process, the easier it is to integrate into the final product.
    When teams define accessibility requirements from the very beginning of a project,
    they avoid major accessibility barriers later on.'
  merge: -1
  img_proc: true
- pgno: 295
  md: 'Imagine a company struggling with accessibility inconsistencies across its
    products. Some teams prioritize it, and others treat it as an afterthought. To
    fix this, they decide to build an accessible design system. Instead of asking
    every team to reinvent the wheel, they create shared components: accessible widgets,
    usable color palettes, legible typography, and well-tested interactive elements.
    With accessibility baked into the system, teams no longer have to guess. The burden
    on individual designers and developers drops. Accessibility becomes the default.


    Another organization might take a different path. They build accessibility reviews
    into their sprint cycles, checking new features every two weeks instead of waiting
    until the end. Doing so helps the teams catch issues early while they’re still
    easy to fix. Over time, this reduces last-minute scrambles and leads to more consistently
    accessible products.


    Teams that adopt either approach are most successful when they also build in testing
    at every step. That means layering automated scans into each code commit to catch
    common issues such as missing alt text, unlabeled form fields, or contrast problems
    as soon as they appear. But they don’t stop there. Before major releases, they
    also run usability tests with real users of assistive technology, surfacing deeper
    issues that automated tools can’t detect, such as confusing keyboard focus order
    or broken screen reader interactions.


    By testing early and often, teams catch more barriers before they go live and
    save time and effort in the long run. This approach to testing is what helps them
    go beyond technical compliance, so they can successfully create inclusive experiences
    for people living with disabilities.


    Both strategies – the accessible design system and the sprint-based accessibility
    reviews – are valid ways to shift left. What really matters is that the accessibility
    practice is intentionally and consistently baked into the process. Whether you
    build it once at the foundation or revisit it regularly through agile cycles,
    the key is making it part of how you work, not something you scramble to fix later.


    # Reducing accessibility debt


    Ignoring how accessibility issues impact end users also creates inclusion debt
    for organizations. It keeps adding to a backlog of issues that only grows harder
    and more costly to fix over time. Just like technical debt, the longer these problems
    go unaddressed, the more expensive and time-consuming they become to resolve.'
  merge: -1
  img_proc: true
- pgno: 296
  md: 'Though he was never involved in the discipline, it is still Frank Lloyd Wright,
    an American architect, designer, writer, and educator who captured the essence
    of digital accessibility best when he famously said the following about the benefits
    of planning ahead of time when designing buildings: “*You can use an eraser on
    the drafting table or a sledgehammer on the construction site. Your choice.*”


    This reminds me of a media company I once worked with that had been accumulating
    accessibility debt for years. Every new release introduced more barriers, and
    their backlog of accessibility fixes kept growing. They knew they needed a long-term
    solution, but all they could really come up with were temporary patches. To break
    the cycle, they formed an accessibility strike team: a dedicated group of designers,
    developers, and QA testers whose role was to review features before they were
    shipped. Within a year, they had cut their backlog by close to 60% and were finally
    releasing products that were that much more accessible from day one.


    Putting together an accessibility strike team is just one of many approaches an
    organization can take to stay ahead of its accessibility debt. Other options include
    prioritizing accessibility fixes in backlog grooming, treating them like any other
    critical issue instead of putting them off for later. Other teams might choose
    to add accessibility checkpoints to their design reviews, so that potential barriers
    are caught before development even starts.


    The most forward-thinking teams might even invest in training their designers
    and developers on accessible coding and design patterns, in order to reduce the
    chances of accessibility problems being introduced in the first place. In every
    one of these scenarios, proactivity is key.


    No matter the strategy, what makes the biggest difference is building visibility
    and accountability into the process to prevent those issues from coming back.
    Without tracking what’s been fixed and what still needs attention, it’s far too
    easy for accessibility debt to start piling up again. And the best way to mitigate
    this risk is to treat accessibility issues like any other business priority: by
    tracking and reporting on them.


    # Measuring and reporting on accessibility progress


    The reality is, your accessibility efforts won’t mean much if your organization
    can’t track its progress. This is because without clear benchmarks and reporting,
    accessibility tends to remain an abstract goal rather than a measurable outcome.
    Teams that make real progress are those that treat accessibility like any other
    business priority. They set goals, they create accountability, and they review
    results regularly.'
  merge: -1
  img_proc: true
- pgno: 297
  md: 'Still, to this day, most organizations continue to assume that accessibility
    is either “done” or “not done.” But that mindset is what prevents real progress…
    Accessibility is an ongoing practice with a lot (and I mean a lot!) of moving
    parts. One that can and does improve over time, given that the teams have the
    right data to guide their decisions. Measuring accessibility effectively means
    understanding the W3C guidelines, yes. But more importantly, it means understanding
    the actual experience of users with disabilities and tracking the long-term impact
    of the contributions and feedback.


    # Defining success beyond compliance


    Many organizations start by measuring accessibility through compliance standards
    such as WCAG, the Americans with Disabilities Act (ADA), the Accessible Canada
    Act (ACA), the European Accessibility Act (EAA), or some other local, legal requirements.
    While compliance is important, it’s not the finish line. In fact, compliance is
    nothing more than a good starting point. A product or service can absolutely meet
    technical standards on paper and still be frustrating, or even impossible for
    individuals with disabilities to navigate.


    At this point, it would be fair to ask: if meeting WCAG doesn’t guarantee a usable
    experience, what’s the point of having these standards in the first place?


    Now, don’t get me wrong. WCAG still plays a critical role by providing the technical
    baseline that helps teams align their work and catch common issues, but it does
    not pretend to (nor was it ever designed to) capture everything about user experience
    or usability. What WCAG defines is the floor, not the ceiling. That’s why teams
    that stop at accessibility compliance often fall short. Real accessibility requires
    moving beyond checklists and actively listening to how people interact with your
    products in the real world.


    I’ve experienced this with clients more times than I can count over the past 25
    years. As I write this, I’m reminded of a large e-commerce company that got to
    learn this firsthand. They had an internal accessibility audit process and were
    confident they were meeting WCAG standards. But when they brought in blind customers
    to test their site with various screen readers, they were surprised to find out
    that many users struggled to complete purchases.


    Their navigation structure was technically compliant but functionally unusable.
    While most of the components used in their pages were, in isolation, meeting accessibility
    guidelines, the interface as a whole relied heavily on visual cues to tie everything
    together. Since many of those cues weren’t conveyed properly to assistive technologies,
    it created serious comprehension gaps. Non-sighted users couldn’t follow what
    was happening, and the experience broke down.'
  merge: -1
  img_proc: true
