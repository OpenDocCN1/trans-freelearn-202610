- pgno: 184
  md: 'To meet these needs, use relative units and flexible layouts that adapt gracefully:


    +   - Use rem for font sizes, which scale relative to the root (<html>) element,
    and respect user-defined preferences.

    +   - Use em for spacing within components, allowing padding and margins to adjust
    based on text size.

    +   - Avoid fixed pixel (px) values for text and layout, as they don’t respond
    to browser zoom or OS-level scaling.

    +   - Ensure layout reflows at narrow viewports without cutting off or hiding
    content. Use techniques such as flex-wrap, media queries, or CSS grid to allow
    elements to stack or shift naturally:

    +     - flex-wrap: Allows flex items to wrap onto multiple lines, preventing them
    from shrinking too small or overflowing their container.

    +     - Media queries: Apply different styles at various breakpoints, enabling
    layouts to adapt responsively across screen sizes.

    +     - CSS grid: A powerful layout system that lets you create two-dimensional
    layouts, adjusting columns and rows to fit different screen sizes.

    +   - Test all interactive elements – including forms, buttons, and links – to
    confirm functionality and visibility at high zoom and on small screens.


    By combining flexible CSS with relative units, you can create a responsive, accessible
    experience that works well for everyone, including users with low vision or those
    navigating on mobile devices.


    # Provide highly visible focus styles


    Focus indicators are visual cues that highlight which interactive element is currently
    focused, such as a button, link, or form field. These indicators typically appear
    when users navigate a page using a keyboard (e.g., with the Tab key), helping
    them keep track of where they are on the page.


    To apply focus styles effectively, it’s important to understand the difference
    between focus versus focus-visible:


    +   - *:focus: This applies focus styles whenever the element is focused, including
    when clicked with a mouse or navigated to via a keyboard

    +   - *:focus-visible: This specifically targets keyboard users (or input methods
    that rely on focus navigation) and does not apply styles when the element is clicked
    with a mouse'
  merge: -1
  img_proc: true
- pgno: 185
  md: "Some developers remove focus styles entirely because they conflict with their\
    \ visual design, often without realizing how essential these indicators are for\
    \ accessibility. Without them, keyboard users are left guessing where their focus\
    \ is on the page, making navigation confusing and frustrating.\n\nHere’s an example\
    \ of what not to do:\n\n```\n*:focus {\n  outline: none;\n}\n```\n\nThis completely\
    \ removes the browser’s default focus styles, leaving keyboard users without any\
    \ visual indication of where they are on the page.\n\nInstead, enhance focus indicators\
    \ to align with your site’s design while keeping them clearly visible:\n\n```\n\
    *:focus-visible {\n  outline-color: #212121;\n  outline-style: auto;\n  outline-width:\
    \ 2px;\n  outline-offset: 2px;\n}\n```\n\nThe outline-style: auto keyword allows\
    \ the browser to apply its default outline appearance, which may vary depending\
    \ on the platform or user agent. While this can help maintain consistency with\
    \ native focus styles, it is important to ensure that your outline has sufficient\
    \ contrast and visibility against your site’s background.\n\nThe outline-offset:\
    \ 2px CSS property moves the outline slightly outside the element’s edge, preventing\
    \ it from being visually compressed against borders or overlapping with shadows;\
    \ this improves clarity and helps the outline maintain a visible 3:1 contrast\
    \ ratio on both light and dark backgrounds.\n\nEnsuring visible focus is just\
    \ one way CSS supports accessibility. Next, let’s look at why inclusive design\
    \ choices in CSS matter for real users."
  merge: -1
  img_proc: true
- pgno: 186
  md: '# How CSS supports inclusive design


    Inclusive design ensures that visual styling works for everyone, not just those
    using a mouse, a default font size, or a bright screen. When implemented with
    care, CSS helps remove barriers, reinforces content structure, and allows interfaces
    to adapt to a wide range of user needs, devices, and preferences. Here are a few
    of the outcomes inclusive design supports when CSS is used thoughtfully:


    +   - **Better readability**: High-contrast text and visible focus indicators
    help users with low vision or color vision deficiencies (color blindness) perceive
    and interact with content comfortably

    +   - **Clear separation of content and decoration**: Keeping meaningful content
    in HTML and using CSS for styling only ensures that screen readers interpret content
    correctly

    +   - **Reduced motion sensitivity**: Honoring user preferences to reduce motion
    prevents discomfort and distraction for users affected by motion-triggered conditions

    +   - **Responsive scaling**: Using relative units such as rem and em allows layouts
    and text to scale naturally, supporting zoom and custom font sizes without breaking
    the design

    +   - **Flexible layouts**: Responsive CSS adapts your design across screen sizes
    and zoom levels, ensuring content stays functional at 400% zoom or on narrow viewports

    +   - **Keyboard-friendly navigation**: Highly visible focus indicators help keyboard
    users understand where they are on the page and navigate efficiently


    Even with well-structured HTML and accessible CSS, there are cases where native
    elements alone cannot provide all the information or interaction needed. This
    is where ARIA comes in. When used correctly, ARIA can enhance accessibility by
    filling in gaps and making dynamic content and custom components more understandable
    to assistive technologies.


    # Enhancing dynamics with ARIA


    **Accessible Rich Internet Applications (ARIA)** is the toolset developers turn
    to when native HTML falls short. Introduced by the **World Wide Web Consortium
    (W3C)**, ARIA bridges the gap between dynamic web components – such as modals,
    accordions, and sliders – and accessibility. By using ARIA attributes programmatically,
    developers can help assistive technologies interpret context and behavior in situations
    where native HTML alone is not sufficient.'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'Before ARIA, developers struggled to build interactive components that were
    understood by assistive technologies. And let’s be honest, many still do – which
    is exactly why guidance like this exists. ARIA attributes give developers a way
    to programmatically communicate the purpose, state, and relationships of custom
    components when native HTML falls short:


    +   - aria-expanded can tell assistive technologies whether an element – such
    as a drop-down panel, accordion section, or menu – is currently expanded or collapsed.

    +   - aria-labelledby is commonly used to label elements such as accordion panels
    or tab panels by referencing the button or tab that triggers them. This ensures
    that assistive technologies announce a clear and descriptive label based on visible
    content.


    It’s important to remember, though, that ARIA is like salt. When used at the appropriate
    time and in the right amount, it can make food taste incredible. But, if used
    at the wrong time or in the wrong amount, it can ruin the experience.


    # The five rules of ARIA


    The W3C outlines these essential principles for using ARIA effectively:


    +   1. **Use native HTML elements first:** If you can use a native HTML element
    or attribute with the semantics and behavior you require already built in (instead
    of re-purposing an element and adding an ARIA role, state or property to make
    it accessible), then do so.

    +   2. **Do not change native semantics, unless you really have to:** Don’t override
    the meaning of HTML elements by changing their roles. For example, don’t assign
    role="tab" directly to a heading like <h2> – wrap it properly instead.

    +   3. **All interactive ARIA controls must be usable with a keyboard:** ARIA
    does not provide keyboard functionality. If you build a custom widget with ARIA
    roles (like role="button"), you must script keyboard behavior manually – including
    focus, Enter, and Space keys.

    +   4. **Do not use role="presentation" or aria-hidden="true" on focusable elements:**
    These attributes remove elements from the accessibility tree. If the element is
    still focusable, it can confuse screen reader users by making focus land on “nothing.”

    +   5. **All interactive elements must have an accessible name:** Any interactive
    element (like a button, link, form input, or custom widget) must expose an accessible
    name to assistive technologies. This helps users understand the purpose of the
    control.'
  merge: -1
  img_proc: true
- pgno: 188
  md: "The first rule is critical: use native HTML elements first. Before you reach\
    \ for ARIA, take a close look at what semantic HTML can already do. It’s the quiet\
    \ overachiever of web accessibility – built-in elements come with meaningful roles,\
    \ behaviors, and keyboard support that sometimes even ARIA can’t replicate.\n\n\
    If a native element exists, use it. ARIA is a powerful tool, but it should be\
    \ your last resort – not your first instinct. Nothing says “I didn’t do my research”\
    \ like slapping role=\"button\" on a <div> when you could’ve just used <button>.\n\
    \nBefore applying ARIA customizations, always refer to the latest specifications\
    \ to ensure you are using roles, states, and properties correctly. Guessing or\
    \ misapplying ARIA can lead to confusion for assistive technologies, ultimately\
    \ harming rather than helping accessibility. For example, adding role=\"navigation\"\
    \ to <button> instead of using a proper <nav> element may confuse screen reader\
    \ users by misrepresenting the element’s function and purpose.\n\nThe latest ARIA\
    \ specification, WAI-ARIA 1.2, became a W3C Recommendation on June 6, 2023. It\
    \ provides detailed guidance for using roles, states, and properties effectively:\
    \ https://www.w3.org/TR/wai-aria-1.2/. For further best practices, consult the\
    \ Using ARIA guidelines, published as a W3C Working Draft on September 27, 2018:\
    \ https://www.w3.org/TR/using-aria/.\n\nNow let’s take a closer look at the two\
    \ ARIA features we mentioned at the start of the section: aria-expanded and aria-labelledby.\n\
    \n# aria-expanded\n\nThe aria-expanded attribute communicates whether content\
    \ associated with an element is currently displayed (true) or hidden (false).\
    \ Dropdowns, accordions, and disclosure panels are common use cases for this attribute.\
    \ Non-sighted screen reader users especially benefit from its presence, as they\
    \ cannot rely on visual cues such as arrow icons or sliding animations to understand\
    \ whether content has been revealed.\n\nConsider a common FAQ interaction, where\
    \ a user clicks a question to reveal the answer. Visually, the change is obvious.\
    \ But for screen reader users, we need to communicate whether the associated content\
    \ is expanded or collapsed. The aria-expanded attribute makes that possible.\n\
    \n```\nHTML\n<button aria-expanded=\"false\" class=\"faq-toggle\">\n    What is\
    \ your return policy?</button>\n<div class=\"faq-answer hidden\">\n```"
  merge: -1
  img_proc: true
- pgno: 189
  md: "```\n<p>You can return items within 30 days of purchase for a full refund.</p>\n\
    </div>\nCSS\nhidden {\n    display: none;\n}\nJavaScript\nconst button = document.querySelector('.faq-toggle');\n\
    const answer = button.nextElementSibling;\n\nbutton.addEventListener('click',\
    \ () => {\n    const expanded = button.getAttribute('aria-expanded') === 'true';\n\
    \    button.setAttribute('aria-expanded', String(!expanded));\n    answer.classList.toggle('hidden');\n\
    });\n```\n\nThis setup uses aria-expanded to communicate the state of the answer\
    \ content, giving screen reader users the same context that sighted users get\
    \ from visual cues. The .hidden class ensures the content is visually hidden without\
    \ relying on the HTML hidden attribute, which behaves differently and can cause\
    \ issues with toggling in JavaScript.\n\n# aria-labelledby\n\naria-labelledby\
    \ is used to programmatically associate a visible text label with another element\
    \ on the page. This is especially useful when the text label is not nested inside\
    \ the element being labeled but is visually associated with it. A common example\
    \ is labeling a form section using a heading that describes its purpose.\n\nImagine\
    \ a checkout page where the payment form is visually introduced by a heading.\
    \ To ensure screen readers announce the form with a meaningful name, the developer\
    \ can link the form container to the heading using aria-labelledby:\n\n```\n<h2\
    \ id=\"payment-heading\">Payment Information</h2>\n<form aria-labelledby=\"payment-heading\"\
    >\n    <!-- Form fields here -->\n</form>\n```"
  merge: -1
  img_proc: true
- pgno: 190
  md: 'These are just two examples of the many ways ARIA can be applied to enhance
    accessibility. When used thoughtfully, attributes such as aria-expanded and aria-labelledby
    help communicate structure, relationships, and behavior to assistive technologies.


    # Applying ARIA to enhance dynamic and custom components


    Mastering ARIA means knowing its purpose and limits. ARIA isn’t a substitute for
    semantic HTML – it’s a supplement for when native elements fall short. Here’s
    how to make the most of ARIA:


    +   - **Know when to use it:** Follow the five rules of ARIA to ensure you’re
    enhancing accessibility, not hindering it.

    +   - **Check the specs:** Always consult the latest ARIA guidelines to apply
    roles, states, and properties correctly.

    +   - **Communicate changes:** Use ARIA attributes such as aria-expanded and aria-labelledby
    to communicate states and relationships between elements. These attributes – and
    others like them – help assistive technologies interpret dynamic behavior and
    provide meaningful labels for interactive controls.

    +   - **Test for compatibility:** Validate ARIA implementations with assistive
    technologies to confirm they work across devices and browsers.


    By thoughtfully applying ARIA, you can ensure that custom components are accessible,
    intuitive, and inclusive for all users. However, writing accessible code is only
    part of the process; you also need to verify that it works as intended. The next
    step is testing your code to catch accessibility issues early and ensure your
    implementation holds up in real-world scenarios.


    # Testing your code for accessibility conformance


    One of the most essential best practices in *developing accessible websites* is
    learning how to test your own code. This chapter has focused on HTML, CSS, and
    ARIA, but even the most carefully written code won’t result in an accessible experience
    unless it is tested. Accessibility is not just about writing perfect code. It
    is about achieving conformance with the WCAG and delivering the best possible
    user experience for the widest possible audience. And that starts with knowing
    how to test your work in real-world conditions.'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'Developers must understand the guidelines they are designing and coding for.
    Testing should not be left solely to auditors or quality assurance specialists.
    If you’re building digital products, testing for accessibility conformance should
    be part of your development workflow from the beginning, not a final step. This
    means understanding how to identify common barriers, interpret WCAG requirements,
    and recognize when something that looks fine may not be usable for everyone.


    A foundational accessibility testing process should include both automated tools
    and manual testing techniques. Automated tools are helpful for catching clear-cut
    errors, such as missing alternative text or insufficient color contrast. However,
    many accessibility issues, such as incorrect focus behavior, mouse-only interactions,
    or misleading link text, can only be caught by testing manually.


    The manual process must include the basic use of screen reader technologies. You
    don’t need to be a screen reader expert, but you should be familiar with how screen
    readers work, how to navigate a site with one, and how your content is announced
    to screen reader users. Whether you’re using NVDA on Windows, VoiceOver on macOS
    or iOS, or another tool, this knowledge helps you catch critical usability issues
    that automated scans will miss.


    It is also important to test your websites and components on multiple devices.
    User experiences vary across operating systems, browsers, screen sizes, and input
    methods. A design that works well on a desktop browser may break or become unusable
    when zoomed on a mobile screen or viewed in high contrast mode on a tablet. Testing
    across real environments ensures your work is inclusive by design – not by assumption.


    Browser developer tools play a key role in this process. The accessibility tree,
    focus order inspection, and role and name checks available in Chrome DevTools
    and Firefox are indispensable for understanding how assistive technologies interpret
    your code.


    All together, you should build up an accessibility testing toolkit – this is not
    just a collection of tools but a core part of how you work as a developer. The
    goal is not to use everything available but to consistently use the tools that
    align with your workflow, support your responsibilities, and help you build for
    real users.


    Every developer should maintain a toolkit that includes both automated and manual
    testing methods. This means checking for issues with the accessibility tree, validating
    semantic structure, inspecting color contrast, and simulating user experiences
    with assistive technologies. Testing should be an integrated part of development,
    not a final task or something handed off to someone else.'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'Here are the tools I use most often in my own accessibility-focused development
    work:


    +   - **Chrome DevTools**, especially the **Accessibility** pane and accessibility
    tree inspection

    +   - **Webflow Audit panel**, for identifying common accessibility issues during
    the build process

    +   - **TPGi Color Contrast Analyzer**, which I use to test contrast between foregrounds
    and backgrounds

    +   - **ARC Toolkit**, for validating landmarks, roles, and structural markup

    +   - **WAVE browser extension**, for quick, visual accessibility feedback on
    web pages

    +   - **NVDA** for screen reader testing on Windows

    +   - **VoiceOver** for macOS and iOS

    +   - **TalkBack** for testing on Android devices

    +   - **A reliable pixel-to-rem converter**, to help ensure scalable, user-friendly
    sizing


    This is a short list based on what works for me. You may find other tools that
    better suit your platform, role, or workflow. What matters most is consistency
    and intention. Testing should happen throughout development, not as an afterthought.


    As your projects evolve, so should your toolkit. Make time to learn new tools,
    explore how users experience your site, and adapt your process to meet the needs
    of more people.


    While this chapter introduces the importance of testing, *Chapter 11* will go
    much deeper. It will walk you through specific tools, methodologies, and workflows
    to help you build a sustainable, repeatable approach to evaluation.


    For now, the most important takeaway is this: testing is part of development.
    It is not optional, and it cannot be fully outsourced. Developers who take ownership
    of accessibility by learning the guidelines, practicing manual testing, using
    assistive technologies, and evaluating their work on multiple devices are the
    ones building experiences that are truly inclusive, usable, understandable, and
    welcoming to the widest possible audience.'
  merge: -1
  img_proc: true
- pgno: 193
  md: '# Summary


    This chapter explored the practical foundations of accessible web development,
    covering semantic HTML, inclusive use of CSS, appropriate application of ARIA,
    and the importance of accessibility testing. You have learned how HTML provides
    structure and meaning, how CSS can support usability without introducing barriers,
    and how ARIA can extend accessibility when native HTML is not enough. You also
    saw why testing your work for accessibility should be part of every developer’s
    process, and how a thoughtful testing toolkit can help you identify and fix barriers
    early.


    These skills are essential in today’s development landscape, where the digital
    experience must serve a broad range of users with diverse needs. Whether you’re
    building a landing page, a web app, or a complex interactive component, accessibility
    isn’t a nice-to-have; it’s a non-negotiable part of quality code. Adopting an
    accessibility-first mindset empowers you to create products that are more usable
    for all, legally compliant, and human-centered by design.


    In the next chapter, you will explore how to extend inclusive design principles
    to mobile environments, where touch gestures, screen size, and voice interaction
    introduce a unique set of accessibility challenges and opportunities.


    # Further reading


    Accessibility is not a one-time fix. It is an ongoing commitment that requires
    continuous learning and adaptation. As standards, tools, and technologies evolve,
    staying current helps ensure your work remains effective, inclusive, and aligned
    with real user needs. Make time to review updates to WCAG and WAI-ARIA, participate
    in accessibility communities such as WebAIM and the W3C, and follow trusted blogs,
    newsletters, and webinars to keep your knowledge sharp. Beyond implementation,
    advocacy also plays a critical role. Whether you are mentoring peers, publishing
    insights, or leading conversations within your team, your influence can help embed
    inclusive practices across your organization and the broader industry.'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'Here are a few trusted resources to support your continued growth:


    +   - **W3C Web Accessibility Initiative** (https://www.w3.org/WAI/): The W3C’s
    official hub for accessibility standards, including WCAG and WAI-ARIA. This is
    the go-to source for technical specifications, guidance, and working group updates
    on digital accessibility.

    +   - **WebAIM** (https://webaim.org/): A widely respected organization offering
    practical accessibility articles, research, and training. WebAIM is especially
    helpful for beginners and teams looking to build foundational knowledge.

    +   - **Deque University** (https://dequeuniversity.com/): A robust online training
    platform with courses on accessibility testing, screen reader usage, and ARIA.
    Deque’s resources are widely used in both enterprise and educational settings.

    +   - **Accessibility Book Club** (https://www.a11ybookclub.com/): A free, community-driven
    group I founded for developers, designers, and accessibility advocates who want
    to learn together through monthly readings, discussions, and live events.


    By staying connected to these resources, you will continue growing as an accessibility-minded
    developer and contribute to a more inclusive web. Because if your website isn’t
    working for everyone, it’s not really working at all.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# 8


    # Mobile Accessibility: Designing for Touch and Voice Interfaces


    By Chris McMeeking


    What are you doing when you use your phone? Are you at work? Sitting in the passenger
    seat of your car? Using a wheelchair? Taking a jog? Mobile devices are used by
    all sorts of people in all sorts of contexts. Bringing the convenience of mobile
    apps to your users in all these contexts is what accessible mobile application
    design and development is all about. However, there are many challenges in your
    way. In some ways, mobile accessibility mirrors the concepts of web accessibility,
    though there are a few unique challenges that must be considered, including:


    +   - Small screen sizes built for interaction with universally clumsy fingers.

    +   - Expectations of support for platform features that differ between mobile
    platforms (i.e. iOS or Android).

    +   - The need to split complex experiences into workflows that may be interrupted
    by users on the go.


    These are among many others that will be discussed over the course of this chapter.


    In this chapter, mobile designers will discover how to craft inclusive, intuitive
    interfaces, while developers will learn how to implement those designs using platform-specific
    accessibility tools. Together, you’ll create mobile experiences that welcome every
    user, on every device, through every input method. By understanding the differences
    between iOS and Android platforms, optimizing touch targets, implementing alternative
    input methods, designing effective voice interfaces, and ensuring responsive layouts,
    you will gain practical strategies to make your mobile applications more inclusive.'
  merge: -1
  img_proc: true
- pgno: 196
  md: 'As mobile devices remain the primary way people engage with digital content
    – accounting for over 60% of global web traffic as of 2024, according to WebAIM
    Million Report (2024) and StatCounter Global Stats – designing with accessibility
    in mind enables you to reach a broader audience, improve user experiences, and
    build applications that stay resilient as platforms evolve.


    So, in this chapter, we will cover the following topics:


    +   - Mobile development accessibility considerations

    +   - Optimizing touch targets for various abilities

    +   - Implementing alternative input methods

    +   - Designing voice interfaces for accessibility

    +   - Ensuring responsive layouts across devices


    # Mobile development accessibility considerations


    When developing accessible mobile applications, it’s crucial to recognize the
    differences between iOS and Android platforms. While both operating systems offer
    robust accessibility frameworks, their features, conventions, and limitations
    can vary significantly. Understanding these distinctions helps ensure your applications
    provide a seamless experience for all users, regardless of the platform they’re
    using. The following section compares accessibility considerations specific to
    iOS and Android.


    # Regarding iOS vs Android


    An important thing to remember in mobile accessibility is that iOS and Android
    accessibility are as different as web and mobile accessibility. There are many
    unifying factors, but there are also many factors unique to each platform.


    Much of the differences come from the nature of the languages and ecosystems upon
    which the platforms are built. The web is built on top of a series of technologies
    and specifications created by committee, and evolves rather slowly. Meanwhile,
    Android and iOS are built by largely singular entities driven to evolve their
    platforms on a yearly basis. The faster Apple and Google evolve their respective
    platforms, the more users are driven to buy new devices.


    This rapid platform evolution represents challenges to accessibility. Users expect
    support for new platform features, but when these features are not supported,
    applications feel unwieldy.'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'Let’s take a look at the ecosystems these applications are built in, starting
    with Android:


    +   - **Operating System:** Android

    +   - **Programming Language:** Java or Kotlin

    +   - **UI Framework:** Compose or XML Layout


    And now let’s look at iOS:


    +   - **Operating System:** iOS

    +   - **Programming Language:** Swift or Objective-C

    +   - **UI Framework:** SwiftUI or Storyboard


    Note the level of control Google and Apple leverage over their respective ecosystems.
    Google works with the open source community, though still exercises a lot of power
    and final review over their contributions, while Apple owns its ecosystem in its
    entirety, including the programming language.


    Because Google and Apple have such control, a recurring theme across this chapter
    will be doing things the way the ecosystem supports them. It is important to give
    the platforms the space to be different. Without these differences, you will be
    forcing one of the platforms to behave in a way that is contrary to its supported
    features. This has a compounding effect of making your application more difficult
    to maintain, therefore falling behind on platform updates and exacerbating these
    problems.


    > When the distinction between iOS and Android solutions is important, it will
    be mentioned and discussed separately.


    # Regarding maintainability


    One of the most critical – and often overlooked – distinctions in mobile accessibility
    is the difference between web content accessed through a mobile browser and native
    mobile applications. While they may look similar on the surface, their underlying
    technologies, capabilities, and accessibility frameworks differ significantly.'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'Mobile browsers often support a subset of desktop web standards, giving the
    illusion that web accessibility practices translate directly to native apps. However,
    native applications are built using entirely different architectures, with platform-specific
    controls, compiled languages, and stricter privacy rules between components. This
    creates unique accessibility challenges that don’t arise on the web. Additionally,
    hybrid and multi-platform frameworks – like React Native, Flutter, and Xamarin
    – further blur these lines. While they offer the convenience of shared codebases,
    they also introduce complexity when aligning accessibility expectations with platform-specific
    behaviors.


    Recognizing these distinctions is just as important as understanding the differences
    between iOS and Android, and it forms the foundation for making informed, accessible
    design decisions on mobile. This leads to conversations between accessibility
    experts and developers that can end up with the developer implementing custom
    functionality where it is not needed in order to support functionality that is
    not expected.


    Forcing mobile applications to behave like their web counterparts creates problems
    for the user and causes applications to diverge from the behaviors and implementations
    that Google and Apple expect. When a new version of Android or iOS is released
    – which happens frequently – existing controls may not immediately support new
    assistive technology features introduced with the update. Accessibility experts
    should understand the intended behavior of controls within the platform’s evolving
    framework to ensure compatibility and accessibility.


    In an ever-changing ecosystem, this can be a challenge. Some ways to combat this
    are to:


    +   - Compare your application to Google or Apple applications while accepting
    that they may not conform to your expectations coming from a web application.

    +   - Thoroughly familiarize yourself with multiple platforms’ assistive technologies
    before sharing comments on your preferred testing choice.

    +   - Be open-minded in discussions with engineers, especially when they say something
    can’t be done.


    These strategies can help you navigate the complexities of mobile accessibility,
    but it’s essential to remember that the underlying architecture of mobile applications
    presents unique challenges. Unlike web development, mobile apps are built using
    compiled languages, which enforce strict privacy rules between different components
    of the application. Keeping this in mind is crucial as you approach accessibility
    improvements.'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'Mobile applications are built on compiled languages. Compiled languages have
    strict privacy expectations between various bits of implementation. Every time
    we ask developers to add custom functionality to improve accessibility, we are
    actually asking them to violate this contract. While in certain situations it
    may be possible, it will lead to maintainability issues and may in fact diverge
    from the expected behavior of the control.


    Allow the platform to function as it’s designed to, even if its behavior differs
    from what you’re accustomed to in a web ecosystem. Both iOS and Android offer
    robust, built-in accessibility support, but custom implementations that override
    default behavior can inhibit that support. Asking developers to work around perceived
    platform weaknesses often leads to applications that are harder to maintain and
    less accessible over time. When platforms eventually address those weaknesses,
    custom solutions may conflict with the new expected behavior, unintentionally
    diminishing accessibility instead of enhancing it.


    Incorporating platform conventions is essential for building accessible, maintainable
    applications. By respecting native behaviors and avoiding unnecessary customizations,
    you can ensure compatibility with evolving accessibility standards. With a solid
    foundation in place, the next step is to optimize touch targets to accommodate
    a diverse range of user abilities.


    # Optimizing touch targets for various abilities


    Mobile devices present unique accessibility challenges because users often interact
    with them while on the move, using their fingers to tap, swipe, and pinch. This
    can be particularly difficult when:


    +   - **Controls are too small:** If a control is smaller than the fingertip,
    users may struggle to tap it accurately, especially when moving or holding the
    device with one hand.

    +   - **Controls are crowded together:** When multiple controls are placed close
    to each other, it can be hard to determine which control is being activated, leading
    to errors and frustration.


    These challenges can be even more pronounced for users with mobility issues, such
    as those with limited dexterity, tremors, or other motor impairments. Designing
    controls with adequate size, spacing, and touch responsiveness is essential to
    create a more inclusive mobile experience.'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'So, how do we account for touch target size without letting interactive controls
    dominate the user interface? While not limited to mobile, WCAG 2.5.8 Target Size
    (Minimum) (https://www.w3.org/WAI/WCAG22/Understanding/target-size-minimum) addresses
    this issue across all touch interfaces – including tablets, laptops, and assistive
    technologies used by people with limited dexterity – by recommending a minimum
    target size for interactive controls. The current recommendations are a minimum
    size of 24 x 24 CSS pixels for AA conformance with a recommended AAA threshold
    of 44 x 44 CSS pixels. Let’s also look at some more helpful concepts.


    # The card pattern


    The card pattern is a design approach that organizes information into distinct,
    interactive containers or “cards.” These cards are typically large enough to be
    easily tapped or clicked, making them particularly accessible for mobile users,
    including those with motor impairments or limited dexterity.


    ![](img/3bdc9e2d41de898f8a3bcc9634b0000e_200_0.png)


    Figure 8.1: The card pattern


    By grouping related content and interactive elements within clearly defined cards,
    you can enhance usability and accessibility. These are especially effective when
    presenting lists of items, such as products, articles, or app listings. They allow
    for generous tap targets and visual separation between different pieces of content,
    reducing the risk of accidental interactions.


    For practical examples of the card pattern, visit the Google Play Store or the
    Apple App Store. Notice how apps, games, and other content are presented as distinct
    cards, each occupying enough space to be easily tapped. This design ensures clarity,
    consistency, and accessibility.'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'However, it’s important not to overload cards with too much information or
    nest multiple interactive elements in conflicting ways. For example, assigning
    an entire card to navigate to a user’s profile, while also placing a tappable
    email address or button inside it, can lead to confusion or unintentional interactions.
    To ensure a clear and accessible experience, keep each card focused, avoid overlapping
    interactive zones, and prioritize a single, predictable action per card when possible.


    So, the card pattern is one effective way to combine information and interactivity
    in a space-efficient layout. It brings key content to the forefront while maximizing
    the touchable area for interaction. While cards are especially well-suited for
    mobile, they’re not the only way to group related elements. What matters most
    is ensuring clarity, focus, and generous touch targets, regardless of the visual
    pattern you use.


    # Two-dimensional scrolling


    Two-dimensional scrolling is a design technique where users can navigate content
    both horizontally and vertically within the same interface. This pattern is commonly
    used on mobile devices to allow for efficient browsing of large amounts of content
    without overwhelming the user. For example, users can scroll vertically through
    a feed or a list and horizontally through categories or image galleries.


    The infamous carousel pattern – a form of horizontal scrolling often implemented
    as a series of swipeable cards or images – is frequently criticized in web design
    for several reasons:


    +   - **Poor accessibility**: Carousel often rely on animations or gestures that
    may be difficult for users with motor impairments or those who navigate using
    keyboards or screen readers.

    +   - **Content visibility**: Important content can be hidden off-screen, making
    it less discoverable. Many users never interact with carousel controls, leading
    to missed information.

    +   - **Overuse and misuse**: Carousels are often employed for aesthetic purposes
    without considering usability or accessibility, resulting in a poor user experience.


    However, on mobile devices, two-dimensional scrolling and carousels are essential.
    They allow users to quickly navigate large datasets or categories, particularly
    in applications like Netflix or online stores where content is organized into
    horizontal rows of cards. Without carousels, finding a specific movie or product
    would require endless vertical scrolling.'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'Two-dimensional scrolling also pairs well with the card pattern, enabling designers
    to maximize touchable areas for controls while presenting content in a visually
    organized and accessible way. However, it’s important to ensure that horizontal
    scrolling is used only for discrete content groups – not for reading or core navigation
    – to meet WCAG 2.1 Success Criterion 1.4.10 Reflow, which requires that content
    can be presented without loss of information or functionality when resized or
    zoomed.


    While two-dimensional scrolling can enhance navigation and efficiency, it’s not
    always the right choice. It can introduce cognitive overload if too many scrollable
    sections compete for attention or if users lose track of their position. Designers
    should avoid nesting multiple scrollable areas and ensure that horizontal scrolling
    is clearly indicated and easy to perform. When overused or poorly implemented,
    this pattern can hinder discoverability and frustrate users, especially those
    relying on screen readers or Switch Access. Use it thoughtfully, and always test
    it with real users.


    # Floating action buttons


    One challenge with mobile accessibility is balancing large touch targets with
    the limited screen space available for displaying content. To maximize usable
    space, developers often use fixed-location floating action buttons – interactive
    controls that appear to hover above other UI elements. This technique allows the
    content beneath to scroll independently, providing a larger, more accessible touch
    target without sacrificing information visibility.


    ![](img/3bdc9e2d41de898f8a3bcc9634b0000e_202_0.png)


    Figure 8.2: Floating action button'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'In web design, floating action buttons are often criticized for poor discoverability
    and confusing focus order. When users navigate with keyboards or assistive technologies,
    it can be difficult to determine where floating action buttons fit within the
    sequence of interactive elements. This can compromise conformance with WCAG 2.4.3
    Focus Order and 1.3.2 Meaningful Sequence, both of which require a logical and
    predictable navigation path. Additionally, floating action buttons may obscure
    important content, leading to usability and accessibility issues, especially for
    users relying on screen readers or Switch Access.


    However, in mobile design, floating action buttons are widely accepted and effective
    for several reasons:


    +   - **Platform standards:** Both iOS and Android provide established patterns
    for implementing floating action buttons. These guidelines include recommendations
    for size, placement, interaction, and accessibility. Following platform conventions
    ensures consistent user experiences.

    +   - **Simplicity of layout:** Mobile interfaces typically contain fewer interactive
    elements than web pages, reducing the likelihood of confusion in focus order.
    Additionally, developers can leverage built-in platform tools such as Android’s
    ViewGroup attributes (android:nextFocusForward, etc.) and iOS’s UIAccessibilityContainer
    protocol to manage and customize focus order in an accessible way.

    +   - **User expectation:** Many users have come to expect floating action buttons
    in mobile apps for primary actions – like composing a message or adding a new
    item – because of their widespread use. However, this familiar pattern may not
    be equally intuitive or accessible to everyone, particularly users who rely on
    screen readers, Switch Access, or keyboard navigation. When considering affordance,
    it’s important to ask: who benefits from this pattern, and who might be excluded
    by it? Designing with intention means ensuring that commonly used patterns also
    support users with diverse abilities.


    When implementing floating action buttons, consider these best practices:


    +   - **Placement:** Floating action buttons are generally placed in the bottom-right
    corner (Android) or centered at the bottom (iOS) to remain accessible while not
    obstructing critical content. This consistent placement also benefits non-sighted
    users by allowing assistive technologies – like screen readers or Switch Access
    – to reliably locate and describe the button’s function, reducing guesswork and
    supporting efficient navigation.'
  merge: -1
  img_proc: true
- pgno: 204
  md: '+   - **Accessibility considerations:** Ensure floating action buttons are
    labeled appropriately for screen readers and integrated into the focus order.
    Typically, this means placing them near the end of the navigation sequence – after
    the main content – so they don’t interrupt the user’s reading or task flow. Avoid
    dynamically repositioning their focus unless context demands it (such as in a
    modal or step-based workflow). iOS and Android both provide accessibility APIs
    to help developers manage this in a predictable, user-friendly way.

    +   - **Consistent usage:** Use floating action buttons only for high-priority
    actions, and avoid cluttering the interface with too many floating controls.


    # Extending the touchable area


    Often, an interactive control – such as a button, checkbox, or input field – is
    placed within a larger layout container, especially in lists or forms. A simple
    way to improve usability and accessibility is to extend the touchable area beyond
    the control itself to include the surrounding layout. For example, instead of
    making just the small checkbox tappable, you can also make the associated text
    label interactive, so users can tap anywhere in that row to activate the checkbox.
    This is particularly helpful for users with limited dexterity or those using one-handed
    touch gestures. Expanding the touch target in this way improves the experience
    without cluttering the interface, and it’s an easy win for accessibility.


    # Utilize workflows


    Designers often struggle with limited screen space because they attempt to fit
    too much content or functionality into a single screen. A better approach is to
    break down the user experience into manageable workflows – smaller, focused interactions
    that guide users through a sequence of steps rather than overwhelming them with
    a cluttered interface.


    Consider a mobile banking app that allows users to:


    +   - Check their account balances

    +   - Transfer money between accounts

    +   - Pay bills

    +   - Deposit checks


    If all of these tasks were presented on a single screen, the result would be a
    confusing, crowded interface with tiny touch targets and poor usability. Instead,
    workflows can be broken down into separate, streamlined screens – in this case,
    four – each focusing on one task at a time:'
  merge: -1
  img_proc: true
- pgno: 205
  md: '+   1. **Home screen:** Shows an overview of accounts with options to navigate
    to specific tasks.

    +   2. **Transfers workflow:** Guides the user through selecting accounts, entering
    an amount, and confirming the transfer.

    +   3. **Bill payment workflow:** Breaks down the process into choosing a payee,
    entering a payment amount, and setting a schedule.

    +   4. **Check deposit workflow:** Utilizes step-by-step guidance for photographing
    a check, confirming the amount, and submitting the deposit.


    By breaking down complex tasks into dedicated workflows, you can improve usability,
    accessibility, and discoverability. Users are less likely to be overwhelmed or
    make errors, and each screen can be optimized with larger, more accessible touch
    targets.


    While designing for touch accessibility is crucial, it’s only one piece of the
    puzzle. To ensure your application is truly inclusive, it’s essential to consider
    users who interact with their devices through alternative input methods, such
    as hardware keyboards, voice commands, or assistive technologies like Switch Control.
    But beyond input methods, thoughtful workflow design also benefits screen reader
    users, people with cognitive disabilities, and anyone who might feel overwhelmed
    by dense or complex interfaces. Supporting diverse interaction patterns and breaking
    down tasks into focused steps helps make your app more usable, discoverable, and
    welcoming for everyone. Let’s explore how to design for these varied needs.


    # Implementing alternative input methods


    Did you know that you can interact with an Android phone with a mouse? Or that
    there are users that use only a keyboard? You can even plug in a joystick and
    turn on an assistive technology like Switch Control or Switch Access!


    Fortunately, when it comes to testing, you can generally narrow your efforts down
    to two sets of technologies:


    +   1. Input technologies that rely on textual information from the accessibility
    layer (i.e. VoiceOver on iOS or TalkBack on Android)

    +   2. Input methods that rely on detecting how it is expected to interact with
    a control (i.e. keyboard or Switch Access)


    Supporting all of these input methods can be challenging, particularly when building
    custom controls. You may not always have access to the APIs needed to replicate
    certain behaviors, and even when APIs exist, they’re often incomplete or difficult
    to implement consistently.'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'Both iOS and Android provide robust accessibility layers – like VoiceOver and
    TalkBack – that interact well with built-in components. These platforms also support
    external input devices, such as Bluetooth keyboards, switches, and adaptive controllers.
    Assistive technologies like Switch Control (iOS) and Switch Access (Android) can
    bridge the gap between software and hardware, allowing users to interact with
    key functionality via scanning interfaces or external switches.


    However, custom controls that don’t inherit from platform-native components may
    break this compatibility, leading to frustrating or inaccessible experiences.
    Whenever possible, rely on built-in features and extend from native components
    to ensure full support across the diverse ecosystem of inputs.


    # A simple design rule: platform controls or custom solutions


    To create accessible, multi-input content, it’s essential to follow a straightforward
    design rule:


    +   - Use native platform controls whenever possible: Rely on the built-in buttons,
    sliders, text fields, and other UI elements provided by iOS and Android. You can
    use them as is, combine them to create more complex components, or build on top
    of them while keeping their original behavior intact. This helps ensure your app
    works smoothly with assistive technologies like screen readers and Switch Access.

    +   - If custom controls are necessary, ensure they interact with assistive technologies
    and input devices in a way that aligns with platform expectations.


    The idea is to leverage built-in platform controls (like buttons, sliders, or
    text inputs) or extend them using the platform’s own accessibility frameworks.
    When you use native controls or build upon them, accessibility features – such
    as keyboard support, screen reader compatibility, and touch interactions – are
    handled by the operating system.


    When you deviate from using platform-native controls and rely on custom implementations,
    such as custom gesture recognizers, you risk breaking compatibility with assistive
    technologies. These custom gestures may not be detectable by screen readers, keyboards,
    or other input devices, resulting in a poor experience for users who rely on them.


    Developers must then put in significant effort to replicate accessibility behaviors
    that the operating system would otherwise provide automatically. This can lead
    to inconsistencies and decreased accessibility over time, especially as platforms
    evolve.'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'The Web Content Accessibility Guidelines (WCAG) recognize that some applications
    may need custom interactions. For example:


    +   - Standard apps (e.g., banking app): Should adhere to native controls as much
    as possible to ensure accessibility across all input modalities.

    +   - Games or creative apps: Often require custom gestures and interactions that
    aren’t covered by typical platform controls. Accessibility may still be provided,
    but custom solutions are expected.


    Now, in order to successfully support all of the different ways users can interact
    with mobile operating systems, you must stick to the things the ecosystem is capable
    of. This can be different between operating systems. Let’s take a look at both
    Android and iOS.


    # Android keyboard support


    Unlike iOS, Android keyboards interact with the operating system more like traditional
    desktop keyboards, complete with manageable focus navigation and tabbing behavior.
    This traces back to Android’s early days, when devices included physical trackballs
    and arrow keys. Trackball navigation, keyboard support, and joystick-style inputs
    were all part of the original design thinking, and those foundations still influence
    Android’s accessibility support today.


    For example, consider a simple login screen with two text fields and a button:
    on Android, a connected keyboard (via USB-C or Bluetooth) allows users to navigate
    between fields using the Tab key and activate the button with Enter – behaviors
    supported natively by the operating system. On iOS, a Bluetooth or Lightning-connected
    keyboard works differently: keyboard navigation requires users to enable an assistive
    technology like Full Keyboard Access, Voice Control, or Switch Control to move
    between elements. Even then, developers must ensure focusable elements are properly
    exposed using accessibility APIs to make this navigation reliable.


    Many applications benefit from solid keyboard support out of the box because both
    iOS and Android determine default focus order using depth-first tree traversal.
    This means the system examines the user interface hierarchy top-to-bottom and
    left-to-right (or right-to-left in certain locales), based on how elements are
    structured in the code. When developers use native components and maintain a logical
    view hierarchy, focus order typically “just works.” But for custom interfaces
    or less common navigation needs, developers may need to intervene and define a
    more intuitive focus path.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# iOS keyboard support


    Supporting hardware keyboards is different between iOS and Android, as they each
    treat keyboards fundamentally differently. For iOS hardware, the keyboard accepts
    input and translates it to similar signals as the software keyboard.


    What iOS does differently is that it doesn’t support full keyboard focus navigation
    in the same way as Android by default. You can connect and use an external keyboard
    – via Bluetooth or Lightning – with an iPhone or iPad to type and perform some
    basic actions without enabling any assistive technologies. However, to navigate
    interface elements more comprehensively using arrow keys or tab-style navigation,
    users must enable an assistive technology like Full Keyboard Access, Switch Control,
    or Voice Control. Full Keyboard Access, in particular, unlocks more extensive
    navigation and interaction patterns, but it also changes how the onscreen keyboard
    behaves – for instance, disabling it when an external keyboard is connected.


    > You only need to test with one of Switch Control, Voice Control, or Full Keyboard
    Access to help cover WCAG conformance from a technical standpoint, but it’s important
    to understand that these tools do not behave identically. For example, passing
    tests with Full Keyboard Access does not guarantee a seamless experience for Voice
    Control users, since each relies on different interaction models and APIs. While
    it may be impractical to test every modality in every situation, being aware of
    their differences – and the potential for missed issues – can help you make more
    informed design decisions and uncover usability gaps earlier.


    While iOS handles keyboard navigation differently, the concept of focus order
    is a critical consideration for both iOS and Android. Whether users are navigating
    with a keyboard, screen reader, or other assistive technology, ensuring a logical
    and intuitive focus order is essential for accessibility. Let’s take a closer
    look at how mobile operating systems determine and manage focus order.


    # Understanding focus order in mobile accessibility


    When users navigate an application using assistive technologies like screen readers
    or keyboards, the focus order determines the sequence in which interactive elements
    are accessed. Ensuring a logical focus order is critical for accessibility.


    Mobile operating systems calculate focus order by performing a depth-first tree
    traversal of the interface hierarchy. This means the system starts at the top-most
    parent control and'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'examines each child control before moving on to the next sibling. The order
    in which items are encountered during this traversal defines the default focus
    order.


    Unlike web-based screen readers – or VoiceOver on macOS, which may treat nested
    controls as a single grouped element – mobile operating systems like iOS and Android
    typically treat nested controls as individual, separate elements. For example,
    if you have a button inside a card component, each element would receive focus
    independently on mobile, allowing more granular navigation but also requiring
    a well-structured focus order to prevent confusion:


    +   - **Web context (VoiceOver on macOS):** May treat the card as a single grouped
    control depending on how the HTML and ARIA roles are implemented. If the container
    uses appropriate landmarks or roles and the button is properly labeled, VoiceOver
    may navigate to the button independently, but without a clear structure, it might
    only be described as part of the group.

    +   - **Mobile context:** Both the card and the button are treated as distinct
    elements, with each receiving focus independently.


    This difference can be beneficial for accessibility, but only if the focus order
    is planned correctly. A poorly defined focus order can lead to confusing and frustrating
    experiences for users who rely on assistive technologies.


    As an engineer, the things you want to be concerned about are:


    +   - That your view hierarchy is well structured and laid out in a sensible manner
    (i.e. avoid using absolute layouts and repositioning items).

    +   - That the controls users can interact with are detected as actionable.


    While the default traversal works well for many applications, thoughtful design
    and a well-structured UI hierarchy can often eliminate the need for manual customization.
    In cases where custom focus order is necessary, developers should ensure it supports
    a logical, intuitive experience for all users. Here are some common techniques
    for managing focus order effectively:


    +   - **Explicitly setting focus order using APIs:** When the default focus traversal
    doesn’t align with the intended user experience, developers can use platform-specific
    APIs to define the desired focus path. Android provides methods like focusNext(),
    focusPrevious(), focusUp(), focusDown(), focusLeft(), and focusRight() to explicitly
    guide the focus movement. iOS offers similar control through the UIAccessibility
    framework.'
  merge: -1
  img_proc: true
- pgno: 210
  md: '+   - **Defining accessibility containers (iOS)**: On iOS, developers can use
    the `accessibilityContainer` property to group related elements. This allows them
    to control how VoiceOver navigates through complex UI hierarchies, ensuring users
    encounter content in a logical sequence.

    +   - **Setting accessibility focus order (Android)**: Android’s View hierarchy
    allows developers to specify focusable elements and their traversal order using
    attributes like `android:nextFocusForward`, `android:nextFocusLeft`, `android:nextFocusRight`,
    and `android:nextFocusUp`. This is particularly useful when building custom controls
    or modifying default navigation patterns.

    +   - **Programmatically controlling focus**: Developers can programmatically
    request focus for a particular element using functions like `requestFocus()` (Android)
    or `becomeFirstResponder()` (iOS). This technique is helpful when guiding users
    through specific workflows or highlighting important content, but should be used
    sparingly.

    +   - **Leveraging focus management libraries**: In complex applications, using
    third-party libraries that offer focus management utilities can simplify the process.
    These tools often provide higher-level abstractions to control focus order, making
    it easier to ensure accessibility consistency across an application.

    +   - **Testing and refining focus order**: Testing focus order with various assistive
    technologies (e.g., screen readers, keyboards, Switch Control) is essential to
    confirm that navigation is logical and intuitive. Refining the focus order based
    on user feedback can significantly enhance the accessibility of your application.


    # Usability for all users


    As we have covered throughout the book, sometimes doing things for accessibility
    is just about doing things right. There are a few things we can consider that
    benefit all users, while particularly saving time for those users of alternate
    input devices.


    Both platforms offer a feature that’s often overlooked: the ability to customize
    the text displayed on the submit button. For example, on mobile devices, the button
    that usually says “Enter” or “Go” can be changed to something more specific, like
    “Search” or “Send,” depending on the desired action. When a user is done filling
    out a Text field, there are any number of sensible things to do. Move to the next
    field, submit the form, “go” to a webpage, etc. Think about what users would expect
    to happen when they hit the Enter button and provide them with that contextual
    hint.'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'Also, as Android users, the back action is really important. Each Android phone
    supports its own way of interacting with the back action – on some devices, it’s
    a dedicated hardware button; on others, it’s a software button with a reserved
    place (unless it’s in the context of a fullscreen app); or it can even be a gesture
    performed from the left edge of the screen. Regardless, consideration for what
    the back action should do in every context is important. Often, the default behavior
    will be good, but just as often you will want to customize it.


    Good behavior typically means the back action matches user expectations, like
    navigating to the previous screen or exiting a modal. Bad behavior might involve
    unintentionally exiting an app, losing unsaved data, or breaking a user’s flow
    by sending them too far back in the navigation stack.


    Customizing the back action could include:


    +   - Preventing accidental exits by prompting users to confirm before leaving
    a critical flow (like discarding unsaved changes in a form).

    +   - Redirecting users to a specific screen instead of the previous one, which
    can be helpful for guided workflows or when maintaining a consistent navigation
    structure.

    +   - Triggering specific actions within an app, such as closing a menu or collapsing
    UI elements instead of exiting entirely.


    Tailoring the back action ensures that users have a seamless and intuitive experience,
    especially when the default behavior doesn’t fit your app’s design or user flow.


    Designing for diverse input methods – whether touch, keyboard, or alternative
    controllers – ensures accessibility for a wide range of users. However, not all
    interactions rely on physical input. Voice interfaces offer another powerful way
    for users to navigate and control applications, providing flexibility and accessibility
    for those who may have difficulty with traditional input methods. Let’s explore
    how to design voice interfaces that are both effective and inclusive.


    # Designing voice interfaces for accessibility


    Apple and Android tend to mirror each other’s operating system functionality.
    When a new feature appears in one, you can be sure that the other is aware and,
    not long later, it will often show up in its own way in the other. The same logic
    applies to the accessibility space.'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'For example, both ecosystems support the ability for users to turn on a voice-activated
    assistive technology. In Android, it’s called Voice Access, and in iOS, it’s called
    Voice Control. Voice Access and Voice Control work in fundamentally the same way.
    When activated, the user can interact with their device through structured voice
    commands, such as:


    +   - “Tap {Control Identifier}”: This command allows users to activate a specific
    interactive element by referencing its accessible label (e.g., “Tap Submit” or
    “Tap Add to Cart”). For this to work reliably, the control must have a clear,
    unique, and descriptive accessibilityLabel (iOS) or contentDescription (Android).
    Avoid using vague or duplicate labels, as this can confuse voice interaction systems
    and lead to failed actions or incorrect selections.

    +   - “Show Names”: This command prompts the voice control system to display the
    accessible names of all interactive elements onscreen. It allows users to see
    which elements are labeled and available for direct interaction using voice commands
    (e.g., “Tap Send”). If an element doesn’t have an accessible name, it won’t appear,
    which can lead to critical actions being missed. To support this feature, ensure
    that all actionable elements have clear, concise accessibilityLabel (iOS) or contentDescription
    (Android) values.

    +   - “Show Numbers”: This command overlays numbers on all recognized interactive
    elements, allowing users to interact by saying “Tap 5,” for example. It’s especially
    useful when elements don’t have distinct or visible labels. However, unrecognized
    or improperly coded elements may not be numbered, creating barriers. Ensure that
    every interactive control is exposed to the accessibility layer so it can be detected
    and numbered when needed.

    +   - “Scroll {Up/Down}”: This command enables users to navigate vertically through
    scrollable content, such as lists or feeds. It’s especially important for interfaces
    with dynamic content or long pages. Ensure that scrollable areas are properly
    marked in the accessibility tree so assistive technologies can detect them. Poorly
    coded containers or hidden overflow can prevent this command from working as expected.

    +   - “Increment/Decrement {Control Identifier}”: This command adjusts values
    for controls such as steppers, sliders, or number fields (e.g., “Increment Quantity”
    or “Decrement Volume”). For voice interaction to succeed, the control must be
    properly labeled and implemented using platform-native components or accessible
    custom controls that expose their roles and actions. Without this, users may be
    unable to change values via voice, limiting accessibility for those with motor
    impairments.'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'Designing content that works seamlessly with voice-activated assistive technologies
    involves ensuring your interface is accessible and responsive to voice commands.
    This is achieved by:


    +   - **Using semantic HTML:** Properly structured HTML with clear headings, labels,
    buttons, and links makes it easier for voice technologies to interpret content
    accurately.

    +   - **Providing descriptive labels and alt text:** Ensure all interactive elements
    (like buttons and form fields) have descriptive labels that exactly match – or
    at least include – the visible text label if present. This alignment helps users
    issue accurate voice commands (e.g., “Tap Submit”) and ensures that assistive
    technologies can correctly associate the spoken command with the intended element.
    For images, use descriptive alt text or mark them as decorative to ensure accessibility
    for screen readers and other voice-activated tools.

    +   - **Ensuring consistent navigation:** Predictable and clear navigation structures
    help voice commands work smoothly. Users should be able to reach every part of
    your interface using simple, consistent voice commands.

    +   - **Testing with voice-activated tools:** Regularly testing your design with
    popular tools like Google Assistant, Siri, Alexa, or Dragon NaturallySpeaking
    ensures compatibility and usability.

    +   - **Providing keyboard accessibility:** Since many voice-activated tools interact
    with content by simulating keyboard commands, ensuring full keyboard accessibility
    is essential.


    While users can sometimes work around poorly designed content, ensuring your site
    follows these principles makes their experience faster, smoother, and more intuitive.


    # Identify controls


    One consistent need of both voice-activated assistive technologies is to identify
    controls that users would like to interact with. This works differently between
    the two ecosystems:


    +   - **iOS:** Voice Control expects very structured accurate commands with labels
    that identify the control precisely.

    +   - **Android:** Voice Access accepts less precise commands and will attempt
    to guess which control is intended when a precise label isn’t available.'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'Because of this, iOS has stricter expectations regarding control labeling.
    However, it also provides developers with tools to manage this, such as the ability
    to separate accessibilityLabel (used to identify the control) from accessibilityValue
    (used to convey its current state or content). For example, a button to apply
    a discount code might have an accessibilityLabel of “Apply Discount” and an accessibilityValue
    of “Code SAVE20 entered.” This allows voice control users to say “Tap Apply Discount”
    while still getting feedback about the current code without confusion. Be sure
    to keep the accessibilityLabel concise and action-focused to serve as a reliable
    identifier.


    # Avoid nesting controls


    Both Voice Access and Voice Control activate elements by sending a virtual tap
    to the center of the control. This generally works well, however, in certain circumstances,
    the center of the control isn’t actually the correct target. If another control
    is nested on top of the control being activated and happens to be located at the
    central point, you can make it impossible for the user to activate the encompassing
    control.


    An alternative to nesting interactive targets is utilizing custom actions. By
    naming actions within a component, you can avoid having several interactive targets
    while allowing users to use grammar like “Show Actions for {Control Identifier}.”
    This allows you to have several actions associated with a control while avoiding
    the nested controls problem.


    In addition to custom actions, other effective methods for designing accessible
    voice interfaces include:


    +   - **Grouping related controls:** Instead of treating each control as a separate
    target, group related items under a single, clearly identified control. This reduces
    the number of interactions required and simplifies navigation.

    +   - **Providing contextual feedback:** Ensure that users receive immediate and
    relevant feedback when issuing commands. This helps confirm their actions and
    guides them if they need to try again.

    +   - **Ensuring consistent terminology:** Use consistent phrasing and naming
    conventions throughout your interface. This minimizes cognitive load and makes
    interactions more intuitive.

    +   - **Supporting error recovery:** Provide clear instructions or hints when
    an unrecognized command is issued. Allowing users to ask for available actions
    (e.g., “What can I do here?”) can significantly improve the experience.'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'These methods help create a smoother, more intuitive experience for users who
    rely on voice interaction.


    While designing effective voice interfaces is essential, accessibility also depends
    on how well your application adapts to different devices and screen sizes. Mobile
    users engage with apps on phones, tablets, watches, and other devices, each with
    unique display characteristics and interaction patterns. To provide a consistent
    and accessible experience, it’s crucial to ensure your layouts are responsive
    across all devices.


    # Ensuring responsive layouts across devices


    One of the biggest challenges mobile developers face is designing for the sheer
    variety of devices in use, ranging from compact phones to tablets, watches, and
    linked external displays. Compounding this is the need to support dynamic display
    scaling and user-adjustable text sizes, both of which are critical for accessibility.


    Supporting a broad range of devices isn’t just a technical requirement – it’s
    key to creating inclusive experiences. For example, WCAG Success Criterion 1.4.10
    (Reflow) requires that content can be viewed without loss of information or functionality
    when resized up to 400%, which corresponds to a 320px-wide viewport in portrait
    orientation. Similarly, WCAG SC 1.4.4 (Resize Text) requires that users can resize
    text up to 200% without assistive technology and without breaking layout or usability.


    According to Test Sigma, the most common mobile screen resolution in 2023 was
    360×800 (11.02% market share), followed by 390×844 (7.93%) and 414×896 (5.56%).
    But successful design isn’t about hitting specific resolutions – it’s about supporting
    flexible, responsive layouts that adapt gracefully to any screen size or zoom
    level.


    In spite of this, users expect support across all their devices, and you have
    little control over which devices your application will run on. This complexity
    is amplified on Android, where manufacturers like Samsung often ship their own
    browsers and default screen readers, potentially affecting accessibility behaviors.
    On Apple devices, the distinctions between iOS and iPadOS – while fewer – can
    still have meaningful impacts on assistive technologies and layout behavior.'
  merge: -1
  img_proc: true
- pgno: 216
