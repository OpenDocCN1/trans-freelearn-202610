- pgno: 54
  md: 'In this chapter, we will cover the following topics:


    +   - Understanding disabilities: a spectrum of experience

    +   - Categorizing types of disabilities in digital contexts

    +   - Examining the role of assistive technologies

    +   - Mapping user needs to design solutions

    +   - Centering lived experience: designing with, not for


    # Understanding disabilities: a spectrum of experiences


    Like so many other identities within the human experience, disability exists on
    a spectrum:


    +   - Situational disabilities are tied to context, such as trying to read your
    phone in glaring sunlight or holding a baby while navigating a tablet with one
    hand

    +   - Temporary disabilities result from short-term conditions, such as the recovery
    period from an injury or surgery

    +   - Chronic conditions, such as arthritis or migraines, fluctuate, creating
    good days and bad

    +   - Permanent disabilities, such as blindness or paralysis, are ongoing but
    just as varied in how they shape people’s interactions


    Beyond definitions, it’s important to recognize how fluid and often invisible
    these experiences can be. A person may move between different categories over
    the course of their life... or even throughout a single day! Pain flare-ups, fatigue,
    changes in mobility, or sensory overwhelm can all shift how a person navigates
    the digital world from moment to moment.


    For example, a student with fluctuating vision due to a chronic condition might
    need high-contrast settings and enlarged text to complete their homework on bad
    days but have no issue on good ones. If those options weren’t available, how would
    they stay engaged with their studies?


    Or, consider a new parent who temporarily loses hearing clarity due to sleep deprivation
    and environmental noise. At that moment, real-time captions on a video call might
    be an essential feature. These small accommodations ripple outward and benefit
    a wide audience.


    When we understand that everyone faces barriers at some point in their lives,
    accessibility becomes universal – wheelchair ramps aid delivery workers and parents
    with strollers, while closed captions support diverse needs from noisy environments
    to language learners.'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'This is the foundational idea behind inclusive design: that accessibility is
    not an exception, but an expectation. By embedding flexibility and choice into
    our digital environments, we empower all users – not only those who are disabled
    by medical definition.


    Importantly, disability is not solely medical; it’s also social. It arises from
    the mismatch between someone’s body or mind and the environment or systems that
    they navigate. A person may not be disabled by their condition alone, but by a
    website that does not support keyboard navigation, or an app that relies solely
    on sound without alternative text. That perspective shifts the responsibility:
    from asking individuals to adapt to inaccessible systems to asking systems to
    meet the needs of real people.


    As we move forward, it’s helpful to group disabilities into broader categories
    to understand how they impact digital interaction. After all, instead of framing
    it as addressing the needs of a few, we open up digital opportunities when we
    design for all. The next section explores these categories – visual, auditory,
    motor, and cognitive – and introduces design strategies that support each one.


    # Categorizing types of disabilities in digital contexts


    When designing digital products, it’s crucial to understand the diverse ways people
    interact with them. Disabilities are not isolated conditions – they are part of
    the human experience and influence how individuals perceive, process, and engage
    with technology. Due to this, it is important to note that “disabled” is an identity
    group that can intersect with any other identity. You can be Muslim and disabled,
    queer and disabled, Gen Z and disabled, and so on. The list goes on and on.


    Under the disability umbrella, the four main categories of disabilities – visual,
    auditory, motor, and cognitive – encompass a wide range of conditions and present
    unique challenges. Addressing these challenges requires thoughtful design that
    considers the full spectrum of human ability.


    # Visual disabilities: navigating without sight


    For users who are blind or have low vision, navigating a digital interface involves
    translating visual information into other forms, such as audio or tactile feedback.
    But there can be problems. A screen reader user, for example, depends on properly
    structured code to navigate a web page. If the site lacks semantic headings or
    descriptive alt text for images, it can feel like you’re at the carnival navigating
    through a mirror maze.'
  merge: -1
  img_proc: true
