- pgno: 118
  md: 'The stories shared so far aren’t side notes; they’re the work. They show what
    it looks like to stay with discomfort, to read beyond what’s said, and to let
    insight reshape the systems we operate in. If we only collect data but don’t let
    it change us, we’re not practicing inclusion, we’re performing it. Designing for
    both existing and future users requires flexibility. Designing for now *and* what’s
    next.


    # Insights as relationships, not output


    Creating feedback loops where research findings are shared with participants builds
    continuity and long-term engagement. We might experience this when a product designed
    with blind users in mind might technically pass a WCAG compliance check, but if
    real users struggle with its structure or interaction model, it’s still inaccessible.


    When someone tells us where a system failed them, that isn’t feedback, it’s a
    beacon. It’s a signal that says, “*This didn’t work for me, and I’m still here,
    trying to help you do better.*” What we do next matters.


    Without care, even inclusive products can replicate harm. I’ve seen tools pass
    every compliance check, yet still feel unusable. I’ve watched teams celebrate
    optionality, five ways to do a task, but miss the point entirely because none
    of them truly meet people where they are. That’s not flexibility. That’s noise.
    It’s the difference between adding features and building alignment.


    But that kind of connection doesn’t happen by chance. It requires a system that
    carries insight across research, design, and implementation, without losing its
    shape or soul. That’s where I bring in a framework I’ve used across both public
    and private sector work. I call it *roots, routes, refuge, and realities:*


    +   - **Roots:** Keep us grounded in community, in history, in where this work
    comes from, and who it’s meant to serve

    +   - **Routes:** Map how insight travels through sprint planning, design audits,
    and decision logs so it doesn’t disappear in translation

    +   - **Refuge:** Creates space for care, so that researchers, participants, and
    designers aren’t stretched to breaking

    +   - **Realities:** Anchor us in what’s true, not what’s convenient, or clean,
    but what’s actually lived


    I’ve used this model to compost insight—not to discard it, but to let it break
    down, be absorbed, and feed the next season of work. This happens when teams risk
    treating inclusive insight as transactional, or when the most important feedback
    is too inconvenient to act on quickly. This isn’t a fix-all, but it’s a rhythm.'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'Remember, when someone shares how a system failed them, treat it as a turning
    point not just a data point. How you hold that feedback will shape whether they
    trust you, or anyone else, with it again.


    # Designing from disability, not for it


    Inclusive design doesn’t begin with retrofitting fixes onto broken systems; it
    starts by centering disabled people from the outset. Voice input, for example,
    was originally built for accessibility, and now powers mainstream tools such as
    Siri and Alexa. Designing from disability often leads to innovations that benefit
    everyone.


    One approach I’ve found useful is building archetypes and mindsets rooted in lived
    experience – tools that reflect how people actually navigate complexity, not just
    how we imagine they do. These frameworks feed design patterns, usability heuristics,
    and decisions that respond to intersectional needs.


    Insight is only powerful if it travels. What we’ve heard must shape decisions,
    influence investment, and challenge the defaults that have long excluded disabled
    users.


    Typically, research identifies the barriers, design starts to build solutions,
    and the product moves forward with delivery, but those threads don’t always weave
    into something whole. Misalignment happens. And when it does, inclusion becomes
    performative instead of transformative.


    To bridge that gap, we need to work with new approaches – all of us. Researchers
    need to structure observations in ways that are actionable and visible across
    teams. Designers need to bring accessibility upstream, embedding it in systems,
    not just screens. Product teams need to make space in their processes, in their
    priorities, for accessibility to be part of the core build, not the backlog.


    That means doing the following:


    +   - Integrate accessibility into design systems, pattern libraries, and components
    from the start, so it’s not a retrofit every time something new ships

    +   - Ensure research insights inform product roadmaps, success metrics, and sprint
    planning


    But this isn’t work we do alone. Inclusive research is a collective practice –
    intentional, ongoing, and relational. It requires collaboration across teams:
    researchers, designers, engineers, product leads, and the communities we’re designing
    with.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# Supporting designers with actionable findings


    Designers work where research meets execution. To support them, we need tools
    that translate intention into tangible action. Many receive research themes and
    patterns too late in the process, making it difficult to implement foundational
    accessibility improvements. Others lack clear accessibility and usability guidelines
    that translate research into tangible design decisions. And even when they build
    inclusively, they rarely get validation that their designs work in real-world
    use cases with diverse users.


    To better support designers in translating research into action, product teams
    can equip them with practical, evidence-based tools that bridge intention and
    execution:


    +   - Inclusive design guidelines tailored to a product’s needs

    +   - Design system recommendations that translate participant learnings into
    reusable patterns

    +   - Experience journey maps that reflect real user behaviors, not just demographics

    +   - Accessibility user stories and acceptance criteria to stress-test designs
    before they ship


    For example, it’s not enough to say, “Users with mobility impairments struggle
    with small touch targets.” That may be true, but it doesn’t give teams what they
    need to design differently. Instead, researchers can make it real by recommending
    minimum tappable sizes, sharing annotated mockups that show accessible interactions
    in context, or offering prototypes tested with real tools, switch controls, voice
    navigation, and adaptive inputs.


    This kind of specificity empowers. It invites the team into the solution. It helps
    designers move from awareness to action, giving them the clarity and confidence
    to build in ways that extend better utility to more people. Designers are among
    our closest collaborators in this process. Research doesn’t just inform design,
    it helps to reshape the underlying defaults of the product system. Inclusive intent
    is operationalized in how we work together. It’s how we move from asking for better
    to building it, and is how inclusion takes root.'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# Summary


    This chapter followed inclusive research from intention to implementation, through
    recruitment grounded in care, methods shaped by accessibility, analysis that honors
    complexity, and design that responds to what was truly heard.


    It is important to remember that how we listen shapes what we build. When we move
    from extractive habits to inclusive practices, we uncover the friction that most
    needs our attention, the kind that can’t be seen from the center. The work won’t
    always be perfect or complete. What matters is that we keep showing up, again
    and again, with the willingness to adapt, even within constraints.


    In the next chapter, we will move from research to interface, embedding accessibility
    into layout, contrast, navigation, and interaction, so inclusive intent shows
    up in every pixel, not just in principle.'
  merge: -1
  img_proc: true
