- pgno: 111
  md: 'When we collect data for underinvested communities, we are not just gathering
    information; we are gathering collective experiences that have been shaped by
    their complex identities. These intersecting identities shape their experiences
    in ways that can’t be neatly categorized into one demographic box. Yet, too often,
    research outputs reduce these experiences to snapshots by pressing them into a
    neat shape without nuance.


    # Neurodivergence as method: how lived experience rewrites the rules


    I used to think research had to look a certain way: poised, prepared, and perfectly
    structured. But that version of research often left my body behind. As someone
    with ADHD, my brain doesn’t move linearly. It operates a bit like a constellation,
    zooming in and out at will. It hyperfocuses on patterns others miss and then collapses
    under too much sensory input. That used to feel like a liability. Now, it’s the
    compass I trust most.


    It’s why I build in long pauses when I facilitate. It’s why I offer asynchronous
    options. I send questions in advance, not just for participants, but because I
    know how much it helps me to engage on my own terms. I’ve unlearned the idea that
    good research is fast, tidy, or neutral. The research that lives with me the longest,
    the kind that stays in my bones, is the kind that made space for slowness, for
    overwhelm, for disorientation, and still kept listening.


    There’s a moment after research where the pace tends to pick up. Synthesis. Reporting.
    Action. But if we rush here, we miss what actually matters: how we hold what people
    gave us.


    This part, the interpretation, isn’t just about themes or codes. It’s about meaning.
    And meaning isn’t clean. It’s multifaceted. It contradicts itself. It comes with
    disruption, with hesitation, and with emotional weight that doesn’t always show
    up in transcripts.


    Thematic analysis, in many research spaces, becomes a process of compressing,
    of tidying up what was messy so that it “makes sense” to someone else. But in
    inclusive research, we can’t afford to smooth everything down. We need to leave
    room for contradiction, for multiple truths, for the stuff that doesn’t fit easily
    into a sticky note on a wall.


    Especially when we’re listening to disabled folks or people navigating layered
    identities, what they’ve shared didn’t come cheap. It’s shaped by years of friction,
    adaptation, and being misunderstood. So when we analyze that data, we have to
    ask: Are we making meaning, or are we erasing it?


    We know the trade-offs: limited time, tight budgets, institutional barriers. Not
    every project allows for sweeping change. But every project allows something.
    And those somethings add up.'
