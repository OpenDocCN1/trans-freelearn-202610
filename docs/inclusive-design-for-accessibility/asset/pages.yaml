- pgno: 107
  md: '+   - Create a “trust prompt” in your screener or intro email. Ask: “What do
    you need to feel comfortable participating?”

    +   - Budget $50 for mutual aid. Buy someone a transit pass, a meal, or a sitter
    to make participation possible.

    +   - Share back findings. A short thank-you email and a bullet list of what you
    learned closes the loop and builds trust.

    +   - Adapt consent as a conversation. Even a 30-second verbal check-in before
    you start can feel different than a formal waiver.


    Plus, work with what you have:


    +   - Reallocate 5-10% of your existing time. Use it to improve onboarding, feedback
    loops, or protocol accessibility.

    +   - Look at existing tools. Can you build inclusion into the tools or processes
    already in use (e.g., Miro boards with alt text)?

    +   - Invite a community partner to review your plan. One quick async pass from
    a trusted voice can reframe assumptions.


    When you can’t do everything, you have to ask yourself what is the minimum change
    you can make to reduce exclusion in the context that you are in. Even a single
    choice can build cumulative trust. You don’t need perfect conditions to move in
    the right direction.


    # Providing flexible communication methods


    Not everyone can show up on cue. People living with chronic illness, neurodivergence,
    disability, or just the weight of life, don’t always move in straight lines. Energy
    comes and goes. Focus fades and returns. Pain flares. Caregiving responsibilities
    shift. There’s no tidy schedule for that.


    And yet, research sessions are often built like little performances: tight time
    blocks, fixed formats, unspoken pressure to stay on, stay coherent, and stay useful.
    Yes, time, capacity, and budget are real constraints. But so are the costs of
    exclusion, poor data, misaligned solutions, or entire communities left out. More
    inclusive practices don’t always cost more, sometimes they just require us to
    notice what’s possible.


    An inclusive approach starts by letting go of that rigidity. Let people reschedule,
    without guilt. Break longer sessions into smaller pieces. Make it okay to slow
    down and come back later, to choose rest over pushing through. Also, remember
    that people don’t always engage in the ways we expect, and that’s not a problem.
    That’s the point.'
