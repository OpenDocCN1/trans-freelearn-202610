- pgno: 269
  md: '# 11


    # Tools and Techniques for Accessibility Evaluation and Prioritization


    By Kai Wong, CPACC, CHES®


    Accessibility is about creating digital experiences that work for everyone. Even
    if a design looks accessible, many accessibility issues live under the hood –
    within the code.


    Accessibility testing bridges the gap between design intent and actual user experience.
    It is an important part of quality assurance (QA). Just like with any other quality
    check, evaluating product accessibility involves testing it.


    > The Web Content Accessibility Guidelines (WCAG) is a widely accepted technical
    standard that can guide digital accessibility testing. You can find the latest
    version of the guidelines on the World Wide Web Consortium (W3C) website (www.w3.org).


    This chapter provides an overview of digital accessibility testing tools and techniques,
    focusing on web and mobile app accessibility testing, its challenges, and common
    issues to look out for. You’ll learn how to combine automated and manual testing
    methods, prioritize what to fix, and bring accessibility into development workflows.
    The goal? To help you and your team test smarter and build more inclusive products.'
  merge: -1
  img_proc: true
- pgno: 270
  md: 'In this chapter, we’re going to cover the following main topics:


    +   - Selecting appropriate automated testing tools

    +   - Performing effective manual accessibility audits

    +   - Interpreting and prioritizing accessibility test results

    +   - Integrating accessibility testing into development workflows


    # Selecting appropriate automated testing tools


    Who doesn’t love a good shortcut? I know I do, so let’s talk about automated testing
    tools. Using automated tools is an easy, quick way to do accessibility checks,
    popping out results faster than toasting bread. In seconds, they can find accessibility
    issues such as missing alternative text, poor color contrast, missing accessible
    names for form elements, and absent document language.


    There are several automated tools available in the market today. When choosing
    automated testing tools for accessibility, consider these key factors:


    +   - **User interface:** Is the tool intuitive and easy to navigate? Is it accessible?

    +   - **Reliability:** Are the test results consistent and reproducible?

    +   - **Ease of use:** Does it require training, or is it easy for a beginner?

    +   - **Browser and device support:** Does it work on the browsers and devices
    you need?

    +   - **Maintenance:** Is the tool updated regularly?

    +   - **Cost:** Is the tool free or does it come with a cost? If you find a tool
    that requires a subscription or fee, test it with the free trial first. Explore
    your options. Find what fits your needs and budget. In most cases, the free version
    will do.

    +   - **Standards:** Does the tool check against the standards at the conformance
    level you aim for, such as WCAG 2.2 Level AA?


    Most automated accessibility tools are available for free directly in developer
    tools, as mobile applications, or as browser extensions. The following table compares
    free, commonly used automated tools:'
  merge: -1
  img_proc: true
- pgno: 271
  md: '| Tool | Platform | Features | Drawbacks |

    |---|---|---|---|

    | WAVE by WebAim (www.wave.webaim.org) | Web | - A browser extension

    - Opens in a side panel.

    - Scans a full page in its load state

    - Shows page structure, such as headings, and uses on-page icons to highlight
    results | - The page can get cluttered with on-page icons

    - Does not indicate the impact level of issues found |

    | axe DevTools by Deque (www.deque.com/axe/devtools) | Web | - A browser extension

    - Opens inside the browser''s Developer Tools

    - Scans a full page in its load state

    - Issues can be highlighted one at a time

    - Relevant requirements and impact levels are listed for each flagged issue

    - Premium upgrade options include partial page scans, user flow scans, report
    exports, and guided manual testing features | - Small learning curve to using
    the tool at first

    - Many features require upgrading to the paid version |

    | Lighthouse by Google Chrome | Web | - No download is required since it''s built
    into Chrome''s Developer Tools

    - Easy-to-use user interface

    - Uses the same library that powers axe DevTools, a trusted framework and widely
    respected resource for accessibility testing

    - Provides a score out of 100, giving a quick, high-level assessment of a page''s
    overall accessibility status

    - Can also check for performance, SEO, and best practices | - A high score may
    mislead people into believing a web page is fully accessible

    - Sometimes it is one version behind the latest available version of axe DevTools.
    |

    | Accessibility Inspector by Apple | iOS and macOS mobile apps | - Developer Tool
    available in Xcode

    - Provides raw accessibility information about specific elements within a mobile
    app

    - Offers element inspection capabilities, VoiceOver simulation, and screen-level
    audits | - Since it''s part of Xcode, this tool is primarily used by developers
    during the development phase. It''s less convenient for non-developers or testers
    who aren''t working within Xcode.

    - A limited number of tests are covered. |

    | Accessibility Scanner by Google | Android mobile apps | - An app available to
    download from the Google Play Store

    - Can scan a single screen or a series of screens | - A limited number of tests
    are covered. |


    Figure 11.1: Free automated testing tool options


    The tools in Figure 11.1 were selected based on the estimated number of users
    and personal experience. There are many other options (especially web tools).


    W3C''s Web Accessibility Evaluation Tools List (www.w3.org/WAI/test-evaluate/tools/list)
    has information on over 65 automated testing tools. You can filter tools by purpose,
    cost, operating system, language, and standards.'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'Since many tools are free, there’s no harm in using multiple at a time. Double-dip
    like you’re at an ice cream shop! Use as many as you want. Compare results and
    cross-check for accuracy.


    Are they too good to be true? Yes, sort of. Automated tools can only cover about
    30–50% of standard accessibility testing needs. Here are a few examples that snuck
    past automated tools but were later caught by a manual tester or end user:


    +   - Form elements, such as radio buttons, with null or object in the accessible
    name but not in the visible button label

    +   - A link that couldn’t be activated using the keyboard alone, unless a screen
    reader was running

    +   - Several important lines of overlapping text on a website’s home page when
    zoomed to 400%


    This means that even if a screen passes all automated tool checks, accessibility
    issues may still exist. That’s where manual testing and user feedback come into
    play.


    Many digital accessibility issues are context-dependent and require human review.
    Automated tools are a solid starting point, but they’re just the beginning. Always
    back them up with manual checks and insights from real users (especially those
    with disabilities). Thorough manual testing and diverse user feedback are key
    to creating accessible, user-friendly experiences. Let’s take a look at effective
    manual testing next.


    > For a deeper analysis of automated tools and manual testing, check out Adrian
    Roselli’s blog post, *Comparing Manual and Free Automated WCAG Reviews* (https://adrianroselli.com/2023/01/comparing-manual-and-free-automated-wcag-reviews.html).


    # Performing effective manual accessibility audits


    Sure, automated testing tools may help you find accessibility bugs quickly but,
    if you stop there, you are skipping the best part: manual testing. That’s right,
    it’s time to roll up those sleeves and get into manual testing.


    Manual test methods will uncover issues that automated tools cannot. It’s kind
    of like cleaning up pet fur. One round of vacuuming will not clean everything;
    you may need to get a lint roller to make sure it is completely fur-free. That’s
    why using multiple tools and a variety of testing methods is critical for ensuring
    accessibility.'
  merge: -1
  img_proc: true
- pgno: 273
  md: 'We will use “issues” and “bugs” interchangeably throughout this chapter. Also,
    the following information applies to both the web and mobile, unless specifically
    mentioned otherwise.


    While I won’t go deep into WCAG in this chapter to keep things approachable, most
    of the testing strategies discussed are related to WCAG standards. For specific
    criteria or to dive deeper into each testing area, refer to the official WCAG
    documentation.


    # Keyboard navigation is key


    Some people with vision or mobility disabilities may use alternative input methods,
    such as a keyboard, to navigate digital content. Websites and mobile apps should
    be fully usable without touching a screen or clicking a mouse. As a result, the
    focus order – the order of elements that receive focus when navigating with an
    alternative input method – and keyboard navigation are essential to test.


    If you have a mouse, just let your cat play with it while you complete your manual
    tests. Meanwhile, you can test the focus order and make sure that all elements
    can be reached using the keyboard alone.


    You can test keyboard navigation on mobile devices using a wireless keyboard,
    such as a Bluetooth keyboard.


    Starting at the top of the web page, use the Tab key to move from interactive
    element to interactive element. Examples of interactive elements include buttons,
    links, drop-down menus, sliders, toggles, checkboxes, and text fields. Tabbing
    should move you through the page and show a visible focus indicator (i.e., outline)
    on the focused element.


    Make sure the focus order is logical (which typically means that moving forward
    with your keyboard matches the order and meaning of the page) and fairly predictable.
    It should not jump around on the page like burning garlic on a hot stove. In most
    cases, the focus should move from top to bottom and left to right. If you’re tabbing
    and suddenly your focus does a disappearing act… congratulations, you found a
    bug!'
  merge: -1
  img_proc: true
- pgno: 274
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 275
  md: 'As you navigate your way through, pay attention to how the screen reader describes
    each element in focus. Screen reader announcements should be helpful, not hectic
    or absent; they shouldn’t be repetitive or point out any unnecessary junk.


    > If this is your first trip to screen reader city, you may notice it speaks fast.
    Don’t worry, you can adjust the speed in your screen reader’s settings. There’s
    no shame in slowing things down at first. Most daily users use their screen reader
    at full speed, but if you don’t often use one, slow it down to a more comfortable
    speed.


    For interactive elements, such as buttons or links, the screen reader should announce
    the label followed by the type of element (called its “role”). For example, a
    button with a text label of “Add to cart” should be announced as “Add to cart,
    button.” A big no-no would be if the visual label says “Add to cart” but the screen
    reader announces it as “Buy it now, checkbox,” which can confuse or mislead users.


    Additionally, if the accessibility name does not match an element’s text label,
    it may cause issues for users who navigate by voice. When navigating by voice,
    the person selects elements by saying the visible labels. If the visible label
    differs from the accessibility name, the assistive technology may not recognize
    the element or respond to the voice command. Technology advancements may improve
    this soon though, so follow the latest operating system and software updates.


    Also, look out for other common screen reader announcement issues, such as the
    following:


    +   - Missing role or element type (i.e., not saying that a button is a button).

    +   - Decorative images are not ignored.

    +   - Improper use of headings (i.e., illogical order or not descriptive).

    +   - In-line error messages are not announced.

    +   - Form fields lack required or optional indications.

    +   - Status messages are not announced. For example, if a form is submitted,
    there should be a success message indicating it was submitted or saved.

    +   - Focus on management issues that impact the user experience.


    # Mobile device-specific screen reader tips


    Turn on your screen reader in your device’s accessibility settings (or ask the
    default voice assistant), and then use gestures to test a mobile application.
    Gestures are a common way to navigate a mobile device with a screen reader.'
  merge: -1
  img_proc: true
- pgno: 276
  md: 'Most devices provide a quick tutorial of common gestures when you turn on the
    screen reader for the first time. Once the screen reader is running, you can use
    these gestures.


    Common gestures include the following:


    +   - **Swipe right:** Move the focus forward

    +   - **Swipe left:** Move the focus backward

    +   - **Single tap:** Select an item

    +   - **Double-tap:** Activate an interactive element in focus

    +   - **Swipe with three fingers:** Scroll the page in the direction of your swipe
    (iOS only)

    +   - **Swipe with two fingers:** Same as above but for Android


    Using the screen reader and gestures, check that the focus order, screen reader
    announcements, and core functionality behave as expected.


    # Check descriptions of images


    Automated tools are great at flagging that there’s a missing image description
    – often referred to as **alternative text (alt text)** – but they can’t judge
    whether the text is helpful or accurate. That’s where manual testing comes in.


    Assistive technology should describe meaningful images in a way that communicates
    the purpose. One way to test alt text is by navigating to the image and observing
    the screen reader or braille output. Listen to (or read) what’s announced and
    ask yourself: Does this make sense? Does it add value without being overcomplicated?


    Pay attention to the length of the image description – it should be detailed but
    concise (no one needs a novel). If the image contains important text, make sure
    that text is included in the alt description. If the image is just decorative,
    the screen reader shouldn’t even mention it.


    Want to double-check the alt text on a website? Pop open your browser’s developer
    tools, inspect the element, and look for the alt="" attribute in the HTML code.
    The alt text is what is between the quotation marks. If the image is purely decorative,
    the code should still have alt="" but no text between the quotation marks. This
    tells assistive technologies, “Hey friend, you can ignore me. I’m just here for
    the visual vibe – nothing more, nothing less!”


    # Test the page in various states


    Don’t stop there. There is still more to explore! Are error messages, loading
    indicators, and changes in content (such as expanding an accordion to reveal text)
    announced? If not, the experience leaves much to be desired and could leave many
    end users feeling lost or frustrated.'
  merge: -1
  img_proc: true
- pgno: 277
  md: 'It’s important to manually check the behavior of dynamic content because most
    automated tools only test the page in the state in which it loads. So, for example,
    it may not test menus or accordions when they are expanded, when in-line error
    messages are present, or if a date picker appears after selecting an appointment
    time.


    While navigating with a screen reader and keyboard, explore these additional states.
    When you encounter a menu, confirm that you can reach all options in the menu
    without using a mouse and that the screen reader accurately announces all the
    options.


    # Zoom in on what matters: your product


    People with low vision or other disabilities may use features that enlarge digital
    text or content. That is why it’s important to test your experience at various
    zoom levels and text sizes. Pinch to zoom on mobile devices or increase the web
    browser’s zoom level to ensure all content reorganizes without overlap, cutoffs,
    or decreased functionality.


    Then, test with large text. Adjust your text size in your device or browser settings
    and then verify that all text resizes proportionately, no content overlaps, and
    no functionality is lost.


    # Color counts


    Color vision deficiency is quite common. So, make sure color alone is not used
    to give instructions or convey meaning. For example, errors in a field should
    not only be marked in red; they should also have an inline error message announced
    by a screen reader. That doesn’t mean you can’t use color, you just shouldn’t
    use only color to indicate meaning.


    Also, make sure your digital experiences use sufficient color contrast. Most times,
    automated tools can catch color contrast issues; however, some may slip by. If
    you can do a quick visual scan of the page, look for any low-contrast text and
    non-text elements. If anything on your page looks like it went through the wash
    too many times (i.e., faded), it’s time to chat with your designers.


    # More essential checks


    There are several other things to check manually:


    +   - Easy and correct heading structure

    +   - No quick flashing content

    +   - Consistent navigation

    +   - Animations and videos have a way to pause and play'
  merge: -1
  img_proc: true
- pgno: 278
  md: '+   - Videos have captions

    +   - Audio comes with a transcript

    +   - Session timeout warnings, letting users extend their session


    Let’s finish by looking at some mobile-specific considerations:


    +   - **Orientation support:** Devices can be used in either portrait or landscape
    mode. This relates to accessibility because some people may have their phone or
    tablet in a fixed position, such as mounted to a wheelchair. Test your digital
    product in various orientations to ensure support. When you turn your phone horizontally,
    the view of your app or mobile website should seamlessly switch to landscape view.
    Similarly, when you change your mobile device back to the vertical position, the
    content should switch back to portrait view. In both positions, the content should
    not overlap, cut off, or lose functionality.

    +   - **Built-in accessibility features:** There are many accessibility features
    available on mobile devices, so it’s important to test how they work in your app
    or mobile website. These features are typically available under **Device Settings**
    or **Accessibility Settings**.


    Some features have slightly different names on iOS versus Android. Refer to the
    following table for several examples.


    | Feature | Android name | iOS name |

    |---|---|---|

    | Voice navigation | Voice Access | Voice Control |

    | Text-to-speech | Select to Speak | Spoken Content |

    | Screen reader | TalkBack | VoiceOver |

    | Increase text size | Font Size | Larger Text |

    | High contrast | High Contrast Text | Increase Contrast |

    | Minimize animations | Remove Animations | Reduce Motion |

    | Alternative input | Switch Access | Switch Control |

    | Enlarge screen content | Magnification | Zoom |


    *Figure 11.3: Names of iOS and Android features*'
  merge: -1
  img_proc: true
- pgno: 279
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 280
  md: '# Moderate issues


    After tackling blockers and serious issues, you can move on to moderate issues.
    Moderate issues may be inconvenient or noticeable to the end user but do not significantly
    impact the user experience.


    Examples of moderate issues include the following:


    +   - One or two decorative images are announced by a screen reader

    +   - A few instances of text have moderately low color contrast

    +   - A simple, short page lacks headings

    +   - “Required” is announced twice by a screen reader on a required form field


    # Other factors to consider


    Other factors can influence how urgently an issue needs to be addressed. Consider
    the broader context in which issues exist:


    +   - **Frequency:** How many pages does this issue impact? How many times does
    it happen on one page? For example, if 1 decorative image is announced on a page,
    the impact is less severe than if 10 decorative images are announced on a page.

    +   - **User feedback:** Have customers or clients reported a poor experience
    due to accessibility issues? What is the severity of the issue/issues? Low or
    high?

    +   - **Location:** Is the issue on one of your most visited pages? Does it affect
    a business-critical user flow? Or is it happening on an outdated event page with
    minimal traffic?

    +   - **Scope:** Does the issue appear within reusable components, or is it confined?
    Global issues – those that impact the same component across multiple pages – should
    be prioritized early in remediation efforts. A common example would be an accessibility
    issue within a shared navigation menu. If there’s no focus indicator in the navigation
    menu on the home page, the same issue probably occurs on all other pages where
    this menu is used. Addressing global issues helps create a more consistent and
    accessible experience across your digital product.'
  merge: -1
  img_proc: true
- pgno: 281
  md: '![](img/3bdc9e2d41de898f8a3bcc9634b0000e_281_0.png)


    Teams without accessibility experience often opt to fix the easy, low-hanging
    fruit first. This could be due to a few factors: low confidence in tackling the
    more complex issues, not fully understanding the user impact of certain bugs,
    or a lack of direction due to a gap in prioritization efforts.


    While this approach may help reduce the bug count quickly, the impact on the end
    user is often minimal. However, low-effort fixes can sometimes drive meaningful
    change. While small effort fixes can sometimes drive meaningful change, it’s important
    to weigh the potential impact alongside the level of effort. Your prioritization
    efforts will help with this.


    By prioritizing more serious problems first, you can make a substantial difference
    for the end user by removing barriers and improving the user experience. It can
    also help you avoid having frustrated customers who cannot use your product due
    to major accessibility flaws or worse (such as dealing with demand letters and
    legal troubles).


    # Dashboards


    Remember that big ol’ bucket of accessibility bugs? Consider creating a dashboard
    to help make sense of it all. A dashboard can help you interpret your test results,
    track remediation progress, and inform your strategy. Common variables to track
    in your dashboard might include the following:


    +   - Issue type/category (i.e., screen reader issues, color contrast, or keyboard
    navigation)

    +   - Priority level (often a function of severity of impact)

    +   - Impacted user groups

    +   - Remediation status (i.e., not started, in progress, or resolved)

    +   - User flow

    +   - WCAG success criteria

    +   - Assistive technology


    Planning remediation efforts requires time and effort, but it offers tremendous
    guidance to your company, team, or business. A prioritized backlog and a well-organized
    dashboard can help move your team from “Where do we start?” to “Hey, we’ve got
    this.” This will also help you set project milestones and deliver the most impactful
    changes first.'
  merge: -1
  img_proc: true
- pgno: 282
  md: 'Prioritizing thoughtfully and remediating strategically isn’t just good for
    business; it’s also a win for people with disabilities.


    With these insights guiding your testing and remediation efforts, you are on the
    right path. Now, let’s shift gears from being reactive to proactive. It’s time
    to get ahead of the game and weave accessibility testing right into your development
    workflows.


    # Integrating accessibility testing into development workflows


    You know what’s better than finding and fixing accessibility bugs? Preventing
    them in the first place! To do this, you must bake accessibility into your **Software
    Development Life Cycle (SDLC)** processes and make it a part of the culture. Sustainable
    integration of accessibility into development workflows requires a thoughtful
    strategy, tools, and some trial and error to find what works for your teams.


    Start by defining the standard that everyone will strive for, such as the WCAG
    2.2 AA. Get buy-in from leadership and document your decision. Consider creating
    a policy that does the following:


    +   - Specifies accessibility requirements

    +   - Assigns responsibilities

    +   - Outlines methods for monitoring and enforcement

    +   - Identifies relevant tools and technologies


    Policies and standards are a solid foundation, but they will not change behaviors
    themselves. It’s like having an instruction manual for assembling furniture. Sure,
    instructions are helpful, but without the right tools, commitment, and effort,
    the end result may not be great. You’ll need to integrate accessibility into every
    part of your development workflows and team culture:


    +   - **Training**: Frequent, targeted training builds awareness and gives people
    the necessary skills to execute accessibility tasks. Highly engaging and effective
    training programs can also drive cultural change.


    > You can collaborate with your learning and development team to weave accessibility
    tidbits into existing training programs.'
  merge: -1
  img_proc: true
- pgno: 283
  md: '+   - **Tooling and testing:** As discussed earlier in this chapter, developers
    and QA teams should use both automated and manual testing methods alongside other
    code functionality checks. Developers can also use accessibility linters to catch
    issues before the QA stage.


    ![](img/3bdc9e2d41de898f8a3bcc9634b0000e_283_0.png)


    To make things actionable, be specific. Instead of simply saying “WCAG 2.2 AA
    is required,” state which tools to use, what to test, and common issues to look
    out for. It’s not uncommon for a QA engineer to say that they “did accessibility”
    but only ran an automated tool. Often, they didn’t realize what was expected.
    Clear instructions help bridge that gap and ensure thorough testing.


    +   - **Requirements:** Indicate accessibility as a requirement, such as by adding
    it to the global **Definition of Done (DoD)** and/or as part of **Acceptance Criteria
    (AC)**. The DoD is a shared agreement within an Agile team that defines the criteria
    a product increment must meet to be considered complete. AC outlines the standards
    a user story must meet to be considered complete and functioning as expected from
    the end user’s perspective. Partner with your release train engineers, product
    and engineering leaders, and scrum masters to make this happen.


    +   - **Documentation:** Document accessibility tool choices, specific testing
    expectations, and your company or team’s technical standard (i.e., WCAG 2.2 AA)
    in test plan and bug report templates. Create easy-to-follow checklists to help
    developers and QA engineers test accessibility. Role-based accessibility checklists
    that specify tool names, design considerations, or critical test steps are helpful.
    Store guides and checklists in places where developers and QA frequently visit,
    such as the internal bug-tracking system, intranet, or knowledge base.


    A well-designed checklist helps people learn independently and build more inclusive
    products from the start. But before you start building one, take a moment to think
    through the purpose and audience.


    Here’s what to keep in mind when creating a checklist:


    +   1. **Define the audience and purpose:** Who is this checklist for, and what
    do they need to accomplish?

    +   2. **Make it actionable:** Each item should be a specific task (i.e., *Ensure
    all form fields have associated labels* instead of *Check form accessibility*).'
  merge: -1
  img_proc: true
- pgno: 284
  md: '+   3. **Give it structure:** Group related tasks together so the checklist
    is easy to use.

    +   4. **Include helpful resources:** Link to relevant tools, browser extensions,
    or testing instructions to help people complete each requirement.

    +   5. **Iterate and update:** Improve the checklist over time based on feedback.
    Make changes as best practices evolve, and use versioning to indicate when updates
    are made.


    > Most people are not accessibility experts. Write checklists and resources using
    plain language, and demonstrate testing methods in multiple formats (e.g., screenshots,
    videos, in writing). Help people feel confident, not confused.


    However, keep in mind that checklists are just a helpful starting point. As mentioned
    in *Chapter 2*, accessibility itself is not just a checklist. It’s a commitment
    to quality, usability, and people. After all, digital accessibility impacts both
    the people who build the technology and those who use it.


    If you are in the process of integrating accessibility into development workflows,
    remember that change is not easy. Everything in this chapter has a tangible impact
    on both the organization and the customer. We discussed the importance of prioritizing
    feedback from customers, but don’t miss out on the voice of your fellow designers,
    developers, and QA. Their feedback on tooling, checklists, and processes can lead
    to tailored improvements. Plus, listening to people builds relationships, trust,
    and better work environments.


    Strive to make expectations actionable and manageable. You can do this by providing
    developers and QA engineers with the right tools and information to perform accessibility
    tasks as part of their day-to-day work.


    Embedding accessibility into existing development workflows not only enables the
    creation of more inclusive, user-friendly products but also helps shape a culture
    of accessibility-first thinking. Ultimately, the end goal is to prevent new accessibility
    barriers from reaching end users. Find what works for your team, collect feedback
    along the way, and make iterative improvements.'
  merge: -1
  img_proc: true
- pgno: 285
  md: '# Summary


    This chapter laid out the basics of ensuring your website or mobile app will be
    usable for people with disabilities, focusing on testing tools and techniques.
    We explored the dynamic duo of automated and manual testing methods, the importance
    of prioritization, and how to bring accessibility into development workflows.


    The topics covered here are foundational to building a successful digital accessibility
    program, especially in the area of quality assurance. Effective testing and remediation
    ensure that inclusive design translates into a high-quality user experience. Accessibility
    is a journey that requires continuous monitoring, effort, and collaboration across
    all teams. Whether it is one line of code, one test case, or one bug – every small
    action adds up.


    In the next and final chapter, you will look at how you can embed accessibility
    strategies into organizations.'
