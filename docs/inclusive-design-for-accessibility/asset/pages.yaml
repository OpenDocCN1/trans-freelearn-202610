- pgno: 125
  md: '# 5


    # Designing Accessible User Interfaces: Visual and Interaction Design


    By Nandita Gupta


    Accessible user interfaces are key to creating experiences that work well for
    everyone, no matter their abilities or how they interact with technology. In this
    chapter, we will cover important aspects of designing with accessibility in mind,
    such as using color effectively, designing for cognition, supporting multiple
    input methods, and scaling accessibility across different devices and platforms.
    The goal is to help you build interfaces that are not only accessible but also
    intuitive and engaging for all users.


    This information is valuable because accessibility is essential for inclusivity
    and usability. When you design thoughtfully, you remove barriers and create more
    meaningful, flexible experiences that reach a broader audience. This chapter gives
    you practical insights and strategies to make your designs truly inclusive and
    adaptable to real user needs, and covers how these strategies are beneficial for
    users with disabilities.


    In this chapter, we will delve into the following topics:


    +   - Using color within visual design

    +   - Designing with cognitive disabilities in mind

    +   - Designing for multiple alternative input methods

    +   - Scaling designs for improved accessibility'
  merge: -1
  img_proc: true
- pgno: 126
  md: '# Using color within visual design


    Color is a powerful element of visual design. It can evoke emotions, guide user
    interactions, and create a memorable experience. However, with great power comes
    great responsibility. Designers must recognize that color perception can vary
    significantly across different people, cultures, and contexts. What might seem
    intuitive or universally understandable to one group of users can be confusing
    or exclusionary to another.


    This section will explore how to use color effectively in a way that ensures accessibility
    for all users. We’ll dive into color contrast, the use of patterns, shapes, and
    icons in place of color for information, and discuss how to design for cultural
    considerations in safety and warning systems. The goal is to create designs that
    cater to a broader, more diverse audience – one that includes the estimated 300
    million people worldwide who live with color vision deficiencies (according to
    the World Health Organization).


    # Using color for time-sensitive decision-making and safety


    Traffic lights offer a familiar example of how color is used to convey information
    quickly and instinctively. But for individuals with red-green color blindness
    – a common form of color vision deficiency – the distinction between those lights
    may not be clear, creating potential safety risks. This challenge becomes even
    more pronounced in high-stakes environments such as manufacturing, where split-second
    decisions can affect not only productivity but also worker safety. In such settings,
    relying solely on color to communicate urgency, status, or system conditions introduces
    unnecessary risk.


    > The company RealPars wrote an article that showcases how color can make a huge
    impact within the manufacturing systems by using color indiscriminately throughout
    the system, where it not only becomes a cognitive overload but also a potential
    safety hazard: https://www.realpars.com/blog/high-performance-hmi.


    Another important consideration is that the meaning of color is not fixed; it
    varies across cultures and contexts. For example, red is widely used in North
    America and Europe to signal danger or “stop,” but in parts of East Asia, it can
    also signify celebration or prosperity. Similarly, white may represent cleanliness
    or safety in Western cultures, while in others, it is closely tied to mourning
    and death. These differences become critical in global products, where misinterpreting
    a signal could lead to confusion or delay.'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'Instead, combine color with additional indicators – such as shapes, patterns,
    text labels, or auditory signals – to ensure information is accessible to all
    users, including those with color vision deficiencies. For example, pedestrian
    traffic signals can be made more accessible by supplementing red and green colors
    with additional cues that don’t rely on color perception. Instead of relying solely
    on color, do the following:


    +   - Use text labels, such as “Stop” and “Go,” displayed directly beneath or
    inside the lights. This helps users with color vision deficiencies and also supports
    understanding in unfamiliar environments. Audio cues, such as a spoken instruction
    or tone pattern, can further enhance accessibility.

    +   - Pair colors with shapes – for instance, a red circular light for “stop”
    and a green square light for “go.” This shape-based distinction reinforces meaning
    even when the color is not easily distinguishable.

    +   - Incorporate symbols, such as a red figure standing still and a green figure
    walking. These provide an intuitive visual reference, especially helpful for users
    with low literacy or language barriers.


    Another example of accessible color use at a global scale comes from international
    standards developed by the International Organization for Standardization (ISO).
    ISO provides a coherent set of graphical symbols designed to overcome language
    barriers and support consistent interpretation across regions. These symbols combine
    color with patterns, icons, and text to convey critical information clearly and
    efficiently. By using multiple redundant cues – rather than depending on color
    alone – ISO standards offer a practical model for designing inclusive signage
    and interface elements that work across diverse languages, cultures, and abilities.


    > A solution that may be accessible for some might potentially be triggering for
    others. For instance, a flashing red light paired with a bold warning icon and
    an alarm sound can immediately grab attention and prompt quick action. On the
    other hand, the flashing lights might be triggering for users who experience photosensitive
    disorders.'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# Using color contrast to ensure legibility and clarity


    Color contrast is essential for making sure your content is legible and accessible
    to users with low vision or color blindness. Contrast ensures that text stands
    out clearly against the background, making reading easier. Without sufficient
    contrast, users may find it difficult to differentiate between text and background,
    leading to frustration and increased cognitive load.


    A dark gray or black text on a light-colored background (or vice versa) is ideal
    for readability, but it’s important to verify that the contrast meets accessibility
    requirements. According to Web Content Accessibility Guidelines (WCAG) 2.1, standard
    body text must meet a minimum contrast ratio of 4.5:1 against its background to
    be considered accessible. For larger text – typically 18pt regular or 14pt bold
    – the minimum contrast requirement is slightly lower, at 3:1. These guidelines
    help ensure that users with low vision or color vision deficiencies can comfortably
    read content without strain.


    Here is an example denoting the different levels of color contrast along with
    whether or not they would fail WCAG guidelines:


    +   1. Bad example 2.67:1 (fail)

    +   2. Very bad example 1.1:1 (fail)

    +   3. Bad example 2.09:1 (fail)

    +   4. Good example 21:1 (pass)

    +   5. Very bad example 1.14:1 (fail)


    Figure 5.1: Color contrast vs. WCAG guidelines'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'To support readability, designers must evaluate color combinations early and
    often using tools that test contrast ratios against accessibility standards. Tools
    such as the WebAIM **Color Contrast Checker** make this easy by allowing designers
    to enter specific foreground and background color values and receive instant feedback
    on whether the combination complies with WCAG requirements. Integrating this kind
    of testing into the design workflow ensures that content remains legible not just
    in ideal conditions but across a wide range of visual abilities and device settings.


    > **California State University, Northridge (CSUN)** provides a good article on
    good and bad color contrast, as well as a helpful contrast table:

    > https://www.csun.edu/universal-design-center/web-accessibility-criteria-color-contrast.


    # Using color in charts and diagrams


    Charts and graphs used in interfaces and web pages are another example where data-driven
    designs use color to differentiate between categories or highlight trends. However,
    relying on color alone to represent different data points is not sufficient, and
    using patterns or textures in addition to color can be valuable for perception.


    For example, in a pie chart, each segment can be distinguished not just by color
    but by using solid fills, stripes, dots, or other patterns. These variations help
    users differentiate between data sets even if they can’t perceive color accurately.
    When using legends, pair each color with a clear text label and a concise description
    of what that data point represents. This ensures the chart remains understandable
    regardless of visual ability. In addition, all charts and graphs should include
    descriptive text alternatives – either as captions, summaries, or accessible data
    tables – to support users who rely on screen readers or those with cognitive disabilities
    who benefit from written context.


    Looking at the following pie chart, we can see that different colors have been
    used to differentiate the segments, along with texturing each slice, plus labeling
    each section with specific values:'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# FAVORITE FOODS


    ![](img/3bdc9e2d41de898f8a3bcc9634b0000e_130_0.png)


    Figure 5.2: A pie chart with different colors and clear labels

    (though it could be improved further for better accessibility!)


    To improve it, the colors used for the Burgers and Sushi labels are quite similar,
    so we could change one of the labels’ colors. We could also use different textures
    for each slice; however, lots of different, clashing textures can be overwhelming
    for the consumer, so they should be used wisely.


    # Using color to convey errors


    In web design, color is often used to indicate errors; for example, when filling
    out forms, green indicates success and red indicates failure. However, users with
    color deficiencies may not easily differentiate between the two, and one must
    not assume universal color perception for everyone.


    About 8% of men and 0.5% of women worldwide experience some form of color blindness,
    which can make color-dependent information inaccessible. Color blindness varies
    from difficulty distinguishing between certain hues, such as red and green, to
    a complete inability to perceive any color at all (achromatopsia).


    To ensure accessible form validation flows for visual design and color, do the
    following:


    +   - Add icons alongside the colored text, noting success or failure. For example,
    a green checkmark and a red cross provide a clear visual cue about the status,
    regardless of the user’s ability to perceive color.'
