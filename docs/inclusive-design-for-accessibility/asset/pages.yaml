- pgno: 31
  md: '# Part 1


    # Foundations of

    Inclusive Design


    This opening section lays the groundwork for designing accessible and inclusive
    digital experiences. Across four chapters, you will be introduced to the core
    principles, legal frameworks, and practical approaches that shape inclusive design
    in today’s digital world. From understanding the evolution of accessibility and
    the spectrum of user needs to navigating global legislation and embedding ethical
    responsibility, these chapters reframe accessibility not as a checklist, but as
    a human-centered design commitment.


    You will also learn how to conduct inclusive user research that respects lived
