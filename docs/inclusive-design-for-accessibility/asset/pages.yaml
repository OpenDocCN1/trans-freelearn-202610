- pgno: 108
  md: 'For some, showing up means writing instead of speaking, especially if talking
    on demand is hard, or if language itself feels like a barrier. Others might need
    more time, not because they’re checked out, but because their energy comes in
    waves. Fatigue, pain, burnout, and brain fog – none of these follow a research
    calendar. Showing up isn’t linear.


    This is why inclusive research can’t offer just one path in. It needs to offer
    options. Real ones. That might mean the following:


    +   - Sending a few written prompts in advance instead of jumping straight into
    conversation

    +   - Inviting voice memos from folks who prefer speaking over typing

    +   - Using asynchronous tools such as shared docs or messaging threads

    +   - Offering longer timeframes for people who need pacing that matches their
    lives

    +   - Letting people opt for phone over video, especially if tech or energy is
    limited

    +   - Using 1:1 conversations instead of group calls if that helps reduce overwhelm

    +   - Keeping instructions or prototypes in plain text, not just images or slides

    +   - Leaving room for processing, pauses, or breaks during live sessions


    These aren’t “access features.” They’re basic signs of respect. When we stop forcing
    everyone through the same narrow door, we start hearing more honest reflections
    – ones that don’t have to push through discomfort just to get to the surface.
    Access isn’t just about whether someone can be there, it’s about whether they’re
    welcomed in a way that doesn’t cost them more than they can give.


    # Closing the loop with participants


    Building feedback loops is essential for maintaining accountability in inclusive
    research. Participants need to see how their experiences influence product development
    to trust the research process.


    Where it’s legally or practically possible, regular post-research updates and
    ongoing summaries help close the loop. Even when full product updates can’t be
    shared, a simple follow-up email summarizing what participants contributed and
    what the team is learning can still demonstrate that their voices matter.


    Inclusive research is not just about who is invited to participate; it is about
    ensuring that their contributions lead to real change, reinforcing relational
    integrity, and fostering long-term relationships between researchers and research
    participants.'
