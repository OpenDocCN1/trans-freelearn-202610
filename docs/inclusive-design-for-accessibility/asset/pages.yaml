- pgno: 287
  md: '# 12


    # Building an Inclusive Design Culture: Strategies for Organizations


    By Denis Boudreau, CPWA


    Here we are, down to the last chapter. Let me begin by repeating a lesson discussed
    throughout this book: inclusive design thrives when accessibility is embedded
    in an organization’s culture, not when it’s treated as an afterthought or a last-minute
    fix. Organizations that build accessibility into their workflows, track meaningful
    progress, and invest in continuous learning are better equipped to meet the needs
    of all users, including those living with various disabilities. Teams that recognize
    accessibility as a shared responsibility rather than a constraining obligation
    end up creating stronger, more inclusive digital experiences for everyone. Period.


    As a way to wrap up this book, this chapter will explore practical strategies
    to make accessibility a lasting part of how organizations work. This transformation
    begins with building empathy through immersive experiences and by helping cross-functional
    teams understand the real impact of accessibility barriers on the audiences they
    are expected to serve.


    In this final chapter, we will focus on four main strategies to build an inclusive
    design culture:


    +   - Cultivating empathy through immersive experiences

    +   - Integrating accessibility into design and development workflows

    +   - Measuring and reporting on accessibility progress

    +   - Weaving continuous learning into inclusive design'
  merge: -1
  img_proc: true
- pgno: 288
  md: 'Whether you’re leading an organization, managing a team, or are directly involved
    in the design and development phases of digital products or services, the strategies
    presented in this chapter will help you move beyond awareness and straight into
    action. Teams that embed accessibility into their daily decisions are the ones
    who successfully create experiences that work for everyone.


    After all, as the late John Slatin used to say, “*Good design is accessible design.*”


    # ## Cultivating empathy through immersive experiences


    I want to begin by sharing a few thoughts on empathy, as empathy is one of the
    strongest drivers for inclusive design. Not the feel-good “let’s all be nice to
    each other” version, but the raw, eye-level understanding that comes from witnessing
    real people struggle.


    When design teams witness end users running into accessibility barriers, disability
    inclusion quickly goes from a constraining theoretical set of requirements to
    an eye-opening, meaningful shared responsibility.


    Most experts would agree that organizations that actively embrace inclusive design
    are also the ones who ultimately reach more customers, reduce their legal risks,
    and stay ahead of changing user needs and expectations. That has certainly been
    my observation over the years.


    And while accessibility training sessions, governance policies, and role-based
    checklists certainly have the potential to go a long way, truly transformational
    change doesn’t happen through an accessibility audit. It happens through engaging
    directly with those who have relevant lived experiences and consume the world
    differently.


    # ## Understanding accessibility barriers firsthand


    Most professionals in design, development, and leadership roles will probably
    never use a screen reader. Very few are even likely to one day navigate a website
    without their mouse or fill out a form using only their voice.


    Without such firsthand exposure to alternative, yet valid means of navigating
    the digital space, it’s no surprise that for most people, accessibility feels
    disjointed from design.


    Creative teams that interact with digital products the way people with disabilities
    do can more clearly see the gaps and challenges introduced by a blatant lack of
    digital inclusion. This realization leads to more thoughtful and inclusive design
    decisions, which, in turn, lead to more inclusive experiences online.'
  merge: -1
  img_proc: true
- pgno: 289
  md: 'A few years ago, I guided a UX team at a major software company that needed
    to improve the accessibility of their platform but wasn’t sure where to start.
    As part of our engagement, I guided them through a workshop where they spent hours
    navigating their platform using only a keyboard and a screen reader, capturing
    observations along the way.


    As an experiment, we also provided them with blindfolds, so they could go about
    uncovering major usability issues that had never been on their radar up until
    that point. Confusing button labels, missing alt text, keyboard navigation traps,
    and dozens of other accessibility issues suddenly became painfully apparent.


    More than minor inconveniences, these issues were real barriers that prevented
    real people from using the platform independently. While unnoticed by the UX team
    up until that point, these issues had nonetheless been plaguing the user experience
    of people with disabilities for months, if not years.


    This was no doubt a jaw-dropping experience for the team, but I knew better, so
    I had one more surprise in store for them. Once they were done experimenting with
    alternative ways of navigating their websites, I introduced them to Tim, a blind
    colleague of mine.


    Using the exact same tools (minus the blindfold, which I knew was a misleading
    idea), my colleague went on to uncover a series of additional problems the team
    had failed to identify, such as poor use of ARIA landmarks, lack of feedback on
    dynamic interactions, overuse of ambiguous link text, unclear call to action states,
    and missing text alternatives to otherwise purely visual cues.


    What stood out most to everyone was the nature of the issues Tim identified compared
    to those they had found. While the blindfolded team uncovered many surface-level
    barriers, Tim’s insights went far deeper. He noticed systemic navigation issues,
    gaps in feedback, and missing structural elements that only someone with lived
    experience would know to look for. His muscle memory, mental mapping, and intuitive
    expectations, shaped by years of using assistive technology, gave him access to
    problems that simulations simply couldn’t replicate.


    I knew this was a lesson the team would only understand by going through the motions.
    Simulation exercises sometimes raise awareness, yes, but they don’t lead to sustainable,
    real-world solutions. They might start the conversation, but they can’t replace
    the insights that come from lived experience because true accessibility comes
    from listening to (and learning directly from) people with disabilities, proving
    without a doubt that you could only go so far when “faking your way into a disability.”'
  merge: -1
  img_proc: true
- pgno: 290
  md: '# Why disability simulations fall short


    Driven by the eagerness to make a deliberate case for disability inclusion, it’s
    not unusual for well-intentioned brands to try to build awareness and empathy
    through what we call “disability simulations.” As we just observed, this is rarely
    a good idea, because while disability simulation exercises sound great in theory,
    they fall short when it comes to what they implicitly suggest about the experiences
    of those who live with these disabilities.


    Some teams will have their employees wear blindfolds to experience blindness,
    as I did. Other teams will use gloves to simulate limited mobility. My personal
    pet peeve is when businesses have their people move around in wheelchairs, as
    if this could make someone understand what it’s like to live with limited mobility.
    At first sight, these well-intentioned initiatives sound like fantastic ideas.
    But I had learned years before that they weren’t, and I knew that the only way
    this team would understand was to compare their blindfolded experience with Tim’s.


    In fact, all these exercises typically achieve is reinforcing misconceptions about
    “how horrible it must be to be disabled,” rather than building a real understanding
    of what it might be like to use the web with a disability. Not exactly helpful.
    Counter-productive, even.


    I also once worked with a marketing team that organized labs where employees wore
    noise-canceling headphones and blurred goggles to simulate being deaf or blind.
    When asked what they had learned, the response was predictable: “That was so frustrating
    and depressing. I can only imagine how hard it must be to be deaf or to be blind!”


    And that’s exactly what disability simulations get all wrong: because these exercises
    usually focus on what people can’t do instead of focusing on how they interact
    with the world around them, they leave participants with feelings of pity rather
    than a deeper understanding of real solutions.


    All that simulations can do is scratch the surface of a disabled person’s reality,
    and most blind or deaf people would tell you that this is not how they experience
    the world, digital or otherwise. Deaf people don’t simply struggle to hear; they
    use captions, transcripts, or sign language to communicate. Blind individuals
    don’t just experience impaired vision; they navigate with screen reader technology,
    tactile markers, and spatial awareness. They have tools and develop coping mechanisms.
    They have techniques, often honed by years of lived experience.


    Instead of disability simulations, organizations should focus on engaging directly
    with people who live with those disabilities and have relevant lived experiences.
    By testing their products and services with assistive technology users and integrating
    accessibility into every stage of design and development, brands can develop a
    true understanding and perspective of what the barriers are and how to fix them.'
  merge: -1
  img_proc: true
- pgno: 291
  md: 'But still, yes, it does begin with empathy.


    # Building empathy through real engagement


    The best way for a team to cultivate empathy is to listen to and learn from the
    people who have relevant lived experiences with these disabilities. I remember
    a coaching session with a financial tech company a few years ago, where the UX
    team was struggling with nailing accessibility in their mobile applications.


    Despite meeting most W3C Web Content Accessibility Guidelines (WCAG) requirements,
    they were still getting usability complaints. As such, some of their most critical
    banking features, such as transferring money and consulting PDF statements, were
    completely unusable with screen reader technology. Their app technically passed
    most compliance checks, but real users were still getting stuck at key moments
    due to unforeseen challenges.


    Acknowledging that they lacked the firsthand perspective, instead of guessing
    what might still be wrong, they chose to run usability testing sessions with blind
    and low-vision customers. A wise decision.


    What they learned through that process was far more valuable than what any checklist
    could have ever provided. It’s one thing to follow accessibility guidelines around
    section headings, but it’s an entirely different thing to observe the different
    ways in which blind people using screen readers might navigate from one section
    heading to another, or what the cognitive load might actually feel like for neurodivergent
    individuals interacting with our user interfaces.


    After incorporating the feedback gathered from these usability sessions, the team
    not only fixed those issues but also committed to involving users with disabilities
    in all future product testing. That shift in their thinking is what ultimately
    led to a better experience for customers living with disabilities.


    The changes also improved everyone else’s experience in the process, demonstrating
    that accessibility best practices not only increase the experience of disabled
    users but also those who benefit from inclusive experiences that are truly centered
    around the end users.


    # Embedding empathy and driving company-wide commitment


    Empathy is one of the strongest drivers of inclusive design, but it shouldn’t
    be limited to a one-time workshop or confined to design and development teams.
    Empathy must be part of how people work, collaborate, and address challenges if
    we are to truly transform the organization’s culture.'
  merge: -1
  img_proc: true
- pgno: 292
  md: 'One of the most effective ways to start building that empathy is through activities
    such as “accessibility immersion weeks,” where employees and executives spend
    time navigating their own digital tools using only a keyboard or basic assistive
    technologies. These experiences are not meant to replicate disability; they are
    meant to expose barriers in a way that can’t be ignored. When senior leaders experience
    these obstacles firsthand, accessibility stops being a compliance issue and becomes
    a leadership priority.


    But teams don’t need to wait for a formal event or initiative to start! Even small,
    everyday moments, such as trying to complete a task without a mouse or reviewing
    a design with accessibility in mind, can spark insight and shift mindsets. The
    key is to build momentum through regular exposure and conversation, not just one-off
    activities.


    That moment of recognition is often where change begins. Leaders who understand
    the real-life consequences of inaccessible design are far more likely to support
    meaningful actions and empower others to do the same. That’s when accessibility
    champions begin to emerge, and inclusion becomes part of how teams approach their
    work, day in and day out.


    Organizations that keep accessibility top of mind by building it into design critiques
    also encourage feedback from users with disabilities. They recognize that inclusive
    successes create space for continuous progress, stop treating accessibility as
    extra work, and start seeing it as a marker of quality and innovation.


    Inclusion is no longer something they do just to avoid lawsuits; it becomes something
    they want to do because they understand the value it brings to everyone.


    # Turning empathy into action


    Empathy can go a long way, but some would argue that it’s only valuable if and
    when it leads to real change, not feelings of pity. Organizations that most successfully
    build accessibility and inclusion into their culture don’t stop at raising awareness;
    they take concrete and measurable steps to ensure the long-term impacts that make
    a difference in the lives of their customer base.


    Over the years, I’ve led countless successful accessibility training programs
    that left employees feeling inspired to be part of the solution for disability
    inclusion. I’ve no doubt turned hundreds of designers and developers into accessibility
    believers. But for most participants, once their daily work routine settled back
    in and the magic of the training sessions wore off, so would their motivation.
    Why? Because if accessibility never quite becomes a priority and the practice
    is not built into workflows, then other considerations take precedence.'
  merge: -1
  img_proc: true
