  img_proc: true
- pgno: 98
  md: '# Recruiting diverse participants for inclusive research


    Let’s begin with something simple but not always easy.


    If you’ve been involved in research before, think back to past recruitment efforts.
    Who showed up? Who didn’t? Why might that have been the case? This is an invitation
    to reflect, not to judge. You should be honest about the patterns we’ve inherited
    and the habits we’ve repeated. Systemic barriers shape exclusion. But they’re
    also upheld by the everyday choices we make, who we think is “reachable,” and
    how we invite, compensate, and respond once people arrive.


    Too often, inclusive recruitment is dismissed as too hard, too niche, too slow.
    But those beliefs don’t just limit who we reach; they limit what we believe is
    possible.


    Inclusive research asks us to pause, to pay attention, and to do so with intention.
    Ask yourself the following:


    +   - Are you supported to move at the speed of trust, even when timelines demand
    more?

    +   - Where can you build in space for deeper engagement, even within fast-paced
    realities?


    Accessibility doesn’t start in the session; it starts long before the first ask.
    As researchers and designers committed to inclusion, we must adapt our methods.
    Traditional recruitment often mirrors the same systemic inequities we claim to
    challenge, filtering out the very people whose insights could shift what we build,
    how we build, and who it’s built for. If we want to do better, we need to rethink
    how we invite people in, not as an afterthought, but as the beginning of the work.
    We must adapt our research methods to honor participants’ lived realities, preferences,
    and needs instead of expecting them to conform to traditional research protocols
    designed for non-disabled norms.


    # Rethinking recruitment as a relational practice


    If we’re serious about equity in research, we need to stop treating recruitment
    like a task to check off and start treating it as a relational practice. At its
    core, this isn’t recruitment. It’s relationship-building, rooted in respect, guided
    by care, and carried by trust. Disabled participants often experience research
    as extractive, inaccessible, or performative. Shifting to a relational practice
    is not just best practice; it’s essential to earn trust and build equity into
    how we engage.'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'As we build our recruitment practices, it helps to keep asking ourselves the
    following:


    +   - Are our materials accessible?

    +   - Are we compensating fairly for time, energy, and emotional labor?

    +   - Have we built systems of care and safety into the research process?

    +   - Are we building relationships before we ask for insight?

    +   - Are we using trusted community channels or just those easy to reach?

    +   - Have we closed the loop and shown how feedback shaped outcomes?

    +   - Have we created accountability *after* the study ends?


    These aren’t extras. They’re the foundation of a research culture grounded in
    reciprocity, mutuality, and collaboration, not extraction.


    Compensation is also part of how we show respect. When we ask people to share
    their time, energy, or lived experience, especially when it’s shaped by harm or
    exclusion, we need to recognize what that asks of them. Fair, flexible payment
    isn’t a formality; it’s one way we demonstrate that their contributions matter.


    # Beyond representation: designing from the edges


    Representation is about designing with the full complexity of how people move
    through the world. Especially those pushed off the “happy path,” the idealized,
    simplified user flow that assumes stable access, normative behavior, and little
    variability.


    Participants dismissed as “edge cases,” those whose needs or experiences don’t
    fit the assumed norm, often reveal where systems break. Their experiences surface
    the friction others don’t see. Designing from the edges deepens, not narrows,
    what we build. They’re signal bearers. When we take those signals seriously, we’re
    not narrowing the experience; we’re deepening it.


    A neurodivergent participant might not stumble because a flow is unclear, but
    because it demands energy they don’t have. It’s not just layout, it’s overload,
    sensory input, and pattern complexity. When we listen attentively, we begin to
    understand not just what’s breaking but why.


    Research tends to over-index those who are easiest to reach: folks with stable
    internet, high digital literacy, and comfort with research norms. But that filters
    out the very people whose perspectives could transform how we build. Inclusive
    research asks us to hold complexity, not flatten it, even more so when studying
    disability and access needs. Too often, disability research is treated as supplemental,
    anecdotal, or reduced to statistical slices in broader studies. This misses the
    nuance of lived experience and erases variation, pattern, and cultural context.'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'We must build systems that reflect real, shifting, and layered lives, with
    outcomes flexible enough to hold people’s realities, which are nonlinear, dynamic,
    and deeply human.


    There’s no universal checklist for inclusive recruitment and no step-by-step formula
    that guarantees care, reciprocity, or trust. But there are questions we can keep
    asking, patterns we can notice, and practices we can return to. Think of this
    not as a prescription but as a starting point – something to revisit, reshape,
    and build upon in your context. Consider these questions:


    +   - Have I involved community members in shaping the research process?

    +   - Are my recruitment materials accessible (language, format, delivery)?

    +   - Have I used trusted, culturally relevant channels to share opportunities?

    +   - Does my compensation reflect participants’ time, effort, and lived experience?

    +   - Have I offered multiple ways to participate (synchronous/asynchronous, verbal/non-verbal)?

    +   - Have I closed the loop by sharing outcomes or updates with participants?

    +   - Am I respecting access needs that intersect with race, class, gender, language,
    or geography?

    +   - Have I built in flexibility around timing, energy, and participation boundaries?

    +   - Have I made space for pauses, emotions, or nonlinear expression in sessions?

    +   - Are participants shaping what questions are asked, not just answering them?

    +   - If this process were reversed, would I feel safe, respected, and valued?


    What matters is applying them thoughtfully, in context, and with the flexibility
    to adapt. When we design with those most impacted, not just for them, we create
    systems that are more just, more adaptive, and more alive. This isn’t about surface-level
    fixes. It’s about refusing to default. It’s about meeting people where they are,
    holding what they carry, and letting it shape how we build. It’s about honoring
    the humanity behind the data. The most transformative insights don’t live in the
    average. They live at the edge.


    And sure, you won’t always get it right. But inclusion isn’t a checklist, it’s
    a practice. What matters is that we keep choosing it, again and again.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# Centering disabled lives through reciprocal recruitment


    Recruiting disabled participants isn’t just about inclusion, it’s about shifting
    the terms of engagement. When we center disabled lives in recruitment, we begin
    to challenge the unspoken assumptions that exist in how, when, and where we bring
    people in. Recruitment is often transactional: time in exchange for a gift card
    or insights in exchange for a deliverable. But when research stops there, it risks
    becoming exploitative. That leaves people feeling used, not valued.


    Reciprocal recruitment asks something more of us. It asks us to slow down, to
    build trust before the ask, and to create spaces where people can show up fully,
    not just to answer questions, but to shape them. It means inviting people in not
    as subjects, but as collaborators. It also means recognizing that knowledge doesn’t
    only live in transcripts. It also lives in a stillness, a breath, a drawing, a
    moment of mutual understanding. For example, a team working with a Deaf community
    co-designed a research plan alongside a local Deaf advocacy group, hired interpreters
    chosen by participants, and allowed flexible participation over multiple sessions.
    The result wasn’t just better data, it was a model for respectful, sustainable
    engagement.


    While recruitment always involves some exchange, it doesn’t have to be extractive.
    When it’s grounded in trust and reciprocity, it shifts from a one-way transaction
    to a shared investment. It’s relational. And it shifts our goal from participation
    to partnership, and from gathering insights to building something that gives back.


    To support this shift, here are a few foundational principles that guide inclusive
    recruitment practices:


    +   - Build relationships before recruiting. Start with trust, not outreach.

    +   - Compensate fairly and flexibly. Honor time, energy, and emotional labor
    in ways that reflect people’s realities.

    +   - Respect intersectionality. Understand how overlapping factors, such as disability,
    race, gender, class, and language, shape people’s experiences and influence what
    they need to feel safe and supported. For example, a white wheelchair user navigating
    an urban center will likely face very different barriers than a racialized autistic
    person living in a rural area. Intersectionality reminds us that access is never
    one-size-fits-all; it’s influenced by overlapping systems of power, discrimination,
    and privilege. Inclusive research must account for these layered realities or
    risk reinforcing the very gaps we seek to close.'
  merge: -1
  img_proc: true
- pgno: 102
  md: '+   - Co-design the process, not just the output. Share power from the beginning.

    +   - Avoid extractive dynamics. This means going beyond scripted questions and
    one-off engagements. When we treat participants as data sources instead of people,
    we risk commodifying their lived experiences.


    Instead of expecting folks to come to us, go to them. Listen, return, and show
    up with integrity, not just once, but over time. We can’t co-create from a distance.
    That’s why some of the most grounded, respectful research happens through partnerships
    with communities that already hold trust, advocacy groups, cultural organizations,
    and grassroots networks.


    One powerful example is, in one of my research engagements with a community of
    disabled and neurodivergent participants, I partnered with a grassroots advocacy
    group to co-design the recruitment process from the start. Rather than using formal
    consent forms or standard screener scripts, we developed plain language materials
    together. Participants helped identify not just accessibility needs but how they
    wanted to be engaged, with options such as voice notes, drawings, asynchronous
    participation, or sensory-friendly formats. We compensated people based on their
    preferred method and energy levels, with no penalty for opting out midway. Interpreters
    and support people were invited at the participants’ request, not ours. The result
    wasn’t just more honest insight – it was a deeper relationship grounded in trust,
    where participants could influence the research itself, not just respond to it.


    This approach demonstrates the following:


    +   - Careful and collaborative planning

    +   - Flexibility and agency

    +   - Rejection of one-size-fits-all engagement

    +   - Mutual respect and access as the starting point, not as an add-on


    This kind of reciprocity isn’t theoretical; it’s being practiced in real-world
    projects that share power with disabled participants and value their ways of knowing.


    This example isn’t just a moment I remember, but moments that reshaped how I work.
    I share them here not to prescribe but to help others recognize these moments
    in their own lives. The work of inclusive research lives in these shifts – in
    how we listen, what we notice, and how we carry it forward.


    In the next section, we’ll explore how to adapt research methods for accessibility,
    shaping not just who we reach but how we listen, engage, and build research environments
    that honor complexity, support participation, and move at the speed of trust.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# Adapting research methods for accessibility


    Adapting research methods isn’t just a technical challenge; it’s deeply human.
    If we’re serious about centering disabled lives, we can’t just set up a session
    and hope for the best. We need to do the work before the ask, to make sure our
    methods, tools, timelines, and structures are usable, flexible, and safe.


    Participation is never neutral. For many disabled participants, showing up is
    an act of vulnerability, shaped by a history of being left out, misunderstood,
    or expected to adapt without support. There’s a long legacy of research that extracts,
    simplifies, or forgets. Experiences shared generously have too often been met
    with silence.


    I remember a time in my career when I worked on a team made up mostly of disabled
    folks. Three of my colleagues were blind or had low vision, and each navigated
    the digital world in completely different ways:


    +   - One used high-contrast mode and zoomed in 800% on everything, relying on
    screen magnification and visual cues, not a screen reader.

    +   - Another had been blind since birth and used a screen reader alongside a
    braille display, processing content linearly, precisely, with little need for
    spatial orientation.

    +   - The third had lost their sight in their 30s and used a screen reader too,
    but still anchored their understanding of digital layouts in visual metaphors
    where things were supposed to be on the screen, based on muscle memory and residual
    sight.


    This wasn’t a theoretical insight. I saw it firsthand: three blind colleagues,
    one team, and three entirely different ways of navigating the same space – the
    same disability label, but different timelines, tools, and truths.


    It changed how I understood accessibility. It made clear that there is no “universal
    user” and no one right way to engage, and it reminded me that adaptation is not
    optional, it’s foundational. This is why we can’t rush research, why “best practices”
    aren’t always best, and why trust isn’t built in the sign-off but in the small
    decisions: how we show up, how we ask, how we hold space.


    That sense of being valued deepens when participants are treated as collaborators,
    not subjects or data points – when their stories shape the work and don’t disappear
    into a folder. And it holds – really holds – when we follow through, and when
    people can trace the thread between what they offered and what changed because
    of it.'
