- pgno: 86
  md: 'As cultural shifts continue to shape accessibility expectations, organizations
    and policymakers alike must consider how these changes influence public attitudes
    and legal priorities.


    What to keep in mind:


    +   - Public expectations shape corporate responsibility. Representation alone
    is not enough. As disability inclusion becomes more visible, customers, employees,
    and stakeholders will expect companies to deliver on accessibility, not just market
    it. Businesses that fail to keep up risk losing credibility and consumer trust.

    +   - Representation should extend beyond marketing. Disability inclusion is about
    more than showcasing diversity in campaigns – it requires hiring, consulting,
    and working with disabled people throughout the design process. Assumptions and
    stereotypes thrive when people with lived experience aren’t involved in decision-making,
    leading to products, services, and policies that don’t meet real needs.


    As accessibility expectations continue to rise, another key factor influencing
    accessibility policies is the world’s ageing population. As people live longer
    and remain in the workforce later in life, accessibility will need to expand beyond
    disability inclusion and account for age-related changes in vision, hearing, mobility,
    and cognitive function.


    # The impact of an ageing population


    The global population is ageing. In 2022, 770 million people aged 65 or over made
    up 9.7% of the world’s 7.9 billion population. By 2050, the UN projects this number
    to rise to 1.6 billion, or 16.4% of a population of 9.7 billion (UN DESA, 2022).
    This demographic shift will significantly impact workplace accessibility, healthcare
    services, and digital platforms, requiring organizations to design for age-related
    changes in vision, hearing, mobility, and cognition.


    Many of these challenges overlap with existing standards, such as guidelines for
    text readability, high contrast, and keyboard navigation. However, most accessibility
    policies have not yet fully adapted to address the specific needs of an ageing
    workforce and consumer base.


    Governments and economic policy groups are beginning to respond. The World Economic
    Forum’s longevity economy principles and the G7’s Solfagnano Charter highlight
    the importance of involving individuals with disabilities in policymaking and
    designing systems that support healthy ageing, equitable employment, and social
    inclusion (G7 Italia 2024, 2024). As populations continue to age, organizations
    must anticipate stronger accessibility regulations aimed at improving usability
    for older adults. The ongoing transposition of the EAA into national legislation
    by EU member states demonstrates how these principles can translate into actionable
    legal progress and provide a clear model that bears watching.'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'What to keep in mind:


    +   - Age-related accessibility needs go beyond disability inclusion. Older adults
    experience gradual changes in vision, hearing, dexterity, and cognitive function,
    meaning design must account for clear contrast, larger text, and intuitive interfaces.
    WCAG success criteria – including plain language, predictable navigation, and
    larger target sizes for interactive elements – can help address these needs.

    +   - Focusing only on public-facing accessibility while neglecting your own employees
    is a costly mistake. As people stay in the workforce longer, failing to provide
    accessible tools and environments will lead to decreased productivity, disengagement,
    and ultimately higher costs for businesses. Organizations should ensure that internal
    platforms, digital tools, and workplace policies meet accessibility standards,
    not just their customer-facing services.


    As accessibility requirements expand, emerging technologies such as artificial
    intelligence present both opportunities and risks in shaping the future of digital
    accessibility.


    # Addressing accessibility in AI governance


    Artificial intelligence has the potential to significantly improve accessibility,
    but when not designed with diverse users in mind, it can also exacerbate existing
    barriers. AI-driven features such as speech recognition and real-time generated
    image descriptions have transformed access for many people with disabilities.
    At the same time, AI frequently excludes or perpetuates harmful stereotypes when
    trained on limited datasets or developed without human oversight.


    For example, speech recognition technology often struggles with non-standard speech
    patterns, strong accents, or speech impairments, making voice assistants unreliable
    for some users. AI-generated content can also reinforce stereotypes, by producing
    images including wheelchairs or depicting all people with hearing aids to be elderly,
    reflecting the biases embedded in the data it was trained on.


    Governments are beginning to respond to these challenges. The European Union’s
    AI Act and the United States’ AI Bill of Rights reflect a growing consciousness
    of the ethical implications of artificial intelligence and the need for safe,
    inclusive, and transparent system designs. These frameworks align closely with
    accessibility goals and acknowledge AI’s potential to create or eliminate barriers
    in critical areas such as healthcare, education, and employment (European Commission,
    2021; White House, n.d.). As AI adoption continues to accelerate, integrating
    accessibility requirements into AI governance must play a significant role in
    shaping future legislation.'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'What to keep in mind:


    +   - AI is only as inclusive as the data it learns from. When selecting AI models,
    organizations should examine the datasets used for training to ensure they represent
    the full diversity of human experiences, including disability, neurodivergence,
    and non-standard speech patterns. If developing custom AI, teams must actively
    include diverse inputs to prevent bias from excluding or misrepresenting users.

    +   - AI-generated accessibility features should be treated as a supplement, not
    a replacement. Automated captions, alt text, and other AI-driven solutions can
    enhance accessibility but should not be solely relied upon. Human review remains
    essential to ensure accuracy, usability, and contextually meaningful output.

    +   - AI accessibility is becoming a regulatory issue, not just an ethical one.
    As AI adoption expands, companies will be held accountable for ensuring that automated
    systems do not create new accessibility barriers. Staying informed on global AI
    accessibility regulations will be key to maintaining compliance.


    By observing societal movements, increasing authentic media representation, and
    tracking public discourse – whether in evolving attitudes toward ageing populations,
    disability inclusion, or AI regulation – it becomes clear that accessibility laws
    do not exist in isolation. They are shaped by the shifting needs of society. These
    changes highlight the growing expectation that accessibility is not simply a compliance
    issue but a fundamental part of digital and societal progress.


    As these movements continue to gain momentum, individuals and organizations must
    remain engaged, ensuring that inclusion is not an afterthought but a guiding principle.
    This means embedding accessibility into the very culture of how organizations
    design, build, and innovate.


    # Cultivating an ethically driven design culture


    As digital accessibility evolves, organizations must foster a design culture that
    treats inclusivity as an essential part of the creative process. By embedding
    awareness, education, and ethical responsibility into their workflows, teams can
    ensure they create solutions that work for everyone.


    # Awareness as the catalyst for change


    Accessibility gaps frequently stem not from intentional exclusion but from a lack
    of awareness about the diversity of user needs. Designers often focus on aesthetics
    and functionality without realizing how decisions, such as color contrast, screen
    layout, or visual effects, can'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'impact usability for individuals with disabilities or anyone facing situational
    challenges. For instance, someone with low vision may rely on zooming or dark
    mode to reduce eye strain, but these features also benefit users working in dim
    environments or experiencing fatigue after a long day.


    Raising awareness is the first step toward designing inclusively. Designers craft
    experiences for everyone, whether it’s an older user adjusting font sizes for
    comfort, a professional toggling dark mode to reduce eye fatigue, or a friend
    relying on captions in a noisy café. When design decisions reflect real-world
    use cases, they move beyond aesthetics and ensure everyone’s needs are considered.


    # Education as a foundation for action


    Awareness alone is not enough. Teams need actionable knowledge to integrate accessibility
    into their workflows. Standards like WCAG (Web Content Accessibility Guidelines)
    provide a reliable foundation, offering measurable criteria to ensure consistent,
    inclusive design. These standards act as essential guideposts, providing clarity
    and confidence that a product is usable by everyone.


    However, accessibility education cannot rest solely on designers. It must be embedded
    across entire teams, from developers and content creators to testers and leadership.
    Continued education through certifications, workshops, webinars, or support from
    accessibility specialists ensures teams remain current with emerging standards,
    legal developments, and evolving technologies. This shared knowledge also reduces
    barriers to collaboration, streamlines decision-making, and prevents accessibility
    from being treated as an afterthought.


    Investing in education – specifically *ongoing* education – signals that accessibility
    is not optional; it is integral to high-quality, user-centered design.


    # Embedding accessibility into the design process


    Building upon team awareness, an ethically driven design culture integrates accessibility
    into every stage of the design process, from research and prototyping to testing
    and iteration. By identifying and addressing barriers early, teams can create
    more inclusive and thoughtful experiences while avoiding the costly need to retrofit
    accessibility after the fact.


    Designers play a critical role in this process. Incorporating accessibility reviews
    into daily workflows, whether by testing color contrast, ensuring logical navigation
    for keyboard and screen reader users, or considering the impact of visual elements
    like animations, helps embed accessibility into the core of a design.'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'Design culture, by its nature, is never static. It thrives on improvement,
    iteration, and problem-solving. An ethically driven culture embraces accessibility
    as a continuous process, applying the same iterative, problem-solving mindset
    used to improve other design outcomes. This means accessibility must be proactive,
    not reactive – something designers build in, not bolt on.


    Ultimately, designers are not just building products; they are shaping experiences.
    Experiences can be welcoming, thoughtful, and empowering for every user. Or, they
    can exclude, frustrate, and undermine their efforts. By recognizing their influential
    role and embracing accessibility as a hallmark of great design, designers can
    harness their creativity to drive meaningful, beautiful, and lasting change.


    Accessibility cannot rest on one individual or team alone. Collaboration across
    design, development, content, and quality assurance ensures that inclusive principles
    are embedded throughout a product’s lifecycle, creating cohesive and effective
    solutions for all users.


    # Summary


    This chapter explored the intersection of legal compliance and ethical responsibility
    in accessibility. While laws such as the ADA, CRPD, and EAA provide a legal foundation,
    true inclusion requires more than just meeting legal requirements. The hallmark
    of great design is embedding accessibility into culture, processes, and decision-making
    – because accessibility is not just about rules and regulations, it’s about people.


    Whether through AI-driven technologies, shifting societal expectations, or the
    reality of an ageing population, accessibility will impact everyone at some stage
    in their life. By failing to prioritize it early, organizations risk creating
    barriers that exclude users, increase costs, and diminish long-term sustainability.
    But by embracing accessibility as a design principle rather than an afterthought,
    businesses and individuals alike can drive meaningful, lasting progress.


    We examined the limitations of automated testing, the impact of cultural and technological
    shifts on accessibility policies, and the importance of embedding accessibility
    into organizational culture. By understanding these factors, individuals and businesses
    can anticipate legal trends, advocate for ethical design, and implement inclusion
    as a core principle, not just a legal requirement.


    Embedding accessibility into culture and processes is what transforms compliance
    into meaningful inclusion. But knowing the importance of accessibility isn’t enough
    – you need to ensure that the people who will use your products are actually part
    of the design process. In the next chapter, we’ll dive into how user research
    and testing help create accessible digital products that meet real-world user
    needs, not assumptions.'
