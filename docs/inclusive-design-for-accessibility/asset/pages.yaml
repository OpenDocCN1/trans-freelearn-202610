  img_proc: true
- pgno: 266
  md: 'The native HTML `select` element can be completely styled in its collapsed
    state while the options surface styling is provided by the operating system and
    does not require redesign, though future CSS proposals may allow for more styling
    options.


    ![](img/3bdc9e2d41de898f8a3bcc9634b0000e_266_0.png)


    *Figure 10.23: The native HTML select surface in macOS*


    # Carousels


    Carousel slideshows are often a compromise between stakeholders who couldn’t decide
    what content should lead, so they choose all of it. This results in hostile user
    experiences that rarely receive engagement beyond the first slide.


    Future browser features may include native-like support for accessible carousel
    patterns, but this doesn’t mean it’s the best way to convey content. Even accessible
    carousels deliver an additional cognitive load for all people who must learn how
    to navigate its special compound UI and consume its unique content. Is it swipeable?
    Do the arrow keys operate it? How many slides are present? This and more information
    must be conveyed and understood by the user, and people must be appropriately
    motivated to engage beyond the initial view.


    If carousels are an unavoidable component of the design system, help teams use
    accessible carousels wisely to eliminate barriers, reduce cognitive load, and
    add value to the experience:


    +   - Avoid using auto-advance. This creates barriers for people with cognitive
    disabilities and vestibular disorders. If featured, auto-advance must be off by
    default and user-controllable.

    +   - Guide teams to favor predictable information. Carousels work better when
    people can guess what’s coming (e.g., shoe colors and product variations). Avoid
    surprise or disjointed content across slides.'
  merge: -1
  img_proc: true
