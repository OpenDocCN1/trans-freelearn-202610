- pgno: 137
  md: '# Voice commands to enable hands-free interaction


    Voice commands have become an increasingly important interaction method for users
    with mobility impairments or those who prefer voice-based navigation. Designing
    for voice commands involves supporting both basic navigation (e.g., opening menus
    and selecting options) and more complex tasks (e.g., filling out forms and controlling
    multimedia content).


    Within voice commands, multiple considerations come into play when users may be
    using assistive technologies such as Dragon or built-in OS features such as Dictation.
    It’s important to build interfaces optimized for voice-based interaction and accessibility,
    integrating voice navigation across all critical user journeys and interactions
    to provide a fully inclusive experience.


    To do this effectively, designers should keep the following considerations in
    mind:


    +   - **Clear and consistent voice commands:**

    +     - Define a set of natural, simple commands that users can easily learn and
    use

    +     - Ensure voice commands are consistent and intuitive across the interface

    +     - Align command structures with common patterns used in similar products
    or platforms

    +     - Use familiar phrases for key actions (e.g., “Open menu,” “Go home,” or
    “Read aloud”)

    +     - Allow for slight variations in phrasing (e.g., “Go home,” “Go to Home,”
    or just “Home”) to accommodate different user preferences and speech styles

    +   - **Feedback and confirmation:**

    +     - Combine voice-based feedback with visual or haptic cues wherever possible

    +     - Provide visual confirmation – such as highlighting a button or changing
    its state – after a command is executed

    +     - Reinforce interactions with multisensory feedback to help users verify
    that their actions were successful

    +     - Use confirmation cues to make voice interactions more accessible, predictable,
    and reassuring'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'A real-world example is using Amazon Alexa (https://www.alexa.com/), which
    supports voice-controlled navigation across a variety of devices, from smart home
    systems to streaming media. By offering clear, simple commands such as “Play music”
    or “Stop,” users can easily control their devices hands-free. Additionally, visual
    feedback via on-screen notifications or device feedback (e.g., Music is playing)
    ensures clarity. Personalized voice commands can be set up to control devices
    that eliminate the need for keyboard or button clicks.


    # Gesture controls to enhance navigation for touch-free interaction


    Gesture controls have emerged as a powerful input method for users with limited
    mobility or dexterity. By using cameras, sensors, or touchscreens, gesture recognition
    allows users to interact with interfaces through movements such as swipes, pinches,
    or simple hand gestures. Designing for gesture controls requires ensuring that
    gestures are intuitive, consistent, and offer feedback to guide users through
    their tasks:


    +   - It’s important to keep gestures simple, familiar, and easy to learn, so
    as not to cause cognitive overload. Complex or non-standard gestures can be frustrating
    for users with motor disabilities; thus, stick to common gestures such as swiping
    left/right, pinching to zoom, or holding a gesture for activation.

    +   - Interfaces and systems must also provide visual or haptic feedback when
    a gesture is recognized. For example, a swipe gesture might change the screen
    content or trigger a page transition, and a clear animation should confirm that
    the gesture was successful.

    +   - In many cases, it’s valuable to add personalization, as some users may find
    certain gestures physically difficult or uncomfortable. Allowing users to customize
    gesture mappings or substitute gestures with alternative inputs, such as on-screen
    buttons or voice commands, ensures that the interface adapts to their needs rather
    than forcing a one-size-fits-all solution.


    A real-world example is integrating Cephable (https://cephable.com/), a service
    that allows users to enable voice- and gesture-based interaction using their existing
    inputs. Users can control their device with simple gestures, such as raising a
    hand to pause a meeting or swiping to change channels. By combining intuitive
    gestures with clear visual feedback (such as screen animations or color changes),
    this provides an accessible experience for people with limited dexterity.'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# Assistive technologies, including support switches, eye tracking, and more


    Assistive technologies such as adaptive switches, eye-tracking devices, and sip-and-puff
    systems are vital for users with severe motor disabilities. These technologies
    offer a means of interacting with digital systems when traditional input methods
    are not viable.


    It’s crucial to ensure your platform is compatible with these devices, allowing
    users to navigate your site or app effectively. In addition to the previous information
    regarding voice controls and gestures, it’s important to allow users to map actions
    to specific switch inputs or eye movements. For example, a user with limited hand
    mobility might use a switch to perform a mouse click or a keyboard key press.
    All interactive elements must be reachable and can be activated using assistive
    devices, including a logical tab order. The design must ensure the focus indicator
    is visible and easily navigable, and allow actions to be triggered via single
    or multiple inputs.


    Apple’s Switch Control is a system that allows users to control their iPhone,
    iPad, or Mac with a variety of external switches (https://support.apple.com/en-us/118667).
    Users can select and interact with on-screen items by pressing switches that are
    mapped to specific actions. This allows those with severe mobility impairments
    to use Apple products effectively.


    Designing for multimodal inputs – such as voice, gesture, keyboard, and assistive
    devices – is essential for creating accessible experiences. However, it’s not
    enough to apply these techniques in isolated instances. To truly support a diverse
    range of users, it is critical to be able to deploy and maintain all these techniques
    at scale, which is what we will look at next.


    # Scaling designs for improved accessibility


    Designing for accessibility at scale requires creating a flexible and inclusive
    design system that works across a range of user needs and devices. This approach
    ensures that your platform remains usable and accessible as it grows. A well-designed
    system goes beyond visual elements, considering usability, cognitive clarity,
    and consistency across all interactions. It includes elements such as reusable
    components, font readability, user customization, and keyboard navigation, ensuring
    that the platform is usable by everyone, regardless of ability.'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# Building a modular, accessible design system


    A scalable design system is crucial for accessibility. It involves creating reusable
    components (e.g., buttons, forms, and modals) that are thoroughly tested for accessibility.
    These components should be flexible enough to assemble into more complex designs
    without sacrificing accessibility, and this forms a sustainable foundation for
    an accessible platform.


    One way to implement scale is by using reusable components that adhere to accessibility
    standards, such as minimum contrast ratios and compatibility with screen readers,
    and guidelines on how to implement these components. The design system must also
    provide clear documentation on how to implement these components, including how
    to add alt text, structure content for screen readers, and adhere to touch target
    sizes for motor disabilities.


    These pieces ensure that, as the platform evolves, new features will be integrated
    with the same focus on simplicity, consistency, and cognitive support. This applies
    to components such as buttons that meet accessibility standards (e.g., proper
    contrast and screen reader labeling) and are reused consistently across the platform,
    as well as interaction and navigation patterns that are set up for the whole platform.


    # Elements that should be accessible at scale


    Key UX elements such as readability, clear language, and user-friendly navigation
    form the backbone of accessible design. The way these elements support scale is
    by ensuring that the changes are only made once across the design system and UI
    toolkit. Thus, every designer or developer using these elements automatically
    bakes accessibility into their design.


    Here are some key design considerations for elements:


    +   - **Font readability:** Prioritize large, clear fonts with sufficient contrast
    to enhance legibility across devices and user conditions. Avoid decorative or
    overly stylized fonts that can hinder readability. Instead, choose simple, clean
    sans-serif typefaces – such as Arial or Helvetica – that scale well and maintain
    clarity on a variety of screen sizes and resolutions.

    +   - **Color use:** To ensure clarity and inclusivity at scale, always supplement
    color with additional visual cues, such as icons, patterns, underlines, or text
    labels.

    +   - **Guided focus:** Use consistent visual cues – for example, a clearly visible
    focus ring around active elements such as buttons or input fields – to help users
    maintain orientation while navigating. Following the WCAG AAA recommendation,
    this focus indicator should be high-contrast and persistent, ensuring it remains
    visible across all pages and components.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '+   - **Clear language:** Use simple, direct wording and avoid jargon that
    might confuse users, especially those with cognitive challenges. Establish clear
    language guidelines addressing tone and readability levels to ensure content remains
    consistent and easy to understand across the platform.

    +   - **Time-based interactions:** Provide users – especially those with cognitive
    disabilities – with the option to adjust or disable time limits on tasks or interactions,
    enabling them to process information at their own pace. To support accessibility
    at scale, implement these controls consistently across all relevant areas of your
    platform, ensuring users encounter a predictable and accommodating experience
    regardless of context.


    # Empowering personalization through user customization


    Allowing users to customize their interface can significantly improve accessibility.
    A modular design system creates a foundation for personalized experiences, where
    users can adjust the platform to meet their unique needs, such as changing font
    sizes, colors, or layouts. The key to personalization is building responsive and
    dynamic user interfaces that let users control font sizes and color contrast to
    suit their preferences or needs.


    A flexible design must work across different devices, from desktops to mobile
    phones. It should support zooming and text resizing without losing functionality
    or breaking the interface. Consistency across operating systems plays an important
    role in building an inclusive experience. This includes a clear, consistent navigation
    that works across devices and zoom levels. This concept ties to WCAG 2.2 Success
    Criterion 1.4.10: Reflow (Level AA), which refers to the ability of content on
    a web page or app to adapt dynamically, adjusting layout, text size, and positioning
    so that users can view and interact with it without needing to scroll horizontally
    or zoom excessively, even when the display size changes (such as on mobile devices
    or when zoomed in).


    Layout is a vital consideration. The design system should allow customers to rearrange
    sections and ensure that content adapts seamlessly to various screen sizes and
    orientations. A real-world example is Webex, which allows users to customize their
    layout within the meeting experience to be able to pin their sign language interpreter,
    change stage view, hide attendees without video, and many more. This empowers
    users to be able to customize their meeting experience for an inclusive experience
    (https://blog.webex.com/collaboration/fostering-inclusive-and-accessible-communication-with-webex-suite/).'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'Personalization also extends to language and localization. When scaling globally,
    it’s essential to support language customization and localization, which can impact
    layout, content structure, and focus behavior. Some languages (e.g., Arabic) read
    right-to-left, so the layout must adapt accordingly. Others, such as German, may
    require more space due to longer word lengths. Additionally, it’s important to
    maintain clarity and consistency when localizing content, especially for users
    with cognitive disabilities.


    # Information architecture for accessibility


    While accounting for information architecture, account for multi-modal inputs,
    including keyboard-friendly navigation systems. For users with motor disabilities
    or those who prefer keyboard navigation, using the Tab and arrow keys, make sure
    that all interactive elements are accessible via the keyboard. This includes fixing
    tab orders and visual focus indicators to provide users using the keyboard and
    other input devices with a seamless experience.


    It is valuable to organize the tabbing order so that it flows logically, from
    top to bottom or left to right. All the active elements on the page should be
    clearly highlighted (e.g., buttons and form fields) so users can easily track
    their focus, and include keyboard shortcuts where appropriate, ensuring they are
    well documented and customizable.


    Looking at the following figure, although a visual reader might be able to discern
    the hierarchy of buttons and information, naturally moving their attention to
    the Apply Now! section, the tab focus order would create a chaotic experience
    for those just using a keyboard or relying on a screen reader:'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'Figure 5.5: An example of bad tab focus order


    However, in this next figure, the tab focus order has been fixed to create a more
    natural, easy-to-follow pattern:'
