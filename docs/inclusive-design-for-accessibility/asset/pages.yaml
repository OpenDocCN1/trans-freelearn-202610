- pgno: 109
  md: 'Inclusive recruitment isn’t just about who we invite; it’s about how we engage
    participants throughout the process. Disabled participants and marginalized communities
    often carry emotional labor and vulnerability into research spaces. They share
    personal experiences of exclusion and harm, and it’s our responsibility to ensure
    they leave the research feeling seen, heard, and valued.


    Here’s how to embed systems of care and safety into your research practices:


    +   - Provide emotional check-ins before, during, and after sessions

    +   - Offer resources for mental health support or community care

    +   - Ensure accessible communication channels for ongoing trust-building


    Ensure participants can follow up after the session to ask questions, provide
    feedback, or voice concerns. Providing follow-up emails with summaries of research
    findings and next steps helps participants see how their contributions are making
    an impact. Disabled participants often relive exclusionary experiences when participating
    in research, which can be emotionally taxing.


    # Research as a dynamic and human-centered practice


    As you can see, inclusive research isn’t just about improving our methods; it’s
    about rethinking our ways of outreach. It’s about moving from extraction to collaboration.
    From asking for input to building something with it. The goal isn’t to collect
    stories and file them away. It’s to make sure those stories lead to something
    real – something that matters.


    Co-designed testing means involving participants not just in evaluating a product,
    but in shaping the research approach itself, such as deciding what questions to
    explore, what accessibility needs to plan for, or what success looks like from
    their perspective.


    When we embed accessibility into the research process through flexible participation,
    co-designed testing, trauma-informed practice, and emotionally safe spaces, we’re
    not just adding rigor. We’re making the work more human. We’re removing the friction
    that people are so often expected to push through just to be heard.


    But that’s not the finish line.


    Once the insights come in, we have to carry that same energy, that same accountability,
    into how we make meaning of what we’ve heard. Inclusive research doesn’t end with
    participation. It lives in how we interpret, how we hold complexity, and how we
    notice patterns without overly simplifying them.'
