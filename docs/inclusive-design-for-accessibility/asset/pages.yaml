- pgno: 217
  md: '# Adaptive layouts


    As you start testing your applications across different information densities,
    you will certainly come across a situation where your application doesn’t function
    well in one. In these situations, it can be helpful to allow your application
    to use space differently based on the device it is installed on. There are a few
    common techniques for this:


    +   - Adding a column or changing the number of columns in a multi-column layout.

    +   - Having a portion of your application permanently visible, such as a menu
    on the left.

    +   - Splitting your application into multiple panes, such as in a master detail
    workflow.


    You can also consider custom design solutions with adaptive layouts, however,
    it’s important to remember that your developers will need to account for things
    that they can get for free from platform layout containers in the above methods.
    This can lead to inconsistencies and bugginess in UI code that is difficult to
    get completely correct. This balance of achieving your design goals while utilizing
    platform tools is important to consider early in your design process.


    # Utilize standard tools


    The final tip is to leverage the learnings of the platform creators. Apple and
    Google dominate the ecosystem because they have done their research well and know
    their platforms and their users. They also hold a lot of control over the future
    direction of their platforms and make every effort to provide backward compatibility,
    particularly for those aspects of their ecosystem documented in their respective
    design guidelines:


    +   - Apple: Human Interface Guidelines (https://developer.apple.com/design/human-interface-guidelines)

    +   - Android: Material Design Guidelines (https://m3.material.io/)


    By leveraging the knowledge and components in these documents, you save time and
    maintenance pain by utilizing system components and designing applications that
    fit what the platform already does. Going too far outside of this bubble will
    leave you struggling to keep up with an ecosystem that is driven to provide users
    with new experiences on a yearly basis.'
  merge: -1
  img_proc: true
- pgno: 218
  md: '# Summary


    In this chapter, you learned how to design mobile applications that work effectively
    across a wide range of devices, peripherals, and user capabilities. By categorizing
    devices according to information density, leveraging platform-specific capabilities,
    and using default components, you can provide a consistent and accessible experience
    without the need to test for every possible device individually.


    This information is valuable because it allows developers to build adaptable,
    resilient applications that remain compatible as platforms evolve. By aligning
    your designs with Android and iOS guidelines, you save development time, reduce
    maintenance efforts, and benefit from continuous improvements offered by the platforms.
    Staying within their ecosystems ensures that your application remains accessible
    and modernized without extra effort.


    In the next chapter, you’ll explore how to design accessible experiences within
    emerging technologies like virtual reality, augmented reality, and artificial
    intelligence. As these platforms grow, ensuring accessibility becomes more challenging
    but also more essential. You’ll learn practical techniques for creating inclusive
    experiences, from making virtual environments navigable to ensuring AI-driven
    interactions are responsive to diverse needs. By applying accessibility principles
    to these cutting-edge technologies, you can build more inclusive and innovative
    applications.'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# Part 3


    # Advanced Strategies

    and Implementation


    The final section of the book explores how to scale accessibility beyond individual
    interfaces and into organizational practices, team culture, and emerging technologies.
    These four chapters help you deepen your impact by focusing on inclusive mobile
    design, testing and remediation strategies, and fostering a company-wide commitment
    to accessibility.


    You will learn how to design for mobile touch and voice interactions, evaluate
    accessibility using both automated tools and manual audits, and build inclusive
    design systems that serve a wide range of user needs. Finally, the section concludes
    with a roadmap for creating a sustainable accessibility culture—one grounded in
    empathy, shared responsibility, measurable progress, and continuous learning.
    Together, these chapters equip teams to move from reactive fixes to proactive,
    inclusive design leadership.


    This part includes the following chapters:


    +   - Chapter 9, Accessibility in Emerging Technologies: VR, AR, and AI

    +   - Chapter 10, Foundations of Accessible Design System Patterns

    +   - Chapter 11, Tools and Techniques for Accessible Evaluation and Prioritization

