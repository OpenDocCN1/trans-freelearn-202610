- pgno: 239
  md: '# 10


    # Foundations of Accessible Design System Patterns


    By Charlie Triplett


    Foundations for structures must provide a robust platform for everything being
    built on top. Design system documentation often relies on such metaphorical concepts,
    and when we apply physical ideals to accessibility, we find a deeper meaning that
    will affect our techniques and priorities.


    Any physical structure must be designed and built with an understanding of all
    forces that will be placed upon it – not just the aesthetics. If a structure is
    built in an earthquake zone, naturally, it must prioritize geotechnical stresses
    – but it still has to resist other natural events such as rain, snow, ice, and
    wind. A foundation that can resist an earthquake but erodes in a rainstorm is
    not a success.


    Likewise, a shallow design system that considers only one assistive technology
    without first digging deeper to support all the surrounding and intersectional
    disabilities will be just as unsuccessful – this chapter will help you avoid that
    trap.


    Screen readers are the most intensive and dazzling piece of assistive technology
    often demonstrated by accessibility experts, and for good reason. Many are still
    unaware that people who are blind can even use computers or smartphones, and this
    revelation has a great impact.'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'However, the power of screen readers has led to an over-reliance on them as
    the primary reason for accessible practices, leading to an over-emphasis on supporting
    screen readers themselves as meaning “accessibility,” instead of considering people
    with disabilities.


    ![](img/3bdc9e2d41de898f8a3bcc9634b0000e_240_0.png)


    Figure 10.1: How teams who''ve only been introduced to screen readers think they
    need to expend their efforts


    But, of course, there are people with disabilities other than blindness who need
    us to remove barriers, and they’re not even using any assistive technology such
    as screen readers or relying on devices such as keyboards:


    +   - People who would say they don’t even have a disability encounter barriers
    daily when text is too small to read or text contrasts too little against its
    background, especially when increasing the default font size has no effect

    +   - People having color vision deficiency encounter obstacles when colors alone,
    such as red and green, indicate meaning

    +   - Full-screen video takeovers can cause motion sickness in people with vestibular
    disorders

    +   - Someone who is deaf or hard of hearing can prefer a transcript of a video,
    rather than consuming an entire video and watching synced captions

    +   - Someone who doesn’t speak another language fluently can have difficulty
    completing complex forms

    +   - People with speech disabilities might seek a live chat feature, rather than
    phoning customer service'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'To actually create an accessible design system, it must remove barriers for
    all people, laying a broader and thoughtful UX foundation for those using screen
    readers and those with intersectional disabilities.


    ![](img/3bdc9e2d41de898f8a3bcc9634b0000e_241_0.png)


    Figure 10.2: A more effective approach to design systems, thinking about people
    first, not just technology


    This chapter breaks down accessibility challenges in everyday design patterns
    and components from a people-first perspective. It covers practical guidance for
    structuring design systems in a manner that nudges consuming teams to design and
    build with accessibility by default, without having to patch in accessibility
    later.


    First, we will consider how to design for people using no assistive devices or
    simply device accessibility settings:


    +   - Low vision

    +   - Color perception

    +   - Deaf or hard of hearing

    +   - Cognitive disabilities

    +   - Motor: designing for imprecise movement

    +   - Motion sensitivity'
  merge: -1
  img_proc: true
- pgno: 242
  md: '+   - Photosensitivity

    +   - Speech disabilities


    Then, with these considerations complete, we will look at designing for people
    using assistive technology:


    +   - Motor: designing for assistive devices and software

    +   - Very low vision or blindness

    +   - Intersectionality of disabilities


    By the end of this chapter, you will recognize potential barriers people with
    disabilities face, possess a framework for evaluating what people need and how
    to plan a robust design system – all in the right sequence to maximize inclusion.


    # Low vision


    When all people are taken into account, beginning with low vision, it becomes
    clear we are actually designing to remove accessibility barriers for over half
    the population.


    According to The Vision Council, 63.7% of adult Americans wear prescription eyeglasses,
    and in 2018, 92.4% of US Medicare beneficiaries aged 65 years or older reported
    that they used glasses. These same people wouldn’t say they have a disability
    or need accessibility help because their eyeglasses or contacts (forms of assistive
    technology) correct their vision.


    As we age, our eyesight changes too. Around half of people use dynamic text to
    bump up the text size on their mobile devices. These are people who might not
    be using reading glasses and certainly wouldn’t think of themselves as having
    a disability.


    The Dutch Appt Foundation survey (https://appt.org/en/stats) found the following:


    +   - 45% of the Dutch iOS users surveyed have one or more accessibility settings
    (such as enlarged text size) activated on their phones

    +   - 15% use two or more accessibility features on iOS

    +   - 61% of the Dutch Android users surveyed have one or more accessibility settings
    activated on their phone and 25% use two or more accessibility features


    By accommodating low vision first, valuable affordances cascade to the rest of
    the design system for people with other disabilities. The design system must be
    robust enough for dynamically resized typography, define the intent of color and
    typography assets, be flexible enough to reflow based on browser settings, and
    recognize alternative ways people experience the UI.'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# Planning for dynamic typography


    People must be able to change the default size of text up to 200% on the web,
    or as the settings allow on the specific platform, browser, or operating system.
    Notice that this is not the same as using the Cmd+ or Ctrl+ keys to zoom in with
    the browser.


    If fonts cannot increase or the layout doesn’t accommodate larger text, not only
    does the interface become unreadable or even appear broken but anyone translating
    the UI into another language will also encounter a broken layout (for example,
    translating from English to French).


    Text must be able to increase in size without breaking its container or becoming
    partially or fully hidden, independent of an arbitrary specific layout height
    or width being available. All objects in the system must accommodate a robust
    variety of typographic conditions (including changing the default font family
    itself). When creating design patterns, demonstrate how the feature will adapt
    to larger text.


    # Enabling web browser zoom


    People with low vision often rely on browser zoom (using keyboard shortcuts like
    Cmd+ or Ctrl+) to enlarge everything on a page.


    The best way to accommodate this is to document and guide teams consuming the
    design system to use responsive mobile-first design and development practices.
    Rather than thinking of zoom as a separate feature, it helps to understand that
    zooming essentially resizes the entire viewport as if viewing the content on a
    smaller screen.


    Specifically, the WCAG SC 1.4.10: Reflow guideline generally expects a UI to function
    without scrolling in two different directions in a viewport of 320 CSS px for
    a vertically scrolling page, or a height of 256 CSS px for horizontal scrolling
    content. For example, this means when your responsive mobile-first design begins
    at 320 px as the smallest viewport, your UI conforms without any additional effort.


    # Delivering intentional typographic patterns, not just assets


    While a design system should give as much creative license to consuming teams
    as possible, that same license will create inaccessible patterns if left unchecked.
    There is no more important guidance than the usage of typography, and because
    of its nuance and technicality, design systems must be prescriptive about their
    intended usage.'
  merge: -1
  img_proc: true
- pgno: 244
  md: '# Font scaling and font size: understanding the difference


    When planning typographic patterns, it’s crucial to understand how font scaling
    and font size differ – and why this matters for accessibility:


    +   - **Font size** refers to the numerical value assigned to text, such as 16
    px or 1 rem. It’s a code-level instruction that tells the browser or device how
    large the text should be.

    +   - **Font scaling**, on the other hand, is about how the typeface itself renders
    visually at that size. Factors such as x-height, stroke weight, and letter proportions
    affect how large or small a font actually appears on the screen. Two different
    typefaces assigned the same font size might appear significantly different in
    optical size because of these characteristics.


    Design systems must account for both font size and font scaling to ensure text
    remains readable and meets accessibility standards. A brand font that renders
    smaller than a standard font at the same size may need to be assigned a larger
    size to compensate for its visual scale.


    For example, commonly available Arial renders at a scale true to its assigned
    pixel line height. 16 px Arial will optically measure 16 px of height from the
    top of the tallest letter to the bottom of the lowest descending letter. (This
    may vary slightly based on the browser’s rendering engine.) However, a different
    typeface might render optically smaller despite being assigned the same font size.
    In the following example, even though the code stipulates a font size of 16 px,
    the custom brand font with poorly adjusted scaling renders noticeably smaller.


    ![](img/3bdc9e2d41de898f8a3bcc9634b0000e_244_0.png)


    Figure 10.3: Mismatched scaling affects font size rendering


    # Text contrast


    All people using a handheld device will experience situations where visibility
    is poor. For example, when a smartphone is used outside in bright sunshine, the
    screen is comparatively dim and difficult to read. Likewise, when a screen is
    dimmed to conserve battery, low-contrast text and graphics become obstacles for
    everyone.


    This table lays out the generally accepted color contrast requirements for text.
    As detailed previously, because different typefaces can render at different scales,
    the CSS pixels must be interpreted optically, rather than simply through their
    defined pixel size.'
  merge: -1
  img_proc: true
- pgno: 245
  md: '| Optical CSS pixels | Weight | Ratio |

    |---|---|---|

    | <24 px | Normal | 4.5:1 |

    | >=18 px | Bold | 3:1 |

    | >=24 px | Normal | 3:1 |


    *Figure 10.4: General text size and contrast guidance*


    For people with low vision, sufficient contrast of text against its background
    is crucial to removing barriers to consuming content. Text that meets contrast
    requirements in one context may present a barrier in other contexts, as in this
    example:


    This 18px dark gray [#222222] text contrasts 16:1 against pure white [#ffffff],
    easily meeting contrast requirements.


    This 18px medium gray [#767676] text contrasts 4.5:1 against pure white [#ffffff],
    barely meeting contrast requirements.


    This 18px medium gray [#767676] text contrasts 3.9:1 against light gray [#eeeeee],
    not meeting contrast requirements for small text.


    This 18px bold medium gray [#767676] text contrasts 3.9:1 against light gray [#eeeeee],
    meeting contrast requirements for bold text.


    This 24px medium gray [#767676] text contrasts 3.9:1 against light gray [#eeeeee],
    meeting contrast requirements for large text.


    *Figure 10.5: Contrast and sizing examples*


    # Informative graphics contrast versus stroke width


    Informative graphics, such as icons or status indicators for controls, must accommodate
    low vision as well when they identify the name, role, or state of UI components.
    Solid thick shapes,'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'such as an alert icon, must only meet a 3:1 contrast ratio, but a minimalist
    hamburger menu icon using 1 px strokes must meet a 4.5:1 contrast ratio:


    | Stroke width | Ratio |

    |---|---|

    | 1 px | 4.5:1 |

    | >=2 px | 3:1 |


    *Figure 10.6: General graphic stroke width and contrast ratio*


    # Guide color choices, don’t just deliver a palette


    Teams consuming the design system for their product design and development should
    be given text color and background pairings that meet contrast standards. While
    multiple tools exist to perform mathematical analysis of color pairings and produce
    a table of acceptable combinations, not every combination is visually desirable.
    Deliver examples of acceptable patterns and tasteful usage so consuming teams
    can make good choices.


    # Accessible color combinations


    ![](img/3bdc9e2d41de898f8a3bcc9634b0000e_246_0.png)


    *Figure 10.7: Automated tools such as toolness.github.io/accessible-color-matrix
    can be used to identify accessible color pairings tables.*'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'We must avoid 100% white paired with 100% black. For people with astigmatism,
    this stark contrast can cause text to appear uncomfortably vibrant, especially
    with white text on a black background.


    # Affordances for magnification tools


    People with very low vision may also use magnification software, allowing them
    to magnify very small portions of their screen. On handheld devices, this often
    means pinching/zooming in.


    Seeing only a small portion of the screen at a time means people with low vision
    will struggle to find content and controls arbitrarily scattered across the page.


    While some controls are unquestionably grouped with their labels, such as checkboxes
    or radio buttons, toggle switches and expanders are often separated to opposite
    sides of the content, creating barriers for people with low vision.


    ![](img/3bdc9e2d41de898f8a3bcc9634b0000e_247_0.png)


    Figure 10.8: Checkboxes and radio buttons are almost universally arranged with
    a control and label in close proximity to each other


    Meanwhile, these toggle switches and expanders have been allowed to fill the available
    space, no doubt satisfying to the design manager but problematic for people with
    low vision:


    ![](img/3bdc9e2d41de898f8a3bcc9634b0000e_247_1.png)


    Figure 10.9: These toggle switches and the expander all create barriers for people
    with low vision'
  merge: -1
  img_proc: true
- pgno: 248
  md: 'Someone viewing their screen using magnification will struggle to understand
    the relationship between these labels and controls.


    Placing all controls and indicators in direct proximity to the text label helps
    everyone. If you must place the control indicator opposite the label to the right,
    set a maximum width for the component.


    ![](img/3bdc9e2d41de898f8a3bcc9634b0000e_248_0.png)


    Figure 10.10: Placing the toggle switch and expander control indicators in proximity
    to their label helps everyone


    With these barriers removed for people with low vision who may be using magnification,
    browser zoom, or just changing default font sizes, a design system will become
    a foundation that creates a better experience for all.


    # Color perception


    People with color blindness, also known as color vision deficiency, have difficulty
    or an inability to distinguish between certain colors. This impacts roughly 1
    in 12 men and 1 in 200 women (8% of the population) and means that tasks involving
    color perception, such as identifying traffic lights or sorting clothes, can be
    troublesome.


    When it comes to design, using green and red to indicate the success or failure
    of a process becomes a barrier for people who are unable to perceive the difference
    between those colors.


    ![](img/3bdc9e2d41de898f8a3bcc9634b0000e_248_1.png)


    Figure 10.11: Without the aid of color, it’s impossible to discern the difference
    between these two error messages'
  merge: -1
  img_proc: true
- pgno: 249
  md: 'Instead, include text to convey a status such as success, alert, or warning.
    Spend at least as much time on content strategy as you do on picking the perfect
    alert icon. While intuitively meaningful icons can be used, it’s rare that they’re
    more useful than actual words.


    ![](img/3bdc9e2d41de898f8a3bcc9634b0000e_249_0.png)


    *Figure 10.12: These success and error messages do not depend on icons or color
    alone to convey meaning, and instead use actual words to help discern the differences
    between the error messages*


    Once again, by ensuring that the design system doesn’t rely on color but rather
    uses text to convey meaning, it adds affordances that will cascade downward for
    people with cognitive disabilities and people using screen readers.


    # Deaf or hard of hearing


    Design system audio and video features must provide accessibility through two
    key features:


    +   - Closed captions

    +   - Transcripts


    Both features benefit not just D/deaf and hard-of-hearing users but also people
    with other lived experiences, such as non-native speakers, neurodivergent users,
    and people in distracting or quiet environments.


    # Closed captions


    Closed captions are synchronized text representations of spoken words, sounds,
    and important audio cues in a video. They allow people who cannot hear audio –
    or who struggle to process it in certain environments – to follow along with the
    content. Closed captions are essential for D/deaf and hard-of-hearing users but
    are also widely used by people in noisy spaces (such as airports), people who
    are non-native speakers, and even by those with sensory sensitivities.'
  merge: -1
  img_proc: true
- pgno: 250
  md: 'Design systems should do the following:


    +   - Make captions toggleable. Users should be able to easily turn captions on
    and off within the video player.

    +   - Ensure captions are synchronized. They must appear in real time, accurately
    representing spoken content and important sounds (e.g., laughter, door slamming,
    etc.).

    +   - Use legible styles. High-contrast text, adjustable font size, and good placement
    options improve readability across devices and screen sizes.


    # Transcripts


    Transcripts are full-text versions of audio or video content. Unlike captions,
    they aren’t necessarily synchronized with the media but provide the complete text
    that can be read independently.


    Transcripts benefit a broad range of users:


    +   - Screen reader users can navigate the transcript more quickly than scrubbing
    through audio

    +   - Non-native speakers can reference the transcript for unfamiliar words or
    phrases

    +   - People with low bandwidth can read the content without waiting for the video
    to load


    Design systems should do the following:


    +   - Provide a clearly labeled link or button to download or view the transcript

    +   - Place the transcript near the video player or in a dedicated, easy-to-find
    tab (never hidden behind obscure menus)

    +   - Include meaningful headings and structure in transcripts to aid scanning
    and comprehension


    As you can see, captions and transcripts are more than just technical features
    – they are bridges to inclusion, connection, and equitable access to content.
    By embedding these affordances into design systems with thoughtful placement and
    intuitive toggles, teams create products that meet real needs in real contexts.


    # Cognitive disabilities


    Cognitive disability refers to a range of differences that affect an individual’s
    ability to process, learn, remember, and solve problems.'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# Use plain language in plain sight


    First of all, you should recognize that people aren’t always rich in time, attention,
    and focus to consume, search for, understand, and effectively use your products.
    Anyone can be affected by a hectic schedule, a noisy environment, or drowsiness
    from a cold medicine. Likewise, people with cognitive differences may need extra
    time to complete tasks or recall information.


    If people can’t find, consume, and understand the content, they can’t use your
    product. Through style guides and design pattern examples, encourage teams to
    avoid jargon, idioms, marketese, and specialty phrases.


    Discourage consuming teams from hiding important information behind tooltips,
    dialogs, or expanders. Hidden information will not be as readily consumed as useful
    information placed in visual proximity to decisive UI features.


    # Affordances for text inputs


    Cognitive load increases for all people when all text fields are the same size.
    Instead, define rules for sizing text fields based on the expected input.


    For example, if a field asks for the birth year, the field should be wide enough
    to contain four characters, but not more. This gives all people the ability to
    intuit the function of controls and input fields at a glance, both increasing
    the speed at which everyone can fill in form data while simultaneously reducing
    errors.


    # Encourage autocomplete


    People invented computers to do repetitive work, and inputs using autocomplete
    attributes allow just that. When forms don’t use or allow autocomplete, the friction
    to filling in forms correctly increases for all people. For people with motor
    disabilities who are using switch devices or alternative navigation, this can
    be an especially tedious and frustrating barrier.


    # Discourage distractions


    People with difficulty focusing need distraction-free interfaces. For them, an
    autoplay video or background animation that cannot be quickly paused can mean
    a UI is unusable. Meanwhile, popups trying to upsell in the middle of a transaction
    can cause irritation (even for those who have no problem focusing), and push users
    elsewhere. To solve this, it’s simple: if it’s annoying, it’s not accessible.
    Set strict guidance on how dialogs, modals, and alerts can be used.'
  merge: -1
  img_proc: true
- pgno: 252
  md: 'By prioritizing plain language, sensible input design, and minimal distractions,
    design systems can foster a more inclusive experience that empowers people with
    cognitive disabilities to participate fully.


    # Motor disabilities: designing for imprecise actions


    Design can accommodate people with motor disabilities who simply have difficulty
    precisely interacting with the UI but aren’t using other assistive technology.


    It’s not difficult to understand that bigger buttons are easier to click on for
    everyone. People with difficulty using a mouse or tapping their screen with precision
    will encounter barriers when buttons are too small or packed too closely together.


    To help, encourage mobile-first design with generously sized controls. While it’s
    common for consuming teams to feel pressured to make densely featured interfaces,
    the design system examples and documentation must provide examples supporting
    an accessible target size.


    To meet minimal WCAG AA target size requirements, objects must be 24x24 px in
    size with a 4 px margin. A more generous size of 44x44 px meets WCAG AAA and HIG
    requirements, and Android Material Design calls for a 48x48 dp minimum size.


    ![](img/3bdc9e2d41de898f8a3bcc9634b0000e_252_0.png)


    Figure 10.13: WCAG AA minimum target size and AAA target size


    For HTML-based controls such as checkboxes, radio buttons, expanders, and switches,
    the entire label must also be clickable, not just the control itself.


    ![](img/3bdc9e2d41de898f8a3bcc9634b0000e_252_1.png)


    Figure 10.14: Web-based controls such as switches must activate when clicking
    on the label and the control itself'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'By designing generous touch targets and ensuring entire labels are clickable,
    teams can remove barriers for people with motor disabilities – creating interfaces
    that feel intuitive and usable for everyone. A design system that champions these
    affordances not only meets accessibility standards but also delivers a more inclusive
    experience.


    # Motion sensitivity


    People with vestibular disorders can be made ill by sweeping animations or videos.
    Designs using parallax scrolling or auto-playing full-screen videos can literally
    make someone sick for hours, causing dizziness, nausea, or disorientation.


    # Respecting reduced motion settings


    Start by documenting how autoplay video and animations must respect the device’s
    **Prefers Reduced Motion** settings. This system setting, available in most operating
    systems, is detectable in browsers and by native mobile applications, indicating
    a preference for less motion or animation. For example, when a user has enabled
    this setting, design systems should disable parallax effects, slow down or remove
    transitions, and pause automatic animations unless user-triggered.


    # Plan ahead for changes to motion


    The design system must document how video or animation will react to being turned
    off. For example, if a hero banner features a looping background video, provide
    a static fallback image with similar branding or messaging. For micro-animations,
    replace them with subtle fades or highlights that convey the same meaning without
    inducing motion sickness.


    # Feature easy-to-find controls


    Any autoplay videos must include intuitive, easy-to-find controls for pausing
    or stopping playback. Avoid burying these controls in nested menus – ideally,
    position them near the video itself with clear labels such as **Pause animation**
    or **Stop motion**. For background animations (e.g., moving gradients or background
    effects), offer toggles or switches so users can easily disable them if needed.


    Design systems that respect motion sensitivity build trust with users by prioritizing
    comfort and well-being. By offering flexible motion settings, fallback visuals,
    and easy-to-find controls, teams create interfaces that empower people with vestibular
    disorders to engage safely and confidently.'
  merge: -1
  img_proc: true
- pgno: 254
  md: '# Photosensitivity


    People with photosensitivity carefully manage their exposure to digital environments
    to reduce the risk of seizures or illness. Triggers include flashing lights (such
    as strobe effects) or certain high-contrast visual patterns, such as stripes,
    grids, and checkerboards. For some, even subtle flickers can cause dizziness,
    headaches, or disorientation.


    # Set clear guidelines


    The design system must establish clear guidelines for all animations and videos,
    ensuring that any content qualifying as flashing does not exceed three flashes
    per second. This aligns with WCAG 2.2 Success Criterion 2.3.1 and helps protect
    users with photosensitive epilepsy.


    # Provide warnings and options


    Video or animation features must consider where to intuitively place warnings
    within the interface if photosensitive content is present. Placement will naturally
    vary depending on the platform – web, smartphone, tablet, or TV – but should always
    be consistent and easy to find.


    Plus, you should also:


    +   - Include a clear, readable label such as **Warning: Flashing content may
    affect photosensitive users.**

    +   - Offer toggles to opt in or out of high-motion effects. For example, allow
    users to disable parallax scrolling, background videos, or dynamic gradients.


    # Test for safety


    The design system should document how to test content using automated tools such
    as the **Photosensitive Epilepsy Analysis Tool (PEAT)** software from the Trace
    Center at the University of Maryland (https://trace.umd.edu/peat/). Additionally,
    consider collaborating with accessibility specialists or user research participants
    who have photosensitivity to ensure a real-world, lived experience perspective.
    Work with users with photosensitivity to understand their experiences and needs,
    and validate solutions.


    # Additional tips


    As well as the previous information, consider these tips:


    +   - Avoid high-contrast flashing between light and dark colors

    +   - Test not only isolated features but also complex interactions, such as transitions
    that combine multiple visual effects'
  merge: -1
  img_proc: true
- pgno: 255
  md: '+   - Incorporate a consistent approach across all design patterns, including
    marketing, onboarding, and interactive features


    By building these practices into the design system, teams ensure that people with
    photosensitivity can navigate digital experiences safely and confidently – without
    the risk of triggers.


    # Speech disabilities


    When we think inclusively, we can understand that many people without disabilities
    dislike voice calls. It takes time, it can become a cumbersome social interaction,
    and if the conversation is difficult or unpleasant, such as canceling a service
    or concerns a delicate personal matter, a phone call can be an uncomfortable and
    anxious experience to be avoided.


    Voice conversations and systems using voice recognition often create barriers
    for people with speech disabilities. If the only way to place an order or receive
    customer support is through voice channels, this represents a barrier. Engaging
    with people with speech disabilities early in the design process helps identify
    these barriers and co-create alternative solutions.


    While WCAG rules don’t call out specific success criteria covering speech or voice
    disabilities, we can derive an approach of providing consistent alternatives:


    +   - If teams are using the design system to add product features such as voice
    assistants and speech-enabled apps or will be relying on interactive voice response
    (IVR) phone systems (e.g., “Say the name of the department you’re trying to reach”),
    the design system must guide teams to provide non-voice alternatives at every
    step.


    +   - Add clear visual and text-based alternatives – for example, a chat interface,
    SMS option, or email support – so users can choose their preferred communication
    method.


    +   - Prioritize asynchronous options so users aren’t forced into real-time interactions
    that can cause stress or anxiety. Offering accessible alternatives also benefits
    users who might be in loud environments, have poor reception, or simply prefer
    typing.


    +   - Provide consistent, easy-to-find options to switch between voice and non-voice
    channels. For example, during an IVR phone call, allow users to press a number
    to connect with a text-based support channel or request a transcript.


    +   - Include explicit guidance on the role of captions or transcripts within
    voice-enabled products. For example, voice assistants should be able to display
    text-based confirmations and results. This empowers people with speech disabilities
    to understand and navigate the system without relying on voice alone.'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'At this point, having removed barriers for people with different disabilities
    such as low vision, cognitive, motor, and photosensitivity, our design system
    is now primed to offer affordances for people who use assistive technology such
    as keyboards, switch devices, and screen readers.


    # Motor disabilities: designing for assistive devices and software


    People with severe motor disabilities use assistive technology ranging from keyboards
    to more sophisticated and often customized switch devices. It’s crucial that the
    design system encourages consuming teams to consider these kinds of assistive
    technology as it is a prerequisite for screen reader accessibility.


    It’s important to understand the fundamental difference between navigating a UI
    using a mouse versus using assistive technology such as a keyboard. People using
    a mouse are in control, like driving a car around a city: free to drive around
    the screen in any order. Using a keyboard is more like being on a train, experiencing
    the content and controls in a linear guided journey. Each stop on the route is
    mandatory.


    # Single point activation


    We will all be in situations where complex operations on touch devices aren’t
    possible because of the environment (such as walking in a busy street) or because
    of distractions (such as carrying a fussy animal). But also people using a keyboard
    or switch device will not be able to perform complex gestures such as swiping
    or dragging with precision.


    In these cases, the ability to perform an operation with a single tap increases
    everyone’s ability to complete a task. Provide a single-point method of operation
    for compound features such as navigating draggable controls or (if unable to omit
    them from the system) carousels.


    # Accommodate landscape, portrait, and upside-down orientations


    Everyone experiences the need to consume content on a handheld device in multiple
    orientations. For example, you may be browsing content on a plane using those
    seatback pop-out tray thingies. However, people with motor disabilities may use
    a handheld device that is permanently mounted and unable to be rotated. If the
    UI isn’t usable in all orientations, this becomes a barrier.'
  merge: -1
  img_proc: true
- pgno: 257
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 258
  md: 'Defining focus styles includes where to place focus outlines. For example,
    following default HTML focus patterns, this group of checkboxes places focus on
    the styled checkbox itself:


    ![](img/3bdc9e2d41de898f8a3bcc9634b0000e_258_0.png)


    *Figure 10.16: These WCAG-compliant checkboxes add a focus outline around the
    styled checkbox*


    This checkbox group places the focus around the entire label:


    ![](img/3bdc9e2d41de898f8a3bcc9634b0000e_258_1.png)


    *Figure 10.17: These WCAG-compliant checkboxes add a focus outline around the
    checkbox label*


    But don’t overdo it. Remember, the purpose of focus indication is to let the user
    know which control is ready for interaction. For example, do not wrap a text input,
    label, and helper text in a focus outline. The surrounding text is not a control,
    so it must not appear as focusable.


    ![](img/3bdc9e2d41de898f8a3bcc9634b0000e_258_2.png)


    *Figure 10.18: Labels and descriptive text must not be outlined on focus*


    In short, just let the browser do what it already does: indicate a focus on the
    interactive focusable element, not the surrounding text, card, or section.'
  merge: -1
  img_proc: true
- pgno: 259
  md: '# Accommodate alternative navigation


    Some people rely on entirely different ways of navigating digital interfaces,
    such as voice control, eye tracking, or switch scanning systems. These alternative
    methods are used by people with very limited mobility, speech disabilities, or
    those who simply prefer hands-free interaction.


    People using voice control (such as *Dragon NaturallySpeaking* or built-in mobile
    OS commands) need to be able to refer to what they see on the screen in a predictable,
    verbal way.


    For that reason, UI controls and text must be clearly and uniquely labeled. You
    can think of words like a picture made of letters that have meaning. For example,
    instead of using a trash can icon button for canceling an order, you can use the
    word **Cancel**. Instead of a paper plane icon button to send a message, you can
    use the word **Send**. Both of these examples allow someone using voice controls
    to perform this action in a single command.


    So, design systems for websites and applications cannot skip accommodating keyboard
    accessibility, not just because it is clearly a prerequisite for people using
    screen readers but also because barriers can exist for keyboard users that aren’t
    barriers when using a screen reader. Next, let’s look at how design systems must
    remove barriers for people who are blind or have very low vision.


    # Very low vision or blindness


    The previous sections have removed many of the challenges of designing for people
    using screen readers, who will benefit from all of the affordances already discussed:


    +   - Flexible layouts accommodating all devices, orientations, and viewport sizes
    work well for people using a screen reader because they may be using a handheld
    device or be unaware of their desktop screen’s resolution or browser window size.
    In fact, they may not have a desktop monitor at all – why bother if you can’t
    see it?

    +   - Meaningful heading structure allows the screen reader to skim through content,
    surfacing useful information.

    +   - Transcripts make it easier to consume audio content, and audio descriptions
    make it possible to consume videos containing important visual information.

    +   - Content that doesn’t rely on color alone to convey meaning will use words
    to convey meaning.

    +   - A language that doesn’t rely on nuanced marketese or jargony language can
    be pronounced correctly by screen readers.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '+   - Autocomplete helps reduce errors for everyone while speeding up form
    completion.

    +   - Focusable controls in meaningful sequence lead people using a screen reader
    on a guided linear journey through the UI.


    These considerations lay the groundwork for creating design systems that not only
    comply with accessibility requirements but also truly empower people who are blind
    or have very low vision. Now we’ll explore how design systems can further support
    these users by addressing headings, focus management, alternative text, and assistive
    technology considerations.


    # Choose a non-semantic typographic naming convention


    The design system must adopt a naming convention that doesn’t rely on numeric
    identifiers to indicate size and weight but focuses on the intended usage and
    style of the text. These simple examples allow for any style to be applied to
    any heading level. In this manner, h1 can be the smallest type visually, but maintain
    its meaning to people using a screen reader.


    The following styles can be applied to any heading, regardless of its heading
    level:


    | CSS | HTML |

    |---|---|

    | `.text-normal {`  `font-size: 1rem;` `}` | `<h1 class=text-normal>`  `My coffee
    dashboard`  `</h1>` |

    | `.text-medium {`  `font-size: 1.5rem;` `}` | `<h2 class=text-medium>`  `My favorites`  `</h2>`
    |

    | `.text-large {`  `font-size: 2rem;` `}` | `<h2 class=text-large>`  `Featured
    roasts`  `</h2>` |

    | `.text-huge {`  `font-size: 4rem;` `}` | `<p class=text-huge animate>`  `Coffee
    jitters!`  `</p>` |


    Figure 10.19: Semantically agnostic styles'
  merge: -1
  img_proc: true
