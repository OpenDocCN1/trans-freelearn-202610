- pgno: 95
  md: '# 4


    # User Research and Testing

    for Inclusive Products


    By Julianna Rowsell


    Inclusive research is an approach to user research that intentionally includes
    people from groups who are often excluded, especially people with disabilities,
    neurodivergent folks, and others facing systemic barriers. It ensures that the
    products we build reflect a wider range of needs, abilities, and lived realities.
    Inclusive research isn’t just about access; it’s about equity. It questions who
    gets to shape the tools and systems we all rely on, and who gets left out when
    we don’t ask. But inclusion isn’t automatic. It requires us to rethink how we
    design research from the start, who we involve, how we reach them, and what we’re
    willing to change in response to what we learn.


    Inclusive research is accessible to different people in different ways, but at
    its core, it starts with a mindset, one that doesn’t default to scarcity, too
    hard, too slow, or too costly. It sees the richness in reaching and involving
    diverse participants. When we frame recruitment, the process of inviting people
    into our research, as a barrier, we limit not just our reach, but our imagination.
    But when we see recruitment as an act of care, we begin to shift our approach.
    It becomes a creative and necessary part of equity-centred research, a chance
    to build trust and relationships, not transactions.'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'As a neurodivergent researcher, I approach research differently. This can be
    confusing and feel unfamiliar to those trained in linear methods or traditional
    UX processes, but this difference is where my insight comes from. I don’t just
    work differently, I sense differently. My brain loops, lingers, and leaps. It
    notices the edges first: the friction, the reset, the overwhelm. For years, I
    was told these traits were distractions, something to smooth out, to hide. But
    they’ve become my compass. They shape how I hold space, how I listen beneath the
    words, and how I stay with what doesn’t fit.


    My methodology isn’t linear, because my mind isn’t. I move in spirals. I pause.
    I build in breath. I let silence speak. When things feel unclear, I don’t rush
    to resolve it, I listen. Confusion isn’t failure. It’s a flare. A signal that
    something deeper is moving beneath the surface. This isn’t inefficiency. It’s
    a slower kind of precision. When research demands clarity too soon, we risk losing
    what’s still unfolding. I’ve learned to trust the messy, the nonlinear, and the
    unspoken, because that’s where truth tends to live.


    Access is where inclusive research begins. It’s not just about whether someone
    can join the study. It’s about what it takes to feel safe, to feel seen, to stay.
    It’s relational. It’s shaped by power, by history, by context. Before we ask someone
    to share, we have to ask ourselves whether we’ve done the work to meet them well.
    Accessibility, in this light, becomes the scaffolding. Access is the lived experience
    of it, and includes the following:


    +   - Physical and digital accessibility

    +   - Psychological safety

    +   - Cultural and linguistic respect

    +   - Economic and time-related availability

    +   - Sensory and cognitive ease


    What this means in practice is understanding that access is a relationship. It
    shifts depending on who’s in the room, what’s being asked, and how power moves
    through the space. Our work is to shape research spaces where people can show
    up in ways that feel possible, safe, and meaningful. That doesn’t happen by accident.
    It takes preparation, flexibility, and a willingness to build trust before we
    ever ask someone to share their insight. When we lead with that, access stops
    being a checkbox or a feature, it becomes the foundation everything else is built
    on.'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'In digital spaces, we’ve learned that accessibility isn’t just about whether
    something functions; it’s about whether it feels usable, respectful, and safe.
    Research is no different. When practices become extractive, even with good intentions,
    we replicate the very harms we say we’re trying to address. When people are treated
    as data points, when they’re asked to reopen wounds without care or reciprocity,
    we’re not practicing inclusion, we’re performing it.


    This kind of work isn’t fast. It isn’t tidy. But it is deeply human. It moves
    slower, on purpose. It asks different questions:


    +   - Can people participate fully, in ways that honor their needs?

    +   - Do they feel safe, seen, and resourced, not just invited?

    +   - Will their insight shape what comes next or just fill a slide?

    +   - Are we honoring the cost of their contribution or simply collecting it?


    These aren’t just values, they’re working conditions. When we name access, trust,
    or relational care, we’re also naming the responsibility of designing research
    systems that support them. The sections that follow aren’t meant to offer perfect
    answers, but to shift how we approach inclusive research from the inside out.
    Because inclusion is not a deliverable; it’s a way of being. And before we gather
    insights or validate what’s already been built, we need to ask: Are we making
    space, or just taking it?


    This chapter asks a lot of you, on purpose, because inclusive research isn’t just
    a checklist or a better process; it’s a mindset shift. Some parts may feel abstract,
    messy, or slow. That’s by design. But throughout, I’ve paired reflection with
    practice, so even the most intangible moments come with tangible tools.


    In this chapter, we’ll explore the following:


    +   - Recruiting diverse participants for inclusive research

    +   - Adapting research methods for accessibility

    +   - Analyzing qualitative data from diverse user groups

    +   - Translating research insights into inclusive design solutions


    These practices don’t just make products better, they make the process more just,
    more human, and more aligned with the future we’re trying to build.'
