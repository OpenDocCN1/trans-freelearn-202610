- pgno: 106
  md: 'Remember that co-creation should never come at the cost of someone’s body,
    capacity, or well-being. Too often, workshops ask people to be “on” for hours
    at a time, assuming stamina, quietness, structure, and constant focus. But that
    model leaves so many people out. And it doesn’t have to be that way.


    When we remove the barriers to participation, we don’t just create more space,
    we create the conditions for people to feel seen. And when people feel seen and
    supported, they show up more fully.


    It asks deeper questions:


    +   - What happens when someone’s internet is unstable, or their timezone makes
    “standard hours” inaccessible?

    +   - How do sensory sensitivities impact someone’s ability to participate?

    +   - What would it take to create an environment where people feel psychologically
    safe sharing their truths, not just once, but throughout the process?


    When we design for flexibility, we shift the weight of access. We stop asking
    participants to stretch themselves to meet rigid systems. Instead, we take responsibility
    as researchers, facilitators, and designers to move toward them.


    That’s the difference between offering access and practicing equity. One keeps
    the door unlocked. The other remakes the room.


    # Inclusive research in practice, even when resources are tight


    Not every team has the resources, funding, time, or headcount to implement every
    inclusive research recommendation at once. But inclusive research isn’t all or
    nothing; it’s built through consistent, intentional choices. Inclusive research
    doesn’t have to wait for permission, perfect timing, or the next fiscal cycle.
    There are small ways to start where you are, with what you have, while staying
    true to your values. Let the work be imperfect and in motion. Here are a few small
    shifts that can move your practice forward, even in constrained environments:


    First of all, start small:


    +   - Use plain language in recruitment materials. It costs nothing and boosts
    accessibility.

    +   - Offer asynchronous participation (e.g., email, voice memos) – great for
    neurodivergent or time-constrained participants.

    +   - Pilot with 1-2 participants from an underinvested group. Not ideal, but
    better than complete absence.'
