- pgno: 104
  md: 'That’s why accessibility can’t be an afterthought. It has to be built in from
    the beginning – not just in tools or timelines, but in how we listen, how we follow
    through, and how we honor what’s shared.


    # Creating safer and more empowered research spaces


    Psychological safety isn’t a bonus, it’s the foundation of ethical research. When
    we invite people to share lived experiences, especially ones shaped by exclusion,
    harm, or marginalization, we’re asking for something vulnerable. That kind of
    sharing can’t happen without mutual respect.


    Creating that trust doesn’t happen by accident. It requires intention. It means
    making sure people feel heard, respected, and safe enough to express their truths
    without fear of judgment or dismissal. Not just because it’s good practice, but
    because it’s the only way to honor what’s being offered.


    This looks like offering content warnings when we know a topic might bring up
    painful memories. It looks like giving participants full permission to skip questions,
    take breaks, or step away entirely. It looks like naming the emotional labor involved
    and responding to it with openness.


    Following up matters. Sometimes, that means sharing resources, such as a list
    of local mental health services, disability peer groups, or follow-up materials
    in plain language. Sometimes, it means offering support in the form of a check-in
    message, responding to participant reflections, or ensuring there’s a trusted
    point of contact beyond the session.


    We, as researchers, have to let go of urgency, or at least question which kinds
    of urgency are self-imposed and which are truly immovable. We may not be able
    to slow every deadline, but we can choose to center care in the decisions we do
    control and the narratives we seek to share.


    Moving at the speed of need means adapting to people’s lived rhythms. It means
    knowing that energy fluctuates – that pain, fatigue, caregiving, brain fog, or
    burnout don’t follow our research calendars. It’s not just about offering flexible
    schedules or adding alt text to a slide deck. It’s about recognizing that access
    isn’t fixed. It shifts, and so must we.


    Take something as simple as a text-based wireframe. For a dashboard, this might
    look like a linear narrative describing what’s on screen: “At the top, a search
    bar. Below that, two side-by-side panels: the left shows recent files, the right
    shows project collaborators.” No visuals. No layers. Just a map made from words.
    It’s a way to make space for those who process differently,'
