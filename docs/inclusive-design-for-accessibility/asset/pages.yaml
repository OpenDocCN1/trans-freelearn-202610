- pgno: 264
  md: '# # Intersectionality of disabilities


    Out of practicality, accessibility in design is discussed in the context of a
    single disability or assistive technology, but disabilities are much more complex
    when people with multiple disabilities are considered.


    A design system that accommodates dynamic text sizing and consistent focus styling
    can accommodate someone with low vision and a severe motor disability. People
    who find animations or motion distracting may use magnification tools to focus,
    framing out distracting features. People who have cognitive disabilities may use
    a screen reader or closed captions to help with reading comprehension or understanding
    audio content. Real-world scenarios are rarely so neatly separated. Involving
    users with intersecting needs – such as someone who uses a screen reader and also
    experiences motion sensitivity – helps teams understand and design for complex,
    overlapping challenges.


    When design systems are built with flexibility, clarity, and alternative ways
    to interact, they can better accommodate this complexity without requiring exceptions
    or additional customization. It’s important to remember that many people experience
    multiple disabilities at once, such as low vision and motor impairments, or hearing
    loss combined with cognitive challenges. A design system that anticipates these
    overlapping needs – such as ensuring high-contrast typography, consistent focus
    styles, clear labels, and single-point activation – creates a more equitable and
    consistent experience for everyone.


    # ## Features to omit for everyone with disabilities


    Accessibility for design systems doesn’t just mean making everything accessible;
    it means deciding what components and patterns to omit. Some common UI components
    can be left out of a design system to encourage consuming teams to seek better
    solutions. Collaborating with users to understand why certain components create
    barriers is essential – this helps design systems evolve to support inclusive
    experiences rather than simply removing features.'
  merge: -1
  img_proc: true
- pgno: 265
  md: <!-- no content -->
