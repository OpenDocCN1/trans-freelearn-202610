- pgno: 144
  md: '![](img/3bdc9e2d41de898f8a3bcc9634b0000e_144_0.png)


    Figure 5.6: An example of good tab focus order


    # Summary


    In this chapter, we learned how to design accessible user interfaces by focusing
    on key visual and interaction principles. Topics covered include using color thoughtfully
    within visual design to ensure clarity and inclusivity, designing for cognitive
    differences to reduce barriers, supporting multiple alternative input methods
    for diverse users, and approaches to scaling accessibility across various devices
    and platforms. These insights provide a solid foundation for creating interfaces
    that are both usable and accessible to a broad range of people.


    This information is valuable because accessibility is a critical part of responsible
    and inclusive design. By understanding how to apply these principles, you can
    build products that empower users of all abilities, reduce frustration, and improve
    overall user experience. Designing with accessibility in mind not only meets legal
    and ethical standards but also expands the reach and impact of digital solutions
    and impacts revenue and adoption.


    In the next chapter, you will learn about creating accessible content, specifically
    focusing on written content, images, and multimedia.'
  merge: -1
  img_proc: true
- pgno: 145
  md: '# 6


    # Creating Accessible Content:

    Writing, Images, and Multimedia


    By Jennifer Chadwick


    It’s been said that content is king, and that is true. Content in all its forms
    is used to tell a story, provide information, or sell a product. The message must
    be communicated clearly to be meaningful, understood, and acted upon. As a writer,
    you are creating the message.


    In this chapter, we’ll cover how to create accessible content that reaches as
    wide an audience as possible – one that includes people with disabilities. We’ll
    look at the content types of text, images, and multimedia, and which formats of
    these are best for people’s needs. We’ll discuss the importance of using plain
    language when writing information, labels, and instructions. I’ll provide you
    with guiding principles to keep your writing style inclusive for all.


    At the end of the chapter, I’ll share a Needs Walkthrough exercise you can do
    as a writer to test-drive your content against key use cases for people with disabilities.
    For that, consider gathering your user experience (UX) and visual user interface
    (UI) designers to walk through a prototype together.


    This chapter covers the following main topics:


    +   - “The medium is the message”

    +   - Reviewing key actions to build an inclusive approach to content

    +   - Making different types of content more accessible

    +   - Conducting the Needs Walkthrough exercise'
  merge: -1
  img_proc: true
- pgno: 146
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 147
  md: '# Reviewing key actions for building an inclusive approach


    Let’s look at some fulfilling and actionable ways to build out an inclusive writing
    practice.


    Here we will look at some more general ideas, and then later, we will look at
    content-specific methods.


    # Familiarize yourself with user needs


    To create content that is free of barriers for people with disabilities, you need
    to familiarize yourself with the way they will experience it. The W3C Web Accessibility
    Initiative (WAI) website has a page called Diverse Abilities and Barriers (www.w3.org/WAI/people-use-web/abilities-barriers).


    It’s an excellent resource for understanding the personal needs and preferences
    associated with different disabilities. It provides engaging user stories of people
    as they work, learn, and shop.


    It outlines the digital content and design barriers for five disability types:


    +   - Auditory (e.g., deafness, deaf-blindness, hard of hearing, etc.)

    +   - Cognitive and learning (e.g., autism, ADHD, memory loss, learning disabilities,
    etc.)

    +   - Physical (e.g., mobility issues, quadriplegia, amputation, seizures, etc.)

    +   - Speech (e.g., stuttering, muteness, and apraxia (inconsistent articulation
    and sounds), etc.)

    +   - Visual (e.g., blindness, limited or low vision, deaf-blindness, color vision
    deficiencies, etc.)


    # Keep multiple user experiences in mind


    Content and user interface designers must remember that they are not the end user.
    Your personal needs, perceptions, and abilities may differ from the wide diversity
    of users of your product or service.


    Designing primarily with yourself in mind, especially if you don’t have a disability,
    will inevitably exclude several people from experiencing it. Instead, start with
    the resources published by the WAI within the World Wide Web Consortium (W3C).
    They’re practical, effective, and map directly to the Web Content Accessibility
    Guidelines (WCAG), a standard used as a basis for global accessibility laws, acts,
    and regulations.'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# Learn from real users whenever you can


    The best way to learn is from real people and their lived experience. Invite people
    with disabilities to collaborate and co-design with you on a project. Keep collecting
    end-user experiences through interviews, surveys, prototype walkthroughs, and
    group discussions. This practice is exciting, effective, and beneficial for everyone.
    You will validate your new knowledge by observing and asking people how they do
    things and how they use assistive technology and adaptive strategies to get things
    done. Learning from people directly also discourages you from making assumptions
    about “all blind users” or “all users with ADHD.”


    If budget or time constraints won’t allow consultation of people with lived experiences,
    use the list of W3C’s five disability types to create a checklist, and 1-2 user
    scenarios or tasks for each type.


    Then, walk through the experience of interacting with your content sample or design
    prototype. Was the user able to complete the task or experience the content or
    design without confusion or difficulty? If not, make notes to improve the experience
    or remove barriers.


    # Write all content in plain language


    The International Plain Language Federation says that “communication is in plain
    language if its wording, structure, and design are so clear that the intended
    readers can easily find what they need, understand what they find, and use that
    information” (https://www.iplfederation.org/plain-language/). It doesn’t matter
    whether your subject matter is complex (medical terminology, technical instructions,
    or legal terms) or simple (information in a blog post). Writing in plain language
    supports reading comprehension at all levels to reach the widest audience.


    Nielsen Norman Group, a leading user experience research and design expertise
    firm, conducted a usability study in 2017 with domain experts in science, technology,
    and medical fields. The question posed: does plain language dumb down highly technical
    or academic content? The study discovered that “even highly educated online readers
    craved succinct information that is easy to scan” (https://www.nngroup.com/articles/plain-language-experts/).


    The UK Government also conducted research that found 80% of people prefer reading
    content in plain language. Mark Morris was Head of Clear English at the UK Government’s
    Department of Health and a former speechwriter for the Health Secretary. In a
    2014 blog, he coined a phrase that speaks to an evolution in the way content authors
    have embraced plain-language writing. “Clarity is king.”'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'In 1994, Microsoft co-founder Bill Gates saw the power of online content creation
    on the World Wide Web to reach a wide audience. He said, “Content is king.” Now,
    it’s clarity that matters most.


    But you don’t have to be the author of a complex medical journal, a speechwriter
    for the Ministry of Health, or even Bill Gates to know that plain language is
    useful for all users.


    Later in the chapter, in a section called Text, we’ll cover specific plain language
    tips for writing paragraphs, labels, and instructions.


    # Familiarize yourself with barriers and alternatives


    You now have knowledge of disability needs and are ready to apply the plain language
    principle. But let’s face it, certain digital content media (formats) are not
    inherently accessible to people with varied disabilities and needs. For example,
    you may choose to present a news story in a video, but some people with visual
    impairments cannot perceive the screen easily, or at all.


    Does this mean you can no longer use video to convey information because some
    people can’t experience it? Of course not. Use the video format, but ensure it’s
    paired with a media alternative, such as a transcript. Transcripts present the
    title, character descriptions, spoken dialog, sounds and actions on-screen. It’s
    the same information, just accessed in a different way.


    In this section, we’ve learned that if you choose to use a content format that
    you know inherently won’t work for some users, you must combine it with an alternative
    format that will reach the rest of your audience. Next, we’ll look in depth at
    each content type and which alternatives work best for users with disabilities.


    # Making different types of content more accessible


    The WCAG standard is structured around four principles to support meeting the
    needs of end users. The first three are:


    +   1. **Perception:** “I can access the content, recognize what it is, what it
    means and what to do with it – without any barriers.”

    +   2. **Understanding:** “I understand the purpose of the content, its message
    or instructions clearly enough to take action.”

    +   3. **Operability:** “I can complete the action, based on the label or instruction
    provided in the content.”'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'For those wondering, the fourth principle is **Robust**: “This website or application
    can be interpreted by a wide variety of user agents, including assistive technologies
    that people use, like screen readers, keyboards, switch controls, voice commands,
    etc.” However, this is mostly related to coding and implementation, which we are
    not considering here.


    In the following sections, we will look at different types of content and see
    how they can be made more accessible.


    # Text


    Text is a universal content medium and generally the most accessible. Users with
    visual impairments, learning difficulties, memory loss, and/or attention deficit
    disabilities use screen reader software to announce content on a page. Text can
    be parsed by a screen reader (such as JAWS, NVDA, VoiceOver, and Narrator) and
    other reading tools built into software without issue. When PDFs are saved properly,
    the text within can also be parsed by the same tools.


    Text informs, instructs, and identifies. Text falls under the Perception principle
    because a user can access and perceive the text either visually or using screen
    reader software.


    In the following sections, we will look at how to make text more accessible through
    “scannability,” as well as more principles to provide plain language.


    # Make pages easy to scan


    In 2008, Nielsen Norman Group (NN/g) conducted an eye-tracking user research study
    on the web (https://www.nngroup.com/articles/how-little-do-users-read/). They
    found that, on the average web page, users have time to read, at most, 28% of
    the words during an average visit; 20% is more likely.


    For another NN/g study on mobile in 2010 (https://nngroup.com/articles/mobile-content-is-twice-as-difficult-2011),
    researchers at the University of Alberta found that reading comprehension was
    impaired when content was presented on a mobile-size screen versus a larger computer
    screen. A simple explanation for this result was that, with a small screen, users
    saw less of the text at any given time, so they had to rely more on their memory
    to access contextual information needed during reading. In other words, the smaller
    screen resulted in a higher working-memory load. People could not sustain that
    higher load, so their comprehension suffered.'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'For this reason, you can optimize the experience for everyone by providing
    precise and concise content. To help make your content easier to scan, particularly
    for people with cognitive needs, learning disabilities, or low vision, consider
    the following advice on text formatting.


    # Headings


    The purpose of headings is to introduce the relevant content underneath them.


    For your web page, create a nested structure with headings that introduce each
    area of content. Define the main heading subject and then use sub-headings related
    to your point that are “nested” below. The front-end developer will use HTML heading
    tags to create your nested structure.


    For example, your key heading will be heading Level 1. From there, the document
    or page can have multiple subheadings at Level 2, and underneath each of those,
    Level 3 subheadings, and so forth.


    Having content broken up into clearly defined sections makes it easier to scan.


    Screen reader users can press shortcut keys to jump to content (headings, links,
    graphics, tables, etc.). In this case, pressing the *H* key announces each heading.


    ![](img/3bdc9e2d41de898f8a3bcc9634b0000e_151_0.png)


    > Remember not to overuse headings. Users with visual impairments or learning
    difficulties may use text-to-speech software such as a screen reader to parse
    the content onscreen and gain an understanding of the page’s structure. Overusing
    headings can lead to confusion, so make sure to only include them when relevant.


    # Paragraphs


    When writing paragraph content, it’s important to use clear, concise language.
    Also, consider keeping the paragraph length to four or five sentences.


    Breaking up text into short paragraphs is called chunking. This makes the text
    easier for the user to scan as their eyes move down the page, or with a screen
    reader, as the speech output will pause after each paragraph. It avoids a dreaded
    “wall of text,” which can be overwhelming. It reduces eye strain as well as cognitive
    overload. It improves language processing for people with cognitive disabilities,
    those with memory impairments, or anyone multitasking.'
  merge: -1
  img_proc: true
- pgno: 152
  md: '![](img/3bdc9e2d41de898f8a3bcc9634b0000e_152_0.png)


    Avoid using ALL CAPS. To a visual user, using all capital letters for your text
    looks like the message is being shouted. Screen readers don’t pick up on the text
    emphasis, so the impact is lost on non-visual users anyway. Also, all-caps text
    reduces the distinctive shapes of words, making it harder for people with dyslexia
    to recognize and process them quickly.


    # Bulleted and numbered lists


    Bulleted and numbered lists improve accessibility by making content easier to
    read and navigate, especially for people using screen readers (as it will announce
    that the content is a list), those with cognitive disabilities, and individuals
    who benefit from structured information.


    Using lists helps break up complex ideas into digestible points – however, use
    a bullet list when the items don’t need to be in a particular order, and use numbered
    lists when providing a sequence, such as instructions.


    # Navigation menu and button labels


    Navigation menus are generally a structured set of links. Therefore, your link
    text should be a clear description of the destination page, e.g., “Who We Are”,
    “Our Services”, or “How [the product] works”. Sometimes, though, a navigation
    menu will use buttons as well.


    Keep these menu links and button labels clear and concise. This is essential for
    all users to understand the structure of a website, mobile app, or document.


    Vague or overly complex labels can be confusing to all users, but especially those
    with cognitive disabilities and non-visual users who rely on screen reader output.
    Labels on buttons and link text should tell the user instantly what the controls
    do, how they function, and the expected outcome.


    To help, use descriptive labels in plain language and avoid jargon. For example,
    though “Get in Touch” is common, use “Contact Us” instead. This will optimize
    understanding and leave no doubt as to where that link or button is taking them.


    # Navigation landmarks and menu links


    Ideally, pages are constructed with landmarks (or regions) to define their structure.
    Landmarks include header, footer, main body, and navigation, where your navigation
    menu sits.


    Developers implement code so that screen readers announce the landmark type. However,
    if there are two navigation menus on a page, your role is to write a short description
    to distinguish them. For example, “Global navigation menu” and “North America
    services menu”.'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# Links


    You might use a link as part of a sentence in a paragraph. This gives users a
    quick way to visit another page and learn more information. In this case, don’t
    use phrases such as “Click here” or “Learn more” for the link text in your sentence.


    For starters, not all users click with a mouse. But also screen reader users may
    use shortcut features that extract a list of all the links on a web page. This
    takes them out of the context of the sentence, so if you’re using generic terms
    such as “Learn more” all over the page, the user will simply hear a long list
    of “Learn more” links without any differentiation between them. Instead, create
    a hyperlink by using the words that describe the subject of your sentence or paragraph.
    For example, with the sentence “Learn more about our accessibility features,”
    hyperlink the words “accessibility features,” or make the entire sentence a link.


    # Labels for buttons and interactive controls


    Vague or overly complex labels on buttons (or any interactive controls) can be
    confusing to all users, but especially those with cognitive disabilities and non-visual
    users who rely on screen reader output. Labels should tell the user instantly
    what the controls do, how they function, and the expected outcome.


    As per the guidance for links, avoid using “Click here” or “Learn more” for button
    labels if you can. If you do so, you must provide the developer with an extended
    but concise description for screen readers – for example, “Learn more about the
    Tier One Dental Plan” using aria-label. Or, aria-labelledby, which uses existing
    content on the screen, such as a heading.


    # Form field labels and instructions


    When creating forms, you want to make sure the form itself has a description and
    the form field labels and instructions are as accessible as possible. Here are
    some best practices for creating labels:


    +   - The form itself should have a name or description, i.e. “2025 Cast Audition
    Form.” Developers will include this for screen reader users using either `aria-label`
    or `aria-labelledby`.

    +   - Form field labels should be concise, specific, and placed near the input
    field.

    +   - Use sections and headings to organize information logically. As a writer,
    you can work with the UX/UI designer on the structure.

    +   - Indicate required fields clearly using an asterisk (*) and ensure the developer
    codes the form field using `aria-required`, so the word “required” is announced
    to screen reader users. Conversely, if most form fields are required, too many
    asterisks can be'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'overwhelming. In this case, write an instruction: “All fields are required
    unless marked optional.”


    +   - Show clear, specific error messages next to the relevant field. Describe
    exactly what needs to be corrected and actioned, in that moment, before the user
    can proceed with the form.

    +   - Ideally, put the expected input formats in your label (e.g., MM/DD/YYYY
    for dates). Screen readers will announce the label and format instruction at the
    same time. This helps low-vision users zoom in with screen magnification – they
    can see it all at once.

    +   - Input formats (MM/DD/YYYY) can also be placed as helper text below the field
    and announced to screen reader users with aria-describedby.

    +   - Don’t put important instructions in placeholder text. Make sure instruction
    and formatting hints (e.g., MM/DD/YYYY) are part of the label.


    And here are some best practices for instructional text:


    +   - Use simple and familiar language, avoiding jargon and complex wording

    +   - Instructions should be written in an active voice, clearly directing what
    actions to take, in the order they need to be done

    +   - Ensure essential user information is placed before the start of the form,
    e.g. “You must be 18 to apply for this credit card”


    # Group related form inputs under headings


    Group thematically related fields visually and programmatically, such as name
    fields distinct from address fields. This helps to break long forms into more
    digestible sections.


    # Data tables


    When using data tables, consider these best practices:


    +   - Ensure tables are used for tabular data and not just for structuring page
    layout.

    +   - Provide column and row headers for clarity.

    +   - Avoid merging or splitting cells, which can confuse screen readers.

    +   - Offer CSV or Excel downloads for alternative access.

    +   - Provide alt text to describe any instructional images or SVG files in the
    table to screen readers. If the images or SVGs are decorative only and aren’t
    necessary as part of the data, they should have no alternative text. The alt attribute
    remains empty, with no space in between, i.e., alt="".

    +   - Use labels for interactive controls such as buttons, toggles, menus, lists,
    and information icons, as you would for these items outside the table.'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'There are also code and visual design practices that you won’t be responsible
    for, but can support your content in a data table. When working with developers
    and designers, remind them to do the following:


    +   - Code the table to ensure that tables are keyboard navigable and compatible
    with screen readers

    +   - Create a visual style with alternating row colors for better readability


    The best practices support blindness, as screen reader software parses tables
    by announcing the column header each time the user moves to a cell in each row
    in a new column. This ensures users aren’t lost, and the data relationships are
    intact.


    Some users with low vision use magnification software to zoom into a screen, up
    to 800%. Having a concise table with all the information contained is good. They
    don’t have to move around the page to find information. Users with learning difficulties
    can pick up on relationships in tables more easily sometimes than reading a text
    paragraph.


    > As mentioned, some of the best practices relate to the design and coding of
    the table itself, which is the responsibility of the visual UI designer and developer.
    However, as the content author, you may well be choosing the format (in this case,
    a table). So, it’s important to be familiar with best practices and how visual
    presentation, style, and code implementation impact certain users with disabilities.


    # Plain language principles for text


    So far, we have talked about the formatting of text on the page or screen to make
    it easier to scan. Now let’s discuss how you write the text itself and communicate
    the message.


    # Front-load your sentence with the subject


    Since the early days of journalism, the first sentence of a news story should
    answer the central 5 Ws – who, what, when, where, and why. Introduce your subject
    and topic first, and make your point about them at the end of the sentence. This
    way, the context is clear from the beginning.


    # Be concise


    In his 2001 book, *Don’t Make Me Think*, Steve Krug emphasizes the importance
    of using clear, simple language in your writing and for instructions and labels.
    This way, users don’t have to think – spending mental energy deciphering what
    your labels or content means.'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'His other key guidance is to “Get rid of half the words on each page, then
    get rid of half of what’s left.” With a combination of on-point sentence-writing,
    plain language, and brevity, you can achieve all you want to say in the fewest
    words possible.


    # Write in an active voice


    Use active verbs rather than passive verbs when writing:


    +   - Passive verbs are when the sentence’s subject has something done to it.
    For example: “Several children’s charities have been supported by Company B since
    it went into business 10 years ago.”

    +   - Active verbs are when the sentence’s subject does something. For example:
    “Company B supports several charities. It began its support over 10 years ago
    and continues to help children in need.”


    As you can see, the active voice is clearer and more engaging to the reader and
    speaks more confidently about the subject.


    # Use simple words


    From a 2023 survey, 51% of Canadians are at reading level 3 or above – general
    literacy.


    However, 19% of Canadians scored at level 1 or below (https://decoda.ca/insights-from-canadas-adult-literacy-survey/#:~:text=Key%20Findings%20from%20the%202023%20Canadian%20Survey&text=Literacy%3A%2051%25%20of%20Canadians%20are,at%20Level%201%20or%20below).


    In the US, approximately 54% of adults read at or below a sixth-grade level (https://en.wikipedia.org/wiki/Literacy_in_the_United_States).


    In the UK, the average reading level is generally considered to be around year
    5, which is equivalent to a child aged 9 in the UK education system (https://pmc.ncbi.nlm.nih.gov/articles/PMC11480634/#:~:text=Readability%20matters%20because%20it%20is,%E2%80%90old%20children%20%5B14%5D).


    Based on these statistics, don’t use a complex word when a simpler one will do.
    Using the simplest terms in your language will allow your content to reach the
    widest audience.


    # Use a readability tool


    As you write, you can use an online tool such as Hemingway App (https://hemingwayapp.com).
    It runs a scan of your text for its readability based on academic grade level.
    Aim for grade 6 reading comprehension, or lower (based on North American school
    systems). Alternatively,'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'Grammarly (https://www.grammarly.com/) is a well-known AI-based tool that plugs
    into other software programs such as MS Word to scan and offer grammar corrections
    and suggestions for plain language.


    # Format combinations for text


    Remember to combine content formats to keep content accessible to users with different
    needs. For example, if you use a data table, include the same information in a
    plain-language paragraph where you explain the relationships between the data
    – two ways to digest the same content.


    > As you move through the rest of the chapter, you will see how text can be combined
    with images, video, and audio.


    Let’s wrap up our discussion about text by reminding ourselves what Marshall McLuhan
    said: “The medium is the message.” Keep your messages conveyed in text plain and
    simple. This way, it can be perceived, understood, and operated upon.


    # Images


    Let’s look at different types of images that a designer may use and that you might
    collaborate with them on. Some image types contain words as well as graphics to
    convey meaning.


    But first, it’s important to learn why, when, and how to use a text alternative
    for visual content such as images and icons.


    # Types of images


    When it comes to images, we can categorize them into four types:


    +   - Decorative images serve a purely aesthetic function and do not add meaningful
    content, for example, a flowery background pattern on a website. These images
    do not need alternative text. The developer will keep the alt attribute, but it
    must be empty with no space, like this (alt=""). This means screen readers ignore
    them, preventing unnecessary distractions for users with visual impairments.'
  merge: -1
  img_proc: true
- pgno: 158
  md: '+   - **Informative images** are ones that convey meaningful content or information
    within them. A common example is step-by-step photos or illustrations on a recipe
    website, showing how to make a cake from scratch. The purpose of these images
    is to convey information in visual form. They need alternative text to describe
    them for non-sighted users. There may be text on the page or screen that relates
    to the image, but alt text should still be used to describe exactly what’s in
    the image. Also, the alt text should not simply repeat contextual text around
    it that says the same thing.

    +   - **Functional images** are images used to initiate actions, rather than to
    convey information. They are used in buttons, links, icons, and other interactive
    elements. For this reason, the alt text should describe the function, not the
    image itself—for example, a print button uses only a print icon to visually convey
    its purpose. Its alt text would be “Print” not “Printer.” Similarly, the search
    icon is a functional image for a button, labelled “Search” not “Magnifying glass.”

    +   - **Complex images** are informative images that provide a lot of detailed
    and sometimes interconnected information or data points. These certainly are not
    just decorative. The data is usually displayed in a highly visual format such
    as pie charts, bar charts, diagrams, or infographics. There can be text mixed
    with color-coded lines, symbols, and shapes. In this case, the information is
    presented in a non-linear fashion, which makes it difficult for screen readers
    to navigate and share the information in a meaningful sequence to users with visual
    impairments.


    Let’s take a closer look at alt text, and why it is important. We will also look
    at why we should avoid using text in images.


    # Utilizing alt text


    Working with a designer, you may choose images, photographs, or illustrations
    to accompany your writing piece. But if you do use them, it’s your job as a content
    creator to transform their subject, purpose, and emotions in a way that supports
    people with blindness, limited vision, and/or those with cognitive needs who may
    use a screen reader to convey the image’s meaning to them.


    Alternative text, or “alt text” for short, is a textual substitute for non-text
    content in web pages, mobile applications, and documents. Effective alt text is
    meaningful and descriptive of the image, animation, or video, and its subject
    and actions.


    If you don’t provide content for the alt text tag in HTML, the screen reader will
    announce either the image filename (a brutal series of numbers and letters perhaps!)
    or nothing—only “image.” This only tells the user they’ve encountered an image
    on the screen.'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'Here are some considerations when it comes to alt text:


    +   - Use alternative text to describe meaningful images concisely.

    +   - Provide detailed descriptions for complex images via captions or linked
    text.

    +   - Ensure text alternatives convey the same information as the image.

    +   - Ask the developer to mark decorative images properly to avoid unnecessary
    distractions for screen reader users. This means that you won’t add a text alternative
    as it’s not necessary.

    +   - If text on the page provides enough information without the image, mark
    the image as decorative. But if the image has its own meaning, add alt text.


    ![](img/3bdc9e2d41de898f8a3bcc9634b0000e_159_0.png)


    > There’s a misconception that all images need a description, but that is the
    strength of a content author to say when it is and isn’t necessary. Decorative
    images don’t need alt text, if they’re just providing a visual for presentation
    style. The WAI alt Decision Tree is a popular tool that content authors use. It
    provides a series of yes/no questions to help you decide whether alt text is needed
    for an image: https://www.w3.org/WAI/tutorials/images/decision-tree/.


    It’s also worth considering graphs, charts, and icons in the context of alt text.


    # Graphs and charts


    Graphs and charts fall under complex images and so need alt text. But here are
    some specific considerations:


    +   - Provide text-based summaries of key insights and data relationships. This
    assists screen reader users who may not be able to make interpretations and analyses
    just based on the diagrams.

    +   - Label axes and data points so it is clear what the diagram is showing. Ultimately,
    this benefits everyone!

    +   - Offer alternative data views – for example, the same information, but in
    a table. As discussed, people with cognitive needs sometimes prefer a data table
    with clearly defined relationships across a recognized block of information. This
    can be easier to follow, rather than multiple lines and color-coded visuals on
    a chart.'
  merge: -1
  img_proc: true
- pgno: 160
  md: '# Icons


    Icons are uniquely visual and can offer your target audience instant recognition
    of your chosen subject, if conventional ones are used. For example, the help icon
    is often a question mark, while the search icon is often a magnifying glass.


    What’s interesting is that icons stand alone without a visible content label a
    lot of the time. That’s by design, but the most inclusive approach would be to
    combine an icon with a text label that can be read by a screen reader.


    Now, do keep in mind that the label should describe the icon’s function, not a
    description of the icon itself. As mentioned, if you use the magnifying glass
    icon, the alt should be “Search” (not “Magnifying glass”).


    Here are some more universal icons and the recommended alt text:


    +   - Magnifying glass icon: “Search” for a search input field

    +   - Shopping cart icon: “Shopping cart” or “View cart” in a transaction flow

    +   - House icon: “Home” for a link or button that returns the user to the homepage

    +   - Envelope icon: “Email address” or “Contact us” for a link or button that
    opens an email agent or directs the user to a web page with a contact form

    +   - Phone icon: “Call us” next to a link of a phone number that launches a mobile
    phone call

    +   - Printer icon: “Print this page” on a button that launches the native print
    function in a browser

    +   - Download arrow icon: “Download [file name]” as a button, or next to a link,
    to launch a download on desktop or mobile

    +   - Trash can icon: “Delete” or “Remove” on a button or next to a link that
    launches this function

    +   - User profile icon: “Profile” or “Account settings” on a button or next to
    a link that opens a new page or popup with profile information and/or account
    settings

    +   - Gear or wrench icon: “Settings” on a button or next to a link that launches
    a page or popup to change settings within the website or web application, or evoke
    native app settings.


    Include text labels alongside icons when you can, and encourage the visual designer
    to leave room for this on the page or screen. This effort supports all users,
    but especially people with low vision, learning difficulties, and neurodivergence.'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'Sometimes, designers will place an icon in front of a text link to make it
    stand out on the page, or provide a clear visual indicator. A good example is
    an email icon next to an email link. As long as the link text is descriptive and
    meaningful of its purpose or destination, there’s no need to add alt text to the
    icon. It can be defined as decorative only.


    One exception to this is the icon that designers will place before or after a
    link to indicate that the link opens the page in a new browser window or tab.
    This icon is an informative image, not decorative. The icon needs alt text so
    non-sighted users are aware that the link opens a new window. Use alt="opens new
    window" to do this. Alternatively, the image can be decorative, and the link itself
    can have an aria-label attribute with the visible text. For example, if the visible
    label is "Learn more", the code could be aria-label="Learn more about Mortgages.
    Opens new window."


    # Avoiding text in images


    We’ve looked at the importance of alt text, but let’s consider another image-text
    issue: text in an image cannot be parsed by screen reader software, so it’s completely
    lost to non-sighted users.


    For example, banner ads are bad design. They contain a bunch of text that is often
    crammed into a restricted layout, making the font size small and often hard to
    see, especially by people with low vision. For all content on the page, mobile
    screen, or document, work with the UI designer and inform them to avoid using
    images with text embedded inside.


    Instead, use real text on the page, and work with the UI designer to create a
    background image underneath. For the text, ask them to use systemic fonts such
    as Arial or Verdana for the most readability.


    For practical reasons, sometimes it’s just not realistic to follow this guidance.
    Use system fonts whenever possible, but in cases where the image has text in it,
    that text needs to be reflected within the alt value.'
  merge: -1
  img_proc: true
- pgno: 162
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 163
  md: 'Two types of captions are open and closed. Open captions are always visible
    on the video, while closed captions can be turned on or off by the viewer in the
    video player. For accessibility, it’s preferable to use closed captions for this
    reason, and you should always have them. However, it’s important to use text titles
    in the video, especially to introduce the subject at the beginning and have the
    name and title of a speaker onscreen.


    Here are the best practices to optimize the impact of captions for people who
    are deaf or hard of hearing. Similarly, people who are temporarily unable to hear
    sound will also benefit:


    +   - Captions should match spoken dialogue and sound effects precisely.

    +   - Captions should clearly indicate who is speaking, especially in group conversations.
    Use full names in the first instance, and then reference that person by first
    name if there is limited room onscreen.

    +   - Captions should include relevant non-speech audio (e.g., [applause], [door
    creaks]).

    +   - Keep captions concise, limit text per line (preferably 32 characters max),
    and break at natural speech pauses.

    +   - Provide translations if needed to improve accessibility.

    +   - If you use a software platform or YouTube Studio to manage your video content
    and captions, you will control this. Sync captions with speech in the audio and
    allow enough time for users to read them.

    +   - Software platforms can auto-generate captions for you, and YouTube Studio
    has this as a free feature. However, the accuracy is said to be between 70% and
    80%. Always proofread and edit them for clarity and correctness.


    # Text transcripts


    Whereas captions appear on the video screen, transcripts are written versions
    of the content provided as a separate text document. The written text includes
    what’s in the captions — descriptions of the audio, spoken dialogue, and important
    sounds — but it should also include descriptions of what happens on the screen
    from beginning to end, so no information conveyed visually in the video is missed.


    Like captions, transcripts provide a media alternative to an audio track to people
    who are deaf and/or hard of hearing. They support some users with cognitive needs,
    memory loss, or attention and focus deficits (ADHD) who prefer reading text at
    their own pace instead of watching or listening to an entire video at once.'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'Here are some best practices for creating text transcripts:


    +   - Transcribe spoken words verbatim and accurately represent the speaker’s
    tone and intent.

    +   - Ensure you describe in detail the opening scene, titles, and text that appears,
    then provide a description of the speakers, objects, and actions. If needed, include
    any actions or sounds that take place off-screen that are important to the story.

    +   - As with captions, preface the dialogue with the full name of the person
    who is speaking. You can refer to their first name only for the rest of the transcript
    if needed.

    +   - Include relevant sound effects, music cues, and important background noises
    (e.g., [laughter], [phone ringing]).

    +   - Break text into paragraphs, use timestamps (if needed), and maintain readability.

    +   - Ensure correct grammar, punctuation, and clarity before publishing.

    +   - Provide a text-based format (e.g., .txt, .doc, or HTML) for easy indexing
    and accessibility.

    +   - Provide downloadable versions (e.g., plain text, PDF) for flexibility.


    # Sign language


    According to University of California research (https://mayberrylab.ucsd.edu/papers/Chamberlain%26Mayberry08.pdf),
    sign language – not written English – is the first language for many Deaf users.
    Reading captions means instantaneously code-switching into a second language with
    a different syntax and word order. In an online learning experiment with 62 Deaf
    sign-first adults by Yoon & Kim in 2011 (https://www.researchgate.net/publication/51669191),
    captions boosted comprehension but did not reduce mental effort. Sign-language
    videos were still preferred.


    So, if possible, consider offering sign language in your pre-recorded video. Search
    for an agency in your region to provide sign language interpreters (there are
    over 300 global sign languages). They record a signing session that can be embedded
    into the video output.


    # Format combinations for video and audio


    If you choose the video, animation, or film format, ensure you have your alternative
    in place:


    +   - If you use video, include closed captions that can be turned on and off
    and controlled in the video player. Include a text transcript with audio descriptions
    written into the text.

    +   - Create a separate video with an audio description track embedded.'
  merge: -1
  img_proc: true
- pgno: 165
  md: '+   - If you use an audio clip, include a text transcript.

    +   - If you use an animation that plays for longer than three seconds, include
    a text transcript describing the purpose, actions, and any sound. Flashing elements
    that repeatedly flash for longer than 3 seconds can induce seizures due to photosensitivity.

    +   - If you use an animated GIF, as with static images, include meaningful alt
    text.


    To wrap up, video and audio can be powerful formats for content, but these formats
    exclude people with certain needs and disabilities. So, remember to always provide
    a text alternative in the form of captions, a transcript, and titles for the video
    and audio files.


    # Social media


    Social media refers to audio, video, text, images, icons, illustrations, and any
    other media formats that people use to communicate and create communities online.
    The intent is to share an opinion or idea, or promote your story, message, or
    information. Social media platforms to post your content include YouTube, TikTok,
    Facebook, X (formerly Twitter), LinkedIn, Snapchat, and Reddit.


    As a content creator, here are some accessibility best practices for preparing
    social media content:


    +   - When writing text posts, capitalize each word in multi-word hashtags (e.g.,
    #AccessibleDesign instead of #accessibledesign).

    +   - Whenever possible, provide descriptive alt text to non-text content such
    as images and GIFs. Some CMS platforms don’t have this built in – speak to someone
    about updating this.

    +   - Avoid excessive use of emojis or special characters when writing a post.
    This is because emojis come with alt text, which can lead to inaccuracies. For
    example, the emoji of two hands pressed together is often used to express thanks,
    but is actually illustrating a prayer – this could lead to a situation where your
    written context is saying “thank you” but the emoji’s alt text says “pray.” Also,
    emoji alt text can be very literal. For example, the alt text for the eggplant
    emoji would be “eggplant,” but this emoji is used to denote something quite different.

    +   - Keep your posted messages concise and structured.

    +   - Provide video captions and transcripts.


    Again, apply the principle of providing a content alternative for different users.
    These best practices support users with blindness, low vision, learning difficulties,
    and neurodivergence (ADHD, autism), and those who are deaf and hard of hearing.'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'As a wrap-up, apply the principle of keeping multiple users in mind when designing
    online content postings. Remember how different users will experience your message.
    Providing a variety of content formats shows your consideration for their needs.


    Next, let’s look at two case studies for applying best content practices.


    # Quick case studies


    Here are two scenario examples about approaching text and images. Both explore
    the content author’s perspective, but also provide the user’s perspective as they
    experience the content.


    # Case study 1: Sarah, a content author working with infographics


    # Content author’s perspective


    Sarah, a content creator, is designing an infographic about climate change impacts.
    The UI designer she’s working with has supplied some graphics (icons of people
    and clouds, pie charts and statistics, and arrows that show the cycle of precipitation
    in weather). Sarah wants to ensure that non-sighted users can access the same
    information as sighted users.


    Here are some challenges she could face:


    +   - Infographics are highly visual, relying on charts, images, and icons

    +   - Blind users rely on screen readers, which cannot interpret visual elements

    +   - Important data could be lost without proper accessibility measures


    Now let’s see how Sarah could make the infographic more accessible:


    +   - Sarah could write **detailed alt text** that summarizes the infographic’s
    key points – for example:

    +     “This infographic explains five major impacts of climate change: rising
    temperatures, melting ice caps, extreme weather, sea level rise, and biodiversity
    loss. Each section includes a statistic and a relevant icon.”

    +   - Below the infographic, Sarah could also provide a **text version** of all
    the content. In this case, she could write the following:

    +     “Title: Climate Change Impacts

    +     1. Rising Temperatures – Global temperatures have increased by 1.2°C since
    pre-industrial times.

    +     2. Melting Ice Caps – Arctic ice has shrunk by 13% per decade.”'
  merge: -1
  img_proc: true
- pgno: 167
  md: '+   3. Extreme Weather – More frequent hurricanes, droughts, and wildfires.

    +   4. Sea Level Rise – Coastal cities are at risk due to rising ocean levels.

    +   5. Biodiversity Loss – Many species are endangered due to habitat destruction.”


    +   - Sarah could also provide a downloadable plain text or structured PDF version
    of the infographic for users who prefer alternative formats.


    # User’s perspective


    In this case, the user is blind and using a screen reader to navigate the web
    page. As they navigate the page with the screen reader speech output on, they
    use the down arrow key and land on the infographic (a .png file).


    Firstly, the screen reader announces “image” and then reads aloud the short, detailed
    alt text that Sarah created and the developer coded into the image. This gives
    the blind user an indication of what they encountered (image) and a quick summary
    of the purpose of the content. Next, the user presses the down arrow key to continue
    navigating the page. They land on a collapsible content section (accordion), which
    has a heading that Sarah provided (“Climate change impacts”) and functions with
    a button to expand and collapse it. The screen reader announces “Button. Climate
    change impacts. Collapsed.”


    By following these steps, Sarah ensures that blind users can access the infographic’s
    information too. This improves inclusivity, user experience, and compliance with
    accessibility standards.


    # Case study 2: Kavana, labelling buttons on a website


    # Content author’s perspective


    Kavana is a content author for a retail company’s website. The company has several
    job openings, so they want to add a call-to-action button on the homepage to drive
    users to the landing page of their job site. Kavana has been reading the book
    Don’t Make Me Think by Steve Krug. It provides an illustration with three button
    examples, each with a different label. There is a scale from “Obvious” to “Requires
    Thought” across the top. A man, representing the website user, is looking at each
    button and trying to make a decision about which one to select.


    On the “Obvious” end of the scale, the button label says “Jobs.” The second button
    label is in the middle, “Employment Opportunities”. The third button label is
    at the “Requires Thought” end of the scale. It says “Job-o-rama.” Kavana wants
    to make an inclusive choice about the wording for the label. In the end, she goes
    with “Jobs.”'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# User’s perspective


    Kavana starts to think about how the user will understand and interpret the label
    she chooses.


    “Jobs” is the simplest and clearest descriptive label for the button/link and
    destination. The label “Employment Opportunities” is a bit long for a button label
    design and takes up space space on this particular page. The user will need to
    take more milliseconds to calculate the meaning and conclude that this button
    must also lead them to a jobs page.


    With the “Job-o-rama” label, the user is forced to figure out the purpose or destination
    of the button. It could be jobs, or something more. What is an “o-rama”? What
    does this refer to? It may not be understood by non-native English speakers. The
    user will ask themselves, will the button take me to a job listings web page,
    or is that an event called Job-o-rama? Way too much time will be spent guessing
    before the user can act.


    These two examples give insight into the decision-making process by both the content
    author and the end user. In the final section, I will share an exercise you can
    do to gather case studies and scenarios. This will strengthen your consistent,
    inclusive writing practice.


    # Conducting the Needs Walkthrough exercise


    The Needs Walkthrough exercise is an activity you can do at any time to test-drive
    your content idea or prototype against the needs of five different disability
    types. The goal is to think through the needs of users with disabilities and ensure
    you’re meeting them with your content. This gives you more knowledge and confidence
    that you’re being accessible and inclusive.


    The exercise itself is totally low-fi and usually doesn’t cost a thing, except
    your time. You can run the exercise alone or with your team just by reviewing
    content together and asking, does this meet people’s needs? If you wanted to engage
    real users directly, any costs associated would be compensating people with disabilities
    for their time in preliminary user interviews.


    Let’s take a look at how to prepare and complete the exercise.


    # Step 1: Gather a list of disability needs


    If you can, gather user experiences and disability needs directly from people
    with disabilities. Send out a survey using Google Forms or have people answer
    questions on a Word document. Or, arrange one-on-one or group user interviews
    through accessible video conferencing platforms such as Zoom, Google Meet, or
    Microsoft Teams. These platforms have built-in, live captions that display for
    folks who are hard of hearing.'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'If opting for the interview approach, you have two options:


    +   - **Option 1 – Gather general user needs only:** Keep the interview open-ended
    and conversational. Host the interview by asking someone about what types of assistive
    technologies they use, how and when they use them, what designs work best for
    them, and which designs cause barriers. Fable Tech Labs connects businesses with
    a community of people who use assistive technologies and test their products for
    them. Fable provides two helpful articles: *Planning Your User Interview* (https://makeitfable.com/article/planning-your-user-interview/)
    and *5 Questions You Should Ask In Your Interviews* (https://makeitfable.com/tutorial/5-questions-you-should-ask/).
    After a video interview, you can review a recording of the session and text transcript
    to reference later.

    +   - **Option 2 – Use the interview to conduct the walkthrough exercise:** A
    second option is to gather general user needs from people during the video interview,
    but also use this time to have them walk through your user journey/prototype with
    you. Get instant feedback on the good and bad. See the full details about the
    exercise in *Steps 2 to 4*.


    If you can’t connect with real users, the *W3C Diverse Barriers and Abilities*
    web page (https://www.w3.org/WAI/people-use-web/abilities-barriers/) is a great
    alternative. It offers a list of the five disability types and their needs and
    preferences when using digital products.


    After reviewing these, read *Stories of Web Users* (https://www.w3.org/WAI/people-use-web/user-stories/)
    and leverage that as a starting point for the exercise. Create a spreadsheet or
    checklist. Copy and paste the person’s general bio and list what design works
    for the user, and then note the designs that cause barriers for them. This way,
    you can build out a library of personas to use.


    # Step 2: Identify the standards and outcomes to test


    You now have an understanding of user experiences – what works and doesn’t work
    within design. Now it’s time to gather the standards you want to test when you
    run the Needs Walkthrough exercise. Usability is essential, but it’s also good
    to test your design prototypes to see if they meet legal accessibility standards
    at the same time.


    # Walk through your content using WCAG


    The Web Content Accessibility Guidelines (WCAG) is the global standard for digital
    accessibility and are referenced by laws in many countries. As mentioned previously,
    WCAG is broken down into four categories: Perceivable, Operable, Understandable,
    and Robust (POUR).'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'You can look at the entire list of guidelines on *How to Meet Quick Reference
    Guide* https://www.w3.org/WAI/WCAG22/quickref/. On this page, you can filter the
    list by content. This will show the guidelines (success criteria) that are related
    to your work.


    The W3C has also created two helpful supplemental guides for meeting the WCAG
    success criteria for cognitive and learning disabilities (https://www.w3.org/WAI/WCAG2/supplemental/#cognitiveaccessibilityguidance)
    and low vision (https://www.w3.org/WAI/WCAG2/supplemental/#-low-vision-accessibility-guidance).


    # Test against functional requirements


    EN 301 549 is an accessibility standard in Europe. Its list of functional requirements
    are simple user statements for meeting disability needs and it’s highly recommended
    that you add them to your checklist/spreadsheet. Simply cut and paste them into
    your spreadsheet. The functional requirements are that, for any information communication
    technology, the following points are possible:


    +   - Usage without vision

    +   - Usage with limited vision

    +   - Usage without hearing

    +   - Usage with limited hearing

    +   - Usage with no or limited vocal capability

    +   - Usage with limited manipulation or strength

    +   - Usage with limited reach

    +   - Minimize photosensitive seizure triggers

    +   - Usage with limited cognition, language, or learning


    The Government of Canada website has the functional requirements listed here,
    along with the other requirements related to product design, both physical and
    digital (https://accessible.canada.ca/en-301-549-accessibility-requirements-ict-products-and-services-1).


    # Step 3: Plan your exercise event


    Now you have both usability and accessibility testing measurements to test your
    design idea or prototype, it’s time to plan the event, your Needs Walkthrough
    Exercise.'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'Ideally, you’ll gather UI designers, UX designers, and developers to review
    the design prototypes together, not just from the written content lens but the
    entire design of the user interface experience. You can review the user stories,
    and then the standards guidelines and functional requirements together.


    However, if you want to run the Needs Walkthrough Exercise on your own, you can
    do so and learn a lot about how people with disabilities interact with just your
    content. Perhaps you only have your ideas in a document, for the written text,
    labels, instructions, and alt text choices.


    # Step 4: Conduct the walkthrough exercise


    Now it’s time to conduct the exercise. Let’s see what actions to take.


    # Action 1: Review the user stories and standards


    In a team or alone, go into your checklist/spreadsheet and familiarize yourself
    with the user stories that represent up to five disability types, gathered from
    user interviews or the WAI resource. Keep in mind what they said works and doesn’t
    work for content.


    Next, review any checklists you’ve created and keep those in mind as guidelines
    that support the user stories.


    Remember to keep in mind which assistive technology is being used (if any) during
    the user journey. For example, if you’re walking through the experience as a blind
    user using keyboard and screen reader software, think about how the speech output
    will sound, especially if the headings on the page are out of order or when links
    are used.


    # Action 2: Replicate each of the five user journeys


    Replicate the five disability types, like so:


    +   1. Considering the first disability type, use your prototype and walk through
    your content idea or design mock-up, capturing the user journey or task from end
    to end.

    +   2. Repeat this exercise for the other four disability types.

    +   3. If you have time, consider combining disability types (for example, imagine
    you are using your prototype as someone with ADHD and low vision).

    +   4. With the needs and standard guidelines in mind, assess the user journey
    against your research and plan. Did you come up against a barrier for the user?
    If so, proceed to Action 3.'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# Action 3: Record any barriers you faced


    As the user, something doesn’t feel right, or you’ve been completely stopped in
    your tracks by the design and cannot proceed. Ask yourself these questions and
    make notes in the spreadsheet:


    +   - What is the nature of the barrier? Is the content unclear, or is there an
    alternative missing on a content format type?

    +   - What is the severity of the barrier faced?

    +     - Critical: Users with this disability cannot use any part of a system,
    website, app, social media post, and so on

    +     - High: Users with this disability will find it challenging to use the system,
    website, app, social media post, and so on

    +     - Medium: Users can proceed with limited functionality

    +   - Did the barrier fail a WCAG success criterion? If so, which?

    +   - Did the barrier fail a 301 549 functional requirement? If so, which one?

    +   - What is your recommended fix?

    +   - (If relevant) Will you keep the content format but ensure there’s an alternative?

    +   - (If relevant) Would it be easier to manage, and better for end users, to
    convey the information in the simplest way possible?


    # Action 4: Record your solutions


    You’ve now captured low, medium, or severe accessibility and usability barriers
    with the prototype that you can fix or remove at this early stage. Using your
    knowledge gathered from the user stories or interviews and standards, leverage
    these resources to make suggestions about content changes. Record them in your
    spreadsheet.


    # Step 5: Share what you’ve learned


    Now you’ve completed the exercise for up to five disability types, and possibly
    a few combined types, here are some ways to share what you’ve learned:


    +   - Record any additional user journeys that came about as a result of walking
    through your prototype that may be specific to your company’s product or tasks.
    Write them out in the same way as the W3C Stories of Web Users, including a name,
    the disability, assistive technology used, design and experience preferences,
    and barriers to avoid.'
  merge: -1
  img_proc: true
- pgno: 173
  md: '+   - Extract all your notes from your original spreadsheet, along with any
    user interview recordings, videos, and transcripts – and share them in a central
    hub with your team. Review them regularly to keep knowledge fresh.

    +   - Replicate the user journey on a live site or mobile app. It never hurts
    to unplug the keyboard and/or run a screen reader over a web page or document
    to experience it yourself!


    # Step 6: Identify who solves the issues


    Later on, an additional step is to identify who is responsible for fixing the
    issues and barriers you uncovered. You’ve likely recognized the barriers caused
    by content as your own issues to tackle; however, sometimes you will need to work
    with a designer or developer to remove a barrier completely.


    The W3C has also published a helpful **Accessibility Roles and Responsibilities
    Model (ARRM)** resource called *Tasks Involved in Accessibility* to complement
    the **success criteria (SC)** that make up the WCAG guidelines. Each criterion
    has a primary, secondary, and contributor owner – the person responsible for ensuring
    that the criterion is met. There are ones for content authors, UX designers, UI/visual
    designers and frontend developers.


    This is another great team exercise to review what needs to be fixed, how, and
    by whom, as a team. Visit the ARRM website to see which WCAG SC are primarily
    owned by content authors: https://www.w3.org/WAI/planning/arrm/tasks/.


    As you can see, the Needs Walkthrough exercise is highly customizable as a practice,
    with the goal of getting you to walk through a user experience from start to finish,
    as someone with each disability type. Doing so allows you to quickly recognize
    barriers, in order to rewrite content, re-consider the format that’s been chosen,
    or add alternatives if needed. You can do this alone as a content author, applying
    your knowledge of user needs to your own text, images, and multimedia content,
    or you can conduct the exercise together with visual and user experience designers
    and developers to come up with solutions to all aspects of the project.'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# Summary


    In this chapter, you have learned that it’s essential to keep multiple users in
    mind when creating content. You’ve learned about the power to communicate inclusively
    and reach as many end users with plain, simple language for your message. This
    is whether it’s on a web or mobile screen, in a document or on a social media
    platform. You’ve learned the importance of easily understood labels and instructions
    for buttons and controls. Truly, content is king, but now we have knowledge of
    different people’s needs, you know why clarity is also king.


    When applying your content strategy, you’ve learned to choose the most inclusive
    content format that meets the needs of most people with disabilities. If you select
    a format that excludes certain users, such as images, videos, and audio clips,
    it’s okay to use them. You just need to provide a text alternative for people
    with visual and auditory impairments.


    You have developed the skill of thinking inclusively as you create content. However,
    you want to ensure you’re continuing to capture and meet the disability needs
    of your audience. To do this, you learned how to conduct a free and effective
    exercise you can do to test-drive your written content and format choices against
    the needs of different people. You can do the exercise alone or in collaboration
    with designers and developers on your team. People are at the center of your strategy.
    You are playing your part in changing the digital world.


    In the next chapter, you will look at how to develop accessible websites, particularly
    focusing on semantic HTML, CSS, and ARIA.'
  merge: -1
  img_proc: true
