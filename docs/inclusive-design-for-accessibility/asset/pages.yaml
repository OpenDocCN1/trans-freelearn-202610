- pgno: 221
  md: '# 9


    # Accessibility in Emerging Technologies: VR, AR, and AI


    *Dr. Keith Newton*


    On the day that I wrote this chapter, I found one of the most fun, free, online,
    time-wasting tools of all time! I logged on to labs.google.com and clicked on
    *Viola the Bird*. This AI experiment lets anyone, with or without musical expertise,
    play a cello-inspired instrument. Viola uses a leg to hold the instrument, another
    leg to balance, and grips the bow using her beak. Using a mouse, a user can control
    this rather enthusiastic bird to play pieces like Ode To Joy, Jupiter from Holst’s
    The Planets, Christmas songs, and more. The music adjusts in real time to the
    speed and placement of the bow, as well as the timing of notes and the arrangement
    of the orchestration. It’s super cool and super fun, but unfortunately, because
    of the way it was implemented, it fails a large portion of its potential users.


    Don’t get me wrong. I love *Viola the Bird*. I can imagine somewhere in an office,
    the creator poised in their office chair, laptop open to a cutting-edge AI prototype
    months in the works, and everyone on the team excited about the next “revolutionary
    platform for personalized content,” with investors eager to see it go live. That
    said, the uncomfortable truth is that the prototype is navigable and operable
    only via mouse. Users operating a screen reader have no text alternatives provided,
    and the product animations don’t respect user motion guidelines.


    What if *Viola the Bird* had been implemented with a more inclusive mindset? Could
    the team have implemented keyboard navigation, implemented motion control using
    arrow keys in addition to the mouse, and labeled the content with text alternatives?
    That way, users with both visual and motion impairments would be able to navigate
    and operate Viola in an equitable manner that allowed them to enjoy playing those
    pieces and sharing in the joy of this product. The system would not be perfect,
    but it would be **welcoming** to everyone.'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'This chapter explores the accessibility challenges and opportunities presented
    by emerging technologies such as **Virtual Reality (VR)**, **Augmented Reality
    (AR)**, and **Artificial Intelligence (AI)**, discussing the unique considerations
    for making immersive VR experiences accessible to users with various disabilities.
    The chapter places a focus on information presentation and interaction while looking
    at the role of AI in enhancing accessibility and potential biases.


    In this chapter, we will cover the following topics:


    +   - Adapting VR experiences for various sensory abilities

    +   - Enhancing AR accessibility through customization

    +   - Leveraging AI to automate the inclusion of accessibility practices

    +   - Mitigating algorithmic bias in AI-driven interfaces


    # Adapting VR experiences for various sensory abilities


    **Virtual Reality (VR)** is a technology that simulates three-dimensional, computer-generated
    environments and immerses users through specialized headsets or devices. By tracking
    head movements, and often with hand controllers, VR allows people to view content,
    navigate landscapes, and even manipulate virtual objects in real time.


    VR has been embraced across industries: from gaming and entertainment to education
    and professional training, where immersive simulations of environments in fields
    include, but are not limited to, medicine, aviation, and industrial safety.


    Yet, the very elements that make VR so engaging – things like fully 3D environments,
    dynamic motion, and realistic audio – can also introduce barriers for disabled
    users. Users with visual impairments, for example, may struggle to identify in-game
    elements if not provided with robust audio cues or haptic feedback. Deaf or hard-of-hearing
    users might miss crucial story beats or puzzle hints delivered only through dialogue
    or sound effects, while persons with mobility limitations may find the physical
    demands of holding or operating controllers difficult or impossible to manage,
    or find that intense motion can trigger dizziness or nausea for other vestibular
    disorders.


    Because each design choice, from interface elements to navigation methods, can
    either enable or exclude certain users, it helps to acknowledge the varied abilities
    and needs of potential users before diving into development. It is also helpful
    to reflect on ways to systematically evaluate and refine the VR experience to
    better serve a broad range of participants.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# Accommodations to improve VR accessibility


    VR offers a range of customizable experiences for users, but can also present
    challenges for individuals with disabilities. The following list highlights benefits,
    challenges, and accommodations, along with examples of strategies to improve perception,
    operability, and understanding for all users, while offering specific adaptations
    for those users with mobility, visual, auditory, cognitive, and motion-related
    disabilities:


    +   - **Mobility accommodations:**

    +     - **Challenges:** Motion controls often require specific physical positioning,
    and precise interactions could create barriers.

    +     - **Solutions:** Provide alternative input methods for all actions (voice
    commands, eye tracking), enable control remapping, allow input sensitivity adjustments,
    and include specialized tooling for personalized mobility support.

    +   - **Visual accommodations:**

    +     - **Challenges:** Reading text can be difficult, color differentiation may
    be challenging, glasses might cause discomfort, and screen reader compatibility
    can be limited.

    +     - **Solutions:** Offer adjustable text size and contrast, haptic feedback
    for events, visual and non-visual labels for all content, and audio descriptions
    of the environment.

    +   - **Auditory accommodations:**

    +     - **Challenges:** Spatial audio design may be inconsistent, directional
    sounds might be hard to pinpoint, and reliance on voice chat can limit accessibility.

    +     - **Solutions:** Incorporate mono audio options, offer customizable captions
    and visual cues, include signing avatars, and provide adjustable left-right audio
    balance.

    +   - **Cognitive accommodations:**

    +     - **Challenges:** Users may experience sensory overload, disorientation,
    time mismanagement, and overly complex interfaces.

    +     - **Solutions:** Utilize teleport buttons, provide easy re-orientation options
    and scalable UI/HUD, offer step-by-step tutorials, and include guided interactions.'
  merge: -1
  img_proc: true
- pgno: 224
  md: '+   - **Motion sickness mitigation:**

    +     - **Challenges:** Sensory mismatches between virtual and real-world movement
    can cause discomfort.

    +     - **Solutions:** Employ higher frame rates, use teleportation locomotion
    instead of smooth movement, allow for user restriction of camera motion, utilize
    cooling fans, integrate haptic feedback, and allow gradual exposure.


    +   - **Other considerations:**

    +     - **Challenges:** Flashing images may trigger seizures, XR technology can
    cause vertigo, and users may face difficulties readjusting after use.

    +     - **Solutions:** Limit flashing images, use fade transitions for teleportation,
    and allow stepwise adaptation within environments.


    # Fictional case study: virtual escape room


    Consider a multinational company that decided to host its quarterly team-building
    exercise in a virtual escape room designed for all employees. The primary goal
    is to foster cross-departmental relationships by letting participants collaborate
    on puzzles, share insights, and celebrate small wins in real time. By engaging
    in this shared challenge, colleagues should build trust and rapport, leave with
    a stronger sense of camaraderie, and gain renewed appreciation for each participant’s
    unique skills.


    However, let’s imagine that some of the users have vestibular disorders – conditions
    affecting balance and spatial orientation, often causing dizziness, vertigo, and
    disorientation. The following accommodations highlight key strategies developers
    can use to reduce disorientation, stabilize user perspectives, and ensure VR projects
    become more inclusive and ultimately more engaging for vestibular disorders:


    +   - **Teleportation or comfort locomotion:**

    +     - **What it is:** Instead of moving through the environment with smooth,
    continuous walking or flying, users “jump” to their desired location or engage
    in a “low-speed” mode.

    +     - **Why it matters:** Sudden or continuous motion in VR can trigger intense
    discomfort or motion sickness. Teleportation/comfort modes reduce that discrepancy
    between visual and physical movement.'
  merge: -1
  img_proc: true
- pgno: 225
  md: '+   - **Stable reference frames:**

    +     - **What it is:** A virtual horizon line, cockpit, or other stationary elements
    that remain fixed while the user moves.

    +     - **Why it matters:** A consistent point of reference helps counteract disorientation,
    anchoring the user’s balance and reducing vestibular strain.

    +   - **Adjustable Field of View (FOV):**

    +     - **What it is:** Allowing users to narrow their view or enable a vignette
    effect focuses attention on a subject by removing distracting background detail
    during movement.

    +     - **Why it matters:** Peripheral vision can amplify motion sickness. Adjusting
    or reducing FOV during movement mitigates the intensity of visual input.

    +   - **Easy access to pause and breaks:**

    +     - **What it is:** Clear options to pause or exit the VR environment, as
    well as natural breakpoints in the activity.

    +     - **Why it matters:** The ability to quickly step out if discomfort arises
    helps users manage symptoms before they escalate, encouraging continued participation.

    +   - **Iterative user testing and feedback:**

    +     - **What it is:** Inviting participants with known motion sensitivities
    to test early prototypes, plus offering a feedback mechanism in the final experience.

    +     - **Why it matters:** Users with vestibular conditions can identify hidden
    triggers or issues more reliably than generic guidelines can, informing more targeted
    improvements.


    This inclusive approach ultimately benefits everyone. The accommodations allow
    for persons with vestibular discomfort to participate equitably in an environment,
    and allow them to strengthen cross-departmental relationships as they are, and
    participate in a supportive, innovative, and cohesive organizational culture.


    By prioritizing inclusivity, organizations foster an environment where all employees
    can fully engage and thrive. Building on this foundation, let’s explore how AR
    can be customized to further enhance accessibility.'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# Enhancing AR accessibility through customization


    **Augmented Reality (AR)** transforms how people engage with digital content by
    overlaying virtual elements – such as text, images, and interactive features –
    directly onto their surroundings. Unlike VR, which immerses individuals in a completely
    digital world, AR leverages cameras, sensors, and specialized software on devices
    like smartphones, tablets, or headsets to enhance rather than replace the physical
    environment.


    This approach has been embraced across numerous fields: in retail, customers can
    virtually “try on” products; in on-site training, workers can see real-time instructions
    superimposed on machinery; and in educational settings, students can explore layered
    views of historical artifacts or scientific processes in greater depth.


    A compelling illustration of AR’s potential is the concept of “smart cities,”
    where visitors use AR apps to access enhanced details about nearby locations.
    Users may point a phone at a building to view a 3D timeline of its restoration
    or scan a street sign to get additional details from the area. These features
    help transform passive visits into an interactive storytelling experience.


    AR, similar to VR, can introduce barriers for users with disabilities. Individuals
    with visual impairments may struggle to see small or low-contrast text; deaf or
    hard-of-hearing visitors require captions or sign-language alternatives for audio-based
    narration; and people with mobility limitations might find it fatiguing to hold
    devices aloft for extended periods or perform precise gestures. Moreover, persons
    with cognitive limitations can become overwhelmed by the clutter of multiple on-screen
    layers.


    These challenges underscore the importance of user-centric design. Each interface
    decision – whether it’s text size, color contrast, or how and when digital overlays
    appear – can either facilitate or hinder accessibility. Testing with diverse user
    groups, collecting iterative feedback, and refining AR implementations accordingly,
    developers and institutions are able to create experiences that are more inclusive
    and equitable.


    # Designing inclusive AR experiences


    AR, similar to VR, presents unique challenges for individuals with disabilities.
    The following list outlines challenges and solutions to improve perception, operability,
    and understanding in AR environments, addressing issues related to mobility, visual
    clarity, auditory cues, and cognitive load:'
  merge: -1
  img_proc: true
- pgno: 227
  md: '+   - **Mobility accommodations:**

    +     - **Challenges:** Interaction with AR elements may require precise gestures
    or specific physical positioning, which can be challenging in dynamic real-world
    environments.

    +     - **Solutions:** Provide alternative input methods (voice commands, single-touch
    virtual buttons that stay in one place), enable gesture sensitivity adjustments,
    and offer customizable control schemes to support smoother interactions.

    +   - **Visual accommodations:**

    +     - **Challenges:** AR content can be difficult to read or interpret due to
    variable lighting conditions, background interference, and insufficient contrast
    between virtual elements and the physical environment.

    +     - **Solutions:** Offer adjustable text size, contrast, and brightness settings;
    implement high-contrast modes; and allow users to reposition or resize AR overlays
    to enhance clarity and readability.

    +   - **Auditory accommodations:**

    +     - **Challenges:** Reliance on auditory cues in AR can be problematic for
    users with hearing impairments, and ambient noise may further hinder audio clarity.

    +     - **Solutions:** Incorporate customizable captions and subtitles, provide
    visual audio alerts, and offer options for mono audio or adjustable audio balance.

    +   - **Cognitive accommodations:**

    +     - **Challenges:** The simultaneous presentation of digital and physical
    information may lead to cognitive overload, confusion, or distraction.

    +     - **Solutions:** Simplify user interfaces, provide clear step-by-step guidance,
    use consistent and intuitive design patterns, and allow users to customize the
    density of displayed information.


    # Fictional case study: customizable AR overlays in a museum


    Consider a prominent art museum that introduced an AR smartphone application to
    enrich the visitor experience for everyone, particularly those with hearing impairments.
    The primary goal was to provide in-depth context for each exhibit, allowing patrons
    to scan paintings or sculptures for supplementary information, historical background,
    and curator insights in real time. By engaging with these digital overlays, guests
    could explore hidden narratives behind each piece and cultivate a deeper appreciation
    for the museum’s collection.'
  merge: -1
  img_proc: true
- pgno: 228
  md: <!-- no content -->
