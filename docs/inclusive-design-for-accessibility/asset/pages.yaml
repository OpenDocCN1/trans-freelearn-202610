- pgno: 133
  md: 'Consistency in design is crucial for general usability for all users, including
    users with disabilities, and can be implemented using the following guidelines:


    +   - **Predictable patterns:** When patterns and behaviors are predictable, users
    can build familiarity with how things work, making it easier to navigate through
    complex systems or tasks.

    +   - **Layout:** Maintaining a uniform layout by placing navigation elements,
    buttons, and interactive components consistently across pages helps users quickly
    learn where to find key functions. This principle is reinforced in WCAG 2.2, which
    introduces a requirement for consistent help mechanisms across pages (https://www.w3.org/WAI/WCAG22/Understanding/consistent-help.html).

    +   - **Visual consistency:** Using the same icons, buttons, and colors throughout
    enables users to easily associate actions with their visual cues.

    +   - **Interactions:** Predictable interactions are essential; sticking to common
    conventions (such as a trash can icon for deleting) prevents confusion and creates
    a smoother, more intuitive experience.


    Taking a specific example, buttons that provide similar functionality should be
    consistent to alert the users to clickable elements and behaviors. The following
    figure demonstrates a good and bad example of button consistency:


    ![](img/3bdc9e2d41de898f8a3bcc9634b0000e_133_0.png)


    *Figure 5.4: Good vs. bad button consistency*'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'Once these foundational UX principles are put into practice, the next step
    is ensuring those design patterns work well across all users, including those
    with accessibility needs. The principles behind accessibility aren’t one-size-fits-all;
    instead, design patterns should be flexible and adaptable. Here are three tips
    that can support accessibility:


    +   - Many users with cognitive disabilities rely on keyboard shortcuts for faster
    navigation. Make sure that all interactive elements, such as buttons, links, and
    forms, are accessible through keyboard commands alone, and that the focus order
    is logical (take a look at the *Information architecture for accessibility* section
    at the end of the chapter for an example of good vs. bad focus order). It’s also
    important to ensure those keyboard shortcuts and interactions are consistent throughout
    the experience.

    +   - Provide contextual help or tooltips for complex interactions that require
    additional information. These should be accessible and easy to understand, guiding
    users without overwhelming them with information. But keep in mind that tooltips
    shouldn’t be a substitute for bad design; the design should be easy to understand,
    while the tooltip provides extra information in a concise way.

    +   - Form fields, buttons, and other interactive elements should always use clear,
    descriptive labels that communicate their purpose at a glance. Avoid vague or
    generic terms such as “Submit” and instead, use action-specific language such
    as **Submit Your Order** or **Save Your Work** to help users understand exactly
    what will happen next. Where appropriate, supplement these labels with brief,
    helpful guidance, such as input examples (**MM/DD/YYYY**) or field requirements
    (**Password must be at least 8 characters**) to reduce uncertainty and prevent
    errors.


    # Progressive disclosure and abstracting away unnecessary content


    The key to building progressive disclosure and abstraction is not what you add
    to your user interface but what you hold off. Only the necessary information is
    presented at each step of an interaction, avoiding the need for users to memorize
    details about previous steps. Compare this to cooking a complex dish: a long list
    of ingredients followed by a chaotic and disorganized list of instructions. While
    it’s important to provide all the necessary information, such as ingredients,
    steps, and materials required, presenting that information in a logical order
    can simplify the cooking process.


    Similarly, for the user interface, keeping tasks simple and breaking down complex
    processes into smaller, manageable steps can ease the cognitive load. Here are
    some actionable ways to build progressive disclosure within a user interface:'
  merge: -1
  img_proc: true
- pgno: 135
  md: '+   - For tasks that require more thought or action (e.g., form submissions),
    break them down into smaller steps. This helps users stay focused and avoids overwhelming
    them with a long series of actions.

    +   - Avoid overwhelming users with too many choices, too much text, or excessive
    visual clutter. Opt for clean, well-organized layouts with clear headings and
    labels.

    +   - Give users an indication of how far they are in the interface/task. For
    example, if a user is filling out a long form, displaying a progress bar or step
    indicators can help them visualize where they are in the process, making the entire
    task feel less overwhelming. When creating the progress bar, use a combination
    of color and clear text (such as numeric percentages), and make sure assistive
    technologies such as screen readers announce the progress correctly.


    It’s important to note that in addition to supporting users with cognitive disabilities,
    the preceding techniques support a larger percentage of users, including people
    with intersectional identities and disabilities. Abstracting information and building
    clarity within a UX supports users with a wide variety of processing styles, from
    auditory to visual, and thus supports a larger percentage of users.


    # Easy reversal of actions


    It’s important that users feel in control and are not penalized for their mistakes.
    This is particularly important for users with cognitive disabilities, who may
    need more time to complete tasks and may make mistakes more frequently, and aligns
    with another of Shneiderman’s Eight Golden Rules: “Support internal locus of control
    and allow easy reversal of actions.” When users know they can undo or revise their
    actions without consequence, it reduces anxiety, encourages exploration, and makes
    digital environments feel safer and more supportive.


    For example, offering a Back or Cancel option on every page allows users to correct
    mistakes without fear of causing permanent issues. This is especially important
    when it comes to data-sensitive and critical decisions, such as the deletion of
    important information, prompting users for confirmation, and ensuring the consequences
    of proceeding are clear.


    Another example is when signing off on a critical task, such as authorizing a
    bank account change or completing a large money transfer online. In such cases,
    providing an easy way to review and reverse actions with a clear Cancel or Edit
    option not only reduces anxiety and errors for all users but is especially important
    for people with cognitive disabilities who may need extra time or multiple attempts
    to confirm their choices.'
  merge: -1
  img_proc: true
- pgno: 136
  md: <!-- no content -->
