- pgno: 72
  md: 'Whether you’re building a new product or retrofitting an existing one, the
    most effective feedback will come from people who use the technology every day,
    not from internal teams trying to simulate unfamiliar experiences.


    Beginner tip: Start with moderated usability testing sessions with 3–5 participants
    who use different assistive technologies (e.g., a screen reader user, a switch
    device user, and someone who relies on voice control).


    Expert-level move: Establish a standing disability advisory council, or embed
    disabled professionals into product and UX teams from the outset.


    # Move from testing to partnership: integrating feedback into workflows


    Feedback isn’t valuable unless it’s integrated into decision-making. One-time
    user testing is a start, but sustainable accessibility comes from building feedback
    loops into every sprint, release, and review.


    Here’s how to build accessible collaboration into your process:


    +   - Use real assistive tech (not simulations) during QA and internal reviews.
    Test with screen readers (JAWS, NVDA, VoiceOver), screen magnifiers, switch controls,
    and voice navigation tools.

    +   - Create bug-reporting or barrier-tracking mechanisms that include severity
    ratings and accessibility impact, so fixes are prioritized alongside visual or
    functional defects.

    +   - Bring designers, developers, and QA into user debriefs, not just product
    owners. Shared insight leads to shared accountability.

    +   - Document what was learned and share it across teams. Avoid siloed knowledge
    that leaves accessibility up to one champion.


    Beginner tip: Add a screen reader test to your Definition of Done.


    Expert-level move: Assign accessibility liaisons across product teams who connect
    directly with disabled users to close the feedback loop.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# From awareness to action: creating a culture of accountability


    True inclusion doesn’t stop at testing – it lives in your organizational values,
    your workflows, and your hiring practices. Creating a culture where accessibility
    is expected, not exceptional, requires ongoing commitment:


    +   - Replace empathy workshops or simulations with training led by disabled people,
    focused on real-world impacts and solutions.

    +   - Celebrate accessibility wins and highlight lived experience voices during
    sprint demos, town halls, or retrospectives. Visibility matters.

    +   - Ensure leadership supports accessibility as a cross-functional priority,
    not an afterthought owned only by compliance teams.

    +   - Measure progress using metrics such as usability scores from disabled users,
    not just WCAG pass/fail rates.


    Beginner tip: Launch an internal accessibility education series that spotlights
    disabled voices and practical tools.


    Expert-level move: Tie accessibility metrics into OKRs or KPIs, aligning inclusion
    with business goals.


    You don’t need to simulate disability to understand the need for inclusion. You
    need to listen, hire, involve, and invest. Disabled people don’t need to be imagined
    – they need to be heard, trusted, and included. Their insights aren’t edge cases
    – they’re central to building systems that work for everyone. When accessibility
    is informed by real experiences, the result is better products, better outcomes,
    and a more just digital world.


    # Summary


    In this chapter, you explored how different types of disabilities – visual, auditory,
    motor, cognitive, and mental health – shape the way users interact with digital
    experiences. You learned how these differences influence access needs and how
    various assistive technologies, such as screen readers, refreshable Braille displays,
    switch controls, and magnifiers, support access for millions of users. We also
    looked at the importance of clear content structure, meaningful labels, keyboard
    navigation, and flexible interfaces in supporting usability across disability
    types.'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'Understanding these user needs is essential for creating accessible products
    that go beyond technical compliance. You saw how inaccessible design choices can
    limit access to critical services such as banking and healthcare, and how inclusive
    practices – such as plain language, accessible authentication, and support for
    customization – can restore autonomy and trust. This chapter also emphasized the
    importance of testing with real users and assistive technologies, and of centering
    lived experience rather than relying on simulations.


    In the next chapter, we’ll move from understanding user needs to applying legal
    and ethical considerations to product design. You’ll learn how to align your work
    with accessibility laws and standards, integrate inclusive practices into design
    systems and development workflows, and scale accessibility across teams and organizations.'
