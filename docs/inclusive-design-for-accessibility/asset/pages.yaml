- pgno: 3
  md: 'To my parents, Paul and Geraldine, who taught me – loudly and without apology
    – that people with disabilities are just that: people. Your unwavering clarity
    became my compass. And to my wife, Heather Humble – my fiercest believer, my truest
    partner. This entire book carries your fingerprints, whether visible or not. You’re
    my favorite.


    - Dale Cruse


    To those living with invisible disabilities or neurodivergent minds. To those
    who feel they must hide their truth to stay safe, fit in, or be seen as “enough.”
    To those who’ve mastered the art of masking, not because they want to, but because
    they have to. This book is for you. May the world soon be one where we no longer
    have to mask to belong.


    - Denis Boudreau'
