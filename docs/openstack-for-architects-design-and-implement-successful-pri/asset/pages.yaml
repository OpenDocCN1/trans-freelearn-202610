    > > A quick note on the Neutron settings, as they''ve always seemed confusing
    to us. The tunnel interface setting is used by the puppet module to determine
    the `local_ip` setting in the Open vSwitch plugin configuration file. The bridge
    mappings setting is the same as `bridge_mappings` in the Open vSwitch plugin configuration
    file. The bridge interfaces setting, however, doesn''t effect the plugin configuration.
    Instead, it''s used by the puppet module to determine how to construct the Open
    vSwitch bridge which is referred to by the `bridge_mappings` setting. If you intend
    to construct the bridge manually, it''s safe to leave out that setting.


    Now, run `packstack` with the new configuration:


    ```

