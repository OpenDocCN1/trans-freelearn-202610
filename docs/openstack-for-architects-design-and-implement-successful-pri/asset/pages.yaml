- pgno: 12
  md: '# Preface


    This guide leads you through each of the major decision points that you''ll face
    as you architect an OpenStack private cloud for your organization. At each point,
    we offer you advice based on years of experience designing and leading successful
    OpenStack projects in a wide range of industries. Each chapter also includes lab
    materials that give you a chance to install and configure the technologies used
    to build production-quality OpenStack clouds. Most importantly, we focus on ensuring
    that your OpenStack project meets the needs of your organization, which will guarantee
    a successful roll-out.


    # What this book covers


    Chapter 1, *Introducing OpenStack*, helps you familiarize yourself with the components
    of OpenStack.


    Chapter 2, *Architecting the Cloud*, explains the software, hardware, network,
    and storage selection options for OpenStack.


    Chapter 3, *Planning for Failure (and Success)*, covers techniques of increasing
    the scalability and availability of the cloud.


    Chapter 4, *Building the Deployment Pipeline*, shows how to use the concepts of
    DevOps to create a continuously integrated and delivered OpenStack deployment.


    Chapter 5, *Building to Operate*, explains how to architect a private cloud that
    is optimized for operations.


    Chapter 6, *Integrating the Platform*, reveals three different integration patterns
    for OpenStack clouds.


    Chapter 7, *Securing the Cloud*, introduces how to design a private cloud that
    is secure from the beginning.


    Chapter 8, *Conclusion*, covers creating a compelling road map for the future
    of Infrastructure as a Service in your organization.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# What you need for this book


    All of the software used in the examples in this book is available at no cost
    on the Internet. Links are provided for each of the projects used. Many of the
    lab exercises require access to physical hardware. We recommend having at least
    four and up to 12 physical servers available for deploying OpenStack.


    # Who this book is for


    This book is written especially for those who will design OpenStack clouds and
    lead their implementation. These people are typically cloud architects, but may
    also be in product management, systems engineering, or enterprise architecture.


    # Conventions


    In this book, you will find a number of text styles that distinguish between different
    kinds of information. Here are some examples of these styles and an explanation
    of their meaning.


    Code words in text, database table names, folder names, filenames, file extensions,
    pathnames, dummy URLs, user input, and Twitter handles are shown as follows: "The
    keystonerc_admin file can be used to authenticate an administrative user and the
    keystonerc_demo file can be used to authenticate a non-privileged user."


    A block of code is set as follows:


    ```

    export OS_USERNAME=demo

    export OS_TENANT_NAME=demo

    export OS_PASSWORD=<random string>

    export OS_AUTH_URL=http://192.168.0.10:5000/v2.0/

    export PS1=''[\u@\h \W(keystone_demo)]\$ ''

    ```


    When we wish to draw your attention to a particular part of a code block, the
    relevant lines or items are set in bold:


    ```

    export OS_USERNAME=demo

    export OS_TENANT_NAME=demo

    export OS_PASSWORD=<random string>

    export OS_AUTH_URL=http://192.168.0.10:5000/v2.0/

    export PS1=''[\u@\h \W(keystone_demo)]\$ ''

    ```'
