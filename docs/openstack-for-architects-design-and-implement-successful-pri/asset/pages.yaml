- pgno: 171
  md: '# Red Hat Enterprise Linux and CentOS


    Using any distribution of Linux, it is vital to update any affected software in
    a timely manner to limit security risks. If the software is part of a package
    within Red Hat, the vulnerability should be patched as soon as it is released
    by Red Hat. Often, Red Hat includes patches with their security announcements
    and then releases it as a security erratum update. Again, it is vital to apply
    patches and updates as soon as they are released to help eliminate the risk of
    an attacker using the bug against your OpenStack infrastructure. This can be accomplished
    using the Yum Package Manager to download from only trusted sources. These trusted
    sources could be the Red Hat Network (RHN) or a local repository that is under
    your organization''s control. All downloaded packages from outside your organization
    should be verified for authenticity using the GNU Privacy Guard or GNUPG, a free
    package used for ensuring the authenticity of package files. If the verification
    fails, either the package is corrupt or it has been compromised.


    # Canonical Ubuntu based operating systems


    The Ubuntu security and patching ecosystem is very similar to Red Hat. Security
    updates are released by Canonical’s Ubuntu developers whenever they discover and
    patch vulnerabilities. Security notices can be delivered via e-mail or by subscribing
    via RSS. Ubuntu allows you to have security updates automatically installed –
    once configured you don''t need to run security updates manually again. Ubuntu
    allows users to configure automatic security updates via `unattended-upgrades`
    using `cron-apt`. Similar behavior can be applied to Red Hat hosts using `yum-cron`
    with `update_cmd = minimal-security-severity:Important`.


    # Software repository management


    Software repository management is vital in order to provide secure updates to
    an OpenStack infrastructure. Red Hat has developed a management application called
    **Satellite** and Ubuntu has **Landscape**. Both of these are systems management
    applications that allow administrators to deploy, patch, manage, and monitor their
    respective systems. These applications are an on-premise way to download and manage
    content from remote distribution portals. They reduce the amount of traffic over
    a corporate WAN during system updates, since all packages are only transferred
    to the local repository once. These applications also manage the update files
    locally to limit security risks of outside malicious content.'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'Satellite can even be configured as a single system or as a series of remote
    systems that act like proxies and get authorization and subscription information
    from a central server. These commercial applications also give users a single
    pane of glass for package management and allow profiles of updates to be created
    for separate classes of servers in the enterprise.


    One alternative is to create and maintain a package repository manually using
    open source tools such as Puppet, Chef, and Ansible by creating scripts that do
    replication and validation. However, a more complete option is to use a community
    project such as Pulp (http://www.pulpproject.org/). Pulp is a free and open-source
    platform for managing software repositories. It is configurable to support RPM
    package types (rpm, srpm, errata, and so on), Puppet modules, Docker images, Atomic
    Trees, Python packages, and more. There is also a way to support Debian packages
    through a plugin. With Pulp you can do the following:


    +   - Pull in content from distribution repositories to the Pulp server manually
    on either a one-time-only or recurring basis

    +   - Upload your own content to the Pulp server (OpenStack security patches)

    +   - Publish content as a web-based repository, a series of ISOs, or various
    other methods


    Software patching and repository management get incrementally more difficult as
    the number of hosts to be patched increases. Starting an OpenStack deployment
    with a proper patching strategy and the tools to manage and enable patching is
    critical for scaling an OpenStack cloud. By applying and testing security patches
    to the OpenStack infrastructure, first in lower environments and then in production,
    organizations will ensure that both the development and production environments
    are secure and tested for operations.


    # Hardening hypervisors


    The Nova service, one of OpenStack''s most complex projects, provides compute
    functionality in the environment. Nova is very pervasive throughout an OpenStack
    cloud and interacts with most of the other core IaaS services. Proper configuration
    of this particular service is an important factor in securing an OpenStack deployment.'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# Standard Linux hardening practices and hypervisors


    The key to security in an OpenStack environment is the configuration and hardening
    of the virtualization technology, also called the hypervisor. While OpenStack
    can be configured to use many different hypervisors, by far the most common hypervisor
    in use is KVM. All of the top operating systems such as RHEL, Ubuntu, and CentOS
    support the KVM hypervisor. All of the top OpenStack distributions such as Red
    Hat OpenStack Platform, Mirantis OpenStack, and HP Helion use KVM as the default
    hypervisor. Therefore, we will focus our attention on the KVM hypervisor running
    on Linux for production grade security.


    Additionally, the KVM hypervisor has been certified through the U.S. Government''s
    Common Criteria program on commercial distributions and has been validated to
    separate the runtime environment of the instances from each other, providing adequate
    instance separation. For more information refer to https://www.niap-ccevs.org/NIAP_Evolution/faqs/nstissp-11/.


    Red Hat OpenStack Platform, one distribution that has been Common Criteria certified,
    had to satisfy the following list of minimal authentication requirements:


    +   - Audit (ability to audit large amounts of events in detail)

    +   - Discretionary access control

    +   - Mandatory access control

    +   - Role-based access control

    +   - Object reuse (file system objects, memory, and IPC objects)

    +   - Security management of administrative users

    +   - Secure communication (SSH)

    +   - Storage encryption (encrypted block device support)

    +   - TSF protection (kernel software and data protection by hardware)'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# Securing the Cloud


    While these identity and authentication functions are required for U.S. Government
    software certification, these are also essential for production cloud environments,
    especially those operating in the public zone and connected to the Internet. The
    output from these tools should be fed into a larger logging, monitoring, and alerting
    framework that was discussed in Chapter 5, *Building to Operate*. While using
    tools such as ELK and other log processing and auditing tools, security alerts
    can be generated when any security event occurs or thresholds are breached.


    In addition to identity and authentication, many different cryptographic standards
    are available to OpenStack for identification, authentication, data transfer encryption,
    and protection for data at rest. Some of these are as follows:


    +   - AES: Data in motion and data at rest

    +   - TDES: Data in motion

    +   - RSA: Data in motion and identification/authentication

    +   - DSA: Data in motion and identification/authentication

    +   - Serpent: Data at rest

    +   - Twofish: Data at rest

    +   - SHA-1: Data in motion and data at rest

    +   - SHA-2: Data at rest and identification/authorization


    It''s not only the underlying operating system that must provide features to have
    optimal security, the hardware that runs the compute host, and thus, the hypervisor
    should also support the following:


    | Feature | Hardware Description | Security Enhancement |

    |---|---|---|

    | VT-d / AMD-Vi | I/O MMU | PCI-Passthrough Protection |

    | Intel TXT / SEM | Intel Trusted Execution Technology | Dynamic attestation services
    |

    | SR-IOV, MR-IOV, ATS | PCI-SIG I/O virtualization | Secure sharing of PCI Express
    devices by multiple instances. |

    | VT-C | Network Virtualization | Network I/O Improvements on hypervisors |


    In addition to hardware and operating system requirements, KVM also supports additional
    features such as sVirt (SELinux and Virtualization), Intel TXT, and AppArmor.'
  merge: -1
  img_proc: true
