- pgno: 58
  md: '# 3


    # Planning for Failure (and Success)


    In this chapter, we’ll be walking through how to architect your cloud to avoid
    hardware and software failures. The OpenStack control plane is comprised of web
    services, application services, database services, and a message bus. All of these
    tiers require different approaches to make them highly available and some organizations
    will already have defined architectures for each of the services. We’ve seen that
    customers either reuse those existing patterns or adopt new ones which are specific
    to the OpenStack platform. Both of these approaches make sense, depending on the
    scale of the deployment. Many successful deployments actually implement a blend
    of these.


    For example, if your organization already has a supported pattern for highly available
    MySQL databases, you might chose that pattern instead of the one outlined in this
    chapter. If your organization doesn’t have a pattern for highly available MongoDB,
    you might have to architect a new one.


    This chapter is divided into the following topics:


    +   - Highly available control plane strategies and patterns

    +   - OpenStack regions, cells, and availability zones

    +   - Updating the design document and implementing the design'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# Building a highly available control plane


    Back in the Folsom and Grizzly days, coming up with an **High Availability (H/A)**
    design for the OpenStack control plane was something of a black art. Many of the
    technologies recommended in the first iterations of the OpenStack High Availability
    Guide were specific to the Ubuntu distribution of Linux and were unavailable on
    the Red Hat Enterprise Linux-derived distributions.


    The now-standard cluster resource manager (Pacemaker) was unsupported by Red Hat
    at that time. As such, architects using Ubuntu might use one set of software,
    those using CentOS or RHEL might use another set of software, and those using
    a Rackspace or Mirantis distribution might use yet another set of software. However,
    these days, the technology stack has converged and the H/A pattern is largely
    consistent regardless of the distribution used.


    # About failure and success


    When we design a highly available OpenStack control plane, we''re looking to mitigate
    two different scenarios:


    +   - The first is failure. When a physical piece of hardware dies, we want to
    make sure that we recover without human interaction and continue to provide service
    to our users.

    +   - The second and perhaps more important scenario is success.


    Software systems always work as designed and tested until humans start using them.
    While our automated test suites will try to launch a reasonable number of virtual
    objects, humans are guaranteed to attempt to launch an unreasonable number. Also,
    many of the OpenStack projects we''ve worked on have grown far past their expected
    size and need to be expanded on-the-fly.'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'One of the early Havana-based clouds we worked on used a memory-based fiber
    channel storage array as a Cinder backend. All of our automated testing for the
    platform succeeded, but within a week of handing it over, we were told that the
    operators couldn’t launch virtual instances. Our automated unit tests continued
    to succeed, but the manual testing the operators were doing continued to fail.
    Baffled, we sat down with the operators to see what they were doing differently.
    In the Horizon UI, there’s an option to launch multiple instances concurrently
    with a single API command. The operator’s tenant had a quota of 100 instances,
    and they were specifying 100 instances when they went to test the platform. The
    first 8 would succeed, but the last 92 would fail. It turned out that the backend
    could only execute eight concurrent operations and anything more than that would
    error out. Our unit tests created multiple instances concurrently, but never more
    than eight, so we never caught the error.


    There are a few different types of success scenarios that we need to plan for
    when architecting an OpenStack cloud.


    First, we need to plan for a growth in the number of instances. This is relatively
    straightforward. Each additional instance grows the size of the database, it grows
    the amount of metering data in Ceilometer, and, most importantly, it will grow
    the number of compute nodes. Adding compute nodes and reporting puts strain on
    the message bus, which is typically the limiting factor in the size of OpenStack
    regions or cells. We’ll talk more about this when we talk about dividing up OpenStack
    clouds into regions, cells, and availability zones.


    The second type of growth we need to plan for is an increase in the number of
    API calls. Deployments which support Continuous Integration(CI) development environments
    might have (relatively) small compute requirements, but CI typically brings up
    and tears down environments rapidly. This will generate a large amount of API
    traffic, which in turn generates a large amount of database and message traffic.


    In hosting environments, end users might also manually generate a lot of API traffic
    as they bring up and down instances, or manually check the status of deployments
    they’ve already launched. While a service catalog might check the status of instances
    it has launched on a regular basis, humans tend to hit refresh on their browsers
    in an erratic fashion. Automated testing of the platform has a tendency to grossly
    underestimate this kind of behavior.'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'With that in mind, any pattern that we adopt will need to provide for the following
    requirements:


    +   - API services must continue to be available during a hardware failure in
    the control plane

    +   - The systems which provide API services must be horizontally scalable (and
    ideally elastic) to respond to unanticipated demands

    +   - The database services must be vertically or horizontally scalable to respond
    to unanticipated growth of the platform

    +   - The message bus can either be vertically or horizontally scaled depending
    on the technology chosen


    Finally, every system has its limits. These limits should be defined in the architecture
    documentation so that capacity planning can account for them. At some point, the
    control plane has scaled as far as it can and a second control plane should be
    deployed to provide additional capacity. Although OpenStack is designed to be
    massively scalable, it isn''t designed to be infinitely scalable.


    # High availability patterns for the control plane


    There are three approaches commonly used in OpenStack deployments these days for
    achieving high availability of the control plane.


    The first is the simplest. Take the single-node cloud controller that we deployed
    in Chapter 2, Architecting the Cloud, virtualize it, and then make the virtual
    machine highly available using either VMware clustering or Linux clustering. While
    this option is simple and it provides for failure scenarios, it scales vertically
    (not horizontally) and doesn''t provide for success scenarios. As such, it should
    only be used in regions with a limited number of compute nodes and a limited number
    of API calls. In practice, this method isn''t used frequently and we won''t spend
    any more time on it here.


    The second pattern provides for H/A, but not horizontal scalability. This is the
    “Active/Passive” scenario described in the OpenStack High Availability Guide.
    At Red Hat, we used this a lot with our Folsom and Grizzly deployments, but moved
    away from it starting with Havana. It''s similar to the virtualization solution
    described earlier but instead of relying on VMware clustering or Linux clustering
    to restart a failed virtual machine, it relies on Linux clustering to restart
    failed services on a second cloud controller node, also running the same subset
    of services. This pattern doesn''t provide for success scenarios in the Web tier,
    but can still be used in the database and messaging tiers. Some networking services
    may still need to be provided as Active/Passive as well.'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'The third H/A pattern available to OpenStack architectures is the Active/Active
    pattern. In this pattern, services are horizontally scaled out behind a load balancing
    service or appliance, which is Active/Passive. As a general rule, most OpenStack
    services should be enabled as Active/Active where possible to allow for success
    scenarios while mitigating failure scenarios. Ideally, Active/Active services
    can be scaled out elastically without service disruption by simply adding additional
    control plane nodes.


    Both of the Active/Passive and Active/Active designs require clustering software
    to determine the health of services and the hosts on which they run. In this chapter,
    we''ll be using Pacemaker as the cluster manager. Some architects may choose to
    use Keepalived instead of Pacemaker.


    In addition to these three scenarios, there are always limitations on scaling
    OpenStack services beyond a certain limit. As previously mentioned, the messaging
    bus is typically the first service to see issues with regard to scale; however,
    it''s not the only place. During scale testing at Canonical and Mirantis, testers
    found issues with the Nova and Cinder projects as well as issues with the database
    service at scale. It is always best practice to monitor the responsiveness of
    all of the OpenStack services as well as performing scale testing using tools
    such as Tempest and/or Rally in a simulated environment to assess the impact of
    demand growth on your OpenStack clouds.


    # Active/Passive service configuration


    In the Active/Passive service configuration, the service is configured and deployed
    to two or more physical systems. The service is associated with a **Virtual IP
    (VIP)** address. A cluster resource manager (normally Pacemaker) is used to ensure
    that the service and its VIP are enabled on only one of the two systems at any
    point in time. The resource manager may be configured to favor one of the machines
    over the other.


    When the machine that the service is running on fails, the resource manager first
    ensures that the failed machine is no longer running and then it starts the service
    on the second machine. Ensuring that the failed machine is no longer running is
    accomplished through a process known as **fencing**. Fencing usually entails powering
    off the machine using the management interface on the BIOS. The fence agent may
    also talk to a power supply connected to the failed server to ensure that the
    system is down.


    Some services (such as the Glance image registry) require shared storage to operate.
    If the storage is network-based, such as NFS, the storage may be mounted on both
    the active and the passive nodes simultaneously. If the storage is block-based,
    such as iSCSI, the storage will only be mounted on the active node and the resource
    manager will ensure that the storage migrates with the service and the VIP.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# # Active/Active service configuration


    Most of the OpenStack API services are designed to be run on more than one system
    simultaneously. This configuration, the Active/Active configuration, requires
    a load balancer to spread traffic across each of the active services. The load
    balancer manages the VIP for the service and ensures that the backend systems
    are listening before forwarding traffic to them. The cluster manager ensures that
    the VIP is only active on one node at a time. The backend services may or may
    not be managed by the cluster manager in the Active/Active configuration. Service
    or system failure is detected by the load balancer and failed services are brought
    out of rotation.


    There are a few different advantages to the Active/Active service configuration,
    which are as follows:


    +   - The first advantage is that it allows for horizontal scalability. If additional
    capacity is needed for a given service, a new system can be brought up which is
    running the service and it can be added into rotation behind the load balancer
    without any downtime. The control plane may also be scaled down without downtime
    in the event that it was over-provisioned.

    +   - The second advantage is that Active/Active services have a much shorter
    mean time to recovery. Fencing operations often take up to two minutes and fencing
    is required before the cluster resource manager will move a service from a failed
    system to a healthy one. Load balancers can immediately detect system failure
    and stop sending requests to unresponsive nodes while the cluster manager fences
    them in the background.


    Whenever possible, architects should employ the Active/Active pattern for the
    control plane services.


    # # OpenStack service specifics


    In this section, we''ll walk through each of the OpenStack services and outline
    the H/A strategy for them. While most of the services can be configured as Active/Active
    behind a load balancer, some of them must be configured as Active/Passive and
    others may be configured as Active/Passive. Some of the configuration is dependent
    on a particular version of OpenStack as well, especially, Ceilometer, Heat, and
    Neutron. The following details are current as of the Liberty release of OpenStack.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# OpenStack web services


    As a general rule, all of the web services and the Horizon dashboard may be run
    Active/Active. These include the API services for Keystone, Glance, Nova, Cinder,
    Neutron, Heat, and Ceilometer. The scheduling services for Nova, Cinder, Neutron,
    Heat, and Ceilometer may also be deployed Active/Active. These services do not
    require a load balancer, as they respond to requests on the message bus.


    The only web service which must be run Active/Passive is the Ceilometer Central
    agent. This service can be configured to split its workload among multiple instances,
    however, to support scaling horizontally.


    # Database services


    All state for the OpenStack web services is stored in a central database, usually
    a MySQL database. MySQL is usually deployed in an Active/Passive configuration,
    but can be made Active/Active with the Galera replication extension. Galera is
    clustering software for MySQL (MariaDB in OpenStack) and this uses synchronous
    replication to achieve H/A. However, even with Galera, we still recommend directing
    writes to only one of the replicas; some queries used by the OpenStack services
    may deadlock when writing to more than one master. With Galera, a load balancer
    is typically deployed in front of the cluster and is configured to deliver traffic
    to only one replica at a time. This configuration reduces the mean time to recovery
    of the service while ensuring that the data is consistent.


    In practice, many organizations will defer to database architects for their preference
    regarding highly available MySQL deployments. After all, it is typically the database
    administration team who is responsible for responding to failures of that component.


    Deployments which use the Ceilometer service also require a MongoDB database to
    store telemetry data. MongoDB is horizontally scalable by design and is typically
    deployed Active/Active with at least three replicas.


    # The message bus


    All OpenStack services communicate through the message bus. Most OpenStack deployments
    these days use the RabbitMQ service as the message bus. RabbitMQ can be configured
    to be Active/Active through a facility known as “mirrored queues”. The RabbitMQ
    service is not load- balanced; each service is given a list of potential nodes
    and the client is responsible for determining which nodes are active and which
    ones have failed.'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'Other messaging services used with OpenStack such as ZeroMQ, ActiveMQ, or Qpid
    may have different strategies and configurations for achieving H/A and horizontal
    scalability. For these services, refer to the documentation to determine the optimal
    architecture.


    # Compute, storage, and network agents


    The compute, storage, and network components in OpenStack have a set of services,
    that perform the work which is scheduled by the API services. These services register
    themselves with the schedulers on start up over the message bus. The schedulers
    are responsible for determining the health of the services and scheduling work
    to active services. The compute and storage services are all designed to be run
    Active/Active but the network services need some extra consideration.


    Each hypervisor in an OpenStack deployment runs the nova-compute service. When
    this service starts up, it registers itself with the nova-scheduler service. A
    list of currently available nova services is available via the nova service-list
    command. If a compute node is unavailable, its state is listed as down and the
    scheduler skips it when performing instance actions. When the node becomes available,
    the scheduler includes it in the list of available hosts.


    For KVM or Xen-based deployments, the nova-compute service runs once per hypervisor
    and is not made highly available. For VMware-based deployments though, a single
    nova-compute service is run for every vSphere cluster. As such, this service should
    be made highly available in an Active/Passive configuration. This is typically
    done by virtualizing the service within a vSphere cluster and configuring the
    virtual machine to be highly available.


    Cinder includes a service known as the volume service or cinder-volume. The volume
    service registers itself with the Cinder scheduler on startup and is responsible
    for creating, modifying, or deleting LUNs on block storage devices. For backends
    which support multiple writers, multiple copies of this service may be run in
    Active/Active configuration. The LVM backend (this is the reference backend) is
    not highly available, though, and may only have one cinder-volume service for
    each block device. This is because the LVM backend is responsible for providing
    iSCSI access to a locally attached storage device.


    ![](img/2f752555f69992669defa8b25e6dcee9_65_0.png)


    For this reason, highly available deployments of OpenStack should avoid the LVM
    Cinder backend and instead use a backend that supports multiple cinder-volume
    services.'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'Finally, the Neutron component of OpenStack has a number of agents, which all
    require some special consideration for highly available deployments. The DHCP
    agent can be configured as highly available, and the number of agents which will
    respond to DHCP requests for each subnet is governed by a parameter in the neutron.conf
    file, dhcp_agents_per_network. This is typically set to 2, regardless of the number
    of DHCP agents which are configured to run in a control plane.


    For most of the history of OpenStack, the L3 routing agent in Neutron has been
    a single point of failure. It could be made highly available in Active/Passive
    configuration, but its failover meant an interruption of network connections in
    the tenant space. Many of the third-party Neutron plugins have addressed this
    in different ways and the reference Open vSwitch plugin has a highly available
    L3 agent as of the Juno release. For details on implementing a solution to the
    single routing point of failure using OpenStack''s Distributed Virtual Routers
    (DVR), refer to the OpenStack Foundation''s Neutron documentation at http://docs.openstack.org/liberty/networking-guide/scenario-dvr-ovs.html.


    # Regions, cells, and availability zones


    As we mentioned before, OpenStack is designed to be scalable, but not infinitely
    scalable. There are three different techniques architects can use to segregate
    an OpenStack cloud: regions, cells, and availability zones. In this section, we''ll
    walk through how each of these concepts maps to hypervisor topologies.


    # Regions


    From an end user''s perspective, OpenStack regions are equivalent to regions in
    Amazon Web Services. Regions live in separate data centers and are often named
    after their geographical location. If your organization has a data center in Phoenix
    and one in Raleigh you''ll have at least a PHX and a RDU region. Users who want
    to geographically disperse their workloads will place some of them in PHX and
    some of them in RDU. Regions have separate API endpoints, and although the Horizon
    UI has some support for multiple regions, they are essentially entirely separate
    deployments.'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'From an architectural standpoint, there are two main design choices for implementing
    regions, which are as follows:


    +   - The first is around authorization. Users will want to have the same credentials
    for accessing each of the OpenStack regions. There are a few ways to accomplish
    this. The simplest way is to use a common backing store (usually LDAP) for the
    Keystone service in each region. In this scenario, the user has to authenticate
    separately to each region to get a token, but the credentials are the same.


    In Juno and later, Keystone also supports federation across regions. In this scenario,
    a Keystone token granted by one region can be presented to another region to authenticate
    a user. While this currently isn''t widely used, it is a major focus area for
    the OpenStack Foundation and will probably see broader adoption in the future.


    +   - The second major consideration for regional architectures is whether or
    not to present a single set of Glance images to each region. While work is currently
    being done to replicate Glance images across federated clouds, most organizations
    are manually ensuring that the shared images are consistent. This typically involves
    building a workflow around image publishing and deprecation which is mindful of
    the regional layout.


    Another option for ensuring consistent images across regions is to implement a
    central image repository using Swift. This also requires shared Keystone and Glance
    services which span multiple data centers. Details on how to design multiple regions
    with shared services are in the OpenStack Architecture Design Guide.


    # Cells


    The Nova compute service has the concept of cells, which can be used to segregate
    large pools of hypervisors within a single region. This technique is primarily
    used to mitigate the scalability limits of the OpenStack message bus. The deployment
    at CERN makes wide use of cells to achieve massive scalability within single regions.


    Support for cells varies from service to service and as such cells are infrequently
    used outside a few very large cloud deployments. The CERN deployment is well-documented
    and should be used as a reference for these types of deployments.'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'In our experience, it''s much simpler to deploy multiple regions within a single
    data center than to implement cells to achieve large scale. The added inconvenience
    of presenting your users with multiple API endpoints within a geographic location
    is typically outweighed by the benefits of having a more robust platform. If multiple
    control planes are available in a geographic region, the failure of a single control
    plane becomes less dramatic.


    ![](img/2f752555f69992669defa8b25e6dcee9_68_0.png)


    The cell architecture has its own set of challenges with regard to networking
    and scheduling of instance placement. Some very large companies that support the
    OpenStack effort have been working for years to overcome these hurdles. However,
    many different OpenStack distributions are currently working on a new control
    plane design. These new designs would begin to split the OpenStack control plane
    into containers running the OpenStack services in a microservice type architecture.
    This way the services themselves can be placed anywhere and be scaled horizontally
    based on the load. One architecture that has garnered a lot of attention lately
    is the Kolla project, which promotes Docker containers and Ansible playbooks to
    provide production-ready containers and deployment tools for operating OpenStack
    clouds. To see more, go to https://wiki.openstack.org/wiki/Kolla.


    # Availability zones


    Availability zones are used to group hypervisors within a single OpenStack region.
    Availability zones are exposed to the end user and should be used to provide the
    user with an indication of the underlying topology of the cloud. The most common
    use case for availability zones is to expose failure zones to the user.


    To ensure the H/A of a service deployed on OpenStack, a user will typically want
    to deploy the various components of their service onto hypervisors within different
    racks. This way, the failure of a top of rack switch or a PDU will only bring
    down a portion of the instances which provide the service. Racks form a natural
    boundary for availability zones for this reason. There are a few other interesting
    uses of availability zones apart from exposing failure zones to the end user.
    One financial services customer we work with had a requirement for the instances
    of each line of business to run on dedicated hardware. A combination of availability
    zones and the AggregateMultiTenancyIsolation Nova Scheduler filter was used to
    ensure that each tenant had access to dedicated compute nodes.'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'Availability zones can also be used to expose hardware classes to end users.
    For example, hosts with faster processors might be placed in one availability
    zone and hosts with slower processors might be placed in different availability
    zones. This allows end users to decide where to place their workloads based upon
    compute requirements.


    # Updating the design document


    In this chapter, we walked through the different approaches and considerations
    for achieving H/A and scalability in OpenStack deployments. As Cloud Architects,
    we need to decide on the correct approach for our deployment and then document
    it thoroughly so that it can be evaluated by the larger team in our organization.


    Each of the major OpenStack vendors has a reference architecture for highly available
    deployments and these should be used as a starting point for the design. The design
    should then be integrated with the existing Enterprise Architecture and modified
    to ensure that best practices established by the various stakeholders within an
    organization are followed.


    For example, Red Hat’s highly available control plane uses the Galera extension
    to achieve Active/Active MariaDB services, but the database architects within
    an organization may only support Oracle’s MySQL in an Active/Passive configuration.
    The Cloud Architect may choose to implement the database architect’s proven pattern
    instead if they intend on asking for support from the database administration
    team. The network architects within an organization may be more comfortable supporting
    F5 load balancers than HAProxy load balancers.


    The system administrators within an organization may be more comfortable supporting
    Pacemaker than Keepalived. The design document presents the choices made for each
    of these key technologies and gives the stakeholders an opportunity to comment
    on them before the deployment.


    # Planning the physical architecture


    In the previous chapter, we updated the Physical architecture section to include
    a definition of the various host groups which we will be deploying. The simplest
    way to achieve H/A is to add additional cloud controllers to the deployment and
    cluster them. Other deployments may choose to segregate services into different
    host classes, which can then be clustered. This may include separating the database
    services into database nodes, separating the messaging services into messaging
    nodes, and separating the memcached service into memcache nodes.'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'Load balancing services might live on their own nodes as well. The primary
    considerations for mapping scalable services to physical (or virtual) hosts are
    the following:


    +   - Does the service scale horizontally or vertically?

    +   - Will vertically scaling the service impede the performance of other co-located
    services?

    +   - Does the service have particular hardware or network requirements that other
    services don’t have?


    For example, some OpenStack deployments which use the HAProxy load balancing service
    chose to separate out the load balancing nodes on a separate hardware. The VIPs
    which the load balancing nodes host must live on a public, routed network, while
    the internal IPs of services that they route to don’t have that requirement. Putting
    the HAProxy service on separate hosts allows the rest of the control plane to
    only have private addressing.


    Grouping all of the API services on dedicated hosts may ease horizontal scalability.
    These services don’t need to be managed by a cluster resource manager and can
    be scaled by adding additional nodes to the load balancers without having to update
    cluster definitions. Database services have high I/O requirements. Segregating
    these services onto machines which have access to a high-performance fibre channel
    may make sense.


    Finally, you should consider whether or not to virtualize the control plane. If
    the control plane will be virtualized, creating additional host groups to host
    dedicated services becomes very attractive. Having eight or nine virtual machines
    dedicated to the control plane is a very different proposition from having eight
    or nine physical machines dedicated to the control plane.


    Most highly available control planes require at least three nodes to ensure that
    quorum is easily determined by the cluster resource manager. While dedicating
    three physical nodes to the control function of a hundred node OpenStack deployment
    makes a lot of sense, dedicating nine physical nodes may not. Many of the organizations
    that we’ve worked with will already have a VMware-based cluster available for
    hosting management appliances and the control plane can be deployed within that
    existing footprint. Organizations which are deploying a KVM-only cloud may not
    want to incur the additional operational complexity of managing the additional
    virtual machines outside OpenStack.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Updating the physical architecture design


    Once the mapping of services to physical (or virtual) machines has been determined,
    the design document should be updated to include a definition of the host groups
    and their associated functions. A simple example is provided as follows:


    +   - **Load balancer:** These systems provide the load balancing services in
    an Active/Passive configuration

    +   - **Cloud controller:** These systems provide the API services, the scheduling
    services, and the Horizon dashboard services in an Active/Active configuration

    +   - **Database node:** These systems provide the MySQL database services in
    an Active/Passive configuration

    +   - **Messaging node:** These systems provide the RabbitMQ messaging services
    in an Active/Active configuration

    +   - **Compute node:** These systems act as KVM hypervisors and run the `nova-compute`
    and `openvswitch-agent` services


    Deployments which will be using only the cloud controller host group might use
    the following definitions:


    +   - **Cloud controller:** These systems provide the load balancing services
    in an Active/Passive configuration and the API services, MySQL database services,
    and RabbitMQ messaging services in an Active/Active configuration

    +   - **Compute node:** These systems act as KVM hypervisors and run the nova-compute
    and openvswitch-agent services


    After defining the host groups, the physical architecture diagram should be updated
    to reflect the mapping of host groups to physical machines in the deployment.
    This should also include considerations for network connectivity. The following
    is an example architecture diagram for inclusion in the design document:'
  merge: -1
  img_proc: true
- pgno: 72
  md: '![](img/2f752555f69992669defa8b25e6dcee9_72_0.png)


    # Implementing H/A in the lab deployment


    In this last section, we''ll make the current lab deployment that we deployed
    in Chapter 2, Architecting the Cloud, highly available by adding a second controller
    node and configuring cluster software. This example should be simple enough to
    easily implement in the lab while still allowing you to evaluate the technology.


    # Provisioning a second controller


    In later chapters we''ll look at more flexible deployment methodologies that allow
    fine-grained service placement and automated cluster configuration. In this chapter,
    we''ll just extend the Packstack deployment from Chapter 2, Architecting the Cloud.
    Packstack isn''t designed to deploy multiple controllers, so some manual configuration
    of services will be required.'
  merge: -1
  img_proc: true
- pgno: 73
  md: "To provision the second controller, install the operating system on a new machine\
    \ in the same way you provisioned the first controller and then copy the Packstack\
    \ answer file from the first controller. Edit the answer and replace CONFIG_CONTROLLER_HOST,\
    \ CONFIG_NETWORK_HOSTS, and CONFIG_STORAGE_HOST with the IP address of the new\
    \ controller.\n\nWe won't be reconfiguring the compute nodes or the existing controller,\
    \ so add the compute nodes and controller that you provisioned in Chapter 2, Architecting\
    \ the Cloud, to the EXCLUDE_SERVERS parameter in the answer file. We'll leave\
    \ the MySQL, Redis, MongoDB, and RabbitMQ services on the first controller, so\
    \ those values should not be modified.\n\nRun Packstack on the new controller\
    \ using the same command we used in Chapter 2, Architecting the Cloud:\n\n```\n\
    packstack --answer-file <answer-file>\n```\n\nAfter Packstack completes, you should\
    \ be able to log in to the dashboard by going to the IP address of the second\
    \ host and using the same credentials that you used in Chapter 2, Architecting\
    \ the Cloud.\n\n# Installing the Pacemaker resource manager\n\nNext, we'll install\
    \ Pacemaker to manage the VIPs that we'll use with HAProxy to make the web services\
    \ highly available. We assume that the cluster software is already available via\
    \ yum to the controller nodes.\n\n+   1. First, install Pacemaker on both nodes\
    \ using the following command:\n+   \n+      # yum install -y pcs fence-agents-all\n\
    +   \n+   2. Verify that the software installed correctly by running the following\
    \ command:\n+   \n+      # rpm -q pcs\n+      pcs-0.9.137-13.el7_1.3.x86_64\n\
    +   \n+   3. Next, add rules to the firewall to allow cluster traffic:\n+   \n\
    +      # firewall-cmd --permanent --add-service=high-availability"
  merge: -1
  img_proc: true
- pgno: 74
  md: '4. Set the password for the Pacemaker cluster on each node using the following
    command:


    ```

    # passwd hacluster

    ```


    5. Start the Pacemaker cluster manager on each node:


    ```

    # systemctl start pcsd.service

    # systemctl enable pcsd.service

    ```


    6. Then, authenticate the nodes using the following commands on the first node:


    ```

    # pcs cluster auth controller1 controller2

    Username: hacluster

    Password:

    controller1: Authorized

    controller2: Authorized

    ```


    7. Finally, run the following commands on the first node to create the cluster
    and start it:


    ```

    # pcs cluster setup --start --name openstack \

    > controller1 controller2

    Shutting down pacemaker/corosync services...

    Redirecting to /bin/systemctl stop pacemaker.service

    Redirecting to /bin/systemctl stop corosync.service

    Killing any remaining services...

    Removing all cluster configuration files...

    controller1: Succeeded

    controller2: Succeeded

    Starting cluster on nodes: controller1, controller2...

    controller1: Starting Cluster...

    controller2: Starting Cluster...

    ```


    8. For our example cluster, we will disable fencing using the following command:


    ```

    # pcs property set stonith-enabled=false

    ```'
  merge: -1
  img_proc: true
- pgno: 75
  md: '9. Verify that the cluster started successfully using the following command:


    ```

    # pcs status

    Cluster name: openstack

    Last updated: Mon Aug 31 01:51:47 2015

    Last change: Mon Aug 31 01:51:14 2015

    Stack: corosync

    Current DC: controller1 (1) - partition with quorum

    Version: 1.1.12-a14efad

    2 Nodes configured

    0 Resources configured

    Online: [ controller1 controller2 ]

    ```


    For more information on setting up Pacemaker, see the excellent Clusters from
    Scratch documentation at http://clusterlabs.org/doc/en-US/Pacemaker/1.1-pcs/html/Clusters_from_Scratch/index.html.


    # Installing and configuring HAProxy


    We''ll be using HAProxy to load-balance our control plane services in this lab
    deployment. Some deployments may also implement Keepalived and run HAProxy in
    an Active/Active configuration. For this deployment, we''ll run HAProxy Active/Passive
    and manage it as a resource along with our VIP in Pacemaker.


    To start, install HAProxy on both nodes using the following command:


    ```

    # yum -y install haproxy

    ```


    Verify installation with the following command:


    ```

    # rpm -q haproxy

    haproxy-1.5.4-4.el7_1.x86_64

    ```


    Next, we will create a configuration file for HAProxy which load-balances the
    API services installed on the two controllers. Use the following example as a
    template, replacing the IP addresses in the example with the IP addresses of the
    two controllers and the IP address of the VIP that you''ll be using to load-balance
    the API services.'
  merge: -1
  img_proc: true
- pgno: 76
  md: "![](img/2f752555f69992669defa8b25e6dcee9_76_0.png)\n\nSome deployments may\
    \ chose to create a VIP for each service. This allows multiple HAProxy nodes to\
    \ answer HTTP sessions for different services. In this example, we'll only use\
    \ a single VIP since HAProxy is in Active/Passive configuration.\n\nThe following\
    \ example `/etc/haproxy/haproxy.cfg`, will load-balance Horizon in our environment:\n\
    \n```\nglobal\n    daemon\n    group haproxy\n    maxconn 40000\n    pidfile /var/run/haproxy.pid\n\
    \    user haproxy\n\ndefaults\n    log 127.0.0.1 local2 warning\n    mode tcp\n\
    \    option tcplog\n    option redispatch\n    retries 3\n    timeout connect\
    \ 10s\n    timeout client 60s\n    timeout server 60s\n    timeout check 10s\n\
    \nlisten horizon\n    bind 192.168.0.30:80\n    mode http\n    cookie SERVERID\
    \ insert indirect nocache\n    option tcplog\n    timeout client 180s\n    server\
    \ controller1 192.168.0.10:80 cookie controller1 check inter 1s\n    server controller2\
    \ 192.168.0.11:80 cookie controller2 check inter 1s\n```\n\nIn this example, `controller1`\
    \ has an IP address of `192.168.0.10` and `controller2` has an IP address of `192.168.0.11`.\
    \ The VIP that we've chosen to use is `192.168.0.30`. Copy this file, replacing\
    \ the IP addresses with the addresses in your lab, to `/etc/haproxy/haproxy.cfg`\
    \ on each of the controllers.\n\nIn order for Horizon to respond to requests on\
    \ the VIP, we'll need to add the VIP as a ServerAlias in the Apache virtual host\
    \ configuration. This is found at `/etc/httpd/conf.d/15-horizon_vhost.conf` in\
    \ our lab installation. Look for the following line:\n\n```\nServerAlias 192.168.0.10\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 77
  md: 'Add an additional ServerAlias line with the VIP on both controllers:


    ```

    ServerAlias 192.168.0.30

    ```


    You''ll also need to tell Apache not to listen on the VIP so that HAProxy can
    bind to the address. To do this, modify /etc/httpd/conf/ports.conf and specify
    the IP address of the controller in addition to the port numbers. The following
    is an example:


    ```

    Listen 192.168.0.10:35357

    Listen 192.168.0.10:5000

    Listen 192.168.0.10:80

    ```


    In this example, 192.168.0.10 is the address of the first controller. Substitute
    the appropriate IP address for each machine.


    Restart Apache to pick up the new alias:


    ```

    # systemctl restart httpd.service

    ```


    Next, add the VIP and the HAProxy service to the Pacemaker cluster as resources.
    These commands should only be run on the first node:


    ```

    # pcs resource create VirtualIP IPaddr2 ip=192.168.0.30 cidr_netmask=24

    # pcs resource create HAProxy systemd:haproxy

    ```


    Co-locate the HAProxy service with the VirtualIP to ensure that the two run together:


    ```

    # pcs constraint colocation add VirtualIP with HAProxy score=INFINITY

    ```


    Verify that the resources have been started:


    ```

    # pcs status

    ...

    Full list of resources:

    VirtualIP(ocf::heartbeat:IPaddr2):Started controller1

    HAProxy(systemd:haproxy):Started controller1

    ...

    ```


    At this point, you should be able to access Horizon using the VIP you specified.
    Traffic will flow from your client to HAProxy on the VIP to Apache on one of the
    two nodes.'
  merge: -1
  img_proc: true
- pgno: 78
  md: "# Additional API service configuration\n\nNow that we have a working cluster\
    \ and HAProxy configuration, the final configuration step is to move each of the\
    \ OpenStack API endpoints behind the load balancer. There are three steps in this\
    \ process, which are as follows:\n\n+   1. Update the HAProxy configuration to\
    \ include the service.\n+   2. Move the endpoint in the Keystone service catalog\
    \ to the VIP.\n+   3. Reconfigure services to point to the VIP instead of the\
    \ IP of the first controller.\n\nIn the following example, we will move the Keystone\
    \ service behind the load balancer. This process can be followed for each of the\
    \ API services.\n\nFirst, add a section to the HAProxy configuration file for\
    \ the authorization and admin endpoints of Keystone:\n\n```\nlisten keystone-admin\n\
    \    bind 192.168.0.30:35357\n    mode tcp\n    option tcplog\n    server controller1\
    \ 192.168.0.10:35357 check inter 1s\n    server controller2 192.168.0.11:35357\
    \ check inter 1s\n\nlisten keystone-public\n    bind 192.168.0.30:5000\n    mode\
    \ tcp\n    option tcplog\n    server controller1 192.168.0.10:5000 check inter\
    \ 1s\n    server controller2 192.168.0.11:5000 check inter 1s\n```\n\nMake sure\
    \ to update the configuration on both of the controllers. Restart the haproxy\
    \ service on the active node:\n\n```\n# systemctl restart haproxy.service\n```\n\
    \nYou can determine the active node with the output from pcs status. Check to\
    \ make sure that HAProxy is now listening on ports 5000 and 35357 using the following\
    \ commands:\n\n```\n# curl http://192.168.0.30:5000\n# curl http://192.168.0.30:35357\n\
    ```\n\nBoth should output some JSON describing the status of the Keystone service."
  merge: -1
  img_proc: true
