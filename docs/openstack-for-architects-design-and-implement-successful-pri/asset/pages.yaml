- pgno: 91
  md: '# Installing a Puppet master


    The following instructions will set up a Puppet master on the CI server. If you
    already have a Puppet infrastructure that you can use in your lab, you can skip
    this section. For more information on setting up a Puppet master, refer to the
    Puppet Reference Manual (http://docs.puppetlabs.com/puppet/latest/reference/).
    Install the RDO repository, which provides access to both the Puppet and the OpenStack
    Puppet modules using the following steps:


    +   1. Execute the following command as root on the CI server:


    ```

    ```bash

    # yum install -y https://rdoproject.org/repos/rdo-release.rpm

    ```

    ```


    +   2. Verify that the repository has been enabled by running the following command:


    ```

    ```bash

    # yum repolist

    ```

    ```


    +   3. You should see the `openstack` repository in the output. Run the following
    command to install Puppet and the OpenStack Puppet modules:


    ```

    ```bash

    # yum install -y puppet puppet-server openstack-puppet-modules

    openstack-packstack

    ```

    ```


    +   4. Verify their installation with the following command:


    ```

    ```bash

    # rpm -q puppet puppet-server openstack-puppet-modules

    openstack-packstack

    ```

    ```


    +   5. Edit the puppet configuration to include the OpenStack Puppet modules:


    ```

    ```bash

    # puppet config set basemodulepath \

    ''$confdir/modules:/usr/share/puppet/modules:/usr/share/openstack\

    -puppet/modules'' --section main

    ```

    ```


    +   6. Verify the configuration by listing the available Puppet modules:


    ```

    ```bash

    # puppet module list

    ```

    ```


    You should see around 60 Puppet modules, depending on the version of OpenStack.
    Ignore any errors about dependencies.'
  merge: -1
  img_proc: true
