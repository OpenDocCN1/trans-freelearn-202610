- pgno: 45
  md: 'There are typically four types of networks in an OpenStack deployment. The
    first is a network which is used to access the OpenStack APIs from the Internet
    in the case of a public cloud, or the intranet in the case of a private cloud.
    In most deployments, only the load balancers have an address on this network.
    This allows for tight control and auditing of traffic coming in from the Internet.
    This network is often referred to as the **External** network. The second type
    of network is a private network which is used for communication between the OpenStack
    control plane and the compute infrastructure. The message bus and database are
    exposed on this network and traffic is typically not routed in or out of this
    network. This network is referred to as the **Management** network.


    Two more additional private networks are typically created to carry network and
    storage traffic between the compute, network, and storage nodes. These networks
    are broken out for quality of service as much as security and are optional, depending
    on whether or not the deployment is using SDN or network-attached storage. The
    segment dedicated to tenant networking is frequently referred to as the **Tenant**
    network or the **Underlay** network. Depending on the size of the deployment,
    there may be one or more of these underlay networks. The storage network is, not
    surprisingly, referred to as the **Storage** network.


    One last class of network is required for tenant workloads to access the Internet
    or intranet in most deployments. Commonly referred to as the **Provider** network,
    this is a physical network which is modeled in Neutron to provide network ports
    on a physical network. Floating IPs which can be dynamically assigned to instances
    are drawn from the Provider networks. In some deployments, instances will be allowed
    to use ports from Provider networks directly, without passing through the Tenant
    network and router. Organizations which would like to have the Neutron API available,
    but don''t want to implement SDN frequently use this pattern of modeling the physical
    infrastructure in Neutron with provider networks.


    This allows them to use traditional physical switches and routers but still provide
    dynamic virtual interfaces.


    Reference Architectures, Fuel 7.0 Reference, Mirantis https://docs.mirantis.com/fuel/fuel-7.0/reference-architecture.html'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# SDN


    SDN is one of the key capabilities that differentiates OpenStack from traditional
    virtualization deployments. SDN uses tunneling technology to create a virtual
    network topology on top of a physical network topology. The virtual (overlay)
    networks can be shared or tenant-specific. Tenants can define their own layer
    2 segments and routers, they can specify network-specific DNS and DHCP services,
    and some deployments allow for layer 4 services such as load balancing and firewalling
    to be defined as well. Neutron was created with a plugin-based architecture and
    plugins exist for software and hardware-based SDN products. A reference implementation
    built around Open vSwitch is also provided for testing and lab work.


    Selecting an SDN provider is a difficult task. In our experience, SDN vendors
    tend to obfuscate their technology with marketing terms and it takes a while to
    figure out exactly how each vendor is actually routing packets through the hypervisor
    out to the physical networks. Many of the early Neutron SDN plugins like Nicira’s
    were based on the Open vSwitch software which Nicira authored. The performance
    of these solutions was poor and a number of different approaches have since moved
    the processing of packets from the “user space” in the Linux operating system
    down into the “kernel space”. Work has also been done towards improving the performance
    of the reference Open vSwitch implementation by simplifying the path that packets
    take from the instance down through the switches. This project is called Open
    Virtual Network, or OVN.


    SDN vendors tend to differentiate themselves in three areas. The first is around
    the resiliency of their solution. Organizations evaluating SDN technologies should
    pay attention to how the layer 3 routers are made highly available in a given
    topology and how packet flows are impacted by component failure. The second is
    around the management interface of a given solution. Most of the SDN vendors will
    have an eye-catching and useful user interface to use to debug packet flows within
    the tenant networks. The third factor to consider is performance. In our experience,
    this is the deciding factor for most organizations. There are typically large
    differences in the performance of these solutions and attention should be focused
    on this during Proof of Concepts (POCs).'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Physical network design


    No discussion of OpenStack networking would be complete without the mention of
    the **spine-leaf** physical network architecture. Spine-leaf is an alternative
    to the traditional **multi-tier** network architecture which is made up of a set
    of core, aggregation, and access layers. Spine-leaf introduces a modification
    to the design of the aggregation layer in order to reduce the number of hops between
    servers which are attached to different access switches. The aggregation layer
    becomes a **spine**, in which every access switch (the **leaf**) can reach every
    other access switch through a single spine switch. This architecture is considered
    a prerequisite for horizontally scalable cloud workloads, which are focused more
    on traffic between instances (east-west traffic) than traffic between instances
    and the Internet (north-south traffic).


    The primary impact that spine-leaf network design has on OpenStack deployments
    is that layer 2 networks are typically terminated at the spine – meaning that
    subnets cannot stretch from leaf to leaf. This has a couple of implications. First,
    virtual IPs cannot migrate from leaf to leaf and thus the External network is
    constrained to a single leaf. If the leaf boundary is the top-of-rack switch,
    this places all of the load balancers for a given control plane within a single
    failure zone (the rack). Second, Provider networks need to be physically attached
    to each compute node within an OpenStack region if instances are going to be directly
    attached to them. This limitation can constrain an OpenStack region to the size
    of a leaf. Once again, if the leaf boundary is the top-of-rack switch, this makes
    for very small regions, which lead to an unusually high ratio of control to compute
    nodes.


    We''ve seen a couple of different approaches on how to implement spine-leaf within
    OpenStack installations given these limitations. The first is to simply stretch
    L2 networks across the leaves in a given deployment. The only networks which require
    stretching are the External API network and the Provider networks. If instances
    are not going to be directly attached to the Provider networks (that is, if floating
    IPs are used for external connectivity), then these networks only need to be stretched
    across a failure zone to ensure that the loss of a single rack doesn''t bring
    down the control plane. Deployments which chose to stretch L2 across racks typically
    group racks into **pods** of three or more racks which then become the leaf boundary.
    The second approach that we''ve seen used is to create tunnels within the spine
    which simulate stretched L2 subnets across the top of rack switches. Either way,
    collaboration between the network architecture team and the cloud architecture
    team should lead to a solution which is supportable by the organization.'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'Floating IPs are pools of IP addresses that are typically external facing and
    can be attached and detached to running instances at will to provide external
    access to the instance. These floating IP addresses are associated with a tenant
    router and are dynamically assigned.


    # Storage design


    As compute hardware has become less expensive over the last few years, fewer and
    fewer workloads are constrained by a lack of processor or memory performance.
    Instead, most workloads are tuned so that they are constrained on I/O-particularly
    storage I/O. OpenStack workloads typically separate the operating system storage
    from the application storage and Cinder and the different object storage projects
    provide mechanisms for presenting many different kinds of storage with a single
    interface. This capability allows tenants to choose the storage which matches
    their application''s requirements. In addition to Cinder providing persistence
    for applications, block storage and object storage also provide storage persistence
    for instances and allow for instance live migration, backup, and recovery.


    # Ephemeral storage


    Ephemeral storage is the storage that is consumed when a Glance image is copied
    locally to a compute node to instantiate a virtual instance. Glance images are
    typically sparse and tend to be less than one gigabyte in size. When instantiated,
    images provide the root disk for an instance''s operating system. These are also
    sparsely provisioned, but typically grow up to 10, 20, or 40 gigabytes in size.
    In traditional OpenStack deployments, ephemeral storage is provided by the compute
    node''s internal disks, and when a compute node fails or an instance is terminated,
    the storage is lost or reclaimed. These days, many organizations will chose to
    place ephemeral storage on shared storage though.


    There are two main reasons to use shared storage for ephemeral instance storage.
    The first reason is to make those ephemeral instances a little less ephemeral
    by providing for a live-migration capability for instances. With local-only ephemeral
    storage, any reboot of a compute node will terminate the instances it is currently
    hosting. If the instance is backed by shared storage (typically NFS or software-based
    storage such as Ceph), it can be migrated to another compute node which has access
    to the same storage without downtime. This allows for cloud operators to put compute
    nodes in a “maintenance mode” so that they can be patched. When the compute nodes
    are ready to host workloads again, the instances can be rebalanced across the
    nodes. Having a live copy of the instance is also useful in the case of a compute
    node failure. Instances backed by shared storage can be evacuated to healthy compute
    nodes without losing state.'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'The second reason that shared storage is attractive for ephemeral storage is
    that some storage backends allow for deduplication between Glance images and running
    instances. In a traditional instance life cycle, there isn''t a huge need for
    deduplication between the images and the instances. However, if there is a deduplication
    capability, it allows for operators to use instance snapshots as backups. Instances
    can be backed up on a regular basis without consuming an inordinate amount of
    shared storage. New features in the Kilo and Liberty releases of OpenStack allow
    for quiescing guest operating systems during snapshot operations to enable this
    kind of “live backup” capability.


    # Block storage


    Using shared storage for ephemeral storage is one way to achieve a persistence
    capability for virtual instances, but the more traditional way is to instantiate
    a Glance image on a Cinder volume. Instances which are backed by Cinder volumes
    can be live-migrated, live-snapshotted, and evacuated with their state intact.
    There are Cinder drivers for almost every major storage product on the market
    these days and it is common to configure multiple backends within a single OpenStack
    deployment. This allows the OpenStack tenant to chose an appropriate backend for
    their workload. For example, a database instance might have its operating system
    reside on relatively inexpensive ephemeral disk, but locate the data on highly
    performant SAN storage attached by fiber channel. If the instance fails, the root
    disk is discarded and a new instance attaches itself to the persistent Cinder
    volume. Cinder volumes are also attractive as root disks for instances which are
    being migrated from traditional virtualization platforms. The user experience
    for Cinder-backed instances is very similar to these platforms.


    Selection of storage backends for Cinder implementations is a relatively straightforward
    process. Cloud Architects will want to leverage the relationships and knowledge
    that an organization''s Storage Architects already have. Storage devices are relatively
    expensive and POCs should be run on existing hardware devices where possible.
    Cinder drivers for commonplace devices such as NetApp filers and EMC SANs have
    some interesting features which can be proven out in a lab. Vendors of more exotic
    hardware devices are typically willing to lend hardware for POCs as well.


    Most of the organizations that we''ve worked with have tested software-based storage
    as a part of their OpenStack implementations and many have gone on to adopt software-based
    storage for at least one of their storage tiers. Ceph, in particular, has a tight
    integration with OpenStack for image, ephemeral, and block storage. Ceph has the
    advantage of providing deduplication when used in this configuration. This, combined
    with its usage of commodity hardware, makes it an extremely attractive option
    from a cost perspective.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# Object storage


    Swift was one of the first two services in OpenStack and object storage was the
    original mechanism for persistence within OpenStack (and Amazon) clouds. As OpenStack
    has been adopted for more and more traditional workloads, object storage has lost
    a lot of its relevance. In fact, many of the OpenStack deployments that we work
    on in the Enterprise space don''t include object storage in the initial release.


    An easy way to take an “if you build it they will come” approach to object storage
    is to leverage it for storing Glance images. While few of your tenants may come
    to your OpenStack deployment with applications that can persist their data over
    an S3-compatible interface, almost all of them can use the snapshot capability
    in Nova to improve their experience on the platform. Storing Glance images in
    Swift makes them highly available and provides an opportunity to co-locate them
    with the compute infrastructure, dramatically improving network performance.


    Object storage backend selection is highly dependent on block and ephemeral storage
    selection. If you are using Ceph for block storage, using Ceph for object storage
    greatly simplifies administration of the platform. NetApp provides an integration
    with Swift, and it may be advantageous to choose it instead if using NetApp for
    block storage. Swift is also the default object storage provider in OpenStack
    and it makes sense to use it in heterogeneous environments from that perspective.
    In our experience, object storage backends are not subjected to the same kind
    of scrutiny as block storage backends in the storage selection process. This may
    be because many object storage systems are less about performance and more about
    low-cost options to store frequently read data versus a lot of heavy I/O.


    # Expanding the initial deployment


    To properly evaluate the different compute, network, and storage options we''ve
    discussed in this chapter, an expanded OpenStack deployment with dedicated roles
    for different physical systems is required. Separating the compute functions from
    the control functions allows us to properly test different types of compute hardware.
    Separating storage functions from compute and control functions allows us to properly
    test different disk, NAS, or SAN configurations. In this section, we''ll split
    out the roles we deployed in Chapter 1, Introducing OpenStack, to three physical
    systems. Each of these systems will be assigned a role, called a host group.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# Updating the design document


    Our first task is to update the design document from Chapter 1, *Introducing OpenStack*,
    with a set of definitions of our host groups. These definitions should be included
    at the start of the *Physical architecture* section of the document. We''ll use
    the following host groups in this expanded **proof of concept (POC)**.


    # Cloud controller


    The cloud controller system provides the API services, scheduling services, and
    Horizon dashboard services for the OpenStack deployment.


    # Compute node


    The compute node systems act as KVM hypervisors and run the `nova-compute` and
    `openvswitch-agent` services.


    The *Physical architecture* section of the design document should also contain
    a section on the physical network architecture of the deployment. In this section,
    each of the segmented networks should be defined. Connectivity for each physical
    host to each network should also be defined.


    The Packstack installation tool doesn''t allow for the specification of an external
    network for API traffic. As such, we''ll use three physical networks in this deployment,
    a management network which is routable to the intranet, a provider network which
    provides floating IPs for the instances, and a tenant network for instance traffic.
    The following network definitions should be added to the *Physical architecture*
    section.


    # Management network


    The management network is used for the private communication between all nodes
    in the OpenStack deployment. This network is also used to carry tenant and storage
    traffic in this deployment.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# Provider network


    The provider network is used to provide public ports for tenant instances in this
    deployment. The cloud controller node has a port on this network segment.


    # Tenant network


    The tenant network carries the tenant network traffic in the deployment. It acts
    as an underlay network for the SDN tunnels. Compute nodes and controller nodes
    have ports on this network segment.


    A network diagram should also be added to the *Physical architecture* section.
    The following diagram describes the deployment in this chapter:


    ![](img/2f752555f69992669defa8b25e6dcee9_52_0.png)


    # Updating the deployment plan


    The deployment plan for our lab environment needs to be updated to reflect the
    additional hardware and network configuration. The hardware table should be updated
    first to include the assignment of role to each piece of hardware. For example,
    consider the following table:


