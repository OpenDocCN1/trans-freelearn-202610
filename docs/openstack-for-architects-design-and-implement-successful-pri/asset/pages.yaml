  md: "# Integrating the Platform\n\nAs with any of the request responses in this\
    \ example, the HTTP status code indicates the success or failure of the request.\
    \ The successful status code for the delete request is 204 and the successful\
    \ status code for an action is typically 202. More information on expected status\
    \ codes, request parameters, and response parameters is available in the Compute\
    \ API documentation at `http://developer.openstack.org/api-ref-compute-v2.1.html`.\n\
    \n# Provisioning with templates\n\nThe end users of the service catalogs that\
    \ drive the provisioning workflows for software-defined infrastructures tend to\
    \ be application developers. Allowing developers to provision networks, volumes,\
    \ and instances via APIs is extremely useful for automated continuous integration\
    \ builds and deployments. Though there are a number of advantages to this approach,\
    \ many organizations would prefer to let their developers provision environments\
    \ made up of these elements instead. First off, the number of options exposed\
    \ either in the API or in the Horizon dashboard is pretty impressive. A typical\
    \ deployment will have at least two or three flavors, four or five images, private\
    \ and public networks, arbitrary volume sizes, and so on. Choosing from all of\
    \ these options to just launch an instance is time-consuming. It can also put\
    \ a burden on the team that has to support them. Once software-defined networking\
    \ is introduced, the end user may be expected to understand networking, routing,\
    \ and load balancing in order to provision a working system. This is really unrealistic\
    \ in most enterprise environments.\n\nThe solution to managing the complexity\
    \ of software-defined infrastructure is to compose a service catalog of templates.\
    \ These templates can be made up of single instances or multiple instances, rich\
    \ or simple network topologies, and highly customized or standard images.\n\n\
    The orchestration API is much simpler to program to as well. Let’s walk through\
    \ an example:\n\n+   1. We begin the same way as the previous example, by requesting\
    \ a token from Keystone:\n\n```\nimport requests #http://docs.python-requests.org/en/latest\n\
    import json\n\nKEYSTONE_URL = 'http://controller01:5000/v2.0/'\nTENANT       =\
    \ 'demo'\nUSERNAME     = 'demo'\nPASSWORD     = 'secret'\n\nr = requests.post(\"\
    %s/tokens\" % (KEYSTONE_URL,), json={\n    \"auth\": {\n        \"tenantName\"\
    : TENANT,\n```"
