- pgno: 121
  md: '# Active monitoring


    There are quite a few activities to monitor in OpenStack. In general, there are
    three major areas to monitor:


    +   - OpenStack services (required for orchestration and provisioning)

    +   - Processes (the actual running processes of OpenStack components)

    +   - HA control cluster (the components providing HA capability to the cloud)


    # Services


    Checking services is all about availability. If a service is down, cloud users
    will be faced with errors that prevent them from using the APIs and, furthermore,
    interacting with the cloud. These service checks should be performed regularly
    using simulated transactions generated from the monitoring platform. We call these
    simulated because they do not require all the specific customizations of the image
    and post deployment configuration that may be needed for real workloads. While
    using real workloads is possible, it is less desirable due to the additional overhead
    needed to run actual transactions on a regular basis in addition to the real deployment
    load. Synthetic transactions should be launched from a dedicated user in their
    own project with strict quotas. This way the transactions can be tracked using
    tenant and user IDs that are separate from real traffic.


    These checks should be launched against the VIP addresses for endpoints (if configured
    in an HA configuration) and only report two possible options: completed or failed.
    This way, the tests can be contained to simple operations. Complex simulations
    will involve other endpoints and may provide false positives. For example, if
    the Nova API endpoint were to be tested, a good test would be to check the flavors
    associated with the monitoring tenant. An example call to the API to the Nova
    project would be as follows:


    ```

    GET /v2.1/{tenant_id}/flavors

    ```


    Additional API specifications can be found at http://developer.openstack.org/.'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'In order to make this API call via a monitoring platform such as Nagios, the
    platform could be configured to use the nova CLI client for the Nova project from
    a plugin script, or a set of plugin scripts, which would call the API via Python
    or another scripted language. These plugin scripts, many of which are available
    for free at http://www.nagios.com, can be leveraged to check the API endpoint
    status using simulated actions. For example, some OpenStack infrastructure plugins
    have been contributed to the Nagios directory such as the one called check_nova_api
    from Rakesh Patnaik at https://github.com/rakesh-patnaik/nagios-openstack-monitoring,
    which checks the API service for Nova using Python and a direct call to the Nova
    API endpoint. The nagios-openstack-monitoring plugins not only have the capabilities
    to monitor the API endpoints but the plugin also contains scripts to check the
    processes.


    # Processes


    Many individual processes support the operation of OpenStack. Many of these processes
    run on the controller nodes and need to be running in order to provide API availability
    (the nova-api process) as well as processes that coordinate functionality to other
    parts of the control stack (mariaDB and RabbitMQ). These processes can be checked
    locally, through remote SSH agents driven by shell scripts, or through automation
    enabled by software such as Ansible, Chef, and Puppet. Additionally, as aforementioned,
    there are plugins for monitoring platforms, such as Nagios, ZenOs, and Zabbix,
    that also include these process checks.


    # HA control cluster


    Many different distributions use HAProxy to enable active/active availability
    across multiple OpenStack control servers (a minimum of three). This HAProxy service
    acts as a reverse-proxy and simple load balancer configured to listen to VIP addresses
    in front of the OpenStack endpoint addresses. It is common practice to have HAProxy
    running on each one of the controller nodes in an HA cluster. Since the HAProxy
    service is tied to the VIP addresses configured for the OpenStack API services,
    if these services fail under HAProxy, then HAProxy itself will fail over to another
    controller node for the service. However, HAProxy does not monitor or fail over
    the processes nor does it move the VIP addresses to other cluster members. Therefore,
    an additional tool such as pacemaker or keepalived should be used to satisfy this
    requirement.'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'The following figure shows a logical diagram of one way to configure HA controllers:


    ![](img/2f752555f69992669defa8b25e6dcee9_123_0.png)


    Mirantis OpenStack controller HA architecture – Mirantis


    More information on this topic can be found at http://docs.openstack.org/ha-guide/controller-ha-haproxy.html.
    Alternatively, there is also the ability to use other external software or hardware
    load balancers instead of HAProxy.'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'Given this architecture for HA, and the monitoring of processes on each of
    the HA control nodes, it is possible that in a three-node cluster, two of the
    three controllers'' processes for a single project can be completely down and
    OpenStack still be completely functional. This is why, as in service monitoring,
    process states and overall health alerts must be customized very carefully. Simply
    because one controller''s individual process (for example, nova-api) fails and
    the HA infrastructure is still operational, does not mean that the monitoring
    solution should display a critical alert that the OpenStack cloud has failed.


    # Capacity planning


    As one of the four major ITIL processes that fall under financial management for
    IT, capacity planning is clearly an important part of any cloud strategy. However,
    not all cloud strategies are the same. It is very important to differentiate workloads
    in enterprise virtualization and in an OpenStack elastic cloud. With virtualization,
    each workload, and in many cases each server, is important. If an individual virtualization
    server becomes overused or is somehow degraded, that particular server is investigated,
    scaled, and/or repaired. One common analogy is to compare virtualized VMs and
    servers to "pets". In the pure OpenStack cloud world, there is no such construct
    for these individual instances (pets) except when virtualized workloads are moved
    into the elastic cloud and thus bring IT-as-a-service workloads into a true cloud.
    OpenStack was constructed around the premise that workloads are ephemeral, failure
    is expected, and growth should be scaled horizontally, not vertically. If a workload
    fails, another will simply be started in its place. "Livestock" has been the analogy
    used to explain this idea of ephemeral instances and workloads. In this analogy,
    livestock are simply a resource; if they die, or are irreparably injured, they
    are simply destroyed and replaced. In OpenStack, this idea even extends to the
    underlying hardware. In many companies, compute servers are simply white label
    hardware compute server resources that are to be used on-demand. If they fail,
    other, online and equally ubiquitous resources take their place (either in a scripted
    disaster recovery fashion or by having adequate excess capacity). Furthermore,
    if the compute servers become slow due to high loads, more ubiquitous resources
    (compute servers) are added to increase capacity. This is an important concept
    to grasp when speaking about elastic capacity. Under this definition of compute
    servers as generically uniform, disposable, and scalable resources, when the available
    capacity changes, growth is not linear but based on demand. However, demand can
    change with development cycles, development methodologies, time of the year, and
    production cycles.'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'This variability of demand is typically linear and possibly exponential based
    on cloud adoption. However, proper methodologies are required when constructing
    an OpenStack environment to help develop the most accurate capacity planning and
    provide a foundation to create strategic and tactical decisions later. This differs
    quite a bit from virtualization capacity planning, which tends to be more linear
    since the workloads are more persistent and are not recycled very frequently.


    # Planning your city


    Very similar to civil planning and architecture, the OpenStack cloud is a city
    of tenants that require resources to exist. However, with limited resources, tenants
    cannot be left to self-manage; the risk of resource exhaustion is too great. This
    would be analogous to the residents of an apartment building having unlimited
    power, water, gas, cable, and space without metering or charging for anything.
    Many residents would probably operate under the assumption that the resources
    were unlimited and they could oversize and oversubscribe to everything without
    consequence. Therefore, it is up to operations, both in civil engineering and
    OpenStack clouds, to do capacity management and risk mitigation for the end user.
    This means finding a way to track, analyze, and gather payment (or at least show
    costs) from end users or their tenant cost center. This includes creating packages
    of structured resources that are predetermined, which users can select from as
    well as creating and maintaining a quota system.


    Capacity risk mitigation and planning are done by performing three distinct actions:


    +   - Track usage

    +   - Analyze growth

    +   - Chargeback/showback


    # Tracking usage and analyzing growth


    In order to track usage of any resource, we first need to standardize the units
    we plan to count. In cloud computing, extreme granularity is possible using the
    data that exists in OpenStack databases, as well as using the metering project
    Ceilometer. While there are many different meters that can be tracked, let''s
    start by tracking the number of individual vCPUs used over time, amounts of memory
    over time, and disk usage down to the minute. However, letting users put together
    their own combinations of these three data points can result in tens of thousands
    of combinations. Therefore, in the OpenStack cloud, we use flavors to limit user
    choices. Flavors are virtual hardware templates that are logical groupings of
    compute, storage, and even network elements.'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'This simplifies the chargeback/showback equation by logically grouping resources
    into manageable offerings. In our examples, we will only be considering vCPU and
    memory; however, the same principles can be applied to persistent and ephemeral
    storage as well as network resource allocation.


    Continuing with our analogy of civil engineering, we can think of a flavor as
    an extended family looking to occupy an apartment building with a set of space
    requirements. In this example, one constraint we will have is that the 65,536
    sq/ft building can only have a maximum of 16 rooms and by code, can only hold
    64 people. However, since this is a new apartment building, the room sizes have
    not been determined and the property manager will build the rooms to match the
    family''s requirements. The property manager decides to let the first three applicants
    pick sizes for their rooms and he will bill them for whatever specifications the
    families need.


    Let''s start with each family''s requests, each with exact and unique requirements:


    +   - 3-person family requiring 1,024 square feet

    +   - 7-person family requiring 8,096 square feet

    +   - 29-person family requiring 30,720 square feet


    Below we can see what a sample 65,536 sq/ft house would look like using these
    unique and arbitrary room sizes:


    ![](img/2f752555f69992669defa8b25e6dcee9_126_0.png)'
  merge: -1
