    # Backups and recovery


    Typically, backups and recovery aren’t the first things traditional OpenStack
    operators think of. This is usually because of the ephemeral workloads traditionally
    run on OpenStack clouds, which really didn’t persist long enough to be backed
    up. However, as OpenStack adoption has grown exponentially, we are seeing more
    and more production OpenStack deployments that include persistent workloads, especially
    in IT-as-a-service clouds. As a result, a need has arisen to back up critical
    infrastructure data as well as persistent workloads running on the cloud.


    # Infrastructure backup architecture


    While workloads running on an OpenStack cloud are the stars of the show, the infrastructure
    is the real hero. Keeping the APIs available and running 100% without interruption
    should be the end goal of any operator when it comes to availability. However,
    it’s simply not reality. Even with proper life-cycle management and change procedures,
    data corruption can happen. Since the heart of OpenStack is a structured database
    running on mariaDB, it only makes sense to run it in a highly available configuration.
    However, what happens if, during operation, errors are made and are replicated
    across all HA nodes? Failure. Now, without backup and recovery, not only are the
    APIs offline, workloads could still be online, but all the data about every instance
    and the network configuration for those instances are lost. This is a true disaster
    for any OpenStack cloud.


    # Backup strategies – what to backup


    There is some critical data that must be backed up regularly in order to ensure
    proper recovery of OpenStack cloud. The frequency of these backups should align
    with your recovery time objective (the time to cloud restoration after a disaster
    in order to avoid unacceptable consequences to business continuity). There may
    also be recovery point objectives and SLAs within your organization that you may
    have to adhere to. While these are more common to disaster recovery regarding
    persistent workloads and not the infrastructure, there are always exceptions.'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'Critical items you should back up to be able to recover from a full or partial
    disaster are listed in the following table:


    | Data item | Project | Location | Instructions |

    |---|---|---|---|

    | MySQL DB | Openstack DB | Controller | Use `mysqldump` to export the contents
    of the database.

    Copy the data to a backup server. |

    | Nova | Compute | Compute controller | Make copies of `/etc/nova` and copy to
    the backup server.

    Make copies of `/var/lib/nova` except `/var/lib/nova/instances` on compute nodes.
    Instance backups will be discussed later. |

    | Glance | Image Repo | Controller | Copy the `/etc/glance` and `/var/lib/glance`
    directories.

    Or rsync `/var/lib/glance/images` to another backup server. |

    | Keystone | Identity | Controller | Back up `/etc/keystone`.

    Back up `/var/lib/keystone` if there is any data in it. |

    | Cinder | Block Storage | Controller | Back up `/etc/cinder`.

    Back up `/var/lib/cinder`. |

    | Swift | Object Storage | Controller | Back up `/etc/swift`; it contains the
    configuration files as well as the ring and ring builder files. Without these,
    your data is completely inaccessible. Copy these to every storage node before
    backing them up. |


    Once all of these files have been backed up and moved to a secure on-site or off-site
    disaster recovery server, in order to restore your OpenStack cloud you will basically
    need to stop all services on the existing cloud, copy all of the files back into
    place, recover the database from the export, and restart the cloud.'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'While this looks simple, it takes time. If this plan looks like it won''t meet
    your RTO needs, there are ways to make OpenStack highly available and create an
    architecture that is both multicloud and multiregion while having the ability
    to fail over and recover to a completely different site during a disaster. These
    solutions involve replication of Cinder storage across WAN links, a custom migration
    middleware solution, and a network plan to bring up the disaster recovery cloud
    online with all of the access and configurations it needs to satisfy business
    requirements. This solution can be extended by replicating database metadata and
    having a global object store for Glance images; however, as one can imagine, this
    is quite a feat of architecture and engineering and beyond the scope of this book.


    # Workload backup architecture


    As mentioned previously, workloads are the reason that a cloud even exists. In
    a perfect world, all applications would be cloud-native, fully distributed, and
    12 factor apps. They wouldn''t require backups because they would be regionally
    or globally distributed across multiple clouds and horizontally scaled to autoscale
    in the case of a disaster in one location. However, that is simply not the reality
    for many organizations. Many organizations have the need to run persistent workloads
    and traditional applications in production clouds. However, the legacy methods
    of backing up these applications, especially in bare metal environments, are drastically
    different. With most resources being virtualized and tenant networks isolated,
    traditional backup and restore architectures simply do not apply in OpenStack.
    Therefore, not only do organizations need a disaster recovery backup solution
    for workloads, but they also need operational backup solutions sometimes known
    as Backup-as-a-Service (BaaS).


    # Planning for disaster recovery


    Since workloads that require back up on OpenStack consist mainly of persistent
    instances; we must backup all parts of the instance, not only the disk image(s)
    that hold all of the runtime and persistent data but also the metadata that is
    required to make that workload instance(s) able to be restored from backup. However,
    OpenStack lacks the ability to provide a policy-based, automated, comprehensive
    backup and recovery solution. While OpenStack provides a patchwork of tools and
    APIs to provide some sort of backup effort, even tools such as OpenStack''s Cinder
    API, which provides support for taking full and incremental volume snapshots are
    still disruptive and the workload has to be taken offline to take a snapshot or
    risk data corruption.'
  merge: -1
  img_proc: true
- pgno: 136
  md: '# Building to Operate


    To illustrate this, we can look at the typical steps to do a simple backup on
    a basic workload:


    +   1. Pause instances.

    +   2. Detach Cinder volumes (root volume and any additional nonroot volumes).

    +   3. Take an instance snapshot for each instance and store it in Glance for
    later retrieval.

    +   4. Use Cinder to backup all the aforementioned volumes and place them in Object
    Storage (Swift/Ceph).

    +   5. Document these copies since OpenStack does not track them for you.

    +   6. Resume instances.


    These steps are very command-intensive, take time, require custom scripts, and
    since there is a manual documentation step could be error-prone. These steps may
    also not adhere to existing internal backup policies of the organization.


    This manual type of backup operation is antiquated and feature-limited. Any enterprise-level
    backup solution should be non-impacting, able to do incremental backups and be
    customized for each workload, and able to span multiple instances when workloads
    are also spread across instances. Additionally, tenants should be able to easily
    back up their own workloads and test them before committing them to storage and
    have the ability to restore and replay backups when they desire. Workload backup
    software should also be able to provide a disaster recovery component so that
    in the event of a catastrophe, backed-up and replicated resources are available
    at different geographic locations in case any single location is compromised.


    There are few open source and commercial options when considering workload backup
    solutions that use native snapshots from OpenStack. One open source option is
    called Raksha (https://wiki.openstack.org/wiki/Raksha), the OpenStack project
    version of what became TrilioVault (http://www.triliodata.com/about/), a commercial
    data protection, backup, and disaster recovery specifically designed for OpenStack.
    Trilio Data has taken the previously mentioned workload backup snapshot procedure
    and designed a flexible and scalable solution. Using TrilioVault, both full and
    incremental backups of snapshots can be stored on a wide range of storage including
    NFS, Swift, and other third-party arrays. Recovery is also GUI-driven and simplifies
    what would otherwise be driven by sets of homegrown scripts to launch backup and
    recovery actions. TrilioVault also provides additional features for data retention,
    protection, and data integrity.'
  merge: -1
  img_proc: true
- pgno: 137
