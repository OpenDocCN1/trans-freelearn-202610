    # Summary


    In this chapter, we discussed topics that are critical to the operation of an
    OpenStack cloud. We covered tactical ways to monitor, plan, and backup your cloud;
    this is simply the beginning. There are many great resources online that can assist
    you in the operation of an OpenStack cloud; however, I suggest that readers start
    with the actual OpenStack operations and architecture guides. These are located
    at http://docs.openstack.org/ops/ and http://docs.openstack.org/arch/, respectively.
    These guides will provide all the required foundational information to help make
    operations in any cloud journey a success.


    In the next chapter, you will be learning about integrating existing business
    and operational processes such as identity management integration and unit testing
    using Jenkins.


