    # Creating the composition layer


    Now that our infrastructure software is in place, we''ll begin creating our composition
    layer. As we mentioned earlier, we''ll be starting with the “known good” configuration
    we got from running the `packstack` command in Chapter 2, *Architecting the Cloud.*'
