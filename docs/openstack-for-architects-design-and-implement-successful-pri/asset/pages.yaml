- pgno: 140
  md: '# 6


    # Integrating the Platform


    One of the OpenStack architects we''ve worked with is fond of saying, “No OpenStack
    implementation is an island”. Each deployment integrates with the legacy IT infrastructure
    around it, from identity management systems to auditing systems to billing systems.
    OpenStack''s standardized APIs make these integrations relatively simple. This
    chapter will cover the integration points available within an OpenStack implementation
    and many of the common integration patterns.


    In this chapter, we''ll look at the following points in detail:


    +   - **Identity management(IdM)** integration

    +   - Provisioning workflows

    +   - Metering and billing


    These three different platform integrations demonstrate the three prominent integration
    patterns for OpenStack. Integrating Keystone with an IdM system such as Active
    Directory is relatively prescriptive – as Cinder is designed to integrate with
    storage arrays, Keystone is designed to integrate with IdM systems. The contract
    between Keystone and the IdM system is largely hidden in the code of the project.


    The other two integration patterns demonstrate two different ways to interact
    externally with the OpenStack system. External provisioning workflows drive the
    OpenStack system through its REST API. They either interact directly with the
    Neutron, Cinder, Nova, and Glance APIs or they leverage the Heat orchestration
    API to create, modify, and delete objects within the OpenStack deployment. In
    contrast, metering, billing, and auditing systems interact with the output of
    the system by either listening in on the OpenStack message bus for events to occur
    or by consuming events from the Event API.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# IdM integration


    In a 2014 blog post, OpenStack developer *Nathan Kinder* famously (and convincingly)
    argued that **Keystone is not an authentication service**. In this post, Kinder
    describes the deployment pattern of placing the `Keystone` service behind an Apache
    HTTP server, which uses native modules to perform authentication. Kinder makes
    two arguments in his post:


    +   - Most people use some kind of external authentication system with OpenStack

    +   - The reference authentication system (the SQL plugin) doesn''t have any of
    the features that we''d expect from an authentication service


    Both of these arguments have been proven in our experience; the first integration
    that most of the organizations we work with tackle is that of the IdM service.


    # Authentication and authorization in OpenStack


    Having an understanding of how authentication and authorization work within OpenStack
    is helpful. Each call to an OpenStack API service is authorized by a bearer token,
    which is retrieved from and verified by the `Keystone` service. The following
    figure summarizes this interaction:


    ![](img/2f752555f69992669defa8b25e6dcee9_141_0.png)'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'When requesting the token from Keystone, the client sends along the requested
    scope of the token: the tenant, project, or domain. Assuming that the credentials
    authorize the client, the token that Keystone returns is specific to the scope
    requested. Once the client has obtained the token, each API request to the other
    OpenStack services contains the token in an HTTP header. The other services use
    that token to authorize the requests from the client.


    There are two versions of the Keystone API in wide use in OpenStack at present:
    versions 2 and 3. In version 2 of the API, users are authorized to specific projects
    or **tenants**. A user may have privileges in more than one tenant and the privileges
    may vary by tenant. For example, the user **msolberg** may have administrative
    privileges in the **msolberg** tenant, but only user privileges in the **architect**
    tenant. Version 3 of the API introduces the concept of authorization domains,
    which provide a hierarchy above basic tenancy. Version 3 of the Keystone API has
    been around for a few releases, but it has taken some time for each of the services
    to support the new authorization model. As such, most OpenStack deployments still
    use the Keystone v2 API.


    Keystone uses a combination of backend drivers when deciding whether or not to
    issue a token when presented with a set of credentials. The first backend driver
    is the identity driver. The identity driver can either be SQL (the reference implementation)
    or **Lightweight Directory Access Protocol (LDAP)**. If the driver is set to LDAP,
    an external directory service can be used to authenticate users. The second driver
    is the **assignment** driver. This driver allows users to authenticate using LDAP
    and assign roles using the SQL database. This configuration is the most commonly
    used integration pattern for Active Directory.


    # Configuring Keystone with split assignment and identity


    Before configuring Keystone to use Active Directory (or other LDAP services) for
    authentication, a few changes will need to be made on the Active Directory side.
    First, decide on mapping objects in Active Directory to the accounts in OpenStack.
    For example, you may want any user who has an account in the directory to have
    access to a tenant in OpenStack, or you may want to restrict usage to a particular
    group of users. If you intend to restrict users, you will need to create a group
    or attribute to filter them. Second, a user who has the ability to do a look up
    on other users needs to be created. Perform a test that validates that the user
    has the ability to read the appropriate subtree of account objects using a utility
    such as `ldapsearch`. For more information on the prerequisites for the Active
    Directory side, refer to `https://wiki.openstack.org/wiki/HowtoIntegrateKeystonewithAD`.'
  merge: -1
  img_proc: true
- pgno: 143
