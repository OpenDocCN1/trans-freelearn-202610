- pgno: 194
  md: '# 8


    # Conclusion


    In the year and a half since we started writing this book, OpenStack has changed
    enough that we''ve had to rewrite most of the code examples at least once. Our
    hope is that the approach we''ve outlined in the previous chapters will help Cloud
    Architects develop and deploy private clouds using OpenStack in spite of the rapid
    rate of change in the software ecosystem. In this last chapter, we''ll talk about
    some of the emerging trends in OpenStack and how to build a road map for your
    organization for its adoption of Infrastructure as a Service.


    # ## Emerging trends in OpenStack


    One of the most interesting things about the way that OpenStack has evolved over
    its short history is the vast number of projects that have sprung up around the
    core set of compute, network, and storage services. As of the Newton release of
    OpenStack, there were almost sixty projects in the “Big Tent”. These projects
    can be broadly lumped into two categories — those which provide additional infrastructure
    components and those which manage the installation, configuration, and life cycle
    of OpenStack itself. This first set of projects are typically patterned after
    analogues in Amazon Web Services and provide a fuller “stack” of services to be
    used in application deployments. The second set of projects contain configuration
    management code such as the Puppet modules we used in earlier chapters to deploy
    OpenStack and common services and libraries that are used by the other services.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# Moving up the stack


    Some of the projects that automate additional infrastructure components have become
    adopted widely enough to be included with commercial vendors'' OpenStack distributions.
    These include projects such as Trove, which provides Database as a Service, and
    Sahara, which provides Data Processing as a Service. These projects leverage the
    Nova compute service to deploy instances of prepared Glance images that provide
    end users with higher-level resources such as databases over the OpenStack APIs.
    These resources can then be automated like any other OpenStack resource either
    via the API or via the Heat orchestration service.


    Trove is one of the more mature OpenStack services outside of the core set of
    original services. Trove allows developers to provision an instance of a given
    database to support their application without having to design or specify the
    underlying compute and storage for the database instance. Trove is largely developed
    by the company Tesora, who offers a certified and supported version of the Trove
    component for most of the major community and enterprise distributions of OpenStack.
    At present, Trove supports provisioning a range of relational databases such as
    MySQL and Oracle in addition to NoSQL databases such as MongoDB and Redis.


    Sahara provides Big Data as a Service in OpenStack, largely through the automated
    deployment of Hadoop clusters. Sahara allows users to create a data processing
    cluster, define job templates, and then execute those jobs on the cluster. Sahara
    has a large number of integration points to external services, such as Designate
    for name resolution and Barbican for certificate management. Jobs can pull data
    either from external or internal HDFS volumes or from Swift or Manila in OpenStack.
    Sahara currently supports Apache Hadoop, the Hortonworks Data Platform, Apache
    Spark, MapR, and Cloudera Hadoop as cluster types. Both traditional Hadoop and
    Spark jobs are supported in the service.


    Designate and Barbican are examples of services that provide extended infrastructure
    automation capabilities to round out application stacks, but do not provision
    instances. Another popular project in this category is Zaqar, which provides Messaging
    as a Service. Services like these can be extremely attractive to both developers
    and operators in private cloud environments. Developers no longer have to worry
    about the details behind the infrastructure components in their application architecture
    and operators can rest assured that developers are using these components in standardized
    ways that are easy to troubleshoot and scale.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# The impact of containers


    Linux containers have taken the technology world by storm in the last few years
    and they have impacted OpenStack in two different areas. First of all, OpenStack
    is now seen as one of the most flexible infrastructures for the deployment of
    container-based Platform as a Service technologies such as Kubernetes and Cloud
    Foundry. Secondly, OpenStack is now increasingly deployed as a set of containerized
    services. Additional Big Tent projects have sprung up around both of these use
    cases for containers in OpenStack.


    Magnum is a popular project that automates the provisioning of container orchestration
    environments. Magnum uses the Nova compute service to provision these environments
    inside of OpenStack tenants in the same way that Trove and Sahara do. As of the
    Newton release of OpenStack, Magnum supports Docker Swarm, Kubernetes, and Apache
    Mesos clusters, abstracted as “bays” for containers. Another popular project focused
    on containers is Kuryr, which allows users to bridge Neutron networks from the
    infrastructure layer into the application layer.


    Perhaps the largest emerging change in the management and deployment of OpenStack
    is the use of containers to deploy OpenStack services. This work was pioneered
    in the Kolla project, which uses Ansible and Docker to deploy and manage OpenStack
    services. It has since spread to other projects – the Fuel installer is currently
    moving to a Docker-based deployment strategy and the OpenStack-Ansible project
    (OSA) uses LXC containers to deploy OpenStack services. As these efforts gain
    consensus, organizations should evaluate whether or not a container-based deployment
    methodology works well for them.


    # Building the roadmap


    It’s an exciting time to be involved in such a rapidly changing project. That
    excitement should be leveraged by a Cloud Architect who is looking to gain adoption
    from application development teams. One way to build interest in the developer
    community is to continually expand the amount of services that are available to
    them in the private cloud. As we mentioned earlier, adding capabilities from services
    such as Trove or Designate to the cloud simplifies the work that both developers
    and operators do. Including developer teams as early-adopters of new features
    is a great way to build rapport and confidence with them as well.'
  merge: -1
  img_proc: true
- pgno: 197
  md: '# Introducing new features


    A prerequisite for being able to incrementally add new features to an OpenStack
    deployment is to have a set of test environments available to advance the features
    through. Cloud engineering teams should have a private environment where they
    can develop and test new features and another environment where end users can
    test features before they are rolled out to production cloud environments. Having
    multiple environments also allows new functionality to bake in, which allows cloud
    operators the ability to see what the logging, performance, and other impacts
    of a new feature will be. Instrumentation can also be developed and tested in
    the lower environments.


    New features or capabilities should be introduced incrementally into the platform.
    In the planning stage, use cases for the capabilities should be defined and test
    cases should be written. These new features and capabilities should also be tested
    and deployed in the same manner as code; first in test environments, then into
    production. As the features are deployed into lower environments, documentation
    should be updated and test cases for the capabilities should be added to the monitoring
    regimen. A simple way to test these new capabilities is to write an example Heat
    orchestration template that exercises them. For example, adding the provisioning
    of a database to an existing application stack that is already being deployed
    by Heat. This template can then also be provided to application teams as documentation
    for the service.


    # Releasing new versions


    One of the most discussed and criticised aspects of OpenStack has always been
    the major version upgrade procedure. On the upside though, it''s also one of the
    most thoroughly documented and tested aspects of the project. Each major component
    of OpenStack provides an upgrade path between releases and most of them support
    rolling upgrades at this point. Much work has been done to de couple the API versions
    of the various services to ensure that services can be updated one at a time without
    downtime. The truth is, though, that it''s hard to upgrade an operating private
    cloud. Users of private clouds expect their workloads to be continuously available.
    As such, many of the OpenStack adopters that we''ve worked with have been reluctant
    to update their clouds once they''re in production.'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'While deploying a release of OpenStack and then running it for a few years
    is certainly possible (commercial vendors such as Red Hat provide support for
    up to three years for a given release of OpenStack), we certainly don''t recommend
    it. Organizations who deployed the Icehouse release of OpenStack and have run
    it for a couple of years will end up re-engineering much of their configuration
    management and deployment processes for the Newton release. This work takes a
    lot of time and effort. Organizations who have stepped through the releases or
    have deployed a new release every calendar year will have a much smaller amount
    of change to manage when the new version does come out.


    Incremental change has a smaller impact on the developer community as well. As
    we mentioned previously, continually improving and updating your Infrastructure
    as a Service will keep the community engaged and eliminate the need to retrain
    them every time a new platform is released.


    # Summary


    In this book, we''ve walked through the major areas of focus in the emerging practice
    of a Cloud Architect as it pertains to OpenStack. We''ve shown you some techniques
    and recommendations to enable you to work with company stakeholders and provide
    architectural leadership in order to create a holistic design for OpenStack in
    an enterprise. Successfully designing, deploying, and operating OpenStack clouds
    requires a wide breadth of knowledge in the fields of compute, network, storage,
    and software design. It also takes a deep understanding of a company''s strategic
    mission, processes, and success criteria for implementing a private cloud. Successful
    Cloud Architects leverage the knowledge and practice of subject matter experts
    in deep technical areas in conjunction with their own knowledge when designing
    OpenStack clouds. This book was written to provide a framework that an Architect
    could use to create a successful OpenStack deployment in concert with the rest
    of an enterprise using modern software development methodologies. While this book
    provides a solid foundation for OpenStack architecture, we hope it has given you
    the tools and confidence to begin your own journey into OpenStack architectural
    design.


    # References


    OpenStack projects – http://governance.openstack.org/reference/projects/'
  merge: -1
  img_proc: true
