  md: "# # About the Authors\n\n**Michael Solberg**, as a chief architect, is responsible\
    \ for helping Red Hat customers achieve their key business transformation initiatives\
    \ through open source architectures and technologies. He regularly advises a range\
    \ of Fortune 100 companies in financial services, healthcare, retail, and transportation\
    \ verticals on topics such as cloud computing, big data, high-performance computing,\
    \ and enterprise middleware. At Red Hat since 2008, Michael has led a number of\
    \ successful initiatives to assist strategic customers adopt new virtualization,\
    \ systems management, and engineering practices. His previous experience includes\
    \ building web hosting infrastructure. He is also an avid supporter of the OpenStack\
    \ project. Michael holds a Bachelor's degree from the University of Georgia and\
    \ is a regular speaker at industry events.\n\n> > I would like to thank Kyle Gonzales\
    \ and Brent Holden for their early work on the project.  \n> > Huge thanks to\
    \ Joseph Scalia for reviewing the book and continually encouraging me to work\
    \ on the project.\n\n**Ben Silverman**, as the Principal Cloud Architect for OnX\
    \ Enterprise Solutions, is responsible for providing strategic and tactical cloud\
    \ leadership to OnX’s customers. Previously, Ben was a Senior Cloud Architect\
    \ at Mirantis, where he developed cloud solutions for many Fortune 100 companies.\
    \ Ben has been involved with OpenStack since the Havana release and is an active\
    \ technical contributor. Prior to working for Mirantis, Ben was the Lead Technical\
    \ Architect at American Express, where he built one of the largest financial services\
    \ OpenStack clouds at that time. Ben is an exuberant OpenStack evangelist who\
    \ is often seen speaking at industry events and conventions about OpenStack adoption,\
    \ scale challenges, and cloud operations. In his limited spare time, Ben and a\
    \ few others have taken on the task of re-writing all of the OpenStack architecture\
    \ and operations guides that are currently available on the OpenStack Foundation\
    \ website. Ben has a Master’s degree in Information Management from Arizona State\
    \ University and lives in Phoenix, AZ.\n\n> > I would like to thank my wife, Jennifer,\
    \ and my two sons, Jason and Brayden, for all of the love and encouragement, as\
    \ well as the necessary interruptions to make me smile with a hug, a kiss, a silly\
    \ comment, or a new drawing for daddy’s desk."
