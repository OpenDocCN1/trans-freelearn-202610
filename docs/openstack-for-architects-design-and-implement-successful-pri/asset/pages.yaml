  md: "```\n} ]\n}\n}\n}\n}, headers=headers)\n```\n\nHeat performs the name-to-ID\
    \ translations for us, so we don't need to look up the reference for the flavor,\
    \ image, key, or network. The response to the call contains the status code (201\
    \ is success) and a link to the (stack.json()['stack']['links'][0]['href']) stack\
    \ object. The Heat API exposes an actions link similar to the Compute API. Stacks\
    \ may be suspended and resumed via that mechanism.\n\nPerhaps the most important\
    \ feature of the Heat API, though, is the ability to reference an external template.\
    \ To use this feature, use the template_url attribute instead of specifying a\
    \ template. Observe the following example:\n\n```\nstack = requests.post(\"%s/stacks\"\
    \ % (heat_endpoint,), json={\n  \"stack_name\": \"new_server\",\n  \"template_url\"\
    : \"http://www.example.com/heat-templates/new_server.yaml\"\n}, headers=headers)\n\
    ```\n\nThe templates can then be separated from the provisioning code. This allows\
    \ them to reside in separate version control repositories and allows different\
    \ teams to work on the catalog and the provisioning logic out of step.\n\nAlmost\
    \ every object that can be created via the OpenStack APIs can be orchestrated\
    \ using Heat. For more information on heat templates, refer to the Heat Template\
    \ Guide at http://docs.openstack.org/developer/heat/template_guide/.\n\n# Metering\
    \ and billing\n\nWhether you're building a public cloud or a private cloud, one\
    \ of the most critical capabilities of the system is tracking the usage of the\
    \ virtual objects that are provisioned by the users or tenants. Usage in OpenStack\
    \ is tracked largely in the same way it is in Amazon Web Services. For compute\
    \ resources, the system tracks when a particular instance was started and when\
    \ it was terminated. The cost of a compute resource is associated with the number\
    \ of CPU cores or the amount of memory in the flavor associated with the instance.\
    \ Some organizations may also associate a cost with the image as well."
  merge: -1
  img_proc: true
- pgno: 153
  md: 'For example, an instantiation of a Red Hat Enterprise Linux image may cost
    a certain number of cents per hour, whereas an instantiation of a Microsoft Windows
    image may cost something different. Other resources may be billed based on when
    they''re provisioned regardless of use. For example, a tenant might be charged
    for how long a floating IP was assigned to the project, regardless of whether
    it was attached to an instance. Cinder volumes are frequently treated this way.


    Whether your organization intends to charge your customers based on consumption
    or your organization intends to just show your customers their consumption, there
    are a few different strategies for tracking and reporting usage data. Some organizations
    that provision resources onto OpenStack via the API by a service catalog choose
    to use the service catalog implementation as the system of record. This helps
    maintain consistency for the user. For example, if they''ve provisioned a three
    tier-application, they probably want to be billed for a three-tier application
    and not for three virtual machines, a Cinder volume, and a floating IP. For PaaS
    or Continuous Integration use cases, though, the total amount of compute and storage
    used over a period of time is probably more important.


    There are a few basic approaches to tracking usage in OpenStack. Systems can listen
    for events on the message bus or query Ceilometer for them and then extrapolate
    usage data. Systems can also query Ceilometer directly for usage data. Each of
    these approaches is also useful for other use cases than metering and billing
    and some are better suited than others for each of them. For example, listening
    and timing events can offer great insights into the performance of a system. Also,
    compliance workflows may be driven by certain events within the OpenStack system.


    # Listening to OpenStack


    There are two modes of internal communication in the OpenStack system. The first
    is to GET or POST to the REST API and the second is to pull and push messages
    onto the message queue. Each of the services uses a combination of each; when
    the Nova API gets a request to provision a resource over the REST API, it passes
    that request along to the compute nodes via the message bus. They send back usage
    data over the bus, but they use the API to communicate with other services. These
    two modes of communication are also available for integration. Just as we can
    provision resources using the REST API, we can track their progress using the
    message bus.'
  merge: -1
  img_proc: true
- pgno: 154
  md: "The following code example uses the Kombu library in Python to attach to the\
    \ Nova queue on the message bus to listen for these RPC calls between the various\
    \ Nova services. First, we define a callback method to be used to process events\
    \ on the bus. This simple method just prints the body of the message:\n\n```\n\
    from kombu import Connection, Exchange, Queue\n\ndef process_message(body, message):\n\
    \    print body\n    message.ack()\n```\n\nThen we create a queue named listener\
    \ and bind it to the nova exchange. In the following example, we're going to subscribe\
    \ to all messages on the nova queue:\n\n```\nnova_exchange = Exchange('nova',\
    \ 'topic', durable=False)\nnova_queue   = Queue('listener', exchange = nova_exchange,\n\
    routing_key='#')\nconn = Connection('amqp://guest:guest@192.168.0.10//')\nconsumer\
    \ = conn.Consumer(nova_queue, callbacks=[process_message])\nconsumer.consume()\n\
    ```\n\nNote that the connection string is specific to the deployment in question.\
    \ The username and password for the message bus should align with the settings\
    \ in /etc/nova/nova.conf.\n\nFinally, we'll check the queue for messages and process\
    \ them:\n\n```\nwhile True:\n    conn.drain_events()\n```\n\nRunning this example\
    \ will show just how chatty the Nova services are. The message format for these\
    \ RPC messages is well defined, but the content of the messages is version-specific.\
    \ For these reasons, most developers will choose to use the notification subsystem\
    \ instead.\n\n# Using the notification subsystem\n\nEach of the OpenStack services\
    \ can be configured to emit notifications on the message bus. These notifications\
    \ can then be picked up by messaging clients or by the Ceilometer service. Notifications\
    \ were originally implemented by each service separately, but the functionality\
    \ has been folded into the Oslo Messaging library as a common interface."
  merge: -1
  img_proc: true
- pgno: 155
  md: "# Integrating the Platform\n\nTo enable notification in Nova, the following\
    \ settings need to be changed in `/etc/nova/nova.conf`:\n\n| nova.conf Setting\
    \ | Example value | Description |\n|---|---|---|\n| `instance_usage_audit` | `true`\
    \ | Turns on usage auditing |\n| `instance_usage_audit_period` | `hour` | Sets\
    \ usage auditing to hourly |\n| `notify_on_state_change` | `vm_and_task_state`\
    \ | Tells Nova to send a notification when a VM's state changes |\n| `notification_driver`\
    \ | `messagingv2` | Tells Nova to send notifications to the message bus |\n\n\
    Other notification drivers are available as well. Notifications can be sent to\
    \ syslog, for example. For more information, refer to the Oslo Messaging FAQ at\
    \ `http://docs.openstack.org/developer/oslo.messaging/FAQ.html`.\n\nA simple client\
    \ that can listen to these Notification events is provided here:\n\n```\n```python\n\
    #!/usr/bin/env python\n\nfrom kombu import Connection, Exchange, Queue\n\ndef\
    \ process_message(body, message):\n    print body\n    message.ack()\n\nnova_exchange\
    \ = Exchange('nova', 'topic', durable=False)\nnotifications_queue = Queue('notification-listener',\
    \ exchange = nova_exchange, routing_key='notifications.info')\nconn = Connection('amqp://guest:guest@192.168.0.10/')\n\
    consumer = conn.Consumer(notifications_queue, callbacks=[process_message])\nconsumer.consume()\n\
    \nwhile True:\n    conn.drain_events()\n```\n```\n\nThis example creates a queue\
    \ named `notification-listener`, which is bound to the `nova` exchange. Instead\
    \ of listening to all events on the exchange, though, we subscribe to the `notifications.info`\
    \ topic. This ensures that we receive only the messages that are designated as\
    \ notifications by the Nova service."
  merge: -1
  img_proc: true
- pgno: 156
  md: "A higher level abstraction, which can be used by Python programmers who are\
    \ interacting with OpenStack, can be found in the oslo.messaging library. Documentation\
    \ on this approach is available at http://docs.openstack.org/developer/oslo.messaging/notification_listener.html.\
    \ Another option is to use the Yagi library (https://github.com/rackerlabs/yagi),\
    \ which is in turn used by Stack Tach from Rackspace (https://github.com/openstack/stacktach).\n\
    \n# Consuming events from Ceilometer\n\nConsuming events from the message queue\
    \ allows for a push-style integration model in the OpenStack environment. Writing\
    \ and maintaining a daemon to consume events from the queue and act on them can\
    \ be onerous for many organizations, though. A much simpler option is to poll\
    \ the Ceilometer interface for events over the REST API. Given that Nova (as well\
    \ as other services) is configured to emit notifications over the message bus,\
    \ the Ceilometer service can store them and make them available for polling. To\
    \ enable this functionality, set store_events to True in /etc/ceilometer/ceilometer.conf.\n\
    \nThe following example shows how to retrieve events from Ceilometer using the\
    \ Python requests library:\n\n+   1. First, we begin by retrieving a token from\
    \ Keystone:\n\n```\nimport requests #http://docs.python-requests.org/en/latest\n\
    import json\n\nKEYSTONE_URL = 'http://controller01:5000/v2.0/'\nTENANT       =\
    \ 'demo'\nUSERNAME     = 'demo'\nPASSWORD     = 'secret'\n\nr = requests.post(\"\
    %%/tokens%%\" (KEYSTONE_URL,), json={\n  \"auth\": {\n    \"tenantName\": TENANT,\n\
    \    \"passwordCredentials\": {\n      \"username\": USERNAME,\n      \"password\"\
    : PASSWORD,\n    }\n  }\n})\nif r.ok:\n    token = r.json()['access']['token']['id']\n\
    else:\n    raise Exception(r.text)\n```"
