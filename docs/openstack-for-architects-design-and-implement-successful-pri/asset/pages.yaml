- pgno: 81
  md: '# 4


    # Building the Deployment Pipeline


    We often tell customers we work with that OpenStack is not **installed**, it is
    **deployed**. While the difference in words might seem subtle, it can really be
    a revolutionary change within an organization. Most enterprise infrastructure
    teams are used to the following process in the deployment of a new infrastructure
    platform:


    +   1. Install the platform.

    +   2. Configure and integrate the platform.

    +   3. Run the platform.

    +   4. Upgrade the platform.


    Installing and configuring the platform can take months or years and once it''s
    installed, the platform is expected to run for years. Upgrades to the platform
    happen every 3 to 5 years and are large 6-12 month projects. Red Hat has structured
    the release of our Enterprise Linux operating system around these cycles – there
    were 3 years between the release of RHEL 5 and RHEL 6 and almost 4 years between
    RHEL 6 and RHEL 7. Each release is supported for 10 years and conservative infrastructure
    teams will wait at least a year after the release of a new version to start their
    6-12 month upgrade project.


    This kind of conservative approach to platform deployment has worked extremely
    well in the operating system, virtualization platform, and application platform
    space. However, if the most important business driver for your private cloud project
    is increased agility, you are unlikely to achieve your goal with a 12 month roll-out
    and a 5 year life cycle.'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'In this chapter, we''ll be looking at how OpenStack is typically deployed as
    application software, not as infrastructure software. We''ll build a simple deployment
    pipeline which uses Puppet to describe an OpenStack deployment, uses Jenkins an
    open source Continuous Integration (CI) tool to realize that deployment, and then
    runs unit tests to verify that the deployment meets our specifications. Throughout
    the chapter, we''ll talk about iterative development and how it applies to OpenStack
    deployments.


    # Dealing with Infrastructure as a Software


    A Vice President of Infrastructure at a large company once told us something like
    this, "I like hardware. My hardware hardly ever breaks. The software I deploy
    breaks all the time. When my data center becomes software, how will I ever have
    a stable platform?". While the same concern could (and probably should) have once
    been applied to virtualization, most organizations today are very comfortable
    with the idea of software pretending to be hardware. The software-defined data
    center is something a little more intimidating, though. While we''ve had software
    pretend to be a CPU for a long time, we''ve only had software pretend to be a
    storage array relatively recently. Also, when the storage array goes down, everything
    tends to come down with it.


    However, maybe the bigger question is around software constantly breaking on deployment.
    Indeed, the most successful OpenStack deployments that we''ve worked with have
    all adopted modern software development techniques to ensure that their software
    does not break on deployment.


    # Eating the elephant


    The first and most important concept that we will apply to our deployment process
    is that of iterative development. Instead of trying to tackle all of the requirements
    that we''ve identified in one deployment, we break it down into stories, assign
    them to two or three week sprints, and then implement them one by one. A sprint
    is a basic measure of development derived from the Scrum process and framework.
    A sprint is a timeboxed measure of effort that is planned and limited to a specific
    duration (two weeks is common). Not only does this allow us to limit the complexity
    of each release and focus on thoroughly testing each component, it also allows
    us to begin returning value to the business much sooner in the process. Workloads
    that only require a small feature set will be able to board the platform without
    waiting for a large release.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# Writing the tests first


    The second most important practice that we will pull from the software development
    world is that of test-driven development. We write the test that demonstrates
    the functionality we''re implementing first and then work on the deployment until
    the test passes. Once the feature has been implemented, the test then becomes
    part of the routine monitoring system for the platform.


    In our experience, if the tests aren''t written before the code, they are frequently
    not written. Every project runs out of time at some point and if the tests are
    the last thing on the list, they tend to get cut.


    # Always be deploying


    The benefits of continuous deployment have been well described for some time in
    the software development world, but they''re particularly applicable to OpenStack
    deployments. Lots of small, well-tested changes tend to cause much less disruption
    to a complex environment such as a private cloud deployment than a few, huge well-tested
    changes.


    There are some exceptions to this, though. For example, moving from Nova Networking
    to Neutron is a major change that cannot easily be broken up into smaller pieces.
    Adding a new Cinder driver is a small iterative change, but changing from one
    Cinder driver to another can be a massive change in environments with large numbers
    of volumes to migrate. Care should be taken when making architectural decisions
    to try to avoid large changes to the platform that cannot be iteratively developed
    and deployed.


    # Using configuration management for deployment


    The first tool required to begin deploying our platform-like code is to introduce
    a configuration management system. While it is certainly possible to automate
    the deployment of OpenStack using shell scripts (we''ve seen it done), using a
    declarative configuration management tool makes it much more simple for your team
    to track changes between iterations. Also, an OpenStack configuration can contain
    hundreds of variables that need to be set across several configuration files on
    dozens of hosts. For example, our lab deployment of Kilo has 137 parameters set
    in the composition layer. Managing this level of complexity with shell scripts
    introduces another unnecessary level of complexity.'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'Every OpenStack user survey for the past couple of years has asked the community
    how they typically deploy OpenStack. While a wide variety of methods are represented
    in the results, the clear leader has been Puppet for some time now. A new initiative
    in the community has grown up around Ansible in the last year and its use has
    increased dramatically. A few prominent OpenStack users also use Chef for deployment.
    Our recommendation is to use the tool that your organization has the most experience
    with. Some of the groups that we’ve worked with already had large implementations
    of Puppet, some of them had expertise in Chef, and some prefer to use Ansible.
    We’ve also worked on projects which leveraged Salt. A new trend that is emerging
    is to use a combination of tools. You might have Ansible or Salt initiate Puppet
    runs on your hosts, for example. Puppet is most frequently used and we’ll use
    it in the examples in this chapter.


    # Using the community modules


    Each of the configuration management systems referenced earlier has a set of modules
    for deploying OpenStack that are written and maintained by the OpenStack community.
    For example, consider the following table:


    | Orchestration tool''s OpenStack modules | Location |

    |---|---|

    | Puppet modules | https://wiki.openstack.org/wiki/Puppet |

    | Ansible playbooks | https://wiki.openstack.org/wiki/OpenStackAnsible |

    | Chef cookbooks | https://wiki.openstack.org/wiki/Chef |


    Regardless of the technology used, the overall approach is the same.


    A deployment starts with the creation of what we’ll refer to as the **composition
    layer**. This is a Puppet module (or Ansible playbook or Chef cookbook) which
    defines the roles that we want the systems in our deployment to take in terms
    of the community modules. For example, we might define a compute role as a class
    which would include the `nova::compute` class. The controller role would include
    the `keystone, glance, nova::api`, and other classes. We may also pull in other
    Puppet modules to configure system services such as NTP or to install monitoring
    agents.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# Assigning roles


    Once we''ve declared our roles in the composition layer, we need a mechanism via
    which we apply them to systems. The tool that we''ve been using up to this point
    (Packstack) does this over SSH – it generates a set of puppet manifests which
    include the community modules and then it applies them to the systems in our lab
    one by one. It supports two roles: the controller role and the compute role. Our
    lab deployment currently has controller and compute nodes, but we''ll also be
    defining database nodes which can run the database and messaging services.


    Many of the organizations that we''ve worked with have used Cobbler (http://cobbler.github.io),
    Foreman (http://theforeman.org), Puppet Enterprise (https://puppetlabs.com/puppet/puppet-enterprise),
    or some other tool to assign roles to systems. These tools are referred to as
    External Node Classifiers (ENC) for Puppet. With an ENC it''s easy to separate
    the configuration parameters, such as IP addresses or passwords, from the configuration
    itself in the system. These tools can also provide reporting on Puppet runs and
    management functionality.


    In this chapter, we''ll set up a simple Puppet master which will manage the configuration
    of the hosts in our environment. We''ll store configuration data in our composition
    layer, acknowledging that it''s not a best practice.


    ![](img/2f752555f69992669defa8b25e6dcee9_85_0.png)


    There is one customer we''ve worked with who preferred to store configuration
    data in the composition layer. Their reasoning was that inputting the configuration
    data was the most common place for a typo or other mistake that would wreck an
    automated deployment. Since they were tracking the data in version control, it
    was easier to track these manual errors. The process that they came up with was
    to fork a branch for each environment that they deployed and then pull configuration
    changes down to the branches from the master as they needed to update them. Forking
    typically happens when developers take a copy of source code from a project such
    as OpenStack and start adding their own changes. Since the main source code for
    a project is called the trunk, when a developer changes a part of the code, it
    is said that the developer has created a branch.


    We''ll assign the roles we''ve defined to the hosts on the Puppet master and when
    hosts check in with the master, they''ll be given the configuration which matches
    their role. Hosts check in periodically after the first run and will pull updates
    to the configuration as we make them available on the master.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# # Choosing a starting point


    Each of the official OpenStack Puppet, Chef, and Ansible projects listed earlier
    provide example composition layers which will do a simple all-in-one deployment.
    The Puppet all-in-one deployment manifest is available at `https://github.com/openstack/puppet-openstack-integration`.
    It provides three scenarios, which can be used as a starting point. Different
    OpenStack vendors may also have references which make good starting points. Some
    organizations we''ve worked with have hired consulting firms to write their initial
    composition layer and then teach them how to iterate on it.


    Since we already have a working deployment using Packstack, we''ll use that as
    a basis for our composition layer. As we add features to our deployment, we''ll
    copy in pieces from the manifests generated by Packstack as a starting point.
    We''ll also add some new Puppet code to extend the deployment beyond what''s possible
    with Packstack.


    # # Test infrastructure


    Regardless of the configuration management system that your organization decides
    to use to deploy and configure the OpenStack software, it is critical that the
    deployment process is driven by the test infrastructure. It has been our experience
    that manually administrated environments always result in inconsistency, regardless
    of the skill of the operator performing the deployment. Automated deployments
    cannot happen in a vacuum; however, for them to be successful they need to provide
    immediate feedback to the developer and operator so that they can decide whether
    or not the deployment was successful. We''ve been through a lot of manual deployments
    and manual acceptance tests of OpenStack and the cycles can take days or weeks
    to complete.


    # # Types of testing


    There are several stages of testing that are applied to the changes in the composition
    layer before they''re applied to the environment. At each stage, the deployment
    is stopped if the tests fail. We refer to this set of stages as the **deployment
    pipeline**. Changes are committed to version control on one end of the pipeline
    and the configuration is realized in the infrastructure on the other end.'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# Building the Deployment Pipeline


    The following table lists the items which are tested at each stage in the pipeline:


    | Stage | Test focus |

    |---|---|

    | Pre-commit | Before the change enters the pipeline, it is tested to ensure that
    there are no syntax errors or style issues. |

    | Deployment testing | At this stage, each of the systems in the test cluster
    attempts to apply the configuration update. Success is indicated by whether or
    not the change is applied without errors. Some deployments will initiate a second
    application to test for idempotency. |

    | Integration testing | Once the test cluster has successfully applied the configuration,
    a unit test suite is run against the OpenStack APIs, verifying the functionality
    of the configuration. |

    | Performance testing | A series of tests are run against the test cluster to
    ensure that the change did not adversely affect performance. |

    | Acceptance testing | At this stage in the pipeline, any manual testing is performed.
    The change is then promoted to the next environment. |

    | Canary testing | A subset of the production environment is updated with the
    change and automated and the acceptance testing is repeated with the production
    database and hypervisors. |

    | Release | The entire production environment is updated with the change. |


    Many organizations will want to include a code review in the deployment process.
    This is typically done after all automated testing is complete so that the results
    are available to the reviewer. Tools such as Gerrit (https://www.gerritcodereview.com/)
    are available to orchestrate build pipelines which have code review requirements.
    Many organizations will prefer to perform canary testing and production releases
    manually – these should still be automated processes which are initiated (and
    rolled back) at the discretion of operators.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# Writing the tests


    OpenStack is entirely driven by the REST API and it is possible to write tests
    for the platform in any language which has a HTTP client implementation. There
    are software development kits available at http://developer.openstack.org for
    most of the popular languages. That said, most organizations tend to write their
    tests in Python (the language OpenStack is written in). There are two schools
    of thought on this. The first is that it is easier to attract OpenStack talent
    who know Python and the skill is transferable between testing and development.
    Also, there is an upstream Python project called Tempest, which many organizations
    use as a framework for running their own tests. The second school of thought is
    that organizations should test the platform using the same interface that end
    users of the platform will use. For example, if your intention is for the infrastructure
    to be provisioned from a Cloud Management Platform or a PaaS using the Ruby Fog
    library (http://fog.io/), then your tests should be written using the Fog library.


    Either way, Tempest is almost always used in some part of the testing process
    for OpenStack deployments. If nothing else, all public clouds which advertise
    themselves as OpenStack clouds must pass a minimum set of Tempest tests to achieve
    certification with the Foundation.


    # Running the tests


    As we mentioned earlier, the test infrastructure should drive the changes through
    the pipeline, capturing the results of each test run and promoting changes when
    the runs are successful. Any of the many CI tools used for software development
    can be used for this purpose. What we typically recommend is to leverage the CI
    tools and software repositories that your organization is already using. If your
    organization isn''t doing CI in your software development group, good choices
    that we''ve seen used successfully before are Jenkins (https://jenkins-ci.org/),
    Atlassian''s Bamboo (https://www.atlassian.com/software/bamboo/), or Buildbot
    (http://buildbot.net/). The OpenStack Foundation''s CI is built around Jenkins
    and that''s the tool that we''ll use in this chapter to build our pipeline.


    # Putting the pipeline together


    Now that we''ve described the different components of the deployment pipeline,
    let''s assemble an example pipeline in our lab environment. We''ll start by setting
    up the CI server, creating a new composition layer, writing a unit test, and then
    deploying the OpenStack infrastructure to pass the test.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# Setting up the CI server


    In previous chapters, we deployed OpenStack by running the `packstack` utility
    from the cloud controller. In this section, we''ll be setting up a dedicated machine
    to do our deployments. The requirements for our deployment machine are not too
    strenuous – any machine running CentOS 7 with 2 GB of RAM or more should suffice.
    The only network requirements are that the machine is reachable from both the
    intranet and from the OpenStack cluster itself.


    # Installing Git


    The following instructions will set up a Git version control server on the CI
    server. If you already have access to a Git repository or prefer to use GitHub
    you can skip this section. For more information on setting up a Git server, refer
    to the *Pro Git* book by *Scott Chacon* and *Ben Straub*, available on the Internet
    at https://git-scm.com/book/en/v2/.


    To install the Apache HTTP server and the Git version control software, execute
    the following steps:


    +   1. Execute the following command as root on the CI server:

    +   ```

    +   # yum install -y httpd git

    +   ```

    +   2. Verify that the packages were correctly installed:

    +   ```

    +   # rpm -q httpd git

    +   ```

    +   3. Create a top-level directory to hold our repository:

    +   ```

    +   # mkdir /var/www/html/git

    +   ```

    +   4. Create the Git repository in the directory with the following commands:

    +   ```

    +   # mkdir /var/www/html/git/openstack/

    +   # cd /var/www/html/git/openstack

    +   # git --bare init

    +   # git update-server-info

    +   ```

    +   5. You should see the following response after the `git --bare init` command:

    +   ```

    +   Initialized empty Git repository in

    +   /var/www/git/openstack/

    +   ```'
  merge: -1
  img_proc: true
- pgno: 90
  md: "6. Reset permissions on the new Git repository for Apache:\n\n```\n# chown\
    \ -R apache:apache /var/www/html/git/\n```\n\n7. Finally, create a configuration\
    \ file which requires authentication for the Git repository. The following example\
    \ can be copied to /etc/httpd/conf.d/git.conf:\n\n```\n<Directory /var/www/html/git/>\n\
    \    DAV on\n\n    AuthName \"Git login:\"\n    AuthType Basic\n    AuthUserFile\
    \ /var/www/htpasswd\n\n    # Allow anonymous clone, but require auth for push.\n\
    \    <LimitExcept GET PROPFIND>\n        Require valid-user\n    </LimitExcept>\n\
    </Directory>\n```\n\n8. Create a user account for us to use for the repository:\n\
    \n```\n# htpasswd -c /var/www/htpasswd git\n```\n\n9. Last, restart the httpd\
    \ server:\n\n```\n# systemctl restart httpd\n```\n\n10. You should now be able\
    \ to clone the Git repository using the following command:\n\n```\n# git clone\
    \ http://git@localhost/git/openstack\n```\n\n11. You may be prompted for the password\
    \ that you entered when creating the user account and you should receive the following\
    \ message:\n\n```\nwarning: You appear to have cloned an empty repository.\n```"
  merge: -1
