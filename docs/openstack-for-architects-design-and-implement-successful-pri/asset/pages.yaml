- pgno: 111
  md: '# 5


    # Building to Operate


    A lot of OpenStack administrators are familiar with more established virtualization
    platforms. They’re familiar with preinstalled operations tools that will allow
    an administrator to simply point, click, and configure a fully robust infrastructure
    monitoring the solution in minutes. Unfortunately, OpenStack is not quite that
    simple. This doesn’t mean it’s inferior; quite the contrary, it’s very flexible,
    and allows administrators to choose their own tools and configure them in a way
    that best suits the needs of the company or organization.


    In this chapter, we will discuss day-2 operations, or in other words, what happens
    after the OpenStack cloud has been built, tested, and is operationally ready.
    It is at this point that the cloud is ready for onboard users and workloads.


    # Expected outcomes of this chapter


    This chapter sets out to achieve the following:


    +   - A critical insight into what is really important to monitor in an OpenStack
    cloud.

    +   - A set of best practices to implement in a monitoring system. We will provide
    some example specifications to get you started and allow you to adjust them to
    meet your enterprise operation needs.

    +   - Recommendations based on real-life examples of how to do effective capacity
    planning in an elastic cloud environment such as OpenStack.

    +   - A broad understanding of some of the tools used in OpenStack operations,
    both open source and commercial.'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# Logging, monitoring, and alerting


    One of the most important aspects of operating an OpenStack cloud is logging,
    monitoring and alerting (LMA). Since OpenStack isn’t your legacy bare metal based
    infrastructure platform it requires a different approach. The traditional LMA
    methods tend to fall short when considering the scale and elasticity of an OpenStack
    environment. Additionally, the old binary methods of alerting “this service is
    down”, “the resource is at 95%”, or even “file system full” messages do not deliver
    the depth of operational information really required to know the health of an
    OpenStack cloud.


    While there are many different tools to actually monitor log events and create
    alerts from the systems that run the OpenStack infrastructure, in this chapter,
    we will focus more on the architectural principles that will help you choose logging,
    monitoring, and alerting tools.


    No matter what is used to do the logging, monitoring, and alerting, from an architectural
    standpoint, the solution should cover the following requirements:


    +   - Provide real-time, or near real-time introspection and alerting into the
    OpenStack infrastructure

    +   - Support some sort of discovery and configuration management

    +   - Be scalable to support enterprise clouds

    +   - Have the ability to self-monitor and the ability to be configured as highly
    available


    # Logging


    An essential source of operational data for an OpenStack cloud is logs. Not only
    are the logs of host operating systems available, but each project running as
    a part of OpenStack has a separate log. However, even though they are separate,
    it’s recommended that all logs be sent to syslog under the same syslog log level
    as a starting point and modified if needed.


    The following is an example of a successful operation in an OpenStack log entry
    from nova-api.log:


    ```

    2016-07-08 07:36:45.613 3474 INFO nova.osapi_compute.wsgi.server [req-b5ff3321-19cc-4ce8-af9c-0ed59ae21ac7
    f32900acc09d4898b091b2caa4900112 6f0117ddd81b4dc78a8f4ce4dd5b04f5 - -] 10.0.3.15
    "GET /v2/6f0117ddd81b4dc78a8f4ce4dd5b04f5/flavors/1 HTTP/1.1" status: 200 len:
    613 time: 0.1168451

    ```'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'For security and analysis, logs should be sent to a remote centralized syslog
    server. Ideally, this server will be where the log introspection, analytics, and
    cataloging will be done, and it should be hosted on a server with appropriate
    CPU and memory to support these workloads. Log introspection would be done on
    the content of the log entries as these logs can contain some, or all of the following
    (example based on the preceding log):


    +   - Severity levels (`INFO`)

    +   - The server that sent the log (`10.0.3.15`)

    +   - The service that sent the log (`nova.osapi_compute.wsgi.server`)

    +   - Metadata such as `tenant_id` and `request_id` (`6f0117ddd81b4dc78a8f4c4ed5b04f5`
    and `req-b5ff3321-19cc-4ce8-af9c-0ed59ae21ac7`)

    +   - Error codes from the service, and even performance data such as HTTP response
    times (involving limited usability for asynchronous connections due to the segmented
    nature of create requests and API interactions)


    Here is what an error would look like:


    ```

    nova-scheduler.log:2016-07-08 07:26:48.687 1159 ERROR

    oslo.messaging._drivers.impl_rabbit [req-

    c419cec6-9847-4692-8c61-733524097546 -- -

    --] AMQP server on 10.0.3.15:5672 is unreachable: [Errno 111] ECONNREFUSED.

    Trying

    again in 4 seconds

    ```


    As we can see above, this is a structured log file that can be parsed by many
    different tools to extract the severity, service, timestamp, and other relevant
    metadata. Furthermore, this data could be searched with open source analysis tools
    such as **ELK (ElasticSearch, Logstash, and Kibana)**. Basic information about
    this industry standard data mining platform can be found at `https://www.elastic.co/webinars/introduction-elk-stack`.
    This page also includes a webinar to get you started.'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'This concept of using a log processing platform, search platform, graphic dashboard,
    and an alerting platform is also being used as the OpenStack infrastructure monitoring
    solution at many large commercial and research production clouds. For example,
    CERN and GoDaddy are both using ELK to provide visibility into their OpenStack
    clouds. CERN''s dashboard (http://openstack-in-production.blogspot.com/2013/10/log-handling-and-dashboards-in-cern.html)
    looks similar to this (it shows Nova API statistics):


    ![](img/2f752555f69992669defa8b25e6dcee9_114_0.png)


    Cern OpenStack Cloud Team, 2013


    However, not all solutions are ELK-based; Mirantis, for example, is distributing
    a product they call StackLight, which uses different log processing and formatting
    tools. It adds Grafana to the visual dashboard suite in addition to Kibana. Mirantis''
    solution also uses different components for log collection and adds InfluxDB as
    the database for time series data. StackLight incorporates Nagios Core into the
    monitoring platform to provide alerting. This stack of freeware applications is
    automatically configured as this monitoring platform and installed by a series
    of plugins (https://www.mirantis.com/validated-solution-integrations/fuel-plugins)
    to Fuel, Mirantis recently open sourced installer:'
  merge: -1
  img_proc: true
- pgno: 115
  md: '![](img/2f752555f69992669defa8b25e6dcee9_115_0.png)


    Similarly, there are other distributions that have their own opinionated monitoring
    platforms; however, despite their differences in choices of software, they all
    have similar architectures and provide similar functionality to our previous examples.
    They are, all based on the log analysis fundamentals discussed earlier in this
    chapter and provide useful tools that can visualize data.


    # Monitoring


    Many organizations struggle in the period between deployment and on-boarding of
    applications. Most of this struggle is due to a lack of understanding of how OpenStack
    cloud operations differ from a typical legacy platform. Many times, this is the
    hardest barrier to overcome since it requires some fundamental cultural shifts
    in the way engineering, operations, and developers interact with infrastructure,
    applications, and platforms.'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'While some of the practices we will cover in this section may transpose over
    to workload monitoring, this chapter is about operational monitoring of OpenStack
    infrastructure, not workloads running on OpenStack. Unlike OpenStack infrastructure,
    workloads running on the OpenStack cloud can be monitored by legacy platforms
    in many cases. There are many tools, both open source and commercial, that are
    purpose-built to monitor workloads running on OpenStack clouds but due to the
    broad availability of solutions in this sector we will not be covering that topic
    in this chapter. We will instead concentrate on infrastructure monitoring.


    # What to monitor


    In general, there are many categories of processes that support management by
    OpenStack. They are as follows:


    +   - Stateless services and OpenStack API endpoints such as `nova-api`, `glance-api`,
    and `keystone-api`, that receive user inputs.

    +   - OpenStack service workers connected to the message bus such as `nova-scheduler`,
    that receives and processes user requests from other processes such as those listed
    earlier.

    +   - Additional programs that are part of OpenStack and are not part of the actual
    codebase, but are more like enablers to the actual API layer, which provides services
    such as databases, replication, virtualization, and more. Some of these components
    are MySQL, RabbitMQ, Memcached, HAProxy, Corosync, and Pacemaker. Some of these
    elements are not in our Packstack environment since it is not a highly available
    environment; however, most production deployments by other distributions (Mirantis,
    Canonical, Red Hat, IBM, HP, and so on) have these or other similar tools to provide
    similar functions. We will briefly mention these tools as they relate to operations
    and monitoring later in the chapter.

    +   - The host operating system. In your installation, you may have installed
    RHEL or CentOS. Both of these options need to be monitored for the standard operating
    system, hardware, and capacity monitoring in order to ensure the base of our install,
    the node itself, is operating properly. This monitoring can be an agent, IPMI,
    SSH, or other interfaces depending on the monitoring platform.'
  merge: -1
  img_proc: true
