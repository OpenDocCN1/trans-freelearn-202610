- pgno: 177
  md: '# SELinux and sVirt in action


    The following instructions will allow you to check if SELinux is enforcing (active
    and protecting). Since in your lab you''re running CentOS 7, you should have SELinux
    installed and enforcing as well as all of the installed software to make sVirt
    work. We will show you how to set permissions on image files in order to protect
    your instances:


    +   1. Execute the following commands as root on the lab server:


    Normally, in an HA environment, you would execute this command on a compute node.


    ```

    # getenforce

    Enforcing

    ```


    Verify that the command responds with Enforcing.


    +   2. If, for some reason, it is any other answer, do the following and repeat
    the preceding command:


    ```

    # setenforce 1

    ```


    +   3. Now, check your id and your context:


    ```

    # id

    uid=0(root)  gid=0(root)  groups=0(root)

    context=unconfined_u:unconfined_r:unconfined_t:s0-s0:c0.c1023

    ```


    +   4. Now, let''s find the context for the instance running on the lab server:


    You should have at least one instance running, if you have more than one, pick
    the first one. If you don''t have any instances running, create an instance and
    repeat the command.


    ```

    # ps axZ | grep qemu-kvm


    system_u:system_r:svirt_tcg_t:s0:c55,c122 7480  ?

    Rl  0:10 /usr/libexec/qemu-kv -name instance-

    00000001

    -S -machine pc-i440fx-rhel7.0.0,accel=t cg,usb=off

    -m 512 -realtime mlock=off -smp

    1,sockets=1,cores=1,threads=1 -uuid b803b3ce-1570-

    ```'
  merge: -1
  img_proc: true
