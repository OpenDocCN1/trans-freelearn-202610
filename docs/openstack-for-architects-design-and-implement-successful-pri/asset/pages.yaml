- pgno: 36
  md: '# 2


    # Architecting the Cloud


    The array of possible hardware and software combinations that can be used to create
    an OpenStack cloud is pretty amazing at this point. A phrase we typically hear
    these days is that having an integration for OpenStack is “table stakes” for a
    hardware or software product coming in the market. As of the Liberty release of
    OpenStack (November 2015), there were over 50 Cinder storage drivers and 20 Neutron
    network drivers. These cover a wide range of products from traditional EMC storage
    arrays and Cisco switches to various software-defined storage and networking products.
    OpenStack supports a number of hypervisors and compute platforms ranging from
    commodity x86 hardware to IBM Z-series mainframes.


    Few of the decisions we make as architects affect the bottom line as much as hardware
    and software selection. While we approach the deployment of our cloud or the development
    of our software in an iterative fashion to reduce the risk of mistakes, it is
    typically very difficult to iteratively purchase hardware.


    Luckily, OpenStack ships with a set of reference plugins for each of the subsystems
    that we can use to mock out our cloud before purchasing actual hardware. For Cinder,
    the reference implementation involves using LVM and iSCSI on a Linux system. For
    Neutron, the reference implementation uses Open vSwitch and iptables on a Linux
    system. Even Compute can be mocked out using nested virtualization with KVM. The
    approach that we recommend is to begin an OpenStack project with the reference
    plugins until you get a feel of how the software and hardware will work together
    before making any large hardware or software purchases.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# # Picking an OpenStack distribution


    OpenStack is developed like most open source software projects. The code is available
    at `http://openstack.org` and can be downloaded in the package format from `http://tarballs.openstack.org`.
    As of the Liberty release of OpenStack, there were over 350 individual projects
    available for download. That''s a huge number of source repositories for an engineering
    team to sort through and manage. Hence the development of the OpenStack distributions.
    Most of the OpenStack distributions are put together by the same groups that put
    together Linux distributions. For example, the three major distributions available
    are part of the Ubuntu, openSUSE, and CentOS Linux distributions. Each of these
    distributions maintain installation guides, available at `http://docs.openstack.org`.
    There are also distributions available from companies such as HP, Mirantis, and
    Red Hat which are part of commercial support agreements. In addition to these
    options, there are also companies such as Platform9, which provide managed OpenStack
    deployments.


    # # Running from the trunk


    As we mentioned before, stable releases of OpenStack happen on a six-month cadence.
    Active development happens in the trunk of each of the software projects (the
    “master” branch on the web-based repository service for OpenStack at `http://git.openstack.org`).
    This master repository controls the distributed version control for the OpenStack
    project and aids in source code management. This is very similar to the well-known
    GitHub service used by many other open source projects. In addition to the Git
    repository, there are some number of stable branches corresponding to the six-month
    releases. Features are implemented in the master branch and bug fixes are backported
    from the trunk to the branches on an irregular basis.


    For most organizations, taking a packaged version of one of the stable branches
    and deploying it will suffice. There are a couple of reasons why this might not
    be appealing, though. For one, some organizations might find that too much change
    accumulates between the six-month releases and that there''s less risk in releasing
    more frequent and smaller changes from the trunk. While this makes sense with
    a lot of software projects, OpenStack is developed by a number of loosely coordinated
    teams and managing the dependencies between the development streams of each project
    is a complicated task. Automated testing on the trunk attempts to ensure that
    a change in Nova doesn''t break a feature in Neutron, but the bulk of manual integration
    testing happens for the coordinated stable releases.'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'While it''s possible that an organization may want to take all the changes
    from trunk before they make it down to the stable branches, it''s more likely
    that they''ll be interested in only one or two important features that haven''t
    made it to the branches. For example, many of the teams that we have worked with
    were interested in leveraging external IPAM systems similar to the one provided
    by Infoblox long before the feature was implemented in Neutron (in the Liberty
    release). We''ve seen other situations in which an organization wanted to pull
    in a Cinder driver for a new SAN device before it was accepted upstream. For these
    use cases, it makes more sense to start off with a packaged distribution of one
    of the stable branches and then create a custom package only for the component
    which has the desired feature backported to it from the trunk.


    # Community distributions


    After each stable release of OpenStack, the software from the resulting stable
    branches is packaged up by maintainers from three of the major community Linux
    distributions into the native format for their distribution. These distributions
    of OpenStack allow users of those distributions to install the software (and its
    dependencies) using the usual mechanism for that distribution. These distributors
    also provide documentation at `http://openstack.org` on how to install and configure
    the software on their particular distribution.


    Most organizations will choose a community distribution based on the Linux distribution
    that they''re the most comfortable with. For example, organizations which typically
    use the Ubuntu Linux distribution will use the Ubuntu OpenStack distribution as
    well. It''s worth noting that the community distributions of OpenStack will work
    with the commercially supported variants of both openSUSE and CentOS; it''s not
    uncommon for an organization to pay for support for Red Hat Enterprise Linux but
    to use the community-supported CentOS distribution of OpenStack (RDO).


    The choice of community distribution may also have an effect on the availability
    of installation mechanisms. For example, the Packstack installation tool that
    we used in *Chapter 1, Introducing OpenStack*, is specific to the CentOS distribution
    of OpenStack (RDO). The Ubuntu and openSUSE distributions have other tools for
    installing the OpenStack software. However, the Puppet, Chef, and Ansible mechanisms
    for deploying OpenStack are distribution (and operating system) agnostic. For
    example, it is possible to deploy OpenStack on the Ubuntu and CentOS distributions
    using the same Puppet modules.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# Commercially supported distributions


    While there are only three major community-supported distributions of OpenStack
    available, there are a myriad of commercially-supported distributions available.
    A list of these distributions and their certification status is available at http://openstack.org.
    Distributions which have passed specific load and performance-based Tempest tests
    are certified in the same way as managed service providers. Commercially-supported
    distributions are frequently based on the community-supported distributions. However,
    there are a few reasons that organizations prefer them to the community distributions.


    The first major driver is support. Most companies which provide support for OpenStack
    require the customer to use their commercially supported distribution so that
    they can ensure that the customer is using software which has passed through a
    certification and testing process. For example, Red Hat takes the packages from
    each RDO release and runs them through a detailed test plan before releasing them
    as Red Hat Enterprise Linux OpenStack platform. When a customer identifies an
    issue with a particular OpenStack component, Red Hat can add that issue to the
    test plan to prevent regressions in future releases. Additionally customers may
    choose different commercial distributions for ease of use, quality of support,
    or any additional software that may be included with the distribution; for example,
    Hewlett Packard Enterprise''s Helion OpenStack is bundled with a number of operational
    tools that may appeal to some customers. Mirantis OpenStack, while only an Information
    as a Service (IaaS) platform, has an installer that some customers may prefer
    over other distribution''s installers.


    Organizations may also choose a commercially-supported distribution over a community-supported
    distribution because the distribution has added functionality that hasn''t been
    released by the distributor as open source. For example, IBM has an OpenStack
    distribution within their IBM Cloud Manager offering. These enhancements tend
    to be aimed toward speeding the deployment of OpenStack clouds or improving the
    manageability of deployments with additional reporting and dashboards.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# Compute hardware considerations


    It''s certainly possible to deploy OpenStack on Power or Z series systems from
    IBM or Solaris systems from Oracle, but the vast majority of OpenStack deployments
    use Linux on 64-bit Intel systems. Selecting a hardware platform for compute infrastructure
    in OpenStack is similar to selecting a hardware platform for any other workload
    in the data center. Some organizations have a brand loyalty to a particular vendor
    based on reputation, past performance, or business arrangements and some organizations
    ask hardware vendors to bid on projects as they come up. A small number of organizations
    choose to assemble their own systems from components, but most OpenStack deployments
    use the same commodity systems that would be deployed to run any other Linux workload.


    With that said, we''ve definitely seen hardware configurations that work well
    with OpenStack and ones which had to be reconfigured after the fact. We''ll try
    to help you avoid that second purchase order in this section.


    # Hypervisor selection


    The majority of installations use either the Xen or KVM hypervisors, but there
    are a number of other hypervisors available for use with Nova. Both the Hyper-V
    and VMware hypervisors are supported as compute platforms. Bare-metal systems
    can be provisioned via Nova (Ironic project) and various drivers for containers
    have come and gone over the life of OpenStack. Running containers in OpenStack
    is a topic of great interest lately and the OpenStack Magnum project has emerged
    as the current favorite model for their deployment within OpenStack.


    Whether to pick the Xen or KVM hypervisor is almost a religious matter for some
    people. The KVM hypervisor is the most broadly used hypervisor on Linux and it
    has support for a wide range of advanced features such as PCI-passthrough, NUMA
    zone pinning, and live migration. Proponents of Xen will point out that performance
    on older hardware has traditionally been better with Xen. They will also point
    out that large cloud providers such as Amazon and Rackspace have picked the Xen
    hypervisor over the KVM hypervisor for their deployments. However, adoption continues
    to wane for the Xen hypervisor. Based on the 2016 OpenStack User Survey report,
    95% of OpenStack clouds are using KVM and only 4% are using Xen. KVM is the default
    and most widely used hypervisor, and unless your organization has a strong motivation
    to pick the Xen hypervisor, we strongly recommend that you use it over any other
    hypervisor.'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'A number of good arguments can be made for using VMware ESX as the hypervisor
    in OpenStack instead of KVM. Almost every large IT shop has a great deal of experience
    with ESX and vSphere and using ESX as the hypervisor for an OpenStack deployment
    can ease the barrier for entry to OpenStack for teams which don''t want to certify
    or train up on a new virtualization technology. ESX-based deployments are prescriptive-there
    is only one Cinder driver and one Neutron driver supported with ESX. From this
    perspective, choosing ESX allows an organization to focus on the integration and
    operational aspects of OpenStack without worrying too much about the architecture.


    The same reasons that make ESX a good choice for some organizations make it a
    poor choice for most organizations, though. The prescriptive approach limits available
    options in the storage and network space. One of the strongest aspects of OpenStack
    is the heterogeneity of the ecosystem and the ability to dynamically add new types
    of infrastructure under a common API. For this reason, we''ll be focusing our
    work in this book on the use of the KVM hypervisor. Most of the considerations
    we address in this section will also apply to the Xen hypervisor.


    # Sizing the hardware to match the workload


    As we mentioned at the start of this chapter, while an iterative approach for
    developing and deploying software is a best practice, an iterative approach for
    purchasing hardware has the potential to kill your private cloud initiative. It''s
    crucial to get the hardware right the first time so that you can line up the appropriate
    discounts from your hardware vendor and set the appropriate budget at the start
    of the project. Sizing is often difficult for these projects though, as it can
    be difficult to anticipate the requirements of the workload ahead of time. This
    is one of the reasons that it''s so important to get the application owners involved
    early in the project-they''ll be able to anticipate what their application requirements
    will be and that will inform the sizing process.


    The first step in the sizing process is to define standard instance sizes. These
    are referred to as flavors in the Nova parlance. Out of the box, Nova ships with
    a set of m1 flavors, which correspond roughly to Amazon EC2 instance types. A
    flavor has three prominent parameters, the number of virtual CPUs, the amount
    of memory, and the amount of ephemeral disk storage. Organizations typically define
    two or three flavors, based on anticipated workload. Three common flavors are
    the 1×2, 2×4, and 4×8 sizes, which refer to the number of vCPUs and gigabytes
    of memory. The ephemeral disk size is typically the same, regardless of CPU and
    memory configuration-it should equate to the expected size of a root disk of the
    organization''s standard Glance images. For example, a 2×4 with the Red Hat Enterprise
    Linux 7 qcow2 image would have two virtual CPUs, four gigabytes of memory, and
    a 20 gigabyte ephemeral disk.'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'Once the flavors have been defined, the next step is to determine the acceptable
    over-commit ratio for a given environment. Each of the major hardware vendors
    publishes virtual performance benchmark results that can be used as a starting
    point for this ratio. These benchmarks are available at http://spec.org/ in the
    **Virtualization** category. Working through these benchmarks, two simple rules
    emerge: never over-commit memory and always over-commit CPU up to 10 times. Following
    these rules allows you to determine the optimal amount of memory in a given piece
    of compute hardware. For example, a compute node with 36 physical cores can support
    up to 360 virtual cores of compute. If we use the preceding flavors, we’ll see
    a ratio of two gigabytes of RAM to each virtual core. The optimum amount of memory
    in this compute node would top out somewhere around 720 GB (2 GB x 10 x 36 cores).


    There’s typically a dramatic price difference in tiers of memory and it often
    makes sense to configure the system with less than the optimum amount of memory.
    Let’s assume that it is only economical to configure our 36 core compute node
    with 512 GB of memory. The next two items to consider are network bandwidth and
    available ephemeral storage. This is where it helps to understand the target workload.
    512 GB of memory would support 256 1×2 instances, 128 2×4 instances, or 64 4×8
    instances. That gives us a maximum ephemeral disk requirement between 1.2 and
    5 TB, assuming a 20 GB Glance image. That’s a pretty large discrepancy. If we
    feel confident that the bulk of our instances will be 2x4s, we can size for around
    128 instances, which gives us a requirement of 2.5 TB of disk for ephemeral storage.
    There’s some leeway in there as well-ephemeral storage is thin-provisioned with
    the KVM hypervisor and it’s unlikely that we’ll consume the full capacity. However,
    if we use persistent storage options such as Ceph, SAN, iSCSI, or NFS for image,
    instance or object storage, planning for capacity becomes more complicated. While
    determining your flavor CPU, memory, and ephemeral disk sizing, you will need
    to include persistent disk space for root volumes. If these volumes are stored
    on the same appliances/clusters as your glance and object storage, great care
    must be taken to ensure consistent elasticity.


    The last major item to consider when selecting compute hardware is the available
    bandwidth on the compute node. Most of the systems we work with today have two
    10 gigabit bonded interfaces dedicated to instance traffic. Dividing the available
    bandwidth by the number of anticipated instances allows us to determine whether
    an additional set of interfaces is required. Dividing 10 gigabits by 128 instances
    gives us roughly 75 megabits of available average bandwidth for each instance.
    This is more than sufficient for most web and database workloads.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# Considerations for performance-intensive workloads


    The guidelines given earlier work well for development, web, or database workloads.
    Some workloads, particularly Network Function Virtualization (NFV) workloads,
    have very specific performance requirements that need to be addressed in the hardware
    selection process. A few improvements to the scheduling of instances have recently
    been added to the Nova compute service in order to enable these workloads.


    ![](img/2f752555f69992669defa8b25e6dcee9_43_0.png)


    NFV is a new developing use case for OpenStack to be used to be the infrastructure
    for workloads that would replace dedicated network appliances. Routers, firewalls,
    proxy servers, and packet core devices are some of the common virtual network
    functions that are being replaced today. Not only does NFV reduce the physical
    hardware needed to operate telecommunication businesses but it also brings all
    of the benefits of cloud native application orchestration to a business case that
    has an increasing need for agility to supply consumers with services faster than
    ever.


    The first improvement allows for passing through a PCI device directly from the
    hardware into the instance. In standard OpenStack Neutron networking, packets
    traverse a set of bridges between the instance''s virtual interface and the actual
    network interface. The amount of overhead in this virtual networking is significant,
    as each packet consumes CPU resources each time it traverses an interface or switch.
    This performance overhead can be eliminated by allowing the virtual machine to
    have direct access to the network device via a technology called SR-IOV. SR-IOV
    allows a single network adapter to appear as multiple network adapters to the
    operating system. Each of these virtual network adapters (referred to as virtual
    functions, or VFs) can be directly associated with a virtual instance.


    The second improvement allows the Nova scheduler to specify the CPU and memory
    zone for an instance on a compute node which has Non-Uniform Memory Access (NUMA).
    In these NUMA systems, a certain amount of memory is located closer to a certain
    set of processor cores. A performance penalty occurs when processes access memory
    pages in a region which is nonadjacent. Another significant performance penalty
    occurs when processes move from one memory zone to another. To get around these
    performance penalties, the Nova scheduler has the ability to pin the virtual CPUs
    of an instance to physical cores in the underlying compute node. It also has the
    ability to restrict a virtual instance to a given memory region associated with
    those virtual CPUs, effectively constraining the instance to a specified NUMA
    zone.'
  merge: -1
  img_proc: true
