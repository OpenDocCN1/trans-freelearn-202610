  md: "Notice that we've kept the requirement relatively simple. We could have walked\
    \ through the whole call and response script leading up to the final call, but\
    \ that's really better served in the test implementation. We'll walk through how\
    \ to translate requirements into tests in the next section.\n\n# Testing requirements\n\
    \nIn Chapter 4, Building the Deployment Pipeline, we wrote some basic tests for\
    \ our OpenStack deployment using shell tools. In this section, we'll combine the\
    \ code examples discussed earlier in the chapter with the Python unittest library\
    \ to generate a set of automated tests that can be run from Jenkins to verify\
    \ our deployment. The following example, which uses the Python unittest and requests\
    \ libraries, is very simple, but can be used as a starting point:\n\n```\n#!/usr/bin/env\
    \ python\n\nimport unittest\nimport requests #http://docs.python-requests.org/en/latest\n\
    import json\n\nKEYSTONE_URL = 'http://controller01:5000/v2.0/'\nTENANT       =\
    \ 'demo'\nUSERNAME     = 'demo'\nPASSWORD     = 'secret'\n```\n\nOnce we've imported\
    \ the necessary libraries and set the global variables, we'll create a TestCase\
    \ object for our tests:\n\n```\nclass TestKeystone(unittest.TestCase):\n    \"\
    \"\"Set of Keystone-specific tests\"\"\"\n```\n\nAny function whose name begins\
    \ with test will be treated as a test to be run by the unittest library. We'll\
    \ define a function that exercises the REST call described in the first user story:\n\
    \n```\ndef test_001_get_token(self):\n    \"\"\"Requirement 001: Authorization\
    \ Token\"\"\"\n    r = requests.post(\"%s/tokens\"% (KEYSTONE_URL,), json={\n\
    \        \"auth\": {\n            \"tenantName\": TENANT,\n            \"passwordCredentials\"\
    : {\n                \"username\": USERNAME,\n                \"password\": PASSWORD,\n\
    \            }\n        }\n    }\n```"
